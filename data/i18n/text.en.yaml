  sensitive: Sensitive
  bold: Bold
  patient: Patient
  methodical: Methodical
  hardy: Hardy
  charismatic: Charismatic
  quiet: Quiet
  wanderer: Wanderer
  attached: Attached
  streetwise: Streetwise
  scholarly: Scholarly
  handy: Handy
  artistic: Artistic
  calm: Calm
  cosmopolitan: Worldly
  cheerful: Cheerful
  vigil: Night owl
  faithful: Faithful
  skeptical: Skeptical
  ambitious: Ambitious
trait_notes:
  kind:
    pro: Earns trust and gives care that counts.
  curious:
    pro: Notices things and asks what nobody else asks.
  glib:
    pro: Talks their way in and brings people round.
  sensitive:
    pro: Notices what is wrong, and feels what others feel.
  bold:
    pro: Pushes through resistance and danger.
  patient:
    pro: Waits as long as it takes and stays gentle.
  methodical:
    pro: Works by a method, checks and records every step, and holds to it when pushed.
  hardy:
    pro: Stands up to hard conditions, and falls ill less than others.
  charismatic:
    pro: People want to listen and to follow.
  quiet:
    pro: Draws no attention, sees a lot and can wait.
  wanderer:
    pro: Raised in the lower ranks or long on the road, rarely homesick, shrugs off hostility and sleepless nights, and takes hardship in stride.
  attached:
    pro: Gives deeply to people and stays by them.
  streetwise:
    pro: Quick on the street, and finds a way out of any scrape.
  scholarly:
    pro: Well read, and can talk with scholars as an equal.
  handy:
    pro: Solid craft, and gets the thing done properly.
  artistic:
    pro: Keen to beauty and sound, and moves people.
  calm:
    pro: Steady when it comes to the worst, and good at nursing.
  cosmopolitan:
    pro: Has seen many places, and strikes up talk with strangers.
  cheerful:
    pro: Laughs easily, helps willingly and lifts the mood.
  vigil:
    pro: Clearer the later it gets, and keeps a long watch without drifting.
  faithful:
    pro: Holds a firm belief, and does not waver in hard times.
  skeptical:
    pro: Wants proof, is not easily fooled and sees the flaw.
  ambitious:
    pro: Has a clear aim, and asks for what it takes.
mainline:
  open:
    name: Opening day
    desc: The agency opens. One shopfront, three employees.
  first_trip:
    name: First trip
    desc: An employee brings back the first time energy.
  reputation:
    name: A name
    desc: The neighbours start to mention the agency.
  far_past:
    name: Further back
    desc: Enough energy to open up more distant times.
  home:
    name: Home
    desc: Enough energy. The boss can go back to their own time and see their family.
quotes:
  abel_froland_masters:
    who: Niels Henrik Abel
    quote: One should study the masters, not their pupils.
    occasion: mathematical notebook kept in Paris, marginal note on p. 79, on making progress in mathematics (game translation)
    authors:
      - AI
      - Fan Shen
  ahmed_baba_added_to_lives:
    who: Ahmad Baba al-Timbukti
    quote: And in some of the lives he had recorded, I added praiseworthy qualities he had left out.
    occasion: Author’s preface to Nayl al-ibtihaj, completed in Marrakesh in 1005 AH (1596–97), closing paragraph on supplementing Ibn Farhun (game translation)
    authors:
      - AI
      - Fan Shen
  anning_rough_sketch:
    who: Mary Anning
    quote: I have endeavoured in a rough sketch to give you some idea of what it is like.
    occasion: letter from Lyme accompanying her drawing of the plesiosaur
    authors:
      - AI
      - Fan Shen
  basho_summer_grass:
    who: Matsuo Bashō
    quote: Summer grass—traces of the warriors’ dreams.
    occasion: Hiraizumi verse in Oku no Hosomichi (game translation)
    authors:
      - AI
      - Fan Shen
  beethoven_heart_echo:
    who: Ludwig van Beethoven
    quote: From the heart—may it go to the heart again!
    occasion: Inscription on the autograph score of the Missa solemnis · Game translation
    authors:
      - AI
      - Fan Shen
  boltzmann_duino_theory:
    who: Ludwig Boltzmann
    quote: Gas theory is far from having played its last part in science.
    occasion: preface to Lectures on Gas Theory, volume II (game translation)
    authors:
      - AI
      - Fan Shen
  boole_ballintemple_beginner:
    who: George Boole
    quote: It was my object, first of all, to meet the wants of those who had no previous acquaintance with the subject
    occasion: Preface to A Treatise on Differential Equations, Queen’s College, Cork, February 1859.
    authors:
      - AI
      - Fan Shen
  cajal_barcelona_microscope:
    who: Santiago Ramón y Cajal
    quote: Our first microscope, a fine Verick, was bought in instalments.
    occasion: Advice on Scientific Research, sixth edition, chapter on the working environment (game translation)
    authors:
      - AI
      - Fan Shen
  chekhov_bread_echo:
    who: Anton Chekhov
    quote: Nowhere is the bread as good as it is among the Germans.
    occasion: Letter to Pavel Iordanov from Badenweiler, 12 June Old Style · Game translation
    authors:
      - AI
      - Fan Shen
  copernicus_sun_at_center:
    who: Nicolaus Copernicus
    quote: But at the center of them all sits the Sun.
    occasion: On the Revolutions, first edition, Book I, chapter 10; game translation
    authors:
      - AI
      - Fan Shen
  curie_paris_persistence:
    who: Marie Curie
    quote: It is the fruit of all the work that came before.
    occasion: on great discoveries, in her biography of Pierre Curie (game translation)
    authors:
