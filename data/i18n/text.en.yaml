        insist: {name: "Insist", desc: "Stand at the ward door and finish speaking, do not retreat even if the solution is confiscated."}
        appeal: {name: "Appeal", desc: "Turn and go to Semmelweis and ask him to step in."}
    encyclopedia:
      history:
        - {text: "In 1847 the maternal death rate in the first maternity ward of Vienna General Hospital was clearly higher than in the second.", check: true}
        - {text: "The first ward was staffed by doctors and medical students, who often came straight from dissecting corpses.", check: true}
        - {text: "In mid May 1847 Semmelweis required doctors and students to wash their hands in a chlorinated lime solution before examining mothers.", check: true}
        - {text: "After the rule took effect the death rate fell markedly within a few months.", check: true}
        - {text: "Mainstream colleagues did not accept his explanation, and germ theory had not been established yet.", check: true}
      regret:
        - The numbers are in front of you, and still you wait for the powerful to nod. On the main timeline the washing rule came in mid May.
        - He never lived to see his colleagues truly accept him.
