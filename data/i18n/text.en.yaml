items:
  ors_pack:
    name: Oral rehydration salts
    desc: One packet makes a litre. Used to treat patients, two packets per patient.
  chlorine_tablet:
    name: Chlorine tablet
    desc: One tablet makes the drinking water of five people safe. Light and cheap, but someone has to listen to you.
  handbook:
    name: Modern care handbook
    desc: Raises treatment skill. Also a gift for the local doctor.
  recall_charm:
    name: Recall charm
    desc: Pulls a dying employee back. Without it, all gear is lost.
  detox_water:
    name: All purpose antidote water
    desc: A modern solution that neutralises many common poisons. Pricier than rehydration salts, but one bottle is worth three packets.
  disinfectant:
    name: Disinfectant
    desc: Modern disinfectant. One bottle makes the water or hands of a dozen people safe.
  heart_monitor:
    name: Heart rate monitor
    desc: Worn by the employee, it spots overwork early so fatigue builds more slowly.
  radiation_shield:
    name: Radiation shield
    desc: A lead lined shield from the future that keeps dust and radiation off the skin. The Curies worked without one.
  antibiotic:
    name: Antibiotic
    desc: Kills many bacterial infections. Useless against viruses, and not a cure for everything.
  mosquito_net:
    name: Mosquito net
    desc: Keeps the biting insects that carry malaria and yellow fever off a sleeper.
  face_mask:
    name: Face mask
    desc: A cheap barrier that cuts the spread of airborne illness. Worn once, then thrown away.
  thermometer:
    name: Thermometer
    desc: Shows a fever early, so a sickness is noticed before it is obvious.
  sun_hat:
    name: Wide brimmed hat
    desc: Shade for the head and neck against hours of sun.
  water_flask:
    name: Insulated flask
    desc: Boiled water carried along, cool in the heat and warm in the cold.
  warm_blanket:
    name: Thermal blanket
    desc: A light blanket that holds in body heat on a cold night outdoors.
  hand_warmer:
    name: Hand warmer
    desc: A packet that stays warm for a night.
  energy_bar:
    name: Energy bar
    desc: Dense food that fills an energy gap fast.
  neural_chip:
    name: Cyborg neural chip
    desc: A chip behind the ear that translates any language and speeds up learning. Hard to hide.
  oxygen_can:
    name: Oxygen can
    desc: A few breaths of oxygen for a thin air emergency.
  altitude_pills:
    name: Altitude sickness pills
    desc: Eases the headache and nausea of climbing too fast.
  cyber_arm:
    name: Cyborg arm
    desc: A prosthetic arm with far more strength than a person has. It shows.
  back_brace:
    name: Back brace
    desc: Supports the lower back during heavy lifting.
  cyber_lung:
    name: Cyborg bionic lung
    desc: An artificial lung for long hours of hard work. It hums softly.
  gorilla_arm:
    name: Cyborg gorilla arm
    desc: A huge, absurdly strong arm. Everyone looks.
  painkiller:
    name: Painkiller
    desc: Dulls pain for a few hours. It treats nothing, and only buys time.
  holo_cloak:
    name: Hologram cloak
    desc: A cloak that bends light so that people look past you. It lowers the chance of being found out.
  pack_frame:
    name: Pack frame
    desc: Spreads a load over the hips and raises what one can carry by five.
  caffeine_tablet:
    name: Caffeine tablet
    desc: Gets a person through one night, and the tiredness comes back later.
  golden_apple:
    name: Golden apple
    desc: A golden apple out of a myth. Whoever hears you out is moved. Your power to persuade is tripled.
  elixir:
    name: Elixir
    desc: A bright potion that eases pain and restores strength.
  headlamp:
    name: Headlamp
    desc: Light for reading and writing through the night, hands free.
  ear_plugs:
    name: Ear plugs and eye mask
    desc: Sleep in a noisy, bright place.
  thermal_suit:
    name: Thermal suit
    desc: A suit that holds a steady body temperature in ice or in heat. It looks odd.
  voice_recorder:
    name: Voice recorder
    desc: Keeps the words that matter, so a last conversation is not lost.
  water_station:
    name: Water station
    desc: A small machine that makes clean water for a whole village from mud.
  nutrient_synth:
    name: Nutrient synthesizer
    desc: Turns almost anything into a balanced meal, which ends hunger on a long road.
  plush_toy:
    name: Soft toy
    desc: A small gift for a child or a patient that makes the room less frightening.
  ar_glasses:
    name: AR glasses
    desc: Glasses that label what you see and bring out detail. Hard to hide.
  period_costume:
    name: Period costume
    desc: Clothes made to local style, so that nobody takes you for a stranger at first glance.
  gift_box:
    name: Gift box
    desc: Sweets, spice and a small mirror, things a host will take with thanks.
  sleep_regulator:
    name: Sleep regulator
    desc: A band that folds a night of sleep into two hours.
  exoskeleton:
    name: Exoskeleton
    desc: A frame worn over the body that carries the load. It does not use implant load, and raises what one can carry by ten.
  magnifier:
    name: Magnifier
    desc: Reads small writing and shows the detail of a manuscript or an object.
  calm_patch:
    name: Calm patch
    desc: A patch that settles the wearer own stress, so a long vigil at a bedside is bearable.
  notebook_pen:
    name: Notebook and pen
    desc: Writing down what someone says makes them feel taken seriously.
  hologram_projector:
    name: Hologram projector
    desc: Shows a vision in front of a crowd. It is the most noticeable thing one can carry.
  vitamin_c:
    name: Vitamin C tablets
    desc: Keeps scurvy away on a long voyage without fresh food.
  hardtack:
    name: Hardtack
    desc: Dry biscuit that keeps for months.
  nano_kit:
    name: Nano medical kit
    desc: Cures infections that nothing in the era could cure.
  gas_mask:
    name: Gas mask
    desc: Filters dust and poisonous gas from the air one breathes.
  scout_drone:
    name: Scout drone
    desc: Flies the road ahead and comes back with a picture of it.
  insulated_gloves:
    name: Insulated gloves
    desc: Protect the hands from a shock.
  first_aid_kit:
    name: First aid kit
    desc: Dressings and tape to stop bleeding and hold a wound closed, which lowers the chance that a hurt becomes a death.
  compass:
    name: Compass
    desc: Shows direction in a place nobody has described to you.
antiques:
  pump_rust:
    name: Rust flake from the Broad Street pump
    desc: A flake of rust scraped off an old pump. Hold it and you can find a street in September.
  clinic_bell:
    name: Brass bell from the maternity ward
    desc: A bell with no clapper. Hold it and you can find a ward in spring.
staff:
  s_ning:
    name: Xiaoyu Ning
    ethnicity: Han
    jobs:
      - Nurse
      - Caregiver
    bio: Used to be a nurse. Stubborn, cannot bear to see a patient with nobody looking after them.
    story: Xiaoyu worked eight years on the night shift of a busy city hospital ward, the kind where beds line the corridor. She is not the quickest or the strongest nurse there, and she never pretended to be. What she has is patience and a refusal to walk past someone who is alone. An old man with no family once waited for her every evening to help him finish his rice, and she kept doing it after her shift ended. She left nursing last year, worn out, and now takes private care work for families who cannot be home, still wishing for a job where she can sit with people long enough to hear their story to the end.
  s_zhou:
    name: Jianguo Zhou
    ethnicity: Han
    jobs:
      - Builder
      - Scaffolder
    bio: Worked construction. Strong, a talker, does not like going around things.
    story: Jianguo left a village in Henan at nineteen to lay bricks in a coastal city, and has followed building sites across the country for twenty six years. His body has never failed him, he carries two sacks where others carry one, and he talks his way through every shift. His head for paper is another matter. He cannot follow a drawing or read a contract, and twice a foreman has kept his wages because he signed what he did not understand. Bad luck follows him from site to site. He wants to go home, build a proper two floor house for his parents, and finally sleep in a bed that stays in one place.
  s_qian:
    name: Shouren Qian
    ethnicity: Han
    jobs:
      - Antique dealer
      - Restorer
    bio: Used to trade in second hand goods. Sharp eyes, knows what anything is worth at a glance.
    story: Shouren grew up beside the old second hand market in Tianjin, where his father sold bicycles and radios from a cloth on the ground. For thirty years he bought, mended and sold what other people threw out, and his hands can tell a copy from the real thing by the weight and the seam. Fortune has been kind to him, he once found a Qing dynasty box under a pile of plastic basins. His body has not, he has a weak chest and a bad stomach, and a customer who leans on him long enough can talk him into any discount. He dreams of a small shop with no haggling, where every item has a fair price written on a card.
  s_amara:
    name: Amara Okafor
    ethnicity: Igbo
    jobs:
      - Midwife
      - Nurse
    bio: Has delivered hundreds of babies and stays calm when everyone else panics.
    story: Amara grew up in Enugu, the eldest of five, and learned to stay steady by minding her little brothers through the rainy season blackouts. She trained as a midwife at twenty two and now works nights in a crowded maternity ward, where her hands are sure and she hums so the mothers know nothing is wrong. Her weak points are plain. Drug calculations and written charts are hard for her, a colleague checks them, she tires fast and has had malaria three times, and she cannot say no to an extra shift. Somehow the power returns and the babies come through. She wishes for a small clinic near her mother's village, with a generator and a warm kettle.
  s_kenji:
    name: Kenji Mori
    ethnicity: Yamato
    jobs:
      - Software engineer
      - Systems administrator
    bio: Debugs for a living and cannot leave a loose end alone.
    story: Kenji grew up in Sendai and taught himself to code on his father's old laptop, mostly to fix a broken game. Now he works at a logistics company in Tokyo, where he can trace a bug through three systems and write the note that finally explains it. His body is the other half of the story. He forgets to eat, sleeps at his desk, and has been ill every winter since university. He cannot hold a screwdriver steadily and breaks cups. One evening he rebuilt the ordering system of a tiny noodle stall for free, and the owner fed him for a week. He would like to build something small that old people can use without being afraid of it.
  s_isabella:
    name: Isabella Rossi
    ethnicity: Italian
    jobs:
      - Retired teacher
      - Tutor
      - Embroiderer
    bio: Forty years of teaching taught her to explain anything twice, and kindly.
    story: Isabella taught literature to thirteen year olds in a school outside Bologna for forty years, with handwriting so lovely that pupils copied it. Her body has always been the weak part. A bad heart, brittle bones and a hip broken on an icy step make her careful on every staircase, and her luck with trains and weather has never been good. Since retiring she tutors neighbourhood children at her kitchen table, paid in biscuits, and embroiders linen for the church. She wants to visit her sister in Sicily every autumn, if her health and the railways allow it.
  s_tariq:
    name: Tariq Hassan
    ethnicity: Arab
    jobs:
      - Driver
      - Mechanic
    bio: Knows every back street, and how to talk his way past a closed door.
    story: Tariq has driven a taxi through Amman for sixteen years, after a short spell selling spare parts with his brother. He is an ordinary man with ordinary gifts, so he made up the difference with nerve and talk. He knows which hill roads flood in winter, which cafe will give a stranger tea at four in the morning, and how to charm a traffic officer. On slow days he fixes his own engine in the yard. A woman once begged him to reach the hospital before her husband's surgery, and he took the back streets and made it with six minutes to spare. He saves a little each month so his daughter can study medicine.
  s_meiling:
    name: Mei-Ling Chen
    ethnicity: Hoklo
    jobs:
      - Painter
      - Illustrator
      - Art student
    bio: Sketches everything she sees and asks why about the rest.
    story: Mei-Ling was born in Tainan, where her grandfather painted temple doors and let her mix the red. At nineteen she studies at an art school in Taipei, and her hand is the best in her year, it can place a line the way other people place a word. Everything around the hand is weaker. She struggles with the theory classes, starts more sketchbooks than she finishes, and has lost two portfolios on buses. Her health is fragile and bad luck finds her easily. She hopes to paint a whole temple door of her own one day, and to let her grandfather mix the red once more.
  s_lars:
    name: Lars Nilsson
    ethnicity: Swede
    jobs:
      - Carpenter
      - Shipwright
      - Woodcarver
    bio: Builds things to last and does not like to be hurried.
    story: Lars learned boatbuilding from his uncle on an island in the Stockholm archipelago, and has spent more than thirty years planing oak and pine into hulls that outlast their owners. His hands are superb, but he reads slowly, cannot follow a contract, and leaves the accounts to his wife. His luck is terrible, and a fire took his workshop once and a flood took the second. He measures twice and waits a day before cutting, which has cost him customers, and he will not launch a boat early for anyone. Winter evenings he carves small wooden ducks for the village children.
  s_priya:
    name: Priya Sharma
    ethnicity: Marathi
    jobs:
      - Pharmacist
      - Shopkeeper
    bio: Reads every label twice and counts the dose a third time.
    story: Priya grew up above her uncle's chemist shop in Pune and spent school holidays labelling bottles in neat capitals. She is an ordinary student turned ordinary professional, not brilliant, not fragile, and careful because she knows she is no genius. She became a pharmacist at twenty four and now runs the counter and the stock of a busy neighbourhood pharmacy, where elderly customers bring bags of mixed tablets and ask her to sort them. Once she caught a double dose on a prescription and phoned the doctor at midnight. She keeps a notebook of questions customers were too shy to ask, and hopes to open her own shop with a bench outside.
  s_diego:
    name: Diego Fernández
    ethnicity: Spanish descent
    jobs:
      - Street musician
      - Dishwasher
    bio: Can draw a crowd with one guitar, and misses his mother's cooking.
    story: Diego left school at seventeen and has played guitar on a corner near the San Telmo market ever since, tango when the tourists linger and rock when students pass. His hands are a gift, but little else holds together. He cannot add up a night's coins without being short, he starts jobs and drops them within a week, and every winter chest cold keeps him in bed. Luck is what carries him, as when a retired baker began stopping every Thursday for one song and left a coin and a warm empanada. His mother sends him off with food in plastic tubs, and he talks often of an album he has not begun.
  s_olga:
    name: Olga Petrova
    ethnicity: Russian
    jobs:
      - Retired physician
      - Lecturer
    bio: Practised for fifty years and trusts her own eyes over any manual.
    story: Olga qualified as a doctor in Kazan and spent most of fifty years in a district clinic, reaching patients' flats through snow because the bus was never on time. She learned to listen to a cough before she read a chart, and she was often right. Her own body never kept up with her mind. A weak heart and thin lungs have put her in hospital more than once, and she diagnosed her first attack herself and refused to lie down. Colleagues called her stubborn, and she took it as praise. She still lectures to young doctors and keeps a small bag by the door for neighbours.
  s_samuel:
    name: Samuel Mensah
    ethnicity: Akan
    jobs:
      - Journalist
      - Radio host
    bio: Asks the question nobody else dares to, and writes the answer down at once.
    story: Samuel grew up in Kumasi, where his aunt sold newspapers from a roadside table and let him read them before the customers came. He studied journalism in Accra and now writes for a small paper and reads the morning news on local radio. Luck follows him, the right person always walks past at the right moment, and a drain story he stumbled on got a school flooded and then fixed. He has no backbone for the rest. He drops stories when an editor frowns, misses deadlines, and gives in to anyone who pushes, and malaria and bad stomachs keep him in bed. He carries a notebook everywhere and wants one day to publish a book of ordinary street answers.
  s_minji:
    name: Min-ji Park
    ethnicity: Korean
    jobs:
      - Chef
      - Stall keeper
    bio: Feeds everyone first and sits down last.
    story: Min-ji opened her first kitchen at twenty six in a narrow alley in Busan, serving stew to dock workers at five in the morning. Her hands are those of a master, she tastes a pot once and knows what it needs. Numbers and forms defeat her. She cannot keep accounts, her daughter does the books, and she once paid a fine twice because she misread the notice. Luck has not helped, the stall was flooded once and shut by a fire next door, and the regulars brought their own chairs to fill it again. She works fourteen hours a day and eats standing up. Her wish is one Sunday a month when someone else cooks and she is only a guest.
  s_jeanluc:
    name: Jean-Luc Moreau
    ethnicity: Breton
    jobs:
      - Retired sea captain
      - Net mender
    bio: Has weathered worse storms and gives orders without raising his voice.
    story: Jean-Luc was born in a fishing village on the Brittany coast, went to sea at sixteen on a cargo ship, and made captain at forty. His luck at sea was poor, and one ship burned under him and another ran aground, but his will never bent and his crews got home every time. He once pulled a deckhand out of a February sea, and the young man still sends him a card every Christmas. His back and knees are worn out now. He mends nets for the harbour children and teaches them knots on a plank behind his house, and he is stubborn about doing it standing up.
  s_fatima:
    name: Fatima Al-Sayed
    ethnicity: Arab
    jobs:
      - Archivist
      - Translator
    bio: Finds the one page that matters in a room full of boxes.
    story: Fatima has spent twenty six years in a Cairo municipal archive, in a basement that smells of dust and cardamom tea. She started as a clerk, and her father, a bookbinder, taught her to love paper that had been handled by many hands. The dust has not been kind to her. She has asthma, she is often ill, and twice a pipe has burst over shelves she had just put in order. Once she spent three weeks finding a single land deed for an old widow, and in the evenings she translates old Ottoman papers for a small fee. She believes an orderly shelf is a kind of kindness, and she will not be moved from that.
  s_tom:
    name: Tom Becker
    ethnicity: German descent
    jobs:
      - Apprentice mechanic
      - Farmhand
    bio: Takes apart every machine he meets, and puts it back together, mostly.
    story: Tom grew up on the edge of a small town in Ohio, where his grandfather kept a barn full of unfinished engines. He is built like a barn door and shrugs off knocks that would put others in bed, but he is slow with books and clumsy with small parts, and he gives up easily when a job drags. His luck is bad, so the part he needs is always the one that is out of stock. This year he started as an apprentice at a garage on Main Street and does farm work for a neighbour in summer. He wants to restore his grandfather's old pickup, though he has not yet opened its hood.
  s_wanjiru:
    name: Wanjiru Kamau
    ethnicity: Kikuyu
    jobs:
      - Data analyst
      - Tutor
    bio: Is the first to see the pattern in the numbers, and the last to carry the tray.
    story: Wanjiru grew up in Nyeri, where her father farmed coffee and kept his yields in a school exercise book, year after year. She studied statistics in Nairobi on a scholarship and now works at a mobile payments firm, where she is usually the first to notice when a graph bends the wrong way. Her body is less reliable than her mind. She gets fevers every rainy season, her hands cannot manage a knot or a tidy signature, and she has dropped more laptops than she can count. On weekends she tutors students in statistics, and she calls her father every Sunday to compare the rain.
  s_ricardo:
    name: Ricardo Silva
    ethnicity: African descent
    jobs:
      - Retired fisherman
      - Ferryman
    bio: Waits for the tide without hurry and tells long stories while he does.
    story: Ricardo fished from a wooden boat off the coast of Bahia for more than fifty years, starting at eleven when his father fell ill, which is why he never learned to read well. His hands are clumsy and his nets were always knotted badly, but his patience has no bottom and his luck has been kind. He rode out two storms that sank boats beside him, and his catches were good in years when others came home empty. He knows the tide by the smell of the wind. His knees no longer allow the boat, so he ferries neighbours across the river and tells his grandchildren the story of a fish too big to carry.
  s_anjali:
    name: Anjali Nair
    ethnicity: Malayali
    jobs:
      - Accountant
      - Tax preparer
    bio: Accountant from Mumbai who will not let a number go until it adds up.
    story: Anjali grew up in a Malayali family in Thane and has taken the suburban train into Mumbai every morning for eleven years, first to college, then to a small firm that audits neighbourhood shops. She is neither the quickest nor the strongest person in the office, and she knows it, so she makes up for it by being the one who stays. She once spent three nights finding a missing four hundred rupees in a grocer's books, because she knew it would be his daughter's school fees. Every March she also files returns for the families on her street, and the crowded trains leave her tired and prone to colds. Her mother keeps asking when she will marry. Anjali says after the quarter closes, and the quarter never closes.
  s_rajesh:
    name: Rajesh Yadav
    ethnicity: Bhojpuri
    jobs:
      - Farmer
      - Dairy farmer
    bio: Wheat and sugarcane farmer from Uttar Pradesh, strong and slow to change his mind.
    story: Rajesh has farmed four acres outside a village near Azamgarh since his father's knees gave out when he was nineteen, and he keeps two buffaloes for milk. He can work from dawn to dark in any heat and he has never once backed down from an argument. He reads slowly and cannot follow a form, so he has signed loan papers he did not understand and paid interest for years on a debt he still cannot explain. Two droughts and one flood have taken crops, and a canal gate he walked to the district office to complain about stayed shut for three more seasons. Nothing seems to land softly for him, and he goes on anyway. His son is in Lucknow studying for exams, and Rajesh quietly hopes the boy will come home one day, but will never say so.
  s_lakshmi:
    name: Lakshmi Subramanian
    ethnicity: Tamil
    jobs:
      - Tailor
      - Sewing teacher
    bio: Chennai tailor of forty years, talks while she stitches and asks about everything.
    story: Lakshmi has sat at the same Singer treadle machine in a Triplicane lane since she was twenty two, and half the street has been measured by her tape. Her hands are the best in the neighbourhood, and she can set a sleeve without a pin. Her body is another matter. She has been frail since childhood, tires after an hour of standing, and has missed weeks of work to fevers and a bad back. She talks the whole time she sews, about weddings, prices and whose daughter did what, and on Sundays she teaches girls from the lane to stitch. A granddaughter showed her a video of a fashion school abroad, and she watched it three times. She keeps asking how the machines there are different from hers.
  s_arjun:
    name: Arjun Malhotra
    ethnicity: Punjabi
    jobs:
      - Engineering student
      - Hardware shop assistant
    bio: Delhi engineering student, quick with ideas and unable to finish them.
    story: Arjun is in his third year of electronics at a Delhi college and learns anything in an afternoon. He built a robot arm from scrap that waves at anyone who walks past the hostel, and then left it unfinished like everything else. He has almost no will. He misses deadlines, sleeps through morning classes and cannot make himself revise, so his marks lag far behind his mind, and his clumsy hands break more parts than they solder. On weekends he stands behind the counter of his father's hardware shop in Karol Bagh, where the family expects him to stay on someday. He has not found the courage to say he wants to build things nobody has asked for.
  s_meera:
    name: Meera Banerjee
    ethnicity: Bengali
    jobs:
      - Translator
      - Proofreader
    bio: Kolkata translator between Bengali, Hindi and English, who feels every word she carries over.
    story: Meera translates novels and the occasional legal letter from her flat near College Street, with a pot of tea going cold beside the dictionary, and proofreads for a small publisher when the rent is due. Her father taught her to read in three alphabets before she was ten, and her mind is sharp. Her body is not. She catches every cold in the lane, has migraines that take whole days, and cannot work through a monsoon fever. Loud rooms tire her and a harsh email can ruin her afternoon. She once spent a week on a single line of a poem because no English word held its smell of rain on tin roofs.
  s_vikram:
    name: Vikram Singh Sandhu
    ethnicity: Jat Sikh
    jobs:
      - Electrician
      - Pump repairer
    bio: Punjab electrician with steady hands, an easy tongue and a flexible idea of the bill.
    story: Vikram is a Jat Sikh from a village near Ludhiana, and he has wired farmhouses and fixed tube well pumps between Ludhiana and Jalandhar for thirty years. He is a good electrician but not a gifted one, a man of ordinary health who gets the job done and the bill paid. He talks his way into trust easily and is bold about quoting a price. He charges the rich a little extra and the poor a little less, though his wife calls it something else. He once rewired a gurdwara kitchen overnight for free and told the story for ten years. His shoulder aches in the cold now. He dreams of a workshop with his name painted on the front.
  s_xiaoming:
    name: Wang Xiaoming
    ethnicity: Han
    jobs:
      - Courier
      - Warehouse loader
    bio: Shenzhen courier who knows every back alley and wants to know what is behind every door.
    story: Xiaoming came to Shenzhen from a small town in Henan at nineteen and has delivered parcels on an electric scooter for nine years, loading trucks at the depot before dawn. He can carry anything up any staircase and hardly ever gets sick. He is slow with figures and clumsy with his hands, so he has dropped phones, crushed boxes and paid the fines from his own wages, and he learned the alleys by riding them a hundred times, not by reading a map. Every door he knocks on is a small glimpse of a stranger's life, and he wonders about them on the ride home. He once took a night course in electronics, could not follow it, and quit when the rent went up. He is saving to open a small shop of his own, and he has already chosen the corner.
  s_guilan:
    name: Li Guilan
    ethnicity: Han
    jobs:
      - Villager
      - Farmer
    bio: Sichuan villager who feeds anyone at her door and will not be talked out of anything.
    story: Guilan has lived all her life in the same hill village in Sichuan, raising pigs, peppers and three children, two of whom now work in far cities. She never went past third grade and still cannot follow a phone menu, but her will has carried her through famine stories, a hard widowhood and every argument since. She is frail and her knees are bad, yet she has been lucky where it counts. A landslide stopped a few metres from her house, and all three children grew up healthy. Any stranger passing the gate gets a bowl of noodles whether they want one or not. Her grandchildren, raised in the city, no longer follow the speech of the village, so on the phone she tells them stories in it anyway, as if the old words were still alive. When the young ones tell her to move to the city, she says her pepper plants would miss her, and she still walks the steep path to the well every morning.
  s_budi:
    name: Budi Hasanuddin
    ethnicity: Bugis
    jobs:
      - Ferry pilot
      - Fisherman
    bio: Ferry pilot out of Makassar, calm in rough water and always ready to take one more passenger.
    story: Budi grew up in a Bugis fishing family on the coast near Makassar and was steering his uncle's boat before he could swim well. Now he pilots a small ferry between the harbour and the islands and fishes at night when the tide allows. He is strong and does not tire, and he reads the sea by feel, but he cannot read a chart, struggles with the ledger and has let the boat owner shave his pay for years because he cannot check the sums. In a storm last monsoon he turned back for a stranded fisherman and arrived late for his own daughter's birthday. He has never regretted it. He hopes she will study something that keeps her on dry land, and also secretly hopes she will not.
  s_linh:
    name: Nguyen Thuy Linh
    ethnicity: Kinh
    jobs:
      - Street food seller
      - Waitress
    bio: Hanoi street food seller, quick with a joke and a bowl, soft on anyone who looks hungry.
    story: Linh is an ordinary young woman from a Kinh family in Hanoi, no better and no worse than most at anything. She sells bun cha from a plastic stool stand in the Old Quarter, using the grill her aunt left her when she moved south, and waits tables at a hotel restaurant on slow days. She learned early that a joke sells more noodles than a sign, and her regulars come as much for the teasing as for the broth. She rounds prices in her own favour, then gives free bowls to the students who count their coins. Evenings she studies English from a battered phone, hoping to run a small restaurant with a menu in two languages.
  s_maria:
    name: Maria Santos
    ethnicity: Tagalog
    jobs:
      - Caregiver
      - Cook
    bio: Fifteen years of nursing homes and night shifts, gentle with the old, hopeless with forms and numbers, and somehow always rescued.
    story: Maria grew up in a Manila neighbourhood where every aunt looked after every other aunt's children. At twenty six she took a job in a small care home, meant to be temporary, and stayed fifteen years, cooking soft meals for people who cannot chew. She cannot keep a ledger, misreads her own payslip and signs whatever is put in front of her, so her sister in Cebu checks every paper she brings home. Yet things keep turning out for her. The home was about to close twice, and twice a donor appeared with no explanation. She cries at funerals of people she barely knew, and has stopped apologising for it. Her quiet wish is a small bakery where the old ladies could sit for free.
  s_somchai:
    name: Somchai Boonmee
    ethnicity: Lanna
    jobs:
      - Former Monk
      - Tutor
    bio: Twenty years in a temple, now asks questions about everything, slowly and kindly, from a frail body.
    story: Somchai was born to rice farmers outside Chiang Mai and ordained at twenty two because the temple had the only library he could walk to. He stayed twenty years, teaching village children to read. His body was never strong, and his hands are so clumsy that other monks mended the roof while he held the ladder. When his mother fell ill he left the robes to care for her, and found that prices, phones and manners had all changed. He now tutors children at his kitchen table and asks every parent what they are reading. He tires on stairs and catches every cold, yet luck follows him, from the storm that spared the temple to the neighbours who paid his hospital bill. He still wants to see snow once.
  s_hiroshi:
    name: Hiroshi Tanabe
    ethnicity: Yamato
    jobs:
      - Retired Engineer
      - Machine Fitter
    bio: Forty years at a machine tool plant, a brilliant mind in a failing body, still corrects other people's drawings.
    story: Hiroshi joined a machine tool factory in Osaka at eighteen and became the man other engineers brought their worst problems to. His hands are steady enough to set a tolerance by feel. His luck was never good. The company went under two years before his pension was due, and most of it went with it. His wife died young, and a weak heart has kept him close to home since. He fills the quiet house by rebuilding old radios on the kitchen table, and sells a few to collectors. His knees complain and his hands do not. He will not be told a tolerance is good enough, and he still hopes someone young will ask him how a thing is really made.
  s_yuna:
    name: Yuna Kobayashi
    ethnicity: Yamato
    jobs:
      - Office Worker
      - Writer
    bio: Ten years in the same Tokyo office, notices everything, speaks up rarely and then does not back down.
    story: Yuna studied literature, then joined a mid sized trading company in Tokyo because the interview was the first one that did not end in silence. Ten years later she still takes the same train at seven forty, and she can tell from the way a colleague puts down a cup whether the day will be bad. She is a trans woman, and changed her name at work in her late twenties with a short email and a few awkward weeks, which is now only one more fact about her. She rarely objects in meetings, but when she does, she does not give way. Evenings she writes short stories that nobody has read. Last spring she turned down a promotion without quite knowing why, and she is still working out what she wanted instead.
  s_rafiq:
    name: Rafiq Hossain
    ethnicity: Bengali
    jobs:
      - Garment Worker
      - Tailor
    bio: Sews faster than anyone on his floor, argues with every supervisor, and is cheated by everyone who offers him a shortcut.
    story: Rafiq came to Dhaka from a village in Barisal at sixteen and learned the sewing machine in a month. Fourteen years on, he runs a line of thirty people, works double shifts without tiring, and can fix a jammed needle by ear. He can barely read, so he has signed contracts he did not understand, and a labour broker once took six months of his savings. The factory he worked in before this one burned, and he lost two years of pay with it. He shouts at supervisors, then gives way when someone leans on him quietly. He sends money so his younger sister can finish school. Someday he wants a workshop of his own, with a window that opens.
  s_nasreen:
    name: Nasreen Qureshi
    ethnicity: Punjabi
    jobs:
      - Doctor
      - Medical Teacher
    bio: Physician who treats the poor for what they can pay, and argues with the hospital board about it.
    story: Nasreen was one of six women in her year at a Lahore medical college, and she remembers every one of them. For twenty five years she has run a small clinic where fees depend on what the patient can carry, sometimes a bag of lentils, and she teaches a class of young doctors on the side. She diagnoses faster than anyone she has worked with. Her body is the weak part. A bad spine and a failing kidney leave her tired by noon, and she has quietly stopped climbing stairs. The clinic has flooded twice and been robbed once, and the board keeps asking her to be more businesslike. She answers politely and changes nothing. Her daughter wants her to retire, but she wants one more class first.
  s_reza:
    name: Reza Moradi
    ethnicity: Persian
    jobs:
      - Bookseller
      - Translator
    bio: Sells poetry in an Isfahan bazaar, can talk anyone into a book and sometimes into a bargain too.
    story: Reza inherited his uncle's bookshop under the arches of an Isfahan bazaar, along with eleven thousand unsorted volumes and a talent for conversation. He reads four languages and translates French and English essays for small journals. He can quote Hafez to a tourist and a bus timetable to a taxi driver, and he is not above rounding a price up when a customer looks rich. He has no will against a cigarette, a loan request or a second pot of tea, and years of dust and smoke have left him with a cough that never fully clears. Money slips through his hands, and he lends books he never gets back. What he wants most is to find the one lost manuscript his uncle swore was somewhere on the shelves.
  s_leyla:
    name: Leyla Yildiz
    ethnicity: Turkish
    jobs:
      - Architecture Intern
      - Illustrator
    bio: Draws buildings on the back of tram tickets, says yes to everything first and worries afterwards.
    story: Leyla grew up in a flat above a tea garden in Istanbul, drawing the ferries and the minarets from the balcony. She finished architecture school last summer and now interns at a firm that restores old wooden houses along the Bosphorus, and draws small commissions for a magazine on weekends. She is an ordinary student of her trade, no better and no worse than her classmates. She climbs scaffolds without a second thought and says yes to every site visit, then lies awake wondering whether she is good enough. Her mentor says her sketches are brave and her deadlines are not. She wants to design one small library for a neighbourhood that has none.
  s_aigerim:
    name: Aigerim Sultanova
    ethnicity: Kazakh
    jobs:
      - Geologist
      - Mining Consultant
    bio: Spends months in the steppe with a hammer and a notebook, tireless in the field, clumsy and unlucky everywhere else.
    story: Aigerim's grandfather herded sheep on the steppe, and she grew up believing the ground itself was a kind of storyteller. She studied geology in Almaty and has spent half of every year since in the field, and she consults for mining firms in the other half. She walks twenty kilometres a day in dust and wind and does not tire. Her hands are clumsy with small things, so jars, zips and sample bags break or burst around her. Luck is not on her side either. She once drove two hundred kilometres on a flat tyre to reach a core sample, and the rain came an hour before she did. Cities make her restless. She dreams of a map of the old riverbeds nobody has drawn.
  s_chidi:
    name: Chidi Okafor
    ethnicity: Igbo
    jobs:
      - Civil Engineer
      - Site Manager
    bio: Builds bridges around Lagos traffic, knows every official by first name, cuts a corner when nobody is looking.
    story: Chidi grew up in Surulere, where the road outside his school flooded every July, and he decided early that someone should fix it. He trained as a civil engineer and now manages sites for bridges and drains across Lagos. He is a capable, ordinary engineer, and what lifts him above that is that he can talk to anyone. He charms inspectors and suppliers alike, and knows which official to greet and which to avoid. Sometimes he trims a specification to save a week, and tells himself the structure will hold. His mother keeps asking when he will marry, and he keeps saying after the next bridge opens.
  s_abebe:
    name: Abebe Tadesse
    ethnicity: Gedeo
    jobs:
      - Coffee Farmer
      - Cooperative Member
    bio: Grows coffee on a steep hillside near Yirgacheffe and will not sell a bean he is ashamed of.
    story: Abebe took over his father's hillside plot at twenty two, among trees older than he was. His hands are clumsy, so he cannot prune straight or sort cherries fast, and he cannot keep the cooperative's accounts, which a neighbour does for him. What he has is a will that does not bend. When the middlemen pushed prices down and everyone mixed in poor beans, he alone kept to the grading rules, and people laughed at him for years. The rains came right more often than not, and a few buyers began to return to him every season. His daughter studies agriculture in Addis Ababa and does the fine pruning when she visits, arguing the whole time, and he never gives way aloud.
  s_aisha:
    name: Aisha Benali
    ethnicity: Amazigh
    jobs:
      - Tour Guide
      - Shop Assistant
    bio: Walks visitors through the Marrakesh medina and can talk her way into any price, or out of any corner.
    story: Aisha learned the alleys of the medina as a child, running errands for her uncle's lamp shop, and she still works there on the days without a tour. She is frail, and the dust and the heat leave her in bed a few days every month. She has little staying power, and she has begun classical Arabic lessons three times and dropped them three times. Her tongue and her quick hands carry her through, and she has French, English and some Spanish from the people she guides. Luck follows her around, and a visitor once paid a whole season of her rent for a tour that ran late. She does not always tell the truth about prices, and she knows it.
  s_thabo:
    name: Thabo Mokoena
    ethnicity: Sotho
    jobs:
      - Union Organizer
      - Factory Worker
    bio: Stands up in front of the factory gate in Johannesburg and says what everyone else is thinking.
    story: Thabo grew up in Soweto, the son of a bus driver who came home every night too tired to speak. He started on a factory floor at nineteen, where his enormous strength made him the man who lifted what no one else could, and he was elected shop steward at twenty six because he would walk into the manager's office when no one else would. He reads slowly and handles paper badly, so his wife keeps his files. His luck is poor. Two strikes failed by a single week, he was laid off just before a settlement, and his bicycle has been stolen three times. He keeps going anyway, and now teaches younger workers to read a contract line by line, because nobody should sign what they cannot read.
  s_ngozi:
    name: Ngozi Mbuyi
    ethnicity: Luba
    jobs:
      - Market Trader
      - Seamstress
    bio: Has sold cloth and soap at the same Kinshasa market stall for thirty years and never lost an argument over a price.
    story: Ngozi took over her aunt's stall at the edge of a Kinshasa market at twenty six, selling printed cloth and soap, and she sews hems and blouses in the quiet hours. She never learned to read, and she signs with her thumb, so her children read her letters and she has been cheated by a paper or two. Her fingers are quick and her tongue is quicker. Her body is weak, with swollen knees, short breath and many days in bed. Her luck is extraordinary, though. A fire took the stalls on both sides of hers and left hers standing, and twice a flood stopped one street short. She will not hand the stall over until her youngest finishes university, and she says that day is close.
  s_carlos:
    name: Carlos Ramirez
    ethnicity: Zapotec
    jobs:
      - Baker
      - Street Vendor
    bio: Gets up at three every morning in Oaxaca to bake bread, and always has a joke ready for the first customer.
    story: Carlos has baked in the same wood fired oven in Oaxaca since he was fifteen, and his hands shape a loaf as if they had never done anything else. On Sundays he sells from a cart in the plaza. He can barely add up a bill and writes only his name, so he prices by habit and often sells too cheap. His luck is bad in small and large ways, with a cracked oven floor, a flooded shop and a stolen cart. If a child comes in without enough coins, he somehow always has one extra roll that needs eating. His niece wants to take over, but he has never written a recipe down and cannot manage more than a few lines, so he teaches her by standing beside her at the dough.
  s_camila:
    name: Camila Restrepo
    ethnicity: Mestizo
    jobs:
      - Biologist
      - University Lecturer
    bio: Counts frogs and orchids in the cloud forests above Medellin, and forgets to eat while doing it.
    story: Camila grew up in a flat in Medellin where the mountains were only a view. A school trip to a cloud forest at fourteen changed that. She can name a frog from one call in the dark and writes sharp papers, but she has almost no staying power and has left four half finished projects behind. She also lectures part time, where a colleague keeps her to the calendar. Her body is delicate, and she has come down from the mountain with fever more than once, and her hands are clumsy enough that she has dropped two cameras into streams. Luck keeps rescuing her, with a grant arriving on the last day of a year. A village schoolteacher now brings pupils to count frogs, and sends her their drawings.
  s_quispe:
    name: Mariano Quispe
    ethnicity: Quechua
    jobs:
      - Shepherd
      - Potato Farmer
    bio: Has herded alpacas on the high ground near Cusco for fifty years and still talks to each one by name.
    story: Mariano has walked the same high pastures near Cusco since he was twelve, first behind his father and then alone, and he plants potatoes on a terrace below. He never went to school, so letters and land papers defeat him, and his hands are so clumsy that a neighbour shears the alpacas for him. What he has is a will like the mountain. He reads the weather from the colour of the peaks and knows every animal by its voice. Hail and frost have a way of missing his slope. When his sons moved to the city for work he did not argue, and he did not move either. A wrong word about his animals hurts him for days. His one wish is for a grandchild to climb with him once.
  s_jamal:
    name: Jamal Whitfield
    ethnicity: African descent
    jobs:
      - Paramedic
      - Rideshare Driver
    bio: Drives an ambulance through the night shift in Atlanta and holds the hand of whoever is in the back.
    story: Jamal grew up in southwest Atlanta, where his grandmother once waited forty minutes for an ambulance, and he took that personally. He failed the paramedic exam twice before passing at twenty nine, because book learning comes slowly to him, and he drives for a rideshare company on his days off to pay the debts. He is strong enough to carry a patient down three flights alone. His luck is the worst in the station, with breakdowns, flat tyres and a crash that put him in hospital for a month, and he is often sent to the hardest call. After one he sits in the car for a few minutes before driving on. At home he is learning to cook, one dish a week for his daughter.
  s_emily:
    name: Emily Tagoona
    ethnicity: Inuit
    jobs:
      - Bush Pilot
      - Flight Instructor
    bio: Flies a small plane between northern Canadian settlements and has turned back for weather exactly twice in thirty years.
    story: Emily grew up in an Inuit family in a small northern town where the only way out in winter was by air. She watched the mail plane land on the ice and decided at nine that she would fly it. Written work is her great weakness, and she failed the licence theory exam five times before she scraped through, and still cannot fill in a flight log without help. Her hands on the controls are another matter. She flew medicine, mail and once a whole hockey team over the same frozen lakes, and a few people told her it was no job for a woman from the settlement. She checks the sky by eye before she looks at a forecast. Now she teaches a young pilot from her own community, mostly by shouting and pointing.
  s_tui:
    name: Tui Fuimaono
    ethnicity: Samoan
    jobs:
      - Navigator
      - Fisher
    bio: Learning to cross the open Pacific by stars and swells, and impatient to go farther than anyone in their family has.
    story: Tui grew up in Apia and lives as fa'afafine, a recognised and ordinary place in Samoan life, in a family that has never made a fuss about it. Their grandfather told stories of sailing between islands with only stars, swells and birds. At eighteen Tui joined a canoe crew reviving the old routes. Tui can paddle all day and hold a steering oar through a storm, but forgets the star names after a week and has to sing them back, and ties knots so badly that the crew checks every line. Tui fishes from the reef to pay a share of the household costs. One day Tui wants to bring a canoe into a distant harbour, guided only by what the grandfather taught.
  s_fan:
    name: Fan Shen
    ethnicity: Han
    jobs:
      - Modelling scientist
      - Game designer
    bio: Employee number one of the agency. Believes modelling and planning can make a life go better.
    story: Dr Fan worked a few years at Rayfield, then spent a few years as a Nomad taking freelance jobs. Colleagues say he is devoted to his research, only his reports always come in late. In his breaks he built a health model and a care game, and since nobody was chasing him he kept at it bit by bit, until he began to think about trying Trauma Team. Then the boss arrived from the future with the means to travel back, and he became the first to join, hoping to use his research to mend some of the regrets of history. If that works, he would like to help make life better for people today.
