    blurb: Childbed fever, two maternity wards, and a young doctor who put the death counts side by side. The task is not to beat a disease but to persuade a room of seniors who will not wash their hands.
    handle_label: Washing rule starts
    protagonist: Ignaz Semmelweis
    protagonist_role: Assistant obstetrician who has just found that the dissecting room and the delivery room deaths are linked
    stay: Stay twenty-one days
    items:
      chlorine_tablet: {name: "Chlorinated lime tablet", desc: "One tablet makes a basin of washing solution, enough for dozens of examinations. Cheap, but someone has to wash."}
      handbook: {name: "Modern nursing handbook", desc: "Raises skill in caring for mothers. Also a gift for Semmelweis."}
      recall_charm: {name: "Recall charm", desc: "Pulls an employee back when they collapse. Without it, all gear is lost."}
    strategies:
      focus:
        balanced: {name: "Balanced", desc: "Care for mothers with fever, teach washing when there is a chance, see Semmelweis when there is time."}
        cure: {name: "Mothers first", desc: "Bedside care first, little persuading about washing."}
        prevent: {name: "Teach washing first", desc: "Persuade people in the ward one by one and hand out washing solution."}
