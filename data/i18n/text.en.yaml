ui:
  about:
    title: About The Teleporter
    version_line: '{app} {v}, released {date}'
    links:
      - id: site
        label: Website
      - id: code
        label: Source code
      - id: issues
        label: Feedback and issues
      - id: mail
        label: Email
    sections:
      - h: Introduction
        p:
          - You run a time travel agency. Employees go back to historical turning points, try to help, and come home with a report. Nothing needs your constant attention. You can set it to run by itself and just read what happens.
          - It started from plain curiosity about what would happen if someone from today stood in a famous moment of the past, and it is meant to be fun to poke at and pleasant to watch.
          - 'History cannot be changed. Everything an employee does lands on a parallel branch and the main timeline stays as it was, and the difference between the two is converted into time energy. The agency stays out of wars and regime changes and does only medicine, technology, documents, daily life and witnessing. Employees do not die: when one is about to, the recall charm pulls them back at a cost, and the story goes on.'
      - h: Disclaimer
        p:
          - This is a game and a simulation exercise. It is not a medical, public health or historical research product. It gives no diagnosis, treatment, medication or health advice, and nothing in it should guide a real decision about health or safety.
          - The models are simplified. Their parameters are game assumptions unless a number is marked historical, and no parameter has been fitted to data. Historical facts in the game are placeholders until their sources are checked, and each entry says whether it has been checked. Please do not cite the game as a source.
          - 'The 100 events were chosen with a deliberate tilt: more science, technology, philosophy, art and ideas, and less politics and war. That is a choice of this first version, not a claim about what matters most in history.'
          - Historical people such as John Snow and Ignaz Semmelweis appear as portrayed figures. What they say and do in the game is fiction built around the historical record, and does not reflect their real words, views or character. The time travel, the employees, the antiques, the goods and every plot are invented.
          - Products, names and items in the game are fictional. Where a name resembles someone else's work it is a reference, not an affiliation, and anything not yet checked for rights is marked and cannot be bought in the game.
          - The game is provided as is, without warranty of any kind. If you are in a very difficult place, please reach out to someone you trust or to local professional support.
      - h: Data and privacy
        p:
          - Your save and settings live only in your browser, in local storage on your own device. The page has no accounts, no servers for your data, no analytics, no ads, no cookies and no third party tracking, and it sends your game data nowhere.
          - Your language choice and your place in the interface are stored locally too. The Clear save button in Settings deletes the save and cannot be undone. Clearing your browser data deletes everything as well. Your save may be reset when the game is updated, so export a backup in Settings if you want to keep it.
          - The game is meant for adults. If it is ever offered with accounts or cloud features, what is collected and why will be stated first, collection will need your explicit consent, and local data protection law such as the GDPR will be followed.
      - h: Contribution
        p:
          - The game is released under the MIT License. The interface and logic are static web files with no backend, and the data files are YAML, read with js-yaml, which is also MIT licensed.
          - Suggestions and criticism are very welcome, and so are ideas for new events and employees, and any data or sources that could make them more accurate. Events with their relics, employees, traits and translations are plain yaml cards in the cards folder, and cards/README.md shows how to add one. Corrections to the facts are just as welcome.
          - Contributions that are adopted are published here under your name, a name or a pen name as you prefer, and the work remains yours. Like the game, they are released under the MIT License, so that others can keep using and improving them. Please add a source to any historical claim, so that it can be checked.
      - h: Author
        p:
          - I am Fan Shen, a researcher in dynamical systems modelling and simulation, and this is my personal project. I designed its data structures and calculation logic.
          - Every era is a public YAML model. Employees and historical figures are agents that pick actions by utility, events are random but seeded, and every run is compared with the same seed run without the employee. The code only interprets the files. Each number carries a source tag that tells historical facts, models, game assumptions and calibrated values apart, and in developer mode the wiki lists the formulas and variables. The engine is a simplified JavaScript version of an engine improved from the LM backend, and the models in this prototype are not fitted to data.
          - Life Matters (LM) is an open research project I proposed. It builds the LM format in YAML to bring together findings from parts of medicine, psychology and sociology, and uses dynamical models to describe how the elements of everyday life affect health. The format is open, in the hope that people will use it, build models with it, share them and work together. It is still under development.
          - Care for You is also a sub-project of LM, a home caregiving game, driven in the same way by an engine improved from the LM backend.
        links: 0
      - h: Credits and licence
        p:
          - Parts of the game, including the code, the text and the design, were made with vibe coding. Thanks to AI, I could realise this idea in my spare time.
          - 'Other games inspired this one: the encyclopedia follows the Civilopedia of Civilization IV, sending someone out and reading what happened follows Assassin''s Creed Brotherhood and Travel Frog, hiring follows Heroes of Might and Magic, the clock and the music player follow Stellaris, and the stars and levels follow Plants vs. Zombies and the full synchronisation of Assassin''s Creed. They are named as thanks and have no connection to this game.'
          - The world map outlines are from Natural Earth, in the public domain.
          - The piano pieces are MIDI files by Bernd Krueger from piano-midi.de, licensed CC BY-SA 3.0 DE and kept unchanged in the assets folder. The effects are tones the page makes itself.
          - The historical references are listed in the wiki, each with whether it has been checked.
          - The name and the logo are not licensed under the MIT License.
