      p1: Climb the mountain path with him
      p2: Look at what he stops to record
      p3: Carry him home on the long road (needs a cyborg arm or a cyborg gorilla arm)
  song_yingxing_fengxin:
    name: A book of how things are made
    place: Jiangxi
    figure: Song Yingxing
    story: Song Yingxing, a provincial teacher and official, writes a book on how crops, cloth, salt, iron and paper are made. It was soon almost lost in China and survived in print in Japan.
    relic: A page of tool drawings
    relic_desc: A woodblock print of a loom with every part labelled.
    points:
      p1: Learn how a loom and a kiln are worked
      p2: Check the drawings of tools (a craftsperson)
      p3: Keep a copy on the shelf (a record keeper or a stubborn employee)
  wang_zhenyi_jinling:
    name: An eclipse explained with a lamp
    place: Nanjing
    figure: Wang Zhenyi
    story: Wang Zhenyi, a young woman who taught herself astronomy and mathematics, shows with a lamp, a mirror and a round table why a lunar eclipse happens. She died in 1797 aged twenty nine, and her work is little known.
    relic: A small round mirror
    relic_desc: The mirror that played the Moon in her model of an eclipse.
    points:
      p1: Sit with her among her books
      p2: Follow her model of the eclipse
      p3: Hear her argument to the end (a sharp mind, a teacher or a student)
  jianzhen_nara:
    name: A monk who never saw the shore
    place: Nara
    figure: Jianzhen
    story: The Chinese monk Jianzhen sets out to teach the monastic rules in Japan, is turned back five times by storms and arrests, and goes blind. He arrives on the sixth try and never sees the country.
    relic: A bundle of dried herbs
    relic_desc: Medicinal plants he carried across the sea.
    points:
      p1: Walk the last road to the temple at his pace
      p2: Talk about medicines with him (medical staff)
      p3: Describe the land to him as you walk
  hua_tuo_xuchang:
    name: A physician whose books are gone
    place: Xuchang
    figure: Hua Tuo
    story: Hua Tuo, a physician known for surgery under a wine powder and for exercises based on animal movements, is held by officials at Xuchang. His own writings did not survive, and he is known only through later accounts.
    relic: A pouch of herb powders
    relic_desc: A small cloth pouch of ground herbs with a faint bitter smell.
    points:
      p1: Watch him examine a patient (medical staff or a curious employee)
      p2: Sit with a patient through the night (a kind employee, a nurse or a midwife)
      p3: Write down his methods while he speaks (a record keeper, a journalist or a sharp mind)
  bi_sheng_printer:
    name: Type made of clay
    place: Hangzhou
    figure: Bi Sheng
    story: Bi Sheng, a commoner, makes movable type from baked clay and prints with it, as the scholar Shen Kuo later records. The method is not widely taken up, and nothing of his work survives.
    relic: A clay type character
    relic_desc: A small baked piece with one reversed character.
    points:
      p1: Cut and fire the clay type (a craftsperson or a sensitive employee)
      p2: Sort the characters by rhyme
      p3: Believe in the clay type when others see only a trick
  miyazawa_kenji_hanamaki:
    name: Stories few had read
    place: Hanamaki
    figure: Miyazawa Kenji
    story: A teacher and farm adviser in northern Japan, Miyazawa Kenji writes stories and poems that almost nobody buys. He dies of illness in 1933 aged 37, and Night on the Galactic Railroad is left unfinished.
    relic: A pocket notebook
    relic_desc: A small notebook of poems in pencil.
    points:
      p1: Look at the stars with him
      p2: Work the cold field beside him
      p3: Sit with him on his last evening (needs an elixir)
  higuchi_ichiyo_tokyo:
    name: Fourteen months of stories
    place: Tokyo
    figure: Higuchi Ichiyo
    story: Higuchi Ichiyo supports her mother and sister in poverty and writes a handful of stories in about fourteen months. She dies of tuberculosis in November 1896 aged 24, just as the critics praise her.
    relic: A pocket diary
    relic_desc: A diary kept for years in careful brush writing.
    points:
      p1: Talk an editor into taking another story
      p2: Read her diary pages (a curious or sensitive employee, or a journalist)
      p3: Sit with her on a good afternoon
  sei_shonagon_kyoto:
    name: After the court was gone
    place: Kyoto
    figure: Sei Shonagon
    story: After her empress dies in the year 1000, Sei Shonagon is left without her court. Her notebook of lists and small moments, the Pillow Book, is what remains, and her later years are not recorded.
    relic: A folded list
    relic_desc: A sheet of lightly written lists of things that please and things that do not.
    points:
      p1: Join her list of things that please
      p2: Catch her in a talkative hour
      p3: Visit her when the court has gone quiet
  kabir_maghar:
    name: Verses carried by singers
    place: Maghar
    figure: Kabir
    story: A weaver who sang short poems against pride and division, Kabir never wrote them down himself. Singers carried them, and they were gathered after his death, traditionally in Maghar in 1518.
    relic: A weaver's shuttle
    relic_desc: A worn wooden shuttle, smooth from the hand.
    points:
      p1: Hear him sing at the loom
      p2: Sit among the weavers at a quiet hour
      p3: Learn the verses by heart (a musician or a sensitive employee)
  ibn_rushd_lucena:
    name: Banished with his books
    place: Lucena
    figure: Ibn Rushd
    story: Ibn Rushd, a judge and physician, is banished to Lucena in 1195 and his philosophical books are ordered burned. His commentaries on Aristotle survive mostly in Hebrew and Latin, less in the original Arabic.
    relic: A page of commentary
    relic_desc: A page of close Arabic script, with the text of Aristotle in the margin.
    points:
      p1: Visit him in the quiet town
      p2: Follow his commentary on Aristotle
      p3: Visit him without being noticed (needs a hologram cloak)
  rumi_konya:
    name: Poems spoken and written down by friends
    place: Konya
    figure: Rumi
    story: Having lost his friend Shams, Rumi pours his grief into poems that he speaks aloud and others write down, among them the Masnavi. He dies in Konya in December 1273 with the gathering of his poems still going on.
    relic: A reed flute
    relic_desc: A plain reed flute, its sound thin and low.
    points:
      p1: Hear the flute and the verses (a sensitive employee or a musician)
      p2: Write the verses down as they are spoken (a record keeper, a student or a journalist)
      p3: Stay with him on his last night
  ibn_al_nafis_cairo:
    name: The blood that passes through the lung
    place: Cairo
    figure: Ibn al-Nafis
    story: In Cairo, Ibn al-Nafis writes that blood passes from the right to the left side of the heart through the lungs and not through the wall between. The account is forgotten and found again only in the twentieth century.
    relic: A page of anatomy commentary
    relic_desc: A page of notes on the heart and lungs in small clear script.
    points:
      p1: Follow his reasoning about the blood
      p2: Assist on the hospital ward (medical staff)
      p3: Be the student who believes his reasoning (a kind employee, a student or a teacher)
  al_khwarizmi_baghdad:
    name: The man behind algebra
    place: Baghdad
    figure: Al-Khwarizmi
    story: Al-Khwarizmi writes a short book on solving equations by restoring and balancing, from which algebra takes its name, yet almost nothing is known of his life, not even where he was born.
    relic: A sheet of worked equations
    relic_desc: A sheet of sums solved step by step with squares and roots.
    points:
      p1: Work the long sums by hand (a record keeper or a determined employee)
      p2: Explain the balancing method to a merchant (a teacher or a silver tongued employee)
      p3: Ask where he was born and write the answer down (a curious employee or a journalist)
  ibn_khaldun_cairo:
    name: A preface that outgrew its history
    place: Cairo
    figure: Ibn Khaldun
    story: Ibn Khaldun writes a preface to a history that becomes a study of how societies and economies rise and fade. He loses his wife and daughters in a shipwreck in 1384 and teaches on in Cairo until he dies in 1406.
    relic: A bound volume of lectures
    relic_desc: A heavy volume of notes written for lectures at the college.
    points:
      p1: Sit with a man who has lost his family
      p2: Follow his idea of why cities grow and fade
      p3: Carry his idea forward for the readers who come later (a record keeper, a teacher or a student)
  taqi_al_din_istanbul:
    name: An observatory pulled down
    place: Istanbul
    figure: Taqi al-Din
    story: Taqi al-Din builds an observatory at Istanbul with instruments of his own design, a great clock among them, and begins observations for new star tables. It is pulled down in 1580, only a few years after it began.
    relic: A brass sighting instrument
    relic_desc: A small brass instrument for measuring the height of a star.
    points:
      p1: Build the clock and the instruments (a craftsperson or a sharp mind)
      p2: Take readings through the night
      p3: Stay with the observers on the last night
  ahmed_baba_timbuktu:
    name: A library taken away
    place: Timbuktu
    figure: Ahmed Baba
    story: Ahmed Baba, a scholar of Timbuktu with a library of about sixteen hundred books, is deported to Morocco in 1594. The books are lost, and he is allowed to return only years later.
    relic: A leather bound manuscript
    relic_desc: A manuscript in a worn leather cover with a flap.
    points:
      p1: Look through his shelves
      p2: Count the books as they are packed (a record keeper or a sharp mind)
      p3: Walk beside him on the road unseen (needs a hologram cloak)
  terence_rome:
    name: A play the crowd left
    place: Rome
    figure: Terence
    story: A former slave from Carthage, Terence sees his play The Mother in Law abandoned by its audience twice, first for boxers and rope walkers and then for gladiators. It is heard in full only on the third try.
    relic: A comic mask
    relic_desc: A linen mask with a raised brow, worn by an actor.
    points:
      p1: Talk the noisy crowd back to their seats
      p2: Follow the plot as the actors speak it
      p3: Stay in your seat to the last line
  mohenjo_daro_indus:
    name: Signs no one can read
    place: Mohenjo-daro
    figure: Indus people
    story: In a planned city of brick houses and covered drains, people press short lines of signs into small stone seals. The script has never been deciphered, and we do not know what the signs said or what language they spoke.
    relic: A stone seal
    relic_desc: A small square seal with an animal and a few signs.
    points:
      p1: Study the signs on a seal
      p2: Walk the straight streets and drains (a craftsperson)
      p3: Read the signs of the seal (needs a cyborg neural chip)
  knossos_linear_a:
    name: A script the Minoans left unread
    place: Knossos
    figure: Minoan scribes
    story: A scribe at the palace of Knossos records goods on clay tablets in Linear A, the script of the Minoans. It has never been read, so their language is unknown, while the later Linear B, read in 1952, turned out to write Greek.
    relic: A clay tablet
    relic_desc: A flat tablet with rows of signs and small marks for numbers.
    points:
      p1: Press the signs into wet clay
      p2: Compare the signs on the tablets
      p3: Talk with the scribe in his own tongue (needs a cyborg neural chip)
  antikythera_rhodes:
    name: A machine with no maker's name
    place: Rhodes
    figure: An unknown maker
    story: An unknown maker builds a hand cranked device of more than thirty bronze gears that shows the Sun, the Moon and eclipses. It sinks in a wreck near Antikythera and is understood only in the twentieth century, and nobody recorded who made it.
    relic: A bronze gear
    relic_desc: A small toothed wheel green with age.
    points:
      p1: File the bronze gears (a craftsperson)
      p2: Follow how the gears model the eclipses
      p3: Keep the maker company through the long nights
  sappho_lesbos:
    name: Songs that survive in scraps
    place: Mytilene
    figure: Sappho
    story: Sappho of Lesbos composes songs for the lyre that were gathered in nine books in antiquity. Apart from one whole poem and a few long pieces, only fragments on scraps of papyrus and quotations remain.
    relic: A papyrus fragment
    relic_desc: A torn scrap with a few Greek words in a rounded hand.
    points:
      p1: Hear her sing to the lyre (a sensitive employee or a musician)
      p2: Sit in the circle of her friends
      p3: Hear every word of her dialect (needs a cyborg neural chip)
  aristarchus_alexandria:
    name: The Earth moves, and few listened
    place: Alexandria
    figure: Aristarchus
    story: Aristarchus proposes that the Earth moves around the Sun and measures the sizes of the Sun and the Moon. Almost nobody follows him, and the idea survives in a few lines of Archimedes.
    relic: A sundial plate
    relic_desc: A bronze plate with lines for the hours and the seasons.
    points:
      p1: Follow his geometry of the Sun and Moon
      p2: Stand by the idea when the others laugh
      p3: Make one listener write his idea down (needs a golden apple)
  hipparchus_rhodes:
    name: A star list that was lost
    place: Rhodes
    figure: Hipparchus
    story: Working at Rhodes, Hipparchus compiles a catalogue of about eight hundred and fifty stars and finds the slow shift of the equinoxes. His own writings are lost and we know them through Ptolemy.
    relic: A bronze armillary ring
    relic_desc: A graduated ring used to measure the position of a star.
    points:
      p1: Count the stars with him
      p2: Keep the night watch at the sighting tube
      p3: Copy his star list by hand (a record keeper or a student)
  heron_alexandria:
    name: The steam ball and the temple doors
    place: Alexandria
    figure: Heron
    story: Heron describes a ball that spins when steam escapes from it, doors that open when a fire is lit and a machine that pours holy water for a coin. They stay marvels for temples and entertainments.
    relic: A small bronze ball with two bent pipes
    relic_desc: A hollow ball on a pivot, with two bent pipes for the steam.
    points:
      p1: Fit the pipes and the pivot (a craftsperson)
      p2: Catch him between two demonstrations
      p3: See where the spinning ball could lead
  pliny_stabiae:
    name: The last voyage of a naturalist
    place: Stabiae
    figure: Pliny the Elder
    story: Pliny the Elder, who has finished his huge Natural History in thirty seven books, sails across the bay during the eruption of Vesuvius to look and to help his friends. He dies on the shore, and his nephew writes the account.
    relic: A wax tablet
    relic_desc: A wooden tablet with wax for notes, scratched with a stylus.
    points:
      p1: Ask about his thirty seven books
      p2: Sail across the bay as the ash falls
      p3: Stay beside him on the shore (needs a cyborg bionic lung)
  galen_rome:
    name: The shelves that burned
    place: Rome
    figure: Galen
    story: A fire in 192 destroys storehouses and a library near the Temple of Peace, where Galen kept many of his own writings and other books. Many of his works are lost.
    relic: A charred scroll
    relic_desc: A scroll blackened at one end, the rest still legible.
    points:
      p1: Read his case notes with him
      p2: Tend the patients at his door (medical staff)
      p3: Sit with him over the burnt shelves
  ovid_tomis:
    name: A poet at the edge of the empire
    place: Tomis
    figure: Ovid
    story: Ovid, banished by the emperor Augustus from Rome to Tomis on the Black Sea for a poem and a mistake that was never named, writes homesick verse letters and asks again and again to return. He dies there.
    relic: A wax writing tablet
    relic_desc: A tablet of letters in verse begun on the road to exile.
    points:
      p1: Bring him news from Rome
      p2: Hear the verses he writes on the winter shore
      p3: Speak with him in the local tongue (needs a cyborg neural chip)
  empedocles_akragas:
    name: Four roots, love and strife
    place: Akragas
    figure: Empedocles
    story: Empedocles writes in verse that everything is made of earth, air, fire and water, joined by love and parted by strife. His poems survive only in fragments.
    relic: A scrap of verse
    relic_desc: A strip of papyrus with a few lines in hexameter.
    points:
      p1: Watch the four roots mixed in a jar
      p2: Catch the crowd at the right moment
      p3: Hear the poem through to the end
  democritus_abdera:
    name: Atoms in the empty space
    place: Abdera
    figure: Democritus
    story: Democritus teaches that everything is made of tiny indivisible atoms moving in empty space. Of the dozens of books he wrote, none survives, and we know him from quotations by later writers.
    relic: A pebble and a knife
    relic_desc: A smooth pebble and a small knife for cutting it, as in a thought experiment.
    points:
      p1: Ask what a cut apple is made of
      p2: Find him in his quiet garden
      p3: Copy a roll of his writing (a record keeper, a student or a journalist)
  hildegard_bingen:
    name: Silence in the convent
    place: Bingen
    figure: Hildegard of Bingen
    story: Hildegard, abbess, composer and writer on medicine and nature, is forbidden with her nuns from singing the liturgy for some months because of a dispute over a burial. She dies in September 1179.
    relic: A page of chant
    relic_desc: A page of neumes above Latin words, copied for the nuns.
    points:
      p1: Hear her chants (a musician or a sensitive employee)
      p2: Catch her in a quiet hour
      p3: Sit with her through the silent months
  nezahualcoyotl_texcoco:
    name: A king who wrote songs
    place: Texcoco
    figure: Nezahualcoyotl
    story: Nezahualcoyotl, ruler of Texcoco and a poet, gathers painted books, songs and gardens in his city, and dies in 1472. The archives were later destroyed, and his songs survive in later copies.
    relic: A bark paper page
    relic_desc: A page of bark paper with painted signs and a few lines of song.
    points:
      p1: Hear his songs under the garden trees
      p2: Walk the aqueduct he planned (a craftsperson or a curious employee)
      p3: Copy a song onto a page (a record keeper, a student or a stubborn employee)
  maya_codices_mani:
    name: The books of Mani
    place: Mani
    figure: Maya scribes
    story: At Mani in July 1562 the friar Diego de Landa has Maya books and images burned in the square. Only a handful of painted Maya books survive anywhere.
    relic: A painted bark book
    relic_desc: A folded book of bark paper with painted signs and figures.
    points:
      p1: Look at the painted pages
      p2: Stand in the plaza through the heat of the day
      p3: Sit with an old scribe unseen (needs a hologram cloak)
  rongorongo_rapa_nui:
    name: Tablets nobody can read
    place: Rapa Nui
    figure: Rapa Nui people
    story: Only about two dozen wooden tablets carved with rongorongo signs survive from Rapa Nui. Nobody can read them today, and the people who could died or were taken away in the 1860s.
    relic: A carved wooden tablet
    relic_desc: A flat piece of wood cut with rows of small figures.
    points:
      p1: Study the lines of signs
      p2: Sit with the old people who remember
      p3: Hear the old chants as they are spoken (needs a cyborg neural chip)
  dunhuang_library_cave:
    name: The sealed cave
    place: Mogao Caves
    figure: Dunhuang monks
    story: Around the year 1000 tens of thousands of manuscripts and paintings are walled into a small cave at the Mogao grottoes. No record says why, and the cave is opened again only in 1900.
    relic: A scroll
    relic_desc: A rolled sheet of paper with a sutra copied in a steady hand.
    points:
      p1: Bundle the scrolls for storing (a record keeper or a journalist)
      p2: Read the labels on the bundles
      p3: Stay with the monks while the wall goes up (a kind employee or a record keeper)
  nalanda_library:
    name: A great library, later lost
    place: Nalanda
    figure: The monks of Nalanda
    story: For centuries Nalanda was a great place of study, and travellers such as Xuanzang described its libraries. The library was lost within a few years after the 1190s, and almost nothing of its books remains.
    relic: A palm leaf manuscript
    relic_desc: Narrow leaves threaded on a cord, written with an iron stylus.
    points:
      p1: Walk the halls of the library
      p2: Help the copyists keep the catalogue (a record keeper, a teacher or a student)
      p3: Sit among the monks unseen as they copy by lamp (needs a hologram cloak)
  meroitic_meroe:
    name: An alphabet without a known language
    place: Meroe
    figure: Meroitic scribes
    story: At Meroe, capital of Kush, scribes write in Meroitic, an alphabet that can be sounded out but whose language is still hardly understood.
    relic: A stone with carved signs
    relic_desc: A small block with a line of cursive signs.
    points:
      p1: Compare the cursive and the carved signs
      p2: Watch the stonecutters at work (a craftsperson)
      p3: Read the inscription on the temple wall (needs a cyborg neural chip)
  tupaia_tahiti:
    name: The navigator's chart
    place: Tahiti
    figure: Tupaia
    story: Tupaia, a priest and navigator from Raiatea, joins Captain Cook's ship at Tahiti and draws from memory a chart of some seventy islands across the Pacific. He dies of illness in Batavia in 1770, and his chart was long poorly understood.
    relic: A sketch of islands
    relic_desc: A sheet of ink and wash with small island shapes and names.
    points:
      p1: Share the cramped cabin on the passage
      p2: Watch him draw the chart of the islands
      p3: Learn the island names from him (a seafarer or a kind employee)
  heo_nanseolheon_hanyang:
    name: Poems she asked to burn
    place: Hanyang
    figure: Heo Nanseolheon
    story: Heo Nanseolheon, a young poet of Joseon, dies in 1589 aged twenty six and leaves word that her poems be burned. Her brother Heo Gyun kept what he could and had it printed.
    relic: A sheet of poems
    relic_desc: A sheet of fine paper with brushed poems on flowers and distant places.
    points:
      p1: Read her poems in her room
      p2: Sit with her on a quiet evening
      p3: Learn her poems by heart (a record keeper or a student)
  ghalib_delhi:
    name: Debts, a pension and a mango
    place: Delhi
    figure: Mirza Ghalib
    story: Ghalib, one of the great Urdu and Persian poets, lives in Delhi in debt on a pension that is disputed, and sees little of his poetry printed. He is praised far more after his death.
    relic: A page of ghazals
    relic_desc: A page of Urdu verse in his own hand, with corrections.
    points:
      p1: Bargain with the moneylender at the door
      p2: Hear a ghazal read aloud (a sensitive employee or a musician)
      p3: Share a mango and a verse with him
  savitribai_phule_pune:
    name: A school for girls
    place: Pune
    figure: Savitribai Phule
    story: Savitribai Phule opens a school for girls in Pune in 1848 with her husband Jotirao and teaches there. On the road to it she is insulted and has dirt thrown at her, and she keeps going.
    relic: A slate
    relic_desc: A small slate with a first row of letters in chalk.
    points:
      p1: Walk with her past the jeering onlookers
      p2: Talk a family into sending their daughter
      p3: Teach one lesson beside her (a teacher or a kind employee)
  zhu_shijie_yangzhou:
    name: A mathematician whose books went missing
    place: Yangzhou
    figure: Zhu Shijie
    story: Zhu Shijie, a wandering teacher of mathematics, publishes the Jade Mirror of the Four Unknowns in 1303 with methods for equations of several unknowns. His books were lost in China for centuries and one was recovered from a Korean reprint.
    relic: A set of counting rods
    relic_desc: Slender rods laid in rows to stand for numbers.
    points:
      p1: Follow the four unknowns
      p2: Teach the counting rods to a pupil (a teacher)
      p3: Stay with the lesson to the end (a teacher, a student or a stubborn employee)
eras:
  broad_street_1854:
    name: Broad Street, London 1854
    short: Broad St.
    place_name: Broad Street, Soho, London
    tags:
      - medical
      - infection
      - cholera
      - c19
      - london
      - history
    event_titles:
      door_block: Turned away at the door
      time_strain: Time slip
    plots:
      microscope:
        name: Give Snow a microscope
        desc: Lets him show people what is in the water more clearly.
        character: John Snow
        article: people:snow
      germ_theory:
        name: Explain germ theory to Snow
        desc: Needs the craft of microbiology, which this era does not have.
        character: John Snow
        article: people:snow
    blurb: Cholera, one pump, and a doctor nobody has listened to yet. Close, cheap, and the effect of hygiene and medicine is clear.
    handle_label: Pump handle removed
    protagonist: John Snow
    protagonist_role: A doctor who has said for three years that cholera comes from drinking water
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On the night of 31 August 1854, cholera broke out around Broad Street in Soho, London.
          check: true
        - text: The popular explanation was miasma, bad air.
          check: true
        - text: Snow had already proposed in 1849 that cholera spreads through water. Most colleagues did not accept it.
          check: true
        - text: On 8 September the handle of the Broad Street pump was removed.
          check: true
        - text: By the time the handle was removed the outbreak was already declining and many residents had left.
          check: true
      regret:
        - You can save today's patients but not tomorrow's. On the main timeline the handle came off on day eight.
        - Data and maps matter more than medicine, but making people believe data takes time.
    events:
      door_block_stubborn: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, is thrown out of one house and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_stubborn_empty: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, and is thrown out.
      door_block_insist_empty: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, and is pushed out.
      door_block_insist: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, is pushed out, and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_appeal: A neighbour blocks the door, saying it is miasma. {staff} does not force the way, turns and goes to Snow to ask him to speak up.
      door_block_yield: A neighbour blocks the door, saying it is miasma. {staff} steps back without a quarrel, and half a day is wasted.
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: Convince Snow
      trust: Win the trust of the street
      handle: Have the pump handle removed ahead of history
    milestones:
      first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
