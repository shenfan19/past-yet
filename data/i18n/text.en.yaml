  welcome:
    title: Welcome
    office_title: Game setup
    acknowledge: I understand
    story:
      - You run a time-travel agency. Recruit employees and send them into the past.
      - Stand guard at moments when history could go another way, and mend what it left undone in a parallel timeline.
      - The moments you guard and the regrets you mend earn you time energy. Gather enough to return to the future and reunite with your family.
    story_start: It all begins at the bronze statue of Dr Sun Yat-sen at Sun Yat-sen University. In memory of Dr Sun Yat-sen on the 160th anniversary of his birth.
    how_title: How to play
    how:
      - Pick a place on the map and the time you want there. The clock starts when the first trip goes out.
      - Choose who goes and what they carry, then send them.
      - Wait for the staff to return and read their reports. They bring back time energy and sometimes antiques. Transfer antiques to the institute to receive research funding.
      - An antique opens the place it points to, and it only leads to earlier times.
