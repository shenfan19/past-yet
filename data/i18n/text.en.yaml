    event_titles:
      asked_the_way: Asked the way
    plots: {}
    blurb: One hall and two things being made in it, a university and a book. Seven months, from the order to join the schools to eighteen days before classes begin. This is where the game begins.
    handle_label: The records become one book
    protagonist: Sun Yat-sen
    protagonist_role: A statesman who has ordered three schools joined into one university, and lectures in their hall on Sundays
    stay: Stay seven office days, 210 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it.
          check: true
        - text: From 27 January to 24 August 1924 Sun lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all. Huang Changgu took each one down, Zou Lu read the fair copies and pasted slips on them, and Sun corrected them in his own hand.
          check: true
        - text: Zou Lu took up the preparation on 21 February. On 24 February he called the students of the three schools together in the hall to announce it, and the first preparatory meeting was held on 3 March, with the graduation of the students of the three schools on its agenda.
          check: true
        - text: The first lectures were printed as a pamphlet at the end of March, with a preface Sun wrote on 30 March. On 3 June Zou Lu submitted the measures for joining the schools, and they were approved on 6 June.
          check: true
        - text: Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote. Sun died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.
          check: true
      regret:
        - You leave on 1 September. Classes begin on the 19th, and the motto is written after that.
        - The lectures stopped at the sixteenth. Nobody in the hall knew it was the last.
    events:
      asked_the_way: '{date}: A new student with a letter asks {staff} the way to an office. {staff} does not know either, and they look for it together for half the morning.'
      asked_the_way_shown: '{date}: A new student with a letter asks {staff} the way to an office. {staff} shows it on the sheet, and the student thanks them and goes off with the sheet in hand.'
    star_points:
      site: A map of the sites handed to the office before the new campus is chosen
      copy: Bring home a copy of the book of the lectures
      last: Be there for the last lecture
    milestones:
      order_given: '{date}: Sun Yat-sen orders the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and names Zou Lu to prepare it. Nobody in the city can yet say where this university is.'
      sun_dies: '{date}: Sun Yat-sen dies in Beijing.'
      renamed: '{date}: The National Government orders National Guangdong University renamed National Sun Yat-sen University.'
      lecture_jan27: '{date}: A Sunday. Sun Yat-sen gives the first of his lectures on the Three Principles of the People in the hall of the Higher Normal School.'
      lecture_feb17: '{date}: A Sunday. Sun Yat-sen lectures in the hall of the Higher Normal School. The series began on 27 January and this is the fourth lecture. At the side of the platform a man writes without looking up. That is Huang Changgu, who is there for every one.'
      zou_takes_up: '{date}: Zou Lu takes up the preparation.'
      hall_feb24: '{date}: A Sunday again. The fifth lecture is given in the hall today, and Zou Lu calls the students of the three schools together here to announce the preparation.'
      first_meeting: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad.'
      first_meeting_book: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad. In this branch the names of the graduating classes of the three schools are by now in one book.'
      proofs_travel: Through March the text of the lectures goes from hand to hand. The notes of Huang Changgu are copied fair and sent to Sun Yat-sen, he has them carried to Zou Lu to be read, Zou Lu pastes slips on the pages and sends them back, Sun corrects them in his own hand, and they come round again.
      preface: '{date}: Sun Yat-sen writes the preface for the pamphlet of the first lectures. It is printed at the end of March.'
      lecture_apr20: '{date}: A Sunday. The lectures in the hall have reached their second part.'
      measures_sent: '{date}: Zou Lu submits the measures for joining the three schools.'
      measures_approved: '{date}: The measures are approved.'
      shipai_chosen: In this year Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, east of the city. The schools are spread over several places and hard to run.
      last_lecture: '{date}: The sixteenth lecture. The third part has reached only its fourth lecture, and the rest is never given. Nobody in the hall knows this is the last.'
      classes_begin: '{date}: Classes begin at National Guangdong University.'
      ceremony: '{date}: The founding ceremony is held, with the motto Sun Yat-sen wrote: study widely, enquire carefully, think prudently, discern clearly, practise earnestly. He is not there, and he leaves Guangzhou two days later.'
      sunday_first: '{date}: {staff} is pressed in at the very back of the hall, a long way from the platform, able to see the man and unable to hear all of it.'
      sunday_stall: '{date}: {staff} cannot get into the hall and sets up a stall at the door. When the hall empties the crowd pours out, and everything is sold in no time.'
      sunday_sit: '{date}: {staff} finds a place in a back row of the hall and sits from the first word to the last without moving.'
      records_begun: '{date}: {staff} begins to copy the records of the three schools into one book.'
      records_read_aloud: '{date}: Nobody can read the hand of {staff}. So {staff} reads the names out and a clerk writes, and the three records begin to become one.'
      records_shut: '{date}: Copying the records takes reading, and {staff} has no part in it, but comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask {staff} than to turn the pages.'
      site_offered: '{date}: Taken in by the office by now, {staff} draws the sites they have walked on one sheet, with the open ground at Shipai east of the city, and hands it to a clerk. In this branch the sheet lies with the papers on the new campus.'
      site_offered_bold: '{date}: Not yet asked inside, {staff} stops a clerk at the door of the office, says the open ground at Shipai east of the city is wide and the roads reach it, and goes over the sheet of the sites. The clerk keeps the sheet.'
      records_done: '{date}: The records of the three schools are one book, before the first preparatory meeting.'
      records_late: '{date}: The records of the three schools are one book. The first preparatory meeting has already been held.'
      sites_done: '{date}: {staff} has walked every one of the sites scattered over the city and drawn them on one sheet, with how long it takes to walk from each to the next.'
      asked_inside: '{date}: The clerks no longer leave {staff} waiting at the door, and call them in.'
      copy_kept: '{date}: {staff} wraps the pamphlet and puts it in with their things.'
      exhausted: '{date}: {staff} is so tired their hands shake, and has to rest.'
      spoiler: '{date}: {staff} knows that in two years this school will take the name of the man who ordered it. {staff} writes the sentence on the last page of the notebook and closes it.'
      spoiler_said: '{date}: {staff} tells a clerk at his copying that in two years this school will take the name of the man who ordered it. The clerk does not look up. The man is still alive, he says, and who names a school like that.'
      errand: '{date}: Pages with slips pasted on them go in and out of the copying room. {staff} is outside and sees only the back of whoever carries them.'
      errand_carried: '{date}: In this branch, the one sent to carry the pages is once {staff}. A sheaf of paper with slips pasted on it goes from one end to the other, and not a sheet is creased.'
      errand_frail: '{date}: {staff} is out of breath after a few stairs and cannot carry the pages, and sits at the door of the copying room watching the pages with their slips go in and out.'
      pamphlet: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. {staff} sees the cover through the window.'
      pamphlet_traded: '{date}: {staff} trades what they make with their own hands for a copy of the pamphlet, new from the printer.'
      pamphlet_given: '{date}: A clerk hands {staff} a copy of the pamphlet, new from the printer, and says everyone in the room is to have one.'
      homesick_may: '{date}: A month with nothing on record. {staff} keeps a tally in the notebook, and it reaches a hundred days. At the office a little over three days have gone by.'
      shipai_walk: '{date}: {staff} hears that the new campus is to be at Shipai, east of the city, and does not get there on this trip.'
      shipai_reached: '{date}: {staff} walks out of the city to the east and reaches Shipai. {staff} knows what will stand here, stays a long while, and draws what is here now.'
      shipai_frail: '{date}: {staff} knows what will stand at Shipai, east of the city. It is too far, and {staff} cannot walk it.'
      last_seat: '{date}: {staff} hears this lecture out from the usual place, and stays sitting a while after the hall has emptied.'
      last_stall: '{date}: {staff} brings more to the door of the hall than on other Sundays. {staff} knows that on the Sundays to come there will not be such a crowd at this door.'
    summary:
      near_death: '{staff} falls ill in Guangzhou, is pulled back by the recall charm, and wakes before the statue.'
      stay_and_gifts: '{staff} finished the work and did not come back. They left a note saying they want to stay and see the university open. Gifts will arrive later.'
      gave_up: '{staff} did not last to the end and woke before the statue, saying they could not stay in the Guangzhou of 1924 any longer.'
      legend: '{staff} woke before the statue with a pamphlet printed in March 1924 among their things. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      perfect: '{staff} came back to the statue. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      modest: '{staff} spent two hundred and ten days in Guangzhou, did what was within reach, and stood before the statue again. On the day they left, classes were {countdown:i} days away.'
    quotes:
      near_death:
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: Seven months is too long.
      legend:
        - trait: curious
          text: So that is how a book is made, a page corrected at a time.
        - text: When I left they had not yet begun classes.
      perfect:
        - trait: kind
          text: The people who came asking were answered in the end.
        - text: Did what had to be done.
      modest:
        - trait: glib
          text: I said the name would change in two years. Nobody believed me.
        - text: I was only there.
    hints:
      frail: This employee is frail and cannot walk the sites in the city, so there is no map to hand in for the first star. Send one who can walk.
      empty: A compass makes the walking of the sites quicker, so the map is more likely ready before the new campus is chosen.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
