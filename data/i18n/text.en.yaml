    plots: {}
    blurb: One hall and two things being made in it, a university and a book. Seven months, from the order to join the schools to eighteen days before classes begin. This is where the game begins.
    handle_label: The records become one book
    protagonist: Sun Yat-sen
    protagonist_role: A statesman who has ordered three schools joined into one university, and lectures in their hall on Sundays
    stay: Stay seven office days, 210 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it.
          check: true
        - text: From 27 January to 24 August 1924 Sun lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all. Huang Changgu took each one down, Zou Lu read the fair copies and pasted slips on them, and Sun corrected them in his own hand.
          check: true
        - text: Zou Lu took up the preparation on 21 February. On 24 February he called the students of the three schools together in the hall to announce it, and the first preparatory meeting was held on 3 March, with the graduation of the students of the three schools on its agenda.
          check: true
        - text: The first lectures were printed as a pamphlet at the end of March, with a preface Sun wrote on 30 March. On 3 June Zou Lu submitted the measures for joining the schools, and they were approved on 6 June.
          check: true
        - text: Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote. Sun died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.
          check: true
      regret:
        - You leave on 1 September. Classes begin on the 19th, and the motto is written after that.
        - The lectures stopped at the sixteenth. Nobody in the hall knew it was the last.
    events:
      asked_the_way: '{date}: A new student with a letter asks {staff} the way to an office. {staff} does not know either, and they look for it together for half the morning.'
      asked_the_way_shown: '{date}: A new student with a letter asks {staff} the way to an office. {staff} shows it on the sheet, and the student thanks them and goes off with the sheet in hand.'
