      expedition_send: Before Owen leaves, {staff} hands him the parcel and tells Louisa to mark the receipt pending. The pickup table gets its bundle first.
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: Convince Seacole
      trust: Win the trust of the camp
      reform: Bring forward the simulated collection schedule
    milestones:
      cathcart_evening: '{date}: Seacole recalls leaving the British Hotel after dark for Cathcart’s Hill and returning after midnight.'
      wounded_road: '{date}: Seacole describes setting out from Spring Hill and helping wounded people near the temporary hospital by the Woronzoff Road.'
      first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
      first_protect: '{date}: {staff} hands out the first clean water and washes down a few tents, and teaches the men to boil what they drink.'
      met_seacole: '{date}: {staff} is received by Seacole.'
      seacole_trusts: '{date}: Seacole gives {staff} the notes to work from.'
      seacole_convinced: '{date}: Seacole takes up the plan that {staff} put to her.'
      board_moves: '{date}: Word goes round that the plan might change.'
      reform_history: '{date}: The simulation sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The simulated parcel collection starts {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: The officers no longer keep {staff} out, and some send men to them.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of sick men in the camp falls to single digits.'
    summary:
      near_death: '{staff} collapses in the camp and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these men a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend at Balaklava. The camp stores opened to Seacole {advance_days:1} days before the model’s baseline.'
      perfect: '{staff} completed the task at Balaklava and came back safe. The simulation records {base_D:i} deaths in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away at the door again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days at Balaklava, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was sitting with the sick at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told her what she needed to hear.
      perfect:
        - trait: kind
          text: I could save today's patients, not tomorrow's.
        - trait: curious
          text: So that is how it is, clean water and a steady hand do a great deal.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they believe it is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Chlorine was left over. The limit was the trust of the camp, not the supplies. Let the employee help patients first to build trust.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or patients were not let in.
      ally_gap: Seacole's evidence is still thin. The handbook helps her, provided the employee spends time with her.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  sun_yat_sen_1924:
    labels:
      sick: Matters still open
      dead: Matters nobody asks about any more
      deaths: Matters that lapsed
      treated: Records in one book, percent
      protected: Sites walked, percent
    identities:
      local_scholar:
        name: a helper in the copying room
        cover: '{staff} says they have had some schooling, write a fair hand and would gladly help with the copying.'
      pen:
        name: a reporter from outside
        cover: '{staff} says they write for a newspaper elsewhere and want to see how the new university is made.'
      wanderer:
        name: a wanderer come to hear the lectures
        cover: '{staff} says they are on the road, heard that someone speaks here on Sundays, and have come to listen.'
      maker:
        name: someone selling at the door of the hall
        cover: '{staff} says they have a trade and would like to set up where the crowd is.'
      far_guest:
        name: a guest off a ship
        cover: '{staff} says they came with a ship and will be in Guangzhou for a while.'
    personal:
      records_read_aloud:
        s_fan: '{date}: Shen Fan writes a hand he has to guess at himself. He reads the names out and a clerk writes, and as they go he marks every name that stands in two of the three records.'
        s_somchai: '{date}: Somchai can read, but his hands are clumsy and nobody can make out what he writes. He reads the names out and a clerk writes. At the temple, when the others were up mending the roof, he was the one who held the ladder.'
      sunday_first:
        s_fan: '{date}: Shen Fan is pressed in at the very back of the hall and cannot hear all of it, so he counts how many are in the hall and how many are taking notes, and writes the two numbers down.'
        s_samuel: '{date}: Samuel is pressed in at the very back of the hall, taking notes on tiptoe. He is too far off, and half of what he writes down is the faces of the people listening.'
        s_amara: '{date}: Amara is pressed in at the very back of the hall and cannot hear all of it. A student beside her has stood too long and turns faint. She helps him sit and counts at his wrist for a while.'
      spoiler:
        s_fan: '{date}: Shen Fan knows that in two years this school will take the name of the man who ordered it, and that a hundred years on he will set out from its statue. He writes the two sentences on the last page of the notebook and closes it.'
        s_guilan: '{date}: Guilan knows that in two years this school will change its name. She cannot write the characters, so she says them over once in her head and tells nobody.'
        s_somchai: '{date}: Somchai knows that in two years this school will take the name of the man who ordered it. He writes the sentence on the last page of the notebook, closes it, and goes to ask a clerk what he is reading.'
        s_carlos: '{date}: Carlos knows that in two years this school will change its name. He cannot write it down, so he tells it to the oven, and laughs before he has finished.'
        s_samuel: '{date}: Samuel knows that in two years this school will change its name, a piece of news nobody else has. He writes it on the last page of the notebook and crosses it out again. There is nowhere to file it.'
        s_amara: '{date}: Amara knows that in two years this school will change its name. She writes the sentence on the last page of the notebook and closes it.'
      pamphlet_given:
        s_fan: '{date}: A clerk hands Shen Fan a copy of the pamphlet, new from the printer, and says everyone in the room is to have one. Shen Fan turns to the preface first and looks at the date under it.'
        s_samuel: '{date}: A clerk hands Samuel a copy of the pamphlet, new from the printer. He asks which printing it is, and the clerk says, the first.'
      errand_frail:
        s_fan: '{date}: Shen Fan is out of breath after a few stairs and cannot carry the pages. He sits at the door of the copying room and counts how many times one text goes round.'
        s_somchai: '{date}: Somchai is out of breath after a few stairs and cannot carry the pages. He sits at the door of the copying room and watches the pages with their slips go in and out.'
        s_samuel: '{date}: Samuel has had his stomach trouble again for some days and is out of breath after a few stairs. He sits at the door of the copying room and notes the hour of every carrying of the pages.'
      homesick_may:
        s_fan: '{date}: A month with nothing on record. Shen Fan keeps a tally in the notebook until it reaches a hundred days, then works it out again beside it. At the office a little over three days have gone by.'
        s_guilan: '{date}: A month with nothing on record. Guilan counts the days. At home the chillies should be going into the ground about now. At the office a little over three days have gone by.'
        s_somchai: '{date}: A month with nothing on record. Somchai still wants to see snow once, and there is none in Guangzhou in May. At the office a little over three days have gone by.'
        s_carlos: '{date}: A month with nothing on record. Carlos wakes at three every morning. His oven is not here, and he stands a whole morning by the stove of someone else, watching. At the office a little over three days have gone by.'
        s_samuel: '{date}: A month with nothing on record, the hardest kind for a reporter. Samuel keeps a tally in the notebook, and it reaches a hundred days. At the office a little over three days have gone by.'
        s_amara: '{date}: A month with nothing on record. Amara works out how many children the ward must have seen born in these hundred days. At the office a little over three days have gone by.'
        s_jeanluc: '{date}: A month with nothing on record. Jean-Luc writes a line a day, as in a log at sea, until there are a hundred. At the office a little over three days have gone by.'
      shipai_frail:
        s_fan: '{date}: Shen Fan knows what will be built at Shipai, east of the city. It is too far, and he cannot walk it.'
        s_somchai: '{date}: Somchai knows what will stand at Shipai, east of the city. It is too far, and he cannot walk it.'
        s_samuel: '{date}: Samuel knows what will stand at Shipai, east of the city, and that it would make a good piece. It is too far, and he cannot walk it.'
      last_seat:
        s_fan: '{date}: Shen Fan hears this lecture out from the usual place, and the count in his notebook stops at sixteen. He stays sitting a while after the hall has emptied.'
        s_guilan: '{date}: Guilan hears this lecture out from the usual place. When the hall has emptied she does not go at once, and sets the benches straight one by one.'
        s_somchai: '{date}: Somchai hears this lecture out from the usual place. He stays sitting a while after the hall has emptied, as he used to wait at the temple for the last bell.'
        s_samuel: '{date}: Samuel takes this lecture down from the usual place. He knows it is the last, and in the notebook he writes only its number and not the word last.'
        s_amara: '{date}: Amara hears this lecture out from the usual place. She stays sitting a while after, until the last person has gone out of the door.'
        s_jeanluc: '{date}: Jean-Luc hears this lecture out standing in the usual place. He is the last to leave the hall, as a captain is the last off the ship.'
      records_shut:
        s_guilan: '{date}: Guilan left school after the third year, and has no part in copying the records. She comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask her than to turn the pages.'
        s_carlos: '{date}: Carlos writes only his own name, and has no part in copying the records. He comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask him than to turn the pages.'
      sunday_sit:
        s_guilan: '{date}: Guilan sits down in a back row of the hall, bad knees and all, and stays from the first word to the last. She does not follow everything said on the platform. The student beside her is thirsty, and she hands over her water.'
        s_somchai: '{date}: Somchai listened to sermons at the temple for twenty years, and sits in a back row of the hall to the very end. As it empties he asks the student beside him what he has been reading.'
        s_jeanluc: '{date}: Jean-Luc has a bad back and insists on standing, and stands at the back of the hall from the first word to the last.'
      pamphlet:
        s_guilan: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Guilan sees it through the window and knows two of the characters on the cover.'
        s_somchai: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Somchai sees the cover through the window. He knows how many copies of this book there will one day be, and asks the clerk only how far he has got in it.'
        s_amara: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Amara sees it through the window and begins to hum.'
        s_jeanluc: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Jean-Luc sees the cover through the window.'
      errand:
        s_guilan: '{date}: Pages with slips pasted on them go in and out of the copying room. Guilan sits outside trimming vegetables and asks everyone who comes out whether they have eaten.'
        s_amara: '{date}: Pages with slips pasted on them go in and out of the copying room. Amara is outside and sees only the back of whoever carries them, and can tell from the footsteps that he is in a hurry.'
        s_jeanluc: '{date}: Pages with slips pasted on them go in and out of the copying room. Jean-Luc is outside teaching the child of a gatekeeper to tie knots, and sees only the back of whoever carries them.'
      shipai_reached:
        s_guilan: '{date}: Bad knees and all, Guilan walks to Shipai a step at a time. There are only fields. She squats, rubs a pinch of soil between her fingers and says things will grow here.'
        s_carlos: '{date}: Carlos pushes his cart out of the city to the east and reaches Shipai, and comes back saying there are only fields there. He knows a university will be built there, and still he says, only fields.'
        s_amara: '{date}: Amara walks out of the city to the east and reaches Shipai. She knows what will stand here, stays a long while, and draws what is here now, slowly.'
      sunday_stall:
        s_carlos: '{date}: Carlos does not understand what is being said inside, and sets up an oven at the door of the hall to bake bread. When the hall empties the crowd pours out and the bread is gone in no time, sold too cheap as usual.'
      pamphlet_traded:
        s_carlos: '{date}: Carlos trades an ovenful of bread for a copy of the pamphlet, new from the printer. He cannot read it himself, and says it is for the child at home who wants to take over the bakery.'
      errand_carried:
        s_carlos: '{date}: In this branch, the one sent to carry the pages is once Carlos. A sheaf of paper with slips pasted on it, of which he cannot read a word, and not a sheet is creased.'
      last_stall:
        s_carlos: '{date}: Carlos bakes one ovenful more than usual. He knows that on the Sundays to come there will not be such a crowd at this door, and gives away what is left.'
      records_begun:
        s_amara: '{date}: Amara begins to copy the records of the three schools. Written work has always been hard for her, so she copies a line and has a clerk check a line.'
      spoiler_said:
        s_jeanluc: '{date}: Jean-Luc tells a clerk at his copying that in two years this school will take the name of the man who ordered it, and does not raise his voice to say it. The clerk does not look up. The man is still alive, he says, and who names a school like that.'
      shipai_walk:
        s_jeanluc: '{date}: Jean-Luc hears that the new campus is to be at Shipai, east of the city. His knees will not take him so far, and he stands a while on the quay looking east.'
    name: Guangzhou, 1924
    short: Guangzhou
    place_name: Guangzhou, the hall of the Higher Normal School
    tags:
