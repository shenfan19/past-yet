    desc: One packet makes a litre. Used to treat patients, two packets per patient.
  chlorine_tablet:
    name: Chlorine tablet
    desc: One tablet makes the drinking water of five people safe. Light and cheap, but someone has to listen to you.
  handbook:
    name: Modern care handbook
    desc: Raises treatment skill. Also a gift for the local doctor.
  recall_charm:
    name: Recall charm
    desc: Pulls a dying employee back. Without it, all gear is lost.
  detox_water:
    name: All purpose antidote water
    desc: A modern solution that neutralises many common poisons. Pricier than rehydration salts, but one bottle is worth three packets.
  disinfectant:
    name: Disinfectant
    desc: Modern disinfectant. One bottle makes the water or hands of a dozen people safe.
  heart_monitor:
    name: Heart rate monitor
    desc: Worn by the employee, it spots overwork early so fatigue builds more slowly.
  radiation_shield:
    name: Radiation shield
    desc: A protective device from the future. No era leads there yet.
  bamboo_copter:
    name: Bamboo copter
    desc: A meme. The name borrows from someone else's work, not for sale until checked.
  neural_chip:
    name: Cyborg neural chip
    desc: A chip behind the ear that translates any language and speeds up learning. Hard to hide.
  cyber_arm:
    name: Cyborg arm
    desc: A prosthetic arm with far more strength than a person has. It shows.
  cyber_lung:
    name: Cyborg bionic lung
    desc: An artificial lung for long hours of hard work. It hums softly.
  gorilla_arm:
    name: Cyborg gorilla arm
    desc: A huge, absurdly strong arm. Everyone looks.
  holo_cloak:
    name: Hologram cloak
    desc: A cloak that bends light so that people look past you. It lowers the chance of being found out.
  golden_apple:
    name: Golden apple
    desc: A golden apple out of a myth. Whoever hears you out is moved. Your power to persuade is tripled.
  elixir:
    name: Elixir
    desc: A bright potion that eases pain and restores strength.
antiques:
  pump_rust:
    name: Rust flake from the Broad Street pump
    desc: A flake of rust scraped off an old pump. Hold it and you can find a street in September.
  clinic_bell:
    name: Brass bell from the maternity ward
    desc: A bell with no clapper. Hold it and you can find a ward in spring.
  royal_comb:
    name: Pearl studded comb
    desc: A comb with one very long hair caught in its teeth.
staff:
  s_ning:
    name: Xiaoyu Ning
    job: Nurse
    bio: Used to be a nurse. Stubborn, cannot bear to see a patient with nobody looking after them.
  s_zhou:
    name: Jianguo Zhou
    job: Builder
    bio: Worked construction. Strong, a talker, does not like going around things.
  s_lin:
    name: Zhiyao Lin
    job: Graduate student
    bio: Reads a lot, wants to understand everything, gets homesick first.
  s_qian:
    name: Shouren Qian
    job: Antique dealer
    bio: Used to trade in second hand goods. Sharp eyes, knows what anything is worth at a glance.
  s_amara:
    name: Amara Okafor
    job: Midwife
    bio: Has delivered hundreds of babies and stays calm when everyone else panics.
  s_kenji:
    name: Kenji Mori
    job: Software engineer
    bio: Debugs for a living and cannot leave a loose end alone.
  s_isabella:
    name: Isabella Rossi
    job: Retired teacher
    bio: Forty years of teaching taught her to explain anything twice, and kindly.
  s_tariq:
    name: Tariq Hassan
    job: Driver
    bio: Knows every back street, and how to talk his way past a closed door.
  s_meiling:
    name: Mei-Ling Chen
    job: Art student
    bio: Sketches everything she sees and asks why about the rest.
  s_lars:
    name: Lars Nilsson
    job: Shipwright
    bio: Builds things to last and does not like to be hurried.
  s_priya:
    name: Priya Sharma
    job: Pharmacist
    bio: Reads every label twice and counts the dose a third time.
  s_diego:
    name: Diego Fernández
    job: Street musician
    bio: Can draw a crowd with one guitar, and misses his mother's cooking.
  s_olga:
    name: Olga Petrova
    job: Retired physician
    bio: Practised for fifty years and trusts her own eyes over any manual.
  s_samuel:
    name: Samuel Mensah
    job: Journalist
    bio: Asks the question nobody else dares to, and writes the answer down at once.
  s_minji:
    name: Min-ji Park
    job: Chef
    bio: Feeds everyone first and sits down last.
  s_jeanluc:
    name: Jean-Luc Moreau
    job: Retired sea captain
    bio: Has weathered worse storms and gives orders without raising his voice.
  s_fatima:
    name: Fatima Al-Sayed
    job: Archivist
    bio: Finds the one page that matters in a room full of boxes.
  s_tom:
    name: Tom Becker
    job: Apprentice mechanic
    bio: Takes apart every machine he meets, and puts it back together, mostly.
  s_wanjiru:
    name: Wanjiru Kamau
    job: Data analyst
    bio: Is the first to see the pattern in the numbers.
  s_ricardo:
    name: Ricardo Silva
    job: Retired fisherman
    bio: Waits for the tide without hurry and tells long stories while he does.
traits:
  kind: Kind
  stubborn: Stubborn
  curious: Curious
  glib: Silver tongued
  sensitive: Sensitive
  bold: Bold
trait_notes:
  kind:
    pro: Earns trust and gives care that counts.
    con: Easily hurt by hostility, and gives way too soon.
  stubborn:
    pro: Holds on when pushed and does not give up.
    con: Rigid, and poor at bringing others round.
  curious:
    pro: Notices things and asks what nobody else asks.
    con: Easily pulled away from what has to be done.
  glib:
    pro: Talks their way in and brings people round.
    con: A smooth tongue is not always trusted.
  sensitive:
    pro: Notices what is wrong, and feels what others feel.
    con: A weak constitution, so disease catches on more easily.
  bold:
    pro: Pushes through resistance and danger.
    con: Careless, and misses what should have been noticed or cared for.
mainline:
  open:
    name: Opening day
    desc: The agency opens. One shopfront, three employees.
  first_trip:
    name: First trip
    desc: An employee brings back the first time energy.
  reputation:
    name: A name
    desc: The neighbours start to mention the agency.
  far_past:
    name: Further back
    desc: Enough energy to open up more distant times.
  home:
    name: Home
    desc: Enough energy. The boss can go back to their own time and see their family.
quotes:
  newton:
    who: Isaac Newton
    quote: If I have seen further, it is by standing on the shoulders of giants.
  einstein:
    who: Albert Einstein
    quote: The important thing is not to stop questioning.
  faraday:
    who: Michael Faraday
    quote: Nothing is too wonderful to be true, if it be consistent with the laws of nature.
  feynman:
    who: Richard Feynman
    quote: The first principle is that you must not fool yourself, and you are the easiest person to fool.
  pasteur:
    who: Louis Pasteur
    quote: Chance favours only the prepared mind.
  carr:
    who: E. H. Carr
    quote: History is a continuous process of interaction between the historian and his facts, an unending dialogue between the present and the past.
  santayana:
    who: George Santayana
    quote: Those who cannot remember the past are condemned to repeat it.
  ranke:
    who: Leopold von Ranke
    quote: History wants only to show how it actually was.
  simaqian:
    who: Sima Qian
    quote: To examine the relation between heaven and man, to trace the changes from antiquity to the present, and to complete a school of one's own.
  hippocrates:
    who: Hippocrates
    quote: Life is short, the art long.
  thucydides:
    who: Thucydides
    quote: This work was composed as a possession for all time.
catalog:
  pythagoras_croton:
    name: A school where number is the nature of things
    place: Croton, southern Italy
    figure: Pythagoras
    story: In Croton a community studies mathematics, music and living as one discipline, and ratios become the key to harmony.
    relic: A monochord string
    relic_desc: A single taut string that can be stopped at simple ratios.
  thales_miletus:
    name: Explaining nature without gods
    place: Miletus, Ionia
    figure: Thales
    story: Thales of Miletus looks for natural causes of things, and tradition says he foretold a solar eclipse.
    relic: An amber bead
    relic_desc: Rubbed on cloth, it picks up feathers, the oldest puzzle of electricity.
  socrates_athens:
    name: A life of questions
    place: Athens
    figure: Socrates
    story: Socrates spends his life asking what justice and virtue are, and at his trial chooses his questions over his safety.
    relic: A plain clay cup
    relic_desc: An ordinary cup, kept because of what the last evening was.
  hippocrates_kos:
    name: Medicine as careful observation
    place: Kos
    figure: Hippocrates
    story: On Kos a physician and his school teach that disease has natural causes and must be watched at the bedside.
    relic: A bronze probe
    relic_desc: A thin tool of a doctor who preferred looking to guessing.
  plato_academy:
    name: The first school of its kind
    place: Athens
    figure: Plato
    story: Plato founds the Academy in a grove outside Athens, a place to study mathematics and philosophy together.
    relic: A wax writing tablet
    relic_desc: A wooden tablet whose notes can be smoothed away and rewritten.
  aristotle_lyceum:
    name: Sorting the living world
    place: Athens
    figure: Aristotle
    story: At the Lyceum Aristotle and his students describe animals and plants and lay out the first systematic logic.
    relic: A labelled seashell
    relic_desc: A shell from a collection where every specimen carries a Greek name.
  euclid_alexandria:
    name: Geometry from a few axioms
    place: Alexandria
    figure: Euclid
    story: Euclid gathers the geometry of his time into the Elements, building everything from a few plain starting points.
    relic: A bronze compass
    relic_desc: Two arms and a pivot, enough to draw every figure in the book.
  archimedes_syracuse:
    name: Buoyancy and the lever
    place: Syracuse, Sicily
    figure: Archimedes
    story: Archimedes works out why things float, and tradition says the answer came to him in a bath.
    relic: A bath sponge
    relic_desc: A humble sponge from the story of the bath.
  eratosthenes_alexandria:
    name: Measuring the Earth with shadows
    place: Alexandria and Syene
    figure: Eratosthenes
    story: By comparing noon shadows in two cities Eratosthenes estimates the size of the Earth, and gets surprisingly close.
    relic: A gnomon rod
    relic_desc: A plain upright rod whose shadow told him the angle of the sun.
  hypatia_alexandria:
    name: Teaching mathematics and astronomy
    place: Alexandria
    figure: Hypatia
    story: Hypatia teaches mathematics, astronomy and philosophy in Alexandria and is remembered as its best known woman scholar.
    relic: An astrolabe plate
    relic_desc: An engraved brass disc for finding the stars and the hour.
    points:
      p1: Join the discussion
      p2: Follow her geometry
      p3: Slip through the crowd unseen (needs a hologram cloak)
  fibonacci_pisa:
    name: Hindu-Arabic numerals reach Europe
    place: Pisa
    figure: Fibonacci
    story: In the Liber Abaci Fibonacci shows merchants how nine digits and a zero make arithmetic quick.
    relic: A wax tablet of numerals
    relic_desc: A tablet with the ten new numerals set out beside the old Roman ones.
  giotto_padua:
    name: Figures with weight and feeling
    place: Padua
    figure: Giotto
    story: In the Scrovegni Chapel Giotto paints saints as people with weight and feeling, a turn in European painting.
    relic: A pot of blue pigment
    relic_desc: Ground blue, the colour of the chapel vault.
  dante_ravenna:
    name: A poem in the language of the street
    place: Ravenna
    figure: Dante Alighieri
    story: In exile Dante finishes the Divine Comedy, written in the Italian people actually spoke.
    relic: A laurel leaf
    relic_desc: A dried leaf of the poet's crown.
  gutenberg_mainz:
    name: Printing with movable metal type
    place: Mainz
    figure: Johannes Gutenberg
    story: Gutenberg combines movable metal type, oil based ink and a press, and books stop being rare.
    relic: A lead type sort
    relic_desc: One small letter of lead and tin, backwards.
    points:
      p1: Help with the press (a craftsperson)
      p2: Lift the heavy press (needs a cyborg arm or a cyborg gorilla arm)
      p3: Get the type to line up
  leonardo_florence:
    name: A painter who drew machines
    place: Florence
    figure: Leonardo da Vinci
    story: Leonardo paints the Mona Lisa and fills his notebooks with anatomy, water and flying machines.
    relic: A mirror-written notebook page
    relic_desc: A page of backwards script that needs a mirror to read.
    points:
      p1: Win Leonardo's trust
      p2: Sit for the portrait as the model (needs a woman)
      p3: Spark his sense of beauty (a painter, a musician, a sensitive employee, or a golden apple)
  copernicus_frombork:
    name: The Sun at the centre
    place: Frombork, Poland
    figure: Nicolaus Copernicus
    story: Copernicus publishes a model in which the Earth goes round the Sun.
    relic: A brass quadrant
    relic_desc: A quarter circle for measuring the height of stars.
  vesalius_padua:
    name: Anatomy drawn from the body
    place: Padua
    figure: Andreas Vesalius
    story: Vesalius publishes the Fabrica, a book of the human body drawn from dissection rather than from old authority.
    relic: A dissection knife
    relic_desc: A narrow blade for looking before believing.
  shakespeare_globe:
    name: A playhouse for everyone
    place: London
    figure: William Shakespeare
    story: The Globe opens on the Thames bank, and its plays reach from the cheapest standing place to the best seats.
    relic: A goose quill
    relic_desc: A feather cut for writing, ink still on the tip.
    points:
      p1: Get a hearing at the Globe
      p2: Offer a line he keeps
      p3: A full house
  galileo_padua:
    name: Moons around Jupiter
    place: Padua
    figure: Galileo Galilei
    story: Galileo points a telescope at Jupiter and sees four small moons going round it.
    relic: A ground lens
    relic_desc: A small glass lens, polished by hand.
    points:
      p1: Look through the telescope with him
      p2: Stand by him before the doubters
      p3: A clear night
  descartes_leiden:
    name: Doubt as a method
    place: Leiden
    figure: René Descartes
    story: Descartes publishes the Discourse on the Method, starting from doubting everything and building up again.
    relic: A folded cogito note
    relic_desc: A slip with a single sentence about thinking and being.
  leeuwenhoek_delft:
    name: A world in a drop of water
    place: Delft
    figure: Antonie van Leeuwenhoek
    story: A draper with hand ground lenses sees tiny living things in pond water and writes to the Royal Society.
    relic: A tiny brass lens plate
    relic_desc: A thumb sized plate holding one very small, very clear lens.
  newton_cambridge:
    name: One law for the apple and the Moon
    place: Cambridge
    figure: Isaac Newton
    story: In the Principia Newton shows that the same law of gravity governs falling objects and the orbits of the planets.
    relic: A glass prism
    relic_desc: A triangle of glass that splits white light into colours.
    points:
      p1: Follow his mathematics
      p2: Talk with him in Latin (needs a cyborg neural chip)
      p3: Hold your ground in the argument
  bach_leipzig:
    name: A cantor writes for every Sunday
    place: Leipzig
    figure: Johann Sebastian Bach
    story: Bach becomes cantor in Leipzig and over the years writes music for the church year at a pace few could match.
    relic: An organ pipe cut from quill
    relic_desc: A small pipe, tuned and tested, left unsold.
  smith_kirkcaldy:
    name: How a nation grows rich
    place: Kirkcaldy, Scotland
    figure: Adam Smith
    story: Adam Smith publishes The Wealth of Nations, arguing that division of labour and trade make people richer.
    relic: A pin from the pin factory
    relic_desc: The pin he used to show what dividing a job can do.
  kant_konigsberg:
    name: What reason can and cannot know
    place: Königsberg
    figure: Immanuel Kant
    story: Kant publishes the Critique of Pure Reason, asking what the mind brings to what it knows.
    relic: A walking cane
    relic_desc: The cane of a man whose daily walk was so regular neighbours set clocks by it.
  mozart_prague:
    name: An opera Prague loved
    place: Prague
    figure: Wolfgang Amadeus Mozart
    story: Mozart's Don Giovanni premieres in Prague, a city that had taken his Figaro to heart.
    relic: A manuscript leaf
    relic_desc: One page of fast, clean handwriting with almost no corrections.
  lavoisier_paris:
    name: A new language for chemistry
    place: Paris
    figure: Antoine Lavoisier
    story: Lavoisier publishes a treatise that names oxygen, treats combustion as combining with it, and measures everything by weight.
    relic: A precision balance
    relic_desc: A fine balance that kept the books of chemistry.
  jenner_berkeley:
    name: The first vaccine
    place: Berkeley, England
    figure: Edward Jenner
    story: Jenner tests that cowpox protects against smallpox, and vaccination begins.
    relic: A glass lancet
    relic_desc: A thin blade for the first small scratch.
  beethoven_vienna:
    name: The Ninth Symphony
    place: Vienna
    figure: Ludwig van Beethoven
    story: Beethoven, almost deaf, premieres the Ninth Symphony and has to be turned round to see the applause.
    relic: An ear trumpet
    relic_desc: A horn he held to his ear as the world went quiet.
    points:
      p1: Comfort him
      p2: Hear the music in his head (a musician, a painter or a sensitive employee)
      p3: A good day for him
  faraday_london:
    name: Electricity from magnetism
    place: London
    figure: Michael Faraday
    story: Faraday moves a magnet through a coil of wire and gets a current, the principle behind the dynamo.
    relic: An iron ring and coil
    relic_desc: Two coils of wire on a ring of soft iron.
  darwin_galapagos:
    name: Islands and the variety of life
    place: Galápagos Islands
    figure: Charles Darwin
    story: A young naturalist on the Beagle notices how birds and tortoises differ from island to island, and years later explains why.
    relic: A finch feather
    relic_desc: A small brown feather from the islands.
    points:
      p1: Notice what others miss
      p2: Survive the voyage
      p3: Help him sort the specimens (a sharp mind or a record keeper)
  lovelace_london:
    name: The first program
    place: London
    figure: Ada Lovelace
    story: Ada Lovelace publishes notes on the Analytical Engine with an algorithm and the idea that such machines could work with more than numbers.
    relic: A punched card
    relic_desc: A card of holes, meant to tell an engine what to do.
  nightingale_scutari:
    name: Nursing as a discipline of data and care
    place: Scutari, Ottoman Empire
    figure: Florence Nightingale
    story: At the Scutari hospital Nightingale cleans the wards, counts the deaths, and turns the counts into a case for reform.
    relic: A small oil lamp
    relic_desc: The lamp from her night rounds.
    points:
      p1: Know the ward work (medical staff)
      p2: Keep the men calm
      p3: Last the long night shifts
  mendel_brno:
    name: Peas and the rules of heredity
    place: Brno
    figure: Gregor Mendel
    story: Mendel reports what years of crossing garden peas show about how traits are passed on.
    relic: A pea pod
    relic_desc: A dried pod from the monastery garden.
  mendeleev_petersburg:
    name: The periodic table
    place: Saint Petersburg
    figure: Dmitri Mendeleev
    story: Mendeleev arranges the elements by weight and recurring properties, and leaves gaps for ones not yet found.
    relic: A deck of element cards
    relic_desc: Hand written cards that can be dealt like patience.
  pasteur_paris:
    name: A vaccine for rabies
    place: Paris
    figure: Louis Pasteur
    story: Pasteur and his team give a boy bitten by a rabid dog the first rabies vaccine, and he lives.
    relic: A swan-neck flask
    relic_desc: A flask whose curved neck kept dust out and air in.
  curie_paris:
    name: Two new elements
    place: Paris
    figure: Marie Curie
    story: Working in a shed, Marie and Pierre Curie separate polonium and radium from tonnes of ore.
    relic: A tube of pitchblende
    relic_desc: A glass tube of dark ore that left a faint glow in the dark.
    points:
      p1: Keep up in the laboratory
      p2: Endure the dusty shed (needs a cyborg bionic lung)
      p3: Wait out the long refining
  freud_vienna:
    name: Dreams as a way into the mind
    place: Vienna
    figure: Sigmund Freud
    story: Freud publishes The Interpretation of Dreams, a book that changes how people talk about the mind.
    relic: A statuette from his study
    relic_desc: One of the small antiquities he kept on his desk.
  einstein_bern:
    name: A year that changed physics
    place: Bern
    figure: Albert Einstein
    story: While working in the patent office Einstein publishes papers on light, atoms and relativity within a few months.
    relic: A patent office stamp
    relic_desc: A small rubber stamp of the desk where it happened.
  picasso_paris:
    name: Breaking the single viewpoint
    place: Paris
    figure: Pablo Picasso
    story: Picasso paints Les Demoiselles d'Avignon, and European painting stops insisting on one point of view.
    relic: A charcoal stick
    relic_desc: A stub of charcoal black on the fingers.
  fleming_london:
    name: A mould that stops bacteria
    place: London
    figure: Alexander Fleming
    story: Fleming notices that a mould on a forgotten dish has cleared the bacteria around it, and penicillin is named.
    relic: A mouldy petri dish
    relic_desc: A glass dish with a clear ring round a green spot.
  turing_cambridge:
    name: What can be computed
    place: Cambridge
    figure: Alan Turing
    story: Turing describes an imaginary machine that reads and writes symbols on a tape, and defines what computing means.
    relic: A strip of paper tape
    relic_desc: A tape of marks, one symbol at a time.
  meitner_stockholm:
    name: Explaining nuclear fission
    place: Stockholm
    figure: Lise Meitner
    story: In exile Lise Meitner and her nephew work out that a uranium nucleus has split, and give it the name fission.
    relic: A piece of chalk
    relic_desc: A worn stub of chalk from the walk where it was worked out.
  franklin_cambridge:
    name: The shape of DNA
    place: Cambridge
    figure: Rosalind Franklin, James Watson and Francis Crick
    story: X-ray pictures by Rosalind Franklin and her student help Watson and Crick build the double helix model.
    relic: A wire helix model
    relic_desc: A small twisted wire model of two strands.
  berners_lee_geneva:
    name: A web of linked pages
    place: Geneva
    figure: Tim Berners-Lee
    story: At CERN Tim Berners-Lee proposes a way of linking documents across computers, which becomes the World Wide Web.
    relic: A floppy disk
    relic_desc: A square disk, its label in pencil.
  cajal_barcelona:
    name: Nerve cells as separate units
    place: Barcelona
    figure: Santiago Ramón y Cajal
    story: Cajal draws silver stained nerve cells in beautiful detail and argues that the brain is made of separate cells.
    relic: A fine drawing pen
    relic_desc: A pen so fine it drew every branch of a neuron.
  marconi_bologna:
    name: Signals through the air
    place: Bologna
    figure: Guglielmo Marconi
    story: Marconi sends a signal across his family's fields with no wire between the two ends, and keeps pushing the distance.
    relic: A coherer tube
    relic_desc: A small glass tube of metal filings that woke at a radio wave.
  imhotep_saqqara:
    name: The first great stone pyramid
    place: Saqqara, Egypt
    figure: Imhotep
    story: Imhotep, the architect of King Djoser, is credited with the step pyramid, one of the first large buildings of cut stone.
    relic: A mason's mallet
    relic_desc: A wooden mallet worn smooth by many hands.
  enheduanna_ur:
    name: The first named author
    place: Ur, Mesopotamia
    figure: Enheduanna
    story: Enheduanna, a priestess of Ur, writes hymns to the goddess Inanna and signs them, the earliest author we know by name.
    relic: An alabaster disc
    relic_desc: A carved disc showing a priestess at an offering.
  hammurabi_babylon:
    name: Law set in stone
    place: Babylon
    figure: Hammurabi
    story: Hammurabi has laws carved on a stone pillar where everyone can read them, so that judges answer to something written.
    relic: A clay cylinder seal
    relic_desc: A small stone cylinder that rolls a signature into clay.
  lalibela_rock:
    name: Churches carved down into the rock
    place: Lalibela, Ethiopia
    figure: Lalibela and the stonecutters
    story: Stonecutters carve a set of churches downwards out of the living rock, with no stone laid on stone.
    relic: A stonecutter's chisel
    relic_desc: An iron chisel, the edge ground thin.
  ife_bronzes:
    name: Lifelike heads in cast metal
    place: Ife, Nigeria
    figure: The casters of Ife
    story: Craftsmen in Ife cast heads in brass and copper so lifelike that visitors long afterwards could not believe they were local work.
    relic: A small bronze head
    relic_desc: A hand sized head with lines of fine scarring.
  great_zimbabwe:
    name: A stone city without mortar
    place: Masvingo, Zimbabwe
    figure: The builders of Great Zimbabwe
    story: Builders raise high walls of fitted granite blocks without mortar, the centre of a trading kingdom.
    relic: A soapstone bird
    relic_desc: A carved bird on a short column.
  timbuktu_sankore:
    name: A city of manuscripts
    place: Timbuktu, Mali
    figure: Mansa Musa and the scholars of Sankore
    story: Timbuktu grows into a centre where scholars copy and collect books on law, astronomy and medicine.
    relic: A gold-flecked manuscript leaf
    relic_desc: A page with a border of gold dust.
  al_haytham_cairo:
    name: Light, tested by experiment
    place: Cairo
    figure: Ibn al-Haytham
    story: Ibn al-Haytham, writing in Cairo, tests how light travels in a dark room and shows that we see because light enters the eye.
    relic: A pinhole screen
    relic_desc: A dark board with one small hole.
    points:
      p1: Ask how seeing works
      p2: Help build the dark chamber
      p3: A bright day
  house_of_wisdom:
    name: Scholars translating the world's books
    place: Baghdad
