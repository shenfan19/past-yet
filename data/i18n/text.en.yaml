catalog:
  pythagoras_croton:
    name: The second string
    place: Croton, southern Italy
    figure: Pythagoras
    story: Aristotle later describes the people he calls Pythagoreans relating the intervals of a musical scale to number. In the imagined Croton workshop, two learners use marked strings to compare an octave. The sources here give no record of Pythagoras conducting this particular lesson.
    relic: A string with two ink marks
    relic_desc: A practice string from the imagined workshop, marked first from memory and then by length.
    points:
      p1: Compare the full and half lengths on the same string
      p2: Ask the maker to let a second person try the mark
      p3: Keep a steady beat while the two apprentices take turns
    vignettes:
      octave: Melas has made an ink mark where he remembers his teacher’s finger. You double back a spare length of string and show him where the middle actually falls. He makes a second mark and hears the octave this time. His first mark stays beside it so that the next apprentice can hear the difference.
      ear: Lysis can match the sound by ear but was never shown where to put his hand. You keep the beat while he listens to Melas and tries the string himself. When the shutters come down, Lysis can get the interval again from the mark without anyone singing it first.
      credit: Looking ahead, you can almost see one famous name printed over every exercise. Melas asks whose mark he should put on the spare string. You mark which stretch he tested and let him sign his own handiwork. The next lesson will start while you are already home.
  thales_miletus:
    name: The hour left blank
    place: Miletus, Ionia
    figure: Thales
    story: Herodotus credits Thales of Miletus with naming the year of a darkening of the day associated with a battle. He gives no surviving explanation of a method.
    relic: A wax leaf with one space left empty
    relic_desc: A fictional harbour record with room for a year and an hour.
    points:
      p1: Compare the year someone heard with the hour the recorder added
      p2: Persuade the boat owner to distinguish a report from an appointment
      p3: Wait to see which of the two blank columns can be filled
    vignettes:
      year: Hegesias has set out spaces for the year and the hour. He has a year from the man who told him the story, but has invented an hour so the two columns look alike. You make him read the man's words back before the boat leaves. One space remains blank, and this time it is blank on purpose.
      appointment: The boat owner Melitta asks whether she should bring the crew in early because of the story. You give her two wax leaves, one for the report as she heard it, one for the hour she has agreed with her crew. She makes the appointment herself. The story no longer dictates who comes back early.
      spoiler: You almost say that a later almanac could mark a local time. Hegesias turns the tablet towards you and holds out the stylus. You cannot show him how the teller of this story got a time. You give back the stylus without drawing its mark. You leave before the boat comes in.
  socrates_athens:
    name: Before the ship comes back
    place: Athens
    figure: Socrates
    story: In 399 BC Socrates was tried in Athens and sentenced to death. The ship Athens sent to Delos each year had just sailed, and no one could be put to death before it came home, so he waited about thirty days in prison. There he put fables of Aesop into verse, and his friends came to see him every day. On the last day they were all there except Plato, who was ill, and in the evening he drank the hemlock.
    story_prose:
      opening:
        - Athens, 399 BC. Socrates has been charged with impiety and with corrupting the young, and is to stand trial before a jury. All his life he has questioned people in the streets and the agora, and he has written no book; later readers know him only through Plato and Xenophon.
        - In history, the ship Athens sent to Delos sailed the day before the trial, and no one could be put to death until it came home, so he waited in prison about thirty days more. In those days, as a recurring dream had told him, he put fables of Aesop into verse, and the verses did not survive; on the last day his friends were all there, but Plato was ill and did not come. In this branch, a woman sells lamp oil by the prison wall, and a fishmonger at Piraeus sees every ship come in.
        - 'Three kinds of people can help on this trip: someone who can steady a crowd when the shouting starts, someone who can take down verses and copy out a roll of them, and someone who knows medicine and can cure an illness.'
      outcomes:
        all: The ship came back from Delos, and the fishmonger saw its sail from far off. On the evening of the last day the prison was full of friends, and Plato sat among them. The roll of verses lay afterwards at the bottom of a chest in a house in Athens, and it lasted.
        p3: On the evening of the last day the prison was full of friends, and Plato sat among them until the end.
        p2: The roll of verses lay afterwards at the bottom of a chest in a house in Athens, and it lasted, its edges worn soft.
        p1: Thirty days later the ship from Delos came into Piraeus, and the fishmonger saw its sail from far off. That day his friends were waiting at the prison door from first light.
      none: The ship came back from Delos, and the fishmonger saw its sail from far off. In the evening the friends in the prison sat in a circle, and none of them spoke first.
      desync: The uproar in the court rose higher and higher, and the defence broke off in the middle of a sentence. {staff} was recalled by the office before leaving the court.
      not_admitted: '{staff} found no footing in Athens, not even the place to rest at the foot of the prison wall. The ship from Delos was still at sea.'
      points:
        p1: On the day of the trial the jurors filled row after row of wooden benches. Every few sentences a roar went up from them and drowned his voice. {staff} sat among the onlookers, and each time the noise rose, stood up without shouting, slowly pressed both hands downward and looked along the rows one by one, and sat down only when it had fallen. Socrates took up again from the half sentence where he had been cut off. When he had finished, he gathered the hem of his cloak and stood still on the platform.
        p2: Light came into the prison only through a small window high in the wall. Socrates spoke a line and {staff} wrote it on a wax tablet, then read it back to him in time with the metre, and where there was a beat too many, smoothed the wax and wrote it again. The fables of Aesop became verses one by one, and last came the hymn to Apollo. At night, by the light of lamp oil at the foot of the wall, {staff} copied the tablets onto a roll of papyrus. Early next morning a friend who had come to visit tucked the roll inside his clothes, and as he walked out of the prison gate he kept one hand pressed to his chest.
        p3:
          class_medical: On the night before the last day Plato was still ill, lying at home and unable to get up. {staff} examined him as a physician would, made up the medicine, gave it to him at the proper hours and did not leave the bedside all night. Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.
          else: On the night before the last day Plato was still ill, lying at home and unable to get up. {staff} opened the nano medical kit, gave him the treatment as its instructions said, and did not leave the bedside all night. Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.
      excerpts:
        p3: Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.
        p2: At night, by the light of lamp oil at the foot of the wall, {staff} copied the tablets onto a roll of papyrus. Early next morning a friend who had come to visit tucked the roll inside his clothes, and as he walked out of the prison gate he kept one hand pressed to his chest.
        p1: Socrates took up again from the half sentence where he had been cut off. When he had finished, he gathered the hem of his cloak and stood still on the platform.
    relic: A clay cup from the market
    relic_desc: An Athenian cup with a black glaze and a small chip in the rim.
    points:
      p1: When the clamour of the jurors keeps rising against him, keep the court quiet enough for him to finish his defence
      p2: Help him finish the Aesop fables he is putting into verse in prison and the hymn to Apollo, and get a copy out of the prison
      p3: Before the last day, cure Plato of his illness so that he can come to the prison and be with his teacher at the end
    points_fail:
      p1: The noise drowns the defence and he cannot finish it. This branch has come loose from history, and the office recalls the employee.
      p2: As in history none of the verses survives, and in this branch none does either.
      p3: As in history Plato is ill that day and does not come; in this branch too he is not with his teacher.
    shift:
      p1:
        was: '399 BC: Socrates was tried in Athens; in Plato''s Apology he asks the jurors again and again not to make a disturbance while he speaks, and he is found guilty and sentenced to death.'
      p2:
        was: '399 BC: waiting in prison for the execution, Socrates obeyed a recurring dream by putting Aesop''s fables into verse and composing a hymn to Apollo; none of it survives whole.'
        now: The verses were copied into a roll and carried out of the prison by a friend, and they stayed in Athens.
      p3:
        was: '399 BC: on the day Socrates drank the hemlock in prison his friends were with him; Plato was ill and did not come.'
        now: Plato was well again and in the prison that day among the friends, and stayed to the end.
        who: plato_academy
        bio: In this timeline Plato was cured of the illness that kept him away, and was in the prison with Socrates on his last day.
    vignettes:
      rumours: The day before the trial {staff} asks three stalls in the agora what the old man is charged with and gets three different answers. {staff} writes all three down and waits to hear which one is read out in court.
      harbour: Every evening {staff} walks down to the harbour at Piraeus and asks the fishmonger whether the ship from Delos is in yet. Every evening the answer is the same, and {staff} cannot say whether to hope it comes or hope it does not.
      gate: '{staff} carries water for the woman who sells lamp oil by the prison wall, and is given a place to sit at the foot of the wall in return. The visitors wait at the door from first light each day, and {staff} comes to know their faces.'
  hippocrates_kos:
    name: A night without a witness
    place: Kos
    figure: Hippocrates
    story: The Hippocratic Epidemics records illnesses day by day, including cases on Thasos. The work is part of a collection transmitted under Hippocrates’ name. This imagined workshop on Kos uses a practice note to compare observers’ dates.
    relic: A practice watch record
    relic_desc: A fictional day-by-day record that preserves two starting points.
    points:
      p1: Find where the two accounts start counting days
      p2: Take the watch so the other recorder can rest
      p3: Ask what happened on the night no one wrote about
    vignettes:
      days: Myrine has numbered her first visit day one. Leon starts his count from the night before. You set both pages by the same lamp and ask them to point to the same morning. The two numbers stay on the sheet, alongside an indication of where each count began.
      watch: Leon is about to leave and Myrine has been awake since before sunrise. You give her time to rest while you mind the lamp outside. She brings the sheet back at the next change of watch. There is another observer for that stretch of the night.
      blank: You know later readers will make much of a day-by-day record. The space before Myrine’s first visit has no observer to fill it. You put a small mark beside the gap and leave the rest as it is. The person from the earlier watch will not return before you go.
  plato_academy:
    name: The unanswered square
    place: Athens
    figure: Plato
    story: A later biography places Plato in the Academy outside Athens. In Plato’s Meno, the side of a square with twice the area is the diagonal of the original square.
    relic: A borrowed wax tablet
    relic_desc: The practice tablet has a corrected diagram on the reverse.
    points:
      p1: Count the fourfold area before answering the student
      p2: Copy the false start alongside the corrected figure
      p3: Ask the bystanders to cover the new figure with half-squares
    vignettes:
      diagonal: Mikon has doubled the side on his wax tablet and asks you to read off the area. You slide the stylus around the four little squares he has made. He used to rub out mistakes at once. This time he keeps the four where they are and starts the next figure on the other leaf.
      squares: Doro has to take the wax tablet home before the lamp goes out. You hold it level while she scores a corner-to-corner line. Four of her half-squares fit the new figure. The apprentice who comes tomorrow will have something he can count without you.
      reveal: You give away the diagonal before Mikon has tried his longer side. He can repeat the answer but cannot draw the new square. You wipe away your answer and leave him two starting corners. The second attempt will have to wait for the next lamp.
  aristotle_lyceum:
    name: A crab in the wrong column
    place: Athens
    figure: Aristotle
    story: In History of Animals I, Aristotle distinguishes where an animal lives from how it moves, using the walking crab as one example.
    relic: A shell with a place-label
    relic_desc: A shell from the imagined exercise, with its findspot on a label.
    points:
      p1: Compare the crab sketch with the movement column
      p2: Hold the shell trays while the labels are replaced
      p3: Ask a witness to describe the movement she saw
    vignettes:
      two_columns: Timarete points to a one-column list, with the crab filed among swimmers. You draw a second column and ask her to use the same drawing twice. When she reads it back, sea is where she found the animal, walking is what she actually saw.
      shell: Damon is about to scrape his shell label clean to fit the new list. You ask him to set the shell on the table and describe where he picked it up. He keeps the older label beside the new one. One records a place and the other an observation.
      names: You start to tell the table what future books will call these creatures. Timarete asks which animal the new name will help her recognise tomorrow. You spend the remaining light copying the little crab with its legs showing. The ink is still damp when she closes the shutters.
  euclid_alexandria:
    name: While the Porisms still existed
    place: Alexandria
    figure: Euclid
    story: Around 300 BC Euclid wrote the thirteen books of the Elements at Alexandria, proving the propositions of geometry step by step from definitions and postulates. He also wrote the Porisms in three books, the Conics and other works, which were later lost. In the fourth century AD Pappus could still describe the Porisms and count its propositions.
    story_prose:
      opening:
        - Alexandria, around 300 BC. Here Euclid wrote the thirteen books of the Elements, proving the propositions of geometry step by step from a few definitions and postulates; the first proposition of the first book needs only two circles to build an equilateral triangle on a given line. He also wrote the Porisms in three books, the Conics and other works.
        - In history, the Porisms was later lost. Around AD 320 Pappus could still describe it, and recorded that it held 171 theorems and 38 lemmas; after that no copy is known. In this branch, a student draws his figures on a board of sand, and a papyrus seller on the quay knows which sheets stand the damp.
        - 'Several kinds of people can help on this trip: someone who knows how to copy, check and keep books, someone who teaches geometry and can hold a group of students, or someone careful and learned enough to check it line by line.'
      outcomes:
        all: On the shelves of later readers, three books of the Porisms stood beside the Elements, their edges worn soft with handling.
        p1: On the shelves of later readers, three books of the Porisms stood beside the Elements, their edges worn soft with handling.
      none: The sand board was smoothed and new circles were drawn on it. After Pappus, no one opened those three books again.
      not_admitted: '{staff} never got into the room where the books were copied. On the quay the papyrus seller was still carrying his bundles ashore.'
      points:
        p1:
          class_teaching: '{staff} did it the way a teacher would, dividing the three books of the Porisms among the most attentive students at the sand board, one book each, and when they had copied them they read them aloud to one another and checked them word by word, figure by figure. The finished copies were rolled, tied with thin cord and put into the hands of those who studied geometry with him. Euclid picked up one of them, untied the cord and looked at the first sheet, then tied it again as it had been.'
          class_lettered: '{staff} did it by the rules of a copying shop, cut the papyrus, copied the three books of the Porisms one roll at a time, then checked each copy line by line against the original and traced the figures as they stood. The finished copies were rolled, tied with thin cord and put into the hands of those who studied geometry with him. Euclid picked up one of them, untied the cord and looked at the first sheet, then tied it again as it had been.'
          else: '{staff}, careful by nature, stood over the copyists while the three books of the Porisms were copied one roll at a time, and after each roll laid the copy beside the original and went through the figures page by page. The finished copies were rolled, tied with thin cord and put into the hands of those who studied geometry with him. Euclid picked up one of them, untied the cord and looked at the first sheet, then tied it again as it had been.'
      excerpts:
        p1: The finished copies were rolled, tied with thin cord and put into the hands of those who studied geometry with him. Euclid picked up one of them, untied the cord and looked at the first sheet, then tied it again as it had been.
    relic: A bronze compass
    relic_desc: Two arms and a pivot, enough to draw every figure in the book.
    points:
      p1: Help him copy the three books of the Porisms several times over and put them in his students' hands, so the work is not lost
    points_fail:
      p1: The Porisms still existed in a single line of copies. In this branch it was lost all the same, and only the few lines Pappus wrote about it remained.
    shift:
      p1:
        was: Around 300 BC Euclid wrote the Porisms in three books; the work was later lost, and all that is known of it is the count of 171 propositions and the short account that Pappus gave in the fourth century AD.
        now: '{staff} helped him copy the Porisms several times and hand the copies to those who studied geometry with him. In this timeline the work came down to later readers.'
        who: euclid_alexandria
        bio: In this line the Porisms of Euclid were copied more widely and did not disappear, and later readers had more of him than the Elements.
    vignettes:
      lost: On the copyist's table {staff} sees a roll of the Porisms and knows that later readers will only be able to guess at it from a few lines of Pappus. {staff} keeps a hand on the edge of the roll a while before letting it go.
      arcs: '{staff} draws circles on a board of sand with a peg and a string, as the students do. The two arcs cross and give the third point. {staff} smooths the sand and draws it again, with a steadier hand the second time.'
      papyrus: '{staff} helps a papyrus seller carry his bundles up the quay, and hears from him which sheets stand the damp of the harbour and which turn brittle in a year.'
  archimedes_syracuse:
    name: The day the city fell
    place: Syracuse, Sicily
    figure: Archimedes
    story: For two years Roman forces besieged Syracuse, and the city held out with the help of machines Archimedes had devised. In 212 BC the city was taken. The Roman commander had given word that Archimedes was to be spared, but in the taking of the city Archimedes, then about seventy five, was killed.
    relic: A marked toy hull
    relic_desc: A practice hull from the fictional workshop.
    points:
      p1: On the day Syracuse falls, get Archimedes safely out of the way of the fighting
    points_fail:
      p1: As in history he is killed when the city is taken.
    shift:
      p1:
        was: '212 BC: when Roman forces took Syracuse, Archimedes, about seventy five, was killed, although the Roman commander had ordered that he be spared.'
        now: On the day the city fell he was taken safely out of harm's way and lived on.
        who: archimedes_syracuse
        bio: In this timeline Archimedes came safely through the fall of Syracuse in 212 BC and lived on.
    vignettes:
      load: Tyche expects the wide boat to send more water over the rim. You give both boats equal total weight. The wider hull sits shallower and the two catches balance. She keeps both boats instead of cutting down the larger one to match the smaller.
      settle: Nikon has to return the basin before the workshop closes. He starts the second trial while the first catch is still sloshing. You send Tyche to return the weights and use the time to let the bowl settle. Nikon weighs the water again. He leaves with a second reading and still gets the basin back.
      crown: You ask Nikon whether Archimedes ever tested a king’s crown in a bath. He looks down at the two toy boats and asks whose crown you could put on the scale. You have the tale a Roman author will tell long after this workshop. You leave with the mark from the trial you can actually repeat.
  eratosthenes_alexandria:
    name: The book that measured the Earth
    place: Alexandria
    figure: Eratosthenes
    story: Eratosthenes of Cyrene became librarian at Alexandria in the third century BC. His own book on measuring the Earth is lost. In Cleomedes’ later account, the midsummer Sun is overhead at Syene but leaves a shadow at Alexandria. The difference is one fiftieth of a circle; with 5,000 stadia between the two places, that makes 250,000 for the whole Earth.
    story_prose:
      opening:
        - Alexandria, the third century BC. Eratosthenes of Cyrene has become head of the Library of Alexandria. He has a nickname, Beta, which means that in every field of learning he falls just short of first.
        - In history, according to the later account of Cleomedes, at noon on midsummer day the gnomon at Syene cast no shadow, while at Alexandria the sun stood one fiftieth of a full circle from the zenith; the two cities lay five thousand stadia apart, so the whole circle came to two hundred and fifty thousand. The book in which Eratosthenes set down his own method, On the Measurement of the Earth, was lost, and Cleomedes himself says the original method was more involved than his account. In this branch, a porter at the Library who cannot read knows every tag, and a copyist is quick with a nickname.
        - 'Two kinds of people can help on this trip: someone who knows how to copy, check and keep books, or someone curious and studious who can work a page of figures through.'
      outcomes:
        all: Later readers followed the steps he had written in his own hand and set up a gnomon again at noon on midsummer day. The roll lay open beside it, its edges held down with pebbles.
        p1: Later readers followed the steps he had written in his own hand and set up a gnomon again at noon on midsummer day. The roll lay open beside it, its edges held down with pebbles.
      none: The book still had only its few old copies, and they grew older one by one. At noon on midsummer day the gnomon at Alexandria still cast its short shadow.
      not_admitted: '{staff} never got through the door of the Library. At noon on midsummer day the gnomons of the city still cast their short shadows.'
      points:
        p1:
          class_lettered: '{staff} went by the rules of a keeper of books and made several copies of On the Measurement of the Earth, and after each one checked the shadow lengths, the angles and the distances line by line against the original, not a figure astray. One copy went onto a shelf of the Library, tied with a small wooden tag the porter would know; another was wrapped in oilcloth and left on an outgoing ship for another city. Eratosthenes stood before the shelf and straightened the tag with one finger.'
          else: '{staff} first worked the method in the book through from the beginning until every step was clear, then made several copies of On the Measurement of the Earth and checked the figures line by line against the original. One copy went onto a shelf of the Library, tied with a small wooden tag the porter would know; another was wrapped in oilcloth and left on an outgoing ship for another city. Eratosthenes stood before the shelf and straightened the tag with one finger.'
      excerpts:
        p1: One copy went onto a shelf of the Library, tied with a small wooden tag the porter would know; another was wrapped in oilcloth and left on an outgoing ship for another city. Eratosthenes stood before the shelf and straightened the tag with one finger.
    relic: A gnomon rod
    relic_desc: A plain upright rod whose shadow told him the angle of the sun.
    points:
      p1: Help him have On the Measurement of the Earth copied for the Library and beyond, so his own account of the method is not lost
    points_fail:
      p1: The book stayed in the copies it already had. In this branch it was lost all the same, and later readers knew his method only from the simplified retelling of Cleomedes.
    shift:
      p1:
        was: In the third century BC Eratosthenes set out his measurement in On the Measurement of the Earth; the book was later lost, and the method survives mainly in the simplified account of Cleomedes, who says the original was more involved.
        now: '{staff} helped him have the book copied several times. In this timeline his own account came down to later readers alongside the retelling.'
        who: eratosthenes_alexandria
        bio: In this line the book in which Eratosthenes measured the Earth was not lost, and later readers could check his method in his own words.
    vignettes:
      noon: At noon on midsummer day {staff} crouches by an upright rod and scratches the tip of its shadow into the ground with a fingernail. A little later the shadow has moved a finger's width away.
      beta: '{staff} hears the copyists of the Library call the librarian Beta behind his back, second in everything. {staff} knows that what later centuries will remember of him is the whole round of the Earth he measured, and keeps a straight face.'
      shelves: '{staff} helps a porter of the Library carry the rolls up to the shelves in bundles, each tied with a little wooden tag. The porter says that even a man who cannot read can tell the marks on the tags apart.'
  hypatia_alexandria:
    name: Alexandria, that March
    place: Alexandria
    figure: Hypatia
    story: Early in 415 Hypatia still teaches mathematics and philosophy in Alexandria, and the city magistrates come to hear her. Between the prefect of the city and another faction a feud grows sharper by the week, and she is drawn into it through her ties to the prefect.
    relic: A sketched float scale
    relic_desc: A fictional workshop sketch showing where the mark is read.
    points:
      p1: Before the worst of that March, persuade her to leave Alexandria for a while, or to take another road on the day, and save her
    points_fail:
      p1: She goes about the city as before, and in this branch too she is killed that March.
    shift:
      p1:
        was: 'March 415: Hypatia, mathematician and philosopher, was killed in Alexandria in the unrest of the city.'
        now: That March she was away from the city. When things grew quiet she came back to Alexandria and went on teaching.
        who: hypatia_alexandria
        bio: In this timeline Hypatia listened and left Alexandria before March 415, came through that spring, and later went back to teaching in the city.
    vignettes:
      scale: Timon holds his thumb over the mark and calls it the result. Nysa takes a reading from where the float meets the surface. You ask them to put down the tube and look again while it stands free. This time they read the same mark. Nysa adds where they were standing to the record.
      copy: Nysa has one side of a tablet left and wants to copy the result in large letters. You fit the observation on the top half and let her draw the cylinder below it. The next reader will have both the result and a place to look for it on the instrument.
      name: You could offer a future name for the device. Timon has a cloth in one hand and is about to lift the float out of the cup. You use the last quiet moment to ask Nysa for one independent reading. You leave without seeing what the recipient makes of the finished instrument.
  fibonacci_pisa:
    name: The first version of 1202
    place: Pisa
    figure: Fibonacci
    story: Leonardo of Pisa learned to reckon with the nine Indian figures as a boy in Bugia, on the coast of North Africa, where his father worked for the merchants of Pisa. In 1202, back in Pisa, he finished the Liber abaci, which teaches the new figures and zero for counting and trade. In 1228 he revised the book, and the copies that survive come from that second version.
    story_prose:
      opening:
        - Pisa, 1202. As a boy Leonardo went to Bugia on the North African coast, where his father worked for the merchants of Pisa, and there he learned to reckon with the nine Indian figures. Back in Pisa he has written the Liber Abaci, which teaches people to write numbers with these figures and the zero and to use them in buying and selling.
        - In history, in 1228 he revised the book, adding new material and cutting what he thought superfluous; every copy that came down to later readers goes back to that version, and no complete copy of the first version of 1202 is known. In this branch, an apprentice in a counting house on the quay cannot see why a little circle should take up a column, and a boatman on the Arno calls out a number for every bale that comes ashore.
        - 'Several kinds of people can help on this trip: someone who knows books and how a set of copies is kept, someone who teaches and can talk an author round, or someone studious who can say clearly how an early text and a later one differ.'
      outcomes:
        all: More than twenty years later the revised version was being copied in the bookshops of Pisa. The wooden chest was still there, and the early text and the new lay open side by side, readers comparing them page by page for the examples added later.
        p1: More than twenty years later the revised version was being copied in the bookshops of Pisa. The wooden chest was still there, and the early text and the new lay open side by side, readers comparing them page by page for the examples added later.
      none: After 1228 the bookshops of Pisa copied only the revised version. In the counting house the apprentice learned from it, writing a zero, stroke by stroke, into the empty column.
      not_admitted: '{staff} never got through Leonardo’s door. By the Arno the boatman was still unloading bales, and on the bank someone drew one stroke after another on a board.'
      points:
        p1:
          class_lettered: '{staff} went by the rules of a keeper of books, laid the volumes of the first version out on the table and numbered them one by one, and told Leonardo that revising later was a good thing, but if this set was not kept, no one would ever know how he had first written it. Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.'
          else: '{staff} copied a few worked examples from the first version onto a wax tablet, set them beside the new way he was dictating, and asked him where people in later years should look if they wanted to see how he had first done the sums. Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.'
      excerpts:
        p1: Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.
    relic: A wax tablet of numerals
    relic_desc: A tablet with the ten new numerals set out beside the old Roman ones.
    points:
      p1: Persuade Leonardo to sign and leave a complete copy of the 1202 first version in Pisa, so the later revision does not replace it
    points_fail:
      p1: After the author revises the work, borrowers know only the new copy and cannot recover the first compilation.
    shift:
      p1:
        was: '1202: Leonardo of Pisa finished the first version of the Liber abaci; no complete copy of it is known to survive, and the manuscripts that came down reflect the revision of 1228.'
        now: The early set retains its date and examples. Later readers can put the two compilations side by side and identify newly added work.
        who: fibonacci_pisa
        bio: The 1202 first version of Leonardo of Pisa's book survived in a complete copy beside the 1228 revision, so later readers could see what he changed over those years.
    vignettes:
      rabbits: In a copy {staff} comes upon the problem of a pair of rabbits that bear a new pair every month. {staff} cannot help counting in the margin to the twelfth month, and the numbers come out exactly as in the schoolbooks of later centuries.
      zero: In a counting house on the quay {staff} shows an apprentice how to write an empty place as zero. The boy says the little ring is nothing at all and has no right to a column of its own. {staff} has him check two ledgers against each other, and the boy goes quiet.
      quay: '{staff} helps unload bales from a boat on the Arno and calls out each one as it comes ashore. On the bank a clerk listens and scratches a mark on his board for every call.'
  giotto_padua:
    name: Figures with weight and feeling
    place: Padua
    figure: Giotto
    story: Giotto's frescoes at the Scrovegni Chapel in Padua are dated 1303–1305 by the chapel. The scenes occupy successive bands along the walls.
    relic: A pot of blue pigment
    relic_desc: Ground blue, the colour of the chapel vault.
    points:
      p1: After the neighboring house objects to the building, have the patron record exterior work separately from Giotto’s painted walls. Keep time for the painters to care for their work
      p2: Match Giotto’s color samples to wall locations, and leave the booklet with two people who can care for the paintings after the workshop leaves
    points_fail:
      p1: A stop order closes access to the painted surfaces too. The painters cannot attend to them, a section is damaged, and the office recalls the employee.
      p2: The workshop takes its samples away. Those who take over must infer the older materials from the wall’s current appearance.
    shift:
      p1:
        was: On January 9, 1305, the neighboring friars complained about the scale and use of the Scrovegni building. Giotto’s fresco cycle survived.
      p2:
        was: The frescoes have been conserved and restored more than once. Surviving layers and the building itself provide evidence of earlier work.
        now: The incoming crew have samples keyed to the walls. Before a repair they can check where an early layer was recorded.
        who: giotto_padua
        bio: Giotto left in Padua a booklet of colour samples keyed to the walls of the chapel. Centuries of repairs could go back to it to find the colours he had first laid.
    vignettes:
      eye: The visitor always starts where the faces are easiest to see. You ask what their eyes do when you send them back to the corner. They follow a gesture into the next part of the picture.
      register: The visitor tries to continue on the band just below. You trace the route around the wall in the air. They walk a few steps and find the scene they were looking for.
      step: You step back with the visitor until two scenes fit into the same view. The visitor points out one detail that had been invisible when they stood directly beneath it.
  dante_ravenna:
    name: A poem in the language of the street
    place: Ravenna
    figure: Dante Alighieri
    story: Exiled from Florence in 1302, Dante Alighieri settled in Ravenna about 1318 and there finished the Paradiso, the last part of the Comedy, written in the Tuscan of everyday speech. About 1319 Giovanni del Virgilio, a scholar of Bologna, sent him a Latin poem urging him to write in Latin and come to Bologna for the laurel, and Dante answered in Latin verse. On 20 January 1320 he gave a lecture at Verona. In September 1321, back from an embassy to Venice, he fell ill and died in Ravenna.
    story_prose:
      opening:
        - Ravenna, early 1320. Dante has been exiled from Florence for eighteen years, and the sentence of 1302 says he will be put to death if he returns. At the invitation of the lord of Ravenna, Guido Novello da Polenta, he lives here and is writing the last part of the Divine Comedy, the Paradiso, in the everyday Tuscan of the street.
        - In history, Giovanni del Virgilio, who taught at Bologna, sent him a Latin poem urging him to write in Latin and come to Bologna for the laurel, and Dante answered with a Latin eclogue. In September 1321, back from an embassy to Venice, he fell ill and died at Ravenna, never having returned to Florence. In this branch, an ink seller in the town counts the copyists as his best customers, and a wood gatherer goes out to the pine forest by the sea.
        - 'Two kinds of people can help on this trip: someone who knows papers and can tell which pile is to be sent and which kept, and someone who knows poetry and books and can sit beside him and say a few true words.'
      outcomes:
        all: The Latin poems went back and forth into the next year, each sealed on its own with wax. In September 1321 he fell ill after coming back from Venice, and in the pile of the Paradiso by his bed the last sheet was written to the end.
        p2: He lived in Ravenna more than a year longer. In September 1321 he fell ill after coming back from Venice, and in the pile of the Paradiso by his bed the last sheet was written to the end.
        p1: The Latin poems went back and forth into the next year. Each answer was folded on its own, with a small drop of wax.
      none: The letter from Bologna still lay on the desk. In the pine forest outside Ravenna the sea wind came through in gusts.
      desync: The Latin answer went in with the copy of the Paradiso and was sent off among the loose sheets, and Bologna received only a few pages of Tuscan. {staff} was recalled by the office before any reply came.
      not_admitted: '{staff} never got through the door of the copying room, and spent a few days gathering wood in the pine forest outside the town. The two piles of paper still lay on Dante’s desk.'
      points:
        p1:
          class_lettered: '{staff} went by the rules of a keeper of papers and separated the two piles in the copying room: the Paradiso in Tuscan stayed on the desk, and the Latin answer for Bologna was put aside and folded on its own. Dante dropped wax on the fold and pressed it flat with a knuckle. The messenger tucked it inside his coat and went out of the city gate into the cold January wind, on the road to Bologna.'
          else: '{staff}, careful by nature, went through the copying room pile by pile, picked the Latin answer for Bologna out of the loose sheets of the Paradiso, and folded it on its own. Dante dropped wax on the fold and pressed it flat with a knuckle. The messenger tucked it inside his coat and went out of the city gate into the cold January wind, on the road to Bologna.'
        p2: 'One afternoon in March Dante read {staff} the lines he had just finished. {staff} said them back after him line by line, and only at the end said what had been held back for a long time: people would go on reading these verses for centuries, in just this language of the street, and one day Florence would want to bring him home. Dante rested his pen on the rim of the inkpot and looked at the sheet. After a long while he dipped it again and went on writing.'
      excerpts:
        p2: Dante rested his pen on the rim of the inkpot and looked at the sheet. After a long while he dipped it again and went on writing.
        p1: Dante dropped wax on the fold and pressed it flat with a knuckle. The messenger tucked it inside his coat and went out of the city gate into the cold January wind, on the road to Bologna.
    relic: A laurel leaf
    relic_desc: A dried leaf of the poet's crown.
    points:
      p1: Set aside time for Dante to send his Latin reply to Giovanni from Ravenna. Keep it apart from the Paradiso pages being copied
      p2: Let Dante in exile know that the Comedy will be read for generations, and that Florence will one day want him back
    points_fail:
      p1: The recipient gets loose narrative pages. The reply remains among the drafts, and the office recalls the employee.
      p2: He goes on writing in Ravenna with no answer to his hope of going home. In this branch nobody tells him what came after.
    shift:
      p1:
        was: In late 1319 or early 1320, while writing the Paradiso in Ravenna, Dante exchanged Latin verse with Giovanni del Virgilio in Bologna.
      p2:
        was: In September 1321 Dante died in Ravenna without ever returning to Florence; around 1519 Florence asked for his remains, and the friars of Ravenna hid his bones in a wall.
        now: '{staff} let him know in Ravenna that the Comedy would always have readers, and that his city would one day want to bring him home.'
        who: dante_ravenna
        bio: In his last years in Ravenna the exiled Dante came to know that his poem would last, and that Florence would one day be proud of him.
    vignettes:
      latin: 'In the copying room {staff} sees two piles of paper: the Paradiso in Tuscan, and the Latin verse bound for Bologna, whose sender says only Latin is worthy of the laurel. {staff} knows which pile everyone will be reading seven hundred years on, and swallows the words.'
      pinewood: '{staff} follows the wood gatherers into the pine forest by the sea outside Ravenna, rests on the sandy ground, and hears the waves beyond the trees.'
      ink: '{staff} helps an ink seller carry his jars off a boat. The ink is boiled from oak galls and rusty iron, and the seller says the copyists of the town buy the most of it.'
  gutenberg_mainz:
    name: Printing with movable metal type
    place: Mainz
    figure: Johannes Gutenberg
    story: The Mainz merchant Johann Fust twice lent Gutenberg 800 guilders for the work of the books. In 1455 the 42-line book was finished in Gutenberg's workshop, and Fust went to law for his money and interest; on 6 November a notary set down the case. After it the workshop passed to Fust.
    relic: A lead type sort
    relic_desc: One small letter of lead and tin, backwards.
    points:
      p1: While Fust presses for his money, keep the press running and see the last sheets of the 42-line book printed
      p2: Before the notary sets down the case on 6 November, help him put the loans, the accounts and the witnesses in order, and keep his workshop and its tools
    points_fail:
      p1: The 42-line book stops half printed on the press. This branch has come loose from history, and the office recalls the employee that day.
      p2: As in history the workshop and its tools pass to Fust after the case, and in this branch too.
    shift:
      p1:
        was: '1455: the 42-line book was finished in Gutenberg''s workshop in Mainz, printed with movable metal type.'
      p2:
        was: '6 November 1455: a notary in Mainz set down the case Johann Fust brought against Gutenberg for his loans and interest; afterwards the workshop passed to Fust.'
        now: He kept his workshop and its tools through the case, and went on printing in Mainz on his own.
        who: gutenberg_mainz
        bio: In this timeline Gutenberg came through the case of 1455 with his workshop and tools, and went on printing in Mainz in his own shop.
    vignettes:
      wrong_sort: You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other's place.
      reader: You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.
      proof: You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.
  leonardo_florence:
    name: A painter who drew machines
    place: Florence
    figure: Leonardo da Vinci
    story: The Louvre dates the beginning of Leonardo's portrait known as the Mona Lisa to around 1503 and records that he kept working on it later.
    relic: A mirror-written notebook page
    relic_desc: A page of backwards script that needs a mirror to read.
    points:
      p1: Before the workshop takes on another civic painting, reserve a place for Lisa’s portrait where there is light to work and where the panel can be found in storage
      p2: Arrange a viewing of work in progress while the portrait is still in Florence and let Leonardo choose what to show the sitter
    points_fail:
      p1: New work arrives and the unfinished panel is squeezed into the old rack. The portrait is damaged and the office recalls the employee.
      p2: No time is set aside for a viewing. The people waiting for the picture can only ask the workshop how far it has come.
    shift:
      p1:
        was: Agostino Vespucci’s margin note from October 1503 records Leonardo painting Lisa del Giocondo.
      p2:
        was: The portrait underwent extended revision, then left Italy with Leonardo and entered the French collection.
        now: Lisa sees the portrait at this stage. Leonardo can continue to take the panel with him, while the workshop keeps a sketch of the version shown to her.
        who: leonardo_florence
        bio: A contemporary Florentine note places the portrait of Lisa in Leonardo’s workshop. The painting continued to change and traveled far from that first setting.
    vignettes:
      shadow: You ask the apprentice to show where the face ends and the background begins. They point, then hesitate. Instead of drawing a heavier line, they leave the transition for a second look.
      hands: The visitor remembers the face but puts the hands in a different place. You set the practice drawing beside their memory sketch and let them find the changed lines.
      seat: You mark the sitter's chair on the floor while the apprentice packs up. They leave the drawing unfinished, knowing where the chair will go when they return.
  copernicus_frombork:
    name: The Sun at the centre
    place: Frombork, Poland
    figure: Nicolaus Copernicus
    story: In 1539 the young mathematician Rheticus came to Frombork and urged Nicolaus Copernicus to publish his book. In 1543 De revolutionibus, in which the Earth turns and goes round the Sun, was printed in Nuremberg, with an unsigned address to the reader at its front. Copernicus had been ill since the end of 1542 and died in Frombork on 24 May 1543. His friend Tiedemann Giese later wrote that the printed book reached him only on the day he died.
    story_prose:
      opening:
        - Frombork, Poland, spring 1543. Nicolaus Copernicus has been ill since the end of last year. The book he has worked on for decades, On the Revolutions, is being printed at Nuremberg; in it the earth turns on its axis and travels around the sun. Four years ago the young mathematician Rheticus came here from Wittenberg and urged him to have it printed.
        - In history, the book came off the press at Nuremberg with an unsigned address To the Reader at the front. His friend Tiedemann Giese wrote later that the printed book reached him only on the day he died; on 24 May he died at Frombork. In July Giese asked Rheticus to pass a letter asking for a corrected edition to the city council of Nuremberg. In this branch, a fisherman in the village at the foot of the hill mends nets, and a servant of the house carries water up to the sickroom every day.
        - 'Several kinds of people can help on this trip: someone who knows nursing and can keep a sickbed, or someone strong enough on the road to carry a book a long way; someone who knows papers and can tell an autograph from a copy; and someone careful enough to make an errata sheet.'
      outcomes:
        all: The book that came in early May stayed by his bed afterwards. That summer the copies lent out nearby each carried an errata sheet, and the autograph manuscript, wrapped in cloth and locked in the cupboard, later passed into Giese’s hands.
        p3: The book stayed by his bed afterwards, title page up. A few weeks later he died at Frombork.
        p2: That summer the copies lent out nearby each carried an errata sheet, its corners curling from being turned. The answers of the printers elsewhere were later kept in the same file.
        p1: The autograph manuscript, wrapped in cloth, later passed into Giese’s hands, and from him to Rheticus. Centuries later it was in the Jagiellonian Library in Kraków.
      none: Around 24 May the printed books reached Frombork. The sickroom window stood open a crack, and the servant with the water stood a while at the door and did not go in.
      desync: The papers in the study were muddled, the two piles of working papers went in with the copy meant for the printer, and no one could say where the autograph was. {staff} was recalled by the office before Giese came.
      not_admitted: '{staff} never got up the hill into the house, and spent a few days mending nets in the fishing village below. Up on the hill one window stayed lit at night.'
      points:
        p1:
          class_lettered: Late in May the papers in the study next to the sickroom were piling up in disorder. {staff} went by the method of an archivist, counted the autograph manuscript and the two piles of working papers page by page, entered them separately in a ledger, wrapped the autograph in cloth and locked it alone in a cupboard. The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.
          else: Late in May the papers in the study next to the sickroom were piling up in disorder. {staff} sat up in the study several nights running, counted the autograph manuscript and the two piles of working papers page by page, wrote them down separately, wrapped the autograph in cloth and locked it alone in a cupboard. The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.
        p2: At the end of July Giese wrote to Rheticus, asking him to pass a letter requesting a corrected edition to the city council of Nuremberg, and no answer would come for some time. {staff} went through the book page by page against the manuscript as a proofreader would, and made an errata sheet showing on which page the author’s own preface stood, and that the address To the Reader at the front was not in the manuscript. The sheet was copied several times and slipped into the copies already lent out nearby. Whoever opened the cover saw that sheet first.
        p3:
          class_medical: Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} kept the bedside as nursing requires, gave him water on time, turned him, kept the fire in the room from going out, and waited for the book from Nuremberg. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.
          class_travel: Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} went south on the road, met the cart from Nuremberg halfway, wrapped one printed copy in a coat, and brought it back to Frombork travelling day and night. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.
          else: Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} waited outside the sickroom for days, and when the books arrived took one out before the bale was even unpacked and carried it upstairs in both hands. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.
      excerpts:
        p3: When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.
        p1: The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.
        p2: The sheet was copied several times and slipped into the copies already lent out nearby. Whoever opened the cover saw that sheet first.
    relic: A brass quadrant
    relic_desc: A quarter circle for measuring the height of stars.
    points:
      p1: While Frombork can still inventory the papers, list the autograph of De revolutionibus apart from the working sheets and leave Giese a receipt for the handover
      p2: While Giese writes asking for a corrected edition, slip an errata sheet into each copy lent out nearby, saying on which page the author’s own preface stands and that the address To the Reader at the front is not in his manuscript
      p3: Bring him the printed De revolutionibus while he is still clear in mind, so that he knows the book is in print
    points_fail:
      p1: Two bundles from the desk are mistaken for the copy already sent to the printer. The original never reaches Giese, and the office recalls the employee.
      p2: Giese can only wait for the printer and the council far away, and the readers nearby still meet the address To the Reader first when they open the book.
      p3: The printed book reached his hands only on 24 May, the day he died.
    shift:
      p1:
        was: In 1543 the Nuremberg edition was printed from a copy. Copernicus’s autograph survived separately and later passed through Tiedemann Giese to Rheticus.
      p2:
        was: In July 1543 Giese asked Rheticus to forward a letter to the Nuremberg council requesting a revised edition. The unsigned text was already circulating in the 1543 first edition.
        now: The copies sent out nearby carry a correction slip. The next reader can use it to check the autograph, and the printer’s eventual response is filed with the same record.
      p3:
        was: On 24 May 1543 Copernicus died in Frombork. Giese later wrote that the finished book reached him only on the day of his death.
        now: In early May the printed book was at his bedside, and he held it while he was still clear in mind. A few weeks later he died in Frombork.
        who: copernicus_frombork
        bio: Copernicus received the printed De revolutionibus some weeks before he died, and knew that the book he had worked on for decades was in print.
    vignettes:
      preface: '{staff} opens a printed copy. The unsigned address at the front says the book''s account is only a supposition convenient for reckoning. {staff} knows it will be some fifty years before Kepler makes known who wrote it, and closes the book with a finger still on that page.'
      window: '{staff} keeps the water hot outside the sickroom. The people inside say the old man hardly knows anyone now, so {staff} pushes the window open a crack to let in the spring air.'
      nets: '{staff} helps the fishermen at the foot of the hill mend their nets with the Vistula Lagoon in view. A fisherman says that up on the hill there is an old canon who watches the stars at night.'
  vesalius_padua:
    name: The letter under the figure
    place: Padua
    figure: Andreas Vesalius
    story: Vesalius prepared the Fabrica while teaching in Padua. The woodblocks were sent from Venice to Johannes Oporinus, and the book appeared in Basel in 1543.
    relic: A checked teaching figure
    relic_desc: A fictional reader’s copy with a corrected figure reference.
    points:
      p1: Compare the figure letter with the corresponding text
      p2: Hold the two copies in place while the mismatched letter is marked
      p3: Help the next reader retrace the correction
    vignettes:
      letter: Lucia puts her finger on the letter in the margin. Marco points to a different place on the figure. You move the practice sheet against the open book until both can see where the copy drifted. Lucia changes the reference and leaves the displaced one legible in the margin.
      hold: The borrowed book has to go back and Marco still needs the figure. You hold the book open until he can mark both the image and its letter on a sheet of his own. When the owner takes the book, there is still something he can check at his desk.
      credit: You know later readers will try to name the people who made the illustrations. Lucia asks whether to put an artist’s name at the top of her practice copy. You can point to the printed figure but cannot settle who drew it. She leaves a line for a source, then closes the book.
  shakespeare_globe:
    name: A playhouse for everyone
    place: London
    figure: William Shakespeare
    story: The Chorus in Henry V asks the audience to imagine places and events beyond what a stage can show. The play belongs to the Globe's early years.
    relic: A goose quill
    relic_desc: A feather cut for writing, ink still on the tip.
    points:
      p1: Find a place where the cue can be heard
      p2: Help the player make a place clear without scenery
      p3: Stay through one more run of the entrance
    vignettes:
      back_row: You stand at the edge of the yard and signal when the last words vanish into the room. The player tries the cue again, this time facing the audience.
      space: You ask how the player will fit a whole countryside on the boards. He points to a single doorway and asks you to cross it as if it were a day's journey.
      cue: You listen for the one word that sends the next player on. They run the same entrance again and this time the door opens on the word.
  galileo_padua:
    name: Moons around Jupiter
    place: Padua
    figure: Galileo Galilei
    story: In the Starry Messenger, Galileo records changing positions of four small bodies near Jupiter and concludes that they orbit it.
    relic: A ground lens
    relic_desc: A small glass lens, polished by hand.
    points:
      p1: Keep Galileo’s dated sketches of Jupiter and its points of light in order for the copy going to Venice
      p2: At Bologna in late April, help Magini's guests see the moons of Jupiter through Galileo's telescope
    points_fail:
      p1: The loose sketches lose their order. The printer’s copy puts the nights out of sequence, and the office recalls the employee.
      p2: The guests look and say they see nothing. Horký writes to Kepler and prints a pamphlet against the Sidereus Nuncius in June.
    shift:
      p1:
        was: Galileo observed Jupiter over successive nights from January 1610 and printed positional records in Sidereus Nuncius.
      p2:
        was: In late April 1610 Galileo showed his telescope to Magini and other guests at the Palazzo Caprara in Bologna. They said they could not see the satellites, and Martin Horký, who was there, printed a pamphlet against Galileo in June.
        now: '{staff} sets the tube steady and shows the guests where to look. Several of them see the points of light beside Jupiter that night, and Horký''s pamphlet finds less ground. The new stars are accepted sooner.'
        who: galileo_padua
        bio: At Bologna in April 1610 Magini's guests saw the moons of Jupiter through Galileo's telescope. The doubt that followed the Sidereus Nuncius was shorter.
    vignettes:
      alignment: You stop the copyist from aligning the pages by their edges. Line up Jupiter instead, you suggest. The dots no longer sit on top of one another.
      telescope: You ask which dot is the fourth. The copyist sets out the sheets from several nights and asks which should be trusted when the dots seem to merge.
      dates: You mark the date on each loose sheet before the copyist stacks them. The order lets the next reader see the dots change position.
  descartes_leiden:
    name: Doubt as a method
    place: Leiden
    figure: René Descartes
    story: The 1637 Leiden edition of Descartes's Discourse on the Method appeared with three essays, on optics, meteorology and geometry.
    relic: A folded cogito note
    relic_desc: A slip with a single sentence about thinking and being.
    points:
      p1: Check the last proofs of the Discourse and its three essays at the Leiden press so all four parts can appear together
      p2: Use Descartes’s errata to check the text against the figures. Enter late changes in the retained proof
    points_fail:
      p1: Several figures are still missing from an essay. The printer has to split the volume, and the office recalls the employee.
      p2: The first proof has gone out. Late errata survive as a slip without page numbers.
    shift:
      p1:
        was: In 1637 Jan Maire printed the Discourse in Leiden with essays on optics, meteorology and geometry.
      p2:
        was: In early June 1637, in a letter two days before printing ended, Descartes mentioned a packet of errata.
        now: The printer logs late corrections by page. A query about how the text matches a figure can be traced to that copy.
        who: descartes_leiden
        bio: The first edition of 1637 went out with the corrections Descartes sent, and readers found the figures and the text in agreement.
    vignettes:
      parts: The reader is stuck on the whole problem. You mark a smaller one that can be settled first. They finish that part before opening the page with the answer.
      claim: A second reader calls the result obvious. You ask them to name the step that makes it so. They reread the middle of the example, where neither of them had stopped before.
      contents: You keep the method open beside one of its examples. The reader moves the paper marker from the rule they liked to the page where they can see it being used.
  leeuwenhoek_delft:
    name: A world in a drop of water
    place: Delft
    figure: Antonie van Leeuwenhoek
    story: In October 1676 Leeuwenhoek wrote from Delft that a drop of pepper water held thousands of little animals. In London the Fellows of the Royal Society did not believe him, and Nehemiah Grew could not see them. Through the summer of 1677 eight witnesses in Delft looked through his lenses and wrote down what they saw; he sent their testimonials to London on 5 October. In November Robert Hooke failed twice, and at the third try showed the Society the little animals himself.
    relic: A tiny brass lens plate
    relic_desc: A thumb sized plate holding one very small, very clear lens.
    points:
      p1: When word of London’s disbelief reaches Delft, hold the witnesses to it until they have looked through the lens and written down what they saw
      p2: After Hooke has failed twice to find the little animals, help him steep the pepper water and set the lens, and hold the third showing in London
    points_fail:
      p1: The first witnesses put off looking and no testimonial is written. The branch drifts out of sync, and the office recalls the employee.
      p2: Hooke’s third showing finds nothing either, and the Society’s doubt stands. The branch drifts out of sync, and the office recalls the employee.
    shift:
      p1:
        was: '18 May to 30 August 1677: eight witnesses in Delft looked through Leeuwenhoek’s lenses and wrote testimonials to the little animals in pepper water. He sent them to London with his letter of 5 October.'
      p2:
        was: 'November 1677: Robert Hooke twice failed to show the Royal Society Leeuwenhoek’s little animals, and on the third try, with pepper steeped nine or ten days in rainwater, showed great numbers of them.'
    vignettes:
      motion: The correspondent writes that something moved. You ask what the movement looked like to someone who cannot see the lens. They cross out a comparison and draw a second position beside the first.
      label: There are drawings from wood and from wine on the table. You add temporary labels before the correspondent scrapes up the stray sheets, and the pictures go in the right order.
      read: You read the observation back without pointing at its illustration. The correspondent hears where the description runs out and adds a reference to the correct diagram.
  newton_cambridge:
    name: One law for the apple and the Moon
    place: Cambridge
    figure: Isaac Newton
    story: Newton's Principia appeared in London in 1687. In the third book he brings the Moon and falling bodies under the same account of gravity. The fair copy that went to the press was not in his hand. It was written out by Humphrey Newton, his amanuensis in these years and no relation. Much later, William Stukeley wrote down Newton's recollection of a falling apple prompting a question about gravity. Stukeley says nothing about a blow to the head.
    relic: A glass prism
    relic_desc: A triangle of glass that splits white light into colours.
    points:
      p1: Pack Newton’s last corrections by volume and page and get them from Cambridge to Halley before the London press finishes
      p2: When the first edition arrives, agree with Newton how readers can submit corrections he can verify by proposition and page
    points_fail:
      p1: Two versions of a correction go out. Halley cannot assemble the last errata, and the office recalls the employee.
      p2: Correspondents use their own references. Early corrections remain scattered between letters and Newton’s copy.
    shift:
      p1:
        was: On July 5, 1687, Halley wrote that the Principia was finished and that the last errata had arrived in time.
      p2:
        was: Newton annotated his own first edition. Preparing a revised edition took years.
        now: The college keeps a corrections book indexed by proposition. Readers can record a problem and see which changes Newton later approved and when.
        who: newton_cambridge
        bio: Newton wrote the Principia in Cambridge and Halley saw it through the press in London. Newton kept revising the work after printing.
    vignettes:
      apple: “Did an apple hit him on the head?” you ask a college servant, a man made up for the game. He goes on sweeping. “I could not say. You tell me why the Moon does not come down.” You have no answer ready, and go back to the page. The apple is not written down by anyone for another sixty-five years.
      hand: The fair copy is not in the hand of the man whose name will be on the book. The servant says the one who writes it out is Mr Humphrey, a Newton too and no relation. You note it down and do not disturb him.
      diagram: On a spoiled sheet you draw the way the Moon would go if nothing held it, and then an arrow for the pull that bends its path. The servant, who cannot read the Latin, looks at the arrow for some time.
  bach_leipzig:
    name: The spring the oculist came
    place: Leipzig
    figure: Johann Sebastian Bach
    story: By the spring of 1750 Bach's eyes had failed so far that he could hardly read or write. At the end of March the travelling English oculist John Taylor came to Leipzig and operated twice on his cataracts. After the operations Bach was blind, and he died in Leipzig on 28 July.
    relic: An organ pipe cut from quill
    relic_desc: A small pipe, tuned and tested, left unsold.
    points:
      p1: Before the oculist Taylor operates, talk Bach out of the operation and treat the cataracts properly
    points_fail:
      p1: As in history Taylor operates twice at the end of March and in early April. Bach is left blind, and he dies in July.
    shift:
      p1:
        was: 'End of March to early April 1750: the English oculist John Taylor operated twice on Bach''s cataracts in Leipzig. Bach was blind afterwards, and he died on 28 July that year.'
        now: He never let Taylor operate. His cataracts were treated, and he could see the music on the page again.
        who: bach_leipzig
        bio: In this timeline Bach kept away from the two operations of spring 1750. His cataracts were treated, and he could see again in Leipzig.
    vignettes:
      entry: You hear the lower part arrive a breath before the singer expects it. You have them listen from the other side of the room. This time they raise their head before the cue.
      rest: The singer loses count during the rest. You copy the line they can hear while waiting, and they mark the word that comes just before their own entrance.
      light: Two singers share one page. You tilt it towards the light and hold it there until both can see the place where their lines separate.
  smith_kirkcaldy:
    name: A book left in trust
    place: Kirkcaldy, Scotland
    figure: Adam Smith
    story: In March 1776 Adam Smith's Wealth of Nations came out in London. On 25 August his friend David Hume died in Edinburgh. Hume had first named Smith to see his Dialogues Concerning Natural Religion into print; Smith made difficulties, and Hume left the work to the printer William Strahan instead, asking for it to appear within two years. That November, back in Kirkcaldy, Smith wrote Strahan an account of Hume's last months. Strahan in the end declined, and the Dialogues came out in 1779 through Hume's nephew.
    relic: A pin from the pin factory
    relic_desc: The kind of pin he used to show what dividing a job can do.
    points:
      p1: While the Dialogues Hume left in trust lie unprinted, talk Smith and Strahan into publishing them as Hume asked
    points_fail:
      p1: As in history the book waits three years and comes out in 1779 from his nephew without a name on it; in this branch Hume's wish to have it out within two years is not kept either.
    shift:
      p1:
        was: '7 August 1776: in a codicil Hume asked Strahan to publish the Dialogues Concerning Natural Religion within two years of his death; Smith would not take it on, Strahan in the end declined, and the book came out in 1779 through Hume''s nephew, without the author''s name.'
        now: Strahan printed the Dialogues within the two years Hume had asked for.
        who: david_hume
        bio: Within two years of his death the Dialogues he had kept back for a quarter of a century were printed by Strahan, as he had asked in his last codicil.
    vignettes:
      nails: '{staff} queues at the baker''s. The nailer ahead pays with a handful of nails, the baker counts them and takes them. Weeks later {staff} reads in a thick book out this spring that there is a village in Scotland where workmen still carry nails to the baker''s instead of money, and laughs at the page.'
      post: '{staff} helps the carrier tie up the London post. One packet is for Mr Strahan, the printer, and is thicker than the rest; {staff} slips it under the others so the rain will not reach it.'
      firth: '{staff} walks the sands at low tide. Across the Firth of Forth the smoke of Edinburgh hangs low, and the woman gathering mussels nearby says that is where the clever folk live.'
  kant_konigsberg:
    name: A question for the margin
    place: Königsberg
    figure: Immanuel Kant
    story: Kant’s first edition of the Critique of Pure Reason appeared in 1781. Its preface begins with questions that reason cannot set aside even though it cannot answer them. There would be a revised preface in 1787.
    relic: A bookseller’s label
    relic_desc: A fictional label with the first edition year in the margin.
    points:
      p1: Prepare the addresses and enclosure for Kant in Königsberg so his letter about the Critique of Pure Reason reaches Herz
      p2: Help Kant draft an introduction cross-referenced to the first edition and arrange for Herz and a few readers to try it
    points_fail:
      p1: The addresses are mixed up. The enclosure comes back, Herz misses the news during the book fair, and the office recalls the employee.
      p2: The new text circulates on its own, and readers cannot tell which first-edition questions it answers.
    shift:
      p1:
        was: On May 1, 1781, Kant wrote to Herz that the Critique of Pure Reason would appear at the book fair and asked him to deliver an enclosed letter.
      p2:
        was: The Prolegomena later appeared separately. Its development was also affected by the critical response to the Critique.
        now: The guide has page references and a set of trial readers’ responses. Kant can see which explanations still need examples.
        who: kant_konigsberg
        bio: Kant wrote in Königsberg. A publisher in Riga handled the 1781 edition, and readers sent criticism and questions back by letter.
    vignettes:
      margin: Lotte wants to copy only the part about questions a reader cannot ignore. You ask her to leave room for the limit that follows in the same sentence. She makes the letters smaller and fits both on her slip. The line now gives her a reason to open the book again.
      label: Otto writes that the book answers the hardest questions. You turn the label over and have him read the first sentence again. He writes a question in place of the boast. A customer can see from the shelf where to start looking.
      editions: You remember that another preface will appear six years later. Lotte has this copy in front of her and asks which page to mark. You put the date of this edition on her slip. She turns the first leaf just as the shop closes.
  mozart_prague:
    name: The cue before the curtain
    place: Prague
    figure: Wolfgang Amadeus Mozart
    story: Mozart wrote from Prague that Don Giovanni went on stage on 29 October 1787. An earlier letter describes problems getting the opera ready.
    relic: A corrected rehearsal part
    relic_desc: A fictional part with one rest crossed out.
    points:
      p1: Reschedule the opening rehearsal after illness hits the small company and protect the 29 October premiere of Don Giovanni
      p2: Have Mozart approve a complete Prague copy while the premiere parts are still in the theater
    points_fail:
      p1: The choir and orchestra cannot fit in another rehearsal and the 29 October premiere is canceled again. The office recalls the employee after a loss of sync.
      p2: Vienna's revisions and the older Prague passage readings circulate together and a later company has to piece the versions together.
    shift:
      p1:
        was: On 29 October 1787 Don Giovanni premiered in Prague after inadequate preparation and a singer's illness forced postponements.
      p2:
        was: In 1788 Mozart made changes for the Vienna production of Don Giovanni.
        now: '{staff} gets a copy checked against the Prague performance and has the replacement pages kept separately. When another city changes the score, the Prague stage version remains legible.'
        who: mozart
        bio: When Mozart revised Don Giovanni he had a checked Prague copy to work from. He retained each city's parts as a distinct version.
    vignettes:
      cue: Anna’s part gives her one extra rest. You tap where the other voice enters and let her mark which word she can listen for. On the next run she comes in on time. The part still has the crossed-out rest, and Anna asks you to keep it visible.
      swap: Jan has time to replace a page or fetch the missing singer. You take the walk to the stairs while he copies the page. By the time the curtain moves, both the new page and the singer are at the stand. Someone under the stage is still looking for the old copy.
      applause: You know Mozart will write about the applause. Jan asks whether anyone in the house will hear the extra rest. You give him the corrected page and tell him where to listen for Anna. When you leave, the curtain has risen and the cue has yet to come.
  lavoisier_paris:
    name: Before the arrest order
    place: Paris
    figure: Antoine Lavoisier
    story: On 24 November 1793 the arrest of all the former tax farmers was ordered, and Lavoisier and his father-in-law Jacques Paulze were among those imprisoned. On 8 May 1794 the two of them and other former tax farmers were condemned and put to death in Paris on the same day.
    relic: A precision balance
    relic_desc: A fine balance that kept the books of chemistry.
    points:
      p1: Before the arrest order comes, persuade his father-in-law Paulze to leave Paris, and save him
      p2: Before the arrest order comes, persuade Lavoisier to leave Paris and keep out of sight, and save him
    points_fail:
      p1: As in history Paulze is imprisoned at the end of November, and on 8 May 1794 he is put to death on the same day as his son-in-law.
      p2: As in history Lavoisier is imprisoned at the end of November, and on 8 May 1794 he is put to death in Paris.
    shift:
      p1:
        was: '24 November 1793: the arrest of all the former tax farmers was ordered, Jacques Paulze among them. On 8 May 1794 he was put to death on the same day as his son-in-law Lavoisier.'
        now: He left Paris before the arrest order came, and lived.
      p2:
        was: '24 November 1793: the arrest of all the former tax farmers was ordered, and Lavoisier was imprisoned. On 8 May 1794 he was put to death in Paris.'
        now: He left Paris ahead of the arrest order, lived through those months, and went back to his laboratory.
        who: lavoisier_paris
        bio: In this timeline Lavoisier left Paris before the arrest order of November 1793, and lived on past 1794.
    vignettes:
      units: Two numbers line up beautifully, but the unit on one row has slipped. You catch it before the compositor locks the columns in place.
      air: You ask why the table accounts for something the reader cannot see. The compositor taps the headings for what entered and what remained, then leaves both headings in the proof.
      proof: You put a scrap of paper under the current row as the compositor reads. A number that looked like part of the next example finds its own heading again.
  jenner_berkeley:
    name: The first vaccine
    place: Berkeley, England
    figure: Edward Jenner
    story: Jenner's 1798 Inquiry records earlier observations and cases concerning cowpox and smallpox.
    relic: A glass lancet
    relic_desc: A thin blade for the first small scratch.
    points:
      p1: Dress the cowpox sores on Sarah Nelmes's hand, so the milkmaid does not suffer them alone
      p2: Pass the cowpox on from arm to arm, so the work does not stop after one boy
    points_fail:
      p1: The sores on her hand ran their course with nobody to dress them. In this branch nobody eased the milkmaid's days.
      p2: The matter on the boy's arm dried up with no one to take it on. In this branch Jenner waited for the cowpox to come back to the dairies, as in history.
    shift:
      p1:
        was: In May 1796 the dairymaid Sarah Nelmes caught cowpox from her master's cows, and a large pustular sore formed on her hand with the usual symptoms of the disease.
        now: '{staff} kept her hand clean and bound, and she was back at the dairy a few days sooner.'
      p2:
        was: On 1 July 1796 Jenner inoculated the boy with smallpox matter and no disease followed; then his inquiry stopped, and he took it up again only in the spring of 1798, when cowpox broke out again in the dairies.
        now: '{staff} helped take the matter from the boy''s arm on to the next arm, and that summer Jenner had more cases in his notebook. He did not have to wait for the dairies.'
        who: jenner_berkeley
        bio: In this timeline Jenner kept the cowpox going from arm to arm in the summer of 1796, and did not have to wait two years for it to return to the dairies.
    vignettes:
      firsthand: A fictional copyist has written every account in the same voice. You ask which one the writer actually saw. The copyist adds a note beside the rest rather than giving every line the same weight.
      order: Two observations have traded places in the copy. You check the dates, and the copyist reverses the slips before using the order to tell a story.
      blank: You leave room under a note the copyist cannot confirm. By the time the page is passed on, the blank has a label so no one mistakes it for an omission.
  beethoven_vienna:
    name: The Ninth Symphony
    place: Vienna
    figure: Ludwig van Beethoven
    story: In the spring of 1824 Beethoven, almost entirely deaf, prepared a concert of his new works in Vienna. The chorus and orchestra rehearsed apart, and there were only two full rehearsals before the night. On 7 May 1824 the Ninth Symphony was first performed at the Kärntnertor Theatre, with the theatre's Kapellmeister Michael Umlauf conducting and Beethoven on the stage beside him. The repeat on 23 May in the great Redoutensaal drew a thin house, and the receipts disappointed him.
    story_prose:
      opening:
        - Vienna, spring 1824. Beethoven is almost entirely deaf. He is getting up a concert of his new works, with the Ninth Symphony to close it. What the orchestra plays in rehearsal, someone has to write down for him in a conversation book.
        - In history, the chorus and orchestra rehearsed in separate rooms and came together for the first time only two days before the premiere. After the premiere on 7 May the concert was given again on the 23rd in the great Redoutensaal, with many seats empty, and the receipts disappointed him. In this branch, parts not yet dry lie under weights on the copyists’ table, and behind the theatre a soprano rubs her throat and complains about the high notes in the last movement.
        - 'Three kinds of people can help on this trip: someone who reads a score and can hold the beat when the two groups first rehearse together, someone who can hear what is wrong and will write it down point by point for the composer, and someone persuasive enough to sell the seats before the townspeople leave.'
      outcomes:
        all: On the night of 23 May there were still many empty seats in the hall, but the booked rows at the front were full. The list stayed tucked in his conversation book from then on.
        p3: On the night of 23 May there were still many empty seats in the hall, but the booked rows were full.
        p2: On the night of the premiere every section played the marked entries as they had been marked. The sheet stayed tucked in his conversation book afterwards.
        p1: On the evening of 7 May the chorus and orchestra came in on the same beat. Beethoven stood beside Umlauf, his back to the audience.
      none: In the hall on 23 May, row upon row of empty chairs stood in neat lines under the lamps.
      desync: At the combined rehearsal on 5 May the two sides never came in together. When {staff} was recalled, the premiere was two days off, and players in the orchestra were still arguing over which beat to come in on.
      not_admitted: '{staff} never got backstage at the theatre. The chorus and orchestra were still practising in their separate rooms, and the premiere was only days away.'
      points:
        p1: On 5 May the chorus and orchestra crowded into one room for the first time. In the opening bars each side came in at its own speed. {staff} stood between orchestra and chorus and beat time from the score, beat by beat, for both to see. They went again, and the two sides came off the last beat together. Beethoven stood in a corner, unable to hear, and saw only every bow and every mouth stop at the same moment.
        p2: On the day of the dress rehearsal {staff} copied onto one sheet the entries that had gone wrong at the combined rehearsal the day before, noting which part, which bar and what was off, and handed it to Beethoven. He held the paper close to his eyes for a long time and made marks beside several places with a pen. When he handed it back, there were marks over marks.
        p3: In late May the wealthy families of the town began sending their trunks to the country. {staff} went from door to door with the programme. At one house the steward opened the door only halfway and said his master was leaving the day after tomorrow. {staff} unfolded the programme, pointed to the line with the Ninth Symphony, and said that the man who wrote it could no longer hear. The steward took the sheet inside and came back with a note for a deposit. That evening the list of booked seats was brought to Beethoven’s lodgings. He laid the sheet under his conversation book and read down the names one by one, and when he reached the last, read them again from the top.
      excerpts:
        p3: That evening the list of booked seats was brought to Beethoven’s lodgings. He laid the sheet under his conversation book and read down the names one by one, and when he reached the last, read them again from the top.
        p2: He held the paper close to his eyes for a long time and made marks beside several places with a pen. When he handed it back, there were marks over marks.
        p1: They went again, and the two sides came off the last beat together. Beethoven stood in a corner, unable to hear, and saw only every bow and every mouth stop at the same moment.
    relic: An ear trumpet
    relic_desc: A horn he held to his ear as the world went quiet.
    points:
      p1: Bring the separately rehearsed choir and orchestra together at the first joint rehearsal and protect the Ninth's premiere
      p2: Leave Beethoven a written account of the combined rehearsal so he can respond before the concert
      p3: Secure advance blocks of seats before listeners leave Vienna and salvage the second concert's receipts
    points_fail:
      p1: The groups lose their place when they come in, and a passage drops out at the premiere. The branch falls out of sync and the office recalls the employee.
      p2: Players mark their parts separately and the rehearsal problems never reach the composer for review.
      p3: The repeat comes after the season. Too many seats are empty for Beethoven to make the return he hoped for.
    shift:
      p1:
        was: On 7 May 1824 Beethoven's Ninth Symphony was first performed in Vienna.
      p2:
        was: In May 1824, during preparations for the premiere, musicians conveyed rehearsal news to Beethoven in his conversation books.
        now: '{staff} puts the most troublesome entries on one page and has the sections try them again with marks Beethoven has approved.'
      p3:
        was: On 23 May 1824 the second concert took place in Vienna and brought in disappointing receipts.
        now: '{staff} secures reservations before prospective listeners leave the city and has those receipts included in the accounts. Beethoven has room to arrange a further concert on his own behalf.'
        who: beethoven_vienna
        bio: Beethoven had advance revenue when he arranged repeat concerts in Vienna. He could cover more of their costs before the doors opened.
    vignettes:
      parts: '{staff} sits at the copyists'' table pressing parts flat while the ink dries. The horn parts are snatched away to the rehearsal room before they are dry, and {staff} spends the afternoon blotting the smudges out of the second set.'
      prater: On Sunday {staff} walks the long avenue of the Prater. Every bench is taken by people come out of town for the air, a sausage seller is shouting himself hoarse, and nobody seems to be on the way to a concert.
      stools: '{staff} carries stools for the chorus behind the theatre. A soprano rubs her throat and says the high notes in the last movement are written as if to haul a singer up to the ceiling, and the whole row laughs and agrees.'
  faraday_london:
    name: Electricity from magnetism
    place: London
    figure: Michael Faraday
    story: On 29 August 1831 Faraday recorded a transient needle movement using two sets of coils wound around an iron ring.
    relic: An iron ring and coil
    relic_desc: Two coils of wire on a ring of soft iron.
    points:
      p1: Watch the switching and the needle separately to preserve the fleeting deflection in Faraday's ring experiment
      p2: Before review delays the printed paper, persuade the Royal Society to circulate an abstract with the date it received the work
    points_fail:
      p1: The needle is back at rest before anyone looks. The experiment is entered as a null result, and the office recalls the employee after a loss of sync.
      p2: Printing remains slow. Faraday has to write again, and readers struggle to place the various accounts in order.
    shift:
      p1:
        was: On 29 August 1831 Faraday observed a brief induced current when the iron-ring apparatus was switched on and off.
      p2:
        was: On 24 November 1831 the Royal Society heard Faraday's paper. Printing was delayed into the next year, and Faraday wrote to hurry it along.
        now: '{staff} has the Society send a dated abstract while the review runs its course. Readers can check which results Faraday had reported by the date of the reading.'
        who: faraday_london
        bio: Faraday had a dated Society abstract before his induction paper appeared in print. He could use the same arrangement to put later experiments on the public record.
    vignettes:
      instant: The assistant writes that the needle moved. You leave space for when it moved. By the time he looks back at the instrument, the needle has settled.
      skeptic: You ask whether the reading stayed put. The assistant points to the blank after the first mark. Together you label it as a return to rest so nobody mistakes the blank for a missed reading.
      sketch: You draw the ring in the margin and mark its two sets of windings on opposite sides. The assistant can now match the observation to the right apparatus.
  darwin_galapagos:
    name: Islands and the variety of life
    place: Galápagos Islands
    figure: Charles Darwin
    story: Darwin visited the Galápagos on the Beagle from September to October 1835. On Charles Island the vice-governor Lawson told him the tortoises differed from island to island; Darwin later wrote that he did not pay enough attention at the time, and had already mixed the collections of two islands. From 8 to 17 October he, Bynoe and their servants camped on James Island while the ship went for water, with only a poor little spring near the tent. His bird notes associate mockingbird specimens with particular islands.
    relic: A finch feather
    relic_desc: A small brown feather from the islands.
    points:
      p1: On James Island, where the camp has one poor little spring, keep the shore party going until the ship returns, and see the island's collecting done
      p2: When Lawson says the tortoises differ from island to island, make Darwin take note there and then, and keep the birds of each island labelled and packed apart
    points_fail:
      p1: The shore party runs out of water and the James Island collecting is never made. This branch has come loose from history, and the office recalls the employee that day.
      p2: As in history Darwin pays little heed to Lawson. The collections of Chatham and Charles Islands are already mixed, and most of the finches carry no island.
    shift:
      p1:
        was: '8 to 17 October 1835: Darwin, Bynoe and their servants camped on James Island with a tent and provisions while the Beagle went for water; near the camp there was only a poor little spring.'
      p2:
        was: 'Late September 1835: on Charles Island the vice-governor Lawson told Darwin the tortoises of each island could be told apart. Darwin later wrote that he had not paid enough attention, had already mixed the collections of two islands, and had mixed most of his finches.'
        now: He took Lawson at his word that day, and brought the birds of each island home to England labelled and packed apart.
        who: darwin_galapagos
        bio: In this timeline Darwin listened to Lawson on the Galápagos, and collected and labelled the finches and mockingbirds island by island before taking them home to England.
    vignettes:
      two_tags: One tag says only 'island'. You set it aside until the helper can find the separate landing note. The two specimens stay apart even after the trays are put away.
      differences: The helper points to two similar-looking birds and wants one entry for both. You ask which island each came from. They leave both labels in the book so the likeness can be considered again later.
      drawer: You keep the paper label beside the tray until the helper can read the name back to you. When they close the drawer, the note stays where it belongs.
  lovelace_london:
    name: The first program
    place: London
    figure: Ada Lovelace
    story: In 1842 the Italian engineer Luigi Menabrea published in French an account of Charles Babbage's Analytical Engine. Ada Lovelace translated it and added seven notes, about three times as long as the article; the last, Note G, sets out how the engine could work out the Bernoulli numbers. In August 1843 Babbage wanted the paper to carry his own complaint against the government, and asked her to withdraw it when the editor would not print it unsigned. She refused, and the translation and Notes, signed A.A.L., appeared in Taylor's Scientific Memoirs that year. On 14 August she offered to organise the business of building the engine if Babbage would keep to the engineering; he refused her conditions.
    relic: A punched card
    relic_desc: A card of holes, meant to tell an engine what to do.
    points:
      p1: With Lovelace’s permission, send her translation and notes to press together
      p2: Before the last proof goes back, have Lovelace and the compositor read across the table in Note G and mark the entries most likely to slip into another column
      p3: Put her division of work in a short proposal for a possible backer. Lovelace would organize the undertaking, Babbage would lead the engineering, and both would agree to a first meeting
    points_fail:
      p1: The printer receives both instructions to proceed and instructions to wait. The translation and notes are pulled from the issue, and the office recalls the employee
      p2: The compositor resets several symbols and nobody reads the rows from the beginning. She has to check the formulas and table against each other in the last few hours
      p3: Her proposal ends with Babbage’s reply. When someone else asks about backing the work, they have no plan both are willing to hand over
    shift:
      p1:
        was: In August 1843 Babbage asked her to request the editor’s permission to withdraw. Lovelace refused, and the translation and her initialed notes appeared together that year.
      p2:
        was: On August 15 Lovelace told her mother that the printers had summoned her for further supervision and that correcting the mathematical formulas was consuming her time.
        now: The printer keeps a proof she has checked column by column. When a symbol has to be reset, the compositor can use it to check the neighboring columns.
      p3:
        was: On August 14 Lovelace proposed that she and other backers conduct the business so Babbage could devote his time to engineering. He declined her terms.
        now: They agree to show one prospective backer the drawings and an outline of costs. The visitor takes away an account of who would do what and agrees to decide about money after a technical review.
        who: lovelace_london
        bio: Lovelace translated the article and wrote its technical notes. She also looked for a way to organize work on an engine that still existed largely on paper.
    vignettes:
      messenger: '{staff} waits under the portico of a house in St James''s Square as the messenger, and a messenger does not sit. Inside, someone writes, crosses out and writes again; at dusk a letter with the wax still soft is put into {staff}''s hand, for Dorset Street.'
      compositor: '{staff} helps the compositor pick type. This issue is all Greek letters, indices and little numbers set above the line, he grumbles, the sigma box is nearly empty, and whoever wrote it ought to come and set it herself.'
      loom: '{staff} stops at a weaver''s door in Spitalfields. On the Jacquard loom the punched cards turn over one after another, and a flower comes up in the silk. The weaver says the cards know the pattern better than he does.'
  nightingale_scutari:
    name: Nursing as a discipline of data and care
    place: Scutari, Ottoman Empire
    figure: Florence Nightingale
    story: Florence Nightingale's 1858 report on army health drew on the recent war and included hospital statistics. it is not the creation of the eventual report.
    relic: A small oil lamp
    relic_desc: The lamp from her night rounds.
    points:
      p1: Through the typhus and cholera on the wards, keep the Sanitary Commission’s inspection of the Scutari hospitals going from 6 March
      p2: Stop the revolver going off in the tent at Balaklava and save the sanitary commissioner Hector Gavin
      p3: Cure the Crimean fever Nightingale catches at Balaklava in May, before it can stay with her for the rest of her life
    points_fail:
      p1: The inspection stalls in the sick wards and the blocked sewers are not opened in time. This branch falls out of step with history and the office recalls the employee.
      p2: The shot is fired in the tent, and in this branch too the commission loses one of its three members a month after landing.
      p3: The fever runs its course. She is out of danger by the end of May, but in this branch, as in history, the illness stays with her.
    shift:
      p1:
        was: On 6 March 1855 the Sanitary Commission reached Constantinople and began that afternoon to examine the hospitals at Scutari.
      p2:
        was: On 21 April 1855 the sanitary commissioner Hector Gavin was killed in the Crimea when his revolver went off as he handed it to his brother.
        now: '{staff} takes the revolver from the hand-over and unloads it. Gavin goes on with the commission’s work in the camps and returns to Britain.'
      p3:
        was: In May 1855 Nightingale went to inspect the hospitals at Balaklava and caught Crimean fever within days; she was dangerously ill for about twelve days, and was an invalid for much of her later life.
        now: '{staff} treats the fever in its first days with medicine the century does not have. Nightingale is on her feet within the week and goes back to Scutari without the illness that followed her home.'
        who: nightingale_scutari
        bio: In this branch Nightingale was cured of the fever she caught at Balaklava in 1855. She carried her work on hospitals and army health in person, on her feet rather than from a sickroom.
    vignettes:
      totals: A fictional clerk adds the transfer list to the admissions total. You ask which names are newly admitted. They leave the transfers in their own column before sending the return.
      name: The clerk cannot hear a name over the room's noise. You wait beside the person who gave it until they can say it again. The next copy spells it as they asked.
      fold: You set the ward papers in the order the clerk calls out. The sheet that used to appear after the total now arrives before it.
  mendel_brno:
    name: Peas and the rules of heredity
    place: Brno
    figure: Gregor Mendel
    story: From 1856 to 1863 Gregor Mendel crossed pea plants in the garden of his house in Brno and counted their offspring. On 8 February and 8 March 1865 he reported the results in two talks to the Natural History Society of Brno, and the paper was printed in the society's proceedings in 1866. It was hardly taken up in his lifetime. Mendel died in 1884, and in 1900 three botanists came upon his paper while working on heredity themselves.
    relic: A pea pod
    relic_desc: A dried pod from the monastery garden.
    points:
      p1: Help Mendel fit eight years of counts into two talks and protect both readings to the Brno society
      p2: Separate the counts by generation so listeners can check the numbers they heard
      p3: While the listeners are still there, help Mendel arrange a replication at another site before the printed account comes out
    points_fail:
      p1: The first meeting runs out of time and the second is never scheduled. The account is incomplete and the office recalls the employee after a loss of sync.
      p2: Readers take home a total but cannot tell which counts came from the first generation and which came later.
      p3: Readers outside Brno must wait for the proceedings and offprints, and no one who attended has agreed to repeat the counts.
    shift:
      p1:
        was: On 8 February and 8 March 1865 Mendel reported his pea experiments in two talks to the Brno Natural History Society.
      p2:
        was: The 1865 talks drew on years of pea counts. The paper published in 1866 separated the results by generation.
        now: '{staff} has Mendel leave a comparison sheet after the talk so listeners can check their own notes against it.'
      p3:
        was: The Brno society printed the paper in 1866. Mendel used offprints to correspond with other scholars about checking his results.
        now: '{staff} records the addresses of willing observers and agrees on which counts to send back. In the next growing season one observer sends figures to Brno that Mendel can compare with his own before the proceedings circulate.'
        who: mendel_brno
        bio: Mendel's paper eventually appeared in the proceedings. A replication set in motion at the talks brought him earlier results he could check independently.
    vignettes:
      straw: '{staff} helps the porter lay straw mats at the door of the meeting room. Snow melts off every pair of boots, and the porter says the gentlemen would sooner hear about peas than wipe their feet.'
      market: '{staff} helps an old woman at the Cabbage Market sort dried peas, the round ones in one heap and the wrinkled in another. The round ones sell better, she says; {staff} counts both heaps anyway and comes out at nearly three to one, and laughs first.'
      furrow: At the end of March {staff} walks the field paths outside the town. A farmer is spreading the winter's dung and says the peas must go in early this year, ahead of the late frosts.
  mendeleev_petersburg:
    name: The periodic table
    place: Saint Petersburg
    figure: Dmitri Mendeleev
    story: On 1 March 1869 Dmitri Mendeleev drew up a one-page table grouping the elements by atomic weight and chemical similarity. At the Russian Chemical Society meeting on 18 March, Nikolai Menshutkin read the paper in Mendeleev's absence. The minutes deferred discussion to the next meeting, where the subject was not taken up. The table appeared in Mendeleev's chemistry textbook later in March and was circulated separately. In a German abstract that spring, periodic recurrence became stepwise change.
    relic: A deck of element cards
    relic_desc: Hand written cards that can be dealt like patience.
    points:
      p1: With Mendeleev already out of town, get the paper and table he left for Menshutkin to the Chemical Society meeting together
      p2: When the author returns, recover the item set aside for discussion and give him time at the next meeting to answer questions about the table
      p3: Before the German abstract goes to press, have Mendeleev check its first conclusion and restore the word that says properties recur periodically
    points_fail:
      p1: Menshutkin receives only the table. The paper is still packed with the author’s things, so the society drops the item and the office recalls the employee.
      p2: The deferred item stays on the previous page of minutes. The next meeting sets aside no time to discuss the elements.
      p3: The German copy has gone to the compositor. Readers see properties changing in steps and miss the claim that they recur.
    shift:
      p1:
        was: 'On March 18, 1869 (March 6 in the Russian calendar), Menshutkin presented the paper for Mendeleev. Mendeleev was absent: by one account he had left to inspect cheese dairies in Tver Governorate, by another he was ill.'
      p2:
        was: The minutes deferred discussion because Mendeleev was absent. Later meetings did not take it up.
        now: The society gives Mendeleev time to answer at its next meeting. He marks the disputed entries and agrees to check them with the chemists who raised them.
      p3:
        was: The 1869 German abstract used a word for stepwise change where the Russian original asserted periodicity.
        now: The German abstract says that the properties recur periodically. A correspondent who has read only the abstract asks about the difference between recurrence and an exception, and Mendeleev can answer from the table.
        who: mendeleev_petersburg
        bio: Mendeleev put together an early table in St. Petersburg and circulated it through a society meeting, loose sheets and journals. As the work crossed languages, a central term changed meaning.
    vignettes:
      flyers: '{staff} helps at the printer''s, hanging the fresh sheets of a table on a line to dry. The compositor grumbles that he has never set a page with so many empty boxes and question marks, and asks whether the gentleman forgot to fill them in.'
      neva: The ice on the Neva has gone. {staff} stands with the crowd on the embankment as a boat crosses from the fortress to the palace, and a man alongside says that until that boat crosses, nobody may.
      samovar: '{staff} learns to draw tea from a samovar at the inn. The keeper says foreigners always turn the tap the wrong way and scald their boots, and watches {staff}''s feet the whole time.'
  pasteur_paris:
    name: The summer at Arbois
    place: Arbois
    figure: Louis Pasteur
    story: In the summer of 1859 Pasteur's eldest daughter Jeanne, nine years old, was staying with her grandfather at Arbois while her father worked in Paris. In September she fell ill with typhoid fever and died there.
    relic: An arrival slip
    relic_desc: An invented record that distinguishes arrival from later news.
    points:
      p1: When the typhoid fever takes hold, nurse Jeanne through it and cure her
    points_fail:
      p1: As in history the fever does not break. Jeanne dies at Arbois in September.
    shift:
      p1:
        was: 'September 1859: Pasteur''s eldest daughter Jeanne, nine years old, died of typhoid fever at Arbois, where she was staying with her grandfather.'
        now: The fever broke and Jeanne got well. In the autumn she went back to her parents in Paris.
        who: pasteur_paris
        bio: In this timeline Pasteur's eldest daughter Jeanne came through the typhoid fever of 1859 at Arbois and grew up with her brother and sisters.
    vignettes:
      date: Claire has copied the day the letter was brought in beside the name in the arrival register. You set the envelope next to the register, and she finds the difference. Both dates stay on the desk, each beside the event it marks.
      address: Émile has offered to take the family’s reply while Claire keeps the register. You give him a narrow slip with just the address he needs. He checks it before leaving and the register stays closed while the visitors wait.
      future: You know this case will be remembered long after the boy leaves. Claire needs a line describing what is known today. You enter the arrival and leave the later news for its own date. The latest envelope is still unopened when your visit ends.
  curie_paris:
    name: Two new elements
    place: Paris
    figure: Marie Curie
    story: In April 1898 Marie Curie reported that pitchblende gave off stronger rays than its uranium could explain. Working with Pierre Curie at the School of Industrial Physics and Chemistry in Paris, she separated its parts and followed the rays. On 18 July 1898 they announced a new element and named it polonium, after her native Poland; on 26 December, with Gustave Bémont, they announced radium. Marie Curie died in 1934 of aplastic anaemia, generally linked to her long exposure to radiation.
    relic: A tube of pitchblende
    relic_desc: A glass tube of dark ore that left a faint glow in the dark.
    points:
      p1: Before the year-end reading, match the records still awaiting an independent check and protect the second report
      p2: Use the two reports to secure a regular workroom for Curie and protect the instruments and records for later measurements
      p3: From now on, put shielding between Marie and Pierre and their samples, and protect their hands and bodies from the rays
    points_fail:
      p1: The independent observation cannot be matched to the team's records before submission. The year-end report is lost, and the office recalls the employee.
      p2: The team still shares makeshift benches. When the weather turns they have to move instruments and wait for space.
      p3: They still handle the samples bare handed, and year after year the radiation falls on them both.
    shift:
      p1:
        was: On 26 December 1898 the Paris Academy received a report on a new radioactive substance and published an independent spectroscopic observation alongside it.
      p2:
        was: In 1898, after the two reports, the Curies continued their research in makeshift space at the school.
        now: '{staff} presents both reports alongside a record of interruptions to someone who can arrange space. The school sets aside a room for long-term measurements.'
      p3:
        was: On 4 July 1934 Marie Curie died of aplastic anaemia, generally attributed to her long exposure to radiation.
        now: From 1898 on, both of them worked with their samples behind shielding and took far less radiation over the years. Marie stayed in better health than in history and worked for some years longer.
        who: curie_paris
        bio: Marie Curie worked with radioactive material behind shielding from 1898 on. She was spared the heavy radiation damage of her later years and worked some years longer.
    vignettes:
      shed: Rain comes through the roof of the shed in the school yard. {staff} sets out basins under the leaks and moves a bench of glassware away from the drips, and the stove in the corner hardly warms the room.
      borscht: '{staff} eats at a small place in the Latin Quarter. At the next table two Polish students argue in Polish until their beetroot soup goes cold, and the owner says there are more Poles round here than pigeons on the Seine.'
      bookstall: At a bookstall on the Seine {staff} turns up a pamphlet about the new rays that pass through flesh. The stallholder says people these days will pay for anything they cannot see.
  freud_vienna:
    name: Two years for one book
    place: Vienna
    figure: Sigmund Freud
    story: On 4 November 1899 Sigmund Freud's The Interpretation of Dreams appeared in Vienna, and the publisher printed 1900 on its title page. Freud later called the book his reaction to the death of his father. The first printing was 600 copies, and it took eight years to sell them; a second edition came only in 1909.
    relic: A dated bookseller’s slip
    relic_desc: A delivery slip from a Viennese bookshop, dated November 1899, for a book whose title page says 1900.
    points:
      p1: In the quiet weeks after the book appears, get The Interpretation of Dreams into the hands of colleagues who will read it to the end
    points_fail:
      p1: The book draws little notice. The first printing of 600 copies takes eight years to sell.
    shift:
      p1:
        was: On 4 November 1899 The Interpretation of Dreams appeared in Vienna in a first printing of 600 copies, dated 1900. They took eight years to sell.
        now: '{staff} carries copies to a few colleagues who read the whole book that winter. Letters and argument about it start years earlier, and the first printing does not wait eight years.'
        who: freud_vienna
        bio: Freud's book on dreams found serious readers in its first year. The discussion he waited years for began in the winter of 1899.
    vignettes:
      window: '{staff} stands a long while at the window of a bookshop in the inner city. The new book on dreams lies in a corner, open at the title page, which says 1900. The assistant comes out to wipe the glass and says it only counts as new next year; for now it is keeping its place warm.'
      cafe: '{staff} takes the newspapers down from the rack in a coffee house and goes through every review column; the book is not in any of them. A doctor at the next table says nobody has time for three hundred pages about dreams, and orders another coffee to finish his paper.'
      snow: At the end of December it snows. {staff} helps the bookshop boy clear the doorway, and the boy, leafing through the order book with cold fingers, says the dream book has hardly moved this month, and asks whether dreams sell better in summer.
  cajal_barcelona:
    name: Nerve cells as separate units
    place: Barcelona
    figure: Santiago Ramón y Cajal
    story: From the end of 1887 Santiago Ramón y Cajal held the chair of histology in Barcelona. In May 1888 he paid for the first number of his own journal and sent most of its few copies to researchers abroad, who seldom read Spanish. In October 1889 he went to the meeting of the German Anatomical Society in Berlin at his own expense and showed his slides under the microscope; Albert von Kölliker, the senior histologist there, took up his work. In 1906 he shared the Nobel Prize with Camillo Golgi.
    story_prose:
      opening:
        - Barcelona, autumn 1889. Santiago Ramón y Cajal teaches histology at the university and studies the branches of nerve cells in silver-stained sections. The year before, he paid out of his own pocket for the first number of his own journal, some sixty copies, most of them posted abroad.
        - In history, colleagues abroad seldom read Spanish, and his papers drew little notice. On 26 September he received leave to travel, raised the fare to Berlin himself, and in October set his slides under the microscope at the meeting of the German Anatomical Society; from then on Kölliker supported him. In this branch, a student in the laboratory keeps watch over a jar of tissue soaking in potassium dichromate, and has been to the railway station to ask the fare to Berlin.
        - 'Two kinds of people can help on this trip: someone who can keep the accounts and the slides in order and hold to a schedule, and someone who knows foreign languages, can find a translator and can persuade people to help.'
      outcomes:
        all: In October, in the meeting hall in Berlin, there was a queue at the microscope. The man at the front of it held those few translated pages.
        p2: From then on, every envelope Cajal sent abroad had a translated set of captions inside.
        p1: In October, in the meeting hall in Berlin, Cajal slid a section under the microscope, stepped back, and asked people to look.
      none: In the laboratory in Barcelona the packets of slides still lay stacked in their wooden case, and never left the table.
      desync: By the end of the month the fare was still short, and the slides were not yet packed. When {staff} was recalled, Cajal was putting a written account into an envelope to post to Berlin.
      not_admitted: '{staff} never got into that laboratory. The slides still lay spread on the table, and the day for Berlin drew nearer.'
      points:
        p1: On 26 September leave to travel came through, but the fare was his to pay. {staff} listed on a sheet every sum that could be drawn on, then sorted the slides to be taken into packets by number, wrapped each packet in soft paper, and packed them into a wooden case with partitions. The accounts balanced, and the lock on the case clicked shut. Cajal rested the case on his knees, and kept it in his arms all the way onto the train for Berlin.
        p2:
          class_lettered: As translators do, {staff} went through the drawings with Cajal one by one, putting the caption under each into German, and asking at every point what each fibre should be called before writing it down. Once the short paper was fair-copied, it went first to a few colleagues willing to check it against slides. In Berlin, someone was already waiting for him at the microscope with those few pages in hand.
          else: '{staff} found a translator in the city who knew German, persuaded him to set aside his own work, and sat him down with Cajal to go through the drawings one by one, putting the caption under each into German. Once the short paper was fair-copied, it went first to a few colleagues willing to check it against slides. In Berlin, someone was already waiting for him at the microscope with those few pages in hand.'
      excerpts:
        p2: Once the short paper was fair-copied, it went first to a few colleagues willing to check it against slides. In Berlin, someone was already waiting for him at the microscope with those few pages in hand.
        p1: The accounts balanced, and the lock on the case clicked shut. Cajal rested the case on his knees, and kept it in his arms all the way onto the train for Berlin.
    relic: A fine drawing pen
    relic_desc: A pen so fine it drew every branch of a neuron.
    points:
      p1: Assemble the funds and slides after public funding fails and protect Cajal's demonstration in Berlin
      p2: Find a collaborator to translate the illustrated notes so foreign colleagues can check them before the meeting
    points_fail:
      p1: He cannot make the trip at his own expense and sends only the written account. The branch falls out of sync and the office recalls the employee.
      p2: Readers abroad only start seeking out the Spanish reports after Berlin and still have to write for explanations one by one.
    shift:
      p1:
        was: On 26 September 1889 Cajal received leave, paid for his own journey, and in October showed slides at the Berlin meeting.
      p2:
        was: In 1889 Cajal reported that his Spanish papers had attracted little attention abroad before the Berlin demonstration helped circulate his results.
        now: '{staff} has a translator check the note with Cajal against the figures, then sends it to colleagues willing to examine the slides. After the meeting Cajal has a regular route for circulating illustrations and text.'
        who: cajal_barcelona
        bio: Cajal developed a regular translation collaboration while in Barcelona. He could find readers abroad willing to check his slides as he sent out later papers.
    vignettes:
      stain: '{staff} helps a student drop small blocks of tissue into a jar of dichromate. The student says this jar is to sit untouched until next week, and anyone who opens it to look will be made to cut the next hundred sections himself.'
      ticket: '{staff} goes with the student to the railway station to ask the fare to Berlin. The clerk names it, the student whistles, and on the way back works out on his fingers how many numbers of the journal that would have printed.'
      rain: In November it rains in Barcelona. {staff} helps the student bring in a stack of plates drying on the window sill. The student counts them twice before he lets the shutter close.
  marconi_bologna:
    name: A signal and a silence
    place: Bologna
    figure: Guglielmo Marconi
    story: In his 1909 Nobel lecture, Marconi recalled starting wireless telegraphy trials near Bologna early in 1895. It uses the date and setting in the retrospective account and invents the individual test.
    relic: Two trial slips
    relic_desc: Fictional records of the same trial from the two ends.
    points:
      p1: Before the trip, give the family a plain-language index of trials and make a separate copy for possible collaborators in Britain
    points_fail:
      p1: The papers go with the luggage. At home, the family can only reconstruct what they heard.
    shift:
      p1:
        was: Marconi moved to Britain to pursue patents and contacts. Some of his equipment required changes or repairs after arrival.
        now: The family and traveler each hold an index. Losses on the journey can be checked against the copy at home, and later British trials are entered separately.
        who: marconi_bologna
        bio: Work at Villa Griffone and the later British patent were successive stages. Family and local support helped make the early work possible.
    vignettes:
      blank: Rosa expected three sounds and has already marked three. You ask her to turn her slip face down during the next trial. When she picks it up, she writes down what she heard, including a sound in the quiet interval. Now there is a reason to repeat the test.
      times: Carlo wants to carry the two sheets downhill together. Each says first trial at the top, although one was restarted. You ask him to show you where he waited and where he began again. He labels both attempts before setting off. The sender and receiver can compare the same run now.
      range: You know the range will matter to future readers. Rosa wants to know if the last click was one of the agreed marks. You take her sheet to the sender and leave the answer as a question for another trial. By then the people at both ends have gone inside.
  imhotep_saqqara:
    name: The working edge
    place: Saqqara, Egypt
    figure: Imhotep
    story: A statue base from Djoser’s complex at Saqqara bears Imhotep’s name and titles. Museums credit him with designing the Step Pyramid.
    relic: A joining-edge rubbing
    relic_desc: A fictional rubbing from the practice bench.
    points:
      p1: Support the practice block while the mason tries the edge
      p2: Stay at the bench until both surfaces can be checked
      p3: Find the part of the joint that catches before the pieces are moved
    vignettes:
      rock: Mut sees a flat face and reaches for the next block. You ask her to rock this one gently on the bench first. One corner taps the wood while the other stays clear. She marks the high spot so the person on the next shift can find it under a different light.
      turn: Hori can carry the two pieces away or keep the heavier one in place until Mut checks it. You hold the lighter block while he waits. Mut marks the mating edge on both faces. When the pieces are taken away, the marks go with them.
      name: You know which name later viewers will look for on the statue base. Hori wants to know which of the two trial blocks belongs with the one in his hands. You show him the matching mark. The statue and its inscription are still beyond the corner of the workshop you can visit.
  enheduanna_ur:
    name: The road through the thorns
    place: Ur, Mesopotamia
    figure: Enheduanna
    story: Enheduanna, daughter of Sargon of Akkad, held high office at Ur, and several long poems in Sumerian have been attributed to her since antiquity. Around 2250 BC Ur rose in revolt. A poem under her name says in the first person that she was driven out, made to fly like a swallow from the window and made to walk through the thorn bushes of the mountains until her strength was spent.
    relic: A carved calcite disc
    relic_desc: A carved disc showing a priestess at an offering.
    points:
      p1: When Enheduanna is driven out of Ur, look after her through the mountains and see her safely to shelter
    points_fail:
      p1: As in history she crosses the mountains alone and worn out, with no one to look after her.
    shift:
      p1:
        was: 'About 2250 BC: when Ur rose in revolt, Enheduanna was driven out of the city; the poem under her name says she was made to walk through the thorn bushes of the mountains until her strength was spent.'
        now: On the road through the mountains someone looked after her, and she came safely to shelter.
        who: enheduanna_ur
        bio: In this timeline Enheduanna was looked after on her flight from Ur and reached shelter safe and well.
    vignettes:
      inscription: You remember that the museum will catalogue both faces. The stoneworker has set the disc down with the inscription against the bench. You draw the relief while he works, then get a second drawing when he turns it over. You can take home two views. They do not say who first composed the hymn.
      support: The stoneworker asks you to steady a pad beside the disc. With both hands on it you miss the first glimpse of the inscription. He leaves enough time for you to mark on your sketch which side you missed. The name itself will have to wait for another visit.
      edge: The two sides fill the stoneworker’s account of the disc. On your sketch you also mark how thick the edge is, so you can tell which two drawings belong to the same object. You leave with one sketch and no copy of the hymn.
  hammurabi_babylon:
    name: Law set in stone
    place: Babylon
    figure: Hammurabi
    story: Around 1754 BC, late in the reign of Hammurabi, a basalt stele carved with nearly three hundred laws was set up, and scribes copied its laws onto clay tablets for centuries after. In the twelfth century BC the stele was carried off to Susa, and several columns of its text were scraped away. A French expedition dug it up at Susa in 1901; it is in the Louvre now, and the clay copies have given back part of what was scraped off.
    relic: A clay cylinder seal
    relic_desc: A small stone cylinder that rolls a signature into clay.
    points:
      p1: Help the scribes copy the whole text of the stele onto more clay tablets and send them to other cities, so that every law can still be read after part of the stone is scraped away
    points_fail:
      p1: The full text stayed in the copies there already were. In this branch, after the stone was carried to Susa and part of it scraped, some of the laws were still lost.
    shift:
      p1:
        was: In the twelfth century BC the stele was carried off to Susa and several columns of its text were scraped away; clay copies have restored about thirty of the missing laws, and the rest are still unknown.
        now: '{staff} helped the scribes make more full copies and send them to other cities. In this timeline every law on the stele can still be read.'
        who: hammurabi_babylon
        bio: In this line every one of Hammurabi's laws came down complete, and nothing that was scraped from the stone was lost.
    vignettes:
      clay: '{staff} helps an apprentice scribe knead clay. The sand has to be washed out properly, the apprentice says, or the tablet cracks under the stylus halfway down, and then the master has him start again from the first line.'
      river: '{staff} helps a boatman unload barley on the bank of the Euphrates. Counting the sacks, the boatman says that if the weigher cheats him of one, he will go and stand in front of the king''s stone and recite the law at him, though he cannot read a sign of it himself.'
      roof: In the worst heat of the day {staff} and the apprentice lay the new tablets out on the roof to dry. The apprentice counts them, loses count halfway, and starts again, afraid a bird has walked across one.
  lalibela_rock:
    name: Look for the outlet in the rock
    place: Lalibela, Ethiopia
    figure: Lalibela and the stonecutters
    story: At Lalibela, the builders cut down into the rock, leaving standing walls and columns as they cleared stone away. Eleven rock-cut buildings and a network of trenches, channels and passages survive. The complex is traditionally associated with King Lalibela of the Zagwe dynasty, but archaeologists have found traces of successive cuts and earlier structures. In the 1520s Francisco Álvares described the site after visiting with a Portuguese embassy.
    relic: A stonecutter's chisel
    relic_desc: An iron chisel, the edge ground thin.
    points:
      p1: Be taken in by the stonecutters, then carry the broken rock out of the trench
      p2: Before the rains, follow a channel in the rock to its outlet and show where the water will stand
      p3: In the rains, help clear one whole ditch from end to end
    vignettes:
      outlet: '{staff} follows a channel cut in the rock down past the bend to where it breaks out into the open, and marks the place with a chip of stone.'
      rain: '{staff} stands in the trench with the water to the ankles and passes baskets of silt up to the rim, one after another, until the light goes.'
      bend: '{staff} draws a notch at the turn of a trench on a scrap, so that a helper can find the same turn the next morning.'
  ife_bronzes:
    name: The line that must survive the cast
    place: Ife, Nigeria
    figure: The casters of Ife
    story: A brass head from the Yoruba city of Ife still holds traces of red and black pigment on its beaded headdress. The head was made by lost-wax casting. It was one of a group found in January 1938 when builders broke ground at the Wunmonije compound. Several of the Ife castings were shown together at the British Museum in 1948.
    relic: Two study drawings
    relic_desc: Drawings comparing lines on a plain casting sample.
    points:
      p1: Be taken in by the casters, then shape a practice model in wax
      p2: On the day of pouring, keep the fire under the crucible going
      p3: After the pour, tell which line was cut in the wax and which was added after
    vignettes:
      line: '{staff} lays the drawing made before the finishing beside the sample of today, and draws the new scratch on a separate sheet.'
      surface: '{staff} tilts the board under a sample so the light runs along it, and marks on paper where a fine line begins.'
      edge: '{staff} draws a plain practice sample once, and next to it the one line seen only today, so the next comparison does not rest on memory.'
  great_zimbabwe:
    name: The passage in the plan
    place: Masvingo, Zimbabwe
    figure: The builders of Great Zimbabwe
    story: Great Zimbabwe was built by ancestors of the Shona people and flourished from the eleventh to the fifteenth century. Its Great Enclosure has a long curved wall of granite laid in regular courses and a narrow passage between two walls leading to a conical tower. In 1871 the German Karl Mauch reached the ruins. The country took the name Zimbabwe from the city in 1980, and the site was inscribed as a World Heritage site in 1986.
    relic: A sketch of the passage
    relic_desc: A work drawing that leaves the route blank between both walls.
    points:
      p1: Be taken in by the wall builders, then sort stones of a size for the next course
      p2: Walk the passage between the two walls and draw it with the way left blank
      p3: In the dry season, carry water up from the valley to the builders on the hill
    vignettes:
      lines: '{staff} draws the passage as two lines with the paper left white between them, so that a runner can follow the white and not the walls.'
      width: '{staff} follows the inner wall far enough to see where it stops, and stops the pencil there instead of carrying the line all the way round.'
      pace: '{staff} paces the length of one course and scratches the count on a flat stone at the foot of the wall.'
  timbuktu_sankore:
    name: A page by the mosque
    place: Timbuktu, Mali
    figure: Mansa Musa and the scholars of Sankore
    story: Timbuktu’s monuments and manuscript collections document a long history of learning, especially in later centuries. A heritage survey associates the date 1327 with Djingareyber. The surviving 1733 astronomy manuscript in the source notes belongs to a much later time.
    relic: A reader’s marker
    relic_desc: A fictional marker for finding one line on a loose page.
    points:
      p1: See whether the heading on the loose practice leaf still makes sense
      p2: Hold the standing reader’s place while the writing is gathered
      p3: Wait through the second reading to catch which heading is hers
    vignettes:
      title: Aminata finds a practice leaf under a board. Its top line identifies the topic but leaves out who copied it. You walk it back to the reading bench before the seats are cleared. She recognises the hand, and the borrowed sheet goes back to the person who lent it.
      wind: Musa has gathered the loose pages and is ready to close the door. Aminata is still at the middle of a line. You hold a spare scrap at the place she indicates while he lifts the pages. When she comes back, the one place she wants to find is still marked.
      collection: You have seen photographs of a much later Timbuktu astronomy manuscript. Musa points to his neighbour’s loose exercise and asks how to describe it. You take its heading from the page in his hands. The later book will be copied generations after you leave.
  al_haytham_cairo:
    name: One slit of light
    place: Cairo
    figure: Ibn al-Haytham
    story: In the Book of Optics, Ibn al-Haytham discusses seeing parts of an object through an aperture as the object is moved.
    relic: A practice aperture screen
    relic_desc: An imagined screen used to compare two positions.
    points:
      p1: Match the visible mark to the one on the moving board
      p2: Hold the screen still while the board moves
      p3: Stay to watch the trial with one mark covered
    vignettes:
      slit: Maryam sees the dark edge and records the whole stripe. You ask Yusuf to slide the board until a different strip shows through. She draws both positions next to the one opening. She can now tell a change in the board’s position from a change in the slit.
      cover: Yusuf wants to swing the lamp round for a better view. You keep it where it is and let him cover one mark on the board. Maryam calls out when that mark disappears. By the time the door is opened, she has tried one change she can make again.
      term: You know the name later readers will give to experiments with small openings. Maryam has time for one observation before the room must be shared again. You ask her to say which mark she actually sees. The room brightens before anyone can repeat it.
  house_of_wisdom:
    name: The missing line in Baghdad
    place: Baghdad
    figure: Al-Khwarizmi and the House of Wisdom
    story: In a letter compiled around 855–856, Ḥunayn ibn Isḥāq describes obtaining and comparing manuscripts for Syriac and Arabic translations of Galen. The later letter illustrates a practice.
    relic: A practice copy with a missing line
    relic_desc: A fictional copy from the imagined Baghdad desk.
    points:
      p1: Check where the two copies stop agreeing
      p2: Preserve the gap and its source as the stack is carried away
      p3: Agree on a wording the translator can mark as provisional
    vignettes:
      line: Salma runs her finger down a neat copy and misses the place where two lines ran together. You read from the rougher sheet while she follows the clean one. She hears what did not survive in her copy and marks exactly where it fell away.
      versions: Ilyas must carry a version to the translator before the door is shut. He can take the clear copy alone or carry its troublesome companion too. You tie them so that the disputed place opens first. The translator can decide with both sheets in hand.
      gloss: You recognise a term by the form later books will use. Salma can point to a lacuna in the source but has nothing to fill it from. You give her a margin note indicating a possible reading. Nothing in the running text has changed when the packet leaves.
  ibn_sina_hamadan:
    name: The last attack of colic
    place: Hamadan, Persia
    figure: Ibn Sina
    story: Ibn Sina finished his Canon of Medicine, a work in five books that was taught for centuries, at Hamadan. He had suffered from colic all his life. In 1037, travelling with the army of the ruler he served, he was struck by a severe attack, and he died soon afterwards at Hamadan, in June 1037, aged about fifty seven.
    relic: A practice index strip
    relic_desc: A fictional marker distinguishing two of the five books.
    points:
      p1: When the colic strikes Ibn Sina on the road, treat him and cure him
    points_fail:
      p1: As in history the attack does not let up, and in June he dies at Hamadan.
    shift:
      p1:
        was: '22 June 1037: struck by a severe attack of colic while travelling with the army, Ibn Sina died soon afterwards at Hamadan, aged about fifty seven.'
        now: The attack of colic on the road was treated in time, and he recovered.
        who: ibn_sina_hamadan
        bio: In this timeline Ibn Sina was cured of the colic that struck him in 1037 and lived on past that summer.
    vignettes:
      section: Ruqayya sends both requests to the same heading because both mention remedies. You ask her to open the index and point out which entry concerns a single substance and which concerns compounds. She puts one tab on each book. The two people at the table can now look for their entries without waiting for each other.
      sleeve: Yahya has to carry one copy away. Its guide slips will slide out if he tips the board. You help him fold the empty wrapper over the bookmarks while Ruqayya copies the two headings for the reader staying behind. The bench keeps a small index even when the book is gone.
      afterlife: You have seen the five books divided differently in a much later binding. Yahya asks where the first heading begins in this copy. You find its first line and leave the dates of future editions out of his note. You will miss his next reader trying the index from scratch.
  omar_khayyam_nishapur:
    name: The first day of spring
    place: Nishapur, Persia
    figure: Omar Khayyam
    story: Sultan Malik-Shah had an observatory built at Isfahan in the 1070s, and Omar Khayyam was among the astronomers who worked on reforming the calendar. The new Jalali calendar, named for the sultan, was adopted on 15 March 1079 and set the start of the solar year by the spring equinox. The observatory closed after the sultan died in 1092; the calendar stayed in use for some eight centuries, and forms of it are still used in Iran and Afghanistan.
    relic: A calendar leaf with two headings
    relic_desc: A comparison sheet with the old and the new new year written side by side.
    points:
      p1: In the days before the equinox, keep the shadow readings that fix it safe, so that the new calendar begins on the day set for it
      p2: Help him get one more copy made of his book on extracting roots and send it to another city for safe keeping, so that in this branch it survives
    points_fail:
      p1: The equinox readings did not line up, and the new calendar did not begin on 15 March.
      p2: The book was lost all the same, as in history.
    shift:
      p1:
        was: On 15 March 1079 the new calendar of Sultan Malik Shah came into use on its set day, the year beginning at the spring equinox.
      p2:
        was: Khayyam's book on extracting roots is lost, known only from a mention in his Algebra.
        now: One copy was sent to another city and put in a library, and people could still read it centuries later.
        who: omar_khayyam_nishapur
        bio: In this line his book on roots did not vanish with the observatory years. A copy kept in another city went on being read and copied after his death.
    vignettes:
      spring: '{staff} lays the old table and the new one side by side and writes against each date which reckoning it belongs to, so that the next reader does not have to guess.'
      carry: '{staff} copies the two headings of a folded sheet onto its outside, so whoever carries it can see which columns to compare without unfolding it.'
      future: '{staff} knows how this calendar will be written of later, and keeps the date of the reckoning the copyists use, not one they have never seen.'
  al_jazari_diyarbakir:
    name: A book of ingenious machines
    place: Diyarbakır
    figure: Al-Jazari
    story: Al-Jazari's treatise on mechanical devices dates to 1206. A surviving manuscript folio copied in 1315 illustrates its elephant clock.
    relic: A brass cam
    relic_desc: A shaped wheel that turns a spin into a stroke.
    points:
      p1: At the handover in Amid, check the descriptions and illustrations against the contents so the manuscript can be delivered complete
      p2: Choose a reference copy with the author. List the notes, captions and blank spaces that later copyists should keep distinct
    points_fail:
      p1: Several diagrams can no longer be matched to their sections. The manuscript cannot be handed over as a set, and the office recalls the employee.
      p2: The next copyist works from a draft that has accumulated other notes. Readers cannot tell the author's description from later additions.
    shift:
      p1:
        was: The colophon of an early Topkapı manuscript gives January 16, 1206, as its completion date. Al-Jazari’s book was associated with the Artuqid court in Amid.
      p2:
        was: Later manuscripts do not all descend through the same branch. Some have different illustrations and wording.
        now: The collection keeps a copy checked by the author. A later scribe can record their own changes separately and then check captions against it.
        who: al_jazari_diyarbakir
        bio: Al-Jazari wrote his descriptions in Amid. The text and illustrations changed together as the book was copied and moved between places.
    vignettes:
      sequence: The apprentice explains every figure at once. You point to the first movement and ask what comes immediately after it. They start telling the story of the clock in order.
      viewer: A visitor never looks up from the largest figure. You ask them to watch the spot the apprentice marked instead. On the second demonstration they see the smaller movement in time.
      paper: You hold up the drawing while the apprentice points past it at the model. They add one small mark so a reader without the model will know where to look.
  ibn_battuta_tangier:
    name: Before the road grows long
    place: Tangier, Morocco
    figure: Ibn Battuta
    story: In June 1325, Ibn Battuta left his native Tangier. In the Rihla he recalled setting out without a companion or a caravan, leaving both parents behind. Nearly three decades of journeys went into the account he dictated to Ibn Juzayy after returning to Morocco.
    relic: A travel-worn sandal
    relic_desc: A leather sandal resoled many times.
    points:
      p1: On the road from Bejaia, keep him in the saddle through the fever until he reaches Tunis
      p2: At Miliana, save the envoy of Tunis who fell ill in the heat
      p3: On the day he enters Tunis, let him know he is not alone in a strange town
    points_fail:
      p1: Halfway through the fever he fell from the saddle, and in this branch he never reached Tunis.
      p2: The envoy died by the stream outside Miliana as history has it, and in this branch only one envoy went on towards Tunis.
      p3: He wept aloud at the gate as history has it, and in this branch the only one who walked into the town with him that day was the fellow pilgrim.
    shift:
      p1:
        was: In the summer of 1325 Ibn Battuta set out from Bejaia with a high fever and held on all the way to Tunis.
      p2:
        was: In the summer of 1325, both envoys of the sultan of Tunis fell ill from the heat at Miliana, and one of them died after three nights by a stream outside the town.
        now: '{staff} sat with him by the stream until he cooled and drank, and when they left Miliana both envoys were with the caravan. He later came home to Tunis; what came after is not recorded.'
      p3:
        was: In 1325, on the day he entered Tunis, nobody came to greet him, and he wept.
        now: On the day he entered the town, he had at his side someone he had come to know on the road, and in the two months he stayed in Tunis he was no longer alone.
    vignettes:
      distance: '{staff} writes the far destination on one slip and the first night''s stop on another, so a porter can use the second today.'
      departure: '{staff} keeps the heading of a packing list but leaves a blank line under it for where the traveller will truly stop.'
      roll: '{staff} rolls two slips together, the purpose and the first stage, and at the edge of town hands back the one a porter can use and keeps the other.'
  ulugh_beg_samarkand:
    name: The road out of Samarkand
    place: Samarkand
    figure: Ulugh Beg
    story: For twenty years Ulugh Beg had made Samarkand a city of astronomers, with an observatory whose great meridian arc measured the heights of the stars; the tables made there include a catalogue of 1018 stars. In the autumn of 1449, as power in the realm changed hands, he was forced to give up his rule and was sent away from Samarkand. On 27 October 1449 he was killed on the road, aged fifty five. The site of the observatory was found again in 1908.
    relic: A slip with two sources
    relic_desc: Two marked rows for an older star position and a new observation.
    points:
      p1: Before Ulugh Beg is sent out of Samarkand, get him away safely by another road
    points_fail:
      p1: As in history he sets out on the road he was sent on, and on 27 October he is killed.
    shift:
      p1:
        was: '27 October 1449: after giving up his rule, Ulugh Beg was sent away from Samarkand and was killed on the road, aged fifty five.'
        now: He left Samarkand by another road and lived on in safety.
        who: ulugh_beg_samarkand
        bio: In this timeline Ulugh Beg came safely away from Samarkand in the autumn of 1449 and lived on.
    vignettes:
      source: '{staff} adds a narrow column headed origin to the copyist''s sheet, so that a position taken from the old table and one measured tonight do not sit on the same line.'
      arc: '{staff} lays a cord along the curve of the trench for the arc and walks it end to end with the masons, to see that the curve is true.'
      hold: '{staff} sits by the arc with a brazier and a board, and writes down a reading each time it is called, until the star sinks below the wall.'
  buddha_sarnath:
    name: What the listener carries
    place: Sarnath, India
    figure: Siddhartha Gautama
    story: The Buddhist discourse preserved as Saṃyutta Nikāya 56.11 places the teaching in the Deer Park at Isipatana near Varanasi, traditionally identified with Sarnath. It introduces a middle way and the four noble truths. The scene is not a dated transcript.
    relic: A listener’s plain cord
    relic_desc: A fictional keepsake from the walk to the Deer Park.
    points:
      p1: Listen while the other person tries to recall the opening
      p2: Separate what one person heard from what the other repeated
      p3: Stay to hear the part the first listener missed
    vignettes:
      middle: Nanda has remembered the rejection of two extremes but thinks the speaker stopped there. You wait while Sona recalls that a path was described next. Nanda tries the sequence aloud for the person she will meet later. This time she gets as far as the description of the path.
      pause: Sona repeats three parts in a rush and hesitates on the fourth. You ask where she stopped hearing the speaker and started relying on Nanda. They try the retelling in turns. After that, each knows which part to ask the other about.
      retell: You know later versions of the discourse will travel far. Nanda has to leave to meet someone and wants a short account she can remember on the walk. You listen to her try it once. You leave the park before hearing how the next person receives it.
  aryabhata_patna:
    name: The circle in three steps
    place: Kusumapura, India
    figure: Aryabhata
    story: In the mathematics section of the Āryabhaṭīya, Āryabhaṭa gives a rule for the approximate circumference of a circle of diameter 20,000. Adding 4 to 100, multiplying by 8 and adding 62,000 gives 62,832. The map locates the visit in the period associated with the treatise.
    relic: A palm-leaf of verses
    relic_desc: A thin leaf with verses scratched in.
    points:
      p1: At Kusumapura, check that the mathematics and its dated passage are both present in the compilation
      p2: Ask the author and a teacher to use one example to check when the approximation is enough. Copy it alongside the original verse
    points_fail:
      p1: The rules are copied without the leaves recording the date. The office recalls the employee.
      p2: The verse survives separately from the exercise used to check the approximation.
    shift:
      p1:
        was: The Aryabhatiya names Kusumapura. Its chronological passage is conventionally read as 499 CE.
      p2:
        was: Several commentary traditions developed around the concise verses.
        now: Students circulate a copy with a worked example checked by the author. A later commentator can still distinguish the words of the verse.
        who: aryabhata_patna
        bio: Aryabhata put astronomical and mathematical knowledge into concise verses. How dates, terms and examples traveled affected later readings.
    vignettes:
      scale: The rope maker writes two diameters on the board but gives them the same circumference. You pair 20,000 with 62,832 and show him what scales when the diameter doubles. He changes one line. You take home the two pairs. The rope is still being measured when you go.
      measure: You know the rule will outlast everyone in the workshop. The rope maker wants to know how to remember it while working. You write the three steps in separate lines. He gets the next trial right without asking which addition comes last. The rope itself is left for another day.
      copy: You copy both the diameter and the approximate circumference before the board is wiped. The rope maker sees why he needs two numbers. You keep the pair on one slip and leave before seeing the rope laid around a circle.
  brahmagupta_bhillamala:
    name: A debt on the other side
    place: Bhillamala, India
    figure: Brahmagupta
    story: Brahmagupta’s Brāhmasphuṭasiddhānta gives arithmetic rules for debts, fortunes and zero. In those rules, subtracting a debt from a fortune increases it. The rules in the text for division by zero differ from modern arithmetic.
    relic: A palm-leaf with a small circle
    relic_desc: A leaf with a small round mark for nothing.
    points:
      p1: Keep the account examples with the rules of arithmetic so the compilation made in 628 includes this section
      p2: Have the author and a second calculator record separate examples and show a reader with a fragment where to recover the full passage
    points_fail:
      p1: The examples are removed as old accounts. The rules are missing from the completed manuscript, and the office recalls the employee.
      p2: Copyists transmit the result and a line of rules. Later readers cannot see the conditions of the example.
    shift:
      p1:
        was: Brahmagupta’s work of 628 gives operations on debts, fortunes and zero. A later commentator calls him a teacher from Bhillamala.
      p2:
        was: Descriptions of the manuscript tradition note differences in the copies, including the copy of chapter eighteen used for Colebrooke’s translation.
        now: Both worked examples identify the passage they come from. A later copyist can recover the rule and keep genuine variant readings visible.
        who: brahmagupta_bhillamala
        bio: Brahmagupta used familiar terms for quantities and described how operations change them. Some rules in the book differ from modern usage.
    vignettes:
      debt: The bookkeeper has taken three away from a balance of five, though the entry he crossed out was a debt. You put the old entry at the head of the example. The new balance is eight. He closes the board before there is time to ask how his teacher handled division by zero.
      limit: You know a modern classroom treats division by zero differently. Beside the bookkeeper’s examples you mark which ones are about addition and subtraction. The example he needs today stays on the board. You take the list home but leave before the next lesson.
      token: You place five counters for what is held and a separate marker for the debt. The bookkeeper checks which entry his pen is crossing off. You take a note of the two columns home. The next account is already being opened as you leave.
  li_bai_changan:
    name: Poems of wine, moon and travel
    place: Chang'an, China
    figure: Li Bai
    story: Three pieces traditionally attributed to Li Bai are transmitted as the Qingping Tune. An accompanying account tells of a court performance, but is not a contemporary record of a particular evening.
    relic: A small wine cup
    relic_desc: A cup with a faint line of moon painted inside.
    points:
      p1: Listen for a change between two lines
      p2: Ask how a remembered performance was passed down
      p3: Leave the written verse legible for the next singer
    vignettes:
      verse: The singer stops at the line that fits the tune poorly. You ask them to speak it before singing it again. Their second breath falls where the thought turns.
      palace: The singer hears you ask who was in the palace that night. They set down the copied poem and ask which account you read. You leave a note that the two were handed down separately.
      copy: You keep the page open while the singer marks the place that always makes them pause. You can carry the written lines away and still remember where to listen for that pause.
  murasaki_kyoto:
    name: The world's first great novel
    place: Kyoto
    figure: Murasaki Shikibu
    story: In the autumn of 1008 the empress Shōshi bore a son, and Murasaki Shikibu, one of her ladies, kept a diary of the weeks that followed. At the banquet for the fiftieth day a courtier called out for "Young Murasaki", a girl from The Tale of Genji, the oldest dated sign that the tale was known. In the eleventh month the ladies chose paper, copied and bound the tale for Shōshi to take back to the palace, while Michinaga carried off a draft Murasaki had kept in her room. No copy in her own hand survives.
    relic: A lacquered brush box
    relic_desc: A small box with brushes, a stone and water.
    points:
      p1: Assign paper by chapter and check delivery of the volumes copied for Shōshi so the set can be assembled
      p2: Offer early readers a loan copy she approves. Keep the unfinished papers with her and have new copyists draw from the approved set
    points_fail:
      p1: Finished chapters are packed with unchecked ones. The set remains incomplete, and the office recalls the employee.
      p2: The draft is lent out. Later copyists do not know the author intended to revise it.
    shift:
      p1:
        was: Murasaki’s diary records women around Shōshi copying The Tale of Genji with writing materials provided by Michinaga.
      p2:
        was: Genji comes down through different manuscript traditions. No final copy in Murasaki’s own hand survives.
        now: The first borrowers read a set she has checked. Later copies still vary, but that loan set records which chapters she approved.
        who: murasaki_kyoto
        bio: Murasaki wrote at the Heian court. The provision of paper, copying and lending affected how a work still under revision reached new readers.
    vignettes:
      banquet: The day before the fiftieth-day banquet {staff} helps carry trays along the gallery. One of the ladies says under her breath that tomorrow night, once the gentlemen have drunk, they will start teasing the women with names out of the tale, and the thing to do is not to hear.
      paper: '{staff} helps a lady sort sheets of coloured paper by chapter and weigh each pile down. Every finished page goes to be checked first, she says, and if the hand slopes, the whole page is done again, and the paper has to be asked for again too.'
      snow: Snow falls in the twelfth month. {staff} is sweeping the gallery when the reading inside stops halfway, and a voice asks who has taken the next volume.
  angkor_wat:
    name: The path marked on two sheets
    place: Angkor, Cambodia
    figure: The Khmer builders
    story: The APSARA National Authority records Angkor Wat as a twelfth-century monument with a sandstone causeway and galleries with carved reliefs. The map year places the visit in the building period.
    relic: A route sketch
    relic_desc: A drawing marking the sandstone crossing and the start of the gallery.
    points:
      p1: Walk the crossing and mark which side of the moat you are on
      p2: Hold the sketch in the same direction while the helper points out the turn
      p3: Give the next crew separate marks for the crossing and the gallery
    vignettes:
      route: The works helper has drawn the crossing and the gallery as one continuous edge. You face the sheet towards the approach and mark where the two lines stop matching. He can now indicate the handover point with one finger. You take the corrected sketch. The next crew has not yet tested it.
      load: You know later visitors will describe the reliefs long after this path is forgotten. The helper asks where someone carrying a drawing should pause without blocking the crossing. You walk back to the turn and mark one place on the sketch. You leave before a second carrier tries it.
      edge: You copy the edge of the moat onto one sheet and the first stretch of the gallery onto another. The helper places the two together where the path turns. You bring away the outline. You never see the whole gallery from this one spot.
  sejong_hangul:
    name: An alphabet anyone can learn
    place: Seoul
    figure: King Sejong and the scholars
    story: In 1443 King Sejong of Joseon made twenty eight letters for writing Korean. In the second month of 1444 Choe Manri, of the Hall of Worthies, sent up a memorial with six colleagues raising objections. The new letters were promulgated in 1446 as Hunminjeongeum, the correct sounds for teaching the people. Sejong died in 1450.
    relic: A woodblock of letters
    relic_desc: A block carved with the first letters, ready to ink.
    points:
      p1: In the days of the memorial, keep the draft translation of the rhyme book Yunhui into the new letters safe in the council hall, so that the work goes on
      p2: Let him see with his own eyes someone who never went to school write their own name in the new letters
      p3: At Chojeong, ease the trouble in his eyes so that he can still see the new letters clearly
    points_fail:
      p1: In those days the draft was scattered and the work stopped, and the new letters lost their first use.
      p2: In this branch, until the promulgation he never saw anyone among the people use the new letters.
      p3: He went back to the palace with his eyes no better, as in history.
    shift:
      p1:
        was: In the second month of 1444 the work of the Hall of Worthies on rendering the rhyme book Yunhui in the new letters went on.
      p2:
        was: In 1446 the new letters were proclaimed as Hunminjeongeum, and Sejong died four years later.
        now: A stallholder outside the travelling palace at Chojeong learned to write her own name, and someone reported it to the court.
      p3:
        was: Sejong suffered for years with his eyes, went to Chojeong in the spring of 1444 to recover, grew weaker from then on and died in 1450.
        now: A stranger by the springs at Chojeong made his eyes a little better, and when he went back to the palace that summer he could still read memorials and the proofs of the new letters himself.
    vignettes:
      gesture: '{staff} watches a scholar shape his lips before he draws a letter, and copies the shape of the mouth in the margin beside it.'
      spacing: '{staff} rules a sheet into squares so that the parts of each syllable sit together in one square, and leaves it on the table without a word.'
      lesson: '{staff} draws three letters in the dust with a stick for a child at the market, and the child reads them back as a sound before running off.'
    story_prose:
      opening:
        - Seoul, 1443. Sejong has made twenty eight new letters. Korean can be spoken aloud, but to write down the words in one's mouth, one first has to learn a script very unlike the way one talks. Sejong wants a sheet of paper to be something everyday speech can be written on too.
        - In history, in the second month of 1444 scholars of the Hall of Worthies sent up a joint memorial against the new letters, while the work in the palace of translating books into them was half done. That spring Sejong went to Chojeong to rest his eyes, and from then on his health went down year by year. In this branch there is also a stallholder outside the travelling palace at Chojeong who keeps her accounts straight, yet whenever she has to sign, hands the brush to someone else.
        - 'Three kinds of people can help on this trip: someone who can keep the papers safe, someone willing to teach a person to read stroke by stroke, and someone who knows medicine and brings the right remedy.'
      outcomes:
        all: That summer, when Sejong went back to the palace, he could still see the letters clearly. The sheet the stallholder had signed he did not let anyone take away; it lay on top of the proofs of the new letters.
        p2: Outside the travelling palace at Chojeong, at the end of that account book, the hand was for the first time the stallholder's own.
        p3: Back at the palace that summer, Sejong could still read the memorials himself. The proofs of the new letters he turned page by page, through to the last.
        p1: The lamps of the Hall of Worthies were lit again. The Yunhui in the new letters piled up page upon page.
      none: 'Back at the office {staff} still remembered the moment the stallholder held out the brush: the hand reached out, stopped a moment in the air, and only then gave the brush to someone else.'
      desync: After the memorial the pages of the new letters lay scattered on the floor of the council hall, and nobody picked them up. When {staff} was recalled, the top page bore half a footprint.
      not_admitted: '{staff} could not stay long enough to teach the stallholder the new letters. She turned another page of her accounts, and the paper still waited for someone else to sign for her.'
      points:
        p1: In the days of the memorial, people came and went in the council hall and nobody had a thought for the pages on the table. {staff} stacked the pages of the Yunhui in the new letters in their order and set a paperweight on them. Some days later the scholars of the Hall came back and lifted the paperweight. The top page was the very place where they had put down their brushes.
        p2:
          class_teaching: '{staff} went by the old way of teaching: first have her say her name out loud, then set down each sound as a letter. Outside the travelling palace at Chojeong the stallholder said her own name slowly once and wrote on the paper after the sounds. When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.'
          else: '{staff} sat with her a while every day before she closed her stall, never hurrying her, and whenever a stroke went crooked had her write it again. Outside the travelling palace at Chojeong the stallholder said her own name slowly once and wrote on the paper after the sounds. When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.'
        p3: At Chojeong {staff} looked at Sejong's eyes every day, adjusting the medicine and the washes as they changed. Back at the palace, Sejong held a proof of the new letters up before his eyes. The letters were small and he read slowly; when it came time to turn the page, he called no one, and reached out and turned it himself.
      excerpts:
        p2: When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.
        p3: Back at the palace, Sejong held a proof of the new letters up before his eyes. The letters were small and he read slowly; when it came time to turn the page, he called no one, and reached out and turned it himself.
        p1: Some days later the scholars of the Hall came back and lifted the paperweight. The top page was the very place where they had put down their brushes.
  li_shizhen_qizhou:
    name: Which name goes with the entry
    place: Qizhou, China
    figure: Li Shizhen
    story: Li Shizhen completed a draft of the Bencao Gangmu in 1578. Early printed editions came later and included illustrations and editorial apparatus.
    relic: A copied specimen label
    relic_desc: A fictional work label with a place left for an alternate name.
    points:
      p1: Bring both labels back before the study table is cleared
      p2: Check whether the two names came from the same place
      p3: Keep the alternate name and its source with the entry
    vignettes:
      names: Alin has written the name she heard at market beside the one on the specimen wrapper. You ask which vendor called it that. She remembers the stall but not the district. The entry keeps both names and identifies only the source she can actually place.
      wrap: Ahe has time to carry one wrapped sample before the room closes. You put its tag inside the wrapper and copy it onto a scrap before he takes it. When the table is cleared, Alin can still see which name travelled with that sample.
      print: You remember a printed illustration of the entry. Alin wants to know whether she can use it to settle the name on her own wrapper. You leave the name with the source she can describe. The later woodcut will not be ready on this visit.
  basho_hiraizumi:
    name: The narrow road to the deep north
    place: Hiraizumi, Japan
    figure: Matsuo Basho
    story: 'In the spring of 1689 Matsuo Bashō set out from Edo with his pupil Sora on a long walk through the north. On the thirteenth day of the fifth month they went from Ichinoseki to Hiraizumi and back in a day: they climbed Takadachi above the Kitakami River, the steward showed them the Golden Hall of Chūsonji, and the Sutra Hall stayed shut because he was away. Bashō turned the journey into The Narrow Road to the Deep North, where the visit gives his verse on summer grasses and says that both halls were opened.'
    story_prose:
      opening:
        - Ichinoseki, in the north of Japan, summer 1689. Matsuo Bashō and his pupil Sora left Edo more than a month ago. On the thirteenth day of the fifth month the sky is clear, and the two mean to walk the two ri to Hiraizumi to see the old ruins and be back the same day. The journey later became The Narrow Road to the Deep North.
        - In history, the keeper showed them the Golden Hall that day, and the Sutra Hall stayed shut because he was away. Sora set it down in his diary as it was; Bashō later wrote in his book that both halls were opened. In this branch, the master of their lodging in Ichinoseki heats the bath for his guests’ return, and a porter at the street corner says the roads to the north are all mud.
        - 'Two kinds of people can help on this trip: someone who remembers the road and keeps to the hours, and someone willing to ask what is allowed and find a person to show the way.'
      outcomes:
        all: That evening Bashō hung his hat by the door of the lodging in Ichinoseki, a layer of dust on it. Later, when he wrote the Hiraizumi passage, there was a beam in it that he had seen with his own eyes through the gaps of a lattice.
        p2: Later, when Bashō wrote the Hiraizumi passage, there was a beam in it that he had seen with his own eyes through the gaps of a lattice.
        p1: Before dark the two were back in Ichinoseki. The hat hung by the door with a layer of dust on it.
      none: The old ruins of Hiraizumi darkened little by little in the dusk. The door of the Sutra Hall stayed shut.
      desync: Past the fork the sun was already low, and the two were still far from Hiraizumi. {staff} was recalled by the office before they could turn back to Ichinoseki.
      not_admitted: '{staff} could not keep up with the two travellers. At the street corner in Ichinoseki, two straw hats had already gone out of town.'
      points:
        p1: Out of Ichinoseki the road forked twice. {staff} checked each stop against the stages Sora had written in his notebook, and told the two beforehand where to turn and by what hour they must start back. Bashō nodded and tied the cord of his hat tighter. When the sun was low, the two were already on the road back to Ichinoseki.
        p2:
          class_lettered: As one does when searching records, {staff} first asked which day the keeper had left and who was looking after things for him, then which part of the outer gallery visitors might walk. An old man nearby put down his work and led the two along the gallery round to the side of the Sutra Hall. The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.
          else: '{staff} waited a while before the hall, then asked the neighbours one by one when the keeper would be back and which part of the outer gallery visitors might walk. An old man nearby put down his work and led the two along the gallery round to the side of the Sutra Hall. The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.'
      excerpts:
        p2: The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.
        p1: Bashō nodded and tied the cord of his hat tighter. When the sun was low, the two were already on the road back to Ichinoseki.
    relic: A straw hat
    relic_desc: A woven hat grey with rain.
    points:
      p1: Check Sora’s return route and turning points so the two travelers can make their same-day visit to Hiraizumi
      p2: When the keeper is away, find out who can show visitors around the exterior. Ask what they are allowed to see before passing the route to the two travelers
    points_fail:
      p1: A turn sends both travelers the wrong way. By the time they find the approach they cannot make the return, and the office recalls the employee.
      p2: Nobody knows when the keeper will return. The two pass outside and the entrance remains closed.
    shift:
      p1:
        was: Sora’s diary records a journey from Ichinoseki to Hiraizumi and back that day, the thirteenth day of the fifth lunar month in 1689.
      p2:
        was: On the thirteenth day of the fifth month of 1689 Sora recorded that the steward showed them the Golden Hall but the Sutra Hall stayed shut because he was away; Bashō later wrote that both halls were opened.
        now: A local guide confirms they can walk round the Sutra Hall and shows it to them from the permitted side. Bashō returns with a detail of the building he saw for himself.
        who: basho_hiraizumi
        bio: Bashō and Sora had only part of a day for Hiraizumi. The later book and Sora’s route notes put different things on the page.
    vignettes:
      grass: '{staff} follows the two travellers up Takadachi. The Kitakami runs below and the grass is waist high. The elder spreads his hat on the ground and sits a long while without a word, the younger writes something in his notebook, and {staff}, not liking to speak, watches the river with them.'
      bath: '{staff} helps the master of the lodging in Ichinoseki carry water and heat the bath. The two guests went to Hiraizumi today, he says, they will be back in a sweat; he has seen plenty of travellers come back from the old ruins in tears, and a bath sees to it.'
      sandal: '{staff} helps a man at the corner of the street in Ichinoseki mend a sandal strap. A passing porter says the roads to the north are all mud this week, and anyone going on had better put on new sandals before he starts.'
  hokusai_edo:
    name: The Great Wave
    place: Edo, Japan
    figure: Katsushika Hokusai
    story: Hokusai's Under the Wave off Kanagawa is a woodblock print in Thirty-six Views of Mount Fuji. The Met dates its impression to about 1830–1832.
    relic: A woodblock for printing
    relic_desc: A carved plank of cherry wood.
    points:
      p1: Choose an Edo publisher’s proof in which both the wave crest and the distant peak read clearly. Leave it with the carver and printer as the reference for the first run.
      p2: Before the publisher breaks up the proofs, have Hokusai and the printer keep a comparison set. Ask the publisher to file a new proof in sequence each time printing resumes.
    points_fail:
      p1: The carver and printer have no shared proof and keep sending back sheets with the same broken wave line. The publisher holds back the first delivery, and the office recalls the employee.
      p2: Only sale copies stay at the counter. The proofs Hokusai checked with the printer go back into the stock, where a new printer cannot recover the set.
    shift:
      p1:
        was: The Edo publisher Eijudō advertised Thirty-six Views of Mount Fuji for the New Year of 1831. Under the Wave off Kanagawa belongs to the series, and early impressions with the wave lines intact survive.
      p2:
        was: These impressions carry no dates or batch numbers. The original blocks have not survived, and the marks on the prints are the main clues to their sequence.
        now: Eijudō keeps a packet of proofs in order behind the counter. A new printer can tell which gap appeared later and ask Hokusai to judge whether the run meets his design.
        who: hokusai_edo
        bio: Hokusai designed the image. Its appearance on paper also depended on where the carver cut, how the printer transferred the ink, and when the publisher ordered another run.
    vignettes:
      mountain: The seller points to the foam. You ask him to cover the wave with his hand. Once he uncovers it, the little triangle in the distance looks less like another splash.
      edge: The seller wants to trim a practice sheet. You set the untrimmed copy beside it and show him how close the signature sits to the edge.
      counter: You turn the print towards a customer who keeps looking for Fuji above everything else. The customer finally finds it low on the page and asks to see another view.
  bose_calcutta:
    name: Turn the book a quarter turn
    place: Calcutta
    figure: Jagadish Chandra Bose
    story: In a paper read on 28 January 1897, Jagadis Chunder Bose reports that a bound book placed in a beam of electric rays transmitted the radiation much more readily after a quarter turn.
    relic: A crescograph part
    relic_desc: A lever that magnified a plant's growth ten thousand times.
    points:
      p1: Read the detector before changing the book’s orientation
      p2: Persuade the mechanic to try the first orientation again
      p3: Mark the starting orientation on the apparatus sketch
    vignettes:
      return: The mechanic turns the book and the response drops. You ask him to turn it back instead of packing away the apparatus. The response returns on this run. Now both changes go in the record. There is no time to try a second material.
      mark: The mechanic says he can remember which way the pages faced. You make one orientation mark on the drawing and one corresponding mark on the holder. He can return to the starting angle without guessing. The next comparison belongs to his shift.
      reading: You copy the reading beside a sketch of the book before touching anything. After the turn, you put the second reading on a fresh line. You bring home the pair. From two readings alone, the question of drift stays open.
  tagore_santiniketan:
    name: One poem, two readings
    place: Santiniketan, India
    figure: Rabindranath Tagore
    story: In November 1912 the English Gitanjali, Rabindranath Tagore's own prose renderings of his Bengali songs, came out in London. On 13 November 1913 the Swedish Academy gave him the Nobel Prize in Literature. Ten days later a trainload of well-wishers came from Calcutta to his school at Santiniketan; in his reply he said he could not accept without diffidence an honour offered in the country's name, and many of the guests went home hurt. The prize money went to the school, which became the university of Visva-Bharati in 1921.
    relic: A hand-copied songbook
    relic_desc: A small book of songs in his own hand.
    points:
      p1: After the reception breaks up, bring back the guests his reply has stung, and get him and these people, many of them his friends, to talk it out
    points_fail:
      p1: As in history the guests go home aggrieved, and the distance between him and many of his countrymen stays; this branch is as history was.
    shift:
      p1:
        was: '23 November 1913: a trainload of well-wishers came from Calcutta; in his reply Tagore said he could not accept without diffidence the honour offered in the country''s name, the guests were largely hurt, and a deep estrangement grew between him and many of his countrymen.'
        now: That evening some of the departing guests were asked back in and sat down with him to talk it out. The quarrel did not spread from that day.
        who: tagore_santiniketan
        bio: In this timeline Tagore and the guests of the 1913 reception talked things out the same evening, and his reply did not set him apart from his countrymen.
    vignettes:
      telegram: The day the news comes, {staff} helps the boys carry benches under the mango trees. One of them climbs a tree and shouts that the whole of Calcutta is coming by train; a teacher pulls him down, and he protests that then somebody had better count the benches.
      platform: At dusk {staff} helps a guest at Bolpur station find the umbrella he left behind. He stands on the platform a long time turning the umbrella in his hands, and only as the train comes in asks whether the poet always speaks to his guests like that.
      rice: In December {staff} helps the school cook spread rice to dry in the yard. People keep coming to see the poet, the cook says, one party after another, and the rice is going faster than in any year he remembers.
  ramanujan_madras:
    name: A letter that asks to be checked
    place: Madras
    figure: Srinivasa Ramanujan
    story: From March 1912 Srinivasa Ramanujan worked as a clerk in the accounts department of the Madras Port Trust. On Thursday, 16 January 1913, he wrote from there to G. H. Hardy in Cambridge, introducing his work and his study of divergent series. In 1914 he went to England. He died in 1920, after returning to India ill.
    relic: A slate
    relic_desc: A school slate, wiped and written on many times.
    points:
      p1: Through the hungry weeks of working by night, keep him on his feet so that the reply of 27 February to Hardy is written and sent
      p2: Help his family through the months on thirty rupees a month, until the scholarship comes
      p3: Before he leaves for England, see the old illness that keeps coming back and cure it
    points_fail:
      p1: On 27 February he collapsed under the lamp, the reply was never written, and Hardy heard nothing more.
      p2: In this branch the family's food money still weighed on him beside each night's working, and the record is one line short.
      p3: He set out with the illness still in him, fell ill in 1917 and died in Kumbakonam in 1920, as in history.
    shift:
      p1:
        was: On 27 February 1913 Ramanujan finished his reply to Hardy and sent it, writing that he was half starving.
      p2:
        was: Until the scholarship came in May 1913, the family lived on his salary of thirty rupees a month.
        now: The rice jar did not run empty in those months.
      p3:
        was: He fell gravely ill in England in 1917, was never firmly diagnosed, went back to India in 1919 and died the next April, aged 32.
        now: A stranger in Madras recognised the old illness in him and cured it before he travelled. He did not go into a sanatorium in Cambridge, and after his return to India he did mathematics for many more years.
    vignettes:
      sums: '{staff} works out 1, 3, 6 and 10 as the first sums of a row of whole numbers beside a single total written at the end, and gives the column of sums its own heading.'
      future: '{staff} knows what will be written of this letter one day, and asks only what a man opening it for the first time will understand, and puts the covering page in front.'
      address: '{staff} asks the clerk to read the address on the packet aloud before it is tied, and keeps the date on a slip.'
  franklin_philadelphia:
    name: Lightning is electricity
    place: Philadelphia
    figure: Benjamin Franklin
    story: Franklin sent Peter Collinson a letter about an electrical kite in October 1752. The surviving manuscript is in the Royal Society archives.
    relic: A silk ribbon and key
    relic_desc: A key tied to a kite string with a dry silk ribbon.
    points:
      p1: Before the account goes to the Gazette on 19 October, persuade Franklin to write down the day of the kite trial, the place and who was with him
    points_fail:
      p1: The account goes out without a date, a place or a witness, and is written as directions for what would happen. Later readers argue over whether he ever flew the kite.
    shift:
      p1:
        was: On 19 October 1752 the Pennsylvania Gazette printed Franklin's account of the kite with no date, place or witness. The date of June 1752 comes only from Joseph Priestley's history of 1767.
        now: '{staff} has Franklin add the day, the field and the witness to the account before it goes to print. The trial has a dated record from the year it was made, and the later doubts have less to stand on.'
        who: franklin_philadelphia
        bio: Franklin's account of the kite trial in 1752 carried its date, place and witness. The experiment entered the record as an event, not as a set of directions.
    vignettes:
      cloud: The printer says the kite must have taken a direct strike. You ask which line reports that. They turn the sheet over and put the street story in a separate note.
      date: You catch the date going into the headline as the day of the event. The printer moves it back beside the address so readers can tell it is the date of the letter.
      proof: The printer asks you to read the proof aloud for someone who has not heard the town's version. A sentence nobody can trace comes back out of the type.
  morse_washington:
    name: What hath God wrought
    place: Washington
    figure: Samuel Morse
    story: On 24 May 1844 Morse sent a message from the U.S. Capitol to Alfred Vail in Baltimore. A surviving paper tape records the signals; Morse credits Annie Ellsworth with suggesting the wording.
    relic: A telegraph key
    relic_desc: A brass lever worn bright where a thumb rested.
    points:
      p1: Clear a fault with a test signal before the Capitol sends its first formal demonstration to Baltimore
      p2: Use the operating notes to persuade Morse to teach a class so other people can run the line
    points_fail:
      p1: The far end cannot return the signal, the opening demonstration fails, and the office recalls the employee that day.
      p2: In June only Morse and Vail can operate it, and one end has to wait whenever the other has no operator.
    shift:
      p1:
        was: On 24 May 1844, Morse sent the formal demonstration message from the U.S. Capitol to Baltimore.
      p2:
        was: On 9 June 1844, Vail wrote that only he and Morse could operate the telegraph.
        now: '{staff} has Morse teach a small class with real test messages and lets trainees check the replies at both ends. By the time the line gets busy they can take shifts.'
        who: morse_washington
        bio: Morse began training independent operators during the first line's opening months. They took on routine traffic while he continued improving the telegraph.
    vignettes:
      gap: You see the operator start a new word at the wrong gap. Reading the strip back together, you find the break where the next person will expect it.
      credit: You ask whose words the operator has put on the strip. The operator adds the sender to the ledger, and you leave space for the person who supplied the words.
      readback: The operator hands you a strip without the intended text. You read it back and compare it with the sealed slip only after finishing.
  edison_menlo_park:
    name: The clock beside the lamp
    place: Menlo Park, New Jersey
    figure: Thomas Edison
    story: Charles Batchelor’s Menlo Park notebook entry of 22 October 1879 records early tests with carbon made from cotton thread, including the light observed and a change in resistance. Its figures are practice observations for this branch.
    relic: A carbon filament bulb
    relic_desc: A glass bulb with one hair thin loop inside.
    points:
      p1: Cover a shift on the night fragile filaments are under test and protect the long burn Batchelor recorded
      p2: Before the public lighting at Menlo Park, secure a full-night rehearsal and spare lamps for the shop
    points_fail:
      p1: The next watch arrives after the lamp has gone out. There is no reliable continuous run in the books, and the office recalls the employee after a loss of sync.
      p2: The train brings the visitors before the shop discovers where lamps fail, leaving only a few replacements at hand.
    shift:
      p1:
        was: On 22 and 23 October 1879 the Menlo Park notebook recorded a lamp with a carbonized cotton thread burning for fourteen and a half hours.
      p2:
        was: In late December 1879 Menlo Park displayed its lighting to the public. Visitors saw around a hundred lamps in and around the laboratory.
        now: '{staff} helps the shop run the full layout overnight and list the places where spare lamps are needed. Edison and his colleagues have a record of a full night before visitors arrive.'
        who: edison_menlo_park
        bio: Edison arranged a full rehearsal before the public lighting. The shop used the trial to plan spares and shifts for later displays.
    vignettes:
      log: The workshop assistant writes that the lamp was still lit, but leaves off the time. You ask him to copy the clock reading into the next line before handing over. The next watch can tell how far apart the two observations are. The bulb is still lit when you go. Its full lifetime is not in your notes.
      future: You know electric lights will light whole streets. The workshop assistant wants to mark this lamp as ready on the strength of its first glow. You put a line in the log for a second observation. The lamp can stay on watch for another shift. You miss what the next material does.
      tag: Two slips are loose. You pair the one that names cotton thread with the readings from that bulb, then hand the pair to the next watch. You keep the handover time. The lamp is in someone else’s care when it finally goes out.
  wright_kitty_hawk:
    name: Twelve seconds in the air
    place: Kitty Hawk, North Carolina
    figure: Orville and Wilbur Wright
    story: In September 1903 the Wright brothers came back to their camp near Kitty Hawk with a powered machine. Wilbur's attempt on 14 December failed. On the morning of 17 December they made four flights, the first of twelve seconds and the last of fifty nine. That afternoon they walked to Kitty Hawk and telegraphed their father in Dayton.
    relic: A propeller blade
    relic_desc: A wooden blade shaped like a twisted wing.
    points:
      p1: In the cold wind on the morning of 17 December, help the brothers steady the Flyer and keep the first take off safe
      p2: After the fourth flight, hold the Flyer down on the sand and save Daniels and the machine
    points_fail:
      p1: Before the take off a gust lifts one wing and drags it in the sand, and the machine never leaves the rail; in this branch there are no twelve seconds.
      p2: The wind turns the Flyer over, Daniels is caught in the wings and tumbled along with it, and as in history the machine is too broken to fly again. In this branch it never leaves the ground after that afternoon.
    shift:
      p1:
        was: On the morning of 17 December 1903 Orville flew for 12 seconds and 120 feet.
      p2:
        was: On 17 December 1903, after the fourth flight, a gust overturned the Flyer with John Daniels caught between the wings, and the machine, badly broken, never flew again.
        now: '{staff} and the men of the station held it down on the sand, and Daniels was not caught. That winter the brothers flew it a few more times over the dunes before they crated it for Dayton.'
    vignettes:
      numbers: '{staff} copies the four flights into a notebook in the order they were made, the seconds in one column and the feet in the other, and adds them up twice before the light goes.'
      sand: '{staff} digs the rail out of the drift after the night wind and stamps the sand flat at its foot. A helper from the station, made up for the game, says the wind will drop by morning, and it does not.'
      cold: '{staff} keeps the stove going in the shed while the engine is warmed. The puddles outside have frozen over, and nobody mentions it.'
  tenochtitlan_lake:
    name: A boat route between raised plots
    place: Tenochtitlan, Mexico
    figure: The Mexica builders
    story: Historical Tenochtitlan grew on an island in Lake Texcoco. Raised cultivation beds known as chinampas were fixed plots separated by water channels, as the later Xochimilco landscape shows.
    relic: A sketch of the boat channel
    relic_desc: A row of fixed posts and a movable slip showing the passing boat.
    points:
      p1: Walk to where the planted edge meets the boat channel
      p2: Keep the water gap marked as the boat moves through the sketch
      p3: Distinguish a fixed plot from a moving landing mark
    vignettes:
      fixed: The helper has drawn the whole planted plot where the boat was this morning. You show him the posts that still stand at the field edge and mark the boat on a loose slip. The slip can move while the field stays on the page. You leave before the boat returns.
      channel: You know later visitors will call such plots floating gardens. Here the helper has to find a way through water between two planted edges. You walk the bank far enough to mark the opening. There is room for the next boat on the plan. What it will carry is not on your sheet.
      posts: You mark one fixed row of posts and then where the boat passed beside them. The helper can read one mark without treating it as the other. You keep the interval on the sketch. From here you cannot see where the next channel leads.
  machu_picchu:
    name: Follow the water to the next stone basin
    place: Machu Picchu, Peru
    figure: The Inca builders
    story: Machu Picchu was built around 1450, most likely as an estate of the Inca ruler Pachacuti, and abandoned about a century later, at the time of the Spanish conquest. A canal carried water from a spring to a stepped series of sixteen fountains. On 24 July 1911 Melchor Arteaga, a local farmer, led Hiram Bingham up to the ruins; the site was made a historic sanctuary of Peru in 1981 and a World Heritage site in 1983.
    relic: A carved stone
    relic_desc: A palm sized stone with a straight, true edge.
    points:
      p1: On the day of the earthquake, keep the canal from the spring from breaking apart
      p2: See that a helper brought alone from the eastern forests has someone here who understands him
      p3: Help the masons rebuild the cracked walls with the old fitted stones
    points_fail:
      p1: The stone channel slips apart in the shaking, the water spills down the slope, the sixteen basins run dry one by one, and in this branch the estate is without water.
      p2: He still carries stone alone and nobody answers what he says; in this branch he is as he was when he came.
      p3: As in history, the cracked walls are built up again in small stones, and in this branch the fitted stonework stops at these walls.
    shift:
      p1:
        was: The channel built about 1450 brings water from a spring down the steps through sixteen stone basins, and still runs more than five hundred years later.
      p2:
        was: About 1450 the servants who worked at Machu Picchu came from all over the Inca lands, and most were not from the same place.
        now: '{staff} worked out a few words with the helper, and later he had people among the masons he could talk to.'
      p3:
        was: After an earthquake during the building, about 1450, the builders of Machu Picchu turned to smaller stones that took less work, and no longer cut great blocks that locked together.
        now: '{staff} and the masons rebuilt the cracked walls in the old way. In the decades after, those walls came through several more tremors.'
    vignettes:
      wet: '{staff} walks from one basin to the next before marking it wet, and leaves the second box blank until the water is seen.'
      steps: '{staff} counts the basins from the top of the stair, as the water runs, and not from where the morning''s work began.'
      mark: '{staff} cuts a small notch where the channel turns, so the next person to clear it knows where the water bends.'
  maya_venus_tables:
    name: Five cycles in the margin
    place: Chichen Itza, Mexico
    figure: The Maya scribes
    story: The Dresden Maya Codex preserves Venus tables on pages 24 and 46–50, reckoning a cycle as 584 days. The test numbers are not records of an actual observation.
    relic: A painted bark strip
    relic_desc: A strip of bark paper with red and black glyphs.
    points:
      p1: Distinguish a count of cycles from a count of days
      p2: Check the next line against five cycles of 584 days
      p3: Leave the computed and observed columns with distinct labels
    vignettes:
      count: The learner has copied five beside the days. You write five short marks in one column and 2,920 days in the other. He can see why the labels change what the numbers mean. You bring both home. Neither tells what the sky will look like through a clouded dawn.
      dawn: You recognise the count from tables preserved in a later manuscript. The learner wants to enter the predicted day as a sighting. You ask him to wait until someone has seen the sky. One column now has a computed date and the other a blank. You miss the next clear dawn.
      margin: You copy 584 once, then beside it you write what the number is counting. The learner repeats the label before taking the sheet back. You can reconstruct the exercise at home. A sighting of Venus is still waiting on the weather.
  sequoyah_syllabary:
    name: A writing system made by one man
    place: Cherokee country, southeastern United States
    figure: Sequoyah
    story: Cherokee silversmith Sequoyah completed a writing system for Cherokee in 1821. Its signs represent syllables rather than individual sounds. The Cherokee Nation formally adopted the syllabary later in the decade. On 21 February 1828 the first Cherokee Phoenix came off the press in New Echota with both Cherokee and English in print.
    relic: A syllabary chart
    relic_desc: A sheet with eighty-odd characters laid out in rows.
    points:
      p1: On the day he shows it, stop the charge that the writing is witchcraft, and keep him and six year old Ayoka safe
      p2: Ease the pain in his lame leg so he can walk to the towns to teach
      p3: Help his wife bring the neglected fields back, and talk the family out of the quarrel the writing has caused
    points_fail:
      p1: The charge drowns out the showing, Ayoka is never called back to read the word, and in this branch nobody sees that the signs can carry speech.
      p2: The leg hurts as before, and in this branch he has to stop and rest after every stretch of road.
      p3: The fields stay neglected and the family still begs him to give it up; in this branch the writing is still what it has cost this household for years.
    shift:
      p1:
        was: Sequoyah completed the syllabary in 1821. The Cherokee Nation formally adopted it later in the decade.
      p2:
        was: Sequoyah was lame in one leg and walked with difficulty; accounts of the cause differ.
        now: The pain in his leg eased for those six months, and he walked faster on the road to the next town to teach.
      p3:
        was: For years he left the work of the fields to his wife, his family begged him again and again to give up the writing, and his wife once burned his papers.
        now: '{staff} kept the fields planted for the household those six months, and the quarrels grew fewer. His wife later learned to write with the signs as well.'
    vignettes:
      sound: '{staff} listens to a learner say a word at his usual speed and then slowly, and points to one sign for each syllable until he can go on alone.'
      lookalike: '{staff} catches a sign that looks like an English letter, and crosses out the letter pencilled beside it before it can mislead anyone.'
      note: '{staff} carries a slip across the council ground to someone who did not hear it spoken, and stands by while it is read out.'
  finlay_havana:
    name: Mosquitoes and yellow fever
    place: Havana
    figure: Carlos Finlay
    story: Carlos Finlay presented the mosquito hypothesis for yellow fever transmission in Havana in 1881. The title of his paper identifies it as a hypothesis.
    relic: A glass slide of mosquitoes
    relic_desc: A mounted slide with a mosquito wing.
    points:
      p1: Through the fever season, keep his paper and his case notes safe, so that he reads the paper to the Academy on 14 August as planned
      p2: After the reading, persuade a few members of the Academy to stay and look at his cases, so the paper is not set aside in silence
      p3: Help him put the mosquitoes and the cases into evidence that convinces, so the city starts fighting the mosquito years sooner
    points_fail:
      p1: The case notes were lost in the fever season and the paper was not read on 14 August. This branch came loose from history, and the office recalled the employee.
      p2: The hall stayed silent and no one asked to see a single case. In this branch the paper was set aside, as it was in history.
      p3: His evidence stayed as thin as before. In this branch the city still waited about twenty years before acting on the mosquito, and the fever came back every summer until then.
    shift:
      p1:
        was: On 14 August 1881 Carlos Finlay read his paper on the mosquito as the hypothetical agent of yellow fever to the Royal Academy of Sciences in Havana.
      p2:
        was: On 14 August 1881 his reading was met with silence, and for years afterwards the idea was ridiculed.
        now: A few members stayed behind that evening and asked to see his case notes.
      p3:
        was: From 1881 Finlay spent nearly twenty years trying to prove that the mosquito carried yellow fever; only in 1900 did the United States Army board, using mosquitoes bred from his eggs, show that he was right.
        now: '{staff} helped him set the mosquitoes and the cases side by side until the evidence held. In this timeline Havana began to fight the mosquito years earlier, and the fever left the city sooner. Finlay was believed in his own time.'
        who: finlay_havana
        bio: In this line Finlay's mosquito idea was accepted within a few years of 1881, and Havana acted on it long before 1900.
    vignettes:
      headline: A fictional editor turns a suggestion into a certainty in the heading. You read the title back slowly. They put the word hypothesis back in before passing the proof on.
      columns: The editor reads their notes as if each line meant the same thing. You rule two columns for what was observed and what was proposed. A sentence changes columns.
      place: You check the name of the place where the paper was read. The editor puts it beside the date, so the report does not turn the meeting into a different one.
  bell_boston:
    name: Write down what came through
    place: Boston
    figure: Alexander Graham Bell
    story: Alexander Graham Bell’s laboratory notebook records that on 10 March 1876 in Boston, Thomas Watson heard and understood words Bell spoke into the transmitter. On 25 June the judges of the Philadelphia Centennial Exhibition heard the telephone; Bell had almost stayed in Boston to mark his students’ examinations.
    relic: A telephone receiver
    relic_desc: A wooden handpiece with a thin diaphragm.
    points:
      p1: Keep the speech experiment going while the backers press for a multiple telegraph, so the full sentence reaches the next room
      p2: Take over the examination papers and get the worn out Bell on the train to Philadelphia before the judges come round
    points_fail:
      p1: The workshop goes back to the telegraph work and the March speech trial is cut short. The branch loses sync and the office recalls the employee.
      p2: Bell stays in Boston with his examination papers and the judges pass an empty table on 25 June. The branch loses sync and the office recalls the employee.
    shift:
      p1:
        was: On 10 March 1876 in Boston, Bell used the experimental apparatus to transmit an intelligible sentence to Watson in the next room.
      p2:
        was: On 25 June 1876 in Philadelphia, Bell showed the telephone to the Centennial judges, among them Dom Pedro II and William Thomson. Tired and behind with his students’ examinations, he had not wanted to go.
    vignettes:
      blind: The assistant at the receiver wants to see the sentence first. You fold the paper and ask him to write only what he hears. Two words come back intact and the last is left blank. You keep that slip. Another trial is about to start when you go.
      future: You tell the assistant that people will remember one sentence from this date. He guesses it will be whatever someone wrote on the transmitter side. You set out two slips, one for the speaker and one for the listener. The pair will show a difference the story of the famous sentence cannot tell you about this trial.
      door: You carry the receiver’s folded slip back through the door. Only then do you lay it beside the test sentence. The missing word is still missing, but the two matching ones now have a record. You take the comparison home and miss the next sentence.
  budj_bim_eels:
    name: Where the high water reached
    place: Budj Bim, Victoria, Australia
    figure: The Gunditjmara people
    story: Gunditjmara accounts of the Budj Bim cultural landscape describe a long history of using volcanic rock to manage water with channels and weirs, including for kooyang, the short-finned eel. The event date sets a period in that long history.
    relic: A woven eel trap
    relic_desc: A long basket with a funnel mouth.
    points:
      p1: Keep the drawing oriented along the practice channel
      p2: Identify a wet mark without treating it as a current reading
      p3: Agree with the helper on a point to look at again
    vignettes:
      level: The helper circles a wet stripe and calls it today’s waterline. You crouch where the leaf is still drifting and put a second mark below the first. Now the sketch carries both the trace and the moving water. You leave before the two levels meet again.
      return: You know people will still read the channels as parts of a connected system. The helper has room for just one mark. You choose a rock beside the bend and agree to compare from that same spot on the next visit. You keep the agreed position. The reading after the next rain is still to come.
      bend: You draw where the water goes out of sight and stop the line there. The helper leaves the rest of the paper clear for a later walk. You bring home one bend of a channel and not its whole course.
  galois_paris:
    name: The night before the duel
    place: Paris
    figure: Évariste Galois
    story: Évariste Galois came out of prison in Paris on 29 April 1832. On the night of 29 May he wrote to his friend Auguste Chevalier, setting out what he had found about which equations can be solved by radicals and asking him to have the letter printed. The next morning he was shot in the abdomen in a duel and left where he fell; he died in the Cochin hospital on 31 May, aged twenty. Chevalier printed the letter that September. Fourteen years later Joseph Liouville published his papers.
    relic: A hurried letter
    relic_desc: Pages crossed with figures and the words that he had no time.
    points:
      p1: On the night of 29 May, while Galois can still check the pages, wrap his letter to Chevalier separately from the papers it mentions and see both delivered
      p2: When the letter is printed in September, have the editor print a manuscript index beside it and find a mathematician willing to read the surviving pages in order
      p3: After the duel on the morning of 30 May, get Galois to a doctor at once and save him from the wound in his abdomen
    points_fail:
      p1: The handover is repeatedly put off and the letter is separated from the papers. Chevalier never receives the May 29 letter, and the office recalls the employee.
      p2: Only the letter appears in September. Readers who want to go further still have to find the friend holding the manuscripts.
      p3: He lies wounded and alone until a passer by finds him, and dies in the Cochin hospital on 31 May, aged twenty. In this branch there is no Galois after that.
    shift:
      p1:
        was: On May 29, 1832, Galois wrote to Auguste Chevalier to outline his research and ask him to handle the papers and publish the letter.
      p2:
        was: The letter appeared in September 1832. Chevalier passed manuscripts to Liouville in 1843, and Liouville published them in 1846.
        now: Anyone reading the letter in September can use the index to ask for a copy. Questions come back to Chevalier with page numbers, leaving a record for the next reader.
      p3:
        was: On 30 May 1832 Galois was shot in the abdomen in a duel and left lying where he fell. He died in the Cochin hospital on 31 May, aged twenty.
        now: '{staff} reaches him within minutes, stops the bleeding and keeps the wound from turning septic. Galois recovers, returns to mathematics and explains his theory himself to the mathematicians who had not understood it.'
        who: galois_paris
        bio: Galois survived the duel of May 1832. He went on working in mathematics in Paris and saw his theory of equations read and discussed in his own lifetime.
    vignettes:
      candle: On the night of 29 May {staff} carries a second candle up the stairs for the concierge. She grumbles that the young gentleman's lamp has been burning since dark, and that the ink is hers too, lent, and she means to put it on the account.
      cart: On 31 May {staff} helps a carter unload firewood at the gate of the Cochin hospital. Yesterday they carried a young man in, the carter says, and this morning there was a sheet over him; ten years he has brought wood here, and it is the fine mornings he cannot stand.
      type: At the end of summer {staff} picks up spilled type from the floor of a small print shop. The compositor complains that this number has a letter in it full of sums, and he has had to borrow every equals sign from the case next door.
  van_gogh_auvers:
    name: A summer in Auvers
    place: Auvers sur Oise
    figure: Vincent van Gogh
    story: Vincent van Gogh came to Auvers sur Oise on 20 May 1890, lodged at the Auberge Ravoux and often went to see Dr Paul Gachet. He painted almost a work a day. In a letter of about 10 July he wrote of vast fields of wheat under troubled skies. On 27 July he shot himself in the chest, and he died on 29 July with his brother Theo beside him.
    relic: A tube of chrome yellow
    relic_desc: A squeezed tin tube of the colour he used for the fields.
    points:
      p1: Under a stormy sky, help him finish the wheatfield, and keep the canvas from falling into the wheat
      p2: After the visit to Paris, help him get Theo's money troubles talked through, so that storm does not weigh on him
      p3: Let him know that his paintings will be remembered
      p4: Before 27 July, heal his body and his mind, and keep him alive
    points_fail:
      p1: The canvas went down into the wheat in the wind, and in this branch there is no Wheatfield under Thunderclouds.
      p2: He came back from Paris still feeling the storm that threatened Theo weighing on him too. In this branch nobody helped him get the money matter clear.
      p3: He still felt his paintings were a burden on Theo. In this branch nobody ever told him where these wheatfields would end up.
      p4: 27 July happened as it did in history. In this branch he did not paint another season.
    shift:
      p1:
        was: In early July 1890 Van Gogh painted vast wheatfields under troubled skies, and wrote of them to Theo and Jo about 10 July.
      p2:
        was: In early July 1890 Van Gogh visited Theo's family in Paris and learned that Theo was thinking of leaving his post to set up on his own; back in Auvers he wrote that the storm threatening Theo weighed on him too.
        now: When he came back from Paris he knew how Theo's household would manage, and he went back out to the fields with one weight fewer.
      p3:
        was: In July 1890 Van Gogh wrote that he felt a failure and saw no good future; he sold few paintings in his life.
        now: Someone told him that these wheatfields would one day hang on museum walls, and that many people would travel to see them.
      p4:
        was: He was wounded by a gunshot on 27 July 1890 and died at Auvers two days later, having painted for only about a decade.
        now: '{staff} stayed with him through that July, the illness did not crush him again, and when the summer was over he was still at the Auberge Ravoux. He painted for a few more years, and after the wheatfields there were other seasons.'
    vignettes:
      sky: '{staff} draws the same field twice in a notebook, first with a strip of sky and then with much more, and sees something in the second that the first had hidden.'
      wind: '{staff} waits for the next gust over the wheat and watches the dark patch move across it, without rubbing out the first look.'
      path: '{staff} walks along a path between the fields until its end can be seen, and on the way back can tell where it goes.'
  abel_froland:
    name: The example and the claim
    place: Froland
    figure: Niels Henrik Abel
    story: At Christmas 1828 Niels Henrik Abel came by sledge to the ironworks at Froland, cold and coughing, to visit his fiancée, and he lay ill there for twelve weeks. On 6 January 1829 he wrote his last paper, two or three pages restating the main result of the long memoir he had given to the Paris Academy. He died of tuberculosis on 6 April, aged twenty six. Two days later, not knowing, August Leopold Crelle wrote from Berlin that a post for him was secured.
    story_prose:
      opening:
        - Froland ironworks, southern Norway, January 1829. Niels Henrik Abel lies ill in the house where his fiancée is a governess, coughing hard. He is twenty six. Some years ago he proved that the general equation of the fifth degree cannot be solved by radicals, but the long memoir he gave the Paris Academy in 1826 has not been heard of since.
        - In history, he was already cold and ill when he came by sledge at Christmas, and he lay in bed here for twelve weeks. On 6 January he wrote his last paper, two or three pages long. He died of tuberculosis on 6 April. Two days later Crelle wrote from Berlin that a post for him was secured. In this branch, the kitchen maid downstairs listens to the coughing all night, and the clerk of the ironworks sorts the post every day as usual.
        - 'Three kinds of people can help on this trip: someone who can check a derivation and keep papers and intake records in order, someone who knows nursing and can keep watch at a sickbed, and someone who can move friends far away and press them to write back.'
      outcomes:
        all: In April, when the letter from Berlin confirming the post was written, Abel was already gone. The March reply lay under his pillow, and the stove in the room had not yet gone out.
        p4: In April, when Berlin wrote to confirm the post, Abel was already gone. The March reply still lay under his pillow.
        p3: The stove in that room at Froland burned on into April.
        p2: Many years later someone went to Paris looking for the long memoir, found the small line at the foot of the short paper, and began with the intake register of that year.
        p1: The paper of two or three pages was sent. The address on the envelope was in his own hand.
      none: Winter was long at Froland. The snow outside the window never melted, and the man upstairs coughed night after night.
      desync: On 6 January the short paper stopped before it could be checked, and {staff} was recalled. The coughing upstairs went on. The pages lay spread on the bedcover, the ink not yet dry.
      not_admitted: '{staff} never got through the door of that house. The man upstairs was still coughing, and the news from Berlin was still on its way.'
      points:
        p1: On 6 January Abel sat propped on the pillow writing the short paper, two or three pages spread on the bedcover. {staff} followed the derivation line by line with a pen and marked each place where the notation did not agree from one step to the next, and he corrected them one by one. By evening the paper was fair-copied, and there were a few spots of ink on the bedcover. He squared the three pages, pressed them flat with his palm, and only then handed them over.
        p2: 'The short paper was still at hand. {staff} set it beside the date the Paris memoir had been submitted, and at the foot of each copy wrote one small line: the year it was handed in, to whom, and under what title. The ink was faint, squeezed into the margin, and not dry until dusk. Of the two copies, one went in with the short paper and one stayed in his folder of manuscripts.'
        p3: On the coldest nights at the end of January Abel coughed too much to sleep. {staff} kept the stove fed, warmed the bed, raised his pillows, wiped his sweat and gave him water. One night the window was covered in frost flowers, and the stove in the room never went out. Near dawn, after a fit of coughing, he fell asleep again.
        p4:
          class_lettered: '{staff} went about it the way one keeps a correspondence, listing one by one the people in Berlin working on his behalf and what each was doing, and wrote to each in turn, asking them to send word of their progress to Froland without waiting for anything to be settled. In March the reply came. Abel had the letter brought to his bed and read it twice. It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.'
          else: '{staff} wrote to Berlin letter after letter, saying how ill he was and asking the friends working for him to send word of their progress without waiting for anything to be settled. In March the reply came. Abel had the letter brought to his bed and read it twice. It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.'
      excerpts:
        p4: It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.
        p3: One night the window was covered in frost flowers, and the stove in the room never went out. Near dawn, after a fit of coughing, he fell asleep again.
        p2: The ink was faint, squeezed into the margin, and not dry until dusk. Of the two copies, one went in with the short paper and one stayed in his folder of manuscripts.
        p1: By evening the paper was fair-copied, and there were a few spots of ink on the bedcover. He squared the three pages, pressed them flat with his palm, and only then handed them over.
    relic: A sealed letter
    relic_desc: An unopened offer, tied with a thread.
    points:
      p1: Help Abel check his last short proof while he is ill so the paper can be sent
      p2: While the short paper is at hand, tie it to the Paris submission record so anyone searching has a reference
      p3: Through the twelve weeks Abel lies in bed at Froland, keep the cold from his room and ease his cough and his pain
      p4: Ask the friends seeking a post for Abel to send an interim letter so he knows before he dies that they are still trying
    points_fail:
      p1: The paper stops before it can be checked, and the central result of the Paris memoir loses this early public record. The office recalls the employee after a loss of sync.
      p2: People searching for the Paris memoir still have to work through the old intake records with little more than a title.
      p3: Nobody eases the cold and the cough, and in this branch his last weeks at Froland are as hard as they were.
      p4: No word reaches Froland in time. The formal confirmation comes too late.
    shift:
      p1:
        was: On 6 January 1829 at Froland, Abel wrote his last mathematical paper, restating a main result of his Paris memoir.
      p2:
        was: Around 1829 Abel restated the Paris memoir's central result; the manuscript was hard to locate and did not appear in print until 1841.
        now: '{staff} links the new paper to the earlier submission date and leaves a reference with each copy, narrowing any later search.'
      p3:
        was: At Christmas 1828 Abel travelled by sledge to Froland, cold and coughing, and began to cough up blood; he lay in bed there for twelve weeks.
        now: '{staff} keeps the stove going and the bed warm, and sits up with him through the worst nights. Abel suffers a little less in his last weeks.'
      p4:
        was: Abel died on 6 April 1829. The letter confirming a post in Berlin was written two days later.
        now: '{staff} asks a contact to report on the efforts already underway. Abel reads that his friends are still working to find him a post.'
        who: abel_froland
        bio: Before he died, Abel heard how his Berlin friends were trying to keep an opportunity open for him to continue his research. The formal confirmation still came after his death.
    vignettes:
      firewood: In the coldest days of February {staff} helps the kitchen maid carry firewood upstairs. When the gentleman upstairs coughs all night, she says, she lies downstairs counting, and by morning she has lost count.
      sledge: In January {staff} helps the groom fit a new shaft to the sledge. At Christmas he fetched a gentleman out from town, the groom says, wrapped in three blankets and coughing the whole way; on arrival the man could not lift his own trunk, and the groom carried it up and refused the coin.
      post: In April {staff} helps the clerk of the ironworks sort a bag of post. He turns up a letter with a Berlin mark, holds it to the window a while, and says that this one has come at a bad time, because the man it is for is no longer here.
  riemann_selasca:
    name: The last paper
    place: Selasca
    figure: Bernhard Riemann
    story: Bernhard Riemann fell ill in 1862 and travelled to Italy more than once while suffering from tuberculosis. In June 1866 he came for the third time, to Selasca on Lake Maggiore. On 19 July, resting under a fig tree, he was still working on his last paper, which he did not finish. He died there the next day, aged thirty nine. Ten years later his collected works came out, with Richard Dedekind among the editors.
    relic: A page of notes
    relic_desc: A page of unfinished formulas in a small hand.
    points:
      p1: As his strength fails at Selasca, take down what he dictates and keep the pages in order, helping him carry his last paper further than history left it
      p2: Cure the tuberculosis that is killing him, and save Riemann
    points_fail:
      p1: The last paper stopped where history left it.
      p2: He died at Selasca on 20 July as history has it, and in this branch too he could not be kept.
    shift:
      p1:
        was: The Royal Society obituary and Dedekind's account say that the day before he died, resting under a fig tree at Selasca, Riemann was still working on his last paper, which was left unfinished.
        now: The last paper went several pages further in his own words, and it was printed with them.
      p2:
        was: Riemann died of tuberculosis at Selasca on Lake Maggiore on 20 July 1866, aged 39.
        now: '{staff} brought the cure for the disease that had worn him down since 1862. That autumn he went back north and taught again in Göttingen.'
        who: riemann_selasca
        bio: In this line Riemann recovered from tuberculosis in the summer of 1866. He went home to Göttingen and worked on for many years.
    vignettes:
      figs: On the evening of 18 July {staff} helps the landlord's small daughter clear fallen figs from under the tree. The chair there is for the German gentleman, she explains, and if she misses one, his papers come out purple.
      boat: Early in July {staff} helps a boatman unload a cargo of lemons at Pallanza. There are half as many boats on the lake this summer, the boatman says; the young men have all been called up, and he has had to teach his wife to row.
      chair: In August {staff} helps the landlord carry the chair in from under the fig tree. He wipes it down with his sleeve again and again, and says the tree has never borne so many figs as this year, and nobody left to sit under it.
  du_chatelet_luneville:
    name: Newton in French
    place: Lunéville
    figure: Émilie du Châtelet
    story: In the summer of 1749 Émilie du Châtelet was at the court of Stanislas at Lunéville, waiting for a child and finishing her French translation of Newton's Principia with its commentary. On 4 September she gave birth to a daughter. On 10 September she died, aged forty two; the cause is given as childbed fever by some and a pulmonary embolism by others. The same day the Royal Library in Paris signed a receipt for three packets of her commentary. The complete translation came out in 1759.
    relic: An inkwell
    relic_desc: A small inkwell from a desk worked at through the night.
    points:
      p1: In Lunéville, list the three packets of commentary before sending them with her request to the Royal Library
      p2: Have her leave Clairaut decisions on the two hardest passages, identifying where her translation should stand and where a later revision should be listed separately
      p3: Watch over her in the days after the birth, cure her, and keep her alive
    points_fail:
      p1: The packet with the commentary stays behind. The Library receives only the letter, and the office recalls the employee.
      p2: Two drafts reach the editor, but her decisions about how to print the revised passages do not.
      p3: On 10 September she died in Lunéville, six days after her daughter was born.
    shift:
      p1:
        was: On September 10, 1749, the Royal Library issued a receipt for three packets of Du Châtelet’s commentary on Newton.
      p2:
        was: In 1759, after Du Châtelet’s death, the complete French edition appeared, with Clairaut having helped prepare it.
        now: The editor has two decisions she approved and describes any later changes on another page. Readers can distinguish her commentary from editorial additions.
      p3:
        was: On the night of 4 September 1749 Du Châtelet gave birth to a daughter, and on 10 September she died in Lunéville; the cause is given as childbed fever by some and as a pulmonary embolism by others.
        now: She came through the days after the birth and recovered over the autumn. She saw her Newton translation into print herself and went on with her research for many years.
        who: du_chatelet_luneville
        bio: Du Châtelet survived the birth of 1749, took her French Newton and its commentary to the printer herself, and kept writing and researching for years after.
    vignettes:
      stairs: Early on 4 September {staff} helps a laundry girl carry a pile of clean cloths upstairs. The lamp up there was lit at midnight, she says; she counted the feet on the stairs, and by daybreak it was eleven trips.
      candles: At the end of August {staff} helps the old servant who keeps the candles count the store. The lady marquise burns more candles than the king's own study, he says, and this month he has to send in his account a week early.
      arbour: In October {staff} helps a gardener take down the curtains of the arbour. The court has gone quiet early this autumn, he says; most years they would still be putting on plays out here.
    story_prose:
      opening:
        - Lunéville, 1749. Du Châtelet is close to giving birth, and the manuscript of her translation of Newton's Principia is still on her desk. She has put the Latin work into French and, in her own commentary, explained the derivations. French readers who open Newton later will read, alongside him, how she worked it out.
        - In history, she died six days after her daughter was born. That day the Royal Library in Paris issued a receipt for three packets of commentary. The manuscript was saved, and ten years later the complete work came out; she never saw a single printed copy.
        - 'Two kinds of people can help on this trip: someone who knows manuscripts can help with the translation, and someone who knows nursing and brings the right medicine and instruments can keep watch outside the lying-in room.'
      outcomes:
        all: That autumn Newton lay open again on the desk at Lunéville. The proofs came page by page, she read them page by page, and the margins carried her own hand.
        p3: That autumn she came back to her desk. When the proofs arrived, the doubtful page did not have to be sent to anyone to ask; it lay spread at her elbow.
        p2: Ten years later Clairaut unwrapped the manuscript, and the signed sheet was still tucked where it had been. Which lines to print as she had translated them, he settled place by place, by that sheet.
        p1: On the receipt of the Royal Library were her name and the count of three packets. The day it was made out was 10 September.
      none: In September at Lunéville the desk was cleared. The inkwell at its corner had not yet been capped.
      desync: When it was time to hand over the manuscript, the commentary was still in the house. The deposit could not be carried through, and the office called {staff} back first. On leaving, the three packets were still tied up under the desk.
      not_admitted: '{staff} never got as far as that desk. Through the window the papers could be seen stacked pile on pile, and the lamp stayed lit until very late.'
      points:
        p1: Before dispatch {staff} entered the three packets of commentary one by one and checked them again against the list. When the knot on the last packet was pulled tight, all that was left on the desk was her letter to the Royal Library, the ink already dry.
        p2: The two drafts lay side by side, the changes crowded close. She touched the paper with the tip of her pen and went through them one place at a time, and {staff} wrote them down one place at a time on another sheet. When it was done she took the sheet, read it through, and signed her name in the lower right corner.
        p3: A few days after the birth her condition turned sharply worse. {staff} opened the medical case brought along and kept watch at the bed, taking her temperature and giving the medicine by the clock, and kept a lamp burning all night. The sixth day after her daughter's birth went by, and Du Châtelet was still alive. In autumn the printer sent the proofs. She turned to the page where the commentary was squeezed in against the text, drew the paper closer, picked up her pen, and drew a line under a misprinted row.
      excerpts:
        p3: In autumn the printer sent the proofs. She turned to the page where the commentary was squeezed in against the text, drew the paper closer, picked up her pen, and drew a line under a misprinted row.
        p2: She touched the paper with the tip of her pen and went through them one place at a time, and {staff} wrote them down one place at a time on another sheet. When it was done she took the sheet, read it through, and signed her name in the lower right corner.
        p1: Before dispatch {staff} entered the three packets of commentary one by one and checked them again against the list. When the knot on the last packet was pulled tight, all that was left on the desk was her letter to the Royal Library, the ink already dry.
  noether_gottingen:
    name: A lecture under another name
    place: Göttingen
    figure: Emmy Noether
    story: In 1915 David Hilbert and Felix Klein brought Emmy Noether to Göttingen, but the university would not let a woman qualify to lecture, and from the winter of 1916 her courses were announced under the name of Hilbert. On 26 July 1918 Klein presented her paper Invariant Variational Problems to the Göttingen society of sciences, and she handed in its final version at the end of September. The paper links continuous symmetries of an action to conservation laws. She was admitted to lecture in June 1919, and only in 1923 was she first paid a small fixed salary for teaching.
    relic: A lecture notice
    relic_desc: A hall notice with Hilbert's name where hers should be.
    points:
      p1: Get Noether’s signed paper and its summary to Klein together so he can submit the work at the scheduled Göttingen meeting
      p2: Give the department a record of the classes Noether has taught and a copy of her signed paper. Ask the department to budget payment for the next seminar and file it with the new application
    points_fail:
      p1: The list has the presenter’s name, but the manuscript and its author’s page cannot be matched. The society puts the paper off to another meeting, and the office recalls the employee.
      p2: The department agrees to keep the seminar running. It uses the old schedule and sets aside no pay for the hours Noether teaches.
    shift:
      p1:
        was: Felix Klein presented Invariant Variational Problems at a meeting in Göttingen on July 26, 1918. The printed paper names Emmy Noether as its author.
      p2:
        was: Noether completed her habilitation in 1919. The university dates her first teaching assignment with a small fixed salary to 1923.
        now: The department approves a small seminar budget ahead of the new habilitation review and pays for the hours she teaches. Students working with her have a regular time to bring their problems.
        who: noether_gottingen
        bio: Göttingen’s rules blocked Noether’s first application to qualify as a lecturer. She continued her research and later taught students in her own classes.
    vignettes:
      notice: Before the winter semester {staff} helps the porter pin the timetable to the board. He taps one line, Professor Hilbert with the assistance of Dr Noether, and says he has pinned that line up for several terms now, and the one who goes in to teach has always been the lady doctor.
      turnips: In October {staff} helps the landlady dig turnips in the back yard. The influenza is back in town, she says, half the student lodgings are empty, and she has stopped counting the bread coupons because there is nothing left to count.
      snow: Late in December {staff} helps the porter of the mathematics building sweep snow from the steps. So many students have come back from the war, the porter says, that the halls have no seats left and some are listening from the corridor.
  wegener_greenland:
    name: Across the ice
    place: Greenland ice cap
    figure: Alfred Wegener
    story: Wegener reached the inland station Eismitte in 1930 with supplies and died on the return journey. The account at the Alfred Wegener Institute preserves the expedition's sequence and identifies his Greenlandic companion Rasmus Willumsen.
    relic: A sledge strap
    relic_desc: A frozen leather strap from a loaded sledge.
    points:
      p1: Keep the relief party going through the last stretch of ice, so that Wegener, Loewe and Villumsen reach Eismitte on 30 October
      p2: Treat Loewe's frostbitten feet, so that his toes do not have to be cut off in the ice cave
      p3: Keep Villumsen safe on the way west, so that he reaches the camp with Wegener's diary
      p4: Treat Wegener on the ice on the way back, so that he walks into the western camp alive
    points_fail:
      p1: The party is held on the ice by the cold and does not reach the station on 30 October. This branch has come loose from history, and the office recalls the employee.
      p2: Loewe's frostbitten toes could not be saved. They were cut off at the station that winter, and he could not walk until spring.
      p3: Villumsen buried Wegener and went on west with the diary. Nobody saw him again, and the diary was lost with him.
      p4: Wegener died on the way back, about the middle of November, in a tent on the ice. He was found in May of the next year.
    shift:
      p1:
        was: '30 October 1930: after forty days on the ice, Wegener, Loewe and Villumsen reach the Eismitte station in the middle of the ice sheet.'
      p2:
        was: 'Winter 1930: at Eismitte, Loewe''s frostbitten toes are cut off with a pocket knife, and he cannot walk for the rest of the winter.'
        now: Loewe kept his toes. He spent the winter at the station on his own feet.
      p3:
        was: 'November 1930: Villumsen buries Wegener on the ice, takes his diary and goes on west. He is never found.'
        now: Villumsen reached the western camp and put Wegener's diary into the hands of the expedition.
        bio: Rasmus Villumsen came back from the ice in November 1930 and went home to his family in Greenland.
      p4:
        was: '1 November 1930: Wegener leaves Eismitte on his fiftieth birthday. He dies on the ice about the middle of November, and his body is found on 12 May 1931.'
        now: '{staff} stayed with him all the way back and watched his strength each night. He walked into the western camp alive, and lived to see the measurements of the expedition worked out.'
        who: wegener_greenland
        bio: Wegener came back alive from the middle of the ice sheet in November 1930. He lived for many more years and saw the observations of the expedition worked out.
    shift_all: In this timeline everyone who went in and out of Eismitte that autumn came back to the coast alive.
    vignettes:
      names: A fictional clerk lists the expedition under only one surname. You ask who handed over the load. They leave a line for the other people involved instead of recording just the best-known name.
      count: The clerk has made the first count look like the quantity delivered. You ask them to mark which station each figure came from. The two totals no longer sit under the same heading.
      note: You copy the destination onto a second slip while the clerk ties up the empty ledger. The next person can still tell which station the entries concern.
  boltzmann_duino:
    name: Same count, different arrangements
    place: Duino
    figure: Ludwig Boltzmann
    story: In 1877 Ludwig Boltzmann tied the laws of heat to the statistics of atoms by counting the ways a distribution of energy can arise, but into the twentieth century many still doubted that atoms were real. In May 1906, ill with what was called severe neurasthenia, he stopped lecturing, and that summer he went with his family to Duino near Trieste. He died there on 5 September, aged sixty two. Two years later the experiments of Jean Perrin on Brownian motion began to confirm the predictions of Einstein, and atoms came to be accepted.
    story_prose:
      opening:
        - The bay of Duino near Trieste, summer 1906. Ludwig Boltzmann is on holiday here with his wife and daughter. Nearly thirty years ago he counted how many arrangements can give the same distribution of energy, and tied the laws of heat to atoms. Even now, many do not believe that atoms really exist.
        - In history, that May he stopped lecturing, ill with what was called severe neurasthenia, and Stefan Meyer took his lectures. On 5 September he died at Duino, aged sixty two. Two years later Perrin’s experiments on Brownian motion began to bear witness to atoms. In this branch, a fisherman dries his nets on the shore, a small boy counts pebbles on the beach, and the hotel maid brings the towels in from the sea every day.
        - 'Two kinds of people can help on this trip: someone learned enough to talk with him about atoms, and someone who knows medicine, has brought the right remedy and can stay beside a sick man.'
      outcomes:
        all: In September the train for Vienna pulled out of Duino. Boltzmann sat by the window, his coat pocket bulging with those few sheets of working.
        p2: In September the train for Vienna pulled out of Duino. He sat by the window and watched the sea all the way.
        p1: All that summer the sheets of working stayed in his coat pocket.
      none: The bay of Duino was very still. On the hotel terrace, a few sheets of working had blown off the table onto the floor.
      not_admitted: '{staff} never got near the family. Every day the man on the hotel terrace sat facing the sea, and the holiday grew shorter day by day.'
      points:
        p1: 'One evening early in August Boltzmann sat on the hotel terrace, a few sheets of working weighed down on the table. {staff} picked one up and began with the jittering of tiny particles in water: how Einstein had worked out the year before how far such jittering should carry them, and how in two more years someone would measure it under a microscope. He listened to the end without a word, squared the sheets, and put them in his coat pocket. Going back to his room, he kept his hand pressed on that pocket.'
        p2:
          class_learned: As a doctor would, {staff} set the hours for his medicine and his sleep each day, took his pulse morning and evening, and walked with him a stretch along the shore by day. By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.
          else: '{staff} changed the calming patches they had brought at the set times, sat with him at night until he slept, and walked with him a stretch along the shore by day. By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.'
      excerpts:
        p2: By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.
        p1: He listened to the end without a word, squared the sheets, and put them in his coat pocket. Going back to his room, he kept his hand pressed on that pocket.
    relic: A chalk stub
    relic_desc: A worn stub of lecture chalk.
    points:
      p1: Let him know that within a few years experiments will show atoms are real, and the theory he defended for half his life will stand
      p2: Before the Duino holiday ends, cure his illness and see him back to Vienna
    points_fail:
      p1: He spends the summer still among the doubters. In this branch nobody told him that experiments on Brownian motion would bear witness to atoms.
      p2: 5 September happened as it did in history. In this branch he never returned to his lectern in Vienna.
    shift:
      p1:
        was: When Boltzmann died on 5 September 1906, many physicists and chemists still doubted that atoms were real; from 1908 Perrin's experiments on Brownian motion confirmed Einstein's 1905 predictions, and atoms came to be generally accepted.
        now: That summer he already knew that within a few years someone would settle the question of atoms by experiment.
      p2:
        was: In May 1906 Boltzmann went on sick leave and Stefan Meyer took over his lectures; on 5 September he died while on holiday at Duino, aged sixty two.
        now: '{staff} stayed with him through that summer at Duino, and the illness slowly eased. In the autumn he went home to Vienna with his family, taught again, and lived to see atoms confirmed by experiment.'
        who: boltzmann_duino
        bio: In this line Boltzmann recovered in the autumn of 1906, went back to Vienna, taught for some years more, and saw Perrin's experiments win acceptance for atoms.
    shift_all: He knew his theory would stand, his illness eased, and in the autumn he went back to Vienna to teach.
    vignettes:
      pebbles: In July {staff} helps a fisherman's small son count a bucket of pebbles on the beach. The boy asks whether things too small to count are there at all. {staff} says they are there whether anyone counts them or not; the boy thinks about it, and throws in another handful.
      nets: Early in July {staff} helps a fisherman bring in the nets drying on the shore. Slovene, Italian, German, the fisherman says, you hear them all round this bay, and the fish do not care which one you curse them in.
      towels: In August {staff} helps the hotel maid bring in the towels drying by the sea. The water warmed early this year, she says, the guests from the city stay the whole season, and the salt has taken the skin off her hands.
  cantor_halle:
    name: Letters from the clinic
    place: Halle
    figure: Georg Cantor
    story: Cantor retired in 1913 and spent his last years ill and short of food under the war conditions in Germany. In June 1917 he entered the clinic in Halle for the last time, and wrote to his wife again and again asking to be allowed home. On 6 January 1918 he died there of a heart attack.
    relic: A set of index cards
    relic_desc: Cards covered with lists that never end.
    points:
      p1: Persuade the clinic and his family to let him go home to recover
      p2: Through the last winter of the war, keep him fed and look after his heart, and save him
    points_fail:
      p1: As in history he stays in the clinic. His letters asking to come home go out one after another and are never granted.
      p2: On 6 January 1918, as in history, he dies of a heart attack in the clinic.
    shift:
      p1:
        was: 'June 1917: Cantor entered the clinic in Halle for the last time and wrote to his wife again and again asking to come home; he was not allowed to.'
        now: He went home and recovered among his family.
      p2:
        was: '6 January 1918: Cantor died of a heart attack in the clinic in Halle, after years of wartime hunger.'
        now: That winter he had enough to eat and someone to look after him, and he lived on past January 1918.
        who: cantor_halle
        bio: In this timeline Cantor had food and care through the last winter of the war, and lived on past January 1918.
    vignettes:
      list: The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.
      after: The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.
      end: You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.
  tesla_wardenclyffe:
    name: The line marked proposed
    place: Shoreham, Long Island
    figure: Nikola Tesla
    story: In March 1901 J. Pierpont Morgan agreed to put 150,000 dollars into a wireless station for Nikola Tesla. The architect Stanford White designed the buildings at Wardenclyffe on Long Island, and that year Tesla wrote to him several times about the tower and the laboratory. Building began in September. In December Marconi heard a signal sent across the Atlantic. Tesla moved his laboratory into the brick building in June 1902; in July 1903 Morgan wrote that he would advance no more money. The tower was blown up in 1917.
    relic: A drawing copy
    relic_desc: A copy of a Wardenclyffe plan sheet, folded twice, with a date in pencil under the fold.
    points:
      p1: When the September bids come in high, register the original and revised drawings separately at Wardenclyffe so the work can still start that year
      p2: Have White list the laboratory work already agreed apart from the tower work still awaiting bids and give the foreman a separate account for each
      p3: Help Tesla propose staged payments using the confirmed costs, with its own commitment for the next stretch of foundation work
    points_fail:
      p1: Contractors quote from obsolete drawings and nobody can confirm the dimensions. The work is called off for the season, and the office recalls the employee.
      p2: One quote lumps the building and tower together. Later the crew cannot see which portion was already authorized.
      p3: Both sets of work still depend on the same round of funding. When money runs short, the crew cannot tell which work will be paid for.
    shift:
      p1:
        was: Tesla and Stanford White discussed bids and designs in 1901. Construction at Wardenclyffe began that year.
      p2:
        was: Wardenclyffe included a laboratory building and a tower. Correspondence records changes to designs and budgets.
        now: Before starting, the foreman can settle the two accounts separately. A new tower quote can be checked against the previous estimate.
      p3:
        was: Morgan provided initial funding. Later funding fell short and the project did not proceed as originally intended.
        now: A written agreement covers the confirmed stretch. When funds run short later, the site can settle that bill and clearly identify the work still unfunded.
        who: tesla_wardenclyffe
        bio: Tesla envisioned Wardenclyffe as part of a wireless communication and power system. Turning it into a site also required bids, financing and building schedules.
    vignettes:
      timber: Early in October {staff} helps a carter get a load of planks up the sandy track to the site, one shoulder under the tailboard each time the wheels sink. The carter says the farmers down the road have started timing their hens by the hammering, and they lay best on the days the yard is quiet.
      signal: 'In mid December a boy comes up from the station waving a paper: Marconi has heard a signal from across the ocean. The foreman holds the page at arm''s length and asks {staff} whether a dot can really get that far. {staff} says it can, and the foreman folds the paper into his coat and tells the men to keep hammering.'
      watch: Late in December {staff} sits a night out with the watchman in the plank shed on the bluff, stuffing old newspapers into the cracks against the wind off the Sound. The watchman reads out the price of coal from one of them and says a tower that tall had better be worth the draught.
  mozart_requiem_vienna:
    name: Leave the hand visible
    place: Vienna
    figure: Wolfgang Amadeus Mozart
    story: Mozart died in Vienna in December 1791 with the Requiem incomplete. The Austrian National Library preserves working material and a delivery score with contributions by Franz Xaver Süssmayr.
    relic: An unfinished practice leaf
    relic_desc: A fictional copying leaf showing where the surviving notes stop.
    points:
      p1: Keep the finished opening of the Requiem together when illness forces a handover
      p2: After he takes to his bed on 20 November, cure the fever that keeps him there
    points_fail:
      p1: The opening parts get mixed with loose drafts and the first movement can no longer be reassembled. The office recalls the employee after the branch falls out of sync.
      p2: In this branch the illness does not lift. He dies in Vienna on 5 December, aged 35.
    shift:
      p1:
        was: In December 1791, Mozart died with the opening of the Requiem fully orchestrated and much of the rest unfinished.
      p2:
        was: From 20 November 1791 Mozart was confined to bed. He died in Vienna on 5 December, and the parish register gave the cause as severe miliary fever.
        now: '{staff} brings a medicine that breaks the fever, and in December he sits up again. In this timeline he finishes the Requiem in his own hand and goes on composing and performing in Vienna for many years.'
        who: mozart
        bio: Mozart recovered in the winter of 1791, finished the Requiem himself and went on composing and performing in Vienna for many years.
    vignettes:
      stack: Greta is clearing the table and sets an empty-looking leaf aside. You hold the stack while Emil checks the page before it. The empty staff belongs in the sequence. Greta puts it back with a loose slip marking where it came from.
      hand: Emil can copy the line in front of him and is ready to carry straight on into an unwritten staff. You have him rule a small mark in the margin at the point where copying stops. In the finished handoff, the next reader can see exactly where a new hand would have to begin.
      finish: You can hum the passage as a future choir will sing it. Greta needs the copy now and asks where the written music on that page ends. You show her the boundary and keep the melody to yourself. The next version will be put together after you leave.
  schubert_vienna:
    name: The March programme
    place: Vienna
    figure: Franz Schubert
    story: On 26 March 1828, for the only time in his life, Franz Schubert gave a public concert of his own works, in the rooms of the Gesellschaft der Musikfreunde in Vienna. In the autumn, already ill, he moved into the new flat of his brother Ferdinand in Wieden. On 2 October he offered his last three piano sonatas to the publisher Probst. He died in that flat on 19 November, aged thirty one. The sonatas came out only in 1839, with another dedication.
    relic: A song manuscript
    relic_desc: A song in a quick hand with the ink still dark.
    points:
      p1: Get the volunteer players and the society's hall onto the same evening and protect Schubert's own concert
      p2: Turn the inquiry into an agreement while Schubert can still settle publication and the dedication for his last three sonatas
      p3: Before he moves to his brother Ferdinand's, cure the illness he has carried for years, so that he lives through that autumn
    points_fail:
      p1: The players and the available hall are booked for different days. The friends' concert is canceled, and the office recalls the employee after a loss of sync.
      p2: The inquiry is left waiting for a reply. The sonatas appear years after his death with a different dedication.
      p3: As in history, he moves to his brother's still ill on 1 September, and dies there on 19 November.
    shift:
      p1:
        was: On 26 March 1828 Schubert gave a Vienna concert of his own music with help from friends and performers.
      p2:
        was: On 2 October 1828 Schubert offered his final three sonatas and named his intended dedicatee. They were first published in 1839.
        now: '{staff} gets all three scores and the dedication sent together and asks for written confirmation. Schubert receives it while he is alive, and the dedication stays with the music.'
      p3:
        was: '1 September 1828: Schubert, already ill, moved into his brother Ferdinand''s flat in a new house in Wieden, and died there on 19 November, aged thirty one.'
        now: The medicine {staff} brought cured him. He did not fall ill that November, and went on living and writing music in Vienna for years. What he wrote is not in the record of this trip.
        who: schubert_vienna
        bio: In this timeline Schubert was cured in the autumn he was thirty one, lived on for many years and kept composing in Vienna.
    vignettes:
      chairs: On the evening of 25 March {staff} helps the porter of the society set out chairs in the hall, row by row, until the porter runs out of chairs before he runs out of names. He says he has never seen so many people want to sit in one room for a man who is not dead yet.
      tavern: One July evening {staff} sits in a wine garden outside the city walls while a fiddler and a guitar player work through waltzes. The fiddler stops between two of them to say that in this heat the strings go flat by the second verse, and that the only cure is to play faster.
      stairs: 'Early in September {staff} helps the landlady of a new house in Wieden carry baskets up the stairs. The plaster still smells of lime, and she says the stairwell is so new it answers back: say a word on the ground floor and the third floor hears it twice.'
  keats_rome:
    name: A room by the steps
    place: Rome
    figure: John Keats
    story: In November 1820 John Keats, ill with tuberculosis, came to Rome with the painter Joseph Severn and took rooms at 26 Piazza di Spagna beside the Spanish Steps. He died there on the night of 23 February 1821 and was buried on 26 February in the Protestant Cemetery. At his wish, his gravestone does not give his name.
    relic: A pressed violet
    relic_desc: A dried flower kept in a book.
    points:
      p1: Keep Severn on his feet through the stopped money and the sleepless nights, so that he stays by Keats to the end
      p2: Stop Dr Clark's starvation diet and bleeding, so that he can eat and keep his blood
      p3: Before he dies, let him know that his poems will be read for generations
    points_fail:
      p1: Severn collapsed in January, and in the last days nobody was at the bedside in his place.
      p2: On 9 December he was bled another eight ounces as before, and each day he still had only one anchovy and a piece of bread.
      p3: He still believed he had left nothing behind. In this branch nobody told him otherwise in those last days.
    shift:
      p1:
        was: Late on 23 February 1821 Keats died, with Severn beside him to the end.
      p2:
        was: On 9 December 1820 Keats was bled another eight ounces, and still had one anchovy and a piece of bread a day.
        now: He could eat in those last months and was bled several times less, and he suffered somewhat less than in history.
      p3:
        was: When Keats died in February 1821 he still believed he had left no lasting work; at his wish his gravestone bears no name.
        now: '{staff} let him know in those last days that his odes would go on being read and learned by heart, and that this room in Rome would be kept for him.'
    vignettes:
      stairs: '{staff} counts the steps from the door to the room, so as to know how long the tray will stay warm, and writes the number in the margin of a shopping list.'
      window: '{staff} props the window a little so the sound of the fountain in the square comes in. Nobody in the room says anything about it, and nobody closes it.'
      fountain: '{staff} fills a jug at the boat shaped fountain at the foot of the steps. A flower seller, made up for the game, asks who in the house is ill, and gives a bunch of violets for half the price.'
  vermeer_delft:
    name: The painter in debt
    place: Delft
    figure: Johannes Vermeer
    story: After the war of 1672 Johannes Vermeer could hardly sell a painting, and in July 1675 he went to Amsterdam to borrow a thousand guilders. In December 1675, his widow later wrote, he went within a day and a half from healthy to dead; he was buried in Delft on 15 December, aged forty three, leaving eleven children. Early in 1676 Catharina Bolnes gave two of his paintings to the baker against a bread debt, and on 24 February she passed The Art of Painting to her mother Maria Thins. On 29 February the house was inventoried, and in April she asked the High Court to relieve her of the debts.
    relic: A pearl earring
    relic_desc: A small pearl of the kind he painted so often.
    points:
      p1: Before the year ends, keep The Art of Painting in his studio so it is not taken by creditors for his debts
      p2: Help him sell some of the paintings left on his hands since the war, and ease the household's debts
      p3: Let him know that his paintings will be remembered
      p4: Before mid December, heal him and keep him alive
    points_fail:
      p1: The Art of Painting went to a creditor at the end of the year, and in February Catharina had no painting to pass to her mother. This branch came loose from history, and the office recalled the employee.
      p2: The paintings stayed on his hands and not one sold. In this branch the household's debts kept growing day by day.
      p3: He never knew what would become of these paintings. In this branch nobody told him that two centuries later people would trace them back one by one.
      p4: 'December went as it did in history: within a day and a half he went from healthy to dead. In this branch Catharina still faced the debts alone with eleven children.'
    shift:
      p1:
        was: On 24 February 1676 Catharina Bolnes passed The Art of Painting to her mother Maria Thins so that it would not be sold to satisfy creditors; Vermeer had never sold it, even in debt.
      p2:
        was: From the war of 1672 Vermeer could not sell his art, and was left holding the paintings of other masters he dealt in; Catharina later gave this as the cause of the household's debts.
        now: A few of the paintings found buyers that December, and the bread bill and the other debts stopped growing for a while.
      p3:
        was: After his death in 1675 Vermeer was all but forgotten for nearly two centuries; only in the 1860s did Thoré-Bürger's research bring his work back to notice.
        now: Someone told him that these quiet rooms would one day be sought out and traced back, picture by picture.
      p4:
        was: In December 1675, Catharina later wrote, under the weight of the debts and the children he went within a day and a half from healthy to dead; he was buried in Delft on 15 December, aged 43.
        now: '{staff} stayed with him through that December, and the day and a half never came. He went back to his studio in Delft and painted for some more years, and Catharina and the eleven children did not lose him that winter.'
        who: vermeer_delft
        bio: In this line Vermeer lived through December 1675, painted in Delft for some more years, and saw his household through its debts.
    vignettes:
      bread: On the fifth of December {staff} helps the baker's boy carry the morning loaves along the Oude Langendijk. At one door the boy hands in the bread without being paid and makes a mark in his little book. He says his master grumbles about that page every Saturday, and every Monday sends the bread all the same.
      frames: In January {staff} spends a morning in a frame maker's shop, holding mitred corners while the glue sets. Half the frames against the wall are empty. The frame maker says that since the French came in seventy two people buy frames for mirrors, not for paintings, and a mirror at least never asks to be paid for twice.
      peat: In the middle of February {staff} helps a peat seller stack wet turves on the market square. She blows on her fingers and says this is the winter everyone in Delft burns the cheap stuff, so the whole town smells like a wet dog by the fire.
  rembrandt_amsterdam:
    name: After his son
    place: Amsterdam
    figure: Rembrandt van Rijn
    story: Rembrandt's son Titus was buried in Amsterdam on 7 September 1668, half a year after his wedding. In March 1669 Titus's daughter Titia was born. That year Rembrandt painted self-portraits dated 1669. He died on 4 October 1669 and was buried four days later in a rented grave; his last painting was left unfinished. Titus's widow was buried on 21 October.
    relic: A brush
    relic_desc: A worn brush with the paint dried in the hairs.
    points:
      p1: In his last weeks, help Rembrandt carry Simeon in the Temple on his easel further, so that his last painting is not left where his strength gave out
    points_fail:
      p1: Simeon in the Temple was left unfinished in his studio as history has it.
    shift:
      p1:
        was: Rembrandt died in Amsterdam on 4 October 1669. Simeon in the Temple, his last painting, was left unfinished at his death.
        now: '{staff} ground his colours and steadied the canvas through the last weeks. Simeon in the Temple was carried further in his own hand before October.'
        who: rembrandt_amsterdam
        bio: In this line Rembrandt worked on his last painting through September 1669 and took it further than history left it. It went out of his studio closer to how he meant it.
    vignettes:
      colours: On 22 September {staff} spends an afternoon in a colourman's back room off the Rozengracht, turning the muller over a slab of lead white until both arms ache. The colourman says painters these days all want their white smooth as cream, and he has a mind to sell them cream and see if they notice.
      barge: On 26 September {staff} helps a bargeman pole a load of peat along the Rozengracht. The water is so low this autumn, he says, that he scrapes the bottom at every bridge, and he has started greeting the stones by name.
      watchman: In the middle of November {staff} walks a wet round with the night watchman, who shakes his rattle at every corner and calls the hour. He says the rain this month has got into the rattle too, and it now sounds like a cough.
  gaudi_barcelona:
    name: Struck by a tram
    place: Barcelona
    figure: Antoni Gaudí
    story: On the evening of 7 June 1926 Antoni Gaudí, seventy three, was struck by a tram on the Gran Via in Barcelona. With no papers and in plain clothes he was taken for a beggar, and the taxis that were hailed would not stop. He died in the Hospital de la Santa Creu on 10 June and was buried at the Sagrada Família on 12 June. Domènec Sugranyes took over the direction of the works. On 20 July 1936 the workshop was set on fire, and most of the drawings and plaster models were lost.
    relic: A plaster model
    relic_desc: A small hanging model of a vault.
    points:
      p1: While Gaudí is in hospital, give Domènec Sugranyes the list of works in progress and the workshop keys so the building goes on in June
      p2: Ask Sugranyes to keep photographs, scales and drawings of the main plaster models in a second place, with a signed list left in the workshop
      p3: On the evening of 7 June, when the tram knocks down an old man nobody recognises on the Gran Via, get Gaudí to hospital at once and save him
    points_fail:
      p1: The workshop waits for Gaudí to sign off, and his colleague cannot retrieve the list of active work. The handover stops and the office recalls the employee.
      p2: The photographs and drawings stay in the same row of cupboards. When the workshop is damaged, the comparison material is lost with the plaster models.
      p3: Taken for a beggar, he lies in the street while taxis pass, reaches a dispensary and then the Santa Creu hospital late, and dies there on 10 June.
    shift:
      p1:
        was: A tram accident put Gaudí in hospital in June 1926, where he died. His colleague Sugranyes took charge of the Sagrada Família project.
      p2:
        was: In 1936 much of the workshop’s original drawings and plaster models were lost. The project later drew on fragments and published images for reconstruction.
        now: Ten years later the workshop cupboards burn. The team retrieves an album and the drawings from the second site. Two model faces they would otherwise have to piece together from fragments now have contemporary dimensions for comparison.
      p3:
        was: On 7 June 1926 Gaudí was struck by a tram on the Gran Via. With no papers and in worn clothes he was taken for a beggar, and he died in the Hospital de la Santa Creu on 10 June, aged seventy three.
        now: '{staff} kneels beside him within a minute, says who he is and gets him straight to a surgeon. Gaudí recovers, and goes back to the workshop at the Sagrada Família for some years more.'
        who: gaudi_barcelona
        bio: Gaudí survived the tram accident of June 1926. He returned to the Sagrada Família workshop and went on directing the work with Sugranyes for several more years.
    vignettes:
      tram: On 29 May {staff} rides the length of the Gran Via on a tram, standing on the back platform. The conductor says the worst part of his job is not the fares but the people who cross reading the paper, and he rings the bell at every corner as if he were scolding the whole street.
      stone: On 1 June {staff} helps two masons at the site lower a carved block onto its bed of mortar. When the wind comes up, it whistles through the openings of the tower overhead, and the younger mason swears it hits the same note every afternoon, and that he has started to hum along.
      water: On 10 July, the hottest day yet, {staff} carries jugs for the water seller who comes to the site at noon. She says the stonecutters drink a barrel before the bell and then complain the water tastes of dust, which, she points out, it does because they do.
  kafka_kierling:
    name: Proofs in the sanatorium
    place: Kierling
    figure: Franz Kafka
    story: In March 1924 tuberculosis reached the larynx of Franz Kafka, and swallowing became hard. On 19 April he came to the Hoffmann sanatorium at Kierling near Klosterneuburg, with Dora Diamant; he was told not to speak, and talked mostly on slips of paper. Around 6 May the medical student Robert Klopstock came to help care for him. On 2 June he was still correcting the proofs of his collection A Hunger Artist. He died around noon on 3 June, aged forty, and was buried in Prague on 11 June. The book of four stories came out in Berlin at the end of August.
    relic: A page of proofs
    relic_desc: A galley proof with small corrections in pencil.
    points:
      p1: Keep Kafka's place each time illness interrupts the proofing and protect the stories he was correcting
      p2: Share errands and correspondence among helpers so the people staying in Kierling have time to rest
      p3: Ease the pain in his throat, so that in his last weeks he can still swallow water and a few mouthfuls of soft food
      p4: Have the Berlin publisher bind an advance copy and send it to Kierling so Kafka can see his four stories together
    points_fail:
      p1: The proofs go back to Berlin without his final corrections. The branch loses sync and the office recalls the employee.
      p2: The same people are left to keep watch, answer letters and run errands, with no break while waiting for replies.
      p3: The pain in his throat still kept him from eating. In this branch he spent his last weeks speaking through notes and could hardly swallow.
      p4: Kafka never sees the book. The publisher sends it out only after his death.
    shift:
      p1:
        was: In May 1924 Kafka continued correcting proofs for A Hunger Artist while ill in Kierling.
      p2:
        was: In May 1924 a friend came to Kierling to help care for the seriously ill Kafka and relieve some of the work his partner had been doing.
        now: '{staff} gives the helpers turns taking letters, sending pages and keeping company. When one of them arrives, the person keeping watch can step outside.'
      p3:
        was: In the spring of 1924 tuberculosis reached Kafka's larynx. Swallowing was so painful that he could hardly eat or sleep, and his doctor injected the laryngeal nerve every eight to ten days against the pain. He died at Kierling on 3 June.
        now: '{staff} helped the doctor time the pain relief before meals. In his last weeks he could drink water and take a few mouthfuls of soft food, and suffered somewhat less than in history.'
      p4:
        was: Kafka died on 3 June 1924. The collection A Hunger Artist was published that August.
        now: '{staff} gets Berlin to bind a single copy of the corrected sheets and send it ahead. Kafka turns through it in Kierling and recognizes the four stories and the order he chose.'
        who: kafka_kierling
        bio: Kafka saw a copy bound from the final proofs before he died. The printed edition kept the selection and order he approved.
    vignettes:
      lilac: On 13 May {staff} helps the sanatorium gardener cut back the lilac by the fence. The gardener says it flowered a week late this year and the bees have not forgiven it; he swears they come to the kitchen window now just to complain.
      post: 'On 23 May {staff} walks down to the post office in Klosterneuburg with the sanatorium''s errand boy. The boy says he can tell where a letter comes from without reading it: the ones from Berlin are fat and stiff with paper, the ones from Prague thin and come every day.'
      rain: In the middle of June {staff} shelters from a cloudburst in the doorway of the village baker. The baker's wife watches the street turn into a stream and says the Kierling brook only ever floods when she has just scrubbed the step.
  dickinson_amherst:
    name: Poems in a chest
    place: Amherst
    figure: Emily Dickinson
    story: Many of Emily Dickinson's poems survive in manuscripts.
    relic: A sewn booklet
    relic_desc: A few pages sewn by hand with a poem on each.
    points:
      p1: Help Lavinia separate the letters to be destroyed from the bound poems and protect the unpublished work
      p2: Persuade Lavinia to keep the sewn books at home and send only copies that preserve the layout
      p3: Ease her illness in her last weeks, so that she can sleep at night
      p4: Before she dies, let her know that her poems will be printed and read for generations
    points_fail:
      p1: The poems are mixed with the correspondence and much of the unpublished work is lost. The branch falls out of sync and the office recalls the employee.
      p2: The books are taken apart for editing. Later readers have to reconstruct the order from stitch marks and paper.
      p3: In mid May she fell into a coma and did not wake again.
      p4: Fewer than a dozen of her poems were printed in her lifetime, all without her name. In this branch nobody told her otherwise in those last days.
    shift:
      p1:
        was: In 1886, after Dickinson died, Lavinia destroyed the incoming letters as requested and discovered hundreds of poems.
      p2:
        was: From 1886 on, Dickinson's hand-sewn books were disbound during the early editing of her poems.
        now: '{staff} helps Lavinia copy the pages as laid out and keep the originals at home. Later readers can still see which poems Dickinson stitched together.'
      p3:
        was: In May 1886, after two and a half years of illness, Dickinson fell into a coma and died on 15 May.
        now: She suffered less in those last weeks and slept at night.
      p4:
        was: When Dickinson died on 15 May 1886, fewer than a dozen of her nearly eighteen hundred poems had been printed, all without her name.
        now: '{staff} let her know while she was still awake that those poems would be printed as books and read for a long time to come.'
        who: dickinson_amherst
        bio: In her last days Dickinson learned that her poems would be read for generations, and she died at home in Amherst.
    vignettes:
      pause: The reader makes the dash disappear as they read aloud. You ask them to pause where the pencil broke off. They try the line again and hear a different ending.
      variant: You see a word written above the line. The reader wants to choose one version and move on. You make room in the margin for both and label which comes from where.
      stack: The reader straightens a loose pile. You keep two scraps together because their edges and handwriting match. The next clean copy starts with them side by side.
  poe_baltimore:
    name: The note from the Fourth Ward
    place: Baltimore
    figure: Edgar Allan Poe
    story: On 27 September 1849 Edgar Allan Poe left Richmond for his home at Fordham in New York, and came to Baltimore the next day. His whereabouts for the next five days are uncertain. On 3 October, election day, he was found in great distress at Ryan's Fourth Ward polls, and the printer Joseph Walker sent a note to Joseph Snodgrass. He was taken to Washington College Hospital, kept from visitors, and died there before dawn on 7 October, aged forty. The cause is still unknown. His aunt and mother-in-law Maria Clemm learned of it from a newspaper.
    relic: A walking cane
    relic_desc: A plain cane with a worn handle.
    points:
      p1: Use the note asking for help to find someone who can get Poe from the polling place to the hospital in time
      p2: Get word to Maria Clemm while he is still in the ward, so that she does not have to learn it from the paper
      p3: In Washington College Hospital, bring him through the delirium and save Poe
    points_fail:
      p1: The note was lost in the crowd and nobody came in time to take Poe to the hospital. The branch came apart from history and the office recalled the employee.
      p2: The family went on waiting for him to come home, and Maria Clemm read of his death in the paper.
      p3: He died in the hospital on 7 October as history has it, and in this branch too he could not be kept.
    shift:
      p1:
        was: On 3 October 1849 Poe was found in need of help at a polling place in Baltimore. After a note was sent, he was taken to Washington College Hospital.
      p2:
        was: On 9 October 1849 Maria Clemm wrote to Neilson Poe that she had just learned of his death from the newspaper.
        now: '{staff} sent her word of what the hospital knew and an address to write to. Her answer reached the ward while he was still there.'
      p3:
        was: Poe died at Washington College Hospital in Baltimore on 7 October 1849, aged 40. The cause of his death is still unknown.
        now: '{staff} stayed by him through the worst nights and he came through. In late October he left the hospital and went on north to his home in New York.'
        who: poe_baltimore
        bio: In this line Poe came through his days in a Baltimore hospital in October 1849. He went home to New York and went on writing and editing for some years.
    vignettes:
      wharf: On 28 September {staff} is on the wharf when the steamer from Richmond ties up. A porter with three trunks on his back says the Norfolk boats bring the sick and the Richmond boats bring the poets, and he cannot say which kind tips worse.
      ballot: On 2 October {staff} watches men nail up a board outside a tavern on Lombard Street. The tavern keeper says that tomorrow every room upstairs is let to the ward, and the beer is on the candidates; he has learned to count the barrels and not the voters.
      ward: On the night of 4 October {staff} takes a pail of fresh water up to the ward for drunk patients. The night porter says the gentleman in the barred room will not touch a cup; he keeps the lamp low, because the man talks to the wall when it is bright.
  sor_juana_mexico_city:
    name: The last books given away
    place: Mexico City
    figure: Sor Juana Inés de la Cruz
    story: In 1690 the bishop of Puebla published, without her leave, Sor Juana's critique of a sermon as the Carta Atenagórica, with a letter signed Sor Filotea. Her reply is dated 1 March 1691. In 1693 she sold her books and instruments, and in 1694 she renewed her vows. She died on 17 April 1695 in the convent of San Jerónimo, after nursing her sisters through an epidemic.
    relic: A quill pen
    relic_desc: A quill with a split tip beside an empty shelf.
    points:
      p1: In the weeks the sickness spreads, help her keep the sickroom going and hold the nursing of the sisters together
      p2: Save a sister who has fallen ill in the epidemic
      p3: When she falls ill herself, cure her
    points_fail:
      p1: The hands in the sickroom fall ill one after another and the nursing breaks off; in this branch her care of the sick sisters does not go on as it did in history.
      p2: She does not pull through and, as in history, is one of the sisters who die in those months; in this branch another bed in the sickroom is empty.
      p3: As in history, she dies on 17 April. In this branch she does not live through April.
    shift:
      p1:
        was: In the spring of 1695 an epidemic went through Mexico City, and Sor Juana cared for the sisters who fell ill.
      p2:
        was: In the epidemic of spring 1695 a number of sisters of her convent died.
        now: The sister lived through April, and once she was well she came back to help in the sickroom.
      p3:
        was: On 17 April 1695, Sor Juana died after nursing her sisters through the sickness.
        now: '{staff} cured her with the medicine brought along, and she lived through April. In the years after, she wrote more at the convent; what she wrote is not in the record of this trip.'
    vignettes:
      kitchen: '{staff} watches an egg set in hot butter and drop apart in syrup, and writes down on a scrap which pan did which, for nobody in particular.'
      shelf: '{staff} dusts the empty shelves in the cell and finds the marks where the books stood, darker squares on the wood, and leaves them as they are.'
      bells: '{staff} counts the bells for the dead from the courtyard, one evening twice, and goes back to the kettle.'
  mary_anning_lyme_regis:
    name: Bones in the cliff
    place: Lyme Regis
    figure: Mary Anning
    story: In about 1811 Mary Anning's brother Joseph found the skull of an ichthyosaur in the cliffs at Lyme Regis, and in November 1812 Mary dug out its skeleton, some five metres long. In December 1823 she found the first complete skeleton of a plesiosaur, and in December 1828 the first pterosaur found in England. She died in 1847, aged 47, still short of money; she was seldom credited in the papers written on her finds.
    relic: An ammonite
    relic_desc: A coiled fossil shell split from the blue lias.
    points:
      p1: On 10 December, keep the plesiosaur under the cliff safe, and get it out whole before the next fall and the returning tide
      p2: Help her count and draw the long neck bone by bone, so that the sketch sent to London stands up to questions
      p3: Let her know in her lifetime that these bones will one day carry her name
    points_fail:
      p1: The returning tide carried off half of the skeleton, and in this branch there is no first complete plesiosaur.
      p2: In this branch the sketch of 26 December went off as it was, with no second check marked on the neck bones.
      p3: In this branch she still did not know she would be remembered, and nobody told her that winter.
    shift:
      p1:
        was: In December 1823 Mary Anning took a whole skeleton out from under the cliff, its neck longer than its body.
      p2:
        was: On 26 December 1823 she sent her drawing of the plesiosaur to London as it was.
        now: Every neck bone on the sketch that reached London had its number, and when the doubts came later, the drawing already held the answer.
      p3:
        was: Mary Anning died in 1847 at forty seven, still short of money, and the papers on what she found seldom gave her name.
        now: Someone told her that winter that the bones she dug out would one day carry her name in a London museum, and that a statue of her would stand by the sea at Lyme Regis.
    vignettes:
      stone: '{staff} follows a crack past the neck of the skeleton until the line leaves the bones, and lifts the pencil there.'
      vertebrae: '{staff} counts the neck from the other end, and where the two counts do not meet, leaves a bracket instead of adding a bone.'
      pose: '{staff} turns a copy of the sketch until the head can be found without help, and writes under it who found it.'
    story_prose:
      opening:
        - Lyme Regis, winter 1823. After the tide has gone out, Mary Anning sees that the skeleton under the cliff has a neck longer than its body. Bringing the bones up is not enough. The people in London will look at it through a sheet of paper, and someone has to follow the crack in the rock and count the neck bones one by one before they can make out what she saw, standing under the cliff.
        - In history, Anning later sent the sketch away. The skeleton became famous, but she was seldom named in the papers written on these finds. This trip arrives before that drawing is sent.
        - 'Three kinds of people can help on this trip: someone who can do heavy work under the cliff and get the skeleton out before the tide returns, someone who can count and draw and tell bone from rock, and someone willing to sit down and talk with her, in words that reach her.'
      outcomes:
        all: On the sketch that went to London that winter, a row of small numbers ran beside the long neck, and in the corner was her name, in her own hand.
        p3: The letter went to London as before. The name in the corner of the drawing she had written there herself.
        p2: After the sketch reached London someone had doubts, took the drawing, and following the row of numbers counted down from below the skull one bone at a time.
        p1: That winter a whole skeleton lay in the little house at the top of the cliff, its neck longer than its body.
      none: On the day the letter went, Anning sat alone over the sketch until late. The long neck had been drawn and rubbed out so often that the paper had gone fuzzy.
      desync: When the tide covered the foot of the cliff, part of the skeleton had not yet been taken out. The last thing {staff} saw before the recall was the water closing over that neck bone.
      not_admitted: '{staff} never got down under the cliff with Anning. At low tide there was only her at the foot of it, a hammer in her hand.'
      points:
        p1: Before the tide came back, Anning and {staff} lifted the long-necked skeleton out piece by piece, wrapped the pieces in old newspaper and carried them up to the top of the cliff. The last piece had only just left when the waves covered the stretch of cliff foot behind them. Anning looked back once; there was nothing on the water but foam.
        p2:
          class_learned: While she drew the sketch, {staff} went by the rule of a field notebook and called out the bones one by one from the other end, writing each down as it was called. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.
          class_craft: While she drew the sketch, {staff} first traced the outline of the bones lightly along the crack, the way one traces a pattern, then counted the long neck from the other end. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.
          else: While she drew the sketch, {staff} helped her count the long neck from the other end. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.
        p3: 'Before the sketch was sent, {staff} spoke of London many years on: a museum there would show the bones she had dug from under the cliff, with the name of Mary Anning beside them, and a statue of her would stand by the sea at Lyme. Anning listened without looking up. The pen in her hand stopped a moment in the corner of the drawing, and there she wrote her own name.'
      excerpts:
        p3: Anning listened without looking up. The pen in her hand stopped a moment in the corner of the drawing, and there she wrote her own name.
        p2: Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.
        p1: The last piece had only just left when the waves covered the stretch of cliff foot behind them. Anning looked back once; there was nothing on the water but foam.
  hertz_bonn:
    name: The last term
    place: Bonn
    figure: Heinrich Hertz
    story: From early 1892 Hertz suffered again and again from a painful illness of the nose and throat, so bad at times that he could not work. In 1893 he went back to lecturing in Bonn while undergoing several operations, and finished his Principles of Mechanics. He died in Bonn on 1 January 1894, aged thirty six; the book came out after his death.
    relic: A spark gap
    relic_desc: A small brass spark gap from his experiments.
    points:
      p1: Before the illness gets worse, cure the long illness of his nose and jaw, and save him
    points_fail:
      p1: On 1 January 1894, as in history, he dies in Bonn, aged thirty six.
    shift:
      p1:
        was: '1 January 1894: Hertz died in Bonn, aged thirty six. From 1892 a painful illness of his nose and throat had kept returning, and several operations had not cured it.'
        now: His illness was cured and the pain stopped, and he went on lecturing in Bonn.
        who: hertz_bonn
        bio: In this timeline Hertz was cured at the end of 1893 of the illness he had carried for two years, and lived on in Bonn past 1894.
    vignettes:
      repeat: The assistant is writing ‘none’ after one glance. You put the receiver back where it was and ask him to watch through the lens again. A brief spark appears on the second look. You change the first entry to ‘uncertain’. Its cause is still open when you leave.
      signal: You know later devices will carry signals much farther. The assistant asks if the spark itself can carry a sentence. You leave two empty columns on his page, one for a recognised spark and one for any pattern he can reproduce. There is time to fill only the first.
      gap: You hold the written record at the bench and let the assistant call out what he sees. One entry remains blank because neither of you had a decent view of the gap. You bring back that honest blank. Further trials are still on his list.
  kepler_leonberg:
    name: What the witness saw
    place: Leonberg
    figure: Johannes Kepler
    story: In 1620 Katharina Kepler, the mother of the astronomer Johannes Kepler, faced accusations from neighbours in Leonberg that dated back five years. On 7 August she was arrested at her daughter's home in Heumaden. She was transferred from Leonberg to Güglingen and held under guard at her family's expense. That September, Johannes returned from Linz to take up her defence. After repeated delays, Katharina was released in the autumn of 1621, more than a year after her arrest.
    relic: A copy of a defence plea
    relic_desc: A fair copy of one page of a written plea, with a date corrected in the margin.
    points:
      p1: After Katharina is brought to Leonberg, have the keeper of the defense papers file a second copy so her written response reaches the proceedings
      p2: Help the family sort firsthand testimony, hearsay and later inferences into separate columns
      p3: Get thick bedding and hot food into the cell at Güglingen, so that Katharina, seventy three and in chains, comes through this winter
    points_fail:
      p1: The only copy the family can find is never delivered. The file has only the accusations, and the office recalls the employee.
      p2: The copy puts all three together. Once it reaches the file, the defense still has to ask who originally said what.
      p3: In this branch she spent the winter in chains as history has it, with only the two men who guarded her day and night, and the family paying for the guard.
    shift:
      p1:
        was: Katharina was arrested in August 1620. Through lawyers, Johannes Kepler insisted on a written record of the proceedings.
      p2:
        was: Testimony and written defenses survive. The defense answered claims one by one and challenged inferences used to link them.
        now: The lawyer can compare the three columns and point to claims the witnesses could not verify for themselves.
      p3:
        was: On 7 August 1620 Katharina Kepler was arrested and taken to Güglingen, where she was held in chains for fourteen months under two guards, at her family's cost. She was released in the autumn of 1621 and died about six months later.
        now: '{staff} settled things with the guards for the family. That winter she had thick bedding and hot food; the chains stayed on, but she held up better than in history.'
        who: katharina_kepler
        bio: In this timeline Katharina Kepler had warm bedding and hot food through her first winter in the cell at Güglingen, and was stronger when she was released in the autumn of 1621.
    vignettes:
      soup: 'On 13 September {staff} carries a pot of barley soup up the lane at Güglingen for the jailer''s wife. She says she can tell which prisoner is which by the bowls that come back: the old woman sends hers back scraped clean and complains that it wanted salt.'
      hearing: On 2 October {staff} helps a lawyer's clerk carry two bundles of papers to the town hall at Güglingen for the hearing. At the door they are told it is put off. The clerk sets the bundles down on the step and says he has carried them up so often that they ought to know the way by now.
      frost: In the middle of November {staff} rides on a carter's wagon from Leonberg to Güglingen. The carter says the road is worst where the Zaber valley begins; in the frost the wheels sing, and he has learned to tell the distance by the note.
  pushkin_st_petersburg:
    name: A place before its house number
    place: St Petersburg
    figure: Alexander Pushkin
    story: In 1836 and 1837 Alexander Pushkin lived in an apartment on the Moika embankment by the Konyushenny Bridge, in the house of Princess Volkonskaya. On 27 January 1837 by the old calendar, 8 February by the new, he fought a duel with Georges d'Anthès by the Black River and was shot in the stomach. He was brought home and died there on 29 January, 10 February by the new calendar. He is buried beside his mother at the Svyatogorsky Monastery near Mikhailovskoye.
    relic: A book of his verse
    relic_desc: A small book with a pressed leaf at one poem.
    points:
      p1: Help him sort out his growing debts, so that his wife and children no longer live from one bill to the next
      p2: After he is shot, keep him alive on the road back from the Black River, so that he reaches his apartment on the Moika
      p3: Heal the gunshot wound in his stomach, hold back the infection, and keep him alive
    points_fail:
      p1: In this branch the bills of that winter still lay on his desk, and nobody ever sorted them for him.
      p2: He did not live to reach the Moika, and in this branch there are no two days in the apartment.
      p3: On the afternoon of 10 February he died in the apartment as he did in history, and in this branch he was not kept even one more day.
    shift:
      p1:
        was: When Pushkin died in February 1837 he left heavy debts, which Nicholas I later paid off.
        now: The debts were written out on one sheet, which to pay first and which could wait, and the household knew where it stood.
      p2:
        was: After he was shot in the duel on 8 February 1837, Pushkin was carried home to his apartment on the Moika.
      p3:
        was: On 10 February 1837 he died of peritonitis in the apartment at thirty seven, leaving his wife and four children.
        now: The medicine {staff} brought held back the infection in the wound, and when February was over he was still recovering by the Moika. He went on writing for a few more years, and The Contemporary stayed in his hands.
    vignettes:
      number: '{staff} nearly gives a visitor a house number from a museum plaque that does not exist yet, then crosses it out and draws the bridge on the slip instead.'
      queue: '{staff} writes the same answer on several slips so that the people waiting in the hall can read it without asking again.'
      river: '{staff} walks from the bridge along the Moika with the porter and counts the turns that belong in directions to the door.'
  chekhov_badenweiler:
    name: A reply to Villa Friederike
    place: Badenweiler
    figure: Anton Chekhov
    story: In June 1904 Anton Chekhov, forty four and gravely ill with tuberculosis, came with his wife Olga Knipper to the spa of Badenweiler in the Black Forest. They stayed first at the Hotel Römerbad, then in the Villa Friederike, then at the Hotel Sommer, next to the post office. He wrote cheerful letters home, and in July asked friends which steamer could take them back to Russia by sea. He died there early on 15 July.
    story_prose:
      opening:
        - Badenweiler, a spa in the Black Forest, June 1904. Anton Chekhov is forty four and gravely ill with tuberculosis; he has grown thin in Moscow and is short of breath. He and his wife Olga Knipper have come all the way from Russia by train, and they take rooms first at the Hotel Römerbad, both worn out.
        - In history, they moved on to the Villa Friederike, then to the Hotel Sommer next to the post office. His letters home were cheerful, and on 11 July he wrote to ask which steamer could take them back to Russia by sea. He died there early on 15 July. In this branch, the maid of the villa moves a deck chair after the sun, and the postman outside the post office can lift a Russian letter and tell whether it has stamps enough.
        - 'Three kinds of people can help on this trip: someone careful who can keep letters and addresses safe, someone patient enough to press a string of questions into one short telegram, and someone who knows medicine and comes with a nano kit.'
      outcomes:
        all: When that summer was over, Chekhov and Olga sailed back to Russia. The wind was strong on deck, and he did up the buttons of the flannel suit one by one.
        p3: After the summer Chekhov and Olga set out for Russia. On the platform he wore the flannel suit.
        p2: The thin sheet of the telegram stayed spread on the writing table, the line about the cabin rubbed soft by his fingers.
        p1: Maria received the letter. On the back of the envelope was the address of the Villa Friederike, every letter of it right.
      none: July in Badenweiler was hot. The deck chair on the balcony followed the sun all day and was moved back at evening.
      desync: When {staff} was recalled, the writing table was already bare. Maria still did not know where her brother was staying.
      not_admitted: '{staff} never got into the villa. The sun lay on the garden until seven in the evening, and upstairs a man wrote a few lines of a letter and had to rest.'
      points:
        p1: On 25 June, the third day in the Villa Friederike, Chekhov sat at the writing table and wrote to Maria, resting after every few lines. {staff} checked the return address at the end of the letter one letter at a time, and the street and the house number both came out right. Chekhov signed at the foot of the letter, laid down the pen, leaned back in his chair and looked out of the window, catching his breath.
        p2: 'On 11 July the room was as hot as a steam bath. In his letter Chekhov asked point by point: on which day and at what hour the steamer left, how many days it took, whether there could be a cabin for two. {staff} pressed the questions into one short telegram and sent it to someone who knew the route. When the reply came, the sailing day, the days at sea and the cabin were all written on one thin sheet. Olga read it to him, and when she reached the line about the cabin, he asked her to read it again.'
        p3:
          class_learned: '{staff} first did as the old way of diagnosis has it, listening to his chest and counting his breaths, and only then opened the nano kit, set the dose by his weight, and looked in on him every morning and every evening. In the July heat he coughed less. After ten days or so he could walk back from the balcony into the room by himself and sit down at the writing table. Olga brought the flannel suit back from Freiburg; he put it on and stood a while before the mirror.'
          else: '{staff} opened the nano kit, made up the doses compartment by compartment as the instructions said, kept to the hours at the bedside giving the medicine and taking his temperature, and at night looked in on his breathing every little while. In the July heat he coughed less. After ten days or so he could walk back from the balcony into the room by himself and sit down at the writing table. Olga brought the flannel suit back from Freiburg; he put it on and stood a while before the mirror.'
      excerpts:
        p3: After ten days or so he could walk back from the balcony into the room by himself and sit down at the writing table. Olga brought the flannel suit back from Freiburg; he put it on and stood a while before the mirror.
        p2: When the reply came, the sailing day, the days at sea and the cabin were all written on one thin sheet. Olga read it to him, and when she reached the line about the cabin, he asked her to read it again.
        p1: '{staff} checked the return address at the end of the letter one letter at a time, and the street and the house number both came out right. Chekhov signed at the foot of the letter, laid down the pen, leaned back in his chair and looked out of the window, catching his breath.'
    relic: A pince nez
    relic_desc: Small round spectacles on a cord.
    points:
      p1: Just after Chekhov settles in, check the return address on his letter to his sister Maria and get it out while he still has the strength to finish it
      p2: Turn the questions in his July 11 letter into a short telegram to someone who knows the route. Give him an answer while he is still in Badenweiler
      p3: Cure his tuberculosis, so that he and Olga can set out for Russia together
    points_fail:
      p1: The luggage is still being handled under the old hotel’s arrangements. The unfinished letter goes with it. Maria receives no address from the villa, and the office recalls the employee.
      p2: His questions about sailing dates, a cabin and the length of the crossing go out by ordinary mail. While he waits, he has no answer to read.
      p3: Early on 15 July Chekhov died in Badenweiler, at forty four.
    shift:
      p1:
        was: On June 25, 1904 (June 12 in the Russian calendar), Chekhov wrote to Maria from Badenweiler with the full return address at Villa Friederike.
      p2:
        was: On 11 July 1904 Chekhov asked Rossolimo about sailing from Marseille to Odessa. He died in Badenweiler on July 15 and never made that journey.
        now: A reply by telegram gives the departure day, the length of the crossing and a cabin for two. Chekhov and his wife read it at the hotel and talk through which sailing they would choose if they could leave.
      p3:
        was: On 15 July 1904 Chekhov died of tuberculosis in Badenweiler, at forty four.
        now: His lungs healed, and after the summer he and Olga sailed home to Russia. He went on writing for years and was back at the Moscow Art Theatre for rehearsals.
        who: chekhov_badenweiler
        bio: Chekhov was cured of tuberculosis in Badenweiler, went home to Russia in the autumn of 1904, and wrote stories and plays for many years more.
    vignettes:
      garden: On 27 June {staff} helps the maid of the Villa Friederike carry a deck chair round the garden after the sun. She says the sun leaves the lawn at seven exactly, and in this house they set the supper by it, not by the clock in the hall.
      post: On 7 July {staff} sits on the bench outside the post office next to the Hotel Sommer. The postman says that in summer the Russians write the most letters of anyone in Badenweiler, and the English the shortest; he can lift a Russian envelope and tell whether it will need another stamp.
      ice: On 10 July, in the worst of the heat, {staff} helps the porter of the Hotel Sommer carry a block of ice up from the cellar in a sack. The porter says the Black Forest has not had a July like it in twenty years, and the ice man from Müllheim has started charging by the stair.
  puccini_brussels:
    name: The unfinished duet
    place: Brussels
    figure: Giacomo Puccini
    story: Puccini went to Brussels for treatment in November 1924 with the ending of Turandot still unfinished. The pen stops in the middle of a thought on one sketch. On another, there is a list of instruments. Franco Alfano later had to turn such fragments into something an orchestra could play.
    relic: A sketch for the duet
    relic_desc: A leaf of music paper with a pencil note beside an unfinished passage.
    points:
      p1: Help Puccini put the two alternative sketches for the final duet in order of preference while he can still weigh them
      p2: Put your experience in care to work so Puccini can spend the last night free of the worst of his discomfort
    points_fail:
      p1: The sheets remain separate. Whoever takes over will still have to choose between them.
      p2: At the end of the night, the chair beside the bed is still empty and the discomfort has not eased.
    shift:
      p1:
        was: In November 1924 the final duet still existed in fragments. Alfano later had to work out how to join what had survived.
        now: Puccini marks which alternative he wants when the music changes at the end of the duet. The composer who takes over can start from that choice.
      p2:
        was: On 24 November 1924 Puccini underwent treatment for throat cancer in Brussels. He died in the same clinic on 29 November.
        now: '{staff} sits beside Puccini and helps him settle. The night he had been dreading passes with less pain and someone close enough to see when he needs help.'
        who: puccini_brussels
        bio: Puccini spent a quieter final night in Brussels. He had someone beside him when he put the score aside.
    vignettes:
      divider: The copyist puts two pencilled measures side by side on the desk. They look almost the same until {staff} traces the bass with a finger. One comes back to where it started. The other leaves room for what follows. {staff} keeps both on the desk for Puccini to see.
      future: '{staff} catches themself tapping the ending they know from the theatre. The copyist looks up from a bar that has no ending yet. {staff} turns the page back and asks to start at the last measure both of them can read.'
      pin: The copyist clears a corner of the desk for a cup. {staff} moves one manuscript leaf a little farther in from the edge. At the bottom of the leaf, below a nearly empty stave, two words have been squeezed into the margin.
  schumann_endenich:
    name: The tune in another key
    place: Endenich
    figure: Robert Schumann
    story: A copy of a short piano piece survives from Robert Schumann’s years in Endenich. He set it a whole tone lower than the published score. In July 1856, Clara Schumann came to Bonn and asked to see him. At the guesthouse, Lina has copied the tune twice. She thinks the lower one is a mistake.
    relic: A practice score in two keys
    relic_desc: A fictional pair of practice copies with a separate key marked on each.
    points:
      p1: Compare the two copies and jot down why the one starting a tone lower also belongs in the folder
      p2: Keep Clara’s visit on 27 July on schedule by meeting her before the appointed hour and showing her to the right door
      p3: On 29 July, stay within call and bring Clara back to the bedside before Robert dies
    points_fail:
      p1: Lina sets the lower version aside. The next person opening the folder will see only the version in the published key.
      p2: Clara waits at the wrong door and misses the visiting hour. The office recalls you when this visit falls out of the timeline.
      p3: When Clara gets back to Endenich, Robert has already died.
    shift:
      p1:
        was: Schumann’s autograph of Papillon No. 10 from the Endenich years transposes the piece from C major to B-flat major.
        now: Lina keeps both practice copies together. At the top of each one she writes the key, so the next player knows that neither first note is a copying error.
      p2:
        was: On 23 July, Brahms and Dr Richarz urged Clara to wait. She visited Robert on 27 July between six and seven in the evening.
      p3:
        was: On 29 July Clara returned to Endenich with Brahms and Joseph Joachim after Robert had died.
        now: '{staff} meets Clara on her way back and brings her straight to the room. She takes Robert’s hand before he dies.'
        who: schumann_endenich
        bio: At Endenich, Clara was beside Robert when he died on 29 July 1856.
    vignettes:
      key: Lina starts from the first note in each copy. Before she reaches the end of the second bar she looks up at {staff}. She knows what comes next, even though her fingers are somewhere else on the keyboard.
      envelope: Emil has promised to take a folded note out to Clara if she is made to wait again. He asks {staff} which door to try first. They cross to the side of the lane where he can see both.
      gift: The real manuscript will eventually go to Schumann’s daughter Marie. Here at the guesthouse, Lina leaves two paper slips to mark the starts of her practice copies. When {staff} lifts the lid, one slip has slipped behind the other.
  nietzsche_turin:
    name: The address on the back
    place: Turin
    figure: Friedrich Nietzsche
    story: The letter from Turin is addressed to Franz and Ida Overbeck. Nietzsche signed it Dionysus. When Franz arrives at his friend’s lodging, he finds him reading the corrected proofs of Nietzsche contra Wagner. By the time they leave Turin, someone will have to decide what goes into the case with the proofs.
    relic: A duplicate luggage label
    relic_desc: A duplicate luggage label from the game’s timeline, with a recipient on the back.
    points:
      p1: Check the lodging address and get Overbeck to the right door on 8 January
      p2: Record the corrected proofs separately from the personal letters so each bundle can be handed over without opening the other
    points_fail:
      p1: Overbeck is directed to the wrong lodging, and the office recalls the employee when the meeting slips out of the timeline.
      p2: The letters and proofs go into the same wrapper. The first person looking for the corrections will also see the names on the letters.
    shift:
      p1:
        was: Nietzsche wrote to the Overbecks from Turin. Franz Overbeck arrived there on January 8, 1889, to find him.
      p2:
        was: Overbeck later recalled that Nietzsche was reading the last proofs of Nietzsche contra Wagner when he arrived.
        now: The proofs and the letters travel in separate wrappers. Overbeck can find the corrections at a glance without breaking the other seal.
    vignettes:
      address: Pietro has copied Dionysus into the destination line of his inventory. {staff} turns the slip to show him the names of the recipients. He draws one line through what he wrote, lightly enough that he could still read it back.
      privacy: Lucia asks {staff} to hold the bag while she wraps the papers. Someone on the stairs asks whose they are. She turns the label to the wall before she answers.
      stairs: From the landing, {staff} hears the rustle of a page. Then someone knocks below, and Pietro puts the blank luggage label on the stair rail where he can find it again.
  sophie_germain_paris:
    name: A paper for Berlin
    place: Paris
    figure: Sophie Germain
    story: Sophie Germain exchanged work on number theory with Carl Friedrich Gauss, at first signing her letters Le Blanc. In 1816 the Academy of Sciences awarded her a prize for her work on vibrating plates. She kept working after falling ill in 1829. The seventh volume of Crelle’s journal in Berlin carried her memoir on the curvature of surfaces under her own name. She died in Paris on 27 June 1831.
    relic: A letter signed Le Blanc
    relic_desc: A letter to Gauss in a borrowed name.
    points:
      p1: While she is ill, keep her memoir on the curvature of surfaces on its way to Crelle's journal in Berlin
      p2: Ease the pain of the cancer in her last months in Paris
      p3: Let Germain know before she dies that Gauss has asked Göttingen to give her an honorary degree
    points_fail:
      p1: The memoir stays unfinished on her desk and the 1831 volume appears without it. This branch falls out of step with history and the office recalls the employee.
      p2: Nobody eases the pain, and in this branch her last months are as hard as they were.
      p3: No word reaches her, and she dies without knowing what Gauss had done for her.
    shift:
      p1:
        was: In 1831 Germain's memoir on the curvature of surfaces appeared in volume 7 of Crelle's journal, the year she died.
      p2:
        was: From about 1829 Germain was ill with breast cancer; she went on working and died in Paris on 27 June 1831.
        now: '{staff} keeps the pain down with modern medicine and sits with her in the worst hours. She suffers less in her last months and keeps working at her desk.'
      p3:
        was: Gauss had urged the University of Göttingen to give Germain an honorary degree; when she died on 27 June 1831 it had not been conferred.
        now: '{staff} brings her word of what Gauss has done. Germain hears that the university she could never attend means to honour her.'
        who: sophie_germain_paris
        bio: In this timeline Germain learned before she died that Gauss had put her forward for an honorary degree at Göttingen. The degree itself still came too late.
    vignettes:
      water: On 7 March {staff} helps a water carrier haul two buckets of Seine water up five floors of a house in the rue de Savoie. Counting the steps between breaths, he says the houses of Paris get taller every year, and he is still paid by the bucket, not by the floor.
      quai: In the middle of April {staff} leafs through an old almanac at a bookseller's stall on the quay. The bookseller says the whole pile came from one household, the margins full of sums he cannot follow, so he sells them by the weight.
      wash: Late in May {staff} helps a washerwoman wring sheets on a wash boat by the river. She says the Seine has risen and fallen all spring, the boat goes up and down with it, and so does her back.
  bizet_paris:
    name: The year of Carmen
    place: Paris
    figure: Georges Bizet
    story: In the last weeks of rehearsal for Carmen the orchestra called parts of the score unplayable and the chorus balked at acting while it sang. The opera opened at the Opéra-Comique on 3 March 1875 to cold notices, and Bizet believed it had failed. At the end of May he swam in the Seine at Bougival, fell ill, and died on 3 June, at thirty six.
    relic: A fan
    relic_desc: A painted paper fan from the stalls.
    points:
      p1: When the orchestra calls passages unplayable and the chorus will not act as it sings, rehearse them through it and hold the premiere of 3 March
      p2: When the cold notices after the premiere have sunk Bizet into gloom, let him know that Carmen will go on being played in theatres everywhere
      p3: Stop the fever that follows his swim in the Seine at Bougival from reaching his heart, and save Bizet at thirty six
    points_fail:
      p1: The rehearsals stall and the theatre cannot raise the curtain on 3 March. The branch drifts out of sync, and the office recalls the employee.
      p2: In this branch Bizet goes on believing that Carmen has failed, and spends the spring low in spirits.
      p3: In this branch Bizet still dies at Bougival in the early hours of 3 June, at thirty six.
    shift:
      p1:
        was: 'Winter 1875: in rehearsal the orchestra called parts of Carmen unplayable and the chorus resisted moving while it sang. The opera opened at the Opéra-Comique on 3 March 1875.'
      p2:
        was: Carmen opened on 3 March 1875 to a largely hostile press; Bizet was convinced it had failed and stayed low in spirits through the spring.
        now: '{staff} tells Bizet at the end of March that this opera will be played in theatres in many countries. He goes on attending the performances, and the spring weighs less on him.'
      p3:
        was: At the end of May 1875 Bizet swam in the Seine at Bougival and fell ill with a high fever; after a heart attack on 1 June he died in the early hours of 3 June, at thirty six.
        now: The fever of June passed and Bizet spent the rest of the summer recovering at Bougival. In the autumn he went to Vienna to see Carmen at the Court Opera, and he went on writing for the theatre for many years.
        who: bizet_paris
        bio: Bizet survived the illness of the summer of 1875. He saw Carmen staged in Vienna that autumn and kept writing operas for years after.
    vignettes:
      future: You tell the attendant that later audiences will know this opera in cities he has never visited. He asks why he should keep an extra programme tonight. You show him where the first night and Galli-Marié’s name are printed. One copy goes into his drawer. You leave before it gets a second reader.
      label: The attendant has filed two sheets under the same title. You split them by date and mark the first night on a spare wrapper. A later reader can now ask for the right sheet. You miss the audience coming out.
      seat: You lend a programme to a late visitor and get it back at the door after the visitor has found the seat. You copy one name onto your own slip. By then the music inside has moved on.
  modigliani_paris:
    name: A label behind the portrait
    place: Paris
    figure: Amedeo Modigliani
    story: At the end of May 1919 Amedeo Modigliani and Jeanne Hébuterne came back to Paris from Nice, with the daughter born the November before. His tuberculosis was getting worse, and by the autumn he no longer had the strength to paint. On 24 January 1920 he died of tuberculous meningitis at the Charité hospital in Paris, aged thirty five. Two days later Jeanne, eight months pregnant, died at her parents' home. His fellow painters collected the money for his funeral on 27 January. His only solo exhibition in his lifetime, two years earlier, had been a commercial disappointment.
    relic: A charcoal stick
    relic_desc: A stub of charcoal black to the fingers.
    points:
      p1: While he is still clear-headed, let him know that the people he painted will be remembered by many
      p2: When he lies ill in the studio and nobody has called for days, make sure he is taken to the Charité hospital
      p3: At the Charité, cure his tuberculous meningitis
      p4: In the days after his death, stay with Jeanne Hébuterne, eight months pregnant, so that she and the child live
    points_fail:
      p1: In this branch nobody tells him what will become of his portraits after the disappointing reception at his only solo exhibition.
      p2: In this branch nobody comes through the door in time and he is not taken to the Charité. The branch falls out of step with history and the office recalls the employee.
      p3: In this branch the illness runs as it did. He dies at the Charité on 24 January, aged 35.
      p4: In this branch 26 January happens as it did. Jeanne and the child she is carrying do not live.
    shift:
      p1:
        was: On 3 December 1917, the police intervened at Modigliani's only solo exhibition in his lifetime. The show did poorly.
        now: '{staff} tells him, before he falls ill, that the people he painted will hang in museums around the world.'
      p2:
        was: In January 1920 Modigliani, gravely ill, was taken to the Charité hospital in Paris, where he died on 24 January.
      p3:
        was: On 24 January 1920 Modigliani died of tuberculous meningitis at the Charité hospital in Paris, aged 35.
        now: '{staff} brings a medicine that cures him. He leaves the hospital and goes back to the studio.'
        who: modigliani_paris
        bio: Modigliani recovered in the winter of 1920 and painted for many more years, still painting the people around him.
      p4:
        was: On 26 January 1920, two days after Modigliani's death, Jeanne Hébuterne, eight months pregnant, died at her parents' home, leaving a daughter of fourteen months.
        now: '{staff} stays at her side through those days. In this timeline Jeanne gives birth to the child, raises her son and daughter, and later takes up painting again.'
        who: jeanne_hebuterne
        bio: Jeanne Hébuterne lived through the winter of 1920, gave birth to her second child, raised both children and went on painting.
    vignettes:
      coal: On 10 January {staff} carries a sack of coal up the stairs for the coal man of the street, who sells wood, coal and wine from the same counter. He says this winter nobody in Montparnasse buys a whole sack; they buy half, and pay for the other half in promises.
      saucers: 'Early in February {staff} helps a waiter in a Montparnasse café clear the tables. Each drink comes on its own saucer and the bill is counted from the stack. He points at the back table: the painters build towers of saucers there, and pay in drawings when the money runs out.'
      mimosa: In early March {staff} helps a flower seller at the market untie the first bunches of mimosa. She says they came up from the south on the night train, and in a cold March they are the only yellow in Paris.
  boole_ballintemple:
    name: Wet clothes and a lecture
    place: Ballintemple, Cork
    figure: George Boole
    story: It is raining in Cork, and George Boole has a class to teach. A student is still puzzling over an exercise from The Laws of Thought. Across town, a table in Boole’s unfinished work on differential equations will eventually have to be calculated again, all because of one sign.
    story_prose:
      opening:
        - Cork, Ireland, November 1864. George Boole is the first professor of mathematics at Queen’s College. Ten years ago, in The Laws of Thought, he wrote the laws of reasoning in algebra, and one of them says that choosing twice by the same condition leaves the choice unchanged. He still has a book on differential equations unfinished.
        - In history, on 24 November he went from his home to the college through heavy rain to teach. On 8 December he died of pleuro-pneumonia at his home in Ballintemple. The next year Todhunter put together the supplement, and wrote in the preface that the table at the end of the book had been recalculated by Sephton because of a wrong sign in a formula. In this branch, a student clutching numbered slips is still wondering which slip will drop out when he chooses a second time by the same condition.
        - 'Three kinds of people can help on this trip: someone punctual who will carry the lecture notes through the rain, someone who can check a formula and find the error, and someone who knows nursing and can take over a night watch.'
      outcomes:
        all: On those December nights the lamp in Boole’s house burned until morning, and one watch followed another. The paper marker was still in its place the next year.
        p3: On those nights the lamp in Boole’s house burned until morning, and one watch followed another.
        p2: The next year the editor opened the folder, and the paper marker was still in its place. Sephton began his calculation from that sign.
        p1: At the lecture on 24 November, not one page of the notes on the desk was wet.
      none: The rain went on into December. In the house at Ballintemple, the people at the bedside did not close their eyes all night.
      desync: The rain that day soaked the lecture notes into a pulp, and the lectern stood empty. {staff} was recalled by the office before the next lecture.
      not_admitted: '{staff} never got through the college door. The rain kept falling, and the lecture notes still lay on the table in Boole’s house.'
      points:
        p1: On 24 November the rain was heavy. Before Boole left the house, {staff} wrapped the lecture notes in two layers of oilcloth, carried them under a coat to the college ahead of him, and put them in the drawer of the lectern. When Boole came in his coat was dripping, and he pulled open the drawer to find the notes dry. He spread them out, wiped his hands on his cuff, and began.
        p2: '{staff} laid the table beside the formula that produced it and worked back line by line. At one place the numbers would not agree; traced upward, the fault was a sign in the formula written the wrong way round. {staff} did not alter the manuscript, only slipped a paper marker into that page, noting which line and which sign.'
        p3: Early in December Boole fell ill at home, and his family took turns at his bedside, several nights without sleep. {staff} took over the night watch as nursing requires, turning him on time, giving him water, tucking in the blanket, and writing down on a sheet each thing that happened in the night. The family left the lamp burning and went to sleep for a few hours. When they came back before dawn, the fire was still going well, and the sheet at the bedside was filled with the hours of the night.
      excerpts:
        p3: The family left the lamp burning and went to sleep for a few hours. When they came back before dawn, the fire was still going well, and the sheet at the bedside was filled with the hours of the night.
        p2: At one place the numbers would not agree; traced upward, the fault was a sign in the formula written the wrong way round. {staff} did not alter the manuscript, only slipped a paper marker into that page, noting which line and which sign.
        p1: When Boole came in his coat was dripping, and he pulled open the drawer to find the notes dry. He spread them out, wiped his hands on his cuff, and began.
    relic: A page of logic
    relic_desc: A classroom exercise showing what happens when the same selection is applied twice.
    points:
      p1: Get the lecture notes to the college dry before Boole sets out in heavy rain, and keep his class on schedule
      p2: Compare the table with the formula that produced it and flag the sign for the next person who checks the manuscript
      p3: Find someone to cover the evening watch so the family at Boole’s bedside can take a break
    points_fail:
      p1: The notes are soaked and nobody has a duplicate. The class is missed, and the office recalls the employee.
      p2: The table goes into the folder with the formula unchecked. Sephton will have to trace the error later.
      p3: The family keeps the evening watch without relief. One of them leaves the room only long enough to set the lamp down.
    shift:
      p1:
        was: University College Cork records that Boole walked from home to teach in heavy rain on November 24, 1864.
      p2:
        was: Boole died in December 1864. Todhunter prepared the supplement. His preface records a table recalculated after a sign error in the manuscript.
        now: When the editor opens the folder, a paper marker takes him straight to the formula. Sephton can start by checking its sign.
      p3:
        was: Boole died of pleuro-pneumonia at home in Ballintemple on 8 December 1864.
        now: '{staff} finds someone who can take the chair for the evening. The family leaves the lamp burning and gets a few hours of rest before coming back.'
    vignettes:
      repeat: '{staff} asks the student to pick out the even numbers, then to do it again with the slips in hand. The student looks for one to put down. There isn’t one.'
      border: The student is about to write down a row of numbers when {staff} asks how they got the first one. The student draws a line back to the formula before copying the rest.
      example: The student slides the finished exercise under a book to keep it flat. At the edge of the page, a paper marker sticks out just far enough to take hold of.
  wallace_ternate:
    name: An essay from Ternate
    place: Ternate
    figure: Alfred Russel Wallace
    story: In February 1858, after a bout of fever in the Moluccas, Alfred Russel Wallace wrote an essay on how varieties depart from their original type. It bears the date and place February 1858, Ternate. On 25 March Wallace sailed from Ternate with a party that included the young hunter Jumaat. They reached Dorey on the coast of New Guinea. The essay went to Charles Darwin in England; on 1 July it was read alongside Darwin’s work in London, with neither author in the room.
    relic: A beetle in a pin box
    relic_desc: A collected beetle in a small tin box.
    points:
      p1: In the days of the malaria, see the essay through to its end
      p2: Heal the ankle he hurt at Dorey before it turns to an ulcer
      p3: Save the young hunter Jumaat from the fever and the dysentery
    points_fail:
      p1: The fever never broke and the draft was not finished in February. The letters the mail boat took did not hold it, and in this branch the Linnean Society had no such paper on 1 July.
      p2: The wound festered as history has it, and he sat in the hut on a crutch for more than a month. In this branch the insects of the Dorey forest were still caught only by his servants.
      p3: Jumaat died on 26 June as history has it, and in this branch the boat that left Dorey in July went without him.
    shift:
      p1:
        was: In February 1858, as soon as the malaria eased, Wallace wrote the paper and signed it Ternate.
      p2:
        was: In May 1858 Wallace hurt his ankle at Dorey; the wound turned to an ulcer and kept him off his feet for over a month.
        now: The wound did not fester, and in the days the steamer was in port he went into the forest every day as before.
      p3:
        was: On 26 June 1858, Jumaat, a youth of about eighteen, died at Dorey; Wallace wrote of him as a quiet lad who did his work well.
        now: '{staff} sat with him until the fever fell and the illness stopped, and when they left Dorey at the end of July he was on the boat too.'
    vignettes:
      places: '{staff} copies the labels of the day''s birds and writes the island beside each one, so that the drawer of skins can be read without its collector.'
      claim: '{staff} sorts a tray of beetles from two islands that look alike, and keeps them in two rows with a gap between, without being asked.'
      mail: '{staff} folds the pages of a long letter inside oiled paper and ties it with a double knot, as a sailor does with a chart.'
  hooke_london:
    name: The curator of experiments
    place: London
    figure: Robert Hooke
    story: A reader brings out Hooke’s old Micrographia and tries to copy the cork. The edges in the drawing soon turn into a neat honeycomb that Hooke never saw. In the same room are bundles of lectures and demonstrations. Someone who opens one years from now will have to tell a missing page from a blank one.
    relic: A drawing of a flea
    relic_desc: A copy of the folding engraving of a flea from Micrographia.
    points:
      p1: Keep the lectures together as the bundles are moved, so Waller will still be able to gather them for his edition
      p2: File a list of the bundles outside the lectures, with enough detail for a later editor to find them
      p3: Show Hooke the reader’s tracing while he is still there to look at it, and ask which lines should be left open
    points_fail:
      p1: One bundle of lectures is taken away with loose papers. Waller can no longer assemble the collection, and the office recalls the employee.
      p2: The next editor can tell what went into print. Nothing on that list points to the papers elsewhere.
      p3: The tracing stays in the book. The reader has already filled in the lines and will not get to ask where they belong.
    shift:
      p1:
        was: Hooke died in 1703. Richard Waller prepared the collection of posthumous works published in 1705.
      p2:
        was: Waller’s book preserved some of the papers. Parts of Hooke’s diaries and other work appeared later through other editors.
        now: A second list goes into the chest. Someone looking for the demonstrations that did not go to print can start by asking for a bundle that has a name.
      p3:
        was: In Micrographia Hooke compared the pores of cork to a honeycomb and pointed out that their shape was irregular.
        now: '{staff} sets the tracing beside the old plate. The reader leaves two lines open after Hooke points to where the copied pattern ceases to match the plate.'
    vignettes:
      edge: The reader follows two lines around a pore, then joins them with a third that is absent from the plate. {staff} holds the tracing to the window. The invented line is the straightest one on the sheet.
      analogy: '{staff} asks the reader to find a cell that would not fit the comb they drew at the top of the page. Soon they are both pointing to the same crooked edge.'
      plate: When the reader opens another fold, a flea takes up almost the whole desk. {staff} holds one corner down while the reader moves the ink out of the way.
  leavitt_cambridge_ma:
    name: A rule for the stars
    place: Cambridge, Massachusetts
    figure: Henrietta Leavitt
    story: Harvard’s 1912 circular lists twenty-five variable stars from the Small Magellanic Cloud in order of period. Leavitt plotted their brightest and faintest readings separately. In both plots, the stars that took longer to repeat their cycles were brighter.
    relic: A glass plate
    relic_desc: A photographic plate crowded with tiny stars.
    points:
      p1: Match the measurements of faint stars to their plates before printing and protect Leavitt's table of twenty-five periods
      p2: Use the circular's unresolved calibration to win observing time for Leavitt to take part in the next step
    points_fail:
      p1: Rows whose plate references cannot be checked are cut and the table of twenty-five periods does not appear. The office recalls the employee after a loss of sync.
      p2: The period and brightness relation survives, and its absolute calibration is taken up elsewhere.
    shift:
      p1:
        was: On 3 March 1912 Harvard Observatory Circular 173 published Leavitt's periods for twenty-five variables in the Small Magellanic Cloud.
      p2:
        was: In 1913 the first calibration used Cepheids in the Milky Way.
        now: '{staff} submits a request for observing time with the candidate list attached. Leavitt gets time to check the new measurements with the team when they come in.'
        who: leavitt_cambridge_ma
        bio: Leavitt continued working on stellar brightness and took part in applying her relation to distances. She left her own observing notes on the calibration.
    vignettes:
      rank: A blank star number breaks the sequence. {staff} reads the period aloud while the copyist searches the plate log. The dots stay where they are until the number is found.
      distance: '{staff} holds the two plots side by side. The copyist has changed the scale on one sheet. They recopy the axis before comparing the dots.'
      period: The copyist calls out a brightness and reaches for the next row. {staff} lays a ruler underneath the old row until its period has been copied too.
    remarks:
      trait_methodical: '{staff} checks the number once more before returning the plate to its sleeve.'
  bessie_coleman_jacksonville:
    name: Her name before takeoff
    place: Jacksonville
    figure: Bessie Coleman
    story: Bessie Coleman earned an international pilot’s licence in France on 15 June 1921. On 30 April 1926, she died during a practice flight at Paxon Field in Jacksonville, ahead of a May Day event.
    relic: A dated printer’s proof
    relic_desc: A fictional ground crew notice, with Coleman’s name in full.
    points:
      p1: Keep the air show preparations from displacing Coleman's visits with Jacksonville students
      p2: Help Coleman and the teachers set up a follow-up lesson while the students are still asking about flying
      p3: While she lectures in Florida to raise money, help Coleman gather enough pledges to open the flight school for Black students she has been saving for
      p4: Use the fault found during the ground check to stop the Paxon test flight and keep both aviators on the ground
    points_fail:
      p1: The organizers drop the visits to make up time. The branch falls out of sync and the office recalls the employee that day.
      p2: The students go home with their questions and no teacher has agreed to a follow-up lesson.
      p3: The lecture fees come in a little at a time, and in this branch the flight school is still only a plan.
      p4: The old aircraft takes off as planned. Coleman and the pilot die on the practice flight.
    shift:
      p1:
        was: On 29 April 1926, Coleman visited students at Jacksonville's Black public schools.
      p2:
        was: On 29 April 1926, Coleman visited the schools, and the next day she died on a practice flight.
        now: '{staff} asks a teacher to collect the questions and set aside a lesson on how to learn to fly.'
      p3:
        was: In 1926 Coleman was touring Florida with lectures and exhibitions to raise money for her own school for Black fliers; she wrote to a sister that she would at last earn enough to open it, and died before it opened.
        now: '{staff} helps her set the pledges of the Jacksonville audiences down on one list. By May she has enough promised to rent a field and a training aircraft.'
      p4:
        was: On 30 April 1926, Coleman and the pilot died in a practice flight accident at Paxon Field.
        now: '{staff} has the ground crew double-check the controls. They find a fault and call off the flight, and Coleman goes on speaking to Black students about aviation.'
        who: bessie_coleman_jacksonville
        bio: After Jacksonville, Coleman kept flying and continued working to open flight training to Black students.
    vignettes:
      proof: Ann is short a line and has cut the pilot’s given name. You trade out two words of puffery to free the space. At pickup, she makes the runner read the full name once before folding the proof. He can now tell someone who will fly without saying only that it is a woman.
      school: Lewis thinks the crowd wants nothing but the show time. A child near the fence asks where the pilot learned. You tell Lewis where the licence was issued and let him use the last line for a fact he can repeat. When he takes the proof, he practises saying the date as well as the place.
      ground: The field is filling and you know the next day’s notice will no longer describe the same show. Ann asks whether she should hand out the proof now. You keep one dated copy and help her send the others to the gate. Your visit ends on the ground, with the spectators still arriving.
  scott_last_camp:
    name: The tent on the ice shelf
    place: Ross Ice Shelf
    figure: Robert Falcon Scott
    story: Scott's final diary entry is dated 29 March 1912. The surviving manuscript records the party's last camp during its return from the South Pole. The reading scene is imagined after the return of the papers.
    relic: A diary
    relic_desc: A small pencilled diary, stiff with cold.
    points:
      p1: In a March of short fuel and failing strength, keep the diaries and the rock specimens from the Beardmore Glacier on the sledge
      p2: Heal Oates's frostbitten feet so he can keep up with the party and does not walk out of the tent around 16 March
      p3: Before 18 March, save Scott's right foot from the frostbite that slows the whole party
      p4: Bring the three men through the blizzard that begins on 21 March and across the last eleven miles to One Ton Depot
    points_fail:
      p1: The specimens are left on the ice shelf and the diaries do not reach the last day. This branch falls out of step with history and the office recalls the employee.
      p2: His feet get worse each day, and in this branch too he walks out into the drift around 16 March and does not come back.
      p3: The foot freezes, and in this branch, as in history, the march slows to a crawl.
      p4: The blizzard holds the tent where it is, and after 29 March the diary has no new page.
    shift:
      p1:
        was: In March 1912, short of fuel on the way back, the party kept the diaries and the Glossopteris fossils from the Beardmore Glacier on the sledge; the search party found them with the tent on 12 November.
      p2:
        was: In early March 1912 Oates's feet were badly frostbitten and he slowed; on 16 or 17 March he walked out of the tent and was not seen again.
        now: '{staff} warms his feet and changes his socks every night and the frostbite gets no worse. Oates keeps pace beside the sledge and is still with the party at the last camp.'
      p3:
        was: On 18 March 1912 Scott wrote that nearly all the toes of his right foot were gone, and the march slowed further.
        now: '{staff} warms and wraps his right foot at every camp. Scott keeps the foot, and the party goes on north at its old pace.'
      p4:
        was: From 21 March 1912 a blizzard held Scott, Wilson and Bowers in their tent eleven miles from One Ton Depot; the last diary entry is dated 29 March, and the search party found the tent on 12 November.
        now: '{staff} leads the three men north in a lull of the wind and breaks the last eleven miles into short stages. They find fuel and food at One Ton Depot and outlast the blizzard. Before the winter they are back at Cape Evans.'
        who: scott_last_camp
        bio: In this timeline Scott came back alive from the Pole with Wilson and Bowers and reached Cape Evans. He returned to Britain and edited the diaries and the scientific results of the expedition himself.
    vignettes:
      distance: Back at the Agency, the fictional clerk copies a distance into a column headed as distance travelled. You show them that it was the distance still to go. They move the entry before filing the copy.
      blank: Back at the Agency, the clerk stops at the final date. You wait while they decide how to mark the blank beyond it. They write that the record ends here, then put the pencil down.
      opening: Back at the Agency, you open the practice copy and read the date before the story. The clerk puts the same date on the cover slip so the pages can be found in order again.
  mallory_everest:
    name: Last seen climbing
    place: Mount Everest
    figure: George Mallory
    story: Mallory's surviving letters from the 1924 expedition describe conditions and plans at different camps. The fate of Mallory and Irvine does not establish whether they reached the summit.
    relic: An ice axe
    relic_desc: A plain wooden ice axe with a worn head.
    points:
      p1: When Somervell chokes on the descent, help him get his breath back and see the attempt he made with Norton end safely
      p2: Cure Norton of his snow blindness
      p3: Get the compass Mallory left at Camp V into his hands
      p4: Turn Mallory and Irvine back, or meet them on the way down, so that both reach the North Col alive
    points_fail:
      p1: Somervell sits down in the snow and does not get up. Only one of the two climbers comes back. This branch has come loose from history, and the office recalls the employee.
      p2: Norton's eyes hurt too much to open, and for the next days he sees nothing.
      p3: The compass is still in the tent at Camp V. When the two climb on 8 June, they do not have it.
      p4: Some time after noon on 8 June Odell last sees the two high on the ridge, still climbing. They do not come back.
    shift:
      p1:
        was: On 4 June 1924 Norton and Somervell set out from Camp VI and reached about 8,570 m; on the way down Somervell's throat was blocked by frostbitten tissue and he nearly choked, coughed it up, and both reached camp.
      p2:
        was: On the night of 4 June 1924 Norton went badly snow blind and could hardly see after he got back to the North Col.
        now: Norton's eyes had cleared by the next day, and he could see the people coming and going on the North Col.
      p3:
        was: On 7 June 1924 Mallory sent a note down from Camp VI to Odell saying he had left his compass in the tent at Camp V and they were without one.
        now: When they set out early on 8 June, Mallory had his compass in his own pocket.
      p4:
        was: On 8 June 1924 Odell last saw Mallory and Irvine climbing high on the northeast ridge, and neither came back; Mallory's body was found in 1999 at about 8,160 m.
        now: On 9 June the two came down to the North Col, frostbitten but alive. Mallory went home to England, to Ruth and their three children. Where they got to that day, this timeline does not answer either.
        who: mallory_everest
        bio: In 1924 he and Irvine came down from Everest alive. He went home to his wife Ruth and their three children and lived for many more years.
    vignettes:
      date: A fictional messenger has two letters from different camps but one shared date on the carrying slip. You ask them to check the headings separately. Each letter leaves with its own place and date.
      question: The messenger reads an intended departure as a promise. You stop at the sentence where the letter talks about the weather. This time they repeat the plan with the condition still attached.
      wrap: You set aside the outgoing envelope while the messenger sorts the papers on their lap. They can put the camp list away without folding it into the letter.
  fanny_mendelssohn_berlin:
    name: Six songs under one name
    place: Berlin
    figure: Fanny Mendelssohn Hensel
    story: Fanny Hensel’s Six Songs, Op. 1, appeared under her own name in 1846.
    relic: A song sheet
    relic_desc: A handwritten song marked Fanny.
    points:
      p1: Protect Hensel's writing time amid rehearsal preparations so she can finish her last song
      p2: Bring the publisher to Hensel with proofs and let her settle the version of the Trio readers will receive
      p3: When the stroke comes during the rehearsal on 14 May, recognise it at once and save her
    points_fail:
      p1: Rehearsal takes up the hours she had set aside and the song stops at the draft. The branch falls out of sync and the office recalls the employee.
      p2: The Trio appears only after her death, so she never reviews the printed text herself.
      p3: She is taken ill at the piano and dies that same day, aged forty one. In this branch the Sunday concerts end there.
    shift:
      p1:
        was: In late April 1847 Hensel wrote that composition had stalled after the Trio; in May she finished her final song shortly before her death.
      p2:
        was: Hensel died on 14 May 1847. The Piano Trio first appeared in print in 1850.
        now: '{staff} persuades a publisher to bring proofs while they can still be changed. Her family later has the revisions she settled herself when they see the score into print.'
      p3:
        was: On 14 May 1847, rehearsing her brother Felix's cantata Die erste Walpurgisnacht at home, Hensel suffered a stroke and died the same day.
        now: '{staff} sees the attack begin, has her lie down and sends for a doctor at once. She recovers, and goes on running the Sunday concerts in Berlin for years, composing and publishing under her own name.'
        who: fanny_mendelssohn_berlin
        bio: Hensel survived the stroke of May 1847. She kept the Sunday concerts going in Berlin for many more years and went on publishing her music under her own name.
    vignettes:
      cover: A singer has opened the score in the middle and asks whose music this is. You fetch its loose title sheet and set it beside the score. The initials on the title sheet are enough to settle what to write on the sleeve. You miss the first song while putting the papers together.
      forward: You start to tell the singer how collectors will search for these songs in the future. She points to the loose cover and asks whether they will still have it. You ask for the cover to go out with the next copy. It goes with one reader. You cannot follow it any further.
      order: You work through the contents and lay the six songs in order. The singer can turn straight to the one she needs. You keep the sequence on your own slip. What you cannot take home is the sound from the room after you close its door.
  camille_claudel_paris:
    name: Two versions of a turn
    place: Paris
    figure: Camille Claudel
    story: Camille Claudel’s The Waltz was conceived between 1889 and 1893. The Musée Camille Claudel catalogues several variants, including a cast dated 1905, and describes how she changed the sweep of the drapery.
    relic: A bronze hand
    relic_desc: A small bronze study of a hand.
    points:
      p1: Her family tells her nothing of her father. Get her back to Villeneuve before 3 March to see the father who always protected her one last time
      p2: Before 10 March, cure her illness, so she does not spend her last thirty years in an asylum
    points_fail:
      p1: Her father died and was buried without her knowing. In this branch she never saw again the one person who had always protected her.
      p2: 10 March happened as it did in history. In this branch she never went back to her studio.
    shift:
      p1:
        was: On 3 March 1913 her father, Louis-Prosper Claudel, died at Villeneuve; the family did not tell Camille, and she was not at the funeral.
        now: She reached Villeneuve before her father died, saw him one last time, and was at his funeral.
      p2:
        was: On 10 March 1913 Camille was committed to the asylum of Ville-Évrard at her family's request; moved to Montdevergues in 1914, she never left, and died there on 19 October 1943.
        now: '{staff} stayed with her through that spring, the illness slowly eased, and she was not taken away. She stayed in her studio in Paris and went on sculpting for many years.'
        who: camille_claudel_paris
        bio: In this line Camille Claudel recovered in the spring of 1913, was never committed, went on sculpting in Paris, and in her later years held exhibitions of her own.
    shift_all: She said goodbye to her father, her illness eased, and after that spring she was still sculpting in her own studio.
    vignettes:
      light: You have seen a later museum display, but only now can you watch the shadow change as you walk around the skirt. The packer is about to write the same description on both cards. You draw the two curves in the margins. The crates will leave separately, and you will see neither unpacked.
      mark: The packer finds two labels with the same title. You add one detail to each, where the drapery ends, before the lids go on. You keep both notes in your own hand. The marble commission you read about never arrives.
      crate: While the packer reaches for a lid, you keep a wrapping sheet clear of the projecting skirt. You trace its curve on the spare paper from memory. When the lid comes down, you can no longer check the last inch.
  artemisia_florence:
    name: The first woman in the academy
    place: Florence
    figure: Artemisia Gentileschi
    story: Artemisia Gentileschi became the first woman admitted to Florence's Academy of the Arts of Drawing in 1616. Her Florentine years include the work now known as Self-Portrait as a Lute Player.
    relic: A pigment jar
    relic_desc: A small jar of ground lapis blue.
    points:
      p1: Before the July 19 admission, bring Florence’s Academy of the Arts of Drawing a commission record under Artemisia’s name so it can verify her work.
      p2: Read the advances for Allegory of Inclination against the delivery accounts. Leave the painter a copy she can show to the supplier herself.
      p3: Give Artemisia time to use her accounts to agree dates with the next patron for materials, delivery and final payment. Both copies of the agreement are to name her as payee.
    points_fail:
      p1: The academy receives a record bearing only the patron’s mark. The clerks cannot check who delivered the work and put off the vote. The office recalls the employee.
      p2: An advance and the expenses for another project sit side by side in the ledger. When the supplier calls again, Artemisia has to borrow the books and search them anew.
      p3: Both sides are in a hurry to start and write the deposit down on a single slip. At the next demand from the pigment seller, she still needs the patron to find the original account.
    shift:
      p1:
        was: On July 19, 1616, the Academy of the Arts of Drawing in Florence admitted Artemisia Gentileschi.
      p2:
        was: The Buonarroti archive holds payment records for the commission. Artemisia also brought cases to the academy’s tribunal, including disputes over debts to suppliers.
        now: She puts away a dated account of her own. When the supplier returns, she can show which payment bought the pigments and which was an advance from the patron.
      p3:
        was: The Buonarroti archive preserves records of advances and correspondence that show her finding money to work in Florence.
        now: Her early requests for money still survive in letters. For later commissions, she puts the materials and payment dates on both copies of the agreement, so suppliers can order their stock against the terms she has made.
        who: artemisia_florence
        bio: She painted Allegory of Inclination for Michelangelo Buonarroti the Younger’s house, where it remains part of the decoration. Admission also gave her access to the academy’s tribunal for disputes arising from her trade.
    vignettes:
      pose: The visitor turns towards the mirror and asks which pose looks more natural. You ask what each pose seems to be doing. They pick the one that lets the hand keep its own purpose.
      name: A practice sheet has the sitter's description but no place for the painter's name. You turn it over and ask the visitor to put down both before the sheets are stacked.
      mirror: You move the mirror until the visitor can see the angle without twisting. They try the pose once, then make a small change of their own before drawing.
  buchner_zurich:
    name: Two drafts on the rehearsal table
    place: Zurich
    figure: Georg Büchner
    story: In 1836 Georg Büchner, twenty three, had come to Zürich as a refugee and was lecturing at the new university. On 2 February 1837 he fell ill with typhus. His fiancée Minna Jaeglé hurried from Strasbourg and reached him when he was already dying, and he died on 19 February. He left Woyzeck unfinished.
    relic: A bundle of scenes
    relic_desc: Loose scenes in a cramped hand, in no fixed order.
    points:
      p1: Send word to Strasbourg in the first days of his fever, so that Minna reaches him days earlier
      p2: Stop the typhus and cure him, so that he lives through this February
    points_fail:
      p1: The news reached Minna late. When she came to Zürich he was already dying.
      p2: The fever rose day by day, and on 19 February he died in Zürich at twenty three.
    shift:
      p1:
        was: 'February 1837: his fiancée Minna Jaeglé hurried from Strasbourg to Zürich, arriving when he was already dying; he died soon after with her beside him.'
        now: Minna arrived in Zürich days earlier and was there through the days when he could still talk with her.
      p2:
        was: '19 February 1837: Büchner died of typhus in Zürich, at twenty three, with Woyzeck unfinished.'
        now: His fever broke, and in spring he was back at the university, teaching and writing.
        who: buchner_zurich
        bio: Büchner came through the typhus of 1837 in Zürich and went back to his teaching and his writing.
    vignettes:
      order: The reader has put the two copies together and numbered the scenes in ink. You add a separate label to each source and write the proposed order on a removable slip. The next reader can undo it. You bring home that slip; you still do not have a final order.
      pause: You know future theatres will have to decide what goes next. The reader asks if your answer is the author’s. You try both beginnings aloud and mark where they leave different questions. You can take two pauses home, and no finished script.
      gap: You ask the reader to stop the moment the page stops. Neither of you supplies the missing line. On your copy you leave a space wide enough to notice at a glance. That space is what you remember when you get back.
  emily_bronte_haworth:
    name: The parsonage in winter
    place: Haworth
    figure: Emily Brontë
    story: Wuthering Heights appeared in 1847 under the name Ellis Bell. The novel frames much of its story as Nelly Dean's account to Lockwood.
    relic: A dog collar
    relic_desc: A worn leather collar from the parsonage mastiff.
    points:
      p1: When London letters mix up the Bells' books, help the sisters assemble papers that identify each author's work
      p2: When a printer's error changes a line, help Emily leave corrections that a later printer can check
      p3: While Emily can still check how her characters speak, have her prepare a dialect copy for a later edition
      p4: Persuade Emily to let a doctor near her, and cure the lung illness that grows worse each week after Branwell's funeral
    points_fail:
      p1: The letters still attribute the books to one pen name and the sisters cannot take separate proof to London. The clarification is lost, and the office recalls the employee.
      p2: The next printer must guess which readings were intentional, and errors carry forward.
      p3: Her family must decide which lines to change when the book is reissued, with no way to establish which spellings the author wanted.
      p4: She refuses every doctor through the autumn and dies at the parsonage on 19 December. In this branch the winter goes as it did.
    shift:
      p1:
        was: In July 1848 Charlotte and Anne Brontë went to London from Haworth to explain to a publisher that the Bell pen names belonged to different writers.
      p2:
        was: The 1847 Wuthering Heights contained printing errors. Corrections appeared in the new edition of 1850.
        now: '{staff} leaves Emily a copy to mark and writes out the errors she identifies with page references.'
      p3:
        was: Emily died in Haworth in 1848. Charlotte edited the 1850 edition and changed some dialect spellings.
        now: '{staff} puts the dialect pages in front of Emily separately and records the spellings she approves apart from printing errors. Charlotte has that copy when she prepares the next edition.'
        who: emily_bronte_haworth
        bio: Emily left an annotated copy of Wuthering Heights with the dialect checked in her own hand. Later printers could preserve the way she had written her characters' voices.
      p4:
        was: On 19 December 1848 Emily died at Haworth parsonage. Through her illness she had refused to see a doctor, and agreed only on the day she died.
        now: '{staff} persuades her in November to let a doctor in, and brings medicine that works on the lungs. She comes through the winter and lives on at the parsonage for many years, still walking the moors and writing.'
        who: emily_bronte_haworth
        bio: Emily recovered from the illness that began after her brother's funeral in 1848. She lived on at Haworth, walking the moors and writing for many more years.
    vignettes:
      witness: The reader thinks the person telling the story saw it all. You ask how she learned one particular detail. They trace the sentence back to the speaker who supplied it.
      voices: The reader gives the whole page one voice. You ask them to try again from the place Nelly takes over. A listener can now tell when one speaker is passing the story to another.
      mark: You leave a scrap at the point where the telling changes hands. The reader returns to it before deciding whether a later passage contradicts what they heard.
  lili_boulanger_paris:
    name: Parts spread across the table
    place: Mézy sur Seine
    figure: Lili Boulanger
    story: Lili Boulanger had been ill since early childhood. In the winter of 1918, at Mézy-sur-Seine, she was too weak to write and dictated her last work, for voice, string quartet, harp and organ, to her sister Nadia. She died there on 15 March 1918, at twenty four.
    relic: A pencil
    relic_desc: A short pencil beside blank staff paper.
    points:
      p1: Before the illness of her bowel wears her out, get it under control and save Lili
    points_fail:
      p1: As in history the illness wins. Lili dies at Mézy on 15 March, at twenty four.
    shift:
      p1:
        was: '15 March 1918: Lili Boulanger, ill since childhood, died at Mézy-sur-Seine, aged twenty four.'
        now: Her illness was brought under control. That spring she sat up at the table again and wrote the notes down in her own hand.
        who: lili_boulanger_paris
        bio: In this timeline Lili Boulanger came through the winter of 1918 at Mézy. Her illness was treated, and she went on composing.
    vignettes:
      entry: The copyist has marked the singer’s entry on an instrumental part. You lay that sheet next to the full score and ask him to point to the voice. He moves one mark. You take a scrap with both places on it. The rehearsal begins after your return.
      visitor: You tell the copyist that future readers will come looking for every part listed for the work. He sets the organ pages aside so they won’t be mistaken for a spare voice copy. You help him tie them separately. You never get to hear those two parts together.
      stand: You give the copyist space to lay out the voice, the quartet, the harp and the organ without overlapping them. He returns the harp sheet to its own pile. You copy the list of parts into your notebook. By the time the stands are ready, your own place is empty.
  qu_yuan_miluo:
    name: Verses by the river
    place: Miluo River
    figure: Qu Yuan
    story: The Songs of Chu transmits The Fisherman, a literary exchange between Qu Yuan and a fisherman. The later biography in the Records also preserves a version of the dialogue.
    relic: A bamboo slip of verse
    relic_desc: A slip of bamboo carrying a few lines of a long poem.
    points:
      p1: When the Qin army takes Ying and the war comes south, keep safe the poems Qu Yuan has written in exile
      p2: While Qu Yuan wanders the marshes worn and wasted, see that he eats, sleeps and is looked after
      p3: Stay with Qu Yuan by the Miluo River and keep him in this world
    points_fail:
      p1: The slips are lost in the flight from the war and his poems do not come down. This branch falls out of step with history and the office recalls the employee.
      p2: No one looks after him, and in this branch he walks the river banks as worn as the records say.
      p3: In this branch, as in history, he goes into the Miluo River.
    shift:
      p1:
        was: In 278 BC the Qin general Bai Qi took Ying, the capital of Chu; the poems attributed to Qu Yuan were later collected in the Songs of Chu.
      p2:
        was: The Records of the Grand Historian say that Qu Yuan, in exile, walked the marsh banks with his hair unbound, his face haggard and his body wasted.
        now: '{staff} keeps him fed and sheltered through the wet season. He is less worn when he comes to the river.'
      p3:
        was: The Records of the Grand Historian say Qu Yuan drowned himself in the Miluo River; the year is usually given as about 278 BC, and accounts differ.
        now: '{staff} stays with him at the river through those days. Qu Yuan lives on in the south of Chu and goes on writing.'
        who: qu_yuan_miluo
        bio: In this branch Qu Yuan did not go into the Miluo River. He lived out his years by the rivers of the south of Chu and kept writing poems.
    vignettes:
      two_tales: The ferryman has heard a different ending from the one you brought. You listen as they tell it through and mark whose telling it is before comparing the lines.
      refrain: The ferryman starts humming after the question in the tale. You wait until the tune ends before asking where they first heard the words.
      wait: While the ferry waits, you ask the teller to go back to where the two people first speak. Onshore, you can still remember who asked the first question.
  sima_qian_changan:
    name: A history written after the sentence
    place: Chang'an
    figure: Sima Qian
    story: The Book of Han preserves Sima Qian's letter to Ren An, in which he discusses the aims and organization of his historical work.
    relic: A bundle of bamboo slips
    relic_desc: Slips tied with cord, each carrying a column of characters.
    points:
      p1: While Sima Qian is in prison, keep the unfinished drafts of his history whole and in order at his home
      p2: Bring food and clothing into the prison and spare him the worst of the jailers' humiliations
      p3: Raise the money that the law allows to redeem his sentence, so that Sima Qian is spared the punishment of castration
    points_fail:
      p1: The bundles at his home come loose and are scattered, and the drafts are not there when he comes out. This branch falls out of step with history and the office recalls the employee.
      p2: Nobody reaches him in prison, and in this branch he bows his head to the jailers as he later wrote that he did.
      p3: The family is poor and no friend speaks for him. In this branch, as in history, he cannot redeem himself and is castrated.
    shift:
      p1:
        was: In about 98 BC, when Sima Qian was imprisoned after the Li Ling affair, his history was, in his own words, only roughly begun and not yet finished.
      p2:
        was: In about 98 BC Sima Qian was imprisoned for defending Li Ling; in his letter to Ren An he wrote of how he had to abase himself before the jailers.
        now: '{staff} brings him food and warm clothing and pays the gatekeepers to leave him alone. He passes the months in prison in somewhat less shame.'
      p3:
        was: In about 98 BC Sima Qian was sentenced for defending Li Ling; his family was too poor to redeem the sentence, no friend spoke for him, and he was punished by castration.
        now: '{staff} raises the redemption money from merchants and old acquaintances and it is paid before the sentence is carried out. Sima Qian leaves prison unharmed in body. He goes home to the bamboo slips and finishes the history.'
        who: sima_qian_changan
        bio: In this timeline Sima Qian redeemed his sentence and was not castrated. He still finished his history of the past down to his own day.
    vignettes:
      dates: The clerk starts to merge two entries under one year. You ask them to leave the dates with their respective accounts. It becomes possible to see exactly where the mismatch begins.
      witness: The clerk wants the better story to go first. You ask how each account got to the desk. They mark the origins before deciding what order a reader should see.
      binding: You leave both slips loose while the clerk reads them once more. When the bundle is tied, a short label says that one question is still open.
  du_fu_xiang_river:
    name: A poet on a boat
    place: Xiang River
    figure: Du Fu
    story: A poem transmitted under Du Fu's name is headed as verses written in illness aboard a boat and addressed to friends in Hunan. The poem evokes river and shore scenes.
    relic: A boatman's oil lamp
    relic_desc: A small clay lamp that burned late over a few lines of verse.
    points:
      p1: Keep a place for Du Fu’s pages on the boat so the long poem for friends in Hunan can be assembled
      p2: Nurse him through his illness on the boat and ease his pain
      p3: See the boat north, so that he and his family get home safely
    points_fail:
      p1: Only the first and last leaves turn up after a hurried move. The poem cannot be assembled and the office recalls the employee.
      p2: He lies on his pillow in the winter boat, and grows worse day by day.
      p3: The boat never got north. He died that winter far from home, and his coffin was laid in temporary burial at Yueyang.
    shift:
      p1:
        was: In 770 Du Fu, ill on a boat, wrote a poem of thirty six rhymes for his friends and kin in Hunan, as its title says.
      p2:
        was: In the winter of 770 Du Fu lay ill on a boat on the Xiang, and died soon after away from home, at fifty nine.
        now: That winter he suffered less on the boat.
      p3:
        was: In the winter of 770 Du Fu died far from home and was laid in temporary burial at Yueyang; more than forty years later his grandson Du Siye begged the money to rebury him at Yanshi.
        now: The boat reached the north the next spring, and Du Fu and his family came home. He lived some more years there.
        who: du_fu_xiang_river
        bio: Du Fu drifted through Hunan in his last years, came home to the north in 771, and spent the rest of his life with his family.
    vignettes:
      shore: The traveller writes that the shore looks gloomy. You ask what made them look up from the boat. They pause, then write down one thing that was actually there.
      delivery: You hear that the next boat goes only partway to the friend's town. The traveller nearly folds the note without a second name on it. You help them find someone who can take it onwards.
      damp: The traveller sets the note where spray has reached the board. You lay a dry scrap beneath it while they finish writing the greeting.
  li_qingzhao_hangzhou:
    name: The lost collection
    place: Hangzhou
    figure: Li Qingzhao
    story: Li Qingzhao's postface to the Jinshi lu recalls how she and Zhao Mingcheng gathered books and inscriptions and how much of the collection was later dispersed.
    relic: A rubbing of an old inscription
    relic_desc: Ink pressed from a stone, the kind she and her husband collected.
    points:
      p1: Distinguish a recollection from a catalogue entry
      p2: Keep the incomplete copy open at the right place
      p3: Record a missing entry without guessing its wording
    vignettes:
      trace: The reader recognises a title and reaches for the next page. You ask whether they can identify the object too. They stop and copy the place name before the missing line.
      missing: There is a gap in the list. The reader hesitates over what to add. You keep the place with a short note of what was missing, leaving room for a later reader to find it.
      book: You set the postface beside the numbered list. The reader turns from one to the other before reading aloud, and the names start to sound like things that were once held and carried.
  su_shi_huangzhou:
    name: Exile on the Eastern Slope
    place: Huangzhou
    figure: Su Shi
    story: After the Crow Terrace Poetry Trial of 1079, Su Shi was exiled to Huangzhou, where he farmed a plot on an eastern slope and took its name, Dongpo. In the seventh month of 1082 he went out on the river below the Red Cliff with guests and wrote the Former Ode on the Red Cliff; in the tenth month he walked back from the Snow Hall towards Lingao and wrote the Latter Ode. He left Huangzhou in 1084.
    relic: A straw cloak
    relic_desc: A rough rain cloak of the kind a farmer wore on the slope.
    points:
      p1: Help his family bring in a harvest from the waste land on the eastern slope, and get through the days when the savings run out
      p2: On the night of the full moon of the tenth month, keep him safe on the cliff above the river, so that he comes back down to the boat
      p3: Save the newborn children in the villages who were to be drowned in a basin of water
    points_fail:
      p1: In this branch there was no extra pair of hands on the eastern slope at the autumn harvest, and the strings of coins on the beam went on getting fewer one by one.
      p2: That night he lost his footing on the cliff, and in this branch there is no return to the boat.
      p3: In this branch the basins in the villages stayed as they were, and {staff} did not move a single family to keep that child.
    shift:
      p1:
        was: In 1081 Su Shi broke ground on the slope east of the town, and kept the household to a hundred and fifty cash a day.
        now: The eastern slope gave a few more loads of grain that autumn, and strings of coins were still left on the beam at the end of the year.
      p2:
        was: On the full moon of the tenth month of 1082 Su Shi climbed the broken bank of the Red Cliff alone and came back to the boat, and later wrote the Second Ode on the Red Cliff.
      p3:
        was: He heard of the drowning of infants around Yue and E, wrote to the prefect of Ezhou asking him to forbid it by law, and in Huangzhou proposed a society for raising children, asking the wealthy for money to help poor families keep their newborns.
        now: '{staff} went from door to door with the society, and that winter a few more families kept the children just born to them.'
    vignettes:
      slope: '{staff} carries water up the slope for the hired hands. At dusk a neighbour, made up for the game, leaves a bowl of cooked beans at the edge of the field and says the newcomer can have the second bowl tomorrow.'
      lamp: '{staff} sits on a stone by the road with a lamp shaded against the wind. Footsteps come down from the slope long after the third watch; {staff} turns the lamp towards the path and says nothing.'
      ferry: '{staff} helps a boatman, made up for the game, coil the rope at the landing. He says the water under the cliff is slow on a still night, and that the guests always ask for the far side.'
  cao_xueqin_beijing:
    name: The blank after the last chapter
    place: Western Hills, Beijing
    figure: Cao Xueqin
    story: An early manuscript of The Story of the Stone attests that annotated copies circulated during Cao Xueqin's lifetime. One later marginal note in that manuscript associates Cao's death with a book left unfinished. The scenario is set in his last winter without fixing the exact date of his death or the number of chapters he wrote.
    relic: A loose sheet of chapter plans
    relic_desc: A game keepsake with a proposed order for several chapters and blank space for what Cao had yet to decide.
    points:
      p1: Keep the early annotated copy in the copyist's hands while Cao's working pages are returned to him
      p2: See to the fire and the copying so Cao can spend one good evening thinking through the ending
      p3: While Cao still has strength to review it, leave a separate copy of the chapter plan he agrees to pass on
    points_fail:
      p1: The only copy at this table goes back into the pile of working pages. In this branch the reader leaves without the annotated text.
      p2: The room grows cold before the papers are ready. The work waits for another evening.
      p3: The copyist can arrange the loose pages, but has no record of which ending Cao meant to leave.
    shift:
      p1:
        was: The Jiaxu manuscript preserves notes on an early text that was being copied during Cao Xueqin's lifetime.
      p2:
        was: A marginal note in the Jiaxu manuscript remembers Cao's death and says the book was left unfinished.
        now: In this branch someone tends the fire and brings the pages one at a time. Cao gets one evening to work out where he wants the story to go.
      p3:
        was: The Jiaxu marginal note calls the book unfinished and gives no final chapter plan approved by Cao.
        now: The copyist takes away two sheets. One gives the order Cao has approved in this branch. The other lists the fates he has yet to decide. In the next copying the two sheets stay together.
        who: cao_xueqin_beijing
        bio: Before his death, Cao reviews a chapter plan with a copyist. In this branch later readers can see which decisions he made and where he left the ending open.
    vignettes:
      ink: The copyist sets a slip between the proposed chapter order and a reader's pencilled guess. The pages can now be put back in the right places.
      paper: '{staff} carries in the lamp. The copyist lifts the manuscript away from the edge of the table to make room.'
      empty: The last sheet has room for another heading. The copyist leaves the space as it is.
  tang_xianzu_linchuan:
    name: A play on love beyond death
    place: Linchuan
    figure: Tang Xianzu
    story: Tang Xianzu dated his preface to The Peony Pavilion to the autumn of 1598. In the tenth scene, Du Liniang visits the garden in spring, then falls asleep and meets a young man in a dream.
    relic: A printed songbook
    relic_desc: Printed arias for singers, with the tune named above each.
    points:
      p1: Help him settle a fair copy of The Peony Pavilion in his own corrected words and put it in the hands of the Yihuang company, so that they rehearse from his text
    points_fail:
      p1: As in history the altered versions spread later, and all he can do is write to the Yihuang players not to sing them; this branch is as history was.
    shift:
      p1:
        was: After 1598, Tang Xianzu wrote to ask the Yihuang players to stick to his original words instead of using a version altered for singing.
        now: The Yihuang company had a copy he had corrected himself before any altered version appeared, and went on singing from it.
        who: tang_xianzu_linchuan
        bio: In this timeline the text of The Peony Pavilion that Tang Xianzu had corrected himself reached the Yihuang company first, and they kept singing from it.
    vignettes:
      empty_garden: '{staff} sets the chair back against the wall. The player crosses the bare floor and looks down as she sings. From the bench, the copyist can tell where the path ends.'
      cue: The singer stops where a line has been shortened. Her partner misses the entrance. {staff} puts the omitted words back on the rehearsal slip and asks them to try the handover again.
      breath: The singer leaves a little air at the end of the verse. {staff} marks that pause on a separate slip for the player waiting in the wings.
  ban_zhao_luoyang:
    name: A place left in the Han tables
    place: Luoyang
    figure: Ban Zhao
    story: The Book of the Later Han says that Ban Gu died before finishing eight tables and the astronomical treatise of the Book of Han, and that Ban Zhao was ordered to continue the work at the Eastern Pavilion library. It also names Ma Xu as a later contributor. The 92 setting and the practice sheets in this visit do not date each stage of completion.
    relic: A table of names on silk
    relic_desc: A strip of silk with a table of titles and names in neat columns.
    points:
      p1: Before the Dou faction falls, help Ban Gu mark how far each of the eight tables and the astronomical treatise has gone and how each was to go on, for whoever continues them
      p2: When Ban Gu is arrested among the followers of the Dou family, keep his unfinished drafts of the Book of Han together so they can later reach Ban Zhao
      p3: Save Ban Gu from the Luoyang magistrate Chong Jing, who has seized him over a private grudge, so that he comes out of prison alive
    points_fail:
      p1: Nobody marks where the work stops. Whoever continues it has only the drafts to read, and Ban Gu's plan for the rest goes with him.
      p2: The drafts are scattered in the arrests, and in this branch Ban Zhao has nothing to continue at the Eastern Pavilion. The office recalls the employee after a loss of sync.
      p3: Nobody reaches the court in time. Ban Gu dies in prison at sixty one, as he did, and the rebuke to Chong Jing comes after.
    shift:
      p1:
        was: In 92, when Ban Gu died, the eight tables and the astronomical treatise of the Book of Han were still unfinished; Ban Zhao was later ordered to complete them at the Eastern Pavilion, and Ma Xu took part after her.
        now: Ban Gu left a note at the head of each unfinished table on where it stopped and how it was to continue. Ban Zhao took the work up from his notes.
      p2:
        was: In the sixth month of 92 the Dou faction fell; Ban Gu was first dismissed from office, then arrested in the round-up of the Dou family's followers.
      p3:
        was: In 92 the Luoyang magistrate Chong Jing, holding a grudge against Ban Gu's household, had him arrested, and Ban Gu died in prison at sixty one; the emperor afterwards rebuked Chong Jing and punished the officials in charge.
        now: '{staff} gets word of the private arrest to the court before it is too late, and Ban Gu is let out of prison. He lives some more years and works on the tables himself, with his sister beside him.'
        bio: In this timeline Ban Gu came out of the Luoyang prison alive in 92. He spent the years that were left to him on the unfinished tables of the Book of Han, working on them together with his sister Ban Zhao.
    vignettes:
      column: The copyist has moved the next name up into an empty place. You lay the register alongside the table and show that it belongs one line lower. He moves it back and marks the empty place for checking. You bring back one aligned row. There is still no entry for the other place.
      later: You know later readers will see the work as a whole. The copyist cannot tell which part of his practice sheet is finished today. Together you fold a narrow slip around the one row that still needs checking. It will open first for the next reader. You leave before another register arrives.
      fold: You copy the name and its line number together, then leave an empty space above. The copyist can see that you meant to leave it. You take one copy back. Someone else will have to decide what belongs there.
  xu_xiake_lijiang:
    name: The path he did not have time to climb
    place: Lijiang
    figure: Xu Xiake
    story: In the second lunar month of 1639, Xu Xiake stayed at Jietuo Lin in Lijiang, collating books for Mu Zeng, who sent him food and later gifts in thanks. Xu heard that Gongshou Terrace and Lion Cliff lay above the monastery. He wrote that the pressure of the work left him no time to climb either one.
    relic: A route sketch from Jietuo Lin
    relic_desc: A folded sketch with a line up the slope and an empty margin beside the fork.
    points:
      p1: Check the return of the corrected volumes with the messenger, so Mu Zeng can acknowledge the work and renew his request for the Gazetteer of Mount Ji
      p2: Free up half a day, find a local guide and an escort, and walk from Jietuo Lin to Gongshou Terrace with Xu
      p3: Walk the fork below Lion Cliff with Xu and leave a copy of the new route notes with the monastery
    points_fail:
      p1: The returned volumes lack receipts. The messenger cannot confirm the earlier work was done, the handover is missed, and the office recalls the employee.
      p2: The day's copying fills the afternoon. Gongshou Terrace stays in the diary as a place Xu heard about.
      p3: Xu leaves Lijiang without a route from his own steps to set down beside the directions he heard.
    shift:
      p1:
        was: On the ninth day of the second lunar month in 1639, Mu Zeng sent gifts in thanks for the collating and again asked Xu to compile the Gazetteer of Mount Ji.
      p2:
        was: On the sixth day of the second lunar month in 1639, Xu wrote that he had been too busy collating to climb to Gongshou Terrace or Lion Cliff.
        now: With the collation delivered, {staff} takes Xu back to Jietuo Lin to meet the guide and escort. Xu climbs the terrace and notes where the opposite slope comes into view.
      p3:
        was: In 1639, the Lijiang diary mentioned Lion Cliff as somewhere Xu heard lay higher up and had no time to climb.
        now: '{staff} walks the fork with Xu in both directions. Xu marks the bend where the paths double back and leaves a copy of the sketch at Jietuo Lin.'
        who: xu_xiake_lijiang
        bio: Xu's Lijiang diary carries an extra firsthand entry between the collation and his departure. A second copy of his sketch stays with Jietuo Lin.
    vignettes:
      view: The guide describes a bend by the mountain it faces. {staff} asks him how many turns there are before it. The view and the way to get there go on different lines.
      trail: The escort takes the steep way to the steps and arrives with wet cuffs. {staff} hangs a dry cloth by the door and moves the nearly finished pages farther inside.
      slope: At the monastery steps {staff} pulls out a fresh leaf. The dispatch for Mu Zeng goes back in its box. The blank leaf is for the route.
    remarks:
      trait_methodical: '{staff} adds an arrow to the sketch so the next traveller will know which way is uphill.'
  song_yingxing_fengxin:
    name: A book of how things are made
    place: Jiangxi
    figure: Song Yingxing
    story: Song Yingxing's Tiangong kaiwu was first printed in 1637. Its chapters describe crafts and production, including papermaking in Killing the Green.
    relic: A page of tool drawings
    relic_desc: A woodblock print of a loom with every part labelled.
    points:
      p1: While the money for the carving is still short, get Tiangong kaiwu to the block cutters so that the book is printed
      p2: Just before the book goes to the carvers, talk him out of cutting the two chapters On Observing the Heavens and On Music, and have them carved with the rest
    points_fail:
      p1: The book is not printed. This branch has come loose from history, and the office recalls the employee.
      p2: As in history the two chapters are cut before printing and later lost; in this branch they are lost too.
    shift:
      p1:
        was: '1637, fourth month: Song Yingxing wrote his preface, and Tiangong kaiwu was printed with money from his friend Tu Boju.'
      p2:
        was: '1637: in his preface Song wrote that the chapters On Observing the Heavens and On Music were too subtle for him and that he cut them as the book went to the carvers; both were later lost.'
        now: The two chapters were carved into the first printing and came down with the eighteen chapters of the book.
        who: song_yingxing_fengxin
        bio: In this timeline Song Yingxing kept the chapters On Observing the Heavens and On Music, and the first printing of Tiangong kaiwu carried them.
    vignettes:
      strainer: You ask which side of the illustrated screen the wet sheet ends up on. The reader turns the print round to mimic the worker's hands and finally points to the right surface.
      drying: The reader tells the stages out of order. You ask him to trace the wet sheet from the screen to the drying surface. He pauses and moves one caption to the next drawing.
      sheet: The reader drops a loose proof. You pick it up by the blank border and lay it beside the craft it was meant to explain. He puts a drying weight on the corner.
  wang_zhenyi_jinling:
    name: A mirror below the table
    place: Nanjing
    figure: Wang Zhenyi
    story: In her Explanation of Lunar Eclipses, Wang Zhenyi recounts moving a mirror below a round table so that the table blocked light from a suspended lamp. Raising the lamp let its light reach the mirror again.
    relic: A small round mirror
    relic_desc: The mirror that played the Moon in her model of an eclipse.
    points:
      p1: Get the helper to repeat the mirror position before you raise the lamp
      p2: Watch closely for the change from shadow to light
      p3: Mark the initial and final lamp positions on the same diagram
    vignettes:
      one_change: Your helper is about to lift the lamp and the mirror together. You ask her to leave the mirror where it is for one trial and draw the two lamp heights separately. The mirror brightens with just one change. You take that sketch back. The next chance to apply it to the sky is still ahead of you.
      shadow: You know this demonstration will survive on the page, but the helper who has just walked in only sees a dark mirror. You let her look before and after the lamp is lifted, and point out the rim of the table between the two. She can then mark the obstruction herself. The room has shown you one effect; no real eclipse comes during the visit.
      outline: You draw the table edge, the low mirror and a line from the lamp. When the light returns, you add a second line to the same sheet. You take both lines back. The sky outside has given you nothing to compare them with tonight.
  jianzhen_nara:
    name: The long road back to Yangzhou
    place: Lingnan
    figure: Jianzhen
    story: In 748 Jianzhen of Yangzhou set out for Japan for the fifth time, and his ship was blown to Hainan. On the long way back overland, Eiei, the Japanese visitor who had come to Yangzhou to ask him across, fell ill and died at Duanzhou. Further on, at Shaozhou, Jianzhen's failing eyes were treated by a man who said he could cure them, and afterwards he was blind.
    relic: A practice wrapper label
    relic_desc: An invented label used by the fictional temple helpers.
    points:
      p1: When Eiei falls ill at Duanzhou, nurse him and cure him
      p2: Before the man at Shaozhou treats Jianzhen's eyes, talk him out of it and treat the eyes properly
    points_fail:
      p1: As in history Eiei dies at Duanzhou. Jianzhen sees him to his burial and goes on north without him.
      p2: As in history the treatment leaves him blind. Three years later he crosses to Japan without his sight.
    shift:
      p1:
        was: Around 750, on the way back after the fifth failed crossing, Eiei, who had come to Yangzhou ten years before to ask Jianzhen to Japan, fell ill and died at Duanzhou.
        now: He got well at Duanzhou and went on north with the others.
      p2:
        was: '750, Shaozhou: after the heat and strain of the road Jianzhen''s eyes had grown dim. A man who said he could cure eyes treated them, and afterwards he was blind.'
        now: He never let the man treat him. His eyes were cured, and he could see the road and the people beside him.
        who: jianzhen_nara
        bio: In this timeline Jianzhen kept his eyes on the road back of 750, and later saw the sea he crossed to Japan.
    vignettes:
      sound: Chiyo points to the right bundle from across the room. Jun still cannot tell which one she means on the crowded shelf. You ask her to read the opening aloud instead. Jun finds the matching words on the wrapper and sets the bundle down for the next reader.
      tie: Jun starts to retie a loose wrapper before checking the order. You hold the bundle as Chiyo reads the first line of each part in turn. He puts one misplaced part back. The bundle will now open in the order in which they practised it.
      temple: You know the name of the temple that will be founded in 759. Chiyo only needs to mark where to take this reading in the morning. You help her write Tōdai-ji on the wrapper. The other temple still belongs to a future you will not see on this visit.
  hua_tuo_xuchang:
    name: The book the account remembers
    place: Xuchang
    figure: Hua Tuo
    story: The later Sanguozhi says that Hua Tuo was confined at Xu and recounts a failed attempt to pass on a book from prison.
    relic: A copy of the practice register
    relic_desc: An invented register leaf that distinguishes a report from a delivery.
    points:
      p1: When the jailer is too afraid to take the book, keep it out of the fire
      p2: Get him out of the prison at Xu alive
    points_fail:
      p1: The jailer feared the law and would not take it, and Hua Tuo burned the book. In this branch nothing of it is left.
      p2: He was put to death in the prison at Xu, as in history. In this branch he never treated another patient.
    shift:
      p1:
        was: In 208, about to die, Hua Tuo held out a book to the jailer, saying it could save lives; the jailer feared the law and would not take it, and Hua Tuo had it burned.
        now: The book left the prison in someone's keeping, and was copied before it could be lost.
      p2:
        was: In 208 Hua Tuo was held in the prison at Xu on Cao Cao's order and put to death there, though Xun Yu asked that he be spared.
        now: '{staff} got him out of the prison at Xu before the end. He went home under another name, kept treating people in the villages, and taught the students he already had for some more years.'
        who: hua_tuo_xuchang
        bio: In this timeline Hua Tuo left the prison at Xu alive in 208. He lived out his years as a country physician under another name, and his students learned from him for longer.
    vignettes:
      notice: Ajin heard there was a volume and has written it under items received. You ask her to touch the shelf where it would go. She moves the line to a report column, leaves the space on the shelf empty and keeps the source of the report beside it.
      shift: Achang wants to close the book before calling the next keeper. You ask him to read the entries aloud one time. When he reaches the unwitnessed delivery, they agree to leave that line waiting. The next keeper can see what has yet to be confirmed.
      later: You know a historian will tell a story about a book. Ajin wants to know if a real volume has come through this room. You show her where a confirmed delivery would be written. The page leaves her desk with that place still open.
  miyazawa_kenji_hanamaki:
    name: Stories few had read
    place: Hanamaki
    figure: Miyazawa Kenji
    story: Miyazawa revised Night on the Galactic Railroad in several drafts. In the manuscript-based text, Giovanni hears a station call before finding himself in a carriage.
    relic: A pocket notebook
    relic_desc: A small notebook of poems in pencil.
    points:
      p1: Sort out the farmers' questions so Miyazawa can still hold the fertilizer consultation when he is too ill for a long conversation
      p2: While Miyazawa can still recognize the drafts of Night on the Galactic Railroad, ask him to leave their order clear
      p3: Let him know, while he is still alive, that many people will one day read his poems and stories
      p4: Cure the lung disease before the pneumonia of 20 September takes him
    points_fail:
      p1: The visitors leave without a consultation, the branch falls out of sync, and the office recalls the employee.
      p2: The pages survive, and later editors still have to infer the order from paper and revisions.
      p3: In this branch he dies known to only a few poets. Nobody has told him that his books will be read.
      p4: In this branch the illness runs as it did. He dies in Hanamaki on 21 September, aged 37.
    shift:
      p1:
        was: In August 1933, Miyazawa continued advising farmers about fertilizer as his health worsened.
      p2:
        was: In September 1933, Miyazawa died, leaving several unfinished drafts of Night on the Galactic Railroad.
        now: '{staff} asks him which stacks came first and records the order on a separate wrapper. Later editors use those notes to keep the versions distinct.'
        who: miyazawa_kenji_hanamaki
        bio: Miyazawa left a guide to the order of the drafts before he died. When the story appeared after his death, readers could follow his revisions in sequence.
      p3:
        was: In 1924 Miyazawa published a book of poems and a book of children's stories at his own expense. In his lifetime he was almost unknown outside a few poets.
        now: '{staff} tells him at his bedside that his poems and stories will be read by many people after him.'
      p4:
        was: On 20 September 1933 Miyazawa developed acute pneumonia after years of lung disease, and he died in Hanamaki the next day, aged 37.
        now: '{staff} brings a medicine that clears the disease from his lungs, and by autumn he is up again. In this timeline he stays in Hanamaki for many more years, advising farmers on soil and fertilizer and going on revising his manuscripts.'
        who: miyazawa_kenji_hanamaki
        bio: Miyazawa recovered in the autumn of 1933. He kept advising the farmers of Hanamaki and lived to see his books reach many readers.
    vignettes:
      call: You read the station call from across the room. The reader looks up before you explain who is there. They leave the explanation for later and keep the call in their reading.
      window: The reader tries to point to where the route enters the sky. You ask what Giovanni can see through the window first. They put the hill and the carriage on separate scraps.
      ticket: You hold the page open while the reader rereads the shift into the carriage. They make a short note of what changes before the next station is named.
  higuchi_ichiyo_tokyo:
    name: Seven instalments on one counter
    place: Tokyo
    figure: Higuchi Ichiyo
    story: Higuchi Ichiyō’s Takekurabe appeared in seven instalments in Bungakukai in 1895 and January 1896. Bungei Kurabu published it together in April 1896.
    relic: A pocket diary
    relic_desc: A diary kept for years in careful brush writing.
    points:
      p1: Gather all seven installments from Bungakukai and check the collected proofs with Higuchi so the revised work can appear in April
      p2: When the collected text appears, help Higuchi negotiate a separate edition with a payment in advance and the proofs of her choice
      p3: When Ichiyō's fever will not break in July, find the tuberculosis early and cure her
    points_fail:
      p1: One issue is missing from the pile. The editor gets an incomplete collected text, and the office recalls the employee.
      p2: The collected version can be borrowed, but the bookseller keeps her waiting without agreeing a fee or a text to use.
      p3: The illness goes on. The doctors who come in August say there is no hope, and she dies at home in Maruyama Fukuyama-chō on 23 November, aged twenty four.
    shift:
      p1:
        was: Takekurabe ran in seven installments. Bungei Kurabu printed the revised work together on April 10, 1896.
      p2:
        was: Ichiyō faced financial hardship late in life. Takekurabe later appeared in her collected works in 1897.
        now: The bookseller advances part of the fee and keeps the approved proofs. She can use the money for household expenses, and the next compositor knows what text to follow.
      p3:
        was: From July 1896 Ichiyō ran a fever that would not go down. In August the doctors called to her judged that she could not recover, and she died of tuberculosis at home on 23 November, aged twenty four.
        now: '{staff} has a doctor find the tuberculosis in July and brings medicine that holds it back. She lives through that year and goes on writing fiction in Tokyo for many years.'
        who: higuchi_ichiyo_tokyo
        bio: Higuchi Ichiyō recovered from the tuberculosis found in the summer of 1896. She went on writing in Tokyo for many more years and lived to see her stories collected.
    vignettes:
      index: Someone has pencilled ‘complete’ on a single issue. You compare its ending to the April printing and find where it breaks off. The bookstall keeper lets you put a removable slip in it. You take home a list of seven instalments. You never find out who wrote the first label.
      reserve: The keeper has a reader who followed the story from issue to issue and hasn’t come back for the last one. You point out that other customers can buy the April printing now. The last instalment goes under the counter with a reservation slip. You leave before that reader returns.
      layout: You set the April issue beside the last instalment. One opens at the beginning and one assumes its reader has waited through six pieces already. You write that distinction on a scrap for the stallkeeper and keep your own copy. The original serial readers have waited longer than your entire visit.
  sei_shonagon_kyoto:
    name: The winter the empress was due
    place: Kyoto
    figure: Sei Shonagon
    story: Sei Shōnagon had served the empress Teishi at court since about 993. At the end of 1000 Teishi was expecting her third child. On 13 January 1001 she gave birth to a daughter, Princess Bishi, and died soon after, aged twenty four. With her death Sei Shōnagon's years at court came to an end.
    relic: A folded list
    relic_desc: A sheet of lightly written lists of things that please and things that do not.
    points:
      p1: Stay with Teishi through the birth, bring the child safely and save the mother
    points_fail:
      p1: As in history Teishi dies soon after the birth of her daughter, aged twenty four. Sei Shōnagon leaves the court.
    shift:
      p1:
        was: '13 January 1001, the sixteenth day of the twelfth month of Chōhō 2: the empress Teishi, whom Sei Shōnagon served, gave birth to Princess Bishi and died soon after, aged twenty four.'
        now: The birth went safely, and Teishi lived.
        who: sei_shonagon_kyoto
        bio: In this timeline the empress Teishi came through the birth of early 1001 alive, and Sei Shōnagon still had her mistress.
    vignettes:
      compare: You recognise the opening from a future edition. The copyist has skipped the edge of the mountain while reciting it. You ask where the light first shows, and the omitted place returns to the practice copy. You save the correction on a folded list. From this doorway the mountain itself stays out of sight.
      colour: The painter’s purple you remember is too dark for that sky. The copyist lets you use an offcut. You put a thin grey line over a small patch of violet, and the two of you wait for the paper to dry. By then the colour outside has gone.
      listen: From the doorway you hear the copyist read the opening twice. At dawn you make a list of one thing, the roof tiles that turn pale before the yard does. You take the fold of paper home. You never learn what the writer would have made of your entry.
  kabir_maghar:
    name: Two names in a song
    place: Maghar
    figure: Kabir
    story: A hymn attributed to Kabir in the Guru Granth Sahib names Benares and Maghar and questions what difference the place makes to devotion. It treats Kabir’s death year as traditional and invents the singers and their practice.
    relic: A practice shuttle
    relic_desc: An invented keepsake used to mark the singers’ cue.
    points:
      p1: Notice where the two singers recall a different place name
      p2: Ask each singer to finish a version before correcting it
      p3: Keep the two town names audible in the retelling
    vignettes:
      towns: Paro comes in on Benares and Salim answers with Maghar. You ask them to take turns instead of singing over each other. The listeners hear both towns and can tell where the question comes in. Paro gives the next singer the start without taking the answer away.
      beat: Salim gets to the name of the second town before Paro has finished the first. You use the shuttle on her bench to tap one beat on the wood. This time he waits and is heard. At the end, Paro hands him the shuttle and asks him to keep time for the next voice.
      collection: You have read a later collection with both towns on the page. Paro asks whether a friend who was away would recognise her opening. You listen to her try it once without supplying the later version. The friend has not arrived when you leave.
  ibn_rushd_lucena:
    name: Before the order to burn
    place: Córdoba
    figure: Ibn Rushd
    story: In 1195 the Andalusian philosopher and judge Ibn Rushd fell from favour. Charges were brought against him, and a tribunal in Córdoba condemned his teachings, ordered his works to be burned and banished him to nearby Lucena. A few years later he returned to court in Marrakesh, where he died on 11 December 1198. Many of his works in Arabic did not survive and are known only through Hebrew or Latin translations.
    relic: A reader’s practice extract
    relic_desc: An invented extract with space added for a premise.
    points:
      p1: Stay with Ibn Rushd in Lucena and let him know that his commentaries will be read on in many languages
      p2: Before the order to burn comes, make a second copy of his works and send it out of Córdoba
    points_fail:
      p1: As in history he lives out his banishment in Lucena with his teachings condemned, and no one tells him where his books will go.
      p2: As in history his works are ordered burned, and many of the Arabic originals are later lost, surviving only in translation.
    shift:
      p1:
        was: '1195: a tribunal in Córdoba condemned Ibn Rushd''s teachings and banished him to nearby Lucena.'
        now: In Lucena he came to know that his commentaries on Aristotle would be translated into other languages and read for centuries.
      p2:
        was: '1195: the tribunal ordered Ibn Rushd''s works to be burned. After his death many of the Arabic originals did not survive; of forty nine works listed by the Stanford Encyclopedia of Philosophy, fourteen are known only in Hebrew or Latin.'
        now: Before the order to burn came, a second copy had already left Córdoba, and his works came down in his own Arabic.
        who: ibn_rushd_lucena
        bio: In this timeline a second copy of Ibn Rushd's books was sent out of Córdoba before the order to burn them, and his writings survived in the Arabic he wrote them in.
    vignettes:
      premise: Mariam has copied a conclusion in careful letters. Yusuf can follow it only by assuming something she has left unstated. You ask him where he stopped and leave space before the conclusion. Mariam writes her assumption in that space, where Yusuf can question it.
      together: Yusuf wants to return the book and keep a single line for his own use. You give him time to copy the step that goes with it. At the door Mariam asks for the conclusion aloud, and he can now give her the reason as well.
      language: You recognise a term that later readers will meet in another language. Mariam just wants to know whether she has copied the premise as it stands. You hold the page flat while she checks it. The question she writes beside it will go to a reader you will not meet.
  rumi_konya:
    name: The voice at the opening
    place: Konya
    figure: Rumi
    story: The opening of Rumi’s Masnavi asks the listener to hear a reed speaking of separation. Konya’s Mevlana Museum holds a six-book manuscript copied in 1278, after Rumi’s death in 1273.
    relic: A reader’s opening leaf
    relic_desc: An imagined reading sheet marking the opening of a verse.
    points:
      p1: Put the pages of the Masnavi that Rumi checked in book order in Konya, ready for later copying
      p2: When he falls ill in December, help Husam al-Din Chalabi take down what Rumi still dictates, so the end of the sixth book goes a little further before he dies
    points_fail:
      p1: Different reading copies were mixed and nobody could recover a set checked by Rumi. The branch came apart from history and the office recalled the employee.
      p2: The sixth book ended where history left it.
    shift:
      p1:
        was: Konya holds a Masnavi manuscript dated 1278. Collection research traces it to a copy that Rumi checked.
      p2:
        was: Rumi fell ill in December 1273 and died in Konya on 17 December. The sixth book of the Masnavi ends inconclusively; whether it was finished, accounts differ.
        now: In his last days a few more couplets were taken down, and the sixth book closes the story it had begun.
        who: rumi_konya
        bio: In this line Rumi's last dictation in December 1273 was taken down to the end of the story he was telling. The six books went on being read in Konya after his death.
    vignettes:
      reed: Narin has performed both parts with the same voice. You ask where the reed first speaks as itself. She lets the next line begin after a breath. When Hasan listens with his eyes shut, he can hear the moment the reed takes over.
      hand: Hasan has to leave the reading bench, and Narin reaches for his page while he is still speaking. You hold its corner until he completes the couplet and can put his finger on the next line. She begins there when it is her turn. The passage has passed between them without a gap.
      manuscript: You have seen the later six-book manuscript. Narin asks if it will show where Hasan took a breath. You point to the line they practised and let her decide where to pause. The door closes before they read the next couplet aloud.
  ibn_al_nafis_cairo:
    name: The route in the margin
    place: Cairo
    figure: Ibn al-Nafis
    story: In his thirteenth-century anatomical commentary on Ibn Sina’s Canon, Ibn al-Nafis says blood passes from the right side of the heart to the left through the lungs and rejects a direct passage through the partition. The Cairo scene is an imagined comparison of text and practice diagrams, with 1242 used as a conventional setting.
    relic: Two practice diagrams
    relic_desc: An imagined pair kept for comparing two descriptions.
    points:
      p1: Compare the diagram with the passage the student is reading
      p2: Keep the earlier outline available while the new one is traced
      p3: Help the next reader tell the two drawn routes apart
    vignettes:
      trace: Hassan’s hand goes straight across the middle of the copy. Salma taps the line she has just read. You ask him to trace the route again while she follows the text. He redraws it via the lungs and marks the earlier line as a separate reading.
      layer: Salma is ready to rub out the older outline so that only one explanation remains. You slide a clean leaf underneath and let Hassan trace the second route there. A new reader can now lay the two together and ask what has changed.
      name: You know the later label for this part of the journey of the blood. Hassan wants to know where the commentator’s objection appears. You bracket that line instead of giving him a new title for his picture. The copy leaves the room before you hear whether his teacher accepts it.
  al_khwarizmi_baghdad:
    name: The man behind algebra
    place: Baghdad
    figure: Al-Khwarizmi
    story: Al-Khwarizmi's book on completion and balancing, written around 830, explains methods for solving equations through worked examples.
    relic: A sheet of worked equations
    relic_desc: A sheet of sums solved step by step with squares and roots.
    points:
      p1: At the Baghdad handover, keep the practical examples with the text that explains how to put a calculation in order
      p2: Leave copyists a reference volume that links examples to the parts of the text they use. Ask readers who have tried an example to flag any omissions
    points_fail:
      p1: The copy has the calculations but lacks the applications. The compilation cannot be handed over intact, and the office recalls the employee.
      p2: The next group of copies carries the mathematical chapters alone. Readers trying to divide property have no worked example to consult.
    shift:
      p1:
        was: Al-Khwarizmi compiled his book on calculation around 830. Its preface names trade, land measurement and division of property among its uses.
      p2:
        was: Later manuscripts and translations vary. Some omit parts of the material on practical applications.
        now: A cross-referenced copy stays available to apprentices and scribes. If someone copies an example on its own, its place in the whole can still be verified.
        who: al_khwarizmi_baghdad
        bio: Al-Khwarizmi wrote about calculation for ordinary needs. Different parts of the book followed different paths through copying and translation.
    vignettes:
      balance: You ask the learner to say the same change aloud on both sides. They stop before reaching the answer. The line that did not balance is now the one they can explain best.
      tiles: You put small square tiles on the table as the learner reads. When the words begin to run together, the remaining shape shows which piece is still missing.
      check: You keep the first line in sight after the learner finishes. They read their answer back into it to see if the numbers agree.
  ibn_khaldun_cairo:
    name: The ship off Alexandria
    place: Cairo
    figure: Ibn Khaldun
    story: Ibn Khaldun came to Cairo in 1382 at the invitation of Sultan Barquq. In 1384 the sultan asked the ruler of Tunis to let his family follow him, and on 8 August made him chief judge of the Maliki school, a high post for a newcomer from the west, and rivals in the city soon set to work to unseat him. That year the ship bringing his wife and daughters went down at Alexandria. In the Muqaddimah he asks historians to test reports against what could happen in the society they describe.
    relic: A checked report
    relic_desc: A report of a procession, with the place the watcher stood written in the margin.
    points:
      p1: When his rivals move to keep a newcomer out of the bench, keep his appointment as chief judge of the Maliki school on 8 August
      p2: When the ship bringing his wife and daughters goes down at Alexandria, pull the people on board out of the water and save them
    points_fail:
      p1: In this branch the appointment of 8 August went to someone else. This branch has come loose from history, and the office recalls the employee that day.
      p2: As in history the ship goes down at Alexandria with everyone on board, and his wife and daughters do not reach Cairo.
    shift:
      p1:
        was: '8 August 1384: Sultan Barquq appointed Ibn Khaldun chief judge of the Maliki school in Cairo; rivals in the city worked against him, and he lost the post the next year.'
      p2:
        was: '1384: the ship bringing Ibn Khaldun''s wife and daughters from Tunis went down at Alexandria, and no one on board survived.'
        now: The people on the ship were pulled from the water at Alexandria. His wife and daughters came on to Cairo, and the family lived together again.
        who: ibn_khaldun_cairo
        bio: 'In this timeline the ship that went down at Alexandria in 1384 did not take his family with it: his wife and daughters were saved and joined him in Cairo.'
    vignettes:
      gate: '{staff} asks a clerk, made up for the game, how long the gate stood open while the crowd went through. He writes the minutes in the margin beside the total, and then changes the total to an estimate.'
      two: '{staff} gives a second watcher, made up for the game, a sheet of her own, so that her account of the street does not end up squeezed into the margin of his.'
      copy: '{staff} copies a page of the Muqaddimah for a student of the court and leaves a finger''s width between the lines, for the notes the student will want to make.'
  taqi_al_din_istanbul:
    name: Two callers at the observatory
    place: Istanbul
    figure: Taqi al-Din
    story: Taqī al-Dīn’s Istanbul observatory carried out observations before its demolition in January 1580. Archival research identifies instruments including quadrants and a mechanical clock.
    relic: A comparison slip
    relic_desc: A fictional observatory slip with an original row and its correction.
    points:
      p1: As word of the closure reaches the observatory, inventory the existing tables and give the people keeping them a usable set
      p2: Keep drawings, descriptions of instruments and observations identifiable. Leave blanks where the use is known but the drawing cannot be confirmed
      p3: Have Taqī al-Dīn approve an observing book for use elsewhere and leave two assistants copies with a way to exchange corrections
    points_fail:
      p1: The old tables are locked away with equipment scheduled for removal. Their readers cannot retrieve them, and the office recalls the employee.
      p2: Unlabeled diagrams go into the same packet. Readers later copy an image from elsewhere as a drawing of the observatory’s equipment.
      p3: After closure each person can take part of the material. Nobody can count on borrowing the other half later.
    shift:
      p1:
        was: The Istanbul observatory was ordered demolished in 1580. Manuscripts of Taqī al-Dīn’s astronomical work survive.
      p2:
        was: Images, descriptions and observations inform research on the observatory. Surviving records do not trace every instrument.
        now: A later copyist knows which question each diagram can answer. Entries lacking provenance remain visibly open.
      p3:
        was: Demolition ended the work at the observatory. Taqī al-Dīn’s astronomical writings survive in separate manuscripts.
        now: Two copies stay in different places. The assistants can exchange corrections by page and keep a common record after the observatory closes.
        who: taqi_al_din_istanbul
        bio: Taqī al-Dīn organized observations in Istanbul. Instruments, tables and people worked together there. Manuscripts could still be read after the site was gone.
    vignettes:
      clock: Hasan reads the angle aloud while Leyla copies the clock. The next row inherits the last angle because she did not hear his second call. You ask them to repeat, one voice at a time. Both workers mark the correction beside the record, where the next reader can find it.
      copy: The bound notebook must go downstairs and Hasan will need the correction at the bench. You let Leyla copy the old and corrected rows onto one slip. She writes which was read first. When the notebook leaves, the bench still has the trail of the change.
      closure: You know how little time the building has left. Hasan has stopped at a line with no time beside the angle. You ask what he can still check before shutting the shutters. He circles one empty space. You leave without seeing another observation from this room.
  ahmed_baba_timbuktu:
    name: A name for the supplement
    place: Timbuktu
    figure: Ahmed Baba
    story: After the Moroccan army took Timbuktu in 1591, the scholar Ahmad Baba was accused of resisting the sultan and in 1594 was deported to Marrakesh. There he compiled biographical dictionaries as supplements to Ibn Farhun. He was allowed to return to Timbuktu in 1608 and died there on 22 April 1627.
    story_prose:
      opening:
        - Timbuktu, 1594. Three years ago the Moroccan army took the city. Ahmed Baba is a scholar here; he has written dozens of books on law and grammar, and his house holds a very large library.
        - In history, this year he was accused of defying the sultan and marched with his family across the Sahara, north to Marrakesh. His books were taken, or by another account lost on the road. Fourteen years later he was allowed home, and the books were gone. In this branch, the wife of a household at the far end of the lane is willing to clear a space under her bed, and the copyist in the courtyard is still writing labels for his books.
        - 'Three kinds of people can help on this trip: someone who knows old books and which chests to save first, someone bold and hardy enough to stand against the shoving on the day he is led away, and someone who knows nursing and can treat wounds and share out water in the desert.'
      outcomes:
        all: In 1608 Ahmed Baba came back to Timbuktu. The neighbour's wife had grown old. She dragged the chests out from under her bed, a layer of dust on the leather. He opened the volume on top and knew his own hand.
        p3: Fourteen years later he came back to Timbuktu. That household carried the chests out from under the bed, and he ran his hand over the volumes one by one, and sat beside the chests a long while.
        p2: The whole household, old and young, reached Marrakesh. By the city gate the child's foot had scabbed over.
        p1: He reached Marrakesh alive. Fourteen years later he was allowed home.
      none: The column going north drew far off. In that room in Timbuktu the shelves stood empty, and the door was not shut.
      desync: On the day he was led away there was a scuffle at the corner of the street, and {staff} was recalled by the office before reaching his side. The last thing in sight was a shoe trampled off in the crowd.
      not_admitted: '{staff} never got into that courtyard. The books were still on the shelves, and the day he would be led away was drawing near.'
      points:
        p3:
          class_craft: '{staff} went by the rules for mending old books, laid dry cloth between the most brittle volumes, leather facing in, flaps pressed flat, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
          class_lettered: '{staff} chose by the list of books, first his own drafts and the copies of which no other existed, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
          else: '{staff} went through the titles volume by volume, set aside first his own drafts and the rare copies, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
        p1: On the day he was led away the street was packed, and in the shoving someone drew a blade. {staff} stood in front of Ahmed Baba, pulled him into a doorway, and braced a back against the door frame. When it had passed he straightened his robe and walked out on his own, unhurt.
        p2: Half a month into the road north, a man in the column ran a high fever, and a child had worn the soles of his feet raw. Every evening after camp was made {staff} washed wounds, changed dressings, and shared out the water a measure to each. One night the child held out his own waterskin; there was one mouthful left in it.
      excerpts:
        p3: After dark two men carried the chests through two lanes into the house of the neighbour's wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.
        p2: Every evening after camp was made {staff} washed wounds, changed dressings, and shared out the water a measure to each. One night the child held out his own waterskin; there was one mouthful left in it.
        p1: '{staff} stood in front of Ahmed Baba, pulled him into a doorway, and braced a back against the door frame. When it had passed he straightened his robe and walked out on his own, unhurt.'
    relic: A leather bound manuscript
    relic_desc: A manuscript in a worn leather cover with a flap.
    points:
      p1: Before he is taken away, stop the blades turned on the arrested scholars, and keep Ahmed Baba alive for the road north
      p2: Treat the kinsmen who fall ill or hurt in the desert, share out the water, and keep the household from falling behind
      p3: Before the soldiers take the books, save a few chests of his library and leave them hidden with a family in the town
    points_fail:
      p1: In this branch he did not leave Timbuktu alive, and the biographical dictionaries of Marrakesh and the twenty nine books written in Morocco are gone.
      p2: Nobody helped up those who fell on the road, and in this branch the family's journey north was as hard as it had been.
      p3: All his books were taken, and in this branch, when he came back to Timbuktu fourteen years later, not one of his own books was left.
    shift:
      p1:
        was: In 1594 Ahmad Baba was charged with defying the sultan and taken to Marrakesh; in 1608 he was allowed home to Timbuktu.
      p2:
        was: In 1594 the family of Ahmad Baba was marched north across the Sahara with him.
        now: The kinsmen who travelled with him reached Marrakesh having suffered a little less.
      p3:
        was: In 1594 his library was taken by the Moroccans, or by another account lost on the way north; when he came back to Timbuktu in 1608 the books were gone.
        now: Before he was taken away, a few chests of books were moved under a bed in a house in the town. When he came home fourteen years later, that family carried the chests out.
        who: ahmed_baba_timbuktu
        bio: Ahmad Baba came home to Timbuktu in 1608 and found a few chests of his own books still kept by a family in the town. He taught from them in his last years.
    vignettes:
      same_name: '{staff} finds one name written two ways in two volumes and keeps both spellings on the list, with a mark between them, instead of choosing one.'
      courtyard: '{staff} sets the volumes out in the shade of the courtyard to air them after the rains, and turns each one at noon so the covers dry evenly.'
      slip: '{staff} writes the title and the first line of each volume on a narrow slip and tucks it under the leather flap, so the book can be named without opening it.'
  terence_rome:
    name: An audience that keeps leaving
    place: Rome
    figure: Terence
    story: The prologues to Terence’s Hecyra describe interruptions. They recall the draw of boxing and a tightrope performer, then a crowd rushing in when gladiators were announced. The map year locates the early productions, while the second prologue looks back on them.
    relic: A comic mask
    relic_desc: A linen mask with a raised brow, worn by an actor.
    points:
      p1: When the rumour of a tightrope walker and boxers draws the crowd away, hold the audience in their seats and help the company play The Mother-in-Law through to the end the first time
    points_fail:
      p1: The audience left as in history and the play broke off. In this branch the first staging of The Mother-in-Law still ended halfway.
    shift:
      p1:
        was: In 165 BC The Mother-in-Law was first staged; a rumour that a tightrope walker and boxers were about to perform drew the audience away, and the play could not be finished.
        now: '{staff} kept the people in their seats, and the company played The Mother-in-Law to its last line at the first attempt. The play did not have to wait five more years and two more stagings to be heard to the end.'
        who: terence_rome
        bio: In this line, Terence's The Mother-in-Law was played to the end at its first staging in 165 BC, and did not go through two more interruptions.
    vignettes:
      warning: You tell a stagehand that people will still read how the crowd left, two thousand years after it happened. He asks whether they will know what the actors were saying when they left. You stay for the rehearsal and write down the last line you could hear. The rehearsal ends with one more listener than it began with. The public performance is still ahead of you.
      audibility: You listen from beside the entrance and miss the reply to a line you heard clearly. The stagehand moves one bench and asks you to listen again. This time you hear both halves. You take home a sketch of the bench’s two positions. The street has grown too loud for you to hear the ending from outside.
      bench: You help the stagehand set one bench back from the doorway. A latecomer sits down without making a whole row stand. You mark the clear space on a scrap of wood. You leave with the rehearsal still sounding through the doorway.
  mohenjo_daro_indus:
    name: Two sides of one impression
    place: Mohenjo-daro
    figure: Indus people
    story: Recorded finds at Mohenjo-daro include carved seals bearing Indus signs. An impression and the carved seal face reverse each other. The practice design has no claim to read the Indus script.
    relic: A practice impression
    relic_desc: A test impression made from a stamp with one asymmetric mark.
    points:
      p1: Identify which view came from an impression
      p2: Hold the practice tablet still while the helper lifts the stamp
      p3: Ask the helper about the spoken label while preserving the drawing
    vignettes:
      mirror: The helper copies the cut face and files it as the impression. You lay down a fresh practice print and find the small notch on the other side. He writes a new label on the slip. You keep both views. They tell you which way a mark faces, and give you no reading of an ancient line.
      lift: You have seen museum images of seals and impressions side by side. On the bench the helper wants to tell which he is holding before lifting it. You ask him to keep both positions marked until the stamp comes away. The comparison stays with him. You leave before he makes a third copy.
      pair: You write ‘cut face’ beneath one drawing and ‘impression’ beneath the other. The helper has no need to guess which to compare. You bring back the small practice print. The real signs remain outside what you can read.
  knossos_linear_a:
    name: Leave the uncertain stroke in the margin
    place: Knossos
    figure: Minoan scribes
    story: The INSCRIBE project records KN 1 as a clay tablet in Linear A from Knossos. Linear A remains undeciphered. The map date sets the period approximately.
    relic: A clay tablet
    relic_desc: A flat tablet with rows of signs and small marks for numbers.
    points:
      p1: Hold the practice copy steady while checking one doubtful stroke
      p2: Notice whether the light changes what appears to be a sign
      p3: Use the translation chip to compare the attendant’s spoken labels
    vignettes:
      stroke: A storeroom attendant reads a scrape as another mark in the row. You change where the light falls and draw the scraped line outside the transcription so it can be checked again. You take home the difference between the drawings. The tablet has given you no translation.
      heard: You know this script will become hard to read. The attendant calls out what one of the practice trays contains. You record his label on a different slip from the marks you see. At departure you can say who told you about the goods, and still cannot match them to a real inscription.
      margin: You copy the clear strokes, then put a dot in the margin where the uncertain one falls. The next person knows exactly where to look again. You keep a sketch of that dot and leave every guessed word at the bench.
  antikythera_rhodes:
    name: A machine with no maker's name
    place: Rhodes
    figure: An unknown maker
    story: The Antikythera shipwreck yielded fragments of a toothed mechanism with overlapping astronomical cycles and inscriptions. The maker and workshop are uncertain.
    relic: A bronze gear
    relic_desc: A small toothed wheel green with age.
    points:
      p1: Recognize the marked scale on the practice face
      p2: Distinguish two cycles traced on different rings
      p3: Help the next reader match a label to its dial
    vignettes:
      rings: The visitor points to the inner scale while reading a mark on the outer one. You let them turn the practice face without following both at once. This time they finish the reading on one ring.
      calendar: One pointer comes round sooner than the visitor expected. You ask which cycle they were counting. They draw a second row instead of squeezing two cycles under one heading.
      legend: You make a separate mark for the pointer and the place it is pointing at. The visitor reads the label again and stops calling both marks the same thing.
  sappho_lesbos:
    name: Before the next breath
    place: Mytilene
    figure: Sappho
    story: A much later papyrus preserved by the British Library carries part of a poem attributed to Sappho about her brother. The modern fragment supplies part of the theme. Its missing words and the sound of the song remain unknown.
    relic: A rehearsal scrap
    relic_desc: A prop from the imagined rehearsal, with one pause marked.
    points:
      p1: Find where the listener stopped to breathe
      p2: Give the hesitant singer a second entrance before the lamp goes out
      p3: Separate the missing words from the sounds you could follow
    vignettes:
      breath: Phile has written one long run of words and keeps losing her breath halfway through. You tap the table when she actually stops. She marks that place and tries the line again. Centuries later there will be scraps of the words. You have caught a pause that a scrap could never contain.
      repeat: Myrto mouths the entrance twice without making a sound. Phile is about to take the lamp away. You tap the opening beat from beside her and she finally joins in. For one line there are two voices at the table. The second voice is the thing she had come to find.
      blank: Someone asks what the returning brother does after the last words you remember from the future fragment. You could give them an ending on the spot. Instead you mark the place where your memory of the words runs out. When the lamp goes, the unfinished space is still there.
  aristarchus_alexandria:
    name: Three degrees on the page
    place: Alexandria
    figure: Aristarchus
    story: In On the Sizes and Distances of the Sun and Moon, Aristarchus assumes that at half Moon the apparent angle between Moon and Sun is three degrees short of a right angle. His Proposition 7 derives a bound of eighteen to twenty times for the ratio of their distances from Earth. This is a result of the historical premise.
    relic: A sundial plate
    relic_desc: A bronze plate with lines for the hours and the seasons.
    points:
      p1: Identify the observer’s angle before tracing the triangle
      p2: Keep the two rays on the same sheet until the comparison is finished
      p3: Explain which part of the result depends on the assumed angle
    vignettes:
      angle: A learner has drawn a right angle at the observer. You mark the ray towards the half Moon and the one towards the Sun, then restore the three-degree difference at that point. The diagram and its premise agree again. You take both back, knowing neither is a modern distance measurement.
      limit: You know how much the estimate will matter when the angle is almost a right angle. The learner asks why his answer changes when he nudges one ray. You draw the second version separately and keep the first. You leave before either sheet can be checked against the sky.
      page: You write the assumption beside the result before folding the page. The learner can read what the estimate begins with. Your own copy has room for the angle but no note from the next half Moon.
  hipparchus_rhodes:
    name: The four edges of a star group
    place: Rhodes
    figure: Hipparchus
    story: Multispectral images of the Codex Climaci Rescriptus have revealed erased Greek astronomical writing, including numerical limits for Corona Borealis. A 2022 study attributed the passage to Hipparchus’ catalogue; that attribution has been debated.
    relic: A bronze armillary ring
    relic_desc: A graduated ring used to measure the position of a star.
    points:
      p1: Find the marked extremity of a star group on the drawing
      p2: Keep the two axes distinct while comparing the marks
      p3: Copy the extent and the stars that establish it together
    vignettes:
      edges: The observer has chosen the brightest mark as the edge of the group. You show him the dimmer point farther along the row. He moves one boundary tick and names the point in the margin. You take that revision home. The sheet does not tell you who will write the full catalogue.
      copy: You recall that later readers will have only a few limits left to compare. The observer has written a span but left out which way he measured it. You name the axis before he calls the number a second time. Your copy now has both. The other axis is still waiting when you go.
      outline: You copy the two ends of the marked span before the observer tidies the page. The helper can redraw the limits even if the sketch moves. You bring back two ticks and a direction. The next group is still waiting to be marked.
  heron_alexandria:
    name: The second movement
    place: Alexandria
    figure: Heron
    story: In the Pneumatics, Hero of Alexandria describes doors that open when a fire is kindled and shut when it goes out. The book gives a design. The miniature doors, fault and workshop helpers in this Alexandrian rehearsal are imagined, with 62 CE used as a setting.
    relic: A marked model threshold
    relic_desc: A piece from the fictional workshop model, with a nick where the door rubbed.
    points:
      p1: Help him have the Mechanics copied several times in Greek, with its figures, so the original is not lost
    points_fail:
      p1: The Greek Mechanics stayed in the few copies it had. In this branch the original was lost all the same, and the book survived only in a later Arabic translation.
    shift:
      p1:
        was: In the first century AD Heron wrote the Mechanics in Greek; the Greek original was later lost, and the complete text survives only in the Arabic translation made by Qusta ibn Luqa in the ninth century.
        now: '{staff} helped him have the Mechanics copied several times in Greek, figures and all. In this timeline the original came down to later readers.'
        who: heron_alexandria
        bio: In this line the Greek text of Heron's Mechanics was not lost, and later engineers read it in his own words.
    vignettes:
      threshold: Nikanor fits the miniature door to the bench and the return stops a finger’s width short. You mark the spot where it rubs. A flat lentil husk has caught under the model; he brushes it out. Once the door shuts, he asks you to leave the mark so he can find the spot again.
      audience: Berenikē has already seen the swing that opens the door and reaches for her cloak. You ask her to watch the far edge for one more count. When it returns she spots a sliver of light that Nikanor missed. He keeps the model on the bench for a second trial instead of sending it out.
      future: You could tell Nikanor how distant readers will put these pages beside pictures of machines. He is watching his doorway settle with a faint click. You listen with him. When you leave, he is calling the customer back to see the one motion she missed.
  pliny_stabiae:
    name: The wind at Stabiae
    place: Stabiae
    figure: Pliny the Elder
    story: Pliny the Younger later wrote to Tacitus about his uncle reaching Pomponianus at Stabiae during the eruption of 79 CE. The wind that carried him in prevented the loaded ships from leaving.
    relic: A wax tablet
    relic_desc: A wooden tablet with wax for notes, scratched with a stylus.
    points:
      p1: When the shallows and the debris from the mountain block the shore, help the Elder Pliny bring the ship in to Rectina’s coast and take her aboard
      p2: Under the falling pumice and stones, keep the Elder Pliny’s ship on its course to Stabiae, so that he lands and reaches Pomponianus
      p3: When the smell of sulphur and the dust close in on the beach at Stabiae, keep his breathing clear and save the Elder Pliny, getting him off the shore alive
    points_fail:
      p1: The ship could not come in to her shore, and in this branch nobody took Rectina aboard.
      p2: The ship was turned back before Stabiae and Pliny never reached Pomponianus. The branch came apart from history and the office recalled the employee.
      p3: He fell on the beach at Stabiae as history has it, and in this branch too he could not be kept.
    shift:
      p1:
        was: On the day of the eruption in 79, the Elder Pliny changed his plans after a message from Rectina begging to be taken away; shallows and debris from the mountain blocked the shore, and he turned for Pomponianus at Stabiae.
        now: The ship came in to her shore and Rectina was taken aboard. She went on with the ship to Stabiae.
      p2:
        was: Pliny the Younger later told Tacitus that his uncle reached Pomponianus at Stabiae on a following wind, the same wind that kept the boats from leaving.
      p3:
        was: The next day, as the smell of sulphur and the flames came near, the Elder Pliny rose on the beach at Stabiae with two slaves supporting him and collapsed; his nephew wrote that the dust laden air obstructed his breathing. His body was found two days later.
        now: '{staff} kept the dust from his breathing and got him off the beach. When the wind turned he went back by ship to Misenum, and lived some years more.'
        who: pliny_stabiae
        bio: In this line the Elder Pliny came back alive from the beach at Stabiae. He returned to the fleet at Misenum and lived on for some years.
    vignettes:
      wind: Crispus has marked every loaded chest as gone. From the doorway you watch the first newcomer come in with ash on his shoulders while the loaded boats stay in sight. Crispus crosses out the word gone. He asks you to leave him room on the tablet for the next name through the door.
      lantern: Prima has time to make one trip across the room before the lamp goes out. You take her place by the doorway while she calls to the people she can still see. The wax tablet goes dark first. She repeats the last two names aloud and you answer each one back.
      letter: You remember the letter that will be sent years later. Prima is asking about the man who carried the list, whose name will never appear there. You set your account of the coming morning aside and help her finish the roll. At the end of your visit you can still hear someone coming down the corridor.
  galen_rome:
    name: Names left after the fire
    place: Rome
    figure: Galen
    story: In On Avoiding Distress, Galen describes losing books and other possessions in Rome’s fire of 192. He distinguishes his missing copies from works he believed he could no longer recover.
    relic: An inventory leaf
    relic_desc: A fictional inventory with one surviving title and an empty copy column.
    points:
      p1: Check both book shipments before the fire so the prose glossary rolls still leave early for Campania
      p2: Persuade Galen to have a craft worker keep wax models apart from the instruments going into storage
      p3: Persuade Galen to send his Old Comedy glossary out of Rome with the earlier shipment before it is loaded
    points_fail:
      p1: The rolls are filed with the Rome stock and burn instead of reaching Campania. The branch falls out of sync and the office recalls the employee.
      p2: There is no model to consult when the craft worker has to make the instruments again.
      p3: The manuscript waits in storage for the summer shipment and is still there when the fire comes.
    shift:
      p1:
        was: When fire broke out in Rome at the end of winter in AD 192, Galen said his prose glossary had already gone to Campania.
      p2:
        was: In AD 192, the fire destroyed the instruments Galen stored in Rome, including ones he had designed.
        now: '{staff} has the craft worker leave a set of wax models at the workshop. Galen can use them to get the instruments made again.'
      p3:
        was: At the end of winter in AD 192, Galen's Old Comedy glossary burned in the fire in Rome.
        now: '{staff} gets the rolls into the earlier shipment and Galen can go on revising the text from a copy after the fire. Another copy later reaches a collection outside Rome.'
        who: galen_rome
        bio: Galen had a surviving copy of his Old Comedy glossary after the fire. He kept checking its quotations and deposited another copy for readers elsewhere.
    vignettes:
      list: Tertia calls three names from a list and counts three books. You ask her to touch the volumes that go with them. There are two. Together you leave the third title readable and put an empty mark in the copy column.
      borrow: Dion remembers lending a copy but cannot name the recipient. Tertia wants to strike the title before the list goes out. You help him recall the doorway where he handed it over. She keeps one place on the list open for a reply from that street.
      survival: You have read a work about this very loss in a copy that will resurface long after the fire. Dion asks which title he can put on tomorrow’s desk. You leave the names in the inventory and show him the two actual volumes. The missing one has not been found when you leave.
  ovid_tomis:
    name: A poem and an empty line
    place: Tomis
    figure: Ovid
    story: In Book II of Tristia, Ovid describes his offences as a poem and an error, and declines to explain the latter. The event year sets the visit during exile.
    relic: A wax writing tablet
    relic_desc: A tablet of letters in verse begun on the road to exile.
    points:
      p1: Nurse Ovid through the illness he falls into at Tomis, with no doctor, no fit food and water he cannot drink
      p2: When the riders cross the frozen Danube, keep the third book of the Tristia safe until it leaves for Rome
      p3: Let Ovid know that the poems shut out of the public libraries are still copied and read in Rome
    points_fail:
      p1: He lies ill with no one to ease him, and in this branch the first months at Tomis are as hard as he wrote them.
      p2: The book is lost in the raid and never reaches Rome. This branch falls out of step with history and the office recalls the employee.
      p3: No word of his readers reaches Tomis. He goes on writing as if Rome had forgotten him.
    shift:
      p1:
        was: Around AD 9 Ovid fell ill at Tomis; in Tristia III.3 he wrote that there was no doctor, no fit food, and water he could not get used to.
        now: '{staff} finds him clean water and food he can keep down, and sits with him through the fever. He is on his feet again sooner.'
      p2:
        was: Around AD 9 to 10 Ovid finished the third book of the Tristia at Tomis and sent it to Rome; in it he describes riders crossing the frozen Danube to raid the land.
      p3:
        was: In Tristia III.1 Ovid has his book turned away from the public libraries of Rome; he was never recalled and died at Tomis in AD 17 or 18.
        now: '{staff} tells him that his poems, kept out of the public shelves, are still copied by hand and read in Roman houses. He keeps writing to Rome knowing someone is waiting for the words.'
        who: ovid_tomis
        bio: In this branch Ovid learned in Tomis that his banned books were still read in Rome. He spent his remaining years in exile writing to readers he knew were there.
    vignettes:
      rumor: You tell the carrier that readers centuries from now will still ask what the error was. He points to an open place on the spare sheet and asks what he should put there. You add the destination on the wrapper and leave the space in the copy. The packet leaves with its uncertainty intact.
      verify: The carrier remembers a version with an extra name. You ask to see which sheet it came from. He can point to the poem and the error, and the passage ends there. You mark that line on your own wax tablet. You still have no name when the packet goes.
      wrap: 'Wind lifts the outer sheet just as the carrier reaches for the packet. You number the loose sheets and put them back in order. Your wax tablet holds one reminder: leave the unexplained line as it stands. You miss what the recipient makes of it.'
  empedocles_akragas:
    name: Where the chorus parts
    place: Akragas
    figure: Empedocles
    story: Fragments attributed to Empedocles describe four roots and a cycle of joining and separation associated with Love and Strife. Much later, Diogenes Laertius preserves conflicting stories about his death.
    relic: A scrap of verse
    relic_desc: A strip from the imagined rehearsal, marked at two turns in the verse.
    points:
      p1: Make a second copy of his hymn to Apollo and put it away safe, so the copy his household later burned by mistake is not the only one
      p2: Help him have his poem On Nature copied out in full several times, so it does not come down to us only in fragments
    points_fail:
      p1: The hymn to Apollo stayed a single copy. In this branch his household still burned it without meaning to.
      p2: On Nature stayed in the copies it had. In this branch it was still lost, and later readers had only the lines others quoted and a few scraps of papyrus.
    shift:
      p1:
        was: In the fifth century BC Empedocles wrote a hymn to Apollo; according to Diogenes Laertius, citing Aristotle, his sister, or his daughter as Hieronymus says, later burned it without meaning to.
        now: A second copy of the hymn was kept apart, and in this timeline it outlasted the fire.
      p2:
        was: In the fifth century BC Empedocles set out his teaching in the poem On Nature; the poem was later lost, and it survives only in fragments quoted by later authors and in the Strasbourg papyrus published in 1999.
        now: '{staff} helped him have On Nature copied in full several times. In this timeline the whole poem came down to later readers, and no one had to piece it together from quotations.'
        who: empedocles_akragas
        bio: In this line Empedocles' poem On Nature survived whole, and later readers could follow his four roots, Love and Strife from the first line to the last.
    vignettes:
      cue: Phaon has saved only the loudest line and both readers come in together. You mark the two places where the sense turns. At the first mark they draw their stools together; at the second they each take a step back. This time the reader facing the door can tell where she is without seeing the sheet.
      handoff: Eirenē can reach the second verse but keeps jumping straight to the last. Phaon offers to finish alone. You ask her to take the first cue and let him answer from across the room. When supper is called, she closes the rehearsal instead of leaving it halfway.
      sandal: Phaon asks which story people will remember. You almost tell him about the bronze sandal in a later account of Etna. He wants a line he can practise tomorrow. You leave the sandal out and repeat his unfinished part once with him. By the time you can look for Eirenē, the stools are stacked.
  democritus_abdera:
    name: Between the tiles
    place: Abdera
    figure: Democritus
    story: Aristotle’s Metaphysics attributes to Leucippus and Democritus an account of the full and the void, with differences of shape, order and position. He explains it in part with letters.
    relic: Two practice letter tiles
    relic_desc: Two props from the imagined lesson on order.
    points:
      p1: Swap the letter tiles without changing their shapes
      p2: Try the same arrangement on a tray with room to move
      p3: Copy both arrangements before the tiles go back in the sack
    vignettes:
      order: Eukles puts different-shaped tiles on the table and calls every change a change of shape. You switch the places of alpha and nu. He can still name each tile. The little copy of the row is different, although the tiles fit their old outlines exactly.
      gap: Doris packs the narrow tray tight to save a trip. You ask her to put one tile on the table, then slide the others through the gap she has made. She leaves the spare slot open on the second trip. The empty place is now part of the demonstration.
      atom: You start to tell Eukles what future laboratories will call an atom. He asks if that word tells him why this row of tiles reads differently. You rub out the stray note and help him draw the order the tiles were in. Doris has already taken the tray away; you cannot check the last angle again.
  hildegard_bingen:
    name: The unvoiced opening
    place: Bingen
    figure: Hildegard of Bingen
    story: Hildegard’s letter to the Mainz prelates protests a restriction on her community’s worship during a dispute over a burial. Another letter in the Mainz regesta concerns the dispute in 1179.
    relic: A chant practice page
    relic_desc: An invented page with a thread marking its opening.
    points:
      p1: Get the testimony that the dead man had been reconciled with the Church to Mainz early, so the community can sing again months sooner
    points_fail:
      p1: The interdict runs on until March 1179, and through those months the nuns may not sing the office.
    shift:
      p1:
        was: In 1178 the Mainz prelates placed Rupertsberg under interdict because a man once excommunicated was buried in its cemetery. Hildegard held that he had been reconciled before he died and would not have him dug up. The interdict was lifted only in March 1179.
        now: '{staff} carries the witnesses'' word to Mainz early and the interdict is lifted sooner. In the last year of her life the community sings for months longer.'
        who: hildegard_bingen
        bio: When her community was forbidden to sing in her eightieth year, the interdict in this timeline was lifted within weeks. Singing at Rupertsberg hardly stopped in her last year.
    vignettes:
      opening: Agnes can still find the first word but no longer reads the damaged mark above it. You ask her to compare the spare page with the line she knows. She sets a thread by the right place. Now the next person can open straight to the same beginning.
      wait: Adelheid has the words by heart and is about to file the damaged sheet away. You hold it where Agnes can trace the line once more. Adelheid copies the opening onto a spare leaf, then keeps the old page beside it. The next reader will have both.
      return: You know the community will sing again, but Adelheid has a page to put away today. You help her show the starting place without giving voice to it. When the door closes, you can see the thread between the pages. You leave before there is singing in this room again.
  nezahualcoyotl_texcoco:
    name: The name beside a song
    place: Texcoco
    figure: Nezahualcoyotl
    story: Nezahualcoyotl became lord of Texcoco in 1431 and ruled it until his death in 1472. He is remembered as a poet and a builder; a long dike across Lake Texcoco is said to have been laid out by him. Songs in Nahuatl gathered in the sixteenth century are associated with his name, though whether he made them cannot be settled.
    relic: A singer’s cue strip
    relic_desc: A practice slip with separate places for two names.
    points:
      p1: In the days after his death, while the nobles choose the heir, keep seven year old Nezahualpilli safe
      p2: Help a learner of the house learn every line of the songs tied to his name from an old singer
      p3: In his last days, let him know that his name is still remembered more than five hundred years on
    points_fail:
      p1: Before the choosing, harm comes to the boy, and in this branch Texcoco does not receive its seven year old lord as it did in history.
      p2: The old singer falls ill before the teaching is done, and in this branch only part of those songs is handed on, as before.
      p3: As in history he dies in 1472, and in this branch he never learns that later people will remember him.
    shift:
      p1:
        was: Nezahualcoyotl died in 1472, and the seven year old Nezahualpilli was chosen to succeed him.
      p2:
        was: In the late sixteenth century some songs under his name were copied into a book of songs; who first sang them, nobody knows.
        now: The learner learned the songs from beginning to end, and later taught them to a learner of their own.
      p3:
        was: Nezahualcoyotl died at Texcoco in 1472; the songs tied to his name were copied into a book a century later, and his face on the Mexican hundred peso note came more than five hundred years after.
        now: '{staff} sat with him in his last days and told him all this.'
    vignettes:
      voice: '{staff} leaves two places on a practice sheet when a singer steps forward at a line that begins with I: one for the singer, one for the name in the song.'
      drum: '{staff} lays a spare strip as a marker so the pages stay where the next singer can reach them when the first one stands.'
      later: '{staff} writes down which singer a line was heard from, and leaves the question of who first made it open.'
  maya_codices_mani:
    name: The fold remembered
    place: Mani
    figure: Maya scribes
    story: At Maní on 12 July 1562 a great many Maya folding books were burned in public. Maya communities and their knowledge went on, but only a handful of Maya books from before the conquest survive today.
    relic: A blank practice fold
    relic_desc: A fictional fold offered by its keeper.
    points:
      p1: Win the keepers’ trust and carry the folding books out of Maní in small lots, to be hidden in other villages before the burning
    points_fail:
      p1: The books stay in Maní. On 12 July they burn with the rest.
    shift:
      p1:
        was: '12 July 1562: at Maní a great many Maya folding books were burned in public. Of the books made before the conquest, only a handful survive anywhere.'
        now: Before the burning the keepers sent their books out of Maní a few at a time, to houses in other villages. Those books stayed in Maya hands.
        who: maya_codices_mani
        bio: In this timeline the scribes’ books left Maní before July 1562 and were kept in other villages, so more of the Maya book tradition came down in its own pages.
    vignettes:
      fold: The keeper lays two blank folds on a bench and asks her neighbour which one opened first in the book he remembers. You hold the paper while they compare. He cannot place the second fold. She keeps the first and leaves the other loose for the next time they talk.
      listen: The neighbour starts to retell the part the keeper lost, but they remember the order differently. You listen while each finishes. They agree on the first fold and leave the second undecided. The keeper asks you to leave her the copy that carries both accounts.
      survive: You have seen a surviving Maya codex in a later collection. The keeper asks whether you can say which book her neighbour remembers. You can name the collection but cannot connect its pages to this room. She hands you a blank practice fold for the walk back. The book they were remembering remains with their account of it.
  rongorongo_rapa_nui:
    name: Mark the side before turning the page
    place: Rapa Nui
    figure: Rapa Nui people
    story: The Australian Museum records kōhau roŋoroŋo as a Rapa Nui practice of incising signs on wood. The surviving corpus is small and the script remains largely undeciphered by scholars. It does not reproduce a tablet’s writing or a community interpretation.
    relic: Two orientation sketches
    relic_desc: Practice sketches with the upper edge marked on each.
    points:
      p1: Give each view a distinct orientation mark
      p2: Hold the first copy while the helper turns the board
      p3: Check the spoken label against the right drawing
    vignettes:
      orientation: The helper turns the plain practice board and mistakes the second sketch for the first. You put a small arrow on the paper before comparing either sketch. The two marks can be reviewed in their proper orientation. You keep the exercise; it gives you no reading of an inscription.
      label: You know later people will ask how the surviving objects were oriented. The helper tells you which position he drew from. You keep his description apart from your drawing. When you leave, the placement is clear and nothing has been guessed about what the signs mean.
      copies: You mark the upper edge on both slips before they are put together. The helper turns them back the way you saw them. You bring home two study views. The writing that inspired the exercise stays beyond the page.
  nalanda_library:
    name: A leaf number for the next lesson
    place: Nalanda
    figure: The monks of Nalanda
    story: The archaeological site of Nalanda Mahavihara preserves residential and teaching buildings from a long history of study. Dharmasvāmin’s biography describes study at Nalanda in the thirteenth century. No exact year for the loss of a library is inferred from the visit.
    relic: A lesson slip
    relic_desc: A fictional note with the place where two readers can resume.
    points:
      p1: Find where the previous reader stopped in the practice leaves
      p2: Copy the leaf reference before passing the bundle to the next reader
      p3: Keep two nearby positions apart on the lesson slip
    vignettes:
      number: The reader remembers the previous lesson by its last word. You compare two practice leaves and find the word on both. He adds a leaf number to his slip. Someone can now open the bundle in the right place. You leave with a checkable reference, but before the next lesson starts.
      later: You know a later pilgrim will still describe studying here. The reader asks what will be needed if this bundle changes hands. You make a slip that names the position without assuming the next person heard today’s reading. The bundle is handed on, and you do not hear its next reader.
      tie: Before the leaves are tied, you note which comes just before the new lesson. You put the slip beneath the outer tie, where the next reader can see it first. You keep a copy. While you are still wondering what follows, your return begins.
  meroitic_meroe:
    name: The dots that keep two groups apart
    place: Meroe
    figure: Meroitic scribes
    story: Meroitic was written in cursive and hieroglyphic forms. Cursive inscriptions can mark divisions with vertical dots. Many sign values are known to researchers, while parts of the language remain difficult to interpret. It does not claim to read a surviving inscription.
    relic: A practice transcription
    relic_desc: Two groups of marks with a clearly drawn separator.
    points:
      p1: Locate the separation mark before copying the whole row
      p2: Keep the direction of the model marked on the copy
      p3: Check an oral explanation against the marks on the exercise
    vignettes:
      dots: The copyist joins two groups while transferring them to a narrow slip. You point to the vertical dots on the practice line and put the break back in its old position. The groups can be compared again. You take the copy; a meaning for the entire line still eludes you.
      direction: You know that later readers will sometimes recover a sign more confidently than a sentence. The copyist asks you to mark where he should start. You add an arrow beyond the right edge, away from the line itself. Its direction will be clear even after you have gone.
      margin: You copy one whole group, leave the dots visible and give the next group room. The copyist can pick up the exercise without running the items together. You bring back the separated forms. The next lesson is beyond this visit.
  tupaia_tahiti:
    name: The navigator's chart
    place: Aboard the Endeavour
    figure: Tupaia
    story: Tupaia, a navigator from Raiatea, had sailed with the Endeavour since Tahiti in July 1769 and drawn a chart of the islands he knew. In June 1770 the ship struck a reef off the coast of what is now Queensland, and while it was being repaired he fell ill with scurvy. In the autumn the Endeavour put in at Batavia to refit; fever and dysentery went through the crew, the Tahitian boy Taiata died, and Tupaia died soon after.
    relic: A sketch of islands
    relic_desc: A sheet of ink and wash with small island shapes and names.
    points:
      p1: The night the ship strikes the reef, help lighten her and work the pumps, and keep the Endeavour afloat
      p2: Before the scurvy lays Tupaia low at the river mouth, bring him fresh food and cure it
      p3: At Batavia, hold back the fever that takes one man after another, and save Taiata and Tupaia
    points_fail:
      p1: At daybreak the ship is still fast on the reef with water over the hold. The branch drifts out of sync with history, and the office recalls the employee that day.
      p2: On 16 June, as in history, his gums bleed and his legs turn livid, and he lies sick for days before fish of his own catching bring him round.
      p3: As in history Taiata and then Tupaia die at Batavia, and their names are missing from the roll the day the ship sails.
    shift:
      p1:
        was: '10 to 11 June 1770: the Endeavour ran onto what is now Endeavour Reef. The crew threw six guns, ballast, water and spoiled stores overboard, and she floated off on the rising tide.'
      p2:
        was: '16 June 1770: Banks wrote that Tupaia had bad scurvy, his gums gone and livid spots on his legs, and that the remedies on board did not help.'
        now: He did not fall sick at the river mouth. While the ship was repaired he fished from the shore every day.
      p3:
        was: 'Late 1770: while the Endeavour refitted at Batavia, sickness spread through the crew. The boy Taiata died first, and Tupaia a few weeks later, far from the islands on his chart.'
        now: The two of them came through those weeks. When the Endeavour left Batavia at the end of December, both were aboard.
        who: tupaia_tahiti
        bio: In this timeline Tupaia and the boy Taiata survived the sickness at Batavia in 1770 and sailed on with the Endeavour.
    vignettes:
      pronounce: '{staff} asks a copyist, made up for the game, to read two spellings aloud before drawing a second island, and he puts a question mark by the names instead.'
      route: '{staff} asks from which island a bearing was given before a straight line is drawn between two marks, and the line is left undrawn.'
      room: '{staff} holds down the rolled corner of a sheet so that a new name can be written without covering the one before.'
  heo_nanseolheon_hanyang:
    name: A sleeve of separate poems
    place: Hanyang
    figure: Heo Nanseolheon
    story: Heo Gyun compiled surviving work by his sister Heo Nanseolheon after her death. A Joseon woodblock edition of her collected works survives from 1608.
    relic: A sheet of poems
    relic_desc: A sheet of fine paper with brushed poems on flowers and distant places.
    points:
      p1: Trace the poems Heo left with her family so her brother can later find the papers he used to make the collection
      p2: Identify the hand on the poems the author agrees to keep before the papers are copied and dispersed
      p3: Before papers can be destroyed, ask Heo to choose the poems she is willing to let others read
    points_fail:
      p1: The family loses track of the separate papers and Heo Gyun cannot compile the collection from them. The branch falls out of sync and the office recalls the employee.
      p2: Copies bearing the same title circulate together. Later readers cannot tell which changes the poet checked herself.
      p3: After she dies, the family can only choose for her from the copies that remain.
    shift:
      p1:
        was: After Heo Nanseolheon died in 1589, Heo Gyun used poems kept at her family home to compile her work.
      p2:
        was: Some poems in the Korean collection printed in 1608 later became the subject of disputes over authorship.
        now: '{staff} asks Heo to check the few poems she wants to leave and mark the parts she wrote herself.'
      p3:
        was: After Heo Nanseolheon's death in 1589, autograph papers were said to have been burned. Heo Gyun made the later selections.
        now: '{staff} asks Heo which poems she is willing to circulate and which she wants to dispose of. The later collection preserves the small group she chose herself.'
        who: heo_nanseolheon_hanyang
        bio: Heo Nanseolheon selected a small group of poems she was willing to share. Her family kept her chosen order when preparing her surviving work.
    vignettes:
      binding: The copyist has mixed a practice page in with the other sheets. You compare the two headings and fold a second sleeve for the exercises. One ambiguous page stays loose for him to check. You leave before any of the poems reaches a printed book.
      name: You know some of these poems will be read far from this house. The copyist is about to pass on a practice sheet with no heading. You ask him to copy the heading as well, and one more sheet leaves with a name. You keep your place with a blank strip of paper. The woodblock edition lies years ahead.
      fold: You help wrap the loose pages without creasing the brushwork. On the spare wrapper you mark that a title is missing. What you take away is the warning, not the page. The later collection will be put together after you are gone.
  ghalib_delhi:
    name: Look up the refrain
    place: Delhi
    figure: Mirza Ghalib
    story: By the time of this Delhi visit, Ghalib’s Urdu divan had already been printed in 1841. Its ghazals can be browsed by their rhyme and refrain endings.
    relic: A page of ghazals
    relic_desc: A page of Urdu verse in his own hand, with corrections.
    points:
      p1: Help him gather and sort the sources for the second half of the Timurid history the king has asked of him, so that he carries the work on past its first part
    points_fail:
      p1: The sources for the second half stayed scattered. In this branch he still wrote only the first part, and the sequel he had planned was never written.
    shift:
      p1:
        was: On 4 July 1850 Bahadur Shah engaged Ghalib to write a history of the Timurid house; the first part, Mehr-e nimroz, came out in 1854 or 1855 and ends with the death of Humayun, and the sequel he planned was never written.
        now: '{staff} helped him put the sources for the later reigns in order while the commission was new. In this timeline he went on past the first part and finished the history he had been asked for.'
        who: ghalib_delhi
        bio: In this line Ghalib finished the whole of the history Bahadur Shah had asked him to write, not only its first part.
    vignettes:
      refrain: The bookseller remembers the image in the verse and keeps looking for it in the wrong place. You ask for the words he heard repeated. He gives you the ending, and you find the right group in the printed book. You write one page reference. Who first brought the verse into the shop is still a mystery to him.
      future: You tell the bookseller that later readers will compare several editions. He asks if that will help him find the line he needs today. You add the edition year to his slip, then mark the ending. You leave before he can check it against another copy.
      listen: You repeat the ending to the bookseller until the two of you agree on what you heard. He tucks the slip into the right part of his book. You can bring those few words back. The rest of the verse has already slipped away from you.
  savitribai_phule_pune:
    name: A spare sari in the bag
    place: Pune
    figure: Savitribai Phule
    story: In 1848 Savitribai and Jyotirao Phule began teaching girls in Pune. Accounts of her work describe the abuse she met on the road and the spare sari she took to change into at school. The records of the later schools list her as headmistress. In 1897 she died of plague while caring for the sick.
    relic: A slate
    relic_desc: A small slate with a first row of letters in chalk.
    points:
      p1: On the hardest morning of the first month, keep her road to Bhide Wada clear so that the day's lessons begin
      p2: Bring back a girl whose family has called her home, so that she sits at her slate again
      p3: Stop the people on that road who throw things at her, so that she no longer needs a spare sari in her bag
    points_fail:
      p1: That day she did not reach the school, and the door at Bhide Wada stayed shut.
      p2: In this branch there was one girl fewer at the slates in Bhide Wada.
      p3: She still carried a spare sari in her bag every day, as in history.
    shift:
      p1:
        was: From January 1848 the girls' school at Bhide Wada kept its classes, and Savitribai walked there every day to teach.
      p2:
        was: In 1848 many families in Pune were against girls going to school.
        now: The girl came back to her lessons.
      p3:
        was: From 1848 she was pelted with stones and dung on the way to school, and carried a spare sari to change into when she arrived.
        now: From one spring morning on nobody by the road threw anything at her again, and the spare sari stayed folded in the bag.
    vignettes:
      slate: '{staff} turns the slate sideways so two girls can reach it at once. When they are called home, each has left a mark the other can point to.'
      road: '{staff} walks half a step behind on the road to Budhwar Peth and keeps the bag on the side away from the doorways. Nobody in the street says anything that morning.'
      chalk: '{staff} breaks the last stick of chalk in two so that there is one for the board and one for the slates, and writes down what is needed from the market.'
  zhu_shijie_yangzhou:
    name: The four sides of the counting board
    place: Yangzhou
    figure: Zhu Shijie
    story: 'In the preface to Zhu Shijie’s Jade Mirror of the Four Unknowns, Mo Ruo describes the arrangement of the four unknowns around the centre: heaven below, earth left, human right and thing above. The preface is dated 1303.'
    relic: A set of counting rods
    relic_desc: Slender rods laid in rows to stand for numbers.
    points:
      p1: Help Zhu Shijie get more copies of the Jade Mirror of the Four Unknowns cut and copied in Yangzhou and into his students' hands, so the book is not lost in later times
    points_fail:
      p1: As in history only a few copies went round. In this branch the book still could not be found in China by the late eighteenth century, and Ruan Yuan had to search for it.
    shift:
      p1:
        was: In 1303 the Jade Mirror of the Four Unknowns came out with a preface by Mo Ruo; by the second half of the eighteenth century it was lost in China, and Ruan Yuan could not find it when compiling his Biographies of Astronomers and Mathematicians in 1799, only coming on a copy some years later.
        now: '{staff} helped him get more copies made and handed to the students who came to learn from him. In this branch the book always had readers, and nobody had to go looking for it.'
        who: zhu_shijie_yangzhou
        bio: In this line more copies of the Jade Mirror were made when it came out in 1303, and they stayed with his students in many places and came down without a break.
    vignettes:
      rotate: Two learners have copied the same board from opposite sides. You mark the bottom before comparing their sheets. The earth and human groups exchange places on one copy. You keep the corrected diagram. The long elimination is still ahead of them.
      hand: You ask why the learner has put all four names in one line. He says he can remember the names that way. You keep his line but place four markers around a centre so he can also recover the layout. By the time he clears the board, you have seen how to begin, and not how his exercise ends.
      outline: Before the counters go back into their box, you draw four short lines around the centre and note which end is the bottom. You can reproduce the arrangement when you get home. You leave the larger calculation on the learner’s board.
  qin_jiushao_huzhou:
    name: The answer must pass both rows
    place: Huzhou
    figure: Qin Jiushao
    story: The first volume of Qin Jiushao’s Mathematical Treatise in Nine Sections sets out the Great Expansion procedures for problems involving remainders. The event year is the traditional date associated with the book.
    relic: A counting rod
    relic_desc: A bamboo counting rod worn smooth.
    points:
      p1: Help Qin Jiushao have more fair copies of the Mathematical Treatise in Nine Sections made and get the book into a printer's hands, so that it does not pass down only in manuscript
    points_fail:
      p1: The book went on as a manuscript as history has it, and waited almost six hundred years for a printed edition.
    shift:
      p1:
        was: The Mathematical Treatise in Nine Sections existed in manuscript in 1247. It was copied into the Yongle Encyclopedia in 1421 and the Siku Quanshu in 1787, and a woodblock edition appeared only in 1842.
        now: Several fair copies left Huzhou, and a printed edition was cut within his lifetime. Readers in other cities could study it in his own order.
        who: qin_jiushao_huzhou
        bio: In this line Qin Jiushao's treatise was printed while he lived. It was read and taught in more than one place in the Song.
    vignettes:
      witness: The learner puts five counters down. Groups of three leave two, just as requested, but groups of five leave none. You ask him to test eight. That leaves two in the first row and three in the second. He crosses out one answer. You leave before they start a problem with a third row.
      rows: You know the procedure will be studied long after the learner forgets this exercise. He asks why two remainders cannot be written in one box. You have him label the one for groups of three and the one for groups of five. He can now test the next answer on his own. That next answer is still out of reach when you go.
      counters: You make eight counters into groups of three and then into groups of five. Each time you record only the left-over counters before rebuilding the pile. You bring home two checked rows. The larger problem stays on the table.
  al_biruni_ghazna:
    name: Two lines above the plain
    place: Ghazna
    figure: Al-Biruni
    story: In his Determination of Coordinates, al-Biruni reports using a mountain near Nandana to estimate the size of Earth. The height of the mountain and the dip of the visible horizon below the horizontal are separate measurements.
    relic: An astrolabe
    relic_desc: A brass astrolabe with its scale polished by fingers.
    points:
      p1: Identify the horizon line and the horizontal line on the sketch
      p2: Reach the observation spot with a complete height record
      p3: Explain why the slope of the mountain is a separate quantity
    vignettes:
      angle: The survey helper has drawn his angle along the slope of the mountain. You extend a horizontal line from the point where he stands, then draw the lower sightline towards the horizon. The mark moves to a different wedge. You carry home the corrected diagram, but the final figure is still being worked on.
      height: You know the book will keep both a height and an angle. At the top the survey helper calls out only the angle. You bring up the slip for the height and have him add it to the other reading. When the plain disappears into haze, the two records are already side by side. You will not see the next clear horizon.
      fold: You fold one slip around the other and mark which came from the mountain and which from looking across the plain. The survey helper can find them again without guessing. You take home the names of two measurements, and no finished radius.
  al_razi_rayy:
    name: A heading for a doubt
    place: Rayy
    figure: Al-Razi
    story: In Doubts about Galen, al-Razi puts claims in Galen’s writings alongside his own observations and marks occasions on which he withheld judgment. Neither the exchange nor the notes are from the treatise.
    relic: A margin note under two headings
    relic_desc: An invented reading note with a source and a separate question.
    points:
      p1: Check whether the margin describes an observation or a conclusion
      p2: Give the reader time to say what she still doubts
      p3: Keep the observation with its source as the notes are handed over
    vignettes:
      columns: Layla has copied two lines under Galen’s name. The first is a claim she can find in the book. The second is what a reader said after putting it down. You ask her to leave the name with the first line and give the other its own heading. A new reader can now see where a question began.
      doubt: Farhad wants to finish the page with a verdict. Layla is still trying to recall what the observer actually said. You slow the reading and give her the last line. She writes what she can remember, then follows it with a question that can be carried to the next reader.
      edition: You have seen a later copy of the book that records these kinds of doubts. Farhad only has this leaf and asks what to call the open line. You help him mark it as awaiting a comparison. The lamp is removed before the next copy arrives.
  sushruta_varanasi:
    name: The cloth before the lesson
    place: Varanasi
    figure: Sushruta
    story: The Suśruta Saṃhitā describes learners practising on models, including cloth. The text has a long transmission history.
    relic: A marked practice cloth
    relic_desc: A fictional piece kept to compare two attempts.
    points:
      p1: Find which piece of cloth was kept to show the earlier attempt
      p2: Hold the practice pieces in place while the apprentice compares them
      p3: Help the next learner look over both attempts
    vignettes:
      cloth: Mira is about to put the rougher piece in the scrap pile. You show her where Ananda marked his first try. She compares the marks with the piece he made later and leaves both on the bench. Ananda can now point to the one difference he worked on.
      turn: Ananda keeps explaining his own cloth while Mira waits to touch it. You put both pieces on the table where she can reach them and ask him to let her point first. Her question is about a part he had skipped. They keep the piece at the bench for the next learner.
      text: You know later readers will find a chapter about practice models. Mira only has a piece of cloth and a small mark she cannot place. You listen while she finds the earlier piece for herself. By the time the next lesson starts, you have already left.
  zhuge_liang_wuzhang:
    name: An answer before the lamp goes out
    place: Wuzhang Plains
    figure: Zhuge Liang
    story: In 234 Zhuge Liang fell ill and died with the army at Wuzhang Plains, his last campaign unfinished. He had privately recommended Jiang Wan to the emperor as his successor. Jiang was appointed after Zhuge Liang died. The record does not say that Zhuge Liang lived to see a reply.
    relic: A scribe's unused tally
    relic_desc: A game keepsake. The tally has one space for the outgoing letter and one for the reply.
    points:
      p1: Help the scribe keep the written recommendation with the letters going to Chengdu
      p2: Have routine papers held at the desk and give the sick man an afternoon to rest
      p3: Put Jiang Wan's acknowledgment in Zhuge Liang's hands while he can still read it
    points_fail:
      p1: In this branch the recommendation is misfiled and misses the regular dispatch. The court has to wait for it.
      p2: Even in the sickroom, routine papers keep arriving at his bedside.
      p3: By the time the answer arrives, there is nobody left to read it.
    shift:
      p1:
        was: The biography records Zhuge Liang's private recommendation to the emperor without describing how a reply would have reached the camp.
      p2:
        was: Zhuge Liang fell ill and died with the army.
        now: The routine papers wait at the desk and the sickroom stays quiet for one afternoon.
      p3:
        was: Jiang Wan took office after Zhuge Liang's death. The biographies do not record an acknowledgment reaching the camp during his life.
        now: In this branch, Chengdu sends a private acknowledgment early. Zhuge Liang reads that Jiang Wan has agreed to take over. After his death, Jiang still takes office.
    vignettes:
      bowl: The attendant changes the bowl of water at the bedside. The water from the last visit is still warm.
      register: The scribe leaves the return column empty. The date can go in when something arrives.
      empty: '{staff} lays the closed register beside the lamp, within reach of the bed.'
  borobudur_java:
    name: From squares to circles
    place: Java
    figure: The builders of Borobudur
    story: Borobudur in central Java was built in the eighth and ninth centuries. UNESCO’s listing describes its square terraces below and three circular platforms above. The year marks the building period approximately.
    relic: A pair of terrace outlines
    relic_desc: Two work sketches of the change from a square terrace to a circular platform.
    points:
      p1: Hold the practice sheets together at their shared stair
      p2: Carry the plan to the change from square to circular platforms
      p3: Catch an extra corner in the circular part of the sketch
    vignettes:
      corner: The drawing helper has repeated the shape of the lower sheet on the upper one. You trace the turn on the square plan, then follow the curved edge on the other. He removes one false corner. You take both outlines back. The highest point is still beyond the part of the route you covered.
      stair: You have seen a later plan of the tiers from above. The helper on the ground sees only the next stair. You keep the stair marked on both pieces of paper so he can tell where the shape changes after the climb. You leave before he makes the upper circuit.
      layers: You mark a square edge below the stair and a curved edge above it. The helper asks you to keep the marks on separate sheets while he checks the plan. You take the two outlines home. The whole monument will not fit on either sheet alone.
  qin_liangyu_shizhu:
    name: Qin Liangyu and the supply ledger
    place: Shizhu
    figure: Qin Liangyu
    story: The History of Ming records that in 1630 Qin Liangyu and Qin Yiming answered the summons to aid the capital, and that she used family funds for supplies. The Shizhu gazetteer also records the summons and expedition.
    relic: Copy of a Shizhu receipt
    relic_desc: A fictional receipt with one name in the margin and another beside a bundle.
    points:
      p1: Verify each transfer of Qin Liangyu’s own funds so the people handling the accounts at Shizhu can sign for what they receive
      p2: Keep the transfer notes apart from household expenses. Send Shizhu a copy identifying the people who handled payments and the dates
      p3: Have Qin approve an expense account her relatives can check. Record any delayed payment still needing confirmation
    points_fail:
      p1: The clerk loses track of who has received a payment. The transfer fails and the office recalls the employee.
      p2: Public and household expenses go into the same book. A family member has to ask everyone who handled a disputed payment.
      p3: Amounts still owed are treated as paid, and those who cannot return have no way to check them.
    shift:
      p1:
        was: The History of Ming says Qin Liangyu and Qin Yiming answered a summons in 1630 and that she contributed her own family funds.
      p2:
        was: The biography describes her expenditure without preserving an itemized ledger.
        now: The retained copy distinguishes funds already paid from those still being advanced by the family.
      p3:
        was: The local gazetteer records the summons and departure. Later records mainly report the expedition and her service.
        now: The household can check a missing entry against its copy. A person who handled a payment can trace how the amount was recorded.
        who: qin_liangyu_shizhu
        bio: Qin Liangyu’s ties to Shizhu were longstanding. Records identify her contribution from household funds. The branch follows how the transfer could be recorded.
    vignettes:
      ledger: Two lines begin with nearly the same name. The clerk has read them as one. You underline the characters that differ, and he calls both bearers back to check.
      hands: The waiting carrier has both hands on a bundle and cannot open her slip. You hold it flat and read the name back to her before she lifts it again.
      copy: The clerk reads the entries aloud while you follow the copy. At the last line you turn the two sheets side by side and leave them on the table.
  zeami_sado:
    name: The island on the page
    place: Sado Island
    figure: Zeami
    story: In the eighth month of 1432 Zeami's eldest son Motomasa, the heir of his troupe, died far from home in Ise. Some months later Zeami wrote that with Motomasa gone the way of their school had been cut off. In 1434, past seventy, he was exiled to Sado, and on the island he wrote Kintōsho. His treatises stayed hidden for centuries and were published only in 1909.
    relic: A Noh mask
    relic_desc: A small wooden mask with a fine line of lacquer between the brows.
    points:
      p1: Stay beside Zeami on Sado and let him know that what he wrote will be handed on and read
    points_fail:
      p1: As in history he lives out his exile believing that the line of his art ended with his son.
    shift:
      p1:
        was: '1433: some seven months after Motomasa''s death, Zeami wrote that the way of their school had been cut off and the troupe was already ruined. In 1434 he was exiled to Sado. His treatises stayed hidden for centuries and were published only in 1909.'
        now: On Sado he came to know that what he had written would be handed on and still read centuries later.
        who: zeami_sado
        bio: In this timeline Zeami spent his exile on Sado knowing that his writings on his art would outlast him.
    vignettes:
      later: You tell the reader that people will still use the name in books about Sado. He tries the words as a place name, then as something a person longs for. You mark both pauses on a slip. The boat that brought Zeami to Sado has already gone.
      mask: The reader holds up a practice mask and loses his place when he lowers it. You mark the start of the line on a loose slip and prop it where he can find it again. The mask goes back on its peg. You miss the reading after yours.
      wind: A draught scatters the reading slips. You help the reader recover one from under the bench and hold it down with a pebble. He reads that line once more. When you leave, the paper stays under the stone and you carry the pause away in your notes.
  ino_tadataka_ezo:
    name: The bend left out of the line
    place: Hokkaido
    figure: Ino Tadataka
    story: On 11 June 1800 Ino Tadataka left Edo on his first survey. The party measured as it went north through Tōhoku, crossed to Ezo, and followed the coast as far as Nishibetsu before turning back. The whole expedition, not just the survey on the island, took about six months. Ino died in 1818. His colleagues completed the coastal atlas in 1821.
    relic: A measuring staff
    relic_desc: A thin staff for measuring paces, marked with a scale.
    points:
      p1: When the money runs low, keep the party on its way so that the line is laid as far as Nishibetsu in time
      p2: Help him measure one stretch of coast with a cord instead of by paces, so that its numbers are right first
      p3: Help him lay the line on past Nishibetsu, so that this survey takes in a stretch of coast it never reached
    points_fail:
      p1: The party could not hold out and turned back before Nishibetsu, and back in Edo there was no map of that road.
      p2: In this branch every stretch of Ezo is still only a count of paces.
      p3: The survey still turned back at Nishibetsu, as in history.
    shift:
      p1:
        was: In 1800 the survey party of Ino Tadataka worked along the south east coast of Ezo as far as Nishibetsu, and turned back for Edo.
      p2:
        was: The first survey, in 1800, was paced out on foot; the measuring rope came in only with the second.
        now: One stretch of the coast of Ezo was measured with a cord first.
      p3:
        was: The first survey of 1800 ended at Nishibetsu, and the rest of the coast of Hokkaido waited for later surveys.
        now: The line went on past Nishibetsu for one more stretch, and the sheets he brought back to Edo showed a little more coast.
    vignettes:
      bend: '{staff} sees a bend of the shore about to be drawn as part of a straight line and asks for one more bearing at the turn, so the bend stays on the page.'
      repeat: '{staff} walks a stretch a second time at the same pace and writes the two counts side by side, without choosing between them.'
      sketch: '{staff} draws the outline of a headland on the back of a tally sheet while the others rest, and marks where the line was laid.'
  djenne_builders:
    name: A patch at the edge of the yard
    place: Djenne
    figure: The mud brick builders of Djenne
    story: Djenné is known for earthen architecture. The Great Mosque visible today was rebuilt in 1907. It does not stage the rebuilding or a present-day ceremony.
    relic: A mud brick
    relic_desc: A hard sun dried brick with bits of rice husk showing where it is broken.
    points:
      p1: Keep the practice board instead of letting it slip into the fresh coat
      p2: Carry a second small batch to the other face of the trial wall
      p3: Agree with the helper on which patch will be checked again
    vignettes:
      mark: The yard helper has tried two small patches and forgotten which came from each bowl. You set out two scraps with names rather than mark the wall. Each test now has a record. You leave before the sun reaches the other face.
      time: You know the building visitors will see centuries later has its own history of rebuilding. Today the helper wants to spread one bowl across the test wall. You ask for a small patch first and give him a spot to check after it dries. You leave knowing where he will look, and not what he will find.
      shade: You draw the trial patch and the line between sunlight and shadow. The helper takes the sketch to the bench so he can check the same place later. Your copy has one patch on it. The whole wall is still to do.
  ahmes_thebes:
    name: The round field on the papyrus
    place: Thebes
    figure: Ahmes
    story: Problem 50 of the Rhind Mathematical Papyrus asks for the area of a round field of diameter nine. Its rule removes one ninth of the diameter and squares the remainder, giving 64. The scribe Ahmose copied the surviving roll from earlier material.
    relic: A scrap of papyrus
    relic_desc: A small scrap of papyrus written in red and black.
    points:
      p1: Work out the length that remains before squaring
      p2: Keep the rule and its worked example together
      p3: Show the assistant why the square is drawn with a side of eight
    vignettes:
      table: The assistant has written 81 in the answer box, having squared the whole diameter. You put the removed ninth beside his nine, then square the remaining eight. He corrects one entry to 64. You take home both lines. No one has measured a real field during your visit.
      outline: You know later readers will compare the rule with a modern formula. The assistant asks where the number eight comes from. You sketch the diameter and cross off one of nine equal marks. The drawing stays with his exercise. You leave before he tries the rule on a different field.
      roll: You copy the diameter, the missing ninth and the remaining length before the roll is closed. The assistant can square the right number after you leave. You carry the three numbers away, without learning how much seed the field would need.
  quipu_cusco:
    name: The cord you count twice
    place: Cusco
    figure: The keepers of the knotted cords
    story: The study Khipu Archives identifies sets of Inka knotted-cord records with matching numerical data and discusses duplicate accounting. Many numerical khipu use decimal place value. It does not assign meanings to undeciphered signs.
    relic: A bundle of knotted cords
    relic_desc: A bundle of cords of different lengths, tied with knots of different sizes.
    points:
      p1: Tell the places apart before reading the practice value
      p2: Read the matching bundle separately before comparing the two
      p3: Have the keeper preserve the mismatch until it can be checked
    vignettes:
      places: The keeper reads the same total from two cords at a glance. You separate tens from units on the practice slips and find 23 on one and 32 on the other. He tags the pair for another count. You take the comparison home. It will not tell you which total is right.
      copies: You know that later researchers will compare matching cords. The keeper is about to set one of these aside without its partner. You put the two readings in separate rows and mark the place where their readings part company. Both cords stay together. The next keeper’s answer is still to come.
      tag: You follow the keeper in counting one practice cord from its free end. Before the two are tied away you mark which number belongs to which cord. That is all you take back. The kind of goods the exercise stands for remains unlabelled.
  humboldt_chimborazo:
    name: The gully above the snow line
    place: Mount Chimborazo, Ecuador
    figure: Alexander von Humboldt
    story: On 23 June 1802 Humboldt climbed Chimborazo with Aimé Bonpland and Carlos Montúfar. The porters would go no further; the three went on with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them, and they turned back.
    relic: A barometer
    relic_desc: A mercury barometer with heights marked on the glass.
    points:
      p1: Before the deep gully blocks the way on 23 June, help the party hold out against the mountain sickness, find a way across, reach the summit of Chimborazo and come down safely
    points_fail:
      p1: As in history they turn back at the gully, below the summit.
    shift:
      p1:
        was: '23 June 1802: Humboldt, Bonpland and Carlos Montúfar climbed Chimborazo with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them and they turned back.'
        now: They crossed the gully, stood on the summit of Chimborazo, and came back down to camp safely.
        who: humboldt_chimborazo
        bio: In this timeline Humboldt reached the summit of Chimborazo with Bonpland and Montúfar on 23 June 1802, and came down safely.
    vignettes:
      turn: A fictional reader has drawn the summit at the end of the route. You ask where the diary stops describing the ascent. They move their last mark down the slope and leave the top untouched.
      units: The reader wants to copy a height without its unit. You keep it attached to the original measurement and leave space for a separate modern conversion.
      names: You ask the reader to leave space beside Humboldt for the other travellers' names. When the note is folded, the list still follows the account of the day's attempt.
  banneker_maryland:
    name: Two things in the packet
    place: Maryland
    figure: Benjamin Banneker
    story: On 19 August 1791, Benjamin Banneker wrote to Thomas Jefferson, sent a manuscript of his almanac for the following year, and challenged racial prejudice and slavery. The packing table and its two helpers are imagined. Players can protect the connection between the letter and the work it accompanies.
    relic: A duplicate wrapper label
    relic_desc: A fictional copy naming the almanac and its accompanying letter.
    points:
      p1: Keep the printer's copy separate so Banneker can send his handwritten almanac with the letter
      p2: Use the working sheets to persuade the printer to keep a calculation readers can check
      p3: Persuade Banneker to deposit a checked copy of his observations away from the house
    points_fail:
      p1: The printer takes the only copy available for the letter. The branch falls out of sync and the office recalls the employee.
      p2: The results are printed, but readers have only the endorsement and the figures and cannot retrace the calculation.
      p3: Most of the working papers remain at home and burn with the house.
    shift:
      p1:
        was: On 19 August 1791, Banneker wrote to Jefferson and enclosed a handwritten copy of his almanac.
      p2:
        was: The Baltimore almanac for 1792 printed Banneker's tables and a letter of endorsement.
        now: '{staff} helps Banneker choose one worked calculation. The printer includes it beside the table so readers can reproduce it.'
      p3:
        was: On the day of Banneker's funeral in 1806, a fire destroyed his home and much of his manuscript material.
        now: '{staff} asks Banneker which notebooks can be kept elsewhere and finds a printer willing to copy them. After the fire, readers can still consult a copy of his observations and working calculations.'
        who: banneker_maryland
        bio: Banneker left a copy of his observations in a separate place. Later readers could consult how he worked out the figures in his almanacs.
    vignettes:
      packet: Rachel sees the months on the first page and begins a label for a book of calculations. You set the letter beside it and ask her to finish the label after reading the address. She threads one tie through both wrappers. The tables will travel under the sender’s name and with his argument still attached.
      handoff: Isaac has room in the satchel for one flat packet. The wax on the letter is still soft. You hold the wrapper open while he slips in a folded guard to keep the letter from sticking to the tables. He leaves with both. You stay long enough to watch the empty square the packet left on the table.
      reply: You know a reply will come swiftly. Isaac asks whether that settles what the letter has raised. You copy the date on the outgoing packet and leave the space for a reply as you found it. The packet is on its way. No promise has come back through the door.
  seacole_balaklava:
    name: The inn she found her own way to
    place: Balaklava
    figure: Mary Seacole
    story: Mary Seacole's 1857 memoir describes the British Hotel she ran with Thomas Day near Balaklava, the goods it sold and the people who came there in 1855.
    relic: A medicine chest
    relic_desc: An old wooden chest with compartments for herbs and gauze.
    points:
      p1: On 18 June, the day the assault on the Redan fails, keep Seacole at her work under fire beside the temporary hospital on the Woronzoff Road
      p2: When she throws herself down from a shell and dislocates her right thumb, set the joint and splint it on the spot
      p3: Stop the thieves who come in the night for the horses of the British Hotel
      p4: After Sevastopol falls, persuade Seacole and Thomas Day to stop buying stock and settle their accounts, so that peace does not leave them bankrupt
    points_fail:
      p1: She never reaches the temporary hospital that day and the wounded wait by the road unbandaged. This branch falls out of step with history and the office recalls the employee.
      p2: The thumb is only bound up in haste, and in this branch, as in history, it never returns to its proper shape.
      p3: Half the stable is empty by morning, and the hotel has to borrow animals from the Land Transport camp to fetch its goods.
      p4: When the army leaves after the peace the stock will not sell, and in November 1856 the two partners are declared bankrupt in London.
    shift:
      p1:
        was: On 18 June 1855, the day the allied assault on the Redan failed, Seacole carried bandages and food under fire to the temporary hospital by the Woronzoff Road and helped the doctors with the wounded.
      p2:
        was: On 18 June 1855 Seacole threw herself down to escape a shell and dislocated her right thumb; it was bound up on the spot and never returned to its proper shape.
        now: '{staff} sets the joint and splints it there and then. A few weeks later her right hand mixes medicines and ties bandages as before.'
      p3:
        was: In 1855 the British Hotel at Spring Hill was robbed again and again; one morning most of its horses were gone.
        now: '{staff} stops the men leading the horses away during the night watch. The next day the hotel carts go down to Balaklava as usual.'
      p4:
        was: After the peace of March 1856 the army left quickly and Seacole and Day were left with unsold stock and debts; a bankruptcy petition was filed against them in October 1856 and they were declared bankrupt in November.
        now: '{staff} persuades the two partners in the autumn to stop the large orders and to collect what they are owed. When the peace comes their stock is small, they leave the Crimea with their accounts settled, and they never stand before the bankruptcy court.'
        who: seacole_balaklava
        bio: In this timeline Seacole came home from the Crimea without being bankrupt and with some capital of her own. She did not have to live on a public subscription and went on nursing and travelling on her own money.
    vignettes:
      meal: A fictional customer has been standing so long that they cannot explain what they came for. You find a seat first. By the time the attendant returns, the customer can ask for supper in their own words.
      counter: Two customers repeat the same order, each thinking the other has not been heard. You ask the attendant to read back what they wrote. One tray turns out to be enough.
      shelf: The attendant calls for room at the end of the counter. You move two empty plates and put a stool where a waiting guest can sit without holding up the next customer.
  mitchell_nantucket:
    name: Mark the field before the cloud
    place: Nantucket
    figure: Maria Mitchell
    story: 'A letter reproduced in Maria Mitchell: Life, Letters, and Journals reports that Mitchell discovered a telescopic comet at Nantucket on 1 October 1847. Her father noted the discovery and wrote to the Harvard observatory’s director by the first mail to the mainland.'
    relic: A small telescope
    relic_desc: A small brass telescope with a trace of sea salt on the tube.
    points:
      p1: Get the discovery notice onto the first mail boat so the mainland observatory can follow the comet
      p2: Send a second notice to the designated Danish recipient on the first boat and spare Mitchell the later medal appeal
    points_fail:
      p1: The observations remain in the family's journal, but the first boat sails without the notice. The observatory misses its first chance to follow it, and the office recalls the employee.
      p2: Only the observatory gets the notice. The judges cannot grant the medal under the usual rules because the designated recipient was not notified.
    shift:
      p1:
        was: On 3 October 1847 Mitchell's father wrote to the Cambridge observatory about the discovery on the 1st. His letter left on the first mail after the sighting.
      p2:
        was: In 1848 the judges ruled that the notice had gone to the wrong recipient. Mitchell eventually received the Danish medal after a separate appeal.
        now: '{staff} checks the rules and helps the family put another notice on the same boat. The judges can consider the claim under the usual rules because the notice arrived through the proper channel.'
        who: mitchell_nantucket
        bio: Mitchell received recognition on the strength of a timely report. She began recording when she saw an object, when she sent the notice, and who received it.
    vignettes:
      field: The helper has drawn the faint spot by itself. You ask what he would use to point the instrument back to it. He adds two stars and a direction before the cloud comes over. You copy those marks. You still do not have a later position to compare.
      post: You know word will have to travel off the island. The helper wants to record a discovery before he has described what was seen. You put the date and the field on a separate slip and leave the next line for verification. It remains blank when the packet goes down to the shore.
      cloud: You wait with the drawing in hand while cloud covers the faint mark. Before folding it you circle a star you expect to find even if the faint object is gone. You bring back a position that can be sought again. No one sees it a second time before your return.
  caroline_herschel_slough:
    name: The one who swept the sky
    place: Slough
    figure: Caroline Herschel
    story: Caroline Herschel reported noticing an object unlike the sharply defined stars on 1 August 1786. She compared observations before writing to Charles Blagden.
    relic: A sky sweep ruler
    relic_desc: A wooden ruler with a scale, used to mark the swept patches on a star chart.
    points:
      p1: Fix the positions of the reference stars before the haze closes in and protect the evidence for Herschel's first comet
      p2: Use Herschel's first comet report to secure regular nights for her own observations
    points_fail:
      p1: The haze hides the reference stars. The object returns the next evening, but there is no earlier position to compare. The branch loses sync and the employee is recalled.
      p2: When her brother uses the large telescope she spends the evening taking down his readings, and her own observations still fit around his.
    shift:
      p1:
        was: On 1 and 2 August 1786 Caroline Herschel recorded the movement of a suspected comet and sent out her observations and drawings.
      p2:
        was: In 1787 Caroline Herschel received a salary as her brother's assistant; in her first report she had already explained how that work limited her observing time.
        now: '{staff} helps Herschel put her observing schedule beside her comet report and place both before a supporter. The later arrangement for her work reserves several nights a month for her own observations.'
        who: caroline_herschel_slough
        bio: As a paid assistant, Herschel had regular nights allotted to her own work and could plan her comet searches in advance.
    vignettes:
      fixed: You mark two bright neighbours before adding the fuzzy object. On the second drawing the stars remain a useful guide, even after the pages have shifted.
      doubt: The helper suggests cleaning the glass. You ask what the other stars look like through it. They stay sharp, and the helper keeps the uncertain mark on the sheet.
      lamp: You shade the lamp while the helper writes the hour. When the cover goes back on, both drawings still have times beside them.
  kovalevskaya_stockholm:
    name: The conditions on the first page
    place: Stockholm
    figure: Sofia Kovalevskaya
    story: Kovalevskaya’s paper on rotation about a fixed point appeared in Acta Mathematica in 1889. The work identifies an integrable case with particular conditions on the moments of inertia and the position of the centre of mass.
    relic: A top model
    relic_desc: A brass spinning top with a number cut into its axis.
    points:
      p1: Keep a Stockholm copy of the anonymous entry. Check that its identifying envelope matches before sending it to the Paris judges
      p2: Bring the prize record and her existing duties to the Stockholm university. Ask for written terms and pay before her old appointment expires
    points_fail:
      p1: The entry has the wrong identifying envelope and cannot be matched to its author after judging. The office recalls the employee.
      p2: The news reaches the university. Her teaching hours and pay are still discussed only informally.
    shift:
      p1:
        was: Kovalevskaya won the Paris Academy’s 1888 Prix Bordin for work on rigid-body rotation.
      p2:
        was: She became a full professor in Stockholm in 1889. Private correspondence also records questions about the length of her appointment and pay.
        now: The university sets out the dates and pay in writing early. She can plan the next semester and the department has a commitment it can consult.
        who: kovalevskaya_stockholm
        bio: Kovalevskaya taught and studied rigid-body rotation in Stockholm. The international prize and her local working conditions were decided by different institutions.
    vignettes:
      conditions: The shorthand on a practice sheet says ‘a rotating body’. You use the first page to restore two qualifications, one for inertia and one for where the centre of mass sits. The proofreader copies both onto his slip. You can take the correction away, but the journal issue is still in the future.
      diagram: The proofreader wants to try a toy top. You sketch a point that stays fixed and mark the separate point that represents the centre of mass. He can point out which is which on the next copy. The toy still spins when your time is up, and it has not proved the paper.
      clip: You put the assumptions on the outside of the exercise and fold its loose diagram into it. The next reader will see the conditions before the result. You bring home the outline of a top and leave the proof on the desk.
  chaco_sun_watchers:
    name: A second mark on a portable board
    place: Chaco Canyon, New Mexico
    figure: The people of Chaco Canyon
    story: Published measurements at Fajada Butte in Chaco Canyon record sunlight falling across spiral rock markings near midday at particular times of year. The lesson does not date the real markings or assign an original purpose to them.
    relic: A sketch of two shadow edges
    relic_desc: A sketch of two traces made from the same board position.
    points:
      p1: Notice the change at the edge of the shadow
      p2: Keep the board in the same place for a second mark
      p3: Stay at the mark while the helper walks back to check it
    vignettes:
      two: The helper has turned the board to face you, and now the two lines seem to disagree. You set its foot back at the first mark and ask for a new trace. You can compare the two positions this time. Next season is outside the length of your visit.
      sky: You know researchers will later study how light falls on the rock. The helper wants to give a name to the shadow on this small board. You ask him first to draw the place where the board stood. You leave with a drawing of the setup, and miss the second clear observation.
      wait: You put down a loose pebble beside the board, then wait for a second outline before lifting it. Two marks on the paper now share one position. You bring those marks home. You did not stay long enough to say how they change across the year.
  rapa_nui_moai:
    name: Two views of the same quarry face
    place: Rapa Nui, Rano Raraku
    figure: The Rapa Nui carvers
    story: Most moai of Rapa Nui were carved straight out of the volcanic tuff of the quarry at Rano Raraku, by estimates between the thirteenth and the sixteenth century. On Easter Sunday, 5 April 1722, the Dutch navigator Jacob Roggeveen reached the island.
    relic: A stone adze
    relic_desc: A hand sized blade of dark basalt, ground to a clean edge.
    points:
      p1: Keep a figure on its way to the coast from toppling on the road
      p2: Help the carvers read the rock behind Te Tokanga, and free more of its back from the hill
    points_fail:
      p1: The figure toppled halfway and broke in two, and in this branch the coast has one figure fewer of those history saw raised.
      p2: Te Tokanga stopped halfway as history has it, and in this branch its back is still joined to the hill, as it is today.
    shift:
      p1:
        was: From about the thirteenth century the people of Rapa Nui moved statue after statue from the quarry to the platforms by the sea.
      p2:
        was: Te Tokanga was never finished; its back is still joined to the hill, and it lies in the quarry of Rano Raraku today.
        now: '{staff} found the run of the rock for the carvers, and more of its back was cut free from the hill. Whether it ever left the hill is not recorded.'
    vignettes:
      pair: '{staff} labels which sketch is the front and which the side before laying them together, so a ridge in the rock is not taken for the edge of the face.'
      surface: '{staff} walks back to the first place on the slope and adds an arrow to the drawing, showing where it was seen from.'
      height: '{staff} draws the top of the head once from the front and once from the side, and lines the two slips up at the same point.'
  hargrave_stanwell_park:
    name: The fourth kite
    place: Stanwell Park, Australia
    figure: Lawrence Hargrave
    story: Lawrence Hargrave began his experiments with box kites in 1893. On 12 November 1894, on the beach at Stanwell Park, four of his linked box kites lifted him off the sand, about 16 feet into the air. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and the equipment of the trial. He died in Sydney on 6 July 1915.
    relic: A spare box kite tag
    relic_desc: A spare label for the frame of a box kite.
    points:
      p1: On 12 November, keep the string of kites steady in the gusts, so that he rises and comes down safely on the sand
      p2: Help him finish full drawings of the four kites, their sizes and how they are made, and leave one copy in Australia
    points_fail:
      p1: A gust dragged the string of kites aside and the seat struck the sand, and in this branch there was no lift of 16 feet.
      p2: The four kites stayed only in his own hands as history has it, and in this branch there was no second record at Stanwell Park.
    shift:
      p1:
        was: On 12 November 1894, on the beach at Stanwell Park, four box kites in a train lifted Hargrave off the sand to nearly 16 feet.
      p2:
        was: In 1894 the making of the four kites was in Hargrave's hands alone; late in life he sent his models to Munich, and most were destroyed in the Second World War.
        now: A set of drawings of the four kites stayed at Stanwell Park and did not go to Munich with the other models.
        who: hargrave_stanwell_park
        bio: The sizes and drawings of Hargrave's four box kites of 1894 stayed in a copy at Stanwell Park. Most of his models were later destroyed in the Second World War, but how these four were made could still be read in Australia.
    vignettes:
      four: '{staff} counts the kites laid out on the sand once more after the lift and writes all four on the page, with a bracket round them, so the next reader knows they flew together.'
      tag: '{staff} follows the wet sand back to find a tag torn off a frame, and ties it on again with a new knot.'
      lift: '{staff} stands with the helpers on the dune while the wind is tried with a single kite, and learns which way to run with the line.'
  sun_yat_sen_guangzhou:
    name: From the statue to a new university
    place: Guangzhou
    figure: Sun Yat-sen
    story: Standing before the statue of Sun Yat-sen at Sun Yat-sen University, you are carried back to Guangzhou on 4 February 1924, the day he orders three schools joined into National Guangdong University and names Zou Lu to prepare it. In the same months he lectures on Sundays in the hall of the Higher Normal School, and the notes of the lectures go back and forth until they are a book. Classes begin on 19 September, and the founding ceremony is held on 11 November with the motto he wrote. He dies in Beijing on 12 March 1925, and in 1926 the university takes his name.
    relic: The statue of Sun Yat-sen
    relic_desc: The statue on the campus of Sun Yat-sen University. It is the way to Guangzhou in 1924 and is not an antique, so it cannot be sold.
    points:
      p1: Plan where the enrolment notices should go outside the walls and hand the route to the office messengers
      p2: Take an introduction to the three schools and bring their concerns back on one sheet for the first meeting
      p3: Compare the sites the office is considering and deliver a map before the decision on Shipai
      p4: Check the three graduation lists and deliver one roster for the 21 June ceremony
      p5: Join the crew at Shipai and set the boundary posts for the new campus
    points_fail:
      p1: In this branch the notice goes up only in the city, and students outside hear of it after registration has begun.
      p2: The first preparatory meeting is held as recorded, and each school still speaks only of its own troubles, with no list that puts them together.
      p3: Shipai is chosen as recorded, and the office has no sheet with the sites drawn together.
      p4: The 21 June graduation goes ahead as recorded. The office has to work from three separate lists.
      p5: The ground at Shipai is marked out only on paper as recorded, and not one post stands on it.
    shift:
      p1:
        was: '9 June 1924: National Guangdong University asks the provincial education offices to enrol students, and on 10 June registration for the preparatory examination opens, with 520 places planned.'
        now: In this branch the notice of enrolment is also posted at the crossroads outside the city and on the quays.
      p2:
        was: '3 March 1924: the first preparatory meeting is held, and first on its agenda is the graduation of the students of the three schools.'
        now: In this branch a list of the troubles of all three schools lies on the table of the meeting.
      p3:
        was: '1924: the schools are spread over several places and hard to run, Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, and land is marked out that year.'
        now: In this branch a map of the sites and of Shipai lies beside the papers on the choice.
      p4:
        was: '21 June 1924: Zou Lu takes up the post of president of National Guangdong University, and the graduation ceremony of the three schools is held the same day.'
        now: In this branch, the office has a single checked roster for the ceremony.
      p5:
        was: '1924: Sun Yat-sen has Zou Lu choose Shipai for the new campus, but building begins only in 1933 and the first colleges move in in the autumn of 1934. Sun dies on 12 March 1925 and never sees it.'
        now: In this branch, before he leaves Guangzhou in November, the bounds of the ground at Shipai already stand, post by post.
        who: sun_yat_sen_guangzhou
        bio: In this timeline the bounds of the new campus at Shipai stand before Sun Yat-sen leaves Guangzhou.
    shift_all: Each job left something the office could use. Looking back, the five jobs echo the motto Sun Yat-sen later wrote for the university, with its call to study widely, enquire carefully, think prudently, discern clearly and practise earnestly.
    vignettes:
      slips: A clerk made up for the game is about to copy a page that has a slip pasted over two lines. You ask which hand wrote the slip and which wrote the page. He copies the page first and leaves the slip where it is.
      back_row: A student made up for the game cannot find a seat and keeps standing up to look. You move along the bench. He sits through the rest without a word and nods to you as the hall empties.
      hundred: You keep a tally of the days in the back of your notebook, five strokes to a mark. When it reaches a hundred, a clerk made up for the game asks what you are counting. You tell him, days.
  david_fleay_healesville:
    name: Let Corrie come out on her own
    place: Healesville Sanctuary, Victoria
    figure: David Fleay
    story: In late 1943 Jill, a platypus at Healesville Sanctuary, hatched a young one later named Corrie. David Fleay and his team confirmed the birth in January 1944 when they opened the nest. On 26 February he first observed Corrie come out to swim.
    relic: A wooden feed scoop
    relic_desc: A small wooden scoop with a worn handle.
    points:
      p1: Keep loose soil clear of the opening long enough for Fleay to get Corrie back into the burrow
      p2: Get dry leaves to the new entrance so Jill can replace the bedding lost when the nest was opened
      p3: Persuade the sanctuary to leave the burrow closed when Corrie hides on the day of the family display
    points_fail:
      p1: Loose soil covers the opening before Fleay can return Corrie safely. The first successful rearing falls out of sync with history, and the office calls {staff} back that day.
      p2: Jill moves to a new entrance, and the young platypus has no bedding for weeks, as in the recorded history.
      p3: The advertised time passes and the sanctuary resorts to shovels. By the time Corrie is brought out, most visitors have gone.
    shift:
      p1:
        was: On 3 January 1944, Fleay returned the young platypus to the disturbed nest, and Jill went on rearing her.
      p2:
        was: After the nest was opened on 3 January 1944, Jill cleared out the old bedding and her young went without bedding for weeks.
        now: '{staff} leaves dry leaves where Jill passes on her evening feeding rounds, and Jill carries some back to line the nest.'
      p3:
        was: In March 1944, Corrie retreated into the tunnels during the advertised family display and was dug out after most visitors had left.
        now: '{staff} uses the evening observation notes to persuade the keepers to leave the burrow closed and invite visitors to wait quietly by the pool. The sanctuary uses the same arrangement at later displays.'
        who: david_fleay_healesville
        bio: At Healesville, Fleay began using his evening observations to plan displays that let the animals emerge in their own time. His later demonstrations gave visitors a place to wait by the water.
eras:
  broad_street_1854:
    vignettes:
      odd_address: Ellen, a fictional clerk, is closing her list for the evening. One address is too far from the pump and she reaches for her pen to strike it. You ask where the family got its water. Ruth can vouch for the address but is waiting to hear from the person who fetched the water. Leave the second column blank, Ellen says, and leave the address where it is.
      witness: Ruth, a fictional neighbour, repeats the address until Ellen is ready to file it. You ask Ruth how she walked there instead. At a turn she stops and points back to the pump. Ellen adds a direction in her own hand. The person who brought the water has yet to arrive.
      street_list: Ellen can take the original list or wait for you to finish a copy. You call the house numbers while she follows the doors with a finger. One mark belongs a door farther down. She sends the original on time, and the amended two-column copy stays on the desk.
    name: Broad Street, London 1854
    short: Broad St.
    place_name: Broad Street, Soho, London
    tags:
      - medical
      - infection
      - cholera
      - c19
      - london
      - history
    event_titles:
      door_block: Turned away at the door
      time_strain: Time slip
    plots:
      microscope:
        name: Give Snow a microscope
        desc: Lets him show people what is in the water more clearly.
        character: John Snow
        article: people:snow
      germ_theory:
        name: Explain germ theory to Snow
        desc: Needs the craft of microbiology, which this era does not have.
        character: John Snow
        article: people:snow
    blurb: Cholera, one pump, and a doctor nobody has listened to yet. Close, cheap, and the effect of hygiene and medicine is clear.
    handle_label: Pump handle removed
    protagonist: John Snow
    protagonist_role: A physician who argued in 1849 that cholera could be transmitted by water
    stay: Stay one office day, 30 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On the night of 31 August 1854, cholera broke out around Broad Street in Soho, London.
          check: true
        - text: The popular explanation was miasma, bad air.
          check: true
        - text: Snow had already proposed in 1849 that cholera spreads through water. Most colleagues did not accept it.
          check: true
        - text: On 8 September the handle of the Broad Street pump was removed.
          check: true
        - text: By the time the handle was removed the outbreak was already declining and many residents had left.
          check: true
      regret:
        - You can save today's patients but not tomorrow's. On the main timeline the handle came off on day eight.
        - Data and maps matter more than medicine, but making people believe data takes time.
    events:
      door_block_stubborn: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, is thrown out of one house and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_stubborn_empty: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, and is thrown out.
      door_block_insist_empty: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, and is pushed out.
      door_block_insist: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, is pushed out, and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_appeal: A neighbour blocks the door, saying it is miasma. {staff} does not force the way, turns and goes to Snow to ask him to speak up.
      door_block_yield: A neighbour blocks the door, saying it is miasma. {staff} steps back without a quarrel, and half a day is wasted.
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: Convince Snow
      trust: Win the trust of the street
      handle: Have the pump handle removed ahead of history
    milestones:
      first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
      first_protect: '{date}: {staff} hands the first chlorine tablets to a few households willing to listen, and teaches them to boil or treat the water.'
      met_snow: '{date}: {staff} meets Snow at the street corner. He listens closely but keeps asking one thing: where is the evidence.'
      snow_trusts: '{date}: Snow starts to treat {staff} as one of his own and brings out the house by house list he has been keeping to compare.'
      snow_convinced: '{date}: Snow no longer merely suspects the water. He has enough names, and believes what the stranger told him.'
      board_moves: '{date}: The parish board starts to give way and says the pump might be shut for now.'
      handle_off_history: '{date}: The pump handle comes off. Snow records the removal on 8 September.'
      handle_off_early: '{date}: The pump handle is removed {advance_days:1} days earlier than in history. The main timeline does not change, only this branch.'
      trust_won: '{date}: People on the corner no longer keep {staff} out, and some knock on their own.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of patients falls to around single digits. Many people have left the area.'
    summary:
      near_death: '{staff} collapses on Broad Street and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a letter saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend on Broad Street. The pump handle came off {advance_days:1} days earlier than in history.'
      perfect: '{staff} completed the task on Broad Street and came back safe. In the model, the baseline records {base_D:i} deaths and this branch {D:i}.'
      scramble: '{staff} was turned away at the door again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent thirty days on Broad Street, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was sitting with the patient by the bed.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's patients, not tomorrow's.
        - trait: curious
          text: So that is how it is, water really does carry the sickness away.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they believe it is up to them.
        - text: With one more item I might have saved one more household.
    hints:
      lost_ors: A lot of rehydration salts were lost. Next time let the employee yield, or bring more.
      unused_protect: Chlorine was left over. The limit was the neighbours' trust, not the tablets.
      unused_ors: Rehydration salts were left over. The employee may have spent time elsewhere, or patients were not let in.
      ally_gap: Snow's evidence is still thin. The handbook helps him, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  vienna_1847:
    vignettes:
      denominator: Emil, a fictional clerk, has copied the death totals while the admission list is still with the ward. Marta asks how many people came through each door. You help her keep a space for those figures next to the totals. Emil can now hand over a question instead of a misleading comparison.
      ward_key: Marta, a fictional midwife, has been asked for the numbers from the other ward. The initials look alike on Emil’s slips. You wait for Marta to say the full name of the ward she means. She writes it out herself before carrying that slip across the corridor.
      tables: The next clerk is already at the door. Emil can hand over the two sheets now or read their headers with you first. When you read the month, Marta spots a sheet filed one month too early. The corrected copy goes to the next shift, who will still have to wait for the month’s final count.
