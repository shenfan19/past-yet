catalog:
  pythagoras_croton:
    name: The second string
    place: Croton, southern Italy
    figure: Pythagoras
    story: Aristotle later describes the people he calls Pythagoreans relating the intervals of a musical scale to number. In the imagined Croton workshop, two learners use marked strings to compare an octave. The sources here give no record of Pythagoras conducting this particular lesson.
    relic: A string with two ink marks
    relic_desc: A practice string from the imagined workshop, marked first from memory and then by length.
    points:
      p1: Compare the full and half lengths on the same string
      p2: Ask the maker to let a second person try the mark
      p3: Keep a steady beat while the two apprentices take turns
    vignettes:
      octave: Melas has made an ink mark where he remembers his teacher’s finger. You double back a spare length of string and show him where the middle actually falls. He makes a second mark and hears the octave this time. His first mark stays beside it so that the next apprentice can hear the difference.
      ear: Lysis can match the sound by ear but was never shown where to put his hand. You keep the beat while he listens to Melas and tries the string himself. When the shutters come down, Lysis can get the interval again from the mark without anyone singing it first.
      credit: Looking ahead, you can almost see one famous name printed over every exercise. Melas asks whose mark he should put on the spare string. You mark which stretch he tested and let him sign his own handiwork. The next lesson will start while you are already home.
  thales_miletus:
    name: The hour left blank
    place: Miletus, Ionia
    figure: Thales
    story: Herodotus credits Thales of Miletus with naming the year of a darkening of the day associated with a battle. He gives no surviving explanation of a method.
    relic: A wax leaf with one space left empty
    relic_desc: A fictional harbour record with room for a year and an hour.
    points:
      p1: Compare the year someone heard with the hour the recorder added
      p2: Persuade the boat owner to distinguish a report from an appointment
      p3: Wait to see which of the two blank columns can be filled
    vignettes:
      year: Hegesias has set out spaces for the year and the hour. He has a year from the man who told him the story, but has invented an hour so the two columns look alike. You make him read the man's words back before the boat leaves. One space remains blank, and this time it is blank on purpose.
      appointment: The boat owner Melitta asks whether she should bring the crew in early because of the story. You give her two wax leaves, one for the report as she heard it, one for the hour she has agreed with her crew. She makes the appointment herself. The story no longer dictates who comes back early.
      spoiler: You almost say that a later almanac could mark a local time. Hegesias turns the tablet towards you and holds out the stylus. You cannot show him how the teller of this story got a time. You give back the stylus without drawing its mark. You leave before the boat comes in.
  socrates_athens:
    name: What the court heard
    place: Athens
    figure: Socrates
    story: In Plato’s Apology, Socrates distinguishes long-standing rumours about him from the charges at his trial, which include corrupting the young. Their notes are imagined; Plato’s account is a later literary source.
    relic: The listener’s clay cup
    relic_desc: A cup from the fictional pottery seller’s stall.
    points:
      p1: Ask the message carrier which words he actually heard read
      p2: Help the listener reconstruct her unfinished account
      p3: Stay until he explains the difference between the two sets of accusations
    vignettes:
      handoff: Kleio has to leave for her pottery stall before she can hear the speech through. You find her at the gate and let her recount the opening in her own order. She leaves a space for the portion she missed. Her brother will hear where she had to stop.
      charges: Pheidon has put a market rumour at the top of his report as if it had been read to the court. You ask him to name its speaker. He can point to one man in the market and one voice inside. The report leaves their words on separate lines.
      verdict: You know how this trial ends. Pheidon wants to hurry the news to someone who could not come. If you tell him now, he will repeat it as something the court has already decided. You give him only what has been heard so far. You will miss the moment he delivers it.
  hippocrates_kos:
    name: A night without a witness
    place: Kos
    figure: Hippocrates
    story: The Hippocratic Epidemics records illnesses day by day, including cases on Thasos. The work is part of a collection transmitted under Hippocrates’ name. This imagined workshop on Kos uses a practice note to compare observers’ dates.
    relic: A practice watch record
    relic_desc: A fictional day-by-day record that preserves two starting points.
    points:
      p1: Find where the two accounts start counting days
      p2: Take the watch so the other recorder can rest
      p3: Ask what happened on the night no one wrote about
    vignettes:
      days: Myrine has numbered her first visit day one. Leon starts his count from the night before. You set both pages by the same lamp and ask them to point to the same morning. The two numbers stay on the sheet, alongside an indication of where each count began.
      watch: Leon is about to leave and Myrine has been awake since before sunrise. You give her time to rest while you mind the lamp outside. She brings the sheet back at the next change of watch. There is another observer for that stretch of the night.
      blank: You know later readers will make much of a day-by-day record. The space before Myrine’s first visit has no observer to fill it. You put a small mark beside the gap and leave the rest as it is. The person from the earlier watch will not return before you go.
  plato_academy:
    name: The unanswered square
    place: Athens
    figure: Plato
    story: A later biography places Plato in the Academy outside Athens. In Plato’s Meno, the side of a square with twice the area is the diagonal of the original square.
    relic: A borrowed wax tablet
    relic_desc: The practice tablet has a corrected diagram on the reverse.
    points:
      p1: Count the fourfold area before answering the student
      p2: Copy the false start alongside the corrected figure
      p3: Ask the bystanders to cover the new figure with half-squares
    vignettes:
      diagonal: Mikon has doubled the side on his wax tablet and asks you to read off the area. You slide the stylus around the four little squares he has made. He used to rub out mistakes at once. This time he keeps the four where they are and starts the next figure on the other leaf.
      squares: Doro has to take the wax tablet home before the lamp goes out. You hold it level while she scores a corner-to-corner line. Four of her half-squares fit the new figure. The apprentice who comes tomorrow will have something he can count without you.
      reveal: You give away the diagonal before Mikon has tried his longer side. He can repeat the answer but cannot draw the new square. You wipe away your answer and leave him two starting corners. The second attempt will have to wait for the next lamp.
  aristotle_lyceum:
    name: A crab in the wrong column
    place: Athens
    figure: Aristotle
    story: In History of Animals I, Aristotle distinguishes where an animal lives from how it moves, using the walking crab as one example.
    relic: A shell with a place-label
    relic_desc: A shell from the imagined exercise, with its findspot on a label.
    points:
      p1: Compare the crab sketch with the movement column
      p2: Hold the shell trays while the labels are replaced
      p3: Ask a witness to describe the movement she saw
    vignettes:
      two_columns: Timarete points to a one-column list, with the crab filed among swimmers. You draw a second column and ask her to use the same drawing twice. When she reads it back, sea is where she found the animal, walking is what she actually saw.
      shell: Damon is about to scrape his shell label clean to fit the new list. You ask him to set the shell on the table and describe where he picked it up. He keeps the older label beside the new one. One records a place and the other an observation.
      names: You start to tell the table what future books will call these creatures. Timarete asks which animal the new name will help her recognise tomorrow. You spend the remaining light copying the little crab with its legs showing. The ink is still damp when she closes the shutters.
  euclid_alexandria:
    name: Geometry from a few axioms
    place: Alexandria
    figure: Euclid
    story: The first proposition of Euclid's Elements constructs an equilateral triangle on a given line segment.
    relic: A bronze compass
    relic_desc: Two arms and a pivot, enough to draw every figure in the book.
    points:
      p1: Follow the construction from the given segment
      p2: Keep the two centres distinct in the copy
      p3: Explain why the finished triangle has equal sides
    vignettes:
      intersection: The learner puts the third point where it looks right. You draw the second arc. When the arcs cross, they can see precisely where the point belongs.
      reason: You ask why the sides should be equal before the learner reaches for a rule. They look again at the centers of the circles and trace each side back to a radius.
      clean: You help copy the finished drawing without the trial marks. The learner puts back the arcs you nearly erased, because the next reader will need to see where the point came from.
  archimedes_syracuse:
    name: Two boats, one basin
    place: Syracuse, Sicily
    figure: Archimedes
    story: In On Floating Bodies, Archimedes relates the weight of a floating body to that of the liquid it displaces. Vitruvius much later tells the bath and crown story.
    relic: A marked toy hull
    relic_desc: A practice hull from the fictional workshop.
    points:
      p1: Compare the floating boats at equal load
      p2: Talk the maker into repeating the trial after the water settles
      p3: Hold the catch bowl level while the floating boat settles
    vignettes:
      load: Tyche expects the wide boat to send more water over the rim. You give both boats equal total weight. The wider hull sits shallower and the two catches balance. She keeps both boats instead of cutting down the larger one to match the smaller.
      settle: Nikon has to return the basin before the workshop closes. He starts the second trial while the first catch is still sloshing. You send Tyche to return the weights and use the time to let the bowl settle. Nikon weighs the water again. He leaves with a second reading and still gets the basin back.
      crown: You ask Nikon whether Archimedes ever tested a king’s crown in a bath. He looks down at the two toy boats and asks whose crown you could put on the scale. You have the tale a Roman author will tell long after this workshop. You leave with the mark from the trial you can actually repeat.
  eratosthenes_alexandria:
    name: One fiftieth of the Earth
    place: Alexandria and Syene
    figure: Eratosthenes
    story: In Cleomedes’ later account, Eratosthenes compares the Sun at noon at Syene and Alexandria. A difference treated as one fiftieth of a circle, with a distance of 5,000 stadia, yields a circumference of 250,000 stadia in this account.
    relic: A gnomon rod
    relic_desc: A plain upright rod whose shadow told him the angle of the sun.
    points:
      p1: Find the small arc on the same circle as the whole circumference
      p2: Carry the distance slip to the shadow diagram before doing the scaling
      p3: Keep the angular share and the length together until the result is copied
    vignettes:
      scale: The helper has written fifty beside the distance and is ready to divide. You draw the small arc first and ask how often it fits around the circle. He turns the operation around and gets 250,000 in the exercise. You carry away the multiplication and the assumed distance; the length of a single stade is still outside the drawing.
      noon: You have seen the two cities together on a later map. The helper is about to compare a noon mark with one made after the shadow had moved away. You take the later mark out of the comparison. A place on the sheet stays empty until the proper hour. That hour comes after you have left.
      arc: You copy the small arc with its share of the circle, then write the distance on another line. The helper can now tell which number is a fraction and which a length. You take home the pair. You have not walked what lies between those cities.
  hypatia_alexandria:
    name: Read at the surface
    place: Alexandria
    figure: Hypatia
    story: In Letter 15, Synesius asks Hypatia to have a brass instrument made and describes the upright float and its marks for comparing liquids. The letter records a request; the two readers and the instrument they test here belong to the story.
    relic: A sketched float scale
    relic_desc: A fictional workshop sketch showing where the mark is read.
    points:
      p1: Ask the pupil and maker to agree where they took the reading
      p2: Check whether two readers are using the same notch
      p3: Use the remaining equipment to keep the trial out of the doorway
    vignettes:
      scale: Timon holds his thumb over the mark and calls it the result. Nysa takes a reading from where the float meets the surface. You ask them to put down the tube and look again while it stands free. This time they read the same mark. Nysa adds where they were standing to the record.
      copy: Nysa has one side of a tablet left and wants to copy the result in large letters. You fit the observation on the top half and let her draw the cylinder below it. The next reader will have both the result and a place to look for it on the instrument.
      name: You could offer a future name for the device. Timon has a cloth in one hand and is about to lift the float out of the cup. You use the last quiet moment to ask Nysa for one independent reading. You leave without seeing what the recipient makes of the finished instrument.
  fibonacci_pisa:
    name: Hindu-Arabic numerals reach Europe
    place: Pisa
    figure: Fibonacci
    story: Leonardo of Pisa wrote the Liber abaci in 1202. Its surviving 1228 revision explains the nine Indian digits and zero.
    relic: A wax tablet of numerals
    relic_desc: A tablet with the ten new numerals set out beside the old Roman ones.
    points:
      p1: Read the total without skipping the zero
      p2: Show how moving a digit changes its place value
      p3: Check the two copies before they leave the market
    vignettes:
      gap: The clerk skips the empty column when copying the total. You put zero back into the gap and ask him to read the number again. It now agrees with the earlier reckoning.
      tokens: You arrange a few counters in groups on the counter. The clerk moves one to the next column, then explains why the same mark would now mean something different.
      copy: Two copies of a total are about to leave the market. You have the clerk read both back before the carriers go their separate ways.
  giotto_padua:
    name: Figures with weight and feeling
    place: Padua
    figure: Giotto
    story: Giotto's frescoes at the Scrovegni Chapel in Padua are dated 1303–1305 by the chapel. The scenes occupy successive bands along the walls.
    relic: A pot of blue pigment
    relic_desc: Ground blue, the colour of the chapel vault.
    points:
      p1: Find which scene comes next in the band
      p2: Follow a painted gesture across the space
      p3: Choose a place to see two scenes together
    vignettes:
      eye: The visitor always starts where the faces are easiest to see. You ask what their eyes do when you send them back to the corner. They follow a gesture into the next part of the picture.
      register: The visitor tries to continue on the band just below. You trace the route around the wall in the air. They walk a few steps and find the scene they were looking for.
      step: You step back with the visitor until two scenes fit into the same view. The visitor points out one detail that had been invisible when they stood directly beneath it.
  dante_ravenna:
    name: A poem in the language of the street
    place: Ravenna
    figure: Dante Alighieri
    story: The closing lines of Dante's Paradiso invoke the Sun and the other stars. Boccaccio's later account of missing cantos found after a dream is a literary tradition.
    relic: A laurel leaf
    relic_desc: A dried leaf of the poet's crown.
    points:
      p1: Follow the verse through a change of page
      p2: Hear the rhyme that carries into the next group of lines
      p3: Help the reader find where the poem ends
    vignettes:
      dream: You ask whether a dream can tell the copyist where a missing canto went. They put down the lamp. “A dream may tell you where to look. What will you read when you get there?” You mark the story as a later tradition in the report.
      ear: The copyist stops when a verse ends. You ask them to keep reading just long enough to hear the next rhyme arrive. The new page no longer sounds like a fresh start.
      stars: You help the copyist find the last line before the lamp goes out. The word for stars is the one they remember when you step into the street.
  gutenberg_mainz:
    name: Printing with movable metal type
    place: Mainz
    figure: Johannes Gutenberg
    story: The surviving 42-line Bible was printed in Mainz around 1454–1455 using movable type.
    relic: A lead type sort
    relic_desc: One small letter of lead and tin, backwards.
    points:
      p1: Help the apprentice keep the type in order
      p2: Carry the practice sheets to the reading table
      p3: Catch a mistake in a printed line
    vignettes:
      wrong_sort: You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other's place.
      reader: You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.
      proof: You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.
  leonardo_florence:
    name: A painter who drew machines
    place: Florence
    figure: Leonardo da Vinci
    story: The Louvre dates the beginning of Leonardo's portrait known as the Mona Lisa to around 1503 and records that he kept working on it later.
    relic: A mirror-written notebook page
    relic_desc: A page of backwards script that needs a mirror to read.
    points:
      p1: Describe one place where the shading changes
      p2: Help the apprentice check the position of the hands
      p3: Keep the sitting ready for a later session
    vignettes:
      shadow: You ask the apprentice to show where the face ends and the background begins. They point, then hesitate. Instead of drawing a heavier line, they leave the transition for a second look.
      hands: The visitor remembers the face but puts the hands in a different place. You set the practice drawing beside their memory sketch and let them find the changed lines.
      seat: You mark the sitter's chair on the floor while the apprentice packs up. They leave the drawing unfinished, knowing where the chair will go when they return.
  copernicus_frombork:
    name: The Sun at the centre
    place: Frombork, Poland
    figure: Nicolaus Copernicus
    story: In 1543 De revolutionibus was printed in Nuremberg with an account in which Earth rotates and orbits the Sun.
    relic: A brass quadrant
    relic_desc: A quarter circle for measuring the height of stars.
    points:
      p1: Identify where the observer is standing
      p2: Keep the two diagrams separate
      p3: Follow the changing viewpoint through a full turn
    vignettes:
      walk: You ask the reader to keep looking at a point across the room while walking around a stool. He stops halfway, surprised by how far the stool has seemed to move against the wall.
      frame: You put the labels for observer and observed on separate scraps. The reader turns over one scrap at a time while he compares two possible accounts of the same apparent motion.
      diagram: You turn the page so the reader can see the orbit in full. He holds his finger on Earth while you follow the direction that changes during the year.
  vesalius_padua:
    name: The letter under the figure
    place: Padua
    figure: Andreas Vesalius
    story: Vesalius prepared the Fabrica while teaching in Padua. The woodblocks were sent from Venice to Johannes Oporinus, and the book appeared in Basel in 1543.
    relic: A checked teaching figure
    relic_desc: A fictional reader’s copy with a corrected figure reference.
    points:
      p1: Compare the figure letter with the corresponding text
      p2: Hold the two copies in place while the mismatched letter is marked
      p3: Help the next reader retrace the correction
    vignettes:
      letter: Lucia puts her finger on the letter in the margin. Marco points to a different place on the figure. You move the practice sheet against the open book until both can see where the copy drifted. Lucia changes the reference and leaves the displaced one legible in the margin.
      hold: The borrowed book has to go back and Marco still needs the figure. You hold the book open until he can mark both the image and its letter on a sheet of his own. When the owner takes the book, there is still something he can check at his desk.
      credit: You know later readers will try to name the people who made the illustrations. Lucia asks whether to put an artist’s name at the top of her practice copy. You can point to the printed figure but cannot settle who drew it. She leaves a line for a source, then closes the book.
  shakespeare_globe:
    name: A playhouse for everyone
    place: London
    figure: William Shakespeare
    story: The Chorus in Henry V asks the audience to imagine places and events beyond what a stage can show. The play belongs to the Globe's early years.
    relic: A goose quill
    relic_desc: A feather cut for writing, ink still on the tip.
    points:
      p1: Find a place where the cue can be heard
      p2: Help the player make a place clear without scenery
      p3: Stay through one more run of the entrance
    vignettes:
      back_row: You stand at the edge of the yard and signal when the last words vanish into the room. The player tries the cue again, this time facing the audience.
      space: You ask how the player will fit a whole countryside on the boards. He points to a single doorway and asks you to cross it as if it were a day's journey.
      cue: You listen for the one word that sends the next player on. They run the same entrance again and this time the door opens on the word.
  galileo_padua:
    name: Moons around Jupiter
    place: Padua
    figure: Galileo Galilei
    story: In the Starry Messenger, Galileo records changing positions of four small bodies near Jupiter and concludes that they orbit it.
    relic: A ground lens
    relic_desc: A small glass lens, polished by hand.
    points:
      p1: Compare diagrams from two observing nights
      p2: Keep two loose sheets in chronological order
      p3: Check which positions still need a second look
    vignettes:
      alignment: You stop the copyist from aligning the pages by their edges. Line up Jupiter instead, you suggest. The dots no longer sit on top of one another.
      telescope: You ask which dot is the fourth. The copyist sets out the sheets from several nights and asks which should be trusted when the dots seem to merge.
      dates: You mark the date on each loose sheet before the copyist stacks them. The order lets the next reader see the dots change position.
  descartes_leiden:
    name: Doubt as a method
    place: Leiden
    figure: René Descartes
    story: The 1637 Leiden edition of Descartes's Discourse on the Method appeared with three essays, on optics, meteorology and geometry.
    relic: A folded cogito note
    relic_desc: A slip with a single sentence about thinking and being.
    points:
      p1: Divide the worked problem into smaller questions
      p2: Ask the reader to show one step that supports the conclusion
      p3: Find an example to read beside the method
    vignettes:
      parts: The reader is stuck on the whole problem. You mark a smaller one that can be settled first. They finish that part before opening the page with the answer.
      claim: A second reader calls the result obvious. You ask them to name the step that makes it so. They reread the middle of the example, where neither of them had stopped before.
      contents: You keep the method open beside one of its examples. The reader moves the paper marker from the rule they liked to the page where they can see it being used.
  leeuwenhoek_delft:
    name: A world in a drop of water
    place: Delft
    figure: Antonie van Leeuwenhoek
    story: A letter sent from Delft in April 1676 records Leeuwenhoek's observations and includes figures of ash wood and a tiny eel-like animal found in wine.
    relic: A tiny brass lens plate
    relic_desc: A thumb sized plate holding one very small, very clear lens.
    points:
      p1: Find the description that belongs to a figure
      p2: Keep the sample labels beside their drawings
      p3: Read the observation back to someone without the lens
    vignettes:
      motion: The correspondent writes that something moved. You ask what the movement looked like to someone who cannot see the lens. They cross out a comparison and draw a second position beside the first.
      label: There are drawings from wood and from wine on the table. You add temporary labels before the correspondent scrapes up the stray sheets, and the pictures go in the right order.
      read: You read the observation back without pointing at its illustration. The correspondent hears where the description runs out and adds a reference to the correct diagram.
  newton_cambridge:
    name: One law for the apple and the Moon
    place: Cambridge
    figure: Isaac Newton
    story: Newton's Principia appeared in London in 1687. In the third book he brings the Moon and falling bodies under the same account of gravity. The fair copy that went to the press was not in his hand. It was written out by Humphrey Newton, his amanuensis in these years and no relation. Much later, William Stukeley wrote down Newton's recollection of a falling apple prompting a question about gravity. Stukeley says nothing about a blow to the head.
    relic: A glass prism
    relic_desc: A triangle of glass that splits white light into colours.
    points:
      p1: Follow the page of the third book where the Moon and a falling body are brought under one law
      p2: Use the translation chip to read the Latin, and learn from a college servant where the copied sheets are bound for
      p3: Wait until the fair copy is packed and sent off to the press
    vignettes:
      apple: “Did an apple hit him on the head?” you ask a college servant, a man made up for the game. He goes on sweeping. “I could not say. You tell me why the Moon does not come down.” You have no answer ready, and go back to the page. The apple is not written down by anyone for another sixty-five years.
      hand: The fair copy is not in the hand of the man whose name will be on the book. The servant says the one who writes it out is Mr Humphrey, a Newton too and no relation. You note it down and do not disturb him.
      diagram: On a spoiled sheet you draw the way the Moon would go if nothing held it, and then an arrow for the pull that bends its path. The servant, who cannot read the Latin, looks at the arrow for some time.
  bach_leipzig:
    name: A cantor writes for every Sunday
    place: Leipzig
    figure: Johann Sebastian Bach
    story: Bach introduced himself to Leipzig with the cantata Die Elenden sollen essen, BWV 75, on 30 May 1723.
    relic: An organ pipe cut from quill
    relic_desc: A small pipe, tuned and tested, left unsold.
    points:
      p1: Hear a cue from another voice
      p2: Keep a singer's place through a rest
      p3: Help two readers share one page
    vignettes:
      entry: You hear the lower part arrive a breath before the singer expects it. You have them listen from the other side of the room. This time they raise their head before the cue.
      rest: The singer loses count during the rest. You copy the line they can hear while waiting, and they mark the word that comes just before their own entrance.
      light: Two singers share one page. You tilt it towards the light and hold it there until both can see the place where their lines separate.
  smith_kirkcaldy:
    name: How a nation grows rich
    place: Kirkcaldy, Scotland
    figure: Adam Smith
    story: The opening chapter of Adam Smith's Wealth of Nations (1776) uses pin-making to illustrate the division of labour.
    relic: A pin from the pin factory
    relic_desc: The pin he used to show what dividing a job can do.
    points:
      p1: Name one stage in the workbench example
      p2: Follow one piece through the handoff
      p3: Explain how the whole bench works from the separate tasks
    vignettes:
      queue: The worker adds more counters at the fastest station. You ask them to count how many are still waiting at the slower one. They change their plan before the second demonstration.
      handoff: Two people both reach for the same tray; no one takes the one behind it. You set the finished pieces where the next worker can reach them and hear the clatter stop.
      walk: You watch each person describe their one small job. To trace the whole route, you have to walk from one end of the bench to the other.
  kant_konigsberg:
    name: A question for the margin
    place: Königsberg
    figure: Immanuel Kant
    story: Kant’s first edition of the Critique of Pure Reason appeared in 1781. Its preface begins with questions that reason cannot set aside even though it cannot answer them. There would be a revised preface in 1787.
    relic: A bookseller’s label
    relic_desc: A fictional label with the first edition year in the margin.
    points:
      p1: Let the reader explain what drew her to the preface
      p2: Check the summary against the first page before it goes on the shelf
      p3: Persuade the seller to keep the harder question on the label
    vignettes:
      margin: Lotte wants to copy only the part about questions a reader cannot ignore. You ask her to leave room for the limit that follows in the same sentence. She makes the letters smaller and fits both on her slip. The line now gives her a reason to open the book again.
      label: Otto writes that the book answers the hardest questions. You turn the label over and have him read the first sentence again. He writes a question in place of the boast. A customer can see from the shelf where to start looking.
      editions: You remember that another preface will appear six years later. Lotte has this copy in front of her and asks which page to mark. You put the date of this edition on her slip. She turns the first leaf just as the shop closes.
  mozart_prague:
    name: The cue before the curtain
    place: Prague
    figure: Wolfgang Amadeus Mozart
    story: Mozart wrote from Prague that Don Giovanni went on stage on 29 October 1787. An earlier letter describes problems getting the opera ready.
    relic: A corrected rehearsal part
    relic_desc: A fictional part with one rest crossed out.
    points:
      p1: Check the singer’s cue against the other part
      p2: Ask the copyist which page she can replace before the curtain rises
      p3: Get both singers to start from the cue once
    vignettes:
      cue: Anna’s part gives her one extra rest. You tap where the other voice enters and let her mark which word she can listen for. On the next run she comes in on time. The part still has the crossed-out rest, and Anna asks you to keep it visible.
      swap: Jan has time to replace a page or fetch the missing singer. You take the walk to the stairs while he copies the page. By the time the curtain moves, both the new page and the singer are at the stand. Someone under the stage is still looking for the old copy.
      applause: You know Mozart will write about the applause. Jan asks whether anyone in the house will hear the extra rest. You give him the corrected page and tell him where to listen for Anna. When you leave, the curtain has risen and the cue has yet to come.
  lavoisier_paris:
    name: A new language for chemistry
    place: Paris
    figure: Antoine Lavoisier
    story: Lavoisier's 1789 treatise uses mass measurements to account for chemical changes and treats oxygen as a participant in combustion.
    relic: A precision balance
    relic_desc: A fine balance that kept the books of chemistry.
    points:
      p1: Match the figures to their headings
      p2: Check the spacing between two neighbouring columns
      p3: Read the corrected table back to the compositor
    vignettes:
      units: Two numbers line up beautifully, but the unit on one row has slipped. You catch it before the compositor locks the columns in place.
      air: You ask why the table accounts for something the reader cannot see. The compositor taps the headings for what entered and what remained, then leaves both headings in the proof.
      proof: You put a scrap of paper under the current row as the compositor reads. A number that looked like part of the next example finds its own heading again.
  jenner_berkeley:
    name: The first vaccine
    place: Berkeley, England
    figure: Edward Jenner
    story: Jenner's 1798 Inquiry records earlier observations and cases concerning cowpox and smallpox.
    relic: A glass lancet
    relic_desc: A thin blade for the first small scratch.
    points:
      p1: Hear the milkmaid speak of cowpox
      p2: Tend the children after the inoculation
      p3: Persuade a doubtful mother
    vignettes:
      firsthand: A fictional copyist has written every account in the same voice. You ask which one the writer actually saw. The copyist adds a note beside the rest rather than giving every line the same weight.
      order: Two observations have traded places in the copy. You check the dates, and the copyist reverses the slips before using the order to tell a story.
      blank: You leave room under a note the copyist cannot confirm. By the time the page is passed on, the blank has a label so no one mistakes it for an omission.
  beethoven_vienna:
    name: The Ninth Symphony
    place: Vienna
    figure: Ludwig van Beethoven
    story: A concert poster records the premiere of Beethoven's Ninth Symphony on 7 May 1824 at Vienna's Kärntnertor Theatre.
    relic: An ear trumpet
    relic_desc: A horn he held to his ear as the world went quiet.
    points:
      p1: Show the late guest where to wait
      p2: Work out how to follow the concert from the programme
      p3: Keep the entrance clear without interrupting the music
    vignettes:
      voice: You point out the singers to the usher. The guest starts to ask why there is a chorus at a symphony, then stops when the first voice comes in.
      step: The late guest keeps missing the step down. You stay by the door and wait for his eyes to adjust, then show him to a place without making the row stand.
      programme: The usher lends you his programme. You keep one finger on the current item so the guest can tell which piece is still to come.
  faraday_london:
    name: Electricity from magnetism
    place: London
    figure: Michael Faraday
    story: On 29 August 1831 Faraday recorded a transient needle movement using two sets of coils wound around an iron ring.
    relic: An iron ring and coil
    relic_desc: Two coils of wire on a ring of soft iron.
    points:
      p1: Mark when the needle moved
      p2: Keep the two sets of windings distinct in the sketch
      p3: Make the observation legible to the next reader
    vignettes:
      instant: The assistant writes that the needle moved. You leave space for when it moved. By the time he looks back at the instrument, the needle has settled.
      skeptic: You ask whether the reading stayed put. The assistant points to the blank after the first mark. Together you label it as a return to rest so nobody mistakes the blank for a missed reading.
      sketch: You draw the ring in the margin and mark its two sets of windings on opposite sides. The assistant can now match the observation to the right apparatus.
  darwin_galapagos:
    name: Islands and the variety of life
    place: Galápagos Islands
    figure: Charles Darwin
    story: Darwin visited the Galápagos on the Beagle in 1835. His bird notes associate mockingbird specimens with particular islands.
    relic: A finch feather
    relic_desc: A small brown feather from the islands.
    points:
      p1: Notice what others miss
      p2: Survive the voyage
      p3: Help him sort the specimens (a sharp mind or a record keeper)
    vignettes:
      two_tags: One tag says only 'island'. You set it aside until the helper can find the separate landing note. The two specimens stay apart even after the trays are put away.
      differences: The helper points to two similar-looking birds and wants one entry for both. You ask which island each came from. They leave both labels in the book so the likeness can be considered again later.
      drawer: You keep the paper label beside the tray until the helper can read the name back to you. When they close the drawer, the note stays where it belongs.
  lovelace_london:
    name: The first program
    place: London
    figure: Ada Lovelace
    story: Note G of Lovelace's 1843 published translation includes a table for calculating Bernoulli numbers with the proposed Analytical Engine.
    relic: A punched card
    relic_desc: A card of holes, meant to tell an engine what to do.
    points:
      p1: Identify a value that gets used again
      p2: Explain an operation to the proofreader
      p3: Leave a reading guide with the corrected copy
    vignettes:
      repeat: You mark where a group of operations repeats. The proofreader has counted only one pass and uses your mark to retrace the later rows.
      music: You ask whether the columns might stand for musical notes. The proofreader asks how the machine would know the rules for them. You jot that question beside the diagram to bring home.
      row: You cover the next row with a scrap until you can explain the current one. The proofreader can see exactly where a value will be used again.
  nightingale_scutari:
    name: Nursing as a discipline of data and care
    place: Scutari, Ottoman Empire
    figure: Florence Nightingale
    story: Florence Nightingale's 1858 report on army health drew on the recent war and included hospital statistics. it is not the creation of the eventual report.
    relic: A small oil lamp
    relic_desc: The lamp from her night rounds.
    points:
      p1: Know the ward work (medical staff)
      p2: Keep the men calm
      p3: Last the long night shifts
    vignettes:
      totals: A fictional clerk adds the transfer list to the admissions total. You ask which names are newly admitted. They leave the transfers in their own column before sending the return.
      name: The clerk cannot hear a name over the room's noise. You wait beside the person who gave it until they can say it again. The next copy spells it as they asked.
      fold: You set the ward papers in the order the clerk calls out. The sheet that used to appear after the total now arrives before it.
  mendel_brno:
    name: Peas and the rules of heredity
    place: Brno
    figure: Gregor Mendel
    story: Mendel's paper, published in 1866 after his 1865 presentations, reports pea-cross counts and compares the resulting ratios.
    relic: A pea pod
    relic_desc: A dried pod from the monastery garden.
    points:
      p1: Keep the two shapes separate while counting
      p2: Finish a tally without rounding the raw counts
      p3: Leave another reader enough detail to check the tally
    vignettes:
      ratio: The reader rounds the tally until it looks exact. You leave the counts in the margin and ask him to work the ratio back from those numbers.
      label: Two paper labels look alike. You turn both over and find that one belongs to the parent plants. The reader moves it away from the counts for the offspring.
      tally: You read the two shapes out loud as the reader makes tally marks. At the end you leave the tally beside its total for someone else to check.
  mendeleev_petersburg:
    name: The periodic table
    place: Saint Petersburg
    figure: Dmitri Mendeleev
    story: Mendeleev published an early periodic system in 1869, grouping elements using atomic weights and chemical similarities. The surviving 1871 table shows the later development of the arrangement.
    relic: A deck of element cards
    relic_desc: Hand written cards that can be dealt like patience.
    points:
      p1: Follow a grouping across the table
      p2: Keep a blank in its original position
      p3: Explain one recurring property to the reader
    vignettes:
      blank: You rule the columns lightly in pencil before the reader copies them. At a blank he starts sliding the next entry back. The lines let you show him which group it belongs with.
      similarity: You ask why two entries with similar weights sit apart. The reader hunts through the notes for what each substance does and writes one more property next to each weight.
      heading: You help the reader label a copied row before he cuts the page to fit his notebook. When he folds it back open, the row still makes sense.
  pasteur_paris:
    name: The day he reached Paris
    place: Paris
    figure: Louis Pasteur
    story: Joseph Meister was brought to Louis Pasteur in Paris on 6 July 1885, and survived after the team’s rabies vaccination.
    relic: An arrival slip
    relic_desc: An invented record that distinguishes arrival from later news.
    points:
      p1: Find which entry was written on arrival
      p2: Make time for the family messenger to check the address
      p3: Keep the arrival entry separate from the later outcome
    vignettes:
      date: Claire has copied the day the letter was brought in beside the name in the arrival register. You set the envelope next to the register, and she finds the difference. Both dates stay on the desk, each beside the event it marks.
      address: Émile has offered to take the family’s reply while Claire keeps the register. You give him a narrow slip with just the address he needs. He checks it before leaving and the register stays closed while the visitors wait.
      future: You know this case will be remembered long after the boy leaves. Claire needs a line describing what is known today. You enter the arrival and leave the later news for its own date. The latest envelope is still unopened when your visit ends.
  curie_paris:
    name: Two new elements
    place: Paris
    figure: Marie Curie
    story: Polonium and radium were announced in 1898. Marie Curie's 1911 lecture looks back on the discoveries and the later work needed to establish radium's properties.
    relic: A tube of pitchblende
    relic_desc: A glass tube of dark ore that left a faint glow in the dark.
    points:
      p1: Keep the two announcements distinct
      p2: Check the date against the right notice
      p3: Finish the proof with the claim stated precisely
    vignettes:
      two_notices: The typesetter has set the two notices under one date. You put the earlier and later sheets apart and mark their months before the form is locked.
      word: You notice that the headline promises a finished result. The typesetter reads the announcement aloud and leaves a narrower claim in the heading.
      heading: You hold the second proof until its element name is checked. The typesetter leaves both notices readable rather than moving one into the other's column.
  freud_vienna:
    name: Two years for one book
    place: Vienna
    figure: Sigmund Freud
    story: Freud’s The Interpretation of Dreams reached readers around the turn of 1899–1900. The first edition bears 1900 on its title page, while Freud later recalled having the book before him in 1899.
    relic: A dated bookseller’s slip
    relic_desc: An invented slip that preserves the imprint and the arrival year.
    points:
      p1: Read the title page against the dated delivery note
      p2: Give a puzzled reader time to ask why the dates differ
      p3: File the order slip before the last copy is carried off
    vignettes:
      imprint: Grete sees 1900 on the title page and wants to change the arrival ledger. You bring the delivery slip over from the counter. She writes the printed year on the label and keeps today’s year in the ledger. The two records now answer different questions.
      reader: A customer thinks Emil has brought next year’s book by mistake. You invite him to compare the slip with the title page at the counter. The customer leaves with a copy and asks Emil to keep the slip in the shop so the next reader can see it too.
      edition: You know later bibliographies will file the book under the year on the title page. Grete only needs a way to find today’s order. You leave both dates where she can look them up. The door shuts while the last reader is still on the street.
  cajal_barcelona:
    name: Nerve cells as separate units
    place: Barcelona
    figure: Santiago Ramón y Cajal
    story: Cajal published an illustrated manual of histology in 1889. A later diagram preserved by the CSIC shows the retina and directions of currents.
    relic: A fine drawing pen
    relic_desc: A pen so fine it drew every branch of a neuron.
    points:
      p1: Follow one branch back to its beginning
      p2: Keep annotation marks separate from the figure
      p3: Leave a precise question for another look
    vignettes:
      crossing: The student joins two strokes where they cross. You ask them to follow each back to its own beginning. One of the connections comes off the page.
      legend: A bold arrow hides a faint branch. You give the arrow a place outside the figure and ask the student to add a key, so both marks can be read.
      blank: You keep a blank space by the uncertain end of the drawing. The student leaves a question there for a second look instead of extending the line from memory.
  marconi_bologna:
    name: A signal and a silence
    place: Bologna
    figure: Guglielmo Marconi
    story: In his 1909 Nobel lecture, Marconi recalled starting wireless telegraphy trials near Bologna early in 1895. It uses the date and setting in the retrospective account and invents the individual test.
    relic: Two trial slips
    relic_desc: Fictional records of the same trial from the two ends.
    points:
      p1: Compare the heard marks with the sender’s record
      p2: Keep the two trials apart until the slips can be compared
      p3: Persuade the receiver to record the quiet interval as well
    vignettes:
      blank: Rosa expected three sounds and has already marked three. You ask her to turn her slip face down during the next trial. When she picks it up, she writes down what she heard, including a sound in the quiet interval. Now there is a reason to repeat the test.
      times: Carlo wants to carry the two sheets downhill together. Each says first trial at the top, although one was restarted. You ask him to show you where he waited and where he began again. He labels both attempts before setting off. The sender and receiver can compare the same run now.
      range: You know the range will matter to future readers. Rosa wants to know if the last click was one of the agreed marks. You take her sheet to the sender and leave the answer as a question for another trial. By then the people at both ends have gone inside.
  imhotep_saqqara:
    name: The working edge
    place: Saqqara, Egypt
    figure: Imhotep
    story: A statue base from Djoser’s complex at Saqqara bears Imhotep’s name and titles. Museums credit him with designing the Step Pyramid.
    relic: A joining-edge rubbing
    relic_desc: A fictional rubbing from the practice bench.
    points:
      p1: Support the practice block while the mason tries the edge
      p2: Stay at the bench until both surfaces can be checked
      p3: Find the part of the joint that catches before the pieces are moved
    vignettes:
      rock: Mut sees a flat face and reaches for the next block. You ask her to rock this one gently on the bench first. One corner taps the wood while the other stays clear. She marks the high spot so the person on the next shift can find it under a different light.
      turn: Hori can carry the two pieces away or keep the heavier one in place until Mut checks it. You hold the lighter block while he waits. Mut marks the mating edge on both faces. When the pieces are taken away, the marks go with them.
      name: You know which name later viewers will look for on the statue base. Hori wants to know which of the two trial blocks belongs with the one in his hands. You show him the matching mark. The statue and its inscription are still beyond the corner of the workshop you can visit.
  enheduanna_ur:
    name: Turn over the disc
    place: Ur, Mesopotamia
    figure: Enheduanna
    story: A calcite disc from Ur bears a ritual relief on one face and names Enheduanna on the other. Much later surviving copies of The Exaltation of Inana also name her in the voice of the poem.
    relic: A carved calcite disc
    relic_desc: A carved disc showing a priestess at an offering.
    points:
      p1: Record the inscription face separately from the relief face
      p2: Ask the stoneworker to show which face carries the name
      p3: Leave a drawing that lets a future copyist match the two faces
    vignettes:
      inscription: You remember that the museum will catalogue both faces. The stoneworker has set the disc down with the inscription against the bench. You draw the relief while he works, then get a second drawing when he turns it over. You can take home two views. They do not say who first composed the hymn.
      support: The stoneworker asks you to steady a pad beside the disc. With both hands on it you miss the first glimpse of the inscription. He leaves enough time for you to mark on your sketch which side you missed. The name itself will have to wait for another visit.
      edge: The two sides fill the stoneworker’s account of the disc. On your sketch you also mark how thick the edge is, so you can tell which two drawings belong to the same object. You leave with one sketch and no copy of the hymn.
  hammurabi_babylon:
    name: Law set in stone
    place: Babylon
    figure: Hammurabi
    story: The Louvre's Old Babylonian stele preserves decisions concerning property, trade, labour and other matters. Its exact original location is uncertain.
    relic: A clay cylinder seal
    relic_desc: A small stone cylinder that rolls a signature into clay.
    points:
      p1: Follow the clause from its opening condition
      p2: Explain a rule through an invented example
      p3: Check where the two copies part company
    vignettes:
      condition: The apprentice skips a sign when he reads the condition aloud. You ask him to start the clause again. The listener now catches when the obligation applies.
      case: The apprentice gives you the same answer twice. You change one detail in the imaginary example and ask him to decide again. He has to go back to the line about the kind of property.
      edge: You set the clay practice tablet where the light catches its angled impressions. The apprentice follows the line without losing the first sign.
  lalibela_rock:
    name: Look for the outlet in the rock
    place: Lalibela, Ethiopia
    figure: Lalibela and the stonecutters
    story: UNESCO’s site record describes the rock-hewn churches of Lalibela and their ditches, trenches and passages. The year is an approximate setting, without assigning a year to a particular cut.
    relic: A stonecutter's chisel
    relic_desc: An iron chisel, the edge ground thin.
    points:
      p1: Keep the paper clear and steady while the channel is traced
      p2: Walk as far as the end visible from the trench
      p3: Separate the passage line from the drainage line
    vignettes:
      outlet: The works helper has taken a line for footsteps and extended it down the water channel. You ask where the channel itself breaks out of the rock. He can point only as far as the bend. You put an unfinished end on his plan. You leave before anyone traces beyond it.
      rain: You know the surviving site will have ditches as well as paths. Here there are dry marks that could be either. You carry the sketch to the lower bend and add a separate mark for the channel lip. The rock has not seen rain again when you leave.
      bend: You follow the helper down one side of the trench and draw a notch at the turn. He can find your place without taking every line on the sheet for a route. You keep the little notch. The next section is beyond what you saw.
  ife_bronzes:
    name: The line that must survive the cast
    place: Ife, Nigeria
    figure: The casters of Ife
    story: The British Museum catalogues a brass head from the Wunmonije Compound in Ifẹ̀ with cast and incised features. It records lost-wax casting. Its markings illustrate a problem of comparison.
    relic: Two study drawings
    relic_desc: Drawings comparing lines on a plain casting sample.
    points:
      p1: Keep the labelled sample in view while its line is copied
      p2: Take the comparison drawing to the other work bench
      p3: Identify which line was recorded before the surface was finished
    vignettes:
      line: The helper is about to label a new scratch as part of the first design. You keep his drawing from before the finishing work and lay it next to today’s sample. He draws the new line on a separate scrap. You take home the pair. The next cast’s surface is still unseen.
      surface: You know a later museum will describe cast and incised features separately. The helper only wants to know where the new line starts. You tilt the wooden board under the sample and help him draw its edge on the slip. By the time it goes back to the bench, you are on the way home.
      edge: You make one drawing of the practice sample and a second line beside it for something seen only today. The helper can put the two beside the next sample instead of relying on memory. You keep the comparison. The finished work never passes through your hands.
  great_zimbabwe:
    name: The passage in the plan
    place: Masvingo, Zimbabwe
    figure: The builders of Great Zimbabwe
    story: Great Zimbabwe’s Great Enclosure has a large curved wall built of dry-laid granite, and an inner wall running beside part of it to create a narrow passage. The map year marks a period in the growth of the settlement.
    relic: A sketch of the passage
    relic_desc: A work drawing that leaves the route blank between both walls.
    points:
      p1: Hold the sketch as the marker walks beside the second wall
      p2: Walk along the passage until the two lines separate on the plan
      p3: Identify which of two measurements belongs to the passage
    vignettes:
      lines: The marker draws one thick line for the space between the walls. You turn the sheet and ask him to leave a strip of paper clear between the two edges. Now a runner can follow the strip rather than the masonry. You bring home the revised outline, with the far end still unchecked.
      width: You follow the marker far enough to see that the inner line does not continue all the way round. He has extended it out of habit. You stop the pencil line where your check ends, and leave the remaining paper clear. The next check lies beyond the turn.
      pace: You mark two short wall edges and draw nothing in the gap. The marker can point to the way through without drawing on a wall. You keep the space between the lines in your copy. The closing bend stays outside the sketch.
  timbuktu_sankore:
    name: A page by the mosque
    place: Timbuktu, Mali
    figure: Mansa Musa and the scholars of Sankore
    story: Timbuktu’s monuments and manuscript collections document a long history of learning, especially in later centuries. A heritage survey associates the date 1327 with Djingareyber. The surviving 1733 astronomy manuscript in the source notes belongs to a much later time.
    relic: A reader’s marker
    relic_desc: A fictional marker for finding one line on a loose page.
    points:
      p1: See whether the heading on the loose practice leaf still makes sense
      p2: Hold the standing reader’s place while the writing is gathered
      p3: Wait through the second reading to catch which heading is hers
    vignettes:
      title: Aminata finds a practice leaf under a board. Its top line identifies the topic but leaves out who copied it. You walk it back to the reading bench before the seats are cleared. She recognises the hand, and the borrowed sheet goes back to the person who lent it.
      wind: Musa has gathered the loose pages and is ready to close the door. Aminata is still at the middle of a line. You hold a spare scrap at the place she indicates while he lifts the pages. When she comes back, the one place she wants to find is still marked.
      collection: You have seen photographs of a much later Timbuktu astronomy manuscript. Musa points to his neighbour’s loose exercise and asks how to describe it. You take its heading from the page in his hands. The later book will be copied generations after you leave.
  al_haytham_cairo:
    name: One slit of light
    place: Cairo
    figure: Ibn al-Haytham
    story: In the Book of Optics, Ibn al-Haytham discusses seeing parts of an object through an aperture as the object is moved.
    relic: A practice aperture screen
    relic_desc: An imagined screen used to compare two positions.
    points:
      p1: Match the visible mark to the one on the moving board
      p2: Hold the screen still while the board moves
      p3: Stay to watch the trial with one mark covered
    vignettes:
      slit: Maryam sees the dark edge and records the whole stripe. You ask Yusuf to slide the board until a different strip shows through. She draws both positions next to the one opening. She can now tell a change in the board’s position from a change in the slit.
      cover: Yusuf wants to swing the lamp round for a better view. You keep it where it is and let him cover one mark on the board. Maryam calls out when that mark disappears. By the time the door is opened, she has tried one change she can make again.
      term: You know the name later readers will give to experiments with small openings. Maryam has time for one observation before the room must be shared again. You ask her to say which mark she actually sees. The room brightens before anyone can repeat it.
  house_of_wisdom:
    name: The missing line in Baghdad
    place: Baghdad
    figure: Al-Khwarizmi and the House of Wisdom
    story: In a letter compiled around 855–856, Ḥunayn ibn Isḥāq describes obtaining and comparing manuscripts for Syriac and Arabic translations of Galen. The later letter illustrates a practice.
    relic: A practice copy with a missing line
    relic_desc: A fictional copy from the imagined Baghdad desk.
    points:
      p1: Check where the two copies stop agreeing
      p2: Preserve the gap and its source as the stack is carried away
      p3: Agree on a wording the translator can mark as provisional
    vignettes:
      line: Salma runs her finger down a neat copy and misses the place where two lines ran together. You read from the rougher sheet while she follows the clean one. She hears what did not survive in her copy and marks exactly where it fell away.
      versions: Ilyas must carry a version to the translator before the door is shut. He can take the clear copy alone or carry its troublesome companion too. You tie them so that the disputed place opens first. The translator can decide with both sheets in hand.
      gloss: You recognise a term by the form later books will use. Salma can point to a lacuna in the source but has nothing to fill it from. You give her a margin note indicating a possible reading. Nothing in the running text has changed when the packet leaves.
  ibn_sina_hamadan:
    name: Which of the five books
    place: Hamadan, Persia
    figure: Ibn Sina
    story: The Canon of Medicine is arranged in five books. The U.S. National Library of Medicine places the completion of its long composition in Hamadan, and the Bodleian dates the work to about 1025.
    relic: A practice index strip
    relic_desc: A fictional marker distinguishing two of the five books.
    points:
      p1: Find the book a reader needs by comparing its heading with the index
      p2: Talk through the two labels before the book leaves
      p3: Keep the working strip in place while the reading copy is moved
    vignettes:
      section: Ruqayya sends both requests to the same heading because both mention remedies. You ask her to open the index and point out which entry concerns a single substance and which concerns compounds. She puts one tab on each book. The two people at the table can now look for their entries without waiting for each other.
      sleeve: Yahya has to carry one copy away. Its guide slips will slide out if he tips the board. You help him fold the empty wrapper over the bookmarks while Ruqayya copies the two headings for the reader staying behind. The bench keeps a small index even when the book is gone.
      afterlife: You have seen the five books divided differently in a much later binding. Yahya asks where the first heading begins in this copy. You find its first line and leave the dates of future editions out of his note. You will miss his next reader trying the index from scratch.
  omar_khayyam_nishapur:
    name: The first day of spring
    place: Nishapur, Persia
    figure: Omar Khayyam
    story: In 1079 the Jalālī reform under Malikshāh aligned the beginning of the solar year with the spring equinox. Sources associate Khayyam with the reform, but accounts of the observing site differ. The scene does not locate the court’s observations there.
    relic: A calendar leaf with two headings
    relic_desc: A fictional comparison sheet made in Nishapur.
    points:
      p1: Find which new-year heading belongs to the equinox reckoning
      p2: Keep the two reckoning headings visible as the table is carried away
      p3: Explain which new year the reader means before writing the date
    vignettes:
      spring: Parvin has copied the heading from the older table onto the new sheet. You put the two together and ask her where each places its year’s beginning. She crosses out the repeated heading and adds the convention beside each date. The table can now be read without guessing which year it means.
      carry: Farid can carry one sheet folded in his sleeve. The two headings straddle the fold. You help him copy them onto the outside so the reader can see which columns to compare. The sheet leaves by the door, with its original notes still inside.
      future: You know later tables will give the reform and its date in several reckonings. Parvin just needs a copy that a reader here can use. You leave both headings visible and resist adding a date from a calendar she has never used. The next reader has yet to arrive.
  al_jazari_diyarbakir:
    name: A book of ingenious machines
    place: Diyarbakır
    figure: Al-Jazari
    story: Al-Jazari's treatise on mechanical devices dates to 1206. A surviving manuscript folio copied in 1315 illustrates its elephant clock.
    relic: A brass cam
    relic_desc: A shaped wheel that turns a spin into a stroke.
    points:
      p1: Find the visible figures on the diagram
      p2: Describe the order in which two figures appear
      p3: Help the apprentice leave the sketch readable for a visitor
    vignettes:
      sequence: The apprentice explains every figure at once. You point to the first movement and ask what comes immediately after it. They start telling the story of the clock in order.
      viewer: A visitor never looks up from the largest figure. You ask them to watch the spot the apprentice marked instead. On the second demonstration they see the smaller movement in time.
      paper: You hold up the drawing while the apprentice points past it at the model. They add one small mark so a reader without the model will know where to look.
  ibn_battuta_tangier:
    name: Before the road grows long
    place: Tangier, Morocco
    figure: Ibn Battuta
    story: In the Rihla as compiled much later, Ibn Battuta recalls leaving Tangier in 1325 intending to make the pilgrimage. The opening distinguishes that purpose from the journey that followed. The porter does not travel in the documented party.
    relic: A travel-worn sandal
    relic_desc: A leather sandal resoled many times.
    points:
      p1: Carry a first-stop note together with the departure supplies
      p2: Get the porter to separate tonight’s stop from the final destination
      p3: Keep the note from before departure so the later account can be compared
    vignettes:
      distance: You tell the porter that later readers will follow this journey for years on a map. He asks whether that helps him find a place to rest this evening. You leave the far destination on one slip and the next stop on another. From Tangier you can see only the start of the road.
      departure: The porter has written a destination on his packing list and called it a route. You leave the heading but mark one blank beneath it for where the traveller actually stops. You take home the copy dated at departure. It does not yet carry a return date.
      roll: You keep two little slips rolled together, the intention and the first stage. At the edge of town you return the one a porter could use that day and keep the other. You carry a beginning back to the office. The rest of the story has barely started.
  ulugh_beg_samarkand:
    name: The source column in a star table
    place: Samarkand
    figure: Ulugh Beg
    story: The observatory at Samarkand associated with Ulugh Beg had a large meridian arc. The astronomical tables compiled by his team include a star catalogue. Most positions were based on new measurements, while some entries drew on older material. The year sets the beginning of the observatory period.
    relic: A slip with two sources
    relic_desc: Two marked rows for an older star position and a new observation.
    points:
      p1: Identify the reading whose source is missing
      p2: Keep two slips with different origins visible on the stand
      p3: Wait for a second reading before filling the observation row
    vignettes:
      source: The copyist has entered an older position on the line for tonight’s reading. You add a column for origin and move his label into it. Before the page leaves, both values are still legible. The sky never gives you the second reading before you return.
      arc: You have seen a later image of the great arc. Tonight the copyist sees only a line of numbers that have come down from it. You put the place of measurement at the head of the slip. He leaves it there with the figures. The catalogue itself will be completed long after your visit.
      hold: You leave one place for a measured figure and a second for a value taken from the older table. The copyist can now read both without thinking they came from the same observation. You carry the two labels back. The page has yet to be put into the catalogue.
  laozi_hangu:
    name: The traveller at the pass
    place: Hangu Pass, China
    figure: Laozi
    story: Sima Qian’s much later Shiji tells of a gatekeeper named Yin Xi asking Laozi to leave a written work. It describes two parts and more than five thousand words, and gives variant accounts of Laozi’s identity. Its year, the named pass, and the helpers’ work are settings for the story.
    relic: A practice slip with a position mark
    relic_desc: An invented prop from the legendary gate scene.
    points:
      p1: Ask the gate helper to let the two bundles lie apart
      p2: Read the position marks before the bundle is tied
      p3: Keep the loose slips in order while the cart is called up
    vignettes:
      two: Shun has made room on his shelf for one bundle. Another comes across the table with the cord still loose. You set the two bundles end to end and ask which was read first. He makes room for both without tying them into one.
      tie: Xi has to move the shelf before the gate closes. You hold the loose slips together while she rethreads the cord. She keeps one practice slip aside with the position marked. The next keeper will know where to put it back.
      ox: You remember pictures of a traveller on an ox. Shun only heard a cart beyond the gate and asks what to enter. You let him write that much. When you turn back for a look yourself, the noise has already passed beyond the wall.
  confucius_qufu:
    name: Start with one corner
    place: Qufu, China
    figure: Confucius
    story: In Analects 7.8, the teacher uses one corner and the other three to describe a learner’s participation. The text preserves a teaching saying.
    relic: A practice board with one corner marked
    relic_desc: An imagined classroom prop made for the exercise.
    points:
      p1: Give the stuck learner a starting hint and time to use it
      p2: Set out the board with only one corner marked
      p3: Wait through a first attempt before offering the answer
    vignettes:
      corner: Ji holds her stylus above the first mark and waits for you to point to a second. You ask her to turn the board instead. She finds the next corner in her own time. When she hands the board to a classmate, she gives him only the first mark.
      explain: Qiu can point out all the corners and has already drawn them for Ji. You ask him to hide his own board and listen while she finds a way to describe the next turn. He hears her give a reason he had skipped. When he puts his board down, there is room for her to add it.
      answer: You know the exercise under the name it will have in other languages. Ji is about to tell you what she thinks comes next. You let her finish before giving the name. There is time to hear the next step, but you will miss how she teaches it to someone else.
  buddha_sarnath:
    name: What the listener carries
    place: Sarnath, India
    figure: Siddhartha Gautama
    story: The Buddhist discourse preserved as Saṃyutta Nikāya 56.11 places the teaching in the Deer Park at Isipatana near Varanasi, traditionally identified with Sarnath. It introduces a middle way and the four noble truths. The scene is not a dated transcript.
    relic: A listener’s plain cord
    relic_desc: A fictional keepsake from the walk to the Deer Park.
    points:
      p1: Listen while the other person tries to recall the opening
      p2: Separate what one person heard from what the other repeated
      p3: Stay to hear the part the first listener missed
    vignettes:
      middle: Nanda has remembered the rejection of two extremes but thinks the speaker stopped there. You wait while Sona recalls that a path was described next. Nanda tries the sequence aloud for the person she will meet later. This time she gets as far as the description of the path.
      pause: Sona repeats three parts in a rush and hesitates on the fourth. You ask where she stopped hearing the speaker and started relying on Nanda. They try the retelling in turns. After that, each knows which part to ask the other about.
      retell: You know later versions of the discourse will travel far. Nanda has to leave to meet someone and wants a short account she can remember on the walk. You listen to her try it once. You leave the park before hearing how the next person receives it.
  cai_lun_luoyang:
    name: Paper made cheaply
    place: Luoyang, China
    figure: Cai Lun
    story: The Book of the Later Han reports that Cai Lun presented his papermaking method in 105, listing bark, hemp waste, cloth and fishing nets.
    relic: A sheet of coarse paper
    relic_desc: A sheet with bits of fibre still showing.
    points:
      p1: Help the workshop hand handle a trial sheet
      p2: Find an uneven patch before drying
      p3: Wait until the sample can be lifted intact
    vignettes:
      light: You hold the two trial sheets up to the window. A patch that looked even on the board lets much more light through. The worker pins a mark beside it.
      ink: The worker passes you the smoother sheet. You ask to try the same brush on both before choosing one. The smaller mark turns out to be the easier one to read.
      tag: The worker lifts the drying board before you can ask which sample is which. You set two labeled scraps alongside the sheets so they can still be compared later.
  zhang_heng_luoyang:
    name: A direction and a later dispatch
    place: Luoyang, China
    figure: Zhang Heng
    story: The Book of the Later Han dates Zhang Heng’s seismoscope to 132. It describes eight dragon heads and reports an occasion when one ball fell although the capital felt no shaking, followed days later by news of an earthquake in Longxi. It does not reconstruct the hidden mechanism or date the Longxi report to 132.
    relic: A direction record
    relic_desc: One recorded direction, with a blank to be filled when a dispatch arrives.
    points:
      p1: Mark the direction associated with the signal
      p2: Keep signal and confirmation slips apart until they can be checked
      p3: Explain why a direction on the record is not a specific locality
    vignettes:
      register: The record keeper hears the signal in the exercise and reaches for a place name. You draw a space for the indicated direction and another for news received from outside the capital. Only the direction goes in. You take that two-part record home. There is no corroborating message before you leave.
      later: You know a later biography will say that a dispatch came from Longxi. The helper asks if it belongs on the present line. You leave a slip beside the record marked ‘awaiting word’. He can write on it when somebody arrives; your trip ends while the road is still quiet.
      direction: You mark the line for what was noticed at the instrument and leave the remaining space for a witness. When the helper folds the exercise, the blank stays visible. You take home just the direction. The name of the place is still on the road.
  zu_chongzhi_jiankang:
    name: Two bounds and a handy fraction
    place: Jiankang, China
    figure: Zu Chongzhi
    story: The Treatise on Pitch and Calendar in the Book of Sui records Zu Chongzhi’s lower and upper bounds for π, equivalent to 3.1415926 and 3.1415927. It lists the close fraction 355/113 separately. The surviving record does not give the full computation that produced the bounds.
    relic: A set of counting rods
    relic_desc: A bundle of slim rods that are numbers when laid out.
    points:
      p1: Identify the upper and lower bounds on the copied table
      p2: Stay to check the two bounds without losing the last place
      p3: Teach the difference between a bound and a convenient fraction
    vignettes:
      compare: A copyist has pencilled the fraction into the box meant for the upper bound. You compare 355 with 113 times 3.1415927. The product falls just short of 355, so the fraction goes on a line of its own. You keep the check. The steps that led to the two bounds are beyond your visit.
      digit: You know later readers will remember seven digits after the point, but the copyist is about to drop the last place of the lower bound. You mark where the two bounds first differ and have him read both again. You can copy the result. There is no time to reconstruct the calculation behind it.
      ratio: 'You make three spaces on one slip: lower, upper and handy ratio. The copyist can place all three entries without overwriting any of them. You bring back the slip. The complete calculation is still a blank in your notes.'
  aryabhata_patna:
    name: The circle in three steps
    place: Kusumapura, India
    figure: Aryabhata
    story: In the mathematics section of the Āryabhaṭīya, Āryabhaṭa gives a rule for the approximate circumference of a circle of diameter 20,000. Adding 4 to 100, multiplying by 8 and adding 62,000 gives 62,832. The map locates the visit in the period associated with the treatise.
    relic: A palm-leaf of verses
    relic_desc: A thin leaf with verses scratched in.
    points:
      p1: Reproduce all three operations in their order
      p2: Explain the starting diameter before passing on the result
      p3: Give the rope maker a worked example for a circle twice as wide
    vignettes:
      scale: The rope maker writes two diameters on the board but gives them the same circumference. You pair 20,000 with 62,832 and show him what scales when the diameter doubles. He changes one line. You take home the two pairs. The rope is still being measured when you go.
      measure: You know the rule will outlast everyone in the workshop. The rope maker wants to know how to remember it while working. You write the three steps in separate lines. He gets the next trial right without asking which addition comes last. The rope itself is left for another day.
      copy: You copy both the diameter and the approximate circumference before the board is wiped. The rope maker sees why he needs two numbers. You keep the pair on one slip and leave before seeing the rope laid around a circle.
  brahmagupta_bhillamala:
    name: A debt on the other side
    place: Bhillamala, India
    figure: Brahmagupta
    story: Brahmagupta’s Brāhmasphuṭasiddhānta gives arithmetic rules for debts, fortunes and zero. In those rules, subtracting a debt from a fortune increases it. The rules in the text for division by zero differ from modern arithmetic.
    relic: A palm-leaf with a small circle
    relic_desc: A leaf with a small round mark for nothing.
    points:
      p1: Work out the new balance when a debt of three is removed
      p2: Explain why subtracting a debt differs from subtracting money in hand
      p3: Save the instruction beside the example before the account is erased
    vignettes:
      debt: The bookkeeper has taken three away from a balance of five, though the entry he crossed out was a debt. You put the old entry at the head of the example. The new balance is eight. He closes the board before there is time to ask how his teacher handled division by zero.
      limit: You know a modern classroom treats division by zero differently. Beside the bookkeeper’s examples you mark which ones are about addition and subtraction. The example he needs today stays on the board. You take the list home but leave before the next lesson.
      token: You place five counters for what is held and a separate marker for the debt. The bookkeeper checks which entry his pen is crossing off. You take a note of the two columns home. The next account is already being opened as you leave.
  li_bai_changan:
    name: Poems of wine, moon and travel
    place: Chang'an, China
    figure: Li Bai
    story: Three pieces traditionally attributed to Li Bai are transmitted as the Qingping Tune. An accompanying account tells of a court performance, but is not a contemporary record of a particular evening.
    relic: A small wine cup
    relic_desc: A cup with a faint line of moon painted inside.
    points:
      p1: Listen for a change between two lines
      p2: Ask how a remembered performance was passed down
      p3: Leave the written verse legible for the next singer
    vignettes:
      verse: The singer stops at the line that fits the tune poorly. You ask them to speak it before singing it again. Their second breath falls where the thought turns.
      palace: The singer hears you ask who was in the palace that night. They set down the copied poem and ask which account you read. You leave a note that the two were handed down separately.
      copy: You keep the page open while the singer marks the place that always makes them pause. You can carry the written lines away and still remember where to listen for that pause.
  murasaki_kyoto:
    name: The world's first great novel
    place: Kyoto
    figure: Murasaki Shikibu
    story: Murasaki Shikibu's diary recalls an exchange in 1008 that plays on a character from The Tale of Genji, evidence that the story was already known at court.
    relic: A lacquered brush box
    relic_desc: A small box with brushes, a stone and water.
    points:
      p1: Tell a character's name from a nickname in the room
      p2: Follow the thread of a reading interrupted by talk
      p3: Give back the page without losing the reader's place
    vignettes:
      nickname: You hear someone use a name from the tale and look around for the wrong person. The attendant catches your mistake and asks whether you have been listening in the doorway again.
      voice: You notice the attendant changes her voice when she reads a letter in the story. You ask her to read the same line plainly. It sounds less certain the second time.
      return: A page gets passed to you halfway through the reading. You keep your finger where she stopped so nobody has to guess where the story should resume.
  su_song_kaifeng:
    name: A great water-driven clock tower
    place: Kaifeng, China
    figure: Su Song
    story: Su Song's illustrated treatise describes a water-driven tower with astronomical instruments and figures that announce time.
    relic: A gear tooth
    relic_desc: One bronze tooth of a gear as tall as a person.
    points:
      p1: Identify the parts of the documented tower
      p2: Tell two practice signals apart
      p3: Help the keeper set a clear place for visitors
    vignettes:
      listen: You stand beyond the door where the figures cannot be seen. The keeper strikes two practice signals. You repeat them in order and he checks them against their labels.
      layers: The keeper points to one figure but describes the one above it. You trace each storey on the drawing and ask him to assign one sound to each line before the next demonstration.
      marker: You put a marker outside the model where visitors should stand. The next pair can see the doors open without blocking the keeper's own view.
  shen_kuo_runzhou:
    name: A notebook of everything he saw
    place: Runzhou, China
    figure: Shen Kuo
    story: In Dream Pool Essays Shen Kuo records that the south-seeking end of a magnetized needle points slightly east of due south.
    relic: A magnetised needle
    relic_desc: A needle that finds the same direction every time.
    points:
      p1: Identify the south-seeking end of the needle
      p2: Keep the marked direction clear when the sheet is turned
      p3: Leave a caption that preserves the small deviation
    vignettes:
      directions: You ask the reader which line is due south. He has drawn just one. You add a second line on the paper, and the small angle the passage describes becomes visible.
      ends: The reader turns the paper over to show you the drawing and swaps the two ends as he retells it. You label the south-seeking tip before he copies it into the notebook.
      copy: You ask the reader to keep the word slightly in the caption. The drawing takes up a whole page; the difference described in the book need not.
  angkor_wat:
    name: The path marked on two sheets
    place: Angkor, Cambodia
    figure: The Khmer builders
    story: The APSARA National Authority records Angkor Wat as a twelfth-century monument with a sandstone causeway and galleries with carved reliefs. The map year places the visit in the building period.
    relic: A route sketch
    relic_desc: A drawing marking the sandstone crossing and the start of the gallery.
    points:
      p1: Walk the crossing and mark which side of the moat you are on
      p2: Hold the sketch in the same direction while the helper points out the turn
      p3: Give the next crew separate marks for the crossing and the gallery
    vignettes:
      route: The works helper has drawn the crossing and the gallery as one continuous edge. You face the sheet towards the approach and mark where the two lines stop matching. He can now indicate the handover point with one finger. You take the corrected sketch. The next crew has not yet tested it.
      load: You know later visitors will describe the reliefs long after this path is forgotten. The helper asks where someone carrying a drawing should pause without blocking the crossing. You walk back to the turn and mark one place on the sketch. You leave before a second carrier tries it.
      edge: You copy the edge of the moat onto one sheet and the first stretch of the gallery onto another. The helper places the two together where the path turns. You bring away the outline. You never see the whole gallery from this one spot.
  sejong_hangul:
    name: An alphabet anyone can learn
    place: Seoul
    figure: King Sejong and the scholars
    story: The Haerye edition promulgated in 1446 explains the writing system completed under Sejong in 1443.
    relic: A woodblock of letters
    relic_desc: A block carved with the first letters, ready to ink.
    points:
      p1: Find the beginning of the spoken syllable
      p2: Group the marks that belong to one syllable
      p3: Help the learner read a familiar word back
    vignettes:
      gesture: You repeat the sound slowly until the learner can describe what the tongue is doing. They return to the written mark and try it again without your voice.
      spacing: The learner leaves a line of parts in a row. You draw a box around the ones that belong together and ask them to read the group as one syllable.
      lesson: The learner sounds out a familiar word and leaves a gap for the part they have forgotten. You cover the earlier example and wait until they can fill it from memory.
  li_shizhen_qizhou:
    name: Which name goes with the entry
    place: Qizhou, China
    figure: Li Shizhen
    story: Li Shizhen completed a draft of the Bencao Gangmu in 1578. Early printed editions came later and included illustrations and editorial apparatus.
    relic: A copied specimen label
    relic_desc: A fictional work label with a place left for an alternate name.
    points:
      p1: Bring both labels back before the study table is cleared
      p2: Check whether the two names came from the same place
      p3: Keep the alternate name and its source with the entry
    vignettes:
      names: Alin has written the name she heard at market beside the one on the specimen wrapper. You ask which vendor called it that. She remembers the stall but not the district. The entry keeps both names and identifies only the source she can actually place.
      wrap: Ahe has time to carry one wrapped sample before the room closes. You put its tag inside the wrapper and copy it onto a scrap before he takes it. When the table is cleared, Alin can still see which name travelled with that sample.
      print: You remember a printed illustration of the entry. Alin wants to know whether she can use it to settle the name on her own wrapper. You leave the name with the source she can describe. The later woodcut will not be ready on this visit.
  basho_hiraizumi:
    name: The narrow road to the deep north
    place: Hiraizumi, Japan
    figure: Matsuo Basho
    story: Basho's Oku no Hosomichi, written after his 1689 journey, recalls Hiraizumi through present landscape and remembered history. It includes his verse on summer grasses.
    relic: A straw hat
    relic_desc: A woven hat grey with rain.
    points:
      p1: Make it to the resting place with the traveler
      p2: Notice one change in the view while stopped
      p3: Bring back a detail you saw for yourself
    vignettes:
      grass: The traveler asks what you are looking at. You wait for the grass to move again before answering. When you write the place down later, you remember the movement before the name.
      accounts: The traveler remembers a story that puts a landmark farther away than you can see. You put the story and the view on separate lines, then ask where the name came from.
      sandal: You move your bundle so the traveler can set the damp sandal flat. Between the two of you there is time to point out one place on the ridge before setting off.
  hokusai_edo:
    name: The Great Wave
    place: Edo, Japan
    figure: Katsushika Hokusai
    story: Hokusai's Under the Wave off Kanagawa is a woodblock print in Thirty-six Views of Mount Fuji. The Met dates its impression to about 1830–1832.
    relic: A woodblock for printing
    relic_desc: A carved plank of cherry wood.
    points:
      p1: Find Fuji among the shapes of the waves
      p2: Explain one detail to a visitor at the counter
      p3: Leave the title and signature visible on the display copy
    vignettes:
      mountain: The seller points to the foam. You ask him to cover the wave with his hand. Once he uncovers it, the little triangle in the distance looks less like another splash.
      edge: The seller wants to trim a practice sheet. You set the untrimmed copy beside it and show him how close the signature sits to the edge.
      counter: You turn the print towards a customer who keeps looking for Fuji above everything else. The customer finally finds it low on the page and asks to see another view.
  bose_calcutta:
    name: Turn the book a quarter turn
    place: Calcutta
    figure: Jagadish Chandra Bose
    story: In a paper read on 28 January 1897, Jagadis Chunder Bose reports that a bound book placed in a beam of electric rays transmitted the radiation much more readily after a quarter turn.
    relic: A crescograph part
    relic_desc: A lever that magnified a plant's growth ten thousand times.
    points:
      p1: Read the detector before changing the book’s orientation
      p2: Persuade the mechanic to try the first orientation again
      p3: Mark the starting orientation on the apparatus sketch
    vignettes:
      return: The mechanic turns the book and the response drops. You ask him to turn it back instead of packing away the apparatus. The response returns on this run. Now both changes go in the record. There is no time to try a second material.
      mark: The mechanic says he can remember which way the pages faced. You make one orientation mark on the drawing and one corresponding mark on the holder. He can return to the starting angle without guessing. The next comparison belongs to his shift.
      reading: You copy the reading beside a sketch of the book before touching anything. After the turn, you put the second reading on a fresh line. You bring home the pair. From two readings alone, the question of drift stays open.
  tagore_santiniketan:
    name: One poem, two readings
    place: Santiniketan, India
    figure: Rabindranath Tagore
    story: The English Gitanjali presents Tagore’s own prose translations from Bengali. In 1913 the Swedish Academy awarded him the Nobel Prize in Literature.
    relic: A hand-copied songbook
    relic_desc: A small book of songs in his own hand.
    points:
      p1: Check which handout is Tagore’s English rendering
      p2: Make room for a second reading in the other language
      p3: Keep the two reading sheets together for the next class
    vignettes:
      headline: You tell a student helping with the reading that the prize will bring readers who know only the English. The student asks which sheet they will reach for first. You leave both on the desk and label the English as the author’s rendering. You have time to hear only the first reading.
      pause: The student keeps stopping at the ends of the printed lines. You read a sentence aloud and mark one pause that comes earlier. The next reader gets through the whole thought. You keep a copy of the marked sheet, but leave before you can hear how the other version sounds.
      sheets: You pin two loose sheets together after the reading and mark which is which. The student can now hand both to whoever comes next. You take home the one pause you remember. The room is empty by the time you try it again.
  ramanujan_madras:
    name: A letter that asks to be checked
    place: Madras
    figure: Srinivasa Ramanujan
    story: On 16 January 1913, Ramanujan wrote from Madras to G. H. Hardy. The letter introduces his work and mentions his investigation of divergent series. The sample distinguishes ordinary partial sums from other ways of assigning values.
    relic: A slate
    relic_desc: A school slate, wiped and written on many times.
    points:
      p1: Check the first four ordinary partial sums in the exercise
      p2: Get the clerk to put the covering letter ahead of the practice sheets
      p3: Keep a separate copy so the first question can be answered later
    vignettes:
      sums: The clerk has written a single total beside an unending row of positive integers. You work out 1, 3, 6 and 10 as the first ordinary partial sums. He gives that column its own heading. You leave with a small table while the letter goes to England without you.
      future: You tell the clerk that the recipient will one day write about this letter. He asks what a man opening it for the first time will understand. You put the covering page before the sample sheet. The packet will be opened where you cannot see the reader’s face.
      address: You ask the clerk to read the outside address back to you before he ties the packet. On your own slip you keep the date and the question that starts the work. You leave before there can be any reply.
  franklin_philadelphia:
    name: Lightning is electricity
    place: Philadelphia
    figure: Benjamin Franklin
    story: Franklin sent Peter Collinson a letter about an electrical kite in October 1752. The surviving manuscript is in the Royal Society archives.
    relic: A silk ribbon and key
    relic_desc: A key tied to a kite string with a dry silk ribbon.
    points:
      p1: Find the observation on the page
      p2: Separate the date of the letter from the event
      p3: Read the corrected account back to the printer
    vignettes:
      cloud: The printer says the kite must have taken a direct strike. You ask which line reports that. They turn the sheet over and put the street story in a separate note.
      date: You catch the date going into the headline as the day of the event. The printer moves it back beside the address so readers can tell it is the date of the letter.
      proof: The printer asks you to read the proof aloud for someone who has not heard the town's version. A sentence nobody can trace comes back out of the type.
  morse_washington:
    name: What hath God wrought
    place: Washington
    figure: Samuel Morse
    story: On 24 May 1844 Morse sent a message from the U.S. Capitol to Alfred Vail in Baltimore. A surviving paper tape records the signals; Morse credits Annie Ellsworth with suggesting the wording.
    relic: A telegraph key
    relic_desc: A brass lever worn bright where a thumb rested.
    points:
      p1: Pick out the spaces on the practice tape
      p2: Keep the message with its sender's entry
      p3: Check the received text against the original wording
    vignettes:
      gap: You see the operator start a new word at the wrong gap. Reading the strip back together, you find the break where the next person will expect it.
      credit: You ask whose words the operator has put on the strip. The operator adds the sender to the ledger, and you leave space for the person who supplied the words.
      readback: The operator hands you a strip without the intended text. You read it back and compare it with the sealed slip only after finishing.
  edison_menlo_park:
    name: The clock beside the lamp
    place: Menlo Park, New Jersey
    figure: Thomas Edison
    story: Charles Batchelor’s Menlo Park notebook entry of 22 October 1879 records early tests with carbon made from cotton thread, including the light observed and a change in resistance. Its figures are practice observations for this branch.
    relic: A carbon filament bulb
    relic_desc: A glass bulb with one hair thin loop inside.
    points:
      p1: Keep watch through one handover and write down its time
      p2: Match the lamp material to its own readings
      p3: Stay until two observations can be told apart on the page
    vignettes:
      log: The workshop assistant writes that the lamp was still lit, but leaves off the time. You ask him to copy the clock reading into the next line before handing over. The next watch can tell how far apart the two observations are. The bulb is still lit when you go. Its full lifetime is not in your notes.
      future: You know electric lights will light whole streets. The workshop assistant wants to mark this lamp as ready on the strength of its first glow. You put a line in the log for a second observation. The lamp can stay on watch for another shift. You miss what the next material does.
      tag: Two slips are loose. You pair the one that names cotton thread with the readings from that bulb, then hand the pair to the next watch. You keep the handover time. The lamp is in someone else’s care when it finally goes out.
  wright_kitty_hawk:
    name: Twelve seconds in the air
    place: Kitty Hawk, North Carolina
    figure: Orville and Wilbur Wright
    story: In September 1903 the Wright brothers came back to their camp near Kitty Hawk with a powered machine. Wilbur's attempt on 14 December failed. On the morning of 17 December they made four flights, the first of twelve seconds and the last of fifty nine. That afternoon they walked to Kitty Hawk and telegraphed their father in Dayton.
    relic: A propeller blade
    relic_desc: A wooden blade shaped like a twisted wing.
    points:
      p1: Be taken in by the men of the life saving station, then help carry the launching rail up the dune
      p2: At the first flight, stand by the camera so the shutter is pressed at the right moment
      p3: At the telegraph, write the duration of the longest flight on a slip and hand it over with the message
    vignettes:
      numbers: '{staff} copies the four flights into a notebook in the order they were made, the seconds in one column and the feet in the other, and adds them up twice before the light goes.'
      sand: '{staff} digs the rail out of the drift after the night wind and stamps the sand flat at its foot. A helper from the station, made up for the game, says the wind will drop by morning, and it does not.'
      cold: '{staff} keeps the stove going in the shed while the engine is warmed. The puddles outside have frozen over, and nobody mentions it.'
  tenochtitlan_lake:
    name: A boat route between raised plots
    place: Tenochtitlan, Mexico
    figure: The Mexica builders
    story: Historical Tenochtitlan grew on an island in Lake Texcoco. Raised cultivation beds known as chinampas were fixed plots separated by water channels, as the later Xochimilco landscape shows.
    relic: A sketch of the boat channel
    relic_desc: A row of fixed posts and a movable slip showing the passing boat.
    points:
      p1: Walk to where the planted edge meets the boat channel
      p2: Keep the water gap marked as the boat moves through the sketch
      p3: Distinguish a fixed plot from a moving landing mark
    vignettes:
      fixed: The helper has drawn the whole planted plot where the boat was this morning. You show him the posts that still stand at the field edge and mark the boat on a loose slip. The slip can move while the field stays on the page. You leave before the boat returns.
      channel: You know later visitors will call such plots floating gardens. Here the helper has to find a way through water between two planted edges. You walk the bank far enough to mark the opening. There is room for the next boat on the plan. What it will carry is not on your sheet.
      posts: You mark one fixed row of posts and then where the boat passed beside them. The helper can read one mark without treating it as the other. You keep the interval on the sketch. From here you cannot see where the next channel leads.
  machu_picchu:
    name: Follow the water to the next stone basin
    place: Machu Picchu, Peru
    figure: The Inca builders
    story: Field studies at Machu Picchu record a canal carrying water from a spring to a stair-stepped series of sixteen fountains in the built area. The map year is an approximate setting.
    relic: A carved stone
    relic_desc: A palm sized stone with a straight, true edge.
    points:
      p1: Walk from the upper outlet to the next one before making a note
      p2: Keep the upstream and downstream observations in order
      p3: Mark the last place where you actually saw water
    vignettes:
      wet: The helper has marked every basin wet after seeing water at the first outlet. You walk to the next basin and draw two boxes, one for each observation. His second mark stays blank. You bring back the pair with one unanswered question, and miss whatever the next test finds.
      steps: You know a later survey will number the outlets in a series. The helper is counting from where he started this morning. You retrace the steps and agree which one is upstream of the other. The sketch can now be read in either direction. You are gone by the time water reaches the lower mark.
      mark: You copy one wet mark beside the upper basin and follow the channel to the next notch. You leave a small arrow for the helper. The lower basin is still outside the part of the plan you can confirm.
  maya_venus_tables:
    name: Five cycles in the margin
    place: Chichen Itza, Mexico
    figure: The Maya scribes
    story: The Dresden Maya Codex preserves Venus tables on pages 24 and 46–50, reckoning a cycle as 584 days. The test numbers are not records of an actual observation.
    relic: A painted bark strip
    relic_desc: A strip of bark paper with red and black glyphs.
    points:
      p1: Distinguish a count of cycles from a count of days
      p2: Check the next line against five cycles of 584 days
      p3: Leave the computed and observed columns with distinct labels
    vignettes:
      count: The learner has copied five beside the days. You write five short marks in one column and 2,920 days in the other. He can see why the labels change what the numbers mean. You bring both home. Neither tells what the sky will look like through a clouded dawn.
      dawn: You recognise the count from tables preserved in a later manuscript. The learner wants to enter the predicted day as a sighting. You ask him to wait until someone has seen the sky. One column now has a computed date and the other a blank. You miss the next clear dawn.
      margin: You copy 584 once, then beside it you write what the number is counting. The learner repeats the label before taking the sheet back. You can reconstruct the exercise at home. A sighting of Venus is still waiting on the weather.
  sequoyah_syllabary:
    name: A writing system made by one man
    place: Cherokee country, southeastern United States
    figure: Sequoyah
    story: Sequoyah devised a syllabary for Cherokee, adopted in 1821. Its signs represent syllables.
    relic: A syllabary chart
    relic_desc: A sheet with eighty-odd characters laid out in rows.
    points:
      p1: Match the signs to whole spoken syllables
      p2: Pass a practice slip to a second reader
      p3: Check how the second reader sounded out the word
    vignettes:
      sound: You wait while the learner says the word at their usual speed, then repeats it more slowly. The reader points to one sign at each syllable until the learner can do it alone.
      lookalike: A sign reminds you of a letter you already know. The reader has you listen to the whole syllable before you guess again. You cross out the English letter you had penciled in.
      note: You carry a practice slip across the room. The second learner reads it without having heard you dictate it, and the two of them compare how they said it.
  finlay_havana:
    name: Mosquitoes and yellow fever
    place: Havana
    figure: Carlos Finlay
    story: Carlos Finlay presented the mosquito hypothesis for yellow fever transmission in Havana in 1881. The title of his paper identifies it as a hypothesis.
    relic: A glass slide of mosquitoes
    relic_desc: A mounted slide with a mosquito wing.
    points:
      p1: Watch the moment the mosquito bites
      p2: Tend the yellow fever patients
      p3: Keep a daily record of cases for a whole year
    vignettes:
      headline: A fictional editor turns a suggestion into a certainty in the heading. You read the title back slowly. They put the word hypothesis back in before passing the proof on.
      columns: The editor reads their notes as if each line meant the same thing. You rule two columns for what was observed and what was proposed. A sentence changes columns.
      place: You check the name of the place where the paper was read. The editor puts it beside the date, so the report does not turn the meeting into a different one.
  bell_boston:
    name: Write down what came through
    place: Boston
    figure: Alexander Graham Bell
    story: Alexander Graham Bell’s laboratory notebook records that on 10 March 1876 in Boston, Thomas Watson heard and understood words Bell spoke into the transmitter.
    relic: A telephone receiver
    relic_desc: A wooden handpiece with a thin diaphragm.
    points:
      p1: Distinguish a recognisable word from a sound on the wire
      p2: Have the receiver write before the test sentence is shown
      p3: Compare what was sent with what was written at the other end
    vignettes:
      blind: The assistant at the receiver wants to see the sentence first. You fold the paper and ask him to write only what he hears. Two words come back intact and the last is left blank. You keep that slip. Another trial is about to start when you go.
      future: You tell the assistant that people will remember one sentence from this date. He guesses it will be whatever someone wrote on the transmitter side. You set out two slips, one for the speaker and one for the listener. The pair will show a difference the story of the famous sentence cannot tell you about this trial.
      door: You carry the receiver’s folded slip back through the door. Only then do you lay it beside the test sentence. The missing word is still missing, but the two matching ones now have a record. You take the comparison home and miss the next sentence.
  budj_bim_eels:
    name: Where the high water reached
    place: Budj Bim, Victoria, Australia
    figure: The Gunditjmara people
    story: Gunditjmara accounts of the Budj Bim cultural landscape describe a long history of using volcanic rock to manage water with channels and weirs, including for kooyang, the short-finned eel. The event date sets a period in that long history.
    relic: A woven eel trap
    relic_desc: A long basket with a funnel mouth.
    points:
      p1: Keep the drawing oriented along the practice channel
      p2: Identify a wet mark without treating it as a current reading
      p3: Agree with the helper on a point to look at again
    vignettes:
      level: The helper circles a wet stripe and calls it today’s waterline. You crouch where the leaf is still drifting and put a second mark below the first. Now the sketch carries both the trace and the moving water. You leave before the two levels meet again.
      return: You know people will still read the channels as parts of a connected system. The helper has room for just one mark. You choose a rock beside the bend and agree to compare from that same spot on the next visit. You keep the agreed position. The reading after the next rain is still to come.
      bend: You draw where the water goes out of sight and stop the line there. The helper leaves the rest of the paper clear for a later walk. You bring home one bend of a channel and not its whole course.
  galois_paris:
    name: The night before the duel
    place: Paris
    figure: Évariste Galois
    story: In a letter dated 29 May 1832, Galois summarized mathematical work for Auguste Chevalier and distinguished results from questions still to be pursued.
    relic: A hurried letter
    relic_desc: Pages crossed with figures and the words that he had no time.
    points:
      p1: Identify a question left for another reader
      p2: Keep the pages in their proper order
      p3: Leave the letter with its own date and recipient
    vignettes:
      check: The copyist puts a question among the conclusions. You trace it back to the request at the end of the letter. They mark what the next reader is being asked to check.
      sequence: Two pages both begin with the same symbol. You read the last line of each and find which one the argument needs first. The copyist adds a page mark.
      fold: You hold the letter open until the copyist has copied the date and recipient. They fold the notes separately so the two sets of paper can still be found.
  van_gogh_auvers:
    name: A summer in Auvers
    place: Auvers sur Oise
    figure: Vincent van Gogh
    story: In an Auvers letter from July 1890, Van Gogh describes painting broad wheatfields beneath unsettled skies.
    relic: A tube of chrome yellow
    relic_desc: A squeezed tin tube of the colour he used for the fields.
    points:
      p1: Pick out the changes in the sky above one field
      p2: Walk far enough to see where the path leads
      p3: Help the visitor bring a legible sketch back
    vignettes:
      sky: You ask the visitor to draw the same field twice, first leaving little sky and then leaving much more. They can name one thing the second drawing makes them notice.
      wind: The visitor thinks the stalks point one way and stays there to draw them. You wait for the next gust. The dark patch moves and neither of you has to rub it out from the first sketch.
      path: You walk until the visitor can see the end of the path in the field. On the way back, they leave the end out of their drawing and can still explain where it goes.
  abel_froland:
    name: The example and the claim
    place: Froland
    figure: Niels Henrik Abel
    story: Abel’s 1824 paper proves that there is no general solution by radicals for equations of degree five. Particular equations can still be solved that way. Abel died in Froland on 6 April 1829. On 8 April, unaware of his death, Crelle wrote from Berlin with news of a permanent post.
    relic: A sealed letter
    relic_desc: An unopened offer, tied with a thread.
    points:
      p1: Explain why a soluble example leaves the general question open
      p2: Stay long enough to check the copied example by substitution
      p3: File the worked example alongside the statement it illustrates
    vignettes:
      example: On the practice sheet a copyist has set a fifth power equal to 32. You substitute 2 and get 32, then underline the word ‘general’ on the separate slip about Abel’s result. The copyist files the two together. You can bring back the checked example. The news from Berlin has yet to be written.
      job: Knowing the date of Crelle’s letter, you ask the copyist to leave a place in the file for Berlin. He asks whether to label it as news already received. You leave the pocket empty and write down why. The letter will be written two days after Abel dies.
      margin: You copy a worked example on the back of a spare slip and put the more general statement on the front. A reader can turn it over instead of searching for a second sheet. The space for Berlin remains blank when you leave.
  riemann_selasca:
    name: The last paper
    place: Selasca
    figure: Bernhard Riemann
    story: Riemann's 1854 lecture manuscript examines the assumptions underlying geometry and how distances can be defined.
    relic: A page of notes
    relic_desc: A page of unfinished formulas in a small hand.
    points:
      p1: Follow a line while staying on the surface
      p2: Keep the same marked endpoints through the comparison
      p3: Explain one assumption behind a measurement
    vignettes:
      surface: The reader stretches a strip across two points and lets it leave the surface in between. You press a second strip down against the curve and ask which journey each one measures.
      assumption: The reader says the distance is obvious. You ask how they decided which paths to allow. They add that choice above the drawing and begin measuring again.
      paper: You help the reader keep the starting points marked when the practice sheet bends. They can now compare their two readings without having to find the points again.
  du_chatelet_luneville:
    name: Newton in French
    place: Lunéville
    figure: Émilie du Châtelet
    story: The complete French edition of Newton's Principia translated and annotated by Émilie du Châtelet appeared posthumously in 1759.
    relic: An inkwell
    relic_desc: A small inkwell from a desk worked at through the night.
    points:
      p1: Find the sentence the commentary is answering
      p2: Help the reader keep the two texts aligned
      p3: Leave a clear mark for the next reading
    vignettes:
      source: The reader follows one sentence straight into the next. You stop them where the commentary begins. Back at the first page, they can now tell who is doing the explaining.
      diagram: You ask what the words would look like on paper. The reader sketches a direction, then goes back to the text to check where the arrow belongs.
      mark: You move the paper mark from the next page to the exact line the reader wants to revisit. When the sheets are collected, the question stays with the passage.
  noether_gottingen:
    name: A lecture under another name
    place: Göttingen
    figure: Emmy Noether
    story: In her 1918 paper Noether connects continuous symmetries of a variational problem with corresponding conservation relations under stated conditions.
    relic: A lecture notice
    relic_desc: A hall notice with Hilbert's name where hers should be.
    points:
      p1: Identify the transformation in the example
      p2: Read the assumptions back before discussing the conclusion
      p3: Help a listener separate symmetry from the conserved quantity
    vignettes:
      clock: You ask whether starting the same example later changes its rule. The listener moves the clock's starting mark and redraws the margin figure without touching the rule itself.
      assumption: The listener remembers the conclusion but skips its assumptions. You write those on a separate slip and ask which change would make that slip cease to apply.
      board: You copy two headings before the board is wiped. The listener puts the transformation under one and the quantity that stays constant under the other.
  wegener_greenland:
    name: Across the ice
    place: Greenland ice cap
    figure: Alfred Wegener
    story: Wegener reached the inland station Eismitte in 1930 with supplies and died on the return journey. The account at the Alfred Wegener Institute preserves the expedition's sequence and identifies his Greenlandic companion Rasmus Willumsen.
    relic: A sledge strap
    relic_desc: A frozen leather strap from a loaded sledge.
    points:
      p1: Keep pace in the cold
      p2: Notice the weather turning
      p3: Haul the sledge to the end of the march
    vignettes:
      names: A fictional clerk lists the expedition under only one surname. You ask who handed over the load. They leave a line for the other people involved instead of recording just the best-known name.
      count: The clerk has made the first count look like the quantity delivered. You ask them to mark which station each figure came from. The two totals no longer sit under the same heading.
      note: You copy the destination onto a second slip while the clerk ties up the empty ledger. The next person can still tell which station the entries concern.
  boltzmann_duino:
    name: Same count, different arrangements
    place: Duino
    figure: Ludwig Boltzmann
    story: Boltzmann’s 1877 paper on probability and thermal equilibrium counts how many assignments of particles can yield the same distribution of energy. The Duino visit is set much later, in 1906.
    relic: A chalk stub
    relic_desc: A worn stub of lecture chalk.
    points:
      p1: Show which marks matter when you swap two labelled counters
      p2: Have the learner separate the total from the arrangements on the sheet
      p3: Keep the counting example simple enough to reconstruct after the visit
    vignettes:
      six: The learner counts one way to put two of four labelled counters in the left box. You name the two chosen counters on each line, and find six choices giving the same two-and-two count. He changes one total. You copy the list, though it cannot settle the questions the full paper asks.
      swap: You know the drawing alone will survive better than your explanation. You exchange one marked counter in each box and sketch the two results. Both still have two counters on each side. The learner can see what changed. You leave before a third box is added.
      boxes: You write two beside each box and circle the names of the counters inside. The learner keeps both descriptions on one sheet. You bring back a two-box example. The larger count is still on the table.
  cantor_halle:
    name: Sizes of infinity
    place: Halle
    figure: Georg Cantor
    story: Cantor's 1874 paper gives a way to enumerate the real algebraic numbers and shows that a list cannot contain all real numbers in an interval.
    relic: A set of index cards
    relic_desc: Cards covered with lists that never end.
    points:
      p1: Tell what the example list is supposed to include
      p2: Follow its rule for another entry
      p3: Explain what still needs proof after drawing the list
    vignettes:
      list: The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.
      after: The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.
      end: You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.
  tesla_wardenclyffe:
    name: The line marked proposed
    place: Shoreham, Long Island
    figure: Nikola Tesla
    story: Tesla’s 1901 correspondence with architect Stanford White concerns the Wardenclyffe buildings. The site was intended for a wireless system for communications and energy.
    relic: A retained drawing copy
    relic_desc: A fictional copy filed during the Wardenclyffe works.
    points:
      p1: Find the plan revision that the foreman actually received
      p2: Persuade the clerk to stamp proposed before the notice goes out
      p3: Keep the rejected version so the next shift can compare it
    vignettes:
      revision: The foreman has a page that says to use the latest drawing. Mabel lays two drawings on the desk; both bear the same heading. You find the pencilled date under a fold and send the newer copy to the yard. You mark the older one as superseded before anyone can collect it by mistake.
      print: Joe has set a line saying power is being sent from the site. He needs a full line to keep the notice balanced. You give him a sentence about what the site is being built to test. He reads the notice aloud, once as it was and once as it will go out, and keeps the new line.
      empty: You remember what will later remain of the tower. Mabel wants a place to file the result that nobody has brought from the yard. You make a folder for the proposed building and leave its results sleeve empty. You will not be there if the next shift brings anything to put in it.
  mozart_requiem_vienna:
    name: Leave the hand visible
    place: Vienna
    figure: Wolfgang Amadeus Mozart
    story: Mozart died in Vienna in December 1791 with the Requiem incomplete. The Austrian National Library preserves working material and a delivery score with contributions by Franz Xaver Süssmayr.
    relic: An unfinished practice leaf
    relic_desc: A fictional copying leaf showing where the surviving notes stop.
    points:
      p1: Make space for the copyist to stack the working pages in order
      p2: Identify where the written music stops on the practice copy
      p3: Protect the unfinished passage from being filled in at the copying table
    vignettes:
      stack: Greta is clearing the table and sets an empty-looking leaf aside. You hold the stack while Emil checks the page before it. The empty staff belongs in the sequence. Greta puts it back with a loose slip marking where it came from.
      hand: Emil can copy the line in front of him and is ready to carry straight on into an unwritten staff. You have him rule a small mark in the margin at the point where copying stops. In the finished handoff, the next reader can see exactly where a new hand would have to begin.
      finish: You can hum the passage as a future choir will sing it. Greta needs the copy now and asks where the written music on that page ends. You show her the boundary and keep the melody to yourself. The next version will be put together after you leave.
  schubert_vienna:
    name: The March programme
    place: Vienna
    figure: Franz Schubert
    story: Schubert gave a concert of his own works in Vienna on 26 March 1828. Eduard von Bauernfeld’s account reproduces the invitation, with the programme and the rooms of the Gesellschaft der Musikfreunde.
    relic: A song manuscript
    relic_desc: A song in a quick hand with the ink still dark.
    points:
      p1: Read the printed programme and mark where the next piece starts
      p2: Guide a late arrival to a seat without stopping the music
      p3: Stay for the last piece and return the seat list
    vignettes:
      timing: The usher wants to open the door as soon as the visitor comes. You count the pieces on the programme and ask them both to wait for the next pause. One person finds a seat and the musicians play on. You hear the ending from the corridor.
      memory: You tell the usher that people will look for this invitation long after the chairs are gone. He asks you to keep a clean copy away from the door. You put it aside and pencil the date on your own note. By the time you return, you have missed the opening.
      chairs: You make a small mark beside one empty chair on the usher’s list. When a late arrival appears, he doesn’t need to ask the whole row to move. You take home the date and the mark. You never see whether the visitor stayed to the end.
  keats_rome:
    name: A room by the steps
    place: Rome
    figure: John Keats
    story: In November 1820 John Keats, ill with tuberculosis, came to Rome with the painter Joseph Severn and took rooms at 26 Piazza di Spagna beside the Spanish Steps. He died there on the night of 23 February 1821 and was buried on 26 February in the Protestant Cemetery. At his wish, his gravestone does not give his name.
    relic: A pressed violet
    relic_desc: A dried flower kept in a book.
    points:
      p1: Be taken in by the house, then carry the bread and milk up the stairs each morning
      p2: In the last nights, sit up in Severn's place so he can sleep a few hours
      p3: On the day of the burial, stand by the grave in the Protestant Cemetery
    vignettes:
      stairs: '{staff} counts the steps from the door to the room, so as to know how long the tray will stay warm, and writes the number in the margin of a shopping list.'
      window: '{staff} props the window a little so the sound of the fountain in the square comes in. Nobody in the room says anything about it, and nobody closes it.'
      fountain: '{staff} fills a jug at the boat shaped fountain at the foot of the steps. A flower seller, made up for the game, asks who in the house is ill, and gives a bunch of violets for half the price.'
  vermeer_delft:
    name: The painter in debt
    place: Delft
    figure: Johannes Vermeer
    story: Vermeer died in Delft in 1675. The Rijksmuseum's exhibition documents the debts his household faced and the paintings Catharina Bolnes pledged to the baker.
    relic: A pearl earring
    relic_desc: A small pearl of the kind he painted so often.
    points:
      p1: Find a visual detail that identifies a work
      p2: Check a description with the person who remembers it
      p3: Keep a pledge distinct from a sale in the copy
    vignettes:
      motif: The clerk remembers the light in one picture but cannot tell you which picture it was. You ask what the figure was doing. They write down the action beside the title, so the next person has two clues.
      pledge: Someone has copied a pledged picture into the column for sold goods. You find the earlier entry and ask the clerk what each word puts on the record.
      cover: You hold the ledger open while the clerk looks across the room for the description they need. When they return, the right page is still waiting.
  rembrandt_amsterdam:
    name: After his son
    place: Amsterdam
    figure: Rembrandt van Rijn
    story: The dated Self Portrait at the Age of 63 shows that Rembrandt was painting self-portraits in 1669, the year of his death.
    relic: A brush
    relic_desc: A worn brush with the paint dried in the hairs.
    points:
      p1: Notice what changes when the face turns
      p2: Help the apprentice settle on a place to sit
      p3: Leave the exercise ready for another look
    vignettes:
      mirror: The apprentice keeps drawing the face they expected to see. You ask them to turn a little and wait until they can describe the light before drawing again.
      seat: You put a chalk mark beside the stool before the apprentice takes a break. On returning they find the angle again without moving the whole table.
      look: You sit beside the apprentice until their gaze stops darting between mirror and paper. When they show you the drawing, one corner is still blank and they decide to leave it.
  gaudi_barcelona:
    name: Struck by a tram
    place: Barcelona
    figure: Antoni Gaudí
    story: The Saint Barnabas tower on the Nativity façade was completed in 1925. The Sagrada Família was still unfinished when Gaudí died in 1926.
    relic: A plaster model
    relic_desc: A small hanging model of a vault.
    points:
      p1: Find a finished feature on the drawing
      p2: Compare the drawing with the view from the street
      p3: Leave a note that makes the next visitor's bearings clear
    vignettes:
      outline: The clerk holds a plan so the visitor can see all the towers together. You shade the one that already stands. The visitor now has a landmark to look for outside.
      street: You ask the visitor to step to the next corner before looking up again. A finished shape on the plan was hidden from the first position. They mark where they stood.
      copy: You hand the plan back while it is still folded on the place the clerk showed you. They add a mark for the next visitor, who will approach from a different street.
  kafka_kierling:
    name: Proofs in the sanatorium
    place: Kierling
    figure: Franz Kafka
    story: The 1924 edition of A Hunger Artist contains four stories, including Josephine the Singer, or the Mouse Folk.
    relic: A page of proofs
    relic_desc: A galley proof with small corrections in pencil.
    points:
      p1: Find the story that belongs with the contents entry
      p2: Place a correction beside the right line
      p3: Pack the named proofs so their order is clear
    vignettes:
      sound: The messenger reads the singer's title aloud and asks why anyone would doubt what they hear. You have them read the same line to two listeners. The answers differ before you say a word.
      mark: A proof mark sits between two lines. You ask the messenger which line they would change if all they had was this page. They move the mark before it can be taken the wrong way.
      packet: You straighten the loose sheets while the messenger checks the contents. The last story goes in its own fold, with the page number showing.
  dickinson_amherst:
    name: Poems in a chest
    place: Amherst
    figure: Emily Dickinson
    story: Many of Emily Dickinson's poems survive in manuscripts.
    relic: A sewn booklet
    relic_desc: A few pages sewn by hand with a poem on each.
    points:
      p1: Identify a pause marked on the page
      p2: Keep a loose scrap with the lines it belongs to
      p3: Leave a transcription that retains the alternate reading
    vignettes:
      pause: The reader makes the dash disappear as they read aloud. You ask them to pause where the pencil broke off. They try the line again and hear a different ending.
      variant: You see a word written above the line. The reader wants to choose one version and move on. You make room in the margin for both and label which comes from where.
      stack: The reader straightens a loose pile. You keep two scraps together because their edges and handwriting match. The next clean copy starts with them side by side.
  poe_baltimore:
    name: The note from the Fourth Ward
    place: Baltimore
    figure: Edgar Allan Poe
    story: On October 3, 1849, printer Joseph Walker sent Joseph Snodgrass a note saying that a man identifying himself as Edgar A. Poe was in distress at Ryan’s Fourth Ward polls. Poe died on October 7. The cause remains uncertain.
    relic: A walking cane
    relic_desc: A plain cane with a worn handle.
    points:
      p1: Check the recipient and the location on the request for help
      p2: Find someone who can take the note straight to its recipient
      p3: Keep the passage open for the people coming to help
    vignettes:
      witness: A print-shop helper has heard three reasons for the man's condition. You ask which one he saw. He can give you a place and one man's name. On the spare slip you keep those two details. Four days later there will still be people filling in the rest.
      dispatch: The print-shop helper wants to wait for someone who knows Poe. You send him with the address he already has. He comes back able to say the note reached the right door. You keep the route on a scrap. He has nothing to tell you about the days before that afternoon.
      door: You move a stool out of the passage and keep it clear while the helper runs the note. On the way back you jot down the two doors you can vouch for. The missing days stay outside the report.
  sor_juana_mexico_city:
    name: The last books given away
    place: Mexico City
    figure: Sor Juana Inés de la Cruz
    story: In her 1691 Reply to Sor Filotea, Sor Juana describes her drive to study and uses ordinary kitchen observations to make a point about learning.
    relic: A quill pen
    relic_desc: A quill with a split tip beside an empty shelf.
    points:
      p1: Find an observation from ordinary life
      p2: Read a passage with its surrounding argument
      p3: Help the reader leave a question for later
    vignettes:
      aristotle: The reader smiles at the passage wondering what Aristotle might have written if he had cooked. You hand them a blank slip and ask for one kitchen question that would actually bear writing down.
      ordinary: You find the everyday example the reader had passed by on the way to a learned name. They reread it and discover which question the name had nearly drowned out.
      reply: You keep the copy open where the reader has stopped. They put a finger on the sentence they want to come back to before returning the rest of the papers.
  mary_anning_lyme_regis:
    name: Bones in the cliff
    place: Lyme Regis
    figure: Mary Anning
    story: Mary Anning discovered a complete plesiosaur skeleton at Lyme Regis in December 1823. Her sketch records the remarkably long neck.
    relic: An ammonite
    relic_desc: A coiled fossil shell split from the blue lias.
    points:
      p1: Distinguish a crack from an outline
      p2: Follow the neck on the sketch without skipping a joint
      p3: Leave a useful copy with the discovery credited
    vignettes:
      stone: The visitor traces a crack as though it were bone. You ask them to keep following it past the neck. When the line leaves the skeleton, they lift their pencil.
      vertebrae: You and the visitor trace the neck from opposite ends. Their counts disagree at the same place. You leave a bracket there instead of silently adding a bone.
      pose: You rotate the copy until the visitor can find the head without your help. They turn it back before writing the specimen's name below.
  hertz_bonn:
    name: A spark that is easy to miss
    place: Bonn
    figure: Heinrich Hertz
    story: Hertz’s earlier electromagnetic experiments used small sparks in a resonator as evidence of electrical oscillations. Fraunhofer HHI’s experiment chronology records that he also used a microscope to watch the spark. The 1894 Bonn scene is an imagined repeat by a workshop assistant. It is set after the original experiments.
    relic: A spark gap
    relic_desc: A small brass spark gap from his experiments.
    points:
      p1: Identify the tiny spark that signals a response in the receiving loop
      p2: Ask the assistant to keep the viewing position steady for a second trial
      p3: Keep an uncertain observation separate from a negative result
    vignettes:
      repeat: The assistant is writing ‘none’ after one glance. You put the receiver back where it was and ask him to watch through the lens again. A brief spark appears on the second look. You change the first entry to ‘uncertain’. Its cause is still open when you leave.
      signal: You know later devices will carry signals much farther. The assistant asks if the spark itself can carry a sentence. You leave two empty columns on his page, one for a recognised spark and one for any pattern he can reproduce. There is time to fill only the first.
      gap: You hold the written record at the bench and let the assistant call out what he sees. One entry remains blank because neither of you had a decent view of the gap. You bring back that honest blank. Further trials are still on his list.
  kepler_leonberg:
    name: What the witness saw
    place: Leonberg
    figure: Johannes Kepler
    story: In his defence of his mother Katharina, Johannes Kepler dated her arrest to 7 August 1620 and set out the delays in the proceedings at Güglingen. This visit starts among her papers in Leonberg.
    relic: A checked defence copy
    relic_desc: A fictional copying sheet with one corrected date.
    points:
      p1: Ask the scribe to keep an allegation with the name of its speaker
      p2: Keep the two copies together until they can be compared
      p3: Earn enough trust to read back what the messenger actually heard
    vignettes:
      heard: Margarete has written that a neighbour saw something. When you ask which neighbour, she can only name the man who repeated it at the door. She copies the two claims onto separate lines and leaves a place for a first-hand account if one comes.
      compare: Matthias wants to send the first copy now and keep the second at the desk. You read one against the other and find that a date has lost a digit. He waits while Margarete checks the original. The messenger takes the corrected copy as the bells finish striking.
      release: You know Katharina will eventually be released. Margarete asks what should go on the packet she has in her hands today. You write the day of dispatch and help her dry the ink. The date of release still lies beyond this visit.
  pushkin_st_petersburg:
    name: A place before its house number
    place: St Petersburg
    figure: Alexander Pushkin
    story: The Pushkin Apartment Museum records Pushkin's death in this apartment in February 1837 and reproduces his description of the address near the Konyushenny Bridge, in Princess Volkonskaya’s house. The familiar number 12 dates to 1880.
    relic: A book of his verse
    relic_desc: A small book with a pressed leaf at one poem.
    points:
      p1: Earn the door attendant’s trust so you can pass on directions
      p2: Stay by the bridge until a late visitor finds the right entry
      p3: Keep the corridor quiet for those who need to go upstairs
    vignettes:
      number: You nearly give the visitor the number you remember from the museum. The door attendant asks which house you mean. You cross out the number and draw the bridge on the slip. The visitor finds the door. You will be long gone when the number you first wrote is put up.
      queue: The door attendant can answer one visitor at a time. You write the same directions twice so the next two can stop asking separately. You keep the draft on which you worked out the turn from the bridge. You still have no word from the room when you go.
      river: You walk from the bridge with the door attendant and count which turns belong in the directions. Before you go, one person uses your little map without needing to hear a house number. What happens beyond the entrance stays on the other side of the door.
  chekhov_badenweiler:
    name: A reply to Villa Fredericke
    place: Badenweiler
    figure: Anton Chekhov
    story: In a June 1904 letter from Badenweiler, Chekhov gives Villa Fredericke as his address and describes a sunny garden and a writing table.
    relic: A pince nez
    relic_desc: Small round spectacles on a cord.
    points:
      p1: Get a second copy of the return address onto the envelope
      p2: Find which path from the garden reaches the letter box
      p3: Prepare the quiet room while the family keeps the writing table free
    vignettes:
      address: The house assistant has copied the town but left off the villa. You put the two slips side by side and catch the missing line before the post goes. You take home a blank address slip with the route sketched on the back. The reply itself is still on its way when you leave.
      garden: The house assistant starts to carry the writing table out to make room. You find a dry place for the spare chair instead. The letter can finish where it began. On your own slip you draw the corner of the table. You will never see the person who opens that envelope.
      post: You ask the assistant which way the post goes and walk it once before the letter is ready. By evening you can draw the route from the villa without turning the paper. You bring that sketch back. What went inside the envelope stays with its writer.
  puccini_brussels:
    name: A divider for the unfinished score
    place: Brussels
    figure: Giacomo Puccini
    story: Puccini left Turandot incomplete. The Puccini Study Centre distinguishes the surviving drafts and scores and credits Franco Alfano with completing the duet and final scene.
    relic: A sketch page
    relic_desc: A page of musical sketches in soft pencil.
    points:
      p1: Distinguish the working drafts from the clean score
      p2: Keep two versions of the same passage in view while they are checked
      p3: Place a divider before the unfinished passage
    vignettes:
      divider: The copyist has laid a sketch after a clean score page as if they belong to one continuous copy. You insert a divider and label each side. He can now retrieve either without mistaking it for the other. The missing stage ending will be someone else’s task.
      future: You almost tell the copyist how the opera will end. He asks which sheet you are reading that from. You put the later ending out of your own notes and write down what is actually in front of you. There are two packets and no final page you can copy.
      pin: A loose sheet lifts when the copyist opens the packet. You keep it where he can find it and draw a little sign on the wrapper. You carry the position away in your notebook. You will not be there when the missing music is supplied.
  schumann_endenich:
    name: The tune in another key
    place: Endenich
    figure: Robert Schumann
    story: The Library of Congress dates a copy of Schumann’s Papillon no. 10 to his stay at Endenich, 1854–1856, and identifies it as a transposition from C to B-flat major.
    relic: A labelled practice score
    relic_desc: A fictional page marked for a comparison of keys.
    points:
      p1: Ask the helper to play the opening on the other key
      p2: Compare the two starting notes and mark both headings
      p3: Keep the second version apart from the sheet already taken downstairs
    vignettes:
      key: Lina thinks the first note was copied wrong. You ask her to start each version on its own note and play a few bars. She can hear the tune go the same way from a different pitch. Instead of rubbing either page out, she writes the key above each.
      envelope: Emil has an envelope ready for only one page. You fold a wider wrapper so he can carry both without covering Lina’s headings. At the door he reads the two key names back to her. She can put the keyboard cover down without wondering which copy went away.
      gift: You remember that a manuscript will eventually be given to Schumann’s daughter Marie. Lina has only the practice pages and wants to know which she should keep by the instrument. You help her put the keys on their sleeves. The history of the actual manuscript will continue beyond the room.
  nietzsche_turin:
    name: The address on the back
    place: Turin
    figure: Friedrich Nietzsche
    story: The Basel University Library holds a letter from Nietzsche to Franz and Ida Overbeck, signed Dionysus and dated approximately 4 January 1889 in Turin. Overbeck travelled to Turin after hearing from him. The famous account involving a horse is treated as an anecdote of uncertain detail.
    relic: A duplicate luggage label
    relic_desc: A fictional label copied without reproducing private correspondence.
    points:
      p1: Ask the porter to distinguish an address from the signature
      p2: Give the attendant time to finish wrapping private papers
      p3: Help the caretaker read the travel label without opening the letter
    vignettes:
      address: Pietro has copied the name Dionysus into the destination line of his inventory. You turn the practice slip and show him the line that names the recipients. He corrects the inventory without writing an explanation of the signature. It is enough to tell him who should be handed the packet.
      privacy: Lucia asks you to hold the bag while she covers the papers. Someone on the stairs wants to know what they say. You leave the outside label visible so she can give directions without opening it. The bag reaches the landing with only the intended name on show.
      horse: Pietro asks whether you know the account people will tell about a horse. You have heard the story many times. When you ask who here saw it, he points to no one. He leaves that line out of the inventory. You hear footsteps on the stairs as the bag is closed.
  sophie_germain_paris:
    name: A degree that came too late
    place: Paris
    figure: Sophie Germain
    story: Sophie Germain published her mathematical study of elastic surfaces in 1821, engaging with patterns observed on vibrating plates.
    relic: A letter signed Le Blanc
    relic_desc: A letter to Gauss in a borrowed name.
    points:
      p1: Find the indicated still lines in the figure
      p2: Keep track of how each plate is described
      p3: Tell what the figure shows and what the text explains
    vignettes:
      quiet_lines: The reader points to the darkest line and guesses that it moves the most. You ask what was still when the pattern appeared. They look back to the description before drawing another arrow.
      edges: The two figures look almost alike until you check how the edges are treated in the text. The reader adds each condition beside its matching figure.
      compare: You set the two prints beside each other and make room below them for the reader's note. They can now point to the difference without covering either picture.
  bizet_paris:
    name: A programme worth keeping
    place: Paris
    figure: Georges Bizet
    story: Bizet’s Carmen opened at the Opéra-Comique on 3 March 1875. Célestine Galli-Marié created the title role.
    relic: A fan
    relic_desc: A painted paper fan from the stalls.
    points:
      p1: Identify the first-night programme among the loose sheets
      p2: Stay by the entrance until the late audience has found its way in
      p3: Persuade the attendant to keep a dated copy
    vignettes:
      future: You tell the attendant that later audiences will know this opera in cities he has never visited. He asks why he should keep an extra programme tonight. You show him where the first night and Galli-Marié’s name are printed. One copy goes into his drawer. You leave before it gets a second reader.
      label: The attendant has filed two sheets under the same title. You split them by date and mark the first night on a spare wrapper. A later reader can now ask for the right sheet. You miss the audience coming out.
      seat: You lend a programme to a late visitor and get it back at the door after the visitor has found the seat. You copy one name onto your own slip. By then the music inside has moved on.
  modigliani_paris:
    name: A label behind the portrait
    place: Paris
    figure: Amedeo Modigliani
    story: The Metropolitan Museum of Art catalogues a 1919 oil portrait of Jeanne Hébuterne by Amedeo Modigliani.
    relic: A charcoal stick
    relic_desc: A stub of charcoal black to the fingers.
    points:
      p1: Pick out one feature that distinguishes the portrait from the other painting
      p2: Ask the attendant to pair each label with the right work
      p3: Keep the labels from coming loose while the paintings are covered
    vignettes:
      line: You recognise the angle of the head before the painting has been fully uncovered. The attendant compares it with your thumbnail sketch and moves one label to the other pile. You keep the pencil line. By the time there is room to see the whole face, the canvas has been covered again.
      reverse: The labels come loose when the frames are set down. You copy one distinctive line from each portrait before the attendant covers them. Now both labels can be put back. An earlier owner’s handwriting stays unidentified.
      cloth: The cloth catches on the edge of a frame. You hold it while the attendant presses the loose label flat. You copy the name before the cloth goes down. You have the right painting in your notes, but only a glimpse of its face.
  boole_ballintemple:
    name: Wet clothes and a lecture
    place: Ballintemple, Cork
    figure: George Boole
    story: Boole's 1854 Laws of Thought represents logical operations with algebra. One of its laws says that repeating the same selection produces the same class.
    relic: A page of logic
    relic_desc: A page of equations in which letters stand for yes and no.
    points:
      p1: Follow one operation using example slips
      p2: Keep the original condition through the second selection
      p3: Explain why the result stayed the same
    vignettes:
      repeat: You ask the learner to pick the even numbers, then to pick the even numbers again from the pile they just selected. They laugh once, then write down why the second choice gave back the same pile.
      border: The learner starts to put a slip in both piles without saying which property they used. You ask for the condition first. They label each stack before trying the operation again.
      example: You turn the selection into a few slips the learner can move. When they copy the conclusion, they can still point to the condition it came from.
  wallace_ternate:
    name: An essay from Ternate
    place: Ternate
    figure: Alfred Russel Wallace
    story: Wallace's 1858 essay dated Ternate was read at the Linnean Society alongside material by Darwin on 1 July 1858. Their submissions can be read independently within the published communication.
    relic: A beetle in a pin box
    relic_desc: A collected beetle in a small tin box.
    points:
      p1: Find a dated heading on the manuscript copy
      p2: Leave the pages in order for the journey
      p3: Distinguish an observation from an inference in the essay
    vignettes:
      places: You find a place name copied as if it were part of a heading. The helper puts it back beside the date so a reader can see where the essay was signed.
      claim: The helper reads a conclusion from what they think is an observation. You ask them to show which line actually says what was seen. They fold the copy with a marker at the distinction.
      mail: You leave a short outer note and keep the manuscript pages in order inside it. The helper will be able to tell which part can travel separately.
  hooke_london:
    name: The curator of experiments
    place: London
    figure: Robert Hooke
    story: Hooke's Micrographia of 1665 illustrates the small compartments he observed in cork.
    relic: A drawing of a flea
    relic_desc: A fine engraving of a flea under glass.
    points:
      p1: Pick out a boundary on Hooke's plate
      p2: Compare a cork chamber with the honeycomb drawing
      p3: Give the reader time to finish one careful sketch
    vignettes:
      edge: The reader closes every incomplete edge. You cover half the plate and ask which outlines they can still defend. When the cover comes away, they leave several marks unfinished.
      analogy: You ask where the cork stops looking like a honeycomb. The reader puts the two pictures together and starts pointing out differences instead of naming more similarities.
      plate: The reader holds the picture too close and loses the grid. You give them room to pull it back and then ask them to point to one chamber.
  leavitt_cambridge_ma:
    name: A rule for the stars
    place: Cambridge, Massachusetts
    figure: Henrietta Leavitt
    story: The 1912 circular presents Leavitt's comparison of 25 variables in the Small Magellanic Cloud. Among these stars the brighter ones generally have longer periods.
    relic: A glass plate
    relic_desc: A photographic plate crowded with tiny stars.
    points:
      p1: Match plotted points to the table
      p2: Keep the period and brightness readings together
      p3: Explain why the comparison uses stars from the same cloud
    vignettes:
      rank: You put the table in order of period and find one row that lost its label. The reader retrieves its identifier before the plotted point is moved.
      distance: You ask whether a nearer star could merely look brighter. The reader puts a finger on the heading for the Small Magellanic Cloud. You write the reason for comparing this group beside the plot.
      period: The reader gives you the brightness first. You ask for the period as well and keep the two values together until the last dot is marked.
  bessie_coleman_jacksonville:
    name: Her name before takeoff
    place: Jacksonville
    figure: Bessie Coleman
    story: Bessie Coleman earned an international pilot’s licence in France on 15 June 1921. On 30 April 1926, she died during a practice flight at Paxon Field in Jacksonville, ahead of a May Day event.
    relic: A dated printer’s proof
    relic_desc: A fictional ground crew notice, with Coleman’s name in full.
    points:
      p1: Check the pilot’s name on the notice before it leaves the table
      p2: Ask the runner whom the notice needs to reach
      p3: Keep one corrected copy when the runner collects the others
    vignettes:
      proof: Ann is short a line and has cut the pilot’s given name. You trade out two words of puffery to free the space. At pickup, she makes the runner read the full name once before folding the proof. He can now tell someone who will fly without saying only that it is a woman.
      school: Lewis thinks the crowd wants nothing but the show time. A child near the fence asks where the pilot learned. You tell Lewis where the licence was issued and let him use the last line for a fact he can repeat. When he takes the proof, he practises saying the date as well as the place.
      ground: The field is filling and you know the next day’s notice will no longer describe the same show. Ann asks whether she should hand out the proof now. You keep one dated copy and help her send the others to the gate. Your visit ends on the ground, with the spectators still arriving.
  scott_last_camp:
    name: The tent on the ice shelf
    place: Ross Ice Shelf
    figure: Robert Falcon Scott
    story: Scott's final diary entry is dated 29 March 1912. The surviving manuscript records the party's last camp during its return from the South Pole. The reading scene is imagined after the return of the papers.
    relic: A diary
    relic_desc: A small pencilled diary, stiff with cold.
    points:
      p1: Keep going through the cold
      p2: Look after the weakest of them
      p3: Drag the sledge so the diary and records come home
    vignettes:
      distance: Back at the Agency, the fictional clerk copies a distance into a column headed as distance travelled. You show them that it was the distance still to go. They move the entry before filing the copy.
      blank: Back at the Agency, the clerk stops at the final date. You wait while they decide how to mark the blank beyond it. They write that the record ends here, then put the pencil down.
      opening: Back at the Agency, you open the practice copy and read the date before the story. The clerk puts the same date on the cover slip so the pages can be found in order again.
  mallory_everest:
    name: Last seen climbing
    place: Mount Everest
    figure: George Mallory
    story: Mallory's surviving letters from the 1924 expedition describe conditions and plans at different camps. The fate of Mallory and Irvine does not establish whether they reached the summit.
    relic: An ice axe
    relic_desc: A plain wooden ice axe with a worn head.
    points:
      p1: Keep pace on the long approach
      p2: Share the camp and the plan with them
      p3: Go as high as they do to see them off
    vignettes:
      date: A fictional messenger has two letters from different camps but one shared date on the carrying slip. You ask them to check the headings separately. Each letter leaves with its own place and date.
      question: The messenger reads an intended departure as a promise. You stop at the sentence where the letter talks about the weather. This time they repeat the plan with the condition still attached.
      wrap: You set aside the outgoing envelope while the messenger sorts the papers on their lap. They can put the camp list away without folding it into the letter.
  fanny_mendelssohn_berlin:
    name: Six songs under one name
    place: Berlin
    figure: Fanny Mendelssohn Hensel
    story: Fanny Hensel’s Six Songs, Op. 1, appeared under her own name in 1846.
    relic: A song sheet
    relic_desc: A handwritten song marked Fanny.
    points:
      p1: Match the title sheet to the six songs it belongs with
      p2: Ask the singer to check the name before passing the score around
      p3: Keep the title sheet attached when the music is put away
    vignettes:
      cover: A singer has opened the score in the middle and asks whose music this is. You fetch its loose title sheet and set it beside the score. The initials on the title sheet are enough to settle what to write on the sleeve. You miss the first song while putting the papers together.
      forward: You start to tell the singer how collectors will search for these songs in the future. She points to the loose cover and asks whether they will still have it. You ask for the cover to go out with the next copy. It goes with one reader. You cannot follow it any further.
      order: You work through the contents and lay the six songs in order. The singer can turn straight to the one she needs. You keep the sequence on your own slip. What you cannot take home is the sound from the room after you close its door.
  camille_claudel_paris:
    name: Two versions of a turn
    place: Paris
    figure: Camille Claudel
    story: Camille Claudel’s The Waltz was conceived between 1889 and 1893. The Musée Camille Claudel catalogues several variants, including a cast dated 1905, and describes how she changed the sweep of the drapery.
    relic: A bronze hand
    relic_desc: A small bronze study of a hand.
    points:
      p1: Compare the sweep of the drapery at the two figures’ feet
      p2: Convince the packer to give the two versions separate labels
      p3: Read the underside label without shifting the cast
    vignettes:
      light: You have seen a later museum display, but only now can you watch the shadow change as you walk around the skirt. The packer is about to write the same description on both cards. You draw the two curves in the margins. The crates will leave separately, and you will see neither unpacked.
      mark: The packer finds two labels with the same title. You add one detail to each, where the drapery ends, before the lids go on. You keep both notes in your own hand. The marble commission you read about never arrives.
      crate: While the packer reaches for a lid, you keep a wrapping sheet clear of the projecting skirt. You trace its curve on the spare paper from memory. When the lid comes down, you can no longer check the last inch.
  artemisia_florence:
    name: The first woman in the academy
    place: Florence
    figure: Artemisia Gentileschi
    story: Artemisia Gentileschi became the first woman admitted to Florence's Academy of the Arts of Drawing in 1616. Her Florentine years include the work now known as Self-Portrait as a Lute Player.
    relic: A pigment jar
    relic_desc: A small jar of ground lapis blue.
    points:
      p1: Notice what the hands suggest in a pose
      p2: Help someone identify the artist behind the portrait
      p3: Keep the practice sketches together with their labels
    vignettes:
      pose: The visitor turns towards the mirror and asks which pose looks more natural. You ask what each pose seems to be doing. They pick the one that lets the hand keep its own purpose.
      name: A practice sheet has the sitter's description but no place for the painter's name. You turn it over and ask the visitor to put down both before the sheets are stacked.
      mirror: You move the mirror until the visitor can see the angle without twisting. They try the pose once, then make a small change of their own before drawing.
  buchner_zurich:
    name: Two drafts on the rehearsal table
    place: Zurich
    figure: Georg Büchner
    story: Georg Büchner left Woyzeck unfinished. The Klassik Stiftung Weimar holds and digitises the manuscript fragments, which preserve different stages of the play. It makes no claim to recover Büchner’s intended final scene order.
    relic: A bundle of scenes
    relic_desc: Loose scenes in a cramped hand, in no fixed order.
    points:
      p1: Identify which exercise page belongs to which draft
      p2: Help a reader try both orders without discarding a page
      p3: Keep the interruption visible in the reading copy
    vignettes:
      order: The reader has put the two copies together and numbered the scenes in ink. You add a separate label to each source and write the proposed order on a removable slip. The next reader can undo it. You bring home that slip; you still do not have a final order.
      pause: You know future theatres will have to decide what goes next. The reader asks if your answer is the author’s. You try both beginnings aloud and mark where they leave different questions. You can take two pauses home, and no finished script.
      gap: You ask the reader to stop the moment the page stops. Neither of you supplies the missing line. On your copy you leave a space wide enough to notice at a glance. That space is what you remember when you get back.
  emily_bronte_haworth:
    name: The parsonage in winter
    place: Haworth
    figure: Emily Brontë
    story: Wuthering Heights appeared in 1847 under the name Ellis Bell. The novel frames much of its story as Nelly Dean's account to Lockwood.
    relic: A dog collar
    relic_desc: A worn leather collar from the parsonage mastiff.
    points:
      p1: Find the point where the account changes speaker
      p2: Distinguish what a narrator saw from what they heard
      p3: Help another reader return to the right page
    vignettes:
      witness: The reader thinks the person telling the story saw it all. You ask how she learned one particular detail. They trace the sentence back to the speaker who supplied it.
      voices: The reader gives the whole page one voice. You ask them to try again from the place Nelly takes over. A listener can now tell when one speaker is passing the story to another.
      mark: You leave a scrap at the point where the telling changes hands. The reader returns to it before deciding whether a later passage contradicts what they heard.
  lili_boulanger_paris:
    name: Parts spread across the table
    place: Mézy sur Seine
    figure: Lili Boulanger
    story: The Bibliothèque nationale de France catalogues Lili Boulanger’s Pie Jesu with the composition note Rome–Mézy 1918 and specifies voice, string quartet, harp and organ.
    relic: A pencil
    relic_desc: A short pencil beside blank staff paper.
    points:
      p1: Identify the singing line in the score
      p2: Wait until the copyist has checked the quiet entrance
      p3: Return the marked parts to the people who will read them
    vignettes:
      entry: The copyist has marked the singer’s entry on an instrumental part. You lay that sheet next to the full score and ask him to point to the voice. He moves one mark. You take a scrap with both places on it. The rehearsal begins after your return.
      visitor: You tell the copyist that future readers will come looking for every part listed for the work. He sets the organ pages aside so they won’t be mistaken for a spare voice copy. You help him tie them separately. You never get to hear those two parts together.
      stand: You give the copyist space to lay out the voice, the quartet, the harp and the organ without overlapping them. He returns the harp sheet to its own pile. You copy the list of parts into your notebook. By the time the stands are ready, your own place is empty.
  qu_yuan_miluo:
    name: Verses by the river
    place: Miluo River
    figure: Qu Yuan
    story: The Songs of Chu transmits The Fisherman, a literary exchange between Qu Yuan and a fisherman. The later biography in the Records also preserves a version of the dialogue.
    relic: A bamboo slip of verse
    relic_desc: A slip of bamboo carrying a few lines of a long poem.
    points:
      p1: Recognize the two voices in the literary dialogue
      p2: Listen for what changes in a second telling
      p3: Keep a line of poetry with the account that preserves it
    vignettes:
      two_tales: The ferryman has heard a different ending from the one you brought. You listen as they tell it through and mark whose telling it is before comparing the lines.
      refrain: The ferryman starts humming after the question in the tale. You wait until the tune ends before asking where they first heard the words.
      wait: While the ferry waits, you ask the teller to go back to where the two people first speak. Onshore, you can still remember who asked the first question.
  sima_qian_changan:
    name: A history written after the sentence
    place: Chang'an
    figure: Sima Qian
    story: The Book of Han preserves Sima Qian's letter to Ren An, in which he discusses the aims and organization of his historical work.
    relic: A bundle of bamboo slips
    relic_desc: Slips tied with cord, each carrying a column of characters.
    points:
      p1: Identify what two accounts really disagree about
      p2: Keep the order of the dates clear
      p3: Leave a readable note where the evidence does not decide
    vignettes:
      dates: The clerk starts to merge two entries under one year. You ask them to leave the dates with their respective accounts. It becomes possible to see exactly where the mismatch begins.
      witness: The clerk wants the better story to go first. You ask how each account got to the desk. They mark the origins before deciding what order a reader should see.
      binding: You leave both slips loose while the clerk reads them once more. When the bundle is tied, a short label says that one question is still open.
  du_fu_xiang_river:
    name: A poet on a boat
    place: Xiang River
    figure: Du Fu
    story: A poem transmitted under Du Fu's name is headed as verses written in illness aboard a boat and addressed to friends in Hunan. The poem evokes river and shore scenes.
    relic: A boatman's oil lamp
    relic_desc: A small clay lamp that burned late over a few lines of verse.
    points:
      p1: Pick out a detail visible from a boat
      p2: Carry the note clear of water at the landing
      p3: Help a greeting reach someone in the next town
    vignettes:
      shore: The traveller writes that the shore looks gloomy. You ask what made them look up from the boat. They pause, then write down one thing that was actually there.
      delivery: You hear that the next boat goes only partway to the friend's town. The traveller nearly folds the note without a second name on it. You help them find someone who can take it onwards.
      damp: The traveller sets the note where spray has reached the board. You lay a dry scrap beneath it while they finish writing the greeting.
  li_qingzhao_hangzhou:
    name: The lost collection
    place: Hangzhou
    figure: Li Qingzhao
    story: Li Qingzhao's postface to the Jinshi lu recalls how she and Zhao Mingcheng gathered books and inscriptions and how much of the collection was later dispersed.
    relic: A rubbing of an old inscription
    relic_desc: Ink pressed from a stone, the kind she and her husband collected.
    points:
      p1: Distinguish a recollection from a catalogue entry
      p2: Keep the incomplete copy open at the right place
      p3: Record a missing entry without guessing its wording
    vignettes:
      trace: The reader recognises a title and reaches for the next page. You ask whether they can identify the object too. They stop and copy the place name before the missing line.
      missing: There is a gap in the list. The reader hesitates over what to add. You keep the place with a short note of what was missing, leaving room for a later reader to find it.
      book: You set the postface beside the numbered list. The reader turns from one to the other before reading aloud, and the names start to sound like things that were once held and carried.
  su_shi_huangzhou:
    name: Exile on the Eastern Slope
    place: Huangzhou
    figure: Su Shi
    story: After the Crow Terrace Poetry Trial of 1079, Su Shi was exiled to Huangzhou, where he farmed a plot on an eastern slope and took its name, Dongpo. In the seventh month of 1082 he went out on the river below the Red Cliff with guests and wrote the Former Ode on the Red Cliff; in the tenth month he walked back from the Snow Hall towards Lingao and wrote the Latter Ode. He left Huangzhou in 1084.
    relic: A straw cloak
    relic_desc: A rough rain cloak of the kind a farmer wore on the slope.
    points:
      p1: Be taken in by the neighbours on the slope, then bring a meal to the field at harvest
      p2: Before the night on the river, tell the boatman where the current runs below the cliff
      p3: On the night of the walk home, keep a lamp lit on the road from the Snow Hall to Lingao
    vignettes:
      slope: '{staff} carries water up the slope for the hired hands. At dusk a neighbour, made up for the game, leaves a bowl of cooked beans at the edge of the field and says the newcomer can have the second bowl tomorrow.'
      lamp: '{staff} sits on a stone by the road with a lamp shaded against the wind. Footsteps come down from the slope long after the third watch; {staff} turns the lamp towards the path and says nothing.'
      ferry: '{staff} helps a boatman, made up for the game, coil the rope at the landing. He says the water under the cliff is slow on a still night, and that the guests always ask for the far side.'
  cao_xueqin_beijing:
    name: A novel left at eighty chapters
    place: Western Hills, Beijing
    figure: Cao Xueqin
    story: An early annotated text of The Story of the Stone names Cao Xueqin in its opening and describes repeated revision within the novel's frame. The setting uses 1763 without treating the book's self-description as a dated biography.
    relic: A hand copied chapter
    relic_desc: A chapter copied by friends, with comments in red ink in the margin.
    points:
      p1: Identify a voice inside the framing story
      p2: Keep a comment next to the line it discusses
      p3: Restore the order of two loose pages
    vignettes:
      stone: You ask whether the stone could name its own copyist. The copyist lifts the first sheet and reads how the story introduces itself. You put the stone under story and the copying question on another slip.
      margin: Two hands have left marks beside the same passage. You ask the copyist to leave room between the commentary and the line it comments on. The next copy still shows both.
      loose: You pick up a loose page by the blank edge and read its first few characters aloud. The copyist finds the matching catch in the pile and puts the leaf back.
  tang_xianzu_linchuan:
    name: A play on love beyond death
    place: Linchuan
    figure: Tang Xianzu
    story: In The Peony Pavilion, the garden scene passes from spring scenery into Du Liniang's dream.
    relic: A printed songbook
    relic_desc: Printed arias for singers, with the tune named above each.
    points:
      p1: Recognize where the garden becomes the dream
      p2: Find the line another player uses as a cue
      p3: Make room for the next movement without interrupting the song
    vignettes:
      empty_garden: You ask the player to rehearse the garden without anything on the stage. After a few lines, a listener points to where they imagined a flower. The player keeps the line that put it there.
      cue: A cut takes away the other player's entrance signal. You catch it in rehearsal and put the cue where both can hear, without having to restore the whole cut.
      breath: You wait until the singer reaches the end of the line before moving the chair. This time nobody has to stop and explain why the dream began.
  ban_zhao_luoyang:
    name: A place left in the Han tables
    place: Luoyang
    figure: Ban Zhao
    story: The Book of the Later Han says that Ban Gu died before finishing eight tables and the astronomical treatise of the Book of Han, and that Ban Zhao was ordered to continue the work at the Eastern Pavilion library. It also names Ma Xu as a later contributor. The 92 setting and the practice sheets in this visit do not date each stage of completion.
    relic: A table of names on silk
    relic_desc: A strip of silk with a table of titles and names in neat columns.
    points:
      p1: Keep a row of names lined up with the reference sheet
      p2: Explain why one space is being left for another record
      p3: Keep the unfinished row visible when a copy is given to the next reader
    vignettes:
      column: The copyist has moved the next name up into an empty place. You lay the register alongside the table and show that it belongs one line lower. He moves it back and marks the empty place for checking. You bring back one aligned row. There is still no entry for the other place.
      later: You know later readers will see the work as a whole. The copyist cannot tell which part of his practice sheet is finished today. Together you fold a narrow slip around the one row that still needs checking. It will open first for the next reader. You leave before another register arrives.
      fold: You copy the name and its line number together, then leave an empty space above. The copyist can see that you meant to leave it. You take one copy back. Someone else will have to decide what belongs there.
  xu_xiake_lijiang:
    name: The direction of the view
    place: Lijiang
    figure: Xu Xiake
    story: Xu Xiake’s Travel Diaries describe Jietuo Lin on a slope during his 1639 stay in Lijiang, noting how the site faces the landscape.
    relic: A travel notebook
    relic_desc: Pages of dense notes on caves, rivers and rocks, written at the end of each day.
    points:
      p1: Reach the slope before the guide starts down
      p2: Separate a view from a leg of the walk on your sketch
      p3: Carry both the route and the landscape note back without mixing them
    vignettes:
      view: The guide turns the east-facing view into an arrow for where you walked. You draw the place where your feet stopped, then add a short line for what you could see from it. He keeps both marks. By the time you return downhill, the view itself is out of sight.
      trail: At Jietuo Lin the guide tells you about a distant mountain called Gugang. You recall that Xu also described learning about it from a wall picture here. On the sheet you distinguish a place drawn on the wall from a stretch you have actually walked. When you leave, the path to Gugang is still only a question in the margin.
      slope: You copy the location before copying what faces it. On one slip there is a point on the slope and an arrow that begins at the point. It is enough to reconstruct what you meant. Beyond that arrow the diary goes on without you.
  song_yingxing_fengxin:
    name: A book of how things are made
    place: Jiangxi
    figure: Song Yingxing
    story: Song Yingxing's Tiangong kaiwu was first printed in 1637. Its chapters describe crafts and production, including papermaking in Killing the Green.
    relic: A page of tool drawings
    relic_desc: A woodblock print of a loom with every part labelled.
    points:
      p1: Follow the sheet through the drawings
      p2: Catch a caption beside the wrong stage
      p3: Set aside a clean copy for the workshop reader
    vignettes:
      strainer: You ask which side of the illustrated screen the wet sheet ends up on. The reader turns the print round to mimic the worker's hands and finally points to the right surface.
      drying: The reader tells the stages out of order. You ask him to trace the wet sheet from the screen to the drying surface. He pauses and moves one caption to the next drawing.
      sheet: The reader drops a loose proof. You pick it up by the blank border and lay it beside the craft it was meant to explain. He puts a drying weight on the corner.
  wang_zhenyi_jinling:
    name: A mirror below the table
    place: Nanjing
    figure: Wang Zhenyi
    story: In her Explanation of Lunar Eclipses, Wang Zhenyi recounts moving a mirror below a round table so that the table blocked light from a suspended lamp. Raising the lamp let its light reach the mirror again.
    relic: A small round mirror
    relic_desc: The mirror that played the Moon in her model of an eclipse.
    points:
      p1: Get the helper to repeat the mirror position before you raise the lamp
      p2: Watch closely for the change from shadow to light
      p3: Mark the initial and final lamp positions on the same diagram
    vignettes:
      one_change: Your helper is about to lift the lamp and the mirror together. You ask her to leave the mirror where it is for one trial and draw the two lamp heights separately. The mirror brightens with just one change. You take that sketch back. The next chance to apply it to the sky is still ahead of you.
      shadow: You know this demonstration will survive on the page, but the helper who has just walked in only sees a dark mirror. You let her look before and after the lamp is lifted, and point out the rim of the table between the two. She can then mark the obstruction herself. The room has shown you one effect; no real eclipse comes during the visit.
      outline: You draw the table edge, the low mirror and a line from the lamp. When the light returns, you add a second line to the same sheet. You take both lines back. The sky outside has given you nothing to compare them with tonight.
  jianzhen_nara:
    name: The shelf at Tōdai-ji
    place: Nara
    figure: Jianzhen
    story: After leaving China in 753, Jianzhen reached Nara in 754. He transmitted Buddhist precepts at Tōdai-ji, and Tōshōdai-ji came later.
    relic: A practice wrapper label
    relic_desc: An invented label used by the fictional temple helpers.
    points:
      p1: Hold the reading bundle steady while the order is checked
      p2: Ask the attendant which bundle was prepared for this reading
      p3: Help the next reader learn where the passage begins
    vignettes:
      sound: Chiyo points to the right bundle from across the room. Jun still cannot tell which one she means on the crowded shelf. You ask her to read the opening aloud instead. Jun finds the matching words on the wrapper and sets the bundle down for the next reader.
      tie: Jun starts to retie a loose wrapper before checking the order. You hold the bundle as Chiyo reads the first line of each part in turn. He puts one misplaced part back. The bundle will now open in the order in which they practised it.
      temple: You know the name of the temple that will be founded in 759. Chiyo only needs to mark where to take this reading in the morning. You help her write Tōdai-ji on the wrapper. The other temple still belongs to a future you will not see on this visit.
  hua_tuo_xuchang:
    name: The book the account remembers
    place: Xuchang
    figure: Hua Tuo
    story: The later Sanguozhi says that Hua Tuo was confined at Xu and recounts a failed attempt to pass on a book from prison.
    relic: A copy of the practice register
    relic_desc: An invented register leaf that distinguishes a report from a delivery.
    points:
      p1: Ask whether the clerk saw a volume or only heard about one
      p2: Help check the register before the room closes
      p3: Preserve the distinction between the report and the item delivered
    vignettes:
      notice: Ajin heard there was a volume and has written it under items received. You ask her to touch the shelf where it would go. She moves the line to a report column, leaves the space on the shelf empty and keeps the source of the report beside it.
      shift: Achang wants to close the book before calling the next keeper. You ask him to read the entries aloud one time. When he reaches the unwitnessed delivery, they agree to leave that line waiting. The next keeper can see what has yet to be confirmed.
      later: You know a historian will tell a story about a book. Ajin wants to know if a real volume has come through this room. You show her where a confirmed delivery would be written. The page leaves her desk with that place still open.
  bi_sheng_printer:
    name: Type made of clay
    place: Hangzhou
    figure: Bi Sheng
    story: Shen Kuo's Dream Pool Essays describes Bi Sheng making individual clay types during the Qingli era, 1041–1048, and keeping unused types by rhyme.
    relic: A clay type character
    relic_desc: A small baked piece with one reversed character.
    points:
      p1: Pick out a piece with the wrong face
      p2: Return the types to their rhyme groups
      p3: Set aside enough repeated characters before composing the line
    vignettes:
      rhyme: A type is going back under the wrong rhyme. You read the word aloud, and the helper shifts the label before another handful follows it.
      surface: The helper blames the ink for a pale mark. You hold the proof at eye level and ask which letters stood even with their neighbours.
      duplicates: You count how often one word comes up in a trial line. When the tray runs short, the helper finally understands why there are several pieces for the same character.
  miyazawa_kenji_hanamaki:
    name: Stories few had read
    place: Hanamaki
    figure: Miyazawa Kenji
    story: Miyazawa revised Night on the Galactic Railroad in several drafts. In the manuscript-based text, Giovanni hears a station call before finding himself in a carriage.
    relic: A pocket notebook
    relic_desc: A small notebook of poems in pencil.
    points:
      p1: Find where the reader first hears the station
      p2: Keep the town and the carriage distinct in the notes
      p3: Read the transition so a listener can follow it
    vignettes:
      call: You read the station call from across the room. The reader looks up before you explain who is there. They leave the explanation for later and keep the call in their reading.
      window: The reader tries to point to where the route enters the sky. You ask what Giovanni can see through the window first. They put the hill and the carriage on separate scraps.
      ticket: You hold the page open while the reader rereads the shift into the carriage. They make a short note of what changes before the next station is named.
  higuchi_ichiyo_tokyo:
    name: Seven instalments on one counter
    place: Tokyo
    figure: Higuchi Ichiyo
    story: Higuchi Ichiyō’s Takekurabe appeared in seven instalments in Bungakukai in 1895 and January 1896. Bungei Kurabu published it together in April 1896.
    relic: A pocket diary
    relic_desc: A diary kept for years in careful brush writing.
    points:
      p1: Get the stallkeeper to set out the instalments together
      p2: Identify the last instalment and the April collected printing
      p3: Hold the last instalment until the reader returns
    vignettes:
      index: Someone has pencilled ‘complete’ on a single issue. You compare its ending to the April printing and find where it breaks off. The bookstall keeper lets you put a removable slip in it. You take home a list of seven instalments. You never find out who wrote the first label.
      reserve: The keeper has a reader who followed the story from issue to issue and hasn’t come back for the last one. You point out that other customers can buy the April printing now. The last instalment goes under the counter with a reservation slip. You leave before that reader returns.
      layout: You set the April issue beside the last instalment. One opens at the beginning and one assumes its reader has waited through six pieces already. You write that distinction on a scrap for the stallkeeper and keep your own copy. The original serial readers have waited longer than your entire visit.
  sei_shonagon_kyoto:
    name: A list beginning before sunrise
    place: Kyoto
    figure: Sei Shonagon
    story: The opening of The Pillow Book begins spring at dawn. The mountain edge brightens first, with slender purple clouds trailing above it. The visits and copyist below are imagined. The map year is a setting for the encounter.
    relic: A folded list
    relic_desc: A sheet of lightly written lists of things that please and things that do not.
    points:
      p1: Pick out the first change of light in the opening
      p2: Get the copyist to show where the first entry ends
      p3: Wait at the opening and record one detail of your own at dawn
    vignettes:
      compare: You recognise the opening from a future edition. The copyist has skipped the edge of the mountain while reciting it. You ask where the light first shows, and the omitted place returns to the practice copy. You save the correction on a folded list. From this doorway the mountain itself stays out of sight.
      colour: The painter’s purple you remember is too dark for that sky. The copyist lets you use an offcut. You put a thin grey line over a small patch of violet, and the two of you wait for the paper to dry. By then the colour outside has gone.
      listen: From the doorway you hear the copyist read the opening twice. At dawn you make a list of one thing, the roof tiles that turn pale before the yard does. You take the fold of paper home. You never learn what the writer would have made of your entry.
  kabir_maghar:
    name: Two names in a song
    place: Maghar
    figure: Kabir
    story: A hymn attributed to Kabir in the Guru Granth Sahib names Benares and Maghar and questions what difference the place makes to devotion. It treats Kabir’s death year as traditional and invents the singers and their practice.
    relic: A practice shuttle
    relic_desc: An invented keepsake used to mark the singers’ cue.
    points:
      p1: Notice where the two singers recall a different place name
      p2: Ask each singer to finish a version before correcting it
      p3: Keep the two town names audible in the retelling
    vignettes:
      towns: Paro comes in on Benares and Salim answers with Maghar. You ask them to take turns instead of singing over each other. The listeners hear both towns and can tell where the question comes in. Paro gives the next singer the start without taking the answer away.
      beat: Salim gets to the name of the second town before Paro has finished the first. You use the shuttle on her bench to tap one beat on the wood. This time he waits and is heard. At the end, Paro hands him the shuttle and asks him to keep time for the next voice.
      collection: You have read a later collection with both towns on the page. Paro asks whether a friend who was away would recognise her opening. You listen to her try it once without supplying the later version. The friend has not arrived when you leave.
  ibn_rushd_lucena:
    name: The step between two lines
    place: Lucena
    figure: Ibn Rushd
    story: A later account by Ibn Abī Uṣaybiʿa describes Ibn Rushd’s exile to Lucena under al-Manṣūr. The earlier Decisive Treatise distinguishes demonstrative argument from other kinds of reasoning.
    relic: A reader’s practice extract
    relic_desc: An invented extract with space added for a premise.
    points:
      p1: Ask the reader to say the missing step before copying the conclusion
      p2: Compare the two explanations in the margin
      p3: Keep the working page with the book it comments on
    vignettes:
      premise: Mariam has copied a conclusion in careful letters. Yusuf can follow it only by assuming something she has left unstated. You ask him where he stopped and leave space before the conclusion. Mariam writes her assumption in that space, where Yusuf can question it.
      together: Yusuf wants to return the book and keep a single line for his own use. You give him time to copy the step that goes with it. At the door Mariam asks for the conclusion aloud, and he can now give her the reason as well.
      language: You recognise a term that later readers will meet in another language. Mariam just wants to know whether she has copied the premise as it stands. You hold the page flat while she checks it. The question she writes beside it will go to a reader you will not meet.
  rumi_konya:
    name: The voice at the opening
    place: Konya
    figure: Rumi
    story: The opening of Rumi’s Masnavi asks the listener to hear a reed speaking of separation. Konya’s Mevlana Museum holds a six-book manuscript copied in 1278, after Rumi’s death in 1273.
    relic: A reader’s opening leaf
    relic_desc: An imagined reading sheet marking the opening of a verse.
    points:
      p1: Listen for the moment when the reed takes the speaking part
      p2: Keep a place for the second reader when the page is handed over
      p3: Give the reader a second attempt before the room closes
    vignettes:
      reed: Narin has performed both parts with the same voice. You ask where the reed first speaks as itself. She lets the next line begin after a breath. When Hasan listens with his eyes shut, he can hear the moment the reed takes over.
      hand: Hasan has to leave the reading bench, and Narin reaches for his page while he is still speaking. You hold its corner until he completes the couplet and can put his finger on the next line. She begins there when it is her turn. The passage has passed between them without a gap.
      manuscript: You have seen the later six-book manuscript. Narin asks if it will show where Hasan took a breath. You point to the line they practised and let her decide where to pause. The door closes before they read the next couplet aloud.
  ibn_al_nafis_cairo:
    name: The route in the margin
    place: Cairo
    figure: Ibn al-Nafis
    story: In his thirteenth-century anatomical commentary on Ibn Sina’s Canon, Ibn al-Nafis says blood passes from the right side of the heart to the left through the lungs and rejects a direct passage through the partition. The Cairo scene is an imagined comparison of text and practice diagrams, with 1242 used as a conventional setting.
    relic: Two practice diagrams
    relic_desc: An imagined pair kept for comparing two descriptions.
    points:
      p1: Compare the diagram with the passage the student is reading
      p2: Keep the earlier outline available while the new one is traced
      p3: Help the next reader tell the two drawn routes apart
    vignettes:
      trace: Hassan’s hand goes straight across the middle of the copy. Salma taps the line she has just read. You ask him to trace the route again while she follows the text. He redraws it via the lungs and marks the earlier line as a separate reading.
      layer: Salma is ready to rub out the older outline so that only one explanation remains. You slide a clean leaf underneath and let Hassan trace the second route there. A new reader can now lay the two together and ask what has changed.
      name: You know the later label for this part of the journey of the blood. Hassan wants to know where the commentator’s objection appears. You bracket that line instead of giving him a new title for his picture. The copy leaves the room before you hear whether his teacher accepts it.
  al_khwarizmi_baghdad:
    name: The man behind algebra
    place: Baghdad
    figure: Al-Khwarizmi
    story: Al-Khwarizmi's book on completion and balancing, written around 830, explains methods for solving equations through worked examples.
    relic: A sheet of worked equations
    relic_desc: A sheet of sums solved step by step with squares and roots.
    points:
      p1: Follow a worked calculation step by step
      p2: Explain one change with the learner's own example
      p3: Check the result against the starting problem
    vignettes:
      balance: You ask the learner to say the same change aloud on both sides. They stop before reaching the answer. The line that did not balance is now the one they can explain best.
      tiles: You put small square tiles on the table as the learner reads. When the words begin to run together, the remaining shape shows which piece is still missing.
      check: You keep the first line in sight after the learner finishes. They read their answer back into it to see if the numbers agree.
  ibn_khaldun_cairo:
    name: How long the gate was open
    place: Cairo
    figure: Ibn Khaldun
    story: In the Muqaddimah, Ibn Khaldun asks historians to test accounts against what could happen in the society they describe.
    relic: A checked practice report
    relic_desc: A fictional report with the observer’s position added.
    points:
      p1: Ask the witness how long the gate was open
      p2: Compare the copied total with what the counter actually watched
      p3: Keep the two readings together until the next traveller arrives
    vignettes:
      gate: Hamid has heard that the procession filed through a single gate in the time between two calls. You ask him to walk that interval back from what he remembers. He watched only the first line of people. On the sheet he changes a total to an estimate and writes down where he stood.
      two: Samira has the account from across the street, crammed into the margin of Hamid’s. You make room for hers on a separate leaf and ask where her view stopped. Her account still differs from his, and both have enough detail for the next reader to ask why.
      later: You know how often later readers will repeat a famous example about implausible numbers. Hamid needs a way to test this number today. You leave him with the length of the interval and the place he watched. The second traveller is still on the road when you leave.
  taqi_al_din_istanbul:
    name: Two callers at the observatory
    place: Istanbul
    figure: Taqi al-Din
    story: Taqī al-Dīn’s Istanbul observatory carried out observations before its demolition in January 1580. Archival research identifies instruments including quadrants and a mechanical clock.
    relic: A comparison slip
    relic_desc: A fictional observatory slip with an original row and its correction.
    points:
      p1: Keep the practice sighting steady while another helper notes the time
      p2: Check whether the angle and the time came from the same call
      p3: Persuade the keeper to preserve a smudged row with its correction
    vignettes:
      clock: Hasan reads the angle aloud while Leyla copies the clock. The next row inherits the last angle because she did not hear his second call. You ask them to repeat, one voice at a time. Both workers mark the correction beside the record, where the next reader can find it.
      copy: The bound notebook must go downstairs and Hasan will need the correction at the bench. You let Leyla copy the old and corrected rows onto one slip. She writes which was read first. When the notebook leaves, the bench still has the trail of the change.
      closure: You know how little time the building has left. Hasan has stopped at a line with no time beside the angle. You ask what he can still check before shutting the shutters. He circles one empty space. You leave without seeing another observation from this room.
  ahmed_baba_timbuktu:
    name: A name for the supplement
    place: Timbuktu
    figure: Ahmed Baba
    story: Manuscript research dates Ahmad Baba’s forced stay in Morocco from 1594. There he compiled biographical dictionaries, including Nayl al-ibtihāj, as supplements to Ibn Farḥūn’s earlier work. The 1594 Timbuktu branch concerns an imagined copyist sorting notes before departure. It does not place the later book on this table.
    relic: A leather bound manuscript
    relic_desc: A manuscript in a worn leather cover with a flap.
    points:
      p1: Notice two versions of one name before counting the new entries
      p2: Keep the earlier reference and proposed addition on separate slips
      p3: Leave the doubtful name where the next reader can find it
    vignettes:
      same_name: The copyist counts two forms of a name as two people. You set the older reference beside the proposed entry. They point to one life, so he joins the slips without destroying either spelling. You take back that comparison. The dictionary you know will be compiled far from this desk.
      missing: You know more than one supplement will be written after the departure. The copyist asks whether to enter a doubtful name now. You put the possible addition by itself and note which older page was checked. You leave before the other reference can be found.
      slip: You write down the heading of the old work and the name on the loose sheet separately. The copyist can tell what belongs to the earlier book and what still needs checking. You take home an index note. The proposed entry has no finished home yet.
  terence_rome:
    name: An audience that keeps leaving
    place: Rome
    figure: Terence
    story: The prologues to Terence’s Hecyra describe interruptions. They recall the draw of boxing and a tightrope performer, then a crowd rushing in when gladiators were announced. The map year locates the early productions, while the second prologue looks back on them.
    relic: A comic mask
    relic_desc: A linen mask with a raised brow, worn by an actor.
    points:
      p1: Get a few passers-by to wait through a complete exchange
      p2: Find the line that disappears when the doorway gets loud
      p3: Keep the entrance usable until the rehearsal reaches its end
    vignettes:
      warning: You tell a stagehand that people will still read how the crowd left, two thousand years after it happened. He asks whether they will know what the actors were saying when they left. You stay for the rehearsal and write down the last line you could hear. The rehearsal ends with one more listener than it began with. The public performance is still ahead of you.
      audibility: You listen from beside the entrance and miss the reply to a line you heard clearly. The stagehand moves one bench and asks you to listen again. This time you hear both halves. You take home a sketch of the bench’s two positions. The street has grown too loud for you to hear the ending from outside.
      bench: You help the stagehand set one bench back from the doorway. A latecomer sits down without making a whole row stand. You mark the clear space on a scrap of wood. You leave with the rehearsal still sounding through the doorway.
  mohenjo_daro_indus:
    name: Two sides of one impression
    place: Mohenjo-daro
    figure: Indus people
    story: Recorded finds at Mohenjo-daro include carved seals bearing Indus signs. An impression and the carved seal face reverse each other. The practice design has no claim to read the Indus script.
    relic: A practice impression
    relic_desc: A test impression made from a stamp with one asymmetric mark.
    points:
      p1: Identify which view came from an impression
      p2: Hold the practice tablet still while the helper lifts the stamp
      p3: Ask the helper about the spoken label while preserving the drawing
    vignettes:
      mirror: The helper copies the cut face and files it as the impression. You lay down a fresh practice print and find the small notch on the other side. He writes a new label on the slip. You keep both views. They tell you which way a mark faces, and give you no reading of an ancient line.
      lift: You have seen museum images of seals and impressions side by side. On the bench the helper wants to tell which he is holding before lifting it. You ask him to keep both positions marked until the stamp comes away. The comparison stays with him. You leave before he makes a third copy.
      pair: You write ‘cut face’ beneath one drawing and ‘impression’ beneath the other. The helper has no need to guess which to compare. You bring back the small practice print. The real signs remain outside what you can read.
  knossos_linear_a:
    name: Leave the uncertain stroke in the margin
    place: Knossos
    figure: Minoan scribes
    story: The INSCRIBE project records KN 1 as a clay tablet in Linear A from Knossos. Linear A remains undeciphered. The map date sets the period approximately.
    relic: A clay tablet
    relic_desc: A flat tablet with rows of signs and small marks for numbers.
    points:
      p1: Hold the practice copy steady while checking one doubtful stroke
      p2: Notice whether the light changes what appears to be a sign
      p3: Use the translation chip to compare the attendant’s spoken labels
    vignettes:
      stroke: A storeroom attendant reads a scrape as another mark in the row. You change where the light falls and draw the scraped line outside the transcription so it can be checked again. You take home the difference between the drawings. The tablet has given you no translation.
      heard: You know this script will become hard to read. The attendant calls out what one of the practice trays contains. You record his label on a different slip from the marks you see. At departure you can say who told you about the goods, and still cannot match them to a real inscription.
      margin: You copy the clear strokes, then put a dot in the margin where the uncertain one falls. The next person knows exactly where to look again. You keep a sketch of that dot and leave every guessed word at the bench.
  antikythera_rhodes:
    name: A machine with no maker's name
    place: Rhodes
    figure: An unknown maker
    story: The Antikythera shipwreck yielded fragments of a toothed mechanism with overlapping astronomical cycles and inscriptions. The maker and workshop are uncertain.
    relic: A bronze gear
    relic_desc: A small toothed wheel green with age.
    points:
      p1: Recognize the marked scale on the practice face
      p2: Distinguish two cycles traced on different rings
      p3: Help the next reader match a label to its dial
    vignettes:
      rings: The visitor points to the inner scale while reading a mark on the outer one. You let them turn the practice face without following both at once. This time they finish the reading on one ring.
      calendar: One pointer comes round sooner than the visitor expected. You ask which cycle they were counting. They draw a second row instead of squeezing two cycles under one heading.
      legend: You make a separate mark for the pointer and the place it is pointing at. The visitor reads the label again and stops calling both marks the same thing.
  sappho_lesbos:
    name: Before the next breath
    place: Mytilene
    figure: Sappho
    story: A much later papyrus preserved by the British Library carries part of a poem attributed to Sappho about her brother. The modern fragment supplies part of the theme. Its missing words and the sound of the song remain unknown.
    relic: A rehearsal scrap
    relic_desc: A prop from the imagined rehearsal, with one pause marked.
    points:
      p1: Find where the listener stopped to breathe
      p2: Give the hesitant singer a second entrance before the lamp goes out
      p3: Separate the missing words from the sounds you could follow
    vignettes:
      breath: Phile has written one long run of words and keeps losing her breath halfway through. You tap the table when she actually stops. She marks that place and tries the line again. Centuries later there will be scraps of the words. You have caught a pause that a scrap could never contain.
      repeat: Myrto mouths the entrance twice without making a sound. Phile is about to take the lamp away. You tap the opening beat from beside her and she finally joins in. For one line there are two voices at the table. The second voice is the thing she had come to find.
      blank: Someone asks what the returning brother does after the last words you remember from the future fragment. You could give them an ending on the spot. Instead you mark the place where your memory of the words runs out. When the lamp goes, the unfinished space is still there.
  aristarchus_alexandria:
    name: Three degrees on the page
    place: Alexandria
    figure: Aristarchus
    story: In On the Sizes and Distances of the Sun and Moon, Aristarchus assumes that at half Moon the apparent angle between Moon and Sun is three degrees short of a right angle. His Proposition 7 derives a bound of eighteen to twenty times for the ratio of their distances from Earth. This is a result of the historical premise.
    relic: A sundial plate
    relic_desc: A bronze plate with lines for the hours and the seasons.
    points:
      p1: Identify the observer’s angle before tracing the triangle
      p2: Keep the two rays on the same sheet until the comparison is finished
      p3: Explain which part of the result depends on the assumed angle
    vignettes:
      angle: A learner has drawn a right angle at the observer. You mark the ray towards the half Moon and the one towards the Sun, then restore the three-degree difference at that point. The diagram and its premise agree again. You take both back, knowing neither is a modern distance measurement.
      limit: You know how much the estimate will matter when the angle is almost a right angle. The learner asks why his answer changes when he nudges one ray. You draw the second version separately and keep the first. You leave before either sheet can be checked against the sky.
      page: You write the assumption beside the result before folding the page. The learner can read what the estimate begins with. Your own copy has room for the angle but no note from the next half Moon.
  hipparchus_rhodes:
    name: The four edges of a star group
    place: Rhodes
    figure: Hipparchus
    story: Multispectral images of the Codex Climaci Rescriptus have revealed erased Greek astronomical writing, including numerical limits for Corona Borealis. A 2022 study attributed the passage to Hipparchus’ catalogue; that attribution has been debated.
    relic: A bronze armillary ring
    relic_desc: A graduated ring used to measure the position of a star.
    points:
      p1: Find the marked extremity of a star group on the drawing
      p2: Keep the two axes distinct while comparing the marks
      p3: Copy the extent and the stars that establish it together
    vignettes:
      edges: The observer has chosen the brightest mark as the edge of the group. You show him the dimmer point farther along the row. He moves one boundary tick and names the point in the margin. You take that revision home. The sheet does not tell you who will write the full catalogue.
      copy: You recall that later readers will have only a few limits left to compare. The observer has written a span but left out which way he measured it. You name the axis before he calls the number a second time. Your copy now has both. The other axis is still waiting when you go.
      outline: You copy the two ends of the marked span before the observer tidies the page. The helper can redraw the limits even if the sketch moves. You bring back two ticks and a direction. The next group is still waiting to be marked.
  heron_alexandria:
    name: The second movement
    place: Alexandria
    figure: Heron
    story: In the Pneumatics, Hero of Alexandria describes doors that open when a fire is kindled and shut when it goes out. The book gives a design. The miniature doors, fault and workshop helpers in this Alexandrian rehearsal are imagined, with 62 CE used as a setting.
    relic: A marked model threshold
    relic_desc: A piece from the fictional workshop model, with a nick where the door rubbed.
    points:
      p1: Steady the miniature doorway so it can complete its motion
      p2: Get the waiting client to stay long enough to see the return
      p3: Watch the moving threshold and flag where the return stalls
    vignettes:
      threshold: Nikanor fits the miniature door to the bench and the return stops a finger’s width short. You mark the spot where it rubs. A flat lentil husk has caught under the model; he brushes it out. Once the door shuts, he asks you to leave the mark so he can find the spot again.
      audience: Berenikē has already seen the swing that opens the door and reaches for her cloak. You ask her to watch the far edge for one more count. When it returns she spots a sliver of light that Nikanor missed. He keeps the model on the bench for a second trial instead of sending it out.
      future: You could tell Nikanor how distant readers will put these pages beside pictures of machines. He is watching his doorway settle with a faint click. You listen with him. When you leave, he is calling the customer back to see the one motion she missed.
  pliny_stabiae:
    name: The wind at Stabiae
    place: Stabiae
    figure: Pliny the Elder
    story: Pliny the Younger later wrote to Tacitus about his uncle reaching Pomponianus at Stabiae during the eruption of 79 CE. The wind that carried him in prevented the loaded ships from leaving.
    relic: A wax tablet
    relic_desc: A wooden tablet with wax for notes, scratched with a stylus.
    points:
      p1: Spot the difference between a loaded boat and a departed one
      p2: Stay with the household and keep track of who is in each room
      p3: Use your equipment to fetch the porter who went back for the list
    vignettes:
      wind: Crispus has marked every loaded chest as gone. From the doorway you watch the first newcomer come in with ash on his shoulders while the loaded boats stay in sight. Crispus crosses out the word gone. He asks you to leave him room on the tablet for the next name through the door.
      lantern: Prima has time to make one trip across the room before the lamp goes out. You take her place by the doorway while she calls to the people she can still see. The wax tablet goes dark first. She repeats the last two names aloud and you answer each one back.
      letter: You remember the letter that will be sent years later. Prima is asking about the man who carried the list, whose name will never appear there. You set your account of the coming morning aside and help her finish the roll. At the end of your visit you can still hear someone coming down the corridor.
  galen_rome:
    name: Names left after the fire
    place: Rome
    figure: Galen
    story: In On Avoiding Distress, Galen describes losing books and other possessions in Rome’s fire of 192. He distinguishes his missing copies from works he believed he could no longer recover.
    relic: An inventory leaf
    relic_desc: A fictional inventory with one surviving title and an empty copy column.
    points:
      p1: Separate the titles still on the list from the volumes on the table
      p2: Help the keeper resume counting after she leaves the smoke behind
      p3: Ask around for a copy before marking a title as lost
    vignettes:
      list: Tertia calls three names from a list and counts three books. You ask her to touch the volumes that go with them. There are two. Together you leave the third title readable and put an empty mark in the copy column.
      borrow: Dion remembers lending a copy but cannot name the recipient. Tertia wants to strike the title before the list goes out. You help him recall the doorway where he handed it over. She keeps one place on the list open for a reply from that street.
      survival: You have read a work about this very loss in a copy that will resurface long after the fire. Dion asks which title he can put on tomorrow’s desk. You leave the names in the inventory and show him the two actual volumes. The missing one has not been found when you leave.
  ovid_tomis:
    name: A poem and an empty line
    place: Tomis
    figure: Ovid
    story: In Book II of Tristia, Ovid describes his offences as a poem and an error, and declines to explain the latter. The event year sets the visit during exile.
    relic: A wax writing tablet
    relic_desc: A tablet of letters in verse begun on the road to exile.
    points:
      p1: Keep the copied sheets in order until the carrier returns
      p2: Mark the passage where the writer passes over the error
      p3: Use the translation chip to check the Latin before sealing the packet
    vignettes:
      rumor: You tell the carrier that readers centuries from now will still ask what the error was. He points to an open place on the spare sheet and asks what he should put there. You add the destination on the wrapper and leave the space in the copy. The packet leaves with its uncertainty intact.
      verify: The carrier remembers a version with an extra name. You ask to see which sheet it came from. He can point to the poem and the error, and the passage ends there. You mark that line on your own wax tablet. You still have no name when the packet goes.
      wrap: 'Wind lifts the outer sheet just as the carrier reaches for the packet. You number the loose sheets and put them back in order. Your wax tablet holds one reminder: leave the unexplained line as it stands. You miss what the recipient makes of it.'
  empedocles_akragas:
    name: Where the chorus parts
    place: Akragas
    figure: Empedocles
    story: Fragments attributed to Empedocles describe four roots and a cycle of joining and separation associated with Love and Strife. Much later, Diogenes Laertius preserves conflicting stories about his death.
    relic: A scrap of verse
    relic_desc: A strip from the imagined rehearsal, marked at two turns in the verse.
    points:
      p1: Mark which lines describe joining and which describe parting
      p2: Settle which reader starts before the room is needed
      p3: Earn the readers’ trust and carry away their rehearsal cue
    vignettes:
      cue: Phaon has saved only the loudest line and both readers come in together. You mark the two places where the sense turns. At the first mark they draw their stools together; at the second they each take a step back. This time the reader facing the door can tell where she is without seeing the sheet.
      handoff: Eirenē can reach the second verse but keeps jumping straight to the last. Phaon offers to finish alone. You ask her to take the first cue and let him answer from across the room. When supper is called, she closes the rehearsal instead of leaving it halfway.
      sandal: Phaon asks which story people will remember. You almost tell him about the bronze sandal in a later account of Etna. He wants a line he can practise tomorrow. You leave the sandal out and repeat his unfinished part once with him. By the time you can look for Eirenē, the stools are stacked.
  democritus_abdera:
    name: Between the tiles
    place: Abdera
    figure: Democritus
    story: Aristotle’s Metaphysics attributes to Leucippus and Democritus an account of the full and the void, with differences of shape, order and position. He explains it in part with letters.
    relic: Two practice letter tiles
    relic_desc: Two props from the imagined lesson on order.
    points:
      p1: Swap the letter tiles without changing their shapes
      p2: Try the same arrangement on a tray with room to move
      p3: Copy both arrangements before the tiles go back in the sack
    vignettes:
      order: Eukles puts different-shaped tiles on the table and calls every change a change of shape. You switch the places of alpha and nu. He can still name each tile. The little copy of the row is different, although the tiles fit their old outlines exactly.
      gap: Doris packs the narrow tray tight to save a trip. You ask her to put one tile on the table, then slide the others through the gap she has made. She leaves the spare slot open on the second trip. The empty place is now part of the demonstration.
      atom: You start to tell Eukles what future laboratories will call an atom. He asks if that word tells him why this row of tiles reads differently. You rub out the stray note and help him draw the order the tiles were in. Doris has already taken the tray away; you cannot check the last angle again.
  hildegard_bingen:
    name: The unvoiced opening
    place: Bingen
    figure: Hildegard of Bingen
    story: Hildegard’s letter to the Mainz prelates protests a restriction on her community’s worship during a dispute over a burial. Another letter in the Mainz regesta concerns the dispute in 1179.
    relic: A chant practice page
    relic_desc: An invented page with a thread marking its opening.
    points:
      p1: Identify the first line by the marks on the practice page
      p2: Get permission to compare the worn page with a spare copy
      p3: Help the next reader find the starting place without singing it
    vignettes:
      opening: Agnes can still find the first word but no longer reads the damaged mark above it. You ask her to compare the spare page with the line she knows. She sets a thread by the right place. Now the next person can open straight to the same beginning.
      wait: Adelheid has the words by heart and is about to file the damaged sheet away. You hold it where Agnes can trace the line once more. Adelheid copies the opening onto a spare leaf, then keeps the old page beside it. The next reader will have both.
      return: You know the community will sing again, but Adelheid has a page to put away today. You help her show the starting place without giving voice to it. When the door closes, you can see the thread between the pages. You leave before there is singing in this room again.
  nezahualcoyotl_texcoco:
    name: The name beside a song
    place: Texcoco
    figure: Nezahualcoyotl
    story: Nezahualcoyotl ruled Texcoco until 1472. Later Nahuatl song collections preserve works associated with him. Their editors distinguish a name spoken within a song from a separate attribution.
    relic: A singer’s cue strip
    relic_desc: An imagined practice slip with separate places for two names.
    points:
      p1: Find whether the name comes from the verse or the singer’s note
      p2: Keep the practice sheets in order as the singers take turns
      p3: Help the next learner distinguish the remembered voice from the attribution
    vignettes:
      voice: A singer steps forward when Citlali gets to the line that begins with I. Citlali asks if the practice sheet needs the singer’s name or the name recited in the song. You help her make separate places for them. When the piece starts again, the person who steps forward knows where to come in.
      drum: Tochtli notices that the paper stays in order while the first singer holds it down, but slides as she stands. You move a spare strip aside as a marker and leave the two pages where the next singer can find them. The second entry comes without someone calling a name across the room.
      later: You have read a later Nahuatl song collection in which names sometimes occur inside the lyrics. Citlali asks which person handed her this line. You record the name of the singer she actually heard. The later collection will be made after everyone in this room is gone.
  maya_codices_mani:
    name: The fold remembered
    place: Mani
    figure: Maya scribes
    story: At Maní on 12 July 1562, an auto de fe led by Diego de Landa destroyed Maya books and sacred objects. Landa’s later account describes burning books. Maya knowledge and communities continued, and some Maya codices survive.
    relic: A blank practice fold
    relic_desc: A fictional fold offered by its keeper.
    points:
      p1: Look where the keeper indicates before the practice fold is put away
      p2: Stay to listen to a second account of the missing fold
      p3: Earn the keeper’s trust and carry only the rehearsal sheet they offer
    vignettes:
      fold: The keeper lays two blank folds on a bench and asks her neighbour which one opened first in the book he remembers. You hold the paper while they compare. He cannot place the second fold. She keeps the first and leaves the other loose for the next time they talk.
      listen: The neighbour starts to retell the part the keeper lost, but they remember the order differently. You listen while each finishes. They agree on the first fold and leave the second undecided. The keeper asks you to leave her the copy that carries both accounts.
      survive: You have seen a surviving Maya codex in a later collection. The keeper asks whether you can say which book her neighbour remembers. You can name the collection but cannot connect its pages to this room. She hands you a blank practice fold for the walk back. The book they were remembering remains with their account of it.
  rongorongo_rapa_nui:
    name: Mark the side before turning the page
    place: Rapa Nui
    figure: Rapa Nui people
    story: The Australian Museum records kōhau roŋoroŋo as a Rapa Nui practice of incising signs on wood. The surviving corpus is small and the script remains largely undeciphered by scholars. It does not reproduce a tablet’s writing or a community interpretation.
    relic: Two orientation sketches
    relic_desc: Practice sketches with the upper edge marked on each.
    points:
      p1: Give each view a distinct orientation mark
      p2: Hold the first copy while the helper turns the board
      p3: Check the spoken label against the right drawing
    vignettes:
      orientation: The helper turns the plain practice board and mistakes the second sketch for the first. You put a small arrow on the paper before comparing either sketch. The two marks can be reviewed in their proper orientation. You keep the exercise; it gives you no reading of an inscription.
      label: You know later people will ask how the surviving objects were oriented. The helper tells you which position he drew from. You keep his description apart from your drawing. When you leave, the placement is clear and nothing has been guessed about what the signs mean.
      copies: You mark the upper edge on both slips before they are put together. The helper turns them back the way you saw them. You bring home two study views. The writing that inspired the exercise stays beyond the page.
  dunhuang_library_cave:
    name: A loose slip for two kinds of scroll
    place: Mogao Caves
    figure: Dunhuang monks
    story: Mogao Cave 17 held manuscripts, printed works and paintings. One of the printed objects found there is the Diamond Sutra dated 868 in its colophon. The date marks the production of the scroll, and does not establish the reason or exact year the cave was closed.
    relic: A scroll
    relic_desc: A rolled sheet of paper with a sutra copied in a steady hand.
    points:
      p1: Give each practice bundle its own removable label
      p2: Check the dated colophon before naming a year on the label
      p3: Keep the copy of the label with the bundle during handover
    vignettes:
      date: The bundle keeper puts the date on a slip marked ‘when put away’. You ask to see where the date actually appears. The year comes from a printed scroll’s closing line. He moves that number to the line for the object. There is still no date for the closing of the room.
      types: You know that people will find both handwriting and printing in this cave. The keeper has called both practice rolls ‘copies’. You make him a pair of removable slips, one for each kind of mark. When you leave, the bundles are still waiting to be put away.
      twine: You let the keeper finish tying the bundles and copy the slips on a spare sheet. The two copies identify different rolls. In your report there is a line for what you saw and a blank for why the room was closed.
  nalanda_library:
    name: A leaf number for the next lesson
    place: Nalanda
    figure: The monks of Nalanda
    story: The archaeological site of Nalanda Mahavihara preserves residential and teaching buildings from a long history of study. Dharmasvāmin’s biography describes study at Nalanda in the thirteenth century. No exact year for the loss of a library is inferred from the visit.
    relic: A lesson slip
    relic_desc: A fictional note with the place where two readers can resume.
    points:
      p1: Find where the previous reader stopped in the practice leaves
      p2: Copy the leaf reference before passing the bundle to the next reader
      p3: Keep two nearby positions apart on the lesson slip
    vignettes:
      number: The reader remembers the previous lesson by its last word. You compare two practice leaves and find the word on both. He adds a leaf number to his slip. Someone can now open the bundle in the right place. You leave with a checkable reference, but before the next lesson starts.
      later: You know a later pilgrim will still describe studying here. The reader asks what will be needed if this bundle changes hands. You make a slip that names the position without assuming the next person heard today’s reading. The bundle is handed on, and you do not hear its next reader.
      tie: Before the leaves are tied, you note which comes just before the new lesson. You put the slip beneath the outer tie, where the next reader can see it first. You keep a copy. While you are still wondering what follows, your return begins.
  meroitic_meroe:
    name: The dots that keep two groups apart
    place: Meroe
    figure: Meroitic scribes
    story: Meroitic was written in cursive and hieroglyphic forms. Cursive inscriptions can mark divisions with vertical dots. Many sign values are known to researchers, while parts of the language remain difficult to interpret. It does not claim to read a surviving inscription.
    relic: A practice transcription
    relic_desc: Two groups of marks with a clearly drawn separator.
    points:
      p1: Locate the separation mark before copying the whole row
      p2: Keep the direction of the model marked on the copy
      p3: Check an oral explanation against the marks on the exercise
    vignettes:
      dots: The copyist joins two groups while transferring them to a narrow slip. You point to the vertical dots on the practice line and put the break back in its old position. The groups can be compared again. You take the copy; a meaning for the entire line still eludes you.
      direction: You know that later readers will sometimes recover a sign more confidently than a sentence. The copyist asks you to mark where he should start. You add an arrow beyond the right edge, away from the line itself. Its direction will be clear even after you have gone.
      margin: You copy one whole group, leave the dots visible and give the next group room. The copyist can pick up the exercise without running the items together. You bring back the separated forms. The next lesson is beyond this visit.
  tupaia_tahiti:
    name: The navigator's chart
    place: Tahiti
    figure: Tupaia
    story: Tupaia joined the Endeavour at Tahiti in 1769. The State Library of New South Wales reproduces a surviving copy of a South Sea chart based on Tupaia's geographical knowledge.
    relic: A sketch of islands
    relic_desc: A sheet of ink and wash with small island shapes and names.
    points:
      p1: Share the cramped cabin on the passage
      p2: Watch him draw the chart of the islands
      p3: Learn the island names from him (a seafarer or a kind employee)
    vignettes:
      pronounce: A fictional copyist thinks two spellings belong to different islands. You ask them to read both aloud before drawing another island. They put a question alongside the names until someone who knows can check.
      route: The copyist draws a straight line between two marks. You ask which island the explanation started from. They lift the pen and leave the bearings with the account that gave them.
      room: You hold the folded corner of the sheet while the copyist writes another name. They move their hand so the next name can be written without covering the first.
  heo_nanseolheon_hanyang:
    name: A sleeve of separate poems
    place: Hanyang
    figure: Heo Nanseolheon
    story: Heo Gyun compiled surviving work by his sister Heo Nanseolheon after her death. A Joseon woodblock edition of her collected works survives from 1608.
    relic: A sheet of poems
    relic_desc: A sheet of fine paper with brushed poems on flowers and distant places.
    points:
      p1: Read the names and titles on two loose poetry sheets
      p2: Keep the working copies separate from the originals
      p3: Copy the heading together with the poem
    vignettes:
      binding: The copyist has mixed a practice page in with the other sheets. You compare the two headings and fold a second sleeve for the exercises. One ambiguous page stays loose for him to check. You leave before any of the poems reaches a printed book.
      name: You know some of these poems will be read far from this house. The copyist is about to pass on a practice sheet with no heading. You ask him to copy the heading as well, and one more sheet leaves with a name. You keep your place with a blank strip of paper. The woodblock edition lies years ahead.
      fold: You help wrap the loose pages without creasing the brushwork. On the spare wrapper you mark that a title is missing. What you take away is the warning, not the page. The later collection will be put together after you are gone.
  ghalib_delhi:
    name: Look up the refrain
    place: Delhi
    figure: Mirza Ghalib
    story: By the time of this Delhi visit, Ghalib’s Urdu divan had already been printed in 1841. Its ghazals can be browsed by their rhyme and refrain endings.
    relic: A page of ghazals
    relic_desc: A page of Urdu verse in his own hand, with corrections.
    points:
      p1: Ask a bookseller to check a remembered ending against the printed divan
      p2: Write down a refrain and a page reference together
      p3: Wait for the reader to repeat the ending before filing the slip
    vignettes:
      refrain: The bookseller remembers the image in the verse and keeps looking for it in the wrong place. You ask for the words he heard repeated. He gives you the ending, and you find the right group in the printed book. You write one page reference. Who first brought the verse into the shop is still a mystery to him.
      future: You tell the bookseller that later readers will compare several editions. He asks if that will help him find the line he needs today. You add the edition year to his slip, then mark the ending. You leave before he can check it against another copy.
      listen: You repeat the ending to the bookseller until the two of you agree on what you heard. He tucks the slip into the right part of his book. You can bring those few words back. The rest of the verse has already slipped away from you.
  savitribai_phule_pune:
    name: Leave room for another name
    place: Pune
    figure: Savitribai Phule
    story: Early newspaper accounts reproduced in an NCERT historical lecture trace Jotirao and Savitribai Phule’s educational work in Pune to 1848. A report on the later school network names Savitribai as a head teacher.
    relic: A slate
    relic_desc: A small slate with a first row of letters in chalk.
    points:
      p1: Make the trip back for a slate before class ends
      p2: Ask the pupil who finished first to leave space for the next hand
      p3: Show each pupil how to make room for the other’s letters
    vignettes:
      slate: Gauri can write the first stroke but stops as soon as Janki reaches for the slate. You turn it sideways and Janki takes one end. By the time they are called home, each has made a mark that the other can point to. They agree which end each will use when the slate comes back.
      home: Janki has to take the slate home in a bag with her other things. Gauri will come on a different day and worries she will find it wiped. You show Janki how to tuck the cloth over the smaller practice mark. The board she carries has one half cleared and one half left for Gauri to read.
      register: You have seen the later report with neatly ruled totals. Gauri wants to know whether the name she has just written can stay up until her family sees it. You point out its place on the slate to Janki. The bell sounds before you can see who comes to read it.
  zhu_shijie_yangzhou:
    name: The four sides of the counting board
    place: Yangzhou
    figure: Zhu Shijie
    story: 'In the preface to Zhu Shijie’s Jade Mirror of the Four Unknowns, Mo Ruo describes the arrangement of the four unknowns around the centre: heaven below, earth left, human right and thing above. The preface is dated 1303.'
    relic: A set of counting rods
    relic_desc: Slender rods laid in rows to stand for numbers.
    points:
      p1: Read the four positions before adding a new row
      p2: Show another learner which two groups were swapped
      p3: Keep the orientation marks on the copy until the board is cleared
    vignettes:
      rotate: Two learners have copied the same board from opposite sides. You mark the bottom before comparing their sheets. The earth and human groups exchange places on one copy. You keep the corrected diagram. The long elimination is still ahead of them.
      hand: You ask why the learner has put all four names in one line. He says he can remember the names that way. You keep his line but place four markers around a centre so he can also recover the layout. By the time he clears the board, you have seen how to begin, and not how his exercise ends.
      outline: Before the counters go back into their box, you draw four short lines around the centre and note which end is the bottom. You can reproduce the arrangement when you get home. You leave the larger calculation on the learner’s board.
  xuanzang_changan:
    name: Six hundred texts from the west
    place: Chang'an
    figure: Xuanzang
    story: Xuanzang's early biography places his return to the capital in 645 and lists 657 works carried in 520 bundles.
    relic: A palm leaf from a sutra
    relic_desc: A palm leaf written in Sanskrit, its edges gone dark.
    points:
      p1: Check two inventory numbers against their units
      p2: Keep the piles in order through the handoff
      p3: Help the clerk get room and paper to finish the list
    vignettes:
      totals: The clerk has carried the bundle total into the column for works. You point to the unit before they seal the new copy. The discrepancy disappears without a single bundle changing hands.
      names: Two slips carry titles that look alike to you. The clerk reads them back and has you copy the distinguishing characters before the bundles are carried away.
      space: You clear room for the clerk to lay out one bundle at a time. The person carrying the last stack can set it down without covering the checklist.
  jia_sixie_gaoyang:
    name: A note for the high field and the low one
    place: Gaoyang, Shandong
    figure: Jia Sixie
    story: In the first volume of Qimin Yaoshu, Jia Sixie discusses ploughing on high and low ground and stresses working at suitable soil moisture. The visit year is an approximate setting for the compilation.
    relic: A farming book scroll
    relic_desc: A hand copied scroll of farming methods, with notes in the margin made out in the fields.
    points:
      p1: Read the ground separately in the two fields
      p2: Walk out to the lower field before the plough is moved
      p3: Get the farm hand to record a second observation beside the first
    vignettes:
      moisture: The farm hand has made one mark on the board for both plots. You walk the bank and hold up two different clods, one sticking to your fingers, one falling apart. He records one observation per plot. You carry that pair back. The crop will ripen after you have left.
      timing: You know later readers will copy out the rule about moisture. The farm hand asks which patch you mean when you say the ground is ready. You draw a line down the middle of his board and point to the higher plot first. Only one row is filled when you leave.
      bank: You carry the board to the edge of the lower field. The farm hand writes the name of the plot before adding what he sees. You copy the location beside his mark. When the plough finally reaches the other field you are already gone.
  qin_jiushao_huzhou:
    name: The answer must pass both rows
    place: Huzhou
    figure: Qin Jiushao
    story: The first volume of Qin Jiushao’s Mathematical Treatise in Nine Sections sets out the Great Expansion procedures for problems involving remainders. The event year is the traditional date associated with the book.
    relic: A counting rod
    relic_desc: A bamboo counting rod worn smooth.
    points:
      p1: Check the same pile against both remainder rules
      p2: Preserve the divisors beside their own remainders
      p3: Explain why a candidate that fails one row must be rejected
    vignettes:
      witness: The learner puts five counters down. Groups of three leave two, just as requested, but groups of five leave none. You ask him to test eight. That leaves two in the first row and three in the second. He crosses out one answer. You leave before they start a problem with a third row.
      rows: You know the procedure will be studied long after the learner forgets this exercise. He asks why two remainders cannot be written in one box. You have him label the one for groups of three and the one for groups of five. He can now test the next answer on his own. That next answer is still out of reach when you go.
      counters: You make eight counters into groups of three and then into groups of five. Each time you record only the left-over counters before rebuilding the pile. You bring home two checked rows. The larger problem stays on the table.
  al_biruni_ghazna:
    name: Two lines above the plain
    place: Ghazna
    figure: Al-Biruni
    story: In his Determination of Coordinates, al-Biruni reports using a mountain near Nandana to estimate the size of Earth. The height of the mountain and the dip of the visible horizon below the horizontal are separate measurements.
    relic: An astrolabe
    relic_desc: A brass astrolabe with its scale polished by fingers.
    points:
      p1: Identify the horizon line and the horizontal line on the sketch
      p2: Reach the observation spot with a complete height record
      p3: Explain why the slope of the mountain is a separate quantity
    vignettes:
      angle: The survey helper has drawn his angle along the slope of the mountain. You extend a horizontal line from the point where he stands, then draw the lower sightline towards the horizon. The mark moves to a different wedge. You carry home the corrected diagram, but the final figure is still being worked on.
      height: You know the book will keep both a height and an angle. At the top the survey helper calls out only the angle. You bring up the slip for the height and have him add it to the other reading. When the plain disappears into haze, the two records are already side by side. You will not see the next clear horizon.
      fold: You fold one slip around the other and mark which came from the mountain and which from looking across the plain. The survey helper can find them again without guessing. You take home the names of two measurements, and no finished radius.
  al_razi_rayy:
    name: A heading for a doubt
    place: Rayy
    figure: Al-Razi
    story: In Doubts about Galen, al-Razi puts claims in Galen’s writings alongside his own observations and marks occasions on which he withheld judgment. Neither the exchange nor the notes are from the treatise.
    relic: A margin note under two headings
    relic_desc: An invented reading note with a source and a separate question.
    points:
      p1: Check whether the margin describes an observation or a conclusion
      p2: Give the reader time to say what she still doubts
      p3: Keep the observation with its source as the notes are handed over
    vignettes:
      columns: Layla has copied two lines under Galen’s name. The first is a claim she can find in the book. The second is what a reader said after putting it down. You ask her to leave the name with the first line and give the other its own heading. A new reader can now see where a question began.
      doubt: Farhad wants to finish the page with a verdict. Layla is still trying to recall what the observer actually said. You slow the reading and give her the last line. She writes what she can remember, then follows it with a question that can be carried to the next reader.
      edition: You have seen a later copy of the book that records these kinds of doubts. Farhad only has this leaf and asks what to call the open line. You help him mark it as awaiting a comparison. The lamp is removed before the next copy arrives.
  sushruta_varanasi:
    name: The cloth before the lesson
    place: Varanasi
    figure: Sushruta
    story: The Suśruta Saṃhitā describes learners practising on models, including cloth. The text has a long transmission history.
    relic: A marked practice cloth
    relic_desc: A fictional piece kept to compare two attempts.
    points:
      p1: Find which piece of cloth was kept to show the earlier attempt
      p2: Hold the practice pieces in place while the apprentice compares them
      p3: Help the next learner look over both attempts
    vignettes:
      cloth: Mira is about to put the rougher piece in the scrap pile. You show her where Ananda marked his first try. She compares the marks with the piece he made later and leaves both on the bench. Ananda can now point to the one difference he worked on.
      turn: Ananda keeps explaining his own cloth while Mira waits to touch it. You put both pieces on the table where she can reach them and ask him to let her point first. Her question is about a part he had skipped. They keep the piece at the bench for the next learner.
      text: You know later readers will find a chapter about practice models. Mira only has a piece of cloth and a small mark she cannot place. You listen while she finds the earlier piece for herself. By the time the next lesson starts, you have already left.
  zhuge_liang_longzhong:
    name: Three visits to the thatched cottage
    place: Longzhong area
    figure: Zhuge Liang
    story: Chen Shou's biography says Zhuge Liang worked his own fields and liked to sing the Song of Liangfu. Xu Shu told Liu Bei that this was a man one goes to see and cannot summon. Liu Bei went three times before he met him, and when they met he sent the others out of the room before he spoke. A different account, quoted in Pei Songzhi's notes, has Zhuge Liang seek Liu Bei out first. The trip uses the first account and the conventional year 207 for its setting.
    relic: A sheet with a tune noted on it
    relic_desc: A keepsake made up for the game, the tune of a slow song noted down at the edge of a field, with half the words missing.
    points:
      p1: Find a place in Longzhong and work in the fields until the third visit
      p2: Hear the song across the field and note the tune
      p3: When the guest asks the others to leave, go out and wait until the door opens again
    vignettes:
      future_novel: You ask the neighbour who works the next field, a man made up for the game, whether the one in the cottage will some day borrow arrows under cover of a river fog. He straightens his back. “He has not so much as a boat. Where did you hear that?” In your report you mark the arrows as an episode from a much later novel.
      door: The guest comes a third time, and once inside he asks the others to leave. You and the neighbour go out beyond the fence. You do not hear a word of what is said behind the door. The books have it, later.
      song: Someone is singing at the far end of the field, a slow tune. The neighbour says the man often sings that one, the Song of Liangfu. You note the tune down and do not get all the words.
  borobudur_java:
    name: From squares to circles
    place: Java
    figure: The builders of Borobudur
    story: Borobudur in central Java was built in the eighth and ninth centuries. UNESCO’s listing describes its square terraces below and three circular platforms above. The year marks the building period approximately.
    relic: A pair of terrace outlines
    relic_desc: Two work sketches of the change from a square terrace to a circular platform.
    points:
      p1: Hold the practice sheets together at their shared stair
      p2: Carry the plan to the change from square to circular platforms
      p3: Catch an extra corner in the circular part of the sketch
    vignettes:
      corner: The drawing helper has repeated the shape of the lower sheet on the upper one. You trace the turn on the square plan, then follow the curved edge on the other. He removes one false corner. You take both outlines back. The highest point is still beyond the part of the route you covered.
      stair: You have seen a later plan of the tiers from above. The helper on the ground sees only the next stair. You keep the stair marked on both pieces of paper so he can tell where the shape changes after the climb. You leave before he makes the upper circuit.
      layers: You mark a square edge below the stair and a curved edge above it. The helper asks you to keep the marks on separate sheets while he checks the plan. You take the two outlines home. The whole monument will not fit on either sheet alone.
  qin_liangyu_shizhu:
    name: Qin Liangyu and the supply ledger
    place: Shizhu
    figure: Qin Liangyu
    story: The History of Ming records that in 1630 Qin Liangyu and Qin Yiming answered the summons to aid the capital, and that she used family funds for supplies. The Shizhu gazetteer also records the summons and expedition.
    relic: Copy of a Shizhu receipt
    relic_desc: A fictional receipt with one name in the margin and another beside a bundle.
    points:
      p1: Spot two similar names on the clerk's sheet
      p2: Help the carrier check which bundle is hers to collect
      p3: Leave two copies that agree before the table is cleared
    vignettes:
      ledger: Two lines begin with nearly the same name. The clerk has read them as one. You underline the characters that differ, and he calls both bearers back to check.
      hands: The waiting carrier has both hands on a bundle and cannot open her slip. You hold it flat and read the name back to her before she lifts it again.
      copy: The clerk reads the entries aloud while you follow the copy. At the last line you turn the two sheets side by side and leave them on the table.
  zeami_sado:
    name: The island on the page
    place: Sado Island
    figure: Zeami
    story: Sado City records that Zeami was exiled to Sado in 1434. In Kintōsho, written during his time on the island, he calls Sado an island of gold. The mask associated with him in local tradition is not identified as an object he wore in this scene.
    relic: A Noh mask
    relic_desc: A small wooden mask with a fine line of lacquer between the brows.
    points:
      p1: Hear where the reader pauses on the island’s name
      p2: Demonstrate two readings of the same line
      p3: Keep one reading slip dry until the lesson ends
    vignettes:
      later: You tell the reader that people will still use the name in books about Sado. He tries the words as a place name, then as something a person longs for. You mark both pauses on a slip. The boat that brought Zeami to Sado has already gone.
      mask: The reader holds up a practice mask and loses his place when he lowers it. You mark the start of the line on a loose slip and prop it where he can find it again. The mask goes back on its peg. You miss the reading after yours.
      wind: A draught scatters the reading slips. You help the reader recover one from under the bench and hold it down with a pebble. He reads that line once more. When you leave, the paper stays under the stone and you carry the pause away in your notes.
  ino_tadataka_ezo:
    name: The bend left out of the line
    place: Hokkaido
    figure: Ino Tadataka
    story: The Inō Tadataka Museum dates Inō’s first survey, through northeastern Honshū and southern Hokkaidō, to 1800. His team recorded distances and directions. The finished national maps were presented in 1821, after his death.
    relic: A measuring staff
    relic_desc: A thin staff for measuring paces, marked with a scale.
    points:
      p1: Carry the distance notes as far as the next turning point
      p2: Check the change of bearing before joining two stretches
      p3: Keep the segments in order until they are transferred to the sketch
    vignettes:
      bend: The survey helper has added the lengths of three stretches and drawn a single line. You copy each bearing beside its length. Once the turns are restored, the last mark sits off to the side. You take two sketches home. The national map is still years away.
      repeat: You go back to the turn where the note was taken and ask the helper to face the next stretch again. He had read from the direction of return. You mark an arrow at the bend and correct his direction. You are not there for the next survey season.
      sketch: You put the length and direction of each stretch on the same line. The helper can redraw the walk when the coast is no longer in sight. You carry the little bend home. The finished map will need many more such sheets.
  djenne_builders:
    name: A patch at the edge of the yard
    place: Djenne
    figure: The mud brick builders of Djenne
    story: Djenné is known for earthen architecture. The Great Mosque visible today was rebuilt in 1907. It does not stage the rebuilding or a present-day ceremony.
    relic: A mud brick
    relic_desc: A hard sun dried brick with bits of rice husk showing where it is broken.
    points:
      p1: Keep the practice board instead of letting it slip into the fresh coat
      p2: Carry a second small batch to the other face of the trial wall
      p3: Agree with the helper on which patch will be checked again
    vignettes:
      mark: The yard helper has tried two small patches and forgotten which came from each bowl. You set out two scraps with names rather than mark the wall. Each test now has a record. You leave before the sun reaches the other face.
      time: You know the building visitors will see centuries later has its own history of rebuilding. Today the helper wants to spread one bowl across the test wall. You ask for a small patch first and give him a spot to check after it dries. You leave knowing where he will look, and not what he will find.
      shade: You draw the trial patch and the line between sunlight and shadow. The helper takes the sketch to the bench so he can check the same place later. Your copy has one patch on it. The whole wall is still to do.
  ahmes_thebes:
    name: The round field on the papyrus
    place: Thebes
    figure: Ahmes
    story: Problem 50 of the Rhind Mathematical Papyrus asks for the area of a round field of diameter nine. Its rule removes one ninth of the diameter and squares the remainder, giving 64. The scribe Ahmose copied the surviving roll from earlier material.
    relic: A scrap of papyrus
    relic_desc: A small scrap of papyrus written in red and black.
    points:
      p1: Work out the length that remains before squaring
      p2: Keep the rule and its worked example together
      p3: Show the assistant why the square is drawn with a side of eight
    vignettes:
      table: The assistant has written 81 in the answer box, having squared the whole diameter. You put the removed ninth beside his nine, then square the remaining eight. He corrects one entry to 64. You take home both lines. No one has measured a real field during your visit.
      outline: You know later readers will compare the rule with a modern formula. The assistant asks where the number eight comes from. You sketch the diameter and cross off one of nine equal marks. The drawing stays with his exercise. You leave before he tries the rule on a different field.
      roll: You copy the diameter, the missing ninth and the remaining length before the roll is closed. The assistant can square the right number after you leave. You carry the three numbers away, without learning how much seed the field would need.
  quipu_cusco:
    name: The cord you count twice
    place: Cusco
    figure: The keepers of the knotted cords
    story: The study Khipu Archives identifies sets of Inka knotted-cord records with matching numerical data and discusses duplicate accounting. Many numerical khipu use decimal place value. It does not assign meanings to undeciphered signs.
    relic: A bundle of knotted cords
    relic_desc: A bundle of cords of different lengths, tied with knots of different sizes.
    points:
      p1: Tell the places apart before reading the practice value
      p2: Read the matching bundle separately before comparing the two
      p3: Have the keeper preserve the mismatch until it can be checked
    vignettes:
      places: The keeper reads the same total from two cords at a glance. You separate tens from units on the practice slips and find 23 on one and 32 on the other. He tags the pair for another count. You take the comparison home. It will not tell you which total is right.
      copies: You know that later researchers will compare matching cords. The keeper is about to set one of these aside without its partner. You put the two readings in separate rows and mark the place where their readings part company. Both cords stay together. The next keeper’s answer is still to come.
      tag: You follow the keeper in counting one practice cord from its free end. Before the two are tied away you mark which number belongs to which cord. That is all you take back. The kind of goods the exercise stands for remains unlabelled.
  humboldt_chimborazo:
    name: Reading a whole mountain from the snow line
    place: Mount Chimborazo, Ecuador
    figure: Alexander von Humboldt
    story: Humboldt's travel diary describes the 23 June 1802 attempted ascent of Chimborazo. Aimé Bonpland and Carlos Montúfar were with him, and they did not reach the summit.
    relic: A barometer
    relic_desc: A mercury barometer with heights marked on the glass.
    points:
      p1: Keep walking on the snow line
      p2: Read the barometer and the boiling point
      p3: Finish the last stretch
    vignettes:
      turn: A fictional reader has drawn the summit at the end of the route. You ask where the diary stops describing the ascent. They move their last mark down the slope and leave the top untouched.
      units: The reader wants to copy a height without its unit. You keep it attached to the original measurement and leave space for a separate modern conversion.
      names: You ask the reader to leave space beside Humboldt for the other travellers' names. When the note is folded, the list still follows the account of the day's attempt.
  banneker_maryland:
    name: Two things in the packet
    place: Maryland
    figure: Benjamin Banneker
    story: On 19 August 1791, Benjamin Banneker wrote to Thomas Jefferson, sent a manuscript of his almanac for the following year, and challenged racial prejudice and slavery. The packing table and its two helpers are imagined. Players can protect the connection between the letter and the work it accompanies.
    relic: A duplicate wrapper label
    relic_desc: A fictional copy naming the almanac and its accompanying letter.
    points:
      p1: Check the addressed copy against the workshop copy
      p2: Persuade the carrier to keep the letter with the manuscript
      p3: Wait for the handoff and check that both parts go with it
    vignettes:
      packet: Rachel sees the months on the first page and begins a label for a book of calculations. You set the letter beside it and ask her to finish the label after reading the address. She threads one tie through both wrappers. The tables will travel under the sender’s name and with his argument still attached.
      handoff: Isaac has room in the satchel for one flat packet. The wax on the letter is still soft. You hold the wrapper open while he slips in a folded guard to keep the letter from sticking to the tables. He leaves with both. You stay long enough to watch the empty square the packet left on the table.
      reply: You know a reply will come swiftly. Isaac asks whether that settles what the letter has raised. You copy the date on the outgoing packet and leave the space for a reply as you found it. The packet is on its way. No promise has come back through the door.
  seacole_balaklava:
    name: The inn she found her own way to
    place: Balaklava
    figure: Mary Seacole
    story: Mary Seacole's 1857 memoir describes the British Hotel she ran with Thomas Day near Balaklava, the goods it sold and the people who came there in 1855.
    relic: A medicine chest
    relic_desc: An old wooden chest with compartments for herbs and gauze.
    points:
      p1: Tend the dysentery and cholera patients
      p2: Ask the quartermaster for a chest of medicine
      p3: Get through a whole summer
    vignettes:
      meal: A fictional customer has been standing so long that they cannot explain what they came for. You find a seat first. By the time the attendant returns, the customer can ask for supper in their own words.
      counter: Two customers repeat the same order, each thinking the other has not been heard. You ask the attendant to read back what they wrote. One tray turns out to be enough.
      shelf: The attendant calls for room at the end of the counter. You move two empty plates and put a stool where a waiting guest can sit without holding up the next customer.
  mitchell_nantucket:
    name: Mark the field before the cloud
    place: Nantucket
    figure: Maria Mitchell
    story: 'A letter reproduced in Maria Mitchell: Life, Letters, and Journals reports that Mitchell discovered a telescopic comet at Nantucket on 1 October 1847. Her father noted the discovery and wrote to the Harvard observatory’s director by the first mail to the mainland.'
    relic: A small telescope
    relic_desc: A small brass telescope with a trace of sea salt on the tube.
    points:
      p1: Mark two ordinary stars before circling the faint object
      p2: Keep the first field sketch until a second view is possible
      p3: Help prepare a dated account for the next reader
    vignettes:
      field: The helper has drawn the faint spot by itself. You ask what he would use to point the instrument back to it. He adds two stars and a direction before the cloud comes over. You copy those marks. You still do not have a later position to compare.
      post: You know word will have to travel off the island. The helper wants to record a discovery before he has described what was seen. You put the date and the field on a separate slip and leave the next line for verification. It remains blank when the packet goes down to the shore.
      cloud: You wait with the drawing in hand while cloud covers the faint mark. Before folding it you circle a star you expect to find even if the faint object is gone. You bring back a position that can be sought again. No one sees it a second time before your return.
  caroline_herschel_slough:
    name: The one who swept the sky
    place: Slough
    figure: Caroline Herschel
    story: Caroline Herschel reported noticing an object unlike the sharply defined stars on 1 August 1786. She compared observations before writing to Charles Blagden.
    relic: A sky sweep ruler
    relic_desc: A wooden ruler with a scale, used to mark the swept patches on a star chart.
    points:
      p1: Mark the comparison stars
      p2: Keep the two times beside their own diagrams
      p3: Help preserve the next observation in the dark
    vignettes:
      fixed: You mark two bright neighbours before adding the fuzzy object. On the second drawing the stars remain a useful guide, even after the pages have shifted.
      doubt: The helper suggests cleaning the glass. You ask what the other stars look like through it. They stay sharp, and the helper keeps the uncertain mark on the sheet.
      lamp: You shade the lamp while the helper writes the hour. When the cover goes back on, both drawings still have times beside them.
  kovalevskaya_stockholm:
    name: The conditions on the first page
    place: Stockholm
    figure: Sofia Kovalevskaya
    story: Kovalevskaya’s paper on rotation about a fixed point appeared in Acta Mathematica in 1889. The work identifies an integrable case with particular conditions on the moments of inertia and the position of the centre of mass.
    relic: A top model
    relic_desc: A brass spinning top with a number cut into its axis.
    points:
      p1: Locate where the body’s symmetry enters the argument
      p2: Get the proofreader to retain both qualifying conditions
      p3: Keep the assumptions with the clean copy until it is finished
    vignettes:
      conditions: The shorthand on a practice sheet says ‘a rotating body’. You use the first page to restore two qualifications, one for inertia and one for where the centre of mass sits. The proofreader copies both onto his slip. You can take the correction away, but the journal issue is still in the future.
      diagram: The proofreader wants to try a toy top. You sketch a point that stays fixed and mark the separate point that represents the centre of mass. He can point out which is which on the next copy. The toy still spins when your time is up, and it has not proved the paper.
      clip: You put the assumptions on the outside of the exercise and fold its loose diagram into it. The next reader will see the conditions before the result. You bring home the outline of a top and leave the proof on the desk.
  chaco_sun_watchers:
    name: A second mark on a portable board
    place: Chaco Canyon, New Mexico
    figure: The people of Chaco Canyon
    story: Published measurements at Fajada Butte in Chaco Canyon record sunlight falling across spiral rock markings near midday at particular times of year. The lesson does not date the real markings or assign an original purpose to them.
    relic: A sketch of two shadow edges
    relic_desc: A sketch of two traces made from the same board position.
    points:
      p1: Notice the change at the edge of the shadow
      p2: Keep the board in the same place for a second mark
      p3: Stay at the mark while the helper walks back to check it
    vignettes:
      two: The helper has turned the board to face you, and now the two lines seem to disagree. You set its foot back at the first mark and ask for a new trace. You can compare the two positions this time. Next season is outside the length of your visit.
      sky: You know researchers will later study how light falls on the rock. The helper wants to give a name to the shadow on this small board. You ask him first to draw the place where the board stood. You leave with a drawing of the setup, and miss the second clear observation.
      wait: You put down a loose pebble beside the board, then wait for a second outline before lifting it. Two marks on the paper now share one position. You bring those marks home. You did not stay long enough to say how they change across the year.
  rapa_nui_moai:
    name: Two views of the same quarry face
    place: Rapa Nui, Rano Raraku
    figure: The Rapa Nui carvers
    story: The Rapa Nui community organisation Ma’u Henua identifies the volcanic quarry at Rano Raraku as the source of most mōai, sculpted directly from volcanic tuff. The story leaves the transport of the actual mōai outside this exercise.
    relic: A stone adze
    relic_desc: A hand sized blade of dark basalt, ground to a clean edge.
    points:
      p1: Keep the top mark in the same position on the front and side studies
      p2: Walk to the other side of the practice block before the helper goes
      p3: Distinguish a ridge in the rock from the edge drawn on the sheet
    vignettes:
      pair: The quarry helper has drawn an edge as though it were visible from both sides of the practice block. You label the two sketches before comparing them. A mark that looks like an outer edge from the front lies inside the outline from the side. You keep the two views. You never see a statue leave the quarry.
      surface: You know later photographs will make the quarry look flat on a page. The helper asks which side you saw. You walk back to your first spot and add one arrow to the drawing. He can check your ridge from there. What happened farther down the route remains beyond the sketch.
      height: You draw the top once from the front and once from the side. The helper aligns his slips at the same point. You bring home the change of outline. There is nothing in those lines about how any of the stone figures moved.
  hargrave_stanwell_park:
    name: The fourth kite
    place: Stanwell Park, Australia
    figure: Lawrence Hargrave
    story: On 12 November 1894 at Stanwell Park beach, Lawrence Hargrave rose from the ground in an experiment with four linked box kites. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and equipment from the test.
    relic: A spare box-kite tag
    relic_desc: A spare label from the fictional tally table.
    points:
      p1: Count the kites laid out before the lift
      p2: Keep the frame labels readable while they are carried off the sand
      p3: Wait until the seat leaves the beach before marking the trial
    vignettes:
      four: Ada has crossed one kite off because she saw its frame carried down in two pieces. You go back with her and count the assembled kites once. All four go onto the page. She draws a small bracket around them so the next reader knows they belong to the same lift.
      tag: Ned finds a tag torn loose as he carries the frames off the beach. You follow back along the wet sand while he keeps the other three frames apart. There is just enough of the mark left to match the loose tag. When he shuts the store, he can still tell the last frame from the first.
      lift: The number you remember from a future display almost goes into the height column. Ada has seen the seat stir but is waiting to see daylight between it and the sand. You watch for that first gap with her. The visit ends before you can check what height was entered into the ledger.
  sun_yat_sen_guangzhou:
    name: From the statue to a new university
    place: Guangzhou
    figure: Sun Yat-sen
    story: Standing before the statue of Sun Yat-sen at Sun Yat-sen University, you are carried back to Guangzhou on 4 February 1924, the day he orders three schools joined into National Guangdong University and names Zou Lu to prepare it. In the same months he lectures on Sundays in the hall of the Higher Normal School, and the notes of the lectures go back and forth until they are a book. Classes begin on 19 September, and the founding ceremony is held on 11 November with the motto he wrote. He dies in Beijing on 12 March 1925, and in 1926 the university takes his name.
    relic: The statue of Sun Yat-sen
    relic_desc: The statue on the campus of Sun Yat-sen University. It is the way to Guangzhou in 1924 and is not an antique, so it cannot be sold.
    points:
      p1: Hand in a map of the sites before the new campus is chosen
      p2: Bring home a copy of the book of the lectures
      p3: Be there for the last lecture
    vignettes:
      slips: A clerk made up for the game is about to copy a page that has a slip pasted over two lines. You ask which hand wrote the slip and which wrote the page. He copies the page first and leaves the slip where it is.
      back_row: A student made up for the game cannot find a seat and keeps standing up to look. You move along the bench. He sits through the rest without a word and nods to you as the hall empties.
      hundred: You keep a tally of the days in the back of your notebook, five strokes to a mark. When it reaches a hundred, a clerk made up for the game asks what you are counting. You tell him, days.
eras:
  broad_street_1854:
    vignettes:
      odd_address: Ellen, a fictional clerk, is closing her list for the evening. One address is too far from the pump and she reaches for her pen to strike it. You ask where the family got its water. Ruth can vouch for the address but is waiting to hear from the person who fetched the water. Leave the second column blank, Ellen says, and leave the address where it is.
      witness: Ruth, a fictional neighbour, repeats the address until Ellen is ready to file it. You ask Ruth how she walked there instead. At a turn she stops and points back to the pump. Ellen adds a direction in her own hand. The person who brought the water has yet to arrive.
      street_list: Ellen can take the original list or wait for you to finish a copy. You call the house numbers while she follows the doors with a finger. One mark belongs a door farther down. She sends the original on time, and the amended two-column copy stays on the desk.
    name: Broad Street, London 1854
    short: Broad St.
    place_name: Broad Street, Soho, London
    tags:
      - medical
      - infection
      - cholera
      - c19
      - london
      - history
    event_titles:
      door_block: Turned away at the door
      time_strain: Time slip
    plots:
      microscope:
        name: Give Snow a microscope
        desc: Lets him show people what is in the water more clearly.
        character: John Snow
        article: people:snow
      germ_theory:
        name: Explain germ theory to Snow
        desc: Needs the craft of microbiology, which this era does not have.
        character: John Snow
        article: people:snow
    blurb: Cholera, one pump, and a doctor nobody has listened to yet. Close, cheap, and the effect of hygiene and medicine is clear.
    handle_label: Pump handle removed
    protagonist: John Snow
    protagonist_role: A physician who argued in 1849 that cholera could be transmitted by water
    stay: Stay one office day, 30 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On the night of 31 August 1854, cholera broke out around Broad Street in Soho, London.
          check: true
        - text: The popular explanation was miasma, bad air.
          check: true
        - text: Snow had already proposed in 1849 that cholera spreads through water. Most colleagues did not accept it.
          check: true
        - text: On 8 September the handle of the Broad Street pump was removed.
          check: true
        - text: By the time the handle was removed the outbreak was already declining and many residents had left.
          check: true
      regret:
        - You can save today's patients but not tomorrow's. On the main timeline the handle came off on day eight.
        - Data and maps matter more than medicine, but making people believe data takes time.
    events:
      door_block_stubborn: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, is thrown out of one house and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_stubborn_empty: A neighbour blocks the door, saying it is miasma and no stranger may touch the patient. {staff} is stubborn, does not give way, and is thrown out.
      door_block_insist_empty: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, and is pushed out.
      door_block_insist: A neighbour blocks the door, saying it is miasma. {staff} stands at the door and finishes speaking, is pushed out, and loses {d.ors_stock:i} packets of rehydration salts.
      door_block_appeal: A neighbour blocks the door, saying it is miasma. {staff} does not force the way, turns and goes to Snow to ask him to speak up.
      door_block_yield: A neighbour blocks the door, saying it is miasma. {staff} steps back without a quarrel, and half a day is wasted.
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: Convince Snow
      trust: Win the trust of the street
      handle: Have the pump handle removed ahead of history
    milestones:
      first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
      first_protect: '{date}: {staff} hands the first chlorine tablets to a few households willing to listen, and teaches them to boil or treat the water.'
      met_snow: '{date}: {staff} meets Snow at the street corner. He listens closely but keeps asking one thing: where is the evidence.'
      snow_trusts: '{date}: Snow starts to treat {staff} as one of his own and brings out the house by house list he has been keeping to compare.'
      snow_convinced: '{date}: Snow no longer merely suspects the water. He has enough names, and believes what the stranger told him.'
      board_moves: '{date}: The parish board starts to give way and says the pump might be shut for now.'
      handle_off_history: '{date}: The pump handle comes off. Snow records the removal on 8 September.'
      handle_off_early: '{date}: The pump handle is removed {advance_days:1} days earlier than in history. The main timeline does not change, only this branch.'
      trust_won: '{date}: People on the corner no longer keep {staff} out, and some knock on their own.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of patients falls to around single digits. Many people have left the area.'
    summary:
      near_death: '{staff} collapses on Broad Street and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a letter saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend on Broad Street. The pump handle came off {advance_days:1} days earlier than in history.'
      perfect: '{staff} completed the task on Broad Street and came back safe. In the model, the baseline records {base_D:i} deaths and this branch {D:i}.'
      scramble: '{staff} was turned away at the door again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent thirty days on Broad Street, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was sitting with the patient by the bed.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's patients, not tomorrow's.
        - trait: curious
          text: So that is how it is, water really does carry the sickness away.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they believe it is up to them.
        - text: With one more item I might have saved one more household.
    hints:
      lost_ors: A lot of rehydration salts were lost. Next time let the employee yield, or bring more.
      unused_protect: Chlorine was left over. The limit was the neighbours' trust, not the tablets. Let the employee help patients first to build trust.
      unused_ors: Rehydration salts were left over. The employee may have spent time elsewhere, or patients were not let in.
      ally_gap: Snow's evidence is still thin. The handbook helps him, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  vienna_1847:
    vignettes:
      denominator: Emil, a fictional clerk, has copied the death totals while the admission list is still with the ward. Marta asks how many people came through each door. You help her keep a space for those figures next to the totals. Emil can now hand over a question instead of a misleading comparison.
      ward_key: Marta, a fictional midwife, has been asked for the numbers from the other ward. The initials look alike on Emil’s slips. You wait for Marta to say the full name of the ward she means. She writes it out herself before carrying that slip across the corridor.
      tables: The next clerk is already at the door. Emil can hand over the two sheets now or read their headers with you first. When you read the month, Marta spots a sheet filed one month too early. The corrected copy goes to the next shift, who will still have to wait for the month’s final count.
    name: Vienna General Hospital 1847
    short: Maternity ward
    place_name: Maternity ward, Vienna General Hospital
    tags:
      - medical
      - infection
      - obstetrics
      - c19
      - vienna
      - history
    event_titles:
      door_block: Turned back by seniors
      time_strain: Time slip
    plots:
      forceps:
        name: Hand Semmelweis the design of obstetric forceps
        desc: Saves more mothers in a difficult birth, and the era's craft can make them.
        character: Ignaz Semmelweis
        article: people:semmelweis
      germ_theory:
        name: Explain germ theory to Semmelweis
        desc: Needs the craft of microbiology, which this era does not have.
        character: Ignaz Semmelweis
        article: people:semmelweis
    blurb: Childbed fever, two maternity wards, and a young doctor who put the death counts side by side. The task is not to beat a disease but to persuade a room of seniors who will not wash their hands.
    handle_label: Washing rule starts
    protagonist: Ignaz Semmelweis
    protagonist_role: Assistant obstetrician who has just found that the dissecting room and the delivery room deaths are linked
    stay: Stay two office days, 60 days of history
    items:
      chlorine_tablet:
        name: Chlorinated lime tablet
        desc: One tablet makes a basin of washing solution, enough for dozens of examinations. Cheap, but someone has to wash.
      handbook:
        name: Modern nursing handbook
        desc: Raises skill in caring for mothers. Also a gift for Semmelweis.
      recall_charm:
        name: Recall charm
        desc: Pulls an employee back when they collapse. Without it, all gear is lost.
    strategies:
      focus:
        balanced:
          name: Balanced
          desc: Care for mothers with fever, teach washing when there is a chance, see Semmelweis when there is time.
        cure:
          name: Mothers first
          desc: Bedside care first, little persuading about washing.
        prevent:
          name: Teach washing first
          desc: Persuade people in the ward one by one and hand out washing solution.
        ally:
          name: Work with Semmelweis
          desc: Spend time helping him organise the numbers and go with him to the people he must see.
      on_block:
        yield:
          name: Yield
          desc: If a senior turns you back, let it be.
        insist:
          name: Insist
          desc: Stand at the ward door and finish speaking, do not retreat even if the solution is confiscated.
        appeal:
          name: Appeal
          desc: Turn and go to Semmelweis and ask him to step in.
    encyclopedia:
      history:
        - text: In 1847 the maternal death rate in the first maternity ward of Vienna General Hospital was clearly higher than in the second.
          check: true
        - text: The first ward was staffed by doctors and medical students, who often came straight from dissecting corpses.
          check: true
        - text: In May 1847 Semmelweis introduced chlorine hand disinfection in the first maternity clinic. The game uses a baseline day within that month.
          check: true
        - text: After the rule took effect the death rate fell markedly within a few months.
          check: true
        - text: Mainstream colleagues did not accept his explanation, and germ theory had not been established yet.
          check: true
      regret:
        - The numbers are in front of you, and still you wait for the powerful to nod. The rule began in May.
        - He never lived to see his colleagues truly accept him.
    events:
      door_block_stubborn: A senior doctor says nobody needs an outsider to teach them how to examine mothers. {staff} is stubborn, does not give way, and {d.wash_supply:i} portions of washing solution are confiscated.
      door_block_stubborn_empty: A senior doctor says nobody needs an outsider to teach them how to examine mothers. {staff} is stubborn, does not give way, and is shown out of the ward.
