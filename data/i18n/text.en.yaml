  sun_yat_sen_1924:
    labels:
      sick: Matters still open
      dead: Matters nobody asks about any more
      deaths: Matters that lapsed
      treated: Records in one book, percent
      protected: Sites walked, percent
    identities:
      local_scholar:
        name: a helper in the copying room
        cover: '{staff} says they have had some schooling, write a fair hand and would gladly help with the copying.'
      pen:
        name: a reporter from outside
        cover: '{staff} says they write for a newspaper elsewhere and want to see how the new university is made.'
      wanderer:
        name: a wanderer come to hear the lectures
        cover: '{staff} says they are on the road, heard that someone speaks here on Sundays, and have come to listen.'
      maker:
        name: someone selling at the door of the hall
        cover: '{staff} says they have a trade and would like to set up where the crowd is.'
      far_guest:
        name: a guest off a ship
        cover: '{staff} says they came with a ship and will be in Guangzhou for a while.'
    personal:
      records_read_aloud:
        s_fan: '{date}: Shen Fan writes a hand he has to guess at himself. He reads the names out and a clerk writes, and as they go he marks every name that stands in two of the three records.'
        s_somchai: '{date}: Somchai can read, but his hands are clumsy and nobody can make out what he writes. He reads the names out and a clerk writes. At the temple, when the others were up mending the roof, he was the one who held the ladder.'
      sunday_first:
        s_fan: '{date}: Shen Fan is pressed in at the very back of the hall and cannot hear all of it, so he counts how many are in the hall and how many are taking notes, and writes the two numbers down.'
        s_samuel: '{date}: Samuel is pressed in at the very back of the hall, taking notes on tiptoe. He is too far off, and half of what he writes down is the faces of the people listening.'
        s_amara: '{date}: Amara is pressed in at the very back of the hall and cannot hear all of it. A student beside her has stood too long and turns faint. She helps him sit and counts at his wrist for a while.'
      spoiler:
        s_fan: '{date}: Shen Fan knows that in two years this school will take the name of the man who ordered it, and that a hundred years on he will set out from its statue. He writes the two sentences on the last page of the notebook and closes it.'
        s_guilan: '{date}: Guilan knows that in two years this school will change its name. She cannot write the characters, so she says them over once in her head and tells nobody.'
        s_somchai: '{date}: Somchai knows that in two years this school will take the name of the man who ordered it. He writes the sentence on the last page of the notebook, closes it, and goes to ask a clerk what he is reading.'
        s_carlos: '{date}: Carlos knows that in two years this school will change its name. He cannot write it down, so he tells it to the oven, and laughs before he has finished.'
        s_samuel: '{date}: Samuel knows that in two years this school will change its name, a piece of news nobody else has. He writes it on the last page of the notebook and crosses it out again. There is nowhere to file it.'
        s_amara: '{date}: Amara knows that in two years this school will change its name. She writes the sentence on the last page of the notebook and closes it.'
      pamphlet_given:
        s_fan: '{date}: A clerk hands Shen Fan a copy of the pamphlet, new from the printer, and says everyone in the room is to have one. Shen Fan turns to the preface first and looks at the date under it.'
        s_samuel: '{date}: A clerk hands Samuel a copy of the pamphlet, new from the printer. He asks which printing it is, and the clerk says, the first.'
      errand_frail:
        s_fan: '{date}: Shen Fan is out of breath after a few stairs and cannot carry the pages. He sits at the door of the copying room and counts how many times one text goes round.'
        s_somchai: '{date}: Somchai is out of breath after a few stairs and cannot carry the pages. He sits at the door of the copying room and watches the pages with their slips go in and out.'
        s_samuel: '{date}: Samuel has had his stomach trouble again for some days and is out of breath after a few stairs. He sits at the door of the copying room and notes the hour of every carrying of the pages.'
      homesick_may:
        s_fan: '{date}: A month with nothing on record. Shen Fan keeps a tally in the notebook until it reaches a hundred days, then works it out again beside it. At the office a little over three days have gone by.'
        s_guilan: '{date}: A month with nothing on record. Guilan counts the days. At home the chillies should be going into the ground about now. At the office a little over three days have gone by.'
        s_somchai: '{date}: A month with nothing on record. Somchai still wants to see snow once, and there is none in Guangzhou in May. At the office a little over three days have gone by.'
        s_carlos: '{date}: A month with nothing on record. Carlos wakes at three every morning. His oven is not here, and he stands a whole morning by the stove of someone else, watching. At the office a little over three days have gone by.'
        s_samuel: '{date}: A month with nothing on record, the hardest kind for a reporter. Samuel keeps a tally in the notebook, and it reaches a hundred days. At the office a little over three days have gone by.'
        s_amara: '{date}: A month with nothing on record. Amara works out how many children the ward must have seen born in these hundred days. At the office a little over three days have gone by.'
        s_jeanluc: '{date}: A month with nothing on record. Jean-Luc writes a line a day, as in a log at sea, until there are a hundred. At the office a little over three days have gone by.'
      shipai_frail:
        s_fan: '{date}: Shen Fan knows what will be built at Shipai, east of the city. It is too far, and he cannot walk it.'
        s_somchai: '{date}: Somchai knows what will stand at Shipai, east of the city. It is too far, and he cannot walk it.'
        s_samuel: '{date}: Samuel knows what will stand at Shipai, east of the city, and that it would make a good piece. It is too far, and he cannot walk it.'
      last_seat:
        s_fan: '{date}: Shen Fan hears this lecture out from the usual place, and the count in his notebook stops at sixteen. He stays sitting a while after the hall has emptied.'
        s_guilan: '{date}: Guilan hears this lecture out from the usual place. When the hall has emptied she does not go at once, and sets the benches straight one by one.'
        s_somchai: '{date}: Somchai hears this lecture out from the usual place. He stays sitting a while after the hall has emptied, as he used to wait at the temple for the last bell.'
        s_samuel: '{date}: Samuel takes this lecture down from the usual place. He knows it is the last, and in the notebook he writes only its number and not the word last.'
        s_amara: '{date}: Amara hears this lecture out from the usual place. She stays sitting a while after, until the last person has gone out of the door.'
        s_jeanluc: '{date}: Jean-Luc hears this lecture out standing in the usual place. He is the last to leave the hall, as a captain is the last off the ship.'
      records_shut:
        s_guilan: '{date}: Guilan left school after the third year, and has no part in copying the records. She comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask her than to turn the pages.'
        s_carlos: '{date}: Carlos writes only his own name, and has no part in copying the records. He comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask him than to turn the pages.'
      sunday_sit:
        s_guilan: '{date}: Guilan sits down in a back row of the hall, bad knees and all, and stays from the first word to the last. She does not follow everything said on the platform. The student beside her is thirsty, and she hands over her water.'
        s_somchai: '{date}: Somchai listened to sermons at the temple for twenty years, and sits in a back row of the hall to the very end. As it empties he asks the student beside him what he has been reading.'
        s_jeanluc: '{date}: Jean-Luc has a bad back and insists on standing, and stands at the back of the hall from the first word to the last.'
      pamphlet:
        s_guilan: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Guilan sees it through the window and knows two of the characters on the cover.'
        s_somchai: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Somchai sees the cover through the window. He knows how many copies of this book there will one day be, and asks the clerk only how far he has got in it.'
        s_amara: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Amara sees it through the window and begins to hum.'
        s_jeanluc: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. Jean-Luc sees the cover through the window.'
      errand:
        s_guilan: '{date}: Pages with slips pasted on them go in and out of the copying room. Guilan sits outside trimming vegetables and asks everyone who comes out whether they have eaten.'
        s_amara: '{date}: Pages with slips pasted on them go in and out of the copying room. Amara is outside and sees only the back of whoever carries them, and can tell from the footsteps that he is in a hurry.'
        s_jeanluc: '{date}: Pages with slips pasted on them go in and out of the copying room. Jean-Luc is outside teaching the child of a gatekeeper to tie knots, and sees only the back of whoever carries them.'
      shipai_reached:
        s_guilan: '{date}: Bad knees and all, Guilan walks to Shipai a step at a time. There are only fields. She squats, rubs a pinch of soil between her fingers and says things will grow here.'
        s_carlos: '{date}: Carlos pushes his cart out of the city to the east and reaches Shipai, and comes back saying there are only fields there. He knows a university will be built there, and still he says, only fields.'
        s_amara: '{date}: Amara walks out of the city to the east and reaches Shipai. She knows what will stand here, stays a long while, and draws what is here now, slowly.'
      sunday_stall:
        s_carlos: '{date}: Carlos does not understand what is being said inside, and sets up an oven at the door of the hall to bake bread. When the hall empties the crowd pours out and the bread is gone in no time, sold too cheap as usual.'
      pamphlet_traded:
        s_carlos: '{date}: Carlos trades an ovenful of bread for a copy of the pamphlet, new from the printer. He cannot read it himself, and says it is for the child at home who wants to take over the bakery.'
      errand_carried:
        s_carlos: '{date}: In this branch, the one sent to carry the pages is once Carlos. A sheaf of paper with slips pasted on it, of which he cannot read a word, and not a sheet is creased.'
      last_stall:
        s_carlos: '{date}: Carlos bakes one ovenful more than usual. He knows that on the Sundays to come there will not be such a crowd at this door, and gives away what is left.'
      records_begun:
        s_amara: '{date}: Amara begins to copy the records of the three schools. Written work has always been hard for her, so she copies a line and has a clerk check a line.'
      spoiler_said:
        s_jeanluc: '{date}: Jean-Luc tells a clerk at his copying that in two years this school will take the name of the man who ordered it, and does not raise his voice to say it. The clerk does not look up. The man is still alive, he says, and who names a school like that.'
      shipai_walk:
        s_jeanluc: '{date}: Jean-Luc hears that the new campus is to be at Shipai, east of the city. His knees will not take him so far, and he stands a while on the quay looking east.'
    name: Guangzhou, 1924
    short: Guangzhou
    place_name: Guangzhou, the hall of the Higher Normal School
    tags:
      - thought
      - education
      - university
      - c20
      - guangzhou
      - history
    event_titles:
      asked_the_way: Asked the way
    plots: {}
    blurb: Three schools are to become one university. As work comes in, the preparatory office assigns jobs to people who can do them. Your employee earns a star for each assignment they take on and finish.
    handle_label: The records become one book
    protagonist: Sun Yat-sen
    protagonist_role: A statesman who has ordered three schools joined into one university, and lectures in their hall on Sundays
    stay: Stay seven office days, 210 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it.
          check: true
        - text: From 27 January to 24 August 1924 Sun lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all. Huang Changgu took each one down, Zou Lu read the fair copies and pasted slips on them, and Sun corrected them in his own hand.
          check: true
        - text: Zou Lu took up the preparation on 21 February. On 24 February he called the students of the three schools together in the hall to announce it, and the first preparatory meeting was held on 3 March, with the graduation of the students of the three schools on its agenda.
          check: true
        - text: The first lectures were printed as a pamphlet at the end of March, with a preface Sun wrote on 30 March. On 3 June Zou Lu submitted the measures for joining the schools, and they were approved on 6 June.
          check: true
        - text: Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote. Sun died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.
          check: true
      regret:
        - You leave on 1 September. Classes begin on the 19th, and the motto is written after that.
        - The lectures stopped at the sixteenth. Nobody in the hall knew it was the last.
    events:
      asked_the_way: '{date}: A new student with a letter asks {staff} the way to an office. {staff} does not know either, and they look for it together for half the morning.'
      asked_the_way_shown: '{date}: A new student with a letter asks {staff} the way to an office. {staff} shows it on the sheet, and the student thanks them and goes off with the sheet in hand.'
    star_points:
      xue: Plan where the enrolment notices should go outside the walls and hand the route to the office messengers
      wen: Take an introduction to the three schools and bring their concerns back on one sheet for the first meeting
      si: Compare the sites the office is considering and deliver a map before the decision on Shipai
      bian: Check the three graduation lists and deliver one roster for the 21 June ceremony
      xing: Join the crew at Shipai and set the boundary posts for the new campus
    points_fail:
      xue: In this branch the notice goes up only in the city, and students outside hear of it after registration has begun.
      wen: The first preparatory meeting is held as recorded, and each school still speaks only of its own troubles, with no list that puts them together.
      si: Shipai is chosen as recorded, and the office has no sheet with the sites drawn together.
      bian: The 21 June graduation goes ahead as recorded. The office has to work from three separate lists.
      xing: The ground at Shipai is marked out only on paper as recorded, and not one post stands on it.
    shift:
      xue:
        was: '9 June 1924: National Guangdong University asks the provincial education offices to enrol students, and on 10 June registration for the preparatory examination opens, with 520 places planned.'
        now: In this branch the notice of enrolment is also posted at the crossroads outside the city and on the quays.
      wen:
        was: '3 March 1924: the first preparatory meeting is held, and first on its agenda is the graduation of the students of the three schools.'
        now: In this branch a list of the troubles of all three schools lies on the table of the meeting.
      si:
        was: '1924: the schools are spread over several places and hard to run, Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, and land is marked out that year.'
        now: In this branch a map of the sites and of Shipai lies beside the papers on the choice.
      bian:
        was: '21 June 1924: Zou Lu takes up the post of president of National Guangdong University, and the graduation ceremony of the three schools is held the same day.'
        now: In this branch, the office has a single checked roster for the ceremony.
      xing:
        was: '1924: Sun Yat-sen has Zou Lu choose Shipai for the new campus, but building begins only in 1933 and the first colleges move in in the autumn of 1934. Sun dies on 12 March 1925 and never sees it.'
        now: In this branch, before he leaves Guangzhou in November, the bounds of the ground at Shipai already stand, post by post.
        who: sun_yat_sen_guangzhou
        bio: In this timeline the bounds of the new campus at Shipai stand before Sun Yat-sen leaves Guangzhou.
    shift_all: Each job left something the office could use. Looking back, the five jobs echo the motto Sun Yat-sen later wrote for the university, with its call to study widely, enquire carefully, think prudently, discern clearly and practise earnestly.
    milestones:
      order_given: '{date}: Sun Yat-sen orders the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and names Zou Lu to prepare it. Nobody in the city can yet say where this university is.'
      sun_dies: '{date}: Sun Yat-sen dies in Beijing.'
      renamed: '{date}: The National Government orders National Guangdong University renamed National Sun Yat-sen University.'
      lecture_jan27: '{date}: A Sunday. Sun Yat-sen gives the first of his lectures on the Three Principles of the People in the hall of the Higher Normal School.'
      lecture_feb17: '{date}: A Sunday. Sun Yat-sen lectures in the hall of the Higher Normal School. The series began on 27 January and this is the fourth lecture. At the side of the platform a man writes without looking up. That is Huang Changgu, who is there for every one.'
      zou_takes_up: '{date}: Zou Lu takes up the preparation.'
      hall_feb24: '{date}: A Sunday again. The fifth lecture is given in the hall today, and Zou Lu calls the students of the three schools together here to announce the preparation.'
      first_meeting: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad.'
      first_meeting_book: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad. In this branch the names of the graduating classes of the three schools are by now in one book.'
      proofs_travel: Through March the text of the lectures goes from hand to hand. The notes of Huang Changgu are copied fair and sent to Sun Yat-sen, he has them carried to Zou Lu to be read, Zou Lu pastes slips on the pages and sends them back, Sun corrects them in his own hand, and they come round again.
      preface: '{date}: Sun Yat-sen writes the preface for the pamphlet of the first lectures. It is printed at the end of March.'
      lecture_apr20: '{date}: A Sunday. The lectures in the hall have reached their second part.'
      measures_sent: '{date}: Zou Lu submits the measures for joining the three schools.'
      measures_approved: '{date}: The measures are approved.'
      shipai_chosen: In this year Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, east of the city. The schools are spread over several places and hard to run.
      last_lecture: '{date}: The sixteenth lecture. The third part has reached only its fourth lecture, and the rest is never given. Nobody in the hall knows this is the last.'
      classes_begin: '{date}: Classes begin at National Guangdong University.'
      ceremony: '{date}: The founding ceremony is held, with the motto Sun Yat-sen wrote: study widely, enquire carefully, think prudently, discern clearly, practise earnestly. He is not there, and he leaves Guangzhou two days later.'
      sunday_first: '{date}: {staff} is pressed in at the very back of the hall, a long way from the platform, able to see the man and unable to hear all of it.'
      sunday_stall: '{date}: {staff} cannot get into the hall and sets up a stall at the door. When the hall empties the crowd pours out, and everything is sold in no time.'
      sunday_sit: '{date}: {staff} finds a place in a back row of the hall and sits from the first word to the last without moving.'
      records_begun: '{date}: {staff} begins to copy the records of the three schools into one book.'
      records_read_aloud: '{date}: Nobody can read the hand of {staff}. So {staff} reads the names out and a clerk writes, and the three records begin to become one.'
      records_shut: '{date}: Copying the records takes reading, and {staff} has no part in it, but comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask {staff} than to turn the pages.'
      records_done: '{date}: The records of the three schools are one book, before the first preparatory meeting.'
      records_late: '{date}: The records of the three schools are one book. The first preparatory meeting has already been held.'
      sites_done: '{date}: {staff} has walked every one of the sites scattered over the city and drawn them on one sheet, with how long it takes to walk from each to the next.'
      asked_inside: '{date}: The clerks no longer leave {staff} waiting at the door, and call them in.'
      copy_kept: '{date}: {staff} wraps the pamphlet and puts it in with their things.'
      exhausted: '{date}: {staff} is so tired their hands shake, and has to rest.'
      spoiler: '{date}: {staff} knows that in two years this school will take the name of the man who ordered it. {staff} writes the sentence on the last page of the notebook and closes it.'
      spoiler_said: '{date}: {staff} tells a clerk at his copying that in two years this school will take the name of the man who ordered it. The clerk does not look up. The man is still alive, he says, and who names a school like that.'
      errand: '{date}: Pages with slips pasted on them go in and out of the copying room. {staff} is outside and sees only the back of whoever carries them.'
      errand_carried: '{date}: In this branch, the one sent to carry the pages is once {staff}. A sheaf of paper with slips pasted on it goes from one end to the other, and not a sheet is creased.'
      errand_frail: '{date}: {staff} is out of breath after a few stairs and cannot carry the pages, and sits at the door of the copying room watching the pages with their slips go in and out.'
      pamphlet: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. {staff} sees the cover through the window.'
      pamphlet_traded: '{date}: {staff} trades what they make with their own hands for a copy of the pamphlet, new from the printer.'
      pamphlet_given: '{date}: A clerk hands {staff} a copy of the pamphlet, new from the printer, and says everyone in the room is to have one.'
      homesick_may: '{date}: A month with nothing on record. {staff} keeps a tally in the notebook, and it reaches a hundred days. At the office a little over three days have gone by.'
      shipai_walk: '{date}: {staff} hears that the new campus is to be at Shipai, east of the city. There is no journey out there today.'
      shipai_reached: '{date}: {staff} walks out of the city to the east and reaches Shipai. {staff} knows what will stand here, stays a long while, and draws what is here now.'
      shipai_frail: '{date}: {staff} knows what will stand at Shipai, east of the city. It is a long walk, and today {staff} stays in town.'
      last_seat: '{date}: {staff} hears this lecture out from the usual place, and stays sitting a while after the hall has emptied.'
      last_stall: '{date}: {staff} brings more to the door of the hall than on other Sundays. {staff} knows that on the Sundays to come there will not be such a crowd at this door.'
      adviser: '{date}: The preparatory office is short of hands. A clerk clears a seat for {staff} and says they can pass along jobs as they come in.'
      wen_ask: '{date}: Before the first meeting, a clerk happens to know someone at each school who can spare time. The clerk sends {staff} with introductions and asks for one sheet the committee can use. {staff} hears out the teachers and students and brings back their concerns on a single page.'
      xue_enrol: '{date}: A clerk sees how quickly {staff} works out which roads serve the villages outside the walls and asks for a route for the enrolment notices. {staff} marks the crossings and quays, then hands the finished route to the messengers with the notices.'
      bian_rolls: '{date}: The three graduation lists arrive with names that do not match. A clerk who has seen {staff} check papers carefully hands over the three bundles. {staff} checks the names against the originals and returns one roster for the ceremony.'
      si_site: '{date}: The office needs someone who will walk every site before drawing a conclusion. They ask {staff} to compare the grounds in town and at Shipai. {staff} walks them all and brings back a single map with the approaches marked.'
      xing_shipai: '{date}: The crew going to Shipai still needs an extra pair of hands. A clerk asks {staff}, who can manage the walk and the work. At Shipai, {staff} holds the posts straight as the crew drives them in and walks the boundary with them once more before returning.'
      enrol_open: '{date}: Registration for the preparatory examination opens. The day before, the university asked the provincial education offices to enrol students, with 520 places planned.'
      grad_ceremony: '{date}: Zou Lu takes up the post of president, and the graduation ceremony of the three schools is held the same day.'
    summary:
      near_death: '{staff} falls ill in Guangzhou, is pulled back by the recall charm, and wakes before the statue.'
      stay_and_gifts: '{staff} finished the work and did not come back. They left a note saying they want to stay and see the university open. Gifts will arrive later.'
      gave_up: '{staff} did not last to the end and woke before the statue, saying they could not stay in the Guangzhou of 1924 any longer.'
      legend: '{staff} woke before the statue with a pamphlet printed in March 1924 among their things. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      perfect: '{staff} came back to the statue. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      modest: '{staff} spent two hundred and ten days in Guangzhou, did what was within reach, and stood before the statue again. On the day they left, classes were {countdown:i} days away.'
    quotes:
      near_death:
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: Seven months is too long.
      legend:
        - trait: curious
          text: So that is how a book is made, a page corrected at a time.
        - text: When I left they had not yet begun classes.
      perfect:
        - trait: kind
          text: The people who came asking were answered in the end.
        - text: Did what had to be done.
      modest:
        - trait: glib
          text: I said the name would change in two years. Nobody believed me.
        - text: I was only there.
    hints:
      low_luck: Luck brings a timely introduction to the three schools.
      low_wit: The office trusts the notice route to an employee with enough wit. A cyborg neural chip helps.
      low_finesse: The office looks for a steady hand with documents before entrusting someone with the three lists.
      low_will: The office looks for the will to walk all the proposed sites. A cyborg bionic lung helps.
      low_constitution: The crew looks for someone with the constitution for the walk and the work at Shipai. A cyborg bionic lung helps.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
