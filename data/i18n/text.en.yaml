trait_notes:
  kind:
    pro: Earns trust and gives care that counts.
    con: Easily hurt by hostility, and gives way too soon.
  curious:
    pro: Notices things and asks what nobody else asks.
    con: Easily pulled away from what has to be done.
  glib:
    pro: Talks their way in and brings people round.
    con: A smooth tongue is not always trusted.
  sensitive:
    pro: Notices what is wrong, and feels what others feel.
    con: A weak constitution, so disease catches on more easily.
  bold:
    pro: Pushes through resistance and danger.
    con: Careless, and misses what should have been noticed or cared for.
  patient:
    pro: Waits as long as it takes and stays gentle.
    con: Slow to react when something changes suddenly.
  methodical:
    pro: Works by a method, checks and records every step, and holds to it when pushed.
    con: Rigid, struggles when there is no order to lean on, and poor at bringing others round.
  hardy:
    pro: Stands up to hard conditions, and falls ill less than others.
    con: Blunt, and misses the fine details.
  charismatic:
    pro: People want to listen and to follow.
    con: Spends energy on people and cannot sit down to fine work.
  quiet:
    pro: Draws no attention, sees a lot and can wait.
    con: Does not push, and cannot bring others round.
  wanderer:
    pro: Raised in the lower ranks or long on the road, rarely homesick, shrugs off hostility and sleepless nights, and takes hardship in stride.
    con: Does not open up easily, is not easily trusted, and ill at ease before the powerful.
  attached:
    pro: Gives deeply to people and stays by them.
    con: The longer from home the more homesick, and may give up.
  streetwise:
    pro: Quick on the street, and finds a way out of any scrape.
    con: Restless, and poor at long steady work.
  scholarly:
    pro: Well read, and can talk with scholars as an equal.
    con: Weak in body, and catches disease more easily.
  handy:
    pro: Solid craft, and gets the thing done properly.
    con: Cannot explain, and poor at persuading others.
  artistic:
    pro: Keen to beauty and sound, and moves people.
    con: The mind drifts, and homesickness comes easily.
  calm:
    pro: Steady when it comes to the worst, and good at nursing.
    con: A beat slow, and misses small changes.
  cosmopolitan:
    pro: Has seen many places, and strikes up talk with strangers.
    con: Has seen it all, and has little patience to stay with one thing.
  cheerful:
    pro: Laughs easily, helps willingly and lifts the mood.
    con: Thinks simply, and does not see the trouble in the dark.
  vigil:
    pro: Clearer the later it gets, and keeps a long watch without drifting.
    con: Falls apart after a long day on the road.
  faithful:
    pro: Holds a firm belief, and does not waver in hard times.
    con: Slow to take in what does not fit the belief.
  skeptical:
    pro: Wants proof, is not easily fooled and sees the flaw.
    con: Guarded with people, and others are guarded with them.
  ambitious:
    pro: Has a clear aim, and asks for what it takes.
    con: Keeps the goal in mind and overlooks the trouble of those nearby.
