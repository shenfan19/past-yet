      copy: Bring home a copy of the book of the lectures
      last: Be there for the last lecture
    milestones:
      order_given: '{date}: Sun Yat-sen orders the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and names Zou Lu to prepare it. Nobody in the city can yet say where this university is.'
      lecture_feb17: '{date}: A Sunday. Sun Yat-sen lectures in the hall of the Higher Normal School. The series began on 27 January and this is the fourth lecture. At the side of the platform a man writes without looking up. That is Huang Changgu, who is there for every one.'
      zou_takes_up: '{date}: Zou Lu takes up the preparation.'
      hall_feb24: '{date}: A Sunday again. The fifth lecture is given in the hall today, and Zou Lu calls the students of the three schools together here to announce the preparation.'
      first_meeting: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad.'
      first_meeting_book: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad. In this branch the names of the graduating classes of the three schools are by now in one book.'
      proofs_travel: Through March the text of the lectures goes from hand to hand. The notes of Huang Changgu are copied fair and sent to Sun Yat-sen, he has them carried to Zou Lu to be read, Zou Lu pastes slips on the pages and sends them back, Sun corrects them in his own hand, and they come round again.
      preface: '{date}: Sun Yat-sen writes the preface for the pamphlet of the first lectures. It is printed at the end of March.'
      lecture_apr20: '{date}: A Sunday. The lectures in the hall have reached their second part.'
      measures_sent: '{date}: Zou Lu submits the measures for joining the three schools.'
      measures_approved: '{date}: The measures are approved.'
      shipai_chosen: In this year Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, east of the city. The schools are spread over several places and hard to run.
      last_lecture: '{date}: The sixteenth lecture. The third part has reached only its fourth lecture, and the rest is never given. Nobody in the hall knows this is the last.'
      classes_begin: '{date}: Classes begin at National Guangdong University.'
      ceremony: '{date}: The founding ceremony is held, with the motto Sun Yat-sen wrote: study widely, enquire carefully, think prudently, discern clearly, practise earnestly. He is not there, and he leaves Guangzhou two days later.'
      sunday_first: '{date}: {staff} is pressed in at the very back of the hall, a long way from the platform, able to see the man and unable to hear all of it.'
      sunday_stall: '{date}: {staff} cannot get into the hall and sets up a stall at the door. When the hall empties the crowd pours out, and everything is sold in no time.'
      sunday_sit: '{date}: {staff} finds a place in a back row of the hall and sits from the first word to the last without moving.'
      records_begun: '{date}: {staff} begins to copy the records of the three schools into one book.'
      records_read_aloud: '{date}: Nobody can read the hand of {staff}. So {staff} reads the names out and a clerk writes, and the three records begin to become one.'
      records_shut: '{date}: Copying the records takes reading, and {staff} has no part in it, but comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask {staff} than to turn the pages.'
      records_done: '{date}: The records of the three schools are one book, before the first preparatory meeting.'
      records_late: '{date}: The records of the three schools are one book. The first preparatory meeting has already been held.'
      sites_done: '{date}: {staff} has walked every one of the sites scattered over the city and drawn them on one sheet, with how long it takes to walk from each to the next.'
      asked_inside: '{date}: The clerks no longer leave {staff} waiting at the door, and call them in.'
