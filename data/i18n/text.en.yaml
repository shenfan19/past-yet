  welcome:
    title: Welcome
    office_title: Game setup
    acknowledge: I understand
    story: You run a small agency that sends people into the past. History cannot be changed, so every trip happens on a branch of its own, and how far the branch differs from the main timeline is paid to you as time energy. Collect enough of it and you can go home to your family.
    how_title: How to play
    how:
      - Pick a place on the map and the time you want there. The clock starts when the first trip goes out.
      - Choose who goes and what they carry, then send them.
      - Wait for the staff to return and read their reports. They bring back time energy and sometimes antiques. Transfer antiques to the institute to receive research funding.
      - An antique opens the place it points to, and it only leads to earlier times.
    staff_title: Your first employees
    staff_hint: '{n} employees drawn from different parts of the world. You can draw again until the first trip goes out.'
    reroll_staff: Draw other candidates
    places_title: Your first places
    places_hint: 'Three places are open from the start: the university where the agency began, and two drawn at random. They can be drawn again until the first trip goes out.'
    reroll: Draw the two random ones again
    tutorial: first trip
    disclaimer_title: Disclaimer · About the people in the game
    disclaimer: The employees and their stories are invented. Some lean on common impressions of a place or a group, and some are written against them, and neither says anything about a real group. The author cannot know every culture well, so an AI also looked for anything that might offend, and it can be wrong. If something is unfair, inaccurate or hurtful, please report it in the {issues} of the repository and it will be changed as soon as possible.
    authorship: The credited contributors are responsible for the content they provide. AI-assisted content is marked AI, and the credited human contributors are responsible for reviewing and correcting it. See each card’s source notes for its verification status.
    rights: If anything in the game infringes on someone's rights, or the rights of a family, please write to contact@teleporter.uk or open an issue in the repository, and it will be removed.
