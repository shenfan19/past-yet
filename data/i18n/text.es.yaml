      review: Los empleados y sus historias son ficticios. Los datos históricos, las representaciones culturales y las traducciones pueden contener errores u omisiones. Si encuentras contenido inexacto, injusto, ofensivo o que vulnere derechos, comunícalo a través de {issues} o escribe a {mail}. El autor revisará el aviso y retirará cuanto antes el contenido problemático.
