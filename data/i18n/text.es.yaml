  welcome:
    story:
      - Diriges una agencia de viajes en el tiempo. Contrata empleados y envíalos al pasado.
      - Protege los momentos en que la historia podría cambiar y repara lo que quedó pendiente en una línea temporal paralela.
      - Tus logros te dan energía temporal para regresar al futuro y reencontrarte con tu familia.
    story_start: Todo empieza ante la estatua de bronce del doctor Sun Yat-sen, en la universidad que lleva su nombre. Este juego conmemora el 160.º aniversario de su nacimiento.
    disclaimer_title: Aviso
  header_lines:
    - line: Remonto el río por un camino áspero y empinado.
      source: Clásico de la poesía, Los juncos
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Sigo la corriente. Pareces estar allí, en un islote del río.
      source: Clásico de la poesía, Los juncos
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Ya estuve aquí, pero no sabría decir cuándo ni cómo.
      source: D. G. Rossetti, Luz repentina
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: ¿Cuándo volveré a ver humear la chimenea de mi pueblecito?
      source: Joachim du Bellay, Los pesares
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: Volverán las oscuras golondrinas en tu balcón sus nidos a colgar.
      source: Gustavo Adolfo Bécquer, Rima LIII
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: Colza en flor. La luna al este, el sol al oeste.
      source: Yosa Buson, haiku
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: Un recuerdo en una estrella, un amor en otra.
      source: Yun Dong-ju, Noche de contar estrellas
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: El tiempo viste de verde la tierra que antes cubría la nieve.
      source: Luís de Camões, Sonetos
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: En el mapa antiguo aún está el camino de vuelta a casa.
    - line: Cambió el número de la casa. La luz de la tarde sigue cayendo en el mismo sitio.
    - line: 'Próxima parada: hace mucho tiempo.'
