ui:
  about:
    version_line: '{v}, publié le {date}'
    dedication: La première version a été achevée le 19 novembre 2026. L’histoire s’ouvre devant la statue en bronze du Dr Sun Yat-sen, à l’université qui porte son nom, en hommage au 160e anniversaire de sa naissance.
    update_notes: Notes de mise à jour
    content_credit:
      mail: e-mail
      design: Fan Shen a conçu le jeu avec l’aide de l’IA.
      drafts: L’IA génère les récits et les notices historiques. L’auteur les relit progressivement. Les contributions sont indiquées sur les fiches.
      review: Les employés et leurs histoires sont fictifs. Les faits historiques, les représentations culturelles et les traductions peuvent contenir des erreurs ou des omissions. Signalez tout contenu inexact, injuste, offensant ou portant atteinte à des droits via {issues} ou par {mail}. L’auteur vérifiera le signalement et retirera rapidement le contenu en cause.
    echoes:
      title: Échos historiques
      rule: Chaque histoire jouable propose des citations historiques dont la source est indiquée. Le rapport affiche un écho même sans étoile, en cas de désynchronisation ou si la personne envoyée n’a pas pu prendre part à l’événement. Les étoiles et l’issue du voyage déterminent la citation. En cas d’évacuation médicale ou de rappel manuel, le rapport ne présente aucun écho.
    preview:
      title: Version préliminaire
      project: Ce jeu est né d’un projet de recherche et nous aide à développer son moteur de simulation. Vous pouvez y jouer sans connaître ces travaux.
      changes: À mesure que nous ajoutons des fonctionnalités, les règles, les effets des objets et les résultats des actions peuvent changer. Nous ferons notre possible pour préserver votre progression, mais une mise à jour importante peut rendre une ancienne sauvegarde inutilisable.
