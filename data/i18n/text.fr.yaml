    description: Un jeu de voyage dans le temps où vous envoyez votre équipe dans le passé et lisez ses rapports à son retour.
  header_lines:
    - line: Je remonte le courant, par un chemin raide et difficile.
      source: Classique des vers, Les Roseaux
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Je descends le courant. Tu sembles être là, sur un îlot.
      source: Classique des vers, Les Roseaux
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Je suis déjà venu ici, mais quand ni comment, je ne saurais le dire.
      source: D. G. Rossetti, Lumière soudaine
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: Quand reverrai-je, hélas, de mon petit village fumer la cheminée ?
      source: Joachim du Bellay, Les Regrets
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: Les hirondelles sombres reviendront suspendre leurs nids à ton balcon.
      source: Gustavo Adolfo Bécquer, Rime LIII
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: Colza en fleurs. La lune à l’est, le soleil à l’ouest.
      source: Yosa Buson, haïku
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: À une étoile, un souvenir. À une autre, un amour.
      source: Yun Dong-ju, Nuit à compter les étoiles
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: Le temps revêt de vert la terre autrefois couverte de neige.
      source: Luís de Camões, Sonnets
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: Sur la vieille carte, le chemin du retour est toujours là.
    - line: Le numéro a changé. La lumière de l’après-midi tombe toujours au même endroit.
    - line: 'Prochain arrêt : il y a longtemps.'
