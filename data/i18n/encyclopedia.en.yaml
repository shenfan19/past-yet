  game: Game assumption. There is no historical source behind it, the numbers are set to make the game fun.
  lm: Life Matters model library and reference engine, repository life-matters-reference-engine.
  readme: The README of this game repository and the model files under data/eras, where every variable carries a source tag.
  catalog: Event summaries written from general knowledge. The years, places and figures have not been checked against sources yet. The relics are inventions of the game.
sections:
  places:
    broad_street:
      name: Broad Street, London, 1854
      text: A street in Soho, London, with a public water pump at its corner. From the end of August to early September 1854 cholera broke out here. Broad Street in the game is a neighbourhood model of about five hundred people.
    vienna_clinic:
      name: Vienna General Hospital, 1847
      text: One of the largest hospitals in Europe in the mid nineteenth century, with two maternity wards, one where doctors and students delivered and one where midwives did. The maternal death rates of the two wards differed greatly.
  people:
    snow:
      name: John Snow
      text: English physician. He had proposed in 1849 that cholera spreads through water, and in 1854 tied the cases to the Broad Street pump with a house to house survey. In the game he is someone an employee can work with.
    semmelweis:
      name: Ignaz Semmelweis
      text: Obstetrician of Hungarian origin. In 1847 he found that deaths in the dissecting room and the delivery room were linked, and required hands to be washed in a chlorinated lime solution before deliveries. In the game he is someone an employee can work with.
  events:
    pump_handle:
      name: The Broad Street pump handle is removed
      text: History records the handle being removed on 8 September. The outbreak was already declining by then and many residents had left, so how many lives the removal saved is still debated. In the game an employee can get the handle removed earlier, but only on that branch.
    handwashing_rule:
      name: The Vienna handwashing rule
      text: History records that in mid May 1847 Semmelweis required hands to be washed in a chlorinated lime solution before deliveries, and the death rate in the ward then fell. The exact dates and numbers are unchecked.
    branch:
      name: Branches and the main timeline
      text: Game assumption. History cannot be changed. Everything an employee does lands on a parallel branch and the main timeline stays as it was. The difference between the branch and the main timeline is converted into time energy.
  stories:
    royal_comb_story:
      name: The girl and the prince
      text: A girl travels into the past and marries a prince. A small story like this has no history to change, it reuses the same simulation with a minor character as protagonist and goal. Not built as playable content yet.
model_events:
  door_block: While going door to door to treat people, an employee may be turned away by neighbours or seniors. Whether they yield, insist or appeal is decided by their traits.
  time_strain: When a branch drifts too far from history, the employee feels the time slip, gets more tired, and is more likely to come to harm.
stats:
  constitution:
    gain: Stands the long days and the sick wards, and recovers faster.
    cost: A weak constitution means catching disease and losing health in proportion.
  favor:
    name: Mood
    text: An employee's mood, 0 to 100, starting at 50. Every success raises it, every failure and giving up lowers it, and a reward of a month of wages adds 50.
    gain: Every attribute follows the mood, up to 20% more at full mood, so a good run feeds itself. A high mood also makes an employee slower to get homesick and give up.
    cost: At the bottom every attribute is 20% down, and a bad run feeds itself too. A reward costs a month of wages.
  wit:
    gain: Learns the craft of the place, treats better and finds what is wrong.
    cost: A quick mind is the first to see what it cannot change.
  finesse:
    gain: Talks its way in, wins allies and trust, and handles things with a light touch.
    cost: A smooth talker is not always believed.
  will:
    gain: Holds on at the door, and homesickness and hostility take less from them.
    cost: A strong will insists when it should give way.
  lawful:
    gain: 'Not a verdict on a person. A high order is a lean to the orderly: keeps rules, plans and promises, and does what the group expects.'
    cost: 'A low order is a lean to the chaotic: improvises, defies and acts alone. Some things in history only the second kind could do, and the first finds it hard to bend a rule for them.'
