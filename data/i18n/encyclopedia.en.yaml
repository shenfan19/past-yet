sections:
  places:
    broad_street:
      name: Broad Street, London, 1854
      text: A street in Soho, London, with a public water pump at its corner. From the end of August to early September 1854 cholera broke out here.
    vienna_clinic:
      name: Vienna General Hospital, 1847
      text: One of the largest hospitals in Europe in the mid nineteenth century, with two maternity wards, one where doctors and students delivered and one where midwives did. The maternal death rates of the two wards differed greatly.
    scutari_barrack:
      name: Barrack Hospital, Scutari, 1855
      text: A large army barracks on the Asian shore of the Bosphorus, used as a hospital in the Crimean War. In the winter of 1854 to 1855 it was crowded and its sewers were blocked.
    havana_district:
      name: Havana, 1881
      text: A hot, crowded port where yellow fever came back every summer.
    berkeley_vale:
      name: Berkeley, 1796
      text: A market town in the Vale of Berkeley in Gloucestershire, where Edward Jenner practised as a country doctor.
    balaklava_camp:
      name: Balaklava, 1855
      text: A small harbour on the south coast of the Crimea that served as the British supply base.
    greenland_ice_sheet:
      name: Greenland ice sheet, 1930
      text: The inland ice of Greenland, where the German expedition of 1930 and 1931 kept a station in the middle of the sheet.
    ross_ice_shelf:
      name: Ross Ice Shelf, 1912
      text: A huge floating sheet of ice on the edge of Antarctica, crossed by the Terra Nova expedition on the way to and from the Pole.
    everest_north_side:
      name: Mount Everest, north side
      text: The north face of the highest mountain, with the Rongbuk glacier below and a line of camps strung up to the North Col and beyond.
    chimborazo_slope:
      name: Chimborazo, 1802
      text: A snow-capped volcano in the Andes of Ecuador whose summit is the point on the surface of the earth farthest from its centre.
    galapagos_islands:
      name: Galapagos Islands, 1835
      text: A group of volcanic islands on the equator in the Pacific, dry near the shore and with little fresh water.
    tahiti_endeavour:
      name: Tahiti, 1769
      text: The largest of the Society Islands in the Pacific, where the Endeavour anchored in 1769 to observe the transit of Venus.
    guangdong_university_office:
      name: The hall of the Higher Normal School, Guangzhou, 1924
      text: The hall of the National Higher Normal School in Guangzhou, on the old site of the examination compound. In 1924 the three schools were being joined into one university here, and on Sundays Sun Yat-sen lectured in the same hall.
  people:
    snow:
      name: John Snow
      text: English physician. He had proposed in 1849 that cholera spreads through water, and in 1854 tied the cases to the Broad Street pump with a house to house survey.
    semmelweis:
      name: Ignaz Semmelweis
      text: Obstetrician of Hungarian origin. In 1847 he found that deaths in the dissecting room and the delivery room were linked, and required hands to be washed in a chlorinated lime solution before deliveries.
    abel_froland:
      name: Niels Henrik Abel
      text: Norwegian mathematician, 1802 to 1829. He proved that the general equation of the fifth degree cannot be solved with radicals and made early advances in elliptic functions. He died of tuberculosis at twenty six, shortly before his work was recognised.
    ahmed_baba_timbuktu:
      name: Ahmed Baba
      text: Scholar of Timbuktu, 1556 to 1627. He wrote dozens of works on law and grammar and held a large private library. After the Moroccan conquest of 1591 he was taken to Marrakesh, where his books were seized, and he later returned to Timbuktu.
    al_haytham_cairo:
      name: Ibn al-Haytham
      text: Arab scholar of mathematics and optics, about 965 to about 1040, who worked in Cairo. His Book of Optics argued that vision comes from light entering the eye and relied on experiments, which makes him an early figure of the experimental method.
    al_jazari_diyarbakir:
      name: Al-Jazari
      text: Engineer in the service of the Artuqid court, active around 1200. His 1206 Book of Knowledge of Ingenious Mechanical Devices describes water clocks, automata and pumps, with a crank and connecting rod and a crankshaft among its devices.
    al_khwarizmi_baghdad:
      name: Al-Khwarizmi
      text: Scholar of the House of Wisdom in Baghdad, about 780 to about 850. His book on calculation by restoration and balancing gave algebra its name, and the Latin form of his own name gave the word algorithm.
    angkor_wat:
      name: The Khmer builders
      text: The builders of the temple complex of Angkor Wat, raised in the first half of the twelfth century under the Khmer king Suryavarman II. Its design follows the model of a mountain at the centre of the world, and its walls carry long carved reliefs. The names of the architects are not known.
    antikythera_rhodes:
      name: An unknown maker
      text: The unknown maker of the Antikythera mechanism, a geared device from around the second century BC recovered from a shipwreck in 1901. It modelled the motions of the sun and moon and predicted eclipses. Nothing is known of the maker.
    archimedes_syracuse:
      name: Archimedes
      text: Greek mathematician and inventor of Syracuse, about 287 BC to 212 BC. He worked out the volume of the sphere, the principle of buoyancy and the law of the lever. He was killed when Roman forces took the city.
    aristarchus_alexandria:
      name: Aristarchus
      text: Greek astronomer, about 310 BC to about 230 BC. The only surviving work estimates the sizes and distances of the sun and moon, and later authors report that he proposed a heliocentric system, which few accepted at the time.
    aristotle_lyceum:
      name: Aristotle
      text: Greek philosopher, 384 BC to 322 BC, student of Plato and teacher of Alexander the Great. He founded the Lyceum in Athens and wrote on logic, biology, physics, ethics and politics, shaping scholarship for centuries.
    artemisia_florence:
      name: Artemisia Gentileschi
      text: Italian painter, 1593 to about 1656. Trained by her father Orazio Gentileschi, she took part in a famous trial in 1612 and went on to paint strong biblical and mythological women. In 1616 she became the first woman admitted to the Academy of the Arts of Drawing in Florence.
    aryabhata_patna:
      name: Aryabhata
      text: Indian mathematician and astronomer, born in 476. His work, written at Kusumapura in 499, gives a value of pi close to 3.1416, explains eclipses by shadows and treats the rotation of the Earth.
    bach_leipzig:
      name: Johann Sebastian Bach
      text: German composer and organist, 1685 to 1750. From 1723 he was cantor of St Thomas in Leipzig, where he wrote cantatas, passions and keyboard works. He suffered from severe eyesight problems in his last years and died in July 1750.
    ban_zhao_luoyang:
      name: Ban Zhao
      text: Chinese historian and writer of the Han, about 45 to about 117. After the death of Ban Gu she continued work on the Book of Han. The Book of the Later Han also names Ma Xu as a subsequent contributor.
    basho_hiraizumi:
      name: Matsuo Basho
      text: Japanese haiku poet, 1644 to 1694. In 1689 he travelled the far north on foot and recorded the journey in The Narrow Road to the Deep North, mixing prose and verse.
    beethoven_vienna:
      name: Ludwig van Beethoven
      text: German composer, 1770 to 1827, born in Bonn, who spent most of his working life in Vienna. His hearing declined from his late twenties and was almost gone by the time of the Ninth Symphony, first performed in Vienna on 7 May 1824. He died in Vienna on 26 March 1827.
    bell_boston:
      name: Alexander Graham Bell
      text: Scottish born scientist and inventor, 1847 to 1922, who taught the deaf in Boston. In 1876 he patented the telephone and made the first call to his assistant.
    bessie_coleman_jacksonville:
      name: Bessie Coleman
      text: American aviator, 1892 to 1926, the first Black woman to hold a pilot licence. Refused entry to flight schools in the United States, she learned French and trained in France. She died in a crash in Jacksonville in 1926.
    bizet_paris:
      name: Georges Bizet
      text: French composer, 1838 to 1875. His opera Carmen opened in Paris in 1875 to a cool reception and he died a few months later. It became one of the most performed operas.
    boltzmann_duino:
      name: Ludwig Boltzmann
      text: Austrian physicist, 1844 to 1906. He explained the laws of heat through the statistics of atoms, and the entropy formula is carved on his tomb. His work on atoms remained controversial in his lifetime. He died at Duino in 1906.
    boole_ballintemple:
      name: George Boole
      text: English mathematician, 1815 to 1864, first professor of mathematics at Queen's College Cork. He built an algebra of logic that became the basis of digital circuits, and died of pneumonia at Ballintemple.
    bose_calcutta:
      name: Jagadish Chandra Bose
      text: Indian physicist and biologist, 1858 to 1937, working in Calcutta. He produced and detected millimetre radio waves, and later measured the responses of plants with sensitive instruments.
    brahmagupta_bhillamala:
      name: Brahmagupta
      text: Indian mathematician and astronomer, 598 to about 668. His 628 work treats zero as a number with rules for arithmetic with it and with negative numbers, and gives methods for solving quadratic equations.
    buchner_zurich:
      name: Georg Büchner
      text: German writer and revolutionary, 1813 to 1837. He wrote the plays Danton's Death and Woyzeck, and fled to Zurich after publishing a pamphlet calling for revolt. He died there at twenty-three.
    buddha_sarnath:
      name: Siddhartha Gautama
      text: Siddhartha Gautama, the Buddha, who lived in northern India around the fifth century BC. After years of seeking, he is said to have reached awakening at Bodh Gaya and to have given his first teaching at Sarnath on suffering and the way beyond it.
    budj_bim_eels:
      name: The Gunditjmara people
      text: The Gunditjmara people of south western Victoria. Over thousands of years they built channels, weirs and ponds from volcanic stone at Budj Bim to trap and keep eels, one of the oldest known aquaculture systems.
    cajal_barcelona:
      name: Santiago Ramón y Cajal
      text: Spanish neuroscientist, 1852 to 1934. His observations of silver-stained tissue supported the idea that the nervous system is made up of distinct cells. He taught in Barcelona from 1887 to 1892 and shared the 1906 Nobel Prize with Camillo Golgi, whose staining method he had adapted.
    camille_claudel_paris:
      name: Camille Claudel
      text: French sculptor, 1864 to 1943. She worked in Rodin's studio and made works such as The Waltz and The Mature Age. In 1913 her family had her committed to an asylum, where she spent her last thirty years.
    cantor_halle:
      name: Georg Cantor
      text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression. He died in a clinic in Halle in January 1918.
    cao_xueqin_beijing:
      name: Cao Xueqin
      text: Qing novelist associated with Dream of the Red Chamber, also circulated under the title The Story of the Stone. Annotated manuscript copies and later printed editions preserve different states of the novel. A marginal note in the Jiaxu manuscript links his death with the unfinished book.
    chekhov_badenweiler:
      name: Anton Chekhov
      text: Russian writer and physician, 1860 to 1904. He wrote short stories and the plays The Seagull, Uncle Vanya, Three Sisters and The Cherry Orchard. He died of tuberculosis at the spa of Badenweiler.
    copernicus_frombork:
      name: Nicolaus Copernicus
      text: Polish astronomer and canon, 1473 to 1543, who worked at Frombork. His book On the Revolutions of the Heavenly Spheres, printed in 1543, put the sun at the centre of the planets. His friend Tiedemann Giese wrote that the printed book reached him only on the day he died.
    curie_paris:
      name: Marie Curie
      text: Polish born physicist and chemist, 1867 to 1934, who worked in Paris. With Pierre Curie she studied radioactivity and discovered polonium and radium in 1898. She received the Nobel Prize in Physics in 1903 and in Chemistry in 1911, and died of an illness linked to radiation.
    dante_ravenna:
      name: Dante Alighieri
      text: Italian poet, 1265 to 1321, from Florence. Exiled from his city in 1302, he wrote the Divine Comedy in the Tuscan language and died at Ravenna, where he is buried.
    darwin_galapagos:
      name: Charles Darwin
      text: English naturalist, 1809 to 1882. On the voyage of the Beagle he visited the Galapagos Islands in 1835 and observed how related species differ from island to island. His book On the Origin of Species, published in 1859, set out evolution by natural selection.
    democritus_abdera:
      name: Democritus
      text: Greek philosopher of Abdera, born about 460 BCE. Aristotle links him with Leucippus in his account of the full and the void. Democritus’s work survives in fragments and later reports.
    descartes_leiden:
      name: René Descartes
      text: French philosopher and mathematician, 1596 to 1650, who lived much of his life in the Dutch Republic. His 1637 Discourse on Method contains the phrase I think, therefore I am, and its appendix on geometry introduced coordinates.
    dickinson_amherst:
      name: Emily Dickinson
      text: American poet, 1830 to 1886, who lived most of her life in Amherst, Massachusetts. She wrote nearly eighteen hundred poems, kept many in handmade booklets, and published only a handful in her lifetime.
    du_chatelet_luneville:
      name: Émilie du Châtelet
      text: French mathematician and physicist, 1706 to 1749. She translated Newton's Principia into French with a commentary and argued that the energy of a moving body depends on the square of its speed. She died after childbirth at Lunéville.
    du_fu_xiang_river:
      name: Du Fu
      text: Chinese poet of the Tang, 712 to 770. He wrote about war, famine and ordinary lives. Yuan Zhen’s epitaph says he died away from home and was placed in temporary burial at Yueyang.
    edison_menlo_park:
      name: Thomas Edison
      text: American inventor, 1847 to 1931. At his laboratory in Menlo Park he led a team that developed a durable electric light bulb in 1879 and a system of power supply, and held over a thousand patents.
    emily_bronte_haworth:
      name: Emily Brontë
      text: English novelist and poet, 1818 to 1848, who lived at the parsonage in Haworth. Her only novel, Wuthering Heights, appeared in 1847 under the name Ellis Bell. She died of tuberculosis a year later.
    empedocles_akragas:
      name: Empedocles
      text: Greek philosopher from Akragas in Sicily, about 494 BC to about 434 BC. He taught that all things are mixtures of four roots, earth, air, fire and water, moved by love and strife.
    enheduanna_ur:
      name: Enheduanna
      text: Daughter of Sargon of Akkad, who held high office at Ur around 2300 BC. Several early works in Sumerian are traditionally attributed to her; the attribution is debated, and the surviving copies are later.
    eratosthenes_alexandria:
      name: Eratosthenes
      text: Greek scholar, about 276 BC to about 194 BC, librarian at Alexandria. A later account credits him with estimating the Earth’s circumference from a comparison at Syene and Alexandria. Converting the answer to modern units depends on the length assigned to the stade.
    euclid_alexandria:
      name: Euclid
      text: Greek mathematician working in Alexandria around 300 BC. His Elements builds geometry from definitions, postulates and proofs and was a standard textbook for over two thousand years. Little is known of his life.
    fanny_mendelssohn_berlin:
      name: Fanny Mendelssohn Hensel
      text: German composer and pianist, 1805 to 1847, sister of Felix Mendelssohn. She wrote hundreds of works, including songs and piano pieces, but her family discouraged publication. She died of a stroke in Berlin while rehearsing.
    faraday_london:
      name: Michael Faraday
      text: English scientist, 1791 to 1867, who began as a bookbinder's apprentice. In 1831 at the Royal Institution in London he discovered electromagnetic induction, and he also laid the foundations of electrochemistry.
    fibonacci_pisa:
      name: Fibonacci
      text: Italian mathematician, about 1170 to about 1250, from Pisa. His 1202 Book of Calculation brought the Hindu Arabic numerals to Europe and contains the problem of the rabbits that gives the Fibonacci sequence.
    finlay_havana:
      name: Carlos Finlay
      text: Cuban physician, 1833 to 1915. In 1881 he proposed that yellow fever is carried by a mosquito, an idea confirmed in 1900 by the Reed commission and the basis of the campaign against the disease.
    franklin_philadelphia:
      name: Benjamin Franklin
      text: American printer, writer and scientist, 1706 to 1790, of Philadelphia. His experiments on electricity in the 1740s and 1750s led to the lightning rod, and he took part in drafting the Declaration of Independence.
    freud_vienna:
      name: Sigmund Freud
      text: Austrian physician, 1856 to 1939, founder of psychoanalysis. His 1899 book The Interpretation of Dreams proposed that dreams express hidden wishes. He left Vienna for London in 1938 after the German annexation.
    galen_rome:
      name: Galen
      text: Greek physician from Pergamum, born in 129, who later practised in Rome. His many writings include works on anatomy and medicine and an account of his losses in the fire of 192.
    galileo_padua:
      name: Galileo Galilei
      text: Italian scientist, 1564 to 1642, who taught at Padua. With his telescope he saw the moons of Jupiter and the phases of Venus, published in 1610. He was later tried by the Inquisition and spent his last years under house arrest.
    galois_paris:
      name: Évariste Galois
      text: French mathematician, 1811 to 1832. As a teenager he found the conditions under which an equation can be solved by radicals and started group theory. He died at twenty after a duel in Paris.
    gaudi_barcelona:
      name: Antoni Gaudí
      text: Catalan architect, 1852 to 1926. His buildings in Barcelona, including Casa Batlló and Casa Milà, use curved forms taken from nature. He was killed by a tram in 1926, and his largest building remains unfinished.
    ghalib_delhi:
      name: Mirza Ghalib
      text: Poet of Delhi, 1797 to 1869, who wrote in Urdu and Persian. His ghazals are among the best loved in the language. He lived through the revolt of 1857 and spent his later years in debt.
    giotto_padua:
      name: Giotto
      text: Italian painter, about 1267 to 1337. His frescoes in the Scrovegni Chapel in Padua, painted around 1305, show figures with weight and emotion and are seen as a step toward Renaissance painting.
    great_zimbabwe:
      name: The builders of Great Zimbabwe
      text: The builders of Great Zimbabwe, a stone city of the Shona speaking peoples that flourished from about the eleventh to the fifteenth century.
    gutenberg_mainz:
      name: Johannes Gutenberg
      text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
    hammurabi_babylon:
      name: Hammurabi
      text: King of Babylon, who reigned from about 1792 BC to about 1750 BC. A stele inscribed with nearly three hundred laws, setting penalties and rules for trade, family and property, is named after him.
    heo_nanseolheon_hanyang:
      name: Heo Nanseolheon
      text: Korean poet of Joseon, 1563 to 1589. She wrote in classical Chinese. Her brother Heo Gyun collected her work after her death.
    heron_alexandria:
      name: Heron
      text: Greek engineer working in Alexandria in the first century AD. He described the aeolipile, a steam driven turbine, automatic doors and a coin operated dispenser, and wrote on geometry and the measuring of land.
    hertz_bonn:
      name: Heinrich Hertz
      text: German physicist, 1857 to 1894. In 1887 and 1888 he generated and detected radio waves, confirming Maxwell's theory of electromagnetism. The unit of frequency is named after him, and he died young in Bonn.
    higuchi_ichiyo_tokyo:
      name: Higuchi Ichiyo
      text: Japanese writer, 1872 to 1896. She supported her family by writing and published her best known stories, including Takekurabe, in the mid 1890s about the lives of poor townspeople. She died of tuberculosis at twenty four.
    hildegard_bingen:
      name: Hildegard of Bingen
      text: German abbess, 1098 to 1179, at Bingen on the Rhine. She wrote visionary theology, books on medicine and natural history, and composed a large body of chant, among the largest surviving by one medieval composer.
    hipparchus_rhodes:
      name: Hipparchus
      text: Greek astronomer, about 190 BC to about 120 BC, who observed from Rhodes. He compiled a star catalogue, discovered the precession of the equinoxes and developed trigonometry for astronomy.
    hippocrates_kos:
      name: Hippocrates
      text: Greek physician from the island of Kos, about 460 BC to about 370 BC. The collection of medical writings under his name treats disease as natural rather than divine and stresses careful observation of the patient.
    hokusai_edo:
      name: Katsushika Hokusai
      text: Japanese artist, 1760 to 1849, of Edo. His series Thirty Six Views of Mount Fuji, published from 1831, includes The Great Wave off Kanagawa. He changed his name many times and kept working into old age.
    hooke_london:
      name: Robert Hooke
      text: English scientist, 1635 to 1703. As curator of experiments at the Royal Society he published Micrographia in 1665, which showed the cell structure of cork, and formulated the law of elasticity named after him.
    house_of_wisdom:
      name: Al-Khwarizmi and the House of Wisdom
      text: The House of Wisdom was associated with Abbasid court book culture in Baghdad. The wider ninth-century translation movement also involved scholars and patrons working in several settings. Ḥunayn’s letter records the work of seeking out and comparing copies.
    hua_tuo_xuchang:
      name: Hua Tuo
      text: Physician of the late Han. A later biography in the Sanguozhi describes his medical work, attributes the Five Animals exercise to him, and recounts his confinement and death under Cao Cao.
    hypatia_alexandria:
      name: Hypatia
      text: Greek mathematician and philosopher, about 355 to 415, who taught in Alexandria. She commented on works of mathematics and astronomy. She was killed in March 415 in the unrest of the city.
    ibn_al_nafis_cairo:
      name: Ibn al-Nafis
      text: Thirteenth-century physician who studied in Damascus and worked in Cairo. His anatomical commentary on Ibn Sina’s Canon argues that blood travels from the right side of the heart through the lungs to the left.
    ibn_battuta_tangier:
      name: Ibn Battuta
      text: Moroccan traveller from Tangier, 1304 to about 1369. His Rihla, compiled after his return, describes journeys through North Africa, Arabia, India, China and West Africa over nearly three decades.
    ibn_khaldun_cairo:
      name: Ibn Khaldun
      text: Arab historian and statesman, 1332 to 1406, born in Tunis. His Muqaddima analyses the rise and fall of dynasties and the role of group solidarity, and is seen as an early work of social science. He died in Cairo.
    ibn_rushd_lucena:
      name: Ibn Rushd
      text: Andalusian philosopher and physician, 1126 to 1198, known in Latin as Averroes. He wrote commentaries on Aristotle that were widely read in Europe, served as judge in Córdoba and Seville, and in 1195 was banished to Lucena and had his works ordered burned.
    ibn_sina_hamadan:
      name: Ibn Sina
      text: Persian physician and philosopher, about 980 to 1037, known in Latin as Avicenna. His Canon of Medicine was a standard text in Europe and western Asia for centuries, and he died at Hamadan.
    ife_bronzes:
      name: The casters of Ife
      text: The casters of the Yoruba city of Ife, in present-day Nigeria, produced naturalistic heads in brass and copper. The British Museum dates one Wunmonije head to 1300–1450; neither its maker nor the person depicted is known by name.
    imhotep_saqqara:
      name: Imhotep
      text: Official and architect of the Third Dynasty of Egypt, around 2650 BC. He is credited with the step pyramid of King Djoser at Saqqara, among the first large stone buildings, and was later honoured as a god of medicine.
    jenner_berkeley:
      name: Edward Jenner
      text: English physician, 1749 to 1823, of Berkeley in Gloucestershire. In 1796 he inoculated a boy with cowpox and showed that it protected against smallpox, the beginning of vaccination.
    jianzhen_nara:
      name: Jianzhen
      text: Teacher from Yangzhou in Tang China, 688 to 763. Asked to Japan by Japanese visitors in 742, he failed five times to cross; after the fifth attempt he lost his sight on the way back. He sailed again in 753, reached Nara in 754 and taught there, and in 759 he founded a new place of study in Nara, where he died.
    kabir_maghar:
      name: Kabir
      text: North Indian devotional poet. The details of his life vary across traditions. Songs attributed to Kabir circulated widely, and some are preserved in the Guru Granth Sahib.
    kafka_kierling:
      name: Franz Kafka
      text: Writer of Prague who wrote in German, 1883 to 1924. He worked in an insurance office and left most of his work unpublished, asking a friend to burn it. Max Brod published The Trial and The Castle. He died of tuberculosis in a sanatorium at Kierling.
    kant_konigsberg:
      name: Immanuel Kant
      text: German philosopher, 1724 to 1804, who spent his life in Königsberg. His Critique of Pure Reason, published in 1781, examines what reason can know and its limits.
    keats_rome:
      name: John Keats
      text: English poet, 1795 to 1821. He published his main poems, including the odes, in a few years, and died of tuberculosis in Rome at twenty five.
    kepler_leonberg:
      name: Johannes Kepler
      text: German astronomer, 1571 to 1630. He formulated three laws of planetary motion from the observations of Tycho Brahe. From 1620 to 1621 he defended his mother Katharina, who had been accused by her neighbours in Leonberg and was held in prison at Güglingen, until she was released.
    knossos_linear_a:
      name: Minoan scribes
      text: The scribes of Minoan Crete, who kept records at Knossos around 1500 BC. Linear A, the script used for the Minoan language, has not been deciphered. Its successor, Linear B, was read in 1952 and writes Greek.
    lalibela_rock:
      name: Lalibela and the stonecutters
      text: Lalibela was an Ethiopian ruler of the Zagwe dynasty around the turn of the thirteenth century. The town that bears his name preserves eleven rock-cut buildings shaped over successive phases.
    lavoisier_paris:
      name: Antoine Lavoisier
      text: French chemist, 1743 to 1794. He showed the role of oxygen in burning, helped found the modern system of chemical names, and stated the conservation of mass. He was put to death in Paris in May 1794.
    leavitt_cambridge_ma:
      name: Henrietta Leavitt
      text: American astronomer, 1868 to 1921, who worked at Harvard College Observatory. She found that the period of a Cepheid variable star is tied to its brightness, which let astronomers measure distances to other galaxies.
    leeuwenhoek_delft:
      name: Antonie van Leeuwenhoek
      text: Dutch cloth merchant and microscopist, 1632 to 1723, of Delft. With single lens microscopes he made himself he saw bacteria, red blood cells and sperm, and described them in letters to the Royal Society.
    leonardo_florence:
      name: Leonardo da Vinci
      text: Italian painter and engineer, 1452 to 1519. He painted the Last Supper and the Mona Lisa, which he began in Florence around 1503, and filled thousands of notebook pages with studies of anatomy, water and machines.
    li_bai_changan:
      name: Li Bai
      text: Chinese poet of the Tang, 701 to 762. He wrote lyrical poems about wine, friendship and the moon and spent time at the court at Chang'an before leaving it. Many of his poems are still recited.
    li_qingzhao_hangzhou:
      name: Li Qingzhao
      text: Chinese poet of the Song, about 1084 to about 1155. She moved south after 1127, lost her husband in 1129, and wrote about the books and objects they had gathered together.
    li_shizhen_qizhou:
      name: Li Shizhen
      text: Chinese physician of the Ming, 1518 to 1593. After nearly three decades of work he completed the Compendium of Materia Medica, which describes about nineteen hundred substances, and which was printed after his death.
    lili_boulanger_paris:
      name: Lili Boulanger
      text: French composer, 1893 to 1918. In 1913 she became the first woman to win the Prix de Rome for composition. She had lifelong poor health and died at twenty four.
    lovelace_london:
      name: Ada Lovelace
      text: English mathematician, 1815 to 1852. In her notes to Menabrea's memoir, Ada Lovelace compared the Analytical Engine's patterns to the flowers and leaves woven on a Jacquard loom. Note G laid out a method for computing Bernoulli numbers on the proposed machine. The engine was not completed in her lifetime. She died in London on 27 November 1852, aged thirty-six.
    machu_picchu:
      name: The Inca builders
      text: The Inca builders of Machu Picchu, a royal estate on a ridge in the Andes built around 1450. The site was abandoned after the Spanish conquest and little known outside the region until 1911.
    mallory_everest:
      name: George Mallory
      text: English mountaineer, 1886 to 1924. On the 1924 British expedition he and Andrew Irvine disappeared high on Mount Everest. His body was found in 1999, and whether they reached the summit is still unknown.
    marconi_bologna:
      name: Guglielmo Marconi
      text: Italian inventor, 1874 to 1937, from Bologna. From 1895 he developed wireless telegraphy, sent a signal across the Atlantic in 1901, and shared the 1909 Nobel Prize in Physics.
    mary_anning_lyme_regis:
      name: Mary Anning
      text: English fossil collector, 1799 to 1847, of Lyme Regis. From the sea cliffs she dug out the first complete ichthyosaur and plesiosaur skeletons. As a woman of modest means she was seldom credited in scientific papers during her life.
    maya_codices_mani:
      name: Maya scribes
      text: Maya scribes in Yucatán made folding books of bark paper. At Maní in July 1562 a great many of these books were burned. A few surviving manuscripts, such as the Dresden Codex and the Códice Maya de México, preserve the book tradition.
    maya_venus_tables:
      name: The Maya scribes
      text: The Maya scribes of the classic and later periods, who tracked the cycles of Venus, the moon and eclipses. The Dresden Codex contains a table of the 584 day cycle of Venus with only small error.
    mendel_brno:
      name: Gregor Mendel
      text: Czech Austrian friar and scientist, 1822 to 1884, of Brno. Crossing pea plants in the monastery garden he found that traits are inherited in fixed ratios, work published in 1866 and noticed only around 1900.
    mendeleev_petersburg:
      name: Dmitri Mendeleev
      text: Russian chemist, 1834 to 1907. In 1869 in St Petersburg he published a periodic table that arranged the elements by atomic weight and left gaps for elements not yet found. He died in St Petersburg on 2 February 1907.
    meroitic_meroe:
      name: Meroitic scribes
      text: The scribes of the kingdom of Meroe on the Nile in what is now Sudan. They wrote in the Meroitic script, used from about the second century BC, which can be read aloud but whose language is still largely not understood.
    miyazawa_kenji_hanamaki:
      name: Miyazawa Kenji
      text: Japanese poet and writer of children's stories, 1896 to 1933, from Hanamaki. He taught agriculture, worked to help poor farmers, and wrote Night on the Galactic Railroad. Most of his work was published after his death.
    modigliani_paris:
      name: Amedeo Modigliani
      text: Italian painter and sculptor, 1884 to 1920, who worked in Paris. He painted portraits and nudes with long necks and almond eyes, sold little during his life, and died of tubercular meningitis at thirty five.
    mohenjo_daro_indus:
      name: Indus people
      text: The people of the Indus Valley civilisation, who built cities such as Mohenjo-daro around 2500 BC with regular streets, drains and brick houses. They left seals with a script that has not been deciphered.
    morse_washington:
      name: Samuel Morse
      text: American painter and inventor, 1791 to 1872. Working with Alfred Vail he developed an electric telegraph and a code of dots and dashes. On 24 May 1844 he sent the message What hath God wrought from Washington to Baltimore.
    mozart:
      name: Wolfgang Amadeus Mozart
      text: Austrian composer, 1756 to 1791. A child prodigy, he wrote operas, symphonies and concertos. His Don Giovanni had its first performance in Prague in 1787, and he left his Requiem unfinished when he died in Vienna in 1791.
    murasaki_kyoto:
      name: Murasaki Shikibu
      text: Japanese court lady and writer of the Heian period, born about 973. Her Tale of Genji, written in the early eleventh century, is often called the first novel. Her diary describes life at the court in Kyoto.
    nalanda_library:
      name: The monks of Nalanda
      text: Nalanda was a Buddhist centre of learning in Bihar, with residential and teaching buildings. Travellers came to study from across Asia. Dharmasvāmin’s biography describes study there in the thirteenth century.
    newton_cambridge:
      name: Isaac Newton
      text: English mathematician and physicist, 1643 to 1727, of Cambridge. His Principia of 1687 set out the laws of motion and universal gravitation. He also worked on optics and developed calculus, and later led the Royal Mint.
    nezahualcoyotl_texcoco:
      name: Nezahualcoyotl
      text: Ruler of Texcoco, traditionally dated to 1402–1472. Later Nahuatl collections associate songs with his name. The wording inside a song and the attribution outside it can tell different parts of its history.
    nietzsche_turin:
      name: Friedrich Nietzsche
      text: German philosopher (1844–1900), author of Thus Spoke Zarathustra and Beyond Good and Evil. He fell seriously ill in Turin in January 1889. His friend Franz Overbeck accompanied him back to Basel. Nietzsche spent his later years in the care of family.
    nightingale_scutari:
      name: Florence Nightingale
      text: English nurse and statistician, 1820 to 1910. In 1854 she led nurses to the British military hospital at Scutari during the Crimean War, improved sanitation, and used charts to show that disease killed more soldiers than wounds.
    noether_gottingen:
      name: Emmy Noether
      text: German mathematician, 1882 to 1935. At Göttingen she showed how continuous symmetries of an action lead to conservation laws, and she shaped modern abstract algebra. She lost her post in 1933 and emigrated to the United States.
    omar_khayyam_nishapur:
      name: Omar Khayyam
      text: Persian mathematician, astronomer and poet, 1048 to 1131, of Nishapur. He classified and solved cubic equations geometrically, helped reform the calendar, and is known in English for the quatrains of the Rubaiyat.
    ovid_tomis:
      name: Ovid
      text: Roman poet, 43 BC to about AD 17. He wrote the Metamorphoses and love poetry. In AD 8 the emperor Augustus banished him to Tomis on the Black Sea, where he died.
    pasteur_paris:
      name: Louis Pasteur
      text: French chemist and microbiologist, 1822 to 1895. He studied fermentation and spoilage and developed pasteurisation. Two of his daughters died of typhoid fever, Jeanne in 1859 and Cécile in 1866. In 1885 his team vaccinated Joseph Meister against rabies after a dog bite.
    plato_academy:
      name: Plato
      text: Greek philosopher, about 428 BC to about 348 BC, student of Socrates. He founded the Academy in Athens and wrote dialogues on justice, knowledge and the soul, with Socrates as the main speaker.
    pliny_stabiae:
      name: Pliny the Elder
      text: Roman author and naval commander, AD 23 to 79. His Natural History collected knowledge in thirty seven books. He died near Stabiae while trying to rescue people during the eruption of Vesuvius.
    poe_baltimore:
      name: Edgar Allan Poe
      text: American writer, 1809 to 1849. He wrote tales of horror and detection, including The Raven and The Murders in the Rue Morgue, and was found disoriented in Baltimore days before he died. The cause of his death is unknown.
    puccini_brussels:
      name: Giacomo Puccini
      text: Italian composer (1858–1924) of La Bohème, Tosca and Madama Butterfly. He died in Brussels while receiving treatment for throat cancer. His last opera, Turandot, remained unfinished.
    pushkin_st_petersburg:
      name: Alexander Pushkin
      text: Russian poet, 1799 to 1837, often regarded as the founder of modern Russian literature. He wrote Eugene Onegin in verse. In 1837 he was wounded in a duel in St Petersburg and died two days later.
    pythagoras_croton:
      name: Pythagoras
      text: Greek thinker from Samos, traditionally dated to about 570–495 BCE and associated with a community at Croton. Aristotle writes of the Pythagoreans as a group that related musical intervals to numerical ratios.
    qu_yuan_miluo:
      name: Qu Yuan
      text: Poet and minister of the state of Chu. His long poem Li Sao is a foundational work of Chinese poetry. The Records of the Grand Historian place his death at the Miluo River. His birth and death years are debated.
    ramanujan_madras:
      name: Srinivasa Ramanujan
      text: Indian mathematician, 1887 to 1920. Born in Erode and raised mostly in Kumbakonam, he pursued much of his mathematics independently. While working as a clerk in Madras, he sent his results to G. H. Hardy in 1913. At Cambridge he continued his work on number theory and series.
    rembrandt_amsterdam:
      name: Rembrandt van Rijn
      text: Dutch painter and etcher, 1606 to 1669. He painted portraits and story scenes with strong light, including The Night Watch. He went bankrupt in 1656 and spent his last years in Amsterdam in debt.
    riemann_selasca:
      name: Bernhard Riemann
      text: German mathematician, 1826 to 1866. His work on geometry of curved spaces and on the distribution of primes opened major fields, and the Riemann hypothesis remains unsolved. He died of tuberculosis at Selasca on Lake Maggiore.
    rongorongo_rapa_nui:
      name: Rapa Nui people
      text: The people of Rapa Nui developed a tradition of carving roŋoroŋo signs in wood. Nineteenth-century upheavals disrupted the transmission of that knowledge. The surviving objects, Rapa Nui oral knowledge and attempts at scholarly decipherment tell different parts of its history.
    rumi_konya:
      name: Rumi
      text: Persian poet and teacher, 1207 to 1273, who lived in Konya. His Masnavi and lyric poems are among the most read works of Sufi literature, and followers founded the Mevlevi order.
    sappho_lesbos:
      name: Sappho
      text: Greek poet of Lesbos, active around 600 BC. She wrote lyric poems on desire and loss, collected in nine books in antiquity, of which only one complete poem and fragments survive.
    savitribai_phule_pune:
      name: Savitribai Phule
      text: Indian teacher and poet, 1831 to 1897. With her husband Jyotirao Phule she opened a school for girls in Pune in 1848, faced hostility for it, and later opened a home for widows and cared for plague patients.
    schubert_vienna:
      name: Franz Schubert
      text: Austrian composer, 1797 to 1828, born in Vienna. He wrote more than six hundred songs, symphonies and chamber music, little of which was published or performed widely in his lifetime. He died at thirty one.
    schumann_endenich:
      name: Robert Schumann
      text: German composer and music writer (1810–1856). His works include Papillons, Album for the Young and the Spring Symphony. He spent his last years at a private clinic in Endenich near Bonn. His wife Clara Schumann was a concert pianist and composer.
    scott_last_camp:
      name: Robert Falcon Scott
      text: British naval officer and explorer, 1868 to 1912. He led the Terra Nova expedition to the South Pole, reached it in January 1912 to find that Roald Amundsen had arrived first, and died with his companions on the return across the Ross Ice Shelf.
    sei_shonagon_kyoto:
      name: Sei Shonagon
      text: Japanese court lady of the Heian period, born about 966. Her Pillow Book collects lists, observations and anecdotes of life at the court in Kyoto, written in a sharp and witty voice.
    sejong_hangul:
      name: King Sejong and the scholars
      text: King of Joseon, 1397 to 1450. With scholars of the Hall of Worthies he had a new alphabet devised for Korean, promulgated in 1446 as Hunminjeongeum, so that ordinary people could learn to read.
    sequoyah_syllabary:
      name: Sequoyah
      text: Cherokee silversmith, about 1770 to 1843. Without being able to read English, he devised a syllabary of some eighty signs for Cherokee, finished in 1821.
    shakespeare_globe:
      name: William Shakespeare
      text: English playwright and poet, 1564 to 1616. He wrote about thirty seven plays, among them Hamlet and Macbeth, for companies that performed at the Globe Theatre in London, which opened in 1599, and also wrote sonnets.
    sima_qian_changan:
      name: Sima Qian
      text: Chinese historian of the Han, about 145 BC to about 86 BC. After he defended a general before the emperor he was punished by castration, and he finished the Records of the Grand Historian, a history from legendary times to his own day.
    smith_kirkcaldy:
      name: Adam Smith
      text: Scottish philosopher and economist, 1723 to 1790, born in Kirkcaldy. His The Wealth of Nations, published in 1776, argued that the division of labour and free exchange raise a country's wealth. He also wrote The Theory of Moral Sentiments. He was a close friend of David Hume, and after Hume's death in 1776 wrote the account of his last months that was printed with Hume's own short life.
    socrates_athens:
      name: Socrates
      text: Greek philosopher of Athens, 470 BC to 399 BC. He wrote nothing himself, and is known through Plato and Xenophon. He questioned fellow citizens about virtue, was tried on charges of impiety and corrupting the young, and died by drinking hemlock.
    song_yingxing_fengxin:
      name: Song Yingxing
      text: Chinese scholar of the late Ming, 1587 to about 1666. He wrote The Exploitation of the Works of Nature, printed in 1637, which describes farming, textiles, metallurgy and many crafts in detail.
    sophie_germain_paris:
      name: Sophie Germain
      text: French mathematician, 1776 to 1831. Barred from the university, she studied from books and corresponded under a man's name. She made progress on Fermat's Last Theorem and won a prize of the Academy for her work on vibrating plates.
    sor_juana_mexico_city:
      name: Sor Juana Inés de la Cruz
      text: Mexican nun, poet and scholar, 1648 or 1651 to 1695. In the convent in Mexico City she collected a large library and wrote poems and plays. Her 1691 reply to a bishop defended women's right to study, and she later gave up her books under pressure.
    su_shi_huangzhou:
      name: Su Shi
      text: Chinese poet, calligrapher and official of the Song, 1037 to 1101. Exiled to Huangzhou in 1080 after a political case, he farmed a plot of land and wrote some of his best known poems and prose.
    tagore_santiniketan:
      name: Rabindranath Tagore
      text: Bengali poet and educator, 1861 to 1941. He wrote poems, songs, plays and novels, founded a school at Santiniketan, and in 1913 became the first non European to receive the Nobel Prize in Literature.
    tang_xianzu_linchuan:
      name: Tang Xianzu
      text: Chinese playwright of the Ming, 1550 to 1616. He retired to Linchuan in 1598 and dated the preface to The Peony Pavilion to that autumn. The play follows Du Liniang from a meeting in a dream to a search for the man she met there.
    taqi_al_din_istanbul:
      name: Taqi al-Din
      text: Ottoman scholar and astronomer, 1526 to 1585. In the 1570s he built an observatory in Istanbul with large instruments, and wrote on clocks and mechanics. The observatory was demolished in 1580.
    tenochtitlan_lake:
      name: The Mexica builders
      text: The Mexica developed Tenochtitlan on an island in Lake Texcoco. Its founding is conventionally dated to 1325. The city had causeways, canals and aqueducts. Chinampas in the wider basin were raised cultivation beds separated by canals.
    terence_rome:
      name: Terence
      text: Roman playwright, about 195 BC to about 159 BC. Said to have been brought to Rome as an enslaved man from North Africa, he wrote six comedies adapted from Greek plays, all of which survive.
    tesla_wardenclyffe:
      name: Nikola Tesla
      text: Serbian American inventor, 1856 to 1943. He developed alternating current systems and the induction motor. In 1901 he began a large tower at Wardenclyffe on Long Island for wireless transmission, and the project ran out of funds.
    thales_miletus:
      name: Thales
      text: Early Greek thinker from Miletus, traditionally dated to about 624–546 BCE. Later writers associated him with natural explanations. Herodotus credits him with predicting the year of a daylight darkening often identified with the eclipse of 585 BCE.
    timbuktu_sankore:
      name: The scholars of Timbuktu
      text: After Timbuktu changed hands around 1468, scholars left the city for places including Walata.
    tupaia_tahiti:
      name: Tupaia
      text: Navigator from Raiatea, about 1725 to 1770. In 1769 he joined James Cook's ship at Tahiti and helped draw a chart of the Pacific islands from memory. He died of illness at Batavia.
    ulugh_beg_samarkand:
      name: Ulugh Beg
      text: Timurid ruler and astronomer, 1394 to 1449. At Samarkand he built a large observatory and produced a star catalogue of high accuracy. He was killed near Samarkand in late October 1449.
    van_gogh_auvers:
      name: Vincent van Gogh
      text: Dutch painter, 1853 to 1890. He painted for only about a decade, producing more than two thousand works, and sold few. He spent his last weeks at Auvers sur Oise and died of a gunshot wound in July 1890.
    vermeer_delft:
      name: Johannes Vermeer
      text: Dutch painter, 1632 to 1675, of Delft. He painted quiet interior scenes with soft light, such as Girl with a Pearl Earring, produced only some forty works that survive, and left his family in debt.
    vesalius_padua:
      name: Andreas Vesalius
      text: Flemish anatomist, 1514 to 1564, who taught at Padua. His 1543 book On the Fabric of the Human Body, with detailed illustrations from his own dissections, corrected many of Galen's claims.
    wallace_ternate:
      name: Alfred Russel Wallace
      text: British naturalist born in Wales, 1823 to 1913. During his travels in the Malay Archipelago he developed an account of natural selection independently of Charles Darwin. Wallace’s essay and Darwin’s writings were presented together in 1858. Wallace also described a marked change in the distribution of animals across the archipelago; the boundary is now known as Wallace’s Line.
    wang_zhenyi_jinling:
      name: Wang Zhenyi
      text: Chinese astronomer and mathematician of the Qing, 1768 to 1797. She explained eclipses with a model of a lamp, a mirror and a round table, wrote on mathematics, and died at twenty nine.
    wegener_greenland:
      name: Alfred Wegener
      text: German scientist, 1880 to 1930. In 1912 he proposed that the continents drift across the Earth's surface, an idea that was rejected for decades. He died on the Greenland ice cap during an expedition in 1930.
    wright_kitty_hawk:
      name: Orville and Wilbur Wright
      text: Wilbur Wright (1867–1912) and Orville Wright (1871–1948) ran a bicycle shop in Dayton, Ohio, and tested their aircraft designs with gliders and a wind tunnel. At Kill Devil Hills, near Kitty Hawk, they made four powered flights on 17 December 1903. Orville piloted the first and Wilbur the last. Their telegram home put the longest flight at 57 seconds; it lasted 59.
    xu_xiake_lijiang:
      name: Xu Xiake
      text: Chinese traveller of the Ming, 1587 to 1641. For some thirty years he walked through the mountains and caves of China, and his notes were edited into the Travels of Xu Xiake, with careful descriptions of karst landscapes.
    zhu_shijie_yangzhou:
      name: Zhu Shijie
      text: Chinese mathematician of the Yuan, active around 1300. His Jade Mirror of the Four Unknowns of 1303 solves systems of polynomial equations with up to four unknowns by a method like the modern treatment of matrices.
    qin_jiushao_huzhou:
      name: Qin Jiushao
      text: Mathematician of the Southern Song, born about 1202, died about 1261. In 1247 he completed the Mathematical Treatise in Nine Sections, whose method of the great extension solves systems of linear congruences, later called the Chinese remainder theorem.
    al_biruni_ghazna:
      name: Al-Biruni
      text: Scholar of Central Asia, born 973, died after about 1050. He worked in astronomy, mathematics, geography and several languages, estimated the radius of the earth from the height of a mountain and the dip of the horizon, and wrote a detailed account of India.
    al_razi_rayy:
      name: Al-Razi
      text: Persian physician, born about 865, died in 925. He practised in Rayy and Baghdad, left many case records, and in one treatise distinguished smallpox from measles.
    sushruta_varanasi:
      name: Sushruta
      text: Physician of ancient India, traditionally credited as the author of the Sushruta Samhita, which covers surgery, instruments and plastic repair. His dates, and whether he was one person, are disputed.
    borobudur_java:
      name: The builders of Borobudur
      text: The craftsmen and labourers who built Borobudur in central Java in the 8th and 9th centuries, whose names are not recorded. The exact span of the building is given differently by different accounts.
    zeami_sado:
      name: Zeami
      text: Japanese Noh actor and playwright, born about 1363, died about 1443. He left several treatises on Noh and was exiled to Sado Island in 1434.
    ino_tadataka_ezo:
      name: Ino Tadataka
      text: Japanese surveyor, born 1745, died 1818. He took up astronomy and surveying after fifty, from 1800 walked the coasts of Japan, and led the making of an accurate map of the country.
    djenne_builders:
      name: The mud brick builders of Djenne
      text: The builders of Djenné in West Africa developed traditions of earthen construction and maintenance. The present Great Mosque was rebuilt in 1907, and its earthen surfaces are renewed by the local community.
    ahmes_thebes:
      name: Ahmes
      text: Scribe of ancient Egypt who, in about the 16th century BC around Thebes, copied what is now called the Rhind papyrus, one of the most important surviving texts of Egyptian mathematics.
    quipu_cusco:
      name: The keepers of the knotted cords
      text: The record keepers of the Inca world who noted numbers on knotted cords. Much about how the knots were read is still unknown, and only what is known is written here.
    humboldt_chimborazo:
      name: Alexander von Humboldt
      text: German naturalist and explorer, born 1769, died 1859. In 1802 he climbed Chimborazo in Ecuador to about 5,600 metres and recorded how height relates to vegetation and climate.
    banneker_maryland:
      name: Benjamin Banneker
      text: Self taught American astronomer and farmer, born 1731, died 1806. In 1791 he helped survey the site of Washington, and from 1792 he published almanacs.
    seacole_balaklava:
      name: Mary Seacole
      text: Nurse and businesswoman born in Jamaica, 1805 to 1881. After being refused as an army nurse she went to the Crimea at her own cost and tended the sick and wounded behind the lines.
    mitchell_nantucket:
      name: Maria Mitchell
      text: American astronomer, born 1818, died 1889. She discovered a comet in 1847 and later became one of the first women to teach astronomy as a professor in the United States.
    caroline_herschel_slough:
      name: Caroline Herschel
      text: British astronomer born in Germany, 1750 to 1848. The sister of the astronomer William Herschel, she found her first comet in 1786 and several more later.
    kovalevskaya_stockholm:
      name: Sofia Kovalevskaya
      text: Russian mathematician, born 1850, died 1891. She was a professor in Stockholm, and in 1888 won a prize of the French Academy of Sciences for her work on the rotation of a rigid body.
    chaco_sun_watchers:
      name: The people of Chaco Canyon
      text: Ancestral communities built the great houses of Chaco Canyon. At Fajada Butte, researchers documented patterns of light on rock markings. The canyon remains an ancestral and sacred place to Pueblo peoples and other nations.
    rapa_nui_moai:
      name: The Rapa Nui carvers
      text: The Rapa Nui people who carved and raised the moai, mostly between the thirteenth and sixteenth centuries. Their descendants live on the island and care for the park that holds the quarry.
    hargrave_stanwell_park:
      name: Lawrence Hargrave
      text: Engineer and inventor born in England, 1850 to 1915, who lived in Australia. He invented the box kite and published his work on flight.
    sun_yat_sen_guangzhou:
      name: Sun Yat-sen
      text: Chinese revolutionary and political leader, 1866 to 1925. On 4 February 1924 he ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it. In the same year he opened the Army Officer School at Whampoa, one military school beside the civil one. From 27 January to 24 August 1924 he lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all, which were taken down, revised and printed. Classes began on 19 September, and he wrote the motto used at the founding ceremony on 11 November. He reached Beijing on 31 December 1924, was operated on for cancer on 26 January 1925, and died there on 12 March 1925. On 17 August 1926 the National Government ordered the university renamed National Sun Yat-sen University.
    zhuge_liang:
      name: Zhuge Liang
      text: Chancellor of Shu Han. Chen Shou records his last campaign at Wuzhang Plains and his death with the army. The biography of Jiang Wan records the private recommendation and the appointment that followed.
    qin_liangyu_shizhu:
      name: Qin Liangyu
      text: A late Ming commander from Zhongzhou who took up Ma Qiancheng's office in Shizhu. Her biography in the History of Ming describes the troops called the White Pole Soldiers and records her use of family funds in 1630.
    david_fleay_healesville:
      name: David Fleay
      text: David Fleay (1907–1993) was an Australian naturalist. As director of the sanctuary at Healesville, he led the first successful breeding of a platypus in captivity and documented the young animal’s development in The Victorian Naturalist.
    pappus_alexandria:
      name: Pappus of Alexandria
      text: Greek mathematician of Alexandria, active about AD 320. His Collection, in eight books, gathers and comments on the work of earlier geometers, and much of what is known of lost works such as the Porisms of Euclid comes from it.
    cleomedes:
      name: Cleomedes
      text: Greek writer on astronomy, whose dates are uncertain; he is usually placed between the first century BC and the fourth century AD. His handbook On the Circular Motions of the Celestial Bodies gives the best known account of how Eratosthenes measured the Earth, and says that the original method was more involved.
    giovanni_del_virgilio:
      name: Giovanni del Virgilio
      text: Italian scholar and poet of Bologna, active in the early fourteenth century, who lectured there on the Latin poets. About 1319 he wrote to Dante in Latin verse, and their exchange of eclogues began the revival of Latin pastoral poetry.
    tiedemann_giese:
      name: Tiedemann Giese
      text: Churchman of Royal Prussia, 1480 to 1550, born in Danzig, and the closest friend of Copernicus. He urged Copernicus to publish, wrote about his last days, and after his death protested against the unsigned preface of the printed book.
    georg_joachim_rheticus:
      name: Georg Joachim Rheticus
      text: Mathematician from Wittenberg, 1514 to 1574, the only pupil of Copernicus. He came to Frombork in 1539, wrote the first published account of the new system, the Narratio prima of 1540, and took the manuscript of De revolutionibus to the printer in Nuremberg.
    david_hume:
      name: David Hume
      text: Scottish philosopher and historian, 1711 to 1776, born in Edinburgh, and the closest friend of Adam Smith. In his will of 1776 he named Smith his literary executor, and in a codicil of 7 August left his Dialogues Concerning Natural Religion to the printer William Strahan. He died in Edinburgh on 25 August 1776; the Dialogues came out in 1779.
    william_strahan:
      name: William Strahan
      text: Scottish printer and publisher in London, 1715 to 1785, born in Edinburgh. He published the Wealth of Nations with Thomas Cadell and was a friend of both Hume and Smith. Hume left him the Dialogues Concerning Natural Religion in 1776; in the end he did not print them.
    charles_babbage:
      name: Charles Babbage
      text: English mathematician and inventor, 1791 to 1871, who designed the Difference Engine and the Analytical Engine, a general calculating machine to be worked by punched cards. Neither was finished in his lifetime. Ada Lovelace translated an account of the Analytical Engine in 1843 and added her own Notes.
    nikolai_menshutkin:
      name: Nikolai Menshutkin
      text: Russian chemist, 1842 to 1907, professor at the University of St Petersburg and an editor of the journal of the Russian Chemical Society. On 18 March 1869 he read Mendeleev's paper on the system of the elements to the society in the author's absence. The reaction that turns an amine into a quaternary ammonium salt carries his name.
    pierre_curie:
      name: Pierre Curie
      text: French physicist, 1859 to 1906, who taught at the School of Industrial Physics and Chemistry in Paris. With his brother Jacques he discovered piezoelectricity, and with Marie Curie he studied radioactivity and announced polonium and radium in 1898. He shared the Nobel Prize in Physics in 1903 and died in a street accident in Paris on 19 April 1906.
    auguste_chevalier:
      name: Auguste Chevalier
      text: French friend of Évariste Galois from the École normale. Galois wrote his last letter, of 29 May 1832, to him, and in September 1832 Chevalier printed it in the Revue encyclopédique with a notice on his friend. He kept the papers of Galois, which reached Joseph Liouville and were published in 1846.
    joseph_liouville:
      name: Joseph Liouville
      text: French mathematician, 1809 to 1882. In 1836 he founded the Journal de mathématiques pures et appliquées, and in 1846 he published there the mathematical papers of Évariste Galois, fourteen years after Galois died.
    august_crelle:
      name: August Leopold Crelle
      text: German civil engineer and mathematician, 1780 to 1855. In 1826 he founded in Berlin the Journal für die reine und angewandte Mathematik, whose first volumes printed many papers of Niels Henrik Abel. He worked for a post for Abel in Berlin, and on 8 April 1829, not knowing that Abel had died two days before, wrote that it was secured.
    richard_dedekind:
      name: Richard Dedekind
      text: German mathematician, 1831 to 1916, who studied at Göttingen and was a friend of Bernhard Riemann. He wrote the account of the last weeks of Riemann at Selasca in 1866, and took part in editing the collected works of Riemann, published in 1876.
    alexis_clairaut:
      name: Alexis Clairaut
      text: French mathematician and astronomer, 1713 to 1765. He went on the expedition to Lapland of 1736 and 1737 to measure the shape of the Earth. He worked with Émilie du Châtelet on her French Newton, and after her death in 1749 helped prepare it for the edition of 1759.
    felix_klein:
      name: Felix Klein
      text: German mathematician, 1849 to 1925. In 1872 he set out the Erlangen programme, which sorts geometries by the groups of transformations that leave them unchanged, and from 1886 he taught at Göttingen. With David Hilbert he brought Emmy Noether to Göttingen in 1915, and on 26 July 1918 he presented her paper Invariant Variational Problems to the Göttingen society of sciences.
    david_hilbert:
      name: David Hilbert
      text: German mathematician, 1862 to 1943, professor at Göttingen from 1895. In 1900 he set out twenty three problems for the new century. With Felix Klein he brought Emmy Noether to Göttingen in 1915, and while she was not allowed to lecture, her courses were announced under his name.
    jean_perrin:
      name: Jean Perrin
      text: French physicist, 1870 to 1942. From 1908 his experiments on Brownian motion confirmed the predictions Einstein had made in 1905, and the reality of atoms came to be generally accepted. In 1926 he received the Nobel Prize in Physics for his work on the discontinuous structure of matter.
    stefan_meyer:
      name: Stefan Meyer
      text: Austrian physicist, 1872 to 1949, a student and assistant of Ludwig Boltzmann in Vienna. When Boltzmann went on sick leave in May 1906, Meyer took over his lectures, and after the death of Boltzmann he led the institute for a year. From 1910 he was the first acting director of the Institute for Radium Research in Vienna.
    stanford_white:
      name: Stanford White
      text: American architect, 1853 to 1906, a partner of McKim, Mead and White in New York. He designed the buildings at Wardenclyffe on Long Island for Nikola Tesla, and in 1901 Tesla wrote to him about the tower and the laboratory. He was shot dead in New York in June 1906.
    j_pierpont_morgan:
      name: J. Pierpont Morgan
      text: American banker, 1837 to 1913, head of J.P. Morgan and Company in New York. In March 1901 he agreed to put 150,000 dollars into a wireless station for Nikola Tesla at Wardenclyffe, and in July 1903 he wrote that he would advance no more.
    ferdinand_schubert:
      name: Ferdinand Schubert
      text: Austrian composer and teacher, 1794 to 1859, the elder brother of Franz Schubert. In the autumn of 1828 Franz moved into his new flat in Wieden and died there on 19 November. After his death Ferdinand sold most of his brother's compositions to the publisher Diabelli.
    catharina_bolnes:
      name: Catharina Bolnes
      text: Born about 1631 and died in 1687, the daughter of Maria Thins. She married Johannes Vermeer in Delft on 20 April 1653 and bore him fifteen children, eleven of whom were living when he died in December 1675. Early in 1676 she gave two of his paintings to the baker against a bread debt, passed The Art of Painting to her mother, and in April asked the High Court to relieve her of the debts.
    maria_thins:
      name: Maria Thins
      text: Born in 1592 and died in 1680, of a well-off family from Gouda, the mother of Catharina Bolnes and mother-in-law of Johannes Vermeer. The Vermeers lived in her house on the Oude Langendijk in Delft, and he was buried in a grave she had bought. On 24 February 1676 her daughter passed The Art of Painting to her.
    thore_burger:
      name: Théophile Thoré-Bürger
      text: French journalist and art critic, 1807 to 1869. In 1866 he published a catalogue of the works of Johannes Vermeer in the Gazette des Beaux-Arts, which brought the painter back to wide notice after nearly two centuries.
    titus_van_rijn:
      name: Titus van Rijn
      text: Born in Amsterdam in 1641 and buried there on 7 September 1668, the son of Rembrandt and Saskia van Uylenburgh and the only one of their children to grow up. He sat for his father as a model and worked as an art dealer. He married Magdalena van Loo in February 1668, and their daughter Titia was born half a year after his death.
    domenec_sugranyes:
      name: Domènec Sugranyes
      text: Catalan architect, 1878 to 1938, born in Reus. He began working with Antoni Gaudí in 1905, and Gaudí named him an executor of his will. After the death of Gaudí in 1926 he directed the works of the building Gaudí left unfinished for ten years, until the workshop was set on fire on 20 July 1936.
    dora_diamant:
      name: Dora Diamant
      text: Actress and teacher, 1898 to 1952, born in Poland. She met Franz Kafka on the Baltic coast in July 1923 and lived with him in Berlin. In April 1924 she came with him to the sanatorium at Kierling, cooked for him and stayed until he died on 3 June. She kept some of his last notebooks and letters, which were taken from her in 1933.
    robert_klopstock:
      name: Robert Klopstock
      text: A Hungarian medical student whom Franz Kafka met in a sanatorium in the High Tatras in 1921. Around 6 May 1924 he came to Kierling to help nurse Kafka and relieve Dora Diamant, and after Kafka's death he went with the body to Prague on the same train.
    maria_clemm:
      name: Maria Clemm
      text: Aunt and mother-in-law of Edgar Allan Poe, 1790 to 1871. Poe found a home with her in Baltimore after he broke with his foster father, married her daughter Virginia, and called her Muddy; she kept house for them and carried his manuscripts to publishers. She was at Fordham when he died in Baltimore in October 1849, and learned of it from a newspaper.
    katharina_kepler:
      name: Katharina Kepler
      text: Mother of the astronomer Johannes Kepler, 1547 to 1622, born Guldenmann at Eltingen near Leonberg. A widow who could neither read nor write, she prepared remedies for her neighbours, and after a quarrel in 1615 they accused her of having harmed them. She was arrested on 7 August 1620 and held in chains at Güglingen for 405 days, while her son defended her in writing. She was released in the autumn of 1621 and died the next April.
    olga_knipper:
      name: Olga Knipper
      text: Russian actress, 1868 to 1959, one of the original members of the Moscow Art Theatre in 1898. She played Arkadina in The Seagull and was the first Masha of Three Sisters and the first Ranevskaya of The Cherry Orchard. She married Anton Chekhov in 1901, went with him to Badenweiler in June 1904, where he died on 15 July. She acted with the Moscow Art Theatre for the rest of her life.
    carl_friedrich_gauss:
      name: Carl Friedrich Gauss
      text: German mathematician, born in Brunswick in 1777, died at Göttingen in 1855. From 1807 he was director of the observatory of the University of Göttingen. From 1804 he corresponded with Sophie Germain, who signed as Monsieur Le Blanc, and learned who she was in 1807. He persuaded the university to give her an honorary degree, which she did not live to receive.
    franco_alfano:
      name: Franco Alfano
      text: Italian composer (1876–1954). After Puccini died, the family and the publisher Ricordi commissioned Alfano to complete Turandot. His first full score of the final duet and closing scene is dated 28 January 1926 in Turin.
    clara_schumann:
      name: Clara Schumann
      text: Pianist and composer (1819–1896), born Clara Wieck. She began performing in childhood and toured widely. In July 1856 she returned from her first concert tour of Britain and visited Robert at Endenich. She continued giving concerts for decades.
    jeanne_hebuterne:
      name: Jeanne Hébuterne
      text: French painter, 1898–1920. Hébuterne studied drawing and painting at the Académie Colarossi in Paris. Her own work includes self-portraits, views from her window and portraits of artist friends. In 1917 she met Amedeo Modigliani, who painted her many times. Their daughter was born on the French Riviera, and they returned to Paris in May 1919. Hébuterne died on 26 January 1920.
    mu_zeng:
      name: Mu Zeng
      text: Lijiang prefect and writer (1587–1646). In 1639 Xu Xiake collated books for him. Xu’s diary records that Mu later sent thanks for the work and renewed his request for a gazetteer of Mount Ji.
  events:
    pump_handle:
      name: The Broad Street pump handle is removed
      text: History records the handle being removed on 8 September. The outbreak was already declining by then and many residents had left, so how many lives the removal saved is still debated.
    handwashing_rule:
      name: The Vienna handwashing rule
      text: Semmelweis introduced chlorine handwashing in the first maternity clinic in May 1847. His treatise compares patient and death counts by clinic and period.
    branch:
      name: Branches and the main timeline
      text: Game assumption. History cannot be changed. Everything an employee does lands on a parallel branch and the main timeline stays as it was. The difference between the branch and the main timeline is converted into time energy.
    sanitary_commission:
      name: The Sanitary Commission at Scutari
      text: In early March 1855 a Sanitary Commission sent from Britain arrived at Scutari, flushed the sewers and opened the wards to air. The deaths in the hospitals fell sharply in the following months.
    mosquito_idea:
      name: The mosquito idea
      text: In August 1881 Carlos Finlay told the Havana Academy that a mosquito carried yellow fever. It was not accepted for years and was proved after 1900.
    first_inoculation:
      name: The first cowpox inoculation
      text: On 14 May 1796 Edward Jenner inoculated a boy with matter from cowpox sores and later tested whether the boy was protected from smallpox. By the standards of today that test is not allowed.
    camp_stores:
      name: The camp stores
      text: Mary Seacole bought and carried her own supplies and ran an inn behind the camp. The date on which the army stores were opened to her is not recorded.
    supply_plan:
      name: The journey back from Eismitte
      text: Wegener set out from Eismitte on 1 November 1930 with Rasmus Villumsen and is thought to have died about 16 November. A search party found his grave on 12 May 1931.
    depot_plan:
      name: The last diary entry
      text: Scott's last diary entry is dated 29 March 1912, eleven miles from One Ton Depot. The tent was found by a search party on 12 November.
    oxygen_plan:
      name: The plan for the high camps
      text: How the high camps were stocked and how far the oxygen sets were used was argued on the mountain.
    snow_line:
      name: The plan for the climb
      text: How fast to climb and how long to rest was a choice of the party on the slope.
    watering_plan:
      name: The plan for water and food
      text: How the shore parties were watered and fed was the choice of the ship's officers.
    fresh_food_plan:
      name: The plan for fresh food
      text: What the ship took on at the islands for the long voyage was the choice of the ship's officers.
    university_order:
      name: The order to join the schools
      text: On 4 February 1924 Sun Yat-sen ordered the three schools joined into one university. The recorded dates do not move.
model_events:
  door_block: While going door to door to treat people, an employee may be turned away by neighbours or seniors. Whether they yield, insist or appeal is decided by their traits.
  time_strain: When a branch drifts too far from history, the employee feels the time slip, gets more tired, and is more likely to come to harm.
  asked_the_way: A new student with a letter asks the employee the way to an office. The student is made up for the game and has no name. If the employee has walked the sites by then, the way is shown on the sheet, otherwise the two of them look for it together. It happens once in a trip and is not counted in the comparison with the main timeline.
  expedition_handoff: An invented handoff. The employee’s response habit determines whether they send the available copy or make time to check it.
fact_lines:
  abel_froland:
    quintic: '1824: Abel proves that the general equation of the fifth degree cannot be solved by radicals.'
    sledge: 'Christmas 1828: cold and coughing, Abel comes by sledge to Froland to see his fiancée.'
    last_paper: '6 January 1829: in bed at Froland, Abel writes his last paper, two or three pages on the main idea of his Paris memoir.'
    death: '6 April 1829: Niels Henrik Abel dies at Froland, aged twenty six.'
    berlin: '8 April 1829: not knowing, Crelle writes from Berlin that the post for Abel is secured.'
    prize: '1830: the Paris Academy gives its Grand Prix to Abel, who is dead, and to Jacobi.'
    memoir: '1841: the memoir Abel gave the Paris Academy is printed at last.'
  ahmed_baba_timbuktu:
    conquest: '1591: a Moroccan army takes Timbuktu.'
    deported: '1594: accused of resisting the sultan, Ahmad Baba is taken away to Marrakesh.'
    return: '1608: Ahmad Baba is allowed to go home to Timbuktu.'
    death: '22 April 1627: Ahmad Baba dies in Timbuktu.'
  al_haytham_cairo:
    fustat_fire: '1020: parts of Fustat were set on fire during unrest. The record does not say where Ibn al-Haytham or his manuscripts were that day.'
  archimedes_syracuse:
    siege: 'Syracuse: the city holds out against the Roman siege.'
    death: 'Syracuse: the city is taken, and Archimedes is killed.'
  artemisia_florence:
    admission_fee: '19 July 1616: Artemisia enters the Academy of the Arts of Drawing in Florence.'
    commission_balance: 'August 1616: the final instalment for Allegory of Inclination is recorded.'
  bach_leipzig:
    eyes: 'Spring 1750: Bach can hardly read or write for his eyes.'
    operations: 'Spring 1750: John Taylor operates on Bach’s eyes. Complications require a second operation.'
    death: '28 July 1750: Bach died in Leipzig.'
  banneker_maryland:
    fire: '1806: a fire destroys much of what Banneker kept in his house.'
  basho_hiraizumi:
    set_out: 'The twenty-seventh day of the third month, Genroku 2: Bashō sets out from Fukagawa in Edo with Sora for the north.'
    depart: 'The thirteenth day of the fifth month, Genroku 2, fine: about ten in the morning Bashō and Sora leave Ichinoseki for Hiraizumi.'
    takadachi: They climb Takadachi and look down on the Kitakami and Koromo rivers.
    golden_hall: At Chūsonji the steward shows them the Golden Hall.
    sutra_hall: 'The Sutra Hall stays shut: the steward is away.'
    back: About four in the afternoon they are back at their lodging in Ichinoseki, where the host has the bath ready.
    ogaki: 'About the twenty-first day of the eighth month: Bashō reaches Ōgaki, the end of the narrow road.'
    death: 'The twelfth day of the tenth month, Genroku 7: Matsuo Bashō dies in Osaka.'
  beethoven_vienna:
    full_rehearsals: '5 May 1824: chorus and orchestra rehearse together for the first time, two days before the concert.'
    premiere: '7 May 1824: at the Kärntnertor Theatre the Ninth Symphony is played for the first time, with Beethoven on the stage.'
    second_concert: '23 May 1824: the concert is repeated in the great Redoutensaal; the hall is thin and the takings disappoint Beethoven.'
    death: '26 March 1827: Ludwig van Beethoven dies in Vienna.'
  bell_boston:
    notebook: '10 March 1876: Watson understands Bell’s spoken words over the experimental telephone.'
    centennial: '25 June 1876: Bell demonstrates the telephone at the Centennial Exhibition in Philadelphia.'
  bessie_coleman_jacksonville:
    paxon: '30 April 1926: Coleman and the pilot die during a practice flight at Paxon Field.'
  bizet_paris:
    premiere: '3 March 1875: Carmen opens at the Opéra-Comique.'
    rehearsals: The theatre keeps rehearsing Carmen up to the day it opens.
    death: '3 June 1875: Bizet dies at Bougival.'
  boltzmann_duino:
    counting: '1877: Boltzmann counts how many arrangements of particles give the same distribution of energy.'
    leave: 'May 1906: ill with what is called severe neurasthenia, Boltzmann stops lecturing in Vienna.'
    duino: 'Summer 1906: Boltzmann comes with his wife and daughter to Duino near Trieste.'
    death: '5 September 1906: Ludwig Boltzmann dies at Duino, aged sixty two.'
    perrin: '1908: Jean Perrin''s experiments on Brownian motion begin to confirm Einstein''s predictions about atoms.'
    perrin_nobel: '1926: Jean Perrin receives the Nobel Prize in Physics for his work on the discontinuous structure of matter.'
  boole_ballintemple:
    lecture: On 24 November 1864 Boole taught at Queen’s College in Cork.
    death: On 8 December 1864 Boole died at his home in Ballintemple.
    supplement: In November 1865, Isaac Todhunter’s preface recorded who had recalculated the table and why.
  bose_calcutta:
    salary_wait: '1885: Bose began teaching at Presidency College. He refused the lower pay, and the dispute took about three years to resolve.'
  buchner_zurich:
    typhus: Büchner falls ill with a fever.
    minna: 'February 1837: Minna Jaeglé reaches Zürich late in Büchner’s illness.'
    death: Büchner dies in Zürich, aged twenty three.
  cajal_barcelona:
    chair: '1887: Cajal takes up the chair of histology at the University of Barcelona.'
    revista: '1 May 1888: Cajal pays for the first number of his own journal; about sixty copies, most of them posted abroad.'
    berlin: 'October 1889: at the meeting of the German Anatomical Society in Berlin, Cajal sets his slides under the microscope for the leading histologists, and Kölliker takes up his work.'
    madrid: '1892: Cajal leaves Barcelona for the chair of histology in Madrid.'
    nobel: '1906: Cajal and Golgi share the Nobel Prize for their work on the structure of the nervous system.'
  camille_claudel_paris:
    father: '3 March 1913: Camille Claudel’s father dies at Villeneuve-sur-Fère.'
    admission: '10 March 1913: Camille Claudel is admitted to Ville-Évrard.'
  cantor_halle:
    hunger: The war has emptied the larders; Cantor is ill and short of food.
    clinic: 'From the clinic Cantor writes to his wife again: he asks to come home.'
    death: '6 January 1918: Cantor dies in the clinic in Halle.'
  caroline_herschel_slough:
    comet_letter: '2 August 1786: Caroline Herschel sends the drawings from both nights with her comet report.'
  chekhov_badenweiler:
    departure: '3 June 1904: Chekhov, gravely ill, leaves Moscow with Olga Knipper for a German spa.'
    romerbad: '23 June 1904: Chekhov and Olga Knipper are at the Hotel Römerbad in Badenweiler, still tired from the road.'
    letter: '25 June 1904: from the Villa Friederike, Chekhov sends Maria his new address and writes of the sunny garden.'
    sommer: '5 July 1904: Chekhov writes to Maria from the Hotel Sommer; the post office is next door.'
    steamer: '11 July 1904: in the heat, Chekhov writes to ask which steamer could take him and Olga home to Russia by sea.'
    death: '15 July 1904: Anton Chekhov dies in the early hours at Badenweiler, aged forty four.'
  copernicus_frombork:
    rheticus: '1539: Rheticus, a young mathematician from Wittenberg, comes to Frombork and urges Copernicus to publish his book.'
    giese_worry: '8 December 1542: Tiedemann Giese writes that he is deeply worried about the health of the old man, Copernicus.'
    revolutions: '1543: in Nuremberg De revolutionibus is printed, with an unsigned address to the reader at the front.'
    book_reached: 'About 24 May: the printed De revolutionibus reaches Frombork. Giese will write that it came on the day he died; it may have come after.'
    death: '24 May 1543: Nicolaus Copernicus dies in Frombork.'
    giese_letter: '26 July: Giese writes to Rheticus, thanks him for two copies, and asks him to take a request for an amended edition to the council of Nuremberg.'
    autograph: '1999: the autograph of De revolutionibus, kept in the Jagiellonian Library in Kraków, enters the Memory of the World register.'
    remains: '2008: a DNA comparison shows that remains found under the floor of Frombork Cathedral are those of Copernicus.'
  curie_paris:
    april_note: '12 April 1898: Marie Curie reports to the Academy of Sciences that pitchblende gives off stronger rays than uranium.'
    polonium: '18 July 1898: the Curies announce a new element in pitchblende and name it polonium, after Poland.'
    radium: '26 December 1898: the Curies and Bémont announce radium to the Academy of Sciences.'
    shed: '1902: from about a tonne of pitchblende the Curies have separated a tenth of a gram of radium chloride.'
    pierre_death: '19 April 1906: Pierre Curie is killed by a horse-drawn vehicle in Paris.'
    death: '4 July 1934: Marie Curie dies of aplastic anaemia in Haute-Savoie.'
  dante_ravenna:
    exile: '1302: Florence sentences Dante to exile, and then to death should he ever come back.'
    ravenna: 'About 1318: Dante settles in Ravenna, at the invitation of Guido Novello da Polenta.'
    bologna_letter: 'About 1319: from Bologna, Giovanni del Virgilio sends Dante a Latin poem, urging him to write in Latin and come to Bologna for the laurel.'
    questio: '20 January 1320: at Verona, Dante lectures on the place of water and earth on the globe.'
    death: '14 September 1321: back ill from an embassy to Venice, Dante dies in Ravenna.'
    rehabilitation: '16 June 2008: Florence’s city council passes a motion asking the mayor to revoke Dante’s 1302 sentence.'
  darwin_galapagos:
    lawson: On Charles Island the vice-governor Lawson says he can tell which island a tortoise comes from.
    james_island: '8 October 1835: Darwin and a small party are set ashore on James Island with a tent, while the Beagle goes for water.'
  david_fleay_healesville:
    first_swim: '26 February 1944: Fleay first observed Corrie come out to swim.'
    public_debut: 'March 1944: Corrie hid before her public debut. By the time keepers dug her out, most visitors had left.'
  dickinson_amherst:
    death: '15 May 1886: Emily Dickinson dies at home in Amherst.'
  du_chatelet_luneville:
    luneville: 'July 1749: Du Châtelet comes to the court of Stanislas at Lunéville to await the birth of her child.'
    birth: '4 September 1749: before dawn Du Châtelet gives birth to a daughter.'
    death: '10 September 1749: Émilie du Châtelet dies at Lunéville, six days after the birth.'
    receipt: '10 September 1749: in Paris the Royal Library signs for three packets of her commentary on Newton.'
    principes: '1759: her complete French translation of Newton''s Principia, with her commentary, is published.'
  du_fu_xiang_river:
    final_journey: Yuan Zhen’s epitaph records Du Fu’s death away from home and his temporary burial at Yueyang.
  emily_bronte_haworth:
    death: '19 December 1848: Emily Brontë dies at Haworth.'
  enheduanna_ur:
    expulsion: The Exaltation of Inana describes the speaker’s expulsion from the temple.
  eratosthenes_alexandria:
    tutor: 'About 245 BC: Ptolemy III brings Eratosthenes to Alexandria to teach his son.'
    librarian: 'About 240 BC: Eratosthenes becomes librarian of the Library of Alexandria.'
    midsummer: 'Noon at midsummer, in Cleomedes’ later account: no shadow under the pointer at Syene; at Alexandria the Sun is one fiftieth of a full circle from the zenith.'
    death: 'About 194 BC: Eratosthenes, blind in his old age, dies in Alexandria.'
  euclid_alexandria:
    elements: 'About 300 BC: in Alexandria, Euclid writes the thirteen books of the Elements.'
    pappus: 'About AD 320: Pappus, in Alexandria, writes down that the Porisms holds 171 theorems and 38 lemmas.'
    printed: '1482: Erhard Ratdolt prints the Elements in Venice, with diagrams in the margins.'
  fanny_mendelssohn_berlin:
    death: '14 May 1847: Fanny Hensel dies in Berlin.'
  faraday_london:
    disc: '28 October 1831: the copper disc yields a current as it turns.'
  fibonacci_pisa:
    bugia: 'The 1190s: in Bugia, on the coast of North Africa, the young Leonardo of Pisa learns to reckon with the nine Indian figures.'
    numerals: '1202: in Pisa, Leonardo finishes the Liber abaci, a book of reckoning with the nine Indian figures and zero.'
    frederick: 'About 1225: the court of Frederick II meets in Pisa, and Johannes of Palermo sets Leonardo problems.'
    revision: '1228: Leonardo issues a revised Liber abaci. The copies that come down to later centuries are of this version.'
    salary: '1240: the Republic of Pisa grants Master Leonardo Bigollo a yearly salary for his help with the city''s accounts.'
  freud_vienna:
    father: '23 October 1896: Freud''s father Jacob dies in Vienna.'
    appearance: '4 November 1899: The Interpretation of Dreams comes out in Vienna, published by Franz Deuticke.'
    imprint: 'The same day: the year printed on its title page is 1900.'
    second_edition: '1909: the second edition of The Interpretation of Dreams appears, after the 600 copies of the first took eight years to sell.'
    professor: '1902: Freud is made an extraordinary professor at the University of Vienna.'
  galen_rome:
    comedy_glossary_lost: '192: the fire destroys Galen’s glossary of words from Old Comedy.'
  galois_paris:
    release: '29 April 1832: Galois is released in Paris, after more than nine months held.'
    letter_to_chevalier: '29 May 1832: through the night Galois writes to his friend Auguste Chevalier, setting out his work and asking him to print the letter.'
    duel: '30 May 1832: early in the morning Galois is shot in the abdomen in a duel and left where he fell, until a passing farmer finds him.'
    death: '31 May 1832: Évariste Galois dies in the Cochin hospital, aged twenty.'
    burial: '2 June 1832: Galois is buried in a common grave at Montparnasse.'
    printed: 'September 1832: Chevalier prints the letter in the Revue encyclopédique.'
    liouville: '1846: Joseph Liouville publishes the papers of Galois in his journal.'
  gaudi_barcelona:
    accident: '7 June 1926: on the Gran Via a tram knocks Gaudí down; taken for a beggar, he lies in the street while taxis pass.'
    death: '10 June 1926: Antoni Gaudí dies in hospital in Barcelona, aged seventy three.'
    burial: '12 June 1926: Gaudí is buried beneath the building he had directed for forty three years.'
    workshop: '20 July 1936: the workshop is set on fire, and most of Gaudí''s drawings and models are lost.'
  great_zimbabwe:
    builders: From the eleventh century, ancestors of the Shona build a city of stone on this hill. The building goes on for more than three hundred years.
    mauch: '1871: the German Karl Mauch reaches the ruins.'
    western_yard_loss: '1915: the crews remove most of the earthen platforms, benches and walls in the Western Enclosure.'
    name: '1980: a new country takes its name from the city, Zimbabwe.'
    heritage: '1986: Great Zimbabwe is inscribed as a World Heritage site.'
  gutenberg_mainz:
    loans: Fust has twice lent Gutenberg 800 guilders for the work of the books.
    bible: '1455: the 42-line book is printed in Mainz with movable metal type.'
    lawsuit: '6 November 1455: a notary sets down the case Fust has brought against Gutenberg for his loans and interest.'
    workshop: After the dispute, Fust and Schöffer go on printing in Mainz.
  hammurabi_babylon:
    accession: 'About 1792 BC: Hammurabi becomes king of Babylon.'
    stele: 'About 1754 BC, late in Hammurabi''s reign: a basalt stele carved with nearly three hundred laws is set up.'
    death: 'About 1750 BC: Hammurabi dies.'
    susa: 'Twelfth century BC: the stele is carried to Susa, and several columns of its text are scraped away.'
    found: '1901: a French expedition digs the stele up at Susa, broken in three.'
  hargrave_stanwell_park:
    boxkite: '1893: Hargrave starts to experiment with kites and makes the box kite.'
    beach: '12 November: on the beach at Stanwell Park, four linked box kites lift Hargrave off the sand, almost 16 feet up.'
    photo: '12 November 1894: a photograph records Hargrave and James Swaine with the kite equipment at Stanwell Park.'
    death: '6 July 1915: Hargrave dies in Sydney, aged 65.'
  hertz_bonn:
    illness: Hertz is lecturing again this term, between operations on his nose and throat.
    mechanics: '3 December 1893: Hertz sends the manuscript of The Principles of Mechanics to the publisher.'
    death: '1 January 1894: Heinrich Hertz dies in Bonn.'
  higuchi_ichiyo_tokyo:
    death: '23 November 1896: Higuchi Ichiyō dies of tuberculosis.'
  hildegard_bingen:
    lifted: 'March 1179: the restriction on singing ends.'
  hipparchus_rhodes:
    commentary: 'Late second century BC: Hipparchus’s commentary pointed out that some stars described together in the familiar poem did not rise together.'
  hooke_london:
    death: On 3 March 1703 Robert Hooke died in London.
    edition: In 1705 Richard Waller published Hooke’s posthumous works.
  hua_tuo_xuchang:
    manuscript_lost: The Sanguozhi records that the jailer refuses the book. Hua Tuo burns it.
    death: The Sanguozhi records Hua Tuo’s death at Xu.
  humboldt_chimborazo:
    crevasse: '23 June 1802: below the summit of Chimborazo a deep gully stops the climbers, and they turn back.'
    sickness: Higher up the porters stop; the three go on, with nosebleeds and dizziness.
  hypatia_alexandria:
    teaching: 'Early 415: Hypatia still teaches in Alexandria, and the magistrates of the city come to hear her.'
    feud: The feud between the prefect and another faction of the city grows sharper, and Hypatia is drawn into it.
    death: 'March 415: Hypatia is killed in Alexandria.'
  ibn_al_nafis_cairo:
    collection: '1288: Ibn al-Nafis died and left his library to a hospital. Only portions of his large medical encyclopedia survive today.'
  ibn_battuta_tangier:
    departure: '2 Rajab 725 (June 1325): Ibn Battuta leaves Tangier.'
    return: 'About 1354: after nearly thirty years on the road, he comes home and dictates his travels to Ibn Juzayy.'
  ibn_khaldun_cairo:
    cairo: '1382: Ibn Khaldun comes to Cairo at the invitation of Sultan Barquq.'
    family_release: '1384: at the sultan''s request, Tunis lets his wife and daughters sail for Egypt.'
    qadi: '8 August 1384: he is made chief judge of the Maliki school.'
    rivals: '1385: after some ten months, under pressure from his rivals, he leaves the bench.'
    shipwreck: The same year the ship bringing his wife and daughters goes down at Alexandria.
    timur: 'Early 1401: outside besieged Damascus, Ibn Khaldun meets Timur.'
    death: '17 March 1406: Ibn Khaldun dies in Cairo.'
    burial: He is buried in the cemetery outside the Bab al-Nasr.
  ibn_rushd_lucena:
    exile: Ibn Rushd is banished to Lucena. Accounts also record an order to burn books.
  ibn_sina_hamadan:
    death: '1037: Ibn Sina dies at Hamadan.'
  ife_bronzes:
    frobenius: '1910: Leo Frobenius is required to return a metal head he obtained at Ife.'
    wunmonije: 'January 1938: digging foundations in the Wunmonije compound, builders turn up a group of heads.'
    exhibition: 'July 1948: the Ife castings go on display at the British Museum.'
    field_plan_gap: After most of the trenches were backfilled, later archaeologists had no comprehensive plan of the early excavations and had to reconstruct the layout.
  ino_tadataka_ezo:
    set_out: '11 June 1800: Ino Tadataka and the survey party leave Edo for Ezo.'
    coast: '1800: on Ezo the survey party follows the southern coast as far as Nishibetsu.'
    death: '1818: Ino Tadataka dies. For a while nobody announces it, so the work on the maps can go on.'
    map: '1821: Takahashi Kageyasu and the others finish the maps of the coasts of Great Japan.'
  jianzhen_nara:
    eiei: 'Duanzhou: Eiei, who came to Yangzhou to ask Jianzhen across, dies of his illness.'
    eyes: On the journey north, Jianzhen loses his sight.
  kafka_kierling:
    larynx: 'March 1924: Kafka begins to have trouble swallowing; tuberculosis has reached his larynx.'
    kierling: '19 April 1924: Kafka and Dora Diamant come to the Hoffmann sanatorium at Kierling; he talks on slips of paper.'
    klopstock: 'About 6 May 1924: the medical student Robert Klopstock comes to Kierling to help with the nursing.'
    last_proofs: '2 June 1924: Kafka is still correcting the proofs of A Hunger Artist.'
    death: '3 June 1924: Franz Kafka dies at Kierling, aged forty.'
    burial: '11 June 1924: Kafka is buried in Prague.'
    four_stories: 'End of August 1924: A Hunger Artist, four stories, comes out in Berlin.'
  keats_rome:
    arrival: '15 November: Keats and Severn reach Rome and take rooms on the second floor of 26 Piazza di Spagna, by the Spanish Steps.'
    rome_letter: '30 November: Keats writes to Charles Brown that writing a letter, and saying goodbye, has become hard.'
    death: '23 February, late at night: Keats dies. Severn is with him.'
    register: In the burial register the day is written as 24 February.
    burial: '26 February: Keats is buried in the cemetery by the pyramid.'
    epitaph: 'At his wish, the stone will not carry his name, only: Here lies One Whose Name was writ in Water.'
    severn: '1879: Severn dies. He is buried beside Keats.'
  kepler_leonberg:
    arrest: '7 August 1620: Katharina Kepler is arrested at Heumaden; the case against her begins at Leonberg.'
    charged: '4 September 1620: at Güglingen, Katharina is charged with a capital offence.'
    kepler_arrives: 'September 1620: Johannes Kepler returns from Linz to defend his mother.'
    postponed: '2 October 1620: the hearing set for today is put off by ten weeks, to 11 December.'
    witnesses: '8 January 1621: at Güglingen the witnesses begin to be sworn.'
    defence: '7 May 1621: the written defence of Katharina Kepler is handed in, answering each witness in turn.'
    released: 'Autumn 1621: after 405 days in custody, Katharina Kepler is released.'
    death: 'April 1622: Katharina Kepler dies, about six months after her release.'
  kovalevskaya_stockholm:
    prize: '24 December 1888: The Paris Academy announced the Prix Bordin for Kovalevskaya’s work on rigid-body rotation.'
  lalibela_rock:
    reign: 'Around the turn of the thirteenth century: Lalibela rules in the Ethiopian highlands.'
    alvares: '1520s: Francisco Álvares visits with a Portuguese embassy and describes the buildings cut into the rock.'
    heritage: '1978: the rock hewn churches of Lalibela are inscribed as a World Heritage site.'
    sediment_record: The few photographs that survive from the clearance are insufficient to reconstruct the original layers and positions of the finds.
  lavoisier_paris:
    arrest: '24 November 1793: the arrest of all the former tax farmers is ordered.'
    execution: '8 May 1794: Lavoisier is put to death in Paris.'
    paulze_execution: '8 May 1794: Jacques Paulze is put to death in Paris.'
  leavitt_cambridge_ma:
    variable_stars: On 3 March 1912, Harvard College Observatory Circular 173 published Leavitt’s table of twenty-five variable stars.
    calibration: In 1913, the relation was calibrated using Cepheids in the Milky Way.
  leeuwenhoek_delft:
    doubt: 'Spring 1677: London does not believe in the little animals.'
    testimonials: '18 May 1677: the first two witnesses in Delft write down what they saw.'
    sent: '5 October 1677: Leeuwenhoek dates the letter from Delft enclosing the testimonials.'
    hooke: 'November 1677: at the third try Hooke shows the Society the little animals.'
  li_bai_changan:
    pardon: 'Around 759: Li Bai was pardoned on the way to Yelang. An afterword to his collected works places him near Wushan at the time.'
  li_qingzhao_hangzhou:
    theft: 'Around 1131: Li Qingzhao recalled a theft at her lodgings in Kuaiji. She recovered eighteen scrolls afterwards.'
  li_shizhen_qizhou:
    after_death_edition: 'By 1596: the Jinling edition appeared after Li Shizhen’s death. He did not live to see the complete book in print.'
  lili_boulanger_paris:
    illness: 'Winter 1918: Lili is too weak to write.'
    last_work: '1918: from her bed Lili dictates her last work to Nadia.'
    death: '15 March 1918: Lili dies at Mézy.'
  lovelace_london:
    menabrea: 'October 1842: in Geneva Luigi Menabrea publishes, in French, an account of Babbage''s Analytical Engine.'
    refused_withdraw: '6 August 1843: Lovelace writes to Babbage that she will not withdraw the translation and Notes.'
    proposal: '14 August 1843: Lovelace offers to run the business of building the engine, if Babbage will keep to the engineering.'
    printed: 'Late August 1843: Taylor''s Scientific Memoirs comes out with the translation and the Notes, signed A.A.L.'
    death: '27 November 1852: Ada Lovelace dies in London, at thirty six.'
  machu_picchu:
    built: 'Around 1450: on a ridge above the river, an estate of the Inca ruler Pachacuti is being built of fitted stone.'
    series: A canal brings water from a spring down a stair of sixteen stone basins.
    abandoned: About a century later, around the time of the Spanish conquest, the estate is left empty.
    bingham: '24 July 1911: a local farmer, Melchor Arteaga, leads the American Hiram Bingham across the river and up to the ruins.'
    heritage: '1983: Machu Picchu is inscribed as a World Heritage site.'
  mary_anning_lyme_regis:
    ichthyosaur: 'November 1812: Mary Anning, twelve or thirteen, digs a skeleton five metres long out of the cliff. Her brother had found its skull.'
    plesiosaur: '10 December 1823: under the cliffs at Lyme Regis, Mary Anning finds a nearly complete skeleton with a neck longer than its body.'
    sketch: '26 December 1823: Anning writes from Lyme and includes a drawing of the skeleton.'
    pterosaur: 'December 1828: she finds a jumble of bones with a long tail and wings, the first pterosaur found in England.'
    death: '1847: Mary Anning dies, aged 47, still short of money.'
  maya_codices_mani:
    mani: '12 July 1562: Maya books are burned in public at Maní.'
  mendel_brno:
    experiments: '1856: Mendel begins crossing pea plants in the garden at Brno; he will keep at it for eight years.'
    first_talk: '8 February 1865: Mendel gives the first of his two talks on pea hybrids to the Brno society.'
    second_talk: '8 March 1865: Mendel gives his second talk and sets out how the offspring of hybrids divide.'
    printed: '1866: the paper Experiments on Plant Hybrids is printed in the proceedings of the Brno society.'
    death: '6 January 1884: Gregor Mendel dies in Brno.'
    rediscovery: '1900: three botanists, working apart, come upon Mendel''s paper of 1866.'
  mendeleev_petersburg:
    flyer: '1 March 1869: Mendeleev finishes a one-page table of the elements by their atomic weights.'
    meeting: '18 March 1869: at the Russian Chemical Society Menshutkin reads Mendeleev''s paper for him; the discussion is put off until the author is present.'
    next_meeting: '15 April 1869: the society meets again, and nobody brings up the table of the elements.'
    german_abstract: 'May 1869: Mendeleev sends a short abstract of his paper to a German journal, and it goes to a translator.'
    gallium: '1875: gallium is found, and it fills one of the gaps Mendeleev left in his table.'
    death: '2 February 1907: Dmitri Mendeleev dies in St Petersburg.'
  miyazawa_kenji_hanamaki:
    death: '21 September 1933: Miyazawa Kenji dies in Hanamaki.'
  modigliani_paris:
    exhibition: '3 December 1917: at Modigliani''s only lifetime solo exhibition, the police order the removal of works they object to.'
    daughter: 'November 1918: in Nice, Jeanne Hébuterne gives birth to their daughter Jeanne.'
    back_in_paris: 'End of May 1919: Modigliani and Jeanne are back in Paris; his tuberculosis is much worse.'
    death: '24 January 1920: Amedeo Modigliani dies of tuberculous meningitis at the Charité hospital, aged thirty five.'
    jeanne_death: '26 January 1920: Jeanne Hébuterne, eight months pregnant, dies at her parents'' home.'
    funeral: '27 January 1920: Modigliani is buried; his fellow artists have collected the money for the funeral.'
    adopted: '1920: their daughter Jeanne is taken in by Modigliani''s sister in Livorno.'
    grave: '1930: Jeanne Hébuterne is laid in the same grave as Modigliani.'
  murasaki_kyoto:
    prince: 'The eleventh day of the ninth month, Kankō 5: the empress Shōshi bears a son.'
    diary: 'The first day of the eleventh month, Kankō 5: at the fiftieth-day banquet Fujiwara no Kintō calls out for "Young Murasaki" among the ladies.'
    binding: 'The eleventh month: the ladies around Shōshi choose paper, copy The Tale of Genji and bind it into books.'
    draft: 'In those days: while Murasaki is on duty, Michinaga takes the draft of the tale from her room and gives it to his daughter Kenshi.'
    palace: 'The seventeenth day of the eleventh month: Shōshi returns to the palace with the prince.'
    classics_day: '2012: Japan makes 1 November Classics Day, after the diary entry of the fiftieth-day banquet.'
  nezahualcoyotl_texcoco:
    lord: '1431: Nezahualcoyotl is named lord of Texcoco.'
    setting: '1472: Nezahualcoyotl, lord of Texcoco, dies.'
    cantares: 'The late sixteenth century: songs in Nahuatl are written down in a collection, some of them under his name. Who first sang them is not known.'
  nietzsche_turin:
    journey: On 8 January 1889 Franz Overbeck reached Turin.
  noether_gottingen:
    invited: '1915: Hilbert and Klein bring Noether to Göttingen; her application to lecture is blocked because she is a woman.'
    hilbert_name: 'Winter 1916: the timetable lists her seminar as given by Professor Hilbert, with the assistance of Dr Noether.'
    presented: '26 July 1918: Felix Klein presents her paper Invariant Variational Problems to the Göttingen society of sciences.'
    final_version: 'End of September 1918: Noether hands in the final version of the paper.'
    habilitation: '4 June 1919: after her trial lecture Noether is admitted to lecture at Göttingen.'
    paid: '1923: for the first time Noether is paid a small fixed salary for her teaching.'
    dismissed: '1933: Noether loses her post at Göttingen and leaves for Bryn Mawr College in the United States.'
    death: '14 April 1935: Emmy Noether dies at Bryn Mawr.'
  omar_khayyam_nishapur:
    observatory: In the 1070s Malik-Shah gathers astronomers, including Omar Khayyam, for observations and calendar work.
    reform: '15 March 1079: the new calendar of Sultan Malik-Shah begins. From now on the year starts at the spring equinox.'
    closed: '1092: Malik-Shah dies, and the observations come to an end.'
    lasting: The Jalali reckoning survives the observation programme. Its descendants are still in use in Iran and Afghanistan.
  pasteur_paris:
    jeanne: 'Summer 1859: Jeanne, nine, is staying with her grandfather at Arbois.'
    death: 'September 1859: Jeanne dies of typhoid fever at Arbois.'
  pliny_stabiae:
    death: 'AD 79: according to his nephew, the Elder Pliny dies at Stabiae during the eruption.'
  poe_baltimore:
    leaves_richmond: '27 September 1849: Poe leaves Richmond for New York; he reaches Baltimore the next day.'
    walker: '3 October 1849: Poe is found in distress at the Fourth Ward polls; after a note is sent, he is taken to Washington College Hospital.'
    death: '7 October 1849: Edgar Allan Poe dies before dawn at Washington College Hospital, aged forty.'
    burial: '8 October 1849: Poe is buried in Baltimore; only a few people come.'
    ludwig: '9 October 1849: an obituary of Poe signed Ludwig appears in the New York Tribune and is copied far and wide.'
    clemm_letter: '9 October 1849: at Fordham, Maria Clemm learns of Poe''s death from the newspaper and writes to Baltimore to ask.'
    moran_letter: 'November 1849: more than a month after the death, Dr Moran writes to Maria Clemm about Poe''s last days.'
  puccini_brussels:
    departure: On 4 November 1924 Puccini set out for Brussels with the final duet of Turandot unfinished.
    clinic: On 7 November 1924 Puccini began treatment in Brussels.
    operation: On 24 November 1924 Puccini underwent an operation.
    death: On 29 November 1924 Puccini died in Brussels.
    completion: On 28 January 1926 Alfano dated his first score of the concluding duet and scene.
  pushkin_st_petersburg:
    address: 'October 1836: in a letter Pushkin gives his address as the house of Princess Volkonskaya by the Konyushenny Bridge. There is no number; the one on the door today was fixed in 1880.'
    duel: '27 January by the old calendar, 8 February by the new: by the Black River, d''Anthès fires first and hits Pushkin in the stomach. Pushkin fires back and grazes his arm.'
    carried_home: He is brought home to the apartment on the Moika.
    apartment: '29 January by the old calendar, 10 February by the new: Pushkin dies in the apartment.'
    buried: Far from the city, near Mikhailovskoye, he is buried beside his mother.
  ramanujan_madras:
    clerk: 'March 1912: Ramanujan takes a clerk''s post in the accounts department of the Madras Port Trust.'
    letter: 'Thursday, 16 January 1913: from the Port Trust, Ramanujan writes to G. H. Hardy in Cambridge about his work.'
    england: '1914: Ramanujan sails for England.'
    death: '1920: back in India and ill, Ramanujan dies.'
  rapa_nui_moai:
    carving: From about the thirteenth century, the people of Rapa Nui carve figures out of the side of a volcano.
    quarry: In the quarry of Rano Raraku, figures lie half cut in the yellow brown tuff, still part of the hill.
    roggeveen: 'Easter Sunday, 5 April 1722: the ships of the Dutchman Jacob Roggeveen come to the island.'
  rembrandt_amsterdam:
    titus: '7 September 1668: Rembrandt''s son Titus is buried in Amsterdam.'
    titia: 'March 1669: half a year after Titus died, his daughter Titia is born.'
    late_portrait: '1669: Rembrandt paints self-portraits dated that year.'
    death: '4 October 1669: Rembrandt dies in Amsterdam, aged sixty three.'
    burial: '8 October 1669: Rembrandt is buried in a rented grave.'
    widow: '21 October 1669: Titus''s widow is buried in Amsterdam.'
  riemann_selasca:
    geometry_lecture: '10 June 1854: in Göttingen Riemann lectures on the hypotheses at the foundations of geometry.'
    primes: '1859: Riemann sends the Berlin Academy his paper on the number of primes below a given size.'
    illness: 'Autumn 1862: Riemann falls ill.'
    selasca: 'June 1866: on his third journey south, Riemann comes to Selasca on Lake Maggiore.'
    last_work: '19 July 1866: under a fig tree at Selasca, Riemann works on his last paper.'
    death: '20 July 1866: Bernhard Riemann dies at Selasca, aged thirty nine.'
    werke: '1876: the collected works of Riemann come out in Leipzig, with Dedekind among the editors.'
  rumi_konya:
    death: '17 December 1273: Rumi dies in Konya.'
  sappho_lesbos:
    exile: 'Around the turn of the seventh and sixth centuries BC: the Parian Marble records Sappho sailing from Mytilene to Sicily in exile.'
  savitribai_phule_pune:
    records: '5 February 1852: in an application for aid, Savitribai is written down as headmistress of the first school.'
    death: '10 March 1897: Savitribai dies of plague, caught while she was nursing the sick.'
  schubert_vienna:
    programme: '26 March 1828: in the rooms of the Gesellschaft der Musikfreunde, Schubert gives a concert of his own works.'
    move: 'Autumn 1828: Schubert, ill, moves into his brother Ferdinand''s new flat in Wieden.'
    probst: '2 October 1828: Schubert offers his last three piano sonatas to the publisher Probst.'
    death: '19 November 1828: Franz Schubert dies in Vienna, aged thirty one.'
    first_edition: '1839: the last three sonatas come out from Diabelli, dedicated to Robert Schumann.'
  schumann_endenich:
    request: On 14 July 1856 Clara Schumann asked to see Robert.
    visit: On 27 July Clara visited Robert at Endenich.
    death: On 29 July Robert Schumann died at Endenich.
  sei_shonagon_kyoto:
    teishi_death: After the birth of Princess Bishi, Teishi dies on the sixteenth day of the twelfth month of Chōhō 2.
  sejong_hangul:
    created: 'The end of 1443: King Sejong finishes twenty eight letters for writing Korean.'
    memorial: 'The second month of 1444: Choe Manri and six colleagues of the Hall of Worthies send up a memorial raising objections.'
    promulgated: '1446: the letters are promulgated as Hunminjeongeum, the correct sounds for teaching the people.'
    sejong_dies: '1450: King Sejong dies.'
  sequoyah_syllabary:
    council: '1821: Sequoyah finishes a set of signs that can put Cherokee words on paper.'
    phoenix: '21 February 1828: at New Echota the first Cherokee Phoenix comes off the press, Cherokee and English in columns side by side.'
    death: 'August 1843: Sequoyah dies in Mexico.'
  shakespeare_globe:
    burial: '11 August 1596: Hamnet Shakespeare was buried in Stratford-upon-Avon. The register does not record whether his father was with him beforehand.'
  sima_qian_changan:
    sentence: After the Li Ling affair, Sima Qian is punished.
  smith_kirkcaldy:
    wealth: '9 March 1776: Adam Smith''s Wealth of Nations is published in London; its first chapter is about making pins.'
    will: '4 January 1776: David Hume makes his will and names Adam Smith to look after his papers.'
    codicil: '7 August 1776: in a codicil Hume leaves the Dialogues to the printer William Strahan, to be published within two years of his death.'
    hume_death: '25 August 1776: David Hume dies in Edinburgh.'
    letter_strahan: '9 November 1776: in Kirkcaldy Smith writes to Strahan an account of Hume''s last months.'
    copy_money: '13 November 1776: Smith posts the account to Strahan, with a note on his 300 pounds of copy money and a plan for a cheaper second edition.'
    own_life: '1777: Hume''s short life of himself is printed with Smith''s letter, and the letter draws angry replies.'
    dialogues: '1779: the Dialogues come out through Hume''s nephew, with no name on the title page.'
  socrates_athens:
    trial: '399 BC: Socrates stands trial before a jury in Athens and is found guilty.'
    surety: The same day he offers a fine of thirty minae, with Plato, Crito and two other friends standing surety; the jury sentences him to death.
    ship: The ship to Delos sailed the day before the trial, and until it is home no one may be put to death; Socrates is taken to prison to wait.
    verses: In prison Socrates begins to put fables of Aesop into verse, as a dream that keeps coming back has told him to.
    crito: Very early one morning Crito comes to the prison, says the ship will soon be in and urges him to escape. He will not.
    plato_ill: On the last day his friends gather at the prison at first light. Plato is ill and does not come.
    death: Towards evening Socrates drinks the hemlock in prison and dies.
  sophie_germain_paris:
    leblanc: '1804: under the name of Monsieur Le Blanc, Germain begins writing to Gauss.'
    prize: '1816: on her third attempt, Germain wins the prize of the Academy of Sciences for her memoir on vibrating elastic plates.'
    cancer: '1829: Germain falls ill with breast cancer, and goes on working.'
    death: '27 June 1831: Sophie Germain dies at 13 rue de Savoie in Paris, aged fifty five.'
    curvature: '1831: her memoir on the curvature of surfaces appears in volume 7 of Crelle''s journal in Berlin.'
  sor_juana_mexico_city:
    carta: '1690: the bishop of Puebla prints her critique of a sermon without asking her, with a letter he signs Sor Filotea.'
    respuesta: '1 March 1691: she dates her reply to Sor Filotea. In it she writes that much could be learned in a kitchen.'
    books: '1693: her books and her instruments are sold, and the money is given to the poor.'
    vows: '1694: she renews her vows.'
    death: '17 April 1695: Sor Juana dies, after nursing her sisters through the sickness in the convent.'
    printed: '1700: her reply to Sor Filotea is printed for the first time, in a volume of her works.'
  su_shi_huangzhou:
    crow_terrace: In the summer of 1079 Su Shi is arrested over his poems and held in Kaifeng.
    exile: In 1080 Su Shi comes to Huangzhou in exile.
    eastern_slope: In 1081 he clears a plot on the slope east of the town and starts to farm it.
    red_cliff: 'The sixteenth day of the seventh month: Su Shi and his guests go out in a boat below the Red Cliff.'
    later_ode: 'The full moon of the tenth month: Su Shi walks from the Snow Hall towards Lingao, two guests with him.'
    leaving: In 1084 Su Shi leaves Huangzhou.
  tagore_santiniketan:
    translation: 'November 1912: the English Gitanjali, in Tagore''s own prose translation, is published in London.'
    award: '13 November 1913: the Swedish Academy awards Tagore the Nobel Prize in Literature.'
    reception: '23 November 1913: a train brings well-wishers from Calcutta to Santiniketan; Tagore''s reply leaves many of them hurt.'
    visva_bharati: '1921: Tagore founds the university of Visva-Bharati at Santiniketan.'
    death: '7 August 1941: Rabindranath Tagore dies in Calcutta.'
  tang_xianzu_linchuan:
    dated_preface: In the autumn of 1598, Tang Xianzu dated his preface to The Peony Pavilion.
  taqi_al_din_istanbul:
    instrument_damage: 'January 1580: the observatory is dismantled. A contemporary account records that instruments are broken.'
  terence_rome:
    first_interruption: '165 BC: the first staging of The Mother-in-Law breaks off before the end.'
  tesla_wardenclyffe:
    morgan: 'March 1901: Morgan agrees to put 150,000 dollars into a wireless station for Tesla.'
    white: '13 September 1901: Tesla writes back to Stanford White about the unexpectedly high bids.'
    building: 'September 1901: building begins at Wardenclyffe.'
    marconi: '12 December 1901: at Signal Hill in Newfoundland, Marconi hears the letter S sent from Cornwall.'
    laboratory: 'June 1902: Tesla moves his laboratory into the brick building at Wardenclyffe.'
    no_more: 'July 1903: Morgan writes that he will make no further advances.'
    demolished: '4 July 1917: demolition of the Wardenclyffe tower begins.'
  timbuktu_sankore:
    departure: 'Around 1468: after Timbuktu changed hands, scholars fled. Some went to Walata.'
  tupaia_tahiti:
    boards: '12 July 1769: Tupaia comes aboard the Endeavour and says again that he wants to sail with it.'
    departs: '13 July: the Endeavour leaves Tahiti with Tupaia and the boy Taiata aboard.'
    chart: '15 August: Tupaia starts on a chart of the islands he knows, some 130 of them. Seventy four he names himself.'
    reef: 'Night of 10 June 1770: the Endeavour strikes a reef.'
    scurvy: '16 June 1770: Tupaia is down with scurvy.'
    death: 'Batavia: Banks records the deaths of Taiata and Tupaia in November.'
  ulugh_beg_samarkand:
    observatory: '1428: outside Samarkand, the building of Ulugh Beg''s observatory begins, with a great arc cut into the hill.'
    catalogue: 'About 1437: the star catalogue of Samarkand is finished, 1018 stars, most of them measured anew.'
    fall: 'Samarkand: Ulugh Beg gives up his rule and is told to leave the city.'
    death: 'Late October 1449: Ulugh Beg is killed on the road near Samarkand.'
    rediscovered: '1908: Russian archaeologists find the arc again under the hill.'
  van_gogh_auvers:
    arrival: '20 May 1890: Vincent van Gogh comes to Auvers and takes a room at the Auberge Ravoux.'
    work: He paints almost a picture a day.
    auvers_letter: 'About 10 July: he writes to Theo and Jo of vast fields of wheat under troubled skies.'
    shot: '27 July: Van Gogh shoots himself in the chest.'
    death: '29 July: Vincent van Gogh dies. His brother Theo is with him.'
  vermeer_delft:
    war: '1672: war with France and England, and the art trade of the Republic collapses.'
    loan: 'July 1675: Vermeer goes to Amsterdam to borrow a thousand guilders.'
    burial: '15 December 1675: Johannes Vermeer is buried in Delft, aged forty three.'
    baker: 'Early 1676: Catharina gives two of his paintings to the baker against 617 guilders of bread.'
    art_of_painting: '24 February 1676: Catharina passes The Art of Painting to her mother Maria Thins.'
    inventory: '29 February 1676: a notary inventories the house on the Oude Langendijk.'
    petition: 'April 1676: Catharina asks the High Court to relieve her of the debts.'
    trustee: '30 September 1676: Antonie van Leeuwenhoek is made trustee of the estate.'
    rediscovery: '1866: Thoré-Bürger publishes a catalogue of the works of Vermeer.'
  vesalius_padua:
    complaint: '13 June 1546: Vesalius wrote from Regensburg and criticised the distortions he saw in the copied figures.'
  wallace_ternate:
    fever: 'February 1858: in the Moluccas, Wallace waits for the fever to ease and makes notes for his paper.'
    signed: 'February 1858: the essay is dated at Ternate.'
    dorey_departure: '25 March 1858: Wallace and his party, including Jumaat, sail from Ternate for Dorey.'
    sent: The essay leaves Ternate on the mail steamer. Whether it was the March boat or the April one is still argued over.
    received: '18 June: in Kent, the essay reaches Charles Darwin at Down House.'
    read: '1 July: at the Linnean Society in London both papers are read. Neither author is in the room. Wallace hears of it only later.'
    jumaat_death: '26 June 1858: Jumaat dies at Dorey.'
    printed: '20 August 1858: the joint paper is printed in the Proceedings of the Linnean Society.'
  wright_kitty_hawk:
    camp: 'September: the brothers come back to their camp near Kitty Hawk. The trial is put off again and again by trouble with the machine.'
    first_try: '14 December: Wilbur wins the toss of a coin and goes first. The attempt fails.'
    first_flight: '17 December, morning: Orville flies 120 feet in 12 seconds. John T. Daniels of the life saving station presses the shutter.'
    fourth_flight: 'The fourth flight of the day is the longest: 852 feet in 59 seconds.'
    flyer_damage: A gust overturns the Flyer. The machine is badly damaged and never flies again.
    telegram: 'Afternoon: the brothers walk four miles to Kitty Hawk and telegraph their father. The message says the longest flight was 57 seconds.'
    dayton: About half past five, in Dayton, their father Milton Wright receives the telegram. The papers of Dayton hardly print a word.
  xu_xiake_lijiang:
    diary: On the sixth day of the second lunar month in 1639, Xu stayed at Jietuo Lin to collate books.
    departure: On the eighth day of the second lunar month in 1639, Xu rode down from Jietuo Lin in the rain.
    commission: On the ninth day of the second lunar month in 1639, a letter again asked Xu to compile the Gazetteer of Mount Ji.
  zeami_sado:
    island: 'Sado: Zeami, past seventy, lives out his exile on the island.'
  zhuge_liang:
    death: '234: Zhuge Liang fell ill and died with the army at Wuzhang Plains.'
    appointment: '234: After Zhuge Liang died, Jiang Wan was appointed Director of the Imperial Secretariat.'
stats:
  constitution:
    gain: Stands the long days and the sick wards, and recovers faster.
    cost: A weak constitution means catching disease and losing health in proportion.
  favor:
    name: Mood
    text: An employee's mood, 0 to 100, starting at 50. Every success raises it, every failure and giving up lowers it, and a reward of a month of wages adds 50.
    gain: Every attribute follows the mood, up to 20% more at full mood, so a good run feeds itself. A high mood also makes an employee slower to get homesick and give up.
    cost: At the bottom every attribute is 20% down, and a bad run feeds itself too. A reward costs a month of wages.
  wit:
    gain: Learns the craft of the place, treats better and finds what is wrong.
    cost: A quick mind is the first to see what it cannot change.
  finesse:
    gain: Talks its way in, wins allies and trust, and handles things with a light touch.
    cost: A smooth talker is not always believed.
  will:
    gain: Holds on at the door, and homesickness and hostility take less from them.
    cost: A strong will insists when it should give way.
  luck:
    gain: 'A lucky person is found by what is left to chance: the points that ask for luck are reached more often, and more antiques come home.'
    cost: Luck cannot be trained or bought, and it does nothing where a point asks for skill.
