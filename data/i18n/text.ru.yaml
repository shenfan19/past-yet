ui:
  about:
    update_notes: Заметки об обновлениях
    content_credit:
      mail: электронной почте
      design: Автор игры — Фань Шэнь, разработка велась с помощью ИИ.
      drafts: Истории игры, исторические справки и вымышленные истории сотрудников созданы ИИ и по мере работы проверяются автором. Отдельные участники указаны на своих карточках.
      review: Сотрудники и их истории вымышлены. Исторические подробности, изображение культур и переводы могут содержать ошибки или пропуски. Если вы нашли неточное, несправедливое, оскорбительное содержание или нарушение чьих-либо прав, сообщите об этом через {issues} или по {mail}. Автор рассмотрит сообщение и как можно скорее удалит спорный материал.
    echoes:
      title: Исторические отголоски
      rule: У каждой игровой истории есть цитаты с источниками — отголоски. Отчёт о путешествии показывает отголосок даже без звёзд, при потере синхронизации или если участвовать в событии не удалось. Звёзды и итог определяют, какая цитата появится. При медицинской эвакуации и ручном отзыве отголоска нет.
    preview:
      title: Ранняя версия
      project: Эта игра выросла из исследовательского проекта и помогает развивать его движок симуляции. Играть можно, ничего не зная об исследовании.
      changes: По мере добавления возможностей правила и действие предметов или поступков могут меняться. Мы постараемся сохранить ваш прогресс, но крупное обновление может сделать старое сохранение непригодным.
    title: Об игре The Past Is Yet to Come
    version_line: '{v}, выпуск {date}'
    dedication: Первая версия завершена 19 ноября 2026 года. История начинается у бронзовой статуи доктора Сунь Ятсена в Университете Сунь Ятсена — в честь 160-летия со дня его рождения.
    links:
      - id: site
        label: Сайт
      - id: code
        label: Исходный код
    sections:
      - h: Введение
        echoes: true
        dedication: true
        p:
          - Вы руководите агентством путешествий во времени, отправляете сотрудников в прошлое и читаете отчёты, которые они привозят домой.
      - h: Оговорка
        preview: true
        review: true
        p:
          - Игра создана для развлечения. По вопросам медицины, общественного здравоохранения или исторических исследований обращайтесь к надлежащим источникам.
      - h: Данные и конфиденциальность
        p:
          - 'Сохранение и настройки хранятся только в вашем браузере, в локальном хранилище на вашем устройстве. У страницы нет учётных записей, рекламы, cookie и сторонней слежки, и сохранение никуда не отправляется. Чтобы показать, каким по счёту путешественником вы стали, и посчитать посетителей, страница отправляет анонимные счётчики в собственную службу автора: только какая страница открыта и какой сюжет пройден. Никакой идентификатор не передаётся; сервер различает посетителей в пределах одного дня по хешу сетевого адреса и браузера и не хранит сам адрес.'
          - Выбранный язык и ваше место в интерфейсе тоже хранятся локально. Кнопка «Удалить сохранение» в настройках удаляет сохранение без возможности восстановления. Очистка данных браузера тоже удаляет всё. При обновлении игры сохранение может быть сброшено, поэтому, если хотите его сохранить, экспортируйте резервную копию в настройках.
          - Игра предназначена для взрослых. Если когда-нибудь она будет предлагаться с учётными записями или облачными функциями, сначала будет сказано, что собирается и зачем, сбор потребует вашего явного согласия, и будут соблюдаться местные законы о защите данных, такие как GDPR.
      - h: Участие
        p:
          - Игра выпущена под лицензией MIT. Интерфейс и логика — статические веб-файлы без бэкенда, а файлы данных написаны в YAML и читаются библиотекой js-yaml, тоже под лицензией MIT.
          - Предложения и критика очень приветствуются, как и идеи новых событий и сотрудников, а также любые данные или источники, которые сделают их точнее. События с их реликвиями, сотрудники, черты и переводы — это простые yaml-карточки в папке cards, а cards/README.md объясняет, как добавить свою.
          - Принятые вклады публикуются здесь под вашим именем, другим именем или псевдонимом, как вы предпочтёте, и работа остаётся вашей. Как и игра, они выпускаются под лицензией MIT, чтобы другие могли и дальше ими пользоваться и улучшать их. Пожалуйста, указывайте источник для каждого исторического утверждения, чтобы его можно было проверить.
      - h: Автор
        p:
          - Я Фань Шэнь, исследую моделирование и симуляцию динамических систем, и это мой личный проект. Его структуры данных и логика расчётов — моя работа.
          - Каждая эпоха — это открытая YAML-модель. Сотрудники и исторические лица — агенты, выбирающие действия по полезности, события случайны, но заданы зерном, и каждый прогон сравнивается с прогоном с тем же зерном, но без сотрудника. Код только интерпретирует файлы. У каждого числа есть метка источника, отличающая исторические факты, модели, допущения игры и откалиброванные значения, а в режиме разработчика энциклопедия показывает формулы и переменные. Движок — упрощённая версия на JavaScript движка, улучшенного на основе бэкенда исследовательского проекта, а модели этого прототипа не подогнаны под данные.
          - Life Matters (LM) — открытый исследовательский проект, предложенный мной. Он строит формат LM на YAML, чтобы свести воедино выводы из разделов медицины, психологии и социологии, и описывает динамическими моделями, как элементы повседневной жизни влияют на здоровье. Формат открыт в надежде, что люди будут им пользоваться, строить с ним модели, делиться ими и работать вместе. Он ещё в разработке.
          - Care for You — тоже подпроект LM, игра о домашнем уходе за близкими, работающая так же на движке, улучшенном на основе бэкенда LM.
        links: 0
      - h: Благодарности и лицензия
        credits: true
        p:
          - 'Эту игру вдохновили другие игры: энциклопедия следует Цивилопедии Civilization IV, отправка человека и чтение о том, что случилось, — Assassin''s Creed Brotherhood и Travel Frog, найм — Heroes of Might and Magic, часы и музыкальный проигрыватель — Stellaris, а звёзды и уровни — Plants vs. Zombies и полной синхронизации Assassin''s Creed. Они названы в знак благодарности и никак не связаны с этой игрой.'
          - Контуры карты мира взяты из Natural Earth и находятся в общественном достоянии.
          - Музыка — MIDI-файлы проекта Mutopia, волонтёры которого набрали их по изданиям в общественном достоянии произведений Баха, Бетховена, Шопена, Дебюсси, Грига, Джоплина, Моцарта и Сати, а также народных песен Англии, Финляндии и Японии. В заголовке каждой пьесы указано Public Domain. Файлы хранятся без изменений в папке assets. Любой файл, положенный в эту папку, попадает в плейлист при сборке данных. Звуковые эффекты — тоны, которые создаёт сама страница.
          - Исторические источники перечислены в энциклопедии, у каждого указано, проверен ли он.
          - Название и логотип не распространяются по лицензии MIT.
