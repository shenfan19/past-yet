  header_lines:
    - line: Иду вверх по течению — дорога крута и трудна.
      source: «Книга песен», «Тростник»
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Иду вниз по течению — и будто ты там, на островке посреди реки.
      source: «Книга песен», «Тростник»
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: Я здесь уже бывал, но где и как — не знаю.
      source: Д. Г. Россетти, «Внезапный свет»
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: Когда же вновь увижу я дым над трубой моей деревушки?
      source: Жоашен дю Белле, «Сожаления»
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: Вернутся тёмные ласточки вить гнёзда на твоём балконе.
      source: Густаво Адольфо Беккер, Рима LIII
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: Цветы рапса. Луна на востоке, солнце на западе.
      source: Ёса Бусон, хайку
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: Одна звезда — для памяти, другая — для любви.
      source: Юн Дон Джу, «Ночь, когда считаю звёзды»
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: Время укрывает зелёным плащом землю, что лежала под холодным снегом.
      source: Луис де Камоэнс, сонеты
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: На старой карте дорога домой всё ещё есть.
    - line: Номер дома сменился. А послеполуденный свет падает на то же место.
    - line: Следующая остановка — давным-давно.
