catalog:
  euclid_alexandria:
    name: Пока сохранялись «Поризмы»
    place: Александрия
    figure: Евклид
    story: Около 300 года до н. э. Евклид написал в Александрии тринадцать книг «Начал», доказывая геометрические положения шаг за шагом из определений и постулатов. Он написал также три книги «Поризмов», труд о конических сечениях и другие сочинения, которые позже утратили. В IV веке Папп ещё мог описать «Поризмы» и сосчитать их предложения.
    relic: Бронзовый циркуль
    relic_desc: Две ножки и шарнир, чтобы вычертить любую фигуру из книги.
    points:
      p1: Помочь сделать несколько копий трёх книг «Поризмов» и передать их ученикам, чтобы сочинение сохранилось
    points_fail:
      p1: У «Поризмов» по-прежнему была одна цепочка списков. Книги исчезли и в этой ветви, остались только несколько строк Паппа.
    shift:
      p1:
        was: Около 300 года до н. э. Евклид написал три книги «Поризмов». Сочинение утрачено, и о нём известны только число 171 и краткое описание, данное Паппом в IV веке.
        now: При содействии {staff} с «Поризмов» сняли несколько копий и передали их ученикам, изучавшим геометрию. В этой ветви книга дошла до потомков.
        who: euclid_alexandria
        bio: В этой ветви «Поризмы» разошлись по разным рукам и уцелели. У позднейших читателей остались и другие работы Евклида помимо «Начал».
    vignettes:
      lost: На столе переписчика {staff} видит свиток «Поризмов». Позднейшим читателям придётся судить о нём по нескольким строкам Паппа. {staff} на миг задерживает ладонь на краю свитка.
      arcs: '{staff} чертит окружности на песке с помощью колышка и шнура, как это делают ученики. Две дуги пересекаются в третьей точке. {staff} разравнивает песок и чертит снова, теперь более твёрдой рукой.'
      papyrus: '{staff} помогает торговцу папирусом перенести связки на пристань. Торговец рассказывает, какие листы переносят портовую сырость, а какие через год становятся ломкими.'
    story_prose:
      opening:
        - Александрия, около 300 года до н. э. Здесь Евклид пишет тринадцать книг «Начал» и выводит геометрические положения одно за другим из определений и постулатов. В первом же предложении двух окружностей хватает, чтобы построить равносторонний треугольник на заданном отрезке. Евклид пишет также три книги «Поризмов» и труд о конических сечениях.
        - В истории «Поризмы» со временем исчезли. Около 320 года н. э. Папп ещё мог описать их и насчитал 171 теорему и 38 лемм. Позднейшие списки неизвестны. В этой ветви один ученик чертит фигуры на дощечке с песком, а торговец на пристани знает, какой папирус не отсыреет.
        - Здесь пригодится тот, кто умеет переписывать, сверять и хранить книги. Пригодится и учитель геометрии, способный вести группу учеников, или внимательный знаток, готовый сверять строку за строкой.
      outcomes:
        all: На полках у читателей следующих поколений рядом с «Началами» стоят три свитка «Поризмов». Их края размягчились от частого чтения.
        p1: На полках у читателей следующих поколений рядом с «Началами» стоят три свитка «Поризмов». Их края размягчились от частого чтения.
      none: Песок разровняли и начертили новые окружности. После Паппа этих трёх книг никто больше не разворачивал.
      not_admitted: '{staff} так и не попадает в комнату переписчиков. На пристани торговец всё ещё переносит на берег связки папируса.'
      points:
        p1:
          class_teaching: Опыт преподавания подсказывает {staff} поручить по книге «Поризмов» самым внимательным ученикам у песчаной доски, а затем дать им сверить свои копии вслух, слово за словом и чертёж за чертежом. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.
          class_lettered: По правилам переписной мастерской {staff} нарезает папирус, переписывает три книги «Поризмов» и сверяет с подлинником каждую строку и каждый чертёж. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.
          else: '{staff} следит за работой переписчиков. Каждый готовый свиток «Поризмов» ложится рядом с подлинником, чтобы можно было сверить рисунки один за другим. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.'
      excerpts:
        p1: Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.
  socrates_athens:
    name: Пока корабль в море
    place: Афины
    figure: Сократ
    story: В 399 году до н. э. Сократа судили в Афинах и приговорили к смерти. Корабль, который афиняне каждый год отправляли на Делос, только что отплыл. До его возвращения казни были запрещены, и Сократ провёл в тюрьме около тридцати дней. Там он перелагал басни Эзопа в стихи, а друзья навещали его каждый день. В последний вечер пришли все, кроме заболевшего Платона, и Сократ выпил цикуту.
    relic: Глиняная чаша с рынка
    relic_desc: Афинская чаша в чёрной глазури с небольшим сколом на краю.
    points:
      p1: Утихомирить присяжных, чтобы Сократ смог закончить защитную речь
      p2: Помочь закончить переложение басен Эзопа и гимн Аполлону и передать копию из тюрьмы
      p3: Вылечить Платона до последнего дня, чтобы он мог быть рядом с учителем в тюрьме
    points_fail:
      p1: Шум заглушает защитную речь, и закончить её не удаётся. Ветвь теряет синхронизацию, и агентство отзывает сотрудника.
      p2: Стихи в этой ветви не сохранились, как и в истории.
      p3: Как и в истории, Платон болен в тот день и не приходит к учителю.
    shift:
      p1:
        was: 399 год до н. э. Сократа судят в Афинах. В платоновской «Апологии» он раз за разом просит присяжных не шуметь. Его признают виновным и приговаривают к смерти.
      p2:
        was: 399 год до н. э. В ожидании казни Сократ по велению повторяющегося сна переложил басни Эзопа в стихи и написал гимн Аполлону. Ничего целиком не сохранилось.
        now: Один из друзей вынес из тюрьмы свиток с копией стихов, и тот остался в Афинах.
      p3:
        was: 399 год до н. э. В день, когда Сократ выпил цикуту, друзья были с ним в тюрьме. Платон болел и не пришёл.
        now: Платон выздоровел, пришёл в тюрьму к друзьям и остался до конца.
        who: plato_academy
        bio: В этой ветви Платон выздоровел и провёл последний день Сократа рядом с ним в тюрьме.
    vignettes:
      rumours: Накануне суда {staff} спрашивает в трёх лавках на площади, в чём обвиняют старика, и получает три разных ответа. {staff} записывает все три и ждёт, какой прозвучит в суде.
      harbour: Каждый вечер {staff} спускается в Пирей и спрашивает торговца рыбой, пришёл ли корабль с Делоса. Ответ всё тот же, и {staff} не знает, ждать возвращения или надеяться на задержку.
      gate: '{staff} носит воду продавщице масла и получает за это место у тюремной стены. Посетители ждут у ворот с рассвета, и {staff} понемногу запоминает их лица.'
    story_prose:
      opening:
        - Афины, 399 год до н. э. Сократу предстоит суд по обвинению в нечестии и развращении молодёжи. Всю жизнь он задавал людям вопросы на улицах и на площади. Сам он не написал ни одной книги, и потомки знают его по сочинениям Платона и Ксенофонта.
        - В истории корабль на Делос ушёл накануне суда. До его возвращения казнить никого нельзя, и Сократ проводит в тюрьме ещё около тридцати дней. По велению повторяющегося сна он переложил басни Эзопа в стихи, но стихи не сохранились. В последний день пришли все друзья, кроме заболевшего Платона. В этой ветви у тюремной стены женщина продаёт масло для светильников, а торговец рыбой в Пирее видит каждый входящий корабль.
        - Пригодится тот, кто умеет унять шумную толпу, тот, кто может записать стихи и переписать их на свиток, и тот, кто знает лекарства и умеет лечить.
      outcomes:
        all: Корабль с Делоса вернулся, и торговец рыбой издали заметил парус. В последний вечер тюрьма полна друзей, и Платон сидит среди них. Потом свиток со стихами ещё долго лежит на дне сундука в одном афинском доме.
        p3: В последний вечер тюрьма полна друзей. Платон сидит среди них до самого конца.
        p2: Свиток со стихами пролежал годы на дне сундука в афинском доме. Края папируса истрепались.
        p1: Через тридцать дней корабль с Делоса вошёл в Пирей, и торговец рыбой издали заметил его парус. В тот день друзья с рассвета стояли у ворот тюрьмы.
      none: Корабль с Делоса вернулся, и торговец рыбой издали заметил парус. Вечером друзья в тюрьме сели в круг. Никто не заговорил первым.
      desync: Шум в суде нарастал, и защитная речь оборвалась на полуслове. Агентство отозвало {staff} прямо из зала.
      not_admitted: '{staff} так и не удаётся устроиться в Афинах, даже присесть у подножия тюремной стены негде. Корабль с Делоса всё ещё в море.'
      points:
        p1: В день суда присяжные заполнили ряды деревянных скамей. Каждые несколько фраз поднимался крик и заглушал Сократа. {staff} встаёт среди слушателей, молча и медленно опускает ладони, обводит взглядом ряд за рядом и садится лишь тогда, когда шум стихает. Сократ продолжил с той фразы, на которой его перебили. Закончив, он подобрал край плаща и замер на возвышении.
        p2: В тюрьму свет попадал только из маленького окна высоко в стене. Сократ произносит строку, а {staff} записывает её на восковой табличке и читает вслух, отбивая ритм. Если доля лишняя, воск разглаживают и строку пишут заново. За стихами из басен Эзопа следует гимн Аполлону. Ночью у стены {staff} при свете масляного светильника переносит строки с табличек на папирус. Рано утром один из друзей прячет свиток под одеждой и выходит из тюрьмы, прижимая ладонь к груди.
        p3:
          class_medical: Накануне последнего дня Платон ещё болел и не мог встать с постели. {staff} осматривает его, как подобает врачу, готовит лекарство, даёт его в положенное время и всю ночь остаётся у постели. Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.
          else: Накануне последнего дня Платон ещё болел и не мог встать с постели. {staff} открывает наноаптечку, проводит лечение по инструкции и всю ночь остаётся у постели. Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.
      excerpts:
        p3: Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.
        p2: Ночью у стены {staff} при свете масляного светильника переносит строки с табличек на папирус. Рано утром один из друзей прячет свиток под одеждой и выходит из тюрьмы, прижимая ладонь к груди.
        p1: Сократ продолжил с той фразы, на которой его перебили. Закончив, он подобрал край плаща и замер на возвышении.
  cao_xueqin_beijing:
    name: Чистый лист после последней главы
    place: Западные горы, Пекин
    figure: Цао Сюэцинь
    story: Ранняя рукопись «Истории камня» свидетельствует, что аннотированные копии распространялись при жизни Цао Сюэциня. Одна более поздняя заметка на полях этой рукописи связывает смерть Цао с книгой, оставшейся незавершенной. Сценарий разворачивается в его последнюю зиму, без указания точной даты его смерти или количества написанных им глав.
    story_prose:
      opening:
        - В Западных Холмах темнеет рано. Заходит переписчик с пачкой страниц и спрашивает, что можно взять с собой. Он кладет сверток на столик у кровати. Сверху лежит чистый лист.
        - Аннотированные копии «Истории камня» циркулировали еще при жизни Цао Сюэциня. В более поздней записи в рукописи Цзясюй говорится, что он умер до того, как книга была закончена. Во время этого воображаемого зимнего визита у него еще есть время самому разобраться со стопкой.
        - Переписчик хочет вернуться домой до наступления темноты. Кто-то, кто знает рукописи, может выбрать аннотированную копию среди рабочих страниц. Тот, кто привык заботиться о других, может присматривать за огнем и лампой. Тогда на столе останется место, чтобы разложить черновик.
      points:
        p1: Переписчик собирается перевязать стопку разрозненных страниц у кровати. Вы замечаете на полях строку, написанную другой рукой, и просите его прочитать ее. Он упаковывает аннотированную копию отдельно и кладет страницы, которые Цао все еще просматривает, обратно в доступную область. Каждый свёрток перевязан своей бечёвкой.
        p2: Когда угли гаснут, Цао закрывает страницу, на которую только что открыл. Вы просите человека, приносящего уголь, ухаживать за огнем, ставите лампу поближе и передаете Цао только страницу, которую он читает. Он вытягивает руку из-под чехла и снова берет трубку. В тот вечер лампа стоит у него под рукой.
        p3: Вы рассказываете Цао, что в позднем продолжении род снова процветает. Он хмурится, открывает конец песни о разлетающихся птицах в пятой главе и указывает на строки о земле, ставшей белым пустым полем. Вы раскрываете рукопись с примечаниями и спрашиваете, правы ли потомки, которые читают эту книгу как скорбь о падении династии Мин. Цао громко смеётся. Ни слова в ответ. Взяв кисть, он отмечает только те страницы, по которым уже принял решение. Переписчик следует пометкам, а остальное оставляет пустым.
      outcomes:
        all: Переписчик уходит с двумя листами. Прочитанные вместе, они показывают, какие главы Цао привел в порядок и какой выбор он все еще обдумывал. Никто не записывает, что он имел в виду под смехом.
        p1: Переписчик уходит с ранним аннотированным экземпляром. Черновик, который Цао все еще хочет прочитать, остается у кровати.
        p2: Лампа у кровати еще немного горит. Цао заканчивает отложенную страницу.
        p3: Отмеченные части копируются, а нерешенные места остаются пустыми. Переписчик оставляет свои догадки.
      none: Страницы сложены в стопку, в которой они были доставлены. Позже, когда кто-то спрашивает о последних главах, пустой лист не дает ответа.
      not_admitted: Переписчик заходит внутрь. Вы ждете, пока во дворе останется одна лампа, так и не доставив бумаги на тумбочку.
      desync: Аннотированная копия возвращается к рабочим страницам. Переписчик уходит без него, и контора вас отзывает.
      excerpts:
        p1: Каждый свёрток перевязан своей бечёвкой.
        p2: В тот вечер лампа стоит у него под рукой.
        p3: Переписчик следует пометкам, а остальное оставляет пустым.
    relic: Незакрепленный лист с планами глав
    relic_desc: Сувенир из игры с предложенным порядком на несколько глав и пустым местом для того, что еще предстоит решить Цао.
    points:
      p1: Держите ранний экземпляр с аннотациями в руках переписчика, пока рабочие страницы Цао не будут возвращены ему.
      p2: Следите за огнем и копированием, чтобы Цао мог провести один хороший вечер, обдумывая финал.
      p3: Пока у Цао еще есть силы просмотреть его, оставьте отдельный экземпляр плана отделения, который он согласен передать.
    points_fail:
      p1: Единственная копия на этом столе возвращается в стопку рабочих страниц. В эту ветку читатель уходит без аннотированного текста.
      p2: В комнате становится холодно еще до того, как бумаги готовы. Работа ждет еще вечера.
      p3: Переписчик может разложить отдельные страницы, но не знает, какой финал Цао хотел оставить.
    shift:
      p1:
        was: В рукописи Цзясюй сохранились примечания к раннему тексту, который копировался при жизни Цао Сюэциня.
      p2:
        was: В заметке на полях рукописи Цзясюй упоминается о смерти Цао и говорится, что книга осталась незавершенной.
        now: В этом отделении кто-то поддерживает огонь и приносит страницы по одной. У Цао есть один вечер, чтобы решить, куда он хочет, чтобы история развивалась.
      p3:
        was: В примечании на полях Цзясюй книга названа незавершенной и не приводится окончательный план глав, одобренный Цао.
        now: Переписчик забирает два листа. В этой ветке отдается приказ, одобренный Цао. Другой перечисляет судьбы, которые ему еще предстоит решить. При следующем копировании два листа останутся вместе.
        who: cao_xueqin_beijing
        bio: Перед смертью Цао просматривает план отделения с переписчиком. В этой ветке позже читатели смогут увидеть, какие решения он принял и где оставил концовку открытой.
    vignettes:
      ink: Переписчик делает разрыв между предлагаемым порядком глав и карандашным предположением читателя. Теперь страницы можно вернуть в нужные места.
      paper: '{staff} несет лампу. Переписчик отодвигает рукопись от края стола, чтобы освободить место.'
      empty: На последнем листе есть место для еще одного заголовка. Переписчик оставляет пространство как есть.
  jenner_berkeley:
    name: Первая вакцина
    place: Беркли, Англия
    figure: Эдвард Дженнер
    story: В расследовании Дженнера 1798 года зафиксированы более ранние наблюдения и случаи коровьей оспы и оспы.
    story_prose:
      opening:
        - В Беркли Сара Нелмс подходит к двери, прижав руку к фартуку. Дженнер хочет спросить, когда она впервые заболела. Переписчик помещает свое имя под чужой учетной записью. Она ждет у двери и сначала спрашивает, нужно ли ей сегодня вернуться на молочную ферму.
        - В расследовании Дженнера 1798 года зафиксированы коровья оспа Сары и ранняя вакцинация в 1796 году, традиционно связываемая с Джеймсом Фиппсом. В этом разделе вы можете начать с заботы, которую хочет Сара, и помочь в последующих наблюдениях, связанных с людьми, которые вернулись.
        - Пусть сначала Сару выслушает кто-нибудь с опытом ухода. Путешественник, ведущий записи, может проверить имена и даты, пока Дженнер и семьи решают, возвращаться ли для дальнейших наблюдений.
      points:
        p1: Переписчик ждет свидания. Сара убирает руку и просит присесть. Вы придвигаете стул к двери и спрашиваете, хочет ли она, чтобы за ней присмотрела сиделка. Как только она скажет «да», вы сообщите на молочную ферму, что она вернется позже. На выходе Сара свободной рукой берёт листок со своим именем.
        p2: Страница записной книжки Дженнер описывает ответный визит мальчика, но под ней для проверки еще не указана дата. Вы даете переписчику новый лист для отделения записей из первых рук от последующих отчетов. Дженнер спрашивает, кто вернется для дальнейшего наблюдения. Одно домохозяйство оставляет свой адрес. Переписчик ставит дату и оставляет строчку, чтобы семья могла сверить её по прибытии.
      outcomes:
        all: Саре есть кому помочь, а у людей, которые возвращаются, есть записи, которые можно проверить. Дженнер может продолжить работу над наблюдениями того года.
        p1: Саре может пройти несколько дней, прежде чем она вернется на молочную ферму. Более поздние записи все еще зависят от возвращения других людей.
        p2: Есть последующие наблюдения, к которым можно обратиться. Саре все еще приходится терпеть больную руку самостоятельно.
      none: Сара возвращается на молочную ферму без посторонней помощи, и последующие наблюдения никто не устраивает.
      not_admitted: Переписчик проверяет, с какой семьей пришел посетитель. Вы остаетесь снаружи, а место возле даты все еще пусто.
      excerpts:
        p1: На выходе Сара свободной рукой берёт листок со своим именем.
        p2: Переписчик ставит дату и оставляет строчку, чтобы семья могла сверить её по прибытии.
    relic: Последующий промах
    relic_desc: Бланк с именем, датой и местом для записи того, что наблюдалось.
    points:
      p1: Перевяжите язвы коровьей оспы на руке Сары Нельмс, чтобы доярка не страдала от них одна.
      p2: Проверьте имена и даты в первых описаниях случаев и организуйте последующее наблюдение с семьями, которые согласились вернуться.
    points_fail:
      p1: Язвы на ее руке затянулись, и никто их не перевязал. В этом отделении никто не облегчал будни доярки.
      p2: Никто не организует ответный визит. В этой отрасли, как и в истории, Дженнер возобновляет свои исследования вакцинации в 1798 году.
    shift:
      p1:
        was: В мае 1796 года доярка Сара Нельмес заразилась коровьей оспой от коров своего хозяина, и на ее руке образовалась большая гнойничковая язва с обычными симптомами болезни.
        now: '{staff} держал ее руки чистыми и связанными, и на несколько дней раньше она вернулась на молочную ферму.'
      p2:
        was: После первого случая в 1796 году Дженнер возобновил исследования вакцинации весной 1798 года.
        now: '{staff} помог организовать повторные визиты с желающими семьями. Тем летом у Дженнер были дополнительные записи, которые нужно было сверить с предыдущими наблюдениями.'
        who: jenner_berkeley
        bio: В этот график Дженнер получил последующие записки от семей, которые согласились вернуться летом 1796 года.
    vignettes:
      firsthand: Вымышленный переписчик написал все отчеты одним и тем же голосом. Вы спрашиваете, какой из них на самом деле видел писатель. Переписчик добавляет примечание рядом с остальными, вместо того, чтобы придавать каждой строке одинаковый вес.
      order: Два наблюдения поменялись местами в копии. Вы проверяете даты, и переписчик переворачивает листы, прежде чем использовать порядок рассказа.
      blank: Вы оставляете место под запиской, которую переписчик не может подтвердить. К моменту передачи страницы на бланке уже есть метка, поэтому никто не примет его за пропуск.
  mallory_everest:
    name: Последний раз их видели на подъёме
    place: Эверест
    figure: Джордж Мэллори
    story: Сохранившиеся письма Мэллори из экспедиции 1924 года описывают условия и планы в разных лагерях. Судьба Мэллори и Ирвина не позволяет установить, достигли ли они вершины.
    story_prose:
      opening:
        - Кто-то у палатки Северного седла спрашивает, может ли Нортон открыть глаза после спуска. Другой альпинист смотрит на Мэллори, которая готовится идти следующей. Компас из предыдущей палатки с ним не вернулся.
        - Нортон и Сомервелл вернулись на Эверест в 1924 году. Следующими пошли Мэллори и Ирвин. 8 июня Оделл увидел двух альпинистов, все еще идущих вверх, но ни один из них не вернулся. В этой ветке вы можете помочь предыдущей группе, вернуть компас и помочь следующей паре вернуться на Северное седло.
        - Отправьте кого-нибудь, кто сможет позаботиться о Нортоне и Сомервелле. Путешественник, знакомый с передачей лагерей, может найти компас. Для последнего спуска отправьте кого-нибудь, кто поможет следующей группе вернуться в лагерь.
      points:
        p1: Нортон снова окликает Сомервелла. Тот не может ответить и кладёт руку на колено. Вы зовёте обратно одного из тех, кто ушёл вперёд, чтобы найти Сомервеллу место для отдыха. Вы ждёте, пока он сможет рассказать, как себя чувствует. Он кивает, и вы вместе отодвигаете сумку у его ног. Поднявшись, он ждёт, пока Нортон закончит спрашивать, как он себя чувствует.
        p2: Нортон говорит, что свет причиняет боль, и снова закрывает глаза. Вы просите его выбрать, где отдохнуть, и позволяете сиделке в офисе присмотреть за ним. Через некоторое время он говорит, что одно место все еще болит, а другим глазом он может различить свет. Когда служащий снова поднимает список, Нортон сам находит свою строку.
        p3: Оделл открывает чемодан в лагере V и рядом с запасным предметом находит небольшую круглую коробку. Вы сверяете его с сообщением Мэллори и приносите с пометкой. Он открывает его на глазах у другого альпиниста и кладет в карман, который планирует использовать по пути наверх. Он сам убирает компас туда, откуда его можно достать, не снимая рюкзака.
        p4: Кто-то на Северном седле спрашивает, являются ли две фигуры, выходящие из облака, теми людьми, которых они ждут. Вы ждете, пока они назовут свои имена, прежде чем попросить клерка ввести их. Мэллори кладет рюкзак на снег, а Ирвин садится дальше. Они рассказывают о спуске. В лагере никто не знает, добрались ли они до вершины и в котором часу.
      outcomes:
        all: Сомервелл и Нортон возвращаются, и у Мэллори есть компас. Еще два имени занесены в историю, как только они вернулись на Северное седло.
        p1: Оба альпиниста из первой группы возвращаются в лагерь. Следующей паре все равно понадобится кто-то, кто их встретит.
        p2: В этой ветке Нортон видит достаточно хорошо, чтобы самому прочитать написанное рядом. Другие результаты последуют за оставшейся частью поездки.
        p3: У Мэллори компас в кармане, до которого он может дотянуться. Его возвращение оставляет неопределенным их самую дальнюю точку.
        p4: Мэллори и Ирвин живыми возвращаются на Северное седло. Измененный спуск оставляет открытым вопрос, достигли ли они вершины.
      none: Ветер и снег доходят до лагеря, и список никто не меняет. Позже Оделл запишет две фигуры, которые он в последний раз видел на хребте.
      not_admitted: Служитель лагеря не предоставит постороннему человеку место в палатке. Вы ждете снаружи, пока они обсуждают недостающее оборудование.
      desync: Сомервелл никогда не возвращается с Нортоном. Предыдущий спуск рассинхронизируется, и офис отзывает путешественника.
      excerpts:
        p1: Поднявшись, он ждёт, пока Нортон закончит спрашивать, как он себя чувствует.
        p2: Когда служащий снова поднимает список, Нортон сам находит свою строку.
        p3: Он сам убирает компас туда, откуда его можно достать, не снимая рюкзака.
        p4: Они рассказывают о спуске. В лагере никто не знает, добрались ли они до вершины и в котором часу.
    relic: Ледоруб
    relic_desc: Обычный деревянный ледоруб с потертой головкой.
    points:
      p1: Когда Сомервелл задохнется при спуске, помогите ему восстановить дыхание и увидите, как попытка, которую он предпринял с Нортоном, благополучно закончится.
      p2: Вылечить Нортона от снежной слепоты
      p3: Возьмите в руки компас, оставленный Мэллори в лагере V.
      p4: Поверните Мэллори и Ирвина обратно или встретите их на пути вниз, чтобы оба дошли до Северного седла живыми.
    points_fail:
      p1: Сомервелл садится на снег и не встает. Только один из двух альпинистов возвращается. Этот филиал отошел от истории, и офис отзывает сотрудника.
      p2: Глаза Нортона слишком сильно болят, чтобы их открыть, и следующие дни он ничего не видит.
      p3: Компас все еще находится в палатке лагеря V. Когда они поднимаются 8 июня, у них его не оказалось.
      p4: Где-то после полудня 8 июня Оделл в последний раз видел двоих высоко на гребне, которые все еще карабкались. Они не возвращаются.
    shift:
      p1:
        was: 4 июня 1924 года Нортон и Сомервелл вышли из лагеря VI и достигли высоты около 8570 м; По пути вниз горло Сомервелла было заблокировано обмороженной тканью, и он чуть не задохнулся, закашлялся, и оба добрались до лагеря.
      p2:
        was: В ночь на 4 июня 1924 года Нортон сильно ослеп из-за снега и едва мог видеть после того, как вернулся на Северное седло.
        now: На следующий день глаза Нортона прояснились, и он мог видеть людей, приходящих и уходящих на Северное седло.
      p3:
        was: 7 июня 1924 года Мэллори отправил Оделлу записку из лагеря VI, в которой говорилось, что он оставил свой компас в палатке лагеря V, а у них его нет.
        now: Когда они отправились рано утром 8 июня, у Мэллори компас был в кармане.
      p4:
        was: 8 июня 1924 года Оделл в последний раз видел, как Мэллори и Ирвин поднимались высоко на северо-восточный гребень, и ни один из них не вернулся; Тело Мэллори было найдено в 1999 году на высоте около 8160 метров.
        now: 9 июня они спустились к Северному седлу, обмороженные, но живые. Мэллори уехала домой в Англию, к Рут и их трем детям. Куда они попали в тот день, эта хронология также не дает ответа.
        who: mallory_everest
        bio: В 1924 году он и Ирвин спустились с Эвереста живыми. Он вернулся домой к своей жене Руфи и трем детям и прожил еще много лет.
    vignettes:
      date: У вымышленного посыльного на бланке есть два письма из разных лагерей, но одна общая дата. Вы просите их проверить заголовки отдельно. Каждое письмо уходит со своим местом и датой.
      question: Посланник воспринимает предполагаемый отъезд как обещание. Вы останавливаетесь на предложении, где в письме говорится о погоде. На этот раз они повторяют план, сохраняя при этом условие.
      wrap: Вы откладываете исходящий конверт, пока посыльный сортирует бумаги у него на коленях. Они могут убрать список лагерей, не складывая его в письмо.
  nightingale_scutari:
    name: 'Сестринское дело: наблюдение и забота'
    place: Скутари, Османская империя
    figure: Флоренс Найтингейл
    story: Отчет Флоренс Найтингейл о здоровье армии за 1858 год опирался на недавнюю войну и включал статистику больниц. это не создание окончательного отчета.
    story_prose:
      opening:
        - В Скутари только что сменилась палата. Найтингейл передает клерку список переводов и просит хранить его отдельно от новых поступлений. Санитарная комиссия прибыла, и трое членов комиссии собираются осмотреть окрестности.
        - Санитарная комиссия проинспектировала больницы Скутари в марте 1855 года. Гектор Гэвин погиб в результате несчастного случая в Балаклаве в апреле. В мае Найтингейл серьезно заболел и выздоровел от первой болезни, после чего у нее ухудшилось здоровье. Здесь вы можете сохранить осмотры и изменить, что с ними происходит.
        - Кто-то, знакомый с записями отделения, может помочь проверке продолжить работу. В лагере попросите путешественника присмотреть за Гэвином. Позже кто-то, осуществляющий уход, может спросить Найтингейл, как она хочет отдохнуть.
      points:
        p1: Клерк считает список переводов новыми поступлениями. Вы просите медсестру прочитать оба листа и отметить дубликаты до того, как члены комиссии доберутся до двери. Они могут проследить за отчетом до отделения с проблемой, прежде чем спрашивать о следующем месте. Кто-то выходит с двумя отдельными журналами. В каждом ещё много чистых страниц.
        p2: Гэвин собирается передать револьвер своему брату в палатке. Вы просите обоих сделать паузу, пока человек, ответственный за безопасность лагеря, не придет и не заберет его. За столом внутри Гэвин открывает санитарные записи, которые собирался забрать. Когда днём кому-то нужна его подпись, он всё ещё сидит за тем же столом.
        p3: Найтингейл посылает за таблицей цифр и просит отложить ее, когда она придет. Вы спрашиваете, хочет ли она, чтобы сиделка осталась, и говорите людям, ожидающим ответа, что они придут в другой день. Когда она чувствует себя сильнее, она сначала просит их немного приоткрыть окно. Затем она спрашивает, где она остановилась. Когда она снова открывает отчёт, никто не торопит её с подписью.
      outcomes:
        all: Проверка продолжается вовремя. Гэвин выживает в аварии в этом отделении, а Найтингейл выздоравливает от Мэйской болезни. Она возвращается к работе в темпе, который может выбрать.
        p1: Комиссия начинает проверку и забирает списки, пригодные для дальнейшей работы.
        p2: Гэвин остается в безопасности в лагере. Он может продолжать работу, записанную в его санитарных записях.
        p3: В этой ветке Найтингейл быстрее выздоравливает. Она выбирает, когда будет готова снова открыть фигурки.
      none: Некоторое время в отделении списки остаются смешанными. Люди, ожидающие новостей, все равно будут ждать писем от апреля и мая.
      not_admitted: Носильщик просит людей, не входящих в инспекционную группу, подождать. Вы слышите, как медсестра снова проверяет список переводов.
      desync: Проверка не начинается вовремя. Записи прихода рассинхронизируются, и офис отзывает путешественника.
      excerpts:
        p1: Кто-то выходит с двумя отдельными журналами. В каждом ещё много чистых страниц.
        p2: Когда днём кому-то нужна его подпись, он всё ещё сидит за тем же столом.
        p3: Когда она снова открывает отчёт, никто не торопит её с подписью.
    relic: Маленькая масляная лампа
    relic_desc: Лампа из ее ночных обходов.
    points:
