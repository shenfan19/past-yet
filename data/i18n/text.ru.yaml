  welcome:
    title: Добро пожаловать
    office_title: Начало игры
    acknowledge: Понятно
    story:
      - Вы руководите агентством путешествий во времени. Нанимайте сотрудников и отправляйте их в прошлое.
      - Стойте на страже в те мгновения, когда история могла пойти иначе, и исправляйте в параллельной линии времени то, что она оставила несделанным.
      - Охраненные мгновения и исправленные сожаления приносят энергию времени. Наберите её достаточно, чтобы вернуться в будущее и встретиться с семьёй.
    story_start: Всё начинается у бронзовой статуи доктора Сунь Ятсена в Университете Сунь Ятсена. В память о докторе Сунь Ятсене, к 160-летию со дня его рождения.
    how_title: Как играть
    how:
      - Выберите место на карте и время, куда хотите попасть. Часы пойдут с первым путешествием.
      - Решите, кто отправится и что возьмёт с собой, и отправьте.
      - Дождитесь возвращения сотрудников и прочитайте их отчёты. Они привозят энергию времени, а иногда и древности. Передайте древности институту и получите исследовательский грант.
      - Древность открывает место, на которое указывает, и ведёт только в более ранние времена.
