  welcome:
    story:
      - あなたは時間旅行事務所の所長です。スタッフを雇い、過去へ送り出します。
      - 歴史が変わりかねない瞬間には起こるべきことを守り、並行する時間軸では歴史が残した心残りを埋めます。
      - 守った出来事や埋めた心残りから時空エネルギーが得られます。十分に集めれば、未来へ帰り、家族と再会できます。
    story_start: すべては中山大学の孫文先生の銅像の前から始まります。先生の生誕160周年を記念して、本作を捧げます。
    disclaimer_title: 免責事項
  header_lines:
    - line: 流れをさかのぼって追う。道は険しく、登り坂。
      source: 『詩経』秦風・蒹葭
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: 流れに沿って追う。あなたは川の中州にいるようだ。
      source: 『詩経』秦風・蒹葭
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: ここへは前に来たことがある。いつ、どうやって来たのかはわからない。
      source: D・G・ロセッティ「突然の光」
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: いつまた、あの小さな村の煙突から煙がのぼるのを見られるだろう。
      source: ジョアシャン・デュ・ベレー『哀惜詩集』
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: 黒いツバメが帰ってきて、あなたのバルコニーに巣をかける。
      source: G・A・ベッケル『詩集』第53篇
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: 菜の花や月は東に日は西に
      source: 与謝蕪村
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: 星ひとつに思い出を、星ひとつに愛を。
      source: 尹東柱「星を数える夜」
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: 時は、かつて冷たい雪に覆われた地に緑の衣をかける。
      source: ルイス・デ・カモンイス「ソネット」
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: 古い地図には、家へ帰る道がまだ残っている。
    - line: 番地は変わった。午後の光は今も同じ場所に差す。
    - line: 次は、ずっと昔です。
