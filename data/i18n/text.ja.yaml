      drawer: ヘルパーが名前を読み上げてくれるまで、紙ラベルをトレイの横に置いておきます。引き出しを閉めると、メモはあるべき場所に残ります。
  finlay_havana:
    name: 蚊と黄熱病
    place: ハバナ
    figure: カルロス・フィンレイ
    story: カルロス・フィンレイは、1881 年にハバナで黄熱病の伝染に関する蚊の仮説を発表しました。彼の論文のタイトルは、それが仮説であることを示しています。
    story_prose:
      opening:
        - ハバナはまだまだ暑いです。フィンレイは、読み上げようとしている新聞を演台のそばに置き、事件のメモを手紙の下に保管します。誰かが最初に議題を載せるためにやって来ます。フィンレイは「仮説的に」という言葉をはっきりと言いました。
        - 1881年8月14日、フィンレイはハバナのアカデミーで黄熱病の蚊仮説を発表した。蚊に対する市の対策はずっと後になってから行われた。この支部は解釈を保存し、記録が彼の提案をどの程度裏付けるかメンバーに検討させることができます。
        - 書類に詳しい人なら、アカデミーのコピーをチェックしてもらえます。議論を企画できる人は、メンバーがそれを検討し、公共の蚊対策提案を市に提出できるよう手配することができます。
      points:
        p1: 店員によると、1ページは一度もチェックされておらず、残りのページは確認できないという。ラッパーをフィンレイのリストと照合し、ケースの周囲の折り目から欠けているシートを見つけます。フィンレイは再びリーディングコピーを閉じます。順番が来ると、書記はフィンレイが手にした紙と同じ題を読み上げた。
        p2: ドアに一番近いメンバーは朗読を終えてすでに帽子をかぶっています。あなたは彼にもう 1 つの文を聞いて、どのレコードを確認したいかを言うように頼みます。彼は座って、ある事件について尋ねました。別のメンバーは復帰の期限を設定する。フィンレイは該当する紙を持ち上げ、二人がどれか分かるまで待った。
        p3: 都市のコピーは、理論が確立されたということから始まります。あなたはフィンレイに、まだ確認されていない質問とは別に所見をリストアップするように依頼します。市委員会は、公共の蚊駆除の初期試験に資金を提供することに同意した。書記は印を押す前に、「仮説」の二文字を書き戻した。
      outcomes:
        all: 論文は審問され、事件は再審理される。この分岐では公共の蚊の駆除が早期に開始されていますが、その結果はまだわかりません。
        p1: アカデミーは論文を聞き、コピーをファイルします。メンバーはフォローアップするかどうかまだ決めていない。
        p2: レコードについて尋ねるために何人かのリスナーが残っています。レビューの日付がメモに記載されます。市はまだ行動を起こしていない。
        p3: 自治体裁判の提案に返答が得られる。レポートには、このブランチの以前のアクションが記録されます。
      none: 部屋が空になります。誰も二度目の議論の日付を記入していません。
      not_admitted: 議題に載っている人だけが中に入れられます。外からは事務員が最初の議題を発表するのが聞こえます。
      desync: 読み物は組み立てられません。アカデミーは8月14日のフィンレイの論文を聴取せず、事務局は旅行者をリコールした。
      excerpts:
        p1: 順番が来ると、書記はフィンレイが手にした紙と同じ題を読み上げた。
        p2: フィンレイは該当する紙を持ち上げ、二人がどれか分かるまで待った。
        p3: 書記は印を押す前に、「仮説」の二文字を書き戻した。
    relic: 蚊のスライドガラス
    relic_desc: 蚊の羽が付いた取り付けられた滑り台。
    points:
      p1: 発熱の季節の間は、予定通り 8 月 14 日にアカデミーで論文を読み上げられるよう、論文と事件ノートを安全に保管してください。
      p2: 朗読の後、論文が黙って脇に置かれないように、アカデミーの数人のメンバーに残って彼の事件を調べるよう説得してください。
      p3: 蚊と事件を説得力のある証拠として提出するのを手伝ってください。そうすれば、市は何年も早く蚊との戦いを始めることができます。
    points_fail:
      p1: 事件記録は発熱期に紛失し、8月14日には新聞は読まれなかった。この支部は歴史から外れ、事務所はその従業員を召還した。
      p2: 会場は静寂に包まれ、誰も一件も見せてほしいと要求しなかった。この分岐では、歴史上そうであったように、論文は脇に置かれました。
      p3: 彼の証拠は以前と同様に薄いままだった。この分岐では、市は蚊に対処するまで約 20 年待ったが、それまでは毎年夏に熱がぶり返した。
    shift:
      p1:
        was: 1881 年 8 月 14 日、カルロス フィンレイは、ハバナの王立科学アカデミーに、黄熱病の仮想病原体としての蚊に関する論文を読み上げました。
      p2:
        was: 1881 年 8 月 14 日、彼の朗読は沈黙に遭い、その後何年もの間、この考えは嘲笑されました。
        now: その夜、数人のメンバーが残り、彼の事件記録を見せてほしいと頼んだ。
      p3:
        was: 1881 年からフィンレイは、蚊が黄熱病を媒介することを証明するために 20 年近くを費やしました。 1900年になって初めて、アメリカ陸軍は彼の卵から育てた蚊を使って彼の正しさを証明した。
        now: '{staff} は、証拠が見つかるまで蚊とケースを並べて置くのを手伝ってくれました。このタイムラインでは、ハバナは数年前から蚊との戦いを始めており、熱病はより早く街から去りました。フィンレイは当時も信じられていた。'
        who: finlay_havana
        bio: この路線では、フィンレイの蚊のアイデアは 1881 年の数年以内に受け入れられ、ハバナは 1900 年よりずっと前にそのアイデアに基づいて行動しました。
    vignettes:
      headline: 架空の編集者が見出しで示唆を確信に変えます。タイトルをゆっくり読み返します。彼らは証明を渡す前に仮説という言葉を元に戻しました。
      columns: 編集者は、あたかも各行が同じことを意味しているかのようにメモを読みます。観察された内容と提案された内容を 2 つの列に記入します。文によって列が変わります。
      place: 論文が読まれた場所の名前を確認します。編集者はそれを日付の横に載せるので、レポートによって会議が別の会議に変わってしまうことはありません。
  humboldt_chimborazo:
    name: 雪線の上の裂け目
    place: エクアドル・チンボラソ山
    figure: アレクサンダー・フォン・フンボルト
    story: 1802年6月23日、フンボルトはエメ・ボンプランドとカルロス・モントゥファルとともにチンボラソに登頂した。ポーターたちはそれ以上は進もうとしませんでした。 the three went on with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them, and they turned back.
    story_prose:
      opening:
        - Above the snow line of Chimborazo, Bonpland hands Humboldt the barometer to free a hand for his bag.モントゥファールは前が見えるところで立ち止まる。 You cannot see the far side of the gully he points to until the cloud moves.
        - 1802年6月23日、フンボルトの一行はチンボラソに登り、深い峡谷で引き返した。この分岐により、グループは続行する方法を見つけることができます。 A summit report counts only once everyone comes down.
        - Send someone who can look after companions at altitude.オフィス用の装備が用意されていても、登山者一人ひとりに先に進みたいかどうか尋ねてください。
      points:
        p1: Someone steps to the snow’s edge and comes back to tell Humboldt there is nowhere firm to stand.他のメンバーが地形を確認し、全員が続行するかどうか決定できるまで、パーティーを安全な地面で休ませます。フンボルトとボンプラントが交代で楽器を運びます。 Montúfar stays where he can see both on the way back.休んだ岩場まで戻って、ようやく頂で書いた半ページを取り出した。
      outcomes:
        all: All the climbers reach the top and return to their resting place.報告書には、山頂からの入り口の横に彼らが下山した時間が記載されている。
        p1: The group goes up by the way they found in this branch and returns in the order agreed before climbing.
      none: 一行は峡谷を見て引き返します。他の人たちが待っている場所で、その記録には実際に到達した高さと、彼らが見えたものが示されています。
      not_admitted: 一行が去ったとき、訪問者の居場所はなかった。以下の空の楽器ケースを受け取ります。
      excerpts:
        p1: 休んだ岩場まで戻って、ようやく頂で書いた半ページを取り出した。
    relic: A barometer
    relic_desc: ガラスに高さが記された水銀気圧計。
    points:
      p1: Before the deep gully blocks the way on 23 June, help the party hold out against the mountain sickness, find a way across, reach the summit of Chimborazo and come down safely
    points_fail:
      p1: 歴史のように、彼らは頂上の下の峡谷で引き返します。
    shift:
      p1:
        was: '23 June 1802: Humboldt, Bonpland and Carlos Montúfar climbed Chimborazo with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them and they turned back.'
        now: 彼らは峡谷を渡り、チンボラソの頂上に立ち、無事にキャンプに戻ってきました。
        who: humboldt_chimborazo
        bio: このタイムラインでは、フンボルトは 1802 年 6 月 23 日にボンプラントとモントゥファールとともにチンボラソの頂上に到達し、無事に下山しました。
    vignettes:
      turn: 架空の読者がルートの終点にある頂上を描きました。あなたは、日記が登山の記述をどこでやめるかと尋ねます。彼らは最後のマークを斜面の下に移動し、頂上は手つかずのままにします。
      units: リーダーは単位なしで高さをコピーしたいと考えています。元の測定値に関連付けられたままにし、別の最新の変換のためのスペースを残しておきます。
      names: あなたは読者に、フンボルトの横に他の旅行者の名前を記入するスペースを空けるように頼みます。メモを折りたたんでも、リストにはその日の試みの記録が続きます。
  ibn_khaldun_cairo:
    name: アレクサンドリア沖の船
    place: カイロ
    figure: イブン・ハルドゥーン
    story: イブン・ハルドゥーンは1382年にスルタン・バルククの招きでカイロにやって来た。 1384年、スルタンはチュニスの統治者に家族を自分に従わせるよう要請し、8月8日には西方からの新人としては高いポストであるマリキ学派の裁判長に任命し、すぐに市内のライバルたちがチュニスの座を奪うために動き始めた。その年、妻と娘たちを乗せた船がアレクサンドリアで沈没した。ムカッディーマの中で彼は歴史家に対し、彼らが記述している社会で起こり得ることに対して報告書を検証するよう求めている。
    story_prose:
      opening:
        - カイロでは、事務員が約束と確認する名前のリストを同じ机の上に置きます。イブン・ハルドゥーンは外で誰が待っているか尋ねます。彼自身も別の手紙を待っており、チュニスから妻と娘たちを乗せた船の知らせが届いているという。
        - 1384年、イブン・ハルドゥーンはカイロの裁判長に就任した。妻と娘を乗せた船は後にアレクサンドリアで遭難した。この旅行では、約束を守って港に行き、船上の人々が岸に着くのを手伝うことができます。
        - カイロの職員と書類を確認できる人を使用してください。船員と協力し、陸上の人々を支援できる旅行者を早めにアレクサンドリアに送ってください。
      points:
        p1: 事務員は、名前をもう一度コピーする必要があると言い、別の職員がそれが誰であるかを言うのを待ちたいと考えています。あなたは彼に、彼らがすでに持っている約束を読んで、それを訪問者の言ったことと比較するように頼みます。日付の行で、担ぎ手はイブン・ハルドゥーンのフルネームを読み上げます。書記は机の端の任命書を、その日発送する書類の束に戻した。
        p2: 港で誰かが「人を見た」と通報し、その後水中で見失ってしまいました。見ている人たちに、同じ場所を指さし続けて、すでに出航している船員のためにスペースを空けるように頼みます。イブン・ハルドゥーンの妻と娘たちが海岸に到着すると、玄関で待っていた人が、ニュースを最初にどこに届けばよいかと尋ねました。カイロへの手紙は、本人たちが自分の声で答えられるまで待つことになった。
      outcomes:
        all: イブン・ハルドゥーンは歴史通りに任命を受ける。港から彼の家族が上陸しているとの緊急連絡が入った。このブランチでは、カイロで待っている男性が別のメッセージを受け取ります。
        p1: 予約は記録された日に行われます。船はアレクサンドリアで行方不明になっており、家族はカイロに到着していない。
        p2: 彼の妻と娘たちには、港で彼らを手伝ってくれる人たちがいます。約束はずれてしまったが、救出の場面はまだ記録できる。
      none: 人々はカイロで書類を待ち、港で風が静まるのを待っている。家族が無事だという手紙は決して書かれない。
      not_admitted: 約束を渡すためにドアのそばで待っている人を誰も認めません。船からの知らせは部屋に届いていません。
      desync: イブン・ハルドゥーンに予定されていた任命は別の人物に移る。記録が同期しなくなったため、事務所は旅行者を呼び戻します。
      excerpts:
        p1: 書記は机の端の任命書を、その日発送する書類の束に戻した。
        p2: カイロへの手紙は、本人たちが自分の声で答えられるまで待つことになった。
    relic: チェックされたレポート
    relic_desc: 行列の報告書。欄外には監視員が立っていた場所が記されている。
    points:
      p1: 政敵が新任の裁判官を締め出そうとするなか、8月8日のマーリク法学派の大法官任命を守る。
      p2: 妻と娘たちを乗せた船がアレクサンドリアで沈没したとき、乗っていた人たちを水から引き上げて救出する
    points_fail:
      p1: この分岐では8月8日の任命は別の人に移った。この分岐は歴史から消え去り、事務所はその日の従業員を呼び戻した。
      p2: 歴史のように、船は全員を乗せてアレクサンドリアで沈没し、彼の妻と娘たちはカイロに到着しませんでした。
    shift:
      p1:
        was: 1384年8月8日：スルタン・バルククはイブン・ハルドゥーンをカイロのマーリク法学派の裁判長に任命した。市内のライバルたちが彼に敵対し、翌年彼はその職を失った。
      p2:
        was: 1384年：チュニスからイブン・ハルドゥーンの妻と娘たちを乗せた船がアレクサンドリアで沈没し、乗組員は誰も生き残らなかった。
        now: 船に乗っていた人々はアレクサンドリアで海から引き上げられた。彼の妻と娘たちはカイロにやって来て、家族は再び一緒に暮らしました。
        who: ibn_khaldun_cairo
        bio: このタイムラインでは、1384 年にアレクサンドリアで沈没した船には家族は同行しませんでした。彼の妻と娘たちは救われ、カイロで合流しました。
    vignettes:
      gate: '{staff} は、ゲームのつもりで店員に、群衆が通過する間にゲートが開いたままになっていた時間を尋ねます。彼は合計の横の余白に議事録を書き込み、合計を推定値に変更します。'
      two: '{staff} は、試合のために用意された 2 人目のウォッチャーに、彼女自身のシートを渡します。これは、彼女のストリートに関する説明が、結局彼のウォッチャーの余白に押し込められないようにするためです。'
      copy: '{staff} は法廷の学生のためにムカディマのページをコピーし、学生が作成したいメモ用に行と行の間に指の幅を残します。'
  lili_boulanger_paris:
    name: 机に広げたパート譜
    place: メジー＝シュル＝セーヌ
    figure: リリ・ブーランジェ
    story: リリ・ブーランジェは、1918 年の冬、メジー・シュル・セーヌで重病を患いました。彼女の最後の著作には、彼女が妹のナディアに『ピエ・イエス』を口述筆記したことが記載されている。スコアには声、弦楽四重奏、ハープ、オルガンが必要です。リリさんは3月15日に24歳で亡くなった。
    story_prose:
      opening:
        - 譜面台の上には清書と口述を待っているページの 2 つの山があります。ナディアはリリにペンを置くように言われ、メモをとったところです。薄い紙を通しては、最後に書かれた小節を読むのは困難です。
        - 最後の病気の間、リリ・ブーランジェは妹のナディアに『ピエ・ジェスの』音楽を口述筆記した。リリは 1918 年 3 月 15 日に亡くなりました。ここでは、リリは自分のペースで一時停止し、続きを読みたいときに中断したところから誰かに読み返してもらうことができます。
        - 音楽を読める人は、ナディアの場所をマークできます。文章を読み返す前に、準備ができたらリリに言わせてください。
      points:
        p1: ナディアはページをめくり始めます。リリは彼女に待ってくれるように頼みます。二人とも最後のバーが見える位置に細いスリップを置きます。部屋はしばらく静かになる。リリが話したら、ナディアがマークした拍を逆算します。リリが音を一つ直すと、ナディアは同じ段から続けた。
      outcomes:
        all: リリはいつ続行するかを決定します。彼女が口述した文章はテーブルの上に残されており、その後の記録には依然として彼女の死が 3 月 15 日に記録されています。
        p1: リリの準備ができたら、ナディアはマークされた場所に戻ります。今回は、リリは一時停止前に口述した文章を繰り返す必要はありません。
      none: 休憩後も姉妹たちは自分の居場所を見つけなければなりません。リリは時間を使って再び文章を口述筆記します。
      not_admitted: ナディアは訪問者に、外で待って通路を静かに保つように頼みます。姉妹だけが最後のフレーズを聞いて停止します。
      excerpts:
        p1: リリが音を一つ直すと、ナディアは同じ段から続けた。
    relic: 細い紙のマーカー
    relic_desc: ディクテーションが停止したバーをマークする発明されたスリップ。
    points:
      p1: リリが休憩を求めたら、ナディアの場所をマークし、リリが再開したいときに最後の一節を読み返します。
    points_fail:
      p1: 立ち止まった後、姉妹たちは再び自分たちの場所を見つけなければなりません。リリは、その日に残された時間の一部を、ナディアにすでに与えたことを繰り返すことに費やしました。
    shift:
      p1:
        was: Pie Jesuの記述には、リリが重篤な病気だったとき、ナディアがリリの曲作りを手助けしたことが記されている。
        now: このブランチでは、Lili が停止しても {staff} がその位置を維持します。準備ができたら、ナディアは最後の一節を読み返し、妹は中断しようと決めた場所から正確に読み始めることができます。
    vignettes:
      entry: '{staff} は Nadia に、ページをめくる前に最新のメモを指すように求めます。彼女はそのラインを指で押さえながら、その上の音声をチェックします。'
      visitor: 玄関先にいる人が、音楽はどのくらい残っているか尋ねます。 {staff} は質問を外に出し、リリは休むかどうかを決定します。
      stand: '{staff} は、スコアを隠さずにナディアがペンを置くためのスペースをスタンドに作りました。'
  jianzhen_nara:
    name: 揚州への長い帰り道
    place: 嶺南
    figure: 鑑真
    story: 鑑真さんは5回目の日本への航海を試み、代わりに海南島にたどり着いた。帰国の途上、日本への旅行を頼みに来た僧・永栄が病に倒れ端州で亡くなった。鑑真は旅の途中で視力を失った。アカウントによってさまざまな説明が行われます。
    story_prose:
      opening:
        - 端州では、同行者が新しくコピーしたルートペーパーをドアのそばに置きます。永栄の部屋にいる誰かが、メッセージを持ってきた人たちに待つように言っています。鑑真がやって来て、少しの間中に座ってもいいですかと尋ねました。
        - 鑑真の航海記には端州での栄栄の死が記録されている。その後、鑑真さんの視力は悪化し、一行は揚州へ引き返した。この分岐には、旅の中で 2 つの小さな瞬間がかかります。二人に話す時間を与えてから、建鎮へ向かうルートを読んでみてはいかがでしょうか。
        - 介護の経験がある人なら、栄栄が何を望んでいるのかを聞くことができます。新聞を読み、さまざまな人の話を聞くことができる旅行者は、後で建鎮までのルートを途中で読むことができます。
      points:
        p1: 出発について尋ねた人が立ち去った後、あなたは栄叡に、鑑真に来てほしいかどうか尋ねます。彼はうなずき、ドアを空けておくためのスツールを求めます。あなたは他の人たちのメッセージを保留することに同意し、庭で待ちます。中から二人の声が聞こえる。声が小さくなっても、誰も急かさなかった。
        p2: 書類は折り重ねられ、仲間が鑑真に決めたルートを伝えようとしている。あなたはまだ問題となっている停留所を読み上げ、パーティーがどこで一晩滞在する必要があるかを言います。鑑真は最初にどのステージに行きたいかを言う前に、もう一度名前を尋ねます。地名だけが並んでいた紙に、誰かが彼の選んだことを書き添えた。
      outcomes:
        all: 二人の男は話す時間があります。永栄はまだ端州で亡くなっています。その後、鑑真さんが新聞を読めなくなったとき、新聞は彼が声に出して聞いたルートを通って移動する。
        p1: 二人は会うことができる。栄叡はまだ死んでおり、後のルート書類には鑑真に説明してくれる人が必要になるだろう。
        p2: 鑑真は次の段階を聞き、どこに行きたいかを自分で決めます。永栄と一緒に過ごせるチャンスはもう過ぎてしまった。
      none: ルートペーパーは束に戻されます。部屋やその先の場所にあるメッセージは、まだ誰かが読み上げてくれるのを待っています。
      not_admitted: 永栄が泊まっている部屋には決して入ってはいけない。書類は持ち去られ、ドアの前では誰も読まない。
      excerpts:
        p1: 中から二人の声が聞こえる。声が小さくなっても、誰も急かさなかった。
        p2: 地名だけが並んでいた紙に、誰かが彼の選んだことを書き添えた。
    relic: ルートメモのシート
    relic_desc: 一行が北へ旅した際に発明されたシート。
    points:
      p1: 端州では、栄叡がどのように世話をしたいかを尋ね、鑑真と話す時間を作ります
      p2: 鑑真さんは目が見えなくなったため、党員に計画を読み上げてもらい、今後どのように続けたいかを決めることができるようにする
    points_fail:
      p1: いつも他に解決すべきことがあり、ベッドサイドにいる人々は呼び出され続けます。話す時間が過ぎていきます。
      p2: 一行は再びルートノートを束にまとめる。鑑真さんは、誰かがそのページに何が書かれているかを教えてくれるのを待たなければなりません。
    shift:
      p1:
        was: 永栄は5度目の日本への航海を試みた帰り道、端州で病に倒れ亡くなった。
        now: この分岐では、{staff} が端州の栄叡と一緒に滞在し、鑑真をベッドサイドに呼び出します。彼らが個人的に話す時間があります。
      p2:
        was: 記述によれば、鑑真はこの旅の途中で視力を失ったという。その後、彼は日本へ航海しました。
        now: この分岐では、{staff} が次のストップを読み取ります。鑑真は他の人たちに一つ停留所を変えてもらい、いつまた出発したいかを伝えます。
    vignettes:
      sound: 仲間はシート上の次の町を指差す。 {staff} は、鑑真 が聞いている間、名前を 2 回読み上げるように要求します。
      tie: 党はまさにルート書類を締めようとしている。 {staff} は、誰かがストップの順序を確認するまでバンドルを開いたままにします。
      temple: '{staff} は庭で質問に答え、中の人が声を上げずに話し終えることができるようにします。'
  sei_shonagon_kyoto:
    name: 中宮が出産を控えた冬
    place: 京都
    figure: 清少納言
    story: 清少納言は皇后定子に仕え、後に彼女の周囲の生活を『枕草子』に書きました。長保二年の暮れ頃、定子は娘・美子姫を産んだが、間もなく亡くなった。
    story_prose:
      opening:
        - 京都にも冬がやって来て、衝立のそばに予備の座布団が置かれています。清少納言は誰が受け取るべきかと尋ねる。彼女が話していると、使者が到着する。使者がまだいる中、定子は誰もいない場所を振り返る。
        - 定子は1000年末に出産の準備をし、換算暦の1001年1月13日に亡くなった。清少納言は後に宮廷での生活について『枕草子』に書いています。ここでは、定子が誰を近くに置きたいかを尋ね、彼女が選んだ人々のためにスペースを空けることができます。
        - 少納言とともに彼女の話を聞く旅人を送ります。手石が話している間、他の人が外部からの次のメッセージに応答することができます。
      points:
        p1: 少納言は座布団を手に取り、いつもの場所に置きます。あなたは使いが終わるのを待ってから、定子が誰に会いたいのかを尋ねるように頼みます。定子は一人の名前をあげ、ランプの少し後ろに座るように頼みます。少納言は彼女が指さした場所に座布団を置きます。部屋が静まると、定子が呼んだ人はもう座っていて、定子は望んだところに手を置いていた。
      outcomes:
        all: 彼女が会いたいと頼んだ人は今も近くにいます。定子は依然として亡くなっており、報告書には彼女が誰を同席させるかを選択した瞬間が保存されている。
        p1: 少納言は定子の選んだ人が到着するまで座布団を空けておきます。後の記録は彼女の歴史的な人生を追っています。
      none: 次から次へとメッセージがドアに届きます。クッションは手石に誰が欲しかったのか尋ねる前に、最初に示された人物に渡されます。
      not_admitted: 誰かがスクリーンの向こう側にクッションを移動させます。外からは誰のためのものなのかわかりません。
      excerpts:
        p1: 部屋が静まると、定子が呼んだ人はもう座っていて、定子は望んだところに手を置いていた。
    relic: 家庭用の二つ折りのメモ
    relic_desc: 部屋に案内されるべき人を指名する発明されたメモ。
    points:
      p1: 出産の準備をしている定子に誰が近くにいてほしいかを尋ね、少納言がその人たちのために場所を空けるのを手伝ってください
    points_fail:
      p1: 定子が彼女の隣に誰を望んでいるかを尋ねる時間がある前に、誰かが次のメッセージを持ってドアに来ています。
    shift:
      p1:
        was: 宮廷記録には毘史姫の誕生とその直後の定子の死が記録されている。
        now: この分岐では、{staff} は、定子が誰に会いたいかを言うまで、他の訪問者をドアの前に留めておきます。少納言は次のメッセージを伝える前に聞く時間があります。
    vignettes:
      compare: '{staff} は、メッセージを折りたたむ前に使いに 1 つの名前をはっきりと読むよう要求します。少納言はもう尋ねることなくそれを伝えることができます。'
      colour: 少納言はランプを動かしてその後ろの空間を確認します。 {staff}は予備のクッションを定子が指した場所に移動する。
      listen: '{staff} は、ドアのメッセージに応答するまで待機してから、その部屋に他に何か必要があるかどうかを尋ねます。'
  ibn_rushd_lucena:
    name: 焚書の命が下る前に
    place: コルドバ
    figure: イブン・ルシュド
    story: 1195年頃、イブン・ルシュドはアルモヒド朝廷からの支持を失い、ルセナに亡命した。アカウントには、書籍の非難と焼き捨てが記録されています。アリストテレスの物理学に関する彼の長い注釈のアラビア語のテキストは失われていますが、ヘブライ語とラテン語の翻訳は残っています。
    story_prose:
      opening:
        - 2 つのメッセージがまだコルドバ テーブルで待機しており、そのうちの 1 つは Lucena 宛てです。読者は、イブン・ルシュドがまだ答えるかどうか尋ねています。彼は物理学についての長い解説を写字者に向けて描き、単語が欠けている場所を指摘します。
        - イブン・ルシュドは 1195 年頃にルセナに亡命しました。後の記録には書籍に対する制限が記録されています。彼の『物理学に関する長い解説』のアラビア語テキストは部分的にのみ残っています。ここで、読者と連絡を取り直し、その読者のために 1 つのセクションのチェック済みコピーを残すことができます。
        - 通信を手配できる人に 2 つのアドレスを担当してもらいます。アラビア語の読者や注意深い写本家なら、原文がどこで終わり、解説が始まるのかを確認できます。
      points:
        p1: 読者は数行を書きました。時間が来たら、彼はあなたに、まだ読みたいとだけ言ってほしいと頼みます。ルセナでは、あなたはその言葉をイブン・ルシュドに読み上げ、どこに返事を送ればよいかを伝えます。彼は読者がどのセクションに到達したかを尋ね、自分のシートを受け取ります。彼は折った紙を二枚手渡し、まだ読み続けている人に届けてほしいと頼んだ。
        p2: 写本家は隙間を越えてまっすぐに書いた。彼は、文章には意味はあるが、原文を読んでいる人であれば、欠けている文に名前を付けることができると述べています。元の行のスペースを空けてもらい、その下のコメントをコピーし、両方を読み返してもらいます。写しを受け取った読者は二つの箇所の間に指を置き、自分でどちらも見つけられると言った。
      outcomes:
        all: 返信はルセナとコルドバの間で行われ、読者は解説のアラビア語セクションにチェックを入れます。他のページの損失は履歴記録に残ります。
        p1: イブン・ルシュドは、誰かがまだ読んでいることを知っています。彼の返事はルセナから持ち帰ったが、チェックされたコピーは未完成のままである。
        p2: 読者はチェックされたアラビア語のページを残して出発します。彼がルセナに送りたかったメッセージはまだ待っています。
      none: メッセージと書きかけのページは両方とも机の上に残ります。読者は次の人が来るのを待ちます。
      not_admitted: 玄関先にいる人は、見知らぬ配達人からの手紙を受け取ることはありません。読者の言葉は決してイブン・ルシュドには届かない。
      excerpts:
        p1: 彼は折った紙を二枚手渡し、まだ読み続けている人に届けてほしいと頼んだ。
        p2: 写しを受け取った読者は二つの箇所の間に指を置き、自分でどちらも見つけられると言った。
    relic: 読者の実践抜粋
    relic_desc: 前提としてスペースを追加した発明の抜粋。
    points:
      p1: コルドバからルセナのイブン・ルシュドに、彼の読者の一人がまだ彼に手紙を書きたがっているので返事を受け取ることができるという知らせを送る。
      p2: 注文が来る前に、物理学に関するアラビア語の解説の一部をその出典と比較し、2 番目のコピーを読者に残してください。
    points_fail:
      p1: 読者はメモをコルドバに保管します。彼らはそれを送信する別の機会を待つ必要があります。
      p2: 追加のコピーは未完成のままです。読者はアラビア語の個別のページを持ち帰る必要はありません。
    shift:
      p1:
        was: イブン・ルシュドは支持を失い、法廷に戻る前にルセナに追放された。
        now: この分岐では、読者からのメモがルセナにいる彼に届きました。手紙を送り返す手段があるうちに、彼は返信することができます。
      p2:
        was: イブン・ルシュドの『物理学に関する長い注釈』のアラビア語テキストが失われている。中世の翻訳が残っています。
        now: この分岐では、チェックされたセクションの 1 つが非難を通じて読者の手に残ります。読者は、それを元のアラビア語の別のコピーと比較することができます。
    vignettes:
      premise: マリアムは慎重な手紙で結論を書き写した。ユスフは、彼女が述べなかった何かを仮定することによってのみ、それに従うことができます。あなたは彼にどこで止まったかを尋ね、結論の前にスペースを空けます。マリアムはそのスペースに自分の仮定を書き、ユスフはそこに疑問を抱くことができます。
      together: ユスフは本を返して、自分用に一行だけ残しておきたいと考えています。あなたは彼にそれに伴うステップをコピーする時間を与えます。玄関でマリアムは大声で結論を尋ねますが、今度はその理由も答えることができます。
      language: あなたは、後で読者が別の言語で出会うであろう用語を認識しています。マリアムは、現状の前提をそのままコピーしたかどうかを知りたいだけです。彼女がページをチェックしている間、あなたはページを平らに保ちます。彼女がその横に書いた質問は、あなたが会ったこともない読者に届くでしょう。
  maya_codices_mani:
    name: 紙の折り方を覚えておく
    place: マニ
    figure: マヤの書記たち
    story: 1562 年 7 月 12 日、植民地当局はマニで公共の場でマヤ語の書籍やその他の物品を焼き捨てました。マヤのコミュニティは知識を作り、継承し続けました。スペインの征服以前に作られた折りたたみ本はほとんど残っていない。
    story_prose:
      opening:
        - ユカタン州マニでは、飼育員が畳んだ本をマットの上に置き、かつて子供が一緒に読んだページをめくります。近くの村からの訪問者が今日出発します。彼は出発する前に、彼女に一冊の本を託してもらえないかと尋ねます。
        - 1562 年 7 月のマニでの焚書が記録されています。現存するマヤの法典には文字や絵が保存されていますが、その正確な歴史は不明な場合が多いです。ここの管理人は架空の人物で、彼女の本を保持する人を選ぶことができます。
        - 管理人にページがどのように機能するかを見せてくれる誰かを送ってください。彼女が本を渡すことを選択した場合は、彼女の指示に従って本を折り、読者がどのようにして本を見つけることができるかを受取人に尋ねます。
      points:
        p1: キーパーは 2 番目の折り目を開き、他の読者がかつて間違えた余白を指します。受信者に、両方の読者が同じ場所で停止することがわかるように、指示に従うように依頼します。彼女は一冊の本を他の本から持ち上げ、使い古した布で包み、マットの上に渡します。受け取った人は両手で支え、彼女が最後の折り目の印を説明するのを待った。
      outcomes:
        all: 一冊の本は、その番人が選んだ場所へ行きます。マニでの火入れは今でも行われており、この支部には彼女が自ら手渡した一冊が保存されています。
        p1: 読者は包まれた本を胸に当てて持ち出す。それが再び開くと、彼は彼女が示した方法で 2 番目の折り目を見つけることができます。
      none: 読者は手ぶらで帰宅する。管理人は本を広げ、再び閉じます。彼女はまだそれをどこに置くかを決めなければなりません。
      not_admitted: 管理人は訪問者にページに触れるよう勧めません。ドアのところで、彼女が彼らを追い返し、隣人と話し続けているのが見えます。
      excerpts:
        p1: 受け取った人は両手で支え、彼女が最後の折り目の印を説明するのを待った。
    relic: 空白の練習フォールド
    relic_desc: 管理者が提供する架空の折り目。
    points:
      p1: 管理人に、別の村の信頼できる読者にどの本を持たせたいかを尋ね、その本を引き渡すのを手伝ってください。
    points_fail:
      p1: 彼女が選んだ人は本を持たずに去っていきます。飼育者はどこに留まるかを決めなければなりません。
    shift:
      p1:
        was: '1562 年 7 月 12 日: マニで非常に多くのマヤ族の折り本が公衆の面前で焼かれました。征服前に作られた本のうち、現存するのはほんの一握りです。'
        now: この分岐では、管理人が 1 冊の本を誰が管理するかを選択します。それは次の読者に届き、焼かれながらマヤの手に残ります。
        who: maya_codices_mani
        bio: この分館では、マニの本が 1562 年に一般の人々に焚かれる前に、管理者によって選ばれた読者に渡されました。
    vignettes:
      fold: 管理人は、何も書かれていない折り目を 2 つベンチに置き、隣人に、本の中でどちらが最初に開いたかを覚えていると尋ねます。比較している間、紙を持ってください。彼は 2 番目のフォールドを配置できません。彼女は最初のものを保管し、もう一方は次回話すときのために放しておきます。
      listen: 隣人はキーパーが失くした部分を語り始めますが、順序が異なって覚えています。それぞれが終わるまで聞きます。彼らは最初の折り目については同意しますが、2 番目の折り目については未定のままにします。管理人は、両方のアカウントを記録したコピーを彼女に残すように頼みます。
      survive: 後のコレクションで生き残った Maya コーデックスを見たことがあるでしょう。管理人は、隣人がどの本を覚えているか教えてほしいと尋ねます。コレクションに名前を付けることはできますが、そのページをこのルームに接続することはできません。彼女はあなたに、散歩に戻るための白紙の練習用折り紙を渡します。彼らが思い出していた本は、それについての説明とともに残っています。
  zeami_sado:
    name: 紙に描いた島
    place: 佐渡島
    figure: 世阿弥
    story: 世阿弥の息子、元雅は 1432 年に亡くなりました。世阿弥は 1434 年に佐渡に流される前に、キャライカでの喪失について書き残しています。世阿弥の旅と佐渡島での流刑を回想する謡集『金燈抄』は 1436 年に出版されています。
    story_prose:
      opening:
        - Sado のリーダーには、ポケットに折りたためるほど小さなシートが付属しています。世阿弥はすでに二度、扉のそばで呼吸を変える練習をしているのを聞いている。彼は席から読者にどこから始めようとしているのか尋ねます。
        - 世阿弥は晩年佐渡に流され、その島のことを『金刀抄』に記している。この分岐により、彼は聞くことを選択できる短い朗読と、自分で選択できる一時停止を得ることができます。その後の作品も、歴史上そうであったように今でも語り継がれています。
        - 言葉とそのリズムを聞いてくれる人を送ってください。世阿弥が聞きたいかどうかを尋ね、彼が選んだ間をそのまま伝票に記録します。
      points:
        p1: 読者はフレーズの終わりで一息つきます。世阿弥は同じところからやり直すように言い、途中で手を挙げます。手がどこで言葉を止めるかを観察し、読み終わった後に伝票に印を付けます。三度目に、読み手は目を伏せずにその語で止まった。世阿弥が手を上げるより先だった。
      outcomes:
        all: このスリップには、世阿弥がセリフを聞いた後に選んだポーズが保存されています。彼が島について書き続ける間、それはページの横にあります。
        p1: 世阿弥は自ら休止を選んだのです。読者は次回同じシートを持ってくると言います。
      none: 読者は呼ばれるまで長く滞在することができません。彼の折りたたんだシートにはまだ一時停止の跡がありません。
      not_admitted: 訪問者はまだ読むように誘われていません。読者はページを折り、ドアから離れます。
      excerpts:
        p1: 三度目に、読み手は目を伏せずにその語で止まった。世阿弥が手を上げるより先だった。
    relic: 能面
    relic_desc: 眉間に漆の細い線が入った小さな木製のマスク。
    points:
      p1: 世阿弥に佐渡に関する一文を読んでもらいたいか尋ねる。彼が同意する場合は、読者が取り外し可能な伝票に一時停止を続けるのを手伝ってください
    points_fail:
      p1: 世阿弥がセリフを声に出して聞く前に、読者は立ち去らなければなりません。ページ上のマークは待つ必要があります。
    shift:
      p1:
        was: 世阿弥の残された著作には、息子への哀歌や佐渡流刑を回想した『禁当抄』などがある。
        now: この分岐で世阿弥は、読者が彼の一文を 2 つの方法で試すのを聞きます。彼は読者がどこで一時停止するかを選択し、その伝票を自分のページの横に置いておきます。
    vignettes:
      later: あなたは読者に、人々は佐渡に関する本でその名前を今後も使用するだろうと伝えます。言葉を地名として、そして人が憧れるものとして試みる。両方の一時停止を伝票にマークします。世阿弥を佐渡へ運んだ船はすでに去ってしまった。
      mask: 読者は練習用のマスクをかざし、それを下げると場所を失います。あなたは緩いスリップにラインの始まりをマークし、彼が再び見つけることができる場所にそれを支えます。マスクはペグに戻ります。あなたの読書の後に読み逃してしまいます。
      wind: すきま風で、読み合わせの紙が散らばった。あなたは読者がベンチの下から 1 枚を回収し、小石で押さえるのを手伝います。彼はもう一度その行を読みます。帰るとき、紙は石の下に残り、一時停止をメモに残します。
  mozart_requiem_vienna:
    name: 筆跡が分かるように
    place: ウィーン
    figure: ヴォルフガング・アマデウス・モーツァルト
    story: モーツァルトはレクイエムが未完成のまま、1791年12月にウィーンで亡くなった。オーストリア国立図書館は、フランツ・クサーヴァー・ジュースマイヤーが手を加えた作業用資料と、提出された総譜を所蔵している。
    story_prose:
      opening:
        - ウィーンでは、使いがテーブル上の最もきれいな山に手を伸ばします。モーツァルトは、冒頭の楽器パートがまだ残っているかどうかをベッドから尋ねます。コンスタンツェは使いに待つように頼みます。他のページには、まだ保管されていない下書きもあります。
        - モーツァルトは晩年に病気になり、1791年12月5日に亡くなった。レクイエムは未完成のままであったが、冒頭部分は完全に作曲していた。ここでは、そのセクションをまとめて管理し、介護者にオフィスの架空の医療キットを持ってきてもらうことができます。
        - 作業シートから楽器パートを区別できるリーダーは、コンスタンツェがそれらを分類するのを助けることができます。家族とモーツァルトが何を望んでいるのかを尋ねた後、キットを持っていてケアの経験のある人を使用してください。
      points:
        p1: 使いは紙を二枚めくり、どちらも同じ声部の名だと言った。コンスタンツェとともに、オーケストラの全パートが書かれた束を出してもらい、冒頭部分の終わりまで譜面を確かめた。草稿は札を付けて別に包んだ。戸口で使いは包みの中と外を確かめ、どちらの束を先に写譜係に渡すか見分けた。
        p2: 誰かが清潔なシーツをベッドサイドに持ってきて、今日はコピーがあるかどうか尋ねます。あなたはモーツァルトとその家族にオフィスキットについて説明し、写経師に別の部屋で待つように頼みます。モーツァルトが後に目覚めると、熱は下がっていました。彼は机を近づけてもらい、手を止めたところだけを開いた。
      outcomes:
        all: オープニングパーツは再度使用でき、モーツァルトがテーブルで作業することができます。終了しても、その後のページは空白のままです。彼がどのように彼らを終わらせるのかはまだ誰も知りません。
        p1: 開口部はまだ完全な 1 つのパケットです。モーツァルトは12月5日に亡くなり、残りの楽譜は他の人に残されました。
        p2: モーツァルトは立ち直るが、本来の冒頭は散ってしまう。この訪問では、彼が目覚めてスコアを見たいと頼んだ瞬間が保存されています。
      none: 未完成のフレーズがベッドのそばに横たわっています。モーツァルトは12月5日に亡くなり、いくつかの山は今も誰かが身元を特定するのを待っています。
      not_admitted: コンスタンツェはこの訪問者を手配しませんでした。写経者は外にいて、山の中に何があるか決して見ません。
      desync: 冒頭部分にばらばらのページが混在し、歴史的な引き継ぎが同期しなくなります。事務所は旅行者を呼び戻します。
      excerpts:
        p1: 戸口で使いは包みの中と外を確かめ、どちらの束を先に写譜係に渡すか見分けた。
        p2: 彼は机を近づけてもらい、手を止めたところだけを開いた。
    relic: 未完成の練習用リーフ
    relic_desc: 生き残ったメモがどこで止まるかを示す架空のコピーリーフ。
    points:
      p1: 病気で引き継ぎを余儀なくされた場合は、レクイエムの完成したオープニングを一緒に保管してください
      p2: 11月20日に彼がベッドに入ったら、そこに留まっている熱を治してください
    points_fail:
      p1: 冒頭部分に緩いドラフトが混じり、第1楽章を組み立て直すことができなくなります。支社との連携が崩れたため、事務所はその従業員を召還した。
      p2: この枝では病気は治りません。 12月5日にウィーンで35歳で死去。
    shift:
      p1:
        was: 1791年12月、モーツァルトはレクイエムの冒頭部分が完全にオーケストラ化され、残りの部分が未完成のまま亡くなった。
      p2:
        was: 1791年11月20日からモーツァルトはベッドに閉じ込められました。彼は12月5日にウィーンで亡くなり、教区名簿では死因を重度の粟粒熱としている。
        now: '{staff} は熱を下げる薬を持ってきて、12 月には再び起き上がります。このタイムラインでは、彼はレクイエムを自らの手で完成させ、ウィーンで長年にわたって作曲と演奏を続けています。'
        who: mozart
        bio: モーツァルトは1791年の冬に回復し、自らレクイエムを完成させ、長年ウィーンで作曲と演奏を続けた。
    vignettes:
      stack: グレタさんはテーブルを片づけ、空っぽに見える葉っぱを脇に置いています。エミールがその前のページをチェックしている間、あなたはスタックを保持します。空の譜表はシーケンスに属します。グレタさんは、それがどこから来たのかを示す緩やかなスリップマークを付けて、それを元に戻しました。
      hand: エミールは目の前の線をコピーし、書かれていない杖にまっすぐ進む準備ができています。コピーが止まった位置の余白に小さな印を罫書きしてもらいます。ハンドオフが完了すると、次の読者は新しいハンドをどこから開始する必要があるかを正確に確認できます。
      finish: 将来の合唱団が歌うように、この一節を口ずさむことができます。グレタさんは今そのコピーが必要で、そのページに書かれている音楽はどこで終わるのか尋ねます。あなたは彼女に境界線を示し、メロディーを独り占めします。次のバージョンは退会後にまとめられます。
  ino_tadataka_ezo:
    name: 直線に消えかけた曲がり角
    place: 蝦夷地（北海道）
    figure: 伊能忠敬
    story: 1800年6月11日、伊能忠敬は初めての測量に江戸を出発した。一行は東北を北上しながら測量し、海を渡って蝦夷地の海岸を西別までたどり、引き返した。全行程はおよそ半年だった。忠敬は1818年に亡くなり、仲間たちが1821年に『大日本沿海輿地全図』を完成させた。
    story_prose:
      opening:
        - 1800年6月11日、江戸。五十五歳の伊能忠敬が測量隊を率いて出発する。一行は六人、北へ進み、海を渡って蝦夷地に入り、海岸に沿って一本の線を測っていく。これが初めての測量で、のちに忠敬は日本中の海岸を歩き、その死から三年後に仲間たちが『大日本沿海輿地全図』を描き上げた。
        - 史実では、幕府の手当はわずかで、旅の費用の大半は忠敬が自分で出した。この測量はすべて歩測で、測量縄を使うのは第二次測量からだった。一行は蝦夷地の南の海岸を西別まで測り、同じ道を引き返した。この時間軸では、隊に歩数を大声で数える荷運びがいて、浜には海岸がどこで曲がるかを知る漁師がいる。
        - この旅で役に立つ人：帳簿をつけられる人や商いをしたことがある人、旅費が尽きかけても持ちこたえられる人、あるいは几帳面で体の丈夫な人、栄養合成器を持った人。大工や船大工、網の繕いの経験がある人、あるいは工学に通じた人、手先が器用で注意深い人、一区間を正確に測れる人。ひどく頑丈で長い道に慣れた人、航海や飛行や地質に通じた人、あるいは偵察ドローンを持った人。
      outcomes:
        all: その冬、一行は江戸に戻った。出発から百八十日だった。持ち帰った図には、蝦夷地の海岸が西別の先まで描かれ、ある一区間の数字の横には縄で測ったと書き添えてあった。
        p3: その冬、一行は江戸に戻った。図の海岸線は西別を越えてさらに少し延び、その先は小さな岬で終わっていた。
        p2: その冬、一行は江戸に戻った。図のある一区間には、歩数と縄で測った数が並べて書いてあった。次の測量には、測量縄が持っていかれた。
        p1: その冬、一行は同じ道を通って江戸に戻った。出発から百八十日だった。あの測量の杖は、その後も何度も遠い旅に忠敬と出かけた。
      none: 八月の末、財布が空になり、一行は西別に着く前に荷をまとめて引き返した。荷運びの数える声は道々小さくなり、帳面の最後の数行は空いたままだった。
      desync: 八月の末、旅費が尽き、一行は西別に着く前に引き返した。{staff}が呼び戻されたとき、測量の杖は道半ばの砂に立ったままで、満ちてきた潮がその半分まで浸していた。
      not_admitted: '{staff}は測量隊に加われず、浜で漁師の網上げを何度か手伝っただけだった。漁師が海岸の曲がる場所の話をしているあいだ、東の砂浜を一列の人々が歩数を数えながら遠ざかっていった。'
      points:
        p2:
          class_seafaring: 八月、蝦夷地の南東の海岸。一行はいつもどおり一歩ずつ測り、荷運びが大声で歩数を数えていたが、砂浜や砂利浜では同じ区間を二度歩いても数が合わなかった。{staff}は船で縄を結び慣れていて、細い縄を一巻き取り出し、一定の間隔ごとに結び目を作り、結び目のあいだを測量の杖で確かめてから、荷運びと両端を持ち、海岸に沿ってまっすぐ張って測った。忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。
          class_craft: 八月、蝦夷地の南東の海岸。一行はいつもどおり一歩ずつ測り、荷運びが大声で歩数を数えていたが、砂浜や砂利浜では同じ区間を二度歩いても数が合わなかった。{staff}は手仕事に慣れていて、細い縄を一本よって、一定の間隔ごとに結び目を作り、結び目のあいだを測量の杖で確かめてから、荷運びと両端を持ち、海岸に沿ってまっすぐ張って測った。忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。
