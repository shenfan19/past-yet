quotes:
  sun_motto:
    who: 孫文
    quote: 博学、審問、慎思、明辨、篤行。
    occasion: 国立広東大学のために書いた校訓
  sun_great_things:
    who: 孫文
    quote: 諸君に勧める。志を立てるなら大事をなすことであって、大官になることではない。
    occasion: 嶺南大学の学生歓迎会での演説
  basho_summer_grass:
    who: 松尾芭蕉
    quote: 夏草や 兵どもが 夢の跡
    occasion: 『おくのほそ道』平泉の句
    authors:
      - AI
      - Fan Shen
  ino_echo_yoshioka:
    who: 伊能忠敬
    quote: 松前より上み三里吉岡と申す川岸へ着船夫に上り一夜宿候
    occasion: 長男・景敬への書状、寛政十二年五月二十三日
    authors:
      - AI
      - Fan Shen
  murasaki_paper_and_letters:
    who: 紫式部
    quote: いろいろの紙えり調へて、物語の本どもそへつゝ所々にふみかきくばる。
    occasion: 『紫式部日記』寛弘五年十一月、御草紙作り
    authors:
      - AI
      - Fan Shen
  basho_passing_years:
    who: 松尾芭蕉
    quote: 月日は百代の過客にして、行かふ年も又旅人也。
    occasion: 『おくのほそ道』序、元禄二年の旅を回想
    authors:
      - AI
      - Fan Shen
  ino_echo_same_wind:
    who: 伊能忠敬
    quote: 同廿日朝四ツ頃迄風待致候へ共 同風にて致方無之陸地一里余福島へ行
    occasion: 忠敬先生日記、寛政十二年五月二十日
    authors:
      - AI
      - Fan Shen
  murasaki_waterbirds:
    who: 紫式部
    quote: 水鳥をみづのうへとやよそに見むわれもうきたる世をすぐしつゝ
    occasion: 『紫式部日記』寛弘五年十月、土御門殿の池を眺めて
    authors:
