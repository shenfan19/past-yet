          else: '{staff}は『ポリスム』を書き写す手元を見守った。一巻仕上がるたびに原本と写しを並べ、図を順に確かめた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
      excerpts:
        p1: 写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。
  socrates_athens:
    name: 船が戻るまで
    place: アテナイ
    figure: ソクラテス
    story: 紀元前399年、ソクラテスはアテナイで裁かれ、死刑を宣告された。アテナイが毎年デロス島に送る船は出たばかりで、戻るまでは刑を執行できなかった。彼は牢で約三十日を過ごし、イソップの寓話を詩にした。友人たちは毎日見舞いに来た。最後の日も病気のプラトンを除いて全員が集まり、夕方、彼は毒杯を飲んだ。
    relic: 市場の陶杯
    relic_desc: 黒い釉薬がかかったアテナイの杯。縁が少し欠けている。
    points:
      p1: 陪審席が騒がしくなっても、ソクラテスが弁明を終えられるよう場を静める
      p2: イソップの寓話の詩とアポロンへの賛歌の完成を手伝い、写しを牢の外に届ける
      p3: 最後の日までにプラトンを治療し、牢で師に付き添えるようにする
    points_fail:
      p1: 騒ぎで弁明がかき消され、最後まで話せなかった。分岐の同期が外れ、事務所は職員を呼び戻す。
      p2: 史実と同じく、この分岐にも詩は残らなかった。
      p3: 史実と同じくプラトンはその日も病気で、師のもとへは来られなかった。
    shift:
      p1:
        was: 紀元前399年。ソクラテスはアテナイで裁判にかけられた。プラトンの『ソクラテスの弁明』では、陪審員に何度も騒がないよう求める。裁判は有罪となり、死刑が宣告された。
      p2:
        was: 紀元前399年。ソクラテスは執行を待つ間、繰り返し見る夢に従ってイソップの寓話を詩にし、アポロンへの賛歌を作った。いずれも完全な形では残っていない。
        now: 友人が詩を書き写した巻物を牢から持ち出し、アテナイに残した。
      p3:
        was: 紀元前399年。ソクラテスが牢で毒杯を飲んだ日、友人たちはその場にいた。プラトンは病気で来なかった。
        now: プラトンは回復し、友人たちと牢で最後まで付き添った。
        who: plato_academy
        bio: この分岐では、プラトンは病気から回復し、ソクラテスの最後の日を牢で共に過ごした。
    vignettes:
      rumours: 裁判の前日、{staff}は広場の三つの屋台で老人の罪状を尋ね、三通りの答えを聞いた。{staff}はすべて書き留め、どれが法廷で読み上げられるか待った。
      harbour: 毎夕、{staff}はペイライエウスの港へ下りて魚屋にデロス島の船が戻ったか尋ねる。答えはいつも同じで、{staff}は帰りを待つべきか、遅れを願うべきか分からない。
      gate: '{staff}は牢の塀際で灯油を売る女のために水を運び、代わりに塀の下に座る場所をもらった。見舞い客は毎日夜明けから門で待つので、{staff}はその顔を見覚えた。'
    story_prose:
      opening:
        - 紀元前399年、アテナイ。ソクラテスは不敬と若者を堕落させた罪に問われ、陪審の前に立つ。生涯にわたり道や広場で人々に問いかけたが、自らは一冊も書き残さなかった。後世の人は、プラトンとクセノポンの著作を通して彼を知る。
        - 史実では、デロス島へ向かう船が裁判の前日に出た。船が戻るまで刑の執行が禁じられていたため、ソクラテスは牢でさらに三十日ほど待った。繰り返し見る夢に従い、そこでイソップの寓話を詩にしたが、詩は後世に伝わらなかった。最後の日には友人たちがそろい、病気のプラトンだけが来なかった。この分岐では、牢の塀際で灯油を売る女がいて、ペイライエウスの魚屋には港へ入る船が一隻残らず見える。
        - 騒ぎ出した人々を落ち着かせる人、詩句を聞き取って巻物に写せる人、薬を知り病人を診られる人に出番がある。
      outcomes:
        all: デロス島から船が戻り、魚屋は遠くからその帆を見つけた。最後の夕べ、牢は友人たちでいっぱいで、プラトンもその中に座っている。詩の巻物はその後も、アテナイのある家の長持の底に収まっていた。
        p3: 最後の夕べ、牢は友人たちでいっぱいだった。プラトンもその中に、最後まで座っていた。
        p2: 詩の巻物は、アテナイのある家の長持の底で年月を過ごした。パピルスの縁が毛羽立っている。
        p1: 三十日後、デロス島からの船がペイライエウスに入り、魚屋は遠くから帆を見つけた。その日、友人たちは夜明けから牢の戸口で待っていた。
      none: デロス島から船が戻り、魚屋は遠くからその帆を見つけた。夕方、牢では友人たちが輪になって座った。口を開く者はいなかった。
      desync: 法廷のざわめきが大きくなり、弁明は言葉の途中で途切れた。{staff}は法廷を出る前に事務所へ呼び戻された。
      not_admitted: '{staff}はアテナイに居場所を得られず、牢の塀際で一息つける場所さえなかった。デロス島の船はまだ海の上にいる。'
      points:
        p1: 裁判の日、木の腰掛けは何列も陪審員で埋まっていた。ソクラテスが話すたび、怒号が声をかき消す。{staff}は傍聴席から立ち上がり、声を張らずに両手をゆっくり下げ、一列ずつ見渡して、静まるのを待って腰を下ろした。ソクラテスは途切れた言葉の先を語った。話し終えると外套の裾をたぐり、演壇に静かに立った。
        p2: 牢に光を通すのは高いところの小窓だけだった。ソクラテスが一行読むと、{staff}が蝋板に刻んで拍子を取って読み返し、一拍多ければ蝋をならして書き直した。イソップの寓話が一つずつ詩になり、最後にアポロンへの賛歌が続いた。夜、{staff}は壁際の灯火で、蝋板の文字をパピルスの巻物に写した。翌朝早く、見舞いに来た友人がそれを懐に入れ、胸に手を当てたまま牢の門を出た。
        p3:
          class_medical: 最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}は医師の手順で診察し、薬を調えて決まった時刻に飲ませ、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。
          else: 最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}はナノ救急箱を開け、説明に従って処置し、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。
      excerpts:
        p3: 明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。
        p2: 夜、{staff}は壁際の灯火で、蝋板の文字をパピルスの巻物に写した。翌朝早く、見舞いに来た友人がそれを懐に入れ、胸に手を当てたまま牢の門を出た。
        p1: ソクラテスは途切れた言葉の先を語った。話し終えると外套の裾をたぐり、演壇に静かに立った。
  cao_xueqin_beijing:
    name: 最終章のあとの白紙
    place: 北京・西山
    figure: 曹雪芹
    story: 『石頭記』の初期の写本は、曹雪欽の存命中に注釈付きのコピーが流通したことを証明しています。その原稿の後の欄外注記は、曹雪芹の死を未完のまま残された本と関連付けています。シナリオは彼の最後の冬に設定されており、彼の死の正確な日付や彼が書いた章の数は固定されていません。
    story_prose:
      opening:
        - 西丘陵では暗くなるのが早いです。写本家がページの小包を持ってやって来て、何を持っていけるか尋ねました。彼はその小包をベッドのそばの小さなテーブルに置きます。その上に白紙のシートが置かれています。
        - 注釈付きの『石頭記』は、曹雪欽が生きていた時代にすでに流通していました。 Jiaxu の原稿の後のメモには、本が完成する前に彼が亡くなったことが記憶されています。この想像上の冬の訪問では、彼自身が山積みを整理する時間がまだあります。
        - 写本家は暗くなる前に家に帰りたいと思っています。原稿に詳しい人なら、作業中のページから注釈付きのコピーを選ぶことができます。他人の世話をすることに慣れている人は、火やランプに目を向けることができます。そうすれば、テーブルの上にドラフトを広げるためのスペースが生まれます。
      points:
        p1: 写し手はベッドのそばでばらけたページの束を束ねようとしている。あなたは余白にあるもう一方の手の線を見つけて、彼にそれを読んでもらいます。彼は注釈付きのコピーを個別に包み、曹雪芹がまだ修正中のページを手の届くところに戻します。包みは一つずつ、別々の紐で結んだ。
        p2: 石炭が消えると、曹雪芹は今開いたページを閉じます。あなたは石炭を持ってきた人に火の世話をし、ランプを近づけて、曹雪芹が読んでいたページだけを渡すように頼みます。彼はカバーの下から手を伸ばし、再びラインを手に取ります。その晩、灯は手の届くところにあった。
        p3: 後の続編では家が再び栄える、と曹雪芹に話した。彼は眉をひそめ、第五回で鳥たちが散っていく歌の末尾を開き、あたり一面が真っ白になる一節を指した。評語のある写本を開き、滅びた明を悼む本だという後世の読み方をどう思うかと尋ねた。曹雪芹は大笑いした。ひと言も答えなかった。再び筆を取ると、考えが決まった紙にだけ印を付けた。写し手は印のある箇所を写し、あとは空けておいた。
      outcomes:
        all: 写し手は2枚のシートを持って帰ります。一緒に読むと、曹雪芹がどの章を整理し、どの選択をまだ検討しているのかがわかります。彼の笑いの意味を誰も書き留めていない。
        p1: 写本家は注釈が付けられた初期のコピーを持って帰ります。曹雪芹がまだ読みたいと思っている原稿がベッドのそばにある。
        p2: ランプはベッドのそばで少し長く燃えます。曹雪芹は取っておいたページを読み終える。
        p3: マークされた部分はコピーされ、未決定のスペースは空白のままになります。写本家は自分自身の推測を省きます。
      none: ページは入ってきたときと同じように積み重ねられています。後で誰かが最後の章について尋ねても、白紙の紙は何も答えません。
      not_admitted: 写し手が中に入ります。あなたは書類をベッドサイドテーブルに運ばずに、中庭にランプが一つだけ残るまで待ちます。
      desync: 注釈付きのコピーは作業ページに戻ります。写し手はそれを持たずに去り、オフィスはあなたを呼び戻します。
      excerpts:
        p1: 包みは一つずつ、別々の紐で結んだ。
        p2: その晩、灯は手の届くところにあった。
        p3: 写し手は印のある箇所を写し、あとは空けておいた。
    relic: 章の計画をまとめたゆるやかなシート
    relic_desc: いくつかの章の提案された順序と、曹雪芹がまだ決定していなかった内容のための空白部分が含まれたゲームの記念品。
    points:
      p1: 曹の作業ページが彼に返される間、注釈が付けられた初期のコピーはコピー作者の手に保管してください
      p2: 曹雪芹がエンディングをじっくり考えながら楽しい夜を過ごすことができるように、火とコピーに注意してください
      p3: 曹雪芹にはそれを検討する力がまだ残っているが、彼が引き継ぐことに同意した章の計画の別のコピーを残しておこう。
    points_fail:
      p1: このテーブルにある唯一のコピーは、作業ページの山に戻されます。この分岐では、読者は注釈付きのテキストなしで終了します。
      p2: 書類の準備が整う前に部屋が寒くなってしまいます。仕事はまた夕方を待ちます。
      p3: 写本家はバラバラのページを整理することはできるが、曹雪芹がどのような終わり方で去るつもりだったのかについては記録がない。
    shift:
      p1:
        was: Jiaxu の写本には、曹雪芹 の生涯の間にコピーされていた初期のテキストに関するメモが保存されています。
      p2:
        was: Jiaxu の原稿の欄外メモには曹雪芹の死が記されており、この本は未完のまま残されたと記されている。
        now: この分岐では誰かが火の番をし、ページを一度に 1 枚ずつ持ってきます。曹雪芹はある晩、物語の方向性を決める時間をとります。
      p3:
        was: Jiaxu の欄外注ではこの本は未完成であるとされており、曹雪芹が承認した最終章の計画は示されていない。
        now: 写経師は2枚のシートを取り上げます。一人は曹雪芹がこの支部で承認した命令を出します。もう1つは、彼がまだ決定していない運命をリストします。次のコピーでは、2 枚のシートは一緒に残ります。
        who: cao_xueqin_beijing
        bio: 曹雪芹は死ぬ前に写本家と章の計画を検討します。この分岐では、読者は後で彼がどのような決断を下したのか、どこで結末を未解決のままにしたのかを確認できます。
    vignettes:
      ink: 写本作成者は、提案された章の順序と読者が鉛筆で書いた推測との間にズレを設定します。これで、ページを正しい場所に戻すことができます。
      paper: '{staff}はランプを持ち込みます。写し手は原稿をテーブルの端から持ち上げてスペースを空けます。'
      empty: 最後のシートには別の見出しを入れる余地があります。写し手はスペースをそのままにしておきます。
  jenner_berkeley:
    name: 最初のワクチン
    place: イングランド・バークリー
    figure: エドワード・ジェンナー
    story: ジェンナーの 1798 年の調査書には、牛痘と天然痘に関する初期の観察と事例が記録されています。
    story_prose:
      opening:
        - バークレーでは、サラ・ネルメスがエプロンに手を添えて玄関にやって来ます。ジェンナーさんは、最初に病気になったのはいつだったか尋ねたいと考えています。写本家は自分の名前を他人のアカウントの下に置きます。彼女はドアのところで待ち、まずその日は酪農場に戻らなければならないかどうか尋ねます。
        - ジェンナーの 1798 年の調査には、サラの牛痘と 1796 年の初期の予防接種が記録されており、伝統的にジェームズ・フィップスと関連付けられています。このブランチでは、サラが望んでいるケアから始めて、その後の観察を戻ってきた人々まで追跡できるように支援することができます。
        - まずは介護経験のある人にサラの話を聞いてもらいましょう。記録を残している旅行者は、ジェンナーと家族がさらなる観察のために戻るかどうかを決定している間、名前と日付を確認することができます。
      points:
        p1: 写本師はデートを待っています。サラは手を引っ込めて席を求めました。あなたは椅子をドアに移動し、介護者に見てもらいたいかどうか尋ねます。彼女が「はい」と答えたら、酪農場に後で戻ってくるという連絡を送ります。帰り際、サラは空いた手で自分の名前が書かれた紙片を受け取った。
        p2: ジェンナーさんのノートのページには少年の再訪問が記されており、その下には小切手を求められた日付はまだ書かれていない。最初の記録とその後のレポートを区別するための新しいシートをコピー作成者に渡します。ジェンナーは、さらなる観察のために誰が戻ってくるのか尋ねます。ある世帯は住所を残します。書き手は日付を書き込み、一家が来たときに確かめられるよう一行空けた。
      outcomes:
        all: サラさんには手伝ってくれる人がいて、戻ってきた人たちは確認できる記録を持っています。ジェンナーはその年の観察を通じて作業を続けることができます。
        p1: サラが酪農場に戻るまでには数日かかる場合があります。その後の記録は依然として他の人々の復帰に依存しています。
        p2: 経過観察については相談が必要です。サラはまだ手の痛みを自分で我慢しなければなりません。
      none: サラは助けなしに酪農場に戻りますが、その後の観察を手配する人は誰もいません。
      not_admitted: 写本師は訪問者がどの家族と一緒に来たのかを確認します。外にいても、日付の欄はまだ空白です。
      excerpts:
        p1: 帰り際、サラは空いた手で自分の名前が書かれた紙片を受け取った。
        p2: 書き手は日付を書き込み、一家が来たときに確かめられるよう一行空けた。
    relic: フォローアップ伝票
    relic_desc: 名前、日付、観察内容を記入するスペースが記載された伝票。
    points:
      p1: 牛乳を注ぐ女が一人で傷つかないように、サラ・ネルメスの手の牛痘の傷を手当てしてください
      p2: 初期の症例記録の名前と日付を確認し、復帰に同意した家族とのフォローアップを手配します。
    points_fail:
      p1: 彼女の手の傷は、誰もそれを治す人もなく自然に治りました。この分岐では、牛乳を注ぐ人の日々を楽にする人は誰もいませんでした。
      p2: 誰も再訪問を手配しません。この部門では、歴史と同様に、ジェンナーは 1798 年にワクチン接種の研究を再開します。
    shift:
      p1:
        was: 1796 年 5 月、酪農婦のサラ・ネルメスは主人の牛から牛痘にかかり、その病気の通常の症状とともに大きな膿疱性のただれが彼女の手に形成されました。
        now: '{staff} さんは手を清潔に保ち、縛られたままにし、数日早く酪農場に戻りました。'
      p2:
        was: 1796 年の初期の症例の後、ジェンナーは 1798 年の春にワクチン接種の研究を再開しました。
        now: '{staff} は、希望する家族との再訪問の手配を手伝ってくれました。その夏、ジェンナーは以前の観察と照合するためのフォローアップメモを残していました。'
        who: jenner_berkeley
        bio: この年表の中で、ジェンナーは 1796 年の夏に戻ってくることに同意した家族からフォローアップのメモを受け取りました。
    vignettes:
      firsthand: 架空の写本家がすべての記述を同じ声で書きました。作家が実際に見たのはどれかと尋ねます。写経者は、すべての行に同じ重みを与えるのではなく、休符の横に音符を追加します。
      order: コピーでは 2 つの観察結果が入れ替わりました。あなたが日付をチェックすると、コピー担当者はその注文を使ってストーリーを語る前に伝票を裏返します。
      blank: コピー作成者が確認できないメモの下にスペースを残します。ページが渡されるまでに、空白部分にはラベルが付いているので、誰もそれを省略と間違えることはありません。
  mallory_everest:
    name: 最後に目撃された登攀
    place: エベレスト
    figure: ジョージ・マロリー
    story: 1924 年の遠征で残されたマロリーの手紙には、さまざまな収容所の状況と計画が記載されています。マロリーとアーヴィンの運命は、彼らが頂上に到達したかどうかを証明するものではありません。
    story_prose:
      opening:
        - ノースコルのテントのそばで誰かが、ノートンが下山後目を開けることができるかどうか尋ねました。別の登山者が次の登山の準備をしているマロリーの方を見上げます。先ほどのテントにあったコンパスはまだ戻ってきていない。
        - ノートンとサマヴェルは 1924 年にエベレストの高みに引き返し、マロリーとアーバインは次に向かいました。 6月8日、オデルは2人の登山者がまだ登っているのを目撃したが、どちらも戻ってこなかった。この分岐では、前のグループを助け、コンパスを返し、次のグループが北コルに戻るのを手伝うことができます。
        - ノートンとサマヴェルの世話をできる人を送ってください。キャンプの引き継ぎに詳しい旅行者ならコンパスを見つけることができます。最後の下りでは、次のパーティーがキャンプに戻るのを手伝ってくれる人を送ってください。
      points:
        p1: ノートンがまた声を掛けた。サマヴェルは答えられず、膝に手を置いた。先に行った仲間を呼び戻して、サマヴェルが腰掛けられる場所を探し、具合を自分で話せるまで待った。彼がうなずいたので、二人で足元の荷袋をどけた。立ち上がると、ノートンが具合を尋ね終わるまで待った。
        p2: ノートンは光が痛いと言い、再び目を閉じた。あなたは彼にどこで休むかを選択してもらい、オフィスの介護者に見てもらいます。しばらくしてから、一か所がまだ痛むが、もう片方の目で光が見えるようになったと彼は言います。係が名簿を持ち上げると、ノートンは自分の欄を見つけられた。
        p3: オデルはキャンプ V でケースを開け、予備品の横に小さな丸い箱を見つけます。あなたはそれをマロリーのメッセージと照合し、タグと一緒に持ってきます。彼は別の登山者の前でそれを開け、途中で使う予定のポケットに滑り込ませた。彼はザックを下ろさずに手が届くところへ、自分でコンパスをしまった。
        p4: 北コルの誰かが、雲から出てくる二人の人影が彼らが待っている人たちなのかと尋ねます。店員に名前を入力するよう頼む前に、名前を言うのを待ちます。マロリーは雪の上に荷物を置き、アーヴィンは雪のさらに奥に座っています。二人は下山の様子を話した。登頂したかどうかも、その時刻も、キャンプの誰にも分からなかった。
      outcomes:
        all: サマヴェルとノートンが戻ってきて、マロリーはコンパスを持っています。北コルで返還されたあと、さらに 2 人の名前が記録されています。
        p1: 第一パーティの登山者は両方ともキャンプに戻ります。次のペアには、まだ出会う人が必要です。
        p2: この枝では、ノートンは近くの文字を自分で読めるほどよく見ることができます。その他の成果は旅の残りの後に続きます。
        p3: マロリーは手の届くポケットにコンパスを入れています。その帰還により、彼らの最果ての地点は不確実になります。
        p4: マロリーとアーバインはノースコルに生きて戻ります。変更された降下により、彼らが頂上に到達したかどうかはわかりません。
      none: 風と雪がキャンプに到達しても、誰もリストを変更しません。オデルは後に尾根で最後に見た二人の人影を記録する予定だ。
      not_admitted: キャンプの係員は見知らぬ人にテントの場所を与えません。彼らが不足している機器について話し合っている間、あなたは外で待ちます。
      desync: サマヴェルはノートンと一緒に戻ってくることはありません。先ほどの下降は同期が取れなくなり、事務所は旅行者を呼び戻します。
      excerpts:
        p1: 立ち上がると、ノートンが具合を尋ね終わるまで待った。
        p2: 係が名簿を持ち上げると、ノートンは自分の欄を見つけられた。
        p3: 彼はザックを下ろさずに手が届くところへ、自分でコンパスをしまった。
        p4: 二人は下山の様子を話した。登頂したかどうかも、その時刻も、キャンプの誰にも分からなかった。
    relic: ピッケル
    relic_desc: 頭が擦り切れた白木のピッケル。
    points:
      p1: サマヴェルが下り坂で窒息したときは、彼が息を取り戻すのを手伝い、ノートンとの試みが無事に終わるのを見届けてください。
      p2: ノートンの雪盲を治す
      p3: マロリーがキャンプVに残したコンパスを彼の手に渡す
      p4: マロリーとアーバインを引き返すか、下る途中で合流して、二人が生きてノースコルに到着できるようにする
    points_fail:
      p1: サマヴェルは雪の中に座り込んだまま起き上がれない。 2人の登山者のうち1人だけが戻ってきます。この分岐は歴史から消え去り、事務所はその従業員を召還した。
      p2: ノートンさんの目は痛くて開けられず、その後数日間は何も見えなくなりました。
      p3: コンパスはまだキャンプ V のテントの中にありますが、2 人が 6 月 8 日に登ったとき、彼らはコンパスを持っていませんでした。
      p4: 6月8日の正午過ぎのある時点で、オデルは尾根の上でまだ登っている二人を最後に見た。彼らは戻ってこない。
    shift:
      p1:
        was: 1924年6月4日、ノートンとサマヴェルはキャンプVIを出発し、約8,570メートルに到達した。下りの途中、サマヴェルの喉が凍傷組織でふさがれ、窒息しそうになり、咳き込んで、二人ともキャンプに到着した。
      p2:
        was: 1924年6月4日の夜、ノートンは重度の雪目になり、ノースコルに戻った後もほとんど目が見えなくなりました。
        now: 翌日にはノートンの目は晴れ、ノースコルを行き交う人々が見えるようになった。
      p3:
        was: 1924年6月7日、マロリーはキャンプVIからオデルにコンパスをキャンプVのテントに置き忘れたが、彼らにはコンパスがなかったとのメモを送った。
        now: 6月8日早朝に出発したとき、マロリーは自分のポケットにコンパスを入れていました。
      p4:
        was: 1924 年 6 月 8 日、オデルはマロリーとアーバインが北東の尾根を高く登るのを最後に目撃しましたが、二人とも戻ってきませんでした。マロリーさんの遺体は1999年に標高約8,160メートルで発見された。
        now: 6月9日、二人は凍傷になったが生きていた状態でノースコルに降り立った。マロリーはルースと3人の子供たちのいるイギリスに帰りました。彼らがあの日どこにたどり着いたのか、このタイムラインにも答えはありません。
        who: mallory_everest
        bio: 1924年、彼とアーヴィンは生きてエベレストから降り立った。彼は妻ルースと3人の子供たちの住む家に帰り、さらに何年も暮らしました。
    vignettes:
      date: 架空の使者は異なる陣営からの 2 通の手紙を持っていますが、携帯伝票には 1 通の日付が共通しています。見出しを個別に確認するように依頼します。各手紙は独自の場所と日付を残して出発します。
      question: 使者は意図的な出発を約束として読み上げます。あなたは手紙が天気について語っている文で止まります。今回も条件を付けたまま計画を繰り返す。
      wrap: メッセンジャーが膝の上で書類を分類している間、あなたは送信用の封筒を脇に置いておきます。キャンプリストを手紙の中に折らずにしまうことができます。
  nightingale_scutari:
    name: 記録とケアから始まる看護
    place: オスマン帝国・スクタリ
    figure: フローレンス・ナイチンゲール
    story: フローレンス・ナイチンゲールの軍の健康に関する 1858 年の報告書は、最近の戦争を参考にしており、病院の統計も含まれていました。最終的なレポートの作成ではありません。
    story_prose:
      opening:
        - スクタリの病棟ではシフトが変更になったところです。ナイチンゲールは事務員に転校リストを渡し、新規の入学者とは別に保管するよう頼んだ。衛生委員会が到着し、3人の委員が見回りを始めようとしています。
        - 衛生委員会は 1855 年 3 月にスクタリの病院を査察しました。ヘクター・ギャヴィンは 4 月にバラクラヴァでの事故で亡くなりました。ナイチンゲールは5月にそこで重篤な病気になり、すぐに回復しましたが、その後は健康状態が悪化しました。ここで、検査を保存し、検査に何が起こるかを変更できます。
        - 病棟の記録に詳しい人が検査の進行を手伝ってくれます。キャンプでは、旅行者にギャヴィンを見張ってもらいます。後で、介護をしている人がナイチンゲールにどのように休みたいかを尋ねることができます。
      points:
        p1: 事務員は異動リストを新規入学として数えます。看護師に両方のシートを読んでもらい、委員がドアに到着する前に重複したものにマークを付けます。次の場所について尋ねる前に、問題を区に報告することができます。誰かが二冊の帳簿を持って出てきた。どちらにも白いページがまだたくさん残っていた。
        p2: ギャヴィンはテントにいる弟にリボルバーを渡そうとしている。キャンプの安全責任者が取りに来るまで、両者に一時停止するように頼みます。中のテーブルで、ギャヴィンは持ち去ろうとした衛生ノートを開きます。その日の午後、署名をもらいに来た人は、彼を同じ机で見つけた。
        p3: ナイチンゲールは数字の表を送り、それが来たら脇に置いておいてほしいと頼みます。あなたは、オフィスの介護者に留まってもらいたいかどうかを尋ね、答えはまた別の日に来ると期待していると伝えます。気持ちが強くなると、彼女はまず窓を少し開けるように頼みます。それから彼女はどこで中断したのかと尋ねます。次に報告書を開いたとき、すぐに署名を済ませろと急かす人はいなかった。
      outcomes:
        all: 検査は時間通りに続きます。ギャヴィンはこの支部での事故から生き残り、ナイチンゲールは五月病から回復しました。彼女は自分で選択できるペースで仕事に戻ります。
        p1: 委員会は検査を開始し、さらなる作業のために使用可能なリストを削除します。
        p2: ギャヴィンは無事にキャンプに残った。彼は衛生ノートに記録された作業を続けることができます。
        p3: この分岐ではナイチンゲールの回復が早くなります。彼女は、いつフィギュアを再度開くかを選択します。
      none: リストはしばらく病棟内で混在したままになる。知らせを待っている人々は、依然として4月と5月の手紙を待ち続けるだろう。
      not_admitted: ポーターは視察団以外の人たちに待機を要請する。看護師が転送リストを再度確認する音が聞こえます。
      desync: 検査が時間通りに始まらない。病棟の記録が同期しなくなり、事務所は旅行者を呼び戻すことになる。
      excerpts:
        p1: 誰かが二冊の帳簿を持って出てきた。どちらにも白いページがまだたくさん残っていた。
        p2: その日の午後、署名をもらいに来た人は、彼を同じ机で見つけた。
        p3: 次に報告書を開いたとき、すぐに署名を済ませろと急かす人はいなかった。
    relic: 小さなオイルランプ
    relic_desc: 彼女の夜のランプが回る。
    points:
      p1: 病棟で発疹チフスとコレラが発生しているため、スクタリ病院に対する衛生委員会の検査を3月6日から続けてください。
      p2: バラクラバのテントでリボルバーの発砲を止め、衛生委員のヘクター・ギャヴィンを救出せよ
      p3: ナイチンゲールが5月にバラクラヴァで罹ったクリミア熱を、生涯続く前に治す
    points_fail:
      p1: 病棟では検査が滞り、詰まった下水道の開通が間に合わない。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。
      p2: テント内で発砲され、この支部でも、上陸から1か月後に委員会は3人の委員のうち1人を失うことになる。
      p3: 熱は下がります。彼女は5月末までに危険を脱したが、この分岐では歴史と同様に病気が彼女につきまとっている。
    shift:
      p1:
        was: 1855年3月6日、衛生委員会はコンスタンティノープルに到着し、その日の午後スクタリの病院の調査を開始した。
      p2:
        was: 1855年4月21日、クリミア半島で衛生委員のヘクター・ギャヴィンが兄にリボルバーを渡した際に発砲し、殺害された。
        now: '{staff} は両方の男性に一時停止を求めます。ギャヴィンはリボルバーを下ろし、キャンプの安全責任者を呼びます。彼は委員会の仕事を続け、その後英国に戻ります。'
      p3:
        was: 1855 年 5 月、ナイチンゲールはバラクラヴァの病院を視察に行き、数日以内にクリミア熱に感染しました。彼女は約12日間危険な病気にかかり、その後の人生のほとんどを障害者でした。
        now: '{staff} は、今世紀にない薬で最初の数日間の発熱を治療します。ナイチンゲールは一週間以内に回復し、自宅で続いた病気も治らずスクタリに戻ります。'
        who: nightingale_scutari
        bio: ナイチンゲールは、1855 年にバラクラヴァで罹った熱病をこの支部で治しました。彼女は病室からではなく、自らその足で病院と軍の保健に関する仕事を続けました。
    vignettes:
      totals: 架空の事務員が転送リストを入学者数の合計に追加します。どのような名前が新たに認められるのか尋ねます。彼らは、返品を送信する前に、転送を独自の列に残します。
      name: 店員は部屋の騒音で名前を聞くことができません。言った人がもう一度言えるようになるまで、その人の隣で待ちます。次のコピーでは、彼らが尋ねたとおりに綴られています。
      fold: 事務員が声をかけた順に病棟の書類をセットします。以前は合計の後に表示されていたシートが、合計の前に表示されるようになりました。
  scott_last_camp:
    name: 棚氷の上のテント
    place: ロス棚氷
    figure: ロバート・ファルコン・スコット
    story: スコットの最後の日記の日付は 1912 年 3 月 29 日です。残された原稿には、南極点から帰還する途中の一行の最後のキャンプが記録されています。返却後の読書風景を想像します。
    story_prose:
      opening:
        - ロス棚氷を越えて風が吹くと、氷河からの石が入った袋がそりの上に落ちます。スコットは日記を冒頭から遠ざけます。明日どこまで行けるか、先を行く人は誰も約束できません。オーツはブーツを脱いで、どこか乾いた場所に座れる場所を尋ねました。
        - 1912 年 3 月、スコットの一行は帰還途中でトラブルに見舞われた。オーツはテントから出たまま戻らなかった。スコットと他の2人はワントン補給所から約11マイルで拘束された。日記と標本をまとめて保管し、オーツとスコットを順番に助け、残りの一行を倉庫まで連れて行くことができます。
        - 寒い中荷物を運べたり、他の人の世話をしたりできる人を派遣してください。介護者に各人に何が必要かを尋ねさせ、最後に歩くのが最も遅い人に十分な時間を与えます。
      points:
        p1: 石の袋を一つ降ろそうという声がした。ウィルソンに札の採取地を読んでもらい、スコットには日誌の場所を確かめてもらった。暗い中で取り出す必要のないものは下に入れ、石と日誌はそれぞれ置き場所を決めた。テントをたたむとき、そりの側面には氷河の名がまだ読めた。
        p2: オーツはトランクを開けようとして、そこに留めます。今回は速く走れないと彼は言う。あなたは彼にテントの中に座って、残って見守ってくれる人と明日のペースについて話し合うように頼みます。翌日テントの入口が開くと、自分の靴がほかの靴と並べられるのを待って立ち上がった。
        p3: スコットによれば、右足には左足のように体重がかからなくなったという。あなたは彼の世話をできる人に電話し、荷物を運ぶ人たちにしばらくラインを下ろしてもらいます。スタートで彼はしっかりと足を踏み入れてから、移動の合図をします。最初の区間を歩き終え、彼は足を止めて進んだ距離を日記に書けた。
        p4: ドリフトがテントを押しつける。残り11マイル。全員が準備ができたと言うのを待ち、車両基地を知っている人と順番に方向を探します。旗のところで、誰もが中身を見に行く前に最後の人を待ちます。補給所の物資のそばで、新しいページを開いた。鉛筆はまだ紙の上を走った。
      outcomes:
        all: 日記と岩が一行とともに倉庫に到着します。オーツとスコットは他の仲間とともにこの困難を乗り越え、日記には新しい一日が始まります。
        p1: 記録と標本は最後の日まで保管されます。パーティーが荷物を軽くしなければならないときは、彼らはそりに乗ったままになります。
        p2: オーツはパーティーに残る。次の停留所では、他の人たちと一緒に車内で休むことができます。
        p3: スコットはしっかりと足を踏み入れることができる。チームの残りのメンバーに何が起こるかは、まだ最後の展開にかかっています。
        p4: 最後まで頑張って車両基地に到着する人々。報告書には、残りの旅行に従って彼らの到着が記録されます。
      none: 燃料も体力も消耗してしまう。風がテントを固定し、3月下旬には記録が止まってしまう。
      not_admitted: 党には新人が入る余地がなかった。あなたは燃料と岩がまだ充電されている状態で、外に留まります。
      desync: 日記や標本は歴史的記録が終わる前に残されます。事務所は旅行者を呼び戻します。
      excerpts:
        p1: テントをたたむとき、そりの側面には氷河の名がまだ読めた。
        p2: 翌日テントの入口が開くと、自分の靴がほかの靴と並べられるのを待って立ち上がった。
        p3: 最初の区間を歩き終え、彼は足を止めて進んだ距離を日記に書けた。
        p4: 補給所の物資のそばで、新しいページを開いた。鉛筆はまだ紙の上を走った。
    relic: 日記
    relic_desc: 寒さで硬くなった、鉛筆で書かれた小さな日記。
    points:
      p1: 燃料が不足し体力も衰える行軍の中で、ビアードモア氷河からの日記と岩石標本をそりに乗せてください。
      p2: オーツの凍傷の足を治して、3 月 16 日前後にテントから出ずにパーティーに参加できるようにする
      p3: 3 月 18 日までに、パーティー全体の進行を遅らせる凍傷からスコットの右足を救ってください。
      p4: 3 月 21 日に始まる吹雪の中を 3 人を連れて行き、最後の 11 マイルを越えて 1 トン基地まで向かいます
    points_fail:
      p1: 標本は氷棚に放置され、日記は最終日に達しません。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。
      p2: 足の状態は日に日に悪くなり、この分岐でも3月16日頃に川の流れに出てしまい、戻ってきません。
      p3: 足がすくみ、この分岐では、歴史上そうであったように、行進はゆっくりと這うように減速します。
      p4: 吹雪がテントをその場に留め、3月29日以降、日記には新しいページがなくなった。
    shift:
      p1:
        was: 1912年3月、帰りの燃料が不足していた一行は、ビアードモア氷河で採取した日記とグロソプテリスの化石をそりに積んだ。捜索隊は11月12日にテントと一緒に彼らを発見した。
      p2:
        was: 1912 年 3 月初旬、オーツの足は重度の凍傷に見舞われ、動きが鈍くなりました。 3月16日か17日に彼はテントから出て行き、再び姿は見えなかった。
        now: '{staff} さんは毎晩足を温め、靴下を履き替えていますが、凍傷は悪化しませんでした。オーツはそりの横でペースを保ち、最後のキャンプでもまだ一行と一緒にいます。'
      p3:
        was: 1912年3月18日、スコットは右足のつま先がほぼすべてなくなり、行進はさらに遅くなったと書いている。
        now: '{staff}はキャンプのたびに右足を温めて包み込む。スコットが足を止め、一行は昔のペースで北へ進んでいく。'
      p4:
        was: 1912年3月21日から猛吹雪が起こり、スコット、ウィルソン、バウワーズはワントン補給所から11マイル離れたテントの中に閉じ込められた。最後の日記の日付は3月29日で、捜索隊は11月12日にテントを発見した。
        now: '{staff} は風が止む中、3 人を北へ導き、最後の 11 マイルを短いステージに分けて進みます。彼らはワントン補給所で燃料と食料を見つけ、吹雪にも耐えます。冬の前に、彼らはケープエバンスに戻ります。'
        who: scott_last_camp
        bio: このタイムラインでは、スコットはウィルソンとバウワーズとともに極地から生きて戻り、エバンス岬に到着しました。彼は英国に戻り、遠征の日記と科学的結果を自ら編集しました。
    vignettes:
      distance: 政府機関に戻ると、架空の事務員が移動距離という見出しの列に距離をコピーします。あなたは彼らに、それがまだ先の距離であることを示します。コピーを提出する前にエントリを移動します。
      blank: 代理店に戻ると、事務員は最終日のところで立ち止まります。その先の空白部分にどのようにマークを付けるかを彼らが決定するまで、あなたは待ちます。彼らはここで記録が終わると書き、鉛筆を置きます。
      opening: 代理店に戻り、練習用コピーを開いて、ストーリーの前の日付を読みます。店員は、ページが再び順番に見つかるように、表紙に同じ日付を記入します。
  seacole_balaklava:
    name: 自分でたどり着いた先の宿
    place: バラクラヴァ
    figure: メアリー・シーコール
    story: メアリー・シーコールの 1857 年の回想録には、彼女がトーマス・デイとともにバラクラヴァ近くで経営していたブリティッシュ・ホテル、そこで販売されていた商品、そして 1855 年にそこに来た人々について記述されています。
    story_prose:
      opening:
        - バラクラヴァ通り沿いのホテルはカウンターをオープンしたばかりです。メアリー・シーコールは臨時病院用のバッグをドアに向かって押します。トーマス・デイは何が売りに出されたのか尋ねます。彼女はまず負傷者の手当てをしてから報告に戻るつもりだという。
        - 1855年6月18日、シーコールは臨時病院の近くで負傷者を助け、親指を負傷したと記録している。デイと一緒に経営していたホテルでも盗難に遭った。和平の後、夫婦は 1856 年に破産しました。病院で仕事を保存し、彼女の怪我、馬、家畜の世話を別々に助けることができます。
        - 介護経験のある方を派遣します。ホテルを知っている旅行者は厩舎を見ることができます。後で、追加の在庫を注文するかどうかを決定する前に、両方のパートナーの帳簿を確認できる人を雇ってください。
      points:
        p1: 道行く人が、臨時病院に何か送ってもらえないかと尋ねます。ドアのそばにあるバッグと水を渡し、ベッドのそばで待っているシーコールに確認します。病院に着くまでに、質問者さんはバッグを置ける場所を見つけました。彼女はそれを開き、いちばん近くにいる患者に何が要るか尋ねた。
        p2: シーコールさんは右手を支え、親指を動かすと痛いと言う。あなたは彼女の世話をする訓練を受けた人に電話して、どこに座りたいかを尋ねます。彼女が運んでいたバッグを別の人が奪います。休んだあと、彼女は手を上げて痛みが引いたと言い、患者の名を書く紙片を頼んだ。
        p3: 裏口から物音が聞こえてくる。番頭が立ち上がると馬小屋に誰も監視していないことに気づきました。一人がシーコールに電話し、もう一人が庭が見える場所から馬の数を数えてもらいます。外にいる人は誰でも庭の答えを聞いて立ち去ります。夜明けには、荷馬車につなぐ馬がまだ水桶のそばにいた。
        p4: 新たな注文を入れる日が近づいています。シーコールは棚にある商品を声を出して数えるように彼に頼みます。注文、在庫、未払いの負債を 1 枚のシートに記入し、軍隊が出発する前に何が売れるかを尋ねます。パートナーはそれを一度確認し、次回の配送をキャンセルします。シーコールが帳簿を閉じると、カウンターの奥には最後の引き取り分に使う空の棚が残った。
      outcomes:
        all: シーコールさんは臨時病院に到着し、その後も手を使えるようになりました。馬小屋は満室のままで、ホテルが閉まるとパートナーが帳簿を清算します。
        p1: 彼女は予定通り仮設病院で人々の世話をし、その夜ホテルに戻る。
        p2: 誰かが彼女の親指まで気を配っているので、メモに戻るときはペンを使う方が簡単です。
        p3: その夜、馬は厩舎に残ります。朝、荷車を持っている人々は、荷車がどこにあるかを知っています。
        p4: シーコールとデイは清算をする。最後の配達により、軍隊が帰国するときに売れ残った在庫が残ることはありません。
      none: 誰も在庫を数え終えておらず、道沿いの人々はまだ誰かが迎えに来てくれるのを待っています。
      not_admitted: 店員は訪問者にドアをふさがないようにお願いします。入院バッグは持っていくリストに載っていません。
      desync: シーコールは歴史の道で助けた場所に辿り着けない。事務所は旅行者を呼び戻します。
      excerpts:
        p1: 彼女はそれを開き、いちばん近くにいる患者に何が要るか尋ねた。
        p2: 休んだあと、彼女は手を上げて痛みが引いたと言い、患者の名を書く紙片を頼んだ。
        p3: 夜明けには、荷馬車につなぐ馬がまだ水桶のそばにいた。
        p4: シーコールが帳簿を閉じると、カウンターの奥には最後の引き取り分に使う空の棚が残った。
    relic: 薬箱
    relic_desc: ハーブとガーゼを入れるためのコンパートメントが付いた古い木製のチェスト。
    points:
      p1: レダン号への攻撃が失敗した6月18日、シーコールはウォロンゾフ・ロードの仮設病院の横で砲火の下で仕事を続ける。
      p2: 彼女が甲羅から身を投げて右手の親指を脱臼したときは、その場で関節を固定して副木を固定します
      p3: ブリティッシュ ホテルの馬を狙って夜にやってくる泥棒を阻止する
      p4: セヴァストポリ陥落後、平和によって破産しないようにシーコールとトーマス・デイに株の購入をやめて清算するよう説得する
    points_fail:
      p1: その日、彼女は臨時病院に到着することはなく、負傷者たちは包帯も巻かずに道路脇で待機していた。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。
      p2: 親指は急いで縛られるだけで、この枝では歴史のように、決して正しい形に戻ることはありません。
      p3: 朝までに馬小屋の半分は空になり、ホテルは荷物を運ぶために陸上輸送キャンプから動物を借りなければなりません。
      p4: 和平後に軍が撤退すると株は売れなくなり、1856年11月に両社はロンドンで破産宣告を受ける。
    shift:
      p1:
        was: 1855年6月18日、連合軍によるリダン号攻撃が失敗した日、シーコールは包帯と食糧を砲火の下でウォロンゾフ道路沿いの仮病院まで運び、医師たちの負傷者の治療を手助けした。
      p2:
        was: 1855年6月18日、シーコールは砲弾から逃れようと身を投げ、右手親指を脱臼した。それはその場で縛られ、二度と元の形に戻りませんでした。
        now: '{staff} はジョイントを設定し、その場で副木を固定します。数週間後、彼女の右手は以前と同じように薬を調合し、包帯を結びました。'
      p3:
        was: 1855年、スプリングヒルのブリティッシュホテルは何度も強盗に遭った。ある朝、ほとんどの馬がいなくなっていました。
        now: '{staff} は夜警中に馬を先導する男たちを止めます。翌日、ホテルのカートはいつものようにバラクラヴァへ向かいます。'
      p4:
        was: 1856 年 3 月の和平の後、軍隊はすぐに撤退し、シーコールとデイには売れ残った株と借金が残されました。 1856年10月に彼らに対して破産申し立てが行われ、11月に破産が宣告された。
        now: '{staff} は秋に 2 社のパートナーを説得して、大量注文を中止し、未払い金を回収するよう説得しました。平和が訪れると、彼らの持ち株は少なくなり、清算を終えてクリミアを離れ、決して破産裁判所に立つことはない。'
        who: seacole_balaklava
        bio: このタイムラインでは、シーコールは破産することなく、ある程度の自己資金を持ってクリミアから帰国しました。彼女は公的保険で生活する必要はなく、自分のお金で介護と旅行を続けました。
    vignettes:
      meal: 架空の顧客は、何のために来たのか説明できないほど長時間立っています。まずは席を見つけます。係員が戻ってくるまでに、顧客は自分の言葉で夕食を求めることができます。
      counter: 2 人の顧客が同じ注文を繰り返し、お互いが相手の言葉を聞いていないと思っています。あなたは係員に、彼らが書いたものを読み返してもらいます。トレイは1つあれば十分であることがわかります。
      shelf: 係員がカウンターの端に空きを求めます。空になった皿を 2 枚移動し、待っている客が次の客を待たずに座れる場所にスツールを置きます。
  wegener_greenland:
    name: 氷床を越えて
    place: グリーンランド氷床
    figure: アルフレート・ヴェーゲナー
    story: ヴェーゲナーは 1930 年に物資を携えて内陸のアイスミッテ駅に到着し、その帰路に死亡しました。アルフレート・ヴェーゲナー研究所の記述には遠征の順序が保存されており、グリーンランド人の仲間であるラスムス・ウィルムセンが特定されている。
    story_prose:
      opening:
        - グリーンランドの氷にかかるそりの荷重が再び数えられた。ヴェーゲナーは、ロエベが自分の足でやっていけるかどうか尋ねます。ヴィラムセン氏は、視界が良くなったら、まだその先にある場所がアイスミッテであることを認識する必要があると言う。
        - 1930 年 10 月、アルフレッド ヴェーゲナー、フリッツ レーベ、ラスムス ヴィルムセンはアイスミッテに到着しました。ロエベは宿泊しました。ヴェーゲナーは帰国途中に亡くなり、ヴィラムセンと彼が持っていた日記も行方不明となった。このブランチでは、到着を保存し、旅のさまざまな時点で各人を助けることができます。
        - 雪上経験のある人を派遣して、一行の移動と物資の受け渡しを手伝ってもらう。介護者にロエベとヴェーゲナーを別々にチェックしてもらいます。西側陣営がヴィラムセンをいつ予想するかを確実に知っておいてください。
      points:
        p1: そりの後ろしか見えません。ヴィラムセン氏は党にしばらく活動を休止するよう要請した。最初のシートに手渡す物資をマークし、全員が残りの距離を進む前に、最後の人にそれぞれの物資を呼び出すようにします。観測所の一行が出てくると、そこにいる人と待機中の荷物を数えた。
        p2: ロエベは凍傷になった足を休め、乾いた靴下はどこに行ったのか尋ねます。他の人が介護に行く前に、介護者に話を聞いてもらうように頼みます。数日後、彼は別の場所に座ってみるかどうか尋ねられました。寝台のそばに掛けてあったものを手に取り、自分で選んだ腰掛けへ移った。
        p3: 誰かが日記を書類と一緒にバッグに入れ始めました。ヴィラムセンはまずそれを見てほしいと言う。あなたは彼に到達できる場所を選ばせ、西側陣営が彼を待つべきだという知らせを送りました。そりが入ってくると、誰かが自分のものを取りに前に出ます。ヴィルムセンは荷物の脇から日誌を取り、自分の手で渡した。
        p4: 帰りのテントの中で、ヴェーゲナーは誰か先に連絡を送ってくれないかと尋ねる。あなたはその要求を外に出して、介護者を連れ戻してどのくらい休みたいかを尋ねます。一行が西のキャンプに到着すると、入り口にいる人が毛布を持ってきて座るように言います。まだ手が震えていたが、ヴェーゲナーは到着者名簿に自分の名を書いた。
      outcomes:
        all: 救援隊が日程を決め、ロエベは治療を受ける。その後、ヴェーゲナーとヴィルムセンは西のキャンプに到着し、日記はそれを待っていた人々に手渡されました。
        p1: 一行は10月30日に駅に到着し、物資がリストと照合される。
        p2: ロエベの足は駅でのケア後に改善し、この分岐では手術を回避しました。
        p3: ヴィラムセンと日記は西のキャンプに戻ります。このレポートは、旅の他の部分に関するヴェーゲナー自身の結果を追跡しています。
        p4: ヴェーゲナーは生きて西の陣営に到着する。日記の引き渡しは、ヴィラムセンに何が起こったかにかかっています。
      none: 氷の上の最後のストレッチはさらに時間がかかります。西側の到着リストにはまだ空白行がある。
      not_admitted: 物資リストには訪問者が入る余地はない。誰かがあなたに、そりのそばで働いている人々から離れて立つように頼みました。
      desync: 一行は10月30日の到着を逃す。引き継ぎは同期が取れず、オフィスは旅行者をリコールします。
      excerpts:
        p1: 観測所の一行が出てくると、そこにいる人と待機中の荷物を数えた。
        p2: 寝台のそばに掛けてあったものを手に取り、自分で選んだ腰掛けへ移った。
        p3: ヴィルムセンは荷物の脇から日誌を取り、自分の手で渡した。
        p4: まだ手が震えていたが、ヴェーゲナーは到着者名簿に自分の名を書いた。
    relic: そりストラップ
    relic_desc: 荷物を積んだそりから凍った革製のストラップ。
    points:
      p1: ヴェーゲナー、ロエベ、ヴィルムセンが10月30日にアイスミッテに到着できるよう、救援隊を氷の最後の区間まで続けさせよう。
      p2: 凍傷になったロエベの足を治療し、氷の洞窟で足の指を切断しなくても済むようにする
      p3: ヴィラムセンがヴェーゲナーの日記を持ってキャンプに到着できるように、西へ向かう途中でヴィラムセンを安全に見守ってください
      p4: 帰りにヴェーゲナーを氷の上で治療し、彼が生きて西側キャンプに入ることができるようにする
    points_fail:
      p1: 一行は寒さのため氷上で開催され、10月30日には駅に到着しなかった。この分岐は歴史から消え去り、事務所はその従業員を召還した。
      p2: ロエベの凍傷になった足の指は救えなかった。その冬、駅で二人の交通が遮断され、彼は春まで歩くことができなかった。
      p3: ヴィラムセンはヴェーゲナーを埋葬し、日記を持って西へ向かった。再び彼を見た人は誰もおらず、日記も彼とともに失われてしまった。
      p4: ヴェーゲナーさんは11月中旬頃、帰国途中、氷上のテントの中で亡くなった。翌年５月に発見された。
    shift:
      p1:
        was: '1930 年 10 月 30 日: 氷上で 40 日間を過ごした後、ヴェーゲナー、ロエベ、ヴィラムセンは氷床の真ん中にあるアイスミッテ駅に到着しました。'
      p2:
        was: '1930年冬: アイスミッテで、ロエベは凍傷に陥った足の指をポケットナイフで切り落とされ、残りの冬の間歩くことができなくなった。'
        now: ロエベはつま先を保った。彼は駅で自分の足で冬を過ごした。
      p3:
        was: 1930年11月：ヴィラムセンはヴェーゲナーを氷の上に埋め、日記を持って西へ向かう。彼は決して見つかりません。
        now: ヴィラムセンは西の野営地に到着し、ヴェーゲナーの日記を遠征隊の手に渡した。
        bio: ラスムス・ヴィラムセンは 1930 年 11 月に氷から戻り、グリーンランドの家族のもとに帰りました。
      p4:
        was: 1930年11月1日：ヴェーゲナーは50歳の誕生日にアイスミッテを去る。彼は11月中旬頃に氷上で亡くなり、1931年5月12日に遺体で発見された。
        now: '{staff} は帰り道ずっと彼と一緒にいて、毎晩彼の強さを観察しました。彼は生きて西部キャンプに入り、遠征隊の測定結果が判明するのを生きて見ました。'
        who: wegener_greenland
        bio: ヴェーゲナーは 1930 年 11 月に氷床の真ん中から生きて戻りました。彼はさらに何年も生きて、遠征隊の観察がうまくいくのを見ました。
    shift_all: このタイムラインでは、その秋にアイスミッテに出入りした人は全員、生きて海岸に戻ってきました。
    vignettes:
      names: 架空の書記官は、遠征隊を 1 つの姓のみでリストします。誰が荷物を引き渡したのか尋ねます。彼らは、最もよく知られた名前だけを記録するのではなく、他の関係者のためにラインを残します。
      count: 店員は最初のカウントを配達された数量のように見せました。各図がどの駅から来たのかをマークしてもらいます。 2 つの合計は同じ見出しの下に置かれなくなりました。
      note: 店員が空の帳簿を結びつける間、あなたは宛先を 2 枚目の伝票にコピーします。次の人は、エントリがどのステーションに関するものであるかを知ることができます。
  tupaia_tahiti:
    name: 航海士の海図
    place: エンデバー号の船上
    figure: トゥパイア
    story: ライアテア島出身の航海士トゥパイアは 1769 年にエンデバー号に加わり、知っている島々の地図作成を手伝いました。船は1770年6月に現在のクイーンズランド州沖の岩礁に衝突した。バンクスは修理中のトゥパイアの壊血病を記録し、同年後半にバタビアでタイアタとトゥパイアの死亡を報告した。
    story_prose:
      opening:
        - エンデバー号で、トゥパイアは船が衝突したときに知っている島の名前を確認していました。束がテーブルの角から滑り落ち、監視員が助けを求めた。船がサンゴ礁の上で速く進んでいることを知ったとき、彼らはまだ暗いです。
        - エンデバー号は 1770 年に現在のクイーンズランド州沖の岩礁に衝突しました。乗組員は船を再浮上させて修理しました。トゥパイアはその期間中に病気になり、バンクスは数カ月後にバタビアでタイアタとトゥパイアの死の知らせを記録した。この分岐は船を保存し、トゥパイアに生鮮食品を届け、病気のときに二人が一緒に過ごす時間を与えることができる。
        - 乗組員がステーションを維持できるように支援できる人を派遣してください。修理中、誰かがトゥパイアに何を食べられるか尋ねるべきです。バタビアでは、一行はベッドサイドへの訪問を手配する時間が必要です。
      points:
        p1: 船倉から荷を上げる通り道を木箱がふさいでいる。ポンプを交代する人のために場所を空け、箱を運ぶ船員が通れるようにした。綱の反対側にいる者たちは、合図が来たら一緒に引けるようそばで待った。船が動いたとき、最初に気にかかったのは、ポンプのそばの者がまだ立っていられるかだった。
        p2: 生鮮食品はまず修理業者に送られます。トゥパイアは名前が呼ばれるのを聞いて、どれくらい待つ予定かを尋ねます。あなたは、彼が食べたいものを選ぶことができる部分を持ってきて、それから次のグループのために残ったものを記録します。皿が届くと、彼は取り分けてあったものの中から先に選ぶことができた。
        p3: バタビアの部屋には多くの病人がいて、同じ介護者が呼び出され続けています。トゥパイアは、タイアタが彼に会えるかどうかを誰かに尋ねます。あなたは質問をパスし、椅子をベッドに移動する前に、両方が同意するのを待ちます。部屋を出るとき、二人はまだ互いの声が聞こえるところにいた。
      outcomes:
        all: 歴史上、船は無料で提供されます。同支部は、トゥパイアの食べ物の分け前やベッドサイドへの訪問も記録している。二人の死亡のニュースは記録に残っている。
        p1: Endeavor は無料で提供されます。修理担当者はさらに多くの作業を行う必要があります。その後の取り決めが残っている。
        p2: トゥパイアは自分が選んだ部分を受け取ります。記録のこの部分は、プレートが彼に運ばれたところで終わります。
        p3: 二人は少しの間話すことができるほど近くにいる。バタビアでの死者は今も続いている。
      none: 人々はまだ甲板で次の命令を待っています。新しい分け前は確保されておらず、その後の訪問も手配されていません。
      not_admitted: 乗組員は、割り当てられていない人々にポンプでステーションを撤去するよう依頼します。反対側からは、誰かが濡れた紙の束を拾っているのが見えます。
      desync: エンデバー号は夜明けでも速いです。歴史的な回復が同期しなくなり、オフィスは旅行者を呼び戻します。
      excerpts:
        p1: 船が動いたとき、最初に気にかかったのは、ポンプのそばの者がまだ立っていられるかだった。
        p2: 皿が届くと、彼は取り分けてあったものの中から先に選ぶことができた。
        p3: 部屋を出るとき、二人はまだ互いの声が聞こえるところにいた。
    relic: 島々のスケッチ
