catalog:
  sun_yat_sen_guangzhou:
    name: 銅像から新しい大学へ
    place: 広州
    figure: 孫文
    story: 中山大学の孫文像の前から、1924年2月4日の広州へと時をさかのぼる。この日、孫文は三つの学校を統合して国立広東大学を設立するよう命じ、鄒魯に準備を任せた。同じ時期の日曜日には高等師範学校の講堂で講演を行い、何人もの手を経た講演の記録は一冊の本になった。9月19日に授業が始まり、11月11日の創立式典では孫文が書いた校訓が使われた。孫文は1925年3月12日に北京で亡くなり、翌1926年、大学にはその名が冠された。
    relic: 孫文の銅像
    relic_desc: 中山大学のキャンパスに立つ銅像。1924年の広州への通り道だが、骨董品ではないので売却できない。
    points:
      p1: 城外のどこに募集告知を貼るか道順を決め、届け役に渡す
      p2: 紹介を受けて三校を回り、初会合までに困り事を一枚にまとめて届ける
      p3: 候補地を見比べ、石牌に決まる前に比較図を届ける
      p4: 三校の卒業名簿を照合し、6月21日の式典用に一冊にまとめて届ける
      p5: 石牌へ向かう一行に加わり、新校地の境界杭を立てる
    points_fail:
      p1: この分岐では告示は市内にしか貼られず、城外の学生が知ったときには出願がもう始まっていた。
      p2: 第一回準備会議は史実どおりに開かれ、三校の困りごとはばらばらに語られたまま、まとめた一覧はなかった。
      p3: 新キャンパスは史実どおり石牌に決まり、準備室の机には候補地をまとめた地図が一枚もなかった。
      p4: 6月21日の卒業式は史実どおりに行われた。準備室では三校の名簿を別々に確認することになった。
      p5: 石牌の校地は史実どおり紙の上で区切られただけで、境界の杭は一本も立たなかった。
    shift:
      p1:
        was: 1924年6月9日、国立広東大学は各省の教育庁に学生募集を委託し、6月10日に予科試験の出願受付が始まった。募集予定は520人。
        now: この分岐では、城外の辻や波止場にも募集の告示が貼られた。
      p2:
        was: 1924年3月3日、第一回準備会議が開かれ、議題の最初は三校の学生の卒業問題だった。
        now: この分岐では、会議の机に三校の困りごとをまとめた一覧が置かれた。
      p3:
        was: 1924年、学校が各地に分散して管理しにくいため、孫文は鄒魯に石牌を新キャンパスに選ばせ、その年のうちに土地が区切られた。
        now: この分岐では、選定の書類の横に、候補地と石牌をまとめて描いた地図が添えられた。
      p4:
        was: 1924年6月21日、鄒魯が国立広東大学の校長に就任し、同じ日に旧三校の卒業式が行われた。
        now: この分岐では、準備室は確認済みの統一名簿を使って式を進められた。
      p5:
        was: 1924年、孫文は鄒魯に石牌を新キャンパスとして選ばせたが、新校舎の着工は1933年、最初の学院が移ったのは1934年秋だった。孫文は1925年3月12日に亡くなり、それを見ることはなかった。
        now: この分岐では、11月に孫文が広州を離れる前に、石牌の校地の境界がもう一本ずつ立っていた。
        who: sun_yat_sen_guangzhou
        bio: この時間線では、孫文が広州を離れる前に、新キャンパス石牌の境界が定まっていた。
    shift_all: 五つの仕事はすべて片付いた。今になって孫文が後に記した校訓を読み返すと、あの仕事が「博学・審問・慎思・明辨・篤行」に重なって見える。
    vignettes:
      slips: 架空の事務員が原稿を写そうとしている。貼り紙が二行を覆っている。貼り紙と原稿は誰が書いたのかとあなたが尋ねると、彼は貼り紙を動かさず、先に原稿を写す。
      back_row: 架空の学生が席を見つけられず、何度も立ち上がって辺りを見回す。あなたが長椅子で少し詰めると、彼は黙って最後まで聞き、講堂から人が引いていくときにあなたにうなずく。
      hundred: あなたは手帳の最後のページに正の字を書き、一日ずつ数える。百日になったところで、架空の事務員が何を数えているのかと尋ねる。あなたは、日数だと答える。
  lalibela_rock:
    name: 岩の水路の出口を探す
    place: エチオピア、ラリベラ
    figure: ラリベラ王と石工たち
    story: ザグウェ朝のラリベラ王は1181年から1221年まで在位した。その名を冠する町には岩を掘り下げて造った十一の教会と、溝や掘割、通路があり、王が造らせたと伝わる。教会ごとの年代ははっきりしない。1520年代にはポルトガルの司祭フランシスコ・アルヴァレスが使節団とともに訪れ、ヨーロッパで初めて詳しい記録を残した。1978年に世界遺産に登録された。
    relic: 石工のたがね
    relic_desc: 刃先を薄く研いだ鉄のたがね。
    points:
      p1: 石工たちの仲間に入り、掘割から石くずを運び出す
      p2: 雨季の前に水路を出口までたどり、水がたまる場所を示す
      p3: 雨季に、溝を端から端までさらう作業を手伝う
    vignettes:
      outlet: '{staff}は岩に刻まれた水路を曲がり角の先、外に開ける場所までたどり、石片を置いて印をつける。'
      rain: '{staff}は掘割で足首まで水につかり、日が暮れるまで泥を入れたかごを縁へ一つずつ渡す。'
      bend: '{staff}は掘割の曲がり角に印をつけた略図を描く。翌朝、手伝いの者が同じ場所を見つけられるように。'
  ife_bronzes:
    name: 鋳上がりに残す線
    place: ナイジェリア、イフェ
    figure: イフェの鋳物師たち
    story: ヨルバの都市イフェでは、およそ四世紀にわたって銅合金で写実的な頭像が作られた。多くは1300年ごろの作と見積もられている。1910年、ドイツ人レオ・フロベニウスは聖なる森の祭司に、自らオロクンの頭像と名づけた像を売るよう迫ったが、返還を余儀なくされた。1938年にはウンモニジェの敷地を掘っていた作業員が複数の頭像を見つけた。その一つが現在大英博物館にある。1948年のロンドンの展覧会では、イタリアやギリシャの名品にも比肩すると評された。
    relic: 二枚の習作図
    relic_desc: 無地の試し鋳物に見える線を見比べるための図。
    points:
      p1: 鋳物師たちの仲間に入り、ろうで試しの原型を作る
      p2: 鋳込みの日に、るつぼの下の火を絶やさない
      p3: 鋳込み後、ろうに刻んだ線とあとから加わった線を見分ける
    vignettes:
      line: '{staff}は仕上げ前の絵と今日の試作品を並べ、新しい傷を別の紙に描く。'
      surface: '{staff}は試作品の下の板を傾け、光を表面に走らせて、細い線の始まりを紙に記す。'
      edge: '{staff}は無地の試し鋳物を描き、その隣に今日だけ見えた一本を描く。次は記憶に頼らずに比べられる。'
  great_zimbabwe:
    name: 図面に残す通路
    place: ジンバブエ、マシンゴ
    figure: 大ジンバブエの建設者たち
    story: 大ジンバブエはショナの人々の祖先が築き、11世紀から15世紀にかけて栄えた。大囲壁には花崗岩を整然と積んだ長い曲線の壁があり、二つの壁に挟まれた狭い通路は円錐形の塔へと続く。1871年にドイツ人カール・マウフが遺跡にたどり着いた。1980年には国名がこの都市にちなむジンバブエとなり、1986年には遺跡が世界遺産に登録された。
    relic: 通路の略図
    relic_desc: 二つの壁の間を白く残した作業図。
    points:
      p1: 壁を築く一団に加わり、次の段に合う大きさの石を選り分ける
      p2: 二つの壁の間を歩き、通り道を白く残して描く
      p3: 乾季に谷から丘の上の職人たちへ水を運ぶ
    vignettes:
      lines: '{staff}は二本の線を引き、間は白いままにする。使い走りは壁ではなく白い部分をたどればよい。'
      width: '{staff}は内側の壁が途切れるところまで歩き、線を一周させずにそこで鉛筆を止める。'
      pace: '{staff}は石積み一段の長さを歩いて測り、壁の根元の平らな石に歩数を刻む。'
