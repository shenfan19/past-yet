        p1:
          class_lettered: 八月の末、財布はもうすぐ空になるところだった。幕府の手当はもともと少なく、残りの旅費は忠敬が自分で出していて、西別まではまだ何日もかかった。{staff}は机仕事に慣れていて、残った金を一文ずつ広げ、この先の宿と食事を一つずつ書き出し、切り詰められる項目を筆で丸く囲んだ。一行はいつもどおり先へ進んだ。西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。
          class_trade: 八月の末、財布はもうすぐ空になるところだった。幕府の手当はもともと少なく、残りの旅費は忠敬が自分で出していて、西別まではまだ何日もかかった。{staff}は商いをしたことがあり、漁村に入って値段を掛け合い、米を数日分の干し魚に替え、宿代も少し下げさせた。一行はいつもどおり先へ進んだ。西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。
