# Generated by tools/build_data.mjs from the cards folder. Do not edit this file, edit the cards and run the build.
refs:
  game: Elaborado con ayuda de IA.
sections:
  people:
    cajal_barcelona:
      name: Santiago Ramón y Cajal
      text: Neurocientífico español (1852–1934). Sus observaciones de tejidos teñidos con plata aportaron pruebas de que el sistema nervioso está formado por células diferenciadas. Enseñó en Barcelona de 1887 a 1892 y en 1906 compartió el Nobel con Camillo Golgi, cuyo método de tinción había adaptado.
fact_lines:
  abel_froland:
    quintic: '1824: Abel demuestra que la ecuación general de quinto grado no puede resolverse mediante radicales.'
    sledge: 'Navidad de 1828: resfriado y tos, Abel llega en trineo a Froland para ver a su prometida.'
    last_paper: '6 de enero de 1829: en la cama de Froland, Abel escribe su último artículo, dos o tres páginas sobre la idea principal de sus memorias de París.'
    death: '6 de abril de 1829: Niels Henrik Abel muere en Froland, a los veintiséis años.'
    berlin: '8 de abril de 1829: Crelle, sin saberlo, escribe desde Berlín que el puesto de Abel está asegurado.'
    prize: '1830: la Academia de París concede su Gran Premio a Abel, fallecido, y a Jacobi.'
    memoir: '1841: por fin se imprimen las memorias que Abel entregó a la Academia de París.'
  ahmed_baba_timbuktu:
    conquest: '1591: un ejército marroquí toma Tombuctú.'
    deported: '1594: acusado de resistir al sultán, Ahmad Baba es llevado a Marrakech.'
    return: '1608: A Ahmad Baba se le permite regresar a su casa en Tombuctú.'
    death: '22 de abril de 1627: Ahmad Baba muere en Tombuctú.'
  al_haytham_cairo:
    fustat_fire: '1020: partes de Fustat fueron incendiadas durante los disturbios. El registro no dice dónde estaban Ibn al-Haytham o sus manuscritos ese día.'
  archimedes_syracuse:
    siege: 'Siracusa: la ciudad resiste el asedio romano.'
    death: 'Siracusa: la ciudad es tomada y Arquímedes es asesinado.'
  artemisia_florence:
    admission_fee: '19 de julio de 1616: Artemisia ingresa en la Academia de las Artes del Dibujo de Florencia.'
    commission_balance: 'Agosto de 1616: se registra la última entrega de Alegoría de la Inclinación.'
  bach_leipzig:
    eyes: 'Primavera de 1750: Bach apenas sabe leer ni escribir para sus ojos.'
    operations: 'Primavera de 1750: John Taylor opera los ojos de Bach. Las complicaciones requieren una segunda operación.'
    death: '28 de julio de 1750: Bach muere en Leipzig.'
  banneker_maryland:
    fire: '1806: un incendio destruye gran parte de lo que Banneker guardaba en su casa.'
  basho_hiraizumi:
    set_out: 'El día veintisiete del tercer mes, Genroku 2: Bashō parte de Fukagawa en Edo con Sora hacia el norte.'
    depart: 'El decimotercer día del quinto mes, Genroku 2, bien: alrededor de las diez de la mañana Bashō y Sora salen de Ichinoseki hacia Hiraizumi.'
    takadachi: Suben a Takadachi y contemplan los ríos Kitakami y Koromo.
    golden_hall: En Chūsonji, el mayordomo les muestra el Salón Dorado.
    sutra_hall: 'La Sala Sutra permanece cerrada: el mayordomo no está.'
    back: Sobre las cuatro de la tarde están de regreso en su alojamiento en Ichinoseki, donde el anfitrión tiene listo el baño.
    ogaki: 'Aproximadamente el día veintiuno del octavo mes: Bashō llega a Ōgaki, el final del camino angosto.'
    death: 'El duodécimo día del décimo mes, Genroku 7: Matsuo Bashō muere en Osaka.'
  beethoven_vienna:
    full_rehearsals: '5 de mayo de 1824: coro y orquesta ensayan juntos por primera vez, dos días antes del concierto.'
    premiere: '7 de mayo de 1824: en el Teatro Kärntnertor se interpreta por primera vez la Novena Sinfonía, con Beethoven en escena.'
    second_concert: '23 de mayo de 1824: se repite el concierto en la gran Redoutensaal; la sala es escasa y las ganancias decepcionan a Beethoven.'
    death: '26 de marzo de 1827: Muere Ludwig van Beethoven en Viena.'
  bell_boston:
    notebook: '10 de marzo de 1876: Watson comprende las palabras habladas por Bell a través del teléfono experimental.'
    centennial: '25 de junio de 1876: Bell hace una demostración del teléfono en la Exposición del Centenario en Filadelfia.'
  bessie_coleman_jacksonville:
    paxon: '30 de abril de 1926: Coleman y el piloto mueren durante un vuelo de práctica en Paxon Field.'
  bizet_paris:
    premiere: '3 de marzo de 1875: Carmen estrena en la Opéra-Comique.'
    rehearsals: El teatro sigue ensayando a Carmen hasta el día de su inauguración.
    death: '3 de junio de 1875: Bizet muere en Bougival.'
  boltzmann_duino:
    counting: '1877: Boltzmann cuenta cuántas disposiciones de partículas dan la misma distribución de energía.'
    leave: 'Mayo de 1906: Boltzmann, enfermo de lo que se llama neurastenia severa, deja de dar conferencias en Viena.'
    duino: 'Verano de 1906: Boltzmann llega con su mujer y su hija a Duino, cerca de Trieste.'
    death: '5 de septiembre de 1906: Ludwig Boltzmann muere en Duino, a la edad de sesenta y dos años.'
    perrin: '1908: Los experimentos de Jean Perrin sobre el movimiento browniano comienzan a confirmar las predicciones de Einstein sobre los átomos.'
    perrin_nobel: '1926: Jean Perrin recibe el Premio Nobel de Física por su trabajo sobre la estructura discontinua de la materia.'
  boole_ballintemple:
    lecture: El 24 de noviembre de 1864, Boole enseñó en el Queen's College de Cork.
    death: El 8 de diciembre de 1864 Boole murió en su casa de Ballintemple.
    supplement: En noviembre de 1865, el prefacio de Isaac Todhunter registró quién había recalculado la tabla y por qué.
  bose_calcutta:
    salary_wait: '1885: Bose comenzó a enseñar en Presidency College. Rechazó el salario más bajo y la disputa tardó unos tres años en resolverse.'
  buchner_zurich:
    typhus: Büchner enferma con fiebre.
    minna: 'Febrero de 1837: Minna Jaeglé llega a Zúrich al final de la enfermedad de Büchner.'
    death: Büchner muere en Zúrich, a los veintitrés años.
  cajal_barcelona:
    chair: '1887: Cajal ocupa la cátedra de histología de la Universidad de Barcelona.'
    revista: '1 de mayo de 1888: Cajal publica a su costa el primer número de su revista. Imprime unos sesenta ejemplares y envía la mayoría al extranjero.'
    berlin: 'Octubre de 1889: Cajal muestra sus preparaciones al microscopio en la reunión de Berlín. Albert von Kölliker se interesa por sus resultados.'
    madrid: '1892: Cajal deja Barcelona para ocupar la cátedra de histología en Madrid.'
    nobel: '1906: Cajal y Golgi comparten el premio Nobel por sus estudios sobre la estructura del sistema nervioso.'
  camille_claudel_paris:
    father: '3 de marzo de 1913: el padre de Camille Claudel muere en Villeneuve-sur-Fère.'
    admission: '10 de marzo de 1913: Camille Claudel ingresa en Ville-Évrard.'
  cantor_halle:
    hunger: La guerra ha vaciado las despensas; Cantor está enfermo y le falta comida.
    clinic: 'Desde la clínica Cantor vuelve a escribirle a su esposa: le pide volver a casa.'
    death: '6 de enero de 1918: Cantor muere en la clínica de Halle.'
  cao_xueqin_beijing:
    early_copy: La recopilación de Jiaxu registra uno de los primeros textos comentados de La historia de la piedra.
    unfinished: Una nota marginal posterior recuerda la muerte de Cao antes de que se terminara el libro. Su cronología está en disputa.
  caroline_herschel_slough:
    comet_letter: '2 de agosto de 1786: Caroline Herschel envía los dibujos de ambas noches con su informe sobre el cometa.'
  chekhov_badenweiler:
    departure: '3 de junio de 1904: Chéjov, gravemente enfermo, abandona Moscú con Olga Knipper hacia un balneario alemán.'
    romerbad: '23 de junio de 1904: Chéjov y Olga Knipper se encuentran en el hotel Römerbad de Badenweiler, todavía cansados por el viaje.'
    letter: '25 de junio de 1904: desde Villa Friederike, Chéjov envía a María su nueva dirección y le escribe sobre el jardín soleado.'
    sommer: '5 de julio de 1904: Chéjov escribe a María desde el Hotel Sommer; la oficina de correos está al lado.'
    steamer: '11 de julio de 1904: en el calor, Chéjov escribe para preguntar qué vapor podría llevarlos a él y a Olga a Rusia por mar.'
    death: '15 de julio de 1904: Antón Chéjov muere de madrugada en Badenweiler, a los cuarenta y cuatro años.'
  copernicus_frombork:
    rheticus: '1539: Rheticus, un joven matemático de Wittenberg, llega a Frombork e insta a Copérnico a publicar su libro.'
    giese_worry: '8 de diciembre de 1542: Tiedemann Giese escribe que está profundamente preocupado por la salud del anciano Copérnico.'
    revolutions: '1543: en Nuremberg se imprime De revolutionibus, con una dirección sin firma dirigida al lector al frente.'
    book_reached: 'Hacia el 24 de mayo: el impreso De revolutionibus llega a Frombork. Giese escribirá que llegó el día de su muerte; puede que haya venido después.'
    death: '24 de mayo de 1543: Nicolás Copérnico muere en Frombork.'
    giese_letter: '26 de julio: Giese escribe a Rheticus, le agradece las dos copias y le pide que solicite una edición enmendada al concilio de Nuremberg.'
    autograph: '1999: el autógrafo de De revolutionibus, conservado en la Biblioteca Jagellónica de Cracovia, entra en el registro de la Memoria del Mundo.'
    remains: '2008: una comparación de ADN muestra que los restos encontrados bajo el suelo de la catedral de Frombork son los de Copérnico.'
  curie_paris:
    april_note: '12 de abril de 1898: Marie Curie informa a la Academia de Ciencias que la pechblenda emite rayos más fuertes que el uranio.'
    polonium: '18 de julio de 1898: los Curie anuncian un nuevo elemento en la pechblenda y lo llaman polonio, en honor a Polonia.'
    radium: '26 de diciembre de 1898: los Curie y Bémont anuncian el radio en la Academia de Ciencias.'
    shed: '1902: de aproximadamente una tonelada de pechblenda, los Curie separan una décima parte de un gramo de cloruro de radio.'
    pierre_death: '19 de abril de 1906: Pierre Curie muere atropellado por un vehículo tirado por caballos en París.'
    death: '4 de julio de 1934: Marie Curie muere de anemia aplásica en Alta Saboya.'
  dante_ravenna:
    exile: '1302: Florencia condena a Dante al exilio y luego a muerte si alguna vez regresa.'
    ravenna: 'Hacia 1318: Dante se instala en Rávena, por invitación de Guido Novello da Polenta.'
    bologna_letter: 'Hacia 1319: desde Bolonia, Giovanni del Virgilio envía a Dante un poema en latín, instándolo a escribir en latín y venir a Bolonia por el laurel.'
    questio: '20 de enero de 1320: en Verona, Dante da una conferencia sobre el lugar que ocupan el agua y la tierra en el globo.'
    death: '14 de septiembre de 1321: Dante, enfermo de una embajada en Venecia, muere en Rávena.'
    rehabilitation: '16 de junio de 2008: el ayuntamiento de Florencia aprueba una moción pidiendo al alcalde que revoque la sentencia 1302 de Dante.'
  darwin_galapagos:
    lawson: En Charles Island, el vicegobernador Lawson dice que puede saber de qué isla proviene una tortuga.
    james_island: '8 de octubre de 1835: Darwin y un pequeño grupo desembarcan en la isla James con una tienda de campaña, mientras el Beagle busca agua.'
  david_fleay_healesville:
    first_swim: '26 de febrero de 1944: Fleay observó por primera vez a Corrie salir a nadar.'
    public_debut: 'Marzo de 1944: Corrie se escondió antes de su debut público. Cuando los cuidadores la sacaron, la mayoría de los visitantes se habían ido.'
  dickinson_amherst:
    death: '15 de mayo de 1886: Emily Dickinson muere en su casa de Amherst.'
  du_chatelet_luneville:
    luneville: 'Julio de 1749: Du Châtelet llega a la corte de Stanislas en Lunéville para esperar el nacimiento de su hijo.'
    birth: '4 de septiembre de 1749: antes del amanecer, Du Châtelet da a luz a una hija.'
    death: '10 de septiembre de 1749: Émilie du Châtelet muere en Lunéville, seis días después de su nacimiento.'
    receipt: '10 de septiembre de 1749: en París, la Biblioteca Real firma tres paquetes de sus comentarios sobre Newton.'
    principes: '1759: se publica su traducción francesa completa de los Principia de Newton, con su comentario.'
  du_fu_xiang_river:
    final_journey: El epitafio de Yuan Zhen registra la muerte de Du Fu fuera de casa y su entierro temporal en Yueyang.
  emily_bronte_haworth:
    death: '19 de diciembre de 1848: Emily Brontë muere en Haworth.'
  enheduanna_ur:
    expulsion: La Exaltación de Inana describe la expulsión del orador del templo.
  eratosthenes_alexandria:
    tutor: 'Alrededor del 245 a. C.: Ptolomeo III lleva a Eratóstenes a Alejandría para enseñar a su hijo.'
    librarian: 'Alrededor del 240 a. C.: Eratóstenes se convierte en bibliotecario de la Biblioteca de Alejandría.'
    midsummer: 'Mediodía de verano, según el relato posterior de Cleomedes: no hay sombra bajo el puntero en Siene; en Alejandría el Sol está a una quincuagésima parte de un círculo completo desde el cenit.'
    death: 'Hacia 194 a. C.: Eratóstenes, ciego de vejez, muere en Alejandría.'
  euclid_alexandria:
    elements: 'Hacia el 300 aC: en Alejandría, Euclides escribe los trece libros de los Elementos.'
    pappus: 'Alrededor del año 320 d.C.: Pappus, en Alejandría, escribe que los porismos contienen 171 teoremas y 38 lemas.'
    printed: '1482: Erhard Ratdolt imprime los Elementos en Venecia, con diagramas en los márgenes.'
  fanny_mendelssohn_berlin:
    death: '14 de mayo de 1847: Fanny Hensel muere en Berlín.'
  faraday_london:
    disc: '28 de octubre de 1831: el disco de cobre produce corriente al girar.'
  fibonacci_pisa:
    bugia: 'Década de 1190: en Bugia, en la costa del norte de África, el joven Leonardo de Pisa aprende a contar con las nueve figuras indias.'
    numerals: '1202: en Pisa, Leonardo termina el Liber abaci, un libro de cálculo con las nueve cifras indias y el cero.'
    frederick: 'Hacia 1225: la corte de Federico II se reúne en Pisa y Juan de Palermo plantea problemas a Leonardo.'
    revision: '1228: Leonardo publica un Liber abaci revisado. De esta versión son las copias que llegan hasta siglos posteriores.'
    salary: '1240: la República de Pisa concede al maestro Leonardo Bigollo un salario anual por su ayuda en las cuentas de la ciudad.'
  freud_vienna:
    father: '23 de octubre de 1896: Jacob, el padre de Freud, muere en Viena.'
    appearance: '4 de noviembre de 1899: Se publica en Viena La interpretación de los sueños, publicada por Franz Deuticke.'
    imprint: 'El mismo día: el año impreso en su portada es 1900.'
    second_edition: '1909: aparece la segunda edición de La interpretación de los sueños, después de que los 600 ejemplares de la primera tardaran ocho años en venderse.'
    professor: '1902: Freud es nombrado profesor extraordinario en la Universidad de Viena.'
  galen_rome:
    comedy_glossary_lost: '192: el fuego destruye el glosario de palabras de la Comedia antigua de Galeno.'
  galois_paris:
    release: '29 de abril de 1832: Galois es liberado en París, después de más de nueve meses de reclusión.'
    letter_to_chevalier: '29 de mayo de 1832: durante la noche Galois escribe a su amigo Auguste Chevalier, exponiéndole su trabajo y pidiéndole que imprima la carta.'
    duel: '30 de mayo de 1832: temprano en la mañana, Galois recibe un disparo en el abdomen en un duelo y lo abandonan donde cayó, hasta que un granjero que pasaba lo encuentra.'
    death: '31 de mayo de 1832: Évariste Galois muere en el hospital de Cochin, a los veinte años.'
    burial: '2 de junio de 1832: Galois es enterrado en una fosa común en Montparnasse.'
    printed: 'Septiembre de 1832: Chevalier imprime la carta en la Revue encyclopédique.'
    liouville: '1846: Joseph Liouville publica los artículos de Galois en su diario.'
  gaudi_barcelona:
    accident: '7 de junio de 1926: en la Gran Vía un tranvía atropella a Gaudí; Tomado por un mendigo, yace en la calle mientras pasan los taxis.'
    death: '10 de junio de 1926: Antoni Gaudí muere en un hospital de Barcelona, a los setenta y tres años.'
    burial: '12 de junio de 1926: Gaudí es enterrado bajo el edificio que dirigió durante cuarenta y tres años.'
    workshop: '20 de julio de 1936: se incendia el taller y se pierden la mayoría de los dibujos y maquetas de Gaudí.'
  great_zimbabwe:
    builders: A partir del siglo XI, los antepasados de los Shona construyeron una ciudad de piedra en esta colina. La construcción dura más de trescientos años.
    mauch: '1871: el alemán Karl Mauch llega a las ruinas.'
    western_yard_loss: '1915: las cuadrillas retiran la mayoría de las plataformas, bancos y paredes de tierra del recinto occidental.'
    name: '1980: un nuevo país toma su nombre de la ciudad, Zimbabwe.'
    heritage: '1986: El Gran Zimbabwe es inscrito como Patrimonio de la Humanidad.'
  gutenberg_mainz:
    loans: Fust prestó dos veces a Gutenberg 800 florines para la redacción de los libros.
    bible: '1455: en Maguncia se imprime el libro de 42 líneas con tipos metálicos móviles.'
    lawsuit: '6 de noviembre de 1455: un notario redacta el proceso que Fust ha iniciado contra Gutenberg por sus préstamos e intereses.'
    workshop: Después del conflicto, Fust y Schöffer continúan imprimiendo en Maguncia.
  hammurabi_babylon:
    accession: 'Alrededor de 1792 a. C.: Hammurabi se convierte en rey de Babilonia.'
    stele: 'Hacia 1754 a.C., al final del reinado de Hammurabi: se erige una estela de basalto tallada con casi trescientas leyes.'
    death: 'Alrededor de 1750 a. C.: muere Hammurabi.'
    susa: 'Siglo XII a. C.: la estela se lleva a Susa y se eliminan varias columnas de su texto.'
    found: '1901: una expedición francesa desentierra la estela de Susa, partida en tres.'
  hargrave_stanwell_park:
    boxkite: '1893: Hargrave comienza a experimentar con cometas y fabrica la cometa de caja.'
    beach: '12 de noviembre: en la playa de Stanwell Park, cuatro cometas unidas levantan a Hargrave de la arena, a casi 16 pies de altura.'
    photo: '12 de noviembre de 1894: una fotografía registra a Hargrave y James Swaine con el equipo de cometa en Stanwell Park.'
    death: '6 de julio de 1915: Hargrave muere en Sydney, a los 65 años.'
  hertz_bonn:
    illness: Hertz vuelve a dar conferencias este trimestre, entre operaciones de nariz y garganta.
    mechanics: '3 de diciembre de 1893: Hertz envía el manuscrito de Los principios de la mecánica al editor.'
    death: '1 de enero de 1894: Heinrich Hertz muere en Bonn.'
  higuchi_ichiyo_tokyo:
    death: '23 de noviembre de 1896: Higuchi Ichiyō muere de tuberculosis.'
  hildegard_bingen:
    lifted: 'Marzo de 1179: finaliza la restricción al canto.'
  hipparchus_rhodes:
    commentary: 'Finales del siglo II a. C.: el comentario de Hiparco señaló que algunas estrellas descritas juntas en el conocido poema no surgieron juntas.'
  hooke_london:
    death: El 3 de marzo de 1703, Robert Hooke murió en Londres.
    edition: En 1705 Richard Waller publicó las obras póstumas de Hooke.
  hua_tuo_xuchang:
    manuscript_lost: El Sanguozhi registra que el carcelero rechaza el libro. Hua Tuo lo quema.
    death: El Sanguozhi registra la muerte de Hua Tuo en Xu.
  humboldt_chimborazo:
    crevasse: '23 de junio de 1802: debajo de la cumbre del Chimborazo un profundo barranco detiene a los escaladores y estos retroceden.'
    sickness: Más arriba se detienen los porteadores; Los tres continúan, con hemorragias nasales y mareos.
  hypatia_alexandria:
    teaching: 'Principios de 415: Hipatia todavía enseña en Alejandría y los magistrados de la ciudad vienen a escucharla.'
    feud: La disputa entre el prefecto y otra facción de la ciudad se agudiza y Hypatia se ve envuelta en ella.
    death: 'Marzo de 415: Hipatia es asesinada en Alejandría.'
  ibn_al_nafis_cairo:
    collection: '1288: Ibn al-Nafis muere y deja su biblioteca en un hospital. Hoy en día sólo sobreviven partes de su gran enciclopedia médica.'
  ibn_battuta_tangier:
    departure: '2 de Rajab 725 (junio de 1325): Ibn Battuta abandona Tánger.'
    return: 'Hacia 1354: después de casi treinta años de viaje, regresa a casa y dicta sus viajes a Ibn Juzayy.'
  ibn_khaldun_cairo:
    cairo: '1382: Ibn Jaldún llega a El Cairo por invitación del sultán Barquq.'
    family_release: '1384: a petición del sultán, Túnez deja que su esposa y sus hijas naveguen hacia Egipto.'
    qadi: '8 de agosto de 1384: es nombrado juez principal de la escuela Maliki.'
    rivals: '1385: tras unos diez meses en el cargo, deja el puesto de juez por la presión de sus rivales.'
    shipwreck: El mismo año el barco que transportaba a su esposa e hijas se hunde en Alejandría.
    timur: 'Principios de 1401: en las afueras de la sitiada Damasco, Ibn Jaldún se encuentra con Timur.'
    death: '17 de marzo de 1406: Ibn Jaldún muere en El Cairo.'
    burial: Está enterrado en el cementerio fuera de Bab al-Nasr.
  ibn_rushd_lucena:
    exile: Ibn Rushd es desterrado a Lucena. Las cuentas también registran una orden de quemar libros.
  ibn_sina_hamadan:
    death: '1037: Ibn Sina muere en Hamadán.'
  ife_bronzes:
    frobenius: '1910: Leo Frobenius debe devolver una cabeza de metal que obtuvo en Ife.'
    wunmonije: 'Enero de 1938: Al cavar los cimientos en el recinto de Wunmonije, los constructores descubren un grupo de cabezas.'
    exhibition: 'Julio de 1948: las piezas fundidas de Ife se exhiben en el Museo Británico.'
    field_plan_gap: Después de que se rellenaron la mayoría de las trincheras, los arqueólogos posteriores no tenían un plan completo de las primeras excavaciones y tuvieron que reconstruir el diseño.
  ino_tadataka_ezo:
    set_out: '11 de junio de 1800: Ino Tadataka y el grupo de reconocimiento abandonan Edo hacia Ezo.'
    coast: '1800: en Ezo el grupo de reconocimiento recorre la costa sur hasta Nishibetsu.'
    death: '1818: Muere Ino Tadataka. Durante un tiempo nadie lo anuncia, por lo que el trabajo en los mapas puede continuar.'
    map: '1821: Takahashi Kageyasu y los demás terminan los mapas de las costas del Gran Japón.'
  jianzhen_nara:
    eiei: 'Duanzhou: Eiei, que vino a Yangzhou para invitar a Jianzhen a cruzar, muere a causa de su enfermedad.'
    eyes: En el viaje hacia el norte, Jianzhen pierde la vista.
  kafka_kierling:
    larynx: 'Marzo de 1924: Kafka empieza a tener problemas para tragar; La tuberculosis ha llegado a su laringe.'
    kierling: '19 de abril de 1924: Kafka y Dora Diamant llegan al sanatorio Hoffmann de Kierling; habla en trozos de papel.'
    klopstock: 'Hacia el 6 de mayo de 1924: el estudiante de medicina Robert Klopstock llega a Kierling para ayudar en la enfermería.'
    last_proofs: '2 de junio de 1924: Kafka sigue corrigiendo las pruebas de Un artista del hambre.'
    death: '3 de junio de 1924: Franz Kafka muere en Kierling, a los cuarenta años.'
    burial: '11 de junio de 1924: Kafka es enterrado en Praga.'
    four_stories: 'Finales de agosto de 1924: Se estrena en Berlín Un artista del hambre, cuatro cuentos.'
  keats_rome:
    arrival: '15 de noviembre: Keats y Severn llegan a Roma y ocupan habitaciones en el segundo piso del número 26 de Piazza di Spagna, junto a la Plaza de España.'
    rome_letter: '30 de noviembre: Keats le escribe a Charles Brown que escribir una carta y despedirse se ha vuelto difícil.'
    death: '23 de febrero, a altas horas de la noche: Keats muere. Severn está con él.'
    register: En el registro de entierros el día figura como 24 de febrero.
    burial: '26 de febrero: Keats es enterrado en el cementerio junto a la pirámide.'
    epitaph: 'Por su deseo, la piedra no llevará su nombre, sólo: Aquí yace Aquel cuyo nombre fue escrito en agua.'
    severn: '1879: Muere Severn. Está enterrado junto a Keats.'
  kepler_leonberg:
    arrest: '7 de agosto de 1620: Katharina Kepler es arrestada en Heumaden; El caso contra ella comienza en Leonberg.'
    charged: '4 de septiembre de 1620: en Güglingen, Katharina es acusada de un delito capital.'
    kepler_arrives: 'Septiembre de 1620: Johannes Kepler regresa de Linz para defender a su madre.'
    postponed: '2 de octubre de 1620: la audiencia prevista para hoy se aplaza diez semanas, hasta el 11 de diciembre.'
    witnesses: '8 de enero de 1621: en Güglingen comienzan a prestar juramento los testigos.'
    defence: '7 de mayo de 1621: se entrega la defensa escrita de Katharina Kepler, respondiendo a cada testigo por turno.'
    released: 'Otoño de 1621: tras 405 días de detención, Katharina Kepler es liberada.'
    death: 'Abril de 1622: Katharina Kepler muere, unos seis meses después de su liberación.'
  kovalevskaya_stockholm:
    prize: '24 de diciembre de 1888: La Academia de París anunció el Premio Bordin por el trabajo de Kovalevskaya sobre la rotación de cuerpos rígidos.'
  lalibela_rock:
