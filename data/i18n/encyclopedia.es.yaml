    walker: '3 de octubre de 1849: Poe es encontrado angustiado en las urnas del Cuarto Distrito; Después de enviar una nota, lo llevan al Washington College Hospital.'
    death: '7 de octubre de 1849: Edgar Allan Poe muere antes del amanecer en el Washington College Hospital, a los cuarenta años.'
    burial: '8 de octubre de 1849: Poe es enterrado en Baltimore; Sólo vienen unas pocas personas.'
    ludwig: '9 de octubre de 1849: un obituario de Poe firmado por Ludwig aparece en el New York Tribune y se copia por todas partes.'
    clemm_letter: '9 de octubre de 1849: en Fordham, María Clemm se entera por el periódico de la muerte de Poe y escribe a Baltimore para preguntar.'
    moran_letter: 'Noviembre de 1849: más de un mes después de la muerte, el Dr. Moran le escribe a Maria Clemm sobre los últimos días de Poe.'
  puccini_brussels:
