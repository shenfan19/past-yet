    clinic: El 7 de noviembre de 1924, Puccini inició su tratamiento en Bruselas.
    operation: El 24 de noviembre de 1924, Puccini fue operado.
    death: El 29 de noviembre de 1924 Puccini murió en Bruselas.
    completion: El 28 de enero de 1926 Alfano fechó la primera partitura del dúo y la escena finales.
  pushkin_st_petersburg:
    address: 'Octubre de 1836: en una carta, Pushkin da su dirección como casa de la princesa Volkonskaya junto al puente Konyushenny. No hay ningún número; el de la puerta actual fue reparado en 1880.'
    duel: '27 de enero según el calendario antiguo, 8 de febrero según el nuevo: junto al río Negro, d''Anthès dispara primero y alcanza a Pushkin en el estómago. Pushkin responde y le roza el brazo.'
    carried_home: Lo llevan a su casa en el apartamento de Moika.
    apartment: '29 de enero según el calendario antiguo, 10 de febrero según el nuevo: Pushkin muere en el apartamento.'
    buried: Lejos de la ciudad, cerca de Mikhailovskoye, está enterrado junto a su madre.
  ramanujan_madras:
    clerk: 'Marzo de 1912: Ramanujan asume un puesto de secretario en el departamento de cuentas del Madras Port Trust.'
    letter: 'Jueves 16 de enero de 1913: desde Port Trust, Ramanujan escribe a G. H. Hardy en Cambridge sobre su trabajo.'
    england: '1914: Ramanujan zarpa hacia Inglaterra.'
    death: '1920: de regreso a la India y enfermo, Ramanujan muere.'
  rembrandt_amsterdam:
