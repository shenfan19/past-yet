    white: '13 de septiembre de 1901: Tesla responde a Stanford White sobre las ofertas inesperadamente altas.'
    building: 'Septiembre de 1901: comienza la construcción en Wardenclyffe.'
    marconi: '12 de diciembre de 1901: en Signal Hill, Terranova, Marconi escucha la carta S enviada desde Cornualles.'
    laboratory: 'Junio de 1902: Tesla traslada su laboratorio al edificio de ladrillo de Wardenclyffe.'
    no_more: 'Julio de 1903: Morgan escribe que no hará más avances.'
    demolished: '4 de julio de 1917: comienza la demolición de la torre Wardenclyffe.'
  timbuktu_sankore:
    departure: 'Alrededor de 1468: después de que Tombuctú cambiara de manos, los eruditos huyeron. Algunos fueron a Walata.'
  tupaia_tahiti:
    boards: '12 de julio de 1769: Tupaia sube a bordo del Endeavor y vuelve a decir que quiere navegar con él.'
    departs: '13 de julio: el Endeavour sale de Tahití con Tupaia y el niño Taiata a bordo.'
    chart: '15 de agosto: Tupaia comienza a elaborar un mapa de las islas que conoce, unas 130 en total. Se nombra setenta y cuatro.'
    reef: 'Noche del 10 de junio de 1770: el Endeavor choca contra un arrecife.'
    scurvy: '16 de junio de 1770: Tupaia sufre de escorbuto.'
    death: 'Batavia: Banks registra la muerte de Taiata y Tupaia en noviembre.'
  ulugh_beg_samarkand:
    observatory: '1428: en las afueras de Samarcanda, comienza la construcción del observatorio de Ulugh Beg, con un gran arco tallado en la colina.'
    catalogue: 'Hacia 1437: el catálogo de estrellas de Samarcanda está terminado, 1018 estrellas, la mayoría de ellas medidas nuevamente.'
    fall: 'Samarcanda: Ulugh Beg renuncia a su gobierno y se le dice que abandone la ciudad.'
    death: 'Finales de octubre de 1449: Ulugh Beg muere en la carretera cerca de Samarcanda.'
    rediscovered: '1908: Los arqueólogos rusos encuentran nuevamente el arco debajo de la colina.'
  van_gogh_auvers:
    arrival: '20 de mayo de 1890: Vincent van Gogh llega a Auvers y alquila una habitación en el Auberge Ravoux.'
    work: Pinta casi un cuadro al día.
    auvers_letter: 'Alrededor del 10 de julio: les escribe a Theo y Jo sobre vastos campos de trigo bajo cielos turbulentos.'
    shot: '27 de julio: Van Gogh se pega un tiro en el pecho.'
    death: '29 de julio: Muere Vincent van Gogh. Su hermano Theo está con él.'
  vermeer_delft:
    war: '1672: guerra con Francia e Inglaterra y el comercio de arte de la República colapsa.'
    loan: 'Julio de 1675: Vermeer va a Ámsterdam para pedir prestado mil florines.'
    burial: '15 de diciembre de 1675: Johannes Vermeer es enterrado en Delft, a la edad de cuarenta y tres años.'
    baker: 'Principios de 1676: Catalina regala dos de sus cuadros al panadero a cambio de 617 florines de pan.'
    art_of_painting: '24 de febrero de 1676: Catharina pasa el arte de pintar a su madre María Thins.'
    inventory: '29 de febrero de 1676: un notario hace el inventario de la casa de Oude Langendijk.'
    petition: 'Abril de 1676: Catharina pide al Tribunal Superior que la libere de sus deudas.'
    trustee: '30 de septiembre de 1676: Antonie van Leeuwenhoek se convierte en administradora de la finca.'
    rediscovery: '1866: Thoré-Bürger publica un catálogo de las obras de Vermeer.'
  vesalius_padua:
    complaint: '13 de junio de 1546: Vesalio escribe desde Ratisbona y critica las distorsiones que ve en las figuras copiadas.'
  wallace_ternate:
    fever: 'Febrero de 1858: en las Molucas, Wallace espera a que baje la fiebre y toma notas para su periódico.'
    signed: 'Febrero de 1858: el ensayo está fechado en Ternate.'
    dorey_departure: '25 de marzo de 1858: Wallace y su grupo, incluido Jumaat, zarpan de Ternate hacia Dorey.'
    sent: El ensayo deja a Ternate en el vapor del correo. Todavía se discute si fue el barco de marzo o el de abril.
    received: '18 de junio: en Kent, el ensayo llega a Charles Darwin en Down House.'
    read: '1 de julio: en la Linnean Society de Londres se leen ambos artículos. Ninguno de los autores está en la sala. Wallace se entera de ello sólo más tarde.'
    jumaat_death: '26 de junio de 1858: Jumaat muere en Dorey.'
    printed: '20 de agosto de 1858: el artículo conjunto se imprime en las Actas de la Linnean Society.'
  wright_kitty_hawk:
    camp: 'Septiembre: los hermanos regresan a su campamento cerca de Kitty Hawk. El juicio se ve aplazado una y otra vez por problemas con la máquina.'
    first_try: '14 de diciembre: Wilbur gana el lanzamiento de una moneda y va primero. El intento fracasa.'
    first_flight: '17 de diciembre, mañana: Orville vuela 120 pies en 12 segundos. John T. Daniels, de la estación de salvamento, presiona el obturador.'
    fourth_flight: 'El cuarto vuelo del día es el más largo: 852 pies en 59 segundos.'
    flyer_damage: Una ráfaga vuelca el Flyer. La máquina está muy dañada y nunca vuelve a volar.
    telegram: 'Tarde: los hermanos caminan cuatro millas hasta Kitty Hawk y telegrafian a su padre. El mensaje dice que el vuelo más largo fue de 57 segundos.'
    dayton: Alrededor de las cinco y media, en Dayton, su padre Milton Wright recibe el telegrama. Los periódicos de Dayton apenas publican una palabra.
  xu_xiake_lijiang:
    diary: El sexto día del segundo mes lunar de 1639, Xu se quedó en Jietuo Lin para recopilar libros.
    departure: El octavo día del segundo mes lunar de 1639, Xu cabalgó desde Jietuo Lin bajo la lluvia.
    commission: El noveno día del segundo mes lunar de 1639, una carta volvió a pedir a Xu que compilara el Diccionario geográfico del monte Ji.
  zeami_sado:
    island: 'Sado: Zeami, de más de setenta años, vive su exilio en la isla.'
