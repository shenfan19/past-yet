    visit: El 27 de julio Clara visitó a Robert en Endenich.
    death: El 29 de julio, Robert Schumann murió en Endenich.
  sei_shonagon_kyoto:
    teishi_death: Después del nacimiento de la princesa Bishi, Teishi muere el día dieciséis del duodécimo mes de Chōhō 2.
  sejong_hangul:
