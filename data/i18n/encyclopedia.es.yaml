    titia: 'Marzo de 1669: medio año después de la muerte de Tito, nace su hija Titia.'
    late_portrait: '1669: Rembrandt pinta autorretratos fechados en ese año.'
    death: '4 de octubre de 1669: Rembrandt muere en Ámsterdam, a los sesenta y tres años.'
    burial: '8 de octubre de 1669: Rembrandt es enterrado en una tumba alquilada.'
    widow: '21 de octubre de 1669: la viuda de Titus es enterrada en Amsterdam.'
  riemann_selasca:
    geometry_lecture: '10 de junio de 1854: en Gotinga, Riemann da una conferencia sobre las hipótesis sobre los fundamentos de la geometría.'
    primes: '1859: Riemann envía a la Academia de Berlín su artículo sobre el número de números primos por debajo de un tamaño determinado.'
    illness: 'Otoño de 1862: Riemann enferma.'
    selasca: 'Junio de 1866: en su tercer viaje al sur, Riemann llega a Selasca, en el lago Mayor.'
    last_work: '19 de julio de 1866: bajo una higuera en Selasca, Riemann trabaja en su último artículo.'
    death: '20 de julio de 1866: Bernhard Riemann muere en Selasca, a la edad de treinta y nueve años.'
    werke: '1876: en Leipzig se publican las obras completas de Riemann, con Dedekind entre los editores.'
  rumi_konya:
    death: '17 de diciembre de 1273: Rumi muere en Konya.'
  sappho_lesbos:
