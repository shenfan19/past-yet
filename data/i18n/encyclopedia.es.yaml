    alvares: 'Década de 1520: Francisco Álvares visita una embajada portuguesa y describe los edificios excavados en la roca.'
    heritage: '1978: las iglesias rupestres de Lalibela son inscritas como Patrimonio de la Humanidad.'
    sediment_record: Las pocas fotografías que sobreviven de la limpieza son insuficientes para reconstruir las capas y posiciones originales de los hallazgos.
  lavoisier_paris:
    arrest: '24 de noviembre de 1793: se ordena el arresto de todos los antiguos recaudadores de impuestos.'
    execution: '8 de mayo de 1794: Lavoisier es ejecutado en París.'
    paulze_execution: '8 de mayo de 1794: Jacques Paulze es ejecutado en París.'
  leavitt_cambridge_ma:
    variable_stars: El 3 de marzo de 1912, la Circular 173 del Observatorio de la Universidad de Harvard publicó la tabla de Leavitt de veinticinco estrellas variables.
    calibration: En 1913, la relación se calibró utilizando Cefeidas en la Vía Láctea.
  leeuwenhoek_delft:
    doubt: 'Primavera de 1677: Londres no cree en los animalitos.'
    testimonials: '18 de mayo de 1677: los dos primeros testigos en Delft escriben lo que vieron.'
    sent: '5 de octubre de 1677: Leeuwenhoek fecha la carta de Delft que adjunta los testimonios.'
    hooke: 'Noviembre de 1677: en el tercer intento, Hooke muestra a la Sociedad los animalitos.'
  li_bai_changan:
    pardon: 'Alrededor de 759: Li Bai fue indultado camino a Yelang. Un epílogo de sus obras completas lo sitúa cerca de Wushan en ese momento.'
  li_qingzhao_hangzhou:
    theft: 'Alrededor de 1131: Li Qingzhao recordó un robo en su alojamiento en Kuaiji. Después recuperó dieciocho pergaminos.'
  li_shizhen_qizhou:
    after_death_edition: 'En 1596: la edición Jinling apareció después de la muerte de Li Shizhen. No vivió para ver el libro completo impreso.'
  lili_boulanger_paris:
    illness: 'Invierno de 1918: Lili está demasiado débil para escribir.'
    last_work: '1918: desde su cama Lili le dicta a Nadia su última obra.'
    death: '15 de marzo de 1918: Lili muere en Mézy.'
  lovelace_london:
    menabrea: 'Octubre de 1842: en Ginebra, Luigi Menabrea publica, en francés, un relato de la máquina analítica de Babbage.'
    refused_withdraw: '6 de agosto de 1843: Lovelace escribe a Babbage que no retirará la traducción ni las Notas.'
    proposal: '14 de agosto de 1843: Lovelace se ofrece a dirigir el negocio de construcción del motor, si Babbage se queda con la ingeniería.'
    printed: 'Finales de agosto de 1843: Se publican las Memorias científicas de Taylor con la traducción y las Notas, firmadas por A.A.L.'
    death: '27 de noviembre de 1852: Ada Lovelace muere en Londres, a los treinta y seis años.'
  mary_anning_lyme_regis:
    ichthyosaur: 'Noviembre de 1812: Mary Anning, de doce o trece años, extrae del acantilado un esqueleto de cinco metros de largo. Su hermano había encontrado su cráneo.'
    plesiosaur: '10 de diciembre de 1823: bajo los acantilados de Lyme Regis, Mary Anning encuentra un esqueleto casi completo con un cuello más largo que el cuerpo.'
    sketch: '26 de diciembre de 1823: Anning escribe desde Lyme e incluye un dibujo del esqueleto.'
    pterosaur: 'Diciembre de 1828: encuentra un revoltijo de huesos con una larga cola y alas, el primer pterosaurio encontrado en Inglaterra.'
    death: '1847: Mary Anning muere, a los 47 años, todavía sin dinero.'
  maya_codices_mani:
    mani: '12 de julio de 1562: Se queman en público libros mayas en Maní.'
  mendel_brno:
    experiments: '1856: Mendel comienza a cruzar plantas de guisantes en el jardín de Brno; Seguirá en ello durante ocho años.'
    first_talk: '8 de febrero de 1865: Mendel da la primera de sus dos charlas sobre los híbridos de guisantes en la sociedad de Brno.'
    second_talk: '8 de marzo de 1865: Mendel da su segunda charla y explica cómo se divide la descendencia de los híbridos.'
    printed: '1866: en las actas de la sociedad de Brno se publica el artículo Experimentos sobre híbridos de plantas.'
    death: '6 de enero de 1884: Gregor Mendel muere en Brno.'
    rediscovery: '1900: tres botánicos, que trabajan por separado, encuentran el artículo de Mendel de 1866.'
  mendeleev_petersburg:
    flyer: '1 de marzo de 1869: Mendeleev termina una tabla de una página de los elementos según sus pesos atómicos.'
    meeting: '18 de marzo de 1869: en la Sociedad Química Rusa, Menshutkin le lee el artículo de Mendeleev; la discusión se pospone hasta que el autor esté presente.'
    next_meeting: '15 de abril de 1869: la sociedad se reúne nuevamente y nadie saca a relucir la tabla de los elementos.'
    german_abstract: 'Mayo de 1869: Mendeleev envía un breve resumen de su artículo a una revista alemana y lo envía a un traductor.'
    gallium: '1875: se encuentra el galio, que llena uno de los huecos que Mendeleev dejó en su tabla.'
    death: '2 de febrero de 1907: Dmitri Mendeléyev muere en San Petersburgo.'
  miyazawa_kenji_hanamaki:
    death: '21 de septiembre de 1933: Miyazawa Kenji muere en Hanamaki.'
  modigliani_paris:
    exhibition: '3 de diciembre de 1917: en la única exposición individual de Modigliani en vida, la policía ordena la retirada de las obras que objetan.'
    daughter: 'Noviembre de 1918: en Niza, Jeanne Hébuterne da a luz a su hija Jeanne.'
    back_in_paris: 'Finales de mayo de 1919: Modigliani y Jeanne regresan a París; Su tuberculosis es mucho peor.'
    death: '24 de enero de 1920: Amedeo Modigliani muere de meningitis tuberculosa en el hospital Charité, a la edad de treinta y cinco años.'
    jeanne_death: '26 de enero de 1920: Jeanne Hébuterne, embarazada de ocho meses, muere en casa de sus padres.'
    funeral: '27 de enero de 1920: Modigliani es enterrado; sus compañeros artistas han recogido el dinero para el funeral.'
    adopted: '1920: su hija Jeanne es acogida por la hermana de Modigliani en Livorno.'
    grave: '1930: Jeanne Hébuterne es depositada en la misma tumba que Modigliani.'
  murasaki_kyoto:
    prince: 'El undécimo día del noveno mes, Kankō 5: la emperatriz Shōshi da a luz un hijo.'
    diary: 'El primer día del undécimo mes, Kankō 5: en el banquete del quincuagésimo día, Fujiwara no Kintō llama al "joven Murasaki" entre las damas.'
    binding: 'El undécimo mes: las damas alrededor de Shōshi eligen papel, copian El cuento de Genji y lo encuadernan en libros.'
    draft: 'En esos días: mientras Murasaki está de servicio, Michinaga saca el borrador del cuento de su habitación y se lo entrega a su hija Kenshi.'
    palace: 'El decimoséptimo día del undécimo mes: Shōshi regresa al palacio con el príncipe.'
    classics_day: '2012: Japón celebra el 1 de noviembre el Día de los Clásicos, después de la entrada en el diario del banquete del quincuagésimo día.'
  nezahualcoyotl_texcoco:
    lord: '1431: Nezahualcóyotl es nombrado señor de Texcoco.'
    setting: '1472: Muere Nezahualcóyotl, señor de Texcoco.'
    cantares: 'Finales del siglo XVI: se escriben canciones en náhuatl en una colección, algunas de ellas bajo su nombre. Se desconoce quién los cantó por primera vez.'
  nietzsche_turin:
    journey: El 8 de enero de 1889, Franz Overbeck llegó a Turín.
  noether_gottingen:
    invited: '1915: Hilbert y Klein traen a Noether a Gotinga; su solicitud para dar una conferencia está bloqueada porque es mujer.'
    hilbert_name: 'Invierno de 1916: el calendario enumera su seminario impartido por el profesor Hilbert, con la ayuda del Dr. Noether.'
    presented: '26 de julio de 1918: Felix Klein presenta su artículo Problemas variacionales invariantes en la sociedad de ciencias de Göttingen.'
    final_version: 'Finales de septiembre de 1918: Noether entrega la versión final del artículo.'
    habilitation: '4 de junio de 1919: después de su conferencia de prueba, Noether es admitida para dar clases en Gotinga.'
    paid: '1923: por primera vez Noether recibe un pequeño salario fijo por su labor docente.'
    dismissed: '1933: Noether pierde su puesto en Göttingen y se marcha al Bryn Mawr College en Estados Unidos.'
    death: '14 de abril de 1935: Emmy Noether muere en Bryn Mawr.'
  omar_khayyam_nishapur:
    observatory: En la década de 1070, Malik-Shah reúne a astrónomos, incluido Omar Jayam, para realizar observaciones y trabajar en el calendario.
