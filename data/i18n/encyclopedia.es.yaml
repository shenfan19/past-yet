    memorial: 'El segundo mes de 1444: Choe Manri y seis colegas del Salón de los Dignoes envían un memorial planteando objeciones.'
    promulgated: '1446: las letras se promulgan como Hunminjeongeum, los sonidos correctos para enseñar al pueblo.'
    sejong_dies: '1450: Muere el rey Sejong.'
  sequoyah_syllabary:
    council: '1821: Sequoyah termina una serie de carteles que pueden plasmar palabras cherokee en papel.'
    phoenix: '21 de febrero de 1828: en New Echota sale de la imprenta el primer Cherokee Phoenix, cherokee e inglés en columnas una al lado de la otra.'
    death: 'Agosto de 1843: Sequoyah muere en México.'
  shakespeare_globe:
    burial: '11 de agosto de 1596: Hamnet Shakespeare es enterrado en Stratford-upon-Avon. En el registro no consta si su padre estuvo con él anteriormente.'
  sima_qian_changan:
    sentence: Después del asunto Li Ling, Sima Qian es castigada.
  smith_kirkcaldy:
    wealth: '9 de marzo de 1776: Se publica en Londres La riqueza de las naciones de Adam Smith; su primer capítulo trata sobre cómo hacer alfileres.'
    will: '4 de enero de 1776: David Hume hace su testamento y nombra a Adam Smith para que se encargue de sus papeles.'
    codicil: '7 de agosto de 1776: en un codicilo, Hume deja los Diálogos al impresor William Strahan, para que los publique dos años después de su muerte.'
    hume_death: '25 de agosto de 1776: David Hume muere en Edimburgo.'
    letter_strahan: '9 de noviembre de 1776: en Kirkcaldy, Smith escribe a Strahan un relato de los últimos meses de Hume.'
    copy_money: '13 de noviembre de 1776: Smith envía la cuenta a Strahan, con una nota sobre las 300 libras de dinero de las copias y un plan para una segunda edición más barata.'
    own_life: '1777: La breve vida de Hume sobre sí mismo se imprime con la carta de Smith, y la carta genera respuestas airadas.'
    dialogues: '1779: los Diálogos salen a través del sobrino de Hume, sin nombre en la portada.'
  socrates_athens:
    trial: '399 aC: Sócrates es juzgado ante un jurado en Atenas y es declarado culpable.'
    surety: El mismo día ofrece una multa de treinta minas, siendo fiadores Platón, Critón y otros dos amigos; el jurado lo condena a muerte.
    ship: El barco zarpó hacia Delos el día antes del juicio, y hasta que llegue a casa nadie puede ser ejecutado; Sócrates es llevado a prisión para esperar.
    verses: En prisión, Sócrates comienza a poner en verso fábulas de Esopo, como le ordena un sueño que vuelve una y otra vez.
    crito: Una mañana, muy temprano, Critón llega a la prisión, dice que el barco llegará pronto y lo insta a escapar. No lo hará.
    plato_ill: El último día sus amigos se reúnen en la prisión con las primeras luces del día. Platón está enfermo y no viene.
    death: Al anochecer, Sócrates bebe cicuta en la cárcel y muere.
  sophie_germain_paris:
    leblanc: '1804: bajo el nombre de Monsieur Le Blanc, Germain comienza a escribir a Gauss.'
    prize: '1816: en su tercer intento, Germain gana el premio de la Academia de Ciencias por sus memorias sobre las placas elásticas vibrantes.'
    cancer: '1829: Germain enferma de cáncer de mama y sigue trabajando.'
    death: '27 de junio de 1831: Sophie Germain muere en el número 13 de la rue de Savoie de París, a la edad de cincuenta y cinco años.'
    curvature: '1831: sus memorias sobre la curvatura de las superficies aparecen en el volumen 7 del diario de Crelle en Berlín.'
  sor_juana_mexico_city:
    carta: '1690: el obispo de Puebla imprime su crítica a un sermón sin pedírselo, con una carta que firma Sor Filotea.'
    respuesta: '1 de marzo de 1691: fecha su respuesta a Sor Filotea. En él escribe que en la cocina se puede aprender mucho.'
    books: '1693: se venden sus libros y sus instrumentos y el dinero se entrega a los pobres.'
    vows: '1694: renueva sus votos.'
    death: '17 de abril de 1695: Muere sor Juana, después de cuidar a sus hermanas durante la enfermedad en el convento.'
    printed: '1700: se imprime por primera vez su respuesta a Sor Filotea, en un volumen de sus obras.'
  su_shi_huangzhou:
    crow_terrace: En el verano de 1079, Su Shi es arrestado por sus poemas y retenido en Kaifeng.
    exile: En 1080, Su Shi llega al exilio en Huangzhou.
    eastern_slope: En 1081 despeja un terreno en la ladera al este de la ciudad y comienza a cultivarlo.
    red_cliff: 'El decimosexto día del séptimo mes: Su Shi y sus invitados salen en un bote por debajo del Acantilado Rojo.'
    later_ode: 'La luna llena del décimo mes: Su Shi camina desde el Salón de Nieve hacia Lingao, con dos invitados con él.'
    leaving: En 1084, Su Shi abandona Huangzhou.
  tagore_santiniketan:
    translation: 'Noviembre de 1912: se publica en Londres el Gitanjali inglés, en la traducción en prosa del propio Tagore.'
    award: '13 de noviembre de 1913: la Academia Sueca concede a Tagore el Premio Nobel de Literatura.'
    reception: '23 de noviembre de 1913: un tren trae simpatizantes desde Calcuta a Santiniketan; La respuesta de Tagore deja a muchos heridos.'
    visva_bharati: '1921: Tagore funda la universidad de Visva-Bharati en Santiniketan.'
    death: '7 de agosto de 1941: Rabindranath Tagore muere en Calcuta.'
  tang_xianzu_linchuan:
    dated_preface: En el otoño de 1598, Tang Xianzu fechó el prefacio de The Peony Pavilion.
  taqi_al_din_istanbul:
    instrument_damage: 'Enero de 1580: se desmantela el observatorio. Un relato contemporáneo registra que los instrumentos están rotos.'
  terence_rome:
    first_interruption: '165 aC: la primera puesta en escena de La suegra se interrumpe antes del final.'
  tesla_wardenclyffe:
