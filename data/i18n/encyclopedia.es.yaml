  savitribai_phule_pune:
    records: '5 de febrero de 1852: en una solicitud de ayuda, Savitribai figura como directora de la primera escuela.'
    death: '10 de marzo de 1897: Savitribai muere de peste, contraída mientras cuidaba a los enfermos.'
  schubert_vienna:
