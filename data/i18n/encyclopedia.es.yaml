    closed: '1092: Malik-Shah muere y las observaciones llegan a su fin.'
    lasting: El cálculo de Jalali sobrevive al programa de observación. Sus descendientes todavía se utilizan en Irán y Afganistán.
  pasteur_paris:
    jeanne: 'Verano de 1859: Jeanne, de nueve años, se aloja en casa de su abuelo en Arbois.'
    death: 'Septiembre de 1859: Jeanne muere de fiebre tifoidea en Arbois.'
  pliny_stabiae:
    death: '79 d.C.: según su sobrino, Plinio el Viejo muere en Estabia durante la erupción.'
  poe_baltimore:
