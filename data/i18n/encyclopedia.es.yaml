    probst: '2 de octubre de 1828: Schubert ofrece sus tres últimas sonatas para piano al editor Probst.'
    death: '19 de noviembre de 1828: Franz Schubert muere en Viena, a los treinta y un años.'
    first_edition: '1839: salen las tres últimas sonatas de Diabelli, dedicadas a Robert Schumann.'
  schumann_endenich:
