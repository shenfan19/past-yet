        was: 1594년에 아마드 바바는 술탄을 무시했다는 혐의로 기소되어 마라케시로 끌려갔습니다. 1608년에 그는 팀북투로 돌아가는 것이 허용되었습니다.
      p2:
        was: 1594년에 아마드 바바의 가족은 그와 함께 사하라 사막을 건너 북쪽으로 행진했습니다.
        now: 그와 함께 여행한 친척들은 고통을 조금 덜 받고 마라케시에 도착했습니다.
      p3:
