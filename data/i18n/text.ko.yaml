  lovelace_london:
    name: 최초의 프로그램
    place: 런던
    figure: 에이다 러브레이스
    story: 1842년 이탈리아 엔지니어 Luigi Menabrea는 Charles Babbage의 분석 기관에 대한 설명을 프랑스어로 출판했습니다. 에이다 러브레이스는 그것을 번역하고 기사의 약 3배에 해당하는 7개의 메모를 추가했습니다. 마지막 노트 G는 엔진이 베르누이 수를 계산하는 방법을 설명합니다. 1843년 8월 배비지는 정부에 대한 자신의 불만을 신문에 실기를 원했고, 편집자가 서명 없이 인쇄하지 않을 경우 그 신문을 철회해 달라고 요청했습니다. 그녀는 거절했고 번역본과 A.A.L.에 서명된 메모가 그해 Taylor의 Scientific Memoirs에 게재되었습니다. 8월 14일에 그녀는 Babbage가 엔지니어링을 계속한다면 엔진 제작 사업을 조직하겠다고 제안했습니다. 그는 그녀의 조건을 거절했다.
    story_prose:
      opening:
        - 1843년 여름, 런던. 에이다 러브레이스는 이탈리아 엔지니어 Menabrea가 Babbage의 해석 기관에 대해 프랑스어로 설명한 내용을 영어로 삽입하고 기사보다 약 3배 긴 7개의 메모를 추가했습니다. 마지막 노트 G는 아직 종이에만 있는 이 엔진이 베르누이 수를 계산하는 방법을 단계별로 설명합니다.
        - 역사상 배비지는 정부에 대한 자신의 불만이 신문에 인쇄되기를 원했습니다. 편집자는 서명 없이는 인쇄하지 않았고 Babbage는 그녀에게 철회를 요청했습니다. 8월 6일에 그녀는 그에게 그렇게 하지 않을 것이며 완전히 결정했다고 편지를 썼습니다. 8월 14일에 그녀는 그가 엔지니어링을 계속한다면 엔진 제작 사업을 운영하겠다고 제안했고 Babbage는 편지에서 모든 조건을 거부했다고 언급했습니다. 다음날 그녀는 어머니에게 프린터에서 마지막 라운드를 감독하기 위해 자신을 불렀으며 공식을 수정하는 것이 힘든 일이라고 말했습니다. 이 부문에서는 인쇄소의 합성가가 시그마 상자가 부족하다고 불평하고 Spitalfields의 직공이 Jacquard 직기를 유지하고 있습니다.
        - 이번 여행에 도움을 줄 수 있는 사람들은 몇 가지 있습니다. 번역과 논문을 알고 있고 사본을 보관할 수 있는 사람; 교정을 읽고 표 셀을 셀별로 확인할 수 있는 사람; 두 사람을 하나의 업무 부서로 모을 수 있는 재치 있는 사람.
      outcomes:
        all: Taylor의 Scientific Memoirs 번호가 나왔고, 열에 셀이 하나도 없는 Note G의 테이블과 A.A.L.이라는 이니셜이 나왔습니다. 마지막에. 9월에 한 방문객이 도면, 비용 개요, 작업을 구분하는 한 페이지가 그의 앞에 펼쳐져 있는 것을 들고 Dorset Street에 있는 집에 앉아 있었습니다.
        p3: 9월에 한 방문객이 Dorset Street의 도면과 비용 개요를 살펴보고 작업을 구분하는 한 페이지를 가져가더니 엔지니어링을 검토한 후에 비용을 정산할 수 있다고 말했습니다.
        p2: 인쇄된 노트 G에서는 표의 한 셀도 해당 열에서 빠져나오지 않았습니다. 그녀가 확인한 교정본은 인쇄소 찬장에 남아 있었는데, 여백에는 빨간 점이 아직 남아 있었습니다.
        p1: Taylor's Scientific Memoirs의 권수는 예정대로 나왔고, 번역본과 7개의 노트가 함께 인쇄되었으며, 이니셜 A.A.L. 마지막에.
      none: 8월 말에 Taylor의 Scientific Memoirs가 나왔습니다. 스피탈필즈의 한 직조 공장에서는 여전히 천공 카드가 차례차례 뒤집어지고 있었습니다.
      desync: 프린터는 계속하고 기다리라는 지시를 받았으며 해당 번호에서 번역본과 메모가 삭제되었습니다. 사무실에서 {staff}를 리콜했을 때 합성자는 Note G의 형태를 분해하고 소수만큼 활자를 케이스에 다시 집어넣고 있었습니다.
