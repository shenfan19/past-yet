  dante_ravenna:
    name: 거리의 말로 쓴 긴 시
    place: 라벤나
    figure: 단테 알리기에리
    story: 1302년 피렌체에서 추방된 단테 알리기에리(단테 알리기에리)는 1318년경 라벤나에 정착했고 그곳에서 토스카나어로 일상 언어로 쓰여진 희극의 마지막 부분인 파라디소(Paradiso)를 완성했습니다. 1319년경 볼로냐의 학자인 조반니 델 비르길리오(Giovanni del Virgilio)는 그에게 라틴어로 글을 쓰고 월계관을 받기 위해 볼로냐로 오라고 촉구하는 라틴 시를 보냈고, 단테는 라틴어 시로 대답했다. 1320년 1월 20일 그는 베로나에서 강연을 했다. 1321년 9월 베네치아 대사관에서 돌아온 그는 병에 걸려 라벤나에서 사망했습니다.
    story_prose:
      opening:
        - 1320년 초, 라벤나. 단테는 18년 동안 피렌체에서 추방되었으며, 1302년 선고에는 그가 돌아오면 사형을 당할 것이라고 명시되어 있습니다. 라벤나의 영주인 귀도 노벨로 다 폴렌타(Guido Novello da Polenta)의 초청으로 그는 이곳에 살면서 일상적인 토스카나 거리에서 신곡의 마지막 부분인 천국(Paradiso)을 집필하고 있습니다.
        - 역사상 볼로냐에서 가르쳤던 조반니 델 비르힐리오(Giovanni del Virgilio)는 그에게 라틴어로 글을 쓰고 월계수를 위해 볼로냐로 오라고 촉구하는 라틴어 시를 보냈고, 단테는 라틴어 찬가로 대답했다. 1321년 9월 베네치아 대사관에서 돌아온 그는 병에 걸려 라벤나에서 사망했으며, 피렌체로 돌아오지 못했습니다. 이 지점에서는 동네의 잉크 장수가 필사자를 최고의 고객으로 여기고, 나무 채집가가 바닷가 소나무 숲으로 나간다.
        - 두 종류의 사람이 이 여행에 도움을 줄 수 있습니다. 서류를 알고 어떤 더미를 보내야 하고 어떤 더미를 보관해야 하는지 알 수 있는 사람과 시와 책을 알고 그의 옆에 앉아 몇 가지 진실한 말을 할 수 있는 사람입니다.
      outcomes:
        all: 라틴 시는 다음 해까지 왔다 갔다 했고, 각각은 왁스로 봉인되었습니다. 1321년 9월 그는 베네치아에서 돌아온 후 병에 걸렸고, 그의 침대 옆 파라디소 더미에 마지막 시트가 끝까지 적혀 있었습니다.
        p2: 그는 라벤나에서 1년 이상 더 살았습니다. 1321년 9월 그는 베네치아에서 돌아온 후 병에 걸렸고, 그의 침대 옆 파라디소 더미에 마지막 시트가 끝까지 적혀 있었습니다.
        p1: 라틴 시는 다음 해에도 왔다 갔다 했습니다. 각 답은 작은 방울의 왁스를 사용하여 저절로 접혀졌습니다.
      none: 볼로냐에서 온 편지는 아직도 책상 위에 놓여 있었다. 라벤나 외곽의 소나무 숲에는 바닷바람이 세차게 불어왔다.
      desync: 라틴어 답변은 Paradiso의 사본과 함께 들어가 느슨한 시트 사이로 보내졌고 볼로냐는 토스카나의 몇 페이지만 받았습니다. {staff}는 답변이 오기 전에 사무실에서 회수되었습니다.
      not_admitted: '{staff}는 복사실 문을 통과하지 못하고 마을 밖 소나무 숲에서 며칠 동안 나무를 줍는 데 시간을 보냈습니다. 두 개의 종이 더미는 여전히 단테의 책상 위에 놓여 있었습니다.'
      points:
        p1:
          class_lettered: '{staff}는 서류 보관인의 규칙에 따라 복사실에 있는 두 더미를 분리했습니다. 토스카나의 Paradiso는 책상 위에 있었고 볼로냐의 라틴어 답변은 옆으로 치워져 저절로 접혀 있었습니다. Dante는 접힌 부분에 왁스를 떨어뜨린 다음 손가락 관절로 납작하게 누릅니다. 전령은 그것을 코트 속에 집어넣고 1월의 차가운 바람을 맞으며 성문 밖으로 볼로냐로 향했다.'
          else: '{staff}는 천성적으로 조심성이 많아 복사실을 한 겹씩 뒤지며 파라디소의 헐렁한 시트에서 볼로냐에 대한 라틴어 답을 골라 스스로 접었다. Dante는 접힌 부분에 왁스를 떨어뜨린 다음 손가락 관절로 납작하게 누릅니다. 전령은 그것을 코트 속에 집어넣고 1월의 차가운 바람을 맞으며 성문 밖으로 볼로냐로 향했다.'
        p2: 3월의 어느 날 오후, 단테는 자신이 방금 끝낸 대사 {staff}를 읽었습니다. {staff}는 그를 한 줄씩 다시 말했고, 마지막에만 오랫동안 보류되었던 내용을 말했습니다. 사람들은 수세기 동안 이 거리의 언어로 이 구절을 계속 읽을 것이고, 어느 날 플로렌스는 그를 집으로 데려오고 싶어할 것입니다. 단테는 잉크병 가장자리에 펜을 올려 놓고 시트를 살펴보았습니다. 한참 후에 그는 그것을 다시 담그고 글을 계속 썼다.
      excerpts:
        p2: 단테는 잉크병 가장자리에 펜을 올려 놓고 시트를 살펴보았습니다. 한참 후에 그는 그것을 다시 담그고 글을 계속 썼다.
        p1: Dante는 접힌 부분에 왁스를 떨어뜨린 다음 손가락 관절로 납작하게 누릅니다. 전령은 그것을 코트 속에 집어넣고 1월의 차가운 바람을 맞으며 성문 밖으로 볼로냐로 향했다.
    relic: 월계수 잎
    relic_desc: 시인의 월계관에서 떨어진 마른 잎 하나.
    points:
      p1: Dante가 Ravenna에서 Giovanni에게 라틴어 답장을 보낼 시간을 따로 확보하세요. 복사되는 Paradiso 페이지와 별도로 보관하세요.
      p2: 망명 중인 단테에게 이 희극은 여러 세대에 걸쳐 읽혀질 것이며, 플로렌스는 언젠가 그를 되찾기를 원할 것이라는 사실을 알려 주십시오.
    points_fail:
