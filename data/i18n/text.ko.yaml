    relic: 급하게 보낸 편지
    relic_desc: 페이지에는 그에게 시간이 없었다는 숫자와 단어가 교차했습니다.
    points:
      p1: 5월 29일 밤, 갈루아는 아직 페이지를 확인할 수 있는 동안 슈발리에에게 보낸 편지를 언급된 서류와 별도로 포장하여 두 서류가 모두 전달되었는지 확인합니다.
      p2: 9월에 편지가 인쇄되면 편집자에게 원고 색인을 옆에 인쇄하고 남아 있는 페이지를 순서대로 읽어 줄 수학자를 찾으세요.
      p3: 5월 30일 아침 결투가 끝난 후, 갈루아를 즉시 의사에게 데려가 복부에 상처가 있는 그를 구출하십시오.
    points_fail:
      p1: 인계는 반복적으로 연기되고 편지는 서류와 분리됩니다. 슈발리에는 5월 29일자 편지를 받지 못했고 사무실에서는 해당 직원을 소환했습니다.
      p2: 9월에는 편지만 나옵니다. 더 나아가고 싶은 독자는 여전히 원고를 들고 있는 친구를 찾아야 한다.
      p3: 그는 지나가는 사람이 그를 발견할 때까지 부상을 입고 혼자 누워 있다가 5월 31일 코친 병원에서 20세의 나이로 사망합니다. 이 지점에는 그 이후 갈루아가 없습니다.
    shift:
      p1:
        was: 1832년 5월 29일 갈루아는 오귀스트 슈발리에에게 편지를 보내 자신의 연구 개요를 설명하고 논문을 처리하고 편지를 출판해 달라고 요청했습니다.
      p2:
        was: 편지는 1832년 9월에 나타났습니다. 슈발리에는 1843년에 원고를 리우빌에 전달했고, 리우빌은 1846년에 이를 출판했습니다.
        now: 9월에 편지를 읽는 사람은 누구나 색인을 사용하여 사본을 요청할 수 있습니다. 질문은 페이지 번호와 함께 Chevalier에 반환되어 다음 독자를 위한 기록을 남깁니다.
      p3:
        was: 1832년 5월 30일 갈루아는 결투 중 복부에 총을 맞고 쓰러진 자리에 누워 있었습니다. 그는 5월 31일 20세의 나이로 코친 병원에서 사망했습니다.
        now: '{staff}는 몇 분 안에 그에게 도달하여 출혈을 멈추고 상처가 패혈증으로 변하는 것을 방지합니다. 갈루아는 회복하고 수학으로 돌아가 자신의 이론을 이해하지 못한 수학자에게 직접 설명합니다.'
        who: galois_paris
        bio: 갈루아는 1832년 5월의 결투에서 살아남았습니다. 그는 파리에서 수학 공부를 계속했으며 평생 동안 자신의 방정식 이론을 읽고 토론하는 것을 보았습니다.
    vignettes:
      candle: 5월 29일 밤, {staff}는 컨시어지를 위해 계단 위로 두 번째 촛불을 들고 갔습니다. 그녀는 젊은 신사의 등불이 어두워졌을 때부터 계속 켜져 있고 잉크도 빌려준 자신의 것이라고 투덜거리며 그것을 계좌에 넣으려고 합니다.
      cart: 5월 31일 {staff}는 카터가 코친 병원 정문에서 장작을 내리는 것을 돕고 있습니다. 카터는 어제 그들이 젊은 남자를 데리고 들어왔는데 오늘 아침 그 위에 시트가 깔려 있었다고 말했습니다. 10년 동안 그는 여기로 장작을 가져왔는데, 화창한 아침이 되자 참을 수가 없습니다.
      type: 여름이 끝날 무렵, {staff}는 작은 인쇄소 바닥에 떨어진 활자를 줍습니다. 합성자는 이 숫자에 합계가 가득한 문자가 들어 있고 옆집 케이스에서 모든 등호를 빌려야 한다고 불평합니다.
  abel_froland:
    name: 예와 주장
    place: 프롤랜드
    figure: 닐스 헨리크 아벨
    story: 1828년 크리스마스에 닐스 헨리크 아벨(닐스 헨리크 아벨)은 감기와 기침을 하면서 썰매를 타고 프롤랜드(Froland)의 제철소로 가서 그의 약혼자를 방문했고 그는 그곳에서 12주 동안 병에 걸렸습니다. 1829년 1월 6일에 그는 파리 아카데미에 준 긴 회고록의 주요 결과를 다시 설명하는 2~3페이지의 마지막 논문을 썼습니다. 그는 4월 6일 26세의 나이로 결핵으로 사망했습니다. 이틀 후, August Leopold Crelle은 베를린에서 자신을 위한 자리가 확보되었다고 편지를 썼습니다.
    story_prose:
      opening:
        - 1829년 1월 노르웨이 남부의 프롤랜드 제철소. 닐스 헨리크 아벨은 그의 약혼녀가 가정교사로 일하는 집에서 심하게 기침을 하며 병에 누워 있습니다. 그는 스물여섯 살이다. 몇 년 전 그는 5차 일반 방정식이 근수법으로 풀 수 없다는 것을 증명했지만, 그가 1826년에 파리 아카데미에 준 긴 회고록은 그 이후로 들어본 적이 없습니다.
        - 역사상 그는 크리스마스에 썰매를 타고 왔을 때 이미 춥고 아팠고, 이곳에서 12주 동안 침대에 누워 있었습니다. 1월 6일에 그는 2~3페이지 길이의 마지막 논문을 썼습니다. 4월 6일 결핵으로 사망했다. 이틀 후 Crelle은 베를린에서 자신의 자리가 확보되었다는 편지를 보냈습니다. 이 지점에서는 아래층 주방 가정부가 밤새도록 기침 소리를 듣고, 제철소 직원은 평소처럼 매일 우편물을 분류한다.
        - 이 여행에는 세 종류의 사람이 도움을 줄 수 있습니다. 파생어를 확인하고 서류와 접수 기록을 정리할 수 있는 사람, 간호를 알고 병상을 감시할 수 있는 사람, 친구를 멀리 두고 재촉하여 답장을 보낼 수 있는 사람입니다.
      outcomes:
        all: 지난 4월, 베를린에서 게시물을 확인하는 편지가 작성되었을 때 아벨은 이미 사라져 있었습니다. 3월의 대답은 그의 베개 밑에 누워 있었고, 방의 난로는 아직 꺼지지 않았습니다.
        p4: 지난 4월 베를린이 게시물을 확인하기 위해 편지를 썼을 때 아벨은 이미 사라졌습니다. 3월의 답장은 아직도 그의 베개 밑에 놓여 있었다.
        p3: Froland에 있는 그 방의 난로는 4월까지 불타올랐습니다.
        p2: 몇 년 후 누군가가 긴 회고록을 찾기 위해 파리로 갔는데, 짧은 회고록의 밑 부분에 있는 작은 줄을 발견하고 그 해의 접수 기록부터 시작했습니다.
        p1: 2~3페이지 분량의 종이를 보냈습니다. 봉투에 적힌 주소는 그의 손에 적혀 있었다.
      none: Froland의 겨울은 길었다. 창밖의 눈은 녹지 않았고, 위층 남자는 밤마다 기침을 했다.
      desync: 1월 6일에 짧은 논문이 확인되기 전에 중단되었고 {staff}가 회수되었습니다. 위층에서는 기침이 계속됐다. 페이지는 침대 커버 위에 펼쳐져 있었고 잉크는 아직 마르지 않았습니다.
      not_admitted: '{staff}는 그 집 문을 통과하지 못했습니다. 위층 남자는 여전히 기침을 하고 있었고, 베를린에서 온 소식은 아직 전달 중이었다.'
      points:
        p1: 1월 6일, 아벨은 베개 위에 기대어 앉아 침대 커버 위에 2~3페이지가 펼쳐져 있는 짧은 글을 쓰고 있었습니다. {staff}는 도출된 내용을 펜으로 한줄 한줄 따라가며 표기가 일치하지 않는 부분을 한 단계씩 표시하고 하나씩 수정해 주었습니다. 저녁이 되자 신문은 깔끔하게 복사되었고 침대 커버에는 잉크 얼룩이 몇 군데 남아 있었습니다. 그는 세 페이지를 정사각형으로 만들고 손바닥으로 납작하게 누른 다음 건네주었습니다.
        p2: 그 짧은 종이가 아직 손에 남아 있었다. {staff}는 파리 회고록이 제출된 날짜 옆에 표시하고 각 사본의 밑에는 회고록이 전달된 연도, 누구에게, 어떤 제목으로 전달되었는지 작은 줄 하나를 썼습니다. 잉크는 희미하고 여백에 압착되었으며 황혼까지 건조되지 않았습니다. 두 권의 사본 중 한 권은 짧은 논문과 함께 들어갔고 다른 한 권은 그의 원고 폴더에 남아 있었습니다.
        p3: 1월 말 가장 추운 밤에 아벨은 기침을 너무 많이 해서 잠을 잘 수가 없었습니다. {staff}는 스토브에 물을 공급하고, 침대를 따뜻하게 하고, 베개를 올리고, 땀을 닦고, 물을 주었습니다. 어느 날 밤, 창문은 서리꽃으로 뒤덮였고, 방에 있는 난로는 결코 꺼지지 않았습니다. 새벽녘에 그는 기침을 한 후 다시 잠이 들었습니다.
        p4:
          class_lettered: '{staff}는 서신을 보관하는 방식으로 진행하여 베를린에서 자신을 대신하여 일하는 사람들과 각자가 무엇을 하고 있는지 하나씩 나열하고 차례로 편지를 보내 아무것도 해결될 때까지 기다리지 않고 진행 상황을 Froland에 보내달라고 요청했습니다. 3월에 답장이 왔습니다. 아벨은 편지를 침대로 가져와 두 번 읽었습니다. 게시물이 확정된 것은 아니며, 여전히 노력 중이라는 내용만 있었습니다. 그는 편지를 접어서 베개 밑에 놓았습니다.'
