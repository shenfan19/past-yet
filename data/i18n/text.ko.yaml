    vignettes:
      grass: '{staff}는 두 여행자를 따라 다카다치로 올라갑니다. 기타카미는 아래로 흐르고 잔디는 허리 높이입니다. 큰 사람은 모자를 땅바닥에 펴고 한동안 말 없이 앉아 있고, 작은 사람은 공책에 무엇인가 적고 있고, {staff}는 말하기 싫은 듯 그들과 함께 강을 바라본다.'
      bath: '{staff}는 이치노세키의 숙소 주인이 물을 운반하고 목욕물을 데우는 것을 돕습니다. 오늘 두 손님은 히라이즈미를 방문했고 땀을 흘리며 돌아올 것이라고 말했습니다. 그는 많은 여행자들이 눈물을 흘리며 오래된 폐허에서 돌아오는 것을 보았고, 목욕은 그것을 보살펴줍니다.'
      sandal: '{staff}는 이치노세키 거리 모퉁이에서 한 남자가 샌들 끈을 수선하는 것을 도와줍니다. 지나가던 짐꾼이 이번 주에 북쪽으로 가는 길이 온통 진흙탕이라 앞으로 가는 사람은 출발하기 전에 새 샌들을 신는 것이 좋겠다고 말했습니다.'
  tagore_santiniketan:
    name: 시 한 편을 두 번 읽다
    place: 인도 산티니케탄
    figure: 라빈드라나트 타고르
    story: 1912년 11월 라빈드라나트 타고르가 자신의 벵골 노래를 산문으로 표현한 영어 Gitanjali가 런던에서 출판되었습니다. 1913년 11월 13일 스웨덴 아카데미는 그에게 노벨 문학상을 수여했습니다. 열흘 후 캘커타에서 산티니케탄에 있는 그의 학교로 많은 지지자들이 기차에 도착했습니다. 대답에서 그는 국가의 이름으로 바쳐진 영예를 당당하게 받아들일 수 없다고 말했고, 많은 손님들이 상처를 입고 집으로 돌아갔습니다. 상금은 1921년에 Visva-Bharati 대학이 된 학교에 전달되었습니다.
    story_prose:
      opening:
        - 1913년 11월 벵골의 산티니케탄. 시인 라빈드라나트 타고르(라빈드라나트 타고르)가 이곳에서 학교를 운영하고 있습니다. 1년 전, 자신의 벵골 노래를 산문으로 번역한 영국 Gitanjali가 런던에서 출판되었습니다. 11월 13일 스웨덴 아카데미는 그에게 유럽 이외의 작가에게 처음으로 수여되는 노벨 문학상을 수여했습니다.
        - 역사상 열흘 후 기차가 캘커타에서 지지자들을 데려왔습니다. 그의 대답에서 그는 국가의 이름으로 제공되는 영예를 당당하게 받아들일 수 없다고 말했습니다. 많은 손님들이 부상을 입고 집으로 돌아갔고 그때부터 그와 많은 동포 사이에 거리가 생겼습니다. 이 지점에는 학교에 망고 나무에 오르는 소년과 밥을 지키는 요리사가 있고, 손님 중 한 명은 우산을 역에 두고 갑니다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 가르쳤거나 뉴스에서 일했거나 방문자를 안내했으며 사람들과 대화하는 방법을 아는 사람; 온화하고 확고한 의지를 지닌 사람; 또는 황금사과를 들고 있는 사람. 리셉션이 끝나면 손님들은 이미 역으로 걸어가고 있습니다.
      outcomes:
        all: 그날 저녁 손님들은 야간열차를 타고 캘커타로 돌아갔습니다. 그 후 몇 년 동안 사람들은 차례로 도시에서 산티니케탄으로 모여들었고, 1921년에 학교는 비스바-바라티 대학이 되었습니다.
        p1: 그날 저녁 손님들은 야간열차를 타고 캘커타로 돌아갔습니다. 그 후 몇 년 동안 사람들은 차례로 도시에서 산티니케탄으로 모여들었고, 1921년에 학교는 비스바-바라티 대학이 되었습니다.
      none: 11월 23일 해질녘에 손님들은 볼푸르 역에서 기차를 기다리고 있었고 플랫폼에서는 누구도 말을 하지 않았습니다. 기차가 떠난 후에도 벤치는 여전히 망고 나무 아래에 서 있었고 그 중 하나도 치워지지 않았습니다.
