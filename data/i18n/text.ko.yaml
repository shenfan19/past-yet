      p3:
        was: 1896년 7월 이치요는 병에 걸렸다. 그녀는 11월 23일 24세의 나이로 결핵으로 사망했습니다.
        now: '{staff}는 그녀를 치료할 시간이 있는 동안 치료를 확보합니다. Ichiyō는 다시 책상에서 하루의 일부를 보낼 수있을만큼 회복되었습니다.'
        who: higuchi_ichiyo_tokyo
        bio: 이 분야에서는 히구치 이치요(Higuchi Ichiyō)가 1896년에 시작된 질병을 회복하고 다시 글을 쓰기 시작합니다.
    vignettes:
      index: 누군가가 단일 문제에 연필로 '완료'라고 표시했습니다. 그 끝 부분을 4월 인쇄본과 비교하고 그것이 끊어지는 부분을 찾으십시오. 서점 보관인을 사용하면 탈착 가능한 전표를 넣을 수 있습니다. 당신은 7개의 할부 목록을 집으로 가져갑니다. 누가 첫 번째 라벨을 썼는지 결코 알 수 없습니다.
      reserve: 키퍼에게는 호마다 이야기를 따라가다가 마지막 호를 위해 돌아오지 않은 독자가 있습니다. 당신은 다른 고객들이 지금 4월 인쇄물을 구입할 수 있다는 점을 지적합니다. 마지막 할부금은 예약 전표와 함께 카운터 아래에 있습니다. 그 독자가 돌아오기 전에 당신은 떠난다.
      layout: 마지막 호 옆에 4월호를 설정하셨습니다. 하나는 처음부터 열리며 독자가 이미 여섯 편의 작품을 기다렸다고 가정합니다. 당신은 노점 주인을 위해 스크랩에 그 구별을 적고 자신의 사본을 보관합니다. 원래 연재 독자들은 귀하가 방문하신 전체 시간보다 더 오래 기다려 주셨습니다.
  rumi_konya:
    name: 첫머리에서 들리는 목소리
    place: 코냐
    figure: 루미
    story: 루미의 마스나비(Masnavi)의 도입부는 청취자에게 분리에 대해 말하는 리드를 들어보라고 요청합니다. 코냐의 메블라나 박물관에는 1273년 루미가 사망한 후 1278년에 복사된 6권의 원고가 보관되어 있습니다.
    story_prose:
      opening:
        - Konya, 1273. 루미의 장시가 6권의 책으로 정리되었다. 5년 뒤에 만들어진 사본이 아직도 남아있습니다.
        - 역사상 루미는 그해 12월에 세상을 떠났다. 원고는 나중에 독자들에게 시가 어떻게 주문되었는지 알려줍니다. 이 분기에서는 두 개의 읽기 사본 페이지가 여전히 동일한 테이블에 있습니다.
        - 느슨한 잎의 순서를 이해할 수 있는 사람이 도움이 될 것입니다. 아픈 사람이 누구를 만나고 싶다고 말할 때에도 누군가는 들어주고, 두 사람을 조금 조용히 시켜주어야 합니다.
      points:
        p2: '{staff}는 루미에게 누구를 먼저 보고 싶은지 묻고 방문객을 데려온 다음 문 옆에 있는 다른 사람들에게 기다리라고 합니다. 방문객은 루미가 그의 말을 들을 수 있는 곳에 앉는다. 한동안 둘 다 말을 하지 않습니다. 방문객은 들고 있던 종이를 내려놓았다. 루미는 이것을 보고 컵을 그에게 조금 더 가까이 움직입니다.'
        p1: 차용인이 오면 {staff}는 테이블의 두 세트를 분리하고 각 마지막 줄을 따라 다음 리프로 이동합니다. 차용인은 돕기 위해 앉아 있습니다. 줄이 끊어지면 그의 독서도 끊어집니다. 그는 다음 잎사귀를 찾아 1인치 앞으로 밀어냅니다. 이번에는 빌린 묶음이 첫 번째 구절부터 마지막 구절까지 이어집니다.
      outcomes:
        all: 나중에 차용인은 두 개의 사본을 별도의 장소에 남겨 둡니다. 문이 닫히면 나가는 사람들은 손이 자유로워지고, 독자는 조금 더 오래 머뭅니다.
        p2: 문 앞에 있는 사람들은 작은 방을 만듭니다. 손님은 오랫동안 앉아있습니다. 아무도 그를 서두르지 않습니다.
        p1: 문 앞에서, 빌린 사람은 그 꾸러미를 코트에 대고 꺼내기 전에 나뭇잎을 뒤집습니다.
      none: 두 세트의 페이지가 테이블에 남아 있습니다. 창가에 있는 컵은 오랫동안 손대지 않은 채로 서 있다.
      not_admitted: '{staff}는 절대 안으로 들어가지 않습니다. 차용인은 빈 손으로 벤치 옆에서 기다리고 있습니다.'
      desync: 한 부분이 누락되어 사본 한 권을 빌렸습니다. 대행사가 {staff}를 리콜할 때 다른 하나는 여전히 테이블 위에 열려 있습니다.
      excerpts:
        p2: 방문객은 들고 있던 종이를 내려놓았다. 루미는 이것을 보고 컵을 그에게 조금 더 가까이 움직입니다.
        p1: 그는 다음 잎사귀를 찾아 1인치 앞으로 밀어냅니다. 이번에는 빌린 묶음이 첫 번째 구절부터 마지막 구절까지 이어집니다.
    relic: 낭독의 첫 구절을 적은 종이
    relic_desc: 구절의 시작을 표시하는 상상의 독서 시트.
    points:
      p1: Konya에서는 다른 독자에게 빌려주기 전에 Masnavi 사본의 시트 순서를 확인하세요.
      p2: 루미가 아프면 누구를 만나고 싶은지 물어보고 같이 앉을 때는 방을 조용하게 해주세요.
    points_fail:
      p1: 두 개의 독서 사본이 혼합되어 있습니다. 하나의 묶음이 섹션이 잘못된 위치에 남아 있고 레코드가 동기화되지 않으면 사무실에서 {staff}를 회수합니다.
      p2: 루미가 요청한 사람이 앉기 전에 또 다른 방문객이 문 앞에 와 있습니다.
    shift:
      p1:
        was: 코냐는 루미가 죽은 지 5년 후인 1278년에 작성된 6권의 마스나비 원고를 보유하고 있습니다.
      p2:
        was: 루미는 1273년 12월 코냐에서 사망했습니다. 이후의 기록에는 그의 동료들이 그의 침대 곁에 모인 것으로 묘사되어 있습니다.
        now: 이 지점에서는 {staff}가 루미가 만나자고 하는 사람을 위한 의자를 설정합니다. 대화는 루미가 말할 준비가 될 때까지 기다릴 수 있습니다.
    vignettes:
      reed: 나린은 같은 목소리로 두 파트를 모두 소화했다. 당신은 갈대가 처음으로 그 자체로 말하는 곳이 어디인지 묻습니다. 그녀는 잠시 숨을 고르고 다음 줄을 시작했다. 하산이 눈을 감고 귀를 기울이면 리드가 차지하는 순간을 들을 수 있습니다.
      hand: 하산은 독서대를 떠나야 하고, 나린은 말하고 있는 동안 페이지에 손을 뻗습니다. 그가 커플릿을 완성하고 손가락을 다음 줄에 놓을 수 있을 때까지 모서리를 잡고 있습니다. 그녀는 자신의 차례가 되면 거기서 시작합니다. 통로는 그들 사이에 틈 없이 지나갔다.
      manuscript: 당신은 나중에 여섯 권으로 된 원고를 보았습니다. 나린은 하산이 숨을 쉬었던 곳을 보여줄 것인지 묻습니다. 당신은 그들이 연습한 대사를 가리키고 그녀가 어디에서 멈출지 결정하게 합니다. 다음 대련을 큰 소리로 읽기 전에 문이 닫힙니다.
  terence_rome:
    name: 자꾸 자리를 뜨는 관객
    place: 로마
    figure: 테렌티우스
    story: 테렌티우스의 Hecyra의 프롤로그에서는 중단을 설명합니다. 그들은 복싱의 무승부와 줄타기 공연을 기억하고, 검투사가 발표되면 군중이 몰려들었습니다. 지도 연도는 초기 작품의 위치를 나타내고, 두 번째 프롤로그에서는 이를 되돌아봅니다.
    story_prose:
      opening:
        - 로마, 기원전 165년경. Hecyra의 프롤로그는 처음 착용했을 때 일어난 일을 기록합니다. 선수들은 관객들이 자리를 잡기를 기다리고 있다.
        - 역사상 관객은 다른 오락에 주의가 산만해졌고 코미디는 끝나지 않았습니다. 이 분기에서는 처음 몇 행이 아직 사라지지 않았습니다. 그들은 다음에 누가 말할지 전혀 들을 수 없습니다.
        - 군중 위에서 말할 수 있고 언제 배우들에게 방을 돌려주어야 하는지 아는 사람이 도움을 줄 수 있습니다.
      points:
        p1: '{staff}는 앞줄에 자리를 잡아달라고 요청한 다음 이미 연설을 기다리고 있는 배우를 가리킵니다. 한 남자가 다른 오락이 언제 시작되는지 묻습니다. {staff}는 그의 말을 듣고 한 줄만 기다리라고 요청합니다. 배우는 목소리를 높이지 않습니다. 몇 사람이 돌아서고, 그 뒤의 사람들도 조용해진다. 마지막 대사가 나오면 무대에 가장 가까운 사람이 무대 가장자리에서 손을 뗀다. 그의 뒤에 있는 사람들은 그가 움직이기 전에 서기를 기다리고 있다.'
      outcomes:
        all: 선원들이 밧줄을 풀러 왔을 때 몇몇 사람들은 여전히 앉아 방금 들었던 밧줄에 대해 이야기하고 있습니다.
        p1: 맨 앞에 있던 사람들이 일어나기 전에 마지막 장면이 끝났다.
      none: 군중은 다른 쇼를 향해 이동합니다. 무대에서 배우가 줄 중간에 멈춘다.
      not_admitted: '{staff}는 첫 번째 행에 도달하지 않습니다. 근처에 누군가 서 있고 곧 뒷모습만 보일 뿐이다.'
      excerpts:
        p1: 마지막 대사가 나오면 무대에 가장 가까운 사람이 무대 가장자리에서 손을 뗀다. 그의 뒤에 있는 사람들은 그가 움직이기 전에 서기를 기다리고 있다.
    relic: 희극 가면
    relic_desc: 배우가 입는 눈썹이 치켜올린 린넨 마스크입니다.
    points:
      p1: 복서, 줄타기 이야기에 선수들이 빠져들면 무대 근처 사람들이 다시 듣게 해서 회사가 첫 공연을 마칠 수 있도록 해주세요.
    points_fail:
      p1: 선수들은 군중 위에서 자신의 목소리를 들을 수 없습니다. 역사에서와 마찬가지로 그들은 끝나기 전에 멈춥니다.
    shift:
      p1:
        was: 기원전 165년 시어머니의 첫 번째 상연은 다른 공연자들의 소란과 흥분으로 인해 중단되었습니다.
        now: 무대 근처의 청중은 다시 듣기 시작하고 회사는 첫 번째 시도에서 마지막 줄에 도달합니다.
        who: terence_rome
        bio: 이 지점에서 테렌티우스의 시어머니의 첫 번째 무대는 기원전 165년에 끝났습니다.
    vignettes:
      warning: 당신은 무대 담당자에게 사람들이 지금으로부터 2000년 후에도 중단된 공연에 대해 여전히 읽을 것이라고 말했습니다. 그는 배우들이 멈춰야 할 때 무슨 말을 했는지 알 수 있는지 묻습니다. 리허설을 위해 남아서 들리는 마지막 대사를 적습니다. 공개 공연은 아직 여러분 앞에 있습니다.
      audibility: 당신은 입구 옆에서 귀를 기울이다가 명확하게 들었던 대사에 대한 응답을 놓치게 됩니다. 무대 담당자는 벤치 하나를 옮기고 다시 들어보라고 요청합니다. 이번에는 양쪽 반쪽을 모두 듣습니다. 벤치의 두 위치에 대한 스케치를 집으로 가져갑니다. 밖에서 엔딩을 들을 수 없을 만큼 거리가 너무 시끄러워졌습니다.
      bench: 당신은 무대 담당자가 출입구에서 벤치 하나를 뒤로 놓는 것을 돕습니다. 늦게 온 사람은 한 줄 전체를 세우지 않고 자리에 앉는다. 나무 조각에 빈 공간을 표시합니다. 리허설 소리가 여전히 출입구를 통해 들리는 가운데 떠납니다.
  taqi_al_din_istanbul:
    name: 천문대의 두 목소리
    place: 이스탄불
    figure: 타키 앗딘
    story: 타키 알 딘(Taqī al-Dīn)의 이스탄불 천문대는 1580년 1월 철거되기 전에 관찰을 수행했습니다. 기록 연구에서는 사분면과 기계식 시계를 포함한 도구를 식별합니다.
    story_prose:
      opening:
        - 1580년 초, 이스탄불. 타키 앗딘(타키 앗딘)과 그의 조수들이 천문대에서 관찰하고 있습니다. 원고에는 그들이 그곳에서 사용한 여러 악기가 기록되어 있습니다.
        - 역사상 천문대는 1월에 해체됐다. 이 분야에서는 이전 독자가 함께 사용했던 악기의 작은 부품 하나를 남기고 싶습니다.
        - 안전하게 넘겨줄 수 있는 것이 무엇인지 이해하는 사람이 도움을 줄 수 있습니다. 그들은 조수에게 어떤 작품을 담당할 수 있는지 물어봐야 합니다.
      points:
        p1: '{staff}는 보조자와 함께 스탠드를 두 번 살펴본 다음 가장 자주 읽은 눈금이 있는 조각만 가져갈 것인지 묻습니다. 조수는 고개를 끄덕이고 밑에 낡은 천을 들고 있습니다. 그와 {staff}는 그것을 테이블 위에 평평하게 들어 올렸습니다. 천을 집기 전에 그는 다시 가장자리를 따라 손가락을 움직입니다. 그의 손가락은 그가 낭독을 부르곤 했던 표시에 멈춥니다.'
      outcomes:
        all: 조수가 포장된 조각을 집으로 가져옵니다. 나중에 누군가 그에게 판독값을 어떻게 얻었는지 묻자 그는 그것을 펼쳐서 그 표시를 먼저 보여줍니다.
        p1: 작은 부분은 기존 스탠드와 어울리지 않습니다. 그날 사용한 천에 그대로 싸인 채 조수 테이블 아래로 들어갑니다.
      none: 조수는 한 번 돌아오고 빈손으로 떠난다. 한때 스탠드가 있던 자리에는 바닥에 더 창백한 패치가 보입니다.
      not_admitted: '{staff}는 천문대에서 누구도 만나지 않습니다. 문이 닫히면 나무 상자가 안으로 들어갑니다.'
      excerpts:
        p1: 천을 집기 전에 그는 다시 가장자리를 따라 손가락을 움직입니다. 그의 손가락은 그가 낭독을 부르곤 했던 표시에 멈춥니다.
    relic: 대조표
    relic_desc: 원래 줄과 그 수정 내용이 포함된 가상의 전망대 전표입니다.
    points:
