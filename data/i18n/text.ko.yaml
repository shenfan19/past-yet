        p1: 그녀는 종이에 마지막 줄을 적는다. 두 번째 노크가 올 때에도 그녀의 잉크는 여전히 젖어 있습니다.
        p2: 헨젤은 두 곳을 살펴보고 한 표시를 지우고 다른 표시를 펜으로 더 세게 누릅니다. 플레이어가 점수를 받으면 세 권의 책이 모두 같은 페이지에 열립니다.
    relic: 노래 악보
    relic_desc: Fanny라고 표시된 손으로 쓴 노래입니다.
