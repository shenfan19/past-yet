  xu_xiake_lijiang:
    name: 미처 오르지 못한 길
    place: 리장
    figure: 서하객
    story: 1639년 음력 2월, 서하객는 Lijiang의 Jietuo Lin에 머물면서 Mu Zeng을 위해 책을 정리했고 Mu Zeng은 그에게 음식과 선물을 보냈습니다. Xu는 Gongshou Terrace와 Lion Cliff가 수도원 위에 있다는 소식을 들었습니다. 그는 작업의 압박으로 인해 둘 중 하나를 오를 시간이 없다고 썼습니다.
    story_prose:
      opening:
        - 1639년 음력 2월 여강. 서하객가 Jietuolin에서 Mu Zeng의 책을 확인하고 있습니다. 그는 공수 테라스와 사자 절벽이 그 뒤에 더 높은 곳에 있다는 말을 듣고 그들의 이름을 일기에 적는다.
        - 역사상 그 책 때문에 그는 어느 곳도 방문할 수 없을 정도로 바빴습니다. Mu Zeng은 나중에 감사의 마음으로 선물을 보냈고 다시 Jizu Mountain의 기록을 수정하도록 요청했습니다. 이 가지에는 반납 목록과 산책을 위한 서류가 함께 놓여 있습니다.
        - 이번 여행에는 수량을 확인하고 안전하게 배송되는 것을 확인할 수 있는 사람이 필요합니다. 또한 가이드와 에스코트와 보조를 맞추고 경로가 어디로 돌아가는지 기억할 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 반환 목록과 대조하여 볼륨을 확인하고 이미 전달된 메신저에게 요청합니다. 메신저는 영수증을 맨 위에 올려 놓습니다. 아래 페이지는 상자 안에 깔끔하게 들어있으며, 바깥쪽에는 좁은 탭 하나가 여전히 표시되어 있습니다.'
        p2: 책이 전달되면 {staff}는 현지 가이드에게 길을 안내해 달라고 요청하고 Xu와 에스코트와 함께 Gongshou Terrace로 올라갑니다. 건너편 산이 한걸음 한걸음 다가온다. Xu는 모든 것을 볼 수 있게 되자 페이지 가장자리에 표시를 합니다.
        p3: '{staff}는 Xu와 함께 Lion Cliff 아래 분기점을 양방향으로 걸어가며 경로가 되돌아가는 위치를 보여줍니다. 스케치는 나중에 Jietuolin의 문턱 내부에 설정됩니다. 마지막 부분까지 접혀도 페이지 전체에 구부러진 부분이 남아 있습니다.'
      outcomes:
        all: 책을 되돌린 뒤, 산책은 일기장에도 그 길을 찾았다. Jietuolin에 남겨진 스케치가 열렸을 때 두 개의 별도 주름 옆에 두 개의 경로가 바뀌었습니다.
        p3: Jietuolin에는 스케치가 남아 있습니다. 누군가 사자 절벽 아래 굽은 부분을 가리키며 다시 접었습니다.
        p2: Lijiang에 대한 설명은 이제 Xu가 서 있던 자리를 차지했습니다. 그는 페이지를 다시 펴서 산이 처음으로 보였던 선에 손가락을 얹었습니다.
        p1: Mu Zeng은 나중에 감사를 표하고 다시 요청했습니다. 답장을 치웠을 때에도 권의 탭은 여전히 일렬로 놓여 있었습니다.
      none: 상자가 닫혔습니다. 문지방 옆에 말려 있는 여분의 시트 한 장의 느슨한 끝이 땅에 닿았습니다.
      not_admitted: '{staff}는 책을 확인하는 사람들이 있는 곳을 찾지 못했습니다. 문 안에서 누군가가 상자를 옮기자 뚜껑이 두드렸다.'
      desync: 배송 전에 볼륨이 확인되지 않았습니다. {staff}가 리콜되었을 때 상자 옆 목록은 여전히 절반만 표시되어 있었습니다.
      excerpts:
        p3: 스케치는 나중에 Jietuolin의 문턱 내부에 설정됩니다. 마지막 부분까지 접혀도 페이지 전체에 구부러진 부분이 남아 있습니다.
        p2: 건너편 산이 한걸음 한걸음 다가온다. Xu는 모든 것을 볼 수 있게 되자 페이지 가장자리에 표시를 합니다.
        p1: 메신저는 영수증을 맨 위에 올려 놓습니다. 아래 페이지는 상자 안에 깔끔하게 들어있으며, 바깥쪽에는 좁은 탭 하나가 여전히 표시되어 있습니다.
    relic: Jietuo Lin의 경로 스케치
    relic_desc: 경사면 위로 선이 있고 분기점 옆에 빈 여백이 있는 접힌 스케치입니다.
    points:
      p1: Mu Zeng이 작업을 인정하고 지산 지명지에 대한 요청을 갱신할 수 있도록 메신저를 통해 수정된 도서가 반환되었는지 확인하세요.
      p2: 반나절의 여유 시간을 갖고 현지 가이드와 에스코트를 찾아 Xu와 함께 Jietuo Lin에서 Gongshou Terrace까지 걸어보세요.
      p3: Xu와 함께 사자 절벽 아래 갈림길을 걷고 수도원에 새로운 경로 메모 사본을 남겨주세요.
    points_fail:
      p1: 반환된 볼륨에 영수증이 없습니다. 메신저는 이전 작업이 완료되었는지 확인할 수 없으며 인계가 누락되고 사무실에서 해당 직원을 소환합니다.
      p2: 그날의 복사가 오후를 채운다. Gongshou Terrace는 Xu가 들었던 장소로 일기에 남아 있습니다.
      p3: Xu는 자신이 들은 지시 옆에 내려앉기 위해 자신의 발걸음에서 길도 없이 리장을 떠났습니다.
    shift:
      p1:
        was: 1639년 음력 2월 9일, 목증은 정리에 대한 감사의 뜻으로 선물을 보내고, 다시 서에게 기산지(族山記) 편찬을 부탁했다.
      p2:
        was: 1639년 음력 2월 6일, Xu는 대조하느라 너무 바빠서 공수 테라스나 사자 절벽에 올라갈 수 없었다고 썼습니다.
        now: 데이터 정렬이 전달된 후 {staff}는 Xu를 Jietuo Lin으로 다시 데려가 가이드와 호위를 만납니다. Xu는 테라스에 올라가 반대편 경사면이 보이는 곳을 기록합니다.
      p3:
        was: 1639년 리장 일기에는 사자 절벽이 어딘가에 더 높은 곳에 있다고 들었고 올라갈 시간이 없었다고 언급했습니다.
        now: '{staff}는 Xu와 함께 양방향으로 포크를 걷습니다. Xu는 경로가 이중으로 돌아가는 굽은 부분을 표시하고 Jietuo Lin에 스케치 사본을 남깁니다.'
        who: xu_xiake_lijiang
        bio: Xu의 Lijiang 일기에는 대조와 출발 사이에 직접 추가 항목이 포함되어 있습니다. 그의 스케치의 두 번째 사본은 Jietuo Lin에게 남아 있습니다.
    vignettes:
      view: 가이드는 산이 마주한 굴곡에 대해 설명합니다. {staff}는 그에게 앞으로 몇 턴 남았는지 묻습니다. 전망과 그곳으로 가는 길은 서로 다릅니다.
      trail: 에스코트는 계단까지 가파른 길을 가고 젖은 수갑을 차고 도착합니다. {staff}는 문 옆에 마른 천을 걸고 거의 완성된 페이지를 안쪽으로 더 멀리 옮깁니다.
      slope: 수도원 계단에서 {staff}는 신선한 잎사귀를 꺼냅니다. Mu Zeng에 대한 파견은 다시 상자로 돌아갑니다. 빈 잎은 경로를 위한 것입니다.
    remarks:
      trait_methodical: '{staff}는 다음 여행자가 어느 방향이 오르막인지 알 수 있도록 스케치에 화살표를 추가합니다.'
  savitribai_phule_pune:
    name: 가방에 넣은 여벌 사리
    place: 푸네
    figure: 사비트리바이 풀레
    story: 1848년에 Savitribai와 Jyotirao Phule는 푸네에서 소녀들을 가르치기 시작했습니다. 그녀의 작업에 대한 설명은 그녀가 길에서 만난 학대와 학교에서 갈아입기 위해 가져간 여분의 사리를 설명합니다. 후기 학교의 기록에는 그녀가 교장으로 나와 있습니다. 1897년에 그녀는 병자들을 돌보던 중 흑사병으로 사망했습니다.
    story_prose:
      opening:
        - 1848년 푸네. 사비트리바이 풀레과 Jyotirao Phule가 여학교를 시작합니다. 사비트리바이의 이야기에는 학교에 오면 갈아입기 위해 가방에 사리를 넣고 다녔다고 합니다.
        - 역사상 그녀는 가르치는 길에 학대를 당했고 일부 가정에서는 소녀들을 학교에 보내는 것을 반대했습니다. 이 지점에서 누군가는 그녀와 함께 거리를 걸을 수 있고 가족과 함께 앉아 왜 소녀를 집으로 불러들였는지 들을 수 있습니다.
        - 이번 여행에는 그 거리에서 안정감을 유지할 수 있는 사람, 가르치고 가족과 대화하는 방법을 아는 사람이 필요합니다. 군중이 모이면 누군가는 군중을 진정시킬 수 있어야 합니다.
      points:
        p1: 누군가 거리로 들어선다. {staff}는 출입구를 주시하고 Savitribai와 함께 Bhide Wada로 걸어가서 문을 밀어 엽니다. 첫 번째 소녀는 이미 책상 위에 석판을 올려놓고 있습니다. 창문이 밝아지고 닦아낸 흔적이 여전히 아래쪽에 표시됩니다.
        p2: '{staff}는 소녀의 가족과 함께 앉아 이야기를 듣고 그녀가 수업 시간에 쓴 대사를 보여줍니다. 그 소녀는 나중에 자신의 슬레이트를 예전 자리에 다시 놓았습니다. 그녀의 손은 천천히 움직이지만 첫 번째 선은 가장자리까지 닿습니다.'
        p3: '{staff}는 모퉁이에 서서 길을 막고 있는 사람들에게 말을 걸고, 던지는 것이 멈출 때까지 기다렸다가 그녀와 함께 지나갑니다. 학교에서 Savitribai는 가방을 책상 위에 올려 놓습니다. 여분의 사리는 여전히 안쪽으로 접혀 있고, 모서리는 전처럼 안으로 들어가 있습니다.'
      outcomes:
        all: 학생들 사이에서 돌아온 소녀와 함께 수업이 진행되었습니다. 사비트리바이는 가르치기 위해 가방을 열었습니다. 그 아래에는 천이 여전히 깔끔하게 접힌 상태로 놓여 있었습니다.
        p3: 그날부터 여분의 사리는 가방 바닥에 남아 있었습니다. 그녀가 방에 들어왔을 때 그녀는 한 손으로 창문을 열 수 있었습니다.
        p2: 그 소녀가 수업으로 돌아왔고, 그녀의 슬레이트에 또 다른 줄이 나타났습니다. 수업이 끝나면 그녀는 슬레이트를 원래 자리에 옆으로 돌려 놓았습니다.
        p1: 그날 아침 수업이 진행되었습니다. 문은 열려 있었고 첫 번째 슬레이트는 책상 다리에 기대어 있었습니다.
      none: 방은 하나의 석판이 부족했지만 분필은 책상 위에 놓여 있었습니다. 모퉁이에서 발소리가 들리더니 곧 사라졌다.
      not_admitted: '{staff}는 학교에서 자리를 찾지 못했습니다. 문 절반이 책상을 가리고 슬레이트 모서리만 드러났습니다.'
      desync: 학교로의 산책은 모퉁이에서 중단되었습니다. {staff}가 리콜되었을 때 창 아래 슬레이트는 여전히 비어 있었습니다.
      excerpts:
