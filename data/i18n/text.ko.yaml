          else: 3월 18일 러시아 화학회가 회의를 가졌으나 멘델레예프는 참석하지 않았습니다. 그가 Menshutkin에게 맡긴 것 중 테이블은 한 곳에 있었고 종이 원고는 아직 개봉하지 않은 수하물에 포장되어 있었습니다. {staff}는 밤새도록 앉아 있다가 새벽이 되기 전에 열어보지 않은 트렁크에서 원고를 발견하고, 그 원고와 탁자를 양팔에 안고 서둘러 회의장으로 향했습니다. Menshutkin은 책상 위에 테이블을 펴고 원고를 열고 한 페이지 씩 읽었습니다. 테이블에는 틈이 있었고, 뒷줄에서는 누군가가 보려고 기중기를 들고 있었습니다.
        p2:
          class_teaching: 4월 15일에 모임이 다시 열렸고 멘델레예프도 시내에 있었습니다. 지난 회의에서 미루어진 항목이 여전히 예전 페이지에 남아 있었습니다. {staff}는 선생님이 하듯이 회의 전에 탁자를 크게 복사해 강당 앞에 걸어두었고, 저자가 참석했을 때 논의할 마지막 순간의 한 줄을 안건 상단까지 복사해 두었습니다. 그 항목이 나왔을 때 멘델레예프는 손에 탁자를 들고 서 있었습니다. 누군가가 틈에 대해 물을 때마다 그는 그 상자 주위에 연필 고리를 그렸습니다. 회의가 끝날 무렵에는 여러 곳에 고리가 있었고 연필 끝은 뭉툭해졌습니다.
