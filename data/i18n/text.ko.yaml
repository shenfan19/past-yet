  pushkin_st_petersburg:
    name: 번지가 붙기 전의 장소
    place: 상트페테르부르크
    figure: 알렉산드르 푸시킨
    story: 1836년과 1837년에 알렉산더 푸시킨은 코뉴셰니 다리 옆 모이카 제방에 있는 볼콘스카야 공주의 집에서 살았습니다. 구력으로는 1837년 1월 27일, 신력으로는 2월 8일에 그는 흑강(Black River)에서 조르주 당테스와 결투를 벌이다 복부에 총을 맞았습니다. 그는 집으로 옮겨져 새 달력으로 1월 29일, 2월 10일에 그곳에서 사망했습니다. 그는 가족 소유지인 Mikhailovskoye 근처에 있는 어머니 옆에 묻혀 있습니다.
    story_prose:
      opening:
        - 새 달력으로 보면 1837년 1월 상트페테르부르크. 알렉산드르 푸시킨과 그의 가족은 Volkonskaya 공주의 집에있는 Konyushenny Bridge 옆 Moika 제방에 살고 있으며 문에는 아직 현재 번호가 표시되어 있지 않습니다. 그는 유진 오네긴(Eugene Onegin)의 운문을 썼으며 종종 현대 러시아 문학의 창시자로 간주됩니다.
        - 역사상 그의 빚은 그해 겨울 내내 늘어났습니다. 새 달력으로 2월 8일에 그는 블랙 리버(Black River)에서 조르주 당테스와 결투를 벌였다가 복부에 총을 맞아 집으로 돌아왔고, 이틀 후 37세에 복막염으로 아내와 4명의 자녀를 남겨두고 사망했습니다. 차르는 나중에 빚을 갚았습니다. 이 지점에서는 아파트로 가는 길을 묻는 사람은 누구나 문지기에게 묻고, 집의 가정부는 다리 건너편으로 심부름을 보내는 경우가 많습니다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 계좌를 유지할 수 있거나 거래를 한 사람, 또는 질서 있고 재치가 있는 사람, 청구서 더미를 정리하는 사람; 의학을 아는 사람, 위기 상황에서도 흔들리지 않는 구급상자를 갖고 있는 사람. 항생제를 가져온 의사, 나노 메디컬 키트를 들고 온 의료진.
      outcomes:
        all: 2월이 지나도 푸쉬킨은 여전히 모이카에 의해 회복 중이었고, 그의 책상 위의 청구서는 하나의 목록이 되어 있었습니다. 그는 몇 년 동안 계속해서 글을 썼고 The Contemporary는 그의 손에 남아있었습니다.
        p3: 2월이 지나도 그는 여전히 모이카 옆에서 회복 중이었고 벽에 손을 대고 창가로 걸어갈 수 있었습니다. 몇 년 동안 The Contemporary가 그의 손에 남아있었습니다.
        p1: 목록은 잉크병 아래에 남아 있었습니다. 그 후로 가족은 한 번에 한 품목씩 소비했습니다.
        p2: 그는 살아서 모이카로 집에 왔고, 서재로 옮겨져 그곳의 소파에 누웠습니다. 홀에는 소식을 구하는 사람들이 거리까지 길게 늘어서 있었다.
      none: 새 달력으로 2월 8일 저녁, 블랙 강변의 눈 속에서 그는 살아서 도시에 도착하지 못했습니다. 청구서 더미는 아직도 손대지 않은 채 책상 위에 놓여 있었습니다.
      desync: 새 달력으로 2월 8일 저녁, 도시로 돌아오는 길에 마차는 조용해졌습니다. {staff}가 리콜되었을 때 문이 반쯤 열린 채 눈 속에 서 있었고 바닥에는 장갑이 놓여 있었습니다.
      not_admitted: '{staff}는 집에 들어가지 않았고, 포터와 함께 다리에서 모이카를 따라 한 번만 걸었고, 방향을 알려줄 때 차례를 세었습니다. 짐꾼은 최근 길을 묻는 사람이 많아졌고, 모두 다리 옆에 있는 집을 찾고 있다고 말했습니다.'
      points:
