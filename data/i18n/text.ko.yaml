  higuchi_ichiyo_tokyo:
    name: 가판대 위의 《다케쿠라베》 일곱 회
    place: 도쿄
    figure: 히구치 이치요
    story: 히구치 이치요의 『다케쿠라베』는 1895년부터 1896년 1월까지 문학회에 7회에 걸쳐 게재되었습니다. 문게이 쿠라부가 1896년 4월에 함께 출판했습니다.
    story_prose:
      opening:
        - 1896년 도쿄. 히구치 이치요의 다케쿠라베는 문학회 7호를 휩쓴 후 문예구라부의 개정판으로 등장했습니다.
        - 역사상 그녀는 자신이 선택할 수 있는 용어에 대한 별도의 판을 얻지 못했고 11월에 사망했습니다. 이 지점에서는 아직 한 권의 지난 호가 발견되지 않았으며 서점은 여전히 선지급에 동의할 수 있습니다.
        - 문제와 증거를 추적할 수 있는 사람이 도움을 줄 수 있습니다. 작성자가 약관을 읽는 동안 지불에 대해 논의하는 사람을 기다리게 하려면 인내심이 필요합니다. 질병에는 올바른 장비를 가지고 찾아오는 사람이 필요합니다.
      points:
        p3: 날씨가 더워지면 Ichiyō는 여전히 열이 있습니다. {staff}는 방문하여 자신이 동의한 치료를 준비하고 함께 사는 사람들에게 더 많은 페이지를 요구하는 사람을 거부하도록 요청합니다. 어느 날 그녀는 다시 책상에 앉았다. 그녀는 벽에 기대어 있던 원고를 다시 가져옵니다. 창문에서 나온 작은 빛이 그녀가 마지막으로 멈췄던 곳에 떨어진다.
        p2: '{staff}는 서점에 수수료, 날짜 및 서면에 사용할 버전을 함께 기재하도록 요청합니다. Ichiyō는 시트를 가까이 당기고 각 용어를 읽습니다. 마지막에야 그녀는 어떤 사본을 보관할 수 있는지 묻습니다. 서점은 자신의 사본을 반으로 접습니다. 이치요가 펼쳐 놓은 것에서 그녀가 동그라미 친 이름이 단번에 보입니다.'
        p1: 카운터에는 7개의 문제가 있어야 하지만 6개만 셀 수 있습니다. {staff}는 부재호를 마지막으로 빌린 사람을 찾습니다. 카운터로 돌아온 Ichiyō는 자신의 개정판에서 동일한 구절을 찾고 있습니다. 그녀는 페이지를 나란히 놓고 다시 작성된 첫 번째 줄부터 읽기 시작합니다. 이번에는 카운터의 균열에 종이가 걸리지 않습니다.
      outcomes:
        all: Ichiyō가 책상으로 돌아오자 그녀는 먼저 별도판에 대한 조건을 확인합니다. 창가에는 두 개의 더미가 놓여 있습니다. 오래된 잡지와 그녀가 아직 쓸 수 있는 종이입니다.
        p3: 그녀가 다시 앉아서 글을 쓸 수 있게 되면 그 페이지를 맨 위로 가져갑니다. 방에 있는 누구도 그녀에게 그것을 돌려주지 않습니다.
        p2: 서점은 계약서 사본을 돌려보냅니다. 그녀는 선택한 증거를 동일한 지난 호 안에 보관합니다.
        p1: 완전한 문제가 도착하면 일곱 개의 오래된 문제가 여전히 함께 쌓여 있습니다. 그녀는 테이블에 들러 수정한 부분을 읽습니다.
      none: 서점으로부터 아직 할 일이 더 많다는 메시지가 왔습니다. 새로운 이슈가 종료되면 새로운 답변이 없습니다.
      not_admitted: '{staff}는 Ichiyō를 결코 만나지 않습니다. 오래된 발행물 더미가 여전히 대출 카운터 아래에 묶여 있습니다.'
      desync: 과월호 1개를 찾을 수 없습니다. 사무실에서 {staff}를 리콜할 때 카운터에 있는 스택의 중간에 여전히 틈이 있습니다.
      excerpts:
        p3: 그녀는 벽에 기대어 있던 원고를 다시 가져옵니다. 창문에서 나온 작은 빛이 그녀가 마지막으로 멈췄던 곳에 떨어진다.
        p2: 서점은 자신의 사본을 반으로 접습니다. 이치요가 펼쳐 놓은 것에서 그녀가 동그라미 친 이름이 단번에 보입니다.
        p1: 그녀는 페이지를 나란히 놓고 다시 작성된 첫 번째 줄부터 읽기 시작합니다. 이번에는 카운터의 균열에 종이가 걸리지 않습니다.
