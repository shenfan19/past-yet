  pasteur_paris:
    name: 아르부아의 여름
    place: 아르부아
    figure: 루이 파스퇴르
    story: 1859년 여름, 9살이었던 파스퇴르의 큰 딸 잔느는 아버지가 파리에서 일하는 동안 할아버지와 함께 아르부아에 머물고 있었습니다. 9월에 그녀는 장티푸스에 걸려 그곳에서 사망했습니다.
    story_prose:
      opening:
        - 파리에서 온 짧은 편지가 아르부아에 있는 잔느의 할아버지 집 창가에 놓여 있습니다. Jeanne은 오늘 오후에 마당에 들어가지 않았습니다. 그녀의 할아버지는 자주 침대 곁으로 가십니다. 거기에서 그는 누군가 우편물을 찾으러 오는 소리를 들을 수 있습니다.
        - Jeanne은 1859년 여름에 할아버지와 함께 지냈습니다. 역사상 그녀는 9월에 장티푸스로 사망했습니다. 이 지점에서는 사무실의 가상 의료 키트가 그녀의 질병 과정을 바꿀 수 있습니다. 그녀의 할아버지는 그녀가 다시 일어섰다고 글을 쓰게 될 수도 있습니다.
        - 케어 경험이 있는 여행자와 사무실의 나노키트를 보내주세요. 할아버지에게 도움이 필요한 곳이 어디인지 물어보고 할머니가 깨어날 때까지 근처에 머물러 주십시오.
      points:
        p1: 그녀의 할아버지는 침대가 보이는 쪽으로 의자를 옮겼다. 간병인에게 사무실 키트를 전달하고 Jeanne이 원하는 곳에 머물게 합니다. 그녀가 일어나 앉으라고 하자 그는 편지지를 꺼내더니 무엇을 추가했으면 좋겠는지 묻습니다. 그녀는 그에게 먼저 엄마에게 편지를 보내달라고 요청한 다음 아빠에게 보낼 문장을 생각합니다.
      outcomes:
        all: 그녀의 할아버지는 그녀가 회복 중이라고 편지를 썼습니다. 그는 아버지가 보낸 편지 옆에 짧은 편지를 남겨두고 부임할 준비를 합니다.
        p1: Jeanne은 잠시 앉아 있을 수 있을 만큼 힘이 있습니다. 그녀의 할아버지는 그녀가 일어났을 때 사용했던 단어로 부모에게 편지를 쓸 수 있습니다.
      none: 누군가 우편물을 찾으러 오면 할아버지는 시트를 한 번 더 접는다. 역사상 Jeanne은 그 병에서 회복되지 않았습니다.
      not_admitted: 가족들은 아직 방문객을 받아들이지 않았습니다. 우편물을 가져가는 사람이 먼저 떠나고, 파리에서 온 편지는 실내에 남아 있다.
      excerpts:
        p1: 그녀가 일어나 앉으라고 하자 그는 편지지를 꺼내더니 무엇을 추가했으면 좋겠는지 묻습니다. 그녀는 그에게 먼저 엄마에게 편지를 보내달라고 요청한 다음 아빠에게 보낼 문장을 생각합니다.
