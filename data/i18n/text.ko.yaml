        now: 학습자는 노래를 처음부터 끝까지 배웠고 나중에 자신의 학습자에게 가르쳤습니다.
      p3:
        was: 네사왈코요틀은 1472년 Texcoco에서 사망했습니다. 그의 이름과 관련된 노래는 100년 후에 책으로 복사되었으며, 멕시코 100페소 지폐에 있는 그의 얼굴은 500여 년 후에 나타났습니다.
        now: '{staff}는 그의 마지막 날에 그와 함께 앉아 이 모든 것을 말했습니다.'
    vignettes:
      voice: '{staff}는 가수가 I로 시작하는 줄에서 앞으로 나아갈 때 연습 시트에 두 자리를 남깁니다. 하나는 가수를 위한 것이고, 다른 하나는 노래의 이름을 위한 것입니다.'
      drum: '{staff}는 예비 스트립을 마커로 배치하여 첫 번째 가수가 서 있을 때 다음 가수가 접근할 수 있는 위치에 페이지를 유지합니다.'
      later: '{staff}는 어느 가수에게서 대사를 들은 것인지 기록하고, 누가 처음으로 공개했는지에 대한 질문을 남깁니다.'
  ino_tadataka_ezo:
    name: 직선에 지워진 굽이
    place: 홋카이도
    figure: 이노 다다타카
    story: 1800년 6월 11일 이노 다다타카는 첫 번째 조사를 위해 에도를 떠났습니다. 일행은 도호쿠를 거쳐 북쪽으로 이동하여 에조(Ezo)를 건너 해안을 따라 니시베츠(Nishibetsu)까지 갔다가 돌아오면서 측량했습니다. 섬에 대한 조사뿐만 아니라 전체 탐험에는 약 6개월이 걸렸습니다. 이노는 1818년에 사망했습니다. 그의 동료들은 1821년에 해안 지도를 완성했습니다.
    story_prose:
      opening:
        - 1800년 6월 11일, 에도. 55세의 이노 다다타카는 조사대 6명과 함께 북쪽으로 해협을 건너 에조로 가서 해안을 따라 줄을 긋기 위해 출발합니다. 그의 첫 번째 설문조사다. 나중에 그는 일본 전역의 해안을 걸었고, 그가 죽은 지 3년 후에 그의 동료들이 대일본 해안의 지도를 완성했습니다.
        - 역사상 막부는 약간의 수당만 주었고 도로 비용의 대부분은 자신의 주머니에서 나왔습니다. 이 조사는 도보로 진행되었으며 측정 로프는 두 번째에만 들어 왔습니다. 일행은 에조의 남쪽 해안을 따라 니시베츠까지 측정한 다음 같은 경로로 되돌아갔습니다. 이 지점에서는 일행 중 한 명이 큰 소리로 속도를 세고, 해안에 있는 어부는 해안이 어디로 향하는지 알고 있습니다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 계좌를 유지할 수 있거나 거래를 한 사람, 돈이 부족할 때 버틸 수 있는 사람, 질서 있고 튼튼한 사람, 영양 합성기를 가진 사람; 목공, 보트 제작 또는 그물 수선을 한 사람, 공학을 아는 사람, 또는 길게 뻗은 도로를 정확하게 측정하는 데 능숙하고 주의 깊은 사람; 매우 터프하고 긴 도로에 익숙한 사람, 항법, 비행 또는 지질학을 아는 사람 또는 정찰 드론을 가진 사람.
      outcomes:
        all: 그해 겨울, 일행은 떠난 지 180일 만에 에도로 돌아왔습니다. 가져온 시트에는 니시베츠를 지나는 에조의 해안이 그려져 있고, 그 옆에는 끈으로 측정했다는 메모가 한 군데 붙어 있었다.
        p3: 그해 겨울 일행은 에도로 돌아왔다. 시트에서 해안선은 니시베츠를 조금 지나서 작은 곶에서 끝났습니다.
        p2: 그해 겨울 일행은 에도로 돌아왔다. 시트에는 해안의 한 부분이 그 속도와 줄 길이를 나란히 기록했습니다. 다음 측량에서 일행은 줄자를 가져갔습니다.
        p1: 그해 겨울 일행은 떠난 지 180일 만에 같은 길로 에도로 돌아왔다. 측정 직원은 그와 함께 몇 차례 더 긴 여행을 떠났습니다.
      none: 8월말이 되자 지갑은 텅 비었고 일행은 짐을 꾸려 니시베쓰 앞으로 돌아왔습니다. 기수의 계산은 점점 더 조용해졌고, 집계 시트의 마지막 줄은 공백으로 남아 있었습니다.
      desync: 8월 말에 돈이 바닥나고 일행은 니시베츠 앞에서 돌아섰다. {staff}가 회수되었을 때 측정 직원은 여전히 모래 중간에 서 있었고 밀물이 절반 이상 올라왔습니다.
      not_admitted: '{staff}는 조사대에 참여하지 않았고 어부가 그물을 끌어올리는 것을 몇 번 도왔습니다. 그가 해안이 어디로 향하는지에 대해 이야기하고 있는 동안, 모래를 따라 더 동쪽에 있는 사람들의 줄이 보이지 않게 다가오고 있었습니다.'
      points:
        p2:
          class_seafaring: 8월, 에조 남동해안. 일행은 이전과 마찬가지로 속도를 측정했고, 운반자는 큰 소리로 숫자를 세었지만, 모래와 조약돌 위에서는 같은 구간을 두 번 걸어도 같은 숫자를 세지 않았습니다. 배에서 매듭을 묶던 {staff}는 얇은 끈 코일을 꺼내어 간격마다 매듭을 묶어서 측량봉에 대고 매듭 사이의 간격을 확인하고 반대쪽 끝에 있는 운반자가 그것을 해안을 따라 똑바로 잡아당겼다. 이노는 보폭 옆에 끈 단위를 쓰고 두 줄의 숫자 사이에 짧은 선을 그었습니다. 운반자는 끈을 팔에 다시 감았고, 매듭은 손가락 사이로 하나씩 빠져나갔습니다.
