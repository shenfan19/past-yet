  dickinson_amherst:
    name: 상자 속 시들
    place: 애머스트
    figure: 에밀리 디킨슨
    story: 에밀리 디킨슨은 1886년 5월 15일 Amherst의 집에서 사망했습니다. 그녀의 여동생 Lavinia는 자신이 받은 편지를 불태워 달라는 요청을 이행했고 수백 편의 시를 발견했습니다. 최초의 편집자들은 나중에 Emily가 많은 시를 꿰매었던 소책자를 분해했습니다.
    story_prose:
      opening:
        - Amherst 집에서 Lavinia는 편지 더미 아래에 접힌 시트 모서리를 봅니다. 에밀리가 엮은 소책자 중 일부가 근처에 있습니다. 위층에 누군가가 불을 켜두겠느냐고 묻습니다. 서류는 모두 현재 가장 가까운 상자의 뚜껑으로 이동합니다.
        - 에밀리 디킨슨은 1886년에 사망했습니다. 그녀의 여동생 Lavinia는 편지를 다루던 중 많은 양의 시를 발견했으며 나중에 많은 묶음이 폐기되었습니다. 먼저 Emily가 원하는 방식으로 치료를 준비한 다음 Lavinia가 글자와 시를 구별하고 소책자 한 권을 그대로 유지하도록 도와주세요.
        - 간병 경험이 있는 여행자는 Emily에게 밤새 원하는 것이 무엇인지 물어볼 수 있습니다. 원고를 읽는 사람은 Lavinia가 연결 및 변형 단어를 인식하고 찾은 순서를 보존하도록 도울 수 있습니다.
      points:
        p1: 라비니아는 헐렁한 시트를 집어들고 편지들이 서로 어울릴 수 있다고 말합니다. 먼저 아래에 있는 끈을 풀어달라고 부탁하세요. 그녀는 언니의 손에서 같은 크기로 접힌 몇 페이지를 찾아 등불 옆에 놓고 읽습니다. 그녀는 두 개의 더미를 다른 뚜껑으로 옮긴 후에야 가족을 불러 살펴보게 됩니다.
        p2: Lavinia는 각 페이지에서 읽기 쉬운 단어를 녹취록에 포함할 수 있는지 묻습니다. 필사자에게 같은 줄 옆에 있는 두 단어를 보여주도록 한 다음 복사본에 접힌 부분과 구멍을 꿰매십시오. 소책자는 재봉된 상태로 유지되며 포장지에는 페이지 순서가 있습니다. 다음에 읽을 때 접힌 부분은 필사자가 동일한 대체 단어로 돌아가도록 유도합니다.
        p3: 당신은 Emily에게 오늘 밤 옆방에 누군가가 묵기를 원하는지 물어봅니다. 그녀는 램프를 가리키며 자신이 부르면 들을 수 있도록 복도 문을 조금 열어 달라고 요청합니다. 가족은 그녀가 묻는 곳에 물과 의자를 놓습니다. 마지막으로 당직을 맡은 사람이 나가는 길에 부드럽게 발걸음을 옮긴다. 에밀리는 그 발소리만으로도 여전히 누군지 알아챕니다.
      outcomes:
        all: Emily는 요청한대로 저녁을 보냅니다. 그녀가 죽은 후 살아남은 논문에는 바느질과 대체 단어가 그대로 유지되어 여전히 읽을 수 있는 소책자 한 권이 포함되어 있습니다.
        p1: 편지와 시는 따로 보관하고, 미발표 시는 그대로 남는다. 가족이 나머지 책자를 다룰 때 일부 소책자는 여전히 분해되어 있습니다.
        p2: 소책자 1권의 접힌 부분과 대체 단어가 복사되었습니다. 나머지 신문은 어지러워졌고 여행은 그 소책자 한 권을 복사한 일을 기억합니다.
        p3: 그날 밤 Emily가 전화를 걸었을 때, 들을 수 있을 만큼 가까운 사람이 있었습니다. 여전히 가족은 스스로 서류를 분류해야 합니다.
      none: 램프 옆에 남은 것은 접힌 종이뿐입니다. 아무도 밤을 위해 새로운 준비를 하지 않습니다.
      not_admitted: 내부에서 누군가 대답하며 지금은 가족이 방문객을 받을 수 없다고 말합니다. 두 더미는 아직 열리지 않았습니다.
      desync: 편지와 시가 섞여 있다. 역사상 남아 있는 일부 논문은 이 부문에서 복구할 수 없습니다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 그녀는 언니의 손에서 같은 크기로 접힌 몇 페이지를 찾아 등불 옆에 놓고 읽습니다. 그녀는 두 개의 더미를 다른 뚜껑으로 옮긴 후에야 가족을 불러 살펴보게 됩니다.
        p2: 소책자는 재봉된 상태로 유지되며 포장지에는 페이지 순서가 있습니다. 다음에 읽을 때 접힌 부분은 필사자가 동일한 대체 단어로 돌아가도록 유도합니다.
        p3: 마지막으로 당직을 맡은 사람이 나가는 길에 부드럽게 발걸음을 옮긴다. 에밀리는 그 발소리만으로도 여전히 누군지 알아챕니다.
