        s_samuel: '{date}: Samuel은 홀 맨 뒤쪽에서 발끝으로 메모를 하고 있습니다. 그는 너무 멀리 떨어져 있고, 그가 쓰는 것의 절반은 듣는 사람들의 얼굴이다.'
        s_amara: '{date}: Amara는 홀 맨 뒤쪽에 갇혀서 모든 소리를 들을 수 없습니다. 그녀 옆에 있는 학생은 너무 오래 서 있다가 기절해 버립니다. 그녀는 그가 잠시 동안 앉아서 그의 손목에 숫자를 세는 것을 도와줍니다.'
      spoiler:
        s_fan: '{date}: Shen Fan은 2년 안에 이 학교가 이 학교를 주문한 사람의 이름을 따를 것이며, 100년 후에는 그 동상에서 출발할 것임을 알고 있습니다. 그는 노트 마지막 페이지에 두 문장을 쓰고 닫는다.'
        s_guilan: '{date}: Guilan은 이 학교가 2년 안에 이름을 바꿀 것이라는 것을 알고 있습니다. 그녀는 문자를 쓸 수 없기 때문에 머릿속으로 한 번만 말하고 아무에게도 말하지 않습니다.'
        s_somchai: '{date}: Somchai는 2년 안에 이 학교가 주문한 사람의 이름을 따게 될 것이라는 것을 알고 있습니다. 그는 공책의 마지막 페이지에 문장을 쓰고 닫은 후 점원에게 가서 무엇을 읽고 있는지 묻습니다.'
        s_carlos: '{date}: Carlos는 이 학교가 2년 안에 이름을 바꿀 것이라는 것을 알고 있습니다. 그는 그것을 적을 수 없어서 오븐에 말하고, 끝나기도 전에 웃습니다.'
        s_samuel: '{date}: Samuel은 이 학교가 2년 안에 이름을 바꿀 것이라는 것을 알고 있습니다. 이는 다른 누구도 모르는 소식입니다. 그는 공책의 마지막 페이지에 그것을 쓰고 다시 지웁니다. 제출할 곳이 없습니다.'
        s_amara: '{date}: Amara는 이 학교가 2년 안에 이름을 바꿀 것이라는 것을 알고 있습니다. 그녀는 노트 마지막 페이지에 문장을 쓰고 닫는다.'
      pamphlet_given:
        s_fan: '{date}: 점원은 Shen Fan에게 프린터에서 새로 나온 팜플렛 사본을 건네주며 방에 있는 모든 사람이 이 팜플렛을 가져야 한다고 말했습니다. Shen Fan은 먼저 서문을 펴고 그 아래에 있는 날짜를 살펴봅니다.'
        s_samuel: '{date}: 점원이 사무엘에게 인쇄소에서 새로 나온 팜플렛 사본을 건네줍니다. 그는 그것이 어떤 인쇄인지 묻고 점원은 첫 번째 인쇄라고 말합니다.'
      errand_frail:
