          class_learned: 7월 13일 오후, 리만은 무화과나무 아래 의자에 앉아 있었는데, 무릎 위에 종이가 깔려 있었고, 몇 줄씩 기침을 할 때마다 멈췄습니다. 대학에서 강의를 한 적이 있는 {staff}는 옆에 의자를 끌어당겨 그가 말하는 대로 문장 하나하나를 적고, 공식의 색인 하나도 틀리지 않고, 완성된 페이지를 돌 밑에 정리한다. 저녁 무렵 바람이 불자 리만은 첫 페이지를 꺼내 오랫동안 눈에 가까이 대고 있다. 그는 그것을 다시 제자리에 놓고 그 위에 돌을 다시 놓았습니다.
          class_lettered: 7월 13일 오후, 리만은 무화과나무 아래 의자에 앉아 있었는데, 무릎 위에 종이가 깔려 있었고, 몇 줄씩 기침을 할 때마다 멈췄습니다. 교정본을 읽은 {staff}는 옆에 의자를 끌어당겨 그가 말하는 대로 각 문장을 적고, 완성된 모든 페이지를 한 번씩 읽어주고, 돌 밑에 페이지를 정리합니다. 저녁 무렵 바람이 불자 리만은 첫 페이지를 꺼내 오랫동안 눈에 가까이 대고 있다. 그는 그것을 다시 제자리에 놓고 그 위에 돌을 다시 놓았습니다.
