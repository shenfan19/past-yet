      p2:
        was: 그녀는 1889년 스톡홀름에서 정교수가 되었습니다.
        now: 이 지점에서 대학은 다음 학기의 교육 및 연구 계획을 세울 수 있을 만큼 일찍 서면으로 시작 날짜를 확인합니다.
        who: kovalevskaya_stockholm
        bio: Kovalevskaya는 스톡홀름에서 강체 회전을 가르치고 연구했습니다. 국제상과 그녀의 현지 근무 조건은 여러 기관에서 결정했습니다.
    vignettes:
      conditions: 연습지의 약어는 '회전체'라고 되어 있습니다. 첫 번째 페이지를 사용하여 관성과 질량 중심 위치에 대한 두 가지 제한을 복원합니다. 교정자는 두 가지를 모두 자신의 전표에 복사합니다. 수정 사항을 취소할 수 있지만 저널 문제는 여전히 미래에 있습니다.
      diagram: 교정자는 장난감 상판을 시험해보고 싶어합니다. 고정된 점을 스케치하고 질량 중심을 나타내는 별도의 점을 표시합니다. 그는 다음 사본에서 어느 것이 어느 것인지 지적할 수 있습니다. 시간이 다 되어도 장난감은 계속 회전하며 종이의 성능이 입증되지 않았습니다.
      clip: 연습의 바깥쪽에 가정을 두고 그 안에 느슨한 다이어그램을 접습니다. 다음 독자는 결과 이전의 조건을 보게 될 것입니다. 윗면의 윤곽을 집으로 가져오고 교정본은 책상 위에 놓아두세요.
  heron_alexandria:
    name: 글줄 옆의 그림
    place: 알렉산드리아
    figure: 알렉산드리아의 헤론
    story: Hero's Mechanics는 무거운 짐을 들어 올리고 옮기는 기계를 설명합니다. 원본 그리스어의 단편은 완전한 아랍어 번역본과 함께 남아 있습니다. 그의 작업장 방문은 대략 그의 활동 날짜인 서기 62년경으로 설정됩니다.
    story_prose:
      opening:
        - 알렉산드리아, AD 62년경. 그리스어로 작성된 Hero's Mechanics에서는 장치가 무거운 짐을 옮기는 데 어떻게 도움이 될 수 있는지 설명합니다.
        - 역사상 그리스어는 단편적으로만 남아 있는 반면, 전체 작품은 아랍어 번역으로 남아 있습니다. 이 분기에서는 복사본이 다이어그램 확인을 기다리고 있으며 누군가는 이를 별도로 저장하려고 합니다.
        - 다이어그램과 단어를 일치시킬 수 있는 사람이 도움을 줄 수 있습니다. 또한 책을 주선할 수 있는 사람이 손을 바꾸는 것도 필요합니다.
      points:
        p1: '{staff}는 사본을 빛이 가장 잘 들어오는 의자로 옮기고 영웅에게 같은 길이로 그려진 두 선을 보라고 요청합니다. 하나는 다른 페이지와 함께 읽어야 합니다. 복사가는 원본의 표시를 옮긴 다음 사본을 가져갈 사람에게 직접 장소를 찾아달라고 요청합니다. 독자는 두루마리를 다시 열기 전에 출입구로 가져갑니다. 수정된 표시에 도달하면 손가락을 그대로 둡니다.'
      outcomes:
        all: 두 번째 롤은 절대 작업장의 선반으로 돌아가지 않습니다. 빌릴 때마다 동일한 표시가 여전히 독자를 해당 페이지로 이끌 수 있습니다.
        p1: 독자는 떠나기 전에 사본을 따로 묶습니다. 오래된 롤은 작업장에 남아 있습니다. 수정 된 사람이 문 밖으로 나갑니다.
      none: 사본은 이전 롤에 남아 있습니다. 문이 닫히기 전, 찾으러 온 누군가가 손을 뒤로 빼낸다.
      not_admitted: '{staff}는 작업장에 절대 참여하지 않습니다. 누군가가 의자를 빛 속으로 끌어당기는 소리가 들립니다.'
      excerpts:
        p1: 독자는 두루마리를 다시 열기 전에 출입구로 가져갑니다. 수정된 표시에 도달하면 손가락을 그대로 둡니다.
    relic: 자국이 난 모형의 문턱
    relic_desc: 문이 긁힌 곳에 흠집이 있는 가상 작업장 모델의 조각입니다.
    points:
      p1: Hero가 그리스어 Mechanics 사본의 수치를 확인하고 해당 사본을 작업장 자체 롤과 별도로 보관하도록 도와주세요.
    points_fail:
      p1: 워크샵은 자체 롤을 유지합니다. 역사상과 마찬가지로 이 분야에서도 그리스어 본문의 단편만이 살아남고 아랍어 번역본은 전체 내용을 보존합니다.
    shift:
      p1:
        was: 영웅은 서기 1세기에 그리스어로 역학을 썼습니다. 그리스어 본문의 일부만 남아 있습니다. Qusṭā ibn Lūqā의 아랍어 번역은 전체 작업을 보존합니다.
        now: 그리스어 본문과 그 그림의 확인된 사본은 작업장에서 멀리 떨어진 곳에 보관됩니다. 이 지점에서는 사본이 나중에 독자에게 전달됩니다.
        who: heron_alexandria
        bio: 이 분야에서는 역학의 완전한 그리스 사본이 아랍 전통과 함께 남아 있습니다.
    vignettes:
      threshold: Nikanor는 미니어처 도어를 벤치에 맞췄고 리턴은 손가락 너비만큼 짧게 멈췄습니다. 문지른 부분을 표시합니다. 평평한 렌즈콩 껍질이 모델 아래에 걸렸습니다. 그는 그것을 닦아냅니다. 문이 닫히면 그는 그 자리를 다시 찾을 수 있도록 표시를 남겨달라고 요청합니다.
      audience: 베레니케는 이미 문을 열고 망토를 집는 그네를 보았습니다. 당신은 그녀에게 한 번 더 셀 수 있도록 먼 가장자리를 지켜보라고 요청합니다. 그것이 돌아왔을 때 그녀는 Nikanor가 놓친 한 조각의 빛을 발견했습니다. 그는 모델을 내보내는 대신 두 번째 시험을 위해 벤치에 모델을 보관합니다.
      future: 당신은 Nikanor에게 얼마나 먼 독자들이 이 페이지를 기계 사진 옆에 놓을 것인지 알 수 있습니다. 그는 희미한 딸깍 소리와 함께 출입구가 안정되는 것을 지켜보고 있습니다. 당신은 그 사람의 말을 듣습니다. 당신이 떠날 때 그는 고객이 놓친 동작을 확인하기 위해 다시 전화를 겁니다.
  pliny_stabiae:
    name: 스타비아이의 바람
    place: 스타비에
    figure: 대플리니우스
    story: Pliny the Younger는 나중에 그의 삼촌이 CE 79년의 폭발 동안 Stabiae에서 Pomponianus에 도달했다고 Tacitus에게 썼습니다. 그를 데려온 바람은 짐을 실은 배가 떠나는 것을 막았습니다.
    story_prose:
      opening:
        - AD 79년에 만 위로 구름이 떠올랐습니다. Pliny the Younger는 나중에 Tacitus에게 그의 삼촌이 도움을 요청하고 배를 타고 나갔다고 말했습니다.
        - 역사상 플리니우스 장로는 스타비아이에 있는 폼포니아누스에 도착했지만 그 해안에서 살아서 돌아오지 못했습니다. 이 지점에서 배는 Rectina가 도움을 요청한 해안 부분에 더 가까이 다가갈 수 있습니다. Pliny를 해변에서 멀리 떨어진 곳으로 데려가는 것도 가능할 수도 있습니다.
        - 해안을 알고 배를 타고 해안에 도달하는 방법을 아는 사람이 필요합니다. 해변에 도착하면 적절한 장비를 가져와 숨을 쉬기 위해 애쓰는 남성을 도울 수 있는 사람이 필요합니다.
      points:
        p3: '{staff}는 해변에 있는 플리니 장로에게 다가가 보호 장비를 꺼내들고 주변 사람들에게 길을 비켜달라고 부탁합니다. 발이 재를 세게 눌렀습니다. 일행은 한 번 멈춰서 그가 숨을 쉴 때까지 기다렸다가 다시 움직인다. 앉을 수 있게 되면 동료의 어깨에 있는 돌 몇 개를 털어냅니다. 바닷가의 배는 아직도 소리를 내고 있다.'
        p2: 갑판에 있는 몇몇 사람들은 돌아서기를 원합니다. {staff}는 폼포니아누스가 어디에 살고 있는지 아는 사람이 누구인지 묻고 그 사람을 해안이 보이는 곳에 서 있게 합니다. 배는 그들이 내릴 수 있는 곳에 도착했다. 폼포니아누스가 그를 만나러 왔을 때, 플리니우스 장로는 여전히 긴 밧줄을 잡고 있었습니다. 그는 땅에 발을 딛기 전에 그것을 다시 배로 전달합니다.
        p1: '{staff}는 아직 접근할 수 있는 얕은 부분이 어디인지 묻고 승무원이 Rectina를 잡을 수 있는 장소를 떠나도록 도와줍니다. 그녀는 자신이 들고 있는 것을 먼저 넘겨주고, 누가 확고하게 갖기 전에 놓아준다. 그들이 그녀를 배에 끌어당긴 후, 그녀는 그들이 그녀를 위해 비워둔 자리를 젖은 손으로 누릅니다. 누군가 그녀가 지나간 것을 집어 들었습니다.'
      outcomes:
        all: 그들이 해안을 떠난 후 누군가는 Rectina가 건네준 것을 건조한 곳에 둡니다. 반대편에는 플리니우스 장로가 쉬고 있습니다. 마침내 배를 건너 걸을 수 있는 공간이 생겼습니다.
        p3: 승무원은 돌아오는 길에 플리니를 건조한 모퉁이를 떠납니다. 그를 앉히는 것을 돕는 사람은 그가 손을 내릴 때까지 기다립니다.
        p2: 플리니우스는 폼포니아누스의 집에 도착합니다. 그들과 함께 가져온 돌은 문 앞의 신발에서 떨어집니다.
        p1: 일단 탑승하면 Rectina는 그녀를 위해 허가된 장소에 머물게 됩니다. 그녀는 젖은 옷을 갈아입기 전에 보따리를 돌려받습니다.
      none: 계류장에서는 더 이상 해안 아래를 볼 수 없습니다. 물속에 빠진 사람들은 또 다른 부름을 기다린다.
      not_admitted: '{staff}는 절대 탑승하지 않습니다. 해안에 있는 누군가가 낚싯줄을 잡아당기자 활은 천천히 방향을 돌립니다.'
      desync: 배는 Stabiae에 도착하지 않습니다. Pomponianus는 기관이 {staff}를 다시 호출했을 때 Pliny를 보지 못했습니다.
      excerpts:
        p3: 앉을 수 있게 되면 동료의 어깨에 있는 돌 몇 개를 털어냅니다. 바닷가의 배는 아직도 소리를 내고 있다.
        p2: 폼포니아누스가 그를 만나러 왔을 때, 플리니우스 장로는 여전히 긴 밧줄을 잡고 있었습니다. 그는 땅에 발을 딛기 전에 그것을 다시 배로 전달합니다.
        p1: 그들이 그녀를 배에 끌어당긴 후, 그녀는 그들이 그녀를 위해 비워둔 자리를 젖은 손으로 누릅니다. 누군가 그녀가 지나간 것을 집어 들었습니다.
    relic: 밀랍 서판
    relic_desc: 스타일러스로 긁힌 메모용 왁스가 포함된 나무 태블릿입니다.
    points:
      p1: 얕은 물과 산의 잔해가 해안을 막을 때 장로 플리니를 도와 배를 렉티나의 해안으로 데려가 그녀를 태워주세요.
      p2: 떨어지는 부석과 돌 아래에서 플리니우스 장로의 배를 스타비아이로 향하게 하여 그가 착륙하여 폼포니아누스에 도달하도록 하십시오.
      p3: 스타비아에 해변에 유황 냄새와 먼지가 닥칠 때, 호흡을 맑게 유지하고 플리니 장로를 구해 해안에서 살아나게 하세요.
    points_fail:
      p1: 배는 그녀의 해안으로 들어올 수 없었고, 이 지점에서는 아무도 Rectina를 태우지 않았습니다.
      p2: Stabiae와 Pliny가 Pomponianus에 도착하지 않기 전에 배는 되돌아갔습니다. 지점은 역사에서 분리되었고 사무실은 직원을 소환했습니다.
      p3: 역사에 따르면 그는 스타비아에(Stabiae) 해변에 떨어졌고 이 가지에서도 그를 붙잡을 수 없었습니다.
    shift:
      p1:
        was: 서기 79년에 렉티나의 메시지는 플리니우스 장로가 도움을 청하기 위해 출항하도록 자극했습니다. 그의 조카는 막힌 해안과 Stabiae로 가는 길을 설명하지만 Rectina가 어떻게 되었는지는 말하지 않습니다.
        now: 배가 그녀의 해안으로 들어왔고 Rectina가 탑승했습니다. 그녀는 배를 타고 Stabiae로 계속 갔다.
      p2:
        was: Pliny the Younger는 나중에 Tacitus에게 그의 삼촌이 보트가 떠나지 못하게하는 바람과 같은 바람을 타고 Stabiae의 Pomponianus에 도착했다고 말했습니다.
      p3:
        was: 다음 날, 유황 냄새와 불꽃이 가까워지자 플리니우스 장로는 두 명의 노예가 그를 부양하고 스타비아에 해변에서 일어나 쓰러졌습니다. 그의 조카는 먼지가 가득한 공기가 그의 호흡을 방해했다고 썼습니다. 그의 시신은 이틀 뒤에 발견됐다.
        now: '{staff}는 먼지를 숨 쉬게 하고 그를 해변에서 끌어내렸습니다. 바람이 바뀌자 그는 배를 타고 미세눔으로 돌아가 몇 년을 더 살았습니다.'
        who: pliny_stabiae
        bio: 이 대사에서 플리니우스 장로는 스타비아에 해변에서 살아 돌아왔습니다. 그는 Misenum의 함대로 돌아와 몇 년 동안 살았습니다.
    vignettes:
      wind: 크리스푸스는 로드된 모든 상자를 사라진 것으로 표시했습니다. 출입구에서 당신은 짐을 실은 보트가 시야에 머무르는 동안 첫 번째 새로 온 사람이 어깨에 재를 메고 들어오는 것을 볼 수 있습니다. 크리스푸스는 사라졌다는 단어를 지웁니다. 그는 문을 통해 다음 이름을 입력할 수 있도록 태블릿에 공간을 남겨달라고 요청합니다.
      lantern: 프리마는 램프가 꺼지기 전에 방을 한 바퀴 돌아볼 시간이 있습니다. 그녀가 아직 볼 수 있는 사람들에게 전화하는 동안 당신은 그녀를 출입구 옆에 앉힙니다. 왁스 타블렛이 먼저 어두워집니다. 그녀는 마지막 두 이름을 큰 소리로 반복하고 당신은 각각에 대답합니다.
      letter: 당신은 몇 년 후에 보내질 편지를 기억합니다. 프리마는 그 목록을 가지고 있던 사람에 대해 묻고 있는데, 그 사람의 이름은 거기에 전혀 나타나지 않을 것입니다. 당신은 내일 아침에 대한 계산서를 한쪽으로 치워두고 그녀가 두루마리를 끝내도록 도와줍니다. 방문이 끝난 뒤에도 누군가 복도에서 내려오는 소리가 들립니다.
  galen_rome:
    name: 불이 난 뒤에 남은 책 제목
    place: 로마
    figure: 갈레노스
    story: 고통을 피하기 위해 갈레노스은 192년 로마의 화재로 인해 책과 기타 소유물을 잃어버린 것에 대해 설명합니다. 그는 자신이 더 이상 복구할 수 없다고 믿었던 작품과 사라진 사본을 구별합니다.
    story_prose:
      opening:
        - 로마, 192. 갈렌은 두루마리 몇 개를 캄파니아로 보냈고 책과 물건을 로마에 보관해 두었습니다. 나중에 『고난을 피하면서』에서 그는 그런 것들을 따로 기억한다.
        - 역사상 화재로 인해 그는 자신이 결코 대체할 수 없다고 생각했던 작품을 포함한 책을 모두 파괴했습니다. 이 분기에서는 하나의 로드가 일찍 진행됩니다. 누군가 목록이 닫히기 전에 그와 함께 목록을 살펴볼 수 있습니다.
        - 어떤 책이 어떤 무게로 가는지 아는 사람이 도움이 될 수 있습니다. 누군가는 장인에게 기억을 통해 다시 만들 수 있는 악기와 만들 수 없는 악기를 물어봐야 합니다.
      points:
        p3: '{staff}는 로마 상점 목록에서 코미디 용어집을 찾아 갈레노스에게 목적지를 다시 살펴보라고 요청합니다. 갈레노스은 자주 문의하는 곳에서 그것을 열어 본 다음 초기 배송물을 싣는 사람에게 Campania에 대한 책과 함께 넣으라고 지시합니다. 뚜껑을 닫는 동안 갈레노스은 넥타이가 아래에 걸리지 않도록 뒤로 손을 뻗어 넥타이를 위쪽으로 돌립니다.'
        p2: 가게에서는 아직 모든 악기를 가져 가지 않았습니다. {staff}는 기술자에게 리메이크하기 가장 어려운 것이 무엇인지 묻고 작업대에서 두 번째 모델을 준비하게 합니다. 그는 왁스가 굳을 때까지 기다렸다가 밑면을 표시합니다. 누군가 벤치를 치우러 오면 그는 모델을 손에 쥐고 있습니다. 두 번째 것은 서랍 바로 뒤쪽에 있습니다.
        p1: '{staff}는 두 개의 목록을 분리하고 초기 배송물을 적재하는 사람이 Campania용 목록을 다시 읽도록 합니다. 로마 더미에 쌓일 뻔한 두루마리를 누군가가 들어올립니다. 갈렌에게 확인한 후, 먼저 떠나는 짐으로 옮긴다. 묶기 전에 로더는 대상을 다시 맨 위에 씁니다. 누군가 코드의 느슨한 끝을 모퉁이에 감았습니다.'
      outcomes:
        all: 일찍 발송된 책은 필요할 때마다 이용하실 수 있습니다. 누군가 라벨을 따라 코미디 용어집을 찾아갔고 작업장에는 예비 모델이 그대로 남아 있었습니다.
        p3: 원고는 넥타이가 위쪽을 향하도록 불 앞으로 나아갑니다. 나중에 보는 사람은 짐을 분해하지 않고도 그것을 알아볼 수 있습니다.
        p2: 악기를 다시 만들기 전에 장인은 자신의 서랍을 열고 모형을 꺼냅니다.
        p1: 일찍 나가도록 표시된 롤이 먼저 떠납니다. 로마 매장 목록은 그대로 유지됩니다.
      none: 초기 발송물은 이미 적재되어 있습니다. 놓친 롤은 이전과 같이 치워집니다.
      not_admitted: '{staff}는 로딩하는 사람을 결코 만나지 않습니다. 물건을 옮기는 발소리가 가게 문 너머로 멀어진다.'
      desync: 초기 롤은 로마 주식에 보관됩니다. 기관에서 {staff}를 다시 호출할 때 잘못된 항목의 잉크가 여전히 젖어 있습니다.
      excerpts:
        p3: 뚜껑을 닫는 동안 갈레노스은 넥타이가 아래에 걸리지 않도록 뒤로 손을 뻗어 넥타이를 위쪽으로 돌립니다.
        p2: 누군가 벤치를 치우러 오면 그는 모델을 손에 쥐고 있습니다. 두 번째 것은 서랍 바로 뒤쪽에 있습니다.
        p1: 묶기 전에 로더는 대상을 다시 맨 위에 씁니다. 누군가 코드의 느슨한 끝을 모퉁이에 감았습니다.
    relic: 장서 목록 한 장
    relic_desc: 하나의 살아남은 제목과 빈 사본 열이 있는 가상의 인벤토리입니다.
    points:
      p1: 이미 캄파니아로 보내질 예정이었던 산문 용어집 롤을 위한 이전 배송의 공간을 확보하세요.
      p2: 악기가 보관되기 전에 기술자에게 교체하기 어려운 악기의 두 번째 왁스 모델을 만들어 작업장에 보관하도록 하세요.
      p3: 갈레노스이 오래된 코미디 용어집을 선적하기 전에 이전 배송물과 함께 로마 밖으로 보내도록 설득하세요.
    points_fail:
      p1: 두루마리는 로마 재고로 보관되어 캄파니아에 도달하는 대신 태워집니다. 지점의 동기화가 중단되고 사무실에서 해당 직원을 소환합니다.
      p2: 장인이 악기를 다시 만들어야 할 때 상담할 모델이 없습니다.
      p3: 원고는 여름 배송을 위해 창고에 보관되어 있으며 화재가 발생한 후에도 그대로 남아 있습니다.
    shift:
      p1:
        was: AD 192년 겨울이 끝날 무렵 로마에서 화재가 발생했을 때 갈렌은 자신의 산문 용어집이 이미 캄파니아로 갔다고 말했습니다.
      p2:
        was: 서기 192년 화재로 인해 갈레노스가 디자인한 도구를 포함해 로마에 보관된 도구가 모두 파괴되었습니다.
        now: 두 번째 왁스 모델은 작업장에 남아 있습니다. 화재가 발생한 후 갈레노스은 이를 사용하여 악기를 다시 만들 수 있습니다.
      p3:
        was: 서기 192년 겨울이 끝날 무렵, 갈레노스의 옛 희극 용어집은 로마에서 불타버렸습니다.
        now: '{staff}는 롤을 이전 배송으로 가져오고 갈레노스은 화재 후에도 사본의 텍스트를 계속 수정할 수 있습니다. 또 다른 사본은 나중에 로마 외곽의 컬렉션에 전달됩니다.'
        who: galen_rome
        bio: 갈레노스은 화재 이후에 그의 Old Comedy 용어집의 사본을 그대로 가지고 있었습니다. 그는 계속해서 인용문을 확인하고 다른 곳의 독자들을 위해 또 다른 사본을 보관했습니다.
    vignettes:
      list: Tertia는 목록에서 세 명의 이름을 부르고 세 권의 책을 셉니다. 당신은 그녀에게 그 책과 관련된 책을 만져보라고 요청합니다. 두 가지가 있습니다. 함께 세 번째 제목을 읽을 수 있도록 두고 복사 열에 빈 표시를 둡니다.
      borrow: Dion은 사본을 빌려준 것을 기억하지만 수령인의 이름을 지정할 수 없습니다. Tertia는 목록이 나가기 전에 타이틀을 획득하고 싶어합니다. 당신은 그가 그것을 건네준 출입구를 기억하도록 도와줍니다. 그녀는 그 거리의 답장을 위해 목록의 한 장소를 열어 두었습니다.
      survival: 당신은 화재가 발생한 지 오랜 후에 다시 표면화될 사본에서 바로 이 손실에 대한 작품을 읽었습니다. Dion은 내일 책상에 어떤 제목을 올려도 되는지 묻습니다. 당신은 인벤토리에 이름을 남겨두고 그에게 실제 책 두 권을 보여줍니다. 당신이 떠날 때 사라진 것은 발견되지 않았습니다.
  ovid_tomis:
    name: 시 한 편과 빈 한 줄
    place: 토미스
    figure: 오비디우스
    story: Tristia의 Book II에서 오비디우스는 자신의 범죄를 시이자 오류로 묘사하고 후자에 대한 설명을 거부합니다. 행사 연도는 망명 중 방문을 설정합니다.
    story_prose:
      opening:
        - 오비디우스는 흑해의 토미스(Tomis)로 망명 중이다. 트리스티아(Tristia)의 두 번째 책에서 그는 시와 실수로 인해 벌을 받았다고 말합니다. 그는 오류가 무엇인지 말하지 않았습니다.
        - 역사상 세 번째 책에는 병에 누워있는 시가 보존되어 있습니다. 이 가지에는 물조차 마시기 힘든 날이 있는데, 아직까지 그 책을 옮길 여행자를 찾지 못했습니다.
        - 이번 여행에는 환자를 기꺼이 돌봐줄 사람이 필요합니다. 또한 건널목을 이해하고 여행자에게 패킷을 전달할 수 있는 곳을 물어볼 수 있는 사람이 필요합니다.
      points:
        p2: '{staff}는 겨울 여행에 익숙한 여행자를 찾아 패킷이 다음 운송업체로 어디로 갈 수 있는지 묻고 오비디우스가 읽을 수 있는 곳에 수신자의 이름을 넣도록 합니다. 여행자는 내부 포장지와 외부 포장지를 별도로 납작하게 만듭니다. 그들이 떠나기 전에 그는 해안에 있는 사람들이 다시 한 번 확인할 수 있도록 주소를 넘겨줍니다. 오비디우스는 배 옆쪽으로 고개를 끄덕였습니다.'
        p1: '{staff}는 오비디우스가 아직 먹을 수 있는 음식이 무엇인지 묻고 근처에서 조금 발견한 후 침대 옆에 물을 남겨둡니다. 오비디우스가 드래프트를 시도하면 {staff}가 컵을 더 가까이 이동합니다. 그는 먼저 술을 마시고 조금 후에 페이지를 차지합니다. 그것을 가로지르는 컵의 그림자가 작은 모서리로 축소됩니다.'
      outcomes:
        all: 페이지를 가진 여행자가 항구를 떠났습니다. 누군가 침대 옆 물을 한 번 더 갈아주고, 오비드는 시트를 한 장 더 꺼낸다.
        p2: 해안에서 여행자는 오비디우스에게 패킷이 어디로 갈지 정확히 알려줍니다. 오비디우스는 마지막 정거장을 듣습니다.
        p1: 이제 그가 조용히 누울 수 있는 몇 가지 스트레칭이 있습니다. 그의 컵이 비워지기 전에 항상 더 많은 물을 가져옵니다.
      none: 보트는 항구의 보호된 쪽에 남아 있습니다. 여행자를 기다리는 패킷은 테이블 구석에 남아 있습니다.
      not_admitted: '{staff}는 안으로 들어갈 수 있는 사람을 결코 만나지 않습니다. 나뭇잎이 문 앞에 남겨진 물에 떨어집니다.'
      desync: 아무도 시를 가지고 다니지 않을 것입니다. 기관에서 {staff}를 다시 호출해도 주소는 여전히 패킷 주위에 있습니다.
      excerpts:
        p2: 그들이 떠나기 전에 그는 해안에 있는 사람들이 다시 한 번 확인할 수 있도록 주소를 넘겨줍니다. 오비디우스는 배 옆쪽으로 고개를 끄덕였습니다.
        p1: 그는 먼저 술을 마시고 조금 후에 페이지를 차지합니다. 그것을 가로지르는 컵의 그림자가 작은 모서리로 축소됩니다.
    relic: 글을 쓰는 밀랍 서판
    relic_desc: 유배로 가는 길에 시작된 시의 편지 서판.
    points:
      p1: 간호사 오비드는 토미스에서 병에 걸렸고 의사도 없고 음식도 없고 물도 마실 수 없습니다.
      p2: 토미스에서 겨울 여행이 어려울 때, 로마로 가는 캐리어로 트리스티아 제3권을 위한 장소를 확보하세요
    points_fail:
      p1: 그는 자신을 달래줄 사람 없이 병들어 누워 있으며, 이 분야에서 토미스에서의 첫 달은 그가 쓴 것만큼 힘들었습니다.
      p2: 이 지점에서는 어떤 운송업체도 패킷을 가져가지 않습니다. 제 시간에 로마에 도착하지 않아 사무실에서 직원을 소환합니다.
    shift:
      p1:
        was: AD 9년경 오비디우스는 토미스(Tomis)에서 병에 걸렸습니다. Tristia III.3에서 그는 의사도 없고, 적합한 음식도 없고, 물도 적응할 수 없다고 썼습니다.
        now: '{staff}는 그에게 깨끗한 물과 그가 보관할 수 있는 음식을 찾아내고 열이 나는 동안 그와 함께 앉아 있습니다. 그는 더 빨리 다시 일어섰습니다.'
      p2:
        was: 서기 9~10년경, 오비디우스는 망명 중에 트리스티아의 세 번째 책을 썼습니다. 책이 로마에 도착하면서 시작되며 이 지역의 겨울 여행의 어려움을 설명합니다.
    vignettes:
      rumor: 당신은 통신사에 지금으로부터 몇 세기 후에도 독자들이 여전히 오류가 무엇인지 물어볼 것이라고 말했습니다. 그는 예비 시트의 빈 공간을 가리키며 거기에 무엇을 넣어야 하는지 묻습니다. 래퍼에 대상을 추가하고 복사본에 공간을 남겨 둡니다. 패킷은 불확실성을 그대로 유지합니다.
      verify: 이동통신사는 추가 이름이 있는 버전을 기억합니다. 당신은 그것이 어느 시트에서 왔는지 확인하도록 요청합니다. 그는 시와 오류를 지적할 수 있으며, 그 구절은 거기서 끝납니다. 당신은 자신의 왁스 타블렛에 그 선을 표시합니다. 패킷이 전달될 때 여전히 이름이 없습니다.
      wrap: 캐리어가 패킷을 향해 손을 뻗는 순간 바람이 외부 시트를 들어 올립니다. 느슨한 시트에 번호를 매기고 순서대로 다시 넣습니다. 왁스 타블렛에는 한 가지 알림이 포함되어 있습니다. 설명할 수 없는 선은 그대로 두십시오. 받는 사람이 무엇을 생각하는지 그리워합니다.
  empedocles_akragas:
    name: 합창이 갈라지는 대목
    place: 아크라가스
    figure: 엠페도클레스
    story: 엠페도클레스의 단편은 사랑과 투쟁과 관련된 네 가지 뿌리와 결합 및 분리의 순환을 설명합니다. 훨씬 후에 Diogenes Laertius는 그의 죽음에 대한 상충되는 이야기를 보존합니다.
    story_prose:
      opening:
        - 아크라가스(Akragas), 기원전 5세기 중반쯤. 그의 시에서 엠페도클레스는 사물이 어떻게 결합되고 다시 분리되는지를 설명하기 위해 네 가지 어근을 사용합니다.
        - 역사상 장시에는 단편과 인용문만이 남아 있습니다. 이 분야에서 복사가는 기꺼이 또 다른 사본을 준비하고 다른 누군가는 기꺼이 그것을 보관하려고 합니다.
        - 한 줄이 다음 줄로 연결되지 않는 부분을 들을 수 있는 사람이 도움이 될 수 있고, 사본이 다시 발견될 수 있음을 확인할 수 있는 사람이 도움이 될 수 있습니다.
      points:
        p1: '{staff}는 처음부터 필사자와 함께 책을 읽고 둘 다 너무 빨리 지나간 장소에 멈춰달라고 요청합니다. 엠페도클레스는 두 줄을 천천히 반복한 다음 다시 읽을 때까지 기다립니다. 다음날 {staff}는 사본을 가져갈 사람과 함께 시작과 끝을 확인합니다. 두 롤은 더 이상 동일한 코드를 공유하지 않습니다. 독자는 따로 묶인 것을 가져다가 첫 줄을 조용히 한 번 말한다.'
      outcomes:
        all: 다른 곳에 보관된 사본은 더 이상 원본과 함께 이동되지 않습니다. 나중에 누군가가 그 라인에 대해 물을 때, 그 키퍼는 롤을 보내지 않고도 라인을 가져올 수 있습니다.
        p1: 독자는 자신이 직접 열 수 있는 곳에 새 사본을 놓습니다. 다른 두루마리는 복사기 테이블 위에 그대로 있습니다.
      none: 첫 번째 줄은 여전히 복사본에 포함되지 않습니다. 하루가 끝나면 독자는 롤백을 원래 위치로 되돌립니다.
      not_admitted: '{staff}는 필사자의 열린 문을 놓칩니다. 벽 너머에서 이전 롤에서 반복되는 한 줄이 나옵니다.'
      excerpts:
        p1: 두 롤은 더 이상 동일한 코드를 공유하지 않습니다. 독자는 따로 묶인 것을 가져다가 첫 줄을 조용히 한 번 말한다.
    relic: 구절의 스크랩
    relic_desc: 상상의 리허설에서 발췌한 부분으로, 절에서 두 번 회전하는 부분이 표시되어 있습니다.
    points:
      p1: 필사자가 On Nature의 사본을 완성하고 확인하도록 돕고 별도로 보관되도록 준비합니다.
    points_fail:
      p1: 역사에서와 마찬가지로 이 분야에서도 후대의 독자들은 인용문과 파피루스 조각을 통해 시의 일부만을 조합할 수 있습니다.
    shift:
      p1:
        was: 엠페도클레스는 기원전 5세기에 자신의 생각을 운문으로 표현했습니다. On Nature는 1999년 스트라스부르 컬렉션에서 출판된 단편을 포함하여 인용문과 파피루스를 통해 부분적으로 살아남았습니다.
        now: 사본은 다른 독자에게 전달되기 전에 시와 비교하여 확인됩니다. 이 분야에서는 완전한 텍스트가 다른 작품에 보존된 발췌문과 함께 남아 있습니다.
        who: empedocles_akragas
        bio: 이 줄에서 엠페도클레스의 자연에 관한 시는 통째로 살아남았고, 이후의 독자들은 그의 네 가지 뿌리인 사랑과 투쟁을 첫 줄부터 마지막 줄까지 따라갈 수 있었습니다.
    vignettes:
      cue: Phaon은 가장 큰 소리만 저장했고 두 리더가 함께 들어옵니다. 감각이 바뀌는 두 곳을 표시합니다. 첫 번째 표시에서 그들은 의자를 함께 끌어 당깁니다. 두 번째에는 각각 한 발 뒤로 물러납니다. 이번에는 문을 바라보는 독자가 시트를 보지 않고도 자신이 어디에 있는지 알 수 있습니다.
      handoff: Eirenē는 두 번째 절에 도달할 수 있지만 계속해서 마지막 절까지 곧바로 점프합니다. Phaon은 혼자 끝내겠다고 제안합니다. 당신은 그녀에게 첫 번째 신호를 받고 그가 방 건너편에서 대답하도록 요청합니다. 저녁 식사가 호출되면 그녀는 리허설을 중간에 떠나는 대신 닫습니다.
      sandal: Phaon은 사람들이 어떤 이야기를 기억할지 묻습니다. 당신은 이후의 에트나 이야기에서 그에게 청동 샌들에 대해 거의 이야기할 뻔했습니다. 그는 내일 연습할 수 있는 대사를 원한다. 당신은 샌들을 빼고 그와 함께 그의 미완성 부분을 한 번 반복합니다. 에이레네를 찾을 때쯤에는 의자가 쌓여있습니다.
  hildegard_bingen:
    name: 소리 내어 부르지 않은 첫머리
    place: 빙엔
    figure: 빙엔의 힐데가르트
    story: 매장 문제로 인해 힐데가르트 공동체에서는 노래 부르기가 중단되었습니다. 그녀가 마인츠에 보낸 편지에는 그녀에게 어떤 위험이 닥쳤는지 기록되어 있습니다. 제한은 1179년 3월에 해제되었습니다. 그녀의 글과 음악으로 구성된 여러 컬렉션은 루퍼츠베르크에 있는 필사자의 작품을 보존하고 있습니다.
    story_prose:
      opening:
        - 12세기 말 빙엔 근처. 힐데가르트의 편지와 음악은 그녀와 함께 복사하고 확인했던 사람들의 흔적을 남기고 살아남습니다.
        - 역사상 매장 문제로 인해 노래가 중단된 적이 있습니다. 이듬해 3월 제한이 해제됐다. 이 가지에서는 오래된 연습용 잎사귀가 첫 번째 단어 바로 위에 거의 공백으로 닳았습니다.
        - 악보나 원고를 아는 사람이 도움을 줄 수 있습니다. 또한 노래를 부르는 사람들이 볼 수 있을 때까지 의심스러운 표시를 열어 두려는 의지가 있는 사람도 필요합니다.
      points:
        p1: '{staff}는 희미한 표시를 아직 채우지 말라고 필사자에게 부탁하고, 오래된 잎과 새 잎을 펴고, 힐데가르트와 노래하는 모습에 익숙한 사람을 따로 둔다. 둘 다 나중 표시를 인식하지만 시작에는 여전히 질문이 필요합니다. 필사자는 합의된 부분을 종이에 적습니다. 첫 번째 단어 위에는 두 줄 사이의 공간보다 더 넓은 공간을 남겨 둡니다.'
      outcomes:
        all: 제한이 끝나면 누군가 예비 리프를 가져와 첫 번째 줄을 확인합니다. 그 틈에 그녀의 손이 멈춘다. 그녀 옆에는 예전 페이지를 아는 사람이 다가온다.
        p1: 다음에 여분의 시트를 열면 어느 위치가 이전 위치에서 복사되었는지, 어떤 질문이 열려 있는지가 여전히 분명합니다.
      none: 예비 페이지가 제자리로 돌아갑니다. 첫 번째 단어 위의 공백은 이전 페이지와 비교하여 확인되지 않았습니다.
      not_admitted: '{staff}는 절대 복사실에 들어가지 않습니다. 누군가 문 옆에 있는 점수판을 닫고 낮은 의자를 다시 그 자리에 놓는다.'
      excerpts:
        p1: 필사자는 합의된 부분을 종이에 적습니다. 첫 번째 단어 위에는 두 줄 사이의 공간보다 더 넓은 공간을 남겨 둡니다.
    relic: 표시가 된 연습 악보
    relic_desc: 열린 부분을 표시하는 실이 있는 발명된 페이지입니다.
    points:
      p1: 방이 조용할 때 힐데가르트와 필사자에게 어떤 손상된 표시를 가져가야 할지, 여분의 전단에 질문을 어디에 남겨야 할지 물어보세요.
    points_fail:
      p1: 예비 잎은 첫 번째 단어 위에 공백을 두고 따로 보관됩니다. 다음 독자는 여전히 이전 페이지에 뭐라고 쓰여 있는지 물어봐야 할 것입니다.
    shift:
      p1:
        was: 힐데가르트의 편지는 노래의 중단을 묘사합니다. Rupertsberg의 복사가는 그녀의 글과 음악을 보존했습니다.
        now: 이 분기에서 {staff}는 복사본 옆에 이전 리프를 유지합니다. 힐데가르트의 필사자는 자신이 명확하게 읽은 표시와 다시 살펴봐야 할 표시를 구분할 수 있습니다.
    vignettes:
      opening: Agnes는 여전히 첫 번째 단어를 찾을 수 있지만 그 위에 있는 손상된 표시를 더 이상 읽을 수 없습니다. 당신은 그녀에게 여분의 페이지를 그녀가 알고 있는 줄과 비교해 보라고 요청합니다. 그녀는 올바른 위치에 실을 설정합니다. 이제 다음 사람이 동일한 시작 부분을 바로 열 수 있습니다.
      wait: Adelheid는 그 말을 기억하고 손상된 시트를 정리하려고 합니다. 아그네스가 다시 한 번 선을 따라갈 수 있는 곳에 그것을 쥐세요. Adelheid는 여는 부분을 여분의 시트에 복사한 다음 이전 페이지를 옆에 보관합니다. 다음 독자는 둘 다 가질 것입니다.
      return: 커뮤니티가 다시 노래할 것이라는 것을 알고 계시지만 Adelheid는 오늘 한 페이지를 치워두었습니다. 당신은 그녀가 목소리를 내지 않고 출발점을 보여주도록 도와줍니다. 문이 닫히면 페이지 사이에 실이 보입니다. 이 방에서 다시 노래가 들리기 전에 당신은 떠나요.
  hua_tuo_xuchang:
    name: 사서에 기록된 책 한 권
    place: 허창
    figure: 화타
    story: 나중에 Sanguozhi는 화타가 Xu에 갇혀 있었고 감옥에서 책을 전달하려는 시도가 실패했다고 말합니다.
    story_prose:
      opening:
        - Xu, 동부한의 끝에. Chen Shou의 역사에는 화타의 투옥이 어떻게 끝났는지 기록되어 있으며 살아남지 못한 책이 언급되어 있습니다.
        - 역사상 골키퍼는 화타가 그에게 제안한 볼륨을 감히 가져가지 못했습니다. 불에 탔습니다. 이 지점에서 누군가는 친구가 그것을 주장할 수 있는지 묻고 누군가는 사면을 청원하는 것을 고려하고 있습니다.
        - 청원서와 기록이 어떻게 직접 전달되는지 이해하는 사람이 도움을 줄 수 있습니다. 책과 청원서는 각각 별도의 요청을 들어줄 사람이 필요합니다.
      points:
        p2: '{staff}는 청원서를 갖고 갈 의향이 있는 사람에게 기다려 달라고 요청한 다음 이름과 사건을 확인합니다. 그것을 받은 후 그는 그들에게 다시 전화를 걸어 사본에 대한 확인 메시지를 씁니다. 며칠 후 화타는 대문을 통해 밖으로 나오다가 사람들이 기다리고 있는 것을 발견합니다. 문 옆에 있는 누군가가 그에게 팔을 내밀었습니다. 그는 그것을 받기 전에 잠시 혼자 서 있습니다.'
        p1: 골키퍼는 화타의 책을 받기 시작했다가 손을 뒤로 당깁니다. {staff}는 누구의 이름이 수신자로 기록될 수 있는지 묻고 화타의 가족 중 한 사람을 데려와 서명합니다. 레지스터가 새 페이지에서 열린 후에야 볼륨이 전달됩니다. 수령인은 포장할 천을 찾을 수 없습니다. 그는 겉옷을 벗어 탁자 위에 펼쳐 놓았습니다.
      outcomes:
        all: 화타가 집에 돌아왔을 때 누군가가 그를 위해 포장된 책을 문 옆에 두고 왔습니다. 그는 그것을 묶는 데 사용된 천의 모서리를 인식합니다.
        p2: 화타를 아는 사람들이 그와 동행한다. 감옥을 통과한 후에야 그들은 첫 번째 모퉁이에서 천천히 방향을 튼다.
        p1: 책은 그것을 가져간 사람의 소유입니다. 천은 여전히 묶여 있으며, 척추가 접힌 부분에 선을 누르고 있습니다.
      none: 골키퍼는 기록부를 닫습니다. 용지가 말리기 시작했습니다. 도서 소유권을 주장하는 사람을 위한 페이지는 비어 있습니다.
      not_admitted: '{staff}는 점원을 보지 못합니다. 창문 아래에는 장소가 닫힐 때까지 책상이 움직이지 않습니다.'
      excerpts:
        p2: 문 옆에 있는 누군가가 그에게 팔을 내밀었습니다. 그는 그것을 받기 전에 잠시 혼자 서 있습니다.
        p1: 수령인은 포장할 천을 찾을 수 없습니다. 그는 겉옷을 벗어 탁자 위에 펼쳐 놓았습니다.
    relic: 진료 기록 사본
    relic_desc: 보고서와 배달을 구별하는 발명된 기록부 리프입니다.
    points:
      p1: 간수가 두려워서 책을 가져가지 못하거든 불을 피하여 책을 가져가라
      p2: 형이 집행되기 전에 화타가 감옥에서 살아날 수 있도록 이를 재고해 줄 수 있는 사람에게 사면을 요청하세요.
    points_fail:
      p1: 간수는 법을 두려워하여 받아들이지 않았고, 화타는 그 책을 불태웠습니다. 이 가지에는 아무것도 남지 않았습니다.
      p2: 그는 역사상과 마찬가지로 서(徐) 감옥에서 처형당했습니다. 이 분야에서 그는 다른 환자를 치료한 적이 없습니다.
    shift:
      p1:
        was: 208년경, 삼국지(Sanguozhi)는 간수가 화타가 그에게 제공한 책을 거부했고 화타가 그것을 불태웠다고 기록합니다.
        now: 그 책은 감옥에서 누군가에게 맡겨졌고, 분실되기 전에 복사되었습니다.
      p2:
        was: 208년경 삼국지(Sanguozhi)는 사면을 요청했지만 화타(화타)가 처형되었다고 기록합니다.
        now: 이 부분에서는 탄원이 다시 들리고 순서가 변경됩니다. 화타는 살아서 Xu 감옥을 떠납니다.
        who: hua_tuo_xuchang
        bio: 이 지점에서 화타는 살아남아 Xu의 감옥을 살아서 떠납니다.
    vignettes:
      notice: 아진이 책이 있다는 소식을 듣고 받은 아이템 아래에 적어 두었습니다. 당신은 그녀에게 그것이 갈 선반을 만져보라고 요청합니다. 그녀는 그 줄을 보고서 열로 옮기고, 선반의 공간을 비워두고 그 옆에 보고서의 출처를 남겨 둡니다.
      shift: 아창은 다음 키퍼를 부르기 전에 책을 닫고 싶어한다. 당신은 그에게 항목을 큰 소리로 한 번 읽어달라고 요청합니다. 그가 목격하지 않은 배달에 도달하면 그들은 그 줄을 기다리게 하는 데 동의합니다. 다음 키퍼는 아직 확인되지 않은 내용을 볼 수 있습니다.
      later: 역사가는 책에 관한 이야기를 할 것입니다. 아진은 이 방을 통해 진짜 볼륨이 들어왔는지 알고 싶어한다. 배달 확인이 어디에 기록되는지 보여줍니다. 페이지는 그 자리를 아직 열어둔 채 그녀의 책상을 떠난다.
  miyazawa_kenji_hanamaki:
    name: 읽어 본 사람이 드문 이야기들
    place: 하나마키
    figure: 미야자와 겐지
    story: Miyazawa는 여러 초안에서 은하 철도의 밤을 수정했습니다. 원고 기반 텍스트에서 Giovanni는 마차에 타기 전에 역 호출을 듣습니다.
    story_prose:
      opening:
        - 하나마키, 1933년. 미야자와 겐지는 학교에서 가르치고 농부들에게 비료에 관해 조언했습니다. 그가 어린이를 위해 쓴 이야기 중 일부는 아직도 개정되고 있습니다.
        - 역사상 그는 9월에 병에 걸려 사망했다. 은하 철도의 밤은 여러 초안에서 살아남습니다. 이 지점에서는 근처 농장의 방문객과 페이지를 보고 싶은 사람들 모두 그가 말할 힘이 생길 때까지 기다려야 합니다.
        - 농부의 질문에 답할 수 있는 사람과 질문을 중단해야 할 때를 아는 사람이 도움을 줄 수 있습니다. 누군가는 미야자와가 아플 때 그를 돌볼 수 있는 적절한 장비도 가져와야 합니다.
      points:
        p3: 9월 20일, 문 앞에 있던 누군가가 그가 계속 앉아 있을 수 없었다고 말했습니다. {staff}는 장비와 함께 제공되며 도움을 요청하고 가족이 머물게 합니다. 얼마 후 미야자와는 누군가가 가져온 물에 손을 뻗어 스스로 물을 가져갑니다. 누군가가 너무 멀리 서 있던 의자를 끌고 옵니다. 그는 빈 컵을 돌려주고, 놓을 때까지 기다렸다가 베개에 몸을 기댔다.
        p2: '{staff}는 그에게 초안을 별도로 전달하고 그가 인식하는 순서에 대해서만 묻습니다. 그는 한 페이지의 마지막 페이지에서 잠시 멈추고 두 줄 사이에서 손가락을 움직입니다. 그는 두 개의 잎을 선택하여 그 위에 쌓습니다. 오직 그만이 그 느슨한 페이지들 중 어느 쪽을 먼저 읽어야 할지 알고 있었습니다.'
        p1: 문 앞에서 {staff}는 각 농부에게 무엇이 재배되고 있는지, 정확히 무엇을 알아야 하는지 물어본 다음 비슷한 질문을 한 장에 담아 가져옵니다. 한 밭의 크기를 아는 사람은 아무도 없기 때문에 그 주인은 자신이 적어 놓은 메모를 가지러 집으로 갑니다. 미야자와는 첫 번째 사람에게 앉으라고 한 뒤 문제지를 테이블 위에 올려놓았다. 컵은 한쪽 모서리를 잡아주므로 손을 계속 대지 않아도 됩니다.
      outcomes:
        all: 농부들은 새로운 질문을 가지고 돌아올 것입니다. 초안과 메모는 테이블 반대편에 놓이고, 미야자와는 문 앞에 있는 방문객을 위한 의자를 찾습니다.
        p3: 그 후 그의 가족은 컵을 씻어 그가 묻지 않고도 가져갈 수 있는 곳에 다시 놓는다.
        p2: 나중에 초안을 읽어보면 처음 두 장의 잎이 그가 준 순서대로 그대로 놓여 있습니다.
        p1: 마지막으로 가는 농부는 질문지를 4등분으로 접은 다음 밖에서 기다리는 사람들에게 보여줍니다.
      none: 9월까지 원고는 여전히 별도의 더미에 있습니다. 방문객을 위해 준비된 의자는 창가에 비어 있습니다.
      not_admitted: '{staff}는 절대 안으로 들어가지 않습니다. 문 옆에 있는 누군가가 농부들의 서류를 모아 비를 맞지 않게 가져옵니다.'
      desync: 농부들은 물어볼 시간이 없습니다. 에이전시가 {staff}를 회상했을 때 첫 번째 방문자는 여전히 질문을 손에 쥐고 있습니다.
      excerpts:
        p3: 누군가가 너무 멀리 서 있던 의자를 끌고 옵니다. 그는 빈 컵을 돌려주고, 놓을 때까지 기다렸다가 베개에 몸을 기댔다.
        p2: 그는 두 개의 잎을 선택하여 그 위에 쌓습니다. 오직 그만이 그 느슨한 페이지들 중 어느 쪽을 먼저 읽어야 할지 알고 있었습니다.
        p1: 미야자와는 첫 번째 사람에게 앉으라고 한 뒤 문제지를 테이블 위에 올려놓았다. 컵은 한쪽 모서리를 잡아주므로 손을 계속 대지 않아도 됩니다.
