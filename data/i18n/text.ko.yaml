  hertz_bonn:
    name: 마지막 학기
    place: 본
    figure: 하인리히 헤르츠
    story: 1892년 초부터 Hertz는 코와 목의 고통스러운 질병으로 계속해서 고통을 겪었으며 때로는 너무 심해서 일을 할 수도 없었습니다. 1893년에 그는 여러 수술을 받는 동안 다시 본에서 강의를 하고 역학 원리를 완성했습니다. 그는 1894년 1월 1일 36세의 나이로 본에서 사망했습니다. 그 책은 그의 죽음 이후에 나왔다.
    story_prose:
      opening:
        - 본 강의 일정은 이미 잡혀있습니다. Hertz는 한 손에 수업 노트를 들고 역학 원리에서 확인하고 싶은 몇 줄을 들고 있습니다. 그는 젊은 동료에게 몇 명의 학생들이 질문을 기다리고 있는지 묻습니다.
        - 헤르츠는 그의 마지막 투병 중에 원리를 연구했고, 1893년 12월에 원고를 보냈고 1월 1일에 사망했습니다. 동료가 한 번의 강의를 듣고 Hertz가 시간을 어떻게 보낼지 결정하도록 할 수 있습니다.
        - 수업이 어떻게 진행되는지 아는 사람이 학생들의 질문을 수집하는 데 도움을 줄 수 있습니다. 답변을 제공할 수 있는 동료가 있더라도 Hertz가 어떤 수업을 맡길지 결정하도록 하세요.
      points:
        p1: 동료는 두 가지 일정을 제시하고 학생들이 이미 어떤 질문을 했는지 안다면 나중에 수업을 들을 수 있다고 말했습니다. Hertz에게 강의를 선택하고 답변이 필요한 두 장소를 표시하게 합니다. 동료는 일정을 가지고 떠나기 전에 자신이 어느 방에 있을 것인지 말해줍니다. Hertz는 강의 노트에서 전표를 가져와 확인하고 싶은 기계학 서적의 페이지에 클립합니다.
      outcomes:
        all: 학생들은 동료의 강의에 질문을 가지고 왔습니다. 원고는 예정대로 출판되었고 Hertz는 설날에 사망했습니다.
        p1: 동료가 수업을 듣습니다. Hertz는 원고의 표시를 보기 전에 얻은 시간 동안 휴식을 취합니다.
      none: 일정은 Hertz의 손에 달려 있습니다. 그는 아직 확인할 몇 줄을 남기고 원고를 닫습니다.
      not_admitted: 강의 전에 당신을 만나기로 약속한 사람은 아무도 없습니다. 학생들은 강당에서 잠시 기다렸다가 시간표가 붙어 있는 건물로 돌아갑니다.
      excerpts:
        p1: 동료는 일정을 가지고 떠나기 전에 자신이 어느 방에 있을 것인지 말해줍니다. Hertz는 강의 노트에서 전표를 가져와 확인하고 싶은 기계학 서적의 페이지에 클립합니다.
    relic: 접힌 강의 시트
    relic_desc: 한 강의를 표시한 발명된 시간표입니다.
    points:
      p1: 동료에게 어떤 강의를 맡길 것인지 Hertz에게 물어보고 그날 누군가가 질문을 받도록 주선하십시오.
    points_fail:
      p1: 강의는 그의 일정대로 진행된다. 그는 나중을 위해 원고에 대한 작업을 저장해야 합니다.
    shift:
      p1:
        was: 헤르츠는 1893년 병 중에도 본에서 계속 가르쳤고 죽기 전에 역학 원리를 마쳤습니다.
        now: 이 분야에서 Hertz는 동료에게 한 강의를 맡게 합니다. 그는 휴식 시간을 갖고 원고를 보내기 전에 수정 사항을 지시합니다.
    vignettes:
      repeat: '{staff}는 두 가지 질문을 동료에게 다시 읽어줍니다. 그는 Hertz의 원고를 열지 않고도 답할 수 있는 것을 표시했습니다.'
      signal: 학생이 엉뚱한 교실 밖에서 기다리고 있습니다. {staff}는 대체자가 일정에 작성한 방을 가리킵니다.
      gap: '{staff}는 강사의 답변을 빈 줄로 남겨두고 다음 학생이 찾을 수 있는 시트를 설정합니다.'
  bizet_paris:
    name: 《카르멘》의 해
    place: 파리
    figure: 조르주 비제
    story: 카르멘은 오랜 리허설 기간을 거쳐 1875년 3월 3일 오페라 코미크에서 개장했습니다. 인쇄기가 혼합되었고 생산은 봄까지 계속되었습니다. 6월 3일 비제는 부지발에서 36세의 나이로 사망했습니다.
    story_prose:
      opening:
        - 오페라코미크는 마지막 리허설이 하나 남았습니다. 합창단은 정시에 입장하지만 무대를 넘어가면 두 번째 줄이 지연됩니다. 피아노 앞에 있는 누군가가 오케스트라가 혼자만의 시간을 원하는지, 아니면 무대 위에서 다시 시작해야 하는지 묻습니다.
        - 카르멘은 1875년 3월 3일 파리에서 초연되었습니다. 비제는 그해 6월에 사망했습니다. 출연진과 오케스트라에게 다시 한 번 함께 연주를 제공하고 나중에 가수가 리허설하고 싶은 정확한 섹션을 Bizet에 전달할 수 있습니다.
        - 양쪽으로 입구를 셀 수 있는 사람을 이용하세요. 공연이 끝난 후 누군가는 해당 섹션의 번호와 첫 번째 단어로 가수의 고민을 적어볼 수 있습니다.
      points:
        p1: 오케스트라는 잘못 들었던 바에서 시작하고 싶어합니다. 당신은 합창단에게 첫 번째 위치로 돌아가서 합창단이 하나로 노래하기 전에 있어야 할 위치를 지휘자에게 보여달라고 요청합니다. 한 번 멈춘 후 후렴을 가져오는 단어부터 모두가 시작합니다. 두 번째 시도에서 박자가 맞자 무대 문 곁의 사람이 계속하라는 손짓을 보냅니다.
        p2: 공연이 끝난 후 누군가가 전표에 '입장 곤란'이라고 적었다. 당신은 그녀에게 이전 대사를 불러달라고 요청하고 다른 가수에게 그 노래를 듣는 시간을 알려달라고 합니다. 비제는 누구의 요청인지 확인하고 그날 밤 사용한 악보에 전표를 밀어 넣습니다. 그 대목을 물어본 가수가 다음에도 찾을 수 있도록 첫 구절을 눈에 띄게 남겨 둡니다.
      outcomes:
        all: 개막은 3월 3일이다. 비제는 그 구절을 식별하는 메모를 받았으며 기록에는 여전히 6월에 그의 죽음이 기록되어 있습니다.
        p1: 시간에 맞춰 커튼이 올라갑니다. 출연자들은 나중에 짧은 쪽지를 보내는데, 비제는 여전히 그것이 어느 부분에 관한 것인지 물어봐야 한다.
        p2: Bizet은 전표를 받고 악보에서 첫 번째 단어를 찾을 수 있습니다. 초연은 싱크가 안맞았고, 여행기록에는 인계만 남아있습니다.
      none: 두 개의 표시가 점수에서 동일하게 보입니다. 떠나는 사람들은 어느 쪽이 합창단을 불러오는지 여전히 동의할 수 없습니다.
      not_admitted: 무대 문에 있는 사람은 결코 당신의 이름을 찾지 못합니다. 당신은 입구에서 멀리 서서 가수들이 다시 몇 박자를 세는 것을 듣습니다.
      desync: 리허설이 중단되고 3월 3일 초연이 시작되지 않습니다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 한 번 멈춘 후 후렴을 가져오는 단어부터 모두가 시작합니다. 두 번째 시도에서 박자가 맞자 무대 문 곁의 사람이 계속하라는 손짓을 보냅니다.
        p2: 비제는 누구의 요청인지 확인하고 그날 밤 사용한 악보에 전표를 밀어 넣습니다. 그 대목을 물어본 가수가 다음에도 찾을 수 있도록 첫 구절을 눈에 띄게 남겨 둡니다.
    relic: 종이 부채
    relic_desc: 객석에 있던 그림이 그려진 종이 부채.
    points:
      p1: 극장에서 가수들이 악장 및 오케스트라와 함께 어려운 작품을 연습할 수 있도록 최종 공연을 준비할 수 있도록 도와주세요.
      p2: 가수들이 여전히 다루고 싶어하는 정확한 부분이 포함된 저녁 공연 보고서를 Bizet에게 가져가세요.
    points_fail:
      p1: 리허설과 극장은 3월 3일에 막을 올릴 수 없습니다. 지점의 동기화가 어긋나고 사무실에서 해당 직원을 소환합니다.
      p2: 해당 메모는 해당 구절이 생략된 상태로 비제에게 전달됩니다. 그는 가수들이 어느 부분을 연습하고 싶어하는지 듣지 못한 채 문제가 있다는 것을 알게 된다.
    shift:
      p1:
        was: 오페라 코미크의 무대 등록부에는 카르멘이 개장한 1875년 3월 3일의 리허설과 무대 준비가 기록되어 있습니다.
      p2:
        was: <카르멘>의 첫 공연은 3월 초연 이후에도 계속됐다.
        now: 이 분기에서 {staff}는 Bizet에게 사용할 수 있는 보고서를 제공합니다. 그는 악보에 항목을 표시하고 다음 공연 전에 가수들과 이에 대해 논의할 수 있습니다.
    vignettes:
      future: 당신은 수행원에게 나중에 그가 한 번도 가본 적이 없는 도시에서 이 오페라를 알게 될 것이라고 말했습니다. 그는 왜 오늘 밤에 추가 프로그램을 진행해야 하는지 묻습니다. 당신은 그에게 첫날 밤과 Galli-Marié의 이름이 인쇄된 곳을 보여줍니다. 한 권이 그의 서랍에 들어갑니다. 두 번째 독자가 오기 전에 떠나세요.
      label: 교환원은 동일한 제목으로 두 장의 서류를 제출했습니다. 날짜별로 나누고 여분의 포장지에 첫날 밤을 표시합니다. 나중에 독자가 이제 올바른 시트를 요청할 수 있습니다. 나오는 관객이 그리워요.
      seat: 늦게 찾아온 방문객에게 프로그램을 빌려주고 방문객이 자리를 찾은 후 문앞으로 돌려드립니다. 하나의 이름을 자신의 전표에 복사합니다. 그때쯤이면 내부의 음악이 계속해서 흘러나왔습니다.
  artemisia_florence:
    name: 아카데미 최초의 여성
    place: 피렌체
    figure: 아르테미시아 젠틸레스키
    story: 아르테미시아 젠틸레스키(아르테미시아 젠틸레스키)는 1616년 피렌체 드로잉 예술 아카데미에 입학한 최초의 여성이 되었습니다. 그녀의 피렌체 시절에는 현재 류트 연주자로서의 자화상(Self-Portrait as a Lute Player)으로 알려진 작품도 포함되어 있습니다.
    story_prose:
      opening:
        - 피렌체에 있는 가게에는 두 개의 장부가 열려 있습니다. 한쪽에는 안료가 들어가고, 다른 한쪽에는 학원비 전표가 들어있습니다. 아르테미시아는 점원에게 영수증을 따로 보관하고 7월에 영수증을 받을 수 있는 날을 알려달라고 요청합니다.
        - 피렌체 드로잉 아카데미는 1616년 7월 19일에 아르테미시아를 입학시켰습니다. 그녀는 또한 의뢰 작업을 하고 있었습니다. 이 지점에서 당신은 입장료를 받고 그녀가 다음 그림 계약에서 미리 날짜를 확보하도록 도울 수 있습니다.
        - 계좌에 능숙한 사람이 학원납부내역을 확인할 수 있습니다. 서면으로 구두 합의를 할 수 있는 사람은 내담자가 원하는 날짜를 묻는 데 도움을 줄 수 있습니다.
      points:
        p1: 사무원은 정산이 필요한 안료 청구서 사이에 학원 전표를 제출했습니다. 아르테미시아에게 어떤 결제를 먼저 해야 하는지 물어보고, 입장 날짜 옆에 수령인 이름을 확인합니다. 점원은 영수증을 꺼내 그녀에게 사본을 남겨준다. 그녀는 카운터에서 자신의 이름이 적힌 전표를 꺼냅니다.
        p2: 마지막 지불금이 들어오면 고객은 다음 그림을 언제 시작할 수 있는지 묻습니다. 아르테미시아는 자신의 색소 부리를 밀어내고 그가 큰 소리로 읽어주는 동안 기다립니다. 당신은 사무원에게 작업 시작 전에 지불해야 할 선지급 금액을 기록하고 각 사람에게 사본을 하나씩 나누어 달라고 요청합니다. 그녀는 안료를 사러 갈 때 언제 돈을 인출할 수 있는지 알려주는 종이를 가져간다.
      outcomes:
        all: 아카데미는 수수료를 받습니다. 이제 다음 계약에서는 선지급 날짜를 지정합니다. Artemisia는 안료 비용을 지불하고 첫 번째 캔버스를 늘립니다.
        p1: Artemisia는 역사적인 날짜에 인정됩니다. 그녀가 다음에 물품을 주문하고 싶을 때에도 후원자에게 돈을 요청해야 합니다.
        p2: 사전에 다음 계약에 들어갑니다. 학원비가 늦어지고, 여행은 그림에 대한 협상만 보존한다.
      none: 두 가지 비용에 대한 영수증은 여전히 같은 더미에 있습니다. 가게 주인은 어느 것을 먼저 지불해야 하는지 다시 한 번 묻습니다.
      not_admitted: 점원은 그가 기대하는 사람들을 위한 좌석을 가지고 있습니다. 당신은 밖에 머물면서 누군가가 안료 청구서 사이에 학원 전표를 정리하는 것을 지켜봅니다.
      desync: 당일에는 요금을 지불하지 않습니다. 등록이 동기화되지 않고 사무실에서 여행자를 회수합니다.
      excerpts:
        p1: 점원은 영수증을 꺼내 그녀에게 사본을 남겨준다. 그녀는 카운터에서 자신의 이름이 적힌 전표를 꺼냅니다.
        p2: 당신은 사무원에게 작업 시작 전에 지불해야 할 선지급 금액을 기록하고 각 사람에게 사본을 하나씩 나누어 달라고 요청합니다. 그녀는 안료를 사러 갈 때 언제 돈을 인출할 수 있는지 알려주는 종이를 가져간다.
    relic: 안료병
    relic_desc: 청금석을 갈아 만든 작은 병.
    points:
      p1: 아르테미시아가 7월 19일 입학에 맞춰 아카데미 비용을 마련할 수 있도록 도와주세요.
      p2: 첫 번째 커미션이 확정되면 아르테미시아가 그림을 그리기 전에 재료를 구입할 수 있도록 다음 계약에서 미리 날짜를 확보할 수 있도록 도와주세요.
    points_fail:
      p1: Artemisia는 본 지점에서 당일 요금을 지불할 수 없습니다. 그녀의 등록이 동기화되지 않아 사무실에서 해당 직원을 소환합니다.
      p2: 8월 잔액은 기록된 대로 지불되지만 아르테미시아는 또 다른 커미션을 위해 물품을 구입해야 할 때 여전히 돈을 요구해야 합니다.
    shift:
      p1:
        was: 1616년 7월 19일, 피렌체의 미술 아카데미에 아르테미시아 젠틸레스키가 입학했습니다.
      p2:
        was: 1615~16년에 부오나로티 수수료는 분할 지급되었습니다. 아카이브에는 아르테미시아가 작업하는 동안 돈을 요청한 내용이 보존되어 있습니다.
        now: 다음 커미션에서는 작업이 시작되기 전 자재 진행 날짜를 정합니다. Artemisia는 합의된 지불금에 대해 안료를 주문할 수 있습니다.
        who: artemisia_florence
        bio: 그녀는 미켈란젤로 부오나로티(Michelangelo Buonarroti)의 집에 성향의 우화를 그렸는데, 이 집은 장식의 일부로 남아 있습니다. 또한 입학 허가를 통해 그녀는 무역으로 인해 발생하는 분쟁에 대해 아카데미 재판소에 접근할 수 있었습니다.
    vignettes:
      pose: 방문자는 거울을 향해 돌아서서 어떤 포즈가 더 자연스러워 보이는지 묻습니다. 당신은 각 포즈가 무엇을 하고 있는지 묻습니다. 그들은 손이 그 자체의 목적을 유지할 수 있도록 하는 것을 선택합니다.
      name: 연습 시트에는 시터의 설명이 있지만 화가의 이름을 입력할 곳은 없습니다. 당신은 그것을 뒤집어 시트를 쌓기 전에 방문자에게 두 시트를 모두 내려놓으라고 요청합니다.
      mirror: 방문자가 비틀지 않고 각도를 볼 수 있을 때까지 거울을 움직입니다. 포즈를 한 번 시도한 다음 그림을 그리기 전에 스스로 약간의 변화를 줍니다.
  buchner_zurich:
    name: 연습실 탁자 위의 두 초고
    place: 취리히
    figure: 게오르크 뷔히너
    story: 1836년 게오르크 뷔히너(게오르크 뷔히너)는 난민으로 취리히에 와서 대학에서 강의를 시작했습니다. 그는 1837년 2월에 중병에 걸렸습니다. 그의 약혼자 Minna Jaeglé가 스트라스부르에서 왔고 마지막 날 그에게 다가갔습니다. 그는 2월 19일 23세의 나이로 세상을 떠났고, 보이체크는 미완성으로 남았습니다.
    story_prose:
      opening:
        - 취리히에서는 누군가가 같은 캐릭터의 이름을 포함하고 있다는 이유로 두 개의 초안을 테이블 위에 따로 놓아두었습니다. Büchner는 다른 방에서 편지를 쓰는 데 사용할 수 있는 시트를 요청합니다. 아직 힘이 남아 있는 동안 그는 민나에게 스트라스부르에서 오라고 부탁하고 싶어한다.
        - 1837년 2월 뷔히너는 취리히에서 심한 병에 걸렸습니다. 민나는 병이 있어서 늦게 도착했고 그는 그곳에서 죽었습니다. Woyzeck은 여러 개의 미완성 초안에서 살아남았습니다. 그의 메시지를 더 빨리 보내고 사무실의 가상 의료 키트를 가져와 그의 치료에 도움을 줄 수 있습니다.
        - Büchner 자신이 말하고 싶은 내용을 알아보려면 택배를 보내십시오. 그의 침대 곁에는 이미 그곳에 있는 사람들과 확인 후 간병 경험이 있는 사람과 키트를 사용하십시오.
      points:
        p1: 메신저는 미완성 편지라고 생각하며 흩어진 페이지를 들어 올립니다. 당신은 Büchner에게 새 시트에 글을 적는 사람에게 자신의 말을 전해달라고 요청합니다. 주소가 확인되면 메신저는 테이블 위의 플레이를 떠나 새 페이지를 가져옵니다. 그가 그것을 받아들일 때 Büchner는 그가 Minna의 이름 전체를 발음하는 것을 듣습니다.
        p2: Büchner가 그만하라고 요청할 때까지 집에 있는 누군가가 제목을 큰 소리로 읽고 있습니다. 당신은 사무용품에 대해 설명하고 그의 간병인을 침대 옆에 머물게 합니다. 잠시 후 뷔히너는 눈을 뜨고 두 더미 중 더 얇은 더미를 가리킵니다. 도우미가 가까이 가져옵니다. 이번에는 Büchner가 페이지를 골라줄 사람이 필요하지 않습니다.
      outcomes:
        all: Minna는 Büchner가 자신이 말하고 싶은 것을 그녀에게 말할 시간에 맞춰 취리히에 도착합니다. 열이 올라갑니다. 책상 위의 두 더미는 여전히 정리를 기다리고 있습니다.
        p1: 편지는 Minna가 직접 말할 수 있을 만큼 빨리 전달됩니다. 그의 병은 계속되었고 그는 취리히에서 사망했습니다.
        p2: Büchner는 열이 나고 초안을 요청합니다. 민나에게 보낸 이전 메시지는 아직 제 시간에 맞춰 전달되지 않았습니다.
      none: 편지와 작업 서류는 함께 열려 있습니다. Minna는 거의 끝날 무렵에 도착하고 취리히에서 사망합니다.
      not_admitted: 실내에 있는 사람들은 방문객에게 방해받지 않고 기다리라고 요청합니다. 편지지에는 아직 주소가 없습니다.
      excerpts:
        p1: 주소가 확인되면 메신저는 테이블 위의 플레이를 떠나 새 페이지를 가져옵니다. 그가 그것을 받아들일 때 Büchner는 그가 Minna의 이름 전체를 발음하는 것을 듣습니다.
        p2: 도우미가 가까이 가져옵니다. 이번에는 Büchner가 페이지를 골라줄 사람이 필요하지 않습니다.
    relic: 장면 묶음
    relic_desc: 정해진 순서 없이 비좁은 손 안의 느슨한 장면들.
    points:
      p1: Büchner가 Minna에게 직접 오라고 요청할 수 있는 동안 스트라스부르로 메시지를 받으세요.
      p2: 사무실의 의료 키트를 침대 옆으로 가져와 열이 나는 동안 그를 돌보는 사람들을 도우십시오.
