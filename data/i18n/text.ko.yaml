    relic: 노래 원고
    relic_desc: 아직 잉크가 어두운 상태에서 빠른 손으로 부르는 노래.
    points:
      p1: 같은 날 저녁 자원봉사자들과 학회 홀을 초대하여 슈베르트 자신의 연주회를 보호하세요
      p2: 슈베르트가 마지막 세 소나타에 대한 출판과 헌정을 확정할 수 있는 동안 문의를 합의로 전환하세요.
      p3: 그가 형 페르디난드의 집으로 이사하기 전에 그가 수년 동안 앓아온 병을 치료하여 그해 가을을 살아갈 수 있게 해주세요.
    points_fail:
      p1: 선수와 이용 가능한 홀은 다른 날에 예약됩니다. 친구들의 콘서트가 취소되고, 사무실에서는 싱크가 두절된 직원을 소환한다.
      p2: 문의하신 내용은 답변을 기다리고 있습니다. 소나타는 그가 죽은 지 몇 년 후에 다른 헌신으로 나타납니다.
      p3: 역사상과 마찬가지로 그는 9월에 아직 병든 형의 병실로 이사했고 11월 19일 그곳에서 사망했습니다.
    shift:
      p1:
        was: 1828년 3월 26일 슈베르트는 친구들과 연주자들의 도움을 받아 자신의 음악으로 비엔나 콘서트를 열었습니다.
      p2:
        was: 1828년 10월 2일 슈베르트는 마지막 3개의 소나타를 제출하고 헌정 대상자를 지명했습니다. 이 책은 1839년에 처음 출판되었습니다.
        now: '{staff}는 세 가지 점수를 모두 받고 헌신을 함께 보내 서면 확인을 요청합니다. 슈베르트는 살아있는 동안 그것을 받았으며 헌신은 음악과 함께 남아 있습니다.'
      p3:
        was: '1828년 9월: 이미 병이 난 슈베르트는 비에덴(Wieden)에 있는 새 집에 있는 형 페르디난트의 아파트로 이사했고, 11월 19일 서른한 살의 나이로 그곳에서 사망했습니다.'
        now: '{staff}가 가져온 약이 그를 치료했습니다. 그는 그해 11월에 병에 걸리지 않았고 수년 동안 비엔나에서 살면서 음악을 작곡했습니다. 그가 쓴 내용은 이번 여행 기록에는 없다.'
        who: schubert_vienna
        bio: 이 연대표에서 슈베르트는 가을에 치료를 받았고, 그는 서른한 살이었고, 수년 동안 살았으며 비엔나에서 계속 작곡을 했습니다.
    vignettes:
      chairs: 3월 25일 저녁, {staff}는 사회의 포터가 이름이 떨어지기 전에 의자가 다 떨어질 때까지 홀에 한 줄씩 의자를 놓는 것을 돕습니다. 그는 아직 죽지 않은 남자를 위해 이렇게 많은 사람들이 한 방에 앉아 싶어 하는 것을 본 적이 없다고 말합니다.
      tavern: 7월의 어느 날 저녁, {staff}는 바이올린 연주자와 기타 연주자가 왈츠를 추는 동안 성벽 밖의 와인 정원에 앉아 있습니다. 바이올린 연주자는 두 사람 사이에 멈춰서서 이 열기 때문에 두 번째 절에서 현이 멈췄으며 유일한 치료법은 더 빨리 연주하는 것이라고 말했습니다.
      stairs: 9월 초 {staff}는 Wieden에 있는 새 집의 주인 아주머니가 바구니를 계단 위로 옮기는 것을 도와줍니다. 회반죽에서는 여전히 석회 냄새가 나고, 그녀는 계단통이 너무 새 것이라 대답을 해준다고 말했습니다. 1층에서 한 마디 하면 3층에서는 그 소리가 두 번 들립니다.
  keats_rome:
    name: 계단 곁의 작은 방
    place: 로마
    figure: 존 키츠
    story: 1820년 11월 결핵에 걸린 존 키츠(존 키츠)는 화가 조셉 세번(Joseph Severn)과 함께 로마로 와서 스페인 계단 옆 26 Piazza di Spagna에 방을 잡았습니다. 그는 1821년 2월 23일 밤 그곳에서 죽었고 2월 26일 케스티우스 피라미드 옆 묘지에 묻혔습니다. 그의 뜻에 따라 그의 묘비에는 그의 이름이 나오지 않습니다.
    story_prose:
      opening:
        - 1820년 11월 중순, 로마. 결핵을 앓고 있는 25세의 시인 존 키츠가 스페인 계단 기슭에 있는 스페인 광장 26번지 2층에서 화가 조셉 세번과 함께 방을 쓰고 있습니다. 몇 년 만에 그는 주요 시와 송가를 썼고, 이번이 그의 마지막 겨울이다.
        - 역사상 제임스 클라크(James Clark) 의사는 그에게 하루에 멸치 한 마리와 빵 한 조각씩 단식을 시키고 계속해서 피를 흘렸습니다. Severn은 그를 혼자 돌보았고 돈은 곧 중단되었고 밤은 잠도 자지 못했습니다. 끝까지 그는 자신이 아무것도 남기지 않았다고 믿었고 그의 소원에 따라 그의 묘비에는 이름이 없습니다. 이 지점에서는 꽃 파는 사람이 계단 아래에서 제비꽃을 팔고, 계단에 있는 이웃이 아픈 하숙인의 안부를 묻는 경우가 자주 있습니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 약을 알고 출혈을 멈출 수 있는 사람 또는 현대적인 진료 안내서를 가진 사람; 긴 밤을 지켜보며 버틸 수 있는 사람, 또는 수면 조절 장치가 있는 사람; 시를 잘 아는 사람, 그의 시가 어떻게 될 것인지 말해 줄 수 있는 사람.
      outcomes:
        all: 2월 23일 말, Keats가 사망했고 Severn은 침대 곁에 있었습니다. 그 마지막 몇 달 동안 그는 뜨거운 수프와 빵을 먹을 수 있었고 누군가가 그의 시가 계속 읽힐 것이라고 말하는 것을 들었습니다. 3일 후 그는 케스티우스의 피라미드 옆 묘지에 묻혔고, 그의 뜻에 따라 돌에는 이름이 붙지 않았습니다.
        p3: 2월 26일에 그는 케스티우스의 피라미드 옆 묘지에 묻혔고, 그의 뜻에 따라 돌에는 이름이 붙지 않았습니다. 스페인 계단 옆 방은 그대로 유지되었으며, 그 창문에서는 여전히 광장이 보입니다.
        p2: 지난 몇 달 동안 식탁에는 멸치 한 마리와 빵 한 조각보다 더 많은 것이 있었습니다. 1821년 2월 26일 그는 케스티우스의 피라미드 옆 묘지에 묻혔다.
        p1: 2월 23일 말, Keats가 사망했고 Severn은 끝까지 침대 옆에 있었습니다. 50년 이상이 지난 후 Severn은 Keats 옆에 있는 같은 묘지에 묻혔습니다.
      none: 1월에 세번은 지쳐서 옆방에서 쓰러졌습니다. 2월 23일 늦은 시각에도 빵 조각과 멸치는 여전히 테이블 위에 있었고, 침대 옆 의자는 비어 있었습니다.
      desync: 1월에 Severn은 무너졌습니다. {staff}가 소환되었을 때 그는 옷을 입은 채 옆방에 누워 있었고, 반쯤 쓴 편지는 여전히 테이블 위에 열려 있고 잉크병은 마개도 열려 있지 않았습니다.
      not_admitted: '{staff}는 집에 들어가지 않았고, 계단 밑에 있는 배 모양의 분수대에서 물을 몇 번만 긷고만 있었습니다. 꽃 파는 사람이 위층에 누가 아픈지 물었을 때 {staff}는 대답이 없었고 2층 창문은 닫혀 있었습니다.'
      points:
        p2:
          class_medical: 12월 9일 아침, 키츠는 두 컵의 피를 토했습니다. Clark 박사가 와서 소매를 걷어붙이고 8온스를 더 가져가겠다고 말했습니다. 식탁 위에는 그날의 식량, 멸치 한 마리와 빵 한 조각이 놓여 있었다. 의술을 아는 {staff}는 환자의 손목을 붙잡고 이렇게 피가 나는 것을 참을 수 없다며 지난 며칠간 먹은 것을 모두 의사에게 진찰했고 의사는 채혈침을 치워버렸다. 정오가 되자 세번은 뜨거운 수프 한 그릇과 빵 한 조각을 가져왔습니다. 키츠는 베개에 기대어 앉아 한 숟가락씩 비우고 그에게 빈 그릇을 돌려주었습니다.
          else: 12월 9일 아침, 키츠는 두 컵의 피를 토했습니다. Clark 박사가 와서 소매를 걷어붙이고 8온스를 더 가져가겠다고 말했습니다. 식탁 위에는 그날의 식량, 멸치 한 마리와 빵 한 조각이 놓여 있었다. {staff}는 가져온 현대식 진료 수첩을 펴서 그 내용을 의사에게 큰 소리로 읽어 주고, 환자가 지난 며칠 동안 먹은 모든 것을 적어 환자 앞에 놓아 주자 의사는 채혈침을 치워 주었습니다. 정오가 되자 세번은 뜨거운 수프 한 그릇과 빵 한 조각을 가져왔습니다. 키츠는 베개에 기대어 앉아 한 숟가락씩 비우고 그에게 빈 그릇을 돌려주었습니다.
        p1:
          class_medical: 1월 15일에 Severn은 은행이 청구서를 돌려보냈고 손에 있는 돈으로 임대료를 한 번만 지불할 것이라고 썼습니다. 키츠는 그를 시야에서 벗어나게 하려고 하지 않았기 때문에 그는 돈을 벌기 위해 그림을 그리러 나갈 수도 없었고, 밤새도록 잠도 자지 못했습니다. 간호 훈련을 받은 {staff}는 밤새도록 키츠를 들어올려 기침을 하고, 땀을 닦고, 베갯잇을 갈아주고, 새벽이 가까워질 때에만 램프를 끄는 일을 맡았습니다. 세번은 부츠를 신고 있는 채 옆방에서 옷을 입은 채 잠을 잤다. 아침에 일어나자마자 그는 먼저 문을 열고 침대를 바라보았다가 돌아와서 끝내지 못한 채 남겨둔 편지를 완성했습니다.
          else: 1월 15일에 Severn은 은행이 청구서를 돌려보냈으며 손에 있는 돈으로 임대료를 한 번만 지불할 것이라고 썼습니다. 키츠는 그를 시야에서 벗어나게 하려고 하지 않았기 때문에 그는 돈을 벌기 위해 그림을 그리러 나갈 수도 없었고, 밤새도록 잠도 자지 못했습니다. 감시에 익숙했던 {staff}는 의자를 침대 위로 끌어당겨 세번을 옆집에 자게 했고, 환자가 뒤집힐 때마다 일어나 살펴보았다. 세번은 부츠를 신고 있는 채 옆방에서 옷을 입은 채 잠을 잤다. 아침에 일어나자마자 그는 먼저 문을 열고 침대를 바라보았다가 돌아와서 끝내지 못한 채 남겨둔 편지를 완성했습니다.
        p3:
          class_lettered: 2월 중순이 되자 키츠는 더 이상 침대에서 나갈 수 없게 되었습니다. 그는 여전히 자신이 아무것도 남기지 않았다고 느꼈고, 자신의 묘비에 이름이 남기를 원하지 않았습니다. 그의 책을 읽은 {staff}는 침대 옆에 앉아 그의 송가에 대해 이야기했습니다. 사람들은 그것을 계속해서 읽고 한 줄 한 줄 마음으로 배웠고 로마에 있는 이 방은 그를 위해 보관될 것입니다. 키츠는 손가락을 시트 위에 오랫동안 올려놓은 채 말 없이 귀를 기울였다. 창문 틈새로 광장의 분수 소리가 들려왔고, 침대 옆 책에는 눌려진 보라색이 놓여 있었다.
          class_teaching: 2월 중순이 되자 키츠는 더 이상 침대에서 나갈 수 없게 되었습니다. 그는 여전히 아무것도 남기지 않았다고 느꼈고, 자신의 묘비에 이름이 남기를 원하지 않았습니다. 가르쳤던 {staff}는 침대 옆에 앉아 다음 교실에서 학생들이 그의 노래를 마지막 줄까지 외울 것이며 로마에 있는 이 방이 그를 위해 남겨질 것이라고 말했습니다. 키츠는 손가락을 시트 위에 오랫동안 올려놓은 채 말 없이 귀를 기울였다. 창문 틈새로 광장의 분수 소리가 들려왔고, 침대 옆 책에는 눌려진 보라색이 놓여 있었다.
