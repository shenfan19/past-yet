        p3: Tesla는 테이블에 있는 두 인물을 펜으로 바꾸고 접어서 Morgan에게 보낸 봉투에 넣습니다. 그가 창고 밖으로 걸어 나오자 사운드의 바람이 그의 모자 챙을 휘날리게 됩니다.
        p2: 대답이 나오면 감독은 두 페이지를 창고의 두 벽에 고정합니다. 그는 그들 사이에 서서 살펴보고 실험실 페이지 아래에 선을 그었습니다.
        p1: 감독은 수정된 세트를 집어들고 잠시 동안 창문의 빛을 바라보고 있다가 두 번 접어 재킷 주머니에 집어넣습니다. 그는 창고에서 나와 허세를 불러일으키고 남자들에게 더미를 가져오라고 합니다.
    relic: 도면 사본
    relic_desc: 두 번 접힌 Wardenclyffe 계획 시트 사본. 접힌 부분 아래에 연필로 날짜가 적혀 있습니다.
    points:
      p1: 9월 입찰가가 높은 경우 원본 도면과 수정 도면을 별도로 Wardenclyffe에 등록하여 해당 연도에 작업을 시작할 수 있습니다.
      p2: 화이트에게 아직 입찰을 기다리는 타워 작업과 별도로 이미 합의된 실험실 작업을 나열하고 감독에게 각 작업에 대해 별도의 계정을 제공하도록 합니다.
      p3: Tesla가 다음 단계의 기초 작업에 대한 자체 약속과 함께 확인된 비용을 사용하여 단계적 지불을 제안하도록 도와주세요.
    points_fail:
      p1: 계약자는 오래된 도면을 인용하고 누구도 치수를 확인할 수 없습니다. 시즌 동안 작업이 취소되고 사무실에서 해당 직원을 소환합니다.
      p2: 한 인용문은 건물과 타워를 하나로 묶어줍니다. 나중에 승무원은 어느 부분이 이미 승인되었는지 확인할 수 없습니다.
      p3: 두 작업 세트 모두 여전히 동일한 자금 조달 라운드에 의존합니다. 돈이 부족해지면 제작진은 어떤 작업에 대한 비용이 지불될지 알 수 없습니다.
    shift:
      p1:
        was: Tesla와 Stanford White는 1901년에 입찰과 설계를 논의했습니다. Wardenclyffe의 건설은 그 해에 시작되었습니다.
      p2:
        was: Wardenclyffe에는 실험실 건물과 탑이 포함되어 있습니다. 서신에는 설계 및 예산 변경 사항이 기록됩니다.
        now: 시작하기 전에 감독은 두 계정을 별도로 정산할 수 있습니다. 새로운 타워 견적은 이전 견적과 비교하여 확인할 수 있습니다.
      p3:
        was: Morgan은 초기 자금을 제공했습니다. 나중에 자금이 부족해 프로젝트가 원래 의도한 대로 진행되지 않았습니다.
        now: 서면 계약에는 확정된 범위가 포함됩니다. 나중에 자금이 부족해지면 사이트에서 해당 청구서를 정산하고 아직 자금이 조달되지 않은 작업을 명확하게 식별할 수 있습니다.
        who: tesla_wardenclyffe
        bio: Tesla는 Wardenclyffe를 무선 통신 및 전력 시스템의 일부로 구상했습니다. 이를 부지로 전환하려면 입찰, 자금 조달 및 건축 일정도 필요했습니다.
    vignettes:
      timber: 10월 초에 {staff}는 바퀴가 가라앉을 때마다 카터가 모래 트랙을 따라 현장까지 판자를 잔뜩 실을 때마다 뒷판 아래 한쪽 어깨로 운반하는 데 도움을 줍니다. 카터는 길 아래의 농부들이 망치질로 암탉의 시간을 측정하기 시작했으며 마당이 조용한 날에 가장 잘 누워 있다고 말했습니다.
      signal: 12월 중순, 한 소년이 역에서 종이를 흔들며 올라왔습니다. 마르코니는 바다 건너편에서 신호를 들었습니다. 감독은 페이지를 팔 길이로 잡고 {staff}에게 점이 실제로 그렇게 멀리까지 갈 수 있는지 묻습니다. {staff}는 가능하다고 말하고, 감독은 종이를 코트에 접어넣고 부하들에게 계속 망치질을 하라고 말합니다.
