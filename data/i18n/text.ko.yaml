      p2: 음식은 여유가 있을 때 나오며, 칸토르에게는 여전히 배가 고픈 날이 있습니다.
    shift:
      p1:
        was: 1917년 칸토어는 마지막으로 할레의 진료소에 들어갔습니다. 그는 아내에게 집에 오라고 편지를 썼습니다.
        now: 이 지점에서는 {staff}가 방문을 주선받습니다. 칸토어는 집에 있는 누군가에게 자신이 편지에 무엇을 넣었는지 말해 줄 수 있습니다.
      p2:
        was: 칸토어는 말년에 병이 들었고 전시 독일에서는 식량이 부족했습니다.
