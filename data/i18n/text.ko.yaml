    relic_desc: 머리카락에 페인트가 말라붙은 낡은 붓.
    points:
      p1: 마지막 몇 주 동안 렘브란트가 이젤에 그림을 더 옮길 수 있도록 도와주세요. 그러면 그의 마지막 그림이 힘이 빠진 곳에 남지 않을 것입니다.
    points_fail:
      p1: 역사에 따르면 그의 이젤에 그려진 마지막 그림은 그의 작업실에 미완성 상태로 남아 있었습니다.
    shift:
      p1:
        was: 렘브란트는 1669년 10월 4일 암스테르담에서 사망했습니다. 이젤에 그린 그의 마지막 그림은 그가 죽을 때까지 미완성 상태로 남겨졌습니다.
        now: '{staff}는 지난 몇 주 동안 자신의 색상을 바탕으로 캔버스를 안정시켰습니다. 이젤에 그려진 그림은 10월 이전에 자신의 손으로 더 옮겨졌습니다.'
        who: rembrandt_amsterdam
        bio: 이 라인에서 렘브란트는 1669년 9월까지 그의 마지막 그림을 작업했으며 역사가 남긴 것보다 더 멀리 나아갔습니다. 그의 스튜디오에서는 그가 의미하는 바에 더 가까워졌습니다.
    vignettes:
      colours: 9월 22일 {staff}는 Rozengracht에 있는 염색공의 뒷방에서 오후를 보내며 두 팔이 아플 때까지 흰색 납판 위에 뮬러를 돌립니다. 컬러맨은 요즘 화가들은 모두 흰색의 부드러운 크림을 원하기 때문에 그들에게 크림을 팔아서 그들이 알아차리는지 알아볼 마음이 있다고 말했습니다.
      barge: 9월 26일 {staff}는 바지선 선원이 Rozengracht를 따라 이탄을 잔뜩 실을 수 있도록 도와줍니다. 올 가을에는 물이 너무 적어서 다리마다 바닥을 긁으며 돌들의 이름을 부르기 시작했다고 합니다.
      watchman: 11월 중순, {staff}는 구석구석에서 딸랑이를 흔들며 시간을 알리는 야간 경비원과 함께 젖은 라운드를 걷고 있습니다. 이번 달에도 비가 많이 와서 기침 소리처럼 들린다고 하더군요.
  gaudi_barcelona:
    name: 전차에 치이다
    place: 바르셀로나
    figure: 안토니 가우디
    story: 1926년 6월 7일 저녁, 73세의 안토니 가우디는 바르셀로나 그란비아에서 트램에 치였습니다. 서류도 없고 사복도 없는 그는 거지 취급을 받았고, 환영받는 택시도 멈추지 않았다. 그는 6월 10일 병원에서 사망했으며 6월 12일 자신이 43년 동안 관리했던 건물 아래에 묻혔습니다. Domènec Sugranyes가 작품의 감독을 맡았습니다. 1936년 7월 20일 작업장에 불이 났고 대부분의 도면과 석고 모델이 손실되었습니다.
    story_prose:
      opening:
        - 1926년 5월 말, 바르셀로나. 73세의 카탈로니아 건축가 안토니 가우디는 아직 미완성인 도시의 멋진 건물을 짓기 위해 말년을 바쳤습니다. 그의 디자인은 자연에서 가져온 곡선을 사용하며, 현장 작업실에는 그림과 석고 모형이 가득합니다. 작년에 동쪽 외관의 첫 번째 종탑이 완성되었습니다.
        - 역사상 그는 6월 7일 저녁 그란비아(Gran Via)에서 트램에 치였습니다. 그는 서류도 없었고 옷도 수수하게 차려입었기 때문에 거지로 취급되어 누워 있었습니다. 환영받은 택시는 시민 경비원이 그를 진료소로 데려갈 때까지 멈추지 않았고 그곳에서 그는 병원으로 옮겨졌으나 6월 10일 사망했습니다. 그의 제자인 Domènec Sugranyes가 작품의 감독을 맡았습니다. 10년 후인 1936년 7월 20일, 작업장은 불탔고 작업장에 있던 도면과 석고 모형 대부분이 손실되었습니다. 이 지점에는 그랑 비아의 전차 차장이 종을 좋아하고, 현장의 젊은 석공이 바람을 따라 흥얼거리고, 한 여자가 정오에 물을 팔러 온다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 약을 알고 구급 상자를 가지고 있는 사람, 강인한 몸을 가지고 친절하고 주의 깊은 사람, 트램 선로에서 즉시 병원으로 데려갈 수 있는 상처 치료 장비를 들고 있는 사람; 목수로 일했거나 기록 보관소를 관리한 사람 또는 진행 중인 작업과 작업장 열쇠를 적절하게 전달하기 위해 편리하고 체계적인 사람; 그리고 조금 더 재치나 의지가 있는 같은 종류의 사람이 Sugranyes를 설득하여 주요 모델의 사진, 치수 및 그림을 두 번째 장소에 보관하도록 합니다.
      outcomes:
        all: 그 해 여름, 가우디가 작업실로 돌아왔습니다. 10년 후 찬장은 불에 탔고, 누군가 2위 앨범을 가져와 모델 사진을 뒤집어 놓았다. 뒷면에는 그 해의 규모가 적혀 있습니다.
        p3: 그 해 여름, 가우디가 작업실로 돌아왔습니다. 그는 문 옆 낮은 의자에 앉아 석공들이 작업하는 모습을 지켜보고 있었는데, 오후에는 바람이 탑의 구멍을 통해 들어와 휘파람을 불었습니다.
        p2: 6월 12일 가우디가 묻혔다. 10년 후 작업장은 불타버렸고, 누군가가 2위의 앨범을 가져왔습니다. 사진 뒷면에는 여전히 그 해의 규모가 적혀 있습니다.
        p1: 6월 12일 가우디가 묻혔다. Sugranyes가 작업의 방향을 이어받았고, 현장의 망치는 멈추지 않았고, 석공들은 그 목록에 따라 건축을 계속했습니다.
      none: 6월 12일 가우디가 묻혔다. 10년 후인 1936년 7월 20일, 작업장은 불탔고, 찬장에 있던 그림과 석고 모형 대부분이 사라졌습니다.
      desync: 6월 10일 석공들은 아침 내내 작업장 문에서 기다렸다. 누가 열쇠를 가지고 있는지 아무도 몰랐고, 어떤 일이 진행되고 있는지도 아무도 알 수 없었습니다. {staff}가 소환되었을 때, 젊은 석공은 아직 제자리에 놓이지 않은 돌 위에 앉아 누군가가 그를 부르기를 기다리고 있었습니다.
      not_admitted: '{staff}는 현장에 도착하지 않았으며 그란 비아 트램을 몇 번만 탔습니다. 비계 사이 멀리에는 종탑이 서 있었고, 바람이 부는 오후에는 희미한 휘파람 소리가 여러 거리를 가로질러 울려 퍼졌습니다.'
      points:
        p3:
          class_medical: 6월 7일 저녁, Bailèn 거리와 Girona 거리 사이의 Gran Via에서 트램이 급제동을 합니다. 난간 옆에는 낡은 옷을 입은 노인이 누워 있다. 몇 명이 모여서 구경하고 뒤로 물러난다. 의술을 아는 {staff}는 1분도 채 지나지 않아 그 옆에 무릎을 꿇고 상처를 누르고 머리를 안정시킨 채 위를 올려다보며 주변 사람들에게 자신이 누구인지 알려준다. 바로 현장의 건축가 가우디다. 택시가 옵니다. 차가 출발할 때 {staff}는 한 손으로 머리를 잡고 다른 손으로 문을 잡습니다. 그들 뒤에서 트램은 벨을 한 번 울리고 천천히 출발합니다.
