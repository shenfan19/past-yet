        p4: Jeanne은 무릎에 그릇을 들고 있습니다. 창문에 있는 종이가 외풍 속에서 들어올려지면 그녀는 그 모서리를 가장자리 아래로 내립니다.
        p1: 라벨의 모서리가 뒤에서 올라옵니다. Modigliani는 초상화를 돌리고 슬립을 손바닥에 얹습니다.
        p2: 누군가 문앞으로 의자를 가져옵니다. 와드가 인계를 받은 경우에만 {staff}가 잡고 있던 프레임에서 멀어집니다.
