      proof: 합성기가 읽는 동안 현재 행 아래에 종이 조각을 놓습니다. 다음 예의 일부처럼 보였던 숫자가 다시 자신의 제목을 찾습니다.
  faraday_london:
    name: 자기에서 전기를 얻다
    place: 런던
    figure: 마이클 패러데이
    story: 1831년 8월 29일 패러데이는 고리 실험에서 바늘의 순간적인 움직임을 기록했습니다. 10월 28일에 그는 자석 극 사이에 구리 디스크를 돌리고 디스크가 계속 회전하는 동안 전류를 얻었습니다.
    story_prose:
      opening:
        - 왕립 연구소의 벤치에는 감긴 철제 고리가 놓여 있습니다. 패러데이가 접점에서 올려다보니 바늘이 이미 0으로 돌아왔습니다. 메모를 하는 사람은 결과를 입력하지 않을 것인지, 아니면 다시 시청할 것인지 묻습니다.
        - 1831년 8월 패러데이는 링에 접촉하거나 접촉을 끊을 때 잠깐 휘어지는 현상을 관찰했습니다. 10월에 그는 회전하는 구리 디스크에서 지속적인 전류를 보았습니다. 보존해야 할 두 가지 관찰이 있습니다. 처음에는 편향이 시작되는 시점을 관찰하십시오. 두 번째에서는 언제 끝나는지 지켜보세요.
        - 타이밍과 바늘을 따로 관찰할 수 있는 사람을 이용하세요. 디스크의 경우 손이 안정된 사람이 접촉을 관리할 수 있습니다.
      points:
        p1: 노트를 옆으로 돌리고 한쪽은 접촉 순간을 위해 남겨두고 다른 쪽은 바늘을 위해 남겨 둡니다. 패러데이가 움직일 때 관찰자는 바늘이 돌아가기 전에 방향을 알려줍니다. 잠시 후 그는 접촉이 끊어질 때까지 또 다른 표시를 합니다. 비어 있던 열에 두 개의 별도 표시가 있습니다.
        p2: 디스크가 회전하면서 패러데이는 관찰자에게 조금 더 기다려달라고 요청합니다. 미끄러진 접점을 안정시킵니다. 관찰자가 다시 보면 바늘은 여전히 한쪽으로 치우쳐 있습니다. 그는 디스크가 멈춘 후에만 0으로의 복귀를 기록합니다. 연필은 두 판독값 사이에 명확한 공간을 남깁니다.
      outcomes:
        all: 두 기록이 나란히 놓여 있다. 반지를 끼고 바늘이 빨리 돌아왔습니다. 디스크를 사용하면 회전이 멈추기 전에 얼마나 오랫동안 머물렀는지 표시됩니다.
        p1: 링의 짧은 편향은 종이에 있습니다. 다른 관찰은 아직 확립되지 않았습니다.
        p2: 디스크는 더 오래 지속되는 판독값을 제공합니다. 이전 링 기록에 공백이 있어서 여행을 동기화할 수 없습니다.
      none: 열 머리글은 시트에 남아 있는 전부입니다. 장치가 조용해지면 누구도 채울 수 있는 판독값이 없습니다.
      not_admitted: 실내의 누군가가 방문객에게 통로를 비워달라고 요청합니다. 밖에서는 관찰자가 한 번 더 지켜보라고 요청하는 소리가 들립니다.
      desync: 링의 편향이나 디스크의 지속적인 판독이 노트북에 도달하지 못합니다. 실험 기록이 동기화되지 않고 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: 잠시 후 그는 접촉이 끊어질 때까지 또 다른 표시를 합니다. 비어 있던 열에 두 개의 별도 표시가 있습니다.
        p2: 그는 디스크가 멈춘 후에만 0으로의 복귀를 기록합니다. 연필은 두 판독값 사이에 명확한 공간을 남깁니다.
    relic: 철제 고리와 코일
    relic_desc: 연철 고리에 두 개의 와이어 코일이 있습니다.
    points:
      p1: 패러데이의 고리 실험에서 일시적인 편향을 보존하기 위해 스위칭과 바늘을 별도로 관찰하십시오.
      p2: 컬렉터를 구리 디스크가 회전할 때 접촉 상태로 유지하면 패러데이가 디스크가 움직이는 동안 전류를 관찰할 수 있습니다.
