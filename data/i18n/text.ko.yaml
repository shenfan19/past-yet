  riemann_selasca:
    name: 마지막 논문
    place: 셀라스카
    figure: 베른하르트 리만
    story: 베른하르트 리만은 1862년에 병에 걸렸고 결핵을 앓고 있는 동안 여러 번 이탈리아를 여행했습니다. 1866년 6월에 그는 세 번째로 마조레 호수의 셀라스카에 왔습니다. 7월 19일 무화과나무 아래에서 쉬면서 그는 여전히 마지막 논문을 작성 중이었지만 끝내지 못했습니다. 그는 다음날 그곳에서 39세의 나이로 세상을 떠났습니다. 10년 후 Richard Dedekind가 편집자로 참여하여 그의 전집이 출간되었습니다.
    story_prose:
      opening:
        - 1866년 6월 이탈리아 북부 마조레 호수. 서른아홉 살의 수학자 베른하르트 리만(베른하르트 리만)은 건강상의 이유로 세 번째로 남쪽으로 내려와 해변의 셀라스카(Selasca)에 방을 잡았다. 곡선 공간의 기하학과 소수의 분포에 관한 그의 연구는 주요 분야를 열었고 지금까지 그는 거의 4년 동안 결핵을 앓고 있습니다.
        - 역사상 그는 7월 19일에 무화과나무 아래 누워서 아직 마무리하지 못한 마지막 논문을 작성하고 있었습니다. 다음날 그는 그곳에서 죽었습니다. 10년 후 하인리히 베버(Heinrich Weber)가 리처드 데데킨트(Richard Dedekind)와 함께 편집한 그의 전집이 출간되었습니다. 이 지부에는 집주인의 딸이 매일 그를 위해 나무 아래에 떨어진 무화과를 치워주고 있고, 호수 위의 뱃사공은 그의 아내에게 노 젓는 법을 가르쳐야 했습니다.
        - 몇 가지 유형의 사람들이 이번 여행에 도움을 줄 수 있습니다. 대학에서 강의한 사람, 모델을 만들거나 교정본을 읽은 사람, 자신이 지시하는 공식을 따라잡기 위해 학식이 있고 인내심이 있는 사람; 의학을 알고 나노 의료 키트를 가지고 다니는 사람, 시대가 할 수 없는 질병을 치료하기 위해.
      outcomes:
        all: 그해 가을 리만은 괴팅겐으로 돌아가 다시 가르쳤습니다. 그가 집에 가져온 서류 중 마지막 서류는 무화과나무 아래에 몇 페이지 더 길게 받아 적힌 것이었습니다.
        p2: 그 해 가을, 리만은 북쪽의 괴팅겐으로 돌아갔습니다. 떠나는 날 아침 그는 무화과나무 아래 의자에 잠시 앉아 있다가 노트 한 페이지를 접어 코트 주머니에 넣었습니다.
        p1: 마지막 논문은 그 자신의 말로 몇 페이지 더 나아갔습니다. 10년 뒤 전집이 나왔을 때 그 페이지도 함께 인쇄됐다.
      none: 7월 20일 리만은 셀라스카에서 사망했다. 무화과나무 아래 의자는 비어 있었는데, 무화과 두 개가 그 자리에 떨어졌는데, 그것을 주워 주는 사람이 아무도 없었습니다.
      not_admitted: '{staff}는 집에 들어 가지 않았고 Pallanza 착륙장에서 보트 몇 대를 내리는 데만 도움을주었습니다. 물 건너 셀라스카 쪽에 큰 무화과나무가 서 있고 그 밑에 의자도 있었습니다.'
      points:
