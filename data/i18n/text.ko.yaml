      si_site: '{date}, 준비처는 {staff}에게 시내와 스파이의 후보지를 비교해 달라고 했다. {staff}는 모든 곳을 걸어 본 뒤 진입로를 한 장의 지도에 표시해 가져왔다.'
      xing_shipai: '{date}, 스파이에서 경계 말뚝을 세울 일손이 모자라 사무원이 {staff}에게 함께 가 달라고 했다. {staff}는 동료들이 말뚝을 박는 동안 말뚝을 똑바로 잡고, 돌아가기 전에 함께 경계를 한 번 더 걸었다.'
      order_given: '{date}: 쑨원은 국립고등사범학교, 광동법정학원, 광둥농업학교를 국립광동대학에 합병하라고 명령하고 조우루(Zou Lu)라는 이름을 붙여 준비하게 했습니다. 도시의 어느 누구도 아직 이 대학이 어디에 있는지 말할 수 없습니다.'
      sun_dies: '{date}: Sun Yat-sen이 베이징에서 사망합니다.'
      renamed: '{date}: 국가 정부는 국립광동대학교를 국립중산대학교로 이름을 바꾸도록 명령합니다.'
      lecture_jan27: '{date}: 일요일. 쑨원(孫文)이 고등사범학교 강당에서 인민3원칙에 관해 첫 강의를 하고 있다.'
      lecture_feb17: '{date}: 일요일. 쑨원이 고등사범학교 홀에서 강의를 하고 있다. 시리즈는 1월 27일부터 시작되었으며 이번이 네 번째 강의입니다. 플랫폼 옆에서 한 남자가 고개를 들지 않고 글을 쓰고 있습니다. 바로 모든 사람을 위해 존재하는 황창구(Huang Changgu)입니다.'
      zou_takes_up: '{date}: Zou Lu가 준비를 맡습니다.'
      hall_feb24: '{date}: 또 일요일이네. 오늘 강당에서 다섯 번째 강의가 열리는데, Zou Lu가 세 학교의 학생들을 여기에 모아 준비를 알렸습니다.'
      first_meeting: '{date}: 세 학교 학생들의 졸업을 안건으로 첫 번째 준비 회의가 열립니다. 준비위원 35명 중 31명이 해외 유학 경험이 있다.'
      first_meeting_book: '{date}: 세 학교 학생들의 졸업을 안건으로 첫 번째 준비 회의가 열립니다. 준비위원 35명 중 31명이 해외 유학 경험이 있다. 이 지점에는 세 학교의 졸업반 이름이 이제 한 권의 책에 있습니다.'
      proofs_travel: 3월까지 강의 내용이 직접 전달됩니다. 황장고의 주석은 공정하게 복사되어 손중산에게 보내지고, 그는 그것을 조로(Zou Lu)에게 가져다가 읽게 하고, 조루(Zou Lu)는 페이지에 전표를 붙여 돌려보낸다.
      preface: '{date}: Sun Yat-sen이 첫 번째 강의 팜플렛 서문을 작성합니다. 3월 말에 인쇄됩니다.'
      lecture_apr20: '{date}: 일요일. 강당에서의 강의가 두 번째 부분에 이르렀습니다.'
      measures_sent: '{date}: Zou Lu는 세 학교에 합류하기 위한 방안을 제출합니다.'
      measures_approved: '{date}: 조치가 승인되었습니다.'
      shipai_chosen: 올해 Sun Yat-sen은 Zou Lu에게 도시 동쪽의 Shipai에 새 캠퍼스를 선택하라고 말합니다. 학교는 여러 곳에 분산되어 있어 운영하기가 어렵습니다.
      last_lecture: '{date}: 열여섯 번째 강의입니다. 세 번째 부분은 네 번째 강의에 이르렀고 나머지는 전혀 제공되지 않습니다. 홀에 있는 누구도 이것이 마지막이라는 것을 알지 못합니다.'
      classes_begin: '{date}: 국립 광동 대학교에서 수업이 시작됩니다.'
      ceremony: '{date}: 쑨원(孫文)이 쓴 모토인 ''널게 공부하고, 신중하게 탐구하고, 신중하게 생각하고, 명확하게 분별하고, 열심히 실천하라''는 모토로 창립식이 거행됩니다. 그는 거기에 없고 이틀 후에 광저우를 떠난다.'
      sunday_first: '{date}: {staff}는 플랫폼에서 멀리 떨어진 홀 맨 뒤쪽에 눌려져 있어 남자를 볼 수는 있지만 모든 것을 들을 수는 없습니다.'
      sunday_stall: '{date}: {staff}는 홀에 들어갈 수 없으며 문에 매점을 설치합니다. 홀이 텅 비면 사람들이 쏟아져 나오고, 순식간에 모든 것이 팔려 나갑니다.'
      sunday_sit: '{date}: {staff}는 홀의 뒷줄에 자리를 찾아 첫 단어부터 마지막 단어까지 움직이지 않고 앉는다.'
      records_begun: '{date}: {staff}는 세 학교의 기록을 한 권의 책으로 복사하기 시작합니다.'
      records_read_aloud: '{date}: 누구도 {staff}의 손을 읽을 수 없습니다. 그래서 {staff}가 이름을 읽고 점원이 쓰면 세 개의 레코드가 하나가 되기 시작합니다.'
      records_shut: '{date}: 기록을 복사하려면 읽기가 필요하며 {staff}는 거기에 참여하지 않지만 세 학교 모두의 문지기를 알게 됩니다. 누가 어디에 있는지 알아보려면 페이지를 넘기는 것보다 {staff}에게 물어보는 것이 더 빠릅니다.'
      records_done: '{date}: 세 학교의 기록은 첫 번째 준비 회의 전 한 권의 책입니다.'
      records_late: '{date}: 세 학교의 기록이 한 권의 책입니다. 벌써 첫 번째 준비회의가 열렸습니다.'
      sites_done: '{date}: {staff}는 도시 곳곳에 흩어져 있는 모든 장소를 걸어다니며 한 장에 그 장소를 그렸습니다. 각 장소에서 다음 장소까지 걸어가는 데 걸리는 시간이 표시됩니다.'
      asked_inside: '{date}: 점원은 더 이상 {staff}를 문 앞에 두고 기다리지 않고 호출합니다.'
      copy_kept: '{date}: {staff}는 팜플렛을 포장하여 자신의 물건과 함께 넣습니다.'
      exhausted: '{date}: {staff} 너무 피곤해서 손이 떨려서 쉬어야 해요.'
      spoiler: '{date}: {staff}는 2년 안에 이 학교가 주문한 사람의 이름을 따게 될 것이라는 것을 알고 있습니다. {staff}는 노트 마지막 페이지에 문장을 쓰고 닫습니다.'
      spoiler_said: '{date}: {staff}는 복사할 때 점원에게 2년 안에 이 학교가 주문한 사람의 이름을 따를 것이라고 말합니다. 점원은 올려다보지 않습니다. 그 사람은 아직 살아 있고, 학교에 그런 이름을 붙인 사람이 있다고 그는 말합니다.'
      errand: '{date}: 전표가 붙여진 페이지가 복사실을 드나듭니다. {staff}는 밖에 있고 그것을 운반하는 사람의 뒷모습만 볼 수 있습니다.'
      errand_carried: '{date}: 이 분기에서 페이지를 전달하기 위해 전송된 것은 한 번 {staff}입니다. 전표를 붙인 종이 뭉치는 한쪽 끝에서 다른 쪽 끝으로 가는데, 한 겹도 구겨지지 않습니다.'
      errand_frail: '{date}: {staff}는 계단 몇 개만 지나면 숨이 차서 페이지를 들고 다닐 수 없으며, 복사실 문 앞에 앉아 전표가 들어오고 나가는 페이지를 지켜보고 있습니다.'
      pamphlet: '{date}: 프린터에서 새로 나온 팜플렛이 직원 책상 위에 놓여 있습니다. {staff}는 창문을 통해 덮개를 봅니다.'
      pamphlet_traded: '{date}: {staff}는 자신의 손으로 만든 것을 프린터에서 새로 나온 팜플렛 사본과 교환합니다.'
      pamphlet_given: '{date}: 점원이 {staff}에게 프린터에서 새로 나온 팜플렛 사본을 건네주면서 방에 있는 모든 사람이 이 팜플렛을 가져야 한다고 말했습니다.'
      homesick_may: '{date}: 기록이 없는 한 달. {staff}는 노트북에 집계를 유지하며 100일에 도달합니다. 사무실에 온 지 3일이 조금 넘었습니다.'
      shipai_walk: '{date}: {staff}는 새 캠퍼스가 도시 동쪽의 Shipai에 있을 것이라는 소식을 들었습니다. 오늘은 여행이 없습니다.'
      shipai_reached: '{date}: {staff}는 도시에서 동쪽으로 걸어가 시파이에 도착합니다. {staff}는 여기에 무엇이 서게 될지 알고 오랫동안 머물며 지금 여기에 있는 것을 그린다.'
      shipai_frail: '{date}: {staff}는 도시 동쪽의 시파이(Shipai)에 무엇이 있을지 알고 있습니다. 긴 산책길인데 오늘은 {staff}가 시내에 머물고 있습니다.'
      last_seat: '{date}: {staff}는 평소 장소에서 이 강의를 듣고, 홀이 비워진 후에도 잠시 앉아 있다.'
      last_stall: '{date}: {staff}는 다른 일요일보다 홀 문에 더 많은 것을 가져옵니다. {staff}는 앞으로 일요일에는 이 문 앞에 그렇게 많은 사람이 없을 것임을 알고 있습니다.'
      enrol_open: '{date}: 준비 시험 등록이 시작됩니다. 전날 대학 측은 도교육청에 학생 모집을 요청해 520명 정원을 계획하고 있다.'
      grad_ceremony: '{date}: Zou Lu가 총장직을 맡고 세 학교의 졸업식이 같은 날 거행됩니다.'
    labels:
