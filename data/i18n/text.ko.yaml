      excerpts:
        p3: 동이 트기 전에 그는 스스로 몸을 일으켜 어둠 속에서 샌들 끈을 매었다. 겉옷을 걸치고 감옥으로 서두르는 친구들과 나섰는데, 그들보다 걸음이 빨랐다.
        p2: 밤이 되자 {staff}는 담장 밑에서 등잔을 밝히고 밀랍판의 글을 파피루스에 옮겼다. 이튿날 아침 찾아온 친구 하나가 두루마리를 옷 속에 넣고, 가슴에 한 손을 얹은 채 감옥 문을 나섰다.
        p1: 소크라테스는 끊긴 문장부터 다시 말을 이었다. 말을 마치고 겉옷 자락을 여민 채 연단에 서 있었다.
  cao_xueqin_beijing:
    name: 마지막 장 뒤의 빈 종이
    place: 베이징 서산
    figure: 조설근
    story: The Story of the Stone의 초기 원고는 조설근의 생애 동안 주석이 달린 사본이 유포되었음을 입증합니다. 그 원고의 나중 여백 메모는 조설근의 죽음을 미완성 된 책과 연관시킵니다. 시나리오는 그의 죽음의 정확한 날짜나 그가 쓴 장의 수를 고정하지 않은 채 그의 마지막 겨울을 배경으로 한다.
    story_prose:
      opening:
        - 서산에서는 일찍 어두워집니다. 한 필사자가 페이지 꾸러미를 가지고 와서 무엇을 가지고 갈 수 있는지 묻습니다. 그는 침대 옆 작은 테이블에 소포를 내려놓았다. 빈 시트가 맨 위에 놓여 있습니다.
        - The Story of the Stone의 주석이 달린 사본은 조설근의 생애 동안 이미 유통되었습니다. Jiaxu 원고의 나중에 기록에는 책이 완성되기 전에 그가 죽어간 것을 기억합니다. 이 상상 속의 겨울 방문에서는 그가 직접 더미를 정리할 시간이 아직 남아 있습니다.
        - 필사자는 어두워지기 전에 집에 가고 싶어합니다. 원고를 아는 사람은 작업 페이지에서 주석이 달린 사본을 선택할 수 있습니다. 다른 사람을 돌보는 데 익숙한 사람은 불과 등불을 볼 수 있습니다. 그러면 테이블 위에 초안을 펼칠 공간이 있을 것입니다.
      points:
        p1: 필사자가 침대 옆에서 느슨한 페이지와 함께 더미를 묶으려고 합니다. 당신은 다른 손의 여백에 있는 줄을 발견하고 그에게 읽어달라고 요청합니다. 그는 주석이 달린 사본을 따로 포장하고 조설근가 아직 수정 중인 페이지를 손이 닿는 곳에 두었습니다. 꾸러미마다 따로 끈을 묶었다.
        p2: 석탄이 꺼지자 조설근는 방금 읽은 페이지를 닫습니다. 당신은 석탄을 가져오는 사람에게 불을 지피고 등불을 가까이 두고 조설근에게 그가 읽고 있던 페이지를 넘겨달라고 부탁합니다. 그는 덮개 아래에서 손을 뻗어 다시 줄을 잡았습니다. 그날 저녁, 등잔은 손이 닿는 곳에 놓여 있었다.
        p3: 후대에 쓰인 속편에서는 집안이 다시 번성한다고 조설근에게 말했다. 그는 미간을 찌푸리고 제5회에서 새들이 흩어지는 노래의 끝을 펼쳐 세상이 온통 하얗게 비는 구절을 가리켰다. 주석이 달린 필사본을 펴고 이 소설이 멸망한 명나라를 애도한다는 후대의 해석이 맞는지 물었다. 조설근은 크게 웃었다. 아무 대답도 하지 않았다. 다시 붓을 들고서는 마음을 정한 대목에만 표시했다. 필사자는 표시된 곳만 옮겨 적고 나머지는 비워 두었다.
      outcomes:
        all: 필사자는 두 장의 시트를 가지고 떠납니다. 함께 읽으면 조설근가 정리한 장과 그가 여전히 고려하고 있는 선택이 무엇인지 알 수 있습니다. 그 웃음이 무슨 뜻인지 적어주는 사람은 아무도 없습니다.
        p1: 카피리스트는 주석이 달린 초기 사본을 가지고 떠납니다. 조설근가 아직도 읽고 싶은 초안이 침대 옆에 남아 있다.
        p2: 램프는 침대 옆에서 조금 더 오래 켜집니다. 조설근는 옆으로 치워두었던 페이지를 마무리했다.
        p3: 표시된 부분은 복사되고, 결정되지 않은 부분은 공백으로 남습니다. 카피리스트는 자신의 추측을 배제합니다.
      none: 페이지는 처음 들어왔을 때 그대로 쌓여 있다. 나중에 누군가가 마지막 장에 대해 물어보면 빈 시트는 아무 대답도 하지 않는다.
      not_admitted: 필사자가 안으로 들어갑니다. 당신은 침대 옆 탁자에 서류를 가져가지 않고 안뜰에 램프가 하나만 남을 때까지 기다립니다.
      desync: 주석이 달린 사본은 작업 페이지와 함께 돌아갑니다. 필사자는 그것을 남기지 않고 떠나고, 사무실에서는 당신을 회상합니다.
      excerpts:
        p1: 꾸러미마다 따로 끈을 묶었다.
        p2: 그날 저녁, 등잔은 손이 닿는 곳에 놓여 있었다.
        p3: 필사자는 표시된 곳만 옮겨 적고 나머지는 비워 두었다.
    relic: 느슨한 장 계획 시트
    relic_desc: 여러 챕터에 대해 제안된 순서와 조설근가 아직 결정하지 못한 내용에 대한 공백이 포함된 게임 기념품입니다.
    points:
      p1: 조설근의 작업 페이지가 그에게 반환되는 동안 주석이 달린 초기 사본을 필사자의 손에 보관하십시오.
      p2: 조설근가 결말에 대해 생각하면서 즐거운 저녁을 보낼 수 있도록 불과 복사를 살펴보십시오.
      p3: 조설근가 아직 검토할 힘이 있는 동안, 전달하기로 동의한 챕터 계획의 사본을 별도로 남겨두세요.
    points_fail:
      p1: 이 테이블의 유일한 사본은 작업 페이지 더미로 다시 이동됩니다. 이 지점에서 독자는 주석이 달린 텍스트 없이 떠납니다.
      p2: 서류가 준비되기도 전에 방은 차가워진다. 작업은 또 다른 저녁을 기다립니다.
      p3: 필사자는 느슨한 페이지를 정리할 수 있지만 조설근가 어떤 결말을 남기려고 했는지에 대한 기록은 없습니다.
    shift:
      p1:
        was: Jiaxu 사본은 조설근의 생애 동안 복사되었던 초기 텍스트에 대한 메모를 보존합니다.
      p2:
        was: Jiaxu 원고의 여백 메모에는 조설근의 죽음을 기억하며 책이 미완성 상태로 남겨졌다고 나와 있습니다.
        now: 이 가지에서는 누군가가 불을 피우고 한 번에 한 장씩 가져옵니다. 조설근는 어느 날 저녁 이야기의 방향을 어디로 정할지 결정합니다.
      p3:
        was: Jiaxu 여백 메모에서는 책이 미완성이라고 부르며 조설근가 승인한 최종 장 계획을 제공하지 않습니다.
        now: 복사가 두 장을 가져갑니다. 하나는 조설근가 이 지점에서 승인한 명령을 내립니다. 다른 하나는 그가 아직 결정하지 못한 운명을 나열합니다. 다음 복사에서는 두 시트가 함께 유지됩니다.
        who: cao_xueqin_beijing
        bio: 조설근는 죽기 전에 필사자와 함께 챕터 계획을 검토합니다. 이 지점에서 나중에 독자들은 그가 어떤 결정을 내렸는지, 어디에서 엔딩을 열어두었는지 확인할 수 있습니다.
    vignettes:
      ink: 카피리스트는 제안된 장 순서와 독자가 연필로 추측한 것 사이에서 미끄러짐을 설정합니다. 이제 페이지를 올바른 위치에 다시 놓을 수 있습니다.
      paper: '{staff}는 램프를 운반합니다. 필사자는 공간을 확보하기 위해 테이블 가장자리에서 원고를 들어 올립니다.'
      empty: 마지막 시트에는 다른 제목을 넣을 공간이 있습니다. 카피리스트는 그 공간을 그대로 떠난다.
  jenner_berkeley:
    name: 최초의 백신
    place: 잉글랜드 버클리
    figure: 에드워드 제너
    story: Jenner의 1798년 조사에는 우두와 천연두에 관한 초기 관찰과 사례가 기록되어 있습니다.
    story_prose:
      opening:
        - 버클리에서는 사라 넬메스(Sarah Nelmes)가 앞치마에 손을 대고 문으로 다가옵니다. 제너는 언제 처음 아팠는지 묻고 싶어합니다. 복사기는 자신의 이름을 다른 사람의 계좌에 등록합니다. 그녀는 문 옆에서 기다리며 먼저 그날 낙농장으로 돌아가야 하는지 묻습니다.
        - Jenner의 1798년 조사에는 Sarah의 우두와 1796년의 초기 예방 접종이 기록되어 있으며 전통적으로 James Phipps와 관련이 있습니다. 이 분기에서는 Sarah가 원하는 치료로 시작하고 나중에 돌아온 사람들을 관찰하여 추적할 수 있도록 도울 수 있습니다.
        - 돌봄 경험이 있는 사람에게 Sarah의 말을 먼저 듣도록 하십시오. 기록을 보관하는 여행자는 이름과 날짜를 확인할 수 있으며, 제너와 가족은 추가 관찰을 위해 돌아올지 여부를 결정합니다.
      points:
        p1: 복사기가 데이트를 기다리고 있습니다. 사라는 손을 뒤로 젖히고 자리를 요청합니다. 당신은 의자를 문쪽으로 옮기고 간병인이 보길 원하는지 묻습니다. 그녀가 그렇다고 대답하면 유제품 회사에 그녀가 나중에 다시 올 것이라는 소식을 보냅니다. 나가던 세라는 비어 있는 손으로 자기 이름이 적힌 쪽지를 받았다.
        p2: Jenner의 노트 페이지에는 소년의 재방문에 대해 설명되어 있으며 그 아래에는 아직 수표 날짜가 적혀 있지 않습니다. 나중에 보고서와 직접 기록을 분리하기 위해 복사기에게 새 시트를 제공합니다. Jenner는 누가 추가 관찰을 위해 돌아올 것인지 묻습니다. 한 가구가 주소를 남깁니다. 기록원은 날짜를 적고 가족이 와서 확인할 수 있도록 한 줄을 비워 두었다.
      outcomes:
        all: Sarah에게는 자신의 손을 도와줄 사람이 있고, 돌아온 사람들은 확인할 수 있는 기록을 가지고 있습니다. Jenner는 그 해의 관찰을 통해 계속 작업할 수 있습니다.
        p1: 사라가 낙농장으로 돌아가기까지는 며칠이 걸릴 수 있습니다. 이후의 기록은 여전히 돌아오는 다른 사람들에 달려 있습니다.
        p2: 상담할 후속 관찰이 있습니다. Sarah는 여전히 아픈 손을 스스로 참아내야 합니다.
      none: Sarah는 도움 없이 낙농장으로 돌아가고 아무도 나중에 관찰할 일을 주선하지 않습니다.
      not_admitted: 복사원은 방문객이 어떤 가족과 함께 왔는지 확인합니다. 당신은 밖에 있고 날짜까지의 공간은 여전히 비어 있습니다.
      excerpts:
        p1: 나가던 세라는 비어 있는 손으로 자기 이름이 적힌 쪽지를 받았다.
        p2: 기록원은 날짜를 적고 가족이 와서 확인할 수 있도록 한 줄을 비워 두었다.
    relic: 후속 전표
    relic_desc: 이름, 날짜, 관찰한 내용을 적을 수 있는 공간이 적힌 전표.
    points:
      p1: Sarah Nelmes의 손에 생긴 우두 상처를 치료하여 우유 짜는 사람이 혼자서 고통을 겪지 않도록 하십시오.
      p2: 초기 사례 메모에 있는 이름과 날짜를 확인하고 복귀에 동의하는 가족과 후속 조치를 취합니다.
    points_fail:
      p1: 그녀의 손에 생긴 상처는 치료해 줄 사람이 없이 계속 진행되었습니다. 이 분야에서는 누구도 우유 짜는 일을 편하게 해주지 않았습니다.
      p2: 아무도 재방문을 주선하지 않습니다. 역사상과 마찬가지로 이 분야에서도 제너는 1798년에 백신 연구를 재개했습니다.
    shift:
      p1:
        was: 1796년 5월 낙농장 사라 넬메스(Sarah Nelmes)는 주인의 소에게서 우두에 걸렸고, 그녀의 손에는 일반적인 질병 증상과 함께 커다란 농포성 궤양이 생겼습니다.
        now: '{staff}는 손을 깨끗이 묶은 상태로 유지했으며 며칠 더 일찍 낙농장으로 돌아왔습니다.'
      p2:
        was: 1796년 초기 사례 이후 제너는 1798년 봄에 백신 연구를 재개했습니다.
        now: '{staff}는 기꺼이 가족의 재방문을 주선하는 데 도움을 주었습니다. 그해 여름 Jenner는 이전 관찰과 비교하여 확인하기 위한 후속 메모를 받았습니다.'
        who: jenner_berkeley
        bio: 이 타임라인에서 Jenner는 1796년 여름에 돌아오기로 동의한 가족들로부터 후속 메모를 받았습니다.
    vignettes:
      firsthand: 허구의 필사자가 모든 이야기를 같은 목소리로 썼습니다. 작가가 실제로 본 것이 무엇인지 묻습니다. 필사자는 모든 행에 동일한 가중치를 부여하는 대신 나머지 부분 옆에 메모를 추가합니다.
      order: 두 개의 관측치가 사본에서 위치가 바뀌었습니다. 날짜를 확인하면 복사기가 주문을 사용하여 이야기를 전달하기 전에 전표를 뒤집습니다.
      blank: 복사기가 확인할 수 없는 메모 아래에 공간을 남겨둡니다. 페이지가 전달될 때쯤에는 공백에 라벨이 붙어 있으므로 누구도 누락된 것으로 착각하지 않습니다.
  mallory_everest:
    name: 그들이 마지막으로 목격된 날
    place: 에베레스트산
    figure: 조지 맬러리
    story: 1924년 탐험에서 말로리가 남긴 편지에는 여러 캠프의 상황과 계획이 설명되어 있습니다. Mallory와 어빈의 운명은 그들이 정상에 도달했는지 여부를 결정하지 않습니다.
    story_prose:
      opening:
        - North Col 텐트 옆의 누군가가 노턴이 내려온 후 눈을 뜰 수 있는지 묻습니다. 또 다른 등반가가 다음 등반을 준비하고 있는 말로리를 올려다보고 있습니다. 이전 텐트에 있던 나침반이 그와 함께 돌아오지 않았습니다.
        - 노턴과 서머벨은 1924년에 에베레스트 정상에 다시 올랐습니다. Mallory와 어빈이 그 뒤를 따랐습니다. 6월 8일 오델은 두 명의 등반가가 여전히 올라가는 것을 보았지만 둘 다 돌아오지 않았습니다. 이 분기에서는 앞선 파티를 돕고, 나침반을 돌려주고, 다음 쌍이 North Col로 돌아갈 수 있도록 도울 수 있습니다.
        - 노턴과 서머벨을 돌볼 수 있는 사람을 보내십시오. 캠프 인계에 익숙한 여행자는 나침반을 찾을 수 있습니다. 마지막 하강을 위해 다음 일행이 캠프로 돌아갈 수 있도록 도울 수 있는 사람을 보내십시오.
      points:
        p1: 노턴이 다시 소리쳐 불렀다. 대답하지 못한 서머벨은 무릎에 손을 얹었다. 앞서가던 사람을 불러 앉을 자리를 찾고, 서머벨이 자기 상태를 말할 수 있을 때까지 기다렸다. 그가 고개를 끄덕이자 둘이서 발치의 가방을 옮겼다. 그는 일어서서 노턴이 몸은 괜찮냐고 끝까지 묻기를 기다렸다.
        p2: 노턴은 빛이 아프다고 말하고 다시 눈을 감는다. 당신은 그에게 쉴 곳을 선택하고 사무실 간병인이 그를 볼 수 있도록 요청합니다. 시간이 좀 지난 후에도 그는 한 부분이 여전히 아프고 다른 쪽 눈으로 약간의 빛을 알아볼 수 있다고 말했습니다. 담당자가 명단을 다시 들어 올리자 노턴은 자신의 항목을 직접 찾았다.
        p3: 오델은 Camp V에서 케이스를 열고 여분의 품목 옆에서 작은 둥근 상자를 찾습니다. Mallory의 메시지와 비교하여 확인하고 태그와 함께 가져옵니다. 그는 다른 등반가 앞에서 그것을 열고 올라가는 동안 사용할 주머니에 밀어 넣습니다. 그는 배낭을 벗지 않고도 손이 닿는 곳에 직접 나침반을 넣었다.
        p4: North Col의 누군가가 구름에서 나오는 두 인물이 그들이 기다리고 있는 사람인지 묻습니다. 직원에게 이름을 입력하라고 요청하기 전에 이름을 말할 때까지 기다립니다. Mallory는 눈 위에 짐을 싣고 어빈은 더 안쪽에 앉습니다. 두 사람은 하산길을 이야기했다. 야영지에서는 정상에 올랐는지, 몇 시에 올랐는지 아무도 알지 못했다.
      outcomes:
        all: 서머벨과 노턴이 돌아오고 Mallory는 나침반을 가지고 있습니다. North Col에서 반환된 두 개의 이름이 더 기록됩니다.
        p1: 첫 번째 파티의 두 등반가 모두 캠프로 돌아갑니다. 다음 쌍에는 여전히 그들을 만날 누군가가 필요합니다.
        p2: 이 지점에서 노턴은 근처에 있는 글을 스스로 읽을 수 있을 만큼 충분히 볼 수 있습니다. 다른 결과는 나머지 여행을 따릅니다.
        p3: Mallory는 손이 닿는 주머니에 나침반을 가지고 있습니다. 그것이 돌아오면 가장 먼 지점이 불확실해집니다.
        p4: Mallory와 어빈은 살아서 North Col으로 돌아옵니다. 변경된 하강으로 인해 정상에 도달했는지 여부가 공개됩니다.
      none: 바람과 눈이 캠프에 도달하고 아무도 목록을 바꾸지 않습니다. 오델은 나중에 능선에서 마지막으로 본 두 인물을 기록할 것입니다.
      not_admitted: 캠프 수행원은 낯선 사람에게 텐트에 자리를 주지 않을 것입니다. 장비 누락에 대해 논의하는 동안 밖에서 기다립니다.
      desync: 서머벨은 노턴과 함께 돌아 오지 않습니다. 이전 하강이 동기화되지 않고 사무실에서 여행자를 회상합니다.
      excerpts:
        p1: 그는 일어서서 노턴이 몸은 괜찮냐고 끝까지 묻기를 기다렸다.
        p2: 담당자가 명단을 다시 들어 올리자 노턴은 자신의 항목을 직접 찾았다.
        p3: 그는 배낭을 벗지 않고도 손이 닿는 곳에 직접 나침반을 넣었다.
        p4: 두 사람은 하산길을 이야기했다. 야영지에서는 정상에 올랐는지, 몇 시에 올랐는지 아무도 알지 못했다.
    relic: 얼음 도끼
    relic_desc: 머리가 낡은 평범한 나무 얼음도끼입니다.
    points:
      p1: 서머벨이 내리막길에서 질식할 때 그가 숨을 쉬도록 도와주고 노턴과의 시도가 안전하게 끝나는 것을 확인하세요.
      p2: 노턴의 설맹을 치료하세요
      p3: 캠프 V에 남겨진 말로리 나침반을 그의 손에 넘겨주세요
      p4: Mallory와 어빈을 되돌리거나 내려가는 길에 만나서 둘 다 살아서 North Col에 도달하세요.
    points_fail:
      p1: 서머벨은 눈 속에 앉아 일어나지 않습니다. 두 명의 등반가 중 한 명만 돌아옵니다. 이 지점은 역사에서 사라졌고 사무실에서는 직원을 소환합니다.
      p2: 노턴의 눈은 너무 아파서 뜰 수가 없었고, 다음 날에는 아무것도 볼 수 없었습니다.
      p3: 나침반은 아직 캠프 V의 텐트 안에 있습니다. 두 사람이 6월 8일에 등반했을 때 나침반은 없었습니다.
      p4: 6월 8일 정오 이후 얼마 후 오델은 능선에서 여전히 오르고 있는 두 개의 높이를 마지막으로 보았습니다. 그들은 돌아오지 않습니다.
    shift:
      p1:
        was: 1924년 6월 4일 노턴과 서머벨은 Camp VI에서 출발하여 약 8,570m에 도달했습니다. 내려가는 길에 서머벨의 목이 동상에 걸린 조직에 막혔고 그는 거의 숨이 막히고 기침을 했고 둘 다 캠프에 도착했습니다.
      p2:
        was: 1924년 6월 4일 밤, 노턴은 심하게 눈이 멀어 North Col로 돌아온 후 거의 앞을 볼 수 없었습니다.
        now: 다음 날 노턴의 눈은 맑아졌고 North Col을 오가는 사람들을 볼 수 있었습니다.
      p3:
        was: 1924년 6월 7일 말로리는 캠프 VI에서 오델에게 메모를 보냈는데, 캠프 V의 텐트에 나침반을 두고 왔는데 나침반이 없었다는 내용이었습니다.
        now: 그들이 6월 8일 초에 출발했을 때 Mallory는 자신의 주머니에 나침반을 가지고 있었습니다.
      p4:
        was: 1924년 6월 8일 오델은 Mallory와 어빈이 북동쪽 능선에서 높이 오르는 것을 마지막으로 보았고 둘 다 돌아오지 않았습니다. 말로리의 시신은 1999년 해발 약 8,160m에서 발견됐다.
        now: 6월 9일 두 사람은 동상에 걸렸지만 살아 있는 상태로 North Col로 내려왔습니다. Mallory는 Ruth와 그들의 세 자녀가 있는 영국의 집으로 돌아갔습니다. 그들이 그날 어디로 갔는지는 이 시간선에서도 답이 없습니다.
        who: mallory_everest
        bio: 1924년에 그와 어바인은 살아서 에베레스트에서 내려왔습니다. 그는 아내 Ruth와 세 자녀가 있는 집으로 돌아가서 수년을 더 살았습니다.
    vignettes:
      date: 가상의 메신저는 서로 다른 진영에서 보낸 두 통의 편지를 가지고 있지만 운반 전표에는 날짜가 하나 공유되어 있습니다. 제목을 별도로 확인하도록 요청합니다. 각 편지에는 고유한 장소와 날짜가 표시됩니다.
      question: 메신저는 예정된 출발을 약속으로 읽습니다. 편지에서 날씨에 관해 이야기하는 문장에서 멈춥니다. 이번에는 조건을 붙인 채로 계획을 반복합니다.
      wrap: 메신저가 무릎 위에 서류를 분류하는 동안 보내는 봉투를 따로 보관해 둡니다. 캠프 목록을 편지로 접지 않고도 보관할 수 있습니다.
  nightingale_scutari:
    name: 기록과 돌봄으로 세운 간호
    place: 오스만 제국 스쿠타리
    figure: 플로렌스 나이팅게일
    story: 군대 건강에 관한 플로렌스 나이팅게일(플로렌스 나이팅게일)의 1858년 보고서에는 최근의 전쟁에 관한 내용이 포함되어 있으며 병원 통계도 포함되어 있습니다. 이는 최종 보고서를 작성하는 것이 아닙니다.
    story_prose:
      opening:
        - 스쿠타리의 와드 교대가 방금 변경되었습니다. 나이팅게일은 직원에게 전학 목록을 건네주고 새로운 입학과 별도로 보관해 달라고 요청합니다. 위생위원회가 도착했고 세 명의 위원이 둘러보기 시작하려고 합니다.
        - 1855년 3월 위생 위원회는 스쿠타리의 병원을 조사했습니다. 헥터 개빈은 4월 발라클라바에서 사고로 사망했습니다. 나이팅게일은 5월에 그곳에서 중병에 걸렸고 즉시 회복되었으며 그 후 건강이 좋지 않았습니다. 여기서 검사를 보존하고 검사 결과를 변경할 수 있습니다.
        - 와드 기록을 잘 아는 사람이 검사를 진행하는 데 도움을 줄 수 있습니다. 캠프에서 여행자에게 개빈을 찾아보게 하세요. 나중에 간병을 제공하는 사람이 나이팅게일에게 어떻게 쉬고 싶은지 물어볼 수 있습니다.
      points:
        p1: 직원은 전학 목록을 신규 입학으로 간주합니다. 위원이 문에 도착하기 전에 간호사에게 두 장을 모두 읽고 중복된 부분을 표시하게 합니다. 다음 장소에 대해 문의하기 전에 문제가 있는 병동에 보고 내용을 따라갈 수 있습니다. 누군가 장부 두 권을 들고 나왔다. 두 권 모두 빈 쪽이 많이 남아 있었다.
        p2: 개빈은 텐트에 있는 형에게 리볼버를 건네주려고 합니다. 캠프 안전 책임자가 가져갈 때까지 두 사람 모두 잠시 멈춰달라고 요청합니다. 안쪽 테이블에서 개빈은 가져가려고 했던 위생 메모를 펼칩니다. 그날 오후 누군가 서명을 받으러 왔을 때도 그는 같은 탁자에 앉아 있었다.
        p3: 나이팅게일은 수치표를 보내어 수치가 나오면 따로 보관해 달라고 요청합니다. 당신은 사무실 간병인이 남아서 다른 날 답변을 기대하는 사람들에게 말하기를 원하는지 묻습니다. 기분이 좋아지면 먼저 창문을 조금 열어달라고 부탁한다. 그런 다음 그녀는 어디서 그만뒀는지 묻습니다. 다시 보고서를 펼쳤을 때, 어서 서명하라고 재촉하는 사람은 없었다.
      outcomes:
        all: 검사는 정시에 계속됩니다. 개빈은 이 지점의 사고에서 살아남았고, 나이팅게일은 5월 병에서 회복되었습니다. 그녀는 자신이 선택할 수 있는 속도로 직장으로 돌아갑니다.
        p1: 위원회는 조사를 시작하고 추가 작업을 위해 사용 가능한 목록을 가져옵니다.
        p2: 개빈은 캠프에 안전하게 남아 있습니다. 그는 위생 기록부에 기록된 작업을 계속할 수 있습니다.
        p3: 나이팅게일은 이 지점에서 더 빨리 회복됩니다. 그녀는 피규어를 다시 열 준비가 되었을 때를 선택합니다.
      none: 한동안 와드에는 목록이 섞여 있습니다. 소식을 기다리는 사람들은 여전히 4월과 5월의 편지를 기다릴 것이다.
      not_admitted: 포터는 검사대 밖의 사람들에게 기다려달라고 요청합니다. 간호사가 이송 목록을 다시 확인하는 소리가 들립니다.
      desync: 검사가 정시에 시작되지 않습니다. 와드 기록이 동기화되지 않고 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: 누군가 장부 두 권을 들고 나왔다. 두 권 모두 빈 쪽이 많이 남아 있었다.
        p2: 그날 오후 누군가 서명을 받으러 왔을 때도 그는 같은 탁자에 앉아 있었다.
        p3: 다시 보고서를 펼쳤을 때, 어서 서명하라고 재촉하는 사람은 없었다.
    relic: 작은 기름 램프
    relic_desc: 그녀의 밤에는 램프가 돌아다닌다.
    points:
      p1: 병동의 발진티푸스와 콜레라를 통해 3월 6일부터 스쿠타리 병원에 대한 위생 위원회의 검사를 계속합니다.
      p2: 발라클라바 텐트에서 리볼버 발사를 막고 위생국장 헥터 개빈을 구출하세요
      p3: 5월에 발라클라바에 갇힌 나이팅게일의 크림열병을 치료하세요. 나이팅게일이 평생 동안 그녀와 함께 있기 전에
    points_fail:
