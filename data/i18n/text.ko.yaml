  schumann_endenich:
    name: 다른 조로 옮긴 곡
    place: 엔데니히
    figure: 로베르트 슈만
    story: 로베르트 슈만이 엔데니히에서 지냈던 시절의 짧은 피아노 작품 사본이 남아 있습니다. 그는 공개된 악보보다 전체 톤을 낮게 설정했습니다. 1856년 7월 클라라 슈만(Clara Schumann)이 본(Bonn)에 와서 그를 만나자고 요청했습니다. 게스트하우스에서 Lina는 곡을 두 번 복사했습니다. 그녀는 낮은 것이 실수라고 생각합니다.
    story_prose:
      opening:
        - 1856년 7월 본 외곽의 엔데니히. 로베르트 슈만은 건강이 좋지 않은 상태로 이곳에 머물고 있습니다. 그는 한때 Papillons의 작품 중 하나를 전체 톤 낮은 수준으로 복사했습니다. 이번 달에 클라라 슈만이 그를 만나러 온다.
        - 역사상 클라라는 7월 27일에 그를 만났습니다. 29일에 돌아왔을 때는 너무 늦었어요. 이 지점에서 여관의 Lina는 서로 다른 첫 번째 음표로 두 개의 복사본을 만들었고 Emil은 골목에 있는 두 개의 문을 알고 있습니다.
        - 이번 여행에는 두 악보에서 같은 곡을 알아볼 수 있는 사람이 필요합니다. 또한 길을 알고, 약속을 지키고, 근처에서 소식을 기다릴 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 두 악보를 모두 읽고 간격은 동일하게 유지하면서 시작 음표가 어떻게 아래로 이동했는지 표시했습니다. Lina는 각 페이지 상단에 열쇠를 썼습니다. 그녀는 두 장의 복사본을 폴더에 나란히 밀어 넣었고, 좁은 흰색 가장자리가 보였습니다.'
        p2: 7월 27일, {staff}는 약속대로 클라라를 만났고 그녀가 예상했던 문으로 차선을 건너갔습니다. 편지가 열리자 클라라는 접힌 메모를 손에 넣어두었습니다. 문 밖에는 아직도 저녁빛이 비스듬히 남아 있었다.
        p3: 29일, {staff}는 근처에서 소식을 기다리다가 돌아오는 길에 클라라를 만나 곧바로 침대 옆으로 데려갔습니다. 그녀는 앉아서 담요 가장자리 아래로 손을 뻗었습니다. 로버트의 손은 그녀의 손바닥 위에 가만히 놓여 있었다.
      outcomes:
        all: 두 복사본 모두 하나의 폴더에 보관되었으며 각 복사본의 키는 맨 위에 기록되어 있습니다. 29일 클라라가 침대 곁에 도착했다. 골목길의 문은 아직 열려 있었고, 방 안에서는 두 손이 맞물려 있었다.
        p3: 29일 클라라가 침대 곁에 도착했다. 나중에 그녀가 일어났을 때 의자는 여전히 침대 바로 옆에 당겨져 있었습니다.
        p2: 27일 방문은 여전히 황혼 무렵이었다. 문이 천천히 닫히기 전에 차선의 빛이 희미해졌습니다.
        p1: 두 연습용 사본은 모두 하나의 폴더에 보관되었습니다. 다시 열어보니 각 시트 상단에 열쇠가 적혀 있었습니다.
      none: 하위 연습 사본이 외부에 남아 있는 상태로 폴더가 닫혔습니다. 그 가장자리에는 여전히 좁은 전표가 보였다.
      not_admitted: '{staff}는 차선에서 소개할 사람을 찾지 못했습니다. 길 건너편의 두 문은 모두 닫혀 있었습니다.'
      desync: 클라라는 면회 시간이 지날 때까지 반대편 문에서 기다렸습니다. {staff}가 회수되었을 때 접힌 메모는 여전히 코트 주머니에 남아 있었습니다.
      excerpts:
        p3: 그녀는 앉아서 담요 가장자리 아래로 손을 뻗었습니다. 로버트의 손은 그녀의 손바닥 위에 가만히 놓여 있었다.
        p2: 편지가 열리자 클라라는 접힌 메모를 손에 넣어두었습니다. 문 밖에는 아직도 저녁빛이 비스듬히 남아 있었다.
        p1: Lina는 각 페이지 상단에 열쇠를 썼습니다. 그녀는 두 장의 복사본을 폴더에 나란히 밀어 넣었고, 좁은 흰색 가장자리가 보였습니다.
    relic: 두 조로 적은 연습 악보
    relic_desc: 서로 다른 조로 적은 가상의 연습 악보 두 장.
    points:
      p1: 두 복사본을 비교하고 낮은 톤으로 시작하는 복사본도 폴더에 속하는 이유를 적어보세요.
      p2: 7월 27일 클라라의 방문을 예정된 시간 이전에 만나고 오른쪽 문으로 안내하여 예정대로 유지하세요.
      p3: 7월 29일, 전화를 받고 로버트가 죽기 전에 클라라를 침대 옆으로 다시 데려오세요.
    points_fail:
      p1: Lina는 낮은 버전을 따로 설정합니다. 폴더를 여는 다음 사람은 게시된 키의 버전만 볼 수 있습니다.
      p2: 클라라는 엉뚱한 문에서 기다리다 면회 시간을 놓친다. 이번 방문이 일정에서 벗어나면 사무실에서 귀하를 소환합니다.
      p3: Clara가 Endenich로 돌아왔을 때 Robert는 이미 사망했습니다.
    shift:
      p1:
        was: 엔데니히 시대의 빠삐용 10번에 대한 슈만의 사인은 이 작품을 C장조에서 B플랫 장조로 바꿉니다.
        now: Lina는 두 연습용 사본을 함께 보관합니다. 각 메모의 맨 위에 키를 기록하므로 다음 플레이어는 첫 번째 메모 모두 복사 오류가 아님을 알 수 있습니다.
      p2:
        was: 7월 23일, 브람스와 리차르츠 박사는 클라라에게 기다리라고 촉구했습니다. 그녀는 7월 27일 저녁 6시에서 7시 사이에 로버트를 방문했습니다.
      p3:
        was: 7월 29일 클라라는 로베르가 죽은 후 브람스와 요제프 요아킴과 함께 엔데니히로 돌아왔습니다.
        now: '{staff}는 돌아오는 길에 클라라를 만나 곧바로 방으로 데려옵니다. 그녀는 로버트가 죽기 전에 그의 손을 잡습니다.'
        who: schumann_endenich
        bio: Endenich에서 Clara는 Robert가 1856년 7월 29일에 사망했을 때 옆에 있었습니다.
    vignettes:
      key: Lina는 각 사본의 첫 번째 음부터 시작합니다. 두 번째 마디가 끝나기 전에 그녀는 {staff}를 올려다봅니다. 손가락이 키보드의 다른 곳에 있어도 그녀는 다음에 무엇이 올지 알고 있습니다.
      envelope: 에밀은 클라라가 다시 기다려야 한다면 접힌 쪽지를 전해 주겠다고 약속했습니다. 그는 {staff}에게 어느 문을 먼저 시도할지 묻습니다. 그들은 그가 두 가지를 모두 볼 수 있는 차선 옆으로 건너갑니다.
      gift: 실제 원고는 결국 슈만의 딸 마리에게 전달될 예정이다. 여기 게스트하우스에서 Lina는 연습용 사본의 시작을 표시하기 위해 두 장의 종이 전표를 남깁니다. {staff}가 뚜껑을 들어 올리면 한 쪽이 다른 쪽 뒤로 미끄러졌습니다.
  nietzsche_turin:
    name: 뒷면에 적힌 주소
    place: 토리노
    figure: 프리드리히 니체
    story: 토리노에서 보낸 편지는 Franz Overbeck과 Ida Overbeck에게 전달되었습니다. 니체는 디오니소스에 서명했습니다. 프란츠는 친구의 숙소에 도착했을 때 그가 니체와 바그너의 교정본을 읽고 있는 것을 발견합니다. 그들이 토리노를 떠날 때쯤이면 누군가는 증거와 함께 사건에 어떤 내용이 들어갈지 결정해야 할 것입니다.
    story_prose:
      opening:
        - 1889년 1월 토리노. 프란츠 오버베크(Franz Overbeck)와 이다 오버베크(Ida Overbeck)에게 편지가 도착했습니다. 서명과 수신인은 별도의 장소에 있습니다. 프란츠가 토리노에 도착했을 때 니체는 니체와 바그너의 마지막 증거물을 읽고 있습니다.
        - 역사상 오버벡은 1월 8일에 친구를 만났고 나중에 그가 읽은 내용을 기록했습니다. 이 지점에는 피에트로가 계단 옆에 수하물 라벨을 두고 왔고, 루시아는 아직 포장해야 할 편지 묶음이 남아 있습니다.
        - 이 여행에는 주소를 확인하고 방문객을 올바른 문으로 안내할 만큼 인내심이 있는 사람이 필요합니다. 또한 증거와 사적인 편지를 나열하고 보관하는 방법을 아는 사람이 필요합니다.
      points:
        p1: 1월 8일, {staff}는 문 번호와 주소를 확인하고 계단에서 Overbeck을 기다렸다가 그를 다른 곳으로 데려갔습니다. 프란츠는 오른쪽 문에 멈춰서서 한 번 노크했다. 페이지가 안쪽으로 넘어가고 손잡이가 천천히 반 바퀴 움직였습니다.
        p2: '{staff}는 교정쇄와 편지를 별도로 나열하여 한 라벨에는 책 제목을, 다른 라벨에는 수령인만 표시했습니다. 각 패킷에는 자체 문자열 조각이 있습니다. 루시아는 받는 사람의 이름이 적힌 라벨을 안쪽으로 돌리고 엄지손가락으로 모서리를 눌렀습니다.'
      outcomes:
        all: 1월 8일 오버벡은 니체를 발견했습니다. 나중에 두 패킷은 함께 이동했습니다. 그는 제목이 적힌 것을 열었고, 다른 하나는 매듭이 여전히 뚜껑을 향하고 있는 채로 돌아갔습니다.
        p2: 서류는 두 묶음으로 다음 사람의 손에 전달되었습니다. Overbeck은 제목을 알아보고 다른 패킷을 케이스 바닥에 다시 놓았습니다.
        p1: 1월 8일 Overbeck은 친구의 방으로 들어갔습니다. 그의 뒤에서 문이 닫히자 페이지를 넘기는 소리가 부드럽게 들려왔다.
      none: 서류는 한 묶음으로 포장되어 있었고, 편지와 교정본에 이름이 모두 표시되어 있었습니다. 래퍼는 끈을 잡아당겨 어느 쪽으로 묶을지 고민했습니다.
      not_admitted: '{staff}는 숙소에서 소개할 사람을 찾지 못했습니다. 난간에는 아직 빈 수하물 라벨이 남아 있었습니다.'
      desync: 다른 문에서는 아무도 대답하지 않았습니다. 기관이 {staff}를 회수했을 때 Overbeck은 여전히 착륙 중이었습니다.
      excerpts:
        p2: 각 패킷에는 자체 문자열 조각이 있습니다. 루시아는 받는 사람의 이름이 적힌 라벨을 안쪽으로 돌리고 엄지손가락으로 모서리를 눌렀습니다.
        p1: 프란츠는 오른쪽 문에 멈춰서서 한 번 노크했다. 페이지가 안쪽으로 넘어가고 손잡이가 천천히 반 바퀴 움직였습니다.
    relic: 짐표 사본
    relic_desc: 게임 속 분기에 등장하는 가상의 짐표 사본. 뒷면에는 받을 사람의 이름이 적혀 있다.
    points:
      p1: 숙소 주소를 확인하고 1월 8일에 오버벡을 오른쪽 문으로 데려가세요
      p2: 각 묶음이 다른 묶음을 열지 않고도 전달할 수 있도록 개인 편지와 별도로 수정된 교정본을 기록하십시오.
    points_fail:
      p1: Overbeck은 잘못된 숙소로 안내되고 회의 일정이 늦어지자 사무실에서는 해당 직원을 소환합니다.
      p2: 편지와 교정쇄는 동일한 포장지에 들어갑니다. 수정 사항을 찾는 첫 번째 사람도 글자에 있는 이름을 볼 수 있습니다.
    shift:
      p1:
        was: Nietzsche는 Turin에서 Overbecks에게 편지를 썼습니다. 프란츠 오버베크(Franz Overbeck)는 그를 찾기 위해 1889년 1월 8일 그곳에 도착했습니다.
      p2:
        was: Overbeck은 나중에 Nietzsche가 도착했을 때 Nietzsche와 Wagner의 마지막 증거를 읽고 있었다고 회상했습니다.
        now: 교정쇄와 편지는 별도의 포장지에 담겨 배송됩니다. Overbeck은 다른 봉인을 깨지 않고도 한 눈에 수정 사항을 찾을 수 있습니다.
    vignettes:
      address: 피에트로는 디오니소스를 인벤토리의 대상 라인에 복사했습니다. {staff}는 전표를 뒤집어서 수신자의 이름을 보여줍니다. 그는 자신이 쓴 글 전체에 다시 읽을 수 있을 만큼 가볍게 한 줄을 그었습니다.
      privacy: Lucia는 {staff}에게 서류를 포장하는 동안 가방을 들어달라고 요청합니다. 계단에서 누군가가 누구냐고 묻는다. 그녀는 대답하기 전에 라벨을 벽에 붙였습니다.
      stairs: 착륙장에서 {staff}는 페이지 바스락거리는 소리를 듣습니다. 그때 누군가가 아래를 두드리자 피에트로는 빈 수하물 라벨을 계단 난간에 놓아 다시 찾을 수 있게 했습니다.
  sophie_germain_paris:
    name: 베를린에 보낼 논문
    place: 파리
    figure: 소피 제르맹
    story: 소피 제르맹(소피 제르맹)은 칼 프리드리히 가우스(Carl Friedrich Gauss)와 정수론에 대한 연구를 교환했으며, 처음에는 르 블랑(Le Blanc)이라는 편지에 서명했습니다. 1816년 과학 아카데미는 진동판에 대한 연구로 그녀에게 상을 수여했습니다. 그녀는 1829년 병에 걸린 후에도 계속 일했습니다. 베를린에 있는 크렐레의 일지 7권에는 표면의 곡률에 대한 그녀의 회고록이 그녀의 이름으로 실렸습니다. 그녀는 1831년 6월 27일 파리에서 사망했습니다.
    story_prose:
      opening:
        - 1831년 파리. 젊은 여성이었던 소피 제르맹은 르 블랑이라는 이름으로 가우스와 정수론을 논의했습니다. 그녀는 진동판에 대한 연구로 상을 받았습니다. 병에 걸린 후에도 그녀는 표면의 곡률에 관한 논문 작업을 계속했으며, 결국 베를린에 있는 Crelle의 저널에 게재되었습니다.
        - 역사상 그녀는 6월 파리에서 사망했다. 일부 전기 작가는 가우스가 괴팅겐에서 그녀를 명예 학위로 추천했다고 기록합니다. 그녀는 평생 그런 학위를 받지 못했습니다. 이 지점에서는 물 운반선이 여전히 Rue de Savoie의 계단을 오르고 있으며 위층에는 책상 위에 편지를 놓을 공간이 있습니다.
        - 이번 여행에는 수학 원고를 확인하고 도중에 볼 수 있는 사람이 필요합니다. 환자의 고통을 덜어주거나 해외 학자들의 소식을 전하는 일도 있다.
      points:
        p1: '{staff}는 페이지별로 표기를 확인하고 잎사귀를 순서대로 정리한 후 베를린으로 향하는 택배기사의 손에 종이가 전달되는 것을 보았습니다. 제르맹은 한 손끝으로 톱 시트를 잡았다. {staff}가 손을 빼자 포장지 가장자리가 페이지 상단의 마지막 문자 바로 위로 왔습니다.'
        p2: '{staff}는 치료 경험을 바탕으로 통증을 완화하고 책상으로 직접 이동할 수 있을 때까지 머물렀습니다. 그녀는 완성되지 않은 페이지에 손을 뻗어 가까이 끌어당겼습니다. 빛이 책상에 닿았을 때 그녀의 손은 펜을 느끼고 있었습니다.'
        p3: '{staff}는 가우스의 추천서를 가져와서 편지의 내용을 따라 천천히 읽어주었습니다. Germain은 페이지를 가져와 처음부터 끝까지 읽었습니다. 그녀가 그것을 내려놓았을 때, 두 개의 접힌 부분이 여전히 얇은 모서리를 지탱하고 있었습니다.'
      outcomes:
        all: 베를린의 저널은 나중에 그녀의 논문을 인쇄했습니다. 파리 책상에서 그녀는 통증이 완화되는 동안에도 일을 하려고 손을 뻗을 수 있었고, 가우스가 자신의 이름을 내걸었다는 소식을 계속해서 읽었습니다. 편지는 더미의 한쪽 모서리를 누르고 가장자리가 말려 있었습니다.
        p3: 아직 학위가 너무 늦었습니다. 그 소식은 파리에 먼저 도착했고, 편지는 접힌 부분을 따라 조금씩 들어 올려 책상 위에 아직도 남아 있었습니다.
        p2: 통증이 완화되자 다시 책상에 앉을 수 있는 순간도 있었습니다. 책상 중앙에는 그녀가 놔둔 그대로 몇 장의 시트가 펼쳐져 있었습니다.
        p1: 이 논문은 베를린에서 제7권에 게재되었습니다. 그 머리에는 인쇄된 이름인 소피 제르맹이 있었습니다.
      none: 위층 램프가 일찍 꺼졌습니다. 여전히 양동이가 계단 벽에 부딪혔고, 의자는 이미 책상 밑으로 밀려져 있었습니다.
      not_admitted: '{staff}는 Rue de Savoie에 있는 위층 방에 들어가지 않았습니다. 누군가가 양동이를 들고 지나가고 있었는데, 그 양동이의 나무 손잡이가 손바닥 안에서 돌아가고 있었습니다.'
      desync: 봉인되지 않은 원고가 책상 위에 펼쳐져 있었다. {staff}가 리콜되었을 때, 빈 포장지는 여전히 열려 있었고 위쪽으로 펄럭였습니다.
      excerpts:
        p3: Germain은 페이지를 가져와 처음부터 끝까지 읽었습니다. 그녀가 그것을 내려놓았을 때, 두 개의 접힌 부분이 여전히 얇은 모서리를 지탱하고 있었습니다.
        p2: 그녀는 완성되지 않은 페이지에 손을 뻗어 가까이 끌어당겼습니다. 빛이 책상에 닿았을 때 그녀의 손은 펜을 느끼고 있었습니다.
        p1: 제르맹은 한 손끝으로 톱 시트를 잡았다. {staff}가 손을 빼자 포장지 가장자리가 페이지 상단의 마지막 문자 바로 위로 왔습니다.
    relic: ‘르블랑’이라는 서명이 있는 편지
    relic_desc: 빌린 이름으로 가우스에게 보낸 편지.
    points:
