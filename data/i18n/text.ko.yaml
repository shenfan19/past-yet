  beethoven_vienna:
    name: 교향곡 제9번
    place: 비엔나
    figure: 루트비히 판 베토벤
    story: 1824년 봄, 거의 귀머거리가 된 베토벤은 비엔나에서 그의 신작 연주회를 준비했습니다. 합창단과 오케스트라는 따로 리허설을 했고, 그날 밤까지 전체 리허설은 두 번밖에 없었습니다. 1824년 5월 7일, 9번 교향곡이 Kärntnertor Theatre에서 처음으로 공연되었으며, 극장의 Kapellmeister Michael Umlauf가 지휘하고 베토벤이 그 옆 무대에 섰습니다. 5월 23일 Redoutensaal에서 반복된 공연은 얄팍한 결과를 낳았고 영수증은 그를 실망시켰습니다.
    story_prose:
      opening:
        - 1824년 봄, 비엔나. 베토벤은 거의 귀머거리가 되었습니다. 그는 9번 교향곡을 마지막으로 그의 신작 콘서트를 준비하고 있습니다. 오케스트라가 리허설에서 연주하는 내용을 누군가가 대신 대화록에 적어 주어야 합니다.
        - 역사상 합창단과 관현악단은 별도의 방에서 연습을 하다가 초연 이틀 전에 처음으로 한자리에 모였다. 5월 7일 초연 이후 콘서트는 23일 Redoutensaal에서 다시 열렸는데, 많은 좌석이 비어 있었고 영수증은 그를 실망시켰습니다. 이 지점에서는 아직 건조되지 않은 부분이 복사기 테이블 위에 추 아래 놓여 있고, 극장 뒤에서 소프라노는 목을 문지르며 마지막 악장의 높은 음에 대해 불평합니다.
        - 이 여행에는 세 종류의 사람들이 도움을 줄 수 있습니다. 악보를 읽고 두 그룹이 처음 함께 리허설을 할 때 비트를 잡아줄 수 있는 사람, 무엇이 잘못되었는지 듣고 작곡가를 위해 하나씩 적어줄 수 있는 사람, 그리고 마을 사람들이 떠나기 전에 좌석을 팔 만큼 설득력 있는 사람.
      outcomes:
        all: 5월 23일 밤에도 홀에는 여전히 빈 자리가 많았지만 앞쪽에 예약된 줄은 가득 찼습니다. 그 목록은 그때부터 그의 대화록에 그대로 남아 있었습니다.
        p3: 5월 23일 밤에도 홀에는 여전히 빈 자리가 많았지만 예약한 줄은 꽉 찼습니다.
        p2: 초연 당일 밤에는 모든 섹션이 표시된 항목을 표시된 대로 재생했습니다. 그 시트는 나중에 그의 대화록에 그대로 남아 있었습니다.
        p1: 5월 7일 저녁, 합창단과 오케스트라가 같은 박자에 맞춰 들어왔습니다. 베토벤은 청중을 등지고 움라우프 옆에 서 있었습니다.
      none: 5월 23일 홀에는 램프 아래에 빈 의자가 줄지어 가지런히 놓여 있었습니다.
      desync: 5월 5일 합동 리허설에서 양측은 한 번도 함께한 적이 없습니다. {staff}가 리콜되었을 때 초연은 이틀 동안 쉬었고 오케스트라 연주자들은 여전히 어떤 비트를 넣을지 논쟁을 벌이고 있었습니다.
      not_admitted: '{staff}는 극장 백스테이지에 한 번도 가본 적이 없습니다. 합창단과 오케스트라는 여전히 각자의 방에서 연습 중이었고, 초연은 며칠밖에 남지 않았습니다.'
      points:
        p1: 5월 5일, 합창단과 오케스트라가 처음으로 한 방에 모였습니다. 오프닝 바에서는 양쪽이 각자의 속도로 들어왔습니다. {staff}는 오케스트라와 합창단 사이에 서서 두 사람이 모두 볼 수 있도록 악보의 박자를 비트별로 표시했습니다. 그들은 다시 갔고, 양측은 마지막 비트에서 함께 나왔습니다. 베토벤은 귀가 들리지 않는 구석에 서서 모든 활과 모든 입이 동시에 멈추는 것을 보았습니다.
        p2: 드레스 리허설 당일 {staff}는 전날 합동 리허설에서 잘못됐던 출품작을 어느 부분, 어느 소절, 무엇이 빠졌는지 메모해 한 장에 복사해 베토벤에게 건넸다. 그는 오랫동안 종이를 눈 가까이에 대고 펜으로 여러 곳에 표시를 했습니다. 그가 그것을 돌려주었을 때, 자국 위에 자국이 있었습니다.
        p3: 5월 말부터 마을의 부유한 가족들은 트렁크를 시골로 보내기 시작했습니다. {staff}는 프로그램을 가지고 호별 방문을 했습니다. 한 집에서는 관리인이 문을 반만 열고 주인이 내일 모레 떠난다고 말했습니다. {staff}는 프로그램을 펼치고 교향곡 9번의 대사를 가리키며 그 곡을 쓴 사람이 더 이상 들을 수 없다고 말했습니다. 청지기는 시트를 안으로 가져가더니 보증금에 대한 메모를 가지고 돌아왔습니다. 그날 저녁 예약된 좌석 목록이 베토벤의 숙소로 전달되었습니다. 그는 대화책 밑에 시트를 깔고 이름을 하나씩 읽어보고 마지막에 도달하면 위에서부터 다시 읽었습니다.
