  chekhov_badenweiler:
    name: 프리데리케 별장에 보내는 답장
    place: 바덴바일러
    figure: 안톤 체호프
    story: 1904년 6월, 결핵을 앓고 있는 44세의 안톤 체호프(안톤 체호프)는 그의 아내 올가 크니퍼(Olga Knipper)와 함께 블랙 포리스트(Black Forest)에 있는 바덴바일러(Badenweiler) 온천에 왔습니다. 그들은 처음에는 Hotel Römerbad에 머물렀고, 그 다음에는 Villa Friederike에 머물렀고, 그 다음에는 우체국 옆에 있는 Hotel Sommer에 머물렀습니다. 그는 집에 유쾌한 편지를 썼고, 7월에는 친구들에게 어떤 증기선을 타고 바다를 건너 러시아로 돌아갈 수 있는지 물었습니다. 그는 7월 15일 이른 아침에 그곳에서 사망했습니다.
    story_prose:
      opening:
        - 1904년 6월, 블랙 포리스트의 스파인 바덴바일러. 안톤 체호프는 44세이며 결핵으로 중병을 앓고 있습니다. 그는 모스크바에서 야위었고 숨이 가빠졌습니다. 그와 그의 아내 올가 크니퍼(Olga Knipper)는 러시아에서 기차를 타고 먼 곳까지 왔고, 둘 다 지친 상태에서 먼저 호텔 뢰메르바트(Hotel Römerbad)에 방을 잡습니다.
        - 역사상 그들은 Villa Friederike로 이동한 다음 우체국 옆 Hotel Sommer로 이동했습니다. 그의 집으로 보낸 편지는 유쾌했고 7월 11일에 어느 증기선이 그 편지들을 바다를 통해 러시아로 가져갈 수 있는지 묻는 편지를 썼습니다. 그는 7월 15일 이른 아침에 그곳에서 사망했습니다. 이 지점에서는 별장 가정부가 해가 진 후 야외용 의자를 옮기고, 우체국 밖에 있는 우체부가 러시아 편지를 들어 올려 우표가 충분히 찍혔는지 알려준다.
        - 이 여행에는 세 종류의 사람들이 도움을 줄 수 있습니다. 편지와 주소를 안전하게 보관할 수 있는 주의 깊은 사람, 일련의 질문을 짧은 전보 하나로 압축할 만큼 인내심이 있는 사람, 약을 알고 나노 키트를 가지고 오는 사람.
      outcomes:
        all: 그해 여름이 지나자 체호프와 올가는 배를 타고 러시아로 돌아갔습니다. 갑판에는 바람이 강했고, 그는 플란넬 슈트의 단추를 하나씩 채워 나갔다.
        p3: 여름이 지나고 체호프와 올가는 러시아로 떠났다. 플랫폼에서 그는 플란넬 슈트를 입었습니다.
        p2: 전보의 얇은 시트는 책상 위에 펼쳐져 있었고, 선실 주위의 선은 그의 손가락으로 부드럽게 문질러졌다.
        p1: 마리아는 편지를 받았습니다. 봉투 뒷면에는 빌라 프리데리케의 주소가 글자 하나하나 정확하게 적혀 있었습니다.
      none: 바덴바일러의 7월은 더웠습니다. 발코니에 있는 데크 의자는 하루 종일 태양을 따라갔다가 저녁이 되면 뒤로 옮겨졌습니다.
      desync: '{staff}가 리콜되었을 때 책상은 이미 비어 있었습니다. 마리아는 아직도 오빠가 어디에 머물고 있는지 몰랐습니다.'
      not_admitted: '{staff}는 빌라에 들어가지 않았습니다. 정원에는 저녁 7시까지 해가 떠 있었고, 위층에서는 한 남자가 몇 줄의 편지를 쓰며 쉬어야 했다.'
      points:
        p1: 6월 25일, 빌라 프리데리케에서의 셋째 날, 체호프는 책상에 앉아 마리아에게 편지를 썼고 몇 줄마다 쉬었습니다. {staff}는 편지 끝부분에 있는 반송 주소를 한 글자씩 확인했더니 거리와 집 번호가 모두 정확하게 나왔다. 체호프는 편지 밑에 서명을 하고 펜을 내려놓은 뒤 의자에 등을 기대고 숨을 고르며 창밖을 바라보았다.
        p2: 7월 11일 방은 한증탕만큼 뜨거웠습니다. 그의 편지에서 Chekhov는 증기선이 떠난 날짜와 시간, 며칠이 걸렸는지, 2인용 선실이 있는지를 하나씩 물었습니다. {staff}는 질문을 짧은 전보 하나로 압축하여 경로를 아는 사람에게 보냈습니다. 답장이 왔을 때, 항해하는 날, 바다에서 보낸 날, 선실에서 보낸 날이 모두 얇은 시트 한 장에 적혀 있었습니다. 올가는 그에게 그 책을 읽어 주었고, 그녀가 선실 근처의 줄에 도달했을 때 그는 그녀에게 다시 읽어 달라고 요청했습니다.
        p3:
          class_learned: '{staff}는 먼저 옛날 방식대로 흉부를 듣고 호흡수를 세어본 뒤 나노 키트를 열어 체중에 맞춰 복용량을 정하고 매일 아침 저녁으로 진료를 받았습니다. 7월의 더위 속에서 그는 기침을 덜 했다. 열흘 정도 지나면 그는 발코니에서 혼자 방으로 돌아와 책상에 앉을 수 있었습니다. 올가는 프라이부르크에서 플란넬 슈트를 가져왔습니다. 그는 그것을 입고 거울 앞에 잠시 서 있었습니다.'
          else: '{staff}는 나노 키트를 열고 지시사항에 따라 복용량 구획을 구성했으며 침대 옆에서 약을 투여하고 체온을 측정하는 시간을 유지했으며 밤에는 가끔씩 그의 호흡을 관찰했습니다. 7월의 더위 속에서 그는 기침을 덜 했다. 열흘 정도 지나면 그는 발코니에서 혼자 방으로 돌아와 책상에 앉을 수 있었습니다. 올가는 프라이부르크에서 플란넬 슈트를 가져왔습니다. 그는 그것을 입고 거울 앞에 잠시 서 있었습니다.'
      excerpts:
        p3: 열흘 정도 지나면 그는 발코니에서 혼자 방으로 돌아와 책상에 앉을 수 있었습니다. 올가는 프라이부르크에서 플란넬 슈트를 가져왔습니다. 그는 그것을 입고 거울 앞에 잠시 서 있었습니다.
        p2: 답장이 왔을 때, 항해하는 날, 바다에서 보낸 날, 선실에서 보낸 날이 모두 얇은 시트 한 장에 적혀 있었습니다. 올가는 그에게 그 책을 읽어 주었고, 그녀가 선실 근처의 줄에 도달했을 때 그는 그녀에게 다시 읽어 달라고 요청했습니다.
        p1: '{staff}는 편지 끝부분에 있는 반송 주소를 한 글자씩 확인했더니 거리와 집 번호가 모두 정확하게 나왔다. 체호프는 편지 밑에 서명을 하고 펜을 내려놓은 뒤 의자에 등을 기대고 숨을 고르며 창밖을 바라보았다.'
