      river: '{staff}는 뱃사공이 유프라테스 강둑에서 보리를 내리는 것을 돕고 있습니다. 자루를 세면서 뱃사공은 저울질하는 사람이 자신의 자루 중 하나를 속이면 가서 왕의 돌 앞에 서서 그에게 법을 낭송할 것이라고 말합니다. 그러나 그 자신은 그 자루의 표시를 읽을 수 없습니다.'
      roof: '{staff}와 견습생은 하루 중 최악의 더위 속에서 새 태블릿을 지붕 위에 놓아 건조시켰습니다. 견습생은 세다가 중간에 세다가 새가 지나갈까 두려워 다시 시작합니다.'
  ibn_battuta_tangier:
    name: 긴 여정이 시작될 무렵
    place: 탕헤르, 모로코
    figure: 이븐 바투타
    story: 1325년 6월, 이븐 바투타는 고향인 탕헤르를 떠났습니다. 리흘라(Rihla)에서 그는 동반자나 캐러밴 없이 두 부모를 남겨두고 떠난 것을 회상했습니다. 그가 모로코로 돌아온 후 Ibn Juzayy에게 지시한 기록에는 거의 30년에 걸친 여정이 담겨 있습니다.
    story_prose:
      opening:
        - 1325년 6월, 모로코 탕헤르. 20대 초반의 이븐 바투타는 이제 막 긴 여행을 떠날 예정이며, 그의 부모는 아직 집에 있습니다. 거의 30년 후 그는 집으로 돌아와 자신이 본 것을 Ibn Juzayy에게 구술했고 그것이 Rihla가 되었습니다.
        - 역사상 그는 동행자도 없고 함께할 대상도 없이 혼자 성문을 나갔다. 밀리아나에서 그가 따라잡았던 튀니스 술탄의 사절 두 명은 더위로 인해 병에 걸렸고, 그들 중 한 명은 3일 밤 후에 마을 밖의 개울가에서 사망했습니다. 베자이아를 지나서 그는 다시 열병에 걸렸고, 그는 터번 천으로 안장에 몸을 묶었습니다. 그가 튀니스에 입성하던 날, 마을에서 나온 사람들 중 그를 아는 사람은 한 명도 없었고 그는 눈물을 참지 못했다. 이 지점에서는 이웃이 분수대에서 물통을 채우고, 마을 가장자리에 있는 짐꾼은 첫 번째 도로만 알고 있습니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 간호에 대해 잘 알고 충분한 수분 보충용 소금과 물을 가져온 사람; 매우 강인한 사람, 또는 진통제를 복용하고 이를 악물고 더위와 충격을 견디는 사람; 낯선 마을의 문 앞에 나서는 마음 따뜻한 사람.
      outcomes:
        all: 그해 가을, 튀니스 술탄의 두 사절이 모두 이 마을로 돌아왔습니다. 이븐 바투타는 튀니스에서 두 달을 머물렀는데, 그날 그와 함께 걸어온 사람은 그가 묵고 있던 곳에 자주 들러 잠시 앉아 있었다. 나중에 그는 더 큰 대상을 데리고 동쪽으로 갔다.
        p2: 그해 가을, 두 사절은 차례로 튀니스로 돌아왔습니다. 두 번째로 아픈 사람이 말을 탔는데, 시냇물에서 가져온 물그릇이 그의 안장에 걸려 있었습니다.
        p3: 그는 튀니스에서 두 달을 머물렀다. 그 날 그 사람과 함께 들어온 사람은 그가 묵고 있는 곳에 자주 와서 잠시 앉아 있었고, 주로 길에 대한 이야기를 나누었습니다.
        p1: 그는 결코 안장에서 떠나지 않았고 튀니스까지 버텼습니다. 터번 천은 나중에 그의 머리 주위로 돌아갔고, 그와 함께 동쪽으로 먼 길을 갔다.
      none: 7월에는 밀리아나 외곽 개울가에서 대상단이 3일 동안 멈춰 섰고 사절 중 한 명이 다시 일어나지 못했습니다. 9월, 튀니스 성문에서 나온 사람들이 다른 남자들의 욕을 했고, 그는 고삐를 잡고 군중 가장자리에 서서 큰 소리로 울었다.
      desync: 8월에 콘스탄틴을 지나서 매듭이 풀렸습니다. {staff}가 회수되었을 때 캐러밴은 도로 한가운데에 멈춰 있었고 터번 천은 빈 안장에 매달려 있었고 한쪽 끝은 여전히 묶여 있고 다른 쪽 끝은 땅에 질질 끌렸습니다.
      not_admitted: '{staff}는 탕헤르에서 발판을 찾지 못했고 이웃을 위해 분수대에서 물을 몇 번 나르기도 했습니다. 6월 14일 초, 한 젊은이가 동물을 데리고 성문 밖으로 나갔는데, 그 옆에는 동료도 없고 뒤에는 캐러밴도 없었습니다.'
      points:
        p2:
          class_medical: 7월, 밀리아나 외곽 4마일 떨어진 개울가. 두 사절 모두 더위로 인해 병에 걸렸고 대상은 3일 밤 동안 물가에 멈춰 있었습니다. 둘 중 더 나쁜 사람은 거기 누워 있었고 말을 할 때 거의 눈을 뜨지 않았습니다. {staff}는 간호학에서 가르치는 대로 플라스크에 담긴 냉각된 끓인 물에 재수화 소금 두 봉지를 휘젓고 고개를 들어 한 번에 한 모금씩 먹인 다음 젖은 천을 그의 이마와 목 뒤에 대고 자주 갈아 주었습니다. 넷째 날 아침 그는 혼자 일어나 물그릇을 양손에 쥐고 물기를 다 마시고 돌려주었다. 캐러밴은 계속 이동하기 위해 짐을 꾸렸고, 돌 사이로 시냇물이 여전히 요란하게 흐르고 있었습니다.
          else: 7월, 밀리아나 외곽 4마일 떨어진 개울가. 두 사절 모두 더위로 인해 병에 걸렸고 대상은 3일 밤 동안 물가에 멈춰 있었습니다. 둘 중 더 나쁜 사람은 거기 누워 있었고 말을 할 때 거의 눈을 뜨지 않았습니다. {staff}는 가져온 의료용 키트를 열고 열을 내리고 밤새 잠도 자지 않고 옆에 머물며 물을 한 모금씩 마실 때까지 기다렸습니다. 넷째 날 아침 그는 혼자 일어나 물그릇을 양손에 쥐고 물기를 다 마시고 돌려주었다. 캐러밴은 계속 이동하기 위해 짐을 꾸렸고, 돌 사이로 시냇물이 여전히 요란하게 흐르고 있었습니다.
        p1:
          class_medical: 8월, 콘스탄티누스를 지나 이븐 바투타에게 열병이 다시 찾아왔습니다. 베자이아에서는 한 친구가 이미 그에게 그가 나을 때까지 머물라고 권했지만 그는 머물지 않았습니다. 이번에는 열이 너무 심해 넘어질까 봐 터번 천으로 안장에 몸을 묶었습니다. {staff}는 간호학을 가르치는 동안 멈출 때마다 그의 이마와 손목을 만져보고 젖은 천을 몇 번이고 갈아주고 그가 물을 삼키는 것을 지켜보며 그를 위해 매듭을 다시 한 번 단단히 잡아주었습니다. 밤에 대상이 멈췄을 때 그는 여전히 안장 위에 앉아 동물의 목에 기대어 있었습니다. 물껍질을 입술에 대고 두 모금 마시고, 손을 뻗어 다시 매듭이 느껴지는 것을 느꼈습니다.
          else: 8월, 콘스탄티누스를 지나 이븐 바투타에게 열병이 다시 찾아왔습니다. 베자이아에서는 한 친구가 이미 그에게 그가 나을 때까지 머물라고 권했지만 그는 머물지 않았습니다. 이번에는 열이 너무 심해 넘어질까 봐 터번 천으로 안장에 몸을 묶었습니다. {staff}는 한 손으로 고삐를 잡고 그의 동물 옆에서 내내 걸었고, 몸이 흔들릴 때마다 손을 바꾸지 않고 하루 종일 태양 아래서 손을 뻗어 안장 위로 다시 밀어 넣었습니다. 밤에 대상이 멈췄을 때 그는 여전히 안장 위에 앉아 동물의 목에 기대어 있었습니다. 물껍질을 입술에 대고 두 모금 마시고, 손을 뻗어 다시 매듭이 느껴지는 것을 느꼈습니다.
        p3: 9월, 캐러밴이 튀니스에 도착했습니다. 마을 사람들은 일행 상인들의 이름을 부르며 차례로 손을 잡고 나왔다. 이븐 바투타를 아는 사람은 아무도 없었습니다. 그는 여전히 고삐를 잡고 군중 가장자리에 서 있었습니다. 길에서 그와 많은 이야기를 나누던 {staff}가 그의 옆으로 다가와 그의 이름을 부르며 그날 밤 어디서 자고 있었는지 물었다. 그는 소매로 얼굴을 닦고, 꽉 쥐고 있던 고삐를 다른 손으로 옮겼다. 두 사람은 환영하는 군중을 뒤로하고 문을 통과해 들어갔습니다.
      excerpts:
        p2: 넷째 날 아침 그는 혼자 일어나 물그릇을 양손에 쥐고 물기를 다 마시고 돌려주었다. 캐러밴은 계속 이동하기 위해 짐을 꾸렸고, 돌 사이로 시냇물이 여전히 요란하게 흐르고 있었습니다.
        p3: 그는 소매로 얼굴을 닦고, 꽉 쥐고 있던 고삐를 다른 손으로 옮겼다. 두 사람은 환영하는 군중을 뒤로하고 문을 통과해 들어갔습니다.
        p1: 밤에 대상이 멈췄을 때 그는 여전히 안장 위에 앉아 동물의 목에 기대어 있었습니다. 물껍질을 입술에 대고 두 모금 마시고, 손을 뻗어 다시 매듭이 느껴지는 것을 느꼈습니다.
    relic: 여행길에 닳은 샌들
    relic_desc: 밑창을 여러 번 갈아 끼운 가죽 샌들.
    points:
      p1: 베자이아에서 오는 길에 튀니스에 도착할 때까지 열이 나서 그를 안장에 가둬 두었다.
      p2: 밀리아나에서 더위로 쓰러진 튀니스 사절을 구출하세요
      p3: 튀니스에 입성하는 날, 낯선 마을에 혼자가 아니라는 사실을 알려주세요.
    points_fail:
      p1: 열병이 반쯤 지나서 그는 안장에서 떨어졌고, 이 지점에서 그는 튀니스에 결코 도달하지 못했습니다.
      p2: 역사에 따르면 사절은 밀리아나 외곽의 개울가에서 사망했고, 이 지점에서는 단 한 명의 사절만이 튀니스를 향해 나아갔습니다.
      p3: 역사에 따르면 그는 문 앞에서 큰 소리로 울었고, 이 지부에서 그날 그와 함께 마을로 걸어들어간 사람은 동료 여행자뿐이었습니다.
    shift:
