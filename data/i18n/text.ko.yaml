      p2: 그녀는 이겨내지 못하고 역사에서와 마찬가지로 그 달에 죽은 자매 중 한 명입니다. 이 가지에는 병실의 또 다른 침대가 비어 있습니다.
      p3: 역사상과 마찬가지로 그녀는 4월 17일에 사망했습니다. 이 지점에서 그녀는 4월까지 살지 않습니다.
    shift:
      p1:
        was: 1695년 봄, 멕시코시티에 전염병이 돌았고, 소르 후아나는 병에 걸린 자매들을 돌보았습니다.
      p2:
        was: 1695년 봄 전염병으로 인해 수녀원의 수녀들이 많이 사망했습니다.
        now: 그 자매는 4월까지 살았고, 건강이 좋아진 후에 다시 돌아와 병실을 도왔습니다.
