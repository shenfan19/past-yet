    figure: 루트비히 볼츠만
    story: 1877년에 루트비히 볼츠만(루트비히 볼츠만)은 에너지 분포가 발생할 수 있는 방법을 세어 열의 법칙을 원자 통계와 연결했지만, 20세기에도 많은 사람들은 여전히 원자가 실제로 존재하는지 의심했습니다. 1906년 5월 심각한 신경쇠약증으로 인해 강의를 중단하고 그해 여름 가족과 함께 트리에스테 근처의 두이노로 갔습니다. 그는 9월 5일 62세의 나이로 그곳에서 사망했습니다. 2년 후 장 페랭(Jean Perrin)의 브라운 운동 실험은 아인슈타인의 예측을 확증하기 시작했고 원자가 받아들여지게 되었습니다.
    story_prose:
      opening:
        - 1906년 여름, 트리에스테 근처의 두이노 만. 루트비히 볼츠만은 아내와 딸과 함께 이곳에서 휴가를 보내고 있습니다. 거의 30년 전에 그는 얼마나 많은 배열이 동일한 에너지 분포를 제공할 수 있는지 계산하고 열의 법칙을 원자에 연결했습니다. 지금도 많은 사람들은 원자가 실제로 존재한다고 믿지 않습니다.
        - 역사상 그해 5월 그는 중증 신경쇠약증으로 인해 강의를 중단했고, 스테판 마이어(Stefan Meyer)가 강의를 맡았습니다. 9월 5일 그는 62세의 나이로 두이노(Duino)에서 사망했습니다. 2년 후 페랭의 브라운 운동 실험은 원자에 대한 증거가 되기 시작했습니다. 이 지점에서는 어부가 해변에서 그물을 말리고, 어린 소년이 해변에서 자갈을 세고, 호텔 하녀가 매일 바다에서 수건을 가져옵니다.
        - 두 종류의 사람들이 이번 여행에 도움을 줄 수 있습니다. 원자에 관해 그와 이야기할 만큼 충분히 배운 사람과 의학을 아는 사람이 올바른 치료법을 가져와 아픈 사람 옆에 머물 수 있습니다.
      outcomes:
        all: 9월에는 비엔나행 열차가 두이노에서 출발했습니다. 볼츠만은 창가에 앉아 있었고 그의 코트 주머니는 몇 장의 작업복으로 가득 차 있었다.
        p2: 9월에는 비엔나행 열차가 두이노에서 출발했습니다. 그는 창가에 앉아 바다를 끝까지 바라 보았습니다.
        p1: 그해 여름 내내 작업복은 그의 코트 주머니에 남아있었습니다.
      none: 두이노 만은 매우 고요했다. 호텔 테라스에서 작업한 시트 몇 장이 테이블에서 바닥으로 날아갔습니다.
      not_admitted: '{staff}는 가족 근처에도 가지 못했습니다. 매일 호텔 테라스에 앉은 남자는 바다를 바라보며 앉아 있었고, 휴일은 날이 갈수록 짧아졌다.'
      points:
        p1: 8월 초 어느 날 저녁, 볼츠만은 호텔 테라스에 앉아 있었고, 몇 장의 작업물이 테이블 위에 놓여 있었습니다. {staff}는 하나를 선택하고 물 속의 작은 입자의 떨림으로 시작했습니다. 아인슈타인이 1년 전에 그러한 떨림이 입자를 얼마나 멀리 운반해야 하는지를 어떻게 계산했는지, 그리고 2년 후에 누군가가 현미경으로 그것을 어떻게 측정할 것인지. 그는 말없이 끝까지 듣고 시트를 네모로 만들어 코트 주머니에 넣었습니다. 방으로 돌아가면서 그는 그 주머니에 손을 얹고 있었습니다.
        p2:
          class_learned: 의사처럼 {staff}는 매일 약 복용 시간과 수면 시간을 정하고 아침 저녁으로 맥박을 재며 낮에는 그와 함께 해안을 따라 스트레칭을 했습니다. 8월 말이 되자 그는 전보다 밤에 더 오래 잠을 자게 되었고, 아침에는 혼자서 바다로 걸어갔다가 다시 돌아올 수 있게 되었습니다. 어느 날 아침 식사 시간에 그는 딸을 보내 비엔나행 기차가 몇 시에 출발하는지 물어보게 했습니다.
