    relic: 천공 카드
    relic_desc: 뚫린 구멍의 배열로 기계에 어떤 연산을 할지 지시하는 카드.
    points:
      p1: Lovelace의 허락을 받아 그녀의 번역과 메모를 함께 보내주세요.
      p2: 마지막 교정으로 돌아가기 전에 Lovelace와 합성자에게 Note G의 표를 읽고 다른 열에 들어갈 가능성이 가장 높은 항목을 표시하게 합니다.
      p3: 그녀의 업무 분담을 가능한 후원자를 위한 짧은 제안서에 넣으세요. Lovelace는 사업을 조직하고 Babbage는 엔지니어링을 이끌며 두 사람 모두 첫 번째 회의에 동의했습니다.
    points_fail:
      p1: 프린터는 진행하라는 지시와 기다리라는 지시를 모두 받습니다. 해당 문제에서 번역 및 메모를 추출하고 사무실에서 해당 직원을 리콜합니다.
      p2: 합성기는 여러 기호를 재설정하고 아무도 처음부터 행을 읽지 않습니다. 그녀는 지난 몇 시간 동안 공식과 표를 서로 확인해야 합니다.
      p3: 그녀의 제안은 배비지의 대답으로 끝난다. 다른 사람이 작업 지원에 대해 문의하면 둘 다 기꺼이 넘겨줄 계획이 없습니다.
    shift:
      p1:
        was: 1843년 8월 배비지는 그녀에게 편집자의 철회 허가를 요청했습니다. Lovelace는 이를 거부했고 번역본과 그녀의 이니셜이 포함된 메모는 그해에 함께 게재되었습니다.
      p2:
        was: 8월 15일 Lovelace는 그녀의 어머니에게 프린터가 추가 감독을 위해 그녀를 불렀으며 수학 공식을 수정하는 데 시간이 걸린다고 말했습니다.
        now: 프린터는 열별로 확인한 증거를 보관합니다. 기호를 재설정해야 하는 경우 합성기는 이를 사용하여 인접한 열을 확인할 수 있습니다.
      p3:
        was: 8월 14일 Lovelace는 Babbage가 엔지니어링에 시간을 할애할 수 있도록 자신과 다른 후원자들이 사업을 수행할 것을 제안했습니다. 그는 그녀의 조건을 거절했습니다.
        now: 그들은 한 명의 예비 후원자에게 도면과 비용 개요를 보여주는 데 동의합니다. 방문자는 누가 무엇을 할지에 대한 계정을 가져가고 기술 검토 후 돈에 대해 결정하는 데 동의합니다.
        who: lovelace_london
        bio: Lovelace는 기사를 번역하고 기술 노트를 작성했습니다. 그녀는 또한 여전히 대부분 종이에 존재하는 엔진에 대한 작업을 구성하는 방법을 모색했습니다.
    vignettes:
      messenger: '{staff}는 세인트 제임스 광장에 있는 한 집 현관 아래에서 메신저로 기다리고 있지만 메신저는 앉지 않습니다. 그 안에서 누군가 글을 쓰고, 지우고, 다시 씁니다. 땅거미가 질 무렵, 아직 부드러운 왁스가 묻어 있는 편지가 Dorset Street를 가리키는 {staff}의 손에 들어갑니다.'
      compositor: '{staff}는 컴포지터가 유형을 선택하는 데 도움이 됩니다. 이 문제는 모두 그리스 문자, 인덱스 및 선 위에 설정된 작은 숫자입니다. 그는 투덜대며 시그마 상자가 거의 비어 있고 그것을 쓴 사람이 직접 와서 설정해야 합니다.'
      loom: '{staff}는 Spitalfields의 직공 집 문에 멈춥니다. 자카드 직기에서 천공 카드를 차례대로 뒤집으면 비단에 꽃이 피어납니다. 직공은 카드가 자신보다 패턴을 더 잘 안다고 말합니다.'
  mendel_brno:
    name: 완두와 유전의 법칙
    place: 브르노
    figure: 그레고어 멘델
    story: 1856년부터 1863년까지 그레고어 멘델(그레고어 멘델)은 브르노에 있는 자신의 집 정원에서 완두콩을 교배하고 그 자손의 수를 세었습니다. 1865년 2월 8일과 3월 8일에 그는 브르노 자연사 협회에 두 번의 회담 결과를 보고했고, 그 논문은 1866년 협회의 회보에 인쇄되었습니다. 그의 생애 동안 거의 채택되지 않았습니다. 멘델은 1884년에 사망했고, 1900년에 세 명의 식물학자가 유전에 관해 연구하던 중 그의 논문을 발견했습니다.
    story_prose:
      opening:
        - 1865년 겨울 브르노. 1856년부터 수도사 그레고어 멘델(그레고어 멘델)은 수도원 정원에서 완두콩을 교배하고 그 자손의 세대를 세대별로, 즉 8년 동안 세어왔습니다. 올 겨울 그는 브르노 자연사학회에서 그 수치를 발표할 예정이다.
        - 역사상 그는 2월 8일과 3월 8일에 두 차례 강연을 했고, 이 논문은 다음 해 학회 회보에 게재되었습니다. 그의 생애 동안 그 이상으로 나아가는 사람은 거의 없었습니다. 그는 1884년 브르노에서 사망했고, 1900년이 되어서야 세 명의 식물학자가 각기 그 곳을 발견했습니다. 이 지점에서는 문지기가 회의실 문 앞에 돗자리를 깔아주고, 배추시장에서는 노파가 말린 완두콩을 팔고 있다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 두 대화를 모두 안전하게 지킬 수 있는 조심스러운 사람; 세대별로 숫자를 가르치고 정리할 수 있는 사람; 회의가 끝나기 전에 청취자가 집에서 완두콩을 다시 재배하는 데 동의하도록 설득할 수 있는 사람.
      outcomes:
        all: 그해 가을, 다른 곳에서 온 편지가 수도원에 도착했는데, 다른 정원에는 완두콩이 세어져 있었습니다. 멘델은 테이블 위의 자신의 숫자 옆에 그것을 펼쳐 놓았고, 그 옆에는 세대별 숫자가 적힌 시트가 놓여 있었습니다.
        p3: 그해 가을, 다른 곳에서 온 편지가 수도원에 도착했는데, 다른 정원에는 완두콩이 세어져 있었습니다. 멘델은 두 세트의 숫자를 테이블 위에 나란히 놓고 한 줄씩 내려갔습니다.
        p2: 말씀을 들은 사람들 중 몇몇은 세대별 계수서를 복사하여 집으로 가져갔습니다. 다음 해에 절차가 발표되었을 때 그들은 사본을 대조하여 확인했고 모든 감방이 동의했습니다.
        p1: 1866년에 두 강연은 식물 잡종 실험이 되어 학회 회보의 제4권에 인쇄되었습니다. 수도원 정원에는 평소와 같이 그 해의 완두콩이 들어갔습니다.
      none: 1866년에 그 신문은 협회의 회보에 실렸지만, 그 이상으로 받아들이는 사람은 거의 없었습니다. 수도원 정원에는 겨울마다 완두콩 틀이 비어 있었습니다.
      desync: 2월 8일 저녁에는 방법을 설명할 시간만 있었고 2차 강연은 정해지지 않았다. {staff}가 회수되었을 때 멘델의 원고 대부분은 회의실 테이블 모서리 아래에 그대로 눌려져 있었습니다.
      not_admitted: '{staff}는 결코 협회 회의실에 들어가지 않았고 양배추 시장에서 할머니가 말린 완두콩을 분류하는 것을 도우며 며칠을 보냈습니다. 한 더미에는 둥근 것들이 있고 다른 더미에는 주름진 것들이 있습니다. 그녀는 그것을 세지 않았습니다.'
      points:
        p1:
          class_lettered: 2월 8일 저녁, 동회 회의실에 등불이 켜졌고, 문 앞의 짚자리 위에 눈이 녹아 웅덩이가 되었습니다. 멘델의 손에는 8년의 숫자가 쥐어져 있었습니다. 전날, {staff}는 기록 보관인처럼 원고를 두 더미로 나누어 오늘 저녁이 어디인지 표시하기 위해 종이 조각에 넣은 다음 두 번째 더미에 다음 강연 날짜를 적었습니다. 분할 페이지에 이르렀을 때 그는 멈춰 서서 원고의 나머지 부분을 정사각형으로 만들어 가방에 넣었습니다. 회의가 중단되었을 때 다음 회담 날짜는 이미 회의록에 3월 8일로 나와 있었습니다.
