  about:
    version_line: '{v}, {date} 공개'
    dedication: 첫 버전은 2026년 11월 19일에 완성했습니다. 중산대학교의 쑨원 선생 동상 앞에서 시작하는 이 이야기는 선생의 탄생 160주년을 기립니다.
