  modigliani_paris:
    name: 초상화 뒤의 작은 표
    place: 파리
    figure: 아메데오 모딜리아니
    story: 1919년 5월 말, 아메데오 모딜리아니와 Jeanne Hébuterne는 그 전 11월에 태어난 딸과 함께 니스에서 파리로 돌아왔습니다. 결핵은 점점 심해졌고, 가을이 되자 더 이상 그림을 그릴 힘이 없어졌습니다. 1920년 1월 24일 그는 결핵성 수막염으로 파리 샤리테 병원에서 35세의 나이로 사망했습니다. 이틀 후, 임신 8개월이던 잔느가 부모님 집에서 사망했습니다. 그의 동료 화가들은 1월 27일 그의 장례식을 위해 돈을 모았습니다. 2년 전 그의 생애 유일한 개인전은 상업적으로 실망스러운 것이었다.
    story_prose:
      opening:
        - 1920년 1월, 파리. 모딜리아니와 잔느 에뷔테른이 딸과 함께 니스에서 돌아온 지 6개월이 넘었습니다. 그의 병은 악화되었습니다. 가을이 되자 그는 붓을 잡는 데 어려움을 겪었습니다.
        - 역사상 Modigliani는 Charité 병원에서 사망했으며 Jeanne은 이틀 후에 사망했습니다. 이 지점에서는 여전히 누군가가 스튜디오에 노크를 하고 병원이나 잔느 옆에서 차례를 지낼 수 있습니다.
        - 이번 여행에는 화가의 말을 들을 사람과 적절한 물품을 가지고 환자를 돌볼 수 있는 사람이 필요합니다. Jeanne은 또한 그녀와 함께 앉아서 기다릴 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 초상화를 빛 속으로 옮기고 앞으로 몇 년이 지나면 그의 그림 속 사람들을 보기 위해 사람들이 먼 길을 올 것이라고 말합니다. 라벨의 모서리가 뒤에서 올라옵니다. Modigliani는 초상화를 돌리고 슬립을 손바닥에 얹습니다.'
        p2: '{staff}는 스튜디오에 도착하여 그들이 아는 치료로 환자를 안정시키고 그를 병원으로 데려가는 사람들을 따라갑니다. 누군가 문앞으로 의자를 가져옵니다. 와드가 인계를 받은 경우에만 {staff}가 잡고 있던 프레임에서 멀어집니다.'
        p3: 병원에서 {staff}는 가져온 장비로 그를 치료하고 그가 스스로 컵을 내려놓을 때까지 기다립니다. 컵이 테이블을 두드린다. 모딜리아니는 다른 손을 뻗어 좀 더 안쪽으로 밀어 넣습니다.
        p4: '{staff}는 Jeanne과 함께 머물며 그녀가 먹을 수 있을 때까지 기다렸다가 그녀가 손이 닿는 곳에 그릇을 남겨 둡니다. Jeanne은 무릎에 그릇을 들고 있습니다. 창문에 있는 종이가 외풍 속에서 들어올려지면 그녀는 그 모서리를 가장자리 아래로 내립니다.'
      outcomes:
        all: 스튜디오가 다시 문을 열었고 Jeanne은 붓을 들었습니다. 테이블 옆에는 낮은 의자 두 개가 놓여 있었는데, 창가에 있는 의자에는 페인트 얼룩이 묻어 있었습니다.
        p3: 모딜리아니는 회복된 후 스튜디오로 돌아갔습니다. 미완성된 얼굴이 테이블 위에 놓여 있고, 페이지 가장자리에는 붓이 놓여 있습니다.
        p4: Jeanne은 다시 그림을 그렸습니다. 두 아이가 잠든 후, 그녀는 등불 옆에 종이 한 장을 펼쳤습니다.
        p1: 몇 년 후 누군가가 초상화 앞에 멈춰 섰습니다. 라벨은 여전히 프레임 뒤에 걸려 있었습니다.
        p2: 병원에서는 그를 데려갔다. 그와 함께 걸었던 사람은 문 안쪽 의자에 앉았다.
      none: 스튜디오 문 옆에는 아무도 없었습니다. 어두워지면 그 아래의 얇은 빛조차 사라졌습니다.
      not_admitted: '{staff}는 스튜디오에 도착하지 않았습니다. 석탄 자루는 여전히 계단 모퉁이 벽에 붙어 있었습니다.'
      desync: 병원으로의 이송이 중단되었습니다. 기관이 {staff}를 회수했을 때 착륙장 절반은 여전히 비어 있었습니다.
