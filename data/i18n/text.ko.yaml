      p2: 그는 집으로 돌아가고 싶은 희망에 대한 답을 얻지 못한 채 라벤나에서 계속해서 글을 쓰고 있습니다. 이 지점에서는 그 뒤에 무슨 일이 일어났는지 아무도 말해주지 않습니다.
