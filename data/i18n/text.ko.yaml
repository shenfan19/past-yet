      turnips: 10월에 {staff}는 집주인이 뒷마당에서 순무를 캐는 것을 돕습니다. 그녀는 인플루엔자가 다시 마을에 돌아왔고, 학생 기숙사의 절반이 비어 있고, 셀 수 있는 것이 없기 때문에 빵 쿠폰 계산을 중단했다고 말합니다.
