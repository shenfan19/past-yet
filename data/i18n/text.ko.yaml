catalog:
  sun_yat_sen_guangzhou:
    name: 동상에서 새 대학으로
    place: 광저우
    figure: 쑨원
    story: 중산대학교의 쑨원 동상 앞에 서자 1924년 2월 4일의 광저우로 돌아간다. 이날 쑨원은 세 학교를 합쳐 국립 광둥대학을 세우라고 지시하고, 쩌우루에게 준비를 맡긴다. 같은 시기 그는 일요일마다 고등사범학교 강당에서 강연한다. 강연 기록은 여러 사람의 손을 거쳐 한 권의 책이 된다. 9월 19일에 수업이 시작되고, 11월 11일 창립식에서는 그가 쓴 교훈을 사용한다. 1925년 3월 12일 베이징에서 그가 세상을 떠난 뒤, 1926년 대학은 그의 이름을 따 새 이름을 얻는다.
    relic: 쑨원 동상
    relic_desc: 중산대학교 캠퍼스에 있는 동상. 1924년 광저우로 가는 통로이며 골동품이 아니어서 팔 수 없다.
    points:
      p1: 성 밖에 학생 모집 공고를 붙일 경로를 짜서 전달원에게 건네기
      p2: 소개를 받아 세 학교를 방문하고 첫 회의 전에 사정을 한 장으로 정리해 제출하기
      p3: 후보지를 둘러보고 스파이가 결정되기 전에 비교 지도를 제출하기
      p4: 세 학교 졸업 명단을 대조하고 6월 21일 행사에 쓸 통합 명부를 제출하기
      p5: 스파이로 가는 일행에 합류해 새 교지에 경계 말뚝을 세우기
    points_fail:
      p1: 이 분기에서는 공고가 시내에만 붙어, 성 밖의 학생들이 소식을 들었을 때는 이미 접수가 시작된 뒤였다.
      p2: 제1차 준비 회의는 역사대로 열렸고, 세 학교의 어려움은 여전히 따로따로 말해질 뿐 한데 모은 목록은 없었다.
      p3: 새 캠퍼스는 역사대로 스파이로 정해졌고, 준비처 책상에는 후보지를 한데 그린 지도가 없었다.
      p4: 6월 21일 졸업식은 예정대로 열렸다. 준비위원회는 여전히 세 학교의 명단을 따로 확인해야 했다.
      p5: 스파이의 교지는 역사대로 종이 위에만 그어졌고, 땅에는 경계 말뚝이 하나도 서지 않았다.
    shift:
      p1:
        was: 1924년 6월 9일 국립 광둥대학은 각 성의 교육청에 학생 모집을 맡겼고, 6월 10일 예과 시험 접수를 시작했다. 모집 계획은 520명이었다.
        now: 이 분기에서는 성 밖의 길목과 부두에도 모집 공고가 붙었다.
      p2:
        was: 1924년 3월 3일 제1차 준비 회의가 열렸고, 첫 의제는 세 학교 학생들의 졸업 문제였다.
        now: 이 분기에서는 회의 탁자 위에 세 학교의 어려움을 한데 적은 목록이 놓였다.
      p3:
        was: 1924년, 학교들이 여러 곳에 흩어져 관리가 어렵자 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했고, 그해에 땅이 정해졌다.
        now: 이 분기에서는 부지 선정 문서 옆에 후보지와 스파이를 함께 그린 지도가 놓였다.
      p4:
        was: 1924년 6월 21일 쩌우루가 국립 광둥대학 교장에 취임했고, 같은 날 옛 세 학교의 졸업식이 열렸다.
        now: 이 분기에서는 준비위원회가 검토를 마친 통합 명단을 졸업식에 사용했다.
      p5:
        was: 1924년 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했지만, 새 교사는 1933년에야 착공했고 첫 단과대학은 1934년 가을에야 옮겨 갔다. 쑨원은 1925년 3월 12일 세상을 떠나 그것을 보지 못했다.
        now: 이 분기에서는 11월 그가 광저우를 떠나기 전에 스파이 교지의 경계 말뚝이 이미 하나하나 서 있었다.
        who: sun_yat_sen_guangzhou
        bio: 이 시간선에서는 쑨원이 광저우를 떠나기 전에 새 교지 스파이의 경계가 정해져 있었다.
    shift_all: 다섯 가지 일을 모두 마쳤다. 돌아와 쑨원이 훗날 직접 쓴 교훈을 다시 읽으니, 그 일들이 박학·심문·신사·명변·독행이라는 다섯 마디와 맞닿아 있었다.
    vignettes:
      slips: 가상의 사무원이 두 줄을 가린 쪽지가 붙은 원고를 베끼려 한다. 당신은 쪽지와 원고가 각각 누구의 글씨인지 묻는다. 그는 원고를 먼저 베끼고 쪽지는 그대로 둔다.
      back_row: 가상의 학생이 자리를 찾지 못해 자꾸 일어나 두리번거린다. 당신이 긴 의자에서 옆으로 비켜 준다. 그는 말없이 끝까지 듣고, 강당이 비어 갈 때 당신에게 고개를 끄덕인다.
      hundred: 당신은 수첩 맨 뒤에서 다섯 획씩 묶어 날을 센다. 백 일이 되자 가상의 사무원이 무엇을 세느냐고 묻는다. 당신은 날을 센다고 답한다.
  lalibela_rock:
    name: 도랑 벽의 두 지층
    place: 에티오피아 랄리벨라
    figure: 랄리벨라의 도랑 작업반
    story: 1966년 12월 19일 랄리벨라의 1단계 복원 공사가 시작되었다. 쌓인 흙을 걷어 내자 바위를 파 만든 도랑이 드러났다. 당시 출토품은 사진 몇 장만 남아 개별 유물을 확인할 만한 기록이 없다.
    relic: 도랑 벽의 단면도
    relic_desc: 지층의 두께와 흙 속 토기 조각의 위치를 표시한 그림.
    points:
      p1: 흙을 더 퍼내기 전에 작업반과 지층을 재고 토기 조각의 위치가 담긴 단면도 사본을 마을에 남긴다
    points_fail:
      p1: 작업반이 흙을 걷어 낸다. 이 구간에서 토기 조각이 나왔던 위치는 다시 잴 수 없다.
    shift:
      p1:
        was: 남은 사진만으로는 출토품이 어느 지층의 어디에 있었는지 알아낼 수 없다.
        now: 마을에 단면도 사본이 남는다. 후대의 조사원이 지층의 두께와 토기 조각의 위치를 확인할 수 있다.
    vignettes:
      work: '{staff}가 보는 앞에서 흙 한 겹이 벗겨지고 옅은 지층이 드러난다.'
    story_prose:
      opening:
        - 1966년 겨울, 랄리벨라. 도랑이 꺾이는 곳에 젖은 흙 아래로 옅은 지층이 보인다. 그 안에 토기 조각이 박혀 있다.
        - 공사를 하면서 묻혀 있던 도랑이 드러났다. 당시 나온 물건들은 사진 몇 장으로만 남았다.
        - 다음 바구니가 올라가기 전이라면 도랑 벽을 재어 둘 시간이 있다.
      points:
        p1: '{staff}는 작업반에 잠깐 기다려 달라고 하고 지층과 토기 조각의 위치를 잰다. 작업반원이 마을에 남길 도면에도 같은 치수를 옮겨 적는다.'
      outcomes:
        all: 여러 해 뒤 조사원이 바위에 자를 댄다. 옛 도면으로 옅은 지층이 있던 높이를 찾을 수 있다.
        p1: 여러 해 뒤 조사원이 바위에 자를 댄다. 옛 도면으로 옅은 지층이 있던 높이를 찾을 수 있다.
      none: 벽이 깎여 반듯해졌다. 흙은 앞서 퍼낸 흙과 섞인다.
      not_admitted: '{staff}는 도랑에 내려가지 못한다. 도랑가의 작업반원이 팽팽했던 줄을 판자에 감는다.'
      excerpts:
        p1: '{staff}는 작업반에 잠깐 기다려 달라고 하고 지층과 토기 조각의 위치를 잰다. 작업반원이 마을에 남길 도면에도 같은 치수를 옮겨 적는다.'
  ife_bronzes:
    name: 되메우기 전에 그린 발굴 도면
    place: 나이지리아 일레이페
    figure: 이타 예무 발굴팀
    story: 1957년 12월 일레이페의 이타 예무에서 구제 발굴이 시작되었다. 토기 조각을 깐 바닥이 드러났고, 처음 발견한 큰 바닥에는 나중에 지붕이 씌워졌다. 대부분의 발굴 구덩이는 되메워져 후대의 연구자들은 흩어진 자료로 위치를 복원해야 했다.
    relic: 기준선이 표시된 발굴 도면
    relic_desc: 길가의 기준선에서 여러 발굴 구덩이의 위치를 찾을 수 있다.
    points:
      p1: 되메우기 전에 같은 기준선에서 발굴 구덩이의 위치를 재고, 현장에서 확인할 수 있는 도면을 이페에 남긴다
    points_fail:
      p1: 구덩이를 되메운다. 후대에는 흩어진 기록을 모아 구덩이의 위치를 찾아야 한다.
    shift:
      p1:
        was: 초기 발굴의 전체 도면이 없어 후대의 조사팀은 발굴 구덩이의 배치를 복원해야 했다.
        now: 고정 기준점에서 잰 도면이 이페에 남는다. 후대의 조사팀은 옛 구덩이의 위치를 찾을 수 있다.
    vignettes:
      work: '{staff}가 보는 앞에서 숫자 사이에 흙이 묻은 줄자가 감긴다.'
    story_prose:
      opening:
        - 1957년 12월, 일레이페. 길가에서 발굴팀이 솔로 흙을 털어 내자 토기 조각을 깐 바닥의 가장자리가 드러난다.
        - 처음 드러난 큰 바닥에는 지붕이 씌워지지만 대부분의 구덩이는 되메운다. 후대의 조사팀은 노트와 사진을 모아 구덩이의 위치를 찾아야 했다.
        - 구덩이 가장자리가 보이는 동안 같은 기준점에서 거리를 재 둘 수 있다.
      points:
        p1: '{staff}는 발굴팀과 길가의 표식까지 줄자를 당긴다. 모서리마다 읽어 준 거리를 팀원이 이페에 남길 도면에도 표시한다.'
      outcomes:
        all: 오랜 시간이 지나고 조사원이 길가의 표식에서 도면대로 거리를 재어 옛 구덩이 모서리를 찾아낸다.
        p1: 오랜 시간이 지나고 조사원이 길가의 표식에서 도면대로 거리를 재어 옛 구덩이 모서리를 찾아낸다.
      none: 마지막 모서리가 흙에 덮인다. 기준점 없는 두 도면을 포개도 선이 맞지 않는다.
      not_admitted: '{staff}는 울타리 안에 들어가지 못한다. 팀원이 바닥에 늘어뜨린 줄자를 거둔다.'
      excerpts:
        p1: '{staff}는 발굴팀과 길가의 표식까지 줄자를 당긴다. 모서리마다 읽어 준 거리를 팀원이 이페에 남길 도면에도 표시한다.'
  great_zimbabwe:
    name: 돌담 아래 남은 흙단
    place: 짐바브웨 마스빙고
    figure: 서쪽 구역의 일꾼들
    story: 1915년 그레이트 짐바브웨의 서쪽 구역에서 흙으로 빚은 단과 걸상, 벽 대부분을 걷어 냈다. 흙 구조물이 메쌓기 돌담을 위태롭게 한다고 여겼기 때문이다. 드러난 구덩이는 그 뒤에도 계속 침식됐다.
    story_prose:
      opening:
        - 1915년, 그레이트 짐바브웨. 서쪽 구역의 메쌓기 돌담 밑에는 흙으로 빚은 단과 걸상이 남아 있다. 걷어 낼 구역의 표시가 그 위까지 이어진다.
        - 역사에서는 흙 구조물 대부분이 걷혀 나갔고 드러난 구덩이는 계속 침식됐다. 이 갈래에서는 작업이 닿기 전에 일꾼들과 돌담이 맞닿은 자리를 살필 수 있다.
        - 담을 살필 줄 알고 현장에서 일하는 사람들에게 설명할 사람이 필요하다. 흙을 걷기 전에 남길 구간을 찾아야 한다.
      points:
        p1: '{staff}는 일꾼들과 흙단이 돌담과 맞닿은 곳을 살피고 남길 만한 구간을 가리켰다. 일꾼들은 작업 경계를 바깥으로 옮겼다. 일꾼이 흙단 바깥에 말뚝을 박았다. 흙 표면의 오래된 손자국 하나가 돌 틈에 닿아 있었다.'
      outcomes:
        all: 훗날 측량자가 담 밑에 쪼그려 앉아 남은 흙단에 자를 걸쳤다. 한쪽은 흙 위에, 다른 쪽은 돌에 살짝 닿았다.
        p1: 훗날 측량자가 담 밑에 쪼그려 앉아 남은 흙단에 자를 걸쳤다. 한쪽은 흙 위에, 다른 쪽은 돌에 살짝 닿았다.
      none: 일꾼들이 빈 바구니를 들고 물러났다. 구덩이 가장자리엔 새 흙빛이 드러났고, 흙단이 담에 닿았던 곳엔 엷은 선만 남았다.
      not_admitted: '{staff}는 서쪽 구역의 작업에 끼지 못했다. 안쪽에서 도면을 건넬 때 돌담 밑으로 종이 모서리만 비쳤다.'
      excerpts:
        p1: 일꾼이 흙단 바깥에 말뚝을 박았다. 흙 표면의 오래된 손자국 하나가 돌 틈에 닿아 있었다.
    relic: 돌담 단면 스케치
    relic_desc: 메쌓기 돌담과 그 밑에 붙은 흙단이 그려진 종이.
    points:
      p1: 일꾼들과 돌담 밑을 점검하고 작업이 시작되기 전에 흙단 일부를 제자리에 남기도록 설득하기
    points_fail:
      p1: 역사에서처럼 흙 구조물 대부분이 걷혀 나갔다. 이 부분도 제자리에 남지 않았다.
    shift:
      p1:
        was: 1915년 서쪽 구역에서 흙으로 만든 단과 걸상, 벽 대부분을 걷어 냈다.
        now: 이 갈래에서는 흙단 일부가 제자리에 남는다. 후대의 측량자도 흙단이 돌담과 어떻게 맞물렸는지 살필 수 있다.
    vignettes:
      lines: '{staff}는 돌담 밑을 눈으로 따라간다. 흙단 가장자리는 돌 사이 틈에서 낮아진다.'
      width: '{staff}는 일꾼의 스케치를 든다. 돌담과 흙단에 선이 하나씩 그어져 있다.'
      pace: '{staff}는 돌계단에 앉아 신발의 마른 흙을 턴다. 부스러기가 모래땅에 떨어진다.'
  euclid_alexandria:
    name: 《포리스마》가 남아 있던 때
    place: 알렉산드리아
    figure: 에우클레이데스
