      p1:
        was: 1890년 7월 초 반 고흐는 험난한 하늘 아래 광활한 밀밭을 그렸고, 7월 10일경 테오와 조에게 그 그림을 썼습니다.
      p2:
        was: 1890년 7월 초 반 고흐는 파리에 있는 테오의 가족을 방문했고 테오가 자신의 자리를 떠나 스스로 일할 생각을 하고 있다는 것을 알게 되었습니다. 오베르로 돌아온 그는 테오를 위협하는 폭풍이 그에게도 부담이 되었다고 썼습니다.
        now: 그가 파리에서 돌아왔을 때 그는 테오의 가족이 어떻게 운영될 것인지 알았고, 무게를 한 단계 줄이고 들판으로 다시 나갔습니다.
      p3:
        was: 1890년 7월 반 고흐는 실패를 느꼈고 좋은 미래가 보이지 않는다고 썼습니다. 그는 평생 동안 그림을 거의 팔지 않았습니다.
        now: 누군가 그에게 이 밀밭이 언젠가 박물관 벽에 걸릴 것이며 많은 사람들이 그것을 보기 위해 여행할 것이라고 말했습니다.
      p4:
        was: 그는 1890년 7월 27일 총상을 입었고 이틀 후 오베르에서 사망했으며, 그림을 그린 지 불과 10년밖에 되지 않았습니다.
        now: '{staff}는 그 해 7월까지 그와 함께 지냈고, 질병은 그를 다시 짓밟지 않았고, 여름이 지나도 그는 여전히 Auberge Ravoux에 있었습니다. 그는 몇 년 더 그림을 그렸고, 밀밭이 지나고 나면 다른 계절이 찾아왔습니다.'
    vignettes:
      sky: '{staff}는 노트북에 동일한 필드를 두 번 그립니다. 처음에는 하늘 스트립을 사용하고 그 다음에는 훨씬 더 많은 내용을 그렸습니다. 두 번째에서는 첫 번째가 숨겨둔 내용을 확인합니다.'
      wind: '{staff}는 밀 위로 다음 번 돌풍을 기다리며 첫눈을 비비지 않고 어두운 부분이 밀을 가로질러 움직이는 것을 지켜봅니다.'
      path: '{staff}는 들판 사이의 길을 따라 끝이 보일 때까지 걷고, 돌아오는 길에는 어디로 가는지 알 수 있습니다.'
  sor_juana_mexico_city:
    name: 마지막으로 내어 준 책들
    place: 멕시코시티
    figure: 소르 후아나 이네스 데 라 크루스
    story: 1690년에 푸에블라의 주교는 허락 없이 카르타 아테나고리카(Carta Atenagórica)라는 설교에 대한 소르 후아나의 비평을 Sor Filotea라는 서명이 담긴 편지와 함께 출판했습니다. 그녀의 답장은 1691년 3월 1일자로 작성되었습니다. 1693년에 그녀는 책과 악기를 팔았고 1694년에 서약을 갱신했습니다. 그녀는 전염병으로 인해 자매들을 간호한 후 1695년 4월 17일 산 헤로니모 수도원에서 사망했습니다.
    story_prose:
      opening:
        - 1695년 초, 멕시코시티. 후아나의 책과 악기는 2년 전에 팔렸습니다. 그녀는 자신의 학문 추구를 옹호하는 장문의 편지를 썼습니다. 그녀의 작품 컬렉션에 등장했을 때 그녀는 사라졌습니다.
        - 역사상 전염병이 도시 전체에 퍼졌습니다. 후아나는 4월에 병에 걸려 스스로 목숨을 끊은 사람들을 돌보았습니다. 이 지점에는 빈 선반 옆에 탁자를 놓을 공간이 있는데, 거기에 환자를 돌보는 사람들이 물과 마른 천을 놓을 수 있습니다.
        - 이번 여행에는 손을 바꿔 병실을 계속 운영할 수 있는 사람이 필요합니다. 또한 아픈 사람을 돌보는 방법을 알고 올바른 약이나 장비를 갖춘 사람도 필요합니다.
      points:
        p1: 다음 교대가 늦었습니다. {staff}는 물, 깨끗한 행주, 빈 그릇을 별도의 장소에 놓고 손을 자유롭게 하여 다음 침대를 관리합니다. 문 옆에서 누군가가 다시 양쪽 소매를 걷어 올렸다. 마른 천 더미는 더 낮았으며 바닥에는 여전히 정사각형 접힌 부분이 하나 남아 있었습니다.
        p2: 한 침대에 누워 있던 여자는 일어나지 못했다. {staff}는 그녀가 술을 마시는 동안 머물면서 가능한 치료법과 보살핌으로 그녀를 돌보았습니다. 새벽이 되자 그녀는 침대 가장자리로 손을 뻗었습니다. {staff}가 그릇을 내밀자 한 손을 풀어 그릇 바닥을 받쳤습니다.
        p3: 후아나도 병에 걸렸습니다. {staff}는 가져온 물품으로 그녀를 대접하고 그녀가 한 모금 더 마실 수 있을 때까지 침대 옆에서 기다렸습니다. 그녀는 빈 그릇을 돌려주고 베개 옆에 있는 페이지를 만졌습니다. 그녀의 손끝은 젖어 있었고, 그녀는 종이를 침대의 마른 구석으로 쿡쿡 찔렀습니다.
      outcomes:
        all: 4월 이후에는 두 여성 모두 다시 병실 테이블에 설 수 있었습니다. 하나는 갓 말린 천을 쌓아두었고, 다른 하나는 빈 선반으로 돌아가서 페이지에 몇 줄을 추가했습니다.
        p3: 4월이 지나면 Juana는 다시 테이블에 앉을 수 있게 되었습니다. 선반은 아직 비어 있었지만 테이블 가장자리에는 새로 쓰여진 페이지가 있었습니다.
        p2: 4월이 지나자 그 여성은 병실을 돕기 위해 다시 돌아왔습니다. 그녀는 누워 있던 침대 옆에 서서 깨끗한 천을 털어냈다.
        p1: 더 많은 사람들이 병에 걸렸고 병실의 일은 계속되었습니다. 교대 시간에 누군가 깨끗한 그릇을 테이블 위에 뒤집어 놓았습니다.
      none: 물병은 밤새도록 손대지 않은 채 서 있었다. 새벽에는 물의 주둥이 바로 아래에 빛의 조각이 있었고 문을 통해 볼 수 있었습니다.
      not_admitted: '{staff}는 환자를 돌보고 있는 방에 결코 들어가지 않았습니다. 문 틈새로 탁자 다리와 빈 물병이 보였다.'
      desync: 침대 곁에는 누구도 인계하러 오지 않았습니다. 소속사에서 {staff}를 리콜했을 당시에도 테이블 한구석에는 따뜻한 물이 담긴 그릇이 그대로 놓여 있었다.
      excerpts:
        p3: 그녀는 빈 그릇을 돌려주고 베개 옆에 있는 페이지를 만졌습니다. 그녀의 손끝은 젖어 있었고, 그녀는 종이를 침대의 마른 구석으로 쿡쿡 찔렀습니다.
        p2: 새벽이 되자 그녀는 침대 가장자리로 손을 뻗었습니다. {staff}가 그릇을 내밀자 한 손을 풀어 그릇 바닥을 받쳤습니다.
        p1: 문 옆에서 누군가가 다시 양쪽 소매를 걷어 올렸다. 마른 천 더미는 더 낮았으며 바닥에는 여전히 정사각형 접힌 부분이 하나 남아 있었습니다.
    relic: 깃펜
    relic_desc: 빈 선반 옆에 끝이 갈라진 깃펜.
    points:
      p1: 병이 퍼지는 몇 주 동안 그녀가 병실을 계속 운영할 수 있도록 도와주고 자매들을 함께 간호하십시오.
      p2: 전염병에 걸린 자매를 구해주세요
      p3: 그녀가 스스로 아프면 치료해 주라.
    points_fail:
