        who: gutenberg_mainz
        bio: 이 분야에서 구텐베르크는 1455년 분쟁 이후에도 일부 인쇄 도구에 대한 지속적인 접근권을 확보했습니다.
    vignettes:
      wrong_sort: 견습생이 그것을 상자에 넣기 직전에 잘못된 종류의 것을 발견했습니다. 이웃 옆에 놓고 한 얼굴이 다른 얼굴에 어떻게 인쇄되는지 보도록 합니다.
