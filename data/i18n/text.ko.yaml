        now: '{staff}는 그가 식고 마실 때까지 개울가에 그와 함께 앉아 있었고, 그들이 Miliana를 떠났을 때 두 사절은 캐러밴과 함께 있었습니다. 그는 나중에 튀니스의 집으로 돌아왔습니다. 그 이후의 내용은 기록되지 않았습니다.'
      p3:
        was: 1325년 그가 튀니스에 입성하던 날, 그를 환영하는 사람이 아무도 없었고 그는 울었습니다.
        now: 그가 마을에 들어간 날, 길에서 알게 된 누군가가 옆에 있었고, 튀니스에 머물렀던 두 달 동안 그는 더 이상 혼자가 아니었습니다.
    vignettes:
