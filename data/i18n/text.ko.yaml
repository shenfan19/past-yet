      p2:
        was: 1689년 5월 13일 소라는 청지기가 그들에게 금당을 보여 주었지만 그가 자리를 비웠기 때문에 경전은 닫혀 있었다고 기록했습니다. Bashō는 나중에 두 홀이 모두 열렸다고 썼습니다.
        now: 현지 가이드는 수트라 홀을 둘러볼 수 있음을 확인하고 허용된 쪽에서 보여줍니다. Bashō는 자신이 본 건물의 세부 사항을 가지고 돌아옵니다.
