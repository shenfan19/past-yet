      p2: 팀은 여전히 임시 변통 벤치를 공유합니다. 날씨가 바뀌면 악기를 옮기고 공간을 기다려야 합니다.
      p3: 그들은 여전히 맨손으로 샘플을 다루고 있으며 해마다 방사선이 두 샘플 모두에 떨어집니다.
    shift:
      p1:
        was: 1898년 12월 26일 파리 아카데미는 새로운 방사성 물질에 대한 보고서를 접수하고 그와 함께 독립적인 분광 관찰 결과를 발표했습니다.
      p2:
        was: 1898년 두 번의 보고 이후 큐리 부부는 학교의 임시 공간에서 연구를 계속했습니다.
        now: '{staff}는 공간을 마련할 수 있는 사람에게 중단 기록과 함께 두 보고서를 모두 제공합니다. 학교는 장기적인 측정을 위한 공간을 따로 마련합니다.'
      p3:
        was: 1934년 7월 4일 마리 퀴리는 장기간 방사선 노출로 인해 재생불량성 빈혈로 사망했습니다.
        now: 1898년부터 두 사람 모두 차폐 뒤에 있는 샘플을 사용하여 작업했으며 수년에 걸쳐 훨씬 적은 양의 방사선을 흡수했습니다. Marie는 역사상보다 더 나은 건강을 유지했으며 몇 년 더 오래 일했습니다.
        who: curie_paris
        bio: 마리 퀴리는 1898년부터 차폐 뒤의 방사성 물질을 다루었습니다. 그녀는 노년기의 심각한 방사선 피해를 면하고 몇 년 더 오래 일했습니다.
    vignettes:
      shed: 학교 운동장의 창고 지붕을 통해 비가 내립니다. {staff}는 물이 새는 곳 아래에 대야를 설치하고 유리 제품 벤치를 물이 떨어지는 곳에서 멀리 옮기며 구석에 있는 스토브는 방을 거의 따뜻하게 하지 않습니다.
      borscht: '{staff}는 라틴 지구의 작은 장소에서 식사를 합니다. 다음 테이블에서는 두 명의 폴란드 학생이 비트 뿌리 수프가 식을 때까지 폴란드어로 논쟁을 벌이고 있고, 주인은 센 강에 있는 비둘기보다 여기 주변에 폴란드인이 더 많다고 말합니다.'
      bookstall: 센강 {staff}의 한 서점에서 육체를 통과하는 새로운 광선에 관한 팜플렛을 발견했습니다. 노점 주인은 요즘 사람들이 볼 수 없는 것에 대해서는 비용을 지불할 것이라고 말했습니다.
  freud_vienna:
    name: 한 권의 책, 두 개의 연도
    place: 비엔나
    figure: 지그문트 프로이트
    story: 1899년 11월 4일 지그문트 프로이트(지그문트 프로이트)의 꿈의 해석(The Interpretation of Dreams)이 비엔나에 출판되었고 출판사는 제목 페이지에 1900을 인쇄했습니다. 프로이트는 나중에 이 책을 아버지의 죽음에 대한 자신의 반응이라고 불렀습니다. 초판은 600부였고, 팔리는 데 8년이 걸렸습니다. 두 번째 판은 1909년에야 나왔습니다.
    story_prose:
      opening:
        - 1899년 가을, 비엔나. 지그문트 프로이트(지그문트 프로이트)의 꿈의 해석(The Interpretation of Dreams)이 출판사 Deuticke에서 곧 출간될 예정입니다. 11월 4일에 게재될 예정이며 제목 페이지에 1900이 인쇄되어 있습니다. 3년 전인 10월, 그의 아버지 야콥(Jacob)이 비엔나에서 사망했습니다. 프로이트는 나중에 이 책이 아버지의 죽음에 대한 자신의 반응이었다고 말했습니다.
        - 역사상 이 책은 출판되었을 때 거의 주목을 받지 못했습니다. 초판 600권이 팔리는 데 약 8년이 걸렸고, 2판은 1909년에야 나왔다. 이 지점에는 도심에 있는 서점에 창문을 닦는 조수와 주문서를 보관하는 심부름꾼이 있고, 의사는 다방에서 신문을 읽는다.
        - 이번 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 의학을 알고 동료들과 대화할 수 있는 사람; 신문을 아는 사람, 책이 어느 손에 닿아야 하는지 아는 사람; 문을 열 수 있는 준비된 혀를 가진 사람.
      outcomes:
        p1: 그해 겨울, 프로이트에게 책에 대해 페이지별로 묻는 편지가 잇달아 도착했다. 서점의 주문서에는 꿈의 책이 몇 줄 더 이어졌습니다.
      none: 12월 말에 눈이 내렸는데, 서점 소년은 주문서를 뒤지다가 그 달에는 꿈의 책이 거의 움직이지 않았음을 발견했습니다. 창문 구석에는 책의 제목 페이지에 1900년이라고 적힌 책이 여전히 펼쳐져 있었습니다.
      not_admitted: '{staff}는 그 동료들의 문을 통과하지 못했고 도심의 서점 창가에 몇 번 서 있을 뿐이었습니다. 꿈의 책은 구석에 놓여 있었고, 제목 페이지가 열려 있었고, 유리 위에 얇은 먼지 막이 있었습니다.'
      points:
        p1:
          class_medical: 11월 말, 꿈에 관한 새 책이 거의 3주 동안 상점 진열장 구석에 놓여 있었습니다. {staff}는 의사로서 가방에 사본을 담아 몇몇 동료의 상담실에 가서 각 꿈에 관한 장에 어느 페이지부터 시작해야 하는지 알려주는 메모를 넣었습니다. 그날 밤 도심의 창문은 늦게까지 불이 켜져 있었습니다. 책상 위에는 제목 페이지에 1900이라고 적힌 책이 놓여 있었는데, 이미 절반 이상을 읽었습니다.
          class_press: 11월 말, 꿈에 관한 새 책이 거의 3주 동안 상점 진열장 구석에 놓여 있었습니다. {staff}는 기자의 연락처를 사용하여 어떤 의사가 저널에 대한 긴 리뷰를 작성하고 사본을 포장하여 집집마다 가져갈 것인지 알아냈습니다. 그날 밤 도심의 창문은 늦게까지 불이 켜져 있었습니다. 책상 위에는 제목 페이지에 1900이라고 적힌 책이 놓여 있었는데, 이미 절반 이상을 읽었습니다.
          else: 11월 말, 꿈에 관한 새 책이 거의 3주 동안 상점 진열장 구석에 놓여 있었습니다. {staff}는 여러 날 오후 커피하우스에 앉아 논문을 읽고 있는 의사들과 이야기를 나누다가 사본을 하나씩 빌려주면서 읽을 때만 돌려달라고 요청했습니다. 그날 밤 도심의 창문은 늦게까지 불이 켜져 있었습니다. 책상 위에는 제목 페이지에 1900이라고 적힌 책이 놓여 있었는데, 이미 절반 이상을 읽었습니다.
      excerpts:
        p1: 그날 밤 도심의 창문은 늦게까지 불이 켜져 있었습니다. 책상 위에는 제목 페이지에 1900이라고 적힌 책이 놓여 있었는데, 이미 절반 이상을 읽었습니다.
    relic: 날짜가 적힌 서점 전표
    relic_desc: 제목 페이지에 1900이라고 적힌 책에 대한 1899년 11월 날짜의 비엔나 서점 배달 전표.
    points:
      p1: 책이 나온 후 조용한 몇 주가 지나면 책을 끝까지 읽을 동료의 손에 The Interpretation of Dreams를 맡기십시오.
    points_fail:
      p1: 이 책은 거의 주목을 끌지 못합니다. 600부의 초판을 인쇄하려면 판매하는 데 8년이 걸립니다.
    shift:
      p1:
        was: 1899년 11월 4일, 꿈의 해석(The Interpretation of Dreams)은 1900년에 600부의 첫 번째 인쇄본으로 비엔나에서 출판되었습니다. 이 책은 판매되는 데 8년이 걸렸습니다.
        now: '{staff}는 그해 겨울 책 전체를 읽은 몇몇 동료들에게 사본을 전달했습니다. 이에 대한 편지와 주장은 수년 전에 시작되었으며 첫 번째 인쇄는 8년을 기다리지 않습니다.'
        who: freud_vienna
        bio: 꿈에 관한 프로이트의 책은 첫해에 진지한 독자를 찾았습니다. 그가 수년 동안 기다려온 논의는 1899년 겨울에 시작되었습니다.
    vignettes:
      window: '{staff}는 도심의 한 서점 창가에 오랫동안 서 있다. 꿈에 관한 새 책은 한 구석에 놓여 있고, 제목 페이지에는 1900년이라고 적혀 있습니다. 조수가 유리를 닦기 위해 나오며 그것은 내년에만 새 책으로 간주된다고 말합니다. 지금은 그 자리를 따뜻하게 유지하고 있습니다.'
      cafe: '{staff}는 커피하우스 선반에서 신문을 꺼내 모든 리뷰 칼럼을 살펴봅니다. 그 책은 그 어느 곳에도 없습니다. 옆 테이블에 앉은 의사는 꿈에 관해 300페이지에 달하는 내용을 읽을 시간이 없다고 말하면서 논문을 마무리하기 위해 커피를 한 잔 더 주문합니다.'
      snow: 12월 말에는 눈이 내립니다. {staff}는 서점 소년이 문간을 치우는 것을 돕고, 소년은 차가운 손가락으로 주문서를 훑어보며 이번 달에는 꿈의 책이 거의 움직이지 않았다고 말하며 꿈은 여름에 더 잘 팔릴지 묻습니다.
  cajal_barcelona:
    name: 저마다 독립된 신경 세포
    place: 바르셀로나
    figure: 산티아고 라몬 이 카할
    story: 1887년 말부터 산티아고 라몬 이 카할은 바르셀로나에서 조직학 의장을 맡았습니다. 1888년 5월에 그는 자신의 저널의 초판 비용을 지불하고 소수의 사본 대부분을 스페인어를 거의 읽지 않는 해외 연구자들에게 보냈습니다. 1889년 10월 그는 자비로 베를린에서 열린 독일 해부학 학회 회의에 참석하여 현미경으로 슬라이드를 보여주었습니다. 그곳의 수석 조직학자인 Albert von Kölliker가 그의 연구를 맡았습니다. 1906년에 그는 카밀로 골지(Camillo Golgi)와 함께 노벨상을 받았다.
    story_prose:
      opening:
        - 1889년 가을 바르셀로나. 산티아고 라몬 이 카할(산티아고 라몬 이 카할)은 대학에서 조직학을 가르치고 은색 부분의 신경 세포 가지를 연구합니다. 그 전 해에 그는 자신의 저널 첫 권인 약 60권을 사비로 지불했는데, 그 중 대부분은 해외에 게시되었습니다.
        - 역사상 해외 동료들은 스페인어를 거의 읽지 않았고 그의 논문은 거의 주목을 받지 못했습니다. 9월 26일 그는 여행 휴가를 받고 베를린까지의 요금을 직접 인상했으며 10월에는 독일 해부학 학회 회의에서 슬라이드를 현미경 아래에 놓았습니다. 그때부터 Kölliker는 그를 지원했습니다. 이 분야에서는 연구실의 한 학생이 중크롬산칼륨에 담근 휴지통을 지켜보고 있으며 베를린까지의 요금을 문의하기 위해 기차역에 왔습니다.
        - 이 여행에는 두 종류의 사람들이 도움을 줄 수 있습니다. 계정과 슬라이드를 정리하고 일정을 지킬 수 있는 사람과 외국어를 아는 사람이 번역자를 찾고 사람들에게 도움을 주도록 설득할 수 있습니다.
      outcomes:
        all: 10월 베를린 집회소에는 현미경 앞에 줄이 늘어서 있었습니다. 그 앞에 있던 남자는 번역된 몇 페이지를 들고 있었습니다.
        p2: 그 이후로 Cajal이 해외로 보낸 모든 봉투에는 번역된 캡션 세트가 포함되어 있었습니다.
        p1: 10월, 베를린의 집회소에서 Cajal은 현미경으로 한 부분을 슬라이드한 후 뒤로 물러나 사람들에게 살펴보라고 요청했습니다.
      none: 바르셀로나의 실험실에는 슬라이드 묶음이 여전히 나무 케이스에 쌓여 테이블에서 떠나지 않았습니다.
      desync: 월말이 지나도 요금은 여전히 부족했고 슬라이드도 아직 포장되지 않았습니다. {staff}가 리콜되었을 때 Cajal은 베를린으로 보내기 위해 서면 계정을 봉투에 넣고 있었습니다.
      not_admitted: '{staff}는 그 연구실에 들어가지 않았습니다. 슬라이드는 여전히 테이블 위에 펼쳐져 있었고 베를린으로 가는 날이 가까워졌습니다.'
      points:
        p1: 9월 26일에 여행 휴가가 나왔지만 요금은 그가 지불해야 했습니다. {staff}는 그릴 수 있는 모든 금액을 시트에 나열한 다음 슬라이드를 번호별로 패킷으로 분류하고 각 패킷을 부드러운 종이로 싸서 칸막이가 있는 나무 케이스에 포장했습니다. 계정이 균형을 이루고 케이스 잠금이 클릭되어 종료되었습니다. Cajal은 케이스를 무릎 위에 올려놓고 베를린행 기차에 오르는 내내 팔에 안고 있었습니다.
        p2:
          class_lettered: 번역가들이 그러하듯 {staff}는 Cajal과 함께 도면을 하나씩 살펴보고 각 아래에 독일어로 캡션을 삽입하고 각 섬유를 적기 전에 각 섬유를 무엇이라고 불러야 하는지 모든 지점에서 질문했습니다. 짧은 논문을 정서한 뒤 먼저 현미경 표본과 대조하여 확인하려는 몇몇 동료에게 전달되었습니다. 베를린에서는 이미 누군가가 그 몇 페이지를 손에 들고 현미경 앞에서 그를 기다리고 있었습니다.
          else: '{staff}는 도시에서 독일어를 아는 번역가를 찾았고 그에게 자신의 작업을 제쳐두도록 설득한 다음 Cajal과 함께 앉아 그림을 하나씩 살펴보고 각 그림 아래에 독일어로 캡션을 넣었습니다. 짧은 논문을 정서한 뒤 먼저 현미경 표본과 대조하여 확인하려는 몇몇 동료에게 전달되었습니다. 베를린에서는 이미 누군가가 그 몇 페이지를 손에 들고 현미경 앞에서 그를 기다리고 있었습니다.'
