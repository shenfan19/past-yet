      p2: Bell은 학생들을 만나기 위해 보스턴에 머물게 됩니다. 그의 전시 시연이 동기화되지 않아 사무실에서 {staff}를 회상합니다.
    shift:
      p1:
        was: 1876년 3월 10일 보스턴에서 벨은 실험 장치를 사용하여 옆방에 있는 왓슨에게 이해할 수 있는 문장을 전송했습니다.
      p2:
        was: 1876년 6월 25일 필라델피아에서 벨은 돔 페드로 2세(Dom Pedro II)와 윌리엄 톰슨(William Thomson)을 포함한 100주년 심사위원들에게 전화기를 보여주었습니다.
    vignettes:
      blind: 수신자의 보조자는 문장을 먼저 보고 싶어합니다. 당신은 종이를 접고 그가 들은 것만 쓰도록 요청합니다. 두 단어는 그대로 나타나고 마지막 단어는 공백으로 남습니다. 그 전표를 보관하세요. 당신이 가면 또 다른 재판이 시작되려 합니다.
      future: 사람들이 이 날짜부터 한 문장을 기억할 것이라고 조수에게 말합니다. 그는 누군가 송신기 측에 쓴 것이 무엇이든 될 것이라고 추측합니다. 두 개의 전표를 준비합니다. 하나는 발표자용이고 다른 하나는 청취자용입니다. 두 사람은 이 재판에 대해 유명한 문장의 이야기가 말할 수 없는 차이를 보여줄 것입니다.
      door: 수취인의 접힌 전표를 문을 통해 다시 가져갑니다. 그런 다음에야 시험 문장 옆에 놓아두세요. 누락된 단어는 여전히 누락되어 있지만 일치하는 두 단어는 이제 기록이 있습니다. 비교 결과를 집에 가져가서 다음 문장을 놓쳤습니다.
  cantor_halle:
    name: 요양원에서 온 편지
    place: 할레
    figure: 게오르크 칸토어
    story: 칸토어는 1913년에 은퇴하여 말년을 전시 독일에서 병들고 식량 부족으로 보냈습니다. 1917년에 그는 마지막으로 할레(Halle)의 진료소에 들어갔습니다. 그는 아내에게 집에 오라고 편지를 보냈고 1918년 1월 6일 병원에서 사망했습니다.
    story_prose:
      opening:
        - 할레 병원 창가에 의자가 서 있습니다. 칸토어는 아직 접지 않은 편지를 내려놓고 오늘 올 사람이 있는지 묻습니다. 부엌 장부는 방금 위층으로 옮겨졌습니다. 식사를 나르는 사람도 기다리고 있다.
        - 칸토르는 전시의 마지막 달을 할레 병원에서 보냈고 1918년 1월 6일에 사망했습니다. 이번 방문을 통해 그는 가족을 만나고 주방에서 실행 가능한 식사 계획을 세울 수 있었습니다.
        - 방문을 준비하기 전에 그가 만나고 싶은 사람의 말을 들을 수 있는 사람을 보내십시오. 부엌에 무엇이 있는지 확인할 수 있는 사람은 자신이 먹을 수 있는 식사를 찾을 수 있습니다.
      points:
        p1: 편지 아래에 가능한 이틀을 적습니다. Cantor는 이를 고려한 다음 먼저 물어보고 싶은 가족 구성원의 이름을 지정합니다. 데이트가 끝나면 직원이 의자를 복도에서 멀리 이동시킵니다. 그날 오후 사람들이 밖으로 나가고, 의자에 앉은 사람은 여전히 각 단어를 들을 수 있습니다.
        p2: 주방에서는 남은 음식이 있을 것으로 예상되는 날만 말할 수 있습니다. 당신은 그것이 무엇을 보장할 수 있는지 묻고, 가족이 무엇을 보낼 수 있는지 확인한 다음, Cantor에게 무엇을 끝낼 수 있는지 물어보십시오. 다음 번에 식사가 오면 그는 시계를 보고 어제 약속한 시간이라고 말했습니다.
      outcomes:
        all: 그해 겨울에는 추가 방문이 있으며 일부 식사는 합의된 시간에 제공됩니다. 1월에도 가족들은 그가 할레에서 사망했다는 소식을 아직도 듣고 있습니다.
        p1: 칸토어는 자신이 가장 보고 싶었던 사람을 본다. 주방에서는 그날 필요한 만큼만 그에게 서비스를 제공할 수 있습니다.
        p2: 더 일반적인 식사가 있습니다. 그의 가족은 올 수 없고 대신 편지로 안부를 전한다.
      none: 의자는 여전히 창밖을 내다보고 있습니다. 부엌은 장부를 접고 약속할 날이 없습니다.
      not_admitted: 승무원은 오늘은 방문 일정이 없다고 말했습니다. 접힌 종이를 문 앞에 두고 가세요.
      excerpts:
        p1: 데이트가 끝나면 직원이 의자를 복도에서 멀리 이동시킵니다. 그날 오후 사람들이 밖으로 나가고, 의자에 앉은 사람은 여전히 각 단어를 들을 수 있습니다.
        p2: 다음 번에 식사가 오면 그는 시계를 보고 어제 약속한 시간이라고 말했습니다.
    relic: 사용하지 않은 봉투
    relic_desc: 할레의 편지 옆에 남겨진 발명된 봉투.
    points:
      p1: 칸토르에게 가장 만나고 싶은 사람이 누구인지 물어보고 할레에 있는 진료소를 조용히 방문하세요.
      p2: 주방과 그의 가족에게 그 겨울에 어떤 음식을 아끼면 좋을지 물어보고 그가 끝낼 수 있는 정규 식사를 마련하십시오.
