      date: 할아버지는 이 편지에 마지막 편지의 날짜를 적기 시작합니다. {staff}는 두 개의 봉투를 나란히 놓고 그와 함께 날짜를 확인합니다.
      address: 택배가 가기 전에 {staff}는 할아버지에게 파리 주소를 다시 읽어줍니다. 편지는 가족이 열 수 있을 때까지 접힌 상태로 유지됩니다.
      future: '{staff}는 파리에서 가져온 시트 옆에 새 시트를 놓습니다. 다음으로 Jeanne이 말하는 내용을 추가할 여지가 있습니다.'
  david_fleay_healesville:
    name: 코리가 스스로 나올 때까지
    place: 힐스빌 보호구역, 빅토리아
    figure: 데이비드 플리
    story: 1943년 말, Healesville Sanctuary의 오리너구리 Jill은 나중에 Corrie라는 이름의 어린 오리를 부화했습니다. 데이비드 플리와 그의 팀은 1944년 1월 둥지를 열면서 탄생을 확인했습니다. 2월 26일에 그는 코리가 수영하러 나오는 것을 처음으로 목격했습니다.
    story_prose:
      opening:
        - Healesville 굴의 토양은 여전히 부드럽습니다. 데이비드 플리는 어린 오리너구리 Corrie를 Jill의 둥지로 돌려보내기 전에 관찰할 수 있는 관찰 공간을 열었습니다. 골키퍼의 부츠가 부서진 가장자리에 멈췄습니다.
        - 코리는 포로 상태에서 성공적으로 사육된 최초의 오리너구리였습니다. 1944년 2월 26일 Fleay는 그녀가 스스로 굴을 떠나는 것을 처음으로 보았습니다. 3월 공개 출연은 인클로저에 스페이드를 가져왔습니다. 여기에서 그녀의 보살핌을 돕고 군중에게 기다려달라고 요청할 수 있습니다.
        - 은행을 지켜보는 여행자는 Fleay가 빈 자리를 깨끗하게 유지하도록 도울 수 있습니다. 동물에게 관심을 기울이는 사람은 Jill이 수집할 수 있도록 둥지 잎을 남겨둘 수 있습니다. 공개적으로 나타나려면 골키퍼가 삽을 내려 놓도록 설득할 수 있는 사람을 보내십시오.
      points:
        p1: 당신은 골키퍼에게 물러서라고 신호를 보냅니다. 부츠가 멈추자 흙 부스러기가 테두리를 지나 미끄러져 들어갑니다. Fleay가 Corrie를 둥지로 돌려보내는 동안 보드를 가장자리에 고정시킵니다. Fleay는 손을 뒤로 빼기 전에 내부가 조용해질 때까지 기다립니다.
        p2: 사육사는 굴을 향해 나뭇잎 한 움큼을 들고 다닙니다. 당신은 질이 전날 밤에 보통 나왔던 얕은 곳을 그에게 보여주고 거기에 나뭇잎을 남겨두라고 요청합니다. 아직 빛이 있을 때 둘 다 떠나갑니다. Jill은 청구서에 나뭇잎을 들고 밖으로 나가 은행으로 돌아갑니다.
        p3: 누군가가 시계를 세 번 확인했고, 골키퍼가 삽을 난간에 가져왔습니다. 당신은 Fleay에게 표지판에 Corrie를 기다리라고만 말할 수 있는지 물어봅니다. 앞에 있는 어린이는 뒤에 있는 사람이 물을 볼 수 있는 공간을 만듭니다. 골키퍼는 삽을 치워둡니다. Corrie의 법안이 눈에 들어오면 철로에 있던 사람들조차 조용해집니다.
      outcomes:
        all: 코리는 굴에서 헤엄쳐 나옵니다. 성소는 공개된 모습을 하고 있으며 난간 옆 은행에는 신선한 삽 자국이 없습니다.
        p1: 보드가 떠날 때쯤 코리는 둥지로 돌아왔습니다. 이번 여행은 초기 양육 기록을 보존합니다.
        p2: 물가에는 나뭇잎이 적습니다. 골키퍼는 진흙에서 부츠를 꺼내고 아무 방해도 받지 않고 둑을 떠났습니다.
        p3: 군중은 코리가 스스로 나오는 것을 본다. 보고서에는 삽을 치워놓은 모습이 기록되어 있다.
      none: 나뭇잎은 원래 있던 자리에 그대로 남아 있습니다. 일부 방문객들은 집으로 돌아가는 마지막 차를 볼 수 있는 곳에서 기다립니다.
      not_admitted: 관리인은 방문객에게 난간 밖에서 기다려 달라고 요청합니다. 문을 닫기 전에는 아무도 당신을 데리러 오지 않습니다.
      desync: Fleay가 어린 동물을 돌려보내기 전에 느슨한 흙이 입구를 막습니다. 과거의 사육 기록이 동기화되지 않고 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: Fleay가 Corrie를 둥지로 돌려보내는 동안 보드를 가장자리에 고정시킵니다. Fleay는 손을 뒤로 빼기 전에 내부가 조용해질 때까지 기다립니다.
        p2: 아직 빛이 있을 때 둘 다 떠나갑니다. Jill은 청구서에 나뭇잎을 들고 밖으로 나가 은행으로 돌아갑니다.
        p3: 골키퍼는 삽을 치워둡니다. Corrie의 법안이 눈에 들어오면 철로에 있던 사람들조차 조용해집니다.
    relic: 나무 사료 국자
    relic_desc: 손잡이가 낡은 작은 나무 국자.
    points:
      p1: Fleay가 Corrie를 굴 속으로 다시 데려갈 수 있을 만큼 오랫동안 입구에서 느슨한 흙을 치워두십시오.
      p2: 질이 어두워진 후에 나뭇잎을 모을 수 있도록 수영장 근처에 신선한 나뭇잎을 남겨두도록 사육사에게 요청하세요.
      p3: 가족 전시일에 코리가 숨을 때 굴을 닫아두도록 보호구역을 설득하세요.
    points_fail:
      p1: Fleay가 Corrie를 안전하게 돌려보내기 전에 느슨한 흙이 입구를 덮고 있습니다. 첫 번째 성공적인 양육은 역사와 일치하지 않으며 사무실에서는 그날 다시 {staff}를 호출합니다.
      p2: 수호자들은 그 지역을 그대로 떠난다. Jill은 은행을 따라 더 먼 곳에서 나뭇잎을 모아야 할 것입니다.
      p3: 광고된 시간이 흐르고 성역은 삽으로 돌아갑니다. Corrie가 나올 때쯤에는 대부분의 방문객이 떠났습니다.
    shift:
      p1:
        was: 1944년 1월 3일, 플리는 어린 오리너구리를 어지러운 둥지로 돌려보냈고, 질은 계속해서 오리너구리를 키웠습니다.
      p2:
        was: Fleay는 굴이 열린 후 Jill이 둥지 재료와 흙을 밀어냈다고 기록합니다.
        now: 이 가지에서 {staff}는 사육사에게 나뭇잎을 수영장이 닿는 곳에 두도록 요청합니다. Jill은 어두워진 후에도 굴을 다시 열지 않고도 그것들을 모을 수 있습니다.
      p3:
        was: 1944년 3월, 코리는 가족 전시 광고가 진행되는 동안 터널 안으로 들어가 대부분의 방문객이 떠난 후 땅을 파헤쳤습니다.
        now: 이 지점에서 {staff}는 파수꾼에게 저녁 관찰 내용을 보여주고 삽을 내려놓으라고 지시합니다. 아직 그곳에 있는 방문객들은 수영장 옆에서 기다리거나 다른 날 다시 올 수 있습니다.
  archimedes_syracuse:
    name: 도시가 함락된 날
    place: 시라쿠사, 시칠리아
    figure: 아르키메데스
    story: 아르키메데스는 로마 포위 공격 중에 시라쿠사를 방어하는 데 도움이 되는 기계를 고안했습니다. 기원전 212년 도시가 함락되자 그는 살해당했다. Plutarch는 그것이 어떻게 일어 났는지에 대한 여러 버전을 제공합니다.
    story_prose:
      opening:
        - 시러큐스가 무너지는 날 거리의 울부짖음은 멈춥니다. 한 이웃이 서판을 들고 안에 서서 그림을 그리는 노인을 만나러 왔느냐고 묻습니다. 아르키메데스는 한때 그에게서 보드를 빌렸습니다.
        - 아르키메데스는 로마군이 시라쿠사를 점령했을 때 사망했습니다. 고대 기록은 상황에 따라 다릅니다. 이 지점에서 당신은 그를 찾을 수 있고 그가 밤을 보낼 곳이 생길 때까지 그와 함께 있을 수 있습니다.
        - 그를 알아볼 수 있는 여행자를 보내서 그가 어디로 갔는지 이웃 사람들에게 물어 보십시오. 그는 자신의 드로잉 보드로 무엇을 할지 스스로 결정할 수 있습니다.
      points:
        p1: 아르키메데스는 판을 반 바퀴 돌리며 아직 선이 필요하다고 말합니다. 이웃의 오래된 태블릿을 보여주면 외부 사람이 그림을 가지고 다닐 수 있다는 것을 알 수 있습니다. 그는 액자를 손가락으로 한 번 두드리고 건넨다. 그가 머물 방에서 그는 먼저 판자도 도착했는지 묻습니다.
      outcomes:
        all: 도시가 함락된 후에도 이 지점에는 여전히 아르키메데스에 관한 소식이 남아 있습니다. 집에 있는 누군가가 앉을 수 있는 의자 옆에 보드를 놓아두었습니다.
        p1: 그가 대피소에 도착할 때까지 당신은 그와 함께 있습니다. 그는 보드에서 덮개를 들어올려 마지막 줄을 끝낼 수 있습니다.
      none: 이웃들은 도시가 함락되었을 때 아르키메데스가 죽었다는 소식을 들었습니다. 살아남은 계정은 상황에 따라 다릅니다.
      not_admitted: 이웃이 방문객을 밖에 두었습니다. 이름을 읽기 전에 누군가 입구에서 보드를 가져갑니다.
      excerpts:
        p1: 그는 액자를 손가락으로 한 번 두드리고 건넨다. 그가 머물 방에서 그는 먼저 판자도 도착했는지 묻습니다.
    relic: 왁스 드로잉 타블렛
    relic_desc: 가상의 이웃집에 선이 표시된 연습용 태블릿입니다.
    points:
      p1: 도시가 무너지는 동안 아르키메데스를 찾아 그가 피난처에 도달할 때까지 그와 함께 있어주세요.
    points_fail:
      p1: 마침내 그를 마지막으로 본 사람들을 찾으면 그들은 그가 도시가 함락되는 동안 살해당했다고 말합니다.
    shift:
      p1:
        was: 아르키메데스는 기원전 212년 로마군이 시라쿠사를 점령했을 때 사망했습니다. 고대 기록은 상황에 따라 다릅니다.
        now: 이 지점에서는 시러큐스가 여전히 무너지고 있습니다. 아르키메데스는 {staff}를 이용해 대피소에 도달하고 살아남습니다.
        who: archimedes_syracuse
        bio: 이 연대표에서 아르키메데스는 기원전 212년에 시라쿠사의 함락을 무사히 통과하여 살았습니다.
    vignettes:
      load: '{staff}는 오래된 보드를 새 보드 아래에 놓고 어떤 그림을 읽을 수 있어야 하는지 묻습니다. 이웃은 아직 노출된 왁스를 가리켰습니다.'
      settle: 이웃이 의자에 있는 글쓰기 판을 치우기 시작합니다. {staff}는 그에게 누군가가 함께 앉을 수 있는 자리를 비워달라고 부탁합니다.
      crown: '{staff}는 이웃에게 빌려준 보드에 대해 설명해달라고 요청합니다. 이웃은 그것이 얼마나 넓은지 두 손가락으로 추적합니다.'
  hypatia_alexandria:
    name: 그해 3월의 알렉산드리아
    place: 알렉산드리아
    figure: 히파티아
    story: 415년 초에도 히파티아는 여전히 알렉산드리아에서 수학과 철학을 가르치고 있으며, 시의 행정관들이 그녀의 말을 들으러 옵니다. 도시의 지사와 다른 세력 사이의 불화는 매주 더욱 격렬해지고, 그녀는 지사와의 유대 관계를 통해 그 불화에 끌립니다.
    story_prose:
      opening:
        - 아침 교육이 알렉산드리아에서 방금 끝났습니다. 한 학생이 테이블 위에 표시된 나무 조각을 남겨두고 히파티아에게 내일 같은 방으로 와도 되는지 묻습니다. 거리의 대화가 바뀌었습니다. 그녀는 평소처럼 여기서 가르치려고 했었다.
        - 히파티아는 415년 3월 알렉산드리아에서 살해되었습니다. 후기 골동품 기록에도 공개적으로 철학을 가르친 그녀의 명성이 기록되어 있습니다. 이 지점은 그녀에게 계획을 변경하고 기꺼이 그녀를 받아줄 누군가와 함께 머물 이유를 제공할 수 있습니다.
        - 학생들의 이야기를 듣고 선생님과 새로운 준비에 대해 이야기할 수 있는 여행자를 보내십시오. 그녀는 어디로 가야 할지 합의하고 빌린 책을 돌려줄 사람을 선택해야 합니다.
      points:
        p1: 히파티아는 자신이 빌려주겠다고 약속한 책을 아직도 기다리고 있는 사람이 누구인지 묻습니다. 당신은 그녀에게 대출을 처리할 수 있는 사람을 지명하라고 요청한 다음 어떤 친구가 그녀에게 방을 제안했는지 설명합니다. 그녀는 나무 조각 뒷면에 끝나지 않은 질문을 적고 테이블 옆에 있는 학생에게 건네줍니다. 그날 이후에도 책은 여전히 반납되었고, 선생님은 이미 친구 집에 가셨습니다.
      outcomes:
        all: 친구 집에 있는 누군가가 그녀에게 문제를 해결해 달라고 부탁합니다. 이 지부에는 3월에 그녀가 가르친 기록이 아직도 남아 있습니다.
        p1: 그녀는 하루의 계획을 바꾸기로 동의하고 문을 열어주는 친구에게 연락합니다. 잠시 동안 강의실이 비어 있습니다.
      none: 한 학생이 표시된 조각을 돌려주러 왔고 히파티아가 죽었다는 소식을 듣습니다. 그는 마지막 수업을 위해 앉았던 자리에 그것을 놓았습니다.
      not_admitted: 학생은 책을 빌리는 사람의 목록을 닫습니다. 방문자의 이름은 입력되지 않았으며 문이 닫혀도 스트립은 테이블 위에 남아 있습니다.
      excerpts:
        p1: 그녀는 나무 조각 뒷면에 끝나지 않은 질문을 적고 테이블 옆에 있는 학생에게 건네줍니다. 그날 이후에도 책은 여전히 반납되었고, 선생님은 이미 친구 집에 가셨습니다.
    relic: 표시된 나무 조각
    relic_desc: 뒷면에 문제의 일부가 있는 가상의 교구입니다.
    points:
