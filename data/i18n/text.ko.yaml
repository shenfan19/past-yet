        s_fan: '{date}: Shen Fan은 스스로 추측해야 하는 핸드를 작성합니다. 그는 이름을 읽고 서기가 기록하며, 기록이 진행되는 동안 세 개의 기록 중 두 개에 있는 모든 이름을 표시합니다.'
        s_somchai: '{date}: 솜차이는 글을 읽을 수 있지만 손이 서툴러서 그가 쓴 내용을 아무도 알아낼 수 없습니다. 그는 이름을 읽어주고 점원은 글을 씁니다. 성전에서 다른 사람들이 지붕을 고치고 있을 때 사다리를 잡은 사람은 바로 그 사람이었습니다.'
      sunday_first:
