    place: 페르시아 이스파한
    figure: 오마르 하이얌
    story: 1070년대 술탄 말리크샤(Sultan Malik-Shah)는 관측을 위해 천문학자들을 모았습니다. 오마르 하이얌은 이스파한에 있는 자신의 궁정에서 학자들과 함께 일했습니다. Jalali 달력은 1079년 3월 15일에 사용되었으며 춘분을 태양력의 시작으로 정했습니다.
    story_prose:
      opening:
        - 1079년 봄, 이스파한. 말리크샤가 모은 학자들이 달력을 수정하고 있습니다. Khayyam은 관찰에 참여했으며 새로운 계산은 춘분에 한 해를 시작합니다.
        - 역사상 그해 3월에 새 달력이 사용됐다. 관찰 프로그램은 Malik-Shah가 사망한 후 종료되었습니다. Khayyam은 뿌리 추출에 관해 자신이 쓴 책을 언급했는데, 이 책은 아직까지 남아 있지 않습니다. 이 분야에서 연감 복사자는 몇 줄을 더 넣을 수 있는 공간이 있는 시트를 가지고 있습니다.
        - 이 여행에는 그림자 판독값을 확인하고 이전 열과 새 열을 바로잡을 수 있는 사람이 필요합니다. 또한 원고를 확인하고 사본을 다른 도시로 보낼 수 있는 사람도 필요합니다.
      points:
        p1: 춘분 이전에 {staff}는 그림자의 끝을 이전 판독값과 일치시키고 혼합된 열을 분류한 다음 Khayyam에게 원래 표시와 비교하여 확인하도록 요청합니다. 판독값 표의 가장자리를 따라 두 개의 접힌 부분이 있습니다. 해가 져도 시트는 여전히 열려 있고 해당 기둥의 잉크는 선 안쪽으로 돌아갑니다.
        p2: '{staff}는 어근 추출에 관한 필사자의 책을 확인하고, 쉽게 착각할 수 있는 숫자를 원본과 비교한 후 원고를 다른 도시로 향하는 사람에게 전달합니다. 메신저는 사본을 천으로 싸서 묶고 한쪽 면을 뒤로 빼냅니다. 제목은 바깥쪽을 향하고, 첫 번째 접힌 부분 아래에는 여전히 종이 가장자리가 표시됩니다.'
      outcomes:
        all: 그 봄의 날짜가 새 달력에 들어갔습니다. 몇 년 후, 누군가 다른 도시의 뿌리에 관한 책을 찾았습니다. 그 책의 오래된 구석은 여전히 컬링되어 있었습니다.
        p2: 나중에 다른 도시의 누군가가 책 전체를 다시 복사했습니다. 그들은 낡고 낡은 원고를 옆에 두고 첫 줄부터 시작했습니다.
        p1: 달력은 지정된 날에 시작되었습니다. 비교 시트 하나가 남아 있었고 두 제목이 나란히 놓여 있었습니다.
      none: 오래된 테이블이 상자에 다시 들어갔습니다. 바깥에는 미완성 시트가 놓여 있었고, 바람이 불 때마다 테두리를 두드리고 있었습니다.
      not_admitted: '{staff}는 필사자가 있는 곳을 찾지 못했습니다. 문 안쪽으로 시트가 뒤집어졌고, 바깥쪽에서는 제목이 사라졌습니다.'
      desync: 시트를 수집할 때 열이 여전히 일치하지 않았습니다. {staff}가 리콜되었을 때 마지막 판독값은 여전히 여백에 있었습니다.
      excerpts:
        p2: 메신저는 사본을 천으로 싸서 묶고 한쪽 면을 뒤로 빼냅니다. 제목은 바깥쪽을 향하고, 첫 번째 접힌 부분 아래에는 여전히 종이 가장자리가 표시됩니다.
        p1: 판독값 표의 가장자리를 따라 두 개의 접힌 부분이 있습니다. 해가 져도 시트는 여전히 열려 있고 해당 기둥의 잉크는 선 안쪽으로 돌아갑니다.
    relic: 표제가 두 개 적힌 달력 한 장
    relic_desc: 옛 설날과 새 설날을 나란히 적은 대조표.
    points:
      p1: 춘분 전날에는 그것을 고정하는 그림자 판독값을 안전하게 유지하여 새 달력이 정해진 날에 시작되도록 하십시오.
      p2: 뿌리 추출에 관한 책의 사본을 한 권 더 구하고 안전한 보관을 위해 다른 도시로 보내서 이 가지에서 살아남을 수 있도록 도와주세요.
    points_fail:
      p1: 춘분 판독값이 정렬되지 않았고 새 달력이 3월 15일에 시작되지 않았습니다.
      p2: 그 책은 역사에서와 마찬가지로 모두 사라졌습니다.
    shift:
      p1:
        was: 1079년 3월 15일, 술탄 말리크 샤(Sultan Malik Shah)의 새 달력이 춘분에서 시작되는 해인 정해진 날에 사용되었습니다.
      p2:
        was: 뿌리 추출에 관한 Khayyam의 책은 분실되었으며, 그의 대수학에 대한 언급을 통해서만 알려져 있습니다.
        now: 한 권은 다른 도시로 보내져 도서관에 보관되었으며, 수 세기가 지난 후에도 사람들은 여전히 그 책을 읽을 수 있었습니다.
        who: omar_khayyam_nishapur
        bio: 이 부분에서 뿌리에 관한 그의 책은 관측 기간이 지나도 사라지지 않았습니다. 다른 도시에 보관된 사본은 그가 죽은 후에도 계속해서 읽고 복사되었습니다.
    vignettes:
      spring: '{staff}는 이전 테이블과 새 테이블을 나란히 놓고 그것이 속한 각 날짜에 대해 기록하므로 다음 독자가 추측할 필요가 없습니다.'
      carry: '{staff}는 접힌 시트의 두 제목을 바깥쪽에 복사하므로 누구든지 시트를 펼치지 않고도 비교할 열을 확인할 수 있습니다.'
      future: '{staff}는 이 달력이 나중에 어떻게 작성될지 알고 있으며 복사자가 사용하는 계산 날짜를 유지합니다.'
  wright_kitty_hawk:
    name: 하늘을 난 열두 초
    place: 키티 호크, 노스캐롤라이나
    figure: 오빌 라이트와 윌버 라이트
    story: 1903년 9월 라이트 형제는 동력 기계를 가지고 키티 호크 근처의 캠프로 돌아왔습니다. 12월 14일 윌버의 시도는 실패했다. 12월 17일 아침에 그들은 12초의 첫 비행과 59초의 마지막 비행으로 4번의 비행을 했습니다. 그날 오후 그들은 키티 호크까지 걸어가 데이턴에 있는 아버지에게 전보를 보냈습니다.
    story_prose:
      opening:
        - 1903년 12월 키티 호크 근처. 라이트 형제가 엔진 구동 플라이어를 가져왔습니다. 14일 시도는 실패했다. 철로를 다시 세워야 하는데 아직도 바람이 분다.
        - 역사상 17일 첫 비행은 12초 동안 이뤄졌다. 네 번째 착륙 후, 구명 스테이션의 존 다니엘스가 날개 사이에 끼인 채 돌풍이 기계를 뒤집었습니다. 이 지점에는 지상의 레일과 기계를 돕기 위해 캠프에 또 다른 한 쌍의 손이 있습니다.
        - 이번 여행에는 바람을 막아줄 수 있는 사람이 필요합니다. 올바른 장비를 갖춘 사람은 넓은 날개를 안정적으로 유지하는 데 도움을 줄 수도 있습니다.
      points:
        p1: 이륙 전에 {staff}는 레일 아래의 모래를 확인하고 날개가 손이 닿지 않는 곳을 지나갈 때까지 바람에 날개를 고정시킵니다. 다니엘스는 카메라 옆에 서 있습니다. 날개 끝은 그 아래에 밝은 모래 띠가 있는 레일 끝을 통과합니다.
        p2: 네 번째 착륙 후 {staff}는 바람이 불어오는 것을 느끼고 구조대원이 날개를 아래로 잡고 다니엘스가 안전하게 이동할 수 있도록 도와줍니다. 날개 아래에서 모래 스케이트가 움직이고 날개 가장자리에 손이 붙어 있습니다. 바람이 떨어지면 희미한 모래 줄이 천 위에 놓입니다.
      outcomes:
        all: 거리가 전보에 들어갔습니다. 형제들은 플라이어를 포장할 때 천을 한 번 더 닦아냈고 상자 바닥에 얇은 모래 층을 남겼습니다.
        p2: 플라이어는 모래 언덕 위로 몇 번 더 올라갔습니다. 그것을 포장한 사람은 천 옆에 레일 로프를 길게 놓은 다음 뚜껑을 닫았습니다.
        p1: 12초 120피트가 메모에 들어갔습니다. 사진은 그 페이지 옆에 놓여 있었습니다.
      none: 바람이 진영을 가로질러 다시 난간 기슭을 묻어버렸다. 스토브에 보이는 것은 빨간색 점뿐이었습니다.
      not_admitted: '{staff}는 도우미들 사이에서 자리를 찾지 못했습니다. 창고를 지나도 레일의 한쪽 끝이 여전히 모래 위로 드러났습니다.'
      desync: 날개가 모래를 긁었고 플라이어는 난간 옆에 멈췄습니다. {staff}가 리콜되면서 여전히 바람이 천을 들어올리고 있었습니다.
      excerpts:
        p2: 날개 아래에서 모래 스케이트가 움직이고 날개 가장자리에 손이 붙어 있습니다. 바람이 떨어지면 희미한 모래 줄이 천 위에 놓입니다.
        p1: 다니엘스는 카메라 옆에 서 있습니다. 날개 끝은 그 아래에 밝은 모래 띠가 있는 레일 끝을 통과합니다.
    relic: 프로펠러 날개
    relic_desc: 비틀어 놓은 날개 모양의 나무 프로펠러 날개.
    points:
      p1: 12월 17일 아침 찬 바람 속에서 형제들이 플라이어를 안정시키고 첫 이륙을 안전하게 할 수 있도록 도와주세요.
      p2: 네 번째 비행 후 플라이어를 모래 위에 내려놓고 다니엘과 기계를 구하세요.
    points_fail:
      p1: 이륙하기 전에 돌풍이 날개 하나를 들어올려 모래 속으로 끌고 가는데, 기계는 결코 레일을 떠나지 않습니다. 이 분기에는 12초가 없습니다.
      p2: 바람이 플라이어를 뒤집고, 다니엘스는 날개에 걸려 함께 넘어지며, 역사에서와 마찬가지로 기계가 너무 고장 나서 다시 날 수 없습니다. 이 가지에서는 그날 오후 이후에는 결코 땅을 떠나지 않습니다.
    shift:
      p1:
        was: 1903년 12월 17일 아침, 오빌은 12초 120피트를 비행했습니다.
      p2:
        was: 1903년 12월 17일, 네 번째 비행 후 돌풍이 불어 플라이어가 뒤집혔고 존 다니엘스가 날개 사이에 끼어 있었고 기계는 심하게 파손되어 다시는 날지 못했습니다.
        now: '{staff}와 역의 사람들이 그것을 모래 위에 붙잡았지만 다니엘스는 잡히지 않았습니다. 그해 겨울, 형제들은 데이턴을 위해 상자에 넣기 전에 모래 언덕 위로 몇 번 더 날아갔습니다.'
    vignettes:
      numbers: '{staff}는 4개의 비행을 만들어진 순서대로 노트북에 복사합니다(한 열에는 초, 다른 열에는 피트). 조명이 꺼지기 전에 두 번 더합니다.'
      sand: '{staff}는 밤바람이 불자 표류에서 레일을 파내고 발 밑의 모래를 평평하게 밟습니다. 경기를 위해 준비한 역의 도우미는 아침까지 바람이 약해질 것이라고 말했지만 그렇지 않습니다.'
      cold: '{staff}는 엔진이 예열되는 동안 창고에서 스토브를 계속 작동시킵니다. 바깥의 웅덩이는 얼어붙었고, 아무도 그것에 대해 언급하지 않습니다.'
  van_gogh_auvers:
    name: 오베르에서 보낸 여름
    place: 오베르쉬르우아즈
    figure: 빈센트 반 고흐
    story: 빈센트 반 고흐는 1890년 5월 20일에 Auvers sur Oise에 와서 Auberge Ravoux에 머물면서 Paul Gachet 박사를 만나러 자주 갔습니다. 그는 거의 하루에 한 작품씩 그렸다. 7월 10일경에 쓴 편지에서 그는 험난한 하늘 아래 광대한 밀밭에 대해 썼습니다. 7월 27일 그는 가슴에 총을 쏘았고, 7월 29일 그의 동생 테오와 함께 사망했다.
    story_prose:
      opening:
        - 1890년 여름, 오베르 쉬르 우아즈. 반 고흐는 오베르주 라부(Auberge Ravoux)에 머물면서 거의 매일 그림을 그립니다. 7월에 보낸 편지에서 그는 험난한 하늘 아래 넓은 밀밭에 대해 썼습니다.
        - 역사상 그는 형 가족의 생계를 걱정했고 그달 말 오베르에서 사망했습니다. 이 가지에는 밀밭과 여관 사이의 길에 캔버스를 들어주거나 그의 말을 들어주는 사람이 있습니다.
        - 이번 여행에는 바람 속에서 이젤을 안정시킬 수 있는 사람, 가계부를 이해할 수 있는 사람, 그리고 들어줄 사람이 필요합니다. 배려를 아는 사람도 여관에 그와 함께 앉을 수 있습니다.
      points:
        p1: 바람이 캔버스를 밀어냅니다. {staff}는 반 고흐가 마지막 스트로크를 하는 동안 이젤의 느슨한 발을 고정하고 바람이 불어오는 쪽 모서리를 유지합니다. 멀리 있는 밀이 먼저 몸을 굽히고, 근처의 밀 줄기는 여전히 흔들리고 있습니다. 반 고흐가 붓을 내리면 캔버스 바닥은 여전히 지면에서 손가락 한 뼘 정도 높이에 있습니다.
        p2: '{staff}는 그와 함께 편지를 펼치고, 테오의 일부터 가계비까지 살펴보고, 시트 가장자리에 정리할 수 있는 내용을 기록합니다. 반 고흐는 시트를 봉투에 다시 접습니다. 그것을 치우기 전에 그는 손바닥으로 플랩을 부드럽게 만듭니다.'
        p3: '{staff}는 그림으로 그린 밀밭을 하나둘 펼쳐놓고 사람들이 이 땅과 하늘을 보기 위해 먼 길을 갤러리까지 올 것이라고 말한다. 반 고흐는 가장 바깥쪽 그림을 테이블 중앙으로 다시 옮깁니다. 방이 어두워지면서 얇은 노란색 선이 여전히 나타납니다.'
        p4: '{staff}는 가장 힘든 나날을 여관에 머물며 휴식과 일상의 돌봄을 받으며 반 고흐가 직접 창문을 열고 싶어할 때까지 기다린다. 여관의 소녀가 문 옆에 쟁반을 내려 놓습니다. 반 고흐는 그것을 가져다가 그림을 넣을 공간을 마련하기 위해 옆으로 옮깁니다.'
      outcomes:
        all: 여름이 지나자 들판은 다른 색으로 물들었습니다. 여관 문 옆에는 아직도 시트가 말리고 있었고 그 밑에는 편지가 적혀 있었습니다.
        p4: 가을에도 여전히 여관 사람들은 그가 물감을 꺼내는 모습을 지켜봤다. 문이 열리자 그의 주머니 속에 튜브의 주석 끝이 드러났습니다.
        p3: 나중에 사람들은 갤러리의 그 들판 앞에 멈춰 섰습니다. 한 걸음 더 가까이 다가가자 노란색은 거의 손에 닿을 듯 보였습니다.
        p2: 여관 탁자 위에는 집안에 관한 편지가 남아 있었다. 다시 열었더니 가장 희미한 주름 옆에 작은 선이 보였습니다.
        p1: 들판은 그림 속에 머물렀다. 나중에 창문 옆에 두 개의 두께의 페인트가 수평선을 따라 보였습니다.
      none: 여관 복도에 발소리가 들렸다. 쟁반이 다시 돌아왔을 때 컵 안의 물은 여전히 납작한 상태였습니다.
      not_admitted: '{staff}는 여관에서 자리를 찾지 못했습니다. 길 너머로 약간의 들판이 보였지만 건물 모퉁이가 길을 가리고 있었습니다.'
      desync: 이젤은 밀 사이에 옆으로 놓여 있었습니다. {staff}가 소환되었을 때 다리 중 하나에 걸린 줄기가 여전히 바람에 고개를 끄덕였습니다.
      excerpts:
        p4: 여관의 소녀가 문 옆에 쟁반을 내려 놓습니다. 반 고흐는 그것을 가져다가 그림을 넣을 공간을 마련하기 위해 옆으로 옮깁니다.
        p3: 반 고흐는 가장 바깥쪽 그림을 테이블 중앙으로 다시 옮깁니다. 방이 어두워지면서 얇은 노란색 선이 여전히 나타납니다.
        p2: 반 고흐는 시트를 봉투에 다시 접습니다. 그것을 치우기 전에 그는 손바닥으로 플랩을 부드럽게 만듭니다.
        p1: 멀리 있는 밀이 먼저 몸을 굽히고, 근처의 밀 줄기는 여전히 흔들리고 있습니다. 반 고흐가 붓을 내리면 캔버스 바닥은 여전히 지면에서 손가락 한 뼘 정도 높이에 있습니다.
    relic: 크롬 옐로 물감 튜브
    relic_desc: 들판을 그릴 때 쓴 물감이 들어 있던, 짜서 납작해진 주석 튜브.
    points:
      p1: 폭풍우가 치는 하늘 아래서 밀밭을 마무리하도록 도와주고, 캔버스가 밀밭에 떨어지지 않도록 도와주세요.
      p2: 파리 방문 후 테오의 돈 문제를 해결하도록 도와주어 폭풍이 그에게 부담이 되지 않도록 하세요.
      p3: 그의 그림이 기억될 것이라고 그에게 알려주십시오
      p4: 7월 27일 이전에 그의 몸과 마음을 치유하고 그를 살아있게 해주세요
    points_fail:
      p1: 캔버스는 바람에 밀밭으로 떨어졌고, 이 가지에는 뇌우 아래 밀밭이 없습니다.
      p2: 그는 여전히 테오를 위협하는 폭풍이 자신을 짓누르는 것을 느끼며 파리에서 돌아왔습니다. 이 지점에서는 아무도 그가 돈 문제를 명확히 하도록 도와주지 않았습니다.
      p3: 그는 여전히 자신의 그림이 테오에게 부담이라고 느꼈습니다. 이 지점에서는 아무도 그에게 이 밀밭이 어디로 끝날 것인지 말해주지 않았습니다.
      p4: 7월 27일은 역사상 그랬던 것처럼 일어났습니다. 이 지점에서 그는 다른 계절을 그리지 않았습니다.
