      shelf: '{staff}는 감방의 빈 선반의 먼지를 털고 책이 서 있던 자리, 나무에 있는 더 어두운 사각형을 찾아 그대로 둡니다.'
      bells: '{staff}는 어느 날 저녁에 안뜰에서 죽은 자를 위한 종소리를 두 번 세고 주전자로 돌아갑니다.'
  kepler_leonberg:
    name: 증인이 본 것
    place: 레온베르크
    figure: 요하네스 케플러
    story: 1620년에 천문학자 요하네스 케플러(요하네스 케플러)의 어머니인 카타리나 케플러(Katharina Kepler)는 5년 전부터 레온베르크의 이웃들로부터 비난을 받았습니다. 8월 7일 그녀는 헤마덴(Heumaden)에 있는 딸의 집에서 체포되었습니다. 그녀는 Leonberg에서 Güglingen으로 이송되었으며 가족의 비용으로 경비를 받았습니다. 그해 9월, 요하네스는 방어를 위해 린츠에서 돌아왔습니다. 여러 차례의 지연 끝에 카타리나는 체포된 지 1년 이상이 지난 1621년 가을에 석방되었습니다.
    story_prose:
      opening:
        - Leonberg, 1620. Katharina Kepler에 대한 비난은 5년 동안 그녀를 괴롭혔습니다. 그녀는 8월에 헤마덴(Heumaden)에서 체포되었고, 9월에 그녀의 아들 요하네스(Johannes)가 그녀를 변호하기 위해 린츠에서 돌아왔습니다.
        - 역사상 그녀는 Güglingen에서 구금되어 1년 이상을 보냈습니다. 그녀는 겨울 내내 사슬을 차고 있었고 그녀의 가족은 경비원들에게 돈을 지불해야 했습니다. 이 지점에서는 간수의 아내가 여전히 수프를 들고 길을 따라 올라갑니다. 누군가는 그녀에게서 냄비를 잠시 빼앗아 종이가 발송되기 전에 종이를 살펴볼 수 있습니다.
        - 이 여행에는 서류를 정리하고 서류를 작성한 사람에 대한 진술을 추적할 수 있는 사람이 필요합니다. 겨울이 오면 간병인이나 따뜻한 침구를 가져올 수 있는 사람을 위한 일도 있습니다.
      points:
        p1: Katharina가 Leonberg로 옮겨진 후 {staff}는 기록 보관인의 습관을 따라 관리인에게 두 번째 사본을 요청하고 그와 함께 페이지 수를 세고 그것이 전달되는 것을 확인했습니다. 점원은 제출할 더미 위에 사본을 올려 놓았습니다. 원본이 뒤로 접혀지자 {staff}는 튀어나온 모서리를 눌렀습니다.
        p2: '{staff}는 가족과 함께 증언을 퍼뜨리고 각 주장을 본 것, 들은 것 또는 나중에 누군가가 추론한 것을 추적했습니다. 세 개의 기둥은 혼잡한 증언 공간에 숨을 쉴 수 있는 공간을 제공했습니다. 어떤 목격자도 본 적이 없는 상황에서 펜은 괘선 바로 앞에서 멈췄습니다.'
        p3: 추위가 오자 {staff}는 경비원들과 함께 두꺼운 침구와 따뜻한 식사를 카타리나가 사슬을 차고 있는 침대 옆으로 가져갈 준비를 했습니다. 그릇을 가져오기 전에 그녀는 담요 모서리를 무릎 위에 집어넣었습니다. 그녀가 따뜻한 그릇을 양손으로 천천히 감싸는 동안 쇠고리가 침대판에 놓여 있었습니다.
      outcomes:
        all: 증언과 변호인은 여전히 나란히 읽을 수 있습니다. 카타리나는 감옥에서 따뜻한 식사와 두꺼운 담요를 먹었습니다. 이듬해 가을 그녀가 풀려났을 때 그녀의 가족은 그녀가 턱까지 감쌀 수 있는 코트를 입고 밖에서 기다렸다.
        p3: 쇠는 겨울이 지나고 나서야 물기를 잃었습니다. 그녀는 그것을 겪었습니다. 침대를 정돈한 그녀는 두꺼운 이불의 양쪽 모서리를 조심스럽게 맞춰주었다.
        p2: 변호사가 사본을 받았습니다. 그는 목격자들이 한 번도 본 적이 없는 것들 옆에 몇 줄을 표시하고 페이지를 넘기고 다시 넘겼습니다.
        p1: 서면 변호 내용은 몇 년이 지난 후에도 여전히 파일에서 찾을 수 있습니다. 모서리가 접힌 부분에는 반복된 핸들링으로 인해 희미한 선이 닳았습니다.
      none: 벽이 차가워지고 수프 위에 피부가 형성되었습니다. 수레가 창문을 지나갔고, 수레의 쇠바퀴가 돌 사이의 틈새에 부딪혀 각각 더 멀리 떨어졌습니다.
      not_admitted: '{staff}는 서류가 보관된 방에 들어갈 수 없었습니다. 안에 있는 누군가가 꾸러미를 옮겼고, 그 끈이 테이블에 긁혔습니다.'
      desync: 파일은 방어 수단 없이 닫혀 있었습니다. {staff}가 리콜되었을 때 테이블 위의 사각형 패치에는 여전히 서류가 있던 위치가 표시되어 있습니다.
      excerpts:
        p3: 그릇을 가져오기 전에 그녀는 담요 모서리를 무릎 위에 집어넣었습니다. 그녀가 따뜻한 그릇을 양손으로 천천히 감싸는 동안 쇠고리가 침대판에 놓여 있었습니다.
        p2: 세 개의 기둥은 혼잡한 증언 공간에 숨을 쉴 수 있는 공간을 제공했습니다. 어떤 목격자도 본 적이 없는 상황에서 펜은 괘선 바로 앞에서 멈췄습니다.
        p1: 점원은 제출할 더미 위에 사본을 올려 놓았습니다. 원본이 뒤로 접혀지자 {staff}는 튀어나온 모서리를 눌렀습니다.
    relic: 변론서 사본
    relic_desc: 손으로 정서한 변론서 한 장. 여백에 날짜를 고친 자국이 있다.
    points:
      p1: Katharina가 Leonberg로 이송된 후 변호인에게 두 번째 사본을 제출하여 그녀의 서면 답변이 절차에 전달되도록 하십시오.
      p2: 가족이 직접 증언, 소문, 이후의 추론을 별도의 열로 분류하도록 돕습니다.
      p3: 쇠사슬에 묶인 73세의 카타리나가 올 겨울을 보낼 수 있도록 두꺼운 침구와 뜨거운 음식을 굴글링겐의 감방에 넣어두세요.
    points_fail:
      p1: 가족이 찾을 수 있는 유일한 사본은 결코 전달되지 않습니다. 파일에는 혐의만 적혀 있고 사무실에서는 해당 직원을 소환했다.
      p2: 사본은 세 가지를 모두 하나로 묶습니다. 일단 파일에 도달하면 변호인은 누가 원래 무슨 말을 했는지 물어봐야 합니다.
      p3: 이 지부에서 그녀는 역사가 말해주듯 사슬에 묶인 채 겨울을 보냈습니다. 그녀를 밤낮으로 감시한 두 남자와 경비를 지불하는 가족들만이 있었습니다.
    shift:
      p1:
        was: 카타리나는 1620년 8월에 체포되었습니다. 요하네스 케플러는 변호사를 통해 소송 절차에 대한 서면 기록을 요구했습니다.
      p2:
        was: 증언과 서면 변호는 살아남습니다. 변호인은 주장을 하나씩 답변하고 이를 연결하는 데 사용된 추론에 이의를 제기했습니다.
        now: 변호사는 세 개의 열을 비교하고 증인이 스스로 확인할 수 없는 주장을 지적할 수 있습니다.
      p3:
        was: 1620년 8월 7일 카타리나 케플러는 체포되어 구글링겐(Güglingen)으로 이송되었으며, 그곳에서 그녀는 가족의 비용으로 두 명의 경비원이 이끄는 사슬에 묶여 14개월 동안 감금되었습니다. 그녀는 1621년 가을에 풀려났고 약 6개월 후에 사망했습니다.
        now: '{staff}는 가족을 위해 경비원과 함께 문제를 해결했습니다. 그해 겨울 그녀는 두꺼운 침구와 따뜻한 음식을 먹었습니다. 사슬은 그대로 남아 있었지만 그녀는 역사상보다 더 잘 버텼습니다.'
        who: katharina_kepler
        bio: 이 연대표에서 카타리나 케플러는 굴글링겐 감방에서 첫 겨울을 보내는 동안 따뜻한 침구와 따뜻한 음식을 먹었고, 1621년 가을에 풀려났을 때 더욱 강해졌습니다.
    vignettes:
      soup: 9월 13일 {staff}는 간수의 아내를 위해 Güglingen의 골목길 위로 보리 수프 냄비를 운반했습니다. 그녀는 돌아오는 그릇을 보면 어떤 죄수인지 알 수 있다고 말합니다. 노파는 그릇을 깨끗이 긁어서 돌려보내며 소금이 필요하다고 불평합니다.
      hearing: 10월 2일 {staff}는 변호사 서기가 심리를 위해 두 묶음의 서류를 Güglingen 시청으로 가져가는 것을 돕습니다. 문 앞에서 그들은 그것이 연기되었다고 들었습니다. 점원은 꾸러미를 계단에 내려놓고 너무 자주 들고 올라갔기 때문에 이제 길을 알아야 한다고 말했습니다.
      frost: 11월 중순, {staff}는 Leonberg에서 Güglingen까지 카터 마차를 탔습니다. 카터는 Zaber 계곡이 시작되는 곳의 도로가 최악이라고 말합니다. 서리가 내리면 바퀴가 노래하고, 그는 음표로 거리를 말하는 법을 배웠습니다.
  puccini_brussels:
    name: 미완의 이중창
    place: 브뤼셀
    figure: 자코모 푸치니
    story: 푸치니는 투란도트의 결말이 아직 완성되지 않은 상태에서 1924년 11월 치료를 위해 브뤼셀로갔습니다. 한 스케치를 생각하다가 펜이 멈춘다. 다른 하나에는 악기 목록이 있습니다. 프랑코 알파노(Franco Alfano)는 나중에 그러한 단편을 오케스트라가 연주할 수 있는 곡으로 바꿔야 했습니다.
    story_prose:
      opening:
        - 1924년 11월 브뤼셀. 푸치니가 치료를 받으러 왔습니다. 투란도트는 마지막 장면에 도달했지만 듀엣의 끝은 여전히 느슨한 시트에 놓여 있습니다. 일부에는 여러 개의 마디가 있고 다른 일부에는 악기 이름만 있습니다.
        - 역사상 그는 그 달 브뤼셀에서 사망했습니다. Alfano는 자신이 남긴 스케치를 바탕으로 오케스트라가 연주할 수 있는 음악을 만드는 일을 맡았습니다. 이 분야에서 복사자는 한 테이블에 두 개의 유사한 줄을 설정하여 누군가가 작곡가와 함께 그 내용을 읽을 수 있도록 합니다.
        - 이 여행에는 악보를 읽고 두 가지 가능한 연속을 따라갈 수 있는 사람이 필요합니다. 또한 환자를 돌보는 방법을 알고 침대 옆에서 밤을 보낼 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 키 변경까지 두 버전 모두 베이스 라인을 따라간 다음 푸치니 앞에 페이지를 순서대로 배치했습니다. 푸치니는 라인 중 하나를 표시했습니다. 연필을 들어올렸을 때 막대 끝에는 여전히 빈 공간이 남아 있었습니다.'
        p2: 마지막 밤, {staff}는 환자 진료 경험을 살려 푸치니의 베개를 안아주고 손이 닿는 곳에 머물렀다. 점수는 침대 옆에 닫혀 있고 등뼈가 튀어 나와 있습니다. 그의 손이 다가와서 그의 옆에 놓인 의자 등받이에 얹혀졌다.
      outcomes:
        all: 나중에 점수를 받은 사람은 연필 표시부터 시작할 수 있습니다. 그날 밤 방에는 점수가 닫혀 있었고 의자는 여전히 침대 옆에 놓여 있었습니다.
        p2: 그날 밤 그는 잠시 동안 푹 잤습니다. 의자는 그가 만질 수 있을 만큼 가까이 붙어 있었습니다.
        p1: 악보를 작업할 다음 손은 느슨한 페이지를 펼칩니다. 열쇠가 바뀌는 바에는 새로운 글쓰기가 시작되는 바로 그 자리에 연필 자국이 떨어졌다.
      none: 침대 옆 의자는 비어 있었습니다. 두 장의 모서리가 테이블 위에 겹쳤습니다. 가까이서만 보면 어느 것이 맨 위에 있는지 알 수 있었습니다.
      not_admitted: '{staff}는 병원에서 도움을 줄 수 있는 곳을 찾지 못했습니다. 복도 끝에 있는 문 아래에 한 줄기 빛이 보였다.'
      excerpts:
        p2: 점수는 침대 옆에 닫혀 있고 등뼈가 튀어 나와 있습니다. 그의 손이 다가와서 그의 옆에 놓인 의자 등받이에 얹혀졌다.
        p1: 푸치니는 라인 중 하나를 표시했습니다. 연필을 들어올렸을 때 막대 끝에는 여전히 빈 공간이 남아 있었습니다.
