        p2: 음식은 아직 따뜻해요. 그는 그릇을 무릎 사이에 내려놓고 몸을 굽혀 먹는다.
        p1: 마지막 묶음이 닫히기 전에 누군가 라벨을 바깥쪽으로 돌립니다. 다른 것을 먼저 이동하지 않고도 다음 것을 찾을 수 있습니다.
