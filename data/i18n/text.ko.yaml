    vignettes:
      list: 교환원이 보내는 메일에 답장을 넣기 시작합니다. {staff}는 두 표지의 이름을 확인하고 응답을 Cantor의 테이블에 반환합니다.
      after: 그릇 하나가 창문 너머로 지나간다. {staff}는 아직 저녁 식사를 기다리는 사람이 누구인지 묻고 직원은 주방 목록을 다시 확인합니다.
      end: '{staff}는 Cantor에게 의자가 어디에 있는지 묻습니다. 그는 방문객이 출입구에 서지 않고도 자신을 볼 수 있는 곳을 가리켰다.'
  leeuwenhoek_delft:
    name: 물 한 방울 속의 세계
    place: 델프트
    figure: 안토니 판 레이우엔훅
    story: 1676년 10월 Leeuwenhoek은 Delft에서 한 방울의 후추 물에 수천 마리의 작은 동물이 담겨 있다고 썼습니다. 런던 왕립학회는 그의 관찰을 어떻게 검증할 수 있는지 물었습니다. 1677년 5월부터 8월까지 델프트 주변의 8명의 증인이 그의 렌즈를 통해 관찰한 내용을 글로 기록했습니다. 그는 10월 5일 런던에 성명서를 보냈습니다. 로버트 훅은 나중에 협회 회원들에게 그 작은 동물들을 보여 주었습니다.
    story_prose:
      opening:
        - 델프트에서 Leeuwenhoek은 첫 번째 방문객에게 황동 접시를 건네줍니다. 방문객은 한쪽 눈을 감고도 여전히 아무것도 보지 못합니다. 다른 한 사람은 이미 펜을 들고 자신이 말하는 것을 듣기를 기다리고 있습니다.
        - 1676년 레이우엔훅(Leeuwenhoek)은 런던에 물 속의 작은 동물들을 묘사했습니다. 델프트에서 8명의 증인이 다음 해에 증언에 서명했고 그들의 기록은 10월 5일자 그의 편지와 함께 전달되었습니다. 처음 두 명의 증인을 렌즈에 보관하고 가을 우편물이 도착하기 전에 첨부물을 확인할 수 있습니다.
        - 렌즈에서 다른 관찰자를 안내할 수 있는 사람을 보내십시오. 가을에는 보내는 봉투와 대조하여 모든 서명을 확인할 수 있는 사람이 필요합니다.
      points:
        p1: 첫 번째 목격자는 접시를 뒤집고 빛의 조각을 잃습니다. Leeuwenhoek은 그에게 눈이 다시 나타날 때까지 눈을 뒤로 움직여달라고 요청합니다. 남자는 작은 것들이 어떻게 움직이는지 씁니다. 당신은 다른 증인이 직접 보고 쓸 수 있을 때까지 시트를 뒤집습니다. 둘 다 끝낸 후에야 그들은 시트를 교환하고 두 설명에 미소를 지었습니다.
        p2: 10월 봉투에는 이미 편지가 들어있습니다. 당신은 늦은 성명서를 테이블에서 들어올리고 Leeuwenhoek에게 공동 서명을 읽게 한 후 시트를 순서대로 확인합니다. 성은 당신이 기대하는 구석에 없습니다. 성이 첨부 목록에 포함되기 전에 접힌 부분을 제거해야 합니다.
      outcomes:
        all: 성명서는 편지와 함께 델프트를 떠납니다. 독자는 각 계정을 서명된 시트로 추적할 수 있습니다. Hooke는 또한 런던에 있는 다른 사람들에게 이 작은 동물들을 보여줄 것입니다.
        p1: 처음 두 증인은 각자의 관찰 내용을 기록했습니다. 나중에 10월 우편물에서 동봉물이 누락되었습니다.
        p2: 테이블 위의 느슨한 종이가 설명됩니다. 가장 먼저 서명된 계정이 누락되어 패킷이 더 이상 과거 계정과 일치할 수 없습니다.
      none: 렌즈는 원래 있던 자리에 서 있습니다. 방문자가 본 후에는 서명된 증거가 남아 있지 않습니다.
      not_admitted: 약속에서 귀하의 이름이 누락되었습니다. 견습생은 놋쇠 판을 안으로 가져가고 문을 닫습니다.
      desync: 최초의 서명 또는 10월 동봉물이 누락되었습니다. 증언이 일치하지 않고 사무실에서 여행자를 회상합니다.
      excerpts:
        p1: 당신은 다른 증인이 직접 보고 쓸 수 있을 때까지 시트를 뒤집습니다. 둘 다 끝낸 후에야 그들은 시트를 교환하고 두 설명에 미소를 지었습니다.
        p2: 성은 당신이 기대하는 구석에 없습니다. 성이 첨부 목록에 포함되기 전에 접힌 부분을 제거해야 합니다.
    relic: 작은 황동 렌즈 플레이트
    relic_desc: 매우 작고 매우 투명한 렌즈 1개가 들어 있는 엄지손가락 크기의 접시입니다.
    points:
      p1: 첫 번째 목격자에게 렌즈 앞에서 시간을 주고 각자가 본 움직임을 자신의 말로 표현하도록 하십시오.
      p2: 델프트의 10월 패킷을 살펴보세요. 편지가 런던으로 떠나기 전에 느슨한 진술을 증인과 연결하십시오.
    points_fail:
      p1: 첫 번째 증인은 자신이 본 것을 종이에 적기 전에 떠납니다. 사무실은 첫 번째 증언이 동기화되지 않았을 때 {staff}를 회상합니다.
      p2: 편지는 나갔지만 탁자 위에는 증언서 한 장이 남아 있다. 사무실에서는 패킷이 동기화되지 않으면 {staff}를 회수합니다.
    shift:
      p1:
        was: 1677년 5월 18일에 두 명의 증인이 자신들이 본 작은 동물에 대한 진술서에 서명했습니다. 그 후 몇 달 동안 다른 여섯 명이 간증을 추가했습니다.
      p2:
        was: Leeuwenhoek은 10월 5일 델프트에서 보낸 편지와 함께 증인의 진술을 동봉했습니다. 11월에 Hooke는 런던 왕립학회에 이 작은 동물들을 보여주었습니다.
    vignettes:
      motion: 특파원은 무언가 움직였다고 썼습니다. 렌즈를 볼 수 없는 사람에게 무브먼트가 어떻게 보였는지 묻습니다. 그들은 비교를 지우고 첫 번째 위치 옆에 두 번째 위치를 그립니다.
      label: 테이블 위에는 나무와 와인으로 만든 그림이 있습니다. 특파원이 흩어진 시트를 긁어내기 전에 임시 라벨을 추가하면 사진이 올바른 순서로 이동됩니다.
      read: 당신은 그림을 가리키지 않고 관찰 내용을 다시 읽습니다. 특파원은 설명이 부족한 부분을 듣고 올바른 다이어그램에 대한 참조를 추가합니다.
  newton_cambridge:
    name: 사과와 달에 적용되는 하나의 법칙
    place: 케임브리지
    figure: 아이작 뉴턴
    story: 뉴턴의 프린키피아(Principia)는 1687년 런던에 출판되었습니다. 세 번째 책에서 그는 달과 낙하물체를 중력에 대한 동일한 설명 하에 두고 있습니다. 언론에 전달된 공정한 사본은 그의 손에 없었습니다. 그것은 최근 그의 서기관인 험프리 뉴튼이 썼으며, 아무런 관계도 없습니다. 훨씬 후에 William Stukeley는 중력에 대한 질문을 촉발하는 떨어지는 사과에 대한 뉴턴의 기억을 기록했습니다. Stukeley는 머리에 타격을 가한 것에 대해 아무 말도하지 않습니다.
    story_prose:
      opening:
        - 캠브리지 복사 테이블은 런던에 대한 논문으로 덮여 있습니다. Humphrey Newton은 아이작 뉴턴이 증명에서 또 다른 수정 사항을 발견했을 때 인물의 이름을 방금 적었습니다. 메신저가 노크합니다.
        - Principia는 1687년 런던에 나타났습니다. Edmond Halley는 언론을 통해 그것을 보고 7월 5일에 그것이 끝났다고 썼습니다. 이 지점에서는 마지막 수정 사항을 확인하고 독자에게 Newton이 해당 페이지를 추적할 수 있는 수정 사항을 기록할 수 있는 장소를 제공할 수 있습니다.
        - 패킷과 비교하여 페이지 및 제안 번호를 확인할 수 있는 여행자를 보냅니다. 출판 후, 훌륭한 서신 주최자는 변경 사항을 기록하는 방법에 대해 Newton의 의견에 동의할 수 있습니다.
      points:
        p1: 두 개의 전표가 동일한 수치를 수정합니다. 하나는 책 번호가 없습니다. 당신과 험프리는 증거 옆에 누워 뉴턴에게 그가 보관하고 싶은 버전을 읽게 합니다. 당신이 시트를 책별로 분류하고 건네줄 때 메신저는 주소를 반복합니다. 메신저는 패킷을 가져가고 버려진 제목은 테이블 뒤에 남아 있습니다.
        p2: 첫 번째 독자의 편지에는 페이지 이름을 지정하지 않고 숫자만 표시되어 있습니다. 당신은 뉴턴에게 인쇄된 사본을 건네주고 그림 번호가 독자들이 그것을 식별하는 데 도움이 되는지 물어봅니다. 그는 제안을 찾으면 장부에 편지 날짜를 기재하고 자신의 결정을 입력할 수 있는 공간을 남겨달라고 요청합니다. 점원은 다음 편지가 도착했을 때 같은 그림을 발견합니다.
      outcomes:
        all: Halley는 책이 끝났다고 썼습니다. 캠브리지에서는 교정서의 첫 번째 열이 채워져 있습니다. 다음으로 책을 빌리는 사람이 교정서를 남기는 방법을 볼 수 있습니다.
        p1: Halley는 마지막 세트를 받고 책은 역사적 형태로 나타납니다. 이후의 변경 사항은 여전히 편지와 사본에 누적됩니다.
        p2: 교정서는 독자를 명제에서 해당 페이지로 안내할 수 있습니다. 런던행 패킷이 잘못되었으므로 이번 방문에서는 수정 사항을 기록하는 방법이 보존되었습니다.
      none: 테이블 위에는 두 개의 전표가 서로 가로질러 놓여 있습니다. 다음 독자는 어떤 쪽지가 먼저 왔는지 알 수 없어도 두 번 변경된 내용을 볼 수 있습니다.
      not_admitted: 메신저는 필사자에게서 패킷을 받아야 한다고 말했습니다. 밖에서는 비슷한 시트 두 장을 뒤집는 소리가 들립니다.
      desync: Halley는 최종 수정 사항 중 하나도 받지 않습니다. 출판물이 동기화되지 않고 사무실에서 여행자를 회수합니다.
      excerpts:
        p1: 당신이 시트를 책별로 분류하고 건네줄 때 메신저는 주소를 반복합니다. 메신저는 패킷을 가져가고 버려진 제목은 테이블 뒤에 남아 있습니다.
        p2: 그는 제안을 찾으면 장부에 편지 날짜를 기재하고 자신의 결정을 입력할 수 있는 공간을 남겨달라고 요청합니다. 점원은 다음 편지가 도착했을 때 같은 그림을 발견합니다.
    relic: 유리 프리즘
    relic_desc: 백색광을 여러 색상으로 분리하는 삼각형 유리입니다.
    points:
      p1: Newton의 마지막 수정 사항을 볼륨과 페이지별로 포장하여 런던 언론이 끝나기 전에 Cambridge에서 Halley로 가져옵니다.
      p2: 초판이 도착하면 독자가 제안과 페이지를 통해 확인할 수 있는 수정 사항을 제출하는 방법에 대해 뉴턴의 의견에 동의하세요.
    points_fail:
      p1: 두 가지 버전의 수정이 나옵니다. Halley는 마지막 정오표를 수집할 수 없으며 사무실에서는 해당 직원을 소환합니다.
      p2: 특파원은 자신의 참고 자료를 사용합니다. 초기 수정 사항은 편지와 뉴턴의 사본 사이에 흩어져 있습니다.
    shift:
      p1:
        was: 1687년 7월 5일, Halley는 Principia가 완성되었으며 마지막 정오표가 제때 도착했다고 썼습니다.
      p2:
        was: 뉴턴은 자신의 초판에 주석을 달았습니다. 개정판을 준비하는 데 수년이 걸렸습니다.
        now: 대학은 제안에 의해 색인된 수정 도서를 보관합니다. 독자는 문제를 기록하고 Newton이 나중에 승인한 변경 사항과 시기를 확인할 수 있습니다.
        who: newton_cambridge
        bio: 뉴턴은 케임브리지에서 프린키피아를 썼고 핼리는 런던의 언론을 통해 그것을 보았습니다. 뉴턴은 인쇄한 후에도 계속해서 작품을 수정했습니다.
    vignettes:
      apple: '"사과가 그의 머리를 때렸나요?" 당신은 게임을 위해 만들어진 대학생 하인에게 물었습니다. 그는 계속해서 쓸고 있다. "말할 수가 없어요. 달이 왜 안 뜨는지 말해주시죠." 준비된 답변이 없으므로 해당 페이지로 돌아갑니다. 그 사과는 앞으로 65년 동안 누구도 기록되지 않았습니다.'
      hand: 공정한 사본은 책에 이름이 나올 사람의 손에 있지 않습니다. 하인은 그것을 쓴 사람이 험프리 씨인데, 역시 뉴턴 사람이고 아무 관계도 아니라고 합니다. 당신은 그것을 기록하고 그를 방해하지 마십시오.
      diagram: 버릇없는 시트에 달이 달을 붙잡고 있는 것이 없다면 달이 갈 길을 그린 다음 달의 경로를 구부리는 당김을 위한 화살표를 그립니다. 라틴어를 읽을 수 없는 하인은 한동안 화살을 바라본다.
  bach_leipzig:
    name: 안과 의사가 찾아온 봄
    place: 라이프치히
    figure: 요한 제바스티안 바흐
    story: 1750년 봄까지 바흐는 시력 때문에 거의 읽거나 쓸 수 없었습니다. 여행 중인 안과 의사인 존 테일러(John Taylor)가 라이프치히에서 그를 수술했고, 합병증으로 인해 두 번째 수술이 이루어졌습니다. 바흐는 1750년 7월 28일에 세상을 떠났다.
    story_prose:
      opening:
        - 라이프치히 악보대가 창가로 옮겨졌습니다. 바흐는 도우미가 시트를 거꾸로 뒤집는 것을 듣고 그 부분을 읽기 시작하라고 요청합니다. 존 테일러가 시내에 있어요. 집에 누군가가 바흐가 언제 그를 볼 수 있는지 말하기를 기다리고 있습니다.
        - 1750년 봄에 테일러는 바흐의 눈을 수술했고, 두 번째 수술이 이어졌습니다. 바흐는 7월 28일에 세상을 떠났다. 이 분기를 통해 그는 다른 간병인의 의견을 듣고 독자가 그의 점수에 도움을 줄 것인지 결정할 수 있습니다.
        - 그의 걱정을 듣기 위해 치료 경험이 있는 사람을 보내십시오. 음악가는 누구에게 책을 읽어주고 싶은지 물어볼 수 있습니다. 이야기할 시간이 있으면 가족들에게 말하게 하십시오.
      points:
        p1: 바흐는 방문객을 향해 악보를 밀어냅니다. 당신은 다른 간병인에게 그가 기다릴 수 있는지 논의하기 전에 그가 걱정하는 것에 대한 설명을 마치도록 요청합니다. 바흐는 가족들에게 약속을 거절하라고 요청하고 자신이 아는 가수에게 그날 오후에 두 부분을 읽어달라고 요청합니다. 첫 번째 구절이 끝나면 그는 가수에게 나머지 부분을 다시 한 번 읽어달라고 요청합니다.
      outcomes:
        all: 그해 봄 바흐는 빛이 가장 좋은 시간에 대해 몇 가지 판독값을 설정했습니다. 누군가 책을 읽고 그는 키보드 케이스에 손을 얹고 듣는다. 가족들은 여전히 7월에 그의 사망을 발표하고 있다.
        p1: Taylor의 약속이 취소되었습니다. 빛이 스탠드에 도달하면 독자는 바흐가 요청한 일시 중지에서 시작합니다.
      none: 약속이 진행됩니다. 나중에 가족이 보면대를 치웠을 때 누군가가 읽어 주었을 페이지가 여전히 탁자 위에 남아 있습니다.
      not_admitted: 가족은 기다리는 사람들에게 앞쪽 방에 머물도록 요청합니다. 여행자는 결코 호출되지 않으며 논의되는 내용을 전혀 듣지 못합니다.
      excerpts:
        p1: 바흐는 가족들에게 약속을 거절하라고 요청하고 자신이 아는 가수에게 그날 오후에 두 부분을 읽어달라고 요청합니다. 첫 번째 구절이 끝나면 그는 가수에게 나머지 부분을 다시 한 번 읽어달라고 요청합니다.
    relic: 깃펜에서 잘라낸 오르간 파이프
    relic_desc: 조정 및 테스트를 거쳐 판매되지 않은 작은 파이프입니다.
    points:
      p1: 바흐가 테일러의 수술에 동의하기 전에 두 번째 의학적 소견을 주고 그가 결정하는 동안 독서에 대한 도움을 주겠다고 제안하십시오.
    points_fail:
      p1: 바흐에게는 평가할 다른 의견이 없습니다. 그는 수술을 진행하고 합병증으로 인해 두 번째 수술이 발생합니다.
    shift:
      p1:
        was: 1750년 봄, 존 테일러는 라이프치히에서 바흐의 눈을 수술했습니다. 합병증으로 인해 두 번째 수술이 이루어졌습니다.
        now: 이 지점에서 Bach는 {staff}와 대화한 후 Taylor의 작업을 거부하기로 결정합니다. 그의 시력은 여전히 좋지 않아 그는 대낮에 누군가와 함께 악보를 읽을 수 있도록 주선합니다.
        who: bach_leipzig
        bio: 이 분야에서 바흐는 1750년 봄에 테일러의 작업을 거절하고 그의 악보를 읽는 데 도움을 주선했습니다.
    vignettes:
      entry: 가수가 기대하기도 전에 낮은 부분이 한숨을 쉬는 소리가 들립니다. 방 반대편에서 듣게 하세요. 이번에는 신호가 오기 전에 고개를 듭니다.
      rest: 가수는 나머지 시간 동안 카운트를 잃습니다. 기다리는 동안 들리는 대사를 복사하고, 자신의 입장 직전에 나오는 단어를 표시합니다.
      light: 두 명의 가수가 한 페이지를 공유합니다. 빛을 향해 기울이고 두 사람 모두 선이 분리되는 곳을 볼 수 있을 때까지 그대로 유지합니다.
  lavoisier_paris:
    name: 체포 명령이 내려오기 전에
    place: 파리
    figure: 앙투안 라부아지에
    story: 1793년 11월 24일, 전 세금 농부들을 모두 체포하라는 명령이 내려졌고, 라부아지에와 그의 장인 자크 폴즈(Jacques Paulze)도 투옥되었습니다. 1794년 5월 8일, 그들 중 두 사람과 다른 전직 세금 농부들은 같은 날 파리에서 유죄 판결을 받고 처형되었습니다.
    story_prose:
      opening:
        - 파리에서 Jacques Paulze는 딸에 대한 설명을 퍼뜨립니다. 앙투안 라부아지에는 테이블 반대쪽 끝에 있는 다른 페이지를 읽고 있습니다. 두 사람 모두 자신의 책을 설명하기 위해 도시에 머물 계획입니다. 가족 중 누군가가 장부를 대신 관리해 줄 수 있는 사람이 누구인지 묻습니다.
        - 1793년 11월 24일 당국은 전 세금 농부들을 체포하라는 명령을 내렸습니다. Paulze와 Lavoisier는 모두 1794년 5월 8일에 처형되었습니다. 이 지점에서 두 사람에게 파리를 떠나는 것을 고려하도록 요청할 수 있습니다. 각자가 스스로 결정합니다.
        - 각 사람의 이유를 들을 수 있는 사람이 차례로 그들과 이야기할 수 있습니다. 회계 업무에 능숙한 여행자는 가족이 보관할 서류 목록을 작성할 수도 있습니다.
      points:
        p1: Paulze는 책 전체를 넘겨주면 가족들이 어떤 질문을 받게 될지 전혀 알 수 없게 될 것이라고 말했습니다. 당신은 그에게 말할 때 각 페이지를 표시하라고 요청합니다. 그의 딸은 장부를 통째로 가져가기 전에 그가 지적한 장부를 확인한다. 그녀가 자신의 점수를 다시 읽어주는 것을 듣고 그는 일어서서 의자를 테이블 아래로 뒤로 밀어 넣습니다.
        p2: 라부아지에는 자신이 아직 설명해야 할 두 가지 항목이 포함된 성명을 보유하고 있습니다. 당신은 그 사람이 인계받는 사람에 대한 설명을 쓸 수 있는지 묻습니다. 둘 다 그에게 다시 읽어주는 것을 들은 후 그는 누군가 전화하면 파리를 떠났다고 가족들에게 부탁합니다. 그는 떠나기 전에 그 페이지를 옆에 놓고 그 아래에 빈 시트를 남겨 둡니다.
      outcomes:
        all: 두 사람은 따로 도시를 떠난다. 5월에 가족이 책을 펼치면 각자의 소식이 들려옵니다. 둘 다 살아있습니다.
        p1: Paulze는 떠나고 다음 5월 이후에도 여전히 살아 있습니다. 라부아지에는 파리에 머물렀다가 나중에 처형됩니다.
        p2: 라부아지에는 떠나고 이듬해 5월 이후에도 여전히 살아 있다. Jacques Paulze는 파리에 머물렀다가 나중에 처형됩니다.
      none: 가족은 식탁에서 멀어집니다. 두 사람 모두 도시에 머물고 있으며 두 사람의 이름은 다음 5월에 처형된 사람들의 명단에 나타납니다.
      not_admitted: 방문객은 가족이 기대하는 전화 카드가 없습니다. 누군가 장부를 닫고 테이블 위에 보관합니다.
      excerpts:
        p1: 그의 딸은 장부를 통째로 가져가기 전에 그가 지적한 장부를 확인한다. 그녀가 자신의 점수를 다시 읽어주는 것을 듣고 그는 일어서서 의자를 테이블 아래로 뒤로 밀어 넣습니다.
        p2: 둘 다 그에게 다시 읽어주는 것을 들은 후 그는 누군가 전화하면 파리를 떠났다고 가족들에게 부탁합니다. 그는 떠나기 전에 그 페이지를 옆에 놓고 그 아래에 빈 시트를 남겨 둡니다.
    relic: 정밀 저울
    relic_desc: 화학 실험에서 물질의 수지를 맞추던 정밀 저울.
    points:
      p1: Jacques Paulze에게 서류를 가족에게 맡기고 체포 명령이 내리기 전에 파리를 떠나도록 요청하세요.
      p2: Lavoisier가 직접 자신의 계정을 정당화할 수 있다고 기대하는 동안 파리를 떠나는 것을 고려하도록 요청합니다.
    points_fail:
      p1: Paulze는 파리에서 서류를 가지고 있습니다. 그는 구금되어 1794년 5월 8일에 처형되었습니다.
      p2: 역사상과 마찬가지로 라부아지에는 11월 말에 투옥되었으며, 1794년 5월 8일 파리에서 처형되었습니다.
    shift:
      p1:
        was: 자크 파울즈(Jacques Paulze)는 1793년 11월에 구금되어 1794년 5월 8일에 처형되었습니다.
        now: 이 지점에서 Paulze는 가족에게 서류를 남기고 떠납니다. 그는 1794년 5월 이후에 살았습니다.
      p2:
        was: '1793년 11월 24일: 전직 세금 농부를 모두 체포하라는 명령이 내려졌고 라부아지에는 투옥되었습니다. 1794년 5월 8일 그는 파리에서 처형되었다.'
        now: 이 지점에서 라부아지에는 체포 명령이 있기 전에 파리를 떠나 1794년 5월 이후에 살았습니다.
        who: lavoisier_paris
        bio: 이 연대표에서 라부아지에는 1793년 11월의 체포 명령 이전에 파리를 떠나 1794년 이후에 살았습니다.
    vignettes:
      units: 두 개의 숫자가 아름답게 정렬되어 있지만 한 줄의 장치가 미끄러졌습니다. 합성기가 열을 제자리에 고정하기 전에 이를 포착합니다.
