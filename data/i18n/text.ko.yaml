    relic: 황동 사분의
    relic_desc: 별의 고도를 재는 데 쓰는 4분원 모양의 기구.
    points:
      p1: Frombork는 여전히 서류 목록을 작성할 수 있지만 작업 시트와 별도로 De revolutionibus의 사인을 나열하고 Giese에게 인수 영수증을 남겨주세요.
      p2: Giese가 정정판을 요청하는 글을 쓰는 동안 근처에 빌려준 각 사본에 정오표를 삽입하여 저자의 서문이 어느 페이지에 있는지, 앞에 있는 독자에게 보내는 주소는 그의 원고에 없음을 알려줍니다.
      p3: 그가 아직 정신이 맑을 때 인쇄된 『혁명에 관한 혁명』(De revolutionibus)을 가져가서 그 책이 인쇄되었다는 것을 알 수 있도록 하십시오.
    points_fail:
      p1: 책상에 있는 두 묶음이 이미 프린터로 전송된 사본으로 착각됩니다. 원본은 Giese에게 전달되지 않으며 사무실에서는 해당 직원을 회상합니다.
      p2: 기스는 멀리 떨어져 있는 인쇄소와 의회만 기다릴 수 있고, 근처의 독자들은 여전히 책을 펼칠 때 'To the Reader'라는 주소를 가장 먼저 만난다.
      p3: 인쇄된 책은 그가 죽은 날인 5월 24일에야 그의 손에 닿았습니다.
    shift:
      p1:
        was: 1543년에 뉘른베르크 판은 사본에서 인쇄되었습니다. 코페르니쿠스의 사인은 별도로 남아 있었고 나중에 Tiedemann Giese를 통해 Rheticus에게 전달되었습니다.
      p2:
        was: 1543년 7월 Giese는 Rheticus에게 개정판을 요청하는 편지를 뉘른베르크 의회에 전달해달라고 요청했습니다. 서명되지 않은 텍스트는 이미 1543년 초판에 유통되고 있었습니다.
        now: 근처로 발송된 사본에는 수정 전표가 붙어 있습니다. 다음 독자는 이를 사용하여 사인을 확인할 수 있으며, 프린터의 최종 응답은 동일한 기록으로 보관됩니다.
      p3:
        was: 1543년 5월 24일 코페르니쿠스는 Frombork에서 사망했습니다. Giese는 나중에 완성된 책이 그가 죽은 날에만 그에게 도착했다고 썼습니다.
        now: 5월 초에 인쇄된 책이 그의 침대 곁에 있었고 그는 여전히 정신이 맑을 때 책을 들고 있었습니다. 몇 주 후 그는 Frombork에서 사망했습니다.
        who: copernicus_frombork
        bio: 코페르니쿠스는 죽기 몇 주 전에 인쇄된 『혁명에 관하여』를 받았고, 그가 수십 년 동안 작업한 책이 인쇄되었다는 것을 알았습니다.
    vignettes:
      preface: '{staff}는 인쇄된 사본을 엽니다. 앞면에 있는 서명되지 않은 주소는 책의 계좌가 단지 계산에 편리한 가정일 뿐임을 나타냅니다. {staff}는 케플러가 그 책을 쓴 사람을 밝히기까지 약 50년이 걸릴 것임을 알고 손가락으로 그 페이지를 닫습니다.'
      window: '{staff}는 병실 외부의 물을 뜨겁게 유지합니다. 안에 있는 사람들은 그 노인이 이제 아는 사람이 거의 없다고 말했고, {staff}는 봄바람을 들어오게 하기 위해 창문을 밀어 열었다.'
      nets: '{staff}는 비스툴라 석호가 보이는 언덕 기슭에서 어부들이 그물을 손질하는 것을 돕습니다. 한 어부는 언덕 위에 밤에 별을 관찰하는 오래된 대포가 있다고 말합니다.'
  smith_kirkcaldy:
    name: 맡겨 둔 책 한 권
    place: 커콜디, 스코틀랜드
    figure: 애덤 스미스
    story: 1776년 3월, 애덤 스미스(애덤 스미스)의 국부론(Wealth of Nations)이 런던에서 출판되었습니다. 8월 25일 그의 친구 David Hume이 에든버러에서 사망했습니다. Hume은 자연 종교에 관한 대화가 인쇄되는 것을 보기 위해 처음으로 Smith를 지명했습니다. Smith는 어려움을 겪었고 Hume은 대신 프린터 William Strahan에게 작업을 맡기고 2년 이내에 나타나도록 요청했습니다. 그 해 11월, 커콜디로 돌아온 스미스는 스트라한에게 흄의 마지막 달에 대한 설명을 썼습니다. Strahan은 결국 거절했고, 1779년 Hume의 조카를 통해 Dialogues가 나왔습니다.
    story_prose:
      opening:
        - 1776년 늦가을, 스코틀랜드 커콜디. 애덤 스미스가 자신이 태어난 마을로 돌아왔습니다. 3월에 그의 국부론은 런던에서 출판되었는데, 그 첫 번째 장은 핀 제작으로 시작되었습니다. 8월에 그의 친구 David Hume이 에든버러에서 사망했습니다.
        - 역사상 흄은 1월 유언장에서 자신의 논문을 관리하도록 스미스를 지명했고, 먼저 그에게 자연 종교에 관한 대화가 인쇄되는 것을 보도록 의미했습니다. 스미스는 원하지 않았습니다. 8월 7일자 편집본은 그 작품을 인쇄업자인 윌리엄 스트라한(William Strahan)에게 맡겼고, 흄이 사망한 후 2년 이내에 이 작품이 나타나도록 요청했습니다. 11월에 스미스는 스트라한에게 커콜디에서 보낸 흄의 마지막 달에 대한 기록을 썼고, 흄의 조카가 1779년에 이름 없이 대화를 꺼낼 때까지 대화는 그 자리에 머물렀습니다. 이 분야에서는 못 박는 사람이 빵집에서 못 몇 개로 돈을 지불하고, 한 여자가 썰물 때 모래 위에서 홍합을 수집합니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 책과 인쇄업을 아는 사람, 또는 종이를 알고 마지막 소원을 솔직하게 말할 수 있는 사람; 말의 무게가 있고 사람을 설득할 수 있는 사람.
      outcomes:
        p1: 흄이 죽은 지 2년이 채 안 되어 스트라한의 가게에는 자연 종교에 관한 대화(Dialogues Concerning Natural Religion)라는 활자가 붙었습니다. 첫 번째 시트가 줄에 걸려 있었는데 잉크가 아직 마르지 않았습니다.
      none: 그해 겨울에도 원고는 여전히 스트라한의 곁에 놓여 있었습니다. 커콜디의 모래 위에서 홍합을 모으는 여자는 바구니를 들고 집으로 걸어갔고, 물 건너편에는 에든버러의 연기가 낮게 피어 있었습니다.
      not_admitted: '{staff}는 그 집 문을 한 번도 통과하지 못하고 모래사장에서 홍합을 모으는 여자를 위해 바구니를 들고 며칠을 보냈습니다. 물 건너편에는 에딘버러의 연기가 내내 낮게 피어 있었습니다.'
      points:
        p1:
          class_lettered: 11월 9일 Smith는 Kirkcaldy에 있는 그의 책상에 앉아 Strahan에게 편지를 보내 Hume의 마지막 달을 기록했습니다. {staff}는 점원이 증서를 복사하면서 자신이 사망한 지 2년 이내에 출판된 8월 7일자 코덱스의 한 줄을 단어 그대로 적었고 그 아래에는 작은 옥타보에 몇 장과 몇 달이 걸릴 것인지를 적고 그의 편지 옆에 종이를 놓았습니다. 스미스는 오랫동안 종이를 보고 접어서 스트라한에게 보낸 편지와 함께 넣었습니다. 봉인되었을 때 책상 위에 있던 다른 글자들보다 두꺼웠습니다.
          else: 11월 9일 Smith는 Kirkcaldy에 있는 그의 책상에 앉아 Strahan에게 편지를 보내 Hume의 마지막 달을 기록했습니다. {staff}는 오후 내내 책상 옆에 앉아 2년 안에 스트라한이 인쇄할 수 있도록 종이에 8월 7일자 코덱스의 내용을 적어서 그에게 건네주었습니다. 스미스는 오랫동안 종이를 보고 접어서 스트라한에게 보낸 편지와 함께 넣었습니다. 봉인되었을 때 책상 위에 있던 다른 글자들보다 두꺼웠습니다.
      excerpts:
        p1: 스미스는 오랫동안 종이를 보고 접어서 스트라한에게 보낸 편지와 함께 넣었습니다. 봉인되었을 때 책상 위에 있던 다른 글자들보다 두꺼웠습니다.
    relic: 핀 공장의 바늘핀
    relic_desc: 스미스가 분업의 효과를 설명할 때 예로 든 바늘핀.
    points:
      p1: Hume이 맡긴 대화는 인쇄되지 않은 상태로 있는 동안 Smith와 Strahan에게 Hume이 요청한 대로 이를 출판하도록 요청하세요.
