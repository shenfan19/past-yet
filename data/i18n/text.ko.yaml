      pose: '{staff}는 도움 없이 머리를 찾을 수 있을 때까지 스케치 사본을 뒤집은 다음 그 아래에 누가 찾았는지 적습니다.'
    story_prose:
      opening:
        - 라임 레지스, 1823년 겨울. 썰물이 끝난 후 메리 애닝은 절벽 아래 해골의 목이 몸통보다 긴 것을 발견합니다. 뼈를 올리는 것만으로는 충분하지 않습니다. 런던 사람들은 종이 한 장을 통해 그것을 보게 될 것이고 누군가는 바위에 갈라진 틈을 따라가며 목뼈를 하나하나 세어보아야 그녀가 절벽 아래 서서 본 것을 알아낼 수 있을 것이다.
        - 역사상 Anning은 나중에 스케치를 보냈습니다. 그 해골은 유명해졌지만, 이 발견물에 관한 논문에는 그녀의 이름이 거의 나오지 않았습니다. 이 여행은 그림이 전송되기 전에 도착합니다.
        - 이 여행에는 세 종류의 사람들이 도움을 줄 수 있습니다. 절벽 아래에서 힘든 일을 하고 밀물이 돌아오기 전에 해골을 꺼낼 수 있는 사람, 세고 그림을 그리고 바위에서 뼈를 말할 수 있는 사람, 기꺼이 앉아서 그녀에게 닿는 말로 그녀와 이야기를 나누는 사람입니다.
      outcomes:
        all: 그해 겨울 런던으로 떠난 스케치에는 긴 목 옆에 작은 숫자가 한 줄로 적혀 있었고, 구석에는 그녀의 이름이 손에 적혀 있었다.
        p3: 편지는 전처럼 런던으로 갔다. 그림 한구석에는 그녀가 직접 쓴 이름이 적혀 있었다.
        p2: 스케치가 런던에 도착한 후 누군가 의심을 품고 그림을 가져간 다음 두개골 아래에서 한 번에 한 뼈씩 숫자를 세어갔습니다.
        p1: 그해 겨울, 절벽 꼭대기에 있는 작은 집에는 해골 전체가 누워 있었는데, 그 해골의 목은 몸보다 길었습니다.
      none: 편지가 간 날, 애닝은 늦게까지 스케치 위에 혼자 앉아 있었습니다. 긴 목이 너무 자주 당겨지고 문질러져서 종이가 흐릿해졌습니다.
      desync: 조수가 절벽 기슭을 덮었을 때 해골의 일부는 아직 꺼내지지 않았습니다. 리콜 전에 {staff}가 마지막으로 본 것은 목뼈 위로 물이 닫히는 것이었습니다.
      not_admitted: '{staff}는 애닝과 함께 절벽 아래로 내려간 적이 없습니다. 썰물 때 그 기슭에는 손에 망치를 들고 그녀만 있었습니다.'
      points:
        p1: 조수가 돌아오기 전에 Anning과 {staff}는 목이 긴 해골을 하나씩 들어올려 오래된 신문지에 싸서 절벽 꼭대기까지 운반했습니다. 마지막 조각은 파도가 그들 뒤에 있는 절벽 기슭을 덮었을 때 막 떠났습니다. 애닝은 한 번 뒤를 돌아보았습니다. 물 위에는 거품 외에는 아무것도 없었습니다.
        p2:
          class_learned: 그녀가 스케치를 그리는 동안 {staff}는 현장 노트의 규칙에 따라 반대쪽 끝에서 뼈를 하나씩 불러내고 이름대로 적었습니다. 숫자가 일치하지 않는 경우 Anning은 뼈의 가장자리가 어디에 있는지 알 수 있을 때까지 균열을 오랫동안 살펴보았습니다. 결국 모든 목뼈에는 고유한 숫자가 있었고, 작은 숫자는 긴 목의 길이를 따라 두개골 아래까지 이어졌습니다.
          class_craft: 그녀가 스케치를 그리는 동안 {staff}는 먼저 패턴을 추적하는 방식으로 균열을 따라 뼈의 윤곽을 가볍게 추적한 다음 다른 쪽 끝에서 긴 목을 세었습니다. 숫자가 일치하지 않는 경우 Anning은 뼈의 가장자리가 어디에 있는지 알 수 있을 때까지 균열을 오랫동안 살펴보았습니다. 결국 모든 목뼈에는 고유한 숫자가 있었고, 작은 숫자는 긴 목의 길이를 따라 두개골 아래까지 이어졌습니다.
          else: 그녀가 스케치를 그리는 동안 {staff}는 그녀가 반대쪽 끝에서 긴 목을 세는 것을 도왔습니다. 숫자가 일치하지 않는 경우 Anning은 뼈의 가장자리가 어디에 있는지 알 수 있을 때까지 균열을 오랫동안 살펴보았습니다. 결국 모든 목뼈에는 고유한 숫자가 있었고, 작은 숫자는 긴 목의 길이를 따라 두개골 아래까지 이어졌습니다.
        p3: 스케치가 전송되기 전에 {staff}는 수년 후 런던에 대해 이야기했습니다. 그곳의 박물관에는 그녀가 절벽 아래에서 파낸 뼈가 옆에 있고 그 옆에 메리 애닝이라는 이름이 표시되어 있으며 그녀의 동상이 라임 바다 옆에 서 있을 것입니다. 애닝은 고개를 들지 않고 귀를 기울였습니다. 그녀의 손에 들린 펜은 그림의 한구석에서 잠시 멈췄고, 거기에 그녀는 자신의 이름을 적었습니다.
