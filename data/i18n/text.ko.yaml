        p2: 7월 17일 밤, 리만은 기침을 너무 심하게 해서 일어나 앉을 수가 없었고, 집주인의 작은 딸은 들어오기를 두려워하며 등불을 들고 문가에 서 있었다. 약을 아는 {staff}는 가져온 나노 의료 키트를 열어 지시대로 사용하고, 가끔 침대 옆에 머물다가 이마에 손을 얹는다. 새벽이 되자 그는 잠이 들었고 호흡도 조금 더 길어졌습니다. 사흘 후 아침에 예수님은 혼자 무화과나무로 나가셔서 의자에 잠시 앉아 계셨습니다. 그는 몸을 굽혀 발 옆에 떨어진 무화과를 주워 서류 옆에 놓았습니다.
