      p2: 길에 쓰러진 사람들을 아무도 도와주지 않았고, 이 지부에서 가족의 북쪽 여행은 예전만큼 힘들었습니다.
      p3: 그의 책은 모두 압수되었으며, 14년 후 그가 팀북투로 돌아왔을 때 이 지부에는 자신의 책이 한 권도 남지 않았습니다.
    shift:
