      p3: 12주 동안 아벨은 프롤랜드의 침대에 누워 방의 추위를 막고 기침과 통증을 완화했습니다.
      p4: Abel이 죽기 전에 그들이 여전히 노력하고 있다는 것을 알 수 있도록 임시 편지를 보내달라고 게시물을 찾는 친구들에게 요청하십시오.
