  copernicus_frombork:
    name: 중심에 놓인 태양
    place: 폴란드 프롬보르크
    figure: 니콜라우스 코페르니쿠스
    story: 1539년 젊은 수학자 레티쿠스(Rheticus)가 프롬보르크(Frombork)에 와서 니콜라우스 코페르니쿠스(니콜라우스 코페르니쿠스)에게 자신의 책을 출판할 것을 촉구했습니다. 1543년에 지구가 회전하고 태양 주위를 돈다는 내용의 De revolutionibus가 뉘른베르크에서 인쇄되었으며, 그 앞에 독자에게 보내는 주소가 서명되지 않았습니다. 코페르니쿠스는 1542년 말부터 병을 앓았고 1543년 5월 24일 프롬보르크에서 사망했습니다. 그의 친구 Tiedemann Giese는 나중에 그가 죽은 날에만 인쇄된 책이 그에게 도착했다고 썼습니다.
    story_prose:
      opening:
        - 1543년 봄, 폴란드 프롬보르크. 니콜라우스 코페르니쿠스는 작년 말부터 병을 앓았습니다. 그가 수십 년 동안 작업한 책인 On the Revolutions는 뉘른베르크에서 인쇄되고 있습니다. 그 안에서 지구는 축을 중심으로 회전하고 태양 주위를 여행합니다. 4년 전 젊은 수학자 레티쿠스(Rheticus)가 비텐베르크(Wittenberg)에서 이곳으로 와서 그에게 그 책을 인쇄해 달라고 촉구했습니다.
        - 역사상 이 책은 앞에 서명되지 않은 주소인 독자에게(To the Reader)라는 문구와 함께 뉘른베르크에서 출판되었습니다. 그의 친구 Tiedemann Giese는 나중에 그가 죽은 날에만 인쇄된 책이 그에게 도착했다고 썼습니다. 5월 24일 그는 Frombork에서 사망했습니다. 7월에 Giese는 Rheticus에게 수정판을 요청하는 편지를 뉘른베르크 시의회에 전달하도록 요청했습니다. 이 지부에서는 언덕 기슭 마을의 어부가 그물을 수선하고, 그 집의 하인이 매일 물을 병실까지 나른다.
        - 여러 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 간호를 알고 병상을 관리할 수 있는 사람, 책을 멀리까지 들고 다닐 만큼 길에서 힘이 센 사람; 서류를 알고 사본과 사인을 구분할 수 있는 사람; 그리고 정오표를 만들 정도로 조심스러운 사람이요.
      outcomes:
        all: 5월 초에 온 책은 이후에도 그의 침대 곁에 머물렀다. 그해 여름 근처에서 빌려준 사본에는 정오표가 들어 있었고, 친필 원고는 천으로 싸서 찬장에 넣어 나중에 기제의 손에 넘겨졌습니다.
        p3: 그 책은 그 후 그의 침대 옆에 놓여 있었고 제목 페이지는 위로 올라갔습니다. 몇 주 후 그는 Frombork에서 사망했습니다.
        p2: 그해 여름, 근처에서 빌려준 사본에는 정오표가 들어 있었는데, 모서리가 구부러져 있었습니다. 다른 곳에 있는 프린터의 답변은 나중에 동일한 파일에 보관되었습니다.
        p1: 천으로 싸인 원고는 나중에 기제의 손에 전달되었고, 그에게서 레티쿠스에게 전달되었습니다. 여러 세기 후에 그 책은 크라쿠프의 Jagiellonian 도서관에 보관되었습니다.
      none: 5월 24일경에 인쇄된 책이 Frombork에 도착했습니다. 병실의 창문은 굳게 열려 있었고 물을 떠온 하인은 문 앞에 잠시 서서 들어가지 않았습니다.
      desync: 서재의 서류는 뒤죽박죽이었고, 작업 서류 두 뭉치는 인쇄용 사본과 함께 들어갔고, 누구도 사인이 어디에 있는지 알 수 없었습니다. {staff}는 Giese가 오기 전에 사무실에서 리콜되었습니다.
