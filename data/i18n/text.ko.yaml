      p2: 발열이 계속됩니다. 그는 더 이상 책상 위에 놓인 페이지를 요청할 수 없습니다.
    shift:
      p1:
        was: '1837년 2월: 그의 약혼자 민나 재글레(Minna Jaeglé)는 스트라스부르에서 취리히로 서둘러 도착했는데, 그가 이미 죽어가고 있을 때였습니다. 그는 그녀 옆에 곧 죽었습니다.'
        now: 이 지점에서 Minna는 취리히에 더 빨리 도착합니다. 그가 아직 충분히 강할 때 그들은 서로 이야기할 수 있습니다.
      p2:
        was: Büchner는 1837년 2월 19일 취리히에서 사망했으며 Woyzeck은 미완성 상태였습니다.
        now: 이 지점에서는 사무실의 의료 키트가 {staff}의 열을 내리는 데 도움이 됩니다. Büchner는 살아 있으며 여전히 책상 위에 있는 페이지를 보여달라고 요청할 수 있습니다.
        who: buchner_zurich
        bio: 이 지부에서 뷔히너는 1837년 2월 취리히에서 병을 앓고 있습니다.
    vignettes:
      order: 독자는 두 사본을 하나로 묶고 잉크로 장면에 번호를 매겼습니다. 각 소스에 별도의 라벨을 추가하고 제거 가능한 전표에 제안된 주문을 기록합니다. 다음 독자가 취소할 수 있습니다. 당신은 그 전표를 집으로 가져옵니다. 아직 최종 주문이 없습니다.
      pause: 미래의 극장에서는 다음에 무엇을 할지 결정해야 한다는 것을 알고 있습니다. 독자는 당신의 대답이 저자의 것인지 묻습니다. 두 가지 시작을 큰 소리로 시도하고 서로 다른 질문이 남는 위치를 표시합니다. 두 번의 일시 중지를 집에 가져갈 수 있으며 완성된 스크립트는 없습니다.
      gap: 페이지가 멈추는 순간 독자에게 멈추라고 요청합니다. 두 사람 모두 누락된 라인을 제공하지 않습니다. 사본에는 한 눈에 알아볼 수 있을 만큼 넓은 공간을 남겨 둡니다. 그 공간은 돌아왔을 때 기억나는 공간이다.
  enheduanna_ur:
    name: 가시덤불 사이의 길
    place: 우르, 메소포타미아
    figure: 엔헤두안나
    story: 우르의 새겨진 디스크에는 엔헤두아나가 사르곤의 딸로 명명되어 있습니다. The Exaltation of Inana에서 화자는 자신을 엔헤두안나라고 부르며 성전에서 쫓겨나는 것을 묘사합니다. 그녀는 자신의 비행을 제비의 비행에 비유하고 가시와 피로에 대해 이야기합니다. 여행 날짜와 경로는 불확실합니다.
    story_prose:
      opening:
        - 우르 밖에서는 황혼이 지면 돌을 보기가 어렵습니다. 엔헤두아나는 가시덤불 옆에 들러 빈 물동이를 들어 올립니다. 그녀와 함께 걷는 누군가가 그들이 앉을 수 있는 더 먼 문간을 기억합니다.
        - 디스크 비문에는 엔헤두안나의 이름이 보존되어 있습니다. 나중에 사본으로 전달되고 전통적으로 그녀의 것으로 간주되는 시는 다른 땅의 이동과 가시를 묘사합니다. 이 여행은 시를 배경으로 하여 그녀에게 길에서 잠시 들를 수 있는 장소를 제공합니다.
        - 긴 산책에 익숙한 사람에게 물을 보내서 나누어 주십시오. 첫 번째로 거주하는 집에서 아침까지 그곳에서 기다리고 싶은지 물어보세요.
      points:
        p1: 그녀의 동반자는 다음 마당까지 물을 저장하고 싶어합니다. 당신은 엔헤두안나에게 계속 걷고 싶은지 물어봅니다. 그녀는 빈 병을 들고 당신에게 가장 가까운 벽을 가리킵니다. 물을 주고 문 앞에 있는 사람에게 새벽까지 거기 앉아 있어도 되는지 물어보세요. 반나절 만에 처음으로 그녀는 가득 찬 항아리를 평지에 내려놓았다.
      outcomes:
        all: 그녀는 낮은 담 안에서 밤을 보낸다. 후기 시에서는 여전히 가시에 대해 이야기하고 있습니다. 여행에는 그녀가 어두워지기 전에 찾은 장소에 대한 별도의 기록이 있습니다.
        p1: 가족은 문 옆에 엔헤두안나를 위한 공간을 마련합니다. 떠나기 전에 그녀는 동료에게 자신의 항아리도 채워달라고 부탁합니다.
      none: 어두워지기 전에는 벽 너머에서 대답이 나오지 않습니다. 파티는 계속 걸어야 한다.
      not_admitted: 그 당사자는 자신의 회사를 인정하고 당신을 부르지 않습니다. 문 옆에 물병을 놓을 시간밖에 없습니다.
      excerpts:
        p1: 물을 주고 문 앞에 있는 사람에게 새벽까지 거기 앉아 있어도 되는지 물어보세요. 반나절 만에 처음으로 그녀는 가득 찬 항아리를 평지에 내려놓았다.
    relic: 점토 물컵
    relic_desc: 길가에 있는 가상의 집에 속한 작은 컵.
    points:
      p1: 엔헤두아나가 신전에서 쫓겨난 후 물을 길어다가 쉴 곳으로 데려가도록 도와주세요.
    points_fail:
      p1: 네가 멈추기를 바랐던 곳은 아직 너무 멀다. 그녀에게 쉴 곳을 제공하기 전에 햇빛이 부족합니다.
    shift:
      p1:
        was: 『이나나 찬미』의 화자는 성전에서 쫓겨나고, 가시덤불에 직면하고, 힘이 빠져나가는 상황을 묘사합니다.
        now: 이 지점에서 {staff}는 엔헤두안나가 피난처에 도달할 때까지 함께 걷고 어두워지기 전에 물을 가져옵니다.
        who: enheduanna_ur
        bio: 이 지점에서 엔헤두안나는 동료들을 만나고 사원을 떠난 후 쉴 곳을 찾습니다.
    vignettes:
      inscription: '{staff}는 가구가 병을 다시 채우는 데 얼마를 청구하는지 확인합니다. 문 앞에 있는 사람은 먼저 술을 마시고 나머지는 해가 뜬 후에 논의해도 된다고 말합니다.'
      support: '{staff}는 동료에게 낮은 벽으로 누군가를 돕기 전에 항아리를 내려놓으라고 요청합니다. 이번에는 항아리가 똑바로 세워져 있습니다.'
      edge: '{staff}는 출입구 옆이 비어 있는지 확인합니다. 안에 있는 누군가가 바구니를 벤치에서 멀리 옮기고 있습니다.'
  ibn_sina_hamadan:
    name: 마지막 복통
    place: 하마단, 페르시아
    figure: 이븐 시나
    story: 이븐 시나는 마지막 여행을 떠나기 몇 년 전에 하마단에서 5권의 의학 정경을 완성했습니다. 그의 동료인 알-주자니(al-Juzjani)가 계속한 기록에서, 이븐 시나는 반복적으로 복통을 겪는다. 그는 1037년 자신이 섬기는 통치자와 함께 하마단으로 여행하던 중 사망합니다.
    story_prose:
      opening:
        - 하마단으로 가는 일행은 침구를 모으고 있습니다. 이븐 시나는 서류를 내려놓고 조금 기다려도 되는지 묻습니다. 동료는 그가 배를 잡고 있는 것을 보고 그가 누울 수 있는 곳을 찾아 주위를 둘러봅니다.
        - 계속되는 그의 전기에는 그의 생애 말년에 반복되는 고통이 기록되어 있습니다. 이븐 시나는 1037년 Hamadan에서 사망했습니다. 이 지점에서 그가 어디에서 머물고 싶은지 물어볼 수 있고 그가 쉬는 동안 누군가와 함께 머물도록 할 수 있습니다.
        - 돌봄 경험이 있는 사람은 언제 멈추고 싶은지 물어볼 수 있습니다. 그가 이미 알고 있는 동료를 찾으세요. 그와 당사자는 얼마나 오래 기다릴지 결정할 수 있습니다.
      points:
        p1: 누군가 그를 도와줄 때가 되었는지 묻습니다. 당신은 담요 옆에 웅크리고 앉아서 어디에서 멈추고 싶은지 묻습니다. 그는 좀 더 안쪽 그늘진 곳을 가리켰습니다. 그곳에는 기대어 놓을 곳이 있을 것입니다. 당신은 동료에게 자신의 물건을 다른 사람에게 전달하고 이븐 시나가 그를 볼 수 있는 곳에 앉도록 요청합니다. 다시 문을 두드리자, 안에서 조금만 더 기다려 달라는 대답이 돌아옵니다.
      outcomes:
        all: 여행의 이 구간에서 일행은 이븐 시나가 언제 일어날 수 있는지 말하기를 기다립니다. 그는 하마단에 도착한 후에도 여전히 사망합니다.
        p1: 한 동료가 그와 함께 앉아 있습니다. 아무도 그에게 이미 포장된 짐을 빨리 가져오라고 요구하지 않습니다.
      none: 다른 사람들은 다시 준비가 되었는데 아직 누울 곳이 없습니다. 앞으로는 더 많은 길이 있습니다.
      not_admitted: 일행 중 한 명이 당신에게 감사를 표하고 아직 만나지 못한 방문객들에게 밖에서 기다리라고 요청합니다. 그가 원하는 것이 무엇인지 물어볼 수 없습니다.
      excerpts:
        p1: 당신은 동료에게 자신의 물건을 다른 사람에게 전달하고 이븐 시나가 그를 볼 수 있는 곳에 앉도록 요청합니다. 다시 문을 두드리자, 안에서 조금만 더 기다려 달라는 대답이 돌아옵니다.
    relic: 접힌 종이 조각
    relic_desc: 일행이 멈춘 곳을 표시하는 가상의 여행 메모입니다.
    points:
      p1: 통증이 다시 찾아오면 이븐 시나에게 어디를 멈추고 싶은지 물어보고 그가 쉬는 동안 함께 있을 사람을 마련하십시오.
    points_fail:
      p1: 당신이 그가 누울 자리를 마련하기 전에 일행은 다시 움직일 준비가 되어 있습니다.
    shift:
      p1:
        was: Al-Juzjani의 기록에서는 재발과 1037년 하마단에서의 이븐 시나의 죽음을 설명합니다.
        now: 이 가지에서 {staff}는 통증이 다시 찾아왔을 때 이븐 시나가 쉴 수 있는 장소를 만들어줍니다. 동료가 그와 함께 머물며 출발을 기다리는 사람들에게 대답을 전합니다.
    vignettes:
      section: '{staff}는 마지막 정차 후 얼마나 멀리 이동했는지 묻고 나중에 다시 읽을 수 있는 스크랩에 답을 넣습니다.'
      sleeve: 누군가 침구를 말아 올리기 시작합니다. {staff}는 이븐 시나가 갈지 여부를 결정할 때까지 담요 하나를 펼쳐 놓아달라고 요청합니다.
      afterlife: '{staff}는 다른 사람들이 준비하는 동안 누가 방에서 기다릴 것인지 묻습니다. 한 동료는 자신의 물건을 실내로 가져갑니다.'
  al_jazari_diyarbakir:
    name: 기발한 기계들을 담은 책
    place: 디야르바키르
    figure: 알자자리
    story: 기계 장치에 관한 알자자리의 논문은 1206년에 작성되었습니다. 1315년에 복사된 살아남은 원고 2절판에는 코끼리 시계가 나와 있습니다.
    story_prose:
      opening:
        - 점원이 배달 테이블의 페이지 목록을 엽니다. 어떤 사람이 그림을 가지고 와서 그들의 제목 중 하나가 두 장에 속할 수 있다고 말합니다. 벤치가 그림자 속으로 들어가고 있습니다. 알자자리는 볼 수 있을 때 다시 확인하라고 요청합니다.
        - 알자자리는 1206년에 기계 장치에 관한 책을 완성했습니다. 남아 있는 사본에는 그림과 함께 설명이 보존되어 있습니다. 여기에서 양도를 보호하고 나중에 복사할 수 있도록 참조 세트를 선택하도록 요청할 수 있습니다.
        - 캡션을 단락과 일치시킬 수 있는 사람에게 전달된 사본을 확인하도록 하십시오. 필사자는 저자가 그대로 남기고 싶은 메모와 공백이 무엇인지 물어볼 수 있습니다.
      points:
        p1: 점원은 내용에서 반복되는 제목을 가리킵니다. 알자자리는 그에게 다른 페이지를 넘기라고 말합니다. 두 번째 그림 옆에 다른 곳으로 이어지는 표시가 있습니다. 두 페이지 참조를 핸드오버 목록에 추가하고 수신자가 직접 테스트하도록 합니다. 그는 책을 덮고 둘 다 찾았다고 말했습니다.
        p2: 필사자는 여백을 본문에 넣어 공간을 절약하려고 합니다. 알자자리는 그에게 원래 문장을 잠시 멈출 때까지 읽게 하고 그 옆에 메모의 다른 출처를 표시합니다. 다음 독자는 저자가 공백으로 남겨둔 부분을 계속 볼 수 있습니다. 필사자는 펜을 들어 덧붙인 부분 아래에 따로 표제를 적습니다.
      outcomes:
        all: 서기는 완전한 원고를 받습니다. 두 번째 사본은 참조를 유지하고 나중에 복사하는 사람이 원본 캡션을 식별할 수 있는 방법을 제공합니다.
        p1: 세트는 통째로 배송되며, 내용물은 각 그림으로 연결됩니다. 최신 노트를 구분하는 참조 사본은 아직 없습니다.
        p2: 메모의 출처가 확인되었습니다. 배송 세트에는 여전히 일치하는 도면이 없으며 여행에서 전체 핸드오버를 유지할 수 없습니다.
      none: 반복되는 제목은 해결되지 않은 상태로 유지됩니다. 다음 필사자가 도착하여 어느 권을 열어야 하는지 물어봐야 합니다.
      not_admitted: 점원은 세트를 받는 사람들의 이름을 읽습니다. 아무도 당신을 부르지 않으며 내용은 닫혀 있습니다.
      desync: 여러 도면을 더 이상 내용과 일치시킬 수 없습니다. 해당 세트는 배송이 불가능하며 사무실에서 여행자를 회수합니다.
      excerpts:
        p1: 두 페이지 참조를 핸드오버 목록에 추가하고 수신자가 직접 테스트하도록 합니다. 그는 책을 덮고 둘 다 찾았다고 말했습니다.
        p2: 다음 독자는 저자가 공백으로 남겨둔 부분을 계속 볼 수 있습니다. 필사자는 펜을 들어 덧붙인 부분 아래에 따로 표제를 적습니다.
    relic: 황동 캠
    relic_desc: 스핀을 스트로크로 바꾸는 모양의 휠입니다.
    points:
      p1: Amid에서 인계 시 설명과 그림을 내용과 대조하여 원고가 완벽하게 전달될 수 있도록 합니다.
      p2: 저자와 함께 참조 사본을 선택하십시오. 나중에 복사자가 구별해야 하는 메모, 캡션 및 공백을 나열하십시오.
    points_fail:
      p1: 여러 다이어그램을 더 이상 해당 섹션과 일치시킬 수 없습니다. 원고는 세트로 넘겨드릴 수 없으며, 해당 직원은 사무실에서 회수됩니다.
      p2: 다음 필사자는 다른 메모가 축적된 초안을 사용하여 작업합니다. 독자는 나중에 추가된 내용을 통해 저자의 설명을 알 수 없습니다.
    shift:
      p1:
        was: 초기 톱카프 사본의 판권에는 완성일이 1206년 1월 16일로 나와 있습니다. 알자자리의 책은 Amid의 Artuqid 법원과 관련이 있습니다.
      p2:
        was: 이후의 사본은 모두 같은 계통으로 내려온 것이 아닙니다. 일부 그림과 문구가 다릅니다.
        now: 컬렉션은 작성자가 사본을 확인한 상태로 유지합니다. 이후의 작성자는 자신의 변경 사항을 별도로 기록한 다음 캡션을 확인할 수 있습니다.
        who: al_jazari_diyarbakir
        bio: 알자자리는 Amid에 자신의 설명을 썼습니다. 책이 복사되고 장소를 이동하면서 텍스트와 그림이 함께 변경되었습니다.
    vignettes:
      sequence: 견습생이 모든 수치를 한 번에 설명합니다. 당신은 첫 번째 악장을 가리키며 그 직후에 무엇이 나오는지 묻습니다. 시계에 관한 이야기를 순서대로 이야기하기 시작합니다.
      viewer: 방문자는 가장 큰 숫자에서 결코 올려다보지 않습니다. 대신 견습생이 표시한 지점을 지켜보라고 합니다. 두 번째 시연에서 그들은 시간에 따른 더 작은 움직임을 봅니다.
      paper: 견습생이 그림을 지나 모델을 가리키는 동안 당신은 그림을 들고 있습니다. 모델이 없는 독자가 어디를 봐야 할지 알 수 있도록 작은 표시 하나를 추가합니다.
  hokusai_edo:
    name: 가나가와 앞바다의 큰 파도
    place: 일본 에도
    figure: 가쓰시카 호쿠사이
    story: 호쿠사이의 가나가와의 파도 아래는 후지산 36경의 목판화입니다. Met의 인상은 대략 1830~1832년으로 거슬러 올라갑니다.
    story_prose:
      opening:
        - 에도 출판사가 카운터에 세 가지 새로운 인상을 남깁니다. 가장 어두운 곳에서는 산 꼭대기의 작은 부분이 채워졌습니다. 가장 창백한 곳에서는 먼 후지산을 보기가 어렵습니다. 조각가는 한 장에 손을 뻗고 프린터는 다른 장에 손을 뻗습니다.
        - 가나가와 앞바다의 파도 아래는 호쿠사이의 후지산 36경 중 하나입니다. 잔존 인상은 블록 마모와 같은 변화를 보존합니다. 언론에서 공유한 참고자료를 넣고 나중에 확인할 수 있도록 출판사에 순서를 남겨달라고 요청할 수 있습니다.
        - 인쇄물을 아는 사람에게 시트를 비교하게 하십시오. 보관을 주선할 수 있는 사람은 Hokusai, 인쇄업체 및 출판업체에 나중에 샘플을 보관하는 방법을 문의할 수 있습니다.
      points:
        p1: 조각가는 증거 한 장을 창문으로 가져가서 파란색 너머로 후지산을 바라볼 수 있습니다. 당신은 프린터에게 같은 빛으로 문장을 보고 다른 시트와 비교하도록 요청합니다. 둘 다 똑같은 명확한 선으로 손가락을 넣었습니다. 선택한 증명은 모서리에 작은 표시가 나타납니다. 먼 산 위의 공간은 깨끗합니다.
        p2: 점원이 샘플을 판매 더미에 밀어 넣습니다. 출판사는 다음에 다시 찾을 수 있는지 묻습니다. 호쿠사이와 프린터가 포장지에 주문서를 작성하고 나중에 교정할 수 있도록 한쪽 끝을 열어두도록 합니다. 블록의 다음 시트는 카운터 근처로 가기 전에 세트 뒤쪽으로 이동합니다.
      outcomes:
        all: 첫인상은 판매 중이며 워크샵에는 여전히 비교할 세트가 있습니다. 다른 프린터가 인계받는 경우에도 페이지를 넘겨서 주문을 읽을 수 있습니다.
        p1: 조각가와 인쇄공은 하나의 교정으로 첫 번째 실행을 완료합니다. 나중에 샘플은 판매 사본에 분산됩니다.
        p2: 샘플에는 주문이 있습니다. 첫 번째 실행은 줄이 끊어지기 때문에 여전히 보류됩니다. 여행자는 교정본이 주문된 장면을 집으로 가져옵니다.
      none: 출판사는 계산대 옆에 가장 깨끗해 보이는 시트를 서 있습니다. 문장을 확인하러 오는 사람들은 여전히 다른 사본을보고 있습니다.
      not_admitted: 출판사는 어떤 프린터를 가져왔는지 묻습니다. 방문자를 아는 사람은 아무도 없으며, 증거는 카운터 뒤에 보관됩니다.
      desync: 파도는 계속 같은 자리에서 부서지고, 첫 번째 배치는 가게를 떠나지 않는다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 선택한 증명은 모서리에 작은 표시가 나타납니다. 먼 산 위의 공간은 깨끗합니다.
        p2: 호쿠사이와 프린터가 포장지에 주문서를 작성하고 나중에 교정할 수 있도록 한쪽 끝을 열어두도록 합니다. 블록의 다음 시트는 카운터 근처로 가기 전에 세트 뒤쪽으로 이동합니다.
    relic: 인쇄용 목판
    relic_desc: 벚나무를 조각한 판자입니다.
    points:
      p1: 파도의 꼭대기와 멀리 있는 봉우리가 모두 명확하게 판독되는 에도 출판사의 증명을 선택하십시오. 첫 번째 실행을 위한 참고 자료로 조각가와 프린터에 맡기세요.
      p2: 출판사가 교정쇄를 나누기 전에 Hokusai와 인쇄소가 비교 세트를 유지하도록 하십시오. 인쇄가 재개될 때마다 출판사에 새로운 교정본을 순서대로 제출하도록 요청하세요.
    points_fail:
      p1: 조각가와 인쇄공은 공유된 증거가 없으며 동일한 파선이 끊어진 시트를 계속해서 다시 보냅니다. 출판사는 첫 번째 배송을 보류하고 사무실에서는 해당 직원을 소환합니다.
      p2: 판매용 사본만 카운터에 보관됩니다. 호쿠사이가 프린터로 확인한 교정본은 다시 재고로 들어가므로 새 프린터에서는 세트를 복구할 수 없습니다.
    shift:
      p1:
        was: 에도 출판사 에이쥬도(Eijudo)는 1831년 새해를 맞아 후지산 36경을 광고했습니다. 가나가와의 파도 아래(Under the Wave off Kanagawa) 시리즈에 속하며, 파도 선이 그대로 남아 있는 초기 인상이 남아 있습니다.
      p2:
        was: 이러한 노출에는 날짜나 배치 번호가 없습니다. 원래 블록은 살아남지 못했고, 인쇄물의 흔적이 그 순서에 대한 주요 단서입니다.
        now: 에이쥬도는 카운터 뒤에 증명서 묶음을 정리정돈해 두었습니다. 새로운 프린터는 나중에 어떤 간격이 나타나는지 알 수 있고 호쿠사이에게 실행이 자신의 디자인과 일치하는지 판단하도록 요청할 수 있습니다.
        who: hokusai_edo
        bio: 호쿠사이가 이미지를 디자인했습니다. 종이에 나타나는 모양은 조각가가 자르는 위치, 프린터가 잉크를 전달하는 방법, 출판사가 또 다른 인쇄를 주문한 시기에 따라 달라집니다.
    vignettes:
      mountain: 판매자는 거품을 가리킨다. 당신은 그에게 손으로 파도를 덮어달라고 요청합니다. 그가 그것을 발견한 후에는 멀리 있는 작은 삼각형이 또 다른 물보라처럼 보이지 않습니다.
      edge: 판매자는 연습 시트를 다듬고 싶어합니다. 다듬지 않은 사본을 옆에 놓고 서명이 가장자리에 얼마나 가까이 있는지 보여줍니다.
      counter: 당신은 무엇보다 Fuji를 계속 찾는 고객에게 인쇄물을 돌립니다. 고객은 마침내 페이지에서 해당 내용을 발견하고 다른 보기를 보도록 요청합니다.
  bell_boston:
    name: 들린 것을 적어 두다
    place: 보스턴
    figure: 알렉산더 그레이엄 벨
    story: 알렉산더 그레이엄 벨의 실험실 노트에는 1876년 3월 10일 보스턴에서 Thomas Watson이 Bell이 송신기에 말한 단어를 듣고 이해했다고 기록되어 있습니다. 6월 25일 필라델피아 100주년 전시회에서 벨은 심사위원들에게 전화기를 시연했습니다.
    story_prose:
      opening:
        - 보스턴에서는 두 방의 문이 닫혀 있습니다. Watson은 귀를 막고 듣는 동안 Bell은 벤치 위에 멈춰서 한 문장 더 시도해 볼 수 있는지 묻습니다. 누군가 작업이 완료되었다고 생각하고 장치를 치우기 시작합니다.
        - 1876년 3월 10일 Bell은 Watson이 다른 방에서 보낸 단어를 이해했다고 기록했습니다. 6월 Bell은 필라델피아에서 열린 100주년 전시회에서 시연했습니다. 여기에서 재판을 보존하고 그의 동료들이 그가 없는 동안 보스턴 학생들이 무엇을 할 것인지 동의하도록 도울 수 있습니다.
        - 장비에 신경쓰고 주의 깊게 들어줄 수 있는 사람이 두 개의 방을 관리하는 데 도움을 줄 수 있습니다. 전시회 전에 직원 일정을 잘 아는 사람에게 교육 준비를 확인하도록 요청하십시오.
      points:
        p1: 왓슨이 나와서 그 말을 들었다고 합니다. 당신은 쓰여진 문장을 뒤집어 놓고 그에게 처음부터 끝까지 무슨 일이 일어났는지 말해달라고 요청합니다. 벨은 묻지도 않고 단어를 듣자 펜을 집어든다. 남자들은 장소를 바꾸고 다시 문을 닫습니다. 이번에는 Watson이 연설하겠습니다.
        p2: 동료가 시간표를 열어보니 벨만 아는 학생들이 있다고 합니다. 벨은 이미 설정된 연습문제를 읽어주고 다음 선생님에게 빈 시간을 채워달라고 부탁합니다. 귀하는 가족을 위해 합의된 시간표의 사본을 만드는 데 도움을 줍니다. 케이스를 포장하기 전에 Bell은 자신의 사본과 철도 티켓을 다른 주머니에 넣습니다.
      outcomes:
        all: 3월 재판은 노트북에 남아 있습니다. 필라델피아에서 시연이 시작되면 보스턴의 수업은 합의된 일정을 따릅니다.
        p1: 왓슨은 자신이 들은 것을 반복합니다. 6월 준비에는 아직 활용 가능한 교안이 부족합니다.
        p2: 학생들에게는 수업을 들어줄 사람이 있습니다. 3월 수첩에는 최종 확인서가 빠져 있고, 여행은 6월의 일정만 보존되어 있습니다.
      none: 장비는 다음 방에서 확인된 말 없이 다시 벤치로 돌아갑니다. 교육 시간표에는 아직 공백이 있습니다.
      not_admitted: 두 방의 문은 모두 닫혀 있습니다. 누군가 그 중 하나를 통해 응답하고 벤치에 방문객을 위한 자리를 남겨두지 않습니다.
      desync: 역사적 반복이나 전시 시연은 상실된다. 여행이 동기화되지 않은 후 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 남자들은 장소를 바꾸고 다시 문을 닫습니다. 이번에는 Watson이 연설하겠습니다.
        p2: 귀하는 가족을 위해 합의된 시간표의 사본을 만드는 데 도움을 줍니다. 케이스를 포장하기 전에 Bell은 자신의 사본과 철도 티켓을 다른 주머니에 넣습니다.
    relic: 전화 수화기
    relic_desc: 얇은 다이어프램이 달린 나무 핸드피스입니다.
    points:
      p1: 한 번 더 시험할 수 있도록 보스턴 장치를 준비하고 Watson이 단어를 반복할 수 있을 때까지 다른 방에서 듣고 있습니다.
      p2: Bell이 보스턴을 떠나기 전에 Bell이 전시회에 참석하지 않은 동안 학생들을 위해 무엇을 해야 하는지 동료들과 합의하게 하십시오.
