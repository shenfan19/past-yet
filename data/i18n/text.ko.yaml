    points:
      p1: 두 여행자가 당일 히라이즈미를 방문할 수 있도록 소라의 귀국 경로와 전환점을 확인하세요.
      p2: 관리인이 자리를 비운 경우 방문객에게 외부 주변을 안내할 수 있는 사람이 누구인지 알아보세요. 두 여행자에게 경로를 전달하기 전에 무엇을 볼 수 있는지 물어보십시오.
