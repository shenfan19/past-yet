        bio: 이 라인에서 리만은 1866년 여름에 결핵에서 회복되었습니다. 그는 괴팅겐의 집으로 돌아가 수년 동안 일했습니다.
    vignettes:
      figs: 7월 18일 저녁, {staff}는 집주인의 어린 딸이 나무 아래에서 떨어진 무화과를 치우는 것을 돕습니다. 거기 있는 의자는 독일 신사를 위한 것이라고 그녀는 설명했다. 만약 그녀가 하나를 놓치면 그의 서류가 보라색으로 나온다.
      boat: 7월 초 {staff}는 뱃사공이 Pallanza에서 레몬 화물을 내리는 것을 돕습니다. 뱃사공은 이번 여름 호수에 보트가 절반 정도만 있다고 말합니다. 청년들은 모두 소집되었고 그는 아내에게 노 젓는 법을 가르쳐야 했습니다.
      chair: 8월에 {staff}는 집주인이 무화과나무 아래에서 의자를 옮기는 것을 돕습니다. 그는 계속해서 소매로 그것을 닦으며 올해만큼 나무에 무화과가 많이 열리지 않았고 그 아래 앉을 사람도 남아 있지 않다고 말했습니다.
      harvest: 8월에 {staff}는 집주인이 Intra에서 시장에 내놓을 무화과를 납작한 바구니에 담는 것을 돕습니다. 그 나무는 올해만큼 많은 열매를 맺은 적이 없다고 그는 말하며, 햇빛에 쪼개진 나무들은 집 창턱에 따로 보관해 두었습니다.
  du_chatelet_luneville:
    name: 프랑스어로 읽는 뉴턴
    place: 뤼네빌
    figure: 에밀리 뒤 샤틀레
    story: 1749년 여름, 에밀리 뒤 샤틀레는 Lunéville에 있는 Stanislas의 궁정에서 아이를 기다리며 해설과 함께 Newton의 Principia 프랑스어 번역을 마무리했습니다. 9월 4일에 딸을 낳았다. 9월 10일 그녀는 42세의 나이로 세상을 떠났습니다. 원인은 일부에서는 산욕열로, 다른 일부에서는 폐색전증으로 제시됩니다. 같은 날 파리 왕립도서관은 그녀의 논평 3봉지에 대한 영수증에 서명했습니다. 완전한 번역본은 1759년에 나왔습니다.
    relic: 잉크병
    relic_desc: 책상에 있던 작은 잉크병이 밤새도록 작업되었습니다.
    points:
      p1: 뤼네빌에서 왕립 도서관에 요청과 함께 보내기 전에 세 개의 해설 패킷 목록을 작성하세요.
      p2: 가장 어려운 두 구절에 대해 Clairaut의 결정을 떠나 자신의 번역이 있어야 할 위치와 이후 개정판이 별도로 나열되어야 하는 위치를 확인하도록 하세요.
      p3: 출산 후 며칠 동안 그를 돌보고 치료하고 살려주세요
    points_fail:
      p1: 해설이 포함된 패킷은 뒤에 남아 있습니다. 도서관은 편지만 받고 사무실은 해당 직원을 소환합니다.
      p2: 두 개의 초안이 편집자에게 전달되지만 수정된 내용을 인쇄하는 방법에 대한 결정은 편집자에게 전달되지 않습니다.
      p3: 9월 10일, 그녀는 딸이 태어난 지 6일 만에 뤼네빌에서 사망했습니다.
    shift:
      p1:
        was: 1749년 9월 10일, 왕립도서관은 뉴턴에 대한 Du Châtelet의 논평 3봉지에 대한 영수증을 발행했습니다.
      p2:
        was: 1759년 Du Châtelet가 사망한 후 Clairaut의 도움을 받아 프랑스어판 전체가 출판되었습니다.
        now: 편집자는 자신이 승인한 두 가지 결정을 가지고 있으며 이후 변경 사항은 다른 페이지에서 설명합니다. 독자들은 그녀의 논평과 편집상의 추가 사항을 구별할 수 있습니다.
      p3:
        was: 1749년 9월 4일 밤 Du Châtelet는 딸을 낳았고 9월 10일 Lunéville에서 사망했습니다. 원인은 일부에서는 산욕열로, 다른 일부에서는 폐색전증으로 제시됩니다.
        now: 그녀는 출산 후 며칠을 지나 가을에 회복되었습니다. 그녀는 자신의 뉴턴 번역이 인쇄되는 것을 직접 보았고 수년 동안 연구를 계속했습니다.
        who: du_chatelet_luneville
        bio: Du Châtelet는 1749년 탄생 이후에도 살아남았고, 그녀의 French Newton과 그에 대한 논평을 직접 인쇄소에 가져갔으며 그 후에도 수년 동안 계속 글을 쓰고 연구했습니다.
    vignettes:
      stairs: 9월 4일 이른 아침, {staff}는 세탁소 소녀가 깨끗한 천 더미를 위층으로 옮기는 것을 도와줍니다. 그녀는 거기에 있는 램프가 자정에 켜졌다고 말했습니다. 그녀는 계단의 발 수를 세었고, 날이 밝을 때까지 11번의 여행이 되었습니다.
      candles: 8월 말에 {staff}는 양초를 관리하는 늙은 하인이 가게 계산을 돕습니다. 후작 부인은 왕의 서재보다 더 많은 촛불을 태워서 이번 달에 계좌를 일주일 일찍 보내야 한다고 말했습니다.
      arbour: 10월에 {staff}는 정원사가 정자의 커튼을 내리는 것을 돕습니다. 법원은 올 가을 초에 조용해졌다고 그는 말했습니다. 대부분의 해 동안 그들은 여전히 여기서 연극을 하고 있을 것입니다.
    story_prose:
      opening:
        - 뤼네빌, 1749년. 뒤 샤틀레는 출산이 임박했고, 그녀가 번역한 뉴턴의 프린키피아 원고가 아직도 그녀의 책상 위에 있습니다. 그녀는 라틴어 작품을 프랑스어로 번역했으며, 자신의 논평에서 파생된 내용을 설명했습니다. 나중에 뉴턴의 책을 읽는 프랑스 독자들은 뉴턴이 어떻게 그것을 해냈는지 그와 함께 읽을 것입니다.
        - 역사상 그녀는 딸이 태어난 지 6일 만에 세상을 떠났다. 그날 파리 왕립도서관은 세 권의 논평에 대한 영수증을 발행했습니다. 원고는 보존되었고 10년 후에 완전한 작품이 나왔습니다. 그녀는 인쇄된 사본을 한 장도 본 적이 없습니다.
        - 이 여행에는 두 종류의 사람이 도움을 줄 수 있습니다. 원고를 아는 사람이 번역을 도울 수 있고, 간호를 알고 적절한 약과 도구를 가져오는 사람이 누워 있는 방 밖에서 감시할 수 있습니다.
      outcomes:
        all: 그해 가을 뉴턴은 다시 뤼네빌의 책상 위에 누워 있었습니다. 교정본은 한 페이지씩 왔고, 그녀는 그것을 한 페이지씩 읽었고, 여백은 그녀가 직접 가져갔습니다.
        p3: 그해 가을, 그녀는 책상으로 돌아왔습니다. 증거가 도착했을 때 의심스러운 페이지를 누구에게도 보내서 물어볼 필요가 없었습니다. 그것은 그녀의 팔꿈치에 펼쳐져 있었다.
        p2: 10년 후 Clairaut는 원고의 포장을 풀었고 서명된 시트는 원래 있던 자리에 여전히 자리잡고 있었습니다. 그녀가 번역한 대로 어떤 줄을 인쇄할지 그는 그 시트를 기준으로 한 군데씩 정했습니다.
        p1: 왕립 도서관의 영수증에는 그녀의 이름과 세 봉지의 개수가 적혀 있었습니다. 작성된 날은 9월 10일이었습니다.
      none: 9월에는 Lunéville의 책상이 정리되었습니다. 모서리에 있는 잉크병은 아직 뚜껑이 닫혀 있지 않았습니다.
      desync: 원고를 넘겨줄 시간이 되었는데도 집에는 아직 해설이 남아 있었습니다. 보증금을 이체할 수 없어 사무실에서 먼저 {staff}에 전화를 걸어왔습니다. 떠날 때에도 세 개의 꾸러미는 여전히 책상 밑에 묶여 있었습니다.
      not_admitted: '{staff}는 그 책상까지 가지 못했습니다. 창문을 통해 종이가 겹겹이 쌓여 있는 것이 보였고, 등불은 아주 늦은 시간까지 켜져 있었습니다.'
      points:
        p1: '{staff}는 파견 전에 세 개의 해설 패킷을 하나씩 입력하고 목록과 다시 확인했습니다. 마지막 꾸러미의 매듭이 팽팽하게 당겨졌을 때, 책상 위에는 이미 잉크가 말라버린 왕립 도서관에 보내는 편지만이 남아 있었습니다.'
        p2: 두 개의 초안이 나란히 놓여 있었고 변경 사항이 가까웠습니다. 그녀는 펜 끝으로 종이를 만지고 한 군데씩 훑어보았고, {staff}는 그것을 다른 시트에 한 군데씩 적었습니다. 작업이 완료되자 그녀는 시트를 가져와 끝까지 읽어본 후 오른쪽 하단에 자신의 이름에 서명했습니다.
        p3: 출산 후 며칠 후 그녀의 상태는 급격히 악화되었습니다. {staff}는 가져온 의료 케이스를 열고 침대를 지키며 체온을 측정하고 시계에 따라 약을 먹이고 밤새도록 램프를 켜 두었습니다. 딸이 태어난 지 6일이 지났고 Du Châtelet는 아직 살아있었습니다. 가을에 인쇄소에서 교정본을 보냈습니다. 그녀는 본문에 해설이 빽빽이 들어 있는 페이지로 가서 종이를 가까이 대고 펜을 집어 잘못 인쇄된 줄 아래에 선을 그었습니다.
      excerpts:
        p3: 가을에 인쇄소에서 교정본을 보냈습니다. 그녀는 본문에 해설이 빽빽이 들어 있는 페이지로 가서 종이를 가까이 대고 펜을 집어 잘못 인쇄된 줄 아래에 선을 그었습니다.
        p2: 그녀는 펜 끝으로 종이를 만지고 한 군데씩 훑어보았고, {staff}는 그것을 다른 시트에 한 군데씩 적었습니다. 작업이 완료되자 그녀는 시트를 가져와 끝까지 읽어본 후 오른쪽 하단에 자신의 이름에 서명했습니다.
        p1: '{staff}는 파견 전에 세 개의 해설 패킷을 하나씩 입력하고 목록과 다시 확인했습니다. 마지막 꾸러미의 매듭이 팽팽하게 당겨졌을 때, 책상 위에는 이미 잉크가 말라버린 왕립 도서관에 보내는 편지만이 남아 있었습니다.'
  noether_gottingen:
    name: 다른 사람의 이름으로 열린 강의
    place: 괴팅겐
    figure: 에미 뇌터
    story: 1915년 다비드 힐베르트(David Hilbert)와 펠릭스 클라인(Felix Klein)은 에미 뇌터(에미 뇌터)를 괴팅겐으로 데려왔지만 대학에서는 여성에게 강의 자격을 부여하지 않았으며 1916년 겨울부터 그녀의 강좌가 힐베르트(Hilbert)라는 이름으로 발표되었습니다. 1918년 7월 26일 클라인은 자신의 논문 불변 변이 문제를 괴팅겐 과학 협회에 제출했고, 9월 말에 최종 버전을 제출했습니다. 이 논문은 행동의 연속적인 대칭성을 보존 법칙과 연결합니다. 그녀는 1919년 6월 강의 자격을 얻었고 1923년이 되어서야 처음으로 강의에 대한 약간의 고정 급여를 받았습니다.
    story_prose:
      opening:
        - 괴팅겐, 1918년 7월. 3년 전 데이비드 힐베르트(David Hilbert)와 펠릭스 클라인(Felix Klein)은 현재 36세인 수학자 에미 뇌터(에미 뇌터)를 괴팅겐으로 데려왔지만 대학에서는 여성에게 강의 자격을 부여하지 않았으며 1916년 겨울 학기부터 그녀의 강좌가 힐베르트의 이름으로 발표되었습니다. 이번 여름에 그녀는 행동의 연속적인 대칭을 보존 법칙과 연결하는 불변 변이 문제(Invariant Variational Problems)를 썼습니다.
        - 역사상 7월 26일 클라인은 괴팅겐 과학 협회에 논문을 제출했고 9월 말에야 최종 버전을 제출했습니다. 다음 해에 그녀는 강의를 하게 되었고, 1923년이 되어서야 처음으로 강의를 위한 약간의 고정 급여를 받았습니다. 이 지점의 수학 건물에는 여러 학기의 시간표를 고정한 포터가 있고, 그녀가 묵는 뒷마당에는 빵 쿠폰 계산을 중단한 여주인이 있습니다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 대학에서 강의한 사람, 기록 보관소를 보관하거나 교정본을 읽은 사람, 서명된 논문과 요약본을 거기에서 함께 가져오는 체계적이고 배운 사람; 기록 보관소를 보관했거나 강의를 했고, 세미나에 대한 보수를 얻기 위해 부서 전체에 대해 이야기할 수 있는 사람.
      outcomes:
        all: 1919년 6월, 시험 강의를 마친 후 뇌터는 괴팅겐에서 강의를 하게 되었고, 그녀의 논문은 자신의 이름으로 '불변 변이 문제'였습니다. 그 전에 그녀의 세미나는 이미 약간의 급여를 받았고 그녀와 함께 일하는 학생들은 매주 고정된 시간을 가지고 있었습니다.
        p2: 그해 겨울 그녀의 세미나에는 약간의 보수가 있었고, 그녀와 함께 일하는 학생들은 매주 고정된 시간을 가졌습니다. 1919년 6월 시범 강의를 마친 후 강의 허가를 받았습니다.
        p1: 논문은 제때에 제출되었고, 인쇄된 사본에는 그녀의 이름이 적혀 있었습니다. 1919년 6월 그것은 강의할 권리에 대한 그녀의 주장이 되었습니다.
      none: 12월 말에도 세미나는 무급으로 계속 진행되었습니다. 게시판의 줄에는 여전히 뇌터 박사의 도움을 받아 힐베르트 교수라고 적혀 있었고, 드로잉 핀 주위에는 녹이 슨 고리가 퍼져 있었습니다.
      desync: 7월 26일 회의 이전에는 논문과 그 요약이 여전히 두 더미로 흩어져 있었고 저자의 페이지를 찾을 수 없었습니다. {staff}가 리콜되었을 때 서명되지 않은 첫 페이지가 테이블 위에 놓여 있었고 시계 밖에서는 눈에 띄었습니다.
