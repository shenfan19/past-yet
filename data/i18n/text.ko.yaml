      departure: '{staff}는 짐 목록의 제목을 유지하지만 여행자가 진정으로 멈출 곳을 표시하기 위해 그 아래에 빈 줄을 남겨 둡니다.'
      roll: '{staff}는 목적과 첫 번째 단계의 두 전표를 함께 굴린 다음 마을 가장자리에서 포터가 사용할 수 있는 전표를 돌려주고 다른 전표를 보관합니다.'
  murasaki_kyoto:
    name: 세계 최초의 위대한 장편소설
    place: 교토
    figure: 무라사키 시키부
    story: 1008년 가을, 쇼시 황후는 아들을 낳았고, 그녀의 시녀 중 한 명인 무라사키 시키부(무라사키 시키부)는 그 후 몇 주 동안 일기를 썼습니다. 50일째 되는 연회에서 한 신하가 겐지 이야기에 나오는 소녀인 "젊은 무라사키"를 불렀습니다. 이 이야기는 알려진 가장 오래된 표시입니다. 11월에 여인들은 종이를 선택하고, 쇼시가 궁전으로 가져갈 수 있도록 이야기를 복사하고 제본했으며, 미치나가는 무라사키가 그녀의 방에 보관했던 초안을 가져갔습니다. 그녀 자신의 손에 있는 어떤 사본도 살아남지 못합니다.
    story_prose:
      opening:
        - 1008년 간코 5년 가을, 교토. 이치조 천황의 황후인 쇼시가 아들을 낳았고, 그녀의 시녀 중 한 명인 무라사키 시키부가 그 이후 몇 주 동안 일기를 쓰고 있습니다. 50일째 되는 연회에서 한 신하가 겐지 이야기에 나오는 소녀인 "젊은 무라사키"를 부르는데, 이 이야기가 알려진 가장 오래된 표시입니다.
        - 역사상 11월에 여인들은 종이를 골라서 그 이야기를 베껴서 쇼시가 궁궐로 가져갈 수 있도록 제본했습니다. 무라사키가 근무하는 동안 미치나가는 자신의 방에서 아직 수정하지 않은 초안을 꺼내 딸 켄시에게 주고, 무라사키는 자신의 걱정을 일기에 적었습니다. 그녀의 손에 있는 사본은 남아 있지 않으며, 이야기는 서로 다른 후기 원고 라인을 통해 전해집니다. 이 지점에서는 Shōshi의 여성 중 한 명이 복사할 용지를 관리하고 다른 여성은 연회가 어떻게 진행되는지 알고 있습니다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 기록 보관소를 보관하거나 교정본을 읽어본 사람, 또는 한 권의 책이라도 잘못되는 것을 방지하기 위해 능숙하고 인내심을 갖는 사람; 책을 알고 사람들과 이야기를 나눌 수 있는 사람이 대출할 책을 선택합니다.
