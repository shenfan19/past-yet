      p2: 두이노 휴가가 끝나기 전에 병을 치료하고 비엔나로 돌아가도록 하세요.
    points_fail:
      p1: 그는 여전히 의심하는 사람들 사이에서 여름을 보낸다. 이 분야에서는 브라운 운동에 대한 실험이 원자를 입증할 것이라고 그에게 말한 사람이 아무도 없었습니다.
      p2: 9월 5일은 역사상 그랬던 것처럼 일어났습니다. 이 지점에서 그는 비엔나에 있는 강연자로 돌아오지 않았습니다.
    shift:
      p1:
        was: 1906년 9월 5일 볼츠만이 사망했을 때에도 많은 물리학자와 화학자들은 여전히 원자가 실제로 존재하는지 의심했습니다. 1908년부터 페랭의 브라운 운동 실험은 아인슈타인의 1905년 예측을 확증했고 원자는 일반적으로 받아들여지게 되었습니다.
        now: 그해 여름 그는 몇 년 안에 누군가가 실험을 통해 원자 문제를 해결할 것이라는 것을 이미 알고 있었습니다.
      p2:
        was: 1906년 5월 볼츠만은 병가를 냈고 스테판 마이어(Stefan Meyer)가 강의를 맡았다. 9월 5일 그는 두이노(Duino)에서 휴가를 보내던 중 62세의 나이로 사망했습니다.
        now: '{staff}는 그해 여름 Duino에서 그와 함께 지냈고 병은 서서히 완화되었습니다. 가을에 그는 가족과 함께 비엔나의 집으로 돌아가 다시 가르쳤고, 원자가 실험으로 확인되는 것을 보며 살았습니다.'
        who: boltzmann_duino
        bio: 이 노선에서 볼츠만은 1906년 가을에 회복하여 비엔나로 돌아가 몇 년 동안 더 가르쳤고 페랭의 실험이 원자에 대한 승인을 얻는 것을 보았습니다.
    shift_all: 그는 자신의 이론이 굳건해질 것이라는 것을 알고 병이 완화되었으며, 가을에 비엔나로 돌아가 가르치기 시작했습니다.
    vignettes:
      pebbles: 7월에 {staff}는 어부의 어린 아들이 해변에서 자갈 한 통을 세는 것을 돕습니다. 소년은 너무 작아서 셀 수 없는 것이 거기 있는지 묻습니다. {staff}는 누군가가 셀 수 있든 없든 거기에 있다고 말합니다. 소년은 그것에 대해 생각하고 또 한 줌을 던졌습니다.
      nets: 7월 초 {staff}는 어부가 해안에서 건조 중인 그물을 가져오는 것을 돕습니다. 슬로베니아어, 이탈리아어, 독일어, 어부는 이 만 주변에서 그런 소리가 들리고 물고기는 당신이 어느 쪽에서 저주하든 상관하지 않는다고 말합니다.
      towels: 8월에 {staff}는 호텔 가정부가 바다에서 말리는 수건을 가져오는 것을 돕습니다. 올해 초 물이 따뜻해졌고, 도시에서 온 손님들이 계절 내내 머무르고, 소금 때문에 손의 피부가 벗겨졌다고 그녀는 말합니다.
  tesla_wardenclyffe:
    name: ‘계획’이라고 적힌 한 줄
    place: 롱아일랜드 쇼어햄
    figure: 니콜라 테슬라
    story: 1901년 3월 J. 피어폰트 모건(J. Pierpont Morgan)은 니콜라 테슬라(니콜라 테슬라)의 무선국에 150,000달러를 투자하기로 합의했습니다. 건축가 Stanford White는 Long Island의 Wardenclyffe에 있는 건물을 설계했으며, 그해 Tesla는 그에게 타워와 실험실에 관해 여러 번 편지를 보냈습니다. 9월에 건축이 시작되었습니다. 12월에 마르코니는 대서양을 건너 보내는 신호를 들었습니다. Tesla는 1902년 6월에 그의 실험실을 벽돌 건물로 옮겼습니다. 1903년 7월 모건은 더 이상 돈을 선불하지 않겠다고 썼습니다. 이 탑은 1917년에 폭파되었습니다.
    story_prose:
      opening:
        - 1901년 9월 롱아일랜드 북쪽 해안에 있는 워든클리프. 반년 전 J. 피어폰트 모건(J. Pierpont Morgan)은 발명가 니콜라 테슬라(니콜라 테슬라)를 위해 무선국에 15만 달러를 투자하기로 합의했고 건축가 스탠포드 화이트(Stanford White)는 이곳의 실험실과 타워를 설계했습니다. 테슬라(Tesla)는 무선 통신 및 무선 전력 전송을 위한 타워를 의미합니다.
        - 역사상 그해 9월 건축업자의 입찰가는 예상보다 높았고 Tesla는 White에게 타워와 실험실에 대해 여러 번 편지를 보냈고 도면은 계속해서 변경되었습니다. 12월에 마르코니는 대서양을 건너 보내는 신호를 들었습니다. 1903년 7월 모건은 더 이상 돈을 내지 않겠다고 썼고 1917년에 탑이 폭파되었습니다. 이 지점에는 현장 감독관이 있고, 파수꾼은 절벽에 판자를 보관하고, 카터는 판자를 모래 길 위로 운반합니다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 기록 보관소를 보관했거나 목수로 일한 사람, 또는 수정된 그림과 오래된 그림을 알려주고 건물과 탑의 각 비용을 확인하는 편리하고 체계적인 사람; 그리고 Tesla가 돈을 계속해서 조달할 수 있도록 사람들과 이야기를 나눌 수 있는 사람도 있습니다.
      outcomes:
        all: 1902년 6월 Tesla는 그의 실험실을 벽돌 건물로 옮겼습니다. 결국 돈은 모두 부족해졌고, 두 페이지의 계좌는 창고 벽에 고정되어 지불된 부분 아래에 선이 그어져 있었습니다.
        p3: 결국 돈은 부족했다. 현장에서는 합의된 기초 작업을 완료했고, 돈이 없는 항목은 자체 페이지에 나열되어 창고 문 뒤에 고정되었습니다.
        p2: 1902년 6월 Tesla는 그의 실험실을 벽돌 건물로 옮겼습니다. 타워에 대한 입찰은 여러 번 변경되었으며 각 입찰은 이전 페이지에서 확인할 수 있었습니다.
        p1: 1902년 6월 Tesla는 자신의 실험실을 Wardenclyffe의 벽돌 건물로 옮기고 1906년까지 그곳에서 일했습니다. 실험실과 타워 부지는 오늘날까지 남아 있습니다.
      none: 1903년 7월에 모건은 더 이상 돈을 선불하지 않겠다고 썼습니다. 이 탑은 10년 넘게 절벽 위에 서 있었다가 1917년에 폭파되었습니다. 벽돌 건물은 아직 거기에 있습니다.
      desync: 9월 19일에 두 세트의 도면이 한 더미에 섞여 놓여 있었고 건축업자는 이전 도면에서 작품 가격을 책정했으며 누구도 어떤 세트를 따를지 말할 수 없었습니다. {staff}가 리콜되었을 때 감독은 더미 전체를 말아서 끈으로 묶고 있었습니다.
      not_admitted: '{staff}는 현장에 들어가지 못했고, 절벽까지 모래 트랙 옆에 며칠 동안만 서 있었습니다. 판자를 실은 수레가 계속해서 지나가자 바퀴가 모래 속으로 가라앉았고, 사람들이 뒤에서 그것을 다시 밀어냈습니다.'
