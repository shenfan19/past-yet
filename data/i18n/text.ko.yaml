  mary_anning_lyme_regis:
    name: 절벽 속의 뼈
    place: 라임 레지스
    figure: 메리 애닝
    story: 1811년경 메리 애닝의 형제 Joseph은 Lyme Regis의 절벽에서 어룡의 두개골을 발견했고, 1812년 11월 Mary는 약 5m 길이의 어룡의 뼈를 파냈습니다. 1823년 12월에 그녀는 처음으로 수장룡의 완전한 골격을 발견했고, 1828년 12월에는 영국에서 최초의 익룡이 발견되었습니다. 그녀는 1847년 47세의 나이로 세상을 떠났는데, 여전히 돈이 부족했습니다. 그녀가 발견한 내용에 관한 논문에서는 그녀의 이름이 거의 나오지 않았습니다.
    relic: 암모나이트
    relic_desc: 푸른 리아스에서 갈라져 나온 코일 모양의 화석 껍질.
    points:
      p1: 12월 10일에 수장룡을 절벽 아래에 안전하게 보관하고 다음 가을과 밀물이 오기 전에 전체를 꺼내십시오.
      p2: 그녀가 긴 목뼈를 뼈대로 세고 그릴 수 있도록 도와주세요. 그러면 런던으로 보낸 스케치가 질문에 답할 수 있습니다.
      p3: 이 뼈들이 언젠가는 그녀의 이름을 갖게 될 것이라는 사실을 평생 동안 그녀에게 알려주십시오.
    points_fail:
