          class_lettered: 9월 19일 현장 창고의 긴 테이블 위에 두 세트의 그림이 놓여 있었는데, 제목은 정확히 같았고 크기도 일치하지 않았습니다. 건축업자들은 이전 세트의 작품 가격을 모두가 기대했던 것보다 훨씬 높게 책정했습니다. 서류작업에 익숙한 {staff}는 수정된 도면과 오래된 도면을 한 장씩 분리하고, 각 접힌 부분 아래에 날짜를 연필로 적고, 각 세트에 서명을 한 다음 벽돌 두 개 아래에 무게를 둡니다. 감독은 수정된 세트를 집어들고 잠시 동안 창문의 빛을 바라보고 있다가 두 번 접어 재킷 주머니에 집어넣습니다. 그는 창고에서 나와 허세를 불러일으키고 남자들에게 더미를 가져오라고 합니다.
