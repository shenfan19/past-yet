      p2: 파리 회고록을 찾는 사람들은 여전히 제목만 가지고 오래된 접수 기록을 뒤져야 합니다.
      p3: 감기와 기침을 달래주는 사람은 아무도 없으며, 이 지점에서는 Froland에서의 마지막 몇 주가 예전만큼 힘들었습니다.
      p4: 제때에 Froland에 어떤 소식도 전달되지 않습니다. 공식적인 확인이 너무 늦었습니다.
