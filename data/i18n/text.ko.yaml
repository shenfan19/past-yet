  fanny_mendelssohn_berlin:
    name: 자기 이름으로 펴낸 여섯 곡
    place: 베를린
    figure: 파니 멘델스존 헨젤
    story: 파니 헨젤(Fanny Hensel)의 여섯 개의 노래, Op. 1은 1846년에 자신의 이름으로 발표되었습니다. 지난 봄에 그녀는 피아노 트리오를 완성하고 Bergeslust를 썼습니다. 그녀는 1847년 5월 14일 베를린에서 리허설을 하던 중 병에 걸려 그날 사망했습니다. 이 세 사람은 1850년에 인쇄물로 등장했습니다.
    story_prose:
      opening:
        - 1847년 봄, 베를린. 파니 헨젤(Fanny Hensel)은 자신의 이름으로 6곡을 출판했습니다. 피아노 트리오를 마친 후 그녀는 더 이상 음악이 나오지 않는다고 일기에 적는다.
        - 역사상 그녀는 마지막 곡 하나를 완성했습니다. 5월 14일 그녀는 리허설 중 병에 걸려 그날 사망했습니다. 이 부문에서는 플레이어가 가져온 세 가지 점수에 서로 다른 점수가 부여됩니다.
        - 점수를 비교하고 플레이어에게 작업 순서를 설명할 수 있는 사람이 도움을 줄 수 있습니다. 무슨 일이 생기면 누군가는 음악을 내려놓고 도움을 요청해야 할 것입니다.
      points:
        p3: 헨젤은 리허설에서 다음 페이지를 넘기지 않습니다. {staff}는 가수들에게 멈춰 달라고 요청하고, 누군가를 문앞으로 보내 의사를 데려오며, 그녀가 알아볼 가족 구성원이 누구인지 묻습니다. 가수들은 뒤로 이동하여 의자 사이에 길을 만듭니다. 그녀의 가족 중 한 명이 점수를 바닥에 놓고 그녀 옆에 앉았습니다. 그녀가 한 번도 보지 못한 페이지가 아직 열려있습니다.
        p1: '{staff}는 Hensel이 자신의 노래를 위해 할당한 시간을 유지할 수 있도록 플레이어에게 나중에 점수를 수집하도록 요청합니다. 그녀는 아래층에서 누군가 문을 여는 소리를 듣고 계속 자리에 앉아 있습니다. 그녀는 종이에 마지막 줄을 적는다. 두 번째 노크가 올 때에도 그녀의 잉크는 여전히 젖어 있습니다.'
        p2: '{staff}는 플레이어의 복사본 옆에 작업 점수를 놓고 각 변경 사항이 어디서 왔는지 묻습니다. 헨젤은 두 곳을 살펴보고 한 표시를 지우고 다른 표시를 펜으로 더 세게 누릅니다. 플레이어가 점수를 받으면 세 권의 책이 모두 같은 페이지에 열립니다.'
      outcomes:
        all: 나중에 가족은 같은 점수로 상담을 받습니다. 몇몇 사람들은 그날 그녀 옆에 누가 앉았는지, 그녀가 그 페이지에 어떤 책을 남기기로 했는지 기억합니다.
        p3: 누군가 의사를 데리러 떠난 뒤 방은 한동안 조용했다. 헨젤과 가장 가까운 의자는 다시 움직이지 않습니다.
        p1: 마지막 곡이 완성되었습니다. 선수들이 위층으로 올라갔을 때, 시트는 여전히 건조되도록 방치되어 있었습니다.
