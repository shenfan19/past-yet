  vermeer_delft:
    name: 빚을 진 화가
    place: 델프트
    figure: 요하네스 페르메이르
    story: 1672년 전쟁 이후 요하네스 페르메이르는 그림 한 점을 거의 팔 수가 없었고, 1675년 7월에 천 길더를 빌리기 위해 암스테르담으로 갔다. 1675년 12월, 그의 미망인은 나중에 이렇게 썼습니다. 그는 하루 반 만에 건강한 상태에서 사망했습니다. 그는 43세의 나이로 12월 15일 델프트에 묻혔고, 11명의 자녀를 남겼습니다. 1676년 초 카타리나 볼네스는 빵 빚을 갚기 위해 자신의 그림 두 점을 제빵사에게 주었고, 2월 24일 그녀는 어머니 마리아 틴스(Maria Thins)에게 회화 예술(The Art of Painting)을 넘겼습니다. 2월 29일에 집의 목록이 조사되었고, 4월에 그녀는 고등 법원에 빚을 탕감해 달라고 요청했습니다.
    story_prose:
      opening:
        - 1675년 12월 초 델프트의 Oude Langendijk. 43세의 화가 요하네스 페르메이르가 그의 아내 Catharina Bolnes 및 11명의 자녀와 함께 이곳에 살고 있습니다. 그는 부드러운 빛으로 조용한 방을 그렸으며, 그의 그림 중 약 40점만이 남아있습니다. 1672년 전쟁 이후 미술 거래는 붕괴되었습니다. 자신의 작품은 거의 팔리지 않았고, 그가 거래하기 위해 구입한 다른 거장들의 그림은 그의 손에 남겨졌습니다. 7월에 그는 천 길더를 빌리기 위해 암스테르담으로 갔다.
        - 역사에 따르면 카타리나는 나중에 자녀와 빚의 무게로 건강한 상태에서 하루 반 만에 사망했으며 12월 15일에 묻혔다고 썼습니다. 다음 해 초 그녀는 3년치의 빵을 조건으로 그의 그림 두 점을 제빵사에게 주었고, 2월 24일에 그의 스튜디오에서 그녀의 어머니 Maria Thins에게 The Art of Painting을 넘겼고, 4월에는 고등 법원에 그녀의 빚을 탕감해 달라고 요청했습니다. 그 후 거의 2세기 동안 그의 이름은 거의 잊혀졌습니다. 이 지점에는 빵집 소년이 무급으로 빵을 건네주고 작은 책에만 표시를 하고 있고, 틀 만드는 사람이 있고, 시장 광장에서 이탄을 파는 여자가 있다.
        - 이 여행에는 몇 가지 유형의 사람들이 도움을 줄 수 있습니다. 기록 보관소를 보관하고, 골동품이나 복원된 그림을 다루는 사람, 그림을 그리고, 교정본을 읽고, 번역하고 주의 깊은 눈을 가진 사람, 또는 스튜디오에 있는 큰 그림을 보호하기 위해 강한 의지를 가지고 주의깊고 체계적인 사람; 장사를 해서 운이 좋은 사람, 또는 집에서 거리를 돌아다니며 손에 남은 그림을 팔고 있는 사람; 그림을 아는 사람, 예민하고 친절한 사람이 그에게 그의 그림이 어떻게 될 것인지 말해 줄 것입니다. 의지가 강한 의사, 약을 아는 사람, 진정패치를 들고 있는 사람, 나노 메디컬 키트를 들고 있는 사람, 12월 중순의 그날을 하루 반쯤 미뤄보자.
      outcomes:
        all: 그해 겨울 베르메르는 파멸하지 않았습니다. 1월의 어느 맑은 날, 그는 다시 그림을 그리기 위해 계단을 올라갔다. 큰 그림은 여전히 작업실 벽에 걸려 있었고, 부엌 찬장에는 천에 싸인 작은 돈뭉치가 놓여 있었습니다.
        p4: 그 해 12월이 지나갔지만 베르메르는 파멸하지 않았습니다. 1월의 맑은 날, 그는 다시 계단을 올라 이젤을 창가로 옮겼습니다.
        p2: 12월 15일 베르메르는 43세의 나이로 델프트에 묻혔습니다. 그 달에 팔린 그림에서 얻은 돈은 카타리나가 천에 싸서 부엌 찬장에 보관했습니다.
        p3: 12월 15일 베르메르는 43세의 나이로 델프트에 묻혔습니다. 작업실의 이젤은 비어 있었고, 팔레트는 한쪽에 놓여 있었고, 그 위의 산뜻한 파란색이 말랐습니다.
        p1: 12월 15일 베르메르는 43세의 나이로 11명의 자녀를 남기고 델프트에 묻혔습니다. 다음 2월 카타리나는 작업실에서 어머니에게 큰 그림을 전달했습니다.
      none: 12월 15일 베르메르는 델프트의 시어머니가 몇 년 전에 구입한 무덤에 43세의 나이로 묻혔습니다. 그 후 거의 2세기 동안 그의 이름을 아는 사람은 거의 없었습니다.
      desync: 12월 3일 채권자의 사람은 목록을 확인하고 고개를 끄덕인 다음 벽 옆에 있는 큰 그림의 못에서 떼어내도록 했습니다. {staff}가 리콜되었을 때 두 남자가 그것을 아래층으로 운반하고 있었고, 계단 모퉁이에서 파란색이 한 번 번쩍였습니다.
      not_admitted: '{staff}는 Oude Langendijk에 있는 집에 한 번도 들어가지 않았고, 단지 며칠 동안 시장 광장 가장자리에 서 있었습니다. 그 집의 덧문은 항상 반쯤 닫혀 있었고, 아이는 창틀에 기대어 지나가는 빵 바구니의 수를 세고 있었습니다.'
      points:
