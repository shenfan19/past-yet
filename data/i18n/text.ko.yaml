      p1: 돈이 멈춰도 잠들지 못하는 밤에도 세번이 일어설 수 있도록 키츠 옆에 끝까지 머물게 해주세요
      p2: 클라크 박사의 단식과 출혈을 중단시켜 그가 먹고 혈액을 유지할 수 있도록 해주세요.
