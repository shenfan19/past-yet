    relic: 피치블렌드를 담은 시험관
    relic_desc: 어둠 속에서 희미한 빛을 남기는 어두운 광석이 담긴 유리관입니다.
    points:
      p1: 연말 독서 전, 아직 독립 확인을 기다리고 있는 기록을 대조하고 2차 보고서를 보호하세요.
      p2: 두 개의 보고서를 사용하여 Curie의 정규 작업실을 확보하고 향후 측정을 위해 기기 및 기록을 보호하십시오.
      p3: 이제부터는 마리와 피에르와 샘플 사이에 차폐물을 씌우고 광선으로부터 손과 몸을 보호하세요.
    points_fail:
