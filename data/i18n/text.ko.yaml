        p2: 정오가 되자 세번은 뜨거운 수프 한 그릇과 빵 한 조각을 가져왔습니다. 키츠는 베개에 기대어 앉아 한 숟가락씩 비우고 그에게 빈 그릇을 돌려주었습니다.
        p1: 세번은 부츠를 신고 있는 채 옆방에서 옷을 입은 채 잠을 잤다. 아침에 일어나자마자 그는 먼저 문을 열고 침대를 바라보았다가 돌아와서 끝내지 못한 채 남겨둔 편지를 완성했습니다.
    relic: 눌러 말린 제비꽃
    relic_desc: 책 속에 보관되어 있는 말린 꽃입니다.
