      p2: 총은 텐트에서 발사되며 이 지점에서도 위원회는 상륙한 지 한 달 만에 세 명의 회원 중 한 명을 잃습니다.
      p3: 발열이 진행됩니다. 그녀는 5월 말이 되면 위험에서 벗어났지만, 역사상과 마찬가지로 이 부분에서도 질병은 그녀에게 남아 있습니다.
    shift:
      p1:
        was: 1855년 3월 6일 위생 위원회는 콘스탄티노플에 도착하여 그날 오후 스쿠타리에 있는 병원을 조사하기 시작했습니다.
      p2:
        was: 1855년 4월 21일, 위생국장 헥터 개빈(헥터 개빈)은 크리미아에서 형에게 건네주던 리볼버가 터지면서 사망했습니다.
        now: '{staff}는 두 사람 모두에게 일시 중지를 요청합니다. 개빈은 리볼버를 내려놓고 캠프 안전 책임자를 부릅니다. 그는 위원회의 작업을 계속하고 나중에 영국으로 돌아갑니다.'
      p3:
        was: 1855년 5월 나이팅게일은 발라클라바(Balaklava)에 있는 병원을 검사하러 갔는데 며칠 만에 크림열병에 걸렸습니다. 그녀는 약 12일 동안 위험할 정도로 아팠고, 말년의 대부분 동안 병약했습니다.
        now: '{staff}는 세기에 없는 약으로 초기 열을 치료합니다. 나이팅게일은 일주일 안에 일어서서 집에 따른 질병 없이 스쿠타리로 돌아갑니다.'
        who: nightingale_scutari
        bio: 이 지점에서 나이팅게일은 1855년 발라클라바에서 걸린 열병을 치료했습니다. 그녀는 병실에서가 아니라 직접 걸어서 병원과 군대 보건 업무를 수행했습니다.
    vignettes:
      totals: 가상의 사무원이 입학 총계에 편입 목록을 추가합니다. 새로 입학한 이름이 무엇인지 묻습니다. 반품을 보내기 전에 전송 내용을 자체 열에 남겨 둡니다.
      name: 점원은 방의 소음 때문에 이름을 들을 수 없습니다. 당신은 그것을 준 사람이 다시 말할 수 있을 때까지 그 사람 옆에서 기다립니다. 다음 사본에는 그들이 요청한 대로 철자가 적혀 있습니다.
      fold: 서기가 부르는 순서대로 와드 서류를 정리합니다. 총액 다음에 나타나던 시트가 이제 총액 앞에 도착합니다.
  scott_last_camp:
    name: 빙붕 위의 천막
    place: 로스 빙붕
    figure: 로버트 팰컨 스콧
    story: 스콧의 마지막 일기 항목은 1912년 3월 29일자로 작성되었습니다. 남아 있는 원고에는 일행이 남극에서 돌아오는 동안 마지막 캠프를 기록하고 있습니다. 신문을 반납한 후의 독서 장면을 상상해본다.
    story_prose:
      opening:
        - 로스 빙붕을 가로질러 바람이 불면 썰매 위에 빙하에서 나온 돌주머니가 올라옵니다. 스콧은 일기를 오프닝에서 더 멀리 옮깁니다. 내일 얼마나 멀리 갈지 장담할 수 있는 사람은 아무도 없습니다. 오츠는 부츠를 벗고 건조한 곳에 앉을 수 있는 곳이 어디인지 묻습니다.
        - 1912년 3월 스콧의 일행은 돌아오는 길에 문제에 봉착했습니다. 오츠는 텐트 밖으로 나갔고 돌아오지 않았습니다. 스콧과 다른 두 명은 One Ton Depot에서 약 11마일 떨어진 곳에 갇혀 있었습니다. 일기와 표본을 함께 보관하고 오츠와 스콧을 차례로 도와주고 나머지 일행을 창고로 데려가도록 노력할 수 있습니다.
        - 추위에 짐을 관리하고 다른 사람을 돌볼 수 있는 사람을 보내십시오. 간병인이 각 사람에게 필요한 것이 무엇인지 물어보고 마지막 구간에서 가장 느린 사람에게 충분한 시간을 허용하십시오.
      points:
        p1: 누군가 돌이 든 자루 하나를 빼자고 했다. 윌슨에게 표찰의 채집 장소를 읽어 달라고 하고 스콧에게는 일지가 어디 있는지 확인해 달라고 했다. 어둠 속에서 찾을 필요가 없는 물건은 아래로 넣었다. 돌과 일지는 각각 자리를 정해 두었다. 천막을 걷을 때도 썰매 옆면에는 빙하 이름이 남아 있었다.
        p2: 오츠는 부츠를 열려고 시도하고 거기에 보관합니다. 이번에는 빨리 갈 수 없다고 하더군요. 당신은 그에게 텐트에 앉아서 그를 보살피기 위해 남아 있는 사람과 내일의 행보에 대해 의논하라고 요청합니다. 다음 날 천막 입구가 열리자 그는 자기 장화가 다른 장화 옆에 놓인 뒤에야 일어섰다.
        p3: 스콧은 오른발이 더 이상 왼발처럼 체중을 지탱하지 않는다고 말합니다. 당신은 그를 돌볼 수 있는 사람에게 전화를 걸어 짐을 운반하는 사람들에게 잠시 동안 줄을 내려놓으라고 합니다. 처음에 그는 움직이라는 말을 하기 전에 확고하게 발을 디뎠습니다. 첫 구간을 지난 뒤, 그는 걸음을 멈추고 얼마나 왔는지 일기에 적을 수 있었다.
        p4: 드리프트가 텐트를 압박합니다. 11마일 남았습니다. 모든 사람이 준비가 되었다고 말할 때까지 기다렸다가 창고를 아는 사람과 함께 교대로 방향을 찾습니다. 깃발 앞에서는 누군가가 안에 무엇이 있는지 보기 전에 마지막 사람을 기다립니다. 보급소 물자 곁에서 새 쪽을 펼쳤다. 연필은 여전히 종이 위를 움직였다.
      outcomes:
        all: 일행과 함께 일기와 돌이 창고에 도착합니다. 오츠와 스콧은 다른 사람들과 함께 이 기간을 통과하고 새로운 날이 일기에 들어갑니다.
        p1: 기록과 표본은 마지막 날까지 보관됩니다. 일행이 짐을 줄여야 할 때 그들은 썰매에 남아 있습니다.
        p2: 오츠는 파티에 남아 있습니다. 다음 정류장에서 그는 다른 사람들과 함께 안에서 쉴 수 있습니다.
        p3: 스콧은 발을 단단히 디딜 수 있습니다. 나머지 팀에게 무슨 일이 일어날지는 여전히 마지막 단계에 달려 있습니다.
        p4: 마지막 구간을 통과한 사람들이 창고에 도착합니다. 보고서에는 나머지 여행에 따라 도착이 기록됩니다.
      none: 연료와 힘이 소모됩니다. 바람이 텐트를 제자리에 고정시키고 3월 말에 기록이 중단됩니다.
      not_admitted: 파티는 새로 온 사람을 위한 자리를 마련하지 않았습니다. 당신은 연료와 암석이 아직 충전된 상태로 밖에 머물러 있습니다.
      desync: 일기나 표본은 역사 기록이 끝나기도 전에 남겨진다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 천막을 걷을 때도 썰매 옆면에는 빙하 이름이 남아 있었다.
        p2: 다음 날 천막 입구가 열리자 그는 자기 장화가 다른 장화 옆에 놓인 뒤에야 일어섰다.
        p3: 첫 구간을 지난 뒤, 그는 걸음을 멈추고 얼마나 왔는지 일기에 적을 수 있었다.
        p4: 보급소 물자 곁에서 새 쪽을 펼쳤다. 연필은 여전히 종이 위를 움직였다.
    relic: 일기
    relic_desc: 추위로 뻣뻣해진 작은 연필 일기장.
    points:
      p1: 연료가 부족하고 힘이 약해지는 행진에서 일기장과 비어드모어 빙하의 암석 표본을 썰매에 보관하세요.
      p2: 오츠의 동상에 걸린 발을 치료하여 그가 파티를 계속할 수 있도록 하고 3월 16일경에 텐트 밖으로 나가지 않도록 하십시오.
      p3: 3월 18일 이전에 파티 전체를 둔화시키는 동상으로부터 스콧의 오른발을 구해주세요.
      p4: 세 사람을 3월 21일에 시작되는 눈보라를 통과하여 마지막 11마일을 가로질러 One Ton Depot으로 데려가세요.
    points_fail:
      p1: 표본은 빙붕에 방치되고 일기는 마지막 날까지 닿지 않는다. 이 지점은 역사와 어긋나고 사무실에서는 직원을 소환합니다.
      p2: 그의 발은 매일 더 나빠졌고, 이 지점에서도 그는 3월 16일쯤에 표류 속으로 나갔고 돌아오지 않았습니다.
      p3: 발이 얼고 이 분기에서는 역사에서와 마찬가지로 행진이 기어가는 속도로 느려집니다.
      p4: 눈보라가 텐트를 그 자리에 붙잡아 놓았고, 3월 29일 이후에는 일기장에 새 페이지가 없습니다.
    shift:
      p1:
        was: 1912년 3월, 돌아오는 길에 연료가 부족하여 일행은 비어드모어 빙하에서 발견한 일기와 글로소프테리스 화석을 썰매에 보관했습니다. 수색대는 11월 12일 텐트에서 그들을 발견했다.
      p2:
        was: 1912년 3월 초 오츠의 발은 심하게 동상에 걸렸고 속도가 느려졌습니다. 3월 16일이나 17일에 그는 텐트 밖으로 나갔고 다시는 보이지 않았습니다.
        now: '{staff}는 발을 따뜻하게 하고 매일 밤 양말을 갈아 입는데도 동상이 심해지지 않습니다. 오츠는 썰매 옆에서 속도를 유지하며 마지막 캠프에서도 여전히 일행과 함께 있습니다.'
      p3:
        was: 1912년 3월 18일 스콧은 오른발 발가락이 거의 모두 사라졌고 행진 속도가 더욱 느려졌다고 썼습니다.
        now: '{staff}는 모든 캠프에서 오른발을 따뜻하게 감싸줍니다. 스콧은 발을 유지하고 파티는 예전 속도로 북쪽으로 나아갑니다.'
      p4:
        was: 1912년 3월 21일부터 눈보라가 스콧, 윌슨, 바워스를 텐트에 가두어 One Ton Depot에서 11마일 떨어진 곳에 있게 되었습니다. 마지막 일기 항목의 날짜는 3월 29일이며 수색대는 11월 12일에 텐트를 발견했습니다.
        now: '{staff}는 바람이 잔잔한 가운데 세 사람을 북쪽으로 이끌고 마지막 11마일을 짧은 단계로 나눕니다. 그들은 One Ton Depot에서 연료와 음식을 찾아 눈보라보다 오래갑니다. 겨울이 오기 전에 그들은 케이프 에반스(Cape 에번스)로 돌아왔습니다.'
        who: scott_last_camp
        bio: 이 타임라인에서 스콧은 윌슨 및 바워스와 함께 극지에서 살아 돌아와 Cape 에번스에 도달했습니다. 그는 영국으로 돌아와 탐험의 일기와 과학적 결과를 직접 편집했습니다.
    vignettes:
      distance: 기관으로 돌아온 가상의 사무원은 이동 거리에 따라 제목이 표시된 열에 거리를 복사합니다. 아직 갈 길이 멀다는 것을 보여주세요. 사본을 제출하기 전에 항목을 이동합니다.
      blank: 기관으로 돌아온 직원은 마지막 날짜에 멈춥니다. 그들이 그 너머의 공백을 표시하는 방법을 결정하는 동안 기다립니다. 기록은 여기서 끝난다고 적고 연필을 내려놓는다.
      opening: 에이전시로 돌아가서 연습용 사본을 열고 이야기 전 날짜를 읽습니다. 점원은 페이지를 다시 순서대로 찾을 수 있도록 표지에 동일한 날짜를 표시합니다.
  seacole_balaklava:
    name: 스스로 길을 찾아 세운 여관
    place: 발라클라바
    figure: 메리 시콜
    story: 메리 시콜의 1857년 회고록은 그녀가 Balaklava 근처에서 Thomas Day와 함께 운영했던 영국 호텔, 그곳에서 판매한 상품 및 1855년에 그곳에 온 사람들을 설명합니다.
    story_prose:
      opening:
        - Balaklava 도로 옆에 있는 호텔이 방금 카운터를 열었습니다. 메리 시콜(메리 시콜)은 임시 병원용 가방을 문 쪽으로 밀고 있습니다. 토마스 데이(Thomas Day)는 무엇이 판매용으로 준비되었는지 묻습니다. 그녀는 부상자들을 먼저 살펴보고 계좌로 돌아올 것이라고 말했습니다.
        - 1855년 6월 18일 시콜은 임시 병원 근처에서 부상자들을 돕고 엄지손가락에 부상을 입힌 기록을 남겼습니다. 그녀가 데이와 함께 운영했던 호텔도 도난을 당했다. 평화 이후 두 사람은 1856년에 파산했습니다. 병원에서 일을 보존하고 부상, 말 및 주식을 별도로 도울 수 있습니다.
        - 돌봄 경험이 있는 사람을 보내십시오. 호텔을 아는 여행자는 마구간을 볼 수 있습니다. 나중에 추가 재고 주문 여부를 결정하기 전에 두 파트너 모두와 장부를 확인할 수 있는 사람을 활용하십시오.
      points:
        p1: 길에서 누군가가 임시 병원으로 무엇이든 보낼 수 있는지 묻습니다. 당신은 문 옆에 있는 가방과 약간의 물을 건넨 다음, 침대 옆에서 기다리고 있는 시콜에게 확인합니다. 그녀가 병원에 도착했을 때, 요청한 사람은 그녀가 가방을 내려놓을 수 있는 장소를 찾았습니다. 그녀는 그것을 열고 가장 가까이 있는 환자에게 무엇이 필요한지 물었다.
        p2: 시콜은 오른손을 받치고 엄지손가락을 움직일 때 아프다고 말합니다. 당신은 그녀를 돌볼 훈련을 받은 사람에게 전화를 걸어 그녀가 어디에 앉기를 원하는지 물어봅니다. 다른 사람이 그녀가 들고 있던 가방을 가져갑니다. 잠시 쉰 뒤 그녀는 손을 들어 통증이 덜하다고 했다. 그러고는 환자 이름을 적을 쪽지를 부탁했다.
        p3: 뒷문에서 소음이 들립니다. 점원은 일어나서 마구간을 지켜보는 사람이 아무도 없음을 발견합니다. 한 사람은 시콜에게 전화를 걸고 다른 사람은 마당이 보이는 곳에서 말의 수를 세도록 합니다. 밖에 있는 사람은 마당의 대답을 듣고 떠나갑니다. 새벽에도 수레를 끌 말들은 아직 물통 곁에 있었다.
        p4: 하루가 새로운 질서를 갖게 될 것입니다. 시콜은 그에게 선반에 있는 물건의 수를 큰 소리로 세어 달라고 부탁합니다. 한 장에 주문, 재고, 미결제 부채를 기재한 다음 군대가 떠나기 전에 무엇을 팔 수 있는지 물어보세요. 파트너가 한번 확인하고 다음 배송을 취소합니다. 시콜이 장부를 덮었을 때, 계산대 뒤에는 마지막 인수분을 위한 빈 선반이 남아 있었다.
      outcomes:
        all: 시콜은 임시 병원에 도착했지만 나중에 손을 사용할 수 있습니다. 마구간은 가득 차 있으며 호텔이 문을 닫을 때 파트너가 장부를 정산합니다.
        p1: 그녀는 예정대로 임시병원에서 사람들을 돌보고 그날 저녁 호텔로 돌아간다.
        p2: 누군가는 자신의 엄지손가락을 살펴보고, 다시 메모를 할 때 펜을 사용하는 것이 더 쉽습니다.
        p3: 그날 밤 말들은 마구간에 남아 있었습니다. 아침에 카트를 가지고 있는 사람들은 카트를 어디서 찾을 수 있는지 알고 있습니다.
        p4: 시콜과 Day가 계정을 정산합니다. 마지막 배송으로 인해 군대가 집으로 돌아갈 때 팔리지 않은 재고가 남지 않습니다.
      none: 아무도 재고 계산을 마치지 않았고 길가의 사람들은 여전히 누군가가 참석하기를 기다리고 있습니다.
      not_admitted: 점원은 방문객에게 문을 막지 말라고 요청합니다. 병원 가방은 가져갈 목록에 없습니다.
      desync: 시콜은 역사상 길을 통해 도왔던 곳에 도달하지 못합니다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 그녀는 그것을 열고 가장 가까이 있는 환자에게 무엇이 필요한지 물었다.
        p2: 잠시 쉰 뒤 그녀는 손을 들어 통증이 덜하다고 했다. 그러고는 환자 이름을 적을 쪽지를 부탁했다.
        p3: 새벽에도 수레를 끌 말들은 아직 물통 곁에 있었다.
        p4: 시콜이 장부를 덮었을 때, 계산대 뒤에는 마지막 인수분을 위한 빈 선반이 남아 있었다.
    relic: 약 상자
