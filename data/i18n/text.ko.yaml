  galois_paris:
    name: 결투 전날 밤
    place: 파리
    figure: 에바리스트 갈루아
    story: 에바리스트 갈루아는 1832년 4월 29일 파리의 감옥에서 나왔습니다. 5월 29일 밤에 그는 친구 Auguste Chevalier에게 편지를 보내 어떤 방정식이 급진파에 의해 풀릴 수 있는지에 대해 설명하고 그 편지를 인쇄해 달라고 요청했습니다. 다음날 아침 그는 결투 중 복부에 총을 맞고 쓰러진 곳으로 떠났습니다. 그는 5월 31일 20세의 나이로 코친 병원에서 사망했습니다. 슈발리에는 그해 9월에 편지를 인쇄했습니다. 14년 후 Joseph Liouville은 그의 논문을 출판했습니다.
    story_prose:
      opening:
        - 1832년 5월 파리. 스무 살의 에바리스트 갈루아(Evariste Galois)는 한 달 전에 감옥에서 나왔습니다. 10대 때 그는 급진파에 의해 방정식이 풀릴 수 있는 조건과 그룹 이론이 성장한 아이디어를 발견했지만 당시에는 누구도 이를 따라갈 수 없었습니다.
        - 역사상 그는 5월 29일 밤 친구인 오귀스트 슈발리에(Auguste Chevalier)에게 편지를 써서 자신이 발견한 내용을 설명하고 그 편지를 인쇄해 달라고 요청했습니다. 다음날 아침 그는 결투 중 복부에 총을 맞고 쓰러진 곳으로 떠났고 5월 31일 코친 병원에서 사망했습니다. 그 편지는 그해 9월에 인쇄되었고, 그의 논문은 리우빌이 출판하기까지 14년을 기다려야 했습니다. 이 지점에서는 그가 묵는 컨시어지가 그에게 잉크를 빌려주고, 카터는 10년 동안 코친 병원 문까지 장작을 가져왔고, 인쇄소의 합성가는 등호가 부족하다고 불평한다.
        - 몇 가지 유형의 사람들이 이 여행에 도움을 줄 수 있습니다. 기록 보관소를 보관하고, 교정본을 번역하거나 읽은 사람, 또는 편지와 서류를 함께 보관하기 위해 밤새도록 깨어 있을 수 있는 체계적인 사람; 약을 알고 있고 이른 아침에 그곳에 갈 수 있도록 올바른 키트나 약을 가져온 사람; 아카이브를 보관했거나 번역한 적이 있고 나중에 독자들이 다음에 나올 내용을 찾을 수 있도록 편집자와 대화를 나눌 수 있는 사람.
      outcomes:
        all: 갈루아는 살았습니다. 그해 9월 편지는 색인 페이지와 함께 인쇄되었고, 사람들은 페이지 번호로 논문을 요청하러 왔습니다. 슈발리에는 그들의 질문을 목록에 복사했고 갈루아는 테이블에 앉아 하나씩 대답했습니다.
        p3: 갈루아는 6월에 일어나기도 전에 병원에 누워 있었습니다. 그해 여름, 그는 다시 테이블에 앉았고, 편지 초안이 그의 앞에 펼쳐져 있었고 여백에는 줄이 그대로 남아 있었습니다.
        p2: 9월부터 편지를 읽는 사람은 누구나 색인으로 사본을 요청할 수 있었고 질문은 페이지 번호와 함께 슈발리에에게 다시 전달되었습니다. 1846년에 리우빌은 그의 논문을 출판했습니다.
        p1: 그해 9월 슈발리에는 5월 29일자 Revue 백과사전의 편지를 인쇄했습니다. 14년 후 Liouville은 그의 논문을 출판했습니다.
      none: 6월 2일 갈루아는 몽파르나스의 공동묘지에 묻혔다. 관리인은 빌린 잉크병을 되찾고 그녀의 장부에 한 줄을 그었다.
      desync: 5월 29일 늦은 밤, 편지와 거기에 언급된 서류가 탁자 양쪽 끝에 놓여 있었는데, 아무도 그것을 포장하지 않았습니다. {staff}가 회수되었을 때 양초는 다 타버렸고 양초의 왁스는 페이지 가장자리를 넘어갔습니다.
      not_admitted: '{staff}는 건물 안으로 들어가지도 않았고 며칠 밤 동안 길 모퉁이에 서 있을 뿐이었습니다. 위층 창문 하나는 거의 새벽까지 불이 켜져 있었는데, 일단 창문이 열리자 구겨진 시트가 자갈 위로 떨어졌습니다.'
      points:
        p1:
