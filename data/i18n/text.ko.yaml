  hargrave_stanwell_park:
    name: 네 번째 연
    place: 스탠웰 파크, 호주
    figure: 로런스 하그레이브
    story: 로런스 하그레이브(로런스 하그레이브)는 1893년에 상자 연 실험을 시작했습니다. 1894년 11월 12일 스탠웰 공원(Stanwell Park) 해변에서 그의 연결된 상자 연 4개가 그를 약 16피트 높이의 모래 위로 들어 올렸습니다. 뉴사우스웨일스 주립 도서관이 보유한 사진에는 하그레이브, 제임스 스웨인 및 재판 장비가 나와 있습니다. 그는 1915년 7월 6일 시드니에서 사망했다.
    story_prose:
      opening:
        - 스탠웰 파크, 1894년 11월. 로런스 하그레이브(로런스 하그레이브)는 1년 넘게 상자 연을 시험해 왔습니다. 12일에는 네 마리가 해변에 누워 한 줄로 비행할 준비를 했습니다.
        - 역사상 네 개의 연은 그를 거의 16피트 들어올렸습니다. 그가 나중에 뮌헨으로 보낸 대부분의 모델은 전쟁 중에 파괴되었습니다. 이 가지에서는 해변의 도우미들이 그림을 펼칠 프레임과 공간에 대한 태그를 가지고 있습니다.
        - 이번 여행에는 바람을 읽고 긴 줄을 안정시킬 수 있는 사람, 치수를 확인하고 네 개의 프레임이 어떻게 결합되는지 그릴 수 있는 사람이 필요합니다.
      points:
        p1: 돌풍이 바깥쪽 연을 옆으로 잡아당깁니다. {staff}는 선을 지켜보고 연이 다시 당겨질 때까지 도우미와 함께 가로질러 이동한 다음 좌석이 내려올 때 로프를 안정시키는 데 도움을 줍니다. 다리가 모래에 닿아 두 개의 지문이 서로 가깝게 남습니다. 해변의 사람들은 첫 번째 연이 가라앉을 때까지 계속 붙잡고 있습니다.
        p2: '{staff}는 프레임과 비교하여 측정값과 태그를 확인하고 복사본을 만들어 로컬에 보관하며 4개 모두가 어떻게 만들어지고 결합되는지 보여줍니다. 바람이 그림을 마지막 시트로 바꿉니다. Hargrave는 매듭으로 모서리를 고정하기 위해 코드 조각을 그 위에 놓습니다.'
      outcomes:
        all: 높이는 기록에 남았고 일련의 그림은 호주에 남아있었습니다. 몇 년 후 누군가가 더미를 열었고 여전히 네 개의 연 사이의 선을 따라갈 수 있었습니다.
        p2: 몇 년이 지난 후에도 스탠웰 파크(Stanwell Park)는 여전히 참고할 사본을 갖고 있었습니다. 마지막 시트에는 여전히 선이 묶인 위치가 표시되어 있습니다.
        p1: 키가 기록에 남았습니다. 사진에는 여전히 해변에 줄 네 마리의 연이 늘어서 있는 모습이 담겨 있었습니다.
      none: 바다에서 바람이 계속 불어오고 있었습니다. 모래 언덕의 코일에서 고리가 하나씩 느슨해졌습니다.
      not_admitted: '{staff}는 해변에서 도우미들이 있는 곳을 찾지 못했습니다. 누군가 멀리서 줄을 팽팽하게 잡아당겼지만 그들의 목소리는 모래 언덕까지 전달되지 않았습니다.'
      desync: 좌석이 내려앉았고 로프가 느슨해졌습니다. {staff}가 리콜되었을 때 태그가 여전히 프레임에 부딪혀 덜거덕거렸습니다.
      excerpts:
        p2: 바람이 그림을 마지막 시트로 바꿉니다. Hargrave는 매듭으로 모서리를 고정하기 위해 코드 조각을 그 위에 놓습니다.
        p1: 다리가 모래에 닿아 두 개의 지문이 서로 가깝게 남습니다. 해변의 사람들은 첫 번째 연이 가라앉을 때까지 계속 붙잡고 있습니다.
    relic: 상자연의 예비 표찰
    relic_desc: 상자연의 골조에 붙이는 예비 표찰.
    points:
      p1: 11월 12일, 돌풍 속에서도 연줄을 안정적으로 유지하여 연이 모래 위에서 안전하게 오르내릴 수 있도록 하세요.
      p2: 그가 네 개의 연, 크기 및 제작 방법에 대한 전체 그림을 완성하도록 도와주고 사본 한 장을 호주에 남겨주세요.
