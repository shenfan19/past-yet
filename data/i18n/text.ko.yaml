        p3: 어느 날 밤, 창문은 서리꽃으로 뒤덮였고, 방에 있는 난로는 결코 꺼지지 않았습니다. 새벽녘에 그는 기침을 한 후 다시 잠이 들었습니다.
        p2: 잉크는 희미하고 여백에 압착되었으며 황혼까지 건조되지 않았습니다. 두 권의 사본 중 한 권은 짧은 논문과 함께 들어갔고 다른 한 권은 그의 원고 폴더에 남아 있었습니다.
