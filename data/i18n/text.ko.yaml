  basho_hiraizumi:
    name: 오쿠로 가는 좁은 길
    place: 일본 히라이즈미
    figure: 마쓰오 바쇼
    story: 1689년 봄, 마쓰오 바쇼는 제자 소라와 함께 에도에서 북쪽으로 긴 산책을 떠났습니다. 5월 13일에 그들은 이치노세키에서 히라이즈미까지 갔다가 하루 만에 기타카미 강 위의 다카다치에 올랐고, 관리인은 그들에게 주손지의 금당을 보여 주었고, 경전은 그가 자리를 비웠기 때문에 닫혀 있었습니다. Bashō는 여행을 『오쿠노 호소미치』로 바꾸었고, 그곳에서 방문은 여름 풀에 대한 그의 구절을 제공하고 두 홀이 모두 열렸다고 말합니다.
    story_prose:
      opening:
        - 1689년 여름, 일본 북부의 이치노세키. 마쓰오 바쇼와 그의 제자 소라는 한 달여 전에 에도를 떠났습니다. 5월 13일 하늘이 맑아 두 사람은 옛 유적을 보기 위해 히라이즈미까지 2리를 걷고 당일 다시 돌아오겠다는 뜻이다. 그 여정은 나중에 『오쿠노 호소미치』가 되었습니다.
        - 역사상, 그날 수호자가 그들에게 황금 홀을 보여 주었고 경전은 그가 자리를 비웠기 때문에 닫혀 있었습니다. 소라는 그것을 그대로 일기장에 적었습니다. Bashō는 나중에 그의 책에서 두 홀이 모두 열렸다고 썼습니다. 이 지점에서는 이치노세키에 있는 숙소의 주인이 손님의 귀환을 위해 목욕물을 데우고, 길모퉁이의 짐꾼이 북쪽으로 가는 길은 모두 진흙이라고 말합니다.
        - 이 여행에는 두 종류의 사람들이 도움을 줄 수 있습니다. 길을 기억하고 시간을 지키는 사람과 허용되는 것이 무엇인지 기꺼이 물어보고 길을 보여줄 사람을 찾는 사람입니다.
      outcomes:
        all: 그날 저녁 바쇼는 이치노세키의 숙소 문 옆에 모자를 걸어 먼지를 쌓았습니다. 나중에 그가 히라이즈미 구절을 쓸 때 그 안에는 격자 틈을 통해 자신의 눈으로 본 들보가 있었습니다.
        p2: 나중에 바쇼가 히라이즈미 구절을 썼을 때 그 안에는 격자 틈을 통해 자신의 눈으로 본 들보가 있었습니다.
        p1: 어두워지기 전에 두 사람은 이치노세키로 돌아왔습니다. 모자는 먼지가 잔뜩 쌓여 문 옆에 걸려 있었다.
      none: 황혼 속에서 히라이즈미의 옛 유적이 조금씩 어두워졌습니다. 경전의 문은 닫혀 있었습니다.
      desync: 갈림길을 지나면 이미 해는 저물었고, 두 사람은 히라이즈미에서 아직 멀었다. {staff}는 이치노세키로 돌아가기 전에 사무실에서 회수되었습니다.
      not_admitted: '{staff}는 두 명의 여행자를 따라잡을 수 없었습니다. 이치노세키의 길모퉁이에는 이미 밀짚모자 두 개가 마을 밖으로 나간 뒤였습니다.'
      points:
        p1: 이치노세키에서 길은 두 번 갈라졌습니다. {staff}는 각 정류장을 소라가 노트에 적어 놓은 단계와 비교하여 확인하고, 두 사람에게 미리 어디로 가야 할지, 몇 시까지 다시 출발해야 하는지 알려 주었습니다. 바쇼는 고개를 끄덕이고 모자 끈을 더욱 단단히 묶었습니다. 해가 저물었을 때 두 사람은 이미 이치노세키로 돌아가는 길에 있었다.
        p2:
          class_lettered: 기록을 검색할 때와 마찬가지로 {staff}는 먼저 관리인이 어느 날 떠났는지, 누가 자신을 위해 물건을 관리하는지 물었고, 그런 다음 방문객이 외부 갤러리의 어느 부분을 걸을 수 있는지 물었습니다. 근처에 있던 한 노인이 작품을 내려놓고 두 사람을 회랑을 따라 경당 옆으로 안내했습니다. 문은 여전히 닫혀 있었지만, 격자 틈새로 안의 들보가 보였다. 바쇼는 한동안 말 없이 서 있었고, 소라는 고개를 숙이고 노트에 한 줄을 적었다.
