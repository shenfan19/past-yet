        p3: 카프카는 아주 작은 입으로 삼키다가 한 입씩 멈춥니다. 절반도 안 남았을 때 그는 그릇 가장자리에 숟가락을 놓고 연필을 집어 전표 뒷면에 한 줄을 더 썼습니다.
        p2: 오후에는 {staff}가 방에 앉을 차례입니다. 도라는 밖으로 나가 울타리를 따라 정원을 한 바퀴 돌다가 라일락 아래 잠시 서 있다.
