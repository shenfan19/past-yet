    points_fail:
      p1: 리허설은 그녀가 따로 떼어 놓은 시간을 사용하고 노래는 초안에서 멈 춥니 다. 지점의 동기화가 중단되고 사무실에서 해당 직원을 소환합니다.
      p2: 플레이어는 변경 사항을 별도의 페이지에 유지합니다. 그녀의 가족은 그녀가 어떤 것을 승인했는지 물어봐야 할 것입니다.
      p3: 사람들은 도움을 구하기 위해 다양한 방향으로 이동합니다. 그녀의 가족이 그녀를 만나기 위해 기다리는 동안 방은 여전히 붐비고 있습니다.
    shift:
      p1:
        was: 1847년 4월 말에 Hensel은 트리오 이후 작곡이 중단되었다고 썼습니다. 5월에 그녀는 죽기 직전에 마지막 노래를 마쳤습니다.
      p2:
        was: 헨젤은 1847년 5월 14일에 사망했습니다. 피아노 트리오는 1850년에 처음 출판되었습니다.
        now: 이 분기에서 {staff}는 Hensel이 플레이어와 가족이 참조할 수 있는 트리오의 작업 복사본을 표시하는 데 도움이 됩니다. 별도의 출판물은 나중에 나옵니다.
      p3:
        was: 헨젤은 1847년 5월 14일 리허설 도중 병에 걸려 같은 날 사망했습니다.
        now: 이 브랜치에서 {staff}는 도움 요청을 받고 가수들에게 점수를 마감하도록 요청합니다. 헨젤 옆에는 그녀의 가족이 함께 지낼 수 있는 방이 있습니다.
    vignettes:
      cover: 한 가수가 중앙에 있는 악보를 펼치며 이것이 누구의 음악인지 묻습니다. 느슨한 제목 시트를 가져와서 악보 옆에 놓습니다. 표지에 적힌 이니셜만으로 표지에 무엇을 쓸지 정할 수 있습니다. 서류를 정리하는 동안 첫 번째 노래를 놓쳤습니다.
      forward: 수집가가 앞으로 이러한 노래를 어떻게 검색할지 가수에게 말하기 시작합니다. 그녀는 헐거워진 덮개를 가리키며 아직도 가지고 있는지 묻습니다. 당신은 다음 사본과 함께 표지를 내달라고 요청했습니다. 한 명의 독자와 함께합니다. 더 이상 따라갈 수 없습니다.
      order: 내용을 정리하고 6곡을 순서대로 배열합니다. 가수는 자신이 원하는 사람에게 바로 다가갈 수 있습니다. 당신은 자신의 전표에 순서를 유지합니다. 집에 가져갈 수 없는 것은 문을 닫은 후 방에서 나는 소리입니다.
  camille_claudel_paris:
    name: 같은 회전, 두 가지 모습
    place: 파리
    figure: 카미유 클로델
    story: 카미유 끌로델 미술관(Musée 카미유 클로델)은 1905년 청동 주형을 포함하여 왈츠의 여러 버전을 목록화하고 있습니다. 1913년 클로델의 아버지는 빌뇌브쉬르페르(Villeneuve-sur-Fère)에서 사망했고 그녀는 장례식 전에 그의 죽음에 대해 알지 못했습니다. 3월 10일에 그녀는 Ville-Évrard에 입학했습니다.
    story_prose:
      opening:
        - 1913년 3월, 파리. 카미유 클로델은 <왈츠>를 여러 버전으로 만들었습니다. 그녀의 작업실에서 그녀는 거의 똑같아 보이는 다른 작품들 중에서 자신이 원하는 작품을 고를 수 있습니다.
        - 역사상 그녀는 장례식 시간에 맞춰 아버지의 죽음을 듣지 못했습니다. 3월 10일 그녀는 병원에 입원했다. 이 지점에서는 확인할 수 있는 편지가 파리에 도착했고, 누군가에게 스튜디오에 대한 지시를 내릴 시간이 있었습니다.
        - 어려운 소식에 시간을 할애할 수 있는 사람이 도움을 줄 수 있습니다. 스튜디오에 관해서는 클로델이 어디로, 누구와 함께 가는지 말할 때까지 기다려야 합니다.
      points:
        p2: '{staff}는 빈 시트를 가져와 클로델이 지적한 내용을 별도로 나열합니다. 누군가 비슷한 두 가지를 한 줄에 넣고 싶어합니다. 그녀는 종이 위에 손을 얹고 두 칸을 달라고 요청합니다. 하단에 수신자의 이름을 추가합니다. 종이를 접기 전에 그녀는 종이를 찾으러 온 사람에게 마지막 줄을 가리킨다.'
        p1: '{staff}는 편지를 가져온 사람과 날짜를 확인한 후 스튜디오로 향한다. 클로델은 그것을 한 번 읽고 조금 기다렸다가 그녀를 그곳으로 데려갈 첫 번째 기차가 무엇인지 묻습니다. 그녀는 편지를 코트에 넣기 전에 앞치마에 손을 두 번 닦습니다.'
      outcomes:
        all: 떠나기 전에 클로델은 자신이 선택한 사람에게 목록을 전달합니다. 그가 그것을 찾으러 오면 그는 그녀가 아직 명확하게 밝히지 않은 두 이름을 다시 읽습니다.
        p2: 그녀가 선택한 사람이 목록을 가져갑니다. 스튜디오로 돌아온 그는 한 번에 한 줄씩 사물을 찾습니다.
        p1: 빌뇌브로 가는 길에 그녀는 다시 한 번 편지를 꺼낸다. 그녀는 곧바로 날짜를 찾아 다시 읽습니다.
      none: 물체는 제자리에 남아 있습니다. 누군가 테이블 모서리에 시트를 납작하게 펴 놓았습니다. 이름이 적혀 있지 않습니다.
      not_admitted: '{staff}는 절대로 들어오지 않습니다. 자물쇠가 반대편에서 한 번 움직이고 발소리가 멀어집니다.'
      excerpts:
        p2: 하단에 수신자의 이름을 추가합니다. 종이를 접기 전에 그녀는 종이를 찾으러 온 사람에게 마지막 줄을 가리킨다.
        p1: 클로델은 그것을 한 번 읽고 조금 기다렸다가 그녀를 그곳으로 데려갈 첫 번째 기차가 무엇인지 묻습니다. 그녀는 편지를 코트에 넣기 전에 앞치마에 손을 두 번 닦습니다.
    relic: 청동 손
    relic_desc: 손에 대한 작은 청동 연구입니다.
    points:
      p1: 클로델에게 아버지의 죽음에 대한 믿을 만한 소식을 제때 가져오면 클로델이 장례식에 참석할지 여부를 결정할 수 있습니다.
      p2: 클로델이 작업실을 떠나기 전에 아는 사람에게 무엇을 맡기고 싶은지 물어보고 선택 사항을 적도록 도와주세요.
    points_fail:
      p1: 소식은 장례식이 끝난 후 파리에 전해졌습니다. 클로델은 이미 갈지 결정할 기회를 잃었습니다.
      p2: 제거에 대한 기록이 남겠지만, 스튜디오에 있는 물건들은 누가 보관해야 하는지에 대한 클로델의 메모가 아직 없습니다.
    shift:
      p1:
        was: 1913년 3월 3일 그녀의 아버지 루이 프로스페 클로델(Louis-Prosper Claudel)이 빌뇌브(Villeneuve)에서 사망했습니다. 가족들은 카밀에게 말하지 않았고 그녀도 장례식에 참석하지 않았습니다.
        now: 이 지점에서 Claudel은 제때에 소식을 듣고 아버지의 장례식에 참석하기 위해 Villeneuve-sur-Fère로 여행하기로 결정합니다.
      p2:
        was: 1913년 3월 10일, 카미유는 가족의 요청에 따라 빌에브라르(Ville-Évrard) 정신병원에 수용되었습니다. 1914년 몽데베르그로 이주한 그녀는 결코 떠나지 않았고 1943년 10월 19일 그곳에서 사망했습니다.
        now: 이 분기에서는 {staff}가 Claudel이 원하는 몇 가지 스튜디오 개체를 기록합니다. 그녀가 선택한 사람은 목록을 가져가서 그녀가 떠날 때 따라갑니다.
    shift_all: 클로델은 아버지의 장례식에 참석하기로 결정하고 작업실에서 물건을 관리할 사람을 선택할 수도 있습니다.
    vignettes:
      light: 나중에 박물관 전시를 보셨지만 이제서야 스커트 주위를 걸으면서 그림자가 변하는 것을 볼 수 있습니다. 포장업자는 두 카드 모두에 동일한 설명을 쓰려고 합니다. 여백에 두 개의 곡선을 그립니다. 상자는 별도로 발송되며, 포장이 풀린 상자도 표시되지 않습니다.
      mark: 포장업자는 동일한 제목을 가진 두 개의 라벨을 찾습니다. 뚜껑이 이어지기 전에 커튼이 끝나는 곳에 각각 하나의 디테일을 추가합니다. 두 메모를 모두 자신의 손에 보관하십시오. 당신이 읽은 대리석 위원회는 결코 도착하지 않습니다.
      crate: 패커가 뚜껑에 손을 뻗는 동안 포장 시트를 튀어나온 가장자리에 닿지 않게 유지합니다. 메모리에서 여분의 용지에 곡선을 추적합니다. 뚜껑이 내려오면 더 이상 마지막 인치를 확인할 수 없습니다.
  emily_bronte_haworth:
    name: 겨울의 목사관
    place: 하워스
    figure: 에밀리 브론테
    story: Wuthering Heights는 1847년 Ellis Bell이라는 이름으로 등장했습니다. 소설은 이야기의 대부분을 Lockwood에 대한 Nelly Dean의 설명으로 구성합니다.
    story_prose:
      opening:
        - Haworth, 1848. Wuthering Heights는 Ellis Bell이라는 이름으로 인쇄되었습니다. 목사관에는 Emily가 처음부터 살펴볼 수 있는 초판이 아직 남아 있습니다.
        - 역사상 샬럿과 앤은 필명 구별을 위해 7월 런던으로 갔고, 에밀리는 12월 집에서 사망했다. 이 지점에서는 누군가 런던 이전에 서류 수집을 돕고 Emily가 집에서 원하는 것을 말할 때까지 기다릴 수 있습니다.
        - 손글씨와 철자를 구별할 수 있는 사람, 그리고 Emily가 아플 때 말이 끝날 때까지 기다릴 수 있는 사람이 필요합니다.
      points:
        p4: '{staff}는 Emily에게 어디에 앉고 싶은지, 근처에 누구를 원하는지 묻습니다. 그녀는 벽 옆에 있는 의자를 선택하고 책을 달라고 합니다. {staff}는 따뜻한 담요를 그녀가 닿을 수 있는 곳에 놓아두었습니다. 누군가 다른 의자를 빼앗기 시작합니다. 에밀리는 손을 들고 그것이 있던 곳을 가리킵니다.'
        p3: 문자가 말하는 내용과 프린터가 잘못하는 내용이 같은 페이지에 혼합되어 있습니다. {staff}는 Emily 앞에 그 중 몇 개를 별도로 배치합니다. 그녀는 철자 하나를 큰 소리로 읽고 펜을 들고 있는 사람에게 자신이 다 읽을 때까지 기다려 달라고 요청합니다. Emily는 자신이 지키고 싶은 단어에 동그라미를 칩니다. 그녀는 다시 찾을 수 있을 만큼 모서리가 보이도록 잎사귀를 뒤로 접습니다.
        p2: '{staff}는 Emily가 지시한 장소에서 첫 번째 버전을 엽니다. 그녀는 파선에 손가락을 꽂고 {staff}는 느슨한 시트에 페이지 번호와 수정 사항을 씁니다. 그녀는 확인하기 위해 시트를 잡아당깁니다. 두 숫자가 함께 빽빽하게 들어차고, 그녀는 그 사이에 공간을 만든다.'
        p1: '{staff}는 이름과 책 제목이 모두 포함된 페이지의 문자를 선택하고 검증 가능한 세트를 잘라냅니다. Charlotte와 Anne은 가져갈 것이 있습니다. 두 장의 시트가 가방에서 미끄러지기 시작합니다. 문을 닫기 전에 Charlotte는 Anne의 이름이 표시된 곳을 좋아합니다.'
      outcomes:
        all: 두 개의 목록이 목사관에 남아 있습니다. 하나는 다음 판용이고 다른 하나는 오래된 책 안에 있습니다. 그해 겨울, 벽 옆 의자는 Emily가 요청한 자리에 그대로 놓여 있었습니다.
        p4: 가족은 그녀의 요청대로 준비된 모퉁이를 떠납니다. 램프를 가까이 가져갈 때쯤이면 책은 여전히 손에 닿을 수 있는 거리에 있습니다.
        p3: 다음 판을 준비하면서 Charlotte는 접힌 부분을 먼저 찾은 다음 Emily의 원을 찾습니다.
        p2: 이후 교정자는 페이지 번호에서 첫 번째 인쇄 줄까지 바로 이동할 수 있습니다.
        p1: 런던에서 자매들은 각자의 서류를 따로 정리했습니다. 출판사는 모아놓은 제목을 나누어야 합니다.
      none: 첫 번째 버전은 선반으로 돌아갑니다. 페이지 사이의 시트는 아직 완성되지 않았습니다.
      not_admitted: '{staff}는 목사관 안으로 절대 들어가지 않습니다. 현관 아래에는 약간의 젖은 눈이 쌓여 있습니다.'
      desync: 런던으로 가는 서류가 한 더미로 쌓여 있습니다. 사무실에서 {staff}를 회수했을 때 표시된 두 개의 전표는 여전히 함께 놓여 있습니다.
      excerpts:
        p4: 누군가 다른 의자를 빼앗기 시작합니다. 에밀리는 손을 들고 그것이 있던 곳을 가리킵니다.
        p3: Emily는 자신이 지키고 싶은 단어에 동그라미를 칩니다. 그녀는 다시 찾을 수 있을 만큼 모서리가 보이도록 잎사귀를 뒤로 접습니다.
        p2: 그녀는 확인하기 위해 시트를 잡아당깁니다. 두 숫자가 함께 빽빽하게 들어차고, 그녀는 그 사이에 공간을 만든다.
        p1: 두 장의 시트가 가방에서 미끄러지기 시작합니다. 문을 닫기 전에 Charlotte는 Anne의 이름이 표시된 곳을 좋아합니다.
    relic: 개 목걸이
    relic_desc: 목사관 마스티프의 낡은 가죽 목걸이입니다.
    points:
      p1: 런던 편지로 인해 Bells의 책이 뒤섞일 때 자매들이 각 작가의 작품을 식별하는 종이를 모으는 것을 도와주세요.
      p2: 프린터 오류로 인해 줄이 변경되면 Emily가 나중에 프린터에서 확인할 수 있도록 수정 사항을 남길 수 있도록 도와주세요.
      p3: Emily는 자신의 캐릭터가 어떻게 말하는지 확인할 수 있지만 이후 버전을 위해 방언 사본을 준비하도록 하세요.
      p4: Emily에게 어떤 도움을 기꺼이 받아들이고 싶은지 물어보고 어디서 누구와 함께 쉴지 선택하게 하세요.
    points_fail:
      p1: 편지에는 여전히 그 책이 하나의 필명으로 되어 있으며 자매들은 런던에 별도의 증거를 가져갈 수 없습니다. 설명이 손실되고 사무실에서 해당 직원을 소환합니다.
      p2: 다음 프린터는 어떤 판독값이 의도적인 것인지 추측해야 하며 오류가 계속 발생합니다.
      p3: 그녀의 가족은 책이 재발행될 때 어떤 줄을 변경할지 결정해야 하며, 저자가 원하는 철자를 확인할 방법은 없습니다.
      p4: 그녀의 가족은 계단이 그녀를 지치게 하는 것을 볼 수 있습니다. 그들은 그녀가 어떤 도움을 원하는지 알기 전에 그녀가 물어볼 때까지 기다려야 합니다.
    shift:
      p1:
        was: 1848년 7월 Charlotte와 Anne Brontë는 하워스(Haworth)에서 런던으로 가서 출판사에게 벨 필명이 서로 다른 작가의 것이라고 설명했습니다.
      p2:
        was: 1847년 Wuthering Heights에는 인쇄 오류가 포함되어 있습니다. 1850년 신판에는 수정본이 게재되었습니다.
        now: '{staff}는 Emily에게 사본을 남겨 페이지 참조로 식별한 오류를 표시하고 기록합니다.'
      p3:
        was: Emily는 1848년에 Haworth에서 사망했습니다. Charlotte는 1850년판을 편집하고 일부 방언 철자를 변경했습니다.
        now: '{staff}는 Emily 앞에 방언 페이지를 별도로 배치하고 인쇄 오류와 별도로 그녀가 승인한 철자를 기록합니다. Charlotte는 다음 판을 준비할 때 그 사본을 가지고 있습니다.'
        who: emily_bronte_haworth
        bio: Emily는 자신의 손으로 방언을 확인하고 주석이 달린 Wuthering Heights 사본을 남겼습니다. 나중에 프린터는 그녀가 캐릭터의 목소리를 쓴 방식을 보존할 수 있었습니다.
      p4:
        was: 1848년 12월 19일 Emily는 Haworth 목사관에서 사망했습니다. 그녀는 병 때문에 의사의 진료를 거부했고, 죽는 날에만 동의했습니다.
        now: 이 지점에서는 {staff}가 그녀를 대신해 선택하는 대신 묻습니다. Emily는 가족이 그녀 주변에 있는 동안 쉴 곳과 근처에 머물 사람을 선택합니다.
    vignettes:
      witness: 독자는 이야기를 하는 사람이 모든 것을 보았다고 생각합니다. 당신은 그녀가 어떻게 특정한 세부 사항을 배웠는지 묻습니다. 그들은 문장을 제공한 화자까지 문장을 추적합니다.
      voices: 독자는 전체 페이지에 하나의 목소리를 부여합니다. 당신은 Nelly가 인수한 곳에서 다시 시도하도록 요청합니다. 이제 청취자는 한 화자가 이야기를 다른 화자에게 전달하는 시기를 알 수 있습니다.
      mark: 이야기가 바뀌는 지점에 스크랩을 남깁니다. 독자는 이후의 구절이 자신이 들은 내용과 모순되는지 여부를 결정하기 전에 다시 그 구절로 돌아갑니다.
  qu_yuan_miluo:
    name: 강가의 시 구절
    place: 멱라강
    figure: 굴원
    story: 초가는 굴원과 어부 사이의 문학적 교류인 『어부』를 전한다. 기록의 후기 전기에도 대화 버전이 보존되어 있습니다.
    story_prose:
      opening:
        - 추(Chu)의 강둑에서. 초나라의 노래를 읽는 독자들은 추방된 굴원이 쓴 시와 그가 물가에서 어부를 만나는 이야기를 알게 될 것입니다.
        - 수신된 기록에는 그가 습지 옆에서 얼굴을 그린 채 낭송하는 모습이 나와 있습니다. 이 부분에서 누군가는 아직 완성되지 않은 한 묶음의 구절을 가져가려고 합니다.
        - 책과 강 건너기를 아는 사람이 도움을 줄 수 있습니다. 조용한 곳을 찾아 그곳에 식사를 남길 수 있는 사람도 마찬가지다.
      points:
        p2: '{staff}는 음식을 파는 사람에게 자리를 비워두고 그릇을 내려놓고 물러나라고 요청합니다. 굴원은 앉아서 왼손에 전표를 얹었습니다. 그는 스스로 하나를 꺼내기 전에 조금 먹습니다. 그는 그 줄을 두 번째로 읽습니다. 문 옆에 앉아 있던 누군가가 방으로 더 멀리 이동합니다.'
        p1: 강을 건너는 사람들이 짐을 꾸리고 있다. {staff}는 굴원에게 어떤 묶음을 보관하고 싶은지 묻고 복사하는 사람에게 마지막 줄을 다시 읽어달라고 요청합니다. 굴원은 다른 두 사람 사이에 있는 전표를 찾아 그 자리에 내려 놓습니다. 캐리어는 코드를 다시 통과시키고 매듭은 바깥쪽에 둡니다. 다음에 번들이 열릴 때 손으로 찾을 수 있습니다.
      outcomes:
        all: 운송업체가 번들을 가져갑니다. 배에서 그는 식사 중에 들었던 대사를 아직도 기억하고 있다가 그 사본을 열어서 그것을 찾습니다.
        p2: 그릇을 비운 뒤에도 여전히 그 자리에 있는 사람들은 조금 더 오래 머뭅니다. 조용한 가운데 굴원은 다시 같은 실수를 합니다.
        p1: 사본은 하류로 내려갑니다. 운반자가 앉으면 매듭을 가장 가까운 손으로 돌립니다.
      none: 식사를 위해 내놓은 자리는 여전히 비어 있다. 어두워지면 바람이 매트의 모서리를 들어 올립니다.
      not_admitted: '{staff}는 식사를 위해 준비된 장소를 결코 찾지 못합니다. 뱃사공이 판자를 끌어당기는데도 그 아래에는 여전히 물이 흐르고 있습니다.'
      desync: 두 장의 전표 사이에 사본의 일부가 누락되었습니다. 기관에서 {staff}를 다시 호출하면 항공사가 해안에 막 도착했습니다.
      excerpts:
        p2: 그는 그 줄을 두 번째로 읽습니다. 문 옆에 앉아 있던 누군가가 방으로 더 멀리 이동합니다.
        p1: 캐리어는 코드를 다시 통과시키고 매듭은 바깥쪽에 둡니다. 다음에 번들이 열릴 때 손으로 찾을 수 있습니다.
    relic: 시구가 적힌 죽간
    relic_desc: 몇 줄의 긴 시가 적힌 대나무 쪽지.
    points:
      p1: 굴원에게 복사하고 싶은 묶음이 무엇인지 물어보고 사람들이 떠나는 동안 독자가 그 구절을 함께 보관할 수 있도록 도와주세요.
      p2: 굴원에게 먹고 앉을 자리를 제공하고, 그가 자신의 시 중 하나를 큰 소리로 읽고 싶어하면 들어보세요.
