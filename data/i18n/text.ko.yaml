      p2: 역사에 따르면 네 개의 연은 오직 그의 손에만 남아 있었고 이 지점에는 스탠웰 공원에 두 번째 기록이 없었습니다.
    shift:
      p1:
        was: 1894년 11월 12일 스탠웰 공원(Stanwell Park) 해변에서 기차에 실린 네 개의 상자 연이 하그레이브를 모래 위로 거의 16피트까지 들어 올렸습니다.
      p2:
        was: 1894년에는 4개의 연을 만드는 일이 하그레이브의 손에 단독으로 맡겨졌습니다. 말년에 그는 자신의 모델을 뮌헨으로 보냈고, 대부분은 제2차 세계 대전 중에 파괴되었습니다.
