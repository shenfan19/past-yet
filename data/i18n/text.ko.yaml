    relic: 석고 모형
    relic_desc: 작은 매달린 금고 모형입니다.
    points:
      p1: 가우디가 병원에 있는 동안 Domènec Sugranyes에게 진행 중인 작업 목록과 작업장 열쇠를 전달하여 6월에 건물이 계속 진행될 수 있도록 하세요.
      p2: Sugranyes에게 작업장에 서명된 목록을 남겨두고 주요 석고 모형의 사진, 축척 및 그림을 두 번째 장소에 보관하도록 요청하세요.
      p3: 6월 7일 저녁, 그란 비아에서 아무도 모르는 노인을 트램이 쓰러뜨리자, 가우디를 즉시 병원으로 데려가 그를 구하십시오.
    points_fail:
      p1: 워크샵은 Gaudí가 승인할 때까지 기다리고 있으며 그의 동료는 진행 중인 작업 목록을 검색할 수 없습니다. 인계가 중단되고 사무실에서 해당 직원을 소환합니다.
      p2: 사진과 그림은 찬장 같은 줄에 보관됩니다. 작업장이 손상되면 석고 모델과의 비교 자료가 손실됩니다.
      p3: 거지 취급을 받은 그는 택시가 지나가는 동안 거리에 누워 있다가 늦게 진료소에 갔다가 병원에 갔다가 6월 10일 그곳에서 사망했습니다.
    shift:
      p1:
        was: 가우디는 1926년 6월 트램 사고로 병원에 입원했고 그곳에서 사망했습니다. 그의 동료인 수그라니예스(Sugranyes)는 가우디가 미완성으로 남겨둔 건물의 관리를 맡았습니다.
      p2:
        was: 1936년에 작업장의 원본 도면과 석고 모델의 대부분이 손실되었습니다. 이 프로젝트는 나중에 재구성을 위해 조각과 게시된 이미지를 그렸습니다.
        now: 10년 후 작업장 찬장은 불탔습니다. 팀은 두 번째 사이트에서 앨범과 그림을 검색합니다. 그렇지 않으면 조각을 모아서 조립해야 했던 두 모델 얼굴이 이제 비교를 위한 현대적인 차원을 갖게 되었습니다.
      p3:
        was: 1926년 6월 7일 가우디는 그란비아에서 트램에 치였습니다. 서류도 없고 옷도 입지 않은 그는 거지 취급을 받아 6월 10일 병원에서 73세의 나이로 사망했습니다.
        now: '{staff}는 잠시 후 그의 옆에 무릎을 꿇고 그가 누구인지 말한 후 곧바로 외과 의사에게 데려갑니다. 가우디는 회복하여 몇 년 동안 건축 현장의 작업장으로 돌아갑니다.'
        who: gaudi_barcelona
        bio: 가우디는 1926년 6월 트램 사고에서 살아남았습니다. 그는 건축 현장의 작업장으로 돌아와 몇 년 동안 Sugranyes와 함께 작업을 계속 감독했습니다.
    vignettes:
      tram: 5월 29일 {staff}는 뒤쪽 플랫폼에 서서 트램을 타고 그란비아(Gran Via) 구간을 주행합니다. 차장은 자기 일의 가장 나쁜 부분은 요금이 아니라 신문을 읽는 사람들이라고 말하며, 거리 전체를 꾸짖는 듯 구석구석에서 종을 울린다.
      stone: 6월 1일 {staff}는 현장에 있는 두 명의 석공이 조각된 블록을 모르타르 바닥에 내리는 것을 돕습니다. 바람이 불면 머리 위 탑의 개구부를 통해 휘파람 소리가 나고, 어린 석공은 그 바람이 매일 오후 같은 소리를 내며 흥얼거리기 시작했다고 맹세합니다.
      water: 가장 무더웠던 7월 10일, {staff}는 정오에 현장에 찾아온 물 판매자를 위해 물통을 나르고 있습니다. 그녀는 석공들이 종이 울리기 전에 통을 마시고 물에서 먼지 냄새가 난다고 불평한다고 말했습니다. 그녀는 그들이 그렇게 하기 때문에 그런다고 지적합니다.
  kafka_kierling:
    name: 요양원의 교정쇄
    place: 키얼링
    figure: 프란츠 카프카
    story: 1924년 3월 프란츠 카프카의 후두까지 결핵이 발병해 삼키는 것이 힘들어졌습니다. 4월 19일에 그는 도라 디아만트와 함께 클로스터노이부르크 근처 키얼링에 있는 호프만 요양소에 왔습니다. 그는 말하지 말라는 말을 들었고 대부분 종이 쪽지로 이야기했습니다. 5월 6일쯤 의대생인 로버트 클롭스톡(Robert Klopstock)이 그를 돌보기 위해 왔습니다. 6월 2일에도 그는 자신의 컬렉션인 『단식 광대』의 교정본을 수정하고 있었습니다. 그는 6월 3일 정오경에 40세의 나이로 세상을 떠났고 6월 11일 프라하에 묻혔습니다. 8월 말 베를린에서 네 편의 이야기로 구성된 책이 나왔습니다.
    story_prose:
      opening:
        - 1924년 5월 비엔나 북쪽 클로스터노이부르크 근처 키어링에 있는 호프만 요양소. 40세의 프란츠 카프카는 결핵을 앓고 있으며 3월부터 결핵이 후두까지 도달하여 삼키는 것이 점점 더 어려워졌습니다. 그는 정원 위에 발코니가 있는 방을 가지고 있습니다. 말하지 말라고 한 그는 주로 작은 종이 쪽지에 대해 이야기합니다. 도라 디아만트는 그를 위해 객실과 요리를 제공하고 있으며, 5월 6일경 의과대학생인 Robert Klopstock이 간호를 돕기 위해 왔습니다. 그는 자신이 직접 집필한 마지막 책인 『단식 광대』 컬렉션의 교정쇄를 아직도 수정하고 있습니다.
        - 역사상, 삼키면 너무 아파서 거의 먹을 수 없었고, 그의 의사는 8~10일마다 통증에 대해 후두 신경을 주사했습니다. 6월 2일에도 그는 여전히 교정을 수정하고 있었고, 부모님에게 보낸 마지막 편지는 너무 피곤해서 끝낼 수 없었고, 도라가 그를 위해 그것을 완성했습니다. 6월 3일 정오쯤에 그는 세상을 떠났고, 그 책은 8월 말에야 베를린에서 출판되었다. 이 지점의 요양원에는 라일락을 자르는 정원사와 편지를 운반하는 심부름꾼이 있고, 마을 빵집에는 빵 굽는 사람의 아내가 있습니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 약을 알고 진통제를 가지고 다니는 사람, 목의 통증을 완화하기 위해 마음이 빠른 의사; 빠른 마음으로 기록 보관소를 보관하거나 교정본을 읽는 사람, 또는 질병으로 인해 교정이 중단될 때마다 자신의 자리를 지키려는 강한 의지로 체계적이거나 주의 깊은 사람; 간호 훈련을 받은 사람이나 친절하고 참을성 있고 체계적인 사람이 감시하는 사람들이 쉴 수 있도록 심부름과 편지를 나누어 줄 것입니다. 신속하고 꾸준하게 기록 보관소를 보관하거나 교정본을 읽어본 사람, 또는 여전히 강한 의지를 지닌 체계적인 사람이 베를린 출판사에 사본을 제본하여 미리 보내도록 요청하는 것입니다.
      outcomes:
        all: 6월 3일 정오쯤 카프카는 키얼링에서 사망했다. 발코니의 작은 테이블에는 미리 제본된 사본과 페이지 사이에 좁은 종이 조각이 놓여 있고 그 옆에는 빈 그릇이 놓여 있습니다.
        p3: 6월 3일 정오쯤 카프카는 키얼링에서 사망했다. 지난 몇 주 동안 도라가 들고 온 그릇은 대부분 비어 있었습니다.
        p4: 6월 3일 정오쯤 카프카는 키얼링에서 사망했다. 미리 제본된 사본은 페이지 사이에 좁은 종이 조각이 끼워져 있는 발코니의 작은 테이블 위에 놓여 있었습니다.
        p2: 6월 3일 정오쯤 카프카는 키얼링에서 사망했다. 회전 테이블은 그들이 떠나는 날까지 복도 문 뒤에 고정되어 있었고 마지막 칸은 여전히 비어 있었습니다.
        p1: 6월 3일 정오쯤 카프카는 키얼링에서 사망했다. 8월 말에 『단식 광대』가 베를린에서 출판되었는데, 그 네 편의 이야기는 그가 마지막으로 수정한 대로 인쇄되었습니다.
      none: 6월 3일 정오쯤 카프카는 키얼링에서 40세의 나이로 세상을 떠났다. 사용하지 않은 종이 쪽지 더미가 발코니의 작은 테이블 위에 남아 있었습니다.
      desync: 5월 19일 연필이 떨어졌을 때 교정본이 절반만 수정되었습니다. 그가 어느 줄에 멈춰 섰는지 기억하는 사람은 아무도 없었고, 수정된 페이지는 나머지 페이지에 모아두었습니다. {staff}가 리콜되었을 때 발코니에서 바람이 불어와 톱 페이지를 넘겼습니다.
      not_admitted: '{staff}는 요양소에 들어가지 않았고, 클로스터노이부르크(클로스터노이부르크) 언덕 아래 우체국 밖에 몇 번 서 있을 뿐이었습니다. 심부름꾼은 매일 한 움큼의 편지를 가지고 내려왔고, 뚱뚱한 편지 한 통은 베를린으로 발송되었습니다.'
      points:
        p3: 5월 11일 정오에 도라가 수프 한 그릇을 가져왔습니다. 카프카는 숟가락을 집어 다시 내려놓고 종이에 몇 단어를 쓴 뒤 밀어낸다. 약을 아는 {staff}는 의사와 함께 식사 전에 통증을 완화하는 방법을 연구하고 횟수를 정한 다음 통증이 완화된 후에야 다시 그릇을 그의 앞에 놓습니다. 카프카는 아주 작은 입으로 삼키다가 한 입씩 멈춥니다. 절반도 안 남았을 때 그는 그릇 가장자리에 숟가락을 놓고 연필을 집어 전표 뒷면에 한 줄을 더 썼습니다.
        p1:
          class_lettered: 5월 19일 오후, 발코니에 있는 작은 탁자 위에 증명서 더미가 놓여 있었습니다. 교정을 하는 도중에 카프카가 기침을 하기 시작하고 연필이 바닥에 떨어집니다. 종이 작업을 하던 {staff}는 연필을 집어 멈춘 선 옆에 좁은 종이 조각을 밀어 넣고, 수정된 페이지를 나머지 페이지에서 두 더미로 분리하고 그 위에 문진을 얹는다. 카프카는 잠시 쉬었을 때 스스로 스트립을 꺼내 수정 작업을 계속합니다. 바람이 느슨하게 남겨둔 페이지의 한 귀퉁이를 들어올리고, 그는 손을 내밀어 붙잡는다.
