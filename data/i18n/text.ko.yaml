      garden: 6월 27일 {staff}는 해가 진 후 빌라 프리데리케의 하녀가 야외용 의자를 들고 정원을 돌아다니는 것을 돕습니다. 그녀는 태양이 정확히 7시에 잔디밭을 떠난다고 말했습니다. 그리고 이 집에서는 복도에 있는 시계가 아니라 잔디밭에 저녁 식사를 설정합니다.
      post: 7월 7일, {staff}는 Hotel Sommer 옆 우체국 바깥 벤치에 앉아 있었습니다. 우체부는 여름에 러시아인들이 바덴바일러에서 가장 많은 편지를 쓰고, 영어가 가장 짧은 편지를 쓴다고 말했습니다. 그는 러시아 봉투를 들어올리고 또 다른 우표가 필요한지 여부를 알 수 있습니다.
      ice: 7월 10일, 최악의 더위 속에서 {staff}는 Hotel Sommer의 포터가 지하실에서 얼음 덩어리를 자루에 담아 옮기는 것을 돕습니다. 짐꾼은 검은 숲에 20년 동안 이런 7월이 없었다고 말했고, 뮐하임에서 온 얼음 사나이가 계단으로 돌진하기 시작했습니다.
  boole_ballintemple:
    name: 젖은 옷과 강의 한 시간
    place: 코크 밸린템플
    figure: 조지 불
    story: 코크에는 비가 내리고 있고 조지 불은 가르칠 수업이 있습니다. 한 학생이 <사고의 법칙>의 연습 문제에 대해 아직도 곤혹스러워하고 있습니다. 마을 건너편에서 미완성인 부울의 미완성 작업에 포함된 표는 결국 하나의 부호로 인해 다시 계산되어야 합니다.
    story_prose:
      opening:
        - 1864년 11월 아일랜드 코크. 조지 불(조지 불)은 퀸스 칼리지의 첫 번째 수학 교수입니다. 10년 전 《생각의 법칙》에서 그는 대수학에서 추론의 법칙을 썼는데, 그 중 한 명은 같은 조건으로 두 번 선택하면 선택이 변하지 않는다고 말합니다. 그는 아직 미완성된 미분방정식에 관한 책을 가지고 있습니다.
        - 역사상 그는 11월 24일에 폭우를 뚫고 집에서 대학으로 가서 강의를 했습니다. 12월 8일 그는 Ballintemple에 있는 자택에서 흉막폐렴으로 사망했습니다. 다음 해에 Todhunter는 보충 자료를 작성하고 서문에 공식의 잘못된 기호로 인해 Sephton이 책 끝의 표를 다시 계산했다고 썼습니다. 이 분야에서는 번호가 매겨진 쪽지를 쥐고 있는 학생이 같은 조건으로 두 번째를 선택하면 어떤 쪽지가 떨어질지 여전히 궁금해합니다.
        - 이번 여행에는 세 종류의 사람들이 도움을 줄 수 있습니다. 비를 맞으면서 강의 노트를 가지고 다니는 시간을 잘 지키는 사람, 공식을 확인하고 오류를 찾아줄 수 있는 사람, 간호를 알고 야간 순찰을 맡을 수 있는 사람.
      outcomes:
        all: 그 12월 밤에는 불의 집에 있는 등불이 아침까지 켜져 있었고, 한 시계가 다른 시계를 따라갔습니다. 종이 마커는 다음 해에도 여전히 그 자리에 있었습니다.
        p3: 그 밤에는 Boole의 집에 있는 등불이 아침까지 켜져 있었고, 한 시계가 다른 시계를 따랐습니다.
        p2: 다음 해에 편집자가 폴더를 열었고 종이 마커가 여전히 그 자리에 있었습니다. Sephton은 그 표시에서 계산을 시작했습니다.
        p1: 11월 24일 강의에서는 책상 위의 노트가 한 페이지도 젖지 않았습니다.
      none: 비는 12월까지 계속됐다. Ballintemple의 집에서는 침대 옆에있는 사람들이 밤새도록 눈을 감지 않았습니다.
      desync: 그날 비로 인해 강의 노트가 펄프처럼 젖었고 강의대는 텅 비었습니다. {staff}는 다음 강의 전에 사무실에서 회수되었습니다.
      not_admitted: '{staff}는 대학 문을 통과하지 못했습니다. 비는 계속 내렸고, 강의 노트는 여전히 부울의 집 탁자 위에 놓여 있었습니다.'
      points:
        p1: 11월 24일에는 비가 많이 내렸다. Boole이 집을 떠나기 전에 {staff}는 강의 노트를 두 겹의 기름천으로 싸서 코트 안에 넣고 그의 앞에 있는 대학으로 가져가서 강연대 서랍에 넣었습니다. Boole이 집에 들어왔을 때 그의 코트에는 물이 뚝뚝 떨어졌고 서랍을 열어보니 그 지폐가 말랐습니다. 그는 그것을 펴고 소맷단에 손을 닦은 다음 시작했습니다.
        p2: '{staff}는 그것을 생성한 공식 옆에 테이블을 놓고 한 줄씩 다시 작업했습니다. 어떤 곳에서는 숫자가 일치하지 않을 것입니다. 위쪽으로 추적해 보면 결함은 잘못된 방향으로 작성된 공식의 표시였습니다. {staff}는 원고를 변경하지 않았으며 해당 페이지에 종이 마커를 삽입하여 어떤 줄과 어떤 기호를 표시했는지만 표시했습니다.'
        p3: 12월 초, Boole은 집에 병이 들었고 그의 가족은 교대로 그의 침대 곁에서 며칠 밤을 잠도 못 자고 지냈습니다. {staff}는 간호가 요구하는 대로 야간 순찰을 맡아 정시에 그를 켜고, 물을 주고, 담요를 덮고, 밤에 일어난 모든 일을 시트에 기록했습니다. 가족은 등불을 켜놓고 몇 시간 동안 잠을 잤습니다. 그들이 새벽이 되기 전에 돌아왔을 때, 불은 여전히 잘 타오르고 있었고, 침대 옆 시트는 밤의 시간들로 가득 차 있었습니다.
      excerpts:
        p3: 가족은 등불을 켜놓고 몇 시간 동안 잠을 잤습니다. 그들이 새벽이 되기 전에 돌아왔을 때, 불은 여전히 잘 타오르고 있었고, 침대 옆 시트는 밤의 시간들로 가득 차 있었습니다.
        p2: 어떤 곳에서는 숫자가 일치하지 않을 것입니다. 위쪽으로 추적해 보면 결함은 잘못된 방향으로 작성된 공식의 표시였습니다. {staff}는 원고를 변경하지 않았으며 해당 페이지에 종이 마커를 삽입하여 어떤 줄과 어떤 기호를 표시했는지만 표시했습니다.
        p1: Boole이 집에 들어왔을 때 그의 코트에는 물이 뚝뚝 떨어졌고 서랍을 열어보니 그 지폐가 말랐습니다. 그는 그것을 펴고 소맷단에 손을 닦은 다음 시작했습니다.
    relic: 논리학을 적은 종이 한 장
    relic_desc: 동일한 선택 사항을 두 번 적용하면 어떤 일이 발생하는지 보여주는 교실 연습입니다.
    points:
      p1: Boole이 폭우를 맞기 전에 강의 노트를 대학에 전달하고 수업을 일정대로 유지하세요.
      p2: 표를 생성된 공식과 비교하고 원고를 확인하는 다음 사람을 위해 기호를 표시하십시오.
      p3: Boole의 침대 옆에 있는 가족이 휴식을 취할 수 있도록 저녁 순찰을 맡을 사람을 찾으세요.
    points_fail:
      p1: 메모가 흠뻑 젖어 있고 누구도 중복된 내용을 갖고 있지 않습니다. 수업을 놓치고 사무실에서 직원을 소환합니다.
      p2: 테이블은 수식을 선택하지 않은 상태로 폴더로 이동합니다. Sephton은 나중에 오류를 추적해야 합니다.
      p3: 그 가족은 안도감 없이 저녁 경시를 지켰습니다. 그 중 한 명은 램프를 내려놓을 만큼만 방을 나갑니다.
    shift:
      p1:
        was: University College Cork는 Boole이 1864년 11월 24일 폭우 속에서 가르치기 위해 집에서 걸어 나왔다고 기록합니다.
      p2:
        was: Boole은 1864년 12월에 사망했습니다. Todhunter는 보충제를 준비했습니다. 그의 서문에는 원고의 부호 오류로 인해 다시 계산된 표가 기록되어 있습니다.
        now: 편집자가 폴더를 열면 종이 마커가 그를 바로 공식으로 안내합니다. Sephton은 표지판을 확인하여 시작할 수 있습니다.
      p3:
        was: Boole은 1864년 12월 8일 Ballintemple에 있는 집에서 흉막폐렴으로 사망했습니다.
        now: '{staff}는 저녁 시간에 의자를 맡아줄 사람을 찾습니다. 가족은 등불을 켜놓고 몇 시간 휴식을 취한 후 돌아옵니다.'
    vignettes:
      repeat: '{staff}는 학생에게 짝수를 골라낸 다음 손에 전표를 들고 다시 짝수를 고르도록 요청합니다. 학생은 내려놓을 것을 찾습니다. 하나도 없습니다.'
      border: '{staff}가 첫 번째 숫자를 어떻게 얻었는지 물었을 때 학생이 일련의 숫자를 쓰려고 합니다. 학생은 나머지 부분을 복사하기 전에 공식에 다시 선을 그립니다.'
      example: 학생은 완성된 연습문제를 책 아래에 밀어 넣어 평평하게 유지합니다. 페이지 가장자리에는 잡을 수 있을 만큼만 종이 마커가 튀어나와 있습니다.
  ahmed_baba_timbuktu:
    name: 보유편에 남길 이름
    place: 팀북투
    figure: 아흐마드 바바
    story: 1591년 모로코 군대가 팀북투를 점령한 후 학자 아마드 바바는 술탄에 저항했다는 이유로 기소되어 1594년 마라케시로 추방되었습니다. 그곳에서 그는 Ibn Farhun의 보충 자료로 전기 사전을 편집했습니다. 그는 1608년에 팀북투로 돌아가는 것이 허용되었고 1627년 4월 22일 그곳에서 사망했습니다.
    story_prose:
      opening:
        - 1594년 팀북투. 3년 전 모로코 군대가 도시를 점령했습니다. 아흐마드 바바는 이곳의 학자입니다. 그는 법과 문법에 관한 수십 권의 책을 썼으며 그의 집에는 매우 큰 도서관이 있습니다.
        - 역사상 올해 그는 술탄에 반항했다는 비난을 받고 가족과 함께 사하라 사막을 건너 북쪽 마라케시로 행진했습니다. 그의 책은 도난당했거나 다른 계정에 의해 길에서 분실되었습니다. 14년 후 그는 집으로 돌아왔지만 책은 사라졌습니다. 이 지점에서는 골목 맨 끝에 있는 한 집의 아내가 침대 밑 공간을 기꺼이 치우고 있으며, 안뜰의 필사자는 여전히 그의 책에 대한 라벨을 쓰고 있습니다.
        - 이 여행에는 세 종류의 사람이 도움을 줄 수 있습니다. 오래된 책을 아는 사람, 어떤 상자를 먼저 보관해야 하는지 아는 사람, 끌려가는 날 밀쳐도 견딜 수 있을 만큼 용감하고 강인한 사람, 간호할 줄 알고 상처를 치료하고 사막에서 물을 나눠줄 수 있는 사람입니다.
      outcomes:
        all: 1608년에 아흐메드 바바가 팀북투로 돌아왔습니다. 이웃의 아내는 늙었습니다. 그녀는 침대 밑에서 상자를 꺼냈고, 가죽에는 먼지가 묻어 있었습니다. 그는 맨 위에 있는 책을 펴고 자신의 손길을 알고 있었습니다.
        p3: 14년 후 그는 팀북투로 돌아왔습니다. 그 집 사람은 침대 밑에서 상자를 꺼냈고, 그는 책을 하나씩 손으로 훑어보며 오랫동안 상자 옆에 앉았습니다.
        p2: 노소를 불문하고 온 가족이 마라케시에 도착했습니다. 성문 옆에서 아이의 발에 딱지가 생겼습니다.
        p1: 그는 살아서 마라케시에 도착했습니다. 14년 후 그는 집으로 돌아오는 것이 허락되었습니다.
      none: 북쪽으로 향하는 기둥이 멀리 멀어졌습니다. 팀북투의 그 방에는 선반이 비어 있었고 문은 닫혀 있지 않았습니다.
      desync: 끌려가던 날 길 모퉁이에서 몸싸움이 벌어졌고, {staff}는 그의 곁으로 오기 전 사무실에서 소환됐다. 마지막으로 눈에 띄는 것은 군중 속에 짓밟힌 신발이었습니다.
      not_admitted: '{staff}는 그 안뜰에 들어 가지 않았습니다. 그 책들은 여전히 선반 위에 있었고, 그가 끌려갈 날이 다가오고 있었습니다.'
      points:
        p3:
          class_craft: '{staff}는 오래된 책을 수선하는 규칙을 따르고, 가장 부서지기 쉬운 책 사이에 마른 천을 놓고, 가죽을 안쪽으로 덮고, 덮개를 평평하게 눌러 상자에 층층이 포장했습니다. 어두워진 후 두 남자가 두 길을 지나 이웃 아내의 집으로 상자를 운반했습니다. 그녀는 침대 밑의 잡동사니를 끌어내고, 상자를 안으로 밀어넣고, 잡동사니를 원래 자리에 다시 채우고, 손에서 먼지를 털었습니다.'
          class_lettered: '{staff}는 책 목록에서 먼저 자신의 초안과 다른 사람이 존재하지 않는 사본을 선택하여 층별로 상자에 포장했습니다. 어두워진 후 두 남자가 두 길을 지나 이웃 아내의 집으로 상자를 운반했습니다. 그녀는 침대 밑의 잡동사니를 끌어내고, 상자를 안으로 밀어넣고, 잡동사니를 원래 자리에 다시 채우고, 손에서 먼지를 털었습니다.'
          else: '{staff}는 타이틀을 볼륨별로 살펴보고 먼저 자신의 초안과 희귀한 사본을 따로 보관한 다음 층별로 상자에 포장했습니다. 어두워진 후 두 남자가 두 길을 지나 이웃 아내의 집으로 상자를 운반했습니다. 그녀는 침대 밑의 잡동사니를 끌어내고, 상자를 안으로 밀어넣고, 잡동사니를 원래 자리에 다시 채우고, 손에서 먼지를 털었습니다.'
        p1: 그가 끌려가던 날 거리는 사람들로 붐볐고 누군가 밀치는 가운데 누군가가 칼날을 뽑았습니다. {staff}는 아흐마드 바바 앞에 서서 그를 출입구로 끌어당기고 문틀에 등을 기대게 했습니다. 그 일이 지나자 그는 겉옷을 곧게 펴고 상처 하나 없이 스스로 걸어 나갔습니다.
        p2: 북쪽으로 반달을 가는데 행렬에 있던 한 남자가 고열에 시달렸고, 한 아이의 발바닥이 다 닳았습니다. 매일 저녁 야영 준비가 끝나면 {staff}는 상처를 씻고 붕대를 갈아 준 뒤, 사람마다 같은 양의 물을 나눠 주었다. 어느 날 밤, 아이가 자기 물주머니를 내밀었다. 안에는 한 모금만 남아 있었다.
      excerpts:
        p3: 어두워진 후 두 남자가 두 길을 지나 이웃 아내의 집으로 상자를 운반했습니다. 그녀는 침대 밑의 잡동사니를 끌어내고, 상자를 안으로 밀어넣고, 잡동사니를 원래 자리에 다시 채우고, 손에서 먼지를 털었습니다.
        p2: 매일 저녁 야영 준비가 끝나면 {staff}는 상처를 씻고 붕대를 갈아 준 뒤, 사람마다 같은 양의 물을 나눠 주었다. 어느 날 밤, 아이가 자기 물주머니를 내밀었다. 안에는 한 모금만 남아 있었다.
        p1: '{staff}는 아흐마드 바바 앞에 서서 그를 출입구로 끌어당기고 문틀에 등을 기대게 했습니다. 그 일이 지나자 그는 겉옷을 곧게 펴고 상처 하나 없이 스스로 걸어 나갔습니다.'
    relic: 가죽으로 제본된 원고
