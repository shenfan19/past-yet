        bio: Abel은 죽기 전에 베를린 친구들이 자신이 연구를 계속할 수 있는 기회를 열어두기 위해 어떻게 노력하는지 들었습니다. 공식적인 확인은 그의 죽음 이후에도 이루어졌습니다.
