        was: 모딜리아니가 죽은 지 이틀 뒤인 1920년 1월 26일, 임신 8개월이었던 잔느 에뷔테른(Jeanne Hébuterne)이 14개월 된 딸을 남기고 부모님 집에서 사망했습니다.
        now: '{staff}는 그 시절 내내 그녀의 곁을 지켰습니다. 이 타임라인에서 Jeanne은 아이를 낳고, 아들과 딸을 키우고, 나중에 다시 그림을 그리기 시작합니다.'
        who: jeanne_hebuterne
        bio: 잔느 에뷔테른은 1920년 겨울을 보내며 둘째 아이를 낳고 두 아이를 키우며 그림을 그렸습니다.
    vignettes:
      coal: 1월 10일 {staff}는 같은 카운터에서 나무, 석탄, 와인을 파는 거리의 석탄맨을 위해 석탄 한 자루를 계단 위로 운반합니다. 그는 올 겨울 몽파르나스에서는 누구도 한 자루를 통째로 사지 않는다고 말했습니다. 그들은 절반을 사고 나머지 절반은 약속으로 지불합니다.
      saucers: 2월 초 {staff}는 몽파르나스 카페에서 웨이터가 테이블을 치우는 것을 돕습니다. 각 음료는 자체 접시에 담겨 제공되며 청구서는 더미에서 계산됩니다. 그는 뒷테이블을 가리켰다. 화가들은 거기에 접시로 탑을 쌓고 돈이 떨어지면 그림으로 돈을 지불한다.
      mimosa: 3월 초 {staff}는 시장에서 꽃 판매자가 첫 번째 미모사 다발을 푸는 것을 돕습니다. 그녀는 그들이 야간열차를 타고 남쪽에서 올라왔는데, 추운 3월에는 파리에서 유일한 노란색이라고 말했습니다.
  wallace_ternate:
    name: 테르나테에서 온 논문
    place: 테르나테
    figure: 앨프리드 러셀 월리스
    story: 1858년 2월, 몰루카 제도에서 열병이 발생한 후, 앨프리드 러셀 월리스(앨프리드 러셀 월리스)는 변종들이 원래 유형에서 어떻게 벗어나는지에 대한 에세이를 썼습니다. 날짜와 장소는 1858년 2월, Ternate입니다. 3월 25일 월리스는 젊은 사냥꾼 주마트(Jumaat)가 포함된 일행과 함께 테르나테(Ternate)에서 출항했습니다. 그들은 뉴기니 해안의 도레이(Dorey)에 도착했습니다. 에세이는 영국의 Charles Darwin에게 전달되었습니다. 7월 1일에는 런던에서 다윈의 작품과 함께 그 책이 읽혔는데, 두 작가 모두 방에 없었습니다.
    story_prose:
      opening:
        - 1858년 2월, 몰루카스. 발열 후 월리스는 변종이 원래 형태와 어떻게 다른지에 대한 에세이를 씁니다. 그는 Ternate에서 데이트를 합니다.
        - 역사상 에세이는 영국에 도달했습니다. Wallace는 Dorey로 항해하여 발목을 다쳤습니다. 그와 함께 여행했던 주마트(Jumaat)는 6월 그곳에서 사망했다. 이 지점에서는 누군가가 Wallace가 글을 쓰고 Dorey로 건너가는 동안 감시할 수 있습니다.
        - 이번 여행에는 병상 옆에 머물면서 탑승자에게 쉴 시간을 줄 수 있는 사람이 필요합니다. 또한 상처 치료에 대해 잘 알고 있거나 올바른 물품을 가져오는 사람이 필요합니다.
      points:
        p1: 열이 떨어지면 {staff}는 근처에 머물면서 종이와 물을 월리스의 손이 닿는 곳으로 옮깁니다. 그는 장소의 이름을 쓰고 잠시 멈춘다. {staff}는 창가에서 들어 올려지는 시트의 모서리를 잡습니다.
        p2: Dorey에서 {staff}는 Wallace의 발목을 돌보고 그가 체중을 견딜 수 있을 때까지 기다린 후 그와 함께 몇 걸음 더 나아갑니다. 문밖은 아직 진흙이 젖어있습니다. 월리스가 그 안으로 들어가자 두 번째 인쇄물은 첫 번째 인쇄물만큼 깊습니다.
        p3: Jumaat는 침대에서 나올 수 없습니다. {staff}는 그가 스스로 그릇을 움직일 수 있을 때까지 그와 함께 있고 가져온 소모품을 사용합니다. 처음에 Jumaat는 양손으로 그릇을 잡고 한 손을 놓는다. 그의 손목을 따라 물이 흐르고 침대 옆으로 똑똑 떨어진다.
      outcomes:
        all: 그 신문은 결국 영국에 도착했습니다. 보트가 Dorey를 떠났을 때 Jumaat는 다리를 옆으로 끌어당겼고 Wallace는 벤치에 공간을 마련했습니다.
        p3: 7월 말에는 보트에 한 명 더 탈 수 있는 공간이 있었습니다. Jumaat는 그릇을 발치에 두고 앉았습니다.
        p2: 증기선이 Dorey에 있는 동안 Wallace는 다시 숲으로 들어갔습니다. 조금 더 나아가서 그는 신발에 묻은 진흙을 닦아내기 위해 몸을 굽혔습니다.
        p1: 에세이는 나중에 런던에서 읽혔습니다. 원고를 열었을 때 마지막 줄에는 여전히 Ternate라고 적혀 있었습니다.
      none: 창가쪽에 테이블이 있었어요. 습기가 들어오면서 시트의 바깥쪽 모서리가 말리기 시작했습니다.
      not_admitted: '{staff}는 파티에 참가하지 못했습니다. 부두에 밧줄이 느슨해져서 물을 가로질러 선을 그렸습니다.'
      desync: 침대 옆에는 종이가 미완성 상태로 놓여 있었습니다. {staff}가 리콜되었을 때 프레임 내부에는 여전히 습기가 남아 있었습니다.
      excerpts:
        p3: 처음에 Jumaat는 양손으로 그릇을 잡고 한 손을 놓는다. 그의 손목을 따라 물이 흐르고 침대 옆으로 똑똑 떨어진다.
        p2: 문밖은 아직 진흙이 젖어있습니다. 월리스가 그 안으로 들어가자 두 번째 인쇄물은 첫 번째 인쇄물만큼 깊습니다.
        p1: 그는 장소의 이름을 쓰고 잠시 멈춘다. {staff}는 창가에서 들어 올려지는 시트의 모서리를 잡습니다.
    relic: 곤충 핀 상자 속 딱정벌레
    relic_desc: 작은 양철 상자에 넣어 둔 딱정벌레 표본.
    points:
      p1: 말라리아 시대에 에세이를 끝까지 읽어보세요
      p2: 도리에게 다친 발목이 궤양으로 변하기 전에 치료하라
      p3: 열병과 이질에 걸린 젊은 사냥꾼 주마트를 구해주세요
    points_fail:
      p1: 열기는 식지 않았고 2월에도 드래프트가 끝나지 않았다. 우편선이 가져간 편지에는 그 내용이 들어 있지 않았으며, 이 지부에는 7월 1일에 린네 협회에는 그러한 종이가 없었습니다.
      p2: 역사에 따르면 상처는 곪았고, 그는 한 달 넘게 목발을 짚고 오두막에 앉아 있었다. 이 가지에서는 도레이 숲의 곤충들을 여전히 그의 하인들만이 잡을 수 있었습니다.
      p3: Jumaat는 역사에 따르면 6월 26일에 사망했으며, 이 지점에서는 7월에 Dorey를 떠난 보트가 그를 없이 떠났습니다.
    shift:
      p1:
        was: 1858년 2월 말라리아가 완화되자마자 월리스는 논문을 작성하고 Ternate에 서명했습니다.
      p2:
        was: 1858년 5월 월리스는 도레이(Dorey)에서 발목을 다쳤습니다. 상처는 궤양으로 변했고 한 달 넘게 그는 발을 딛지 못했습니다.
        now: 상처는 곪지 않았고, 증기선이 항구에 있는 동안에도 그는 예전처럼 매일 숲으로 들어갔다.
      p3:
        was: 1858년 6월 26일, 약 18세의 청년 주마트(Jumaat)가 도레이(Dorey)에서 사망했습니다. 월리스는 그를 자신의 일을 잘 해낸 조용한 소년으로 묘사했습니다.
        now: '{staff}는 열이 내리고 질병이 멈출 때까지 그와 함께 앉아 있었고, 7월 말에 Dorey를 떠났을 때 그도 보트에 탔습니다.'
    vignettes:
      places: '{staff}는 그날의 새들의 라벨을 복사해 각 새들의 옆에 섬을 적어두어 수집가 없이도 스킨 서랍을 읽을 수 있도록 해준다.'
      claim: '{staff}는 비슷하게 생긴 두 섬의 딱정벌레 트레이를 분류하고, 요청하지도 않고 간격을 두고 두 줄로 보관합니다.'
      mail: '{staff}는 선원이 차트를 묶듯이 기름칠된 종이 안에 긴 편지 페이지를 접고 이중 매듭으로 묶습니다.'
  hooke_london:
    name: 실험을 맡은 사람
    place: 런던
    figure: 로버트 훅
    story: 한 독자가 Hooke의 오래된 Micrographia를 꺼내 코르크 마개를 복사하려고 합니다. 그림의 가장자리는 곧 Hooke가 본 적이 없는 깔끔한 벌집 모양으로 변합니다. 같은 방에는 강의와 시연이 뭉쳐져 있습니다. 1년 뒤에 문을 여는 사람은 빈 페이지에서 빠진 페이지를 말해야 할 것이다.
    story_prose:
      opening:
        - 1703년 런던. Hooke의 Micrographia에 나오는 코르크의 세포는 벌집처럼 보이지만 가장자리는 고르지 않습니다. 판화를 추적하는 독자는 계속해서 그 틈을 메우고 싶어 한다.
        - 역사상 Waller는 일부 강의를 출판했고 다른 논문은 나중에 편집자를 기다렸습니다. 이 지점에서는 누군가가 습기가 많은 방에서 접시를 추적하고 있고 다른 누군가는 묶음을 옮기러 옵니다.
        - 이번 여행에는 강의를 함께 관리하고 다른 묶음의 목록을 정리할 수 있는 사람이 필요합니다. 그림을 읽고 독자가 줄의 끊김을 보도록 도울 수 있는 사람을 위한 작업도 있습니다.
      points:
        p1: 논문을 옮겨야 할 때 {staff}는 강의 내용을 순서대로 확인하고 말린 시트를 묶음으로 돌려보냅니다. 묶음이 이동되었지만 이전 덮개가 여전히 위에 있습니다. {staff}는 코드를 조여 돌출된 모서리를 방지합니다.
        p2: '{staff}는 나머지 번들의 제목을 나열하고 문서와 다시 확인합니다. 카탈로그는 상자가 열리자마자 보이는 곳으로 이동합니다. 마지막 줄은 아직 젖어 있으므로 {staff}는 뚜껑을 손가락 너비만큼 열어 둡니다.'
        p3: '{staff}는 판화 옆에 트레이싱을 놓고 Hooke에게 선을 어디에서 끊어야 하는지 묻습니다. Hooke의 손가락이 두 인물 사이에서 멈춥니다. 두 선이 절대 만나지 않는 곳에는 표시되지 않은 종이가 계속 표시됩니다.'
      outcomes:
        all: 2년 후 강의가 인쇄되었고, 빠진 논문에도 찾아볼 수 있는 제목이 있었습니다. 나중에 누군가가 상자를 열어 얇은 목록을 먼저 들어올렸다.
        p2: 출판되지 않은 기록을 찾는 다음 사람이 그 묶음의 이름을 지을 수 있습니다. 뚜껑을 위로 올리면 카탈로그가 맨 위에 올려져 있었습니다.
        p3: 독자가 추적으로 돌아왔습니다. 손가락이 한 칸을 돌다가 그 틈새에서 멈췄다.
        p1: Waller는 결국 강의를 받았습니다. 표지 아래에는 이전 순서대로 놓여 있습니다.
      none: 뚜껑이 내려졌고, 나무에 종이가 부딪히는 소리만 들렸다. 아직 끝나지 않은 흔적이 창가에 남아 있었습니다.
      not_admitted: '{staff}는 강의가 있는 방에 들어가지 않았습니다. 문 너머로 약간의 빛이 들어와서 가슴 한쪽이 보였다.'
      desync: 이동하면서 강의가 무너졌습니다. {staff}가 리콜되었을 때 코드는 여전히 테이블 위에 평평하게 놓여 있었습니다.
      excerpts:
        p2: 카탈로그는 상자가 열리자마자 보이는 곳으로 이동합니다. 마지막 줄은 아직 젖어 있으므로 {staff}는 뚜껑을 손가락 너비만큼 열어 둡니다.
        p3: Hooke의 손가락이 두 인물 사이에서 멈춥니다. 두 선이 절대 만나지 않는 곳에는 표시되지 않은 종이가 계속 표시됩니다.
        p1: 묶음이 이동되었지만 이전 덮개가 여전히 위에 있습니다. {staff}는 코드를 조여 돌출된 모서리를 방지합니다.
    relic: 벼룩의 그림
    relic_desc: 『현미경 도해』에 실린 접이식 벼룩 판화의 사본.
    points:
      p1: 묶음이 이동될 때 강의를 함께 보관하면 Waller가 자신의 에디션을 위해 계속 모아둘 수 있습니다.
      p2: 나중에 편집자가 찾을 수 있도록 충분한 세부 정보를 포함하여 강의 외부에 번들 목록을 제출하세요.
      p3: Hooke에게 독자가 있는 동안 추적한 내용을 보여주고 어떤 줄을 열어 두어야 하는지 물어보세요.
    points_fail:
      p1: 강의 한 묶음은 느슨한 서류와 함께 제거됩니다. Waller는 더 이상 컬렉션을 수집할 수 없으며 사무실에서는 해당 직원을 소환합니다.
      p2: 다음 편집자는 인쇄된 내용을 알 수 있습니다. 그 목록의 어떤 것도 다른 곳의 논문을 가리키지 않습니다.
      p3: 추적은 책에 남아 있습니다. 독자는 이미 줄을 채웠고 그것이 어디에 속하는지 묻지 않을 것입니다.
    shift:
      p1:
        was: Hooke는 1703년에 사망했습니다. Richard Waller는 1705년에 출판된 사후 작품 모음집을 준비했습니다.
      p2:
        was: Waller의 책에는 일부 논문이 보존되어 있습니다. Hooke의 일기와 기타 작품의 일부는 나중에 다른 편집자를 통해 게재되었습니다.
        now: 두 번째 목록은 가슴에 들어갑니다. 인쇄되지 않은 데모를 찾는 사람은 이름이 있는 번들을 요청하는 것으로 시작할 수 있습니다.
      p3:
        was: Micrographia Hooke는 코르크의 구멍을 벌집 모양에 비유하고 그 모양이 불규칙하다는 점을 지적했습니다.
        now: '{staff}는 기존 플레이트 옆에 트레이싱을 설정합니다. Hooke가 복사된 패턴이 플레이트와 더 이상 일치하지 않는 위치를 가리킨 후 판독기는 두 줄을 열어 둡니다.'
    vignettes:
      edge: 판독기는 기공 주위의 두 선을 따라가다가 판에 없는 세 번째 선과 연결합니다. {staff}는 창에 대한 추적을 유지합니다. 발명된 선은 시트에서 가장 직선입니다.
      analogy: '{staff}는 독자에게 페이지 상단에 그린 빗에 맞지 않는 셀을 찾도록 요청합니다. 곧 그들은 둘 다 같은 비뚤어진 가장자리를 가리키고 있습니다.'
      plate: 독자가 또 다른 접기를 펼치면 벼룩 한 마리가 거의 책상 전체를 차지합니다. {staff}는 리더가 잉크를 방해하지 않는 곳으로 이동시키는 동안 한쪽 모서리를 아래로 유지합니다.
  leavitt_cambridge_ma:
    name: 별을 재는 하나의 법칙
    place: 매사추세츠 주 케임브리지
    figure: 헨리에타 리빗
    story: 하버드의 1912년 회보에는 소마젤란운의 변광성 25개가 기간 순서대로 나열되어 있습니다. Leavitt는 가장 밝은 판독값과 가장 희미한 판독값을 별도로 표시했습니다. 두 플롯 모두에서 주기를 반복하는 데 더 오랜 시간이 걸리는 별이 더 밝았습니다.
    story_prose:
      opening:
        - 1912년 매사추세츠 주 케임브리지. 리비트는 소마젤란 은하에 25개의 변수를 기간별로 순서대로 배치하고 가장 밝은 부분과 가장 어두운 부분의 판독값을 표시했습니다. 두 그래프 모두 주기가 길수록 별이 더 밝아집니다.
        - 역사상 이 테이블은 Harvard Observatory 회보에 등장했습니다. 나중에 연구자들은 첫 번째 보정을 위해 은하수의 세페이드를 사용했습니다. 이 지점에서는 누군가가 계속해서 번호판을 확인하고 관측 시간을 요청하면서 스타 후보 목록을 보낼 수 있습니다.
        - 이 여행에는 희미한 별을 유리에 맞출 수 있는 사람과 다음 관측을 위한 근거를 제시할 수 있는 사람이 필요합니다.
      points:
        p1: 인쇄하기 전에 {staff}는 유리판에 대한 희미한 관찰을 확인합니다. 사라진 별이 나타나면 Leavitt는 그것을 테이블의 제자리에 다시 놓습니다. 눈금자가 마지막 행에서 이동합니다. 유리를 통해 작은 점이 여전히 남아 있습니다.
        p2: '{staff}는 시간 관측 애플리케이션에 남은 보정 문제를 설명하고 후보 별 목록을 첨부합니다. 측정값이 도착하면 Leavitt는 두 시트를 함께 가져옵니다. 그녀의 연필은 솔기를 가로질러 같은 별에서 멈춘다.'
      outcomes:
        all: 그 표는 인쇄물로 나왔고 더 많은 관찰 결과가 결국 책상에 도달했습니다. Leavitt는 봉투를 열고 이전 플롯 옆에 새로운 판독값을 놓았습니다.
        p2: Leavitt는 나중에 동료들과 함께 측정값을 확인했습니다. 두 세트의 판독값은 같은 별 아래에 연필 표시로 나란히 놓여 있습니다.
        p1: 인쇄된 원형이 테이블 위에 펼쳐져 있었습니다. 두 플롯의 점은 여전히 동일한 경사선을 따라갔습니다.
      none: 접시는 다시 상자로 들어갔습니다. 맨 위가 가장자리로 미끄러져 빛에 모서리가 남았습니다.
      not_admitted: '{staff}는 번호판을 확인하는 방에 들어가지 않았습니다. 문 안쪽으로 상자가 지나가자 유리창이 한쪽 구석에서 번쩍였다.'
      desync: 테이블이 들어갈 때 간격은 여전히 존재했습니다. {staff}가 리콜되었을 때 눈금자는 여전히 타의 추종을 불허하는 행을 누르고 있었습니다.
      excerpts:
        p2: 측정값이 도착하면 Leavitt는 두 시트를 함께 가져옵니다. 그녀의 연필은 솔기를 가로질러 같은 별에서 멈춘다.
        p1: 눈금자가 마지막 행에서 이동합니다. 유리를 통해 작은 점이 여전히 남아 있습니다.
    relic: 유리 사진 건판
    relic_desc: 작은 별들로 가득 찬 사진판.
    points:
      p1: 인쇄하기 전에 희미한 별의 측정값을 판과 일치시키고 Leavitt의 25주기 표를 보호하십시오.
      p2: 원형의 해결되지 않은 보정을 사용하여 Leavitt가 다음 단계에 참여할 수 있는 관찰 시간을 확보하세요.
    points_fail:
      p1: 플레이트 참조를 확인할 수 없는 행은 잘라내고 25개 기간의 테이블은 나타나지 않습니다. 사무실에서는 동기화가 중단된 후 해당 직원을 회수합니다.
      p2: 주기와 밝기 관계는 그대로 유지되며 절대 보정은 다른 곳에서 수행됩니다.
    shift:
      p1:
        was: 1912년 3월 3일 Harvard Observatory Circular 173에서는 소마젤란운의 25개 변수에 대한 리비트의 주기를 발표했습니다.
      p2:
        was: 1913년에 첫 번째 보정에서는 은하수의 세페이드를 사용했습니다.
        now: '{staff}는 후보자 목록을 첨부하여 관찰 시간 요청을 제출합니다. Leavitt는 팀이 들어오면 새로운 측정값을 확인할 시간을 갖습니다.'
        who: leavitt_cambridge_ma
        bio: Leavitt는 항성의 밝기에 대한 연구를 계속했으며 거리에 대한 관계를 적용하는 데 참여했습니다. 그녀는 교정에 관해 자신만의 관찰 메모를 남겼습니다.
    vignettes:
      rank: 빈 별 번호는 순서를 끊습니다. 필사자가 플레이트 로그를 검색하는 동안 {staff}는 마침표를 큰 소리로 읽습니다. 점은 숫자를 찾을 때까지 원래 위치에 유지됩니다.
      distance: '{staff}는 두 개의 플롯을 나란히 유지합니다. 필사자가 한 장의 배율을 변경했습니다. 점을 비교하기 전에 축을 다시 복사합니다.'
      period: 필사자는 밝기를 외치고 다음 줄로 손을 뻗습니다. {staff}는 마침표도 복사될 때까지 이전 행 아래에 눈금자를 배치합니다.
    remarks:
      trait_methodical: '{staff}는 플레이트를 슬리브로 되돌리기 전에 번호를 다시 한 번 확인합니다.'
  su_shi_huangzhou:
    name: 동파의 유배 생활
    place: 황주
    figure: 소식
    story: 1079년 까마귀 테라스 시재판 이후 소식은 황주(黃州)로 유배되어 그곳의 동쪽 경사면에 농사를 짓고 이름을 동포(洞波)로 삼았다. 1082년 7월에 그는 손님들과 함께 적벽 아래 강으로 나가서 <적벽의 옛 송가>를 썼다. 10월에 그는 눈당에서 링가오(Lingao) 방향으로 걸어가서 후기 송가(Latter Ode)를 썼습니다. 그는 1084년에 황저우를 떠났다.
    story_prose:
      opening:
        - 원풍(圓峰) 시대의 황주(黃州). 까마귀 테라스 사건 이후 유배된 소식은 마을 동쪽에 땅을 파고 동쪽 경사면인 동포라는 이름을 사용했습니다. 원풍 5년에 그는 적벽에 관해 두 번 글을 썼다. 가을 기록에서 그는 절벽을 오르는 것에 대해 설명했습니다.
        - 역사상 그의 가족은 저축한 돈으로 생활했습니다. Yue와 E 주변에서 유아가 익사한다는 소식을 듣고 그는 이를 중지하도록 요청하는 글을 쓰고 가난한 가족이 자녀를 양육할 수 있도록 옹호했습니다. 이 지부에서는 경사지에서, 페리에서, 그리고 그 가족의 문앞에서 일을 하고 있습니다.
        - 이번 여행에는 땅을 아는 사람과 밤에도 가파른 길을 걸을 수 있는 사람이 필요하다. 또한 신생아를 돌보고 집집마다 참을성 있게 이야기할 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 일꾼들과 함께 경사면을 올라가고 그들이 농업에 대해 알고 있는 지식을 사용하여 화단 사이에 물을 흐르게 합니다. 수확할 때 운반할 여분의 자루가 있습니다. 마지막 자루가 벽에 기대어 오래된 먼지에 줄을 스치고 있습니다. 그 위에는 여전히 동전 묶음이 기둥에 매달려 있습니다.'
        p2: 10월 보름달 밤에 {staff}는 가파른 곳에서 견고한 발판을 찾는 데 도움을 주고 보트로 돌아가는 길에 머물러 있습니다. 그림이 내려오자 {staff}는 램프를 물 쪽으로 돌립니다. 파도가 보드를 치고 불꽃이 떨립니다.
        p3: '{staff}는 그룹과 함께 호별 방문을 하고, 신생아를 돌보고, 그들을 돌볼 사람들과 이야기를 나눕니다. 한 집은 해가 질 때만 문을 닫습니다. 빛줄기 속에서 작은 천 묶음이 휘젓는다.'
      outcomes:
        all: 그해 동부 경사면에는 곡식이 있었고, 적벽애(Red Cliff)에서 젖은 옷이 돌아왔고, 여러 가족이 아이들을 키웠습니다. 밤에는 실내에서 누군가가 작은 이불을 펼쳤습니다.
        p3: 그해 겨울에는 여러 가족이 집에서 아기를 키울 수 있었습니다. 방문객이 뒤로 물러나자 누군가 램프를 안쪽으로 가까이 옮기는 소리가 들렸습니다.
        p1: 수확 후 동전 묶음은 몇 달 더 오래 지속되었습니다. 새 자루는 벽에 기대어 있었고, 천 모서리에는 흙이 아직 남아 있었습니다.
        p2: 두 번째 방문 이후, 허세는 랩소디로 발전했습니다. 열려 있는 페이지에서 브러시가 일시 중지된 부분의 잉크가 가장 어둡습니다.
      none: 나룻배는 조용해졌고, 감겨진 밧줄은 여전히 뱃머리에 놓여 있었다. 누군가의 발치에 등불이 마지막 빛을 비춰주었다.
      not_admitted: '{staff}는 황저우에서 자리를 찾지 못했습니다. 나룻배의 밧줄 고리가 안개 속에서 희미해졌습니다.'
      desync: Red Cliff 아래 구간에서 문제가 발생했습니다. 리콜 직전 {staff}의 손에 달린 램프는 건웨일 아래 물만 비췄습니다.
      excerpts:
        p3: 한 집은 해가 질 때만 문을 닫습니다. 빛줄기 속에서 작은 천 묶음이 휘젓는다.
        p1: 마지막 자루가 벽에 기대어 오래된 먼지에 줄을 스치고 있습니다. 그 위에는 여전히 동전 묶음이 기둥에 매달려 있습니다.
        p2: 그림이 내려오자 {staff}는 램프를 물 쪽으로 돌립니다. 파도가 보드를 치고 불꽃이 떨립니다.
    relic: 밀짚 망토
    relic_desc: 농부가 비탈길에서 입었던 투박한 비옷.
    points:
      p1: 그의 가족을 도와 동쪽 경사면의 황무지에서 수확물을 가져오고 저축한 돈이 고갈되는 날을 이겨내세요
      p2: 열째 달 보름달 밤에 그를 강 위 절벽에 지켜서 배로 내려오도록 하라
      p3: 물동이에 빠져 죽을 뻔한 마을의 갓 태어난 아이들을 구해주세요
    points_fail:
      p1: 이 가지에는 가을 추수 때 동쪽 경사면에 여분의 손이 없었고 들보에 달린 동전 끈이 하나씩 줄어들었습니다.
      p2: 그날 밤 그는 절벽에서 발을 잃었고 이 지점에서는 배로 돌아올 수 없었다.
      p3: 이 지부에는 마을의 유역이 그대로 남아 있었고 {staff}는 그 아이를 키우기 위해 한 가족도 이사하지 않았습니다.
    shift:
      p1:
        was: 1081년에 소식는 마을 동쪽 경사면에 착공하여 하루에 150달러의 현금을 가구에 공급했습니다.
        now: 그해 가을 동쪽 경사면에는 곡물이 몇 덩이 더 있었고, 연말이 되어도 들보에는 동전 묶음이 여전히 남아 있었습니다.
      p2:
        was: 1082년 10월 보름날 소식은 부서진 적벽 제방을 혼자 올라갔다가 배로 돌아왔고, 나중에 적벽 제2송을 지었다.
      p3:
        was: 그는 Yue와 E 근처에서 유아가 익사했다는 소식을 듣고 Ezhou 지사에게 법으로 금지 해달라고 편지를 보냈고, Huangzhou에서는 자녀 양육 협회를 제안하고 가난한 가족이 신생아를 키울 수 있도록 부자에게 돈을 요청했습니다.
        now: '{staff}는 사회와 함께 집집마다 돌아다녔고, 그해 겨울에는 몇몇 가족이 막 태어난 아이들을 키웠습니다.'
    vignettes:
      slope: '{staff}는 고용된 인력을 위해 경사면 위로 물을 운반합니다. 해질 무렵, 게임을 준비한 이웃이 밭 가장자리에 익힌 콩 한 그릇을 남겨두고 새로 온 사람이 내일 두 번째 그릇을 먹어도 된다고 말합니다.'
      lamp: '{staff}는 바람을 막아주는 램프를 들고 길가의 돌 위에 앉아 있습니다. 세 번째 시계가 지나고 한참 후에 비탈에서 발소리가 내려옵니다. {staff}는 램프를 경로 쪽으로 돌리고 아무 말도 하지 않습니다.'
      ferry: '{staff}는 게임에 참가한 뱃사공이 착지 시 로프를 감는 것을 돕습니다. 고요한 밤에는 절벽 아래 물의 흐름이 느려서 손님들이 늘 반대편을 요구한다고 하더군요.'
  tang_xianzu_linchuan:
    name: 죽음을 넘어선 사랑을 그린 극
    place: 임천
    figure: 탕현조
    story: 탕현조는 모란정의 서문을 1598년 가을로 기록했습니다. 열 번째 장면에서 Du Liniang은 봄에 정원을 방문하고 잠이 들었고 꿈에서 청년을 만났습니다.
    story_prose:
      opening:
        - Linchuan, 1598년 가을. 탕현조는 그의 서문을 The Peony Pavilion으로 날짜를 정했습니다. 극중 두리니앙은 정원을 거닐다가 젊은 선비의 꿈을 꾸며 잠이 든다.
        - 역사상, 가사는 나중에 노래하기 쉽게 변경되었습니다. Tang은 Yihuang 플레이어들에게 자신의 텍스트를 사용하도록 요청하는 편지를 보냈습니다. 이 부분에는 리허설 시 변경된 시트와 배우들이 계속 놓치는 단서가 있습니다.
        - 이 여행에는 누락된 단어를 찾아내고 단서가 누락된 시기를 들을 수 있는 사람이 필요합니다. 또한 페이지의 텍스트가 무대 위의 목소리와 어떻게 만나는지 아는 사람이 필요합니다.
      points:
        p1: '{staff}는 리허설 시트를 Tang이 체크한 텍스트와 비교하고 누락된 단어에 맞춰 노래를 따라가며 Yihuang 극단의 전체 버전을 복사합니다. 앞에 있는 누군가가 같은 페이지의 사본을 열고 귀를 기울여 그 줄을 따라갑니다. 큐에 대기하고 있던 배우가 한 발을 들어올린다.'
      outcomes:
        all: 그들은 체크된 텍스트의 장면을 계속해서 연습했습니다. 날개에서 기다리고 있는 배우는 큐 옆에 접힌 모서리가 있는 시트를 들고 있었습니다.
        p1: 그들은 체크된 텍스트의 장면을 계속해서 연습했습니다. 날개에서 기다리고 있는 배우는 큐 옆에 접힌 모서리가 있는 시트를 들고 있었습니다.
      none: 리허설 페이지가 넘어갑니다. 무대 옆에는 다음 목소리가 들어갈 부분이 몇 단어 빠진 시트를 여전히 들고 있는 사람이 있습니다.
      not_admitted: '{staff}가 리허설에 참여하지 않았습니다. 벽 안쪽에서 목소리가 들려왔고, 바깥에는 옮겨진 의자만 보였다.'
      excerpts:
        p1: 앞에 있는 누군가가 같은 페이지의 사본을 열고 귀를 기울여 그 줄을 따라갑니다. 큐에 대기하고 있던 배우가 한 발을 들어올린다.
