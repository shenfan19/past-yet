        p4:
          class_medical: 12월 12일 오후, 베르메르는 작업실에서 내려와 계단 중간쯤에서 손을 벽에 대고 얼굴이 갑자기 회색이 된 채 멈췄습니다. 약을 아는 {staff}는 그를 잠자리에 들게 도와주고, 그의 옆에 앉아 맥박을 재며, 밤에 그를 두 번 깨워 술을 마시고, 다음날 내내 지켜본다. 하루 반이 지나갑니다. 셋째 날 아침, 베르메르는 혼자서 계단을 올라가 작업실의 셔터를 열자 빛이 들어와 이젤 앞 맨바닥에 떨어진다.
