        now: 그가 끌려가기 전, 마을에 있는 한 집의 침대 밑으로 몇 권의 책 상자가 옮겨졌습니다. 14년 후 그가 집에 돌아왔을 때, 그 가족은 상자를 들고 나갔습니다.
        who: ahmed_baba_timbuktu
        bio: 아마드 바바는 1608년에 팀북투의 집으로 돌아왔고 그 마을의 한 가족이 아직도 보관하고 있는 자신의 책이 담긴 상자 몇 개를 발견했습니다. 그는 말년에 그들로부터 가르쳤습니다.
