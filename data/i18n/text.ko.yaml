        now: '{staff}는 그와 함께 돌아오면서 매일 밤 그의 힘을 지켜보았습니다. 그는 살아서 서부 진영으로 걸어 들어갔고, 원정대가 측정한 결과를 지켜보기 위해 살았습니다.'
        who: wegener_greenland
        bio: 베게너는 1930년 11월 빙상 한가운데에서 살아 돌아왔습니다. 그는 더 오랜 세월을 살았으며 탐험대의 관찰이 성과를 거두는 것을 보았습니다.
    shift_all: 이 타임라인에서는 그해 가을 Eismitte를 드나들었던 모든 사람들이 살아서 해안으로 돌아왔습니다.
    vignettes:
      names: 가상의 서기는 단 하나의 성으로만 원정대를 나열합니다. 당신은 누가 짐을 맡겼는지 묻습니다. 그들은 가장 잘 알려진 이름만 기록하는 대신 관련된 다른 사람들을 위해 줄을 남깁니다.
      count: 점원은 첫 번째 계산을 배달된 수량처럼 보이게 했습니다. 당신은 그들에게 각 그림이 어느 역에서 왔는지 표시하도록 요청합니다. 두 합계는 더 이상 동일한 제목 아래에 위치하지 않습니다.
      note: 점원이 빈 장부를 묶는 동안 당신은 목적지를 두 번째 전표에 복사합니다. 다음 사람은 항목이 어느 스테이션에 관련되어 있는지 알 수 있습니다.
  tupaia_tahiti:
    name: 항해사의 해도
    place: 인데버호 선상
    figure: 투파이아
    story: 라이아테아(Raiatea) 출신의 항해사인 투파이아(투파이아)는 1769년 인데버호에 합류하여 그가 알고 있는 섬의 지도를 그리는 데 도움을 주었습니다. 배는 1770년 6월 현재의 퀸즈랜드에서 암초에 부딪혔습니다. Banks는 수리 중에 투파이아의 괴혈병을 기록하고 그해 말 Batavia에서 Taiata와 투파이아의 사망을 보고했습니다.
    story_prose:
      opening:
        - 인데버호호에서 투파이아는 배가 공격할 때 자신이 알고 있는 섬 이름을 확인하고 있습니다. 묶음이 테이블 모서리에서 미끄러져 떨어지고 경비원이 도움을 요청합니다. 배가 암초 위에서 빠르다는 것을 알았을 때 여전히 어두웠습니다.
        - 인데버(인데버호)호는 1770년에 현재의 퀸즈랜드(Queensland) 앞바다에서 암초에 부딪혔습니다. 승무원은 다시 해상으로 돌아와 수리했습니다. 투파이아는 그 기간 동안 병에 걸렸고 Banks는 몇 달 후 Batavia에서 Taiata와 투파이아의 사망 소식을 기록했습니다. 지부는 배를 보존하고, 투파이아에 신선한 음식을 가져오고, 아플 때 두 시간을 함께 보낼 수 있습니다.
        - 승무원이 방송국을 유지하는 데 도움을 줄 수 있는 사람을 보내십시오. 수리하는 동안 누군가는 투파이아에게 무엇을 먹을 수 있는지 물어봐야 합니다. 바타비아에서는 파티가 침대 옆에 방문할 시간을 정할 시간이 필요합니다.
      points:
        p1: 화물을 아래에서 올리는 통로를 상자가 막고 있었다. 펌프를 교대할 사람이 들어갈 자리를 내고, 상자를 나르는 선원들이 지날 길을 열었다. 반대편 선원들은 함께 당기라는 신호가 올 때까지 밧줄 곁에서 기다렸다. 배가 움직이자 사람들은 먼저 펌프 곁에 있던 사람이 아직 발을 딛고 서 있는지 물었다.
        p2: 신선한 식품은 먼저 수리업체로 보내집니다. 투파이아는 이름이 불리는 것을 듣고 얼마나 오래 기다려야하는지 묻습니다. 아이가 먹고 싶은 것을 선택할 수 있는 부분을 가져오고 다음 그룹을 위해 남은 것을 기록합니다. 접시가 그에게 닿자, 따로 챙겨 둔 것 가운데 먹을 것을 먼저 고를 수 있었다.
        p3: 바타비아 병실에는 아픈 사람들이 많고 같은 간병인들이 계속 호출을 받고 있습니다. 투파이아는 누군가에게 Taiata가 그를 볼 수 있는지 알아달라고 요청합니다. 질문을 전달하고 의자를 침대로 옮기기 전에 두 사람이 동의할 때까지 기다립니다. 당신이 떠날 때도 두 사람은 여전히 서로의 목소리를 들을 수 있었다.
      outcomes:
        all: 배는 역사상처럼 무료로 제공됩니다. 또한 지부는 투파이아의 음식 몫과 침상 방문 기록도 기록합니다. 두 사람의 사망 소식은 기록에 남아 있습니다.
        p1: 인데버는 무료로 제공됩니다. 수리 당사자는 해야 할 일이 더 많아집니다. 나중에 준비해야 할 사항이 남아 있습니다.
        p2: 투파이아는 그가 선택한 부분을 받습니다. 기록의 이 부분은 그에게 접시를 가져오면서 중단됩니다.
        p3: 두 사람은 잠시 이야기를 나눌 만큼 가까워졌다. Batavia에서의 죽음은 여전히 이어지고 있습니다.
      none: 사람들은 여전히 갑판에서 다음 주문을 기다리고 있습니다. 새로운 몫은 따로 정해지지 않았고, 나중에 방문할 일정도 정해지지 않았습니다.
      not_admitted: 승무원은 배정되지 않은 사람들에게 펌프로 역을 청소하도록 요청합니다. 반대편에서 누군가가 젖은 종이뭉치를 집는 것을 볼 수 있습니다.
      desync: 인데버호는 새벽에도 여전히 빠릅니다. 역사적 회복은 동기화되지 않고 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 배가 움직이자 사람들은 먼저 펌프 곁에 있던 사람이 아직 발을 딛고 서 있는지 물었다.
        p2: 접시가 그에게 닿자, 따로 챙겨 둔 것 가운데 먹을 것을 먼저 고를 수 있었다.
        p3: 당신이 떠날 때도 두 사람은 여전히 서로의 목소리를 들을 수 있었다.
    relic: 섬의 스케치
    relic_desc: 작은 섬 모양과 이름이 새겨진 잉크 앤 워시 시트입니다.
    points:
      p1: 배가 암초에 부딪히는 밤, 배의 무게를 가볍게 하고 펌프를 작동시켜 인데버호를 물에 띄우세요.
      p2: 수리반이 공급되는 동안 투파이아를 위한 신선한 음식을 따로 준비하고, 무엇을 먹을지 선택하게 하세요.
      p3: Batavia에서 투파이아가 Taiata와 함께 앉아 아플 때 근처에 누구를 원하는지 물어볼 시간을 만드세요.
    points_fail:
      p1: 새벽에도 배는 화물창 위에 물이 있는 상태로 여전히 암초 위에서 빠르게 움직이고 있습니다. 지점은 역사와 어긋나고, 사무실은 그날 직원을 소환한다.
      p2: 새로운 물품은 수리반에 먼저 전달됩니다. 투파이아는 공유를 기다려야 합니다.
      p3: 주변 사람들은 다른 병상으로 호출됩니다. 투파이아가 요청한 방문은 기다려야 합니다.
    shift:
      p1:
        was: '1770년 6월 10일~11일: 인데버호는 현재의 인데버 산호초에 부딪혔습니다. 승무원은 총 6개, 밸러스트, 물, 부패한 상점을 배 밖으로 던졌고 그녀는 밀물에 떠내려갔습니다.'
      p2:
        was: '1770년 6월 16일: Banks는 투파이아가 괴혈병이 심하고 잇몸이 사라지고 다리에 검푸른 반점이 있으며 기내 치료법이 도움이 되지 않았다고 썼습니다.'
        now: 이 분기에서는 배가 수리되는 동안 투파이아가 신선한 음식을 나누어 먹습니다. 그는 먼저 뭔가를 잡으러 나가지 않고도 무엇을 먹을지 선택할 수 있습니다.
      p3:
        was: Batavia에서 Banks는 Taiata의 사망 소식과 투파이아의 사망 소식을 받았습니다.
        now: 이 지점에서 {staff}는 투파이아가 Taiata 가까이에 앉을 수 있는 장소를 만듭니다. 두 사람은 머물면서 함께 이야기를 나누는 시간을 가질 수 있는 사람을 선택합니다.
    vignettes:
      pronounce: '{staff}는 게임을 위해 구성된 카피리스트에게 두 번째 섬을 그리기 전에 철자 두 개를 큰 소리로 읽어달라고 요청했고, 대신 이름 옆에 물음표를 붙였습니다.'
      route: '{staff}는 두 표시 사이에 직선을 그리고 그 선을 그리지 않은 채 남겨두기 전에 어느 섬에서 방위각이 주어졌는지 묻습니다.'
      room: '{staff}는 시트의 말아진 모서리를 눌러 이전 이름을 가리지 않고 새 이름을 쓸 수 있도록 합니다.'
  ulugh_beg_samarkand:
    name: 사마르칸트에서 나가는 길
    place: 사마르칸트
    figure: 울루그 베그
    story: 울루그 베그는 사마르칸트에 천문대를 건설하고 1,018개의 별 카탈로그를 감독했습니다. 1449년 가을에 그는 권력을 잃었고 메카로 여행할 수 있는 휴가를 받았습니다. 그는 10월 말 사마르칸트 근처에서 살해됐다. 그의 무덤에 적힌 날짜는 다른 소식통이 제시한 날짜보다 이틀 뒤인 10월 27일이다.
    story_prose:
      opening:
        - 사마르칸트에서는 도로용 묶음이 새로 쌓인 별표 옆에 놓여 있습니다. 울루그 베그가 권력을 양보했고 파티는 밖에서 기다리고 있습니다. 누군가 도시를 벗어나 첫날밤을 어디서 보낼 것인지 묻습니다.
        - 울루그 베그는 사마르칸트에서 천문학 작업에 참여했습니다. 1449년에 그는 도시를 떠난 후 살해당했습니다. 여기에서 그가 첫 번째 다리에 머무를 곳을 확인하고 동행을 원하는지 물어볼 수 있습니다.
        - 일행과 대화할 수 있고 여행자를 돌볼 수 있는 사람을 보내십시오. 울루그 베그에게 어디에 머물고 싶은지 물어보고, 그 가족이 그를 받을 수 있는지 확인하십시오.
      points:
        p1: 울루그 베그는 누군가가 이미 짐을 요청했고 그날 밤 어디에 앉을 수 있을지 모른다고 말했습니다. 당신은 동료에게 더 멀리 있는 가족이 문을 열어 둘 수 있다고 말한 다음 울루그 베그에게 당신과 함께 가고 싶은지 물어보십시오. 그는 별표를 누군가에게 맡기고 가벼운 가방을 챙긴다. 도착하자 그는 자신을 데려다준 사람에게도 앉으라고 권했다.
      outcomes:
        all: 울루그 베그는 도시를 떠난 후 머물 장소에 도착합니다. 이 지점에는 그날 밤 그가 안전하다는 소식이 있습니다.
        p1: 누군가가 그가 머물기로 합의한 장소로 그를 동행합니다. 별 테이블은 도시에 남아 있습니다.
      none: 그는 이미 짐을 기다리고 있는 사람들과 함께 떠난다. 다음 소식은 그가 도시 밖에서 살해되었다는 것입니다.
      not_admitted: 방문자는 파티에 입장할 수 없습니다. 테이블은 내부에 남아 있고 외부 사람들은 짐을 가지고 떠납니다.
      excerpts:
        p1: 도착하자 그는 자신을 데려다준 사람에게도 앉으라고 권했다.
    relic: 두 가지 소스가 있는 전표
    relic_desc: 오래된 별 위치와 새로운 관측에 대해 표시된 두 줄.
    points:
      p1: 울루그 베그가 권력을 포기한 후, 그가 여행의 첫 번째 구간에 머물 수 있는 장소를 마련하고 그와 함께 가겠다고 제안합니다.
    points_fail:
      p1: 그는 이미 그를 기다리고 있던 회사와 함께 떠난다. 당신이 듣는 다음 소식은 그가 도시 근처에서 살해되었다는 것입니다.
    shift:
      p1:
        was: 그의 통치를 포기한 후, 울루그 베그는 사마르칸트에서 출발했으나 1449년 10월 말 도시 근처에서 살해되었습니다.
        now: 이 지점에서 {staff}는 울루그 베그와 함께 그가 머물기로 합의한 장소로 이동합니다. 그는 사마르칸트를 떠나는 여정에서 살아남습니다.
        who: ulugh_beg_samarkand
        bio: 이 연대표에서 울루그 베그는 1449년 가을에 사마르칸트에서 안전하게 떠나 계속 살았습니다.
    vignettes:
      source: '{staff}는 복사기의 시트에 좁은 열 머리글 원점을 추가하여 기존 테이블에서 가져온 위치와 오늘 밤 측정한 위치가 같은 선에 위치하지 않도록 합니다.'
      arc: '{staff}는 호의 트렌치 곡선을 따라 코드를 깔고 석공과 함께 끝까지 걸어가며 곡선이 사실인지 확인합니다.'
      hold: '{staff}는 화로와 보드를 들고 호 옆에 앉아 별이 벽 아래로 가라앉을 때까지 호출될 때마다 판독값을 기록합니다.'
  darwin_galapagos:
    name: 섬과 생명의 다양성
    place: 갈라파고스 제도
    figure: 찰스 다윈
    story: 다윈은 1835년 9월부터 10월까지 비글호를 타고 갈라파고스를 방문했습니다. 찰스 섬의 부지사 로슨은 그에게 거북이가 섬마다 다르다고 말했습니다. 다윈은 당시 자신이 충분한 관심을 기울이지 않았으며 이미 두 섬의 컬렉션을 혼합했다고 나중에 썼습니다. 10월 8일부터 17일까지 그와 바이노와 그들의 하인들은 배가 물을 찾으러 가는 동안 제임스 섬에 진을 쳤고 텐트 근처에는 작은 샘만 있었습니다. 그의 새 노트는 앵무새 표본을 특정 섬과 연관시킵니다.
    story_prose:
      opening:
        - 비글호는 다윈의 일행을 해변에 떨어뜨리고 다른 곳으로 바다로 떠났습니다. 제임스 아일랜드의 텐트가 막 세워졌습니다. 캠프 옆의 작은 샘은 천천히 흐르고, 같은 종이에 두 개의 새 라벨이 적혀 있습니다.
        - 1835년에 주지사 대행 로슨은 다윈에게 섬의 거북이를 구별할 수 있다고 말했습니다. 다윈은 나중에 자신이 충분히 주의를 기울이지 않았다고 썼습니다. 제임스 아일랜드 일행은 물이 거의 없는 상태에서 배를 기다렸다. 구별을 더 일찍 유지하고 해안 파티가 수집을 완료하도록 도울 수 있습니다.
        - 표본과 라벨을 보는 사람은 로슨과 다윈의 대화를 들을 수 있습니다. 제임스 섬의 경우 물과 캠프 용품으로 해안 파티를 도울 수 있는 사람을 보내십시오.
      points:
        p1: 플라스크는 거의 비어 있고 두 사람은 여전히 봄까지 기다리고 있습니다. 물이 얼마나 남았는지, 물이 필요한 사람이 몇 명인지 세어본 다음, 가이드에게 앞서 물을 가져온 남자들과 이야기를 나눠 달라고 부탁하세요. 물이 도착하면 바이노는 남은 패킷을 텐트에서 가져오도록 요청합니다. 배가 만으로 돌아오자, 마지막 꾸러미들이 빈 물통 곁에 놓여 있었다.
        p2: 로슨은 거북이 등껍질 모양으로 섬을 알 수 있다고 말합니다. 다윈은 지명 하나를 묻고 계속 걸어가려 한다. 당신은 두 개의 표본 패킷을 열고 그가 그것을 수집한 곳을 다시 읽어봅니다. 확인할 수 없는 곳은 남겨두고 확인하고, 나중에 표본은 별도의 포장지에 담아 보내준다. 첫 꾸러미를 새 끈으로 묶었다. 섬 이름은 겉에 적어 두었다.
      outcomes:
        all: 이름과 별도의 패킷을 서로 확인할 수 있습니다. 제임스 아일랜드 일행도 수집을 마치고 배로 돌아옵니다.
        p1: 해안 파티는 배가 돌아와 표본을 실을 때까지 지속됩니다. 초기 섬 라벨 중 일부는 여전히 불확실합니다.
        p2: 섬 기록의 일부는 별도로 보관됩니다. 캠프는 나중에 실패하고 여행은 찰스 아일랜드에서 이름을 확인하는 이 순간을 유지합니다.
      none: 샘 옆에 있는 플라스크는 여전히 캠프에 있는 유일한 것이며, 이전 패킷에는 여전히 이름이 불분명합니다.
      not_admitted: 방문자가 해안 목록에 없습니다. 패킷이 이미 보트에 있고 데크에서 라벨을 읽을 수 없습니다.
      desync: 제임스 아일랜드 수집이 완료되기 전에 캠프에 물이 부족합니다. 사무실은 여행자를 회상합니다.
      excerpts:
        p1: 배가 만으로 돌아오자, 마지막 꾸러미들이 빈 물통 곁에 놓여 있었다.
        p2: 첫 꾸러미를 새 끈으로 묶었다. 섬 이름은 겉에 적어 두었다.
    relic: 핀치 깃털
    relic_desc: 섬에서 나는 작은 갈색 깃털.
    points:
      p1: 캠프에 불쌍한 작은 샘이 하나 있는 제임스 섬에서는 배가 돌아올 때까지 해안 파티를 계속하고 섬의 수집이 완료되는 것을 지켜보세요.
      p2: 로슨이 거북이가 섬마다 다르다고 말했을 때, 다윈이 거기에 주목하게 하고 각 섬의 새들에게 라벨을 붙이고 따로 포장해 두십시오.
    points_fail:
      p1: 해안 파티에 물이 부족하고 제임스 아일랜드 수집이 이루어지지 않습니다. 이 분기는 역사와의 동기화를 잃었고 사무실에서는 그날 그 직원을 귀환시킵니다.
      p2: 역사에서와 마찬가지로 다윈은 로슨에게 거의 관심을 기울이지 않습니다. 채텀섬과 찰스섬의 컬렉션은 이미 혼합되어 있으며 대부분의 핀치새에는 섬이 없습니다.
    shift:
      p1:
        was: '1835년 10월 8일부터 17일까지: 다윈, 바이노와 그들의 하인들은 비글호가 물을 찾으러 가는 동안 텐트와 식량을 가지고 제임스 섬에 진을 쳤습니다. 캠프 근처에는 조그마한 샘밖에 없었습니다.'
      p2:
        was: '1835년 9월 말: 찰스 섬의 부지사 로슨은 다윈에게 각 섬의 거북이를 구분할 수 있다고 말했습니다. 다윈은 나중에 자신이 충분한 주의를 기울이지 않았으며 이미 두 섬의 컬렉션을 혼합했으며 대부분의 핀치새를 혼합했다고 썼습니다.'
        now: 그는 그날 로슨의 말을 그대로 받아들여 각 섬의 새들을 라벨을 붙여 포장하여 영국으로 가져왔습니다.
        who: darwin_galapagos
        bio: 이 연대표에서 다윈은 갈라파고스에서 로슨의 말을 듣고 핀치새와 흉내지빠귀를 섬별로 수집하고 분류한 후 영국으로 가져갔습니다.
    vignettes:
      two_tags: 태그 하나에는 '섬'이라는 단어만 적혀 있습니다. 도우미가 별도의 착륙 메모를 찾을 때까지 따로 보관해 두세요. 트레이를 치운 후에도 두 개의 표본은 서로 떨어져 있습니다.
      differences: 도우미는 비슷하게 생긴 두 마리의 새를 가리키며 두 마리 모두에 대해 하나의 항목을 원합니다. 당신은 각각 어느 섬에서 왔는지 묻습니다. 그들은 나중에 다시 유사점을 고려할 수 있도록 책에 두 라벨을 모두 남겨 둡니다.
      drawer: 도우미가 이름을 다시 읽어줄 때까지 트레이 옆에 종이 라벨을 보관하십시오. 서랍을 닫으면 메모는 원래 있던 자리에 그대로 유지됩니다.
  finlay_havana:
    name: 모기와 황열병
    place: 아바나
    figure: 카를로스 핀라이
    story: 카를로스 핀라이는 1881년 하바나에서 황열병 전파에 대한 모기 가설을 제시했습니다. 그의 논문 제목은 이를 가설로 나타냅니다.
    story_prose:
      opening:
        - 하바나는 아직도 덥습니다. Finlay는 읽고 싶은 논문을 강연대 옆에 놓고 케이스 노트를 편지 아래에 보관합니다. 누군가가 의제를 작성하기 위해 첫 번째 줄에 옵니다. Finlay는 '가설적으로'라는 단어를 명확하게 말합니다.
        - 1881년 8월 14일 핀레이는 하바나 아카데미에서 황열병에 대한 모기 가설을 발표했습니다. 모기에 대한 시의 조치는 훨씬 나중에 이어졌습니다. 이 지부는 읽은 내용을 보존하고 회원들이 기록이 그가 제안한 것을 얼마나 뒷받침하는지 고려하도록 할 수 있습니다.
        - 서류에 능숙한 사람이 학원의 사본을 확인할 수 있습니다. 토론을 조직할 수 있는 사람은 회원들이 이를 검토하고 공공 모기 통제 제안을 시에 제출하도록 주선할 수 있습니다.
      points:
        p1: 점원은 한 페이지가 한 번도 확인되지 않았으며 나머지 페이지를 확인할 수 없다고 말했습니다. 포장지를 Finlay의 목록과 일치시키고 케이스 주변의 접힌 부분에서 누락된 시트를 찾습니다. Finlay는 읽기 사본을 다시 닫습니다. 차례가 되자 서기는 핀라이의 손에 든 종이와 같은 제목을 읽었다.
        p2: 문 가까이에 있는 회원은 낭독이 끝난 후 이미 모자를 가지고 있습니다. 당신은 그에게 한 문장 더 듣고 어떤 기록을 검토하고 싶은지 말해달라고 요청합니다. 그는 앉아서 한 가지 사건에 대해 묻습니다. 또 다른 멤버는 복귀 날짜를 여유 있게 정했다. 핀라이는 해당 서류를 들어 올리고 두 사람이 어느 서류를 말하는지 알아볼 때까지 기다렸다.
        p3: 도시에 대한 카피는 정립된 이론을 부르는 것으로 시작된다. Finlay에게 아직 확인해야 할 질문과 별도로 관찰 내용을 나열하도록 요청합니다. 시 위원회는 공공 모기 통제에 대한 초기 실험에 자금을 지원하는 데 동의합니다. 서기는 도장을 찍기 전에 종이에 ‘가설’이라는 말을 다시 적었다.
      outcomes:
        all: 신문이 심리되고 사건이 두 번째로 읽혀집니다. 공공 모기 통제는 이 분야의 초기에 시작되며, 그 결과는 아직 확인되지 않습니다.
        p1: 아카데미는 논문을 듣고 사본을 제출합니다. 멤버들은 아직 후속 조치 여부를 결정하지 못했다.
        p2: 몇몇 청취자들이 남아서 기록에 대해 질문합니다. 검토 날짜가 메모에 들어갑니다. 시는 아직 조치를 취하지 않았습니다.
        p3: 시재판 제안에 대한 답변을 받았습니다. 보고서에는 이 분기의 이전 작업이 기록됩니다.
      none: 방이 비어 있습니다. 두 번째 토론 날짜를 정한 사람은 아무도 없습니다.
      not_admitted: 안건에 포함된 사람들만 입장할 수 있습니다. 밖에서 직원이 첫 번째 항목을 발표하는 소리가 들립니다.
      desync: 읽는 사본은 조립할 수 없습니다. 아카데미는 8월 14일 핀레이의 논문을 듣지 못했고 사무실은 여행자를 소환했습니다.
      excerpts:
        p1: 차례가 되자 서기는 핀라이의 손에 든 종이와 같은 제목을 읽었다.
        p2: 핀라이는 해당 서류를 들어 올리고 두 사람이 어느 서류를 말하는지 알아볼 때까지 기다렸다.
        p3: 서기는 도장을 찍기 전에 종이에 ‘가설’이라는 말을 다시 적었다.
    relic: 모기의 유리 슬라이드
    relic_desc: 모기 날개가 달린 슬라이드입니다.
    points:
      p1: 발열 시즌 동안 그의 논문과 사건 기록을 안전하게 보관하여 계획대로 8월 14일 아카데미에서 논문을 읽을 수 있도록 하십시오.
      p2: 낭독 후에는 아카데미 회원 몇 명을 설득하여 논문이 조용히 폐기되지 않도록 머물면서 그의 사건을 살펴보도록 하십시오.
      p3: 모기와 사례를 설득력 있는 증거로 제시하여 도시가 몇 년 더 빨리 모기 퇴치를 시작할 수 있도록 도와주세요.
    points_fail:
      p1: 사례 기록은 발열 시즌에 분실되었으며 8월 14일에는 논문이 읽히지 않았습니다. 이 지점은 역사에서 사라졌고 사무실에서는 그 직원을 소환했습니다.
      p2: 홀은 침묵을 지켰고 아무도 단 한 건의 사건을 보여달라고 요청하지 않았습니다. 이 분야에서 그 신문은 역사에서와 마찬가지로 따로 보관되었습니다.
      p3: 그의 증거는 이전처럼 얇았습니다. 이 지점에서 도시는 모기에 대한 조치를 취하기까지 여전히 약 20년을 기다렸고 그때까지 매년 여름에 열이 다시 발생했습니다.
    shift:
      p1:
        was: 1881년 8월 14일 카를로스 핀라이(카를로스 핀라이)는 하바나에 있는 왕립과학원에서 황열병의 가설적 매개체인 모기에 관한 그의 논문을 읽었습니다.
      p2:
        was: 1881년 8월 14일 그의 독서는 침묵으로 가득 차 있었고 그 후 수년 동안 그 생각은 조롱당했습니다.
        now: 그날 저녁 몇몇 회원이 남아서 그의 사건 기록을 보여달라고 요청했습니다.
      p3:
        was: 1881년부터 Finlay는 모기가 황열병을 옮기는 것을 증명하기 위해 거의 20년을 보냈습니다. 1900년에야 미 육군 위원회는 그의 알에서 자란 모기를 사용하여 그가 옳았다는 것을 보여주었습니다.
        now: '{staff}는 증거가 확보될 때까지 모기와 케이스를 나란히 놓도록 도왔습니다. 이 연대표에서 하바나는 몇 년 전부터 모기와 싸우기 시작했고, 열병은 더 빨리 도시를 떠났습니다. Finlay는 자신의 시대를 믿었습니다.'
        who: finlay_havana
        bio: 이 노선에서 핀레이(Finlay)의 모기 아이디어는 1881년부터 몇 년 내에 받아들여졌고, 하바나(Havana)는 1900년 훨씬 이전에 이를 실행에 옮겼습니다.
    vignettes:
      headline: 가상의 편집자는 제목에서 제안을 확실성으로 바꿉니다. 제목을 천천히 다시 읽어보세요. 그들은 증거를 전달하기 전에 가설이라는 단어를 다시 넣었습니다.
      columns: 편집자는 각 줄이 같은 내용을 의미하는 것처럼 메모를 읽습니다. 관찰된 내용과 제안된 내용에 대해 두 개의 열을 규칙으로 정합니다. 문장이 열을 변경합니다.
      place: 논문을 읽은 장소의 이름을 확인하세요. 편집자는 날짜 옆에 날짜를 표시하므로 보고서가 회의를 다른 회의로 바꾸지 않습니다.
  humboldt_chimborazo:
    name: 설선 위의 깊은 틈
    place: 에콰도르 침보라소산
    figure: 알렉산더 폰 훔볼트
    story: 1802년 6월 23일 훔볼트는 Aimé 봉플랑 및 Carlos 몬투파르와 함께 Chimborazo를 등반했습니다. 포터들은 더 이상 가지 않을 것입니다. 세 사람은 코피를 흘리고 구토와 현기증을 느끼며 계속했는데, 정상 아래 깊은 도랑이 그들을 막고 돌아섰습니다.
    story_prose:
      opening:
        - Chimborazo의 설선 위에서 봉플랑는 훔볼트에게 기압계를 건네주어 가방을 꺼냅니다. 몬투파르는 앞이 보이는 곳에 멈춥니다. 구름이 움직일 때까지는 그가 가리키는 협곡의 반대편을 볼 수 없습니다.
        - 1802년 6월 23일 훔볼트의 일행은 Chimborazo에 올라 깊은 협곡에서 돌아섰습니다. 이 분기를 통해 그룹은 계속할 방법을 찾을 수 있습니다. 정상회담 보고는 모두가 내려온 후에만 유효합니다.
        - 고도에서 동료를 돌볼 수 있는 사람을 보내십시오. 사무용 장비를 사용할 수 있더라도 각 등반가에게 계속 가고 싶은지 물어보세요.
      points:
        p1: 누군가가 눈가로 다가갔다가 돌아와서 훔볼트에게 설 곳이 없다고 말했습니다. 다른 사람들이 지형을 살펴보고 모두가 계속할지 여부를 결정할 수 있을 때까지 파티를 안전한 장소에 쉬게 합니다. 훔볼트와 본플란드가 교대로 악기를 들고 다닙니다. 몬투파르는 돌아오는 길에 두 가지를 모두 볼 수 있는 곳에 머물렀습니다. 쉬었던 바위까지 돌아오고 나서야 정상에서 반 쪽 분량으로 적은 기록을 꺼냈다.
      outcomes:
        all: 모든 등반가는 정상에 도달하고 휴식 장소로 돌아갑니다. 보고서에는 그들이 정상 입구 옆에 내려온 시간이 나와 있습니다.
        p1: 일행은 이 가지에서 찾은 길로 올라가고, 오르기 전에 약속한 순서대로 돌아온다.
      none: 일행은 협곡을 보고 돌아섰다. 다른 사람들이 기다리고 있는 곳에서는 실제로 도달한 높이와 그들이 볼 수 있었던 높이가 기록되어 있습니다.
      not_admitted: 일행이 떠났을 때 방문객을 위한 자리가 없었습니다. 아래에는 빈 악기 케이스가 있습니다.
      excerpts:
        p1: 쉬었던 바위까지 돌아오고 나서야 정상에서 반 쪽 분량으로 적은 기록을 꺼냈다.
    relic: 기압계
    relic_desc: 유리에 높이가 표시된 수은 기압계입니다.
    points:
      p1: 6월 23일 깊은 계곡이 길을 가로막기 전에 일행이 고산병을 이겨낼 수 있도록 도우시고, 건너갈 길을 찾아 침보라소 정상까지 무사히 내려 오십시오.
    points_fail:
      p1: 역사상과 마찬가지로 그들은 정상 아래의 협곡으로 되돌아갑니다.
    shift:
      p1:
        was: '1802년 6월 23일: 훔볼트, 봉플랑 및 Carlos 몬투파르는 코피를 흘리고 구토와 현기증을 느끼며 Chimborazo에 올랐으나 정상 아래 깊은 도랑이 그들을 멈추고 돌아섰습니다.'
        now: 그들은 계곡을 건너 침보라소 정상에 선 후 무사히 야영지로 내려왔다.
        who: humboldt_chimborazo
        bio: 이 타임라인에서 훔볼트는 1802년 6월 23일 봉플랑 및 몬투파르와 함께 Chimborazo 정상에 도달하고 안전하게 내려왔습니다.
    vignettes:
      turn: 가상의 독자가 길 끝에 있는 정상을 그렸습니다. 당신은 일기에서 상승에 대한 설명이 어디에서 멈추는지 묻습니다. 그들은 마지막 표시를 경사면 아래로 이동하고 상단은 그대로 둡니다.
      units: 독자는 단위 없이 높이를 복사하려고 합니다. 원래 측정값에 부착된 상태로 유지하고 별도의 최신 변환을 위한 공간을 남겨둡니다.
      names: 독자에게 다른 여행자의 이름을 위해 훔볼트 옆에 공간을 남겨두도록 요청합니다. 메모를 접어도 그 날의 시도에 대한 설명이 계속해서 나열됩니다.
  ibn_khaldun_cairo:
    name: 알렉산드리아 앞바다의 배
    place: 카이로
    figure: 이븐 할둔
    story: 이븐 할둔은 1382년 Sultan Barquq의 초청으로 카이로에 왔습니다. 1384년 술탄은 튀니스의 통치자에게 자신의 가족이 자신을 따라오도록 해달라고 요청했고, 8월 8일 그를 서부에서 온 신인을 위한 고위직인 말리키 법학파의 수석 판사로 임명했고, 도시의 라이벌들은 곧 그를 쫓아내기 위해 노력하기 시작했습니다. 그 해에 그의 아내와 딸들을 태운 배가 알렉산드리아에 침몰했습니다. Muqaddimah에서 그는 역사가들에게 그들이 묘사하는 사회에서 일어날 수 있는 일에 대한 보고서를 테스트하도록 요청합니다.
    story_prose:
      opening:
        - 카이로에서는 점원이 약속과 확인할 이름 목록을 같은 책상에 올려 놓습니다. 이븐 할둔은 밖에서 누가 기다리고 있는지 묻습니다. 그는 튀니스에서 그의 아내와 딸들을 데려오는 배에 대한 소식이 담긴 또 다른 편지를 직접 기다리고 있습니다.
        - 1384년에 이븐 할둔은 카이로의 대판사가 되었습니다. 그의 아내와 딸들을 태운 배는 나중에 알렉산드리아에서 분실되었습니다. 이 여행에서는 약속을 지키고 항구로 가서 배에 탄 사람들이 해안에 도달하도록 도울 수 있습니다.
        - 카이로 직원에게 서류를 확인할 수 있는 사람을 이용하세요. 선원들과 함께 일하고 해안에 있는 사람들을 도울 수 있는 여행자를 알렉산드리아로 일찍 보내십시오.
      points:
        p1: 직원은 그 이름을 다시 복사해야 하며 다른 직원이 그 이름이 누구인지 말할 때까지 기다리고 싶다고 말했습니다. 당신은 그에게 이미 약속된 약속을 읽고 방문객이 말하는 것과 비교해 보라고 요청합니다. 날짜가 표시된 줄에서 소지자는 이븐 할둔의 이름을 읽습니다. 서기는 탁자 가장자리에 둔 임명장을 오늘 발송할 서류 더미에 다시 넣었다.
        p2: 항구에 있던 누군가가 사람을 봤다고 전화를 하고 물 속에서는 그 사람을 보지 못합니다. 당신은 지켜보는 사람들에게 계속해서 같은 곳을 가리키며 이미 나가고 있는 선원들을 위한 공간을 마련해 달라고 요청합니다. 이븐 할둔의 아내와 딸들이 해안에 도착했을 때, 문 앞에서 기다리고 있던 사람이 소식을 먼저 어디로 전해야 할지 묻습니다. 카이로로 보낼 편지는 그들이 직접 목소리로 대답할 수 있을 때까지 기다렸다.
      outcomes:
        all: 이븐 할둔은 역사상처럼 임명을 맡았습니다. 그의 가족이 해변에 있다는 긴급 소식이 항구에서 나옵니다. 이 지점에서 카이로에서 기다리고 있는 남자는 다른 메시지를 받습니다.
        p1: 약속은 녹화된 날짜에 종료됩니다. 배는 여전히 알렉산드리아에서 길을 잃었고 그의 가족은 카이로에 도착하지 못했습니다.
        p2: 그의 아내와 딸들은 항구에서 그들을 도와줄 사람들이 있습니다. 약속 시간이 어긋났지만 구조 현장은 아직 녹화가 가능합니다.
      none: 사람들은 카이로에서 문서를 기다리고 항구에서는 바람이 잠잠해지기를 기다립니다. 그의 가족이 안전하다는 편지는 결코 쓰여지지 않습니다.
      not_admitted: 약속을 전달하기 위해 문 옆에서 기다리고 있는 사람을 아무도 인정하지 않습니다. 배에서 온 소식이 방에 전해지지 않았습니다.
      desync: 이븐 할둔에게 예정된 약속이 다른 사람에게 전달되었습니다. 기록이 동기화되지 않으면 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: 서기는 탁자 가장자리에 둔 임명장을 오늘 발송할 서류 더미에 다시 넣었다.
        p2: 카이로로 보낼 편지는 그들이 직접 목소리로 대답할 수 있을 때까지 기다렸다.
    relic: 확인된 보고서
    relic_desc: 여백에 감시자가 서 있던 장소가 적혀 있는 행렬 보고서.
    points:
      p1: 경쟁자들이 새 법관을 밀어내려 할 때, 8월 8일 이븐 할둔의 말리키 법학파 수석 법관 임명을 지킨다.
      p2: 그의 아내와 딸들을 태운 배가 알렉산드리아 앞바다에서 침몰할 때, 그 위에 탄 사람들을 물에서 끌어내어 구해 주십시오.
    points_fail:
      p1: 이 분기에서는 8월 8일의 임명이 다른 사람에게 돌아갔습니다. 이 분기는 역사와의 동기화를 잃었고 사무실에서는 그날 그 직원을 귀환시킵니다.
      p2: 역사에서와 마찬가지로 배는 모든 사람이 탑승한 가운데 알렉산드리아에서 침몰하고 그의 아내와 딸은 카이로에 도착하지 않습니다.
    shift:
      p1:
        was: '1384년 8월 8일: 술탄 바르쿠크(Sultan Barquq)는 카이로에 있는 말리키 법학파의 이븐 할둔(이븐 할둔) 수석 판사를 임명했습니다. 도시의 라이벌들이 그를 반대했고 그는 다음 해에 자리를 잃었습니다.'
      p2:
        was: '1384년: 튀니스에서 이븐 할둔의 아내와 딸들을 태운 배가 알렉산드리아에 침몰했고, 탑승한 사람은 아무도 살아남지 못했습니다.'
        now: 배에 탄 사람들은 알렉산드리아의 물에서 끌려나왔습니다. 그의 아내와 딸들은 카이로로 왔고 가족은 다시 함께 살았습니다.
        who: ibn_khaldun_cairo
        bio: 이 시간표에서 1384년 알렉산드리아에 내려간 배는 그의 가족을 데리고 가지 않았습니다. 그의 아내와 딸들은 구조되어 카이로에서 그와 합류했습니다.
    vignettes:
      gate: '{staff}는 경기를 준비한 점원에게 군중이 통과하는 동안 게이트가 얼마나 오랫동안 열려 있는지 묻습니다. 그는 총액 옆의 여백에 분을 기록한 다음 총액을 추정치로 변경합니다.'
      two: '{staff}는 게임을 준비한 두 번째 관찰자에게 자신만의 시트를 제공하여 거리에 대한 그녀의 설명이 그의 한계에 눌리지 않도록 합니다.'
      copy: '{staff}는 법원 학생을 위해 Muqaddimah 페이지를 복사하고 학생이 작성하려는 메모를 위해 줄 사이에 손가락 너비를 남겨 둡니다.'
  lili_boulanger_paris:
    name: 탁자에 펼친 파트 악보
    place: 메지쉬르센
    figure: 릴리 불랑제
    story: 릴리 불랑제는 1918년 겨울 메지-sur-Seine에서 중병에 걸렸습니다. 그녀의 마지막 작품에 대한 설명은 그녀가 여동생 나디아에게 Pie Jesu를 받아쓰게 하는 것을 묘사합니다. 악보는 성악, 현악4중주, 하프, 오르간을 요구합니다. 릴리는 3월 15일 24세의 나이로 사망했습니다.
    story_prose:
      opening:
        - 악보대에는 페어 카피와 받아쓰기를 기다리는 페이지라는 두 개의 더미가 있습니다. 나디아는 릴리가 펜을 내려놓으라고 요청했을 때 방금 메모를 적었습니다. 얇은 종이 때문에 마지막에 쓴 마디를 읽기가 어렵습니다.
        - 마지막 투병 기간 동안 릴리 불랑제는 여동생 나디아에게 Pie Jesu의 음악을 받아쓰게 했습니다. 릴리는 1918년 3월 15일에 사망했습니다. 여기에서 그녀는 자신의 속도에 맞춰 잠시 멈춰서 계속하고 싶을 때 누군가가 그녀가 멈춘 부분을 다시 읽어주도록 할 수 있습니다.
        - 음악을 읽는 사람은 나디아의 위치를 표시할 수 있습니다. 릴리가 구절을 다시 읽기 전에 준비가 되면 말하게 하세요.
      points:
        p1: 나디아는 페이지를 넘기기 시작합니다. 릴리는 그녀에게 기다려달라고 부탁한다. 두 사람 모두 마지막 막대를 볼 수 있는 곳에 좁은 전표를 놓습니다. 방은 한동안 조용했다. 릴리가 말하면 나디아가 표시한 비트를 다시 센다. 릴리가 음표 하나를 고치자 나디아는 같은 줄에서 이어 갔다.
      outcomes:
        all: 릴리는 언제 계속할지 결정합니다. 그녀가 구술한 구절은 여전히 테이블에 남아 있으며, 이후 기록에는 여전히 3월 15일에 그녀가 사망한 것으로 기록되어 있습니다.
        p1: 릴리가 준비되면 나디아는 표시된 장소로 돌아갑니다. 이번에는 릴리가 일시 정지 전에 지시한 내용을 반복할 필요가 없습니다.
      none: 휴식 후에도 자매들은 여전히 자신의 자리를 찾아야 합니다. 릴리는 다시 한 구절을 받아쓰는 데 시간을 사용합니다.
      not_admitted: 나디아는 방문객에게 밖에서 기다려 통로를 조용히 해달라고 부탁합니다. 자매들만이 멈추기 전에 마지막 문구를 듣습니다.
      excerpts:
        p1: 릴리가 음표 하나를 고치자 나디아는 같은 줄에서 이어 갔다.
    relic: 좁은 종이 마커
    relic_desc: 받아쓰기가 멈춘 바를 표시하는 고안된 전표입니다.
    points:
      p1: 릴리가 휴식을 요청하면 나디아를 위한 장소를 표시하고 릴리가 다시 시작하고 싶을 때 마지막 구절을 다시 읽어주세요.
    points_fail:
      p1: 멈춘 후 자매들은 다시 자신의 자리를 찾아야 한다. 릴리는 그날 남은 시간 중 자신이 이미 나디아에게 준 것을 반복하면서 보냅니다.
    shift:
      p1:
        was: Pie Jesu의 기록에서는 릴리가 매우 아팠을 때 릴리가 음악을 쓰는 데 도움을 준 나디아를 설명합니다.
        now: 이 분기에서 {staff}는 릴리가 중지할 때 해당 위치를 유지합니다. 준비가 되면 나디아는 마지막 구절을 다시 읽고 그녀의 여동생은 자신이 멈추기로 선택한 부분부터 정확히 시작할 수 있습니다.
    vignettes:
      entry: '{staff}는 나디아에게 페이지를 넘기기 전에 가장 최근 메모를 가리키도록 요청합니다. 그녀는 그 라인 위의 목소리를 확인하면서 그 라인에 손가락을 대고 있습니다.'
      visitor: 문 앞에 있던 사람이 음악이 얼마나 남았는지 묻습니다. 릴리가 휴식 여부를 결정하는 동안 {staff}는 질문을 외부에 유지합니다.
      stand: '{staff}는 나디아가 악보를 가리지 않고 펜을 내려놓을 수 있도록 스탠드에 공간을 만들어줍니다.'
  jianzhen_nara:
    name: 양저우로 돌아가는 먼 길
    place: 링난
    figure: 감진
    story: 일본으로 항해하려는 감진의 다섯 번째 시도는 대신 그를 하이난으로 데려왔습니다. 먼 길을 가던 중, 일본으로의 여행을 청하러 온 승려 에이에이가 단주에서 병에 걸려 죽었습니다. 감진은 여행 중에 시력을 잃었습니다. 계정은 다른 설명을 제공합니다.
    story_prose:
      opening:
        - 단저우에서는 동료가 새로 복사한 노선 서류를 문 옆에 놓아두었습니다. 에이에이의 방 안의 누군가가 메시지를 가져오는 사람들에게 기다려달라고 부탁했다. 감진이 와서 잠시 안에 앉아 있어도 되는지 묻습니다.
        - 감진의 항해 기록에는 영예가 Duanzhou에서 사망한 기록이 나와 있습니다. 감진의 시력은 나중에 더욱 악화되었고 일행은 양저우로 돌아갔습니다. 이 지점은 여행에서 짧은 두 순간이 걸립니다. 두 사람에게 말할 시간을 주고 나중에 감진으로 향하는 경로를 읽을 수 있습니다.
        - 돌봄 경험이 있는 사람은 영예가 원하는 것이 무엇인지 물어볼 수 있습니다. 신문을 읽고 다른 사람들의 말을 들을 수 있는 여행자는 나중에 감진으로 가는 경로를 읽고 들러서 읽을 수 있습니다.
      points:
        p1: 출발을 묻는 사람이 떠난 후, 당신은 영예에게 감진이 들어오기를 원하는지 묻습니다. 그는 고개를 끄덕이고 문을 비울 수 있는 의자를 요청합니다. 당신은 다른 사람들의 메시지를 보관하는 데 동의한 다음 마당에서 기다립니다. 안에서 두 사람의 목소리가 들렸다. 소리가 잦아들어도 재촉하는 이는 없었다.
        p2: 서류는 한 묶음으로 접혀 있고, 동료는 감진에게 그가 결정한 경로를 알려 주려고 합니다. 여전히 문제가 있는 정류장을 읽고 일행이 밤새 머물러야 할 곳을 말합니다. 감진은 어떤 무대를 먼저 밟고 싶은지 말하기 전에 다시 한 번 이름을 묻습니다. 누군가 지명만 적혀 있던 종이에 그의 선택을 적어 넣었다.
      outcomes:
        all: 두 사람은 이야기를 나누는 시간을 가집니다. 영예는 여전히 Duanzhou에서 사망합니다. 나중에 감진이 신문을 읽을 수 없게 되자 그들은 그가 큰 소리로 들은 경로로 여행합니다.
        p1: 두 사람이 만날 수 있게 되었습니다. 영예는 여전히 사망하고 이후 루트 문서에는 감진에게 설명할 사람이 필요합니다.
        p2: 감진은 다음 단계를 듣고 어디로 가고 싶은지 스스로 결정합니다. 에이에이와 함께 시간을 보낼 기회는 이미 지나갔습니다.
      none: 노선 서류는 묶음으로 돌아갑니다. 방 안의 메시지와 앞 장소의 메시지는 여전히 누군가가 읽어주기를 기다리고 있습니다.
      not_admitted: 당신은 에이에이가 묵고 있는 방에는 절대로 들어가지 마세요. 서류는 치워지고 문 옆에서는 아무도 읽지 않습니다.
      excerpts:
        p1: 안에서 두 사람의 목소리가 들렸다. 소리가 잦아들어도 재촉하는 이는 없었다.
        p2: 누군가 지명만 적혀 있던 종이에 그의 선택을 적어 넣었다.
    relic: 경로 메모 한 장
    relic_desc: 일행이 북쪽으로 여행하면서 발명한 시트입니다.
    points:
      p1: Duanzhou에서 영예가 어떻게 보살핌을 받고 싶은지 물어보고 감진과 대화할 시간을 만들어주세요.
      p2: 감진의 시력이 약해지면 파티에서 계획을 큰 소리로 읽도록 하여 그가 어떻게 계속할지 결정할 수 있도록 합니다.
    points_fail:
      p1: 해결해야 할 다른 일이 항상 있고 침대 옆에 있는 사람들은 계속 호출됩니다. 이야기할 시간이 지나갑니다.
      p2: 파티는 루트 노트를 다시 묶음으로 모았습니다. 감진은 누군가가 그 페이지에 있는 내용을 말해 줄 때까지 기다려야 합니다.
    shift:
      p1:
        was: 영예는 다섯 번째 일본 항해를 시도한 후 돌아 오는 길에 Duanzhou에서 병에 걸려 사망했습니다.
        now: 이 지점에서 {staff}는 Duanzhou의 영예와 함께 머물면서 감진을 침대 옆으로 호출합니다. 개인적으로 이야기를 나누는 시간이 있습니다.
      p2:
        was: 기록에 따르면 감진은 이 여행에서 시력을 잃었다고 합니다. 그는 나중에 일본으로 항해했습니다.
        now: 이 분기에서 {staff}는 다음 정류장을 읽습니다. 감진은 다른 사람들에게 한 정거장을 변경하라고 요청하고 언제 다시 출발하고 싶은지 알려줍니다.
    vignettes:
      sound: 동료가 시트의 다음 마을을 가리킵니다. {staff}는 감진이 듣는 동안 이름을 두 번 읽어달라고 요청합니다.
      tie: 파티는 경로 서류를 닫으려고 합니다. {staff}는 누군가 정차 순서를 확인할 때까지 번들을 열어 둡니다.
      temple: '{staff}는 마당에 있는 사람들이 목소리를 높이지 않고 말을 마칠 수 있도록 마당에서 질문에 대답합니다.'
  sei_shonagon_kyoto:
    name: 중궁이 출산을 앞둔 겨울
    place: 교토
    figure: 세이 쇼나곤
    story: Sei 쇼나곤은 Teishi 황후를 섬겼고 나중에 The Pillow Book에서 그녀 주변의 삶에 대해 썼습니다. 조호 2년 말, 데이시는 딸 비시 공주를 낳고 곧 사망했습니다.
    story_prose:
      opening:
        - 교토에 겨울이 왔습니다. 스크린 옆에 여분의 쿠션이 있습니다. 쇼나곤 세이는 누가 가져가야 하는지 묻습니다. 그녀가 말하는 동안 전령가 도착합니다. 데이시는 전령가 아직 거기에 있는 동안 빈 곳을 돌아본다.
        - 데이시는 1000년 말에 출산을 준비했고 환산 달력으로는 1001년 1월 13일에 사망했습니다. Sei 쇼나곤은 나중에 The Pillow Book에서 자신의 궁정 생활에 대해 썼습니다. 여기에서 Teishi가 근처에 누구를 원하는지 물어보고 그녀가 선택한 사람들을 위한 공간을 마련할 수 있습니다.
        - 쇼나곤과 함께 그녀의 이야기를 들을 여행자를 보내세요. Teishi가 말하는 동안 다른 사람이 외부에서 다음 메시지에 응답할 수 있습니다.
      points:
        p1: 쇼나곤은 쿠션을 집어 평소 위치에 놓았습니다. 당신은 전령가 끝날 때까지 기다린 다음 데이시가 누구를 만나고 싶어하는지 알아내도록 그녀에게 요청합니다. 데이시는 한 사람의 이름을 부르며 그녀에게 램프 뒤에 조금 앉으라고 요청합니다. 쇼나곤은 그녀가 가리키는 쿠션을 내려놓았다. 방이 조용해졌을 때, 데이시가 청한 사람이 자리에 앉아 있었고 데이시는 원하는 곳에 손을 얹었다.
      outcomes:
        all: 그녀가 만나자고 한 사람은 여전히 가까이에 있습니다. Teishi는 여전히 사망하고 있으며 보고서에는 그녀와 함께 앉을 사람을 선택한 순간이 보존되어 있습니다.
        p1: 쇼나곤은 Teishi가 선택한 사람이 도착할 때까지 쿠션을 무료로 유지합니다. 후기 기록은 그녀의 역사적 삶을 따릅니다.
      none: 하나의 메시지가 문에 도착합니다. 쿠션은 데이시에게 원하는 사람이 누구인지 물어보기 전에 먼저 표시된 사람에게 전달됩니다.
      not_admitted: 아무도 당신을 부르지 않습니다. 누군가가 화면 너머로 쿠션을 움직입니다. 밖에서 보면 누구를 위한 것인지 알 수 없습니다.
      excerpts:
        p1: 방이 조용해졌을 때, 데이시가 청한 사람이 자리에 앉아 있었고 데이시는 원하는 곳에 손을 얹었다.
    relic: 가족을 위한 접힌 메모
    relic_desc: 방에 표시되어야 하는 사람을 명명하는 고안된 메모입니다.
    points:
      p1: 데이시가 출산을 준비할 때 누구를 가까이 두고 싶은지 물어보고 쇼나곤이 그런 사람들을 위한 공간을 마련하도록 도와주세요.
    points_fail:
      p1: Teishi가 자신 옆에 누구를 원하는지 물어볼 시간이 되기 전에 누군가가 다음 메시지를 가지고 문 앞에 와 있습니다.
    shift:
      p1:
        was: 법원 연대기에는 비시 공주의 탄생과 데이시의 사망이 곧 기록되어 있습니다.
        now: 이 지점에서 {staff}는 Teishi가 보고 싶은 사람을 말할 때까지 다른 방문자를 문 앞에 두었습니다. 쇼나곤은 다음 메시지를 전달하기 전에 들을 시간을 갖습니다.
    vignettes:
      compare: '{staff}는 메시지를 접기 전에 전령에게 이름 하나를 명확하게 읽어달라고 요청합니다. 쇼나곤은 이제 다시 묻지 않고 전달할 수 있습니다.'
      colour: 쇼나곤은 램프 뒤에 있는 공간을 보기 위해 램프를 움직입니다. {staff}는 데이시가 가리키는 곳으로 예비 쿠션을 이동시킨다.
      listen: '{staff}는 방에 다른 것이 필요한지 묻기 전에 문에 있는 메시지에 응답할 때까지 기다립니다.'
  ibn_rushd_lucena:
    name: 책을 불태우라는 명령이 내리기 전에
    place: 코르도바
    figure: 이븐 루시드
    story: 1195년경 이븐 루시드는 알모하드 궁정의 미움을 받아 루세나로 추방되었습니다. 기록에는 책을 비난하고 불태우는 내용이 기록되어 있습니다. 아리스토텔레스의 물리학에 관한 장문의 아랍어 텍스트는 유실되었지만 히브리어와 라틴어 번역본은 남아 있습니다.
    story_prose:
      opening:
        - 두 개의 메시지가 여전히 Córdoba 테이블에 대기 중이며 그 중 하나는 루세나로 전달됩니다. 독자는 이븐 루시드가 여전히 대답할 것인지 묻습니다. 그는 필사자를 향해 긴 물리학 해설을 그리며 한 단어가 빠진 곳을 가리킨다.
        - 이븐 루시드는 1195년경 루세나로 추방되었습니다. 나중에 기록에 따르면 책에 대한 제한이 기록되어 있습니다. 그의 물리학에 대한 긴 논평의 아랍어 텍스트는 부분적으로만 남아 있습니다. 여기에서 독자가 다시 연락할 수 있도록 하고 해당 독자를 위해 한 섹션의 체크 사본을 남길 수 있습니다.
        - 두 주소를 담당하는 서신을 준비할 수 있는 사람을 두십시오. 아랍어를 읽는 사람이나 세심한 필사자는 원본이 어디서 끝나고 해설이 시작되는지 확인할 수 있습니다.
      points:
        p1: 독자는 여러 줄을 썼습니다. 때가 되면 그는 계속 읽고 싶다고만 말해달라고 요청합니다. 루세나에서는 이븐 루시드에게 해당 단어를 읽어주고 답변을 보낼 곳을 알려줍니다. 그는 독자가 어느 섹션에 도달했는지 묻고 자신의 시트를 가져옵니다. 그는 접힌 종이 두 장을 건네며 아직 읽고 있는 사람에게 전해 달라고 부탁했다.
        p2: 복사기가 공백을 지나 바로 글을 썼습니다. 그는 본문이 의미가 있지만 원본을 읽는 사람이 누락된 문장의 이름을 지정할 수 있다고 말했습니다. 그에게 원래 줄을 위한 공간을 남겨두고 그 아래의 설명을 복사한 다음 두 줄을 다시 읽도록 합니다. 필사본을 받은 독자는 두 대목 사이에 손가락을 짚고 이제 둘 다 스스로 찾을 수 있다고 말했다.
      outcomes:
        all: 루세나와 Córdoba 사이에 답변이 전달되고 독자는 해설의 아랍어 섹션을 확인하게 됩니다. 다른 페이지의 손실은 기록에 남아 있습니다.
        p1: 이븐 루시드는 누군가가 아직도 책을 읽고 있다는 것을 알고 있습니다. 그의 답변은 루세나에서 가져왔고 확인된 사본은 아직 완성되지 않은 상태로 남아 있습니다.
        p2: 독자는 체크된 아랍어 페이지를 가지고 떠납니다. 루세나에게 보내고 싶었던 메시지는 아직 기다리고 있다.
      none: 메시지와 반쯤 쓴 페이지가 모두 책상 위에 남아 있습니다. 독자는 다음 사람이 오기를 기다립니다.
      not_admitted: 문 앞에 있는 사람들은 알 수 없는 택배기사가 보낸 편지를 받지 않을 것입니다. 독자의 말은 결코 이븐 루시드에게 전달되지 않습니다.
      excerpts:
        p1: 그는 접힌 종이 두 장을 건네며 아직 읽고 있는 사람에게 전해 달라고 부탁했다.
        p2: 필사본을 받은 독자는 두 대목 사이에 손가락을 짚고 이제 둘 다 스스로 찾을 수 있다고 말했다.
    relic: 독자의 실천 발췌
    relic_desc: 전제에 공간이 추가된 발명된 추출물입니다.
    points:
      p1: Córdoba에서 루세나의 이븐 루시드에게 그의 독자 중 한 명이 여전히 그에게 편지를 쓰고 싶어하며 그의 답장을 받을 수 있다는 소식을 보냅니다.
      p2: 주문이 들어오기 전에 물리학에 대한 아랍어 해설의 한 부분을 해당 출처와 비교하고 두 번째 사본을 독자에게 남겨주세요.
    points_fail:
      p1: 독자는 메모를 코르도바에 보관합니다. 그들은 그것을 보낼 또 다른 기회를 기다려야 할 것입니다.
      p2: 추가 사본은 미완성 상태로 유지됩니다. 독자는 가져갈 별도의 아랍어 페이지가 없습니다.
    shift:
      p1:
        was: 이븐 루시드는 호의를 얻지 못해 루세나로 추방된 후 법정으로 돌아갔습니다.
        now: 이 지점에서 독자의 메모가 루세나에서 그에게 전달됩니다. 그는 편지를 다시 보낼 방법이 아직 남아 있는 동안 답장을 보낼 수 있습니다.
      p2:
        was: 이븐 루시드의 물리학에 대한 장문의 아랍어 텍스트가 손실되었습니다. 중세 번역본이 남아있습니다.
        now: 이 분기에서는 확인된 섹션 중 하나가 비난을 통해 독자의 손에 남아 있습니다. 독자는 여전히 그것을 아랍어 원본의 다른 사본과 비교할 수 있습니다.
    vignettes:
      premise: 마리암은 조심스럽게 편지로 결론을 복사했습니다. Yusuf는 자신이 언급하지 않은 내용을 가정함으로써만 이를 따를 수 있습니다. 당신은 그에게 어디에서 멈췄는지 물어보고 결론이 나오기 전에 공간을 남겨둡니다. Mariam은 Yusuf가 질문할 수 있는 공간에 자신의 가정을 씁니다.
      together: Yusuf는 책을 반환하고 자신이 사용할 수 있도록 한 줄만 보관하고 싶어합니다. 당신은 그에게 그에 따른 단계를 복사할 시간을 줍니다. 문 앞에서 마리암은 큰 소리로 결론을 묻고 이제 마리암은 이유도 설명할 수 있습니다.
      language: 당신은 나중에 독자들이 다른 언어로 만나게 될 용어를 인식합니다. Mariam은 단지 자신이 전제를 있는 그대로 복사했는지 알고 싶을 뿐입니다. 그녀가 페이지를 확인하는 동안 당신은 페이지를 평평하게 잡고 있습니다. 그녀가 옆에 쓴 질문은 당신이 만나지 못할 독자에게 전달될 것입니다.
  maya_codices_mani:
    name: 종이를 접는 법을 기억하다
    place: 마니
    figure: 마야의 필경사들
    story: 1562년 7월 12일 식민 당국은 마니(Maní)에서 마야 서적과 기타 물건을 공개적으로 불태웠습니다. 마야 공동체는 계속해서 지식을 만들고 전수해 왔습니다. 스페인 정복 이전에 만들어진 접는 책은 거의 남아 있지 않습니다.
    story_prose:
      opening:
        - 유카탄주 마니에서는 사육사가 접힌 책을 매트 위에 놓고 어린아이가 한때 함께 읽었던 페이지로 바꿉니다. 오늘은 인근 마을에서 한 손님이 떠나고 있습니다. 그는 떠나기 전에 그녀에게 책 한 권을 맡길 것인지 묻습니다.
        - 1562년 7월 마니에서 책을 불태운 사건이 기록되어 있습니다. 살아남은 마야 사본에는 글과 그림이 보존되어 있는데, 그 정확한 역사는 종종 불확실합니다. 여기의 관리인은 허구이며 자신의 책 중 하나를 보관할 사람을 선택할 수 있습니다.
        - 관리자에게 페이지 작동 방식을 보여줄 수 있는 사람을 보내십시오. 그녀가 책을 전달하기로 결정했다면, 그녀가 지시하는 대로 책을 접고 독자들이 그 책을 어떻게 찾을 수 있는지 수령인에게 물어보십시오.
      points:
        p1: 골키퍼는 두 번째 접힌 부분을 열고 다른 독자가 한 번 실수한 여백을 가리킵니다. 당신은 수신자에게 두 독자가 같은 장소에 멈추는 것을 볼 수 있도록 그녀의 지시를 따르도록 요청합니다. 그녀는 다른 책에서 한 권의 책을 꺼내 낡은 천으로 싸서 매트 위에 건네줍니다. 받는 사람은 그것을 두 손으로 받쳐 들고 마지막 접힌 자국의 표시를 그녀가 설명하기를 기다렸다.
      outcomes:
        all: 한 권의 책은 주인이 선택한 곳으로 갑니다. 마니에서의 소각은 여전히 일어나고 있으며, 이 지부는 그녀가 직접 물려준 한 권의 책을 보존하고 있습니다.
        p1: 독자는 포장된 책을 가슴에 안고 들고 다닌다. 다시 열면 그녀가 보여준 대로 두 번째 접힌 부분을 찾을 수 있습니다.
      none: 독자는 빈손으로 집에 돌아갑니다. 관리인은 책을 펼쳤다가 다시 덮습니다. 그녀는 그것이 어디에 머물지 아직 결정해야 합니다.
      not_admitted: 골키퍼는 방문자가 페이지를 터치하도록 초대하지 않습니다. 문 앞에서는 그녀가 책을 돌려놓고 계속해서 이웃과 이야기하는 모습을 볼 수 있습니다.
      excerpts:
        p1: 받는 사람은 그것을 두 손으로 받쳐 들고 마지막 접힌 자국의 표시를 그녀가 설명하기를 기다렸다.
    relic: 빈 연습용 접기
    relic_desc: 골키퍼가 제공하는 가상의 접기입니다.
    points:
      p1: 관리인에게 다른 마을의 신뢰할 수 있는 독자가 어떤 책을 갖고 싶어하는지 물어보고 그녀가 그 책을 넘겨줄 수 있도록 도와주세요.
    points_fail:
      p1: 그녀가 선택한 사람은 책 없이 떠난다. 주인은 그것이 어디에 머물 수 있는지 결정해야 합니다.
    shift:
      p1:
        was: '1562년 7월 12일: 마니(Maní)에서는 수많은 마야 접이식 책들이 공개적으로 불태워졌습니다. 정복 이전에 만들어진 책들 중 어느 곳에도 남아 있는 것은 소수에 불과합니다.'
        now: 이 지점에서 관리인은 누가 한 권의 책을 돌볼 것인지 선택합니다. 그것은 다음 독자에게 전달되고 불태워지는 동안 마야의 손에 남아 있습니다.
        who: maya_codices_mani
        bio: 이 분기에서는 마니의 책이 1562년 공개 소각되기 전에 책 보관인이 선택한 독자에게 전달되었습니다.
    vignettes:
      fold: 주인은 벤치 위에 두 개의 빈 접힌 책을 놓고 이웃에게 자신이 기억하는 책에서 어느 것이 먼저 열렸는지 묻습니다. 비교하는 동안 종이를 들고 있습니다. 그는 두 번째 접기를 놓을 수 없습니다. 그녀는 첫 번째를 유지하고 다음 대화를 위해 다른 하나를 풀어 놓습니다.
      listen: 이웃은 골키퍼가 잃어버린 부분을 다시 말하기 시작하지만 순서를 다르게 기억합니다. 각각이 끝날 때까지 듣습니다. 그들은 첫 번째 접기에 동의하고 두 번째 접기는 미정으로 둡니다. 관리인은 두 계정이 모두 포함된 사본을 그녀에게 남겨달라고 요청합니다.
      survive: 당신은 이후 컬렉션에서 살아남은 Maya 코덱스를 보았습니다. 관리인은 이웃이 기억하는 책이 무엇인지 말할 수 있는지 묻습니다. 컬렉션 이름을 지정할 수 있지만 해당 페이지를 이 룸에 연결할 수는 없습니다. 그녀는 뒤로 걸어가기 위해 빈 연습용 접기를 당신에게 건네줍니다. 그들이 기억하고 있던 책은 그에 대한 설명과 함께 남아 있습니다.
  zeami_sado:
    name: 종이 위의 섬
    place: 사도섬
    figure: 제아미
    story: 제아미의 아들 모토마사는 1432년에 사망했습니다. 제아미는 1434년 사도로 유배되기 전에 캬쿠라이카에서의 손실에 대해 썼습니다. 그의 여행과 섬 유배를 회상하는 구호 모음집인 긴토쇼는 1436년에 작성되었습니다.
    story_prose:
      opening:
        - Sado에서는 독자가 주머니에 접어 넣을 수 있을 만큼 작은 시트를 함께 제공합니다. 제아미는 그가 문 옆에서 매번 다른 지점에서 호흡하며 연습하는 것을 이미 두 번이나 들었습니다. 그는 자리에서 독자에게 어디서부터 시작하려고 하는지 묻습니다.
        - 제아미는 말년에 사도로 유배되어 긴토쇼(Kintosho)에 섬에 관해 글을 썼습니다. 이 분기는 그에게 듣기로 선택할 수 있는 짧은 읽기와 스스로 선택할 수 있는 일시 중지를 제공합니다. 이후의 작업은 역사상 그랬던 것처럼 여전히 남아 있습니다.
        - 가사와 리듬을 들어줄 사람을 보내십시오. 제아미가 듣고 싶은지 물어보고 그가 선택한 일시 중지를 녹음하십시오.
      points:
        p1: 독자는 문구가 끝나면 숨을 쉰다. 제아미는 그에게 같은 장소에서 다시 시작하라고 말하고 중간에 손을 든다. 손이 단어를 멈추는 위치를 관찰하고 읽기가 끝난 후 전표를 표시합니다. 세 번째에는 읽는 사람이 눈을 내리깔지 않고 그 말에서 멈췄다. 제아미가 손을 들기 전이었다.
      outcomes:
        all: 슬립은 제아미가 대사를 들은 후 선택한 일시 중지를 유지합니다. 그가 섬에 대해 계속 글을 쓰는 동안 그것은 페이지 옆으로 이동합니다.
        p1: 제아미가 직접 일시정지를 선택했습니다. 독자는 다음 번에도 같은 시트를 가져올 것이라고 말합니다.
      none: 독자는 부름을 받을 만큼 오래 머물 수 없습니다. 그의 접힌 시트에는 여전히 일시 정지 표시가 없습니다.
      not_admitted: 방문자가 아직 읽도록 초대되지 않았습니다. 독자는 페이지를 접고 문에서 물러납니다.
      excerpts:
        p1: 세 번째에는 읽는 사람이 눈을 내리깔지 않고 그 말에서 멈췄다. 제아미가 손을 들기 전이었다.
    relic: 노 가면
    relic_desc: 눈썹 사이에 가느다란 옻칠을 한 작은 나무 가면이다.
    points:
      p1: 제아미에게 사도에 관한 글을 함께 읽어줄 사람이 있는지 물어보세요. 그가 동의한다면, 독자가 분리 가능한 전표에서 잠시 멈추도록 도와주세요.
    points_fail:
      p1: 제아미가 대사를 큰 소리로 듣기 전에 독자는 떠나야 합니다. 페이지의 표시는 기다려야 합니다.
    shift:
      p1:
        was: 제아미가 남긴 글에는 아들을 애도하는 글과 사도 유배를 회상하는 긴토쇼(Kintōsho)가 포함되어 있습니다.
        now: 이 지점에서 제아미는 독자가 두 가지 방법으로 자신의 대사를 시도하는 것을 듣습니다. 그는 독자가 잠시 멈춰야 할 곳을 선택하고 그 쪽지를 자신의 페이지 옆에 보관합니다.
    vignettes:
      later: 당신은 사람들이 사도에 관한 책에서 여전히 그 이름을 사용할 것이라고 독자에게 말합니다. 그는 그 단어를 지명으로 시도한 다음 사람이 갈망하는 것으로 시도합니다. 전표에 두 가지 일시 중지를 모두 표시합니다. 제아미를 사도까지 데려온 배는 이미 떠났습니다.
      mask: 독자는 연습용 가면을 들고 있다가 내리면 자리를 잃습니다. 느슨한 슬립에 줄의 시작 부분을 표시하고 그가 다시 찾을 수 있는 곳에 세워 놓습니다. 마스크가 말뚝에 다시 고정됩니다. 당신은 당신의 독서 후에 독서를 놓칩니다.
      wind: 외풍에 읽기 자료가 흩날린다. 독자가 벤치 아래에서 하나를 찾아 조약돌로 붙잡도록 도와줍니다. 그는 그 줄을 다시 한 번 읽습니다. 떠날 때 종이는 돌 아래에 남아 있고 메모에 잠시 멈춘 부분이 남아 있습니다.
  mozart_requiem_vienna:
    name: 필적을 알아볼 수 있도록
    place: 빈
    figure: 볼프강 아마데우스 모차르트
    story: 모차르트는 1791년 12월 빈에서 레퀴엠이 미완성인 상태로 사망했습니다. 오스트리아 국립 도서관은 프란츠 크사버 쥐스마이어의 손길이 더해진 작업 자료와 제출용 총보를 소장하고 있다.
    story_prose:
      opening:
        - 비엔나에서 심부름꾼은 테이블 위의 가장 깔끔한 더미에 손을 뻗습니다. 모차르트는 침대에서 오프닝에 사용된 악기 부분이 아직 남아 있는지 묻습니다. 콘스탄체는 심부름꾼에게 기다려 달라고 요청합니다. 다른 페이지 중 일부는 치워지지 않은 초안입니다.
        - 모차르트는 말년에 병에 걸렸고 1791년 12월 5일에 사망했습니다. 레퀴엠은 오프닝을 완전히 마쳤음에도 불구하고 미완성 상태로 남아 있습니다. 여기에서 해당 섹션을 함께 보관하고 간병인이 사무실의 가상 의료 키트를 가져오도록 할 수 있습니다.
        - 악기 부분과 작업 시트를 구별할 수 있는 독자는 콘스탄체가 이를 분류하는 데 도움을 줄 수 있습니다. 키트를 가지고 있는 사람을 이용하여 가족과 모차르트에게 무엇을 원하는지 물어본 후 돌봄 경험을 해보세요.
      points:
        p1: 심부름꾼은 종이 두 장을 뒤집어 같은 성부의 이름을 읽었다. 콘스탄체와 함께 관현악 편성이 다 적힌 묶음을 받아 도입부 끝까지 악보를 확인했다. 초고에는 표찰을 붙여 따로 두었다. 문 앞에서 심부름꾼은 꾸러미의 안팎을 확인해 필사자에게 어느 묶음부터 줄지 알아두었다.
        p2: 누군가 깨끗한 시트를 침대 머리맡으로 가져오더니 오늘 복사할 것인지 묻습니다. 당신은 모차르트와 그의 가족에게 사무용품 세트를 설명하고 필사자에게 다른 방에서 기다려달라고 부탁합니다. 나중에 모차르트가 깨어났을 때 그의 열은 사라졌습니다. 그는 탁자를 가까이 옮겨 달라고 하고, 쓰다 멈춘 쪽만 펼쳤다.
      outcomes:
        all: 오프닝 부분은 다시 사용할 수 있으며 모차르트는 테이블에서 작업할 수 있습니다. 그 다음 페이지는 떠날 때에도 여전히 비어 있습니다. 그가 어떻게 마무리할지 아직 아무도 모릅니다.
        p1: 개봉은 여전히 하나의 완전한 패킷입니다. 12월 5일 모차르트가 사망하고 남은 악보는 다른 사람에게 맡깁니다.
        p2: 모차르트는 회복하지만 원래의 오프닝은 흩어진다. 이번 방문은 그가 잠에서 깨어나 점수를 보여달라고 요청하는 순간을 보존합니다.
