      p2: 광야에서 병들거나 다친 친척을 치료하고 물을 나누어 주어 가족이 뒤처지지 않게 하라
      p3: 군인들이 책을 가져가기 전에 그의 도서관에 있는 상자 몇 개를 모아서 마을에 있는 가족에게 숨겨 두십시오.
    points_fail:
