    place: 스톡홀름
    figure: 소피야 코발렙스카야
    story: 고정점을 중심으로 한 회전에 관한 Kovalevskaya의 논문은 1889년 Acta Mathematica에 게재되었습니다. 이 연구는 관성 모멘트와 질량 중심 위치에 대한 특정 조건이 있는 통합 가능한 사례를 식별합니다.
    story_prose:
      opening:
        - 스톡홀름에서는 교정자가 헐거운 페이지에 황동 상판을 올려 놓았습니다. Kovalevskaya는 그에게 작업 사본을주었습니다. 수정된 회고록은 책상 반대편에 있습니다. 두 첫 페이지 모두 회전하는 몸체에 대해 언급하고 있으며 제목만으로는 무엇이 변경되었는지 알 수 없습니다.
        - 이 작업으로 Kovalevskaya는 1888년에 Prix Bordin 상을 받았습니다. 회고록은 스톡홀름이 그녀에게 영구 의자를 준 해인 1889년에 출판되었습니다. 저널 패킷에 가정을 유지하고 약속 날짜에 대한 사전 서면 확인을 요청할 수 있습니다.
        - 기호와 다이어그램을 일치시킬 수 있는 사람에게 패킷을 확인하도록 하십시오. 파리에서 소식이 오면, 그녀의 수업 일정 사본과 함께 서면 답장을 받을 수 있는 사람을 보내십시오.
      points:
        p1: 교정자는 윗부분의 끝부분을 가리키며 그것이 질량의 중심인지 묻습니다. 두 개의 점을 그리고 첫 번째 페이지에서 고정된 점을 찾게 한 다음 다른 점에 대한 조건으로 돌아가도록 합니다. Kovalevskaya는 두 시트의 기호를 확인하고 패킷에 어떤 페이지가 들어가는지 알려줍니다. 교정자는 상단을 유지하고, 제본된 사본은 다시 첫 페이지에 해당 조건을 갖습니다.
        p2: 서기는 파리에서 온 소식을 제쳐두고 이미 나열된 수업을 누가 가르칠 것인지 묻습니다. 두 사람은 그녀의 시간표를 읽고 그녀가 준비해야 할 첫 번째 수업을 찾습니다. 그는 목록을 치우고 약속 날짜가 적힌 편지를 가지고 돌아왔습니다. 그녀는 그것을 다음 학기 수업의 첫 주에 클립합니다.
      outcomes:
        all: 저널은 회고록과 함께 조건을 받고, 대학은 시간에 맞춰 날짜를 확인합니다. 그녀는 연구를 위해 남겨둔 시간을 채운다.
        p1: 올바른 첫 페이지가 용지와 함께 사용됩니다. 서면 확인이 아직 보류 중인 상태에서 그녀는 어쨌든 수업 일정을 잡아야 합니다.
        p2: 그녀는 시작 날짜가 적힌 편지를 가지고 있습니다. 일지 꾸러미가 잘못되어 여행은 점원이 그녀에게 답장을 건네주는 장면만 보존한다.
