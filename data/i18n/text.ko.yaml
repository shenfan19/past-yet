      desync: 3월 25일 저녁에도 선수들과 자유 홀의 날은 여전히 달랐고, 포터는 26일에 누구의 이름이 속하는지 찾지 못한 채 등록 페이지를 넘겼습니다. {staff}가 리콜되었을 때 포터는 자신이 세워둔 의자를 벽에 쌓아 놓고 있었습니다.
