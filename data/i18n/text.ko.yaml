  schubert_vienna:
    name: 3월 연주회 프로그램
    place: 비엔나
    figure: 프란츠 슈베르트
    story: 1828년 3월 26일, 생애 유일하게 프란츠 슈베르트는 비엔나의 Gesellschaft der Musikfreunde 방에서 자신의 작품을 공개 콘서트로 열었습니다. 가을에 그는 이미 병이 들었고 Wieden에 있는 그의 형제 Ferdinand의 새 아파트로 이사했습니다. 10월 2일에 그는 그의 마지막 세 곡의 피아노 소나타를 출판사 Probst에 제공했습니다. 그는 11월 19일 서른한 살의 나이로 그 아파트에서 사망했습니다. 소나타는 1839년에야 또 다른 헌정과 함께 나왔습니다.
    story_prose:
      opening:
        - 1828년 3월, 비엔나. 서른한 살의 작곡가 프란츠 슈베르트는 교향곡과 실내악 외에도 600곡이 넘는 곡을 작곡했지만, 그 중 출판되거나 널리 연주된 곡은 거의 없습니다. 이번 달에는 친구들과 연주자들의 도움을 받아 3월 26일 Gesellschaft der Musikfreunde에서 자신의 작품만으로 콘서트를 열 예정입니다.
        - 역사상 그가 직접 열었던 유일한 콘서트였습니다. 가을에 그는 병이 들었고 9월에 Wieden에 있는 그의 형제 Ferdinand의 새 아파트로 이사했습니다. 10월 2일에 그는 라이프치히 출판사인 프롭스트(Probst)에게 그의 마지막 세 곡의 피아노 소나타를 제안하는 편지를 보냈는데, 이 곡은 그가 존경하는 작곡가에게 헌정하려고 했으나 프롭스트는 관심이 없었습니다. 11월 19일에 그는 형의 집에서 사망했다. 소나타는 1839년에야 로베르트 슈만에게 헌정된 작품으로 나왔습니다. 이 지부에는 의자를 놓는 짐꾼이 있고, 벽 밖의 와인 정원에는 바이올린 연주자가 있고, Wieden의 새 집에는 여주인이 있습니다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 음악을 알고 꾸준한 손길을 가진 사람, 또는 체계적이거나 강한 의지로 사람들을 모아 서둘러 모인 연주자들과 홀을 같은 저녁에 모을 수 있는 사람; 매우 훌륭한 음악가 또는 출판사와 소나타 보내기를 해결하기 위해 신속하고 꾸준하게 기록 보관소를 보관하고 책을 번역하거나 판매하는 사람; 나노 의료 키트를 들고 있는 누군가가 그 시대에는 치료할 수 없었던 질병을 치료할 수 있습니다.
      outcomes:
        all: 그해 11월 슈베르트는 병에 걸리지 않았습니다. 라이프치히에서 답변이 왔고 그는 그것을 세 개의 소나타 원고 안에 보관했는데, 그 첫 페이지에는 그가 의도한 사람의 이름이 적혀 있었습니다.
        p3: 그해 11월 슈베르트는 병에 걸리지 않았습니다. 겨울이 오자, Wieden의 방 창문 아래에는 작곡을 위한 작은 테이블이 놓여 있었고, 그 모퉁이에는 신선한 원고지 더미가 쌓여 있었습니다.
        p2: 11월 19일 슈베르트는 31세의 나이로 형의 집에서 사망했습니다. 방을 청소한 페르디난트는 서랍에서 라이프치히에서 보낸 편지를 꺼내 세 개의 소나타 원고와 함께 놓아두었습니다.
        p1: 11월 19일 슈베르트는 31세의 나이로 형의 집에서 사망했습니다. 3월 26일 저녁에 대한 초대장은 나중에 친구의 회고록에 인쇄되었습니다.
