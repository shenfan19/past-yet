  nezahualcoyotl_texcoco:
    name: 노래 옆에 적힌 이름
    place: 텍스코코
    figure: 네사왈코요틀
    story: 네사왈코요틀은 1431년 텍스코코의 영주가 되어 1472년 사망할 때까지 그곳을 통치했습니다. 그는 시인이자 건축가로 기억됩니다. Texcoco 호수를 가로지르는 긴 제방은 그가 배치했다고 합니다. 16세기에 수집된 나와틀어 노래는 그의 이름과 관련이 있지만 그가 만들었는지는 확실하지 않습니다.
    story_prose:
      opening:
        - Texcoco, 1472. 네사왈코요틀은 41년 동안 이 도시의 영주였으며 현재 약 70세입니다. 그는 시인이자 건축가로 기억되고 있으며, 텍스코코 호수 건너편에 물을 나누는 긴 제방을 그가 놓았다고 합니다.
        - 역사상 그는 올해 세상을 떠났고, 그의 7살 난 아들 Nezahualpilli가 그의 뒤를 잇도록 선택되었습니다. 그의 이름에 묶인 노래는 약 100년 후에 노래책으로 복사되었으며, 누가 처음으로 노래했는지는 아무도 모릅니다. 이 분야에서는 그 노래를 아는 궁중 노창이 학습자에게 가르쳐 주고, 리허설에서 노래하는 사람이 다음 노래를 위한 신호를 남기고, 도우미가 연습지를 정리하는 역할을 합니다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 감시할 수 있는 사람, 대담하거나 매우 강인한 사람, 불안한 날에 아이를 안전하게 지켜줄 수면 조절 장치가 있는 사람; 음악을 가르쳤거나 아는 사람, 인내심이 있거나 질서가 있는 사람, 녹음기를 가진 사람이 노래를 한 줄씩 배우도록 하십시오. 조용히 사람과 함께 있어 줄 사람, 아픈 사람을 간호할 수 있는 사람, 홀로그램 프로젝터를 가지고 있는 사람이 그의 마지막 날에 그와 함께 앉아 있을 것입니다.
      outcomes:
        all: 그 해에 일곱 살 난 Nezahualpilli가 Texcoco의 영주로 선택되었습니다. 노래는 처음부터 끝까지 전해졌고, 학습자는 나중에 자신의 학습자에게 노래를 가르쳤습니다. 약 100년 후에 그 내용은 그의 이름으로 된 노래책에 복사되었습니다.
        p3: 그해 네사왈코요틀은 Texcoco에서 사망했습니다. 약 100년 후에 그의 이름과 관련된 노래들이 노래책으로 복사되었습니다. 500년 이상이 지난 후 그의 얼굴이 멕시코 100페소 지폐에 인쇄되었습니다.
        p2: 학습자는 노래를 잘 알게 되었고 나중에는 자신의 학습자에게 노래를 가르쳤습니다. 약 100년 후에 그 노래들은 그의 이름 옆에 적혀 있는 노래책으로 복사되었습니다.
        p1: 7세의 Nezahualpilli는 Texcoco의 영주로 선택되어 40년 이상 그 자리를 유지했습니다.
      none: 그해 네사왈코요틀은 Texcoco에서 사망했습니다. 늙은 가수가 병에 걸렸을 때 아직 노래를 모두 가르치지 않았고 연습 시트의 후반부는 공백으로 남아있었습니다. 선택의 날, 궁전은 일곱 살 소년을 기다려도 허사였습니다.
      desync: 그가 죽은 뒤 밤에는 아무도 문지방을 지키지 않았습니다. {staff}가 소환되었을 때 선택의 날은 아직 오지 않았고, 소년이 잤던 방은 비어 있었고, 매트는 벽에 기대어져 있었습니다.
      not_admitted: '{staff}는 궁전에 들어가지 않았고 마을에서 가수들이 연습하는 소리만 들었습니다. 한 가수가 한 대사를 마치고 다음 대사를 위한 공간을 남겨두기 위해 뒤로 물러났습니다. 누구의 노래인지, 듣는 사람마다 말하는 것이 달랐습니다.'
      points:
        p2:
          class_teaching: 그해 궁궐의 늙은 가수는 더 이상 오랫동안 노래를 부를 수 없었고 노래 중간에 숨을 쉬기 위해 멈춰야 했습니다. 그는 네사왈코요틀이라는 이름과 관련된 노래를 궁궐의 학습자에게 가르치려고 했습니다. 가르쳤던 {staff}는 학습자에게 한 줄씩 반복하게 하고, 다음 줄로 넘어가기 전에 각 줄을 익히고, 하루가 끝날 때 처음부터 전체를 복습하고, 줄이 틀린 곳마다 연습 시트의 가장자리를 표시하게 했습니다. 마지막 노래를 가르친 날 저녁, 학습자는 한 줄도 놓치지 않고 처음부터 끝까지 불렀다. 늙은 가수는 아무 말도 하지 않고 무릎 위에 손을 올려 조용히 시간을 눌렀습니다.
          else: 그해 궁궐의 늙은 가수는 더 이상 오랫동안 노래를 부를 수 없었고 노래 중간에 숨을 쉬기 위해 멈춰야 했습니다. 그는 네사왈코요틀이라는 이름과 관련된 노래를 궁궐의 학습자에게 가르치려고 했습니다. {staff}는 참을성 있게 그들 옆에 앉았습니다. 늙은 가수가 한 구절을 부를 때마다 학습자는 그것을 다시 불렀고, 학습자가 더듬거리는 부분에서는 노인에게 다시 불러달라고 요청했고, 한 번 충분하지 않으면 다시 불렀습니다. 마지막 노래를 가르친 날 저녁, 학습자는 한 줄도 놓치지 않고 처음부터 끝까지 불렀다. 늙은 가수는 아무 말도 하지 않고 무릎 위에 손을 올려 조용히 시간을 눌렀습니다.
        p3:
          class_medical: 그의 마지막 날에는 그의 방을 드나드는 사람들이 부드럽게 걸었다. 병자를 간호할 줄 아는 {staff}는 담요를 감싸고 술을 마시는 동안 컵을 들고 있다가 둘만 있을 때에만 가까이 다가가 앞으로 일어날 일에 대해 천천히 이야기하기 시작했습니다. 약 100년 후, 누군가는 그의 이름에 묶인 노래를 하나씩 책으로 복사했습니다. 500여 년이 지난 후에도 멀리 떨어진 사람들은 여전히 그의 이름을 알고 있었고 그의 얼굴이 그들의 돈에 새겨져 있었습니다. 그 말을 다 들은 그는 오랫동안 침묵하다가 고개를 돌려 호수가 있는 문밖을 내다보았습니다.
          else: 그의 마지막 날에는 그의 방을 드나드는 사람들이 부드럽게 걸었다. {staff}는 어느 날 오후 내내 그와 함께 앉아 있었고, 두 사람이 단둘이 있을 때만 앞으로 일어날 일에 대해 천천히 이야기하기 시작했습니다. 약 100년 후, 누군가는 그의 이름에 묶인 노래를 하나씩 책으로 복사했습니다. 500여 년이 지난 후에도 멀리 떨어진 사람들은 여전히 그의 이름을 알고 있었고 그의 얼굴이 그들의 돈에 새겨져 있었습니다. 그 말을 다 들은 그는 오랫동안 침묵하다가 고개를 돌려 호수가 있는 문밖을 내다보았습니다.
        p1: 그의 죽음 이후 귀족들은 누가 그의 뒤를 이을 것인지 결정하기 위해 모였고, 매일 더 많은 사람들이 궁전을 드나들었습니다. 일곱 살 된 Nezahualpilli는 한 방에서 다른 방으로 인도되었습니다. {staff}는 자기가 자는 방 밖을 지키며 밤에도 떠나지 않고, 낯선 사람이 와서 먼저 용무를 묻는 것을 막고, 소년이 자고 있을 때만 문지방 옆에 앉았다. 선택하는 날 아침, 소년은 망토 자락이 문지방에 닿은 채 손에 이끌려 문 밖으로 끌려나갔습니다. 누군가가 몇 밤 동안 앉아 있던 옆자리는 창백해졌습니다.
