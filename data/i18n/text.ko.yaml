        now: 이 지점에서 관리들은 {staff}가 모인 사람들이 제공한 지불금을 받아들입니다. 사마천은 그 처벌을 면하고 미완성 작업으로 돌아갈 수 있습니다.
        who: sima_qian_changan
        bio: 이 타임라인에서 사마천은 형벌을 회복했으며 거세되지 않았습니다. 그는 여전히 자신의 시대까지 과거의 역사를 완성했습니다.
    vignettes:
      dates: 서기는 1년 미만의 두 항목을 병합하기 시작합니다. 당신은 그들에게 각자의 계정에 날짜를 남겨달라고 요청합니다. 불일치가 시작되는 위치를 정확히 확인하는 것이 가능해집니다.
      witness: 점원은 더 좋은 이야기가 먼저 나오길 원합니다. 각 계정이 어떻게 책상에 도착했는지 묻습니다. 독자가 보아야 할 순서를 결정하기 전에 출처를 표시합니다.
      binding: 점원이 한 번 더 읽는 동안 두 쪽 모두 느슨하게 놓아두십시오. 묶음이 묶이면 짧은 라벨에 질문 하나가 아직 진행 중이라는 메시지가 표시됩니다.
  du_fu_xiang_river:
    name: 배 위의 시인
    place: 샹장강
    figure: 두보
    story: 두보의 이름으로 전해지는 시는 병에 걸렸을 때 배 위에서 지은 시로, 후난(湖南)의 친구들에게 전하는 시로 되어 있다. 이 시는 강과 해안의 장면을 연상시킵니다.
    story_prose:
      opening:
        - 770년, 상강을 따라 두보(두보)는 후난(湖南)의 친구와 친척들에게 36개의 운율로 구성된 장시를 읊었습니다. 제목에는 그가 병에 걸려 배를 타고 있을 때 썼다고 나와 있습니다.
        - 시와 제목은 살아남습니다. 그것이 어떻게 배달되었는지는 그렇지 않습니다. 이번 분기에서는 가족들이 여러 차례 페이지를 옮겨야 했고, 다음 착륙지는 정해지지 않았다.
        - 환자의 휴식을 도와줄 수 있는 사람, 페이지를 관리할 수 있는 사람, 교차점을 알고 수혜자의 이름을 기억할 수 있는 사람이 필요합니다.
      points:
        p3: '{staff}는 두보에게 어디를 멈추고 싶은지 묻고 그곳에서 구절을 전해줄 사람을 찾습니다. 배 건너편에서 두보(두보)는 누가 그것을 받아야 하는지 천천히 그에게 말한다. 남자는 패키지를 받기 전에 이름을 반복합니다. 두보는 듣고 작게 고개를 끄덕였습니다. 그런 다음에야 가족은 포장된 페이지를 옆면으로 넘겨 상대방의 손에 전달합니다.'
        p1: 사람들이 지나갈 수 있도록 보트를 치워야 합니다. {staff}는 시트 수를 세고 두보가 가리키는 순서대로 바람을 피해 보드 위로 옮깁니다. 두보는 중간 페이지에 손을 뻗어 첫 번째 단어를 읽습니다. 모든 것이 옮겨진 후에도 공간은 그대로 남아 있습니다. 두푸는 누구에게도 찾아보라고 하지 않고도 다음 잎사귀를 꺼낼 수 있습니다.
        p2: '{staff}는 어느 쪽이 눕기 편한지 묻고, 두보를 지탱하는 낡은 천을 접어서 물이 미끄러지지 않는 곳으로 이동시킨다. 그는 조금 긴장을 풀고 컵에 다가갑니다. 배는 한 번 움직인다. 컵이 소리를 내지만 똑바로 세워져 있습니다.'
      outcomes:
        all: 보트가 착륙장에서 이동할 때 가족은 두보에게 원고를 돌려줍니다. 한 사본은 손에 닿을 수 있고 다른 사본은 이미 배송 중입니다.
        p3: 다른 배에서 운송인은 먼저 종이를 보관할 마른 장소를 찾습니다. 보트가 지나갈 때에도 두보는 천을 감싸는 모서리를 볼 수 있습니다.
        p1: 페이지는 바람이 닿지 않는 곳에 순서대로 유지됩니다. 착지한 후 두보는 다시 중간 시트를 꺼냅니다.
        p2: 두푸는 배에서 잠시 쉬고 있다. 그 컵은 그가 보지 않고도 찾을 수 있는 곳에 여전히 놓여 있습니다.
      none: 마지막 보트가 착륙장을 떠났습니다. 래핑된 페이지는 원래 위치에 그대로 남아 있습니다.
      not_admitted: '{staff}는 보트를 찾지 못합니다. 젖은 계류용 로프 한 줄이 하나씩 당겨진다.'
      desync: 물건을 옮긴 후 중간 잎 몇 개가 없어졌습니다. 기관이 {staff}를 회수했을 때 뱃사공은 여전히 첫 번째 시트와 마지막 시트를 들고 있습니다.
      excerpts:
        p3: 두보는 듣고 작게 고개를 끄덕였습니다. 그런 다음에야 가족은 포장된 페이지를 옆면으로 넘겨 상대방의 손에 전달합니다.
        p1: 모든 것이 옮겨진 후에도 공간은 그대로 남아 있습니다. 두푸는 누구에게도 찾아보라고 하지 않고도 다음 잎사귀를 꺼낼 수 있습니다.
        p2: 배는 한 번 움직인다. 컵이 소리를 내지만 똑바로 세워져 있습니다.
    relic: 뱃사공의 기름등잔
    relic_desc: 몇 줄의 시에 뒤늦게 불이 붙은 작은 점토 램프.
    points:
      p1: 후난에 있는 친구들을 위한 장시를 정리할 수 있도록 배에 두보의 페이지를 위한 자리를 마련하세요
      p2: 배 위에서 그의 병을 간호하고 그의 고통을 완화시켜라
      p3: 두보에게 다음에는 어디에서 머물고 싶은지 물어보고 그의 가족이 완성된 구절을 친구들에게 전할 사람을 찾도록 도와주세요.
    points_fail:
      p1: 서둘러 움직이면 처음과 마지막 잎만 나옵니다. 시는 조립할 수 없으며 사무실에서는 직원을 회상합니다.
      p2: 그는 겨울 배에서 베개를 베고 누워 있으며 날이 갈수록 악화됩니다.
      p3: 다음 배는 가족이 시를 가져갈 사람을 찾기 전에 출발합니다. 그들은 그것을 다른 층계참으로 운반해야 합니다.
    shift:
      p1:
        was: 770년에 배에 탄 두보(두보)는 제목에서 알 수 있듯이 후난(湖南)에 있는 그의 친구들과 친척들을 위해 36개의 운율로 된 시를 썼습니다.
      p2:
        was: 두보(두보)가 후난(Hunan)에 있는 친구들에게 보낸 시에는 배를 타고 아픈 동안 글을 쓰는 모습이 묘사되어 있습니다.
        now: 그해 겨울 그는 보트에서 덜 고통을 겪었습니다.
      p3:
        was: 이 시는 후난(Hunan)에 있는 친구들에게 전달되었습니다. 제목에는 그것이 어떻게 그들에게 도달했는지에 대한 기록이 없습니다.
        now: 이 지점에서 가족은 두보가 선택한 곳을 정차합니다. 층계참에 있던 누군가가 앞으로 그 구절의 사본을 가져가겠다고 제안하고 그것을 받을 사람의 이름을 반복해서 말해 줄 수 있습니다.
    vignettes:
      shore: 여행자는 해안이 우울해 보인다고 썼습니다. 당신은 그들이 배에서 눈을 뜨게 된 이유가 무엇인지 묻습니다. 그들은 잠시 멈추고 실제로 거기에 있었던 일을 한 가지 적습니다.
      delivery: 당신은 다음 배가 친구의 마을까지 가는 도중에만 간다는 말을 들었습니다. 여행자는 두 번째 이름이 적힌 메모를 거의 접을 뻔했습니다. 당신은 그들이 앞으로 나아갈 수 있는 사람을 찾도록 도와줍니다.
      damp: 여행자는 스프레이가 보드에 도달한 위치를 기록합니다. 그들이 인사말을 다 쓰는 동안 당신은 그 아래에 마른 조각을 깔아 놓습니다.
  vesalius_padua:
    name: 같은 도판의 두 판본
    place: 레겐스부르크
    figure: 안드레아스 베살리우스
    story: 1546년 레겐스부르크에서 쓴 편지에서 베살리우스는 자신의 삽화를 복사하고 축소한 판을 비판했습니다. 그는 복사된 일부 인물의 왜곡에 반대했습니다.
    story_prose:
      opening:
        - 레겐스부르크, 1546년 6월. 베살리우스는 그의 삽화를 복사한 또 다른 책에 대해 동료에게 편지를 쓰고 있습니다. 그는 규모 축소에 반대하고 일부 라인의 진행 과정에 의문을 제기합니다.
        - 역사상 그의 편지에는 그러한 반대 의견이 보존되어 있었습니다. 나중에 비교한 결과 모든 반대가 실질적인 차이에 해당하는 것은 아니라는 사실이 밝혀졌습니다. 이 지점의 서점에는 아직 발송할 사본이 쌓여 있습니다.
        - 두 버전을 인식할 수 있는 사람이 도움을 줄 수 있습니다. 또한 책이 출판되기 전에 각 사본에 동일한 메모를 넣도록 서점을 설득할 수 있는 사람도 필요합니다.
      points:
        p1: '{staff}는 카운터에 두 버전을 모두 배치하여 그림이 더 작은 부분과 Vesalius가 특정 반대를 제기한 부분을 표시합니다. 서점에서는 어떤 주장을 자신있게 할 수 있는지 묻습니다. 확인되지 않은 부분은 삭제하고, 독자가 찾아볼 수 있는 페이지 번호를 남겨둡니다. 서점은 맨 위 사본을 열고 접시 옆에 메모를 밀어 넣습니다. 책을 닫아도 얇은 흰색 가장자리가 여전히 보입니다.'
      outcomes:
        all: 책이 출판된 후, 한 독자는 전표에 있는 페이지 번호를 사용하여 다른 판을 빌립니다. 두 인물 모두 동일한 펜을 가로질러 테이블 위에 놓여 있습니다.
        p1: 책이 출판된 후, 한 독자는 전표에 있는 페이지 번호를 사용하여 다른 판을 빌립니다. 두 인물 모두 동일한 펜을 가로질러 테이블 위에 놓여 있습니다.
      none: 서점은 마지막 꾸러미를 묶습니다. 반만 쓴 쪽지는 아직도 카운터 밑에 있습니다.
      not_admitted: '{staff}는 서점을 결코 보지 못합니다. 샘플이 접시 위에 열려 있고, 카운터를 지나가는 고객이 잠시 뒤집었습니다.'
      excerpts:
        p1: 서점은 맨 위 사본을 열고 접시 옆에 메모를 밀어 넣습니다. 책을 닫아도 얇은 흰색 가장자리가 여전히 보입니다.
    relic: 두 개의 표시가 있는 증명
    relic_desc: 두 에디션에 대해 별도의 표시가 있는 상상의 인쇄물입니다.
    points:
      p1: 서점에 아직 재고가 있는 사본과 함께 문제의 판을 식별하는 메모를 포함하도록 요청하세요.
    points_fail:
      p1: 직원은 유통업체와 합의에 이르지 못했고, 그 시트 없이 사본이 나갔다.
    shift:
      p1:
        was: '1546년 6월 13일: 베살리우스는 레겐스부르크에서 글을 쓰고 복사된 수치가 왜곡되었다고 생각하는 내용을 비판했습니다.'
        now: '{staff}는 유통업체가 문제의 플레이트를 식별하고 독자에게 원본을 가리키는 시트를 동봉하도록 합니다.'
        who: vesalius_padua
        bio: 사본을 읽은 독자들은 베살리우스가 이의를 제기한 수치를 식별하는 메모를 받았습니다.
  shakespeare_globe:
    name: 아버지에게 전할 말
    place: 스트랫퍼드어폰에이번
    figure: 윌리엄 셰익스피어
    story: Stratford 기록에는 1596년 8월 11일에 Hamnet Shakespeare가 매장되었다고 기록되어 있습니다. 매장되기 전에 그의 아버지가 어디에 있었는지는 나와 있지 않습니다. 이 지부에서는 한 가족이 그에게 메시지를 전달하는 데 도움을 요청합니다.
    story_prose:
      opening:
        - Stratford-upon-Avon, 1596년 8월. 교구 등록부에는 소년의 이름과 매장 날짜가 보존됩니다. 햄넷은 열한 살이에요.
        - 역사상 햄넷은 8월 11일에 매장되었다. 기록에는 그의 아버지가 돌아올 날짜가 나와 있지 않습니다. 이 가지에서 가족들은 편지를 접고 어두워지기 전에 누군가가 그것을 가져가기를 바랍니다.
        - 여행자가 어디에서 멈추는지 아는 사람이 여기에 도움을 줄 수 있습니다. 그래서 낯선 사람을 설득하여 편지로 조금 더 멀리 나아갈 수 있는 사람도 있을 수 있습니다.
      points:
        p1: '{staff}는 문앞에서 두 번 물어보고 다음 정거장을 아는 메신저를 찾습니다. 메신저는 겉에 적힌 이름을 읽고 그것을 마른 안주머니에 밀어 넣습니다. Hamnet은 William이 집에 왔을 때에도 여전히 깨어 있습니다. 소년은 침대 가장자리에 아버지를 위한 작은 공간을 마련하기 위해 자리를 옮겼습니다.'
      outcomes:
        all: 윌리엄은 창문이 어두워질 때까지 거기 앉아 있었습니다. 그는 물을 찾으러 일어나면 돌아오는 길에 의자를 찾을 수 있도록 의자를 더 가까이 옮깁니다.
        p1: 윌리엄은 창문이 어두워질 때까지 거기 앉아 있었습니다. 그는 물을 찾으러 일어나면 돌아오는 길에 의자를 찾을 수 있도록 의자를 더 가까이 옮깁니다.
      none: 황혼이 출입구에 도달합니다. 접힌 편지는 아직 컵 밑에 있습니다.
      not_admitted: '{staff}는 그들이 기다리고 있는 집 안으로 절대 들어가지 않습니다. 누군가 문을 지나갑니다. 열리지 않습니다.'
      excerpts:
        p1: Hamnet은 William이 집에 왔을 때에도 여전히 깨어 있습니다. 소년은 침대 가장자리에 아버지를 위한 작은 공간을 마련하기 위해 자리를 옮겼습니다.
    relic: 접힌 메시지
    relic_desc: 전달자가 도움을 줄 수 있는 다음 사람의 이름을 추가할 수 있는 공간이 포함된 상상의 편지입니다.
    points:
      p1: 셰익스피어에게 연락하여 방문 시간에 맞춰 그에게 가족의 메시지를 전달할 수 있는 사람을 찾으세요.
    points_fail:
      p1: 그 직원은 메시지를 제때에 전달하겠다고 약속할 수 있는 사람을 찾지 못했습니다.
    shift:
      p1:
        was: '1596년 8월 11일: 햄넷 셰익스피어가 스트랫퍼드어폰에이번에 묻혔습니다. 기록에는 그의 아버지가 사전에 그와 함께 있었는지 여부가 기록되어 있지 않습니다.'
        now: '{staff}는 셰익스피어와 연락할 수 있는 메신저를 찾습니다. 이 지부에서 그는 시간에 맞춰 집에 돌아와 아들과 함께 저녁을 보냅니다.'
        who: shakespeare_globe
        bio: 윌리엄 셰익스피어는 아들이 죽기 직전에 햄넷과 함께 저녁을 보낼 수 있었습니다.
  timbuktu_sankore:
    name: 떠나는 상단에 한 자리
    place: 말리 팀북투
    figure: 팀북투의 학자들
    story: 1468년경 팀북투의 손이 바뀌자 학자들은 도시를 떠나 왈라타(Walata)를 비롯한 여러 곳으로 떠났습니다. 이 지점에서는 한 가구가 함께 떠날 계획을 세우고 있는 장소가 필요합니다.
    story_prose:
      opening:
        - 1468년경 팀북투는 주인이 바뀌었습니다. 후기 연대기 작가는 학식 있는 가족들이 도시를 떠나 일부는 왈라타로 갔던 것을 기억했습니다.
        - 역사상 연대기는 출발하는 그룹을 기록했습니다. 이 지점에서는 한 가구가 이미 짐을 꾸리고 있지만 아직 물주머니 몇 개는 표시하지 않았습니다. 그들은 어느 쪽이 기다릴지 모릅니다.
        - 여행 일행의 구성 방식을 이해하는 사람이 도움을 줄 수 있습니다. 그들은 아직 누가 예상되는지 알아내고 가족과 함께 첫 번째 단계를 밟아야 할 것입니다.
      points:
        p1: '{staff}는 가이드가 기다리기로 동의할 때까지 한 파티에서 다른 파티로 갔다가 다시 돌아와 가족이 물과 묶음을 세는 것을 돕습니다. 첫 번째 정류장에서는 다른 가족이 매트를 펼칩니다. 가장 작은 아이가 집에서 가장 작은 물주머니를 가져와 두 매트 사이에 놓습니다. 아이가 손을 떼어도 물주머니는 쓰러지지 않습니다.'
      outcomes:
        all: 다음날 아침, 나란히 놓인 두 개의 매트가 말아 올려집니다. 작은 가방이 먼저 지나간 후 누군가가 아이를 들어 올립니다.
        p1: 다음날 아침, 나란히 놓인 두 개의 매트가 말아 올려집니다. 작은 가방이 먼저 지나간 후 누군가가 아이를 들어 올립니다.
      none: 누군가가 다시 와서 물어볼 때쯤에는 마지막 그룹이 사라졌습니다. 가족은 묶인 묶음을 문을 통해 다시 운반합니다.
      not_admitted: '{staff}가 가구를 찾지 못했습니다. 문 옆에서 누군가 물주머니 두 개를 함께 옮기고 있습니다.'
      excerpts:
        p1: 가장 작은 아이가 집에서 가장 작은 물주머니를 가져와 두 매트 사이에 놓습니다. 아이가 손을 떼어도 물주머니는 쓰러지지 않습니다.
    relic: 물주머니 수를 적은 표
    relic_desc: 가정에 맡겨진 물주머니의 개수를 계산하는 데 사용되는 상상의 집계입니다.
    points:
      p1: 출발하는 캐러밴이 있는 한 가구의 장소를 찾아 첫 번째 안전한 정류장까지 안내합니다.
    points_fail:
      p1: 직원이 가족을 위한 장소를 마련하기 전에 그룹이 떠났습니다.
    shift:
      p1:
        was: '1468년경: 팀북투의 손이 바뀌자 학자들은 도망쳤습니다. 일부는 Walata로갔습니다.'
        now: '{staff}는 한 가구가 Walata로 이동하는 그룹에 합류하도록 돕고 첫 번째 안전한 정류장까지 안내합니다.'
        who: timbuktu_sankore
        bio: 팀북투를 떠나는 한 가구는 함께 여행할 일행을 찾아 무사히 첫 번째 정류장에 도착했다.
  al_haytham_cairo:
    name: 건너편 강가의 방
    place: 푸스타트
    figure: 이븐 알하이삼
    story: Fustat는 1020년의 불안으로 인해 화재를 겪었습니다. 이븐 알하이삼의 광학 작업은 이집트에서 그가 했던 시절의 것입니다. 이 지점에서 그는 피해를 입은 거리 중 한 곳에서 광학 원고를 빌린 독자를 만나고 있습니다.
    story_prose:
      opening:
        - Fustat, 1020. 연대기에는 화재로 인해 집과 소유물이 파괴된 것으로 묘사되어 있습니다. 이집트에 있는 동안 이븐 알하이삼은 빛이 눈에 어떻게 도달하는지 연구했습니다.
        - 역사상, 화재로 인해 집이 소실되었습니다. 소식통은 이븐 알하이삼을 특정 거리에 배치하지 않습니다. 이 분야에서는 그가 몇 페이지를 함께 읽으려고 계획한 독자가 피해를 입은 거리 중 한 곳에 살고 있습니다.
        - 머리가 맑고 방향을 제시할 수 있는 사람이 도움을 줄 수 있습니다. 원고는 나중에 읽을 수 있습니다. 먼저 독자가 거리 끝까지 갈 수 있는지 알아보십시오.
      points:
        p1: '{staff}가 판독기를 찾았을 때 그의 문 뒤의 빛은 이미 희미해졌습니다. 그는 다른 페이지로 돌아가고 싶어합니다. {staff}는 그에게 자신이 가지고 있는 스택을 꺼내고 이웃이 정리한 길로 떠나라고 요청합니다. 그를 세워줄 수 있는 집에서 그는 울퉁불퉁한 더미를 무릎 위에 얹고 앉아 있다. 종이 한 장이 바닥으로 미끄러집니다. 맞은편 사람이 주워서 그가 가리킨 자리에 도로 놓습니다.'
      outcomes:
        all: 이븐 알하이삼은 나중에 그를 만나러 옵니다. 집에는 의자가 하나뿐이어서 두 사람은 낮은 테이블 옆에 앉아 다시 페이지를 찾습니다.
        p1: 이븐 알하이삼은 나중에 그를 만나러 옵니다. 집에는 의자가 하나뿐이어서 두 사람은 낮은 테이블 옆에 앉아 다시 페이지를 찾습니다.
      none: 거리는 결국 폐쇄됩니다. 이븐 알하이삼이 요청할 때 그가 할 수 있는 일은 대출금이 기록된 전표를 손에 쥐는 것뿐입니다.
      not_admitted: '{staff}는 길 끝에서 누군가가 길을 보여줄 때까지 기다립니다. 문을 닫으라는 목소리가 들리고 곧 명확하게 들리지 않습니다.'
      excerpts:
        p1: 종이 한 장이 바닥으로 미끄러집니다. 맞은편 사람이 주워서 그가 가리킨 자리에 도로 놓습니다.
    relic: 여분의 종이 한 묶음
    relic_desc: 이 분기에서 다른 집에 맡겨 둔 가상의 광학 연구 노트 한 묶음.
    points:
      p1: 불이 거리에 닿기 전에 독자를 꺼내 빌린 원고를 안전한 장소로 찾으세요.
    points_fail:
      p1: 직원은 빌린 페이지를 가지고 나갈 수 있도록 제 시간에 독자에게 연락하지 않았습니다.
    shift:
      p1:
        was: '1020년: 불안한 가운데 푸스타트(Fustat)의 일부 지역에 불이 붙었습니다. 기록에는 그날 이븐 알하이삼이나 그의 원고가 어디에 있었는지 나와 있지 않습니다.'
        now: '{staff}는 독자를 영향을 받은 거리 밖에 있는 가정으로 안내합니다. 이븐 알하이삼은 독자와 함께 원고 검토를 재개할 수 있습니다.'
        who: al_haytham_cairo
        bio: Fustat에서 화재가 발생하는 동안 독자와 그들에게 맡겨진 페이지가 안전해졌습니다.
  li_bai_changan:
    name: 강가에 닿은 소식
    place: 양쯔강의 우산
    figure: 이백
    story: 이백는 예랑에서 유배형을 선고받고 도중에 사면을 받았다. 그의 수집 작품 중 한 설명은 사면을 Wushan과 연관시킵니다. 그가 들은 정확한 날짜는 불확실하다.
    story_prose:
      opening:
        - 759년경 Wushan 근처에 상륙했습니다. 이백는 Yelang으로 망명하기 위해 강 상류로 여행하고 있습니다. 그의 여행에 대한 기록은 나중에 이 강을 그의 용서와 연관시킬 것입니다.
        - 역사상 사면은 그가 예랑에 도착하기 전에 이루어졌습니다. 그가 듣는 날은 정해지지 않았습니다. 이 지점에서는 상류의 다음 보트가 아직 선적 중일 때 여행자가 뉴스 사본을 가져왔습니다.
        - 이 여행에는 보트와 정류장을 아는 사람이 필요합니다. 누군가는 이 소식을 이백의 손에 넘기기 전에 원본을 본 사람이 누구인지, 어디에서 복사했는지 알아내야 합니다.
      points:
        p1: '{staff}는 사본을 준 메신저에게 물어본 뒤, 그 사람의 손을 아는 승객을 찾아 계좌가 동의되기를 기다린 후 페이지를 들고 서둘러 착륙장으로 내려간다. 이백는 그것을 펼치고 마지막 줄을 두 번 읽습니다. 승무원이 승객을 부르자 그는 이미 상류 보트에 있는 침구를 말아서 반대 방향으로 가는 뱃사공에게 건네줍니다.'
      outcomes:
        all: 하류 보트가 착륙 지점을 지나 회전하자 이백는 사본을 다시 접습니다. 그의 소매는 아직 젖어 있다. 그는 접힌 부분을 마른 면으로 덮습니다.
        p1: 하류 보트가 착륙 지점을 지나 회전하자 이백는 사본을 다시 접습니다. 그의 소매는 아직 젖어 있다. 그는 접힌 부분을 마른 면으로 덮습니다.
      none: 누군가가 그 소식을 정박시켰을 때 상류의 배는 이미 멀리 떠나 있었습니다. 계류장 옆에는 길 잃은 밀짚 밧줄이 놓여 있습니다.
      not_admitted: '{staff}는 보트까지 멀리 가지 않습니다. 차양은 사람들이 그 안에 짐을 꾸리는 소리를 들을 수 있을 만큼 서로 가깝습니다.'
      excerpts:
        p1: 이백는 그것을 펼치고 마지막 줄을 두 번 읽습니다. 승무원이 승객을 부르자 그는 이미 상류 보트에 있는 침구를 말아서 반대 방향으로 가는 뱃사공에게 건네줍니다.
    relic: 젖지 않은 편지 포장
    relic_desc: 배로 강을 건너는 사람이 편지를 젖지 않게 넣어 둘 법한 가상의 포장지.
    points:
      p1: 보트가 상류로 계속되기 전에 이백에게 사면 소식을 확인하세요.
    points_fail:
      p1: 직원은 보트가 출발하기 전에 소식을 전하지 못했습니다.
    shift:
      p1:
        was: '759년경: 이백은 예랑으로 가는 도중에 사면을 받았습니다. 그의 수집된 작품에 대한 후기는 그를 당시 Wushan 근처에 두었습니다.'
        now: '{staff}는 다음 출발 전에 착륙 소식을 전합니다. 이백는 그날 아침 배를 타고 하류로 돌아섰다.'
        who: li_bai_changan
        bio: 이백는 다음 배가 출발하기 전에 그의 사면 소식을 듣고 더 빨리 돌아올 수 있었습니다.
  li_shizhen_qizhou:
    name: 아직 읽을 수 있을 때 도착한 교정쇄
    place: 기주
    figure: 이시진
    story: 이시진은 수년에 걸쳐 Materia Medica 개요서를 개정했습니다. Jinling 판은 그의 죽음 이후에 나타났습니다. 이 지점에서 프린터는 그에게 단일 시험 페이지를 보낼 수 있습니다.
    story_prose:
      opening:
        - Qizhou, 1592년경. 이시진은 수년간 Materia Medica 개요서를 개정했습니다. 그가 펼쳐도 여전히 자신을 바꿀 수 있는 책은 바로 그의 원고다.
        - 역사상 금릉본 전체는 그가 죽은 후에 나타났다. 이 지점에서는 프린터가 시험 페이지를 잘라냈습니다. Jinling에서 Qizhou에 도달할 수 있는지 여부는 아직 결정되지 않았습니다.
        - 인쇄나 교정을 아는 사람이 여기에 도움을 줄 수 있습니다. 각 끝은 시트를 읽을 사람과 표시한 후 다시 가져갈 사람을 알아야 합니다.
      points:
        p1: '{staff}는 프린터에 시트 한 장만 보내는 데 동의하고 두 장소를 오가는 여행자에게 이를 맡긴 다음 돌아오는 길에 시트를 회수하도록 준비합니다. 이시진은 교정쇄와 원고를 나란히 펴고 원하는 선 옆에 손톱을 올려놓는다. 그는 여백에 한 글자를 쓰고 그것이 마를 때까지 기다렸다가 두 장을 따로 접습니다.'
      outcomes:
        all: 여행자는 다음날 다시 돌아온다. Li는 마른 시트를 건네고 손가락은 여전히 자신이 수정한 문자 위에 놓여 있습니다.
        p1: 여행자는 다음날 다시 돌아온다. Li는 마른 시트를 건네고 손가락은 여전히 자신이 수정한 문자 위에 놓여 있습니다.
      none: 증거가 나오지 않습니다. Li는 원고의 문자를 변경하고 잉크를 종이 가장자리에서 더 멀리 이동시킵니다.
      not_admitted: '{staff}는 증거를 가지고 다닐 수 있는 사람을 결코 만나지 않습니다. 각각 다른 주소가 표시된 종이 묶음이 상점 문을 통과합니다.'
      excerpts:
        p1: 이시진은 교정쇄와 원고를 나란히 펴고 원하는 선 옆에 손톱을 올려놓는다. 그는 여백에 한 글자를 쓰고 그것이 마를 때까지 기다렸다가 두 장을 따로 접습니다.
    relic: 교정쇄 한 장
    relic_desc: 저자가 여백에 수정 표시를 할 수 있는 가상의 교정쇄.
    points:
      p1: 이시진이 확인할 수 있는 동안 프린터에서 시험 페이지 하나를 Qizhou로 보내도록 하세요.
    points_fail:
      p1: 그 직원은 제때에 도착할 증거를 준비하지 않았습니다.
    shift:
      p1:
        was: '1596년: 이시진이 죽은 후 금릉본이 출판되었습니다. 그는 살아서 책 전체가 출판되는 것을 보지 못했습니다.'
        now: '{staff}는 평가판 페이지 1개를 확보합니다. 이시진은 테이블에서 그것을 읽고 여백을 수정하여 다시 보냅니다.'
        who: li_shizhen_qizhou
        bio: 이시진은 정식판이 나오기 전에 자신의 책의 인쇄된 교정본 하나를 보고 표시했습니다.
  bose_calcutta:
    name: 현금으로 바꾸지 않은 수표
    place: 캘커타
    figure: 자가디시 찬드라 보스
    story: 1885년 보스는 프레지던시 칼리지에서 물리학을 가르치기 시작했습니다. 그의 급여는 유럽 동료들에게 제안된 것보다 낮았습니다. 그는 논쟁 중에도 계속 가르치고 낮은 급여를 거부했습니다.
    story_prose:
      opening:
        - 1885년 캘커타. 보스는 프레지던시 칼리지에서 물리학을 가르치고 있습니다. 대학은 같은 일을 하는 유럽 동료들보다 그에게 더 적은 제안을 제공합니다. 그는 계속 가르치고 있습니다.
        - 역사상 분쟁이 해결되기까지 약 3년의 시간이 흘렀습니다. 이 지점에서는 아직 첫 번째 금액이 징수되지 않았으며 사무실에서 다른 수표를 발행할 시간이 아직 남아 있습니다.
        - 여기에서는 급여 조건을 읽을 수 있는 사람이 도움이 될 것입니다. 또한 서명을 담당하는 사람에게 두 가지 교육 과제를 비교하는 방법을 들려줄 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 일주일 간의 수업과 두 급여 조건을 모두 한 페이지에 기록한 다음 장부가 내려지는 동안 Bose를 사무실에서 기다립니다. 새로운 용어가 작성되면 Bose는 손가락으로 숫자를 따라갑니다. 수표가 다시 책상 위로 옵니다. 이번에는 양손으로 가져갑니다.'
      outcomes:
        all: Bose가 교실로 돌아오면 아직 시연이 시작되지 않았습니다. 그는 수표를 주머니에 넣고 먼저 학생들을 위한 공간을 비워줍니다.
        p1: Bose가 교실로 돌아오면 아직 시연이 시작되지 않았습니다. 그는 수표를 주머니에 넣고 먼저 학생들을 위한 공간을 비워줍니다.
      none: 사무실에서 원래 금액을 다시 보냅니다. 보스는 그것을 보고 종이를 카운터 너머로 다시 밀어냅니다.
      not_admitted: '{staff}는 계약서가 서명된 방에 절대 들어가지 않습니다. 수업은 홀 반대편 끝에서 끝나고 발 밑에서 보드가 삐걱거립니다.'
      excerpts:
        p1: 수표가 다시 책상 위로 옵니다. 이번에는 양손으로 가져갑니다.
    relic: 급여 영수증
    relic_desc: 그가 이 분기에서 받기로 한 첫 번째 수표에 대한 상상 속의 영수증.
    points:
      p1: Bose가 가르치는 첫 해에 서면으로 동일 임금 제안을 받으세요.
    points_fail:
      p1: 그 직원은 첫해에 동등한 조건을 보장받지 못했고 Bose는 계속해서 낮은 급여를 거부했습니다.
    shift:
      p1:
        was: '1885년: 보스는 프레지던시 칼리지에서 가르치기 시작했습니다. 그는 낮은 임금을 거부했고, 분쟁이 해결되기까지 약 3년이 걸렸다.'
        now: '{staff}는 동료들과 동일한 조건으로 서면 제안을 받았습니다. Bose는 이를 읽고 해당 조건에 따라 발행된 첫 번째 수표를 수락합니다.'
        who: bose_calcutta
        bio: Bose는 Presidency College에서 첫해에 동등한 임기를 받았습니다.
  li_qingzhao_hangzhou:
    name: 이 상자를 이웃에게 맡기다
    place: 회계
    figure: 이청조
    story: 이청조는 그녀가 Kuaiji에 머물면서 이미 그녀의 책과 그림이 반복적으로 손실을 입었다고 썼습니다. 그녀는 그곳에서 도난당한 일과 18권의 두루마리를 되찾은 일을 묘사했습니다.
    story_prose:
      opening:
        - 이청조가 Kuaiji에 머물 때까지 그녀는 이미 책과 그림을 여러 번 잃어 버렸습니다. 그녀는 금속과 돌의 기록(『금석록』)에 후기를 쓰면서 여행 중 이 부분에서 누락된 내용의 상당 부분을 설명할 수 있었습니다.
        - 역사상 Kuaiji의 도난으로 인해 그녀는 수집품 중 더 많은 비용을 지불했습니다. 그녀는 두루마리 18권을 되찾았습니다. 이 지점에서는 상자가 여전히 방에 있습니다. 한 사람은 일어나지 않고도 침대에 닿을 수 있을 만큼 침대 가까이에 서 있습니다.
        - 책과 그림을 관리하는 방법을 아는 사람이 도움을 줄 수 있습니다. 이웃 사람들이 망설인다면, 상자를 어디로 갈지, 상자를 돌려받고 싶을 때 어느 문을 두드려야 할지 합의하려면 인내심이 필요합니다.
      points:
        p1: 이청조는 침대 옆 상자를 열고 두루마리 두 권을 꺼내 한 권을 돌려준다. {staff}는 이웃에게 상자와 자물쇠를 살펴보라고 요청한 다음 각자 동일한 숫자에 표시하도록 합니다. 그것을 꺼내기 전에 이청조는 뚜껑 아래 틈에 짧은 붓을 밀어 넣습니다. 이웃은 아래에서 무게를 받습니다. 그녀는 다른 쪽 끝을 잡고 함께 문지방을 넘습니다.
      outcomes:
        all: 가슴을 되돌리면 먼저 솔을 찾습니다. 아직 뚜껑 옆에 있어요. 종이 한 모퉁이에서 그녀는 뇌졸중을 시도합니다. 그녀가 기억하는 것보다 잉크가 더 천천히 퍼집니다.
        p1: 가슴을 되돌리면 먼저 솔을 찾습니다. 아직 뚜껑 옆에 있어요. 종이 한 모퉁이에서 그녀는 뇌졸중을 시도합니다. 그녀가 기억하는 것보다 잉크가 더 천천히 퍼집니다.
      none: 도난당한 후 그녀는 되찾을 수 있었던 두루마리를 펼쳐 놓았습니다. 계산이 끝나면 그녀의 손은 테이블의 맨 부분에 얹혀집니다.
      not_admitted: '{staff}는 이청조를 결코 만나지 않습니다. 문 너머로 상자가 닫히는 소리가 들린다.'
      excerpts:
        p1: 그것을 꺼내기 전에 이청조는 뚜껑 아래 틈에 짧은 붓을 밀어 넣습니다. 이웃은 아래에서 무게를 받습니다. 그녀는 다른 쪽 끝을 잡고 함께 문지방을 넘습니다.
    relic: 상자 속 물건을 적은 표
    relic_desc: 다른 곳에 맡기기로 한 상자 하나의 내용물을 적은 가상의 표.
    points:
      p1: 도난당하기 전에 이청조가 선택한 상자 중 하나를 신뢰할 수 있는 이웃이 맡도록 준비합니다.
    points_fail:
      p1: 직원은 가슴을 맡을 수 있는 사람을 찾지 못했습니다.
    shift:
      p1:
        was: '1131년경: 이청조는 Kuaiji의 숙소에서 도난 사건을 회상했습니다. 그 후 그녀는 18개의 두루마리를 되찾았습니다.'
        now: '{staff}는 자신이 선택한 상자 중 하나를 다른 집에 보관하도록 준비합니다. 이청조는 나중에 내용을 그대로 유지하면서 그것을 회수합니다.'
        who: li_qingzhao_hangzhou
        bio: 이청조는 이웃에게 맡겼던 책과 사진이 담긴 상자를 되찾았습니다.
  ibn_al_nafis_cairo:
    name: 다른 독자의 손에 건넨 한 권
    place: 카이로
    figure: 이븐 알나피스
    story: 이븐 알나피스는 말년에 도서관을 떠나 병원으로 떠났습니다. 그가 기획한 의학 백과사전은 미완성 상태였고 남아 있는 부분은 분산되어 있다. 이 분야에서는 두 번째 독자가 완성된 책 중 하나에 대한 책임을 맡겠다고 제안합니다.
    story_prose:
      opening:
        - 카이로, 1288. 말년에 이븐 알나피스는 도서관을 떠나 병원으로 떠났습니다. 그의 대규모 계획 의료 백과사전은 미완성 상태로 남아 있으며 오늘날에도 일부만 읽을 수 있습니다.
        - 역사상 전기에는 그가 이후의 모든 책을 추적하지 않고 도서관을 떠난 곳이 기록되어 있습니다. 이 분야에서는 자주 오는 독자가 자신이 읽고 있는 책을 끝까지 읽고 싶어합니다.
        - 책을 대여하고 반납하는 방법을 이해하는 사람이 도움을 줄 수 있습니다. 계약서는 나중에 독자들이 실제로 찾을 수 있는 주소를 제공해야 합니다.
      points:
        p1: 독자는 원래 이달 말까지만 대출을 원했습니다. {staff}는 두 사람에게 먼저 볼륨을 보관할 위치와 다른 독자를 위해 문을 열어줄 사람에 대해 합의하도록 요청합니다. 이븐 알나피스는 표지를 뒤집고 아직 확인하지 않은 내용을 지적합니다. 독자는 방금 서명한 이름을 엄지손가락으로 반쯤 가리고 책 위에 전표를 놓습니다. 그는 잉크가 마른 후에만 그것을 움직입니다.
      outcomes:
        all: 나중에 누군가가 전표에 적힌 주소로 볼륨을 찾으러 옵니다. 문 앞에 있는 사람은 책을 내려놓고 첫 장의 종이를 건네줍니다.
        p1: 나중에 누군가가 전표에 적힌 주소로 볼륨을 찾으러 옵니다. 문 앞에 있는 사람은 책을 내려놓고 첫 장의 종이를 건네줍니다.
      none: 누구도 볼륨을 계속 사용할 수 있는 주소를 남기지 않습니다. 전표는 비어 있습니다. 그 책은 여전히 같은 더미에 있습니다.
      not_admitted: '{staff}는 절대 안으로 들어가지 않습니다. 창가에 있는 사람은 바깥에서 발소리를 듣지 못한 채 페이지를 넘긴다.'
      excerpts:
        p1: 독자는 방금 서명한 이름을 엄지손가락으로 반쯤 가리고 책 위에 전표를 놓습니다. 그는 잉크가 마른 후에만 그것을 움직입니다.
    relic: 이름이 적힌 대출표
    relic_desc: 책임을 받아들인 독자의 이름이 적힌 상상의 전표.
    points:
      p1: 이븐 알나피스에게 완성된 책 한 권을 접근 가능한 상태로 유지하는 데 동의한 두 번째 독자에게 맡기도록 요청하세요.
    points_fail:
      p1: 그 직원은 그 책을 책임질 두 번째 독자를 찾지 못했습니다.
    shift:
      p1:
        was: '1288년: 이븐 알나피스가 사망하고 그의 도서관을 병원에 맡겼습니다. 그의 대규모 의학 백과사전 중 일부만이 오늘날 남아 있습니다.'
        now: '{staff}는 완성된 한 권에 대한 관리인을 마련하고 상담할 수 있는 수령인 기록을 가지고 있습니다. 도서관의 나머지 부분은 그의 원래 계획을 따릅니다.'
        who: ibn_al_nafis_cairo
        bio: 그의 미완성 백과사전 중 한 권은 두 번째 관리인을 통해 지부에서 계속 접근할 수 있었습니다.
  sappho_lesbos:
    name: 배가 떠나기 전에
    place: 레스보스섬 미틸리니
    figure: 사포
    story: Parian Marble은 사포가 Mytilene을 떠나 시칠리아로 망명하는 것을 기록합니다. 손상된 날짜로 인해 정확한 연도가 불확실해집니다. 이 지점에서 그녀가 만나기를 바랐던 한 사람은 배가 떠날 때 소식을 듣지 못했습니다.
    story_prose:
      opening:
        - 미틸레네의 해안. 사포가 시칠리아로 항해한 지 몇 세기가 지난 후, 파로스의 돌에 그 항해가 기록되어 있습니다. 그 돌에 적힌 연도는 이제 손상되었습니다.
        - 역사상 사포는 미틸레네를 떠나 시칠리아로 망명했습니다. 이유는 알려져 있지 않습니다. 이 지점에는 그녀가 가기 전에 만나고 싶은 사람이 있고, 뱃사공들은 이미 짐을 배에 전달하고 있습니다.
        - 계단참과 인근 거리를 아는 사람이 도움을 줄 수 있습니다. 보트가 떠날 때 아직 듣지 못한 사람을 찾는 것은 뱃사공에게 서두르라고 촉구하는 것보다 더 많은 일을 할 것입니다.
      points:
        p1: '{staff}는 수하물이 어디로 가는지 묻고 사포의 꾸러미를 뱃사공에게 맡기고 사포가 설명한 문을 찾습니다. 그들이 돌아올 때쯤에는 배에 짐을 싣고 있던 사람들이 해안을 깨끗하게 정리한 상태였습니다. 방문객은 사포의 손목에서 풀렸던 매듭을 다시 묶습니다. 사포는 뱃사공이 그녀를 부를 때까지 손을 그대로 둡니다.'
      outcomes:
        all: 보트가 출발하자 사포는 끈으로 손을 들어 올립니다. 방문객은 승객이 해변에 올 때 밟는 돌 위에 머물러 있습니다.
        p1: 보트가 출발하자 사포는 끈으로 손을 들어 올립니다. 방문객은 승객이 해변에 올 때 밟는 돌 위에 머물러 있습니다.
      none: 보트가 먼저 출발합니다. 방문객이 층계참을 발견할 때쯤이면 돌 위에는 젖은 밧줄 한 가닥만 남아 있을 뿐입니다.
      not_admitted: '{staff}는 해안에 도착했지만 사포를 아는 사람을 찾지 못했습니다. 마지막 계단에서 누군가가 웅크려 밧줄을 곧게 펴고 있습니다.'
      excerpts:
        p1: 방문객은 사포의 손목에서 풀렸던 매듭을 다시 묶습니다. 사포는 뱃사공이 그녀를 부를 때까지 손을 그대로 둡니다.
    relic: 매듭이 있는 끈
    relic_desc: 나루에서 그녀와 함께 기다리고 있는 사람이 착용하는 상상의 끈.
    points:
      p1: 사포가 시칠리아로 떠나기 전에 보고 싶은 사람 한 명을 착륙장으로 데려오세요.
    points_fail:
      p1: 사포가 만나자고 한 사람을 직원이 데려오기 전에 배는 떠났다.
    shift:
      p1:
        was: '기원전 7~6세기 초: 파리안 대리석(Parian Marble)은 사포가 미틸레네(Mytilene)에서 시칠리아(Sicily)로 망명하여 항해하는 것을 기록합니다.'
        now: '{staff}는 사포가 요청한 사람을 착륙장으로 데려옵니다. 두 사람은 사포가 탑승하기 전에 함께 시간을 보냅니다.'
        who: sappho_lesbos
        bio: 사포는 미틸레네를 떠나 시칠리아로 떠나기 전 직접 작별 인사를 하는 시간을 가졌습니다.
  hipparchus_rhodes:
    name: 시를 확인할 하룻밤
    place: 로도스
    figure: 히파르코스
    story: 현재까지 남아 있는 히파르코스의 논평에서는 널리 읽혀지는 하늘에 관한 시의 오류를 밝혀 줍니다. 이 부분에서 독자는 시를 사용하여 어떤 별이 함께 떠오를지 다른 사람에게 말하려고 합니다.
    story_prose:
      opening:
        - 기원전 2세기 후반의 로도스. 사람들은 어떤 별이 함께 떠오르는지 기억하기 위해 시를 사용합니다. 남아있는 주석에서 히파르코스는 이와 같은 주장을 하나씩 확인한다.
        - 역사 속에서 익숙한 대사가 눈에 보이는 것과 일치하지 않는 부분을 해설에서 보여줍니다. 이 부분에서 독자는 이미 해당 행 중 하나를 가르쳤으며 동일한 방식으로 다시 가르칠 수 있습니다.
        - 책의 주장을 따를 수 있는 사람이 유용합니다. 또한 이미 수업을 가르친 독자가 밖에서 좀 더 기다리도록 설득할 수 있는 사람이 필요합니다.
      points:
        p1: '{staff}는 독자에게 자신이 가르치려는 대사를 말하도록 요청한 다음 그와 히파르코스와 함께 수평선에서 낮은 곳을 볼 수 있는 곳으로 이동합니다. 첫 번째 별이 나타나면 독자는 둘 다 거기에 있다고 말하기 시작합니다. 그는 중간에 멈춘다. 다른 곳은 아직 어둡습니다. 그는 계속 손가락으로 그것을 가리키고 두 번째 별이 나타날 때만 손을 내립니다.'
      outcomes:
        all: 다음에 가르칠 때에는 먼저 책을 덮고 학생들에게 첫 번째 일어날 때까지 기다리라고 합니다. 그는 다른 빛이 나타날 때까지 익숙한 선의 후반부를 떠난다.
        p1: 다음에 가르칠 때에는 먼저 책을 덮고 학생들에게 첫 번째 일어날 때까지 기다리라고 합니다. 그는 다른 빛이 나타날 때까지 익숙한 선의 후반부를 떠난다.
      none: 독자는 이전과 마찬가지로 이전 행을 암송합니다. 두 번째 별이 바깥에서 낮게 보일 때 문은 이미 닫혀 있습니다.
      not_admitted: '{staff}는 리더를 보지 못합니다. 닫힌 문 사이로 누군가는 한 구절을 두 번 낭송한다.'
      excerpts:
        p1: 다른 곳은 아직 어둡습니다. 그는 계속 손가락으로 그것을 가리키고 두 번째 별이 나타날 때만 손을 내립니다.
    relic: 지평선에 두 개의 표시
    relic_desc: 두 별이 각각 떠오르는 자리를 표시할 수 있는 가상의 관측용 표.
    points:
      p1: 논쟁의 여지가 있는 상승을 가르치기 전에 히파르코스와 함께 하룻밤 동안 관찰하도록 독자를 설득하십시오.
    points_fail:
      p1: 그 직원은 그날 밤 하늘을 배경으로 시를 확인하도록 독자를 설득하지 않았습니다.
    shift:
      p1:
        was: '기원전 2세기 후반: 히파르코스의 주석에서는 친숙한 시에 함께 묘사된 일부 별들이 함께 떠오르지 않았다는 점을 지적했습니다.'
        now: '{staff}는 밤의 관찰을 위해 독자를 다시 불러옵니다. 독자는 두 번의 상승을 개별적으로 관찰하고 학생들에게 주는 지시를 변경합니다.'
        who: hipparchus_rhodes
        bio: 옛 시를 사용하는 독자는 논쟁의 여지가 있는 시를 테스트하고 수정된 설명을 전달했습니다.
  eratosthenes_alexandria:
    name: 지구를 잰 책
    place: 알렉산드리아
    figure: 에라토스테네스
    story: 키레네의 에라토스테네스는 기원전 3세기에 알렉산드리아의 사서가 되었습니다. 지구 측정에 관한 그 자신의 책은 분실되었습니다. 클레오메데스의 후기 기록에서는 한여름의 태양이 시에네 머리 위에 있지만 알렉산드리아에는 그림자를 남긴다고 합니다. 그 차이는 원의 50분의 1입니다. 두 장소 사이에 5,000스타디아가 있으면 지구 전체에 250,000개가 됩니다.
    story_prose:
      opening:
        - 기원전 3세기 알렉산드리아. 키레네의 에라토스테네스가 알렉산드리아 도서관의 관장이 되었습니다. 그에게는 베타라는 별명이 있는데, 이는 모든 학습 분야에서 1등에 조금 못 미친다는 뜻입니다.
        - 역사상 클레오메데스의 후기 기록에 따르면, 한여름 정오에 시에네의 노몬은 그림자를 드리우지 않은 반면, 알렉산드리아의 태양은 천정에서 완전한 원의 50분의 1 지점에 서 있었습니다. 두 성읍의 간격은 오천 스타디아이므로 둘레 전체가 이십오만 명이 되었습니다. 에라토스테네스가 자신의 방법을 기록한 책인 '지구 측정에 관하여'는 분실되었으며, 클레오메데스 자신도 자신의 설명보다 원래 방법이 더 관련이 있다고 말합니다. 이 지점에서는 글을 읽을 수 없는 도서관의 포터가 모든 태그를 알고 있고, 필사자는 별명을 잘 알고 있습니다.
        - 이 여행에는 두 종류의 사람들이 도움을 줄 수 있습니다. 책을 복사하고 확인하고 보관하는 방법을 아는 사람과 호기심이 많고 학구적인 사람이 한 페이지의 그림을 작업할 수 있습니다.
      outcomes:
        all: 나중에 독자들은 그가 직접 쓴 단계를 따라 한여름 날 정오에 다시 노몬을 세웠습니다. 두루마리는 그 옆에 펼쳐져 있었고 가장자리는 자갈로 고정되어 있었습니다.
        p1: 나중에 독자들은 그가 직접 쓴 단계를 따라 한여름 날 정오에 다시 노몬을 세웠습니다. 두루마리는 그 옆에 펼쳐져 있었고 가장자리는 자갈로 고정되어 있었습니다.
      none: 그 책에는 아직 오래된 사본이 몇 권밖에 없었고, 하나씩 나이가 들었습니다. 한여름 정오에도 알렉산드리아의 해시계는 여전히 짧은 그림자를 드리우고 있다.
      not_admitted: '{staff}는 도서관 문을 통과하지 못했습니다. 한여름 정오에도 도시의 노몬들은 여전히 짧은 그림자를 드리우고 있습니다.'
      points:
        p1:
          class_lettered: '{staff}는 장서의 규칙에 따라 『지구의 측량』을 여러 장 복사한 후, 그림이 어긋나지 않고 원본과 그림자 길이, 각도, 거리를 한 줄씩 확인했습니다. 한 권은 문지기가 알 만한 작은 나무 꼬리표로 묶여 도서관 선반에 놓여 있었습니다. 다른 하나는 기름천에 싸여 다른 도시로 떠나는 배에 남겨졌습니다. 에라토스테네스는 선반 앞에 서서 한 손가락으로 태그를 곧게 폈습니다.'
          else: '{staff}는 먼저 책에 있는 방법을 처음부터 모든 단계가 명확해질 때까지 작업한 다음 『지구 측정』을 여러 장 복사하고 원본과 비교하여 수치를 한 줄씩 확인했습니다. 한 권은 문지기가 알 만한 작은 나무 꼬리표로 묶여 도서관 선반에 놓여 있었습니다. 다른 하나는 기름천에 싸여 다른 도시로 떠나는 배에 남겨졌습니다. 에라토스테네스는 선반 앞에 서서 한 손가락으로 태그를 곧게 폈습니다.'
      excerpts:
        p1: 한 권은 문지기가 알 만한 작은 나무 꼬리표로 묶여 도서관 선반에 놓여 있었습니다. 다른 하나는 기름천에 싸여 다른 도시로 떠나는 배에 남겨졌습니다. 에라토스테네스는 선반 앞에 서서 한 손가락으로 태그를 곧게 폈습니다.
    relic: 해시계의 막대
    relic_desc: 그림자가 태양의 각도를 알려주는 평범하고 곧은 막대.
    points:
      p1: 그가 도서관과 그 너머에 지구 측정론을 복사하도록 도와주세요. 그러면 그 방법에 대한 그 자신의 설명이 손실되지 않습니다.
    points_fail:
      p1: 그 책은 이미 가지고 있던 사본에 그대로 남아 있었습니다. 이 분야에서는 모두 똑같이 사라졌으며 나중에 독자들은 클레오메데스의 단순화된 이야기를 통해서만 그의 방법을 알았습니다.
    shift:
      p1:
        was: 기원전 3세기에 에라토스테네스는 『지구의 측정에 관하여』에서 자신의 측정 방법을 설명했습니다. 그 책은 나중에 분실되었고, 그 방법은 주로 원본이 더 복잡하다고 말하는 클레오메데스의 단순화된 설명에 남아 있습니다.
        now: '{staff}는 그가 책을 여러 번 복사하도록 도왔습니다. 이 타임라인에서 그 자신의 이야기는 다시 이야기하는 것과 함께 나중에 독자들에게 전해졌습니다.'
        who: eratosthenes_alexandria
        bio: 이 줄에서 에라토스테네스가 지구를 측정한 책은 분실되지 않았으며, 나중에 독자들은 자신의 말로 그의 방법을 확인할 수 있었습니다.
    vignettes:
      noon: 한 여름날 정오, {staff}는 곧은 막대를 잡고 웅크리고 손톱으로 그림자 끝으로 땅을 긁는다. 조금 후에 그림자가 손가락 너비만큼 이동했습니다.
      beta: '{staff}는 도서관의 복사가가 뒤에서 사서 베타를 부르는 것을 듣습니다. {staff}는 이후 세기에 그에 대해 기억하게 될 것은 그가 측정한 지구 전체 둘레이며 직선을 유지한다는 것을 알고 있습니다.'
      shelves: '{staff}는 도서관의 포터가 롤을 작은 나무 태그로 묶은 묶음으로 선반까지 운반하는 것을 돕습니다. 문지기는 글을 읽을 수 없는 사람이라도 꼬리표에 있는 표시는 구별할 수 있다고 말합니다.'
  fibonacci_pisa:
    name: 1202년의 초판
    place: 피사
    figure: 피보나치
    story: 피사의 레오나르도는 어렸을 때 그의 아버지가 피사의 상인들을 위해 일하던 북아프리카 해안의 부기아에서 인도의 아홉 인물을 이해하는 법을 배웠습니다. 1202년에 피사로 돌아온 그는 셈과 교역을 위한 새로운 숫자와 0을 가르치는 Liber abaci를 완성했습니다. 1228년에 그는 책을 개정했고, 현재 남아 있는 사본은 두 번째 버전에서 나온 것입니다.
    story_prose:
      opening:
        - 1202년 피사. 소년 시절 레오나르도는 북아프리카 해안에 있는 부기아(Bugia)로 갔는데, 그곳에서 그의 아버지는 피사의 상인들을 위해 일했고 그곳에서 인도의 아홉 인물을 계산하는 법을 배웠습니다. 피사로 돌아와서 그는 사람들에게 이 숫자와 0으로 숫자를 쓰고 이를 사고 파는 데 사용하도록 가르치는 Liber Abaci를 썼습니다.
        - 역사상 그는 1228년에 책을 개정하여 새로운 자료를 추가하고 불필요하다고 생각되는 부분을 삭제했습니다. 이후 독자들에게 내려진 모든 사본은 해당 버전으로 돌아가며 1202의 첫 번째 버전의 완전한 사본은 알려져 있지 않습니다. 이 지점에서는 부두에 있는 계산원의 견습생이 왜 작은 원이 기둥을 차지해야 하는지 알 수 없으며, 아르노 강의 뱃사공이 해변에 오는 모든 베일의 번호를 외칩니다.
        - 여러 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 책과 사본 보관 방법을 아는 사람, 가르치고 저자와 대화할 수 있는 사람, 초기 텍스트와 후기 텍스트가 어떻게 다른지 명확하게 말할 수 있는 학구적인 사람.
      outcomes:
        all: 20여년이 지난 후 개정판이 피사의 서점에서 복사되었습니다. 나무 상자는 여전히 거기에 있었고 초기 텍스트와 새로운 텍스트가 나란히 펼쳐져 있어서 독자들은 나중에 추가된 예를 페이지별로 비교했습니다.
        p1: 20여년이 지난 후 개정판이 피사의 서점에서 복사되었습니다. 나무 상자는 여전히 거기에 있었고 초기 텍스트와 새로운 텍스트가 나란히 펼쳐져 있어서 독자들은 나중에 추가된 예를 페이지별로 비교했습니다.
      none: 1228년 이후 피사의 서점에서는 개정판만 복사했습니다. 계산실에서 견습생은 빈 칸에 0을 한 획씩 쓰는 법을 배웠습니다.
      not_admitted: '{staff}는 레오나르도의 문을 통과하지 못했습니다. 아르노 강가에서는 뱃사공이 여전히 꾸러미를 내리고 있었고, 강둑에서는 누군가가 판자에 한 획씩 그렸습니다.'
      points:
        p1:
          class_lettered: '{staff}는 장서 관리인의 규칙에 따라 첫 번째 버전의 책을 탁자 위에 늘어놓고 하나씩 번호를 매긴 다음 레오나르도에게 나중에 개정하는 것이 좋지만 이 세트를 보관하지 않으면 아무도 그가 처음에 어떻게 썼는지 알 수 없을 것이라고 말했습니다. 레오나르도는 오랫동안 책을 훑어보고 펜을 들고 각 권의 끝에 자신의 이름과 책이 끝난 연도를 썼습니다. 그는 잉크가 마를 때까지 기다렸다가 나무 상자에 책을 한 권씩 넣고 걸쇠를 잠갔습니다.'
          else: '{staff}는 첫 번째 버전의 몇 가지 작업 예제를 왁스 태블릿에 복사하여 그가 지시하는 새로운 방식 옆에 놓고 나중에 사람들이 그가 처음 어떻게 합계를 계산했는지 알고 싶다면 어디를 봐야 하는지 물었습니다. 레오나르도는 오랫동안 책을 훑어보고 펜을 들고 각 권의 끝에 자신의 이름과 책이 끝난 연도를 썼습니다. 그는 잉크가 마를 때까지 기다렸다가 나무 상자에 책을 한 권씩 넣고 걸쇠를 잠갔습니다.'
      excerpts:
        p1: 레오나르도는 오랫동안 책을 훑어보고 펜을 들고 각 권의 끝에 자신의 이름과 책이 끝난 연도를 썼습니다. 그는 잉크가 마를 때까지 기다렸다가 나무 상자에 책을 한 권씩 넣고 걸쇠를 잠갔습니다.
    relic: 숫자를 새긴 밀랍 서판
    relic_desc: 새 숫자 열 개를 낡은 로마 숫자 옆에 나란히 새긴 서판.
    points:
