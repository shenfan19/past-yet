  header_lines:
    - line: 물길을 거슬러 그대를 좇으니, 길은 험하고 가파르다.
      source: 『시경』 진풍·겸가
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: 물길을 따라 그대를 좇으니, 강 한가운데 작은 섬에 있는 듯하다.
      source: 『시경』 진풍·겸가
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: 전에 이곳에 와 본 적이 있다. 언제 어떻게 왔는지는 모르겠다.
      source: D. G. 로세티, 「느닷없는 빛」
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: 언제 다시 내 작은 마을의 굴뚝에서 연기 오르는 모습을 볼 수 있을까.
      source: 조아생 뒤 벨레, 『회한』
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: 검은 제비들이 돌아와 그대의 발코니에 둥지를 틀리라.
      source: 구스타보 아돌포 베케르, 「시 제53편」
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: 유채꽃이 피고, 달은 동쪽에 해는 서쪽에.
      source: 요사 부손, 하이쿠
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: 별 하나에 추억과, 별 하나에 사랑과
      source: 윤동주, 「별 헤는 밤」
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: 시간은 차가운 눈이 덮였던 땅에 푸른 옷을 입힌다.
      source: 루이스 드 카몽이스, 「소네트」
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: 오래된 지도에는 집으로 가는 길이 아직 남아 있다.
    - line: 문패의 번호는 바뀌었지만, 오후 햇살은 여전히 같은 곳에 내린다.
    - line: 다음 정거장은 아주 오래전입니다.
