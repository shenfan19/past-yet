  ramanujan_madras:
    name: 계산을 확인해 달라는 편지
    place: 마드라스
    figure: 스리니바사 라마누잔
    story: 1912년 3월부터 스리니바사 라마누잔은 Madras Port Trust의 회계 부서에서 사무원으로 일했습니다. 1913년 1월 16일 목요일에 그는 그곳에서 케임브리지의 G. H. Hardy에게 자신의 작품과 다양한 계열에 대한 연구를 소개하는 편지를 썼습니다. 1914년에 그는 영국으로 갔다. 그는 1920년에 인도로 돌아온 후 병으로 사망했습니다.
    story_prose:
      opening:
        - 1913년 1월 마드라스. 25세의 스리니바사 라마누잔(스리니바사 라마누잔)은 포트 트러스트(Port Trust) 회계 부서의 사무원으로 낮에는 장부를 확인하고 밤에는 수학 공부를 합니다. 1월 16일 목요일에 그는 여기에서 케임브리지의 G. H. Hardy에게 대학 과정 밖에서 얻은 결과에 대해 편지를 보냅니다.
        - 역사상 Hardy는 2월 8일에 자신의 증거를 작성해 달라고 요청했습니다. 2월 27일에 그는 이미 반쯤 굶주린 사람이라는 내용의 두 번째 편지를 완성하고 보냈습니다. 5월이 되어서야 장학금이 도착했고 그때까지 가족은 한 달에 30루피의 월급으로 생활했습니다. 1914년 영국으로 갔다가 1917년 뚜렷한 진단도 없이 중병에 걸렸고, 1920년 인도로 돌아온 뒤 32세의 나이로 세상을 떠났다. 이 지점에서는 포트 트러스트 직원이 해외 우편물을 묶고 회계실 동료가 램프를 나눠준다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 요리를 하거나 사람들을 돌볼 수 있는 사람, 영양 합성기를 사용하는 의지가 강한 사람, 친절하고 인내심이 강하며 튼튼한 사람; 계좌를 유지할 수 있거나 거래를 한 사람, 질서를 잘 아는 사람, 선물 상자를 가지고 전화하는 사람; 나노 의료 키트를 갖춘 의사 또는 위생병.
      outcomes:
        all: 1914년에 그는 짐에 석판을 넣고 영국으로 항해했습니다. 나중에 케임브리지에서 그는 요양소에 가지 않았습니다. 인도로 돌아온 후 그는 수년 동안 수학을 했습니다.
        p3: 1914년에 그는 영국으로 갔다. 몇 년 후 케임브리지에서 그는 요양소에 가지 않았습니다. 인도로 돌아온 후 그는 수년 동안 수학을 했습니다.
        p2: 그 해 5월에 장학금이 한 달에 75루피씩 나왔습니다. 그 달 동안 쌀 항아리는 결코 비어 있지 않았습니다.
        p1: 편지는 인장에 마드라스 소인이 찍힌 채 케임브리지에 도착했습니다. 1914년에 그는 영국으로 항해했습니다.
      none: 2월 27일 밤, 그는 램프 밑으로 쓰러졌고, 반쯤 쓰여진 페이지가 테이블 위에 흩어졌습니다. 케임브리지에서 하디는 더 이상 아무것도 듣지 못했습니다.
      desync: 2월 27일 밤, 그는 등불 밑으로 쓰러졌습니다. {staff}가 소환되었을 때 반쯤 쓰여진 편지가 그의 팔 밑에 놓여 있었고 잉크는 작은 얼룩으로 번져 있었습니다.
      not_admitted: '{staff}는 포트 트러스트에 한 번도 들어가지 않았고, 직원들이 장부를 들고 드나드는 모습을 외부에서만 지켜보았습니다. 꾸러미를 묶은 직원은 한 장의 주소를 읽은 후 캠브리지에서 잠시 멈췄습니다.'
      points:
        p1:
          class_food: '2월 말: 하디가 2월 8일에 쓴 답변이 마드라스에 도착하여 그에게 증명을 작성해 달라고 요청했습니다. 매일 밤 그는 등불 위로 몸을 굽혀 한 장을 채우고 다른 장을 가져가는데, 결코 반 이상 먹지 않았습니다. 요리를 할 수 있는 {staff}는 매일 저녁 뜨거운 밥 한 그릇과 달 한 그릇을 등불에 가져와 그가 끝내는 것을 지켜본 후 다시 글을 쓰게 했습니다. 2월 27일 밤에 편지가 완성되었습니다. 그는 시트를 한 장 한 장 네모로 만들고 접어서 봉투에 넣었습니다. 등불을 함께 쓴 동료는 이미 자고 있었고, 심지는 여전히 타고 있었습니다.'
          class_medical: '2월 말: 하디가 2월 8일에 쓴 답변이 마드라스에 도착하여 그에게 증명을 작성해 달라고 요청했습니다. 매일 밤 그는 등불 위로 몸을 굽혀 한 장을 채우고 다른 장을 가져가는데, 결코 반 이상 먹지 않았습니다. 돌봄 훈련을 받은 {staff}는 시간에 맞춰 식사를 식탁에 가져왔고, 수시로 그를 깨워 몇 걸음을 걷고 물을 마셨고, 늦은 밤에는 등불을 끄고 잠시 누워 있게 했습니다. 2월 27일 밤에 편지가 완성되었습니다. 그는 시트를 한 장 한 장 네모로 만들고 접어서 봉투에 넣었습니다. 등불을 함께 쓴 동료는 이미 자고 있었고, 심지는 여전히 타고 있었습니다.'
          else: '2월 말: 하디가 2월 8일에 쓴 답변이 마드라스에 도착하여 그에게 증명을 작성해 달라고 요청했습니다. 매일 밤 그는 등불 위로 몸을 굽혀 한 장을 채우고 다른 장을 가져가는데, 결코 반 이상 먹지 않았습니다. {staff}는 매일 음식을 식탁에 가져왔고 밤늦게까지 그와 함께 앉아 펜이 멈출 때마다 물컵을 손에 밀어주었습니다. 2월 27일 밤에 편지가 완성되었습니다. 그는 시트를 한 장 한 장 네모로 만들고 접어서 봉투에 넣었습니다. 등불을 함께 쓴 동료는 이미 자고 있었고, 심지는 여전히 타고 있었습니다.'
        p2:
          class_lettered: 4월이 되니 집에 있는 밥그릇이 또 거의 비워졌습니다. 한 달에 30루피로 온 가족을 먹여살려야 했는데, 장학금에 대한 소식은 아직 전해지지 않았습니다. 사무직에 익숙한 {staff}는 한 달 수입과 지출 항목을 항목별로 적고, 쌀값, 기름값, 월세로 얼마를 남겨두고, 월말에 안나스가 몇 개 남을지 계산했다. 그날 저녁에도 쌀독이 가득 찼습니다. 라마누잔은 무릎 위에 석판을 깔고 문 옆 계단에 앉아 한 획씩 획을 긋고 있었습니다.
          class_trade: 4월이 되니 집에 있는 밥그릇이 또 거의 비워졌습니다. 한 달에 30루피로 온 가족을 먹여살려야 했는데, 장학금에 대한 소식은 아직 전해지지 않았습니다. 장사를 좀 하던 {staff}는 시장에 가서 아는 쌀 상인을 찾아 한꺼번에 더 사서 가격을 깎아내렸다. 그날 저녁에도 쌀독이 가득 찼습니다. 라마누잔은 무릎 위에 석판을 깔고 문 옆 계단에 앉아 한 획씩 획을 긋고 있었습니다.
