    content_credit:
      design: Fan Shen이 AI의 도움을 받아 게임을 설계했습니다.
      drafts: 이야기, 역사 인물 소개, 가상의 직원 이야기 대부분은 AI가 초안을 작성했고, Fan Shen이 주제 선정과 편집을 맡았습니다. 개별 기여자는 해당 카드에 표시합니다.
      review: 일부 카드는 사람이 직접 검토했으며, 나머지는 순차적으로 검토하고 있습니다. 역사적 세부 사항, 문화적 묘사, 번역에 오류나 누락이 있을 수 있습니다. 문제를 발견하면 카드와 해당 부분을 알려 주세요. 출처가 있다면 함께 보내 주세요.
      feedback: 정정 제보하기
    echoes:
      title: 역사의 메아리
      rule: 플레이할 수 있는 모든 이야기에는 출처가 있는 역사 인용문이 있습니다. 별을 하나도 얻지 못했거나, 동기화에 실패했거나, 사건에 참여하지 못했어도 보고서에 메아리가 표시됩니다. 별의 수와 결말에 따라 인용문이 달라집니다. 의료상의 긴급 귀환이나 플레이어의 직접 소환 시에는 메아리가 표시되지 않습니다.
    preview:
      title: 초기 버전 안내
      project: 이 게임은 한 연구 프로젝트에서 시작됐으며, 그 프로젝트의 시뮬레이션 엔진 개발에도 도움이 됩니다. 연구 내용을 몰라도 게임을 즐길 수 있습니다。
