          class_teaching: 11월 23일에는 리셉션이 중단되고 손님들은 둘, 셋씩 볼푸르(Bolpur) 역을 향해 걸어갑니다. 마지막 몇 명은 끝까지 한 마디도하지 않았습니다. 가르친 {staff}는 어려운 말을 한 후에 사람들이 몇 걸음 나아갈 때까지 기다렸다가 따라잡고 길가에 잠시 함께 서서 마당으로 다시 데려온다는 것을 알고 있습니다. 어두워지면 실내 램프가 켜지고 타고르와 몇몇 손님들은 낮은 테이블 주위에 앉고 차를 두 번 붓습니다. 손님이 손으로 복사한 노래책을 집어 들고 닫습니다. 그는 타고르에게 마당에서 들었던 생각을 이야기합니다. 타고르는 어떤 말이 그에게 그런 인상을 주었는지 묻고 대답을 기다립니다.
