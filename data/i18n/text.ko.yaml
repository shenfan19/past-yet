        p3:
          class_learned: 5월말, 장학금이 찾아왔습니다. 그의 오래된 병이 다시 찾아왔습니다. 그는 수년 전에 시작된 질병으로 인해 번갈아 가며 기절하고 매우 말랐습니다. 의학을 아는 {staff}는 수년에 걸쳐 발병할 때마다 물었고, 한 번도 사라지지 않았던 오래된 질병임을 확인하고 가져온 나노 의료 키트를 열어서 치료했습니다. 한 달 후 그는 식사를 할 때 두 번째 도움을 받았고 밤에는 푹 자고 있었습니다. 처음에 그는 석판을 집어들었고, 분필은 그 위로 빠르고 가깝게 움직였습니다.
