  leonardo_florence:
    name: 기계를 그린 화가
    place: 피렌체
    figure: 레오나르도 다 빈치
    story: 루브르 박물관은 모나리자로 알려진 레오나르도의 초상화 시작 시기를 1503년경으로 추정하고 그가 이후에도 계속 작업했다고 기록하고 있습니다.
    story_prose:
      opening:
        - 피렌체 작업장 내부에서는 새 랙을 위한 공간을 만들기 위해 패널을 창에서 옮겼습니다. 요원이 와서 리사의 초상화가 어디에 있는지 묻습니다. 견습생이 그가 아직 젖어 있는 패널에 손을 대는 것을 막았습니다.
        - Agostino Vespucci의 1503년 10월 메모에는 Leonardo의 Lisa 초상화가 언급되어 있습니다. 그림은 나중에 예술가의 소유로 남았습니다. 여기에서 작업 및 보관을 위한 장소를 저장할 수 있으며 Lisa가 Leonardo가 보여주고 싶은 만큼 많이 볼 수 있도록 준비할 수 있습니다.
        - 랙, 패널 및 일광을 판단할 수 있는 사람을 보내십시오. 관람 일정을 정하려면 시터, 화가, 대리인을 합의된 시간에 함께 모으십시오.
      points:
        p1: 견습생은 기존 랙에서 공간을 하나 더 확보하고 싶어합니다. 당신은 그에게 먼저 빈 패널을 밀어넣고 그 모서리가 옆에 있는 그림에 닿는 것을 지켜보라고 요청합니다. 그는 창문 옆 공간을 치우고 레오나르도에게 슬롯을 표시하라고 요청합니다. 나중에 작품을 치우는 사람은 랙에 손을 뻗기 전에 이 패널의 라벨을 만집니다.
        p2: 화가는 자신의 그림을 보호하기 위해 마른 연습판을 요청합니다. 그는 초상화를 문쪽으로 직접 돌리고 Lisa가 서 있어야 할 곳을 보여줍니다. 그녀는 다음 번에도 같은 자세로 그녀가 필요한지 묻습니다. 그는 의자 뒤쪽을 보고 견습생에게 의자가 어디에 있는지 표시하라고 말합니다. Lisa가 떠난 후 Leonardo는 패널을 다시 조명으로 바꿉니다.
      outcomes:
        all: 작업장에는 아직 사진을 찍을 공간이 남아 있습니다. Lisa는 그것이 얼마나 멀리 왔는지 확인했고 Leonardo는 여전히 패널을 유지하고 있습니다.
        p1: 패널에는 일광이 있고 라벨이 붙은 저장 슬롯이 있습니다. 상담원이 어떻게 진행되고 있는지 물어볼 수 있습니다. 관람일은 아직 정해지지 않았습니다.
        p2: Lisa는 그 작품을 한 번 본 적이 있습니다. 패널은 나중에 손상되었고 여행을 통해 그녀가 패널을 본 장면을 집으로 가져왔습니다.
      none: 아직 랙에 공간이 없습니다. 문 옆에서 방문객은 화가가 그림을 넘겨주지 않았다는 사실만 알게 된다.
      not_admitted: 견습생은 랙을 가져오는 사람들을 위한 공간을 만들어 달라고 요청합니다. 문 밖에서는 패널의 전면을 볼 수 없습니다.
      desync: 오래된 랙이 젖은 패널을 압박하여 손상시킵니다. 역사적인 초상화는 더 이상 보존되지 않으며 사무실에서는 여행자를 회상합니다.
      excerpts:
        p1: 그는 창문 옆 공간을 치우고 레오나르도에게 슬롯을 표시하라고 요청합니다. 나중에 작품을 치우는 사람은 랙에 손을 뻗기 전에 이 패널의 라벨을 만집니다.
        p2: 그는 의자 뒤쪽을 보고 견습생에게 의자가 어디에 있는지 표시하라고 말합니다. Lisa가 떠난 후 Leonardo는 패널을 다시 조명으로 바꿉니다.
    relic: 거울로 쓴 노트 페이지
    relic_desc: 읽으려면 미러가 필요한 역방향 스크립트 페이지입니다.
    points:
      p1: 워크숍에서 또 다른 시민 그림을 그리기 전에 빛이 있고 패널을 보관할 수 있는 곳에 Lisa의 초상화를 위한 장소를 예약하세요.
      p2: 초상화가 아직 피렌체에 있는 동안 진행 중인 작업을 볼 수 있도록 준비하고 레오나르도가 시터에게 무엇을 보여줄지 선택하도록 하세요.
    points_fail:
      p1: 새로운 작업이 도착하고 미완성 패널이 기존 랙에 압착됩니다. 초상화가 손상되었고 사무실에서는 해당 직원을 소환했습니다.
      p2: 시청을 위해 따로 시간을 정하지 않았습니다. 사진을 기다리는 사람들은 작업장에 사진이 얼마나 멀리 왔는지만 물어볼 수 있습니다.
    shift:
      p1:
        was: 1503년 10월 Agostino Vespucci의 여백 메모에는 Leonardo가 Lisa del Giocondo를 그린 기록이 있습니다.
      p2:
        was: 초상화는 광범위한 수정을 거쳐 레오나르도와 함께 이탈리아를 떠나 프랑스 컬렉션에 들어갔습니다.
        now: Lisa는 이 단계에서 초상화를 봅니다. Leonardo는 계속해서 패널을 가져갈 수 있으며 워크숍에서는 그녀에게 표시된 버전의 스케치를 보관합니다.
        who: leonardo_florence
        bio: 현대 피렌체 메모에는 레오나르도의 작업실에 있는 리사의 초상화가 있습니다. 그림은 계속 바뀌었고 첫 번째 설정에서 멀리 이동했습니다.
    vignettes:
      shadow: 견습생에게 얼굴이 끝나고 배경이 시작되는 위치를 보여달라고 요청합니다. 그들은 가리킨 다음 주저합니다. 더 굵은 선을 그리는 대신 두 번째 보기를 위해 전환을 남겨둡니다.
      hands: 방문객은 얼굴은 기억하지만 손은 다른 곳에 놓는다. 연습용 그림을 메모리 스케치 옆에 놓고 변경된 선을 찾도록 하세요.
      seat: 견습생이 짐을 꾸리는 동안 바닥에 시터 의자를 표시합니다. 그들은 돌아왔을 때 의자가 어디로 갈지 알고 그림을 완성하지 않은 채로 남겨 둡니다.
  galileo_padua:
    name: 목성의 위성들
    place: 파도바
    figure: 갈릴레오 갈릴레이
    story: 별빛 메신저(Starry Messenger)에서 갈릴레오는 목성 근처에 있는 네 개의 작은 천체의 위치 변화를 기록하고 목성 궤도를 돌고 있다는 결론을 내렸습니다.
    story_prose:
      opening:
        - 1월 파도바 관측이 끝날 무렵 갈릴레오는 목성 옆에 빛의 점을 그립니다. 다음날 저녁에 그들의 위치가 변경됩니다. 필사자가 그림을 크기별로 쌓아 놓고 베니스로 가져가는 사람은 어느 밤이 먼저인지 묻습니다.
        - 목성의 위성에 대한 관측 내용은 1610년 Sidereus Nuncius에 실렸습니다. 4월 볼로냐에서 열린 재판에서 반대가 제기되었고 Horký는 나중에 이 책에 대한 팜플렛을 인쇄했습니다. 이 지점에서는 1월 밤을 순서대로 유지하고 일부 손님이 직접 포인트를 볼 수 있도록 할 수 있습니다.
        - 프린터의 사본을 확인하기 위해 스케치와 날짜를 비교할 수 있는 사람을 보내십시오. 마기니의 집에서 방문객들이 목성을 돌아보기 전에 틀림없이 밝은 별을 찾을 수 있도록 도와주세요.
      points:
        p1: 먼저 온 필사자에게 3점짜리 밤, 2점짜리 밤을 물어보세요. 그는 공책을 꺼내서 그 내용이 거꾸로 되어 있는 것을 확인합니다. 갈릴레오는 날짜를 읽고 베니스로 세트를 넘겨주기 전에 각 모서리를 항목과 일치시킵니다. 필사자는 두 번째 밤을 바라보며 점의 위치가 어떻게 바뀌었는지 보고 고개를 끄덕였습니다.
        p2: Magini's의 첫 번째 손님은 뒤로 물러나서 단지 빛의 빛만을 보았다고 말했습니다. 갈릴레오는 공간을 만듭니다. 손님에게 자신이 아는 밝은 별 하나를 찾은 다음 목성으로 돌아가도록 합니다. 손님은 자리에 앉고 동료의 주의를 끌기 위해 손을 듭니다. 그는 자신이 본 숫자를 말하기 전에 그녀에게 스스로 세어 보라고 요청합니다.
      outcomes:
        all: 인쇄된 다이어그램은 1월 순서를 유지합니다. 볼로냐에서는 손님이 자신의 점수를 기록하고 다음날 밤 포인트가 어디인지 묻습니다.
        p1: 베니스의 사본이 주문되었습니다. 볼로냐에는 여전히 관찰 내용에 이의를 제기하는 편지와 팜플렛이 있을 것입니다.
        p2: 적어도 한 명의 손님은 목성 옆에 있는 빛의 개수를 직접 말할 수 있습니다. 인쇄 기록이 동기화되지 않고 여행자 계정에 카운트가 남아 있습니다.
      none: 필사자는 밤을 정리하지 않고 크기별로 시트를 쌓습니다.
      not_admitted: 문 옆에서 누군가가 당신을 데려온 사람이 누구인지 묻습니다. 당신은 밖에 머물면서 필사자가 느슨한 그림을 소매에 넣는 것을 보았습니다.
      desync: 느슨한 다이어그램은 프린터 사본에서 위치가 변경됩니다. 원본 시퀀스가 동기화되지 않고 사무실에서 여행자를 회수합니다.
      excerpts:
        p1: 갈릴레오는 날짜를 읽고 베니스로 세트를 넘겨주기 전에 각 모서리를 항목과 일치시킵니다. 필사자는 두 번째 밤을 바라보며 점의 위치가 어떻게 바뀌었는지 보고 고개를 끄덕였습니다.
        p2: 손님은 자리에 앉고 동료의 주의를 끌기 위해 손을 듭니다. 그는 자신이 본 숫자를 말하기 전에 그녀에게 스스로 세어 보라고 요청합니다.
    relic: 손으로 연마한 렌즈
    relic_desc: 손으로 광택을 낸 작은 유리 렌즈입니다.
    points:
      p1: 복사본이 베니스로 갈 수 있도록 갈릴레오의 목성과 빛의 점에 대한 날짜가 기록된 스케치를 보관하십시오.
      p2: 4월 말 볼로냐에서 Magini의 손님들이 갈릴레오의 망원경을 통해 목성의 달을 볼 수 있도록 도와주세요.
    points_fail:
      p1: 느슨한 스케치는 순서를 잃습니다. 프린터의 사본으로 인해 밤의 순서가 어긋나고 사무실에서는 직원을 소환합니다.
      p2: 손님은 아무것도 보지 못했다고 말합니다. Horký는 Kepler에게 편지를 쓰고 6월에 Sidereus Nuncius에 대한 팜플렛을 인쇄합니다.
    shift:
      p1:
        was: 갈릴레오는 1610년 1월부터 연속된 밤에 걸쳐 목성을 관찰했으며 Sidereus Nuncius에 위치 기록을 인쇄했습니다.
      p2:
        was: 1610년 4월 말 갈릴레오는 볼로냐의 카프라라 궁전에서 마기니와 다른 손님들에게 망원경을 보여주었습니다. 그들은 위성을 볼 수 없다고 말했고 그곳에 있던 마틴 호르키(Martin Horký)는 6월에 갈릴레오를 반대하는 팜플렛을 인쇄했습니다.
        now: '{staff}는 튜브를 안정적으로 설정하고 손님에게 어디를 봐야 하는지 보여줍니다. 그들 중 몇몇은 그날 밤 목성 옆에 있는 빛의 지점을 보았고 Horký의 팜플렛은 근거를 덜 찾았습니다. 새로운 별이 더 빨리 받아들여집니다.'
        who: galileo_padua
        bio: 1610년 4월 볼로냐에서 마기니의 손님들은 갈릴레오의 망원경을 통해 목성의 위성을 보았습니다. Sidereus Nuncius에 대한 의심은 더 짧았습니다.
    vignettes:
      alignment: 필사자가 페이지를 가장자리별로 정렬하는 것을 중지합니다. 대신 목성을 정렬하라고 제안합니다. 점들은 더 이상 서로 겹쳐져 있지 않습니다.
      telescope: 당신은 어느 점이 네 번째인지 묻습니다. 필사자는 며칠 밤에 걸쳐 작성한 시트를 꺼내어 점들이 합쳐지는 것처럼 보일 때 어느 것을 믿어야 하는지 묻습니다.
      dates: 필사자가 종이를 쌓기 전에 느슨한 종이 각각에 날짜를 표시합니다. 순서를 통해 다음 독자는 점의 위치 변경을 볼 수 있습니다.
  heo_nanseolheon_hanyang:
    name: 흩어진 시를 담은 종이 봉투
    place: 한양
    figure: 허난설헌
    story: 허균은 여동생 허난설헌이 죽은 뒤 남긴 작품을 편찬했다. 그녀가 수집한 작품의 조선 목판본은 1608년부터 남아 있습니다.
    story_prose:
      opening:
        - 필사자는 새 종이 슬리브의 무게를 돌로 측정하고 구멍이 같은 종이 두 장을 건네줍니다. 하나는 연습용이었는데, 다른 하나는 빌려달라고 하더군요. 그는 창문 옆에서 두 가지를 모두 가져간 것을 기억합니다.
        - 역사상 허난설헌의 형인 허균이 그녀가 죽은 뒤 살아남은 작품을 모았다. 1597년 선택판과 살아남은 1608년판은 장소가 다릅니다. 여기에서 시인이 찾을 수 있는 곳에 사본을 보관하고 시인에게 어떤 시를 공유하고 싶은지 물어볼 수 있습니다.
        - 초안을 정렬하기 위해 손과 제목을 비교할 수 있는 사람을 보내십시오. 누가 그것을 읽고 싶어하는지 설명할 수 있는 여행자는 시인 자신에게 질문을 던질 수 있습니다.
      points:
        p1: 필사자는 더 강한 잉크를 가리켰습니다. 두 버전을 나란히 놓고 창백한 사본 끝에 수정본을 보여줍니다. 그는 두 사람을 다시 찾을 수 있도록 소매에 메모를 남깁니다. 두 장이 하나의 제목 아래로 들어가고 접힌 부분이 글을 쓰기에 훨씬 못 미치는 수준에서 멈춥니다.
        p2: 허씨는 필사자의 첫 번째 선택지를 테이블 옆으로 다시 옮깁니다. 그녀는 그 자리를 채우기 위해 다른 것을 선택합니다. 그 꾸러미에 누구의 이름이 들어 있는지 물으면, 그녀는 붓을 들고 첫 번째 시트에 직접 서명한 다음 페이지를 순서대로 돌려줍니다. 그녀는 필사자에게 서명도 복사해 달라고 요청합니다.
      outcomes:
        all: 허균은 컬렉션을 모을 때 여동생이 남긴 순서대로 작은 꾸러미를 보관한다. 그녀의 요청에 따라 복사된 이름은 첫 번째 시트에 그대로 유지됩니다.
        p1: 두 버전 모두 찾을 수 있습니다. 허균은 컬렉션을 엮을 때 그것들을 비교할 수 있다. 그는 여동생이 스스로 선택한 기록이 없습니다.
        p2: 그녀는 몇 편의 시에 직접 서명했습니다. 다른 신문은 길을 잃었습니다. 집에 오는 것은 이번 방문에서 그녀가 선택한 기록입니다.
      none: 느슨한 사본은 테이블 위에 혼합되어 있습니다. 이후의 컬렉션은 여전히 가족이 무엇을 찾을 수 있는지에 따라 달라집니다.
      not_admitted: 필사자는 문 반대편에서 방향을 묻는다. 아무도 이름을 지을 수 없을 때 그는 소매를 테이블 위에 올려 놓습니다.
      desync: 당신이 돌아왔을 때 복사원은 빈 소매만 알아보았습니다. 나중에 수집하는 데 필요한 서류가 분실되어 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: 그는 두 사람을 다시 찾을 수 있도록 소매에 메모를 남깁니다. 두 장이 하나의 제목 아래로 들어가고 접힌 부분이 글을 쓰기에 훨씬 못 미치는 수준에서 멈춥니다.
        p2: 그 꾸러미에 누구의 이름이 들어 있는지 물으면, 그녀는 붓을 들고 첫 번째 시트에 직접 서명한 다음 페이지를 순서대로 돌려줍니다. 그녀는 필사자에게 서명도 복사해 달라고 요청합니다.
    relic: 시 한 장
    relic_desc: 꽃과 먼 곳에 대한 시를 붓으로 쓴 고급 종이 한 장.
    points:
      p1: 허균이 나중에 자신이 선택한 시를 포함할 수 있도록 가족의 사본을 함께 보관하십시오.
      p2: 허씨가 다른 사람들이 읽기를 바라는 작은 시집을 따로 마련하고 서명할 수 있도록 도와주세요.
    points_fail:
      p1: 가족은 별도의 서류를 잊어버리고 허균은 그 서류를 수집할 수 없습니다. 지점의 동기화가 중단되고 사무실에서 해당 직원을 소환합니다.
      p2: 그녀가 죽은 후, 가족은 남아 있는 사본 중에서만 그녀를 위해 선택할 수 있습니다.
    shift:
      p1:
        was: 1589년 허난설헌이 세상을 떠난 후, 허균은 집에 보관되어 있던 시들을 활용하여 작품을 편찬하였다.
      p2:
        was: 1589년 그녀가 죽은 후, 그녀의 오빠가 그녀의 시를 선택했습니다. 1597년판과 1608년판은 서로 다른 해석을 유지하고 있습니다.
        now: 허씨는 공유하고 싶은 페이지를 표시합니다. 가족은 나중에 컬렉션을 준비할 때 그녀가 서명한 선택 항목을 함께 보관합니다.
        who: heo_nanseolheon_hanyang
        bio: 허난설헌은 나누고 싶은 소그룹의 시를 선정했다. 그녀의 가족은 그녀가 살아남은 작품을 준비할 때 그녀가 선택한 순서를 지켰습니다.
    vignettes:
      binding: 필사자가 다른 시트와 연습 페이지를 혼합했습니다. 두 제목을 비교하고 연습을 위해 두 번째 소매를 접습니다. 그가 확인할 수 있는 모호한 페이지 하나가 남아 있습니다. 시가 인쇄된 책에 도달하기 전에 당신은 떠납니다.
      name: 이 시들 중 일부는 이 집에서 멀리 떨어진 곳에서도 읽힐 것이라는 것을 당신도 알고 있습니다. 필사자가 제목이 없는 연습지를 전달하려고 합니다. 당신은 그에게 제목도 복사해 달라고 요청했고, 이름이 적힌 시트가 한 장 더 남습니다. 빈 종이 조각으로 자리를 지키세요. 목판판은 몇 년 앞서 있습니다.
      fold: 붓놀림에 주름이 생기지 않고 느슨한 페이지를 포장하는 데 도움이 됩니다. 여분의 포장지에는 제목이 누락되었다고 표시되어 있습니다. 당신이 가져가는 것은 페이지가 아니라 경고입니다. 이후 컬렉션은 귀하가 떠난 후에 정리될 것입니다.
  ghalib_delhi:
    name: 후렴구를 찾아서
    place: 델리
    figure: 미르자 갈리브
    story: 이번 델리 방문 당시에는 Ghalib의 우르두어 디반이 이미 1841년에 인쇄되었습니다. 그 가잘은 운율과 후렴 어미를 통해 찾아볼 수 있습니다.
    story_prose:
      opening:
        - 누군가가 델리 서점에 들어와 자신이 기억하는 만큼 많은 시를 마지막 단어까지 낭송합니다. 서점에서는 한 번 더 듣고 운율을 적어서 자제해 달라고 부탁합니다. 그는 인쇄된 책에 전표를 가져갈 것입니다.
        - Ghalib의 우르두어 소파는 이미 인쇄되었습니다. 왕은 그에게 티무르 왕조의 역사를 쓰도록 의뢰했습니다. 첫 번째 부분이 등장했고 계획된 두 번째 부분은 미완성 상태로 남아 있습니다. 첫 번째 책을 전달한 후 시작할 위치를 확보할 수 있도록 이후 통치에 대한 서류를 순서대로 넣을 수 있습니다.
        - 변형 이름을 날짜와 일치시킬 수 있는 사람을 보내십시오. 두 종류의 글을 모두 아는 독자는 역사가 어디에서 구절을 인용하는지 식별할 수도 있습니다.
      points:
        p1: Ghalib는 더미에서 시트를 꺼내고 마지막 줄을 읽어달라고 요청합니다. 페이지는 문장이 여백에서 한 줄의 구절로 이어질 때까지 역사처럼 보입니다. 인용문의 출처를 포장지에 넣고 후마윤을 따르는 논문들에 자체 모임을 제공합니다. 갈립은 첫 번째 빈 페이지를 펴서 두 번째 책의 첫 줄을 씁니다.
      outcomes:
        all: 첫 번째 책이 나오면 다음 모임은 이미 그 옆에 있습니다. 떠날 때 시작이 있고 그 아래에는 충분한 공간이 있습니다.
        p1: 이후의 통치는 이제 자체 모임을 갖습니다. Ghalib은 초안을 시작할 수 있으며 앞으로 나올 페이지는 그가 작성하게 됩니다.
      none: 서점은 전표를 따라 가잘을 찾습니다. 이후의 통치에 대한 논문은 더미에 남아 있으며 완성된 속편은 첫 번째 볼륨을 따르지 않습니다.
      not_admitted: 전표는 상점에 도착했지만 아무도 그 사람을 알아보지 못했습니다. 서류는 반쯤 열린 회계 장부에 남아 있습니다.
      excerpts:
        p1: 인용문의 출처를 포장지에 넣고 후마윤을 따르는 논문들에 자체 모임을 제공합니다. 갈립은 첫 번째 빈 페이지를 펴서 두 번째 책의 첫 줄을 씁니다.
    relic: 가잘의 페이지
    relic_desc: 수정 사항이 포함된 우르두어 구절을 직접 손으로 쓴 페이지.
    points:
      p1: 왕이 그에게 요청한 티무르 역사의 후반부에 대한 출처를 수집하고 분류하여 그가 첫 번째 부분 이후 작업을 수행할 수 있도록 도와주세요.
    points_fail:
      p1: 첫 번째 권이 완성되었습니다. 역사에서와 마찬가지로 이 분야에서도 두 번째 계획은 완성된 원고가 되지 않습니다.
    shift:
      p1:
        was: 1850년 7월 4일 Bahadur Shah는 Ghalib과 계약하여 Timurid 가문의 역사를 썼습니다. 첫 번째 부분인 Mehr-e nimroz는 1854년 또는 1855년에 나왔고 Humayun의 죽음으로 끝나며 그가 계획한 속편은 전혀 작성되지 않았습니다.
        now: Ghalib에는 이후 통치에 대한 별도의 소스 노트 세트가 있습니다. 첫 번째 책을 넘긴 후, 두 번째 책을 시작하기에 충분한 자료가 준비되었습니다.
        who: ghalib_delhi
        bio: 이 지점에서 Ghalib는 첫 번째 볼륨이 전달된 후 두 번째 볼륨의 초안을 시작합니다.
    vignettes:
      refrain: 서점 주인은 구절에 나오는 이미지를 기억하고 계속 엉뚱한 곳에서 찾아본다. 당신은 그가 반복해서 들었던 단어를 요구합니다. 그는 당신에게 결말을 알려주고 당신은 인쇄된 책에서 올바른 그룹을 찾습니다. 한 페이지 참조를 작성합니다. 누가 처음으로 그 구절을 가게에 가져왔는지는 아직도 그에게 미스터리입니다.
      future: 당신은 서점에게 나중에 독자들이 여러 판본을 비교할 것이라고 말합니다. 그는 그것이 오늘 필요한 회선을 찾는 데 도움이 될지 묻습니다. 그의 전표에 판 연도를 추가한 다음 결말을 표시하십시오. 그가 다른 사본과 비교하여 확인하기 전에 당신은 떠나십시오.
      listen: 두 사람이 들은 내용에 동의할 때까지 서점에게 결말을 반복합니다. 그는 책의 오른쪽 부분에 전표를 집어넣었습니다. 그 몇 마디를 다시 가져올 수 있습니다. 나머지 구절은 이미 당신에게서 빠져 나갔습니다.
  banneker_maryland:
    name: 함께 부칠 두 가지
    place: 메릴랜드
    figure: 벤저민 배너커
    story: 1791년 8월 19일, 벤저민 베네커(벤저민 배너커)는 토머스 제퍼슨(Thomas Jefferson)에게 편지를 쓰고 다음 해의 연감 원고를 보냈으며 인종적 편견과 노예 제도에 도전했습니다. 포장 테이블과 두 명의 도우미가 상상됩니다. 플레이어는 편지와 그에 수반되는 작품 사이의 연결을 보호할 수 있습니다.
    story_prose:
      opening:
        - 프린터의 메신저와 발신 우편물이 모두 문 앞에 있습니다. Banneker는 편지에 공장의 이름을 적고 연감의 마지막 페이지를 넘겨 자신이 손으로 쓴 사본이 여전히 테이블 위에 있는지 확인합니다. 그 사람은 한 번만 보낼 편지에 할 말이 있어요.
        - 1791년 8월 19일 벤자민 배네커(벤저민 배너커)는 흑인에 대한 자유를 거부하는 것에 도전하는 편지가 포함된 연감 원고를 토마스 제퍼슨(Thomas Jefferson)에게 보냈습니다. 1806년에 발생한 화재로 인해 그가 집에 보관하고 있던 것의 대부분이 소실되었지만 적어도 한 권의 원고 저널은 살아남았습니다. 이 지점은 그가 선택한 논문을 다른 곳에 더 많이 남길 수 있습니다.
        - 두 패킷 모두 손으로 쓴 프린터의 복사본을 확인할 수 있는 여행자를 두십시오. 필사자가 추가 세트를 위한 시간을 낼 수 있다면 Banneker에게 복사할 수 있는 메모가 무엇인지 물어보십시오.
      points:
        p1: 메신저는 두 세트를 모두 7월로 바꾸고 거의 동일한 숫자 열을 찾습니다. 당신은 Banneker에게 Jefferson에게 보낸 원고를 확인하도록 요청하고 우체부에게는 봉투에 적힌 이름을 큰 소리로 읽어 달라고 요청합니다. 하나의 실은 편지와 연감에 얽혀 있습니다. 프린터의 서류가 카운터 위에 편평하게 놓여 있습니다. 우체부는 매듭을 찾으러 손을 뻗기 전에 주소를 읽어봅니다.
        p2: 필사자가 두꺼운 소매를 가져옵니다. Banneker는 몇 장의 시트를 꺼내고 그가 확인할 수 있는 관찰 날짜와 작업 내용을 남겨 둡니다. 그는 수정된 수치를 다시 읽어보고 이전 수치가 계산에서 제외되었는지 확인하라고 요청합니다. 다른 집에서는 주인이 여분의 세트를 열고 첫 번째 날짜를 큰 소리로 읽습니다.
      outcomes:
        all: Jefferson의 답변은 두 항목을 모두 인정합니다. 몇 년 후 화재가 집에 도달했을 때 다른 곳의 사본에는 Banneker가 공유하기로 동의한 관찰 내용이 여전히 남아 있습니다.
        p1: 편지와 연감이 함께 나옵니다. 더 많은 작업 서류가 집에 남아 있으며 많은 소지품과 함께 분실됩니다.
        p2: 점검 세트가 집에서 멀리 떨어져 있습니다. 보내는 메일이 잘못되어 여행자는 예비 세트에 읽혀진 날짜를 집으로 가져옵니다.
      none: 테이블에는 별도로 표시된 패킷이 없습니다. 독자는 역사 속에 남아 있는 작업노트만을 참고할 수 있다.
      not_admitted: 인쇄소 직원은 상자를 닫기 전에 이름을 확인합니다. 그는 방문자를 알아보지 못하고 Banneker의 문 옆에 패킷을 다시 넣습니다.
      desync: 프린터는 편지와 함께 사용할 수 있는 유일한 연감을 수집합니다. 역사적인 인클로저가 사라지고 사무실에서 여행자를 소환합니다.
      excerpts:
        p1: 프린터의 서류가 카운터 위에 편평하게 놓여 있습니다. 우체부는 매듭을 찾으러 손을 뻗기 전에 주소를 읽어봅니다.
        p2: 그는 수정된 수치를 다시 읽어보고 이전 수치가 계산에서 제외되었는지 확인하라고 요청합니다. 다른 집에서는 주인이 여분의 세트를 열고 첫 번째 날짜를 큰 소리로 읽습니다.
    relic: 꾸러미 표지 사본
    relic_desc: 연감과 그에 딸린 편지를 적은 가상의 표지 사본.
    points:
      p1: Banneker가 편지와 함께 손으로 쓴 연감을 보낼 수 있도록 프린터의 사본을 별도로 보관하십시오.
      p2: Banneker에게 어떤 작업 서류를 복사하고 싶은지 물어본 다음 집에서 멀리 떨어져 있도록 체크된 세트를 준비하세요.
    points_fail:
      p1: 프린터는 편지에 사용할 수 있는 유일한 사본을 가져옵니다. 지점의 동기화가 중단되고 사무실에서 해당 직원을 소환합니다.
      p2: 대부분의 작업 서류는 집에 남아 있고 집과 함께 불타 버립니다.
    shift:
      p1:
        was: 1791년 8월 19일, Banneker는 Jefferson에게 편지를 쓰고 그의 연감의 손으로 쓴 사본을 동봉했습니다.
      p2:
        was: 1806년 Banneker의 장례식 날 화재로 그의 집과 그의 원고 자료 대부분이 소실되었습니다.
        now: '{staff}는 Banneker에게 어떤 노트북을 다른 곳에 보관할 수 있는지 묻고 이를 복사해 줄 프린터를 찾습니다. 화재가 발생한 후에도 독자들은 그의 관찰 및 작업 계산 사본을 계속해서 참고할 수 있습니다.'
        who: banneker_maryland
        bio: Banneker의 다른 작업 논문 중 일부는 역사상 살아남은 저널과 함께 별도로 남아 있습니다.
    vignettes:
      packet: Rachel은 첫 페이지에서 월을 보고 계산서에 대한 라벨을 작성하기 시작합니다. 당신은 그 옆에 편지를 놓고 그녀에게 주소를 읽은 후 라벨을 완성하라고 요청합니다. 그녀는 두 포장지에 넥타이 하나를 꿰어 넣습니다. 테이블은 보낸 사람의 이름으로 이동하며 그의 주장은 여전히 첨부되어 있습니다.
      handoff: Isaac은 가방에 플랫 패킷 하나를 넣을 공간이 있습니다. 편지의 왁스는 여전히 부드럽습니다. 편지가 테이블에 달라붙는 것을 방지하기 위해 접힌 가드에 들어가는 동안 포장지를 열어 두십시오. 그는 둘 다와 함께 떠납니다. 당신은 테이블 위에 남겨진 패킷의 빈 사각형을 볼 수 있을 만큼 오랫동안 머물러 있습니다.
      reply: 답장이 빨리 올 거라는 걸 아시죠? 아이작은 편지에서 제기된 내용이 해결되었는지 묻습니다. 보내는 패킷의 날짜를 복사하고 찾은 대로 답장을 위한 공간을 남겨둡니다. 패킷이 전송 중입니다. 어떤 약속도 문을 통해 돌아오지 않았습니다.
  mitchell_nantucket:
    name: 구름이 오기 전에 하늘에 표시를
    place: 낸터킷
    figure: 마리아 미첼
    story: '마리아 미첼: Life, Letters, and Journals에 게재된 편지에 따르면 Mitchell은 1847년 10월 1일 Nantucket에서 망원경 혜성을 발견했습니다. 그녀의 아버지는 이 발견을 기록하고 본토로 보낸 첫 번째 우편물을 통해 Harvard 천문대 소장에게 편지를 썼습니다.'
    story_prose:
      opening:
        - 돌풍이 낸터킷 옥상을 가로지릅니다. 마리아 미첼(마리아 미첼)은 노트를 램프 아래로 밀어 넣어 고정시킵니다. 그녀는 그 물건이 어디에 있었고, 몇 시에 있었는지 기록한다는 뜻이다. 그녀의 아버지는 수치를 듣기 위해 아래층에서 기다리고 있습니다. 날씨 때문에 우편배가 들어오지 못하고 있습니다.
        - Mitchell은 1847년 10월 1일에 혜성을 발견했습니다. 그녀의 아버지는 케임브리지의 William Bond에게 편지를 썼습니다. 덴마크 메달은 나중에 청구에 대한 서신 후에 수여되었습니다. 여기에서 보내는 메일에 대한 첫 번째 알림을 받고 상품을 위해 지정된 수신자에게 두 번째 알림을 보낼 수 있습니다.
        - 스카이 차트를 읽거나 시간을 확인하는 사람이 알림을 보내는 데 도움을 줄 수 있습니다. 우편물에 익숙한 사람을 고용하여 두 주소를 정리하세요.
      points:
        p1: 마리아는 시간을 읽고 그녀의 아버지는 그녀가 어느 밝은 별을 가이드로 사용했는지 묻습니다. 당신은 그에게 입장을 다시 읽어 주었고 Bond에 대한 통지에는 여전히 날짜가 없다는 것을 알게 되었습니다. 부두에서 우편물을 부르는 목소리가 들리자 잉크가 거의 마르지 않았습니다. 우체부가 첫 번째 편지를 자루에 넣을 때쯤이면 날짜를 읽을 수 있습니다.
        p2: 두 번째 페이지의 관측 시간은 동일합니다. 봉투에 다른 주소가 필요합니다. 규칙을 큰 소리로 읽으면 우체부가 이름을 지정한 수신자를 위해 별도의 항목을 작성합니다. 마리아는 관찰한 내용을 미루기 전에 그가 끝날 때까지 기다립니다. 두 통의 편지가 섬을 떠나고, 단 한 통만이 대서양을 건너게 됩니다.
      outcomes:
        all: 덴마크 수신자는 게시된 절차에 따라 통지를 받습니다. 판정이 고려되면 Mitchell은 나중에 항소하는 대신 날짜가 지정된 파견 기록을 생성할 수 있습니다.
        p1: Cambridge는 첫 번째 우편으로 전달된 통지를 받습니다. 메달에는 여전히 자체 서신이 필요합니다.
        p2: 두 번째 주소가 확인되었습니다. Cambridge의 첫 번째 게시물이 잘못되어 지점을 그대로 유지할 수 없습니다.
      none: 옥상 노트는 집에 남아있습니다. 우편으로 보내지지 않은 통지서는 현재까지 수상 위원회에 아무것도 제공하지 않습니다.
      not_admitted: 가족은 아래층에서 누가 왔는지 묻습니다. 우체부가 거리를 지나가는 소리가 들리는 동안 메모는 지붕에 남아 있습니다.
      desync: 본드의 편지가 첫 번째 우편물을 놓쳤습니다. 여행이 동기화되지 않으면 사무실에서 여행자를 회상합니다. 원래 관찰 내용은 아직 집에 있습니다.
      excerpts:
        p1: 부두에서 우편물을 부르는 목소리가 들리자 잉크가 거의 마르지 않았습니다. 우체부가 첫 번째 편지를 자루에 넣을 때쯤이면 날짜를 읽을 수 있습니다.
        p2: 마리아는 관찰한 내용을 미루기 전에 그가 끝날 때까지 기다립니다. 두 통의 편지가 섬을 떠나고, 단 한 통만이 대서양을 건너게 됩니다.
    relic: 작은 망원경
    relic_desc: 튜브에 바다 소금 흔적이 있는 작은 황동 망원경.
    points:
      p1: 캠브리지 천문대로 보내는 첫 번째 우편물을 위해 가족의 날짜가 적힌 통지서를 준비하세요.
