    content_credit:
      mail: 이메일
      design: Fan Shen이 AI의 도움을 받아 게임을 설계했습니다.
      drafts: 게임 속 이야기, 역사 인물 소개, 가상의 직원 이야기는 AI로 생성하며 저자가 차례로 검토합니다. 개별 기여자는 해당 카드에 표시합니다.
      review: 직원과 그들의 이야기는 허구입니다. 역사적 사실, 문화적 묘사, 번역에 오류나 누락이 있을 수 있습니다. 부정확하거나 불공정하거나 모욕적인 내용, 또는 권리를 침해하는 내용을 발견하면 {issues} 또는 {mail}로 알려 주세요. 저자가 확인한 뒤 문제가 있는 내용을 신속히 삭제하겠습니다.
    echoes:
      title: 역사의 메아리
      rule: 플레이할 수 있는 모든 이야기에는 출처가 있는 역사 인용문이 있습니다. 별을 하나도 얻지 못했거나, 동기화에 실패했거나, 사건에 참여하지 못했어도 보고서에 메아리가 표시됩니다. 별의 수와 결말에 따라 인용문이 달라집니다. 의료상의 긴급 귀환이나 플레이어의 직접 소환 시에는 메아리가 표시되지 않습니다.
    preview:
      title: 초기 버전 안내
      project: 이 게임은 한 연구 프로젝트에서 시작됐으며, 그 프로젝트의 시뮬레이션 엔진 개발에도 도움이 됩니다. 연구 내용을 몰라도 게임을 즐길 수 있습니다。
      changes: 기능이 추가되면서 규칙, 아이템 효과, 행동 결과가 달라질 수 있습니다. 진행 상황은 최대한 유지하겠지만, 큰 업데이트 뒤에는 이전 저장 파일을 사용하지 못할 수도 있습니다.
