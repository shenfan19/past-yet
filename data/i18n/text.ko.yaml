        p2: 교사는 칠판 한쪽 구석에 자신의 주소를 복사합니다. 마지막 학생이 돌아서서 집 번호를 다시 적습니다.
        p1: 맨 앞에 있는 아이가 자신의 이름이 적힌 종이를 펴고 있습니다. 그녀가 자리에 앉은 후에야 그는 질문을 책상 위로 밀었습니다.
    relic: 날짜가 찍힌 교정쇄
    relic_desc: Coleman의 이름 전체가 포함된 가상의 지상 승무원 공지입니다.
