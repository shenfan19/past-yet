    relic: 원소를 적은 카드 한 벌
    relic_desc: 혼자 하는 카드놀이처럼 늘어놓을 수 있는 손글씨 카드.
    points:
      p1: Mendeleev는 이미 도시를 떠났으므로 Menshutkin에게 화학 학회 회의에 남겨둔 종이와 테이블을 함께 가져가십시오.
      p2: 저자가 돌아오면 토론을 위해 남겨두었던 항목을 되찾고 다음 회의에서 테이블에 관한 질문에 답할 시간을 주십시오.
      p3: 독일 초록이 출판되기 전에 Mendeleev에게 첫 번째 결론을 확인하고 속성이 주기적으로 반복된다는 단어를 복원하도록 하십시오.
    points_fail:
      p1: Menshutkin은 테이블만 받습니다. 종이에는 여전히 작가의 물건이 가득 차 있어 사회에서는 해당 항목을 폐기하고 사무실에서는 해당 직원을 소환합니다.
      p2: 지연된 항목은 분 단위의 이전 페이지에 유지됩니다. 다음 회의에서는 요소를 논의할 시간이 없습니다.
      p3: 독일어 사본이 합성자에게 전달되었습니다. 독자는 속성이 단계적으로 변경되는 것을 보고 속성이 반복된다는 주장을 놓칩니다.
    shift:
      p1:
        was: 1869년 3월 18일(러시아 달력으로는 3월 6일)에 Menshutkin은 Mendeleev에게 논문을 제출했습니다. Mendeleev는 결석했습니다. 한 기록에서는 그가 Tver Governorate의 치즈 낙농장을 검사하기 위해 떠났고, 다른 기록에서는 그는 아팠습니다.
      p2:
        was: 멘델레예프의 부재로 인해 회의록에서 토론이 연기되었습니다. 이후 회의에서는 이를 채택하지 않았습니다.
        now: 협회는 멘델레예프에게 다음 회의에서 답변할 시간을 줍니다. 그는 논쟁의 여지가 있는 항목을 표시하고 이를 제기한 화학자와 이를 확인하는 데 동의합니다.
      p3:
        was: 1869년 독일 초록에서는 러시아 원본이 주기성을 주장하는 부분에서 단계적 변화라는 단어를 사용했습니다.
        now: 독일 초록에서는 속성이 주기적으로 반복된다고 나와 있습니다. 초록만 읽은 특파원이 재발과 예외의 차이에 관해 질문하면 멘델레예프는 표에서 대답할 수 있습니다.
        who: mendeleev_petersburg
        bio: 멘델레예프는 상트페테르부르크에서 초기 테이블을 마련하고 이를 학회 회의, 느슨한 시트 및 저널을 통해 배포했습니다. 작품이 언어를 넘나들면서 중심 용어의 의미가 바뀌었습니다.
    vignettes:
      flyers: '{staff}는 테이블의 새 시트를 줄에 걸어 건조시키는 프린터 작업을 도와줍니다. 작성자는 빈 상자와 물음표가 너무 많은 페이지를 설정한 적이 없다고 투덜거리며 신사가 그 내용을 채우는 것을 잊었는지 묻습니다.'
      neva: Neva의 얼음이 사라졌습니다. {staff}는 배가 요새에서 궁전으로 건너갈 때 제방에 군중과 함께 서 있고, 옆에 있는 한 남자는 그 배가 건너기 전까지는 누구도 건너갈 수 없다고 말합니다.
      samovar: '{staff}는 여관에서 사모바르로부터 차를 그리는 법을 배웁니다. 골키퍼는 외국인들이 항상 수도꼭지를 잘못된 방향으로 돌리고 부츠를 데게 하며 내내 {staff}의 발을 지켜보고 있다고 말합니다.'
  curie_paris:
    name: 두 가지 새 원소
    place: 파리
    figure: 마리 퀴리
    story: 1898년 4월 마리 퀴리는 피치블렌드가 우라늄이 설명할 수 있는 것보다 더 강한 광선을 방출한다고 보고했습니다. 파리 산업물리화학대학의 피에르 퀴리(Pierre Curie)와 함께 일하면서 그녀는 부품을 분리하고 광선을 따라갔습니다. 1898년 7월 18일에 그들은 새로운 원소를 발표하고 그 원소의 이름을 폴란드의 이름을 따서 폴로늄이라고 명명했습니다. 12월 26일 Gustave Bémont와 함께 그들은 라듐을 발표했습니다. 마리 퀴리는 1934년에 재생불량성 빈혈로 사망했는데, 이는 일반적으로 장기간 방사선에 노출된 것과 관련이 있습니다.
    story_prose:
      opening:
        - 1898년 여름, 파리. 산업 물리학 및 화학 학교에서 마리 퀴리(마리 퀴리)와 피에르 퀴리(Pierre Curie)가 피치블렌드를 부분적으로 분리하고 광선을 따라가고 있습니다. 4월에 그녀는 그 광석이 우라늄이 설명할 수 있는 것보다 더 강한 광선을 방출했다고 보고했습니다.
        - 역사상 그들은 7월 18일에 새로운 원소를 발표하고 그 원소의 이름을 그녀의 모국인 폴란드의 이름을 따서 폴로늄으로 명명했습니다. 12월 26일 Gustave Bémont와 함께 그들은 라듐을 발표했고 Eugène Demarçay가 본 새로운 스펙트럼 선이 메모와 함께 인쇄되었습니다. 그들이 일했던 창고는 환기가 잘 되지 않고 비가 많이 내렸으며 수년 동안 맨손으로 샘플을 다루었습니다. 1934년 Marie는 재생불량성 빈혈로 사망했는데, 이는 일반적으로 장기간 방사선에 노출된 것과 관련이 있습니다. 이 지부에서는 여자가 라틴 지구에 작은 식당을 운영하고 있고, 남자는 센 강변에 서점을 운영하고 있습니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 보호 장치를 가져오고 의학이나 실험실 작업을 아는 사람; 기록을 알고 그 중 여러 장을 정리할 수 있는 사람; 방을 이길 수 있는 설득력 있는 사람.
      outcomes:
        all: 그해 겨울, 악기들은 학교가 정리한 방으로 옮겨졌고, 방패는 벤치 앞에 놓여 있었고, 장갑은 벤치 가장자리의 못에 걸려 있었습니다. 12월 26일에 라듐에 관한 보고서가 아카데미에 도착했고, 새로운 스펙트럼 선이 그것과 함께 인쇄되었습니다.
        p3: 그해부터 방패는 벤치 앞에 서 있었고, 장갑은 가장자리의 못에 걸려 있었습니다. 마리는 그 후 몇 년 더 일했습니다.
        p2: 그해 겨울, 악기는 학교가 정리한 방으로 옮겨졌고 다시는 옮겨지지 않았습니다. 창턱에는 노트가 날짜순으로 일렬로 세워져 있었다.
        p1: 12월 26일에 라듐에 관한 보고서가 아카데미에 도착했고, 새로운 스펙트럼 선이 그것과 함께 인쇄되었습니다. 창고에는 그 해의 치수가 적힌 공책이 벤치 모퉁이에 쌓여 있었고, 맨 위의 공책은 아직 열려 있었습니다.
      none: 그해 겨울에도 여전히 비는 창고 지붕을 통해 흘러내렸습니다. 두 사람은 여전히 맨손으로 유리 접시를 들고 있었고, 어둠 속에서 그 안에 담긴 것이 희미한 빛을 발하고 있었다.
