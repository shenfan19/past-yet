      p4:
        was: 아벨은 1829년 4월 6일에 사망했습니다. 베를린에서의 지위를 확인하는 편지는 이틀 후에 작성되었습니다.
        now: '{staff}는 담당자에게 이미 진행 중인 노력에 대해 보고해 줄 것을 요청합니다. Abel은 그의 친구들이 여전히 그의 게시물을 찾기 위해 노력하고 있다는 것을 읽습니다.'
