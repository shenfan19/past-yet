        p2:
          class_medical: 새 달력으로 2월 8일 저녁, 눈 내리는 블랙 강변. D'Anthès가 먼저 해고되었습니다. 푸쉬킨은 배에 부상을 입고 많은 양의 피를 흘린 뒤 도움을 받아 마차에 실려 서둘러 도시로 돌아왔습니다. 응급처치 훈련을 받은 {staff}는 마차에 무릎을 꿇고 상처를 누르고 깨끗한 천을 겹겹이 겹겹이 쌓아서 맥박을 자주 느끼며 끝까지 놓지 않았습니다. 마차는 모이카의 문 앞에 멈췄고, 짐꾼은 등불을 들고 달려나갔습니다. 푸쉬킨은 안방으로 옮겨져 서재의 소파에 누워 있었는데, 그의 코트에 쌓인 눈은 아직 녹지 않았습니다.
