      p2: 엄지손가락은 급하게 묶일 뿐이며 이 가지에서는 역사상과 마찬가지로 결코 원래의 모양으로 돌아오지 않습니다.
      p3: 아침에는 마구간의 절반이 비어 있고, 호텔은 물품을 가져오기 위해 육상 운송 캠프에서 동물을 빌려야 합니다.
      p4: 평화 이후 군대가 떠날 때 주식은 팔리지 않을 것이며 1856년 11월 두 파트너는 런던에서 파산 선고를 받았습니다.
