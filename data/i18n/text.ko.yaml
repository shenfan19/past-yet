    relic: 진주 귀걸이
    relic_desc: 그가 자주 그렸던 종류의 작은 진주.
    points:
      p1: 연말이 되기 전에 그의 작업실에 The Art of Painting을 보관하여 채권자가 빚을 갚지 않도록 하십시오.
      p2: 전쟁 이후 손에 남겨진 그림 중 일부를 팔고 가계의 빚을 갚을 수 있도록 도와주세요.
      p3: 그의 그림이 기억될 것이라고 그에게 알려주십시오
      p4: 12월 중순이 되기 전에 그를 치료하고 살려주세요
    points_fail:
      p1: 그림 예술은 연말에 채권자에게 넘어갔고, 2월에 카타리나는 어머니에게 전달할 그림이 하나도 없었습니다. 이 지점은 역사에서 사라졌고 사무실에서는 그 직원을 소환했습니다.
      p2: 그림은 그의 손에 남아 있었고 하나도 팔리지 않았습니다. 이 지점에서는 가계의 빚이 날로 늘어만 갔다.
      p3: 그는 이 그림들이 어떻게 될지 결코 알지 못했습니다. 이 분야에서는 200년 후에 사람들이 하나씩 그 내용을 추적할 것이라고 그에게 말한 사람이 아무도 없었습니다.
      p4: 12월은 역사상 그랬던 것처럼 흘러갔습니다. 하루 반 만에 그는 건강한 상태에서 사망했습니다. 이 지부에서 카타리나는 여전히 11명의 자녀와 함께 빚을 지고 있었습니다.
    shift:
      p1:
        was: 1676년 2월 24일 Catharina Bolnes는 채권자를 만족시키기 위해 팔리지 않도록 그녀의 어머니 Maria Thins에게 The Art of Painting을 넘겼습니다. 베르메르는 빚을 졌음에도 불구하고 그것을 결코 팔지 않았습니다.
      p2:
        was: 1672년 전쟁부터 베르메르는 자신의 미술품을 팔 수 없었고, 자신이 거래했던 다른 대가들의 그림을 보유하게 되었습니다. Catharina는 나중에 이것을 가계 부채의 원인으로 제시했습니다.
        now: 그해 12월 그림 중 몇몇이 구매자를 찾았고, 빵값과 다른 빚은 한동안 늘어나지 않았습니다.
      p3:
        was: 1675년 그가 죽은 후 베르메르는 거의 2세기 동안 거의 잊혀졌습니다. 1860년대가 되어서야 Thoré-Burger의 연구가 그의 연구를 다시 주목하게 되었습니다.
        now: 누군가 그에게 언젠가는 이 조용한 방을 찾아 그림 하나하나를 찾아 추적하게 될 것이라고 말했습니다.
      p4:
        was: 1675년 12월에 Catharina는 나중에 빚과 아이들의 무게로 인해 건강에서 사망까지 하루 반 만에 갔다고 썼습니다. 그는 12월 15일 43세의 나이로 델프트에 묻혔다.
        now: '{staff}는 그 해 12월 내내 그와 함께 있었고, 하루 반은 결코 오지 않았습니다. 그는 델프트에 있는 자신의 작업실로 돌아가 몇 년 동안 그림을 그렸고, 카타리나와 11명의 아이들은 그 겨울에도 그를 잃지 않았습니다.'
        who: vermeer_delft
        bio: 이 라인에서 베르메르는 1675년 12월까지 살았으며 델프트에서 몇 년 동안 그림을 그렸고 그의 가족이 빚을 갚는 것을 보았습니다.
    vignettes:
      bread: 12월 5일 {staff}는 빵집 소년이 Oude Langendijk를 따라 아침 빵을 나르는 것을 돕습니다. 한 문에서 소년은 돈을 받지 않고 빵을 건네주고 그의 작은 책에 표시를 합니다. 그의 주인은 토요일마다 그 페이지에 대해 투덜대고, 월요일마다 빵을 똑같이 보낸다고 합니다.
      frames: 1월에 {staff}는 아침에 프레임 제조업체의 상점에서 접착제가 굳는 동안 연귀 모서리를 잡고 시간을 보냅니다. 벽에 붙어 있는 프레임의 절반이 비어 있습니다. 액자 제작자는 프랑스인이 72년에 들어왔기 때문에 그림용이 아닌 거울용 액자를 구입하며, 거울은 적어도 두 번 돈을 요구한 적이 없다고 말합니다.
      peat: 2월 중순에 {staff}는 이탄 판매자가 시장 광장에 젖은 잔디를 쌓는 것을 돕습니다. 그녀는 손가락을 불며 이번 겨울은 델프트의 모든 사람들이 값싼 물건을 태워서 마을 전체가 불 옆에 젖은 개 냄새가 난다고 말했습니다.
  rembrandt_amsterdam:
    name: 아들을 잃은 뒤
    place: 암스테르담
    figure: 렘브란트 판 레인
    story: 렘브란트의 아들 티투스는 결혼한 지 반년 뒤인 1668년 9월 7일 암스테르담에 묻혔습니다. 1669년 3월 티투스의 딸 티티아가 태어났다. 그해 렘브란트는 1669년의 자화상을 그렸습니다. 그는 1669년 10월 4일에 세상을 떠났고 4일 후에 빌린 무덤에 묻혔습니다. 그의 마지막 그림은 미완성으로 남았습니다. 티투스의 미망인은 10월 21일에 장사되었습니다.
    story_prose:
      opening:
        - 1669년 9월 암스테르담. 63세의 화가 렘브란트 판 레인(렘브란트 판 레인)은 <야경>을 그렸으며 1656년에 파산하여 이곳에서 빚을 지며 말년을 보내고 있습니다. 1년 전, 그의 자녀 중 유일하게 성장한 그의 아들 티투스(Titus)가 결혼한 지 반년 만에 묻혔습니다. 3월에 티투스의 딸 티티아가 태어났다. 올해 그는 날짜가 적힌 자화상을 여러 장 그렸으며, 그의 마지막 그림은 아직도 이젤 위에 서 있습니다.
        - 역사상 그는 10월 4일에 사망했고 4일 후 임대 무덤에 묻혔습니다. 이젤에 그려진 그림은 미완성으로 남아 있으며 현재 스톡홀름 국립박물관에 소장되어 있습니다. 그로부터 2주 후에 디도의 과부도 장사되었습니다. 이 지점에는 운하 옆의 색칠공, 물을 따라 이탄을 젓는 바지선, 거리에서 딸랑이를 흔드는 야간 경비원이 있습니다.
        - 한 종류의 사람이 이 여행에 도움을 줄 수 있습니다. 붓을 쥐고 손이 안정된 사람, 화가의 눈과 손이 여전히 안정된 사람, 색을 갈고 캔버스를 안정시키는 사람입니다.
      outcomes:
        all: 10월 4일 렘브란트는 63세의 나이로 세상을 떠났다. 그림은 여전히 이젤 위에 서 있었고, 노인의 손은 이전보다 몇 획 더 쳐져 있었고, 팔레트는 색이 말라버린 채 한쪽에 놓여 있었다.
