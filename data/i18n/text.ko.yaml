  gutenberg_mainz:
    name: 금속 활자로 책을 찍다
    place: 마인츠
    figure: 요하네스 구텐베르크
    story: 요한 푸스트(Johann Fust)는 마인츠에서 구텐베르크의 인쇄 작업에 자금을 지원했습니다. 42행으로 된 책은 푸스트의 상환 및 이자 요구를 기록한 1455년 11월 6일 문서와 함께 남아 있습니다. 문서에는 두 사람이 어떤 도구를 보관했는지 기록되어 있지 않습니다.
    story_prose:
      opening:
        - 마인츠의 인쇄공이 새 종이를 빛에 비춰 귀퉁이에 표시를 합니다. 종이 공급자는 이번에도 돈을 받을 것인지 묻습니다. 구텐베르크에는 확인해야 할 페이지가 쌓여 있습니다. Fust에는 해결해야 할 금액이 있습니다.
        - 이 무렵에 42행본이 완성되었습니다. 1455년 11월 6일자 공증서는 구텐베르크와 푸스트 사이의 분쟁을 기록합니다. 여기에서 실행을 계속 제공하고 파트너십이 종료된 후에도 Gutenberg가 계속 사용할 수 있는 도구에 동의하도록 요청할 수 있습니다.
        - 종이, 종류, 임금을 확인할 수 있는 사람을 보내십시오. 도구 문제를 해결하려면 두 사람이 합의문을 큰 소리로 낭독하도록 할 수 있는 사람도 필요합니다.
      points:
        p1: 인쇄공은 종이 더미를 세고 한 묶음이 더 필요하다고 말합니다. 공급상에게 작업 전표를 보고 그날 인쇄를 마친 종이를 세어 달라고 합니다. 이어 구텐베르크와 함께 다음에 들여올 종이와 인건비를 따로 적습니다. 공급업체는 재고를 회수하기 위해 표시를 지웁니다. 이튿날 아침 인쇄기 판 위에는 새 종이가 놓여 있습니다.
        p2: Fust는 전체 계정을 가져옵니다. 각 선불 비용이 무엇인지는 표시되지 않습니다. 당신은 구텐베르크에게 여전히 필요한 도구부터 시작하도록 요청하고 점원이 두 사람에게 각 항목에 대한 조건을 읽어 달라고 요청합니다. 각각 복사본을 가져오고 나무 손잡이는 고리에 그대로 유지됩니다. 구텐베르크는 떠날 때 자신의 사본을 임금 장부에 접습니다.
      outcomes:
        all: 42줄짜리 판이 완성되었으며 후원자들은 아직 결제해야 할 계정을 가지고 있습니다. 각 사람은 구텐베르크가 사용할 수 있는 도구에 관한 계약서 사본을 가지고 있습니다.
        p1: 프린터가 작업을 마치고 완성된 시트가 작업장에서 나옵니다. 공증인은 도구와 돈에 관한 논쟁을 계속 듣게 될 것입니다.
        p2: 그가 사용할 수 있는 도구 목록이 작성되어 있습니다. 에디션이 동기화되지 않았고 여행은 토론 기록만 가져옵니다.
      none: 미완성 시트가 인쇄기에 남아 있습니다. 근로자와 공급업체는 여전히 답변을 기다리고 있습니다.
      not_admitted: 프린터는 출입구를 통해 방문객이 종이나 계산서 때문에 왔는지 묻습니다. 아무도 당신을 들여오지 않습니다. 밖에서는 벤치에 판자가 놓인 소리만 들립니다.
      desync: 언론이 중간에 멈췄습니다. 종이와 임금이 다 떨어졌습니다. 출판물이 동기화되지 않고 사무실에서 여행자를 회수합니다.
      excerpts:
        p1: 공급업체는 재고를 회수하기 위해 표시를 지웁니다. 이튿날 아침 인쇄기 판 위에는 새 종이가 놓여 있습니다.
        p2: 각각 복사본을 가져오고 나무 손잡이는 고리에 그대로 유지됩니다. 구텐베르크는 떠날 때 자신의 사본을 임금 장부에 접습니다.
    relic: 납 활자
    relic_desc: 납과 주석으로 주조한, 글자가 좌우 반대로 새겨진 작은 활자.
    points:
      p1: 인쇄 작업은 빌린 돈에 의존하는 동안 42행의 책을 끝낼 수 있을 만큼 활자, 종이, 작업자를 충분히 확보하십시오.
      p2: 11월 절차가 진행되기 전에 Gutenberg와 Fust가 파트너십이 종료된 후에도 Gutenberg가 계속 사용할 수 있는 도구에 동의하도록 도와주세요.
    points_fail:
