          else: 12월 24일에 다시 비가 창고 지붕을 뚫고 들어와 빗물을 받아온 대야가 문까지 닿았습니다. {staff}는 보고서 두 장과 업무 중단 일지를 들고 아침 내내 학교 사무실 밖에서 방 책임자가 나올 때까지 기다렸다가 페이지를 하나씩 넘겨주었습니다. 그는 작업이 중단되고 아직 오랜 시간이 지난 페이지를 넘기고 서랍에서 열쇠를 꺼내 일기장 위에 올려 놓았습니다. 열쇠에는 방 번호가 적힌 작은 나무 태그가 걸려 있었습니다.
        p3:
          class_medical: 8월 말, 창고는 숨이 막힐 지경이었고, 벤치 위에는 계속해서 정제된 용액이 담긴 유리 접시가 한 줄로 놓여 있었습니다. Marie와 Pierre는 여전히 접시를 들고 맨손으로 접시를 따랐습니다. {staff}는 간호학 교시대로 벤치 앞에 방패를 설치하고 그 뒤로 샘플을 하나씩 옮기고 장갑 한 켤레를 각자 건네주면서 이건 피를 흘리지 않고 상처를 준다고 말했다. 마리는 방패를 바라보며 장갑을 끼고 그 뒤로 손을 뻗어 유리 접시를 집었습니다. 저녁이 가까워지면서 방이 어두워지자 접시 안에 있던 물건이 희미한 빛을 발했습니다. 그것은 그녀의 손이 아닌 방패 위에 떨어졌습니다.
          class_learned: 8월 말, 창고는 숨이 막힐 정도로 답답했고, 벤치 위에는 계속해서 정제된 용액이 담긴 유리 접시가 줄지어 서 있었습니다. Marie와 Pierre는 여전히 접시를 들고 맨손으로 접시를 따랐습니다. {staff}는 실험실 요구에 따라 벤치 앞에 쉴드를 설치하고 샘플을 그 뒤로 이동시킨 후 신체에서 얼마나 안전한지 측정하고 벤치에 분필로 선을 긋고 그 옆에 장갑 두 켤레를 눕혔습니다. 마리는 방패를 바라보며 장갑을 끼고 그 뒤로 손을 뻗어 유리 접시를 집었습니다. 저녁이 가까워지면서 방이 어두워지자 접시 안에 있던 물건이 희미한 빛을 발했습니다. 그것은 그녀의 손이 아닌 방패 위에 떨어졌습니다.
