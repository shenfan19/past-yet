  bessie_coleman_jacksonville:
    name: 이륙 전, 그녀의 이름
    place: 잭슨빌
    figure: 베시 콜먼
    story: 베시 콜먼은 1921년 6월 15일 프랑스에서 국제 조종사 자격증을 취득했습니다. 1926년 4월 30일 그녀는 노동절 행사를 앞두고 잭슨빌의 Paxon Field에서 연습 비행을 하던 중 사망했습니다.
    story_prose:
      opening:
        - 1926년 4월, 잭슨빌. 베시 콜먼(베시 콜먼)은 프랑스에서 비행법을 배웠습니다. 그녀는 현재 플로리다에 있으며 지역 항공 행사를 준비하고 있습니다.
        - 역사상 그녀는 4월 29일에 학생들을 방문했고 다음날 연습 비행 중 사망했습니다. 이 지점에서 주최측은 그녀를 학교에 데려다 줄 차를 빌리고 싶어합니다.
        - 학교 및 주최자와 대화할 수 있는 사람이 도움을 줄 수 있습니다. 항공기에 대해 알고 이륙을 기다리는 모든 사람에게 추가 확인을 요청할 수 있는 사람도 마찬가지입니다.
      points:
        p4: '{staff}는 먼저 지상 승무원을 그곳으로 데려오고 Coleman 및 조종사와 함께 검사를 듣습니다. 지켜보고 있는 누군가가 예약된 자리를 차지할 사람이 누구인지 묻습니다. Coleman은 비행기표를 달라고 합니다. 조종사는 다른 날에 사용할 수 있는 시간을 지적합니다. 그녀는 연필을 들고 오늘의 줄을 비워 둡니다.'
        p2: 학생들은 질문이 많습니다. 하나는 너무 작아서 학생이 들어도 가져갈 사람이 없습니다. {staff}는 뒤에 남아 있는 교사에게 그것을 건네주고, 그에게 다음 수업 시간을 내달라고 요청하고, Coleman에게 훈련 소식을 보낼 수 있도록 교사의 주소를 알려줍니다. 교사는 칠판 한쪽 구석에 자신의 주소를 복사합니다. 마지막 학생이 돌아서서 집 번호를 다시 적습니다.
        p1: '{staff}는 행사 일정을 학교에 가져가서 학생들에게 이미 주어진 시간을 확인한 다음 주최측을 위해 다른 차량을 가져옵니다. Coleman이 도착할 때쯤에는 홀에 줄이 늘어서 있었습니다. 맨 앞에 있는 아이가 자신의 이름이 적힌 종이를 펴고 있습니다. 그녀가 자리에 앉은 후에야 그는 질문을 책상 위로 밀었습니다.'
      outcomes:
        all: 그날은 연습비행이 없습니다. Coleman은 책 안에 선생님의 주소를 넣고, 그녀와 조종사는 빈 줄을 맨 위로 돌립니다.
        p4: 연습 비행은 하루 더 남았습니다. 필드가 닫힐 때 아무도 줄에 새 번호를 입력하지 않았습니다.
        p2: 교사는 질문을 교실로 가져가서 다음 수업을 위해 책 옆에 놓아둡니다.
        p1: 학교 방문은 예정대로 진행됩니다. 마지막에 누군가가 여전히 문 옆에서 Coleman의 이름이 적힌 신문을 기다리고 있습니다.
      none: 행사가 끝난 후에도 테이블 위에는 여전히 몇 개의 목록이 남아 있지만 그것을 가져갈 사람은 아무도 남아 있지 않습니다.
      not_admitted: '{staff}는 학교 주최자나 제작진에게 연락하지 않습니다. 누군가가 출입구에서 마지막 의자를 옮기고 있습니다.'
      desync: 학교 방문이 일정에서 제외되었습니다. 사무실에서 {staff}를 다시 호출했지만 아이들은 여전히 문에서 기다리고 있습니다.
      excerpts:
