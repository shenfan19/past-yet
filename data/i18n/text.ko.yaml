    relic: 완두콩 꼬투리
    relic_desc: 수도원 정원에서 가져온 말린 꼬투리입니다.
    points:
      p1: Mendel이 8년간의 계산을 두 개의 강연으로 통합하고 브르노 사회에 대한 두 가지 기록을 보호할 수 있도록 도와주세요.
      p2: 청취자가 들었던 숫자를 확인할 수 있도록 세대별로 개수를 구분합니다.
      p3: 청취자가 아직 거기 있는 동안 인쇄된 설명이 나오기 전에 Mendel이 다른 사이트에서 복제 작업을 준비하도록 도와주세요.
    points_fail:
      p1: 첫 번째 회의 시간이 부족하고 두 번째 회의는 예정되어 있지 않습니다. 계정이 불완전하며 동기화가 중단된 후 사무실에서 해당 직원을 회수합니다.
      p2: 독자들은 총계를 집으로 가져가지만 어느 것이 1세대에서 나온 것인지, 어느 것이 나중에 나온 것인지 알 수 없습니다.
      p3: 브르노 외부의 독자들은 회보와 별쇄본을 기다려야 하며, 참석한 어느 누구도 집계를 반복하는 데 동의하지 않았습니다.
    shift:
      p1:
        was: 1865년 2월 8일과 3월 8일에 멘델은 브르노 자연사 협회에 두 차례에 걸쳐 완두콩 실험을 보고했습니다.
      p2:
        was: 1865년 회담은 수년간의 완두콩 수량을 바탕으로 이루어졌습니다. 1866년에 발표된 논문에서는 결과를 세대별로 구분했습니다.
        now: '{staff}는 Mendel에게 강연이 끝난 후 비교 시트를 남겨서 청취자가 자신의 메모를 확인할 수 있도록 했습니다.'
      p3:
        was: 브르노 협회는 1866년에 이 논문을 인쇄했습니다. 멘델은 자신의 결과를 확인하기 위해 다른 학자들과 연락하기 위해 사본을 사용했습니다.
        now: '{staff}는 관찰자의 주소를 기록하고 어떤 숫자를 다시 보낼지에 동의합니다. 다음 성장 시즌에 한 관찰자는 절차가 배포되기 전에 Mendel이 자신의 것과 비교할 수 있는 수치를 브르노에 보냅니다.'
        who: mendel_brno
        bio: Mendel의 논문은 결국 절차에 등장했습니다. 회담에서 시작된 복제는 그가 독립적으로 확인할 수 있는 더 빠른 결과를 가져왔습니다.
    vignettes:
      straw: '{staff}는 짐꾼이 회의실 문 앞에 돗자리를 놓는 것을 도와줍니다. 눈이 모든 부츠를 녹이고, 짐꾼은 신사들이 발을 닦느니 차라리 완두콩 이야기를 듣게 될 것이라고 말했습니다.'
      market: '{staff}는 양배추 시장에서 한 노부인이 말린 완두콩을 분류하는 것을 돕습니다. 한 더미에는 둥근 완두콩, 다른 더미에는 주름진 완두콩이 있습니다. 둥근 것이 더 잘 팔린다고 그녀는 말합니다. {staff}는 어쨌든 두 힙을 모두 계산하고 거의 3 대 1로 나오고 먼저 웃습니다.'
      furrow: 3월 말, {staff}는 마을 밖의 들판길을 걷습니다. 한 농부가 겨울 똥을 깔고 있는데 올해는 늦서리가 내리기 전에 완두콩을 일찍 수확해야 한다고 합니다.
  mendeleev_petersburg:
    name: 원소 주기율표
    place: 상트페테르부르크
    figure: 드미트리 멘델레예프
    story: 1869년 3월 1일 드미트리 멘델레예프(드미트리 멘델레예프)는 원자량과 화학적 유사성에 따라 원소를 그룹화한 한 페이지짜리 표를 작성했습니다. 3월 18일 러시아 화학 학회 회의에서 니콜라이 멘슈트킨은 멘델레예프가 없는 가운데 논문을 읽었습니다. 회의록은 토론을 다음 회의로 미루었고 그 주제는 다루어지지 않았습니다. 이 표는 3월 후반에 멘델레예프의 화학 교과서에 등장했으며 별도로 배포되었습니다. 그해 봄 독일 초록에서는 주기적인 재발이 단계적인 변화로 바뀌었다.
    story_prose:
      opening:
        - 1869년 봄, 상트페테르부르크. 3월 1일 드미트리 멘델레예프(드미트리 멘델레예프)는 원자량과 화학적 유사성에 따라 원소를 그룹화한 한 페이지 분량의 표를 완성했으며, 아직 발견되지 않은 원소에 대해서는 공백을 남겨 두었습니다.
        - 역사상 그는 3월 18일 러시아 화학회 모임에서 트베리 지방의 치즈 낙농장을 보러 갔을 때 결석했고, 니콜라이 멘슈트킨이 그를 위해 논문을 읽었습니다. 작성자가 부재했기 때문에 의사록이 토론을 미루었고 다음 회의에서는 아무도 이 문제를 제기하지 않았습니다. 지난 5월 독일로 보낸 초록에서는 그의 첫 번째 결론인 속성의 주기성이 단계적 변화로 나왔다. 이 분야에서는 인쇄소의 인쇄공이 테이블에 있는 빈 상자에 대해 투덜거리고, 여관 주인이 사모바르를 보관하고 있습니다.
        - 이 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 논문을 알고 테이블에 있는 원고에 대해 말할 수 있는 사람; 회의에서 가르치고 일련의 질문을 전달할 수 있는 사람; 독일어를 알고 단어 하나도 알아듣는 사람.
      outcomes:
        all: 그 해 여름 독일 독자들은 초록에서 주기적인 반복을 발견했습니다. 상트페테르부르크 회의 회의록에는 탁자 항목 다음으로 반 페이지 분량의 질문과 답변이 이어졌고, 탁자 자체의 빈칸 몇 군데에는 그 옆에 연필 고리가 있었습니다.
        p2: 학회 회의록에는 이제 테이블 항목 뒤에 반 페이지 분량의 질문과 답변이 이어졌습니다. 그는 나중에 여러 틈새 옆에 연필 고리를 끼고 테이블을 그 옆에 두었습니다.
        p3: 그해 여름 독일 독자들은 초록에서 요소의 특성이 주기적으로 반복된다는 사실을 발견했습니다. 누군가가 예외에서 재발을 어떻게 구별하는지 묻는 글을 썼을 때, 그는 표를 펼치고 한 점씩 대답했습니다.
        p1: 3월 말에 이 표는 화학 원리의 두 번째 책과 함께 나왔고, 동료들을 위해 별도의 시트로도 인쇄되었습니다. 1875년에 갈륨이 발견되어 갈륨의 빈 공간 중 하나를 메웠습니다.
      none: 4월 15일에 학회가 다시 모였으나 아무도 자리를 마련하지 못했습니다. 프린터에서는 마른 시트가 라인에서 하나씩 내려왔지만 간격은 여전히 틈이 있습니다.
      desync: 3월 18일 Menshutkin에는 테이블만 있었습니다. 원고는 여전히 수하물에 포장되어 있었고 사회는 그 물건을 쳤습니다. {staff}가 리콜되었을 때 테이블은 여전히 회의실 책상 위에 펼쳐져 있었고 누구도 손을 대지 않았습니다.
      not_admitted: '{staff}는 협회의 문을 통과하지 못했고 여관에서 며칠 동안 사모바르에서 차를 마시는 법을 배웠습니다. 골키퍼는 탭이 올바른 방향으로 돌아갈 때까지 내내 {staff}의 부츠를 지켜보았습니다.'
