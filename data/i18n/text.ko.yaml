  hammurabi_babylon:
    name: 돌에 새긴 법
    place: 바빌론
    figure: 함무라비
    story: 함무라비 통치 말기인 기원전 1754년경, 거의 300개의 율법이 새겨진 현무암 비석이 세워졌고, 서기관들은 그 이후 수세기 동안 그 율법을 점토판에 복사했습니다. 기원전 12세기에 비석은 수사(Susa)로 옮겨졌고, 그 본문의 여러 기둥이 긁혔습니다. 1901년 프랑스 탐험대가 수사에서 그것을 발굴했습니다. 그것은 지금 루브르 박물관에 있고 점토 사본은 긁힌 것의 일부를 돌려주었습니다.
    story_prose:
      opening:
        - 바빌론, 기원전 1754년경. 함무라비 통치 말기에 현무암 비석에는 프롤로그, 재산, 무역, 가족 및 노동에 관한 약 282개의 법률과 에필로그가 새겨져 있습니다. 에필로그에서는 억울한 일을 당한 사람이 돌 앞에 와서 그 사람에게 그 말을 읽어 줄 수 있다고 말합니다. 서기관들은 율법을 점토판에 복사하여 한 세대에서 다음 세대로 가르칩니다.
        - 역사상 기원전 12세기에 엘람 왕 Shutruk-Nahhunte가 비석을 수사로 가져갔고, 비석 앞면의 기슭에 있는 여러 기둥이 나중에 매끄럽게 긁혔습니다. 점토 사본은 사라진 법칙 중 약 30개를 돌려줬고 나머지는 아직 알려지지 않았습니다. 이 분야에서는 서기관의 견습생이 진흙을 반죽하고 판을 말리는데, 유프라테스 강의 뱃사공은 글을 읽을 수 없습니다.
        - 이번 여행에는 몇 가지 사람들이 도움을 줄 수 있습니다. 사무직에 익숙하고 건너뛴 줄을 잡을 수 있는 사람; 갈대를 자르고 표지판을 누를 수 있는 꾸준한 장인; 기둥 하나하나까지 꼼꼼하게 확인할 정도로 꼼꼼한 사람, 돌의 세세한 부분까지 돋보이게 하는 안경을 쓴 사람.
      outcomes:
        p1: 3000여 년이 지난 후, 다른 도시에서 내려온 한 판이 그 매끈하게 펼쳐진 돌 옆에 놓여졌습니다. 누군가가 돌에 더 이상 존재하지 않는 법칙까지 쐐기를 따라 한 줄씩 읽어 내려갔습니다.
      none: 그 판은 여전히 지붕 위에서 말랐고, 견습생은 여전히 그것을 하나하나 세었다. 몇 세기 후에 비석은 옮겨졌고, 비석의 발 부분에 있는 기둥은 평평하게 갈아져 손 아래에 어떤 느낌도 남지 않았습니다.
      not_admitted: '{staff}는 결코 서기관의 집에 들어가지 않았고, 뱃사공이 유프라테스 강에서 보리 몇 자루를 내리는 것을 도왔습니다. 자루를 세면서 뱃사공은 왕의 돌에 대해 다시 이야기했지만 그 표시는 읽을 수 없었습니다.'
      points:
        p1:
          class_lettered: 그 방에는 12개의 새로운 점토판이 놓여 있었습니다. 서기관은 돌의 전체 텍스트를 여러 번 복사하여 그 사본을 다른 도시로 보내 보관하려고 했습니다. 사무직에 익숙한 {staff}는 완성된 각 판의 선을 위에서부터 대인을 상대로 세어보고, 선을 건너뛴 곳에는 점토가 부드러워질 때 다듬어서 다시 썼다. 서기관은 마지막 판의 가장자리를 따라 원통형 봉인을 굴려서 작은 숫자와 표시의 띠를 남겼습니다. 견습생은 짚이 깔린 바구니에 석판을 하나씩 포장하고 입을 다물고 뱃사공과 함께 강에 있는 배로 내려갔습니다.
          class_craft: 그 방에는 12개의 새로운 점토판이 놓여 있었습니다. 서기관은 돌의 전체 텍스트를 여러 번 복사하여 그 사본을 다른 도시로 보내 보관하려고 했습니다. {staff}는 손이 안정적이고 몇 개의 갈대에 비스듬한 팁을 자르고 점토 조각에 각각을 시도한 다음 가장 날카로운 것을 서기관에게 건네주고 마스터로부터 전체 태블릿을 눌렀습니다. 서기관은 마지막 판의 가장자리를 따라 원통형 봉인을 굴려서 작은 숫자와 표시의 띠를 남겼습니다. 견습생은 짚이 깔린 바구니에 석판을 하나씩 포장하고 입을 다물고 뱃사공과 함께 강에 있는 배로 내려갔습니다.
