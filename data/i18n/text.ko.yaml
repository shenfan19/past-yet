      not_admitted: '{staff}는 절대로 리허설실에 들어가지 않습니다. 아래층에서 짧게 끊어진 문구 소리가 들립니다.'
      desync: 리허설에는 그녀가 따로 떼어 놓은 시간이 필요합니다. 소속사에서 {staff}를 리콜할 때 노래의 마지막 줄은 비어 있다.
