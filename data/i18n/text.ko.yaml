      refrain: 뱃사공은 이야기 속 질문을 듣고 흥얼거리기 시작합니다. 곡이 끝날 때까지 기다렸다가 처음으로 가사를 들었던 곳을 묻습니다.
      wait: 페리가 기다리는 동안 당신은 창구 직원에게 두 사람이 처음 이야기했던 곳으로 돌아가 달라고 요청합니다. 육지에서는 누가 첫 번째 질문을 했는지 아직도 기억할 수 있습니다.
  sima_qian_changan:
    name: 형벌을 받은 뒤에 쓴 역사서
    place: 장안
    figure: 사마천
    story: 한서는 사마천이 임안에게 보낸 편지를 보존하고 있는데, 여기서 그는 자신의 역사적 작업의 목적과 조직을 논의합니다.
    story_prose:
      opening:
        - 장안, 기원전 98년경. 사마천은 Li Ling을 대변한 후 투옥됩니다. 그는 Ren An에게 보낸 편지를 되돌아보면서 당시 자신의 역사가 단지 초안이었음을 기억합니다.
        - 역사상 가족은 형을 상환하기 위해 돈을 지불할 수 없었습니다. 그는 처벌을 받고 나중에 그의 역사를 마쳤습니다. 이 지점에서는 누군가 집에서 느슨한 페이지를 관리할 수 있고 누군가가 책임 있는 서기에게 청원서를 얻으려고 노력하고 있습니다.
        - 초안을 확인할 수 있는 사람, 수감자의 일상적인 필요 사항을 처리할 수 있는 사람, 여러 가구의 약속을 하나의 제안으로 통합할 수 있는 사람이 필요합니다.
      points:
        p3: '{staff}는 돕고 싶은 사람들에게 테이블에서 그들이 기여할 수 있는 것이 무엇인지 말하도록 요청한 다음 청원서와 돈을 점원에게 가져옵니다. 점원은 그것을 세고 사본을 받았다고 표시합니다. 며칠 후 사마천이 집에 오면 먼저 등불을 켭니다. 그는 맨 위 묶음을 풀고 모서리가 눌려져 있던 잎사귀를 들어 올려 계속해서 글을 씁니다.'
        p2: '{staff}는 음식과 갈아입을 옷을 배달 받는 곳으로 가져오고 계산되는 동안 기다립니다. 사마천은 묶음을 열고 더 두꺼운 옷을 다리에 걸었습니다. 음식은 아직 따뜻해요. 그는 그릇을 무릎 사이에 내려놓고 몸을 굽혀 먹는다.'
        p1: 그의 가족이 식탁을 치웠습니다. {staff}는 묶음 끝에 표시되는 시작 줄을 확인하고, 옮겨진 나뭇잎을 제자리로 되돌리고, 묶음이 동일한 순서로 돌아가도록 요청합니다. 마지막 묶음이 닫히기 전에 누군가 라벨을 바깥쪽으로 돌립니다. 다른 것을 먼저 이동하지 않고도 다음 것을 찾을 수 있습니다.
      outcomes:
        all: 원고는 집에 남아 있습니다. 돌아올 때 사마천은 중단한 부분부터 다시 시작할 수 있으며 램프를 다시 채우기 위해 누군가가 문 옆에서 기다립니다.
        p3: 청원이 수락되었습니다. 나중에 누군가가 도움을 요청하면 사마천은 방문객을 위한 공간을 마련하기 위해 팔꿈치로 묶음을 움직입니다.
        p2: 더 두꺼운 옷이 그 옆에 남아 있습니다. 다른 사람들이 떠난 후, 그는 다시 스스로 마무리할 수 있습니다.
        p1: 떠나기 전, 테이블을 지켜보는 사람이 라벨을 다시 한 번 확인한다. 각 번들은 여전히 그 자리에 있습니다.
      none: 문밖의 사람들이 집에 돌아간 후에도 빈 테이블에는 여전히 등불이 켜져 있습니다.
      not_admitted: '{staff}는 배달을 받는 점원을 결코 만나지 않습니다. 그들이 가져온 것은 밖에 남아 있습니다.'
