    story_prose:
      opening:
        - Slough에서 어두워진 후 캐럴라인 허셜은 조수에게 램프를 옮겨달라고 요청합니다. 그녀가 방금 그린 물체는 가장자리가 흐릿한 반면, 근처의 밝은 별들은 선명합니다. 그녀가 내일 그것을 다시 찾으려면 어둠 속에서 읽을 수 있는 그림이 필요할 것입니다.
        - 역사상 Herschel은 1786년 8월 1일과 2일의 관찰을 비교하고 Charles Blagden에게 그림을 보냈습니다. 그녀는 나중에 오빠를 돕는 대가로 돈을 받았고 그가 망원경에 있을 때 판독을 했습니다. 이 지점에서 그녀는 자신만의 정규 밤을 요청할 수 있습니다.
        - 시계를 읽고 다이어그램을 일치시키는 사람이 유용한 쌍을 만드는 데 도움을 줄 수 있습니다. 협상할 수 있는 사람은 보고서와 함께 향후 일정을 전달할 수 있습니다.
      points:
        p1: 첫 번째 그림에는 점이 세 개 있습니다. 조수가 두 번째 시트를 잘못된 방향으로 돌립니다. 당신은 Herschel에게 동일한 참조 별부터 시작하여 차례로 각 점을 가리키도록 요청합니다. 두 시트 모두 여백에 시간이 있습니다. 그녀는 그것들을 램프 옆에 놓고 위치 변화를 직접 기록합니다. 그녀는 그것들을 접을 때 첫날 밤의 시간을 바깥에 둡니다.
        p2: 보고서를 받는 사람은 그림을 넣을 공간을 마련했습니다. 당신은 Herschel에게 달력을 옆에 놓아달라고 요청하여 그녀가 대형 망원경으로 판독한 후 얼마나 많은 밤이 남았는지 확인할 수 있습니다. 그녀는 두 개의 빈 공간에 자신의 이름을 쓰고 두 종류의 작품을 별도로 나열해 달라고 요청합니다. 다음 달력에서 그녀는 미리 자신만의 밤을 계획할 수 있습니다.
      outcomes:
        all: 보고서에는 그림과 그녀의 시간 요청이 모두 보존되어 있습니다. 조수의 일과가 정해지면 그녀가 선택한 관찰을 위해 며칠 밤이 예약됩니다.
        p1: 편지에는 비교와 그림이 포함되어 있습니다. 그녀는 오빠의 작업을 기록하는 데 밤을 보내는 동안 여전히 자신의 망원경을 장착할 것입니다.
        p2: 제안된 일정이 집을 떠났습니다. 첫날 밤의 참조 별이 충분하지 않은 경우 요청은 이번 여행에서 보존할 수 있는 유일한 변경 사항입니다.
      none: 두 도면이 나란히 놓여 있어 비교할 참조 자료가 너무 적습니다. 일정은 그대로 유지됩니다.
      not_admitted: 도우미는 방문자에게 사다리를 깨끗하게 유지하도록 요청합니다. 등불은 그늘 아래로 돌아가고 여행자는 그 아래에 머뭅니다.
