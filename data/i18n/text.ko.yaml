    relic: 석판
    relic_desc: 학교 출석부, 여러 번 지우고 적었습니다.
    points:
      p1: 배고픈 몇 주 동안 밤낮으로 일하는 동안 그를 계속해서 일어서게 하여 2월 27일 하디에게 보낸 답장이 작성되어 보내질 수 있도록 해주세요.
      p2: 장학금이 올 때까지 한 달에 30루피로 그의 가족을 도와주세요.
      p3: 영국으로 떠나기 전, 자꾸만 찾아오는 오래된 병을 보고 치료해보세요
    points_fail:
      p1: 2월 27일에 그는 램프 아래에 쓰러졌고, 답장은 전혀 쓰여지지 않았고 하디는 더 이상 아무 말도 듣지 못했습니다.
      p2: 이 지점에서는 매일 밤 일을 하는 것 외에도 여전히 가족의 식량 비용이 그에게 부담이 되었고 기록은 한 줄이 부족합니다.
      p3: 그는 병이 아직 남아 있는 채로 여행을 떠났고, 1917년에 병에 걸려 역사에서와 마찬가지로 1920년에 Kumbakonam에서 사망했습니다.
    shift:
      p1:
        was: 1913년 2월 27일 라마누잔은 하디에게 답장을 마치고 자신이 반쯤 굶주리고 있다는 내용의 편지를 보냈습니다.
      p2:
        was: 1913년 5월 장학금이 들어올 때까지 가족은 한 달에 30루피의 월급으로 생활했습니다.
        now: 그 달에는 쌀 항아리가 비어 있지 않았습니다.
      p3:
        was: 그는 1917년 영국에서 중병에 걸렸으나 확실한 진단을 받지 못했으며 1919년 인도로 돌아가 다음 해 4월 32세의 나이로 사망했습니다.
        now: 마드라스의 한 낯선 사람은 그가 여행하기 전에 그의 오래된 질병을 알아보고 치료했습니다. 그는 케임브리지에 있는 요양원에 가지 않았고, 인도로 돌아온 후에도 수년 동안 수학 공부를 했습니다.
    vignettes:
      sums: '{staff}는 끝에 기록된 단일 합계 옆에 있는 정수 행의 첫 번째 합계로 1, 3, 6 및 10을 계산하고 합계 열에 제목을 지정합니다.'
      future: '{staff}는 언젠가 이 편지에 무슨 내용이 쓰여질지 알고 처음 편지를 펼친 사람이 무엇을 이해할 것인지 묻고 표지를 앞에 놓는다.'
      address: '{staff}는 점원에게 패킷을 묶기 전에 패킷에 있는 주소를 큰 소리로 읽어 달라고 요청하고 전표에 날짜를 보관합니다.'
  sequoyah_syllabary:
    name: 한 사람이 만든 문자
    place: 미국 남동부 체로키 지방
    figure: 세쿼야
    story: 체로키족의 은세공인 세쿼야(세쿼야)는 1821년에 체로키족의 문자 체계를 완성했습니다. 그 기호는 개별적인 소리보다는 음절을 나타냅니다. 체로키 민족은 1820년대 후반에 공식적으로 음절을 채택했습니다. 1828년 2월 21일, 최초의 Cherokee Phoenix가 New Echota에서 체로키어와 영어로 인쇄된 채로 출판되었습니다.
    story_prose:
      opening:
        - 1821년 미국 남동부의 체로키 국가. 은세공인 세쿼야는 영어를 읽을 수 없지만 체로키를 나타내는 약 80개의 기호로 구성된 음절을 만들었습니다. 각 기호는 한 음절을 나타냅니다. 그는 수년 동안 이 일에 전념해 왔습니다.
        - 역사상 그는 한쪽 다리가 절뚝거리고 걷기가 어려웠습니다. 밭은 그의 아내에게만 남겨졌고 그의 가족은 그에게 그것을 포기하라고 계속해서 간청했고 그의 아내는 한때 그의 서류를 불태웠습니다. 그가 글을 보여주자 사람들은 의심을 품게 되었고, 한 사람은 면전에서 그를 비난했습니다. 이 지점에서 학습자는 한 번에 한 기호씩 단어를 발음하고, 이웃은 자신의 이름을 쓰고 싶어합니다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 차분한 사람, 사람들의 말을 듣는 사람, 강철의 의지를 가진 사람, 황금 사과를 가진 사람 등 의혹이 커지는 날에 일어설 수 있습니다. 약을 아는 사람 또는 진통제를 사용하는 사람; 농사를 지은 의지가 강한 사람, 아니면 친절하고 강인한 사람이 이 가족의 농사일을 반년 동안 맡아줄 것입니다.
      outcomes:
        all: 그해에 글은 체로키 사람들의 마을마다 퍼져 나갔고, 그의 아내도 글을 쓰는 법을 배웠습니다. 1828년 2월 21일, 최초의 Cherokee Phoenix가 New Echota, Cherokee 및 English에서 나란히 열로 인쇄소에서 나왔습니다.
        p3: 그 반년 동안 들판은 낭비되지 않았고 집에서의 다툼도 줄어들었습니다. 나중에 그의 아내도 표지판으로 글을 쓰는 법을 배웠습니다.
        p2: 그 반년 동안 그의 다리 통증은 완화되었고, 그는 가르치기 위해 다음 마을로 가는 길을 더 빨리 걸었습니다. 그가 나아갈수록 배우는 사람이 많아졌습니다.
