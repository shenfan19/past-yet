    relic: 교정쇄 한 장
    relic_desc: 연필로 고친 자리가 남은 교정쇄.
    points:
      p1: 질병으로 인해 교정이 중단될 때마다 Kafka의 자리를 지키고 그가 교정 중인 이야기를 보호하세요.
      p2: 심부름과 서신을 도우미들과 공유하여 키어링에 머무는 사람들이 쉴 시간을 가질 수 있도록 합니다.
      p3: 목의 통증을 완화하여 마지막 몇 주 동안 물과 몇 입의 부드러운 음식을 삼킬 수 있습니다.
      p4: Kafka가 그의 네 편의 이야기를 함께 볼 수 있도록 베를린 출판사에게 사전 사본을 제본하여 키얼링에게 보내도록 하십시오.
    points_fail:
      p1: 교정은 최종 수정 없이 베를린으로 돌아갔습니다. 지점의 동기화가 끊어지고 사무실에서 해당 직원을 소환합니다.
      p2: 같은 사람들이 답장을 기다리는 동안 쉬지 않고 감시하고, 편지에 답하고, 심부름을 하도록 남겨졌습니다.
      p3: 목의 통증으로 인해 여전히 식사를 할 수 없었습니다. 이 분야에서 그는 노트를 통해 말하는 데 마지막 몇 주를 보냈고 거의 삼키지 못했습니다.
      p4: 카프카는 그 책을 본 적이 없습니다. 출판사는 그가 죽은 후에야 그것을 보냅니다.
    shift:
      p1:
        was: 1924년 5월 카프카는 키얼링에 있는 동안에도 『단식 광대』의 교정 작업을 계속했습니다.
      p2:
        was: 1924년 5월, 한 친구가 중병에 걸린 카프카를 돌보고 그의 파트너가 하던 일을 일부 덜어주기 위해 키어링으로 왔습니다.
        now: '{staff}는 도우미에게 교대로 편지를 받고, 페이지를 보내고, 친구를 유지하도록 합니다. 그 중 한 명이 도착하면 감시하는 사람이 밖으로 나갈 수 있습니다.'
      p3:
        was: 1924년 봄, 결핵이 카프카의 후두에 이르렀습니다. 삼키는 것이 너무 고통스러워서 거의 먹거나 잠을 잘 수 없었으며 의사는 통증에 대해 8~10일마다 후두 신경을 주사했습니다. 그는 6월 3일 키어링에서 사망했다.
        now: '{staff}는 의사가 식사 전에 통증 완화 시간을 정하는 데 도움을 주었습니다. 마지막 몇 주 동안 그는 물을 마시고 부드러운 음식을 몇 입 먹을 수 있었으며 역사상보다 고통이 다소 적었습니다.'
      p4:
        was: 카프카는 1924년 6월 3일에 사망했습니다. 『단식 광대』 컬렉션은 그해 8월에 출판되었습니다.
        now: '{staff}는 베를린에게 수정된 시트의 단일 사본을 제본하여 미리 보내도록 요청합니다. 카프카는 키얼링에서 그것을 살펴보고 네 가지 이야기와 그가 선택한 순서를 인식합니다.'
        who: kafka_kierling
        bio: 카프카는 죽기 전에 최종 교정본의 제본된 사본을 보았습니다. 인쇄본에는 그가 승인한 선택과 순서가 그대로 유지되었습니다.
    vignettes:
      lilac: 5월 13일 {staff}는 요양소 정원사가 울타리 옆에 있는 라일락을 자르는 것을 도왔습니다. 정원사는 올해 일주일 늦게 꽃이 피었는데 벌들이 그것을 용서하지 않았다고 말했습니다. 그는 지금 그들이 단지 불평하기 위해 부엌 창문으로 왔다고 맹세합니다.
      post: 5월 23일 {staff}는 요양원의 심부름꾼과 함께 클로스터노이부르크에 있는 우체국으로 걸어갑니다. 소년은 편지를 읽지 않고도 그 편지가 어디서 오는지 알 수 있다고 말합니다. 베를린에서 온 편지는 종이로 뒤덮여 뚱뚱하고 뻣뻣한 반면, 프라하에서 온 편지는 얇고 매일 옵니다.
      rain: 6월 중순, {staff}는 폭우를 피해 마을 빵집 출입구에 대피했습니다. 빵집 주인의 아내는 거리가 개울로 변하는 것을 지켜보며 자신이 방금 계단을 닦은 후에야 키얼링 시냇물이 범람한다고 말했습니다.
  poe_baltimore:
    name: 제4구에서 온 쪽지
    place: 볼티모어
    figure: 에드거 앨런 포
    story: 1849년 9월 27일 에드거 앨런 포(에드거 앨런 포)는 리치먼드를 떠나 뉴욕의 포드햄(Fordham)에 있는 자신의 집으로 갔고 다음날 볼티모어로 도착했습니다. 앞으로 5일 동안 그의 행방은 불확실하다. 선거일인 10월 3일, 그는 Ryan의 4와드 투표소에서 큰 고통에 빠진 채 발견되었고, 인쇄업자인 Joseph Walker는 Joseph Snodgrass에게 쪽지를 보냈습니다. 그는 워싱턴 칼리지 병원(Washington College Hospital)으로 이송되어 방문객의 출입이 금지된 후 10월 7일 새벽이 되기 전에 그곳에서 40세의 나이로 사망했습니다. 원인은 아직 알려지지 않았습니다. 그의 이모와 시어머니 마리아 클렘(Maria Clemm)은 신문을 통해 이 사실을 알게 되었습니다.
    story_prose:
      opening:
        - 볼티모어, 1849년 9월 말. 40세의 작가 에드거 앨런 포(에드거 앨런 포)는 까마귀(The Raven)를 썼고 공포와 탐지에 관한 이야기를 썼습니다. 이번 여름에 그는 잡지를 위한 기금 마련을 위해 리치몬드에서 강의를 했습니다. 9월 27일에 그는 뉴욕의 포드햄에 있는 자신의 집으로 출발했고, 다음날 볼티모어에 도착했습니다. Fordham에서 그를 기다리고 있는 사람은 그의 이모이자 시어머니인 Maria Clemm입니다.
        - 역사상 앞으로 5일 동안 그가 어디에 있었는지에 대한 믿을 만한 기록은 없습니다. 선거일인 10월 3일, 인쇄업자인 조셉 워커(Joseph Walker)는 4와드 투표소에서 그가 큰 고통을 겪고 있는 것을 발견하고 스노드그래스 박사에게 오라고 요청하는 쪽지를 보냈습니다. 그는 워싱턴 칼리지 병원으로 옮겨져 술에 취해 입원한 환자들을 위한 병실에 입원했고, 며칠간 의식을 잃었다가 방문객들로부터 격리됐다가 7일 새벽이 되기 전에 사망했지만 원인은 아직 밝혀지지 않았다. 이틀 후 Maria Clemm은 Fordham의 신문에서 그의 죽음에 대한 기사를 읽고 볼티모어에 편지를 보내 질문했습니다. 이 지점에서는 포터가 부두에서 트렁크를 운반하고, 롬바드 스트리트의 선술집 주인이 배럴을 세고, 야간 포터가 병동을 관리합니다.
        - 몇 가지 종류의 사람들이 이 여행에 도움을 줄 수 있습니다. 확고한 의지로 의학을 아는 사람, 또는 더 확고한 의지로 체계적이고 주의 깊은 사람이 도움을 요청하는 쪽지를 들고 투표소에서 병원까지 안전하게 그를 볼 수 있는 사람; 간호나 돌봄에 대한 훈련을 받은 사람, 택배기사나 기자, 친절하고 참을성 있고 체계적인 사람, 공책과 펜을 가지고 있고 재치가 있는 사람, 마리아 클렘에게 소식을 전할 사람; 빠른 두뇌와 강한 의지를 가진 의사, 의학을 알고 나노 의료 키트를 들고 다니는 사람이 섬망을 극복하는 모습을 지켜볼 것입니다.
      outcomes:
        all: 10월 말 포는 병원을 떠나 북쪽으로 뉴욕에 있는 자신의 집으로 갔다. 포드햄에 있는 작은 집 문 앞에 마리아 클렘은 볼티모어에서 보낸 편지를 손에 들고 서서 길 끝을 지켜보고 있었습니다.
        p3: 10월 말 포는 병원을 떠나 북쪽의 뉴욕에 있는 집으로 갔다. 그는 지팡이에 기대어 병원 계단에 잠시 멈춰 옷깃의 단추를 채웠습니다.
        p2: 10월 7일 새벽이 되기 전에 포는 병원에서 사망했습니다. 마리아 클렘의 대답은 이미 병동에 닿았고, 그 방의 창턱에 놓여 있었습니다.
        p1: 10월 7일 새벽이 되기 전에 포는 워싱턴 대학 병원에서 40세의 나이로 사망했습니다. 다음날 그는 볼티모어에 있는 할아버지의 묘지에 묻혔습니다. 사람이 거의 안 왔는데 몇 분 만에 끝났어요.
