    relic: 一頁校樣
    relic_desc: 一頁印刷校樣，上面有鉛筆改的小字。
    points:
      p1: 病中校稿一中斷就給他留下接續的位置，護住卡夫卡最後校過的故事集
      p2: 把跑腿與通信交接給輪換的幫手，給守在基爾靈的人留出一段歇息時間
      p3: 減輕他喉頭的痛，讓他在最後幾個星期還咽得下水和幾口軟食
      p4: 讓柏林出版人先裝訂一本寄到基爾靈，讓卡夫卡生前看到自己選定的四篇小說合在一起
    points_fail:
      p1: 校樣寄回柏林時缺了作者最後一輪批改，印本失去這次校訂。行程與史實脫節，員工被召回。
      p2: 照料者仍同時守病房、收信和跑腿，連等回信的空當都抽不開身。
      p3: 喉頭的痛照舊讓他吃不下東西，這條分支裡他最後幾個星期仍靠紙條說話，幾乎咽不下一口。
      p4: 作者來不及看到書，出版者在他去世後才把它交給讀者。
    shift:
      p1:
        was: 1924 年 5 月，卡夫卡在基爾靈養病時仍在校訂《饑餓藝術家》的校樣。
      p2:
        was: 1924 年 5 月，有朋友前往基爾靈協助照料已經病重的卡夫卡，分擔伴侶原先承擔的工作。
        now: '{staff}把送印、送信和陪伴所需的人手分時安排，幫手到時，原來守著的人可以出門走一會兒。'
      p3:
        was: 1924 年春，結核侵入卡夫卡的喉頭，吞嚥劇痛，吃不下也睡不好，醫生每隔八到十天給喉上神經注射一次止痛；6 月 3 日他在基爾靈去世。
        now: '{staff}幫醫生把止痛排在飯前，他在最後幾個星期還喝得下水、吃得下幾口軟食，比歷史上少受了些苦。'
      p4:
        was: 1924 年 6 月 3 日卡夫卡去世，同年 8 月《饑餓藝術家》故事集出版。
        now: '{staff}請柏林先把已經改完的印張裝成一本隨郵寄回。卡夫卡在基爾靈翻過它，認得出自己定的四篇和次序。'
        who: kafka_kierling
        bio: 卡夫卡生前看到一冊按最後校樣裝訂的故事集。正式出版時出版社保留了他選定的篇目和次序。
    vignettes:
      lilac: 5 月 13 日，{staff}幫療養院的園丁修剪籬笆邊的丁香，剪下的枝子堆在腳邊，香得發悶。園丁說今年丁香晚開了一個星期，蜜蜂到現在還沒原諒它，天天飛到廚房窗口來抱怨。
      post: 5 月 23 日，{staff}跟療養院跑腿的男孩走下坡去克洛斯特新堡的郵局，路邊的果樹剛落了花。男孩說他不用看就知道信從哪兒來：柏林來的又厚又硬，全是紙；布拉格來的薄，天天都有。
      rain: 六月中旬，{staff}被一場急雨堵在村裡麵包鋪的門洞下，雨點砸在石板上，濺起一層白煙。麵包師的妻子看著街面變成一條河，說基爾靈的小溪只在她剛刷完門口臺階的時候才漫上來。
  poe_baltimore:
    name: 第四選區的一張求助條
    place: 巴爾的摩
    figure: 埃德加·愛倫·坡
    story: 1849 年 9 月 27 日，埃德加·愛倫·坡離開裡士滿，要回紐約福德姆的家，第二天到了巴爾的摩。此後一個星期他在哪裡，沒有可靠的記載。10 月 3 日是選舉日，有人在瑞安那處第四選區投票點發現他處境不妙，印刷工約瑟夫·沃克寫條子請約瑟夫·斯諾德格拉斯來。他被送進華盛頓學院醫院，不許探視，7 日天亮前在那裡去世，四十歲，死因至今不明。他的姨母兼岳母瑪麗亞·克萊姆是從報上讀到的。
    story_prose:
      opening:
        - 1849 年 9 月底，巴爾的摩。四十歲的作家埃德加·愛倫·坡寫過《烏鴉》，也寫恐怖和推理故事。這年夏天他在里士滿講演，為辦雜誌籌錢，9 月 27 日動身回紐約福德姆的家，第二天到了巴爾的摩。福德姆家裡等他的，是姨母兼岳母瑪麗亞·克萊姆。
        - 史實裡，此後五天他的行蹤沒有可靠記載。10 月 3 日是選舉日，印刷工約瑟夫·沃克在第四選區的投票點發現他處境很糟，寫條子請斯諾德格拉斯醫生來；他被送進華盛頓學院醫院收醉漢的病房，一連幾天時醒時昏，不許探視，7 日天亮前去世，死因至今不明。兩天後，瑪麗亞·克萊姆在福德姆從報上讀到死訊，寫信去巴爾的摩打聽。在這條分支裡，碼頭上有個背箱子的腳伕，隆巴德街有個數酒桶的酒館老闆，病區裡有個守夜的雜役。
        - 這一趟用得上幾種人：懂醫護、意志夠硬的人，或者有條理、守得住、意志更硬的人，接住那張求助條，護住他從投票點到醫院的那段路；懂護理、幹過照護、跑過腿或當過記者的人，心善、耐心、有條理的人，或者帶著筆記本和筆、腦子不慢的人，把消息送到瑪麗亞·克萊姆手上；當醫生、腦子快又意志硬的人，或者懂醫護、帶著納米醫療箱的人，守著他熬過譫妄。
      outcomes:
        all: 十月底，坡出了院，往北回紐約的家。福德姆的小屋門口，瑪麗亞·克萊姆手裡攥著那封從巴爾的摩寄來的信，朝路口望著。
        p3: 十月底，坡出了院，往北回紐約的家。他拄著手杖，在醫院門口的臺階上停了一下，把領口扣好。
        p2: 10 月 7 日天亮前，坡在醫院裡去世。瑪麗亞·克萊姆的回信已經送到了病區，擱在那間屋子的窗臺上。
        p1: 10 月 7 日天亮前，坡在華盛頓學院醫院去世，四十歲。第二天他葬在巴爾的摩他祖父的那塊地裡，來送的人很少，幾分鐘就完了。
      none: 10 月 7 日天亮前，坡在華盛頓學院醫院去世，死因至今不明。兩天後，瑪麗亞·克萊姆在福德姆讀到報上的消息，提筆給巴爾的摩寫信，請人什麼都不要瞞她。
      desync: 10 月 3 日，那張求助條在投票點樓下的人群裡傳了幾手，不知落進了誰的口袋。{staff}被召回時，樓梯口那張長凳上還靠著一個人，帽子蓋住了半張臉。
