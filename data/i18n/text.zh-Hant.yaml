      differences: 幫手指著兩隻相似的鳥，準備合寫一條。你問它們各來自哪座島。他把兩個標籤都留在冊上，下次好重新比較。
      drawer: 幫手能把地名念回給你以前，你一直把籤放在盤旁。抽屜關上時，紙籤仍在對應的標本旁。
  finlay_havana:
    name: 蚊子與黃熱病
    place: 哈瓦那
    figure: 卡洛斯·芬萊
    story: 卡洛斯·芬萊 1881 年在哈瓦那提出黃熱病蚊媒傳播的假說，論文題目也表明其假說性質。
    story_prose:
      opening:
        - 哈瓦那暑熱未退，芬萊將要宣讀的稿子放在課桌邊，病例筆記另壓在一封信下。有人來問文章首行怎麼寫，預備把它放進議程。芬萊把題目裡的「假說」讀得很清楚。
        - 1881 年 8 月 14 日，芬萊在哈瓦那科學院宣讀黃熱病的蚊媒傳播假說。廣泛採取防蚊行動還在多年以後。這條分支可以先保住宣讀，再請留下的院士聽明白已有記錄支持到哪一步。
        - 擅長核對稿件的人護住議程上的一份。善於組織討論的人，問院士願不願約時間審閱材料，再把公共防蚊的議案交給市裡。
      points:
        p1: 書記說還有一頁沒人看過，不能跟著其餘稿子一起送上臺。你拿出芬萊核過的目錄，把兩個紙包按標記分開，才發現那頁夾在病例記錄的封裡。芬萊把該宣讀的一份重新合上。輪到他起身時，書記念出的題目和他手裡的相同。
        p2: 讀畢，最靠門的人已經拿了帽子。你請他聽完芬萊一句話，看看哪條記錄願意留下核查。對方坐下來，只問了一處，另一位院士把下一次可來看材料的日期寫到空頁邊。芬萊從桌上把要討論的那疊抽了出來，等兩人都看見才合好。
        p3: 給市裡看的紙上原來有一句「已經證實」。你請芬萊把已有觀察和下一步要核查的事分成兩項，讓議事的人知道該答覆哪一條。他們同意提前撥給公共防蚊一筆試行經費。書記蓋章前，留下原來的「假說」兩個字。
      outcomes:
        all: 芬萊讀完論文，病例有人回看。市裡的公共防蚊工作在這條分支提前開始，仍要看實際成效。
        p1: 科學院聽到了這篇論文，宣讀稿留在檔裡。之後是否跟進仍要等院士決定。
        p2: 有幾個人留下問了記錄，查閱日期也寫好了。市裡還沒有開始行動。
        p3: 公共防蚊的試行議案有了回執。報告只將提早行動寫在這條分支。
      none: 會場散了，下一次討論的日子還是空著。
      not_admitted: 門口只讓已經排上議程的人進去。你從外間聽到書記報出第一項。
      desync: 宣讀稿沒有備齊，八月十四日那次會議聽不到芬萊的論文。事務所召回員工。
      excerpts:
        p1: 輪到他起身時，書記念出的題目和他手裡的相同。
        p2: 芬萊從桌上把要討論的那疊抽了出來，等兩人都看見才合好。
        p3: 書記蓋章前，留下原來的「假說」兩個字。
    relic: 一片蚊子的玻片標本
    relic_desc: 一片標本，裡面有一隻蚊子的翅。
    points:
      p1: 黃熱病季裡護住他的論文稿和病例筆記，讓他 8 月 14 日照期在科學院宣讀
      p2: 宣讀之後，勸幾位院士留下來看他的病例，不讓論文在一片沉默裡被擱下
      p3: 幫他把蚊子和病例整理成能讓人信服的證據，讓這座城早些年開始防蚊
    points_fail:
      p1: 病例筆記在黃熱病季裡散失，8 月 14 日沒有宣讀，這條分支與歷史脫了節，員工被送回。
      p2: 會場照舊一片沉默，沒有人要看一份病例，這條分支裡論文照舊被擱在一邊。
      p3: 他的證據照舊單薄，這條分支裡這座城照舊又等了二十年才對蚊子動手，在那之前黃熱病每年夏天照舊回來。
    shift:
      p1:
        was: 1881 年 8 月 14 日，卡洛斯·芬萊在哈瓦那皇家科學院宣讀《作為黃熱病傳播媒介的蚊子假說》。
      p2:
        was: 1881 年 8 月 14 日的宣讀之後，會場一片沉默，這個說法此後多年被人嘲笑。
        now: 那天散會後，有幾位院士留了下來，要看他的病例筆記。
      p3:
        was: 1881 年以後，芬萊用了將近二十年去證明蚊子傳播黃熱病，直到 1900 年美國陸軍黃熱病委員會用他培育的蚊子做實驗，才證實他是對的。
        now: '{staff}幫他把蚊子和病例一一對上，直到證據站得住。這條時間線裡哈瓦那早了些年開始防蚊，黃熱病也早些離開了這座城，芬萊在自己的年代就被人相信了。'
        who: finlay_havana
        bio: IF 線裡，芬萊的蚊媒說法在 1881 年後幾年內就被接受，哈瓦那遠在 1900 年以前就照著它防蚊。
    vignettes:
      headline: 虛構的編輯把一個推測寫成了確定的事。你慢慢念回原題，他在校樣交出去前把「假說」兩字補回去。
      columns: 編輯把筆記裡每一行都照同一種意思念。你劃成所見和所推兩欄，有一句移到了另一邊。
      place: 你核對宣讀論文的地點。編輯把地名記在日期旁，後來的報道才不會把會議說成另一場。
  humboldt_chimborazo:
    name: 雪線以上的那道深溝
    place: 厄瓜多爾欽博拉索山
    figure: 亞歷山大·馮·洪堡
    story: 1802 年 6 月 23 日，洪堡與埃梅·邦普蘭、卡洛斯·蒙圖法爾攀登欽博拉索山。挑夫不肯再往上走，三人流著鼻血、嘔吐、頭暈，繼續向上，直到山頂以下一道深溝擋住去路，只得折返。
    story_prose:
      opening:
        - 欽博拉索山的雪線上，邦普蘭把氣壓計交給洪堡，騰出手來扶自己的包。蒙圖法爾停在一塊能看見前方的石上。他指的深溝，在雲挪開以前看不到邊。
        - 1802 年 6 月 23 日，洪堡等人攀登欽博拉索，因深溝折返。這裡的分支讓一行人找到可以續行的路，從山頂下來才能帶回結果。
        - 找能在高處照應同伴的員工。用事務所道具相助時，仍讓每個人自己說願不願繼續。
      points:
        p1: 前面有人踩到雪邊就停了，下來告訴洪堡那裡沒有穩的落腳處。你讓一行人先在能站穩的地方歇下，等另一組把可走的地形看明白，再商量要不要繼續。洪堡和邦普蘭交換著提儀器，回來時蒙圖法爾走在能看見兩人的地方。下到原先歇腳的石邊，他們才取出在頂上寫的那半頁記錄。
      outcomes:
        all: 這一趟確實到了頂，也全員回到原先的歇腳處。報告在山頂記錄旁另記了下來的時刻。
        p1: 他們沿本趟找到的路上去，也照原先約好的次序回到山下。
      none: 看到深溝，一行人折返。回到有同伴等著的地方，紙上只有他們實際到過的高度和所見。
      not_admitted: 隊伍出發時沒留下帶你同行的位置。你在下面接到一隻空的儀器套。
      excerpts:
        p1: 下到原先歇腳的石邊，他們才取出在頂上寫的那半頁記錄。
    relic: 一支氣壓計
    relic_desc: 一支裝著水銀的氣壓計，玻璃管上刻著高度。
    points:
      p1: 6 月 23 日那道深溝擋住去路之前，幫一行人頂住高山病，找到越過去的路，登上欽博拉索山頂再平安下來
    points_fail:
      p1: 他們照史實在那道深溝前折返，沒有登頂。
    shift:
      p1:
        was: 1802 年 6 月 23 日，洪堡、邦普蘭和卡洛斯·蒙圖法爾攀登欽博拉索山，一路流鼻血、嘔吐、頭暈，在山頂以下被一道深溝擋住，只得折返。
        now: 他們越過那道深溝，站上了欽博拉索山頂，又平安回到營地。
        who: humboldt_chimborazo
        bio: 這條時間線裡，洪堡 1802 年 6 月 23 日與邦普蘭、蒙圖法爾一同登上欽博拉索山頂，平安下山。
    vignettes:
      turn: 虛構讀者把線路一路畫上山頂。你問日記寫到哪裡就停止往上走了。他把最後一記往山坡下移，沒再碰山頂。
      units: 讀者要只抄一個高度，把單位省掉。你請他把原單位和測數放在一起，另留一行給今天的換算。
      names: 你請讀者在洪堡旁留出地方，記下另外幾名同行者。折起紙以後，名單仍跟著當天攀登的記錄。
  ibn_khaldun_cairo:
    name: 亞歷山大港的那條船
    place: 開羅
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦 1382 年應蘇丹巴爾庫克之邀來到開羅。1384 年，蘇丹請突尼斯的君主放他的家人來埃及，8 月 8 日又任命他為馬立克派首席法官。從西邊來的外人坐上這個高位，城裡的對手很快就開始設法把他拉下來。同年，載著他妻女的船在亞歷山大港沉沒。他在《歷史緒論》中提出，史家要用所寫社會中可能發生的事情檢驗傳聞。
    story_prose:
      opening:
        - 開羅的書記把一張任命稿和一份要複核的名字放在同一案上。伊本·赫勒敦問哪個人在外面等。他還在等另一封信，想知道妻女從突尼斯來埃及的船到哪兒了。
        - 1384 年，伊本·赫勒敦在開羅獲任首席法官。後來載他妻女的船在亞歷山大港遇難。這趟可以保住任命經過，之後到港幫船上的人獲救。
        - 讓擅長與書記辦交接的人候在開羅。能同水手配合或在港口照應落水者的人，再儘早去亞歷山大。
      points:
        p1: 書記說要重抄名字，等另一位經辦人來才知道寫誰。你請他先把已經收到的任命和來人的說法逐條核一遍。核到日期一行時，負責交文書的人唸了伊本·赫勒敦的全名。書記把原來擱在案邊的任命放回當天要發出的那摞。
        p2: 港邊有人喊看見了人，又在浪蓋過來時丟了位置。你請岸邊的人繼續指向同一處，讓出位置給已經出船幫忙的水手。等伊本·赫勒敦的妻女被接到岸邊，守在屋口的人才問先送哪邊的消息。給開羅寫信的人等到她們親自答話，才落了筆。
      outcomes:
        all: 伊本·赫勒敦按史實就任。來自港口的急信寫的是家人已被接上岸，這一趟的開羅學者會等到另一份消息。
        p1: 任命照原日發出。船仍在亞歷山大遇難，他的家人沒能來到開羅。
        p2: 妻女在港邊有人照料，能把消息帶給開羅。任命脫節，回程記錄只留下這段救助。
      none: 開羅的人等文書，港上的人等風停。那封報平安的信沒有寫出來。
      not_admitted: 等在外頭的人沒獲准遞交任命稿，船訊也還沒有傳進這間屋。
      desync: 本該發給伊本·赫勒敦的任命改了收件人。任命失去同步，事務所召回員工。
      excerpts:
        p1: 書記把原來擱在案邊的任命放回當天要發出的那摞。
        p2: 給開羅寫信的人等到她們親自答話，才落了筆。
    relic: 一頁核對過的記錄
    relic_desc: 一頁隊伍經過的記錄，頁邊寫著看的人當時站在哪裡。
    points:
      p1: 對手要把外來的人擋在法官席外時，護住他 8 月 8 日出任馬立克派首席法官
      p2: 載著他妻女的船在亞歷山大港沉沒時，把船上的人從水裡拉上來，救下她們
    points_fail:
      p1: 這條分支裡，8 月 8 日的任命落到了別人頭上，與歷史脫了節，事務所當天召回員工。
      p2: 那條船照史實在亞歷山大港沉沒，船上的人無一生還，他的妻女沒能到開羅。
    shift:
      p1:
        was: 1384 年 8 月 8 日，蘇丹巴爾庫克任命伊本·赫勒敦為開羅馬立克派首席法官；城裡的對手處處與他為難，第二年他就丟了這個職位。
      p2:
        was: 1384 年，載著伊本·赫勒敦妻女從突尼斯來埃及的船在亞歷山大港沉沒，船上的人無一生還。
        now: 船上的人在亞歷山大港被救了上來。他的妻女隨後到了開羅，一家人又住在了一起。
        who: ibn_khaldun_cairo
        bio: 這條時間線裡，1384 年在亞歷山大港沉沒的那條船沒有帶走他的家人，妻女獲救，到開羅與他團聚。
    vignettes:
      gate: '{staff}問一位編出來的書吏，人群過城門時門開了多久。書吏把時辰寫在總數旁的頁邊，又把總數改成了估算。'
      two: 另一位編出來的見證人站在街對面。{staff}給她另騰一頁紙，她說的那段街景就不必擠在書吏那張紙的邊上了。
      copy: '{staff}替法庭裡一個學生抄了一頁《歷史緒論》，行與行之間留出一指寬，給學生以後寫批註。'
  lili_boulanger_paris:
    name: 桌上攤著幾份聲部譜
    place: 梅齊
    figure: 莉莉·布朗熱
    story: 1918 年冬，莉莉·布朗熱在塞納河畔梅齊病得很重。關於她最後一部作品的記述寫到，她把《Pie Jesu》口述給姐姐娜迪亞。樂譜寫給人聲、絃樂四重奏、豎琴和管風琴。3 月 15 日，莉莉去世，終年二十四歲。
    story_prose:
      opening:
        - 譜桌上的紙分成已謄好和還等著口述的兩份。娜迪亞剛寫下一個音，莉莉請她先把筆放一放。隔著幾張薄紙，已經寫下的最後一小節還有些看不清。
        - 莉莉·布朗熱病中口述了她生命最後階段的樂曲《Pie Jesu》，由姐姐娜迪亞記譜。她在 1918 年 3 月 15 日去世。這裡能做的是按她自己的節奏暫停，等她要繼續時把最後記下的地方還給她。
        - 會讀譜的員工可以陪娜迪亞記位置。等莉莉說想繼續時，才念出上一段。
      points:
        p1: 娜迪亞要順手翻過去，莉莉說先別。你拿一根窄紙條標在剛才那一節，給兩個人都能看見的位置。屋裡歇了一會兒，等莉莉先開口，你才把娜迪亞記下的幾拍數給她聽。莉莉改了一個音，娜迪亞就在原來的那一行接著寫。
      outcomes:
        all: 莉莉自己定了何時繼續。桌上留下口述過的樂句，三月十五日的死訊仍進了後來的記錄。
        p1: 等她準備好，娜迪亞從標出的地方繼續記譜。這一回，她不用重說暫停前的整段。
      none: 停了一會兒再看譜時，姐妹要從上面幾行找起。莉莉又將剛才說過的一段分開說完。
      not_admitted: 娜迪亞請來客把腳步放輕，在外面等。休息前最後那一段仍只有姐妹倆聽到。
      excerpts:
        p1: 莉莉改了一個音，娜迪亞就在原來的那一行接著寫。
    relic: 一條夾譜的窄紙
    relic_desc: 虛構夾條，記口述暫時停在第幾小節。
    points:
      p1: 莉莉想歇一會兒時替娜迪亞標好譜上的位置，再按莉莉的意思念回剛記下的一段
    points_fail:
      p1: 停下來以後，姐妹倆要重新找口述的位置。莉莉今天剩下的力氣，有一部分得花在重複已經說過的地方。
    shift:
      p1:
        was: 關於《Pie Jesu》的記述寫到，莉莉病重時由姐姐娜迪亞幫她記譜。
        now: 這條分支裡，莉莉停下時，{staff}替姐妹倆留好了記號。等莉莉覺得能繼續了，娜迪亞念回最後一段，莉莉從自己挑的停頓處接著說。
    vignettes:
      entry: '{staff}請娜迪亞翻頁前指一下剛記的音。她用手指壓著那一行，再核上面的聲部。'
      visitor: 門口有人問還剩多少譜。莉莉決定是否休息時，{staff}請來人把話先留在外面。
      stand: '{staff}在譜架上騰出一塊地方，讓娜迪亞擱筆時不用壓住譜紙。'
  jianzhen_nara:
    name: 回揚州的長路
    place: 嶺南
    figure: 鑑真
    story: 鑑真第五次嘗試前往日本，船卻被風吹到海南。北返途中，曾來揚州請他東渡的日僧榮叡在端州病逝。鑑真在路上失明，兩部早期文獻對經過的記述不同。
    story_prose:
      opening:
        - 端州，同行人把剛抄好的路引擱在門邊。榮叡的屋裡有人坐著，幾次讓外面傳話的人等。鑑真來問，能不能讓他先進去坐一會兒。
        - 《唐大和上東征傳》記鑑真一行過端州時，榮叡在那裡去世。其後鑑真視力減退，一行繼續返回揚州。分支借這段行程寫兩件小事，先給兩人留一段說話的時間，之後讓鑑真聽得到行程。
        - 懂照護的人可以先去問榮叡所願。會讀路引或能聽清多方說法的人，再把後面的去向一處處念給鑑真。
      points:
        p1: 等外面來問行期的人走開，你先問榮叡願不願讓鑑真進來。他點頭，要端來一把不擋門的凳子。你與旁人說定這段工夫先不傳話，轉到院子裡等。門裡傳來兩個人說話的聲音，聲音輕了也沒人催他們。
        p2: 路引疊了幾層，同行人正想直接告訴鑑真已經定好的走法。你先把還沒確定的幾個地方念出聲，讓他聽見哪裡需要留一宿。鑑真問其中一處的名字，又聽了一遍，才說自己想先走哪一段。有人把他的決定寫到原先只留著地名的那張紙上。
      outcomes:
        all: 榮叡和鑑真有過一段說話的工夫，榮叡仍在端州去世。往後鑑真看不清字時，一行人照著他聽過的路線走。
        p1: 兩人保住那一場會面。榮叡仍去世；後來路引上的字，鑑真還要別人慢慢轉告。
        p2: 鑑真聽過下一程，自己說了想走的路。榮叡身邊那段沒說完的話沒有補回來。
      none: 路引重新捆成一束。屋裡要傳的話和屋外要走的路，都還等旁人來說明。
      not_admitted: 你沒能進榮叡借住的屋子。另一份路引隨同行人收回，沒從門邊念出聲。
      excerpts:
        p1: 門裡傳來兩個人說話的聲音，聲音輕了也沒人催他們。
        p2: 有人把他的決定寫到原先只留著地名的那張紙上。
    relic: 一頁行程紙
    relic_desc: 虛構路記，記一行人北上的去向。
    points:
      p1: 在端州問榮叡想怎樣被照料，再替他和鑑真留一段能說話的時間
      p2: 鑑真看不清時，把一行人的行程念出聲，請他自己決定接下來怎麼走
    points_fail:
      p1: 總有別的事要辦，守在榻邊的人一再被叫走。兩人還能說話的那段時間，就這樣過去了。
      p2: 同行的人又把路引捆回了一束。鑑真看不清紙上的字，只能等別人告訴他。
    shift:
      p1:
        was: 第五次渡海失敗後的北返途中，榮叡在端州病逝。
        now: 這條分支裡，{staff}在端州守著榮叡，把鑑真請到榻邊。兩人得空單獨說了一會兒話。
      p2:
        was: 早期文獻記載鑑真在這趟歸途中失明，後來仍東渡日本。
        now: 這條分支裡，{staff}把接下來幾個落腳處念給鑑真聽。鑑真請同行改了一站，也說明自己想什麼時候再出發。
    vignettes:
      sound: 同行人指著紙上的下一站。鑑真在聽，{staff}請對方把地名念兩次。
      tie: 一行人要把路引捆起來。{staff}撐開紙束，待有人核對完去處的先後。
      temple: '{staff}到院裡回答來人的問題，屋裡的兩人不用提高聲音就能把話講完。'
  sei_shonagon_kyoto:
    name: 皇后臨產的那個冬天
    place: 京都
    figure: 清少納言
    story: 清少納言侍奉藤原定子，也在《枕草子》中寫過定子身邊的人和事。長保二年歲末，定子生下女兒媄子內親王，不久去世。
    story_prose:
      opening:
        - 京都入冬以後，屏風邊多放了一個坐墊。清少納言問要留給誰，屋外恰好有人送話進來。定子回望那一處空位，送話人還沒有走。
        - 一條天皇時的定子在 1000 年末臨產，按換算日期於 1001 年 1 月 13 日去世。後來的清少納言在《枕草子》寫了宮中的往事。這裡可以先問定子願意誰陪著，給她自己選的人騰出位置。
        - 讓善於聽人說完的員工與清少納言一起去問。收到外面的消息時，分一人答覆，免得屋裡又要全停下來。
      points:
        p1: 清少納言拿起坐墊要往常用的位置放。你候送話人讀完，再請她問定子願意留誰。定子說了一個名字，又說那人來了就坐在燈後一點。清少納言照她指的地方放下坐墊。等屋裡安靜下來，那位被點名的人已經坐定，定子的手仍放在自己想放的地方。
      outcomes:
        all: 她要見的人留在近處。她後來仍去世，回程記錄留下的是她自己選人陪伴的這一刻。
        p1: 清少納言替定子把那隻坐墊留到來人坐下。後來的日子仍按史實記載。
      none: 門口的消息一條接一條。坐墊最後給了最先被請進來的人，來不及問定子想見誰。
      not_admitted: 外面的人沒有傳你進去。屋裡有人把椅墊換了地方，你在屏風外看不清留給了誰。
      excerpts:
        p1: 等屋裡安靜下來，那位被點名的人已經坐定，定子的手仍放在自己想放的地方。
    relic: 一張折起來的傳話紙
    relic_desc: 虛構便箋，寫著誰可以進屋。
    points:
      p1: 臨產前問定子想讓誰留在近處，幫清少納言把位置留給她想見的人
    points_fail:
      p1: 門外又有人來傳話。屋裡還沒來得及問定子願意讓誰留下。
    shift:
      p1:
        was: 宮廷紀事記載媄子內親王出生，定子隨後去世。
        now: 這條分支裡，{staff}請其他來人先在門邊等，屋裡留誰由定子自己說。清少納言聽完她的話，還來得及把下一條消息帶出去。
    vignettes:
      compare: '{staff}請傳話人摺紙前把一個名字念清。清少納言轉述時不必再問。'
      colour: 清少納言移開燈，看看燈後能否坐下。{staff}把多出的坐墊移到定子指的地方。
      listen: '{staff}等門口的消息答完，才問屋裡還有什麼需要。'
  ibn_rushd_lucena:
    name: 焚書令之前
    place: 科爾多瓦
    figure: 伊本·魯世德
    story: 約 1195 年，伊本·魯世德在穆瓦希德王朝失勢，被放逐到盧塞納。文獻還記載了禁書與焚書。他為亞里士多德《物理學》寫的長篇註釋沒有留下阿拉伯文原本，希伯來文和拉丁文譯本仍存。
    story_prose:
      opening:
        - 科爾多瓦桌上有兩封還沒送出的口信，靠門的一封寫著盧塞納。讀者問伊本·魯世德還願不願回話，又把準備抄的《物理學》長注拉近一點，好讓抄寫人看見有一處仍缺詞。
        - 伊本·魯世德約在 1195 年被放逐到盧塞納。傳記留下有關書籍受限的記述；《物理學》長注的阿拉伯文傳本殘缺。這裡可以讓散在兩地的人恢復聯繫，還可以為一節長注留出抄過的副本。
        - 會辦通信的員工先核去向和回信的收件人。能讀阿拉伯文或校注的人，替讀者對清原句與註解。
      points:
        p1: 讀者寫了好幾行，臨發只求你說一句還想接著讀。你到盧塞納把這句讀給伊本·魯世德，告訴他回信可以交給哪家。伊本·魯世德問對方讀到了第幾節，再另取紙寫回話。他遞來兩折已經合好的紙，請你交給真正還在讀的那個人。
        p2: 抄寫人的筆已經越過一處空。他說前後能接上，可讀過底本的人認得是哪一句被漏了。你請他先把那一句和長注分開按行寫，再照著復讀。副本交給讀者時，他把手壓在原句和解釋的分界處，對你說兩段他自己也能找。
      outcomes:
        all: 盧塞納和科爾多瓦之間多了一封回話。一節長注另有可查的阿拉伯文副本，其他卷頁的損失仍留在史實欄。
        p1: 伊本·魯世德知道還有人在讀。去盧塞納的信回到原處，長注副本還沒抄完。
        p2: 讀者帶走校過的抄頁。他要寄去盧塞納的話仍未送出。
      none: 一封信和一張半抄的頁都在原處。讀者要等下一次來的人。
      not_admitted: 門邊暫不收陌生人代送的信。你沒能讓讀者托的那句話傳進去。
      excerpts:
        p1: 他遞來兩折已經合好的紙，請你交給真正還在讀的那個人。
        p2: 副本交給讀者時，他把手壓在原句和解釋的分界處，對你說兩段他自己也能找。
    relic: 一頁讀書練習摘錄
    relic_desc: 摘錄，為前提另留一處。
    points:
      p1: 從科爾多瓦給盧塞納的伊本·魯世德捎個口信，告訴他還有讀者想跟他通信，也願意收他的回信
      p2: 焚書令下來前，把《物理學》阿拉伯文長注的一節抄校清楚，另留一份給讀者
    points_fail:
      p1: 讀者寫好的便條還在科爾多瓦，只能等下一次有人捎過去。
      p2: 副本還沒抄完。離開時，讀者沒有可以帶走的阿拉伯文抄頁。
    shift:
      p1:
        was: 伊本·魯世德失勢後被放逐到盧塞納，後來獲准回朝。
        now: 這條分支裡，一張讀者寫的便條到了盧塞納。伊本·魯世德可以趁還有人捎信時寫封回信。
      p2:
        was: 伊本·魯世德的《物理學》長篇註釋失去了阿拉伯文原本，保存下來的是中世紀譯本。
        now: 這條分支裡，有一節對過的副本在禁書後仍留在讀者手裡。他再遇到別的抄本，還有阿拉伯文可以對照。
    vignettes:
      premise: 瑪麗婭姆把結論抄得很工整。優素福要讀通，卻得先替她猜一個沒寫出來的前提。你問他讀到哪兒卡住，在結論前留出地方。瑪麗婭姆把前提寫進去，優素福終於能就它發問。
      together: 優素福想把書還了，只給自己留一句。你給他留點時間，把旁邊那一步也抄走。到了門口，瑪麗婭姆請他複述結論，他如今也說得出理由。
      language: 你認得一個後來會在譯本里出現的術語。瑪麗婭姆只想核對前提有沒有照原樣抄下。你幫她把紙鋪平，陪她查。她在邊上寫的問題，會交給這趟見不到的人。
  maya_codices_mani:
    name: 記住書頁怎樣折
    place: 馬尼
    figure: 瑪雅書吏
    story: 1562 年 7 月 12 日，殖民當局在馬尼公開焚燒瑪雅書籍和其他器物。瑪雅社群繼續創造和傳承知識。西班牙征服之前製作的摺頁書，今天只存下少數幾部。
    story_prose:
      opening:
        - 尤卡坦的馬尼。守書人把一本摺頁書橫放在席上，翻到小孩曾跟著讀的一頁。鄰村來客說自己今天要回去，出門前問她願不願把一本交到他手裡。
        - 1562 年 7 月，馬尼發生了有記錄的焚書。倖存的瑪雅抄本保留文字和圖像，不能確定某個現存抄本就在這裡。這個分支寫一位虛構的守書人替自己手裡的一本書選保管人。
        - 找願意聽守書人介紹書頁的人。她若同意交託，就按她說的折法把書合起來，再當面問接書人要怎樣讓後來的人看得到。
      points:
        p1: 守書人打開第二折，指著一處過去看錯過的頁邊。你請接書人照她翻的方向讀一次，讓她確認兩個人能在同一處停下。她把這一冊從其他書旁抽出來，用舊布裹好，親手遞過席子。接書人接穩後仍坐在那裡，等她把最後一折的記號說明。
      outcomes:
        all: 有一冊到了守書人選定的地方。馬尼的焚書仍發生，這份虛構分支只存下她親自交出的那一本。
        p1: 接書人走時把包布抱在身前。等書再打開，照她講過的法子能找回第二折。
      none: 熟識的讀者空手離開。守書人把書攤開又收起，仍須決定先放在哪裡。
      not_admitted: 守書人沒同意讓來客碰頁。你從門邊看到她把書轉回來，繼續和鄰村來的人說話。
      excerpts:
        p1: 接書人接穩後仍坐在那裡，等她把最後一折的記號說明。
    relic: 一張空白練習摺頁
    relic_desc: 守書人自願交給員工的練習摺頁。
    points:
      p1: 問守書人願把哪一本交給鄰村熟識的讀者，幫她親手交託
    points_fail:
      p1: 她選的讀者走時沒能帶上書。接下來把書放在哪裡，還得由守書人自己決定。
    shift:
      p1:
        was: 1562 年 7 月 12 日，馬尼當眾燒燬了大批瑪雅摺頁書。征服以前的瑪雅書，存世的只有寥寥幾部。
        now: 這條分支裡，守書人替其中一本書選好了接手的人。書送到了下一位讀者手裡，焚書過後，還留在瑪雅人手中。
        who: maya_codices_mani
        bio: 這條分支裡，1562 年公開焚書前，馬尼的一冊書由守書人親自交給了自己選定的讀者。
    vignettes:
      fold: 守書人把兩張空摺頁放在凳上，問鄰居記得那本書從哪一折先打開。你扶住紙，讓他們比對。他說不準第二折在哪裡。她把第一折收好，第二折不合上，等下次兩人再談。
      listen: 鄰居說起守書人記不清的那段，兩人記得的次序卻不一樣。你聽他們各自講完。他們同意第一折，第二折先不定。守書人請你把兩種說法都在的那份留給她。
      survive: 你在後世館藏裡看過一部存世瑪雅抄本。守書人問，你能不能說出鄰居記的是哪一本。你能說出藏在哪兒，卻對不上這一屋人記得的頁。她給你一張空白練習摺頁帶走。那本書留在了他們的講述裡。
  zeami_sado:
    name: 紙上的金島
    place: 佐渡島
    figure: 世阿彌
    story: 1432 年，世阿彌的兒子元雅去世。世阿彌在《卻來華》中寫到這場失去，1434 年被流放佐渡。《金島書》記著他渡海和在島上的經歷，定稿記年為 1436 年。
    story_prose:
      opening:
        - 佐渡島上，一位念詞人拿來一張能折進口袋的紙。世阿彌已經聽見他在門口練過兩遍，每回都在不一樣的地方歇氣。他坐著問，這次想從哪一句開始。
        - 世阿彌晚年被流放到佐渡，《金島書》留下在島上的見聞。這個分支只設一次由他選聽、選停頓的小排演，後來留存的著作仍按史實成稿。
        - 讓聽得清節奏或擅長讀詞的員工問世阿彌是否願聽。先念一遍，再把他自己點的停頓記在獨立紙條上。
      points:
        p1: 念詞人第一遍在詞尾換氣。世阿彌請他從同一處再念，到了句中抬一下手。你看著他的手示意哪裡停，等唸完才把停法記在紙條邊上。第三遍，念詞人沒去看紙，在世阿彌抬手前就自己停在那個字上。
      outcomes:
        all: 紙條留下了他聽後點出的停頓。世阿彌把它夾回原先的頁旁，之後還會寫他自己在島上的見聞。
        p1: 世阿彌親自挑出停頓，念詞人說下次帶同一頁來。
      none: 念詞人沒等到能走進來的時候。那一折紙上還沒有標停頓。
      not_admitted: 來客還沒得到允許誦讀。念詞人收好紙，從門外退了回去。
      excerpts:
        p1: 第三遍，念詞人沒去看紙，在世阿彌抬手前就自己停在那個字上。
    relic: 一張能面
    relic_desc: 一張小小的木面，眉間有細細的漆痕。
    points:
      p1: 問佐渡島上的世阿彌願不願聽人讀一行，聽完以後，把他選的停頓另記在紙條上
    points_fail:
      p1: 念詞人還沒來得及讓世阿彌聽見這一行，就得先回去了。停在哪兒，紙上還沒記。
    shift:
      p1:
        was: 世阿彌留下了緬懷元雅的文字，也留下了記佐渡流放的《金島書》。
        now: 這條分支裡，世阿彌聽過同一行的兩種念法，親自挑了停頓的位置，把紙條留在自己那頁旁邊。
    vignettes:
      later: 你告訴虛構的念詞人，後來寫佐渡的書還會提到這個名字。他先像念地名一樣試一遍，再念得像一個人對著遠處想什麼。你記下兩個停頓。載世阿彌來島的船，你已經趕不上了。
      mask: 念詞人舉起練習用的面具，放下時找不到唸到哪兒。你拿一張散紙標出那行的起頭，立在他伸手就能找見的位置。面具掛回鉤上，下一輪念詞你沒能留下聽。
      wind: 風把念詞紙吹散。你從長凳底下拾回一張，用小石子壓住。念詞人把那一行又唸了一遍。你走時紙還壓在石頭下，記下來的只有那一處停頓。
  mozart_requiem_vienna:
    name: 留下能認出的筆跡
    place: 維也納
    figure: 沃爾夫岡·阿馬德烏斯·莫扎特
    story: 莫扎特1791年12月在維也納去世時，《安魂曲》尚未完成。奧地利國家圖書館保有工作稿和含弗朗茨·克薩韋爾·蘇斯邁爾補寫的交付譜。
    story_prose:
      opening:
        - 維也納，送譜的人伸手去拿桌上最整齊的那摞。莫扎特從床邊問，第一段的器樂頁還在不在。康斯坦策讓來人先等一等，另幾張是沒來得及收起的草稿。
        - 莫扎特在 1791 年最後幾週病重，12 月 5 日去世。《安魂曲》當時尚未完成，開篇已有完整配器。分支裡可以先保住那一疊已寫成的開篇，也可以帶事務所的虛構醫療箱去幫忙照護。
        - 認得樂器譜和草稿筆跡的人幫康斯坦策把紙分開。另需會照護病人且有醫療箱的員工，先問病人和家人的意願。
      points:
        p1: 跑腿的人把兩張紙掀開，指給你看上面都有同樣的聲部名字。你和康斯坦策請他再找完整配器的那一疊，逐頁核到開篇結尾，草頁標明後另放。紙包遞到門邊時，他裡面外面都看一遍，知道哪一包可以先交給抄譜人。
        p2: 有人把鮮紙端到床邊，問今天還抄不抄。你向莫扎特和家人說明帶來的事務所醫療箱，然後讓等著抄譜的人先回外屋。後來他醒了，燒已經退下去。他請家人把桌挪近一點，只翻開原來停住的那一頁。
      outcomes:
        all: 開篇的分譜能重新取用，莫扎特也能回到桌前。你離開時，後面還空著，沒有人知道他會怎樣寫完。
        p1: 第一段仍是一件完整的紙包。12 月 5 日莫扎特去世，後面的曲譜留給別人補寫。
        p2: 莫扎特從病中恢復，但開篇的原譜已經拆散。本趟保留他醒來想翻譜的經過。
      none: 床邊攤著還沒抄完的樂句。莫扎特在 12 月 5 日去世，幾摞紙仍等人來分辨。
      not_admitted: 來人和康斯坦策沒有約過時間。抄譜人停在屋外，沒能看到那一疊紙寫了什麼。
      desync: 開篇的完整分譜混進散頁，原有譜件的交接沒法對上，事務所召回員工。
      excerpts:
        p1: 紙包遞到門邊時，他裡面外面都看一遍，知道哪一包可以先交給抄譜人。
        p2: 他請家人把桌挪近一點，只翻開原來停住的那一頁。
    relic: 一頁留白的練習譜
    relic_desc: 抄譜習作，留著已經寫下的樂句停住的位置。
    points:
      p1: 在病中交接時，護住莫扎特已經配完器的《安魂曲》開篇，別讓散頁錯放
      p2: 他 11 月 20 日臥床不起以後，治好那場讓他起不了身的高燒
    points_fail:
      p1: 第一段的分譜和草頁混在一起，再拼不回完整的開篇。這條分支與史實脫節，員工被召回。
      p2: 這條分支裡那場病沒有退，12 月 5 日他在維也納去世，三十五歲。
    shift:
      p1:
        was: 1791 年 12 月，莫扎特去世時，《安魂曲》的開篇已經配完器，其餘多處仍是未完稿。
      p2:
        was: 1791 年 11 月 20 日起莫扎特臥床不起，12 月 5 日在維也納去世，教區登記的死因是急性粟粒熱。
        now: '{staff}帶去的藥退了他的高燒，12 月裡他從床上坐了起來。這條時間線裡，他親手寫完了《安魂曲》，又在維也納作曲、演出了許多年。'
        who: mozart
        bio: 莫扎特在 1791 年冬天病癒，親手寫完《安魂曲》，此後在維也納又作曲、演出了許多年。
    vignettes:
      stack: 格蕾塔收拾桌面，順手拿開一頁看著空白的紙。你扶住一疊譜，讓埃米爾去對它前一頁。原來那行空譜也該收在原來的次序裡。格蕾塔把它放了回去，夾一張小條記下原來的位置。
      hand: 眼前的樂句埃米爾抄得出，順著寫下去就要越過原來空著的一行。你請他在抄寫停住的地方劃個邊記。交稿後，下一個人翻到這裡，就知道另一隻手得從哪兒起筆。
      finish: 你哼得出後世合唱團會唱的那段。格蕾塔現在就得帶走副本，問原譜在這一頁寫到了哪兒。你指出分界，把後來聽過的旋律留在心裡。下一版會在你離開後拼合。
  dickinson_amherst:
    name: 箱子裡的詩
    place: 阿默斯特
    figure: 艾米莉·狄金森
    story: 1886 年 5 月 15 日，艾米莉·狄金森在阿默斯特家中去世。妹妹拉維尼婭按姐姐的要求銷燬了收到的來信，又發現數百首詩。早期編者後來將艾米莉手縫成冊的詩稿拆開整理。
    story_prose:
      opening:
        - 阿默斯特家裡，拉維尼婭看見一摞來信下壓著一角折過的紙。旁邊還有艾米莉已經縫好的小本。樓上的人問今晚要不要留燈，紙頁暫時全放在手邊的箱子上。
        - 艾米莉·狄金森於 1886 年去世。姐妹拉維尼婭處理她的來信時發現大量詩稿，後來不少詩冊被拆開。這次可以先約一晚合艾米莉心意的照護；之後還要分清信與詩，爭取整冊留下一份。
        - 擅長照顧人的員工先問艾米莉怎麼安排夜裡的屋子。熟悉手稿的人再幫拉維尼婭識別縫線和備選詞，按發現時的順序核對。
      points:
        p1: 拉維尼婭提起一摞散紙，說來信歸一處。你請她先拆開夾在下面的細繩，那裡幾張折成同一大小的紙，用的是姐姐自己的字。她把信另放，把詩放在一盞不燙紙的燈旁慢慢看。她最後把兩摞挪到兩隻箱蓋上，才叫家人來認。
        p2: 拉維尼婭問抄本能不能只留各頁最好讀的詞。你請她指給抄寫人看同一行旁邊補過的兩個字，再把摺痕和線孔的位置單獨畫在副稿上。封套寫好頁序，小冊沒有拆。再翻一遍時，抄寫人能按折線回到同一個備選詞。
        p3: 你問艾米莉今晚願不願有人在隔壁。她把燈往窗口指了一下，請那人把走廊的門虛掩著，自己想叫時聽得見。家人照她說的，把水和一張可挪的椅子放好。要走的時候，最後一位值夜人把腳步放輕，她還能聽出是誰。
      outcomes:
        all: 艾米莉那晚按自己的意思歇息。她去世以後，留存的詩稿中有一本從縫線到備選詞都能重新查閱。
        p1: 來信與詩稿分開存放，未刊詩還在。家人日後處理原稿，仍有冊頁拆散。
        p2: 一冊的摺頁和備選詞留了副本。其餘詩稿的存放出了差錯，只有這冊的抄錄過程隨報告帶回。
        p3: 她夜裡開口時，有人就在聽得見的地方。詩稿的處理還要等家人自己辨認。
      none: 燈邊只留下一些折過的紙，沒有人替艾米莉安排那一夜。
      not_admitted: 有人從門裡應了一聲，說家裡現在不能接訪。兩摞紙還沒攤開。
      desync: 詩稿和來信混到一起，原來會存世的一批散頁找不回了。事務所因同步失敗召回員工。
      excerpts:
        p1: 她把信另放，把詩放在一盞不燙紙的燈旁慢慢看。她最後把兩摞挪到兩隻箱蓋上，才叫家人來認。
        p2: 封套寫好頁序，小冊沒有拆。再翻一遍時，抄寫人能按折線回到同一個備選詞。
        p3: 家人照她說的，把水和一張可挪的椅子放好。要走的時候，最後一位值夜人把腳步放輕，她還能聽出是誰。
    relic: 一冊手縫的小本
    relic_desc: 幾頁手工縫起來的紙，每頁一首詩。
    points:
      p1: 幫拉維尼婭分開要銷燬的來信和姐姐捆好的詩稿，護住那批尚未刊行的詩
      p2: 請拉維尼婭留下一本未拆的詩冊，抄出帶摺頁、頁序和備選用詞的副本
      p3: 問艾米莉今晚怎樣能歇得安穩些，幫家裡人照她的意思安排
    points_fail:
      p1: 詩稿和來信混進同一摞紙，大批未刊詩跟著消失。這條分支與史實脫節，員工被召回。
      p2: 清抄稿有了，可紙頁怎樣折在一起，單看副本已經辨不出來。
      p3: 家裡照平時的樣子入夜。艾米莉需要人搭把手時，還得開口請人留下。
    shift:
      p1:
        was: 1886 年，狄金森去世後，拉維尼婭按姐姐的要求銷燬來信，另外發現了成批詩稿。
      p2:
        was: 狄金森的早期編者拆開了她親手縫成的詩冊。
        now: 這條分支裡，{staff}抄了一冊留樣，始終沒拆它。拉維尼婭從副本就能看出紙頁怎樣疊在一起，頁邊的備選詞也留了下來。
      p3:
        was: 狄金森病重，1886 年 5 月 15 日在家中去世。
        now: 這條分支裡，家人照她的意思留了人在近處。她歇下之後，有事也不用提高聲音喊。
    vignettes:
      pause: 讀者朗讀時把破折號滑了過去。你請他在筆跡斷開的地方停一停。再讀那一行，他聽出了另一種收尾。
      variant: 你看見行上還寫了一個詞。讀者想挑一個抄完就算，你騰出頁邊，把兩個都留著，並註明各在何處。
      stack: 讀者整理散頁時，你把邊緣和筆跡對得上的兩張留在一起。下一次清抄，便從這兩張並排開始。
  hertz_bonn:
    name: 最後一個學期
    place: 波恩
    figure: 海因里希·赫茲
    story: 1892 年初起，赫茲的鼻子和喉嚨反覆劇痛，有時痛得無法工作。1893 年他一邊做了幾次手術，一邊回到波恩大學講課，寫完了《力學原理》。1894 年 1 月 1 日，他在波恩去世，年僅三十六歲，書在他死後出版。
    story_prose:
      opening:
        - 波恩的教室門口已經貼了課表。赫茲手裡有自己要講的一頁，還有《力學原理》上想再看一眼的幾行。他問年輕同事，此刻有幾個學生等著問課。
        - 赫茲在末病中繼續整理《力學原理》，1893 年 12 月交稿，次年 1 月 1 日去世。你可以替他辦下一堂課的交接，讓他決定怎麼用空下來的一段時間。
        - 熟悉課堂的人可以幫忙核一遍學生的題。會有人代講和回答時，仍由赫茲自己決定哪堂能交過去。
      points:
        p1: 同事把兩張課單攤開，說後一堂他可以替上，卻不知道哪些問題學生已經問過。你請赫茲挑出當天的那張，並把應當接著答的兩處圈明。同事把課單拿走前，當面說了答疑會在哪間屋裡。赫茲把原來夾在講稿裡的紙取下來，夾到力學書稿要校的那一頁。
      outcomes:
        all: 學生照約定在那位同事的課堂上問了問題。書稿按時交出，赫茲在次年元日去世。
        p1: 有同事去教那一堂課。赫茲拿到空出來的時間，先歇了一會兒，再看稿上的記號。
      none: 課單還在赫茲手裡。他把書稿合上，留著下回再核那幾行。
      not_admitted: 沒人答應在開講前見你。走廊裡的學生等了一陣，又回到貼課表的那棟樓。
      excerpts:
        p1: 同事把課單拿走前，當面說了答疑會在哪間屋裡。赫茲把原來夾在講稿裡的紙取下來，夾到力學書稿要校的那一頁。
    relic: 一張折過的課單
    relic_desc: 虛構的課單，其中一堂做了記號。
    points:
      p1: 問赫茲哪一堂課可以交給同事，幫他安排當天由誰回答學生的提問
    points_fail:
      p1: 課還在赫茲的日程上。他只好把稿上的那處改動再往後放一放。
    shift:
      p1:
        was: 赫茲於 1893 年在波恩帶病講課，在去世前完成了《力學原理》。
        now: 這條分支裡，赫茲請同事代一堂課，自己先歇了一會兒。稿子送出去以前，他還能口述一處更正，請人記下來。
    vignettes:
      repeat: '{staff}把兩個問題念給代課的同事。他把不用翻赫茲書稿就能回答的那一個圈起來。'
      signal: 有學生在等錯了的教室外。{staff}指給他看代課同事在課表上記的那一間。
      gap: '{staff}在紙上空一行留給講師寫答覆，把紙放到下一位學生找得到的地方。'
  bizet_paris:
    name: 《卡門》的那一年
    place: 巴黎
    figure: 喬治·比才
    story: 《卡門》經過數月排練，於 1875 年 3 月 3 日在巴黎喜歌劇院首演。報刊評價不一，劇院在那年春天繼續演出。6 月 3 日，比才在布日瓦爾去世，終年三十六歲。
    story_prose:
      opening:
        - 巴黎喜歌劇院的排練剩下最後一輪。合唱第一聲準時進了，第二句卻被走位擠到後面。鋼琴邊的人問，是先給樂隊留時間，還是從舞臺上的那一步重新來。
        - 《卡門》於 1875 年 3 月 3 日在巴黎首演，比才同年六月去世。這裡可以先給合唱和樂隊一次合排，演出後再把歌手確切想重過的段落交給比才。
        - 讓踩得準進聲時刻的員工先和舞臺兩邊對好。演出完，有人可把歌手的話按曲目和詞頭寫下。
      points:
        p1: 樂隊想從自己聽錯的那小節開始。你請臺上的歌手先退回原位，讓指揮看見他們要走到哪裡才能齊聲。停了一次以後，全組從入場的那個字再唱。第二次才合上時，管臺的人從門邊打了個手勢，可以往後接了。
        p2: 演後有人在便條上寫「進來難」。你請她哼出前一句，叫另一位歌手指出是第幾回聽到這個開頭的。比才接了紙，先看清哪幾個人說的，再把它夾進當晚用的譜。詞頭仍露在外頭，下次想重過的人一眼能找到。
      outcomes:
        all: 3 月 3 日首演照期開始。演後比才收到能指到段落的便條，六月的死訊仍按史實進入記錄。
        p1: 幕照常拉開。之後歌手只送來一條簡略的消息，比才還得等人回來說明。
        p2: 一張標清詞頭的便條已經遞到比才手裡。首演日期出了差錯，回程只保留這段交接。
      none: 譜上留下兩處看著一樣的記號。下班離場的人仍說不清合唱應該在哪一處進。
      not_admitted: 管臺的人沒在名單裡找到來客，讓你站在不礙門的地方。歌手在裡面重新數了幾拍。
      desync: 排練沒能合攏，3 月 3 日的首演未開始。事務所按同步失敗召回員工。
      excerpts:
        p1: 停了一次以後，全組從入場的那個字再唱。第二次才合上時，管臺的人從門邊打了個手勢，可以往後接了。
        p2: 比才接了紙，先看清哪幾個人說的，再把它夾進當晚用的譜。詞頭仍露在外頭，下次想重過的人一眼能找到。
    relic: 一把摺扇
    relic_desc: 一把來自池座的彩繪紙扇。
    points:
      p1: 請劇院再留最後一輪排練，讓歌手帶上走位，和樂隊再對一遍最難進聲的地方
      p2: 把一晚的演出情況送給比才，替歌手標清下次還想一起過哪一段
    points_fail:
      p1: 排練卡住，劇院 3 月 3 日拉不開幕。分支脫節，事務所因同步失敗召回員工。
      p2: 便條到了，卻漏了是哪一段。比才只知道有個地方難唱，還要等人回來指明。
    shift:
      p1:
        was: 喜歌劇院的舞臺日誌記下了 1875 年 3 月 3 日首演當天的排練和舞臺準備。
      p2:
        was: 三月首演後，《卡門》在當年春季繼續演出。
        now: 這條分支裡，{staff}帶來了一張能對回總譜的便條。比才把難進聲的位置圈出來，下一場之前可以問問歌手怎麼唱比較順。
    vignettes:
      future: 你告訴幫工，以後連他沒去過的城市也會有人知道這部戲。他問今夜有何必要多留一張。你指給他看首演日期和加利-馬裡耶的名字。一張節目單收進抽屜。你走時還沒有第二個人來翻看。
      label: 幫工把兩張節目單按同一個劇名收了。你按日期把它們分開，給首演那張單獨做了個寫有日期的紙套。回頭要查的人現在能拿準。只是你趕不上散場了。
      seat: 你把節目單借給來遲的觀眾，等他找到座位再在門邊拿回來。你在自己的紙條上抄下一個名字。這時候，裡面已經唱過了你原先想聽的那一段。
  artemisia_florence:
    name: 學院裡的第一位女性
    place: 佛羅倫薩
    figure: 阿爾泰米西婭·真蒂萊斯基
    story: 1616 年，阿爾泰米西婭·真蒂萊斯基成為佛羅倫薩繪畫學院接納的首位女性。現稱《彈魯特琴的自畫像》的作品屬於她在佛羅倫薩的時期。
    story_prose:
      opening:
        - 佛羅倫薩的畫材鋪開著兩本賬。顏料記在一本里，另一冊夾了學院費用的條子。阿爾泰米西婭請經手人把這兩筆分開，再問七月哪一天能拿到繳費的回單。
        - 1616 年 7 月 19 日，阿爾泰米西婭獲佛羅倫薩繪畫學院接納。她那年也在做委託畫。這裡可以幫她辦妥入會費，再從下一份畫約裡爭取開工前的預付款。
        - 懂核賬的人可以先清點學院的錢。擅長把口頭約定落實到紙面的人，可幫她按想要的日期問委託方。
      points:
        p1: 賬房把學院單夾在著急結清的顏料賬裡。你請阿爾泰米西婭說清哪筆要先交，再把收款人與入會日期一起核定。經手人把學院的回單抽出來，旁邊空了一聯給她自己留。她把寫著名字的那一聯帶出了櫃檯。
        p2: 最後一筆畫款結清時，委託人問下一張畫能早幾天開工。阿爾泰米西婭把顏料單推給他，看著對方逐項唸完。你替他們請書記把預付款日寫在開工之前，讓雙方各有一份。她之後去取顏料，帶的是已經能照約收款的紙。
      outcomes:
        all: 學院收下入會費，下一份畫約也已經寫好預付款的日子。她按約買到顏料，再把第一張畫布架起來。
        p1: 入會照史實辦成。到了下一次訂顏料時，先付款的事還得另找對方開口。
        p2: 預付款的條款寫下了。入會費未趕上，回程只帶回畫約交接的一段。
      none: 兩筆錢仍在同一沓票裡，畫材鋪只好再問哪一筆先付。
      not_admitted: 賬房給預約過的人留了位子。你沒進裡間，只看見有人把學院的紙條夾回賬中。
      desync: 入會費沒有按日交妥。學院的錄名與史實脫節，事務所召回員工。
      excerpts:
        p1: 經手人把學院的回單抽出來，旁邊空了一聯給她自己留。她把寫著名字的那一聯帶出了櫃檯。
        p2: 你替他們請書記把預付款日寫在開工之前，讓雙方各有一份。她之後去取顏料，帶的是已經能照約收款的紙。
    relic: 一罐顏料
    relic_desc: 一小罐磨好的青金石藍。
    points:
      p1: 幫阿爾泰米西婭調出一筆錢繳入會費，趕上 7 月 19 日入會
      p2: 趁上一個委託結款，幫阿爾泰米西婭在下一份畫約裡定下預付款日期，讓她在開工前買齊顏料
    points_fail:
      p1: 這條分支裡，阿爾泰米西婭當天沒能交齊入會費。入會偏離史實，事務所因同步失敗召回員工。
      p2: 8 月的尾款照史實付清。下一次買顏料時，阿爾泰米西婭還得臨時開口催錢。
    shift:
      p1:
        was: 1616年7月19日，阿爾泰米西婭·真蒂萊斯基獲佛羅倫薩繪畫藝術學院接納。
      p2:
        was: 1615 至 1616 年，博納羅蒂分期支付畫款，檔案裡還留著阿爾泰米西婭作畫期間催付的信。
        now: 下一份畫約寫明瞭預付材料款的日期，在開工以前。她可以照約定的款項訂好顏料。
        who: artemisia_florence
        bio: 她為小米開朗琪羅·博納羅蒂的宅邸繪製《傾向的寓意》，作品至今仍屬建築裝飾的一部分。入會以後，她也可以向學院的法庭提出與畫業有關的爭議。
    vignettes:
      pose: 訪客面對鏡子，問哪種姿勢看著自然。你問兩種姿勢各像在做什麼。他選了手還能做自己的事的那一種。
      name: 一張習作只寫了畫中人的描述，沒留畫家的名字。你把紙翻過來，請訪客在收進一摞圖以前把兩項都寫上。
      mirror: 你挪了鏡子，讓訪客不用扭身也能看見那個角度。他試坐一回，又自己調了一點，才開始畫。
  buchner_zurich:
    name: 排練桌上的兩份殘稿
    place: 蘇黎世
    figure: 格奧爾格·畢希納
    story: 1836 年，格奧爾格·畢希納流亡到蘇黎世，在大學講課。次年 2 月，他病得很重。未婚妻明娜·耶格勒從斯特拉斯堡趕到時，他已病危。2 月 19 日，二十三歲的畢希納去世，《沃伊採克》沒有寫完。
    story_prose:
      opening:
        - 蘇黎世有人把兩份有相同人名的戲稿分開放在桌上。隔間的畢希納叫人找一張能寫信的紙。他想趁還有力氣，請在斯特拉斯堡的明娜過來。
        - 1837 年二月，畢希納在蘇黎世病重，明娜趕來時已很晚，他隨後去世。《沃伊採克》留有幾組未完成的手稿。這裡可以讓他的口信更早送出，也可用事務所的虛構醫療箱照護他。
        - 讓會送信的人先確認畢希納自己要說什麼。要去床邊幫忙，派懂照護並帶著醫療箱的人先問家中的安排。
      points:
        p1: 來送信的人拿起一張散稿，以為這是沒抄清的來信。你請畢希納逐句說給幫手聽，按他的原話另寫一張。明娜的地址對過以後，送信人把戲稿留在桌上，拿著那張新紙動身。收紙的時候，畢希納聽見對方完整唸了一遍名字。
        p2: 家裡的人想繼續念出每張紙的題頭，畢希納請他們先停一下。你解釋事務所帶來的醫療箱，等照護的人留在床邊。過了些時候，畢希納睜開眼，伸手指兩份散稿中較薄的一疊。幫手把它挪近，他沒有再請人替他挑。
      outcomes:
        all: 明娜到蘇黎世時，畢希納還能把原先想說的事告訴她。燒已退下，桌上仍有兩疊未排定的稿。
        p1: 口信送得早，明娜有時間聽他自己說話。病仍沒退，他隨後在蘇黎世去世。
        p2: 畢希納退燒，醒來要其中一份手稿。早先請明娜來的話，仍沒能及時送到。
      none: 信紙和草頁仍攤在一起。明娜到時已近最後，他在蘇黎世去世。
      not_admitted: 屋裡的人請來客先不要打擾。那張信紙還沒寫上收件人。
      excerpts:
        p1: 明娜的地址對過以後，送信人把戲稿留在桌上，拿著那張新紙動身。收紙的時候，畢希納聽見對方完整唸了一遍名字。
        p2: 過了些時候，畢希納睜開眼，伸手指兩份散稿中較薄的一疊。幫手把它挪近，他沒有再請人替他挑。
    relic: 一疊零散的場景稿
    relic_desc: 字跡侷促的散頁，沒有固定的順序。
    points:
      p1: 趁畢希納還有力氣親口說明，把他請明娜過來的話送到斯特拉斯堡
      p2: 把事務所的納米醫療箱帶到床邊，幫守在那兒的人照護髮高燒的畢希納
    points_fail:
      p1: 明娜趕到時，他已病危。他原想告訴她的幾句話，還攤在案上。
      p2: 燒沒有退下去。他病得已經開不了口，案上的稿子還攤在那裡。
    shift:
      p1:
        was: 1837 年 2 月，未婚妻明娜從斯特拉斯堡趕到蘇黎世時，他已病危，不久在她身邊去世。
        now: 這條分支裡，明娜早幾天到了蘇黎世。他還有力氣，兩人能當面說說話。
      p2:
        was: 1837 年 2 月 19 日，畢希納在蘇黎世去世，《沃伊採克》沒有寫完。
        now: 這條分支裡，{staff}用事務所的納米醫療箱幫他退了燒。畢希納活過這一場病，有力氣問起案上那幾頁稿子。
        who: buchner_zurich
        bio: 這條分支裡，畢希納熬過了 1837 年 2 月在蘇黎世的那場病。
    vignettes:
      order: 試讀人把兩份攏在一起，用墨寫好了場次。你為兩份抄件各補一張出處籤，把試排的順序另寫在能取下的紙上。下一個人還可以改排。你帶回紙條，仍沒有拿到定稿的場序。
      pause: 你知道後來的劇院也得選下一場怎麼接。試讀人問你這是不是作者定的。你把兩個起頭各念一遍，標明它們各把什麼問題留給臺下。帶回的是兩個停頓，沒有一本完整劇本。
      gap: 紙上的字斷在哪裡，你就請試讀人停在哪裡。誰也沒補那句空著的話。你讓副本上的空白大到一眼就能認出。回來以後，你記得的正是那處停頓。
  enheduanna_ur:
    name: 穿過荊棘的山路
    place: 美索不達米亞烏爾
    figure: 恩赫杜安娜
    story: 烏爾出土的一塊圓盤刻有恩赫杜安娜的名字，也記載她是薩爾貢的女兒。《伊南娜頌》以恩赫杜安娜的口吻寫到被逐出神廟，像燕子一樣離開窗邊，走過荊棘時力氣已經耗盡。何時走的、走了哪條路，難以確定。
    story_prose:
      opening:
        - 烏爾外的路一到傍晚，腳下石頭就看不清了。恩赫杜安娜停在帶刺的灌木邊，把空水罐提起來看了看。同行的人還記得前面有一處能坐下的屋簷。
        - 圓盤銘文留下了恩赫杜安娜的名字。後世抄存、傳統上歸於她的詩歌講到被逐與異地的荊棘。這趟借詩中的情境設定離開烏爾後的行路，能做的是讓她停一會兒。
        - 派有走遠路經驗的人帶上水壺。遇到第一個有人居住的地方，先問她願不願意在那兒等天亮。
      points:
        p1: 同行人想把水留到下一處院子。你問恩赫杜安娜現在想往前還是停，她用空罐指了一下近處的矮牆。你把水遞給她，同開門的人商量借坐到天明。走了半日，她第一次把裝水的罐穩穩放到地上。
      outcomes:
        all: 她在矮牆裡歇過一夜。日後傳下來的詩還寫著荊棘，這趟記錄多了在天黑前停下的一小段。
        p1: 那戶人把門邊的位置讓給恩赫杜安娜。出門前，她讓同行人也把水罐添滿。
      none: 矮牆後的人沒來得及答話，天已暗下去。路上的人只有繼續往前走。
      not_admitted: 同行人認得自己的隊伍，沒有叫你跟上。你只來得及把手裡的水罐遞到門邊。
      excerpts:
        p1: 你把水遞給她，同開門的人商量借坐到天明。走了半日，她第一次把裝水的罐穩穩放到地上。
    relic: 一隻陶水杯
    relic_desc: 路旁那戶虛構人家的小杯。
    points:
      p1: 恩赫杜安娜離開神廟後，帶上水，陪她走到可以歇腳的地方
    points_fail:
      p1: 能歇腳的地方還很遠。天已經暗了，你沒能替她找到一個停下來的地方。
    shift:
      p1:
        was: 《伊南娜頌》中，自稱恩赫杜安娜的敘述者寫到被趕出神廟，走過荊棘時力氣耗盡。
        now: 這條分支裡，{staff}陪恩赫杜安娜走到避風的地方，天黑以前給她遞上一碗水。
        who: enheduanna_ur
        bio: 這條分支裡，恩赫杜安娜離開神廟後有人同行，也有一處地方歇腳。
    vignettes:
      inscription: '{staff}問添一罐水要給多少。門邊的人請他們先喝，其他事等天亮再說。'
      support: '{staff}請同行人先放下水罐，再扶人到矮牆邊。水罐這次穩住了。'
      edge: '{staff}問門旁能不能坐，屋裡有人把長凳上的籃子拿了下去。'
  ibn_sina_hamadan:
    name: 最後一次腹痛
    place: 波斯哈馬丹
    figure: 伊本·西那
    story: 伊本·西那早年在哈馬丹寫完了五卷《醫典》。隨行的朱茲賈尼在續傳中記下他的腹痛反覆發作。1037 年，他隨效力的君主前往哈馬丹，在那裡去世。
    story_prose:
      opening:
        - 去哈馬丹的一行人正在收起鋪地的毯。伊本·西那放下手裡的紙，問他們能不能再等一會兒。隨行人見他把手按在腹部，卻一時找不到能躺下的地方。
        - 續傳記伊本·西那晚年腹痛反覆，於 1037 年在哈馬丹去世。這一趟可以詢問他自己的意願，讓同行的人在路上陪他歇息。
        - 讓有照護經驗的人去問他什麼時候想停，再找他熟悉的同行人陪他。能等多久由他和同行的人商量。
      points:
        p1: 有人來問是不是該扶他起來。你蹲在毯邊問他想在哪裡停，他指了指裡側的暗處，說那裡不用一直撐著身子。你請同行的人把手裡的東西交給別人拿，坐到他能看見的地方。再次有人來敲門時，屋裡答了一聲還請再等。
      outcomes:
        all: 這一程裡有人等伊本·西那自己說可以起身。後來到了哈馬丹，他仍在那裡去世。
        p1: 有人留下來陪他，沒有催他趕上已經收好的行李。
      none: 同行人等得差不多了，仍沒能找到方便他躺下的地方。路還要接著走。
      not_admitted: 隨行人替伊本·西那謝過來客，請沒約好的人在外頭等。你沒能問到他的意思。
      excerpts:
        p1: 你請同行的人把手裡的東西交給別人拿，坐到他能看見的地方。再次有人來敲門時，屋裡答了一聲還請再等。
    relic: 一張折起的路記
    relic_desc: 虛構的隨行紙條，寫著一行人在哪兒停過。
    points:
      p1: 腹痛再犯時，問伊本·西那想在哪裡停下，找個人陪他歇一歇
    points_fail:
      p1: 一行人又在等著出發，還沒騰出能讓他躺下的地方。
    shift:
      p1:
        was: 朱茲賈尼的續傳記載伊本·西那的腹痛反覆發作，1037 年在哈馬丹去世。
        now: 這條分支裡，腹痛再犯時，{staff}給伊本·西那找到了歇腳處。有同伴陪他停下，也替他把回話帶給等出發的人。
    vignettes:
      section: '{staff}問上一次歇腳之後又走了多遠，把回答寫在一張便於翻查的紙上。'
      sleeve: 有人開始收鋪蓋。{staff}請他們暫留一張毯，等伊本·西那自己決定何時走。
      afterlife: '{staff}問大家準備出發時誰留在屋裡等。有一位同行人把行李提回裡間。'
  al_jazari_diyarbakir:
    name: 一本奇巧機械之書
    place: 迪亞巴克爾
    figure: 加扎裡
    story: 加扎裡的機械裝置著作成於 1206 年。現存 1315 年抄本的一頁畫出了書中的象鍾。
    story_prose:
      opening:
        - 阿米德的交稿桌上，書吏攤開寫有頁數的目錄。另一個人抱著圖冊走來，說有張圖的題名能歸到兩章。桌上快沒光了，賈扎裡請他們趁有光再核一遍。
        - 賈扎裡的機械著作在 1206 年完成，存世抄本留下說明和圖頁。這次可以守住書稿的交接，再請作者為後來傳抄挑一份有據可依的底本。
        - 會把圖題與段落對齊的人先去核交付冊。懂抄寫的人可以問作者，旁註和空處哪一些要原樣留下。
      points:
        p1: 書吏指著第二個同名題頭，說是目錄多寫了一遍。賈扎裡請他往後翻，你在第二張圖邊看見指向另一頁的記號。你把卷和圖對應的頁寫進交付清單，請接冊的人自己照目錄試一次。他合上書，說兩張都找到了。
        p2: 抄寫人想趁重新抄一遍，把旁註放進正文省地方。賈扎裡讓他把已有的正文讀到停頓處，你把旁註的另一個來處寫在邊上。讀者翻過這一張時還能看見作者留的空欄。抄寫人提起筆，改在底下另添一張標明出處的紙籤。
      outcomes:
        all: 書稿如期交付。另外留著一份可參照的底本，後來抄寫人可以順著籤條辨認原來的圖注。
        p1: 交付冊成套收下，目錄能領人找到圖。還沒留出一份能分辨新舊旁註的底本。
        p2: 旁註的來源已經分開寫下。交稿的另一冊還是缺了對應圖，無法保留整次交接。
      none: 兩張相似題頭的位置沒核定。下一位抄手先來問究竟該找哪一本。
      not_admitted: 書吏報出接冊人的名字。沒被叫到的人留在桌外，目錄仍合著。
      desync: 幾幅圖脫開目錄，書稿沒能成套交付。事務所因同步失敗召回員工。
      excerpts:
        p1: 你把卷和圖對應的頁寫進交付清單，請接冊的人自己照目錄試一次。他合上書，說兩張都找到了。
        p2: 讀者翻過這一張時還能看見作者留的空欄。抄寫人提起筆，改在底下另添一張標明出處的紙籤。
    relic: 一個黃銅凸輪
    relic_desc: 一個有形狀的輪子，把轉動變成往復。
    points:
      p1: 在阿米德交稿時，按目錄把裝置說明和對應圖頁逐冊核齊，護住書稿完成
      p2: 和作者一起選一冊留作傳抄底本，列出旁註、圖題與後來抄寫人不得合併的空白欄
    points_fail:
      p1: 幾幅圖無從對回章節，書稿無法成套交付，事務所因同步失敗召回員工。
      p2: 下一位抄手只能從已混入不同註記的工作本起抄，讀者分不開作者所見與後來補記。
    shift:
      p1:
        was: 托普卡帕所藏早期抄本的題記給出 1206 年 1 月 16 日的完成日期。賈扎裡的書與阿米德的阿爾圖格宮廷相連。
      p2:
        was: 研究所見的後代抄本並非全從同一傳抄支系而來，有的圖與文本都出現差異。
        now: 庫房留下一冊有作者核驗記號的樣本。後來抄寫人能在抄本前另記自己的修訂，也能拿圖題對照底本。
        who: al_jazari_diyarbakir
        bio: 賈扎裡在阿米德寫下對機械裝置的說明，圖與文字在後來多次傳抄和跨地流通中一同變化。
    vignettes:
      sequence: 學徒一開口便把所有人偶都說到。你指著第一個動作，問緊跟著是哪一下。他這回按著先後講起鍾來。
      viewer: 來客始終盯著最大的人偶。你請他改看學徒作了記號的地方。第二遍，他趕在小人偶動的時候看見了。
      paper: 學徒越過圖指向模型，你把紙舉穩。他補了一處小記號，讓手邊沒模型的人也知道該看哪裡。
  hokusai_edo:
    name: 神奈川衝浪裡
    place: 日本江戶
    figure: 葛飾北齋
    story: 葛飾北齋的《神奈川衝浪裡》是《富嶽三十六景》中的木版畫。大都會藝術博物館將所藏這一印本約定年為 1830 至 1832 年。
    story_prose:
      opening:
        - 江戶的版元把三張剛摺出的樣紙排在櫃上。最濃的那張，浪尖有一小段連成一片；最淡的那張，遠處的富士幾乎看不見。刻工來取一張，摺師伸手想拿另一張。
        - 《神奈川衝浪裡》是北齋《富嶽三十六景》的一幅。存世印張可用來比較版木磨損等變化。這一趟能為首批出樣留一張共同的參照，還能另存一套按印次可查的樣張。
        - 會辨印紋或畫面的員工先做選樣。善於商量保管的人再與北齋、摺師和版元約定添樣辦法。
      points:
        p1: 刻工把一張樣移到窗旁，才在藍色裡認出富士。你請摺師站在相同的地方看浪尖，再對比另一張深淺剛好的。兩人同時點在同一段輪廓上。留給工房的那張只在角上做了一個小記號，遠山前面整片都很亮。
        p2: 夥計把對照樣往待售的印堆裡一插，版元問還能不能在下次開印時找回。你請北齋和摺師一起在套紙上標好序，另留一道能添後來樣張的開口。下一張出樣送來，版元沒有直接往櫃上擺，先把它夾到了對照套的末尾。
      outcomes:
        all: 首批印張出櫃，工房仍留有可對讀的樣張。以後交給另一個摺師時，也能看出它們哪個先印。
        p1: 刻工和摺師照同一張樣印完首批。後來那些樣張又各自散到貨堆裡。
        p2: 樣張已定了歸檔次序。首批仍因斷線留在店裡，回程只保留整理樣張的這一段。
      none: 版元把看著最順眼的一張單擺在櫃邊。再來核浪尖的人各持一張，仍對不上。
      not_admitted: 版元問你跟哪位摺師來的。沒人認領來客，樣紙剛摞好就收回了。
      desync: 首批樣張在浪尖同一處仍斷線，沒能離開印坊。事務所按同步失敗召回員工。
      excerpts:
        p1: 兩人同時點在同一段輪廓上。留給工房的那張只在角上做了一個小記號，遠山前面整片都很亮。
        p2: 你請北齋和摺師一起在套紙上標好序，另留一道能添後來樣張的開口。下一張出樣送來，版元沒有直接往櫃上擺，先把它夾到了對照套的末尾。
    relic: 一塊印刷用的木版
    relic_desc: 一塊雕好的櫻木版。
    points:
      p1: 從江戶版元送來的樣張裡挑出浪尖與遠山都清楚的一張，給刻工和摺師留作首批出樣的準繩。
      p2: 在版元打散樣張前，請北齋與摺師共同留存一套對照印。讓版元約定重開印時把新樣也夾進去，並寫下順序。
    points_fail:
      p1: 刻工與摺師手裡沒有同一張好樣，反覆送來的樣張在浪峰同一處斷線。版元扣住第一批貨，事務所因同步失敗召回員工。
      p2: 版元在櫃上只留下好賣的印成品。北齋與摺師核過的樣張又回到貨堆，換了誰接手也找不回那一套。
    shift:
      p1:
        was: 江戶版元永壽堂趕在1831年新年時為《富嶽三十六景》登廣告，《神奈川衝浪裡》是該系列的版畫之一，早期印張上浪線仍完整的例子保存至今。
      p2:
        was: 當時這組印張沒有日期和批次編號。原版木沒有留存，後世主要靠印張上的痕跡判斷先後。
        now: 永壽堂櫃後留下一封有次序的樣張。換了摺師，開印時仍能查出哪處斷線是後來才有的，再讓北齋核定是否接受這批效果。
        who: hokusai_edo
        bio: 北齋負責畫稿。一張版畫的面貌還取決於刻工如何落刀、摺師如何轉印和版元何時續印；這些人共同影響後來的印張。
    vignettes:
      mountain: 版畫商指著浪花，你請他用手遮住浪頭。手再移開，遠處那個小三角就不像另一朵水花了。
      edge: 版畫商打算裁一張試印紙。你拿未裁的那張並排放好，給他看落款離紙邊多近。
      counter: 一位客人總往紙的上方找富士山。你把印本轉向他，他終於在下面認出來，問還能不能看看另一景。
  bell_boston:
    name: 把聽到的寫下來
    place: 波士頓
    figure: 亞歷山大·格雷厄姆·貝爾
    story: 亞歷山大·格雷厄姆·貝爾的實驗筆記記載，1876 年 3 月 10 日在波士頓，托馬斯·沃森聽懂了貝爾對著發話裝置說的話。6 月 25 日，貝爾在費城百年博覽會上向評委演示了電話。
    story_prose:
      opening:
        - 波士頓的房門各關一扇。沃森在隔壁按住一側耳朵等聲音，貝爾把手停在桌上，問還要不要再試一句。有人以為已經試完，想收起裝置。
        - 1876 年 3 月 10 日，貝爾記錄沃森聽懂了從另一房間傳來的話。同年 6 月，貝爾去費城百年博覽會演示。你可以保住那次試驗，還可以請同事在他離開前明確學生這邊的安排。
        - 懂得看守器材和聽辨語句的人先留在房間兩頭。善於跟教師商議的人再去核貝爾離校幾天的課。
      points:
        p1: 沃森從屋裡走出來，說聽見了。你把預先寫好的紙收回桌底，請他把聽到的句子從頭說一遍。貝爾拿起筆，記下他並不需要再問的話。兩人換了位置，門重新關上，這次輪到沃森出聲。
        p2: 同事攤開一張排班單，說有人來上課只認得貝爾。貝爾一邊讀出幾位學生該做的練習，一邊請下一位老師把空出來的時間填上。你幫他們把改好的那張另外謄給學生家裡。裝箱前，貝爾把自己的副本和車票收在不同的口袋。
      outcomes:
        all: 三月的聽辨記錄留在實驗簿。費城演示開始時，波士頓的學生仍按事先說好的安排上課。
        p1: 沃森複述了實際聽見的話。六月的準備還沒有形成能照做的分工。
        p2: 學生這邊有了接手的人。三月的筆記缺最後一次確認，事務所只帶回了這次排班的記錄。
      none: 裝置重新躺回臺上，隔壁沒有一份核過的複述。學生的課表還等人補。
      not_admitted: 兩間屋的門都關著。有人從裡面應聲，但試驗檯沒有為來客騰出位置。
      desync: 史有的試驗複述或六月演示缺了一項。行程脫節，事務所發來召回。
      excerpts:
        p1: 貝爾拿起筆，記下他並不需要再問的話。兩人換了位置，門重新關上，這次輪到沃森出聲。
        p2: 你幫他們把改好的那張另外謄給學生家裡。裝箱前，貝爾把自己的副本和車票收在不同的口袋。
    relic: 一隻電話聽筒
    relic_desc: 一個木製聽筒，裡面有一片薄薄的振膜。
    points:
      p1: 把波士頓的裝置多留一輪，請隔壁的沃森複述他實際聽到的話
      p2: 趁貝爾還在波士頓，請他和同事定下離校參展幾天裡學生的事怎麼安排
    points_fail:
      p1: 沃森還沒來得及確認聽見了什麼，裝置就收回桌上。三月的試驗脫節，事務所召回{staff}。
      p2: 貝爾留在波士頓照管學生的事。展會演示脫節，事務所召回{staff}。
    shift:
      p1:
        was: 1876 年 3 月 10 日，貝爾在波士頓用實驗裝置把一句完整清楚的話傳給了隔壁的沃森。
      p2:
        was: 1876 年 6 月 25 日，貝爾在費城把電話演示給百年博覽會的評委，其中有佩德羅二世和威廉·湯姆森。
    vignettes:
      blind: 接聽的幫工想先看試句。你把紙折起來，請他只寫實際聽見的。傳過來兩個完整的詞，最後一個留了空。你把這張紙條帶回去，收隊時又一輪剛要開始。
      future: 你告訴幫工，後人會記住這天傳過來的一句話。他猜只要留下說話那端寫的句子就夠了。你攤開兩張紙條，一張給說話人，一張給聽話人。眼下這趟究竟漏了哪兒，還得靠這兩張對出來。
      door: 你把接聽那張摺好的條子帶過門，這才攤到試句旁。聽漏的詞依舊空著，聽對的兩個總算有了記錄。你帶回對照表，下一句沒有聽到。
  cantor_halle:
    name: 療養院寄出的信
    place: 哈雷
    figure: 格奧爾格·康托爾
    story: 康托爾 1913 年退休，晚年多病，又遇上戰時缺糧。1917 年，他最後一次住進哈雷的療養院。他寫信給妻子，請求回家，1918 年 1 月 6 日在院中去世。
    story_prose:
      opening:
        - 哈雷療養院的窗邊放著一把椅子。康托爾寫完一封信，把還沒裝封的紙放下，問今天還有沒有人來。走廊裡的伙房賬單剛送上樓，送餐的人也在等。
        - 康托爾在戰時最後一段日子住在哈雷療養院，1918 年 1 月 6 日去世。家人探望和那一冬的食物是這趟能做的事。兩件各自商量。
        - 派能聽完他的話再安排的人，問誰來見他最合適。能跟伙房核實供應的人，再去找一頓他吃得下的飯。
      points:
        p1: 你把兩個可來訪的日子寫到信紙下面。康托爾看了片刻，請你先帶去給他指定的那位家人。探訪訂下來以後，值班人把椅子放到稍離走廊的地方。那天外面有人經過，椅子上的人也聽清了他正說的話。
        p2: 伙房的人只肯說哪幾天有餘量。你請他把能保證的幾天圈出來，回頭又和來人核了家裡能勻的食物，再問康托爾哪樣吃得下。下一次有人送餐，他看了看鐘，說和昨日約好的是同一個時刻。
      outcomes:
        all: 那年冬天多了一次探望，也有幾頓能按時端來的飯。到了次年一月，家人仍收到他在哈雷去世的消息。
        p1: 康托爾見到自己想見的人。後來送飯仍取決於當日能勻出什麼。
        p2: 他有了較安穩的飯點。家裡的人沒能到椅子上坐下，只從回信問候他。
      none: 椅子仍朝著窗。伙房的人把賬單再折起來，送餐的日子還定不下。
      not_admitted: 值班人替房裡傳話，今天沒有約見。你把帶來的紙留在門口的信盤。
      excerpts:
        p1: 探訪訂下來以後，值班人把椅子放到稍離走廊的地方。那天外面有人經過，椅子上的人也聽清了他正說的話。
        p2: 你請他把能保證的幾天圈出來，回頭又和來人核了家裡能勻的食物，再問康托爾哪樣吃得下。下一次有人送餐，他看了看鐘，說和昨日約好的是同一個時刻。
    relic: 一隻沒用過的信封
    relic_desc: 虛構信封，留在哈雷的來信旁。
    points:
      p1: 問康托爾最想見誰，幫他約一次在哈雷療養院裡能安靜說話的探望
      p2: 和伙房及家人核對冬天還能勻出哪些食物，給他安排一頓能按時吃上的飯
    points_fail:
      p1: 家裡只能回信。他請人搬來的椅子，一直空著。
      p2: 還得等有人勻出食物才有得吃，康托爾有些日子依然餓著。
    shift:
      p1:
        was: 1917 年，康托爾最後一次住進哈雷的療養院，寫信給妻子請求回家。
        now: 這條分支裡，{staff}安排了一次探望。那些寫在信裡的話，康托爾可以當面說給家裡人聽。
      p2:
        was: 康托爾晚年多病，戰時德國又缺糧。
        now: 這條分支裡，{staff}讓康托爾按時吃上了一頓飯。這幾天他餓了，不用先等家裡送東西過來。
    vignettes:
      list: 值班人差點把回信放進要寄出去的信裡。{staff}核過兩個封面上的名字，把回信放回康托爾桌上。
      after: 有隻碗從窗前經過。{staff}問誰還在等飯，值班人又把伙房的單子核了一遍。
      end: '{staff}問康托爾希望把椅子放在哪。他指著一個來客坐定就能看見他的位置。'
  leeuwenhoek_delft:
    name: 一滴水裡的世界
    place: 代爾夫特
    figure: 列文虎克
    story: 1676 年 10 月，列文虎克從代爾夫特寫信說，一滴胡椒水裡有成千上萬的小動物。倫敦皇家學會來信詢問怎樣核實他的觀察。次年 5 月到 8 月，代爾夫特一帶有八人先後湊到透鏡前看過，寫下證詞，10 月 5 日隨信寄往倫敦。後來，胡克在學會上讓會員們親眼看到了小動物。
    story_prose:
      opening:
        - 代爾夫特，列文虎克把黃銅板遞給第一位來客。來客閉一隻眼，還是什麼都沒看見。旁邊一位已經拿起筆，卻在等他說看到了什麼。
        - 1676 年，列文虎克把水裡小動物的觀察寄往倫敦。次年，代爾夫特有八人陸續簽下證詞，10 月 5 日寄出。你能守住第一批見證的交接，再在封口前核對十月的每一張附頁。
        - 找會引導別人看清細處的人先守在透鏡旁。秋天要用能核署名和郵封的員工把信送出。
      points:
        p1: 第一位見證人把黃銅板轉過來，原先那點亮光不見了。列文虎克請他把眼移回來，直到又能看見。他寫下小動物活動的樣子，你把紙反扣在桌上，請第二個人自己看完再拿筆。兩位寫完才交換紙張，對著各自的字同時笑了一下。
        p2: 十月的封套裡已經放進了信。你從外面拈起一張晚到的證詞，請列文虎克念出聯名處，再照日期逐張核。最後一頁的簽名不在你習慣找的那一角。手指掀開那摺紙，才把最後一個名字補進附頁單。
      outcomes:
        all: 證詞隨信離開代爾夫特。讀信的人能把一行說法查回一張署了名的紙；隨後胡克在倫敦也讓同事親眼看見。
        p1: 最早兩位見證人已經寫下了各自的觀察。十月那隻郵封后來有一頁沒對齊。
        p2: 你按署名理好了桌上的紙。清點仍缺最初的證詞，寄件無法對上歷史。
      none: 透鏡還立在原處，來客只看過一眼，桌邊沒有留下可寄的證詞。
      not_admitted: 來客與列文虎克的約定沒有你的名字。學徒把黃銅板拿進屋內，帶上了門。
      desync: 最早的籤認或十月寄出的附件已缺，證詞與舊日記錄不能相合。事務所召回員工。
      excerpts:
        p1: 他寫下小動物活動的樣子，你把紙反扣在桌上，請第二個人自己看完再拿筆。兩位寫完才交換紙張，對著各自的字同時笑了一下。
        p2: 最後一頁的簽名不在你習慣找的那一角。手指掀開那摺紙，才把最後一個名字補進附頁單。
    relic: 一塊小黃銅透鏡板
    relic_desc: 拇指大的板子，裡面嵌著一片極小又極清晰的透鏡。
    points:
      p1: 給頭兩位見證人留出看透鏡的時間，請他們用自己的話寫下小動物是怎麼動的
      p2: 在代爾夫特核對十月的郵封，封口前把散開的證詞逐張對回署名
    points_fail:
