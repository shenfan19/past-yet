    shift:
      p1:
        was: 1749 年 9 月 10 日，王家圖書館為杜·夏特萊寄存的三包牛頓評注稿開出收據。
      p2:
        was: 1759 年，法語全本出版，杜·夏特萊去世後由克萊羅參與整理。
        now: 編輯手裡有她核過的兩份決定，後來附上的修改在另頁說明。讀者可以區分她的評注與編輯的補充。
      p3:
        was: 1749 年 9 月 4 日夜裡，杜·夏特萊生下一個女兒，9 月 10 日在呂內維爾去世，死因一說產褥熱，一說肺栓塞。
        now: 她熬過了產後那幾天，秋天裡身體慢慢復原。她親自看著牛頓譯本付印，此後又做了多年研究。
        who: du_chatelet_luneville
        bio: 杜·夏特萊在 1749 年產後活了下來，親自把牛頓《原理》的法譯與評注送進印坊，此後繼續寫作與研究多年。
    vignettes:
      stairs: 9 月 4 日一早，{staff}幫洗衣房的姑娘把一摞乾淨布巾送上樓。樓梯窄，兩個人在轉角把布巾一疊疊換手。姑娘說樓上半夜就點了燈，她躺著數腳步，到天亮已經跑了十一趟。
      candles: 八月底，{staff}幫宮裡管蠟燭的老僕清點庫房。拆開紙包，燭身上還粘著幾根細碎的紙屑。老僕說侯爵夫人屋裡的蠟燭比國王的書房還費，他這個月得提前一週報賬。
      arbour: 十月，{staff}幫園丁取下涼亭的簾子，把沾了露水的一角往外折。園丁說，宮裡今年安靜得早，往年這時候還在這兒排戲。
  noether_gottingen:
    name: 署著別人名字的課
    place: 哥廷根
    figure: 埃米·諾特
    story: 1915 年，大衛·希爾伯特和費利克斯·克萊因把埃米·諾特請到哥廷根，可大學不讓女性取得任教資格，從 1916 年冬季學期起，她的課在課表上署的是希爾伯特的名字。1918 年 7 月 26 日，克萊因把她的論文《不變變分問題》呈交給哥廷根科學學會，9 月底她交了終稿。這篇論文把每一種連續對稱性與一個守恆量聯繫起來。1919 年 6 月，她獲准任教，直到 1923 年才第一次領到一小筆固定的教學薪酬。
    relic: 一張課程通告
    relic_desc: 一張廳裡的通告，應該寫她名字的地方寫著希爾伯特。
    points:
      p1: 把諾特署名的文稿和提要同時交到克萊因手上，讓他能按期將論文呈交給哥廷根學術團體
      p2: 把本學期由諾特實際授課的記錄和署名論文一併交給系裡，請系裡先為下一輪討論課核定課酬，再隨新申請存檔
    points_fail:
      p1: 名冊上只有呈交人的名字，講義與作者頁沒能對回同一份。會議把論文退到下一次，事務所因同步失敗召回員工。
      p2: 系裡同意有人繼續帶討論課，但依然用原來的排課辦法，沒有經費支付諾特這部分工時。
    shift:
      p1:
        was: 1918 年 7 月 26 日，費利克斯·克萊因在哥廷根的一次會議上呈交《不變變分問題》。印本所署作者是埃米·諾特。
      p2:
        was: 諾特於 1919 年獲任教資格，哥廷根大學記錄她到 1923 年才取得帶少量固定薪酬的教學任務。
        now: 系裡在任教資格重審前先撥了一小筆課酬，按實際開課支付。這個學期願意跟她做題的學生因此有一段固定的時間可來。
        who: noether_gottingen
        bio: 哥廷根的任教規則曾讓諾特的第一份申請受阻。她仍開展研究，後來以一系列論文和自己的課堂培養學生。
    vignettes:
      notice: 冬季學期開課前，{staff}幫工友往佈告欄上釘課表。工友指著一行念：希爾伯特教授，在諾特博士協助下。他說這一行他釘了好幾個學期，進教室講課的一直是那位女博士。
      turnips: 十月，{staff}幫房東太太在後院挖蘿卜。她說城裡流感又起來了，學生公寓空了一半，麵包票她早就不數了，反正也沒什麼可數的。
      snow: 十二月底，{staff}幫數學樓的門房掃臺階上的雪。門房說打完仗回來的學生太多，講堂裡沒座位了，有人站在走廊裡聽。
  boltzmann_duino:
    name: 同一個數，幾種排法
    place: 杜伊諾
    figure: 路德維希·玻爾茲曼
    story: 1877 年，路德維希·玻爾茲曼數出同一種能量分佈可以有多少種排法，把熱的規律和原子的統計聯繫起來，可直到二十世紀初，原子是否真實存在仍有許多人懷疑。1906 年 5 月，他因所謂嚴重的神經衰弱停課，夏天和家人到的里雅斯特附近的杜伊諾度假。9 月 5 日，他在那裡去世，六十二歲。兩年後，讓·佩蘭的布朗運動實驗開始證實愛因斯坦的預言，原子漸漸被人接受。
    story_prose:
      opening:
        - 1906 年夏，的里雅斯特附近的杜伊諾海灣。路德維希·玻爾茲曼和妻子、女兒在這裡度假。將近三十年前，他數出同一種能量分佈可以有多少種排法，把熱的規律和原子連在一起。到這時，還有許多人不信原子真的存在。
        - 史實裡，這年 5 月他因所謂嚴重的神經衰弱停了課，課由斯特凡·邁爾代講。9 月 5 日，他在杜伊諾去世，六十二歲。兩年後，佩蘭的布朗運動實驗開始替原子作證。在這條分支裡，岸邊有晾網的漁夫，沙灘上有數石子的小孩，旅館的女招待每天把浴巾從海邊收回來。
        - 這一趟用得上兩種人：講得清學問、能同他談原子的人，懂醫、帶對了藥、陪得住一個病人的人。
      outcomes:
        all: 九月，回維也納的火車開出杜伊諾。玻爾茲曼靠窗坐著，上衣口袋裡鼓著那幾張算草。
        p2: 九月，回維也納的火車開出杜伊諾。他靠窗坐著，看了一路的海。
        p1: 那個夏天，那幾張算草一直在他的上衣口袋裡。
      none: 杜伊諾的海灣很靜。旅館露臺的桌上，幾張算草被風吹到了地上。
      not_admitted: '{staff}沒能走近那一家人。旅館露臺上的人每天對著海坐著，假期一天天少下去。'
      points:
        p1: 八月初的一個傍晚，玻爾茲曼坐在旅館的露臺上，桌上壓著幾張算草。{staff}拿起一張，從水裡微粒的亂跳講起，講愛因斯坦前一年怎樣算出這種亂跳該走多遠，再過兩年，就會有人在顯微鏡底下照著去量。他聽完沒說話，把那幾張算草疊齊，放進了上衣口袋。起身回房時，他的手一直按在那隻口袋上。
        p2:
          class_learned: '{staff}照醫生的辦法，替他定好每天吃藥和睡覺的鐘點，早晚各診一回脈，白天陪他沿著海邊走一段。八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。'
          else: '{staff}按時給他換上帶來的鎮靜貼片，夜裡守著他入睡，白天陪他沿著海邊走一段。八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。'
      excerpts:
        p2: 八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。
        p1: 他聽完沒說話，把那幾張算草疊齊，放進了上衣口袋。起身回房時，他的手一直按在那隻口袋上。
    relic: 一截粉筆
    relic_desc: 一截用得很短的講課粉筆。
    points:
      p1: 讓他知道，原子的存在過不了幾年就會被實驗證實，他為之爭了半輩子的學說站得住
      p2: 在杜伊諾的假期結束之前，治好他的病，讓他回到維也納
    points_fail:
      p1: 他照舊在懷疑聲裡過完這個夏天，這條分支裡沒有人告訴過他布朗運動的實驗會替原子作證。
      p2: 9 月 5 日照史實發生，這條分支裡他沒有回到維也納的講臺。
    shift:
      p1:
        was: 1906 年 9 月 5 日玻爾茲曼去世時，原子是否真實存在仍有不少物理學家和化學家懷疑；1908 年起佩蘭的布朗運動實驗驗證了愛因斯坦 1905 年的預言，原子才被普遍接受。
        now: 那個夏天他已經知道，原子的事過幾年就會有人用實驗定下來。
      p2:
        was: 1906 年 5 月玻爾茲曼因病停課，課由斯特凡·邁爾代講；同年 9 月 5 日他在杜伊諾度假時去世，終年六十二歲。
        now: '{staff}陪他過了杜伊諾的那個夏天，病一點點緩下來。秋天他帶著家人回到維也納，又站上了講臺，還親眼看到原子被實驗證實。'
        who: boltzmann_duino
        bio: 這條時間線裡，玻爾茲曼 1906 年秋天病好了回到維也納，又教了幾年書，看到了佩蘭的實驗讓原子學說被普遍接受。
    shift_all: 他知道自己的學說站得住，病也好了，秋天回到維也納接著講課。
    vignettes:
      pebbles: 七月，{staff}在海灘上幫漁夫的小兒子數一桶小石子。孩子問，太小、數不清的東西，是不是就不算有。{staff}說沒人數它也在那兒。孩子想了想，又往桶裡扔了一把。
      nets: 七月初，{staff}幫漁夫把晾在岸邊的網收起來。漁夫說這一灣斯洛文尼亞話、意大利話、德國話都聽得到，魚可不管你用哪種話罵它。
      towels: 八月，{staff}幫旅館的女招待把海邊晾乾的浴巾收回來。她說今年海水暖得早，城裡來的客人一住就是一整季，她的手讓鹽水泡得起了皮。
  tesla_wardenclyffe:
    name: 那一行寫著擬建
    place: 長島肖勒姆
    figure: 尼古拉·特斯拉
    story: 1901 年 3 月，J.P. 摩根答應出資十五萬美元，給尼古拉·特斯拉建一座無線電站。建築師斯坦福·懷特設計了長島沃登克里弗的房子，這一年特斯拉為塔和實驗樓幾次寫信給他。9 月工地動工。12 月，馬可尼收到了一個越過大西洋的信號。1902 年 6 月，特斯拉把實驗室搬進磚樓；1903 年 7 月，摩根回信說不再追加款項。1917 年，塔被炸掉。
    relic: 一份圖紙副本
    relic_desc: 一張沃登克里弗圖紙的副本，折了兩道，折角底下有鉛筆寫的日期。
    points:
      p1: 九月收到超支估價後，在沃登克里弗把舊圖及修訂圖分別簽收，護住當年仍能開工的建築
      p2: 請懷特把已能確定的實驗樓工程和仍待換報價的塔身分開給工頭，兩套賬各有一頁
      p3: 請特斯拉帶已經確認的工價向出資人提出分段撥款，讓未來幾個月的基礎工程有獨立的付款約定
    points_fail:
      p1: 包工人只按舊圖估價，沒人能確定接受哪套尺寸，工地取消本季安排，事務所因同步失敗召回員工。
      p2: 一份報價把樓與塔的工錢都合在一欄，後來無法據賬看出哪部分已經承諾。
      p3: 兩部分仍等同一輪籌款。後續遇到缺口時，工人不知道哪些工作能拿到錢。
    shift:
      p1:
        was: 1901 年特斯拉與建築師斯坦福·懷特討論估價和設計。沃登克里弗在當年動工。
      p2:
        was: 沃登克里弗包括實驗樓和塔，在改預算的通信裡能看到多次設計修改。
        now: 工頭在開工前就能把兩部分各自結算，塔的改價也有前一輪可對照。
      p3:
        was: 工程最初得到摩根資助，之後未能取得足夠的後續資金，計劃未按設想完成。
        now: 書面約定先付清已確認的一段基礎工程。往後資金不夠時，工地能結清這部分，並把尚無款項的工作標出來。
        who: tesla_wardenclyffe
        bio: 特斯拉把沃登克里弗設想為無線通信和輸電系統的一環。建設過程還要面對各輪報價、籌款和施工安排。
    vignettes:
      timber: 十月初，{staff}幫一個車夫把一車木板拉上通往工地的沙路，輪子每陷一回，就拿肩膀頂一回後擋板。車夫說路那頭的農戶已經拿這邊的錘子聲給母雞定鐘點了，工地歇工那幾天，雞下蛋下得最勤。
      signal: 十二月中旬，一個男孩揮著報紙從車站跑上來：馬可尼收到了大洋那邊發來的信號。工頭把報紙舉得老遠，問{staff}一個點真能跑那麼遠嗎。{staff}說能。工頭把報紙摺好塞進外套，叫工人接著敲。
      watch: 十二月下旬，{staff}陪守夜人在崖上的木板棚裡坐了一夜，把舊報紙往墻縫裡塞，擋海灣吹來的風。守夜人從一張報紙上念出煤價，說塔蓋這麼高，最好值得這麼漏風。
  schubert_vienna:
    name: 三月那場音樂會的節目單
    place: 維也納
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，弗朗茨·舒伯特在維也納音樂之友協會的會場舉行了一場只演自己作品的公開音樂會，這是他一生唯一的一場。那年秋天，他已在病中，搬進哥哥費迪南德在維登的新住處。10 月 2 日，他寫信給出版人普羅布斯特，推薦最後三首鋼琴奏鳴曲。11 月 19 日，他在那處住所去世，三十一歲。三首奏鳴曲到 1839 年才出版，題獻也換了人。
    relic: 一份歌曲手稿
    relic_desc: 一首運筆很快的歌，墨跡還很深。
    points:
      p1: 把臨時湊到的演奏者和音樂協會的場地約到同一晚，護住舒伯特自己的音樂會
      p2: 把出版問詢變成可交稿的約定，讓舒伯特趕得及為最後三首鋼琴奏鳴曲定下出版與題獻
      p3: 在他搬去哥哥費迪南德家之前，治好纏了他多年的病，讓他熬過那年秋天
    points_fail:
      p1: 出場的人和空出的場地錯了日期，靠朋友幫忙才排成的音樂會取消。行程同步失敗，員工被召回。
      p2: 來信仍停在等回音的階段，三首奏鳴曲在他去世多年後才出版，題獻也換了人。
      p3: 他照舊帶著病在 9 月 1 日搬去哥哥家，11 月 19 日在那裡去世，這條分支與歷史一樣。
    shift:
      p1:
        was: 1828 年 3 月 26 日，舒伯特獲朋友和演奏者協助，在維也納以自己的作品舉辦專場音樂會。
      p2:
        was: 1828 年 10 月 2 日舒伯特致函推薦最後三首奏鳴曲並提出題獻意願，三曲直到 1839 年才刊印。
        now: '{staff}幫舒伯特把三份譜和題獻要求隨交稿清單送出，請出版方先回一封能核對的確認。舒伯特生前收到了確認，題獻隨樂譜保留。'
      p3:
        was: 1828 年 9 月 1 日，病中的舒伯特搬進哥哥費迪南德在維登一幢新房子裡的住處，11 月 19 日在那裡去世，年三十一歲。
        now: '{staff}帶來的藥治好了他的病。那年十一月他沒有病倒，此後多年仍在維也納作曲。寫了什麼，這一趟的記錄裡沒有。'
        who: schubert_vienna
        bio: 這條時間線裡，舒伯特三十一歲那年秋天病好了，又活了許多年，在維也納繼續作曲。
    vignettes:
      chairs: 3 月 25 日晚上，{staff}幫協會的門房在會場裡一排排擺椅子，擺到椅子用完了，名單上的名字還沒唸完。門房說他還沒見過這麼多人肯擠進一間屋子，聽一個還活著的人的曲子。
      tavern: 七月的一個傍晚，{staff}坐在城墻外的一處葡萄酒園裡，聽一個拉琴的和一個彈吉他的一支接一支地奏圓舞曲。拉琴的在兩支曲子中間停下來說，這麼熱的天，唱到第二段弦就鬆了，唯一的辦法是拉快點。
      stairs: 九月初，{staff}幫維登一幢新房子的女房東把幾筐東西搬上樓。墻上的灰泥還有石灰味。她說樓梯間新得會回嘴，在一樓說一句，三樓能聽見兩遍。
  keats_rome:
    name: 臺階旁的小屋
    place: 羅馬
    figure: 約翰·濟慈
    story: 1820 年 11 月，患肺結核的約翰·濟慈與畫家約瑟夫·塞文來到羅馬，住進西班牙臺階旁的西班牙廣場 26 號。1821 年 2 月 23 日夜裡他在那裡去世，2 月 26 日葬在塞斯提烏斯金字塔旁的墓園。照他的意思，墓碑上沒有他的名字。
    story_prose:
      opening:
        - 1820 年 11 月中旬，羅馬。二十五歲的詩人約翰·濟慈患著肺結核，和畫家約瑟夫·塞文住進西班牙臺階腳下、西班牙廣場 26 號的二樓。他在短短幾年裡寫出了包括頌詩在內的主要作品，這是他的最後一個冬天。
        - 史實裡，醫生詹姆斯·克拉克給他定下飢餓療法，每天一條鳳尾魚、一片麵包，還一次次給他放血；塞文一個人照看他，錢很快斷了，夜裡也睡不成；他到最後都相信自己沒有留下什麼，照他的意思，墓碑上不刻名字。在這條分支裡，臺階腳下有個賣紫羅蘭的賣花人，樓梯上有個常問起樓上病人的鄰居。
        - 這一趟用得上幾種人：懂醫護、攔得住放血的人，或帶著一本現代醫護手冊的人；守得住長夜、自己也熬得住的人，帶著睡眠調節器也行；讀過書、懂詩的人，說得出他的詩以後的樣子。
      outcomes:
        all: 2 月 23 日深夜，濟慈去世，塞文守在床邊。最後那幾個月，他吃得上熱湯和麵包，也聽人說過，他的詩以後會一直有人讀。三天後，他葬在塞斯提烏斯金字塔旁的墓園，墓碑上照他的意思沒有刻名字。
        p3: 2 月 26 日，他葬在塞斯提烏斯金字塔旁的墓園，墓碑上照他的意思沒有刻名字。西班牙臺階旁那間屋子後來留了下來，窗還朝著廣場。
        p2: 最後那幾個月，桌上不再只有一條鳳尾魚和一片麵包。1821 年 2 月 26 日，他葬在塞斯提烏斯金字塔旁的墓園。
        p1: 2 月 23 日深夜，濟慈去世，塞文一直守在床邊。五十多年後，塞文也葬進了那片墓園，就在濟慈旁邊。
      none: 一月裡，塞文熬垮了，倒在隔壁屋裡。2 月 23 日深夜，桌上還擺著那一片麵包和一條鳳尾魚，床邊的椅子空著。
      desync: 一月裡，塞文倒下了。{staff}被召回時，他和衣躺在隔壁屋裡，那封寫了一半的信還攤在桌上，墨水瓶沒有蓋。
      not_admitted: '{staff}沒能進這棟樓，只在臺階腳下的船形泉邊打了幾回水。賣花人問起樓上是誰病了，{staff}答不上來，二樓那扇窗一直關著。'
      points:
        p2:
          class_medical: 12 月 9 日早上，濟慈咳出了兩杯血。克拉克醫生來了，挽起他的袖子，說要再放八盎司；桌上擺著這一天的飯，一條鳳尾魚，一片麵包。{staff}懂醫護，按住病人的手腕，說這樣放下去人撐不住，又把他這幾天吃下去的東西一樣樣報給醫生聽，醫生把刀收了回去。那天中午，塞文端上來一碗熱湯和一塊麵包。濟慈靠在枕頭上，一勺一勺喝完了，把空碗遞回給他。
          else: 12 月 9 日早上，濟慈咳出了兩杯血。克拉克醫生來了，挽起他的袖子，說要再放八盎司；桌上擺著這一天的飯，一條鳳尾魚，一片麵包。{staff}翻開帶來的現代醫護手冊，指著書頁上的一段唸給醫生聽，又把病人這幾天吃下去的東西一樣樣寫在紙上，攤在醫生面前，醫生把刀收了回去。那天中午，塞文端上來一碗熱湯和一塊麵包。濟慈靠在枕頭上，一勺一勺喝完了，把空碗遞回給他。
        p1:
          class_medical: 1 月 15 日，塞文在信裡寫，銀行把匯票退了回來，手裡的錢只夠再付一回房租；濟慈不讓他離開視線，他出不了門畫畫掙錢，夜裡也沒睡過一個整覺。{staff}懂護理，接過了夜裡的班，隔一陣扶濟慈起來咳，替他擦汗、換枕巾，天快亮時才把燈捻小。塞文和衣睡在隔壁，靴子也沒脫。早上他醒過來，先推開門朝床上看了一眼，又回去把那封沒寫完的信寫完了。
          else: 1 月 15 日，塞文在信裡寫，銀行把匯票退了回來，手裡的錢只夠再付一回房租；濟慈不讓他離開視線，他出不了門畫畫掙錢，夜裡也沒睡過一個整覺。{staff}守得住夜，搬一把椅子坐在床邊，讓塞文去隔壁睡，病人一翻身，就起來看一眼。塞文和衣睡在隔壁，靴子也沒脫。早上他醒過來，先推開門朝床上看了一眼，又回去把那封沒寫完的信寫完了。
        p3:
          class_lettered: 二月中，濟慈已經下不了床。他還是覺得自己什麼也沒留下，照他的意思，墓碑上不要刻名字。{staff}讀過他的書，坐到床邊，說起他的幾首頌詩：以後會有人一遍遍地讀、一句句地背，羅馬這間屋子也會一直為他留著。濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
          class_teaching: 二月中，濟慈已經下不了床。他還是覺得自己什麼也沒留下，照他的意思，墓碑上不要刻名字。{staff}教過書，坐到床邊，說起以後的課堂上，會有學生把他的頌詩一句句背到最後一行，羅馬這間屋子也會一直為他留著。濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
          else: 二月中，濟慈已經下不了床。他還是覺得自己什麼也沒留下，照他的意思，墓碑上不要刻名字。{staff}在床邊坐下，慢慢說起他的詩以後的事：會有人一遍遍地讀、一句句地背，羅馬這間屋子也會一直為他留著。濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
      excerpts:
        p3: 濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
        p2: 那天中午，塞文端上來一碗熱湯和一塊麵包。濟慈靠在枕頭上，一勺一勺喝完了，把空碗遞回給他。
        p1: 塞文和衣睡在隔壁，靴子也沒脫。早上他醒過來，先推開門朝床上看了一眼，又回去把那封沒寫完的信寫完了。
    relic: 一朵壓乾的紫羅蘭
    relic_desc: 夾在書裡的一朵乾花。
    points:
      p1: 護住塞文，錢斷了、人熬垮了也讓他守在濟慈身邊到最後
