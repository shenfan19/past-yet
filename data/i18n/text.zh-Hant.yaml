        p3:
          class_seafaring: 九月初，測量隊到了西別，照原先的打算，該在這裡回頭了。秋風一天比一天硬，往東的岸還長著，沒有人量過。{staff}在海上看慣了天和潮水，前頭哪處岬角好繞、潮水幾時退，一樣一樣指給他看，領著隊伍貼著岸往前走。測量隊越過西別，又往前量了一段。漁夫站在礁石上，指著岸拐彎的地方，伊能忠敬在那裡停下來，多測了一次方位。回程的頭一夜，他把多出來的那張圖攤在膝上，用指頭沿著那截海岸慢慢描了一遍。
