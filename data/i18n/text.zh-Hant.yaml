        p2:
          class_lettered: 9 月底，懷特事務所又寄來一份報價，樓和塔的工錢合在一欄裡。{staff}管過文書，把通信裡已經說定的實驗樓工程一項項抄出來，另起一頁，塔身那幾項還等著重新估價，單列在後面一頁，兩頁一起寄回去請懷特過目。回信來時，工頭把兩頁賬分別釘在工棚的兩面牆上。他站在中間看了看，在實驗樓那一頁的底下畫了一道線。
