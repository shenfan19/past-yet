  vermeer_delft:
    name: 負債的畫家
    place: 代爾夫特
    figure: 約翰內斯·維米爾
    story: 1672 年戰事以後，約翰內斯·維米爾的畫幾乎賣不出去，1675 年 7 月他去阿姆斯特丹借了一千荷蘭盾。據他的遺孀後來陳述，那年 12 月他在一天半裡由好好的人到了去世；12 月 15 日他葬在代爾夫特，四十三歲，留下十一個孩子。1676 年初，卡塔琳娜·博爾內斯把他的兩幅畫交給麵包商抵麵包錢，2 月 24 日又把《繪畫藝術》轉到母親瑪麗亞·廷斯名下。2 月 29 日，公證人來家裡清點遺產；4 月，她請求高等法院免去她的債務。
    story_prose:
      opening:
        - 1675 年 12 月初，代爾夫特老朗恩代克街。四十三歲的畫家約翰內斯·維米爾和妻子卡塔琳娜·博爾內斯、十一個孩子住在這裡。他畫光線柔和的安靜屋子，留到今天的畫只有四十來幅。1672 年開戰以後畫市垮了，他自己的畫幾乎賣不出去，買來經手的別家畫作也只能壓在手裡；這年 7 月，他去阿姆斯特丹借了一千荷蘭盾。
        - 史實裡，據卡塔琳娜後來的陳述，他被孩子和債務壓著，在一天半裡由好好的人到了去世，12 月 15 日下葬。第二年初，她把他的兩幅畫交給麵包商抵三年的麵包錢，2 月 24 日把畫室裡那幅《繪畫藝術》轉到母親瑪麗亞·廷斯名下，4 月請求高等法院免去她的債。此後將近兩百年，他的名字幾乎被人忘了。在這條分支裡，有個送麵包不收錢、只在小本子上畫一道的夥計，有個畫框鋪的師傅，集市上有個賣泥炭的女人。
        - 這一趟用得上幾種人：管過檔案、做古董買賣或修過畫的人，會畫畫、做過校對或翻譯又細心的人，或者守得住夜、有條理、意志硬的人，護得住畫室裡那幅大畫；做過買賣、手氣不壞的人，或者能說會道、在市井裡混得開的人，把壓在手裡的畫賣出去；懂畫、心細或心善的人，說得出這些畫以後的樣子；當醫生、意志硬的人，懂醫護、帶著情緒穩定貼片的人，或者帶著納米醫療箱的人，守得住十二月中旬那一天半。
      outcomes:
        all: 那個冬天，維米爾沒有倒下。正月裡一個晴天，他又爬上樓去畫畫，那幅大畫還掛在畫室的牆上，廚房櫃子裡收著一小包用布裹著的錢。
        p4: 那個十二月過去了，維米爾沒有倒下。正月裡一個晴天，他又爬上樓，把畫架挪到了窗前。
        p2: 12 月 15 日，維米爾葬在代爾夫特，四十三歲。那個月賣畫得來的錢，卡塔琳娜用布包著，收在廚房的櫃子裡。
        p3: 12 月 15 日，維米爾葬在代爾夫特，四十三歲。畫室裡的畫架空著，調色板擱在一邊，上面那一點新調的藍已經乾了。
        p1: 12 月 15 日，維米爾葬在代爾夫特，四十三歲，留下十一個孩子。第二年二月，卡塔琳娜把畫室裡那幅大畫轉到了母親名下。
      none: 12 月 15 日，維米爾葬在代爾夫特岳母早年買下的墓穴裡，四十三歲。此後將近兩百年，很少有人叫得出他的名字。
      desync: 12 月 3 日，債主差來的人對著清單點了點頭，叫人把牆邊那幅大畫從釘子上取下來。{staff}被召回時，兩個人正抬著它下樓，畫上那片藍在樓梯拐角一晃。
      not_admitted: '{staff}沒能進老朗恩代克街那戶人家，只在集市廣場邊站過幾個早上。那戶人家的窗板總是關著一半，有個孩子趴在窗臺上，數著過往的麵包籃子。'
      points:
        p1:
          trait_vigil: 12 月 3 日上午，一個債主差來的人拿著一張清單進了畫室，說年底前要拿幾幅畫去抵賬，手指著牆邊那幅大畫：畫裡一個畫家背對著人，正在畫一個穿藍衣、捧著書和號角的女子。{staff}守得住，一連兩夜睡在畫室外的樓梯口，白天把來人的清單一行行對過：能抵賬的是店裡經手的那些別家畫作，這一幅不在裡面。來人捲起清單走了。維米爾在那幅畫前站了一會兒，伸手把畫框底邊的一層灰抹掉了。
          trait_methodical: 12 月 3 日上午，一個債主差來的人拿著一張清單進了畫室，說年底前要拿幾幅畫去抵賬，手指著牆邊那幅大畫：畫裡一個畫家背對著人，正在畫一個穿藍衣、捧著書和號角的女子。{staff}有條理，把來人的清單一行行對過，又把畫室裡每幅畫的來歷記成一頁：能抵賬的是店裡經手的那些別家畫作，這一幅不在裡面。來人捲起清單走了。維米爾在那幅畫前站了一會兒，伸手把畫框底邊的一層灰抹掉了。
          else: 12 月 3 日上午，一個債主差來的人拿著一張清單進了畫室，說年底前要拿幾幅畫去抵賬，手指著牆邊那幅大畫：畫裡一個畫家背對著人，正在畫一個穿藍衣、捧著書和號角的女子。{staff}跟畫和契據打過交道，把來人的清單一行行對過，指給他看：能抵賬的是店裡經手的那些別家畫作，這一幅不在裡面。來人捲起清單走了。維米爾在那幅畫前站了一會兒，伸手把畫框底邊的一層灰抹掉了。
        p2:
          class_trade: 12 月 6 日是集市日。幾幅別家的畫用布包著，靠在店裡的門後已經好幾年了。{staff}做過買賣，把畫一幅幅抬到窗前的光裡，跟來看畫的兩個商人從早談到中午，價錢讓了一點，又一點不讓。下午，三幅畫用麻繩捆好，被人扛出了門。卡塔琳娜把錢在廚房桌上數了兩遍，撥出一小摞用布包好，放進了圍裙口袋。
          else: 12 月 6 日是集市日。幾幅別家的畫用布包著，靠在店裡的門後已經好幾年了。{staff}能說會道，在集市上轉了一圈，領回來兩個看畫的商人，把畫一幅幅抬到窗前的光裡，跟他們從早談到中午。下午，三幅畫用麻繩捆好，被人扛出了門。卡塔琳娜把錢在廚房桌上數了兩遍，撥出一小摞用布包好，放進了圍裙口袋。
        p3:
          trait_artistic: 12 月 9 日下午，畫室裡很靜。維米爾坐在畫架前，手裡的筆很久沒有落下去。{staff}自己也有一雙看畫的眼睛，在他身後站了一會兒，告訴他，這些安靜的屋子以後會有人一幅一幅找出來，認回來，掛在許多城市裡。維米爾沒有回頭。他拿起調色板，用刮刀把上面一點乾了的藍刮掉，又低頭調起了顏色。
