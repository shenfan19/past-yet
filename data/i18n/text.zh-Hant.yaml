          else: 二月中，濟慈已經下不了床。他還是覺得自己什麼也沒留下，照他的意思，墓碑上不要刻名字。{staff}在床邊坐下，慢慢說起他的詩以後的事：會有人一遍遍地讀、一句句地背，羅馬這間屋子也會一直為他留著。濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
      excerpts:
