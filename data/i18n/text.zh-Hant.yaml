        s_fan: '{date}，辦事員把一本剛印出來的《民族主義》遞給沈凡，說屋裡的人一人一本。沈凡先翻到序，看了落款的日子。'
        s_samuel: '{date}，辦事員把一本剛印出來的《民族主義》遞給塞繆爾。他問這是第幾版，辦事員說，頭一版。'
      errand_frail:
        s_fan: '{date}，沈凡爬幾級樓梯就喘，送不了稿。他坐在謄清的屋子門口，數一份稿子來回走了幾趟。'
        s_somchai: '{date}，頌猜爬幾級樓梯就喘，送不了稿。他坐在謄清的屋子門口，看貼著簽注條的稿子進進出出。'
        s_samuel: '{date}，塞繆爾的腸胃又鬧了幾天，爬幾級樓梯就喘。他坐在謄清的屋子門口，把每一趟送稿的時刻記了下來。'
      homesick_may:
        s_fan: '{date}，沒有記載的一個月。沈凡在本子上畫正字，畫滿了一百天，又在旁邊算了一遍，事務所那邊只過了三天多。'
        s_guilan: '{date}，沒有記載的一個月。桂蘭數著日子，家裡的辣椒這時候該下地了。事務所那邊只過了三天多。'
        s_somchai: '{date}，沒有記載的一個月。頌猜還想親眼看一次雪，廣州的五月沒有雪。事務所那邊只過了三天多。'
        s_carlos: '{date}，沒有記載的一個月。卡洛斯每天三點就醒，這裡沒有他的爐子，他站在別人的灶邊看了一早上。事務所那邊只過了三天多。'
        s_samuel: '{date}，沒有記載的一個月，對一個記者最難熬。塞繆爾在本子上畫正字，畫滿了一百天。事務所那邊只過了三天多。'
        s_amara: '{date}，沒有記載的一個月。阿瑪拉算了算，這一百天裡病房該添了多少個孩子。事務所那邊只過了三天多。'
        s_jeanluc: '{date}，沒有記載的一個月。讓-呂克像記航海日誌一樣一天記一行，記滿了一百天。事務所那邊只過了三天多。'
      shipai_frail:
        s_fan: '{date}，沈凡知道城東的石牌以後會蓋起什麼。路太遠，他走不到。'
        s_somchai: '{date}，頌猜知道城東的石牌以後是什麼樣子。路太遠，他走不到。'
        s_samuel: '{date}，塞繆爾知道城東的石牌以後是什麼樣子，那會是一條好稿子。路太遠，他走不到。'
      last_seat:
        s_fan: '{date}，沈凡坐在老位置上聽完了這一講，本子上記的場次停在十六。散場後他多坐了一會兒。'
        s_guilan: '{date}，桂蘭坐在老位置上聽完了這一講。散場後她沒有馬上走，把長凳一條一條擺齊了。'
        s_somchai: '{date}，頌猜坐在老位置上聽完了這一講。散場後他多坐了一會兒，像在寺裡等最後一聲鐘。'
        s_samuel: '{date}，塞繆爾坐在老位置上記完了這一講。他知道這是最後一講，本子上只寫了場次，沒有寫最後兩個字。'
        s_amara: '{date}，阿瑪拉坐在老位置上聽完了這一講。散場後她多坐了一會兒，等最後一個人走出門。'
        s_jeanluc: '{date}，讓-呂克站在老位置上聽完了這一講。散場後他最後一個離開，像船長最後一個下船。'
      records_shut:
        s_guilan: '{date}，桂蘭只念到三年級，抄名冊插不上手。她把三所學校的門房都認熟了，誰在哪裡，問她比翻名冊快。'
        s_carlos: '{date}，卡洛斯只會寫自己的名字，抄名冊插不上手。他把三所學校的門房都認熟了，誰在哪裡，問他比翻名冊快。'
      sunday_sit:
        s_guilan: '{date}，桂蘭在禮堂後排坐下，膝蓋不好，卻從開講坐到了散場。臺上的話她沒全聽懂，旁邊的學生渴了，她把自己的水遞了過去。'
        s_somchai: '{date}，頌猜在寺裡聽了二十年講經，在禮堂後排一坐到底。散場時他問旁邊的學生最近在讀什麼。'
        s_jeanluc: '{date}，讓-呂克腰不好，偏要站著聽，在禮堂後排從開講站到了散場。'
      pamphlet:
        s_guilan: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。桂蘭隔著窗看了一眼，封面上的字她認得兩個。'
        s_somchai: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。頌猜隔著窗看了一眼封面。他知道這本書後來印了多少，只問辦事員讀到哪裡了。'
        s_amara: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。阿瑪拉隔著窗看了一眼，輕輕哼起歌來。'
        s_jeanluc: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。讓-呂克隔著窗看了一眼封面。'
      errand:
        s_guilan: '{date}，貼著簽注條的講稿從謄清的屋子裡進進出出。桂蘭在門外擇菜，誰出來都問一句吃了沒有。'
        s_amara: '{date}，貼著簽注條的講稿從謄清的屋子裡進進出出。阿瑪拉在門外，只看得見送稿人的背影，聽腳步就知道那人趕得很急。'
        s_jeanluc: '{date}，貼著簽注條的講稿從謄清的屋子裡進進出出。讓-呂克在門外教門房的孩子打繩結，只看得見送稿人的背影。'
      shipai_reached:
        s_guilan: '{date}，桂蘭膝蓋不好，還是一步一步走到了石牌。那裡只有田，她蹲下來捏了一把土，說這地種得出東西。'
        s_carlos: '{date}，卡洛斯推著車出城往東，走到了石牌，回來說那裡只有田。他知道那裡以後會蓋起一所大學，還是說，只有田。'
        s_amara: '{date}，阿瑪拉出城往東，走到了石牌。她知道這裡以後是什麼樣子，站了很久，把眼前的樣子畫了下來，畫得很慢。'
      sunday_stall:
        s_carlos: '{date}，卡洛斯聽不懂裡面講什麼，在禮堂門口支起爐子烤麵包。散場時人湧出來，麵包一會兒就賣完了，照老習慣又賣便宜了。'
      pamphlet_traded:
        s_carlos: '{date}，卡洛斯拿一爐麵包換了一本剛印出來的《民族主義》。他自己讀不了，說帶回去給家裡想接手麵包店的那個孩子。'
      errand_carried:
        s_carlos: '{date}，這條分支裡，被叫去送稿的人有一回是卡洛斯。一疊貼著簽注條的紙，他一個字也不認得，一張也沒弄皺。'
      last_stall:
        s_carlos: '{date}，卡洛斯多烤了一爐。他知道以後的星期天，這扇門口不會再有這麼多人，剩下的麵包都送了出去。'
      records_begun:
        s_amara: '{date}，阿瑪拉開始抄三所學校的名冊。書面的東西她一向吃力，抄一行，請辦事員對一行。'
      spoiler_said:
        s_jeanluc: '{date}，讓-呂克對一位抄寫的辦事員說，兩年以後這所學校會改用孫先生的名字，嗓門一點沒提高。辦事員頭也沒抬，說先生人還在，哪有這樣起校名的。'
      shipai_walk:
        s_jeanluc: '{date}，讓-呂克聽說新校址選在城東的石牌。他的膝蓋走不了那麼遠，在碼頭上朝東望了一陣。'
    name: 廣州 1924
    short: 廣州
    place_name: 廣州，高等師範的禮堂
    tags:
      - thought
