    shift:
      p1:
        was: 1589 年許蘭雪軒去世後，許筠後來以孃家留存的稿件整理她的作品。
      p2:
        was: 1589 年許蘭雪軒去世後，弟弟許筠編選了她的詩。1597 年選本和 1608 年刊本的詩句有不同版本。
        now: 許蘭雪軒在願意傳閱的幾首詩上署名。後來家人編集時，仍把她親自選出的這些篇目放在一起。
        who: heo_nanseolheon_hanyang
        bio: 許蘭雪軒生前定下了一小組願意傳閱的詩。親人整理她的遺稿時保留了這個次序。
    vignettes:
      binding: 抄寫人把練筆的紙夾在其他頁裡。你對過兩個題頭，另折了一個紙套裝練抄稿。還有一頁看不準，留散著讓他再查。哪首詩最後印進了書，你在這趟看不到。
      name: 你知道有些詩以後會傳到離這戶人家很遠的地方。抄寫人要遞出去一張沒題頭的練抄稿，你請他把題頭一同謄下。送出門的紙多了一張帶署名的。你用空白紙條夾住自己讀到的位置，木刻本還要等許多年。
      fold: 你把散頁套起來，沒讓摺痕壓到字，再在多出的紙套上標記有一頁還缺題目。帶走的是這條提醒，詩頁留在屋裡。你離開以後，那部詩集才會編成。
  ghalib_delhi:
    name: 先聽見韻腳，再去翻詩集
    place: 德里
    figure: 迦利布
    story: 這趟去德里時，迦利布的烏爾都語詩集已於 1841 年刊印。讀者可以按加扎勒的韻腳、疊句結尾來翻找。
    story_prose:
      opening:
        - 德里書鋪裡，有人一路念著聽過的詩來找刊本，只記得尾字。賣書人請你再聽一回，把聽清的韻腳和疊句寫到一張紙上。他要拿著紙條去翻書。
        - 史實裡，迦利布的烏爾都語詩集已有刊本。他受託編寫帖木兒王朝史，第一卷刊行，續卷沒有寫成。這次能幫他把後幾朝的材料單獨排好，讓他交卷以後可以接著寫。
        - 擅長對照異名和年代的員工可以按朝次分紙。懂不同文體的人還可以幫忙識別哪一頁是引詩，哪一頁才是本朝記錄。
      points:
        p1: 迦利布從紙堆裡抽出一張，叫你讀末行。那頁看著像一段史文，末行卻跟頁邊抄的韻句相連。你把引用出處寫在包紙上，從待排序的幾頁裡抽走它，再把胡馬雍之後的材料另立一冊。迦利布試翻到空白處，寫下了續卷的第一行。
      outcomes:
        all: 等第一卷交出去，旁邊已有一冊能接上去的紙。你走的時候，第二捲開了頭，下面還空著許多頁。
        p1: 後幾朝的資料有了自己的冊子。迦利布可以繼續起草，往後的篇章仍要由他一頁頁寫。
      none: 賣書人照紙條找到了詩句。續卷的材料仍積在原來的紙堆裡，刊行的第一卷之後沒有完稿。
      not_admitted: 紙條送進書鋪，店裡無人識得來客。半開的賬冊下面，還壓著那幾張沒交出的材料。
      excerpts:
        p1: 你把引用出處寫在包紙上，從待排序的幾頁裡抽走它，再把胡馬雍之後的材料另立一冊。迦利布試翻到空白處，寫下了續卷的第一行。
    relic: 一頁格扎勒詩稿
    relic_desc: 一頁他親筆寫的烏爾都語詩，有修改的痕跡。
    points:
      p1: 幫他把國王託付的帖木兒王朝史後半部的材料收齊理好，讓他寫完上半部以後接著寫下去
    points_fail:
      p1: 第一卷仍然寫成。原先計劃的第二卷照史實沒有留下完稿。
    shift:
      p1:
        was: 1850 年 7 月 4 日，巴哈杜爾·沙請迦利布撰寫帖木兒王朝史；上半部《正午的太陽》1854 至 1855 年間刊行，寫到胡馬雍去世為止，他計劃中的續篇沒有寫成。
        now: 後幾朝的材料在迦利布手裡單獨成冊。交了第一卷以後，他能拿出這一冊，開始起草第二卷。
        who: ghalib_delhi
        bio: 這條分支裡，迦利布交了第一卷以後，接著起草了第二卷。
    vignettes:
      refrain: 賣書人記得詩裡的意象，卻一直翻錯地方。你問他反覆聽到的是什麼詞。他念出結尾，你才在刊本里翻到對應的一組。你記下一個頁碼。最早把這一句念進店裡的人是誰，他仍說不上來。
      future: 你告訴賣書人，以後的讀者會把幾個版本擺在一起對。他問那能不能幫他找到今天這一句。你在他的條子上補了版本年份，又標出結尾。等他有另一本可核對時，你已經走了。
      listen: 你把結尾念給賣書人聽，唸到兩個人都認得。他把條子夾進書裡對應的一段。你能帶回記得住的那幾個字，整句卻已經有些想不起來了。
  banneker_maryland:
    name: 要一起寄出的兩件東西
    place: 馬里蘭
    figure: 本傑明·班納克
    story: 1791年8月19日，本傑明·班納克致信託馬斯·傑斐遜，隨信送去下一年的歷書手稿，質問種族偏見與奴隸制度。
    story_prose:
      opening:
        - 印坊的信使和要離開的郵差都在門口。班納克把磨坊附近的地名寫上信，又把曆書翻到末頁，確認親筆的那份還在桌上。信裡有些話只寄這一次。
        - 史實裡，班納克在 1791 年 8 月 19 日給傑斐遜寫信，隨信寄了親筆年曆，質問黑人為何被剝奪自由。1806 年住宅失火，他的大部分遺物損毀，至少一本手寫筆記倖存。分支裡還能另存他願讓人讀的草算和觀測筆記。
        - 讓能核對送印稿和親筆稿的人守著兩個紙包。若能說服印坊為家外另存的一份留出時間，讓班納克自己挑要抄的頁。
      points:
        p1: 理事把兩份稿都翻到七月，看見差不多相同的一列數。你請班納克指認給傑斐遜的那份，再請信使當面念出封上的收件人。信和親筆年曆捆在同一根細繩裡；給印坊的紙平放在櫃上。郵差讀完地址，才把手伸向繩結。
        p2: 抄寫人遞來一個很厚的紙套。班納克從底下抽出幾頁，留下有日期、能核查的觀測和草算。他讓你讀一處改過的數，看抄本有沒有把舊數也算進去。那份副稿送到住家外時，保管人照著第一頁讀了一遍日期。
      outcomes:
        all: 傑斐遜的回信確認兩個東西都收到。多年後火燒到屋裡，屋外那份副稿仍留著班納克準人抄下的筆記。
        p1: 信和曆書一起寄出。更多草算仍留在家裡，後來隨住宅裡的許多物件一起損毀。
        p2: 住家外已有一份核過的副稿。郵包出了差錯，員工短記只留著出門前在副稿上看見的日期。
      none: 屋裡找不到分開標記的紙包。後來能讀到的草算，仍只有原先僥倖留存的部分。
      not_admitted: 印坊的人關上箱子前要核來客的名字。沒認出來，他把紙包放回班納克的門邊。
      desync: 印坊從桌上取走了唯一能隨信寄出的歷書。信件失去史有的附件，事務所召回員工。
      excerpts:
        p1: 信和親筆年曆捆在同一根細繩裡；給印坊的紙平放在櫃上。郵差讀完地址，才把手伸向繩結。
        p2: 他讓你讀一處改過的數，看抄本有沒有把舊數也算進去。那份副稿送到住家外時，保管人照著第一頁讀了一遍日期。
    relic: 一張留底的信包籤
    relic_desc: 留底籤，寫明裡頭有曆書，也有隨附的信。
    points:
      p1: 替班納克隔開給印坊的底稿，護住他要隨信寄出的那份親筆年曆
      p2: 請班納克選定願意交人抄錄的底稿，把核過的一份交到住家以外的地方保存
    points_fail:
      p1: 唯一能隨信寄出的抄本被印坊帶走，信裡沒有年曆可供查驗。這條分支與史實脫節，員工當天被召回。
      p2: 草算依舊集中留在家中，多數手稿和住宅一起燒失。
    shift:
      p1:
        was: 1791 年 8 月 19 日，班納克寫信給傑斐遜，並隨信附上一份親筆抄寫的年曆。
      p2:
        was: 1806 年班納克下葬當天，他的住宅失火，許多手稿隨之燒燬。
        now: '{staff}請班納克指定哪幾冊可以交給外地保管，再請印坊替他復抄。後來家中失火，校過的觀測和推算還有一份可查。'
        who: banneker_maryland
        bio: 除了原本留存的筆記，又有一部分班納克的工作底稿由於另存而傳了下來。
    vignettes:
      packet: 蕾切爾看見首頁排著月份，就要給包裹寫上算表。你把信擱在邊上，請她讀過收件地址，再把簽寫完。她用一根線把兩件包在一起。表隨寄件人署名上路，他要說的話也跟著去。
      handoff: 艾薩克的挎包還能塞進一個薄信包，信上的封蠟還軟著。你撐開包紙，讓他插一片摺紙，把信和表隔開。他兩件都帶上了。你多站了一會兒，看桌上信包留下的一小塊空地。
      reply: 你知道很快會有回信。艾薩克問，這樣信裡說的事就能解決嗎？你抄下寄出日期，把回信那格照原樣留空。信包已經上路，還沒有任何承諾回來。
  mitchell_nantucket:
    name: 雲過來以前，先標下這塊天
    place: 楠塔基特
    figure: 瑪麗亞·米切爾
    story: 《瑪麗亞·米切爾生平、書信與日記》所錄的書信記載，她在 1847 年 10 月 1 日於楠塔基特發現一顆需用望遠鏡觀測的彗星。父親記下發現，並托首班去大陸的郵船寄信給哈佛天文臺主任。
    story_prose:
      opening:
        - 楠塔基特的屋頂上有一陣風，瑪麗亞·米切爾把便箋壓到燈座下面。她要記下看見天體的方位和時刻。父親在下層等著聽她讀一遍；風雨還攔著郵船。
        - 1847 年 10 月 1 日，米切爾發現一顆彗星。她父親給劍橋的威廉·邦德寫信，發現後來經交涉獲頒丹麥金牌。這裡可以先確保通知搭上首班離島郵件，再寫一份給丹麥方面指定的人。
        - 能認讀星圖或讀準時刻的人可幫忙核通知，熟悉郵務的人可辦兩處收件地址。
      points:
        p1: 瑪麗亞念出時刻，父親問一遍是沿哪顆亮星找上去的。你把指示重讀給他聽，發現寫給邦德的通知還少了日期。墨剛乾，碼頭那邊就傳來準備裝船的聲音。郵差把第一封信塞進袋裡時，日期已經能讀清。
        p2: 第二張紙上有同樣的觀測時刻，信封卻不能照抄頭一份。你把公告所列的收件人讀給郵差聽，讓他給這封信另記一條去向。瑪麗亞在邊上等他寫完，才收起她那份觀測。兩封都出了島，只有一封要過大西洋。
      outcomes:
        all: 丹麥收件人收到按例填寫的發現通報。到評獎時，米切爾拿得出首次寄送的記錄，不必另請人補陳經過。
        p1: 劍橋收到首班郵船帶來的發現通知。關於金牌的通信還要另起一輪。
        p2: 另一個收件地址已經核對。通向劍橋的首班郵件出了差錯，這個分支無法完整保留。
      none: 屋頂的便箋仍在家中。法律和獎勵都不會隨著一條未寄的觀測自己改變。
      not_admitted: 家人從樓下問來客是誰。便箋留在屋頂，你只能聽見郵差從街上走過去。
      desync: 碼頭那封給邦德的通知沒趕上首班郵件。事務所按脫節召回，屋裡的原始觀測還在。
      excerpts:
        p1: 墨剛乾，碼頭那邊就傳來準備裝船的聲音。郵差把第一封信塞進袋裡時，日期已經能讀清。
        p2: 瑪麗亞在邊上等他寫完，才收起她那份觀測。兩封都出了島，只有一封要過大西洋。
    relic: 一架小望遠鏡
    relic_desc: 一架小小的黃銅望遠鏡，鏡筒上有海鹽的痕跡。
    points:
      p1: 把家人寫好日期的發現通知備齊，趕上首班送往劍橋天文臺的離島郵件
      p2: 趕在第一班郵船開走前，再寄一份給丹麥方面指定的收件人，免去米切爾後來為金牌補申
    points_fail:
      p1: 觀測記錄仍在家中，但通知沒趕上首班郵船。這條分支與史實脫節，員工被召回。
      p2: 通知只寄給天文臺，評獎人因未按要求及時通報而不能按例授獎。
    shift:
      p1:
        was: 1847 年 10 月 3 日，米切爾的父親寫信把 1 日的發現告知劍橋天文臺，信隨發現後首班離島郵件寄出。
      p2:
        was: 1848 年的獎項通信記載，發現消息沒有按規定立即報給指定收件人。丹麥方面另行審理後，米切爾獲得金牌。
        now: '{staff}查清通知應送何處，幫家人把另一個寫好地址的信封趕上同一班船。評獎人已有在期限內通報的記錄，可以按例審理。'
        who: mitchell_nantucket
        bio: 米切爾憑按期送到的發現報告獲得認可。她開始在自己的記錄裡同時保留觀測日、發件日和收件人。
    vignettes:
      field: 幫工只畫了一個淡點。你問他下次靠什麼把鏡頭轉回這裡。雲遮上來前，他補了兩顆星和一個方向。你把這些抄走，還沒有第二次位置可以對照。
      post: 你知道消息得送出海島。幫工還沒寫清看見的東西，就想把發現先記上去。你把日期和星野另寫一張，留下一行等複核。紙包送去岸邊時，那一行仍空著。
      cloud: 雲擋住淡點時，你在原地拿著草圖等。摺紙前你圈一顆熟星，即使淡點不見了，也能從它找回這片天。你帶回一個可以再找的位置，收隊前仍沒人看見第二次。
  caroline_herschel_slough:
    name: 掃天的人
    place: 斯勞
    figure: 卡羅琳·赫歇爾
    story: 卡羅琳·赫歇爾記載，1786 年 8 月 1 日她看見一團不像周圍恆星那樣清晰的光，比較觀測後寫信給查爾斯·布拉格登。
    story_prose:
      opening:
        - 斯勞入夜以後，卡羅琳·赫歇爾讓幫手把燈移開一點。她剛標的光團在目鏡裡邊緣發虛，旁邊的亮星還清楚。要想過一夜再找回來，她得把這一刻的圖畫給自己看。
        - 史實裡，赫歇爾比較 1786 年 8 月 1 日和 2 日的觀測，帶著圖致信查爾斯·布拉格登。她後來有了助手薪金，兄長觀測時仍要替他記讀數。這條分支可以爭取固定給她自己的夜晚。
        - 會讀鍾和對星圖的員工先幫忙做兩份能比的記錄。擅長交涉的人可以把她的觀測排班和報告一併交出去。
      points:
        p1: 第一張圖打了三個點。幫手把第二張轉錯了方向，你請赫歇爾從同一顆參照星講起，逐個指回原位。兩張紙邊都補上時刻。她把它們對著燈並好，自己在信裡寫下那團光相對星點的變化。她收起第二張時，把第一夜的時刻留在外側。
        p2: 來收報告的人只給星圖留了空位。你請赫歇爾把一頁排班放上去，讓對方看看她在記大望遠鏡讀數的晚上還能剩多少時間。她親手在兩處空行寫上自己的名字，請來人把這兩類晚上分別列明。在之後的排班上，她能先圈出歸自己的夜晚。
      outcomes:
        all: 觀測圖和她需要的時間都隨信留下。後來定助手工作時，幾夜明確讓她自己安排。
        p1: 信中留下兩夜觀測的對照和圖。她以後仍須在兄長的工作間隙安排自己的望遠鏡。
        p2: 一頁排班表已經遞出。失去第一夜的參照點後，本趟只能保存交出的這份請求。
      none: 第二張圖擺在第一張旁邊，仍湊不齊可核的參照。排班維持原樣。
      not_admitted: 幫手請來客別擋著梯子。燈遮好以後，員工仍留在下層。
      desync: 低處起霧，第一夜少了可認的參照星。第二夜已無法和它比較，事務所發來召回。
      excerpts:
        p1: 她把它們對著燈並好，自己在信裡寫下那團光相對星點的變化。她收起第二張時，把第一夜的時刻留在外側。
        p2: 她親手在兩處空行寫上自己的名字，請來人把這兩類晚上分別列明。在之後的排班上，她能先圈出歸自己的夜晚。
    relic: 一把天區掃描記錄尺
    relic_desc: 一把刻著刻度的木尺，用來在星圖上標出掃過的天區。
    points:
      p1: 在兩夜的圖上都標清觀測時刻和參照星，讓赫歇爾能對比兩張圖，說明那團光移動了
      p2: 拿首份彗星報告為赫歇爾爭取固定的獨立觀測時段
    points_fail:
      p1: 低空的薄霧讓第一張圖缺少足夠的參照點。第二晚畫出的光點沒法用來比較位移，這條分支與史實脫節，員工被召回。
      p2: 每逢兄長用大望遠鏡，她仍得整晚記他的讀數，自己的觀測只能擠在空當裡。
    shift:
      p1:
        was: 1786 年 8 月 1 至 2 日，卡羅琳·赫歇爾記錄了疑似彗星的位置變化，隨後寄出觀測和附圖。
      p2:
        was: 1787 年，卡羅琳·赫歇爾作為兄長的助手領取薪金，她在首次報告中已說明助手工作佔去自己的觀測時間。
        now: '{staff}讓赫歇爾把第一份觀測報告連同自己的觀測排班交給願意支持她的人。後來議定助手職責時，每月另留給她幾個可自行安排的夜晚。'
        who: caroline_herschel_slough
        bio: 赫歇爾擔任有薪助手後仍有固定的自主觀測時段。她能提前安排自己的尋彗工作。
    vignettes:
      fixed: 你先記下兩顆較亮的鄰星，再添模糊的那個。第二張紙雖然挪了位置，仍能靠那兩顆星找回原處。
      doubt: 幫手說興許該擦擦鏡片。你問同一片玻璃裡的別的星怎樣。那些仍然清晰，他便把這處可疑的記號留在紙上。
      lamp: 幫手記時刻時，你用手遮住燈。把燈蓋好以後，兩張圖旁都還留著各自的時刻。
  kovalevskaya_stockholm:
    name: 寫在首頁的前提
    place: 斯德哥爾摩
    figure: 索菲婭·柯瓦列夫斯卡婭
    story: 柯瓦列夫斯卡婭關於剛體繞定點轉動的論文發表於 1889 年的《數學學報》。她找到一種可積分的情形，對轉動慣量與質心位置有特定要求。
    story_prose:
      opening:
        - 斯德哥爾摩，校對人用銅陀螺壓著一張散頁。柯瓦列夫斯卡婭拿給他的是工作稿，桌另一頭還有修訂稿。兩份首頁寫的都是剛體轉動，看標題分不出哪裡改過。
        - 史實裡，她因這項研究獲 1888 年博爾丹獎，論文於 1889 年刊行，同年在斯德哥爾摩獲正式教授職位。這趟要保證刊行稿帶著完整前提，也可以讓學校早點書面確認聘期。
        - 找能對照符號和圖的員工守住寄刊紙包。巴黎的消息到了以後，讓善於辦理書面交接的人帶著她的課程清單去問學校。
      points:
        p1: 校對人指著陀螺的尖端問是不是質心。你畫兩個點，讓他在首頁找哪個叫定點，再回去讀寫質心的那條前提。柯瓦列夫斯卡婭核過兩頁的符號，讓你把重抄的一頁放進紙包。陀螺留給校對人，裝訂後的第一行重新有了條件。
        p2: 校方的文書把獲獎消息擺到一邊，問目前的課誰來上。你和她沿著清單逐日讀過去，指出第一堂需要提前安排的課。文書帶著這張清單去問，再拿回寫有起聘日期的回函。她把回函夾在下學期第一週的課表上。
      outcomes:
        all: 送刊的稿子保留了條件，聘期也及時有了書面日期。她把課表上留給研究的幾個時段寫定。
        p1: 正確的首頁隨論文一起送出。學校仍未書面回覆，她要先把課排下去。
        p2: 她已經拿到寫明日期的回函。送刊稿出了岔子，回程只留下回函交到她手裡的片段。
      none: 兩摞紙仍壓在陀螺底下。員工翻到那張課表的時候，起聘日期還是空著的。
      not_admitted: 校對人先收起稿件，禮貌地說明得等作者認人。員工留在外頭，聽見銅陀螺撞到桌沿。
      desync: 缺了條件的早稿進了寄刊紙包。原有刊行記錄無法重合，事務所召回員工。
      excerpts:
        p1: 柯瓦列夫斯卡婭核過兩頁的符號，讓你把重抄的一頁放進紙包。陀螺留給校對人，裝訂後的第一行重新有了條件。
        p2: 文書帶著這張清單去問，再拿回寫有起聘日期的回函。她把回函夾在下學期第一週的課表上。
    relic: 一隻陀螺模型
    relic_desc: 一隻銅陀螺，軸上刻著編號。
    points:
      p1: 在斯德哥爾摩把工作稿與修訂稿逐頁核對，免得早稿混進準備給刊物的紙包
      p2: 拿著巴黎的獲獎消息和她承擔的教學清單去找校方，請他們書面確認新聘期何時開始
    points_fail:
      p1: 送刊的紙包裡混進了早稿，首頁少了前提。刊行記錄偏離原歷史，事務所召回{staff}。
      p2: 獲獎消息傳到了學校，她排下學期的課時仍拿不到書面的起聘日期。
    shift:
      p1:
        was: 巴黎科學院於 1888 年 12 月公佈博爾丹獎，表彰柯瓦列夫斯卡婭對剛體轉動的研究。增訂論文於 1889 年在《數學學報》刊行。
      p2:
        was: 她於 1889 年在斯德哥爾摩獲正式教授職位。
        now: 這條分支裡，校方提前書面確認了起聘日期，她可以據此安排下一學期的教學和研究。
        who: kovalevskaya_stockholm
        bio: 柯瓦列夫斯卡婭在斯德哥爾摩教學並研究剛體轉動。國際評獎及本地的工作條件分別由不同機構決定。
    vignettes:
      conditions: 練習紙上省寫成了「一個轉動的剛體」。你照首頁補回兩類條件，一類管轉動慣量，一類管質心在哪兒。校對人把兩條都謄上紙條。你能抄走這兩條更正，刊物還沒有印出來。
      diagram: 校對人想拿一隻陀螺試。你畫了一個固定不動的點，再標出代表質心的另一個點。他拿到下一張圖就能分清兩個地方。收隊時陀螺仍在轉，這一轉證明不了論文。
      clip: 你把前提折在練習紙外頭，又把散開的圖紙夾在裡面。下一個人會先看見條件，再看到結論。你帶回陀螺的輪廓，證明還留在桌上。
  heron_alexandria:
    name: 字旁邊那一幅圖
    place: 亞歷山大
    figure: 希羅
    story: 希羅在《機械學》中寫到怎樣用器械搬動重物。希臘文原著只留下殘篇，完整內容見於阿拉伯譯本。派遣年份約為公元 62 年，作坊情節由遊戲虛構。
    story_prose:
      opening:
        - 約公元 62 年，亞歷山大港。希羅的《機械學》講怎樣借器械搬動重物，原著用希臘文寫成。
        - 史實裡，希臘原文只存殘篇，全書由阿拉伯譯本保存下來。在這條分支裡，一份抄本還等著核圖，作坊裡有人願意把校好的那份另存一處。
        - 這趟用得上能看懂圖和字怎樣對在一起的人，也需要有人辦得妥一卷書的交接。
      points:
        p1: '{staff}把抄本挪到作坊裡光足的那張凳上，請希羅看兩處畫得同樣長的線。原來其中一處要跟著另一頁讀。抄寫人照著原頁把記號改好，先讓來領卷的人也試著找了一遍。 那人把卷帶到門外才重新攤開。他找到剛才改過的那一處，把指尖停在那裡。'
      outcomes:
        all: 另存的那一份沒再和工坊的卷冊放回同一架。日後借出時，領卷的人還能按相同的記號回到那頁。
        p1: 領卷的人走前將它單獨繫好。架上的舊卷留在工坊，那份校過的已經出了門。
      none: 抄本還是和舊卷待在一處。關門前，沒能領走的人把手收了回去。
      not_admitted: '{staff}沒能進作坊。在門外還能聽見有人把凳子拉到亮處。'
      excerpts:
        p1: 那人把卷帶到門外才重新攤開。他找到剛才改過的那一處，把指尖停在那裡。
    relic: 標過的模型門檻
    relic_desc: 工坊的模型零件，在門曾蹭到的位置留了一道刻痕。
    points:
      p1: 幫希羅給《機械學》的一份希臘文抄本核清插圖，把它與工坊的卷冊分開放
    points_fail:
      p1: 作坊還是隻把卷冊留在自己手裡。這條分支和史實一樣，希臘文字只存殘篇，阿拉伯譯本保住了全書。
    shift:
      p1:
        was: 公元一世紀，希羅用希臘文寫成《機械學》。希臘文只存殘篇，古斯塔·伊本·盧加的阿拉伯譯本留下了全書。
        now: 核過圖文的希臘文副本存在工坊以外的地方。這條分支裡，後世讀者還能讀到這一份。
        who: heron_alexandria
        bio: 這條分支裡，《機械學》的一份完整希臘文抄本與阿拉伯譯本一同傳到後世。
    vignettes:
      threshold: 尼卡諾爾把模型架上臺，門往回收時差一指寬閉合。你標出摩擦的地方。模型底下卡了片扁豆皮，他把它掃出來。門終於關嚴，他請你留住記號，好叫他下次認得出這處。
      audience: 貝勒尼刻看見門往外打開，已經去拿披風。你請她再等一會兒，盯緊遠側的邊。門回來時，她看見尼卡諾爾漏掉的一線亮光。他把模型留在臺上再試一次，沒急著交貨。
      future: 你可以告訴尼卡諾爾，後世讀者會把這幾頁同機器的圖畫擺在一起。他正等模型門咔噠一響，輕輕落定。你跟他一起聽。離開時，他正叫客人回來看她錯過的那一下。
  pliny_stabiae:
    name: 斯塔比亞的逆風
    place: 斯塔比亞
    figure: 老普林尼
    story: 公元79年火山噴發時，老普林尼抵達斯塔比亞，找到龐波尼安努斯。小普林尼後來寫信告訴塔西佗，送舅舅進來的風也讓裝好東西的船無法離港。
    story_prose:
      opening:
        - 公元 79 年，海灣上空冒出一片雲。後來小普林尼寫信給塔西佗，說舅舅接到求助，乘船出了港。
        - 史實裡，老普林尼來到斯塔比亞，見到龐波尼阿努斯，後來沒能從海灘活著回來。在這條分支裡，船有機會比原來更靠近雷克蒂娜求助的那片岸，也有機會把老普林尼從岸邊帶走。
        - 這趟需要認得海岸和船路的人。到了岸上，還需要帶著對路裝備、能照顧呼吸困難的人。
      points:
        p3: '{staff}在海灘邊跟到老普林尼身旁，拿出帶來的防護裝備，再請身邊的人給他讓出一條能走的路。腳下的灰被來去的人踩實，幾個人停了一次，等他喘過來才走。 到能坐下的地方，他伸手把同伴肩上的碎石撥掉。靠岸的船還在響。'
        p2: 岸邊同來的幾個人都想把船掉頭。{staff}先問誰認得龐波尼阿努斯住處，再請那個人站到能看見岸邊的地方指路。船終於找到能下去的地方。 龐波尼阿努斯來接時，老普林尼手裡還有一截沒有放開的繩。他把它遞迴船邊，才踏到地面。
        p1: '{staff}問清哪片淺水還能接近，和船上的人一起為雷克蒂娜留出可以抓住的位置。她先把手裡的東西往上遞，沒等拿穩就放開了。 船上的人把她拉上來以後，她自己把濕手按在空出的座位上。有人這才拾起她遞來的東西。'
      outcomes:
        all: 離開那片岸以後，有人把雷克蒂娜遞來的東西放到幹處。老普林尼在另一邊歇著，船上終於騰出了一段能走動的地方。
        p3: 回來的船上給老普林尼騰出乾的一角。支撐他坐穩的人，一直等他自己把手放下。
        p2: 老普林尼確實到了龐波尼阿努斯家裡。隨船來的那點碎石，在門前鞋底上掉了一路。
        p1: 雷克蒂娜上船以後留在一處空位。拿回她交出的包時，她還沒有換掉濕衣。
      none: 停船的地方看不見更遠的海岸了。下過水的人都在等一聲新的招呼。
      not_admitted: '{staff}沒能上那條船。岸邊有人掙了一下繩，船頭便慢慢偏開。'
      desync: 船沒能到斯塔比亞。事務所召回{staff}時，龐波尼阿努斯還沒見到老普林尼。
      excerpts:
        p3: 到能坐下的地方，他伸手把同伴肩上的碎石撥掉。靠岸的船還在響。
        p2: 龐波尼阿努斯來接時，老普林尼手裡還有一截沒有放開的繩。他把它遞迴船邊，才踏到地面。
        p1: 船上的人把她拉上來以後，她自己把濕手按在空出的座位上。有人這才拾起她遞來的東西。
    relic: 一塊蠟板
    relic_desc: 一塊塗蠟的木板，用尖筆劃出筆記。
    points:
      p1: 淺灘和山上落下的碎石擋住海岸時，幫老普林尼把船靠上雷克蒂娜那片海岸，把她接上船
      p2: 浮石和碎石砸向船身時，護住老普林尼的船一路駛向斯塔比亞，讓他上岸見到龐波尼阿努斯
      p3: 硫磺氣味和煙塵壓到斯塔比亞的海灘上時，替他護住呼吸，救下老普林尼，讓他活著離開海灘
    points_fail:
      p1: 船沒能靠上她那片海岸，這條分支裡沒有人把雷克蒂娜接上船。
      p2: 船在斯塔比亞之前被逼回，老普林尼沒有見到龐波尼阿努斯。分支與歷史脫了節，事務所因同步失敗召回員工。
      p3: 他照史實倒在斯塔比亞的海灘上，這條分支裡也沒能留住他。
    shift:
      p1:
        was: 公元 79 年，雷克蒂娜來信求救，老普林尼改了計劃出海。小普林尼記下海岸受阻及船駛向斯塔比亞的經過，沒有交代雷克蒂娜的下落。
        now: 船靠上了她那片海岸，雷克蒂娜被接上船，隨船到了斯塔比亞。
      p2:
        was: 小普林尼後來寫信告訴塔西佗，舅舅乘順風到斯塔比亞見到龐波尼阿努斯，同一陣風擋住了船離岸。
      p3:
        was: 第二天硫磺氣味和火光逼近，老普林尼在斯塔比亞的海灘上由兩名奴隸扶起，隨即倒下；小普林尼信裡說是濃重的煙塵堵住了他的呼吸。兩天後遺體在原處找到。
        now: '{staff}替他擋住了煙塵，扶他離開海灘。風轉向以後，他隨船回到米塞努姆，又活了些年。'
        who: pliny_stabiae
        bio: 這條時間線裡，老普林尼從斯塔比亞的海灘上活著回來。他回到米塞努姆的艦隊，又過了些年。
    vignettes:
      wind: 克里斯普斯把搬上船的木箱全記成了已離開。你們從門邊看見第一位來客肩上帶灰走進來，裝好東西的船卻還看得見。克里斯普斯劃掉了已離開幾個字，請你給下一位進門的人在蠟板上留一行。
      lantern: 燈快熄了，普麗瑪只來得及穿過屋子一次。你替她守在門邊，她點數還能看見的人。先看不清的是蠟板，她大聲念出最後兩個名字，你一個個應回去。
      letter: 你記得多年後寄出的那封信。普麗瑪問的卻是拿名單的人，那封信裡找不到他的名字。你把知道的明早結局擱在一旁，幫她點完人。離開時，還能聽到有人沿走廊走過來。
  galen_rome:
    name: 火後還在的書名
    place: 羅馬
    figure: 蓋倫
    story: 蓋倫在《論免於憂苦》中敘述羅馬192年火災給自己的藏書和物品帶來的損失，也敘說哪些書在他看來已經無從補回。
    story_prose:
      opening:
        - 192 年，羅馬。蓋倫把一些卷冊送往坎帕尼亞，也有書和物件放在羅馬的倉間。後來，他在《論免於憂苦》裡分開回憶了這些東西。
        - 史實裡，火災燒掉一批藏書，其中有他認為再找不到的詞彙手稿。在這條分支裡，一批貨先走，正好有人可以在裝貨前和他一起再看一遍。
        - 這趟用得上知道兩批書各該去何處的人。還有人須把工坊裡能重做和難重做的物件分開問清。
      points:
        p3: '{staff}把那部喜劇詞彙手稿從羅馬倉間的單子裡挑出來，請蓋倫再看一次他原先寫的收處。蓋倫翻到常查的一頁，合上以後，讓先行的裝貨人把它放進給坎帕尼亞的那批。 裝貨人剛要合蓋，蓋倫又把手伸進去，把卷上的繫帶翻過來，免得它壓在底下。'
        p2: 倉間還沒收走所有器械。{staff}先問工匠哪件日後最難重做，請他留在工作臺旁做第二份樣。工匠等蠟變硬，在底下寫了一筆記號。 有人來催著收桌，工匠沒把它遞出去。他把第二份放在抽屜最裡面。
        p1: '{staff}把兩張送貨單分開，請先行的裝貨人照著坎帕尼亞那張重念一遍。有人拿起差點放進羅馬那堆的卷，等蓋倫確認，才把它放回先走的貨裡。 捆好之前，裝貨人把目的地重新寫在最上面。另一個人把空出來的繩頭繞過箱角。'
      outcomes:
        all: 先行的書後來能夠借來。有人順著標籤讀到那份喜劇詞彙，工坊裡也還能找出自己留下的蠟樣。
        p3: 那份手稿隨先走的貨離開城裡，卷帶朝上。以後有人要找，第一眼就知道是哪件。
        p2: 工匠日後重做那件東西前，先去把自己的抽屜打開，找出試樣。
        p1: 該先走的卷還是先走。羅馬倉間的那張單子留在原處。
      none: 先走的貨已經裝完。沒有趕上的卷仍照原來的去處收著。
      not_admitted: '{staff}沒見到負責裝貨的人。搬運的腳步聲從倉門裡慢慢遠了。'
      desync: 本來先走的卷併入羅馬倉間。事務所召回{staff}時，舊單上那道誤抄的墨還沒乾。
      excerpts:
        p3: 蓋倫翻到常查的一頁，合上以後，讓先行的裝貨人把它放進給坎帕尼亞的那批。 裝貨人剛要合蓋，蓋倫又把手伸進去，把卷上的繫帶翻過來，免得它壓在底下。
        p2: 有人來催著收桌，工匠沒把它遞出去。他把第二份放在抽屜最裡面。
        p1: 捆好之前，裝貨人把目的地重新寫在最上面。另一個人把空出來的繩頭繞過箱角。
    relic: 一頁書目
    relic_desc: 書目，有個書名依然可讀，存卷一欄留空。
    points:
      p1: 先為要送往坎帕尼亞的散文詞語卷留好運送位置，讓這批書能照原計劃先發
      p2: 器械入倉前，請工匠替一件難補的器械再做一個蠟樣，留在工坊
      p3: 趁先發的書還沒裝完，說服蓋倫讓舊喜劇詞語手稿隨同這批書離城
    points_fail:
      p1: 書卷錯收進羅馬的倉房，舊時已經運走的那批也在火裡失去。行程同步失敗，員工被召回。
      p2: 火後要重做器械，工匠手上沒有留下的樣件可對。
      p3: 那批手稿仍要等夏初才發運，來不及躲過這場火。
    shift:
      p1:
        was: 公元 192 年冬末羅馬起火時，蓋倫說那批散文作家詞語彙編已經運往坎帕尼亞。
      p2:
        was: 公元 192 年，蓋倫存放在羅馬倉房的器械隨火災毀壞，其中有他自己設計的器械。
        now: 另做的蠟樣留在工坊。火災之後，蓋倫還能憑這個樣件請工匠重做那件器械。
      p3:
        was: 公元 192 年冬末，蓋倫編的舊喜劇詞語手稿在羅馬倉房的火災中燒燬。
        now: '{staff}讓這批卷子隨先發的書運走，蓋倫回到羅馬後能憑副本繼續修訂。後來另有一份抄本交給外地的藏書處。'
        who: galen_rome
        bio: 蓋倫的舊喜劇詞語彙編在火災中留有副本。他繼續核訂其中的引文，並把另一份交給外地讀者查閱。
    vignettes:
      list: 特爾提婭唸了三個書名，就記下有三卷。你請她在桌上一本本摸到相應的卷，只摸到兩卷。你們把第三個書名留著，在存卷一欄做了個空記。
      borrow: 狄翁記得借出過一份，卻想不起借給了誰。特爾提婭想趁清單還沒送走，把書名劃掉。你幫他想起交書的那扇門。她在清單裡留了一處空位，等那條街傳來回話。
      survival: 你讀過一部寫這場損失的書，傳本在很久以後才重新被認出來。狄翁只問，明天桌上能放哪本。你留著書目裡的名字，把現有兩卷指給他看。你走時，還沒找到缺掉的那捲。
  ovid_tomis:
    name: 詩與空著的一行
    place: 托米
    figure: 奧維德
    story: 奧維德在《哀歌》第二卷把獲罪的緣由寫成一首詩和一個過失，接著避談那個過失。
    story_prose:
      opening:
        - 奧維德在黑海邊的托米斯流放。《哀歌》第二卷說他因一首詩和一個過失獲罪，沒有把那個過失寫出來。
        - 史實裡，第三卷留有他臥病時寫的一首詩，作品後來流傳下來。在這條分支裡，有幾天他連水都喝不慣，整理好的稿件還找不到能往外捎的船。
        - 這趟需要願意照看病人的人，也需要認得海路、肯和出行的人問清能把紙件帶到哪裡的人。
      points:
        p2: '{staff}約到一個熟悉冬季行程的船客，先問他離開托米斯以後會在哪一站交給下一位，再請奧維德把名字寫在能看見的地方。船客把裡外兩層包紙分別壓平。 開船以前，他把寫著地址的一面翻出來，讓岸上的人再看一次。奧維德隔著船幫點了點頭。'
        p1: '{staff}問他什麼樣的飯還吃得下，向鄰里找來一小份，又把可以喝的水放在床旁。奧維德想伸手拿稿子時，{staff}把杯往他手邊推了一下。 他先喝水，過了一會兒才把那一頁拿過來。橫過紙角的杯影縮成很小一片。'
      outcomes:
        all: 載稿的人已經出了港。屋裡的人把床邊的水換過一次，奧維德又拿出一張空紙來。
        p2: 船客帶著詩卷離開前，到岸邊把去向說了一遍。奧維德一直聽到最後一站。
        p1: 一天裡他有了幾段可以安靜躺著的時候。床邊能喝的水始終沒斷。
      none: 船隻停在背風的一邊，等不到出港的消息。託人帶的紙還放在桌角。
      not_admitted: '{staff}沒遇上能帶他進屋的人。門邊那碗水放了很久，沿口落進一片葉子。'
      desync: 詩沒人肯帶走。事務所召回{staff}時，寫好去處的紙仍包在外層。
      excerpts:
        p2: 開船以前，他把寫著地址的一面翻出來，讓岸上的人再看一次。奧維德隔著船幫點了點頭。
        p1: 他先喝水，過了一會兒才把那一頁拿過來。橫過紙角的杯影縮成很小一片。
    relic: 一塊寫字蠟板
    relic_desc: 一塊板，上面是流放路上起筆的詩體書信。
    points:
      p1: 奧維德在托米斯病倒，沒有醫生、沒有合用的吃食、水喝不慣，照看他把病養好
      p2: 托米斯冬季難以通行時，為《哀歌》第三卷找到能把它捎去羅馬的人
    points_fail:
      p1: 他病中無人照看，這條分支裡他在托米斯的頭幾個月和他詩裡寫的一樣難熬。
      p2: 這條分支裡，沒人把詩卷帶上路，詩卷沒有及時到達羅馬。行程同步失敗，事務所召回員工。
    shift:
      p1:
        was: 公元 9 年前後，奧維德在托米斯病倒，他在《哀歌》第三卷第三首裡寫，這裡沒有醫生，沒有合用的吃食，水也喝不慣。
        now: '{staff}給他找來乾淨的水和吃得下的東西，在他發熱的日子裡守著。他比原來早些下了床。'
      p2:
        was: 公元 9 至 10 年前後，奧維德在流放中寫下《哀歌》第三卷。開篇從書到達羅馬寫起，卷中也寫到當地冬季行路困難。
    vignettes:
      rumor: 你告訴捎信人，幾個世紀以後還有人追問那個過失。他指指抄本空出來的地方，問該寫些什麼。你把目的地添在封套上，把空處留在正文裡。人帶著這份說不清的稿子走了。
      verify: 捎信人記得一個多了人名的版本。你請他指出是哪張紙上的。他能指出那首詩和那個過失，往後便指不出什麼了。你在自己的蠟板上記下斷在這裡。抄本啟程時，你仍然沒得到那個名字。
      wrap: 捎信人伸手時，風掀起外面一頁。你給散頁編上號，照原樣收好。蠟板上只給自己留了一句提醒，那行沒解釋的照原樣抄。收信人讀到這裡是什麼反應，你沒能看見。
  empedocles_akragas:
    name: 合唱從哪句分開
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒的詩歌殘篇寫到四根，以及愛與爭引起的聚合和分離。遠在後世，第歐根尼·拉爾修收錄了互相矛盾的死因傳說。
    story_prose:
      opening:
        - 約公元前五世紀中葉，阿克拉加斯。恩培多克勒的詩用四種根來解釋事物在一起時怎樣成為一體、怎樣又分開。
        - 史實裡，長詩後來只存殘篇和別人引過的句子。在這條分支裡，一名抄寫人願意多寫一份，另一個地方也有人願意收下。
        - 這趟用得上能聽出抄本里哪一句接不上、確認以後還找得到它的人。
      points:
        p1: '{staff}從頭跟抄寫人讀了一遍，在一處兩個人都讀快了的地方請他先停手。恩培多克勒把那兩句慢一點念開，等抄完再讀回給他聽。待到第二天，{staff}陪領抄本的人核了頭尾。 兩卷不再用同一根繩捆著。領卷的人拿起單獨繫好的那一份，先把它的頭一句低聲唸了一次。'
      outcomes:
        all: 另收的一份沒有和原卷同進同出。後來有人來請教那幾句，保管者沒等別人送來卷子，自己就拿了出來。
        p1: 領走的人把新卷放在自己可以打開的地方。原先那捲仍留在寫字的人桌邊。
      none: 抄本開頭幾行還沒有接上。收工時，念過一遍的人把卷留在了原處。
      not_admitted: '{staff}沒趕上抄寫的人開門。有人從隔牆念出一句，聽近了才知道是在重讀舊卷。'
      excerpts:
        p1: 兩卷不再用同一根繩捆著。領卷的人拿起單獨繫好的那一份，先把它的頭一句低聲唸了一次。
    relic: 一片詩稿
    relic_desc: 排練用的紙莎草條，在詩句的兩處轉折做過記號。
    points:
      p1: 幫抄寫人核全《論自然》的一份抄本，把這一份另找地方存下
    points_fail:
      p1: 這條分支裡，後人也只能從後世的引文和紙草殘片中讀到長詩的一部分。
    shift:
      p1:
        was: 公元前五世紀，恩培多克勒把自己的學說寫進詩中。《論自然》傳下來的只有引文和紙草殘篇，包括 1999 年刊佈的斯特拉斯堡藏片。
        now: 這份抄本核過全文，由另一名讀者帶走保管。這條分支裡，後人還能找到整首詩。
        who: empedocles_akragas
        bio: IF 線裡，恩培多克勒的《論自然》完整傳了下來，後人能從第一行讀到最後一行，看他怎樣講四根和愛與爭。
    vignettes:
      cue: 法翁只記住聲音最高的一句，結果兩個人同時起了頭。你在意思轉折的兩處做記號。到頭一處，兩人把凳子挪近，到了第二處，各退一步。這回面朝門的讀者不用看稿，也知道唸到哪兒。
      handoff: 埃瑞涅能唸到第二段，卻總是一下跳到末尾。法翁說他一個人唸完算了。你請她給第一個提示，讓法翁在屋子另一邊接腔。喊開飯時，收住這一遍的是她，終於沒有半途離開。
      sandal: 法翁問後人會記住哪個故事。你差點說起後來那則埃特納傳說裡的銅鞋。他想要的是明天還能練的一句。你收住銅鞋的話，陪他把沒念完的那段再走一遍。再想去找埃瑞涅，凳子已經疊起來了。
  hildegard_bingen:
    name: 沒唱出聲的開頭
    place: 賓根
    figure: 賓根的希爾德加德
    story: 一場安葬爭議使希爾德加德住處的歌聲停了下來。她寫信給美因茨，談到歌唱對身邊人的意義。限制於 1179 年 3 月解除。留存的文集裡，還看得見魯珀茨貝格抄寫人的工作。
    story_prose:
      opening:
        - 十二世紀末，賓根附近。希爾德加德的書信和譜頁流傳下來，也留下好幾個人同她一起校抄的痕跡。
        - 史實裡，一場安葬爭議使歌聲中斷，限制到次年三月才解除。在這條分支裡，一頁練習用過許多次，第一個字上方磨得不太看得清。
        - 這趟用得上懂歌譜或抄本的人，還要能留著那處不確定的記號，等曾唱過的人自己辨認。
      points:
        p1: '{staff}請抄寫的人先不要補那個淡下去的記號，把舊頁和副頁鋪開，讓希爾德加德和一位熟悉唱法的人分別看。兩個人都能認出後面那一處，開頭卻還得再問。 抄寫人把確認的部分落到紙上。到第一個字時，她把那一點空白留得比分別兩行的空隙還寬。'
      outcomes:
        all: 限制解除以後，有人拿著副頁來對第一句。她的手在那處空白停住，熟悉舊頁的人便到她旁邊來。
        p1: 下回翻出副頁時，還能看出哪一處是照舊頁抄下的，哪一處得找人再問。
      none: 副頁照舊收起來。第一個字的上面有一點白，誰也沒把它與舊頁放在一處核。
      not_admitted: '{staff}沒進抄寫的房間。門邊有人合上一卷譜，先把木凳扶回原處。'
      excerpts:
        p1: 抄寫人把確認的部分落到紙上。到第一個字時，她把那一點空白留得比分別兩行的空隙還寬。
    relic: 一頁有記號的練習稿
    relic_desc: 練習頁，一根夾線標明起句。
    points:
      p1: 趁屋裡安靜，請希爾德加德和抄寫人辨認舊頁上的磨損處，把辨不清的記號註明在副頁上
    points_fail:
      p1: 副頁先收起來了。第一個字上面仍留著白，下一個讀到的人還得問舊頁怎麼寫。
    shift:
      p1:
        was: 希爾德加德在信中談到歌唱中斷。魯珀茨貝格的抄寫人也為她留下了文章和曲譜。
        now: 這條分支裡，{staff}把舊頁和副頁並排留下。抄寫人一眼就能看出哪些記號已經讀清，哪些還要再看。
    vignettes:
      opening: 阿格內斯還認得出第一個詞，詞上方磨壞的記號卻看不清。你請她把知道的那句與備用紙對一遍。她夾一根線在對應處。下一個人翻開，也能找到同一個開頭。
      wait: 阿德爾海德背得出詞，正要把損壞的那頁收起來。你托住紙，讓阿格內斯沿著那行再走一遍。阿德爾海德把開頭抄到備用頁上，舊紙放在旁邊。下一個人來時，兩份都還在。
      return: 你知道修院日後還會唱起來，可阿德爾海德現在得收好那一頁。你幫她指明開頭，先不唱出來。門合上時，紙頁間還看得見那根線。等這屋裡再有人唱，你已離開了。
  hua_tuo_xuchang:
    name: 史書提到的那一卷
    place: 許昌
    figure: 華佗
    story: 晚出的《三國志》說華佗被關入許獄，並記他試圖從獄中交出一卷書而未成。
    story_prose:
      opening:
        - 東漢末年的許。陳壽的《三國志》記下華佗在獄中的結局，也記一卷沒有流傳下來的書。
        - 史實裡，獄吏不敢收華佗交來的書，書後來被燒去。在這條分支裡，有人願意問清書卷可不可以由親友領取，也有人想試著遞一份寬免請求。
        - 這趟用得上熟悉文書來往的人，得能把領書和求寬免說成兩件事，各自找到肯聽完的人。
      points:
        p2: '{staff}請肯轉呈的人等一等，把請求裡的姓名和案子逐項對清。他收下以後又叫人回來，把受理的字樣寫在副本上。幾天後，華佗從門裡出來，見到等他的人。 門邊的人伸手想扶他。他先站了一會兒，才把手遞過去。'
        p1: 獄吏一看是華佗的書，手伸出去又縮了回來。{staff}問清由誰具名受領，另請一位親友到值房登記。簿子翻到新一頁以後，那捲書才移到門外。 領書的人找不到合適的包布，便把外衣解下來鋪在桌上。
      outcomes:
        all: 華佗回去時，有人把包好的書放在門邊等他。他認出用來打結的那一角衣布。
        p2: 熟人陪華佗離開許獄，走到外面才慢慢轉過第一個街角。
        p1: 那捲書先留在領書的人家裡。包布沒有拆，書脊壓下的一條摺痕還在。
      none: 值房的人收起登記簿。紙角已經卷起來了，本該寫領書人的那頁仍空著。
      not_admitted: '{staff}沒有見到經辦人。窗下的桌子直到收工也沒有挪動。'
      excerpts:
        p2: 門邊的人伸手想扶他。他先站了一會兒，才把手遞過去。
        p1: 簿子翻到新一頁以後，那捲書才移到門外。 領書的人找不到合適的包布，便把外衣解下來鋪在桌上。
    relic: 一頁練習登記簿的副本
    relic_desc: 登記副頁，區分傳聞與實際交接。
    points:
      p1: 獄吏畏法不敢收時，不讓那捲書被燒掉
      p2: 在判決執行前，讓寬免的請求重新送到能複議的人手中，使華佗得以活著走出許獄
    points_fail:
      p1: 獄吏畏法不收，華佗把書燒了，這條分支裡那捲書一頁也沒留下。
      p2: 他照史實死在許獄，這條分支裡他再沒給人看過病。
    shift:
      p1:
        was: 約 208 年，《三國志》記華佗遞出的書卷被獄吏拒收，後來由華佗燒去。
        now: 那捲書有人收著帶出了許獄，沒散失之前已經抄了一份。
      p2:
        was: 約 208 年，《三國志》記曾有人為華佗求情，華佗仍在許獄被處死。
        now: 這條分支裡，寬免的請求重新獲准審議，判決改了。華佗活著走出許獄。
        who: hua_tuo_xuchang
        bio: 這條分支裡，華佗獲寬免，活著走出許獄。
    vignettes:
      notice: 阿瑾聽說有一卷書，便寫進已收物件。你請她指給你看書該擱在哪層。她把那一行移到傳聞欄，架上仍留空，話是誰說的也記在旁邊。
      shift: 阿長想合上登記簿，再叫下一班來。你請他先把這幾行念一遍。唸到沒人親見的交接，兩人商量把那一欄先掛著。接手人看得見還有哪一筆沒核實。
      later: 你知道後來史書會說起一卷書。阿瑾問，有沒有真書從這屋交出去過。你指給她看若真有交接該記在哪兒。紙離開她的桌子時，那一欄仍空著。
  miyazawa_kenji_hanamaki:
    name: 很少有人讀過的故事
    place: 花捲
    figure: 宮澤賢治
    story: 宮澤賢治多次修改《銀河鐵道之夜》。現行的據稿本整理的文字寫喬班尼聽見站名，接著發現自己坐在車廂裡。
    story_prose:
      opening:
        - 1933 年，花捲。宮澤賢治從前教過書，也給附近的農戶辦肥料諮詢。寫給孩子的故事有一些一直跟著他改。
        - 史實裡，他在九月因病去世。《銀河鐵道之夜》留下了不同階段的稿頁。在這條分支裡，來問田裡事情的人和想看稿件的人都要等他有力氣說話。
        - 這趟用得上能把農戶的問題問準、又知道什麼時候應該少問一句的人。還需要有人能帶對裝備，及時照護病中的宮澤。
      points:
        p3: 九月二十日，門邊的人說他剛才已經坐不住。{staff}帶著器材來請他允許照料，並請家人留下。隔了一段日子，宮澤伸手，自己接過家裡人端來的水。 屋裡的人把原來放得太遠的凳子拉過來。他把空杯遞回去，等手鬆開才靠回枕上。
        p2: '{staff}把各稿分開遞給宮澤，只問他認得出的先後。他在其中一份的末頁停下來，用指頭在兩行之間來回比。 他選了兩張紙，疊在整份稿的最上面。夾進來的那一頁只有他才知道該先讀。'
        p1: '{staff}在門外先問每戶種的是什麼、到底想問哪一件事，再把相近的幾個問題放在一起遞進去。有人說不清一塊田的大小，便回家找來寫過的紙。 宮澤讓第一個人坐下，自己把問題紙按到桌面。紙角被水杯壓住，這回不用他一直扶著。'
      outcomes:
        all: 農戶還會拿新的問題來。稿紙和問題紙分放在兩頭，宮澤先把門口那位來客的凳子找出來。
        p3: 家裡把他用過的杯子洗淨，仍放在他能順手拿到的地方。
        p2: 後來翻到那些草稿時，上面兩葉還按宮澤選的順序疊著。
        p1: 最後離開的農戶把問題紙疊成四折，出了門才拿給等候的人看。
      none: 到了九月，稿頁仍分在幾沓裡。窗邊那把等人來坐的椅子空了下來。
      not_admitted: '{staff}沒能進屋。門邊的人把問田裡的幾張紙收攏，替它們避一會兒雨。'
      desync: 來訪的人等不到能問事情的時候。事務所召回{staff}時，問題紙還在最先來的人手裡。
      excerpts:
        p3: 屋裡的人把原來放得太遠的凳子拉過來。他把空杯遞回去，等手鬆開才靠回枕上。
        p2: 他選了兩張紙，疊在整份稿的最上面。夾進來的那一頁只有他才知道該先讀。
        p1: 宮澤讓第一個人坐下，自己把問題紙按到桌面。紙角被水杯壓住，這回不用他一直扶著。
    relic: 一本口袋筆記本
    relic_desc: 一本小筆記本，裡面是鉛筆寫的詩。
    points:
      p1: 在宮澤無力長談時，理清來訪農戶的問題，讓這次肥料諮詢照常辦下去
      p2: 趁宮澤還能辨認草稿，請他給《銀河鐵道之夜》留下各稿的先後
      p3: 9 月 20 日急性肺炎加重時，讓宮澤賢治及時得到醫護，幫他熬過這場病
    points_fail:
      p1: 來訪的人等不到能問清楚的時候，諮詢沒辦成，這條分支與史實脫節，員工被召回。
      p2: 稿頁留了下來，後來整理的人仍要從紙張和改筆判斷稿本先後。
      p3: 這條分支裡病照舊發展，9 月 21 日他在花捲去世，三十七歲。
    shift:
      p1:
        was: 1933 年 8 月，宮澤賢治病情轉重，仍應答農戶的肥料諮詢。
      p2:
        was: 1933 年 9 月，宮澤賢治去世，《銀河鐵道之夜》留有多次改寫的未定稿。
        now: '{staff}請宮澤指出哪疊在先、哪疊在後，把次序另記在封紙上。後來整理作品的人照著這份記號把不同稿本分別保存。'
        who: miyazawa_kenji_hanamaki
        bio: 宮澤生前留下了《銀河鐵道之夜》各稿的排序說明。作品身後刊行時，讀者可以由早到晚讀到他留下的改寫。
      p3:
        was: 1933 年 9 月 20 日，宮澤賢治患急性肺炎，次日在花捲去世，三十七歲。
        now: '{staff}在病情最急的那天幫他得到醫治。宮澤熬過了這場病，到了秋深時，又能坐到桌邊。'
        who: miyazawa_kenji_hanamaki
        bio: 這條分支裡，宮澤賢治熬過了 1933 年秋天的肺炎，重新拿起了稿子。
    vignettes:
      call: 你在屋子那頭念出站名。還沒解釋誰在那裡，讀者就抬了頭。他再讀時把解釋往後放，先保留那一聲。
      window: 讀者想指出鐵道從哪裡通進天空。你問喬班尼先從窗裡看見了什麼。他把小山和車廂分別寫在兩張紙上。
      ticket: 讀者重讀轉進車廂那幾句時，你一直替他翻著這頁。下一站還沒叫名以前，他先記下眼前已經變了什麼。
  higuchi_ichiyo_tokyo:
    name: 櫃檯上的七期《青梅竹馬》
    place: 東京
    figure: 樋口一葉
    story: 樋口一葉的《青梅竹馬》在 1895 年至 1896 年 1 月間於《文學界》連載，共七期。1896 年 4 月，《文藝俱樂部》一次刊出全文。書攤上的周折是分支演繹。
    story_prose:
      opening:
        - 1896 年，東京。樋口一葉的《青梅竹馬》原來在《文學界》分七次連載，改稿後來在《文藝俱樂部》一次刊全。
        - 史實裡，一葉來不及看到這篇變成由她挑底本的單行本，同年十一月因病去世。在這條分支裡，櫃檯上的舊刊還沒收齊，書商也還有機會答應早付一筆稿酬。
        - 這趟用得上能追到舊刊和校樣的人。有時比找書更難的，是讓談稿酬的人等作者讀完條款。病中還需要帶著合適裝備來的人。
      points:
        p3: 天熱起來以後，一葉仍然發燒。{staff}到住處探望，把她願意接受的照護安排好，又請同住的人先把來催稿的回絕。後來有一天，她重新坐到了桌邊。 她把原先靠牆放著的稿子挪回來。紙上泛起一點窗光，正落在她上次停筆的地方。
        p2: '{staff}請書商把付多少、何時付、用哪個校本一併寫清。一葉把紙拉近，一條一條讀，看到最後一條時才問可以留下哪一份。 書商把他那份對摺。一葉手邊攤著另一份，她圈出的底本名稱一眼就看得見。'
        p1: 七期舊刊擺在櫃檯上只數得出六本。{staff}跑去找最後借走那期的人，趕回來時，一葉正翻出同一段在改稿上的位置。 她把兩頁緊挨著擺好，從新寫的第一行開始讀。櫃檯底下那道裂縫，這一回沒有夾住紙。
      outcomes:
        all: 一葉回到桌邊後先看那份單行本約定。窗邊擱著兩摞東西，一摞是舊刊，一摞是她後來願意繼續寫的紙。
        p3: 她能重新坐下來寫字的時候，先取了最上面的一頁。房裡沒有人替她把頁翻過去。
        p2: 書商把約定的一份送了回來。她把那張底本的校樣壓在同一冊舊刊裡。
        p1: 合刊的新本送到桌上時，七期舊刊還疊在一起。她在桌邊停下來翻看改過的地方。
      none: 書商留了消息說還要再等。那冊合刊合起來時，裡面沒有新的答覆。
      not_admitted: '{staff}沒能見到一葉。借閱櫃檯下還有一摞舊刊，封面用線捆住。'
      desync: 其中一期沒能找回。事務所召回{staff}時，櫃檯上那一疊仍留著中間的空處。
      excerpts:
        p3: 她把原先靠牆放著的稿子挪回來。紙上泛起一點窗光，正落在她上次停筆的地方。
        p2: 書商把他那份對摺。一葉手邊攤著另一份，她圈出的底本名稱一眼就看得見。
        p1: 她把兩頁緊挨著擺好，從新寫的第一行開始讀。櫃檯底下那道裂縫，這一回沒有夾住紙。
    relic: 一本隨身日記
    relic_desc: 一本寫了多年的日記，毛筆字端正。
    points:
      p1: 拿齊《文學界》七次連載的舊刊，同樋口一葉核全《文藝俱樂部》的合刊校樣，讓改過的全篇能在四月刊出
      p2: 趁合刊新出，請一葉與書商定一份帶預付稿酬的單行本約定，由她指定所用校本
      p3: 七月一葉發熱不退時，及早查出結核，治好她
    points_fail:
      p1: 零散舊刊少了一期，編輯只收到不全的合刊稿，事務所因同步失敗召回員工。
      p2: 已有合刊可以借閱，書商仍只讓她等後續消息，稿酬與使用哪個底本都沒有定。
      p3: 一葉的病照史實加重。11 月 23 日，她死於肺結核，年二十四。
    shift:
      p1:
        was: 《青梅竹馬》分七次刊載，1896 年 4 月 10 日由《文藝俱樂部》刊出修訂後的全篇。
      p2:
        was: 一葉晚年仍面對生計壓力。《青梅竹馬》後來收入 1897 年刊行的全集。
        now: 書商先付一筆稿酬並留下籤認的校樣。她能用這筆收入週轉；往後排版的人也知道這版應照哪一份稿。
      p3:
        was: 1896 年 7 月，一葉病重。同年 11 月 23 日，她死於肺結核，年二十四。
        now: '{staff}替一葉及時找到了醫護。她慢慢好起來，又能每天抽一會兒坐到寫字桌前。'
        who: higuchi_ichiyo_tokyo
        bio: 這條分支裡，樋口一葉在 1896 年病後恢復，重新開始寫作。
    vignettes:
      index: 有人在一期雜誌上用鉛筆寫了「全」。你翻到那一期的末尾，拿四月刊本一對，找到了斷在何處。攤主讓你夾張能取下來的紙籤。你帶回七期的清單，卻沒能問到原來的字是誰寫的。
      reserve: 有位讀者一期期追下來，末回還沒來取。你指給攤主看，別的客人如今可以買四月的全文刊本。末回連同預留的小條一起放進櫃檯底下。那位讀者回來以前，你先收隊了。
      layout: 你把四月那期放在末回旁邊。一本打開是開頭，另一本默認讀者已經等過前面六回。你給攤主寫下區別，也給自己留了一份。最初追連載的讀者，等的時間比你整趟穿越還長。
  rumi_konya:
    name: 開篇是誰在說
    place: 科尼亞
    figure: 魯米
    story: 魯米《瑪斯納維》開篇請人聽蘆管訴說離別。科尼亞梅夫拉納博物館藏有六卷全本，抄於1278年，晚於魯米1273年去世。
    story_prose:
      opening:
        - 1273 年，科尼亞。魯米寫下的長詩後來分為六卷，五年後抄成的一部寫本今天仍存。
        - 史實裡，魯米在這一年十二月去世。寫本告訴後來的讀者長詩是怎麼分卷的。在這條分支裡，兩份借讀的抄頁還擱在一起。
        - 這趟用得上能辨清抄頁順序的人。也需要有人先聽清病中的人想要見誰，再替他守住一小段安靜。
      points:
        p2: '{staff}問魯米想先見誰，把來人請進來，再讓門邊等候的人稍候一會兒。來客坐在他聽得見的地方，有一陣子兩個人沒有說話。 來客把自己原先捏在手裡的紙擱了下來。魯米看見了，把杯子往他那邊推了一點。'
        p1: '{staff}等借書人回來認領時，先把兩份抄頁在桌上分開，順著每份露出來的末行去找下一頁。來人也坐下來幫忙，讀到斷的地方時把聲音停住。 他找到接下來的那一頁，往前放了一寸。借出去的那一束，這一次從頭到尾都能接上。'
      outcomes:
        all: 後來借書的人把兩份抄頁各放在該放的位置。門關上時，出去的人手裡還是空的，借書的先留在屋裡。
        p2: 門外的人往後讓出一點地方。那位來客坐了很久，走的時候沒人催他。
        p1: 借書人到門邊又回頭翻了一頁，才把一束貼在衣上帶出去。
      none: 兩份紙還在同一張桌上。窗邊那隻杯隔了很久也沒人動。
      not_admitted: '{staff}沒等到能進屋的時候。借書人站在長凳邊，手裡空著。'
      desync: 一份抄本漏了一節便被借走。事務所召回{staff}時，另一份還在桌上攤開著。
      excerpts:
        p2: 來客把自己原先捏在手裡的紙擱了下來。魯米看見了，把杯子往他那邊推了一點。
        p1: 他找到接下來的那一頁，往前放了一寸。借出去的那一束，這一次從頭到尾都能接上。
    relic: 一張起句練習稿
    relic_desc: 讀書頁，在起句處做了記號。
    points:
      p1: 在科尼亞對好一份《瑪斯納維》抄頁的卷次，再把它交給下一位借讀的人
      p2: 魯米病中，問他想見誰，等那個人進屋坐下，讓屋裡先安靜一會兒
    points_fail:
      p1: 兩份抄本混了頁，有一束漏排了一節就被借走。記錄脫節，事務所召回{staff}。
      p2: 魯米想見的人還沒坐下，門外又有人來訪。
    shift:
      p1:
        was: 科尼亞保存一份 1278 年的《瑪斯納維》全六卷手稿，抄於魯米去世五年後。
      p2:
        was: 1273 年 12 月，魯米在科尼亞去世。後出的傳記描寫有同伴聚到他的病榻前。
        now: 這條分支裡，{staff}替魯米想見的人搬了把椅子。兩人可以先坐一會兒，等魯米有力氣了再開口。
    vignettes:
      reed: 娜琳把兩處用同一種聲音讀過去。你問，蘆管從哪裡開始用自己的口吻說話。她換過一口氣，才念下一句。哈桑閉著眼，也聽得出哪裡換成了蘆管。
      hand: 哈桑得離開讀書凳，還沒念完，娜琳手已夠到那頁。你按住紙角，等他把一聯唸完，手指落到下一行。輪到她時，她從那兒起句，一段詩從一人手裡遞到了另一人。
      manuscript: 你見過後來的六卷抄本。娜琳問，上面能不能看出哈桑在哪裡換氣。你指著剛練過的那行，讓她自己定在哪裡停。門關上時，他們還沒念到下一聯。
  terence_rome:
    name: 留不住的觀眾
    place: 羅馬
    figure: 泰倫提烏斯
    story: 泰倫提烏斯的《婆母》序言回顧演出受擾的經過，先提拳擊和走繩的吸引力，再寫角鬥表演的消息引得人群湧來。
    story_prose:
      opening:
        - 羅馬，約公元前 165 年。《婆母》的演出序言後來記下頭一回上臺遇到的事。開場時，臺上的人還在等觀眾靜下來。
        - 史實裡，看客被別處的節目分了心，戲沒演完。在這條分支裡，靠臺的幾排人還沒走，他們只是聽不清現在該誰開口。
        - 這趟用得上敢在熱鬧裡說幾句話、知道什麼時候該把聲音交還給演員的人。
      points:
        p1: '{staff}先請前排的人坐回去，指給後面的人看臺上已經站好的演員。有人還在問另一場表演何時開始，{staff}聽完才請他等一句。說話的演員沒提高嗓門。幾個人轉了頭，把後面也帶得靜下來。 最後一句說完，最靠前的觀眾把手從臺沿收回。等他起身，後頭的人才跟著動。'
      outcomes:
        all: 收場的人來解臺邊的繩時，幾個人仍坐著說剛才那一句。
        p1: 尾聲過去了，前排的人才陸續從座位上起身。
      none: 人群往另一邊湧去。臺上的人把已經開口的半句收了回去。
      not_admitted: '{staff}沒有擠到前排。近處有人站起來，視線裡很快只剩背影。'
      excerpts:
        p1: 最後一句說完，最靠前的觀眾把手從臺沿收回。等他起身，後頭的人才跟著動。
    relic: 一副喜劇面具
    relic_desc: 一副亞麻面具，眉毛高挑，演員戴的。
    points:
      p1: 在人聲壓過臺詞時，讓舞臺近處的人重新聽戲，幫劇團把《婆母》頭一回演完
    points_fail:
      p1: 臺上的聲音被人聲蓋住了。劇團照史實提前收場，沒有演到末尾。
    shift:
      p1:
        was: 公元前 165 年，《婆母》首演時，拳擊和走繩的消息引起騷動，戲沒能演完。
        now: 舞臺近處的人重新開始聽戲，劇團頭一回就演到了最後一句。
        who: terence_rome
        bio: 這條分支裡，泰倫提烏斯的《婆母》於公元前 165 年首演，同一天演到了結尾。
    vignettes:
      warning: 你告訴舞臺幫工，兩千年後還有人讀到這場戲中斷的事。他問後人知不知道收場時演員說到哪兒。你留下聽排練，記下最後一句聽清的話。正式演出還沒到。
      audibility: 你靠門聽，聽清了一句，卻漏掉了接它的那句。幫工挪了一條長凳，請你再聽一遍。這回你把兩句都聽到了。你帶回畫著長凳兩個位置的草圖。等你退到街上，末尾的話已被街聲蓋住。
      bench: 你幫舞臺幫工把一條長凳從門口挪開。來遲的人終於能坐下，不用叫整排人都站起來。你在木片上記下空出來的地方。臨走時，門裡還傳著排練的聲音。
  taqi_al_din_istanbul:
    name: 天文臺裡的兩聲報碼
    place: 伊斯坦布爾
    figure: 塔基·丁
    story: 塔基丁的伊斯坦布爾天文臺在1580年1月被拆除前進行過觀測。檔案研究列出的儀器包括象限儀和機械鐘。
    story_prose:
      opening:
        - 1580 年初，伊斯坦布爾。塔基丁和同伴在觀象臺觀測，手稿留下他們使用多種儀器的記錄。
        - 史實裡，觀象臺在一月被撤除。在這條分支裡，一位原來負責扶住讀數的人，想在拆除前帶走那枚他們共同用過的小部件。
        - 這趟用得上清楚什麼能安全交接的人，也得能讓那位助手當面說自己願意接下哪一件。
      points:
        p1: '{staff}和助手在架旁看了兩遍，最後問他願不願意只接下那枚平時最常讀的刻度件。助手點頭，拿一塊舊布托住，等{staff}和他一起把它平平拿到桌面。拿起布以前，他又沿著尺邊摸了一遍。手指停下來時，還壓在從前報數的那一格。'
      outcomes:
        all: 助手把包好的部件帶回家。以後有人來問當時怎樣讀數，他把布展開，先讓對方看那一格。
        p1: 那件小部件沒有跟著舊架散失。助手用從前的舊布把它收在桌下。
      none: 助手來過一次，又空手離開。架子原來立過的地方還留下一塊顏色較淺的地面。
      not_admitted: '{staff}沒有見到觀象臺的人。關門以後，屋裡傳來收木箱的聲音。'
      excerpts:
        p1: 拿起布以前，他又沿著尺邊摸了一遍。手指停下來時，還壓在從前報數的那一格。
    relic: 一張訂正對照紙
    relic_desc: 天文臺記錄副頁，保存了原行與訂正。
    points:
      p1: 撤除開始前，和使用儀器的助手取下一個帶刻度的小部件，交給他們帶走保管
    points_fail:
      p1: 工人到場拆除時，帶刻度的部件仍在原地。原來的助手沒能留住這一件。
    shift:
      p1:
        was: 1580 年 1 月，伊斯坦布爾觀象臺被拆除。同期詩文記下了儀器被毀。
        now: 有一件帶刻度的部件留在助手手裡。離開觀象臺後，他們還能拿它同別的造儀器的人講解原先怎樣劃刻度。
    vignettes:
      clock: 哈桑讀角度，萊拉抄鐘上的時刻。她沒聽到第二次報碼，下一行沿用了前一行的角度。你請兩人一先一後再報一遍，他們把訂正並排寫在原記錄旁，下一個人翻到這裡就能找到。
      copy: 裝訂好的記錄簿要送下樓，哈桑在臺邊還得查那次訂正。你請萊拉把舊行和改行一起抄在一張紙上，註明先讀的是哪一行。簿子送走後，臺邊還查得到這次改動的來路。
      closure: 你知道這座建築剩下的時間已經很短。哈桑停在沒有配時刻的角度上。你問他合上窗板前還能查出什麼。他圈出一處空格。你走時，沒再看見這間屋做下一次觀測。
  bessie_coleman_jacksonville:
    name: 起飛之前，她的姓名
    place: 傑克遜維爾
    figure: 貝茜·科爾曼
    story: 貝茜·科爾曼於1921年6月15日在法國取得國際飛行執照。1926年4月30日，她在傑克遜維爾帕克森機場為五一活動試飛時遇難。
    story_prose:
      opening:
        - 1926 年四月，傑克遜維爾。貝茜·科爾曼在法國拿到飛行執照，這一回來到佛羅里達，為當地活動做準備。
        - 史實裡，她在四月二十九日到學校和學生見面，第二天在試飛中遇難。在這條分支裡，活動的人來借原來送她去學校的車。
        - 這趟用得上能跟學校和主辦人商量的人，也用得上懂機務、敢在別人都等著起飛時提議再查一遍的人。
      points:
        p4: '{staff}請負責機務的人先到場，和科爾曼、駕駛員一起聽完地面檢查意見。等候起飛的人問要把領到的座位讓給誰，科爾曼說，先把今天的本子拿來。 駕駛員把明日以後可用的時段指給她看。她取過鉛筆，把今天那一欄留空。'
        p2: 學生提了許多問題，有一張紙折得太小，開口時沒人接。{staff}把它遞給留下來的老師，請他單獨留一堂課，再問科爾曼有什麼訓練消息願意寄來。 老師把回信地址抄在黑板一角。最後一個走的孩子回過頭，又抄了一遍門牌。
        p1: '{staff}把主辦人的時間表拿到學校，問清哪一段已經通知了學生，再回去借到另一趟車給活動的人用。科爾曼到學校時，走廊已經排起隊。 前排一個孩子把寫著她名字的紙扶正。等她在桌邊坐下，那孩子才把自己的問題推過去。'
      outcomes:
        all: 這天沒試飛。科爾曼把老師的地址壓在記錄本裡，和駕駛員一起把留空的那一頁翻到了上面。
        p4: 試飛另擇日期。當天收場時，還沒人往那一欄添新的數字。
        p2: 當地老師把那疊問題收進教室，放到下一堂課要用的本子旁邊。
        p1: 學校的會面按約舉行。散場時，寫著科爾曼名字的紙還有人在門邊等著取。
      none: 活動散了，桌上剩下幾頁無人帶走的名單。
      not_admitted: '{staff}沒能見到學校和機場兩邊的人。有人從門邊提走了最後一隻凳子。'
      desync: 訪校安排從時間表上劃掉。事務所召回{staff}時，校門邊還有孩子等著。
      excerpts:
        p4: 駕駛員把明日以後可用的時段指給她看。她取過鉛筆，把今天那一欄留空。
        p2: 老師把回信地址抄在黑板一角。最後一個走的孩子回過頭，又抄了一遍門牌。
        p1: 前排一個孩子把寫著她名字的紙扶正。等她在桌邊坐下，那孩子才把自己的問題推過去。
    relic: 一張有日期的樣張
    relic_desc: 地面告示，完整排出了科爾曼的姓名。
    points:
      p1: 護住科爾曼的學校行程，別讓趕著籌備試飛的人取消她和學生見面的時間
      p2: 幫科爾曼同當地老師約好一堂後續課，請老師接著回答學生怎樣學飛的問題
      p4: 請機務人員先在地面複查飛機，若還需檢修，就勸科爾曼和駕駛員改天再飛
    points_fail:
      p1: 臨時籌備擠掉了約好的到訪，科爾曼趕不到學校，這條分支與史實脫節，員工當天被召回。
      p2: 孩子們問過學飛的事，散場時還沒有老師答應接著教。
      p4: 舊飛機按原安排升空，科爾曼和駕駛員在試飛中遇難。
    shift:
      p1:
        was: 1926 年 4 月 29 日，科爾曼到傑克遜維爾的黑人公立學校拜訪學生。
      p2:
        was: 科爾曼到傑克遜維爾的學校與學生見面，也想籌辦自己的飛行學校。她生前學校未能開辦。
        now: 這條分支裡，一位老師收好學生的問題，答應再講一堂課。科爾曼留下這位老師的地址，往後有學飛的消息還能寄來。
      p4:
        was: 1926 年 4 月 30 日，科爾曼和駕駛員在帕克森機場的試飛事故中遇難。
        now: 這條分支裡，機務人員建議再做一次地面檢查，科爾曼和駕駛員把試飛改到別的日子。
        who: bessie_coleman_jacksonville
        bio: 科爾曼從傑克遜維爾回去後繼續飛行，也繼續籌辦向黑人學生開放的飛行訓練。
    vignettes:
      proof: 安少了一行，已經把飛行員的名字裁得只剩姓。你刪掉兩個吹捧詞，給全名騰出位置。跑腿人來取時，她請他念全名，再把樣張摺好。有人問誰要飛，他可以直接說出名字。
      school: 劉易斯以為圍觀的人只想知道幾點開場。有孩子在圍欄邊問，這位飛行員在哪兒學的。你告訴他執照是在哪兒發的，把最後一行留給這個可以複述的事實。他取走樣張時，連日期也練著唸了一遍。
      ground: 場邊的人越來越多，你知道明天的告示不會再寫這場表演。安問是不是這會兒就發。你留一份註明日期的樣張，幫她把別的送到門口。你的行程在地面結束，觀眾還在往這兒來。
  fanny_mendelssohn_berlin:
    name: 用自己的名字印六首歌
    place: 柏林
    figure: 範妮·門德爾松·亨澤爾
    story: 範妮·亨澤爾的《六首歌曲》作品一號於 1846 年以她本人的名字出版。次年春，她寫完鋼琴三重奏，也寫了《山間之樂》。5 月 14 日，她在柏林排練時發病，當天去世。三重奏於 1850 年刊行。
    story_prose:
      opening:
        - 1847 年春，柏林。範妮·亨澤爾已經以自己的名字出版了六首歌。鋼琴三重奏寫成以後，她在日記裡說，一時沒有寫出新的樂句。
        - 史實裡，她最後又寫成一首歌，五月十四日在排練時病倒，當天去世。在這條分支裡，排練的人帶來的三份譜，各有不同的記號。
        - 這趟用得上能對譜和跟演奏者講清先後的人。等屋裡出了事，還得有人停下手裡的活，去請幫手。
      points:
        p3: 亨澤爾在排練時沒再翻下一頁。{staff}先讓合唱停下，請門邊的人去找醫生，再問哪一位家人她認得。歌手們往後退，把椅子挪出一條路。 一位家人把譜放到地板上，坐到了她旁邊。剛才沒翻過去的那一頁還敞著。
        p1: '{staff}請排練者稍遲一點來領譜，把亨澤爾早已留給自己寫歌的那段時間空出來。樓下有人開門，她聽見了，也沒有站起來。 她把最後一行寫進譜紙。墨還沒乾，第二次敲門已經響了。'
        p2: '{staff}把工作譜和演奏者手裡的譜排在一處，逐個問改動從哪兒來。亨澤爾看完兩處，拿筆劃去其中一處，又把另一處的落筆加重。 演奏者收起譜時，三個本子都翻在同一頁。'
      outcomes:
        all: 家裡後來拿出同一冊譜來查。幾個人記得那天最後留在她身邊的是誰，也記得她在譜上選的是哪一處。
        p3: 去請醫生的人離開後，屋裡安靜了一會兒。靠近她的椅子再沒有挪開。
        p1: 最後的歌已經寫成。排練的人再上樓時，譜紙還在原處晾著。
        p2: 三重奏的工作譜留了下來。後來家人翻找她的寫法，一下就翻到了那一頁。
      none: 架上幾份譜沒有合起來。收工的人一張一張把它們往背過光的地方挪。
      not_admitted: '{staff}沒能進入排練的屋子。樓下的人聽到一段沒奏完的旋律。'
      desync: 寫歌的時段被排練佔去。事務所召回{staff}時，譜紙上最後一行還是空的。
      excerpts:
        p3: 一位家人把譜放到地板上，坐到了她旁邊。剛才沒翻過去的那一頁還敞著。
        p1: 她把最後一行寫進譜紙。墨還沒乾，第二次敲門已經響了。
        p2: 亨澤爾看完兩處，拿筆劃去其中一處，又把另一處的落筆加重。 演奏者收起譜時，三個本子都翻在同一頁。
    relic: 一頁歌譜
    relic_desc: 一頁手寫的歌譜，署名範妮。
    points:
      p1: 在亨澤爾為排練忙碌時替她守住寫譜的時間，讓她完成最後一首歌
      p2: 把三重奏手稿和排練本攤在一起，請亨澤爾標明哪些改動要留給演奏的人
      p3: 亨澤爾排練時發病，先停下音樂，請人去找醫生，也留個人陪她
    points_fail:
      p1: 排練佔完了時間，最後的歌停在草稿。行程與史實脫節，員工被召回。
      p2: 改動還各記在分譜上。家人要弄清哪些是她認可的，還得逐個問人。
      p3: 大家各自出門找人，屋裡卻還是擁擠。家人得等其他人讓開，才能到她身邊。
    shift:
      p1:
        was: 1847 年 4 月下旬，亨澤爾在日記中寫到三重奏之後創作一度停滯，5 月去世前她完成了最後一首歌。
      p2:
        was: 1847 年 5 月 14 日亨澤爾去世，鋼琴三重奏的初版直到 1850 年才問世。
        now: 這條分支裡，{staff}幫亨澤爾把她選的改動標進一冊工作譜。演奏的人有譜可用，家人日後也能查到她留下的標記。
      p3:
        was: 1847 年 5 月 14 日，亨澤爾在排練中發病，當天去世。
        now: 這條分支裡，{staff}請人去找醫生，也請歌手們先合起譜來。亨澤爾身邊騰出了地方，讓家裡人坐下陪她。
    vignettes:
      cover: 虛構的歌手從中間翻開樂譜，問是誰寫的。你找來散開的題名頁放在旁邊。封面上署的名字足夠確定紙套上該寫什麼。等你把紙理齊，第一首已經唱完。
      forward: 你剛要說後來的收藏者會怎樣找這六首歌，歌手指著散開的封面，問他們還找不找得到它。你請她把封面隨下一份譜一起交出去。一位讀者帶著它走了，再往下的去向你夠不著。
      order: 你對著目錄把六首排好，歌手可以直接翻到要唱的那一首。你另記下一份順序。等門一關，屋裡再響起什麼，你帶不走。
  camille_claudel_paris:
    name: 同一步舞，兩種裙襬
    place: 巴黎
    figure: 卡米耶·克洛岱爾
    story: 克洛岱爾博物館登記了《華爾茲》的多個版本，其中有一件標為 1905 年的青銅鑄件。1913 年，卡米耶的父親在維爾納夫去世。葬禮前她沒有收到死訊。3 月 10 日，她被送進維爾-埃夫拉爾醫院。
    story_prose:
      opening:
        - 1913 年三月，巴黎。卡米耶·克洛岱爾做過不止一版《華爾茲》。工作室裡，她從形狀很近的東西中也能挑出自己要留的那一件。
        - 史實裡，她沒在葬禮前得知父親去世，三月十日被送進醫院。在這條分支裡，一封可以查實的信送到了巴黎，工作室也還有時間交代。
        - 這趟用得上會把難說的消息慢慢說完的人。記東西時，得等卡米耶自己講哪樣留下，交給誰。
      points:
        p2: '{staff}拿了空紙，把卡米耶指過的幾樣東西分開記。旁人想把兩件相近的東西合寫成一行，她把手壓在紙上，要留出兩個位置。 她在最下面寫了收件人的名字。紙頁疊上去以前，她把那一行指給來取的人看。'
        p1: '{staff}先到送信的人那裡核准了日子，再去工作室。卡米耶把信讀過一遍，停了一會兒，問最早哪班車還能趕上。 她把還沒乾透的手在圍裙上擦了兩下，把信放進外衣裡。'
      outcomes:
        all: 離開前，卡米耶把物件的單子交給她自己選的人。他來取時，先把兩個還沒寫清的名字念給她聽。
        p2: 她選的人把單子帶走。後來回到工作室，他依著每一行找到了該取的東西。
        p1: 去維爾納夫的路上，她把那封信又取出來。她只翻到寫日子的地方，看了一眼。
      none: 工作室裡的東西都在原處。桌角有人擺平了一張紙，上面沒有名字。
      not_admitted: '{staff}沒能進去。門鎖從裡面響了一聲，腳步隨後走遠。'
      excerpts:
        p2: 她在最下面寫了收件人的名字。紙頁疊上去以前，她把那一行指給來取的人看。
        p1: 卡米耶把信讀過一遍，停了一會兒，問最早哪班車還能趕上。 她把還沒乾透的手在圍裙上擦了兩下，把信放進外衣裡。
    relic: 一隻青銅手
    relic_desc: 一件小小的青銅手部習作。
    points:
      p1: 把父親的死訊及時帶給卡米耶，讓她自己決定要不要回維爾納夫參加葬禮
      p2: 卡米耶離開工作室以前，問她有哪些東西想託付給熟人，把她的選擇寫下來
    points_fail:
      p1: 消息到巴黎時，葬禮已經結束。卡米耶已經沒法決定要不要回去了。
      p2: 離開工作室的日期有記錄，屋裡幾樣東西交給誰，卻沒有一張她親自交代的紙。
    shift:
      p1:
        was: 1913 年 3 月 3 日，父親路易-普羅斯佩·克洛岱爾在維爾納夫去世，家裡沒有告訴卡米耶，她沒有去送葬。
        now: 這條分支裡，卡米耶及時收到死訊，決定回維爾納夫參加父親的葬禮。
      p2:
        was: 1913 年 3 月 10 日，卡米耶由家人申請送進維爾-埃夫拉爾精神病院，1914 年轉到蒙德維爾格，此後再沒有出來，1943 年 10 月 19 日在那裡去世。
        now: 這條分支裡，{staff}記下卡米耶想怎樣處理工作室裡的幾樣物件。她離開時，自己選定的人拿著這張單子照辦。
    shift_all: 卡米耶來得及決定去父親的葬禮，也親自選了替她照管工作室物件的人。
    vignettes:
      light: 你見過後來的博物館陳列，直到繞著裙襬走一圈，才看見影子怎樣轉。裝箱人正要在兩張標籤上寫同一句，你在邊角各添了一道不同的弧線。箱子要分頭走，開箱的時候你一處也看不到。
      mark: 裝箱人找來兩張寫著同一標題的紙籤。趁箱蓋還沒合，你各補一項，衣褶收在哪兒。兩項也都抄進自己的本子裡。你在資料裡讀過的那筆大理石委託，終究沒有成。
      crate: 裝箱人伸手拿蓋子時，你扶住包紙，沒讓它壓上伸出的裙邊。餘下的紙上，你憑記憶描出一道弧。箱蓋一扣，最後那一點還畫得準不準，你再也對不上了。
  emily_bronte_haworth:
    name: 冬天的牧師住宅
    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 《呼嘯山莊》1847 年以埃利斯·貝爾的名字出版。小說的大段故事借內莉·迪恩講給洛克伍德聽。
    story_prose:
      opening:
        - 1848 年，哈沃思。《呼嘯山莊》已經用埃利斯·貝爾的名字印出來了。在牧師住宅裡，艾米莉還有一冊能從頭翻看的初版。
        - 史實裡，夏洛蒂與安妮七月到倫敦澄清幾個筆名，艾米莉於十二月在家中去世。在這條分支裡，有人願意在去倫敦前幫她們找齊紙件，也願意等她自己開口說要什麼。
        - 這趟需要能認清筆跡和拼寫的人，也需要有人在艾米莉病重時耐心等她說完。
      points:
        p4: '{staff}問艾米莉想坐在哪裡，還問她願意讓誰留在近處。她選了背靠牆的椅子，請人把手邊的書挪過去。{staff}把暖毯遞到她夠得著的地方。 屋裡有人正要挪開另一把椅子。她抬起手，指了指原來擺著的位置。'
        p3: 人物說的話和排印誤字混在一起，{staff}另外揀出幾頁給艾米莉看。她把其中一個拼法讀出聲來，請人把手裡的筆放下，等她說完再改。 艾米莉把要留的詞圈住。她把紙折回去，露出足夠後來人找到的那一角。
        p2: '{staff}替艾米莉把初版翻到她指出的地方。她用指尖抵住斷錯的一行，{staff}就在一張紙上抄下頁碼和改法。 她把紙從對面拉過來核了一遍。兩處數目寫得很近，她在中間留出一道空。'
        p1: '{staff}從幾封信中揀出帶筆名和書名的紙，把名字可核對的幾份分開夾好。夏洛蒂與安妮這才有東西可以帶上路。 袋口有兩份紙在往外滑。夏洛蒂合上袋口前，先摸了摸標著安妮筆名的那一份。'
      outcomes:
        all: 家裡留了兩份能分開讀的清單。一份給再版用，一份夾在舊書裡。冬天那把靠牆的椅子，還在她自己選的地方。
        p4: 家裡照艾米莉的意思佈置那一角。等燈挪近了，書還在她伸手可及的地方。
        p3: 夏洛蒂編新版時翻到那頁，先看見折角，再看見艾米莉留下的圈。
        p2: 後來有人校書，能沿著頁碼找到初版上那行錯印。
        p1: 到了倫敦，兩姐妹把材料分別拿出來。出版人只好把原先並在一起的書名重新分開。
      none: 舊印本放回架上，夾頁還沒有寫完。
      not_admitted: '{staff}沒能進牧師住宅。門廊下落著一點濕雪。'
      desync: 出門的紙沒能按作者分清。事務所召回{staff}時，兩份夾頁還疊在一塊兒。
      excerpts:
        p4: 屋裡有人正要挪開另一把椅子。她抬起手，指了指原來擺著的位置。
        p3: 艾米莉把要留的詞圈住。她把紙折回去，露出足夠後來人找到的那一角。
        p2: 她把紙從對面拉過來核了一遍。兩處數目寫得很近，她在中間留出一道空。
        p1: 袋口有兩份紙在往外滑。夏洛蒂合上袋口前，先摸了摸標著安妮筆名的那一份。
    relic: 一條狗項圈
    relic_desc: 牧師住宅裡那條大狗用過的舊皮項圈。
    points:
      p1: 在倫敦來函把幾位貝爾的作品混起來時，幫哈沃思的姐妹從書信中理出能各自認領的作品
      p2: 發現初版裡不同於原句的誤字時，幫艾米莉留下逐條可查的勘誤
      p3: 趁艾米莉還能核對人物說話的聲音，請她定一份以後重印時可照用的方言校本
      p4: 問艾米莉願意接受哪些照料，請她自己挑在哪裡歇、想讓誰陪在近處
    points_fail:
      p1: 幾份來函仍把書歸到同一個筆名下，姐妹帶不出能分開認領的文件。澄清落空，員工因同步失敗被召回。
      p2: 下次排印的人只能從初版猜測哪些字本來就這樣寫，排字錯誤繼續傳下去。
      p3: 再版時只能由家人判斷哪裡讀不順，改字裡分不清哪些是作者原意。
      p4: 家裡人聽得出她上樓越來越費力。她還沒開口，大家也不知道她願意接受什麼幫助。
    shift:
      p1:
        was: 1848 年 7 月，夏洛蒂與安妮·勃朗特從哈沃思到倫敦，向出版人澄清幾個貝爾筆名並非同一作者。
      p2:
        was: 1847 年版《呼嘯山莊》留有排印錯誤，1850 年新版才作校訂。
        now: '{staff}在艾米莉手邊留一冊可圈改的印本，再把她指出的誤字抄成附有頁碼的清單。'
      p3:
        was: 1848 年艾米莉在哈沃思去世；1850 年的新版由夏洛蒂編輯，其中改動了部分方言拼寫。
        now: '{staff}把方言頁分開請艾米莉逐句審過，將她親自核準的拼寫和仍可改的排印錯誤分明標記。夏洛蒂後來再版時有了這份依據。'
        who: emily_bronte_haworth
        bio: 艾米莉的《呼嘯山莊》留下一部她親自核過方言的印本。後來的重印能夠保留人物的原有說話方式。
      p4:
        was: 1848 年 12 月 19 日，艾米莉在霍沃斯的牧師住宅去世。病中她一直拒絕看醫生，到去世當天才答應。
        now: 這條分支裡，{staff}先問艾米莉的意思。她選了個能歇的地方，也選好誰在近處陪她。家裡人照她的話安排。
    vignettes:
      witness: 讀者以為講故事的人什麼都看見了。你問有一件事她是從哪兒知道的。他把那句話往回找，找到了先說這事的人。
      voices: 讀者整頁只用一個聲音。你請他從內莉接過話頭處再念。聽的人這回聽得出，故事什麼時候交到了另一個人手上。
      mark: 你在換人講述處夾了塊紙。讀者覺得後面一段同剛才牴觸，便先翻回紙簽在的地方。
  qu_yuan_miluo:
    name: 江邊的詩句
    place: 汨羅江
    figure: 屈原
    story: 《楚辭》傳有《漁父》，寫屈原與漁父的文辭問答。《史記》本傳也保留了一版對話。傳本對話是文獻中的記述。
    story_prose:
      opening:
        - 楚地江邊。後人讀《楚辭》，讀到有些詩被歸給離鄉的屈原，也讀到他在水邊遇到一位漁父的故事。
        - 傳世的《史記》寫他在澤畔行吟，面容憔悴。在這條分支裡，有人想把手頭的詩帶走，還剩一束沒抄完。
        - 這趟用得上熟悉書簡和渡口的人，也用得上能找一處安靜地方、把飯留下的人。
      points:
        p2: '{staff}請賣飯的人先留一處空著的席，把飯端來以後退到一旁。屈原坐下，把詩簡放在自己左手邊。他先吃了幾口，後來自己取出一枚來。 他把那一句重新唸了一遍。原先挨著門坐的人，把身子往裡挪了挪。'
        p1: 要過江的人已經在收拾，{staff}先問屈原要留哪束，再讓抄寫的人把已經記下的末句念出來。屈原找出缺在兩枚之間的那一枚，放到原處。 送抄件的人把繩穿回來，把結留在外面。下次要重讀，手一摸就找得到。
      outcomes:
        all: 送抄件的人把那一束帶走了。臨行前，他還記得席上聽到的一句，到了船邊才又翻出來找。
        p2: 飯碗收走以後，留在屋裡的人沒有急著一起走。屈原藉著那一點安靜，又把同一枚簡拿起來。
        p1: 抄件跟著下水的船走了。拿著它的人坐下以後，先把繩結轉到了自己手邊。
      none: 開飯前的位置一直沒人坐。天暗以後，被風掀動的是空席的一角。
      not_admitted: '{staff}沒能找到留飯的地方。擺渡人收了木板，江水仍從板下穿過去。'
      desync: 兩枚簡之間漏了一段。拿抄件的人剛到岸邊，事務所便召回了{staff}。
      excerpts:
        p2: 他把那一句重新唸了一遍。原先挨著門坐的人，把身子往裡挪了挪。
        p1: 送抄件的人把繩穿回來，把結留在外面。下次要重讀，手一摸就找得到。
    relic: 一片寫詩的竹簡
    relic_desc: 一片竹簡，上面是一首長詩中的幾行。
    points:
      p1: 眾人要分頭走時，問屈原想留哪一束詩簡，幫讀者照著次序抄全
      p2: 給屈原留一餐飯和一個能歇腳的位置，若他願意，就坐著聽他念一首詩
    points_fail:
      p1: 讀者帶走的抄件，兩枚簡之間漏了一截。記錄脫節，事務所召回{staff}。
      p2: 飯備好了，能歇腳的位置卻被佔了。沒人能請他坐下安靜待一會兒。
    shift:
      p1:
        was: 《楚辭》收有歸於屈原的詩作。故事中的詩簡交接，是分支對傳抄過程的演繹。
      p2:
        was: 《史記》記屈原流放時披髮行吟澤畔，顏色憔悴，形容枯槁。
        now: 這條分支裡，屈原接下飯食，把一束詩簡擱在身邊。離開以前，他挑了一首念給留下來的人聽。
    vignettes:
      two_tales: 渡船人聽來的收尾跟你帶來的不同。你聽他把整段講完，先記是誰傳的，再對照兩處詞句。
      refrain: 故事講到問話，渡船人接著哼起來。你等曲子完了才問，他最早從哪裡聽到這些話。
      wait: 等開船時，你請講故事的人回到兩人頭一次開口的地方。上岸之後，你還記得是誰先問了一句。
  sima_qian_changan:
    name: 受刑之後寫成的史書
    place: 長安
    figure: 司馬遷
    story: 《漢書·司馬遷傳》保存《報任安書》，信中談到著史的用意和全書體例。
    story_prose:
      opening:
        - 約公元前 98 年，長安。司馬遷替李陵說話後下獄。他後來在《報任安書》裡回想起這段日子，記得史稿當時還只是草創。
        - 史實裡，家中無錢自贖，他受了宮刑，後來寫成史書。在這條分支裡，他家中有人能照管散頁，也有人想替他把一封請求送給經辦人。
        - 這趟需要能按篇辨清史稿的人、能照應受困之人的人，以及能把幾家人的承諾落實到一份請求上的人。
      points:
        p3: '{staff}請願意幫忙的人到桌邊逐個說清願出多少，再把請求與交來的錢一同交到經辦人手裡。經辦人核了數，在副本上寫下收訖。過幾天司馬遷回到家，先點了一盞燈。 他解開最上面那一束，從壓著紙角的地方取出一葉，接著往下寫。'
        p2: '{staff}把換洗的衣服和飯送到收物的地方，等人點過件數才離開。司馬遷打開衣包，先把那件厚的放到腿上。 飯還是溫的。他把碗端到膝間，低頭吃了一口。'
        p1: 家中人已把桌子騰出來。{staff}順著每束上露出的首句核對，把臨時挪走的幾葉找回原位，又囑咐收起來時照同一順序。 最後一束合上以前，家裡人把題簽朝外轉過來。伸手去取下一束時，不用先把別的都搬開。
      outcomes:
        all: 稿子一直留在家裡。司馬遷回來後能從原處續寫，門邊還有人等著替他添燈。
        p3: 請求被收下了。後來有人來家裡問他要不要幫忙，他把面前那束往旁邊放了放，給來客騰了坐處。
        p2: 那件厚衣放在他手邊。等夜深人散，他還能把它重新裹起來。
        p1: 把桌子照看下來的人，臨走前又檢查了一遍題簽。每一束該在的地方還在。
      none: 門邊的人散去後，一盞燈還亮在空桌上。
      not_admitted: '{staff}沒能見到收物的經辦人。帶來的東西還放在門外。'
      desync: 散頁沒有收齊。事務所召回{staff}時，桌上只剩一根解開的繩。
      excerpts:
        p3: 過幾天司馬遷回到家，先點了一盞燈。 他解開最上面那一束，從壓著紙角的地方取出一葉，接著往下寫。
        p2: 飯還是溫的。他把碗端到膝間，低頭吃了一口。
        p1: 最後一束合上以前，家裡人把題簽朝外轉過來。伸手去取下一束時，不用先把別的都搬開。
    relic: 一捆竹簡
    relic_desc: 用繩子編起來的竹簡，每一片寫著一行字。
    points:
      p1: 司馬遷下獄期間，護住他家中尚未寫完的史稿，不散不亂
      p2: 往獄裡送飯送衣，讓他少受獄吏的折辱
      p3: 請認識司馬遷的人湊一筆錢，趁刑罰還沒執行，把他們願出的錢報給經辦官吏
    points_fail:
      p1: 家中的竹簡繩斷簡散，等他出獄時草稿已不全。這條分支與歷史脫節，員工被送回。
      p2: 沒人進得了獄門，這條分支裡他照樣像後來信裡寫的那樣，見了獄吏便低頭叩地。
      p3: 家裡窮，朋友沒有一個出面。這條分支裡和歷史上一樣，他無錢自贖，受了宮刑。
    shift:
      p1:
        was: 約公元前 98 年，司馬遷因李陵之事下獄，按他自己的話，書當時只是草創，還沒寫完。
      p2:
        was: 約公元前 98 年，司馬遷因替李陵辯解下獄，他在《報任安書》裡寫到自己在獄吏面前受的屈辱。
        now: 這條分支裡，{staff}把飯食和冬衣送到了司馬遷手上。夜裡他有衣服裹身，也多了一餐熱飯。
      p3:
        was: 約公元前 98 年，司馬遷因替李陵辯解獲罪，家貧無錢自贖，親友沒有人替他說話，受了宮刑。
        now: 這條分支裡，經辦官吏接受了{staff}替眾人送交的那筆錢。司馬遷免於這次刑罰，可以回去繼續寫手裡的史書。
        who: sima_qian_changan
        bio: 這條時間線裡，司馬遷交錢贖罪，沒有受宮刑。他照樣把從上古寫到當代的那部史書寫完了。
    vignettes:
      dates: 書吏要把兩條合到同一年。你請他各留原來的年次。重新看過，分歧從哪裡開始便看得清。
      witness: 書吏想把好聽些的故事放在前頭。你問兩個說法各是怎樣到桌上的。他先寫明來處，再想該讓讀者先讀哪條。
      binding: 書吏再讀一遍時，你先不繫那兩枚簡。收成一束以後，短簽上寫清還有一個問題待查。
  du_fu_xiang_river:
    name: 船上的詩人
    place: 湘江
    figure: 杜甫
    story: 傳世杜詩《風疾舟中伏枕書懷三十六韻奉呈湖南親友》，題中寫舟中抱病、作詩寄湖南親友，詩裡也寫到水岸景色。
    story_prose:
      opening:
        - 大曆五年，湘水一帶。杜甫有一首寄給湖南親友的三十六韻長詩，詩題說他是在舟中抱病時寫的。
        - 史實留下了詩題和文字，沒有記這份詩如何送到。在這條分支裡，家裡人在船上收過幾次紙，下一回停船還沒決定。
        - 這趟用得上能幫病人把姿勢放舒服的人、能照看詩紙的人，以及認識渡口又聽得準收件姓名的人。
      points:
        p3: '{staff}問杜甫想在哪個渡口停，在那兒找到願意捎稿的人。杜甫隔著船幫跟他慢慢說了要交給誰。那人沒立刻接過來，先把名字唸了一遍。 杜甫聽著聽著點了一下頭。家人這才把紙包遞過船邊，壓進對方握著的手裡。'
        p1: 船又要騰地方給人走動，{staff}先把詩紙一張張數過，照杜甫指的次序移到避風的板下。杜甫伸手取到中間一葉，唸了開頭給他聽。 挪完東西以後，那一處還留著。杜甫不必等人再去找，就能把下一葉抽出來。
        p2: '{staff}問杜甫靠哪一邊舒服，把墊在他身後的舊布帶著折了一下，再把水挪到船幫不晃的地方。他試著坐起來一點，伸手夠到了杯。 船身動了一次。杯子響了一聲，沒有倒。'
      outcomes:
        all: 家人看船從渡口挪開時，替杜甫把原稿放回他手邊。一份還在，一份已經有人帶著往前走。
        p3: 那人上了另一條船，先找了個幹處放紙。兩船錯開時，杜甫還能看到裝紙的布角。
        p1: 詩紙按次序待在避風處。船靠岸以後，杜甫又從那裡抽出中間的一張。
        p2: 杜甫在船上歇了一陣。那隻杯還擱在他自己摸得著的地方。
      none: 岸上最後一條船已經離開。紙包仍放在原先的船裡。
      not_admitted: '{staff}沒能找到那條船。岸上一排纜繩先後從水裡提起來。'
      desync: 騰地方時找不到中間的幾頁。事務所召回{staff}，船家還在拿著首尾兩張等。
      excerpts:
        p3: 杜甫聽著聽著點了一下頭。家人這才把紙包遞過船邊，壓進對方握著的手裡。
        p1: 挪完東西以後，那一處還留著。杜甫不必等人再去找，就能把下一葉抽出來。
        p2: 船身動了一次。杯子響了一聲，沒有倒。
    relic: 一盞船燈
    relic_desc: 一盞小小的陶油燈，為了幾行詩亮到很晚。
    points:
      p1: 在船上給杜甫留一處可以收好詩紙的位置，護住寄湖南親友的長詩從零散紙頁連成全篇
      p2: 舟中照料他的風疾和舊病，減輕他的病痛
      p3: 問杜甫下一程想在哪裡靠岸，幫家人在那裡找一個願意把詩帶給親友的人
    points_fail:
      p1: 匆忙挪艙時只找到頭尾幾張，長詩沒能成篇，事務所因同步失敗召回員工。
      p2: 他伏在枕上，在冬天的船裡一天比一天病重。
      p3: 家人還沒找到能捎信的人，下一條船已經離開。他們只能把詩帶到另一個渡口。
    shift:
      p1:
        was: 大曆五年，杜甫在舟中抱病，寫下寄湖南親友的三十六韻長詩，詩題記下了這些。
      p2:
        was: 寄湖南親友的詩題記下杜甫在船上抱病寫詩。
        now: 那個冬天他在船上少受了些病痛。
      p3:
        was: 詩題把三十六韻寫給湖南親友，未記交遞經過。
        now: 這條分支裡，船在杜甫選的地方靠了岸。渡口有人願意替家人捎去一份詩稿，接手時還能把收稿人的名字念回來。
    vignettes:
      shore: 旅人寫岸上陰沉。你問剛才是什麼讓他從艙裡抬起頭。他想了一會兒，只寫下一樣真正看見的東西。
      delivery: 你聽說下一條船隻去半程。旅人差點沒寫轉交人的名字就折起信。你幫他找了一個能再往前帶的人。
      damp: 旅人把紙擱在濺濕了的板上。你拿張乾的紙墊住，等他把問候寫完。
  vesalius_padua:
    name: 同一幅圖的兩個版本
    place: 雷根斯堡
    figure: 安德烈亞斯·維薩里
    story: 維薩里在 1546 年從雷根斯堡寫出一封信，批評一部縮小翻刻他插圖的書。他認為有些圖在翻刻後出現失真。
    story_prose:
      opening:
        - 1546 年六月，維薩里在雷根斯堡寫信。他談到另一部翻刻過自己插圖的書，反對其中的縮印，也質疑有些線條的走向。
        - 史實裡，這封信留下了他的批評。後人拿兩版互相對照，發現並非所有疑處都有實質差異。在這條分支裡，書商手上還壓著一批未發出的書。
        - 這趟需要能辨認不同版次的人，也需要有人能跟書商談妥，給將要發出的每冊書夾進同一張附頁。
      points:
        p1: '{staff}把兩版攤在櫃檯上，逐處標明哪裡只是印得小、哪裡是維薩里提到的疑點。書商問有幾處能寫得肯定。兩人把沒核實的斷語劃掉，只留下讀者可以翻回去看的頁碼。書商翻開最上面那本，把附頁夾進圖旁。再合上書時，紙邊還露出一線白。'
      outcomes:
        all: 書發出去以後，有人按附頁上的頁碼找另一版借看。兩張圖平放在桌上，中間壓著同一支筆。
        p1: 書發出去以後，有人按附頁上的頁碼找另一版借看。兩張圖平放在桌上，中間壓著同一支筆。
      none: 書商捆好最後一摞書。那張只寫了一半的附頁還留在櫃檯下。
      not_admitted: '{staff}沒能見到掌櫃。櫃檯上的樣書已經翻到圖頁，只有買書的人過去翻了一下。'
      excerpts:
        p1: 書商翻開最上面那本，把附頁夾進圖旁。再合上書時，紙邊還露出一線白。
    relic: 兩處有記號的校樣
    relic_desc: 分支裡的校樣，用兩個記號辨認兩種版次。
    points:
      p1: 請書商給尚未發出的翻刻本夾一張附頁，指出哪些圖值得對照原版
    points_fail:
      p1: 經銷人沒答應，手裡的書仍沒有附上那張勘誤。
    shift:
      p1:
        was: 1546 年 6 月 13 日，維薩里從雷根斯堡寫信，質疑翻刻圖出現失真。
        now: '{staff}說服經銷人附上勘誤，列出受質疑的圖版，供讀者翻查原版。'
        who: vesalius_padua
        bio: 翻刻本的讀者拿到了一張標明維薩里對哪些圖有異議的附頁。
  shakespeare_globe:
    name: 給父親捎句話
    place: 斯特拉特福
    figure: 威廉·莎士比亞
    story: 斯特拉特福的登記簿記著哈姆內特於 1596 年 8 月 11 日下葬，葬前他的父親在哪裡沒有記載。在這條分支裡，家裡託人給他遞信。
    story_prose:
      opening:
        - 1596 年八月的斯特拉特福。教區的登記簿後來會留下孩子的名字和下葬的日子。哈姆內特十一歲。
        - 史實裡，哈姆內特在 8 月 11 日下葬，登記簿沒說父親何時回家。在這條分支裡，家裡摺好一封信，想託人趕在天黑前帶走。
        - 這趟用得上熟悉路上落腳處的人。能讓陌生人答應多走一程，也能幫這封信繼續往前。
      points:
        p1: '{staff}在門口問了兩遍，終於找到一位認得下一處落腳地的捎信人。那人讀過信外的名字，把信放進乾燥的內袋。威廉趕回來時，哈姆內特還醒著。孩子往床裡讓了讓，給父親在床沿挪出一點地方。'
      outcomes:
        all: 威廉坐到窗外全黑。起身取水時，他把椅子挪得離床更近，免得回來時找不著。
        p1: 威廉坐到窗外全黑。起身取水時，他把椅子挪得離床更近，免得回來時找不著。
      none: 暮色到了門口，折過的信還壓在杯子底下。
      not_admitted: '{staff}沒能進到等信的那戶人家。門口有人走過，屋裡沒有開門。'
      excerpts:
        p1: 威廉趕回來時，哈姆內特還醒著。孩子往床裡讓了讓，給父親在床沿挪出一點地方。
    relic: 折起來的一封信
    relic_desc: 分支裡的信，折角留給捎信人記下一位可以託付的人。
    points:
      p1: 找到能聯繫莎士比亞的人，把家裡那封信及時送到，讓父子見一面
    points_fail:
      p1: 員工沒找到能及時把信送到的人。
    shift:
      p1:
        was: 1596 年 8 月 11 日，哈姆內特·莎士比亞在斯特拉特福下葬，登記簿沒記父親葬前是否在場。
        now: '{staff}找到能聯繫莎士比亞的捎信人。這一回，他趕回家，和兒子度過了一個晚上。'
        who: shakespeare_globe
        bio: 莎士比亞在哈姆內特去世前陪了兒子一晚。
  timbuktu_sankore:
    name: 還趕得上一隊人
    place: 馬裡廷巴克圖
    figure: 廷巴克圖的學者們
    story: 1468 年前後，廷巴克圖易手後，一些學者離開當地，有人去了瓦拉塔。在這條分支裡，其中一戶人家想找一隊能同行的人。
    story_prose:
      opening:
        - 約 1468 年，廷巴克圖易手。後來寫下這段歷史的人，記得有讀書人離開了城，有些人去了瓦拉塔。
        - 史實裡，編年史寫到離城的隊伍。在這條分支裡，有一戶人家已經收行李，幾個水袋卻還沒有繫上記號。他們不知道哪隊肯等。
        - 這趟需要認得同行規矩的人，能問清隊伍在等誰，還能陪走第一程。
      points:
        p1: '{staff}在幾隊人裡問到一位願意等這戶人家的領路人，回來請他們點清水和要帶的東西。到第一處落腳點，另一家攤開了一張席。那戶人家的孩子把家裡最小的水袋提過去，放在兩張席之間。他鬆開手以後，小袋子還站得住。'
      outcomes:
        all: 第二天，隊伍收起兩張挨在一起的席。那隻小水袋先被遞上去，然後才有人把孩子抱上來。
        p1: 第二天，隊伍收起兩張挨在一起的席。那隻小水袋先被遞上去，然後才有人把孩子抱上來。
      none: 再有人回頭問時，最後一隊已經走了。一家人把打了結的行李搬回門內。
      not_admitted: '{staff}沒有問到那戶人家。有人在門邊把兩隻水袋往一起攏。'
      excerpts:
        p1: 那戶人家的孩子把家裡最小的水袋提過去，放在兩張席之間。他鬆開手以後，小袋子還站得住。
    relic: 水袋上的計數籤
    relic_desc: 分支裡的計數籤，用來核對那戶人家帶走的水袋。
    points:
      p1: 替一戶離城的人家找到能同行的商隊，陪他們到第一處安全的落腳點
    points_fail:
      p1: 商隊出發前，員工沒能替那戶人家留到位置。
    shift:
      p1:
        was: 1468 年前後，廷巴克圖易手後有學者離開，一些人去了瓦拉塔。
        now: '{staff}讓那戶人家跟上去瓦拉塔方向的一隊人，陪他們走到第一處安全的落腳點。'
        who: timbuktu_sankore
        bio: 離開廷巴克圖的一戶人家找到了同行者，平安到達第一處落腳點。
  al_haytham_cairo:
    name: 借來的那疊光學筆記
    place: 福斯塔特
    figure: 伊本·海賽姆
    story: 1020 年，福斯塔特在動亂中失火。伊本·海賽姆曾在埃及研究光學。在這條分支裡，他約了一位讀者討論光學，借出的手稿正在受災的街上。
    story_prose:
      opening:
        - 1020 年的福斯塔特。編年史說城中幾處失火，許多住處和物件沒能保住。伊本·海賽姆在埃及這些年研究光怎樣進入眼睛。
        - 史實裡，火燒到了住人的街區，史料並未記伊本·海賽姆當天在哪裡。在這條分支裡，一位約好同他讀稿的人住在受災的街上。
        - 這趟需要臨急還能說得清路的人。手稿可以稍後翻看，先得知道讀稿的人能不能走到街口。
      points:
        p1: '{staff}找到讀者時，門裡的光已經暗下來。那人想再進去找一頁稿，{staff}請他先把手上的一疊帶出來，順著街坊空出的路離開。等到了能暫住的人家，他坐下，把那疊沒有齊邊的紙放到膝上。一張紙滑下來。對面的主人彎腰拾起，放回那人指著的地方。'
      outcomes:
        all: 稍後伊本·海賽姆來看他。家裡只有一張凳子，兩個人便在矮桌旁坐下，把那一頁重新找出來。
        p1: 稍後伊本·海賽姆來看他。家裡只有一張凳子，兩個人便在矮桌旁坐下，把那一頁重新找出來。
      none: 街口後來堵住了。伊本·海賽姆來問時，只能把借稿的紙籤折進自己手裡。
      not_admitted: '{staff}在街外等不到領路的人。門洞裡有人喊關門，聲音很快就聽不清了。'
      excerpts:
        p1: 一張紙滑下來。對面的主人彎腰拾起，放回那人指著的地方。
    relic: 另托的一疊稿紙
    relic_desc: 分支裡的光學筆記，臨時托給另一戶人家保管。
    points:
      p1: 趕在火勢蔓延之前帶讀者離開，並給借出的手稿找到一處能存放的地方
    points_fail:
      p1: 員工沒能及時趕到，幫讀者帶著那疊稿紙離開。
    shift:
      p1:
        was: 1020 年，福斯塔特一些街區在動亂中失火。史料沒記伊本·海賽姆及其手稿當日所在。
        now: '{staff}把讀者帶到遠離受災街區的人家。伊本·海賽姆後來仍能和那位讀者一起讀這份手稿。'
        who: al_haytham_cairo
        bio: 福斯塔特失火時，一位讀者和寄在他手裡的光學稿紙一同到了安全的地方。
  li_bai_changan:
    name: 江邊來了一封信
    place: 巫山江邊
    figure: 李白
    story: 李白被流放夜郎，途中遇赦。《李白集》後序把得釋的行程寫到巫山。消息究竟哪天傳到他手裡並不清楚。
    story_prose:
      opening:
        - 巫山一帶的江岸，約 759 年。李白正沿江赴夜郎，後來記他行程的人把遇赦一事寫到了這裡。
        - 史實裡，他途中遇赦而歸，消息確切哪天傳到他手裡已不可考。在這條分支裡，渡口有人帶來抄下的消息，上游的船正在裝貨。
        - 這趟需要認得沿江船路的人。還得能問清消息是哪個渡口傳來的、誰看過原件，才好把它遞到李白手裡。
      points:
        p1: '{staff}先問帶信人從誰手裡拿來的抄件，再去找認得那人筆跡的船客。兩處話對上，這才拿著紙趕下渡口。李白展開紙，把最後一行又看了一遍。船上人在催，他把原先放在上行船裡的鋪蓋捲起來，遞給了下水船的夥計。'
      outcomes:
        all: 下水船繞過渡口時，李白把抄件重新疊好。袖口還是濕的，他拿乾的一面掩住摺痕。
        p1: 下水船繞過渡口時，李白把抄件重新疊好。袖口還是濕的，他拿乾的一面掩住摺痕。
      none: 上行船已經走遠，有人把消息帶到空著的船位。纜樁旁只剩別人沒有帶走的一根草繩。
      not_admitted: '{staff}沒能到那條船邊。岸上各家的船篷挨得很近，能聽見有人在裡頭收行李。'
      excerpts:
        p1: 李白展開紙，把最後一行又看了一遍。船上人在催，他把原先放在上行船裡的鋪蓋捲起來，遞給了下水船的夥計。
    relic: 一張護信紙
    relic_desc: 分支裡的護信紙，渡江時可以把信包好。
    points:
      p1: 趕在船再往上游走之前，把核實過的赦訊送到李白手裡
    points_fail:
      p1: 船開以前，員工沒能把消息送到。
    shift:
      p1:
        was: 約 759 年，李白流放夜郎途中遇赦。《李白集》後序把這段行程寫到巫山。
        now: '{staff}趕在下一趟船開之前到達渡口。李白聽完消息，搭當日下行的船往回走。'
        who: li_bai_changan
        bio: 李白趕在下一趟船開以前收到赦訊，提前踏上歸途。
  li_shizhen_qizhou:
    name: 送來一頁試印
    place: 蘄州
    figure: 李時珍
    story: 李時珍多年修訂《本草綱目》，後來金陵本在他去世後問世。在這條分支裡，印工可以先給他寄一頁試印。
    story_prose:
      opening:
        - 約 1592 年，蘄州。李時珍已經用了很多年改訂《本草綱目》。他生前能反覆翻開的，是自己還可以動筆的稿本。
        - 史實裡，完整的金陵本在他身後才問世。在這條分支裡，印工手裡有一張先試出來的紙，能不能從金陵寄到蘄州還沒說定。
        - 這趟用得上熟悉出版或校對的人。要能跟兩地的人講清，紙寄來給誰看，改完又托誰帶回。
      points:
        p1: '{staff}先和印工說好只寄一頁，請往返兩地的熟人帶到蘄州，又約他返程來取。李時珍把舊稿和這張紙攤開，用指甲劃住自己要對的一行。他在頁邊寫了個字，等墨乾，才把兩張紙分別疊回去。'
      outcomes:
        all: 來取的人隔天才到。李時珍把幹了的紙交給他，手指還停在自己改過的那個字上。
        p1: 來取的人隔天才到。李時珍把幹了的紙交給他，手指還停在自己改過的那個字上。
      none: 始終沒有試印送來。他在稿本上改過那個字，又把墨放到遠離紙邊的地方。
      not_admitted: '{staff}沒見到能托帶試印的人。幾捆紙從鋪門進出，包裹上的收處各不相同。'
      excerpts:
        p1: 李時珍把舊稿和這張紙攤開，用指甲劃住自己要對的一行。他在頁邊寫了個字，等墨乾，才把兩張紙分別疊回去。
    relic: 一頁試印
    relic_desc: 分支裡的試印，頁邊留給作者親自改字。
    points:
      p1: 請印工先送一頁試印到蘄州，讓李時珍還有機會親自校一遍
    points_fail:
      p1: 員工沒能安排試印及時送到。
    shift:
      p1:
        was: 至 1596 年，金陵本已在李時珍身後問世。他未見全書刊行。
        now: '{staff}爭取到一頁試印。李時珍在桌邊讀完，往頁邊寫了一條改字意見，把那頁送回去。'
        who: li_shizhen_qizhou
        bio: 全書問世以前，李時珍親自看過並改過一張試印。
  bose_calcutta:
    name: 那張一直沒有兌的支票
    place: 加爾各答
    figure: 賈格迪什·錢德拉·博斯
    story: 1885 年，博斯到總統學院教物理。他的薪俸低於歐洲同事。他繼續授課，但在爭議解決前不肯領較低的薪俸。
    story_prose:
      opening:
        - 1885 年，加爾各答。博斯在總統學院教物理。學校給他的薪俸低於做同樣工作的歐洲同事，他仍照常上課。
        - 史實裡，從拒領較低薪俸到爭議解決過了約三年。在這條分支裡，頭一筆錢還沒領，賬房仍有機會重開一張支票。
        - 這趟用得上讀得懂薪俸條款的人。把兩份工作擺在一起談時，還需要有人能讓負責簽字的人聽完。
      points:
        p1: '{staff}把同一周的課表抄在一張紙上，對照兩份薪俸條件，陪博斯到辦公室等一本賬簿送來。博斯等對方把新條款寫完，拿指尖沿著數目讀了一遍。那張支票又從桌面另一頭遞過來。這一回，他用兩隻手接住了。'
      outcomes:
        all: 博斯回到課堂時，桌上的實驗還沒擺好。他把支票裝進衣袋，先把留給學生的位置擦乾淨。
        p1: 博斯回到課堂時，桌上的實驗還沒擺好。他把支票裝進衣袋，先把留給學生的位置擦乾淨。
      none: 賬房又送來原來那筆數目。博斯看了一眼，把那張紙原樣推回櫃檯。
      not_admitted: '{staff}沒能進簽字的那間辦公室。走廊那頭有人下課，木地板響了一陣。'
      excerpts:
        p1: 那張支票又從桌面另一頭遞過來。這一回，他用兩隻手接住了。
    relic: 一張薪俸收據
    relic_desc: 分支裡的收據，記著他願意領的第一張支票。
    points:
      p1: 在博斯執教的第一年，為他爭取一份與同事同等薪俸的書面答覆
    points_fail:
      p1: 員工沒在第一年談成同等條件，博斯仍不肯領較低的薪俸。
    shift:
      p1:
        was: 1885 年，博斯開始在總統學院教書。他拒領較低的薪俸，爭議約三年才解決。
        now: '{staff}爭取到與同事同等的書面薪俸條件。博斯讀過條款，領了按這個條件開出的第一張支票。'
        who: bose_calcutta
        bio: 博斯在總統學院執教第一年便獲得了同等薪俸。
  li_qingzhao_hangzhou:
    name: 這一箱先寄在鄰家
    place: 會稽
    figure: 李清照
    story: 李清照記下，寓居會稽時，她的書畫已經歷過幾次散失。她在當地又遇失竊，後來尋回十八軸。
    story_prose:
      opening:
        - 李清照到會稽寓居時，手裡的書畫已經散過幾回。她後來寫《金石錄後序》，還能說清這一趟陸續失了些什麼。
        - 史實裡，她在會稽遭竊，後來尋回十八軸。在這條分支裡，箱子還都在房裡。有一箱靠著床，她每天伸手就夠得著。
        - 這趟用得上懂得照管書畫的人。遇到別人不肯答應，還得耐著性子問清東西能放在哪、她要取時該敲哪扇門。
      points:
        p1: 李清照打開靠著床的箱子，翻出兩卷，放回去一卷。{staff}請鄰人先來認好箱子和鎖，再讓兩人在同一張箱簽上各按一個記號。搬出門以前，她又把一支短筆塞進蓋下的空處。鄰人托住箱底，她提著另一邊，兩個人一前一後過了門檻。
      outcomes:
        all: 後來她取回箱子，先找的就是那支筆。筆還躺在蓋邊。她從紙角試了一道，墨洇開得比從前慢。
        p1: 後來她取回箱子，先找的就是那支筆。筆還躺在蓋邊。她從紙角試了一道，墨洇開得比從前慢。
      none: 東西散去以後，她把尋回的卷軸攤開數。數到最後，她把兩手停在空出來的桌面上。
      not_admitted: '{staff}沒能見到李清照。隔著門，屋裡傳來箱蓋合上的聲音。'
      excerpts:
        p1: 搬出門以前，她又把一支短筆塞進蓋下的空處。鄰人托住箱底，她提著另一邊，兩個人一前一後過了門檻。
    relic: 一張箱籤
    relic_desc: 分支裡的箱籤，標記李清照親自挑出、另寄在鄰家的一箱。
    points:
      p1: 請一位可靠的鄰人，在失竊前接下李清照親自挑出的一箱書畫
    points_fail:
      p1: 員工沒能找到肯替她收存那一箱的人。
    shift:
      p1:
        was: 約 1131 年，李清照記述在會稽寓居時遭遇失竊，後來尋回十八軸。
        now: '{staff}請到鄰人，把她親自挑的那一箱收在另一處。李清照後來回來取箱，裡面的東西還在。'
        who: li_qingzhao_hangzhou
        bio: 李清照收回了一箱曾寄在鄰家保管的書畫。
  ibn_al_nafis_cairo:
    name: 單獨托給一位讀者
    place: 開羅
    figure: 伊本·納菲斯
    story: 伊本·納菲斯臨終把藏書留給醫院。他計劃撰寫的醫學大全沒有完成，現存卷冊分散。在這條分支裡，還有一位讀者願意接下一卷自己能夠保管的成稿。
    story_prose:
      opening:
        - 1288 年，開羅。伊本·納菲斯臨終把藏書留給了醫院。他那部計劃寫得很長的醫學大全沒有寫完，今天尚見的只是一部分。
        - 史實裡，傳記記下了他的藏書處置，沒逐一說清每卷後來到了哪裡。在這條分支裡，有位常來翻書的讀者，想把自己正在讀的一卷借完。
        - 這趟用得上懂書怎麼歸還、怎麼借出去的人。約定得留下後來人也找得到的地址。
      points:
        p1: 讀者本來只想借到月底。{staff}請兩人先說定，這一卷最後放在哪裡、旁人來讀時找誰開門。伊本·納菲斯翻過封面，給他指出尚未校過的地方。讀者把借據攤在書上，用拇指把自己剛籤的名字蓋住了一半。等紙上的墨乾透，他才把手移開。
      outcomes:
        all: 後來有人按借據的地址來找這卷書。開門的人取下卷冊，把夾在第一葉裡的紙一同遞過去。
        p1: 後來有人按借據的地址來找這卷書。開門的人取下卷冊，把夾在第一葉裡的紙一同遞過去。
      none: 沒有人肯留下可以長期借閱的地址。借據還攤著，書仍在原來那摞裡。
      not_admitted: '{staff}沒能進屋。窗邊的人轉過一頁，沒聽見門外的腳步。'
      excerpts:
        p1: 讀者把借據攤在書上，用拇指把自己剛籤的名字蓋住了一半。等紙上的墨乾透，他才把手移開。
    relic: 一張署名的借據
    relic_desc: 分支裡的借據，記著誰答應照看這一卷。
    points:
      p1: 請伊本·納菲斯把一卷成稿托給另一位讀者，並確認後來的人還能借閱
    points_fail:
      p1: 員工沒能找到願意對這一卷負責的讀者。
    shift:
      p1:
        was: 1288 年，伊本·納菲斯去世，將藏書留給醫院。他的醫學大全今天只存部分卷冊。
        now: '{staff}請到另一位保管人，在交接時寫明日後在哪裡可以查閱。其餘藏書照他的原意託付。'
        who: ibn_al_nafis_cairo
        bio: 他的醫學大全有一卷在分支裡交由第二位保管人，後來仍可借閱。
  sappho_lesbos:
    name: 船還沒走
    place: 萊斯博斯島米蒂利尼
    figure: 薩福
    story: 《帕羅斯編年碑》記載，薩福離開米蒂利尼流亡西西里。碑文的日期有殘缺，年份只能取約數。在這條分支裡，她想見的人還不知道船幾點開。
    story_prose:
      opening:
        - 米蒂利尼的海岸。離薩福去西西里已有幾百年時，帕羅斯的一塊石碑才記下這一趟遠行。現在連碑上的年份也殘了。
        - 史實裡，薩福離開米蒂利尼流亡西西里，原因無從確知。在這條分支裡，她有一位想當面道別的人，船家卻已經在把行李往船上遞。
        - 這趟用得上認得碼頭和街巷的人。知道托誰找到一個還沒聽到船訊的人，比催船家有用。
      points:
        p1: '{staff}把隨船放行李的地方問清，托船家看著薩福的包，然後照她說的門口標記去找人。兩人趕回渡口時，搬東西的人剛空出一截岸邊。那人替薩福把手上鬆開的結繫好。薩福沒有把手收回去，直到船家來叫她。'
      outcomes:
        all: 船從岸邊退開時，薩福抬起繫繩的那隻手。岸上的人一直站在下船時要踩的那塊石頭上。
        p1: 船從岸邊退開時，薩福抬起繫繩的那隻手。岸上的人一直站在下船時要踩的那塊石頭上。
      none: 船先走了。等那人找到渡口時，留在石上的只是一截浸濕的纜繩。
      not_admitted: '{staff}到了岸邊，沒能找到認識薩福的人。有人蹲在最末一級石階上，把手裡的繩理直。'
      excerpts:
        p1: 那人替薩福把手上鬆開的結繫好。薩福沒有把手收回去，直到船家來叫她。
    relic: 一根打過結的繩
    relic_desc: 分支裡的繩，和她一起等船的人系在手上。
    points:
      p1: 在去西西里的船出發前，把薩福想見的人帶到渡口
    points_fail:
      p1: 船離岸以前，員工沒能把薩福請來道別的人帶到。
    shift:
      p1:
        was: 約公元前七世紀末至六世紀初，《帕羅斯編年碑》記薩福自米蒂利尼渡海流亡西西里。
        now: '{staff}帶著薩福托找的人走到渡口。上船前，兩個人還有時間當面道別。'
        who: sappho_lesbos
        bio: 離開米蒂利尼去西西里以前，薩福有機會和她想見的人當面道別。
  hipparchus_rhodes:
    name: 今夜親眼再看一次
    place: 羅得島
    figure: 喜帕恰斯
    story: 喜帕恰斯留下的評注指出，一首流傳很廣的觀星詩裡有失準之處。在這條分支裡，一位讀者準備照詩裡寫的星位教給別人。
    story_prose:
      opening:
        - 約公元前二世紀末，羅得島。觀星的人讀詩，也靠它記哪幾顆星會一道升起。喜帕恰斯後來留下的評注逐處核這類說法。
        - 史實裡，評注指出熟讀的詩句有些與觀察不合。在這條分支裡，一位讀者已經把其中一句教給學生，準備照原話再講一次。
        - 這趟用得上能明白書裡說法的人。還得說得動一個已經講過這堂課的人，再到外面多等一會兒。
      points:
        p1: '{staff}請那位讀者把準備教的一句讀一遍，再陪他和喜帕恰斯走到能看清低處的地方。第一處星光露出時，讀者抬手想說就是這兩顆，話到一半停了。另一個位置還是黑的。他用指頭空指著那裡，等到第二顆出來才把手放下。'
      outcomes:
        all: 下次教學生，他先把書合上，請大家等第一顆升起來。唸到那句熟詩時，他把後半句留到下一道光出現。
        p1: 下次教學生，他先把書合上，請大家等第一顆升起來。唸到那句熟詩時，他把後半句留到下一道光出現。
      none: 那人照舊讀完了那句詩。屋門已經合上，第二顆星才從外面低處露出。
      not_admitted: '{staff}沒能見到那位讀者，只聽見有人隔門背誦一句，唸了兩遍。'
      excerpts:
        p1: 另一個位置還是黑的。他用指頭空指著那裡，等到第二顆出來才把手放下。
    relic: 地平線上的兩道刻記
    relic_desc: 分支裡的觀測紙條，兩道刻記分別記下兩次升起。
    points:
      p1: 說服那位讀者和喜帕恰斯同看一夜，再決定怎麼教那兩處星位
    points_fail:
      p1: 員工沒能說服那位讀者留下來對照一夜。
    shift:
      p1:
        was: 約公元前二世紀末，喜帕恰斯在評注中指出，常讀的觀星詩裡有些並寫的星並不同時升起。
        now: '{staff}請那位讀者重新來觀測一夜。讀者分開看到兩次升起，改了原本要教給學生的說法。'
        who: hipparchus_rhodes
        bio: 一位用舊詩教觀星的讀者親自複核了有爭議的星位，把修正後的觀察教給學生。
  modigliani_paris:
    name: 肖像背後的一張紙籤
    place: 巴黎
    figure: 阿梅迪奧·莫迪利亞尼
    story: 1919 年 5 月底，阿梅迪奧·莫迪利亞尼和讓娜·埃比泰納帶著前一年 11 月出生的女兒，從尼斯回到巴黎。他的結核越來越重，到秋天已沒有力氣作畫。1920 年 1 月 24 日，他因結核性腦膜炎在巴黎慈善醫院去世，三十五歲。兩天後，懷孕八個月的讓娜在父母家去世。1 月 27 日的葬禮，是畫家朋友們湊錢辦成的。兩年前，他生前唯一一次個展銷路慘淡。
    story_prose:
      opening:
        - 1920 年 1 月，巴黎。莫迪利亞尼和讓娜·埃比泰納帶女兒從尼斯回來已有半年多。他的病漸重，到了秋天，畫筆已拿不穩。
        - 史實裡，莫迪利亞尼在慈善醫院去世，讓娜兩天後也去世。在這條分支裡，畫室的門還有人敲，醫院和讓娜身邊也可能有人接手。
        - 這一趟用得上能讓畫家聽進去話的人，也用得上照護病人、帶著合用器材的人。讓娜身邊還需要能耐心坐得住的人。
      points:
        p1: '{staff}把肖像移到亮處，指著其中一張，說很多年以後，還會有人走很遠的路來看畫上的人。畫背的紙籤翹起一角。莫迪利亞尼把畫轉過來，讓那張紙籤靠進掌心。'
        p2: '{staff}趕到畫室，靠照護的經驗讓病人安穩下來，跟著送他去慈善醫院的人走到接手處。門內有人拖來一把椅子。等來人接手，{staff}才從扶了一路的門框邊讓開。'
        p3: 在醫院，{staff}用帶來的器材治療，在床邊等他能自己把杯子放回去。杯底在桌上碰了一聲。莫迪利亞尼把另一隻手伸過去，把杯子又往裡推了推。
        p4: '{staff}留在讓娜身邊照料，等她願意吃點東西，再把碗放到她夠得著的地方。讓娜把碗托在腿上。窗邊那張舊紙被風掀起來，她伸手拿碗沿壓住了紙角。'
      outcomes:
        all: 畫室後來又開了門，讓娜也重新拿起畫筆。桌邊有兩張矮凳，靠窗的一張沾了一點顏料。
        p3: 病好以後，莫迪利亞尼回了畫室。桌上放著一張沒畫完的臉，畫筆橫在紙邊。
        p4: 後來，讓娜又畫了畫。等兩個孩子睡下，她把一張紙展到燈旁。
        p1: 很多年後，有人在畫前站住了腳。畫背那張紙籤還壓在框裡。
        p2: 醫院收下了病人。陪他走過那一程的人最後坐在門內那把椅子上。
      none: 畫室門邊沒有人。門下那一道亮光，天黑以後也看不見了。
      not_admitted: '{staff}沒能走進畫室。樓梯拐角那袋煤還靠著牆。'
      desync: 送醫的事沒能接上。{staff}被召回時，樓道里還空著半截。
      excerpts:
        p3: 杯底在桌上碰了一聲。莫迪利亞尼把另一隻手伸過去，把杯子又往裡推了推。
        p4: 讓娜把碗托在腿上。窗邊那張舊紙被風掀起來，她伸手拿碗沿壓住了紙角。
        p1: 畫背的紙籤翹起一角。莫迪利亞尼把畫轉過來，讓那張紙籤靠進掌心。
        p2: 門內有人拖來一把椅子。等來人接手，{staff}才從扶了一路的門框邊讓開。
    relic: 一截炭條
    relic_desc: 一截能把手指染黑的炭條。
    points:
      p1: 趁他還清醒，讓他知道他畫的這些人以後會被很多人記住
      p2: 他在畫室裡病重、幾天沒人來問的時候，護住他被送進慈善醫院的那一程
      p3: 在慈善醫院裡，治好他的結核性腦膜炎
      p4: 一月下旬，陪在懷孕八個月的讓娜·埃比泰納身邊，幫她熬過那幾天
    points_fail:
      p1: 這條分支裡，唯一那場個展銷路慘淡後，沒人告訴過他，那些肖像以後會去哪裡。
      p2: 這條分支裡沒有人及時進門，他沒能被送到慈善醫院，與史實脫節，事務所召回員工。
      p3: 這條分支裡病照舊發展，1 月 24 日他在慈善醫院去世，三十五歲。
      p4: 這幾天裡，員工沒能留在讓娜身邊照看她。
    shift:
      p1:
        was: 1917 年 12 月 3 日，警方干預了莫迪利亞尼生前唯一一次個展。展覽銷路慘淡。
        now: '{staff}在他病倒以前告訴他，他畫的這些人以後會掛進世界各地的美術館。'
      p2:
        was: 1920 年 1 月，莫迪利亞尼病重，被送進巴黎慈善醫院。
      p3:
        was: 1920 年 1 月 24 日，莫迪利亞尼因結核性腦膜炎在巴黎慈善醫院去世，三十五歲。
        now: '{staff}帶去的藥治好了他的病，他出了院，回到畫室。'
        who: modigliani_paris
        bio: 莫迪利亞尼在 1920 年冬天病癒，又畫了許多年，畫的仍是身邊的人。
      p4:
        was: 1920 年 1 月 26 日，莫迪利亞尼去世兩天後，懷孕八個月的讓娜·埃比泰納在父母家中去世，留下十四個月大的女兒。
        now: '{staff}那幾天一直守在她身邊。這條時間線裡，讓娜生下了孩子，帶著一兒一女長大，後來又拿起了畫筆。'
        who: jeanne_hebuterne
        bio: 讓娜·埃比泰納在 1920 年冬天活了下來，生下第二個孩子，帶大兩個孩子，並繼續畫畫。
    vignettes:
      coal: 1 月 10 日，{staff}替賣煤的人把一袋煤扛上樓。他說今年少有人買整袋，往往只買半袋。袋子放到拐角，他伸手撣去樓梯扶手上的煤灰。
      saucers: 二月初，{staff}幫咖啡館夥計收桌。夥計用碟子數杯，朝裡桌努了努嘴，那裡幾隻碟子摞得最高，底下還壓著一張畫。
      mimosa: 三月初，{staff}替市場裡的女人解開一捆含羞草。她說花是夜車帶來的，解開繩子時，一抹黃掉進了圍裙的褶裡。
  hooke_london:
    name: 實驗的管理人
    place: 倫敦
    figure: 羅伯特·胡克
    story: 有人翻出胡克的《顯微圖譜》，照著圖版描軟木裡的小格。描著描著，格子齊得像蜂巢，原圖卻沒那麼整齊。屋裡還放著幾捆講稿和實驗記錄。等幾年後別人來翻，也得分清哪一頁本來是空的，哪一頁是真的缺了。
    story_prose:
      opening:
        - 1703 年，倫敦。胡克的《顯微圖譜》裡，軟木的格子像蜂巢，邊線卻並不齊整。屋裡的讀者順著圖版描，描到歪處就想補齊。
        - 史實裡，沃勒後來刊行了一部分講稿，還有些遺稿等了更久才由別人整理。在這條分支裡，潮氣上來的屋子裡有人翻圖，也有人來挪紙捆。
        - 這一趟用得上管得住講稿、能給別的紙捆留目錄的人。懂得讀圖、能讓讀者看見一條斷線的人，也有事可做。
      points:
        p1: 紙堆要搬動，{staff}依原來的次序點清講稿，把卷起來的幾頁歸回同一捆。紙捆換了地方，最上面還壓著原來的封頁。收繩時，{staff}避開了露在外面的紙角。
        p2: '{staff}把餘下各捆的題名逐一抄到目錄上，再沿著紙捆重對一遍。目錄放在箱蓋一抬就看得見的地方。最後一行墨還沒乾，{staff}把箱蓋留了一指寬。'
        p3: '{staff}把描圖和原圖並著拿給胡克，請他認一認哪裡該留斷。胡克的手指停在兩張圖之間。那兩段沒接起來的線，最後還露著紙的底色。'
      outcomes:
        all: 兩年後講稿成書，沒入書的那些紙也有了題名。後來有人掀開箱蓋，先拿起薄薄一張目錄。
        p2: 有人來找一段沒刊行的實驗記錄，報得出紙捆上的題名。箱蓋打開，最上面就是目錄。
        p3: 後來讀者重翻那張描圖。手指沿一格走了一圈，到缺口處停了下來。
        p1: 沃勒後來接到那捆講稿。翻開封頁，裡面的紙還照原來的次序疊著。
      none: 箱蓋落下去，屋裡只聽到紙擦木頭的聲音。窗前還有一張沒描完的圖。
      not_admitted: '{staff}沒進到放講稿的屋裡。門縫的光照出木箱一角。'
      desync: 挪過的講稿散開了。{staff}被召回時，繩子還平放在桌上。
      excerpts:
        p2: 目錄放在箱蓋一抬就看得見的地方。最後一行墨還沒乾，{staff}把箱蓋留了一指寬。
        p3: 胡克的手指停在兩張圖之間。那兩段沒接起來的線，最後還露著紙的底色。
        p1: 紙捆換了地方，最上面還壓著原來的封頁。收繩時，{staff}避開了露在外面的紙角。
    relic: 一幅跳蚤的圖
    relic_desc: 《顯微圖譜》裡那幅摺頁跳蚤版畫的摹本。
    points:
      p1: 挪動紙堆時把講稿留在一起，讓沃勒日後仍能找齊要入書的稿子
      p2: 給講稿以外的紙捆另留一張目錄，讓後來的編者有題名可查
      p3: 趁胡克還看得到那張描圖，把它拿給他看，問哪幾處該留著斷線
    points_fail:
      p1: 一捆講稿跟零散紙件一道運走。沃勒後來湊不齊彙編所需的紙頁，事務所召回員工。
      p2: 下一個編者看得出哪些稿印了出來，目錄卻沒告訴他其他的稿在哪裡。
      p3: 描圖夾回書裡，讀者已經把斷線都接上了，也沒來得及問。
    shift:
      p1:
        was: 胡克 1703 年去世。由理查德·沃勒整理的遺著彙編於 1705 年刊行。
      p2:
        was: 沃勒的彙編只保存部分遺稿。胡克的部分日記及其他遺留文獻經另一些編輯才陸續出版。
        now: 箱裡多了一張目錄。下次有人來找沒印出來的實驗記錄，可以先報出紙捆的題名。
      p3:
        was: 胡克在《顯微圖譜》裡把軟木的小孔比作蜂巢，同時指出它們的形狀並不規整。
        now: '{staff}把描圖和舊版畫攤在一起。胡克指給讀者看，哪裡開始就對不上了。那兩道斷開的線，他沒有再補。'
    vignettes:
      edge: 讀者順著小格描完兩條邊，順手添了第三條。{staff}把紙舉到窗前，最直的一道正是剛添的。
      analogy: '{staff}請讀者找一個塞不進蜂巢的格。兩隻手指伸過去，碰在同一條歪邊上。'
      plate: 讀者揭開摺頁，一隻跳蚤鋪了半張桌。{staff}壓著紙角，等墨水瓶挪開。
  leavitt_cambridge_ma:
    name: 星星的一條規則
    place: 馬薩諸塞州劍橋
    figure: 亨麗埃塔·勒維特
    story: 1912 年，哈佛天文臺的通報把小麥哲倫雲裡二十五顆變星按週期排成一張表。勒維特把最亮和最暗時的讀數分別畫成圖。兩張圖上，明暗變化一輪所需時間越長，星就越亮。
    story_prose:
      opening:
        - 1912 年，馬薩諸塞州劍橋。勒維特把小麥哲倫雲裡二十五顆變星按週期排成表，又畫出它們最亮和最暗時的讀數。週期越長的星，在兩張圖上都越亮。
        - 史實裡，週期表刊在哈佛天文臺通報上。後來研究者用銀河系裡的造父變星完成首次定標。在這條分支裡，有人接著核底片，也有人能把候選星名單隨觀測申請送上去。
        - 這一趟用得上能把很暗的星對回底片的人，也用得上能把下一步觀測的理由講清楚的人。
      points:
        p1: 排印前，{staff}對著玻璃底片和暗星的讀數一格格核准。少掉的那顆找到了，勒維特把它放回原來的週期位置。長尺沿著最後一行挪開。透過玻璃看去，那一點還留在原處。
        p2: '{staff}把通報還沒解決的定標難題寫進觀測申請，把候選星的名單附在後面。後來的量測送到時，勒維特把兩張紙併攏。她的鉛筆跨過紙縫，停在同一顆星上。'
      outcomes:
        all: 週期表印了出來，後來又有觀測送到桌上。勒維特拆開封套，把新的讀數攤到舊圖旁。
        p2: 勒維特後來和合作者一同核過新的量測。他們把兩份樣本並排壓在桌上，同一顆星下有兩道鉛筆印。
        p1: 排印後的通報攤開在桌面上。兩張圖上的點還沿著原來的斜線。
      none: 底片一張張收了起來。最上面的一片滑到匣邊，露出光下的一角。
      not_admitted: '{staff}沒能進到核底片的地方。玻璃匣從門內送過時，邊角閃了一下。'
      desync: 表上的空格留到了交稿。{staff}被召回時，尺子還壓著沒對上的那一行。
      excerpts:
        p2: 後來的量測送到時，勒維特把兩張紙併攏。她的鉛筆跨過紙縫，停在同一顆星上。
        p1: 長尺沿著最後一行挪開。透過玻璃看去，那一點還留在原處。
    relic: 一塊玻璃底片
    relic_desc: 一塊佈滿細小星點的照相底片。
    points:
      p1: 排印前幫勒維特把暗星觀測與玻璃底片對上，護住二十五顆變星的週期表
      p2: 用通報裡留下的定標難題爭取觀測時間，讓勒維特本人參與下一步
    points_fail:
      p1: 錯號讓排印人員刪去無法查對的幾行，二十五顆星的週期表沒有發表。行程同步失敗，員工被召回。
      p2: 論文留下了亮度與週期的關係，給它定出絕對尺度的工作要由外地的研究者接手。
    shift:
      p1:
        was: 1912 年 3 月 3 日，哈佛天文臺第 173 號通報刊登了勒維特整理的二十五顆小麥哲倫雲變星週期。
      p2:
        was: 1913 年，首次定標採用了銀河系中的造父變星。
        now: '{staff}把候選星名單附在觀測時間申請上。等新一批量測結果送到，勒維特能和合作者一起核對樣本。'
        who: leavitt_cambridge_ma
        bio: 勒維特繼續做變星的亮度研究，並參與將自己的關係式用於測量距離。她給後來的定標留有自己的觀測說明。
    vignettes:
      rank: '{staff}念出週期，抄表人翻到底片目錄的後一頁。少掉的星號回來以前，圖上的點一個也沒挪。'
      distance: '{staff}並起兩張圖，指出刻度差了一格。對方先擦掉那個數字，橡皮屑落在兩張紙的縫裡。'
      period: 抄表人報完亮度就要換行。{staff}把尺按在紙邊，等最後一個週期也抄過來才鬆手。
    remarks:
      trait_methodical: '{staff}將底片收回紙套前，又對了一遍星號。'
  tang_xianzu_linchuan:
    name: 寫愛情超越死亡的戲
    place: 臨川
    figure: 湯顯祖
    story: 湯顯祖在《牡丹亭》題詞末署萬曆戊戌秋，即 1598 年秋。戲到第十齣，杜麗娘遊過春日的園子，入睡後在夢裡遇見一位年輕書生。
    story_prose:
      opening:
        - 1598 年秋，臨川。湯顯祖在《牡丹亭》的題詞末寫下年月。戲裡，杜麗娘遊過園子，在夢中遇見一個書生。
        - 史實裡，後來有人改曲文以便演唱，湯顯祖寫信要宜黃的演員用他的原本。在這條分支裡，排練的人手邊有一張改過的紙，還有一處接不上的唱詞。
        - 這一趟用得上識得錯字、聽得出哪裡丟了接句的人。懂曲文又能把臺上臺下對起來的人，也有事做。
      points:
        p1: '{staff}把排練紙覆在湯顯祖核過的原本旁，順著演員的唱腔找出落掉的字，再把完整的本子抄給宜黃戲班。臺下把定本翻到同一頁，跟著一聲一聲往下聽。該接的地方，等在臺邊的人抬起了腳。'
      outcomes:
        all: 後來那一齣仍按定本排唱。等候上場的人手裡夾著一張紙，折角正落在他的接句旁。
        p1: 後來那一齣仍按定本排唱。等候上場的人手裡夾著一張紙，折角正落在他的接句旁。
      none: 排練紙翻過一頁。下一句該誰唱，臺邊的人還拿著那張少寫幾個字的紙。
      not_admitted: '{staff}沒能進到排練的地方。牆裡傳出一聲唱，牆外只看得到移開的那把椅子。'
      excerpts:
        p1: 臺下把定本翻到同一頁，跟著一聲一聲往下聽。該接的地方，等在臺邊的人抬起了腳。
    relic: 一冊刻印的曲本
    relic_desc: 給歌者用的刻本，每支曲牌的名字寫在上方。
    points:
      p1: 幫他把親手核過的《牡丹亭》原本抄定，交到宜黃戲班手裡，讓他們照原本排唱
    points_fail:
      p1: 後來的改本照史實傳開，他只能寫信叮囑宜黃的伶人別照改本唱，這條分支與歷史一樣。
    shift:
      p1:
        was: 1598 年以後，湯顯祖在信中囑咐宜黃伶人沿用他的原本，別採用為了便唱而改過的曲文。
        now: 改本出來之前，宜黃班手裡已經有了一部他親手核過的原本，班裡一直照原本唱。
        who: tang_xianzu_linchuan
        bio: 這條時間線裡，湯顯祖親手核定的《牡丹亭》原本先到了宜黃戲班，班裡一直照原本唱。
    vignettes:
      empty_garden: '{staff}把椅子挪到牆根。演員走過空地，唱到一半垂了垂眼。抄本人坐在長凳上，這才看出空園裡的小路在哪兒拐彎。'
      cue: 少了幾個唱詞，臺邊的人等不到接句。{staff}把字補回排練紙，讓兩個人從上一句再接一次。
      breath: 演員在句末留了一口氣。{staff}把那一頓記下來，將紙條遞到臺邊。
  xu_xiake_lijiang:
    name: 校書之外的半日
    place: 麗江
    figure: 徐霞客
    story: 1639 年二月，徐霞客住在麗江解脫林，為木增校書。木增遣人送來酒食，校書後又送禮酬謝。徐霞客聽說寺後高處有拱壽臺、獅子崖，日記裡寫校書催得緊，兩處都沒來得及登。
    story_prose:
      opening:
        - 1639 年二月，麗江。徐霞客在解脫林為木增校書，聽說後山有拱壽臺和獅子崖。他把兩處名字記進日記。
        - 史實裡，書催得緊，兩處都沒去成。木增後來送禮酬謝，又請他修《雞山志》。在這條分支裡，還書單和走山路要用的紙放在一處。
        - 這一趟用得上清點卷冊、送得準的人，也用得上跟得上嚮導和護衛、能記住山路折回處的人。
      points:
        p1: '{staff}照還書單把卷冊點過，跟送書的人核對哪些已經交回。送書人把回執擱在最上面。下面的書頁收齊了，仍有一根細紙籤露在匣外。'
        p2: 交清書以後，{staff}請本地嚮導帶路，同護衛陪徐霞客走上拱壽臺。對面的山從腳下一步一步露出來。徐霞客走到能看全的地方，在紙邊劃了一筆。
        p3: '{staff}陪徐霞客從兩面重走獅子崖下的岔口，把要折回的那一段指給他看。草圖後來擱在解脫林的門檻裡。折到末尾處，那道彎還完整地留在紙面上。'
      outcomes:
        all: 書卷交清後，那半日的山路也進了日記。留在解脫林的草圖打開時，紙上兩條路各從一道摺痕旁拐過去。
        p3: 後來解脫林裡留下了一張草圖。有人指著獅子崖下那道彎，再把紙折回去。
        p2: 麗江的記述裡後來多了一處站過的地方。徐霞客翻回那頁，手指在對山初見的那一行停住。
        p1: 木增後來送來酬謝，又請他修志。收起回信時，匣子裡卷冊的紙籤還排得齊。
      none: 木匣合上了。門檻邊那張閒紙捲起來，沒壓住的一端掃過地面。
      not_admitted: '{staff}沒能在校書的人中留下。門內有人搬動木匣，蓋子響了一聲。'
      desync: 送書前沒有核清卷冊。{staff}被召回時，匣邊還有一張沒勾完的單子。
      excerpts:
        p3: 草圖後來擱在解脫林的門檻裡。折到末尾處，那道彎還完整地留在紙面上。
        p2: 對面的山從腳下一步一步露出來。徐霞客走到能看全的地方，在紙邊劃了一筆。
        p1: 送書人把回執擱在最上面。下面的書頁收齊了，仍有一根細紙籤露在匣外。
    relic: 一張解脫林步行圖
    relic_desc: 一張折過的步行圖，坡路用線畫出，岔口旁留著空白。
    points:
      p1: 跟送書人核清校過的卷冊已經交回，趕上木增初九酬謝和續修《雞山志》的委託
      p2: 從校書之後騰出半日，請本地人帶路、護衛同行，陪徐霞客從解脫林一步步走上拱壽臺
      p3: 陪徐霞客沿獅子崖下的岔路往返，記下從哪兒開始折回，離開前給寺裡留一份
    points_fail:
      p1: 退回的幾卷還缺著籤記，來請修志的人無法確認校書已完，這次交接錯過，事務所召回員工。
      p2: 等書卷合上，已經走不了這一趟。拱壽臺在日記裡仍是聽來的地名。
      p3: 徐霞客離開麗江時，沒能把親腳丈量過的路線補到聽來的路引旁。
    shift:
      p1:
        was: 1639 年二月初九，木增遣人送禮酬謝校書，並再次致書請徐霞客修《雞山志》。
      p2:
        was: 1639 年二月初六，徐霞客寫校書催得緊，沒來得及登拱壽臺和獅子崖。
        now: 書卷交清後，{staff}陪徐霞客回解脫林，和嚮導、護衛會合。徐霞客登上拱壽臺，記下走到哪裡才看得見對面的山。
      p3:
        was: 1639 年的麗江日記把獅子崖記為聽說在寺後高處、因校書未及攀登的地方。
        now: '{staff}陪徐霞客從兩個方向各走一遍岔口。徐霞客標出路折回的那一彎，給解脫林留了一份草圖。'
        who: xu_xiake_lijiang
        bio: 徐霞客的麗江日記在校書和出關之間多了一篇親歷。解脫林另留一份足跡草圖。
    vignettes:
      view: 嚮導拿對面一座山來指彎道。{staff}問清要先過幾個彎，把遠處的山和腳下的路分成兩行記。
      trail: 護衛走到石階，袖口濕透了。{staff}把乾布搭在門邊，再把校到一半的稿頁往屋裡挪。
      slope: '{staff}在解脫林門檻上另抽出一張紙。還書單進了木匣，記路用的那張留在手裡。'
    remarks:
      trait_methodical: '{staff}在草圖上多畫了一個箭頭，下一位走到岔口便知道哪邊是上坡。'
eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 1924 年 2 月 4 日，廣州。孫中山下令把三所學校併成國立廣東大學，請鄒魯籌備。學生還在各自的學校，報名、畢業和新校址都要有人經手。
        - 史實裡，學校當年開學，石牌的新校舍卻到九年後才動工，孫中山生前沒有見到。到了這條分支，籌備處給來幫忙的人騰了一個座位，桌上放著三校送來的紙。
        - 這一趟用得上認得路、問得清各校難處、核得準名單的人。城裡幾處地要走完，去石牌的隊伍還需要一雙能扶穩界樁的手。
      points:
        xue: 籌備處送來要貼到城外的招生告示。{staff}把圍著渡口繞遠的路劃掉，重新在簡圖上圈出路口和碼頭。送件人把圖壓在告示上，疊了兩折。紙折到河邊，碼頭的圓圈還露著半個。
        wen: 辦事員替{staff}引見了三校的人。{staff}把一家家問來的話帶回去，在開會前把師生各自的難處寫進同一張紙。桌上原來分放著三疊紙。辦事員抽出那張彙總單，把它橫放在三疊紙的上頭。
        si: '{staff}步行踏勘幾處備選地，最後走到城東的石牌，把各處從哪裡進出描在同一張圖上。回到籌備處，圖一鋪開就往回卷。{staff}用指腹壓住城東，再把紙角往燈下送了一寸。'
        bian: 三校送來的畢業名單有幾處合不上。{staff}逐個翻回原件，核准姓名，把三份名單併成一冊。臨交出去時，{staff}又從頭數了一遍頁碼。末頁翻過去，墨最深的還是剛核過的那一行。
        xing: 去石牌立界樁的人少了一雙手。{staff}隨隊出城，扶樁讓同伴敲實，再沿界走了一遍。走到最後一根，{staff}鬆開沾泥的手。回身望去，先立下的幾根還在一條線上。
      outcomes:
        all: 回到事務所以後，十一月的校訓已經可以讀到。有人把一份校訓放在這趟的五項記錄旁邊，五行字正對著五道紙折。
        xing: 石牌的界在孫中山離開廣州前立了起來。後來再有人走過，把目光沿著那些樁一點一點放遠。
        bian: 畢業典禮籌備時，辦事員攤開一本名冊就找到了要核的名字。翻過一頁，靠近書脊的墨還比別處深。
        si: 選址文書旁後來壓著一張比較圖。有人查完石牌的路，把圖按原來的摺痕合上。
        xue: 報名開始時，城外的路口也貼著告示。有人在碼頭邊停下，把紙下沿輕輕撫平。
        wen: 開籌備會議那天，三校的難處擺在一張紙上。傳到下一人手裡時，紙還攤著。
      none: 籌備處到傍晚仍有人翻紙。{staff}經過門口，看見一張張紙的下沿被燈光照亮。
      not_admitted: '{staff}沒能在籌備處留下來。經過門口時，那張空椅子還齊齊推在桌下。'
      excerpts:
        xing: 走到最後一根，{staff}鬆開沾泥的手。回身望去，先立下的幾根還在一條線上。
        bian: 臨交出去時，{staff}又從頭數了一遍頁碼。末頁翻過去，墨最深的還是剛核過的那一行。
        si: 回到籌備處，圖一鋪開就往回卷。{staff}用指腹壓住城東，再把紙角往燈下送了一寸。
        xue: 送件人把圖壓在告示上，疊了兩折。紙折到河邊，碼頭的圓圈還露著半個。
        wen: 桌上原來分放著三疊紙。辦事員抽出那張彙總單，把它橫放在三疊紙的上頭。
    labels:
      sick: 懸而未決的事
