      borscht: '{staff}在拉丁區一家小館子吃飯。鄰桌兩個波蘭學生用波蘭話爭得面紅耳赤，紅菜湯涼了也沒顧上喝。老闆娘說，這一帶的波蘭人比塞納河邊的鴿子還多。'
      bookstall: '{staff}在塞納河邊的舊書攤上，從一摞曬褪了色的舊雜誌底下翻到一本講那種能穿過皮肉的新射線的小冊子。攤主說，這年頭的人，看不見的東西最肯掏錢。'
  freud_vienna:
    name: 一本書的兩個年份
    place: 維也納
    figure: 西格蒙德·弗洛伊德
    story: 1899 年 11 月 4 日，西格蒙德·弗洛伊德的《夢的解析》在維也納面世，出版商在扉頁上印了 1900 年。弗洛伊德後來說，這本書是他對父親去世的回應。首印六百冊，賣了八年才賣完，第二版到 1909 年才出。
    story_prose:
      opening:
        - 1899 年秋，維也納。西格蒙德·弗洛伊德的《夢的解析》就要由多伊蒂克出版社印出，11 月 4 日面世，扉頁上印的卻是 1900 年。三年前的 10 月，他的父親雅各布在維也納去世；他後來說，這本書是他對父親之死的回應。
        - 史實裡，書出來以後少有人理會，首印六百冊賣了約八年才賣完，第二版到 1909 年才出。在這條分支裡，內城一家書店有個擦櫥窗的店員和一個管訂貨簿的小夥計，咖啡館裡有個看報的醫生。
        - 這一趟用得上幾種人：懂醫、在同行之間說得上話的人；跑報館、知道一本書該送到誰手裡的人；能言善道、敲得開別人家門的人。
      outcomes:
        p1: 那個冬天，弗洛伊德陸續收到幾封來信，信裡一頁一頁地問那本書。書店的訂貨簿上，那本講夢的書往下添了幾行。
      none: 十二月底下了雪，書店的小夥計翻著訂貨簿，那本講夢的書這個月幾乎沒動。櫥窗角上，扉頁還翻在印著 1900 年的那一面。
      not_admitted: '{staff}沒能進那幾位同行的門，只在內城那家書店的櫥窗前站了幾回。那本講夢的書擺在角上，扉頁翻開著，玻璃上落了一層薄灰。'
      points:
        p1:
          class_medical: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}以醫生的身份，揣著幾本書去了幾位同行的診所，每本都在講夢的那一章夾一張紙條，寫明從哪一頁讀起。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
          class_press: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}照跑報館的門路，打聽出哪幾位醫生肯給雜誌寫長評，把書包好，一家一家送上門。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
          else: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}在咖啡館裡坐了幾個下午，跟看報的醫生們搭上話，把帶來的書一本本借了出去，只說讀完再還。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
      excerpts:
        p1: 那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
    relic: 一張註明日期的書店存根
    relic_desc: 維也納一家書店的送貨單，日期是 1899 年 11 月，單上那本書的扉頁印著 1900 年。
    points:
      p1: 在書面世後無人問津的那幾周，把《夢的解析》送到會認真讀完它的同行手裡
    points_fail:
      p1: 書出來以後少有人理會，首印六百冊要八年才賣完。
    shift:
      p1:
        was: 1899 年 11 月 4 日，《夢的解析》在維也納面世，首印六百冊，扉頁印 1900 年，八年才賣完。
        now: '{staff}把書送到幾位同行手裡，他們那個冬天就讀完了全書。關於它的來信和爭論早來了好幾年，首印也不用等八年。'
        who: freud_vienna
        bio: 弗洛伊德那本講夢的書在頭一年就有了認真的讀者。他等了多年的討論，1899 年冬天就開始了。
    vignettes:
      window: '{staff}在內城一家書店的櫥窗前站了半天。那本講夢的新書擺在角上，翻開著扉頁，印的是 1900 年。店員出來擦玻璃，說這書要到明年才算新書，眼下先佔個位子。'
      cafe: '{staff}在咖啡館從報架上取下幾份報紙，把書評欄翻了個遍，哪一份都沒提這本書。鄰桌的醫生說，三百多頁講夢的書，誰有工夫讀完，說完又叫了一杯咖啡，接著看他的報。'
      snow: 十二月底下了雪。{staff}幫書店的小夥計鏟門口的雪。夥計凍著手翻訂貨簿，說那本講夢的書這個月幾乎沒動，又問夢是不是夏天才好賣。
  cajal_barcelona:
    name: 神經細胞是一個個獨立的單位
    place: 巴塞羅那
    figure: 聖地亞哥·拉蒙-卡哈爾
    story: 1887 年底起，聖地亞哥·拉蒙-卡哈爾在巴塞羅那任組織學教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥幾十份大多寄給國外的研究者，可他們很少讀西班牙文。1889 年 10 月，他自費去柏林參加德國解剖學會的會議，把切片放在顯微鏡下給人看，會上資深的組織學家阿爾伯特·馮·克利克接過了他的研究。1906 年，他與卡米洛·高爾基分享諾貝爾獎。
    story_prose:
      opening:
        - 1889 年秋，巴塞羅那。聖地亞哥·拉蒙-卡哈爾在大學教組織學，用銀染的切片去看神經細胞的分支。前一年，他自掏腰包印出自己期刊的第一期，六十份上下，大多寄往國外。
        - 史實裡，國外的同行很少讀西班牙文，他的文章少有人注意。9 月 26 日他拿到出行許可，自籌旅費去柏林，10 月在德國解剖學會的會上把切片放到顯微鏡下，克利克從此支持他。在這條分支裡，實驗室裡有個學生守著一罐泡著組織的重鉻酸鉀，還跑去火車站問過去柏林的票價。
        - 這一趟用得上兩種人：理得清賬目和玻片、守得住行程的人，懂外文、找得到合譯者、說得動人幫忙的人。
      outcomes:
        all: 十月，柏林的會場裡，顯微鏡前排著隊。排在最前面的人，手裡拿著那幾頁譯稿。
        p2: 那以後，卡哈爾寄往國外的信封裡，總夾著一份譯好的圖說。
        p1: 十月，柏林的會場裡，卡哈爾把切片推到顯微鏡下，退開一步，請人來看。
      none: 巴塞羅那的實驗室裡，那幾包玻片還碼在木匣裡，沒有離開桌子。
      desync: 旅費到月底還差一截，玻片也沒裝好。{staff}被召回時，卡哈爾正把一份文字稿裝進信封，準備寄往柏林。
      not_admitted: '{staff}沒能進那間實驗室。玻片還攤在桌上，去柏林的日子一天天近了。'
      points:
        p1: 9 月 26 日，出行許可批了下來，旅費得自己出。{staff}把能動用的錢一筆筆列在紙上，又把要帶的玻片按編號分成幾包，每包裹上軟紙，裝進帶隔層的木匣。賬算平了，木匣的鎖也扣上了。卡哈爾把木匣放在膝上，一路抱著上了去柏林的車。
        p2:
          class_lettered: '{staff}照譯稿的規矩，同卡哈爾一張圖一張圖地對，把圖下的說明譯成德文，哪一根纖維該叫什麼，逐處問清了才落筆。短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。'
          else: '{staff}在城裡找到一位懂德文的譯者，勸他放下手頭的活，陪卡哈爾一張圖一張圖地對，把圖下的說明譯成德文。短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。'
      excerpts:
        p2: 短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。
        p1: 賬算平了，木匣的鎖也扣上了。卡哈爾把木匣放在膝上，一路抱著上了去柏林的車。
    relic: 一支極細的繪圖筆
    relic_desc: 細到能畫出神經元每一條分支的筆。
    points:
      p1: 在公費未獲准時幫卡哈爾把旅費與玻片分包湊齊，保住柏林會上那次親手演示
      p2: 為難以進入外語期刊的圖文找一位合譯者，讓同業在會前就能按圖復核
    points_fail:
      p1: 自費湊不齊長途行程，卡哈爾只能把文字寄過去。柏林沒有那次演示，員工因同步失敗被召回。
      p2: 外地同行會後才有人設法讀懂西班牙文稿，復核仍得逐封通信。
    shift:
      p1:
        was: 1889 年 9 月 26 日，卡哈爾獲得出行許可，自籌旅費並在 10 月柏林會議上展示顯微切片。
      p2:
        was: 1889 年，卡哈爾自述先前的西班牙文研究在國外少受注意，柏林演示後來幫助傳播他的結果。
        now: '{staff}讓譯者同卡哈爾對照原圖校過短文，先寄給願意核對切片的同行。演示之後，卡哈爾有一條持續寄發圖文的渠道。'
        who: cajal_barcelona
        bio: 卡哈爾在巴塞羅那為研究圖文建立了穩定的外語協作。後來的手稿可以先在國外找到願意拿切片復核的同行。
    vignettes:
      stain: '{staff}幫一個學生把切好的小塊組織泡進重鉻酸鉀的罐子裡。學生說這罐要原封不動泡到下禮拜，誰要是忍不住打開看，下一百張切片就歸誰切。'
      ticket: '{staff}陪學生去火車站問去柏林的車票。售票員報了價，學生吹了聲口哨，回來的路上一直掰著指頭算，這筆錢夠印幾期刊物。'
      rain: 十一月，巴塞羅那下起雨。{staff}幫學生把窗臺上晾著的一疊圖版收進屋，學生點了兩遍數，才肯把百葉窗關上。
  hammurabi_babylon:
    name: 刻在石頭上的法律
    place: 巴比倫
    figure: 漢謨拉比
    story: 約前 1754 年，漢謨拉比在位的晚年，一塊刻著近三百條法律的玄武巖石碑立了起來，此後幾百年，書吏一直把這些條文抄在泥板上傳習。前十二世紀，石碑被運到蘇薩，碑上有幾欄文字被磨去。1901 年，法國考古隊在蘇薩把它挖了出來，如今藏在盧浮宮，被磨掉的條文靠泥板抄本補回了一部分。
    story_prose:
      opening:
        - 約前 1754 年，巴比倫。漢謨拉比在位的晚年，一塊玄武岩石碑刻上了序言、約二百八十二條講財產、交易、家庭與勞作的法律和一段結語。結語裡說，受了冤屈的人可以來到碑前，請人把碑上的話唸給他聽。書吏把這些條文抄在泥板上，一代一代傳習。
        - 史實裡，前十二世紀，埃蘭王舒特魯克-納洪特把石碑運到蘇薩，碑面下部有幾欄後來被磨平；缺掉的條文靠泥板抄本補回了約三十條，其餘至今不知道寫的是什麼。在這條分支裡，書吏屋裡有個和泥、曬泥板的學徒，幼發拉底河邊有個不識字的船伕。
        - 這一趟用得上幾種人：做慣了案頭活、校得出漏行的人；手穩、會削蘆管壓字的匠人；一絲不苟、一欄一欄對得下去的人，或是帶著能把碑面細節看清的眼鏡的人。
      outcomes:
        p1: 三千多年後，那片磨平的石面旁邊擺上了一塊別的城裡傳下來的泥板。有人順著楔形的刻痕一行一行往下唸，唸到了石頭上已經沒有的那幾條。
      none: 泥板照舊在屋頂上曬著，學徒照舊挨塊數。幾百年後石碑被運走，碑面下部那幾欄磨成了平的，什麼也摸不出來。
      not_admitted: '{staff}沒能進書吏的屋子，只在幼發拉底河邊幫船伕卸了幾袋大麥。船伕數著袋子，又說起王的石碑，碑上的字他一個也不認得。'
      points:
        p1:
          class_lettered: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}做慣了案頭的活，抄完一塊，就對著底本從頭點一遍行數，漏了一行的那塊，趁泥還軟抹平了重寫。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
          class_craft: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}手穩，把幾根蘆管削出斜口，一根一根在廢泥上試過壓痕，挑出最利的遞給書吏，自己也照著底本壓滿了一整塊。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
          else: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}一欄一欄對著底本數下去，把每塊泥板從哪一條抄到哪一條刻在一片陶片上，幾份抄本拼起來，一條也不缺。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
      excerpts:
        p1: 書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
    relic: 一枚泥印滾筒
    relic_desc: 一個小石柱，在泥上一滾就留下簽名。
    points:
      p1: 幫書吏把石碑全文多抄幾塊泥板，送到別的城裡存放，後世石上被磨掉的那幾欄也能讀全
    points_fail:
      p1: 全文照舊只有原來那些抄本，這條分支裡石碑被搬到蘇薩、磨去幾欄以後，還是有幾條法律再也讀不到。
    shift:
      p1:
        was: 公元前十二世紀，石碑被埃蘭人搬到蘇薩，碑文被磨去幾欄；靠泥板抄本補回了約三十條，其餘至今不知道寫的是什麼。
        now: '{staff}幫書吏多抄了幾份全文，送到別的城裡存放，這條時間線裡石碑上的每一條法律都還讀得到。'
        who: hammurabi_babylon
        bio: IF 線裡，漢謨拉比的法律一條不缺地傳了下來，石上磨掉的部分也沒有失去。
    vignettes:
      clay: '{staff}幫書吏學徒和泥。學徒說泥裡的沙得淘乾淨，不然寫到一半，蘆管一按就裂，師傅又要他從第一行重抄。'
      river: '{staff}在幼發拉底河邊幫船伕卸大麥。船伕一邊數袋子一邊說，過秤的要是敢少算一袋，他就站到王的石碑跟前把那一條念給他聽，雖然碑上的字他一個也不認得。'
      roof: 日頭最毒的時候，{staff}和學徒把新抄的泥板擺到屋頂上曬。學徒挨塊數，數到一半亂了，又從頭數，生怕有一塊被鳥踩過。
  lalibela_rock:
    name: 溝壁上的兩層土
    place: 埃塞俄比亞拉利貝拉
    figure: 拉利貝拉的清溝工人
    story: 1966 年 12 月 19 日，拉利貝拉第一期修繕開工。工人掘走淤積的土，重新露出一段段鑿進岩石的深槽。現代考古隊指出，那次清理的出土物只留下少量照片，缺少可逐件核對的記錄。
    relic: 一張溝壁剖面圖
    relic_desc: 線圖記下土層厚度和碎片還在土裡的位置。
    points:
      p1: 趁著下一筐土還沒動，和工人量下土層厚度，把露出的陶片位置連同溝壁剖面抄一份留在當地
    points_fail:
      p1: 清理繼續進行。泥從溝裡運出，後來再也無法量出這些碎片原來的位置。
    shift:
      p1:
        was: 清理時留下的少量照片不足以還原出土物原來的土層與位置。
        now: 當地留有一份溝壁剖面，後來的測繪人員還能查到這一段的土層厚度和陶片的位置。
    vignettes:
      work: '{staff}看著工人用一把窄鏟刮出一小片平面，泥裡的淺線這才變得清楚。'
    story_prose:
      opening:
        - 1966 年冬，拉利貝拉。巖溝裡一筐筐往上提帶泥的碎石。溝壁轉彎處，濕泥下方露著一條顏色淺些的土。泥裡還有幾片陶。
        - 這次工程重新露出了被埋的深槽。史實裡，清理中發現的東西只留下少量照片。要把某塊陶片放回原處，單憑照片已經辦不到了。
        - 工人下一趟就會挖過這個彎。派個會看土層又能當場把位置畫下來的人去，還來得及。
      points:
        p1: '{staff}請提筐的人稍等，把尺貼到兩層土的交界，再從巖壁邊量到剛露出的陶片。工人照著報出的數，把同一個位置點在第二張圖上。第二張圖留在鎮上。'
      outcomes:
        all: 多年後，有人展開留在鎮上的圖，把尺比在那段巖壁上。舊圖上的淺色土層就在尺的這一頭。
        p1: 多年後，有人展開留在鎮上的圖，把尺比在那段巖壁上。舊圖上的淺色土層就在尺的這一頭。
      none: 空筐從坡頂滑回溝裡。原先露出陶片的一邊已經削平，剩下的土與上一筐混在了一起。
      not_admitted: '{staff}沒能跟清溝工人下去。有人從溝沿收起一段繃著的細線，繞回木板上。'
      excerpts:
        p1: '{staff}請提筐的人稍等，把尺貼到兩層土的交界，再從巖壁邊量到剛露出的陶片。工人照著報出的數，把同一個位置點在第二張圖上。'
  ife_bronzes:
    name: 回填前的探溝圖
    place: 尼日利亞伊萊伊費
    figure: 伊塔耶穆發掘隊
    story: 1957 年 12 月，發掘人員在伊萊伊費的伊塔耶穆開始搶救性發掘。他們清出古代陶片鋪地。最早清出的大片鋪地後來蓋了棚，多數探溝則被回填。後來的考古隊得從零散的草圖、筆記和照片中重建探溝的分佈。
    relic: 一張帶基準線的探溝圖
    relic_desc: 紙上把幾條探溝的位置連到公路邊的同一條基準線。
    points:
      p1: 在開挖的邊界被填平前，把探溝量到同一條基準線上，在伊費留下可以複測的圖
    points_fail:
      p1: 溝口照常回填。隨著地表變化，後來的人只能用零散記錄重找各條溝的位置。
    shift:
      p1:
        was: 多數探溝回填後，後來的考古隊手頭沒有一張完整的早期現場圖，需要重新拼出探溝分佈。
        now: 伊費留有一份按固定參照點測出的探溝圖。後來的人能按圖重找到這些探溝。
    vignettes:
      work: '{staff}看著尺帶繞回盤裡，泥土在數字二和三之間留了個印。'
    story_prose:
      opening:
        - 1957 年 12 月，伊萊伊費。公路邊，幾個人蹲在土裡，把陶片鋪地的邊緣一點點刷出來。他們在溝沿下釘樁，免得人一腳踏進去。
        - 最早清出的大片鋪地後來有了棚子，多數探溝卻要回填。史實裡，重來這裡的人花了不少時間，把筆記、草圖和照片裡的位置重新拼到一塊。
        - 開口還在地上。趁今天走得通，找個會測量並肯和發掘隊一道複核的人，把每條溝接到同一處地標上。
      points:
        p1: '{staff}和隊員把長尺拉到公路邊的固定標記，逐個報出溝角的距離。一個人先在現場圖上點清，一轉手又在留給伊費的那張紙上點了一遍。'
      outcomes:
        all: 回填很久以後，拿圖的人在路邊找回標記，沿著紙上的距離走到舊溝拐角。地上已經看不到溝了。
        p1: 回填很久以後，拿圖的人在路邊找回標記，沿著紙上的距離走到舊溝拐角。地上已經看不到溝了。
      none: 鬆土把最後一個溝角填平。兩張沒標相對位置的草圖疊在一起，紙上的線還是對不上。
      not_admitted: '{staff}沒能跟發掘隊進場。圍欄內有人收走了垂在地上的長尺。'
      excerpts:
        p1: '{staff}和隊員把長尺拉到公路邊的固定標記，逐個報出溝角的距離。一個人先在現場圖上點清，一轉手又在留給伊費的那張紙上點了一遍。'
  great_zimbabwe:
    name: 牆腳留下的泥臺
    place: 津巴布韋馬斯溫戈
    figure: 大津巴布韋西圍區的工人
    story: 1915 年，大辛巴威山上西圍區的塑土臺、長凳和牆體大多被拆除。施工時，人們以為附著的泥土會危及乾砌石牆。清理後留下的坑口又經年侵蝕。
    story_prose:
      opening:
        - 1915 年，大津巴布韋。西圍區的幹砌石牆腳下，還有用泥土塑成的臺和長凳。清理的人把它們也划進了要搬走的範圍。
        - 史實裡，工人把這些土構大多拆去，露出的坑口後來繼續受侵蝕。在這條分支裡，有人能在輪到牆腳那一段之前，和工人一道把相接的地方看清楚。
        - 這一趟用得上讀得懂一堵牆、能跟在地做工的人說清楚的人。要留住的那一段，要在動工以前摸得準。
      points:
        p1: '{staff}沿著牆腳和工人核過泥臺與石牆相接的地方，指清能讓開的一段，等他們把清理界線往外挪。工人把木樁釘在泥臺外頭。那截檯面上，一道舊指痕還貼著石縫。'
      outcomes:
        all: 後來測繪的人蹲到牆腳，把尺橫在還留著的泥臺上。尺的一邊擱在土面，一邊輕輕碰到了石頭。
        p1: 後來測繪的人蹲到牆腳，把尺橫在還留著的泥臺上。尺的一邊擱在土面，一邊輕輕碰到了石頭。
      none: 工人從牆腳把空筐帶走。坑邊土色新鮮，原來接著石牆的地方只剩一道淺線。
      not_admitted: '{staff}沒能加入西圍區的工人。草圖從裡頭遞出來，牆腳處只看得見一截紙角。'
      excerpts:
        p1: 工人把木樁釘在泥臺外頭。那截檯面上，一道舊指痕還貼著石縫。
    relic: 一張牆腳剖面草圖
    relic_desc: 紙上畫著乾砌石牆和緊貼牆腳的塑土臺。
    points:
      p1: 與西圍區的工人核對牆腳，在清理前爭取把一段塑土臺留在原處
    points_fail:
      p1: 照史實，塑土構件大多被清掉。這條分支裡，原處沒有留下這一段。
    shift:
      p1:
        was: 1915 年，西圍區的多處塑土臺、長凳和牆體在清理中被拆除。
        now: 這條分支裡，西圍區有一段塑土臺留在原處。後來測繪的人還能看出它怎樣貼著石牆。
    vignettes:
      lines: '{staff}沿著牆腳看過去，泥臺的邊到了石縫才低下去。'
      width: '{staff}替工人拿著草圖，圖上石牆和泥臺各有一條線。'
      pace: '{staff}坐到石階邊，把鞋上的乾泥碰掉，泥屑落在腳下的砂土上。'
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯伊斯法罕
    figure: 歐瑪爾·海亞姆
    story: 1070 年代，馬立克沙召集天文學家開展觀測。歐瑪爾·海亞姆在伊斯法罕的宮廷隨學者共事。1079 年 3 月 15 日，賈拉利曆啟用，以春分定太陽年的開端。
    story_prose:
      opening:
        - 1079 年春，伊斯法罕。馬立克沙召集的學者們在修訂曆法。海亞姆參與觀測，新曆把一年開頭定在春分。
        - 史實裡，新曆在三月啟用，這些觀測後來隨馬立克沙去世而停下。海亞姆提過自己有一部講開方的書，那部書沒有傳下來。在這條分支裡，抄曆書的人手邊還留著一張能再寫幾行的紙。
        - 這一趟用得上認得清日影讀數、能夠核對新舊兩欄的人，也用得上懂得校書、能把副本送到另一座城的人。
      points:
        p1: 春分前，{staff}按前幾天的記錄核對影端，從紙上把抄混的一列挑出來，請海亞姆對著原來的讀數再看一遍。表邊有兩道舊摺痕。太陽落低時，桌上的紙還打開著，那一列墨重新寫到了線內。
        p2: '{staff}替抄書的人核過開方書的副本，把易抄錯的幾個數逐一對回原本，再交給往別城去的送書人。送書人把抄本包在布里，系完又鬆開一邊。題名朝著外頭，隔著第一層布還摸得出紙角。'
      outcomes:
        all: 那年開春的日期寫進新曆。許多年後，另一座城的書架上有人取下開方書，紙角還照舊卷著。
        p2: 後來有人在另一座城又抄了一遍全書。他從第一行開始，手邊放著那一卷邊角已有磨損的舊稿。
        p1: 新曆照原定的日子啟用。對照表還有一份，頁上兩種題頭挨在一起。
      none: 舊曆表收回匣裡。一張沒寫完的紙留在外面，風來時貼著匣口響。
      not_admitted: '{staff}沒能跟著抄歷的人留下。門裡一張紙翻了過去，門外已經看不見題頭。'
      desync: 兩欄數直到收表也沒對齊。{staff}被召回時，最後一次讀數仍留在紙邊。
      excerpts:
        p2: 送書人把抄本包在布里，系完又鬆開一邊。題名朝著外頭，隔著第一層布還摸得出紙角。
        p1: 表邊有兩道舊摺痕。太陽落低時，桌上的紙還打開著，那一列墨重新寫到了線內。
    relic: 一張有兩種題頭的歷表
    relic_desc: 一張對照表，新舊兩種新年並排寫著。
    points:
      p1: 春分前那幾天，護住觀測臺上定春分的日影讀數，讓新曆照定的日子啟用
      p2: 幫他把那部講開方的書多抄一份，送到別的城裡收好，讓它在這條分支裡留下來
    points_fail:
      p1: 春分的讀數沒能對齊，新曆沒能在 3 月 15 日啟用。
      p2: 這部書照舊失傳，這條分支與歷史一樣。
    shift:
      p1:
        was: 1079 年 3 月 15 日，蘇丹馬立克沙的新曆照定的日子啟用，一年從春分開始。
      p2:
        was: 海亞姆那部論開方的書沒有傳下來，只在他的《代數》裡留下一句提及。
        now: 有一份抄本被送到別的城裡收進了書庫，幾百年後還有人讀得到。
        who: omar_khayyam_nishapur
        bio: 這條時間線裡，他那部講開方的書沒有隨著歲月散失。存在別城的那份抄本，在他身後仍有人讀、有人轉抄。
    vignettes:
      spring: '{staff}把新舊曆表並排，在日期旁各補一個題頭。兩張紙的邊碰在一起，數字才有了分界。'
      carry: 一張摺紙把兩欄分開。{staff}把題頭抄到紙外，遞過去時，有一筆從摺痕上跨了過去。
      future: '{staff}用抄曆書的人熟悉的紀法落下日期。紙往前挪時，空出來的地方仍留著給下一行。'
  ibn_battuta_tangier:
    name: 長途還只有第一站
    place: 摩洛哥丹吉爾
    figure: 伊本·白圖泰
    story: 1325 年六月，伊本·白圖泰離開故鄉丹吉爾。他在《遊記》裡回憶，父母都還在家，而他出門時沒有旅伴，也沒有商隊可以跟隨。他回到摩洛哥後，把前後近三十年的行旅見聞口述給伊本·朱扎伊。
    story_prose:
      opening:
        - 1325 年六月，摩洛哥丹吉爾。二十出頭的伊本·白圖泰要出一趟遠門，父母都還在家。近三十年後他才回到家鄉，把一路見聞口述給伊本·朱扎伊，編成了《遊記》。
        - 史實裡，他是一個人出的城門，沒有旅伴，也沒有商隊可以跟。到了米利亞納，他追上的突尼斯蘇丹的兩位使節都在暑熱裡病倒，其中一位在城外溪邊停了三夜後去世；過了貝賈亞，他又發起高燒，拿纏頭布把自己綁在鞍上；進突尼斯那天，迎出城來的人裡沒有一個認得他，他忍不住哭了。在這條分支裡，泉邊有個替人灌滿水囊的鄰家婦人，城邊有個只認得頭一段路的挑夫。
        - 這一趟用得上幾種人：懂醫護、帶夠了補液和水的人；身子骨極結實，或帶著止痛藥、咬得住牙的人，熬得過一路暑熱和顛簸；心腸熱、肯在陌生城門口走上前去的人。
      outcomes:
        all: 那年秋天，突尼斯蘇丹的兩位使節都回到了城裡。伊本·白圖泰在突尼斯住了兩個月，進城那天陪著他的人，那些日子常來他住的地方坐一坐。後來他跟著一支更大的商隊，又往東去了。
        p2: 那年秋天，兩位使節一前一後回到了突尼斯。病過一場的那位走在後面，鞍邊掛著那隻在溪邊用過的水碗。
        p3: 他在突尼斯住了兩個月。進城那天陪著他的人，那些日子常來他住的地方坐一坐，兩人說的多半是路上的事。
        p1: 他一路沒有下鞍，撐到了突尼斯。那條纏頭布後來又纏回了他的頭上，跟著他往東走了很遠。
      none: 七月，米利亞納城外的溪邊停了三夜，一位使節沒有再起來。九月，突尼斯城門口，迎出來的人叫著別人的名字，他攥著韁繩站在人群邊上，哭出了聲。
      desync: 八月，過了君士坦丁，那個結鬆開了。{staff}被召回時，商隊停在路當中，那條纏頭布一頭還繫在空鞍上，垂到了地上。
      not_admitted: '{staff}沒能在丹吉爾落下腳，只在泉邊幫那位鄰家婦人提了幾趟水。六月十四日一早，一個年輕人牽著牲口出了城門，身邊沒有旅伴，後面也沒有商隊。'
      points:
        p2:
          class_medical: 七月，米利亞納城外，離城四英里的一條溪邊。兩位使節都在暑熱裡病倒了，隊伍已經在溪邊停了三夜，病得重的那位躺著，叫他也只睜一睜眼。{staff}照醫護的法子，把兩包補液鹽兌進保溫壺裡的涼開水，扶起他的頭一口一口餵，又把浸濕的布搭在他的額頭和頸後，隔一陣換一回。第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
          else: 七月，米利亞納城外，離城四英里的一條溪邊。兩位使節都在暑熱裡病倒了，隊伍已經在溪邊停了三夜，病得重的那位躺著，叫他也只睜一睜眼。{staff}打開隨身帶的藥箱，給他退了燒，守在他身邊，等他一口一口把水嚥下去，一夜沒有合眼。第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
        p1:
          class_medical: 八月，過了君士坦丁，伊本·白圖泰又發起燒來。在貝賈亞時就有朋友勸他留下養病，他沒有留。這回他拿纏頭布把自己綁在鞍上，怕燒得沒了力氣栽下去。{staff}照醫護的規矩，每到歇腳就摸他的額頭和手腕，把濕布換了又換，看著他把水嚥下去，又替他把布結重新勒緊。夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
          else: 八月，過了君士坦丁，伊本·白圖泰又發起燒來。在貝賈亞時就有朋友勸他留下養病，他沒有留。這回他拿纏頭布把自己綁在鞍上，怕燒得沒了力氣栽下去。{staff}一路走在他的牲口旁邊，一手牽著韁繩，他身子一歪，就伸手把他托回鞍上，曬了一整天也沒換過手。夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
        p3: 九月，商隊到了突尼斯。城裡的人迎出來，叫著同行商人的名字，一個個拉住手問候。沒有人認得伊本·白圖泰，他站在人群邊上，手裡還攥著韁繩。{staff}一路上和他說過不少話，這時走到他身邊，喊了他的名字，問他今晚住在哪裡。他用袖口抹了一把臉，把攥了一路的韁繩換到另一隻手上。兩個人一前一後，從迎人的人群旁邊走進了城門。
      excerpts:
        p2: 第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
        p3: 他用袖口抹了一把臉，把攥了一路的韁繩換到另一隻手上。兩個人一前一後，從迎人的人群旁邊走進了城門。
        p1: 夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
    relic: 一隻走舊的涼鞋
    relic_desc: 一隻補過很多次底的皮涼鞋。
    points:
      p1: 從貝賈亞往突尼斯那一路，護住他帶著高燒撐在鞍上，走到突尼斯
      p2: 在米利亞納救下那位病倒在暑熱裡的突尼斯使節
      p3: 進突尼斯那天，讓他知道他在異鄉不是一個人
    points_fail:
      p1: 燒到一半他從鞍上栽了下來，這條分支裡他沒有走到突尼斯。
      p2: 那位使節照史實死在米利亞納外的溪邊，這條分支裡往突尼斯去的只剩一位使節。
      p3: 他照史實在城門口哭出聲來，這條分支裡那天陪他進城的只有那位同行的旅伴。
    shift:
      p1:
        was: 1325 年夏天，伊本·白圖泰發著高燒從貝賈亞上路，一路撐到了突尼斯。
      p2:
        was: 1325 年夏天，突尼斯蘇丹的兩位使節在米利亞納都因暑熱病倒，其中一位在城外的溪邊停了三夜後去世。
        now: '{staff}在溪邊守著他降了溫、喝下了水，離開米利亞納時兩位使節都在隊伍裡。他後來回到了突尼斯，此後的事沒有記載。'
      p3:
        was: 1325 年，進突尼斯那天沒有人上前問候他，他忍不住哭了出來。
        now: 進城那天他身邊多了一個一路認識的人，在突尼斯住下的兩個月裡他不再是一個人。
    vignettes:
      distance: '{staff}把最遠的目的地寫在一張紙條上，今晚落腳的地方另寫一張，挑夫今天用得上第二張。挑夫把它折了兩折，塞進腰帶裡。'
      departure: '{staff}留著行李單上的題頭，底下空出一行，給旅人真正落腳的地方，墨還沒乾，就拿在風裡晃了晃。'
      roll: '{staff}把目的和第一程各寫一條，卷在一起，到了城邊，把挑夫當天用得上的那張遞過去，自己留下另一張。'
  murasaki_kyoto:
    name: 世界上第一部偉大的長篇小說
    place: 京都
    figure: 紫式部
    story: 1008 年秋，中宮彰子生下皇子，侍奉她的紫式部在日記裡記下了此後的幾個星期。皇子誕生第五十日的宴席上，有位公卿借《源氏物語》裡的"若紫"向女官們搭話，這是這部物語見於記載的最早日子。十一月裡，女官們挑紙、謄寫、裝訂《源氏物語》，好讓彰子帶回宮中；道長又從紫式部房裡取走了她留著的稿本。她親筆的定本沒有傳下來。
    story_prose:
      opening:
        - 寬弘五年，即 1008 年秋，京都。一條天皇的中宮彰子生下皇子，侍奉她的女官紫式部在日記裡記下此後的幾個星期。皇子誕生第五十日的宴席上，有位公卿借《源氏物語》裡的"若紫"向女官們搭話，這是這部物語見於記載的最早日子。
        - 史實裡，十一月裡女官們挑紙、謄寫、裝訂物語，好讓彰子帶回宮中；道長趁紫式部當值，從她房裡取走了還沒改好的稿本，轉給女兒妍子，她在日記裡寫下了自己的擔心。她親筆的定本沒有傳下來，今天讀到的是後世彼此有出入的幾系抄本。在這條分支裡，彰子身邊有個管抄書用紙的女官，還有一個對宴席上的事心裡有數的女官。
        - 這一趟用得上幾種人：管過檔案、做過校對的人，或者手細、耐得住性子的人，守得住一套書一冊不錯；懂書又說得動人的人，替她把借出去的那一份挑對。
      outcomes:
        all: 十一月十七日，裝訂好的物語跟著彰子回了宮，一冊不缺。臘月以後來借書的人，翻開的是她點過記號的那一套。2012 年，日本把 11 月 1 日定為古典之日，取的是五十日宴上那一則日記。
        p2: 臘月以後來借書的人，翻開的是她核過的那一套，頁角有她點的小記號。她親筆的定本還是沒有傳下來，後世的抄本彼此仍有出入。
        p1: 十一月十七日，彰子帶著皇子回宮，裝訂好的物語跟著進了宮。2012 年，日本把 11 月 1 日定為古典之日，取的是五十日宴那一則日記。
      none: 臘月裡下了雪。紫式部房裡那幾帖沒改完的稿子被人借走了，案上只剩那隻漆盒，盒蓋沒有合嚴。
      desync: 十一月十七日一早，書箱裡還混著待核的幾冊。管紙的女官把紙樣攤了一地，一冊一冊地對。{staff}被召回時，她還跪在那堆紙中間，手裡捏著一張對不上的題簽。
      not_admitted: '{staff}沒能進到裡面，只在土御門邸的牆外站過幾回。五十日宴那夜，牆裡傳出樂聲和笑聲，有人高聲問了一句什麼，牆外聽不清。'
      points:
        p1:
          class_lettered: 十一月十七日一早，彰子要回宮了。廊下排著剛裝訂好的一摞摞冊子，抄完的和待核的混在一處，有幾張題簽上的墨還沒乾透。{staff}跟紙和字打慣了交道，把每一冊翻開對著章目核過，抽出一冊夾錯了帖的，從核過的那摞裡換上，再按章次一冊冊碼進書箱。車駕出門前，那位管紙的女官把最後一冊放進箱裡。她用指尖把箱角的繩結又按了一下，才直起身來。
          else: 十一月十七日一早，彰子要回宮了。廊下排著剛裝訂好的一摞摞冊子，抄完的和待核的混在一處，有幾張題簽上的墨還沒乾透。{staff}手細，又耐得住，把每一冊的題簽對著紙樣一一摸過，抽出一冊夾錯了帖的，從核過的那摞裡換上，再按章次一冊冊碼進書箱。車駕出門前，那位管紙的女官把最後一冊放進箱裡。她用指尖把箱角的繩結又按了一下，才直起身來。
        p2:
          class_lettered: 臘月中，雪停了兩天，宮裡有幾位女房託人來借物語，想先讀後面幾帖。紫式部房裡的案上還攤著幾帖沒改完的稿子，頁邊有她新添的小字。{staff}跟書打慣了交道，把她核過的那一套另裝一箱，箱上寫明是借本，每冊記下借給誰、幾時還；沒改完的幾帖用紙包好，留在她手邊。紫式部把一帖借本翻到末頁，提筆在頁角點了一個小小的記號。她把筆擱回那隻漆盒，盒蓋合上時輕輕響了一聲。
          else: 臘月中，雪停了兩天，宮裡有幾位女房託人來借物語，想先讀後面幾帖。紫式部房裡的案上還攤著幾帖沒改完的稿子，頁邊有她新添的小字。{staff}心細，話也說得動人，同來借書的人講明先讀這一套核過的，把它另裝一箱；沒改完的幾帖用紙包好，留在她手邊。紫式部把一帖借本翻到末頁，提筆在頁角點了一個小小的記號。她把筆擱回那隻漆盒，盒蓋合上時輕輕響了一聲。
      excerpts:
        p2: 紫式部把一帖借本翻到末頁，提筆在頁角點了一個小小的記號。她把筆擱回那隻漆盒，盒蓋合上時輕輕響了一聲。
        p1: 車駕出門前，那位管紙的女官把最後一冊放進箱裡。她用指尖把箱角的繩結又按了一下，才直起身來。
    relic: 一隻漆制筆盒
    relic_desc: 一隻小盒子，裡面有筆、硯和水。
    points:
      p1: 按章分配抄紙，逐冊驗收給彰子的《源氏物語》抄本，護住這次成冊
      p2: 給想先讀的人準備一份她願意借出的抄本，並把未定稿留在本人處，讓新抄人只按簽認本領書
    points_fail:
      p1: 抄完的章和待核章混裝，成套的書一直缺一冊，事務所因同步失敗召回員工。
      p2: 借去的仍是那份未定稿。後來的抄手不知道作者曾想再改。
    shift:
      p1:
        was: 紫式部的日記記有彰子身邊的人分紙抄寫《源氏物語》，道長為此提供紙筆。
      p2:
        was: 後世留存的是經長期傳抄下來的不同抄本，紫式部手定稿沒有傳到今天。
        now: 早期幾名讀者看到的是她核過的一套。以後各處傳抄仍會有變化，但這份借本記下了曾由她核過的章節。
        who: murasaki_kyoto
        bio: 紫式部在平安宮廷寫作。別人如何領紙、分抄和借閱，決定了一部未完全改定的作品怎樣進入宮外讀者手中。
    vignettes:
      banquet: 五十日宴的前一天，{staff}幫著沿迴廊搬膳臺，漆面上映著廊外的池水。一個女官壓低聲音說，明晚男賓喝多了，最愛拿物語裡的名字逗女官，聽見了也只當沒聽見。
      paper: '{staff}幫一個女官把各色的紙按章分好，每摞壓上鎮紙，窗縫裡進來的風掀起了最上面一張的紙角。她說抄好的每一頁都得先送去核，字寫歪了就整頁重抄，紙還得重新去領。'
      snow: 臘月裡下了雪，廊下的欄杆上積了薄薄一層。{staff}正在廊下掃雪，屋裡念物語的聲音唸到一半停了，有人問，下一冊誰拿走了。
  sejong_hangul:
    name: 人人都學得會的字母
    place: 首爾
    figure: 世宗大王與學者們
    story: 1443 年，朝鮮世宗親制二十八個字母，用來書寫朝鮮語。1444 年二月，集賢殿的崔萬理與六位同僚聯名上疏，提出異議。1446 年，新字以《訓民正音》之名頒布，意為教百姓的正確字音。世宗於 1450 年去世。
    story_prose:
      opening:
        - 1443 年，漢城。世宗做了二十八個新字母。朝鮮語可以說出口，可想把嘴裡的話寫下來，得先學一套和自己說話很不一樣的文字。世宗想讓一張紙也能用來寫家常話。
        - 史實裡，1444 年二月，集賢殿有人聯名上疏反對新字，宮裡用新字譯書的事正做到一半。那年春天，世宗為眼疾去椒水養病，此後身體每況愈下。在這條分支裡，椒水行宮外還有個攤主，賬算得清，簽名卻總要把筆交給別人。
        - 這一趟用得上三種人：守得住文稿的人，肯一筆一筆教人認字的人，懂醫藥、帶對了藥的人。
      outcomes:
        all: 那年夏天，世宗回宮時還看得清字。攤主簽了名的那張紙，他沒讓人收走，壓在新字校樣的最上面。
        p2: 椒水行宮外，那本賬的末尾，第一次是攤主自己的筆跡。
        p3: 那年夏天回宮，世宗還能自己看奏章。新字的校樣，他一頁一頁翻到了最後。
        p1: 集賢殿的燈又亮了。用新字譯出的《韻會》，一頁壓著一頁往上摞。
      none: 回到事務所後，{staff}還記得攤主遞筆時的那一下：手伸出去，在半空停了停，才把筆交給旁人。
      desync: 上疏之後，新字的稿頁散在議事廳的地上，沒有人去撿。{staff}被召回時，最上面那一頁印著半個鞋印。
      not_admitted: '{staff}沒能留到把新字教給攤主的時候。她又翻過一頁賬，紙上仍等著別人替她簽名。'
      points:
        p1: 上疏那幾天，議事廳裡人來人往，沒人顧得上桌上的稿頁。{staff}把用新字譯《韻會》的稿頁按次序碼好，壓上一方鎮紙。幾天後集賢殿的人回來，掀開了鎮紙。最上面那一頁，正是先前停筆的地方。
        p2:
          class_teaching: '{staff}照教書的老辦法，先讓她把名字唸響，再把每個音落成字母。椒水行宮外，攤主把自己的名字慢慢唸了一遍，跟著那幾聲在紙上寫。最後一筆落下時，她把紙轉正，用手指按著，一個字一個字點過去。那張紙後來送進了行宮，世宗把它拿到眼前，看了很久，沒有讓人收走。'
          else: '{staff}每天收攤前陪她坐一會兒，不催，哪一筆寫歪了就再寫一遍。椒水行宮外，攤主把自己的名字慢慢唸了一遍，跟著那幾聲在紙上寫。最後一筆落下時，她把紙轉正，用手指按著，一個字一個字點過去。那張紙後來送進了行宮，世宗把它拿到眼前，看了很久，沒有讓人收走。'
        p3: 在椒水，{staff}每天替世宗看眼睛，照著病情調藥、敷洗。回宮後，世宗把新字的校樣舉到眼前。字小，他看得慢，到翻頁的時候，沒有叫人，自己伸手把紙翻了過去。
      excerpts:
        p2: 最後一筆落下時，她把紙轉正，用手指按著，一個字一個字點過去。那張紙後來送進了行宮，世宗把它拿到眼前，看了很久，沒有讓人收走。
        p3: 回宮後，世宗把新字的校樣舉到眼前。字小，他看得慢，到翻頁的時候，沒有叫人，自己伸手把紙翻了過去。
        p1: 幾天後集賢殿的人回來，掀開了鎮紙。最上面那一頁，正是先前停筆的地方。
    relic: 一塊刻著字母的木板
    relic_desc: 刻著最早幾個字母的木板，等著上墨。
    points:
      p1: 上疏那幾天，護住議事廳裡用新字譯《韻會》的草稿，讓這件事照常往下做
      p2: 讓他親眼看到一個從沒念過書的百姓用新字寫出自己的名字
      p3: 在椒水，減輕他的眼疾，讓他還看得清新字
    points_fail:
      p1: 譯稿在那幾天散了、停了，新字少了第一件用場。
      p2: 這條分支裡，他到頒布之前都沒見過一個百姓用上新字。
      p3: 他照舊帶著眼疾回宮，這條分支與歷史一樣。
    shift:
      p1:
        was: 1444 年二月，集賢殿用新字翻譯《韻會》的工作照常進行。
      p2:
        was: 1446 年，新字以《訓民正音》之名頒布，四年後世宗去世。
        now: 椒水的行宮外有個攤主會寫自己的名字了，有人把這事報了上去。
      p3:
        was: 世宗多年患眼疾，1444 年春去椒水養病，此後身體每況愈下，1450 年去世。
        now: 椒水邊一個外鄉人幫他把眼睛治得輕了些，那年夏天他回宮時還能自己看奏章和新字的校樣。
    vignettes:
      gesture: '{staff}看見一位學士畫字母之前先比了比嘴形，便在頁邊添了一筆，把嘴怎樣張開和紙上的字留在一起。'
      spacing: '{staff}把紙劃成方格，將一個音節的幾部分寫進同一格，等墨稍幹，便把紙留在桌上。'
      lesson: '{staff}在集市上用樹枝寫下三個字母。孩子蹲著看了一會兒，把它們連起來唸成一個音，唸完便轉身跑開了。'
  basho_hiraizumi:
    name: 奧州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 1689 年春，松尾芭蕉帶著弟子曾良從江戶出發，徒步走北方。農歷五月十三日，兩人從一關去平泉，當天往返：登上北上川邊的高館，由別當帶著看了中尊寺的光堂，經堂因為別當不在沒有開。芭蕉後來把這一路寫成《奧之細道》，平泉一節有詠夏草的俳句，書裡寫兩座堂都開了。
    story_prose:
      opening:
        - 1689 年夏，日本東北的一關。松尾芭蕉帶著弟子曾良從江戶出發，已經走了一個多月。農曆五月十三日，天晴，兩人要去二里外的平泉看舊跡，當天趕回。這一路後來寫成了《奧之細道》。
        - 史實裡，那天看守帶他們看了光堂，經堂因為看守不在，沒有開。曾良在日記裡照實記下，芭蕉後來在書裡寫兩座堂都開了。在這條分支裡，一關的住處主人燒著洗澡水等客人回來，街口的腳伕說往北的路全是泥。
        - 這一趟用得上兩種人：記得住路、守得住時辰的人，肯去問清規矩、找得到人帶路的人。
      outcomes:
        all: 那天傍晚，芭蕉把斗笠掛在一關住處的門邊，上面落著一層灰。後來他寫平泉那一節時，筆下有一處梁木，是他從格子縫裡親眼看過的。
        p2: 後來芭蕉寫平泉那一節時，筆下有一處梁木，是他從格子縫裡親眼看過的。
        p1: 天黑以前，兩人回到了一關。斗笠掛在門邊，上面落著一層灰。
      none: 平泉的舊跡在暮色裡一點點暗下去。經堂的門關著。
      desync: 過了岔路，日頭已經偏西，兩人離平泉還遠。{staff}沒等到他們折回一關，就被事務所召了回來。
      not_admitted: '{staff}沒能跟上那兩個旅人。一關的街口，兩頂斗笠已經出了城。'
      points:
        p1: 出了一關，路分了兩回岔。{staff}照著曾良本子上記的站點一處處對過去，哪裡該折、幾時得往回走，都先說給兩人聽。芭蕉點點頭，把斗笠的帶子繫緊了。日頭偏西的時候，兩人已經走在回一關的路上。
        p2:
          class_lettered: '{staff}照查檔的習慣，先問清看守哪天出的門、誰替他照看著，再問外廊哪一段許人走。附近一個上了年紀的人放下手裡的活，領兩人沿外廊繞到經堂側面。門還關著，從格子縫裡能看見裡頭的梁木。芭蕉站了很久沒有說話，曾良低頭在本子上添了一行。'
          else: '{staff}在堂前等了一陣，向附近的住戶一個個問過去，問看守幾時回來，外廊哪一段許人走。附近一個上了年紀的人放下手裡的活，領兩人沿外廊繞到經堂側面。門還關著，從格子縫裡能看見裡頭的梁木。芭蕉站了很久沒有說話，曾良低頭在本子上添了一行。'
      excerpts:
        p2: 門還關著，從格子縫裡能看見裡頭的梁木。芭蕉站了很久沒有說話，曾良低頭在本子上添了一行。
        p1: 芭蕉點點頭，把斗笠的帶子繫緊了。日頭偏西的時候，兩人已經走在回一關的路上。
    relic: 一頂草笠
    relic_desc: 被雨淋灰了的編織草帽。
    points:
      p1: 把曾良記下的回程站點和折返點核給兩人，護住芭蕉與曾良當天往返平泉的行程
      p2: 得知看守不在時，去確認當天有誰能帶訪客走外廊。先問當地人哪些地方可以看，再把路線交給兩位訪客
    points_fail:
      p1: 一條路指錯了來處，兩人到看舊跡的路口時已經趕不及往返。事務所因同步失敗召回員工。
      p2: 沒人知道看守何時回來，兩人只能從外側經過，入口仍關著。
    shift:
      p1:
        was: 曾良的行程日記記元祿二年農歷五月十三日，兩人從一關去平泉，當日折回。
      p2:
        was: 元祿二年五月十三日，曾良記別當帶路看了光堂，經堂因別當不在沒有開；芭蕉後來在紀行裡寫兩座堂都開了。
        now: 附近的人確認經堂外廊可走，帶兩人從允許的地方看了經堂。芭蕉回到住處時，多了一處自己親眼看過的建築細節。
        who: basho_hiraizumi
        bio: 芭蕉與曾良的平泉行程只有當天的一段時間。後來入書的寫法與曾良當日的路線記錄各有側重。
    vignettes:
      grass: '{staff}跟著兩個旅人登上高館。北上川在底下流，草長得齊腰高。年長的那位把斗笠鋪在地上坐下，半天沒出聲，年輕的那位在本子上記著什麼，{staff}不好開口，就陪著看河。'
      bath: '{staff}幫一關住處的主人挑水燒洗澡水。主人說那兩位客人今天去了平泉，回來準是一身汗；看舊跡看哭了回來的客人他見得多了，洗個澡就好。'
      sandal: '{staff}在一關的街口幫人系草鞋帶子，鞋底的泥已經幹成了塊。路過的腳伕說，往北的路這幾天全是泥，接著趕路的人最好先換一雙新草鞋。'
  tagore_santiniketan:
    name: 一首詩，讀兩遍
    place: 印度聖蒂尼克坦
    figure: 羅賓德拉納特·泰戈爾
    story: 1912 年 11 月，英文版《吉檀迦利》在倫敦出版，收的是羅賓德拉納特·泰戈爾自己從孟加拉語譯寫的散文詩。1913 年 11 月 13 日，瑞典學院把諾貝爾文學獎授予他。十天後，一列火車從加爾各答載來祝賀的人，到了他在聖蒂尼克坦的學校。他在答辭裡說，自己不能毫無保留地接受這份以國家名義獻上的榮譽，許多來客帶著不快回去了。獎金給了學校，1921 年，學校成了國際大學。
    story_prose:
      opening:
        - 1913 年 11 月，孟加拉的聖蒂尼克坦。詩人羅賓德拉納特·泰戈爾在這裡辦著一所學校。一年前，他自己從孟加拉語譯寫的英文《吉檀迦利》在倫敦出版；11 月 13 日，瑞典學院把諾貝爾文學獎授予他，他是第一位獲此獎的歐洲以外的作家。
        - 史實裡，十天後，一列火車從加爾各答載來祝賀的人；他在答辭裡說，自己不能毫無保留地接受這份以國家名義獻上的榮譽，許多來客帶著不快回去了，此後他與許多同胞之間隔著一層。在這條分支裡，學校裡有個愛爬芒果樹的男孩和一個管米的廚子，來客裡有一位在車站落下了傘。
        - 這一趟用得上幾種人：教過書、跑過新聞、做過導遊、懂得怎樣跟人搭話的人；性子溫和沉穩、意志也夠的人；帶著金蘋果的人也行。散場以後，人已經往車站走了。
      outcomes:
        all: 那晚的客人坐夜裡的車回了加爾各答。此後幾年，從城裡來聖蒂尼克坦的人一撥接一撥，1921 年，這所學校成了國際大學。
        p1: 那晚的客人坐夜裡的車回了加爾各答。此後幾年，從城裡來聖蒂尼克坦的人一撥接一撥，1921 年，這所學校成了國際大學。
      none: 11 月 23 日傍晚，來客們在博爾布爾車站等車，月臺上沒有人說話。火車開走以後，芒果樹下的長凳還擺著，一張也沒有收。
      not_admitted: '{staff}沒能進學校，只在博爾布爾車站的月臺上看著那一列火車進站、出站。來時車廂裡有人唱歌，回去時窗都關著。'
      points:
        p1:
          class_teaching: 11 月 23 日，祝賀會散了，來客三三兩兩往博爾布爾車站走，走在後面的幾位一路沒有說話。{staff}教過書，知道一句話說重了，要等人走出幾步再去追，追上那幾位，陪他們在路邊站了一會兒，把他們請回了院子。天黑以後，屋裡點上了燈，泰戈爾和幾位客人圍著矮桌坐下，茶添了兩回。一位客人拿起他手邊的手抄歌集，又合上了，說起自己在院裡聽到的那句答辭。泰戈爾問是哪幾個字讓他這麼想，等他答完才開口。
          class_press: 11 月 23 日，祝賀會散了，來客三三兩兩往博爾布爾車站走，走在後面的幾位一路沒有說話。{staff}跑過新聞，知道一句話傳到第二個人嘴裡就變了樣，追上那幾位，請他們先別把今天的話帶回城裡，回去當面再問一句，把他們請回了院子。天黑以後，屋裡點上了燈，泰戈爾和幾位客人圍著矮桌坐下，茶添了兩回。一位客人拿起他手邊的手抄歌集，又合上了，說起自己在院裡聽到的那句答辭。泰戈爾問是哪幾個字讓他這麼想，等他答完才開口。
          else: 11 月 23 日，祝賀會散了，來客三三兩兩往博爾布爾車站走，走在後面的幾位一路沒有說話。{staff}性子和緩，追上那幾位，陪他們在路邊站了一會兒，沒多說什麼，只問他們走之前要不要再喝一杯茶，把他們請回了院子。天黑以後，屋裡點上了燈，泰戈爾和幾位客人圍著矮桌坐下，茶添了兩回。一位客人拿起他手邊的手抄歌集，又合上了，說起自己在院裡聽到的那句答辭。泰戈爾問是哪幾個字讓他這麼想，等他答完才開口。
      excerpts:
        p1: 天黑以後，屋裡點上了燈，泰戈爾和幾位客人圍著矮桌坐下，茶添了兩回。一位客人拿起他手邊的手抄歌集，又合上了，說起自己在院裡聽到的那句答辭。泰戈爾問是哪幾個字讓他這麼想，等他答完才開口。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的親筆。
    points:
      p1: 祝賀會散場後，勸回被他的答辭刺傷的來客，讓他和這些多半是朋友的人把話說開
    points_fail:
      p1: 來客照史實帶著怨氣散去，此後他與許多同胞之間照舊隔著一層，這條分支與歷史一樣。
    shift:
      p1:
        was: 1913 年 11 月 23 日，一列火車從加爾各答載來祝賀的人，泰戈爾在答辭裡說，自己不能毫無保留地接受這份以國家名義獻上的榮譽，來客多半不快，此後他與許多同胞之間生了很深的隔閡。
        now: 那天傍晚，有幾位客人折了回來。一位問泰戈爾究竟不願領受哪一份榮譽。泰戈爾等他說完，請他把剛才聽到的話再說一遍。幾個人留下來，把彼此的話聽完。
        who: tagore_santiniketan
        bio: 這條時間線裡，1913 年那場祝賀會散場後，泰戈爾當晚就和來客把話說開，沒有因那篇答辭與同胞生出隔閡。
    vignettes:
      telegram: 消息傳來那天，{staff}幫孩子們往芒果樹下搬長凳，凳腿在紅土上拖出一道道印子。一個孩子爬上樹喊，全加爾各答都要坐火車來了，被老師揪了下來，還不服氣，說那總得有人先把凳子數夠。
      platform: 天擦黑，月臺上的燈還沒點，{staff}在博爾布爾車站幫一位來客找回落下的傘。他在月臺上攥著傘站了半天，火車進站時才問，詩人對客人說話一向是這樣的嗎。
      rice: 十二月，{staff}幫學校的廚子在院裡攤曬米，竹耙子一過，米粒沙沙地響。廚子說，來看詩人的人一撥接一撥，今年的米下得比哪年都快。
  ramanujan_madras:
    name: 一封請人核算的信
    place: 馬德拉斯
    figure: 斯里尼瓦瑟·拉馬努金
    story: 1912 年 3 月起，斯里尼瓦瑟·拉馬努金在馬德拉斯港務局會計部當職員。1913 年 1 月 16 日，星期四，他從那裡給劍橋的 G. H. 哈代寫信，介紹自己的研究和對發散級數的探索。1914 年他去了英國，1920 年病重回到印度後去世。
    story_prose:
      opening:
        - 1913 年 1 月，馬德拉斯。二十五歲的斯里尼瓦瑟·拉馬努金在港務局會計部當職員，白天對賬，夜裡演算。1 月 16 日，星期四，他從這裡給劍橋的 G. H. 哈代寫信，講自己在大學課程之外做出的結果。
        - 史實裡，哈代 2 月 8 日回了信，要他把證明寫出來；2 月 27 日他寫成第二封信寄出，信裡說自己已經是個半餓著肚子的人；獎學金五月才下來，此前一家靠他每月三十盧比的薪水過活；1914 年他去了英國，1917 年病重，診斷一直沒有定論，1920 年回到印度後去世，年僅 32 歲。在這條分支裡，港務局有個負責捆寄海外紙包的職員，賬房裡有個和他合用一盞燈的同事。
        - 這一趟用得上幾種人：會做飯、會照顧人的人，或帶著營養合成器、意志堅定的人，或性子和氣耐心、身子結實的人；會管賬、做過買賣，或條理清楚、熟門熟路的人，帶一個禮品盒上門也行；帶著納米醫療箱的醫生或醫護。
      outcomes:
        all: 1914 年，他上船去了英國，行李裡裝著那塊石板。後來在劍橋，他沒有住進療養院；回到印度以後，他又做了很多年數學。
        p3: 1914 年，他去了英國。幾年後在劍橋，他沒有住進療養院；回到印度以後，又做了很多年數學。
        p2: 那年五月，獎學金下來了，每月七十五盧比。那幾個月，家裡的米缸一直沒有見底。
        p1: 那封信寄到了劍橋，封口上蓋著馬德拉斯的郵戳。1914 年，他上船去了英國。
      none: 2 月 27 日夜裡，他倒在燈下，寫了一半的紙頁散在桌上。劍橋那邊，哈代沒有等到下文。
      desync: 2 月 27 日夜裡，他倒在燈下。{staff}被召回時，寫了一半的信壓在他的胳膊底下，墨跡洇開了一小片。
      not_admitted: '{staff}沒能進港務局，只在門外看著職員們抱著賬本進進出出。負責捆紙包的那位職員唸著封套上的地址，唸到劍橋，停了一下。'
      points:
        p1:
          class_food: 2 月下旬，哈代 2 月 8 日寫的回信寄到了馬德拉斯，要他把證明寫出來。他每晚伏在燈下，一張紙寫滿了又換一張，肚子卻總是半飽。{staff}會做飯，每天傍晚把一碗熱米飯和一碗豆湯送到燈下，看著他吃完，才讓他接著寫。2 月 27 日夜裡，信寫完了，他把紙頁一張張對齊，摺好裝進信封。和他合用一盞燈的同事已經睡了，燈芯還亮著。
          class_medical: 2 月下旬，哈代 2 月 8 日寫的回信寄到了馬德拉斯，要他把證明寫出來。他每晚伏在燈下，一張紙寫滿了又換一張，肚子卻總是半飽。{staff}懂照護，按時把飯送到桌邊，隔一陣勸他起來走幾步、喝口水，夜深了把燈捻小，催他躺下歇一會兒。2 月 27 日夜裡，信寫完了，他把紙頁一張張對齊，摺好裝進信封。和他合用一盞燈的同事已經睡了，燈芯還亮著。
          else: 2 月下旬，哈代 2 月 8 日寫的回信寄到了馬德拉斯，要他把證明寫出來。他每晚伏在燈下，一張紙寫滿了又換一張，肚子卻總是半飽。{staff}每天把飯送到桌邊，夜裡陪著坐到很晚，他的手一停，就把水杯推到他手邊。2 月 27 日夜裡，信寫完了，他把紙頁一張張對齊，摺好裝進信封。和他合用一盞燈的同事已經睡了，燈芯還亮著。
        p2:
          class_lettered: 四月，家裡的米缸又快見底了。每月三十盧比的薪水要養活一家人，獎學金的事還沒有下文。{staff}做慣了案頭的事，把這個月的進出一項項寫在紙上，米、油、房租各留多少，算到月底還能剩幾個安那。那天晚上，米缸裡的米又滿到了缸沿。拉馬努金坐在門口的臺階上，膝上擱著石板，一筆一筆寫下去。
          class_trade: 四月，家裡的米缸又快見底了。每月三十盧比的薪水要養活一家人，獎學金的事還沒有下文。{staff}做過買賣，去集市上找相熟的米商，一次多買幾斗，把價錢壓下來一截。那天晚上，米缸裡的米又滿到了缸沿。拉馬努金坐在門口的臺階上，膝上擱著石板，一筆一筆寫下去。
          else: 四月，家裡的米缸又快見底了。每月三十盧比的薪水要養活一家人，獎學金的事還沒有下文。{staff}把家裡的開銷一樣樣理清，米和油按天分好，又提著一盒東西去相熟的人家，換回了半個月的口糧。那天晚上，米缸裡的米又滿到了缸沿。拉馬努金坐在門口的臺階上，膝上擱著石板，一筆一筆寫下去。
        p3:
          class_learned: 五月底，獎學金已經下來了。他的舊病又犯了，人一陣陣發虛，瘦得厲害，這是好幾年前就落下的病根，一直沒有斷。{staff}懂醫，問清了這些年幾回發病的經過，看出是那個沒斷根的舊病，打開帶來的納米醫療箱，把它治了下去。一個月後，他吃飯時多添了一碗，夜裡也睡得安穩了。天一亮，他就拿起石板，粉筆在上面寫得又快又密。
