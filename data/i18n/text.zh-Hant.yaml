      p2: 用兩次報告為居里爭取一間能穩定工作的房間，替以後反復測量保住儀器和記錄
      p3: 從這時起讓瑪麗和皮埃爾隔著防護處理樣品，護住他們的手和身體，少受射線
    points_fail:
