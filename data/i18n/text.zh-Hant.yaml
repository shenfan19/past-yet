      name: '{staff}問學生教室關門後到哪兒還書。學生把寫好地址的紙夾進封裡。'
  gutenberg_mainz:
    name: 用活動金屬字模印書
    place: 美因茨
    figure: 古騰堡
    story: 約翰·富斯特出錢支持古騰堡在美因茨印書。四十二行本留了下來，1455 年 11 月 6 日記下富斯特追討借款和利息的公證書也在。文書沒有寫清官司以後各人拿了哪些工具。
    story_prose:
      opening:
        - 美因茨的印工把新印的一張舉到光下，在頁角做個小記號。送紙的人問他這次能不能結錢。古騰堡手裡是一疊要核的頁，富斯特手裡是一筆要對的賬。
        - 史實裡，四十二行本在這一時期印成。1455 年 11 月 6 日的公證書留下古騰堡與富斯特爭執的記錄。這趟可先保住這一批工料，並另外爭取兩人說清哪些工具散夥後還能用。
        - 懂印工或核賬的人可以替印坊核紙、活字和工錢。要談器具，還要有人能請兩邊坐下，把商量結果寫進紙裡。
      points:
        p1: 印工算過紙堆，說還有一疊需要補。你讓送紙人照著計工單點過當天印好的份數，再同古騰堡一起把下一批紙和工錢分列。送紙人擦去原先寫著要收回的記號。第二天，壓床上放著能繼續接印的第一張新紙。
        p2: 富斯特拿來一份總賬，說看不出哪件是借款置辦的。你請古騰堡從眼下還要用的工具講起，請書記把可繼續使用的器具逐條讀給兩人聽。兩人各取一份副本，木柄還留在原來的鉤上。離開時，古騰堡把自己那份折進工錢簿。
      outcomes:
        all: 四十二行本印完，富斯特和古騰堡仍要解開賬上的糾紛。可繼續使用的器具已有兩人各自收起的副本。
        p1: 工班繼續印下去，成書的頁疊出門。公證人仍會見到兩邊爭論工具和錢。
        p2: 一份工具使用清單已經寫出。書還印不下去，本趟只收回這份商議記錄。
      none: 印床剩著沒揭下的一頁，工料還等雙方答覆。
      not_admitted: 門裡的印工問來客找送紙的還是找記賬的。無人招呼你進來，外頭只聽見木板落在臺上的一聲。
      desync: 印床停在半途，紙和工錢都沒有接上。原有刊印史失去同步，事務所召回員工。
      excerpts:
        p1: 送紙人擦去原先寫著要收回的記號。第二天，壓床上放著能繼續接印的第一張新紙。
        p2: 兩人各取一份副本，木柄還留在原來的鉤上。離開時，古騰堡把自己那份折進工錢簿。
    relic: 一粒鉛字
    relic_desc: 鉛錫合金的一個小字，是反著的。
    points:
      p1: 護住用借款維持的印工、紙張與活字，讓四十二行本能夠印完
      p2: 11 月的官司前，請古騰堡和富斯特談妥散夥後古騰堡還能繼續使用哪些印書工具
    points_fail:
      p1: 四十二行本印到一半停在印機上，這條分支與歷史脫了節，事務所當天召回員工。
      p2: 雙方照樣走到公證人那裡，工具的用法卻沒談攏。古騰堡還不知道自己以後能不能接著用。
    shift:
      p1:
        was: 1455 年，四十二行本在美因茨古騰堡的印坊裡用金屬活字印成。
      p2:
        was: 1455 年 11 月 6 日，美因茨的公證人記下富斯特討還借款和利息的案子。文書沒有寫清工具最後歸誰。
        now: 古騰堡與富斯特談妥自己還能接著用哪些工具。散夥以後，他可以用這些工具安排下一次印書。
        who: gutenberg_mainz
        bio: 這條分支裡，1455 年的爭議過後，古騰堡還能使用談妥的那部分印書工具。
    vignettes:
      wrong_sort: 學徒正要把一枚活字扔回字格，你認出它放錯了。你把它和旁邊那枚並在一起，讓他看看為什麼印出來會串成另一個字。
      reader: 你問字擠成這樣，離遠一點還能讀嗎？學徒退後幾步念出聲，在眼睛跳錯行的地方做了記號。
      proof: 你拿到校樣，從下往上一行一行念。學徒還在笑，轉眼發現自己把紙上沒印的字也念了出來。
  leonardo_florence:
    name: 畫畫的人，也畫機器
    place: 佛羅倫薩
    figure: 列奧納多·達·芬奇
    story: 盧浮宮把列奧納多開始畫《蒙娜麗莎》的時間定在約 1503 年，並記載他後來仍在繼續修改。
    story_prose:
      opening:
        - 佛羅倫薩的工房裡，平日靠窗的板子已經挪開，那裡要擺進新工作用的架子。經辦人來問麗莎的畫像放在哪。學徒抱著空架，叫他別去扶還沒有乾的板。
        - 1503 年 10 月，韋斯普奇的批註提到達·芬奇畫麗莎。畫像後來留在畫家手中。這裡可以讓畫板有一處安全又能幹活的地兒，還可以約一天，讓麗莎來看畫家願意給她看的階段稿。
        - 能察看架子、板材和日照的員工先替工房安排位置。善於召集人的員工再聯繫麗莎與經辦人，把看稿時間定下來。
      points:
        p1: 學徒想在舊架裡再擠一個空。你請他先把一塊空板向裡推，見到板角貼住了旁邊一幅畫。你跟他把窗下最窄的架格單留出來，再請畫家寫一個裝卸時認得出的記號。晚些時候有人收畫，伸手先摸到了留給這塊板的籤條。
        p2: 畫家叫學徒把另一張乾透的練習拿來擋住手邊的顏料。他自己把願給麗莎看的畫像轉向門裡。麗莎站在他選的位置，問下回是否還要照那樣坐。他對照椅背想了片刻，請學徒把凳子的位置記下。麗莎走後，畫家把畫板轉回自己的光裡。
      outcomes:
        all: 工房裡還有一個能繼續畫的位子。麗莎知道這塊板已經畫到了哪裡，畫家仍自己保管它。
        p1: 畫像的暫存格有了籤條和光。經辦人能問到進度，室內還沒有約好看稿的日子。
        p2: 麗莎已看過一回。畫板後來受損，這段相約看畫的記錄隨員工帶回。
      none: 架子還沒騰出。來詢問的人在門邊等過一陣，只問到畫還沒交。
      not_admitted: 學徒請來客讓開扛架的人。畫板在裡面，門邊看不到正面。
      desync: 未乾的畫板送進舊架時被鄰板擠壞。原有畫像無法保住，事務所召回員工。
      excerpts:
        p1: 你跟他把窗下最窄的架格單留出來，再請畫家寫一個裝卸時認得出的記號。晚些時候有人收畫，伸手先摸到了留給這塊板的籤條。
        p2: 他對照椅背想了片刻，請學徒把凳子的位置記下。麗莎走後，畫家把畫板轉回自己的光裡。
    relic: 一頁鏡像書寫的筆記
    relic_desc: 一頁反著寫的字，要對著鏡子才讀得出。
    points:
      p1: 在工房接下別的市政繪畫工作以前，給麗莎的畫像留一個白天可用、暫存時可認出的位子
      p2: 替畫家與經辦人議定分段查看的機會，趁畫像還在佛羅倫薩，讓坐畫的人看到一份由畫家同意展示的階段稿
    points_fail:
      p1: 新工作一到，未乾的畫板被夾進舊架，畫像在這次交接中受損，事務所召回員工。
      p2: 沒約定何時可看，畫像繼續留在畫家手中。委託一方只能聽工房傳來說到了哪一步。
    shift:
      p1:
        was: 韋斯普奇 1503 年十月的書上批註說，達·芬奇正在畫麗莎·德爾·焦孔多。
      p2:
        was: 這幅肖像歷經長時間修改，最終隨畫家離開意大利並進入法國收藏。
        now: 麗莎來時，畫家給她看這一階段已成形的肖像。以後畫板仍可隨畫家帶走，工房另留一份雙方見過的稿樣。
        who: leonardo_florence
        bio: 佛羅倫薩的同時代批註證實畫家在做麗莎的肖像。後來畫作繼續發展，流傳遠離最初的工房。
    vignettes:
      shadow: 你請學徒指一指，臉從哪兒結束，背景從哪兒開始。他伸手又猶豫了，沒有加重那道線，先把交界處留著再看。
      hands: 訪客記得臉，卻把手的位置畫變了。你把習作和他憑記憶畫的圖並排，讓他自己找出線條挪到了哪裡。
      seat: 學徒收拾東西時，你在地上替模特的椅子做了個記號。他把畫留在半成處，下次來仍知道椅子該放哪兒。
  galileo_padua:
    name: 木星身邊的衛星
    place: 帕多瓦
    figure: 伽利略
    story: 伽利略在《星際信使》中記錄了木星附近四個小天體的位置變化，並判斷它們繞木星運行。
    story_prose:
      opening:
        - 帕多瓦一月的觀測結束，伽利略把一排光點畫在木星旁邊。第二晚位置有了變化，抄寫人把兩張圖按紙的大小疊放。去威尼斯的人問，他該照哪一天的圖先排。
        - 1610 年，《星際信使》刊出對木星衛星的連續觀測。那年四月博洛尼亞有一次觀測嘗試，霍爾基後來印文質疑。分支能先保住一月的圖稿日序，再幫來客實際看到幾顆光點。
        - 讓會對圖和記日期的人整理付印稿。到馬吉尼家，要讓來客先看清亮星，再自己看木星旁邊。
      points:
        p1: 你問抄寫人是先看到了三顆還是先看到了兩顆。他把記錄簿拿來，發現正好反了。伽利略逐夜讀出日期，你把頁角和簿上的觀測時刻一一對過，再將圖交給去威尼斯的抄寫人。他翻到第二夜才點頭，認得出那些光點怎樣換了位置。
        p2: 進馬吉尼家的第一個來客撤回了眼睛，說只看見一層薄光。伽利略讓出位置，你請來客先找一顆能認出的亮星，再回到木星那裡。來客坐穩後抬起手，隔著桌子指給同伴看。他叫第二個人也數一次，先把自己數到的幾個按在心裡。
      outcomes:
        all: 印出來的圖保留一月日序。博洛尼亞那晚，來客還留下各自記下的數目，問下一夜會換到哪裡。
        p1: 威尼斯的排印稿順序正確。博洛尼亞的爭議仍會有寫信和印小冊子的經過。
        p2: 至少一位來客能自己報出木星旁的光點。印刷稿日序失去同步，這一小段只能隨旅途記錄保存。
      none: 抄寫人用紙的大小整理，圖仍沒有排出夜夜的先後。
      not_admitted: 門邊的人問來客跟誰一道。你沒能進屋，最後看到的是抄寫人把圖收入紙套。
      desync: 散開的圖在排印稿裡換了日序，原有觀測記述失去同步，事務所召回員工。
      excerpts:
        p1: 伽利略逐夜讀出日期，你把頁角和簿上的觀測時刻一一對過，再將圖交給去威尼斯的抄寫人。他翻到第二夜才點頭，認得出那些光點怎樣換了位置。
        p2: 來客坐穩後抬起手，隔著桌子指給同伴看。他叫第二個人也數一次，先把自己數到的幾個按在心裡。
    relic: 一片磨製的透鏡
    relic_desc: 一片小小的玻璃透鏡，是手工磨出來的。
    points:
      p1: 把一月連夜畫下的木星與光點位置按日期裝好，護住送往威尼斯付印時的觀測日序
      p2: 四月下旬在博洛尼亞，幫馬吉尼的客人們從伽利略的望遠鏡裡看見木星的衛星
    points_fail:
      p1: 幾夜的簡圖散開後只剩大致次序，排印稿的日序錯位，事務所因同步失敗召回員工。
      p2: 客人們看過以後說什麼也沒看見。霍爾基寫信給開普勒，六月印出反駁《星際信使》的小冊子。
    shift:
      p1:
        was: 伽利略從 1610 年 1 月起連續觀測木星，隨後在《星際信使》刊出位置記錄。
      p2:
        was: 1610 年 4 月下旬，伽利略在博洛尼亞的卡普拉拉宮把望遠鏡給馬吉尼等客人看，他們說看不到那幾顆衛星；在場的馬丁·霍爾基六月印出了反駁伽利略的小冊子。
        now: '{staff}把鏡筒架穩，教客人往哪裡看。好幾位客人當晚看見了木星旁邊的光點，霍爾基的小冊子少了立足的地方，這幾顆新星早一些得到承認。'
        who: galileo_padua
        bio: 1610 年 4 月在博洛尼亞，馬吉尼的客人們從伽利略的望遠鏡裡看見了木星的衛星。《星際信使》之後的懷疑短了許多。
    vignettes:
      alignment: 你攔住正要把兩頁按紙邊對齊的謄寫員。先對齊木星吧。紙一挪，幾個光點就錯開了。
      telescope: 你追問第四個光點是哪一個。謄寫員攤開幾晚的圖，反問你：有兩個點捱得看不清時，該相信哪一夜？
      dates: 謄寫員疊起散頁之前，你替每張補上日期。下一個人就能按夜看出光點怎樣換了位置。
  heo_nanseolheon_hanyang:
    name: 裝著散詩的紙套
    place: 漢陽
    figure: 許蘭雪軒
    story: 許蘭雪軒去世後，弟弟許筠整理了她留存的作品，現存刊本中有 1608 年的朝鮮木刻本。
    story_prose:
      opening:
        - 抄寫人把新裁的紙套壓在鎮紙底下，遞來兩張首句一樣的散頁。一張是練筆，一張有人來借讀。他只記得兩張紙都從窗邊拿來。
        - 史實裡，許蘭雪軒去世後，弟弟許筠整理留存的詩文。1597 年選本與現存的 1608 年刊本有異文。這一趟先保住能找到的底稿，還可以請她親自挑出願意傳閱的幾篇。
        - 能對讀筆跡和題頭的員工先理出同篇異稿。能把借閱的來意講明白的人，再去問她哪幾首可以送到門外。
      points:
        p1: 抄寫人指著墨色最深的那張說要留它。你讓他把兩張詩頁並在一起，看到淺墨頁的尾句另有一筆修改。他照你指出的位置在紙套上寫了存放處，才把兩稿都收進去。兩張紙從此用一個題頭，套口留了足夠寬的邊。
        p2: 許蘭雪軒把抄寫人挑的第一首移到自己手邊，另選一首填進空處。你問這一疊該寫借誰的名字，她把筆接過來，在最上面的紙邊寫下自己的名字，再把紙疊照原來的次序遞還。她讓抄寫人把署名也謄一遍。
      outcomes:
        all: 後來許筠編集時，那一小疊仍按姐姐遞出時的次序放在一起。抄寫人謄下的名字留在頭一頁。
        p1: 同篇異稿都找得到。許筠編集時可以自己對讀，詩人在世時會怎樣取捨，仍無從得知。
        p2: 她為幾首詩親自寫下署名。存稿的來路出了岔子，署名留下的選擇只能隨本趟短記帶回。
      none: 抄書桌上仍只有混在一起的紙。後來家人只能從餘下的稿子挑選；本趟記錄沒有帶回來一份作者選目。
      not_admitted: 抄寫人隔門問來客要借哪一首。沒人能說出題頭，他把紙套留在桌上。
      desync: 再去問存稿放在哪裡時，抄寫人只認得已經空了的紙套。編集所需的底稿失去下落，事務所召回員工。
      excerpts:
        p1: 他照你指出的位置在紙套上寫了存放處，才把兩稿都收進去。兩張紙從此用一個題頭，套口留了足夠寬的邊。
        p2: 你問這一疊該寫借誰的名字，她把筆接過來，在最上面的紙邊寫下自己的名字，再把紙疊照原來的次序遞還。她讓抄寫人把署名也謄一遍。
    relic: 一頁詩稿
    relic_desc: 一頁細紙，用毛筆寫著寫花和遠方的詩。
    points:
      p1: 替家裡把已經傳抄的詩篇放在一處，給許筠日後編集留下能找到的底稿
      p2: 請許蘭雪軒從中挑出想讓人讀的幾篇，在那一小疊詩稿上署名
