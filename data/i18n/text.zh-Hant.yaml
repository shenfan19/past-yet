  vermeer_delft:
    name: 負債的畫家
    place: 代爾夫特
    figure: 約翰內斯·維米爾
    story: 1672 年戰事以後，約翰內斯·維米爾的畫幾乎賣不出去，1675 年 7 月他去阿姆斯特丹借了一千荷蘭盾。據他的遺孀後來陳述，那年 12 月他在一天半里由好好的人到了去世；12 月 15 日他葬在代爾夫特，四十三歲，留下十一個孩子。1676 年初，卡塔琳娜·博爾內斯把他的兩幅畫交給麵包商抵麵包錢，2 月 24 日又把《繪畫藝術》轉到母親瑪麗亞·廷斯名下。2 月 29 日，公證人來家裡清點遺產；4 月，她請求高等法院免去她的債務。
    relic: 一枚珍珠耳環
    relic_desc: 一顆小珍珠，是他常畫的那種。
    points:
      p1: 年底之前，護住畫室裡那幅《繪畫藝術》，不讓它被債主拿去抵債
      p2: 幫他把戰後壓在手裡的幾幅畫賣出去，緩一緩這家人的債
      p3: 讓他知道自己的畫會被記住
      p4: 十二月中旬之前，治好他，讓他活下來
    points_fail:
      p1: 《繪畫藝術》在年底被債主拿去抵了債，次年二月卡塔琳娜無畫可轉給母親，這條分支與歷史脫了節，員工被送回。
      p2: 畫照舊壓在手裡，一幅也沒賣出去，這條分支裡這家人的債照舊一天天重下去。
      p3: 他照舊不知道這些畫以後會怎樣，這條分支裡沒有人告訴過他，兩百年後會有人把它們一幅幅找回來。
      p4: 十二月照史實過去，他在一天半里由好好的人到了去世，這條分支裡卡塔琳娜照舊一個人帶著十一個孩子面對那些債。
    shift:
      p1:
        was: 1676 年 2 月 24 日，卡塔琳娜·博爾內斯把《繪畫藝術》轉到母親瑪麗亞·廷斯名下，免得被拿去抵債；維米爾負債時也沒有賣掉它。
      p2:
        was: 1672 年戰事以後，維米爾自己的畫賣不出去，經手的別家畫作也壓在手裡；卡塔琳娜後來說這是家裡欠債的緣由。
        now: 那個十二月有幾幅畫找到了買主，麵包賬和別的欠債暫時不再往上漲。
      p3:
        was: 1675 年去世以後，維米爾被冷落了將近兩百年，到 1860 年代托雷-比爾熱的研究才讓他的畫重新被人認出。
        now: 有人告訴過他，這些安靜的屋子以後會被人一幅幅找出來、認回來。
      p4:
        was: 1675 年 12 月，據卡塔琳娜後來的陳述，他被債務和孩子壓著，一天半里由好好的人到了去世；12 月 15 日葬於代爾夫特，年四十三。
        now: '{staff}陪他過了那個十二月，那一天半沒有到來。他回到代爾夫特的畫室，又畫了些年，卡塔琳娜和十一個孩子沒有在那個冬天失去他。'
        who: vermeer_delft
        bio: IF 線裡，維米爾挺過了 1675 年的十二月，又在代爾夫特畫了些年，陪這一家把債慢慢還清。
    vignettes:
      bread: 12 月 5 日早上，{staff}幫麵包鋪的夥計沿著老朗恩代克街送麵包。到了一家門口，夥計把麵包遞進去，沒收錢，在小本子上畫了一道。他說老闆每個星期六都對著這一頁嘟囔，每個星期一照樣叫他把麵包送來。
      frames: 一月裡，{staff}在一家畫框鋪裡待了一上午，替師傅按住斜角，等膠乾。靠墻的畫框有一半空著。師傅說自從七二年法國人打進來，人們買框子是為了裝鏡子，不是裝畫，鏡子至少不會讓人付兩回錢。
      peat: 二月中旬，{staff}幫一個賣泥炭的女人在集市廣場上碼濕泥炭塊。她朝手指哈氣，說今年冬天全代爾夫特都在燒便宜貨，整座城聞起來像一條趴在爐邊的濕狗。
  rembrandt_amsterdam:
    name: 兒子之後
    place: 阿姆斯特丹
    figure: 倫勃朗
    story: 1668 年 9 月 7 日，倫勃朗的兒子提圖斯在阿姆斯特丹下葬，離他成婚只有半年。1669 年 3 月，提圖斯的女兒蒂蒂婭出世。這一年，倫勃朗畫了幾幅署年 1669 的自畫像。他在 1669 年 10 月 4 日去世，四天後葬進一處租來的墓穴；他最後一幅畫沒有畫完。10 月 21 日，提圖斯的遺孀也下葬了。
    relic: 一支畫筆
    relic_desc: 一支磨舊的畫筆，筆毛裡的顏料已經乾了。
    points:
      p1: 在他最後幾周裡，幫倫勃朗把畫架上的《聖殿裡的西面》往下畫一段，別讓最後一幅畫停在他力氣斷掉的地方
    points_fail:
      p1: 《聖殿裡的西面》照史實沒畫完，留在他的畫室裡。
    shift:
      p1:
        was: 1669 年 10 月 4 日，倫勃朗在阿姆斯特丹去世。他最後一幅畫《聖殿裡的西面》在他去世時沒有畫完。
        now: '{staff}替他研好顏料、扶穩畫布，陪他過了最後幾周。十月之前，《聖殿裡的西面》在他自己手裡又往下走了一段。'
        who: rembrandt_amsterdam
        bio: 這條時間線裡，倫勃朗在 1669 年 9 月一直畫著最後那幅畫，把它畫得比歷史上更遠。它離開畫室時，更接近他想要的樣子。
    vignettes:
      colours: 9 月 22 日下午，{staff}在玫瑰運河邊一家顏料鋪的後屋裡推研磨石，磨一板鉛白，磨到兩條胳膊都酸了。顏料商說如今的畫家都要白得像奶油一樣滑，他真想賣他們一罐奶油，看看誰分得出來。
      barge: 9 月 26 日，{staff}幫一個船伕撐著一船泥炭沿玫瑰運河走。他說今年秋天水淺得很，每過一座橋船底都要刮一下，他已經開始跟橋下的石頭一塊塊打招呼了。
      watchman: 十一月中旬，{staff}陪守夜人冒雨走了一圈。他在每個街角搖一下木響板，報一聲時辰。他說這個月的雨連響板都淋進去了，搖起來像在咳嗽。
  gaudi_barcelona:
    name: 被電車撞倒
    place: 巴塞羅那
    figure: 安東尼·高迪
    story: 1926 年 6 月 7 日傍晚，七十三歲的安東尼·高迪在巴塞羅那的大道上被電車撞倒。他沒帶證件，衣著樸素，被當成乞丐，路人攔了幾輛出租車都不停。6 月 10 日，他在聖十字醫院去世，12 日安葬在聖家堂。多梅內克·蘇格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，圖紙和石膏模型大多毀掉。
    relic: 一個石膏模型
    relic_desc: 一個小小的懸掛式穹頂模型。
    points:
      p1: 高迪住院期間，把進行中的工程清單和工房鑰匙交給多梅內克·蘇格拉涅斯，讓施工在六月接著往下走
      p2: 請蘇格拉涅斯把關鍵石膏模型的照片、標尺和圖紙另存一處，在工房留一份簽收的清單
      p3: 6 月 7 日傍晚，大道上的電車撞倒一個沒人認得的老人時，立刻把高迪送進醫院，救下他
    points_fail:
      p1: 工房等著高迪回來核準，接手的同事拿不到進行中的工程清單。施工交接中斷，事務所因同步失敗召回員工。
      p2: 照片和圖紙仍收在工房同一排櫃裡。後來工房毀損時，對照材料隨石膏模型一起散失。
      p3: 他被當成乞丐躺在街上，幾輛出租車都不停，先到一處診所才轉進聖十字醫院，6 月 10 日在那裡去世。
    shift:
      p1:
        was: 高迪 1926 年 6 月遭遇電車事故，在醫院去世。他的合作者蘇格拉涅斯接掌聖家堂工程。
      p2:
        was: 1936 年工房毀損，原圖和石膏模型多有損失。工程團隊後來從殘件和已刊照片等材料重建。
        now: 十年後工房裡的櫃子燒毀，團隊從另一處取回照相冊和有簽收的圖紙。以前只能靠殘件拼的兩個模型面，現在有當年的尺寸可作對照。
      p3:
        was: 1926 年 6 月 7 日，高迪在大道上被電車撞倒，沒帶證件，衣著破舊，被當成乞丐；6 月 10 日他在聖十字醫院去世，年七十三歲。
        now: '{staff}一分鐘內跪到他身邊，說出他是誰，直接把他送到外科醫生手裡。高迪活了下來，又回聖家堂的工房幹了幾年。'
        who: gaudi_barcelona
        bio: 高迪挺過了 1926 年 6 月的電車事故。他回到聖家堂的工房，和蘇格拉涅斯一起又主持了幾年工程。
    vignettes:
      tram: 5 月 29 日，{staff}站在電車後平臺上，從大道這頭坐到那頭。售票員說這份差事最難的不是收錢，是那些邊看報邊過馬路的人。他每到一個路口就拉一下鈴，像在數落整條街。
      stone: 6 月 1 日，{staff}幫工地上兩個石匠把一塊雕好的石頭放到灰漿上。起風時，風從頭頂塔身的孔洞裡穿過去，吹出哨音。年輕的那個石匠發誓每天下午都是同一個音，他已經開始跟著哼了。
      water: 7 月 10 日，入夏最熱的一天，{staff}替中午來工地的賣水女人提水罐。她說石匠們不到收工鈴響就喝掉一整桶，喝完還嫌水裡有灰味。她說那是當然，灰就是從他們身上掉進去的。
  kafka_kierling:
    name: 療養院裡的校樣
    place: 基爾靈
    figure: 弗朗茨·卡夫卡
    story: 1924 年 3 月，結核侵入弗朗茨·卡夫卡的喉頭，他咽東西越來越難。4 月 19 日，他和朵拉·迪亞曼特來到克洛斯特新堡附近基爾靈的霍夫曼療養院；醫生讓他少說話，他多半靠紙條交談。5 月 6 日前後，醫學生羅伯特·克洛普施托克趕來幫著照料。6 月 2 日，他還在校故事集《饑餓藝術家》的校樣。6 月 3 日中午前後，他去世，四十歲，11 日葬於布拉格。這本收了四篇小說的書，8 月底在柏林出版。
    relic: 一頁校樣
    relic_desc: 一頁印刷校樣，上面有鉛筆改的小字。
    points:
      p1: 病中校稿一中斷就給他留下接續的位置，護住卡夫卡最後校過的故事集
      p2: 把跑腿與通信交接給輪換的幫手，給守在基爾靈的人留出一段歇息時間
      p3: 減輕他喉頭的痛，讓他在最後幾個星期還咽得下水和幾口軟食
      p4: 讓柏林出版人先裝訂一本寄到基爾靈，讓卡夫卡生前看到自己選定的四篇小說合在一起
    points_fail:
      p1: 校樣寄回柏林時缺了作者最後一輪批改，印本失去這次校訂。行程與史實脫節，員工被召回。
      p2: 照料者仍同時守病房、收信和跑腿，連等回信的空當都抽不開身。
      p3: 喉頭的痛照舊讓他吃不下東西，這條分支裡他最後幾個星期仍靠紙條說話，幾乎咽不下一口。
      p4: 作者來不及看到書，出版者在他去世後才把它交給讀者。
    shift:
      p1:
        was: 1924 年 5 月，卡夫卡在基爾靈養病時仍在校訂《饑餓藝術家》的校樣。
      p2:
        was: 1924 年 5 月，有朋友前往基爾靈協助照料已經病重的卡夫卡，分擔伴侶原先承擔的工作。
        now: '{staff}把送印、送信和陪伴所需的人手分時安排，幫手到時，原來守著的人可以出門走一會兒。'
      p3:
        was: 1924 年春，結核侵入卡夫卡的喉頭，吞嚥劇痛，吃不下也睡不好，醫生每隔八到十天給喉上神經注射一次止痛；6 月 3 日他在基爾靈去世。
        now: '{staff}幫醫生把止痛排在飯前，他在最後幾個星期還喝得下水、吃得下幾口軟食，比歷史上少受了些苦。'
      p4:
        was: 1924 年 6 月 3 日卡夫卡去世，同年 8 月《饑餓藝術家》故事集出版。
        now: '{staff}請柏林先把已經改完的印張裝成一本隨郵寄回。卡夫卡在基爾靈翻過它，認得出自己定的四篇和次序。'
        who: kafka_kierling
        bio: 卡夫卡生前看到一冊按最後校樣裝訂的故事集。正式出版時出版社保留了他選定的篇目和次序。
    vignettes:
      lilac: 5 月 13 日，{staff}幫療養院的園丁修剪籬笆邊的丁香。園丁說今年丁香晚開了一個星期，蜜蜂到現在還沒原諒它，天天飛到廚房窗口來抱怨。
      post: 5 月 23 日，{staff}跟療養院跑腿的男孩走下坡去克洛斯特新堡的郵局。男孩說他不用看就知道信從哪兒來：柏林來的又厚又硬，全是紙；布拉格來的薄，天天都有。
      rain: 六月中旬，{staff}被一場急雨堵在村裡麵包鋪的門洞下。麵包師的妻子看著街面變成一條河，說基爾靈的小溪只在她剛刷完門口臺階的時候才漫上來。
  poe_baltimore:
    name: 第四選區的一張求助條
    place: 巴爾的摩
    figure: 埃德加·愛倫·坡
    story: 1849 年 9 月 27 日，埃德加·愛倫·坡離開裡士滿，要回紐約福德姆的家，第二天到了巴爾的摩。此後一個星期他在哪裡，沒有可靠的記載。10 月 3 日是選舉日，有人在瑞安那處第四選區投票點發現他處境不妙，印刷工約瑟夫·沃克寫條子請約瑟夫·斯諾德格拉斯來。他被送進華盛頓學院醫院，不許探視，7 日天亮前在那裡去世，四十歲，死因至今不明。他的姨母兼岳母瑪麗亞·克萊姆是從報上讀到的。
    relic: 一根手杖
    relic_desc: 一根樸素的手杖，握柄已被磨舊。
    points:
      p1: 憑那張求助條盡快找到能接應的人，護住坡從投票點到醫院的那段路
      p2: 趁他還在病房裡，把消息送到瑪麗亞·克萊姆手上，別讓她從報上讀到
      p3: 在華盛頓學院醫院裡守著他熬過譫妄，救下坡
    points_fail:
      p1: 求助條遞進人群裡就斷了，沒有人及時把他送進醫院。分支與歷史脫了節，事務所因同步失敗召回員工。
      p2: 家裡繼續等他自己回來，瑪麗亞·克萊姆是從報上讀到噩耗的。
      p3: 他照史實在 10 月 7 日死在醫院裡，這條分支裡也沒能留住他。
    shift:
      p1:
        was: 1849 年 10 月 3 日，有人在巴爾的摩的一處投票點發現坡急需幫助，寫條求援後，他被送進華盛頓學院醫院。
      p2:
        was: 1849 年 10 月 9 日，瑪麗亞·克萊姆寫信給尼爾森·坡，說剛從報上得知他的死訊。
        now: '{staff}把院方知道的情況和回信地址寄給了她。她的回信在他還在病房時送到了。'
      p3:
        was: 1849 年 10 月 7 日，坡在巴爾的摩的華盛頓學院醫院去世，四十歲，死因至今不明。
        now: '{staff}守著他熬過了最難的幾夜，他挺了過來。十月底他出了院，往北回紐約的家。'
        who: poe_baltimore
        bio: 這條時間線裡，坡挺過了 1849 年 10 月在巴爾的摩醫院裡的那幾天。他回到紐約，又寫了、編了幾年。
    vignettes:
      wharf: 9 月 28 日，{staff}在碼頭上等裡士滿來的汽船靠岸。一個背著三隻箱子的腳夫說，諾福克的船運病人，裡士滿的船運詩人，哪一種給的小費更少，他說不準。
      ballot: 10 月 2 日，{staff}看幾個人在隆巴德街一家酒館門外釘木牌。酒館老闆說明天樓上每間屋都租給了選區，啤酒由候選人請；他早學會了數酒桶，不數投票的人。
      ward: 10 月 4 日夜裡，{staff}提一桶清水上到收醉漢的病區。守夜的雜役說，帶鐵欄那間屋裡的先生一口水也不肯碰；他把燈捻得很低，燈一亮，那人就對著墻說話。
  sor_juana_mexico_city:
    name: 送走的最後幾本書
    place: 墨西哥城
    figure: 胡安娜修女
    story: 1690 年，普埃布拉主教未經她同意，把她批評一篇佈道的文章刊印出來，題為《雅典娜信札》，附信署名“菲洛特亞修女”。她的《答菲洛特亞修女》署 1691 年 3 月 1 日。1693 年她賣掉了書和樂器，1694 年重申誓願。1695 年 4 月 17 日，她在照顧染疫的修女之後，死於聖傑羅姆修道院。
    relic: 一支羽毛筆
    relic_desc: 一支筆尖裂開的羽毛筆，旁邊是空書架。
