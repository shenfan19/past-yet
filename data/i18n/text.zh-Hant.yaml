      borscht: '{staff}在拉丁區一家小館子吃飯。鄰桌兩個波蘭學生用波蘭話爭得面紅耳赤，紅菜湯涼了也沒顧上喝。老闆娘說，這一帶的波蘭人比塞納河邊的鴿子還多。'
      bookstall: '{staff}在塞納河邊的舊書攤上，從一摞曬褪了色的舊雜誌底下翻到一本講那種能穿過皮肉的新射線的小冊子。攤主說，這年頭的人，看不見的東西最肯掏錢。'
  freud_vienna:
    name: 一本書的兩個年份
    place: 維也納
    figure: 西格蒙德·弗洛伊德
    story: 1899 年 11 月 4 日，西格蒙德·弗洛伊德的《夢的解析》在維也納面世，出版商在扉頁上印了 1900 年。弗洛伊德後來說，這本書是他對父親去世的回應。首印六百冊，賣了八年才賣完，第二版到 1909 年才出。
    story_prose:
      opening:
        - 1899 年秋，維也納。西格蒙德·弗洛伊德的《夢的解析》就要由多伊蒂克出版社印出，11 月 4 日面世，扉頁上印的卻是 1900 年。三年前的 10 月，他的父親雅各布在維也納去世；他後來說，這本書是他對父親之死的回應。
        - 史實裡，書出來以後少有人理會，首印六百冊賣了約八年才賣完，第二版到 1909 年才出。在這條分支裡，內城一家書店有個擦櫥窗的店員和一個管訂貨簿的小夥計，咖啡館裡有個看報的醫生。
        - 這一趟用得上幾種人：懂醫、在同行之間說得上話的人；跑報館、知道一本書該送到誰手裡的人；能言善道、敲得開別人家門的人。
      outcomes:
        p1: 那個冬天，弗洛伊德陸續收到幾封來信，信裡一頁一頁地問那本書。書店的訂貨簿上，那本講夢的書往下添了幾行。
      none: 十二月底下了雪，書店的小夥計翻著訂貨簿，那本講夢的書這個月幾乎沒動。櫥窗角上，扉頁還翻在印著 1900 年的那一面。
      not_admitted: '{staff}沒能進那幾位同行的門，只在內城那家書店的櫥窗前站了幾回。那本講夢的書擺在角上，扉頁翻開著，玻璃上落了一層薄灰。'
      points:
        p1:
          class_medical: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}以醫生的身份，揣著幾本書去了幾位同行的診所，每本都在講夢的那一章夾一張紙條，寫明從哪一頁讀起。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
          class_press: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}照跑報館的門路，打聽出哪幾位醫生肯給雜誌寫長評，把書包好，一家一家送上門。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
          else: 11 月下旬，那本講夢的新書在櫥窗角上躺了快三個禮拜。{staff}在咖啡館裡坐了幾個下午，跟看報的醫生們搭上話，把帶來的書一本本借了出去，只說讀完再還。那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
      excerpts:
        p1: 那天夜裡，內城一戶人家的窗子亮到很晚。桌上攤著那本扉頁印著 1900 年的書，已經翻過了一大半。
    relic: 一張註明日期的書店存根
    relic_desc: 維也納一家書店的送貨單，日期是 1899 年 11 月，單上那本書的扉頁印著 1900 年。
    points:
      p1: 在書面世後無人問津的那幾周，把《夢的解析》送到會認真讀完它的同行手裡
    points_fail:
      p1: 書出來以後少有人理會，首印六百冊要八年才賣完。
    shift:
      p1:
        was: 1899 年 11 月 4 日，《夢的解析》在維也納面世，首印六百冊，扉頁印 1900 年，八年才賣完。
        now: '{staff}把書送到幾位同行手裡，他們那個冬天就讀完了全書。關於它的來信和爭論早來了好幾年，首印也不用等八年。'
        who: freud_vienna
        bio: 弗洛伊德那本講夢的書在頭一年就有了認真的讀者。他等了多年的討論，1899 年冬天就開始了。
    vignettes:
      window: '{staff}在內城一家書店的櫥窗前站了半天。那本講夢的新書擺在角上，翻開著扉頁，印的是 1900 年。店員出來擦玻璃，說這書要到明年才算新書，眼下先佔個位子。'
      cafe: '{staff}在咖啡館從報架上取下幾份報紙，把書評欄翻了個遍，哪一份都沒提這本書。鄰桌的醫生說，三百多頁講夢的書，誰有工夫讀完，說完又叫了一杯咖啡，接著看他的報。'
      snow: 十二月底下了雪。{staff}幫書店的小夥計鏟門口的雪。夥計凍著手翻訂貨簿，說那本講夢的書這個月幾乎沒動，又問夢是不是夏天才好賣。
  cajal_barcelona:
    name: 神經細胞是一個個獨立的單位
    place: 巴塞羅那
    figure: 聖地亞哥·拉蒙-卡哈爾
    story: 1887 年底起，聖地亞哥·拉蒙-卡哈爾在巴塞羅那任組織學教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥幾十份大多寄給國外的研究者，可他們很少讀西班牙文。1889 年 10 月，他自費去柏林參加德國解剖學會的會議，把切片放在顯微鏡下給人看，會上資深的組織學家阿爾伯特·馮·克利克接過了他的研究。1906 年，他與卡米洛·高爾基分享諾貝爾獎。
    story_prose:
      opening:
        - 1889 年秋，巴塞羅那。聖地亞哥·拉蒙-卡哈爾在大學教組織學，用銀染的切片去看神經細胞的分支。前一年，他自掏腰包印出自己期刊的第一期，六十份上下，大多寄往國外。
        - 史實裡，國外的同行很少讀西班牙文，他的文章少有人注意。9 月 26 日他拿到出行許可，自籌旅費去柏林，10 月在德國解剖學會的會上把切片放到顯微鏡下，克利克從此支持他。在這條分支裡，實驗室裡有個學生守著一罐泡著組織的重鉻酸鉀，還跑去火車站問過去柏林的票價。
        - 這一趟用得上兩種人：理得清賬目和玻片、守得住行程的人，懂外文、找得到合譯者、說得動人幫忙的人。
      outcomes:
        all: 十月，柏林的會場裡，顯微鏡前排著隊。排在最前面的人，手裡拿著那幾頁譯稿。
        p2: 那以後，卡哈爾寄往國外的信封裡，總夾著一份譯好的圖說。
        p1: 十月，柏林的會場裡，卡哈爾把切片推到顯微鏡下，退開一步，請人來看。
      none: 巴塞羅那的實驗室裡，那幾包玻片還碼在木匣裡，沒有離開桌子。
      desync: 旅費到月底還差一截，玻片也沒裝好。{staff}被召回時，卡哈爾正把一份文字稿裝進信封，準備寄往柏林。
      not_admitted: '{staff}沒能進那間實驗室。玻片還攤在桌上，去柏林的日子一天天近了。'
      points:
        p1: 9 月 26 日，出行許可批了下來，旅費得自己出。{staff}把能動用的錢一筆筆列在紙上，又把要帶的玻片按編號分成幾包，每包裹上軟紙，裝進帶隔層的木匣。賬算平了，木匣的鎖也扣上了。卡哈爾把木匣放在膝上，一路抱著上了去柏林的車。
        p2:
          class_lettered: '{staff}照譯稿的規矩，同卡哈爾一張圖一張圖地對，把圖下的說明譯成德文，哪一根纖維該叫什麼，逐處問清了才落筆。短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。'
          else: '{staff}在城裡找到一位懂德文的譯者，勸他放下手頭的活，陪卡哈爾一張圖一張圖地對，把圖下的說明譯成德文。短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。'
      excerpts:
        p2: 短文謄好，先寄給了幾位肯拿切片複核的同行。到了柏林，有人已經拿著那幾頁紙，在顯微鏡前等他。
        p1: 賬算平了，木匣的鎖也扣上了。卡哈爾把木匣放在膝上，一路抱著上了去柏林的車。
    relic: 一支極細的繪圖筆
    relic_desc: 細到能畫出神經元每一條分支的筆。
    points:
      p1: 在公費未獲准時幫卡哈爾把旅費與玻片分包湊齊，保住柏林會上那次親手演示
      p2: 為難以進入外語期刊的圖文找一位合譯者，讓同業在會前就能按圖復核
    points_fail:
      p1: 自費湊不齊長途行程，卡哈爾只能把文字寄過去。柏林沒有那次演示，員工因同步失敗被召回。
      p2: 外地同行會後才有人設法讀懂西班牙文稿，復核仍得逐封通信。
    shift:
      p1:
        was: 1889 年 9 月 26 日，卡哈爾獲得出行許可，自籌旅費並在 10 月柏林會議上展示顯微切片。
      p2:
        was: 1889 年，卡哈爾自述先前的西班牙文研究在國外少受注意，柏林演示後來幫助傳播他的結果。
        now: '{staff}讓譯者同卡哈爾對照原圖校過短文，先寄給願意核對切片的同行。演示之後，卡哈爾有一條持續寄發圖文的渠道。'
        who: cajal_barcelona
        bio: 卡哈爾在巴塞羅那為研究圖文建立了穩定的外語協作。後來的手稿可以先在國外找到願意拿切片復核的同行。
    vignettes:
      stain: '{staff}幫一個學生把切好的小塊組織泡進重鉻酸鉀的罐子裡。學生說這罐要原封不動泡到下禮拜，誰要是忍不住打開看，下一百張切片就歸誰切。'
      ticket: '{staff}陪學生去火車站問去柏林的車票。售票員報了價，學生吹了聲口哨，回來的路上一直掰著指頭算，這筆錢夠印幾期刊物。'
      rain: 十一月，巴塞羅那下起雨。{staff}幫學生把窗臺上晾著的一疊圖版收進屋，學生點了兩遍數，才肯把百葉窗關上。
  hammurabi_babylon:
    name: 刻在石頭上的法律
    place: 巴比倫
    figure: 漢謨拉比
    story: 約前 1754 年，漢謨拉比在位的晚年，一塊刻著近三百條法律的玄武巖石碑立了起來，此後幾百年，書吏一直把這些條文抄在泥板上傳習。前十二世紀，石碑被運到蘇薩，碑上有幾欄文字被磨去。1901 年，法國考古隊在蘇薩把它挖了出來，如今藏在盧浮宮，被磨掉的條文靠泥板抄本補回了一部分。
    story_prose:
      opening:
        - 約前 1754 年，巴比倫。漢謨拉比在位的晚年，一塊玄武岩石碑刻上了序言、約二百八十二條講財產、交易、家庭與勞作的法律和一段結語。結語裡說，受了冤屈的人可以來到碑前，請人把碑上的話唸給他聽。書吏把這些條文抄在泥板上，一代一代傳習。
        - 史實裡，前十二世紀，埃蘭王舒特魯克-納洪特把石碑運到蘇薩，碑面下部有幾欄後來被磨平；缺掉的條文靠泥板抄本補回了約三十條，其餘至今不知道寫的是什麼。在這條分支裡，書吏屋裡有個和泥、曬泥板的學徒，幼發拉底河邊有個不識字的船伕。
        - 這一趟用得上幾種人：做慣了案頭活、校得出漏行的人；手穩、會削蘆管壓字的匠人；一絲不苟、一欄一欄對得下去的人，或是帶著能把碑面細節看清的眼鏡的人。
      outcomes:
        p1: 三千多年後，那片磨平的石面旁邊擺上了一塊別的城裡傳下來的泥板。有人順著楔形的刻痕一行一行往下唸，唸到了石頭上已經沒有的那幾條。
      none: 泥板照舊在屋頂上曬著，學徒照舊挨塊數。幾百年後石碑被運走，碑面下部那幾欄磨成了平的，什麼也摸不出來。
      not_admitted: '{staff}沒能進書吏的屋子，只在幼發拉底河邊幫船伕卸了幾袋大麥。船伕數著袋子，又說起王的石碑，碑上的字他一個也不認得。'
      points:
        p1:
          class_lettered: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}做慣了案頭的活，抄完一塊，就對著底本從頭點一遍行數，漏了一行的那塊，趁泥還軟抹平了重寫。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
          class_craft: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}手穩，把幾根蘆管削出斜口，一根一根在廢泥上試過壓痕，挑出最利的遞給書吏，自己也照著底本壓滿了一整塊。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
          else: 屋裡擺開了十幾塊新和好的泥板，書吏要把碑上的全文再抄幾份，送到別的城裡去存。{staff}一欄一欄對著底本數下去，把每塊泥板從哪一條抄到哪一條刻在一片陶片上，幾份抄本拼起來，一條也不缺。書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
      excerpts:
        p1: 書吏把泥印滾筒在最後一塊泥板的邊上滾了一道，留下一串細小的人像和字。學徒把泥板一塊塊碼進墊了乾草的筐，紮緊筐口，和船伕一起抬上了河邊的船。
    relic: 一枚泥印滾筒
    relic_desc: 一個小石柱，在泥上一滾就留下簽名。
    points:
      p1: 幫書吏把石碑全文多抄幾塊泥板，送到別的城裡存放，後世石上被磨掉的那幾欄也能讀全
    points_fail:
      p1: 全文照舊只有原來那些抄本，這條分支裡石碑被搬到蘇薩、磨去幾欄以後，還是有幾條法律再也讀不到。
    shift:
      p1:
        was: 公元前十二世紀，石碑被埃蘭人搬到蘇薩，碑文被磨去幾欄；靠泥板抄本補回了約三十條，其餘至今不知道寫的是什麼。
        now: '{staff}幫書吏多抄了幾份全文，送到別的城裡存放，這條時間線裡石碑上的每一條法律都還讀得到。'
        who: hammurabi_babylon
        bio: IF 線裡，漢謨拉比的法律一條不缺地傳了下來，石上磨掉的部分也沒有失去。
    vignettes:
      clay: '{staff}幫書吏學徒和泥。學徒說泥裡的沙得淘乾淨，不然寫到一半，蘆管一按就裂，師傅又要他從第一行重抄。'
      river: '{staff}在幼發拉底河邊幫船伕卸大麥。船伕一邊數袋子一邊說，過秤的要是敢少算一袋，他就站到王的石碑跟前把那一條念給他聽，雖然碑上的字他一個也不認得。'
      roof: 日頭最毒的時候，{staff}和學徒把新抄的泥板擺到屋頂上曬。學徒挨塊數，數到一半亂了，又從頭數，生怕有一塊被鳥踩過。
  lalibela_rock:
    name: 沿巖溝找出口
    place: 埃塞俄比亞拉利貝拉
    figure: 拉利貝拉與石匠們
    story: 拉利貝拉的石匠向下開鑿，把周圍的石料清出去，牆和柱便從整片岩石中留了下來。如今遺址保存著十一座巖鑿建築，以及相通的深槽、水溝和通道。傳統把這處建築群與扎格韋王朝的拉利貝拉國王相聯繫；考古人員發現，岩石曾分期開鑿，有些地方原來還立著更早的建築。1520 年代，弗朗西斯科·阿爾瓦雷斯隨葡萄牙使團到訪，寫下了他的見聞。
    relic: 石匠的鑿子
    relic_desc: 一把鐵鑿子，刃口磨得很薄。
    points:
      p1: 先讓石匠們認下，再替他們把鑿下的碎石運出深槽
      p2: 雨季前，沿巖溝找到出口，指給他們看哪裡會積水
      p3: 雨季裡，幫著把一整條溝渠從頭清到尾
    vignettes:
      outlet: '{staff}順著一條鑿在巖上的溝往下走，過了彎，找到它出巖壁的地方，用一塊碎石做了記號。'
      rain: '{staff}站在沒過腳踝的水裡，把一筐筐淤泥遞上槽沿，一筐接一筐，直到天黑。'
      bend: '{staff}在一片碎紙上畫了個缺口，標出深槽的轉彎處，幫工第二天早上照著就能找到同一個彎。'
  ife_bronzes:
    name: 鑄好以後還能不能認出這道線
    place: 尼日利亞伊費
    figure: 伊費的鑄造匠人
    story: 約魯巴城市伊費出土的一尊黃銅頭像，珠飾頭冠上還留著紅色和黑色的顏料。這尊頭像用失蠟法鑄成。1938 年 1 月，翁莫尼傑院落裡開挖房屋地基，人們從土裡挖出它和一批其他頭像。1948 年，多件伊費鑄像在大英博物館一同展出。
    relic: 一對線樣小圖
    relic_desc: 對照無像練習鑄樣上兩次所見的線。
    points:
      p1: 先讓鑄匠們認下，再用蠟捏一個練習模
      p2: 澆鑄那天，守著坩堝底下的火不讓它弱下去
      p3: 澆鑄之後，分辨哪道線是蠟模上刻的，哪道是後來添的
    vignettes:
      line: '{staff}把收面之前畫的小圖擺到今天的樣塊旁邊，後來多出的那一道劃痕，另畫在一張紙上。'
      surface: '{staff}把墊樣塊的木板略斜一斜，讓光順著它走，在紙上標出一道細線從哪裡開始。'
      edge: '{staff}描了一遍沒有圖像的練習樣塊，旁邊另記下今天才看見的那一道線，下回比對就不用全靠記性。'
  great_zimbabwe:
    name: 圖上兩牆之間的路
    place: 津巴布韋馬斯溫戈
    figure: 大津巴布韋的建造者
    story: 大津巴布韋由紹納人的祖先建造，興盛於十一世紀到十五世紀。大圍場的弧形長墻用花崗巖逐層整齊壘起，兩墻之間有一條狹道通向錐形塔。1871 年，德國人卡爾·毛赫來到這片遺址。1980 年，國家以這座城為名，定名津巴布韋；1986 年，遺址列入世界遺產。
    relic: 一張兩牆間的草圖
    relic_desc: 圖上兩段墻之間留白，標的是能走的狹道。
    points:
      p1: 先讓砌墻的工匠認下，再替他們挑出大小合用的石塊
      p2: 走一遍兩墻之間的狹道，畫成圖，把路留成白
      p3: 旱季裡，從河谷把水挑上山，給砌墻的人
    vignettes:
      lines: '{staff}把狹道畫成兩條線，中間留白，送信的人照著白處走，就不會去順著墻走。'
      width: '{staff}沿內墻走到它停下的地方，鉛筆也停在那裡，沒有把線順手繞滿一圈。'
      pace: '{staff}用步子量了一層石的長度，把數目刻在墻腳一塊平石上。'
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯內沙布爾
    figure: 歐瑪爾·海亞姆
    story: 1070 年代，蘇丹馬立克沙在伊斯法罕建起天文臺，歐瑪爾·海亞姆是參與修訂歷法的天文學家之一。以蘇丹命名的賈拉利歷於 1079 年 3 月 15 日啟用，以春分定太陽年的開端。蘇丹 1092 年去世後天文臺關閉，這部歷法卻用了約八個世紀，它的變體今天仍在伊朗和阿富汗使用。
    relic: 一張有兩種題頭的歷表
    relic_desc: 一張對照表，新舊兩種新年並排寫著。
    points:
      p1: 春分前那幾天，護住觀測臺上定春分的日影讀數，讓新曆照定的日子啟用
      p2: 幫他把那部講開方的書多抄一份，送到別的城裡收好，讓它在這條分支裡留下來
    points_fail:
      p1: 春分的讀數沒能對齊，新曆沒能在 3 月 15 日啟用。
      p2: 這部書照舊失傳，這條分支與歷史一樣。
    shift:
      p1:
        was: 1079 年 3 月 15 日，蘇丹馬立克沙的新曆照定的日子啟用，一年從春分開始。
      p2:
        was: 海亞姆那部論開方的書沒有傳下來，只在他的《代數》裡留下一句提及。
        now: 有一份抄本被送到別的城裡收進了書庫，幾百年後還有人讀得到。
        who: omar_khayyam_nishapur
        bio: 這條時間線裡，他那部講開方的書沒有隨著歲月散失。存在別城的那份抄本，在他身後仍有人讀、有人轉抄。
    vignettes:
      spring: '{staff}把舊曆表和新曆表並排擺好，在每個日期旁寫明屬於哪種紀法，下一個讀表的人不用再猜。'
      carry: 一張折起來的紙，兩欄標題正好分在摺痕兩邊。{staff}把兩種題頭抄到外面，帶著它的人不用打開也知道該比哪兩欄。
      future: '{staff}知道後人會怎樣寫這部歷法，可落下的日子還是用抄歷書的人用慣的紀法，不寫他們從沒見過的那一種。'
  ibn_battuta_tangier:
    name: 長途還只有第一站
    place: 摩洛哥丹吉爾
    figure: 伊本·白圖泰
    story: 1325 年六月，伊本·白圖泰離開故鄉丹吉爾。他在《遊記》裡回憶，父母都還在家，而他出門時沒有旅伴，也沒有商隊可以跟隨。他回到摩洛哥後，把前後近三十年的行旅見聞口述給伊本·朱扎伊。
    story_prose:
      opening:
        - 1325 年六月，摩洛哥丹吉爾。二十出頭的伊本·白圖泰要出一趟遠門，父母都還在家。近三十年後他才回到家鄉，把一路見聞口述給伊本·朱扎伊，編成了《遊記》。
        - 史實裡，他是一個人出的城門，沒有旅伴，也沒有商隊可以跟。到了米利亞納，他追上的突尼斯蘇丹的兩位使節都在暑熱裡病倒，其中一位在城外溪邊停了三夜後去世；過了貝賈亞，他又發起高燒，拿纏頭布把自己綁在鞍上；進突尼斯那天，迎出城來的人裡沒有一個認得他，他忍不住哭了。在這條分支裡，泉邊有個替人灌滿水囊的鄰家婦人，城邊有個只認得頭一段路的挑夫。
        - 這一趟用得上幾種人：懂醫護、帶夠了補液和水的人；身子骨極結實，或帶著止痛藥、咬得住牙的人，熬得過一路暑熱和顛簸；心腸熱、肯在陌生城門口走上前去的人。
      outcomes:
        all: 那年秋天，突尼斯蘇丹的兩位使節都回到了城裡。伊本·白圖泰在突尼斯住了兩個月，進城那天陪著他的人，那些日子常來他住的地方坐一坐。後來他跟著一支更大的商隊，又往東去了。
        p2: 那年秋天，兩位使節一前一後回到了突尼斯。病過一場的那位走在後面，鞍邊掛著那隻在溪邊用過的水碗。
        p3: 他在突尼斯住了兩個月。進城那天陪著他的人，那些日子常來他住的地方坐一坐，兩人說的多半是路上的事。
        p1: 他一路沒有下鞍，撐到了突尼斯。那條纏頭布後來又纏回了他的頭上，跟著他往東走了很遠。
      none: 七月，米利亞納城外的溪邊停了三夜，一位使節沒有再起來。九月，突尼斯城門口，迎出來的人叫著別人的名字，他攥著韁繩站在人群邊上，哭出了聲。
      desync: 八月，過了君士坦丁，那個結鬆開了。{staff}被召回時，商隊停在路當中，那條纏頭布一頭還繫在空鞍上，垂到了地上。
      not_admitted: '{staff}沒能在丹吉爾落下腳，只在泉邊幫那位鄰家婦人提了幾趟水。六月十四日一早，一個年輕人牽著牲口出了城門，身邊沒有旅伴，後面也沒有商隊。'
      points:
        p2:
          class_medical: 七月，米利亞納城外，離城四英里的一條溪邊。兩位使節都在暑熱裡病倒了，隊伍已經在溪邊停了三夜，病得重的那位躺著，叫他也只睜一睜眼。{staff}照醫護的法子，把兩包補液鹽兌進保溫壺裡的涼開水，扶起他的頭一口一口餵，又把浸濕的布搭在他的額頭和頸後，隔一陣換一回。第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
          else: 七月，米利亞納城外，離城四英里的一條溪邊。兩位使節都在暑熱裡病倒了，隊伍已經在溪邊停了三夜，病得重的那位躺著，叫他也只睜一睜眼。{staff}打開隨身帶的藥箱，給他退了燒，守在他身邊，等他一口一口把水嚥下去，一夜沒有合眼。第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
        p1:
          class_medical: 八月，過了君士坦丁，伊本·白圖泰又發起燒來。在貝賈亞時就有朋友勸他留下養病，他沒有留。這回他拿纏頭布把自己綁在鞍上，怕燒得沒了力氣栽下去。{staff}照醫護的規矩，每到歇腳就摸他的額頭和手腕，把濕布換了又換，看著他把水嚥下去，又替他把布結重新勒緊。夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
          else: 八月，過了君士坦丁，伊本·白圖泰又發起燒來。在貝賈亞時就有朋友勸他留下養病，他沒有留。這回他拿纏頭布把自己綁在鞍上，怕燒得沒了力氣栽下去。{staff}一路走在他的牲口旁邊，一手牽著韁繩，他身子一歪，就伸手把他托回鞍上，曬了一整天也沒換過手。夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
        p3: 九月，商隊到了突尼斯。城裡的人迎出來，叫著同行商人的名字，一個個拉住手問候。沒有人認得伊本·白圖泰，他站在人群邊上，手裡還攥著韁繩。{staff}一路上和他說過不少話，這時走到他身邊，喊了他的名字，問他今晚住在哪裡。他用袖口抹了一把臉，把攥了一路的韁繩換到另一隻手上。兩個人一前一後，從迎人的人群旁邊走進了城門。
      excerpts:
        p2: 第四天早上，他自己撐著坐了起來，兩手捧著水碗喝乾了，把碗遞還回來。隊伍收拾上路，溪水還在石頭縫裡響。
        p3: 他用袖口抹了一把臉，把攥了一路的韁繩換到另一隻手上。兩個人一前一後，從迎人的人群旁邊走進了城門。
        p1: 夜裡隊伍歇下，他還坐在鞍上，人伏在牲口的脖子上。水囊遞到嘴邊，他喝了兩口，又伸手把那個結摸了一遍。
    relic: 一隻走舊的涼鞋
    relic_desc: 一隻補過很多次底的皮涼鞋。
    points:
      p1: 從貝賈亞往突尼斯那一路，護住他帶著高燒撐在鞍上，走到突尼斯
      p2: 在米利亞納救下那位病倒在暑熱裡的突尼斯使節
      p3: 進突尼斯那天，讓他知道他在異鄉不是一個人
    points_fail:
      p1: 燒到一半他從鞍上栽了下來，這條分支裡他沒有走到突尼斯。
      p2: 那位使節照史實死在米利亞納外的溪邊，這條分支裡往突尼斯去的只剩一位使節。
      p3: 他照史實在城門口哭出聲來，這條分支裡那天陪他進城的只有那位同行的旅伴。
    shift:
      p1:
        was: 1325 年夏天，伊本·白圖泰發著高燒從貝賈亞上路，一路撐到了突尼斯。
      p2:
        was: 1325 年夏天，突尼斯蘇丹的兩位使節在米利亞納都因暑熱病倒，其中一位在城外的溪邊停了三夜後去世。
        now: '{staff}在溪邊守著他降了溫、喝下了水，離開米利亞納時兩位使節都在隊伍裡。他後來回到了突尼斯，此後的事沒有記載。'
      p3:
        was: 1325 年，進突尼斯那天沒有人上前問候他，他忍不住哭了出來。
        now: 進城那天他身邊多了一個一路認識的人，在突尼斯住下的兩個月裡他不再是一個人。
    vignettes:
      distance: '{staff}把最遠的目的地寫在一張紙條上，今晚落腳的地方另寫一張，挑夫今天用得上第二張。挑夫把它折了兩折，塞進腰帶裡。'
      departure: '{staff}留著行李單上的題頭，底下空出一行，給旅人真正落腳的地方，墨還沒乾，就拿在風裡晃了晃。'
      roll: '{staff}把目的和第一程各寫一條，卷在一起，到了城邊，把挑夫當天用得上的那張遞過去，自己留下另一張。'
  murasaki_kyoto:
    name: 世界上第一部偉大的長篇小說
    place: 京都
    figure: 紫式部
    story: 1008 年秋，中宮彰子生下皇子，侍奉她的紫式部在日記裡記下了此後的幾個星期。皇子誕生第五十日的宴席上，有位公卿借《源氏物語》裡的"若紫"向女官們搭話，這是這部物語見於記載的最早日子。十一月裡，女官們挑紙、謄寫、裝訂《源氏物語》，好讓彰子帶回宮中；道長又從紫式部房裡取走了她留著的稿本。她親筆的定本沒有傳下來。
    relic: 一隻漆制筆盒
    relic_desc: 一隻小盒子，裡面有筆、硯和水。
    points:
      p1: 按章分配抄紙，逐冊驗收給彰子的《源氏物語》抄本，護住這次成冊
      p2: 給想先讀的人準備一份她願意借出的抄本，並把未定稿留在本人處，讓新抄人只按簽認本領書
    points_fail:
      p1: 抄完的章和待核章混裝，成套的書一直缺一冊，事務所因同步失敗召回員工。
      p2: 借去的仍是那份未定稿。後來的抄手不知道作者曾想再改。
    shift:
      p1:
        was: 紫式部的日記記有彰子身邊的人分紙抄寫《源氏物語》，道長為此提供紙筆。
      p2:
        was: 後世留存的是經長期傳抄下來的不同抄本，紫式部手定稿沒有傳到今天。
        now: 早期幾名讀者看到的是她核過的一套。以後各處傳抄仍會有變化，但這份借本記下了曾由她核過的章節。
        who: murasaki_kyoto
        bio: 紫式部在平安宮廷寫作。別人如何領紙、分抄和借閱，決定了一部未完全改定的作品怎樣進入宮外讀者手中。
    vignettes:
      banquet: 五十日宴的前一天，{staff}幫著沿迴廊搬膳臺。一個女官壓低聲音說，明晚男賓喝多了，最愛拿物語裡的名字逗女官，聽見了也只當沒聽見。
      paper: '{staff}幫一個女官把各色的紙按章分好，每摞壓上鎮紙。她說抄好的每一頁都得先送去核，字寫歪了就整頁重抄，紙還得重新去領。'
      snow: 臘月裡下了雪。{staff}正在廊下掃雪，屋裡念物語的聲音唸到一半停了，有人問，下一冊誰拿走了。
  sejong_hangul:
    name: 人人都學得會的字母
    place: 首爾
    figure: 世宗大王與學者們
    story: 1443 年，朝鮮世宗親制二十八個字母，用來書寫朝鮮語。1444 年二月，集賢殿的崔萬理與六位同僚聯名上疏，提出異議。1446 年，新字以《訓民正音》之名頒布，意為教百姓的正確字音。世宗於 1450 年去世。
    story_prose:
      opening:
        - 1443 年，漢城。世宗做了二十八個新字母。朝鮮語可以說出口，可想把嘴裡的話寫下來，得先學一套和自己說話很不一樣的文字。世宗想讓一張紙也能用來寫家常話。
        - 史實裡，1444 年二月，集賢殿有人聯名上疏反對新字，宮裡用新字譯書的事正做到一半。那年春天，世宗為眼疾去椒水養病，此後身體每況愈下。在這條分支裡，椒水行宮外還有個攤主，賬算得清，簽名卻總要把筆交給別人。
        - 這一趟用得上三種人：守得住文稿的人，肯一筆一筆教人認字的人，懂醫藥、帶對了藥的人。
      outcomes:
        all: 那年夏天，世宗回宮時還看得清字。攤主簽了名的那張紙，他沒讓人收走，壓在新字校樣的最上面。
        p2: 椒水行宮外，那本賬的末尾，第一次是攤主自己的筆跡。
        p3: 那年夏天回宮，世宗還能自己看奏章。新字的校樣，他一頁一頁翻到了最後。
        p1: 集賢殿的燈又亮了。用新字譯出的《韻會》，一頁壓著一頁往上摞。
      none: 回到事務所後，{staff}還記得攤主遞筆時的那一下：手伸出去，在半空停了停，才把筆交給旁人。
      desync: 上疏之後，新字的稿頁散在議事廳的地上，沒有人去撿。{staff}被召回時，最上面那一頁印著半個鞋印。
      not_admitted: '{staff}沒能留到把新字教給攤主的時候。她又翻過一頁賬，紙上仍等著別人替她簽名。'
