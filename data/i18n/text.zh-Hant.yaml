    relic: 一副夾鼻眼鏡
    relic_desc: 一副系著細繩的小圓眼鏡。
    points:
      p1: 契訶夫剛安頓下來時，把他寫給妹妹瑪麗婭的回信地址逐字核對，趁他還有力氣寫完，把信交出去
      p2: 用他 7 月 11 日列在信裡的問題請熟悉航線的人發一封短電報，讓他在巴登魏勒得到想問的返程消息
      p3: 治好他的肺結核，讓他和奧爾加一起動身回俄國
    points_fail:
      p1: 行李還按上一處旅館收放，寫字桌上的信封被一併帶走。瑪麗婭沒有收到他從別墅寄出的地址，事務所因同步失敗召回員工。
      p2: 他關於船期、艙位和航行天數的問題隨普通信寄出。等回信的日子裡，手邊仍沒有一份可以讀的答復。
      p3: 7 月 15 日凌晨，契訶夫在巴登魏勒去世，年僅四十四歲。
    shift:
      p1:
        was: 1904 年 6 月 25 日（俄歷 6 月 12 日），契訶夫從巴登魏勒寫信給瑪麗婭，寫明弗里德里克別墅的詳細回信地址。
      p2:
        was: 1904 年 7 月 11 日，契訶夫寫信給羅索利莫詢問由馬賽乘船去敖德薩的細節。他於 7 月 15 日在巴登魏勒去世，未能作這趟旅行。
        now: 負責航線的人回電報來，把開船日、路程和兩人可用的艙位寫得清楚。契訶夫和妻子在旅館把這張紙讀完，也商量了若能動身最想選哪一班。
      p3:
        was: 1904 年 7 月 15 日，契訶夫在巴登魏勒因肺結核去世，終年四十四歲。
        now: 他的肺病好了，夏天過後和奧爾加坐船回到俄國。此後他又寫了好些年，也回到莫斯科藝術劇院看排練。
        who: chekhov_badenweiler
        bio: 契訶夫在巴登魏勒治好了肺結核，1904 年秋天回到俄國，此後繼續寫小說和戲劇多年。
    vignettes:
      garden: 6 月 27 日，{staff}幫弗里德里克別墅的女傭把一張躺椅跟著太陽在花園裡挪位置。她說這裡的太陽七點整離開草坪，這家人開晚飯看的是太陽，不是門廳裡那座鐘。
      post: 7 月 7 日，{staff}坐在索默旅館隔壁郵局門口的長凳上。郵差說，夏天巴登魏勒寫信最多的是俄國人，寫得最短的是英國人；俄國人的信封他掂一掂，就知道夠不夠郵票。
      ice: 7 月 10 日熱得最兇，{staff}幫索默旅館的門房用麻袋從地窖往樓上扛一塊冰。門房說黑森林二十年沒見過這樣的七月，米爾海姆來的賣冰人都開始按樓梯級數算錢了。
  sophie_germain_paris:
    name: 寄往柏林的論文
    place: 巴黎
    figure: 索菲·熱爾曼
    story: 索菲·熱爾曼與卡爾·弗里德里希·高斯通信討論數論，起初署名勒布朗。1816 年，她憑彈性薄板振動研究獲得法蘭西科學院的獎。1829 年患病後，她仍繼續工作。柏林克雷勒主編的雜誌第七卷以她的本名刊出了她論曲面曲率的論文。1831 年 6 月 27 日，她在巴黎去世。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借來的名字寫給高斯的信。
    points:
      p1: 在她病中護住那篇論曲面曲率的論文，讓它寄到柏林克雷勒的雜志
      p2: 減輕她最後幾個月在巴黎的癌痛
      p3: 讓熱爾曼生前知道，高斯在為她向哥廷根大學爭取名譽博士學位
    points_fail:
      p1: 論文沒寫完，留在她的書桌上，1831 年那一卷裡沒有它。這條分支與歷史脫節，員工被送回。
      p2: 沒人替她壓住疼痛，這條分支裡她最後幾個月和歷史上一樣難熬。
      p3: 消息沒送到她手裡，她到去世都不知道高斯為她做了什麼。
    shift:
      p1:
        was: 1831 年，熱爾曼論曲面曲率的論文刊於克雷勒雜志第七卷，同年她去世。
      p2:
        was: 約 1829 年起熱爾曼患乳腺癌，仍堅持工作，1831 年 6 月 27 日在巴黎去世。
        now: '{staff}用現代的藥壓住疼痛，在最難熬的時候陪著她。她最後幾個月少受了些苦，還能坐到書桌前。'
      p3:
        was: 高斯曾推動哥廷根大學授予熱爾曼名譽博士學位，1831 年 6 月 27 日她去世時，學位尚未授出。
        now: '{staff}把高斯所做的事帶給她。熱爾曼得知，那所她從沒能進去讀書的大學要給她這份榮譽。'
        who: sophie_germain_paris
        bio: 這條時間線裡，熱爾曼生前得知高斯推薦她獲得哥廷根的名譽博士學位。學位本身仍然來得太遲。
    vignettes:
      water: 3 月 7 日，{staff}幫送水的人把兩桶塞納河水扛上薩伏依街一座樓的五層。送水人一邊數臺階一邊喘，說巴黎的樓一年比一年高，他的工錢還是按桶算，不按層算。
      quai: 四月中旬，{staff}在河岸的舊書攤前翻一本舊曆書。攤主說這一摞是從同一戶人家收來的，頁邊記滿了算式，他看不懂，只好論分量賣。
      wash: 五月下旬，{staff}在河邊的洗衣船上幫洗衣婦擰床單。她說今年春天塞納河漲了又退，船跟著一高一低，她的腰也跟著一高一低。
  wallace_ternate:
