    relic: 一副元素卡片
    relic_desc: 手寫的卡片，可以像擺紙牌一樣擺。
    points:
      p1: 門捷列夫已經離城。把他留給緬舒特金的論文和附表合在一起交到會場，趕上俄國化學學會宣讀
      p2: 趁作者從外地回來，把下次會議原留待討論的一項重新排進議程，讓他逐一回應來問排表依據的人
      p3: 德文摘要付印前，請門捷列夫確認第一條結論的譯法，把表示性質週期性重現的詞改回去
    points_fail:
      p1: 報告人只接到附表，原稿還壓在門捷列夫的行李裡。學會劃掉這一項，事務所因同步失敗召回員工。
      p2: 上一回記錄的待議事項留在舊頁上。到下次會議，沒有人再為元素表留一段可討論的時間。
      p3: 德文稿已送去排字。讀者看到性質逐級改變的說法，看不出作者強調性質隔一段會重現。
    shift:
      p1:
        was: 1869 年 3 月 18 日（俄歷 3 月 6 日），論文由緬舒特金代為宣讀。門捷列夫不在場，一說去特維爾省考察奶酪作坊，一說生病。
      p2:
        was: 會議記錄因作者缺席而延後討論，後來學會會議沒有接續討論這件事。
        now: 學會在下一次會上給門捷列夫留出回話的時間。他把幾處爭議欄圈出來，和提出疑問的人約定後續核查。
      p3:
        was: 1869 年的德文摘要將原文的週期性譯成表示逐步變化的詞。
        now: 發出的德文摘要寫明性質會週期性重現。一位只讀到摘要的通信者問起怎樣區分重現和例外，門捷列夫用自己的表逐項回覆。
        who: mendeleev_petersburg
        bio: 門捷列夫在聖彼得堡寫成早期元素表，經學會會議、散印表和期刊讓其他化學家見到它。俄文原稿的關鍵概念在跨語言傳遞時曾被改變。
    vignettes:
      flyers: '{staff}在印刷所幫忙，把剛印出的表一張張晾在繩上。排字工嘀咕，他排了半輩子版，沒見過這麼多空格和問號的，問是不是那位先生忘了填。'
      neva: 涅瓦河的冰化了，碎冰塊還貼著岸往下漂。{staff}擠在河岸上看一條小船從要塞划向宮殿，旁邊的人說，那條船沒過河之前，誰也不許下水。
      samovar: '{staff}在客棧裡學著從茶炊裡接茶。掌櫃說外國人總把龍頭擰反，燙了靴子，一邊說一邊盯著{staff}的腳。'
  curie_paris:
    name: 兩種新元素
    place: 巴黎
    figure: 瑪麗·居里
    story: 1898 年 4 月，瑪麗·居里報告說，瀝青鈾礦放出的射線比其中的鈾能解釋的更強。她與皮埃爾·居里在巴黎的工業物理化學學校把礦石一份份分開，追著射線走。1898 年 7 月 18 日，他們宣佈發現一種新元素，以她的祖國波蘭命名為釙；12 月 26 日，又與古斯塔夫·貝蒙一起宣佈了鐳。此後多年，他們一直徒手處理這些材料。瑪麗·居里 1934 年死於再生障礙性貧血，一般認為與她長年受輻射有關。
    story_prose:
      opening:
        - 1898 年夏，巴黎。瑪麗·居里和皮埃爾·居里在工業物理化學學校，把瀝青鈾礦一份一份分開，追著射線走。這年 4 月，她報告說這種礦石放出的射線，比其中的鈾能解釋的還要強。
        - 史實裡，7 月 18 日他們宣佈發現一種新元素，以她的祖國波蘭命名為釙；12 月 26 日，又與古斯塔夫·貝蒙一起宣佈了鐳，歐仁·德馬爾賽看到的一條新光譜線隨文刊出。他們工作的那間棚屋通風差，屋頂漏雨，樣品多年都是空手處理；1934 年，瑪麗死於再生障礙性貧血，一般認為與她長年受輻射有關。在這條分支裡，拉丁區有家小館子的老闆娘，塞納河邊有個舊書攤的攤主。
        - 這一趟用得上幾種人：帶著防護、懂醫藥或做過實驗的人；懂檔案、對得齊幾份記錄的人；說得動人、爭得來一間屋子的人。
      outcomes:
        all: 那年冬天，儀器搬進了學校騰出的一間屋子，桌前立著那道防護屏，手套掛在屏邊的釘子上。12 月 26 日，鐳的報告交到了科學院，那條新光譜線隨文刊出。
        p3: 從那年起，那道防護屏一直立在他們的桌前，手套掛在屏邊的釘子上。瑪麗後來又多工作了些年。
        p2: 那年冬天，儀器搬進了學校騰出的那間屋子，再沒有挪過。記錄本一本本排在窗臺上，按日子擺得整整齊齊。
        p1: 12 月 26 日，鐳的報告交到了科學院，那條新光譜線隨文刊出。棚屋裡，記著那一年測量的幾本本子摞在桌角，最上面一本還攤開著。
      none: 那年冬天，雨還從棚屋頂上漏下來。兩人照舊空著手端起玻璃皿，皿裡的東西在暗處發著一點淡光。
      desync: 12 月 25 日夜裡，光譜觀察和他們的記錄還是對不上，年末那份報告沒能交出去。{staff}被召回時，棚屋的桌上攤著三本記錄，翻在三個不同的日子。
      not_admitted: '{staff}沒能進學校院裡那間棚屋，只在拉丁區的小館子裡吃了幾頓飯。鄰桌的波蘭學生還在爭，紅菜湯又涼了。'
      points:
        p1:
          class_lettered: 12 月 25 日，年末那份報告明天就要交到科學院。德馬爾賽看到的那條新光譜線，要和他們本子上的測量一一對上。{staff}照檔案的規矩，把光譜觀察的日子、樣品的編號和本子上的測量一行一行對齊，抄成一張對照表，夾在稿子最前面。皮埃爾把稿子從頭翻到尾，簽了名，遞給瑪麗。她簽在他的名字底下，又把那張光譜的記錄壓在了稿子上。
          else: 12 月 25 日，年末那份報告明天就要交到科學院。德馬爾賽看到的那條新光譜線，要和他們本子上的測量一一對上。{staff}守著那幾本記錄熬了一夜，把光譜觀察對應的樣品編號一個一個找出來，抄在稿子的頁邊。皮埃爾把稿子從頭翻到尾，簽了名，遞給瑪麗。她簽在他的名字底下，又把那張光譜的記錄壓在了稿子上。
        p2:
          class_lettered: 12 月 24 日，雨又從棚屋頂上漏下來，接水的盆已經擺到了門口。{staff}照檔案的辦法，把七月那份釙的通報、年末要交的稿子，和一本記著哪天漏雨、哪天停工、儀器挪過幾回的流水賬訂成一冊，送到管學校房舍的人手裡。那人翻到停工那幾頁，停了很久，從抽屜裡拿出一把鑰匙，放在流水賬上。鑰匙上拴著一塊小木牌，寫著一個門牌號。
          else: 12 月 24 日，雨又從棚屋頂上漏下來，接水的盆已經擺到了門口。{staff}抱著兩份報告和那本停工的流水賬，在學校的辦公室外等了一上午，等到管房舍的人出來，當面一頁一頁翻給他看。那人翻到停工那幾頁，停了很久，從抽屜裡拿出一把鑰匙，放在流水賬上。鑰匙上拴著一塊小木牌，寫著一個門牌號。
        p3:
          class_medical: 八月底，棚屋裡悶得透不過氣，幾隻玻璃皿在桌上擺成一排，裡面是一遍遍提純過的溶液。瑪麗和皮埃爾照舊空著手端皿、倒液。{staff}照醫護的規矩，在桌前立起一道防護屏，把樣品一隻只挪到屏後，又給兩人各遞了一副手套，說這東西傷人不見血。瑪麗看了看那道屏，戴上手套，把手伸到屏後去夠那隻玻璃皿。傍晚屋裡暗下來，皿裡的東西發著一點淡光，落在屏上，沒有落到她手上。
          class_learned: 八月底，棚屋裡悶得透不過氣，幾隻玻璃皿在桌上擺成一排，裡面是一遍遍提純過的溶液。瑪麗和皮埃爾照舊空著手端皿、倒液。{staff}照實驗室的規矩，在桌前立起一道防護屏，把樣品挪到屏後，量過離身子多遠才穩妥，用粉筆在桌面上畫了一條線，又在線邊放了兩副手套。瑪麗看了看那道屏，戴上手套，把手伸到屏後去夠那隻玻璃皿。傍晚屋裡暗下來，皿裡的東西發著一點淡光，落在屏上，沒有落到她手上。
