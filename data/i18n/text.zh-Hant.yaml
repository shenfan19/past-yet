      cold: 發動機預熱時，{staff}在棚裡守著爐子。外頭的水窪結了冰，誰也沒提。
  sequoyah_syllabary:
    name: 一個人造出來的文字
    place: 美國東南部切羅基地區
    figure: 塞闊雅
    story: 1821 年，切羅基銀匠塞闊雅完成了切羅基語的音節文字，每個符號表示一個音節，而不是單個語音。切羅基民族後來正式採納了這套文字。1828 年 2 月 21 日，《切羅基鳳凰報》在新埃喬塔印出創刊號，報上既有切羅基文，也有英文。
    story_prose:
      opening:
        - 1821 年，美國東南部的切羅基地區。銀匠塞闊雅不識英文，卻為切羅基語造出了一套八十多個符號的音節文字，每個符號記一個音節。為了這件事，他已經埋頭做了好多年。
        - 史實裡，他一條腿跛著，走路吃力；家裡的地丟給妻子一個人種，家人一再勸他放手，妻子還燒過他的稿子；演示這套文字時，旁人起了疑心，有人當面指控他。在這條分支裡，有個一個符號一個符號往下唸的學字人，還有個想寫出自己名字的鄰家婦人。
        - 這一趟用得上幾種人：沉得住氣、說話有人聽，或意志極堅的人，帶著金蘋果也行，在疑心四起的那天站得出來；懂醫護的人，或帶著止痛藥的人；種過地、意志堅定的人，或心腸好、身子極結實的人，撐得起這個家半年的農活。
      outcomes:
        all: 那幾年，這套文字在切羅基人裡一鎮一鎮傳開，他的妻子也學會了用它寫字。1828 年 2 月 21 日，新埃喬塔印出第一期《切羅基鳳凰報》，切羅基文和英文分欄並排。
        p3: 那半年地裡沒有荒，家裡的爭吵少了。後來，他的妻子也學會了用這些符號寫字。
        p2: 那半年他的腿疼得輕了些，去鄰鎮教字的路走得快了些，走一程，學字的人就多一些。
        p1: 議會後來正式採納了這套文字。1828 年 2 月 21 日，新埃喬塔印出第一期《切羅基鳳凰報》，報上切羅基文和英文分欄並排。
