        now: 這條分支裡，拉瓦錫趕在逮捕令之前離開巴黎，活過了 1794 年 5 月。
        who: lavoisier_paris
        bio: 這條時間線裡，拉瓦錫在 1793 年 11 月的逮捕令下來之前離開巴黎，活過了 1794 年。
    vignettes:
      units: 兩個數字對得很齊，其中一行的單位卻串了列。排字工固定版面之前，你把它指了出來。
      air: 你問表格為什麼還要記下看不見的東西。排字工指了指「加入」和「剩餘」兩欄，把兩個欄頭都保留在校樣上。
      proof: 排字工念表時，你拿紙條壓住正在讀的那一行。原本看起來屬於下一例的數字，重新對回了自己的欄頭。
  faraday_london:
    name: 從磁裡得到電
    place: 倫敦
    figure: 邁克爾·法拉第
    story: 1831 年 8 月 29 日，法拉第在鐵環實驗中記錄了指針的短暫偏轉。10 月 28 日，他讓銅盤在磁鐵兩極之間轉動，轉動時能持續產生電流。
    story_prose:
      opening:
        - 倫敦皇家研究院的實驗桌上有隻繞線的鐵環。法拉第剛把眼睛從接點抬起來，錶針已經回到零位。旁邊的記錄人問，該記沒有反應，還是再看一遍。
        - 1831 年 8 月，法拉第用鐵環觀察到接通和斷開時的短暫偏轉。十月，他在銅盤轉動時觀察到持續電流。這裡有兩次觀測要保住，一次看偏轉何時開始，一次看它何時結束。
        - 找能分工看時間和錶針的人；換到銅盤時，再讓有手上功夫的人照看接觸處。
      points:
        p1: 你把記錄紙橫過來，左邊留給接通的時刻，另一邊留給誰看見了偏轉。法拉第一動手，記錄人沒等針落回去就報出方向。過了一次短停，他把第二個記號另寫在斷開的那邊。原來空著的欄裡有了兩個不挨著的記號。
        p2: 銅盤轉著，法拉第讓看錶的人多等一會兒。你扶住剛才滑動過的接觸片，記錄人又看一眼表，發現針仍然停在偏過去的一邊。盤停下來，他才把歸零的時刻寫在下面。兩行讀數之間，鉛筆留出一截整齊的空格。
      outcomes:
        all: 兩份記錄並排放著。鐵環那邊，針很快回去；銅盤那邊，記下等了多久，針才隨停轉回去。
        p1: 鐵環的短暫偏轉已經寫好，另一項觀測還不能確認。
        p2: 銅盤的讀數比第一次觀察維持得久。鐵環記錄仍有缺口，這條分支無法和史實對齊。
      none: 實驗紙上只有原先的欄目。儀器停下以後，讀數仍沒人能補上。
      not_admitted: 門裡提醒來訪的人把過道留出來。你在實驗室外聽到記錄人問還能否再看一次。
      desync: 鐵環偏轉或銅盤的持續讀數沒有記下來，實驗記錄脫節，事務所召回員工。
      excerpts:
        p1: 過了一次短停，他把第二個記號另寫在斷開的那邊。原來空著的欄裡有了兩個不挨著的記號。
        p2: 盤停下來，他才把歸零的時刻寫在下面。兩行讀數之間，鉛筆留出一截整齊的空格。
    relic: 一個鐵環和線圈
    relic_desc: 軟鐵環上繞著兩組線圈。
    points:
      p1: 兩人分看接通時刻和錶針，護住鐵環實驗裡轉瞬即逝的偏轉
      p2: 讓集電片貼住轉動的銅盤，讓法拉第看清盤一直轉時電流能不能持續
    points_fail:
      p1: 錶針擺回去才有人抬頭，這一趟把實驗記成無結果。行程同步失敗，員工被召回。
      p2: 銅盤轉動時接觸處滑開了。這條分支裡沒有測出持續電流，事務所因同步失敗召回員工。
    shift:
      p1:
        was: 1831 年 8 月 29 日，法拉第在鐵環裝置接通和斷開時觀察到了短暫的感應電流。
      p2:
        was: 1831 年 10 月 28 日，法拉第觀察到銅盤在磁極之間轉動時產生的電流。
    vignettes:
      instant: 助手寫下「指針偏轉」。你騰出一欄補記何時偏轉。他再回頭時，針已經歸位了。
      skeptic: 你問讀數有沒有一直停在那裡。助手指給你看第一道記號後面的空白。你們補上「回到靜止」，免得後來人當成漏記。
      sketch: 你在頁邊畫出鐵環，標出兩側的繞線。助手現在能把這條觀察對回對應的器具。
  pasteur_paris:
    name: 阿爾布瓦的那個夏天
    place: 阿爾布瓦
    figure: 路易·巴斯德
    story: 1859 年夏，巴斯德在巴黎做研究，九歲的長女讓娜住在阿爾布瓦的祖父家。九月她染上傷寒，死在那裡。
    story_prose:
      opening:
        - 從巴黎寄來的一封短信放在阿爾布瓦祖父家的窗邊。讓娜下午沒有去院裡，祖父隔一會兒到床邊看看，從那裡還能聽見門外收信的腳步。
        - 1859 年夏，讓娜住在祖父家。史實裡，她在九月因傷寒去世。分支裡允許事務所帶來的虛構醫療箱改變這次病程，讓祖父可以寫信說她已經坐得起來。
        - 讓有照護經驗的人帶上事務所的納米醫療箱。先問祖父需要哪種幫忙，再在旁邊陪他等讓娜醒過來。
      points:
        p1: 祖父把椅背挪到能看見床的地方。你把事務所的醫療箱交給照護員工，請祖父留在讓娜想讓他在的地方。等她醒來想坐起，祖父把信紙拿出來，問她要加哪句話。她讓他先寫信寄給媽媽，再想一句給爸爸。
      outcomes:
        all: 祖父寄出一封平安信。信寫得很短，夾在爸爸原先寄來的信旁等郵差來取。
        p1: 讓娜慢慢有力氣在床邊坐一會兒。祖父能把她醒來時自己說的話寫給父母。
      none: 等外頭來取信時，祖父把紙重新疊了一次。史實中，讓娜沒能從那次病裡恢復。
      not_admitted: 家人尚未同意讓來客進屋。門外等著送信的人先走了，窗邊那封來信仍收在屋裡。
      excerpts:
        p1: 等她醒來想坐起，祖父把信紙拿出來，問她要加哪句話。她讓他先寫信寄給媽媽，再想一句給爸爸。
    relic: 阿爾布瓦寄信的信封
    relic_desc: 讓娜祖父留在桌上的一隻虛構信封。
    points:
      p1: 等讓娜發燒時，帶事務所的納米醫療箱去祖父家，幫祖父照護她
    points_fail:
      p1: 祖父守在身邊，讓娜還是越燒越重，最後死在阿爾布瓦。
    shift:
      p1:
        was: 1859 年 9 月，巴斯德九歲的長女讓娜在阿爾布瓦祖父家患傷寒去世。
        now: 這條分支裡，{staff}用上了事務所的納米醫療箱。讓娜退了燒，祖父能給她父母捎信，說她已經有力氣坐起來。
        who: pasteur_paris
        bio: 這條分支裡，巴斯德的長女讓娜在 1859 年阿爾布瓦的那場傷寒後康復。
    vignettes:
      date: 祖父差點把上一封信的日期抄到這一封。{staff}將兩個信封並排放好，陪他重新核一遍。
      address: 郵差動身前，{staff}把巴黎的地址念給祖父聽。那封信仍折著，留給家人來拆。
      future: '{staff}在巴黎來信旁放一張乾淨紙。等讓娜再說話，那裡還有地方可寫。'
  david_fleay_healesville:
    name: 等科裡自己出來
    place: 維多利亞州希爾斯維爾野生動物保護區
    figure: 戴維·弗萊
    story: 1943 年末，希爾斯維爾保護區的鴨嘴獸吉爾孵出一隻幼獸，後來取名科裡。1944 年 1 月，戴維·弗萊和同事打開巢穴，確認幼獸已經孵出。2 月 26 日，弗萊第一次觀察到科裡出洞游水。
    story_prose:
      opening:
        - 希爾斯維爾保護區泥土還很鬆。弗萊打開觀察處，想看看鴨嘴獸幼崽科裡，再把它送回吉爾的巢。飼養員的靴尖停在塌下來的土邊。
        - 史實裡，科裡是首隻在圈養條件下成功育成的鴨嘴獸。1944 年 2 月 26 日，弗萊觀察到它自行出巢。到了三月的公開亮相，保護區用了鐵鍬把它帶出來。這裡可以讓照料繼續，也可以請觀眾再等一會兒。
        - 留心泥土的員工幫弗萊守住洞口。懂動物習性的人可以給吉爾留些它自己會取的葉子。最後要有人和飼養員商量，能否把鐵鍬放下。
      points:
        p1: 你朝飼養員擺手叫他別再往前。鞋停住時，一小片土順著洞沿滑下來。你替弗萊穩住洞口邊上那塊木板，騰出了他送科裡回去的餘地。弗萊等裡面安靜下來，才把手收回。
        p2: 飼養員抱著葉子走到水池邊，正要往巢旁放。你指給他看吉爾昨晚常上岸的淺邊，讓他把葉子留在那裡。入夜前你們都退開了。吉爾蹚過淺水，嘴裡銜著葉子掉頭往岸邊走。
        p3: 有人瞧了三次表，飼養員已經把鐵鍬提到圍欄邊。你問弗萊，可不可以在牌子上只寫「等它出來」。前排一個孩子讓給後面的人看水面，飼養員把鐵鍬靠回棚下。科裡露出嘴的時候，站得最近的人也沒有出聲。
      outcomes:
        all: 科裡從巢裡出來遊了一圈。展場後來仍記著這個下午，圍欄旁沒有留下鐵鍬挖土的痕跡。
        p1: 洞邊的板子移下來時，科裡已經回巢。這趟守住了早期育成記錄。
        p2: 水邊的葉子少了幾片。再往巢旁走要踩下去，飼養員把腳從淺泥裡拔了出來。
        p3: 人群等到科裡自己出現。回程報告保留了這次亮相，並略去了史實中為亮相動用鐵鍬的記錄。
      none: 水池邊沒有人再換葉子，遊客仍等在離開前的最後一班車旁。
      not_admitted: 飼養員請來客在圍欄外等。到關門，圍欄內沒有人來領你。
      desync: 鬆土堵住了洞口，弗萊沒能及時把幼崽送回巢。原有育成記錄脫節，事務所召回員工。
      excerpts:
        p1: 你替弗萊穩住洞口邊上那塊木板，騰出了他送科裡回去的餘地。弗萊等裡面安靜下來，才把手收回。
        p2: 入夜前你們都退開了。吉爾蹚過淺水，嘴裡銜著葉子掉頭往岸邊走。
        p3: 前排一個孩子讓給後面的人看水面，飼養員把鐵鍬靠回棚下。科裡露出嘴的時候，站得最近的人也沒有出聲。
    relic: 一把木飼料勺
    relic_desc: 一把小木勺，柄已經磨光了。
    points:
      p1: 擋住落進洞口的鬆土，讓弗萊來得及把科裡送回巢裡
      p2: 請飼養員在水池邊備些新葉，讓吉爾天黑後能自己銜取
      p3: 科裡在全家亮相前躲進洞裡，勸保護區放下鐵鍬，等它自己出來
    points_fail:
      p1: 弗萊還沒來得及把科裡送回去，鬆土就堵住了洞口。這條分支失去了首次成功育成的記錄，{staff}當天因同步失敗被召回。
      p2: 飼養員照常離開。吉爾要銜葉子，還得沿著岸邊多走一段。
      p3: 約好的鐘點過了，保護區還是用了鐵鍬。科裡被帶出來時，多數觀眾已經走了。
    shift:
      p1:
        was: 1944 年 1 月 3 日，弗萊把幼獸送回受擾的巢裡，吉爾後來繼續把它養大。
      p2:
        was: 弗萊記下了打開巢穴後，吉爾把一部分墊窩的材料和泥土推出洞口。
        now: 這條分支裡，{staff}請飼養員把葉子留在水池邊。吉爾天黑後可以自己銜取，飼養員也不用再開洞。
      p3:
        was: 1944 年 3 月，全家亮相時科裡躲進地道，保護區動土把它挖出來時，多數觀眾已經離開。
        now: 這條分支裡，{staff}拿晚間觀察記錄說服飼養員收起鐵鍬。留下的觀眾可以在池邊等，也可以改天再來。
  archimedes_syracuse:
    name: 城破的那一天
    place: 西西里錫拉庫扎
    figure: 阿基米德
    story: 羅馬圍攻敘拉古時，阿基米德設計器械相助。公元前 212 年，敘拉古城破，他在城裡遇害。普魯塔克記下了幾種不同的說法。
    story_prose:
      opening:
        - 敘拉古城破那天，平日從街上傳來的叫賣聲停了。一個鄰人抱著寫字板站在門裡，問你是不是來找畫幾何圖的老人。他記得阿基米德借走過一塊板。
        - 史實裡，阿基米德在羅馬攻下敘拉古時遇害。古代作者記下不同經過。在這條分支裡，可以找到他，陪他到能暫時安頓的地方。
        - 找能認出他、和鄰人問清去向的員工。需要帶走的是還在屋裡的人，他的圖板由他自己決定放哪兒。
      points:
        p1: 阿基米德把板轉了半圈，說這裡還少一道線。你把鄰人借出的舊板拿給他，讓他知道門外有人能收著這份圖。他用手指在木框上點了一下，隨後把自己的板交出去。到借宿的屋子裡，他先問那塊板是不是也到了。
      outcomes:
        all: 這條分支在敘拉古城破之後仍留有阿基米德的消息。新屋裡有人把圖板放在一張能坐下來的凳旁。
        p1: 你陪他到了暫住處。他掀起圖板上的布，還能接著畫最後那一道線。
      none: 鄰人只聽到城破時阿基米德遇害的消息。不同的說法都沒有讓那個上午重來。
      not_admitted: 鄰人沒把來客帶進裡屋。門內有人收走一塊舊板，板上的名字仍看不清。
      excerpts:
        p1: 他用手指在木框上點了一下，隨後把自己的板交出去。到借宿的屋子裡，他先問那塊板是不是也到了。
    relic: 留著劃線的蠟板
    relic_desc: 虛構鄰人家借出的一塊練習板，上面還留著一道線。
    points:
      p1: 城破時找到阿基米德，一路陪他到能暫避的地方
    points_fail:
      p1: 等找到最後見過他的人，你才聽說他已經在城破時遇害。
    shift:
      p1:
        was: 公元前 212 年，羅馬軍隊攻下敘拉古，阿基米德遇害。古人的記載對經過各有說法。
        now: 這條分支裡，敘拉古仍然城破。{staff}陪阿基米德到了能暫避的地方，他活了下來。
        who: archimedes_syracuse
        bio: 這條時間線裡，阿基米德平安度過公元前 212 年敘拉古城破的那一天，活了下來。
    vignettes:
      load: '{staff}把舊板墊在新板下面，問哪一幅圖得留清楚。鄰人指了指還露著的蠟面。'
      settle: 鄰人要把蠟板從凳子上收走。{staff}請他留一個能拿著板坐下的位置。
      crown: '{staff}請鄰人說說借出的蠟板。對方用兩根手指比了板的寬度。'
  hypatia_alexandria:
    name: 那年三月的亞歷山大
    place: 亞歷山大
    figure: 希帕提婭
    story: 415 年初，希帕提婭仍在亞歷山大講授數學與哲學，城裡的官員也來聽她講。城中長官與另一股勢力的積怨一週比一週深，她因與長官往來，被捲進了這場爭執。
    story_prose:
      opening:
        - 亞歷山大港的早課剛散，有個學生把畫著刻度的木片留在桌上。他問希帕提婭，明天還到這一間嗎。街上傳的話已經變了，她本來打算像往常一樣來講課。
        - 史實裡，415 年三月希帕提婭在亞歷山大遇害。晚古代記述同時留下她公開講授哲學的聲名。這條分支可以請她暫別平常的行程，先到願留她住的人家。
        - 能聽懂學生顧慮並與老師談成安排的員工有用。新的會面點要讓她自己同意，再把歸還借書的事託付給人。
      points:
        p1: 希帕提婭先問誰還沒拿到答應借讀的書。你請她挑出一個能代為交接的人，然後把一位朋友願讓她借住的消息說清。她把沒講完的題目寫到木片背面，交給還站在桌邊的學生。那天晚些時候，借出去的書仍有人送還，老師已經到了朋友家。
      outcomes:
        all: 朋友屋裡有人請她接著講那道未完的題。這個分支的三月留下了她講課的記錄。
        p1: 她同意改動那天的行程，到了願意把門打開的朋友家。原來的講桌暫時空著。
      none: 幾天後，學生來還刻度板，聽到希帕提婭已經遇害。他把木片放在最後一次聽課的位置。
      not_admitted: 學生收好借書人的名單。他沒有在名單上找到來客，教室關門後，木片仍在桌上。
      excerpts:
        p1: 她把沒講完的題目寫到木片背面，交給還站在桌邊的學生。那天晚些時候，借出去的書仍有人送還，老師已經到了朋友家。
    relic: 一片帶刻線的木片
    relic_desc: 虛構的授課用具，背面寫著沒講完的題。
    points:
      p1: 三月風聲最緊之前，勸她暫離亞歷山大，或那天改走別的路，救下她
    points_fail:
      p1: 她照舊在城裡來往，這條分支裡，那個三月她仍然遇害。
    shift:
      p1:
        was: 415 年 3 月，數學家、哲學家希帕提婭在亞歷山大城中的動盪裡遇害。
        now: 那個三月她不在城裡，等局勢平靜下來，才回到亞歷山大接著講課。
        who: hypatia_alexandria
        bio: 這條時間線裡，希帕提婭聽了勸，415 年三月之前離開亞歷山大，躲過了那個春天，後來回城繼續教書。
    vignettes:
