      address: 捆紙包前，{staff}請幫工把封套上的地址念一遍，又在自己的紙條上記下日期。麻繩在紙包上勒出了兩道印子。
  wright_kitty_hawk:
    name: 在空中的十二秒
    place: 北卡羅來納基蒂霍克
    figure: 奧維爾和威爾伯·萊特
    story: 1903 年九月，萊特兄弟帶著一架裝了發動機的飛機回到基蒂霍克附近的營地。12 月 14 日威爾伯的嘗試沒有成功。12 月 17 日上午他們飛了四次，第一次 12 秒，最後一次 59 秒。當天下午，兄弟倆走到基蒂霍克，給代頓的父親發了電報。
    story_prose:
      opening:
        - 1903 年 12 月，基蒂霍克附近。萊特兄弟帶來的飛行者號有發動機，14 日試過一次，沒能飛起來。滑軌還要重新架，風也還在吹。
        - 史實裡，17 日首次飛了十二秒。第四次落地後，風掀翻了飛機，救生站的約翰·丹尼爾斯也被捲進機翼。在這條分支裡，營地裡多一雙手，能跟著守滑軌和落地的飛機。
        - 這一趟用得上能在風裡站住的人，也用得上帶了助力裝備、能在寬大的機翼旁穩住腳的人。
      points:
        p1: 起飛前，{staff}順著滑軌看過沙有沒有墊平，迎風扶住機翼，等飛行者號滑出手邊。丹尼爾斯站在相機旁。翼尖越過滑軌末端，下面有一線空亮的沙地。
        p2: 第四次落地後，{staff}察覺風又頂上來，和救生站的人一同壓住機翼，把丹尼爾斯帶離兩翼之間。沙從機翼下擦過去，搭在翼邊的手仍沒有鬆開。等風落下來，布面上留著一道淺淺的沙印。
      outcomes:
        all: 那天飛過的距離後來寫進電報。裝箱時，兄弟倆又把翼面抹了一遍，箱底只剩一層薄沙。
        p2: 飛行者號又在沙丘上飛了幾回。裝箱的人把一截滑軌繩放在翼面旁，最後才合蓋。
        p1: 十二秒和一百二十英尺被寫進記錄。翻到那一頁時，相機留下的照片就在旁邊。
      none: 風颳過營地，沙又蓋住滑軌的腳。棚裡的爐火只剩一點紅。
      not_admitted: '{staff}沒能加入營地的幫手。走過棚外時，滑軌的一端露在沙上。'
      desync: 機翼擦了沙，飛行者號停在軌邊。{staff}被召回時，風還沿著翼面往上鑽。
      excerpts:
        p2: 沙從機翼下擦過去，搭在翼邊的手仍沒有鬆開。等風落下來，布面上留著一道淺淺的沙印。
        p1: 丹尼爾斯站在相機旁。翼尖越過滑軌末端，下面有一線空亮的沙地。
    relic: 一片螺旋槳葉
    relic_desc: 一片木頭葉子，像一隻扭過的翅膀。
    points:
      p1: 12 月 17 日上午的冷風裡，幫兄弟倆穩住飛行者號，護住第一次起飛
      p2: 第四次飛行落地後，把飛行者號按在沙地上，救下丹尼爾斯和這架飛機
    points_fail:
      p1: 起飛前一陣風把一側機翼掀起來擦了沙，飛機沒離開滑軌，這條分支裡沒有那 12 秒。
      p2: 風把飛行者號掀翻，丹尼爾斯被卷在機翼裡滾了出去，飛機照史實壞得再也飛不了。這條分支裡，這架飛機在那天下午之後沒有再離開過地面。
    shift:
      p1:
        was: 1903 年 12 月 17 日上午，奧維爾飛了 12 秒，120 英尺。
      p2:
        was: 1903 年 12 月 17 日，第四次飛行後一陣風掀翻了飛行者號，約翰·丹尼爾斯被卷在機翼中間，飛機損壞嚴重，從此再沒飛過。
        now: '{staff}和救生站的人把它按在了沙地上，丹尼爾斯沒被卷進去。那年冬天，兄弟倆又讓它在沙丘上飛了幾回，才把它裝箱運回代頓。'
    vignettes:
      numbers: 天黑前，{staff}把四次飛行抄到同一頁，左邊秒數，右邊英尺。加完第二遍，鉛筆還夾在兩欄之間。
      sand: 夜裡風大，{staff}從沙裡刨出滑軌，把兩邊踩實。救生站的幫手說天亮風會停，天亮時棚門還在響。
      cold: 發動機預熱時，{staff}守著棚裡的爐子。門縫漏進一點光，照著外頭結冰的水窪。
  sequoyah_syllabary:
    name: 一個人造出來的文字
    place: 美國東南部切羅基地區
    figure: 塞闊雅
    story: 1821 年，切羅基銀匠塞闊雅完成了切羅基語的音節文字，每個符號表示一個音節，而不是單個語音。切羅基民族後來正式採納了這套文字。1828 年 2 月 21 日，《切羅基鳳凰報》在新埃喬塔印出創刊號，報上既有切羅基文，也有英文。
    story_prose:
      opening:
        - 1821 年，美國東南部的切羅基地區。銀匠塞闊雅不識英文，卻為切羅基語造出了一套八十多個符號的音節文字，每個符號記一個音節。為了這件事，他已經埋頭做了好多年。
        - 史實裡，他一條腿跛著，走路吃力；家裡的地丟給妻子一個人種，家人一再勸他放手，妻子還燒過他的稿子；演示這套文字時，旁人起了疑心，有人當面指控他。在這條分支裡，有個一個符號一個符號往下唸的學字人，還有個想寫出自己名字的鄰家婦人。
        - 這一趟用得上幾種人：沉得住氣、說話有人聽，或意志極堅的人，帶著金蘋果也行，在疑心四起的那天站得出來；懂醫護的人，或帶著止痛藥的人；種過地、意志堅定的人，或心腸好、身子極結實的人，撐得起這個家半年的農活。
      outcomes:
        all: 那幾年，這套文字在切羅基人裡一鎮一鎮傳開，他的妻子也學會了用它寫字。1828 年 2 月 21 日，新埃喬塔印出第一期《切羅基鳳凰報》，切羅基文和英文分欄並排。
        p3: 那半年地裡沒有荒，家裡的爭吵少了。後來，他的妻子也學會了用這些符號寫字。
        p2: 那半年他的腿疼得輕了些，去鄰鎮教字的路走得快了些，走一程，學字的人就多一些。
        p1: 議會後來正式採納了這套文字。1828 年 2 月 21 日，新埃喬塔印出第一期《切羅基鳳凰報》，報上切羅基文和英文分欄並排。
      none: 演示那天，嚷聲壓過了一切，阿約卡沒有被叫回來念那個詞。那張寫著符號的紙被人踩在了腳下。
      desync: 演示那天，嚷聲越來越大，沒有人再等那個孩子回來。{staff}被召回時，空地上的人已經散了，那張寫著一個詞的紙落在土裡，邊上有一個小小的腳印。
      not_admitted: '{staff}沒能在這裡落下腳，只幫鄰家婦人照著一張紙描了幾遍她的名字。遠處的空地上，有個跛著腿的人正給幾個人指著紙上的符號。'
      points:
        p2:
          class_medical: 塞闊雅要到附近的鎮子上教人認這些符號，那條跛著的腿走不了多遠就疼，一段路要歇好幾回。{staff}懂醫護，每天傍晚給他熱敷那條腿，揉開發僵的地方，又把他的柺杖削到合手的高度。那天他走到鄰鎮，太陽還沒落。他在一張紙上寫下一行符號，學字的人湊過來，一個音節一個音節唸了出來。
          else: 塞闊雅要到附近的鎮子上教人認這些符號，那條跛著的腿走不了多遠就疼，一段路要歇好幾回。{staff}帶著止痛的藥，每天出門前讓他服下，一路走在他身邊，替他背著那卷寫滿符號的紙。那天他走到鄰鎮，太陽還沒落。他在一張紙上寫下一行符號，學字的人湊過來，一個音節一個音節唸了出來。
        p1:
          trait_calm: 演示那天，空地上圍滿了人。塞闊雅讓六歲的女兒阿約卡先走開，請旁人說一個詞，他寫下來，再叫她回來念。還沒寫完，人群裡就有人起了疑心，說這些符號來路不正，當面衝他嚷了起來。{staff}不慌不忙地走到他身邊，請大家先別急，等孩子回來唸一遍，唸對了再說。阿約卡被叫了回來，低頭看著那張紙，一個音節一個音節，把那個詞唸了出來。空地上靜了一會兒，說出那個詞的人往前走了兩步，湊過去看紙上的符號。
