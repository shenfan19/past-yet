  tupaia_tahiti:
    name: 領航者的海圖
    place: 奮進號上
    figure: 圖帕亞
    story: 來自賴阿特阿島的領航者圖帕亞於 1769 年登上奮進號，幫人畫下自己熟悉的群島。1770 年 6 月，船在今天昆士蘭外海觸礁。班克斯記下圖帕亞在修船期間患壞血病，又在同年晚些時候於巴達維亞記下泰阿塔和圖帕亞的死訊。
    story_prose:
      opening:
        - 奮進號船上，圖帕亞正跟人核自己讀得出的島名，船身忽然一撞。布包從桌角滑下，值班水手往上喊人。天還沒亮，大家才知道船卡在礁上。
        - 史實裡，1770 年奮進號在今昆士蘭外海觸礁，之後脫險修理。圖帕亞在此期間病過，幾個月後班克斯在巴達維亞記下泰阿塔與圖帕亞的死訊。分支可以護住脫礁，給圖帕亞分到鮮食，也讓兩人病中有時間見面。
        - 找能幫船員守住工作位置的人。修船時要有人問圖帕亞自己吃得下什麼，到了巴達維亞要能安排病中探望。
      points:
        p1: 船員要把東西從低處提上來，有一隻箱子還堆在擋手的位置。你替下一個壓泵的人騰出立足處，留出轉運箱子的空當。另一邊的人一直守著繩，等叫下一輪時再一起用力。船身動的那一下，有人先問泵邊的人還站不站得穩。
        p2: 管分食的人先把鮮食送往修船的隊伍。圖帕亞聽見有人在點名，問他今日還能再等多久。你請人端來一份，讓他先挑願意吃的東西，再把餘量記給下一班。那隻盤子送到跟前時，鮮食沒有在別人手裡先分完。
        p3: 巴達維亞一間房裡病人多，照看的人幾次要被喊走。圖帕亞請留下來的人問泰阿塔願不願見他。你把這句話帶過去，兩人都點頭，這才有人把一把椅子從門邊挪到床旁。你離開時，他們還能聽清彼此說話。
      outcomes:
        all: 船照史實脫險。修船和後來病中的探望都留下分支記錄，泰阿塔、圖帕亞的死訊仍在。
        p1: 奮進號從礁上脫開。修船的人將回來繼續分工，船上其他日子的安排還等著辦。
        p2: 圖帕亞拿到他自己挑的那份鮮食。事情只寫到那隻盤子遞來。
        p3: 兩人有一會兒能坐得近。巴達維亞的死訊沒有因為這次見面改變。
      none: 船上有人還等著下一個口令。艙裡既沒留出鮮食，也沒能約到後來想見的人。
      not_admitted: 水手讓沒有分工的人離開泵旁。你留在另一頭，看見有人把濕透的紙束從腳邊收起來。
      desync: 天亮船仍釘在礁上。未能保住史實中的脫險，事務所召回員工。
      excerpts:
        p1: 船身動的那一下，有人先問泵邊的人還站不站得穩。
        p2: 那隻盤子送到跟前時，鮮食沒有在別人手裡先分完。
        p3: 你離開時，他們還能聽清彼此說話。
    relic: 一張島嶼草圖
    relic_desc: 一張墨與淡彩的紙，畫著小小的島形和名字。
    points:
      p1: 觸礁那一夜幫著減重、壓泵，護住奮進號不沉
      p2: 修船各隊分鮮食時給圖帕亞留一份，讓他自己挑吃得下的東西
      p3: 在巴達維亞替圖帕亞找時間坐到泰阿塔身邊，問他們病中想讓誰留下來
    points_fail:
