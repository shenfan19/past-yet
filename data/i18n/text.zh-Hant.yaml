    vignettes:
      stairs: '{staff}數了從門口到房間的臺階，好知道托盤端上去時還熱不熱，把數字記在買菜單的邊上。樓梯拐角那盞燈還沒點。'
      window: '{staff}把窗推開一道縫，讓廣場上泉水的聲音進來。屋裡沒人說什麼，也沒人去關。'
