      p2: 風把飛行者號掀翻，丹尼爾斯被卷在機翼裡滾了出去，飛機照史實壞得再也飛不了。這條分支裡，這架飛機在那天下午之後沒有再離開過地面。
    shift:
      p1:
        was: 1903 年 12 月 17 日上午，奧維爾飛了 12 秒，120 英尺。
      p2:
