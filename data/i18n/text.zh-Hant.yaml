      label: 桌上混著木頭和酒的觀察圖。通信者收走散頁前，你加了兩張臨時標籤，圖才按原來的順序放進信裡。
      read: 你念回觀察時，手不指圖。通信者聽出哪裡只用文字已經說不明白，補上了對應的圖號。
  newton_cambridge:
    name: 蘋果與月亮服從同一條定律
    place: 劍橋
    figure: 艾薩克·牛頓
    story: 牛頓的《自然哲學的數學原理》於 1687 年在倫敦出版。第三卷用引力解釋月球的運動與地面物體的下落。送去付印的謄清稿不是他的筆跡，抄寫的人是漢弗萊·牛頓，這幾年做他的抄寫助手，與他不是親戚。多年後，斯圖克利記錄了牛頓的回憶，蘋果落下引出了一個關於引力的問題。這份回憶沒有提到蘋果砸在頭上。
    story_prose:
      opening:
        - 劍橋的抄寫桌堆著發往倫敦的紙。漢弗萊·牛頓剛抄清一個圖名，艾薩克·牛頓從另一張樣頁找出同一處錯字。外面的信使已經敲門。
        - 史實裡，《自然哲學的數學原理》於 1687 年在倫敦刊行。經辦印刷的哈雷在 7 月 5 日報信說已印完。這裡可以把最後一批勘誤送齊，首版到手之後，還能讓讀者給一個能查回原頁的更正地址。
        - 會讀頁碼或命題的人先看打包稿。適合整理往來信的人可以跟牛頓約定核讀和記下更正的辦法。
      points:
        p1: 兩張改動說的是同一個圖，其中一張少了卷號。你和漢弗萊把兩份並好，請牛頓讀回最後想保留的寫法。信使重複了一遍地址，勘誤單按卷號從桌這頭送到他手裡。他收下紙束，桌上只剩改過標題的舊頁。
        p2: 第一封讀者來信圈了一個數，卻沒說在哪一頁。你把樣書遞給牛頓，問圖編號能不能用作第二個標記。他找回命題後，在更正簿上讓你先寫來信日期，批准與否留給他自己填。下一封信到時，書記照著這個位置找到了同一幅圖。
      outcomes:
        all: 哈雷寫信說書已經印完。劍橋這邊的簿子剛寫完第一欄，下一位讀者來借書時還能看見怎麼留更正。
        p1: 最後一批勘誤送到哈雷手裡，書按史實印出，後來的改動仍散在樣書和信件裡。
        p2: 更正簿能按命題找到頁，但發去倫敦的勘誤另出差錯。回程保留了登記辦法。
      none: 桌上兩張勘誤仍互相重疊。後來有人看到不同的改字，已經分不清哪張先寫。
      not_admitted: 信使說包件要從抄寫人手裡收。你在門外聽見有人把兩張相似的紙翻得嘩嘩響。
      desync: 哈雷少收到一份最終勘誤。刊行的文本已與史實錯開，事務所召回員工。
      excerpts:
        p1: 信使重複了一遍地址，勘誤單按卷號從桌這頭送到他手裡。他收下紙束，桌上只剩改過標題的舊頁。
        p2: 他找回命題後，在更正簿上讓你先寫來信日期，批准與否留給他自己填。下一封信到時，書記照著這個位置找到了同一幅圖。
    relic: 一塊玻璃三稜鏡
    relic_desc: 一塊三角的玻璃，能把白光分成各種顏色。
    points:
      p1: 把牛頓最後一批勘誤按卷和頁打包，從劍橋及時發給倫敦的哈雷
      p2: 首版送達後，和牛頓約定如何收錄讀者的更正，讓他能在劍橋按命題和頁碼核驗答覆
    points_fail:
      p1: 同一處改字郵寄了兩個版本，哈雷收不齊末批勘誤，事務所因同步失敗召回員工。
      p2: 讀者信各用各的頁碼，較早的改動散落在信和自己的樣書裡。
    shift:
      p1:
        was: 1687 年 7 月 5 日，哈雷來信說《原理》已經印完，末批勘誤及時趕上。
      p2:
        was: 牛頓在自己的首版留下注記。後來修訂再版仍是長期工作。
        now: 學院裡有一份按命題編號的更正簿。借書的人可以填下所見的錯誤，得到牛頓同意的修改會連日期另記。
        who: newton_cambridge
        bio: 《原理》在劍橋寫成，在倫敦付印。哈雷經辦印刷，書出以後牛頓仍修改它。
    vignettes:
      apple: 你問學院的一位雜役：「聽說蘋果砸了他的頭？」這位雜役是遊戲裡編出來的。他接著掃地：「砸沒砸我不知道。你倒說說，月亮怎麼不掉下來？」你一時答不上，回頭去看那一頁。蘋果這件事，要再過六十五年才有人寫下來。
      hand: 謄清的稿子不是書上署名那個人的筆跡。雜役說，抄寫的是漢弗萊先生，也姓牛頓，不是親戚。你把這一條記在本子上，沒有去打擾他。
      diagram: 你在一張廢紙上畫出月球若不受力會走的方向，再添一支箭頭，標出讓它轉彎的拉力。雜役不認得拉丁文，盯著那支箭頭看了好一陣。
  bach_leipzig:
    name: 眼醫進城的那個春天
    place: 萊比錫
    figure: 約翰·塞巴斯蒂安·巴赫
    story: 到 1750 年春，巴赫的視力已差到難以讀寫。遊方眼醫約翰·泰勒在萊比錫給他動刀，術後併發症又引出了第二次手術。同年 7 月 28 日，巴赫去世。
    story_prose:
      opening:
        - 萊比錫的譜架靠向窗口。巴赫聽見來幫忙的人把紙倒過來，便請他先讀紙上的聲部。約翰·泰勒在城裡行醫，家裡有人等巴赫答覆哪天見他。
        - 1750 年春，泰勒為巴赫做眼科手術，後來又進行第二次。巴赫當年 7 月 28 日去世。這個分支裡，他能聽到另一位醫護人員的意見，再決定是否改用別人讀譜幫忙。
        - 派有醫護經驗的人去聽他自己的顧慮，讓識譜的員工確認他願意由誰代讀。進屋前，先問家人什麼時段方便他談。
      points:
        p1: 他把譜紙往來客面前推了推。你請另一位醫護人員先聽巴赫把最擔心的事說完，再說眼下可以先等一等。巴赫請家人回話推掉預約，叫熟識的歌者下午來替他念兩個聲部。第一段彈完，他讓那位歌者把剛才的休止再從頭念一次。
      outcomes:
        all: 這一春巴赫把幾次讀譜排到光足的時候。有人讀，他扶著琴沿聽。七月家中仍傳出他的死訊。
        p1: 泰勒沒有來動手術。下午光照到譜架時，幫手按巴赫自己的要求從該停的地方讀起。
      none: 約好的拜訪照常進行。後來家人收拾譜架，桌上還壓著沒人來得及代讀的一頁。
      not_admitted: 家人把等回話的人請到外間。沒排上見面，你聽不到裡面有人討論什麼。
      excerpts:
        p1: 巴赫請家人回話推掉預約，叫熟識的歌者下午來替他念兩個聲部。第一段彈完，他讓那位歌者把剛才的休止再從頭念一次。
    relic: 一根小風琴管
    relic_desc: 一根調好音、試過音的小管子，沒有賣掉。
    points:
      p1: 在巴赫同意泰勒動刀前給他第二個醫護意見，趁他還在考慮，問他是否願意請人幫忙讀譜
    points_fail:
      p1: 巴赫沒聽到第二個醫護意見，照原定安排接受手術。術後出現併發症，又動了一次刀。
    shift:
      p1:
        was: 1750 年春，約翰·泰勒在萊比錫給巴赫做眼科手術。術後出現併發症，又動了一次刀。
        now: 這條分支裡，巴赫聽過{staff}的意見後，推掉了泰勒的手術。他的視力仍差，便請人在白天陪他讀譜。
        who: bach_leipzig
        bio: 這條分支裡，巴赫在 1750 年春推掉泰勒的手術，請人幫他讀譜。
    vignettes:
      entry: 你聽出低聲部比歌者預想的早到一口氣。你請他換到屋子另一邊聽。這次，提示還沒來，他就抬起了頭。
      rest: 歌者一唱到休止就數亂。你抄下等待時能聽到的另一行，他在自己開口前的那個字上做了記號。
      light: 兩人合看一頁譜。你把紙轉向有光的地方，扶住不動，直到兩人都看見自己的聲部從哪兒分開。
  lavoisier_paris:
    name: 逮捕令下來之前
    place: 巴黎
    figure: 拉瓦錫
    story: 1793 年 11 月 24 日，所有前包稅官被下令逮捕，拉瓦錫和岳父雅克·保爾茲都在其中，先後入獄。1794 年 5 月 8 日，兩人與其他前包稅官同日在巴黎被判處死刑並處死。
    story_prose:
      opening:
        - 巴黎，雅克·保爾茲把一份賬攤給女兒看。安托萬·拉瓦錫在另一頭逐頁讀，兩個人都準備留在城裡說明自己的賬。有家人提議先把冊子交給肯保管的人。
        - 1793 年 11 月 24 日，前包稅官被下令逮捕。保爾茲和拉瓦錫後來於 1794 年 5 月 8 日同日被處死。這一趟可以分別勸兩個人先離城，各自作決定。
        - 善於聽人把理由說完的員工可以分別見他們。熟悉賬冊的員工也能幫忙列出交給家人的東西，讓接手的人找得到。
      points:
        p1: 保爾茲說單把整冊給家人，他們還是不知道哪些地方有賬要問。你請他邊說邊挑出要做標記的頁。女兒把他指到的賬核過一遍，才伸手接整本。他聽她念出記號，站起身把椅子推回桌邊。
        p2: 拉瓦錫拿著一張核好的對賬單，說裡面有兩行得由他親自解釋。你問能否先把解釋寫給保管人。等家人逐條讀回，他才請他們轉告來找他的人，自己已經離開巴黎。臨走，他把答過的那張擱到家人手邊，留出下面一張空紙。
      outcomes:
        all: 兩個人各自離開了巴黎。家人到五月開賬冊時收到各自的消息，兩人都還活著。
        p1: 雅克先走，在次年五月之後仍有消息。拉瓦錫留在巴黎，後來被處死。
        p2: 拉瓦錫先走，在次年五月之後仍有消息。雅克·保爾茲留在巴黎，後來被處死。
      none: 家人從賬桌邊散開，兩人都留在城中。次年五月，他們的名姓仍出現在同日的死刑名單中。
      not_admitted: 來問話的人沒有家裡約過的名帖。桌上的賬冊合起來，留在已經坐定的人手裡。
      excerpts:
        p1: 女兒把他指到的賬核過一遍，才伸手接整本。他聽她念出記號，站起身把椅子推回桌邊。
        p2: 等家人逐條讀回，他才請他們轉告來找他的人，自己已經離開巴黎。臨走，他把答過的那張擱到家人手邊，留出下面一張空紙。
    relic: 一臺精密天平
    relic_desc: 一臺精細的天平，給化學記賬。
    points:
