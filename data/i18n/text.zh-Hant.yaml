        p3:
          class_lettered: 11 月初，磚樓的牆一天天高起來，塔基那邊還是一片挖開的沙土。特斯拉從紐約來到工地，在工棚裡翻那兩頁賬。{staff}管過文書，把已經確認的工價按月排成一張表，請他照著這張表向出資人提分段撥款，下一段基礎工程單立一份付款約定。特斯拉拿筆在表上改了兩個數，把它摺好，放進寫給摩根的信封裡。他走出工棚，海灣上的風把他的帽簷吹得往上一掀。
