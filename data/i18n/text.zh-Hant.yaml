  mendeleev_petersburg:
    name: 元素週期表
    place: 聖彼得堡
    figure: 門捷列夫
    story: 1869 年 3 月 1 日，德米特里·門捷列夫排好一張單頁的表，按原子量和化學性質的相似性給元素分組。3 月 18 日，俄國化學學會開會，門捷列夫不在，尼古拉·緬舒特金代他宣讀論文。會議記錄把討論推到下一次，下一次卻沒再議。3 月下旬，這張表隨他的化學教科書刊出，也另印散頁寄給同行。那年春天的一份德文摘要，把性質的「週期性重現」譯成了「逐級變化」。
    story_prose:
      opening:
        - 1869 年春，聖彼得堡。3 月 1 日，德米特里·門捷列夫排好了一張單頁的表，按原子量和化學性質的相似給元素分組，表裡留著空格，等還沒發現的元素。
        - 史實裡，3 月 18 日俄國化學學會開會，他不在場，一說去了特維爾省看奶酪作坊，一說病了，論文由尼古拉·緬舒特金代讀；記錄寫明作者不在，討論推到下一次，下一次卻沒有人再提。五月寄往德國的摘要裡，他的第一條結論，性質的週期性，被譯成了逐級變化。在這條分支裡，印刷所有個嫌表上空格太多的排字工，客棧裡有個守著茶炊的掌櫃。
        - 這一趟用得上幾種人：懂文書、分得清原稿和附表的人；會講課、在會上撐得起一場問答的人；懂德文、校得出一個詞的人。
      outcomes:
        all: 那年夏天，德國的讀者在摘要裡讀到了週期性重現。聖彼得堡學會的記錄裡，元素表那一項後面跟著半頁問答，那張表上，幾處空格旁邊畫著鉛筆圈。
        p2: 學會的記錄裡，元素表那一項後面多了半頁問答。那張表後來一直留在他手邊，幾處空格旁邊畫著鉛筆圈。
        p3: 那年夏天，德國的讀者在摘要裡讀到，元素的性質會週期性重現。有人來信問重現和例外怎樣分，他攤開那張表，一條一條寫了回信。
        p1: 3 月下旬，這張表隨《化學原理》第二分冊刊出，又另印散頁寄給同行。1875 年，鎵被發現，填上了表裡的一個空格。
      none: 4 月 15 日，學會再開會，沒有人提起那張表。印刷所的繩子上，晾乾的散頁一張張收了下來，空格還是空格。
      desync: 3 月 18 日，緬舒特金手裡只有那張表，原稿還壓在行李裡，學會劃掉了這一項。{staff}被召回時，那張表還攤在會場的桌上，沒有人去碰。
      not_admitted: '{staff}沒能進學會的門，只在客棧裡學了幾天從茶炊接茶。掌櫃一直盯著{staff}的靴子，直到龍頭擰對為止。'
      points:
        p1:
