    relic: 一份圖紙副本
    relic_desc: 一張沃登克里弗圖紙的副本，折了兩道，折角底下有鉛筆寫的日期。
    points:
      p1: 九月收到超支估價後，在沃登克里弗把舊圖及修訂圖分別簽收，護住當年仍能開工的建築
      p2: 請懷特把已能確定的實驗樓工程和仍待換報價的塔身分開給工頭，兩套賬各有一頁
      p3: 請特斯拉帶已經確認的工價向出資人提出分段撥款，讓未來幾個月的基礎工程有獨立的付款約定
    points_fail:
      p1: 包工人只按舊圖估價，沒人能確定接受哪套尺寸，工地取消本季安排，事務所因同步失敗召回員工。
      p2: 一份報價把樓與塔的工錢都合在一欄，後來無法據賬看出哪部分已經承諾。
      p3: 兩部分仍等同一輪籌款。後續遇到缺口時，工人不知道哪些工作能拿到錢。
    shift:
      p1:
        was: 1901 年特斯拉與建築師斯坦福·懷特討論估價和設計。沃登克里弗在當年動工。
      p2:
        was: 沃登克里弗包括實驗樓和塔，在改預算的通信裡能看到多次設計修改。
        now: 工頭在開工前就能把兩部分各自結算，塔的改價也有前一輪可對照。
      p3:
        was: 工程最初得到摩根資助，之後未能取得足夠的後續資金，計劃未按設想完成。
        now: 書面約定先付清已確認的一段基礎工程。往後資金不夠時，工地能結清這部分，並把尚無款項的工作標出來。
        who: tesla_wardenclyffe
        bio: 特斯拉把沃登克里弗設想為無線通信和輸電系統的一環。建設過程還要面對各輪報價、籌款和施工安排。
    vignettes:
      timber: 十月初，{staff}幫一個車伕把一車木板拉上通往工地的沙路，輪子每陷一回，就拿肩膀頂一回後擋板，新鋸的木板一路冒著松脂味。車伕說路那頭的農戶已經拿這邊的錘子聲給母雞定鐘點了，工地歇工那幾天，雞下蛋下得最勤。
      signal: 十二月中旬，一個男孩靴子上全是泥，揮著報紙從車站跑上來：馬可尼收到了大洋那邊發來的信號。工頭把報紙舉得老遠，問{staff}一個點真能跑那麼遠嗎。{staff}說能。工頭把報紙摺好塞進外套，叫工人接著敲。
      watch: 十二月下旬，{staff}陪守夜人在崖上的木板棚裡坐了一夜，把舊報紙往牆縫裡塞，擋海灣吹來的風，爐子裡的煤塊燒得通紅。守夜人從一張報紙上念出煤價，說塔蓋這麼高，最好值得這麼漏風。
  schubert_vienna:
    name: 三月那場音樂會的節目單
    place: 維也納
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，弗朗茨·舒伯特在維也納音樂之友協會的會場舉行了一場只演自己作品的公開音樂會，這是他一生唯一的一場。那年秋天，他已在病中，搬進哥哥費迪南德在維登的新住處。10 月 2 日，他寫信給出版人普羅布斯特，推薦最後三首鋼琴奏鳴曲。11 月 19 日，他在那處住所去世，三十一歲。三首奏鳴曲到 1839 年才出版，題獻也換了人。
    story_prose:
      opening:
        - 1828 年 3 月，維也納。三十一歲的作曲家弗朗茨·舒伯特寫了六百多首歌，還有交響曲和室內樂，大部分生前沒有出版，也很少公開演出。這個月，靠朋友和演奏者幫忙，他要在音樂之友協會的會場辦一場只演自己作品的音樂會，日子定在 3 月 26 日。
        - 史實裡，這是他一生唯一的一場專場音樂會。那年秋天他已在病中，9 月搬進哥哥費迪南德在維登的新住處；10 月 2 日他寫信給萊比錫的出版人普羅布斯特，推薦最後三首鋼琴奏鳴曲，想題獻給一位敬重的作曲家，對方對奏鳴曲沒有興趣；11 月 19 日，他在哥哥家裡去世。三首奏鳴曲到 1839 年才出版，題獻換成了羅伯特·舒曼。在這條分支裡，協會有個擺椅子的門房，城牆外的葡萄酒園裡有個拉琴的，維登那幢新房子裡有個女房東。
        - 這一趟用得上幾種人：懂音樂、手上穩的人，或者有條理、能張羅、意志夠硬的人，把臨時湊來的演奏者和會場約到同一晚；琴藝極好的樂手，或者管過檔案、做過翻譯、賣過書，腦子快又沉得住氣的人，替他跟出版人把交稿談定；帶著納米醫療箱的人，治得了那個時代治不好的病。
      outcomes:
        all: 那年十一月，舒伯特沒有病倒。萊比錫的回信來了，他把它夾在三首奏鳴曲的手稿裡，第一頁上寫著他要題獻的那個名字。
        p3: 那年十一月，舒伯特沒有病倒。入冬以後，維登那間屋子的窗下多了一張寫譜的小桌，桌角壓著一摞新的稿紙。
        p2: 11 月 19 日，舒伯特在哥哥家裡去世，三十一歲。費迪南德收拾屋子時，從抽屜裡取出一封萊比錫的回信，和三首奏鳴曲的手稿放在了一起。
        p1: 11 月 19 日，舒伯特在哥哥家裡去世，三十一歲。3 月 26 日那晚的請柬，後來印進了一位朋友的回憶錄。
      none: 11 月 19 日，舒伯特在哥哥維登的家裡去世，三十一歲。三首奏鳴曲的手稿由費迪南德收著，過了十一年才印出來。
      desync: 3 月 25 日晚上，演奏的人和空出的會場還對不上日子，門房翻著登記簿，找不到 26 日那一欄該寫誰的名字。{staff}被召回時，門房正把擺好的椅子一把一把疊回牆邊。
      not_admitted: '{staff}沒能進那群朋友中間，只在城牆外的葡萄酒園裡坐過幾個傍晚。有一回，鄰桌的人哼起一首歌，說是一個叫舒伯特的人寫的，哼到一半忘了詞。'
      points:
        p1:
          trait_methodical: 3 月 25 日，離音樂會只剩一天。協會會場空出來的是 26 日晚上，答應來幫忙的演奏者裡，卻有人記成了別的日子。{staff}做事有條理，列了一張單子，挨家去敲演奏者的門，把日子和鐘點一個個對過，請他們在單子上簽了名，又回協會請門房在登記簿上把那一晚寫上舒伯特的名字。天黑前，舒伯特來會場看了一眼。他在一排排空椅子中間站了一會兒，伸手把第一排歪了的一把椅子擺正。
