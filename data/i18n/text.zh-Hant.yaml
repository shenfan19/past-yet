    relic: 一根測杖
    relic_desc: 一根量步距用的細杖，上面刻著尺度。
    points:
      p1: 盤纏見底的時候，護住測量隊的行程，讓測繩按期鋪到西別
      p2: 幫他把一段海岸從步測換成用繩量，讓那一段的數先準起來
      p3: 幫他把測繩從西別再往前鋪一段，讓這一趟多測一截沒測到的海岸
    points_fail:
      p1: 隊伍在西別之前就撐不下去回了頭，回到江戶也畫不出那一路的圖。
      p2: 這條分支裡，蝦夷地的每一段仍只是步數。
      p3: 測量照舊在西別回頭，這條分支與歷史一樣。
    shift:
      p1:
        was: 1800 年，伊能忠敬的測量隊沿蝦夷地東南海岸一路測到西別，再折返江戶。
      p2:
        was: 1800 年的第一次測量全靠步測，到第二次測量才用上測繩。
        now: 蝦夷地有一段海岸先用上了繩。
      p3:
        was: 1800 年的第一次測量到西別為止，北海道其餘的海岸要等以後的測量補上。
        now: 測繩越過西別又往前鋪了一段，回到江戶的那幾張圖上多了一截海岸。
    vignettes:
      bend: 一處海灣眼看要被畫進一條直線裡，{staff}請他們在拐彎處再測一次方位，那個彎就留在了紙上。
      repeat: '{staff}用同樣的步子把一段路又走了一遍，兩次的步數並排記著，沒去挑哪一個。'
      sketch: 眾人歇腳時，{staff}在計數單背面畫了一個岬角的輪廓，海風掀起紙角，就拿一塊石子壓住，標出測繩鋪在哪裡。
  hargrave_stanwell_park:
    name: 第四隻風箏
    place: 澳大利亞斯坦威爾公園
    figure: 勞倫斯·哈格雷夫
    story: 勞倫斯·哈格雷夫 1893 年開始試驗箱形風箏。1894 年 11 月 12 日，在斯坦威爾公園的海灘上，四隻串在一起的箱形風箏把他拉離沙地，升到約 16 英尺高。新南威爾士州立圖書館藏的照片裡有哈格雷夫、詹姆斯·斯韋恩和試驗器材。1915 年 7 月 6 日他在悉尼去世。
    relic: 一片箱形風箏的備用簽
    relic_desc: 一片給箱形風箏骨架用的備用簽。
    points:
      p1: 11 月 12 日，在陣風裡護住那串風箏，讓他升起來，再平安落回沙地
      p2: 幫他完成這四隻風箏的尺寸和做法圖，在澳洲留下一份
    points_fail:
      p1: 一陣風把風箏串扯偏了，座椅砸回沙地，這條分支裡沒有那次離地 16 英尺。
      p2: 這四隻風箏照史實只留在他自己手裡，這條分支裡斯坦威爾公園沒有另一份。
    shift:
      p1:
        was: 1894 年 11 月 12 日，斯坦威爾公園的海灘上，四隻串起來的箱形風箏把哈格雷夫拉離沙地，升到將近 16 英尺。
      p2:
        was: 1894 年，這四隻風箏的做法只在哈格雷夫自己手裡；他晚年把模型送去慕尼黑，大多毀於二戰。
        now: 那四隻風箏的圖紙在斯坦威爾公園留了一份，沒有跟著別的模型去慕尼黑。
        who: hargrave_stanwell_park
        bio: 哈格雷夫 1894 年那四隻箱形風箏的尺寸和做法圖在斯坦威爾公園留了一份。他的模型後來大多毀於二戰，這四隻怎樣做的，在澳洲仍查得到。
    vignettes:
      four: 升空之後，{staff}把沙灘上鋪開的風箏又數了一遍，四隻都記在本子上，用括號圈在一起，讓下一個讀的人知道它們是一起飛的。
      tag: 一張簽從骨架上扯脫了，{staff}沿著濕沙往回找，找到後重新打了個結繫上。
      lift: 先放一隻風箏試風時，{staff}和幫手們站在沙丘上，學會了拉著繩該往哪邊跑。
  sun_yat_sen_guangzhou:
    name: 從銅像到一所新大學
    place: 廣州
    figure: 孫中山
    story: 你站在中山大學的孫中山像前，被帶回 1924 年 2 月 4 日的廣州，這一天他下令把三所學校合併為國立廣東大學，派鄒魯籌備。同一段日子裡，他星期天在高等師範的禮堂演講，講稿在幾個人手裡來回走，後來成了一本書。9 月 19 日開學，11 月 11 日舉行成立典禮，用的是他寫的校訓。1925 年 3 月 12 日他在北京去世，1926 年這所大學以他的名字命名。
    relic: 孫中山銅像
    relic_desc: 中山大學校園裡的孫中山銅像。它是通往 1924 年廣州的穿越媒介，不是古董，不能出售。
    points:
      p1: 替籌備處排好城外的招生告示張貼路線，交給送告示的人
      p2: 經人引薦走訪三所學校，趕在第一次籌備會議前交回一張彙總單
      p3: 替籌備處踏勘備選校址，在石牌定下來之前交回一張比較圖
      p4: 核對三校的畢業名單，為 6 月 21 日的典禮交上一份統一名冊
      p5: 跟籌備處的人去石牌，把新校地的界樁一根根立穩
    points_fail:
      p1: 這條分支裡，招生告示只貼在城裡，城外的學生知道消息時，報名已經開始了。
      p2: 第一次籌備會議照史實召開，三所學校的難處仍是各說各的，沒有一張合在一起的單子。
      p3: 選址照史實定在石牌，籌備處桌上沒有一張把幾處校址畫在一起的圖。
      p4: 6 月 21 日的畢業典禮照常舉行，籌備處仍要分開查閱三份名單。
      p5: 石牌的校地照史實只劃在紙上，地上一根界樁也沒有立。
    shift:
      p1:
        was: 1924 年 6 月 9 日，國立廣東大學委託各省教育廳招生；6 月 10 日，預科考試開始報名，原計劃招 520 人。
        now: 這條分支裡，城外的路口和碼頭上也貼著招生告示。
      p2:
        was: 1924 年 3 月 3 日，第一次籌備會議召開，議題裡頭一件是三所學校學生的畢業問題。
        now: 這條分支裡，會上擺著一張把三所學校的難處列在一起的單子。
      p3:
        was: 1924 年，各校分散各處，管理不便，孫中山命鄒魯擇石牌為新校址，當年劃定土地。
        now: 這條分支裡，選址的文書旁邊多了一張把幾處校址和石牌畫在一起的圖。
      p4:
        was: 1924 年 6 月 21 日，鄒魯就任國立廣東大學校長，同一天為原三所學校的畢業生舉行畢業典禮。
        now: 這條分支裡，籌備處辦典禮時有了一份核對過的統一名冊。
      p5:
        was: 1924 年孫中山命鄒魯擇石牌為新校址，可新校舍 1933 年才動工，1934 年秋第一批學院才遷入。孫中山 1925 年 3 月 12 日去世，生前沒有見到。
        now: 這條分支裡，11 月他離開廣州之前，石牌校地的界已經一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 這條時間線裡，孫中山離開廣州之前，新校址石牌的界已經立定。
    shift_all: 五件差事都辦妥了。回來再讀孫中山後來親筆題寫的校訓，才看出這五件事與「博學、審問、慎思、明辨、篤行」的呼應。
    vignettes:
      slips: 一位編出來的辦事員正要抄一頁稿子，稿上有一張籤條蓋住了兩行。你問他籤條是誰的字，稿子又是誰的字。他先抄了稿子，籤條留在原處沒有動。
      back_row: 一位編出來的學生找不到座位，老是站起來張望。你往裡挪了挪。他坐下來聽完了後半場，一句話沒說，散場時朝你點了點頭。
      hundred: 你在本子最後一頁畫正字，一天一筆。畫滿一百天的時候，一位編出來的辦事員問你在數什麼。你說，日子。
