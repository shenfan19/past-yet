        p3: 10 月 5 日夜裡，那間帶鐵欄的屋子只點著一盞捻得很低的燈。坡對著牆說話，一會兒坐起來，一會兒又躺下，遞到嘴邊的水一口也不肯碰。{staff}懂醫護，守在床邊，隔一陣量一回他的脈，等他安靜下來的空當，就把杯沿湊到他嘴邊，讓他抿一小口。天快亮時，坡睡著了。幾天後的一個早上，他自己坐了起來，要了一杯水，端著喝完，把杯子放回了窗臺上。
