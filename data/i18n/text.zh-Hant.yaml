      p2: 系裡同意有人繼續帶討論課，但依然用原來的排課辦法，沒有經費支付諾特這部分工時。
    shift:
      p1:
        was: 1918 年 7 月 26 日，費利克斯·克萊因在哥廷根的一次會議上呈交《不變變分問題》。印本所署作者是埃米·諾特。
      p2:
        was: 諾特於 1919 年獲任教資格，哥廷根大學記錄她到 1923 年才取得帶少量固定薪酬的教學任務。
        now: 系裡在任教資格重審前先撥了一小筆課酬，按實際開課支付。這個學期願意跟她做題的學生因此有一段固定的時間可來。
        who: noether_gottingen
        bio: 哥廷根的任教規則曾讓諾特的第一份申請受阻。她仍開展研究，後來以一系列論文和自己的課堂培養學生。
    vignettes:
      notice: 冬季學期開課前，{staff}幫工友往佈告欄上釘課表，舊課表揭下來，木板上留著一圈圈圖釘眼。工友指著一行念：希爾伯特教授，在諾特博士協助下。他說這一行他釘了好幾個學期，進教室講課的一直是那位女博士。
      turnips: 十月，{staff}幫房東太太在後院挖蘿蔔，土又濕又黏，蘿蔔都不大。她說城裡流感又起來了，學生公寓空了一半，麵包票她早就不數了，反正也沒什麼可數的。
      snow: 十二月底，{staff}幫數學樓的門房掃臺階上的雪，掃帚禿了，掃一下要補一下。門房說打完仗回來的學生太多，講堂裡沒座位了，有人站在走廊裡聽。
  boltzmann_duino:
    name: 同一個數，幾種排法
    place: 杜伊諾
    figure: 路德維希·玻爾茲曼
    story: 1877 年，路德維希·玻爾茲曼數出同一種能量分佈可以有多少種排法，把熱的規律和原子的統計聯繫起來，可直到二十世紀初，原子是否真實存在仍有許多人懷疑。1906 年 5 月，他因所謂嚴重的神經衰弱停課，夏天和家人到的里雅斯特附近的杜伊諾度假。9 月 5 日，他在那裡去世，六十二歲。兩年後，讓·佩蘭的布朗運動實驗開始證實愛因斯坦的預言，原子漸漸被人接受。
    story_prose:
      opening:
        - 1906 年夏，的里雅斯特附近的杜伊諾海灣。路德維希·玻爾茲曼和妻子、女兒在這裡度假。將近三十年前，他數出同一種能量分佈可以有多少種排法，把熱的規律和原子連在一起。到這時，還有許多人不信原子真的存在。
        - 史實裡，這年 5 月他因所謂嚴重的神經衰弱停了課，課由斯特凡·邁爾代講。9 月 5 日，他在杜伊諾去世，六十二歲。兩年後，佩蘭的布朗運動實驗開始替原子作證。在這條分支裡，岸邊有晾網的漁夫，沙灘上有數石子的小孩，旅館的女招待每天把浴巾從海邊收回來。
        - 這一趟用得上兩種人：講得清學問、能同他談原子的人，懂醫、帶對了藥、陪得住一個病人的人。
      outcomes:
        all: 九月，回維也納的火車開出杜伊諾。玻爾茲曼靠窗坐著，上衣口袋裡鼓著那幾張算草。
        p2: 九月，回維也納的火車開出杜伊諾。他靠窗坐著，看了一路的海。
        p1: 那個夏天，那幾張算草一直在他的上衣口袋裡。
      none: 杜伊諾的海灣很靜。旅館露臺的桌上，幾張算草被風吹到了地上。
      not_admitted: '{staff}沒能走近那一家人。旅館露臺上的人每天對著海坐著，假期一天天少下去。'
      points:
        p1: 八月初的一個傍晚，玻爾茲曼坐在旅館的露臺上，桌上壓著幾張算草。{staff}拿起一張，從水裡微粒的亂跳講起，講愛因斯坦前一年怎樣算出這種亂跳該走多遠，再過兩年，就會有人在顯微鏡底下照著去量。他聽完沒說話，把那幾張算草疊齊，放進了上衣口袋。起身回房時，他的手一直按在那隻口袋上。
        p2:
          class_learned: '{staff}照醫生的辦法，替他定好每天吃藥和睡覺的鐘點，早晚各診一回脈，白天陪他沿著海邊走一段。八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。'
          else: '{staff}按時給他換上帶來的鎮靜貼片，夜裡守著他入睡，白天陪他沿著海邊走一段。八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。'
      excerpts:
        p2: 八月底，他夜裡睡得比先前長了，早上能自己走到海邊，再走回來。有一天吃早飯時，他讓女兒去問回維也納的火車幾點開。
        p1: 他聽完沒說話，把那幾張算草疊齊，放進了上衣口袋。起身回房時，他的手一直按在那隻口袋上。
    relic: 一截粉筆
    relic_desc: 一截用得很短的講課粉筆。
    points:
      p1: 讓他知道，原子的存在過不了幾年就會被實驗證實，他為之爭了半輩子的學說站得住
      p2: 在杜伊諾的假期結束之前，治好他的病，讓他回到維也納
    points_fail:
      p1: 他照舊在懷疑聲裡過完這個夏天，這條分支裡沒有人告訴過他布朗運動的實驗會替原子作證。
      p2: 9 月 5 日照史實發生，這條分支裡他沒有回到維也納的講臺。
    shift:
      p1:
        was: 1906 年 9 月 5 日玻爾茲曼去世時，原子是否真實存在仍有不少物理學家和化學家懷疑；1908 年起佩蘭的布朗運動實驗驗證了愛因斯坦 1905 年的預言，原子才被普遍接受。
        now: 那個夏天他已經知道，原子的事過幾年就會有人用實驗定下來。
      p2:
        was: 1906 年 5 月玻爾茲曼因病停課，課由斯特凡·邁爾代講；同年 9 月 5 日他在杜伊諾度假時去世，終年六十二歲。
        now: '{staff}陪他過了杜伊諾的那個夏天，病一點點緩下來。秋天他帶著家人回到維也納，又站上了講臺，還親眼看到原子被實驗證實。'
        who: boltzmann_duino
        bio: 這條時間線裡，玻爾茲曼 1906 年秋天病好了回到維也納，又教了幾年書，看到了佩蘭的實驗讓原子學說被普遍接受。
    shift_all: 他知道自己的學說站得住，病也好了，秋天回到維也納接著講課。
    vignettes:
      pebbles: 七月，{staff}在海灘上幫漁夫的小兒子數一桶小石子。孩子問，太小、數不清的東西，是不是就不算有。{staff}說沒人數它也在那兒。孩子想了想，又往桶裡扔了一把。
      nets: 七月初，{staff}幫漁夫把晾在岸邊的網收起來。漁夫說這一灣斯洛文尼亞話、意大利話、德國話都聽得到，魚可不管你用哪種話罵它。
      towels: 八月，{staff}幫旅館的女招待把海邊晾乾的浴巾收回來。她說今年海水暖得早，城裡來的客人一住就是一整季，她的手讓鹽水泡得起了皮。
  tesla_wardenclyffe:
    name: 那一行寫著擬建
    place: 長島肖勒姆
    figure: 尼古拉·特斯拉
    story: 1901 年 3 月，J.P. 摩根答應出資十五萬美元，給尼古拉·特斯拉建一座無線電站。建築師斯坦福·懷特設計了長島沃登克里弗的房子，這一年特斯拉為塔和實驗樓幾次寫信給他。9 月工地動工。12 月，馬可尼收到了一個越過大西洋的信號。1902 年 6 月，特斯拉把實驗室搬進磚樓；1903 年 7 月，摩根回信說不再追加款項。1917 年，塔被炸掉。
    story_prose:
      opening:
        - 1901 年 9 月，紐約長島北岸的沃登克里弗。半年前，J.P. 摩根答應出資十五萬美元，給發明家尼古拉·特斯拉建一座無線電站；建築師斯坦福·懷特設計了這裡的實驗樓和塔。特斯拉想用這座塔做無線通信和輸電。
        - 史實裡，九月裡各家包工的報價高出預料，特斯拉為塔和實驗樓幾次寫信給懷特，圖紙改了又改；12 月馬可尼收到了越過大西洋的信號；1903 年 7 月摩根回信說不再追加款項，1917 年塔被炸掉。在這條分支裡，工地上有個工頭，崖上的木板棚裡有個守夜人，沙路上有個往這邊拉木板的車伕。
        - 這一趟用得上幾種人：管過檔案、做過木工的人，或者手巧、有條理的人，分得清哪一張是舊圖、哪一張是改過的，也看得懂樓和塔的工錢各是多少；再要說得動人，替特斯拉把撥款一段一段講清楚。
      outcomes:
        all: 1902 年 6 月，特斯拉把實驗室搬進了磚樓。後來錢還是不夠，工棚牆上那兩頁賬一直釘著，付清了的那一段底下畫著一道線。
        p3: 後來錢還是不夠。工地結清了約定的那一段基礎工程，沒有著落的幾項另列在一頁紙上，釘在工棚門後。
        p2: 1902 年 6 月，特斯拉把實驗室搬進磚樓。塔的報價後來又改過幾回，每一回都能跟前一頁對上。
        p1: 1902 年 6 月，特斯拉把實驗室搬進沃登克里弗的磚樓，在那裡一直工作到 1906 年。實驗樓和塔址留到了今天。
      none: 1903 年 7 月，摩根回信說不再追加款項。崖上的塔立了十幾年，1917 年被炸掉，磚樓還在。
      desync: 9 月 19 日，兩套圖混在一摞裡，包工人照著舊圖報了價，沒人說得清該照哪一套。{staff}被召回時，工頭正把整摞圖捲起來，用一根麻繩捆住。
      not_admitted: '{staff}沒能進工地，只在通往崖上的沙路邊站過幾天。拉木板的車一輛輛過去，輪子陷進沙裡，又被人從後面推了出來。'
      points:
        p1:
          class_lettered: 9 月 19 日，工棚的長桌上攤著兩套圖，抬頭一模一樣，尺寸卻對不上；包工人拿著舊圖報的價，比預料的高出一截。{staff}管過文書，把舊圖和修訂圖一張張分開，在每張的折角底下用鉛筆寫上日期，各簽一個收，壓在兩塊磚下。工頭拿起修訂的那一套，對著窗口的光看了一陣，折了兩道，揣進上衣口袋。他走出工棚，朝崖上喊了一聲，讓人把木樁搬過來。
          class_craft: 9 月 19 日，工棚的長桌上攤著兩套圖，抬頭一模一樣，尺寸卻對不上；包工人拿著舊圖報的價，比預料的高出一截。{staff}幹過手藝活，拿尺子把兩套圖上的尺寸一處處量過，把舊圖和修訂圖分開，在每張的折角底下用鉛筆寫上日期，各簽一個收，壓在兩塊磚下。工頭拿起修訂的那一套，對著窗口的光看了一陣，折了兩道，揣進上衣口袋。他走出工棚，朝崖上喊了一聲，讓人把木樁搬過來。
