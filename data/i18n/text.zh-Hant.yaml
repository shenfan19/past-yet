  sor_juana_mexico_city:
    name: 送走的最後幾本書
    place: 墨西哥城
    figure: 胡安娜修女
    story: 1690 年，普埃布拉主教未經她同意，把她批評一篇佈道的文章刊印出來，題為《雅典娜信札》，附信署名“菲洛特亞修女”。她的《答菲洛特亞修女》署 1691 年 3 月 1 日。1693 年她賣掉了書和樂器，1694 年重申誓願。1695 年 4 月 17 日，她在照顧染疫的修女之後，死於聖傑羅姆修道院。
    story_prose:
      opening:
        - 1695 年初，墨西哥城。胡安娜的書和樂器兩年前已經賣掉。她寫過一封為讀書和求學辯護的長信，信到後來結集出版時，她已不在人世。
        - 史實裡，疫病蔓延，她照顧病倒的人，自己也在四月去世。在這條分支裡，空書架旁還有地方放一張桌子，照料病人的人可以在那兒擱水和乾布。
        - 這一趟用得上守得住病房、能把照料接下去的人。懂得看病、帶著合用藥物或器材的人也有用處。
      points:
        p1: 病房裡接班的人遲遲沒來。{staff}把水、淨布和空碗分開放，騰出手去看下一張床。門邊有人把兩隻袖口挽了又挽。桌角那摞乾布矮下去一截，底下還有一張疊得方方正正。
        p2: 有一張床上躺著起不了身的病人。{staff}守著她喝水，按手邊的藥和照料辦法接著看護。天亮以後，她伸手扶住了床沿。{staff}把碗遞過去時，她騰出一隻手托住了碗底。
        p3: 胡安娜也倒下了。{staff}用帶來的藥或器材為她治療，在床邊等她能再喝一口水。她把空碗遞回來，在枕邊的紙上摸了一下。指尖還沾著水，她把紙往乾燥的床角挪了挪。
      outcomes:
        all: 那年四月過後，兩個人又站到了病房的桌旁。一個把新晾好的布摞起來，另一個回到空書架旁，在紙上添了幾行。
        p3: 四月過後，胡安娜又有了坐到桌前的時候。書架仍空著，桌邊有幾張新寫的紙。
        p2: 四月過後，那位病人又來病房幫忙。她站在自己躺過的床邊，把一條洗淨的布抖開。
        p1: 病房裡倒下的人漸多，照料仍接了下去。換班時，有人把洗淨的碗倒扣在桌上。
      none: 桌上的水壺一夜沒動。天亮時，隔著門還能看見壺嘴下方那一小塊亮光。
      not_admitted: '{staff}沒能進到照料病人的屋裡。門縫裡露出桌腳，旁邊靠著一隻空水罐。'
      desync: 床邊等不到接手的人。{staff}被召回時，盛著溫水的碗還放在桌角。
      excerpts:
        p3: 她把空碗遞回來，在枕邊的紙上摸了一下。指尖還沾著水，她把紙往乾燥的床角挪了挪。
        p2: 天亮以後，她伸手扶住了床沿。{staff}把碗遞過去時，她騰出一隻手托住了碗底。
        p1: 門邊有人把兩隻袖口挽了又挽。桌角那摞乾布矮下去一截，底下還有一張疊得方方正正。
