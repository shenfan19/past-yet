  noether_gottingen:
    name: 署著別人名字的課
    place: 哥廷根
    figure: 埃米·諾特
    story: 1915 年，大衛·希爾伯特和費利克斯·克萊因把埃米·諾特請到哥廷根，可大學不讓女性取得任教資格，從 1916 年冬季學期起，她的課在課表上署的是希爾伯特的名字。1918 年 7 月 26 日，克萊因把她的論文《不變變分問題》呈交給哥廷根科學學會，9 月底她交了終稿。這篇論文把每一種連續對稱性與一個守恆量聯繫起來。1919 年 6 月，她獲准任教，直到 1923 年才第一次領到一小筆固定的教學薪酬。
    story_prose:
      opening:
        - 1918 年 7 月，哥廷根。三十六歲的數學家埃米·諾特三年前被大衛·希爾伯特和費利克斯·克萊因請到這裡，可大學不讓女性取得任教資格，從 1916 年冬季學期起，她的課在課表上署的是希爾伯特的名字。這個夏天，她寫成了《不變變分問題》，把作用量的連續對稱性與守恆定律聯繫了起來。
        - 史實裡，7 月 26 日克萊因把這篇論文呈交給哥廷根科學學會，她到 9 月底才交上終稿；第二年她獲准任教，直到 1923 年才第一次為教課領到一小筆固定薪酬。在這條分支裡，數學樓有個釘了好幾個學期課表的工友，她住處的後院有個不再數麵包票的房東太太。
        - 這一趟用得上幾種人：教過大學、管過檔案或做過校對的人，或者有條理、有學問的人，把署名的文稿和提要一起送到；管過檔案、教過大學、又說得動系裡的人，替她的討論課要來一份課酬。
      outcomes:
        all: 1919 年 6 月，諾特試講之後獲准在哥廷根任教，任教資格論文就是那篇署著她名字的《不變變分問題》。在那之前，她的討論課已經有了一筆課酬，跟她做題的學生每週有一段固定的時候可來。
        p2: 那個冬天，她的討論課有了一筆課酬，跟她做題的學生每週有一段固定的時候可來。1919 年 6 月，她試講之後獲准任教。
        p1: 那篇論文照期呈交，印本上署的是她的名字。1919 年 6 月，它成了她的任教資格論文。
      none: 十二月底，討論課照舊開著，沒有課酬。佈告欄上那一行仍寫著希爾伯特教授，在諾特博士協助下，圖釘邊上鏽了一圈。
      desync: 7 月 26 日開會前，正文和提要還散在兩沓稿子裡，作者頁找不著了。{staff}被召回時，桌上攤著一頁沒有署名的首頁，窗外的鐘正在敲。
      not_admitted: '{staff}沒能進數學樓，只在門外的臺階上站過幾回。佈告欄上釘著課表，有一行寫著希爾伯特教授，在諾特博士協助下。'
      points:
        p1:
          class_learned: 7 月 26 日上午，學會開會之前，克萊因要的那份稿子還分在兩處：一沓是諾特署名的正文，一沓是提要，夾在別的論文中間。{staff}教過大學，知道學會的會是怎麼開的，把兩沓對著頁碼合成一份，在首頁上找到她的名字，用一張紙條別好，趕在開會前送到克萊因手上。克萊因翻到首頁，看了一眼上面的名字，把稿子放進公文包最上面一層。他扣上搭扣，夾著包進了會議室。
          class_lettered: 7 月 26 日上午，學會開會之前，克萊因要的那份稿子還分在兩處：一沓是諾特署名的正文，一沓是提要，夾在別的論文中間。{staff}跟稿子打慣了交道，一頁頁對著頁碼把兩沓合成一份，在首頁上找到她的名字，用一張紙條別好，趕在開會前送到克萊因手上。克萊因翻到首頁，看了一眼上面的名字，把稿子放進公文包最上面一層。他扣上搭扣，夾著包進了會議室。
          else: 7 月 26 日上午，學會開會之前，克萊因要的那份稿子還分在兩處：一沓是諾特署名的正文，一沓是提要，夾在別的論文中間。{staff}做事有條理，從那一摞論文裡把兩沓都找了出來，對著頁碼合成一份，在首頁上找到她的名字，用一張紙條別好，趕在開會前送到克萊因手上。克萊因翻到首頁，看了一眼上面的名字，把稿子放進公文包最上面一層。他扣上搭扣，夾著包進了會議室。
        p2:
          class_lettered: 十二月裡，討論課照舊每週開，課表上那一行還是希爾伯特教授，在諾特博士協助下。{staff}管過文書，把這一學期她實際上過的每一堂課按日期抄成一張表，連同那篇署名論文的印本一起送到系裡，請他們先為下一輪討論課核一筆課酬，再隨新的任教申請存檔。系裡收下那張表，夾進一個新卷宗，封皮上寫著她的名字。下一週的討論課，諾特推門進去，黑板已經擦乾淨了，前排多擺了兩把椅子。
          class_learned: 十二月裡，討論課照舊每週開，課表上那一行還是希爾伯特教授，在諾特博士協助下。{staff}教過大學，知道系裡的錢是怎麼走的，把這一學期她實際上過的每一堂課按日期列成一張表，連同那篇署名論文的印本一起送到系裡，請他們先為下一輪討論課核一筆課酬，再隨新的任教申請存檔。系裡收下那張表，夾進一個新卷宗，封皮上寫著她的名字。下一週的討論課，諾特推門進去，黑板已經擦乾淨了，前排多擺了兩把椅子。
