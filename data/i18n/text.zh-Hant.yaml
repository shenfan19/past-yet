      p2: 信和校樣疊在一起包走。第一個來找校樣的人，也會看到那些信上的名字。
    shift:
      p1:
        was: 尼采從都靈寫信給奧弗貝克夫婦。弗蘭茨·奧弗貝克於 1889 年 1 月 8 日在都靈找到尼采。
      p2:
        was: 奧弗貝克事後寫信說，他趕到時，尼采正在看《尼采反對瓦格納》的最後一份校樣。
        now: 校樣和信分作兩包上路。奧弗貝克一眼就認得哪份是改過的校樣，另一包仍然封著。
