    shift:
      xue:
        was: 1924 年 6 月 9 日，國立廣東大學委託各省教育廳招生；6 月 10 日，預科考試開始報名，原計劃招 520 人。
        now: 這條分支裡，城外的路口和碼頭上也貼著招生告示。
      wen:
        was: 1924 年 3 月 3 日，第一次籌備會議召開，議題裡頭一件是三所學校學生的畢業問題。
        now: 這條分支裡，會上擺著一張把三所學校的難處列在一起的單子。
      si:
        was: 1924 年，各校分散各處，管理不便，孫中山命鄒魯擇石牌為新校址，當年劃定土地。
        now: 這條分支裡，選址的文書旁邊多了一張把幾處校址和石牌畫在一起的圖。
      bian:
        was: 1924 年 6 月 21 日，鄒魯就任國立廣東大學校長，同一天為原三所學校的畢業生舉行畢業典禮。
        now: 這條分支裡，籌備處辦典禮時有了一份核對過的統一名冊。
      xing:
        was: 1924 年孫中山命鄒魯擇石牌為新校址，可新校舍 1933 年才動工，1934 年秋第一批學院才遷入。孫中山 1925 年 3 月 12 日去世，生前沒有見到。
        now: 這條分支裡，11 月他離開廣州之前，石牌校地的界已經一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 這條時間線裡，孫中山離開廣州之前，新校址石牌的界已經立定。
