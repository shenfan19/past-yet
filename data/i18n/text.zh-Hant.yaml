        p3:
          class_labour: 地裡的活一直是他妻子一個人在扛，玉米地荒了大半，家裡為這套文字已經吵了好些年。{staff}種過地，天一亮就下田，鋤草、培土，把荒下的幾壟重新種上，傍晚和他的妻子一起把水挑回來。那一季的收成進了屋。塞闊雅把那卷寫滿符號的紙攤在桌上，他的妻子在旁邊坐下，看了很久，伸出手指，點在其中一個符號上。
