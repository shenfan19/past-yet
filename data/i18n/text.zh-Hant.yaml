    plots: {}
    blurb: 三所學校要併成一所大學。籌備處有活兒時，會交給做得來的人。員工接到差事就能做完，每交一件得一顆星。
    handle_label: 名冊合成一本
    protagonist: 孫中山
    protagonist_role: 下令把三所學校併成一所大學的政治家，星期天在這座禮堂演講
    stay: 停留七個事務所日，歷史 210 天
    plan_baseline: 主時間線
    encyclopedia:
      history:
        - text: 1924 年 2 月 4 日，孫中山下令把國立高等師範學校、廣東法科大學和廣東農業專門學校合併為國立廣東大學，派鄒魯籌備。
          check: true
        - text: 1924 年 1 月 27 日到 8 月 24 日，孫中山利用星期天在高等師範的禮堂演講，共十六講。黃昌谷每一講都隨同速記，鄒魯校讀謄清的講稿並貼簽注條，孫中山親筆修正。
          check: true
        - text: 鄒魯 2 月 21 日接手籌備。2 月 24 日他在禮堂召集三所學校的學生宣佈此事，3 月 3 日開第一次籌備會議，議題裡有三所學校學生的畢業問題。
          check: true
        - text: 頭幾講在三月底印成單行本，孫中山 3 月 30 日為它寫了序。6 月 3 日鄒魯呈報歸並三校的辦法，6 月 6 日獲批準。
          check: true
        - text: 9 月 19 日開學，11 月 11 日舉行成立典禮，用了孫中山寫的校訓。孫中山 1925 年 3 月 12 日在北京去世，1926 年這所大學改名為國立中山大學。
          check: true
      regret:
        - 你 9 月 1 日離開。開學在 19 日，校訓是那以後的事。
        - 演講停在第十六講。臺下沒有人知道那是最後一講。
    events:
      asked_the_way: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}也說不清，陪著找了半天。'
      asked_the_way_shown: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}在圖上指給他看，他道了謝，拿著圖走了。'
