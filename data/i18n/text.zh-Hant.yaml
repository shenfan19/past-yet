    shift:
      p1:
        was: 1677 年 5 月 18 日，兩位見證人為所見的小動物簽下證詞。此後幾個月，另有六人也留下了證詞。
      p2:
        was: 列文虎克在 10 月 5 日從代爾夫特發出的信中附上見證人的證詞。11 月，胡克在倫敦皇家學會演示了小動物。
