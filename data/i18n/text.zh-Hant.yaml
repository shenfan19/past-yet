        p1:
          class_lettered: 八月底，錢袋快見底了。幕府給的補助本來就不多，剩下的路費是伊能忠敬自己掏的，離西別還有好幾天的路。{staff}做慣了案頭的事，把剩下的錢一文一文攤開，一路要住幾處、吃幾頓，一樣一樣記上，能省的那幾項用筆圈了出來。隊伍照常往前走。到西別那天，挑夫數完最後一段步子，嗓子已經啞了。伊能忠敬把測杖插進沙裡，在計數單的最末一行寫下了西別兩個字。
