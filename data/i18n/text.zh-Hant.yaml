    vignettes:
      chairs: 3 月 25 日晚上，會場裡的爐子剛生上火，{staff}幫協會的門房在會場裡一排排擺椅子，擺到椅子用完了，名單上的名字還沒唸完。門房說他還沒見過這麼多人肯擠進一間屋子，聽一個還活著的人的曲子。
      tavern: 七月的一個傍晚，{staff}坐在城牆外的一處葡萄酒園裡，葡萄架底下的燈一盞盞點起來，一個拉琴的和一個彈吉他的一支接一支地奏圓舞曲。拉琴的在兩支曲子中間停下來說，這麼熱的天，唱到第二段弦就鬆了，唯一的辦法是拉快點。
      stairs: 九月初，{staff}幫維登一幢新房子的女房東把幾筐東西搬上樓。牆上的灰泥還有石灰味，臺階上落著幾片刨花。她說樓梯間新得會回嘴，在一樓說一句，三樓能聽見兩遍。
  keats_rome:
    name: 臺階旁的小屋
    place: 羅馬
    figure: 約翰·濟慈
    story: 1820 年 11 月，患肺結核的約翰·濟慈與畫家約瑟夫·塞文來到羅馬，住進西班牙臺階旁的西班牙廣場 26 號。1821 年 2 月 23 日夜裡他在那裡去世，2 月 26 日葬在塞斯提烏斯金字塔旁的墓園。照他的意思，墓碑上沒有他的名字。
    story_prose:
      opening:
        - 1820 年 11 月中旬，羅馬。二十五歲的詩人約翰·濟慈患著肺結核，和畫家約瑟夫·塞文住進西班牙臺階腳下、西班牙廣場 26 號的二樓。他在短短幾年裡寫出了包括頌詩在內的主要作品，這是他的最後一個冬天。
        - 史實裡，醫生詹姆斯·克拉克給他定下飢餓療法，每天一條鳳尾魚、一片麵包，還一次次給他放血；塞文一個人照看他，錢很快斷了，夜裡也睡不成；他到最後都相信自己沒有留下什麼，照他的意思，墓碑上不刻名字。在這條分支裡，臺階腳下有個賣紫羅蘭的賣花人，樓梯上有個常問起樓上病人的鄰居。
        - 這一趟用得上幾種人：懂醫護、攔得住放血的人，或帶著一本現代醫護手冊的人；守得住長夜、自己也熬得住的人，帶著睡眠調節器也行；讀過書、懂詩的人，說得出他的詩以後的樣子。
      outcomes:
        all: 2 月 23 日深夜，濟慈去世，塞文守在床邊。最後那幾個月，他吃得上熱湯和麵包，也聽人說過，他的詩以後會一直有人讀。三天後，他葬在塞斯提烏斯金字塔旁的墓園，墓碑上照他的意思沒有刻名字。
        p3: 2 月 26 日，他葬在塞斯提烏斯金字塔旁的墓園，墓碑上照他的意思沒有刻名字。西班牙臺階旁那間屋子後來留了下來，窗還朝著廣場。
        p2: 最後那幾個月，桌上不再只有一條鳳尾魚和一片麵包。1821 年 2 月 26 日，他葬在塞斯提烏斯金字塔旁的墓園。
        p1: 2 月 23 日深夜，濟慈去世，塞文一直守在床邊。五十多年後，塞文也葬進了那片墓園，就在濟慈旁邊。
      none: 一月裡，塞文熬垮了，倒在隔壁屋裡。2 月 23 日深夜，桌上還擺著那一片麵包和一條鳳尾魚，床邊的椅子空著。
      desync: 一月裡，塞文倒下了。{staff}被召回時，他和衣躺在隔壁屋裡，那封寫了一半的信還攤在桌上，墨水瓶沒有蓋。
      not_admitted: '{staff}沒能進這棟樓，只在臺階腳下的船形泉邊打了幾回水。賣花人問起樓上是誰病了，{staff}答不上來，二樓那扇窗一直關著。'
      points:
        p2:
          class_medical: 12 月 9 日早上，濟慈咳出了兩杯血。克拉克醫生來了，挽起他的袖子，說要再放八盎司；桌上擺著這一天的飯，一條鳳尾魚，一片麵包。{staff}懂醫護，按住病人的手腕，說這樣放下去人撐不住，又把他這幾天吃下去的東西一樣樣報給醫生聽，醫生把刀收了回去。那天中午，塞文端上來一碗熱湯和一塊麵包。濟慈靠在枕頭上，一勺一勺喝完了，把空碗遞回給他。
          else: 12 月 9 日早上，濟慈咳出了兩杯血。克拉克醫生來了，挽起他的袖子，說要再放八盎司；桌上擺著這一天的飯，一條鳳尾魚，一片麵包。{staff}翻開帶來的現代醫護手冊，指著書頁上的一段唸給醫生聽，又把病人這幾天吃下去的東西一樣樣寫在紙上，攤在醫生面前，醫生把刀收了回去。那天中午，塞文端上來一碗熱湯和一塊麵包。濟慈靠在枕頭上，一勺一勺喝完了，把空碗遞回給他。
        p1:
          class_medical: 1 月 15 日，塞文在信裡寫，銀行把匯票退了回來，手裡的錢只夠再付一回房租；濟慈不讓他離開視線，他出不了門畫畫掙錢，夜裡也沒睡過一個整覺。{staff}懂護理，接過了夜裡的班，隔一陣扶濟慈起來咳，替他擦汗、換枕巾，天快亮時才把燈捻小。塞文和衣睡在隔壁，靴子也沒脫。早上他醒過來，先推開門朝床上看了一眼，又回去把那封沒寫完的信寫完了。
          else: 1 月 15 日，塞文在信裡寫，銀行把匯票退了回來，手裡的錢只夠再付一回房租；濟慈不讓他離開視線，他出不了門畫畫掙錢，夜裡也沒睡過一個整覺。{staff}守得住夜，搬一把椅子坐在床邊，讓塞文去隔壁睡，病人一翻身，就起來看一眼。塞文和衣睡在隔壁，靴子也沒脫。早上他醒過來，先推開門朝床上看了一眼，又回去把那封沒寫完的信寫完了。
        p3:
          class_lettered: 二月中，濟慈已經下不了床。他還是覺得自己什麼也沒留下，照他的意思，墓碑上不要刻名字。{staff}讀過他的書，坐到床邊，說起他的幾首頌詩：以後會有人一遍遍地讀、一句句地背，羅馬這間屋子也會一直為他留著。濟慈聽著，沒有說話，手指在被單上停了很久。窗縫裡傳進廣場上泉水的聲音，床頭那本書裡夾著一朵壓乾的紫羅蘭。
