        p3: 漁夫站在礁石上，指著岸拐彎的地方，伊能忠敬在那裡停下來，多測了一次方位。回程的頭一夜，他把多出來的那張圖攤在膝上，用指頭沿著那截海岸慢慢描了一遍。
        p2: 伊能忠敬把繩量的數寫在步數旁邊，在兩行數字之間畫了一道短線。挑夫把那卷繩繞回胳膊上，一個個結從他的指縫裡滑了過去。
        p1: 到西別那天，挑夫數完最後一段步子，嗓子已經啞了。伊能忠敬把測杖插進沙裡，在計數單的最末一行寫下了西別兩個字。
    relic: 一根測杖
    relic_desc: 一根量步距用的細杖，上面刻著尺度。
    points:
      p1: 盤纏見底的時候，護住測量隊的行程，讓測繩按期鋪到西別
      p2: 幫他把一段海岸從步測換成用繩量，讓那一段的數先準起來
      p3: 幫他把測繩從西別再往前鋪一段，讓這一趟多測一截沒測到的海岸
    points_fail:
      p1: 隊伍在西別之前就撐不下去回了頭，回到江戶也畫不出那一路的圖。
      p2: 這條分支裡，蝦夷地的每一段仍只是步數。
      p3: 測量照舊在西別回頭，這條分支與歷史一樣。
    shift:
      p1:
        was: 1800 年，伊能忠敬的測量隊沿蝦夷地東南海岸一路測到西別，再折返江戶。
      p2:
        was: 1800 年的第一次測量全靠步測，到第二次測量才用上測繩。
        now: 蝦夷地有一段海岸先用上了繩。
      p3:
        was: 1800 年的第一次測量到西別為止，北海道其餘的海岸要等以後的測量補上。
        now: 測繩越過西別又往前鋪了一段，回到江戶的那幾張圖上多了一截海岸。
    vignettes:
      bend: 一處海灣眼看要被畫進一條直線裡，{staff}請他們在拐彎處再測一次方位，那個彎就留在了紙上。
      repeat: '{staff}用同樣的步子把一段路又走了一遍，兩次的步數並排記著，沒去挑哪一個。'
      sketch: 眾人歇腳時，{staff}在計數單背面畫了一個岬角的輪廓，海風掀起紙角，就拿一塊石子壓住，標出測繩鋪在哪裡。
  hargrave_stanwell_park:
    name: 第四隻風箏
    place: 澳大利亞斯坦威爾公園
    figure: 勞倫斯·哈格雷夫
    story: 勞倫斯·哈格雷夫 1893 年開始試驗箱形風箏。1894 年 11 月 12 日，在斯坦威爾公園的海灘上，四隻串在一起的箱形風箏把他拉離沙地，升到約 16 英尺高。新南威爾士州立圖書館藏的照片裡有哈格雷夫、詹姆斯·斯韋恩和試驗器材。1915 年 7 月 6 日他在悉尼去世。
    story_prose:
      opening:
        - 1894 年 11 月，斯坦威爾公園。勞倫斯·哈格雷夫已試驗箱形風箏一年多。十二日，海灘上排了四隻，打算用一根繩串起來。
        - 史實裡，四隻風箏把他拉到離地近十六英尺。哈格雷夫後來送去慕尼黑的模型大多毀於戰事。在這條分支裡，海灘的幫手手上有籤條，也有地方攤開一份圖。
        - 這一趟用得上懂風向、能穩住長繩的人，也用得上能核對尺寸、把四套做法畫清楚的人。
      points:
        p1: 陣風扯偏了外側的風箏。{staff}看著繩的走向同幫手往側面挪，等四隻又拉成一線，再陪著落地的人穩住牽繩。座椅的腳碰到沙，留了兩個挨得很近的印。海灘上的人還拉著繩，直到第一隻風箏落低。
        p2: '{staff}按骨架逐一核尺寸和籤條，把四隻風箏怎樣做、怎樣串在一起畫成一份，留給當地保管。四張圖在風裡翻到最後一張。哈格雷夫把一截繩橫放在圖上，壓住拴點旁的紙角。'
      outcomes:
        all: 離地的高度寫進了記錄，另一份做法圖留在澳洲。後來有人攤開那一疊圖，四隻之間的線還連著。
        p2: 許多年後，斯坦威爾公園仍有一份圖可查。翻到最後一張，還看得見那根線在哪裡打結。
        p1: 那次離地的高度寫了下來。翻到存著照片的地方，沙灘上的四隻風箏還在一條線上。
      none: 風繼續從海上過來。沙丘邊的繩盤一截一截鬆了下去。
      not_admitted: '{staff}沒能加入海灘上的人。遠處有人把一根繩拉直，話音到沙丘邊就散了。'
      desync: 座椅落在沙地上，繩卻鬆了。{staff}被召回時，還有一張籤條在骨架邊響。
      excerpts:
        p2: 四張圖在風裡翻到最後一張。哈格雷夫把一截繩橫放在圖上，壓住拴點旁的紙角。
        p1: 座椅的腳碰到沙，留了兩個挨得很近的印。海灘上的人還拉著繩，直到第一隻風箏落低。
    relic: 一片箱形風箏的備用簽
    relic_desc: 一片給箱形風箏骨架用的備用簽。
    points:
      p1: 11 月 12 日，在陣風裡護住那串風箏，讓他升起來，再平安落回沙地
      p2: 幫他完成這四隻風箏的尺寸和做法圖，在澳洲留下一份
    points_fail:
      p1: 一陣風把風箏串扯偏了，座椅砸回沙地，這條分支裡沒有那次離地 16 英尺。
      p2: 這四隻風箏照史實只留在他自己手裡，這條分支裡斯坦威爾公園沒有另一份。
    shift:
      p1:
        was: 1894 年 11 月 12 日，斯坦威爾公園的海灘上，四隻串起來的箱形風箏把哈格雷夫拉離沙地，升到將近 16 英尺。
      p2:
        was: 1894 年，這四隻風箏的做法只在哈格雷夫自己手裡；他晚年把模型送去慕尼黑，大多毀於二戰。
        now: 那四隻風箏的圖紙在斯坦威爾公園留了一份，沒有跟著別的模型去慕尼黑。
        who: hargrave_stanwell_park
        bio: 哈格雷夫 1894 年那四隻箱形風箏的尺寸和做法圖在斯坦威爾公園留了一份。他的模型後來大多毀於二戰，這四隻怎樣做的，在澳洲仍查得到。
    vignettes:
      four: 升空以後，{staff}沿著沙上的風箏數到四。鉛筆畫了一個長括號，把四個數圈在一處。
      tag: 籤條從骨架上脫開了。{staff}沿著濕沙找回它，抖掉紙背的水，把繩結又繫緊一點。
      lift: 先放一隻試風時，{staff}跟幫手站在沙丘上。繩一斜，前面那個人先往側邊跑了兩步。
  sun_yat_sen_guangzhou:
    name: 從銅像到一所新大學
    place: 廣州
    figure: 孫中山
    story: 你站在中山大學的孫中山像前，被帶回 1924 年 2 月 4 日的廣州，這一天他下令把三所學校合併為國立廣東大學，派鄒魯籌備。同一段日子裡，他星期天在高等師範的禮堂演講，講稿在幾個人手裡來回走，後來成了一本書。9 月 19 日開學，11 月 11 日舉行成立典禮，用的是他寫的校訓。1925 年 3 月 12 日他在北京去世，1926 年這所大學以他的名字命名。
    relic: 孫中山銅像
    relic_desc: 中山大學校園裡的孫中山銅像。它是通往 1924 年廣州的穿越媒介，不是古董，不能出售。
    points:
      p1: 替籌備處排好城外的招生告示張貼路線，交給送告示的人
      p2: 經人引薦走訪三所學校，趕在第一次籌備會議前交回一張彙總單
      p3: 替籌備處踏勘備選校址，在石牌定下來之前交回一張比較圖
      p4: 核對三校的畢業名單，為 6 月 21 日的典禮交上一份統一名冊
      p5: 跟籌備處的人去石牌，把新校地的界樁一根根立穩
    points_fail:
      p1: 這條分支裡，招生告示只貼在城裡，城外的學生知道消息時，報名已經開始了。
      p2: 第一次籌備會議照史實召開，三所學校的難處仍是各說各的，沒有一張合在一起的單子。
      p3: 選址照史實定在石牌，籌備處桌上沒有一張把幾處校址畫在一起的圖。
      p4: 6 月 21 日的畢業典禮照常舉行，籌備處仍要分開查閱三份名單。
      p5: 石牌的校地照史實只劃在紙上，地上一根界樁也沒有立。
    shift:
      p1:
        was: 1924 年 6 月 9 日，國立廣東大學委託各省教育廳招生；6 月 10 日，預科考試開始報名，原計劃招 520 人。
        now: 這條分支裡，城外的路口和碼頭上也貼著招生告示。
      p2:
        was: 1924 年 3 月 3 日，第一次籌備會議召開，議題裡頭一件是三所學校學生的畢業問題。
        now: 這條分支裡，會上擺著一張把三所學校的難處列在一起的單子。
      p3:
        was: 1924 年，各校分散各處，管理不便，孫中山命鄒魯擇石牌為新校址，當年劃定土地。
        now: 這條分支裡，選址的文書旁邊多了一張把幾處校址和石牌畫在一起的圖。
      p4:
        was: 1924 年 6 月 21 日，鄒魯就任國立廣東大學校長，同一天為原三所學校的畢業生舉行畢業典禮。
        now: 這條分支裡，籌備處辦典禮時有了一份核對過的統一名冊。
      p5:
        was: 1924 年孫中山命鄒魯擇石牌為新校址，可新校舍 1933 年才動工，1934 年秋第一批學院才遷入。孫中山 1925 年 3 月 12 日去世，生前沒有見到。
        now: 這條分支裡，11 月他離開廣州之前，石牌校地的界已經一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 這條時間線裡，孫中山離開廣州之前，新校址石牌的界已經立定。
    shift_all: 五件差事都辦妥了。回來再讀孫中山後來親筆題寫的校訓，才看出這五件事與「博學、審問、慎思、明辨、篤行」的呼應。
    vignettes:
      slips: 一位編出來的辦事員正要抄一頁稿子，稿上有一張籤條蓋住了兩行。你問他籤條是誰的字，稿子又是誰的字。他先抄了稿子，籤條留在原處沒有動。
      back_row: 一位編出來的學生找不到座位，老是站起來張望。你往裡挪了挪。他坐下來聽完了後半場，一句話沒說，散場時朝你點了點頭。
      hundred: 你在本子最後一頁畫正字，一天一筆。畫滿一百天的時候，一位編出來的辦事員問你在數什麼。你說，日子。
  boole_ballintemple:
    name: 濕衣服與一堂課
    place: 科克巴林滕普爾
    figure: 喬治·布爾
    story: 科克在下雨，喬治·布爾還有一堂課要上。一名學生拿著《思維規律研究》裡的習題，還沒想通第二遍該怎麼選。城的另一頭，布爾還沒寫完的微分方程書裡，一張表以後得重算，只因為公式裡的一個符號。
    story_prose:
      opening:
        - 1864 年 11 月，愛爾蘭科克。喬治·布爾是女王學院的第一位數學教授。十年前，他在《思維規律研究》裡用代數寫下推理的規律，其中一條說，照同一個條件選兩遍，選出來的東西不變。這時他手上還有一部沒寫完的微分方程書。
        - 史實裡，11 月 24 日他冒著大雨從家裡趕到學院上課。12 月 8 日，他因胸膜肺炎在巴林滕普爾的家中去世。第二年，托德亨特整理出補編，序裡寫明書末那張表因為公式的一個符號寫錯，由塞普頓重算過。在這條分支裡，有個學生攥著編號紙條，還在想照同一個條件選第二遍，會少掉哪一張。
        - 這一趟用得上三種人：守時、肯冒雨把講義送到的人，核得了公式、找得出錯處的人，懂護理、接得住一班夜裡照護的人。
      outcomes:
        all: 十二月的那幾夜，布爾家的燈整夜亮著，守夜的人換了一班又一班。那張紙籤，第二年還夾在原處。
        p3: 那幾夜，布爾家的燈整夜亮著，守夜的人換了一班又一班。
        p2: 第二年，編輯打開文件夾，那張紙籤還夾在原處。塞普頓從那個符號算起。
        p1: 11 月 24 日那堂課，講臺上的講義一頁也沒有濕。
      none: 雨一直下到十二月。巴林滕普爾那棟房子裡，守在床邊的人一夜沒合眼。
      desync: 那天的雨把講義泡成了一團，講臺上空著。{staff}沒等到下一堂課，就被事務所召了回來。
      not_admitted: '{staff}沒能進學院的門。雨還在下，講義還攤在布爾家裡的桌上。'
      points:
        p1: 11 月 24 日，雨下得很大。布爾出門之前，{staff}把講義用油布包了兩層，揣在懷裡先一步趕到學院，放進講臺的抽屜。布爾進門時外衣在滴水，他拉開抽屜，講義是乾的。他把它攤開，用袖口擦了擦手，開始講。
        p2: '{staff}把那張表和推出它的公式攤在一起，一行一行往回算。算到一處，數對不上，順著往上查，是公式裡一個符號寫反了。{staff}沒有改原稿，只在那一頁夾了一張紙籤，寫明哪一行、哪個符號。'
        p3: 十二月初，布爾病倒在家裡，家人輪流守著，好幾夜沒合眼。{staff}照護理的規矩接下晚上那一班，按時替他翻身、餵水、掖好毯子，把夜裡的情形一條條記在紙上。家人留著燈，先去睡了幾個鐘頭。天亮前回來時，爐火還旺著，床頭的紙上記滿了一夜的鐘點。
      excerpts:
        p3: 家人留著燈，先去睡了幾個鐘頭。天亮前回來時，爐火還旺著，床頭的紙上記滿了一夜的鐘點。
        p2: 算到一處，數對不上，順著往上查，是公式裡一個符號寫反了。{staff}沒有改原稿，只在那一頁夾了一張紙籤，寫明哪一行、哪個符號。
        p1: 布爾進門時外衣在滴水，他拉開抽屜，講義是乾的。他把它攤開，用袖口擦了擦手，開始講。
    relic: 一頁邏輯演算
    relic_desc: 一張課堂習題紙，演示照同一條件篩選兩次會得到什麼。
    points:
      p1: 大雨中從家出門前，把要用的講義乾乾地送到學院，護住布爾當天的課
      p2: 拿公式和算出來的表格對照，把可能有問題的符號標出來，留給下一位核稿的人
      p3: 找人來接一班晚間照護，讓守在布爾床邊的家人歇一會兒
    points_fail:
      p1: 講義淋濕且沒人有備份，當天課沒能開講，事務所因同步失敗召回員工。
      p2: 表格裝進文件夾，公式還沒核過。以後還得塞普頓自己查出錯處。
      p3: 晚上沒人替班。守在床邊的人只有放下燈的時候才離開一小會兒。
    shift:
      p1:
        was: 科克學院檔案記布爾在 1864 年 11 月 24 日的大雨裡從家趕去教學。
      p2:
        was: 布爾於 1864 年 12 月去世，托德亨特後來整理了補編。編者序記有一張表因稿內符號寫錯而需重新算過。
        now: 編輯一打開文件夾，就能順著紙籤翻到公式。塞普頓可以從那個符號開始核算。
      p3:
        was: 1864 年 12 月 8 日，布爾因胸膜肺炎在巴林滕普爾的家中去世。
        now: '{staff}找到人來坐一班。家人留著燈，先睡了幾個鐘頭，再回來接替。'
    vignettes:
      repeat: 窗外下著雨。{staff}請學生挑出偶數，再拿著手裡的紙條挑一遍。學生想找一張放回桌上，手裡卻一張都不用放。
      border: 油燈底下，學生要抄一排數字，{staff}問第一個是怎麼算來的。他先用筆尖劃了一道線連回公式，再往下抄。
      example: 學生把做完的習題壓在書下，書脊磨得發白。頁邊露出一小截紙籤，剛好夠手指捏住。
  puccini_brussels:
    name: 沒寫完的二重唱
    place: 布魯塞爾
    figure: 賈科莫·普契尼
    story: 1924 年 11 月，普契尼到布魯塞爾治病，《圖蘭朵》的結尾還沒寫完。有一頁稿，樂句寫到一半停住了。另一頁上列著幾樣樂器。後來，弗蘭科·阿爾法諾要從這些零散的音符裡接出一段樂團能演奏的音樂。
    story_prose:
      opening:
        - 1924 年 11 月，普契尼到布魯塞爾治病。《圖蘭朵》寫到末場，二重唱的結尾還留在幾張散頁上。有的寫了幾小節，有的只記著樂器。
        - 史實裡，他當月在布魯塞爾去世。後來，阿爾法諾要從留下的草稿裡接出樂團能演奏的音樂。在這條分支裡，抄譜人把兩行相近的譜攤在一張桌上，等人把它們讀給作曲家聽。
        - 這一趟用得上讀得懂總譜、認得出兩個接法的人，也用得上會照護病人、能在床邊守一夜的人。
      points:
        p1: '{staff}順著低聲部把兩種接法對讀到轉調處，照次序把兩頁攤給普契尼。普契尼在其中一行邊上作了記號。鉛筆抬起來時，那一小節的末尾還留著空白。'
        p2: 最後一夜，{staff}靠著照護的經驗替普契尼墊好枕頭，守在伸手可及的地方。譜合在床邊，書脊朝外。他的手伸過來，在挨著床沿的椅背上停住了。
      outcomes:
        all: 後來，接手的人可以從譜上的鉛筆印起筆。那夜的病房裡，譜已合上，床邊的椅子還挨著床沿。
        p2: 那一夜他有片刻睡穩了。椅子一直挨著床沿，伸手就摸得到。
        p1: 接手的人把散頁攤開。翻到轉調的一小節，一道鉛筆印正落在要下筆的地方。
      none: 床邊的椅子空著。桌上的兩張紙一角相疊，壓在上頭的是哪張，得走近才看得出。
      not_admitted: '{staff}沒能在診所幫上忙。走廊盡頭的門下露出一道燈光。'
      excerpts:
        p2: 譜合在床邊，書脊朝外。他的手伸過來，在挨著床沿的椅背上停住了。
        p1: 普契尼在其中一行邊上作了記號。鉛筆抬起來時，那一小節的末尾還留著空白。
    relic: 二重唱草稿
    relic_desc: 一張五線譜紙，沒寫完的樂句旁留著鉛筆字。
    points:
      p1: 趁普契尼還能審稿，幫他從末場二重唱的兩份草稿裡標出自己想留的一種寫法
      p2: 用照護經驗減輕普契尼在最後一夜的病痛
    points_fail:
      p1: 兩張草稿照舊分開擱著。接手的人還得自己猜他想用哪一種。
      p2: 這一夜過去，床邊的椅子還是空的，病痛也沒能緩下來。
    shift:
      p1:
        was: 1924 年 11 月，末場二重唱仍是散頁，阿爾法諾後來要從留下的草稿裡找出接法。
        now: 普契尼在二重唱轉調的地方標下自己想留的一種寫法。接手的人從他標的這一處起筆。
      p2:
        was: 1924 年 11 月 24 日，普契尼在布魯塞爾接受喉癌治療，29 日在同一家診所去世。
        now: '{staff}留在床邊幫普契尼緩一緩。這一夜沒有他想的那麼疼，想叫人的時候，手也夠得著床邊。'
        who: puccini_brussels
        bio: 普契尼在布魯塞爾度過了稍安穩的一夜。他把譜放下時，床邊有人陪著。
    vignettes:
      divider: 抄譜人把兩行鉛筆譜並排攤開。{staff}順著低聲部劃過去，一行兜回原處，另一行給後頭留著地方。{staff}把兩張都留在桌上，等普契尼來看。
      future: '{staff}的手指差點敲出在劇院聽過的結尾。抄譜人抬起頭。{staff}往回翻，指在兩人都認得的最後一小節上。'
      pin: 抄譜人騰出桌角放杯子，{staff}把稿紙往裡挪了挪。頁腳的五線譜空了大半，下面擠著兩個鉛筆字。
  schumann_endenich:
    name: 換了調的曲子
    place: 恩德尼希
    figure: 羅伯特·舒曼
    story: 羅伯特·舒曼住在恩德尼希的那幾年，留下過一份鋼琴小曲的抄本，比出版的譜低了一個全音。1856 年 7 月，克拉拉·舒曼來波恩請求探視。客店裡的莉娜把那首小曲抄了兩份，懷疑起音低的那份抄錯了。
    story_prose:
      opening:
        - 1856 年 7 月，波恩近郊的恩德尼希。羅伯特·舒曼住在這裡養病，曾親手把《蝴蝶》裡的一首小曲移低一個全音。這個月，克拉拉·舒曼來請求探視。
        - 史實裡，克拉拉 7 月 27 日見到了他，29 日再來時已遲了一步。在這條分支裡，客店的莉娜抄了兩份起音不同的譜，埃米爾知道巷子裡有兩扇門。
        - 這一趟用得上能從兩份譜上認出同一首曲子的人。認得路、守得住約定時辰、能在附近等消息的人也有用處。
      points:
        p1: '{staff}沿著兩份譜各讀一遍，標出起音雖移低，音和音之間的距離仍一樣。莉娜在兩個頁首都寫上調名。她把兩張標著不同起音的紙並排夾好，露出上頭的一線白邊。'
        p2: 七月二十七日，{staff}按約先接到克拉拉，穿過巷子找到探視的那扇門。門開時，克拉拉先把手裡摺著的紙收了起來。門外還斜著一線傍晚的光。
        p3: 二十九日，{staff}守在附近等到消息，在克拉拉回來的路上接到她，直接領到床邊。她坐下，把手伸進被沿。羅伯特的手搭在她掌心，一動也沒有挪開。
      outcomes:
        all: 兩份曲譜後來仍放在一個譜夾裡，頁首各有調名。二十九日，克拉拉趕到了床邊。巷子裡的門還敞著，屋裡兩隻手握在一起。
        p3: 二十九日，克拉拉趕到了床邊。後來她起身時，椅子還緊貼著床沿。
        p2: 二十七日的探視仍在傍晚。巷子裡光線暗了，那扇門才慢慢合上。
        p1: 兩份練習譜後來還在一個譜夾裡。再翻開來，兩張紙的頁首各有一個調名。
      none: 譜夾合上，較低的那份練習譜被抽在外頭。一根細紙條從夾口探出半寸。
      not_admitted: '{staff}沒能在巷子裡找到接應的人。隔著街看過去，兩扇門都關著。'
      desync: 克拉拉在另一扇門前等過了時辰。{staff}被召回時，摺好的紙條還留在外衣口袋裡。
      excerpts:
        p3: 她坐下，把手伸進被沿。羅伯特的手搭在她掌心，一動也沒有挪開。
        p2: 門開時，克拉拉先把手裡摺著的紙收了起來。門外還斜著一線傍晚的光。
        p1: 莉娜在兩個頁首都寫上調名。她把兩張標著不同起音的紙並排夾好，露出上頭的一線白邊。
    relic: 兩個調的練習譜
    relic_desc: 兩張虛構的練習譜，頁首各寫了一個調名。
    points:
      p1: 對照兩份譜，寫明為什麼起音低了一個全音的那份也該留在譜夾裡
      p2: 7 月 27 日在約定的時間前接到克拉拉，領她走對門，讓探視如期發生
      p3: 7 月 29 日留在附近等消息，趕在羅伯特去世前把克拉拉帶回床邊
    points_fail:
      p1: 莉娜把起音較低的那份譜抽了出來。下一個翻開譜夾的人，只會看到原來出版的調。
      p2: 克拉拉在另一扇門前等過了探視時段。這次探視偏離原時間線，事務所召回員工。
      p3: 克拉拉回到恩德尼希時，羅伯特已經去世。
    shift:
      p1:
        was: 舒曼在恩德尼希期間親筆抄寫的《蝴蝶》第十首，把曲子從 C 大調移到了降 B 大調。
        now: 莉娜把兩份練習譜留在同一個譜夾裡，頁首各寫上調名。下一個彈它的人知道，兩個起音都沒抄錯。
      p2:
        was: 7 月 23 日，布拉姆斯和里夏茨醫生勸克拉拉再等一等。她在 27 日傍晚六到七點之間見到了羅伯特。
      p3:
        was: 7 月 29 日，克拉拉和布拉姆斯、約阿希姆到恩德尼希時，羅伯特已經去世。
        now: '{staff}在克拉拉回來的路上接到她，直接帶她去了病房。羅伯特走之前，她握到了他的手。'
        who: schumann_endenich
        bio: 1856 年 7 月 29 日，羅伯特在恩德尼希去世時，克拉拉就在身旁。
    vignettes:
      key: 莉娜把兩張紙各彈了一遍。第二小節還沒完，她就抬頭看{staff}，手在另一個位置，她卻已經知道接下來是哪幾個音。
      envelope: 埃米爾答應替克拉拉遞摺好的紙條，問{staff}該敲哪扇門。兩人走到巷子對面，並肩站在那裡，剛好看得見兩扇門。
      gift: 真正的手稿後來會到舒曼的女兒瑪麗手裡。眼下，莉娜用兩根紙條標出練習譜的開頭。{staff}掀琴蓋時，其中一根已滑到另一根背後。
  nietzsche_turin:
    name: 紙背上的收件人
    place: 都靈
    figure: 弗里德里希·尼采
    story: 都靈寄來一封信，收信的是弗蘭茨和伊達·奧弗貝克，尼采簽的是狄俄尼索斯。弗蘭茨趕到朋友的住處，見他在讀自己改過的《尼采反對瓦格納》校樣。離開都靈前，得有人看看箱裡除了校樣，還該放些什麼。
    story_prose:
      opening:
        - 1889 年 1 月，都靈。一封信寄給弗蘭茨和伊達·奧弗貝克，署名和收件人各佔一處。弗蘭茨趕到都靈時，尼采正在看《尼采反對瓦格納》的最後一份校樣。
        - 史實裡，奧弗貝克在 1 月 8 日找到了朋友，後來寫下他當時在看的是什麼。在這條分支裡，彼得羅在樓梯口備下行李籤，露琪亞手邊還有一包沒有裹好的信。
        - 這一趟用得上耐心核對門牌、能把人領到住處的人。熟悉校樣與私人信件各該怎樣登記和保管的人，也有事可做。
      points:
        p1: 一月八日，{staff}把信上的地址與門牌核過，又在樓梯口等到奧弗貝克，領他走完最後一段。弗蘭茨在對的門前停下來，抬手敲了一下。屋裡翻過一頁紙，門把手慢慢轉了半圈。
        p2: '{staff}照校樣和私信各自的去向分開登記，把書名留在一張紙籤上，另一張只記誰來收。兩包紙各用一根繩紮住。露琪亞把寫有收件人的紙籤轉到裡邊，用指腹壓住翹起來的一角。'
      outcomes:
        all: 一月八日，奧弗貝克找到了尼采。後來，兩包紙一起上路。他只打開標有書名的一包，另一包的繩結還朝著箱蓋。
        p2: 紙到了接手的人那裡，分成兩包。認出書名以後，奧弗貝克把另一包原樣放回箱底。
        p1: 一月八日，奧弗貝克進了朋友的屋子。門在他身後合上時，裡面還響著一聲輕輕的翻紙聲。
      none: 紙張疊著包好，校樣與信上都露出人名。包它的人抽了抽繩頭，找不準該繫在哪一面。
      not_admitted: '{staff}沒能在住處找到可以接應的人。樓梯扶手上還擱著一張空白的行李籤。'
      desync: 另一扇門沒有人應。{staff}被召回時，奧弗貝克還站在那一層的樓梯平臺上。
      excerpts:
        p2: 兩包紙各用一根繩紮住。露琪亞把寫有收件人的紙籤轉到裡邊，用指腹壓住翹起來的一角。
        p1: 弗蘭茨在對的門前停下來，抬手敲了一下。屋裡翻過一頁紙，門把手慢慢轉了半圈。
    relic: 一張留底的行李籤
    relic_desc: 遊戲時間線裡留下的一張行李籤副本，收件人寫在紙背上。
    points:
      p1: 核准住處地址，1 月 8 日把奧弗貝克領到對的門前
      p2: 把改過的校樣和私人信件分開登記，確保要交其中一包時不用拆另一包
    points_fail:
