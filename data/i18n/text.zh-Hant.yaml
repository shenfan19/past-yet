catalog:
  socrates_athens:
    name: 船回來之前
    place: 雅典
    figure: 蘇格拉底
    story: 前 399 年，蘇格拉底在雅典受審，被判死刑。雅典每年派往提洛島的船剛剛出發，船回港以前城裡不處決人，他在獄中等了約三十天。這些日子裡他把伊索寓言改寫成詩，朋友們天天來看他。最後那天朋友們都在，只有柏拉圖病了沒來，傍晚他飲下了毒芹汁。
    story_prose:
      opening:
        - 前 399 年，雅典。蘇格拉底被控不敬神、敗壞青年，要在陪審法庭受審。他一輩子在街頭和集市上同人問答，自己沒寫下一本書，後人只能從柏拉圖和色諾芬筆下認識他。
        - 史實裡，派往提洛島的船審判前一天剛剛出發，船回港以前城裡不行刑，他在獄中又等了約三十天。這些日子他照一個反覆做的夢的吩咐，把伊索寓言改寫成詩，那些詩沒有傳下來；最後那天朋友們都到了，柏拉圖病著，沒有來。在這條分支裡，獄牆外有個賣燈油的女人，比雷埃夫斯港有個賣魚的人，進港的船他都看得見。
        - 這一趟用得上三種人：滿場喧嘩時穩得住人心的人，記得下詩句、抄得出一卷詩的人，懂醫藥、治得好一場病的人。
      outcomes:
        all: 提洛島的船回來了，賣魚的人遠遠就看見了船帆。最後那天傍晚，獄裡坐滿了朋友，柏拉圖也坐在裡面。那卷詩後來壓在雅典一戶人家的箱底，一直留了下來。
        p3: 最後那天傍晚，獄裡坐滿了朋友，柏拉圖也坐在裡面，一直待到最後。
        p2: 那卷詩後來壓在雅典一戶人家的箱底，一直留了下來，紙邊磨得起了毛。
        p1: 三十天後，提洛島的船進了比雷埃夫斯港，賣魚的人遠遠就看見了船帆。那天，朋友們天一亮就等在獄門口。
      none: 提洛島的船回來了，賣魚的人遠遠就看見了船帆。傍晚，獄裡的朋友圍坐成一圈，誰也沒有先開口。
      desync: 庭上的哄鬧一陣高過一陣，申辯斷在了半句上。{staff}還沒走出法庭，就被事務所召了回來。
      not_admitted: '{staff}在雅典沒能落下腳，連獄牆外那塊歇腳的地方也沒有。提洛島的船還在海上。'
      points:
        p1: 開庭那天，陪審員坐滿了一排排木凳。他每講幾句，底下就哄起來一陣，蓋過了他的聲音。{staff}坐在旁聽的人裡，喧嘩一起就站起身，不喊，只朝四周慢慢壓了壓手，一排一排看過去，等聲音落了才坐下。蘇格拉底從剛才斷開的那半句接著往下講。講完，他把外袍的下襬攏了攏，在臺上站定。
        p2: 獄裡只有高處一扇小窗透光。蘇格拉底唸一句，{staff}在蠟板上記一句，再照著節拍唸回給他聽，哪一處多出一拍，就抹平了重寫。伊索的寓言一則則成了詩，最後是那首獻給阿波羅的頌歌。夜裡，{staff}在牆根下就著燈油，把蠟板上的字謄進一卷莎草紙。第二天一早，一位來探視的朋友把紙卷貼身揣好，走出獄門時，手一直按在胸口那一塊。
        p3:
          class_medical: 最後那天的前一晚，柏拉圖還病著，躺在家裡起不了身。{staff}照醫生的規矩替他看了病，配好藥，按時餵下，守在床邊一夜沒有離開。天還沒亮透，他自己坐起來，摸黑繫好了鞋帶。他披上外衣，跟著往獄裡趕的朋友出了門，走得比他們還快。
          else: 最後那天的前一晚，柏拉圖還病著，躺在家裡起不了身。{staff}打開隨身的納米醫療箱，照說明替他用了藥，守在床邊一夜沒有離開。天還沒亮透，他自己坐起來，摸黑繫好了鞋帶。他披上外衣，跟著往獄裡趕的朋友出了門，走得比他們還快。
