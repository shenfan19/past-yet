  lovelace_london:
    name: 第一段程序
    place: 倫敦
    figure: 阿達·洛芙萊斯
    story: 1842 年，意大利工程師路易吉·梅納布雷亞用法文發表了一篇介紹查爾斯·巴貝奇分析機的文章。阿達·洛芙萊斯把它譯成英文，又加了七條注釋，篇幅約有原文的三倍；最後的注 G 寫出了這臺機器怎樣算伯努利數。1843 年 8 月，巴貝奇想在文中附上他對政府的不滿，編輯不肯不署名刊出，他便要她撤稿。她拒絕了，署名 A.A.L. 的譯文與注釋當年刊在《泰勒科學回憶錄》上。8 月 14 日，她提出由自己張羅造機器的事務，請巴貝奇專管工程，巴貝奇拒絕了她的條件。
    story_prose:
      opening:
        - 1843 年夏，倫敦。阿達·洛芙萊斯把意大利工程師梅納布雷亞介紹巴貝奇分析機的法文文章譯成英文，又加了七條註釋，篇幅約有原文的三倍。最後一條注 G，一步一步寫出這臺還停在紙上的機器怎樣算伯努利數。
        - 史實裡，巴貝奇想在文中附上他對政府的不滿，編輯不肯不署名刊出，他便要她撤稿；8 月 6 日，她寫信告訴他，不撤，這件事已經拿定。8 月 14 日，她提出由自己張羅造機器的事務，請巴貝奇專管工程，巴貝奇在信邊批了一句，所有條件都拒絕。第二天她寫信告訴母親，印坊又召她去盯最後一輪，數學公式校得十分費力。在這條分支裡，印坊裡有個嫌西格瑪不夠用的排字工，斯皮塔佛德有個守著提花機的織工。
        - 這一趟用得上幾種人：懂翻譯與文書、守得住一捆稿子的人；校得了樣、一格一格對得了表的人；說話有分寸、談得攏分工的人。
      outcomes:
        all: 那期《泰勒科學回憶錄》印出來了，注 G 的表一格也沒有串行，末尾署著 A.A.L. 三個字母。九月裡，一位來客坐在多塞特街的屋裡，面前攤著設計圖、費用草案和那頁分工的短約。
        p3: 九月裡，一位來客在多塞特街看了設計圖和費用草案，帶走了那頁分工的短約，說等工程評估過後再談錢。
        p2: 印出來的注 G，那張表一格也沒有串行。她核過的那份樣表留在印坊的櫃子裡，邊上的紅點還在。
        p1: 那期《泰勒科學回憶錄》照常印出，譯文和七條註釋排在一起，末尾署著 A.A.L. 三個字母。
      none: 八月下旬，那期《泰勒科學回憶錄》印出來了。斯皮塔佛德的織坊裡，穿孔紙板還在一張接一張地翻。
      desync: 印坊同時接到了接著印和暫緩的兩種話，譯稿與註釋從本期撤了下來。{staff}被事務所召回時，排字工正把注 G 那幾版拆開，鉛字一把一把倒回字盤。
      not_admitted: '{staff}沒能進聖詹姆斯廣場那座宅子，只在斯皮塔佛德的織坊門口看了幾天提花機。紙板一張張翻過去，絲面上的花越織越長。'
