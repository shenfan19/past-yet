      p2: 傷口照史實潰了，他在小屋裡拄著拐坐了一個多月，這條分支裡多雷林子裡那些蟲子還是只有僕人替他去捉。
      p3: 6 月 26 日朱馬特照史實病逝，這條分支裡七月離開多雷的船上少了他。
