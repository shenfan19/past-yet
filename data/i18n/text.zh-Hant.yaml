      p3:
        was: 1926 年 6 月 7 日，高迪在大道上被電車撞倒，沒帶證件，衣著破舊，被當成乞丐；6 月 10 日他在醫院去世，年七十三歲。
        now: '{staff}一分鐘內跪到他身邊，說出他是誰，直接把他送到外科醫生手裡。高迪活了下來，又回工地上的工房幹了幾年。'
        who: gaudi_barcelona
        bio: 高迪挺過了 1926 年 6 月的電車事故。他回到工地上的工房，和蘇格拉涅斯一起又主持了幾年工程。
    vignettes:
      tram: 5 月 29 日，{staff}站在電車後平臺上，從大道這頭坐到那頭，車廂裡一股曬熱的鐵味。售票員說這份差事最難的不是收錢，是那些邊看報邊過馬路的人。他每到一個路口就拉一下鈴，像在數落整條街。
      stone: 6 月 1 日，{staff}幫工地上兩個石匠把一塊雕好的石頭放到灰漿上，三個人身上都落滿了石粉。起風時，風從頭頂塔身的孔洞裡穿過去，吹出哨音。年輕的那個石匠發誓每天下午都是同一個音，他已經開始跟著哼了。
      water: 7 月 10 日，入夏最熱的一天，{staff}替中午來工地的賣水女人提水罐，堆在地上的石料曬得燙手。她說石匠們不到收工鈴響就喝掉一整桶，喝完還嫌水裡有灰味。她說那是當然，灰就是從他們身上掉進去的。
  kafka_kierling:
    name: 療養院裡的校樣
    place: 基爾靈
    figure: 弗朗茨·卡夫卡
    story: 1924 年 3 月，結核侵入弗朗茨·卡夫卡的喉頭，他咽東西越來越難。4 月 19 日，他和朵拉·迪亞曼特來到克洛斯特新堡附近基爾靈的霍夫曼療養院；醫生讓他少說話，他多半靠紙條交談。5 月 6 日前後，醫學生羅伯特·克洛普施托克趕來幫著照料。6 月 2 日，他還在校故事集《饑餓藝術家》的校樣。6 月 3 日中午前後，他去世，四十歲，11 日葬於布拉格。這本收了四篇小說的書，8 月底在柏林出版。
    story_prose:
      opening:
        - 1924 年 5 月，維也納北邊克洛斯特新堡附近的基爾靈，霍夫曼療養院。四十歲的弗朗茨·卡夫卡患結核，三月起病到了喉頭，咽東西越來越難。他住在一間帶陽臺、望得見花園的屋子裡，醫生讓他禁聲，他多半在小紙條上寫字說話。朵拉·迪亞曼特住在客房，給他做飯；5 月 6 日前後，醫學生羅伯特·克洛普施托克也趕來幫著照料。他手頭還在校自己編定的最後一本書，故事集《飢餓藝術家》的校樣。
        - 史實裡，吞嚥痛得他幾乎吃不下東西，醫生每隔八到十天給他的喉上神經打一針止痛；6 月 2 日他還在改校樣，給父母的最後一封信寫到一半沒了力氣，由朵拉替他寫完；6 月 3 日中午前後他去世，書到 8 月底才在柏林出版。在這條分支裡，療養院有個修丁香的園丁，有個跑腿送信的男孩，村裡麵包鋪有個麵包師的妻子。
        - 這一趟用得上幾種人：懂醫護、帶著止痛藥的人，或者當醫生、腦子快的人，替他把喉頭的痛減下來；管過檔案、做過校對、腦子快的人，或者有條理、守得住、意志硬的人，在病一次次打斷校稿時，替他記住改到了哪裡；懂護理的人，或者心善、耐心、有條理的人，把跑腿和通信排開，讓守著的人歇一口氣；管過檔案、做過校對、腦子快又沉得住氣的人，或者有條理、意志更硬的人，說得動柏林的出版人先裝訂一本寄來。
