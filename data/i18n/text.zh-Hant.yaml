        p1: '{staff}把信末的回信地址一個字母一個字母核過去，街名和門牌都對上了。契訶夫在信尾簽了名，把筆擱下，靠回椅背，望著窗外喘了一會兒。'
    relic: 一副夾鼻眼鏡
    relic_desc: 一副系著細繩的小圓眼鏡。
    points:
      p1: 契訶夫剛安頓下來時，把他寫給妹妹瑪麗婭的回信地址逐字核對，趁他還有力氣寫完，把信交出去
      p2: 用他 7 月 11 日列在信裡的問題請熟悉航線的人發一封短電報，讓他在巴登魏勒得到想問的返程消息
