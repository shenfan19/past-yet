  chekhov_badenweiler:
    name: 寄往弗里德里克別墅的回信
    place: 巴登魏勒
    figure: 安東·契訶夫
    story: 1904 年 6 月，四十四歲、肺結核已經很重的安東·契訶夫，和妻子奧爾加·克尼佩爾來到黑森林的療養地巴登魏勒。他們先住羅馬浴旅館，後住弗里德里克別墅，最後搬進郵局隔壁的索默旅館。他往家裡寫的信都很輕快，七月裡還託朋友打聽哪一班輪船能走海路送他們回俄國。7 月 15 日凌晨，他在那裡去世。
    story_prose:
      opening:
        - 1904 年 6 月，黑森林裡的療養地巴登魏勒。安東·契訶夫四十四歲，肺結核已經很重，在莫斯科瘦了一大圈，喘不上氣。他和妻子奧爾加·克尼佩爾從俄國一路坐車過來，先住進羅馬浴旅館，兩人都累壞了。
        - 史實裡，他們後來搬進弗里德里克別墅，又搬到郵局隔壁的索默旅館。他往家裡寫的信都很輕快，7 月 11 日還寫信打聽哪一班輪船能走海路送他們回俄國。7 月 15 日凌晨，他在那裡去世。在這條分支裡，別墅的女傭跟著太陽挪躺椅，郵局門口的郵差掂得出一封俄國信夠不夠郵票。
        - 這一趟用得上三種人：做事細、守得住信件和地址的人，耐得住性子、能把一串問題壓成一封短電報的人，懂醫、帶著納米藥箱來的人。
      outcomes:
        all: 那個夏天過去，契訶夫和奧爾加坐船回到了俄國。甲板上風很大，他把那身法蘭絨衣服的扣子一顆顆扣上了。
        p3: 夏天過後，契訶夫和奧爾加動身回俄國。站臺上，他穿著那身法蘭絨衣服。
        p2: 那張回電的薄紙，一直攤在寫字桌上，艙位那一行被手指摸得發了毛。
        p1: 瑪麗婭收到了那封信。信封背面是弗里德里克別墅的地址，一筆一畫，都對。
      none: 巴登魏勒的七月很熱。陽臺的躺椅跟著太陽挪了一天，傍晚又挪回原處。
      desync: '{staff}被召回時，寫字桌上已經空了。瑪麗婭還不知道哥哥住到了哪裡。'
      not_admitted: '{staff}沒能進那座別墅。花園裡的太陽一直照到晚上七點，樓上的人寫幾行信就要歇一歇。'
      points:
        p1: 6 月 25 日，搬進弗里德里克別墅的第三天，契訶夫坐在那張寫字桌前給瑪麗婭寫信，寫幾行就要歇一歇。{staff}把信末的回信地址一個字母一個字母核過去，街名和門牌都對上了。契訶夫在信尾簽了名，把筆擱下，靠回椅背，望著窗外喘了一會兒。
        p2: 7 月 11 日，屋裡熱得像蒸籠。契訶夫在信裡一條條問：船哪天幾點開，走幾天，能不能要一間兩個人的艙。{staff}把這幾個問題壓成一封短電報，發給熟悉這條航線的人。回電到的時候，開船的日子、路上的天數和艙位，都寫在一張薄紙上。奧爾加把紙唸給他聽，唸到艙位那一行，他讓她再唸一遍。
        p3:
          class_learned: '{staff}先照診病的老規矩聽了他的胸口，數過呼吸，才打開納米藥箱，按他的體重定下劑量，每天早晚各看一回。七月的酷暑裡，他咳得少了。十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。'
          else: '{staff}打開納米藥箱，照說明一格格配好藥，按鐘點守在床邊給藥、量體溫，夜裡每隔一陣就看一眼他的呼吸。七月的酷暑裡，他咳得少了。十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。'
      excerpts:
        p3: 十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。
        p2: 回電到的時候，開船的日子、路上的天數和艙位，都寫在一張薄紙上。奧爾加把紙唸給他聽，唸到艙位那一行，他讓她再唸一遍。
