      modest: '{staff}在廣州待了二百一十天，做了力所能及的事，又站在了銅像前。走的那天，離開學還有 {countdown:i} 天。'
    quotes:
      near_death:
        - text: 我以為還能再撐一會兒。
      stay_and_gifts:
        - trait: kind
          text: 我記得他們每個人的名字。我想再待一陣。
        - text: 這裡需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就這樣。
        - text: 七個月太長了。
      legend:
        - trait: curious
          text: 原來一本書是這樣一頁一頁改出來的。
        - text: 我走的時候，他們還沒有開學。
      perfect:
        - trait: kind
          text: 來問的人，後來都有人答了。
        - text: 該做的做了。
      modest:
        - trait: glib
          text: 我說兩年後這裡會改名，沒有人信。
        - text: 我只是在那裡待過。
    hints:
      low_luck: 走訪三校得趕上有人引薦，這項差事看幸運。
      low_wit: 籌備處會把排告示路線的差事交給聰慧達標的人。義體智能晶片能補。
      low_finesse: 三份名單細碎，籌備處會託靈巧達標的人核對。
      low_will: 踏勘要把幾處地走完，籌備處會找意志達標的人。義體仿生肺能補。
      low_constitution: 去石牌要走遠路、立界樁，隊伍會找體質達標的人。義體仿生肺能補。
      none: 只改一樣東西，用同一個種子再派一次，這樣對比最清楚。
