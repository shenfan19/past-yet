      p2: 他照舊在拉文納寫詩，回佛羅倫薩的盼望沒有著落，這條分支裡沒人告訴過他後來的事。
    shift:
      p1:
        was: 1319 年下半年至 1320 年初，但丁在拉文納寫《天堂篇》時，與博洛尼亞的喬萬尼·德爾·維爾吉利奧開始拉丁詩通信，這是學界的推定。
      p2:
        was: 1321 年 9 月，但丁在拉文納去世，到死沒能回到佛羅倫薩；1519 年前後佛羅倫薩請求遷回他的遺骨，拉文納的修士把遺骨藏進了墻裡。
        now: '{staff}在拉文納讓他知道，《神曲》往後會一直有人讀，他的城市終有一天想把他接回去。'
        who: dante_ravenna
        bio: 流放中的但丁在拉文納的晚年得知，他的詩會長久流傳，佛羅倫薩終會以他為榮。
    vignettes:
      latin: '{staff}在謄寫間看見兩疊紙：一疊是托斯卡納話寫的《天堂篇》，一疊是要寄往博洛尼亞的拉丁詩，來信說只有拉丁文才配得上桂冠。{staff}知道七百年後人人讀的是哪一疊，話到嘴邊，又咽了回去。'
      pinewood: '{staff}跟著拾柴的人走進拉文納城外靠海的松林，松針在腳下軟軟地陷下去，兩人在沙地上歇腳，聽得見林子那頭的海浪。'
      ink: '{staff}幫賣墨水的人把一罐罐墨從船上搬下來。墨是用櫟樹癭和鐵銹熬的，賣墨的說，城裡謄寫的人買得最多。'
  copernicus_frombork:
    name: 太陽在中心
    place: 波蘭弗龍堡
    figure: 哥白尼
    story: 1539 年，年輕的數學家雷蒂庫斯來到弗龍堡，勸尼古拉·哥白尼把書付印。1543 年，《天體運行論》在紐倫堡印成，書中地球自轉並繞太陽運行，卷首多了一篇不署名的《告讀者》。哥白尼從 1542 年底起一直病著，1543 年 5 月 24 日在弗龍堡去世。他的朋友蒂德曼·吉澤後來寫信說，印好的書到他去世那天才送到他手上。
    story_prose:
      opening:
        - 1543 年春，波蘭弗龍堡。尼古拉·哥白尼從去年年底起一直病著。他寫了幾十年的《天體運行論》正在紐倫堡付印，書裡地球自轉，繞著太陽運行。四年前，年輕的數學家雷蒂庫斯從維滕貝格來到這裡，勸他把書付印。
        - 史實裡，書在紐倫堡印成，卷首多了一篇不署名的《告讀者》。他的朋友蒂德曼·吉澤後來寫信說，印好的書到他去世那天才送到他手上；5 月 24 日，他在弗龍堡去世。7 月，吉澤請雷蒂庫斯把要求改版的信轉交紐倫堡市議會。在這條分支裡，山腳的漁村有個補網的漁夫，家裡有個僕役，天天往病房裡送水。
        - 這一趟用得上幾種人：懂護理、守得住病床的人，或者腿腳硬朗、趕得了遠路送書的人；懂文書、分得清親筆原稿和抄件的人；心細、做得出一張勘誤頁的人。
      outcomes:
        all: 五月初送到的那本書，後來一直放在他床頭。那年夏天，附近借出去的幾本書裡都夾著一張勘誤頁；那部親筆原稿包著布，鎖在櫃子裡，後來交到了吉澤手上。
        p3: 那本書後來一直放在他床頭，扉頁朝上。幾周以後，他在弗龍堡去世。
        p2: 那年夏天，附近借出去的幾本書裡都夾著一張勘誤頁，紙角被翻得捲了起來。外地印坊的回信，後來也收進了同一個檔案夾。
        p1: 那部親筆原稿包著布，後來交到了吉澤手上，又從他手裡到了雷蒂庫斯那裡。幾百年後，它收進了克拉科夫的雅蓋隆圖書館。
      none: 5 月 24 日前後，印好的書送到了弗龍堡。病房的窗開著一條縫，送水的僕役在門口站了一會兒，沒有進去。
      desync: 書房裡的紙收拾亂了，兩疊工作紙混進了要交給印坊的那份抄本，親筆原稿不知去向。{staff}沒等到吉澤來，就被事務所召了回來。
      not_admitted: '{staff}沒能上山進那棟房子，只在山腳的漁村幫人補了幾天網。山上那扇窗，夜裡一直亮著燈。'
      points:
        p1:
          class_lettered: 五月下旬，病房隔壁的書房裡，桌上的紙越堆越亂。{staff}照管檔案的辦法，把親筆原稿和兩疊工作紙一頁頁點清，分開記進一本賬，原稿用布包好，單獨鎖進櫃子。收執寫好了，抬頭寫著“交蒂德曼·吉澤”，折成兩折，用櫃子的鑰匙壓在桌角。隔壁病房裡，送水的僕役輕手輕腳地進去，又出來了。
          else: 五月下旬，病房隔壁的書房裡，桌上的紙越堆越亂。{staff}一連幾夜守在書房，把親筆原稿和兩疊工作紙一頁頁點清，分開記下，原稿用布包好，單獨鎖進櫃子。收執寫好了，抬頭寫著“交蒂德曼·吉澤”，折成兩折，用櫃子的鑰匙壓在桌角。隔壁病房裡，送水的僕役輕手輕腳地進去，又出來了。
        p2: 七月底，吉澤寫信給雷蒂庫斯，請他把要求改版的信轉交紐倫堡市議會，回音一時還等不來。{staff}照校書的規矩，對著原稿一頁頁查過，寫成一張勘誤頁，列明作者自己的序言在哪一頁，卷首那篇《告讀者》原稿裡沒有。勘誤頁抄了幾份，夾進附近先借出去的那幾本書。借書的人翻開封面，先看見的就是那張紙。
        p3:
          class_medical: 五月初，哥白尼躺在弗龍堡的病床上，醒著的時候越來越少。{staff}照護理的規矩守在床邊，按時餵水，替他翻身，屋裡的爐火不讓它滅，等著紐倫堡來的書。書送到床前時，他正醒著。他把書攤在被子上，手指順著扉頁上的書名慢慢移過去，在自己的名字那裡停了很久。
          class_travel: 五月初，哥白尼躺在弗龍堡的病床上，醒著的時候越來越少。{staff}往南趕路，在半道截住從紐倫堡來的貨車，把一本印好的書裹進外衣，日夜兼程送回弗龍堡。書送到床前時，他正醒著。他把書攤在被子上，手指順著扉頁上的書名慢慢移過去，在自己的名字那裡停了很久。
