  smith_kirkcaldy:
    name: 託付在身後的書
    place: 蘇格蘭柯卡爾迪
    figure: 亞當·斯密
    story: 1776 年 3 月，亞當·斯密的《國富論》在倫敦出版。8 月 25 日，他的朋友大衛·休謨在愛丁堡去世。休謨起先託斯密把《自然宗教對話錄》印出來，斯密有顧慮，休謨改託印書商威廉·斯特拉恩，要他在身後兩年內出版。這年 11 月，斯密在柯卡爾迪給斯特拉恩寫信，記下休謨最後幾個月的樣子。斯特拉恩最終作罷，《對話錄》到 1779 年才由休謨的侄子印出。
    story_prose:
      opening:
        - 1776 年深秋，蘇格蘭柯卡爾迪。亞當·斯密回到了他出生的這座小城。這年 3 月，他的《國富論》在倫敦出版，第一章從做別針講起。8 月，他的朋友大衛·休謨在愛丁堡去世。
        - 史實裡，休謨年初立遺囑，把遺稿託給斯密，起先要他把《自然宗教對話錄》印出來，斯密不願經手；8 月 7 日的遺囑附件改託印書商威廉·斯特拉恩，請他在身後兩年內出版。11 月，斯密在柯卡爾迪給斯特拉恩寫信，記下休謨最後幾個月，《對話錄》卻一直擱著，到 1779 年才由休謨的侄子不署名印出。在這條分支裡，麵包鋪裡有個拿鐵釘付賬的打釘工人，退潮的沙灘上有個拾貽貝的婦人。
        - 這一趟用得上幾種人：懂書、懂印書生意的人，或者懂文書、把一份遺願寫得清清楚楚的人；說話有分量、勸得動人的人。
      outcomes:
        p1: 休謨去世後不到兩年，斯特拉恩的印坊排好了《自然宗教對話錄》。頭一批印張晾在繩子上，墨還沒乾。
      none: 那年冬天，那部手稿還擱在斯特拉恩那裡。柯卡爾迪的沙灘上，拾貽貝的婦人提著籃子往回走，對岸愛丁堡的炊煙壓得很低。
      not_admitted: '{staff}沒能進那戶人家的門，只在退潮的沙灘上幫拾貽貝的婦人提了幾天籃子。對岸愛丁堡的炊煙，一直壓得很低。'
      points:
