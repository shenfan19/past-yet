      p2:
        was: 1823 年 12 月 26 日，她把蛇頸龍的草圖照原樣寄往倫敦。
        now: 寄到倫敦的草圖上每一節頸椎都標了號，後來那場疑心來時，圖上已經有了回答。
      p3:
        was: 1847 年瑪麗·安寧去世，四十七歲，手頭一直拮據，寫她發現的論文很少提她的名字。
        now: 那個冬天有人告訴過她，她挖出的骨頭以後會在倫敦的博物館裡寫著她的名字，萊姆里吉斯的海邊會立起她的像。
    vignettes:
      stone: '{staff}沿裂縫描過骨架的頸部。裂紋越出骨頭，仍往岩石裡去。走到那處分界，筆尖便抬了起來。'
      vertebrae: '{staff}從另一端數頸骨。兩邊數不到一起，就在有疑問的地方留了個括號，等下回再看。'
      pose: '{staff}把抄圖轉了幾回，直到從這邊望過去也能一下找見頭部，才在圖下寫上發現者的名字。'
  kepler_leonberg:
    name: 證人親眼看見的事
    place: 萊昂貝格
    figure: 約翰內斯·開普勒
    story: 1620 年，萊昂貝格的鄰居指控天文學家約翰內斯·開普勒的母親卡塔琳娜，案子已拖了五年。8 月 7 日，她在霍伊馬登的女兒家中被捕，後來從萊昂貝格轉押到居格林根，看守費用由家裡承擔。那年 9 月，約翰內斯從林茨回來為母親辯護。審理一拖再拖。1621 年秋，卡塔琳娜獲釋，距被捕已過了一年多。
    story_prose:
      opening:
        - 1620 年，萊昂貝格。卡塔琳娜·開普勒受人指控，爭訟已拖了五年。八月她在霍伊馬登被捕，兒子約翰內斯於九月從林茨回來為她辯護。
        - 史實裡，她在居格林根被關了一年多，戴著鎖鏈過冬，連看守的費用也由家裡承擔。在這條分支裡，獄卒的妻子仍要端湯走上那條巷子，有人能夠替她接一接鍋，也能在案卷送走前看一眼紙上的字。
        - 這一趟用得上管得住文書、分得清證詞來路的人。能照顧老人、帶得來禦寒衣被的人，在入冬以後也有事可做。
      points:
        p1: 卡塔琳娜被帶到萊昂貝格後，{staff}照管文書的辦法請保管人另抄一份，當面點過頁數，再交存。收件人把副本放進待歸檔的紙疊。原件折回去時，{staff}用指腹把翹起的紙角壓平。
        p2: '{staff}陪家人把證詞攤開，依次核對是誰看見的、聽誰講的、哪一段是後來推出來的。一頁抄件上多了三欄，原先擠作一行的說法有了空隙。寫到一個沒人親眼見過的地方，筆尖停在欄線前。'
        p3: 寒天裡，{staff}同看守打點好，把厚衣被和一碗熱飯送到掛著鎖鏈的床邊。她接碗前，先把被角往膝頭掖了掖。鐵環靠在床板上，雙手慢慢合攏在熱碗外面。
      outcomes:
        all: 證詞與申辯後來還能按頁對讀。卡塔琳娜在牢裡有厚被和熱飯，次年秋天獲釋時，家裡人等在門外，手裡帶著一件能裹到下巴的外衣。
        p3: 冬盡了，鐵鎖才不再冰得刺手。她熬過那個冬天，收拾鋪位時，把厚被的兩個角仔細對齊。
        p2: 抄件到了律師手裡。他在證人沒有親眼見到的幾行旁作了記號，翻過一頁，又把它翻回來。
        p1: 那份申辯後來仍能在卷中找到。翻得多了，折起的紙角只剩一條發白的脊。
      none: 牆邊冷下來，湯麵很快結了一層皮。窗外經過一輛車，鐵輪碾過石縫，一聲比一聲遠。
      not_admitted: '{staff}沒能進到保管案卷的屋裡。門裡的人挪開一捆紙，縛紙的繩子在桌上擦了一聲。'
      desync: 缺了申辯的案卷已經合起。{staff}被召回時，桌邊還留著一道方方的紙印。
      excerpts:
        p3: 她接碗前，先把被角往膝頭掖了掖。鐵環靠在床板上，雙手慢慢合攏在熱碗外面。
        p2: 一頁抄件上多了三欄，原先擠作一行的說法有了空隙。寫到一個沒人親眼見過的地方，筆尖停在欄線前。
        p1: 收件人把副本放進待歸檔的紙疊。原件折回去時，{staff}用指腹把翹起的紙角壓平。
    relic: 一頁申辯書抄本
    relic_desc: 一頁謄清的書面申辯，頁邊改過一個日期。
    points:
      p1: 卡塔琳娜被帶到萊昂貝格以後，請保管申辯書的人立刻另抄並交存一份，護住書面申辯繼續進入程序
      p2: 讓家人整理原證詞，逐項區分證人親眼所見、由人轉述和後來附上的推斷
      p3: 給居格林根牢裡戴著鎖鏈的卡塔琳娜送進厚衣被和熱飯，讓七十三歲的她熬過這個冬天
    points_fail:
      p1: 家裡能找到的那份申辯書沒能轉交。案卷只剩指控人的陳述，事務所因同步失敗召回員工。
      p2: 三種說法抄在同一欄。送進案卷以後，辯護人還要再追問最早是誰說的。
      p3: 這條分支裡，她照史實戴著鎖鏈過冬，身邊只有日夜看守的兩個人，看守的費用還要家裡出。
    shift:
      p1:
        was: 卡塔琳娜於 1620 年 8 月被捕。約翰內斯·開普勒隨後經律師堅持把程序落實在書面記錄上。
      p2:
        was: 審理留下證詞及書面辯護。辯方逐項回應並反對把猜測當作說法之間的因果。
        now: 送給律師的抄本可以按欄核查。辯護人先指出證人未能親驗的數項。
      p3:
        was: 1620 年 8 月 7 日卡塔琳娜·開普勒被捕，押到居格林根，戴著鎖鏈關押十四個月，兩人日夜看守，費用由她和家人承擔；1621 年秋獲釋，約半年後去世。
        now: '{staff}替家裡打點好看守，那個冬天她有厚被和熱飯，鎖鏈沒有卸下，身子卻比歷史上撐得住些。'
        who: katharina_kepler
        bio: 這條時間線裡，卡塔琳娜·開普勒在居格林根牢裡的第一個冬天有厚被和熱飯，1621 年秋獲釋時身子比歷史上硬朗些。
    vignettes:
      soup: 9 月 13 日，{staff}替獄卒的妻子端大麥湯走上居格林根的小巷。她說卡塔琳娜的碗很好認，每次送回來都颳得乾淨，還嫌鹽少。鍋蓋一顛，她伸手把它按住。
      hearing: 10 月 2 日，{staff}和文書各抱一捆案卷爬上市政廳臺階。開庭又改了日子。文書把兩捆紙擱在臺階上，說這條路走了這麼多回，早該自己認得了。
      frost: 十一月中，{staff}搭運貨馬車往居格林根去。車伕說察伯河谷這一段一上凍，聽車輪的音高就知道還有多遠。車進河谷，他鬆了鬆韁繩，側過耳朵。
  pushkin_st_petersburg:
    name: 門牌號尚未出現的那戶人家
    place: 聖彼得堡
    figure: 亞歷山大·普希金
    story: 1836 年到 1837 年，亞歷山大·普希金住在莫伊卡河畔、科紐申內橋旁沃爾孔斯卡婭公爵夫人的房子裡。舊曆 1837 年 1 月 27 日，也就是新曆 2 月 8 日，他在黑溪邊與喬治·丹特斯決鬥，腹部中彈，被送回寓所，舊曆 1 月 29 日，也就是新曆 2 月 10 日在那裡去世。他葬在米哈伊洛夫斯科耶莊園附近，在他母親身旁。
    story_prose:
      opening:
        - 新曆 1837 年 1 月，聖彼得堡。亞歷山大·普希金一家住在莫伊卡河畔、科紐申內橋邊沃爾孔斯卡婭公爵夫人的房子裡，門上還沒有今天那個門牌號。他用詩體寫了《葉甫蓋尼·奧涅金》，常被看作現代俄國文學的奠基人。
        - 史實裡，這一冬他越欠越多；新曆 2 月 8 日，他在黑溪邊與喬治·丹特斯決鬥，腹部中彈，被送回寓所，兩天後死於腹膜炎，三十七歲，留下妻子和四個孩子，欠下的債後來由沙皇替他還清。在這條分支裡，有個來打聽寓所的人都找他問路的門房，還有個常差人往橋那頭跑腿的女僕。
        - 這一趟用得上幾種人：會管賬、做過買賣，或條理清楚、心思敏捷，理得清一摞欠單的人；懂醫護的人，或帶著急救包、臨事鎮定守得住的人；帶著抗生素的醫生，或帶著納米醫療箱的醫護。
      outcomes:
        all: 二月過去，普希金還在莫伊卡河畔養傷，書桌上的欠單已經理成了一張單子。他又寫了幾年，《同時代人》仍在他手裡辦著。
        p3: 二月過去，他還在莫伊卡河畔養傷，能扶著牆走到窗邊。後來幾年，《同時代人》仍在他手裡辦著。
        p1: 那張單子一直壓在墨水瓶底下。後來家裡的開銷，都照著它一筆一筆安排。
        p2: 他活著回到了莫伊卡河畔的家，被抬進書房，躺在那張沙發上。門廳裡，來打聽消息的人一直站到了街上。
      none: 新曆 2 月 8 日傍晚，黑溪邊的雪地上，他沒能撐到城裡。書桌上那摞欠單還壓著，沒有人動過。
      desync: 新曆 2 月 8 日傍晚，回城的路走到一半，車廂裡沒了動靜。{staff}被召回時，馬車停在雪地裡，車門半開著，地上落著一隻手套。
      not_admitted: '{staff}沒能進那戶人家，只跟著門房從橋邊沿莫伊卡河走了一趟，數清了指路時要說的幾個轉彎。門房說，最近來問路的人多了，都要找橋邊那棟房子。'
      points:
        p1:
          class_lettered: 新曆 1 月下旬，書房的桌上壓著一摞欠單，印書的、房租的、鋪子裡賒的，一張疊著一張。{staff}做慣了案頭的事，把欠單一張張攤開，按日子和數目抄成一張清單，哪筆先還，哪筆能緩，在旁邊各畫一道。普希金接過那張單子，看了一會兒，把它壓在了墨水瓶底下。那一摞欠單被捆成一紮，放進了抽屜。
          class_trade: 新曆 1 月下旬，書房的桌上壓著一摞欠單，印書的、房租的、鋪子裡賒的，一張疊著一張。{staff}做過買賣，認得鋪子裡的規矩，把欠單按債主分成幾疊，哪家肯緩一緩，哪家等不得，一疊一疊寫上字條，再合抄成一張單子。普希金接過那張單子，看了一會兒，把它壓在了墨水瓶底下。那一摞欠單被捆成一紮，放進了抽屜。
          else: 新曆 1 月下旬，書房的桌上壓著一摞欠單，印書的、房租的、鋪子裡賒的，一張疊著一張。{staff}心細，把欠單按到期的先後排好，抄成一張單子，一行一行對過數目。普希金接過那張單子，看了一會兒，把它壓在了墨水瓶底下。那一摞欠單被捆成一紮，放進了抽屜。
        p2:
          class_medical: 新曆 2 月 8 日傍晚，黑溪邊的雪地上。丹特斯先開了槍，普希金腹部中彈，血流了很多，被人扶上馬車往城裡趕。{staff}懂急救，跪在車廂裡按住傷口，用乾淨的布一層層壓緊，隔一陣摸一次他的脈，一路沒有鬆手。馬車停在莫伊卡河畔的門口，門房提著燈跑了出來。普希金被抬進屋，放在書房的沙發上，大衣上的雪還沒化。
          else: 新曆 2 月 8 日傍晚，黑溪邊的雪地上。丹特斯先開了槍，普希金腹部中彈，血流了很多，被人扶上馬車往城裡趕。{staff}打開帶來的急救包，用紗布壓住傷口，把自己的大衣也墊在他身下，車一顛就伸手把他托穩。馬車停在莫伊卡河畔的門口，門房提著燈跑了出來。普希金被抬進屋，放在書房的沙發上，大衣上的雪還沒化。
        p3:
          class_learned: 新曆 2 月 9 日，他在書房的沙發上躺了一夜，傷口發起熱來，疼得咬緊了牙。{staff}是醫生，看出傷口裡起了感染，清過傷口，把帶來的藥用上，換了乾淨的紗布，一個鐘頭看一回。2 月 10 日下午，他的熱退了，要了一杯水，自己端著喝了兩口。窗外的莫伊卡河結著冰，橋上有人在走。
          else: 新曆 2 月 9 日，他在書房的沙發上躺了一夜，傷口發起熱來，疼得咬緊了牙。{staff}懂醫護，打開帶來的醫療箱，照著說明把藥用上，守著他的體溫，一個鐘頭量一回。2 月 10 日下午，他的熱退了，要了一杯水，自己端著喝了兩口。窗外的莫伊卡河結著冰，橋上有人在走。
      excerpts:
        p3: 2 月 10 日下午，他的熱退了，要了一杯水，自己端著喝了兩口。窗外的莫伊卡河結著冰，橋上有人在走。
        p2: 馬車停在莫伊卡河畔的門口，門房提著燈跑了出來。普希金被抬進屋，放在書房的沙發上，大衣上的雪還沒化。
        p1: 普希金接過那張單子，看了一會兒，把它壓在了墨水瓶底下。那一摞欠單被捆成一紮，放進了抽屜。
    relic: 一本詩集
    relic_desc: 一本小書，某首詩裡夾著一片壓乾的葉子。
    points:
      p1: 幫他把越欠越多的債理出頭緒，讓妻子和孩子的日子不再懸著
      p2: 中彈以後，護住從黑溪回城那一路，讓他活著回到莫伊卡河畔的寓所
      p3: 治好他腹部的槍傷，壓住傷口裡的感染，讓他活下來
    points_fail:
      p1: 這條分支裡，那個冬天的欠單照舊壓在書桌上，沒有人替他理過。
      p2: 他沒能撐到莫伊卡河畔，這條分支裡沒有寓所裡的那兩天。
      p3: 2 月 10 日下午，他照史實在寓所裡去世，這條分支裡也沒能多留他一天。
    shift:
      p1:
        was: 1837 年 2 月普希金去世時欠下大筆債務，後來由尼古拉一世替他還清。
        now: 欠賬理成了一張單子，哪筆先還、哪筆能緩，家裡心裡有了數。
      p2:
        was: 1837 年 2 月 8 日決鬥中彈以後，普希金被送回莫伊卡河畔的寓所。
      p3:
        was: 1837 年 2 月 10 日他在寓所裡死於腹膜炎，三十七歲，留下妻子和四個孩子。
        now: '{staff}帶去的藥壓住了傷口的感染，二月過去時他還在莫伊卡河畔養傷。他又寫了幾年，《同時代人》仍在他手裡辦下去。'
    vignettes:
      number: '{staff}差點把一塊博物館門牌上的號碼告訴來訪的人，可那塊牌子這時還沒有，便劃掉數字，在紙條上畫了那座橋。來人捏著紙條，朝河邊走去。'
      queue: '{staff}把同一句回答抄在幾張紙條上，門廳裡等著的人看了就不用再問。地板上踩滿了帶雪的腳印。'
      river: '{staff}跟著門房從橋邊沿莫伊卡河走一遍，數清指路時該說的幾個轉彎。'
  chekhov_badenweiler:
    name: 寄往弗里德里克別墅的回信
    place: 巴登魏勒
    figure: 安東·契訶夫
    story: 1904 年 6 月，四十四歲、肺結核已經很重的安東·契訶夫，和妻子奧爾加·克尼佩爾來到黑森林的療養地巴登魏勒。他們先住羅馬浴旅館，後住弗里德里克別墅，最後搬進郵局隔壁的索默旅館。他往家裡寫的信都很輕快，七月裡還託朋友打聽哪一班輪船能走海路送他們回俄國。7 月 15 日凌晨，他在那裡去世。
    story_prose:
      opening:
        - 1904 年 6 月，黑森林裡的療養地巴登魏勒。安東·契訶夫四十四歲，肺結核已經很重，在莫斯科瘦了一大圈，喘不上氣。他和妻子奧爾加·克尼佩爾從俄國一路坐車過來，先住進羅馬浴旅館，兩人都累壞了。
        - 史實裡，他們後來搬進弗里德里克別墅，又搬到郵局隔壁的索默旅館。他往家裡寫的信都很輕快，7 月 11 日還寫信打聽哪一班輪船能走海路送他們回俄國。7 月 15 日凌晨，他在那裡去世。在這條分支裡，別墅的女傭跟著太陽挪躺椅，郵局門口的郵差掂得出一封俄國信夠不夠郵票。
        - 這一趟用得上三種人：做事細、守得住信件和地址的人，耐得住性子、能把一串問題壓成一封短電報的人，懂醫、帶著納米藥箱來的人。
      outcomes:
        all: 那個夏天過去，契訶夫和奧爾加坐船回到了俄國。甲板上風很大，他把那身法蘭絨衣服的扣子一顆顆扣上了。
        p3: 夏天過後，契訶夫和奧爾加動身回俄國。站臺上，他穿著那身法蘭絨衣服。
        p2: 那張回電的薄紙，一直攤在寫字桌上，艙位那一行被手指摸得發了毛。
        p1: 瑪麗婭收到了那封信。信封背面是弗里德里克別墅的地址，一筆一畫，都對。
      none: 巴登魏勒的七月很熱。陽臺的躺椅跟著太陽挪了一天，傍晚又挪回原處。
      desync: '{staff}被召回時，寫字桌上已經空了。瑪麗婭還不知道哥哥住到了哪裡。'
      not_admitted: '{staff}沒能進那座別墅。花園裡的太陽一直照到晚上七點，樓上的人寫幾行信就要歇一歇。'
      points:
        p1: 6 月 25 日，搬進弗里德里克別墅的第三天，契訶夫坐在那張寫字桌前給瑪麗婭寫信，寫幾行就要歇一歇。{staff}把信末的回信地址一個字母一個字母核過去，街名和門牌都對上了。契訶夫在信尾簽了名，把筆擱下，靠回椅背，望著窗外喘了一會兒。
        p2: 7 月 11 日，屋裡熱得像蒸籠。契訶夫在信裡一條條問：船哪天幾點開，走幾天，能不能要一間兩個人的艙。{staff}把這幾個問題壓成一封短電報，發給熟悉這條航線的人。回電到的時候，開船的日子、路上的天數和艙位，都寫在一張薄紙上。奧爾加把紙唸給他聽，唸到艙位那一行，他讓她再唸一遍。
        p3:
          class_learned: '{staff}先照診病的老規矩聽了他的胸口，數過呼吸，才打開納米藥箱，按他的體重定下劑量，每天早晚各看一回。七月的酷暑裡，他咳得少了。十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。'
          else: '{staff}打開納米藥箱，照說明一格格配好藥，按鐘點守在床邊給藥、量體溫，夜裡每隔一陣就看一眼他的呼吸。七月的酷暑裡，他咳得少了。十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。'
      excerpts:
        p3: 十來天後，他能自己從陽臺走回屋裡，坐到寫字桌前。奧爾加從弗賴堡帶回那身法蘭絨衣服，他穿上，在鏡子前站了一會兒。
