      p2:
        was: 1898 年兩次報告之後，居里夫婦的後續研究仍在學校的簡陋場地進行。
        now: '{staff}把兩份成果和停工的記錄一併交給願意協調場地的人。學院為接下來的測量騰出一間可長期使用的房間。'
      p3:
