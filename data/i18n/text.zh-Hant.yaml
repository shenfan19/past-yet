      shelf: '{staff}沿著空書架擦了一遍。木板上還留著一塊塊深色的書印，抹布擦到那裡便抬了起來。'
      bells: 有一晚，{staff}在院子裡聽見兩回報喪的鐘響。第二回的聲音落下去，又回屋去看火上的水壺。
  mary_anning_lyme_regis:
    name: 崖壁裡的骨頭
    place: 萊姆里吉斯
    figure: 瑪麗·安寧
    story: 約 1811 年，瑪麗·安寧的哥哥約瑟夫在萊姆里吉斯的海崖裡找到一個魚龍頭骨，1812 年 11 月，瑪麗把五米來長的骨架挖了出來。1823 年 12 月，她找到第一具完整的蛇頸龍骨架；1828 年 12 月，又找到英格蘭發現的第一具翼龍。她 1847 年去世，年僅 47 歲，一直手頭拮據；寫她那些發現的論文裡，很少提到她的名字。
    story_prose:
      opening:
        - 1823 年冬，萊姆里吉斯。退潮後，瑪麗·安寧看見崖下那具骨架的脖子比身子還長。光把骨頭帶上來還不夠。倫敦的人隔著一張紙看它，要有人沿著岩縫把頸椎一節節數出來，他們才看得懂她站在崖下看見了什麼。
        - 史實裡，安寧後來把草圖寄了出去。骨架出了名，她卻很少在寫這些發現的論文裡被署名。這一趟趕在那張圖寄出去以前。
        - 這一趟用得上三種人：能在崖下幹重活、趕在回潮前取出骨架的人，會數會畫、分得清骨頭和岩石的人，肯坐下來同她說話、說得進她心裡的人。
      outcomes:
        all: 那個冬天寄往倫敦的草圖上，長脖子旁排著一列小小的編號，圖角是她自己寫的名字。
        p3: 那封信照舊寄往倫敦。圖角那個名字，是她自己寫上去的。
        p2: 草圖寄到倫敦以後，有人起了疑心，拿著圖順著那列編號，從頭骨底下一節一節數了下去。
        p1: 那個冬天，崖頂的小屋裡擺著一整具骨架，脖子比身子還長。
      none: 寄信那天，安寧一個人對著草圖坐到很晚。那條長脖子畫了又擦，紙面起了毛。
      desync: 潮水蓋過崖腳時，骨架還有一截沒取下來。{staff}被召回前，最後看見的是水淹過那節頸骨。
      not_admitted: '{staff}沒能跟安寧走到崖下。退潮的時候，崖腳只有她一個人，提著一把錘子。'
      points:
        p1: 潮水尚未回來，安寧和{staff}把長頸的骨架一塊塊起出來，用舊報紙包好，抬上崖頂。最後一塊剛離開，身後那片崖腳就被浪蓋住了。安寧回頭看了一眼，水面上只剩泡沫。
        p2:
          class_learned: 畫草圖時，{staff}照野外記錄的規矩，從另一頭一節一節報數，報一節記一節。數目對不上的地方，安寧順著岩縫看了很久，直到認清骨頭的邊在哪兒。最後每一節頸椎都有了號，小小的數字沿著那條長脖子排下去，一直排到頭骨底下。
          class_craft: 畫草圖時，{staff}像描樣稿那樣，先沿著岩縫把骨頭的輪廓輕輕勾出來，再從另一頭數那條長脖子。數目對不上的地方，安寧順著岩縫看了很久，直到認清骨頭的邊在哪兒。最後每一節頸椎都有了號，小小的數字沿著那條長脖子排下去，一直排到頭骨底下。
          else: 畫草圖時，{staff}從另一頭幫她數那條長脖子。數目對不上的地方，安寧順著岩縫看了很久，直到認清骨頭的邊在哪兒。最後每一節頸椎都有了號，小小的數字沿著那條長脖子排下去，一直排到頭骨底下。
        p3: 草圖還沒寄走，{staff}說起很多年後的倫敦：博物館裡會擺著她從崖下挖出來的骨頭，旁邊寫著瑪麗·安寧的名字；萊姆的海邊還會立起她的像。安寧聽著，沒有抬頭。手裡的筆在圖角停了一下，在那裡寫下了自己的名字。
      excerpts:
        p3: 安寧聽著，沒有抬頭。手裡的筆在圖角停了一下，在那裡寫下了自己的名字。
        p2: 數目對不上的地方，安寧順著岩縫看了很久，直到認清骨頭的邊在哪兒。最後每一節頸椎都有了號，小小的數字沿著那條長脖子排下去，一直排到頭骨底下。
        p1: 最後一塊剛離開，身後那片崖腳就被浪蓋住了。安寧回頭看了一眼，水面上只剩泡沫。
    relic: 一枚菊石
    relic_desc: 一枚從藍色裡亞斯巖裡敲出來的螺旋形化石。
