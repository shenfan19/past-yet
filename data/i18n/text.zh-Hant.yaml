  dante_ravenna:
    name: 用街頭的語言寫一部長詩
    place: 拉文納
    figure: 但丁
    story: 但丁 1302 年被逐出佛羅倫薩，約 1318 年移居拉文納，在那裡寫完《神曲》的最後一部《天堂篇》，用的是托斯卡納的日常口語。1319 年前後，博洛尼亞的學者喬萬尼·德爾·維爾吉利奧寄來拉丁詩，勸他改用拉丁文寫作、到博洛尼亞接受桂冠，但丁用拉丁詩作答。1320 年 1 月 20 日，他在維羅納作了一場講演。1321 年 9 月，他從威尼斯出使回來後病倒，在拉文納去世。
    story_prose:
      opening:
        - 1320 年初，拉文納。但丁被逐出佛羅倫薩已經十八年，1302 年那道判決說他回城即處死。他應拉文納領主圭多·諾韋洛·達·波倫塔之邀住在這裡，用托斯卡納的日常口語寫《神曲》的最後一部《天堂篇》。
        - 史實裡，在博洛尼亞執教的喬萬尼·德爾·維爾吉利奧寄來一首拉丁詩，勸他改用拉丁文寫作，到博洛尼亞戴桂冠，但丁用一首拉丁牧歌作答。1321 年 9 月，他從威尼斯出使回來後病倒，在拉文納去世，到死沒能回到佛羅倫薩。在這條分支裡，城裡有個賣墨水的人，最好的主顧是謄寫的人，城外靠海的松林裡有個拾柴人。
        - 這一趟用得上兩種人：懂文書、分得清哪疊紙該寄哪疊該留的人，懂詩懂書、能在他身邊坐下來說幾句真話的人。
      outcomes:
        all: 拉丁詩一來一往，一直寫到第二年，每一封都單獨封著蠟。1321 年 9 月，他從威尼斯回來後病倒，床頭那疊《天堂篇》，最後一頁也寫滿了。
        p2: 他在拉文納又住了一年多。1321 年 9 月，他從威尼斯回來後病倒，床頭那疊《天堂篇》，最後一頁也寫滿了。
        p1: 拉丁詩一來一往，一直寫到第二年。每一封答詩都單獨摺好，滴著一小塊蠟。
      none: 博洛尼亞的信還壓在案頭。拉文納城外的松林裡，海風一陣陣吹過來。
      desync: 拉丁答詩混進了《天堂篇》的抄稿，跟著散頁一起送了出去，博洛尼亞那頭只收到幾頁托斯卡納話。{staff}沒等到回信，就被事務所召了回來。
      not_admitted: '{staff}沒能進謄寫間的門，只在城外的松林裡拾了幾天柴。那兩疊紙，還摞在但丁的案頭。'
      points:
        p1:
          class_lettered: '{staff}照管文書的規矩，把謄寫間裡的兩疊紙分開：托斯卡納話的《天堂篇》留在案上，給博洛尼亞的拉丁答詩另放一處，單獨摺好。但丁在折口滴上蠟，用指節壓平。信使把它揣進懷裡，頂著一月的冷風出了城門，往博洛尼亞去了。'
          else: '{staff}心細，把謄寫間裡的紙一摞摞翻過，從《天堂篇》的散頁裡挑出給博洛尼亞的拉丁答詩，單獨摺好。但丁在折口滴上蠟，用指節壓平。信使把它揣進懷裡，頂著一月的冷風出了城門，往博洛尼亞去了。'
        p2: 三月的一個下午，但丁把剛寫完的幾行唸給{staff}聽。{staff}一句句跟著唸回去，到末了，才說出憋了很久的那句話：這些詩往後幾百年都會有人讀，讀的正是這種街頭的話，佛羅倫薩也終有一天想接他回去。但丁把筆擱在墨水瓶沿上，看著那張紙。過了好一會兒，他又蘸了墨，接著往下寫。
      excerpts:
        p2: 但丁把筆擱在墨水瓶沿上，看著那張紙。過了好一會兒，他又蘸了墨，接著往下寫。
        p1: 但丁在折口滴上蠟，用指節壓平。信使把它揣進懷裡，頂著一月的冷風出了城門，往博洛尼亞去了。
    relic: 一片月桂葉
    relic_desc: 詩人桂冠上的一片乾葉。
    points:
      p1: 給但丁騰出從拉文納寄出答詩的時間，把他答喬萬尼的拉丁詩單獨封存，別夾入正在謄寫的《天堂篇》
      p2: 讓流放中的但丁知道，《神曲》會被一代代人讀下去，佛羅倫薩後來也想把他迎回去
    points_fail:
