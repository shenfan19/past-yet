      p3:
        was: 1904 年 7 月 15 日，契訶夫在巴登魏勒因肺結核去世，終年四十四歲。
        now: 他的肺病好了，夏天過後和奧爾加坐船回到俄國。此後他又寫了好些年，也回到莫斯科藝術劇院看排練。
        who: chekhov_badenweiler
        bio: 契訶夫在巴登魏勒治好了肺結核，1904 年秋天回到俄國，此後繼續寫小說和戲劇多年。
    vignettes:
      garden: 6 月 27 日，{staff}幫弗里德里克別墅的女傭把一張躺椅跟著太陽在花園裡挪位置。她說這裡的太陽七點整離開草坪，這家人開晚飯看的是太陽，不是門廳裡那座鐘。
      post: 7 月 7 日，{staff}坐在索默旅館隔壁郵局門口的長凳上。郵差說，夏天巴登魏勒寫信最多的是俄國人，寫得最短的是英國人；俄國人的信封他掂一掂，就知道夠不夠郵票。
      ice: 7 月 10 日熱得最兇，{staff}幫索默旅館的門房用麻袋從地窖往樓上扛一塊冰。門房說黑森林二十年沒見過這樣的七月，米爾海姆來的賣冰人都開始按樓梯級數算錢了。
  sophie_germain_paris:
    name: 寄往柏林的論文
    place: 巴黎
    figure: 索菲·熱爾曼
    story: 索菲·熱爾曼與卡爾·弗里德里希·高斯通信討論數論，起初署名勒布朗。1816 年，她憑彈性薄板振動研究獲得法蘭西科學院的獎。1829 年患病後，她仍繼續工作。柏林克雷勒主編的雜誌第七卷以她的本名刊出了她論曲面曲率的論文。1831 年 6 月 27 日，她在巴黎去世。
    story_prose:
      opening:
        - 1831 年，巴黎。索菲·熱爾曼年輕時曾用勒布朗的名字和高斯討論數論，後來以彈性薄板研究獲獎。患病以後，她還在寫一篇論曲面曲率的論文。柏林克雷勒主編的雜誌最終刊出了它。
        - 史實裡，她於六月在巴黎去世。部分傳記記載高斯曾推薦她獲得哥廷根大學的名譽學位，她生前未得到學位。在這條分支裡，送水的人仍要走上薩伏依街的樓梯，樓上的書桌也還有地方擱一張來信。
        - 這一趟用得上校得動數學稿、能把稿件送出去的人。懂得照護病痛的人，以及能把外地學界消息帶來的人，也在這裡派得上用場。
      points:
        p1: '{staff}逐頁校過曲率論文上的記號，把散頁按次序疊好，交給送往柏林的信使。熱爾曼用指尖按了按最上面的一頁。{staff}抽出手時，封套口正好遮住頁首最後一個字。'
        p2: '{staff}憑照護經驗為她緩解疼痛，守到她可以自己挪到書桌旁。她伸手拖近沒寫完的紙。窗光照到桌面時，那隻手已經在找擱筆的地方。'
        p3: '{staff}把高斯推薦她的消息帶來，照信上的原意慢慢讀給她聽。熱爾曼把紙接過去，從頭看了一遍。她把紙放在桌上時，兩道摺痕還支著薄薄的一角。'
      outcomes:
        all: 柏林的刊物後來印出了她的論文。巴黎那張書桌上，她曾在疼痛稍歇時夠到稿紙，也在生前讀到了高斯推薦她的消息。來信壓在紙疊一角，靠外的一邊已經卷起。
        p3: 學位仍來得太遲。那條消息先到了巴黎，後來桌上還能找到那封信，紙在摺痕處鬆鬆地翹起來。
        p2: 疼痛緩下去時，她還有些時候能坐到書桌前。桌上幾張紙從中間攤開，沒有再合回去。
        p1: 柏林的第七卷刊出了那篇論文。翻到正文前，頁首印的是索菲·熱爾曼的名字。
      none: 樓上的燈熄得早。樓梯上還有水桶在碰牆，桌前的椅子已經推了回去。
      not_admitted: '{staff}沒能進到薩伏依街樓上的房間。有人提著桶走過，木柄在掌心轉了半圈。'
      desync: 沒有封好的稿子還攤在桌上。{staff}被召回時，裝稿的封套還空著，封口朝上。
      excerpts:
        p3: 熱爾曼把紙接過去，從頭看了一遍。她把紙放在桌上時，兩道摺痕還支著薄薄的一角。
        p2: 她伸手拖近沒寫完的紙。窗光照到桌面時，那隻手已經在找擱筆的地方。
        p1: 熱爾曼用指尖按了按最上面的一頁。{staff}抽出手時，封套口正好遮住頁首最後一個字。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借來的名字寫給高斯的信。
    points:
      p1: 在她病中護住那篇論曲面曲率的論文，讓它寄到柏林克雷勒的雜志
      p2: 減輕她最後幾個月在巴黎的癌痛
      p3: 讓熱爾曼生前知道，高斯在為她向哥廷根大學爭取名譽博士學位
    points_fail:
      p1: 論文沒寫完，留在她的書桌上，1831 年那一卷裡沒有它。這條分支與歷史脫節，員工被送回。
      p2: 沒人替她壓住疼痛，這條分支裡她最後幾個月和歷史上一樣難熬。
      p3: 消息沒送到她手裡，她到去世都不知道高斯為她做了什麼。
    shift:
      p1:
        was: 1831 年，熱爾曼論曲面曲率的論文刊於克雷勒雜志第七卷，同年她去世。
      p2:
        was: 約 1829 年起熱爾曼患乳腺癌，仍堅持工作，1831 年 6 月 27 日在巴黎去世。
        now: '{staff}用現代的藥壓住疼痛，在最難熬的時候陪著她。她最後幾個月少受了些苦，還能坐到書桌前。'
      p3:
        was: 高斯曾推動哥廷根大學授予熱爾曼名譽博士學位，1831 年 6 月 27 日她去世時，學位尚未授出。
        now: '{staff}把高斯所做的事帶給她。熱爾曼得知，那所她從沒能進去讀書的大學要給她這份榮譽。'
        who: sophie_germain_paris
        bio: 這條時間線裡，熱爾曼生前得知高斯推薦她獲得哥廷根的名譽博士學位。學位本身仍然來得太遲。
    vignettes:
      water: 3 月 7 日，{staff}同送水的人把兩桶塞納河水扛上薩伏依街的五層樓。他數一級臺階喘一口，說工錢還是按桶算。上到最後一級，他把桶先放下來，手還套在提柄裡。
      quai: 四月中旬，{staff}在河岸的舊書攤上翻一本曆書。攤主說這幾本都是同一戶人家的，頁邊的算式他看不懂，便把整摞往秤盤上挪。
      wash: 五月下旬，{staff}在洗衣船上幫洗衣婦擰床單。她說塞納河一漲一退，船跟著高低，腰也跟著高低。水從擰緊的床單裡滴下去，落到船板上。
  wallace_ternate:
    name: 來自特爾納特的論文
    place: 特爾納特
    figure: 阿爾弗雷德·拉塞爾·華萊士
    story: 1858 年 2 月，阿爾弗雷德·拉塞爾·華萊士在摩鹿加群島發燒，退燒後寫了一篇論文，談變種怎樣偏離原型。論文落款是「特爾納特，1858 年 2 月」。3 月 25 日，他從特爾納特乘船出發，同行的有年輕獵手朱馬特，一行人抵達新幾內亞海岸的多雷。論文寄到了英格蘭。7 月 1 日，他與達爾文的文章在倫敦一同宣讀，兩位作者都不在場。
    story_prose:
      opening:
        - 1858 年 2 月，摩鹿加群島。華萊士在一陣高燒後寫下論文，說明生物的變種怎樣偏離原型。他在稿末寫下特爾納特。
        - 史實裡，論文寄到了英國，華萊士隨船去了多雷，在那裡傷了腳踝。同行的朱馬特在六月病逝。在這條分支裡，有人能在寫稿時守夜，也能跟著船去多雷。
        - 這一趟用得上能守住病榻、讓人歇過一陣的人。熟悉傷口照料、帶來合用藥物或器材的人，也會有事做。
      points:
        p1: 華萊士燒稍退時，{staff}守在一旁，把紙和水挪到他伸手夠得著的地方。他落筆寫下地名，手停了一會兒。{staff}把窗邊那張已經掀起的紙用指尖按住。
        p2: 到多雷以後，{staff}照料華萊士受傷的腳踝，等他能把腳踩穩，再陪他試著多走幾步。門外泥還濕著。華萊士把鞋踏進去，第二個腳印落得和頭一個一樣實。
        p3: 朱馬特臥床起不來。{staff}守著他，用帶來的藥物或器材照料，等他能自己挪動水碗。朱馬特先拿兩隻手捧碗，後來鬆開一隻。碗裡的水沿著他的手腕滴到床邊。
      outcomes:
        all: 論文後來到了英國。多雷的船離岸時，朱馬特把腿收過船沿，華萊士留出一截長凳。
        p3: 七月底的船上多留了一個位置。朱馬特坐下來，腳邊放著那隻喝水的碗。
        p2: 汽船停在多雷的那些天，華萊士又進了林子。走出一段，他彎腰撣掉鞋上的泥。
        p1: 寄出的論文後來在倫敦宣讀。展開稿紙，最後一行還留著「特爾納特」。
      none: 屋裡剩一張靠窗的桌子。潮氣上來時，最外邊的紙角慢慢彎了起來。
      not_admitted: '{staff}沒能跟上這一行人。碼頭的纜繩鬆下來，在水面劃了一道。'
      desync: 病床邊的紙沒寫完。{staff}被召回時，窗框內側還留著一小片濕。
      excerpts:
        p3: 朱馬特先拿兩隻手捧碗，後來鬆開一隻。碗裡的水沿著他的手腕滴到床邊。
        p2: 門外泥還濕著。華萊士把鞋踏進去，第二個腳印落得和頭一個一樣實。
        p1: 他落筆寫下地名，手停了一會兒。{staff}把窗邊那張已經掀起的紙用指尖按住。
