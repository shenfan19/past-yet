    shift:
      p1:
        was: 皇家學會悼文和戴德金的記述都說，去世前一天他在塞拉斯卡的無花果樹下休息，仍在寫最後那篇論文，論文沒有寫完。
        now: 最後那篇論文用他自己的話多寫了幾頁，後來連同這幾頁一起印出。
      p2:
        was: 1866 年 7 月 20 日，黎曼在馬焦雷湖畔的塞拉斯卡死於肺結核，三十九歲。
        now: '{staff}帶去的藥治好了從 1862 年起拖著他的病。那年秋天他回到北邊，又在哥廷根上起了課。'
        who: riemann_selasca
        bio: 這條時間線裡，黎曼在 1866 年夏天治好了肺結核。他回到哥廷根，又工作了許多年。
    vignettes:
      figs: 7 月 18 日傍晚，湖面上起了一層薄霧，{staff}幫房東的小女兒把無花果樹下的落果撿乾淨。她說樹下那把椅子是給德國先生擺的，漏掉一個，他的稿紙就要染成紫的。
      boat: 七月初，{staff}幫湖上的船伕把一船檸檬卸到帕蘭扎碼頭，筐底的檸檬壓破了幾個，滿碼頭都是酸味。船伕說今年夏天湖上的船少了一半，年輕人都被叫去當兵了，他只好教老婆划槳。
      chair: 八月，{staff}幫房東把無花果樹下那把椅子搬進屋，椅背上還留著一塊曬褪了色的印子。房東用袖子擦了又擦，說這樹從沒結過今年這麼多的果子，樹底下卻沒人坐了。
      harvest: 八月，{staff}幫房東把無花果一個個摘下來，攤進扁筐，準備送去因特拉的集市，指頭上沾滿了白色的果漿。房東說這樹從沒結過今年這麼多的果子，曬裂了口的那些挑出來，擺在窗臺上留給家裡吃。
  du_chatelet_luneville:
    name: 法語版牛頓
    place: 呂內維爾
    figure: 埃米莉·杜·夏特萊
    story: 1749 年夏，埃米莉·杜·夏特萊住在呂內維爾斯坦尼斯瓦夫的宮廷裡待產，手上是快要完成的牛頓《原理》法譯和評注。9 月 4 日，她生下一個女兒。9 月 10 日，她去世，四十二歲，死因一說產褥熱，一說肺栓塞。同一天，巴黎的王家圖書館為她寄存的三包評注稿簽了收據。1759 年，法譯全本出版。
    story_prose:
      opening:
        - 1749 年，呂內維爾。杜·夏特萊快要生產了，桌上還有牛頓《原理》的譯稿。她把這部拉丁文著作譯成法文，還在自己的評注裡解釋推導。後來的法國讀者翻開牛頓，會同時讀到她是怎樣算明白的。
        - 史實裡，她生下女兒六天後去世。那天，巴黎的王家圖書館給三包評注稿開了收據。稿子保住了，十年後出了全本，她連一本印好的書也沒見到。
        - 這一趟用得上兩種人：懂文稿的人幫得上譯稿，懂醫護、帶對了藥械的人能守在產房外。
      outcomes:
        all: 那年秋天，呂內維爾的書桌上又攤開了牛頓。校樣一頁頁送來，她一頁頁看過，頁邊留著她自己的筆跡。
        p3: 那年秋天，她回到書桌前。校樣送來的時候，有疑問的那頁不必託人轉問，直接攤在她手邊。
        p2: 十年後，克萊羅拆開稿件，那張簽了名的紙還夾在原處。哪幾行照她的原譯印，他照著紙上一處一處辦。
        p1: 王家圖書館的收據上，寫著她的名字和三包稿子的件數。開出收據的那天，是 9 月 10 日。
      none: 九月的呂內維爾，那張書桌收拾乾淨了。桌角那隻墨水瓶還沒蓋上。
      desync: 到了該交稿的時候，評注稿仍留在宅邸。寄存手續接不上，事務所先把{staff}召了回來。走的時候，三包稿子還捆在書桌底下。
      not_admitted: '{staff}沒能走到那張書桌旁。隔著窗能看見桌上的稿子一摞一摞堆著，燈一直亮到很晚。'
      points:
        p1: 發運前，{staff}把三包評注逐包登記，按清單又核了一遍。最後一包的繩結繫緊時，桌上只剩她寫給王家圖書館的那封信，墨跡已經乾了。
        p2: 兩份草稿攤在一起，改動挨得很近。她用筆尖點著紙，一處一處說，{staff}一處一處記在另一張紙上。記完，她把那張紙拿過去看了一遍，在右下角簽了自己的名字。
        p3: 產後幾天，她的情形急轉直下。{staff}打開帶來的藥箱守在床邊，按鐘點量體溫、餵藥，夜裡一直留著一盞燈。生下女兒後的第六天過去了，杜·夏特萊還活著。秋天，印坊把校樣送來。她翻到正文擠著評注的那頁，把紙往近處拉了拉，拿起筆，在印壞的一行下面畫了一道。
