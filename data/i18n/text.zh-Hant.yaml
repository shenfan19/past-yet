    vignettes:
      bread: 12 月 5 日早上，天還沒大亮，運河上起著霧，{staff}幫麵包鋪的夥計沿著老朗恩代克街送麵包。到了一家門口，夥計把麵包遞進去，沒收錢，在小本子上畫了一道。他說老闆每個星期六都對著這一頁嘟囔，每個星期一照樣叫他把麵包送來。
      frames: 一月裡，{staff}在一家畫框鋪裡待了一上午，替師傅按住斜角，等膠乾，鋪子裡一股熬膠的腥味。靠牆的畫框有一半空著。師傅說自從七二年法國人打進來，人們買框子是為了裝鏡子，不是裝畫，鏡子至少不會讓人付兩回錢。
      peat: 二月中旬，{staff}幫一個賣泥炭的女人在集市廣場上碼濕泥炭塊，腳下的石板結了一層薄霜。她朝手指哈氣，說今年冬天全代爾夫特都在燒便宜貨，整座城聞起來像一條趴在爐邊的濕狗。
  rembrandt_amsterdam:
    name: 兒子之後
    place: 阿姆斯特丹
    figure: 倫勃朗
    story: 1668 年 9 月 7 日，倫勃朗的兒子提圖斯在阿姆斯特丹下葬，離他成婚只有半年。1669 年 3 月，提圖斯的女兒蒂蒂婭出世。這一年，倫勃朗畫了幾幅署年 1669 的自畫像。他在 1669 年 10 月 4 日去世，四天後葬進一處租來的墓穴；他最後一幅畫沒有畫完。10 月 21 日，提圖斯的遺孀也下葬了。
    story_prose:
      opening:
        - 1669 年 9 月，阿姆斯特丹。六十三歲的畫家倫勃朗畫過《夜巡》，1656 年破產，晚年負債住在這座城裡。一年前，他唯一長大成人的兒子提圖斯下葬，離成婚才半年；今年 3 月，提圖斯的女兒蒂蒂婭出世。這一年他畫了幾幅署了年份的自畫像，畫架上還立著他的最後一幅畫。
        - 史實裡，他在 10 月 4 日去世，四天後葬進一處租來的墓穴；畫架上那幅畫沒有畫完，如今收在斯德哥爾摩的國立博物館。兩個星期後，提圖斯的遺孀也下葬了。在這條分支裡，運河邊有個顏料商，河上有個撐泥炭船的船伕，街上有個搖木響板的守夜人。
        - 這一趟用得上一種人：拿過畫筆、手穩的人，或者有一雙畫畫人的眼睛、手更穩的人，替他研好顏料、扶穩畫布。
      outcomes:
        all: 10 月 4 日，倫勃朗去世，六十三歲。畫架上那幅畫還立著，那個老人的兩隻手比先前多了幾筆，調色板擱在一邊，上面的顏色已經乾了。
