  beethoven_vienna:
    name: 第九交響曲
    place: 維也納
    figure: 路德維希·凡·貝多芬
    story: 1824 年春天，幾乎全聾的貝多芬在維也納籌辦一場新作音樂會。合唱和樂隊分開排練，正式演出前只有兩次全體排練。5 月 7 日，《第九交響曲》在克恩特納門劇院首演，劇院樂長米夏埃爾·烏姆勞夫指揮，貝多芬在臺上站在他旁邊。5 月 23 日在大雷杜滕廳的第二場，聽眾稀落，票房讓他失望。
    story_prose:
      opening:
        - 1824 年春，維也納。貝多芬幾乎全聾了，正為自己的新作籌一場音樂會，壓軸是《第九交響曲》。排練裡樂隊奏出了什麼，他得靠別人在談話簿上寫給他看。
        - 史實裡，合唱和樂隊分屋排練，直到首演前兩天才第一次合在一起。5 月 7 日首演之後，23 日在大雷杜滕廳又演了一場，座位空了不少，票房讓他失望。在這條分支裡，抄譜人的桌上壓著沒乾透的分譜，劇院後頭的女高音揉著喉嚨，抱怨末樂章的高音。
        - 這一趟用得上三種人：懂樂譜、合排時守得住拍子的人，聽得出毛病、肯一條條記給作曲者看的人，說得動人、趕在城裡人散去之前把座位訂出去的人。
      outcomes:
        all: 5 月 23 日那晚，大廳裡空座位還是不少，前面訂過座的那幾排坐滿了人。那張名單，後來一直夾在他的談話簿裡。
        p3: 5 月 23 日那晚，大廳裡空座位還是不少，訂過座的那幾排坐滿了人。
        p2: 首演那晚，幾處畫過記號的進口，各聲部都照著演了。那張紙後來夾在他的談話簿裡。
        p1: 5 月 7 日晚上，合唱和樂隊在同一處進拍。貝多芬站在烏姆勞夫身旁，背對著觀眾。
      none: 5 月 23 日的大廳裡，一排排空椅子在燈下擺得整整齊齊。
      desync: 5 月 5 日的合排上，兩邊的進口始終沒對齊。{staff}被召回時，離首演只剩兩天，樂隊裡還有人在爭該從哪一拍進。
      not_admitted: '{staff}沒能進劇院的後臺。合唱和樂隊還在各自的屋裡練，離首演沒剩幾天了。'
      points:
        p1: 5 月 5 日，合唱和樂隊第一次擠進同一間屋子。開頭幾小節，兩邊各按各的速度進來。{staff}站在樂隊和合唱之間，照著總譜一拍一拍打給兩邊看。再來一遍，兩邊一起落了拍。貝多芬站在角落裡，聽不見，只看見所有人的弓和嘴在同一刻停了下來。
        p2: 總排那天，{staff}把前一天合排裡出錯的幾處進口抄在同一頁紙上，寫明哪一聲部、第幾小節、差在哪裡，遞給貝多芬。他把紙湊到眼前看了很久，又拿筆在幾處旁邊一一畫了記號。紙遞回來的時候，記號壓著記號。
        p3: 五月下旬，城裡有錢的人家開始往鄉下運箱子。{staff}揣著節目單一家家敲門，有一家的管家只開了半扇門，說老爺後天就走。{staff}把節目單展開，指著《第九交響曲》那一行，說寫這首曲子的人已經聽不見了。管家拿著單子進去，出來時手裡多了一張訂金的條子。那天晚上，訂座的名單送到貝多芬住處。他把那張紙壓在談話簿底下，名字一個一個往下看，看到最後一個，又從頭看了一遍。
      excerpts:
        p3: 那天晚上，訂座的名單送到貝多芬住處。他把那張紙壓在談話簿底下，名字一個一個往下看，看到最後一個，又從頭看了一遍。
        p2: 他把紙湊到眼前看了很久，又拿筆在幾處旁邊一一畫了記號。紙遞回來的時候，記號壓著記號。
        p1: 再來一遍，兩邊一起落了拍。貝多芬站在角落裡，聽不見，只看見所有人的弓和嘴在同一刻停了下來。
    relic: 一隻助聽喇叭
