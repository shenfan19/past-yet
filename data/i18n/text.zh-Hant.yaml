      p2: 鮮食先分給修船的人。圖帕亞還得等，才有自己的一份。
      p3: 身邊的人又被叫去別的病榻。圖帕亞想見泰阿塔，還要接著等。
    shift:
      p1:
        was: 1770 年 6 月 10 日夜到 11 日，奮進號撞上今天的奮進礁，船員扔掉六門炮、壓艙物、淡水和壞了的存糧，漲潮時船才浮起來。
      p2:
        was: 1770 年 6 月 16 日，班克斯記下圖帕亞壞血病很重，牙齦壞了，腿上起了青紫的斑，船上的藥都不管用。
        now: 這條分支裡，修船期間圖帕亞分到了鮮食。他挑得出自己吃得下的東西，也不用先出門捕魚。
      p3:
        was: 在巴達維亞，班克斯先收到泰阿塔的死訊，又收到圖帕亞的死訊。
        now: 這條分支裡，{staff}替圖帕亞在泰阿塔身邊留了座。兩人商量誰可以留下陪他們，也有了一點時間說話。
    vignettes:
      pronounce: 一位編出來的抄圖人以為兩種拼法是兩座島。{staff}請他先把兩個名字念出來，他便在名字旁留了個問號，沒畫新島。
      route: 抄圖人要在兩個記號之間拉一條直線，{staff}問剛才說方位是從哪座島算起的，那條線就沒有畫下去。
      room: '{staff}壓住捲起的紙角，下一個名字寫下去時，就不會蓋住上一個。'
  ulugh_beg_samarkand:
    name: 出撒馬爾罕的那條路
    place: 撒馬爾罕
    figure: 兀魯伯
    story: 兀魯伯在撒馬爾罕修建天文臺，主持編成收有 1018 顆星的星表。1449 年秋他失去權位，獲准前往麥加。十月下旬，他在撒馬爾罕附近遇害。墓碑所載的卒日是 10 月 27 日，另有文獻記早兩天。
    story_prose:
      opening:
        - 撒馬爾罕，剛收好的星表旁壓著要帶出城的東西。兀魯伯已經交出權位，外面等著上路的人。有人問，出了城今晚準備在哪裡停。
        - 兀魯伯曾在撒馬爾罕主持天文觀測。他在 1449 年離城後遇害。這條分支可以替他問清第一處落腳地方，讓他自己決定是否有人陪著。
        - 找會與同行人商量、能照顧旅途的人。先問兀魯伯願在哪裡停，再和能接待他們的人核實。
      points:
        p1: 兀魯伯說有人已經去催行李，不知今晚能否有地方坐下。你向出來送他的同行人說了前頭願留門的一家，再請兀魯伯自己答應是否同去。他把沒帶走的星表交給在場的人，揀了只輕包跟上。到留門那處，他先請替他帶路的人也坐一坐。
      outcomes:
        all: 兀魯伯到得了出城後的第一處住處。這條分支留有他那晚平安的消息。
        p1: 按他同意的安排，有人陪他走到落腳處。星表仍留在城裡。
      none: 他跟著原先等行李的人出了城。再傳回來的，是他在城外遇害的消息。
      not_admitted: 來客沒獲准跟著出門。星表留在屋裡，門外的人已帶著行李離開。
      excerpts:
        p1: 到留門那處，他先請替他帶路的人也坐一坐。
    relic: 一張星表來源籤
    relic_desc: 一行記舊錶星位，一行留給新的觀測。
    points:
      p1: 兀魯伯交出權位後，替他商量出城以後的第一個落腳處，陪他走一段路
    points_fail:
      p1: 他跟等著出發的一行人離開。再聽到他的消息時，他已經在城外遇害了。
    shift:
      p1:
        was: 兀魯伯交出權位後離開撒馬爾罕，於 1449 年十月下旬在城外遇害。
        now: 這條分支裡，{staff}陪兀魯伯到了事先商量好的落腳處。他平安度過了離開撒馬爾罕的這段路。
        who: ulugh_beg_samarkand
        bio: 這條時間線裡，兀魯伯在 1449 年秋平安離開撒馬爾罕，活了下來。
    vignettes:
      source: '{staff}在抄寫人的紙上添了窄窄一欄“來歷”，舊錶取來的位置和今夜量到的位置就不會擠在同一行裡。'
      arc: '{staff}順著子午弧的溝槽拉了一根繩，和石匠們從這頭走到那頭，看弧線正不正。'
      hold: '{staff}守著一隻火盆，坐在子午弧邊，膝上擱一塊木板，讀數報一個記一個，直到那顆星沉到牆後。'
  darwin_galapagos:
    name: 島嶼與生命的多樣
    place: 加拉帕戈斯群島
    figure: 查爾斯·達爾文
    story: 1835 年 9 月到 10 月，達爾文隨小獵犬號到訪加拉帕戈斯。在查爾斯島，副總督勞森告訴他各島的龜彼此不同；達爾文後來寫道，他當時沒有留心，已把兩座島的採集混在一起。10 月 8 日到 17 日，他和拜諾幾人帶著帳篷留在詹姆斯島，船去別處取水，營地旁只有一眼可憐的小泉。他的鳥類筆記把嘲鶇標本和各自採集的島對應起來。
    story_prose:
      opening:
        - 小獵犬號把達爾文一行留在島上，到別處取水去了。詹姆斯島的帳篷剛支起，營地旁邊的小泉流得很慢。裝標本的紙包還沒捆好，有兩隻鳥的標籤寫在同一張紙上。
        - 1835 年，副總督勞森告訴達爾文，各島象龜有可辨的區別。達爾文後來記下自己沒有及時留心。詹姆斯島的隊伍靠小泉待到船返。這裡可以提前分島標記，也可以保住最後一段岸上採集。
        - 擅長觀察、核標籤的人先隨達爾文聽勞森說完。到詹姆斯島再派能照應水和駐地的人同去。
      points:
        p1: 水壺眼看就快見底，泉旁還排著兩個人。你把營地能用的水和這半天要供幾個人講清，請帶路的人再去問先前替他們取水的人。等水到了，拜諾才叫人把已經裝好的標本從帳邊收好。船重新到外灣時，最後一批紙包和空水壺放在一起等裝船。
        p2: 勞森說看殼就知道是哪座島的龜，達爾文問了一個地方名就想接著走。你將兩張標本紙打開，請他按原來採集時的去向說一次。記到說不準的就標待核，後採到的另包一處。第一張核好的標籤用新繩系回去，島名留在紙包外。
      outcomes:
        all: 島名和分包的標本能逐份核對。詹姆斯島的隊伍也帶齊採集物回到船上。
        p1: 營地撐到船回，收集的標本照期上船。較早的島名還有幾處無法查明。
        p2: 一點島嶼記錄單獨保存。營地之後沒能撐到完成採集，報告保存這一段在查爾斯島的核對。
      none: 泉眼旁只有原先那幾只水壺，沒去另找水。較早的標本包也未寫清島名。
      not_admitted: 離船的名單裡沒有來客。一隻包已經放進小艇，你從甲板上看不清標籤。
      desync: 回程前營地斷水，詹姆斯島的採集沒能完成。事務所發來召回。
      excerpts:
        p1: 船重新到外灣時，最後一批紙包和空水壺放在一起等裝船。
        p2: 第一張核好的標籤用新繩系回去，島名留在紙包外。
    relic: 一根雀的羽毛
    relic_desc: 來自群島的一根小小的褐色羽毛。
    points:
      p1: 詹姆斯島營地旁只有一眼小泉，護住岸上這一小隊撐到船回來，把島上的採集做完
      p2: 勞森說各島的龜一看就分得出時，讓達爾文當場留了心，把各島的鳥分島記下、分開裝好
    points_fail:
      p1: 岸上小隊斷了水，詹姆斯島的採集沒能做成，這條分支與歷史脫了節，事務所當天召回員工。
