    figure: 奧維爾和威爾伯·萊特
    story: 1903 年九月，萊特兄弟帶著一架裝了發動機的飛機回到基蒂霍克附近的營地。12 月 14 日威爾伯的嘗試沒有成功。12 月 17 日上午他們飛了四次，第一次 12 秒，最後一次 59 秒。當天下午，兄弟倆走到基蒂霍克，給代頓的父親發了電報。
    relic: 一片螺旋槳葉
    relic_desc: 一片木頭葉子，像一隻扭過的翅膀。
