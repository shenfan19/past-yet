    relic: 集市上的陶杯
    relic_desc: 一隻雅典的黑釉陶杯，杯沿磕掉了一小塊。
    points:
      p1: 陪審席上的喧嘩一陣陣壓過來時，護住他把申辯講完
      p2: 幫他把獄中改寫成詩的伊索寓言和獻給阿波羅的頌歌寫完，抄一份帶出獄外
