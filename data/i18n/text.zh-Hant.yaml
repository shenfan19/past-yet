      differences: 幫手指著兩隻相似的鳥，準備合寫一條。你問它們各來自哪座島。他把兩個標籤都留在冊上，下次好重新比較。
      drawer: 幫手能把地名念回給你以前，你一直把籤放在盤旁。抽屜關上時，紙籤仍在對應的標本旁。
  finlay_havana:
    name: 蚊子與黃熱病
    place: 哈瓦那
    figure: 卡洛斯·芬萊
    story: 卡洛斯·芬萊 1881 年在哈瓦那提出黃熱病蚊媒傳播的假說，論文題目也表明其假說性質。
    story_prose:
      opening:
        - 哈瓦那暑熱未退，芬萊將要宣讀的稿子放在課桌邊，病例筆記另壓在一封信下。有人來問文章首行怎麼寫，預備把它放進議程。芬萊把題目裡的「假說」讀得很清楚。
        - 1881 年 8 月 14 日，芬萊在哈瓦那科學院宣讀黃熱病的蚊媒傳播假說。廣泛採取防蚊行動還在多年以後。這條分支可以先保住宣讀，再請留下的院士聽明白已有記錄支持到哪一步。
        - 擅長核對稿件的人護住議程上的一份。善於組織討論的人，問院士願不願約時間審閱材料，再把公共防蚊的議案交給市裡。
      points:
        p1: 書記說還有一頁沒人看過，不能跟著其餘稿子一起送上臺。你拿出芬萊核過的目錄，把兩個紙包按標記分開，才發現那頁夾在病例記錄的封裡。芬萊把該宣讀的一份重新合上。輪到他起身時，書記念出的題目和他手裡的相同。
        p2: 讀畢，最靠門的人已經拿了帽子。你請他聽完芬萊一句話，看看哪條記錄願意留下核查。對方坐下來，只問了一處，另一位院士把下一次可來看材料的日期寫到空頁邊。芬萊從桌上把要討論的那疊抽了出來，等兩人都看見才合好。
        p3: 給市裡看的紙上原來有一句「已經證實」。你請芬萊把已有觀察和下一步要核查的事分成兩項，讓議事的人知道該答覆哪一條。他們同意提前撥給公共防蚊一筆試行經費。書記蓋章前，留下原來的「假說」兩個字。
      outcomes:
        all: 芬萊讀完論文，病例有人回看。市裡的公共防蚊工作在這條分支提前開始，仍要看實際成效。
        p1: 科學院聽到了這篇論文，宣讀稿留在檔裡。之後是否跟進仍要等院士決定。
        p2: 有幾個人留下問了記錄，查閱日期也寫好了。市裡還沒有開始行動。
        p3: 公共防蚊的試行議案有了回執。報告只將提早行動寫在這條分支。
      none: 會場散了，下一次討論的日子還是空著。
      not_admitted: 門口只讓已經排上議程的人進去。你從外間聽到書記報出第一項。
      desync: 宣讀稿沒有備齊，八月十四日那次會議聽不到芬萊的論文。事務所召回員工。
      excerpts:
        p1: 輪到他起身時，書記念出的題目和他手裡的相同。
        p2: 芬萊從桌上把要討論的那疊抽了出來，等兩人都看見才合好。
        p3: 書記蓋章前，留下原來的「假說」兩個字。
    relic: 一片蚊子的玻片標本
    relic_desc: 一片標本，裡面有一隻蚊子的翅。
    points:
      p1: 黃熱病季裡護住他的論文稿和病例筆記，讓他 8 月 14 日照期在科學院宣讀
      p2: 宣讀之後，勸幾位院士留下來看他的病例，不讓論文在一片沉默裡被擱下
      p3: 幫他把蚊子和病例整理成能讓人信服的證據，讓這座城早些年開始防蚊
    points_fail:
      p1: 病例筆記在黃熱病季裡散失，8 月 14 日沒有宣讀，這條分支與歷史脫了節，員工被送回。
      p2: 會場照舊一片沉默，沒有人要看一份病例，這條分支裡論文照舊被擱在一邊。
      p3: 他的證據照舊單薄，這條分支裡這座城照舊又等了二十年才對蚊子動手，在那之前黃熱病每年夏天照舊回來。
    shift:
      p1:
        was: 1881 年 8 月 14 日，卡洛斯·芬萊在哈瓦那皇家科學院宣讀《作為黃熱病傳播媒介的蚊子假說》。
      p2:
        was: 1881 年 8 月 14 日的宣讀之後，會場一片沉默，這個說法此後多年被人嘲笑。
        now: 那天散會後，有幾位院士留了下來，要看他的病例筆記。
      p3:
        was: 1881 年以後，芬萊用了將近二十年去證明蚊子傳播黃熱病，直到 1900 年美國陸軍黃熱病委員會用他培育的蚊子做實驗，才證實他是對的。
        now: '{staff}幫他把蚊子和病例一一對上，直到證據站得住。這條時間線裡哈瓦那早了些年開始防蚊，黃熱病也早些離開了這座城，芬萊在自己的年代就被人相信了。'
        who: finlay_havana
        bio: IF 線裡，芬萊的蚊媒說法在 1881 年後幾年內就被接受，哈瓦那遠在 1900 年以前就照著它防蚊。
    vignettes:
      headline: 虛構的編輯把一個推測寫成了確定的事。你慢慢念回原題，他在校樣交出去前把「假說」兩字補回去。
      columns: 編輯把筆記裡每一行都照同一種意思念。你劃成所見和所推兩欄，有一句移到了另一邊。
      place: 你核對宣讀論文的地點。編輯把地名記在日期旁，後來的報道才不會把會議說成另一場。
  humboldt_chimborazo:
    name: 雪線以上的那道深溝
    place: 厄瓜多爾欽博拉索山
    figure: 亞歷山大·馮·洪堡
    story: 1802 年 6 月 23 日，洪堡與埃梅·邦普蘭、卡洛斯·蒙圖法爾攀登欽博拉索山。挑夫不肯再往上走，三人流著鼻血、嘔吐、頭暈，繼續向上，直到山頂以下一道深溝擋住去路，只得折返。
    story_prose:
      opening:
        - 欽博拉索山的雪線上，邦普蘭把氣壓計交給洪堡，騰出手來扶自己的包。蒙圖法爾停在一塊能看見前方的石上。他指的深溝，在雲挪開以前看不到邊。
        - 1802 年 6 月 23 日，洪堡等人攀登欽博拉索，因深溝折返。這裡的分支讓一行人找到可以續行的路，從山頂下來才能帶回結果。
        - 找能在高處照應同伴的員工。用事務所道具相助時，仍讓每個人自己說願不願繼續。
      points:
        p1: 前面有人踩到雪邊就停了，下來告訴洪堡那裡沒有穩的落腳處。你讓一行人先在能站穩的地方歇下，等另一組把可走的地形看明白，再商量要不要繼續。洪堡和邦普蘭交換著提儀器，回來時蒙圖法爾走在能看見兩人的地方。下到原先歇腳的石邊，他們才取出在頂上寫的那半頁記錄。
      outcomes:
        all: 這一趟確實到了頂，也全員回到原先的歇腳處。報告在山頂記錄旁另記了下來的時刻。
        p1: 他們沿本趟找到的路上去，也照原先約好的次序回到山下。
      none: 看到深溝，一行人折返。回到有同伴等著的地方，紙上只有他們實際到過的高度和所見。
      not_admitted: 隊伍出發時沒留下帶你同行的位置。你在下面接到一隻空的儀器套。
      excerpts:
        p1: 下到原先歇腳的石邊，他們才取出在頂上寫的那半頁記錄。
    relic: 一支氣壓計
    relic_desc: 一支裝著水銀的氣壓計，玻璃管上刻著高度。
    points:
      p1: 6 月 23 日那道深溝擋住去路之前，幫一行人頂住高山病，找到越過去的路，登上欽博拉索山頂再平安下來
    points_fail:
      p1: 他們照史實在那道深溝前折返，沒有登頂。
    shift:
      p1:
        was: 1802 年 6 月 23 日，洪堡、邦普蘭和卡洛斯·蒙圖法爾攀登欽博拉索山，一路流鼻血、嘔吐、頭暈，在山頂以下被一道深溝擋住，只得折返。
        now: 他們越過那道深溝，站上了欽博拉索山頂，又平安回到營地。
        who: humboldt_chimborazo
        bio: 這條時間線裡，洪堡 1802 年 6 月 23 日與邦普蘭、蒙圖法爾一同登上欽博拉索山頂，平安下山。
    vignettes:
      turn: 虛構讀者把線路一路畫上山頂。你問日記寫到哪裡就停止往上走了。他把最後一記往山坡下移，沒再碰山頂。
      units: 讀者要只抄一個高度，把單位省掉。你請他把原單位和測數放在一起，另留一行給今天的換算。
      names: 你請讀者在洪堡旁留出地方，記下另外幾名同行者。折起紙以後，名單仍跟著當天攀登的記錄。
  ibn_khaldun_cairo:
    name: 亞歷山大港的那條船
    place: 開羅
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦 1382 年應蘇丹巴爾庫克之邀來到開羅。1384 年，蘇丹請突尼斯的君主放他的家人來埃及，8 月 8 日又任命他為馬立克派首席法官。從西邊來的外人坐上這個高位，城裡的對手很快就開始設法把他拉下來。同年，載著他妻女的船在亞歷山大港沉沒。他在《歷史緒論》中提出，史家要用所寫社會中可能發生的事情檢驗傳聞。
    story_prose:
      opening:
        - 開羅的書記把一張任命稿和一份要複核的名字放在同一案上。伊本·赫勒敦問哪個人在外面等。他還在等另一封信，想知道妻女從突尼斯來埃及的船到哪兒了。
        - 1384 年，伊本·赫勒敦在開羅獲任首席法官。後來載他妻女的船在亞歷山大港遇難。這趟可以保住任命經過，之後到港幫船上的人獲救。
        - 讓擅長與書記辦交接的人候在開羅。能同水手配合或在港口照應落水者的人，再儘早去亞歷山大。
      points:
        p1: 書記說要重抄名字，等另一位經辦人來才知道寫誰。你請他先把已經收到的任命和來人的說法逐條核一遍。核到日期一行時，負責交文書的人唸了伊本·赫勒敦的全名。書記把原來擱在案邊的任命放回當天要發出的那摞。
        p2: 港邊有人喊看見了人，又在浪蓋過來時丟了位置。你請岸邊的人繼續指向同一處，讓出位置給已經出船幫忙的水手。等伊本·赫勒敦的妻女被接到岸邊，守在屋口的人才問先送哪邊的消息。給開羅寫信的人等到她們親自答話，才落了筆。
      outcomes:
        all: 伊本·赫勒敦按史實就任。來自港口的急信寫的是家人已被接上岸，這一趟的開羅學者會等到另一份消息。
        p1: 任命照原日發出。船仍在亞歷山大遇難，他的家人沒能來到開羅。
        p2: 妻女在港邊有人照料，能把消息帶給開羅。任命脫節，回程記錄只留下這段救助。
      none: 開羅的人等文書，港上的人等風停。那封報平安的信沒有寫出來。
      not_admitted: 等在外頭的人沒獲准遞交任命稿，船訊也還沒有傳進這間屋。
      desync: 本該發給伊本·赫勒敦的任命改了收件人。任命失去同步，事務所召回員工。
      excerpts:
        p1: 書記把原來擱在案邊的任命放回當天要發出的那摞。
        p2: 給開羅寫信的人等到她們親自答話，才落了筆。
    relic: 一頁核對過的記錄
    relic_desc: 一頁隊伍經過的記錄，頁邊寫著看的人當時站在哪裡。
    points:
      p1: 對手要把外來的人擋在法官席外時，護住他 8 月 8 日出任馬立克派首席法官
      p2: 載著他妻女的船在亞歷山大港沉沒時，把船上的人從水裡拉上來，救下她們
    points_fail:
      p1: 這條分支裡，8 月 8 日的任命落到了別人頭上，與歷史脫了節，事務所當天召回員工。
      p2: 那條船照史實在亞歷山大港沉沒，船上的人無一生還，他的妻女沒能到開羅。
    shift:
      p1:
        was: 1384 年 8 月 8 日，蘇丹巴爾庫克任命伊本·赫勒敦為開羅馬立克派首席法官；城裡的對手處處與他為難，第二年他就丟了這個職位。
      p2:
        was: 1384 年，載著伊本·赫勒敦妻女從突尼斯來埃及的船在亞歷山大港沉沒，船上的人無一生還。
        now: 船上的人在亞歷山大港被救了上來。他的妻女隨後到了開羅，一家人又住在了一起。
        who: ibn_khaldun_cairo
        bio: 這條時間線裡，1384 年在亞歷山大港沉沒的那條船沒有帶走他的家人，妻女獲救，到開羅與他團聚。
    vignettes:
      gate: '{staff}問一位編出來的書吏，人群過城門時門開了多久。書吏把時辰寫在總數旁的頁邊，又把總數改成了估算。'
      two: 另一位編出來的見證人站在街對面。{staff}給她另騰一頁紙，她說的那段街景就不必擠在書吏那張紙的邊上了。
      copy: '{staff}替法庭裡一個學生抄了一頁《歷史緒論》，行與行之間留出一指寬，給學生以後寫批註。'
  lili_boulanger_paris:
    name: 桌上攤著幾份聲部譜
    place: 梅齊
    figure: 莉莉·布朗熱
    story: 1918 年冬，莉莉·布朗熱在塞納河畔梅齊病得很重。關於她最後一部作品的記述寫到，她把《Pie Jesu》口述給姐姐娜迪亞。樂譜寫給人聲、絃樂四重奏、豎琴和管風琴。3 月 15 日，莉莉去世，終年二十四歲。
    story_prose:
      opening:
        - 譜桌上的紙分成已謄好和還等著口述的兩份。娜迪亞剛寫下一個音，莉莉請她先把筆放一放。隔著幾張薄紙，已經寫下的最後一小節還有些看不清。
        - 莉莉·布朗熱病中口述了她生命最後階段的樂曲《Pie Jesu》，由姐姐娜迪亞記譜。她在 1918 年 3 月 15 日去世。這裡能做的是按她自己的節奏暫停，等她要繼續時把最後記下的地方還給她。
        - 會讀譜的員工可以陪娜迪亞記位置。等莉莉說想繼續時，才念出上一段。
      points:
        p1: 娜迪亞要順手翻過去，莉莉說先別。你拿一根窄紙條標在剛才那一節，給兩個人都能看見的位置。屋裡歇了一會兒，等莉莉先開口，你才把娜迪亞記下的幾拍數給她聽。莉莉改了一個音，娜迪亞就在原來的那一行接著寫。
      outcomes:
        all: 莉莉自己定了何時繼續。桌上留下口述過的樂句，三月十五日的死訊仍進了後來的記錄。
        p1: 等她準備好，娜迪亞從標出的地方繼續記譜。這一回，她不用重說暫停前的整段。
      none: 停了一會兒再看譜時，姐妹要從上面幾行找起。莉莉又將剛才說過的一段分開說完。
      not_admitted: 娜迪亞請來客把腳步放輕，在外面等。休息前最後那一段仍只有姐妹倆聽到。
      excerpts:
        p1: 莉莉改了一個音，娜迪亞就在原來的那一行接著寫。
    relic: 一條夾譜的窄紙
    relic_desc: 虛構夾條，記口述暫時停在第幾小節。
    points:
      p1: 莉莉想歇一會兒時替娜迪亞標好譜上的位置，再按莉莉的意思念回剛記下的一段
    points_fail:
      p1: 停下來以後，姐妹倆要重新找口述的位置。莉莉今天剩下的力氣，有一部分得花在重複已經說過的地方。
    shift:
      p1:
        was: 關於《Pie Jesu》的記述寫到，莉莉病重時由姐姐娜迪亞幫她記譜。
        now: 這條分支裡，莉莉停下時，{staff}替姐妹倆留好了記號。等莉莉覺得能繼續了，娜迪亞念回最後一段，莉莉從自己挑的停頓處接著說。
    vignettes:
      entry: '{staff}請娜迪亞翻頁前指一下剛記的音。她用手指壓著那一行，再核上面的聲部。'
      visitor: 門口有人問還剩多少譜。莉莉決定是否休息時，{staff}請來人把話先留在外面。
      stand: '{staff}在譜架上騰出一塊地方，讓娜迪亞擱筆時不用壓住譜紙。'
  jianzhen_nara:
    name: 回揚州的長路
    place: 嶺南
    figure: 鑑真
    story: 鑑真第五次嘗試前往日本，船卻被風吹到海南。北返途中，曾來揚州請他東渡的日僧榮叡在端州病逝。鑑真在路上失明，兩部早期文獻對經過的記述不同。
    story_prose:
      opening:
        - 端州，同行人把剛抄好的路引擱在門邊。榮叡的屋裡有人坐著，幾次讓外面傳話的人等。鑑真來問，能不能讓他先進去坐一會兒。
        - 《唐大和上東征傳》記鑑真一行過端州時，榮叡在那裡去世。其後鑑真視力減退，一行繼續返回揚州。分支借這段行程寫兩件小事，先給兩人留一段說話的時間，之後讓鑑真聽得到行程。
        - 懂照護的人可以先去問榮叡所願。會讀路引或能聽清多方說法的人，再把後面的去向一處處念給鑑真。
      points:
        p1: 等外面來問行期的人走開，你先問榮叡願不願讓鑑真進來。他點頭，要端來一把不擋門的凳子。你與旁人說定這段工夫先不傳話，轉到院子裡等。門裡傳來兩個人說話的聲音，聲音輕了也沒人催他們。
        p2: 路引疊了幾層，同行人正想直接告訴鑑真已經定好的走法。你先把還沒確定的幾個地方念出聲，讓他聽見哪裡需要留一宿。鑑真問其中一處的名字，又聽了一遍，才說自己想先走哪一段。有人把他的決定寫到原先只留著地名的那張紙上。
      outcomes:
        all: 榮叡和鑑真有過一段說話的工夫，榮叡仍在端州去世。往後鑑真看不清字時，一行人照著他聽過的路線走。
        p1: 兩人保住那一場會面。榮叡仍去世；後來路引上的字，鑑真還要別人慢慢轉告。
        p2: 鑑真聽過下一程，自己說了想走的路。榮叡身邊那段沒說完的話沒有補回來。
      none: 路引重新捆成一束。屋裡要傳的話和屋外要走的路，都還等旁人來說明。
      not_admitted: 你沒能進榮叡借住的屋子。另一份路引隨同行人收回，沒從門邊念出聲。
      excerpts:
        p1: 門裡傳來兩個人說話的聲音，聲音輕了也沒人催他們。
        p2: 有人把他的決定寫到原先只留著地名的那張紙上。
    relic: 一頁行程紙
    relic_desc: 虛構路記，記一行人北上的去向。
    points:
      p1: 在端州問榮叡想怎樣被照料，再替他和鑑真留一段能說話的時間
      p2: 鑑真看不清時，把一行人的行程念出聲，請他自己決定接下來怎麼走
    points_fail:
      p1: 總有別的事要辦，守在榻邊的人一再被叫走。兩人還能說話的那段時間，就這樣過去了。
      p2: 同行的人又把路引捆回了一束。鑑真看不清紙上的字，只能等別人告訴他。
    shift:
      p1:
        was: 第五次渡海失敗後的北返途中，榮叡在端州病逝。
        now: 這條分支裡，{staff}在端州守著榮叡，把鑑真請到榻邊。兩人得空單獨說了一會兒話。
      p2:
        was: 早期文獻記載鑑真在這趟歸途中失明，後來仍東渡日本。
        now: 這條分支裡，{staff}把接下來幾個落腳處念給鑑真聽。鑑真請同行改了一站，也說明自己想什麼時候再出發。
    vignettes:
      sound: 同行人指著紙上的下一站。鑑真在聽，{staff}請對方把地名念兩次。
      tie: 一行人要把路引捆起來。{staff}撐開紙束，待有人核對完去處的先後。
      temple: '{staff}到院裡回答來人的問題，屋裡的兩人不用提高聲音就能把話講完。'
  sei_shonagon_kyoto:
    name: 皇后臨產的那個冬天
    place: 京都
    figure: 清少納言
    story: 清少納言侍奉藤原定子，也在《枕草子》中寫過定子身邊的人和事。長保二年歲末，定子生下女兒媄子內親王，不久去世。
    story_prose:
      opening:
        - 京都入冬以後，屏風邊多放了一個坐墊。清少納言問要留給誰，屋外恰好有人送話進來。定子回望那一處空位，送話人還沒有走。
        - 一條天皇時的定子在 1000 年末臨產，按換算日期於 1001 年 1 月 13 日去世。後來的清少納言在《枕草子》寫了宮中的往事。這裡可以先問定子願意誰陪著，給她自己選的人騰出位置。
        - 讓善於聽人說完的員工與清少納言一起去問。收到外面的消息時，分一人答覆，免得屋裡又要全停下來。
      points:
        p1: 清少納言拿起坐墊要往常用的位置放。你候送話人讀完，再請她問定子願意留誰。定子說了一個名字，又說那人來了就坐在燈後一點。清少納言照她指的地方放下坐墊。等屋裡安靜下來，那位被點名的人已經坐定，定子的手仍放在自己想放的地方。
      outcomes:
        all: 她要見的人留在近處。她後來仍去世，回程記錄留下的是她自己選人陪伴的這一刻。
        p1: 清少納言替定子把那隻坐墊留到來人坐下。後來的日子仍按史實記載。
      none: 門口的消息一條接一條。坐墊最後給了最先被請進來的人，來不及問定子想見誰。
      not_admitted: 外面的人沒有傳你進去。屋裡有人把椅墊換了地方，你在屏風外看不清留給了誰。
      excerpts:
        p1: 等屋裡安靜下來，那位被點名的人已經坐定，定子的手仍放在自己想放的地方。
    relic: 一張折起來的傳話紙
    relic_desc: 虛構便箋，寫著誰可以進屋。
    points:
      p1: 臨產前問定子想讓誰留在近處，幫清少納言把位置留給她想見的人
    points_fail:
      p1: 門外又有人來傳話。屋裡還沒來得及問定子願意讓誰留下。
    shift:
      p1:
        was: 宮廷紀事記載媄子內親王出生，定子隨後去世。
        now: 這條分支裡，{staff}請其他來人先在門邊等，屋裡留誰由定子自己說。清少納言聽完她的話，還來得及把下一條消息帶出去。
    vignettes:
      compare: '{staff}請傳話人摺紙前把一個名字念清。清少納言轉述時不必再問。'
      colour: 清少納言移開燈，看看燈後能否坐下。{staff}把多出的坐墊移到定子指的地方。
      listen: '{staff}等門口的消息答完，才問屋裡還有什麼需要。'
  ibn_rushd_lucena:
    name: 焚書令之前
    place: 科爾多瓦
    figure: 伊本·魯世德
    story: 約 1195 年，伊本·魯世德在穆瓦希德王朝失勢，被放逐到盧塞納。文獻還記載了禁書與焚書。他為亞里士多德《物理學》寫的長篇註釋沒有留下阿拉伯文原本，希伯來文和拉丁文譯本仍存。
    story_prose:
      opening:
        - 科爾多瓦桌上有兩封還沒送出的口信，靠門的一封寫著盧塞納。讀者問伊本·魯世德還願不願回話，又把準備抄的《物理學》長注拉近一點，好讓抄寫人看見有一處仍缺詞。
        - 伊本·魯世德約在 1195 年被放逐到盧塞納。傳記留下有關書籍受限的記述；《物理學》長注的阿拉伯文傳本殘缺。這裡可以讓散在兩地的人恢復聯繫，還可以為一節長注留出抄過的副本。
        - 會辦通信的員工先核去向和回信的收件人。能讀阿拉伯文或校注的人，替讀者對清原句與註解。
      points:
        p1: 讀者寫了好幾行，臨發只求你說一句還想接著讀。你到盧塞納把這句讀給伊本·魯世德，告訴他回信可以交給哪家。伊本·魯世德問對方讀到了第幾節，再另取紙寫回話。他遞來兩折已經合好的紙，請你交給真正還在讀的那個人。
        p2: 抄寫人的筆已經越過一處空。他說前後能接上，可讀過底本的人認得是哪一句被漏了。你請他先把那一句和長注分開按行寫，再照著復讀。副本交給讀者時，他把手壓在原句和解釋的分界處，對你說兩段他自己也能找。
      outcomes:
        all: 盧塞納和科爾多瓦之間多了一封回話。一節長注另有可查的阿拉伯文副本，其他卷頁的損失仍留在史實欄。
        p1: 伊本·魯世德知道還有人在讀。去盧塞納的信回到原處，長注副本還沒抄完。
        p2: 讀者帶走校過的抄頁。他要寄去盧塞納的話仍未送出。
      none: 一封信和一張半抄的頁都在原處。讀者要等下一次來的人。
      not_admitted: 門邊暫不收陌生人代送的信。你沒能讓讀者托的那句話傳進去。
      excerpts:
        p1: 他遞來兩折已經合好的紙，請你交給真正還在讀的那個人。
        p2: 副本交給讀者時，他把手壓在原句和解釋的分界處，對你說兩段他自己也能找。
    relic: 一頁讀書練習摘錄
    relic_desc: 摘錄，為前提另留一處。
    points:
      p1: 從科爾多瓦給盧塞納的伊本·魯世德捎個口信，告訴他還有讀者想跟他通信，也願意收他的回信
      p2: 焚書令下來前，把《物理學》阿拉伯文長注的一節抄校清楚，另留一份給讀者
    points_fail:
      p1: 讀者寫好的便條還在科爾多瓦，只能等下一次有人捎過去。
      p2: 副本還沒抄完。離開時，讀者沒有可以帶走的阿拉伯文抄頁。
    shift:
      p1:
        was: 伊本·魯世德失勢後被放逐到盧塞納，後來獲准回朝。
        now: 這條分支裡，一張讀者寫的便條到了盧塞納。伊本·魯世德可以趁還有人捎信時寫封回信。
      p2:
        was: 伊本·魯世德的《物理學》長篇註釋失去了阿拉伯文原本，保存下來的是中世紀譯本。
        now: 這條分支裡，有一節對過的副本在禁書後仍留在讀者手裡。他再遇到別的抄本，還有阿拉伯文可以對照。
    vignettes:
      premise: 瑪麗婭姆把結論抄得很工整。優素福要讀通，卻得先替她猜一個沒寫出來的前提。你問他讀到哪兒卡住，在結論前留出地方。瑪麗婭姆把前提寫進去，優素福終於能就它發問。
      together: 優素福想把書還了，只給自己留一句。你給他留點時間，把旁邊那一步也抄走。到了門口，瑪麗婭姆請他複述結論，他如今也說得出理由。
      language: 你認得一個後來會在譯本里出現的術語。瑪麗婭姆只想核對前提有沒有照原樣抄下。你幫她把紙鋪平，陪她查。她在邊上寫的問題，會交給這趟見不到的人。
  maya_codices_mani:
    name: 記住書頁怎樣折
    place: 馬尼
    figure: 瑪雅書吏
    story: 1562 年 7 月 12 日，殖民當局在馬尼公開焚燒瑪雅書籍和其他器物。瑪雅社群繼續創造和傳承知識。西班牙征服之前製作的摺頁書，今天只存下少數幾部。
    story_prose:
      opening:
        - 尤卡坦的馬尼。守書人把一本摺頁書橫放在席上，翻到小孩曾跟著讀的一頁。鄰村來客說自己今天要回去，出門前問她願不願把一本交到他手裡。
        - 1562 年 7 月，馬尼發生了有記錄的焚書。倖存的瑪雅抄本保留文字和圖像，不能確定某個現存抄本就在這裡。這個分支寫一位虛構的守書人替自己手裡的一本書選保管人。
        - 找願意聽守書人介紹書頁的人。她若同意交託，就按她說的折法把書合起來，再當面問接書人要怎樣讓後來的人看得到。
      points:
        p1: 守書人打開第二折，指著一處過去看錯過的頁邊。你請接書人照她翻的方向讀一次，讓她確認兩個人能在同一處停下。她把這一冊從其他書旁抽出來，用舊布裹好，親手遞過席子。接書人接穩後仍坐在那裡，等她把最後一折的記號說明。
      outcomes:
        all: 有一冊到了守書人選定的地方。馬尼的焚書仍發生，這份虛構分支只存下她親自交出的那一本。
        p1: 接書人走時把包布抱在身前。等書再打開，照她講過的法子能找回第二折。
      none: 熟識的讀者空手離開。守書人把書攤開又收起，仍須決定先放在哪裡。
      not_admitted: 守書人沒同意讓來客碰頁。你從門邊看到她把書轉回來，繼續和鄰村來的人說話。
      excerpts:
        p1: 接書人接穩後仍坐在那裡，等她把最後一折的記號說明。
    relic: 一張空白練習摺頁
    relic_desc: 守書人自願交給員工的練習摺頁。
    points:
      p1: 問守書人願把哪一本交給鄰村熟識的讀者，幫她親手交託
    points_fail:
      p1: 她選的讀者走時沒能帶上書。接下來把書放在哪裡，還得由守書人自己決定。
    shift:
      p1:
        was: 1562 年 7 月 12 日，馬尼當眾燒燬了大批瑪雅摺頁書。征服以前的瑪雅書，存世的只有寥寥幾部。
        now: 這條分支裡，守書人替其中一本書選好了接手的人。書送到了下一位讀者手裡，焚書過後，還留在瑪雅人手中。
        who: maya_codices_mani
        bio: 這條分支裡，1562 年公開焚書前，馬尼的一冊書由守書人親自交給了自己選定的讀者。
    vignettes:
      fold: 守書人把兩張空摺頁放在凳上，問鄰居記得那本書從哪一折先打開。你扶住紙，讓他們比對。他說不準第二折在哪裡。她把第一折收好，第二折不合上，等下次兩人再談。
      listen: 鄰居說起守書人記不清的那段，兩人記得的次序卻不一樣。你聽他們各自講完。他們同意第一折，第二折先不定。守書人請你把兩種說法都在的那份留給她。
      survive: 你在後世館藏裡看過一部存世瑪雅抄本。守書人問，你能不能說出鄰居記的是哪一本。你能說出藏在哪兒，卻對不上這一屋人記得的頁。她給你一張空白練習摺頁帶走。那本書留在了他們的講述裡。
  zeami_sado:
    name: 紙上的金島
    place: 佐渡島
    figure: 世阿彌
    story: 1432 年，世阿彌的兒子元雅去世。世阿彌在《卻來華》中寫到這場失去，1434 年被流放佐渡。《金島書》記著他渡海和在島上的經歷，定稿記年為 1436 年。
    story_prose:
      opening:
        - 佐渡島上，一位念詞人拿來一張能折進口袋的紙。世阿彌已經聽見他在門口練過兩遍，每回都在不一樣的地方歇氣。他坐著問，這次想從哪一句開始。
        - 世阿彌晚年被流放到佐渡，《金島書》留下在島上的見聞。這個分支只設一次由他選聽、選停頓的小排演，後來留存的著作仍按史實成稿。
        - 讓聽得清節奏或擅長讀詞的員工問世阿彌是否願聽。先念一遍，再把他自己點的停頓記在獨立紙條上。
      points:
        p1: 念詞人第一遍在詞尾換氣。世阿彌請他從同一處再念，到了句中抬一下手。你看著他的手示意哪裡停，等唸完才把停法記在紙條邊上。第三遍，念詞人沒去看紙，在世阿彌抬手前就自己停在那個字上。
      outcomes:
        all: 紙條留下了他聽後點出的停頓。世阿彌把它夾回原先的頁旁，之後還會寫他自己在島上的見聞。
        p1: 世阿彌親自挑出停頓，念詞人說下次帶同一頁來。
      none: 念詞人沒等到能走進來的時候。那一折紙上還沒有標停頓。
      not_admitted: 來客還沒得到允許誦讀。念詞人收好紙，從門外退了回去。
      excerpts:
        p1: 第三遍，念詞人沒去看紙，在世阿彌抬手前就自己停在那個字上。
    relic: 一張能面
