  mendel_brno:
    name: 豌豆與遺傳的規律
    place: 布爾諾
    figure: 格雷戈爾·孟德爾
    story: 1856 年到 1863 年，格雷戈爾·孟德爾在布爾諾住處的園子裡雜交豌豆，一代代數它們的後代。1865 年 2 月 8 日和 3 月 8 日，他在布爾諾自然科學學會分兩場報告了結果，論文 1866 年刊在學會的會刊上。他生前，這篇論文幾乎沒人接著做下去。孟德爾 1884 年去世，1900 年，三位植物學家在研究遺傳時各自找到了他的論文。
    story_prose:
      opening:
        - 1865 年冬，布爾諾。修士格雷戈爾·孟德爾從 1856 年起在修道院的園子裡雜交豌豆，一代一代數它們的後代，按他自己的說法，前後八年。這個冬天，他要在布爾諾自然科學學會把這些數字講出來。
        - 史實裡，他在 2 月 8 日和 3 月 8 日分兩場作了報告，論文第二年刊在學會的會刊上。他生前，這篇論文幾乎沒人接著做下去；1884 年他在布爾諾去世，到 1900 年，才有三位植物學家各自找到它。在這條分支裡，會場門口有個鋪草墊的看門人，白菜市場有個賣乾豌豆的老太太。
        - 這一趟用得上幾種人：心細、守得住兩場報告的人；會教書、把數字一代一代拆開擺給人看的人；說得動人、散會前約得下人回去復種的人。
      outcomes:
        all: 那年秋天，一封外地來信寄到修道院，信裡是另一處園子裡數出的豌豆。孟德爾把它和自己的數字並排攤在桌上，旁邊壓著那張分代的對照表。
        p3: 那年秋天，一封外地來信寄到修道院，信裡是另一處園子裡數出的豌豆。孟德爾把兩份數字並排攤在桌上，一行一行對下去。
        p2: 那張分代的對照表，幾個聽過報告的人抄回了家。第二年會刊印出來，他們拿自己的抄本去對，一格一格對得上。
        p1: 1866 年，兩場報告合成《植物雜交實驗》，刊在學會會刊第 4 卷上。修道院的園子裡，那一年的豌豆照常下了種。
      none: 1866 年，論文刊在學會的會刊上，沒有幾個人接著做下去。修道院的園子裡，豌豆架子一到冬天就空著。
      desync: 2 月 8 日那一晚，時間只夠講完做法，第二場沒有排上。{staff}被召回時，孟德爾的稿子還有大半疊沒翻開，壓在會場的桌角上。
      not_admitted: '{staff}沒能進學會的會場，只在白菜市場幫老太太分了幾天乾豌豆。圓的一堆，皺的一堆，她從來不數。'
      points:
        p1:
          class_lettered: 2 月 8 日晚上，學會的會場點著燈，門口草墊上的雪水化了一片。孟德爾手裡的稿子，是八年的數字。{staff}照整理檔案的辦法，前一天替他把稿子分成兩疊，夾一張紙條，標明這一晚講到哪裡為止，後一疊寫上下一場的日子。講到分界的那一頁，他停下來，把剩下的稿子理齊，收進包裡。散會時，記錄本上寫好了下一場的日子：3 月 8 日。
          else: 2 月 8 日晚上，學會的會場點著燈，門口草墊上的雪水化了一片。孟德爾手裡的稿子，是八年的數字。{staff}前一夜陪他把稿子唸了一遍，看著鐘點，在講到一半的地方折了個角，後一半另放一疊。講到分界的那一頁，他停下來，把剩下的稿子理齊，收進包裡。散會時，記錄本上寫好了下一場的日子：3 月 8 日。
        p2:
          class_teaching: 3 月 8 日，第二場。他講雜種的後代怎樣分開，數字一個接一個唸出來，底下有人跟著抄，抄著抄著就分不清是哪一代了。{staff}照教書的規矩，在會場後頭的黑板上畫了一張表，第一代一欄，下一代一欄，他唸一個數，就填進一格。散會以後，幾個人還站在那張表前，拿鉛筆對著自己的本子一行行核。有人數著數著，唸出了聲：三比一。
          else: 3 月 8 日，第二場。他講雜種的後代怎樣分開，數字一個接一個唸出來，底下有人跟著抄，抄著抄著就分不清是哪一代了。{staff}事先把他的數字按代謄在一張大紙上，第一代一欄，下一代一欄，釘在會場後頭的牆上。散會以後，幾個人還站在那張表前，拿鉛筆對著自己的本子一行行核。有人數著數著，唸出了聲：三比一。
        p3:
          class_lettered: 3 月 12 日，兩場報告都講完了，聽過的人還沒有各自散去。{staff}照登記的辦法備了一本小冊子，願意回去復種的人留下姓名和地址，再寫明來年要寄回哪幾項計數。孟德爾取出一小包乾豌豆，交到第一個留下地址的人手裡，紙包上寫著品種和來年要數的幾項。那人把紙包揣進大衣內袋，扣好了釦子。
          else: 3 月 12 日，兩場報告都講完了，聽過的人還沒有各自散去。{staff}挨個去找那兩晚坐在前排的人，一家一家地說，說動了一位，就請他留下地址。孟德爾取出一小包乾豌豆，交到第一個留下地址的人手裡，紙包上寫著品種和來年要數的幾項。那人把紙包揣進大衣內袋，扣好了釦子。
      excerpts:
        p3: 孟德爾取出一小包乾豌豆，交到第一個留下地址的人手裡，紙包上寫著品種和來年要數的幾項。那人把紙包揣進大衣內袋，扣好了釦子。
        p2: 散會以後，幾個人還站在那張表前，拿鉛筆對著自己的本子一行行核。有人數著數著，唸出了聲：三比一。
        p1: 講到分界的那一頁，他停下來，把剩下的稿子理齊，收進包裡。散會時，記錄本上寫好了下一場的日子：3 月 8 日。
    relic: 一隻豌豆莢
    relic_desc: 修道院花園裡的一隻乾豆莢。
