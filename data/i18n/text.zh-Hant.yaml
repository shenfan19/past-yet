        bio: 這條時間線裡，倫勃朗在 1669 年 9 月一直畫著最後那幅畫，把它畫得比歷史上更遠。它離開畫室時，更接近他想要的樣子。
    vignettes:
      colours: 9 月 22 日下午，{staff}在玫瑰運河邊一家顏料鋪的後屋裡推研磨石，磨一板鉛白，磨到兩條胳膊都酸了，窗縫裡一陣陣進來運河上的潮氣。顏料商說如今的畫家都要白得像奶油一樣滑，他真想賣他們一罐奶油，看看誰分得出來。
      barge: 9 月 26 日，{staff}幫一個船伕撐著一船泥炭沿玫瑰運河走，船頭的泥炭濕得發黑。他說今年秋天水淺得很，每過一座橋船底都要刮一下，他已經開始跟橋下的石頭一塊塊打招呼了。
      watchman: 十一月中旬，{staff}陪守夜人冒雨走了一圈，石板路上的積水映著燈籠。他在每個街角搖一下木響板，報一聲時辰。他說這個月的雨連響板都淋進去了，搖起來像在咳嗽。
  gaudi_barcelona:
    name: 被電車撞倒
    place: 巴塞羅那
    figure: 安東尼·高迪
    story: 1926 年 6 月 7 日傍晚，七十三歲的安東尼·高迪在巴塞羅那的大道上被電車撞倒。他沒帶證件，衣著樸素，被當成乞丐，路人攔了幾輛出租車都不停。6 月 10 日，他在醫院去世，12 日安葬在他主持了四十三年的那座建築地下。多梅內克·蘇格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，圖紙和石膏模型大多毀掉。
    story_prose:
      opening:
        - 1926 年 5 月底，巴塞羅那。七十三歲的加泰羅尼亞建築師安東尼·高迪把晚年都放在城裡一座還沒完工的大建築上。他的設計用取自自然的曲線，工地上的工房裡擺滿了圖紙和石膏模型。前一年，東立面的第一座鐘塔剛剛完工。
        - 史實裡，6 月 7 日傍晚他在大道上被電車撞倒。他沒帶證件，衣著樸素，被當成乞丐倒在那裡，路人攔了幾輛出租車都不停，直到一名國民警衛逼一輛車把他送去診所，再轉進醫院；6 月 10 日他在醫院去世。弟子多梅內克·蘇格拉涅斯接手主持工程。十年後，1936 年 7 月 20 日，工房被燒，裡面的圖紙和石膏模型大多毀掉。在這條分支裡，大道的電車上有個愛拉鈴的售票員，工地上有個跟著風聲哼調子的年輕石匠，中午有個來賣水的女人。
        - 這一趟用得上幾種人：懂醫護、帶著急救包的人，心善或守得住、身子骨結實的人，或者帶著能治傷的器材的人，在電車道邊立刻把他送醫；做過木工、管過檔案的人，或者手巧、有條理的人，把進行中的工程和工房鑰匙交接清楚；同樣的人再多一點腦子或定力，說得動蘇格拉涅斯，把關鍵模型的照片、尺寸和圖紙另存一處。
      outcomes:
        all: 那年夏天，高迪又回到了工房。十年後，櫃子燒了，有人從另一處取回一本照相冊，翻開一張模型的照片，背面寫著當年的比例尺。
        p3: 那年夏天，高迪又回到了工房。他坐在門口的矮凳上看石匠們幹活，午後的風從鐘塔的孔洞裡穿過去，吹出一聲哨音。
        p2: 6 月 12 日，高迪下葬。十年後工房被燒，有人從另一處取回一本照相冊，照片背面還寫著當年的比例尺。
        p1: 6 月 12 日，高迪下葬。蘇格拉涅斯接手主持工程，工地上的錘子聲沒有停，石匠們照著那張清單往上砌。
      none: 6 月 12 日，高迪下葬。十年後，1936 年 7 月 20 日，工房被燒，櫃子裡的圖紙和石膏模型大多毀掉。
      desync: 6 月 10 日，石匠們在工房門口等了一上午，鑰匙不知道在誰手裡，進行中的活一樣也說不清。{staff}被召回時，那個年輕石匠正坐在一塊還沒放上去的石頭上，等著有人來叫他。
      not_admitted: '{staff}沒能進那座工地，只在大道上坐過幾回電車。遠處的腳手架中間立著一座鐘塔，風大的下午，隔著幾條街也聽得見一點哨音。'
      points:
        p3:
          class_medical: 6 月 7 日傍晚，大道上，一輛電車在拜倫街和赫羅納街之間猛地剎住。軌道邊倒著一個穿舊衣服的老人，幾個人圍上來看了看，又退開了。{staff}懂醫護，一分鐘內跪到他身邊，按住他的傷處，托穩他的頭，抬頭對圍著的人說出了他是誰：這是高迪，工地上的建築師。一輛出租車停了下來。車開動時，{staff}一隻手托著他的頭，另一隻手扶著車門。身後那輛電車叮地響了一聲，慢慢開走了。
