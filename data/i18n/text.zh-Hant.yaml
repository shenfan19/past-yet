    relic: 一張接唱提示紙
    relic_desc: 接唱紙，分開給兩種名字留了位置。
    points:
      p1: 他去世後貴族推舉繼承人的那幾天，護住七歲的內薩瓦爾皮利
      p2: 幫宮裡的一位學徒把與他名字連在一起的那幾首歌，從老歌者那裡一句不落地學全
      p3: 在他最後的日子裡，讓他知道五百多年後人們還記得他的名字
