  savitribai_phule_pune:
    name: 包裡多帶的一件紗麗
    place: 浦那
    figure: 薩維特麗巴伊·普勒
    story: 1848 年，薩維特麗巴伊·普勒與喬蒂拉奧·普勒在浦那開始辦女學。有關她的記述裡，有她去學校路上受到的侮辱，也有她隨身多帶、到學校再換上的那件紗麗。後來的辦學檔案記她擔任校長。1897 年，她在照顧鼠疫病人時染病去世。
    story_prose:
      opening:
        - 1848 年，浦那。薩維特麗巴伊·普勒與喬蒂拉奧·普勒開始辦女學。有關她的記述裡，有她上學路上帶在包裡、到校才換的那件紗麗。
        - 史實裡，她在去教書的路上受到侮辱，有些家庭也不願女孩去上學。在這條分支裡，有人能一起走過那條街，也能坐到一個女孩家裡聽聽她為什麼被叫回去。
        - 這一趟用得上能穩穩走過那條街的人，也用得上會教書、懂得同家人說話的人。街邊起了哄，還要有人能讓人群散開。
      points:
        p1: 街口有人朝她走過來。{staff}看住兩側的門口，陪薩維特麗巴伊走到比德府，把門推開。先來的女孩正把石板放到桌上。窗紙亮起來，低處還留著剛擦過的水印。
        p2: '{staff}在女孩家裡坐了一會兒，聽家人把話說完，又把她課堂上寫過的一行給他們看。女孩後來把石板放回原來的位置。手伸得慢，第一道筆跡卻一直寫到了邊上。'
        p3: '{staff}在那處街口站定，同攔路的人說話，等投擲的人把手放下，再陪她走過。薩維特麗巴伊到校後把包擱在桌上。那件備用紗麗一直疊在裡頭，布角還照原樣扣著。'
      outcomes:
        all: 學校繼續上課，回來的女孩也在。薩維特麗巴伊打開包取出課上用的東西，底下那道布折還整整齊齊。
        p3: 從那天起，備用的紗麗留在包底。走進教室時，她騰得出手去開窗。
        p2: 那個女孩又來上課，石板上多出一行字。下課後，她把石板橫放回原處。
        p1: 那天的課照常上了。門開著，早來的幾塊石板靠在桌腿旁。
      none: 教室裡少一塊石板，粉筆卻擱在桌邊。街口響過腳步，很快又靜了。
      not_admitted: '{staff}沒能在學校留下。半扇門擋著裡面的桌子，只看得見石板的一角。'
      desync: 去學校的那一程斷在街口。{staff}被召回時，窗下襬著的石板還沒有寫上字。
      excerpts:
        p3: 薩維特麗巴伊到校後把包擱在桌上。那件備用紗麗一直疊在裡頭，布角還照原樣扣著。
        p2: 女孩後來把石板放回原來的位置。手伸得慢，第一道筆跡卻一直寫到了邊上。
        p1: 先來的女孩正把石板放到桌上。窗紙亮起來，低處還留著剛擦過的水印。
    relic: 一塊石板
    relic_desc: 一塊小石板，上面用粉筆寫著第一排字母。
    points:
      p1: 開學頭一個月最難的那個早上，護住她去比德府的路，讓當天的課照常開
      p2: 勸回一個被家裡叫回去的女孩，讓她回到石板前
      p3: 攔下那段路上朝她扔東西的人，讓她不必再在包裡多帶一件紗麗
    points_fail:
      p1: 那天她沒能走到學校，比德府的門沒有開。
      p2: 這條分支裡，比德府的石板前少了一個人。
      p3: 她照舊每天在包裡多帶一件紗麗，這條分支與歷史一樣。
    shift:
      p1:
        was: 1848 年 1 月起，比德府的女子學校照常開課，薩維特麗巴伊每天走路去教書。
      p2:
        was: 1848 年，浦那許多人家反對女孩上學。
        now: 那個女孩又回來上課了。
      p3:
        was: 1848 年起，她去學校的路上被扔石頭和糞，包裡多帶一件紗麗，到校再換上。
        now: 從一個春天的早上起，路邊沒人再朝她扔東西，那件備用的紗麗一直疊在包裡沒用上。
    vignettes:
      slate: '{staff}把石板橫過來，讓兩個女孩都夠得著。有人來叫她們回家，石板上已經各有一道筆跡，一人能指出另一人寫的那一道。'
      road: 往布德瓦爾區去，{staff}落後半步，把包換到離門口遠的一邊。一路走過，沿街都沒有人開口。
      chalk: '{staff}把最後一支粉筆掰開，一截給黑板，一截給石板。臨放下，順手在採買單上添了一行。'
  ino_tadataka_ezo:
    name: 被直線吞掉的轉彎
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬從江戶出發，開始第一次測量。隊伍沿東北地方一路北測，渡海到蝦夷地，再沿海岸測到西別折返。來回全程約半年，不全是在島上度過。伊能忠敬於 1818 年去世，同伴在 1821 年完成《大日本沿海輿地全圖》。
    story_prose:
      opening:
        - 1800 年 6 月 11 日，江戶。五十五歲的伊能忠敬帶著測量隊出發，一行六人，要一路北上，渡海到蝦夷地，沿著海岸量出一條線。這是他頭一回測量，後來他走遍了日本的海岸；他去世三年後，同伴們畫成了《大日本沿海輿地全圖》。
        - 史實裡，幕府給的補助不多，路上的花銷大半由他自己掏；這一趟全靠步子量，測繩要到第二次測量才用上；測量隊沿蝦夷地南岸量到西別，就循原路折返了。在這條分支裡，隊裡有個大聲數著步子的挑夫，海邊有個知道岸在哪裡拐彎的漁夫。
        - 這一趟用得上幾種人：會管賬、做過買賣，盤纏見底時撐得住的人，或是條理清楚、身子結實的人，帶著營養合成器也行；會木工、造船、補網，或懂工程、手巧細心，量得準一段路的人；身子骨極結實、走慣了遠路的人，懂航海、飛行或地質的人，或帶著探路無人機的人。
      outcomes:
        all: 這年冬天，測量隊回到江戶，前後一百八十天。帶回的圖上，蝦夷地的海岸一直畫過了西別，有一段的數字旁邊注著繩量。
        p3: 這年冬天，測量隊回到江戶。圖上的海岸線越過西別又延了一截，末端畫著一個小小的岬角。
        p2: 這年冬天，測量隊回到江戶。圖上有一段海岸，步數和繩量的數並排寫著；下一回出門，隊裡帶上了測繩。
        p1: 這年冬天，測量隊循原路回到江戶，前後一百八十天。那根測杖後來又跟著他出了好幾趟遠門。
      none: 八月底，錢袋空了，測量隊沒走到西別就收拾行李往回走。挑夫數步子的聲音一路低了下去，計數單的最後幾行空著。
      desync: 八月底，錢袋見了底，測量隊沒走到西別就回了頭。{staff}被召回時，那根測杖還插在半路的沙裡，潮水漲上來，沒過了它的半截。
      not_admitted: '{staff}沒能跟進測量隊，只在海邊幫漁夫收了幾回網。漁夫說起岸在哪裡拐彎時，往東的沙灘上，一行人正一步一步數著走遠。'
      points:
        p2:
          class_seafaring: 八月，蝦夷地東南的海岸。隊裡照舊一步一步地量，挑夫大聲數著步子，可到了沙灘和碎石灘上，同一段路走兩回，步數總對不上。{staff}在船上打慣了繩結，取出一卷細繩，每隔一段打一個結，結與結之間先拿測杖比準，和挑夫一人一頭，把繩子貼著岸拉直了量。伊能忠敬把繩量的數寫在步數旁邊，在兩行數字之間畫了一道短線。挑夫把那卷繩繞回胳膊上，一個個結從他的指縫裡滑了過去。
          class_craft: 八月，蝦夷地東南的海岸。隊裡照舊一步一步地量，挑夫大聲數著步子，可到了沙灘和碎石灘上，同一段路走兩回，步數總對不上。{staff}做慣了手藝活，搓了一根細繩，每隔一段打一個結，結與結之間先拿測杖比準，和挑夫一人一頭，把繩子貼著岸拉直了量。伊能忠敬把繩量的數寫在步數旁邊，在兩行數字之間畫了一道短線。挑夫把那卷繩繞回胳膊上，一個個結從他的指縫裡滑了過去。
