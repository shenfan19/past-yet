    event_titles:
      asked_the_way: 問路
    plots: {}
    blurb: 三所學校要併成一所大學。籌備處有活兒時，會交給做得來的人。員工接到差事就能做完，每交一件得一顆星。
    handle_label: 名冊合成一本
    protagonist: 孫中山
    protagonist_role: 下令把三所學校併成一所大學的政治家，星期天在這座禮堂演講
    stay: 停留七個事務所日，歷史 210 天
    plan_baseline: 主時間線
    encyclopedia:
      history:
        - text: 1924 年 2 月 4 日，孫中山下令把國立高等師範學校、廣東法科大學和廣東農業專門學校合併為國立廣東大學，派鄒魯籌備。
          check: true
        - text: 1924 年 1 月 27 日到 8 月 24 日，孫中山利用星期天在高等師範的禮堂演講，共十六講。黃昌谷每一講都隨同速記，鄒魯校讀謄清的講稿並貼簽注條，孫中山親筆修正。
          check: true
        - text: 鄒魯 2 月 21 日接手籌備。2 月 24 日他在禮堂召集三所學校的學生宣佈此事，3 月 3 日開第一次籌備會議，議題裡有三所學校學生的畢業問題。
          check: true
        - text: 頭幾講在三月底印成單行本，孫中山 3 月 30 日為它寫了序。6 月 3 日鄒魯呈報歸並三校的辦法，6 月 6 日獲批準。
          check: true
        - text: 9 月 19 日開學，11 月 11 日舉行成立典禮，用了孫中山寫的校訓。孫中山 1925 年 3 月 12 日在北京去世，1926 年這所大學改名為國立中山大學。
          check: true
      regret:
        - 你 9 月 1 日離開。開學在 19 日，校訓是那以後的事。
        - 演講停在第十六講。臺下沒有人知道那是最後一講。
    events:
      asked_the_way: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}也說不清，陪著找了半天。'
      asked_the_way_shown: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}在圖上指給他看，他道了謝，拿著圖走了。'
    star_points:
      xue: 替籌備處排好城外的招生告示張貼路線，交給送告示的人
      wen: 經人引薦走訪三所學校，趕在第一次籌備會議前交回一張彙總單
      si: 替籌備處踏勘備選校址，在石牌定下來之前交回一張比較圖
      bian: 核對三校的畢業名單，為 6 月 21 日的典禮交上一份統一名冊
      xing: 跟籌備處的人去石牌，把新校地的界樁一根根立穩
    points_fail:
      xue: 這條分支裡，招生告示只貼在城裡，城外的學生知道消息時，報名已經開始了。
      wen: 第一次籌備會議照史實召開，三所學校的難處仍是各說各的，沒有一張合在一起的單子。
      si: 選址照史實定在石牌，籌備處桌上沒有一張把幾處校址畫在一起的圖。
      bian: 6 月 21 日的畢業典禮照常舉行，籌備處仍要分開查閱三份名單。
      xing: 石牌的校地照史實只劃在紙上，地上一根界樁也沒有立。
    shift:
      xue:
        was: 1924 年 6 月 9 日，國立廣東大學委託各省教育廳招生；6 月 10 日，預科考試開始報名，原計劃招 520 人。
        now: 這條分支裡，城外的路口和碼頭上也貼著招生告示。
      wen:
        was: 1924 年 3 月 3 日，第一次籌備會議召開，議題裡頭一件是三所學校學生的畢業問題。
        now: 這條分支裡，會上擺著一張把三所學校的難處列在一起的單子。
      si:
        was: 1924 年，各校分散各處，管理不便，孫中山命鄒魯擇石牌為新校址，當年劃定土地。
        now: 這條分支裡，選址的文書旁邊多了一張把幾處校址和石牌畫在一起的圖。
      bian:
        was: 1924 年 6 月 21 日，鄒魯就任國立廣東大學校長，同一天為原三所學校的畢業生舉行畢業典禮。
        now: 這條分支裡，籌備處辦典禮時有了一份核對過的統一名冊。
      xing:
        was: 1924 年孫中山命鄒魯擇石牌為新校址，可新校舍 1933 年才動工，1934 年秋第一批學院才遷入。孫中山 1925 年 3 月 12 日去世，生前沒有見到。
        now: 這條分支裡，11 月他離開廣州之前，石牌校地的界已經一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 這條時間線裡，孫中山離開廣州之前，新校址石牌的界已經立定。
    shift_all: 五件差事都辦妥了。回來再讀孫中山後來親筆題寫的校訓，才看出這五件事與「博學、審問、慎思、明辨、篤行」的呼應。
    milestones:
      order_given: '{date}，孫中山下令把國立高等師範學校、廣東法科大學和廣東農業專門學校併成國立廣東大學，派鄒魯籌備。城裡還沒有人說得清這所大學在哪裡。'
      sun_dies: '{date}，孫中山在北京逝世。'
      renamed: '{date}，國民政府下令把國立廣東大學改名為國立中山大學。'
      lecture_jan27: '{date}，星期天。孫中山在高等師範的禮堂講三民主義的第一講。'
      lecture_feb17: '{date}，星期天。孫中山在高等師範的禮堂演講，這個系列從 1 月 27 日講起，這一天是第四講。臺側有人埋頭速記，那是黃昌谷，每一講他都在。'
      zou_takes_up: '{date}，鄒魯就任籌備主任。'
      hall_feb24: '{date}，又是星期天。這一天禮堂裡有第五講，鄒魯也在這裡召集三所學校的學生，宣佈籌建。'
      first_meeting: '{date}，第一次籌備會議，議題裡有三所學校學生的畢業問題。三十五名籌備委員裡，三十一人留過洋。'
      first_meeting_book: '{date}，第一次籌備會議，議題裡有三所學校學生的畢業問題。三十五名籌備委員裡，三十一人留過洋。這條分支裡，三所學校畢業班的名字這時已經抄在同一本冊子上。'
      proofs_travel: 三月裡，講稿在幾個人手裡來回走。黃昌谷的筆記謄清後送給孫中山，孫中山叫人送給鄒魯校讀，鄒魯在稿上貼簽注條送回去，孫中山親筆改，改完又送來。
      preface: '{date}，孫中山為《民族主義》單行本寫了序。單行本在三月底印出。'
      lecture_apr20: '{date}，星期天。禮堂裡講到了民權主義。'
      measures_sent: '{date}，鄒魯呈報歸並三校的辦法。'
      measures_approved: '{date}，辦法獲批準。'
      shipai_chosen: 這一年，孫中山讓鄒魯在城東的石牌選新校址。幾所學校散在城裡好幾處，不便管理。
      last_lecture: '{date}，第十六講。民生主義只講到第四講，後面的沒有再講。臺下沒有人知道這是最後一講。'
      classes_begin: '{date}，國立廣東大學正式開學。'
      ceremony: '{date}，舉行成立典禮，用的是孫中山寫的校訓，博學、審問、慎思、明辨、篤行。他本人沒有到場，兩天后離開廣州。'
      sunday_first: '{date}，{staff}擠在禮堂的最後面，離講臺很遠，看得見人，聽不全話。'
      sunday_stall: '{date}，{staff}進不去禮堂，在門口擺了個攤。散場時人湧出來，東西一會兒就賣完了。'
      sunday_sit: '{date}，{staff}在禮堂後排找了個位置，從開講坐到散場，一動沒動。'
      records_begun: '{date}，{staff}開始把三所學校的名冊往同一本冊子上抄。'
      records_read_aloud: '{date}，{staff}的字沒人認得。{staff}念名字，一位辦事員寫，三本名冊開始併成一本。'
      records_shut: '{date}，抄名冊要識字，{staff}插不上手，倒把三所學校的門房都認熟了。誰在哪裡，問{staff}比翻名冊快。'
      records_done: '{date}，三所學校的名冊合成了一本，趕在第一次籌備會議之前。'
      records_late: '{date}，三所學校的名冊合成了一本。第一次籌備會議已經開過了。'
      sites_done: '{date}，{staff}把散在城裡的幾處校址都走了一遍，畫成一張圖，註上從這一處到那一處要走多久。'
      asked_inside: '{date}，辦事員不再讓{staff}在門外等，叫進了屋。'
      copy_kept: '{date}，{staff}把那本《民族主義》包好，放進了行李。'
      exhausted: '{date}，{staff}累得手發抖，不得不歇下來。'
      spoiler: '{date}，{staff}知道兩年以後這所學校會改用孫先生的名字。{staff}把這句話寫在本子最後一頁，合上了。'
      spoiler_said: '{date}，{staff}對一位抄寫的辦事員說，兩年以後這所學校會改用孫先生的名字。辦事員頭也沒抬，說先生人還在，哪有這樣起校名的。'
      errand: '{date}，貼著簽注條的講稿從謄清的屋子裡進進出出。{staff}在門外，只看得見送稿人的背影。'
      errand_carried: '{date}，這條分支裡，被叫去送稿的人有一回是{staff}。一疊貼著簽注條的紙，從這頭送到那頭，一張也沒弄皺。'
      errand_frail: '{date}，{staff}爬幾級樓梯就喘，送不了稿，坐在謄清的屋子門口，看貼著簽注條的稿子進進出出。'
      pamphlet: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。{staff}隔著窗看了一眼封面。'
      pamphlet_traded: '{date}，{staff}拿自己親手做的東西，跟人換了一本剛印出來的《民族主義》。'
      pamphlet_given: '{date}，辦事員把一本剛印出來的《民族主義》遞給{staff}，說屋裡的人一人一本。'
      homesick_may: '{date}，沒有記載的一個月。{staff}在本子上畫正字，畫滿了一百天。事務所那邊只過了三天多。'
      shipai_walk: '{date}，{staff}聽說新校址選在城東的石牌。這天暫時沒有出城的安排。'
      shipai_reached: '{date}，{staff}出城往東，走到了石牌。{staff}知道這裡以後是什麼樣子，站了很久，把眼前的樣子畫了下來。'
      shipai_frail: '{date}，{staff}知道城東的石牌以後是什麼樣子。路遠，這天{staff}先留在城裡。'
      last_seat: '{date}，{staff}坐在老位置上聽完了這一講。散場後多坐了一會兒。'
      last_stall: '{date}，{staff}在禮堂門口比平常多備了一份貨。{staff}知道以後的星期天，這扇門口不會再有這麼多人。'
      adviser: '{date}，籌備處缺人手。辦事員給{staff}騰了個座，有合適的差事就來招呼。'
      wen_ask: '{date}，第一次籌備會議前，辦事員碰巧在三校都找得到肯抽空談的人，便給{staff}引薦，託對方把各校的難處問清。{staff}一家家聽過，把老師缺的、學生擔心的，彙在一張紙上交回去。'
      xue_enrol: '{date}，辦事員見{staff}很快理清了城外各村走哪條路，便託對方給招生告示排一趟張貼路線。{staff}在紙上圈出路口和碼頭，把畫好的路線連同告示交給送件的人。'
      bian_rolls: '{date}，三所學校的畢業名單送到籌備處，好幾個名字對不上。辦事員見{staff}平日核文書仔細，便把三疊紙交過去。{staff}逐一對回原件，為典禮交回一份統一名冊。'
      si_site: '{date}，籌備處想找個人把幾處備選地從頭走一遍，便請{staff}去。{staff}走完城裡的幾處地，再去城東看石牌，把每處怎麼進出都標在同一張圖上，交回籌備處。'
      xing_shipai: '{date}，去石牌立界樁的隊伍還缺一雙手，辦事員見{staff}走得動、也幹得了活，便請對方同去。到了石牌，{staff}扶著一根根樁讓同伴敲實，又沿著立好的界走了一遍才回城。'
      enrol_open: '{date}，預科考試開始報名。前一天，學校已委託各省教育廳招生，原計劃招 520 人。'
      grad_ceremony: '{date}，鄒魯就任校長，同一天為原三所學校的畢業生舉行畢業典禮。'
    summary:
      near_death: '{staff}在廣州病倒，被召回符拉了回來，在銅像前醒來。'
      stay_and_gifts: '{staff}做完了事，卻沒有回來。留下一張字條，說想留下來看著這所大學開學。禮物之後會到。'
      gave_up: '{staff}沒有撐到最後，在銅像前醒來，說 1924 年的廣州待不下去了。'
      legend: '{staff}在銅像前醒來，行李裡有一本 1924 年三月印的《民族主義》。主時間線上有 {base_D:i} 件事拖到沒人再問，這條分支裡是 {D:i} 件。走的那天，離開學還有 {countdown:i} 天。'
      perfect: '{staff}回到了銅像前。主時間線上有 {base_D:i} 件事拖到沒人再問，這條分支裡是 {D:i} 件。走的那天，離開學還有 {countdown:i} 天。'
      modest: '{staff}在廣州待了二百一十天，做了力所能及的事，又站在了銅像前。走的那天，離開學還有 {countdown:i} 天。'
    quotes:
      near_death:
        - text: 我以為還能再撐一會兒。
      stay_and_gifts:
        - trait: kind
          text: 我記得他們每個人的名字。我想再待一陣。
        - text: 這裡需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就這樣。
        - text: 七個月太長了。
      legend:
        - trait: curious
          text: 原來一本書是這樣一頁一頁改出來的。
        - text: 我走的時候，他們還沒有開學。
      perfect:
        - trait: kind
          text: 來問的人，後來都有人答了。
        - text: 該做的做了。
      modest:
        - trait: glib
          text: 我說兩年後這裡會改名，沒有人信。
        - text: 我只是在那裡待過。
    hints:
      low_luck: 走訪三校得趕上有人引薦，這項差事看幸運。
      low_wit: 籌備處會把排告示路線的差事交給聰慧達標的人。義體智能晶片能補。
      low_finesse: 三份名單細碎，籌備處會託靈巧達標的人核對。
      low_will: 踏勘要把幾處地走完，籌備處會找意志達標的人。義體仿生肺能補。
      low_constitution: 去石牌要走遠路、立界樁，隊伍會找體質達標的人。義體仿生肺能補。
      none: 只改一樣東西，用同一個種子再派一次，這樣對比最清楚。
