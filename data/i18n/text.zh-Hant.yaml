      mask: 念詞人舉起練習用的面具，放下時找不到唸到哪兒。你拿一張散紙標出那行的起頭，立在他伸手就能找見的位置。面具掛回鉤上，下一輪念詞你沒能留下聽。
      wind: 風把念詞紙吹散。你從長凳底下拾回一張，用小石子壓住。念詞人把那一行又唸了一遍。你走時紙還壓在石頭下，記下來的只有那一處停頓。
  mozart_requiem_vienna:
    name: 留下能認出的筆跡
    place: 維也納
    figure: 沃爾夫岡·阿馬德烏斯·莫扎特
    story: 莫扎特1791年12月在維也納去世時，《安魂曲》尚未完成。奧地利國家圖書館保有工作稿和含弗朗茨·克薩韋爾·蘇斯邁爾補寫的交付譜。
    story_prose:
      opening:
        - 維也納，送譜的人伸手去拿桌上最整齊的那摞。莫扎特從床邊問，第一段的器樂頁還在不在。康斯坦策讓來人先等一等，另幾張是沒來得及收起的草稿。
        - 莫扎特在 1791 年最後幾週病重，12 月 5 日去世。《安魂曲》當時尚未完成，開篇已有完整配器。分支裡可以先保住那一疊已寫成的開篇，也可以帶事務所的虛構醫療箱去幫忙照護。
        - 認得樂器譜和草稿筆跡的人幫康斯坦策把紙分開。另需會照護病人且有醫療箱的員工，先問病人和家人的意願。
      points:
        p1: 跑腿的人把兩張紙掀開，指給你看上面都有同樣的聲部名字。你和康斯坦策請他再找完整配器的那一疊，逐頁核到開篇結尾，草頁標明後另放。紙包遞到門邊時，他裡面外面都看一遍，知道哪一包可以先交給抄譜人。
        p2: 有人把鮮紙端到床邊，問今天還抄不抄。你向莫扎特和家人說明帶來的事務所醫療箱，然後讓等著抄譜的人先回外屋。後來他醒了，燒已經退下去。他請家人把桌挪近一點，只翻開原來停住的那一頁。
      outcomes:
        all: 開篇的分譜能重新取用，莫扎特也能回到桌前。你離開時，後面還空著，沒有人知道他會怎樣寫完。
        p1: 第一段仍是一件完整的紙包。12 月 5 日莫扎特去世，後面的曲譜留給別人補寫。
        p2: 莫扎特從病中恢復，但開篇的原譜已經拆散。本趟保留他醒來想翻譜的經過。
      none: 床邊攤著還沒抄完的樂句。莫扎特在 12 月 5 日去世，幾摞紙仍等人來分辨。
      not_admitted: 來人和康斯坦策沒有約過時間。抄譜人停在屋外，沒能看到那一疊紙寫了什麼。
      desync: 開篇的完整分譜混進散頁，原有譜件的交接沒法對上，事務所召回員工。
      excerpts:
        p1: 紙包遞到門邊時，他裡面外面都看一遍，知道哪一包可以先交給抄譜人。
        p2: 他請家人把桌挪近一點，只翻開原來停住的那一頁。
    relic: 一頁留白的練習譜
    relic_desc: 抄譜習作，留著已經寫下的樂句停住的位置。
    points:
      p1: 在病中交接時，護住莫扎特已經配完器的《安魂曲》開篇，別讓散頁錯放
      p2: 他 11 月 20 日臥床不起以後，治好那場讓他起不了身的高燒
    points_fail:
      p1: 第一段的分譜和草頁混在一起，再拼不回完整的開篇。這條分支與史實脫節，員工被召回。
      p2: 這條分支裡那場病沒有退，12 月 5 日他在維也納去世，三十五歲。
    shift:
      p1:
        was: 1791 年 12 月，莫扎特去世時，《安魂曲》的開篇已經配完器，其餘多處仍是未完稿。
      p2:
        was: 1791 年 11 月 20 日起莫扎特臥床不起，12 月 5 日在維也納去世，教區登記的死因是急性粟粒熱。
        now: '{staff}帶去的藥退了他的高燒，12 月裡他從床上坐了起來。這條時間線裡，他親手寫完了《安魂曲》，又在維也納作曲、演出了許多年。'
        who: mozart
        bio: 莫扎特在 1791 年冬天病癒，親手寫完《安魂曲》，此後在維也納又作曲、演出了許多年。
    vignettes:
      stack: 格蕾塔收拾桌面，順手拿開一頁看著空白的紙。你扶住一疊譜，讓埃米爾去對它前一頁。原來那行空譜也該收在原來的次序裡。格蕾塔把它放了回去，夾一張小條記下原來的位置。
      hand: 眼前的樂句埃米爾抄得出，順著寫下去就要越過原來空著的一行。你請他在抄寫停住的地方劃個邊記。交稿後，下一個人翻到這裡，就知道另一隻手得從哪兒起筆。
      finish: 你哼得出後世合唱團會唱的那段。格蕾塔現在就得帶走副本，問原譜在這一頁寫到了哪兒。你指出分界，把後來聽過的旋律留在心裡。下一版會在你離開後拼合。
eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 1924 年 2 月 4 日，廣州。孫中山下令把三所學校併成國立廣東大學，請鄒魯籌備。學生還在各自的學校，報名、畢業和新校址都要有人經手。
        - 史實裡，學校當年開學，石牌的新校舍卻到九年後才動工，孫中山生前沒有見到。到了這條分支，籌備處給來幫忙的人騰了一個座位，桌上放著三校送來的紙。
        - 這一趟用得上認得路、問得清各校難處、核得準名單的人。城裡幾處地要走完，去石牌的隊伍還需要一雙能扶穩界樁的手。
      points:
        xue: 籌備處送來要貼到城外的招生告示。{staff}把圍著渡口繞遠的路劃掉，重新在簡圖上圈出路口和碼頭。送件人把圖壓在告示上，疊了兩折。紙折到河邊，碼頭的圓圈還露著半個。
        wen: 辦事員替{staff}引見了三校的人。{staff}把一家家問來的話帶回去，在開會前把師生各自的難處寫進同一張紙。桌上原來分放著三疊紙。辦事員抽出那張彙總單，把它橫放在三疊紙的上頭。
        si: '{staff}步行踏勘幾處備選地，最後走到城東的石牌，把各處從哪裡進出描在同一張圖上。回到籌備處，圖一鋪開就往回卷。{staff}用指腹壓住城東，再把紙角往燈下送了一寸。'
        bian: 三校送來的畢業名單有幾處合不上。{staff}逐個翻回原件，核准姓名，把三份名單併成一冊。臨交出去時，{staff}又從頭數了一遍頁碼。末頁翻過去，墨最深的還是剛核過的那一行。
        xing: 去石牌立界樁的人少了一雙手。{staff}隨隊出城，扶樁讓同伴敲實，再沿界走了一遍。走到最後一根，{staff}鬆開沾泥的手。回身望去，先立下的幾根還在一條線上。
      outcomes:
        all: 回到事務所以後，十一月的校訓已經可以讀到。有人把一份校訓放在這趟的五項記錄旁邊，五行字正對著五道紙折。
        xing: 石牌的界在孫中山離開廣州前立了起來。後來再有人走過，把目光沿著那些樁一點一點放遠。
        bian: 畢業典禮籌備時，辦事員攤開一本名冊就找到了要核的名字。翻過一頁，靠近書脊的墨還比別處深。
        si: 選址文書旁後來壓著一張比較圖。有人查完石牌的路，把圖按原來的摺痕合上。
        xue: 報名開始時，城外的路口也貼著告示。有人在碼頭邊停下，把紙下沿輕輕撫平。
        wen: 開籌備會議那天，三校的難處擺在一張紙上。傳到下一人手裡時，紙還攤著。
      none: 籌備處到傍晚仍有人翻紙。{staff}經過門口，看見一張張紙的下沿被燈光照亮。
      not_admitted: '{staff}沒能在籌備處留下來。經過門口時，那張空椅子還齊齊推在桌下。'
      excerpts:
        xing: 走到最後一根，{staff}鬆開沾泥的手。回身望去，先立下的幾根還在一條線上。
        bian: 臨交出去時，{staff}又從頭數了一遍頁碼。末頁翻過去，墨最深的還是剛核過的那一行。
        si: 回到籌備處，圖一鋪開就往回卷。{staff}用指腹壓住城東，再把紙角往燈下送了一寸。
        xue: 送件人把圖壓在告示上，疊了兩折。紙折到河邊，碼頭的圓圈還露著半個。
        wen: 桌上原來分放著三疊紙。辦事員抽出那張彙總單，把它橫放在三疊紙的上頭。
