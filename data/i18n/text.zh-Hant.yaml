        was: 1858 年 2 月，華萊士瘧疾稍好便提筆寫成論文，稿末落款特爾納特。
      p2:
        was: 1858 年 5 月，華萊士在多雷傷了腳踝，傷口潰成潰瘍，一個多月下不了地。
        now: 傷口沒有潰，汽船到港那些天他照舊每天進林子。
      p3:
        was: 1858 年 6 月 26 日，十八歲上下的朱馬特在多雷病逝，華萊士寫他是個安靜的小夥子，活幹得踏實。
        now: '{staff}守著他退了燒、止住了病，七月底離開多雷時，他也在船上。'
    vignettes:
      places: '{staff}抄下鳥類標本的籤條，在每張旁補上島名。放回最後一張時，籤角卡進了抽屜的木縫。'
      claim: '{staff}把兩座島上的甲蟲排成兩行，給相像的那兩隻之間留出一指寬。合上盤蓋前，還能看見那道空隙。'
      mail: '{staff}把一封長信包進油紙，像水手捆海圖那樣打了雙結。油紙上有一點水，繩結壓得很緊。'
  su_shi_huangzhou:
    name: 東坡的流放
    place: 黃州
    figure: 蘇軾
    story: 1079 年烏臺詩案之後，蘇軾被貶到黃州，在城東一塊坡地上開荒種地，以地為號，稱東坡。1082 年七月，他與客泛舟赤壁之下，寫成《赤壁賦》；十月，他從雪堂步行回臨皋，寫成《後赤壁賦》。1084 年他離開黃州。
    story_prose:
      opening:
        - 元豐年間，黃州。蘇軾經烏臺詩案貶到這裡，在城東開荒，後來以東坡為號。元豐五年，他兩次寫到赤壁，秋夜那一次還記下了攀上斷岸。
        - 史實裡，他一家靠著積蓄過日子。他也聽說岳鄂一帶有溺嬰的事，寫信求禁，並在黃州提議幫窮人家養孩子。在這條分支裡，坡地、渡口和這些人家的門口都能有人接手。
        - 這一趟用得上懂耕作的人和能走夜路、走陡路的人。會照料新生孩子、能耐心挨家開口的人，也有事要做。
      points:
        p1: '{staff}跟著幫工上坡，照種地的辦法引水入畦。收糧時，攢了幾擔又搬了幾趟。最後一袋糧靠牆放下，掃過地上一道陳灰。梁上還掛著剩下的錢串。'
        p2: 十月之望，{staff}幫看陡處哪塊石頭能踩穩，又守著回到船上的那一段。崖上的身影下來時，{staff}把燈轉向水邊。水拍上船板，燈在手裡晃了一下。
        p3: '{staff}跟著育兒會挨家去看，按照護新生兒的辦法安頓孩子，再同留下來照看的大人說話。一家人的門到夜裡才關上。門縫還亮著，裡面有一小團裹好的布在輕輕動。'
      outcomes:
        all: 那年東坡有糧，赤壁歸來的人帶回了濕衣，幾戶家裡也多了孩子。夜裡，門裡有人把一床小被攤開。
        p3: 那個冬天，有幾家終於能把孩子養在家裡。上門的人退到門外，聽見屋裡有人把燈移近了一些。
        p1: 秋後，梁上的錢串比預想的多留了幾個月。新糧袋靠在牆邊，布角還帶著地裡的土。
        p2: 第二次遊赤壁以後，斷岸寫進了賦。攤開那頁，墨最濃的地方是筆勢一頓的位置。
      none: 渡口空下來，盤好的繩還在船頭。燈放到腳邊，火苗只剩一點。
      not_admitted: '{staff}沒能在黃州落腳。渡口那盤粗繩在水霧裡一點點暗下去。'
      desync: 赤壁那一段出了岔子。被召回以前，{staff}手裡的燈只照到船沿下方的水。
      excerpts:
        p3: 一家人的門到夜裡才關上。門縫還亮著，裡面有一小團裹好的布在輕輕動。
        p1: 最後一袋糧靠牆放下，掃過地上一道陳灰。梁上還掛著剩下的錢串。
        p2: 崖上的身影下來時，{staff}把燈轉向水邊。水拍上船板，燈在手裡晃了一下。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是農人在坡地上穿的那種。
    points:
      p1: 幫他一家把東坡那塊荒地種出收成，撐過積蓄見底的日子
      p2: 十月之望那夜，護住他攀上赤壁斷岸，讓他平安回到船上
      p3: 救下鄉間那些一落地就要被按進水盆的孩子
    points_fail:
      p1: 這條分支裡，秋收時東坡的地頭沒有多一個幫手，樑上的錢串照舊一串一串地少下去。
      p2: 那夜他在斷岸上失了腳，這條分支裡沒有回到船上的那一段。
      p3: 這條分支裡，鄉間的水盆照舊，{staff}沒能讓哪一家留下那個孩子。
    shift:
      p1:
        was: 元豐四年，蘇軾在城東坡地開荒種地，一家每天的用度限在一百五十錢。
        now: 那年秋天東坡的地多打了幾擔糧，樑上的錢串剩到了年底。
      p2:
        was: 元豐五年十月之望，蘇軾獨自攀上赤壁斷岸，又回到船上，後來寫下《後赤壁賦》。
      p3:
        was: 他聽說岳鄂一帶溺嬰，寫信請鄂州知州依律禁止，又在黃州倡議育兒會，請富戶出錢，幫貧家養活新生的孩子。
        now: '{staff}跟著育兒會挨家去走，那個冬天又有幾戶人家把剛生下的孩子留了下來。'
    vignettes:
      slope: '{staff}替幫工往坡上挑水。天黑時，鄰里把一碗煮豆擱到地頭，說第二碗明天給這個外鄉人。'
      lamp: '{staff}用手替石頭上的燈擋風。三更過了許久，坡上傳來腳步聲。{staff}把燈轉向小路，沒出聲。'
      ferry: '{staff}在渡口幫船家盤纜繩。船家說，無風時崖下水走得慢，來遊的人偏要往對岸去。'
  ahmed_baba_timbuktu:
    name: 給補編留一個名字
    place: 廷巴克圖
    figure: 艾哈邁德·巴巴
    story: 1591 年摩洛哥軍隊攻下廷巴克圖。學者艾哈邁德·巴巴被指抗拒蘇丹，1594 年被押往馬拉喀什，在那裡編寫人物辭書，補伊本·法爾洪的舊作。1608 年他獲准回到廷巴克圖，1627 年 4 月 22 日在那裡去世。
    story_prose:
      opening:
        - 1594 年，廷巴克圖。三年前，摩洛哥軍隊攻下了這座城。艾哈邁德·巴巴是城裡的學者，寫過幾十部法學和語法的書，家裡有一座很大的藏書室。
        - 史實裡，這一年他被指抗拒蘇丹，連同家人被押著穿過撒哈拉，北上馬拉喀什。藏書被收走，一說在路上散失。十四年後他獲准回家，書已經不在了。在這條分支裡，巷子那頭有一戶人家的主婦肯在床底騰出地方，院子裡的抄書人還在替他的書寫籤條。
        - 這一趟用得上三種人：懂舊書、知道哪幾箱該先救的人，膽子大、身子硬、押解那天擋得住推搡的人，懂醫護、在沙漠裡能替人治傷分水的人。
      outcomes:
        all: 1608 年，艾哈邁德·巴巴回到廷巴克圖。鄰家的主婦已經老了，她把床底的箱子拖出來，皮面上落了一層灰。他打開最上面那一卷，認出了自己的字。
        p3: 十四年後，他回到廷巴克圖。那戶人家把床底的幾箱書抬了出來，他一卷一卷摸過去，在箱子邊上坐了很久。
        p2: 一家老小都走到了馬拉喀什。那個孩子的腳，到城門口時已經結了痂。
        p1: 他活著走到了馬拉喀什。十四年後，他獲准回家。
      none: 北去的隊伍走遠了。廷巴克圖那間屋子的書架空著，門沒有關。
      desync: 押解那天，街口一陣亂，{staff}沒能擋到他身前，就被事務所召了回來。最後看見的，是人堆裡一隻被踩掉的鞋。
      not_admitted: '{staff}沒能進那座院子。書還在架上，押解的日子已經近了。'
      points:
        p3:
          class_craft: '{staff}照修舊書的規矩，把最脆的幾卷用乾布隔開，皮面朝裡，護舌壓平，一層層碼進箱子。天黑以後，箱子由兩個人抬著，穿過兩條巷子，進了鄰家主婦的屋子。她把床底的雜物拖出來，箱子推了進去，又把雜物塞回原處，拍了拍手上的土。'
          class_lettered: '{staff}照著書單挑書，先揀他自己寫的稿子和只此一部的抄本，一層層碼進箱子。天黑以後，箱子由兩個人抬著，穿過兩條巷子，進了鄰家主婦的屋子。她把床底的雜物拖出來，箱子推了進去，又把雜物塞回原處，拍了拍手上的土。'
          else: '{staff}一卷卷翻過書名，把他自己寫的稿子和少見的抄本先挑出來，一層層碼進箱子。天黑以後，箱子由兩個人抬著，穿過兩條巷子，進了鄰家主婦的屋子。她把床底的雜物拖出來，箱子推了進去，又把雜物塞回原處，拍了拍手上的土。'
        p1: 押解那天，街上擠滿了人，推搡裡有人亮了刀。{staff}擋在艾哈邁德·巴巴身前，把他拉進一個門洞，用後背頂住門框。那一陣過去，他整了整衣襟，自己走了出去，身上沒有傷。
        p2: 北上走了半個月，隊裡有人發起高燒，有個孩子腳底磨爛了。{staff}每天紮營後替人清洗傷口、換藥，把水按人頭分好。有一晚，那個孩子把自己的水囊遞過來，裡面還剩一口。
      excerpts:
        p3: 天黑以後，箱子由兩個人抬著，穿過兩條巷子，進了鄰家主婦的屋子。她把床底的雜物拖出來，箱子推了進去，又把雜物塞回原處，拍了拍手上的土。
        p2: '{staff}每天紮營後替人清洗傷口、換藥，把水按人頭分好。有一晚，那個孩子把自己的水囊遞過來，裡面還剩一口。'
        p1: '{staff}擋在艾哈邁德·巴巴身前，把他拉進一個門洞，用後背頂住門框。那一陣過去，他整了整衣襟，自己走了出去，身上沒有傷。'
    relic: 一部皮面手稿
    relic_desc: 一部手稿，皮面磨舊了，帶一片護舌。
    points:
      p1: 押走之前，攔下沖著被捕學者來的刀兵，護住艾哈邁德·巴巴活著走上北去的路
      p2: 替在沙漠裡病倒受傷的族人治傷、分水，護著一家老小不掉隊
      p3: 搶在士兵收書之前，從他的藏書裡救下幾箱，託給城裡一戶人家藏好
    points_fail:
      p1: 這條分支裡他沒能活著離開廷巴克圖，馬拉喀什的人物辭書和在摩洛哥寫成的二十九部書都沒有了。
      p2: 路上倒下的人沒人扶，這條分支裡一家人北上的路和原來一樣苦。
      p3: 藏書全被收走，這條分支裡他十四年後回到廷巴克圖，自己的書一卷也沒剩下。
    shift:
      p1:
        was: 1594 年，艾哈邁德·巴巴被指抗拒蘇丹，押往馬拉喀什；1608 年他獲准回到廷巴克圖。
      p2:
        was: 1594 年，艾哈邁德·巴巴的家人與他一同被押著穿過撒哈拉北上。
        now: 同行的族人走到馬拉喀什時少受了些罪。
      p3:
        was: 1594 年，他的藏書被摩洛哥人收走，另一說在北上途中散失；1608 年回到廷巴克圖時，書已不在。
        now: 押走之前有幾箱書被挪進城裡一戶人家的床底。十四年後他回到家，那戶人家把箱子抬了出來。
        who: ahmed_baba_timbuktu
        bio: 1608 年艾哈邁德·巴巴回到廷巴克圖，城裡一戶人家替他收著的幾箱書還在。晚年他就用這些書教學生。
    vignettes:
      same_name: '{staff}發現兩卷書裡同一個名字有兩種寫法，沒有挑一種，兩種都記在單子上，中間畫了個記號。'
      courtyard: 雨季過後，{staff}把書攤在院子的陰涼裡晾。泥牆的影子一點點挪，正午翻一次，讓封皮乾得勻。
      slip: '{staff}在窄紙條上寫下每卷的書名和頭一行，塞在皮面的護舌底下，不用打開也叫得出是哪本書。'
  nezahualcoyotl_texcoco:
    name: 歌旁寫著的名字
    place: 特斯科科
    figure: 內薩瓦爾科約特爾
    story: 內薩瓦爾科約特爾 1431 年成為特斯科科之主，統治到 1472 年去世。人們記得他是詩人，也是營造者，據說橫貫特斯科科湖的一道長堤是他規劃的。十六世紀收集的納瓦特爾語歌謠裡，有一些和他的名字連在一起，但是否出自他手，已無法確定。
    story_prose:
      opening:
        - 1472 年，特斯科科。內薩瓦爾科約特爾做這座城的主人已經四十一年，七十歲上下了。人們記得他是詩人，也是營造者，據說橫貫特斯科科湖、把湖水分開的那道長堤，就是他規劃的。
        - 史實裡，他在這一年去世，七歲的兒子內薩瓦爾皮利被推舉繼位；與他名字連在一起的歌，一百來年後才抄進一部歌集，最初是誰唱的，已經沒人知道。在這條分支裡，宮裡有個會唱那幾首歌的老歌者，要把歌教給一位學徒，排練時還有個歌者給接唱的人留提示，有個幫工管著練習稿的先後。
        - 這一趟用得上幾種人：守得住夜、膽子大或身子極結實的人，帶著睡眠調節器也行，在人心不定的那幾天護得住一個孩子；教過書、懂音樂，或有耐心、有條理，帶著錄音筆也行，一句一句學得全的人；性子安靜、肯陪著人，會照護病人，或帶著全息投影儀的人，在他最後的日子裡坐得住。
      outcomes:
        all: 這年，七歲的內薩瓦爾皮利被推舉為特斯科科之主。那幾首歌從頭到尾傳了下去，學徒後來又教給了自己的徒弟。一百來年後，它們被抄進一部歌集，寫在他的名下。
        p3: 這年，內薩瓦爾科約特爾在特斯科科去世。一百來年後，與他名字連在一起的歌被抄進一部歌集；五百多年後，墨西哥的百元鈔票上印著他的臉。
        p2: 那位學徒把幾首歌唱熟了，後來又教給了自己的徒弟。一百來年後，這些歌被抄進一部歌集，歌旁寫著他的名字。
        p1: 七歲的內薩瓦爾皮利被推舉為特斯科科之主，後來在這個位子上坐了四十多年。
      none: 這年，內薩瓦爾科約特爾在特斯科科去世。老歌者病倒時，那幾首歌還沒有教完，練習紙的後半截空著；推舉那天，宮裡沒有等來那個七歲的孩子。
      desync: 他去世後的那幾夜，門檻邊上沒有人守著。{staff}被召回時，推舉的日子還沒到，孩子住過的那間屋子空著，席子捲起來靠在牆角。
      not_admitted: '{staff}沒能進宮，只在城裡聽見歌者們練唱。一位歌者唱完一句，退回去，給接唱的人留出位置；唱的是誰的歌，聽的人各說各的。'
      points:
        p2:
          class_teaching: 這一年，宮裡的老歌者已經唱不了太久，一首歌唱到一半就要停下來喘口氣。他要把那幾首和內薩瓦爾科約特爾名字連在一起的歌，教給宮裡一位學徒。{staff}教過書，讓學徒一句一句跟著唸，唸熟一句再接下一句，每天收工前從頭背一遍，背錯的地方在練習紙邊上點一個記號。最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
          else: 這一年，宮裡的老歌者已經唱不了太久，一首歌唱到一半就要停下來喘口氣。他要把那幾首和內薩瓦爾科約特爾名字連在一起的歌，教給宮裡一位學徒。{staff}耐著性子坐在一旁，老歌者唱一句，就讓學徒跟一句，跟不上的地方請老人再唱一遍，一遍不行就兩遍。最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
        p3:
          class_medical: 他最後的日子裡，屋裡來來去去的人都放輕了腳步。{staff}會照護病人，替他掖好蓋毯，扶著他喝水，等屋裡只剩下他們兩個，才坐近了，慢慢說起以後的事。一百來年後，有人會把和他名字連在一起的歌一首首抄進書裡。五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
          else: 他最後的日子裡，屋裡來來去去的人都放輕了腳步。{staff}在他身邊坐了一個下午，等屋裡只剩下他們兩個，才慢慢說起以後的事。一百來年後，有人會把和他名字連在一起的歌一首首抄進書裡。五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
        p1: 他去世後的那幾天，貴族們聚在一起商量由誰繼位，宮裡進進出出的人一天比一天多。七歲的內薩瓦爾皮利被人領著，從一間屋子走到另一間屋子。{staff}守在他住的屋外，夜裡也不走開，生人來了先攔下問清楚，孩子睡著了，才在門檻邊上坐下來。推舉那天早上，孩子被大人牽著走出屋門，衣角在門檻上蹭了一下。門檻邊那塊坐了幾夜的地方，已經磨出了一片淺印。
      excerpts:
        p3: 五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
        p2: 最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
