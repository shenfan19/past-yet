        p2:
          class_teaching: '{staff}照教書的老辦法，先讓她把名字唸響，再把每個音落成字母。椒水行宮外，攤主把自己的名字慢慢唸了一遍，跟著那幾聲在紙上寫。最後一筆落下時，她把紙轉正，用手指按著，一個字一個字點過去。那張紙後來送進了行宮，世宗把它拿到眼前，看了很久，沒有讓人收走。'
          else: '{staff}每天收攤前陪她坐一會兒，不催，哪一筆寫歪了就再寫一遍。椒水行宮外，攤主把自己的名字慢慢唸了一遍，跟著那幾聲在紙上寫。最後一筆落下時，她把紙轉正，用手指按著，一個字一個字點過去。那張紙後來送進了行宮，世宗把它拿到眼前，看了很久，沒有讓人收走。'
