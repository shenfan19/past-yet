      harbour: '{staff}每天傍晚走到比雷埃夫斯港，問賣魚的提洛島的船回來沒有。天天是同一個回答，{staff}說不清自己是盼它來，還是盼它別來。'
      gate: '{staff}替獄牆外賣燈油的女人挑水，換來牆根下一塊歇腳的地方。探視的人每天天一亮就等在門口，有人提著飯籃，有人兩手空空，{staff}漸漸認得了他們的臉。'
  euclid_alexandria:
    name: 《推論集》還在的時候
    place: 亞歷山大
    figure: 歐幾里得
    story: 約公元前 300 年，歐幾里得在亞歷山大寫成《幾何原本》十三卷，從定義和公設出發，一步步證明幾何命題。他還寫過《推論集》三卷、《圓錐曲線》等書，後來都失傳了。公元四世紀的帕普斯還能介紹《推論集》，記下它的命題數。
    story_prose:
      opening:
        - 約公元前 300 年，亞歷山大。歐幾里得在這裡寫成《幾何原本》十三卷，從幾條定義和公設出發，一步步證明幾何命題；第一卷第一個命題只用兩個圓，就在一條給定的線段上作出等邊三角形。他還寫過《推論集》三卷、《圓錐曲線》等書。
        - 史實裡，《推論集》後來失傳了。約公元 320 年，帕普斯還能介紹它，記下它有 171 個定理、38 個引理，此後再沒有已知的抄本。在這條分支裡，有個學生在沙盤上畫圖，碼頭上有個賣莎草紙的人，知道哪種紙經得住潮氣。
        - 這一趟用得上幾種人：懂抄書、校書、管書的人，會教幾何、帶得住一群學生的人，或者心細又有學問、一行行核得下去的人。
      outcomes:
        all: 後來的讀者書架上，《幾何原本》旁邊多了三卷《推論集》，卷邊被翻得發軟。
        p1: 後來的讀者書架上，《幾何原本》旁邊多了三卷《推論集》，卷邊被翻得發軟。
      none: 沙盤抹平了，又畫上新的圓。帕普斯之後，再沒人翻開過那三卷書。
      not_admitted: '{staff}沒能進那間抄書的屋子。碼頭上，賣莎草紙的人還在一捆捆往岸上扛紙。'
      points:
        p1:
          class_teaching: '{staff}照教書的辦法，把《推論集》三卷分給沙盤邊最用心的幾個學生，一人一卷，抄完互相換著唸，一個字一個圖地對過。抄好的幾部捲起來，繫上細繩，交到跟他學幾何的人手裡。歐幾里得拿起其中一卷，解開繩子看了看第一頁，又照原樣繫好。'
          class_lettered: '{staff}照抄書鋪的規矩，裁好莎草紙，把《推論集》三卷一卷卷抄出副本，再對著原卷一行行校過，圖也照樣描好。抄好的幾部捲起來，繫上細繩，交到跟他學幾何的人手裡。歐幾里得拿起其中一卷，解開繩子看了看第一頁，又照原樣繫好。'
          else: '{staff}心細，守著抄書人把《推論集》三卷一卷卷抄出副本，每抄完一卷，就把副本和原卷並排攤開，一頁頁對著圖看過。抄好的幾部捲起來，繫上細繩，交到跟他學幾何的人手裡。歐幾里得拿起其中一卷，解開繩子看了看第一頁，又照原樣繫好。'
      excerpts:
        p1: 抄好的幾部捲起來，繫上細繩，交到跟他學幾何的人手裡。歐幾里得拿起其中一卷，解開繩子看了看第一頁，又照原樣繫好。
    relic: 一把青銅圓規
    relic_desc: 兩條臂和一個軸，足夠畫出書裡的每一個圖形。
    points:
      p1: 幫他把《推論集》三卷多抄幾部，交到學生手裡，不讓這部書失傳
    points_fail:
      p1: 《推論集》照舊只有一路抄本，這條分支裡它還是失傳了，只剩帕普斯留下的幾句介紹。
    shift:
      p1:
        was: 約公元前 300 年，歐幾里得寫成《推論集》三卷；原書後來失傳，今天只知道公元四世紀帕普斯記下的命題數 171 和一段簡短的介紹。
        now: '{staff}幫他把《推論集》多抄了幾部，交給跟他學幾何的人，這條時間線裡這部書傳到了後世。'
        who: euclid_alexandria
        bio: IF 線裡，歐幾里得的《推論集》多抄了幾部，沒有失傳，後人讀到的他不只有《幾何原本》。
    vignettes:
      lost: '{staff}在抄書人的案頭看見一卷《推論集》，知道後世的人只能從帕普斯的幾行字裡猜它寫了什麼。{staff}的手按在卷邊上，停了好一會兒才松開。'
      arcs: '{staff}學著學生的樣子，用木釘和繩子在沙盤上畫圓，兩道弧一交，第三個點就出來了。{staff}抹平沙子又畫一遍，第二遍手穩多了。'
      papyrus: '{staff}幫碼頭上賣莎草紙的人把一捆捆紙扛上岸，聽他講哪種紙經得住港口的潮氣，哪種放一年就脆了。'
  eratosthenes_alexandria:
    name: 量地球的那部書
    place: 亞歷山大
    figure: 埃拉托色尼
    story: 公元前三世紀，昔蘭尼人埃拉托色尼擔任亞歷山大圖書館館長。他自己寫的測地著作已經失傳。據克萊奧梅德斯後來的記述，夏至正午，塞伊尼的太陽正在頭頂，亞歷山大卻還有日影。兩地的角度差是全圓的五十分之一；兩地相隔五千斯塔迪亞，繞地球一圈就是二十五萬。
    story_prose:
      opening:
        - 公元前三世紀，亞歷山大。昔蘭尼人埃拉托色尼做了亞歷山大圖書館的館長。他有個外號叫“貝塔”，意思是他在每一門學問裡都差一點才到第一。
        - 史實裡，據克萊奧梅德斯後來的記述，夏至正午，塞伊尼的日晷針不投影子，在亞歷山大，太陽偏離天頂全圓的五十分之一；兩城相隔五千斯塔迪亞，繞地球一圈就是二十五萬。埃拉托色尼親筆寫下方法的《論地球的測量》失傳了，克萊奧梅德斯自己也說，原法比他轉述的更繁。在這條分支裡，圖書館有個不識字的雜役認得每一塊木牌，還有個愛給人起外號的抄書人。
        - 這一趟用得上兩種人：懂抄書、校書、管書的人，或者好學肯鑽、算得清一頁數字的人。
      outcomes:
        all: 後來的人照著他親筆寫下的步驟，在夏至正午又立起一根晷針。卷子攤在旁邊，用石子壓著邊。
        p1: 後來的人照著他親筆寫下的步驟，在夏至正午又立起一根晷針。卷子攤在旁邊，用石子壓著邊。
      none: 那部書還是只有原來幾部抄本，一部部舊下去。夏至正午，亞歷山大的晷針照舊投下一道短短的影子。
      not_admitted: '{staff}沒能進圖書館的門。夏至正午，城裡的晷針照舊投下一道道短短的影子。'
      points:
        p1:
          class_lettered: '{staff}照管書的規矩，把《論地球的測量》謄出幾部，每抄完一部，就把影長、角度和里程一行行對著原稿核過，數字一個也不差。一部放上圖書館的架子，繫著雜役認得的小木牌；另一部裹進油布，隨一條出港的船去了別的城。埃拉托色尼站在架子前，用一根手指把木牌撥正。'
          else: '{staff}先把書裡的算法從頭算了一遍，弄懂了每一步，再把《論地球的測量》謄出幾部，數字一行行對著原稿核過。一部放上圖書館的架子，繫著雜役認得的小木牌；另一部裹進油布，隨一條出港的船去了別的城。埃拉托色尼站在架子前，用一根手指把木牌撥正。'
      excerpts:
        p1: 一部放上圖書館的架子，繫著雜役認得的小木牌；另一部裹進油布，隨一條出港的船去了別的城。埃拉托色尼站在架子前，用一根手指把木牌撥正。
    relic: 一根日晷針
    relic_desc: 一根樸素的立桿，影子告訴他太陽的角度。
    points:
      p1: 幫他把《論地球的測量》多抄幾部，存進圖書館也送出城去，不讓他親筆寫下的方法失傳
    points_fail:
      p1: 這部書照舊只有原來那幾部抄本，這條分支裡它還是失傳了，後人只能從克萊奧梅德斯簡化過的轉述裡認識他的方法。
    shift:
      p1:
        was: 公元前三世紀，埃拉托色尼把測地的方法寫進《論地球的測量》；原書後來失傳，方法主要靠克萊奧梅德斯簡化過的轉述留下，克萊奧梅德斯自己也說原法更繁。
        now: '{staff}幫他把這部書多抄了幾部，這條時間線裡他親筆寫的方法和後來的轉述一起傳了下來。'
        who: eratosthenes_alexandria
        bio: IF 線裡，埃拉托色尼測量地球的那部書沒有失傳，後人能照他自己的話核對他的方法。
    vignettes:
      noon: 夏至正午，{staff}蹲在一根立桿旁，用指甲在地上劃下影子的尖。過一會兒再看，影子已經挪開了一指寬。
      beta: '{staff}聽圖書館的抄書人背地裡管館長叫"貝塔"，說他樣樣都只排第二。{staff}知道後世記住他的，偏偏是他量出來的那一整圈地球，憋著沒笑出聲。'
      shelves: '{staff}幫圖書館的雜役把卷子一捆捆扛上架，每捆系一塊小木牌。雜役說，不識字的人也認得牌上的記號。'
  fibonacci_pisa:
    name: 1202 年的初編
    place: 比薩
    figure: 斐波那契
    story: 比薩的列奧納多少年時在北非海岸的布吉亞學會用九個印度數字算賬，他父親在那裡替比薩商人辦事。1202 年，他回到比薩寫成《計算之書》，教人用這些新數字和零來記數、做買賣。1228 年他把書改訂了一遍，今天傳下來的抄本都出自這第二版。
    story_prose:
      opening:
        - 1202 年，比薩。列奧納多少年時到過北非海岸的布吉亞，他父親在那裡替比薩商人辦事，他在那裡學會了用九個印度數字算賬。回到比薩，他寫成《計算之書》，教人用這些數字和零來記數、做買賣。
        - 史實裡，1228 年他把這部書改訂了一遍，添了新內容，刪去他覺得多餘的部分；傳下來的抄本都出自這一版，1202 年的初編沒有已知的完整抄本。在這條分支裡，碼頭賬房有個學徒，不明白一個小圈憑什麼佔一欄，阿諾河上有個船伕，一包貨上岸就報一聲數。
        - 這一趟用得上幾種人：懂書、知道一套抄本該怎麼留的人，會教書、說得動作者的人，或者好學肯鑽、講得清早本和新本差在哪裡的人。
      outcomes:
        all: 二十多年後，修訂本在比薩的書鋪裡抄開了。那隻木箱還在，早本和新本並排攤開，讀的人一頁頁對著看，找哪些例題是後來補上的。
        p1: 二十多年後，修訂本在比薩的書鋪裡抄開了。那隻木箱還在，早本和新本並排攤開，讀的人一頁頁對著看，找哪些例題是後來補上的。
      none: 1228 年以後，比薩書鋪裡抄的都是修訂本。賬房裡的學徒照著它學算，一筆一筆把零寫進空著的那一欄。
      not_admitted: '{staff}沒能進列奧納多的門。阿諾河邊，船伕還在一包包往岸上卸貨，岸上的人在板上劃了一道又一道。'
      points:
        p1:
          class_lettered: '{staff}照管書的規矩，把初編的幾卷攤在桌上，一卷卷編好號，對列奧納多說，日後改訂是好事，可這一套若不留下，往後沒人知道他起初是怎麼寫的。列奧納多把那幾卷翻了很久，拿起筆，在每一卷末尾寫下自己的名字和編成的年份。他等墨乾透，把卷子一卷卷碼進木箱，扣上了搭扣。'
          else: '{staff}把初編裡的幾道例題抄在蠟板上，和他口述的新寫法並排放著，問他往後的人想看他起初是怎麼算的，該去哪裡找。列奧納多把那幾卷翻了很久，拿起筆，在每一卷末尾寫下自己的名字和編成的年份。他等墨乾透，把卷子一卷卷碼進木箱，扣上了搭扣。'
      excerpts:
        p1: 列奧納多把那幾卷翻了很久，拿起筆，在每一卷末尾寫下自己的名字和編成的年份。他等墨乾透，把卷子一卷卷碼進木箱，扣上了搭扣。
    relic: 一塊寫著數字的蠟板
    relic_desc: 板上把十個新數字和舊的羅馬數字並排寫在一起。
    points:
      p1: 說服列奧納多把 1202 年初編的一整套抄本簽好名留在比薩，讓它不被後來的修訂本取代
    points_fail:
      p1: 等作者改寫以後，借書人只認得後來那一套抄本，不能恢復早本。
    shift:
