    story:
      - 你是一家穿越事務所的所長，招募員工，派他們回到過去。
      - 在可能走岔的時刻，守護本該發生的事，也在平行分支裡彌補歷史留下的遺憾。
      - 守住的關鍵節點和彌補的遺憾都會帶來時空能量，攢夠了，你就能回到未來和家人團聚。
    story_start: 一切從中山大學的孫中山先生銅像前開始。謹以此紀念先生誕辰 160 週年。
