      address: 彼得羅把署名抄進了去向欄。{staff}把紙籤翻過來，給他看寫著收件人的一面。他用筆畫了一道，很輕，底下原來的字還能認出來。
      privacy: 露琪亞讓{staff}扶著紙包，好騰出手裹信。樓梯上有人問信是誰的。她把紙籤轉向牆，才開口答話。
      stairs: '{staff}在樓梯平臺聽見翻紙的聲音，樓下隨即有人敲門。彼得羅把空白行李籤擱在扶手上，回來還找得到。'
  cao_xueqin_beijing:
    name: 末回後面的一張白紙
    place: 北京西山
    figure: 曹雪芹
    story: 《石頭記》甲戌本留下曹雪芹生前已有帶批語抄本流傳的線索。卷首一條後加眉批迴憶曹雪芹去世時書尚未成。故事設在他晚年的冬天，現存資料不足以確定他的卒日或最後寫成了多少回。
    story_prose:
      opening:
        - 西山的天暗得早。抄書人抱著一包稿子進屋，先問哪幾頁能帶走。他把包袱擱在床邊的小桌上，最上頭壓著一張白紙。
        - 《石頭記》早在曹雪芹生前就已有帶批語的抄本。甲戌本後來添的一條眉批記得他去世時書還沒寫成。這個冬夜是故事裡的機會，桌上那疊紙等著他親手分一分。
        - 抄書人要趁天黑前回去。懂稿子的人可以先把來借的批本從改稿裡找出來，會照料人的便看看火和燈。等桌面騰出來，才有地方攤開草稿。
      points:
        p1: 抄書人摸到夾在改稿裡的一疊，正要和床邊的紙一塊兒紮起來。你看見頁邊有別人寫的小字，請他再讀一行。他把批本另包了一層，曹雪芹還要改的幾張則留在手邊。兩包紙各系一道繩。
        p2: 炭快熄時，曹雪芹把剛翻到的一頁合上了。你請來送炭的人把火續上，再把燈挪近，只遞他剛才沒看完的那一張。他把手伸出被角，又從那行接著看下去。那一晚，燈在他夠得著的地方。
        p3: 你說後來有人續寫，寫到「蘭桂齊芳」。曹雪芹皺了皺眉，翻回第五回《飛鳥各投林》的末句，指著那片白茫茫。你又翻開脂批本，問後世說這書在悼念故明，可是這個意思？曹雪芹大笑，一句話也沒說。等他再拿起筆，只在已經想定的幾張上點了記號。抄書人照他點的地方抄，餘處仍空著。
      outcomes:
        all: 抄書人出門時夾著兩頁。哪幾回已經排定，哪幾處作者還想再看看，兩張紙一對就明白。至於那一聲笑，誰也沒有替他寫下解釋。
        p1: 早期批本讓抄書人帶走，床邊還放著等曹雪芹再看的稿子。
        p2: 床邊的燈又多亮了一陣，曹雪芹看完了方才擱下的那頁。
        p3: 有記號的地方抄下，尚未想定的地方留白。抄書人沒有把自己的猜想添進正文。
      none: 紙還是按來時的樣子疊著。後來有人問起最後幾回，那張白紙上沒有留下答案。
      not_admitted: 抄書人進門去了。你等到院裡的燈只剩一盞，也沒能把那疊紙拿到桌邊。
      desync: 批本混進退還的改稿，抄書人沒能把它帶走。桌前那段工夫已錯過，事務所把你召回。
      excerpts:
        p1: 兩包紙各系一道繩。
        p2: 那一晚，燈在他夠得著的地方。
        p3: 抄書人照他點的地方抄，餘處仍空著。
    relic: 兩頁章回安排
    relic_desc: 遊戲紀念物。一頁列著擬好的章回次序，另一頁留下作者還未決定的地方。
    points:
      p1: 讓抄書人留下早期批本，再把等著曹雪芹改的稿頁交還給他
      p2: 替他添火、備好稿頁，讓曹雪芹有一晚能專心想結尾
      p3: 趁他還有力氣核看，照他認可的次序抄出一份收束提綱，託人帶走
    points_fail:
      p1: 桌上那份批本混進要退回的改稿裡，這條支線裡的讀者空著手離開。
      p2: 稿紙還沒理齊，炭火已經要熄了。只能改天接著寫。
      p3: 抄書人能理出散頁，卻不知道哪些結局曹雪芹已經想定。
    shift:
      p1:
        was: 甲戌本留下了曹雪芹生前已有早期批本傳抄的記錄。
      p2:
        was: 甲戌本有一條眉批，回憶曹雪芹去世時書還沒有寫完。
        now: 這條支線裡，有人看著炭火，一次遞一張稿頁。曹雪芹多得了一個晚上，能想清楚故事接下來往哪裡走。
      p3:
        was: 甲戌眉批記書未成，沒留下曹雪芹親自核過的收束提綱。
        now: 抄書人帶走兩張紙。一張是曹雪芹在這條支線裡點定的次序，一張是他還沒拿定的幾個人的下場。後來轉抄的人把兩張紙一直夾在一起。
        who: cao_xueqin_beijing
        bio: 曹雪芹生前和抄書人核過一份收束提綱。這條支線的讀者看得見哪些結局是他定下的，哪些他仍留著空白。
    vignettes:
      ink: 抄書人夾進一張紙籤，把擬好的章節次序同讀者的猜測隔開。紙頁散了也知道各該放回哪一處。
      paper: '{staff}把燈端進來。抄書人把稿子從桌沿往裡收了收，讓出一小塊地方。'
      empty: 末頁還能寫一個回目。抄書人看了看，照原樣空著。
  jenner_berkeley:
    name: 第一支疫苗
    place: 英國伯克利
    figure: 愛德華·詹納
    story: 詹納 1798 年出版的《探究》回顧了較早的牛痘與天花觀察和病例。
    story_prose:
      opening:
        - 伯克利，薩拉·內爾姆斯到了屋門口，把裹過的手擱在圍裙上。詹納想問她從哪天開始病，抄寫人卻誤把她的名字寫到旁人的條目下。她站著等，想先說今天還要不要去奶場。
        - 1798 年，詹納出版研究，回顧薩拉患牛痘的經過及 1796 年的一次早期接種。傳統上與接種有關的孩子是詹姆斯·菲普斯。這一趟先聽薩拉自己想要什麼照護，再幫後來觀察留下能核對的記錄。
        - 懂照護的員工先去聽薩拉說。擅長整理記錄的人再把各份病例按姓名和來訪日期核對，由家人及詹納商量是否繼續觀察。
      points:
        p1: 抄寫人在等日期，薩拉把手收回來，說先要有地方坐。你把椅子移到門邊，問她想不想請照護者看看手。等她自己答應，你替她傳話給奶場，讓她晚些再回去。薩拉離開前還能騰出另一隻手，自己拿走寫著名字的那張紙。
        p2: 詹納的筆記裡有一頁寫著孩子回訪的結果，下面還沒留核對的日期。你把新頁交給抄寫人，讓他分開當事人的記錄和後來聽來的說法。詹納問後續觀測誰還願意回來，一戶家人先留下了自己的地址。抄寫人把日期填好，空出一行等他們到後自己確認。
      outcomes:
        all: 薩拉手上的不便有人照應，之後回訪也有可核的記錄。詹納可以繼續整理這一年的觀察。
        p1: 薩拉能歇幾天再回奶場。後續的病例記錄仍要等別的來訪者。
        p2: 早期觀察之後還有可查的回訪。薩拉手上的瘡仍是她自己慢慢熬過去。
      none: 薩拉回到奶場時沒有等到照護，後續觀察也未約下來。
      not_admitted: 抄寫人先問你跟哪一家的預約來。你沒進門，那張日期旁還留著空白。
      excerpts:
        p1: 薩拉離開前還能騰出另一隻手，自己拿走寫著名字的那張紙。
        p2: 抄寫人把日期填好，空出一行等他們到後自己確認。
    relic: 一張回訪便箋
    relic_desc: 紙上寫著姓名和日期，還留著一行記回訪所見。
    points:
      p1: 替擠奶女工薩拉·內爾姆斯包紮手上的牛痘瘡，不讓她一個人硬熬
      p2: 核對早期病例記錄上的姓名和日期，給願意回訪的家人約好時間
    points_fail:
      p1: 她手上的瘡沒人照料，自己慢慢熬過去，這條分支裡沒有人讓她少受幾天罪。
      p2: 沒有人安排回訪。這條分支裡，詹納和史實一樣，到 1798 年才繼續接種研究。
    shift:
      p1:
        was: 1796 年 5 月，擠奶女工薩拉·內爾姆斯從主人家的牛身上染上牛痘，手上長出一大塊膿皰，也有這病常見的症狀。
        now: '{staff}替她把手洗淨包好，她早幾天回到了奶場。'
      p2:
        was: 1796 年的早期病例之後，詹納到 1798 年春才繼續接種研究。
        now: '{staff}替願意回訪的家人約好了時間。那個夏天，詹納就拿到了可以與先前記錄互相核對的回訪便箋。'
        who: jenner_berkeley
        bio: 在這條時間線裡，1796 年夏天詹納收到了自願回訪的家人留下的觀察記錄。
    vignettes:
      firsthand: 虛構的謄寫員把每則記載都謄成了同一種口氣。你問哪一件是記述者親眼見過的。他在其餘條目旁補上說明，沒把每一行都當成同一等證據。
      order: 抄件裡兩條觀察換了位置。你核對日期，謄寫員先把紙籤調回來，才照先後講述。
      blank: 謄寫員有一條無法確定，你在下面留了地方。紙遞出去以前，空白旁添上說明，免得後來人當成漏抄。
  mallory_everest:
    name: 最後一次被人看見
    place: 珠穆朗瑪峰
    figure: 喬治·馬洛裡
    story: 馬洛裡在 1924 年遠征中留下的信件記述了不同營地的狀況和計劃。馬洛裡與歐文的結局無法證明二人是否登頂。
    story_prose:
      opening:
        - 北坳的帳篷口有人問下來的諾頓現在能不能睜眼。另一位隊友朝上望，馬洛裡還在準備下一次出發，夾在舊帳篷裡的指南針沒有跟他下來。
        - 1924 年，諾頓與薩默維爾從珠峰上方折返，隨後馬洛裡和歐文出發。6 月 8 日奧德爾看到兩個人繼續向上，二人沒有返回。這裡可以接應先下來的同伴、歸還指南針，也可以讓後一隊在北坳平安留下回程記名。
        - 帶有照護能力的人先看諾頓與薩默維爾想要什麼。熟悉營地交接的人核指南針在哪裡，之後找能接應另一隊回程的員工。
      points:
        p1: 諾頓回頭喊了一聲，薩默維爾沒能回答，只把手按在膝上。你請走在前面的人回來，找一處能讓他先坐的地方，等他能說話再問還有什麼不適。薩默維爾點了頭，兩個人才把原本擋在他膝邊的包挪開。起身時，他先等諾頓把那句問候聽完。
        p2: 諾頓說燈邊太亮，話剛說完就把眼閉上。你請他自己挑能歇息的位置，試試讓事務所的照護員工幫忙。過了一陣，他說有一處還發痛，另外那隻眼已經能辨一點光。等人重新舉起記名板，他能自己看清寫的是哪一行。
        p3: 奧德爾翻開五號營地的布兜，看見小圓盒挨著一件備用物。你先核過馬洛裡留的話，再帶著牌記把它交到他手裡。馬洛裡打開看了一眼，叫旁人也看清，他這回自己裝進要隨身帶的口袋。 那隻指南針最後在他的外袋裡。
        p4: 有人從北坳問雲裡下來的兩個人是不是前一隊。你等到他們能自己叫出名字，才請守營的人記上。馬洛裡把包先放在雪地裡，歐文坐到靠裡的一處。他們在營地複述的是下來的經過，沒人能替他們填一個登頂時間。
      outcomes:
        all: 薩默維爾和諾頓平安回來，指南針也交到了馬洛裡手裡。後一隊名冊上在北坳添了兩名返回者。
        p1: 先一隊的兩個人平安回營。之後上去的一隊還要等別的接應。
        p2: 諾頓在分支裡恢復到能辨認手邊的字。其餘記錄照行程結算。
        p3: 指南針裝進他自己隨身的包。僅憑這件物品的去向仍說不準兩人的終點。
        p4: 馬洛裡與歐文活著回到北坳。回程的結局改變了，營地沒有確證他們登頂。
      none: 營地眼前只有風雪和沒有改過的名單。奧德爾後來記了兩人最後一次出現在山脊上。
      not_admitted: 值班人沒同意陌生人接替看帳篷。你等在門外，裡面只說了幾件未歸還的用品。
      desync: 薩默維爾沒隨諾頓回到營地。前一隊的回程與史實脫節，事務所召回員工。
      excerpts:
        p1: 起身時，他先等諾頓把那句問候聽完。
        p2: 等人重新舉起記名板，他能自己看清寫的是哪一行。
        p3: 那隻指南針最後在他的外袋裡。
        p4: 他們在營地複述的是下來的經過，沒人能替他們填一個登頂時間。
    relic: 一把冰鎬
    relic_desc: 一把樸素的木柄冰鎬，鎬頭磨舊了。
    points:
      p1: 薩默維爾下山時喉頭被堵住，幫他喘過這口氣，護住他和諾頓那次衝頂平安收尾
      p2: 治好諾頓的雪盲
      p3: 把馬洛裡落在五號營地的指南針送到他手上
      p4: 勸回馬洛裡和歐文，或在他們下撤時接住，讓兩人活著回到北坳
    points_fail:
      p1: 薩默維爾在雪裡坐下，再沒有站起來。衝頂的兩個人只回來一個，這條分支與歷史脫了節，事務所召回員工。
      p2: 諾頓的眼睛疼得睜不開，接下來幾天他什麼也看不見。
      p3: 指南針還留在五號營地的帳篷裡。6 月 8 日兩人往上走時，身邊沒有它。
      p4: 6 月 8 日中午過後，奧德爾最後一次看見兩人在山脊高處往上走。他們沒有回來。
    shift:
      p1:
        was: 1924 年 6 月 4 日，諾頓和薩默維爾從六號營地出發，到達約 8570 米；下山時薩默維爾的喉頭被凍壞的組織堵住，幾乎窒息，咳出後兩人回到營地。
      p2:
        was: 1924 年 6 月 4 日夜裡，諾頓患上嚴重的雪盲，回到北坳後幾乎看不見東西。
        now: 諾頓的眼睛第二天就消了腫，他看得見北坳上來來往往的人。
      p3:
        was: 1924 年 6 月 7 日，馬洛裡從六號營地托挑夫帶條子給奧德爾，說指南針落在了五號營地的帳篷裡，他們身邊沒有指南針。
        now: 6 月 8 日清早出發時，馬洛裡的指南針在他自己口袋裡。
      p4:
        was: 1924 年 6 月 8 日，奧德爾最後看見馬洛裡和歐文在東北山脊高處向上攀登，兩人再沒有回來；1999 年馬洛裡的遺體在約 8160 米處被找到。
        now: 6 月 9 日兩人下到北坳，凍傷了，但活著。馬洛裡回到英國，回到露絲和三個孩子身邊。他們那天到了哪裡，這條時間線也沒有答案。
        who: mallory_everest
        bio: 1924 年他和歐文從珠峰活著下來。他回到妻子露絲和三個孩子身邊，又活了許多年。
    vignettes:
      date: 虛構的送信人拿著來自兩個營地的信，交接單上卻只寫一個日期。你請他各自看信頭，兩封信出發時便各帶著自己的地名和日期。
      question: 送信人把預定出發念成了準會出發。你在信中說到天氣的地方請他停一下。他再念這項計劃時，連同那個條件一起說出來。
      wrap: 送信人在膝上分揀紙頁，你替他把要帶走的信封放在一旁。他可以另把營地清單收好，不用折進信裡。
  nightingale_scutari:
    name: 把護理做成用數據和關懷的學科
    place: 奧斯曼斯庫塔裡
    figure: 弗洛倫斯·南丁格爾
    story: 弗洛倫斯·南丁格爾 1858 年的軍隊衛生報告依據戰時經驗，收入醫院統計。
    story_prose:
      opening:
        - 斯庫塔裡，病房剛換了一次班。南丁格爾把一份轉房名單遞給門邊的人，請他先和今天新收的人分開。衛生委員會抵達的消息已送來，三位委員正要開始查看。
        - 衛生委員會 1855 年 3 月到斯庫塔裡查看醫院，赫克托·加文四月在巴拉克拉瓦死於一次意外。南丁格爾五月在當地重病，後來脫險，健康長期受影響。這趟可讓查看繼續，也可改寫兩人的病險。
        - 讓懂病房交接的人護住查訪記錄。能照應營地的人先關照加文的安全。後來照護南丁格爾的人，要問她願意怎樣休息。
      points:
        p1: 一名書記把換病房的人算作新入院。你請值班護士拎著兩份單子讀回一遍，在委員會的人到門口前指出哪些是重複的。查訪人員沿記錄先去了有問題的病房，才問下一個地方。有人帶著分開的兩冊出來，兩冊都還有許多空頁。
        p2: 加文站在營帳口，準備把手裡的左輪交給弟弟。你請兩個人暫時停一下，讓負責營地安全的人來接手。等他們坐回帳裡的桌旁，加文把本來要帶走的衛生記錄重新打開。下午再有人找他簽字，他還坐在那一張桌邊。
        p3: 南丁格爾還託人送來要看的表，等表真正到了又請人先收起。你問她願不願意讓事務所照護者留下，叫忙著等答覆的人改天再來。她有多些力氣時，先說房裡可以開一點窗，然後才問原先到哪頁。等她再次攤開那張表，家裡沒有人催她馬上籤完。
      outcomes:
        all: 查看按期繼續，加文免於那次意外，南丁格爾也在分支裡從五月的病中恢復。她後來繼續工作，按自己的體力決定每天做多少。
        p1: 委員會順利開始查看，記錄帶回去供他們繼續處理。
        p2: 加文平安留在營地。他手頭那份衛生記錄還有機會繼續整理。
        p3: 南丁格爾在這條分支恢復得更快。她自己選定哪天再展開報表。
      none: 病房單子被混放了一陣。那些等消息的人仍分別等四月和五月的來信。
      not_admitted: 門房請不在查訪名單的人在外間等。你聽見護士再次核對轉房名單。
      desync: 查看沒有按期開始。護理與衛生記錄脫節，事務所召回員工。
      excerpts:
        p1: 有人帶著分開的兩冊出來，兩冊都還有許多空頁。
        p2: 下午再有人找他簽字，他還坐在那一張桌邊。
        p3: 等她再次攤開那張表，家裡沒有人催她馬上籤完。
    relic: 一盞小油燈
    relic_desc: 她夜裡查房時用的那盞燈。
    points:
      p1: 在病房的傷寒和霍亂裡，護住衛生委員會 3 月 6 日起對斯庫塔裡各醫院的查看
      p2: 在巴拉克拉瓦的帳篷裡攔下走火的左輪槍，救下衛生委員赫克托·加文
      p3: 治好南丁格爾 5 月在巴拉克拉瓦染上的克里米亞熱，不讓這場病跟她一輩子
    points_fail:
      p1: 查看在病房裡拖住，堵著的下水道沒能及時打開。這條分支與歷史脫節，員工被送回。
      p2: 帳篷裡那一槍還是響了，這條分支裡委員會登岸一個月就少了一位委員。
      p3: 熱病照原樣走完。五月底她脫離了危險，這條分支裡這場病和歷史上一樣留在她身上。
    shift:
      p1:
        was: 1855 年 3 月 6 日，衛生委員會抵達君士坦丁堡，當天下午開始查看斯庫塔裡各醫院。
      p2:
        was: 1855 年 4 月 21 日，衛生委員赫克托·加文在克里米亞把左輪槍遞給弟弟時槍走了火，中彈身亡。
        now: '{staff}請兩人先停一下。加文放下左輪，請負責營地安全的人接手。他繼續做委員會的事，後來回到英國。'
      p3:
        was: 1855 年 5 月，南丁格爾去巴拉克拉瓦查看醫院，幾天內染上克里米亞熱，病危約十二天，此後大半生病弱。
        now: '{staff}在發病頭幾天用這個世紀還沒有的藥治住了熱病。南丁格爾一週內下了床，回到斯庫塔裡，那場跟她回家的病沒有留下。'
        who: nightingale_scutari
        bio: 在這條分支裡，南丁格爾 1855 年在巴拉克拉瓦染上的熱病被治好。她關於醫院和軍隊衛生的工作，是自己站著去做的，不是在病榻上做的。
    vignettes:
      totals: 虛構書記員把轉房名單也算進新收治人數。你問哪些名字是剛入院的。他另留一欄記轉房，再把報表送出去。
      name: 書記員隔著嘈雜聲沒聽清名字。你在報名字的人身旁等他再說一遍，下一份抄件就照他給的拼法寫。
      fold: 書記員念哪一處，你就按順序放哪一頁。原來夾在合計後面那張，這次先送到了他手裡。
  scott_last_camp:
    name: 冰架上的帳篷
    place: 羅斯冰架
    figure: 羅伯特·法爾肯·斯科特
    story: 斯科特日記最後一則署於 1912 年 3 月 29 日。現存手稿記錄了南極點歸途上的最後營地。
    story_prose:
      opening:
        - 羅斯冰架的風起來以後，雪橇上有一袋從冰川帶回的岩石。斯科特把日記移到離帳門更遠的地方，前面的人不敢答應明早能走多遠。奧茨脫下靴子，問還有沒有一處乾的地方可以坐。
        - 1912 年 3 月，斯科特一行在返程遇險。奧茨離開帳篷後未歸，斯科特等三人後來被困在距離一噸倉庫約十一英里的營地。你可以先保護留存的日記和標本，再分別照護奧茨和斯科特，最後嘗試接應到倉庫。
        - 找能攜帶器材和在嚴寒裡照應人的員工。兩處凍傷都讓照護者問本人，再準備好最後一段補給，多留時間給最慢的人。
      points:
        p1: 有人問能不能卸下一袋石頭。你請威爾遜先念袋上的採集地，又跟斯科特對過日記所在的位置。大家把不必翻找的東西放到下頭，讓日記和巖樣各有一處不會合在一起的地方。收帳時，標著冰川名的籤條仍能從雪橇側面看見。
        p2: 奧茨試把靴口撐開，手停在那裡，說這回走不了快。你請他先在帳裡坐穩，讓照護的人留下，和他商量明天怎樣跟隊伍同走。次日帳門打開時，他等到自己的靴子和其他人的擺在同一邊，才起身跟上。
        p3: 斯科特說右腳不像左腳那樣能踩住雪。你替他叫了隊裡能照護的人，請拉雪橇的同伴先放下繩，別為了省幾分鐘就走。再出發時，他把腳擺穩以後自己告訴旁邊的人可以動了。走出第一段，他還能停下來在日記上記當天的進度。
        p4: 風雪壓住帳門，前面還有十一英里。你等大家自己說準備好了，和熟悉補給位置的人輪流看方向。等見到倉庫邊的旗，先請最後那個人過來，再讓大家去看裡面還有什麼。給次日留的那頁日記在補給堆旁打開，筆尖還能在紙上移動。
      outcomes:
        all: 日記和巖樣隨隊帶到倉庫，奧茨、斯科特和留在隊伍裡的人都過了這一段。到倉庫後，記錄還添了新的一天。
        p1: 標本和日記留到最後，沒有因為減重散在冰架上。
        p2: 奧茨仍隨隊走。到下一次休息時，他和同伴能一起留在帳裡。
        p3: 斯科特還能把腳落穩。其餘人的情況和最後一段風雪仍要交給後來行動。
        p4: 隊伍裡走完最後一段的人到了倉庫。報告按各人實際分支登記到達者。
      none: 補給和人的精力越來越少。帳外一直是風雪，記錄停在三月下旬。
      not_admitted: 隊員還沒定誰能跟著出發。你留在帳外，油箱和巖袋都沒交到手裡。
      desync: 標本與日記的收存中斷。原有留下的記錄失去同步，事務所召回員工。
      excerpts:
        p1: 收帳時，標著冰川名的籤條仍能從雪橇側面看見。
        p2: 次日帳門打開時，他等到自己的靴子和其他人的擺在同一邊，才起身跟上。
        p3: 走出第一段，他還能停下來在日記上記當天的進度。
        p4: 給次日留的那頁日記在補給堆旁打開，筆尖還能在紙上移動。
    relic: 一本日記
    relic_desc: 一本用鉛筆寫的小日記，被凍得發硬。
    points:
      p1: 在燃油見底、人人力竭的三月，護住雪橇上的日記和比爾德莫爾冰川採回的岩石標本
      p2: 治好奧茨凍壞的雙腳，讓他跟得上隊伍，不必在 3 月 16 日前後走出帳篷
      p3: 在 3 月 18 日之前保住斯科特的右腳，不讓凍傷拖住整支隊伍
      p4: 帶三人冒著 3 月 21 日起的暴風雪，走完離一噸倉庫的最後十一英里
    points_fail:
      p1: 標本被卸在冰架上，日記也沒能留到最後一天。這條分支與歷史脫節，員工被送回。
      p2: 他的腳一天比一天壞，這條分支裡他照樣在 3 月 16 日前後走進風雪，再沒回來。
      p3: 右腳凍壞了，這條分支裡和歷史上一樣，隊伍越走越慢。
      p4: 暴風雪把帳篷困在原地，3 月 29 日以後日記再沒有新的一頁。
    shift:
      p1:
        was: 1912 年 3 月，回程燃油短缺，隊伍仍把日記和採自比爾德莫爾冰川的舌羊齒化石留在雪橇上，11 月 12 日搜救隊在帳篷旁找到它們。
      p2:
        was: 1912 年 3 月初奧茨雙腳嚴重凍傷，越走越慢，3 月 16 日或 17 日他走出帳篷，再沒回來。
        now: '{staff} 每晚給他焐腳、換幹襪，凍傷沒再壞下去。奧茨跟著雪橇走，到最後一個營地仍在隊裡。'
      p3:
        was: 1912 年 3 月 18 日，斯科特在日記裡寫右腳的腳趾幾乎全凍壞了，此後隊伍走得更慢。
        now: '{staff} 每次宿營都給他焐暖右腳、裹好。斯科特的腳保住了，隊伍照原來的速度往北走。'
      p4:
        was: 1912 年 3 月 21 日起，暴風雪把斯科特、威爾遜和鮑爾斯困在離一噸倉庫十一英里的帳篷裡，日記最後一則署 3 月 29 日，搜救隊 11 月 12 日找到帳篷。
        now: '{staff} 趁風勢稍弱領著三人往北，把最後十一英里分成幾段走完。他們在一噸倉庫找到燃油和口糧，熬過了這場風雪。入冬之前，他們回到了埃文斯角。'
        who: scott_last_camp
        bio: 這條時間線裡，斯科特和威爾遜、鮑爾斯從極點活著回到了埃文斯角。他回到英國，親自整理了這次遠征的日記和科學成果。
    vignettes:
      distance: 回到事務所，虛構書記員把一個數抄進已走路程一欄。你指出那是還沒走完的距離。他在抄件入檔前把數移了過去。
      blank: 回到事務所，書記員唸到最後一個日期停了筆。你等他想好後面的空白該怎麼標。他寫下「記錄到此為止」，才擱下筆。
      opening: 回到事務所，你翻開練習抄本，先讀日期再讀內容。書記員把同一日期寫上封籤，下一次還能按順序找到這一頁。
  seacole_balaklava:
    name: 自己找路去的戰地客棧
    place: 巴拉克拉瓦
    figure: 瑪麗·西科爾
    story: 瑪麗·西科爾 1857 年的回憶錄記有她同托馬斯·戴在巴拉克拉瓦附近經營的英式旅店、賣的東西和 1855 年來過的人。
    story_prose:
      opening:
        - 巴拉克拉瓦路旁的旅館剛開櫃，瑪麗·西科爾把到臨時醫院用的包往門邊推。托馬斯·戴問今天備了幾份貨，她說先去看看傷員，其他事回來再算。
        - 1855 年 6 月 18 日，西科爾記下戰鬥當天自己在臨時醫院附近照看傷員，也記下拇指受傷。她與戴經營的旅館還遇到失竊，和約後於 1856 年破產。這裡可以護住當日照護，再分別處理受傷、馬匹和積貨。
        - 派有照護經驗的人跟她去。夜裡要有熟悉旅館的人照管馬廄，隨後還需會算賬的員工同兩位經營者討論何時停止進貨。
      points:
        p1: 從路邊來的人伸手問能不能給臨時醫院捎些東西。你把門邊那個包和多的一份水交給搬運的人，和西科爾對清誰在靠近病榻的地方等。等她走到醫院邊，先前問話的人已經給她留出一處可以擱包的位置。她放下包，叫最近的傷員先說要什麼。
        p2: 西科爾扶住右手，說拇指一動就疼。你請一位照護者就近來幫她，先問願在哪兒坐，然後替她叫人接下手裡的包。歇了一會兒她抬起手說輕些了，讓來查看的人留一張紙給她記病人的名字。
        p3: 後門傳來動靜，夥計起身才發現馬廄原來沒人看。你請一人把西科爾叫來，另一人到能看見的地方點馬，不跟黑處的人起衝突。聽見院內有人應聲，門外的動靜停了。早晨開門，昨天要套車的那幾匹都還在槽邊。
        p4: 戴準備再進一批貨，西科爾讓他把還在貨架上的數給你聽。你請他們把預訂、現貨和欠賬另列一張，再問哪些能在撤軍前賣清。兩人核過一遍，劃去下一次進貨。西科爾把賬合上那天，櫃檯後還有空架留給最後來取貨的人。
      outcomes:
        all: 西科爾完成了路邊的照護，之後能繼續使用自己的手。馬和賬都有人看守，旅館停業後兩位合夥人還清了賬。
        p1: 她按自己的安排在臨時醫院旁幫傷員，晚上才回到旅館。
        p2: 她的拇指得到了照護，後來拿筆記字時方便些。
        p3: 夜裡想牽走馬的人沒得手，來車的人第二天仍能從馬廄取馬。
        p4: 西科爾和戴按清單結賬，撤軍時沒被最後一批貨拖住。
      none: 櫃上的貨沒點清，路邊的人仍等到後來才有人照護。
      not_admitted: 夥計請來客別擋運貨的門。醫院要取的包不在你的交接單上。
      desync: 西科爾沒能按史實到路旁照護。事務所因同步失敗召回員工。
      excerpts:
        p1: 她放下包，叫最近的傷員先說要什麼。
        p2: 歇了一會兒她抬起手說輕些了，讓來查看的人留一張紙給她記病人的名字。
        p3: 早晨開門，昨天要套車的那幾匹都還在槽邊。
        p4: 西科爾把賬合上那天，櫃檯後還有空架留給最後來取貨的人。
    relic: 一隻藥箱
    relic_desc: 一隻舊木藥箱，裡面分格放著草藥和紗布。
    points:
      p1: 6 月 18 日進攻稜堡失利那天，在炮火下護住西科爾在沃龍佐夫路臨時醫院旁照看傷員
      p2: 她為躲炮彈撲倒摔脫了右手拇指，當場替她復位、上夾板
      p3: 攔下夜裡來偷英國旅館馬匹的賊
      p4: 塞瓦斯托波爾陷落以後，勸西科爾和托馬斯·戴停下進貨、結清賬目，不讓和約一來他們就破產
    points_fail:
      p1: 那天她沒能走到臨時醫院，傷員在路邊等不到包紮。這條分支與歷史脫節，員工被送回。
      p2: 拇指只是當場草草包上，這條分支裡和歷史上一樣，再也沒長回原來的樣子。
      p3: 一夜之間馬廄空了大半，旅館還得去陸軍運輸營借牲口下山拉貨。
      p4: 和約之後軍隊撤走，存貨賣不出去，1856 年 11 月兩人在倫敦被宣告破產。
    shift:
      p1:
        was: 1855 年 6 月 18 日，聯軍進攻稜堡失利，西科爾帶著繃帶和食物冒著炮火走到沃龍佐夫路旁的臨時醫院，幫醫生照看傷員。
      p2:
        was: 1855 年 6 月 18 日，西科爾為躲炮彈撲倒在地，摔脫了右手拇指，當場包紮，此後再沒恢復原形。
        now: '{staff} 當場把關節復位、上了夾板。幾週後她的右手照常調藥、包紮。'
      p3:
        was: 1855 年，春山的英國旅館屢遭偷竊，有一天早上起來，馬廄裡的馬大半不見了。
        now: '{staff} 守夜時攔住了牽馬的人。第二天旅館的車照常下巴拉克拉瓦取貨。'
      p4:
        was: 1856 年 3 月和約簽訂後軍隊很快撤離，西科爾與戴剩下賣不掉的存貨和欠款，同年 10 月被人申請破產，11 月在倫敦被宣告破產。
        now: '{staff} 在秋天說動兩人停了大宗訂貨，把賒賬一筆筆收回。和約來時存貨已經不多，他們清了賬離開克里米亞，沒有走進破產法庭。'
        who: seacole_balaklava
        bio: 這條時間線裡，西科爾從克里米亞回來時沒有破產，手裡還有一筆本錢。她不必靠眾人捐款度日，用自己的錢繼續行醫和遠行。
    vignettes:
      meal: 一位虛構的來客站了太久，一時說不清來做什麼。你先找了個座位，等店員回來，來客已能自己開口問晚飯。
      counter: 兩個人都以為店員沒聽見對方，便把同一份點單各報了一次。你請店員把寫下來的念回來，原來只要備一盤。
      shelf: 店員喊著要在櫃檯末端騰個地方。你挪走兩隻空盤，再放把凳子，讓等候的人能坐下，也不擋下一位來客。
  wegener_greenland:
    name: 越過冰蓋
    place: 格陵蘭冰蓋
    figure: 阿爾弗雷德·魏格納
    story: 1930 年，魏格納運送補給抵達冰蓋內陸站艾斯米特，在回程中去世。阿爾弗雷德·魏格納研究所的檔案說明記下了行程，並指出格陵蘭同行者拉斯穆斯·威盧姆森的姓名。
    story_prose:
      opening:
        - 格陵蘭冰蓋上，雪橇的物資已經又點了一遍。魏格納問勒韋的腳還撐不撐得住。維盧姆森向他們說前面再看得見時，要辨清哪一處是冰中站。
        - 1930 年十月，魏格納、弗裡茨·勒韋與拉斯穆斯·維盧姆森到達艾斯米特。勒韋留下過冬，魏格納返回途中去世，維盧姆森及他帶走的日記失去蹤跡。分支裡可以先保住到站，再分別照護三人的健康和回程。
        - 讓有雪地經驗的人護住行進和交接。能照護的人要分別問勒韋和魏格納的情況，另有人確認維盧姆森何時出發、誰等他到西營。
      points:
        p1: 前面只能看見雪橇背影，維盧姆森請隊伍暫時並在一起。你把等著交的物資記在第一張紙，叫最後一個人逐項答過，才跟著走完最後一截。到站的人從裡面來接時，待交的包和人一起被點到了。
        p2: 勒韋把凍傷的腳擱到能歇的位置，問需要沒收起的一雙幹襪在哪裡。你請照護的人先聽他說完，讓另一位隊員替他拿東西。幾天後，照護者來問今天想不想自己換一個坐處。他拿著原先掛在床邊的東西，挪到了自己挑的那張凳子旁。
        p3: 有人要把日記和其他紙塞進同一個包，維盧姆森請先讓他看一眼。你請他選著方便隨時查的地方，又向西營報了要等他回來的消息。雪橇到達時，等著的人準備先幫他放下隨身東西。維盧姆森親手把日記的包從自己的行李邊遞了過去。
        p4: 回程的帳裡，魏格納問有沒有人能先替他報個平安。你把話帶出去，請照護員工回來聽他想休息多久。等一行抵達西營，守門人從帳裡拿來三條毯，讓幾個歸來的人先坐。魏格納用還在發抖的手，在報到表上寫了自己的名字。
      outcomes:
        all: 救援隊按期到站，勒韋的腳有了照護。魏格納和維盧姆森後來抵達西營，日記也被交到等著的人手裡。
        p1: 十月三十日到站，接應的人能按清單收下物資。
        p2: 勒韋的凍傷好轉，站上的照護讓他避開了原來的手術。
        p3: 維盧姆森和日記到了西營。報告另按魏格納那一星的實際結果記他的去向。
        p4: 魏格納活著在西營報到。日記的交接仍要看維盧姆森路上得到哪種幫助。
      none: 最後一段冰路越拖越久。西營那張等候的表仍空著名字。
      not_admitted: 物資單沒有來客的名字。值班人請你站在雪橇外側，別擋住接力的隊員。
      desync: 隊伍沒能按 10 月 30 日抵站，交接與史實脫節，事務所召回員工。
      excerpts:
        p1: 到站的人從裡面來接時，待交的包和人一起被點到了。
        p2: 他拿著原先掛在床邊的東西，挪到了自己挑的那張凳子旁。
        p3: 維盧姆森親手把日記的包從自己的行李邊遞了過去。
        p4: 魏格納用還在發抖的手，在報到表上寫了自己的名字。
