  nezahualcoyotl_texcoco:
    name: 歌旁寫著的名字
    place: 特斯科科
    figure: 內薩瓦爾科約特爾
    story: 內薩瓦爾科約特爾 1431 年成為特斯科科之主，統治到 1472 年去世。人們記得他是詩人，也是營造者，據說橫貫特斯科科湖的一道長堤是他規劃的。十六世紀收集的納瓦特爾語歌謠裡，有一些和他的名字連在一起，但是否出自他手，已無法確定。
    story_prose:
      opening:
        - 1472 年，特斯科科。內薩瓦爾科約特爾做這座城的主人已經四十一年，七十歲上下了。人們記得他是詩人，也是營造者，據說橫貫特斯科科湖、把湖水分開的那道長堤，就是他規劃的。
        - 史實裡，他在這一年去世，七歲的兒子內薩瓦爾皮利被推舉繼位；與他名字連在一起的歌，一百來年後才抄進一部歌集，最初是誰唱的，已經沒人知道。在這條分支裡，宮裡有個會唱那幾首歌的老歌者，要把歌教給一位學徒，排練時還有個歌者給接唱的人留提示，有個幫工管著練習稿的先後。
        - 這一趟用得上幾種人：守得住夜、膽子大或身子極結實的人，帶著睡眠調節器也行，在人心不定的那幾天護得住一個孩子；教過書、懂音樂，或有耐心、有條理，帶著錄音筆也行，一句一句學得全的人；性子安靜、肯陪著人，會照護病人，或帶著全息投影儀的人，在他最後的日子裡坐得住。
      outcomes:
        all: 這年，七歲的內薩瓦爾皮利被推舉為特斯科科之主。那幾首歌從頭到尾傳了下去，學徒後來又教給了自己的徒弟。一百來年後，它們被抄進一部歌集，寫在他的名下。
        p3: 這年，內薩瓦爾科約特爾在特斯科科去世。一百來年後，與他名字連在一起的歌被抄進一部歌集；五百多年後，墨西哥的百元鈔票上印著他的臉。
        p2: 那位學徒把幾首歌唱熟了，後來又教給了自己的徒弟。一百來年後，這些歌被抄進一部歌集，歌旁寫著他的名字。
        p1: 七歲的內薩瓦爾皮利被推舉為特斯科科之主，後來在這個位子上坐了四十多年。
      none: 這年，內薩瓦爾科約特爾在特斯科科去世。老歌者病倒時，那幾首歌還沒有教完，練習紙的後半截空著；推舉那天，宮裡沒有等來那個七歲的孩子。
      desync: 他去世後的那幾夜，門檻邊上沒有人守著。{staff}被召回時，推舉的日子還沒到，孩子住過的那間屋子空著，席子捲起來靠在牆角。
      not_admitted: '{staff}沒能進宮，只在城裡聽見歌者們練唱。一位歌者唱完一句，退回去，給接唱的人留出位置；唱的是誰的歌，聽的人各說各的。'
      points:
        p2:
          class_teaching: 這一年，宮裡的老歌者已經唱不了太久，一首歌唱到一半就要停下來喘口氣。他要把那幾首和內薩瓦爾科約特爾名字連在一起的歌，教給宮裡一位學徒。{staff}教過書，讓學徒一句一句跟著唸，唸熟一句再接下一句，每天收工前從頭背一遍，背錯的地方在練習紙邊上點一個記號。最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
          else: 這一年，宮裡的老歌者已經唱不了太久，一首歌唱到一半就要停下來喘口氣。他要把那幾首和內薩瓦爾科約特爾名字連在一起的歌，教給宮裡一位學徒。{staff}耐著性子坐在一旁，老歌者唱一句，就讓學徒跟一句，跟不上的地方請老人再唱一遍，一遍不行就兩遍。最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
        p3:
          class_medical: 他最後的日子裡，屋裡來來去去的人都放輕了腳步。{staff}會照護病人，替他掖好蓋毯，扶著他喝水，等屋裡只剩下他們兩個，才坐近了，慢慢說起以後的事。一百來年後，有人會把和他名字連在一起的歌一首首抄進書裡。五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
          else: 他最後的日子裡，屋裡來來去去的人都放輕了腳步。{staff}在他身邊坐了一個下午，等屋裡只剩下他們兩個，才慢慢說起以後的事。一百來年後，有人會把和他名字連在一起的歌一首首抄進書裡。五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
        p1: 他去世後的那幾天，貴族們聚在一起商量由誰繼位，宮裡進進出出的人一天比一天多。七歲的內薩瓦爾皮利被人領著，從一間屋子走到另一間屋子。{staff}守在他住的屋外，夜裡也不走開，生人來了先攔下問清楚，孩子睡著了，才在門檻邊上坐下來。推舉那天早上，孩子被大人牽著走出屋門，衣角在門檻上蹭了一下。門檻邊那塊坐了幾夜的地方，已經磨出了一片淺印。
      excerpts:
        p3: 五百多年後，很遠的地方還有人認得他的名字，錢上印著他的臉。他聽完，很久沒有說話，轉過頭去，望著門外那片湖水。
        p2: 最後一首教完的那天傍晚，學徒從頭唱到尾，一句沒落。老歌者沒有出聲，手在膝上跟著輕輕打著拍子。
        p1: 推舉那天早上，孩子被大人牽著走出屋門，衣角在門檻上蹭了一下。門檻邊那塊坐了幾夜的地方，已經磨出了一片淺印。
    relic: 一張接唱提示紙
    relic_desc: 接唱紙，分開給兩種名字留了位置。
    points:
      p1: 他去世後貴族推舉繼承人的那幾天，護住七歲的內薩瓦爾皮利
      p2: 幫宮裡的一位學徒把與他名字連在一起的那幾首歌，從老歌者那裡一句不落地學全
      p3: 在他最後的日子裡，讓他知道五百多年後人們還記得他的名字
    points_fail:
      p1: 推舉之前孩子出了事，這條分支裡特斯科科沒有照史實迎來七歲的新主。
      p2: 老歌者病倒前沒教完，這條分支裡那幾首歌照舊只傳下來一部分。
      p3: 他照史實在 1472 年去世，這條分支裡，他到最後也不知道後人會記得他。
    shift:
      p1:
        was: 1472 年內薩瓦爾科約特爾去世，七歲的內薩瓦爾皮利被推舉繼位。
      p2:
        was: 十六世紀後期，寫在他名下的一些歌被抄進歌集，最初是誰唱的，沒人知道。
        now: 那位學徒把幾首歌從頭到尾學全，後來又教給了自己的徒弟。
      p3:
        was: 1472 年內薩瓦爾科約特爾在特斯科科去世；與他名字連在一起的歌一百來年後才抄進歌集，墨西哥的百元鈔票印他的像，是五百多年以後的事。
        now: '{staff}在他最後的日子裡坐在他身邊，把這些告訴了他。'
    vignettes:
      voice: 一位歌者唱到以“我”開頭的那句走上前來，{staff}在練習紙上留了兩處，一處記唱的人，一處記歌裡唸的名字。
      drum: '{staff}放了一條邊角紙作記號，頭一位歌者起身時，紙頁仍留在下一位夠得著的地方，幫工又把它們按次序碼齊。'
      later: '{staff}記下這一句是從哪位歌者那裡聽來的，至於最初是誰作的，留著沒寫。'
  savitribai_phule_pune:
    name: 包裡多帶的一件紗麗
    place: 浦那
    figure: 薩維特麗巴伊·普勒
    story: 1848 年，薩維特麗巴伊·普勒與喬蒂拉奧·普勒在浦那開始辦女學。有關她的記述裡，有她去學校路上受到的侮辱，也有她隨身多帶、到學校再換上的那件紗麗。後來的辦學檔案記她擔任校長。1897 年，她在照顧鼠疫病人時染病去世。
    relic: 一塊石板
    relic_desc: 一塊小石板，上面用粉筆寫著第一排字母。
    points:
      p1: 開學頭一個月最難的那個早上，護住她去比德府的路，讓當天的課照常開
      p2: 勸回一個被家裡叫回去的女孩，讓她回到石板前
      p3: 攔下那段路上朝她扔東西的人，讓她不必再在包裡多帶一件紗麗
    points_fail:
      p1: 那天她沒能走到學校，比德府的門沒有開。
      p2: 這條分支裡，比德府的石板前少了一個人。
      p3: 她照舊每天在包裡多帶一件紗麗，這條分支與歷史一樣。
    shift:
      p1:
        was: 1848 年 1 月起，比德府的女子學校照常開課，薩維特麗巴伊每天走路去教書。
      p2:
        was: 1848 年，浦那許多人家反對女孩上學。
        now: 那個女孩又回來上課了。
      p3:
        was: 1848 年起，她去學校的路上被扔石頭和糞，包裡多帶一件紗麗，到校再換上。
        now: 從一個春天的早上起，路邊沒人再朝她扔東西，那件備用的紗麗一直疊在包裡沒用上。
    vignettes:
      slate: '{staff}把石板橫過來，讓兩個女孩同時夠得著。喊她們回家時，兩人都留了一道筆跡，彼此都指得出是誰寫的。'
      road: 去布德瓦爾區的路上，{staff}落後半步跟著，把包拎在背對門口的那一側。那天早上，街上沒人說話。
      chalk: '{staff}把最後一支粉筆掰成兩截，一截給黑板，一截給石板，又記下要去集市上買的東西。'
  ino_tadataka_ezo:
    name: 被直線吞掉的轉彎
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬從江戶出發，開始第一次測量。隊伍沿東北地方一路北測，渡海到蝦夷地，再沿海岸測到西別折返。來回全程約半年，不全是在島上度過。伊能忠敬於 1818 年去世，同伴在 1821 年完成《大日本沿海輿地全圖》。
    story_prose:
      opening:
        - 1800 年 6 月 11 日，江戶。五十五歲的伊能忠敬帶著測量隊出發，一行六人，要一路北上，渡海到蝦夷地，沿著海岸量出一條線。這是他頭一回測量，後來他走遍了日本的海岸；他去世三年後，同伴們畫成了《大日本沿海輿地全圖》。
        - 史實裡，幕府給的補助不多，路上的花銷大半由他自己掏；這一趟全靠步子量，測繩要到第二次測量才用上；測量隊沿蝦夷地南岸量到西別，就循原路折返了。在這條分支裡，隊裡有個大聲數著步子的挑夫，海邊有個知道岸在哪裡拐彎的漁夫。
        - 這一趟用得上幾種人：會管賬、做過買賣，盤纏見底時撐得住的人，或是條理清楚、身子結實的人，帶著營養合成器也行；會木工、造船、補網，或懂工程、手巧細心，量得準一段路的人；身子骨極結實、走慣了遠路的人，懂航海、飛行或地質的人，或帶著探路無人機的人。
      outcomes:
        all: 這年冬天，測量隊回到江戶，前後一百八十天。帶回的圖上，蝦夷地的海岸一直畫過了西別，有一段的數字旁邊注著繩量。
        p3: 這年冬天，測量隊回到江戶。圖上的海岸線越過西別又延了一截，末端畫著一個小小的岬角。
        p2: 這年冬天，測量隊回到江戶。圖上有一段海岸，步數和繩量的數並排寫著；下一回出門，隊裡帶上了測繩。
        p1: 這年冬天，測量隊循原路回到江戶，前後一百八十天。那根測杖後來又跟著他出了好幾趟遠門。
      none: 八月底，錢袋空了，測量隊沒走到西別就收拾行李往回走。挑夫數步子的聲音一路低了下去，計數單的最後幾行空著。
