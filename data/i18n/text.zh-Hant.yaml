      p1: 病房裡的人手一個個倒下，照料斷了，這條分支裡她照顧病倒的修女這件事沒能像史實那樣做下去。
      p2: 她沒熬過去，照史實成了那幾個月裡去世的修女之一，這條分支裡病房又空了一張床。
