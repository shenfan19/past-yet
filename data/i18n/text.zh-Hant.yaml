  galois_paris:
    name: 決鬥前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽羅瓦
    story: 1832 年 4 月 29 日，埃瓦里斯特·伽羅瓦在巴黎獲釋出獄。5 月 29 日夜裡，他給朋友奧古斯特·舍瓦利耶寫信，概述自己關於哪些方程能用根式求解的發現，託他把信刊出。第二天清晨，他在決鬥中腹部中槍，被丟在原地，5 月 31 日死在科欽醫院，年僅二十歲。那年九月，舍瓦利耶刊出了這封信。十四年後，約瑟夫·劉維爾刊出了他的論文。
    story_prose:
      opening:
        - 1832 年 5 月，巴黎。二十歲的埃瓦里斯特·伽羅瓦一個月前剛獲釋出獄。他在少年時就找到了方程能否用根式求解的條件，這套想法後來開出了群論，可那時幾乎沒人讀懂。
        - 史實裡，5 月 29 日夜裡他給朋友奧古斯特·舍瓦利耶寫信，概述自己的發現，託他把信刊出；第二天清晨他在決鬥中腹部中槍，被丟在原地，5 月 31 日死在科欽醫院。那年九月信刊了出來，他的論文要到十四年後才由劉維爾刊行。在這條分支裡，他住處有個借給他墨水的看門老婦人，科欽醫院門口有個送了十年柴的車伕，印坊裡有個抱怨等號不夠用的排字工。
        - 這一趟用得上幾種人：管過檔案、做過翻譯或校對的人，或者有條理、熬得住夜的人，守得住那封信和那些稿子；懂醫護、帶對了急救包或藥的人，趕得上那天清晨；管過檔案、做過翻譯、又說得動編輯的人，讓後來的人讀得到下文。
      outcomes:
        all: 伽羅瓦活了下來。那年九月，信和一頁索引一起刊了出來，有人照著頁碼來借稿子。舍瓦利耶把他們問的頁碼抄成一張單子，伽羅瓦坐在桌邊，一條一條往下答。
        p3: 伽羅瓦在醫院裡躺到六月才下床。那年夏天，他又坐回桌前，桌上攤著那封信的草稿，頁邊那行字還在。
        p2: 九月以後，讀到這封信的人可以照著索引借看抄本，問題連著頁碼寄回舍瓦利耶手裡。1846 年，劉維爾刊出了他的論文。
        p1: 那年九月，舍瓦利耶把 5 月 29 日那封信刊在《百科評論》上。十四年後，劉維爾刊出了他的論文。
      none: 6 月 2 日，伽羅瓦葬進蒙帕納斯公墓的公共墓穴。看門的老婦人把他借去的那瓶墨水收了回來，在賬本上劃掉了一行。
      desync: 5 月 29 日深夜，那封信和信裡提到的稿子散在桌子兩頭，沒有人包起來。{staff}被召回時，蠟燭燒到了底，蠟油淌在一頁稿紙的邊上。
      not_admitted: '{staff}沒能進那棟樓，只在街角站過幾個晚上。樓上有一扇窗的燈一直亮到天快亮，有一回窗開了，一張揉皺的紙落在石板路上。'
      points:
        p1:
          class_lettered: 5 月 29 日夜裡，桌上攤滿了稿紙，那封寫給舍瓦利耶的信寫了一頁又一頁，信裡提到的論文壓在幾本書底下。{staff}跟紙和字打慣了交道，趁他還醒著，一頁頁遞給他核過，把信單獨摺好，論文按他報的順序另捆一包，兩包分別寫上收件人，等天亮託人送去給舍瓦利耶。天快亮時，伽羅瓦在一頁稿紙的邊上匆匆添了一行字，把筆擱下。桌上兩個紙包並排放著，上面那個寫著舍瓦利耶的名字。
          else: 5 月 29 日夜裡，桌上攤滿了稿紙，那封寫給舍瓦利耶的信寫了一頁又一頁，信裡提到的論文壓在幾本書底下。{staff}做事有條理，熬得住夜，守在桌邊，他寫完一頁就收一頁，把信單獨摺好，論文按他報的順序另捆一包，兩包分別寫上收件人，等天亮託人送去給舍瓦利耶。天快亮時，伽羅瓦在一頁稿紙的邊上匆匆添了一行字，把筆擱下。桌上兩個紙包並排放著，上面那個寫著舍瓦利耶的名字。
        p3:
          class_medical: 5 月 30 日清晨，槍聲過後，城外那片空地上只剩他一個人躺在草裡，旁邊的人都走了。{staff}懂醫護，幾分鐘內趕到，跪下來用紗布壓住他腹部的傷口，壓了很久才止住血，又用帶來的藥防著傷口發炎，攔下一輛路過的車，把他送到醫生手裡。幾天後，他在病床上醒過來，伸手要紙。護士給了他半張，他把紙翻過來，在背面寫起了算式。
          else: 5 月 30 日清晨，槍聲過後，城外那片空地上只剩他一個人躺在草裡，旁邊的人都走了。{staff}幾分鐘內趕到，打開帶來的納米醫療箱，照著說明給他止住了血，又防著傷口發炎，攔下一輛路過的車，把他送到醫生手裡。幾天後，他在病床上醒過來，伸手要紙。護士給了他半張，他把紙翻過來，在背面寫起了算式。
        p2:
          class_lettered: 九月，那一期《百科評論》在小印坊裡排版，排字工嘀咕著又去隔壁字盤借等號。{staff}管慣了文書，把舍瓦利耶手裡的稿子按頁編了號，抄成一頁索引，請編輯排在信的後面，又寫信約好一位願意逐頁讀下去的數學同行。印好的那一期擺在印坊的窗臺上，信後面多了一頁索引，一行一個頁碼。舍瓦利耶拿起一本，用指頭順著那一列頁碼往下數。
          else: 九月，那一期《百科評論》在小印坊裡排版，排字工嘀咕著又去隔壁字盤借等號。{staff}做事有條理，話也說得動人，坐在編輯桌前，把舍瓦利耶手裡的稿子一頁頁報給他聽，說動他在信後面添一頁索引，又約好一位願意逐頁讀下去的數學同行。印好的那一期擺在印坊的窗臺上，信後面多了一頁索引，一行一個頁碼。舍瓦利耶拿起一本，用指頭順著那一列頁碼往下數。
      excerpts:
        p3: 幾天後，他在病床上醒過來，伸手要紙。護士給了他半張，他把紙翻過來，在背面寫起了算式。
        p2: 印好的那一期擺在印坊的窗臺上，信後面多了一頁索引，一行一個頁碼。舍瓦利耶拿起一本，用指頭順著那一列頁碼往下數。
        p1: 天快亮時，伽羅瓦在一頁稿紙的邊上匆匆添了一行字，把筆擱下。桌上兩個紙包並排放著，上面那個寫著舍瓦利耶的名字。
    relic: 一封匆忙寫就的信
    relic_desc: 寫滿算式的信頁，頁邊寫著沒有時間了。
    points:
      p1: 5 月 29 日夜裡趁伽羅瓦還能逐頁核對，把寫給舍瓦利耶的信和信中提到的論文分別包好，送到收信人手上
      p2: 趁九月刊信，請編輯一併刊出手稿索引，約一位能逐頁核查的數學同行先讀留存稿
      p3: 5 月 30 日清晨決鬥以後，立刻把伽羅瓦送到醫生手裡，救下中了腹部一槍的他
    points_fail:
      p1: 約定的交接一再推遲，信與待寄的草稿被分開。舍瓦利耶收不到 5 月 29 日的信，事務所因同步失敗召回員工。
      p2: 九月的刊物只有信件。願意往下核對的人仍須先找到保管手稿的朋友。
      p3: 他中槍後被丟在原地，直到有路人發現，5 月 31 日死在科欽醫院，年僅二十歲。這條分支裡此後沒有伽羅瓦。
    shift:
      p1:
        was: 伽羅瓦 1832 年 5 月 29 日寫信給奧古斯特·舍瓦利耶，概述研究，並託他處理稿件和刊出書信。
      p2:
        was: 信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交給劉維爾，劉維爾於 1846 年刊行。
        now: 九月讀到這封信的同行可以按刊出的索引申請借看一份抄本。所提問題和對應頁碼回到舍瓦利耶手中，給下一輪審閱留下記錄。
      p3:
        was: 1832 年 5 月 30 日，伽羅瓦在決鬥中腹部中槍，被丟在原地；5 月 31 日他死在科欽醫院，年僅二十歲。
        now: '{staff}幾分鐘內趕到，止住了血，又沒讓傷口感染。伽羅瓦活了下來，回到數學上，親自向那些沒讀懂他的數學家講清自己的理論。'
        who: galois_paris
        bio: 伽羅瓦挺過了 1832 年 5 月的決鬥。他在巴黎繼續做數學，生前就看到自己關於方程的理論被人讀懂、討論。
    vignettes:
      candle: 5 月 29 日夜裡，{staff}替看門的老婦人往樓上送第二支蠟燭，樓梯窄，燭火被風壓得一歪一歪。她嘟囔說，這位年輕先生的燈從天黑亮到現在，墨水也是從她這兒借的，回頭得記進賬裡。
      cart: 5 月 31 日，{staff}在科欽醫院門口幫一個車伕卸柴，柴上還帶著露水。車伕說，昨天抬進去一個年輕人，今早就蓋上了布。他往這兒送了十年柴，最受不了的就是這種天氣好的早上。
      type: 夏末，{staff}在一家小印坊裡幫著撿撒了一地的鉛字，指頭上沾滿了油墨。排字工抱怨這一期有封信滿紙算式，等號得一個個從隔壁字盤裡借。
  van_gogh_auvers:
    name: 奧維爾的夏天
    place: 奧維爾
    figure: 文森特·梵高
    story: 1890 年 5 月 20 日，文森特·梵高來到瓦茲河畔奧維爾，住進拉武客棧，常去看保羅·加歇醫生。他幾乎一天畫一幅。約 7 月 10 日的一封信裡，他寫到不安的天空下大片的麥田。7 月 27 日，他朝自己胸口開了一槍，7 月 29 日去世，弟弟提奧在他身邊。
    story_prose:
      opening:
        - 1890 年夏，瓦茲河畔奧維爾。梵高住在拉武客棧，幾乎天天畫。七月的一封信裡，他寫到不安天空下大片的麥田。
        - 史實裡，他為弟弟一家的生計擔憂，七月底在奧維爾去世。在這條分支裡，麥田和客棧之間那條路上，還有人能扶一下畫布，也有人能聽他說完。
        - 這一趟用得上能在陣風裡看住畫架的人，也需要能把賬說清楚、能好好聽人說話的人。懂得照護的人還能在客棧陪一陣。
      points:
        p1: 麥田裡風壓著畫布。{staff}趕到畫架旁，踩實鬆動的架腳，把迎風的角扶穩，等梵高落下最後幾筆。深處的麥子先伏下去，近處還在動。梵高鬆開畫筆時，畫布下緣還離地半寸。
        p2: '{staff}和他把來信攤開，從提奧眼下的工作說到家裡的花用，逐條把能問清的寫在紙邊。梵高把那張紙折回信封裡。裝進去之前，他用手把翹起的封口撫了一遍。'
        p3: '{staff}把他畫過的幾片麥田一張張攤開，說以後會有人專程走進畫館，看這些地和天。梵高把最靠外的一張移回桌子中間。天色暗下去時，那一線黃還亮著。'
        p4: '{staff}在客棧陪他熬過最難的幾天，照應休息和日常起居，等到他自己願意把窗推開。客棧女孩把托盤擱在門邊。梵高伸手接住，往旁邊挪出一個擺顏料的位置。'
      outcomes:
        all: 夏天過去以後，麥田也有了別的顏色。客棧門邊還晾著幾張紙，寫過的信夾在最底下。
        p4: 秋天，客棧的人仍能看見他把畫具拎出門。門開的時候，一管顏料從兜裡露出錫色的一頭。
        p3: 後來有人在畫館裡停在那幾片麥田前。再走近一步，畫上的黃幾乎捱到眼前。
        p2: 那封談家計的信後來留在客棧桌上。展開時，從最淺的一道摺痕旁還看得見一行小字。
        p1: 麥田留在那幅畫裡。後來有人把畫舉到窗邊，看見油彩在地平線上有厚薄兩層。
      none: 客棧樓道響過一陣腳步。門邊的托盤推回去時，杯裡的水還平著。
      not_admitted: '{staff}沒能在客棧留下。小路盡頭看得見一截麥田，往前的路卻被屋角擋住。'
      desync: 畫架側倒在麥田裡。{staff}被召回時，掛在一條架腿上的麥穗還在風裡點頭。
      excerpts:
        p4: 客棧女孩把托盤擱在門邊。梵高伸手接住，往旁邊挪出一個擺顏料的位置。
        p3: 梵高把最靠外的一張移回桌子中間。天色暗下去時，那一線黃還亮著。
        p2: 梵高把那張紙折回信封裡。裝進去之前，他用手把翹起的封口撫了一遍。
        p1: 深處的麥子先伏下去，近處還在動。梵高鬆開畫筆時，畫布下緣還離地半寸。
    relic: 一管鉻黃顏料
    relic_desc: 一支擠癟的錫管，裡面是他畫麥田用的那種黃。
    points:
      p1: 暴風雨般的天空下，幫他把那幅麥田畫完，不讓畫布倒進麥田
      p2: 從巴黎回來以後，幫他把提奧一家的錢和生計問清、說開，不讓那場風暴壓在他身上
      p3: 讓他知道自己的畫會被記住
      p4: 7 月 27 日之前，治好他的身體和心病，讓他活下來
    points_fail:
      p1: 那幅畫在風裡倒進了麥田，這條分支裡沒有《麥田上空的烏雲》。
      p2: 他從巴黎回來，照舊覺得那場威脅提奧的風暴也壓在自己身上，這條分支裡沒有人幫他把錢的事理清。
      p3: 他照舊覺得自己的畫是提奧的負擔，這條分支裡沒有人告訴過他這些麥田後來的去處。
      p4: 7 月 27 日照史實發生，這條分支裡他沒能多畫一個季節。
    shift:
      p1:
        was: 1890 年 7 月初，梵高在不安的天空下畫成了大片的麥田，7 月 10 日前後寫信給提奧和喬說起它。
      p2:
        was: 1890 年 7 月初，梵高去巴黎看提奧一家，得知提奧想辭去做了多年的畫廊職位、自己開業；回奧維爾後他寫信說，那場威脅提奧的風暴也壓在自己身上。
        now: 他從巴黎回來時已經知道提奧家撐得住，回到麥田裡畫畫時，心上少壓了一件事。
      p3:
        was: 1890 年 7 月，梵高在信裡說覺得自己是個失敗者，看不到好的前途；他生前賣出的畫很少。
        now: 有人告訴過他，這些麥田以後會掛在博物館的墻上，有很多人專程去看。
      p4:
        was: 1890 年 7 月 27 日他受了槍傷，兩天后在奧維爾去世，只畫了大約十年。
        now: '{staff}陪他過了那個七月，病沒有再把他壓垮，那個夏天過去時他還在拉武客棧。他又畫了幾年，麥田之後還有別的季節。'
    vignettes:
      sky: '{staff}在本子上畫同一片田，一張窄窄地留著天，另一張把天留得多。再並在一起看，第二張才看得見雲底的暗。'
      wind: '{staff}等風吹過麥田，看著暗影從這頭走到那頭。本子上的第一筆還留著。'
      path: '{staff}走到看得見小路盡頭的地方。回來時，鞋邊沾了兩根細小的麥芒。'
  abel_froland:
    name: 一道算得出的五次方程
    place: 弗羅蘭
    figure: 尼爾斯·亨里克·阿貝爾
    story: 1828 年聖誕，尼爾斯·亨里克·阿貝爾受著寒、咳著嗽坐雪橇來到弗羅蘭鐵廠看望未婚妻，此後在那裡臥床十二週。1829 年 1 月 6 日，他寫下最後一篇論文，兩三頁，重述他交給巴黎科學院的那篇長稿的要點。4 月 6 日，他死於肺結核，二十六歲。兩天後，尚不知情的奧古斯特·利奧波德·克雷勒從柏林來信，說替他謀的職位已經落實。
    story_prose:
      opening:
        - 1829 年 1 月，挪威南部的弗羅蘭鐵廠。尼爾斯·亨里克·阿貝爾在未婚妻做家庭教師的那戶人家裡臥床，咳得厲害。他二十六歲，幾年前已經證明一般五次方程不能用根式求解，1826 年交給巴黎科學院的長稿卻一直沒有下落。
        - 史實裡，他聖誕坐雪橇來時就已受寒，此後在這裡臥床十二週，1 月 6 日寫下最後一篇兩三頁的短稿。4 月 6 日他死於肺結核。兩天後，克雷勒從柏林來信，說替他謀的職位已經落實。在這條分支裡，樓下的廚房女傭整夜聽著樓上的咳嗽，鐵廠的賬房照舊每天分揀郵包。
        - 這一趟用得上三種人：核得了推導、理得清稿件和收件記錄的人，懂護理、守得住病床的人，說得動遠方的朋友、肯替他把信催回來的人。
      outcomes:
        all: 四月，柏林確認職位的信寫成時，阿貝爾已經不在了。三月那封回信壓在他的枕頭底下，屋裡的爐火還沒熄。
        p4: 四月，柏林寫來確認職位的信時，阿貝爾已經不在了。三月那封回信，還壓在他的枕頭底下。
        p3: 弗羅蘭那間屋子的爐火，一直燒到了四月。
        p2: 很多年後，有人去巴黎找那篇長稿，翻到短稿頁腳那行小字，從那一年的收件簿翻起。
        p1: 那篇兩三頁的短稿寄了出去。信封上的字，是他自己寫的。
      none: 弗羅蘭的冬天很長。窗外的雪一直沒化，樓上的人咳了一夜又一夜。
      desync: 1 月 6 日，那篇短稿停在校對之前，{staff}被召回了。樓上的咳嗽聲還在，兩三頁紙攤在被面上，墨還沒乾。
      not_admitted: '{staff}沒能進那戶人家的門。樓上的人還在咳，柏林的消息還在路上。'
      points:
        p1: 1 月 6 日，阿貝爾靠在枕頭上寫那篇短稿，兩三頁紙攤在被面上。{staff}拿著筆一行一行跟著核推導，前後記號對不上的地方逐處標出來，他一處一處改。傍晚，稿子謄清了，被面上落著幾點墨。他把三頁紙理齊，用手掌壓了壓，才交出去。
        p2: 短稿還在手邊。{staff}把它同巴黎長稿的投遞日期對在一處，在兩份抄件的頁腳各記了一行小字：哪一年交的件，交給了誰，題目叫什麼。墨跡很淡，擠在頁邊，到天黑才乾透。兩份抄件，一份夾進了短稿，一份留在他的稿夾裡。
        p3: 一月底最冷的那些夜裡，阿貝爾咳得睡不著。{staff}守著爐子添柴，把床鋪焐暖，替他墊高枕頭、擦汗、餵水。有一夜窗玻璃上結滿了冰花，屋裡的爐火一直沒斷。天快亮時，他咳完一陣，又睡著了。
        p4:
          class_lettered: '{staff}照理來往信件的辦法，把柏林那邊替他奔走的人和事一條條列清，按人寫信，請他們先把進展寄回弗羅蘭，不必等事情落定。三月裡，回信到了。阿貝爾讓人把信拿到床前，讀了兩遍。信上沒有說職位已經定下，只說他們還在爭取。他把信摺好，放在枕頭底下。'
          else: '{staff}一封接一封往柏林寫信，說他病得重，請替他奔走的朋友先把進展寄來，不必等事情落定。三月裡，回信到了。阿貝爾讓人把信拿到床前，讀了兩遍。信上沒有說職位已經定下，只說他們還在爭取。他把信摺好，放在枕頭底下。'
      excerpts:
        p4: 信上沒有說職位已經定下，只說他們還在爭取。他把信摺好，放在枕頭底下。
        p3: 有一夜窗玻璃上結滿了冰花，屋裡的爐火一直沒斷。天快亮時，他咳完一陣，又睡著了。
        p2: 墨跡很淡，擠在頁邊，到天黑才乾透。兩份抄件，一份夾進了短稿，一份留在他的稿夾裡。
        p1: 傍晚，稿子謄清了，被面上落著幾點墨。他把三頁紙理齊，用手掌壓了壓，才交出去。
    relic: 一封封著的信
    relic_desc: 一封沒拆開的聘書，用細線系著。
    points:
      p1: 在阿貝爾病中寫最後一篇短稿時，幫他把證明核對到可以寄出
      p2: 趁短稿還在手邊，幫阿貝爾把它同巴黎長稿的投遞記錄對上，給找稿的人留下索引
      p3: 阿貝爾在弗羅蘭臥床的十二週裡，替他擋住屋裡的冷，減輕他的咳嗽和病痛
      p4: 請替阿貝爾奔走的人先寄一封進展信，讓他生前知道柏林還有人為他的職位努力
    points_fail:
      p1: 短稿停在校對之前，巴黎長稿的要點也沒有這份及時的公開記錄。行程同步失敗，員工被召回。
      p2: 尋找巴黎長稿的人只知道大致題目，仍要從舊收件記錄一頁頁找。
      p3: 冷和咳嗽沒人減輕，這條分支裡他在弗羅蘭的最後幾周和原來一樣難熬。
      p4: 弗羅蘭一直等不到柏林的消息，正式的好消息來得太晚。
    shift:
      p1:
        was: 1829 年 1 月 6 日，阿貝爾在弗羅蘭寫下最後一篇數學短稿，重述巴黎長稿的主要結果。
      p2:
        was: 1829 年前後，阿貝爾重述巴黎長稿的要點，原稿一度難尋，直到 1841 年才印行。
        now: '{staff}把短稿和舊投遞日期對在一處，兩邊各留一份索引。以後查稿的人能憑交件記錄縮小範圍。'
      p3:
        was: 1828 年聖誕，阿貝爾受著寒、咳著嗽坐雪橇到弗羅蘭，隨後開始咳血，此後在那裡臥床十二週。
        now: '{staff}守著爐火，把床鋪焐暖，最難熬的幾夜一直坐在床邊。阿貝爾最後幾周少受了些罪。'
      p4:
        was: 1829 年 4 月 6 日阿貝爾去世，柏林確認職位的信於兩日後寫成。
        now: '{staff}請聯繫人先把奔走過程寫回弗羅蘭。阿貝爾讀到朋友們正在為他爭取職位，知道這件事還有人在做。'
        who: abel_froland
        bio: 阿貝爾去世前收到柏林朋友奔走的進展，知道他們還為他留著繼續研究的機會。正式任命仍在他去世之後。
    vignettes:
      firewood: 二月最冷的那幾天，{staff}幫廚房女傭往樓上搬劈柴。女傭說，樓上那位先生咳一夜，她就在樓下數一夜，數到天亮也沒數清。
      sledge: 一月，{staff}幫馬夫給雪橇換一根斷了的轅木。馬夫說聖誕那趟從城裡接來一位先生，裹著三層毯子一路咳，下車時連自己的箱子都提不動，是他扛上樓的，賞錢他沒要。
      post: 四月，{staff}幫鐵廠的賬房先生分揀郵包。桌上的信摞了半尺高，各地的郵戳擠在一起。他翻出一封蓋著柏林郵戳的信，對著窗戶看了半天，說這一封來得不巧，收信的人已經不在了。
  riemann_selasca:
    name: 最後一篇論文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 1862 年秋，伯恩哈德·黎曼受了一場重寒，轉成肺結核，此後幾次南下意大利養病。1866 年 6 月，他第三次來，住進馬焦雷湖畔的塞拉斯卡。7 月 19 日，他在無花果樹下休息，仍在寫最後一篇論文，沒有寫完。第二天，他在那裡去世，三十九歲。十年後，他的全集出版，理查德·戴德金參與了編訂。
    story_prose:
      opening:
        - 1866 年 6 月，意大利北部的馬焦雷湖畔。三十九歲的數學家伯恩哈德·黎曼第三次南下養病，住進湖邊的塞拉斯卡。他在彎曲空間的幾何和素數分佈上的工作開闢了重要領域，這時他患肺結核已近四年。
        - 史實裡，7 月 19 日他躺在無花果樹下休息，仍在寫最後一篇論文，沒有寫完；第二天他死在那裡。十年後，他的全集由海因里希·韋伯編訂、理查德·戴德金參與出版。在這條分支裡，房東有個小女兒，每天替他撿樹下的落果，湖上有個只好教老婆划槳的船伕。
        - 這一趟用得上幾種人：教過大學、做過建模或校對的人，或者有學問、耐得住性子的人，跟得上他口述的公式；懂醫護、帶著納米醫療箱的人，治得了那個時代治不好的病。
      outcomes:
        all: 那年秋天，黎曼回到哥廷根，又上起了課。他帶回去的稿子裡，最後那篇多了幾頁，是在無花果樹下口述的。
        p2: 那年秋天，黎曼回到北邊的哥廷根。臨走那天早上，他在無花果樹下的椅子上坐了一會兒，把一頁稿紙摺好，放進了外衣口袋。
        p1: 最後那篇論文多寫了幾頁，用的是他自己的話。十年後全集出版，這幾頁隨那篇論文一起印了出來。
      none: 7 月 20 日，黎曼在塞拉斯卡去世。無花果樹下的椅子空著，椅面上落了兩個果子，沒有人去撿。
      not_admitted: '{staff}沒能進那戶人家，只在帕蘭扎碼頭幫人卸過幾回貨。從湖上望過去，塞拉斯卡那邊有一棵很大的無花果樹，樹底下擺著一把椅子。'
      points:
        p1:
          class_learned: 7 月 13 日下午，黎曼坐在無花果樹下的椅子裡，稿紙攤在膝頭，寫幾行就要停下來咳一陣。{staff}教過大學，搬一張小凳坐在他旁邊，他說一句，就照著記一句，公式裡的指標一個也沒記錯，記完的稿頁按頁碼壓在一塊石頭底下。傍晚起了風，黎曼伸手把最上面那一頁抽出來，湊到眼前看了很久。他把它放回去，又用那塊石頭壓好。
          class_lettered: 7 月 13 日下午，黎曼坐在無花果樹下的椅子裡，稿紙攤在膝頭，寫幾行就要停下來咳一陣。{staff}做過校對，搬一張小凳坐在他旁邊，他說一句，就照著記一句，記完一頁再唸給他聽一遍，稿頁按頁碼壓在一塊石頭底下。傍晚起了風，黎曼伸手把最上面那一頁抽出來，湊到眼前看了很久。他把它放回去，又用那塊石頭壓好。
          else: 7 月 13 日下午，黎曼坐在無花果樹下的椅子裡，稿紙攤在膝頭，寫幾行就要停下來咳一陣。{staff}讀過不少書，也耐得住性子，搬一張小凳坐在他旁邊，他說一句，就照著記一句，他咳的時候就停筆等著，稿頁按頁碼壓在一塊石頭底下。傍晚起了風，黎曼伸手把最上面那一頁抽出來，湊到眼前看了很久。他把它放回去，又用那塊石頭壓好。
        p2: 7 月 17 日夜裡，黎曼咳得坐不起來，房東的小女兒端著燈站在門口，不敢進去。{staff}懂醫護，打開帶來的納米醫療箱，照著說明給他用上，守在床邊，隔一陣摸一回他的額頭。天亮時他睡著了，呼吸長了一些。三天後的早上，他自己走到無花果樹下，在椅子上坐了一會兒。他彎腰拾起腳邊一個落下的無花果，放在了稿紙旁邊。
      excerpts:
        p2: 三天後的早上，他自己走到無花果樹下，在椅子上坐了一會兒。他彎腰拾起腳邊一個落下的無花果，放在了稿紙旁邊。
        p1: 傍晚起了風，黎曼伸手把最上面那一頁抽出來，湊到眼前看了很久。他把它放回去，又用那塊石頭壓好。
    relic: 一頁筆記
    relic_desc: 一頁寫著沒完成公式的紙，字很小。
    points:
      p1: 他在塞拉斯卡力氣一天天衰下去時，替他記下口述、理好稿頁，幫他把最後那篇論文往下寫一段
      p2: 治好拖垮他的肺結核，救下黎曼
