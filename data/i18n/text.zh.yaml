      p1: 包工人只按旧图估价，没人能确定接受哪套尺寸，工地取消本季安排，事务所因同步失败召回员工。
      p2: 一份报价把楼与塔的工钱都合在一栏，后来无法据账看出哪部分已经承诺。
      p3: 两部分仍等同一轮筹款。后续遇到缺口时，工人不知道哪些工作能拿到钱。
    shift:
      p1:
        was: 1901 年特斯拉与建筑师斯坦福·怀特讨论估价和设计。沃登克里弗在当年动工。
      p2:
        was: 沃登克里弗包括实验楼和塔，在改预算的通信里能看到多次设计修改。
        now: 工头在开工前就能把两部分各自结算，塔的改价也有前一轮可对照。
      p3:
        was: 工程最初得到摩根资助，之后未能取得足够的后续资金，计划未按设想完成。
        now: 书面约定先付清已确认的一段基础工程。往后资金不够时，工地能结清这部分，并把尚无款项的工作标出来。
        who: tesla_wardenclyffe
        bio: 特斯拉把沃登克里弗设想为无线通信和输电系统的一环。建设过程还要面对各轮报价、筹款和施工安排。
    vignettes:
      timber: 十月初，{staff}帮一个车夫把一车木板拉上通往工地的沙路，轮子每陷一回，就拿肩膀顶一回后挡板，新锯的木板一路冒着松脂味。车夫说路那头的农户已经拿这边的锤子声给母鸡定钟点了，工地歇工那几天，鸡下蛋下得最勤。
      signal: 十二月中旬，一个男孩靴子上全是泥，挥着报纸从车站跑上来：马可尼收到了大洋那边发来的信号。工头把报纸举得老远，问{staff}一个点真能跑那么远吗。{staff}说能。工头把报纸折好塞进外套，叫工人接着敲。
      watch: 十二月下旬，{staff}陪守夜人在崖上的木板棚里坐了一夜，把旧报纸往墙缝里塞，挡海湾吹来的风，炉子里的煤块烧得通红。守夜人从一张报纸上念出煤价，说塔盖这么高，最好值得这么漏风。
  mozart_requiem_vienna:
    name: 留下能认出的笔迹
    place: 维也纳
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特1791年12月在维也纳去世时，《安魂曲》尚未完成。奥地利国家图书馆保有工作稿和含弗朗茨·克萨韦尔·苏斯迈尔补写的交付谱。
    story_prose:
      opening:
        - 维也纳，送谱的人伸手去拿桌上最整齐的那摞。莫扎特从床边问，第一段的器乐页还在不在。康斯坦策让来人先等一等，另几张是没来得及收起的草稿。
        - 莫扎特在 1791 年最后几周病重，12 月 5 日去世。《安魂曲》当时尚未完成，开篇已有完整配器。分支里可以先保住那一叠已写成的开篇，也可以带事务所的虚构医疗箱去帮忙照护。
        - 认得乐器谱和草稿笔迹的人帮康斯坦策把纸分开。另需会照护病人且有医疗箱的员工，先问病人和家人的意愿。
      points:
        p1: 跑腿的人把两张纸掀开，指给你看上面都有同样的声部名字。你和康斯坦策请他再找完整配器的那一叠，逐页核到开篇结尾，草页标明后另放。纸包递到门边时，他里面外面都看一遍，知道哪一包可以先交给抄谱人。
        p2: 有人把鲜纸端到床边，问今天还抄不抄。你向莫扎特和家人说明带来的事务所医疗箱，然后让等着抄谱的人先回外屋。后来他醒了，烧已经退下去。他请家人把桌挪近一点，只翻开原来停住的那一页。
      outcomes:
        all: 开篇的分谱能重新取用，莫扎特也能回到桌前。你离开时，后面还空着，没有人知道他会怎样写完。
        p1: 第一段仍是一件完整的纸包。12 月 5 日莫扎特去世，后面的曲谱留给别人补写。
        p2: 莫扎特从病中恢复，但开篇的原谱已经拆散。本趟保留他醒来想翻谱的经过。
      none: 床边摊着还没抄完的乐句。莫扎特在 12 月 5 日去世，几摞纸仍等人来分辨。
      not_admitted: 来人和康斯坦策没有约过时间。抄谱人停在屋外，没能看到那一叠纸写了什么。
      desync: 开篇的完整分谱混进散页，原有谱件的交接没法对上，事务所召回员工。
      excerpts:
        p1: 纸包递到门边时，他里面外面都看一遍，知道哪一包可以先交给抄谱人。
        p2: 他请家人把桌挪近一点，只翻开原来停住的那一页。
    relic: 一页留白的练习谱
    relic_desc: 抄谱习作，留着已经写下的乐句停住的位置。
    points:
      p1: 在病中交接时，护住莫扎特已经配完器的《安魂曲》开篇，别让散页错放
      p2: 他 11 月 20 日卧床不起以后，治好那场让他起不了身的高烧
    points_fail:
      p1: 第一段的分谱和草页混在一起，再拼不回完整的开篇。这条分支与史实脱节，员工被召回。
      p2: 这条分支里那场病没有退，12 月 5 日他在维也纳去世，三十五岁。
    shift:
      p1:
        was: 1791 年 12 月，莫扎特去世时，《安魂曲》的开篇已经配完器，其余多处仍是未完稿。
      p2:
        was: 1791 年 11 月 20 日起莫扎特卧床不起，12 月 5 日在维也纳去世，教区登记的死因是急性粟粒热。
        now: '{staff}带去的药退了他的高烧，12 月里他从床上坐了起来。这条时间线里，他亲手写完了《安魂曲》，又在维也纳作曲、演出了许多年。'
        who: mozart
        bio: 莫扎特在 1791 年冬天病愈，亲手写完《安魂曲》，此后在维也纳又作曲、演出了许多年。
    vignettes:
      stack: 格蕾塔收拾桌面，顺手拿开一页看着空白的纸。你扶住一叠谱，让埃米尔去对它前一页。原来那行空谱也该收在原来的次序里。格蕾塔把它放了回去，夹一张小条记下原来的位置。
      hand: 眼前的乐句埃米尔抄得出，顺着写下去就要越过原来空着的一行。你请他在抄写停住的地方划个边记。交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。
      finish: 你哼得出后世合唱团会唱的那段。格蕾塔现在就得带走副本，问原谱在这一页写到了哪儿。你指出分界，把后来听过的旋律留在心里。下一版会在你离开后拼合。
  schubert_vienna:
    name: 三月那场音乐会的节目单
    place: 维也纳
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，弗朗茨·舒伯特在维也纳音乐之友协会的会场举行了一场只演自己作品的公开音乐会，这是他一生唯一的一场。那年秋天，他已在病中，搬进哥哥费迪南德在维登的新住处。10 月 2 日，他写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。11 月 19 日，他在那处住所去世，三十一岁。三首奏鸣曲到 1839 年才出版，题献也换了人。
    story_prose:
      opening:
        - 1828 年 3 月，维也纳。三十一岁的作曲家弗朗茨·舒伯特写了六百多首歌，还有交响曲和室内乐，大部分生前没有出版，也很少公开演出。这个月，靠朋友和演奏者帮忙，他要在音乐之友协会的会场办一场只演自己作品的音乐会，日子定在 3 月 26 日。
        - 史实里，这是他一生唯一的一场专场音乐会。那年秋天他已在病中，9 月搬进哥哥费迪南德在维登的新住处；10 月 2 日他写信给莱比锡的出版人普罗布斯特，推荐最后三首钢琴奏鸣曲，想题献给一位敬重的作曲家，对方对奏鸣曲没有兴趣；11 月 19 日，他在哥哥家里去世。三首奏鸣曲到 1839 年才出版，题献换成了罗伯特·舒曼。在这条分支里，协会有个摆椅子的门房，城墙外的葡萄酒园里有个拉琴的，维登那幢新房子里有个女房东。
        - 这一趟用得上几种人：懂音乐、手上稳的人，或者有条理、能张罗、意志够硬的人，把临时凑来的演奏者和会场约到同一晚；琴艺极好的乐手，或者管过档案、做过翻译、卖过书，脑子快又沉得住气的人，替他跟出版人把交稿谈定；带着纳米医疗箱的人，治得了那个时代治不好的病。
      outcomes:
        all: 那年十一月，舒伯特没有病倒。莱比锡的回信来了，他把它夹在三首奏鸣曲的手稿里，第一页上写着他要题献的那个名字。
        p3: 那年十一月，舒伯特没有病倒。入冬以后，维登那间屋子的窗下多了一张写谱的小桌，桌角压着一摞新的稿纸。
        p2: 11 月 19 日，舒伯特在哥哥家里去世，三十一岁。费迪南德收拾屋子时，从抽屉里取出一封莱比锡的回信，和三首奏鸣曲的手稿放在了一起。
        p1: 11 月 19 日，舒伯特在哥哥家里去世，三十一岁。3 月 26 日那晚的请柬，后来印进了一位朋友的回忆录。
      none: 11 月 19 日，舒伯特在哥哥维登的家里去世，三十一岁。三首奏鸣曲的手稿由费迪南德收着，过了十一年才印出来。
      desync: 3 月 25 日晚上，演奏的人和空出的会场还对不上日子，门房翻着登记簿，找不到 26 日那一栏该写谁的名字。{staff}被召回时，门房正把摆好的椅子一把一把叠回墙边。
      not_admitted: '{staff}没能进那群朋友中间，只在城墙外的葡萄酒园里坐过几个傍晚。有一回，邻桌的人哼起一首歌，说是一个叫舒伯特的人写的，哼到一半忘了词。'
      points:
        p1:
          trait_methodical: 3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}做事有条理，列了一张单子，挨家去敲演奏者的门，把日子和钟点一个个对过，请他们在单子上签了名，又回协会请门房在登记簿上把那一晚写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。
          trait_charismatic: 3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}会说话，挨家去找那几位演奏者，把记错了日子的那一位也劝回了 26 日晚上，又回协会请门房在登记簿上把那一晚写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。
          else: 3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}懂音乐，把几份分谱摊在门房的桌上，跟每位演奏者把曲目和钟点一一对过，又请门房在登记簿上把 26 日晚上那一栏写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。
        p3:
          class_medical: 8 月底，舒伯特的病又重了，夜里睡不安稳。{staff}懂医护，打开带来的纳米医疗箱，照着说明给他用上，此后每天早晚来看他一回。搬家那天，舒伯特自己抱着一摞谱子走上维登那幢新房子的楼梯，一口气走到楼梯顶上，没有停下来。他把谱子放在新屋的窗台下，推开了窗。
          else: 8 月底，舒伯特的病又重了，夜里睡不安稳。{staff}带着纳米医疗箱，照着箱里的说明一步步给他用上，此后每天早晚来看他一回。搬家那天，舒伯特自己抱着一摞谱子走上维登那幢新房子的楼梯，一口气走到楼梯顶上，没有停下来。他把谱子放在新屋的窗台下，推开了窗。
        p2:
          class_lettered: 10 月 1 日晚上，费迪南德家的桌上摊着三首奏鸣曲的手稿，旁边是写给莱比锡出版人普罗布斯特的信，只开了个头。{staff}管过文书，和出版人打过交道，把三份谱的页数和调性抄成一张交稿清单，把舒伯特想题献的那个名字写在清单最上面，又在信末添了一句，请出版方先回一封能核对的确认。舒伯特把信折好，在信封上写下莱比锡的地址。他把那张清单压在谱子最上面，用手掌抚平了折痕。
          else: 10 月 1 日晚上，费迪南德家的桌上摊着三首奏鸣曲的手稿，旁边是写给莱比锡出版人普罗布斯特的信，只开了个头。{staff}懂音乐，把三份手稿一页页理齐，核过页码和反复记号，抄成一张交稿清单，把舒伯特想题献的那个名字写在清单最上面，又在信末添了一句，请出版方先回一封能核对的确认。舒伯特把信折好，在信封上写下莱比锡的地址。他把那张清单压在谱子最上面，用手掌抚平了折痕。
