    desc: 能量够了，所长可以回到自己的时空，见家人。
quotes:
  newton:
    who: 牛顿
    quote: 如果说我看得更远，那是因为我站在巨人的肩膀上。
    authors:
      - AI
      - Fan Shen
  einstein:
    who: 爱因斯坦
    quote: 重要的是不要停止提问。
    authors:
      - AI
      - Fan Shen
  faraday:
    who: 法拉第
    quote: 只要不违背自然规律，再奇妙的事也可能是真的。
    authors:
      - AI
      - Fan Shen
  feynman:
    who: 费曼
    quote: 第一条原则是不要欺骗自己，而你恰恰是最容易被骗的人。
    authors:
      - AI
      - Fan Shen
  pasteur:
    who: 巴斯德
    quote: 机遇只青睐有准备的头脑。
    authors:
      - AI
      - Fan Shen
  carr:
    who: 卡尔
    quote: 历史是历史学家与事实之间不断的互动，是现在与过去之间没有尽头的对话。
    authors:
      - AI
      - Fan Shen
  santayana:
    who: 桑塔亚那
    quote: 不能记住过去的人，注定要重蹈覆辙。
    authors:
      - AI
      - Fan Shen
  ranke:
    who: 兰克
    quote: 历史只想说明事情本来是怎样的。
    authors:
      - AI
      - Fan Shen
  simaqian:
    who: 司马迁
    quote: 究天人之际，通古今之变，成一家之言。
    authors:
      - AI
      - Fan Shen
  hippocrates:
    who: 希波克拉底
    quote: 人生短暂，技艺长久。
    authors:
      - AI
      - Fan Shen
  thucydides:
    who: 修昔底德
    quote: 这部著作是为了成为一份永久的财富。
    authors:
      - AI
      - Fan Shen
catalog:
  pythagoras_croton:
    name: 第二根弦
    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 亚里士多德后来记述，他所称的毕达哥拉斯派把音阶中的音程同数联系起来。现有出处没有记下毕达哥拉斯亲自上过这样一课。
    relic: 两处点过墨的弦
    relic_desc: 工坊用来练习的弦，一处是凭记忆点的，另一处是量过弦长才点的。
    points:
      p1: 在同一根弦上比较整段与半段
      p2: 请做琴的人让另一个人试用记号
      p3: 稳住拍子，让两个学徒轮流拨弦
    vignettes:
      octave: 墨拉斯凭记忆在老师按过手指的地方点了墨。你把备用弦折成两段，指出中点到底在哪儿。他补了第二个记号，这次听到了八度。头一个点也留着，下一个学徒还可以拨出两处的差别。
      ear: 吕西斯能听声跟上，却没人给他看过手该按哪儿。你敲着拍子，让他听墨拉斯拨一次，再自己试。窗板合上时，吕西斯照着记号就能拨出这个音程，用不着先有人唱给他听。
      credit: 你几乎能看见后世把一个名人印在每道习题上。墨拉斯问备用弦该署谁的名。你记下他试的是哪一段，留他给自己的活署名。下一堂习作开始时，你已经回去了。
  thales_miletus:
    name: 留空的时辰
    place: 伊奥尼亚米利都
    figure: 泰勒斯
    story: 希罗多德把一次战事中白昼转暗的预告归于米利都的泰勒斯，只说他预告了年份，没有交代方法。
    relic: 一片留着空格的蜡板
    relic_desc: 港口记录，分别给年份和时辰留了格。
    points:
      p1: 比较传来的年份和记事人后来加上的时辰
      p2: 劝船主把传闻和约好的时辰分开
      p3: 等一等，看两处空格里有哪一格能填上
    vignettes:
      year: 赫格西亚斯留了两格，一格写年，一格写时辰。讲故事的人说了年份，他自己补了时辰，好让两格都齐整。船开之前，你让他把原话重念一遍。一格仍空着，这回是有意留空的。
      appointment: 船主墨利塔听过传闻，问要不要叫船员提前回来。你递给她两面蜡板，一面记听来的故事，一面写和船员说定的时辰。她自己定下回来的时候。那条传闻管不了谁提前返港。
      spoiler: 你差点说出后世的历书能标出当地时刻。赫格西亚斯把蜡板转到你面前，递来尖笔。你说不出这则故事的传话人怎么算出时刻，便把笔还给了他。回港的船还没露面，你已离开。
  socrates_athens:
    name: 散庭后还剩哪句话
    place: 雅典
    figure: 苏格拉底
    story: 柏拉图的《申辩篇》区分针对苏格拉底的旧传闻和庭上的正式控告，后者包括败坏青年。
    relic: 听众的陶杯
    relic_desc: 卖陶器人的摊上留下的一只杯子。
    points:
      p1: 请传话人说出他确实听到有人宣读的话
      p2: 帮听众捋清没听全的说法
      p3: 再听一段，等他解释两类指责的区别
    vignettes:
      handoff: 克莱奥急着回陶器摊，听不到辩词结束。你在门边找到她，请她照自己的次序说开头。她把没听见的那一段空了下来，弟弟听她复述时，会知道她听到哪儿就走了。
      charges: 费冬把集市听来的闲话写在最上方，仿佛有人在庭上宣读过。你请他认一认证人。他指得出集市上的一个人，也说得出庭里听到的一把嗓音。两人的话分成两行才带走。
      verdict: 你知道这场审判怎么收场。费冬急着把消息送给来不了的人。现在告诉他结局，他就会当成已经宣判去传。你只说到眼前听过的那一段，之后他怎样转述，你已赶不上了。
  hippocrates_kos:
    name: 无人看守的那一夜
    place: 科斯岛
    figure: 希波克拉底
    story: 传于希波克拉底名下的《流行病》逐日记录病程，其中有塔索斯岛的病例。
    relic: 一页练习值守记录
    relic_desc: 逐日记录，留着两个起算点。
    points:
      p1: 找出两份记录各从哪天开始数
      p2: 替另一名记录人值守一段，让对方休息
      p3: 问问没留下笔记的那一夜谁在场
    vignettes:
      days: 米里涅把自己第一次来看记作第一天，莱昂从前一夜就开始数。你把两张纸放到同一盏灯下，让两人指给你看同一个早晨。纸上保留两个数字，旁边注明各从哪里数起。
      watch: 莱昂要走了，米里涅从天没亮就醒着。你在外面守灯，让她先歇一会儿。下一轮换班，她把纸拿回来。夜里这一段有人接着看了。
      blank: 你知道后来的人会看重逐日记录。米里涅初次到访之前那一格，眼下找不到观察人来填。你只在空处旁添个记号。前一轮值守的人，你走之前还不会回来。
  plato_academy:
    name: 没有抹平的方格
    place: 雅典
    figure: 柏拉图
    story: 后世传记把柏拉图与雅典城外的学园联系起来。《美诺篇》中，原方形的对角线成了面积加倍的新方形的边。
    relic: 一块借来的蜡板
    relic_desc: 习作蜡板的另一面留着修改过的图。
    points:
      p1: 先数出四倍的面积，再回答学生
      p2: 把第一笔错图和改过的图画在一起
      p3: 请围观的人用半个方格拼出新图形
    vignettes:
      diagonal: 米孔把边画长了一倍，请你看面积。你用笔尖沿他画出来的四个小方格走了一圈。他从前一错就抹平蜡面，这回留下了四格，在另一面另起一图。
      squares: 灯油快尽了，多萝得把蜡板带回家。你扶稳板，她从一角划到对角。四块半格刚好拼成新图。明天来学的人，就是你不在，也能亲手数一遍。
      reveal: 米孔还没试过加长的边，你就抢先说了对角线。他能复述答案，却画不出新方形。你抹掉自己的答案，只给他留下起笔的两个角。再试一遍，要等下一盏灯。
  aristotle_lyceum:
    name: 落错栏的螃蟹
    place: 雅典
    figure: 亚里士多德
    story: 亚里士多德在《动物志》第一卷中区分动物住在哪里和怎样运动，以会走路的螃蟹为例之一。
    relic: 一枚留着地名的贝壳
    relic_desc: 标本习作里的贝壳，旧签写着拾到它的地方。
    points:
      p1: 拿螃蟹的图去核对运动一栏
      p2: 扶住贝壳盘，等人换过标签
      p3: 请亲眼看见的人说说那动作
    vignettes:
      two_columns: 提玛瑞忒拿来一张单列表，把螃蟹归在游泳的动物里。你划出第二栏，请她拿这张图填两遍。再念一遍时，她说海是发现它的地方，走才是亲眼看见的动作。
      shell: 达蒙为了配合新表，正打算刮掉贝壳上旧标签的字。你请他把壳搁在桌上，说说是在哪儿拾的。他把旧签留在新签旁。一张记地点，一张记观察。
      names: 你忍不住说起后世的书会怎么给这些动物起名。提玛瑞忒问，新名字能帮她明天认出哪一只？你趁还有光，把小蟹的足都画清楚。她关窗时，墨还没干。
  euclid_alexandria:
    name: 从几条公理推出几何
    place: 亚历山大
    figure: 欧几里得
    story: 欧几里得《几何原本》第一卷第一命题在一条给定线段上作等边三角形。
    relic: 一把青铜圆规
    relic_desc: 两条臂和一个轴，足够画出书里的每一个图形。
    points:
      p1: 从给定线段跟着作图
      p2: 誊图时分清两个圆心
      p3: 说清作出的三角形为什么三边相等
    vignettes:
      intersection: 学生凭眼力点出第三点。你添画第二道弧，两弧一交，他就看得出那个点该落在哪儿。
      reason: 学生伸手摸尺以前，你先问三边为何相等。他回头看两个圆心，沿着每一边找回一段半径。
      clean: 你帮忙清抄图，把试画的痕迹去掉。学生补回你差点擦掉的圆弧，下一个人得看见那个点怎么来的。
  archimedes_syracuse:
    name: 两只小舟，一盆水
    place: 西西里锡拉库扎
    figure: 阿基米德
    story: 阿基米德在《论浮体》中讨论浮体和它排开的液体之间的重量关系。浴池与王冠的故事见于晚得多的维特鲁威。
    relic: 留着吃水线的小舟
    relic_desc: 工坊里拿来练习的小舟。
    points:
      p1: 比较载重相同的两只小舟
      p2: 说服做船的人，等水静下来再试一次
      p3: 扶平接水碗，等小舟浮稳
    vignettes:
      load: 堤刻以为宽舟会挤出更多水。你把两只舟配到同样重。宽舟吃水浅一些，接到的两份水却一样重。她把两只舟都留下了，原本还想把大的削成小的那样。
      settle: 尼孔关坊前得还水盆，头一回接的水还在晃，就要做第二回。你请堤刻先去还砝码，趁空等水静下来。尼孔又称了一次，走时多带走一次读数，水盆也赶得及还。
      crown: 你问尼孔，阿基米德是不是在浴池里验过国王的冠。他低头看看两只小舟，问你有哪一顶冠可以拿来上秤。你知道的是很久以后罗马人会讲的故事。带走的，是这盆水还能重做一遍的刻痕。
  eratosthenes_alexandria:
    name: 地球的一整圈要摆几段
    place: 亚历山大与赛伊尼
    figure: 埃拉托色尼
    story: 克莱奥梅德斯后来记述，埃拉托色尼比较塞伊尼与亚历山大城的正午日照。按这份记述，两处差角取全圆的五十分之一，城间距离取 5000 斯塔迪亚，推得全周 250000 斯塔迪亚。
    relic: 一根日晷针
    relic_desc: 一根朴素的立杆，影子告诉他太阳的角度。
    points:
      p1: 在同一个圆上找出小弧所占的位置
      p2: 做比例之前，把两城距离的纸条送到影图旁
      p3: 抄完结果前，让角度比例和路程留在同一处
    vignettes:
      scale: 帮工在路程旁写了五十，准备拿去除。你先画出小弧，问这样的弧要摆几段才围一圈。他把算式倒过来，这回得了 250000。你带走乘法和取用的路程，单个斯塔迪亚究竟多长，图上却看不出来。
      noon: 你见过后世把两城放在一张地图上。帮工正要用正午那笔去对照日影已经移开后才取的一笔。你把后来这笔移出对照，纸上留一格等合适的时刻。那个时刻要在你收队以后才到。
      arc: 你把小弧所占的比例抄好，另起一行记距离。帮工能分清哪个数是份额，哪个数是长度。两项你都带回来了，两城之间的路却没有走过。
  hypatia_alexandria:
    name: 水面在哪一格
    place: 亚历山大
    figure: 希帕提娅
    story: 昔涅修斯在第15封信里请希帕提娅找人制作黄铜仪器，并描述能直立漂浮、读刻线比较液体的器具。书信留下的是请求，试读刻线的两人和他们测试的实物属于故事。
    relic: 一张浮标刻线图
    relic_desc: 试验台的刻线图，画出了从哪里读数。
    points:
      p1: 请学生与工匠对一对各自从哪里读数
      p2: 核查两个人读的是不是同一道刻线
      p3: 用带来的装备遮住试验台，给门边留出路
    vignettes:
      scale: 提蒙用拇指按住一道刻线，说这就是结果。妮萨照浮标接触液面的位置读。你请他们松开手，等浮标自己立稳再看一遍。这次两人报的是同一格。妮萨把读数时站的位置也写了进去。
      copy: 妮萨只剩一面蜡板，原想用大字把结果一抄。你把观察写在上半边，留给她在下面画仪器。下一个读到的人，既有读数，也有图可循，知道刻线该从哪里看。
      name: 你原可以讲讲后世怎么称呼这件器具。提蒙已一手拿布，要把浮标从杯里提出去。你趁最后这点安静，请妮萨自己再读一次。收信人拿到成品后会怎样用，你已看不到了。
  fibonacci_pisa:
    name: 印度阿拉伯数字传入欧洲
    place: 比萨
    figure: 斐波那契
    story: 比萨的莱昂纳多于 1202 年写《计算之书》。现传的 1228 年修订本开篇说明九个印度数字和零。
    relic: 一块写着数字的蜡板
    relic_desc: 板上把十个新数字和旧的罗马数字并排写在一起。
    points:
      p1: 读合计时把零所在的位也算进去
      p2: 说明数字移一位后为何变值
      p3: 两份抄件送出市集前核对一次
    vignettes:
      gap: 账房照抄合计时跳过空栏。你把零填回空处，请他再读一遍，这才和原先算出的数一致。
      tokens: 你把几枚算子分列摆在柜台上。账房把一枚挪到下一列，接着讲给你听，怎么同一个记号这时就表示了另一个数。
      copy: 两份合计马上要带出市集。两位送单人分头走之前，你请账房把两份都念一遍。
  giotto_padua:
    name: 有分量、有感情的人物
    place: 帕多瓦
    figure: 乔托
    story: 斯克罗威尼礼拜堂将帕多瓦现存的乔托壁画定年为 1303 至 1305 年。画面沿墙分层展开。
    relic: 一罐蓝颜料
    relic_desc: 磨好的蓝色，是礼拜堂穹顶的颜色。
    points:
      p1: 沿墙找出这一层的下一幕
      p2: 顺着画中人的手势往下看
      p3: 找一个能同时看见两幕的位置
    vignettes:
      eye: 访客总从面孔最清楚的地方看。你请他把视线拉回画角，看看接下来会往哪儿去。他顺着画中人的手势，看到了下一部分。
      register: 访客要直接往正下方一层接着看。你在空中沿墙比出看画的顺序。他往前走几步，找到了刚才在找的那一幕。
      step: 你陪访客往后退，直到两幕能一起看见。他指出一处刚才站在画底下看不见的细节。
  dante_ravenna:
    name: 用街头的语言写一部长诗
    place: 拉文纳
    figure: 但丁
    story: 但丁《天堂篇》末尾写到太阳和其他星辰。薄伽丘后来讲过梦中得知遗稿下落的故事，属于流传下来的文学轶闻。
    relic: 一片月桂叶
    relic_desc: 诗人桂冠上的一片干叶。
    points:
      p1: 翻页时跟住上一行诗
      p2: 听出接到下几行的韵
      p3: 帮读诗的人找到这篇的结尾
    vignettes:
      dream: 你问誊写员，做个梦能不能知道丢了的诗章在哪儿。他放下灯：「梦兴许能叫你去找。到了地方，你打算读什么？」你在报告里注明，托梦是后来流传的故事。
      ear: 一行诗念完，誊写员正要停。你请他再念几行，听见下一个韵落下再说。翻页以后，这回听着像刚才的话还在往下走。
      stars: 熄灯前，你帮誊写员找到最后一行。走到街上时，他还记得诗里的星辰。
  gutenberg_mainz:
    name: 用活动金属字模印书
    place: 美因茨
    figure: 古腾堡
    story: 现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。
    relic: 一粒铅字
    relic_desc: 铅锡合金的一个小字，是反着的。
    points:
      p1: 帮学徒把拆下的活字分好
      p2: 把试印的纸送到读样的桌上
      p3: 找出校样里漏掉的字
    vignettes:
      wrong_sort: 学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。
      reader: 你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。
      proof: 你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。
  leonardo_florence:
    name: 画画的人，也画机器
    place: 佛罗伦萨
    figure: 列奥纳多·达·芬奇
    story: 卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。
    relic: 一页镜像书写的笔记
    relic_desc: 一页反着写的字，要对着镜子才读得出。
    points:
      p1: 说清一处明暗过渡在哪里
      p2: 帮学徒核对双手的位置
      p3: 给下次坐像留好原来的位置
    vignettes:
      shadow: 你请学徒指一指，脸从哪儿结束，背景从哪儿开始。他伸手又犹豫了，没有加重那道线，先把交界处留着再看。
      hands: 访客记得脸，却把手的位置画变了。你把习作和他凭记忆画的图并排，让他自己找出线条挪到了哪里。
      seat: 学徒收拾东西时，你在地上替模特的椅子做了个记号。他把画留在半成处，下次来仍知道椅子该放哪儿。
  copernicus_frombork:
    name: 太阳在中心
    place: 波兰弗龙堡
    figure: 哥白尼
    story: 《天体运行论》于 1543 年在纽伦堡印行，书中论述地球自转并绕太阳运行。
    relic: 一个黄铜象限仪
    relic_desc: 四分之一圆，用来量星星的高度。
    points:
      p1: 找出观察者站在哪里
      p2: 把两张不同的图分开放
      p3: 顺着转动走完一圈，看视线怎样变
    vignettes:
      walk: 你请读者绕着凳子走，眼睛一直看着对面墙上的一点。他走到一半停住了，没想到凳子对着墙看起来挪了那么远。
      frame: 你把「观察者」和「被观察者」写在两张纸上。读者一张一张翻过去，比较同一个视运动的两种解释。
      diagram: 你把书页转过去，让读者看见整个轨道。他按住地球的位置，你沿着图找一年中视线方向怎样变化。
  vesalius_padua:
    name: 图下那个字母
    place: 帕多瓦
    figure: 维萨里
    story: 维萨里在帕多瓦任教时筹备《人体构造》，木刻版从威尼斯送交约翰内斯·奥波里努斯，1543年在巴塞尔刊印。
    relic: 一页校过的习作图
    relic_desc: 读者拿来习作的一页，图文对应的记号已经订正。
    points:
      p1: 核对图上字母与正文说的是否同一处
      p2: 两份图放在一处，等人标出对不上的字母
      p3: 帮接手的读者看清改动是从哪里来的
    vignettes:
      letter: 露琪亚用手指点住页边一个字母，马可却指到图上另一处。你把练习纸移到打开的书旁，让两人看清符号从哪儿抄偏了。露琪亚改好索引，页边还认得出原来那个错位的标记。
      hold: 借来的印本得还，马可还要看图。你帮他撑开书，等他在自己的纸上记下图的位置和字母。书主取走之后，他回到桌前还能查到一份。
      credit: 你知道后人会试图认出制图者。露琪亚问练习页上要不要署画工名字。你找得到印本里的图，却定不了谁画的。她留一行待写来处，合上了书。
  shakespeare_globe:
    name: 人人都能进的剧场
    place: 伦敦
    figure: 威廉·莎士比亚
    story: 《亨利五世》的开场合唱请观众想象舞台呈现不了的地点和事件。
    relic: 一支鹅毛笔
    relic_desc: 削好的羽毛笔，笔尖上还有墨。
    points:
      p1: 找一个能听清接词的位置
      p2: 帮演员在没有布景时交代身在何处
      p3: 留下来再核对一遍上场信号
    vignettes:
      back_row: 你站到院场边缘，听不见尾字时就举手。演员再试一遍，这一次转过身朝向观众。
      space: 你问演员怎么把整片乡野塞上几块台板。他指着一道门，请你穿过去，走得像刚赶了一整天路。
      cue: 你听清了哪一个字是下一人上场的信号。他们再试一次，这回字音一落，门便开了。
  galileo_padua:
    name: 木星身边的卫星
    place: 帕多瓦
    figure: 伽利略
    story: 伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。
    relic: 一片磨制的透镜
    relic_desc: 一片小小的玻璃透镜，是手工磨出来的。
    points:
      p1: 比较两个夜晚的观测图
      p2: 把散页按观测日期排好
      p3: 标出还需复核的光点位置
    vignettes:
      alignment: 你拦住正要把两页按纸边对齐的誊写员。先对齐木星吧。纸一挪，几个光点就错开了。
      telescope: 你追问第四个光点是哪一个。誊写员摊开几晚的图，反问你：有两个点挨得看不清时，该相信哪一夜？
      dates: 誊写员叠起散页之前，你替每张补上日期。下一个人就能按夜看出光点怎样换了位置。
  descartes_leiden:
    name: 把怀疑当作方法
    place: 莱顿
    figure: 笛卡尔
    story: 笛卡尔的《谈谈方法》1637 年在莱顿刊行，随附光学、气象和几何三篇论文。
    relic: 一张折起来的小纸条
    relic_desc: 纸条上只有一句话，讲思考与存在。
    points:
      p1: 把例题分成几个小问题
      p2: 请读者指出支撑结论的一步
      p3: 找一道例子，同方法放在一起读
    vignettes:
      parts: 读者卡在整道题里。你标出能先解决的一小问。他先做完这一部分，才翻到写答案的那页。
      claim: 另一位读者说结果显而易见。你请他指出究竟是哪一步让结果这样明白。他们重读例子中段，两人之前都没在这里停过。
      contents: 你把讲方法的一页同例题一起翻开。读者把纸签从自己喜欢的那条规则，移到了能看见它如何使用的一页。
  leeuwenhoek_delft:
    name: 一滴水里的世界
    place: 代尔夫特
    figure: 列文虎克
    story: 列文虎克 1676 年 4 月从代尔夫特寄出的信记录了他的观察，并附白蜡木切面和酒中鳗状小动物的图。
    relic: 一块小黄铜透镜板
    relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
    points:
      p1: 把图对到信里的那段说明
      p2: 让图和样品标签放在一起
      p3: 给没看过透镜的人读一遍观察
    vignettes:
      motion: 通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。
      label: 桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。
      read: 你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。
  newton_cambridge:
    name: 苹果与月亮服从同一条定律
    place: 剑桥
    figure: 艾萨克·牛顿
    story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。送去付印的誊清稿不是他的笔迹，抄写的人是汉弗莱·牛顿，这几年做他的抄写助手，与他不是亲戚。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
    relic: 一块玻璃三棱镜
    relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
    points:
      p1: 读懂第三卷里把月亮和落体放在同一条定律下的那一页
      p2: 靠翻译芯片读拉丁文，向学院的杂役问清誊好的稿子要送到哪里去
      p3: 等到誊清的稿子装箱，送去付印
    vignettes:
      apple: 你问学院的一位杂役：「听说苹果砸了他的头？」这位杂役是游戏里编出来的。他接着扫地：「砸没砸我不知道。你倒说说，月亮怎么不掉下来？」你一时答不上，回头去看那一页。苹果这件事，要再过六十五年才有人写下来。
      hand: 誊清的稿子不是书上署名那个人的笔迹。杂役说，抄写的是汉弗莱先生，也姓牛顿，不是亲戚。你把这一条记在本子上，没有去打扰他。
      diagram: 你在一张废纸上画出月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。杂役不认得拉丁文，盯着那支箭头看了好一阵。
  bach_leipzig:
    name: 一位乐长为每个礼拜日写曲
    place: 莱比锡
    figure: 约翰·塞巴斯蒂安·巴赫
    story: 1723 年 5 月 30 日，巴赫在莱比锡以康塔塔《困苦人必得吃饱》BWV 75 开启任职后的演出。
    relic: 一根小风琴管
    relic_desc: 一根调好音、试过音的小管子，没有卖掉。
    points:
      p1: 听出另一个声部给的提示
      p2: 帮歌者过了休止还跟得上
      p3: 让两人在同一页谱上都看得清
    vignettes:
      entry: 你听出低声部比歌者预想的早到一口气。你请他换到屋子另一边听。这次，提示还没来，他就抬起了头。
      rest: 歌者一唱到休止就数乱。你抄下等待时能听到的另一行，他在自己开口前的那个字上做了记号。
      light: 两人合看一页谱。你把纸转向有光的地方，扶住不动，直到两人都看见自己的声部从哪儿分开。
  smith_kirkcaldy:
    name: 一个国家怎样变富
    place: 苏格兰柯卡尔迪
    figure: 亚当·斯密
    story: 亚当·斯密 1776 年出版的《国富论》开篇用制针来说明分工。
    relic: 一枚别针
    relic_desc: 他用来说明分工威力的那种别针。
    points:
      p1: 说清桌边演示里的一道工序
      p2: 看一件东西怎样交到下一手
      p3: 从各人的小事讲清整张桌子如何配合
    vignettes:
      queue: 工人给最快的那道工序多放了几枚算子。你请他数一数慢的那道前还积了多少，第二遍他就换了排法。
      handoff: 两个人同时去够同一只盘，后头那只却没人拿。你把做完的件移到下一人随手能取的地方，碰撞声这才停下。
      walk: 你听每个人讲自己负责的一小段。要弄清一根针经过哪些手，你得从桌子一头走到另一头。
  kant_konigsberg:
    name: 留在页边的问题
    place: 柯尼斯堡
    figure: 伊曼努尔·康德
    story: 康德的《纯粹理性批判》初版在1781年问世。序言从这样的问题说起：理性无法回避它们，也无法回答它们。1787年新版另有修改过的序言。
    relic: 一张书架题签
    relic_desc: 书签，页边写着初版年份。
    points:
      p1: 请读者说说序言里什么地方引她往下读
      p2: 入架前拿摘要去对照序言第一页
      p3: 劝书商把难回答的问题留在签上
    vignettes:
      margin: 洛特只想抄读者绕不开问题的那一节。你请她给同一句后面的限制也留地方。她把字写小些，两部分都抄进纸条。这行字让她还想把书再翻开。
      label: 奥托在签上写，这本书答透了最难的问题。你把签翻过来，请他从序言开头再读一遍。他用一个问题换掉夸口。客人从架上抽书，就知道从哪儿读起。
      editions: 你记得六年后还会有另一篇序言。洛特眼前只有这册书，问该在哪页夹签。你在纸条上写下本版年份。店要关了，她刚翻过第一页。
  mozart_prague:
    name: 开幕前的接句
    place: 布拉格
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特从布拉格写信说，《唐璜》于1787年10月29日登台。更早的一封信提到筹备中的困难。
    relic: 一页改过的排练分谱
    relic_desc: 排练用谱，划掉了一个休止。
    points:
      p1: 拿另一份分谱核对歌手的接句
      p2: 请抄谱员说清开幕前哪一页还能换
      p3: 请两个人从那句接头的地方合一遍
    vignettes:
      cue: 安娜的分谱多抄了一个休止。你敲出另一声部进入的位置，让她标下该听哪个词。再合一遍时她进准了。划掉的休止还留在谱上，安娜请你别把它涂没。
      swap: 扬来得及重抄一页，或去找还没回来的歌手。你替他跑一趟楼梯，他留下抄。幕一动，改过的谱和歌手都到了谱架前。台下还有人在找那张旧谱。
      applause: 你知道莫扎特会在信里提到掌声。扬问，那一个多出来的休止会不会有人听出来。你交给他改好的谱，指给他在哪儿等安娜开口。离开时幕已经升起，那句还没到。
  lavoisier_paris:
    name: 化学有了新语言
    place: 巴黎
    figure: 拉瓦锡
    story: 拉瓦锡 1789 年出版的《化学基础论》用质量测量解释化学变化，把氧视为参与燃烧的物质。
    relic: 一台精密天平
    relic_desc: 一台精细的天平，给化学记账。
    points:
      p1: 把数字对回各自栏头
      p2: 核对相邻两栏的间距
      p3: 把更正的表格读回给排字工
    vignettes:
      units: 两个数字对得很齐，其中一行的单位却串了列。排字工固定版面之前，你把它指了出来。
      air: 你问表格为什么还要记下看不见的东西。排字工指了指「加入」和「剩余」两栏，把两个栏头都保留在校样上。
      proof: 排字工念表时，你拿纸条压住正在读的那一行。原本看起来属于下一例的数字，重新对回了自己的栏头。
  jenner_berkeley:
    name: 第一支疫苗
    place: 英国伯克利
    figure: 爱德华·詹纳
    story: 詹纳 1798 年出版的《探究》回顾了较早的牛痘与天花观察和病例。
    relic: 一把玻璃小刀
    relic_desc: 一片很薄的刀片，划下第一道小口。
    points:
      p1: 听挤奶女工说起牛痘
      p2: 照看接种后的孩子
      p3: 说服疑虑的母亲
    vignettes:
      firsthand: 虚构的誊写员把每则记载都誊成了同一种口气。你问哪一件是记述者亲眼见过的。他在其余条目旁补上说明，没把每一行都当成同一等证据。
      order: 抄件里两条观察换了位置。你核对日期，誊写员先把纸签调回来，才照先后讲述。
      blank: 誊写员有一条无法确定，你在下面留了地方。纸递出去以前，空白旁添上说明，免得后来人当成漏抄。
  beethoven_vienna:
    name: 第九交响曲
    place: 维也纳
    figure: 路德维希·凡·贝多芬
    story: 音乐会海报记录了贝多芬《第九交响曲》于 1824 年 5 月 7 日在维也纳克恩特纳门剧院首演。
    relic: 一只助听喇叭
    relic_desc: 世界静下来的时候，他举到耳边的号角。
    points:
      p1: 给迟到的客人找个地方等候
      p2: 顺着节目单认出演出进度
      p3: 不打断演出，把门口让出来
    vignettes:
      voice: 你指给引座员看台上的歌者。客人正要问交响曲里为什么有人唱，第一声响起，他便把话咽了回去。
      step: 迟到的客人一直没看清脚下那级台阶。你陪他在门边站了一会儿，等他看清，再把人领进去，一整排座位都不用起身。
      programme: 引座员把节目单借给你。你用手指按住眼下这一项，客人就知道哪首还在后头。
  faraday_london:
    name: 从磁里得到电
    place: 伦敦
    figure: 迈克尔·法拉第
    story: 1831 年 8 月 29 日，法拉第记录了铁环上线圈实验中指针的短暂偏转。
    relic: 一个铁环和线圈
    relic_desc: 软铁环上绕着两组线圈。
    points:
      p1: 记下指针何时偏转
      p2: 在图上分清两组绕线
      p3: 让下一位读者看得懂这条记录
    vignettes:
      instant: 助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。
      skeptic: 你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。
      sketch: 你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。
  darwin_galapagos:
    name: 岛屿与生命的多样
    place: 加拉帕戈斯群岛
    figure: 查尔斯·达尔文
    story: 达尔文 1835 年随小猎犬号到访加拉帕戈斯。他的鸟类笔记把嘲鸫标本和各自采集的岛对应起来。
    relic: 一根雀的羽毛
    relic_desc: 来自群岛的一根小小的褐色羽毛。
    points:
      p1: 注意到别人没注意到的
      p2: 熬过远航
      p3: 帮他整理标本（头脑好的人或管档案的人）
    vignettes:
      two_tags: 一张签只写了「岛上」。你把它搁到一边，等帮手找来另记的上岸记录。盘子即便收好，两件标本也还能分清。
      differences: 帮手指着两只相似的鸟，准备合写一条。你问它们各来自哪座岛。他把两个标签都留在册上，下次好重新比较。
      drawer: 帮手能把地名念回给你以前，你一直把签放在盘旁。抽屉关上时，纸签仍在对应的标本旁。
  lovelace_london:
    name: 第一段程序
    place: 伦敦
    figure: 阿达·洛芙莱斯
    story: 洛芙莱斯 1843 年发表的译注中，注 G 用表格列出了拟议中的分析机计算伯努利数的操作。
    relic: 一张穿孔卡
    relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
    points:
      p1: 找出一个稍后还会用到的值
      p2: 向校对员讲清一项操作
      p3: 在校样旁留下阅读提示
    vignettes:
      repeat: 你标出一组操作从哪里重复。校对员刚才只数了一遍，便顺着你的记号重走后面的几行。
      music: 你问这几列能不能代表乐音。校对员反问，机器怎么知道乐音该遵循什么规则？你把这个问题记在图旁，准备带回去。
      row: 你拿纸挡住下一行，先把眼前这行讲明白。校对员这才看清，刚写出的值在哪儿还会再用。
  nightingale_scutari:
    name: 把护理做成用数据和关怀的学科
    place: 奥斯曼斯库塔里
    figure: 弗洛伦斯·南丁格尔
    story: 弗洛伦斯·南丁格尔 1858 年的军队卫生报告依据战时经验，收入医院统计。
    relic: 一盏小油灯
    relic_desc: 她夜里查房时用的那盏灯。
    points:
      p1: 懂病房的活儿（医护人员）
      p2: 安抚伤员
      p3: 撑过漫长的夜班
    vignettes:
      totals: 虚构书记员把转房名单也算进新收治人数。你问哪些名字是刚入院的。他另留一栏记转房，再把报表送出去。
      name: 书记员隔着嘈杂声没听清名字。你在报名字的人身旁等他再说一遍，下一份抄件就照他给的拼法写。
      fold: 书记员念哪一处，你就按顺序放哪一页。原来夹在合计后面那张，这次先送到了他手里。
  mendel_brno:
    name: 豌豆与遗传的规律
    place: 布尔诺
    figure: 格雷戈尔·孟德尔
    story: 孟德尔在 1865 年报告豌豆杂交结果，1866 年刊出的论文列了计数并比较所得比例。
    relic: 一只豌豆荚
    relic_desc: 修道院花园里的一只干豆荚。
    points:
      p1: 计数时分清两种形状
      p2: 完成计数并保留原数
      p3: 给下一个读者留下可复核的记录
    vignettes:
      ratio: 听讲人把数约成了一个整齐的比例。你把原始计数留在页边，请他从这些数重新算一遍。
      label: 两张纸签看着很像。你翻过来才发现，其中一张写的是亲代。听讲人把它从后代的计数旁移开。
      tally: 听讲人画正字时，你逐粒念出两种形状。数完，你把正字留在合计旁，让别人也能复核。
  mendeleev_petersburg:
    name: 元素周期表
    place: 圣彼得堡
    figure: 门捷列夫
    story: 门捷列夫在 1869 年发表早期元素周期系统，把原子量和化学性质的相似性用来排列元素。现存的 1871 年版记录了随后调整的排法。
    relic: 一副元素卡片
    relic_desc: 手写的卡片，可以像摆纸牌一样摆。
    points:
      p1: 沿着表格找出同一组元素
      p2: 把空格保留在原位
      p3: 向读者说明一项反复出现的性质
    vignettes:
      blank: 你趁读者还没开抄，先用铅笔轻轻划出栏线。遇到空格，他想把下一项挪回来，你顺着栏线指给他看，那项该和谁排在一起。
      similarity: 你问为什么原子量相近的两项分开排。读者翻找各自的性质，在两个数旁各补记一项化学性质。
      heading: 读者要裁纸贴进笔记，你帮他先把抄来的那行加上行名。折页再次展开时，他仍看得懂那几个数。
  pasteur_paris:
    name: 他抵达巴黎的那一天
    place: 巴黎
    figure: 路易·巴斯德
    story: 1885年7月6日，约瑟夫·迈斯特被带到巴黎见路易·巴斯德，接受团队的狂犬病疫苗接种后存活。
    relic: 一张抵达登记副页
    relic_desc: 登记副页，分开记录抵达与后来的来信。
    points:
      p1: 找出哪一项是在抵达时写下的
      p2: 给家人的送信人留时间核对地址
      p3: 把抵达记录与后来的结果分开留好
    vignettes:
      date: 克莱尔把来信送到的日子抄进了抵达簿。你把信封摆到登记簿旁，她看出了两处不同。两天都留在桌上，各标它真正对应的事。
      address: 埃米尔愿意代送家人的回信，克莱尔留守登记簿。你递给他一张窄条，只写他要核对的地址。他出门前核过一遍，有旁人等候时，登记簿仍合着。
      future: 你知道男孩离开许久后，人们还会谈到这个病例。克莱尔要填的是今天确知的事。你记下抵达，将以后到的消息留给它自己的日期。你走时，最新一封信还没拆。
  curie_paris:
    name: 两种新元素
    place: 巴黎
    figure: 玛丽·居里
    story: 钋和镭的发现公布于 1898 年。玛丽·居里 1911 年的诺贝尔演讲回顾了这两项发现，以及随后为确定镭的性质所做的工作。
    relic: 一管沥青铀矿
    relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
    points:
      p1: 分清两次发现的报告
      p2: 把日期对回相应消息
      p3: 校样交出去前把所声称的结果写准确
    vignettes:
      two_notices: 排字工把两条消息排在同一天名下。固定版面之前，你把先后两张纸分开，各自标上月份。
      word: 你发现标题把话说成了工作已经全做完。排字工把报告念了一遍，最后在标题里只留报告能支持的话。
      heading: 你扶着第二张校样，等上面的元素名核过一遍。排字工让两条都能单独读清，没把谁移进另一栏。
  freud_vienna:
    name: 一本书的两个年份
    place: 维也纳
    figure: 西格蒙德·弗洛伊德
    story: 《梦的解析》在1899至1900年之交面世，初版扉页印1900年，弗洛伊德后来回忆自己1899年已经拿到书。
    relic: 一张注明日期的书店存根
    relic_desc: 书店存根，两处年份都保留。
    points:
      p1: 把扉页与有日期的送货单对照
      p2: 留点时间，让读者问清两个年份为何不同
      p3: 最后一册被带走之前，把订单副页收好
    vignettes:
      imprint: 格雷特看了扉页上的1900年，就想改掉到货簿。你从柜台拿来送货单。她把印在书上的年份写给题签，簿上仍记今天是哪一年。两张纸各回答一个问题。
      reader: 有客人以为埃米尔错拿了明年的书。你请他在柜台上把到货单和扉页对着看。客人带书走时，请埃米尔把单留下，好给再来的人看看。
      edition: 你知道后世书目常以扉页上的年份著录。格雷特眼下只需要找得到今天的订单。你把两个年份都留在她会查的地方。门关上时，最后一位读者还在街上。
  cajal_barcelona:
    name: 神经细胞是一个个独立的单位
    place: 巴塞罗那
    figure: 圣地亚哥·拉蒙-卡哈尔
    story: 卡哈尔于 1889 年刊行有插图的组织学手册。西班牙国家研究委员会藏有他后来绘制的视网膜结构及传导方向图。
    relic: 一支极细的绘图笔
    relic_desc: 细到能画出神经元每一条分支的笔。
    points:
      p1: 沿一根分支找到它的起点
      p2: 把标注与组织结构线分开
      p3: 留一个明确问题，方便下次复看
    vignettes:
      crossing: 学生把交叉的两笔连起来。你让他分别往回找起点。两条脉络对过一遍，有一处连线被他擦掉了。
      legend: 粗箭头盖住了一根细分支。你把箭头移到图外，请学生补图例，两种线就都看得见了。
      blank: 你在画不准的末端旁留了一块白。学生在那里写了个问题，准备下回再看，没凭记忆把线拖长。
  marconi_bologna:
    name: 一次发报，一次静默
    place: 博洛尼亚
    figure: 古列尔莫·马可尼
    story: 马可尼在1909年的诺贝尔演讲里回忆，自己于1895年初在博洛尼亚附近开始试验无线电报。
    relic: 两张试验记事纸
    relic_desc: 同一趟试验，在两端各留一张记录。
    points:
      p1: 比较听见的几声和发报端的记录
      p2: 替两端分开记两趟试验，留待对照
      p3: 劝接收端把静默的一段也记下来
    vignettes:
      blank: 罗莎等的是三声，下笔已经写了三划。下一趟你请她把纸扣在桌上。重新翻开时，她把实际听见的记下来，连静默时多听到的一声也写上。这下有理由再做一遍了。
      times: 卡洛想把两张纸一起带下坡。纸头都写着第一趟，其实有一边重新做过。你请他指出哪一段在等，哪一段重新开始。他走前给两趟各写了记号，发报和接收两边终于能对上同一趟。
      range: 你知道后世读者会在意距离。罗莎却只想知道最后一响是不是约好的记号。你把她的纸拿到发报端，把这个问题留给下一趟。此时两头的人都已经进屋。
  imhotep_saqqara:
    name: 试过的那条边
    place: 埃及萨卡拉
    figure: 伊姆霍特普
    story: 萨卡拉左塞尔建筑群出土的雕像底座刻有伊姆霍特普的姓名和头衔。博物馆将阶梯金字塔的设计归于他。
    relic: 一张接边记号拓片
    relic_desc: 工台上的接边记号拓片。
    points:
      p1: 石工试接边时扶稳练习石
      p2: 留在台边，等两面都查过再走
      p3: 搬石块前找出接缝卡在哪儿
    vignettes:
      rock: 穆特见石面平整，就要去拿下一块。你请她先在台面轻轻摇一下这块。一角敲着木面，另一角没沾上。她在高点做记号，换个人、换个光线也找得着。
      turn: 霍里可以现在搬走两块练习石，也可以留着沉的那块，等穆特来查。你扶住轻的那块，陪他等。穆特在两块石头相接的面上各做记号。石头搬走时，记号也跟着带走。
      name: 你知道后世看雕像底座时会找谁的名字。霍里只想知道哪块试石该跟手里这块配。你指给他看那个能对上的记号。造像和刻字的地方，还在你这趟能走到的工坊外。
  enheduanna_ur:
    name: 翻过圆盘再看
    place: 美索不达米亚乌尔
    figure: 恩赫杜安娜
    story: 乌尔出土的方解石圆盘一面刻着仪式浮雕，另一面刻有恩赫杜安娜的名字。现存年代更晚的《伊南娜颂》抄本里，诗中人也自称恩赫杜安娜。
    relic: 一块方解石圆盘
    relic_desc: 圆盘上刻着一位女祭司在献祭。
    points:
      p1: 把刻字面与浮雕面分开记录
      p2: 请石工指出哪一面刻着名字
      p3: 留一张让后来的抄写人认得正反两面的图
    vignettes:
      inscription: 你记得后世博物馆会登记正反两面。石工把刻字一面朝下搁在木台上。你趁他干活先画下浮雕，翻面后又补了一张。两幅图都能带回去，最先写那首诗的人是谁，图上答不出来。
      support: 石工请你扶稳圆盘旁的垫子。你腾不出手来，错过了刻字面刚翻起的时候。收工前，他留了点时间让你在草图上圈出漏看的那一面。上面的人名只能下趟再来核对。
      edge: 石工记了圆盘的正反面。你又在草图上添了边缘的厚薄，好认出哪两幅画的是同一件东西。收队时手里有一张图，那首诗的抄本却没带回来。
  hammurabi_babylon:
    name: 刻在石头上的法律
    place: 巴比伦
    figure: 汉谟拉比
    story: 卢浮宫藏古巴比伦石碑刻有财产、交易、劳作等方面的条文。
    relic: 一枚泥印滚筒
    relic_desc: 一个小石柱，在泥上一滚就留下签名。
    points:
      p1: 从条文开头的条件读起
      p2: 用虚构例子讲明一条规则
      p3: 找出两份抄本从哪里开始不同
    vignettes:
      condition: 学徒念条件时漏过一个字。你请他从条首重念，听的人这才弄清什么时候才有这项义务。
      case: 学徒两次答得一样。你换了假设例子里的一个细节再问，他只好回去看写明财物种类的那一行。
      edge: 你把练习泥板挪到斜光能照到楔痕的地方。学徒从第一个字起一路念了下来。
  lalibela_rock:
    name: 沿岩沟找出口
    place: 埃塞俄比亚拉利贝拉
    figure: 拉利贝拉与石匠们
    story: 扎格韦王朝的拉利贝拉国王在位于 1181 年至 1221 年，以他命名的城镇周围有十一座向下凿进岩石的教堂，连同沟渠、深槽和通道，都归在他名下，各座教堂的确切年代并不确定。1520 年代，葡萄牙神父弗朗西斯科·阿尔瓦雷斯随使团来到这里，写下欧洲人对这些教堂的第一份详细记述。1978 年，岩凿教堂列入世界遗产。
    relic: 石匠的凿子
    relic_desc: 一把铁凿子，刃口磨得很薄。
    points:
      p1: 先让石匠们认下，再替他们把凿下的碎石运出深槽
      p2: 雨季前，沿岩沟找到出口，指给他们看哪里会积水
      p3: 雨季里，帮着把一整条沟渠从头清到尾
    vignettes:
      outlet: '{staff}顺着一条凿在岩上的沟往下走，过了弯，找到它出岩壁的地方，用一块碎石做了记号。'
      rain: '{staff}站在没过脚踝的水里，把一筐筐淤泥递上槽沿，一筐接一筐，直到天黑。'
      bend: '{staff}在一片碎纸上画了个缺口，标出深槽的转弯处，帮工第二天早上照着就能找到同一个弯。'
  ife_bronzes:
    name: 铸好以后还能不能认出这道线
    place: 尼日利亚伊费
    figure: 伊费的铸造匠人
    story: 大英博物馆登记的伊费翁莫尼杰院落黄铜头像有铸造与刻划的特征，馆方记其采用失蜡法。
    relic: 一对线样小图
    relic_desc: 对照无像练习铸样上两次所见的线。
    points:
      p1: 抄线样时让带标签的样块一直在眼前
      p2: 把两份对照小图送到另一个工台
      p3: 辨认哪道线在表面收拾之前就有记录
    vignettes:
      line: 帮工正要把一道新划痕标成起初就有的。你留下他收面前画的小图，摆到今天的样块旁。他把后来多的一道另画一张。你把这一对记下来，下一次铸成什么面，仍没有见到。
      surface: 你知道后来的馆藏说明会分开记录铸造和刻划的痕迹。帮工眼下只想知道新线从哪儿开始。你把垫样块的板略一斜，帮他在纸上标出边。样块回工台时，你已在收队路上。
      edge: 你描了一回练习样块，又把只有今天才见到的那一划另记在旁。帮工下回能拿这两项对，不用全靠记忆。你带走对照，成品从没到过你手上。
  great_zimbabwe:
    name: 图上两墙之间的路
    place: 津巴布韦马斯温戈
    figure: 大津巴布韦的建造者
    story: 大津巴布韦由绍纳人的祖先建造，兴盛于十一世纪到十五世纪。大围场的弧形长墙用花岗岩逐层整齐垒起，两墙之间有一条狭道通向锥形塔。1871 年，德国人卡尔·毛赫来到这片遗址。1980 年，国家以这座城为名，定名津巴布韦；1986 年，遗址列入世界遗产。
    relic: 一张两墙间的草图
    relic_desc: 图上两段墙之间留白，标的是能走的狭道。
    points:
      p1: 先让砌墙的工匠认下，再替他们挑出大小合用的石块
      p2: 走一遍两墙之间的狭道，画成图，把路留成白
      p3: 旱季里，从河谷把水挑上山，给砌墙的人
    vignettes:
      lines: '{staff}把狭道画成两条线，中间留白，送信的人照着白处走，就不会去顺着墙走。'
      width: '{staff}沿内墙走到它停下的地方，铅笔也停在那里，没有把线顺手绕满一圈。'
      pace: '{staff}用步子量了一层石的长度，把数目刻在墙脚一块平石上。'
  timbuktu_sankore:
    name: 清真寺旁的一页纸
    place: 马里廷巴克图
    figure: 曼萨·穆萨与桑科雷的学者们
    story: 廷巴克图的建筑和藏书留下长期讲学与读书的痕迹，后世材料尤丰。出处中1733年的存世天文抄本远晚于这一场景。
    relic: 一张读书人留下的夹纸
    relic_desc: 夹纸，用来指出散页上的一行。
    points:
      p1: 看脱开的一页，题头还读不读得通
      p2: 收纸时帮站着读的人保住读到的位置
      p3: 再听她读一遍，记清那页应归哪个题头
    vignettes:
      title: 阿米娜塔在板下找到一张练习纸，第一行写了题目，却没写谁抄的。板凳收走前，你拿回读书的地方。她认出笔迹，借来的那页便回到原主手里。
      wind: 穆萨收拢散纸，准备关门。阿米娜塔还读到一行中间。搬纸前你照她指的地方夹一张废纸。她下回回来，要找的那一处还在。
      collection: 你看过一部远晚于此时的廷巴克图天文抄本的照片。穆萨指着邻居那页散纸，问该怎样记它。你照他手里这页写题名。后世那部书，还要过许多代人才会抄成。
  al_haytham_cairo:
    name: 窄缝里的一线光
    place: 开罗
    figure: 伊本·海赛姆
    story: 伊本·海赛姆在《光学书》中讨论移动物体时，观察者怎样透过小孔依次看到物体的各部分。
    relic: 一块练习用的小孔屏
    relic_desc: 工坊用来比较两个位置的小孔屏。
    points:
      p1: 把孔里看见的记号与移动板上的记号对上
      p2: 板在移动时，把小孔屏扶稳
      p3: 再等等，看遮住一处记号后怎样
    vignettes:
      slit: 玛丽亚姆看见暗边，就把整条画进了记录。你请优素福挪动练习板，让隔着小孔换见另一条。她在同一个孔边画下两个位置，分得清是板在动，还是孔在动。
      cover: 优素福想转动灯让人看得清些。你让灯留在原处，请他遮住板上一道记号。那道记号一消失，玛丽亚姆马上出声。等人开门时，她已经试过一次自己还能重做的变化。
      term: 你知道后世怎样称呼小孔实验。屋子马上要腾给别人，玛丽亚姆只来得及看一次。你请她说清自己到底看见了哪一道。屋里亮起来时，已经来不及再试。
  house_of_wisdom:
    name: 巴格达抄本上的缺行
    place: 巴格达
    figure: 花拉子米与智慧宫
    story: 侯奈因·伊本·伊斯哈格在约855至856年写成的书信里，谈到搜寻、比对盖伦手稿以供叙利亚语和阿拉伯语翻译。晚出的书信用来说明译者怎样工作，不能给这张桌子定址。
    relic: 一页标出缺行的练习抄本
    relic_desc: 来自巴格达抄写桌的一份练习抄页。
    points:
      p1: 找出两份抄本从哪儿开始不同
      p2: 交接文稿时保住缺行的位置和出处
      p3: 商定怎样标出暂时无法定下的译文
    vignettes:
      line: 萨尔玛顺着整齐的抄本读，滑过了原本两行挤成一行的位置。你照字迹较乱的纸朗读，她用整齐那份对着听。她听到自己这份少掉的内容，在脱漏处做了记号。
      versions: 门要关了，伊利亚斯得先送一份给译者。他可以只送整齐那份，也可以把难读的那份带上。你捆好两份，让人一翻就能看到分歧。译者拿到纸页，可以同时拿两份来判断。
      gloss: 你认得后世书里常用的术语。萨尔玛指给你看原文缺在哪儿，可手头没有字可补。你只给她一条页边备选说法。信包送走时，正文一字没补。
  ibn_sina_hamadan:
    name: 五卷之中该翻哪卷
    place: 波斯哈马丹
    figure: 伊本·西那
    story: 《医典》全书分为五卷。美国国家医学图书馆将这部多年写成的书的完稿地记为哈马丹，博德利图书馆将书定于约1025年。
    relic: 一张练习索引条
    relic_desc: 读书签，区分全书五卷中的两卷。
    points:
      p1: 照题头与索引帮读者找对卷
      p2: 书送走前，把容易弄混的两张签对一遍
      p3: 搬走读本时，把临时索引条的位置留好
    vignettes:
      section: 鲁卡娅见两张单都提到药物，便指向同个题头。你请她打开索引，指出哪条是单味，哪条是复方。她给两卷各夹一签。桌边的两个人现在可以各找各的条目了。
      sleeve: 叶海亚得带走一份抄本，板一斜，索引签就会滑掉。你帮他用空封纸把几个签护好，鲁卡娅则替还留在桌边的人另抄两个题头。书带走后，桌上还有一张小索引。
      afterlife: 你见过后世的装帧，同样五卷却分成不同的册子。叶海亚问，在手里这部抄本哪儿才是第一个题头。你找到开头那行，把后世版本的日子留在纸外。接手人第一次自己试索引，你已经看不到了。
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯内沙布尔
    figure: 欧玛尔·海亚姆
    story: 1070 年代，苏丹马立克沙在伊斯法罕建起天文台，欧玛尔·海亚姆是参与修订历法的天文学家之一。以苏丹命名的贾拉利历于 1079 年 3 月 15 日启用，以春分定太阳年的开端。苏丹 1092 年去世后天文台关闭，这部历法却用了约八个世纪，它的变体今天仍在伊朗和阿富汗使用。
    relic: 一张有两种题头的历表
    relic_desc: 一张对照表，新旧两种新年并排写着。
    points:
      p1: 先让城里抄历书的人认下，再替他们抄新历的月份表
      p2: 春分前后那些天，每天早上记下太阳从哪里升起
      p3: 新年过后，劝一位老农用新历记下播种的日子
    vignettes:
      spring: '{staff}把旧历表和新历表并排摆好，在每个日期旁写明属于哪种纪法，下一个读表的人不用再猜。'
      carry: 一张折起来的纸，两栏标题正好分在折痕两边。{staff}把两种题头抄到外面，带着它的人不用打开也知道该比哪两栏。
      future: '{staff}知道后人会怎样写这部历法，可落下的日子还是用抄历书的人用惯的纪法，不写他们从没见过的那一种。'
  al_jazari_diyarbakir:
    name: 一本奇巧机械之书
    place: 迪亚巴克尔
    figure: 加扎里
    story: 加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。
    relic: 一个黄铜凸轮
    relic_desc: 一个有形状的轮子，把转动变成往复。
    points:
      p1: 在图上找到能看见的人偶
      p2: 说清两个人偶出现的先后
      p3: 帮学徒把图留到来客也看得懂
    vignettes:
      sequence: 学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。
      viewer: 来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。
      paper: 学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。
  ibn_battuta_tangier:
    name: 长途还只有第一站
    place: 摩洛哥丹吉尔
    figure: 伊本·白图泰
    story: 伊本·白图泰在晚年编成的《游记》里回忆，1325 年他离开丹吉尔，原意是去朝圣。开篇所写的出发目的和后来走过的行程并非一回事。
    relic: 一只走旧的凉鞋
    relic_desc: 一只补过很多次底的皮凉鞋。
    points:
      p1: 把第一站的纸条与启程用的补给一起带好
      p2: 请搬运帮工把今夜落脚处与远方目的地分写
      p3: 保留出发前的纸条，日后可与回忆对读
    vignettes:
      distance: 你告诉帮工，后来的读者会在图上追着这趟路走好多年。他问这个消息能不能帮他找到今夜歇脚的地方。你把远方目的地留在一张，下一站另写一张。从丹吉尔能看见的，只是路的起头。
      departure: 帮工在装行李的单上写了目的地，就说那是走过的路。你留住题头，下面空一处给真正落脚的地方。你带回写有出发日期的副本，上头还填不了哪天回来。
      roll: 你把目的和第一段路各写一条，卷在一起。出城处你把帮工当天用得上的那张递过去，自己留另一张。带回事务所的是一个起头，后面的故事刚刚开始。
  ulugh_beg_samarkand:
    name: 星表边上的一栏来源
    place: 撒马尔罕
    figure: 兀鲁伯
    story: 兀鲁伯在撒马尔罕的天文台建于 1420 年代，台中有巨大的子午弧，一般认为 1428 年动工。那里编成的天文表收有 1018 颗星，多数位置重新测定，一部分取自前人的星表。兀鲁伯于 1449 年 10 月 27 日在撒马尔罕去世。天文台遗址在 1908 年被俄国考古学家重新发现。
    relic: 一张星表来源签
    relic_desc: 一行记旧表星位，一行留给新的观测。
    points:
      p1: 先让石匠们认下，再替他们搬砌大子午弧墙的砖
      p2: 把一颗星的旧位置和今夜测得的位置分两行记
      p3: 冬夜守在子午弧边，把读数一一记下
    vignettes:
      source: '{staff}在抄写人的纸上添了窄窄一栏“来历”，旧表取来的位置和今夜量到的位置就不会挤在同一行里。'
      arc: '{staff}顺着子午弧的沟槽拉了一根绳，和石匠们从这头走到那头，看弧线正不正。'
      hold: '{staff}守着一只火盆，坐在子午弧边，膝上搁一块木板，读数报一个记一个，直到那颗星沉到墙后。'
  laozi_hangu:
    name: 关前的旅人
    place: 中国函谷关
    figure: 老子
    story: 晚出数百年的《史记》说，关令尹喜请老子留下著作，书分上下篇、五千余言。同一篇传记还收了关于老子身份的不同说法。
    relic: 一支留有位置记号的练习简
    relic_desc: 出关传说场景中的道具。
    points:
      p1: 请关吏先把两束简分开摆
      p2: 捆简前认清位置记号
      p3: 等人叫来车时，守好松散竹简的次序
    vignettes:
      two: 顺只在架上腾出一束简的地方，桌上却又来一束，绳子还没捆牢。你把两束一前一后摆开，问他哪束刚才先读。他给两束都腾了地，绳子仍然各系各的。
      tie: 关门前，习得把架子挪开。她重新穿绳时，你按住松开的简。她另留一支练习简，记了原来夹在哪儿。下一班守关人知道该把它搁回哪里。
      ox: 你记得后人画过旅人骑牛。顺在关门外只听到车声，问登记该写什么。你让他先写自己听到的那一点。等你回头想看，声音已经去了墙外。
  confucius_qufu:
    name: 先从一个角开始
    place: 中国曲阜
    figure: 孔子
    story: 《论语·述而》用举一隅、反三隅来说明学习者如何接下老师的提示。文本保存的是一则教学言论。
    relic: 一块只标了一角的练习板
    relic_desc: 练习用的道具。
    points:
      p1: 给卡住的学生一点提示，让她自己往下试
      p2: 摆出只标了一角的练习板
      p3: 等学生做过第一遍，再决定要不要说答案
    vignettes:
      corner: 季把笔悬在第一个记号上，等你再指一处。你请她先把板转过来。她自己慢慢找到了下一角。把板交给同学时，她也只指了最初那个记号。
      explain: 秋已经会指齐四个角，也替季全画好了。你请他先把自己的板扣下，听季怎样说下一处该怎么转。他听到一个自己刚才跳过的理由。板再摆下来，他给她留了地方补上。
      answer: 你知道后世用别的语言怎样叫这道练习。季正要说她以为下一步是什么。你让她先说完，那个名字可以迟一点再给。你听得到她想的下一步，却看不到她以后怎么教别人。
  buddha_sarnath:
    name: 听众带走的话
    place: 印度鹿野苑
    figure: 悉达多·乔达摩
    story: 《相应部》56.11把这次说法置于波罗奈附近的仙人住处鹿野苑，传统上认作今鹿野苑。经中讲中道和四圣谛。
    relic: 一段听众留下的素绳
    relic_desc: 路上纪念物。
    points:
      p1: 听另一人怎样回想开头
      p2: 分清一人亲耳所听与另一人转述
      p3: 再留一会儿，听完先走的人漏掉的那一段
    vignettes:
      middle: 难陀只记住两端都不可取，以为说法就停在这儿。你等索那慢慢想起，后头其实还说了一条路。难陀练着照次序讲给晚点才会来的人听。这回她讲到了那条路。
      pause: 索那一口气重述了三部分，到第四部分卡住了。你问她从哪儿开始是靠难陀转述，而非在场听见。两人轮流试着讲一遍，讲完都知道哪一段还要问对方。
      retell: 你知道这段说法的传本会传得很远。难陀得去见个人，想要一段走在路上也记得住的讲法。你听她试了一遍。后来那个人怎么听，你离开鹿野苑时还不知道。
  cai_lun_luoyang:
    name: 廉价造纸
    place: 中国洛阳
    figure: 蔡伦
    story: 《后汉书》记蔡伦于元兴元年（105）奏上造纸法，列出树肤、麻头、敝布和鱼网。
    relic: 一张粗纸
    relic_desc: 纸里还看得见纤维的碎屑。
    points:
      p1: 帮纸坊帮工接住一张试纸
      p2: 晾之前找出一处厚薄不匀
      p3: 等到样纸能完整揭下来
    vignettes:
      light: 你把两张试纸举到窗前。搁在板上看着平整的一块，透光却多得多。帮工在旁边别了个记号。
      ink: 帮工递来摸着更滑的那张。你请他先用同一支笔在两张上都试一下。后来认得更清的，倒是墨痕更小的那张。
      tag: 你还没来得及问哪张是哪张，帮工已经端起晾纸板。你把写好字的两块纸签摆在旁边，好让他回头还能比较。
  zhang_heng_luoyang:
    name: 一记方向，一封后到的驿报
    place: 中国洛阳
    figure: 张衡
    story: 《后汉书》将张衡制候风地动仪记在 132 年。书中载有八龙，还叙述过一回铜丸落下、京师未觉地动，数日后才有陇西地震的驿报。
    relic: 一张报动记事
    relic_desc: 记下一处方向，另有一格留待驿报。
    points:
      p1: 标出信号对应的方向
      p2: 把报动与证实的两张纸留开，好回头核对
      p3: 说清为什么有方向还不能填一个确切地点
    vignettes:
      register: 记事人在练习中听到报动，伸手就要填地名。你划出一处记信号所指方向，另留一处记京外来的消息。这时只够填方向。你带回分成两栏的记法，证实的消息收队前还没到。
      later: 你知道后世传记会写到陇西来报。帮工问现在是不是就能写上去。你另留一张记着「候报」的纸条。有人到了，他还能添写。你走时，驿路上仍然无声。
      direction: 你在纸上写一行仪器边所见，余处留给来报的人。帮工折纸时，空格依然露在外头。你带回的只有方向，地名还在路上。
  zu_chongzhi_jiankang:
    name: 两个界限，一条密率
    place: 中国建康
    figure: 祖冲之
    story: 《隋书·律历志》记载祖冲之的圆周率下界和上界，换算成现代小数为 3.1415926 与 3.1415927，还另列密率 355/113。现有记载没有给出求得上下界的完整算法。
    relic: 一束算筹
    relic_desc: 一捆细细的小棍，摆开就是数字。
    points:
      p1: 在抄表上认出上界与下界
      p2: 守着核对两个界限，别抄漏末位
      p3: 给学算的人讲清界限与近似分数的区别
    vignettes:
      compare: 抄写人把密率填进了上界那一格。你把 355 和 113 乘 3.1415927 的积相比，发现乘积比 355 略小，便给密率另列一行。你带走这道验算，求出上下界的过程却没赶上。
      digit: 你知道后人会记得小数点后七位，可抄写人快把下界末位抄丢。你标出两个界限在哪一位不同，请他把两行重读一遍。你来得及抄下结果，来不及重做背后的计算。
      ratio: 你把纸条空出三处，分别给下界、上界和便于用算的密率。抄写人有地方放三个数，不必挤掉其中一个。你把纸条带回来，完整的算法在笔记里还是一处空白。
  aryabhata_patna:
    name: 三步算出一圈的长度
    place: 印度库苏马普拉
    figure: 阿耶波多
    story: 《阿耶波多历数书》的数学篇写了一条求近似圆周的口诀，以 20,000 为直径。100 加 4，乘 8，再加 62,000，得 62,832。
    relic: 一片棕榈叶经文
    relic_desc: 一片薄叶，上面刻着诗句。
    points:
      p1: 按顺序算完三步
      p2: 传下结果之前说清直径取多少
      p3: 给制绳人做一道直径加倍的算例
    vignettes:
      scale: 制绳人在板上写了两个直径，配的却是同一个圆周。你把 20,000 和 62,832 配在一行，再指给他看直径加倍时该把哪个数也翻倍。他改了一行，你把两组数字记下来。你走时，绳子还在量。
      measure: 你知道这条口诀会比作坊里的人流传得久。制绳人问做活时该怎么记，你把三步各写一行。他重算一遍，没再问最后该加哪一个数。真正的绳子得留到另一天。
      copy: 板擦掉之前，你把直径和近似圆周都抄了下来。制绳人这才看出为什么得留两个数。你带走写在同一张条上的数，没等到绳子绕上圆周。
  brahmagupta_bhillamala:
    name: 账上的另一栏
    place: 印度比拉马拉
    figure: 婆罗摩笈多
    story: 婆罗摩笈多的《婆罗摩历算全书》列出负债、财产与零的运算规则。从财产中减去一笔债，会使账上的数增加。书中关于除以零的规定与现代算术有别。账页和管账人都属于分支演绎。
    relic: 一片画着小圆圈的棕榈叶
    relic_desc: 一片叶子，上面有个代表“没有”的小圆圈。
    points:
      p1: 算清移掉三份欠款后的余额
      p2: 说明减去欠款和减去到手的钱有什么区别
      p3: 擦账前把算例和规则抄在同一张纸上
    vignettes:
      debt: 管账人从五里面减了三，可他划掉的原是一笔欠款。你把原账项抄在算例上头，算出的余额是八。还没来得及问他老师怎么处理除以零，他就合上了账板。
      limit: 你知道现在的课堂对除以零有不同处理。你在管账人的例题旁画记号，标出哪些属于加减。今天要用的那道题仍留在板上。你把这份清单记走，下一堂没赶上。
      token: 你放下五枚筹子表有的钱，另放一枚标那笔债。管账人看清笔下划掉的是哪一栏。你带回两栏各管什么的笔记。临走时，下一本账已翻开。
  li_bai_changan:
    name: 关于酒、月和远方的诗
    place: 中国长安
    figure: 李白
    story: 《清平调》三首传为李白所作。附录讲了宫中演唱的故事，属于后来的记述。
    relic: 一只小酒杯
    relic_desc: 杯底画着一弯淡淡的月。
    points:
      p1: 听出两句之间转折在哪里
      p2: 问清一个演唱故事是怎样传下来的
      p3: 把诗抄得清楚，留给下一个歌者
    vignettes:
      verse: 唱到不贴曲的一行，歌者停住。你请他先念，再唱一次。第二遍换气，恰好落在诗意转过去的地方。
      palace: 歌者听你问那晚宫里有哪些人，便放下抄诗，问你读的是哪段记载。你在旁写下，诗和讲那一夜的故事各有来处。
      copy: 歌者标出每次唱到都会停一下的地方，你一直替他翻开那页。带走诗句时，你还记得要在哪一处听那一停。
  murasaki_kyoto:
    name: 世界上第一部伟大的长篇小说
    place: 京都
    figure: 紫式部
    story: 紫式部日记记载，1008 年有人借《源氏物语》中的人物开玩笑，可见故事当时已在宫中为人所知。
    relic: 一只漆制笔盒
    relic_desc: 一只小盒子，里面有笔、砚和水。
    points:
      p1: 分清人物名和屋里随口叫的称呼
      p2: 在闲谈打断后接上朗读的线索
      p3: 还回纸页时保留读到的位置
    vignettes:
      nickname: 你听见有人叫小说里的人名，转头找错了人。侍女看出来了，笑问你是不是又在门口偷听人念故事。
      voice: 你听出侍女念到故事里的信时换了语气，请她照原来的声音再念一次。第二遍听来，话里竟少了几分笃定。
      return: 念到一半，纸页传到你手里。你按住刚停下的地方，免得换回去时还得猜从哪里接着念。
  su_song_kaifeng:
    name: 一座水力驱动的大钟楼
    place: 中国开封
    figure: 苏颂
    story: 苏颂《新仪象法要》图文记载水运仪象台，上有观测仪器，另有随钟鼓报时的木人。
    relic: 一枚齿轮的齿
    relic_desc: 一个与人一样高的齿轮上的一颗青铜齿。
    points:
      p1: 认出图上的仪象台部件
      p2: 分清两组试报的声音
      p3: 帮看守给来看的人腾出清楚的站位
    vignettes:
      listen: 你站到门外，看不见木人。看守敲了两组试声。你依次复述，他拿标签逐一对上。
      layers: 看守手指着这层，嘴里却讲的是上面那层。你沿图一层层划过去，请他下一次演示前给声音各标一行。
      marker: 你在模型外做了个站位标记。下一对来看的人能见到门开，也不挡看守自己的视线。
  shen_kuo_runzhou:
    name: 什么都记下来的笔记
    place: 中国润州
    figure: 沈括
    story: 沈括在《梦溪笔谈》中记下，磨过的磁针指南，却常微微偏东。
    relic: 一根磁化的针
    relic_desc: 每次都指向同一个方向的针。
    points:
      p1: 认出磁针指南的一端
      p2: 纸转动之后仍能认清标记的方向
      p3: 把「微微偏东」写进图注
    vignettes:
      directions: 你问读者哪一条是正南。他纸上只有一道线。你添上另一道，书里那个微小的偏角才看得出来。
      ends: 读者把纸转过来给你看，口头重述时却换了针的两头。你趁他还没誊进本子，标明哪一头指南。
      copy: 你请读者在图旁保留那个「微」字。图画了一整页，书上说的偏差可没那么大。
  angkor_wat:
    name: 分两张记下的进场路线
    place: 柬埔寨吴哥
    figure: 高棉的建造者们
    story: 柬埔寨吴哥遗址管理机构 APSARA 记载，吴哥窟为十二世纪建筑，有砂岩堤道和带浮雕的回廊。
    relic: 一张进场路线图
    relic_desc: 标出砂岩堤道与回廊起点的草图。
    points:
      p1: 走过堤道，标明自己站在护城河哪一侧
      p2: 帮工指转弯处时，把图朝同一方向举稳
      p3: 分别标出过河段与回廊，留给下一班
    vignettes:
      route: 工场帮工把堤道和回廊接成同一条边。你把纸转向来路，圈出两条线从哪儿对不上。他现在能用一根手指点出该在哪里交接。你把订正图记下，下一班还没来试走。
      load: 你知道后来的访客会反复写到浮雕，今天这条送图的路却未必有人记得。帮工问拿图的人在哪儿停才不挡路。你走回转弯处，在图上补一点。还没等另一个人照着走，你就收队了。
      edge: 你在一张纸上抄下河沿，另一张抄回廊头一段。帮工把两纸在转弯处对齐。你带走这一小段轮廓，在这里怎么转头也看不见整条回廊。
  sejong_hangul:
    name: 人人都学得会的字母
    place: 首尔
    figure: 世宗大王与学者们
    story: 1443 年，朝鲜世宗亲制二十八个字母，用来书写朝鲜语。1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。世宗于 1450 年去世。
    relic: 一块刻着字母的木板
    relic_desc: 刻着最早几个字母的木板，等着上墨。
    points:
      p1: 先让集贤殿的杂役认下，再替学士们研墨铺纸
      p2: 教集市上一个不识字的摊主用新字拼出自己的名字
      p3: 有人上疏反对的那些天，把新字的誊本收好
    vignettes:
      gesture: '{staff}看见一位学士画一个字母之前先比了比嘴形，便把嘴的样子描在那个字母旁边的页边上。'
      spacing: '{staff}把一张纸打成方格，让一个音节的几部分落在同一格里，什么也没说，放在了桌上。'
      lesson: '{staff}在集市上用树枝在土里写了三个字母给一个孩子看，孩子把它们念成一个音，转身跑开了。'
  li_shizhen_qizhou:
    name: 哪个名字归在哪一条
    place: 中国蕲州
    figure: 李时珍
    story: 李时珍于1578年完成《本草纲目》初稿，带编排体例和插图的早期印本问世在后。
    relic: 一张抄留的样本签
    relic_desc: 工作标签，给另一种叫法留有位置。
    points:
      p1: 清桌前把两张签都找回来
      p2: 核对两个名字是不是在同一地听来的
      p3: 把异名和它的来处一并留在条目旁
    vignettes:
      names: 阿林把集市上听来的名字写在样本包纸的名字旁。你问是哪一摊这样叫。她记得摊子，说不上是哪一乡的叫法。条目留住两个名字，只注明她还指得出的来处。
      wrap: 屋子要关，阿禾只来得及送一包样本。你把签一并放入包内，交给他前另抄在纸头上。桌子清出来后，阿林还查得到哪一个名字随样本送去了。
      print: 你记得后世印本里这条的图。阿林问，照那幅图能不能断定自己包纸上的名字。你把名字和她说得清的来处一起留在纸上。后来那块刻图的木版，这一趟等不到。
  basho_hiraizumi:
    name: 奥州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 芭蕉以 1689 年行旅为素材，后来写成《奥之细道》。平泉一节从眼前景物想到旧事，收有咏夏草的俳句。
    relic: 一顶草笠
    relic_desc: 被雨淋灰了的编织草帽。
    points:
      p1: 与同行旅人一起走到歇脚处
      p2: 停下时看清景物的一点变化
      p3: 带回一个亲眼看见的细节
    vignettes:
      grass: 旅人问你在看什么。你等草再动了一下才回答。后来写下这个地方，你先想起的是草动的样子，才想起地名。
      accounts: 旅人讲的旧事里，有个地方比眼睛能看到的还远。你把故事和所见分两行记，接着问这名字是从哪听来的。
      sandal: 你挪开包袱，让旅人把湿草鞋摊平。再次出发之前，两人还有空指认山脊上的一处地方。
  hokusai_edo:
    name: 神奈川冲浪里
    place: 日本江户
    figure: 葛饰北斋
    story: 葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。
    relic: 一块印刷用的木版
    relic_desc: 一块雕好的樱木版。
    points:
      p1: 从浪形之间找出富士山
      p2: 给柜台前的客人讲清一处细节
      p3: 给展示的印本留出题签和落款
    vignettes:
      mountain: 版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。
      edge: 版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。
      counter: 一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。
  bose_calcutta:
    name: 把书转回原来的方向
    place: 加尔各答
    figure: 贾格迪什·钱德拉·博斯
    story: 博斯在 1897 年 1 月 28 日宣读的论文中记载，把一本装订好的书置于电波束中，转过四分之一圈，电波便更容易通过。
    relic: 一个植物生长记录仪的部件
    relic_desc: 一根把植物的生长放大一万倍的杠杆。
    points:
      p1: 转动书本前先读一次检波结果
      p2: 请工场帮工转回第一个方向复验
      p3: 在装置草图上标出起始方向
    vignettes:
      return: 帮工转过那本书，读数变弱了。你请他先别收，把书转回原位。这次读数也跟着回来了。表里写下了两次变化，第二种材料还来不及试。
      mark: 帮工说原来朝哪边他自己记得。你在图上做一个记号，又在夹架上找到与它相合的位置标出来。他回到起始方向便不用靠猜。下一轮对照轮到他自己做。
      reading: 碰装置之前，你先画下书页朝哪边，再把读数写在旁边。转过书，在新的一行记第二个读数。两行都能带回去。仅凭这两下，还分不清有没有漂移。
  tagore_santiniketan:
    name: 一首诗，读两遍
    place: 印度圣蒂尼克坦
    figure: 罗宾德拉纳特·泰戈尔
    story: 英文版《吉檀迦利》收入泰戈尔本人从孟加拉语译写的散文诗。1913 年，瑞典学院把诺贝尔文学奖授予泰戈尔。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的亲笔。
    points:
      p1: 确定哪张讲义是泰戈尔本人译写的英文
      p2: 请读诗小组用另一种语言再读一遍
      p3: 把两份朗读稿留给下一班
    vignettes:
      headline: 你告诉管朗读的学生，奖项会带来只读得懂英文的新读者。学生问他们会先拿哪张。你把两张都留在桌上，给英文那张标明是作者自己译写。轮到第二遍时，你已得收队。
      pause: 学生每到印刷行尾就停。你念了一整句，把该停的一处标在更前面。下一位朗读的人念完了整句的意思。你留了一份带停顿记号的纸，但没能听到另一种语言的读法。
      sheets: 读完后，你把散开的两张稿夹在一起，标明各是哪一种语言。下一个人来了，学生可以把两张一起交给他。你只带回一个记得住的停顿，再念一遍时，教室已经空了。
  ramanujan_madras:
    name: 一封请人核算的信
    place: 马德拉斯
    figure: 斯里尼瓦瑟·拉马努金
    story: 1913 年 1 月 16 日，拉马努金从马德拉斯给哈代写信，介绍自己的研究，并提到发散级数。算例用来分清普通部分和与赋值方法。
    relic: 一块石板
    relic_desc: 一块学生用的石板，写了擦、擦了写好多次。
    points:
      p1: 核算例题的前四个普通部分和
      p2: 请帮工把说明信放在练习纸前面
      p3: 另抄一份留下，好回头答第一处疑问
    vignettes:
      sums: 邮务帮工在一排写不完的正整数旁写了一个总数。你按通常加法算出前四个部分和，1、3、6、10。他给这一栏另起了题头。你带走这张表，信却要自己走到英国。
      future: 你告诉帮工，收信人日后还会写到这封信。他问头一次拆信的人能看懂什么。你便把介绍页放在练习纸前头。拆信时，你看不到读信人的脸。
      address: 帮工捆纸包前，你请他把封套上的地址念一遍。你在自己的条子上留了日期和最先想问的问题。收队时，还来不及有回信。
  franklin_philadelphia:
    name: 闪电就是电
    place: 费城
    figure: 本杰明·富兰克林
    story: 富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。
    relic: 一条丝带和一把钥匙
    relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
    points:
      p1: 从纸上找出有记载的观察
      p2: 分开写信日和事发日
      p3: 把改好的说法念回给印工
    vignettes:
      cloud: 印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。
      date: 你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。
      proof: 印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。
  morse_washington:
    name: 上帝做了何等的事
    place: 华盛顿
    figure: 塞缪尔·莫尔斯
    story: 1844 年 5 月 24 日，莫尔斯从美国国会大厦向巴尔的摩的阿尔弗雷德·韦尔发送电报。留存的纸带记录了信号；莫尔斯注明文句由安妮·埃尔斯沃思建议。
    relic: 一只电报键
    relic_desc: 一根黄铜杠杆，拇指放的地方磨亮了。
    points:
      p1: 认出练习纸带上各处分隔
      p2: 把电文和发报人的记录放在一起
      p3: 把收文同原来的字句核对
    vignettes:
      gap: 报务员从一道短空隙另起了一个词。你和他把纸带倒回来读，终于找到下一个人读来也合适的分隔。
      credit: 你问打在纸带上的话是谁想的。报务员在簿上记了发报人，你另外留了一格给先提这句话的人。
      readback: 报务员把纸带递给你，没告诉你预定的文句。你先完整读一遍，末了才打开纸条核对。
  edison_menlo_park:
    name: 灯旁那块钟
    place: 新泽西门洛帕克
    figure: 托马斯·爱迪生
    story: 查尔斯·巴彻勒在 1879 年 10 月 22 日的门洛帕克实验笔记里，记下用棉线制成炭丝的早期试验，包括发出的光和电阻的变化。
    relic: 一只炭丝灯泡
    relic_desc: 玻璃泡里有一根头发丝细的圈。
    points:
      p1: 守过一次换班，写明是哪一刻交接
      p2: 把灯丝材料与这一盏灯的读数对上
      p3: 守到同页两次读数各有时间可查
    vignettes:
      log: 工场帮工写了「灯仍然亮」，漏记了钟点。你请他交班前把看钟的结果添到下一行。接班的人于是分得清两次观察隔了多久。你走时灯还亮着，整盏灯到底撑了多久，笔记里没有。
      future: 你知道以后电灯会照亮整条街。工场帮工看见这盏灯一亮，就想标作已经试好。你给第二次观察留了一行，灯可以交给下一班接着看。换了下一种材料的结果，你没赶上。
      tag: 两张纸条散着。你把写棉线的那张与这只玻璃泡的读数配好，交给接班的人。你带回交接钟点。灯最后熄灭时，已是别人守着。
  wright_kitty_hawk:
    name: 在空中的十二秒
    place: 北卡罗来纳基蒂霍克
    figure: 奥维尔和威尔伯·莱特
    story: 1903 年九月，莱特兄弟带着一架装了发动机的飞机回到基蒂霍克附近的营地。12 月 14 日威尔伯的尝试没有成功。12 月 17 日上午他们飞了四次，第一次 12 秒，最后一次 59 秒。当天下午，兄弟俩走到基蒂霍克，给代顿的父亲发了电报。
    relic: 一片螺旋桨叶
    relic_desc: 一片木头叶子，像一只扭过的翅膀。
    points:
      p1: 先让救生站的人认下，再帮着把滑轨抬上沙丘
      p2: 第一次飞行时守在相机旁，让快门按在该按的那一刻
      p3: 发电报时，把最长一次的秒数写在纸条上，随电文一起递过去
    vignettes:
      numbers: 天黑之前，{staff}把四次飞行按先后抄进本子，秒数一栏，英尺一栏，加了两遍。
      sand: 夜里风大，{staff}把滑轨从沙里刨出来，在滑轨脚下把沙踩平。一位编出来的救生站帮手说，天亮风就会停。天亮了，风没停。
      cold: 发动机预热时，{staff}在棚里守着炉子。外头的水洼结了冰，谁也没提。
  tenochtitlan_lake:
    name: 从隆起的田块之间过船
    place: 墨西哥特诺奇蒂特兰
    figure: 墨西卡的建造者们
    story: 特诺奇蒂特兰在特斯科科湖中的岛上发展。称为奇南帕的垫高耕地固定在水道之间，后来索奇米尔科的景观仍可见这一形态。
    relic: 一张船道草图
    relic_desc: 一排固定的桩，另有一张画着船的散纸可以移动。
    points:
      p1: 走到田边与船道相接的地方
      p2: 画船的路线时，给图上的水道留出宽度
      p3: 分清固定田块和会随水移动的停船记号
    vignettes:
      fixed: 帮工把整块田画到早上停船的地方。你指给他看仍立在田边的桩，把船改画在散纸上。船能沿图移动，田仍留在那一处。等船再回来，你已经走了。
      channel: 你知道后来的来客会把这类田叫浮动园圃。眼下帮工却得在两块固定田地之间找水道。你沿着边走到能标出开口的地方。下一条船在图上有路可走，船上载什么，这张纸没记。
      posts: 你先标一排固定的桩，再画船贴着它们过去的位置。帮工看图能分清这两种记号。你带回这一小段两者间的距离，从这里还望不出下条水道通哪里。
  machu_picchu:
    name: 顺水再走一口石池
    place: 秘鲁马丘比丘
    figure: 印加的建造者们
    story: 马丘比丘约建于 1450 年，多半是印加统治者帕查库特克的庄园，约一个世纪后、西班牙征服前后被废弃。一条水渠从泉眼引水，沿阶梯流过十六处石池。1911 年 7 月 24 日，当地农民梅尔乔·阿特阿加领着海勒姆·宾厄姆登上遗址；1981 年这里成为秘鲁的历史保护区，1983 年列入世界遗产。
    relic: 一块切好的石头
    relic_desc: 一块巴掌大的石头，边是直的、正的。
    points:
      p1: 先让石匠们认下，再把石料一层层背上梯田
      p2: 从泉眼顺着水走过十六口石池，记下水流到了哪里
      p3: 雨季里，把石池上方的水渠里的泥清干净
    vignettes:
      wet: '{staff}走到下一口池才落笔标“有水”，没见到水之前，第二个格子空着。'
      steps: '{staff}从台阶顶上顺着水流的方向数石池，不从早上开工的地方数。'
      mark: '{staff}在水渠拐弯处刻了个小口，下一个来清渠的人就知道水在哪里转弯。'
  maya_venus_tables:
    name: 页边的五轮金星
    place: 墨西哥奇琴伊察
    figure: 玛雅书吏们
    story: 《德累斯顿玛雅抄本》第 24 页及 46 至 50 页保存了金星表，以 584 日计一轮。
    relic: 一条彩绘树皮纸
    relic_desc: 一条树皮纸，上面有红黑的字符。
    points:
      p1: 区分周次与累计日数
      p2: 按每轮 584 日验算五轮合计
      p3: 分别标明推算栏与实测栏
    vignettes:
      count: 学算人把五写到了日数那一栏。你在一栏画五道短划，在另一栏记累计 2920 日。他看得出两栏题头为何不能互换。你把两栏一同带回，至于隔着晨云还能看见什么，这些数答不出来。
      dawn: 你认出这个日数，后来的抄本里还留着这样的表。学算人想把推出来的日子填进实测一栏。你请他等有人看过天再填。现在一栏有推算的日子，另一栏空着。下一回天晴破晓，你来不及等。
      margin: 你抄下五百八十四，旁边补一句它数的是甚么。学算人把那个题头重念一遍才收纸。回去时你还能重算这道题。要真看到金星，仍得等天气。
  sequoyah_syllabary:
    name: 一个人造出来的文字
    place: 美国东南部切罗基地区
    figure: 塞阔雅
    story: 切罗基银匠塞阔雅为切罗基语造了一套八十多个符号的音节文字。1821 年，他在切罗基全国议会上演示这套文字确实能用，议会接受了它。1828 年 2 月 21 日，第一份美洲原住民报纸《切罗基凤凰报》在新埃乔塔出了创刊号，切罗基文和英文并排印。1843 年 8 月，塞阔雅在墨西哥去世。
    relic: 一张音节表
    relic_desc: 一张纸，八十多个字符排成行。
    points:
      p1: 先让他家里的人认下，再替他把写满符号的纸理好
      p2: 教一位邻家妇人用这套符号写出自己的名字
      p3: 议会那天，把一张写好的纸条从一边送到另一边
    vignettes:
      sound: '{staff}听一个学字的人照平常的快慢念一个词，再慢慢念一遍，一个音节指一个符号，直到他自己能指着念下去。'
      lookalike: '{staff}看出有个符号长得像英文字母，把旁边铅笔标的那个字母划掉了，免得把人带偏。'
      note: '{staff}捧着一张纸条穿过议会的空地，交给一个没听见口述的人，站在旁边听他念出来。'
  finlay_havana:
    name: 蚊子与黄热病
    place: 哈瓦那
    figure: 卡洛斯·芬莱
    story: 卡洛斯·芬莱 1881 年在哈瓦那提出黄热病蚊媒传播的假说，论文题目也表明其假说性质。
    relic: 一片蚊子的玻片标本
    relic_desc: 一片标本，里面有一只蚊子的翅。
    points:
      p1: 看蚊子叮咬的时刻
      p2: 照看黄热病人
      p3: 逐日记录一整年的病例
    vignettes:
      headline: 虚构的编辑把一个推测写成了确定的事。你慢慢念回原题，他在校样交出去前把「假说」两字补回去。
      columns: 编辑把笔记里每一行都照同一种意思念。你划成所见和所推两栏，有一句移到了另一边。
      place: 你核对宣读论文的地点。编辑把地名记在日期旁，后来的报道才不会把会议说成另一场。
  bell_boston:
    name: 把听到的写下来
    place: 波士顿
    figure: 亚历山大·格雷厄姆·贝尔
    story: 亚历山大·格雷厄姆·贝尔的实验笔记记载，1876 年 3 月 10 日在波士顿，托马斯·沃森听懂了贝尔对着发话装置说的话。
    relic: 一只电话听筒
    relic_desc: 一个木制听筒，里面有一片薄薄的振膜。
    points:
      p1: 区分只传来了声响和听清了一个词
      p2: 先请接听的人写下所闻，再亮出原句
      p3: 把发出的话和另一端写下的话逐字对一遍
    vignettes:
      blind: 接听的帮工想先看试句。你把纸折起来，请他只写实际听见的。传过来两个完整的词，最后一个留了空。你把这张纸条带回去，收队时又一轮刚要开始。
      future: 你告诉帮工，后人会记住这天传过来的一句话。他猜只要留下说话那端写的句子就够了。你摊开两张纸条，一张给说话人，一张给听话人。眼下这趟究竟漏了哪儿，还得靠这两张对出来。
      door: 你把接听那张折好的条子带过门，这才摊到试句旁。听漏的词依旧空着，听对的两个总算有了记录。你带回对照表，下一句没有听到。
  budj_bim_eels:
    name: 水曾经到过哪块黑石
    place: 澳大利亚维多利亚州布吉比姆
    figure: 贡迪玛拉人
    story: 贡迪特马拉人介绍布吉比姆文化景观时，记述他们长期利用火山岩修渠筑堰、调节水流，其中包括管理短鳍鳗 kooyang。
    relic: 一只编织的鳗鱼笼
    relic_desc: 一只长筐，口像漏斗。
    points:
      p1: 沿练习水道朝向稳住草图
      p2: 辨出湿痕，别把它当成眼下的水位
      p3: 与帮工约好一个能再复看的位置
    vignettes:
      level: 帮工圈了一道湿痕，说水现在就到那儿。你蹲到一片还在漂的叶子旁，在第一记下头再画一记。图里既留着旧痕，也留着眼下流到哪里。等水再涨到旧痕，你早已走了。
      return: 你知道后世仍会把这些水道连起来看。帮工只够留一个记号，你们挑了弯边一块黑石，约定下回从同一处看。你带走这处站位，下场雨后的那笔还写不出。
      bend: 你画到水转弯看不见的地方，就把线停在那里。帮工留下余纸，等以后再走。你带回水道的一处弯，全程还留在图外。
  galois_paris:
    name: 决斗前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽罗瓦
    story: 伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。
    relic: 一封匆忙写就的信
    relic_desc: 写满算式的信页，页边写着没有时间了。
    points:
      p1: 认出留给下一位读者的问题
      p2: 把纸页按论证顺序排好
      p3: 替信留下原有的日期与收信人
    vignettes:
      check: 誊写员把一个问题夹进了结论。你顺着信查到末尾的请求，他另标出下一个读信人要核对哪件事。
      sequence: 两页都从同一个符号起笔。你分别读了末行，找出论证先用哪一页。誊写员补上页码。
      fold: 你扶着信，等誊写员抄好日期和收信人。他把笔记另折一份，后来还找得出两套纸。
  van_gogh_auvers:
    name: 奥维尔的夏天
    place: 奥维尔
    figure: 文森特·梵高
    story: 梵高 1890 年 7 月在奥维尔写信，提到自己画了不安的天空下大片延展的麦田。
    relic: 一管铬黄颜料
    relic_desc: 一支挤瘪的锡管，里面是他画麦田用的那种黄。
    points:
      p1: 看同一片田上方的天空怎样变
      p2: 走到看得出路通往哪儿的地方
      p3: 帮访客带回一张看得明白的草图
    vignettes:
      sky: 你请访客把同一片地画两遍，先只留一条天，再多留些。他从第二幅里指出了一件原先没留意的东西。
      wind: 访客觉得麦秆全朝一个方向，停下来画。你等到下一阵风，暗下去的一块换了地方，两人就另记一笔，不必擦去第一眼。
      path: 你走到访客看得清田路尽头的位置。回去时他没把尽头画进去，却已说得清路通到哪儿。
  abel_froland:
    name: 一道算得出的五次方程
    place: 弗罗兰
    figure: 尼尔斯·亨里克·阿贝尔
    story: 阿贝尔于 1824 年证明，一般五次方程没有根式解法。某些具体的五次方程仍可用根式求解。1829 年 4 月 6 日，阿贝尔在弗罗兰去世。4 月 8 日，尚不知情的克雷勒从柏林寄信告知他有一份长期教职。
    relic: 一封封着的信
    relic_desc: 一封没拆开的聘书，用细线系着。
    points:
      p1: 说清一道能解的例题为何不能回答一般情形
      p2: 留到能把例题答案代回原式核算
      p3: 把算例与它所说明的命题放在一起
    vignettes:
      example: 抄写人练习纸上有一道五次幂等于 32 的题。你代入 2 得到 32，又在写着阿贝尔结论的另一张纸上划出「一般」二字。抄写人把两张收在一起。你带回这道验过的例题。此时，柏林那封信还没有写。
      job: 你知道克雷勒哪天写信，便请抄写人在夹里给柏林留一处。他问该不该写成消息已到。你把那一格空着，另记原因。那封信要等到阿贝尔去世两天后才写。
      margin: 你把一道算好的例题抄在纸条背面，正面留下那条一般结论。后来的人把纸翻面就能对照。离开时，留给柏林消息的地方仍空着。
  riemann_selasca:
    name: 最后一篇论文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 黎曼 1854 年的讲稿讨论几何的基本假设及距离如何定义。
    relic: 一页笔记
    relic_desc: 一页写着没完成公式的纸，字很小。
    points:
      p1: 沿着表面走完一条线
      p2: 比较时仍用原来标好的两个端点
      p3: 讲明一次测量所用的一个假设
    vignettes:
      surface: 读者把纸带从一点拉到另一点，中间却离开了曲面。你把另一条沿弧面按下去，请他分清两条量的是哪种走法。
      assumption: 读者说距离一看就知道。你问哪些走法算数，是怎么定的。他把这个条件添在图上方，重新开始量。
      paper: 练习纸弯起来时，你帮读者留住起讫两点的记号。现在比较两次读数时，不必重新找点。
  du_chatelet_luneville:
    name: 法语版牛顿
    place: 吕内维尔
    figure: 埃米莉·迪沙特莱
    story: 迪沙特莱翻译并加注的牛顿《原理》完整法译本，于她去世后的 1759 年刊行。
    relic: 一只墨水瓶
    relic_desc: 一只小墨水瓶，来自一张通宵写字的书桌。
    points:
      p1: 找出评注正在解释的那句原文
      p2: 帮读者把两份文字对齐
      p3: 给下一次读稿留下清楚的标记
    vignettes:
      source: 读者顺着一句直接念到下一句。到评注开头处，你请他停一下。再翻回第一页，他已能认出是哪一位作者在解释。
      diagram: 你问这段话画出来该是什么样。读者先画了个方向，又回去翻文字，确认箭头该落在哪儿。
      mark: 你把夹在下一页的纸签移到读者想回看的那一行。散页收起来时，问题仍和原段夹在一起。
  noether_gottingen:
    name: 署着别人名字的课
    place: 哥廷根
    figure: 埃米·诺特
    story: 诺特在 1918 年的论文中说明，在给定条件下，变分问题的连续对称性与相应守恒关系之间的联系。
    relic: 一张课程通告
    relic_desc: 一张厅里的通告，应该写她名字的地方写着希尔伯特。
    points:
      p1: 认出例子里做的变换
      p2: 讨论结论前把前提再读一遍
      p3: 帮听讲者分清对称性和守恒的量
    vignettes:
      clock: 你问把同一个例子往后推一会开始，规则会不会变。听讲者挪了钟上的起点，在页边重画图，原规则一笔没动。
      assumption: 听讲者记住了结论，却跳过了前提。你把前提另写一条，请他说出怎样改例子，这张纸条就不再适用。
      board: 黑板要擦时，你先抄下两个栏头。听讲者把所做的变换和保持恒定的量分列记在下面。
  wegener_greenland:
    name: 越过冰盖
    place: 格陵兰冰盖
    figure: 阿尔弗雷德·魏格纳
    story: 1930 年，魏格纳运送补给抵达冰盖内陆站艾斯米特，在回程中去世。阿尔弗雷德·魏格纳研究所的档案说明记下了行程，并指出格陵兰同行者拉斯穆斯·威卢姆森的姓名。
    relic: 一条雪橇皮带
    relic_desc: 一条冻硬的皮带，系过满载的雪橇。
    points:
      p1: 在严寒里跟上队伍
      p2: 留意天气正在变
      p3: 把雪橇拉到行程的尽头
    vignettes:
      names: 虚构的办事员只在远征一栏写下一个姓。你问是谁把那份东西交到站上的。他给其他参与的人另留了一行，没有只记最著名的姓名。
      count: 办事员把出发的数写得像到站的数。你请他在每项数字旁标上是哪一站的记录，两项合计便不再挤在同一个栏头下。
      note: 办事员收拢账本时，你把目的地另抄一张。后来的人仍能看出这些条目记的是哪一站。
  boltzmann_duino:
    name: 同一个数，几种排法
    place: 杜伊诺
    figure: 路德维希·玻尔兹曼
    story: 玻尔兹曼 1877 年关于概率与热平衡的论文，计算同一种能量分布可由多少种粒子分配方式得到。
    relic: 一截粉笔
    relic_desc: 一截用得很短的讲课粉笔。
    points:
      p1: 交换有标签的两枚筹，指出哪些记号变了
      p2: 请学算人把数量分布与具体摆法分开写
      p3: 把例题留得简明，收队后还能重摆
    vignettes:
      six: 学算人从四枚有记号的筹里挑两枚放左盒，只数了一种。你每行写明挑哪两枚，找到了六种同为两边各二的摆法。他改了一个总数。你抄得走清单，论文里真正要问的事却还没算到。
      swap: 你知道图比口头解释留得久，便把左右各一枚有记号的筹互换，分别画下前后。左右仍各有两枚，学算人却看得出哪里变了。还未添第三只盒子，你就走了。
      boxes: 你在两个盒旁各写一个二，再圈出盒里的筹号。学算人把两种记法留在同一张纸上。你带回的是二盒例题，更多的摆法还留在桌边。
  cantor_halle:
    name: 无穷的大小
    place: 哈雷
    figure: 格奥尔格·康托尔
    story: 康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。
    relic: 一叠索引卡片
    relic_desc: 卡片上写满了永远列不完的清单。
    points:
      p1: 说明例表打算列进哪些数
      p2: 照同一规则再添一项
      p3: 列出一些数后，说清还要证明什么
    vignettes:
      list: 学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。
      after: 学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。
      end: 你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。
  tesla_wardenclyffe:
    name: 那一行写着拟建
    place: 长岛肖勒姆
    figure: 尼古拉·特斯拉
    story: 特斯拉1901年与建筑师斯坦福·怀特的通信涉及沃登克里弗的建筑工程。这个场地为计划中的无线通信与传能系统而建。
    relic: 一份留底的图纸
    relic_desc: 沃登克里弗工地图纸副本。
    points:
      p1: 找出工头实际收到的是哪一版图
      p2: 劝文员在告示发出前盖上拟建印记
      p3: 留下退回的那一版，交给下一班对照
    vignettes:
      revision: 工头那一页写着按新图施工。梅布尔在桌上摊开两份图，抬头一模一样。你掀开折角，找到铅笔写的日期，把较新的那张送去场上，并在旧图上标出作废，免得有人拿错。
      print: 乔已经排了一行，说场地正在把电能送出去。他需要一整行来撑住版面。你给他一句话，写场地建起来准备试什么。他把原句和要印出的句子各念一遍，最后留下新的一行。
      empty: 你记得后来塔会剩下什么。梅布尔想找个地方放试验结果，可场上还没人送来。你替拟建工程建了一册档，结果袋留空。下一班若真有人拿来东西，你已不在。
  mozart_requiem_vienna:
    name: 留下能认出的笔迹
    place: 维也纳
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特1791年12月在维也纳去世时，《安魂曲》尚未完成。奥地利国家图书馆保有工作稿和含弗朗茨·克萨韦尔·苏斯迈尔补写的交付谱。
    relic: 一页留白的练习谱
    relic_desc: 抄谱习作，留着已经写下的乐句停住的位置。
    points:
      p1: 给抄谱员腾开桌面，顺次叠好工作页
      p2: 在习作副本上找出已经写下的音乐从哪儿停住
      p3: 守好还空的段落，别误在抄谱时填上
    vignettes:
      stack: 格蕾塔收拾桌面，顺手拿开一页看着空白的纸。你扶住一叠谱，让埃米尔去对它前一页。原来那行空谱也该收在原来的次序里。格蕾塔把它放了回去，夹一张小条记下原来的位置。
      hand: 眼前的乐句埃米尔抄得出，顺着写下去就要越过原来空着的一行。你请他在抄写停住的地方划个边记。交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。
      finish: 你哼得出后世合唱团会唱的那段。格蕾塔现在就得带走副本，问原谱在这一页写到了哪儿。你指出分界，把后来听过的旋律留在心里。下一版会在你离开后拼合。
  schubert_vienna:
    name: 三月那场音乐会的节目单
    place: 维也纳
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，舒伯特在维也纳举行演奏自己作品的音乐会。爱德华·冯·鲍恩费尔德的回忆录载有请柬，上面写着曲目与音乐之友协会的会场。
    relic: 一份歌曲手稿
    relic_desc: 一首运笔很快的歌，墨迹还很深。
    points:
      p1: 读懂节目单，标出下一首从哪儿开始
      p2: 不打断演奏，把迟到的听众领到座位
      p3: 留到最后一首，把座位纸交回
    vignettes:
      timing: 引座人见客人一到就想开门。你照节目单数过曲目，请两人等到下一次停顿。迟到的人找到座位，台上接着演。末尾那一段，你站在走廊里听完。
      memory: 你告诉虚构的引座人，多年后人们还会找这张请柬，到时这些椅子早就不在了。他请你留一张没折的。你收到一边，在自己的纸条上记下日期。回来时，开场已经过去。
      chairs: 你在引座人的座位纸上给一把空椅子做了个记号。有人来迟时，他不用请整排人都挪动。你带回日期和那个记号。至于那位听众有没有听到最后，你没能看到。
  keats_rome:
    name: 台阶旁的小屋
    place: 罗马
    figure: 约翰·济慈
    story: 1820 年 11 月，患肺结核的约翰·济慈与画家约瑟夫·塞文来到罗马，住进西班牙台阶旁的西班牙广场 26 号。1821 年 2 月 23 日夜里他在那里去世，2 月 26 日葬在新教徒公墓。照他的意思，墓碑上没有他的名字。
    relic: 一朵压干的紫罗兰
    relic_desc: 夹在书里的一朵干花。
    points:
      p1: 先让这栋房子里的人认下，再每天早上把面包和牛奶送上楼
      p2: 最后那几夜，替塞文守着，让他睡上几个钟头
      p3: 下葬那天，在新教徒公墓的墓旁站着
    vignettes:
      stairs: '{staff}数了从门口到房间的台阶，好知道托盘端上去时还热不热，把数字记在买菜单的边上。'
      window: '{staff}把窗推开一道缝，让广场上泉水的声音进来。屋里没人说什么，也没人去关。'
      fountain: '{staff}在台阶脚下那座船形泉边打水。一位编出来的卖花人问，这栋楼里是谁病了，把一束紫罗兰半价卖了。'
  vermeer_delft:
    name: 负债的画家
    place: 代尔夫特
    figure: 约翰内斯·维米尔
    story: 维米尔 1675 年在代尔夫特去世。阿姆斯特丹国立博物馆的展览记录了他家留下的债务，以及卡塔琳娜·博尔内斯向面包商抵押画作的事。
    relic: 一枚珍珠耳环
    relic_desc: 一颗小珍珠，是他常画的那种。
    points:
      p1: 找出能辨认一幅画的细节
      p2: 向记得画的人核对描述
      p3: 誊账时分清抵押与出售
    vignettes:
      motif: 账房记得一幅画里的光，却说不准是哪幅。你问画里的人在做什么。他把动作记在画名旁，后来查的人便有两条线索。
      pledge: 有人把抵押的画抄进了已出售一栏。你翻到早一页，请账房分别说清两个词在账上记的是什么。
      cover: 账房去屋子另一头找画的描述，你替他扶着账本。回来时，该核对的那一页还翻着。
  rembrandt_amsterdam:
    name: 儿子之后
    place: 阿姆斯特丹
    figure: 伦勃朗
    story: 伦勃朗有一幅署年 1669 的《六十三岁自画像》，可见他在去世那年仍在画自己的脸。
    relic: 一支画笔
    relic_desc: 一支磨旧的画笔，笔毛里的颜料已经干了。
    points:
      p1: 看出脸转过去时光线哪里变了
      p2: 帮学徒找准能坐住的位置
      p3: 把习作留好，方便回头再看
    vignettes:
      mirror: 学徒总画成自己想象的样子。你请他稍微转过脸，等能说清光落在哪儿，再往下画。
      seat: 学徒歇手前，你在凳脚旁画了道粉笔记号。他回来时不用挪整张桌子，也能坐回原来的角度。
      look: 你陪学徒坐着，等他的眼睛不再急着在镜子和纸之间来回跳。他把画递给你看时还有一角空着，决定先留在那里。
  gaudi_barcelona:
    name: 被电车撞倒
    place: 巴塞罗那
    figure: 安东尼·高迪
    story: 圣家堂诞生立面的圣巴拿巴钟塔于 1925 年完工。1926 年高迪去世时，整座教堂仍未完成。
    relic: 一个石膏模型
    relic_desc: 一个小小的悬挂式穹顶模型。
    points:
      p1: 在图上认出一处已经完工的部位
      p2: 把图纸和街头所见对一对
      p3: 留条纸片，帮下一位访客认出方向
    vignettes:
      outline: 办事员举起图，让访客一次看见所有塔。你把已经立着的那座涂深一点。出去后，访客便有一处可以先找。
      street: 你请访客先走到下一个街角再抬头。图上那道已经完成的轮廓，在刚才的位置看不见。他记下了自己站在哪里。
      copy: 你把图折回办事员指给你看的那一面交还。他补了个记号，留给下一位从别条街走来的人。
  kafka_kierling:
    name: 疗养院里的校样
    place: 基尔灵
    figure: 弗朗茨·卡夫卡
    story: 卡夫卡 1924 年的《饥饿艺术家》收四篇小说，包括《女歌手约瑟芬，或鼠族》。
    relic: 一页校样
    relic_desc: 一页印刷校样，上面有铅笔改的小字。
    points:
      p1: 把目录上的篇名对回正文
      p2: 把更正的记号放到对应行旁
      p3: 收好写了篇名的校样，留清楚顺序
    vignettes:
      sound: 送稿人念出女歌手的篇名，问听见了还有什么可怀疑。你让他把同一句念给两个人听。你还没说话，两人的回答已经不一样。
      mark: 校样上一处记号落在两行之间。你问送稿人，如果手头只有这张纸，他会改哪行。他先把记号移准，免得带回去被人改错。
      packet: 送稿人查目录时，你理平散页。最后一篇另折进去，页码露在外面。
  dickinson_amherst:
    name: 箱子里的诗
    place: 阿默斯特
    figure: 艾米莉·狄金森
    story: 艾米莉·狄金森许多诗以手稿传世。
    relic: 一册手缝的小本
    relic_desc: 几页手工缝起来的纸，每页一首诗。
    points:
      p1: 认出纸上标着的一处停顿
      p2: 把散页和它接着的几行放一起
      p3: 留下保留异文的一份抄件
    vignettes:
      pause: 读者朗读时把破折号滑了过去。你请他在笔迹断开的地方停一停。再读那一行，他听出了另一种收尾。
      variant: 你看见行上还写了一个词。读者想挑一个抄完就算，你腾出页边，把两个都留着，并注明各在何处。
      stack: 读者整理散页时，你把边缘和笔迹对得上的两张留在一起。下一次清抄，便从这两张并排开始。
  poe_baltimore:
    name: 第四选区的一张求助条
    place: 巴尔的摩
    figure: 埃德加·爱伦·坡
    story: 1849 年 10 月 3 日，印刷工约瑟夫·沃克给约瑟夫·斯诺德格拉斯送了张条子，说瑞安那处第四选区投票点有个自称埃德加·爱伦·坡的人，处境不妙。坡在 10 月 7 日去世，死因未有定论。帮工和你的差事属于分支演绎。
    relic: 一根手杖
    relic_desc: 一根朴素的手杖，握柄已被磨旧。
    points:
      p1: 核对求助条要送给谁、人在何处
      p2: 找一个能把纸条直接送到收信人手里的人
      p3: 给前来帮忙的人留出通道
    vignettes:
      witness: 印刷铺帮工听了三种说法。你问他哪一种是亲眼见的。他能说准一个地点、一个人名。你在备用纸条上只留这两项。四天后，仍有人试着把空下的地方填满。
      dispatch: 印刷铺帮工想等个认识坡的人来。你请他先按已有的地址跑一趟。他回来时，能说清纸条已经送对了门。你把路记在纸角。至于那天下午以前发生过什么，他也说不上来。
      door: 帮工去送纸条时，你把挡道的凳子搬开，在原处留出一条通道。回来的路上，你记下自己能确认的两扇门。此前那几天的空白，仍留在报告外。
  sor_juana_mexico_city:
    name: 送走的最后几本书
    place: 墨西哥城
    figure: 胡安娜修女
    story: 1690 年，普埃布拉主教未经她同意，把她批评一篇布道的文章刊印出来，题为《雅典娜信札》，附信署名“菲洛特亚修女”。她的《答菲洛特亚修女》署 1691 年 3 月 1 日。1693 年她卖掉了书和乐器，1694 年重申誓愿。1695 年 4 月 17 日，她在照顾染疫的修女之后，死于圣杰罗姆修道院。
    relic: 一支羽毛笔
    relic_desc: 一支笔尖裂开的羽毛笔，旁边是空书架。
    points:
      p1: 先让看门的修女认下，再去修道院的厨房帮工
      p2: 空书架上留下一页她的手迹，折进一本经书里收好
      p3: 疫病最重的那几天，守在一位病倒的修女床边
    vignettes:
      kitchen: '{staff}看着一枚蛋在热油里凝住，在糖浆里却散开，在一张碎纸上记下哪口锅是哪样，也不为给谁看。'
      shelf: '{staff}擦净屋里的空书架，木板上还看得出书立过的地方，一块块颜色深些，没去动它。'
      bells: '{staff}在院子里数着报丧的钟声，有一晚响了两回，数完又回去看着水壶。'
  mary_anning_lyme_regis:
    name: 崖壁里的骨头
    place: 莱姆里吉斯
    figure: 玛丽·安宁
    story: 1823 年 12 月，玛丽·安宁在莱姆里吉斯发现一具完整的蛇颈龙骨架，她的草图记下了那条长颈。
    relic: 一枚菊石
    relic_desc: 一枚从蓝色里亚斯岩里敲出来的螺旋形化石。
    points:
      p1: 分清裂纹和骨骼轮廓
      p2: 沿着草图找颈部，别漏掉关节
      p3: 留下一张注明发现者的可用抄图
    vignettes:
      stone: 访客把一条裂缝描成了骨头。你请他沿线继续往下找。那道线离开骨架时，他抬起了笔。
      vertebrae: 你和访客从颈部两头相向数，偏偏在同一处数不到一起。你在那里留了括号，没有顺手添上一块骨头。
      pose: 你转动抄图，直到访客不靠你指也能找出头部。他再把纸转回来，在下面补上标本名。
  hertz_bonn:
    name: 很容易看漏的一点火花
    place: 波恩
    figure: 海因里希·赫兹
    story: 赫兹早先做电磁实验时，用谐振器里的细小火花来察看电振荡。弗劳恩霍夫海因里希·赫兹研究所的实验年表也记载他曾用显微镜观察火花。
    relic: 一个火花隙
    relic_desc: 他做实验用过的一个小铜火花隙。
    points:
      p1: 在接收环上认出表示响应的一点火花
      p2: 请帮工稳住观察位置再试一回
      p3: 把没看清与确认没有分开记录
    vignettes:
      repeat: 帮工瞥一眼就要写「无」。你把接收环放回原处，请他透过镜头再看一遍。第二眼见到一点短促火花。你把第一条改成「未看清」。第一回究竟有没有，收队时仍无法断定。
      signal: 你知道后来的装置会把信号送到更远处。帮工问这么一点火花能不能送一句话。你在他的记录上各留一栏，一栏记认出的火花，一栏记能重现的变化。收队前，只来得及填第一栏。
      gap: 你拿着记录守在台边，让帮工报自己看清的东西。有一格还空着，因为两人都没看准缝上发生了什么。你带回这个没乱填的空格，帮工单上还有几回要试。
  kepler_leonberg:
    name: 证人亲眼看见的事
    place: 莱昂贝格
    figure: 约翰内斯·开普勒
    story: 约翰内斯·开普勒为母亲卡塔琳娜辩护时，把她被捕的日子记为1620年8月7日，也逐一写下居格林根诉讼的拖延。
    relic: 一页核对过的辩护文书练习稿
    relic_desc: 抄写练习，有一处改过日期。
    points:
      p1: 请抄写员把指控和说出它的人记在一处
      p2: 把两份抄本放在一起，等人核对
      p3: 取得信任，把送件人亲耳听到的话念回给他
    vignettes:
      heard: 玛格丽特写着有邻居亲眼看见。你问是哪位邻居，她只叫得出在门边转述的那个人。她把两种说法分成两行，又给可能收到的亲历说法留个位置。
      compare: 马蒂亚斯想先送出一份，另一份留桌上。你照着念了两遍，发现有个日期漏了一位数字。他等玛格丽特找原稿核对。钟声刚停，送件人带着改好的副本走了。
      release: 你知道卡塔琳娜终会获释。玛格丽特问，今天手里这包纸该写什么。你写上送出的日期，帮她等墨晾干。获释的日子这趟还等不到。
  pushkin_st_petersburg:
    name: 门牌号尚未出现的那户人家
    place: 圣彼得堡
    figure: 亚历山大·普希金
    story: 1836 年到 1837 年，亚历山大·普希金住在莫伊卡河畔、科纽申内桥旁沃尔孔斯卡娅公爵夫人的房子里。旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，旧历 1 月 29 日，也就是新历 2 月 10 日在那里去世。他葬在米哈伊洛夫斯科耶附近的圣山修道院，在他母亲身旁。
    relic: 一本诗集
    relic_desc: 一本小书，某首诗里夹着一片压干的叶子。
    points:
      p1: 先让这户人家的仆人认下，再替他们往桥那头跑腿
      p2: 决斗那天，在黑溪边的寒风里等着，帮着把雪橇赶回城
      p3: 那之后的两天，守在门厅，把来问消息的人一个个记下名字
    vignettes:
      number: '{staff}差点把一块博物馆门牌上的号码告诉来访的人，可那块牌子这时还没有，便划掉数字，在纸条上画了那座桥。'
      queue: '{staff}把同一句回答抄在几张纸条上，门厅里等着的人看了就不用再问。'
      river: '{staff}跟着门房从桥边沿莫伊卡河走一遍，数清指路时该说的几个转弯。'
  chekhov_badenweiler:
    name: 寄往弗雷德里克别墅的回信
    place: 巴登魏勒
    figure: 安东·契诃夫
    story: 1904 年 6 月，契诃夫从巴登魏勒寄信，把弗雷德里克别墅写作回信地址，还写到晒得到太阳的花园和屋里的写字桌。
    relic: 一副夹鼻眼镜
    relic_desc: 一副系着细绳的小圆眼镜。
    points:
      p1: 在信封上再抄一份可供核对的回邮地址
      p2: 从花园走一遍到邮筒的路
      p3: 替家属打点安静的房间，腾出写字桌
    vignettes:
      address: 别墅帮工只抄了镇名，漏掉别墅名。你把两份纸条并在一起，在邮差走前补上一行。你带回一张空白地址条，背面画着投信的路线。直到收队，回信还在路上。
      garden: 帮工想搬走写字桌腾地方。你替那把多出来的椅子找了个干燥的角落，桌上的信得以在原处写完。你在自己的便笺上画下一个桌角。收信的人，你没能见到。
      post: 你问帮工邮差走哪条路，趁信还没写好先走了一遍。傍晚，你已经能一口气画出别墅到邮筒的路线。你带回这张小图。信封里写了什么，留给写信的人。
  puccini_brussels:
    name: 给未完稿夹一张分隔纸
    place: 布鲁塞尔
    figure: 贾科莫·普契尼
    story: 普契尼未完成《图兰朵》。普契尼研究中心区分留下的草稿与总谱，并把补完二重唱及最后一场的工作归于弗兰科·阿尔法诺。
    relic: 一页草稿
    relic_desc: 一页用软铅笔写的乐谱草稿。
    points:
      p1: 把正在改的稿页与写好的总谱分开
      p2: 核对同一段的两种写法时，让两页都摊在眼前
      p3: 在尚未完成的一段前插入分隔纸
    vignettes:
      divider: 抄谱人把一页草稿接在誊清谱后头，好像它们属于一份连贯的谱。你插进分隔纸，分别标了两边。往后两份都找得到，也不必认错。舞台上缺的结尾，要留给后来的人。
      future: 你差点把后来演出时的结尾告诉抄谱人。他问你是照哪张读的。你从自己的便笺里划去那个未来的结尾，改记眼前的东西。手上是两叠纸，里面没有一张能让你照抄成末页。
      pin: 抄谱人解开纸包，一页松动的稿子翘起来。你把它扶回原处，在外包纸上画一个小记号，好让他再找得到。你在笔记里带走它的位置。等缺的音乐补上，你早就离开了。
  schumann_endenich:
    name: 换了调的曲子
    place: 恩德尼希
    figure: 罗伯特·舒曼
    story: 美国国会图书馆记载，舒曼在1854至1856年住在恩德尼希期间抄写过《蝴蝶》第10首，将它从C大调移到降B大调。
    relic: 一页写明调号的练习谱
    relic_desc: 练习谱，标明了对照用的调号。
    points:
      p1: 请帮工换个调起头弹一遍
      p2: 比较两份谱的起音，给两页都写好题头
      p3: 把第二个版本留好，与已经送下楼的那份分开
    vignettes:
      key: 莉娜以为起音抄错了。你请她照两份谱各自写的起音，弹几小节。她听出起音不同，旋律的走向却一样。两页都不必擦，她在各自上面标了调。
      envelope: 埃米尔备好的信封只能放一页。你另折了张宽一点的包纸，他把两份都带走，莉娜的题头也不用折进去。到门口他把两个调名念给她听。她可以安心盖好琴盖了。
      gift: 你记得一份手稿日后会交给舒曼的女儿玛丽。莉娜只有练习页，想知道琴边该留哪一张。你帮她把两个调名写上各自的纸套。真正的手稿后来怎样流传，你在这屋里看不到了。
  nietzsche_turin:
    name: 纸背上的收件人
    place: 都灵
    figure: 弗里德里希·尼采
    story: 巴塞尔大学图书馆藏有尼采致弗兰茨与伊达·奥弗贝克的信，署名狄俄尼索斯，馆方定在约1889年1月4日，地点为都灵。奥弗贝克接到他的消息后赶到都灵。
    relic: 一张留底的行李签
    relic_desc: 留底签，抄写时保留了私信内容的隐私。
    points:
      p1: 请搬运工分清收件地址与署名
      p2: 给帮工留出时间，把私人的文书包好
      p3: 帮照料人识别行李签，把信封原样留着
    vignettes:
      address: 彼得罗把狄俄尼索斯抄进了登记的去向栏。你翻过练习纸，指给他看写着收件人的一行。他改好登记，没有解说这个署名。知道该把信包递给谁，就够了。
      privacy: 露琪亚请你扶着提包，她好把文书遮起来。楼梯上有人问里头写了什么。你把包外的签露出来，她不用开包也能说明送到哪里。到了楼梯平台，旁人只看得见应该收包的名字。
      horse: 彼得罗问，你知不知道人们后来会讲起的那匹马。这故事你听过许多遍。你问在场谁看见了，他一个也指不出来。登记里便空着那一行。提包合上时，楼梯上传来了脚步声。
  sophie_germain_paris:
    name: 来迟了的学位
    place: 巴黎
    figure: 索菲·热尔曼
    story: 索菲·热尔曼于 1821 年出版弹性曲面的数学研究，讨论振动薄板上观察到的图样。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借来的名字写给高斯的信。
    points:
      p1: 辨认图中所示的静止线
      p2: 记清每块薄板在文中怎样说明
      p3: 分别说出图上看得见什么、文字又解释了什么
    vignettes:
      quiet_lines: 读者指着最深的线，猜它动得最厉害。你问当图样出现时，哪一处反而是静的。他回头翻说明，先没再添箭头。
      edges: 两张图看着差不多，直到你们读到文字是怎样处理边缘的。读者把两个条件各自写回对应的图。
      compare: 你把印图并排搁好，在下边给读者留条记字的空。他指出两幅不同之处时，手不必压住任何一幅。
  bizet_paris:
    name: 留在架上的《卡门》节目单
    place: 巴黎
    figure: 乔治·比才
    story: 比才的《卡门》于 1875 年 3 月 3 日在巴黎喜歌剧院首演，塞莱斯蒂娜·加利-马里耶首演卡门。
    relic: 一把折扇
    relic_desc: 一把来自池座的彩绘纸扇。
    points:
      p1: 从散页里认出首演那张节目单
      p2: 在入口等到迟来的观众找到座位
      p3: 请帮工留一张注明日期的节目单
    vignettes:
      future: 你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。
      label: 帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。
      seat: 你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。
  modigliani_paris:
    name: 肖像背后的一张纸签
    place: 巴黎
    figure: 阿梅迪奥·莫迪利亚尼
    story: 大都会艺术博物馆藏有莫迪利亚尼于 1919 年所画的让娜·埃比泰纳油画肖像。
    relic: 一截炭条
    relic_desc: 一截能把手指染黑的炭条。
    points:
      p1: 从画面找出一处能与另一幅区分开的细节
      p2: 请帮工给每幅画配对纸签
      p3: 蒙画布时护住纸签，免得再散开
    vignettes:
      line: 画布还没完全揭开，你先认出了头偏向的角度。帮工对着你的小草图，把一张纸签挪到另一摞。你把那道铅笔线留在本子上。等你腾出位置好看整张脸，画又被蒙上了。
      reverse: 画框刚放下，两张纸签就掉了。你趁帮工还没蒙布，各描一道最容易认出的线。这下两张签都能放回原处。纸角有一行前人写的字，仍不知是谁的笔迹。
      cloth: 蒙布挂在框边。你扶着布，帮工把松掉的签压平。布落下前，你把名字抄好。记下的是对的那幅画，脸却只来得及看一眼。
  boole_ballintemple:
    name: 湿衣服与一堂课
    place: 科克巴林滕普尔
    figure: 乔治·布尔
    story: 布尔 1854 年出版的《思维规律研究》用代数表示逻辑运算。其中一条规律是，重复同一选择，所得的类不变。
    relic: 一页逻辑演算
    relic_desc: 一页方程，其中的字母代表是和否。
    points:
      p1: 用例题纸条走完一步运算
      p2: 再选一遍时保留原来的条件
      p3: 说明所得结果为何没有变化
    vignettes:
      repeat: 你请学算者先挑出偶数，再从刚挑出的那一堆里挑偶数。他笑了一声，随后记下为什么第二次挑出的还是原来那一堆。
      border: 学算者没说依据什么，就准备把一张纸同时放进两堆。你请他先说条件。他给各堆贴上标签，再试一遍。
      example: 你把选择过程换成几张能挪动的纸条。学算者抄下结论时，还能指出它对应哪个条件。
  wallace_ternate:
    name: 来自特尔纳特的论文
    place: 特尔纳特
    figure: 阿尔弗雷德·拉塞尔·华莱士
    story: 1858 年 2 月，阿尔弗雷德·拉塞尔·华莱士在摩鹿加群岛一场疟疾稍退之后，写成一篇落款特尔纳特的论文，谈变种怎样偏离原型，寄给了查尔斯·达尔文。6 月 18 日，论文到了达尔文手里。7 月 1 日，它与达尔文的材料一同在伦敦林奈学会宣读，两位作者都不在场。
    relic: 针盒里的一只甲虫
    relic_desc: 一只收集来的甲虫，放在小锡盒里。
    points:
      p1: 先让他借住的那户人家认下，再替他把当天的标本钉好晾干
      p2: 他发烧那几天，烧好开水，换好湿布
      p3: 邮船来的那天，把论文包好防潮，送上船
    vignettes:
      places: '{staff}抄写当天鸟类标本的签条，在每张旁边写上岛名，这一抽屉皮子没有采集人在旁边也读得懂。'
      claim: 两座岛上的甲虫长得很像，{staff}把一盘甲虫分成两排，中间留出空隙，没人吩咐。
      mail: '{staff}把一封长信的稿页包进油纸，打了个双结，像水手捆海图那样。'
  hooke_london:
    name: 实验的管理人
    place: 伦敦
    figure: 罗伯特·胡克
    story: 胡克 1665 年的《显微图谱》画出了他在软木中观察到的小格。
    relic: 一幅跳蚤的图
    relic_desc: 一幅玻璃下跳蚤的精细版画。
    points:
      p1: 从胡克的图版里认出一格边界
      p2: 把软木小格和蜂房图对着看
      p3: 留时间让读者仔细描完一格
    vignettes:
      edge: 读者把每一处断开的边都补成了整格。你盖住半张图，问他哪些线还能从图上认出。再揭开时，他留了几处断线。
      analogy: 你问软木在哪儿就不像蜂房了。读者把图凑到一起，开始指两幅图哪里不同。
      plate: 读者把图凑太近，看散了整片格子。你给他腾开地方，让他往远处拿，再请他只指出其中一格。
  leavitt_cambridge_ma:
    name: 星星的一条规则
    place: 马萨诸塞州剑桥
    figure: 亨丽埃塔·勒维特
    story: 1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。
    relic: 一块玻璃底片
    relic_desc: 一块布满细小星点的照相底片。
    points:
      p1: 把图上的点对回表格
      p2: 把周期和亮度成对记下
      p3: 说明为什么在同一片星云里比较
    vignettes:
      rank: 你按周期给表格排序，发现一行丢了标号。读表人在图上的点被挪动前找回了对应的星号。
      distance: 你问近一点的星是不是光看起来就更亮。读表人把手指按在「小麦哲伦云」的标题上，你把为什么选这一组来比记在图旁。
      period: 读表人先报亮度。你再问周期，把两个数一起记，直到最后一个点也画上去。
  bessie_coleman_jacksonville:
    name: 起飞之前，她的姓名
    place: 杰克逊维尔
    figure: 贝茜·科尔曼
    story: 贝茜·科尔曼于1921年6月15日在法国取得国际飞行执照。1926年4月30日，她在杰克逊维尔帕克森机场为五一活动试飞时遇难。
    relic: 一张有日期的样张
    relic_desc: 地面告示，完整排出了科尔曼的姓名。
    points:
      p1: 告示送出去前，检查飞行员的姓名
      p2: 问跑腿人，这张告示是要送给谁看的
      p3: 跑腿人来取时，另外留一张改过的副本
    vignettes:
      proof: 安少了一行，已经把飞行员的名字裁得只剩姓。你删掉两个吹捧词，给全名腾出位置。跑腿人来取时，她请他念全名，再把样张折好。有人问谁要飞，他可以直接说出名字。
      school: 刘易斯以为围观的人只想知道几点开场。有孩子在围栏边问，这位飞行员在哪儿学的。你告诉他执照是在哪儿发的，把最后一行留给这个可以复述的事实。他取走样张时，连日期也练着念了一遍。
      ground: 场边的人越来越多，你知道明天的告示不会再写这场表演。安问是不是这会儿就发。你留一份注明日期的样张，帮她把别的送到门口。你的行程在地面结束，观众还在往这儿来。
  scott_last_camp:
    name: 冰架上的帐篷
    place: 罗斯冰架
    figure: 罗伯特·法尔肯·斯科特
    story: 斯科特日记最后一则署于 1912 年 3 月 29 日。现存手稿记录了南极点归途上的最后营地。
    relic: 一本日记
    relic_desc: 一本用铅笔写的小日记，被冻得发硬。
    points:
      p1: 在严寒里继续前进
      p2: 照顾他们当中最虚弱的人
      p3: 拉动雪橇，让日记和记录能带回家
    vignettes:
      distance: 回到事务所，虚构书记员把一个数抄进已走路程一栏。你指出那是还没走完的距离。他在抄件入档前把数移了过去。
      blank: 回到事务所，书记员念到最后一个日期停了笔。你等他想好后面的空白该怎么标。他写下「记录到此为止」，才搁下笔。
      opening: 回到事务所，你翻开练习抄本，先读日期再读内容。书记员把同一日期写上封签，下一次还能按顺序找到这一页。
  mallory_everest:
    name: 最后一次被人看见
    place: 珠穆朗玛峰
    figure: 乔治·马洛里
    story: 马洛里在 1924 年远征中留下的信件记述了不同营地的状况和计划。马洛里与欧文的结局无法证明二人是否登顶。
    relic: 一把冰镐
    relic_desc: 一把朴素的木柄冰镐，镐头磨旧了。
    points:
      p1: 在漫长的攀登路上跟上队伍
      p2: 和他们一起分享营地与计划
      p3: 陪他们爬到足够高处送他们出发
    vignettes:
      date: 虚构的送信人拿着来自两个营地的信，交接单上却只写一个日期。你请他各自看信头，两封信出发时便各带着自己的地名和日期。
      question: 送信人把预定出发念成了准会出发。你在信中说到天气的地方请他停一下。他再念这项计划时，连同那个条件一起说出来。
      wrap: 送信人在膝上分拣纸页，你替他把要带走的信封放在一旁。他可以另把营地清单收好，不用折进信里。
  fanny_mendelssohn_berlin:
    name: 用自己的名字印六首歌
    place: 柏林
    figure: 范妮·门德尔松·亨泽尔
    story: 范妮·亨泽尔的《六首歌曲》作品一号于 1846 年以她本人的名字出版。
    relic: 一页歌谱
    relic_desc: 一页手写的歌谱，署名范妮。
    points:
      p1: 把题名页跟对应的六首歌配起来
      p2: 请歌手在传阅前先核对作曲者姓名
      p3: 收谱时把题名页与正文留在一起
    vignettes:
      cover: 虚构的歌手从中间翻开乐谱，问是谁写的。你找来散开的题名页放在旁边。封面上署的名字足够确定纸套上该写什么。等你把纸理齐，第一首已经唱完。
      forward: 你刚要说后来的收藏者会怎样找这六首歌，歌手指着散开的封面，问他们还找不找得到它。你请她把封面随下一份谱一起交出去。一位读者带着它走了，再往下的去向你够不着。
      order: 你对着目录把六首排好，歌手可以直接翻到要唱的那一首。你另记下一份顺序。等门一关，屋里再响起什么，你带不走。
  camille_claudel_paris:
    name: 同一步舞，两种裙摆
    place: 巴黎
    figure: 卡米耶·克洛岱尔
    story: 卡米耶·克洛岱尔在 1889 至 1893 年间构思了《华尔兹》。克洛岱尔博物馆登记了多个版本，其中一件青铜铸件标为 1905 年，也记述她怎样改动了衣褶。
    relic: 一只青铜手
    relic_desc: 一件小小的青铜手部习作。
    points:
      p1: 从两人脚边比较衣褶转过的弧线
      p2: 请装箱人把两个版本分别挂牌
      p3: 在不挪动铸件的情况下核对底下的纸签
    vignettes:
      light: 你见过后来的博物馆陈列，直到绕着裙摆走一圈，才看见影子怎样转。装箱人正要在两张标签上写同一句，你在边角各添了一道不同的弧线。箱子要分头走，开箱的时候你一处也看不到。
      mark: 装箱人找来两张写着同一标题的纸签。趁箱盖还没合，你各补一项，衣褶收在哪儿。两项也都抄进自己的本子里。你在资料里读过的那笔大理石委托，终究没有成。
      crate: 装箱人伸手拿盖子时，你扶住包纸，没让它压上伸出的裙边。余下的纸上，你凭记忆描出一道弧。箱盖一扣，最后那一点还画得准不准，你再也对不上了。
  artemisia_florence:
    name: 学院里的第一位女性
    place: 佛罗伦萨
    figure: 阿尔泰米西娅·真蒂莱斯基
    story: 1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。
    relic: 一罐颜料
    relic_desc: 一小罐磨好的青金石蓝。
    points:
      p1: 看出手的姿势像在做什么
      p2: 帮来客认清肖像是谁画的
      p3: 把习作和各自的签条放在一起
    vignettes:
      pose: 访客面对镜子，问哪种姿势看着自然。你问两种姿势各像在做什么。他选了手还能做自己的事的那一种。
      name: 一张习作只写了画中人的描述，没留画家的名字。你把纸翻过来，请访客在收进一摞图以前把两项都写上。
      mirror: 你挪了镜子，让访客不用扭身也能看见那个角度。他试坐一回，又自己调了一点，才开始画。
  buchner_zurich:
    name: 排练桌上的两份残稿
    place: 苏黎世
    figure: 格奥尔格·毕希纳
    story: 格奥尔格·毕希纳留下未完成的《沃伊采克》。魏玛古典基金会保存并数字化了手稿残篇，其中有不同阶段的文字。
    relic: 一叠零散的场景稿
    relic_desc: 字迹局促的散页，没有固定的顺序。
    points:
      p1: 辨认练习纸各属哪一稿
      p2: 让试读的人把两种顺序都读一遍，保留每一页
      p3: 让试读本看得出文字在哪里断开
    vignettes:
      order: 试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。
      pause: 你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。
      gap: 纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。
  emily_bronte_haworth:
    name: 冬天的牧师住宅
    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。
    relic: 一条狗项圈
    relic_desc: 牧师住宅里那条大狗用过的旧皮项圈。
    points:
      p1: 找出叙述从哪里换了人
      p2: 分清叙述者亲见与听来的事
      p3: 帮另一位读者翻回原来那页
    vignettes:
      witness: 读者以为讲故事的人什么都看见了。你问有一件事她是从哪儿知道的。他把那句话往回找，找到了先说这事的人。
      voices: 读者整页只用一个声音。你请他从内莉接过话头处再念。听的人这回听得出，故事什么时候交到了另一个人手上。
      mark: 你在换人讲述处夹了块纸。读者觉得后面一段同刚才抵触，便先翻回纸签在的地方。
  lili_boulanger_paris:
    name: 桌上摊着几份声部谱
    place: 梅齐
    figure: 莉莉·布朗热
    story: 法国国家图书馆将莉莉·布朗热的《Pie Jesu》记作 1918 年罗马至梅济时期的作品，编制为人声、弦乐四重奏、竖琴和管风琴。
    relic: 一支铅笔
    relic_desc: 一支短铅笔，旁边是空白的五线谱纸。
    points:
      p1: 在总谱里找出人声那一行
      p2: 等抄谱人核完轻声进入的地方
      p3: 把标记过的分谱交给接下来要看的人
    vignettes:
      entry: 抄谱人把歌声进来的记号划在了一张器乐分谱上。你把它跟总谱并排搁好，请他指出人声那一行。他挪了一个记号。你带走写着两处位置的纸角。真正的排练在你回去之后才开始。
      visitor: 你告诉抄谱人，后来的读者会照着编制来找各声部。他另收好管风琴谱，省得有人当成多出一份声乐谱。你帮他单独系住那一叠。这两份谱合起来响是什么样，你始终没听到。
      stand: 你腾出桌面，让抄谱人把人声、弦乐四重奏、竖琴和管风琴分开放。他把竖琴谱放回该去的那一叠。你把编制抄进簿子。等谱架摆好，你站过的地方已经空了。
  qu_yuan_miluo:
    name: 江边的诗句
    place: 汨罗江
    figure: 屈原
    story: 《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。传本对话是文献中的记述。
    relic: 一片写诗的竹简
    relic_desc: 一片竹简，上面是一首长诗中的几行。
    points:
      p1: 认出文辞问答里两种声音
      p2: 听出换个人讲以后哪里变了
      p3: 把诗句和保存它的传本放在一起
    vignettes:
      two_tales: 渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。
      refrain: 故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。
      wait: 等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。
  sima_qian_changan:
    name: 受刑之后写成的史书
    place: 长安
    figure: 司马迁
    story: 《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。
    relic: 一捆竹简
    relic_desc: 用绳子编起来的竹简，每一片写着一行字。
    points:
      p1: 找出两种说法到底在哪一点相冲
      p2: 把年次的前后理清
      p3: 证据分不出时，留下看得明白的存疑说明
    vignettes:
      dates: 书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。
      witness: 书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。
      binding: 书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。
  du_fu_xiang_river:
    name: 船上的诗人
    place: 湘江
    figure: 杜甫
    story: 传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。
    relic: 一盏船灯
    relic_desc: 一盏小小的陶油灯，为了几行诗亮到很晚。
    points:
      p1: 认出一个从船上才好看清的细节
      p2: 在渡口把信拿离湿处
      p3: 帮旅人把问候送向下一个镇子
    vignettes:
      shore: 旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。
      delivery: 你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。
      damp: 旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。
  li_qingzhao_hangzhou:
    name: 失去的藏品
    place: 杭州
    figure: 李清照
    story: 李清照在《金石录后序》中回忆她与赵明诚搜求书籍金石，以及后来收藏散失的经过。
    relic: 一张古碑拓片
    relic_desc: 用墨从石头上拓下来的纸，是她和丈夫曾经收集的那种。
    points:
      p1: 分清后序里的回忆与目录条目
      p2: 把残抄翻开，保留需要核对的那页
      p3: 记下残缺处，别用猜来的字填满
    vignettes:
      trace: 读者认出题名就要翻页。你问他能不能认出所记之物。他停下来，先补抄缺行前的地名。
      missing: 清单中间空了一处，读者犹豫补什么。你用小字记清缺了什么，留着地方，等后面的人查到再填。
      book: 你把后序搁到编号的目录旁。读者开口之前在两边来回看了一遍。念出来时，那些名目像是从前真有人抱在手里、带上路的东西。
  su_shi_huangzhou:
    name: 东坡的流放
    place: 黄州
    figure: 苏轼
    story: 1079 年乌台诗案之后，苏轼被贬到黄州，在城东一块坡地上开荒种地，以地为号，称东坡。1082 年七月，他与客泛舟赤壁之下，写成《赤壁赋》；十月，他从雪堂步行回临皋，写成《后赤壁赋》。1084 年他离开黄州。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是农人在坡地上穿的那种。
    points:
      p1: 先让坡上的邻里认下，再在收成时把饭送到地头
      p2: 泛舟那夜之前，告诉船家赤壁下哪段水流平缓
      p3: 夜归那晚，在雪堂到临皋的路上守一盏灯
    vignettes:
      slope: '{staff}替雇来的帮工往坡上挑水。天黑时，一位编出来的邻里在地头放下一碗煮豆，说明天第二碗给这个外乡人。'
      lamp: '{staff}在路边的石头上坐着，手护着一盏灯挡风。三更过了很久，坡上才有脚步声下来。{staff}把灯转向小路，什么也没说。'
      ferry: '{staff}在渡口帮一位编出来的船家盘缆绳。船家说，无风的夜里崖下的水走得慢，来游的客人总要往对岸去。'
  cao_xueqin_beijing:
    name: 停在八十回的小说
    place: 北京西山
    figure: 曹雪芹
    story: 脂评本《石头记》开篇提到曹雪芹，并在小说的叙事框架里写到反复增删。书里的自述也以原文中的框架来读。
    relic: 一份手抄的章回
    relic_desc: 朋友抄下的一回，页边有红笔写的批语。
    points:
      p1: 认出开篇框架里说话的是谁
      p2: 让批语跟着它所批的那一句
      p3: 把两张散开的纸排回顺序
    vignettes:
      stone: 你问石头会不会说出是谁抄的。抄书人揭起第一页，把故事如何开头念了一遍。你把石头列在故事里，抄书人的问题另夹一签。
      margin: 同一段旁边有两种笔迹。你请抄书人在批语和所批的句子间留空。传下去的新抄件还能看见两边。
      loose: 你捏住空白边捡起散页，念出开头几个字。抄书人从纸摞里找到接得上的地方，把这一页夹回去。
  tang_xianzu_linchuan:
    name: 写爱情超越死亡的戏
    place: 临川
    figure: 汤显祖
    story: 汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。
    relic: 一册刻印的曲本
    relic_desc: 给歌者用的刻本，每支曲牌的名字写在上方。
    points:
      p1: 听出游园在何处转入梦里
      p2: 找出另一个演员靠哪一句接上
      p3: 让开走位而不中断唱腔
    vignettes:
      empty_garden: 你请演员在空台上排游园。几句之后，听的人指出想象中花开在什么地方。演员留下了让他看见那朵花的一句。
      cue: 删词连另一个演员上场的信号也删掉了。你在排练时发现，把那个字留在两人都听得到的位置，余下的删节仍能保留。
      breath: 你等演员把这一句唱完才挪椅子。这一遍，没人需要停下来解释为什么到了梦里。
  ban_zhao_luoyang:
    name: 给《汉书》表留一处待核
    place: 洛阳
    figure: 班昭
    story: 《后汉书》说，班固去世时《汉书》八表及《天文志》未完，班昭奉诏到东观藏书阁续成，后又有马续参与。
    relic: 一幅绢上的人名表
    relic_desc: 一条绢，上面是整整齐齐排列的官名与人名。
    points:
      p1: 把一行人名与供查的纸对齐
      p2: 说清那一格为何要留待另一份记录
      p3: 交给下一位看时，保留那处未核的空格
    vignettes:
      column: 抄表人把后一行的人名移进了空格。你把底册摊到旁边，指给他看这个名字原在下面一行。他把名字移回去，另标上面待核。你带回来已对齐的一行，上面的空格仍没有填。
      later: 你知道后人会把整部书放在一起读。抄表人眼下还分不清这张练习表哪行算做完。你和他用一条窄纸夹出仍待核的地方，下一位一翻就能找到。另一份底册送来前，你得收队。
      fold: 你把名字和它所在的行一同抄下，上头仍留一格。抄表人看得出这是特地留下的。你带回一份抄件，那格该写什么还要等别人来核。
  xu_xiake_lijiang:
    name: 一路脚印，一处朝向
    place: 丽江
    figure: 徐霞客
    story: 1639 年徐霞客在丽江停留，《徐霞客游记》写到山腰的解脱林，并记下它面向的景色。
    relic: 一本旅行笔记
    relic_desc: 密密麻麻的笔记，写着洞穴、河流和岩石，每天夜里写成。
    points:
      p1: 在带路人下坡前走到山腰
      p2: 在草图上区分一处面向和一段行程
      p3: 带回路线和景物记注，别抄混
    vignettes:
      view: 带路人把朝东的景色画成往东走的箭头。你先落笔画下脚停在哪里，再添一道短线标从那里看见什么。他把两种记号都留下。你一下坡，山腰那处景已经望不见了。
      trail: 带路人在解脱林说起远处的古冈。你想起徐霞客的游记也写过，他是从这里的一幅壁图得知那处景致的。你把画上看见的远山和脚下走过的路分开记，在古冈旁只留一个问号。等你收队，那条路还没走。
      slope: 你先抄地点，再抄它朝向什么。一个点留在山腰，箭头从那一点起笔，这张条子就够你回来后认出原意。再往后的游程，你没跟上。
  song_yingxing_fengxin:
    name: 一本讲万物如何造成的书
    place: 江西
    figure: 宋应星
    story: 宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。
    relic: 一页工具图
    relic_desc: 一张木刻版画，织机的每个部件都标了名。
    points:
      p1: 沿图找到纸张经过的几道工序
      p2: 找出跟工序串了位置的图注
      p3: 给工坊读者留一张干净的图样
    vignettes:
      strainer: 你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。
      drying: 读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。
      sheet: 读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。
  wang_zhenyi_jinling:
    name: 挪到桌下的那面镜
    place: 南京
    figure: 王贞仪
    story: 王贞仪在《月食解》中自述，把镜子移到圆桌下，桌面挡住了吊灯照向镜子的光。提起灯后，光又照到镜上。
    relic: 一面小圆镜
    relic_desc: 在她的月食模型里充当月亮的那面镜子。
    points:
      p1: 提灯之前，请帮工把镜子放回同一个位置
      p2: 看准镜面从暗转亮的那一次
      p3: 把灯最初和最后的位置画在同一张图上
    vignettes:
      one_change: 帮工正要把灯和镜一起抬。你请她这一遍先别动镜，只把两次灯高分别画出来。只动一样，镜上果然有了光。你把图带回去，下一次能拿它对照天色的时候还没到。
      shadow: 你知道后人能在书里读到这次演示，刚进门的帮工眼前却只有一面暗镜。你让她在提灯前后各看一次，指给她看挡在中间的桌沿。她自己就能在图上标出遮挡处。这趟看见的是屋里的现象，没有赶上真正月食。
      outline: 你在纸上画下桌沿、低处的镜子，再从灯处画出一条线。镜面一亮，你在同一页添了第二条线。两条都带回去，今夜的天空没有相应的变化可供比较。
  jianzhen_nara:
    name: 东大寺里的一层架
    place: 奈良
    figure: 鉴真
    story: 鉴真于753年离开中国，754年抵达奈良。他在东大寺传授戒律，后来才有唐招提寺。
    relic: 一张练习用的卷签
    relic_desc: 故事中的帮工使用的经卷签。
    points:
      p1: 核对经卷次序时扶稳经卷
      p2: 问帮工，哪一束是为这次读诵备下的
      p3: 帮接读的人找到从哪儿念起
    vignettes:
      sound: 千代隔着屋子指给人看，可架上摆得太满，准还是分不清她指哪束。你请她念出开头。准听着去对包纸上的字，找到那一束，给接读的人摆了出来。
      tie: 准想先把松开的包纸捆上，还没核对里面的次序。你扶着那束经卷，千代挨个念每部分的头一句。准把放错的一份放了回去。下次打开时，次序就是他们练过的那样。
      temple: 你知道759年还会有一座寺。千代只要写清明早这束经往哪里送。你帮她在包纸上写东大寺。另一座寺还在未来，这趟见不到。
  hua_tuo_xuchang:
    name: 史书提到的那一卷
    place: 许昌
    figure: 华佗
    story: 晚出的《三国志》说华佗被关入许狱，并记他试图从狱中交出一卷书而未成。
    relic: 一页练习登记簿的副本
    relic_desc: 登记副页，区分传闻与实际交接。
    points:
      p1: 问书吏是见到一卷书，还是只听说过
      p2: 关屋前帮着核一遍登记
      p3: 把听到的说法和实物交接分开记
    vignettes:
      notice: 阿瑾听说有一卷书，便写进已收物件。你请她指给你看书该搁在哪层。她把那一行移到传闻栏，架上仍留空，话是谁说的也记在旁边。
      shift: 阿长想合上登记簿，再叫下一班来。你请他先把这几行念一遍。念到没人亲见的交接，两人商量把那一栏先挂着。接手人看得见还有哪一笔没核实。
      later: 你知道后来史书会说起一卷书。阿瑾问，有没有真书从这屋交出去过。你指给她看若真有交接该记在哪儿。纸离开她的桌子时，那一栏仍空着。
  bi_sheng_printer:
    name: 陶土做的活字
    place: 杭州
    figure: 毕昇
    story: 《梦溪笔谈》记庆历年间（1041 至 1048）毕昇做泥活字，并按韵收存不用的字。
    relic: 一枚泥活字
    relic_desc: 一小块烧过的泥，上面是一个反刻的字。
    points:
      p1: 从字格里分辨放错的活字
      p2: 拆版后把活字按韵归回去
      p3: 排版前为反复用到的字备足字模
    vignettes:
      rhyme: 有个字要放错韵部。你把字念出来，帮工趁下一把字落进去之前换了签。
      surface: 帮工说淡印是墨的问题。你把印样举到眼前，请他回想哪些字原先和两旁一样高。
      duplicates: 你数一行里那个字用了几遍。字格见了底，帮工才明白，同一个字为什么要备上几枚。
  miyazawa_kenji_hanamaki:
    name: 很少有人读过的故事
    place: 花卷
    figure: 宫泽贤治
    story: 宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。
    relic: 一本口袋笔记本
    relic_desc: 一本小笔记本，里面是铅笔写的诗。
    points:
      p1: 找出读者第一次听到站名的位置
      p2: 在笔记里分清城镇和车厢
      p3: 把转换处读到听的人能跟上
    vignettes:
      call: 你在屋子那头念出站名。还没解释谁在那里，读者就抬了头。他再读时把解释往后放，先保留那一声。
      window: 读者想指出铁道从哪里通进天空。你问乔班尼先从窗里看见了什么。他把小山和车厢分别写在两张纸上。
      ticket: 读者重读转进车厢那几句时，你一直替他翻着这页。下一站还没叫名以前，他先记下眼前已经变了什么。
  higuchi_ichiyo_tokyo:
    name: 柜台上的七期《青梅竹马》
    place: 东京
    figure: 樋口一叶
    story: 樋口一叶的《青梅竹马》在 1895 年至 1896 年 1 月间于《文学界》连载，共七期。1896 年 4 月，《文艺俱乐部》一次刊出全文。书摊上的周折是分支演绎。
    relic: 一本随身日记
    relic_desc: 一本写了多年的日记，毛笔字端正。
    points:
      p1: 说服摊主把连载各期摆到一起
      p2: 认出末回所在的那一期和四月的全文刊本
      p3: 替还没回来的读者留住末回
    vignettes:
      index: 有人在一期杂志上用铅笔写了「全」。你翻到那一期的末尾，拿四月刊本一对，找到了断在何处。摊主让你夹张能取下来的纸签。你带回七期的清单，却没能问到原来的字是谁写的。
      reserve: 有位读者一期期追下来，末回还没来取。你指给摊主看，别的客人如今可以买四月的全文刊本。末回连同预留的小条一起放进柜台底下。那位读者回来以前，你先收队了。
      layout: 你把四月那期放在末回旁边。一本打开是开头，另一本默认读者已经等过前面六回。你给摊主写下区别，也给自己留了一份。最初追连载的读者，等的时间比你整趟穿越还长。
  sei_shonagon_kyoto:
    name: 从天亮前写起的清单
    place: 京都
    figure: 清少纳言
    story: 《枕草子》开篇从春日破晓写起，山际渐渐发白，天上拖着细细的紫云。
    relic: 一张折起来的清单
    relic_desc: 一张轻轻写着喜欢和不喜欢的事的单子。
    points:
      p1: 在开篇找出天色最先变在哪里
      p2: 请抄写人指出开头一段在哪里收笔
      p3: 守在门边，天亮时亲手记下一样细节
    vignettes:
      compare: 你认出后世版本的开头。抄写人念漏了山际，你问光最先从哪里出来，他把漏掉的地方补到练习纸上。你把这处订正记进折起来的清单。从这扇门望出去，山本身却被挡着。
      colour: 你印象里的紫颜料太深了。抄写人分你一张纸边，你在淡紫上压了一笔细灰。两人等纸干，再往门外望，天上已不是那个颜色。
      listen: 你在门边听抄写人念了两遍开头。破晓时你也列了一张清单，只有一样东西，院子还黑着，瓦片先白了。你叠起纸带回去。作者若读到这一条会怎么想，你没有机会问。
  kabir_maghar:
    name: 一首歌里两个地名
    place: 马格哈尔
    figure: 迦比尔
    story: 《古鲁·格兰特·萨希卜》中归于迦比尔的一首诗，提及贝拿勒斯和马格哈尔，问地点对虔敬何异。
    relic: 一把练习打拍用的梭
    relic_desc: 纪念物，用来给接唱打拍。
    points:
      p1: 留意两名歌者在哪儿想起了不同地名
      p2: 先听两人各唱完一遍，再纠正
      p3: 转唱时，让听众还能听见两个地名
    vignettes:
      towns: 帕萝从贝拿勒斯唱起，萨利姆接马格哈尔。你请他们轮流唱，别让一句压过另一句。听众听清两个地名，也听出哪里转成问句。帕萝把开头交给下一个人，仍把答句留给对方。
      beat: 帕萝还没唱完头一处，萨利姆已唱到第二个地名。你用她凳边的梭在木头上敲一下拍子。这回他等住了，开口便有人听见。唱完，帕萝把梭递给他，请他替下一个声音打拍子。
      collection: 你读过后来的传本，两个地名都在纸上。帕萝问，没来的朋友听她起第一声，会不会认得。你听她试了一遍，没替她唱后世那一版。你离开时，她的朋友还没到。
  ibn_rushd_lucena:
    name: 两行中间那一步
    place: 卢塞纳
    figure: 伊本·鲁世德
    story: 伊本·艾比·乌赛比阿的后世传记谈到曼苏尔将伊本·鲁世德放逐卢塞纳。早先的《决定论》区分论证推理和其他说理方式。
    relic: 一页读书练习摘录
    relic_desc: 摘录，为前提另留一处。
    points:
      p1: 抄结语前，请读者先说出漏掉的一步
      p2: 对照页边的两种解释
      p3: 把练习页与它所读的书放在一处
    vignettes:
      premise: 玛丽娅姆把结论抄得很工整。优素福要读通，却得先替她猜一个没写出来的前提。你问他读到哪儿卡住，在结论前留出地方。玛丽娅姆把前提写进去，优素福终于能就它发问。
      together: 优素福想把书还了，只给自己留一句。你给他留点时间，把旁边那一步也抄走。到了门口，玛丽娅姆请他复述结论，他如今也说得出理由。
      language: 你认得一个后来会在译本里出现的术语。玛丽娅姆只想核对前提有没有照原样抄下。你帮她把纸铺平，陪她查。她在边上写的问题，会交给这趟见不到的人。
  rumi_konya:
    name: 开篇是谁在说
    place: 科尼亚
    figure: 鲁米
    story: 鲁米《玛斯纳维》开篇请人听芦管诉说离别。科尼亚梅夫拉纳博物馆藏有六卷全本，抄于1278年，晚于鲁米1273年去世。
    relic: 一张起句练习稿
    relic_desc: 读书页，在起句处做了记号。
    points:
      p1: 听清从哪里轮到芦管说话
      p2: 递稿时给接读的人留好位置
      p3: 关屋前再给读者一次开口的机会
    vignettes:
      reed: 娜琳把两处用同一种声音读过去。你问，芦管从哪里开始用自己的口吻说话。她换过一口气，才念下一句。哈桑闭着眼，也听得出哪里换成了芦管。
      hand: 哈桑得离开读书凳，还没念完，娜琳手已够到那页。你按住纸角，等他把一联念完，手指落到下一行。轮到她时，她从那儿起句，一段诗从一人手里递到了另一人。
      manuscript: 你见过后来的六卷抄本。娜琳问，上面能不能看出哈桑在哪里换气。你指着刚练过的那行，让她自己定在哪里停。门关上时，他们还没念到下一联。
  ibn_al_nafis_cairo:
    name: 画在页边的路径
    place: 开罗
    figure: 伊本·纳菲斯
    story: 伊本·纳菲斯在十三世纪为伊本·西那《医典》作的解剖注释中，认为血由心脏右侧经肺到左侧，反对它直接穿过中隔的说法。
    relic: 两张解剖注释练习图
    relic_desc: 练习图，两张一并留下对照说法。
    points:
      p1: 用学生正在读的一段核对图
      p2: 另描新图时，把旧轮廓留在手边
      p3: 帮接手的人认出两条画出的路径
    vignettes:
      trace: 哈桑一笔穿过练习图正中。萨尔玛点了点自己刚读的一行。你请他照她读的内容再划一遍。他重画路线，让它经过肺，并标清早先一笔对应另一种说法。
      layer: 萨尔玛准备擦掉旧轮廓，桌上只留下一个讲法。你在底下垫一张干净的纸，让哈桑把第二条路线描在那里。新读者可以把两张叠看，自己问哪里变了。
      name: 你知道后世怎样称呼血液走的这一程。哈桑问的是注释到底在哪儿提出异议。你框住那句，让他照原文查。图已经带出屋子，老师是否认可，你走前还听不到。
  al_khwarizmi_baghdad:
    name: 代数背后的那个人
    place: 巴格达
    figure: 花拉子米
    story: 花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。
    relic: 一张演算过的方程
    relic_desc: 一张逐步解出平方与根的演算纸。
    points:
      p1: 沿着算例一步步做下去
      p2: 用学算者自己的例子说明一步变化
      p3: 把结果放回原题核对
    vignettes:
      balance: 你请学算者把两边各做了什么都说出来。他还没算到答案就停了下来。刚才最糊涂的那一步，这回他讲得最清楚。
      tiles: 学算者照着念，你把几块方片摆在桌上。念到绕口处，剩下的形状正好让人看出还缺哪一块。
      check: 学算者做完后，你把第一行留在眼前。他把答案放回去念了一遍，看看两边的数是否还相等。
  ibn_khaldun_cairo:
    name: 城门开了多久
    place: 开罗
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦 1382 年应苏丹巴尔库克之邀来到开罗，1384 年任马立克派首席法官，同年妻女在亚历山大港外沉船遇难。1401 年初，他在大马士革城外见到帖木儿。1406 年 3 月 17 日他在开罗去世，葬在胜利门外。他在《历史绪论》中提出，史家要用所写社会中可能发生的事情检验传闻。
    relic: 一页核对过的记录
    relic_desc: 一页队伍经过的记录，页边写着看的人当时站在哪里。
    points:
      p1: 先让法庭的书吏认下，再替他们誊清当天的判词
      p2: 有人报来一群人数时，问他站在哪里、城门开了多久
      p3: 出殡那天，跟着灵床走到胜利门外
    vignettes:
      gate: '{staff}问一位编出来的书吏，人群过城门时门开了多久。书吏把时辰写在总数旁的页边，又把总数改成了估算。'
      two: 另一位编出来的见证人站在街对面。{staff}给她另腾一页纸，她说的那段街景就不必挤在书吏那张纸的边上了。
      copy: '{staff}替法庭里一个学生抄了一页《历史绪论》，行与行之间留出一指宽，给学生以后写批注。'
  taqi_al_din_istanbul:
    name: 天文台里的两声报码
    place: 伊斯坦布尔
    figure: 塔基·丁
    story: 塔基丁的伊斯坦布尔天文台在1580年1月被拆除前进行过观测。档案研究列出的仪器包括象限仪和机械钟。
    relic: 一张订正对照纸
    relic_desc: 天文台记录副页，保存了原行与订正。
    points:
      p1: 一人记时的时候，帮另一人稳住练习观测
      p2: 核实角度与时刻是不是同一声报出来的
      p3: 请记录员把墨污那行和订正一起留下
    vignettes:
      clock: 哈桑读角度，莱拉抄钟上的时刻。她没听到第二次报码，下一行沿用了前一行的角度。你请两人一先一后再报一遍，他们把订正并排写在原记录旁，下一个人翻到这里就能找到。
      copy: 装订好的记录簿要送下楼，哈桑在台边还得查那次订正。你请莱拉把旧行和改行一起抄在一张纸上，注明先读的是哪一行。簿子送走后，台边还查得到这次改动的来路。
      closure: 你知道这座建筑剩下的时间已经很短。哈桑停在没有配时刻的角度上。你问他合上窗板前还能查出什么。他圈出一处空格。你走时，没再看见这间屋做下一次观测。
  ahmed_baba_timbuktu:
    name: 给补编留一个名字
    place: 廷巴克图
    figure: 艾哈迈德·巴巴
    story: 1591 年摩洛哥军队攻下廷巴克图。学者艾哈迈德·巴巴被指抗拒苏丹，1594 年被押往马拉喀什，在那里编写人物辞书，补伊本·法尔洪的旧作。1608 年他获准回到廷巴克图，1627 年 4 月 22 日在那里去世。
    relic: 一部皮面手稿
    relic_desc: 一部手稿，皮面磨旧了，带一片护舌。
    points:
      p1: 先让学者家里的人认下，再帮着把书一卷一卷登记
      p2: 押走之前，把几卷书托给城里一户人家收着
      p3: 押走那天，记下日子和去的路，留给他的家人
    vignettes:
      same_name: '{staff}发现两卷书里同一个名字有两种写法，没有挑一种，两种都记在单子上，中间画了个记号。'
      courtyard: 雨季过后，{staff}把书摊在院子的阴凉里晾，正午翻一次，让封皮干得匀。
      slip: '{staff}在窄纸条上写下每卷的书名和头一行，塞在皮面的护舌底下，不用打开也叫得出是哪本书。'
  terence_rome:
    name: 留不住的观众
    place: 罗马
    figure: 泰伦提乌斯
    story: 泰伦提乌斯的《婆母》序言回顾演出受扰的经过，先提拳击和走绳的吸引力，再写角斗表演的消息引得人群涌来。
    relic: 一副喜剧面具
    relic_desc: 一副亚麻面具，眉毛高挑，演员戴的。
    points:
      p1: 请几个路过的人听完一来一回两句台词
      p2: 找出门口一吵就会听漏的那句
      p3: 守住排练场的入口，直到最后一句
    vignettes:
      warning: 你告诉虚构的舞台帮工，两千年后还有人读到观众离场这件事。他问后人知不知道观众走时演员说到哪儿。你留下听排练，记下最后一句听清的话。排练结束时比开头多了你这一个听众，正式演出还没到。
      audibility: 你靠门听，听清了一句，却漏掉了接它的那句。帮工挪了一条长凳，请你再听一遍。这回你把两句都听到了。你带回画着长凳两个位置的草图。等你退到街上，末尾的话已被街声盖住。
      bench: 你帮舞台帮工把一条长凳从门口挪开。来迟的人终于能坐下，不用叫整排人都站起来。你在木片上记下空出来的地方。临走时，门里还传着排练的声音。
  mohenjo_daro_indus:
    name: 印面和印痕，朝向各一张
    place: 摩亨佐·达罗
    figure: 印度河流域的居民
    story: 摩亨佐－达罗有刻着印度河符号的印章出土。印痕与刻制印面方向相反。
    relic: 一块练习印痕
    relic_desc: 用带不对称纹样的练习印压出的小样。
    points:
      p1: 辨出哪一张描的是印痕
      p2: 帮工提起练习印时，稳住底面
      p3: 请帮工口头说明标签，同时保留草图
    vignettes:
      mirror: 帮工把刻面抄进纸上，却当成了印痕。你放上一份新印的练习件，发现小缺口落在另一侧。他在纸签上重写了标签。你留下两面图，能说明一个记号朝哪儿，却没读出一句古文字。
      lift: 你见过馆里把印章和印痕并列的图。工台上，帮工在抬印前想辨清手里是哪个面。你请他等提起后再动两边的标签。对照留给他，第三回试印你没等到。
      pair: 你在一幅图下注「刻面」，另一幅下注「印痕」。帮工可以直接取对的那幅。你带回小小的练习印痕，真的符号仍然读不出。
  knossos_linear_a:
    name: 辨不清的一划，先记在页边
    place: 克诺索斯
    figure: 米诺斯的书吏
    story: INSCRIBE 项目登记克诺索斯出土的 KN 1 为线形文字 A 泥板。线形文字 A 仍未被读通。
    relic: 一块泥板
    relic_desc: 一块扁平的泥板，上面是一行行符号和表示数目的小记号。
    points:
      p1: 稳住练习抄板，核对一处辨不清的笔划
      p2: 观察换一个照光方向后，那一划还像不像字
      p3: 让翻译芯片帮忙对照帮工口述的标签
    vignettes:
      stroke: 仓房帮工把一道刮痕也抄进了那行记号里。你换个角度照光，把这道划痕另描在字列外，回头还能复核。你带回两幅图的区别，板上的话仍没翻出来。
      heard: 你知道以后这套文字不好读。帮工报了一只练习托盘里有什么。你把他口头报的标签另记一张，与目见的笔划分开。收队时你说得清货名是谁告诉你的，却还不能把它配进任何真实铭文。
      margin: 你先抄看清的笔划，再在边上用一点标出那处犹疑。下一位知道要重看哪里。归来只带那一个点的草图，把猜的字都留在台边。
  antikythera_rhodes:
    name: 没有留下匠人姓名的机器
    place: 罗得岛
    figure: 不知名的匠人
    story: 安提基特拉沉船出水的齿轮装置残片保留了对应天文周期的刻度和铭文。
    relic: 一枚青铜齿轮
    relic_desc: 一个带齿的小轮，因年久而发绿。
    points:
      p1: 认出练习盘上标着的那圈刻度
      p2: 分清不同圈上对应的两个周期
      p3: 让下一个读者把铭文对回刻度盘
    vignettes:
      rings: 来客嘴里念外圈的标记，手却指向了内圈。你让他转一下练习盘，只跟其中一圈走，这回他沿着同一圈念到了底。
      calendar: 一根指针回转得比来客料想的快。你问他原先数的是哪一个周期。他另画了一行，没有把两个周期挤在同一栏下。
      legend: 你给指针和它所指的位置分别做记号。来客再念一遍标签，两处终于没被叫成同一个名字。
  sappho_lesbos:
    name: 下一口气之前
    place: 米蒂利尼
    figure: 萨福
    story: 大英图书馆藏有一片晚出许多世纪的纸莎草，上面留着一首归于萨福、写及兄长的诗的部分文字。残片提供了部分题材，缺失的诗句和歌声依然无从听见。
    relic: 一片习唱用的纸莎草
    relic_desc: 习唱中的道具，标过一处换气。
    points:
      p1: 找出听者在哪里停下来换气
      p2: 熄灯前再给犹豫的人一次起唱的机会
      p3: 把没听清的字和能跟上的声音分开
    vignettes:
      breath: 菲勒把词全串成一行，念到一半总要换气。她一停，你就在桌上轻敲一下。她记住那处停顿，又试了一遍。几个世纪后还会有残存的字迹，你听见的这口气，却留不进残片里。
      repeat: 米尔托两次张嘴，都没唱出声。菲勒已经要把灯拿走。你在米尔托身边敲出开头一拍，她终于唱了进来。有一行，桌边有两个人的声音。她今天来，就是为了跟上这一行。
      blank: 有人问，唱到你记得的那几句以后，归来的兄长又做了什么。你原可以当场接一个结尾。你只在记忆断掉的地方做了记号。灯灭时，那一段空处依然留着。
  aristarchus_alexandria:
    name: 纸上的三度差
    place: 亚历山大
    figure: 阿利斯塔克斯
    story: 阿里斯塔克斯在《论日月的大小与距离》中，取半月时所见日月夹角比直角少三度。第七命题由此推得日地距离介于月地距离的十八与二十倍之间。
    relic: 一块日晷板
    relic_desc: 一块青铜板，刻着时辰和节气的线。
    points:
      p1: 描三角形前先辨清观测者所在的角
      p2: 对照完成前，让两条视线一直留在同一张纸上
      p3: 说清结果的哪一处依赖所取的角度
    vignettes:
      angle: 学算人把观测者所在的角画成了直角。你标出望向半月和太阳的两条线，在这个角上补回差的三度。图与它用的前提终于对上。你两样都记走，却不能把它们当成今天量得的距离。
      limit: 你知道夹角越接近直角，那一点估计就越要紧。学算人问他只挪一道线，怎么答案就变了。你另画一张，先前那张也留着。还没能把图拿去跟天象对照，你便收队。
      page: 你把前提写在结果旁才折纸。学算人还能看出这个估计从哪一笔起。你自己的副本留好了角度，下一回半月却没留下实测。
  hipparchus_rhodes:
    name: 星群的四处边界
    place: 罗得岛
    figure: 喜帕恰斯
    story: 《阶梯抄本》的多光谱影像显出被擦去的希腊天文文字，其中有北冕座范围的数值。2022 年有研究将这一段归于喜帕恰斯星表，但归属仍有讨论。
    relic: 一只青铜浑仪环
    relic_desc: 一只带刻度的环，用来量星的位置。
    points:
      p1: 在练习图上找出所标的星群边界
      p2: 对照标记时，把两个方向分开
      p3: 把范围和用来界定它的星一同抄下
    vignettes:
      edges: 观察帮工用最亮的那点当边界。你指给他看，同一方向还有个暗些的点伸得更远。他挪一格边界，在页边记下所取的那颗。你把订正带回去，整部星表究竟会由谁写定，这张图答不出。
      copy: 你想起后世能拿来对照的边界数只剩几处。帮工写了一个跨度，却漏写沿哪个方向量。等他重报数字前，你先补上是哪一轴。副本上这两项都齐了，你走时另一轴还没核。
      outline: 观察帮工收纸前，你把标出的跨度两端抄好。草图移了，他还能再标出范围。你带回来两个刻记和一个方向，下一组星还没开始标。
  heron_alexandria:
    name: 门的第二个动作
    place: 亚历山大
    figure: 希罗
    story: 亚历山大的希罗在《气动装置》中描述一种点火时开启、熄火后关闭的门。书留下的是设计。
    relic: 标过的模型门槛
    relic_desc: 工坊的模型零件，在门曾蹭到的位置留了一道刻痕。
    points:
      p1: 扶稳模型门框，让门做完开合
      p2: 请等候的客人留下来看门关回去
      p3: 盯住会动的门槛，标出回程卡住的地方
    vignettes:
      threshold: 尼卡诺尔把模型架上台，门往回收时差一指宽闭合。你标出摩擦的地方。模型底下卡了片扁豆皮，他把它扫出来。门终于关严，他请你留住记号，好叫他下次认得出这处。
      audience: 贝勒尼刻看见门往外打开，已经去拿披风。你请她再等一会儿，盯紧远侧的边。门回来时，她看见尼卡诺尔漏掉的一线亮光。他把模型留在台上再试一次，没急着交货。
      future: 你可以告诉尼卡诺尔，后世读者会把这几页同机器的图画摆在一起。他正等模型门咔哒一响，轻轻落定。你跟他一起听。离开时，他正叫客人回来看她错过的那一下。
  pliny_stabiae:
    name: 斯塔比亚的逆风
    place: 斯塔比亚
    figure: 老普林尼
    story: 公元79年火山喷发时，老普林尼抵达斯塔比亚，找到庞波尼安努斯。小普林尼后来写信告诉塔西佗，送舅舅进来的风也让装好东西的船无法离港。
    relic: 一块蜡板
    relic_desc: 一块涂蜡的木板，用尖笔划出笔记。
    points:
      p1: 看出船已经装好和船已经出港的区别
      p2: 留在屋里，记着每间屋有谁
      p3: 靠装备帮忙，去接回拿名单的搬运工
    vignettes:
      wind: 克里斯普斯把搬上船的木箱全记成了已离开。你们从门边看见第一位来客肩上带灰走进来，装好东西的船却还看得见。克里斯普斯划掉了已离开几个字，请你给下一位进门的人在蜡板上留一行。
      lantern: 灯快熄了，普丽玛只来得及穿过屋子一次。你替她守在门边，她点数还能看见的人。先看不清的是蜡板，她大声念出最后两个名字，你一个个应回去。
      letter: 你记得多年后寄出的那封信。普丽玛问的却是拿名单的人，那封信里找不到他的名字。你把知道的明早结局搁在一旁，帮她点完人。离开时，还能听到有人沿走廊走过来。
  galen_rome:
    name: 火后还在的书名
    place: 罗马
    figure: 盖伦
    story: 盖伦在《论免于忧苦》中叙述罗马192年火灾给自己的藏书和物品带来的损失，也叙说哪些书在他看来已经无从补回。
    relic: 一页书目
    relic_desc: 书目，有个书名依然可读，存卷一栏留空。
    points:
      p1: 分清书目里还记着的标题和桌上实际有的卷册
      p2: 等管册人离开烟气后，陪她重新清点
      p3: 给书名画上失落记号前，先问问是否还有抄本
    vignettes:
      list: 特尔提娅念了三个书名，就记下有三卷。你请她在桌上一本本摸到相应的卷，只摸到两卷。你们把第三个书名留着，在存卷一栏做了个空记。
      borrow: 狄翁记得借出过一份，却想不起借给了谁。特尔提娅想趁清单还没送走，把书名划掉。你帮他想起交书的那扇门。她在清单里留了一处空位，等那条街传来回话。
      survival: 你读过一部写这场损失的书，传本在很久以后才重新被认出来。狄翁只问，明天桌上能放哪本。你留着书目里的名字，把现有两卷指给他看。你走时，还没找到缺掉的那卷。
  ovid_tomis:
    name: 诗与空着的一行
    place: 托米
    figure: 奥维德
    story: 奥维德在《哀歌》第二卷把获罪的缘由写成一首诗和一个过失，接着避谈那个过失。
    relic: 一块写字蜡板
    relic_desc: 一块板，上面是流放路上起笔的诗体书信。
    points:
      p1: 在行人回来前按顺序看住抄好的诗页
      p2: 圈出作者避谈过失的那一段
      p3: 封包前用翻译芯片核对拉丁文
    vignettes:
      rumor: 你告诉捎信人，几个世纪以后还有人追问那个过失。他指指抄本空出来的地方，问该写些什么。你把目的地添在封套上，把空处留在正文里。人带着这份说不清的稿子走了。
      verify: 捎信人记得一个多了人名的版本。你请他指出是哪张纸上的。他能指出那首诗和那个过失，往后便指不出什么了。你在自己的蜡板上记下断在这里。抄本启程时，你仍然没得到那个名字。
      wrap: 捎信人伸手时，风掀起外面一页。你给散页编上号，照原样收好。蜡板上只给自己留了一句提醒，那行没解释的照原样抄。收信人读到这里是什么反应，你没能看见。
  empedocles_akragas:
    name: 合唱从哪句分开
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒的诗歌残篇写到四根，以及爱与争引起的聚合和分离。远在后世，第欧根尼·拉尔修收录了互相矛盾的死因传说。
    relic: 一片诗稿
    relic_desc: 排练用的纸莎草条，在诗句的两处转折做过记号。
    points:
      p1: 标出哪几行写聚合，哪几行写分离
      p2: 腾屋之前，商量好谁先念
      p3: 赢得两位诵读者信任，带走排练用的提示片
    vignettes:
      cue: 法翁只记住声音最高的一句，结果两个人同时起了头。你在意思转折的两处做记号。到头一处，两人把凳子挪近，到了第二处，各退一步。这回面朝门的读者不用看稿，也知道念到哪儿。
      handoff: 埃瑞涅能念到第二段，却总是一下跳到末尾。法翁说他一个人念完算了。你请她给第一个提示，让法翁在屋子另一边接腔。喊开饭时，收住这一遍的是她，终于没有半途离开。
      sandal: 法翁问后人会记住哪个故事。你差点说起后来那则埃特纳传说里的铜鞋。他想要的是明天还能练的一句。你收住铜鞋的话，陪他把没念完的那段再走一遍。再想去找埃瑞涅，凳子已经叠起来了。
  democritus_abdera:
    name: 两块陶片之间
    place: 阿布德拉
    figure: 德谟克利特
    story: 亚里士多德《形而上学》把实与虚空、形状与次序及方位等观点归于留基伯和德谟克利特，并拿字母作比。
    relic: 两块字母陶片
    relic_desc: 习作中用来比较次序的两件道具。
    points:
      p1: 不动字形，只交换两块陶片的次序
      p2: 换一只留出空位的托盘再排一遍
      p3: 陶片装回袋前，抄下两种排法
    vignettes:
      order: 欧克勒斯摆出形状各异的陶片，把每种变化都叫变形。你只交换阿尔法和纽的位置。他照样叫得出每一块的名字，陶片也还嵌得进原来的轮廓，抄出来的一行却变了。
      gap: 多丽丝把窄盘塞得满满的，想少跑一趟。你请她先放一片在桌上，再让别的陶片顺着腾出的空格滑过去。第二趟她特意保留一格。这个空位如今也是演示的一部分。
      atom: 你开口讲后世实验室里什么叫原子。欧克勒斯问，这个词能不能解释那行陶片为什么读起来变了。你擦掉题外话，帮他画下陶片的次序。多丽丝已把托盘收走，最后那个角度来不及再核对一次。
  hildegard_bingen:
    name: 没唱出声的开头
    place: 宾根
    figure: 宾根的希尔德加德
    story: 希尔德加德致美因茨教长的信，抗议当局因安葬争议限制修院礼仪。美因茨文书目录还收有1179年关乎这一争议的另一封信。
    relic: 一页圣咏练习稿
    relic_desc: 练习页，一根夹线标明起句。
    points:
      p1: 依练习纸上的记号辨认第一句
      p2: 得到同意，把磨损的纸与另一份抄本对照
      p3: 帮接手的人从谱上找到起句，暂且不唱出声
    vignettes:
      opening: 阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。
      wait: 阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。
      return: 你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。
  nezahualcoyotl_texcoco:
    name: 歌旁写着的名字
    place: 特斯科科
    figure: 内萨瓦尔科约特尔
    story: 内萨瓦尔科约特尔统治特斯科科至1472年。晚出的纳瓦特尔语歌集保留了与他有关的歌。整理者区分歌词里说出的名字和另行写下的归属。
    relic: 一张接唱提示纸
    relic_desc: 接唱纸，分开给两种名字留了位置。
    points:
      p1: 找出名字是在唱词里，还是歌者另记的
      p2: 歌者轮唱时，按次序留好练习页
      p3: 帮接手的学徒分清歌中借用的声音和归属
    vignettes:
      voice: 西特拉莉唱到以我开头的一句，有位歌者走上前来。她问，练习纸上该记歌者的名，还是歌里念的名。你帮她各留一处。再次唱起时，上前的人知道从哪里接唱。
      drum: 托奇特利看见头一位歌者坐着时压得住纸，一起身，纸就滑乱了。你挪一条边角纸作记号，两页都留在接唱人够得着的地方。第二个人按时开口，屋里没人隔着老远喊名字。
      later: 你读过后来的纳瓦特尔语歌集，有时名字就出现在歌词里。西特拉莉问，这一句是谁传给她的。你记下她亲耳听过的歌者。等到后来的歌集收成，这屋里的人都已不在。
  maya_codices_mani:
    name: 记住书页怎样折
    place: 马尼
    figure: 玛雅书吏
    story: 1562年7月12日，迭戈·德·兰达主持的马尼宗教审判仪式焚毁了玛雅书籍和宗教物件。兰达自己后来也写到毁书。玛雅社群与知识仍在延续，也有玛雅抄本存世。
    relic: 一张空白练习折页
    relic_desc: 守书人自愿交给员工的练习折页。
    points:
      p1: 练习折页收起前，看清守书人指出的位置
      p2: 留下再听一遍遗失那折的讲法
      p3: 取得守书人信任，只带走对方愿意交给你的练习纸
    vignettes:
      fold: 守书人把两张空折页放在凳上，问邻居记得那本书从哪一折先打开。你扶住纸，让他们比对。他说不准第二折在哪里。她把第一折收好，第二折不合上，等下次两人再谈。
      listen: 邻居说起守书人记不清的那段，两人记得的次序却不一样。你听他们各自讲完。他们同意第一折，第二折先不定。守书人请你把两种说法都在的那份留给她。
      survive: 你在后世馆藏里看过一部存世玛雅抄本。守书人问，你能不能说出邻居记的是哪一本。你能说出藏在哪儿，却对不上这一屋人记得的页。她给你一张空白练习折页带走。那本书留在了他们的讲述里。
  rongorongo_rapa_nui:
    name: 翻页之前给这面做一记
    place: 拉帕努伊岛
    figure: 拉帕努伊人
    story: 澳大利亚博物馆记载，拉帕努伊的 kōhau roŋoroŋo 是在木面刻记号的传统。存世实物很少，学界仍未能系统释读。
    relic: 两幅朝向习作
    relic_desc: 各在上缘做了一记的练习图。
    points:
      p1: 给每幅习作各留一个朝向标记
      p2: 帮工转板时保住第一张图的位置
      p3: 把口述标签与对应的草图核对
    vignettes:
      orientation: 帮工把练习板转过来，误拿第二张当第一张。你先在纸上补一支小箭头，才对照两幅。下回照着箭头能复核方向。你带走这个练习，却还读不出任何真实铭文。
      label: 你知道后人会问实物当时怎样摆。帮工告诉你他从哪一边画的，你把这句话另记一张，与图分开。走时能确定站位，仍没给刻写的记号猜一个意思。
      copies: 合起两张纸前，你各在上边做个记号。帮工照记号转回你原来看的方向。你带回两张习作图，启发这道练习的真正文字仍在纸外。
  dunhuang_library_cave:
    name: 两种卷子，一张夹签
    place: 莫高窟
    figure: 敦煌的僧人
    story: 莫高窟第 17 窟藏有写本、印本和绘画。其中一件《金刚经》印本卷末有 868 年的题记。这个日期是卷子的制作纪年，不能据以确定封窟的原因或确切年份。
    relic: 一卷卷轴
    relic_desc: 一卷纸，上面用稳当的字抄着一部经。
    points:
      p1: 给每捆练习卷各留一张可取下的签
      p2: 在标签写年份前先核对卷末题记
      p3: 交接时让纸签副本跟对卷子
    vignettes:
      date: 理卷人把年份写到「何时收起」的格里。你请他指明日期出自哪里。那是印本卷尾的一行。他把年份挪到记录卷子的那一行。屋子何时闭上的，笔记里仍然没有。
      types: 你知道以后有人会在这里找到手写的也找到印出来的。理卷人给两卷练习件都写「抄本」。你给两种字迹各做一张能取下的纸签。收队时，这两捆卷子还在等入窟。
      twine: 你等理卷人扎好两捆，又把纸签抄到自己的纸上。两张签能认出不同的卷子。报告留了一行给你亲眼所见，至于窟为何被封，还有一处空白。
  nalanda_library:
    name: 给下堂课留个叶码
    place: 那烂陀
    figure: 那烂陀的僧人
    story: 那烂陀大寺遗址留有居住与教学建筑，见证长期讲学。
    relic: 一张课签
    relic_desc: 读书记，用叶码标好该从哪处接着读。
    points:
      p1: 在练习叶束里找到上一位读到哪儿
      p2: 交出叶束前抄下所用叶码
      p3: 在课签上分开记两个相近的位置
    vignettes:
      number: 读书人只靠上堂最后一个字找页。你对了两片练习叶，发现两处都有那个字。他这才在签上补一个叶码。下一位可以翻到对的位置。出处能查回去了，你却赶不上下一堂。
      later: 你知道以后还有旅人写到在这里求学。读书人问叶束交到别人手里时，该怎样让他接着读。你另做一张签，把位置写全，哪怕下一个人没听过今天这一段也能找回。叶束交出去了，你没听到下一个人读。
      tie: 叶束系起前，你先记好新课前面是哪一叶。你把课签放在外绳下，下一位先看到的是它。你留了一份抄件。后面会读到什么，正想着，人已经要回去了。
  meroitic_meroe:
    name: 把两组符号分开的点
    place: 麦罗埃
    figure: 麦罗埃的书吏
    story: 麦罗埃文字有草写体与象形体。草写铭文可以用竖排的小点作分隔。不少符号的读音已为研究者所知，语言仍有难以解释之处。
    relic: 一张分组习作
    relic_desc: 两组练习记号，分隔点清楚可见。
    points:
      p1: 抄整行以前先找出分隔记号
      p2: 在副本上记下原图的方向
      p3: 把口述说明和练习上的记号对照
    vignettes:
      dots: 抄写人往窄纸上转写时，把两组记号接成一组。你指着练习行上竖排的小点，把分隔放回原位。两组现在还能各自核对。你带走副本，整行的意思仍没弄明白。
      direction: 你知道后来的读者有时认得一处记号，却解释不了一句。抄写人问从哪边起，你在右端行外添一支箭头，与原行分开。等你走后，方向还认得清。
      margin: 你抄完一组，保留那几个点，再给下一组留地方。抄写人接过来，还能看出两组没有连在一处。你带回分列的形状，下一堂没有赶上。
  tupaia_tahiti:
    name: 领航者的海图
    place: 塔希提
    figure: 图帕亚
    story: 1769 年，图帕亚在塔希提登上奋进号。新南威尔士州立图书馆展示了一幅据图帕亚地理知识绘成的南太平洋海图的传世抄本。
    relic: 一张岛屿草图
    relic_desc: 一张墨与淡彩的纸，画着小小的岛形和名字。
    points:
      p1: 在航程中挤着住那间小舱
      p2: 看他画那幅群岛海图
      p3: 向他学岛的名字
    vignettes:
      pronounce: 虚构的抄图人以为两种拼法是两座岛。你请他先把两个名字念出来，再决定画不画新岛。他在名字旁留了个问号，等熟悉的人来核对。
      route: 抄图人拿笔要在两个记号间拉道直线。你问刚才说方位时是从哪座岛算起的。他抬起笔，把这个方位留在原先那段说法旁。
      room: 抄图人写下一个名字时，你压住卷起的纸角。他挪开手，好让下一个名字落笔时不盖住上一个。
  heo_nanseolheon_hanyang:
    name: 装着散诗的纸套
    place: 汉阳
    figure: 许兰雪轩
    story: 许兰雪轩去世后，弟弟许筠整理了她留存的作品，现存刊本中有 1608 年的朝鲜木刻本。
    relic: 一页诗稿
    relic_desc: 一页细纸，用毛笔写着写花和远方的诗。
    points:
      p1: 核对两张散诗页的署名和标题
      p2: 把练抄的稿纸与原来那叠分开
      p3: 把题头跟诗一道誊下
    vignettes:
      binding: 抄写人把练笔的纸夹在其他页里。你对过两个题头，另折了一个纸套装练抄稿。还有一页看不准，留散着让他再查。哪首诗最后印进了书，你在这趟看不到。
      name: 你知道有些诗以后会传到离这户人家很远的地方。抄写人要递出去一张没题头的练抄稿，你请他把题头一同誊下。送出门的纸多了一张带署名的。你用空白纸条夹住自己读到的位置，木刻本还要等许多年。
      fold: 你把散页套起来，没让折痕压到字，再在多出的纸套上标记有一页还缺题目。带走的是这条提醒，诗页留在屋里。你离开以后，那部诗集才会编成。
  ghalib_delhi:
    name: 先听见韵脚，再去翻诗集
    place: 德里
    figure: 迦利布
    story: 这趟去德里时，迦利布的乌尔都语诗集已于 1841 年刊印。读者可以按加扎勒的韵脚、叠句结尾来翻找。
    relic: 一页格扎勒诗稿
    relic_desc: 一页他亲笔写的乌尔都语诗，有修改的痕迹。
    points:
      p1: 请卖书人拿刊本核对一句只记得结尾的诗
      p2: 把叠句结尾和页码记在同一张条上
      p3: 等读者再念一遍结尾，才把条子夹回书里
    vignettes:
      refrain: 卖书人记得诗里的意象，却一直翻错地方。你问他反复听到的是什么词。他念出结尾，你才在刊本里翻到对应的一组。你记下一个页码。最早把这一句念进店里的人是谁，他仍说不上来。
      future: 你告诉卖书人，以后的读者会把几个版本摆在一起对。他问那能不能帮他找到今天这一句。你在他的条子上补了版本年份，又标出结尾。等他有另一本可核对时，你已经走了。
      listen: 你把结尾念给卖书人听，念到两个人都认得。他把条子夹进书里对应的一段。你能带回记得住的那几个字，整句却已经有些想不起来了。
  savitribai_phule_pune:
    name: 包里多带的一件纱丽
    place: 浦那
    figure: 萨维特丽巴伊·普勒
    story: 1848 年 1 月，萨维特丽巴伊·普勒、乔蒂拉奥·普勒和萨古娜拜在浦那塔蒂亚萨赫布·比德的宅子里开办女子学校。去学校的路上常有人朝她扔石头和粪，她包里多带一件纱丽，到学校再换上。1852 年的记录写她是普勒夫妇办的第一所女校的校长。1897 年 3 月 10 日，她在照顾病人时染上鼠疫去世。
    relic: 一块石板
    relic_desc: 一块小石板，上面用粉笔写着第一排字母。
    points:
      p1: 先让比德府这户人家认下，再每天早上扫好屋子、摆好石板
      p2: 陪她走到学校，替她拎着装纱丽的那只包
      p3: 陪一个女孩坐到她能写出自己的名字，留给家里人看
    vignettes:
      slate: '{staff}把石板横过来，让两个女孩同时够得着。喊她们回家时，两人都留了一道笔迹，彼此都指得出是谁写的。'
      road: 去布德瓦尔区的路上，{staff}落后半步跟着，把包拎在背对门口的那一侧。那天早上，街上没人说话。
      chalk: '{staff}把最后一支粉笔掰成两截，一截给黑板，一截给石板，又记下要去集市上买的东西。'
  zhu_shijie_yangzhou:
    name: 算板四方各有一元
    place: 扬州
    figure: 朱世杰
    story: 莫若在朱世杰《四元玉鉴》前序里说明四元怎样围着中央摆放：天元在下，地元在左，人元在右，物元在上。序作于 1303 年。
    relic: 一套算筹
    relic_desc: 一根根细棍，排成行来代表数。
    points:
      p1: 添算式前先认清四元的位置
      p2: 让另一位学算人看出哪两组放反了
      p3: 收筹前把方向标记抄到副本上
    vignettes:
      rotate: 两位学算人从算板两侧各抄了一份。你先标出从哪边算作下，再把两张摆在一起。有一张把地元和人元挪回正确位置。你抄走订正的图，还没轮到做那串长长的消元。
      hand: 你问学算人为什么四个名都写在一排。他说这样背得住。你让原来那行留着，另绕中央摆四个记号，好叫他也记得位置。等他收筹，你只看见了起手，还没看到题怎样算完。
      outline: 筹入盒前，你绕着中央画了四条短线，再记哪一端是下。回来时你还摆得出这个布局。大题留在学算人的板上。
  xuanzang_changan:
    name: 从西域带回的六百多部经
    place: 长安
    figure: 玄奘
    story: 《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。
    relic: 一片贝叶经
    relic_desc: 一片写着梵文的贝叶，边缘已经发黑。
    points:
      p1: 把两项数各自对回单位
      p2: 交接时别让东西串了堆
      p3: 给书吏腾出桌面和纸，写完清单
    vignettes:
      totals: 书吏把夹数抄进了部数那栏。封好新抄之前，你指明两个单位。没有一夹需要挪动，两份数却对上了。
      names: 你看着两个签上的名目很像。书吏念给你听，趁经夹还没搬走，请你把不同的几个字另抄下来。
      space: 你给书吏腾出地方，一次只摊开一夹。搬来最后一摞的人终于能搁下东西，不压住清单。
  jia_sixie_gaoyang:
    name: 高田低田，各写一行
    place: 山东高阳
    figure: 贾思勰
    story: 贾思勰《齐民要术》卷一谈高田、低田怎样耕，提到土壤燥湿需合宜。
    relic: 一卷农书
    relic_desc: 一卷手抄的农书，页边留着下田时记的字。
    points:
      p1: 分别看看两块地的土况
      p2: 挪犁前走一趟低田
      p3: 请农人在第一条旁另记一笔所见
    vignettes:
      moisture: 农人把两块地记在板上同一格。你沿田埂走一趟，举起两块土，一块粘手，一块一捏就散。他分开记下两条所见。你带回成对的一笔，庄稼得等你走后才熟。
      timing: 你知道后人会抄下关于燥湿的规则。农人问你说能耕的是哪一块。你在板中间划线，先指给他看高田那一边。收队时，板上只填了一行。
      bank: 你把记事板带到低田边。农人先写是哪块地，再记眼下看见的。你把地点也抄在记号旁。等犁移到另一块地，你已经离开。
  qin_jiushao_huzhou:
    name: 一份答案要过两行
    place: 湖州
    figure: 秦九韶
    story: 秦九韶《数书九章》卷一大衍类详列处理余数问题的方法。
    relic: 一枚算筹
    relic_desc: 一根磨得发亮的竹算筹。
    points:
      p1: 把同一堆筹按两条规则分别验算
      p2: 抄表时让除数紧挨对应的余数
      p3: 说清为什么只过一行也得重算
    vignettes:
      witness: 学算人摆了五根筹。三根一组的确剩二，但五根一组剩零。你请他试八，第一行剩二，第二行剩三。他划去一个答案。再加第三行的题，你没等到。
      rows: 你知道以后还有人研究这套算法，学算人却只想知道两个余数能不能填进同一格。你请他分别标明按三分组与按五分组的两行。他下次能自己验了，那个新答案你仍没赶上。
      counters: 你把八根筹先按三根分，再按五根分。每回重摆之前，先记下没分进组的筹。你带回验过的两行，桌上还有一道更大的题。
  al_biruni_ghazna:
    name: 平原上方的两条线
    place: 加兹尼
    figure: 比鲁尼
    story: 比鲁尼在《确定地点坐标》中记述曾用南达纳附近一座山估算地球大小。山高与地平线低于水平线的角度是两项不同的量。
    relic: 一件星盘
    relic_desc: 一只铜星盘，刻度被手指磨亮。
    points:
      p1: 在草图上区分水平线与望见的地平线
      p2: 带着完整的山高记录到观测点
      p3: 说清山坡坡度为何是另一个量
    vignettes:
      angle: 测量帮手把角标在山坡那一侧。你从他站的点画出水平线，再画望向地平线的较低视线。角的记号得挪到另一处。你带回改过的图，最后的数字还在算。
      height: 你知道后来的书会同时留下山高和角度。到了山顶，帮手只报了角度。你把记山高的条子送上来，请他把两项并着收。等平原没入薄雾，两个读数已经挨在一起。下一回地平线放晴你等不到。
      fold: 你用一张纸条裹住另一张，标明哪项是量山所得，哪项是平望所得。帮手再翻时不用猜。你带回两个量的名字，半径还没算完。
  al_razi_rayy:
    name: 给存疑处另作题头
    place: 雷伊
    figure: 拉齐
    story: 拉齐在《质疑盖伦》中，把盖伦书里的主张与自己的观察并看，也记下他曾在什么情况下暂缓判断。
    relic: 一张分了两栏的页边记
    relic_desc: 读书记，分列出处与读者疑问。
    points:
      p1: 核对页边写的是观察，还是判断
      p2: 留点时间，等读者把疑处说完
      p3: 交接时，让观察记录和出处一并交出去
    vignettes:
      columns: 莱拉把两行都记在盖伦名下。第一行在书里找得到，第二行是有人放下书之后说的。你请她把书名留给第一行，给另一行另作题头。新来的人能看懂疑问从哪里开始。
      doubt: 法尔哈德想用一句判断收尾。莱拉还在回想做观察的人到底说了什么。你放慢读的速度，把最后一行留给她。她把记得的写下来，再跟一个问题，留给接手的读者。
      edition: 你见过后世传本会记下这样的疑问。法尔哈德手里只有这张纸，问最后没定下的一行该怎么写。你帮他标作待对照。下一份抄本还没来，灯就撤走了。
  sushruta_varanasi:
    name: 课前那块练习布
    place: 瓦拉纳西
    figure: 妙闻
    story: 《妙闻集》记述用模型习作，并举到布片。文本经历了长期传承。
    relic: 一片标记过的练习布
    relic_desc: 练习样布，保留下来供比较。
    points:
      p1: 找出哪块布留着给人看最初那次练习
      p2: 学徒比较时，把练习布按在原处
      p3: 帮下一名学徒把两次练习都看一遍
    vignettes:
      cloth: 米拉正要把粗糙些的那片丢进碎布堆。你指出阿难给第一回留下的记号。她拿来同后来那片比，把两块都留在台上。阿难现在可以指明自己哪儿做了改动。
      turn: 阿难不停讲自己的那片，米拉等着上手摸。你把两片摆到她够得着的地方，请阿难先看她指哪儿。她问的正是他刚才跳过的一角。那片布便留在台边，给下一人看。
      text: 你知道后世能读到一章讲模型习作。米拉手里只有片布，上面的一个小记号她认不出。你听着她自己找回早一块来对照。下一堂开始时，你已经走了。
  zhuge_liang_longzhong:
    name: 草庐三访
    place: 隆中一带
    figure: 诸葛亮
    story: 《三国志·诸葛亮传》记诸葛亮躬耕陇亩，好为《梁父吟》。徐庶对刘备说，此人可就见，不可屈致。刘备三次前往才见到他，见面时先屏退旁人，然后开口。裴松之注另引《魏略》，记的是诸葛亮先去见刘备。
    relic: 一页记着调子的纸
    relic_desc: 田边记下的一支慢歌的调子，词缺了一半。
    points:
      p1: 在隆中落脚，下田干活，等到第三次来访
      p2: 听见田那头的歌，把调子记下来
      p3: 客人请旁人退出时，退到门外，守到门再打开
    vignettes:
      future_novel: 你问一同下田的邻人，草庐里那位将来会不会趁江上起雾去借箭。这位邻人是游戏里编出来的。他直起腰：「他连船都没有。你上哪儿听来的？」你在归来报告里把借箭那段另标为后世小说的情节。
      door: 客人第三次来，进门后请旁人都出去。你和邻人退到篱笆外。门里说了什么，你一句也没听见，后来的书上记着。
      song: 田那头有人唱歌，调子很慢。邻人说，那位常唱这个，叫《梁父吟》。你把调子记了下来，词没有记全。
  borobudur_java:
    name: 方台走到圆台
    place: 爪哇
    figure: 婆罗浮屠的建造者们
    story: 爪哇中部的婆罗浮屠建于八至九世纪。联合国教科文组织的遗产档案记有下部的方形台层和上部三层圆台。
    relic: 两张台层轮廓图
    relic_desc: 两张方台与圆台交界的工作草图。
    points:
      p1: 让两张练习图纸在共用的台阶处对齐
      p2: 把平面图带到方台转为圆台的位置
      p3: 在圆台草图上找出多画的一处拐角
    vignettes:
      corner: 画图帮工把下图的形状又画进上图。你先顺着方台图走一处直角，再沿另一张的弧边描过去。他擦掉多出的一角。你带回两个轮廓，走到的地方还没有抵达最高处。
      stair: 你看过后世从上往下画的平面图，站在下面的帮工却只见眼前的台阶。你在两纸都画出这段阶，好叫他登上去能看懂哪里改了形。等他绕圆台一周，你早已走了。
      layers: 你在阶下标出一条直边，又在阶上描一小段弧。帮工核图时请你把两个记号分别留着。你带回两种轮廓，哪一张都画不下整座建筑。
  qin_liangyu_shizhu:
    name: 秦良玉与石砫账册
    place: 石砫
    figure: 秦良玉
    story: 《明史·秦良玉传》记载，崇祯三年，秦良玉与秦翼明奉诏勤王，秦良玉出家财济饷。《补辑石砫厅新志》也记载了这次奉诏出行。
    relic: 石砫领物抄单
    relic_desc: 页边记了一个姓名，包裹旁又写了另一个。
    points:
      p1: 找出清单上两个写得很像的名字
      p2: 帮搬货人核对她该领的是哪一包
      p3: 在收桌前留好两张对得上的单子
    vignettes:
      ledger: 两行名字只差一个字，账房顺嘴读成了同一个人。你把那个字圈出来，他把两位领物人都叫回来核对。
      hands: 搬货人两手托着包裹，腾不出手展开单子。你替她把纸按平，把名字念给她听，她才重新抱紧包裹。
      copy: 账房念过一行，你就在抄单上对一行。念到最后，你把两张纸并排留在桌上。
  zeami_sado:
    name: 纸上的金岛
    place: 佐渡岛
    figure: 世阿弥
    story: 佐渡市资料记载，世阿弥于 1434 年流放佐渡，居岛期间所写的《金岛书》称佐渡为金之岛。
    relic: 一张能面
    relic_desc: 一张小小的木面，眉间有细细的漆痕。
    points:
      p1: 听清念到岛名时停在哪儿
      p2: 把同一行试念两遍，让人听出区别
      p3: 在练习结束前护好一张没受潮的念词纸
    vignettes:
      later: 你告诉虚构的念词人，后来写佐渡的书还会提到这个名字。他先像念地名一样试一遍，再念得像一个人对着远处想什么。你记下两个停顿。载世阿弥来岛的船，你已经赶不上了。
      mask: 念词人举起练习用的面具，放下时找不到念到哪儿。你拿一张散纸标出那行的起头，立在他伸手就能找见的位置。面具挂回钩上，下一轮念词你没能留下听。
      wind: 风把念词纸吹散。你从长凳底下拾回一张，用小石子压住。念词人把那一行又念了一遍。你走时纸还压在石头下，记下来的只有那一处停顿。
  ino_tadataka_ezo:
    name: 被直线吞掉的转弯
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬带着一行五人从江户出发，去测量虾夷地，也就是今天的北海道。他们在岛上待了约半年，测了东南沿岸。他于 1818 年去世，死讯一度被隐瞒，好让测绘继续；1821 年，高桥景保等人完成了《大日本沿海舆地全图》。
    relic: 一根测杖
    relic_desc: 一根量步距用的细杖，上面刻着尺度。
    points:
      p1: 先让队里背器材的人认下，再替他们扛测绳
      p2: 在海边，把每一段的步数和方位记下来
      p3: 秋天的海风里，跟着把一整段海岸走到头
    vignettes:
      bend: 一处海湾眼看要被画进一条直线里，{staff}请他们在拐弯处再测一次方位，那个弯就留在了纸上。
      repeat: '{staff}用同样的步子把一段路又走了一遍，两次的步数并排记着，没去挑哪一个。'
      sketch: 众人歇脚时，{staff}在计数单背面画了一个岬角的轮廓，标出测绳铺在哪里。
  djenne_builders:
    name: 院边一小块试抹的墙
    place: 杰内
    figure: 杰内的泥砖建造者们
    story: 杰内以土构建筑著称。今日可见的大清真寺于 1907 年重建。
    relic: 一块泥砖
    relic_desc: 一块晒得很硬的泥砖，掰开能看到里面的稻壳。
    points:
      p1: 扶住练习板，别蹭到新抹上的一层
      p2: 带第二小份材料到练习墙另一面
      p3: 与帮工约定下回先回来看哪一块
    vignettes:
      mark: 院里帮工试抹两块，却记不清各是哪碗来的。你在墙边摆两张另记的纸条，两块试抹都有了自己的记录。另一面还没轮到晒太阳，你就收队了。
      time: 你知道几个世纪后人们所见的建筑还有重建的历史。眼下帮工只想把这一碗铺满试墙，你请他先抹一小块，留一个干后可再查的位置。你带回的是下回该看哪处，结果还没出来。
      shade: 你把试抹的那块和阳光照到的边界画下来。帮工把图拿回工台，好下回对同一处。你的副本上只有一小块，整墙还没抹。
  ahmes_thebes:
    name: 纸草上的圆田
    place: 底比斯
    figure: 阿赫摩斯
    story: 莱因德数学纸草第 50 题问直径为九的圆田有多大。题中从直径减去九分之一，再把余下的数平方，得六十四。现存纸草由书吏阿赫摩斯据旧本抄写。
    relic: 一卷纸草残片
    relic_desc: 一小片写着红黑两色字的纸草。
    points:
      p1: 算出平方之前剩下的长度
      p2: 把规则和算例抄在一起
      p3: 指给帮工看，正方形边长为何用八
    vignettes:
      table: 帮工把整个直径平方，在答案处写了八十一。你在九旁边写明先减去它的九分之一，再把剩下的八平方。他把答案改成六十四。两行你都抄走了，这趟却还没丈量过一块真的田。
      outline: 你知道后人会把这个法子与现代公式一起算。帮工只想知道八从哪来，你便给直径画了九个等分，划掉其中一份。他把图留在题旁。等他拿另一块田来试，你就不在了。
      roll: 纸草收起来之前，你把直径、减去的九分之一和余下的长度抄下来。帮工等你走后也能照着求平方。你只带回三个数，这块田究竟要下多少种，还不知道。
  quipu_cusco:
    name: 要数两遍的绳
    place: 库斯科
    figure: 结绳记事的人
    story: 《结绳档案》研究识别出若干记录相同数字的印加结绳，并讨论一笔账如何保存副本。许多数值结绳采用十进位。
    relic: 一束彩色结绳
    relic_desc: 一束长短不一的绳子，打着大小不同的结。
    points:
      p1: 先分清结的位置，再读练习数
      p2: 先独立读另一束，再把两份并到一起
      p3: 请记账人留住两份之间的差异，等复核
    vignettes:
      places: 记账人一眼把两条练习绳读成同一个数。你在纸上把十位和个位拆开，一条是二十三，一条是三十二。他给这对绳加了待复核的签。你带得走这处差异，却还辨不出哪一个数才对。
      copies: 你知道后来的研究者会找能互相对照的绳。记账人正要把两条中的一条单独搁开。你把两条读数分列两行，用记号标出哪一位开始对不上。两条绳一块收好，下一位复核的人还没来。
      tag: 你跟记账人从绳的自由端辨认一条练习绳。收绳前，你标明每个数各来自哪条。归来时就只带回这些。原例拿什么货物做比方，始终没人写。
  humboldt_chimborazo:
    name: 在雪线下量出一座山的全貌
    place: 厄瓜多尔钦博拉索山
    figure: 亚历山大·冯·洪堡
    story: 洪堡的旅行日记记下了 1802 年 6 月 23 日攀登钦博拉索山的尝试。同行有埃梅·邦普兰和卡洛斯·蒙图法尔，一行人没有登顶。
    relic: 一支气压计
    relic_desc: 一支装着水银的气压计，玻璃管上刻着高度。
    points:
      p1: 在雪线上继续走
      p2: 读气压计和沸点
      p3: 走完最后一段
    vignettes:
      turn: 虚构读者把线路一路画上山顶。你问日记写到哪里就停止往上走了。他把最后一记往山坡下移，没再碰山顶。
      units: 读者要只抄一个高度，把单位省掉。你请他把原单位和测数放在一起，另留一行给今天的换算。
      names: 你请读者在洪堡旁留出地方，记下另外几名同行者。折起纸以后，名单仍跟着当天攀登的记录。
  banneker_maryland:
    name: 要一起寄出的两件东西
    place: 马里兰
    figure: 本杰明·班纳克
    story: 1791年8月19日，本杰明·班纳克致信托马斯·杰斐逊，随信送去下一年的历书手稿，质问种族偏见与奴隶制度。
    relic: 一张留底的信包签
    relic_desc: 留底签，写明里头有历书，也有随附的信。
    points:
      p1: 把寄出的副本与桌上留底核对
      p2: 劝送信人把信和手稿放在同一包
      p3: 等人来接，确认两件都交了出去
    vignettes:
      packet: 蕾切尔看见首页排着月份，就要给包裹写上算表。你把信搁在边上，请她读过收件地址，再把签写完。她用一根线把两件包在一起。表随寄件人署名上路，他要说的话也跟着去。
      handoff: 艾萨克的挎包还能塞进一个薄信包，信上的封蜡还软着。你撑开包纸，让他插一片折纸，把信和表隔开。他两件都带上了。你多站了一会儿，看桌上信包留下的一小块空地。
      reply: 你知道很快会有回信。艾萨克问，这样信里说的事就能解决吗？你抄下寄出日期，把回信那格照原样留空。信包已经上路，还没有任何承诺回来。
  seacole_balaklava:
    name: 自己找路去的战地客栈
    place: 巴拉克拉瓦
    figure: 玛丽·西科尔
    story: 玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。
    relic: 一只药箱
    relic_desc: 一只旧木药箱，里面分格放着草药和纱布。
    points:
      p1: 照看痢疾和霍乱病人
      p2: 向军需官要一箱药
      p3: 撑过一整个夏天
    vignettes:
      meal: 一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。
      counter: 两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。
      shelf: 店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。
  mitchell_nantucket:
    name: 云过来以前，先标下这块天
    place: 楠塔基特
    figure: 玛丽亚·米切尔
    story: 《玛丽亚·米切尔生平、书信与日记》所录的书信记载，她在 1847 年 10 月 1 日于楠塔基特发现一颗需用望远镜观测的彗星。父亲记下发现，并托首班去大陆的邮船寄信给哈佛天文台主任。
    relic: 一架小望远镜
    relic_desc: 一架小小的黄铜望远镜，镜筒上有海盐的痕迹。
    points:
      p1: 先标两颗参照星，再圈出暗目标
      p2: 留住第一次的星野图，等能再看一遍
      p3: 帮下一位读记录的人补好日期和所见
    vignettes:
      field: 帮工只画了一个淡点。你问他下次靠什么把镜头转回这里。云遮上来前，他补了两颗星和一个方向。你把这些抄走，还没有第二次位置可以对照。
      post: 你知道消息得送出海岛。帮工还没写清看见的东西，就想把发现先记上去。你把日期和星野另写一张，留下一行等复核。纸包送去岸边时，那一行仍空着。
      cloud: 云挡住淡点时，你在原地拿着草图等。折纸前你圈一颗熟星，即使淡点不见了，也能从它找回这片天。你带回一个可以再找的位置，收队前仍没人看见第二次。
  caroline_herschel_slough:
    name: 扫天的人
    place: 斯劳
    figure: 卡罗琳·赫歇尔
    story: 卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。
    relic: 一把天区扫描记录尺
    relic_desc: 一把刻着刻度的木尺，用来在星图上标出扫过的天区。
    points:
      p1: 标出用来比较的邻星
      p2: 把两个时刻各记在对应的图旁
      p3: 在暗处帮忙留下下一次观测
    vignettes:
      fixed: 你先记下两颗较亮的邻星，再添模糊的那个。第二张纸虽然挪了位置，仍能靠那两颗星找回原处。
      doubt: 帮手说兴许该擦擦镜片。你问同一片玻璃里的别的星怎样。那些仍然清晰，他便把这处可疑的记号留在纸上。
      lamp: 帮手记时刻时，你用手遮住灯。把灯盖好以后，两张图旁都还留着各自的时刻。
  kovalevskaya_stockholm:
    name: 写在首页的前提
    place: 斯德哥尔摩
    figure: 索菲娅·柯瓦列夫斯卡娅
    story: 柯瓦列夫斯卡娅关于刚体绕定点转动的论文发表于 1889 年的《数学学报》。她找到一种可积分的情形，对转动惯量与质心位置有特定要求。
    relic: 一只陀螺模型
    relic_desc: 一只铜陀螺，轴上刻着编号。
    points:
      p1: 找出论证从哪里用到刚体的对称条件
      p2: 请校对人把两类前提都保留下来
      p3: 等到誊清完成，确认前提与正文在一起
    vignettes:
      conditions: 练习纸上省写成了「一个转动的刚体」。你照首页补回两类条件，一类管转动惯量，一类管质心在哪儿。校对人把两条都誊上纸条。你能抄走这两条更正，刊物还没有印出来。
      diagram: 校对人想拿一只陀螺试。你画了一个固定不动的点，再标出代表质心的另一个点。他拿到下一张图就能分清两个地方。收队时陀螺仍在转，这一转证明不了论文。
      clip: 你把前提折在练习纸外头，又把散开的图纸夹在里面。下一个人会先看见条件，再看到结论。你带回陀螺的轮廓，证明还留在桌上。
  chaco_sun_watchers:
    name: 木板上的第二道影
    place: 新墨西哥州查科峡谷
    figure: 查科峡谷的人们
    story: 公开发表的查科峡谷法哈达孤丘测量记录记下，在一年中的特定时候，接近正午的光会落到螺旋岩刻上。这段练习不给真实的刻纹定年，也不判定其原始用途。
    relic: 一张双影线草图
    relic_desc: 同一块木板摆在原地时描的两道影。
    points:
      p1: 看出影边在哪儿移了一点
      p2: 木板不挪位置，再描一次影边
      p3: 帮工折回来复核时留在标记处
    vignettes:
      two: 帮工把木板转向你，两道线却没法互相对照。你让板脚回到第一记，请他重新描一遍。这回两刻的影边能放在一起看了。下一个季节已经超出你能待的时间。
      sky: 你知道后人还会研究光怎样落到岩面。帮工想先给小板上的影起个名字，你请他先画下板摆在哪里。你带走的是摆放位置图，第二回天清时的影子没赶上。
      wait: 你把一粒小石子搁在木板旁，等能描第二道影，再抬起板。纸上两道线共有一个站位，你都带了回来。只待这么久，还说不清过一年会怎么变。
  rapa_nui_moai:
    name: 采石场的一前一侧
    place: 拉帕努伊岛，拉诺拉拉库
    figure: 拉帕努伊的石像匠人
    story: 拉帕努伊岛上的摩艾，多数是在拉诺拉拉库火山的采石场里，直接从火山凝灰岩中凿出来的，年代估计在十三到十六世纪之间。1722 年 4 月 5 日复活节那天，荷兰航海家雅各布·罗赫芬到达这座岛。
    relic: 一把石斧
    relic_desc: 一片手掌大的深色玄武岩刃，磨出了干净的刃口。
    points:
      p1: 先让匠人们认下，再替他们把玄武岩石斧磨利
      p2: 绕着岩壁上的一尊石像走一圈，正面、侧面各画一遍
      p3: 顶着一整天的日头，帮着凿开一尊石像背后的凝灰岩
    vignettes:
      pair: '{staff}先标清哪张是正面、哪张是侧面，才把两张并在一起看，岩上的一道凸脊就不会被当成脸的边。'
      surface: '{staff}走回坡上最先站的地方，在图上补了一支箭头，标出是从哪里看的。'
      height: '{staff}从正面描一遍头顶，又绕到侧面描一遍，把两张纸条在同一处对齐。'
  hargrave_stanwell_park:
    name: 第四只风筝
    place: 澳大利亚斯坦威尔公园
    figure: 劳伦斯·哈格雷夫
    story: 劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。
    relic: 一片箱形风筝的备用签
    relic_desc: 一片给箱形风筝骨架用的备用签。
    points:
      p1: 先让海滩上帮忙的人认下，再帮着绷紧、扎好风筝的布面
      p2: 升空时守在绞盘旁，报出座椅离地多高
      p3: 风停下来时，稳住第四只风筝的拉绳
    vignettes:
      four: 升空之后，{staff}把沙滩上铺开的风筝又数了一遍，四只都记在本子上，用括号圈在一起，让下一个读的人知道它们是一起飞的。
      tag: 一张签从骨架上扯脱了，{staff}沿着湿沙往回找，找到后重新打了个结系上。
      lift: 先放一只风筝试风时，{staff}和帮手们站在沙丘上，学会了拉着绳该往哪边跑。
  sun_yat_sen_guangzhou:
    name: 从铜像到一所新大学
    place: 广州
    figure: 孙中山
    story: 你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。同一段日子里，他星期天在高等师范的礼堂演讲，讲稿在几个人手里来回走，后来成了一本书。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。
    relic: 孙中山铜像
    relic_desc: 中山大学校园里的孙中山铜像。它是通往 1924 年广州的穿越媒介，不是古董，不能出售。
    points:
      p1: 选址之前，把走熟的校址画成图交给筹备处
      p2: 带回一本演讲印成的书
      p3: 待到最后一讲
    vignettes:
      slips: 一位编出来的办事员正要抄一页稿子，稿上有一张签条盖住了两行。你问他签条是谁的字，稿子又是谁的字。他先抄了稿子，签条留在原处没有动。
      back_row: 一位编出来的学生找不到座位，老是站起来张望。你往里挪了挪。他坐下来听完了后半场，一句话没说，散场时朝你点了点头。
      hundred: 你在本子最后一页画正字，一天一笔。画满一百天的时候，一位编出来的办事员问你在数什么。你说，日子。
eras:
  broad_street_1854:
    vignettes:
      odd_address: 虚构书记员埃伦傍晚要交街单，正想划掉一个离泵太远的地址。你问那家人的水是从哪儿来的。露丝能认准门牌，还得等打水的人来说。埃伦搁下笔。那一栏可以空，地址先别划掉。
      witness: 虚构邻居露丝把地址念了几遍，埃伦就要收表。你请露丝照脚走的路说一遍。到说起转弯，她停下来，回手指向那口泵。埃伦亲手补了走法。真正提水的人还没到。
      street_list: 埃伦可以拿了原册就走，也可以等你抄完。你念门牌，她用指尖挨个跟过去。有个记号该再挪一户。原册还是按时交了出去，校过的双栏副页留在桌上。
    name: 伦敦宽街 1854
