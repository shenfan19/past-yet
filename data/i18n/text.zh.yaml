        p2: 狱里只有高处一扇小窗透光。苏格拉底念一句，{staff}在蜡板上记一句，再照着节拍念回给他听，哪一处多出一拍，就抹平了重写。伊索的寓言一则则成了诗，最后是那首献给阿波罗的颂歌。夜里，{staff}在墙根下就着灯油，把蜡板上的字誊进一卷莎草纸。第二天一早，一位来探视的朋友把纸卷贴身揣好，走出狱门时，手一直按在胸口那一块。
        p3:
