  euclid_alexandria:
    name: 《推论集》还在的时候
    place: 亚历山大
    figure: 欧几里得
    story: 约公元前 300 年，欧几里得在亚历山大写成《几何原本》十三卷，从定义和公设出发，一步步证明几何命题。他还写过《推论集》三卷、《圆锥曲线》等书，后来都失传了。公元四世纪的帕普斯还能介绍《推论集》，记下它的命题数。
    story_prose:
      opening:
        - 约公元前 300 年，亚历山大。欧几里得在这里写成《几何原本》十三卷，从几条定义和公设出发，一步步证明几何命题；第一卷第一个命题只用两个圆，就在一条给定的线段上作出等边三角形。他还写过《推论集》三卷、《圆锥曲线》等书。
        - 史实里，《推论集》后来失传了。约公元 320 年，帕普斯还能介绍它，记下它有 171 个定理、38 个引理，此后再没有已知的抄本。在这条分支里，有个学生在沙盘上画图，码头上有个卖莎草纸的人，知道哪种纸经得住潮气。
        - 这一趟用得上几种人：懂抄书、校书、管书的人，会教几何、带得住一群学生的人，或者心细又有学问、一行行核得下去的人。
      outcomes:
        all: 后来的读者书架上，《几何原本》旁边多了三卷《推论集》，卷边被翻得发软。
        p1: 后来的读者书架上，《几何原本》旁边多了三卷《推论集》，卷边被翻得发软。
      none: 沙盘抹平了，又画上新的圆。帕普斯之后，再没人翻开过那三卷书。
      not_admitted: '{staff}没能进那间抄书的屋子。码头上，卖莎草纸的人还在一捆捆往岸上扛纸。'
      points:
        p1:
          class_teaching: '{staff}照教书的办法，把《推论集》三卷分给沙盘边最用心的几个学生，一人一卷，抄完互相换着念，一个字一个图地对过。抄好的几部卷起来，系上细绳，交到跟他学几何的人手里。欧几里得拿起其中一卷，解开绳子看了看第一页，又照原样系好。'
          class_lettered: '{staff}照抄书铺的规矩，裁好莎草纸，把《推论集》三卷一卷卷抄出副本，再对着原卷一行行校过，图也照样描好。抄好的几部卷起来，系上细绳，交到跟他学几何的人手里。欧几里得拿起其中一卷，解开绳子看了看第一页，又照原样系好。'
          else: '{staff}心细，守着抄书人把《推论集》三卷一卷卷抄出副本，每抄完一卷，就把副本和原卷并排摊开，一页页对着图看过。抄好的几部卷起来，系上细绳，交到跟他学几何的人手里。欧几里得拿起其中一卷，解开绳子看了看第一页，又照原样系好。'
      excerpts:
        p1: 抄好的几部卷起来，系上细绳，交到跟他学几何的人手里。欧几里得拿起其中一卷，解开绳子看了看第一页，又照原样系好。
    relic: 一把青铜圆规
