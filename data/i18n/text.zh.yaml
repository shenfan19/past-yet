    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 艾米莉·勃朗特唯一的长篇小说《呼啸山庄》让评论家们困惑，她在霍沃斯的牧师住宅里病倒，十二月去世，年三十岁。
    relic: 一条狗项圈
    relic_desc: 牧师住宅里那条大狗用过的旧皮项圈。
    points:
      p1: 陪她在荒原上待一个小时
      p2: 轻声劝她休息
      p3: 在最后的日子里坐在她身边（护士、医生或善良的人更合适）
  lili_boulanger_paris:
    name: 口述给姐姐的曲子
    place: 梅齐
    figure: 莉莉·布朗热
    story: 莉莉·布朗热是第一位获得罗马大奖作曲奖的女性，病重后把最后一首曲子口述给姐姐娜迪娅。她死时二十四岁。
    relic: 一支铅笔
    relic_desc: 一支短铅笔，旁边是空白的五线谱纸。
    points:
      p1: 听出她口述的曲子（音乐家或敏锐的头脑更合适）
      p2: 耐心陪完缓慢的口述
      p3: 做一个让房间安宁下来的人
  qu_yuan_miluo:
    name: 江边的诗句
    place: 汨罗江
    figure: 屈原
    story: 被放逐到远离朝廷的地方，诗人屈原在汨罗江边游走，把满腔忧愁写成长诗。相传他于公元前278年在这片水中去世，他的诗句由爱它们的人留了下来。
    relic: 一片写诗的竹简
    relic_desc: 一片竹简，上面是一首长诗中的几行。
    points:
      p1: 听他把诗句念出来
      p2: 陪他沿江岸走一整天
      p3: 把他的诗记在心里
  sima_qian_changan:
    name: 受刑之后写成的史书
    place: 长安
    figure: 司马迁
    story: 司马迁因为替一位将军说话而受到朝廷惩罚，他选择活下去，为的是写完那部中国的历史，也就是《史记》。
    relic: 一捆竹简
    relic_desc: 用绳子编起来的竹简，每一片写着一行字。
    points:
      p1: 在判决之后的日子里陪他坐坐
      p2: 和他一起读旧档案
      p3: 留到最后一章写完
  du_fu_xiang_river:
    name: 船上的诗人
    place: 湘江
    figure: 杜甫
    story: 贫病交加的杜甫沿着湘江辗转，一个镇接一个镇，住在船上，仍然不停地写。他的诗在生前少有人知，770年他在江上去世。
    relic: 一盏船灯
    relic_desc: 一盏小小的陶油灯，为了几行诗亮到很晚。
    points:
      p1: 和他一起吃顿饭
      p2: 听他还在改的那首诗
      p3: 让他在船上的最后一个冬天好过些
  li_qingzhao_hangzhou:
    name: 失去的藏品
    place: 杭州
    figure: 李清照
    story: 李清照丧夫后远离北方的家乡，她和丈夫一起收集的书籍和金石大多已经失去。在杭州，她写下充满回忆的诗词，关于她生平的记载也止于这几年。
    relic: 一张古碑拓片
    relic_desc: 用墨从石头上拓下来的纸，是她和丈夫曾经收集的那种。
    points:
      p1: 听她读自己的词
      p2: 碰上她心情好的时候
      p3: 帮她把目录理清
  su_shi_huangzhou:
    name: 东坡的流放
    place: 黄州
    figure: 苏轼
    story: 因为诗文而受审之后，苏轼被贬到黄州，在山坡上种地，写下一些最有名的诗文，并游了赤壁。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是农人在坡地上穿的那种。
    points:
      p1: 和他一起做一顿饭
      p2: 陪他在坡地上开垦
      p3: 在月色里的江边听他说话
  cao_xueqin_beijing:
    name: 停在八十回的小说
    place: 北京西山
    figure: 曹雪芹
    story: 曹雪芹在北京西郊过着贫困的日子，花了多年反复修改《红楼梦》。他去世时书还没有写完，朋友们把它一份份抄了下来。
    relic: 一份手抄的章回
    relic_desc: 朋友抄下的一回，页边有红笔写的批语。
    points:
      p1: 理清故事里那么多家人
      p2: 在寒冷的山里和他分食一餐
      p3: 做他信得过的读者，读到他写下的最后一页
  tang_xianzu_linchuan:
    name: 写爱情超越死亡的戏
    place: 临川
    figure: 汤显祖
    story: 汤显祖离开官场之后写完了《牡丹亭》，一部爱情胜过死亡的戏，后来他看到戏班删改他的唱词。
    relic: 一册刻印的曲本
    relic_desc: 给歌者用的刻本，每支曲牌的名字写在上方。
    points:
      p1: 听这出戏的唱段
      p2: 戏班要删改时，守住他的唱词
      p3: 把这出戏夸得让他亲耳听到
  ban_zhao_luoyang:
    name: 接着兄长写完的史书
    place: 洛阳
    figure: 班昭
    story: 哥哥班固去世时《汉书》还没有写完，班昭受命续成，书里的表大部分都记在她名下。人们记得更多的，却是她那本劝导女子的小书。
    relic: 一幅绢上的人名表
    relic_desc: 一条绢，上面是整整齐齐排列的官名与人名。
    points:
      p1: 对着史料核对那些表
      p2: 向朝中学者辩护那些未完成的表
      p3: 陪她到最后一页读完
  xu_xiake_lijiang:
    name: 再也走不动的旅行家
    place: 丽江
    figure: 徐霞客
    story: 走了三十年之后，徐霞客在西南边远处腿疾发作，被人抬着送回家。他于1641年去世，留下的游记并不完整。
    relic: 一本旅行笔记
    relic_desc: 密密麻麻的笔记，写着洞穴、河流和岩石，每天夜里写成。
    points:
      p1: 陪他爬山路
      p2: 看看他停下来记录什么
      p3: 背着他走完回家的长路
  song_yingxing_fengxin:
    name: 一本讲万物如何造成的书
    place: 江西
    figure: 宋应星
    story: 宋应星是地方上的教师和官员，写了一本讲庄稼、布匹、盐、铁和纸怎样制成的书。这本书在中国很快几乎失传，靠日本的刻本保存了下来。
    relic: 一页工具图
    relic_desc: 一张木刻版画，织机的每个部件都标了名。
    points:
      p1: 弄清织机和窑是怎么操作的
      p2: 核对工具图
      p3: 把一本留在书架上
  wang_zhenyi_jinling:
    name: 用一盏灯讲明白月食
    place: 南京
    figure: 王贞仪
    story: 王贞仪是个自学天文和数学的年轻女子，她用一盏灯、一面镜子和一张圆桌演示月食是怎么发生的。她1797年去世，年仅二十九岁，她的成果很少有人知道。
    relic: 一面小圆镜
    relic_desc: 在她的月食模型里充当月亮的那面镜子。
    points:
      p1: 和她一起坐在书堆里
      p2: 跟上她的月食模型
      p3: 把她的论证听到底
  jianzhen_nara:
    name: 没能看见海岸的僧人
    place: 奈良
    figure: 鉴真
    story: 中国僧人鉴真想去日本传授戒律，五次被风浪和阻挠挡回，还双目失明。第六次他终于到达，却再没能看见那个国家。
    relic: 一捆干草药
    relic_desc: 他漂洋过海带去的药草。
    points:
      p1: 按他的步子走完去寺院的最后一段路
      p2: 和他谈药
      p3: 边走边给他描述眼前的土地
  hua_tuo_xuchang:
    name: 书都不在了的医生
    place: 许昌
    figure: 华佗
    story: 华佗以用麻沸散做外科手术和仿动物动作的导引之法著称，后来被官府关押在许昌。他自己的著作没有留下来，只能从后人的记载中知道他。
    relic: 一小袋药粉
    relic_desc: 一个小布袋，装着研细的草药，有淡淡的苦味。
    points:
      p1: 看他诊察病人
      p2: 陪一位病人熬过一夜
      p3: 在他说话时把方法记下来
  bi_sheng_printer:
    name: 陶土做的活字
    place: 杭州
    figure: 毕昇
    story: 平民毕昇用烧过的胶泥制成活字，并用它印书，这是后来沈括记下来的。这种方法并没有被广泛采用，他的东西一件也没有留下。
    relic: 一枚泥活字
    relic_desc: 一小块烧过的泥，上面是一个反刻的字。
    points:
      p1: 刻制并烧好泥活字
      p2: 按韵部把字排序
      p3: 在别人只看到把戏的时候，相信这些泥活字
  miyazawa_kenji_hanamaki:
    name: 很少有人读过的故事
    place: 花卷
    figure: 宫泽贤治
    story: 宫泽贤治是日本北部的教师兼农业指导员，他写的故事和诗几乎没人买。他于1933年病逝，年仅三十七岁，《银河铁道之夜》没有写完。
    relic: 一本口袋笔记本
    relic_desc: 一本小笔记本，里面是铅笔写的诗。
    points:
      p1: 陪他一起看星星
      p2: 在寒冷的田里和他一起干活
      p3: 在他最后的傍晚陪着他
  higuchi_ichiyo_tokyo:
    name: 十四个月的小说
    place: 东京
    figure: 樋口一叶
    story: 樋口一叶在贫困中养着母亲和妹妹，约十四个月里写了寥寥几篇小说。1896年11月她死于肺结核，年仅二十四岁，那时评论界才刚开始称赞她。
    relic: 一本随身日记
    relic_desc: 一本写了多年的日记，毛笔字端正。
    points:
      p1: 说动一位编辑再收一篇小说
      p2: 读她的日记
      p3: 在一个安稳的下午陪她坐坐
  sei_shonagon_kyoto:
    name: 宫廷散去之后
    place: 京都
    figure: 清少纳言
    story: 皇后在1000年去世后，清少纳言失去了她所在的宫廷。她那本记录清单与小瞬间的笔记，也就是《枕草子》，是留下来的东西，她晚年的情形没有记载。
    relic: 一张折起来的清单
    relic_desc: 一张轻轻写着喜欢和不喜欢的事的单子。
    points:
      p1: 加入她那份令人喜欢的事的清单
      p2: 碰上她爱聊天的时候
      p3: 在宫里冷清下来之后去看她
  kabir_maghar:
    name: 由歌者传下的诗句
    place: 马格哈尔
    figure: 迦比尔
    story: 迦比尔是个织工，用短诗唱出对骄傲与分裂的反对，他自己从没把诗写下来。歌者把诗传了下来，在他身后才被收集，传统上说他于1518年在马格哈尔去世。
    relic: 一把织梭
    relic_desc: 一把用旧了的木梭，被手磨得光滑。
    points:
      p1: 听他在织机旁唱
      p2: 在安静的时候坐在织工们中间
      p3: 把诗句背下来
  ibn_rushd_lucena:
    name: 连同书一起被放逐
    place: 卢塞纳
    figure: 伊本·鲁世德
    story: 法官兼医生伊本·鲁世德于1195年被放逐到卢塞纳，他的哲学书被下令烧毁。他对亚里士多德的注释主要靠希伯来文和拉丁文译本保存，阿拉伯文原本留下得较少。
    relic: 一页注释
    relic_desc: 一页紧凑的阿拉伯文，页边是亚里士多德的原文。
    points:
      p1: 去那座安静的小镇看他
      p2: 跟上他对亚里士多德的注释
      p3: 不引人注意地去看他
  rumi_konya:
    name: 由友人听写下来的诗
    place: 科尼亚
    figure: 鲁米
    story: 失去朋友沙姆斯之后，鲁米把悲伤写成诗，他口述，别人记录，《玛斯纳维》就是其中之一。1273年12月他在科尼亚去世，诗稿的汇集工作仍在继续。
    relic: 一支芦笛
    relic_desc: 一支朴素的芦笛，声音细而低。
    points:
      p1: 听笛声和诗句
      p2: 在他念诗时记下来
      p3: 最后一夜陪着他
  ibn_al_nafis_cairo:
    name: 穿过肺的血液
    place: 开罗
    figure: 伊本·纳菲斯
    story: 在开罗，伊本·纳菲斯写道，血液是经过肺从心脏右侧到左侧，而不是穿过中间的隔。这个说法被遗忘，直到二十世纪才被重新发现。
    relic: 一页解剖注释
    relic_desc: 一页写着心与肺的笔记，字小而清楚。
    points:
      p1: 跟上他关于血液的推理
      p2: 在医院病房里帮忙
      p3: 做那个相信他推理的学生
  al_khwarizmi_baghdad:
    name: 代数背后的那个人
    place: 巴格达
    figure: 花拉子米
    story: 花拉子米写了一本用还原与对消解方程的小书，代数这个名字就由此而来，可是人们几乎不知道他的生平，连他生在哪里都不清楚。
    relic: 一张演算过的方程
    relic_desc: 一张逐步解出平方与根的演算纸。
    points:
      p1: 用手把长长的算式一步步算完
      p2: 向一位商人解释对消的方法
      p3: 问他生在哪里，把答案记下来
  ibn_khaldun_cairo:
    name: 比史书更大的序言
    place: 开罗
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦为一部史书写的序言，成了一部研究社会与经济如何兴衰的著作。1384年他的妻女在海难中去世，此后他在开罗继续教书，直到1406年去世。
    relic: 一册装订好的讲稿
    relic_desc: 一册厚厚的笔记，是为学院讲课写的。
    points:
      p1: 陪一位失去家人的人坐坐
      p2: 跟上他对城市为何兴起又衰落的想法
      p3: 把他的想法传给以后的读者
  taqi_al_din_istanbul:
    name: 被拆掉的天文台
    place: 伊斯坦布尔
    figure: 塔基·丁
    story: 塔基·丁在伊斯坦布尔建了一座天文台，用的是他自己设计的仪器，其中有一架大钟，并开始为新的星表做观测。它在1580年被拆掉，距开建只有几年。
    relic: 一件黄铜观测仪
    relic_desc: 一件小小的黄铜仪器，用来测星的高度。
    points:
      p1: 制造钟和仪器
      p2: 整夜做观测
      p3: 最后一夜陪观测员们守着
  ahmed_baba_timbuktu:
    name: 被带走的藏书
    place: 廷巴克图
    figure: 艾哈迈德·巴巴
    story: 廷巴克图的学者艾哈迈德·巴巴有一座约一千六百册书的藏书室，1594年他被押往摩洛哥。书都散失了，他几年后才获准回来。
    relic: 一册皮面手抄本
    relic_desc: 一册皮面磨旧的手抄本，带着翻盖。
    points:
      p1: 翻翻他的书架
      p2: 书装箱时清点册数
      p3: 不被察觉地陪他走在路上
  terence_rome:
    name: 观众离场的那出戏
    place: 罗马
    figure: 泰伦提乌斯
    story: 泰伦提乌斯是来自迦太基的前奴隶，他的喜剧《婆母》两次被观众抛下，先是为了拳击手和走绳艺人，后来为了角斗士。直到第三次才被完整地听完。
    relic: 一副喜剧面具
    relic_desc: 一副亚麻面具，眉毛高挑，演员戴的。
    points:
      p1: 把吵闹的人群劝回座位
      p2: 跟上演员们说出的情节
      p3: 留在座位上，听到最后一句
  mohenjo_daro_indus:
    name: 无人能读的符号
    place: 摩亨佐·达罗
    figure: 印度河流域的居民
    story: 在一座规划整齐的城市里，有砖砌的房子和有盖的排水沟，人们把短短几行符号压在小小的石印章上。这种文字至今没有被释读，我们不知道符号说了什么，也不知道他们说什么语言。
    relic: 一枚石印章
    relic_desc: 一枚方形小印章，上面有一只动物和几个符号。
    points:
      p1: 研究印章上的符号
      p2: 走过笔直的街道和排水沟
      p3: 读出印章上的符号
  knossos_linear_a:
    name: 米诺斯人没有留下读法的文字
    place: 克诺索斯
    figure: 米诺斯的书吏
    story: 克诺索斯王宫里的书吏用线形文字A把货物记在泥板上，那是米诺斯人的文字。它至今没有被读通，所以他们的语言不为人知；而后来的线形文字B在1952年被读出，记的是希腊语。
    relic: 一块泥板
    relic_desc: 一块扁平的泥板，上面是一行行符号和表示数目的小记号。
    points:
      p1: 把符号压进湿泥里
      p2: 比较各块泥板上的符号
      p3: 用他自己的语言和书吏交谈
  antikythera_rhodes:
    name: 没有留下匠人姓名的机器
    place: 罗得岛
    figure: 不知名的匠人
    story: 一位不知名的匠人造出一台手摇装置，有三十多个青铜齿轮，能显示太阳、月亮和日月食。它随沉船沉在安提基特拉附近，到二十世纪才被弄明白，也没有人记下是谁造的。
    relic: 一枚青铜齿轮
    relic_desc: 一个带齿的小轮，因年久而发绿。
    points:
      p1: 锉制青铜齿轮
      p2: 看懂齿轮怎样模拟日月食
      p3: 陪匠人熬过漫长的夜
  sappho_lesbos:
    name: 只剩碎片的歌
    place: 米蒂利尼
    figure: 萨福
    story: 莱斯博斯岛的萨福为里拉琴作歌，古时被收成九卷。除了一首完整的诗和几段较长的篇章，如今只剩写在纸莎草碎片上的残句和后人的引文。
    relic: 一片纸莎草残片
    relic_desc: 一片撕裂的碎纸，上面有几个圆润字体的希腊词。
    points:
      p1: 听她伴着里拉琴唱
      p2: 坐进她朋友们的圈子
      p3: 听懂她方言里的每一个词
  aristarchus_alexandria:
    name: 地球在动，少有人听
    place: 亚历山大
    figure: 阿利斯塔克斯
    story: 阿利斯塔克斯提出地球绕着太阳转，并测量了太阳和月亮的大小。几乎没有人跟随他，这个想法只在阿基米德的几行文字里留了下来。
    relic: 一块日晷板
    relic_desc: 一块青铜板，刻着时辰和节气的线。
    points:
      p1: 跟上他关于太阳和月亮的几何
      p2: 别人嘲笑时守住这个想法
      p3: 让一位听众把他的想法记下来
  hipparchus_rhodes:
    name: 丢失的星表
    place: 罗得岛
    figure: 喜帕恰斯
    story: 喜帕恰斯在罗得岛编出一份约八百五十颗星的星表，并发现了二分点的缓慢移动。他自己的著作已经失传，是靠托勒密的转述才知道的。
    relic: 一只青铜浑仪环
    relic_desc: 一只带刻度的环，用来量星的位置。
    points:
      p1: 陪他数星星
      p2: 在观测筒旁值夜
      p3: 亲手抄下他的星表
  heron_alexandria:
    name: 蒸汽球与神庙的门
    place: 亚历山大
    figure: 希罗
    story: 希罗描述了一只蒸汽喷出就会转动的球，火一点燃就会开启的门，和一台投币出圣水的机器。这些东西只留作神庙和娱乐用的奇物。
    relic: 一只带两根弯管的小铜球
    relic_desc: 一只装在枢轴上的空心球，有两根弯管用来出汽。
    points:
      p1: 装好管子和枢轴
      p2: 趁他两次演示之间找他
      p3: 看出这只旋转的球可能通向哪里
  pliny_stabiae:
    name: 博物学家的最后一次航行
    place: 斯塔比亚
    figure: 老普林尼
    story: 老普林尼刚刚写完卷帙浩繁的三十七卷《博物志》，维苏威火山喷发时，他驾船横渡海湾，既为观察，也为帮助朋友。他死在岸边，是外甥写下了这段记述。
    relic: 一块蜡板
    relic_desc: 一块涂蜡的木板，用尖笔划出笔记。
    points:
      p1: 问他那三十七卷书
      p2: 在火山灰落下时驾船横渡海湾
      p3: 留在岸边陪着他
  galen_rome:
    name: 烧掉的书架
    place: 罗马
    figure: 盖伦
    story: 192年的一场大火毁掉了和平神殿附近的仓库与图书室，盖伦在那里存放着他许多著作和其他书籍。他的很多作品从此失传。
    relic: 一卷烧焦的卷轴
    relic_desc: 一卷一头烧黑的卷轴，其余的字仍能读。
    points:
      p1: 和他一起读病例记录
      p2: 照看他门口的病人
      p3: 陪他坐在烧毁的书架旁
  ovid_tomis:
    name: 帝国边缘的诗人
    place: 托米
    figure: 奥维德
    story: 奥维德因为一首诗和一个从未说明的过错，被皇帝奥古斯都从罗马放逐到黑海边的托米。他写下充满乡愁的书信体诗，一再请求回去，最后死在那里。
    relic: 一块写字蜡板
    relic_desc: 一块板，上面是流放路上起笔的诗体书信。
    points:
      p1: 给他带来罗马的消息
      p2: 听他在冬天的海岸上写的诗
      p3: 用当地话和他交谈
  empedocles_akragas:
    name: 四根与爱憎
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒用诗写道，万物由土、气、火、水构成，被爱聚合，被恨分开。他的诗只留下了残篇。
    relic: 一片诗稿
    relic_desc: 一条纸莎草，上面是几行六音步诗。
    points:
      p1: 看四种元素在罐里混合
      p2: 在合适的时候赶上人群
      p3: 把整首诗听完
  democritus_abdera:
    name: 空间中的原子
    place: 阿布德拉
    figure: 德谟克利特
    story: 德谟克利特认为万物由不可再分的微小原子在虚空中运动构成。他写的几十部书一本也没有留下，我们是通过后人的引文才知道他。
    relic: 一块卵石和一把刀
    relic_desc: 一块光滑的卵石和一把切它的小刀，像思想实验里那样。
    points:
      p1: 问他切开的苹果是由什么组成的
      p2: 在他安静的园子里找到他
      p3: 抄下他的一卷文字
  hildegard_bingen:
    name: 修道院里的静默
    place: 宾根
    figure: 宾根的希尔德加德
    story: 希尔德加德是女修道院长，作曲，也写医学和自然。因为一场关于安葬的争执，她和修女们被禁止唱礼仪歌好几个月。1179年9月她去世。
    relic: 一页圣咏
    relic_desc: 一页拉丁词句上方标着纽姆谱的纸，抄给修女们用。
    points:
      p1: 听她的圣咏
      p2: 碰上她安静的时候
      p3: 陪她度过静默的那几个月
  nezahualcoyotl_texcoco:
    name: 写歌的国王
    place: 特斯科科
    figure: 内萨瓦尔科约特尔
    story: 特斯科科的统治者内萨瓦尔科约特尔也是诗人，他在城里收集绘本、歌和园林，1472年去世。档案后来被毁，他的歌靠后人的抄本流传下来。
    relic: 一页树皮纸
    relic_desc: 一页树皮纸，上面有彩绘符号和几行歌。
    points:
      p1: 在花园的树下听他的歌
      p2: 走过他规划的引水渠
      p3: 把一首歌抄到纸上
  maya_codices_mani:
    name: 马尼的那些书
    place: 马尼
    figure: 玛雅书吏
    story: 1562年7月，在马尼，修士迭戈·德·兰达下令在广场上烧掉玛雅人的书和图像。如今整个世界只剩下寥寥几部彩绘的玛雅书。
    relic: 一册彩绘树皮书
    relic_desc: 一册折叠的树皮纸书，上面是彩绘的符号和人像。
    points:
      p1: 看那些彩绘的书页
      p2: 在白天的酷热里站在广场上
      p3: 不被察觉地坐到一位老书吏身旁
  rongorongo_rapa_nui:
    name: 无人能读的木板
    place: 拉帕努伊岛
    figure: 拉帕努伊人
    story: 拉帕努伊岛上刻着朗格朗格符号的木板只留下约二十来块。今天没有人能读懂，会读的人在1860年代死去或被带走了。
    relic: 一块刻字的木板
    relic_desc: 一块平整的木头，刻着一行行小小的人形。
    points:
      p1: 研究那些成行的符号
      p2: 陪记得那些的老人坐坐
      p3: 听懂老人念出的古老吟唱
  dunhuang_library_cave:
    name: 封起来的洞窟
    place: 莫高窟
    figure: 敦煌的僧人
    story: 约在1000年前后，几万件写本和绘画被封进莫高窟的一个小洞里。没有记载说为什么，直到1900年洞窟才重新打开。
    relic: 一卷卷轴
    relic_desc: 一卷纸，上面用稳当的字抄着一部经。
    points:
      p1: 把卷子捆好存放
      p2: 读捆上的标签
      p3: 墙砌起来时陪僧人们待着
  nalanda_library:
