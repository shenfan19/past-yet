  keats_rome:
    name: 台阶旁的小屋
    place: 罗马
    figure: 约翰·济慈
    story: 1820 年 11 月，患肺结核的约翰·济慈与画家约瑟夫·塞文来到罗马，住进西班牙台阶旁的西班牙广场 26 号。1821 年 2 月 23 日夜里他在那里去世，2 月 26 日葬在塞斯提乌斯金字塔旁的墓园。照他的意思，墓碑上没有他的名字。
    story_prose:
      opening:
        - 1820 年 11 月中旬，罗马。二十五岁的诗人约翰·济慈患着肺结核，和画家约瑟夫·塞文住进西班牙台阶脚下、西班牙广场 26 号的二楼。他在短短几年里写出了包括颂诗在内的主要作品，这是他的最后一个冬天。
        - 史实里，医生詹姆斯·克拉克给他定下饥饿疗法，每天一条凤尾鱼、一片面包，还一次次给他放血；塞文一个人照看他，钱很快断了，夜里也睡不成；他到最后都相信自己没有留下什么，照他的意思，墓碑上不刻名字。在这条分支里，台阶脚下有个卖紫罗兰的卖花人，楼梯上有个常问起楼上病人的邻居。
        - 这一趟用得上几种人：懂医护、拦得住放血的人，或带着一本现代医护手册的人；守得住长夜、自己也熬得住的人，带着睡眠调节器也行；读过书、懂诗的人，说得出他的诗以后的样子。
      outcomes:
        all: 2 月 23 日深夜，济慈去世，塞文守在床边。最后那几个月，他吃得上热汤和面包，也听人说过，他的诗以后会一直有人读。三天后，他葬在塞斯提乌斯金字塔旁的墓园，墓碑上照他的意思没有刻名字。
        p3: 2 月 26 日，他葬在塞斯提乌斯金字塔旁的墓园，墓碑上照他的意思没有刻名字。西班牙台阶旁那间屋子后来留了下来，窗还朝着广场。
        p2: 最后那几个月，桌上不再只有一条凤尾鱼和一片面包。1821 年 2 月 26 日，他葬在塞斯提乌斯金字塔旁的墓园。
        p1: 2 月 23 日深夜，济慈去世，塞文一直守在床边。五十多年后，塞文也葬进了那片墓园，就在济慈旁边。
      none: 一月里，塞文熬垮了，倒在隔壁屋里。2 月 23 日深夜，桌上还摆着那一片面包和一条凤尾鱼，床边的椅子空着。
      desync: 一月里，塞文倒下了。{staff}被召回时，他和衣躺在隔壁屋里，那封写了一半的信还摊在桌上，墨水瓶没有盖。
      not_admitted: '{staff}没能进这栋楼，只在台阶脚下的船形泉边打了几回水。卖花人问起楼上是谁病了，{staff}答不上来，二楼那扇窗一直关着。'
      points:
        p2:
          class_medical: 12 月 9 日早上，济慈咳出了两杯血。克拉克医生来了，挽起他的袖子，说要再放八盎司；桌上摆着这一天的饭，一条凤尾鱼，一片面包。{staff}懂医护，按住病人的手腕，说这样放下去人撑不住，又把他这几天吃下去的东西一样样报给医生听，医生把刀收了回去。那天中午，塞文端上来一碗热汤和一块面包。济慈靠在枕头上，一勺一勺喝完了，把空碗递回给他。
          else: 12 月 9 日早上，济慈咳出了两杯血。克拉克医生来了，挽起他的袖子，说要再放八盎司；桌上摆着这一天的饭，一条凤尾鱼，一片面包。{staff}翻开带来的现代医护手册，指着书页上的一段念给医生听，又把病人这几天吃下去的东西一样样写在纸上，摊在医生面前，医生把刀收了回去。那天中午，塞文端上来一碗热汤和一块面包。济慈靠在枕头上，一勺一勺喝完了，把空碗递回给他。
        p1:
          class_medical: 1 月 15 日，塞文在信里写，银行把汇票退了回来，手里的钱只够再付一回房租；济慈不让他离开视线，他出不了门画画挣钱，夜里也没睡过一个整觉。{staff}懂护理，接过了夜里的班，隔一阵扶济慈起来咳，替他擦汗、换枕巾，天快亮时才把灯捻小。塞文和衣睡在隔壁，靴子也没脱。早上他醒过来，先推开门朝床上看了一眼，又回去把那封没写完的信写完了。
          else: 1 月 15 日，塞文在信里写，银行把汇票退了回来，手里的钱只够再付一回房租；济慈不让他离开视线，他出不了门画画挣钱，夜里也没睡过一个整觉。{staff}守得住夜，搬一把椅子坐在床边，让塞文去隔壁睡，病人一翻身，就起来看一眼。塞文和衣睡在隔壁，靴子也没脱。早上他醒过来，先推开门朝床上看了一眼，又回去把那封没写完的信写完了。
        p3:
          class_lettered: 二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}读过他的书，坐到床边，说起他的几首颂诗：以后会有人一遍遍地读、一句句地背，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。
          class_teaching: 二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}教过书，坐到床边，说起以后的课堂上，会有学生把他的颂诗一句句背到最后一行，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。
          else: 二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}在床边坐下，慢慢说起他的诗以后的事：会有人一遍遍地读、一句句地背，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。
      excerpts:
