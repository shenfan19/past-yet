    quote: 如果说我看得更远，那是因为我站在巨人的肩膀上。
    authors:
      - AI
      - Fan Shen
  einstein:
    who: 爱因斯坦
    quote: 重要的是不要停止提问。
    authors:
      - AI
      - Fan Shen
  faraday:
    who: 法拉第
    quote: 只要不违背自然规律，再奇妙的事也可能是真的。
    authors:
      - AI
      - Fan Shen
  feynman:
    who: 费曼
    quote: 第一条原则是不要欺骗自己，而你恰恰是最容易被骗的人。
    authors:
      - AI
      - Fan Shen
  pasteur:
    who: 巴斯德
    quote: 机遇只青睐有准备的头脑。
    authors:
      - AI
      - Fan Shen
  carr:
    who: 卡尔
    quote: 历史是历史学家与事实之间不断的互动，是现在与过去之间没有尽头的对话。
    authors:
      - AI
      - Fan Shen
  santayana:
    who: 桑塔亚那
    quote: 不能记住过去的人，注定要重蹈覆辙。
    authors:
      - AI
      - Fan Shen
  ranke:
    who: 兰克
    quote: 历史只想说明事情本来是怎样的。
    authors:
      - AI
      - Fan Shen
  simaqian:
    who: 司马迁
    quote: 究天人之际，通古今之变，成一家之言。
    authors:
      - AI
      - Fan Shen
  hippocrates:
    who: 希波克拉底
    quote: 人生短暂，技艺长久。
    authors:
      - AI
      - Fan Shen
  thucydides:
    who: 修昔底德
    quote: 这部著作是为了成为一份永久的财富。
    authors:
      - AI
      - Fan Shen
catalog:
  pythagoras_croton:
    name: 以数为万物本质的学派
    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 在克罗顿，一个团体把数学、音乐和生活当作同一门功课来学，比例成了和谐的钥匙。
    relic: 单弦琴的弦
    relic_desc: 一根绷紧的弦，按在简单的比例上能发出和谐的音。
    points:
      p1: 听出弦长的比例
      p2: 被学派接纳旁听
      p3: 沉默听满前几年
  thales_miletus:
    name: 不借神明解释自然
    place: 伊奥尼亚米利都
    figure: 泰勒斯
    story: 米利都的泰勒斯去找事物的自然原因，传说他预言过一次日食。
    relic: 一颗琥珀珠
    relic_desc: 在布上擦一擦就能吸起羽毛，是电最古老的谜。
    points:
      p1: 看他怎样量金字塔的影长
      p2: 不借神明地把道理讲给港口的人
      p3: 等到一个晴朗的时辰
  socrates_athens:
    name: 一生都在发问
    place: 雅典
    figure: 苏格拉底
    story: 苏格拉底一生都在追问正义和美德是什么，受审时他选择守住提问，而不是保全自己。
    relic: 一只朴素的陶杯
    relic_desc: 一只普通的杯子，被留下来，是因为那个最后的夜晚。
    points:
      p1: 与他对话而不被问倒
      p2: 在广场上做他不嫌烦的熟人
      p3: 站完整个审判的下午
  hippocrates_kos:
    name: 把医学当作细致的观察
    place: 科斯岛
    figure: 希波克拉底
    story: 在科斯岛，一位医生和他的学派教人：疾病有自然的原因，要守在床边仔细看。
    relic: 一根青铜探针
    relic_desc: 一件细细的器具，属于宁愿多看也不乱猜的医生。
    points:
      p1: 在床边记下病程
      p2: 照看同屋的病人
      p3: 同学徒们一起记录
  plato_academy:
    name: 最早的学园
    place: 雅典
    figure: 柏拉图
    story: 柏拉图在雅典城外的树林里办起学园，一个把数学和哲学放在一起学习的地方。
    relic: 一块蜡板
    relic_desc: 木板上的字迹可以抹平，再写一遍。
    points:
      p1: 跟上学园里的论证
      p2: 把对话整理成文
      p3: 在学园门口替这个话题说话
  aristotle_lyceum:
    name: 给生物世界分类
    place: 雅典
    figure: 亚里士多德
    story: 在吕克昂学园，亚里士多德和学生描述动植物，并写出第一套系统的逻辑。
    relic: 一枚贴了标签的贝壳
    relic_desc: 一个标本集里的贝壳，每件都写着希腊文名字。
    points:
      p1: 在海岸边认出他分类的鱼
      p2: 整理标本箱
      p3: 陪学生们边走边辩
  euclid_alexandria:
    name: 从几条公理推出几何
    place: 亚历山大
    figure: 欧几里得
    story: 欧几里得《几何原本》第一卷第一命题在一条给定线段上作等边三角形。约公元前 300 年的亚历山大是本篇虚构课业的背景。
    relic: 一把青铜圆规
    relic_desc: 两条臂和一个轴，足够画出书里的每一个图形。
    points:
      p1: 从给定线段跟着作图
      p2: 誊图时分清两个圆心
      p3: 说清作出的三角形为什么三边相等
    vignettes:
      intersection: 学生凭眼力点出第三点。你添画第二道弧，两弧一交，他就看得出那个点该落在哪儿。
      reason: 学生伸手摸尺以前，你先问三边为何相等。他回头看两个圆心，沿着每一边找回一段半径。
      clean: 你帮忙清抄图，把试画的痕迹去掉。学生补回你差点擦掉的圆弧，下一个人得看见那个点怎么来的。
  archimedes_syracuse:
    name: 浮力与杠杆
    place: 西西里锡拉库扎
    figure: 阿基米德
    story: 阿基米德弄清了东西为什么会浮起来，传说答案是在浴缸里想到的。
    relic: 一块浴室海绵
    relic_desc: 来自浴缸故事里的一块朴素海绵。
    points:
      p1: 跟上杠杆的比例
      p2: 向宫里的人解释浮力怎样验出真金
      p3: 在沙盘前守到他画完
  eratosthenes_alexandria:
    name: 用影子量地球
    place: 亚历山大与赛伊尼
    figure: 埃拉托色尼
    story: 埃拉托色尼比较两座城市正午的影子，估出了地球的大小，结果出奇地接近。
    relic: 一根日晷针
    relic_desc: 一根朴素的立杆，影子告诉他太阳的角度。
    points:
      p1: 核对赛伊尼井里的影子
      p2: 在烈日下量步距
      p3: 把测量做完
  hypatia_alexandria:
    name: 讲授数学与天文
    place: 亚历山大
    figure: 希帕提娅
    story: 希帕提娅在亚历山大教数学、天文和哲学，被人记作那座城最有名的女学者。
    relic: 一块星盘的盘面
    relic_desc: 刻着星位的黄铜圆盘，用来找星星和时辰。
    points:
      p1: 加入讨论
      p2: 跟上她的几何
      p3: 不被察觉地穿过人群
  fibonacci_pisa:
    name: 印度阿拉伯数字传入欧洲
    place: 比萨
    figure: 斐波那契
    story: 比萨的莱昂纳多于 1202 年写《计算之书》。现传的 1228 年修订本开篇说明九个印度数字和零。本篇市场算账为虚构。
    relic: 一块写着数字的蜡板
    relic_desc: 板上把十个新数字和旧的罗马数字并排写在一起。
    points:
      p1: 读合计时把零所在的位也算进去
      p2: 说明数字移一位后为何变值
      p3: 两份抄件送出市集前核对一次
    vignettes:
      gap: 账房照抄合计时跳过空栏。你把零填回空处，请他再读一遍，这才和原先算出的数一致。
      tokens: 你把几枚算子分列摆在柜台上。账房把一枚挪到下一列，接着讲给你听，怎么同一个记号这时就表示了另一个数。
      copy: 两份合计马上要带出市集。两位送单人分头走之前，你请账房把两份都念一遍。
  giotto_padua:
    name: 有分量、有感情的人物
    place: 帕多瓦
    figure: 乔托
    story: 斯克罗威尼礼拜堂将帕多瓦现存的乔托壁画定年为 1303 至 1305 年。画面沿墙分层展开。本卡里领人看画的场面为虚构。
    relic: 一罐蓝颜料
    relic_desc: 磨好的蓝色，是礼拜堂穹顶的颜色。
    points:
      p1: 沿墙找出这一层的下一幕
      p2: 顺着画中人的手势往下看
      p3: 找一个能同时看见两幕的位置
    vignettes:
      eye: 访客总从面孔最清楚的地方看。你请他把视线拉回画角，看看接下来会往哪儿去。他顺着画中人的手势，看到了下一部分。
      register: 访客要直接往正下方一层接着看。你在空中沿墙比出看画的顺序。他往前走几步，找到了刚才在找的那一幕。
      step: 你陪访客往后退，直到两幕能一起看见。他指出一处刚才站在画底下看不见的细节。
  dante_ravenna:
    name: 用街头的语言写一部长诗
    place: 拉文纳
    figure: 但丁
    story: 但丁《天堂篇》末尾写到太阳和其他星辰。卡片在但丁晚年的拉文纳虚构一场读诗。薄伽丘后来讲过梦中得知遗稿下落的故事，属于流传下来的文学轶闻。
    relic: 一片月桂叶
    relic_desc: 诗人桂冠上的一片干叶。
    points:
      p1: 翻页时跟住上一行诗
      p2: 听出接到下几行的韵
      p3: 帮读诗的人找到这篇的结尾
    vignettes:
      dream: 你问誊写员，做个梦能不能知道丢了的诗章在哪儿。他放下灯：「梦兴许能叫你去找。到了地方，你打算读什么？」你在报告里注明，托梦是后来流传的故事。
      ear: 一行诗念完，誊写员正要停。你请他再念几行，听见下一个韵落下再说。翻页以后，这回听着像刚才的话还在往下走。
      stars: 熄灯前，你帮誊写员找到最后一行。走到街上时，他还记得诗里的星辰。
  gutenberg_mainz:
    name: 用活动金属字模印书
    place: 美因茨
    figure: 古腾堡
    story: 现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。本趟前往虚构的早期工坊，看的是一张试排页。
    relic: 一粒铅字
    relic_desc: 铅锡合金的一个小字，是反着的。
    points:
      p1: 帮学徒把拆下的活字分好
      p2: 把试印的纸送到读样的桌上
      p3: 找出校样里漏掉的字
    vignettes:
      wrong_sort: 学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。
      reader: 你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。
      proof: 你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。
  leonardo_florence:
    name: 画画的人，也画机器
    place: 佛罗伦萨
    figure: 列奥纳多·达·芬奇
    story: 卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。本卡的作坊场景是虚构的。
    relic: 一页镜像书写的笔记
    relic_desc: 一页反着写的字，要对着镜子才读得出。
    points:
      p1: 说清一处明暗过渡在哪里
      p2: 帮学徒核对双手的位置
      p3: 给下次坐像留好原来的位置
    vignettes:
      shadow: 你请学徒指一指，脸从哪儿结束，背景从哪儿开始。他伸手又犹豫了，没有加重那道线，先把交界处留着再看。
      hands: 访客记得脸，却把手的位置画变了。你把习作和他凭记忆画的图并排，让他自己找出线条挪到了哪里。
      seat: 学徒收拾东西时，你在地上替模特的椅子做了个记号。他把画留在半成处，下次来仍知道椅子该放哪儿。
  copernicus_frombork:
    name: 太阳在中心
    place: 波兰弗龙堡
    figure: 哥白尼
    story: 《天体运行论》于 1543 年在纽伦堡印行，书中论述地球自转并绕太阳运行。弗龙堡的阅读场景为游戏虚构。
    relic: 一个黄铜象限仪
    relic_desc: 四分之一圆，用来量星星的高度。
    points:
      p1: 找出观察者站在哪里
      p2: 把两张不同的图分开放
      p3: 顺着转动走完一圈，看视线怎样变
    vignettes:
      walk: 你请读者绕着凳子走，眼睛一直看着对面墙上的一点。他走到一半停住了，没想到凳子对着墙看起来挪了那么远。
      frame: 你把「观察者」和「被观察者」写在两张纸上。读者一张一张翻过去，比较同一个视运动的两种解释。
      diagram: 你把书页转过去，让读者看见整个轨道。他按住地球的位置，你沿着图找一年中视线方向怎样变化。
  vesalius_padua:
    name: 照着人体画出来的解剖学
    place: 帕多瓦
    figure: 维萨里
    story: 维萨里出版《人体构造》，书里的人体是照着解剖画的，而不是照着旧权威写的。
    relic: 一把解剖刀
    relic_desc: 一片窄窄的刀刃，先看再信。
    points:
      p1: 对照图与尸体
      p2: 稳住手术刀
      p3: 解剖前后的善后
  shakespeare_globe:
    name: 人人都能进的剧场
    place: 伦敦
    figure: 威廉·莎士比亚
    story: 《亨利五世》的开场合唱请观众想象舞台呈现不了的地点和事件。此剧属于环球剧场早期演出时期，本篇的排练是虚构的。
    relic: 一支鹅毛笔
    relic_desc: 削好的羽毛笔，笔尖上还有墨。
    points:
      p1: 找一个能听清接词的位置
      p2: 帮演员在没有布景时交代身在何处
      p3: 留下来再核对一遍上场信号
    vignettes:
      back_row: 你站到院场边缘，听不见尾字时就举手。演员再试一遍，这一次转过身朝向观众。
      space: 你问演员怎么把整片乡野塞上几块台板。他指着一道门，请你穿过去，走得像刚赶了一整天路。
      cue: 你听清了哪一个字是下一人上场的信号。他们再试一次，这回字音一落，门便开了。
  galileo_padua:
    name: 木星身边的卫星
    place: 帕多瓦
    figure: 伽利略
    story: 伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。
    relic: 一片磨制的透镜
    relic_desc: 一片小小的玻璃透镜，是手工磨出来的。
    points:
      p1: 比较两个夜晚的观测图
      p2: 把散页按观测日期排好
      p3: 标出还需复核的光点位置
    vignettes:
      alignment: 你拦住正要把两页按纸边对齐的誊写员。先对齐木星吧。纸一挪，几个光点就错开了。
      telescope: 你追问第四个光点是哪一个。誊写员摊开几晚的图，反问你：有两个点挨得看不清时，该相信哪一夜？
      dates: 誊写员叠起散页之前，你替每张补上日期。下一个人就能按夜看出光点怎样换了位置。
  descartes_leiden:
    name: 把怀疑当作方法
    place: 莱顿
    figure: 笛卡尔
    story: 笛卡尔的《谈谈方法》1637 年在莱顿刊行，随附光学、气象和几何三篇论文。本卡读书场景为虚构。
    relic: 一张折起来的小纸条
    relic_desc: 纸条上只有一句话，讲思考与存在。
    points:
      p1: 把例题分成几个小问题
      p2: 请读者指出支撑结论的一步
      p3: 找一道例子，同方法放在一起读
    vignettes:
      parts: 读者卡在整道题里。你标出能先解决的一小问。他先做完这一部分，才翻到写答案的那页。
      claim: 另一位读者说结果显而易见。你请他指出究竟是哪一步让结果这样明白。他们重读例子中段，两人之前都没在这里停过。
      contents: 你把讲方法的一页同例题一起翻开。读者把纸签从自己喜欢的那条规则，移到了能看见它如何使用的一页。
  leeuwenhoek_delft:
    name: 一滴水里的世界
    place: 代尔夫特
    figure: 列文虎克
    story: 列文虎克 1676 年 4 月从代尔夫特寄出的信记录了他的观察，并附白蜡木切面和酒中鳗状小动物的图。本篇读信的会面为虚构。
    relic: 一块小黄铜透镜板
    relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
    points:
      p1: 把图对到信里的那段说明
      p2: 让图和样品标签放在一起
      p3: 给没看过透镜的人读一遍观察
    vignettes:
      motion: 通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。
      label: 桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。
      read: 你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。
  newton_cambridge:
    name: 苹果与月亮服从同一条定律
    place: 剑桥
    figure: 艾萨克·牛顿
    story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。送去付印的誊清稿不是他的笔迹，抄写的人是汉弗莱·牛顿，这几年做他的抄写助手，与他不是亲戚。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
    relic: 一块玻璃三棱镜
    relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
    points:
      p1: 读懂第三卷里把月亮和落体放在同一条定律下的那一页
      p2: 靠翻译芯片读拉丁文，向学院的杂役问清誊好的稿子要送到哪里去
      p3: 等到誊清的稿子装箱，送去付印
    vignettes:
      apple: 你问学院的一位杂役：「听说苹果砸了他的头？」这位杂役是游戏里编出来的。他接着扫地：「砸没砸我不知道。你倒说说，月亮怎么不掉下来？」你一时答不上，回头去看那一页。苹果这件事，要再过六十五年才有人写下来。
      hand: 誊清的稿子不是书上署名那个人的笔迹。杂役说，抄写的是汉弗莱先生，也姓牛顿，不是亲戚。你把这一条记在本子上，没有去打扰他。
      diagram: 你在一张废纸上画出月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。杂役不认得拉丁文，盯着那支箭头看了好一阵。
  bach_leipzig:
    name: 一位乐长为每个礼拜日写曲
    place: 莱比锡
    figure: 约翰·塞巴斯蒂安·巴赫
    story: 1723 年 5 月 30 日，巴赫在莱比锡以康塔塔《困苦人必得吃饱》BWV 75 开启任职后的演出。本篇的排练和歌者是虚构的。
    relic: 一根小风琴管
    relic_desc: 一根调好音、试过音的小管子，没有卖掉。
    points:
      p1: 听出另一个声部给的提示
      p2: 帮歌者过了休止还跟得上
      p3: 让两人在同一页谱上都看得清
    vignettes:
      entry: 你听出低声部比歌者预想的早到一口气。你请他换到屋子另一边听。这次，提示还没来，他就抬起了头。
      rest: 歌者一唱到休止就数乱。你抄下等待时能听到的另一行，他在自己开口前的那个字上做了记号。
      light: 两人合看一页谱。你把纸转向有光的地方，扶住不动，直到两人都看见自己的声部从哪儿分开。
  smith_kirkcaldy:
    name: 一个国家怎样变富
    place: 苏格兰柯卡尔迪
    figure: 亚当·斯密
    story: 亚当·斯密 1776 年出版的《国富论》开篇用制针来说明分工。卡片在柯卡尔迪安排一场虚构的桌边演示。
    relic: 一枚别针
    relic_desc: 他用来说明分工威力的那种别针。
    points:
      p1: 说清桌边演示里的一道工序
      p2: 看一件东西怎样交到下一手
      p3: 从各人的小事讲清整张桌子如何配合
    vignettes:
      queue: 工人给最快的那道工序多放了几枚算子。你请他数一数慢的那道前还积了多少，第二遍他就换了排法。
      handoff: 两个人同时去够同一只盘，后头那只却没人拿。你把做完的件移到下一人随手能取的地方，碰撞声这才停下。
      walk: 你听每个人讲自己负责的一小段。要弄清一根针经过哪些手，你得从桌子一头走到另一头。
  kant_konigsberg:
    name: 理性能知道什么，不能知道什么
    place: 柯尼斯堡
    figure: 伊曼努尔·康德
    story: 沉默了十一年之后，康德发表了《纯粹理性批判》。这本书卖得很慢，最早的书评也出自误读它的人。
    relic: 一根手杖
    relic_desc: 一个人的手杖，他每天散步准时到邻居拿他对表。
    points:
      p1: 陪他吃漫长的午饭（善良的人，或教师、图书管理员、历史学者）
      p2: 留意问题底下的那个问题
      p3: 写出第一篇真正读懂它的书评
  mozart_prague:
    name: 布拉格喜爱的歌剧
    place: 布拉格
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特的《唐璜》在布拉格首演，这座城早已把他的《费加罗》放进了心里。
    relic: 一页乐谱手稿
    relic_desc: 字迹又快又干净，几乎没有涂改。
    points:
      p1: 听出总谱里的小心思
      p2: 被邀进后台
      p3: 替他向剧院说话
  lavoisier_paris:
    name: 化学有了新语言
    place: 巴黎
    figure: 拉瓦锡
    story: 拉瓦锡 1789 年出版的《化学基础论》用质量测量解释化学变化，把氧视为参与燃烧的物质。
    relic: 一台精密天平
    relic_desc: 一台精细的天平，给化学记账。
    points:
      p1: 把数字对回各自栏头
      p2: 核对相邻两栏的间距
      p3: 把更正的表格读回给排字工
    vignettes:
      units: 两个数字对得很齐，其中一行的单位却串了列。排字工固定版面之前，你把它指了出来。
      air: 你问表格为什么还要记下看不见的东西。排字工指了指「加入」和「剩余」两栏，把两个栏头都保留在校样上。
      proof: 排字工念表时，你拿纸条压住正在读的那一行。原本看起来属于下一例的数字，重新对回了自己的栏头。
  jenner_berkeley:
    name: 第一支疫苗
    place: 英国伯克利
    figure: 爱德华·詹纳
    story: 詹纳 1798 年出版的《探究》回顾了较早的牛痘与天花观察和病例。卡片以 1796 年的伯克利为背景，关于怎样记观察的交谈是虚构的。
    relic: 一把玻璃小刀
    relic_desc: 一片很薄的刀片，划下第一道小口。
    points:
      p1: 听挤奶女工说起牛痘
      p2: 照看接种后的孩子
      p3: 说服疑虑的母亲
    vignettes:
      firsthand: 虚构的誊写员把每则记载都誊成了同一种口气。你问哪一件是记述者亲眼见过的。他在其余条目旁补上说明，没把每一行都当成同一等证据。
      order: 抄件里两条观察换了位置。你核对日期，誊写员先把纸签调回来，才照先后讲述。
      blank: 誊写员有一条无法确定，你在下面留了地方。纸递出去以前，空白旁添上说明，免得后来人当成漏抄。
  beethoven_vienna:
    name: 第九交响曲
    place: 维也纳
    figure: 路德维希·凡·贝多芬
    story: 音乐会海报记录了贝多芬《第九交响曲》于 1824 年 5 月 7 日在维也纳克恩特纳门剧院首演。场景里的引座员和观众为游戏虚构。
    relic: 一只助听喇叭
    relic_desc: 世界静下来的时候，他举到耳边的号角。
    points:
      p1: 给迟到的客人找个地方等候
      p2: 顺着节目单认出演出进度
      p3: 不打断演出，把门口让出来
    vignettes:
      voice: 你指给引座员看台上的歌者。客人正要问交响曲里为什么有人唱，第一声响起，他便把话咽了回去。
      step: 迟到的客人一直没看清脚下那级台阶。你陪他在门边站了一会儿，等他看清，再把人领进去，一整排座位都不用起身。
      programme: 引座员把节目单借给你。你用手指按住眼下这一项，客人就知道哪首还在后头。
  faraday_london:
    name: 从磁里得到电
    place: 伦敦
    figure: 迈克尔·法拉第
    story: 1831 年 8 月 29 日，法拉第记录了铁环上线圈实验中指针的短暂偏转。
    relic: 一个铁环和线圈
    relic_desc: 软铁环上绕着两组线圈。
    points:
      p1: 记下指针何时偏转
      p2: 在图上分清两组绕线
      p3: 让下一位读者看得懂这条记录
    vignettes:
      instant: 助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。
      skeptic: 你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。
      sketch: 你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。
  darwin_galapagos:
    name: 岛屿与生命的多样
    place: 加拉帕戈斯群岛
    figure: 查尔斯·达尔文
    story: 达尔文 1835 年随小猎犬号到访加拉帕戈斯。他的鸟类笔记把嘲鸫标本和各自采集的岛对应起来。船上帮手核对标签的一幕为虚构。
    relic: 一根雀的羽毛
    relic_desc: 来自群岛的一根小小的褐色羽毛。
    points:
      p1: 注意到别人没注意到的
      p2: 熬过远航
      p3: 帮他整理标本（头脑好的人或管档案的人）
    vignettes:
      two_tags: 一张签只写了「岛上」。你把它搁到一边，等帮手找来另记的上岸记录。盘子即便收好，两件标本也还能分清。
      differences: 帮手指着两只相似的鸟，准备合写一条。你问它们各来自哪座岛。他把两个标签都留在册上，下次好重新比较。
      drawer: 帮手能把地名念回给你以前，你一直把签放在盘旁。抽屉关上时，纸签仍在对应的标本旁。
  lovelace_london:
    name: 第一段程序
    place: 伦敦
    figure: 阿达·洛芙莱斯
    story: 洛芙莱斯 1843 年发表的译注中，注 G 用表格列出了拟议中的分析机计算伯努利数的操作。
    relic: 一张穿孔卡
    relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
    points:
      p1: 找出一个稍后还会用到的值
      p2: 向校对员讲清一项操作
      p3: 在校样旁留下阅读提示
    vignettes:
      repeat: 你标出一组操作从哪里重复。校对员刚才只数了一遍，便顺着你的记号重走后面的几行。
      music: 你问这几列能不能代表乐音。校对员反问，机器怎么知道乐音该遵循什么规则？你把这个问题记在图旁，准备带回去。
      row: 你拿纸挡住下一行，先把眼前这行讲明白。校对员这才看清，刚写出的值在哪儿还会再用。
  nightingale_scutari:
    name: 把护理做成用数据和关怀的学科
    place: 奥斯曼斯库塔里
    figure: 弗洛伦斯·南丁格尔
    story: 弗洛伦斯·南丁格尔 1858 年的军队卫生报告依据战时经验，收入医院统计。本卡在 1855 年斯库塔里虚构一个病房报表的誊写场景。
    relic: 一盏小油灯
    relic_desc: 她夜里查房时用的那盏灯。
    points:
      p1: 懂病房的活儿（医护人员）
      p2: 安抚伤员
      p3: 撑过漫长的夜班
    vignettes:
      totals: 虚构书记员把转房名单也算进新收治人数。你问哪些名字是刚入院的。他另留一栏记转房，再把报表送出去。
      name: 书记员隔着嘈杂声没听清名字。你在报名字的人身旁等他再说一遍，下一份抄件就照他给的拼法写。
      fold: 书记员念哪一处，你就按顺序放哪一页。原来夹在合计后面那张，这次先送到了他手里。
  mendel_brno:
    name: 豌豆与遗传的规律
    place: 布尔诺
    figure: 格雷戈尔·孟德尔
    story: 孟德尔在 1865 年报告豌豆杂交结果，1866 年刊出的论文列了计数并比较所得比例。
    relic: 一只豌豆荚
    relic_desc: 修道院花园里的一只干豆荚。
    points:
      p1: 计数时分清两种形状
      p2: 完成计数并保留原数
      p3: 给下一个读者留下可复核的记录
    vignettes:
      ratio: 听讲人把数约成了一个整齐的比例。你把原始计数留在页边，请他从这些数重新算一遍。
      label: 两张纸签看着很像。你翻过来才发现，其中一张写的是亲代。听讲人把它从后代的计数旁移开。
      tally: 听讲人画正字时，你逐粒念出两种形状。数完，你把正字留在合计旁，让别人也能复核。
  mendeleev_petersburg:
    name: 元素周期表
    place: 圣彼得堡
    figure: 门捷列夫
    story: 门捷列夫在 1869 年发表早期元素周期系统，把原子量和化学性质的相似性用来排列元素。现存的 1871 年版记录了随后调整的排法。
    relic: 一副元素卡片
    relic_desc: 手写的卡片，可以像摆纸牌一样摆。
    points:
      p1: 沿着表格找出同一组元素
      p2: 把空格保留在原位
      p3: 向读者说明一项反复出现的性质
    vignettes:
      blank: 你趁读者还没开抄，先用铅笔轻轻划出栏线。遇到空格，他想把下一项挪回来，你顺着栏线指给他看，那项该和谁排在一起。
      similarity: 你问为什么原子量相近的两项分开排。读者翻找各自的性质，在两个数旁各补记一项化学性质。
      heading: 读者要裁纸贴进笔记，你帮他先把抄来的那行加上行名。折页再次展开时，他仍看得懂那几个数。
  pasteur_paris:
    name: 狂犬病疫苗
    place: 巴黎
    figure: 路易·巴斯德
    story: 巴斯德和同事给一个被疯狗咬伤的男孩打了第一针狂犬病疫苗，孩子活了下来。
    relic: 一只鹅颈瓶
    relic_desc: 弯曲的瓶颈挡住灰尘，让空气进去。
    points:
      p1: 跟上接种的时间表
      p2: 守着男孩
      p3: 熬过十几针
  curie_paris:
    name: 两种新元素
    place: 巴黎
    figure: 玛丽·居里
    story: 钋和镭的发现公布于 1898 年。玛丽·居里 1911 年的诺贝尔演讲回顾了这两项发现，以及随后为确定镭的性质所做的工作。卡中编辑场景为虚构。
    relic: 一管沥青铀矿
    relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
    points:
      p1: 分清两次发现的报告
      p2: 把日期对回相应消息
      p3: 校样交出去前把所声称的结果写准确
    vignettes:
      two_notices: 排字工把两条消息排在同一天名下。固定版面之前，你把先后两张纸分开，各自标上月份。
      word: 你发现标题把话说成了工作已经全做完。排字工把报告念了一遍，最后在标题里只留报告能支持的话。
      heading: 你扶着第二张校样，等上面的元素名核过一遍。排字工让两条都能单独读清，没把谁移进另一栏。
  freud_vienna:
    name: 把梦当作进入内心的路
    place: 维也纳
    figure: 西格蒙德·弗洛伊德
    story: 弗洛伊德出版《梦的解析》，一本改变了人们谈论心灵方式的书。
    relic: 一座书房里的小塑像
    relic_desc: 他放在书桌上的小古物之一。
    points:
      p1: 留意没说出口的话
      p2: 做耐心的倾听者
      p3: 不下判断地听满整个小时
  cajal_barcelona:
    name: 神经细胞是一个个独立的单位
    place: 巴塞罗那
    figure: 圣地亚哥·拉蒙-卡哈尔
    story: 卡哈尔于 1889 年刊行有插图的组织学手册。西班牙国家研究委员会藏有他后来绘制的视网膜结构及传导方向图。本卡在 1889 年的巴塞罗那安排一段虚构的描图练习。
    relic: 一支极细的绘图笔
    relic_desc: 细到能画出神经元每一条分支的笔。
    points:
      p1: 沿一根分支找到它的起点
      p2: 把标注与组织结构线分开
      p3: 留一个明确问题，方便下次复看
    vignettes:
      crossing: 学生把交叉的两笔连起来。你让他分别往回找起点。两条脉络对过一遍，有一处连线被他擦掉了。
      legend: 粗箭头盖住了一根细分支。你把箭头移到图外，请学生补图例，两种线就都看得见了。
      blank: 你在画不准的末端旁留了一块白。学生在那里写了个问题，准备下回再看，没凭记忆把线拖长。
  marconi_bologna:
    name: 信号穿过空气
    place: 博洛尼亚
    figure: 古列尔莫·马可尼
    story: 马可尼在自家田野上发出了一个两端之间没有电线的信号，并一直把距离往远推。
    relic: 一支检波管
    relic_desc: 一支装着金属屑的小玻璃管，遇到无线电波就醒过来。
    points:
      p1: 看出信号是怎么来的
      p2: 在山坡架天线
      p3: 说服家里人出钱
  imhotep_saqqara:
    name: 第一座大型石头金字塔
    place: 埃及萨卡拉
    figure: 伊姆霍特普
    story: 国王左塞尔的建筑师伊姆霍特普被认为设计了阶梯金字塔，那是最早的大型切石建筑之一。
    relic: 石匠的木槌
    relic_desc: 被许多只手磨得光滑的木槌。
    points:
      p1: 量石定位
      p2: 在烈日下拉石
      p3: 看懂阶梯式的设计
  enheduanna_ur:
    name: 第一位留名的作者
    place: 美索不达米亚乌尔
    figure: 恩赫杜安娜
    story: 乌尔的女祭司恩赫杜安娜给女神伊南娜写下赞歌，并署了名，是我们所知最早留名的作者。
    relic: 一块雪花石膏圆盘
    relic_desc: 圆盘上刻着一位女祭司在献祭。
    points:
      p1: 听她吟唱给神的赞美诗
      p2: 获准进入神庙
      p3: 把泥板抄下来
  hammurabi_babylon:
    name: 刻在石头上的法律
    place: 巴比伦
    figure: 汉谟拉比
    story: 卢浮宫藏古巴比伦石碑刻有财产、交易、劳作等方面的条文。碑的最初陈列地点并不确定，本卡的对读场景为虚构。
    relic: 一枚泥印滚筒
    relic_desc: 一个小石柱，在泥上一滚就留下签名。
    points:
      p1: 从条文开头的条件读起
      p2: 用虚构例子讲明一条规则
      p3: 找出两份抄本从哪里开始不同
    vignettes:
      condition: 学徒念条件时漏过一个字。你请他从条首重念，听的人这才弄清什么时候才有这项义务。
      case: 学徒两次答得一样。你换了假设例子里的一个细节再问，他只好回去看写明财物种类的那一行。
      edge: 你把练习泥板挪到斜光能照到楔痕的地方。学徒从第一个字起一路念了下来。
  lalibela_rock:
    name: 向下凿进岩石的教堂
    place: 埃塞俄比亚拉利贝拉
    figure: 拉利贝拉与石匠们
    story: 石匠们从整块岩石里向下凿出一组教堂，没有一块石头是垒上去的。
    relic: 石匠的凿子
    relic_desc: 一把铁凿子，刃口磨得很薄。
    points:
      p1: 向下凿墙
      p2: 高原上日夜劳作
      p3: 看懂排水的设计
  ife_bronzes:
    name: 金属铸出的逼真头像
    place: 尼日利亚伊费
    figure: 伊费的铸造匠人
    story: 伊费的匠人用黄铜和铜铸出逼真的头像，后来的访客甚至不相信那是本地的手艺。
    relic: 一个小铜头像
    relic_desc: 巴掌大的头像，脸上有细细的刻痕。
    points:
      p1: 蜡模的细节
      p2: 守着铸炉
      p3: 看出头像的比例
  great_zimbabwe:
    name: 不用灰浆的石头城
    place: 津巴布韦马斯温戈
    figure: 大津巴布韦的建造者
    story: 建造者用切好的花岗岩块不加灰浆垒起高墙，那里是一个商贸王国的中心。
    relic: 一只皂石鸟
    relic_desc: 立在矮柱上的一只雕刻小鸟。
    points:
      p1: 干砌石墙
      p2: 搬运整日的石块
      p3: 读出墙的曲线
  timbuktu_sankore:
    name: 一座手稿之城
    place: 马里廷巴克图
    figure: 曼萨·穆萨与桑科雷的学者们
    story: 廷巴克图成了学者们抄写、收藏法律、天文和医学书的中心。
    relic: 一页点金的手稿
    relic_desc: 页边有一圈金粉。
    points:
      p1: 翻看手稿
      p2: 修补手稿
      p3: 撒哈拉边缘的干热
  al_haytham_cairo:
    name: 用实验检验光
    place: 开罗
    figure: 伊本·海赛姆
    story: 在开罗写作的伊本·海赛姆，在暗室里检验光是怎么走的，证明我们看见东西，是因为光进了眼睛。
    relic: 一块小孔屏
    relic_desc: 一块暗板，上面只有一个小孔。
    points:
      p1: 追问视觉如何发生
      p2: 帮他造暗室
      p3: 一个晴朗的日子
  house_of_wisdom:
    name: 学者们翻译天下的书
    place: 巴格达
    figure: 花拉子米与智慧宫
    story: 在巴格达，学者们翻译希腊、波斯和印度的著作，并往前走得更远，花拉子米给代数起了名字。
    relic: 一只黄铜墨水瓶
    relic_desc: 一个带盖的小墨池。
    points:
      p1: 跟上翻译的术语
      p2: 校对译本
      p3: 向赞助人解释翻译的价值
  ibn_sina_hamadan:
    name: 用了几百年的医学全书
    place: 波斯哈马丹
    figure: 伊本·西那
    story: 伊本·西那写完《医典》，这部书从波斯到欧洲被教了好几百年。
    relic: 一只玻璃小瓶
    relic_desc: 医生用的带塞的小瓶。
    points:
      p1: 跟上他的医学
      p2: 读懂阿拉伯文和波斯文
      p3: 读完《医典》
  omar_khayyam_nishapur:
    name: 比我们更精确的历法
    place: 波斯内沙布尔
    figure: 欧玛尔·海亚姆
    story: 欧玛尔·海亚姆和其他天文学家改革历法，定出的一年长度非常接近真值。
    relic: 一卷星图
    relic_desc: 一卷卷起来的恒星图。
    points:
      p1: 核对太阳年的长度
      p2: 抄写历表
      p3: 向宫廷说明历法
  al_jazari_diyarbakir:
    name: 一本奇巧机械之书
    place: 迪亚巴克尔
    figure: 加扎里
    story: 加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。本卡的工坊示范为虚构。
    relic: 一个黄铜凸轮
    relic_desc: 一个有形状的轮子，把转动变成往复。
    points:
      p1: 在图上找到能看见的人偶
      p2: 说清两个人偶出现的先后
      p3: 帮学徒把图留到来客也看得懂
    vignettes:
      sequence: 学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。
      viewer: 来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。
      paper: 学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。
  ibn_battuta_tangier:
    name: 三十年的旅程
    place: 摩洛哥丹吉尔
    figure: 伊本·白图泰
    story: 伊本·白图泰离开丹吉尔去朝圣，一路走了大约三十年，几乎走遍当时已知的世界。
    relic: 一只走旧的凉鞋
    relic_desc: 一只补过很多次底的皮凉鞋。
    points:
      p1: 随商队走一段沙漠
      p2: 在异乡的宫廷里自我介绍
      p3: 在客栈里听他讲故事
  ulugh_beg_samarkand:
    name: 一座天文台和一份星表
    place: 撒马尔罕
    figure: 兀鲁伯
    story: 兀鲁伯建了一座大天文台，发表的星表在好几个世纪里没有谁比它更精确。
    relic: 大弧的一块碎片
    relic_desc: 曾用来测星的石弧的一块残片。
    points:
      p1: 核对星表
      p2: 校准六分仪
      p3: 高台上的寒夜
  laozi_hangu:
    name: 五千言说道
    place: 中国函谷关
    figure: 老子
    story: 传说老子出函谷关时被请求写下他的学说，于是留下了短短的《道德经》。
    relic: 一枚小铜牛铃
    relic_desc: 据说他骑的那头牛脖子上的铃。
    points:
      p1: 同关令一起听
      p2: 读出五千言里的静处
      p3: 等到最后一章写完
  confucius_qufu:
    name: 有教无类
    place: 中国曲阜
    figure: 孔子
    story: 孔子教各种出身的学生，讲礼、讲学，也讲怎样做一个好人。
    relic: 一根竹简捆绳
    relic_desc: 被反复翻读磨细的一根绳。
    points:
      p1: 坐在弟子中间
      p2: 回答他的追问
      p3: 陪他挨过断粮的几天
  buddha_sarnath:
    name: 第一次说法
    place: 印度鹿野苑
    figure: 悉达多·乔达摩
    story: 在鹿野苑，佛陀第一次说法，讲苦，也讲走出苦的路。
    relic: 一片压平的菩提叶
    relic_desc: 叶脉像一张地图。
    points:
      p1: 听第一次说法
      p2: 留意五位同伴脸上的变化
      p3: 陪着走完一段路
  cai_lun_luoyang:
    name: 廉价造纸
    place: 中国洛阳
    figure: 蔡伦
    story: 《后汉书》记蔡伦于元兴元年（105）奏上造纸法，列出树肤、麻头、敝布和鱼网。纸坊试纸的场面为游戏虚构。
    relic: 一张粗纸
    relic_desc: 纸里还看得见纤维的碎屑。
    points:
      p1: 帮纸坊帮工接住一张试纸
      p2: 晾之前找出一处厚薄不匀
      p3: 等到样纸能完整揭下来
    vignettes:
      light: 你把两张试纸举到窗前。搁在板上看着平整的一块，透光却多得多。帮工在旁边别了个记号。
      ink: 帮工递来摸着更滑的那张。你请他先用同一支笔在两张上都试一下。后来认得更清的，倒是墨痕更小的那张。
      tag: 你还没来得及问哪张是哪张，帮工已经端起晾纸板。你把写好字的两块纸签摆在旁边，好让他回头还能比较。
  zhang_heng_luoyang:
    name: 一台能感知远处地震的仪器
    place: 中国洛阳
    figure: 张衡
    story: 张衡造了一只青铜器，远处发生地震时，龙口会把一颗球朝震来的方向吐下去。
    relic: 一颗铜球和龙口
    relic_desc: 一颗小球，下面的蟾蜍张口接住。
    points:
      p1: 看懂八个方向的机关
      p2: 校准铜丸
      p3: 向官员解释这台仪器
  zu_chongzhi_jiankang:
    name: 圆周率精确到七位
    place: 中国建康
    figure: 祖冲之
    story: 祖冲之算出圆周率介于 3.1415926 和 3.1415927 之间，这个纪录保持了大约九个世纪。
    relic: 一束算筹
    relic_desc: 一捆细细的小棍，摆开就是数字。
    points:
      p1: 跟上割圆术
      p2: 反复割圆
      p3: 把算法讲给学生
  aryabhata_patna:
    name: 转动的地球与正弦表
    place: 印度库苏马普拉
    figure: 阿耶波多
    story: 阿耶波多写了一部短书，里面有正弦表、一个很好的圆周率，还有地球在转动的想法。
    relic: 一片棕榈叶经文
    relic_desc: 一片薄叶，上面刻着诗句。
    points:
      p1: 跟上正弦表的算法
      p2: 背诵并复述一节诗体算法
      p3: 向天文学家解释地球自转
  brahmagupta_bhillamala:
    name: 零也是一个数
    place: 印度比拉马拉
    figure: 婆罗摩笈多
    story: 婆罗摩笈多给出了用零和负数做运算的规则，把它们当作和别的数一样的数。
    relic: 一片画着小圆圈的棕榈叶
    relic_desc: 一片叶子，上面有个代表“没有”的小圆圈。
    points:
      p1: 接受零也是一个数
      p2: 向商人解释负数就是债
      p3: 把规则抄成偈颂
  li_bai_changan:
    name: 关于酒、月和远方的诗
    place: 中国长安
    figure: 李白
    story: 《清平调》三首传为李白所作。附录讲了宫中演唱的故事，属于后来的记述。本卡在 750 年的长安安排一段虚构相遇，诗作和轶闻并非定年于这一年。
    relic: 一只小酒杯
    relic_desc: 杯底画着一弯淡淡的月。
    points:
      p1: 听出两句之间转折在哪里
      p2: 问清一个演唱故事是怎样传下来的
      p3: 把诗抄得清楚，留给下一个歌者
    vignettes:
      verse: 唱到不贴曲的一行，歌者停住。你请他先念，再唱一次。第二遍换气，恰好落在诗意转过去的地方。
      palace: 歌者听你问那晚宫里有哪些人，便放下抄诗，问你读的是哪段记载。你在旁写下，诗和讲那一夜的故事各有来处。
      copy: 歌者标出每次唱到都会停一下的地方，你一直替他翻开那页。带走诗句时，你还记得要在哪一处听那一停。
  murasaki_kyoto:
    name: 世界上第一部伟大的长篇小说
    place: 京都
    figure: 紫式部
    story: 紫式部日记记载，1008 年有人借《源氏物语》中的人物开玩笑，可见故事当时已在宫中为人所知。游戏里的闲谈为虚构。
    relic: 一只漆制笔盒
    relic_desc: 一只小盒子，里面有笔、砚和水。
    points:
      p1: 分清人物名和屋里随口叫的称呼
      p2: 在闲谈打断后接上朗读的线索
      p3: 还回纸页时保留读到的位置
    vignettes:
      nickname: 你听见有人叫小说里的人名，转头找错了人。侍女看出来了，笑问你是不是又在门口偷听人念故事。
      voice: 你听出侍女念到故事里的信时换了语气，请她照原来的声音再念一次。第二遍听来，话里竟少了几分笃定。
      return: 念到一半，纸页传到你手里。你按住刚停下的地方，免得换回去时还得猜从哪里接着念。
  su_song_kaifeng:
    name: 一座水力驱动的大钟楼
    place: 中国开封
    figure: 苏颂
    story: 苏颂《新仪象法要》图文记载水运仪象台，上有观测仪器，另有随钟鼓报时的木人。卡片用 1088 年作工程进行中的虚构工坊背景。
    relic: 一枚齿轮的齿
    relic_desc: 一个与人一样高的齿轮上的一颗青铜齿。
    points:
      p1: 认出图上的仪象台部件
      p2: 分清两组试报的声音
      p3: 帮看守给来看的人腾出清楚的站位
    vignettes:
      listen: 你站到门外，看不见木人。看守敲了两组试声。你依次复述，他拿标签逐一对上。
      layers: 看守手指着这层，嘴里却讲的是上面那层。你沿图一层层划过去，请他下一次演示前给声音各标一行。
      marker: 你在模型外做了个站位标记。下一对来看的人能见到门开，也不挡看守自己的视线。
  shen_kuo_runzhou:
    name: 什么都记下来的笔记
    place: 中国润州
    figure: 沈括
    story: 沈括在《梦溪笔谈》中记下，磨过的磁针指南，却常微微偏东。卡片用润州时期的年份安排一段虚构的读书场景。
    relic: 一根磁化的针
    relic_desc: 每次都指向同一个方向的针。
    points:
      p1: 认出磁针指南的一端
      p2: 纸转动之后仍能认清标记的方向
      p3: 把「微微偏东」写进图注
    vignettes:
      directions: 你问读者哪一条是正南。他纸上只有一道线。你添上另一道，书里那个微小的偏角才看得出来。
      ends: 读者把纸转过来给你看，口头重述时却换了针的两头。你趁他还没誊进本子，标明哪一头指南。
      copy: 你请读者在图旁保留那个「微」字。图画了一整页，书上说的偏差可没那么大。
  angkor_wat:
    name: 一座城那么大的庙
    place: 柬埔寨吴哥
    figure: 高棉的建造者们
    story: 高棉的建造者们建起了巨大的吴哥窟，回廊上有长长的石雕浮雕。
    relic: 一块砂岩飞天碎片
    relic_desc: 一张巴掌大的雕刻脸。
    points:
      p1: 在湿热里搬石
      p2: 对齐石块
      p3: 读懂浮雕的次序
  sejong_hangul:
    name: 人人都学得会的字母
    place: 首尔
    figure: 世宗大王与学者们
    story: 1446 年刊行的《训民正音》解例本说明了世宗在 1443 年完成的文字。本卡以 1443 年为背景，识字练习是虚构的。
    relic: 一块刻着字母的木板
    relic_desc: 刻着最早几个字母的木板，等着上墨。
    points:
      p1: 听出这个音节从哪里起音
      p2: 把属于同一音节的字形排在一起
      p3: 帮习字人把熟悉的词再读出来
    vignettes:
      gesture: 你把那个音放慢，直到习字人能说清舌头在哪里。他回到纸上的字形，这次不用你领读就试了一遍。
      spacing: 习字人把几部分排成一长行。你用方框圈起属于同一组的几笔，请他合起来读成一个音节。
      lesson: 习字人念出一个熟词，忘记的部分空着。你把前面的例字盖上，等他想起来，自己把空处填了。
  li_shizhen_qizhou:
    name: 一千多种药物的汇编
    place: 中国蕲州
    figure: 李时珍
    story: 李时珍多年野外调查，完成《本草纲目》，记载了近两千种药物。
    relic: 一只药臼
    relic_desc: 一只带着一点绿渍的小石臼。
    points:
      p1: 上山采药
      p2: 核对药名
      p3: 抄编目
  basho_hiraizumi:
    name: 奥州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 芭蕉以 1689 年行旅为素材，后来写成《奥之细道》。平泉一节从眼前景物想到旧事，收有咏夏草的俳句。本篇歇脚是虚构的。
    relic: 一顶草笠
    relic_desc: 被雨淋灰了的编织草帽。
    points:
      p1: 与同行旅人一起走到歇脚处
      p2: 停下时看清景物的一点变化
      p3: 带回一个亲眼看见的细节
    vignettes:
      grass: 旅人问你在看什么。你等草再动了一下才回答。后来写下这个地方，你先想起的是草动的样子，才想起地名。
      accounts: 旅人讲的旧事里，有个地方比眼睛能看到的还远。你把故事和所见分两行记，接着问这名字是从哪听来的。
      sandal: 你挪开包袱，让旅人把湿草鞋摊平。再次出发之前，两人还有空指认山脊上的一处地方。
  hokusai_edo:
    name: 神奈川冲浪里
    place: 日本江户
    figure: 葛饰北斋
    story: 葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。版画铺的会面是虚构的。
    relic: 一块印刷用的木版
    relic_desc: 一块雕好的樱木版。
    points:
      p1: 从浪形之间找出富士山
      p2: 给柜台前的客人讲清一处细节
      p3: 给展示的印本留出题签和落款
    vignettes:
      mountain: 版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。
      edge: 版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。
      counter: 一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。
  bose_calcutta:
    name: 会回应的植物
    place: 加尔各答
    figure: 贾格迪什·钱德拉·博斯
    story: 博斯造出极精细的仪器，能显示植物对触碰和光的反应，他还研究无线电波。
    relic: 一个植物生长记录仪的部件
    relic_desc: 一根把植物的生长放大一万倍的杠杆。
    points:
      p1: 看含羞草的叶子在电针下动
      p2: 在英国学者面前展示
      p3: 校准记录仪
  tagore_santiniketan:
    name: 亚洲第一个文学诺贝尔奖
    place: 印度圣蒂尼克坦
    figure: 罗宾德拉纳特·泰戈尔
    story: 诗人、词曲作者、办学者泰戈尔获得诺贝尔文学奖。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的亲笔。
    points:
      p1: 听树下的课
      p2: 同学生们一起坐
      p3: 把课讲完
  ramanujan_madras:
    name: 一封寄给哈代的信
    place: 马德拉斯
    figure: 斯里尼瓦瑟·拉马努金
    story: 马德拉斯的一位职员把几页结果寄给英国的哈代，哈代一眼就看出那是天才之作。
    relic: 一块石板
    relic_desc: 一块学生用的石板，写了擦、擦了写好多次。
    points:
      p1: 看懂他的公式
      p2: 替他把信写到被读到
      p3: 做他的朋友
  franklin_philadelphia:
    name: 闪电就是电
    place: 费城
    figure: 本杰明·富兰克林
    story: 富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。印工之间的谈话为虚构。
    relic: 一条丝带和一把钥匙
    relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
    points:
      p1: 从纸上找出有记载的观察
      p2: 分开写信日和事发日
      p3: 把改好的说法念回给印工
    vignettes:
      cloud: 印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。
      date: 你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。
      proof: 印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。
  morse_washington:
    name: 上帝做了何等的事
    place: 华盛顿
    figure: 塞缪尔·莫尔斯
    story: 1844 年 5 月 24 日，莫尔斯从美国国会大厦向巴尔的摩的阿尔弗雷德·韦尔发送电报。留存的纸带记录了信号；莫尔斯注明文句由安妮·埃尔斯沃思建议。报告里的练习电文为虚构。
    relic: 一只电报键
    relic_desc: 一根黄铜杠杆，拇指放的地方磨亮了。
    points:
      p1: 认出练习纸带上各处分隔
      p2: 把电文和发报人的记录放在一起
      p3: 把收文同原来的字句核对
    vignettes:
      gap: 报务员从一道短空隙另起了一个词。你和他把纸带倒回来读，终于找到下一个人读来也合适的分隔。
      credit: 你问打在纸带上的话是谁想的。报务员在簿上记了发报人，你另外留了一格给先提这句话的人。
      readback: 报务员把纸带递给你，没告诉你预定的文句。你先完整读一遍，末了才打开纸条核对。
  edison_menlo_park:
    name: 一盏能一直亮着的灯
    place: 新泽西门洛帕克
    figure: 托马斯·爱迪生
    story: 在门洛帕克，爱迪生的团队试验了玻璃泡里的一根炭化细丝，能亮好几个小时，之后又建起了一整套系统。
    relic: 一只炭丝灯泡
    relic_desc: 玻璃泡里有一根头发丝细的圈。
    points:
      p1: 守着真空泵
      p2: 挑出能烧得久的灯丝
      p3: 陪他不睡地试验
  wright_kitty_hawk:
    name: 在空中的十二秒
    place: 北卡罗来纳基蒂霍克
    figure: 奥维尔和威尔伯·莱特
    story: 奥维尔·莱特日记记载，1903 年 12 月 17 日在基蒂霍克附近共试飞四次，随后兄弟俩把消息电告父亲。本篇抄写消息的场面为虚构。
    relic: 一片螺旋桨叶
    relic_desc: 一片木头叶子，像一只扭过的翅膀。
    points:
      p1: 分清首次飞行和后面的几次
      p2: 把数字对回对应的试飞
      p3: 留一份脱离草记仍读得懂的消息
    vignettes:
      numbers: 报务员把最长的时长写到了第一次旁边。你把草记推回去，趁数字还没发走，与他重新数一遍四次试飞。
      headline: 你一开头就提了个大标题。报务员问，哪几个字给另一份报纸抄过去还说得通？你重写一遍，这回留下了日期和地点。
      copy: 报务员删短消息时，你把草记扶平。两张拿来一对，该让家里知道的数字都还看得清。
  tenochtitlan_lake:
    name: 建在湖上的城市
    place: 墨西哥特诺奇蒂特兰
    figure: 墨西卡的建造者们
    story: 墨西卡人把城建在湖心的岛上，有堤道、运河，还有堆土做成的浮动园圃。
    relic: 一片绿松石镶嵌片
    relic_desc: 一小片蓝色石头。
    points:
      p1: 在湖上干活
      p2: 垒浮田
      p3: 看懂水路
  machu_picchu:
    name: 山上严丝合缝的石头城
    place: 秘鲁马丘比丘
    figure: 印加的建造者们
    story: 印加的建造者们在山脊上用严丝合缝的石头建起梯田和神庙，水由石槽引进来。
    relic: 一块切好的石头
    relic_desc: 一块巴掌大的石头，边是直的、正的。
    points:
      p1: 高海拔砌石
      p2: 对齐石缝
      p3: 看出排水设计
  maya_venus_tables:
    name: 几个世纪里追踪着金星
    place: 墨西哥奇琴伊察
    figure: 玛雅书吏们
    story: 玛雅书吏在彩绘树皮纸书里记录金星的运行表，几个世纪都很准。
    relic: 一条彩绘树皮纸
    relic_desc: 一条树皮纸，上面有红黑的字符。
    points:
      p1: 对照金星周期
      p2: 抄写表格
      p3: 顶着烈日
  sequoyah_syllabary:
    name: 一个人造出来的文字
    place: 美国东南部切罗基地区
    figure: 塞阔雅
    story: 塞阔雅为切罗基语创制的音节文字于 1821 年获得采用。这套符号表记音节。现存印刷品见证其早期使用，本趟识读练习是虚构的。
    relic: 一张音节表
    relic_desc: 一张纸，八十多个字符排成行。
    points:
      p1: 把字形对回完整的音节
      p2: 把练习纸送给另一位读者
      p3: 核对另一位读者是怎么念的
    vignettes:
      sound: 你等对方先按平常速度念完，再慢慢念一遍。读者一音节指一字，等到对方能自己指着念下去。
      lookalike: 有个字形让你想起以前认得的字母。读者请你听完一整个音节再猜。你擦掉了刚才随手标上的英文字母。
      note: 你把一张练习纸送到屋子另一边。另一位习字人没听过你口述，却照纸念了出来，两人便对着听自己念得是否一样。
  finlay_havana:
    name: 蚊子与黄热病
    place: 哈瓦那
    figure: 卡洛斯·芬莱
    story: 卡洛斯·芬莱 1881 年在哈瓦那提出黄热病蚊媒传播的假说，论文题目也表明其假说性质。核对印刷摘要的交谈为虚构。
    relic: 一片蚊子的玻片标本
    relic_desc: 一片标本，里面有一只蚊子的翅。
    points:
      p1: 看蚊子叮咬的时刻
      p2: 照看黄热病人
      p3: 逐日记录一整年的病例
    vignettes:
      headline: 虚构的编辑把一个推测写成了确定的事。你慢慢念回原题，他在校样交出去前把「假说」两字补回去。
      columns: 编辑把笔记里每一行都照同一种意思念。你划成所见和所推两栏，有一句移到了另一边。
      place: 你核对宣读论文的地点。编辑把地名记在日期旁，后来的报道才不会把会议说成另一场。
  bell_boston:
    name: 电线里的声音
    place: 波士顿
    figure: 亚历山大·格雷厄姆·贝尔
    story: 贝尔通过电线向隔壁房间的助手说话，电话就这样诞生了。
    relic: 一只电话听筒
    relic_desc: 一个木制听筒，里面有一片薄薄的振膜。
    points:
      p1: 听懂声音怎样变成电流
      p2: 在地下室里接线
      p3: 向评审说明电线里真有声音
  budj_bim_eels:
    name: 熔岩平原上的养鱼
    place: 澳大利亚维多利亚州布吉比姆
    figure: 贡迪玛拉人
    story: 贡迪玛拉人在熔岩流上修出水渠和堰，把鳗鱼拦住养起来，这套系统的年代可追到几千年前。
    relic: 一只编织的鳗鱼笼
    relic_desc: 一只长筐，口像漏斗。
    points:
      p1: 垒起引水石堰
      p2: 看水位怎样被调节
      p3: 被允许在一旁看养鳗
  galois_paris:
    name: 决斗前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽罗瓦
    story: 伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。卡中分拣纸页为虚构。
    relic: 一封匆忙写就的信
    relic_desc: 写满算式的信页，页边写着没有时间了。
    points:
      p1: 认出留给下一位读者的问题
      p2: 把纸页按论证顺序排好
      p3: 替信留下原有的日期与收信人
    vignettes:
      check: 誊写员把一个问题夹进了结论。你顺着信查到末尾的请求，他另标出下一个读信人要核对哪件事。
      sequence: 两页都从同一个符号起笔。你分别读了末行，找出论证先用哪一页。誊写员补上页码。
      fold: 你扶着信，等誊写员抄好日期和收信人。他把笔记另折一份，后来还找得出两套纸。
  van_gogh_auvers:
    name: 奥维尔的夏天
    place: 奥维尔
    figure: 文森特·梵高
    story: 梵高 1890 年 7 月在奥维尔写信，提到自己画了不安的天空下大片延展的麦田。卡中的访客和散步是围绕这些作品写的虚构情节。
    relic: 一管铬黄颜料
    relic_desc: 一支挤瘪的锡管，里面是他画麦田用的那种黄。
    points:
      p1: 看同一片田上方的天空怎样变
      p2: 走到看得出路通往哪儿的地方
      p3: 帮访客带回一张看得明白的草图
    vignettes:
      sky: 你请访客把同一片地画两遍，先只留一条天，再多留些。他从第二幅里指出了一件原先没留意的东西。
      wind: 访客觉得麦秆全朝一个方向，停下来画。你等到下一阵风，暗下去的一块换了地方，两人就另记一笔，不必擦去第一眼。
      path: 你走到访客看得清田路尽头的位置。回去时他没把尽头画进去，却已说得清路通到哪儿。
  abel_froland:
    name: 来得太晚的信
    place: 弗罗兰
    figure: 尼尔斯·亨里克·阿贝尔
    story: 阿贝尔证明了一般五次方程无法用根式求解，二十六岁死于肺结核。柏林邀他任职的信随后才到。
    relic: 一封封着的信
    relic_desc: 一封没拆开的聘书，用细线系着。
    points:
      p1: 替他的证明说话
      p2: 陪他待在寒冷的屋子里
      p3: 替他留一份干净的手稿（档案员或固执的人更合适）
  riemann_selasca:
    name: 最后一篇论文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 黎曼 1854 年的讲稿讨论几何的基本假设及距离如何定义。本卡保留 1866 年马焦雷湖畔的地点，虚构一位读者琢磨讲稿里的一个问题。
    relic: 一页笔记
    relic_desc: 一页写着没完成公式的纸，字很小。
    points:
      p1: 沿着表面走完一条线
      p2: 比较时仍用原来标好的两个端点
      p3: 讲明一次测量所用的一个假设
    vignettes:
      surface: 读者把纸带从一点拉到另一点，中间却离开了曲面。你把另一条沿弧面按下去，请他分清两条量的是哪种走法。
      assumption: 读者说距离一看就知道。你问哪些走法算数，是怎么定的。他把这个条件添在图上方，重新开始量。
      paper: 练习纸弯起来时，你帮读者留住起讫两点的记号。现在比较两次读数时，不必重新找点。
  du_chatelet_luneville:
    name: 法语版牛顿
    place: 吕内维尔
    figure: 埃米莉·迪沙特莱
    story: 迪沙特莱翻译并加注的牛顿《原理》完整法译本，于她去世后的 1759 年刊行。卡中 1749 年的读稿场景为虚构。
    relic: 一只墨水瓶
    relic_desc: 一只小墨水瓶，来自一张通宵写字的书桌。
    points:
      p1: 找出评注正在解释的那句原文
      p2: 帮读者把两份文字对齐
      p3: 给下一次读稿留下清楚的标记
    vignettes:
      source: 读者顺着一句直接念到下一句。到评注开头处，你请他停一下。再翻回第一页，他已能认出是哪一位作者在解释。
      diagram: 你问这段话画出来该是什么样。读者先画了个方向，又回去翻文字，确认箭头该落在哪儿。
      mark: 你把夹在下一页的纸签移到读者想回看的那一行。散页收起来时，问题仍和原段夹在一起。
  noether_gottingen:
    name: 署着别人名字的课
    place: 哥廷根
    figure: 埃米·诺特
    story: 诺特在 1918 年的论文中说明，在给定条件下，变分问题的连续对称性与相应守恒关系之间的联系。本卡的讨论小练习为虚构。
    relic: 一张课程通告
    relic_desc: 一张厅里的通告，应该写她名字的地方写着希尔伯特。
    points:
      p1: 认出例子里做的变换
      p2: 讨论结论前把前提再读一遍
      p3: 帮听讲者分清对称性和守恒的量
    vignettes:
      clock: 你问把同一个例子往后推一会开始，规则会不会变。听讲者挪了钟上的起点，在页边重画图，原规则一笔没动。
      assumption: 听讲者记住了结论，却跳过了前提。你把前提另写一条，请他说出怎样改例子，这张纸条就不再适用。
      board: 黑板要擦时，你先抄下两个栏头。听讲者把所做的变换和保持恒定的量分列记在下面。
  wegener_greenland:
    name: 越过冰盖
    place: 格陵兰冰盖
    figure: 阿尔弗雷德·魏格纳
    story: 1930 年，魏格纳运送补给抵达冰盖内陆站艾斯米特，在回程中去世。阿尔弗雷德·魏格纳研究所的档案说明记下了行程，并指出格陵兰同行者拉斯穆斯·威卢姆森的姓名。清点场景为虚构。
    relic: 一条雪橇皮带
    relic_desc: 一条冻硬的皮带，系过满载的雪橇。
    points:
      p1: 在严寒里跟上队伍
      p2: 留意天气正在变
      p3: 把雪橇拉到行程的尽头
    vignettes:
      names: 虚构的办事员只在远征一栏写下一个姓。你问是谁把那份东西交到站上的。他给其他参与的人另留了一行，没有只记最著名的姓名。
      count: 办事员把出发的数写得像到站的数。你请他在每项数字旁标上是哪一站的记录，两项合计便不再挤在同一个栏头下。
      note: 办事员收拢账本时，你把目的地另抄一张。后来的人仍能看出这些条目记的是哪一站。
  boltzmann_duino:
    name: 海边的原子
    place: 杜伊诺
    figure: 路德维希·玻尔兹曼
    story: 玻尔兹曼被病痛和多年关于原子是否真实的争论拖得疲惫不堪，去杜伊诺度晚夏假期，九月在那里去世。
    relic: 一截粉笔
    relic_desc: 一截用得很短的讲课粉笔。
    points:
      p1: 在旧争论里站到他这边
      p2: 陪他沿着海岸走走
      p3: 做一个安静而稳定的陪伴（医生、护士或善良的人更合适）
  cantor_halle:
    name: 无穷的大小
    place: 哈雷
    figure: 格奥尔格·康托尔
    story: 康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。本卡的 1884 年阅读场景为虚构。
    relic: 一叠索引卡片
    relic_desc: 卡片上写满了永远列不完的清单。
    points:
      p1: 说明例表打算列进哪些数
      p2: 照同一规则再添一项
      p3: 列出一些数后，说清还要证明什么
    vignettes:
      list: 学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。
      after: 学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。
      end: 你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。
  tesla_wardenclyffe:
    name: 没有建成的塔
    place: 长岛肖勒姆
    figure: 尼古拉·特斯拉
    story: 特斯拉在沃登克里弗建起一座高塔，想用空气传送信息和电力。资金耗尽，塔始终没有完工。
    relic: 一只玻璃绝缘子
    relic_desc: 一只沉重的玻璃绝缘子，来自实验室的线路。
    points:
      p1: 理解这座塔背后的想法（工程师或电工更合适）
      p2: 向出资人陈述理由
      p3: 做一位认真看待它的来访者
  mozart_requiem_vienna:
    name: 未完成的安魂曲
    place: 维也纳
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特病倒在维也纳，《安魂曲》还没写完。十二月他去世，年仅三十五岁。
    relic: 一页安魂曲手稿
    relic_desc: 一页乐谱，停在一句的中间。
    points:
      p1: 在病房里陪着他
      p2: 跟上他勾勒出的各声部（音乐家或敏锐的头脑更合适）
      p3: 和他一起唱他留下的最后几小节
  schubert_vienna:
    name: 没人听过的歌
    place: 维也纳
    figure: 弗朗茨·舒伯特
    story: 舒伯特在维也纳哥哥的家里去世，年仅三十一岁，许多作品他生前从未听人演奏过。
    relic: 一份歌曲手稿
    relic_desc: 一首运笔很快的歌，墨迹还很深。
    points:
      p1: 听出手稿里的东西（音乐家或敏感的耳朵更合适）
      p2: 做一位上门来的朋友
      p3: 给他弹一首他自己写的歌（音乐家、善良或敏感的人更合适）
  keats_rome:
    name: 台阶旁的小屋
    place: 罗马
    figure: 约翰·济慈
    story: 济慈在 1820 年 11 月 30 日从罗马写给查尔斯·布朗，信里说写信和告别都变得困难。卡中 1821 年的送信差事为虚构。
    relic: 一朵压干的紫罗兰
    relic_desc: 夹在书里的一朵干花。
    points:
      p1: 让外封地址还认得清
      p2: 帮住客送出信而不丢掉附件
      p3: 把离别时怎么说留给写信的人
    vignettes:
      address: 住客递给你的信，地址写得急。你请他只看外头念一遍，出门前补上了漏写的地名。
      farewell: 住客嫌道别太短、听着别扭，想添长些。你让他念一遍。他听完，觉得短的那句原本就是自己说话的样子。
      stairs: 住客找写地址的纸时，你在楼梯上等。等你出门，信折起来也还能看清送往哪里。
  vermeer_delft:
    name: 负债的画家
    place: 代尔夫特
    figure: 约翰内斯·维米尔
    story: 维米尔 1675 年在代尔夫特去世。阿姆斯特丹国立博物馆的展览记录了他家留下的债务，以及卡塔琳娜·博尔内斯向面包商抵押画作的事。核对账页的场景为虚构。
    relic: 一枚珍珠耳环
    relic_desc: 一颗小珍珠，是他常画的那种。
    points:
      p1: 找出能辨认一幅画的细节
      p2: 向记得画的人核对描述
      p3: 誊账时分清抵押与出售
    vignettes:
      motif: 账房记得一幅画里的光，却说不准是哪幅。你问画里的人在做什么。他把动作记在画名旁，后来查的人便有两条线索。
      pledge: 有人把抵押的画抄进了已出售一栏。你翻到早一页，请账房分别说清两个词在账上记的是什么。
      cover: 账房去屋子另一头找画的描述，你替他扶着账本。回来时，该核对的那一页还翻着。
  rembrandt_amsterdam:
    name: 儿子之后
    place: 阿姆斯特丹
    figure: 伦勃朗
    story: 伦勃朗有一幅署年 1669 的《六十三岁自画像》，可见他在去世那年仍在画自己的脸。工坊中的习作场景为虚构。
    relic: 一支画笔
    relic_desc: 一支磨旧的画笔，笔毛里的颜料已经干了。
    points:
      p1: 看出脸转过去时光线哪里变了
      p2: 帮学徒找准能坐住的位置
      p3: 把习作留好，方便回头再看
    vignettes:
      mirror: 学徒总画成自己想象的样子。你请他稍微转过脸，等能说清光落在哪儿，再往下画。
      seat: 学徒歇手前，你在凳脚旁画了道粉笔记号。他回来时不用挪整张桌子，也能坐回原来的角度。
      look: 你陪学徒坐着，等他的眼睛不再急着在镜子和纸之间来回跳。他把画递给你看时还有一角空着，决定先留在那里。
  gaudi_barcelona:
    name: 被电车撞倒
    place: 巴塞罗那
    figure: 安东尼·高迪
    story: 圣家堂诞生立面的圣巴拿巴钟塔于 1925 年完工。1926 年高迪去世时，整座教堂仍未完成。本卡围着图纸说话的一幕为虚构。
    relic: 一个石膏模型
    relic_desc: 一个小小的悬挂式穹顶模型。
    points:
      p1: 在图上认出一处已经完工的部位
      p2: 把图纸和街头所见对一对
      p3: 留条纸片，帮下一位访客认出方向
    vignettes:
      outline: 办事员举起图，让访客一次看见所有塔。你把已经立着的那座涂深一点。出去后，访客便有一处可以先找。
      street: 你请访客先走到下一个街角再抬头。图上那道已经完成的轮廓，在刚才的位置看不见。他记下了自己站在哪里。
      copy: 你把图折回办事员指给你看的那一面交还。他补了个记号，留给下一位从别条街走来的人。
  kafka_kierling:
    name: 疗养院里的校样
    place: 基尔灵
    figure: 弗朗茨·卡夫卡
    story: 卡夫卡 1924 年的《饥饿艺术家》收四篇小说，包括《女歌手约瑟芬，或鼠族》。本卡在基尔灵虚构一位送稿人核对校样。
    relic: 一页校样
    relic_desc: 一页印刷校样，上面有铅笔改的小字。
    points:
      p1: 把目录上的篇名对回正文
      p2: 把更正的记号放到对应行旁
      p3: 收好写了篇名的校样，留清楚顺序
    vignettes:
      sound: 送稿人念出女歌手的篇名，问听见了还有什么可怀疑。你让他把同一句念给两个人听。你还没说话，两人的回答已经不一样。
      mark: 校样上一处记号落在两行之间。你问送稿人，如果手头只有这张纸，他会改哪行。他先把记号移准，免得带回去被人改错。
      packet: 送稿人查目录时，你理平散页。最后一篇另折进去，页码露在外面。
  dickinson_amherst:
    name: 箱子里的诗
    place: 阿默斯特
    figure: 艾米莉·狄金森
    story: 艾米莉·狄金森许多诗以手稿传世。本卡在 1886 年安排一名虚构的早期读者，用手稿核对一页松散的抄件。
    relic: 一册手缝的小本
    relic_desc: 几页手工缝起来的纸，每页一首诗。
    points:
      p1: 认出纸上标着的一处停顿
      p2: 把散页和它接着的几行放一起
      p3: 留下保留异文的一份抄件
    vignettes:
      pause: 读者朗读时把破折号滑了过去。你请他在笔迹断开的地方停一停。再读那一行，他听出了另一种收尾。
      variant: 你看见行上还写了一个词。读者想挑一个抄完就算，你腾出页边，把两个都留着，并注明各在何处。
      stack: 读者整理散页时，你把边缘和笔迹对得上的两张留在一起。下一次清抄，便从这两张并排开始。
  poe_baltimore:
    name: 在巴尔的摩街头被发现
    place: 巴尔的摩
    figure: 埃德加·爱伦·坡
    story: 坡被人发现在巴尔的摩街头神志不清，四天后在医院去世。他最后几天的经过始终没有得到解释。
    relic: 一根手杖
    relic_desc: 一根朴素的手杖，握柄已被磨旧。
    points:
      p1: 在人群里认出他是谁
      p2: 叫来一辆马车把他送进医院
      p3: 让他最后的日子好过些
  sor_juana_mexico_city:
    name: 送走的最后几本书
    place: 墨西哥城
    figure: 胡安娜修女
    story: 胡安娜·伊内斯·德·拉·克鲁斯在 1691 年《答菲洛特亚修女》中回顾自己的求学愿望，也以厨房里的日常观察谈学习。本卡的 1695 年墨西哥城读信场景为虚构。
    relic: 一支羽毛笔
    relic_desc: 一支笔尖裂开的羽毛笔，旁边是空书架。
    points:
      p1: 找出一条来自日常生活的观察
      p2: 连着前后论证把一段读完
      p3: 帮读者留下一道以后还想问的问题
    vignettes:
      aristotle: 读者读到「如果亚里士多德下过厨」的意思就笑了。你递给他一张空纸，请他说一件发生在厨房、值得记下来再问的问题。
      ordinary: 读者一路去找一位学者的名字，跳过了一个日常例子。你把那一段翻回来，他才听出那个名字差点盖过了哪一个问题。
      reply: 读者停在一页，你便替他一直翻那里。他先按住想再看的那一句，才把别的纸还回去。
  mary_anning_lyme_regis:
    name: 崖壁里的骨头
    place: 莱姆里吉斯
    figure: 玛丽·安宁
    story: 1823 年 12 月，玛丽·安宁在莱姆里吉斯发现一具完整的蛇颈龙骨架，她的草图记下了那条长颈。卡片保留 1847 年，用虚构的访客回看早年的图。
    relic: 一枚菊石
    relic_desc: 一枚从蓝色里亚斯岩里敲出来的螺旋形化石。
    points:
      p1: 分清裂纹和骨骼轮廓
      p2: 沿着草图找颈部，别漏掉关节
      p3: 留下一张注明发现者的可用抄图
    vignettes:
      stone: 访客把一条裂缝描成了骨头。你请他沿线继续往下找。那道线离开骨架时，他抬起了笔。
      vertebrae: 你和访客从颈部两头相向数，偏偏在同一处数不到一起。你在那里留了括号，没有顺手添上一块骨头。
      pose: 你转动抄图，直到访客不靠你指也能找出头部。他再把纸转回来，在下面补上标本名。
  hertz_bonn:
    name: 他找到的电波
    place: 波恩
    figure: 海因里希·赫兹
    story: 赫兹证明了电磁波的存在，三十六岁时在波恩经过长期的痛苦病程后去世，没能看到电波的用处。
    relic: 一个火花隙
    relic_desc: 他做实验用过的一个小铜火花隙。
    points:
      p1: 跟着火花穿过房间（工程师、电工或敏锐的头脑更合适）
      p2: 在难熬的日子里陪着他
      p3: 减轻他的一点痛苦
  kepler_leonberg:
    name: 母亲受审
    place: 莱昂贝格
    figure: 约翰内斯·开普勒
    story: 开普勒年迈的母亲卡塔琳娜在莱昂贝格被指控为女巫，他花了几个月为她辩护。
    relic: 一页数表
    relic_desc: 一页行星运行数表，他一直没有停下算。
    points:
      p1: 帮他把案子说清楚
      p2: 陪他熬过漫长的审讯
      p3: 在冰冷的牢房里陪卡塔琳娜坐一会
  pushkin_st_petersburg:
    name: 莫伊卡河畔的两天
    place: 圣彼得堡
    figure: 亚历山大·普希金
    story: 普希金在决斗中受伤，在莫伊卡河畔的寓所里度过了生命的最后两天，死时三十七岁，街上聚着许多人打听他的情况。
    relic: 一本诗集
    relic_desc: 一本小书，某首诗里夹着一片压干的叶子。
    points:
      p1: 做一位他可以直说心里话的朋友
      p2: 在他门外熬过漫长的夜
      p3: 尽量好好照料他（医生、护士或善良的人更合适）
  chekhov_badenweiler:
    name: 黑森林里的医生
    place: 巴登魏勒
    figure: 安东·契诃夫
    story: 契诃夫自己是医生，却患着肺结核，他和妻子奥尔加·克尼佩尔来到黑森林的温泉疗养地巴登魏勒，七月在那里去世，年四十四岁。
    relic: 一副夹鼻眼镜
    relic_desc: 一副系着细绳的小圆眼镜。
    points:
      p1: 像平等的人一样和他交谈
      p2: 留意他身上医生已经知道的事（医生、护士或好奇的人更合适）
      p3: 让他在最后一夜呼吸轻松些
  puccini_brussels:
    name: 未完成的图兰朵
    place: 布鲁塞尔
    figure: 贾科莫·普契尼
    story: 普契尼在布鲁塞尔治疗喉癌，《图兰朵》没有写完，总谱停在柳儿之死不久之后。
    relic: 一页草稿
    relic_desc: 一页用软铅笔写的乐谱草稿。
    points:
      p1: 看懂那些草稿（音乐家或敏锐的头脑更合适）
      p2: 在诊所里做个好伙伴
      p3: 把他最后的草稿收在一起，等到用得上的时候
  schumann_endenich:
    name: 恩德尼希的疗养院
    place: 恩德尼希
    figure: 罗伯特·舒曼
    story: 罗伯特·舒曼在波恩附近的恩德尼希疗养院住了两年，很少有朋友来看他，1856年7月他在那里去世。
    relic: 一支音叉
    relic_desc: 一支小钢叉，发出一个清楚的音。
    points:
      p1: 安静地陪他坐着
      p2: 听出他还在哼的是什么（音乐家或敏感的耳朵更合适）
      p3: 越过紧闭的门去看他
  nietzsche_turin:
    name: 都灵的崩溃
    place: 都灵
    figure: 弗里德里希·尼采
    story: 尼采在都灵精神崩溃，朋友弗兰茨·奥弗贝克从巴塞尔赶来接他回去。那时读他书的人还很少。
    relic: 一张明信片
    relic_desc: 一张字迹狂乱的短笺。
    points:
      p1: 看出他不对劲
      p2: 在街上做一个平静的存在
      p3: 用恰当的话让房东明白事情
  sophie_germain_paris:
    name: 来迟了的学位
    place: 巴黎
    figure: 索菲·热尔曼
    story: 索菲·热尔曼于 1821 年出版弹性曲面的数学研究，讨论振动薄板上观察到的图样。本卡在 1831 年虚构一位读者对着图解释这项研究。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借来的名字写给高斯的信。
    points:
      p1: 辨认图中所示的静止线
      p2: 记清每块薄板在文中怎样说明
      p3: 分别说出图上看得见什么、文字又解释了什么
    vignettes:
      quiet_lines: 读者指着最深的线，猜它动得最厉害。你问当图样出现时，哪一处反而是静的。他回头翻说明，先没再添箭头。
      edges: 两张图看着差不多，直到你们读到文字是怎样处理边缘的。读者把两个条件各自写回对应的图。
      compare: 你把印图并排搁好，在下边给读者留条记字的空。他指出两幅不同之处时，手不必压住任何一幅。
  bizet_paris:
    name: 冷淡的首演
    place: 巴黎
    figure: 乔治·比才
    story: 《卡门》在喜歌剧院首演，反响冷淡，三个月后比才去世，年三十六岁，他不知道这部歌剧后来会传遍世界。
    relic: 一把折扇
    relic_desc: 一把来自池座的彩绘纸扇。
    points:
      p1: 听出观众漏掉的东西（音乐家或敏感的耳朵更合适）
      p2: 在冷场的幕间留在大厅里
      p3: 在钢琴上为他弹哈巴涅拉
  modigliani_paris:
    name: 没人买的肖像
    place: 巴黎
    figure: 阿梅迪奥·莫迪利亚尼
    story: 莫迪利亚尼贫病交加，三十五岁时在巴黎一家医院死于结核性脑膜炎。很少有人买他那些长脸的肖像。
    relic: 一截炭条
    relic_desc: 一截能把手指染黑的炭条。
    points:
      p1: 看出那些长脸里有什么（画家或好奇的眼睛更合适）
      p2: 在画商面前替他说好话
      p3: 在病房里陪着他
  boole_ballintemple:
    name: 湿衣服与一堂课
    place: 科克巴林滕普尔
    figure: 乔治·布尔
    story: 布尔 1854 年出版的《思维规律研究》用代数表示逻辑运算。其中一条规律是，重复同一选择，所得的类不变。本卡的 1864 年阅读练习为虚构。
    relic: 一页逻辑演算
    relic_desc: 一页方程，其中的字母代表是和否。
    points:
      p1: 用例题纸条走完一步运算
      p2: 再选一遍时保留原来的条件
      p3: 说明所得结果为何没有变化
    vignettes:
      repeat: 你请学算者先挑出偶数，再从刚挑出的那一堆里挑偶数。他笑了一声，随后记下为什么第二次挑出的还是原来那一堆。
      border: 学算者没说依据什么，就准备把一张纸同时放进两堆。你请他先说条件。他给各堆贴上标签，再试一遍。
      example: 你把选择过程换成几张能挪动的纸条。学算者抄下结论时，还能指出它对应哪个条件。
  wallace_ternate:
    name: 来自特尔纳特的论文
    place: 特尔纳特
    figure: 阿尔弗雷德·拉塞尔·华莱士
    story: 华莱士一篇署地特尔纳特的文章，于 1858 年 7 月 1 日与达尔文材料一同在林奈学会宣读。刊出的合件仍可分辨两人的文字。装寄的场景为虚构。
    relic: 针盒里的一只甲虫
    relic_desc: 一只收集来的甲虫，放在小锡盒里。
    points:
      p1: 从抄本上找出带日期的题记
      p2: 把稿页按顺序留下再寄
      p3: 在文章里分清观察和推论
    vignettes:
      places: 你看到署地被抄成了题目的一部分。帮手把它放回日期旁，收件人就能看明白文章在哪里署下。
      claim: 帮手以为某句话是观察记载，念出来却是一项推论。你请他指明哪行真的写了所见，他夹着记号把抄件折好。
      mail: 你在外头留一张短笺，里面按序放好稿页。帮手知道哪一页可以单独递给人看。
  hooke_london:
    name: 实验的管理人
    place: 伦敦
    figure: 罗伯特·胡克
    story: 胡克 1665 年的《显微图谱》画出了他在软木中观察到的小格。本卡在他晚年安排一场虚构的图版阅读。
    relic: 一幅跳蚤的图
    relic_desc: 一幅玻璃下跳蚤的精细版画。
    points:
      p1: 从胡克的图版里认出一格边界
      p2: 把软木小格和蜂房图对着看
      p3: 留时间让读者仔细描完一格
    vignettes:
      edge: 读者把每一处断开的边都补成了整格。你盖住半张图，问他哪些线还能从图上认出。再揭开时，他留了几处断线。
      analogy: 你问软木在哪儿就不像蜂房了。读者把图凑到一起，开始指两幅图哪里不同。
      plate: 读者把图凑太近，看散了整片格子。你给他腾开地方，让他往远处拿，再请他只指出其中一格。
  leavitt_cambridge_ma:
    name: 星星的一条规则
    place: 马萨诸塞州剑桥
    figure: 亨丽埃塔·勒维特
    story: 1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。本卡的底片室场景为虚构。
    relic: 一块玻璃底片
    relic_desc: 一块布满细小星点的照相底片。
    points:
      p1: 把图上的点对回表格
      p2: 把周期和亮度成对记下
      p3: 说明为什么在同一片星云里比较
    vignettes:
      rank: 你按周期给表格排序，发现一行丢了标号。读表人在图上的点被挪动前找回了对应的星号。
      distance: 你问近一点的星是不是光看起来就更亮。读表人把手指按在「小麦哲伦云」的标题上，你把为什么选这一组来比记在图旁。
      period: 读表人先报亮度。你再问周期，把两个数一起记，直到最后一个点也画上去。
  bessie_coleman_jacksonville:
    name: 那次练习飞行
    place: 杰克逊维尔
    figure: 贝茜·科尔曼
    story: 贝茜·科尔曼因为美国没有学校肯教她，只好去法国学飞行。她在杰克逊维尔的一次练习飞行中去世，年三十四岁。
    relic: 一副飞行护目镜
    relic_desc: 一副皮护目镜，皮带已经裂了。
    points:
      p1: 和她一起检查飞机（飞行员、机械师或灵巧的手更合适）
      p2: 在机场上分享她的胆量
      p3: 把这一天照她想要的方式过完（飞行员、机械师或固执的人更合适）
  scott_last_camp:
    name: 冰架上的帐篷
    place: 罗斯冰架
    figure: 罗伯特·法尔肯·斯科特
    story: 斯科特日记最后一则署于 1912 年 3 月 29 日。现存手稿记录了南极点归途上的最后营地。本卡虚构的是记录带回来以后的一幕对读。
    relic: 一本日记
    relic_desc: 一本用铅笔写的小日记，被冻得发硬。
    points:
      p1: 在严寒里继续前进
      p2: 照顾他们当中最虚弱的人
      p3: 拉动雪橇，让日记和记录能带回家
    vignettes:
      distance: 回到事务所，虚构书记员把一个数抄进已走路程一栏。你指出那是还没走完的距离。他在抄件入档前把数移了过去。
      blank: 回到事务所，书记员念到最后一个日期停了笔。你等他想好后面的空白该怎么标。他写下「记录到此为止」，才搁下笔。
      opening: 回到事务所，你翻开练习抄本，先读日期再读内容。书记员把同一日期写上封签，下一次还能按顺序找到这一页。
  mallory_everest:
    name: 最后一次被人看见
    place: 珠穆朗玛峰
    figure: 乔治·马洛里
    story: 马洛里在 1924 年远征中留下的信件记述了不同营地的状况和计划。马洛里与欧文的结局无法证明二人是否登顶。营地交信场景为虚构。
    relic: 一把冰镐
    relic_desc: 一把朴素的木柄冰镐，镐头磨旧了。
    points:
      p1: 在漫长的攀登路上跟上队伍
      p2: 和他们一起分享营地与计划
      p3: 陪他们爬到足够高处送他们出发
    vignettes:
      date: 虚构的送信人拿着来自两个营地的信，交接单上却只写一个日期。你请他各自看信头，两封信出发时便各带着自己的地名和日期。
      question: 送信人把预定出发念成了准会出发。你在信中说到天气的地方请他停一下。他再念这项计划时，连同那个条件一起说出来。
      wrap: 送信人在膝上分拣纸页，你替他把要带走的信封放在一旁。他可以另把营地清单收好，不用折进信里。
  fanny_mendelssohn_berlin:
    name: 周日音乐会
    place: 柏林
    figure: 范妮·门德尔松·亨泽尔
    story: 范妮·门德尔松·亨泽尔写了数百首乐曲，其中有几首是用她弟弟的名字发表的。1847年5月她在家中排练音乐会时中风去世。
    relic: 一页歌谱
    relic_desc: 一页手写的歌谱，署名范妮。
    points:
      p1: 听出歌里有什么（音乐家或敏感的耳朵更合适）
      p2: 在家庭的房间里受到欢迎
      p3: 按她的本意弹她的钢琴声部
  camille_claudel_paris:
    name: 空了的工作室
    place: 巴黎
    figure: 卡米耶·克洛岱尔
    story: 卡米耶·克洛岱尔是一位才华罕见的雕塑家，父亲去世八天后，她被从工作室带走，送进疗养院。她在各种机构里度过了三十年。
    relic: 一只青铜手
    relic_desc: 一件小小的青铜手部习作。
    points:
      p1: 看出她石膏像里的生命（画家、石匠或灵巧的手更合适）
      p2: 在楼梯上替她说话
      p3: 隐身跟到疗养院门口
  artemisia_florence:
    name: 学院里的第一位女性
    place: 佛罗伦萨
    figure: 阿尔泰米西娅·真蒂莱斯基
    story: 1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。画室交谈为虚构。
    relic: 一罐颜料
    relic_desc: 一小罐磨好的青金石蓝。
    points:
      p1: 看出手的姿势像在做什么
      p2: 帮来客认清肖像是谁画的
      p3: 把习作和各自的签条放在一起
    vignettes:
      pose: 访客面对镜子，问哪种姿势看着自然。你问两种姿势各像在做什么。他选了手还能做自己的事的那一种。
      name: 一张习作只写了画中人的描述，没留画家的名字。你把纸翻过来，请访客在收进一摞图以前把两项都写上。
      mirror: 你挪了镜子，让访客不用扭身也能看见那个角度。他试坐一回，又自己调了一点，才开始画。
  buchner_zurich:
    name: 未完成的沃伊采克
    place: 苏黎世
    figure: 格奥尔格·毕希纳
    story: 格奥尔格·毕希纳是年轻的自然科学讲师和剧作家，二十三岁死于苏黎世的伤寒，剧本《沃伊采克》没有写完。
    relic: 一叠零散的场景稿
    relic_desc: 字迹局促的散页，没有固定的顺序。
    points:
      p1: 读着这些场景，感觉它们的次序
      p2: 在高烧中陪着他
      p3: 把稿子妥善保管，留给将来的读者（档案员、图书管理员或固执的人更合适）
  emily_bronte_haworth:
    name: 冬天的牧师住宅
    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。本卡在 1848 年安排虚构的阅读场景。
    relic: 一条狗项圈
    relic_desc: 牧师住宅里那条大狗用过的旧皮项圈。
    points:
      p1: 找出叙述从哪里换了人
      p2: 分清叙述者亲见与听来的事
      p3: 帮另一位读者翻回原来那页
    vignettes:
      witness: 读者以为讲故事的人什么都看见了。你问有一件事她是从哪儿知道的。他把那句话往回找，找到了先说这事的人。
      voices: 读者整页只用一个声音。你请他从内莉接过话头处再念。听的人这回听得出，故事什么时候交到了另一个人手上。
      mark: 你在换人讲述处夹了块纸。读者觉得后面一段同刚才抵触，便先翻回纸签在的地方。
  lili_boulanger_paris:
    name: 口述给姐姐的曲子
    place: 梅齐
    figure: 莉莉·布朗热
    story: 莉莉·布朗热是第一位获得罗马大奖作曲奖的女性，病重后把最后一首曲子口述给姐姐娜迪娅。她死时二十四岁。
    relic: 一支铅笔
    relic_desc: 一支短铅笔，旁边是空白的五线谱纸。
    points:
      p1: 听出她口述的曲子（音乐家或敏锐的头脑更合适）
      p2: 耐心陪完缓慢的口述
      p3: 做一个让房间安宁下来的人
  qu_yuan_miluo:
    name: 江边的诗句
    place: 汨罗江
    figure: 屈原
    story: 《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。本卡采用传统年份作背景，江边场景为虚构。传本对话是文献中的记述。
    relic: 一片写诗的竹简
    relic_desc: 一片竹简，上面是一首长诗中的几行。
    points:
      p1: 认出文辞问答里两种声音
      p2: 听出换个人讲以后哪里变了
      p3: 把诗句和保存它的传本放在一起
    vignettes:
      two_tales: 渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。
      refrain: 故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。
      wait: 等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。
  sima_qian_changan:
    name: 受刑之后写成的史书
    place: 长安
    figure: 司马迁
    story: 《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。卡片在约公元前 98 年的长安虚构抄写场景；游戏年份不是这封信的日期。
    relic: 一捆竹简
    relic_desc: 用绳子编起来的竹简，每一片写着一行字。
    points:
      p1: 找出两种说法到底在哪一点相冲
      p2: 把年次的前后理清
      p3: 证据分不出时，留下看得明白的存疑说明
    vignettes:
      dates: 书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。
      witness: 书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。
      binding: 书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。
  du_fu_xiang_river:
    name: 船上的诗人
    place: 湘江
    figure: 杜甫
    story: 传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。卡片的停船相遇为虚构。
    relic: 一盏船灯
    relic_desc: 一盏小小的陶油灯，为了几行诗亮到很晚。
    points:
      p1: 认出一个从船上才好看清的细节
      p2: 在渡口把信拿离湿处
      p3: 帮旅人把问候送向下一个镇子
    vignettes:
      shore: 旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。
      delivery: 你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。
      damp: 旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。
  li_qingzhao_hangzhou:
    name: 失去的藏品
    place: 杭州
    figure: 李清照
    story: 李清照在《金石录后序》中回忆她与赵明诚搜求书籍金石，以及后来收藏散失的经过。1150 年杭州读抄本的场景为虚构。
    relic: 一张古碑拓片
    relic_desc: 用墨从石头上拓下来的纸，是她和丈夫曾经收集的那种。
    points:
      p1: 分清后序里的回忆与目录条目
      p2: 把残抄翻开，保留需要核对的那页
      p3: 记下残缺处，别用猜来的字填满
    vignettes:
      trace: 读者认出题名就要翻页。你问他能不能认出所记之物。他停下来，先补抄缺行前的地名。
      missing: 清单中间空了一处，读者犹豫补什么。你用小字记清缺了什么，留着地方，等后面的人查到再填。
      book: 你把后序搁到编号的目录旁。读者开口之前在两边来回看了一遍。念出来时，那些名目像是从前真有人抱在手里、带上路的东西。
  su_shi_huangzhou:
    name: 东坡的流放
    place: 黄州
    figure: 苏轼
    story: 苏轼《前赤壁赋》开篇记壬戌之秋泛舟赤壁，即 1082 年。赋里由眼前江景联想旧事。本趟江边相遇的人是虚构的。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是农人在坡地上穿的那种。
    points:
      p1: 帮乘客把包裹拿离湿处
      p2: 开船前帮忙让开渡口
      p3: 带回一段让人看得见江景的描述
    vignettes:
      place: 你问船家，旧故事里哪一段真发生在这边。船家指了指他认得的渡口，反问你，对岸那段是从哪本书里听来的。
      sound: 船离岸前，一位乘客急着跟你说江上的见闻。你等芦苇声低下去，才问哪一声让他回过头。
      landing: 船家去松缆，你帮他抱住一小包东西。写下这趟去了哪里时，你把渡口和江湾分别记了下来。
  cao_xueqin_beijing:
    name: 停在八十回的小说
    place: 北京西山
    figure: 曹雪芹
    story: 脂评本《石头记》开篇提到曹雪芹，并在小说的叙事框架里写到反复增删。卡片沿用 1763 年作为背景，抄书场景为虚构。书里的自述也以原文中的框架来读。
    relic: 一份手抄的章回
    relic_desc: 朋友抄下的一回，页边有红笔写的批语。
    points:
      p1: 认出开篇框架里说话的是谁
      p2: 让批语跟着它所批的那一句
      p3: 把两张散开的纸排回顺序
    vignettes:
      stone: 你问石头会不会说出是谁抄的。抄书人揭起第一页，把故事如何开头念了一遍。你把石头列在故事里，抄书人的问题另夹一签。
      margin: 同一段旁边有两种笔迹。你请抄书人在批语和所批的句子间留空。传下去的新抄件还能看见两边。
      loose: 你捏住空白边捡起散页，念出开头几个字。抄书人从纸摞里找到接得上的地方，把这一页夹回去。
  tang_xianzu_linchuan:
    name: 写爱情超越死亡的戏
    place: 临川
    figure: 汤显祖
    story: 汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。卡片用 1598 年为背景，虚构戏班商量哪一句必须让观众听见。
    relic: 一册刻印的曲本
    relic_desc: 给歌者用的刻本，每支曲牌的名字写在上方。
    points:
      p1: 听出游园在何处转入梦里
      p2: 找出另一个演员靠哪一句接上
      p3: 让开走位而不中断唱腔
    vignettes:
      empty_garden: 你请演员在空台上排游园。几句之后，听的人指出想象中花开在什么地方。演员留下了让他看见那朵花的一句。
      cue: 删词连另一个演员上场的信号也删掉了。你在排练时发现，把那个字留在两人都听得到的位置，余下的删节仍能保留。
      breath: 你等演员把这一句唱完才挪椅子。这一遍，没人需要停下来解释为什么到了梦里。
  ban_zhao_luoyang:
    name: 接着兄长写完的史书
    place: 洛阳
    figure: 班昭
    story: 哥哥班固去世时《汉书》还没有写完，班昭受命续成，书里的表大部分都记在她名下。人们记得更多的，却是她那本劝导女子的小书。
    relic: 一幅绢上的人名表
    relic_desc: 一条绢，上面是整整齐齐排列的官名与人名。
    points:
      p1: 对着史料核对那些表
      p2: 向朝中学者辩护那些未完成的表
      p3: 陪她到最后一页读完
  xu_xiake_lijiang:
    name: 再也走不动的旅行家
    place: 丽江
    figure: 徐霞客
    story: 走了三十年之后，徐霞客在西南边远处腿疾发作，被人抬着送回家。他于1641年去世，留下的游记并不完整。
    relic: 一本旅行笔记
    relic_desc: 密密麻麻的笔记，写着洞穴、河流和岩石，每天夜里写成。
    points:
      p1: 陪他爬山路
      p2: 看看他停下来记录什么
      p3: 背着他走完回家的长路
  song_yingxing_fengxin:
    name: 一本讲万物如何造成的书
    place: 江西
    figure: 宋应星
    story: 宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。本篇看校样的会面是虚构的。
    relic: 一页工具图
    relic_desc: 一张木刻版画，织机的每个部件都标了名。
    points:
      p1: 沿图找到纸张经过的几道工序
      p2: 找出跟工序串了位置的图注
      p3: 给工坊读者留一张干净的图样
    vignettes:
      strainer: 你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。
      drying: 读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。
      sheet: 读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。
  wang_zhenyi_jinling:
    name: 用一盏灯讲明白月食
    place: 南京
    figure: 王贞仪
    story: 王贞仪是个自学天文和数学的年轻女子，她用一盏灯、一面镜子和一张圆桌演示月食是怎么发生的。她1797年去世，年仅二十九岁，她的成果很少有人知道。
    relic: 一面小圆镜
    relic_desc: 在她的月食模型里充当月亮的那面镜子。
    points:
      p1: 和她一起坐在书堆里
      p2: 跟上她的月食模型
      p3: 把她的论证听到底
  jianzhen_nara:
    name: 没能看见海岸的僧人
    place: 奈良
    figure: 鉴真
    story: 中国僧人鉴真想去日本传授戒律，五次被风浪和阻挠挡回，还双目失明。第六次他终于到达，却再没能看见那个国家。
    relic: 一捆干草药
    relic_desc: 他漂洋过海带去的药草。
    points:
      p1: 按他的步子走完去寺院的最后一段路
      p2: 和他谈药
      p3: 边走边给他描述眼前的土地
  hua_tuo_xuchang:
    name: 书都不在了的医生
    place: 许昌
    figure: 华佗
    story: 华佗以用麻沸散做外科手术和仿动物动作的导引之法著称，后来被官府关押在许昌。他自己的著作没有留下来，只能从后人的记载中知道他。
    relic: 一小袋药粉
    relic_desc: 一个小布袋，装着研细的草药，有淡淡的苦味。
    points:
      p1: 看他诊察病人
      p2: 陪一位病人熬过一夜
      p3: 在他说话时把方法记下来
  bi_sheng_printer:
    name: 陶土做的活字
    place: 杭州
    figure: 毕昇
    story: 《梦溪笔谈》记庆历年间（1041 至 1048）毕昇做泥活字，并按韵收存不用的字。卡中的工坊是虚构的。
    relic: 一枚泥活字
    relic_desc: 一小块烧过的泥，上面是一个反刻的字。
    points:
      p1: 从字格里分辨放错的活字
      p2: 拆版后把活字按韵归回去
      p3: 排版前为反复用到的字备足字模
    vignettes:
      rhyme: 有个字要放错韵部。你把字念出来，帮工趁下一把字落进去之前换了签。
      surface: 帮工说淡印是墨的问题。你把印样举到眼前，请他回想哪些字原先和两旁一样高。
      duplicates: 你数一行里那个字用了几遍。字格见了底，帮工才明白，同一个字为什么要备上几枚。
  miyazawa_kenji_hanamaki:
    name: 很少有人读过的故事
    place: 花卷
    figure: 宫泽贤治
    story: 宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。花卷的这段讨论为虚构。
    relic: 一本口袋笔记本
    relic_desc: 一本小笔记本，里面是铅笔写的诗。
    points:
      p1: 找出读者第一次听到站名的位置
      p2: 在笔记里分清城镇和车厢
      p3: 把转换处读到听的人能跟上
    vignettes:
      call: 你在屋子那头念出站名。还没解释谁在那里，读者就抬了头。他再读时把解释往后放，先保留那一声。
      window: 读者想指出铁道从哪里通进天空。你问乔班尼先从窗里看见了什么。他把小山和车厢分别写在两张纸上。
      ticket: 读者重读转进车厢那几句时，你一直替他翻着这页。下一站还没叫名以前，他先记下眼前已经变了什么。
  higuchi_ichiyo_tokyo:
    name: 十四个月的小说
    place: 东京
    figure: 樋口一叶
    story: 樋口一叶在贫困中养着母亲和妹妹，约十四个月里写了寥寥几篇小说。1896年11月她死于肺结核，年仅二十四岁，那时评论界才刚开始称赞她。
    relic: 一本随身日记
    relic_desc: 一本写了多年的日记，毛笔字端正。
    points:
      p1: 说动一位编辑再收一篇小说
      p2: 读她的日记
      p3: 在一个安稳的下午陪她坐坐
  sei_shonagon_kyoto:
    name: 宫廷散去之后
    place: 京都
    figure: 清少纳言
    story: 皇后在1000年去世后，清少纳言失去了她所在的宫廷。她那本记录清单与小瞬间的笔记，也就是《枕草子》，是留下来的东西，她晚年的情形没有记载。
    relic: 一张折起来的清单
    relic_desc: 一张轻轻写着喜欢和不喜欢的事的单子。
    points:
      p1: 加入她那份令人喜欢的事的清单
      p2: 碰上她爱聊天的时候
      p3: 在宫里冷清下来之后去看她
  kabir_maghar:
    name: 由歌者传下的诗句
    place: 马格哈尔
    figure: 迦比尔
    story: 迦比尔是个织工，用短诗唱出对骄傲与分裂的反对，他自己从没把诗写下来。歌者把诗传了下来，在他身后才被收集，传统上说他于1518年在马格哈尔去世。
    relic: 一把织梭
    relic_desc: 一把用旧了的木梭，被手磨得光滑。
    points:
      p1: 听他在织机旁唱
      p2: 在安静的时候坐在织工们中间
      p3: 把诗句背下来
  ibn_rushd_lucena:
    name: 连同书一起被放逐
    place: 卢塞纳
    figure: 伊本·鲁世德
    story: 法官兼医生伊本·鲁世德于1195年被放逐到卢塞纳，他的哲学书被下令烧毁。他对亚里士多德的注释主要靠希伯来文和拉丁文译本保存，阿拉伯文原本留下得较少。
    relic: 一页注释
    relic_desc: 一页紧凑的阿拉伯文，页边是亚里士多德的原文。
    points:
      p1: 去那座安静的小镇看他
      p2: 跟上他对亚里士多德的注释
      p3: 不引人注意地去看他
  rumi_konya:
    name: 由友人听写下来的诗
    place: 科尼亚
    figure: 鲁米
    story: 失去朋友沙姆斯之后，鲁米把悲伤写成诗，他口述，别人记录，《玛斯纳维》就是其中之一。1273年12月他在科尼亚去世，诗稿的汇集工作仍在继续。
    relic: 一支芦笛
    relic_desc: 一支朴素的芦笛，声音细而低。
    points:
      p1: 听笛声和诗句
      p2: 在他念诗时记下来
      p3: 最后一夜陪着他
  ibn_al_nafis_cairo:
    name: 穿过肺的血液
    place: 开罗
    figure: 伊本·纳菲斯
    story: 在开罗，伊本·纳菲斯写道，血液是经过肺从心脏右侧到左侧，而不是穿过中间的隔。这个说法被遗忘，直到二十世纪才被重新发现。
    relic: 一页解剖注释
    relic_desc: 一页写着心与肺的笔记，字小而清楚。
    points:
      p1: 跟上他关于血液的推理
      p2: 在医院病房里帮忙
      p3: 做那个相信他推理的学生
  al_khwarizmi_baghdad:
    name: 代数背后的那个人
    place: 巴格达
    figure: 花拉子米
    story: 花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。本卡的算术练习为虚构。
    relic: 一张演算过的方程
    relic_desc: 一张逐步解出平方与根的演算纸。
    points:
      p1: 沿着算例一步步做下去
      p2: 用学算者自己的例子说明一步变化
      p3: 把结果放回原题核对
    vignettes:
      balance: 你请学算者把两边各做了什么都说出来。他还没算到答案就停了下来。刚才最糊涂的那一步，这回他讲得最清楚。
      tiles: 学算者照着念，你把几块方片摆在桌上。念到绕口处，剩下的形状正好让人看出还缺哪一块。
      check: 学算者做完后，你把第一行留在眼前。他把答案放回去念了一遍，看看两边的数是否还相等。
  ibn_khaldun_cairo:
    name: 比史书更大的序言
    place: 开罗
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦为一部史书写的序言，成了一部研究社会与经济如何兴衰的著作。1384年他的妻女在海难中去世，此后他在开罗继续教书，直到1406年去世。
    relic: 一册装订好的讲稿
    relic_desc: 一册厚厚的笔记，是为学院讲课写的。
    points:
      p1: 陪一位失去家人的人坐坐
      p2: 跟上他对城市为何兴起又衰落的想法
      p3: 把他的想法传给以后的读者
  taqi_al_din_istanbul:
    name: 被拆掉的天文台
    place: 伊斯坦布尔
    figure: 塔基·丁
    story: 塔基·丁在伊斯坦布尔建了一座天文台，用的是他自己设计的仪器，其中有一架大钟，并开始为新的星表做观测。它在1580年被拆掉，距开建只有几年。
    relic: 一件黄铜观测仪
    relic_desc: 一件小小的黄铜仪器，用来测星的高度。
    points:
      p1: 制造钟和仪器
      p2: 整夜做观测
      p3: 最后一夜陪观测员们守着
  ahmed_baba_timbuktu:
    name: 被带走的藏书
    place: 廷巴克图
    figure: 艾哈迈德·巴巴
    story: 廷巴克图的学者艾哈迈德·巴巴有一座约一千六百册书的藏书室，1594年他被押往摩洛哥。书都散失了，他几年后才获准回来。
    relic: 一册皮面手抄本
    relic_desc: 一册皮面磨旧的手抄本，带着翻盖。
    points:
      p1: 翻翻他的书架
      p2: 书装箱时清点册数
      p3: 不被察觉地陪他走在路上
  terence_rome:
    name: 观众离场的那出戏
    place: 罗马
    figure: 泰伦提乌斯
    story: 泰伦提乌斯是来自迦太基的前奴隶，他的喜剧《婆母》两次被观众抛下，先是为了拳击手和走绳艺人，后来为了角斗士。直到第三次才被完整地听完。
    relic: 一副喜剧面具
    relic_desc: 一副亚麻面具，眉毛高挑，演员戴的。
    points:
      p1: 把吵闹的人群劝回座位
      p2: 跟上演员们说出的情节
      p3: 留在座位上，听到最后一句
  mohenjo_daro_indus:
    name: 无人能读的符号
    place: 摩亨佐·达罗
    figure: 印度河流域的居民
    story: 在一座规划整齐的城市里，有砖砌的房子和有盖的排水沟，人们把短短几行符号压在小小的石印章上。这种文字至今没有被释读，我们不知道符号说了什么，也不知道他们说什么语言。
    relic: 一枚石印章
    relic_desc: 一枚方形小印章，上面有一只动物和几个符号。
    points:
      p1: 研究印章上的符号
      p2: 走过笔直的街道和排水沟
      p3: 读出印章上的符号
  knossos_linear_a:
    name: 米诺斯人没有留下读法的文字
    place: 克诺索斯
    figure: 米诺斯的书吏
    story: 克诺索斯王宫里的书吏用线形文字A把货物记在泥板上，那是米诺斯人的文字。它至今没有被读通，所以他们的语言不为人知；而后来的线形文字B在1952年被读出，记的是希腊语。
    relic: 一块泥板
    relic_desc: 一块扁平的泥板，上面是一行行符号和表示数目的小记号。
    points:
      p1: 把符号压进湿泥里
      p2: 比较各块泥板上的符号
      p3: 用他自己的语言和书吏交谈
  antikythera_rhodes:
    name: 没有留下匠人姓名的机器
    place: 罗得岛
    figure: 不知名的匠人
    story: 安提基特拉沉船出水的齿轮装置残片保留了对应天文周期的刻度和铭文。工匠与工坊尚不能确定；罗得岛是本卡的虚构场景地点。
    relic: 一枚青铜齿轮
    relic_desc: 一个带齿的小轮，因年久而发绿。
    points:
      p1: 认出练习盘上标着的那圈刻度
      p2: 分清不同圈上对应的两个周期
      p3: 让下一个读者把铭文对回刻度盘
    vignettes:
      rings: 来客嘴里念外圈的标记，手却指向了内圈。你让他转一下练习盘，只跟其中一圈走，这回他沿着同一圈念到了底。
      calendar: 一根指针回转得比来客料想的快。你问他原先数的是哪一个周期。他另画了一行，没有把两个周期挤在同一栏下。
      legend: 你给指针和它所指的位置分别做记号。来客再念一遍标签，两处终于没被叫成同一个名字。
  sappho_lesbos:
    name: 只剩碎片的歌
    place: 米蒂利尼
    figure: 萨福
    story: 莱斯博斯岛的萨福为里拉琴作歌，古时被收成九卷。除了一首完整的诗和几段较长的篇章，如今只剩写在纸莎草碎片上的残句和后人的引文。
    relic: 一片纸莎草残片
    relic_desc: 一片撕裂的碎纸，上面有几个圆润字体的希腊词。
    points:
      p1: 听她伴着里拉琴唱
      p2: 坐进她朋友们的圈子
      p3: 听懂她方言里的每一个词
  aristarchus_alexandria:
    name: 地球在动，少有人听
    place: 亚历山大
    figure: 阿利斯塔克斯
    story: 阿利斯塔克斯提出地球绕着太阳转，并测量了太阳和月亮的大小。几乎没有人跟随他，这个想法只在阿基米德的几行文字里留了下来。
    relic: 一块日晷板
    relic_desc: 一块青铜板，刻着时辰和节气的线。
    points:
      p1: 跟上他关于太阳和月亮的几何
      p2: 别人嘲笑时守住这个想法
      p3: 让一位听众把他的想法记下来
  hipparchus_rhodes:
    name: 丢失的星表
    place: 罗得岛
    figure: 喜帕恰斯
    story: 喜帕恰斯在罗得岛编出一份约八百五十颗星的星表，并发现了二分点的缓慢移动。他自己的著作已经失传，是靠托勒密的转述才知道的。
    relic: 一只青铜浑仪环
    relic_desc: 一只带刻度的环，用来量星的位置。
    points:
      p1: 陪他数星星
      p2: 在观测筒旁值夜
      p3: 亲手抄下他的星表
  heron_alexandria:
    name: 蒸汽球与神庙的门
    place: 亚历山大
    figure: 希罗
    story: 希罗描述了一只蒸汽喷出就会转动的球，火一点燃就会开启的门，和一台投币出圣水的机器。这些东西只留作神庙和娱乐用的奇物。
    relic: 一只带两根弯管的小铜球
    relic_desc: 一只装在枢轴上的空心球，有两根弯管用来出汽。
    points:
      p1: 装好管子和枢轴
      p2: 趁他两次演示之间找他
      p3: 看出这只旋转的球可能通向哪里
  pliny_stabiae:
    name: 博物学家的最后一次航行
    place: 斯塔比亚
    figure: 老普林尼
    story: 老普林尼刚刚写完卷帙浩繁的三十七卷《博物志》，维苏威火山喷发时，他驾船横渡海湾，既为观察，也为帮助朋友。他死在岸边，是外甥写下了这段记述。
    relic: 一块蜡板
    relic_desc: 一块涂蜡的木板，用尖笔划出笔记。
    points:
      p1: 问他那三十七卷书
      p2: 在火山灰落下时驾船横渡海湾
      p3: 留在岸边陪着他
  galen_rome:
    name: 烧掉的书架
    place: 罗马
    figure: 盖伦
    story: 192年的一场大火毁掉了和平神殿附近的仓库与图书室，盖伦在那里存放着他许多著作和其他书籍。他的很多作品从此失传。
    relic: 一卷烧焦的卷轴
    relic_desc: 一卷一头烧黑的卷轴，其余的字仍能读。
    points:
      p1: 和他一起读病例记录
      p2: 照看他门口的病人
      p3: 陪他坐在烧毁的书架旁
  ovid_tomis:
    name: 帝国边缘的诗人
    place: 托米
    figure: 奥维德
    story: 奥维德因为一首诗和一个从未说明的过错，被皇帝奥古斯都从罗马放逐到黑海边的托米。他写下充满乡愁的书信体诗，一再请求回去，最后死在那里。
    relic: 一块写字蜡板
    relic_desc: 一块板，上面是流放路上起笔的诗体书信。
    points:
      p1: 给他带来罗马的消息
      p2: 听他在冬天的海岸上写的诗
      p3: 用当地话和他交谈
  empedocles_akragas:
    name: 四根与爱憎
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒用诗写道，万物由土、气、火、水构成，被爱聚合，被恨分开。他的诗只留下了残篇。
    relic: 一片诗稿
    relic_desc: 一条纸莎草，上面是几行六音步诗。
    points:
      p1: 看四种元素在罐里混合
      p2: 在合适的时候赶上人群
      p3: 把整首诗听完
  democritus_abdera:
    name: 空间中的原子
    place: 阿布德拉
    figure: 德谟克利特
    story: 德谟克利特认为万物由不可再分的微小原子在虚空中运动构成。他写的几十部书一本也没有留下，我们是通过后人的引文才知道他。
    relic: 一块卵石和一把刀
    relic_desc: 一块光滑的卵石和一把切它的小刀，像思想实验里那样。
    points:
      p1: 问他切开的苹果是由什么组成的
      p2: 在他安静的园子里找到他
      p3: 抄下他的一卷文字
  hildegard_bingen:
    name: 修道院里的静默
    place: 宾根
    figure: 宾根的希尔德加德
    story: 希尔德加德是女修道院长，作曲，也写医学和自然。因为一场关于安葬的争执，她和修女们被禁止唱礼仪歌好几个月。1179年9月她去世。
    relic: 一页圣咏
    relic_desc: 一页拉丁词句上方标着纽姆谱的纸，抄给修女们用。
    points:
      p1: 听她的圣咏
      p2: 碰上她安静的时候
      p3: 陪她度过静默的那几个月
  nezahualcoyotl_texcoco:
    name: 写歌的国王
    place: 特斯科科
    figure: 内萨瓦尔科约特尔
    story: 特斯科科的统治者内萨瓦尔科约特尔也是诗人，他在城里收集绘本、歌和园林，1472年去世。档案后来被毁，他的歌靠后人的抄本流传下来。
    relic: 一页树皮纸
    relic_desc: 一页树皮纸，上面有彩绘符号和几行歌。
    points:
      p1: 在花园的树下听他的歌
      p2: 走过他规划的引水渠
      p3: 把一首歌抄到纸上
  maya_codices_mani:
    name: 马尼的那些书
    place: 马尼
    figure: 玛雅书吏
    story: 1562年7月，在马尼，修士迭戈·德·兰达下令在广场上烧掉玛雅人的书和图像。如今整个世界只剩下寥寥几部彩绘的玛雅书。
    relic: 一册彩绘树皮书
    relic_desc: 一册折叠的树皮纸书，上面是彩绘的符号和人像。
    points:
      p1: 看那些彩绘的书页
      p2: 在白天的酷热里站在广场上
      p3: 不被察觉地坐到一位老书吏身旁
  rongorongo_rapa_nui:
    name: 无人能读的木板
    place: 拉帕努伊岛
    figure: 拉帕努伊人
    story: 拉帕努伊岛上刻着朗格朗格符号的木板只留下约二十来块。今天没有人能读懂，会读的人在1860年代死去或被带走了。
    relic: 一块刻字的木板
    relic_desc: 一块平整的木头，刻着一行行小小的人形。
    points:
      p1: 研究那些成行的符号
      p2: 陪记得那些的老人坐坐
      p3: 听懂老人念出的古老吟唱
  dunhuang_library_cave:
    name: 封起来的洞窟
    place: 莫高窟
    figure: 敦煌的僧人
    story: 约在1000年前后，几万件写本和绘画被封进莫高窟的一个小洞里。没有记载说为什么，直到1900年洞窟才重新打开。
    relic: 一卷卷轴
    relic_desc: 一卷纸，上面用稳当的字抄着一部经。
    points:
      p1: 把卷子捆好存放
      p2: 读捆上的标签
      p3: 墙砌起来时陪僧人们待着
  nalanda_library:
    name: 后来失去的大图书馆
    place: 那烂陀
    figure: 那烂陀的僧人
    story: 几个世纪里，那烂陀都是一处大学府，玄奘等旅人描述过它的藏书楼。1190年代之后的几年里，它的图书馆消失了，书几乎一册也没有留下。
    relic: 一页贝叶经
    relic_desc: 一条条窄叶用绳串起，用铁笔写成。
    points:
      p1: 走过图书馆的大厅
      p2: 帮抄经人管目录
      p3: 不被察觉地坐在僧人中间，看他们在灯下抄经
  meroitic_meroe:
    name: 有字母却没有已知语言
    place: 麦罗埃
    figure: 麦罗埃的书吏
    story: 麦罗埃是库施的都城，书吏用麦罗埃文书写，这种字母可以读出音来，但它的语言至今几乎无人能懂。
    relic: 一块刻着符号的石头
    relic_desc: 一小块石头，上面是一行草体符号。
    points:
      p1: 比较草体与刻写的符号
      p2: 看石匠干活
      p3: 读出神庙墙上的铭文
  tupaia_tahiti:
    name: 领航者的海图
    place: 塔希提
    figure: 图帕亚
    story: 1769 年，图帕亚在塔希提登上奋进号。新南威尔士州立图书馆展示了一幅据图帕亚地理知识绘成的南太平洋海图的传世抄本。这段核对地名的交谈为虚构。
    relic: 一张岛屿草图
    relic_desc: 一张墨与淡彩的纸，画着小小的岛形和名字。
    points:
      p1: 在航程中挤着住那间小舱
      p2: 看他画那幅群岛海图
      p3: 向他学岛的名字
    vignettes:
      pronounce: 虚构的抄图人以为两种拼法是两座岛。你请他先把两个名字念出来，再决定画不画新岛。他在名字旁留了个问号，等熟悉的人来核对。
      route: 抄图人拿笔要在两个记号间拉道直线。你问刚才说方位时是从哪座岛算起的。他抬起笔，把这个方位留在原先那段说法旁。
      room: 抄图人写下一个名字时，你压住卷起的纸角。他挪开手，好让下一个名字落笔时不盖住上一个。
  heo_nanseolheon_hanyang:
    name: 她要人烧掉的诗
    place: 汉阳
    figure: 许兰雪轩
    story: 朝鲜时代的年轻女诗人许兰雪轩于1589年去世，年仅二十六岁，留话要把她的诗烧掉。她的弟弟许筠尽力保存下来，并付印出版。
    relic: 一页诗稿
    relic_desc: 一页细纸，用毛笔写着写花和远方的诗。
    points:
      p1: 在她的房间里读她的诗
      p2: 在安静的傍晚陪她坐坐
      p3: 把她的诗背下来
  ghalib_delhi:
    name: 债、抚恤金和一只芒果
    place: 德里
    figure: 迦利布
    story: 迦利布是最伟大的乌尔都语和波斯语诗人之一，他在德里欠着债，靠一份有争议的抚恤金过日子，生前很少见到自己的诗付印。他死后被称赞得多得多。
    relic: 一页格扎勒诗稿
    relic_desc: 一页他亲笔写的乌尔都语诗，有修改的痕迹。
    points:
      p1: 和门口的放债人讲价
      p2: 听人朗读一首格扎勒
      p3: 和他分一只芒果，也分一句诗
  savitribai_phule_pune:
    name: 一所女子学校
    place: 浦那
    figure: 萨维特里白·普勒
    story: 萨维特里白·普勒1848年和丈夫乔蒂拉奥在浦那开办女子学校，并在那里教书。去学校的路上她遭到辱骂，有人朝她扔脏东西，她仍然走下去。
    relic: 一块石板
    relic_desc: 一块小石板，上面用粉笔写着第一排字母。
    points:
      p1: 陪她走过嘲笑的围观者
      p2: 劝说一户人家把女儿送来
      p3: 在她身边教一堂课
  zhu_shijie_yangzhou:
    name: 著作遗失的数学家
    place: 扬州
    figure: 朱世杰
    story: 云游四方的数学教师朱世杰于1303年出版《四元玉鉴》，书中有解多元方程的方法。他的书在中国失传了几个世纪，其中一部是靠朝鲜的翻刻本找回来的。
    relic: 一套算筹
    relic_desc: 一根根细棍，排成行来代表数。
    points:
      p1: 跟上那四个未知数
      p2: 把算筹教给一个学生
      p3: 把这堂课听到最后
  xuanzang_changan:
    name: 从西域带回的六百多部经
    place: 长安
    figure: 玄奘
    story: 《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。本卡的接收登记场景为虚构。
    relic: 一片贝叶经
    relic_desc: 一片写着梵文的贝叶，边缘已经发黑。
    points:
      p1: 把两项数各自对回单位
      p2: 交接时别让东西串了堆
      p3: 给书吏腾出桌面和纸，写完清单
    vignettes:
      totals: 书吏把夹数抄进了部数那栏。封好新抄之前，你指明两个单位。没有一夹需要挪动，两份数却对上了。
      names: 你看着两个签上的名目很像。书吏念给你听，趁经夹还没搬走，请你把不同的几个字另抄下来。
      space: 你给书吏腾出地方，一次只摊开一夹。搬来最后一摞的人终于能搁下东西，不压住清单。
  jia_sixie_gaoyang:
    name: 写给农人的百科
    place: 山东高阳
    figure: 贾思勰
    story: 贾思勰走访农人，把耕作、种植、养畜和酿造的办法一条条记下来，写成一部给农人用的书。
    relic: 一卷农书
    relic_desc: 一卷手抄的农书，页边留着下田时记的字。
    points:
      p1: 问农人为何这样种
      p2: 跟着下田一整个农忙
      p3: 在田埂上同农人坐下
  qin_jiushao_huzhou:
    name: 数书九章
    place: 湖州
    figure: 秦九韶
    story: 秦九韶把田亩、赋税、军需里遇到的算题收成一部书，其中的大衍求一术能解一组一组的同余方程。
    relic: 一枚算筹
    relic_desc: 一根磨得发亮的竹算筹。
    points:
      p1: 跟上同余式的解法
      p2: 抄录算题
      p3: 向地方官说明田亩算法
  al_biruni_ghazna:
    name: 从山顶量出地球的大小
    place: 加兹尼
    figure: 比鲁尼
    story: 比鲁尼爬上山顶，量出地平线低下去的角度，用一座山的高度算出了地球的半径。
    relic: 一件星盘
    relic_desc: 一只铜星盘，刻度被手指磨亮。
    points:
      p1: 跟上山顶测角
      p2: 顶着酷热爬上山
      p3: 用梵语同学者交谈
  al_razi_rayy:
    name: 把天花与麻疹分开
    place: 雷伊
    figure: 拉齐
    story: 拉齐在医院的病房里一个个比对病人，写下天花和麻疹各自的病程，说明它们是两种病。
    relic: 一页病例笔记
    relic_desc: 一页写满了热度和日期的病例笔记。
    points:
      p1: 对比两种热病的过程
      p2: 照看病房里的病人
      p3: 把病例逐条记下
  sushruta_varanasi:
    name: 外科与整形的老手册
    place: 瓦拉纳西
    figure: 妙闻
    story: 传说中的医者妙闻在他的手册里讲述外科手术、器械和整形，给学徒在模型上练习的办法。
    relic: 一把青铜手术刀
    relic_desc: 一把窄窄的青铜刀，刃口磨得很薄。
    points:
      p1: 看他怎样处理伤口
      p2: 稳住一次缝合
      p3: 同学徒们一起练习
  zhuge_liang_longzhong:
    name: 草庐三访
    place: 隆中一带
    figure: 诸葛亮
    story: 《三国志·诸葛亮传》记诸葛亮躬耕陇亩，好为《梁父吟》。徐庶对刘备说，此人可就见，不可屈致。刘备三次前往才见到他，见面时先屏退旁人，然后开口。裴松之注另引《魏略》，记的是诸葛亮先去见刘备。本篇采用三顾说，以通常采用的 207 年作游戏时间。
    relic: 一页记着调子的纸
    relic_desc: 为游戏虚构的纪念物。田边记下的一支慢歌的调子，词缺了一半。
    points:
      p1: 在隆中落脚，下田干活，等到第三次来访
      p2: 听见田那头的歌，把调子记下来
      p3: 客人请旁人退出时，退到门外，守到门再打开
    vignettes:
      future_novel: 你问一同下田的邻人，草庐里那位将来会不会趁江上起雾去借箭。这位邻人是游戏里编出来的。他直起腰：「他连船都没有。你上哪儿听来的？」你在归来报告里把借箭那段另标为后世小说的情节。
      door: 客人第三次来，进门后请旁人都出去。你和邻人退到篱笆外。门里说了什么，你一句也没听见，后来的书上记着。
      song: 田那头有人唱歌，调子很慢。邻人说，那位常唱这个，叫《梁父吟》。你把调子记了下来，词没有记全。
  borobudur_java:
    name: 层层浮雕的石山
    place: 爪哇
    figure: 婆罗浮屠的建造者们
    story: 爪哇的建造者们在火山灰地上，一层一层把石块垒成一座带着浮雕的大塔。
    relic: 一块浮雕残片
    relic_desc: 一块刻着人物衣褶的石片。
    points:
      p1: 对齐石块
      p2: 在湿热里搬石
      p3: 读懂层层浮雕的次序
  qin_liangyu_shizhu:
    name: 秦良玉与石砫账册
    place: 石砫
    figure: 秦良玉
    story: 《明史·秦良玉传》记载，崇祯三年，秦良玉与秦翼明奉诏勤王，秦良玉出家财济饷。《补辑石砫厅新志》也记载了这次奉诏出行。账册、条目和桌边的人都是为本趟故事虚构的。
    relic: 石砫领物抄单
    relic_desc: 页边记了一个姓名，包裹旁又写了另一个。抄单为游戏虚构。
    points:
      p1: 找出清单上两个写得很像的名字
      p2: 帮搬货人核对她该领的是哪一包
      p3: 在收桌前留好两张对得上的单子
    vignettes:
      ledger: 两行名字只差一个字，账房顺嘴读成了同一个人。你把那个字圈出来，他把两位领物人都叫回来核对。
      hands: 搬货人两手托着包裹，腾不出手展开单子。你替她把纸按平，把名字念给她听，她才重新抱紧包裹。
      copy: 账房念过一行，你就在抄单上对一行。念到最后，你把两张纸并排留在桌上。
  zeami_sado:
    name: 写给后人的能乐秘传
    place: 佐渡岛
    figure: 世阿弥
    story: 年迈的世阿弥被流放到佐渡岛，仍然在写他对能乐和花的看法，写给将来的演员。
    relic: 一张能面
    relic_desc: 一张小小的木面，眉间有细细的漆痕。
    points:
      p1: 听他谈花
      p2: 替能乐在将军府说话
      p3: 在佐渡陪他坐坐
  ino_tadataka_ezo:
    name: 五十岁后用脚量出日本
    place: 北海道
    figure: 伊能忠敬
    story: 伊能忠敬五十多岁开始学天文，从北海道南岸起一步一步量海岸线，用脚丈量出了日本的地图。
    relic: 一根测杖
    relic_desc: 一根量步距用的细杖，上面刻着尺度。
    points:
      p1: 走完一段海岸
      p2: 用北极星定纬度
      p3: 把一天的步数记完
  djenne_builders:
    name: 每年重抹一次的泥墙
    place: 杰内
    figure: 杰内的泥砖建造者们
    story: 杰内的街坊们用泥砖垒起高大的清真寺，每年雨季前一起把墙重新抹一遍。
    relic: 一块泥砖
    relic_desc: 一块晒得很硬的泥砖，掰开能看到里面的稻壳。
    points:
      p1: 抹泥墙
      p2: 烈日下搬泥浆
      p3: 同街坊一起修墙
  ahmes_thebes:
    name: 一卷抄自旧本的算题纸草
    place: 底比斯
    figure: 阿赫摩斯
    story: 书吏阿赫摩斯把一卷旧本上的算题抄在纸草上，里面有分数的算法，也有面积和面包的分配。
    relic: 一卷纸草残片
    relic_desc: 一小片写着红黑两色字的纸草。
    points:
      p1: 看懂分数的算法
      p2: 抄写一栏分数
      p3: 被允许看旧本
  quipu_cusco:
    name: 不用文字的账本
    place: 库斯科
    figure: 结绳记事的人
    story: 库斯科的账房用一束束彩色的绳结记下收成、人口和仓库里的东西，只有会读的人才看得懂。
    relic: 一束彩色结绳
    relic_desc: 一束长短不一的绳子，打着大小不同的结。
    points:
      p1: 看懂绳结的位置
      p2: 核对一束账绳
      p3: 听懂账房的话
  humboldt_chimborazo:
    name: 在雪线下量出一座山的全貌
    place: 厄瓜多尔钦博拉索山
    figure: 亚历山大·冯·洪堡
    story: 洪堡的旅行日记记下了 1802 年 6 月 23 日攀登钦博拉索山的尝试。同行有埃梅·邦普兰和卡洛斯·蒙图法尔，一行人没有登顶。整理记录的一幕为虚构。
    relic: 一支气压计
    relic_desc: 一支装着水银的气压计，玻璃管上刻着高度。
    points:
      p1: 在雪线上继续走
      p2: 读气压计和沸点
      p3: 走完最后一段
    vignettes:
      turn: 虚构读者把线路一路画上山顶。你问日记写到哪里就停止往上走了。他把最后一记往山坡下移，没再碰山顶。
      units: 读者要只抄一个高度，把单位省掉。你请他把原单位和测数放在一起，另留一行给今天的换算。
      names: 你请读者在洪堡旁留出地方，记下另外几名同行者。折起纸以后，名单仍跟着当天攀登的记录。
  banneker_maryland:
    name: 自己算出来的历书
    place: 马里兰
    figure: 本杰明·班纳克
    story: 自学成才的班纳克夜里用星图和算表推算日食和潮汐，白天还要面对别人的偏见，终于编出了自己的历书。
    relic: 一册手抄历书
    relic_desc: 一册手抄的历书，页边写满了算式。
    points:
      p1: 核对日食推算
      p2: 替他把历书送到印刷商手里
      p3: 整夜算到天亮
  seacole_balaklava:
    name: 自己找路去的战地客栈
    place: 巴拉克拉瓦
    figure: 玛丽·西科尔
    story: 玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。柜台边的这一幕为虚构。
    relic: 一只药箱
    relic_desc: 一只旧木药箱，里面分格放着草药和纱布。
    points:
      p1: 照看痢疾和霍乱病人
      p2: 向军需官要一箱药
      p3: 撑过一整个夏天
    vignettes:
      meal: 一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。
      counter: 两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。
      shelf: 店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。
  mitchell_nantucket:
    name: 屋顶上发现的彗星
    place: 楠塔基特
    figure: 玛丽亚·米切尔
    story: 玛丽亚·米切尔夜里在家里的屋顶上用望远镜扫天，在海边的风里发现了一颗新彗星。
    relic: 一架小望远镜
    relic_desc: 一架小小的黄铜望远镜，镜筒上有海盐的痕迹。
    points:
      p1: 在屋顶望远镜旁认出彗星
      p2: 整夜扫天
      p3: 做她请教的邻居
  caroline_herschel_slough:
    name: 扫天的人
    place: 斯劳
    figure: 卡罗琳·赫歇尔
    story: 卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。本卡场景为虚构。
    relic: 一把天区扫描记录尺
    relic_desc: 一把刻着刻度的木尺，用来在星图上标出扫过的天区。
    points:
      p1: 标出用来比较的邻星
      p2: 把两个时刻各记在对应的图旁
      p3: 在暗处帮忙留下下一次观测
    vignettes:
      fixed: 你先记下两颗较亮的邻星，再添模糊的那个。第二张纸虽然挪了位置，仍能靠那两颗星找回原处。
      doubt: 帮手说兴许该擦擦镜片。你问同一片玻璃里的别的星怎样。那些仍然清晰，他便把这处可疑的记号留在纸上。
      lamp: 帮手记时刻时，你用手遮住灯。把灯盖好以后，两张图旁都还留着各自的时刻。
  kovalevskaya_stockholm:
    name: 得奖的旋转陀螺
    place: 斯德哥尔摩
    figure: 索菲娅·柯瓦列夫斯卡娅
    story: 柯瓦列夫斯卡娅在斯德哥尔摩的冬天里，把一个旋转刚体的难题算出了新的结果，写成论文去参加评奖。
    relic: 一只陀螺模型
    relic_desc: 一只铜陀螺，轴上刻着编号。
    points:
      p1: 跟上旋转的方程
      p2: 向评审说明论文
      p3: 北欧的冬天
  chaco_sun_watchers:
    name: 夏至日落在螺旋上的光
    place: 新墨西哥州查科峡谷
    figure: 查科峡谷的人们
    story: 在查科峡谷的高原荒漠里，峡谷里的人们垒石、在岩壁上做记号，使夏至那天早晨一道窄窄的光落在崖壁的一个螺旋刻纹上。这片峡谷至今是普韦布洛人和他们的后裔等族群生活着的圣地，这个故事只写公开记录过的内容。
    relic: 一片绘纹陶片
    relic_desc: 巴掌大的一片陶片，上面是细细的黑线花纹。
    points:
      p1: 找到光会穿过的那道岩缝
      p2: 等过日出前最后几分钟的黑暗
      p3: 熬过清晨的寒冷
  rapa_nui_moai:
    name: 走向海边的石像
    place: 拉帕努伊岛，拉诺拉拉库
    figure: 拉帕努伊的石像匠人
    story: 在拉帕努伊岛的拉诺拉拉库采石场，匠人们从火山岩上凿出叫摩艾的石像，再把它们运过全岛，立在面朝内陆的石台上。今天这片采石场和它所在的公园由拉帕努伊人自己照管。
    relic: 一把石斧
    relic_desc: 一片手掌大的深色玄武岩刃，磨出了干净的刃口。
    points:
      p1: 在岩壁上凿出石像的轮廓
      p2: 把石像沿山坡拉下来
      p3: 看懂石像是按什么次序凿的
  hargrave_stanwell_park:
    name: 四只风筝和一把座椅
    place: 澳大利亚斯坦韦尔公园
    figure: 劳伦斯·哈格雷夫
    story: 在斯坦韦尔公园的海崖上，劳伦斯·哈格雷夫把四只箱式风筝连成一串，让海风把他托离地面几米。他从不为自己的设计申请专利，而是把它们公开发表，谁都可以用。
    relic: 一副箱式风筝骨架
    relic_desc: 一副轻巧的细木格架，一端的布已经撕破。
    points:
      p1: 看箱形怎样兜住风
      p2: 帮他绑好绳子和杆
      p3: 在海崖上等风起来
  sun_yat_sen_guangzhou:
    name: 从铜像到一所新大学
    place: 广州
    figure: 孙中山
    story: 你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。同一段日子里，他星期天在高等师范的礼堂演讲，讲稿在几个人手里来回走，后来成了一本书。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。
    relic: 一本 1924 年三月印的小册子
    relic_desc: 星期天的演讲头一回印成书，序写于 1924 年 3 月 30 日。
    points:
      p1: 把三所学校的名册抄成一本
      p2: 带回一本演讲印成的书
      p3: 待到最后一讲
    vignettes:
      slips: 一位编出来的办事员正要抄一页稿子，稿上有一张签条盖住了两行。你问他签条是谁的字，稿子又是谁的字。他先抄了稿子，签条留在原处没有动。
      back_row: 一位编出来的学生找不到座位，老是站起来张望。你往里挪了挪。他坐下来听完了后半场，一句话没说，散场时朝你点了点头。
      hundred: 你在本子最后一页画正字，一天一笔。画满一百天的时候，一位编出来的办事员问你在数什么。你说，日子。
  sun_yat_sen_beijing_1925:
    name: 北京的最后一个冬天
    place: 北京
    figure: 孙中山
    story: 1924 年 12 月 31 日孙中山抵达北京，已经带病。1925 年 1 月 26 日他住进协和医院并接受手术，医生发现是癌症。2 月 18 日他移到铁狮子胡同的行馆，3 月 12 日上午在那里去世。这些你一样也改变不了，你能做的是守着。
    relic: 一条守夜人的围巾
    relic_desc: 一条普通的羊毛围巾，陪人熬过了一个冬天的许多个夜晚。
    points:
      p1: 在走廊里和大门外守过一个个长夜
      p2: 替守在这里的人烧水、送饭、跑腿
      p3: 把一枚从广州带来的校徽留在门口，作为一份心意
    vignettes:
      list: 虚构的值守人把还在等的人和已经离开的人记在同一张名单里。你请他列两个栏头，下一班接手便知道还要叫谁。
      bench: 门口有人走了很远的路，一有动静便站起来。你在长凳上给他找了个位置，说值守人出来时就叫他。
      water: 你把水壶搁在夜班能找到的托盘旁。值守人把它移到随手够得着的地方，给下一班留了个字条。
  sun_yat_sen_university_1926:
    name: 这所大学以他的名字命名
    place: 广州
    figure: 孙中山
