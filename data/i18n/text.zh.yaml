  dante_ravenna:
    name: 用街头的语言写一部长诗
    place: 拉文纳
    figure: 但丁
    story: 但丁 1302 年被逐出佛罗伦萨，约 1318 年移居拉文纳，在那里写完《神曲》的最后一部《天堂篇》，用的是托斯卡纳的日常口语。1319 年前后，博洛尼亚的学者乔万尼·德尔·维尔吉利奥寄来拉丁诗，劝他改用拉丁文写作、到博洛尼亚接受桂冠，但丁用拉丁诗作答。1320 年 1 月 20 日，他在维罗纳作了一场讲演。1321 年 9 月，他从威尼斯出使回来后病倒，在拉文纳去世。
    story_prose:
      opening:
        - 1320 年初，拉文纳。但丁被逐出佛罗伦萨已经十八年，1302 年那道判决说他回城即处死。他应拉文纳领主圭多·诺韦洛·达·波伦塔之邀住在这里，用托斯卡纳的日常口语写《神曲》的最后一部《天堂篇》。
        - 史实里，在博洛尼亚执教的乔万尼·德尔·维尔吉利奥寄来一首拉丁诗，劝他改用拉丁文写作，到博洛尼亚戴桂冠，但丁用一首拉丁牧歌作答。1321 年 9 月，他从威尼斯出使回来后病倒，在拉文纳去世，到死没能回到佛罗伦萨。在这条分支里，城里有个卖墨水的人，最好的主顾是誊写的人，城外靠海的松林里有个拾柴人。
        - 这一趟用得上两种人：懂文书、分得清哪叠纸该寄哪叠该留的人，懂诗懂书、能在他身边坐下来说几句真话的人。
      outcomes:
        all: 拉丁诗一来一往，一直写到第二年，每一封都单独封着蜡。1321 年 9 月，他从威尼斯回来后病倒，床头那叠《天堂篇》，最后一页也写满了。
        p2: 他在拉文纳又住了一年多。1321 年 9 月，他从威尼斯回来后病倒，床头那叠《天堂篇》，最后一页也写满了。
        p1: 拉丁诗一来一往，一直写到第二年。每一封答诗都单独折好，滴着一小块蜡。
      none: 博洛尼亚的信还压在案头。拉文纳城外的松林里，海风一阵阵吹过来。
      desync: 拉丁答诗混进了《天堂篇》的抄稿，跟着散页一起送了出去，博洛尼亚那头只收到几页托斯卡纳话。{staff}没等到回信，就被事务所召了回来。
      not_admitted: '{staff}没能进誊写间的门，只在城外的松林里拾了几天柴。那两叠纸，还摞在但丁的案头。'
      points:
        p1:
          class_lettered: '{staff}照管文书的规矩，把誊写间里的两叠纸分开：托斯卡纳话的《天堂篇》留在案上，给博洛尼亚的拉丁答诗另放一处，单独折好。但丁在折口滴上蜡，用指节压平。信使把它揣进怀里，顶着一月的冷风出了城门，往博洛尼亚去了。'
          else: '{staff}心细，把誊写间里的纸一摞摞翻过，从《天堂篇》的散页里挑出给博洛尼亚的拉丁答诗，单独折好。但丁在折口滴上蜡，用指节压平。信使把它揣进怀里，顶着一月的冷风出了城门，往博洛尼亚去了。'
        p2: 三月的一个下午，但丁把刚写完的几行念给{staff}听。{staff}一句句跟着念回去，到末了，才说出憋了很久的那句话：这些诗往后几百年都会有人读，读的正是这种街头的话，佛罗伦萨也终有一天想接他回去。但丁把笔搁在墨水瓶沿上，看着那张纸。过了好一会儿，他又蘸了墨，接着往下写。
      excerpts:
        p2: 但丁把笔搁在墨水瓶沿上，看着那张纸。过了好一会儿，他又蘸了墨，接着往下写。
        p1: 但丁在折口滴上蜡，用指节压平。信使把它揣进怀里，顶着一月的冷风出了城门，往博洛尼亚去了。
