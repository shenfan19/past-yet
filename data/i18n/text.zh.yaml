  header_lines:
    - line: 溯洄从之，道阻且跻。
      source: 《诗经·秦风·蒹葭》
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: 溯游从之，宛在水中坻。
      source: 《诗经·秦风·蒹葭》
      url: https://ctext.org/book-of-poetry/odes-of-qin/zh
    - line: 我曾来过这里，却说不清何时，又是怎么来的。
      source: 罗塞蒂《乍现的光》
      url: https://rpo.library.utoronto.ca/content/sudden-light
    - line: 几时能再看见故乡小村的炊烟？
      source: 杜贝莱《悔恨集》
      url: https://fr.wikisource.org/wiki/Les_Regrets_(du_Bellay)#XXXI
    - line: 黑燕还会飞回来，把巢筑在你的阳台上。
      source: 贝克尔《诗韵》第五十三首
      url: https://es.wikisource.org/wiki/Rimas_(B%C3%A9cquer,_1885)/Rima_LIII
    - line: 油菜花开，月在东，日在西。
      source: 与谢芜村，俳句
      url: https://www.kahaku.go.jp/special/past/machigai/ex/director/19.html
    - line: 一颗星里有回忆，一颗星里有爱。
      source: 尹东柱《数星星的夜》
      url: https://www.incheon.go.kr/goodmorning/GOOD020102/view?curPage=&nttNo=1941458&srchCategoryCode=&srchPblicteIssnoCode=&srchWord=
    - line: 时光给大地披上绿衣，那里从前覆着寒雪。
      source: 卡蒙斯《十四行诗》
      url: https://camoesdigital.pt/obra/mudam-se-os-tempos-mudam-se-as-vontades/
    - line: 旧地图上，那条回家的路还在。
    - line: 门牌换了，下午的光还是落在原来的地方。
    - line: 下一站，是很久以前。
items:
  ors_pack:
    name: 口服补液盐
    desc: 一包兑一升水。救治病人用，每个病人要两包。
  chlorine_tablet:
    name: 氯片
    desc: 一片能让五个人的饮水变安全。又轻又便宜，但要有人肯听你讲。
  handbook:
    name: 现代医护手册
    desc: 提高救治手艺。也是递给当地医生的见面礼。
  recall_charm:
    name: 回收符
    desc: 濒死时把人接回。没带的话，装备全丢。
  radiation_shield:
    name: 辐射隔离器
    desc: 来自未来的铅衬防护罩，挡住粉尘和辐射。居里夫妇当年没有这样的东西。
  antibiotic:
    name: 抗生素
    desc: 能杀灭多种细菌感染，对病毒无效，也不是万能药。
  mosquito_net:
    name: 蚊帐
    desc: 把传播疟疾和黄热病的蚊虫挡在睡觉的人外面。
  face_mask:
    name: 医用口罩
    desc: 便宜的屏障，减少呼吸道疾病的传播，戴一次就丢。
  water_flask:
    name: 保温水壶
    desc: 带着走的烧开水，热天是凉的，冷天是热的。
  warm_blanket:
    name: 保暖毯
    desc: 很轻的毯子，在寒夜里把体温留住。
  neural_chip:
    name: 义体智能芯片
    desc: 耳后的芯片，能翻译任何语言，加快学习。不容易遮住。
  oxygen_can:
    name: 便携氧气瓶
    desc: 在稀薄的空气里救急的几口氧气。
  cyber_lung:
    name: 义体仿生肺
    desc: 能撑长时间重活的人造肺，会轻轻嗡鸣。
  painkiller:
    name: 止痛药
    desc: 压住几个小时的疼痛，不治病，只是争取时间。
  holo_cloak:
    name: 全息斗篷
    desc: 把光线绕开的斗篷，别人会不自觉地看过去。会降低被发现的几率。
  pack_frame:
    name: 背架
    desc: 把负重分到髋上，能多带五单位的东西。
  caffeine_tablet:
    name: 咖啡因片
    desc: 撑过一个夜晚，之后疲劳会补回来。
  golden_apple:
    name: 金苹果
    desc: 神话里的金苹果，听你说话的人容易被打动，说服力提高 200%。
  headlamp:
    name: 头灯
    desc: 夜里腾出双手读书写字用的光。
  thermal_suit:
    name: 恒温服
    desc: 在冰天雪地或酷暑里都保持体温的衣服，样子很奇怪。
  voice_recorder:
    name: 录音笔
    desc: 把要紧的话录下来，最后的谈话不会丢。
  water_station:
    name: 净水站
