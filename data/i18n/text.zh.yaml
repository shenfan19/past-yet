      p3: 在钢琴上为他弹哈巴涅拉
  modigliani_paris:
    name: 没人买的肖像
    place: 巴黎
    figure: 阿梅迪奥·莫迪利亚尼
    story: 莫迪利亚尼贫病交加，三十五岁时在巴黎一家医院死于结核性脑膜炎。很少有人买他那些长脸的肖像。
    relic: 一截炭条
    relic_desc: 一截能把手指染黑的炭条。
    points:
      p1: 看出那些长脸里有什么（画家或好奇的眼睛更合适）
      p2: 在画商面前替他说好话
      p3: 在病房里陪着他
  boole_ballintemple:
    name: 湿衣服与一堂课
    place: 科克巴林滕普尔
    figure: 乔治·布尔
    story: 乔治·布尔冒雨走到女王学院，穿着湿衣服讲课，死于肺炎，年四十九，他那套关于真和假的逻辑还没有用武之地。
    relic: 一页逻辑演算
    relic_desc: 一页方程，其中的字母代表是和否。
    points:
      p1: 劝他先休息
      p2: 陪他走过那段雨路
      p3: 缓解之后的高烧
  wallace_ternate:
    name: 来自特尔纳特的论文
    place: 特尔纳特
    figure: 阿尔弗雷德·拉塞尔·华莱士
    story: 华莱士在特尔纳特发着热病，几天里写出了自然选择的想法，寄给达尔文。他的名字将排在第二位。
    relic: 针盒里的一只甲虫
    relic_desc: 一只收集来的甲虫，放在小锡盒里。
    points:
      p1: 看着他把想法一点点写下来
      p2: 陪他熬过热病
      p3: 让这封信确实寄出去（译者、记者或善良的人更合适）
  hooke_london:
    name: 实验的管理人
    place: 伦敦
    figure: 罗伯特·胡克
    story: 罗伯特·胡克在显微镜下画过跳蚤，也参与了伦敦的重建，他死在格雷欣学院的住处。他没有一幅确定无疑的肖像留下来。
    relic: 一幅跳蚤的图
    relic_desc: 一幅玻璃下跳蚤的精细版画。
    points:
      p1: 看懂他的仪器（工程师、制图师或敏锐的头脑更合适）
      p2: 在学会里替他的名字说话
      p3: 在他的住处陪他坐坐
  leavitt_cambridge_ma:
