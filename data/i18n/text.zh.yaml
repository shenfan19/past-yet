  jenner_berkeley:
    name: 第一支疫苗
    place: 英国伯克利
    figure: 爱德华·詹纳
    story: 詹纳 1798 年出版的《探究》回顾了较早的牛痘与天花观察和病例。
    story_prose:
      opening:
        - 伯克利，萨拉·内尔姆斯到了屋门口，把裹过的手搁在围裙上。詹纳想问她从哪天开始病，抄写人却误把她的名字写到旁人的条目下。她站着等，想先说今天还要不要去奶场。
        - 1798 年，詹纳出版研究，回顾萨拉患牛痘的经过及 1796 年的一次早期接种。传统上与接种有关的孩子是詹姆斯·菲普斯。这一趟先听萨拉自己想要什么照护，再帮后来观察留下能核对的记录。
        - 懂照护的员工先去听萨拉说。擅长整理记录的人再把各份病例按姓名和来访日期核对，由家人及詹纳商量是否继续观察。
      points:
        p1: 抄写人在等日期，萨拉把手收回来，说先要有地方坐。你把椅子移到门边，问她想不想请照护者看看手。等她自己答应，你替她传话给奶场，让她晚些再回去。萨拉离开前还能腾出另一只手，自己拿走写着名字的那张纸。
        p2: 詹纳的笔记里有一页写着孩子回访的结果，下面还没留核对的日期。你把新页交给抄写人，让他分开当事人的记录和后来听来的说法。詹纳问后续观测谁还愿意回来，一户家人先留下了自己的地址。抄写人把日期填好，空出一行等他们到后自己确认。
      outcomes:
        all: 萨拉手上的不便有人照应，之后回访也有可核的记录。詹纳可以继续整理这一年的观察。
        p1: 萨拉能歇几天再回奶场。后续的病例记录仍要等别的来访者。
        p2: 早期观察之后还有可查的回访。萨拉手上的疮仍是她自己慢慢熬过去。
      none: 萨拉回到奶场时没有等到照护，后续观察也未约下来。
      not_admitted: 抄写人先问你跟哪一家的预约来。你没进门，那张日期旁还留着空白。
      excerpts:
        p1: 萨拉离开前还能腾出另一只手，自己拿走写着名字的那张纸。
        p2: 抄写人把日期填好，空出一行等他们到后自己确认。
    relic: 一张回访便笺
    relic_desc: 纸上写着姓名和日期，还留着一行记回访所见。
    points:
      p1: 替挤奶女工萨拉·内尔姆斯包扎手上的牛痘疮，不让她一个人硬熬
      p2: 核对早期病例记录上的姓名和日期，给愿意回访的家人约好时间
    points_fail:
      p1: 她手上的疮没人照料，自己慢慢熬过去，这条分支里没有人让她少受几天罪。
      p2: 没有人安排回访。这条分支里，詹纳和史实一样，到 1798 年才继续接种研究。
    shift:
      p1:
        was: 1796 年 5 月，挤奶女工萨拉·内尔姆斯从主人家的牛身上染上牛痘，手上长出一大块脓疱，也有这病常见的症状。
        now: '{staff}替她把手洗净包好，她早几天回到了奶场。'
      p2:
        was: 1796 年的早期病例之后，詹纳到 1798 年春才继续接种研究。
        now: '{staff}替愿意回访的家人约好了时间。那个夏天，詹纳就拿到了可以与先前记录互相核对的回访便笺。'
        who: jenner_berkeley
        bio: 在这条时间线里，1796 年夏天詹纳收到了自愿回访的家人留下的观察记录。
    vignettes:
      firsthand: 虚构的誊写员把每则记载都誊成了同一种口气。你问哪一件是记述者亲眼见过的。他在其余条目旁补上说明，没把每一行都当成同一等证据。
      order: 抄件里两条观察换了位置。你核对日期，誊写员先把纸签调回来，才照先后讲述。
      blank: 誊写员有一条无法确定，你在下面留了地方。纸递出去以前，空白旁添上说明，免得后来人当成漏抄。
  beethoven_vienna:
    name: 第九交响曲
    place: 维也纳
    figure: 路德维希·凡·贝多芬
    story: 1824 年春天，几乎全聋的贝多芬在维也纳筹办一场新作音乐会。合唱和乐队分开排练，正式演出前只有两次全体排练。5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，剧院乐长米夏埃尔·乌姆劳夫指挥，贝多芬在台上站在他旁边。5 月 23 日在大雷杜滕厅的第二场，听众稀落，票房让他失望。
    story_prose:
      opening:
        - 1824 年春，维也纳。贝多芬几乎全聋了，正为自己的新作筹一场音乐会，压轴是《第九交响曲》。排练里乐队奏出了什么，他得靠别人在谈话簿上写给他看。
        - 史实里，合唱和乐队分屋排练，直到首演前两天才第一次合在一起。5 月 7 日首演之后，23 日在大雷杜滕厅又演了一场，座位空了不少，票房让他失望。在这条分支里，抄谱人的桌上压着没干透的分谱，剧院后头的女高音揉着喉咙，抱怨末乐章的高音。
        - 这一趟用得上三种人：懂乐谱、合排时守得住拍子的人，听得出毛病、肯一条条记给作曲者看的人，说得动人、赶在城里人散去之前把座位订出去的人。
      outcomes:
        all: 5 月 23 日那晚，大厅里空座位还是不少，前面订过座的那几排坐满了人。那张名单，后来一直夹在他的谈话簿里。
        p3: 5 月 23 日那晚，大厅里空座位还是不少，订过座的那几排坐满了人。
        p2: 首演那晚，几处画过记号的进口，各声部都照着演了。那张纸后来夹在他的谈话簿里。
        p1: 5 月 7 日晚上，合唱和乐队在同一处进拍。贝多芬站在乌姆劳夫身旁，背对着观众。
      none: 5 月 23 日的大厅里，一排排空椅子在灯下摆得整整齐齐。
      desync: 5 月 5 日的合排上，两边的进口始终没对齐。{staff}被召回时，离首演只剩两天，乐队里还有人在争该从哪一拍进。
      not_admitted: '{staff}没能进剧院的后台。合唱和乐队还在各自的屋里练，离首演没剩几天了。'
      points:
        p1: 5 月 5 日，合唱和乐队第一次挤进同一间屋子。开头几小节，两边各按各的速度进来。{staff}站在乐队和合唱之间，照着总谱一拍一拍打给两边看。再来一遍，两边一起落了拍。贝多芬站在角落里，听不见，只看见所有人的弓和嘴在同一刻停了下来。
        p2: 总排那天，{staff}把前一天合排里出错的几处进口抄在同一页纸上，写明哪一声部、第几小节、差在哪里，递给贝多芬。他把纸凑到眼前看了很久，又拿笔在几处旁边一一画了记号。纸递回来的时候，记号压着记号。
        p3: 五月下旬，城里有钱的人家开始往乡下运箱子。{staff}揣着节目单一家家敲门，有一家的管家只开了半扇门，说老爷后天就走。{staff}把节目单展开，指着《第九交响曲》那一行，说写这首曲子的人已经听不见了。管家拿着单子进去，出来时手里多了一张订金的条子。那天晚上，订座的名单送到贝多芬住处。他把那张纸压在谈话簿底下，名字一个一个往下看，看到最后一个，又从头看了一遍。
      excerpts:
        p3: 那天晚上，订座的名单送到贝多芬住处。他把那张纸压在谈话簿底下，名字一个一个往下看，看到最后一个，又从头看了一遍。
        p2: 他把纸凑到眼前看了很久，又拿笔在几处旁边一一画了记号。纸递回来的时候，记号压着记号。
        p1: 再来一遍，两边一起落了拍。贝多芬站在角落里，听不见，只看见所有人的弓和嘴在同一刻停了下来。
    relic: 一只助听喇叭
    relic_desc: 世界静下来的时候，他举到耳边的号角。
    points:
      p1: 在合唱与乐队第一次合排时把分开练过的开头对齐，护住《第九交响曲》的首演
      p2: 给听不见乐队的贝多芬留一份合排记录，让他有机会在正式演出前回应
