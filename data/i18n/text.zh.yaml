catalog:
  pythagoras_croton:
    name: 第二根弦
    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 亚里士多德后来记述，他所称的毕达哥拉斯派把音阶中的音程同数联系起来。现有出处没有记下毕达哥拉斯亲自上过这样一课。
    relic: 两处点过墨的弦
    relic_desc: 工坊用来练习的弦，一处是凭记忆点的，另一处是量过弦长才点的。
    points:
      p1: 在同一根弦上比较整段与半段
      p2: 请做琴的人让另一个人试用记号
      p3: 稳住拍子，让两个学徒轮流拨弦
    vignettes:
      octave: 墨拉斯凭记忆在老师按过手指的地方点了墨。你把备用弦折成两段，指出中点到底在哪儿。他补了第二个记号，这次听到了八度。头一个点也留着，下一个学徒还可以拨出两处的差别。
      ear: 吕西斯能听声跟上，却没人给他看过手该按哪儿。你敲着拍子，让他听墨拉斯拨一次，再自己试。窗板合上时，吕西斯照着记号就能拨出这个音程，用不着先有人唱给他听。
      credit: 你几乎能看见后世把一个名人印在每道习题上。墨拉斯问备用弦该署谁的名。你记下他试的是哪一段，留他给自己的活署名。下一堂习作开始时，你已经回去了。
  thales_miletus:
    name: 留空的时辰
    place: 伊奥尼亚米利都
    figure: 泰勒斯
    story: 希罗多德把一次战事中白昼转暗的预告归于米利都的泰勒斯，只说他预告了年份，没有交代方法。
    relic: 一片留着空格的蜡板
    relic_desc: 港口记录，分别给年份和时辰留了格。
    points:
      p1: 比较传来的年份和记事人后来加上的时辰
      p2: 劝船主把传闻和约好的时辰分开
      p3: 等一等，看两处空格里有哪一格能填上
    vignettes:
      year: 赫格西亚斯留了两格，一格写年，一格写时辰。讲故事的人说了年份，他自己补了时辰，好让两格都齐整。船开之前，你让他把原话重念一遍。一格仍空着，这回是有意留空的。
      appointment: 船主墨利塔听过传闻，问要不要叫船员提前回来。你递给她两面蜡板，一面记听来的故事，一面写和船员说定的时辰。她自己定下回来的时候。那条传闻管不了谁提前返港。
      spoiler: 你差点说出后世的历书能标出当地时刻。赫格西亚斯把蜡板转到你面前，递来尖笔。你说不出这则故事的传话人怎么算出时刻，便把笔还给了他。回港的船还没露面，你已离开。
  socrates_athens:
    name: 船回来之前
    place: 雅典
    figure: 苏格拉底
    story: 前 399 年，苏格拉底在雅典受审，被判死刑。雅典每年派往提洛岛的船刚刚出发，船回港以前城里不处决人，他在狱中等了约三十天。这些日子里他把伊索寓言改写成诗，朋友们天天来看他。最后那天朋友们都在，只有柏拉图病了没来，傍晚他饮下了毒芹汁。
    relic: 集市上的陶杯
    relic_desc: 一只雅典的黑釉陶杯，杯沿磕掉了一小块。
    points:
      p1: 陪审席上的喧哗一阵阵压过来时，护住他把申辩讲完
      p2: 帮他把狱中改写成诗的伊索寓言和献给阿波罗的颂歌写完，抄一份带出狱外
      p3: 最后那天之前，治好病中的柏拉图，让他赶到狱中送老师最后一程
    points_fail:
      p1: 喧哗盖过了申辩，他没能把话讲完，这条分支与历史脱了节，事务所召回员工。
      p2: 这些诗照史实一首也没有传下来，这条分支里也没有。
      p3: 那天柏拉图照史实病着没来，这条分支里他也没在老师身边。
    shift:
      p1:
        was: 前 399 年，苏格拉底在雅典受审，柏拉图《申辩篇》里他一再请陪审员不要喧哗，把话听完；他被判有罪，判处死刑。
      p2:
        was: 前 399 年，苏格拉底在狱中等待行刑时，照一个反复出现的梦的吩咐，把伊索寓言改写成诗，又作了一首献给阿波罗的颂歌；这些诗没有完整传下来。
        now: 几首诗抄成一卷，由朋友带出狱门，留在了雅典。
      p3:
        was: 前 399 年，苏格拉底在狱中饮毒芹去世那天，朋友们都在，柏拉图因病没来。
        now: 柏拉图病好了，那天也在狱中，坐在朋友们中间，一直待到最后。
        who: plato_academy
        bio: 这条时间线里，柏拉图那场病治好了，苏格拉底最后一天，他在狱中陪着老师。
    vignettes:
      rumours: 开庭前一天，{staff}在集市上问了三个摊子，这老头犯的是什么事，得了三种说法。{staff}一样记一行，等明天听庭上念的是哪一条。
      harbour: '{staff}每天傍晚走到比雷埃夫斯港，问卖鱼的提洛岛的船回来没有。天天是同一个回答，{staff}说不清自己是盼它来，还是盼它别来。'
      gate: '{staff}替狱墙外卖灯油的女人挑水，换来墙根下一块歇脚的地方。探视的人每天天一亮就等在门口，{staff}渐渐认得了他们的脸。'
  hippocrates_kos:
    name: 无人看守的那一夜
    place: 科斯岛
    figure: 希波克拉底
    story: 传于希波克拉底名下的《流行病》逐日记录病程，其中有塔索斯岛的病例。
    relic: 一页练习值守记录
    relic_desc: 逐日记录，留着两个起算点。
    points:
      p1: 找出两份记录各从哪天开始数
      p2: 替另一名记录人值守一段，让对方休息
      p3: 问问没留下笔记的那一夜谁在场
    vignettes:
      days: 米里涅把自己第一次来看记作第一天，莱昂从前一夜就开始数。你把两张纸放到同一盏灯下，让两人指给你看同一个早晨。纸上保留两个数字，旁边注明各从哪里数起。
      watch: 莱昂要走了，米里涅从天没亮就醒着。你在外面守灯，让她先歇一会儿。下一轮换班，她把纸拿回来。夜里这一段有人接着看了。
      blank: 你知道后来的人会看重逐日记录。米里涅初次到访之前那一格，眼下找不到观察人来填。你只在空处旁添个记号。前一轮值守的人，你走之前还不会回来。
  plato_academy:
    name: 没有抹平的方格
    place: 雅典
    figure: 柏拉图
    story: 后世传记把柏拉图与雅典城外的学园联系起来。《美诺篇》中，原方形的对角线成了面积加倍的新方形的边。
    relic: 一块借来的蜡板
    relic_desc: 习作蜡板的另一面留着修改过的图。
    points:
      p1: 先数出四倍的面积，再回答学生
      p2: 把第一笔错图和改过的图画在一起
      p3: 请围观的人用半个方格拼出新图形
    vignettes:
      diagonal: 米孔把边画长了一倍，请你看面积。你用笔尖沿他画出来的四个小方格走了一圈。他从前一错就抹平蜡面，这回留下了四格，在另一面另起一图。
      squares: 灯油快尽了，多萝得把蜡板带回家。你扶稳板，她从一角划到对角。四块半格刚好拼成新图。明天来学的人，就是你不在，也能亲手数一遍。
      reveal: 米孔还没试过加长的边，你就抢先说了对角线。他能复述答案，却画不出新方形。你抹掉自己的答案，只给他留下起笔的两个角。再试一遍，要等下一盏灯。
  aristotle_lyceum:
    name: 落错栏的螃蟹
    place: 雅典
    figure: 亚里士多德
    story: 亚里士多德在《动物志》第一卷中区分动物住在哪里和怎样运动，以会走路的螃蟹为例之一。
    relic: 一枚留着地名的贝壳
    relic_desc: 标本习作里的贝壳，旧签写着拾到它的地方。
    points:
      p1: 拿螃蟹的图去核对运动一栏
      p2: 扶住贝壳盘，等人换过标签
      p3: 请亲眼看见的人说说那动作
    vignettes:
      two_columns: 提玛瑞忒拿来一张单列表，把螃蟹归在游泳的动物里。你划出第二栏，请她拿这张图填两遍。再念一遍时，她说海是发现它的地方，走才是亲眼看见的动作。
      shell: 达蒙为了配合新表，正打算刮掉贝壳上旧标签的字。你请他把壳搁在桌上，说说是在哪儿拾的。他把旧签留在新签旁。一张记地点，一张记观察。
      names: 你忍不住说起后世的书会怎么给这些动物起名。提玛瑞忒问，新名字能帮她明天认出哪一只？你趁还有光，把小蟹的足都画清楚。她关窗时，墨还没干。
  euclid_alexandria:
    name: 《推论集》还在的时候
    place: 亚历山大
    figure: 欧几里得
    story: 约公元前 300 年，欧几里得在亚历山大写成《几何原本》十三卷，从定义和公设出发，一步步证明几何命题。他还写过《推论集》三卷、《圆锥曲线》等书，后来都失传了。公元四世纪的帕普斯还能介绍《推论集》，记下它的命题数。
    relic: 一把青铜圆规
    relic_desc: 两条臂和一个轴，足够画出书里的每一个图形。
    points:
      p1: 帮他把《推论集》三卷多抄几部，交到学生手里，不让这部书失传
    points_fail:
      p1: 《推论集》照旧只有一路抄本，这条分支里它还是失传了，只剩帕普斯留下的几句介绍。
    shift:
      p1:
        was: 约公元前 300 年，欧几里得写成《推论集》三卷；原书后来失传，今天只知道公元四世纪帕普斯记下的命题数 171 和一段简短的介绍。
        now: '{staff}帮他把《推论集》多抄了几部，交给跟他学几何的人，这条时间线里这部书传到了后世。'
        who: euclid_alexandria
        bio: IF 线里，欧几里得的《推论集》多抄了几部，没有失传，后人读到的他不只有《几何原本》。
    vignettes:
      lost: '{staff}在抄书人的案头看见一卷《推论集》，知道后世的人只能从帕普斯的几行字里猜它写了什么。{staff}的手按在卷边上，停了好一会儿才松开。'
      arcs: '{staff}学着学生的样子，用木钉和绳子在沙盘上画圆，两道弧一交，第三个点就出来了。{staff}抹平沙子又画一遍，第二遍手稳多了。'
      papyrus: '{staff}帮码头上卖莎草纸的人把一捆捆纸扛上岸，听他讲哪种纸经得住港口的潮气，哪种放一年就脆了。'
  archimedes_syracuse:
    name: 城破的那一天
    place: 西西里锡拉库扎
    figure: 阿基米德
    story: 罗马军队围攻叙拉古两年，城里靠阿基米德设计的器械守了下来。公元前 212 年，叙拉古城破。罗马主帅曾下令放过阿基米德，年约七十五的他还是在城破时遇害。
    relic: 留着吃水线的小舟
    relic_desc: 工坊里拿来练习的小舟。
    points:
      p1: 叙拉古城破那天，带阿基米德平安避开乱兵
    points_fail:
      p1: 他照史实在城破时遇害。
    shift:
      p1:
        was: 公元前 212 年，罗马军队攻下叙拉古，年约七十五的阿基米德遇害，尽管罗马主帅曾下令放过他。
        now: 城破那天，他被平安带离乱处，活了下来。
        who: archimedes_syracuse
        bio: 这条时间线里，阿基米德平安度过公元前 212 年叙拉古城破的那一天，活了下来。
    vignettes:
      load: 堤刻以为宽舟会挤出更多水。你把两只舟配到同样重。宽舟吃水浅一些，接到的两份水却一样重。她把两只舟都留下了，原本还想把大的削成小的那样。
      settle: 尼孔关坊前得还水盆，头一回接的水还在晃，就要做第二回。你请堤刻先去还砝码，趁空等水静下来。尼孔又称了一次，走时多带走一次读数，水盆也赶得及还。
      crown: 你问尼孔，阿基米德是不是在浴池里验过国王的冠。他低头看看两只小舟，问你有哪一顶冠可以拿来上秤。你知道的是很久以后罗马人会讲的故事。带走的，是这盆水还能重做一遍的刻痕。
  eratosthenes_alexandria:
    name: 量地球的那部书
    place: 亚历山大
    figure: 埃拉托色尼
    story: 公元前三世纪，昔兰尼人埃拉托色尼担任亚历山大图书馆馆长。他自己写的测地著作已经失传。据克莱奥梅德斯后来的记述，夏至正午，塞伊尼的太阳正在头顶，亚历山大却还有日影。两地的角度差是全圆的五十分之一；两地相隔五千斯塔迪亚，绕地球一圈就是二十五万。
    relic: 一根日晷针
    relic_desc: 一根朴素的立杆，影子告诉他太阳的角度。
    points:
      p1: 帮他把《论地球的测量》多抄几部，存进图书馆也送出城去，不让他亲笔写下的方法失传
    points_fail:
      p1: 这部书照旧只有原来那几部抄本，这条分支里它还是失传了，后人只能从克莱奥梅德斯简化过的转述里认识他的方法。
    shift:
      p1:
        was: 公元前三世纪，埃拉托色尼把测地的方法写进《论地球的测量》；原书后来失传，方法主要靠克莱奥梅德斯简化过的转述留下，克莱奥梅德斯自己也说原法更繁。
        now: '{staff}帮他把这部书多抄了几部，这条时间线里他亲笔写的方法和后来的转述一起传了下来。'
        who: eratosthenes_alexandria
        bio: IF 线里，埃拉托色尼测量地球的那部书没有失传，后人能照他自己的话核对他的方法。
    vignettes:
      noon: 夏至正午，{staff}蹲在一根立杆旁，用指甲在地上划下影子的尖。过一会儿再看，影子已经挪开了一指宽。
      beta: '{staff}听图书馆的抄书人背地里管馆长叫"贝塔"，说他样样都只排第二。{staff}知道后世记住他的，偏偏是他量出来的那一整圈地球，憋着没笑出声。'
      shelves: '{staff}帮图书馆的杂役把卷子一捆捆扛上架，每捆系一块小木牌。杂役说，不识字的人也认得牌上的记号。'
  hypatia_alexandria:
    name: 那年三月的亚历山大
    place: 亚历山大
    figure: 希帕提娅
    story: 415 年初，希帕提娅仍在亚历山大讲授数学与哲学，城里的官员也来听她讲。城中长官与另一股势力的积怨一周比一周深，她因与长官往来，被卷进了这场争执。
    relic: 一张浮标刻线图
    relic_desc: 试验台的刻线图，画出了从哪里读数。
    points:
      p1: 三月风声最紧之前，劝她暂离亚历山大，或那天改走别的路，救下她
    points_fail:
      p1: 她照旧在城里来往，这条分支里，那个三月她仍然遇害。
    shift:
      p1:
        was: 415 年 3 月，数学家、哲学家希帕提娅在亚历山大城中的动荡里遇害。
        now: 那个三月她不在城里，等局势平静下来，才回到亚历山大接着讲课。
        who: hypatia_alexandria
        bio: 这条时间线里，希帕提娅听了劝，415 年三月之前离开亚历山大，躲过了那个春天，后来回城继续教书。
    vignettes:
      scale: 提蒙用拇指按住一道刻线，说这就是结果。妮萨照浮标接触液面的位置读。你请他们松开手，等浮标自己立稳再看一遍。这次两人报的是同一格。妮萨把读数时站的位置也写了进去。
      copy: 妮萨只剩一面蜡板，原想用大字把结果一抄。你把观察写在上半边，留给她在下面画仪器。下一个读到的人，既有读数，也有图可循，知道刻线该从哪里看。
      name: 你原可以讲讲后世怎么称呼这件器具。提蒙已一手拿布，要把浮标从杯里提出去。你趁最后这点安静，请妮萨自己再读一次。收信人拿到成品后会怎样用，你已看不到了。
  fibonacci_pisa:
    name: 1202 年的初编
    place: 比萨
    figure: 斐波那契
    story: 比萨的列奥纳多少年时在北非海岸的布吉亚学会用九个印度数字算账，他父亲在那里替比萨商人办事。1202 年，他回到比萨写成《计算之书》，教人用这些新数字和零来记数、做买卖。1228 年他把书改订了一遍，今天传下来的抄本都出自这第二版。
    relic: 一块写着数字的蜡板
    relic_desc: 板上把十个新数字和旧的罗马数字并排写在一起。
    points:
      p1: 说服列奥纳多把 1202 年初编的一整套抄本签好名留在比萨，让它不被后来的修订本取代
    points_fail:
      p1: 等作者改写以后，借书人只认得后来那一套抄本，不能恢复早本。
    shift:
      p1:
        was: 1202 年，比萨的列奥纳多写成《计算之书》初编；初编没有完整的抄本留存，传下来的抄本出自 1228 年的修订本。
        now: 留存的早本注明旧例和编成年份。等修订本出现，两份可并读，读者能查哪些例题是后来才补的。
        who: fibonacci_pisa
        bio: 比萨的列奥纳多 1202 年的初编留下了一部完整的抄本，与 1228 年的修订本并存，后人能对出他这些年里改了什么。
    vignettes:
      rabbits: '{staff}在抄本里读到一道题：一对兔子每个月生一对小兔。{staff}忍不住在页边数到第十二个月，数出来的数，和后世课本上的一个也不差。'
      zero: '{staff}在码头的账房里教学徒把空着的一位写成零。学徒说这个小圈什么也不是，凭什么占一栏。{staff}让他把两本账对一遍，他就不吭声了。'
      quay: '{staff}在阿诺河边帮人从船上卸货包，一包上岸就报一声数。岸上的账房一边听，一边在板上划一道。'
  giotto_padua:
    name: 有分量、有感情的人物
    place: 帕多瓦
    figure: 乔托
    story: 斯克罗威尼礼拜堂将帕多瓦现存的乔托壁画定年为 1303 至 1305 年。画面沿墙分层展开。
    relic: 一罐蓝颜料
    relic_desc: 磨好的蓝色，是礼拜堂穹顶的颜色。
    points:
      p1: 邻院提出异议后，请委托人把外部工程与乔托已画的墙面分别登记，给画工留出能继续照管画面的窗口
      p2: 请乔托把用于后续修补的颜色样与墙面位置配成册，交给两个能继续照管绘画的人
    points_fail:
      p1: 停工单把壁画养护也一并撤下。画工进不去，尚需照管的画面受损，事务所召回员工。
      p2: 工房收走颜色样，接手的人只按墙面现状判断先前用过的材料。
    shift:
      p1:
        was: 1305 年 1 月 9 日，邻近修院对斯克罗韦尼建筑的规模和使用提出投诉。乔托的壁画组仍然留存。
      p2:
        was: 这组壁画后来经多次保护与修复，现存画层和建筑痕迹留下许多可研究的信息。
        now: 接手的人手里有一册写了位置的样纸，可以在修补前先看哪里保留了最早的一层。
        who: giotto_padua
        bio: 乔托在帕多瓦留下一册注明墙面位置的颜色样。后来几百年的修补都能照着它，找回他当初上的颜色。
    vignettes:
      eye: 访客总从面孔最清楚的地方看。你请他把视线拉回画角，看看接下来会往哪儿去。他顺着画中人的手势，看到了下一部分。
      register: 访客要直接往正下方一层接着看。你在空中沿墙比出看画的顺序。他往前走几步，找到了刚才在找的那一幕。
      step: 你陪访客往后退，直到两幕能一起看见。他指出一处刚才站在画底下看不见的细节。
  dante_ravenna:
    name: 用街头的语言写一部长诗
    place: 拉文纳
    figure: 但丁
    story: 但丁 1302 年被逐出佛罗伦萨，约 1318 年移居拉文纳，在那里写完《神曲》的最后一部《天堂篇》，用的是托斯卡纳的日常口语。1319 年前后，博洛尼亚的学者乔万尼·德尔·维尔吉利奥寄来拉丁诗，劝他改用拉丁文写作、到博洛尼亚接受桂冠，但丁用拉丁诗作答。1320 年 1 月 20 日，他在维罗纳作了一场讲演。1321 年 9 月，他从威尼斯出使回来后病倒，在拉文纳去世。
    relic: 一片月桂叶
    relic_desc: 诗人桂冠上的一片干叶。
    points:
      p1: 给但丁腾出从拉文纳寄出答诗的时间，把他答乔万尼的拉丁诗单独封存，别夹入正在誊写的《天堂篇》
      p2: 让流放中的但丁知道，《神曲》会被一代代人读下去，佛罗伦萨后来也想把他迎回去
    points_fail:
      p1: 收信人只拿到正文散页，答诗仍在抄稿夹里，事务所因同步失败召回员工。
      p2: 他照旧在拉文纳写诗，回佛罗伦萨的盼望没有着落，这条分支里没人告诉过他后来的事。
    shift:
      p1:
        was: 1319 年下半年至 1320 年初，但丁在拉文纳写《天堂篇》时，与博洛尼亚的乔万尼·德尔·维尔吉利奥开始拉丁诗通信，这是学界的推定。
      p2:
        was: 1321 年 9 月，但丁在拉文纳去世，到死没能回到佛罗伦萨；1519 年前后佛罗伦萨请求迁回他的遗骨，拉文纳的修士把遗骨藏进了墙里。
        now: '{staff}在拉文纳让他知道，《神曲》往后会一直有人读，他的城市终有一天想把他接回去。'
        who: dante_ravenna
        bio: 流放中的但丁在拉文纳的晚年得知，他的诗会长久流传，佛罗伦萨终会以他为荣。
    vignettes:
      latin: '{staff}在誊写间看见两叠纸：一叠是托斯卡纳话写的《天堂篇》，一叠是要寄往博洛尼亚的拉丁诗，来信说只有拉丁文才配得上桂冠。{staff}知道七百年后人人读的是哪一叠，话到嘴边，又咽了回去。'
      pinewood: '{staff}跟着拾柴的人走进拉文纳城外靠海的松林，在沙地上歇脚，听得见林子那头的海浪。'
      ink: '{staff}帮卖墨水的人把一罐罐墨从船上搬下来。墨是用栎树瘿和铁锈熬的，卖墨的说，城里誊写的人买得最多。'
  gutenberg_mainz:
    name: 用活动金属字模印书
    place: 美因茨
    figure: 古腾堡
    story: 美因茨商人约翰·富斯特两次各借给古腾堡八百古尔登，供他做印书的事业。1455 年，四十二行本在古腾堡的印坊里印成，富斯特却打起官司，讨还借款和利息，11 月 6 日公证人把这场官司记了下来。此后印坊归了富斯特。
    relic: 一粒铅字
    relic_desc: 铅锡合金的一个小字，是反着的。
    points:
      p1: 富斯特催逼还钱的时候，护住印机不停，让四十二行本最后几帖印完
      p2: 11 月 6 日公证人记下官司之前，帮他把借款、账目和证人理清，保住印坊和那套印书的工具
    points_fail:
      p1: 四十二行本印到一半停在印机上，这条分支与历史脱了节，事务所当天召回员工。
      p2: 印坊和那套工具照史实在官司后归了富斯特，这条分支里也一样。
    shift:
      p1:
        was: 1455 年，四十二行本在美因茨古腾堡的印坊里用金属活字印成。
      p2:
        was: 1455 年 11 月 6 日，美因茨的公证人记下约翰·富斯特起诉古腾堡讨还借款和利息一案；此后印坊归了富斯特。
        now: 他在官司里保住了印坊和那套工具，在美因茨接着自己印书。
        who: gutenberg_mainz
        bio: 这条时间线里，古腾堡在 1455 年的官司里保住了印坊和工具，在美因茨自己的印坊里接着印书。
    vignettes:
      wrong_sort: 学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。
      reader: 你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。
      proof: 你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。
  leonardo_florence:
    name: 画画的人，也画机器
    place: 佛罗伦萨
    figure: 列奥纳多·达·芬奇
    story: 卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。
    relic: 一页镜像书写的笔记
    relic_desc: 一页反着写的字，要对着镜子才读得出。
    points:
      p1: 在工房接下别的市政绘画工作以前，给丽莎的画像留一个白天可用、暂存时可认出的位子
      p2: 替画家与经办人议定分段查看的机会，趁画像还在佛罗伦萨，让坐画的人看到一份由画家同意展示的阶段稿
    points_fail:
      p1: 新工作一到，未干的画板被夹进旧架，画像在这次交接中受损，事务所召回员工。
      p2: 没约定何时可看，画像继续留在画家手中。委托一方只能听工房传来说到了哪一步。
    shift:
      p1:
        was: 韦斯普奇 1503 年十月的书上批注说，达·芬奇正在画丽莎·德尔·焦孔多。
      p2:
        was: 这幅肖像历经长时间修改，最终随画家离开意大利并进入法国收藏。
        now: 丽莎来时，画家给她看这一阶段已成形的肖像。以后画板仍可随画家带走，工房另留一份双方见过的稿样。
        who: leonardo_florence
        bio: 佛罗伦萨的同时代批注证实画家在做丽莎的肖像。后来画作继续发展，流传远离最初的工房。
    vignettes:
      shadow: 你请学徒指一指，脸从哪儿结束，背景从哪儿开始。他伸手又犹豫了，没有加重那道线，先把交界处留着再看。
      hands: 访客记得脸，却把手的位置画变了。你把习作和他凭记忆画的图并排，让他自己找出线条挪到了哪里。
      seat: 学徒收拾东西时，你在地上替模特的椅子做了个记号。他把画留在半成处，下次来仍知道椅子该放哪儿。
  copernicus_frombork:
    name: 太阳在中心
    place: 波兰弗龙堡
    figure: 哥白尼
    story: 1539 年，年轻的数学家雷蒂库斯来到弗龙堡，劝尼古拉·哥白尼把书付印。1543 年，《天体运行论》在纽伦堡印成，书中地球自转并绕太阳运行，卷首多了一篇不署名的《告读者》。哥白尼从 1542 年底起一直病着，1543 年 5 月 24 日在弗龙堡去世。他的朋友蒂德曼·吉泽后来写信说，印好的书到他去世那天才送到他手上。
    relic: 一个黄铜象限仪
    relic_desc: 四分之一圆，用来量星星的高度。
    points:
      p1: 趁弗龙堡还来得及清点，把《天体运行论》的亲笔原稿和工作纸分开记账，给后来接手的吉泽留一张收执
      p2: 吉泽催印坊改版前，先为附近传阅的印本备一张勘误页，列出作者序言所在及匿名告读者文在原稿中缺席的事实
      p3: 趁他神志还清楚，把印好的《天体运行论》送到他手里，让他知道这本书印成了
    points_fail:
      p1: 收拾桌上纸张时，两叠工作纸被当作已经交给印坊的那份抄本处理。亲笔原稿没有交到吉泽手上，事务所因同步失败召回员工。
      p2: 吉泽只能等外地印坊和市议会答复，附近的读者仍按原来的页面顺序翻读。
      p3: 印好的书送到他手上那天，正是他去世的 5 月 24 日。
    shift:
      p1:
        was: 1543 年，纽伦堡印本以抄本为底，哥白尼的亲笔原稿另存，后来经蒂德曼·吉泽传至雷蒂库斯。
      p2:
        was: 1543 年 7 月，吉泽请雷蒂库斯把要求改版的信转交纽伦堡市议会，1543 年首版的匿名文字已经随着印本流通。
        now: 附近几份先借出的书都补上一张勘误页。新借书的人能从旁边那页查回原稿，外地印坊的回复也留在同一份档案里。
      p3:
        was: 1543 年 5 月 24 日，哥白尼在弗龙堡去世。吉泽后来写信说，印好的书到他去世那天才送到他手上。
        now: 五月初，印好的书就送到了他的床前，他在神志清楚时把它拿在手里。几周以后，他在弗龙堡去世。
        who: copernicus_frombork
        bio: 哥白尼在去世前几周收到了印好的《天体运行论》，知道这部写了几十年的书已经印成。
    vignettes:
      preface: '{staff}翻开一本印好的书。卷首那篇不署名的《告读者》说，书里的说法只是便于计算的假设。{staff}知道要再过五十年左右，开普勒才会说出是谁写的，合上书时，手指还压在那一页上。'
      window: '{staff}在病房外守着一壶热水。屋里的人说，老人已经认不太清人了。{staff}把窗推开一条缝，让春天的风吹进去。'
      nets: '{staff}在山脚的渔村帮人补网，望得见维斯瓦潟湖。渔夫说，山上住着一位老教士，夜里常看星星。'
  vesalius_padua:
    name: 图下那个字母
    place: 帕多瓦
    figure: 维萨里
    story: 维萨里在帕多瓦任教时筹备《人体构造》，木刻版从威尼斯送交约翰内斯·奥波里努斯，1543年在巴塞尔刊印。
    relic: 一页校过的习作图
    relic_desc: 读者拿来习作的一页，图文对应的记号已经订正。
    points:
      p1: 核对图上字母与正文说的是否同一处
      p2: 两份图放在一处，等人标出对不上的字母
      p3: 帮接手的读者看清改动是从哪里来的
    vignettes:
      letter: 露琪亚用手指点住页边一个字母，马可却指到图上另一处。你把练习纸移到打开的书旁，让两人看清符号从哪儿抄偏了。露琪亚改好索引，页边还认得出原来那个错位的标记。
      hold: 借来的印本得还，马可还要看图。你帮他撑开书，等他在自己的纸上记下图的位置和字母。书主取走之后，他回到桌前还能查到一份。
      credit: 你知道后人会试图认出制图者。露琪亚问练习页上要不要署画工名字。你找得到印本里的图，却定不了谁画的。她留一行待写来处，合上了书。
  shakespeare_globe:
    name: 人人都能进的剧场
    place: 伦敦
    figure: 威廉·莎士比亚
    story: 《亨利五世》的开场合唱请观众想象舞台呈现不了的地点和事件。
    relic: 一支鹅毛笔
    relic_desc: 削好的羽毛笔，笔尖上还有墨。
    points:
      p1: 找一个能听清接词的位置
      p2: 帮演员在没有布景时交代身在何处
      p3: 留下来再核对一遍上场信号
    vignettes:
      back_row: 你站到院场边缘，听不见尾字时就举手。演员再试一遍，这一次转过身朝向观众。
      space: 你问演员怎么把整片乡野塞上几块台板。他指着一道门，请你穿过去，走得像刚赶了一整天路。
      cue: 你听清了哪一个字是下一人上场的信号。他们再试一次，这回字音一落，门便开了。
  galileo_padua:
    name: 木星身边的卫星
    place: 帕多瓦
    figure: 伽利略
    story: 伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。
    relic: 一片磨制的透镜
    relic_desc: 一片小小的玻璃透镜，是手工磨出来的。
    points:
      p1: 把一月连夜画下的木星与光点位置按日期装好，护住送往威尼斯付印时的观测日序
      p2: 四月下旬在博洛尼亚，帮马吉尼的客人们从伽利略的望远镜里看见木星的卫星
    points_fail:
      p1: 几夜的简图散开后只剩大致次序，排印稿的日序错位，事务所因同步失败召回员工。
      p2: 客人们看过以后说什么也没看见。霍尔基写信给开普勒，六月印出反驳《星际信使》的小册子。
    shift:
      p1:
        was: 伽利略从 1610 年 1 月起连续观测木星，随后在《星际信使》刊出位置记录。
      p2:
        was: 1610 年 4 月下旬，伽利略在博洛尼亚的卡普拉拉宫把望远镜给马吉尼等客人看，他们说看不到那几颗卫星；在场的马丁·霍尔基六月印出了反驳伽利略的小册子。
        now: '{staff}把镜筒架稳，教客人往哪里看。好几位客人当晚看见了木星旁边的光点，霍尔基的小册子少了立足的地方，这几颗新星早一些得到承认。'
        who: galileo_padua
        bio: 1610 年 4 月在博洛尼亚，马吉尼的客人们从伽利略的望远镜里看见了木星的卫星。《星际信使》之后的怀疑短了许多。
    vignettes:
      alignment: 你拦住正要把两页按纸边对齐的誊写员。先对齐木星吧。纸一挪，几个光点就错开了。
      telescope: 你追问第四个光点是哪一个。誊写员摊开几晚的图，反问你：有两个点挨得看不清时，该相信哪一夜？
      dates: 誊写员叠起散页之前，你替每张补上日期。下一个人就能按夜看出光点怎样换了位置。
  descartes_leiden:
    name: 把怀疑当作方法
    place: 莱顿
    figure: 笛卡尔
    story: 笛卡尔的《谈谈方法》1637 年在莱顿刊行，随附光学、气象和几何三篇论文。
    relic: 一张折起来的小纸条
    relic_desc: 纸条上只有一句话，讲思考与存在。
    points:
      p1: 给莱顿印坊核齐正文和三篇附论的末次校样，护住四部分能一起刊行
      p2: 照笛卡尔寄出的勘误单逐项查图和正文，把晚到的更正也标进留底本
    points_fail:
      p1: 印坊发现一篇附论的几张图还缺着，整卷只能拆开处理，事务所因同步失败召回员工。
      p2: 首轮校样已交，晚到勘误只剩一张没有页码的便条。
    shift:
      p1:
        was: 1637 年，莱顿的扬·迈尔印行《方法论》，书中合刊光学、气象及几何三篇附论。
      p2:
        was: 1637 年 6 月初，笛卡尔在付印完成前两天的信里提到一包勘误。
        now: 印坊把晚到的勘误按页登记，日后问到图和正文如何相对，可以翻出同一位置。
        who: descartes_leiden
        bio: 笛卡尔 1637 年的初版带着他寄去的勘误一起印出，读者手里的图和正文对得上。
    vignettes:
      parts: 读者卡在整道题里。你标出能先解决的一小问。他先做完这一部分，才翻到写答案的那页。
      claim: 另一位读者说结果显而易见。你请他指出究竟是哪一步让结果这样明白。他们重读例子中段，两人之前都没在这里停过。
      contents: 你把讲方法的一页同例题一起翻开。读者把纸签从自己喜欢的那条规则，移到了能看见它如何使用的一页。
  leeuwenhoek_delft:
    name: 一滴水里的世界
    place: 代尔夫特
    figure: 列文虎克
    story: 1676 年 10 月，列文虎克从代尔夫特写信说，一滴胡椒水里有成千上万的小动物。伦敦皇家学会的会员们不信，格鲁也没看见。1677 年夏天，代尔夫特先后有八位见证人凑到他的透镜前看过，写下证词，10 月 5 日随信寄往伦敦。11 月，胡克两次没看见，第三次才当着学会的面把小动物显了出来。
    relic: 一块小黄铜透镜板
    relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
    points:
      p1: 伦敦不信的消息传到代尔夫特时，稳住见证人，等他们亲眼看过透镜、写下所见
      p2: 胡克两次没找到小动物之后，帮他泡足胡椒水、调好透镜，护住伦敦的第三次演示
    points_fail:
      p1: 头几位见证人一拖再拖，没有人写下证词。分支脱节，事务所召回员工。
      p2: 胡克第三次也没看见，学会的怀疑照旧。分支脱节，事务所召回员工。
    shift:
      p1:
        was: 1677 年 5 月 18 日到 8 月 30 日，代尔夫特八位见证人先后看过列文虎克的透镜，为胡椒水里的小动物写下证词，他 10 月 5 日随信寄往伦敦。
      p2:
        was: 1677 年 11 月，胡克两次没能向皇家学会显出列文虎克说的小动物，第三次用雨水泡了九到十天的胡椒，显出了一大群。
    vignettes:
      motion: 通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。
      label: 桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。
      read: 你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。
  newton_cambridge:
    name: 苹果与月亮服从同一条定律
    place: 剑桥
    figure: 艾萨克·牛顿
    story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。送去付印的誊清稿不是他的笔迹，抄写的人是汉弗莱·牛顿，这几年做他的抄写助手，与他不是亲戚。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
    relic: 一块玻璃三棱镜
    relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
    points:
      p1: 把牛顿最后一批勘误按卷和页打包，从剑桥及时发给伦敦的哈雷
      p2: 首版送达后，和牛顿约定如何收录读者的更正，让他能在剑桥按命题和页码核验答复
    points_fail:
      p1: 同一处改字邮寄了两个版本，哈雷收不齐末批勘误，事务所因同步失败召回员工。
      p2: 读者信各用各的页码，较早的改动散落在信和自己的样书里。
    shift:
      p1:
        was: 1687 年 7 月 5 日，哈雷来信说《原理》已经印完，末批勘误及时赶上。
      p2:
        was: 牛顿在自己的首版留下注记。后来修订再版仍是长期工作。
        now: 学院里有一份按命题编号的更正簿。借书的人可以填下所见的错误，得到牛顿同意的修改会连日期另记。
        who: newton_cambridge
        bio: 《原理》在剑桥写成，在伦敦付印。哈雷经办印刷，书出以后牛顿仍修改它。
    vignettes:
      apple: 你问学院的一位杂役：「听说苹果砸了他的头？」这位杂役是游戏里编出来的。他接着扫地：「砸没砸我不知道。你倒说说，月亮怎么不掉下来？」你一时答不上，回头去看那一页。苹果这件事，要再过六十五年才有人写下来。
      hand: 誊清的稿子不是书上署名那个人的笔迹。杂役说，抄写的是汉弗莱先生，也姓牛顿，不是亲戚。你把这一条记在本子上，没有去打扰他。
      diagram: 你在一张废纸上画出月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。杂役不认得拉丁文，盯着那支箭头看了好一阵。
  bach_leipzig:
    name: 眼医进城的那个春天
    place: 莱比锡
    figure: 约翰·塞巴斯蒂安·巴赫
    story: 到 1750 年春，巴赫的眼睛已坏到难以读写。3 月底，英国游方眼医约翰·泰勒来到莱比锡，接连两次给他做白内障手术。手术之后他双目失明，7 月 28 日在莱比锡去世。
    relic: 一根小风琴管
    relic_desc: 一根调好音、试过音的小管子，没有卖掉。
    points:
      p1: 泰勒进城动刀之前，劝巴赫别让他动刀，把他的白内障好好治好
    points_fail:
      p1: 泰勒照史实在三月底、四月初给他动了两次刀，他双目失明，七月病逝。
    shift:
      p1:
        was: 1750 年 3 月底至 4 月初，英国眼医约翰·泰勒在莱比锡两次为巴赫做白内障手术，术后他双目失明，同年 7 月 28 日去世。
        now: 他没让泰勒动刀，白内障治好了，又看得清谱纸上的音符。
        who: bach_leipzig
        bio: 这条时间线里，巴赫在 1750 年春避开了那两次手术，白内障治好，在莱比锡重新看得清东西。
    vignettes:
      entry: 你听出低声部比歌者预想的早到一口气。你请他换到屋子另一边听。这次，提示还没来，他就抬起了头。
      rest: 歌者一唱到休止就数乱。你抄下等待时能听到的另一行，他在自己开口前的那个字上做了记号。
      light: 两人合看一页谱。你把纸转向有光的地方，扶住不动，直到两人都看见自己的声部从哪儿分开。
  smith_kirkcaldy:
    name: 托付在身后的书
    place: 苏格兰柯卡尔迪
    figure: 亚当·斯密
    story: 1776 年 3 月，亚当·斯密的《国富论》在伦敦出版。8 月 25 日，他的朋友大卫·休谟在爱丁堡去世。休谟起先托斯密把《自然宗教对话录》印出来，斯密有顾虑，休谟改托印书商威廉·斯特拉恩，要他在身后两年内出版。这年 11 月，斯密在柯卡尔迪给斯特拉恩写信，记下休谟最后几个月的样子。斯特拉恩最终作罢，《对话录》到 1779 年才由休谟的侄子印出。
    relic: 一枚别针
    relic_desc: 他用来说明分工威力的那种别针。
    points:
      p1: 休谟托付的《自然宗教对话录》搁着没人肯印时，劝斯密和斯特拉恩照休谟的遗愿把它印出来
    points_fail:
      p1: 书照史实又搁了三年，1779 年才由休谟的侄子不署名印出，这条分支里休谟要它在身后两年内出版的遗愿也没有照办。
    shift:
      p1:
        was: 1776 年 8 月 7 日，休谟在遗嘱附件里请斯特拉恩在他身后两年内出版《自然宗教对话录》；斯密不肯经手，斯特拉恩最终也作罢，书在 1779 年由休谟的侄子不署名出版。
        now: 斯特拉恩在休谟要求的两年之内把《对话录》印了出来。
        who: david_hume
        bio: 他压了二十多年的《对话录》，在他去世后两年之内由斯特拉恩印了出来，照的是他最后那份遗嘱附件。
    vignettes:
      nails: '{staff}在面包铺排队，前面一个打钉的工人掏出一把铁钉付账，铺主数了数就收下了。过了几个礼拜，{staff}在一本今年春天出的厚书里读到，苏格兰有个村子的工人至今拿钉子去面包铺当钱用，对着那一页笑出了声。'
      post: '{staff}帮驿车夫捆寄往伦敦的邮包。有一封写着印书商斯特拉恩先生收，比别的都厚，{staff}把它塞到最底下，免得淋了雨。'
      firth: '{staff}趁退潮在沙滩上走。福斯湾对岸，爱丁堡的炊烟压得很低，旁边拾贻贝的妇人说，那边住的都是读书的聪明人。'
  kant_konigsberg:
    name: 留在页边的问题
    place: 柯尼斯堡
    figure: 伊曼努尔·康德
    story: 康德的《纯粹理性批判》初版在1781年问世。序言从这样的问题说起：理性无法回避它们，也无法回答它们。1787年新版另有修改过的序言。
    relic: 一张书架题签
    relic_desc: 书签，页边写着初版年份。
    points:
      p1: 在柯尼斯堡给康德备齐随信寄出的新书去向，护住他让赫尔茨接到《纯粹理性批判》消息的这次通邮
      p2: 给短篇导读留首版的互见页码，并请康德在小范围内先给赫尔茨等人读一遍
    points_fail:
      p1: 地址夹错了，装着转交说明的信折回，赫尔茨赶不上书会期间收到他的消息，事务所因同步失败召回员工。
      p2: 新稿再次单独传送，收稿的人不知道哪段是给首版的具体问题作答。
    shift:
      p1:
        was: 1781 年 5 月 1 日，康德致信赫尔茨，提到即将在书会面世的《纯粹理性批判》，并请他转交另一封信。
      p2:
        was: 《未来形而上学导论》后来单独出版，写法还受到书评回应的影响。
        now: 手头有一份带页码的导读和一轮试读答复。康德能看出哪些解释仍需要补例。
        who: kant_konigsberg
        bio: 康德留在柯尼斯堡写作。1781 年的书由里加出版商经办，读者再经书信把批评和疑问带回给他。
    vignettes:
      margin: 洛特只想抄读者绕不开问题的那一节。你请她给同一句后面的限制也留地方。她把字写小些，两部分都抄进纸条。这行字让她还想把书再翻开。
      label: 奥托在签上写，这本书答透了最难的问题。你把签翻过来，请他从序言开头再读一遍。他用一个问题换掉夸口。客人从架上抽书，就知道从哪儿读起。
      editions: 你记得六年后还会有另一篇序言。洛特眼前只有这册书，问该在哪页夹签。你在纸条上写下本版年份。店要关了，她刚翻过第一页。
  mozart_prague:
    name: 开幕前的接句
    place: 布拉格
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特从布拉格写信说，《唐璜》于1787年10月29日登台。更早的一封信提到筹备中的困难。
    relic: 一页改过的排练分谱
    relic_desc: 排练用谱，划掉了一个休止。
    points:
      p1: 在小剧团有人病倒后重新排练开场，保住 10 月 29 日的《唐璜》首演
      p2: 趁首演用的分谱仍在台上，请莫扎特核准一份注明布拉格版的完整副本
    points_fail:
      p1: 狭窄的排练时间挤不出合唱和乐队重来一次，29 日的首演再度取消。行程同步失败，员工被召回。
      p2: 后来为维也纳改写的段落和布拉格旧稿混着流传，排演的人得去找不同的分谱拼。
    shift:
      p1:
        was: 1787 年 10 月 29 日，在排练准备不足及歌手患病造成延期后，《唐璜》在布拉格首演。
      p2:
        was: 1788 年《唐璜》在维也纳上演时，莫扎特为当地演出另作改动。
        now: '{staff}请莫扎特在首演后核准一份照布拉格演出保留的副本，并把后来替换的页另装。另一座城市改谱时，仍可以读到这份原来的演出版本。'
        who: mozart
        bio: 莫扎特为《唐璜》改谱时，有一份经过自己核准的布拉格演出副本可以对照。他保留了两地各自的演员用谱。
    vignettes:
      cue: 安娜的分谱多抄了一个休止。你敲出另一声部进入的位置，让她标下该听哪个词。再合一遍时她进准了。划掉的休止还留在谱上，安娜请你别把它涂没。
      swap: 扬来得及重抄一页，或去找还没回来的歌手。你替他跑一趟楼梯，他留下抄。幕一动，改过的谱和歌手都到了谱架前。台下还有人在找那张旧谱。
      applause: 你知道莫扎特会在信里提到掌声。扬问，那一个多出来的休止会不会有人听出来。你交给他改好的谱，指给他在哪儿等安娜开口。离开时幕已经升起，那句还没到。
  lavoisier_paris:
    name: 逮捕令下来之前
    place: 巴黎
    figure: 拉瓦锡
    story: 1793 年 11 月 24 日，所有前包税官被下令逮捕，拉瓦锡和岳父雅克·保尔兹都在其中，先后入狱。1794 年 5 月 8 日，两人与其他前包税官同日在巴黎被判处死刑并处死。
    relic: 一台精密天平
    relic_desc: 一台精细的天平，给化学记账。
    points:
      p1: 逮捕令下来之前，劝岳父保尔兹先离开巴黎，救下他
      p2: 逮捕令下来之前，劝拉瓦锡离开巴黎、避开风头，救下他
    points_fail:
      p1: 保尔兹照史实在 11 月下旬入狱，1794 年 5 月 8 日与女婿同日被处死。
      p2: 拉瓦锡照史实在 11 月下旬入狱，1794 年 5 月 8 日在巴黎被处死。
    shift:
      p1:
        was: 1793 年 11 月 24 日，前包税官一律被下令逮捕，雅克·保尔兹在内；1794 年 5 月 8 日，他与女婿拉瓦锡同日被处死。
        now: 他在逮捕令下来之前离开了巴黎，活了下来。
      p2:
        was: 1793 年 11 月 24 日，前包税官一律被下令逮捕，拉瓦锡随后入狱；1794 年 5 月 8 日，他在巴黎被处死。
        now: 他赶在逮捕令之前离开了巴黎，平安度过那几个月，又回到他的实验室。
        who: lavoisier_paris
        bio: 这条时间线里，拉瓦锡在 1793 年 11 月的逮捕令下来之前离开巴黎，活过了 1794 年。
    vignettes:
      units: 两个数字对得很齐，其中一行的单位却串了列。排字工固定版面之前，你把它指了出来。
      air: 你问表格为什么还要记下看不见的东西。排字工指了指「加入」和「剩余」两栏，把两个栏头都保留在校样上。
      proof: 排字工念表时，你拿纸条压住正在读的那一行。原本看起来属于下一例的数字，重新对回了自己的栏头。
  jenner_berkeley:
    name: 第一支疫苗
    place: 英国伯克利
    figure: 爱德华·詹纳
    story: 詹纳 1798 年出版的《探究》回顾了较早的牛痘与天花观察和病例。
    relic: 一把玻璃小刀
    relic_desc: 一片很薄的刀片，划下第一道小口。
    points:
      p1: 替挤奶女工萨拉·内尔姆斯包扎手上的牛痘疮，不让她一个人硬熬
      p2: 把牛痘一臂接一臂传下去，不让这项研究停在一个男孩身上
    points_fail:
      p1: 她手上的疮没人照料，自己慢慢熬过去，这条分支里没有人让她少受几天罪。
      p2: 男孩臂上的痘浆干了，没人接着往下传，这条分支里詹纳照史实等着奶场再出牛痘。
    shift:
      p1:
        was: 1796 年 5 月，挤奶女工萨拉·内尔姆斯从主人家的牛身上染上牛痘，手上长出一大块脓疱，也有这病常见的症状。
        now: '{staff}替她把手洗净包好，她早几天回到了奶场。'
      p2:
        was: 1796 年 7 月 1 日，詹纳给这个男孩种人痘，没有发病；之后他的研究中断，直到 1798 年春附近奶场又出了牛痘才接着做。
        now: '{staff}帮着把男孩臂上的痘浆接到下一个人的手臂上，那个夏天詹纳的本子里多了几个病例，不必再等奶场。'
        who: jenner_berkeley
        bio: 在这条时间线里，1796 年夏天詹纳把牛痘一臂接一臂地传了下去，没有空等两年让牛痘回到奶场。
    vignettes:
      firsthand: 虚构的誊写员把每则记载都誊成了同一种口气。你问哪一件是记述者亲眼见过的。他在其余条目旁补上说明，没把每一行都当成同一等证据。
      order: 抄件里两条观察换了位置。你核对日期，誊写员先把纸签调回来，才照先后讲述。
      blank: 誊写员有一条无法确定，你在下面留了地方。纸递出去以前，空白旁添上说明，免得后来人当成漏抄。
  beethoven_vienna:
    name: 第九交响曲
    place: 维也纳
    figure: 路德维希·凡·贝多芬
    story: 1824 年春天，几乎全聋的贝多芬在维也纳筹办一场新作音乐会。合唱和乐队分开排练，正式演出前只有两次全体排练。5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，剧院乐长米夏埃尔·乌姆劳夫指挥，贝多芬在台上站在他旁边。5 月 23 日在大雷杜滕厅的第二场，听众稀落，票房让他失望。
    relic: 一只助听喇叭
    relic_desc: 世界静下来的时候，他举到耳边的号角。
    points:
      p1: 在合唱与乐队第一次合排时把分开练过的开头对齐，护住《第九交响曲》的首演
      p2: 给听不见乐队的贝多芬留一份合排记录，让他有机会在正式演出前回应
      p3: 赶在观众出城前替贝多芬找到愿意包座的人，救回第二场的票房
    points_fail:
      p1: 各组进场时对不上，首演临场缺了一段，这条分支与史实脱节，员工被召回。
      p2: 演奏者在分谱上各记各的，合排里暴露的问题到上台也没有送给作曲者确认。
      p3: 再演时季节已过，空座多，贝多芬没能靠这一场挣回应得的收入。
    shift:
      p1:
        was: 1824 年 5 月 7 日，贝多芬的《第九交响曲》在维也纳首次演出。
      p2:
        was: 1824 年 5 月，首演筹备中，贝多芬借谈话簿接收演奏者转述的排练情况。
        now: '{staff}把几处要紧的进拍问题写在同一页，请各声部按贝多芬认可的记号重试。'
      p3:
        was: 1824 年 5 月 23 日，第二场音乐会在维也纳举行，票房不理想。
        now: '{staff}赶在潜在观众离城前落实一批预订，把实收票款记入结算。贝多芬有余地继续安排为自己筹款的演出。'
        who: beethoven_vienna
        bio: 贝多芬在维也纳安排重演时有了预订收入，演出开支不必全押给当天买票的人。
    vignettes:
      parts: '{staff}坐在抄谱人的桌边，替他们压平刚抄好的分谱等墨干。圆号的分谱还没干透就被人抢去了排练厅，{staff}一下午都在给第二份吸墨渍。'
      prater: 星期天，{staff}在普拉特的林荫长道上走。长椅上坐满了出城透气的人，卖香肠的嗓子都喊哑了，看不出有谁要去听音乐会。
      stools: '{staff}在剧院后头给合唱队搬凳子。一个女高音揉着喉咙说，末乐章那几个高音写得像要把人往天花板上拽，一排人都笑着点头。'
  faraday_london:
    name: 从磁里得到电
    place: 伦敦
    figure: 迈克尔·法拉第
    story: 1831 年 8 月 29 日，法拉第记录了铁环上线圈实验中指针的短暂偏转。
    relic: 一个铁环和线圈
    relic_desc: 软铁环上绕着两组线圈。
    points:
      p1: 两人分看接通时刻和表针，护住铁环实验里转瞬即逝的偏转
      p2: 在审稿拖慢刊印前，劝皇家学会发出一份有接收日期的实验摘要
    points_fail:
      p1: 表针摆回去才有人抬头，这一趟把实验记成无结果。行程同步失败，员工被召回。
      p2: 刊印仍然拖延，法拉第只能另去催问，读者也难判断几封先后传出的通信。
    shift:
      p1:
        was: 1831 年 8 月 29 日，法拉第在铁环装置接通和断开时观察到了短暂的感应电流。
      p2:
        was: 1831 年 11 月 24 日论文在皇家学会宣读，刊印延至翌年，法拉第在等候期间致信催促。
        now: '{staff}让学会在不动正式审稿程序的情况下附发注明宣读日期的摘要。读者可以从有日期的版本核对法拉第公布了哪些结果。'
        who: faraday_london
        bio: 法拉第的感应研究在正式论文前已有注明日期的学会摘要。他后来能用同样办法给后续试验留下公开的时间记录。
    vignettes:
      instant: 助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。
      skeptic: 你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。
      sketch: 你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。
  darwin_galapagos:
    name: 岛屿与生命的多样
    place: 加拉帕戈斯群岛
    figure: 查尔斯·达尔文
    story: 1835 年 9 月到 10 月，达尔文随小猎犬号到访加拉帕戈斯。在查尔斯岛，副总督劳森告诉他各岛的龟彼此不同；达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起。10 月 8 日到 17 日，他和拜诺几人带着帐篷留在詹姆斯岛，船去别处取水，营地旁只有一眼可怜的小泉。他的鸟类笔记把嘲鸫标本和各自采集的岛对应起来。
    relic: 一根雀的羽毛
    relic_desc: 来自群岛的一根小小的褐色羽毛。
    points:
      p1: 詹姆斯岛营地旁只有一眼小泉，护住岸上这一小队撑到船回来，把岛上的采集做完
      p2: 劳森说各岛的龟一看就分得出时，让达尔文当场留了心，把各岛的鸟分岛记下、分开装好
    points_fail:
      p1: 岸上小队断了水，詹姆斯岛的采集没能做成，这条分支与历史脱了节，事务所当天召回员工。
      p2: 他照史实没把劳森的话放在心上，查塔姆岛和查尔斯岛的采集已经混在一起，雀的标本大多没记岛名。
    shift:
      p1:
        was: 1835 年 10 月 8 日至 17 日，达尔文、拜诺和随从带着帐篷和口粮留在詹姆斯岛，小猎犬号去别处取水；营地旁只有一眼小泉。
      p2:
        was: 1835 年 9 月下旬，查尔斯岛的副总督劳森告诉达尔文，各岛的龟一看就分得出来。达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起，雀的标本也大多混了。
        now: 他当天就记住了劳森的话，各岛的鸟分岛记下、分开装好，带回了英国。
        who: darwin_galapagos
        bio: 这条时间线里，达尔文在加拉帕戈斯听进了劳森那句话，把各岛的雀和嘲鸫分岛采集、分岛标注，带回英国。
    vignettes:
      two_tags: 一张签只写了「岛上」。你把它搁到一边，等帮手找来另记的上岸记录。盘子即便收好，两件标本也还能分清。
      differences: 帮手指着两只相似的鸟，准备合写一条。你问它们各来自哪座岛。他把两个标签都留在册上，下次好重新比较。
      drawer: 帮手能把地名念回给你以前，你一直把签放在盘旁。抽屉关上时，纸签仍在对应的标本旁。
  lovelace_london:
    name: 第一段程序
    place: 伦敦
    figure: 阿达·洛芙莱斯
    story: 1842 年，意大利工程师路易吉·梅纳布雷亚用法文发表了一篇介绍查尔斯·巴贝奇分析机的文章。阿达·洛芙莱斯把它译成英文，又加了七条注释，篇幅约有原文的三倍；最后的注 G 写出了这台机器怎样算伯努利数。1843 年 8 月，巴贝奇想在文中附上他对政府的不满，编辑不肯不署名刊出，他便要她撤稿。她拒绝了，署名 A.A.L. 的译文与注释当年刊在《泰勒科学回忆录》上。8 月 14 日，她提出由自己张罗造机器的事务，请巴贝奇专管工程，巴贝奇拒绝了她的条件。
    relic: 一张穿孔卡
    relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
    points:
      p1: 把洛芙莱斯亲自同意付印的译稿和注释一起交给伦敦印坊，护住她在撤稿争议中作出的决定
      p2: 赶在最后一次交校样前，让她和排字工把注 G 的表横着读一遍，逐列标出容易错行的格子
      p3: 把她提议的分工抄成一份可交给潜在出资人的短约，由她组织联络，由巴贝奇负责工程，再请两人议定第一次会面
    points_fail:
      p1: 印坊收到继续付印与暂缓付印两种指示，最后把译稿与注释一并从本期撤下。事务所因同步失败召回员工
      p2: 排字工换过几格符号，却无人从头对读。她只能在最后几小时重新查公式和对应的表格
      p3: 她写给巴贝奇的建议止于回信。再有意向出资的人打听时，双方没有一份他们都肯交出的工作安排
    shift:
      p1:
        was: 1843 年 8 月，巴贝奇要求她请编辑同意撤稿。洛芙莱斯拒绝，译稿与署有她姓名缩写的注释同年合刊。
      p2:
        was: 洛芙莱斯 8 月 15 日写给母亲，说印坊临时召她做最后一轮监督，数学公式的校对十分费力。
        now: 印坊留存一份她核过的逐列样表。排字工再改动一格，就能用同一张样表检查邻列。
      p3:
        was: 8 月 14 日，洛芙莱斯向巴贝奇提议由自己和合作者承担组织事务，让他专心工程。巴贝奇未接受这些条件。
        now: 两人同意先请一位出资人看设计图与费用草案。来客拿到一份分工清楚的说明，并约定工程评估后再决定是否承担费用。
        who: lovelace_london
        bio: 洛芙莱斯同时写译稿和技术注释。除了说明机器可以怎样工作，她还试着为一项停在纸上的工程寻找继续筹办的办法。
    vignettes:
      messenger: '{staff}在圣詹姆斯广场一座宅子的门廊下等回信，当信差的规矩是不能坐。屋里的人写了划，划了又写，天擦黑才把一封火漆还软着的信塞到{staff}手里，送多塞特街。'
      compositor: '{staff}帮排字工拣铅字。排字工抱怨这一期满版都是希腊字母、角标和架在行上的小数字，西格玛那一格都快拣空了，写这东西的人该自己来排。'
      loom: '{staff}在斯皮塔佛德一家织坊门口停下。提花机上的穿孔纸板一张接一张翻过去，丝面上慢慢起了一朵花。织工说，这些纸板比他还认得花样。'
  nightingale_scutari:
    name: 把护理做成用数据和关怀的学科
    place: 奥斯曼斯库塔里
    figure: 弗洛伦斯·南丁格尔
    story: 弗洛伦斯·南丁格尔 1858 年的军队卫生报告依据战时经验，收入医院统计。
    relic: 一盏小油灯
    relic_desc: 她夜里查房时用的那盏灯。
    points:
      p1: 在病房的伤寒和霍乱里，护住卫生委员会 3 月 6 日起对斯库塔里各医院的查看
      p2: 在巴拉克拉瓦的帐篷里拦下走火的左轮枪，救下卫生委员赫克托·加文
      p3: 治好南丁格尔 5 月在巴拉克拉瓦染上的克里米亚热，不让这场病跟她一辈子
    points_fail:
      p1: 查看在病房里拖住，堵着的下水道没能及时打开。这条分支与历史脱节，员工被送回。
      p2: 帐篷里那一枪还是响了，这条分支里委员会登岸一个月就少了一位委员。
      p3: 热病照原样走完。五月底她脱离了危险，这条分支里这场病和历史上一样留在她身上。
    shift:
      p1:
        was: 1855 年 3 月 6 日，卫生委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。
      p2:
        was: 1855 年 4 月 21 日，卫生委员赫克托·加文在克里米亚把左轮枪递给弟弟时枪走了火，中弹身亡。
        now: '{staff}在交接时接过那支枪，先退了子弹。加文接着在营地里做委员会的事，后来回到英国。'
      p3:
        was: 1855 年 5 月，南丁格尔去巴拉克拉瓦查看医院，几天内染上克里米亚热，病危约十二天，此后大半生病弱。
        now: '{staff}在发病头几天用这个世纪还没有的药治住了热病。南丁格尔一周内下了床，回到斯库塔里，那场跟她回家的病没有留下。'
        who: nightingale_scutari
        bio: 在这条分支里，南丁格尔 1855 年在巴拉克拉瓦染上的热病被治好。她关于医院和军队卫生的工作，是自己站着去做的，不是在病榻上做的。
    vignettes:
      totals: 虚构书记员把转房名单也算进新收治人数。你问哪些名字是刚入院的。他另留一栏记转房，再把报表送出去。
      name: 书记员隔着嘈杂声没听清名字。你在报名字的人身旁等他再说一遍，下一份抄件就照他给的拼法写。
      fold: 书记员念哪一处，你就按顺序放哪一页。原来夹在合计后面那张，这次先送到了他手里。
  mendel_brno:
    name: 豌豆与遗传的规律
    place: 布尔诺
    figure: 格雷戈尔·孟德尔
    story: 1856 年到 1863 年，格雷戈尔·孟德尔在布尔诺住处的园子里杂交豌豆，一代代数它们的后代。1865 年 2 月 8 日和 3 月 8 日，他在布尔诺自然科学学会分两场报告了结果，论文 1866 年刊在学会的会刊上。他生前，这篇论文几乎没人接着做下去。孟德尔 1884 年去世，1900 年，三位植物学家在研究遗传时各自找到了他的论文。
    relic: 一只豌豆荚
    relic_desc: 修道院花园里的一只干豆荚。
    points:
      p1: 帮孟德尔把八年的计数拆成两场讲得完的报告，护住布尔诺学会的两次宣读
      p2: 把容易在口头报告里混淆的两代计数分开列给听众核对
      p3: 趁听众还在，替孟德尔约定一份异地复测，让刊印前就有人回报自己的计数
    points_fail:
      p1: 首场念完时间只够交代做法，第二场没有排上。学会少了完整的两次报告，事务所因同步失败召回员工。
      p2: 听众带走的是总数，回去后分不清哪些是第一代、哪些是下一代的观测。
      p3: 报告传到外地要等学会年刊和抽印本，读者听完以后也没有约定谁来复测。
    shift:
      p1:
        was: 1865 年 2 月 8 日和 3 月 8 日，孟德尔在布尔诺自然科学学会分两次报告豌豆杂交实验。
      p2:
        was: 1865 年的两次报告以多年豌豆计数为据，1866 年刊印的论文逐项列出各代结果。
        now: '{staff}请孟德尔在报告后留下分代对照表，听众可以拿自己抄的数字回来核对。'
      p3:
        was: 1866 年布尔诺学会刊印论文，孟德尔用抽印本同外地学者通信，讨论结果能否验证。
        now: '{staff}请愿意复测的人留下地址并约好回报的内容。下一季有人把自己的数字寄回布尔诺，孟德尔可以在年刊流通前把两地结果对照。'
        who: mendel_brno
        bio: 孟德尔的报告后来随年刊刊行。跟随报告启动的异地复测让他较早收到一组可以独立核对的结果。
    vignettes:
      straw: '{staff}帮看门人在会场门口铺草垫。每双靴子上的雪都化在地上，看门人说，这些先生宁可听人讲豌豆，也懒得在门口跺跺脚。'
      market: '{staff}在白菜市场帮一个老太太分拣干豌豆，圆的一堆，皱的一堆。她说圆的好卖。{staff}还是把两堆都数了一遍，差不多三比一，自己先笑了。'
      furrow: 三月底，{staff}在城外的田埂上走。农人正把攒了一冬的粪摊开，说今年豌豆得早点下种，赶在倒春寒前头。
  mendeleev_petersburg:
    name: 元素周期表
    place: 圣彼得堡
    figure: 门捷列夫
    story: 1869 年 3 月 1 日，德米特里·门捷列夫排好一张单页的表，按原子量和化学性质的相似性给元素分组。3 月 18 日，俄国化学学会开会，门捷列夫不在，尼古拉·缅舒特金代他宣读论文。会议记录把讨论推到下一次，下一次却没再议。3 月下旬，这张表随他的化学教科书刊出，也另印散页寄给同行。那年春天的一份德文摘要，把性质的「周期性重现」译成了「逐级变化」。
    relic: 一副元素卡片
    relic_desc: 手写的卡片，可以像摆纸牌一样摆。
    points:
      p1: 门捷列夫已经离城。把他留给缅舒特金的论文和附表合在一起交到会场，赶上俄国化学学会宣读
      p2: 趁作者从外地回来，把下次会议原留待讨论的一项重新排进议程，让他逐一回应来问排表依据的人
      p3: 德文摘要付印前，请门捷列夫确认第一条结论的译法，把表示性质周期性重现的词改回去
    points_fail:
      p1: 报告人只接到附表，原稿还压在门捷列夫的行李里。学会划掉这一项，事务所因同步失败召回员工。
      p2: 上一回记录的待议事项留在旧页上。到下次会议，没有人再为元素表留一段可讨论的时间。
      p3: 德文稿已送去排字。读者看到性质逐级改变的说法，看不出作者强调性质隔一段会重现。
    shift:
      p1:
        was: 1869 年 3 月 18 日（俄历 3 月 6 日），论文由缅舒特金代为宣读。门捷列夫不在场，一说去特维尔省考察奶酪作坊，一说生病。
      p2:
        was: 会议记录因作者缺席而延后讨论，后来学会会议没有接续讨论这件事。
        now: 学会在下一次会上给门捷列夫留出回话的时间。他把几处争议栏圈出来，和提出疑问的人约定后续核查。
      p3:
        was: 1869 年的德文摘要将原文的周期性译成表示逐步变化的词。
        now: 发出的德文摘要写明性质会周期性重现。一位只读到摘要的通信者问起怎样区分重现和例外，门捷列夫用自己的表逐项回复。
        who: mendeleev_petersburg
        bio: 门捷列夫在圣彼得堡写成早期元素表，经学会会议、散印表和期刊让其他化学家见到它。俄文原稿的关键概念在跨语言传递时曾被改变。
    vignettes:
      flyers: '{staff}在印刷所帮忙，把刚印出的表一张张晾在绳上。排字工嘀咕，他排了半辈子版，没见过这么多空格和问号的，问是不是那位先生忘了填。'
      neva: 涅瓦河的冰化了。{staff}挤在河岸上看一条小船从要塞划向宫殿，旁边的人说，那条船没过河之前，谁也不许下水。
      samovar: '{staff}在客栈里学着从茶炊里接茶。掌柜说外国人总把龙头拧反，烫了靴子，一边说一边盯着{staff}的脚。'
  pasteur_paris:
    name: 阿尔布瓦的那个夏天
    place: 阿尔布瓦
    figure: 路易·巴斯德
    story: 1859 年夏，巴斯德在巴黎做研究，九岁的长女让娜住在阿尔布瓦的祖父家。九月她染上伤寒，死在那里。
    relic: 一张抵达登记副页
    relic_desc: 登记副页，分开记录抵达与后来的来信。
    points:
      p1: 伤寒烧起来的时候，守着让娜照护，治好她
    points_fail:
      p1: 高烧照史实没有退下去，让娜九月死在阿尔布瓦。
    shift:
      p1:
        was: 1859 年 9 月，巴斯德九岁的长女让娜在阿尔布瓦祖父家患伤寒去世。
        now: 烧退了，让娜病好起来，秋天回到巴黎爸爸妈妈身边。
        who: pasteur_paris
        bio: 这条时间线里，巴斯德的长女让娜在 1859 年阿尔布瓦的那场伤寒里活了下来，和弟弟妹妹一起长大。
    vignettes:
      date: 克莱尔把来信送到的日子抄进了抵达簿。你把信封摆到登记簿旁，她看出了两处不同。两天都留在桌上，各标它真正对应的事。
      address: 埃米尔愿意代送家人的回信，克莱尔留守登记簿。你递给他一张窄条，只写他要核对的地址。他出门前核过一遍，有旁人等候时，登记簿仍合着。
      future: 你知道男孩离开许久后，人们还会谈到这个病例。克莱尔要填的是今天确知的事。你记下抵达，将以后到的消息留给它自己的日期。你走时，最新一封信还没拆。
  curie_paris:
    name: 两种新元素
    place: 巴黎
    figure: 玛丽·居里
    story: 1898 年 4 月，玛丽·居里报告说，沥青铀矿放出的射线比其中的铀能解释的更强。她与皮埃尔·居里在巴黎的工业物理化学学校把矿石一份份分开，追着射线走。1898 年 7 月 18 日，他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭。玛丽·居里 1934 年死于再生障碍性贫血，一般认为与她长年受辐射有关。
    relic: 一管沥青铀矿
    relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
    points:
      p1: 在年末宣读前把还待独立验证的几份记录对齐，护住第二份新元素报告
      p2: 用两次报告为居里争取一间能稳定工作的房间，替以后反复测量保住仪器和记录
      p3: 从这时起让玛丽和皮埃尔隔着防护处理样品，护住他们的手和身体，少受射线
    points_fail:
      p1: 交稿时独立观察与研究记录对不上，年末没有这份报告。事务所因同步失败召回员工。
      p2: 几个人还在临时场地分着用台面，遇到天气坏时又要挪仪器、等场地。
      p3: 他们照旧徒手处理样品，常年的射线落在两人身上。
    shift:
      p1:
        was: 1898 年 12 月 26 日，巴黎科学院报告新的放射性物质，独立光谱观察随同刊出。
      p2:
        was: 1898 年两次报告之后，居里夫妇的后续研究仍在学校的简陋场地进行。
        now: '{staff}把两份成果和停工的记录一并交给愿意协调场地的人。学院为接下来的测量腾出一间可长期使用的房间。'
      p3:
        was: 1934 年 7 月 4 日，玛丽·居里死于再生障碍性贫血，一般认为与她长年受辐射有关。
        now: 从 1898 年起，两人都隔着防护处理样品，多年里受到的辐射少了许多。玛丽后来的身体比历史上好，又多工作了些年。
        who: curie_paris
        bio: 玛丽·居里从 1898 年起在防护下做放射性研究，晚年没有受到那样重的辐射损伤，多工作了些年。
    vignettes:
      shed: 雨从学校院里那间棚屋的顶上漏下来。{staff}在漏处摆了几只盆，把一台摆满玻璃器皿的桌子挪开，角落里那只炉子几乎烘不暖屋子。
      borscht: '{staff}在拉丁区一家小馆子吃饭。邻桌两个波兰学生用波兰话争得面红耳赤，红菜汤凉了也没顾上喝。老板娘说，这一带的波兰人比塞纳河边的鸽子还多。'
      bookstall: '{staff}在塞纳河边的旧书摊上翻到一本讲那种能穿过皮肉的新射线的小册子。摊主说，这年头的人，看不见的东西最肯掏钱。'
  freud_vienna:
    name: 一本书的两个年份
    place: 维也纳
    figure: 西格蒙德·弗洛伊德
    story: 1899 年 11 月 4 日，西格蒙德·弗洛伊德的《梦的解析》在维也纳面世，出版商在扉页上印了 1900 年。弗洛伊德后来说，这本书是他对父亲去世的回应。首印六百册，卖了八年才卖完，第二版到 1909 年才出。
    relic: 一张注明日期的书店存根
    relic_desc: 维也纳一家书店的送货单，日期是 1899 年 11 月，单上那本书的扉页印着 1900 年。
    points:
      p1: 在书面世后无人问津的那几周，把《梦的解析》送到会认真读完它的同行手里
    points_fail:
      p1: 书出来以后少有人理会，首印六百册要八年才卖完。
    shift:
      p1:
        was: 1899 年 11 月 4 日，《梦的解析》在维也纳面世，首印六百册，扉页印 1900 年，八年才卖完。
        now: '{staff}把书送到几位同行手里，他们那个冬天就读完了全书。关于它的来信和争论早来了好几年，首印也不用等八年。'
        who: freud_vienna
        bio: 弗洛伊德那本讲梦的书在头一年就有了认真的读者。他等了多年的讨论，1899 年冬天就开始了。
    vignettes:
      window: '{staff}在内城一家书店的橱窗前站了半天。那本讲梦的新书摆在角上，翻开着扉页，印的是 1900 年。店员出来擦玻璃，说这书要到明年才算新书，眼下先占个位子。'
      cafe: '{staff}在咖啡馆从报架上取下几份报纸，把书评栏翻了个遍，哪一份都没提这本书。邻桌的医生说，三百多页讲梦的书，谁有工夫读完，说完又叫了一杯咖啡，接着看他的报。'
      snow: 十二月底下了雪。{staff}帮书店的小伙计铲门口的雪。伙计冻着手翻订货簿，说那本讲梦的书这个月几乎没动，又问梦是不是夏天才好卖。
  cajal_barcelona:
    name: 神经细胞是一个个独立的单位
    place: 巴塞罗那
    figure: 圣地亚哥·拉蒙-卡哈尔
    story: 1887 年底起，圣地亚哥·拉蒙-卡哈尔在巴塞罗那任组织学教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥几十份大多寄给国外的研究者，可他们很少读西班牙文。1889 年 10 月，他自费去柏林参加德国解剖学会的会议，把切片放在显微镜下给人看，会上资深的组织学家阿尔伯特·冯·克利克接过了他的研究。1906 年，他与卡米洛·高尔基分享诺贝尔奖。
    relic: 一支极细的绘图笔
    relic_desc: 细到能画出神经元每一条分支的笔。
    points:
      p1: 在公费未获准时帮卡哈尔把旅费与玻片分包凑齐，保住柏林会上那次亲手演示
      p2: 为难以进入外语期刊的图文找一位合译者，让同业在会前就能按图复核
    points_fail:
      p1: 自费凑不齐长途行程，卡哈尔只能把文字寄过去。柏林没有那次演示，员工因同步失败被召回。
      p2: 外地同行会后才有人设法读懂西班牙文稿，复核仍得逐封通信。
    shift:
      p1:
        was: 1889 年 9 月 26 日，卡哈尔获得出行许可，自筹旅费并在 10 月柏林会议上展示显微切片。
      p2:
        was: 1889 年，卡哈尔自述先前的西班牙文研究在国外少受注意，柏林演示后来帮助传播他的结果。
        now: '{staff}让译者同卡哈尔对照原图校过短文，先寄给愿意核对切片的同行。演示之后，卡哈尔有一条持续寄发图文的渠道。'
        who: cajal_barcelona
        bio: 卡哈尔在巴塞罗那为研究图文建立了稳定的外语协作。后来的手稿可以先在国外找到愿意拿切片复核的同行。
    vignettes:
      stain: '{staff}帮一个学生把切好的小块组织泡进重铬酸钾的罐子里。学生说这罐要原封不动泡到下礼拜，谁要是忍不住打开看，下一百张切片就归谁切。'
      ticket: '{staff}陪学生去火车站问去柏林的车票。售票员报了价，学生吹了声口哨，回来的路上一直掰着指头算，这笔钱够印几期刊物。'
      rain: 十一月，巴塞罗那下起雨。{staff}帮学生把窗台上晾着的一叠图版收进屋，学生点了两遍数，才肯把百叶窗关上。
  marconi_bologna:
    name: 一次发报，一次静默
    place: 博洛尼亚
    figure: 古列尔莫·马可尼
    story: 马可尼在1909年的诺贝尔演讲里回忆，自己于1895年初在博洛尼亚附近开始试验无线电报。
    relic: 两张试验记事纸
    relic_desc: 同一趟试验，在两端各留一张记录。
    points:
      p1: 启程前请他给留在当地的家人一份用通俗文字写成的试验索引，再另抄一份带去给英国合作者
    points_fail:
      p1: 相关纸页跟行李一起去了英国，本地的人只能按听过的说法追记。
    shift:
      p1:
        was: 马可尼后来赴英国寻求专利和接洽。抵英后还需要调整和修理设备。
        now: 家里和旅行者各带一份能查的索引，旅途中出现损失也可用留底确认。英方的记录另外接在后面。
        who: marconi_bologna
        bio: 格里福内别墅里的试验与后来在英国取得专利是前后不同的阶段，其中涉及家人和当地支持。
    vignettes:
      blank: 罗莎等的是三声，下笔已经写了三划。下一趟你请她把纸扣在桌上。重新翻开时，她把实际听见的记下来，连静默时多听到的一声也写上。这下有理由再做一遍了。
      times: 卡洛想把两张纸一起带下坡。纸头都写着第一趟，其实有一边重新做过。你请他指出哪一段在等，哪一段重新开始。他走前给两趟各写了记号，发报和接收两边终于能对上同一趟。
      range: 你知道后世读者会在意距离。罗莎却只想知道最后一响是不是约好的记号。你把她的纸拿到发报端，把这个问题留给下一趟。此时两头的人都已经进屋。
  imhotep_saqqara:
    name: 试过的那条边
    place: 埃及萨卡拉
    figure: 伊姆霍特普
    story: 萨卡拉左塞尔建筑群出土的雕像底座刻有伊姆霍特普的姓名和头衔。博物馆将阶梯金字塔的设计归于他。
    relic: 一张接边记号拓片
    relic_desc: 工台上的接边记号拓片。
    points:
      p1: 石工试接边时扶稳练习石
      p2: 留在台边，等两面都查过再走
      p3: 搬石块前找出接缝卡在哪儿
    vignettes:
      rock: 穆特见石面平整，就要去拿下一块。你请她先在台面轻轻摇一下这块。一角敲着木面，另一角没沾上。她在高点做记号，换个人、换个光线也找得着。
      turn: 霍里可以现在搬走两块练习石，也可以留着沉的那块，等穆特来查。你扶住轻的那块，陪他等。穆特在两块石头相接的面上各做记号。石头搬走时，记号也跟着带走。
      name: 你知道后世看雕像底座时会找谁的名字。霍里只想知道哪块试石该跟手里这块配。你指给他看那个能对上的记号。造像和刻字的地方，还在你这趟能走到的工坊外。
  enheduanna_ur:
    name: 穿过荆棘的山路
    place: 美索不达米亚乌尔
    figure: 恩赫杜安娜
    story: 恩赫杜安娜是阿卡德王萨尔贡的女儿，在乌尔身居高位，几首苏美尔语长诗自古归在她名下。约公元前 2250 年，乌尔起了叛乱。她名下的一首长诗以第一人称写道，她被赶了出去，像燕子一样从窗口飞走，被逼着穿过山里的荆棘，力气都耗尽了。
    relic: 一块方解石圆盘
    relic_desc: 圆盘上刻着一位女祭司在献祭。
    points:
      p1: 恩赫杜安娜被赶出乌尔时，一路照顾她翻过山去，护她平安到达落脚处
    points_fail:
      p1: 她照史实独自翻山，力气耗尽，身边没有人照顾。
    shift:
      p1:
        was: 约公元前 2250 年，乌尔起了叛乱，恩赫杜安娜被赶出城；她名下的长诗写道，她被逼着穿过山里的荆棘，力气都耗尽了。
        now: 翻山的路上有人照顾她，她平安走到了落脚的地方。
        who: enheduanna_ur
        bio: 这条时间线里，恩赫杜安娜逃出乌尔的路上有人照料，平安到了落脚处。
    vignettes:
      inscription: 你记得后世博物馆会登记正反两面。石工把刻字一面朝下搁在木台上。你趁他干活先画下浮雕，翻面后又补了一张。两幅图都能带回去，最先写那首诗的人是谁，图上答不出来。
      support: 石工请你扶稳圆盘旁的垫子。你腾不出手来，错过了刻字面刚翻起的时候。收工前，他留了点时间让你在草图上圈出漏看的那一面。上面的人名只能下趟再来核对。
      edge: 石工记了圆盘的正反面。你又在草图上添了边缘的厚薄，好认出哪两幅画的是同一件东西。收队时手里有一张图，那首诗的抄本却没带回来。
  hammurabi_babylon:
    name: 刻在石头上的法律
    place: 巴比伦
    figure: 汉谟拉比
    story: 约前 1754 年，汉谟拉比在位的晚年，一块刻着近三百条法律的玄武岩石碑立了起来，此后几百年，书吏一直把这些条文抄在泥板上传习。前十二世纪，石碑被运到苏萨，碑上有几栏文字被磨去。1901 年，法国考古队在苏萨把它挖了出来，如今藏在卢浮宫，被磨掉的条文靠泥板抄本补回了一部分。
    relic: 一枚泥印滚筒
    relic_desc: 一个小石柱，在泥上一滚就留下签名。
    points:
      p1: 帮书吏把石碑全文多抄几块泥板，送到别的城里存放，后世石上被磨掉的那几栏也能读全
    points_fail:
      p1: 全文照旧只有原来那些抄本，这条分支里石碑被搬到苏萨、磨去几栏以后，还是有几条法律再也读不到。
    shift:
      p1:
        was: 公元前十二世纪，石碑被埃兰人搬到苏萨，碑文被磨去几栏；靠泥板抄本补回了约三十条，其余至今不知道写的是什么。
        now: '{staff}帮书吏多抄了几份全文，送到别的城里存放，这条时间线里石碑上的每一条法律都还读得到。'
        who: hammurabi_babylon
        bio: IF 线里，汉谟拉比的法律一条不缺地传了下来，石上磨掉的部分也没有失去。
    vignettes:
      clay: '{staff}帮书吏学徒和泥。学徒说泥里的沙得淘干净，不然写到一半，芦管一按就裂，师傅又要他从第一行重抄。'
      river: '{staff}在幼发拉底河边帮船夫卸大麦。船夫一边数袋子一边说，过秤的要是敢少算一袋，他就站到王的石碑跟前把那一条念给他听，虽然碑上的字他一个也不认得。'
      roof: 日头最毒的时候，{staff}和学徒把新抄的泥板摆到屋顶上晒。学徒挨块数，数到一半乱了，又从头数，生怕有一块被鸟踩过。
  lalibela_rock:
    name: 沿岩沟找出口
    place: 埃塞俄比亚拉利贝拉
    figure: 拉利贝拉与石匠们
    story: 拉利贝拉的石匠向下开凿，把周围的石料清出去，墙和柱便从整片岩石中留了下来。如今遗址保存着十一座岩凿建筑，以及相通的深槽、水沟和通道。传统把这处建筑群与扎格韦王朝的拉利贝拉国王相联系；考古人员发现，岩石曾分期开凿，有些地方原来还立着更早的建筑。1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团到访，写下了他的见闻。
    relic: 石匠的凿子
    relic_desc: 一把铁凿子，刃口磨得很薄。
    points:
      p1: 先让石匠们认下，再替他们把凿下的碎石运出深槽
      p2: 雨季前，沿岩沟找到出口，指给他们看哪里会积水
      p3: 雨季里，帮着把一整条沟渠从头清到尾
    vignettes:
      outlet: '{staff}顺着一条凿在岩上的沟往下走，过了弯，找到它出岩壁的地方，用一块碎石做了记号。'
      rain: '{staff}站在没过脚踝的水里，把一筐筐淤泥递上槽沿，一筐接一筐，直到天黑。'
      bend: '{staff}在一片碎纸上画了个缺口，标出深槽的转弯处，帮工第二天早上照着就能找到同一个弯。'
  ife_bronzes:
    name: 铸好以后还能不能认出这道线
    place: 尼日利亚伊费
    figure: 伊费的铸造匠人
    story: 约鲁巴城市伊费出土的一尊黄铜头像，珠饰头冠上还留着红色和黑色的颜料。这尊头像用失蜡法铸成。1938 年 1 月，翁莫尼杰院落里开挖房屋地基，人们从土里挖出它和一批其他头像。1948 年，多件伊费铸像在大英博物馆一同展出。
    relic: 一对线样小图
    relic_desc: 对照无像练习铸样上两次所见的线。
    points:
      p1: 先让铸匠们认下，再用蜡捏一个练习模
      p2: 浇铸那天，守着坩埚底下的火不让它弱下去
      p3: 浇铸之后，分辨哪道线是蜡模上刻的，哪道是后来添的
    vignettes:
      line: '{staff}把收面之前画的小图摆到今天的样块旁边，后来多出的那一道划痕，另画在一张纸上。'
      surface: '{staff}把垫样块的木板略斜一斜，让光顺着它走，在纸上标出一道细线从哪里开始。'
      edge: '{staff}描了一遍没有图像的练习样块，旁边另记下今天才看见的那一道线，下回比对就不用全靠记性。'
  great_zimbabwe:
    name: 图上两墙之间的路
    place: 津巴布韦马斯温戈
    figure: 大津巴布韦的建造者
    story: 大津巴布韦由绍纳人的祖先建造，兴盛于十一世纪到十五世纪。大围场的弧形长墙用花岗岩逐层整齐垒起，两墙之间有一条狭道通向锥形塔。1871 年，德国人卡尔·毛赫来到这片遗址。1980 年，国家以这座城为名，定名津巴布韦；1986 年，遗址列入世界遗产。
    relic: 一张两墙间的草图
    relic_desc: 图上两段墙之间留白，标的是能走的狭道。
    points:
      p1: 先让砌墙的工匠认下，再替他们挑出大小合用的石块
      p2: 走一遍两墙之间的狭道，画成图，把路留成白
      p3: 旱季里，从河谷把水挑上山，给砌墙的人
    vignettes:
      lines: '{staff}把狭道画成两条线，中间留白，送信的人照着白处走，就不会去顺着墙走。'
      width: '{staff}沿内墙走到它停下的地方，铅笔也停在那里，没有把线顺手绕满一圈。'
      pace: '{staff}用步子量了一层石的长度，把数目刻在墙脚一块平石上。'
  timbuktu_sankore:
    name: 清真寺旁的一页纸
    place: 马里廷巴克图
    figure: 曼萨·穆萨与桑科雷的学者们
    story: 廷巴克图的建筑和藏书留下长期讲学与读书的痕迹，后世材料尤丰。出处中1733年的存世天文抄本远晚于这一场景。
    relic: 一张读书人留下的夹纸
    relic_desc: 夹纸，用来指出散页上的一行。
    points:
      p1: 看脱开的一页，题头还读不读得通
      p2: 收纸时帮站着读的人保住读到的位置
      p3: 再听她读一遍，记清那页应归哪个题头
    vignettes:
      title: 阿米娜塔在板下找到一张练习纸，第一行写了题目，却没写谁抄的。板凳收走前，你拿回读书的地方。她认出笔迹，借来的那页便回到原主手里。
      wind: 穆萨收拢散纸，准备关门。阿米娜塔还读到一行中间。搬纸前你照她指的地方夹一张废纸。她下回回来，要找的那一处还在。
      collection: 你看过一部远晚于此时的廷巴克图天文抄本的照片。穆萨指着邻居那页散纸，问该怎样记它。你照他手里这页写题名。后世那部书，还要过许多代人才会抄成。
  al_haytham_cairo:
    name: 窄缝里的一线光
    place: 开罗
    figure: 伊本·海赛姆
    story: 伊本·海赛姆在《光学书》中讨论移动物体时，观察者怎样透过小孔依次看到物体的各部分。
    relic: 一块练习用的小孔屏
    relic_desc: 工坊用来比较两个位置的小孔屏。
    points:
      p1: 把孔里看见的记号与移动板上的记号对上
      p2: 板在移动时，把小孔屏扶稳
      p3: 再等等，看遮住一处记号后怎样
    vignettes:
      slit: 玛丽亚姆看见暗边，就把整条画进了记录。你请优素福挪动练习板，让隔着小孔换见另一条。她在同一个孔边画下两个位置，分得清是板在动，还是孔在动。
      cover: 优素福想转动灯让人看得清些。你让灯留在原处，请他遮住板上一道记号。那道记号一消失，玛丽亚姆马上出声。等人开门时，她已经试过一次自己还能重做的变化。
      term: 你知道后世怎样称呼小孔实验。屋子马上要腾给别人，玛丽亚姆只来得及看一次。你请她说清自己到底看见了哪一道。屋里亮起来时，已经来不及再试。
  house_of_wisdom:
    name: 巴格达抄本上的缺行
    place: 巴格达
    figure: 花拉子米与智慧宫
    story: 侯奈因·伊本·伊斯哈格在约855至856年写成的书信里，谈到搜寻、比对盖伦手稿以供叙利亚语和阿拉伯语翻译。晚出的书信用来说明译者怎样工作，不能给这张桌子定址。
    relic: 一页标出缺行的练习抄本
    relic_desc: 来自巴格达抄写桌的一份练习抄页。
    points:
      p1: 找出两份抄本从哪儿开始不同
      p2: 交接文稿时保住缺行的位置和出处
      p3: 商定怎样标出暂时无法定下的译文
    vignettes:
      line: 萨尔玛顺着整齐的抄本读，滑过了原本两行挤成一行的位置。你照字迹较乱的纸朗读，她用整齐那份对着听。她听到自己这份少掉的内容，在脱漏处做了记号。
      versions: 门要关了，伊利亚斯得先送一份给译者。他可以只送整齐那份，也可以把难读的那份带上。你捆好两份，让人一翻就能看到分歧。译者拿到纸页，可以同时拿两份来判断。
      gloss: 你认得后世书里常用的术语。萨尔玛指给你看原文缺在哪儿，可手头没有字可补。你只给她一条页边备选说法。信包送走时，正文一字没补。
  ibn_sina_hamadan:
    name: 最后一次腹痛
    place: 波斯哈马丹
    figure: 伊本·西那
    story: 伊本·西那在哈马丹写完《医典》，这部五卷的书后来教了几百年的医生。他一生常犯腹绞痛。1037 年随他效力的君主的军队出行，他的腹绞痛重重发作，不久在哈马丹去世，那是 1037 年 6 月，年约五十七。
    relic: 一张练习索引条
    relic_desc: 读书签，区分全书五卷中的两卷。
    points:
      p1: 伊本·西那在路上腹绞痛发作时，给他医治，把他治好
    points_fail:
      p1: 他的腹痛照史实没有缓下来，6 月在哈马丹去世。
    shift:
      p1:
        was: 1037 年 6 月 22 日，随军出行途中腹绞痛重重发作的伊本·西那，不久在哈马丹去世，年约五十七。
        now: 路上那次腹绞痛及时得到医治，他好了起来。
        who: ibn_sina_hamadan
        bio: 这条时间线里，伊本·西那 1037 年那次腹绞痛被治好，他活过了那个夏天。
    vignettes:
      section: 鲁卡娅见两张单都提到药物，便指向同个题头。你请她打开索引，指出哪条是单味，哪条是复方。她给两卷各夹一签。桌边的两个人现在可以各找各的条目了。
      sleeve: 叶海亚得带走一份抄本，板一斜，索引签就会滑掉。你帮他用空封纸把几个签护好，鲁卡娅则替还留在桌边的人另抄两个题头。书带走后，桌上还有一张小索引。
      afterlife: 你见过后世的装帧，同样五卷却分成不同的册子。叶海亚问，在手里这部抄本哪儿才是第一个题头。你找到开头那行，把后世版本的日子留在纸外。接手人第一次自己试索引，你已经看不到了。
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯内沙布尔
    figure: 欧玛尔·海亚姆
    story: 1070 年代，苏丹马立克沙在伊斯法罕建起天文台，欧玛尔·海亚姆是参与修订历法的天文学家之一。以苏丹命名的贾拉利历于 1079 年 3 月 15 日启用，以春分定太阳年的开端。苏丹 1092 年去世后天文台关闭，这部历法却用了约八个世纪，它的变体今天仍在伊朗和阿富汗使用。
    relic: 一张有两种题头的历表
    relic_desc: 一张对照表，新旧两种新年并排写着。
    points:
      p1: 春分前那几天，护住观测台上定春分的日影读数，让新历照定的日子启用
      p2: 帮他把那部讲开方的书多抄一份，送到别的城里收好，让它在这条分支里留下来
    points_fail:
      p1: 春分的读数没能对齐，新历没能在 3 月 15 日启用。
      p2: 这部书照旧失传，这条分支与历史一样。
    shift:
      p1:
        was: 1079 年 3 月 15 日，苏丹马立克沙的新历照定的日子启用，一年从春分开始。
      p2:
        was: 海亚姆那部论开方的书没有传下来，只在他的《代数》里留下一句提及。
        now: 有一份抄本被送到别的城里收进了书库，几百年后还有人读得到。
        who: omar_khayyam_nishapur
        bio: 这条时间线里，他那部讲开方的书没有随着岁月散失。存在别城的那份抄本，在他身后仍有人读、有人转抄。
    vignettes:
      spring: '{staff}把旧历表和新历表并排摆好，在每个日期旁写明属于哪种纪法，下一个读表的人不用再猜。'
      carry: 一张折起来的纸，两栏标题正好分在折痕两边。{staff}把两种题头抄到外面，带着它的人不用打开也知道该比哪两栏。
      future: '{staff}知道后人会怎样写这部历法，可落下的日子还是用抄历书的人用惯的纪法，不写他们从没见过的那一种。'
  al_jazari_diyarbakir:
    name: 一本奇巧机械之书
    place: 迪亚巴克尔
    figure: 加扎里
    story: 加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。
    relic: 一个黄铜凸轮
    relic_desc: 一个有形状的轮子，把转动变成往复。
    points:
      p1: 在阿米德交稿时，按目录把装置说明和对应图页逐册核齐，护住书稿完成
      p2: 和作者一起选一册留作传抄底本，列出旁注、图题与后来抄写人不得合并的空白栏
    points_fail:
      p1: 几幅图无从对回章节，书稿无法成套交付，事务所因同步失败召回员工。
      p2: 下一位抄手只能从已混入不同注记的工作本起抄，读者分不开作者所见与后来补记。
    shift:
      p1:
        was: 托普卡帕所藏早期抄本的题记给出 1206 年 1 月 16 日的完成日期。贾扎里的书与阿米德的阿尔图格宫廷相连。
      p2:
        was: 研究所见的后代抄本并非全从同一传抄支系而来，有的图与文本都出现差异。
        now: 库房留下一册有作者核验记号的样本。后来抄写人能在抄本前另记自己的修订，也能拿图题对照底本。
        who: al_jazari_diyarbakir
        bio: 贾扎里在阿米德写下对机械装置的说明，图与文字在后来多次传抄和跨地流通中一同变化。
    vignettes:
      sequence: 学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。
      viewer: 来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。
      paper: 学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。
  ibn_battuta_tangier:
    name: 长途还只有第一站
    place: 摩洛哥丹吉尔
    figure: 伊本·白图泰
    story: 1325 年六月，伊本·白图泰离开故乡丹吉尔。他在《游记》里回忆，父母都还在家，而他出门时没有旅伴，也没有商队可以跟随。他回到摩洛哥后，把前后近三十年的行旅见闻口述给伊本·朱扎伊。
    relic: 一只走旧的凉鞋
    relic_desc: 一只补过很多次底的皮凉鞋。
    points:
      p1: 从贝贾亚往突尼斯那一路，护住他带着高烧撑在鞍上，走到突尼斯
      p2: 在米利亚纳救下那位病倒在暑热里的突尼斯使节
      p3: 进突尼斯那天，让他知道他在异乡不是一个人
    points_fail:
      p1: 烧到一半他从鞍上栽了下来，这条分支里他没有走到突尼斯。
      p2: 那位使节照史实死在米利亚纳外的溪边，这条分支里往突尼斯去的只剩一位使节。
      p3: 他照史实在城门口哭出声来，这条分支里那天陪他进城的只有那位同行的朝圣者。
    shift:
      p1:
        was: 1325 年夏天，伊本·白图泰发着高烧从贝贾亚上路，一路撑到了突尼斯。
      p2:
        was: 1325 年夏天，突尼斯苏丹的两位使节在米利亚纳都因暑热病倒，其中一位在城外的溪边停了三夜后去世。
        now: '{staff}在溪边守着他降了温、喝下了水，离开米利亚纳时两位使节都在队伍里。他后来回到了突尼斯，此后的事没有记载。'
      p3:
        was: 1325 年，进突尼斯那天没有人上前问候他，他忍不住哭了出来。
        now: 进城那天他身边多了一个一路认识的人，在突尼斯住下的两个月里他不再是一个人。
    vignettes:
      distance: '{staff}把最远的目的地写在一张纸条上，今晚落脚的地方另写一张，挑夫今天用得上第二张。'
      departure: '{staff}留着行李单上的题头，底下空出一行，给旅人真正落脚的地方。'
      roll: '{staff}把目的和第一程各写一条，卷在一起，到了城边，把挑夫当天用得上的那张递过去，自己留下另一张。'
  ulugh_beg_samarkand:
    name: 出撒马尔罕的那条路
    place: 撒马尔罕
    figure: 兀鲁伯
    story: 二十年间，兀鲁伯把撒马尔罕经营成天文学家的城，天文台里巨大的子午弧用来测星的高度，那里编成的天文表收有 1018 颗星。1449 年秋，政局生变，他被迫交出权位，被遣离撒马尔罕。10 月 27 日他在途中遇害，年五十五。天文台遗址在 1908 年被重新发现。
    relic: 一张星表来源签
    relic_desc: 一行记旧表星位，一行留给新的观测。
    points:
      p1: 兀鲁伯被遣出撒马尔罕之前，带他换一条路平安离开
    points_fail:
      p1: 他照史实踏上被遣去的那条路，10 月 27 日遇害。
    shift:
      p1:
        was: 1449 年 10 月 27 日，交出权位后被遣离撒马尔罕的兀鲁伯在途中遇害，年五十五。
        now: 他换了一条路离开撒马尔罕，平安活了下来。
        who: ulugh_beg_samarkand
        bio: 这条时间线里，兀鲁伯在 1449 年秋平安离开撒马尔罕，活了下来。
    vignettes:
      source: '{staff}在抄写人的纸上添了窄窄一栏“来历”，旧表取来的位置和今夜量到的位置就不会挤在同一行里。'
      arc: '{staff}顺着子午弧的沟槽拉了一根绳，和石匠们从这头走到那头，看弧线正不正。'
      hold: '{staff}守着一只火盆，坐在子午弧边，膝上搁一块木板，读数报一个记一个，直到那颗星沉到墙后。'
  buddha_sarnath:
    name: 听众带走的话
    place: 印度鹿野苑
    figure: 悉达多·乔达摩
    story: 《相应部》56.11把这次说法置于波罗奈附近的仙人住处鹿野苑，传统上认作今鹿野苑。经中讲中道和四圣谛。
    relic: 一段听众留下的素绳
    relic_desc: 路上纪念物。
    points:
      p1: 听另一人怎样回想开头
      p2: 分清一人亲耳所听与另一人转述
      p3: 再留一会儿，听完先走的人漏掉的那一段
    vignettes:
      middle: 难陀只记住两端都不可取，以为说法就停在这儿。你等索那慢慢想起，后头其实还说了一条路。难陀练着照次序讲给晚点才会来的人听。这回她讲到了那条路。
      pause: 索那一口气重述了三部分，到第四部分卡住了。你问她从哪儿开始是靠难陀转述，而非在场听见。两人轮流试着讲一遍，讲完都知道哪一段还要问对方。
      retell: 你知道这段说法的传本会传得很远。难陀得去见个人，想要一段走在路上也记得住的讲法。你听她试了一遍。后来那个人怎么听，你离开鹿野苑时还不知道。
  aryabhata_patna:
    name: 三步算出一圈的长度
    place: 印度库苏马普拉
    figure: 阿耶波多
    story: 《阿耶波多历数书》的数学篇写了一条求近似圆周的口诀，以 20,000 为直径。100 加 4，乘 8，再加 62,000，得 62,832。
    relic: 一片棕榈叶经文
    relic_desc: 一片薄叶，上面刻着诗句。
    points:
      p1: 在拘苏摩补罗核齐《阿耶波多历数书》的数学篇和写有纪年的段落，让初编能成册
      p2: 让作者和教习用一题检查近似何时足够，并把试讲用的算例与原颂合抄
    points_fail:
      p1: 抄完的一组只见口诀，没有写年代的篇页，事务所因同步失败召回员工。
      p2: 短颂传下来了，课堂上用来检查近似的例子却不见了。
    shift:
      p1:
        was: 《阿耶波多历数书》提及拘苏摩补罗，纪年部分通常折为 499 年。
      p2:
        was: 简练的颂文后来成为不同注释传统的对象。
        now: 一套供学习者传看的本子带有作者核过的例子。后来作注的人还能识别哪些词出自原颂。
        who: aryabhata_patna
        bio: 阿耶波多用简短颂文组织历算知识。年代、术语和具体例子如何一同传递，影响后来怎样解释这部书。
    vignettes:
      scale: 制绳人在板上写了两个直径，配的却是同一个圆周。你把 20,000 和 62,832 配在一行，再指给他看直径加倍时该把哪个数也翻倍。他改了一行，你把两组数字记下来。你走时，绳子还在量。
      measure: 你知道这条口诀会比作坊里的人流传得久。制绳人问做活时该怎么记，你把三步各写一行。他重算一遍，没再问最后该加哪一个数。真正的绳子得留到另一天。
      copy: 板擦掉之前，你把直径和近似圆周都抄了下来。制绳人这才看出为什么得留两个数。你带走写在同一张条上的数，没等到绳子绕上圆周。
  brahmagupta_bhillamala:
    name: 账上的另一栏
    place: 印度比拉马拉
    figure: 婆罗摩笈多
    story: 婆罗摩笈多的《婆罗摩历算全书》列出负债、财产与零的运算规则。从财产中减去一笔债，会使账上的数增加。书中关于除以零的规定与现代算术有别。账页和管账人都属于分支演绎。
    relic: 一片画着小圆圈的棕榈叶
    relic_desc: 一片叶子，上面有个代表“没有”的小圆圈。
    points:
      p1: 在毗罗摩罗把历算稿中的账例和数的规则抄在同一组页上，护住 628 年的编成能保有这一篇
      p2: 请作者与第二名算手合写一份分栏试例，给只读到残抄章的人留回查原段的办法
    points_fail:
      p1: 整理的人把账例当成无关旧账取走，成稿漏了这一组规则，事务所召回员工。
      p2: 抄手只传答数和一句规则，后来的读者无从核对用于哪种情形。
    shift:
      p1:
        was: 婆罗摩笈多的 628 年著作包含对债、财、零的运算。较晚注家称他是毗罗摩罗的老师。
      p2:
        was: 各本传抄后来留下差异；科尔布鲁克所据第十八章不完全同于校注所述的其他稿。
        now: 两份张贴给读者的算例都带出自哪段。后来的抄写人能找回完整规则，也保留确实有差异的写法。
        who: brahmagupta_bhillamala
        bio: 婆罗摩笈多用实际可辨的词表示数量，解释运算如何改变所得。他书中的一些规则与现代写法不同。
    vignettes:
      debt: 管账人从五里面减了三，可他划掉的原是一笔欠款。你把原账项抄在算例上头，算出的余额是八。还没来得及问他老师怎么处理除以零，他就合上了账板。
      limit: 你知道现在的课堂对除以零有不同处理。你在管账人的例题旁画记号，标出哪些属于加减。今天要用的那道题仍留在板上。你把这份清单记走，下一堂没赶上。
      token: 你放下五枚筹子表有的钱，另放一枚标那笔债。管账人看清笔下划掉的是哪一栏。你带回两栏各管什么的笔记。临走时，下一本账已翻开。
  li_bai_changan:
    name: 关于酒、月和远方的诗
    place: 中国长安
    figure: 李白
    story: 《清平调》三首传为李白所作。附录讲了宫中演唱的故事，属于后来的记述。
    relic: 一只小酒杯
    relic_desc: 杯底画着一弯淡淡的月。
    points:
      p1: 听出两句之间转折在哪里
      p2: 问清一个演唱故事是怎样传下来的
      p3: 把诗抄得清楚，留给下一个歌者
    vignettes:
      verse: 唱到不贴曲的一行，歌者停住。你请他先念，再唱一次。第二遍换气，恰好落在诗意转过去的地方。
      palace: 歌者听你问那晚宫里有哪些人，便放下抄诗，问你读的是哪段记载。你在旁写下，诗和讲那一夜的故事各有来处。
      copy: 歌者标出每次唱到都会停一下的地方，你一直替他翻开那页。带走诗句时，你还记得要在哪一处听那一停。
  murasaki_kyoto:
    name: 世界上第一部伟大的长篇小说
    place: 京都
    figure: 紫式部
    story: 1008 年秋，中宫彰子生下皇子，侍奉她的紫式部在日记里记下了此后的几个星期。皇子诞生第五十日的宴席上，有位公卿借《源氏物语》里的"若紫"向女官们搭话，这是这部物语见于记载的最早日子。十一月里，女官们挑纸、誊写、装订《源氏物语》，好让彰子带回宫中；道长又从紫式部房里取走了她留着的稿本。她亲笔的定本没有传下来。
    relic: 一只漆制笔盒
    relic_desc: 一只小盒子，里面有笔、砚和水。
    points:
      p1: 按章分配抄纸，逐册验收给彰子的《源氏物语》抄本，护住这次成册
      p2: 给想先读的人准备一份她愿意借出的抄本，并把未定稿留在本人处，让新抄人只按签认本领书
    points_fail:
      p1: 抄完的章和待核章混装，成套的书一直缺一册，事务所因同步失败召回员工。
      p2: 借去的仍是那份未定稿。后来的抄手不知道作者曾想再改。
    shift:
      p1:
        was: 紫式部的日记记有彰子身边的人分纸抄写《源氏物语》，道长为此提供纸笔。
      p2:
        was: 后世留存的是经长期传抄下来的不同抄本，紫式部手定稿没有传到今天。
        now: 早期几名读者看到的是她核过的一套。以后各处传抄仍会有变化，但这份借本记下了曾由她核过的章节。
        who: murasaki_kyoto
        bio: 紫式部在平安宫廷写作。别人如何领纸、分抄和借阅，决定了一部未完全改定的作品怎样进入宫外读者手中。
    vignettes:
      banquet: 五十日宴的前一天，{staff}帮着沿回廊搬膳台。一个女官压低声音说，明晚男宾喝多了，最爱拿物语里的名字逗女官，听见了也只当没听见。
      paper: '{staff}帮一个女官把各色的纸按章分好，每摞压上镇纸。她说抄好的每一页都得先送去核，字写歪了就整页重抄，纸还得重新去领。'
      snow: 腊月里下了雪。{staff}正在廊下扫雪，屋里念物语的声音念到一半停了，有人问，下一册谁拿走了。
  angkor_wat:
    name: 分两张记下的进场路线
    place: 柬埔寨吴哥
    figure: 高棉的建造者们
    story: 柬埔寨吴哥遗址管理机构 APSARA 记载，吴哥窟为十二世纪建筑，有砂岩堤道和带浮雕的回廊。
    relic: 一张进场路线图
    relic_desc: 标出砂岩堤道与回廊起点的草图。
    points:
      p1: 走过堤道，标明自己站在护城河哪一侧
      p2: 帮工指转弯处时，把图朝同一方向举稳
      p3: 分别标出过河段与回廊，留给下一班
    vignettes:
      route: 工场帮工把堤道和回廊接成同一条边。你把纸转向来路，圈出两条线从哪儿对不上。他现在能用一根手指点出该在哪里交接。你把订正图记下，下一班还没来试走。
      load: 你知道后来的访客会反复写到浮雕，今天这条送图的路却未必有人记得。帮工问拿图的人在哪儿停才不挡路。你走回转弯处，在图上补一点。还没等另一个人照着走，你就收队了。
      edge: 你在一张纸上抄下河沿，另一张抄回廊头一段。帮工把两纸在转弯处对齐。你带走这一小段轮廓，在这里怎么转头也看不见整条回廊。
  sejong_hangul:
    name: 人人都学得会的字母
    place: 首尔
    figure: 世宗大王与学者们
    story: 1443 年，朝鲜世宗亲制二十八个字母，用来书写朝鲜语。1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。世宗于 1450 年去世。
    relic: 一块刻着字母的木板
    relic_desc: 刻着最早几个字母的木板，等着上墨。
    points:
      p1: 上疏那几天，护住议事厅里用新字译《韵会》的草稿，让这件事照常往下做
      p2: 让他亲眼看到一个从没念过书的百姓用新字写出自己的名字
      p3: 在初水，减轻他的眼疾，让他还看得清新字
    points_fail:
      p1: 译稿在那几天散了、停了，新字少了第一件用场。
      p2: 这条分支里，他到颁布之前都没见过一个百姓用上新字。
      p3: 他照旧带着眼疾回宫，这条分支与历史一样。
    shift:
      p1:
        was: 1444 年二月，集贤殿用新字翻译《韵会》的工作照常进行。
      p2:
        was: 1446 年，新字以《训民正音》之名颁布，四年后世宗去世。
        now: 初水的行宫外有个摊主会写自己的名字了，有人把这事报了上去。
      p3:
        was: 世宗多年患眼疾，1444 年春去初水养病，此后身体每况愈下，1450 年去世。
        now: 初水边一个外乡人帮他把眼睛治得轻了些，那年夏天他回宫时还能自己看奏章和新字的校样。
    vignettes:
      gesture: '{staff}看见一位学士画一个字母之前先比了比嘴形，便把嘴的样子描在那个字母旁边的页边上。'
      spacing: '{staff}把一张纸打成方格，让一个音节的几部分落在同一格里，什么也没说，放在了桌上。'
      lesson: '{staff}在集市上用树枝在土里写了三个字母给一个孩子看，孩子把它们念成一个音，转身跑开了。'
  li_shizhen_qizhou:
    name: 哪个名字归在哪一条
    place: 中国蕲州
    figure: 李时珍
    story: 李时珍于1578年完成《本草纲目》初稿，带编排体例和插图的早期印本问世在后。
    relic: 一张抄留的样本签
    relic_desc: 工作标签，给另一种叫法留有位置。
    points:
      p1: 清桌前把两张签都找回来
      p2: 核对两个名字是不是在同一地听来的
      p3: 把异名和它的来处一并留在条目旁
    vignettes:
      names: 阿林把集市上听来的名字写在样本包纸的名字旁。你问是哪一摊这样叫。她记得摊子，说不上是哪一乡的叫法。条目留住两个名字，只注明她还指得出的来处。
      wrap: 屋子要关，阿禾只来得及送一包样本。你把签一并放入包内，交给他前另抄在纸头上。桌子清出来后，阿林还查得到哪一个名字随样本送去了。
      print: 你记得后世印本里这条的图。阿林问，照那幅图能不能断定自己包纸上的名字。你把名字和她说得清的来处一起留在纸上。后来那块刻图的木版，这一趟等不到。
  basho_hiraizumi:
    name: 奥州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 1689 年春，松尾芭蕉带着弟子曾良从江户出发，徒步走北方。农历五月十三日，两人从一关去平泉，当天往返：登上北上川边的高馆，由别当带着看了中尊寺的光堂，经堂因为别当不在没有开。芭蕉后来把这一路写成《奥之细道》，平泉一节有咏夏草的俳句，书里写两座堂都开了。
    relic: 一顶草笠
    relic_desc: 被雨淋灰了的编织草帽。
    points:
      p1: 把曾良记下的回程站点和折返点核给两人，护住芭蕉与曾良当天往返平泉的行程
      p2: 得知看守不在时，去确认当天有谁能带访客走外廊。先问当地人哪些地方可以看，再把路线交给两位访客
    points_fail:
      p1: 一条路指错了来处，两人到看旧迹的路口时已经赶不及往返。事务所因同步失败召回员工。
      p2: 没人知道看守何时回来，两人只能从外侧经过，入口仍关着。
    shift:
      p1:
        was: 曾良的行程日记记元禄二年农历五月十三日，两人从一关去平泉，当日折回。
      p2:
        was: 元禄二年五月十三日，曾良记别当带路看了光堂，经堂因别当不在没有开；芭蕉后来在纪行里写两座堂都开了。
        now: 附近的人确认经堂外廊可走，带两人从允许的地方看了经堂。芭蕉回到住处时，多了一处自己亲眼看过的建筑细节。
        who: basho_hiraizumi
        bio: 芭蕉与曾良的平泉行程只有当天的一段时间。后来入书的写法与曾良当日的路线记录各有侧重。
    vignettes:
      grass: '{staff}跟着两个旅人登上高馆。北上川在底下流，草长得齐腰高。年长的那位把斗笠铺在地上坐下，半天没出声，年轻的那位在本子上记着什么，{staff}不好开口，就陪着看河。'
      bath: '{staff}帮一关住处的主人挑水烧洗澡水。主人说那两位客人今天去了平泉，回来准是一身汗；看旧迹看哭了回来的客人他见得多了，洗个澡就好。'
      sandal: '{staff}在一关的街口帮人系草鞋带子。路过的脚夫说，往北的路这几天全是泥，接着赶路的人最好先换一双新草鞋。'
  hokusai_edo:
    name: 神奈川冲浪里
    place: 日本江户
    figure: 葛饰北斋
    story: 葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。
    relic: 一块印刷用的木版
    relic_desc: 一块雕好的樱木版。
    points:
      p1: 从江户版元送来的样张里挑出浪尖与远山都清楚的一张，给刻工和摺师留作首批出样的准绳。
      p2: 在版元打散样张前，请北斋与摺师共同留存一套对照印。让版元约定重开印时把新样也夹进去，并写下顺序。
    points_fail:
      p1: 刻工与摺师手里没有同一张好样，反复送来的样张在浪峰同一处断线。版元扣住第一批货，事务所因同步失败召回员工。
      p2: 版元在柜上只留下好卖的印成品。北斋与摺师核过的样张又回到货堆，换了谁接手也找不回那一套。
    shift:
      p1:
        was: 江户版元永寿堂赶在1831年新年时为《富岳三十六景》登广告，《神奈川冲浪里》是该系列的版画之一，早期印张上浪线仍完整的例子保存至今。
      p2:
        was: 当时这组印张没有日期和批次编号。原版木没有留存，后世主要靠印张上的痕迹判断先后。
        now: 永寿堂柜后留下一封有次序的样张。换了摺师，开印时仍能查出哪处断线是后来才有的，再让北斋核定是否接受这批效果。
        who: hokusai_edo
        bio: 北斋负责画稿。一张版画的面貌还取决于刻工如何落刀、摺师如何转印和版元何时续印；这些人共同影响后来的印张。
    vignettes:
      mountain: 版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。
      edge: 版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。
      counter: 一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。
  bose_calcutta:
    name: 把书转回原来的方向
    place: 加尔各答
    figure: 贾格迪什·钱德拉·博斯
    story: 博斯在 1897 年 1 月 28 日宣读的论文中记载，把一本装订好的书置于电波束中，转过四分之一圈，电波便更容易通过。
    relic: 一个植物生长记录仪的部件
    relic_desc: 一根把植物的生长放大一万倍的杠杆。
    points:
      p1: 转动书本前先读一次检波结果
      p2: 请工场帮工转回第一个方向复验
      p3: 在装置草图上标出起始方向
    vignettes:
      return: 帮工转过那本书，读数变弱了。你请他先别收，把书转回原位。这次读数也跟着回来了。表里写下了两次变化，第二种材料还来不及试。
      mark: 帮工说原来朝哪边他自己记得。你在图上做一个记号，又在夹架上找到与它相合的位置标出来。他回到起始方向便不用靠猜。下一轮对照轮到他自己做。
      reading: 碰装置之前，你先画下书页朝哪边，再把读数写在旁边。转过书，在新的一行记第二个读数。两行都能带回去。仅凭这两下，还分不清有没有漂移。
  tagore_santiniketan:
    name: 一首诗，读两遍
    place: 印度圣蒂尼克坦
    figure: 罗宾德拉纳特·泰戈尔
    story: 1912 年 11 月，英文版《吉檀迦利》在伦敦出版，收的是罗宾德拉纳特·泰戈尔自己从孟加拉语译写的散文诗。1913 年 11 月 13 日，瑞典学院把诺贝尔文学奖授予他。十天后，一列火车从加尔各答载来祝贺的人，到了他在圣蒂尼克坦的学校。他在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，许多来客带着不快回去了。奖金给了学校，1921 年，学校成了国际大学。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的亲笔。
    points:
      p1: 祝贺会散场后，劝回被他的答辞刺伤的来客，让他和这些多半是朋友的人把话说开
    points_fail:
      p1: 来客照史实带着怨气散去，此后他与许多同胞之间照旧隔着一层，这条分支与历史一样。
    shift:
      p1:
        was: 1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人，泰戈尔在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，来客多半不快，此后他与许多同胞之间生了很深的隔阂。
        now: 那天傍晚，散去的来客里有几位又被请回屋里，和他坐下来把话说开。这场不快没有从那天传开去。
        who: tagore_santiniketan
        bio: 这条时间线里，1913 年那场祝贺会散场后，泰戈尔当晚就和来客把话说开，没有因那篇答辞与同胞生出隔阂。
    vignettes:
      telegram: 消息传来那天，{staff}帮孩子们往芒果树下搬长凳。一个孩子爬上树喊，全加尔各答都要坐火车来了，被老师揪了下来，还不服气，说那总得有人先把凳子数够。
      platform: 天擦黑，{staff}在博尔布尔车站帮一位来客找回落下的伞。他在月台上攥着伞站了半天，火车进站时才问，诗人对客人说话一向是这样的吗。
      rice: 十二月，{staff}帮学校的厨子在院里摊晒米。厨子说，来看诗人的人一拨接一拨，今年的米下得比哪年都快。
  ramanujan_madras:
    name: 一封请人核算的信
    place: 马德拉斯
    figure: 斯里尼瓦瑟·拉马努金
    story: 1912 年 3 月起，斯里尼瓦瑟·拉马努金在马德拉斯港务局会计部当职员。1913 年 1 月 16 日，星期四，他从那里给剑桥的 G. H. 哈代写信，介绍自己的研究和对发散级数的探索。1914 年他去了英国，1920 年病重回到印度后去世。
    relic: 一块石板
    relic_desc: 一块学生用的石板，写了擦、擦了写好多次。
    points:
      p1: 饿着肚子熬夜演算的那几个星期，护住他的身体，让 2 月 27 日给哈代的回信写成寄出
      p2: 奖学金下来之前，帮他一家撑过每月三十卢比的日子
      p3: 在他动身去英国之前，看出他身上反复发作的旧病，把它治好
    points_fail:
      p1: 2 月 27 日那天他倒在灯下，回信没有写成，哈代那边等不到下文。
      p2: 这条分支里，他每晚的演算之外还压着一家的饭钱，记录里少这一行。
      p3: 他照旧带着病根远行，1917 年病倒，1920 年在贡伯戈讷姆去世，这条分支与历史一样。
    shift:
      p1:
        was: 1913 年 2 月 27 日，拉马努金写成给哈代的回信寄出，信里说自己已经半饿着肚子。
      p2:
        was: 1913 年 5 月奖学金下来之前，一家靠每月三十卢比的薪水过活。
        now: 那几个月家里的米缸没有见底。
      p3:
        was: 他 1917 年在英国病重，诊断一直没有定论，1919 年回到印度，第二年 4 月去世，年仅 32 岁。
        now: 马德拉斯的一位外乡人认出了他身上的旧病，在他远行之前治好了。他后来在剑桥没有住进疗养院，回到印度以后又做了很多年数学。
    vignettes:
      sums: 一排写不完的正整数旁边只写了一个总数。{staff}算出前几个部分和，1、3、6、10，给这一栏另起了题头。
      future: '{staff}知道这封信日后会被人怎样谈起，只问头一回拆信的人能看懂什么，便把说明的那页放在了最前面。'
      address: 捆纸包前，{staff}请帮工把封套上的地址念一遍，又在自己的纸条上记下日期。
  franklin_philadelphia:
    name: 闪电就是电
    place: 费城
    figure: 本杰明·富兰克林
    story: 富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。
    relic: 一条丝带和一把钥匙
    relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
    points:
      p1: 在 10 月 19 日的《宾夕法尼亚公报》付印之前，劝富兰克林写明放风筝那次试验的日子、地点和在场的人
    points_fail:
      p1: 报道照旧没有日期、地点和见证人，写成了照做会如何的说明。后人一直争论他到底有没有放过那只风筝。
    shift:
      p1:
        was: 1752 年 10 月 19 日，《宾夕法尼亚公报》刊出富兰克林关于风筝的说明，没有日期、地点和见证人。1752 年 6 月这个日子只来自约瑟夫·普里斯特利 1767 年的书。
        now: '{staff}让富兰克林在付印前补上那天的日子、那片空地和在场的人。这次试验在当年就有了带日期的记录，后来的怀疑少了立足的地方。'
        who: franklin_philadelphia
        bio: 富兰克林 1752 年关于风筝试验的说明写明了日期、地点和见证人。这件事作为一次做过的试验进入记录，不再只是一段做法说明。
    vignettes:
      cloud: 印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。
      date: 你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。
      proof: 印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。
  morse_washington:
    name: 上帝做了何等的事
    place: 华盛顿
    figure: 塞缪尔·莫尔斯
    story: 1844 年 5 月 24 日，莫尔斯从美国国会大厦向巴尔的摩的阿尔弗雷德·韦尔发送电报。留存的纸带记录了信号；莫尔斯注明文句由安妮·埃尔斯沃思建议。
    relic: 一只电报键
    relic_desc: 一根黄铜杠杆，拇指放的地方磨亮了。
    points:
      p1: 在发报前用试信号排掉线路故障，护住国会大厦通往巴尔的摩的首场演示
      p2: 拿操作记录劝莫尔斯开一班练习，让线路在两位发明者以外也有人会用
    points_fail:
      p1: 对端没能回收信号，预告的首场正式发送落空，这条分支与史实脱节，员工当天被召回。
      p2: 到六月仍只有莫尔斯和韦尔能操作，谁不能值班，另一端就得等。
    shift:
      p1:
        was: 1844 年 5 月 24 日，莫尔斯从华盛顿国会大厦向巴尔的摩发出了正式演示电报。
      p2:
        was: 1844 年 6 月 9 日，韦尔在信中写道，当时只有莫尔斯和他自己会操作电报。
        now: '{staff}让莫尔斯用实收的试报教一小班学员，由两端的人互相核对回执。线路忙起来后，学员已经能接班。'
        who: morse_washington
        bio: 莫尔斯从第一条线路开张时就开始训练独立值班的人。后来他可以把例行收发交给学员，腾出时间继续改良电报。
    vignettes:
      gap: 报务员从一道短空隙另起了一个词。你和他把纸带倒回来读，终于找到下一个人读来也合适的分隔。
      credit: 你问打在纸带上的话是谁想的。报务员在簿上记了发报人，你另外留了一格给先提这句话的人。
      readback: 报务员把纸带递给你，没告诉你预定的文句。你先完整读一遍，末了才打开纸条核对。
  edison_menlo_park:
    name: 灯旁那块钟
    place: 新泽西门洛帕克
    figure: 托马斯·爱迪生
    story: 查尔斯·巴彻勒在 1879 年 10 月 22 日的门洛帕克实验笔记里，记下用棉线制成炭丝的早期试验，包括发出的光和电阻的变化。
    relic: 一只炭丝灯泡
    relic_desc: 玻璃泡里有一根头发丝细的圈。
    points:
      p1: 在灯丝容易坏掉的那夜接上值守，护住巴彻勒记下的长时试灯
      p2: 趁门洛帕克公开点灯还有准备时间，为工坊争取一次整晚预演和备用灯
    points_fail:
      p1: 没人及时接班，灯熄灭后才被发现，工坊没有可查的连续试灯时长。事务所因同步失败召回员工。
      p2: 观众乘车到了，工坊才第一次发现几处灯位难以维持，现场只有几件临时替换件。
    shift:
      p1:
        was: 1879 年 10 月 22 至 23 日，门洛帕克试验簿记录一盏使用碳化棉线的试验灯亮了十四个半小时。
      p2:
        was: 1879 年 12 月底，门洛帕克向公众展示灯光，来客看到了实验室和附近建筑里的约百盏灯。
        now: '{staff}帮工坊按现场载荷提前试亮一夜，把需换的灯位和备件记下来。公众到场前，爱迪生和同事已经拿到能撑过整晚的现场记录。'
        who: edison_menlo_park
        bio: 爱迪生在公开展示前安排了整场预演。团队据试点记录备件和排班，这套办法后来用于准备展示。
    vignettes:
      log: 工场帮工写了「灯仍然亮」，漏记了钟点。你请他交班前把看钟的结果添到下一行。接班的人于是分得清两次观察隔了多久。你走时灯还亮着，整盏灯到底撑了多久，笔记里没有。
      future: 你知道以后电灯会照亮整条街。工场帮工看见这盏灯一亮，就想标作已经试好。你给第二次观察留了一行，灯可以交给下一班接着看。换了下一种材料的结果，你没赶上。
      tag: 两张纸条散着。你把写棉线的那张与这只玻璃泡的读数配好，交给接班的人。你带回交接钟点。灯最后熄灭时，已是别人守着。
  wright_kitty_hawk:
    name: 在空中的十二秒
    place: 北卡罗来纳基蒂霍克
    figure: 奥维尔和威尔伯·莱特
    story: 1903 年九月，莱特兄弟带着一架装了发动机的飞机回到基蒂霍克附近的营地。12 月 14 日威尔伯的尝试没有成功。12 月 17 日上午他们飞了四次，第一次 12 秒，最后一次 59 秒。当天下午，兄弟俩走到基蒂霍克，给代顿的父亲发了电报。
    relic: 一片螺旋桨叶
    relic_desc: 一片木头叶子，像一只扭过的翅膀。
    points:
      p1: 12 月 17 日上午的冷风里，帮兄弟俩稳住飞行者号，护住第一次起飞
      p2: 第四次飞行落地后，把飞行者号按在沙地上，救下丹尼尔斯和这架飞机
    points_fail:
      p1: 起飞前一阵风把一侧机翼掀起来擦了沙，飞机没离开滑轨，这条分支里没有那 12 秒。
      p2: 风把飞行者号掀翻，丹尼尔斯被卷在机翼里滚了出去，飞机照史实坏得再也飞不了。这条分支里，这架飞机在那天下午之后没有再离开过地面。
    shift:
      p1:
        was: 1903 年 12 月 17 日上午，奥维尔飞了 12 秒，120 英尺。
      p2:
        was: 1903 年 12 月 17 日，第四次飞行后一阵风掀翻了飞行者号，约翰·丹尼尔斯被卷在机翼中间，飞机损坏严重，从此再没飞过。
        now: '{staff}和救生站的人把它按在了沙地上，丹尼尔斯没被卷进去。那年冬天，兄弟俩又让它在沙丘上飞了几回，才把它装箱运回代顿。'
    vignettes:
      numbers: 天黑之前，{staff}把四次飞行按先后抄进本子，秒数一栏，英尺一栏，加了两遍。
      sand: 夜里风大，{staff}把滑轨从沙里刨出来，在滑轨脚下把沙踩平。一位编出来的救生站帮手说，天亮风就会停。天亮了，风没停。
      cold: 发动机预热时，{staff}在棚里守着炉子。外头的水洼结了冰，谁也没提。
  tenochtitlan_lake:
    name: 从隆起的田块之间过船
    place: 墨西哥特诺奇蒂特兰
    figure: 墨西卡的建造者们
    story: 特诺奇蒂特兰在特斯科科湖中的岛上发展。称为奇南帕的垫高耕地固定在水道之间，后来索奇米尔科的景观仍可见这一形态。
    relic: 一张船道草图
    relic_desc: 一排固定的桩，另有一张画着船的散纸可以移动。
    points:
      p1: 走到田边与船道相接的地方
      p2: 画船的路线时，给图上的水道留出宽度
      p3: 分清固定田块和会随水移动的停船记号
    vignettes:
      fixed: 帮工把整块田画到早上停船的地方。你指给他看仍立在田边的桩，把船改画在散纸上。船能沿图移动，田仍留在那一处。等船再回来，你已经走了。
      channel: 你知道后来的来客会把这类田叫浮动园圃。眼下帮工却得在两块固定田地之间找水道。你沿着边走到能标出开口的地方。下一条船在图上有路可走，船上载什么，这张纸没记。
      posts: 你先标一排固定的桩，再画船贴着它们过去的位置。帮工看图能分清这两种记号。你带回这一小段两者间的距离，从这里还望不出下条水道通哪里。
  machu_picchu:
    name: 顺水再走一口石池
    place: 秘鲁马丘比丘
    figure: 印加的建造者们
    story: 马丘比丘约建于 1450 年，多半是印加统治者帕查库特克的庄园，约一个世纪后、西班牙征服前后被废弃。一条水渠从泉眼引水，沿阶梯流过十六处石池。1911 年 7 月 24 日，当地农民梅尔乔·阿特阿加领着海勒姆·宾厄姆登上遗址；1981 年这里成为秘鲁的历史保护区，1983 年列入世界遗产。
    relic: 一块切好的石头
    relic_desc: 一块巴掌大的石头，边是直的、正的。
    points:
      p1: 地震那天，护住从泉眼下来的水渠
      p2: 让一位独自从东边林地被带来的帮工，在这里有人听得懂他的话
      p3: 帮石匠们把震裂的大墙照原来的咬合砌法修回去
    points_fail:
      p1: 石槽在摇晃里错开，水从半山泼了出去，十六口石池一口口干了，这条分支里的庄园断了水。
      p2: 他还是一个人背石头，说的话没人接，这条分支里他和来时一样。
      p3: 震裂的墙照史实改用小石块垒了起来，这条分支里，咬合的大石砌法在这几面墙上停了。
    shift:
      p1:
        was: 1450 年前后修起的水渠从泉眼引水，顺着台阶流过十六口石池，五百多年后仍在流。
      p2:
        was: 1450 年前后，在马丘比丘干活的仆从来自印加各地，彼此多半不是同乡。
        now: '{staff}陪那位帮工把几句话说通了，后来他在石匠中间有了能说话的人。'
      p3:
        was: 1450 年前后施工期间的地震之后，马丘比丘的工匠改用更省工的小石块垒砌，不再一块块切出互相咬合的大石。
        now: '{staff}和石匠们一起把震裂的几面墙照原来的砌法修了回去。后来的几十年，这几面墙又扛过了几回摇晃。'
    vignettes:
      wet: '{staff}走到下一口池才落笔标“有水”，没见到水之前，第二个格子空着。'
      steps: '{staff}从台阶顶上顺着水流的方向数石池，不从早上开工的地方数。'
      mark: '{staff}在水渠拐弯处刻了个小口，下一个来清渠的人就知道水在哪里转弯。'
  maya_venus_tables:
    name: 页边的五轮金星
    place: 墨西哥奇琴伊察
    figure: 玛雅书吏们
    story: 《德累斯顿玛雅抄本》第 24 页及 46 至 50 页保存了金星表，以 584 日计一轮。
    relic: 一条彩绘树皮纸
    relic_desc: 一条树皮纸，上面有红黑的字符。
    points:
      p1: 区分周次与累计日数
      p2: 按每轮 584 日验算五轮合计
      p3: 分别标明推算栏与实测栏
    vignettes:
      count: 学算人把五写到了日数那一栏。你在一栏画五道短划，在另一栏记累计 2920 日。他看得出两栏题头为何不能互换。你把两栏一同带回，至于隔着晨云还能看见什么，这些数答不出来。
      dawn: 你认出这个日数，后来的抄本里还留着这样的表。学算人想把推出来的日子填进实测一栏。你请他等有人看过天再填。现在一栏有推算的日子，另一栏空着。下一回天晴破晓，你来不及等。
      margin: 你抄下五百八十四，旁边补一句它数的是甚么。学算人把那个题头重念一遍才收纸。回去时你还能重算这道题。要真看到金星，仍得等天气。
  sequoyah_syllabary:
    name: 一个人造出来的文字
    place: 美国东南部切罗基地区
    figure: 塞阔雅
    story: 1821 年，切罗基银匠塞阔雅完成了切罗基语的音节文字，每个符号表示一个音节，而不是单个语音。切罗基民族后来正式采纳了这套文字。1828 年 2 月 21 日，《切罗基凤凰报》在新埃乔塔印出创刊号，报上既有切罗基文，也有英文。
    relic: 一张音节表
    relic_desc: 一张纸，八十多个字符排成行。
    points:
      p1: 演示那天，拦下把这套文字当成巫术的指控，护住他和六岁的阿约卡
      p2: 减轻他那条跛腿的疼，让他走得动去各镇教字
      p3: 帮他的妻子把荒下的地种起来，劝住家里因为这套文字而起的争执
    points_fail:
      p1: 指控压过了演示，阿约卡没被叫回来念出那个词，这条分支里没人看见这套符号能把话传出去。
      p2: 那条腿照旧疼着，这条分支里他每走一段路都要停下来歇。
      p3: 地照旧荒着，家里人照旧劝他放手，这条分支里，这套文字仍旧是这个家多年的代价。
    shift:
      p1:
        was: 1821 年，塞阔雅完成了这套音节文字。切罗基民族在同一年代稍后正式采纳。
      p2:
        was: 塞阔雅一条腿跛，走路吃力，起因各说不一。
        now: 他那半年腿疼得轻了些，去邻镇教字的路走得快了些。
      p3:
        was: 他多年把地里的活丢给妻子，家里人一再劝他放下造字，妻子还烧过他的稿子。
        now: '{staff}那半年替这个家把地种了下来，家里的争执少了。后来，他的妻子也学会了用这套符号写字。'
    vignettes:
      sound: '{staff}听一个学字的人照平常的快慢念一个词，再慢慢念一遍，一个音节指一个符号，直到他自己能指着念下去。'
      lookalike: '{staff}看出有个符号长得像英文字母，把旁边铅笔标的那个字母划掉了，免得把人带偏。'
      note: '{staff}捧着一张纸条穿过议会的空地，交给一个没听见口述的人，站在旁边听他念出来。'
  finlay_havana:
    name: 蚊子与黄热病
    place: 哈瓦那
    figure: 卡洛斯·芬莱
    story: 卡洛斯·芬莱 1881 年在哈瓦那提出黄热病蚊媒传播的假说，论文题目也表明其假说性质。
    relic: 一片蚊子的玻片标本
    relic_desc: 一片标本，里面有一只蚊子的翅。
    points:
      p1: 黄热病季里护住他的论文稿和病例笔记，让他 8 月 14 日照期在科学院宣读
      p2: 宣读之后，劝几位院士留下来看他的病例，不让论文在一片沉默里被搁下
      p3: 帮他把蚊子和病例整理成能让人信服的证据，让这座城早些年开始防蚊
    points_fail:
      p1: 病例笔记在黄热病季里散失，8 月 14 日没有宣读，这条分支与历史脱了节，员工被送回。
      p2: 会场照旧一片沉默，没有人要看一份病例，这条分支里论文照旧被搁在一边。
      p3: 他的证据照旧单薄，这条分支里这座城照旧又等了二十年才对蚊子动手，在那之前黄热病每年夏天照旧回来。
    shift:
      p1:
        was: 1881 年 8 月 14 日，卡洛斯·芬莱在哈瓦那皇家科学院宣读《作为黄热病传播媒介的蚊子假说》。
      p2:
        was: 1881 年 8 月 14 日的宣读之后，会场一片沉默，这个说法此后多年被人嘲笑。
        now: 那天散会后，有几位院士留了下来，要看他的病例笔记。
      p3:
        was: 1881 年以后，芬莱用了将近二十年去证明蚊子传播黄热病，直到 1900 年美国陆军黄热病委员会用他培育的蚊子做实验，才证实他是对的。
        now: '{staff}帮他把蚊子和病例一一对上，直到证据站得住。这条时间线里哈瓦那早了些年开始防蚊，黄热病也早些离开了这座城，芬莱在自己的年代就被人相信了。'
        who: finlay_havana
        bio: IF 线里，芬莱的蚊媒说法在 1881 年后几年内就被接受，哈瓦那远在 1900 年以前就照着它防蚊。
    vignettes:
      headline: 虚构的编辑把一个推测写成了确定的事。你慢慢念回原题，他在校样交出去前把「假说」两字补回去。
      columns: 编辑把笔记里每一行都照同一种意思念。你划成所见和所推两栏，有一句移到了另一边。
      place: 你核对宣读论文的地点。编辑把地名记在日期旁，后来的报道才不会把会议说成另一场。
  bell_boston:
    name: 把听到的写下来
    place: 波士顿
    figure: 亚历山大·格雷厄姆·贝尔
    story: 亚历山大·格雷厄姆·贝尔的实验笔记记载，1876 年 3 月 10 日在波士顿，托马斯·沃森听懂了贝尔对着发话装置说的话。6 月 25 日，费城百年博览会的评委听到了电话；贝尔原本差点留在波士顿改学生的考卷。
    relic: 一只电话听筒
    relic_desc: 一个木制听筒，里面有一片薄薄的振膜。
    points:
      p1: 在资助人催多路电报时保住贝尔的传声试验，让隔壁的人听到那句完整的话
      p2: 接过考卷，赶在评委巡到之前把累垮的贝尔送上去费城的火车
    points_fail:
      p1: 工坊改回原来的电报工作，三月的传声试验没做完。历史脱节，员工被召回。
      p2: 贝尔守着考卷留在波士顿，6 月 25 日评委走过一张空桌。历史脱节，员工被召回。
    shift:
      p1:
        was: 1876 年 3 月 10 日，贝尔在波士顿用实验装置把一句完整清楚的话传给了隔壁的沃森。
      p2:
        was: 1876 年 6 月 25 日，贝尔在费城把电话演示给百年博览会的评委，其中有佩德罗二世和威廉·汤姆森。他当时疲惫不堪，学生的考卷还没改完，本来不想去。
    vignettes:
      blind: 接听的帮工想先看试句。你把纸折起来，请他只写实际听见的。传过来两个完整的词，最后一个留了空。你把这张纸条带回去，收队时又一轮刚要开始。
      future: 你告诉帮工，后人会记住这天传过来的一句话。他猜只要留下说话那端写的句子就够了。你摊开两张纸条，一张给说话人，一张给听话人。眼下这趟究竟漏了哪儿，还得靠这两张对出来。
      door: 你把接听那张折好的条子带过门，这才摊到试句旁。听漏的词依旧空着，听对的两个总算有了记录。你带回对照表，下一句没有听到。
  budj_bim_eels:
    name: 水曾经到过哪块黑石
    place: 澳大利亚维多利亚州布吉比姆
    figure: 贡迪玛拉人
    story: 贡迪特马拉人介绍布吉比姆文化景观时，记述他们长期利用火山岩修渠筑堰、调节水流，其中包括管理短鳍鳗 kooyang。
    relic: 一只编织的鳗鱼笼
    relic_desc: 一只长筐，口像漏斗。
    points:
      p1: 沿练习水道朝向稳住草图
      p2: 辨出湿痕，别把它当成眼下的水位
      p3: 与帮工约好一个能再复看的位置
    vignettes:
      level: 帮工圈了一道湿痕，说水现在就到那儿。你蹲到一片还在漂的叶子旁，在第一记下头再画一记。图里既留着旧痕，也留着眼下流到哪里。等水再涨到旧痕，你早已走了。
      return: 你知道后世仍会把这些水道连起来看。帮工只够留一个记号，你们挑了弯边一块黑石，约定下回从同一处看。你带走这处站位，下场雨后的那笔还写不出。
      bend: 你画到水转弯看不见的地方，就把线停在那里。帮工留下余纸，等以后再走。你带回水道的一处弯，全程还留在图外。
  galois_paris:
    name: 决斗前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽罗瓦
    story: 1832 年 4 月 29 日，埃瓦里斯特·伽罗瓦在巴黎获释出狱。5 月 29 日夜里，他给朋友奥古斯特·舍瓦利耶写信，概述自己关于哪些方程能用根式求解的发现，托他把信刊出。第二天清晨，他在决斗中腹部中枪，被丢在原地，5 月 31 日死在科钦医院，年仅二十岁。那年九月，舍瓦利耶刊出了这封信。十四年后，约瑟夫·刘维尔刊出了他的论文。
    relic: 一封匆忙写就的信
    relic_desc: 写满算式的信页，页边写着没有时间了。
    points:
      p1: 5 月 29 日夜里趁伽罗瓦还能逐页核对，把写给舍瓦利耶的信和信中提到的论文分别包好，送到收信人手上
      p2: 趁九月刊信，请编辑一并刊出手稿索引，约一位能逐页核查的数学同行先读留存稿
      p3: 5 月 30 日清晨决斗以后，立刻把伽罗瓦送到医生手里，救下中了腹部一枪的他
    points_fail:
      p1: 约定的交接一再推迟，信与待寄的草稿被分开。舍瓦利耶收不到 5 月 29 日的信，事务所因同步失败召回员工。
      p2: 九月的刊物只有信件。愿意往下核对的人仍须先找到保管手稿的朋友。
      p3: 他中枪后被丢在原地，直到有路人发现，5 月 31 日死在科钦医院，年仅二十岁。这条分支里此后没有伽罗瓦。
    shift:
      p1:
        was: 伽罗瓦 1832 年 5 月 29 日写信给奥古斯特·舍瓦利耶，概述研究，并托他处理稿件和刊出书信。
      p2:
        was: 信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交给刘维尔，刘维尔于 1846 年刊行。
        now: 九月读到这封信的同行可以按刊出的索引申请借看一份抄本。所提问题和对应页码回到舍瓦利耶手中，给下一轮审阅留下记录。
      p3:
        was: 1832 年 5 月 30 日，伽罗瓦在决斗中腹部中枪，被丢在原地；5 月 31 日他死在科钦医院，年仅二十岁。
        now: '{staff}几分钟内赶到，止住了血，又没让伤口感染。伽罗瓦活了下来，回到数学上，亲自向那些没读懂他的数学家讲清自己的理论。'
        who: galois_paris
        bio: 伽罗瓦挺过了 1832 年 5 月的决斗。他在巴黎继续做数学，生前就看到自己关于方程的理论被人读懂、讨论。
    vignettes:
      candle: 5 月 29 日夜里，{staff}替看门的老妇人往楼上送第二支蜡烛。她嘟囔说，这位年轻先生的灯从天黑亮到现在，墨水也是从她这儿借的，回头得记进账里。
      cart: 5 月 31 日，{staff}在科钦医院门口帮一个车夫卸柴。车夫说，昨天抬进去一个年轻人，今早就盖上了布。他往这儿送了十年柴，最受不了的就是这种天气好的早上。
      type: 夏末，{staff}在一家小印坊里帮着捡撒了一地的铅字。排字工抱怨这一期有封信满纸算式，等号得一个个从隔壁字盘里借。
  van_gogh_auvers:
    name: 奥维尔的夏天
    place: 奥维尔
    figure: 文森特·梵高
    story: 1890 年 5 月 20 日，文森特·梵高来到瓦兹河畔奥维尔，住进拉武客栈，常去看保罗·加歇医生。他几乎一天画一幅。约 7 月 10 日的一封信里，他写到不安的天空下大片的麦田。7 月 27 日，他朝自己胸口开了一枪，7 月 29 日去世，弟弟提奥在他身边。
    relic: 一管铬黄颜料
    relic_desc: 一支挤瘪的锡管，里面是他画麦田用的那种黄。
    points:
      p1: 暴风雨般的天空下，帮他把那幅麦田画完，不让画布倒进麦田
      p2: 从巴黎回来以后，帮他把提奥一家的钱和生计问清、说开，不让那场风暴压在他身上
      p3: 让他知道自己的画会被记住
      p4: 7 月 27 日之前，治好他的身体和心病，让他活下来
    points_fail:
      p1: 那幅画在风里倒进了麦田，这条分支里没有《麦田上空的乌云》。
      p2: 他从巴黎回来，照旧觉得那场威胁提奥的风暴也压在自己身上，这条分支里没有人帮他把钱的事理清。
      p3: 他照旧觉得自己的画是提奥的负担，这条分支里没有人告诉过他这些麦田后来的去处。
      p4: 7 月 27 日照史实发生，这条分支里他没能多画一个季节。
    shift:
      p1:
        was: 1890 年 7 月初，梵高在不安的天空下画成了大片的麦田，7 月 10 日前后写信给提奥和乔说起它。
      p2:
        was: 1890 年 7 月初，梵高去巴黎看提奥一家，得知提奥想辞去做了多年的画廊职位、自己开业；回奥维尔后他写信说，那场威胁提奥的风暴也压在自己身上。
        now: 他从巴黎回来时已经知道提奥家撑得住，回到麦田里画画时，心上少压了一件事。
      p3:
        was: 1890 年 7 月，梵高在信里说觉得自己是个失败者，看不到好的前途；他生前卖出的画很少。
        now: 有人告诉过他，这些麦田以后会挂在博物馆的墙上，有很多人专程去看。
      p4:
        was: 1890 年 7 月 27 日他受了枪伤，两天后在奥维尔去世，只画了大约十年。
        now: '{staff}陪他过了那个七月，病没有再把他压垮，那个夏天过去时他还在拉武客栈。他又画了几年，麦田之后还有别的季节。'
    vignettes:
      sky: '{staff}在本子上把同一片田画了两遍，头一遍只留一条天，第二遍留得多，从第二幅里看出了头一幅藏住的东西。'
      wind: '{staff}等下一阵风吹过麦田，看着那块暗影从田上移过去，没有擦掉头一眼画下的。'
      path: '{staff}沿着田间小路一直走到看得见尽头的地方，回来时已经说得清它通到哪里。'
  abel_froland:
    name: 一道算得出的五次方程
    place: 弗罗兰
    figure: 尼尔斯·亨里克·阿贝尔
    story: 1828 年圣诞，尼尔斯·亨里克·阿贝尔受着寒、咳着嗽坐雪橇来到弗罗兰铁厂看望未婚妻，此后在那里卧床十二周。1829 年 1 月 6 日，他写下最后一篇论文，两三页，重述他交给巴黎科学院的那篇长稿的要点。4 月 6 日，他死于肺结核，二十六岁。两天后，尚不知情的奥古斯特·利奥波德·克雷勒从柏林来信，说替他谋的职位已经落实。
    relic: 一封封着的信
    relic_desc: 一封没拆开的聘书，用细线系着。
    points:
      p1: 在阿贝尔病中写最后一篇短稿时，帮他把证明核对到可以寄出
      p2: 趁短稿还在手边，帮阿贝尔把它同巴黎长稿的投递记录对上，给找稿的人留下索引
      p3: 阿贝尔在弗罗兰卧床的十二周里，替他挡住屋里的冷，减轻他的咳嗽和病痛
      p4: 请替阿贝尔奔走的人先寄一封进展信，让他生前知道柏林还有人为他的职位努力
    points_fail:
      p1: 短稿停在校对之前，巴黎长稿的要点也没有这份及时的公开记录。行程同步失败，员工被召回。
      p2: 寻找巴黎长稿的人只知道大致题目，仍要从旧收件记录一页页找。
      p3: 冷和咳嗽没人减轻，这条分支里他在弗罗兰的最后几周和原来一样难熬。
      p4: 弗罗兰一直等不到柏林的消息，正式的好消息来得太晚。
    shift:
      p1:
        was: 1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学短稿，重述巴黎长稿的主要结果。
      p2:
        was: 1829 年前后，阿贝尔重述巴黎长稿的要点，原稿一度难寻，直到 1841 年才印行。
        now: '{staff}把短稿和旧投递日期对在一处，两边各留一份索引。以后查稿的人能凭交件记录缩小范围。'
      p3:
        was: 1828 年圣诞，阿贝尔受着寒、咳着嗽坐雪橇到弗罗兰，随后开始咳血，此后在那里卧床十二周。
        now: '{staff}守着炉火，把床铺焐暖，最难熬的几夜一直坐在床边。阿贝尔最后几周少受了些罪。'
      p4:
        was: 1829 年 4 月 6 日阿贝尔去世，柏林确认职位的信于两日后写成。
        now: '{staff}请联系人先把奔走过程写回弗罗兰。阿贝尔读到朋友们正在为他争取职位，知道这件事还有人在做。'
        who: abel_froland
        bio: 阿贝尔去世前收到柏林朋友奔走的进展，知道他们还为他留着继续研究的机会。正式任命仍在他去世之后。
    vignettes:
      firewood: 二月最冷的那几天，{staff}帮厨房女佣往楼上搬劈柴。女佣说，楼上那位先生咳一夜，她就在楼下数一夜，数到天亮也没数清。
      sledge: 一月，{staff}帮马夫给雪橇换一根断了的辕木。马夫说圣诞那趟从城里接来一位先生，裹着三层毯子一路咳，下车时连自己的箱子都提不动，是他扛上楼的，赏钱他没要。
      post: 四月，{staff}帮铁厂的账房先生分拣邮包。他翻出一封盖着柏林邮戳的信，对着窗户看了半天，说这一封来得不巧，收信的人已经不在了。
  riemann_selasca:
    name: 最后一篇论文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 1862 年，伯恩哈德·黎曼病倒，此后患肺结核，几次南下意大利养病。1866 年 6 月，他第三次来，住进马焦雷湖畔的塞拉斯卡。7 月 19 日，他在无花果树下休息，仍在写最后一篇论文，没有写完。第二天，他在那里去世，三十九岁。十年后，他的全集出版，理查德·戴德金参与了编订。
    relic: 一页笔记
    relic_desc: 一页写着没完成公式的纸，字很小。
    points:
      p1: 他在塞拉斯卡力气一天天衰下去时，替他记下口述、理好稿页，帮他把最后那篇论文往下写一段
      p2: 治好拖垮他的肺结核，救下黎曼
    points_fail:
      p1: 最后那篇论文照史实停在原处。
      p2: 他照史实在 7 月 20 日死在塞拉斯卡，这条分支里也没能留住他。
    shift:
      p1:
        was: 皇家学会悼文和戴德金的记述都说，去世前一天他在塞拉斯卡的无花果树下休息，仍在写最后那篇论文，论文没有写完。
        now: 最后那篇论文用他自己的话多写了几页，后来连同这几页一起印出。
      p2:
        was: 1866 年 7 月 20 日，黎曼在马焦雷湖畔的塞拉斯卡死于肺结核，三十九岁。
        now: '{staff}带去的药治好了从 1862 年起拖着他的病。那年秋天他回到北边，又在哥廷根上起了课。'
        who: riemann_selasca
        bio: 这条时间线里，黎曼在 1866 年夏天治好了肺结核。他回到哥廷根，又工作了许多年。
    vignettes:
      figs: 7 月 18 日傍晚，{staff}帮房东的小女儿把无花果树下的落果捡干净。她说树下那把椅子是给德国先生摆的，漏掉一个，他的稿纸就要染成紫的。
      boat: 七月初，{staff}帮湖上的船夫把一船柠檬卸到帕兰扎码头。船夫说今年夏天湖上的船少了一半，年轻人都被叫去当兵了，他只好教老婆划桨。
      chair: 八月，{staff}帮房东把无花果树下那把椅子搬进屋。房东用袖子擦了又擦，说这树从没结过今年这么多的果子，树底下却没人坐了。
  du_chatelet_luneville:
    name: 法语版牛顿
    place: 吕内维尔
    figure: 埃米莉·杜·夏特莱
    story: 1749 年夏，埃米莉·杜·夏特莱住在吕内维尔斯坦尼斯瓦夫的宫廷里待产，手上是快要完成的牛顿《原理》法译和评注。9 月 4 日，她生下一个女儿。9 月 10 日，她去世，四十二岁，死因一说产褥热，一说肺栓塞。同一天，巴黎的王家图书馆为她寄存的三包评注稿签了收据。1759 年，法译全本出版。
    relic: 一只墨水瓶
    relic_desc: 一只小墨水瓶，来自一张通宵写字的书桌。
    points:
      p1: 在吕内维尔把三包评注稿逐包登记，连同她写给王家图书馆的请求交运
      p2: 请她把最难厘清的两项留给克莱罗，说明哪里要保留原译，哪里需另列后续校改
      p3: 产后那几天守着她，治好她的病，让她活下来
    points_fail:
      p1: 夹有评注的稿包留在宅邸，图书馆只收到信，事务所因同步失败召回员工。
      p2: 两份相关草稿一起送达，改过的位置却没有留下她想怎样印的说明。
      p3: 9 月 10 日，她在吕内维尔去世，离生下女儿只有六天。
    shift:
      p1:
        was: 1749 年 9 月 10 日，王家图书馆为杜·夏特莱寄存的三包牛顿评注稿开出收据。
      p2:
        was: 1759 年，法语全本出版，杜·夏特莱去世后由克莱罗参与整理。
        now: 编辑手里有她核过的两份决定，后来附上的修改在另页说明。读者可以区分她的评注与编辑的补充。
      p3:
        was: 1749 年 9 月 4 日夜里，杜·夏特莱生下一个女儿，9 月 10 日在吕内维尔去世，死因一说产褥热，一说肺栓塞。
        now: 她熬过了产后那几天，秋天里身体慢慢复原。她亲自看着牛顿译本付印，此后又做了多年研究。
        who: du_chatelet_luneville
        bio: 杜·夏特莱在 1749 年产后活了下来，亲自把牛顿《原理》的法译与评注送进印坊，此后继续写作与研究多年。
    vignettes:
      stairs: 9 月 4 日一早，{staff}帮洗衣房的姑娘把一摞干净布巾送上楼。姑娘说楼上半夜就点了灯，她躺着数楼梯上的脚步，到天亮一共跑了十一趟。
      candles: 八月底，{staff}帮宫里管蜡烛的老仆清点库房。老仆说侯爵夫人屋里的蜡烛比国王的书房还费，他这个月得提前一周报账。
      arbour: 十月，{staff}帮园丁把凉亭的帘子收起来。园丁说宫里今年秋天静得早，往年这时候还在这儿排戏。
  noether_gottingen:
    name: 署着别人名字的课
    place: 哥廷根
    figure: 埃米·诺特
    story: 1915 年，大卫·希尔伯特和费利克斯·克莱因把埃米·诺特请到哥廷根，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。1918 年 7 月 26 日，克莱因把她的论文《不变变分问题》呈交给哥廷根科学学会，9 月底她交了终稿。这篇论文把作用量的连续对称性与守恒定律联系起来。1919 年 6 月，她获准任教，直到 1923 年才第一次领到一小笔固定的教学薪酬。
    relic: 一张课程通告
    relic_desc: 一张厅里的通告，应该写她名字的地方写着希尔伯特。
    points:
      p1: 把诺特署名的文稿和提要同时交到克莱因手上，让他能按期将论文呈交给哥廷根学术团体
      p2: 把本学期由诺特实际授课的记录和署名论文一并交给系里，请系里先为下一轮讨论课核定课酬，再随新申请存档
    points_fail:
      p1: 名册上只有呈交人的名字，讲义与作者页没能对回同一份。会议把论文退到下一次，事务所因同步失败召回员工。
      p2: 系里同意有人继续带讨论课，但依然用原来的排课办法，没有经费支付诺特这部分工时。
    shift:
      p1:
        was: 1918 年 7 月 26 日，费利克斯·克莱因在哥廷根的一次会议上呈交《不变变分问题》。印本所署作者是埃米·诺特。
      p2:
        was: 诺特于 1919 年获任教资格，哥廷根大学记录她到 1923 年才取得带少量固定薪酬的教学任务。
        now: 系里在任教资格重审前先拨了一小笔课酬，按实际开课支付。这个学期愿意跟她做题的学生因此有一段固定的时间可来。
        who: noether_gottingen
        bio: 哥廷根的任教规则曾让诺特的第一份申请受阻。她仍开展研究，后来以一系列论文和自己的课堂培养学生。
    vignettes:
      notice: 冬季学期开课前，{staff}帮工友往布告栏上钉课表。工友指着一行念：希尔伯特教授，在诺特博士协助下。他说这一行他钉了好几个学期，进教室讲课的一直是那位女博士。
      turnips: 十月，{staff}帮房东太太在后院挖萝卜。她说城里流感又起来了，学生公寓空了一半，面包票她早就不数了，反正也没什么可数的。
      snow: 十二月底，{staff}帮数学楼的门房扫台阶上的雪。门房说打完仗回来的学生太多，讲堂里没座位了，有人站在走廊里听。
  wegener_greenland:
    name: 越过冰盖
    place: 格陵兰冰盖
    figure: 阿尔弗雷德·魏格纳
    story: 1930 年，魏格纳运送补给抵达冰盖内陆站艾斯米特，在回程中去世。阿尔弗雷德·魏格纳研究所的档案说明记下了行程，并指出格陵兰同行者拉斯穆斯·威卢姆森的姓名。
    relic: 一条雪橇皮带
    relic_desc: 一条冻硬的皮带，系过满载的雪橇。
    points:
      p1: 护住救援队走完最后一段冰路，让魏格纳、勒韦和维卢姆森在 10 月 30 日到达艾斯米特
      p2: 治好勒韦冻坏的脚，让他不必在冰洞里被截去脚趾
      p3: 护住维卢姆森往西的路，让他带着魏格纳的日记走回营地
      p4: 在回程的冰上治好魏格纳，让他活着走回西边的营地
    points_fail:
      p1: 队伍被严寒困在冰上，没能在 10 月 30 日到站，这条分支与历史脱了节，事务所召回员工。
      p2: 勒韦冻坏的脚趾没保住，那年冬天在站上被截去，直到开春都下不了地。
      p3: 维卢姆森埋好魏格纳，带着日记继续往西走，此后再没有人见过他，日记也跟着不见了。
      p4: 魏格纳在回程的冰上去世，约在 11 月中旬，遗体到第二年 5 月才找到。
    shift:
      p1:
        was: 1930 年 10 月 30 日，魏格纳、勒韦和维卢姆森在冰上走了四十天，到达冰盖中央的艾斯米特站。
      p2:
        was: 1930 年冬天，勒韦冻坏的脚趾在艾斯米特站被人用小刀截去，整个冬天不能走路。
        now: 勒韦保住了脚趾，那个冬天他在站上自己走动。
      p3:
        was: 1930 年 11 月，维卢姆森在冰上埋葬了魏格纳，带着他的日记继续往西，此后下落不明。
        now: 维卢姆森走回了西边的营地，把魏格纳的日记交到考察队手里。
        bio: 拉斯穆斯·维卢姆森 1930 年 11 月从冰盖上走了回来，回到自己在格陵兰的家人身边。
      p4:
        was: 1930 年 11 月 1 日，魏格纳在五十岁生日这天离开艾斯米特，约在 11 月中旬死在回程的冰盖上，遗体 1931 年 5 月 12 日才被找到。
        now: '{staff}一路跟着他往回走，每晚看着他的体力。他活着走进了西边的营地，后来亲眼看到这次考察的测量一项项整理出来。'
        who: wegener_greenland
        bio: 魏格纳 1930 年 11 月从冰盖中央活着走了回来。他又活了许多年，看着这次考察的观测整理出来。
    shift_all: 这条时间线里，那年秋天进出艾斯米特的人都活着回到了海岸。
    vignettes:
      names: 虚构的办事员只在远征一栏写下一个姓。你问是谁把那份东西交到站上的。他给其他参与的人另留了一行，没有只记最著名的姓名。
      count: 办事员把出发的数写得像到站的数。你请他在每项数字旁标上是哪一站的记录，两项合计便不再挤在同一个栏头下。
      note: 办事员收拢账本时，你把目的地另抄一张。后来的人仍能看出这些条目记的是哪一站。
  boltzmann_duino:
    name: 同一个数，几种排法
    place: 杜伊诺
    figure: 路德维希·玻尔兹曼
    story: 1877 年，路德维希·玻尔兹曼数出同一种能量分布可以有多少种排法，把热的规律和原子的统计联系起来，可直到二十世纪初，原子是否真实存在仍有许多人怀疑。1906 年 5 月，他因所谓严重的神经衰弱停课，夏天和家人到的里雅斯特附近的杜伊诺度假。9 月 5 日，他在那里去世，六十二岁。两年后，让·佩兰的布朗运动实验开始证实爱因斯坦的预言，原子渐渐被人接受。
    relic: 一截粉笔
    relic_desc: 一截用得很短的讲课粉笔。
    points:
      p1: 让他知道，原子的存在过不了几年就会被实验证实，他为之争了半辈子的学说站得住
      p2: 在杜伊诺的假期结束之前，治好他的病，让他回到维也纳
    points_fail:
      p1: 他照旧在怀疑声里过完这个夏天，这条分支里没有人告诉过他布朗运动的实验会替原子作证。
      p2: 9 月 5 日照史实发生，这条分支里他没有回到维也纳的讲台。
    shift:
      p1:
        was: 1906 年 9 月 5 日玻尔兹曼去世时，原子是否真实存在仍有不少物理学家和化学家怀疑；1908 年起佩兰的布朗运动实验验证了爱因斯坦 1905 年的预言，原子才被普遍接受。
        now: 那个夏天他已经知道，原子的事过几年就会有人用实验定下来。
      p2:
        was: 1906 年 5 月玻尔兹曼因病停课，课由斯特凡·迈尔代讲；同年 9 月 5 日他在杜伊诺度假时去世，终年六十二岁。
        now: '{staff}陪他过了杜伊诺的那个夏天，病一点点缓下来。秋天他带着家人回到维也纳，又站上了讲台，还亲眼看到原子被实验证实。'
        who: boltzmann_duino
        bio: 这条时间线里，玻尔兹曼 1906 年秋天病好了回到维也纳，又教了几年书，看到了佩兰的实验让原子学说被普遍接受。
    shift_all: 他知道自己的学说站得住，病也好了，秋天回到维也纳接着讲课。
    vignettes:
      pebbles: 七月，{staff}在海滩上帮渔夫的小儿子数一桶小石子。孩子问，太小、数不清的东西，是不是就不算有。{staff}说没人数它也在那儿。孩子想了想，又往桶里扔了一把。
      nets: 七月初，{staff}帮渔夫把晾在岸边的网收起来。渔夫说这一湾斯洛文尼亚话、意大利话、德国话都听得到，鱼可不管你用哪种话骂它。
      towels: 八月，{staff}帮旅馆的女招待把海边晾干的浴巾收回来。她说今年海水暖得早，城里来的客人一住就是一整季，她的手让盐水泡得起了皮。
  cantor_halle:
    name: 疗养院寄出的信
    place: 哈雷
    figure: 格奥尔格·康托尔
    story: 康托尔 1913 年退休，战时的德国缺粮，他最后几年多病，也吃不饱。1917 年 6 月他最后一次住进哈雷的疗养院，一再写信给妻子，请求让他回家。1918 年 1 月 6 日，他在那里死于心脏病发作。
    relic: 一叠索引卡片
    relic_desc: 卡片上写满了永远列不完的清单。
    points:
      p1: 劝院方和他的家人答应，让他回到家里调养
      p2: 战时最后一个冬天里，让他吃饱、照看好他的心脏，救下他
    points_fail:
      p1: 他照史实留在疗养院里，求回家的信一封封寄出去，始终没有获准。
      p2: 1918 年 1 月 6 日，他照史实在疗养院里死于心脏病发作。
    shift:
      p1:
        was: 1917 年 6 月，康托尔最后一次住进哈雷的疗养院，一再写信给妻子请求回家，没有获准。
        now: 他回到了家里，在家人身边养病。
      p2:
        was: 1918 年 1 月 6 日，康托尔在哈雷的疗养院里死于心脏病发作，此前几年他一直吃不饱。
        now: 那个冬天他吃得饱，也有人照看，活过了 1918 年 1 月。
        who: cantor_halle
        bio: 这条时间线里，康托尔在战时最后一个冬天有饭食、有人照看，活过了 1918 年 1 月。
    vignettes:
      list: 学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。
      after: 学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。
      end: 你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。
  tesla_wardenclyffe:
    name: 那一行写着拟建
    place: 长岛肖勒姆
    figure: 尼古拉·特斯拉
    story: 1901 年 3 月，J.P. 摩根答应出资十五万美元，给尼古拉·特斯拉建一座无线电站。建筑师斯坦福·怀特设计了长岛沃登克里弗的房子，这一年特斯拉为塔和实验楼几次写信给他。9 月工地动工。12 月，马可尼收到了一个越过大西洋的信号。1902 年 6 月，特斯拉把实验室搬进砖楼；1903 年 7 月，摩根回信说不再追加款项。1917 年，塔被炸掉。
    relic: 一份图纸副本
    relic_desc: 一张沃登克里弗图纸的副本，折了两道，折角底下有铅笔写的日期。
    points:
      p1: 九月收到超支估价后，在沃登克里弗把旧图及修订图分别签收，护住当年仍能开工的建筑
      p2: 请怀特把已能确定的实验楼工程和仍待换报价的塔身分开给工头，两套账各有一页
      p3: 请特斯拉带已经确认的工价向出资人提出分段拨款，让未来几个月的基础工程有独立的付款约定
    points_fail:
      p1: 包工人只按旧图估价，没人能确定接受哪套尺寸，工地取消本季安排，事务所因同步失败召回员工。
      p2: 一份报价把楼与塔的工钱都合在一栏，后来无法据账看出哪部分已经承诺。
      p3: 两部分仍等同一轮筹款。后续遇到缺口时，工人不知道哪些工作能拿到钱。
    shift:
      p1:
        was: 1901 年特斯拉与建筑师斯坦福·怀特讨论估价和设计。沃登克里弗在当年动工。
      p2:
        was: 沃登克里弗包括实验楼和塔，在改预算的通信里能看到多次设计修改。
        now: 工头在开工前就能把两部分各自结算，塔的改价也有前一轮可对照。
      p3:
        was: 工程最初得到摩根资助，之后未能取得足够的后续资金，计划未按设想完成。
        now: 书面约定先付清已确认的一段基础工程。往后资金不够时，工地能结清这部分，并把尚无款项的工作标出来。
        who: tesla_wardenclyffe
        bio: 特斯拉把沃登克里弗设想为无线通信和输电系统的一环。建设过程还要面对各轮报价、筹款和施工安排。
    vignettes:
      timber: 十月初，{staff}帮一个车夫把一车木板拉上通往工地的沙路，轮子每陷一回，就拿肩膀顶一回后挡板。车夫说路那头的农户已经拿这边的锤子声给母鸡定钟点了，工地歇工那几天，鸡下蛋下得最勤。
      signal: 十二月中旬，一个男孩挥着报纸从车站跑上来：马可尼收到了大洋那边发来的信号。工头把报纸举得老远，问{staff}一个点真能跑那么远吗。{staff}说能。工头把报纸折好塞进外套，叫工人接着敲。
      watch: 十二月下旬，{staff}陪守夜人在崖上的木板棚里坐了一夜，把旧报纸往墙缝里塞，挡海湾吹来的风。守夜人从一张报纸上念出煤价，说塔盖这么高，最好值得这么漏风。
  mozart_requiem_vienna:
    name: 留下能认出的笔迹
    place: 维也纳
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特1791年12月在维也纳去世时，《安魂曲》尚未完成。奥地利国家图书馆保有工作稿和含弗朗茨·克萨韦尔·苏斯迈尔补写的交付谱。
    relic: 一页留白的练习谱
    relic_desc: 抄谱习作，留着已经写下的乐句停住的位置。
    points:
      p1: 在病中交接时，护住莫扎特已经配完器的《安魂曲》开篇，别让散页错放
      p2: 他 11 月 20 日卧床不起以后，治好那场让他起不了身的高烧
    points_fail:
      p1: 第一段的分谱和草页混在一起，再拼不回完整的开篇。这条分支与史实脱节，员工被召回。
      p2: 这条分支里那场病没有退，12 月 5 日他在维也纳去世，三十五岁。
    shift:
      p1:
        was: 1791 年 12 月，莫扎特去世时，《安魂曲》的开篇已经配完器，其余多处仍是未完稿。
      p2:
        was: 1791 年 11 月 20 日起莫扎特卧床不起，12 月 5 日在维也纳去世，教区登记的死因是急性粟粒热。
        now: '{staff}带去的药退了他的高烧，12 月里他从床上坐了起来。这条时间线里，他亲手写完了《安魂曲》，又在维也纳作曲、演出了许多年。'
        who: mozart
        bio: 莫扎特在 1791 年冬天病愈，亲手写完《安魂曲》，此后在维也纳又作曲、演出了许多年。
    vignettes:
      stack: 格蕾塔收拾桌面，顺手拿开一页看着空白的纸。你扶住一叠谱，让埃米尔去对它前一页。原来那行空谱也该收在原来的次序里。格蕾塔把它放了回去，夹一张小条记下原来的位置。
      hand: 眼前的乐句埃米尔抄得出，顺着写下去就要越过原来空着的一行。你请他在抄写停住的地方划个边记。交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。
      finish: 你哼得出后世合唱团会唱的那段。格蕾塔现在就得带走副本，问原谱在这一页写到了哪儿。你指出分界，把后来听过的旋律留在心里。下一版会在你离开后拼合。
  schubert_vienna:
    name: 三月那场音乐会的节目单
    place: 维也纳
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，弗朗茨·舒伯特在维也纳音乐之友协会的会场举行了一场只演自己作品的公开音乐会，这是他一生唯一的一场。那年秋天，他已在病中，搬进哥哥费迪南德在维登的新住处。10 月 2 日，他写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。11 月 19 日，他在那处住所去世，三十一岁。三首奏鸣曲到 1839 年才出版，题献也换了人。
    relic: 一份歌曲手稿
    relic_desc: 一首运笔很快的歌，墨迹还很深。
    points:
      p1: 把临时凑到的演奏者和音乐协会的场地约到同一晚，护住舒伯特自己的音乐会
      p2: 把出版问询变成可交稿的约定，让舒伯特赶得及为最后三首钢琴奏鸣曲定下出版与题献
      p3: 在他搬去哥哥费迪南德家之前，治好缠了他多年的病，让他熬过那年秋天
    points_fail:
      p1: 出场的人和空出的场地错了日期，靠朋友帮忙才排成的音乐会取消。行程同步失败，员工被召回。
      p2: 来信仍停在等回音的阶段，三首奏鸣曲在他去世多年后才出版，题献也换了人。
      p3: 他照旧带着病在 9 月 1 日搬去哥哥家，11 月 19 日在那里去世，这条分支与历史一样。
    shift:
      p1:
        was: 1828 年 3 月 26 日，舒伯特获朋友和演奏者协助，在维也纳以自己的作品举办专场音乐会。
      p2:
        was: 1828 年 10 月 2 日舒伯特致函推荐最后三首奏鸣曲并提出题献意愿，三曲直到 1839 年才刊印。
        now: '{staff}帮舒伯特把三份谱和题献要求随交稿清单送出，请出版方先回一封能核对的确认。舒伯特生前收到了确认，题献随乐谱保留。'
      p3:
        was: 1828 年 9 月 1 日，病中的舒伯特搬进哥哥费迪南德在维登一幢新房子里的住处，11 月 19 日在那里去世，年三十一岁。
        now: '{staff}带来的药治好了他的病。那年十一月他没有病倒，此后多年仍在维也纳作曲。写了什么，这一趟的记录里没有。'
        who: schubert_vienna
        bio: 这条时间线里，舒伯特三十一岁那年秋天病好了，又活了许多年，在维也纳继续作曲。
    vignettes:
      chairs: 3 月 25 日晚上，{staff}帮协会的门房在会场里一排排摆椅子，摆到椅子用完了，名单上的名字还没念完。门房说他还没见过这么多人肯挤进一间屋子，听一个还活着的人的曲子。
      tavern: 七月的一个傍晚，{staff}坐在城墙外的一处葡萄酒园里，听一个拉琴的和一个弹吉他的一支接一支地奏圆舞曲。拉琴的在两支曲子中间停下来说，这么热的天，唱到第二段弦就松了，唯一的办法是拉快点。
      stairs: 九月初，{staff}帮维登一幢新房子的女房东把几筐东西搬上楼。墙上的灰泥还有石灰味。她说楼梯间新得会回嘴，在一楼说一句，三楼能听见两遍。
  keats_rome:
    name: 台阶旁的小屋
    place: 罗马
    figure: 约翰·济慈
    story: 1820 年 11 月，患肺结核的约翰·济慈与画家约瑟夫·塞文来到罗马，住进西班牙台阶旁的西班牙广场 26 号。1821 年 2 月 23 日夜里他在那里去世，2 月 26 日葬在新教徒公墓。照他的意思，墓碑上没有他的名字。
    relic: 一朵压干的紫罗兰
    relic_desc: 夹在书里的一朵干花。
    points:
      p1: 护住塞文，钱断了、人熬垮了也让他守在济慈身边到最后
      p2: 拦下克拉克医生的饥饿疗法和放血，让他吃得上饭
      p3: 去世之前让他知道，他的诗会被一代代人读下去
    points_fail:
      p1: 塞文在一月里倒下了，最后那些日子床边没有他。
      p2: 12 月 9 日他照旧又被放了八盎司血，每天仍只有一条凤尾鱼和一片面包。
      p3: 他照旧相信自己什么也没留下，这条分支里没有人在最后那几天告诉过他。
    shift:
      p1:
        was: 1821 年 2 月 23 日深夜，济慈去世，塞文一直守在他身边。
      p2:
        was: 1820 年 12 月 9 日，济慈照旧又被放了八盎司血，每天仍只有一条凤尾鱼和一片面包。
        now: 最后那几个月他吃得上东西，少放了好几次血，比历史上少受了些苦。
      p3:
        was: 1821 年 2 月济慈去世时，仍相信自己没有留下不朽的作品；照他的意思，墓碑上不刻名字。
        now: '{staff}在最后那几天让他知道，他的颂诗以后会一直被人读、被人背，罗马这间屋子以后会为他留着。'
    vignettes:
      stairs: '{staff}数了从门口到房间的台阶，好知道托盘端上去时还热不热，把数字记在买菜单的边上。'
      window: '{staff}把窗推开一道缝，让广场上泉水的声音进来。屋里没人说什么，也没人去关。'
      fountain: '{staff}在台阶脚下那座船形泉边打水。一位编出来的卖花人问，这栋楼里是谁病了，把一束紫罗兰半价卖了。'
  vermeer_delft:
    name: 负债的画家
    place: 代尔夫特
    figure: 约翰内斯·维米尔
    story: 1672 年战事以后，约翰内斯·维米尔的画几乎卖不出去，1675 年 7 月他去阿姆斯特丹借了一千荷兰盾。据他的遗孀后来陈述，那年 12 月他在一天半里由好好的人到了去世；12 月 15 日他葬在代尔夫特，四十三岁，留下十一个孩子。1676 年初，卡塔琳娜·博尔内斯把他的两幅画交给面包商抵面包钱，2 月 24 日又把《绘画艺术》转到母亲玛丽亚·廷斯名下。2 月 29 日，公证人来家里清点遗产；4 月，她请求高等法院免去她的债务。
    relic: 一枚珍珠耳环
    relic_desc: 一颗小珍珠，是他常画的那种。
    points:
      p1: 年底之前，护住画室里那幅《绘画艺术》，不让它被债主拿去抵债
      p2: 帮他把战后压在手里的几幅画卖出去，缓一缓这家人的债
      p3: 让他知道自己的画会被记住
      p4: 十二月中旬之前，治好他，让他活下来
    points_fail:
      p1: 《绘画艺术》在年底被债主拿去抵了债，次年二月卡塔琳娜无画可转给母亲，这条分支与历史脱了节，员工被送回。
      p2: 画照旧压在手里，一幅也没卖出去，这条分支里这家人的债照旧一天天重下去。
      p3: 他照旧不知道这些画以后会怎样，这条分支里没有人告诉过他，两百年后会有人把它们一幅幅找回来。
      p4: 十二月照史实过去，他在一天半里由好好的人到了去世，这条分支里卡塔琳娜照旧一个人带着十一个孩子面对那些债。
    shift:
      p1:
        was: 1676 年 2 月 24 日，卡塔琳娜·博尔内斯把《绘画艺术》转到母亲玛丽亚·廷斯名下，免得被拿去抵债；维米尔负债时也没有卖掉它。
      p2:
        was: 1672 年战事以后，维米尔自己的画卖不出去，经手的别家画作也压在手里；卡塔琳娜后来说这是家里欠债的缘由。
        now: 那个十二月有几幅画找到了买主，面包账和别的欠债暂时不再往上涨。
      p3:
        was: 1675 年去世以后，维米尔被冷落了将近两百年，到 1860 年代托雷-比尔热的研究才让他的画重新被人认出。
        now: 有人告诉过他，这些安静的屋子以后会被人一幅幅找出来、认回来。
      p4:
        was: 1675 年 12 月，据卡塔琳娜后来的陈述，他被债务和孩子压着，一天半里由好好的人到了去世；12 月 15 日葬于代尔夫特，年四十三。
        now: '{staff}陪他过了那个十二月，那一天半没有到来。他回到代尔夫特的画室，又画了些年，卡塔琳娜和十一个孩子没有在那个冬天失去他。'
        who: vermeer_delft
        bio: IF 线里，维米尔挺过了 1675 年的十二月，又在代尔夫特画了些年，陪这一家把债慢慢还清。
    vignettes:
      bread: 12 月 5 日早上，{staff}帮面包铺的伙计沿着老朗恩代克街送面包。到了一家门口，伙计把面包递进去，没收钱，在小本子上画了一道。他说老板每个星期六都对着这一页嘟囔，每个星期一照样叫他把面包送来。
      frames: 一月里，{staff}在一家画框铺里待了一上午，替师傅按住斜角，等胶干。靠墙的画框有一半空着。师傅说自从七二年法国人打进来，人们买框子是为了装镜子，不是装画，镜子至少不会让人付两回钱。
      peat: 二月中旬，{staff}帮一个卖泥炭的女人在集市广场上码湿泥炭块。她朝手指哈气，说今年冬天全代尔夫特都在烧便宜货，整座城闻起来像一条趴在炉边的湿狗。
  rembrandt_amsterdam:
    name: 儿子之后
    place: 阿姆斯特丹
    figure: 伦勃朗
    story: 1668 年 9 月 7 日，伦勃朗的儿子提图斯在阿姆斯特丹下葬，离他成婚只有半年。1669 年 3 月，提图斯的女儿蒂蒂娅出世。这一年，伦勃朗画了几幅署年 1669 的自画像。他在 1669 年 10 月 4 日去世，四天后葬进一处租来的墓穴；他最后一幅画没有画完。10 月 21 日，提图斯的遗孀也下葬了。
    relic: 一支画笔
    relic_desc: 一支磨旧的画笔，笔毛里的颜料已经干了。
    points:
      p1: 在他最后几周里，帮伦勃朗把画架上的《圣殿里的西面》往下画一段，别让最后一幅画停在他力气断掉的地方
    points_fail:
      p1: 《圣殿里的西面》照史实没画完，留在他的画室里。
    shift:
      p1:
        was: 1669 年 10 月 4 日，伦勃朗在阿姆斯特丹去世。他最后一幅画《圣殿里的西面》在他去世时没有画完。
        now: '{staff}替他研好颜料、扶稳画布，陪他过了最后几周。十月之前，《圣殿里的西面》在他自己手里又往下走了一段。'
        who: rembrandt_amsterdam
        bio: 这条时间线里，伦勃朗在 1669 年 9 月一直画着最后那幅画，把它画得比历史上更远。它离开画室时，更接近他想要的样子。
    vignettes:
      colours: 9 月 22 日下午，{staff}在玫瑰运河边一家颜料铺的后屋里推研磨石，磨一板铅白，磨到两条胳膊都酸了。颜料商说如今的画家都要白得像奶油一样滑，他真想卖他们一罐奶油，看看谁分得出来。
      barge: 9 月 26 日，{staff}帮一个船夫撑着一船泥炭沿玫瑰运河走。他说今年秋天水浅得很，每过一座桥船底都要刮一下，他已经开始跟桥下的石头一块块打招呼了。
      watchman: 十一月中旬，{staff}陪守夜人冒雨走了一圈。他在每个街角摇一下木响板，报一声时辰。他说这个月的雨连响板都淋进去了，摇起来像在咳嗽。
  gaudi_barcelona:
    name: 被电车撞倒
    place: 巴塞罗那
    figure: 安东尼·高迪
    story: 1926 年 6 月 7 日傍晚，七十三岁的安东尼·高迪在巴塞罗那的大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐，路人拦了几辆出租车都不停。6 月 10 日，他在圣十字医院去世，12 日安葬在圣家堂。多梅内克·苏格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，图纸和石膏模型大多毁掉。
    relic: 一个石膏模型
    relic_desc: 一个小小的悬挂式穹顶模型。
    points:
      p1: 高迪住院期间，把进行中的工程清单和工房钥匙交给多梅内克·苏格拉涅斯，让施工在六月接着往下走
      p2: 请苏格拉涅斯把关键石膏模型的照片、标尺和图纸另存一处，在工房留一份签收的清单
      p3: 6 月 7 日傍晚，大道上的电车撞倒一个没人认得的老人时，立刻把高迪送进医院，救下他
    points_fail:
      p1: 工房等着高迪回来核准，接手的同事拿不到进行中的工程清单。施工交接中断，事务所因同步失败召回员工。
      p2: 照片和图纸仍收在工房同一排柜里。后来工房毁损时，对照材料随石膏模型一起散失。
      p3: 他被当成乞丐躺在街上，几辆出租车都不停，先到一处诊所才转进圣十字医院，6 月 10 日在那里去世。
    shift:
      p1:
        was: 高迪 1926 年 6 月遭遇电车事故，在医院去世。他的合作者苏格拉涅斯接掌圣家堂工程。
      p2:
        was: 1936 年工房毁损，原图和石膏模型多有损失。工程团队后来从残件和已刊照片等材料重建。
        now: 十年后工房里的柜子烧毁，团队从另一处取回照相册和有签收的图纸。以前只能靠残件拼的两个模型面，现在有当年的尺寸可作对照。
      p3:
        was: 1926 年 6 月 7 日，高迪在大道上被电车撞倒，没带证件，衣着破旧，被当成乞丐；6 月 10 日他在圣十字医院去世，年七十三岁。
        now: '{staff}一分钟内跪到他身边，说出他是谁，直接把他送到外科医生手里。高迪活了下来，又回圣家堂的工房干了几年。'
        who: gaudi_barcelona
        bio: 高迪挺过了 1926 年 6 月的电车事故。他回到圣家堂的工房，和苏格拉涅斯一起又主持了几年工程。
    vignettes:
      tram: 5 月 29 日，{staff}站在电车后平台上，从大道这头坐到那头。售票员说这份差事最难的不是收钱，是那些边看报边过马路的人。他每到一个路口就拉一下铃，像在数落整条街。
      stone: 6 月 1 日，{staff}帮工地上两个石匠把一块雕好的石头放到灰浆上。起风时，风从头顶塔身的孔洞里穿过去，吹出哨音。年轻的那个石匠发誓每天下午都是同一个音，他已经开始跟着哼了。
      water: 7 月 10 日，入夏最热的一天，{staff}替中午来工地的卖水女人提水罐。她说石匠们不到收工铃响就喝掉一整桶，喝完还嫌水里有灰味。她说那是当然，灰就是从他们身上掉进去的。
  kafka_kierling:
    name: 疗养院里的校样
    place: 基尔灵
    figure: 弗朗茨·卡夫卡
    story: 1924 年 3 月，结核侵入弗朗茨·卡夫卡的喉头，他咽东西越来越难。4 月 19 日，他和朵拉·迪亚曼特来到克洛斯特新堡附近基尔灵的霍夫曼疗养院；医生让他少说话，他多半靠纸条交谈。5 月 6 日前后，医学生罗伯特·克洛普施托克赶来帮着照料。6 月 2 日，他还在校故事集《饥饿艺术家》的校样。6 月 3 日中午前后，他去世，四十岁，11 日葬于布拉格。这本收了四篇小说的书，8 月底在柏林出版。
    relic: 一页校样
    relic_desc: 一页印刷校样，上面有铅笔改的小字。
    points:
      p1: 病中校稿一中断就给他留下接续的位置，护住卡夫卡最后校过的故事集
      p2: 把跑腿与通信交接给轮换的帮手，给守在基尔灵的人留出一段歇息时间
      p3: 减轻他喉头的痛，让他在最后几个星期还咽得下水和几口软食
      p4: 让柏林出版人先装订一本寄到基尔灵，让卡夫卡生前看到自己选定的四篇小说合在一起
    points_fail:
      p1: 校样寄回柏林时缺了作者最后一轮批改，印本失去这次校订。行程与史实脱节，员工被召回。
      p2: 照料者仍同时守病房、收信和跑腿，连等回信的空当都抽不开身。
      p3: 喉头的痛照旧让他吃不下东西，这条分支里他最后几个星期仍靠纸条说话，几乎咽不下一口。
      p4: 作者来不及看到书，出版者在他去世后才把它交给读者。
    shift:
      p1:
        was: 1924 年 5 月，卡夫卡在基尔灵养病时仍在校订《饥饿艺术家》的校样。
      p2:
        was: 1924 年 5 月，有朋友前往基尔灵协助照料已经病重的卡夫卡，分担伴侣原先承担的工作。
        now: '{staff}把送印、送信和陪伴所需的人手分时安排，帮手到时，原来守着的人可以出门走一会儿。'
      p3:
        was: 1924 年春，结核侵入卡夫卡的喉头，吞咽剧痛，吃不下也睡不好，医生每隔八到十天给喉上神经注射一次止痛；6 月 3 日他在基尔灵去世。
        now: '{staff}帮医生把止痛排在饭前，他在最后几个星期还喝得下水、吃得下几口软食，比历史上少受了些苦。'
      p4:
        was: 1924 年 6 月 3 日卡夫卡去世，同年 8 月《饥饿艺术家》故事集出版。
        now: '{staff}请柏林先把已经改完的印张装成一本随邮寄回。卡夫卡在基尔灵翻过它，认得出自己定的四篇和次序。'
        who: kafka_kierling
        bio: 卡夫卡生前看到一册按最后校样装订的故事集。正式出版时出版社保留了他选定的篇目和次序。
    vignettes:
      lilac: 5 月 13 日，{staff}帮疗养院的园丁修剪篱笆边的丁香。园丁说今年丁香晚开了一个星期，蜜蜂到现在还没原谅它，天天飞到厨房窗口来抱怨。
      post: 5 月 23 日，{staff}跟疗养院跑腿的男孩走下坡去克洛斯特新堡的邮局。男孩说他不用看就知道信从哪儿来：柏林来的又厚又硬，全是纸；布拉格来的薄，天天都有。
      rain: 六月中旬，{staff}被一场急雨堵在村里面包铺的门洞下。面包师的妻子看着街面变成一条河，说基尔灵的小溪只在她刚刷完门口台阶的时候才漫上来。
  dickinson_amherst:
    name: 箱子里的诗
    place: 阿默斯特
    figure: 艾米莉·狄金森
    story: 艾米莉·狄金森许多诗以手稿传世。
    relic: 一册手缝的小本
    relic_desc: 几页手工缝起来的纸，每页一首诗。
    points:
      p1: 帮拉维尼娅分开要销毁的来信和姐姐捆好的诗稿，护住那批尚未刊行的诗
      p2: 劝拉维尼娅把原册留在家中，只把保留手稿版面的副本交出去编辑
      p3: 她病重的最后几周，减轻她的病痛，让她夜里睡得着
      p4: 去世之前让她知道，她的诗会印成书，一代代有人读
    points_fail:
      p1: 诗稿和来信混进同一摞纸，大批未刊诗跟着消失。这条分支与史实脱节，员工被召回。
      p2: 编诗时原册被拆，后来的读者只能靠针孔和纸张重排册序。
      p3: 五月中旬她陷入昏迷，再没有醒来。
      p4: 她生前只有十来首诗印出来，都没署她的名字；这条分支里没人在最后那些天告诉过她以后的事。
    shift:
      p1:
        was: 1886 年，狄金森去世后，拉维尼娅按姐姐的要求销毁来信，另外发现了成批诗稿。
      p2:
        was: 1886 年以后，狄金森亲手缝成的诗册在早期编辑阶段被拆开。
        now: '{staff}帮拉维尼娅把摊开的页面逐页照原样副抄，原册留在家里。后来读者能看到哪些诗是狄金森自己缝在一起的。'
      p3:
        was: 1886 年 5 月，狄金森病了两年半之后陷入昏迷，5 月 15 日去世。
        now: 最后那几周她少受了些苦，夜里睡得着。
      p4:
        was: 1886 年 5 月 15 日狄金森去世时，她写下的近一千八百首诗只有十来首印出过，都没有署名。
        now: '{staff}在她还清醒时让她知道，那些诗会印成书，往后一直有人读。'
        who: dickinson_amherst
        bio: 狄金森在最后几天知道了她的诗会被一代代人读下去，在阿默斯特的家中去世。
    vignettes:
      pause: 读者朗读时把破折号滑了过去。你请他在笔迹断开的地方停一停。再读那一行，他听出了另一种收尾。
      variant: 你看见行上还写了一个词。读者想挑一个抄完就算，你腾出页边，把两个都留着，并注明各在何处。
      stack: 读者整理散页时，你把边缘和笔迹对得上的两张留在一起。下一次清抄，便从这两张并排开始。
  poe_baltimore:
    name: 第四选区的一张求助条
    place: 巴尔的摩
    figure: 埃德加·爱伦·坡
    story: 1849 年 9 月 27 日，埃德加·爱伦·坡离开里士满，要回纽约福德姆的家，第二天到了巴尔的摩。此后直到 10 月 3 日，他的行踪没有可靠记载。10 月 3 日是选举日，有人在瑞安那处第四选区投票点发现他处境不妙，印刷工约瑟夫·沃克写条子请约瑟夫·斯诺德格拉斯来。他被送进华盛顿学院医院，不许探视，7 日天亮前在那里去世，四十岁，死因至今不明。他的姨母兼岳母玛丽亚·克莱姆是从报上读到的。
    relic: 一根手杖
    relic_desc: 一根朴素的手杖，握柄已被磨旧。
    points:
      p1: 凭那张求助条尽快找到能接应的人，护住坡从投票点到医院的那段路
      p2: 趁他还在病房里，把消息送到玛丽亚·克莱姆手上，别让她从报上读到
      p3: 在华盛顿学院医院里守着他熬过谵妄，救下坡
    points_fail:
      p1: 求助条递进人群里就断了，没有人及时把他送进医院。分支与历史脱了节，事务所因同步失败召回员工。
      p2: 家里继续等他自己回来，玛丽亚·克莱姆是从报上读到噩耗的。
      p3: 他照史实在 10 月 7 日死在医院里，这条分支里也没能留住他。
    shift:
      p1:
        was: 1849 年 10 月 3 日，有人在巴尔的摩的一处投票点发现坡急需帮助，写条求援后，他被送进华盛顿学院医院。
      p2:
        was: 1849 年 10 月 9 日，玛丽亚·克莱姆写信给尼尔森·坡，说刚从报上得知他的死讯。
        now: '{staff}把院方知道的情况和回信地址寄给了她。她的回信在他还在病房时送到了。'
      p3:
        was: 1849 年 10 月 7 日，坡在巴尔的摩的华盛顿学院医院去世，四十岁，死因至今不明。
        now: '{staff}守着他熬过了最难的几夜，他挺了过来。十月底他出了院，往北回纽约的家。'
        who: poe_baltimore
        bio: 这条时间线里，坡挺过了 1849 年 10 月在巴尔的摩医院里的那几天。他回到纽约，又写了、编了几年。
    vignettes:
      wharf: 9 月 28 日，{staff}在码头上等里士满来的汽船靠岸。一个背着三只箱子的脚夫说，诺福克的船运病人，里士满的船运诗人，哪一种给的小费更少，他说不准。
      ballot: 10 月 2 日，{staff}看几个人在隆巴德街一家酒馆门外钉木牌。酒馆老板说明天楼上每间屋都租给了选区，啤酒由候选人请；他早学会了数酒桶，不数投票的人。
      ward: 10 月 4 日夜里，{staff}提一桶清水上到收醉汉的病区。守夜的杂役说，带铁栏那间屋里的先生一口水也不肯碰；他把灯捻得很低，灯一亮，那人就对着墙说话。
  sor_juana_mexico_city:
    name: 送走的最后几本书
    place: 墨西哥城
    figure: 胡安娜修女
    story: 1690 年，普埃布拉主教未经她同意，把她批评一篇布道的文章刊印出来，题为《雅典娜信札》，附信署名“菲洛特亚修女”。她的《答菲洛特亚修女》署 1691 年 3 月 1 日。1693 年她卖掉了书和乐器，1694 年重申誓愿。1695 年 4 月 17 日，她在照顾染疫的修女之后，死于圣杰罗姆修道院。
    relic: 一支羽毛笔
    relic_desc: 一支笔尖裂开的羽毛笔，旁边是空书架。
    points:
      p1: 疫病传开的那几周，帮她撑住病房，护住对病倒修女的照料
      p2: 救下一位染疫病倒的修女
      p3: 她病倒以后，治好她
    points_fail:
      p1: 病房里的人手一个个倒下，照料断了，这条分支里她照顾病倒的修女这件事没能像史实那样做下去。
      p2: 她没熬过去，照史实成了那几个月里去世的修女之一，这条分支里病房又空了一张床。
      p3: 照史实，她 4 月 17 日去世。这条分支里，她没有熬过四月。
    shift:
      p1:
        was: 1695 年春，墨西哥城疫病流行，胡安娜修女一直照顾病倒的修女。
      p2:
        was: 1695 年春的疫病里，她所在的修道院有多位修女病逝。
        now: 那位修女熬过了四月，病好以后又回到了病房帮忙。
      p3:
        was: 1695 年 4 月 17 日，胡安娜修女在照顾病倒的修女之后去世。
        now: '{staff}用带来的药治好了她，她熬过了四月。后来几年，她在修道院里又写下了一些东西，写了什么，这一趟的记录里没有。'
    vignettes:
      kitchen: '{staff}看着一枚蛋在热油里凝住，在糖浆里却散开，在一张碎纸上记下哪口锅是哪样，也不为给谁看。'
      shelf: '{staff}擦净屋里的空书架，木板上还看得出书立过的地方，一块块颜色深些，没去动它。'
      bells: '{staff}在院子里数着报丧的钟声，有一晚响了两回，数完又回去看着水壶。'
  mary_anning_lyme_regis:
    name: 崖壁里的骨头
    place: 莱姆里吉斯
    figure: 玛丽·安宁
    story: 约 1811 年，玛丽·安宁的哥哥约瑟夫在莱姆里吉斯的海崖里找到一个鱼龙头骨，1812 年 11 月，玛丽把五米来长的骨架挖了出来。1823 年 12 月，她找到第一具完整的蛇颈龙骨架；1828 年 12 月，又找到英格兰发现的第一具翼龙。她 1847 年去世，年仅 47 岁，一直手头拮据；写她那些发现的论文里，很少提到她的名字。
    relic: 一枚菊石
    relic_desc: 一枚从蓝色里亚斯岩里敲出来的螺旋形化石。
    points:
      p1: 12 月 10 日，护住崖下那具蛇颈龙，赶在塌方和回潮之前把它完整取出
      p2: 帮她把那条长颈一节一节数清、画准，让寄往伦敦的草图经得起查问
      p3: 让她在生前知道，这些骨头以后会写着她的名字
    points_fail:
      p1: 那具骨架被回潮卷走了一半，这条分支里没有第一具完整的蛇颈龙。
      p2: 这条分支里，12 月 26 日的草图照原样寄出，颈椎上没有多一道核对的标记。
      p3: 这条分支里，她照旧不知道自己会被记住，没有人在那个冬天告诉过她。
    shift:
      p1:
        was: 1823 年 12 月，玛丽·安宁在崖下取出一整具骨架，脖子比身子还长。
      p2:
        was: 1823 年 12 月 26 日，她把蛇颈龙的草图照原样寄往伦敦。
        now: 寄到伦敦的草图上每一节颈椎都标了号，后来那场疑心来时，图上已经有了回答。
      p3:
        was: 1847 年玛丽·安宁去世，四十七岁，手头一直拮据，写她发现的论文很少提她的名字。
        now: 那个冬天有人告诉过她，她挖出的骨头以后会在伦敦的博物馆里写着她的名字，莱姆里吉斯的海边会立起她的像。
    vignettes:
      stone: '{staff}顺着一道裂缝描过骨架的颈部，一直描到它离开骨头的地方，在那里抬起了笔。'
      vertebrae: '{staff}从另一头数颈骨，两边数不到一起的地方，留了一个括号，没有顺手添上一块骨头。'
      pose: '{staff}把抄图转来转去，直到不用人指也能找到头部，又在下面写上是谁发现的。'
  hertz_bonn:
    name: 最后一个学期
    place: 波恩
    figure: 海因里希·赫兹
    story: 1892 年初起，赫兹的鼻子和喉咙反复剧痛，有时痛得无法工作。1893 年他一边做了几次手术，一边回到波恩大学讲课，写完了《力学原理》。1894 年 1 月 1 日，他在波恩去世，年仅三十六岁，书在他死后出版。
    relic: 一个火花隙
    relic_desc: 他做实验用过的一个小铜火花隙。
    points:
      p1: 病再重下去之前，治好他鼻子和颌骨里久治不愈的病，救下他
    points_fail:
      p1: 1894 年 1 月 1 日，他照史实在波恩去世，年仅三十六岁。
    shift:
      p1:
        was: 1894 年 1 月 1 日，赫兹在波恩去世，年仅三十六岁。1892 年起他的鼻子和喉咙反复剧痛，做过几次手术也没有治好。
        now: 他的病治好了，痛也止住了，接着在波恩讲课。
        who: hertz_bonn
        bio: 这条时间线里，赫兹在 1893 年底治好了缠身两年的病，在波恩活过了 1894 年。
    vignettes:
      repeat: 帮工瞥一眼就要写「无」。你把接收环放回原处，请他透过镜头再看一遍。第二眼见到一点短促火花。你把第一条改成「未看清」。第一回究竟有没有，收队时仍无法断定。
      signal: 你知道后来的装置会把信号送到更远处。帮工问这么一点火花能不能送一句话。你在他的记录上各留一栏，一栏记认出的火花，一栏记能重现的变化。收队前，只来得及填第一栏。
      gap: 你拿着记录守在台边，让帮工报自己看清的东西。有一格还空着，因为两人都没看准缝上发生了什么。你带回这个没乱填的空格，帮工单上还有几回要试。
  kepler_leonberg:
    name: 证人亲眼看见的事
    place: 莱昂贝格
    figure: 约翰内斯·开普勒
    story: 1620 年，莱昂贝格的邻居指控天文学家约翰内斯·开普勒的母亲卡塔琳娜，案子已拖了五年。8 月 7 日，她在霍伊马登的女儿家中被捕，后来从莱昂贝格转押到居格林根，看守费用由家里承担。那年 9 月，约翰内斯从林茨回来为母亲辩护。审理一拖再拖。1621 年秋，卡塔琳娜获释，距被捕已过了一年多。
    relic: 一页申辩书抄本
    relic_desc: 一页誊清的书面申辩，页边改过一个日期。
    points:
      p1: 卡塔琳娜被带到莱昂贝格以后，请保管申辩书的人立刻另抄并交存一份，护住书面申辩继续进入程序
      p2: 让家人整理原证词，逐项区分证人亲眼所见、由人转述和后来附上的推断
      p3: 给居格林根牢里戴着锁链的卡塔琳娜送进厚衣被和热饭，让七十三岁的她熬过这个冬天
    points_fail:
      p1: 家里能找到的那份申辩书没能转交。案卷只剩指控人的陈述，事务所因同步失败召回员工。
      p2: 三种说法抄在同一栏。送进案卷以后，辩护人还要再追问最早是谁说的。
      p3: 这条分支里，她照史实戴着锁链过冬，身边只有日夜看守的两个人，看守的费用还要家里出。
    shift:
      p1:
        was: 卡塔琳娜于 1620 年 8 月被捕。约翰内斯·开普勒随后经律师坚持把程序落实在书面记录上。
      p2:
        was: 审理留下证词及书面辩护。辩方逐项回应并反对把猜测当作说法之间的因果。
        now: 送给律师的抄本可以按栏核查。辩护人先指出证人未能亲验的数项。
      p3:
        was: 1620 年 8 月 7 日卡塔琳娜·开普勒被捕，押到居格林根，戴着锁链关押十四个月，两人日夜看守，费用由她和家人承担；1621 年秋获释，约半年后去世。
        now: '{staff}替家里打点好看守，那个冬天她有厚被和热饭，锁链没有卸下，身子却比历史上撑得住些。'
        who: katharina_kepler
        bio: 这条时间线里，卡塔琳娜·开普勒在居格林根牢里的第一个冬天有厚被和热饭，1621 年秋获释时身子比历史上硬朗些。
    vignettes:
      soup: 9 月 13 日，{staff}替狱卒的妻子端一锅大麦汤上居格林根的小巷。她说不用看人，看碗就知道是哪个犯人：那个老太太的碗总是刮得干干净净送回来，还要抱怨一句盐放少了。
      hearing: 10 月 2 日，{staff}帮律师的文书把两捆案卷抬到居格林根的市政厅去开庭。到了门口，说是又改期了。文书把两捆纸放在台阶上，说这条路它们走了这么多回，早该自己认得了。
      frost: 十一月中，{staff}搭一辆运货马车从莱昂贝格去居格林根。车夫说这条路最难走的是进察伯河谷那一段；一上冻，车轮就会唱，他听音高就知道还剩多远。
  pushkin_st_petersburg:
    name: 门牌号尚未出现的那户人家
    place: 圣彼得堡
    figure: 亚历山大·普希金
    story: 1836 年到 1837 年，亚历山大·普希金住在莫伊卡河畔、科纽申内桥旁沃尔孔斯卡娅公爵夫人的房子里。旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，旧历 1 月 29 日，也就是新历 2 月 10 日在那里去世。他葬在米哈伊洛夫斯科耶附近的圣山修道院，在他母亲身旁。
    relic: 一本诗集
    relic_desc: 一本小书，某首诗里夹着一片压干的叶子。
    points:
      p1: 帮他把越欠越多的债理出头绪，让妻子和孩子的日子不再悬着
      p2: 中弹以后，护住从黑溪回城那一路，让他活着回到莫伊卡河畔的寓所
      p3: 治好他腹部的枪伤，压住伤口里的感染，让他活下来
    points_fail:
      p1: 这条分支里，那个冬天的欠单照旧压在书桌上，没有人替他理过。
      p2: 他没能撑到莫伊卡河畔，这条分支里没有寓所里的那两天。
      p3: 2 月 10 日下午，他照史实在寓所里去世，这条分支里也没能多留他一天。
    shift:
      p1:
        was: 1837 年 2 月普希金去世时欠下大笔债务，后来由尼古拉一世替他还清。
        now: 欠账理成了一张单子，哪笔先还、哪笔能缓，家里心里有了数。
      p2:
        was: 1837 年 2 月 8 日决斗中弹以后，普希金被送回莫伊卡河畔的寓所。
      p3:
        was: 1837 年 2 月 10 日他在寓所里死于腹膜炎，三十七岁，留下妻子和四个孩子。
        now: '{staff}带去的药压住了伤口的感染，二月过去时他还在莫伊卡河畔养伤。他又写了几年，《同时代人》仍在他手里办下去。'
    vignettes:
      number: '{staff}差点把一块博物馆门牌上的号码告诉来访的人，可那块牌子这时还没有，便划掉数字，在纸条上画了那座桥。'
      queue: '{staff}把同一句回答抄在几张纸条上，门厅里等着的人看了就不用再问。'
      river: '{staff}跟着门房从桥边沿莫伊卡河走一遍，数清指路时该说的几个转弯。'
  chekhov_badenweiler:
    name: 寄往弗里德里克别墅的回信
    place: 巴登魏勒
    figure: 安东·契诃夫
    story: 1904 年 6 月，四十四岁、肺结核已经很重的安东·契诃夫，和妻子奥尔加·克尼佩尔来到黑森林的疗养地巴登魏勒。他们先住罗马浴旅馆，后住弗里德里克别墅，最后搬进邮局隔壁的索默旅馆。他往家里写的信都很轻快，七月里还托朋友打听哪一班轮船能走海路送他们回俄国。7 月 15 日凌晨，他在那里去世。
    relic: 一副夹鼻眼镜
    relic_desc: 一副系着细绳的小圆眼镜。
    points:
      p1: 契诃夫刚安顿下来时，把他写给妹妹玛丽娅的回信地址逐字核对，趁他还有力气写完，把信交出去
      p2: 用他 7 月 11 日列在信里的问题请熟悉航线的人发一封短电报，让他在巴登魏勒得到想问的返程消息
      p3: 治好他的肺结核，让他和奥尔加一起动身回俄国
    points_fail:
      p1: 行李还按上一处旅馆收放，写字桌上的信封被一并带走。玛丽娅没有收到他从别墅寄出的地址，事务所因同步失败召回员工。
      p2: 他关于船期、舱位和航行天数的问题随普通信寄出。等回信的日子里，手边仍没有一份可以读的答复。
      p3: 7 月 15 日凌晨，契诃夫在巴登魏勒去世，年仅四十四岁。
    shift:
      p1:
        was: 1904 年 6 月 25 日（俄历 6 月 12 日），契诃夫从巴登魏勒写信给玛丽娅，写明弗里德里克别墅的详细回信地址。
      p2:
        was: 1904 年 7 月 11 日，契诃夫写信给罗索利莫询问由马赛乘船去敖德萨的细节。他于 7 月 15 日在巴登魏勒去世，未能作这趟旅行。
        now: 负责航线的人回电报来，把开船日、路程和两人可用的舱位写得清楚。契诃夫和妻子在旅馆把这张纸读完，也商量了若能动身最想选哪一班。
      p3:
        was: 1904 年 7 月 15 日，契诃夫在巴登魏勒因肺结核去世，终年四十四岁。
        now: 他的肺病好了，夏天过后和奥尔加坐船回到俄国。此后他又写了好些年，也回到莫斯科艺术剧院看排练。
        who: chekhov_badenweiler
        bio: 契诃夫在巴登魏勒治好了肺结核，1904 年秋天回到俄国，此后继续写小说和戏剧多年。
    vignettes:
      garden: 6 月 27 日，{staff}帮弗里德里克别墅的女佣把一张躺椅跟着太阳在花园里挪位置。她说这里的太阳七点整离开草坪，这家人开晚饭看的是太阳，不是门厅里那座钟。
      post: 7 月 7 日，{staff}坐在索默旅馆隔壁邮局门口的长凳上。邮差说，夏天巴登魏勒写信最多的是俄国人，写得最短的是英国人；俄国人的信封他掂一掂，就知道够不够邮票。
      ice: 7 月 10 日热得最凶，{staff}帮索默旅馆的门房用麻袋从地窖往楼上扛一块冰。门房说黑森林二十年没见过这样的七月，米尔海姆来的卖冰人都开始按楼梯级数算钱了。
  puccini_brussels:
    name: 没写完的二重唱
    place: 布鲁塞尔
    figure: 贾科莫·普契尼
    story: 1924 年 11 月，普契尼到布鲁塞尔治病，《图兰朵》的结尾还没写完。有一页稿，乐句写到一半停住了。另一页上列着几样乐器。后来，弗兰科·阿尔法诺要从这些零散的音符里接出一段乐团能演奏的音乐。
    relic: 二重唱草稿
    relic_desc: 一张五线谱纸，没写完的乐句旁留着铅笔字。
    points:
      p1: 趁普契尼还能审稿，帮他从末场二重唱的两份草稿里标出自己想留的一种写法
      p2: 用照护经验减轻普契尼在最后一夜的病痛
    points_fail:
      p1: 两张草稿照旧分开搁着。接手的人还得自己猜他想用哪一种。
      p2: 这一夜过去，床边的椅子还是空的，病痛也没能缓下来。
    shift:
      p1:
        was: 1924 年 11 月，末场二重唱仍是散页，阿尔法诺后来要从留下的草稿里找出接法。
        now: 普契尼在二重唱转调的地方标下自己想留的一种写法。接手的人从他标的这一处起笔。
      p2:
        was: 1924 年 11 月 24 日，普契尼在布鲁塞尔接受喉癌治疗，29 日在同一家诊所去世。
        now: '{staff}留在床边帮普契尼缓一缓。这一夜没有他想的那么疼，想叫人的时候，手也够得着床边。'
        who: puccini_brussels
        bio: 普契尼在布鲁塞尔度过了稍安稳的一夜。他把谱放下时，床边有人陪着。
    vignettes:
      divider: 抄谱人把两行铅笔谱并排摊在桌上。乍看几乎一样，{staff}用指尖顺着低声部走了一遍。一行兜回原处，另一行给后头留了地方。{staff}把两页都留下，等普契尼亲自看。
      future: '{staff}差点敲出自己在剧院听过的结尾。抄谱人从还没有收尾的一小节上抬头。{staff}把纸往回翻，请他从两人都认得的最后一个小节开始。'
      pin: 抄谱人腾出个桌角放杯子。{staff}把一张稿纸往里挪了挪。页脚一行空了大半的五线谱底下，挤着两个铅笔字。
  schumann_endenich:
    name: 换了调的曲子
    place: 恩德尼希
    figure: 罗伯特·舒曼
    story: 罗伯特·舒曼住在恩德尼希的那几年，留下过一份钢琴小曲的抄本，比出版的谱低了一个全音。1856 年 7 月，克拉拉·舒曼来波恩请求探视。客店里的莉娜把那首小曲抄了两份，怀疑起音低的那份抄错了。
    relic: 两个调的练习谱
    relic_desc: 两张虚构的练习谱，页首各写了一个调名。
    points:
      p1: 对照两份谱，写明为什么起音低了一个全音的那份也该留在谱夹里
      p2: 7 月 27 日在约定的时间前接到克拉拉，领她走对门，让探视如期发生
      p3: 7 月 29 日留在附近等消息，赶在罗伯特去世前把克拉拉带回床边
    points_fail:
      p1: 莉娜把起音较低的那份谱抽了出来。下一个翻开谱夹的人，只会看到原来出版的调。
      p2: 克拉拉在另一扇门前等过了探视时段。这次探视偏离原时间线，事务所召回员工。
      p3: 克拉拉回到恩德尼希时，罗伯特已经去世。
    shift:
      p1:
        was: 舒曼在恩德尼希期间亲笔抄写的《蝴蝶》第十首，把曲子从 C 大调移到了降 B 大调。
        now: 莉娜把两份练习谱留在同一个谱夹里，页首各写上调名。下一个弹它的人知道，两个起音都没抄错。
      p2:
        was: 7 月 23 日，布拉姆斯和里夏茨医生劝克拉拉再等一等。她在 27 日傍晚六到七点之间见到了罗伯特。
      p3:
        was: 7 月 29 日，克拉拉和布拉姆斯、约阿希姆到恩德尼希时，罗伯特已经去世。
        now: '{staff}在克拉拉回来的路上接到她，直接带她去了病房。罗伯特走之前，她握到了他的手。'
        who: schumann_endenich
        bio: 1856 年 7 月 29 日，罗伯特在恩德尼希去世时，克拉拉就在身旁。
    vignettes:
      key: 莉娜照着两张纸各弹一遍。第二小节还没完，她就从键盘上抬头看{staff}。手指明明停在另一个地方，她却知道接下来会响起哪几个音。
      envelope: 埃米尔答应，如果克拉拉还得等，他就替她递张折好的纸条。他问{staff}该先敲哪扇门。两人走到巷子对边，从那里刚好能看见两扇门。
      gift: 真正的手稿日后会交到舒曼的女儿玛丽手里。眼下，莉娜用两根纸条标记练习谱的开头。{staff}掀起琴盖时，其中一根已经滑到另一根的背后。
  nietzsche_turin:
    name: 纸背上的收件人
    place: 都灵
    figure: 弗里德里希·尼采
    story: 都灵寄来一封信，收信的是弗兰茨和伊达·奥弗贝克，尼采签的是狄俄尼索斯。弗兰茨赶到朋友的住处，见他在读自己改过的《尼采反对瓦格纳》校样。离开都灵前，得有人看看箱里除了校样，还该放些什么。
    relic: 一张留底的行李签
    relic_desc: 游戏时间线里留下的一张行李签副本，收件人写在纸背上。
    points:
      p1: 核准住处地址，1 月 8 日把奥弗贝克领到对的门前
      p2: 把改过的校样和私人信件分开登记，确保要交其中一包时不用拆另一包
    points_fail:
      p1: 奥弗贝克走错了住处。这次见面偏离原时间线，事务所召回员工。
      p2: 信和校样叠在一起包走。第一个来找校样的人，也会看到那些信上的名字。
    shift:
      p1:
        was: 尼采从都灵写信给奥弗贝克夫妇。弗兰茨·奥弗贝克于 1889 年 1 月 8 日在都灵找到尼采。
      p2:
        was: 奥弗贝克事后写信说，他赶到时，尼采正在看《尼采反对瓦格纳》的最后一份校样。
        now: 校样和信分作两包上路。奥弗贝克一眼就认得哪份是改过的校样，另一包仍然封着。
    vignettes:
      address: 彼得罗把狄俄尼索斯抄进了登记的去向栏。{staff}翻过纸签，指给他看收件人那一面。他在刚抄的字上划了一道，淡得还能认出原来写的是什么。
      privacy: 露琪亚请{staff}扶着包，她腾手裹好那叠信。楼梯上有人问信是谁的。她把纸签转向墙，才开口答话。
      stairs: '{staff}在楼梯平台听见翻纸的窸窣声。楼下有人敲门。彼得罗把空白行李签放在扶手上，等会儿回来还找得到。'
  sophie_germain_paris:
    name: 寄往柏林的论文
    place: 巴黎
    figure: 索菲·热尔曼
    story: 索菲·热尔曼与卡尔·弗里德里希·高斯通信讨论数论，起初署名勒布朗。1816 年，她凭弹性薄板振动研究获得法兰西科学院的奖。1829 年患病后，她仍继续工作。柏林克雷勒主编的杂志第七卷以她的本名刊出了她论曲面曲率的论文。1831 年 6 月 27 日，她在巴黎去世。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借来的名字写给高斯的信。
    points:
      p1: 在她病中护住那篇论曲面曲率的论文，让它寄到柏林克雷勒的杂志
      p2: 减轻她最后几个月在巴黎的癌痛
      p3: 让热尔曼生前知道，高斯在为她向哥廷根大学争取名誉博士学位
    points_fail:
      p1: 论文没写完，留在她的书桌上，1831 年那一卷里没有它。这条分支与历史脱节，员工被送回。
      p2: 没人替她压住疼痛，这条分支里她最后几个月和历史上一样难熬。
      p3: 消息没送到她手里，她到去世都不知道高斯为她做了什么。
    shift:
      p1:
        was: 1831 年，热尔曼论曲面曲率的论文刊于克雷勒杂志第七卷，同年她去世。
      p2:
        was: 约 1829 年起热尔曼患乳腺癌，仍坚持工作，1831 年 6 月 27 日在巴黎去世。
        now: '{staff}用现代的药压住疼痛，在最难熬的时候陪着她。她最后几个月少受了些苦，还能坐到书桌前。'
      p3:
        was: 高斯曾推动哥廷根大学授予热尔曼名誉博士学位，1831 年 6 月 27 日她去世时，学位尚未授出。
        now: '{staff}把高斯所做的事带给她。热尔曼得知，那所她从没能进去读书的大学要给她这份荣誉。'
        who: sophie_germain_paris
        bio: 这条时间线里，热尔曼生前得知高斯推荐她获得哥廷根的名誉博士学位。学位本身仍然来得太迟。
    vignettes:
      water: 3 月 7 日，{staff}帮送水的人把两桶塞纳河水扛上萨伏依街一座楼的五层。送水人一边数台阶一边喘，说巴黎的楼一年比一年高，他的工钱还是按桶算，不按层算。
      quai: 四月中旬，{staff}在河岸的旧书摊前翻一本旧历书。摊主说这一摞是从同一户人家收来的，页边记满了算式，他看不懂，只好论分量卖。
      wash: 五月下旬，{staff}在河边的洗衣船上帮洗衣妇拧床单。她说今年春天塞纳河涨了又退，船跟着一高一低，她的腰也跟着一高一低。
  bizet_paris:
    name: 《卡门》的那一年
    place: 巴黎
    figure: 乔治·比才
    story: 《卡门》排练到最后几周，乐队说有几段奏不了，合唱不肯边唱边演。1875 年 3 月 3 日它在巴黎喜歌剧院首演，报刊多是冷评，比才认定它失败了。5 月底他在布日瓦尔下塞纳河游泳，随后病倒，6 月 3 日去世，三十六岁。
    relic: 一把折扇
    relic_desc: 一把来自池座的彩绘纸扇。
    points:
      p1: 乐队说几段奏不了、合唱不肯边唱边演时，陪他们练下来，护住 3 月 3 日的首演
      p2: 首演遭冷评后比才消沉，让他知道《卡门》会在各地的剧院一直演下去
      p3: 布日瓦尔下河游泳后的高烧烧到心上之前治好他，救下三十六岁的比才
    points_fail:
      p1: 排练卡住，剧院 3 月 3 日拉不开幕。分支脱节，事务所因同步失败召回员工。
      p2: 这条分支里比才一直以为《卡门》失败了，消沉着过完这个春天。
      p3: 这条分支里比才仍在 6 月 3 日凌晨死于布日瓦尔，三十六岁。
    shift:
      p1:
        was: 1875 年冬，《卡门》排练时乐队说有几段奏不了，合唱不愿边唱边走动。3 月 3 日它在巴黎喜歌剧院首演。
      p2:
        was: 1875 年 3 月 3 日《卡门》首演，报刊多是恶评，比才认定这部戏失败了，整个春天情绪低落。
        now: 三月底{staff}告诉比才，这部戏日后会在许多国家的剧院上演。他照常去剧院看演出，这个春天对他轻了些。
      p3:
        was: 1875 年 5 月底，比才在布日瓦尔下塞纳河游泳后发起高烧，6 月 1 日心脏病发作，6 月 3 日凌晨去世，三十六岁。
        now: 六月的高烧退了，比才在布日瓦尔养完这个夏天。秋天他去维也纳，看《卡门》在宫廷歌剧院上演，此后又为剧院写了许多年。
        who: bizet_paris
        bio: 比才熬过了 1875 年夏天的病，那年秋天看到《卡门》在维也纳上演，之后又写了多年歌剧。
    vignettes:
      future: 你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。
      label: 帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。
      seat: 你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。
  modigliani_paris:
    name: 肖像背后的一张纸签
    place: 巴黎
    figure: 阿梅迪奥·莫迪利亚尼
    story: 1919 年 5 月底，阿梅迪奥·莫迪利亚尼和让娜·埃比泰纳带着前一年 11 月出生的女儿，从尼斯回到巴黎。他的结核越来越重，到秋天已没有力气作画。1920 年 1 月 24 日，他因结核性脑膜炎在巴黎慈善医院去世，三十五岁。两天后，怀孕八个月的让娜在父母家去世。1 月 27 日的葬礼，是画家朋友们凑钱办成的。两年前，他生前唯一一次个展销路惨淡。
    relic: 一截炭条
    relic_desc: 一截能把手指染黑的炭条。
    points:
      p1: 趁他还清醒，让他知道他画的这些人以后会被很多人记住
      p2: 他在画室里病重、几天没人来问的时候，护住他被送进慈善医院的那一程
      p3: 在慈善医院里，治好他的结核性脑膜炎
      p4: 他去世以后的那几天，陪住怀孕八个月的让娜·埃比泰纳，让她和腹中的孩子留下来
    points_fail:
      p1: 这条分支里，唯一那场个展销路惨淡后，没人告诉过他，那些肖像以后会去哪里。
      p2: 这条分支里没有人及时进门，他没能被送到慈善医院，与史实脱节，事务所召回员工。
      p3: 这条分支里病照旧发展，1 月 24 日他在慈善医院去世，三十五岁。
      p4: 这条分支里，1 月 26 日照史实发生，让娜和腹中的孩子没有留下来。
    shift:
      p1:
        was: 1917 年 12 月 3 日，警方干预了莫迪利亚尼生前唯一一次个展。展览销路惨淡。
        now: '{staff}在他病倒以前告诉他，他画的这些人以后会挂进世界各地的美术馆。'
      p2:
        was: 1920 年 1 月，莫迪利亚尼病重，被送进巴黎慈善医院，1 月 24 日在那里去世。
      p3:
        was: 1920 年 1 月 24 日，莫迪利亚尼因结核性脑膜炎在巴黎慈善医院去世，三十五岁。
        now: '{staff}带去的药治好了他的病，他出了院，回到画室。'
        who: modigliani_paris
        bio: 莫迪利亚尼在 1920 年冬天病愈，又画了许多年，画的仍是身边的人。
      p4:
        was: 1920 年 1 月 26 日，莫迪利亚尼去世两天后，怀孕八个月的让娜·埃比泰纳在父母家中去世，留下十四个月大的女儿。
        now: '{staff}那几天一直守在她身边。这条时间线里，让娜生下了孩子，带着一儿一女长大，后来又拿起了画笔。'
        who: jeanne_hebuterne
        bio: 让娜·埃比泰纳在 1920 年冬天活了下来，生下第二个孩子，带大两个孩子，并继续画画。
    vignettes:
      coal: 1 月 10 日，{staff}替街口卖煤的人把一袋煤扛上楼。他的铺子里柴、煤、酒在同一个柜台上卖。他说今年冬天蒙帕纳斯没人买整袋，都买半袋，另外半袋拿口头答应来付。
      saucers: 二月初，{staff}帮蒙帕纳斯一家咖啡馆的伙计收桌子。每上一杯就垫一只小碟，结账时数碟子。他朝最里头那张桌努努嘴：画家们在那儿把碟子摞成塔，钱用完了就拿画来抵。
      mimosa: 三月初，{staff}帮市场上卖花的女人解开头一批含羞草。她说这是夜车从南边运上来的，三月要是冷，巴黎就只有这一点黄。
  boole_ballintemple:
    name: 湿衣服与一堂课
    place: 科克巴林滕普尔
    figure: 乔治·布尔
    story: 科克在下雨，乔治·布尔还有一堂课要上。一名学生拿着《思维规律研究》里的习题，还没想通第二遍该怎么选。城的另一头，布尔还没写完的微分方程书里，一张表以后得重算，只因为公式里的一个符号。
    relic: 一页逻辑演算
    relic_desc: 一张课堂习题纸，演示照同一条件筛选两次会得到什么。
    points:
      p1: 大雨中从家出门前，把要用的讲义干干地送到学院，护住布尔当天的课
      p2: 拿公式和算出来的表格对照，把可能有问题的符号标出来，留给下一位核稿的人
      p3: 找人来接一班晚间照护，让守在布尔床边的家人歇一会儿
    points_fail:
      p1: 讲义淋湿且没人有备份，当天课没能开讲，事务所因同步失败召回员工。
      p2: 表格装进文件夹，公式还没核过。以后还得塞普顿自己查出错处。
      p3: 晚上没人替班。守在床边的人只有放下灯的时候才离开一小会儿。
    shift:
      p1:
        was: 科克学院档案记布尔在 1864 年 11 月 24 日的大雨里从家赶去教学。
      p2:
        was: 布尔于 1864 年 12 月去世，托德亨特后来整理了补编。编者序记有一张表因稿内符号写错而需重新算过。
        now: 编辑一打开文件夹，就能顺着纸签翻到公式。塞普顿可以从那个符号开始核算。
      p3:
        was: 1864 年 12 月 8 日，布尔因胸膜肺炎在巴林滕普尔的家中去世。
        now: '{staff}找到人来坐一班。家人留着灯，先睡了几个钟头，再回来接替。'
    vignettes:
      repeat: '{staff}请学生挑出偶数，再拿着手里的纸条挑一遍。学生想找一张放回桌上，手里却一张都不用放。'
      border: 学生要抄一排数字，{staff}问第一个是怎么算来的。他先用笔尖划了一道线连回公式，再往下抄。
      example: 学生把做完的习题压在书下。页边露出一小截纸签，刚好够手指捏住。
  wallace_ternate:
    name: 来自特尔纳特的论文
    place: 特尔纳特
    figure: 阿尔弗雷德·拉塞尔·华莱士
    story: 1858 年 2 月，阿尔弗雷德·拉塞尔·华莱士在摩鹿加群岛发烧，退烧后写了一篇论文，谈变种怎样偏离原型。论文落款是「特尔纳特，1858 年 2 月」。3 月 25 日，他从特尔纳特乘船出发，同行的有年轻猎手朱马特，一行人抵达新几内亚海岸的多雷。论文寄到了英格兰。7 月 1 日，他与达尔文的文章在伦敦一同宣读，两位作者都不在场。
    relic: 针盒里的一只甲虫
    relic_desc: 一只收集来的甲虫，放在小锡盒里。
    points:
      p1: 疟疾发作的那几天，护住那篇论文写完
      p2: 治好他在多雷伤的那只脚踝，不让它溃烂
      p3: 救下猎手朱马特，治好他的高烧和痢疾
    points_fail:
      p1: 烧一直没退下去，二月里稿子没有写完，邮船带走的信里没有它，这条分支里 7 月 1 日的林奈学会没有这篇论文。
      p2: 伤口照史实溃了，他在小屋里拄着拐坐了一个多月，这条分支里多雷林子里那些虫子还是只有仆人替他去捉。
      p3: 6 月 26 日朱马特照史实病逝，这条分支里七月离开多雷的船上少了他。
    shift:
      p1:
        was: 1858 年 2 月，华莱士疟疾稍好便提笔写成论文，稿末落款特尔纳特。
      p2:
        was: 1858 年 5 月，华莱士在多雷伤了脚踝，伤口溃成溃疡，一个多月下不了地。
        now: 伤口没有溃，汽船到港那些天他照旧每天进林子。
      p3:
        was: 1858 年 6 月 26 日，十八岁上下的朱马特在多雷病逝，华莱士写他是个安静的小伙子，活干得踏实。
        now: '{staff}守着他退了烧、止住了病，七月底离开多雷时，他也在船上。'
    vignettes:
      places: '{staff}抄写当天鸟类标本的签条，在每张旁边写上岛名，这一抽屉皮子没有采集人在旁边也读得懂。'
      claim: 两座岛上的甲虫长得很像，{staff}把一盘甲虫分成两排，中间留出空隙，没人吩咐。
      mail: '{staff}把一封长信的稿页包进油纸，打了个双结，像水手捆海图那样。'
  hooke_london:
    name: 实验的管理人
    place: 伦敦
    figure: 罗伯特·胡克
    story: 有人翻出胡克的《显微图谱》，照着图版描软木里的小格。描着描着，格子齐得像蜂巢，原图却没那么整齐。屋里还放着几捆讲稿和实验记录。等几年后别人来翻，也得分清哪一页本来是空的，哪一页是真的缺了。
    relic: 一幅跳蚤的图
    relic_desc: 《显微图谱》里那幅折页跳蚤版画的摹本。
    points:
      p1: 挪动纸堆时把讲稿留在一起，让沃勒日后仍能找齐要入书的稿子
      p2: 给讲稿以外的纸捆另留一张目录，让后来的编者有题名可查
      p3: 趁胡克还看得到那张描图，把它拿给他看，问哪几处该留着断线
    points_fail:
      p1: 一捆讲稿跟零散纸件一道运走。沃勒后来凑不齐汇编所需的纸页，事务所召回员工。
      p2: 下一个编者看得出哪些稿印了出来，目录却没告诉他其他的稿在哪里。
      p3: 描图夹回书里，读者已经把断线都接上了，也没来得及问。
    shift:
      p1:
        was: 胡克 1703 年去世。由理查德·沃勒整理的遗著汇编于 1705 年刊行。
      p2:
        was: 沃勒的汇编只保存部分遗稿。胡克的部分日记及其他遗留文献经另一些编辑才陆续出版。
        now: 箱里多了一张目录。下次有人来找没印出来的实验记录，可以先报出纸捆的题名。
      p3:
        was: 胡克在《显微图谱》里把软木的小孔比作蜂巢，同时指出它们的形状并不规整。
        now: '{staff}把描图和旧版画摊在一起。胡克指给读者看，哪里开始就对不上了。那两道断开的线，他没有再补。'
    vignettes:
      edge: 读者沿着一格描了两条边，又顺手补上原图里没有的第三条。{staff}把描图举到窗前。纸上最直的那道线，恰好是补上去的。
      analogy: '{staff}请读者找一个塞不进页顶那个蜂巢的格子。两人不约而同指向同一条歪歪的边。'
      plate: 读者再揭开一页折纸，一只跳蚤差点占满整张桌。{staff}按着一个角，等读者腾手挪开墨水。
  leavitt_cambridge_ma:
    name: 星星的一条规则
    place: 马萨诸塞州剑桥
    figure: 亨丽埃塔·勒维特
    story: 1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。
    relic: 一块玻璃底片
    relic_desc: 一块布满细小星点的照相底片。
    points:
      p1: 排印前帮勒维特把暗星观测与玻璃底片对上，护住二十五颗变星的周期表
      p2: 用通报里留下的定标难题争取观测时间，让勒维特本人参与下一步
    points_fail:
      p1: 错号让排印人员删去无法查对的几行，二十五颗星的周期表没有发表。行程同步失败，员工被召回。
      p2: 论文留下了亮度与周期的关系，给它定出绝对尺度的工作要由外地的研究者接手。
    shift:
      p1:
        was: 1912 年 3 月 3 日，哈佛天文台第 173 号通报刊登了勒维特整理的二十五颗小麦哲伦云变星周期。
      p2:
        was: 1913 年，赫茨普龙用了银河系中的造父变星为勒维特的关系式定标。
        now: '{staff}替勒维特整理一份可供合作观测的名单，天文台给她留出时间审阅后来的量测。她能跟合作者一起核对定标用的样本。'
        who: leavitt_cambridge_ma
        bio: 勒维特继续做变星的亮度研究，并参与将自己的关系式用于测量距离。她给后来的定标留有自己的观测说明。
    vignettes:
      rank: 你按周期给表格排序，发现一行丢了标号。读表人在图上的点被挪动前找回了对应的星号。
      distance: 你问近一点的星是不是光看起来就更亮。读表人把手指按在「小麦哲伦云」的标题上，你把为什么选这一组来比记在图旁。
      period: 读表人先报亮度。你再问周期，把两个数一起记，直到最后一个点也画上去。
  bessie_coleman_jacksonville:
    name: 起飞之前，她的姓名
    place: 杰克逊维尔
    figure: 贝茜·科尔曼
    story: 贝茜·科尔曼于1921年6月15日在法国取得国际飞行执照。1926年4月30日，她在杰克逊维尔帕克森机场为五一活动试飞时遇难。
    relic: 一张有日期的样张
    relic_desc: 地面告示，完整排出了科尔曼的姓名。
    points:
      p1: 护住科尔曼的学校行程，别让赶着筹备试飞的人取消她和学生见面的时间
      p2: 趁学生还在问怎么学飞，帮科尔曼和老师约好一堂后续课
      p3: 趁她在佛罗里达巡回演讲筹款，帮科尔曼凑齐认捐，把她一直攒钱要办的黑人飞行学校办起来
      p4: 凭检查时发现的问题叫停帕克森机场的试飞，让科尔曼和飞行员留在地面
    points_fail:
      p1: 临时筹备挤掉了约好的到访，科尔曼赶不到学校，这条分支与史实脱节，员工当天被召回。
      p2: 孩子们问过学飞的事，散场时还没有老师答应接着教。
      p3: 讲座的钱一点点攒，这条分支里飞行学校仍只是个计划。
      p4: 旧飞机按原安排升空，科尔曼和驾驶员在试飞中遇难。
    shift:
      p1:
        was: 1926 年 4 月 29 日，科尔曼到杰克逊维尔的黑人公立学校拜访学生。
      p2:
        was: 1926 年 4 月 29 日，科尔曼进校拜访，次日试飞遇难。
        now: '{staff}请一位老师把课堂上的问题收齐，安排一堂课继续讲学飞的门槛。'
      p3:
        was: 1926 年科尔曼在佛罗里达巡回演讲和表演，为她要办的黑人飞行学校攒钱，写信告诉姐妹终于快攒够了；学校没办起来她就去世了。
        now: '{staff}帮她把杰克逊维尔听众的认捐记在同一张单子上。到五月，认下的钱已够租一块场地和一架教练机。'
      p4:
        was: 1926 年 4 月 30 日，科尔曼和驾驶员在帕克森机场的试飞事故中遇难。
        now: '{staff}请机务人员复核飞行操纵，发现故障后取消当天的试飞。科尔曼往后继续办面向黑人学生的航空讲座。'
        who: bessie_coleman_jacksonville
        bio: 科尔曼从杰克逊维尔回去后继续飞行，也继续筹办向黑人学生开放的飞行训练。
    vignettes:
      proof: 安少了一行，已经把飞行员的名字裁得只剩姓。你删掉两个吹捧词，给全名腾出位置。跑腿人来取时，她请他念全名，再把样张折好。有人问谁要飞，他可以直接说出名字。
      school: 刘易斯以为围观的人只想知道几点开场。有孩子在围栏边问，这位飞行员在哪儿学的。你告诉他执照是在哪儿发的，把最后一行留给这个可以复述的事实。他取走样张时，连日期也练着念了一遍。
      ground: 场边的人越来越多，你知道明天的告示不会再写这场表演。安问是不是这会儿就发。你留一份注明日期的样张，帮她把别的送到门口。你的行程在地面结束，观众还在往这儿来。
  scott_last_camp:
    name: 冰架上的帐篷
    place: 罗斯冰架
    figure: 罗伯特·法尔肯·斯科特
    story: 斯科特日记最后一则署于 1912 年 3 月 29 日。现存手稿记录了南极点归途上的最后营地。
    relic: 一本日记
    relic_desc: 一本用铅笔写的小日记，被冻得发硬。
    points:
      p1: 在燃油见底、人人力竭的三月，护住雪橇上的日记和比尔德莫尔冰川采回的岩石标本
      p2: 治好奥茨冻坏的双脚，让他跟得上队伍，不必在 3 月 16 日前后走出帐篷
      p3: 在 3 月 18 日之前保住斯科特的右脚，不让冻伤拖住整支队伍
      p4: 带三人冒着 3 月 21 日起的暴风雪，走完离一吨仓库的最后十一英里
    points_fail:
      p1: 标本被卸在冰架上，日记也没能留到最后一天。这条分支与历史脱节，员工被送回。
      p2: 他的脚一天比一天坏，这条分支里他照样在 3 月 16 日前后走进风雪，再没回来。
      p3: 右脚冻坏了，这条分支里和历史上一样，队伍越走越慢。
      p4: 暴风雪把帐篷困在原地，3 月 29 日以后日记再没有新的一页。
    shift:
      p1:
        was: 1912 年 3 月，回程燃油短缺，队伍仍把日记和采自比尔德莫尔冰川的舌羊齿化石留在雪橇上，11 月 12 日搜救队在帐篷旁找到它们。
      p2:
        was: 1912 年 3 月初奥茨双脚严重冻伤，越走越慢，3 月 16 日或 17 日他走出帐篷，再没回来。
        now: '{staff} 每晚给他焐脚、换干袜，冻伤没再坏下去。奥茨跟着雪橇走，到最后一个营地仍在队里。'
      p3:
        was: 1912 年 3 月 18 日，斯科特在日记里写右脚的脚趾几乎全冻坏了，此后队伍走得更慢。
        now: '{staff} 每次宿营都给他焐暖右脚、裹好。斯科特的脚保住了，队伍照原来的速度往北走。'
      p4:
        was: 1912 年 3 月 21 日起，暴风雪把斯科特、威尔逊和鲍尔斯困在离一吨仓库十一英里的帐篷里，日记最后一则署 3 月 29 日，搜救队 11 月 12 日找到帐篷。
        now: '{staff} 趁风势稍弱领着三人往北，把最后十一英里分成几段走完。他们在一吨仓库找到燃油和口粮，熬过了这场风雪。入冬之前，他们回到了埃文斯角。'
        who: scott_last_camp
        bio: 这条时间线里，斯科特和威尔逊、鲍尔斯从极点活着回到了埃文斯角。他回到英国，亲自整理了这次远征的日记和科学成果。
    vignettes:
      distance: 回到事务所，虚构书记员把一个数抄进已走路程一栏。你指出那是还没走完的距离。他在抄件入档前把数移了过去。
      blank: 回到事务所，书记员念到最后一个日期停了笔。你等他想好后面的空白该怎么标。他写下「记录到此为止」，才搁下笔。
      opening: 回到事务所，你翻开练习抄本，先读日期再读内容。书记员把同一日期写上封签，下一次还能按顺序找到这一页。
  mallory_everest:
    name: 最后一次被人看见
    place: 珠穆朗玛峰
    figure: 乔治·马洛里
    story: 马洛里在 1924 年远征中留下的信件记述了不同营地的状况和计划。马洛里与欧文的结局无法证明二人是否登顶。
    relic: 一把冰镐
    relic_desc: 一把朴素的木柄冰镐，镐头磨旧了。
    points:
      p1: 萨默维尔下山时喉头被堵住，帮他喘过这口气，护住他和诺顿那次冲顶平安收尾
      p2: 治好诺顿的雪盲
      p3: 把马洛里落在五号营地的指南针送到他手上
      p4: 劝回马洛里和欧文，或在他们下撤时接住，让两人活着回到北坳
    points_fail:
      p1: 萨默维尔在雪里坐下，再没有站起来。冲顶的两个人只回来一个，这条分支与历史脱了节，事务所召回员工。
      p2: 诺顿的眼睛疼得睁不开，接下来几天他什么也看不见。
      p3: 指南针还留在五号营地的帐篷里。6 月 8 日两人往上走时，身边没有它。
      p4: 6 月 8 日中午过后，奥德尔最后一次看见两人在山脊高处往上走。他们没有回来。
    shift:
      p1:
        was: 1924 年 6 月 4 日，诺顿和萨默维尔从六号营地出发，到达约 8570 米；下山时萨默维尔的喉头被冻坏的组织堵住，几乎窒息，咳出后两人回到营地。
      p2:
        was: 1924 年 6 月 4 日夜里，诺顿患上严重的雪盲，回到北坳后几乎看不见东西。
        now: 诺顿的眼睛第二天就消了肿，他看得见北坳上来来往往的人。
      p3:
        was: 1924 年 6 月 7 日，马洛里从六号营地托挑夫带条子给奥德尔，说指南针落在了五号营地的帐篷里，他们身边没有指南针。
        now: 6 月 8 日清早出发时，马洛里的指南针在他自己口袋里。
      p4:
        was: 1924 年 6 月 8 日，奥德尔最后看见马洛里和欧文在东北山脊高处向上攀登，两人再没有回来；1999 年马洛里的遗体在约 8160 米处被找到。
        now: 6 月 9 日两人下到北坳，冻伤了，但活着。马洛里回到英国，回到露丝和三个孩子身边。他们那天到了哪里，这条时间线也没有答案。
        who: mallory_everest
        bio: 1924 年他和欧文从珠峰活着下来。他回到妻子露丝和三个孩子身边，又活了许多年。
    vignettes:
      date: 虚构的送信人拿着来自两个营地的信，交接单上却只写一个日期。你请他各自看信头，两封信出发时便各带着自己的地名和日期。
      question: 送信人把预定出发念成了准会出发。你在信中说到天气的地方请他停一下。他再念这项计划时，连同那个条件一起说出来。
      wrap: 送信人在膝上分拣纸页，你替他把要带走的信封放在一旁。他可以另把营地清单收好，不用折进信里。
  fanny_mendelssohn_berlin:
    name: 用自己的名字印六首歌
    place: 柏林
    figure: 范妮·门德尔松·亨泽尔
    story: 范妮·亨泽尔的《六首歌曲》作品一号于 1846 年以她本人的名字出版。
    relic: 一页歌谱
    relic_desc: 一页手写的歌谱，署名范妮。
    points:
      p1: 在亨泽尔为排练忙碌时替她守住写谱的时间，让她完成最后一首歌
      p2: 让出版人带着校样来见亨泽尔，请她亲手确认三重奏交到读者手中的版本
      p3: 5 月 14 日排练中她突然发病时，当场认出是中风，救下她
    points_fail:
      p1: 排练占完了时间，最后的歌停在草稿。行程与史实脱节，员工被召回。
      p2: 三重奏直到她去世后才出版，作者没能亲自审定印本。
      p3: 她在钢琴旁发病，当天去世，年四十一岁。这条分支里星期日音乐会到此为止。
    shift:
      p1:
        was: 1847 年 4 月下旬，亨泽尔在日记中写到三重奏之后创作一度停滞，5 月去世前她完成了最后一首歌。
      p2:
        was: 1847 年 5 月 14 日亨泽尔去世，钢琴三重奏的初版直到 1850 年才问世。
        now: '{staff}请出版人提前带来可改动的校样。家人后来付印时带着她亲手定下的修订页。'
      p3:
        was: 1847 年 5 月 14 日，亨泽尔在家中排练弟弟费利克斯的康塔塔《第一个瓦尔普吉斯之夜》时中风，当天去世。
        now: '{staff}看出她发病，当即让她躺下，立刻请来医生。她恢复过来，又在柏林主持了许多年星期日音乐会，继续以自己的名字作曲出版。'
        who: fanny_mendelssohn_berlin
        bio: 亨泽尔挺过了 1847 年 5 月那次中风。她在柏林把星期日音乐会又办了许多年，继续以自己的名字出版作品。
    vignettes:
      cover: 虚构的歌手从中间翻开乐谱，问是谁写的。你找来散开的题名页放在旁边。封面上署的名字足够确定纸套上该写什么。等你把纸理齐，第一首已经唱完。
      forward: 你刚要说后来的收藏者会怎样找这六首歌，歌手指着散开的封面，问他们还找不找得到它。你请她把封面随下一份谱一起交出去。一位读者带着它走了，再往下的去向你够不着。
      order: 你对着目录把六首排好，歌手可以直接翻到要唱的那一首。你另记下一份顺序。等门一关，屋里再响起什么，你带不走。
  camille_claudel_paris:
    name: 同一步舞，两种裙摆
    place: 巴黎
    figure: 卡米耶·克洛岱尔
    story: 卡米耶·克洛岱尔在 1889 至 1893 年间构思了《华尔兹》。克洛岱尔博物馆登记了多个版本，其中一件青铜铸件标为 1905 年，也记述她怎样改动了衣褶。
    relic: 一只青铜手
    relic_desc: 一件小小的青铜手部习作。
    points:
      p1: 家里不把父亲的消息告诉她，赶在 3 月 3 日之前带她回维尔纳夫，见那个一直护着她的父亲最后一面
      p2: 3 月 10 日之前，治好她的病，让她不必在精神病院度过最后三十年
    points_fail:
      p1: 父亲去世、下葬，她都不知道，这条分支里她没有见到那个一直护着她的人。
      p2: 3 月 10 日照史实发生，这条分支里她再没有回到工作室。
    shift:
      p1:
        was: 1913 年 3 月 3 日，父亲路易-普罗斯佩·克洛岱尔在维尔纳夫去世，家里没有告诉卡米耶，她没有去送葬。
        now: 她在父亲去世前回到了维尔纳夫，见了他最后一面，也去送了葬。
      p2:
        was: 1913 年 3 月 10 日，卡米耶由家人申请送进维尔-埃夫拉尔精神病院，1914 年转到蒙德维尔格，此后再没有出来，1943 年 10 月 19 日在那里去世。
        now: '{staff}陪她过了那个春天，病一点点缓下来，她没有被送走。她留在巴黎的工作室里，又做了许多年雕塑。'
        who: camille_claudel_paris
        bio: IF 线里，卡米耶·克洛岱尔 1913 年春天病情好转，没有进精神病院，在巴黎接着做雕塑，晚年还办过自己的展览。
    shift_all: 她送走了父亲，病也好了，那年春天以后仍在自己的工作室里雕塑。
    vignettes:
      light: 你见过后来的博物馆陈列，直到绕着裙摆走一圈，才看见影子怎样转。装箱人正要在两张标签上写同一句，你在边角各添了一道不同的弧线。箱子要分头走，开箱的时候你一处也看不到。
      mark: 装箱人找来两张写着同一标题的纸签。趁箱盖还没合，你各补一项，衣褶收在哪儿。两项也都抄进自己的本子里。你在资料里读过的那笔大理石委托，终究没有成。
      crate: 装箱人伸手拿盖子时，你扶住包纸，没让它压上伸出的裙边。余下的纸上，你凭记忆描出一道弧。箱盖一扣，最后那一点还画得准不准，你再也对不上了。
  artemisia_florence:
    name: 学院里的第一位女性
    place: 佛罗伦萨
    figure: 阿尔泰米西娅·真蒂莱斯基
    story: 1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。
    relic: 一罐颜料
    relic_desc: 一小罐磨好的青金石蓝。
    points:
      p1: 赶在7月19日入会前，把阿尔泰米西娅署名的委托记录送到佛罗伦萨绘画艺术学院，让院方有据可查。
      p2: 逐笔对读《倾向的寓意》的预付款与交画账，让画家自己留一份能答复材料商的账单。
      p3: 请阿尔泰米西娅拿她自己的账与下一位委托方议定付料钱、交画和结清的日期，并在两份画约上写明由她收款。
    points_fail:
      p1: 送去的纸只有委托方的记号。院方查不到画是谁交的，推迟了表决。事务所因同步失败召回员工。
      p2: 预付款和别人的项目开支记在相邻行。材料商再问起时，阿尔泰米西娅只能重新借账翻查。
      p3: 双方急着开工，只把订金写在一张纸上。下次颜料商催款时，她仍得请委托人找原账。
    shift:
      p1:
        was: 1616年7月19日，阿尔泰米西娅·真蒂莱斯基获佛罗伦萨绘画艺术学院接纳。
      p2:
        was: 博纳罗蒂家族档案保存了这项委托的付款记录。阿尔泰米西娅也曾借助学院的法庭处理包括材料商欠款在内的案件。
        now: 她自己收起一份有日期的对账单。材料商再来时，她能从哪笔是买颜料、哪笔是委托预付款讲起。
      p3:
        was: 如今还能从博纳罗蒂家族档案的预付款记录及通信中看到她在佛罗伦萨如何筹措画资。
        now: 开头几次催付仍见于她的来信。此后谈新委托时，她会把供料和结清日期写在两份画约上，让材料商先按已约定的款项备货。
        who: artemisia_florence
        bio: 她为小米开朗琪罗·博纳罗蒂的宅邸绘制《倾向的寓意》，作品至今仍属建筑装饰的一部分。入会以后，她也可以向学院的法庭提出与画业有关的争议。
    vignettes:
      pose: 访客面对镜子，问哪种姿势看着自然。你问两种姿势各像在做什么。他选了手还能做自己的事的那一种。
      name: 一张习作只写了画中人的描述，没留画家的名字。你把纸翻过来，请访客在收进一摞图以前把两项都写上。
      mirror: 你挪了镜子，让访客不用扭身也能看见那个角度。他试坐一回，又自己调了一点，才开始画。
  buchner_zurich:
    name: 排练桌上的两份残稿
    place: 苏黎世
    figure: 格奥尔格·毕希纳
    story: 1836 年，二十三岁的格奥尔格·毕希纳流亡到苏黎世，在新办的大学讲课。1837 年 2 月 2 日他染上伤寒。未婚妻明娜·耶格勒从斯特拉斯堡赶来，到时他已病危，2 月 19 日去世，《沃伊采克》没有写完。
    relic: 一叠零散的场景稿
    relic_desc: 字迹局促的散页，没有固定的顺序。
    points:
      p1: 他发烧的头几天就往斯特拉斯堡送信，让明娜早几天赶到他身边
      p2: 拦下伤寒，治好他的病，让他活过这个二月
    points_fail:
      p1: 消息到得晚，明娜赶到苏黎世时，他已经病危。
      p2: 高烧一天天加重，2 月 19 日他在苏黎世去世，年仅二十三岁。
    shift:
      p1:
        was: 1837 年 2 月，未婚妻明娜从斯特拉斯堡赶到苏黎世时，他已病危，不久在她身边去世。
        now: 明娜早几天到了苏黎世，他还能和她说话的那些日子，她都在。
      p2:
        was: 1837 年 2 月 19 日，毕希纳在苏黎世死于伤寒，年仅二十三岁，《沃伊采克》没有写完。
        now: 他退了烧，春天回到大学讲台，接着教书、写作。
        who: buchner_zurich
        bio: 这条时间线里，毕希纳熬过了 1837 年苏黎世的那场伤寒，回到大学，接着教书、写作。
    vignettes:
      order: 试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。
      pause: 你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。
      gap: 纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。
  emily_bronte_haworth:
    name: 冬天的牧师住宅
    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。
    relic: 一条狗项圈
    relic_desc: 牧师住宅里那条大狗用过的旧皮项圈。
    points:
      p1: 在伦敦来函把几位贝尔的作品混起来时，帮哈沃思的姐妹从书信中理出能各自认领的作品
      p2: 发现初版里不同于原句的误字时，帮艾米莉留下逐条可查的勘误
      p3: 趁艾米莉还能核对人物说话的声音，请她定一份以后重印时可照用的方言校本
      p4: 劝艾米莉肯让医生近身，治好她在布兰韦尔葬礼后一天天加重的肺病
    points_fail:
      p1: 几份来函仍把书归到同一个笔名下，姐妹带不出能分开认领的文件。澄清落空，员工因同步失败被召回。
      p2: 下次排印的人只能从初版猜测哪些字本来就这样写，排字错误继续传下去。
      p3: 再版时只能由家人判断哪里读不顺，改字里分不清哪些是作者原意。
      p4: 整个秋天她拒绝所有医生，12 月 19 日在牧师住宅去世，这条分支里那个冬天照旧。
    shift:
      p1:
        was: 1848 年 7 月，夏洛蒂与安妮·勃朗特从哈沃思到伦敦，向出版人澄清几个贝尔笔名并非同一作者。
      p2:
        was: 1847 年版《呼啸山庄》留有排印错误，1850 年新版才作校订。
        now: '{staff}在艾米莉手边留一册可圈改的印本，再把她指出的误字抄成附有页码的清单。'
      p3:
        was: 1848 年艾米莉在哈沃思去世；1850 年的新版由夏洛蒂编辑，其中改动了部分方言拼写。
        now: '{staff}把方言页分开请艾米莉逐句审过，将她亲自核准的拼写和仍可改的排印错误分明标记。夏洛蒂后来再版时有了这份依据。'
        who: emily_bronte_haworth
        bio: 艾米莉的《呼啸山庄》留下一部她亲自核过方言的印本。后来的重印能够保留人物的原有说话方式。
      p4:
        was: 1848 年 12 月 19 日，艾米莉在霍沃斯的牧师住宅去世。病中她一直拒绝看医生，到去世当天才答应。
        now: '{staff}在十一月劝她让医生进了门，也带去了治肺病的药。她熬过了那个冬天，又在牧师住宅里住了许多年，照旧在荒原上散步、写作。'
        who: emily_bronte_haworth
        bio: 1848 年布兰韦尔葬礼后染上的那场病，艾米莉挺了过来。她继续住在霍沃斯，在荒原上散步、写作，又过了许多年。
    vignettes:
      witness: 读者以为讲故事的人什么都看见了。你问有一件事她是从哪儿知道的。他把那句话往回找，找到了先说这事的人。
      voices: 读者整页只用一个声音。你请他从内莉接过话头处再念。听的人这回听得出，故事什么时候交到了另一个人手上。
      mark: 你在换人讲述处夹了块纸。读者觉得后面一段同刚才抵触，便先翻回纸签在的地方。
  lili_boulanger_paris:
    name: 桌上摊着几份声部谱
    place: 梅齐
    figure: 莉莉·布朗热
    story: 莉莉·布朗热自幼多病。1918 年冬在塞纳河畔梅齐，她已虚弱得握不住笔，把最后一部作品口述给姐姐娜迪亚记下，编制是人声、弦乐四重奏、竖琴和管风琴。同年 3 月 15 日她在那里去世，二十四岁。
    relic: 一支铅笔
    relic_desc: 一支短铅笔，旁边是空白的五线谱纸。
    points:
      p1: 肠病把她耗尽之前把病治住，救下莉莉
    points_fail:
      p1: 病照史实拖垮了她，莉莉 3 月 15 日死在梅齐，二十四岁。
    shift:
      p1:
        was: 1918 年 3 月 15 日，自幼多病的莉莉·布朗热在塞纳河畔梅齐去世，二十四岁。
        now: 她的病治住了。那年春天她又能坐到桌前，自己把音符写下来。
        who: lili_boulanger_paris
        bio: 这条时间线里，莉莉·布朗热熬过了 1918 年梅齐的那个冬天，病得到医治，继续作曲。
    vignettes:
      entry: 抄谱人把歌声进来的记号划在了一张器乐分谱上。你把它跟总谱并排搁好，请他指出人声那一行。他挪了一个记号。你带走写着两处位置的纸角。真正的排练在你回去之后才开始。
      visitor: 你告诉抄谱人，后来的读者会照着编制来找各声部。他另收好管风琴谱，省得有人当成多出一份声乐谱。你帮他单独系住那一叠。这两份谱合起来响是什么样，你始终没听到。
      stand: 你腾出桌面，让抄谱人把人声、弦乐四重奏、竖琴和管风琴分开放。他把竖琴谱放回该去的那一叠。你把编制抄进簿子。等谱架摆好，你站过的地方已经空了。
  qu_yuan_miluo:
    name: 江边的诗句
    place: 汨罗江
    figure: 屈原
    story: 《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。传本对话是文献中的记述。
    relic: 一片写诗的竹简
    relic_desc: 一片竹简，上面是一首长诗中的几行。
    points:
      p1: 秦军拔郢、战事南下时，护住屈原流放中写下的诗稿
      p2: 屈原在泽畔憔悴枯槁时，照看他的吃住，让他有人照应
      p3: 在汨罗江边陪着屈原，把他留在人世
    points_fail:
      p1: 竹简在逃难里散失，他的诗没有传下来。这条分支与历史脱节，员工被送回。
      p2: 没有人照看他，这条分支里他照记载那样憔悴地行走在江边。
      p3: 这条分支里，他和历史上一样投了汨罗江。
    shift:
      p1:
        was: 公元前 278 年，秦将白起攻下楚都郢；归于屈原的诗作后来收进《楚辞》。
      p2:
        was: 《史记》记屈原流放时披发行吟泽畔，颜色憔悴，形容枯槁。
        now: '{staff}在雨季里给他张罗吃住。他走到江边时，没有原来那样憔悴。'
      p3:
        was: 《史记》记屈原自投汨罗江而死，年份通常定在公元前 278 年前后，各家说法不一。
        now: '{staff}在江边陪他度过了那些日子。屈原在楚国南方活了下来，接着写诗。'
        who: qu_yuan_miluo
        bio: 在这条分支里，屈原没有投江。他在楚国南方的江水边度过余年，一直写诗。
    vignettes:
      two_tales: 渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。
      refrain: 故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。
      wait: 等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。
  sima_qian_changan:
    name: 受刑之后写成的史书
    place: 长安
    figure: 司马迁
    story: 《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。
    relic: 一捆竹简
    relic_desc: 用绳子编起来的竹简，每一片写着一行字。
    points:
      p1: 司马迁下狱期间，护住他家中尚未写完的史稿，不散不乱
      p2: 往狱里送饭送衣，让他少受狱吏的折辱
      p3: 凑足依律赎罪的钱，让司马迁免受宫刑
    points_fail:
      p1: 家中的竹简绳断简散，等他出狱时草稿已不全。这条分支与历史脱节，员工被送回。
      p2: 没人进得了狱门，这条分支里他照样像后来信里写的那样，见了狱吏便低头叩地。
      p3: 家里穷，朋友没有一个出面。这条分支里和历史上一样，他无钱自赎，受了宫刑。
    shift:
      p1:
        was: 约公元前 98 年，司马迁因李陵之事下狱，按他自己的话，书当时只是草创，还没写完。
      p2:
        was: 约公元前 98 年，司马迁因替李陵辩解下狱，他在《报任安书》里写到自己在狱吏面前受的屈辱。
        now: '{staff} 往狱里送去饭食和冬衣，又打点了看守。他在狱中的几个月少受了些屈辱。'
      p3:
        was: 约公元前 98 年，司马迁因替李陵辩解获罪，家贫无钱自赎，亲友没有人替他说话，受了宫刑。
        now: '{staff} 向商人和旧识四处凑钱，赶在行刑前交上了赎金。司马迁出狱时身体完好。他回到家中的竹简前，把书写完。'
        who: sima_qian_changan
        bio: 这条时间线里，司马迁交钱赎罪，没有受宫刑。他照样把从上古写到当代的那部史书写完了。
    vignettes:
      dates: 书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。
      witness: 书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。
      binding: 书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。
  du_fu_xiang_river:
    name: 船上的诗人
    place: 湘江
    figure: 杜甫
    story: 传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。
    relic: 一盏船灯
    relic_desc: 一盏小小的陶油灯，为了几行诗亮到很晚。
    points:
      p1: 在船上给杜甫留一处可以收好诗纸的位置，护住寄湖南亲友的长诗从零散纸页连成全篇
      p2: 舟中照料他的风疾和旧病，减轻他的病痛
      p3: 护着这条船北上，让他一家平安回到故乡
    points_fail:
      p1: 匆忙挪舱时只找到头尾几张，长诗没能成篇，事务所因同步失败召回员工。
      p2: 他伏在枕上，在冬天的船里一天比一天病重。
      p3: 船没能北上，他在那个冬天客死他乡，灵柩暂殡岳阳。
    shift:
      p1:
        was: 大历五年，杜甫在舟中抱病，写下寄湖南亲友的三十六韵长诗，诗题记下了这些。
      p2:
        was: 大历五年冬，杜甫在湘江的船上病重，不久客死他乡，享年五十九。
        now: 那个冬天他在船上少受了些病痛。
      p3:
        was: 大历五年冬，杜甫客死他乡，灵柩暂殡岳阳；四十多年后，孙子杜嗣业四处乞借，才把他迁回偃师安葬。
        now: 那条船第二年开春到了北方，杜甫一家回到故乡，他在家中又过了几年。
        who: du_fu_xiang_river
        bio: 杜甫晚年漂泊湖湘，大历六年回到北方故乡，在家人身边度过余年。
    vignettes:
      shore: 旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。
      delivery: 你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。
      damp: 旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。
  li_qingzhao_hangzhou:
    name: 失去的藏品
    place: 杭州
    figure: 李清照
    story: 李清照在《金石录后序》中回忆她与赵明诚搜求书籍金石，以及后来收藏散失的经过。
    relic: 一张古碑拓片
    relic_desc: 用墨从石头上拓下来的纸，是她和丈夫曾经收集的那种。
    points:
      p1: 分清后序里的回忆与目录条目
      p2: 把残抄翻开，保留需要核对的那页
      p3: 记下残缺处，别用猜来的字填满
    vignettes:
      trace: 读者认出题名就要翻页。你问他能不能认出所记之物。他停下来，先补抄缺行前的地名。
      missing: 清单中间空了一处，读者犹豫补什么。你用小字记清缺了什么，留着地方，等后面的人查到再填。
      book: 你把后序搁到编号的目录旁。读者开口之前在两边来回看了一遍。念出来时，那些名目像是从前真有人抱在手里、带上路的东西。
  su_shi_huangzhou:
    name: 东坡的流放
    place: 黄州
    figure: 苏轼
    story: 1079 年乌台诗案之后，苏轼被贬到黄州，在城东一块坡地上开荒种地，以地为号，称东坡。1082 年七月，他与客泛舟赤壁之下，写成《赤壁赋》；十月，他从雪堂步行回临皋，写成《后赤壁赋》。1084 年他离开黄州。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是农人在坡地上穿的那种。
    points:
      p1: 帮他一家把东坡那块荒地种出收成，撑过积蓄见底的日子
      p2: 十月之望那夜，护住他攀上赤壁断岸，让他平安回到船上
      p3: 救下乡间那些一落地就要被按进水盆的孩子
    points_fail:
      p1: 这条分支里，秋收时东坡的地头没有多一个帮手，梁上的钱串照旧一串一串地少下去。
      p2: 那夜他在断岸上失了脚，这条分支里没有回到船上的那一段。
      p3: 这条分支里，乡间的水盆照旧，{staff}没能让哪一家留下那个孩子。
    shift:
      p1:
        was: 元丰四年，苏轼在城东坡地开荒种地，一家每天的用度限在一百五十钱。
        now: 那年秋天东坡的地多打了几担粮，梁上的钱串剩到了年底。
      p2:
        was: 元丰五年十月之望，苏轼独自攀上赤壁断岸，又回到船上，后来写下《后赤壁赋》。
      p3:
        was: 他听说岳鄂一带溺婴，写信请鄂州知州依律禁止，又在黄州倡议育儿会，请富户出钱，帮贫家养活新生的孩子。
        now: '{staff}跟着育儿会挨家去走，那个冬天又有几户人家把刚生下的孩子留了下来。'
    vignettes:
      slope: '{staff}替雇来的帮工往坡上挑水。天黑时，一位编出来的邻里在地头放下一碗煮豆，说明天第二碗给这个外乡人。'
      lamp: '{staff}在路边的石头上坐着，手护着一盏灯挡风。三更过了很久，坡上才有脚步声下来。{staff}把灯转向小路，什么也没说。'
      ferry: '{staff}在渡口帮一位编出来的船家盘缆绳。船家说，无风的夜里崖下的水走得慢，来游的客人总要往对岸去。'
  cao_xueqin_beijing:
    name: 末回后面的一张白纸
    place: 北京西山
    figure: 曹雪芹
    story: 《石头记》甲戌本留下曹雪芹生前已有带批语抄本流传的线索。卷首一条后加眉批回忆曹雪芹去世时书尚未成。故事设在他晚年的冬天，现存资料不足以确定他的卒日或最后写成了多少回。
    relic: 两页章回安排
    relic_desc: 游戏纪念物。一页列着拟好的章回次序，另一页留下作者还未决定的地方。
    points:
      p1: 让抄书人留下早期批本，再把等着曹雪芹改的稿页交还给他
      p2: 替他添火、备好稿页，让曹雪芹有一晚能专心想结尾
      p3: 趁他还有力气核看，照他认可的次序抄出一份收束提纲，托人带走
    points_fail:
      p1: 桌上那份批本混进要退回的改稿里，这条支线里的读者空着手离开。
      p2: 稿纸还没理齐，炭火已经要熄了。只能改天接着写。
      p3: 抄书人能理出散页，却不知道哪些结局曹雪芹已经想定。
    shift:
      p1:
        was: 甲戌本留下了曹雪芹生前已有早期批本传抄的记录。
      p2:
        was: 甲戌本有一条眉批，回忆曹雪芹去世时书还没有写完。
        now: 这条支线里，有人看着炭火，一次递一张稿页。曹雪芹多得了一个晚上，能想清楚故事接下来往哪里走。
      p3:
        was: 甲戌眉批记书未成，没留下曹雪芹亲自核过的收束提纲。
        now: 抄书人带走两张纸。一张是曹雪芹在这条支线里点定的次序，一张是他还没拿定的几个人的下场。后来转抄的人把两张纸一直夹在一起。
        who: cao_xueqin_beijing
        bio: 曹雪芹生前和抄书人核过一份收束提纲。这条支线的读者看得见哪些结局是他定下的，哪些他仍留着空白。
    vignettes:
      ink: 抄书人夹进一张纸签，把拟好的章节次序同读者的猜测隔开。纸页散了也知道各该放回哪一处。
      paper: '{staff}把灯端进来。抄书人把稿子从桌沿往里收了收，让出一小块地方。'
      empty: 末页还能写一个回目。抄书人看了看，照原样空着。
  tang_xianzu_linchuan:
    name: 写爱情超越死亡的戏
    place: 临川
    figure: 汤显祖
    story: 汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。
    relic: 一册刻印的曲本
    relic_desc: 给歌者用的刻本，每支曲牌的名字写在上方。
    points:
      p1: 帮他把亲手核过的《牡丹亭》原本抄定，交到宜黄戏班手里，让他们照原本排唱
    points_fail:
      p1: 后来的改本照史实传开，他只能写信叮嘱宜黄的伶人别照改本唱，这条分支与历史一样。
    shift:
      p1:
        was: 《牡丹亭》写成后，吕玉绳等人为便于吴地演唱改动曲文，汤显祖写信叮嘱宜黄班要依他的原本，吕家改的不可照用。
        now: 改本出来之前，宜黄班手里已经有了一部他亲手核过的原本，班里一直照原本唱。
        who: tang_xianzu_linchuan
        bio: 这条时间线里，汤显祖亲手核定的《牡丹亭》原本先到了宜黄戏班，班里一直照原本唱。
    vignettes:
      empty_garden: 你请演员在空台上排游园。几句之后，听的人指出想象中花开在什么地方。演员留下了让他看见那朵花的一句。
      cue: 删词连另一个演员上场的信号也删掉了。你在排练时发现，把那个字留在两人都听得到的位置，余下的删节仍能保留。
      breath: 你等演员把这一句唱完才挪椅子。这一遍，没人需要停下来解释为什么到了梦里。
  ban_zhao_luoyang:
    name: 给《汉书》表留一处待核
    place: 洛阳
    figure: 班昭
    story: 《后汉书》说，班固去世时《汉书》八表及《天文志》未完，班昭奉诏到东观藏书阁续成，后又有马续参与。
    relic: 一幅绢上的人名表
    relic_desc: 一条绢，上面是整整齐齐排列的官名与人名。
    points:
      p1: 窦氏事败之前，帮班固把八表与《天文志》各写到哪里、往下怎样续标清楚，留给接手的人
      p2: 班固随窦氏宾客被收捕时，护住他未完成的《汉书》稿，让它日后交到班昭手里
      p3: 从挟私收捕的洛阳令种兢手里救下班固，让他活着出狱
    points_fail:
      p1: 没人标出写到了哪里，接手的人只能对着残稿去猜，班固对后面几表的打算随他一起没了。
      p2: 收捕之中残稿散失，这条分支里班昭到东观时无稿可续。行程同步失败，员工被召回。
      p3: 消息没能及时递到朝廷，班固照旧死在狱中，时年六十一，和帝对种兢的谴责来得太晚。
    shift:
      p1:
        was: 92 年班固去世时，《汉书》八表与《天文志》尚未完成，后来班昭奉诏在东观藏书阁续成，马续又继续参与。
        now: 班固在每一张未完成的表前留了一页，写明停在哪里、往下怎样续。班昭接手时照着他的标记往下写。
      p2:
        was: 92 年六月窦氏事败，班固先被免官，随后在追查窦氏宾客时被收捕。
      p3:
        was: 92 年，洛阳令种兢因班固家奴醉骂结怨，借追查窦氏宾客收捕班固，班固死于狱中，时年六十一，和帝事后下诏谴责种兢，并治主事狱吏之罪。
        now: '{staff}抢在狱中出事之前把挟私收捕的事递到了朝廷，班固被放出狱。他又活了几年，和妹妹一起把几张表往下做。'
        bio: 这条时间线里，班固 92 年活着走出洛阳的监狱。余下的几年他用在《汉书》未完成的几张表上，和妹妹班昭一同续写。
    vignettes:
      column: 抄表人把后一行的人名移进了空格。你把底册摊到旁边，指给他看这个名字原在下面一行。他把名字移回去，另标上面待核。你带回来已对齐的一行，上面的空格仍没有填。
      later: 你知道后人会把整部书放在一起读。抄表人眼下还分不清这张练习表哪行算做完。你和他用一条窄纸夹出仍待核的地方，下一位一翻就能找到。另一份底册送来前，你得收队。
      fold: 你把名字和它所在的行一同抄下，上头仍留一格。抄表人看得出这是特地留下的。你带回一份抄件，那格该写什么还要等别人来核。
  xu_xiake_lijiang:
    name: 校书之外的半日
    place: 丽江
    figure: 徐霞客
    story: 1639 年二月，徐霞客住在丽江解脱林，为木增校书。木增遣人送来酒食，校书后又送礼酬谢。徐霞客听说寺后高处有拱寿台、狮子崖，日记里写校书催得紧，两处都没来得及登。
    relic: 一张解脱林步行图
    relic_desc: 游戏纪念物。走过的地方画了线，没走的岔道只留一处空白。
    points:
      p1: 帮徐霞客校完并交回木增的书，赶上初九酬谢和续修《鸡山志》的委托
      p2: 从校书之后腾出半日，请本地人带路、护卫同行，陪徐霞客从解脱林一步步走上拱寿台
      p3: 陪徐霞客沿狮子崖下的岔路往返，记下从哪儿开始折回，离开前给寺里留一份
    points_fail:
      p1: 退回的几卷还缺着签记，来请修志的人无法确认校书已完，这次交接错过，事务所召回员工。
      p2: 等书卷合上，已经走不了这一趟。拱寿台在日记里仍是听来的地名。
      p3: 徐霞客离开丽江时，没能把亲脚丈量过的路线补到听来的路引旁。
    shift:
      p1:
        was: 1639 年二月初九，木增遣人送礼酬谢校书，并再次致书请徐霞客修《鸡山志》。
      p2:
        was: 1639 年二月初六，徐霞客写校书催得紧，没来得及登拱寿台和狮子崖。
        now: 这条支线里，书卷交清后，向导和护卫在寺门等他。徐霞客登上拱寿台，回来写下坡走到哪里才看见对面的山。
      p3:
        was: 1639 年的丽江日记把狮子崖记为听说在寺后高处、因校书未及攀登的地方。
        now: 回程比别人指的远，徐霞客又走了一遍岔口，补上折回的那几步。离开解脱林前，他把一份留给寺僧，另一份夹进自己的游记。
        who: xu_xiake_lijiang
        bio: 徐霞客的丽江日记在校书和出关之间多了一篇亲历。解脱林另留一份足迹草图。
    vignettes:
      view: 向导用一座对面的山来指弯道。{staff}问到那里之前要转几次弯，才把望见的山和脚下的路各写一行。
      trail: 寺里侍者见护卫在阶下等，拿了块干布留给他们。徐霞客要交回的那些稿页上，墨还没有干。
      slope: 在解脱林门槛上，{staff}另抽出一张纸。给木增的还书单放回木匣，走路要记的留在手里。
  song_yingxing_fengxin:
    name: 一本讲万物如何造成的书
    place: 江西
    figure: 宋应星
    story: 宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。
    relic: 一页工具图
    relic_desc: 一张木刻版画，织机的每个部件都标了名。
    points:
      p1: 刻书的钱还没凑齐时，帮他把《天工开物》送进刻坊，让书照常刊刻
      p2: 临付梓前，劝住他删去《观象》《乐律》两卷，让这两卷和全书一起刻出来
    points_fail:
      p1: 书没能付梓，这条分支与历史脱了节，事务所召回员工。
      p2: 两卷照史实临梓删去，后来失传，这条分支里也没有。
    shift:
      p1:
        was: 崇祯十年孟夏，宋应星写成自序，《天工开物》由友人涂伯聚出资刊刻。
      p2:
        was: 崇祯十年，宋应星在自序里说《观象》《乐律》两卷道理太精，自认不是自己的本分，临付梓时删去；这两卷后来失传。
        now: 《观象》《乐律》两卷刻进了初刊本，和全书十八卷一起传了下来。
        who: song_yingxing_fengxin
        bio: 这条时间线里，宋应星没有删去《观象》《乐律》两卷，《天工开物》初刊时就有它们。
    vignettes:
      strainer: 你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。
      drying: 读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。
      sheet: 读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。
  wang_zhenyi_jinling:
    name: 挪到桌下的那面镜
    place: 南京
    figure: 王贞仪
    story: 王贞仪在《月食解》中自述，把镜子移到圆桌下，桌面挡住了吊灯照向镜子的光。提起灯后，光又照到镜上。
    relic: 一面小圆镜
    relic_desc: 在她的月食模型里充当月亮的那面镜子。
    points:
      p1: 提灯之前，请帮工把镜子放回同一个位置
      p2: 看准镜面从暗转亮的那一次
      p3: 把灯最初和最后的位置画在同一张图上
    vignettes:
      one_change: 帮工正要把灯和镜一起抬。你请她这一遍先别动镜，只把两次灯高分别画出来。只动一样，镜上果然有了光。你把图带回去，下一次能拿它对照天色的时候还没到。
      shadow: 你知道后人能在书里读到这次演示，刚进门的帮工眼前却只有一面暗镜。你让她在提灯前后各看一次，指给她看挡在中间的桌沿。她自己就能在图上标出遮挡处。这趟看见的是屋里的现象，没有赶上真正月食。
      outline: 你在纸上画下桌沿、低处的镜子，再从灯处画出一条线。镜面一亮，你在同一页添了第二条线。两条都带回去，今夜的天空没有相应的变化可供比较。
  jianzhen_nara:
    name: 回扬州的长路
    place: 岭南
    figure: 鉴真
    story: 748 年，扬州的鉴真第五次动身去日本，船被风吹到海南。走陆路北返的长路上，十年前到扬州请他东渡的日本人荣叡在端州病逝。再往前到了韶州，鉴真日渐昏暗的眼睛经一个自称会治眼的人治过，从此失明。
    relic: 一张练习用的卷签
    relic_desc: 故事中的帮工使用的经卷签。
    points:
      p1: 荣叡在端州病倒，照料他，把病治好
      p2: 韶州那人给鉴真治眼之前，劝他别让人乱治，把眼睛好好治好
    points_fail:
      p1: 荣叡照史实病逝于端州，鉴真为他送葬，没有他同行，继续北上。
      p2: 那次治疗照史实让他双目失明，三年后他看不见地渡海去了日本。
    shift:
      p1:
        was: 750 年前后，第五次渡海失败后的归途中，十年前到扬州请鉴真东渡的日本人荣叡在端州病逝。
        now: 他在端州病好了，和一行人一起继续北上。
      p2:
        was: 750 年，归途走到韶州，鉴真的眼睛因一路炎热劳顿日渐昏暗，一个自称会治眼的人给他治过以后，他双目失明。
        now: 他没让那人动手，眼睛治好了，看得清路上的山水和身边的人。
        who: jianzhen_nara
        bio: 这条时间线里，鉴真在 750 年的归途中保住了眼睛，后来看得见他渡过去的那片海。
    vignettes:
      sound: 千代隔着屋子指给人看，可架上摆得太满，准还是分不清她指哪束。你请她念出开头。准听着去对包纸上的字，找到那一束，给接读的人摆了出来。
      tie: 准想先把松开的包纸捆上，还没核对里面的次序。你扶着那束经卷，千代挨个念每部分的头一句。准把放错的一份放了回去。下次打开时，次序就是他们练过的那样。
      temple: 你知道759年还会有一座寺。千代只要写清明早这束经往哪里送。你帮她在包纸上写东大寺。另一座寺还在未来，这趟见不到。
  hua_tuo_xuchang:
    name: 史书提到的那一卷
    place: 许昌
    figure: 华佗
    story: 晚出的《三国志》说华佗被关入许狱，并记他试图从狱中交出一卷书而未成。
    relic: 一页练习登记簿的副本
    relic_desc: 登记副页，区分传闻与实际交接。
    points:
      p1: 狱吏畏法不敢收时，不让那卷书被烧掉
      p2: 让他活着走出许狱
    points_fail:
      p1: 狱吏畏法不收，华佗把书烧了，这条分支里那卷书一页也没留下。
      p2: 他照史实死在许狱，这条分支里他再没给人看过病。
    shift:
      p1:
        was: 208 年，华佗临死前拿出一卷书交给狱吏，说这书可以救活人；狱吏怕犯法不敢收，华佗便要火把它烧了。
        now: 那卷书有人收着带出了许狱，没散失之前已经抄了一份。
      p2:
        was: 208 年，华佗因曹操下令被关进许狱，荀彧为他求情，曹操不许，华佗死在狱中。
        now: '{staff}在最后那几天把他带出了许狱。他改了名字回乡，在乡里接着给人看病，原有的几个弟子又跟他学了些年。'
        who: hua_tuo_xuchang
        bio: 在这条时间线里，208 年华佗活着走出了许狱。他改名在乡间行医度过余生，弟子跟他学得更久。
    vignettes:
      notice: 阿瑾听说有一卷书，便写进已收物件。你请她指给你看书该搁在哪层。她把那一行移到传闻栏，架上仍留空，话是谁说的也记在旁边。
      shift: 阿长想合上登记簿，再叫下一班来。你请他先把这几行念一遍。念到没人亲见的交接，两人商量把那一栏先挂着。接手人看得见还有哪一笔没核实。
      later: 你知道后来史书会说起一卷书。阿瑾问，有没有真书从这屋交出去过。你指给她看若真有交接该记在哪儿。纸离开她的桌子时，那一栏仍空着。
  miyazawa_kenji_hanamaki:
    name: 很少有人读过的故事
    place: 花卷
    figure: 宫泽贤治
    story: 宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。
    relic: 一本口袋笔记本
    relic_desc: 一本小笔记本，里面是铅笔写的诗。
    points:
      p1: 在宫泽无力长谈时，理清来访农户的问题，让这次肥料咨询照常办下去
      p2: 趁宫泽还能辨认草稿，请他给《银河铁道之夜》留下各稿的先后
      p3: 趁他还在，让他知道以后会有很多人读他的诗和童话
      p4: 赶在 9 月 20 日那场急性肺炎之前，治好他的肺病
    points_fail:
      p1: 来访的人等不到能问清楚的时候，咨询没办成，这条分支与史实脱节，员工被召回。
      p2: 稿页留了下来，后来整理的人仍要从纸张和改笔判断稿本先后。
      p3: 这条分支里，他到最后只为少数诗人所知，没有人告诉过他，他的书以后会有人读。
      p4: 这条分支里病照旧发展，9 月 21 日他在花卷去世，三十七岁。
    shift:
      p1:
        was: 1933 年 8 月，宫泽贤治病情转重，仍应答农户的肥料咨询。
      p2:
        was: 1933 年 9 月，宫泽贤治去世，《银河铁道之夜》留有多次改写的未定稿。
        now: '{staff}请宫泽指出哪叠在先、哪叠在后，把次序另记在封纸上。后来整理作品的人照着这份记号把不同稿本分别保存。'
        who: miyazawa_kenji_hanamaki
        bio: 宫泽生前留下了《银河铁道之夜》各稿的排序说明。作品身后刊行时，读者可以由早到晚读到他留下的改写。
      p3:
        was: 1924 年，宫泽贤治自费出版了诗集和童话集各一本，生前除少数诗人外几乎无人知道他。
        now: '{staff}在他病床边告诉他，他的诗和童话以后会有很多人读。'
      p4:
        was: 1933 年 9 月 20 日，多年肺病的宫泽贤治又患上急性肺炎，次日在花卷去世，三十七岁。
        now: '{staff}带去的药治好了他的肺病，入秋以后他又能下床了。这条时间线里，他在花卷又活了许多年，继续给农户看土、配肥料，也继续改他的稿子。'
        who: miyazawa_kenji_hanamaki
        bio: 宫泽贤治在 1933 年秋天病愈，继续给花卷的农户做肥料咨询，活着看到自己的书有了许多读者。
    vignettes:
      call: 你在屋子那头念出站名。还没解释谁在那里，读者就抬了头。他再读时把解释往后放，先保留那一声。
      window: 读者想指出铁道从哪里通进天空。你问乔班尼先从窗里看见了什么。他把小山和车厢分别写在两张纸上。
      ticket: 读者重读转进车厢那几句时，你一直替他翻着这页。下一站还没叫名以前，他先记下眼前已经变了什么。
  higuchi_ichiyo_tokyo:
    name: 柜台上的七期《青梅竹马》
    place: 东京
    figure: 樋口一叶
    story: 樋口一叶的《青梅竹马》在 1895 年至 1896 年 1 月间于《文学界》连载，共七期。1896 年 4 月，《文艺俱乐部》一次刊出全文。书摊上的周折是分支演绎。
    relic: 一本随身日记
    relic_desc: 一本写了多年的日记，毛笔字端正。
    points:
      p1: 拿齐《文学界》七次连载的旧刊，同樋口一叶核全《文艺俱乐部》的合刊校样，让改过的全篇能在四月刊出
      p2: 趁合刊新出，请一叶与书商定一份带预付稿酬的单行本约定，由她指定所用校本
      p3: 七月一叶发热不退时，及早查出结核，治好她
    points_fail:
      p1: 零散旧刊少了一期，编辑只收到不全的合刊稿，事务所因同步失败召回员工。
      p2: 已有合刊可以借阅，书商仍只让她等后续消息，稿酬与使用哪个底本都没有定。
      p3: 病一路加重，八月请来的医生说已无法挽回，11 月 23 日她在丸山福山町的家中去世，年二十四。
    shift:
      p1:
        was: 《青梅竹马》分七次刊载，1896 年 4 月 10 日由《文艺俱乐部》刊出修订后的全篇。
      p2:
        was: 一叶晚年仍面对生计压力。《青梅竹马》后来收入 1897 年刊行的全集。
        now: 书商先付一笔稿酬并留下签认的校样。她能用这笔收入周转；往后排版的人也知道这版应照哪一份稿。
      p3:
        was: 1896 年 7 月起一叶发热不退，8 月请来的医生诊断已无法挽回；11 月 23 日她在家中死于肺结核，年二十四。
        now: '{staff}七月就请医生查出了结核，带去的药压住了病。她熬过了那一年，又在东京写了许多年小说。'
        who: higuchi_ichiyo_tokyo
        bio: 樋口一叶挺过了 1896 年夏天查出的结核。她在东京又写了许多年，生前看到自己的小说结集。
    vignettes:
      index: 有人在一期杂志上用铅笔写了「全」。你翻到那一期的末尾，拿四月刊本一对，找到了断在何处。摊主让你夹张能取下来的纸签。你带回七期的清单，却没能问到原来的字是谁写的。
      reserve: 有位读者一期期追下来，末回还没来取。你指给摊主看，别的客人如今可以买四月的全文刊本。末回连同预留的小条一起放进柜台底下。那位读者回来以前，你先收队了。
      layout: 你把四月那期放在末回旁边。一本打开是开头，另一本默认读者已经等过前面六回。你给摊主写下区别，也给自己留了一份。最初追连载的读者，等的时间比你整趟穿越还长。
  sei_shonagon_kyoto:
    name: 皇后临产的那个冬天
    place: 京都
    figure: 清少纳言
    story: 清少纳言约从 993 年起在宫中侍奉皇后定子。1000 年岁末，定子怀着第三个孩子。1001 年 1 月 13 日，她生下女儿媄子内亲王，随即去世，年二十四。清少纳言的宫中岁月随她的去世结束。
    relic: 一张折起来的清单
    relic_desc: 一张轻轻写着喜欢和不喜欢的事的单子。
    points:
      p1: 定子临产时守在她身边，让孩子平安落地，把母亲救下来
    points_fail:
      p1: 定子照史实在生下女儿后随即去世，年二十四，清少纳言离开宫中。
    shift:
      p1:
        was: 长保二年十二月十六日（1001 年 1 月 13 日），清少纳言侍奉的皇后定子生下媄子内亲王后随即去世，年二十四。
        now: 孩子平安落地，定子活了下来。
        who: sei_shonagon_kyoto
        bio: 这条时间线里，清少纳言侍奉的皇后定子平安度过 1001 年初的生产，她的主人还在。
    vignettes:
      compare: 你认出后世版本的开头。抄写人念漏了山际，你问光最先从哪里出来，他把漏掉的地方补到练习纸上。你把这处订正记进折起来的清单。从这扇门望出去，山本身却被挡着。
      colour: 你印象里的紫颜料太深了。抄写人分你一张纸边，你在淡紫上压了一笔细灰。两人等纸干，再往门外望，天上已不是那个颜色。
      listen: 你在门边听抄写人念了两遍开头。破晓时你也列了一张清单，只有一样东西，院子还黑着，瓦片先白了。你叠起纸带回去。作者若读到这一条会怎么想，你没有机会问。
  kabir_maghar:
    name: 一首歌里两个地名
    place: 马格哈尔
    figure: 迦比尔
    story: 《古鲁·格兰特·萨希卜》中归于迦比尔的一首诗，提及贝拿勒斯和马格哈尔，问地点对虔敬何异。
    relic: 一把练习打拍用的梭
    relic_desc: 纪念物，用来给接唱打拍。
    points:
      p1: 留意两名歌者在哪儿想起了不同地名
      p2: 先听两人各唱完一遍，再纠正
      p3: 转唱时，让听众还能听见两个地名
    vignettes:
      towns: 帕萝从贝拿勒斯唱起，萨利姆接马格哈尔。你请他们轮流唱，别让一句压过另一句。听众听清两个地名，也听出哪里转成问句。帕萝把开头交给下一个人，仍把答句留给对方。
      beat: 帕萝还没唱完头一处，萨利姆已唱到第二个地名。你用她凳边的梭在木头上敲一下拍子。这回他等住了，开口便有人听见。唱完，帕萝把梭递给他，请他替下一个声音打拍子。
      collection: 你读过后来的传本，两个地名都在纸上。帕萝问，没来的朋友听她起第一声，会不会认得。你听她试了一遍，没替她唱后世那一版。你离开时，她的朋友还没到。
  ibn_rushd_lucena:
    name: 焚书令之前
    place: 科尔多瓦
    figure: 伊本·鲁世德
    story: 1195 年，安达卢斯的哲学家、法官伊本·鲁世德失势。他被控多项罪名，科尔多瓦的法庭判他的学说有罪，下令焚毁他的著作，把他放逐到附近的卢塞纳。几年后他回到马拉喀什的朝中，1198 年 12 月 11 日在那里去世。他的许多阿拉伯文原著没有传下来，只靠希伯来文和拉丁文译本存世。
    relic: 一页读书练习摘录
    relic_desc: 摘录，为前提另留一处。
    points:
      p1: 在卢塞纳陪着伊本·鲁世德，让他知道他的注释会被许多语言的人读下去
      p2: 焚书令下来之前，把他的著作另抄一份，送出科尔多瓦
    points_fail:
      p1: 他照史实在卢塞纳度过放逐，学说被判有罪，没人告诉他这些书后来的去向。
      p2: 他的著作照史实被下令焚毁，许多阿拉伯文原本此后失传，只靠译本留下。
    shift:
      p1:
        was: 1195 年，科尔多瓦的法庭判伊本·鲁世德的学说有罪，把他放逐到附近的卢塞纳。
        now: 他在卢塞纳知道了，自己为亚里士多德写的注释会被译成别的语言，读上好几百年。
      p2:
        was: 1195 年，法庭下令焚毁伊本·鲁世德的著作。他去世以后，许多阿拉伯文原本没有传下来，斯坦福哲学百科所列四十九部里，有十四部只靠希伯来文或拉丁文译本存世。
        now: 焚书令下来之前，另一份抄本已经出了科尔多瓦，他的著作以阿拉伯文原文传了下来。
        who: ibn_rushd_lucena
        bio: 这条时间线里，伊本·鲁世德的书在焚书令下来前另抄一份送出了科尔多瓦，他的著作以他写下的阿拉伯文传世。
    vignettes:
      premise: 玛丽娅姆把结论抄得很工整。优素福要读通，却得先替她猜一个没写出来的前提。你问他读到哪儿卡住，在结论前留出地方。玛丽娅姆把前提写进去，优素福终于能就它发问。
      together: 优素福想把书还了，只给自己留一句。你给他留点时间，把旁边那一步也抄走。到了门口，玛丽娅姆请他复述结论，他如今也说得出理由。
      language: 你认得一个后来会在译本里出现的术语。玛丽娅姆只想核对前提有没有照原样抄下。你帮她把纸铺平，陪她查。她在边上写的问题，会交给这趟见不到的人。
  rumi_konya:
    name: 开篇是谁在说
    place: 科尼亚
    figure: 鲁米
    story: 鲁米《玛斯纳维》开篇请人听芦管诉说离别。科尼亚梅夫拉纳博物馆藏有六卷全本，抄于1278年，晚于鲁米1273年去世。
    relic: 一张起句练习稿
    relic_desc: 读书页，在起句处做了记号。
    points:
      p1: 在科尼亚把鲁米已经核过的《玛斯纳维》抄页按卷收好，留作后来重抄的底稿
      p2: 他十二月病倒以后，帮侯赛姆·切莱比记下他还在口述的诗句，让第六卷的结尾在他去世前多走一段
    points_fail:
      p1: 几份读本混在一起，后来拿不出一套鲁米亲自核过的稿子。分支与历史脱了节，事务所因同步失败召回员工。
      p2: 第六卷照史实停在原处。
    shift:
      p1:
        was: 科尼亚保存一份 1278 年的《玛斯纳维》手稿。馆藏研究认为它依据鲁米本人核过的一份抄本。
      p2:
        was: 1273 年 12 月鲁米病倒，17 日在科尼亚去世。《玛斯纳维》第六卷的结尾没有收束，是否写完，各家说法不一。
        now: 他最后几天又记下了几联，第六卷把开了头的那个故事讲完了。
        who: rumi_konya
        bio: 这条时间线里，鲁米 1273 年 12 月最后的口述被记到那个故事的结尾。他去世后，六卷在科尼亚继续有人读。
    vignettes:
      reed: 娜琳把两处用同一种声音读过去。你问，芦管从哪里开始用自己的口吻说话。她换过一口气，才念下一句。哈桑闭着眼，也听得出哪里换成了芦管。
      hand: 哈桑得离开读书凳，还没念完，娜琳手已够到那页。你按住纸角，等他把一联念完，手指落到下一行。轮到她时，她从那儿起句，一段诗从一人手里递到了另一人。
      manuscript: 你见过后来的六卷抄本。娜琳问，上面能不能看出哈桑在哪里换气。你指着刚练过的那行，让她自己定在哪里停。门关上时，他们还没念到下一联。
  ibn_al_nafis_cairo:
    name: 画在页边的路径
    place: 开罗
    figure: 伊本·纳菲斯
    story: 伊本·纳菲斯在十三世纪为伊本·西那《医典》作的解剖注释中，认为血由心脏右侧经肺到左侧，反对它直接穿过中隔的说法。
    relic: 两张解剖注释练习图
    relic_desc: 练习图，两张一并留下对照说法。
    points:
      p1: 用学生正在读的一段核对图
      p2: 另描新图时，把旧轮廓留在手边
      p3: 帮接手的人认出两条画出的路径
    vignettes:
      trace: 哈桑一笔穿过练习图正中。萨尔玛点了点自己刚读的一行。你请他照她读的内容再划一遍。他重画路线，让它经过肺，并标清早先一笔对应另一种说法。
      layer: 萨尔玛准备擦掉旧轮廓，桌上只留下一个讲法。你在底下垫一张干净的纸，让哈桑把第二条路线描在那里。新读者可以把两张叠看，自己问哪里变了。
      name: 你知道后世怎样称呼血液走的这一程。哈桑问的是注释到底在哪儿提出异议。你框住那句，让他照原文查。图已经带出屋子，老师是否认可，你走前还听不到。
  al_khwarizmi_baghdad:
    name: 代数背后的那个人
    place: 巴格达
    figure: 花拉子米
    story: 花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。
    relic: 一张演算过的方程
    relic_desc: 一张逐步解出平方与根的演算纸。
    points:
      p1: 在巴格达交抄时把实用例题与如何归整算式的正文合入同一册
      p2: 给后来的抄写人留一册把题例与它应用的正文相连的底本，让实际用过的读者也能指出抄漏
    points_fail:
      p1: 抄成的纸只记录算式，没有后面的实用题，原拟成册的著作没能完整交出，事务所召回员工。
      p2: 后一批抄本只传数学正文，试着拿去算分割的人没有例子可查。
    shift:
      p1:
        was: 花剌子密约在 830 年编写《还原与对消计算概要》。作者序列举经商、测地和财物分配等用途。
      p2:
        was: 后世传抄和翻译时曾出现章节差异。某些传本没有保留全部实用部分。
        now: 一份有互见的完整本可留给学徒和抄写者核对。后来分抄时也能查到哪一段来自整体中的哪一类题。
        who: al_khwarizmi_baghdad
        bio: 花剌子密编书时关心数学怎样用于日常问题。书在跨地域传抄与翻译时，部分内容的流传路径不同。
    vignettes:
      balance: 你请学算者把两边各做了什么都说出来。他还没算到答案就停了下来。刚才最糊涂的那一步，这回他讲得最清楚。
      tiles: 学算者照着念，你把几块方片摆在桌上。念到绕口处，剩下的形状正好让人看出还缺哪一块。
      check: 学算者做完后，你把第一行留在眼前。他把答案放回去念了一遍，看看两边的数是否还相等。
  ibn_khaldun_cairo:
    name: 亚历山大港的那条船
    place: 开罗
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦 1382 年应苏丹巴尔库克之邀来到开罗。1384 年，苏丹请突尼斯的君主放他的家人来埃及，8 月 8 日又任命他为马立克派首席法官。从西边来的外人坐上这个高位，城里的对手很快就开始设法把他拉下来。同年，载着他妻女的船在亚历山大港沉没。他在《历史绪论》中提出，史家要用所写社会中可能发生的事情检验传闻。
    relic: 一页核对过的记录
    relic_desc: 一页队伍经过的记录，页边写着看的人当时站在哪里。
    points:
      p1: 对手要把外来的人挡在法官席外时，护住他 8 月 8 日出任马立克派首席法官
      p2: 载着他妻女的船在亚历山大港沉没时，把船上的人从水里拉上来，救下她们
    points_fail:
      p1: 这条分支里，8 月 8 日的任命落到了别人头上，与历史脱了节，事务所当天召回员工。
      p2: 那条船照史实在亚历山大港沉没，船上的人无一生还，他的妻女没能到开罗。
    shift:
      p1:
        was: 1384 年 8 月 8 日，苏丹巴尔库克任命伊本·赫勒敦为开罗马立克派首席法官；城里的对手处处与他为难，第二年他就丢了这个职位。
      p2:
        was: 1384 年，载着伊本·赫勒敦妻女从突尼斯来埃及的船在亚历山大港沉没，船上的人无一生还。
        now: 船上的人在亚历山大港被救了上来。他的妻女随后到了开罗，一家人又住在了一起。
        who: ibn_khaldun_cairo
        bio: 这条时间线里，1384 年在亚历山大港沉没的那条船没有带走他的家人，妻女获救，到开罗与他团聚。
    vignettes:
      gate: '{staff}问一位编出来的书吏，人群过城门时门开了多久。书吏把时辰写在总数旁的页边，又把总数改成了估算。'
      two: 另一位编出来的见证人站在街对面。{staff}给她另腾一页纸，她说的那段街景就不必挤在书吏那张纸的边上了。
      copy: '{staff}替法庭里一个学生抄了一页《历史绪论》，行与行之间留出一指宽，给学生以后写批注。'
  taqi_al_din_istanbul:
    name: 天文台里的两声报码
    place: 伊斯坦布尔
    figure: 塔基·丁
    story: 塔基丁的伊斯坦布尔天文台在1580年1月被拆除前进行过观测。档案研究列出的仪器包括象限仪和机械钟。
    relic: 一张订正对照纸
    relic_desc: 天文台记录副页，保存了原行与订正。
    points:
      p1: 观象台接到撤除的消息时，尽快把台里已有的观测表按组清点，给能继续保管的人留可核的稿件
      p2: 把仪器图、用途说明和对应观测分别夹好，把只能确认用途而不能确认外形的项目留空
      p3: 请塔基丁核准一本可在台外使用的观测册，让两名原助手各自保管一份，写明今后如何交换抄件
    points_fail:
      p1: 旧表和待撤的物件同仓封走，研究者取不到留存数据，事务所因同步失败召回员工。
      p2: 一叠记录混收无题的示意图，后来读者把用来说明别处仪器的照抄成台内图。
      p3: 失去观象台后，各人能带走部分材料，下一次能不能借到另一半由不得他们。
    shift:
      p1:
        was: 伊斯坦布尔观象台于 1580 年奉命撤除。塔基丁的观测与天文工作仍有稿件传世。
      p2:
        was: 研究观象台可用同期的仪器图、用途说明与观测稿，但所存文献并未记录所有器物的去向。
        now: 后来的抄写者知道每张图能回答哪一项，也能看见台内没有留下出处说明的空栏。
      p3:
        was: 拆除中断了这处观象台的工作，仍有塔基丁的天文稿分散传世。
        now: 两套观测册留在不同地方。助手往后能凭页次互送勘误，离开观象台以后至少还有一份共同底稿。
        who: taqi_al_din_istanbul
        bio: 塔基丁在伊斯坦布尔组织观测，仪器、计算表和分工一起支撑这项工作。场地消失以后，手稿仍可留给后来的人。
    vignettes:
      clock: 哈桑读角度，莱拉抄钟上的时刻。她没听到第二次报码，下一行沿用了前一行的角度。你请两人一先一后再报一遍，他们把订正并排写在原记录旁，下一个人翻到这里就能找到。
      copy: 装订好的记录簿要送下楼，哈桑在台边还得查那次订正。你请莱拉把旧行和改行一起抄在一张纸上，注明先读的是哪一行。簿子送走后，台边还查得到这次改动的来路。
      closure: 你知道这座建筑剩下的时间已经很短。哈桑停在没有配时刻的角度上。你问他合上窗板前还能查出什么。他圈出一处空格。你走时，没再看见这间屋做下一次观测。
  ahmed_baba_timbuktu:
    name: 给补编留一个名字
    place: 廷巴克图
    figure: 艾哈迈德·巴巴
    story: 1591 年摩洛哥军队攻下廷巴克图。学者艾哈迈德·巴巴被指抗拒苏丹，1594 年被押往马拉喀什，在那里编写人物辞书，补伊本·法尔洪的旧作。1608 年他获准回到廷巴克图，1627 年 4 月 22 日在那里去世。
    relic: 一部皮面手稿
    relic_desc: 一部手稿，皮面磨旧了，带一片护舌。
    points:
      p1: 押走之前，拦下冲着被捕学者来的刀兵，护住艾哈迈德·巴巴活着走上北去的路
      p2: 替在沙漠里病倒受伤的族人治伤、分水，护着一家老小不掉队
      p3: 抢在士兵收书之前，从他的藏书里救下几箱，托给城里一户人家藏好
    points_fail:
      p1: 这条分支里他没能活着离开廷巴克图，马拉喀什的人物辞书和在摩洛哥写成的二十九部书都没有了。
      p2: 路上倒下的人没人扶，这条分支里一家人北上的路和原来一样苦。
      p3: 藏书全被收走，这条分支里他十四年后回到廷巴克图，自己的书一卷也没剩下。
    shift:
      p1:
        was: 1594 年，艾哈迈德·巴巴被指抗拒苏丹，押往马拉喀什；1608 年他获准回到廷巴克图。
      p2:
        was: 1594 年，艾哈迈德·巴巴的家人与他一同被押着穿过撒哈拉北上。
        now: 同行的族人走到马拉喀什时少受了些罪。
      p3:
        was: 1594 年，他的藏书被摩洛哥人收走，另一说在北上途中散失；1608 年回到廷巴克图时，书已不在。
        now: 押走之前有几箱书被挪进城里一户人家的床底。十四年后他回到家，那户人家把箱子抬了出来。
        who: ahmed_baba_timbuktu
        bio: 1608 年艾哈迈德·巴巴回到廷巴克图，城里一户人家替他收着的几箱书还在。晚年他就用这些书教学生。
    vignettes:
      same_name: '{staff}发现两卷书里同一个名字有两种写法，没有挑一种，两种都记在单子上，中间画了个记号。'
      courtyard: 雨季过后，{staff}把书摊在院子的阴凉里晾，正午翻一次，让封皮干得匀。
      slip: '{staff}在窄纸条上写下每卷的书名和头一行，塞在皮面的护舌底下，不用打开也叫得出是哪本书。'
  terence_rome:
    name: 留不住的观众
    place: 罗马
    figure: 泰伦提乌斯
    story: 泰伦提乌斯的《婆母》序言回顾演出受扰的经过，先提拳击和走绳的吸引力，再写角斗表演的消息引得人群涌来。
    relic: 一副喜剧面具
    relic_desc: 一副亚麻面具，眉毛高挑，演员戴的。
    points:
      p1: 走绳艺人和拳击手的传言引走观众时，留住看台上的人，帮剧团把《婆母》头一回演完
    points_fail:
      p1: 观众照史实散去，戏演到一半收场，这条分支里《婆母》头一回上演仍没有演完。
    shift:
      p1:
        was: 公元前 165 年，《婆母》头一回上演，传言有走绳艺人和拳击手要来，观众散去，戏没能演完。
        now: '{staff}留住了看台上的人，剧团头一回就把《婆母》演到了最后一句。这部戏不必再等五年、再经两回上演才被人听完。'
        who: terence_rome
        bio: IF 线里，泰伦提乌斯的《婆母》在公元前 165 年头一回上演就演完了，没有再经历两次中断。
    vignettes:
      warning: 你告诉虚构的舞台帮工，两千年后还有人读到观众离场这件事。他问后人知不知道观众走时演员说到哪儿。你留下听排练，记下最后一句听清的话。排练结束时比开头多了你这一个听众，正式演出还没到。
      audibility: 你靠门听，听清了一句，却漏掉了接它的那句。帮工挪了一条长凳，请你再听一遍。这回你把两句都听到了。你带回画着长凳两个位置的草图。等你退到街上，末尾的话已被街声盖住。
      bench: 你帮舞台帮工把一条长凳从门口挪开。来迟的人终于能坐下，不用叫整排人都站起来。你在木片上记下空出来的地方。临走时，门里还传着排练的声音。
  mohenjo_daro_indus:
    name: 印面和印痕，朝向各一张
    place: 摩亨佐·达罗
    figure: 印度河流域的居民
    story: 摩亨佐－达罗有刻着印度河符号的印章出土。印痕与刻制印面方向相反。
    relic: 一块练习印痕
    relic_desc: 用带不对称纹样的练习印压出的小样。
    points:
      p1: 辨出哪一张描的是印痕
      p2: 帮工提起练习印时，稳住底面
      p3: 请帮工口头说明标签，同时保留草图
    vignettes:
      mirror: 帮工把刻面抄进纸上，却当成了印痕。你放上一份新印的练习件，发现小缺口落在另一侧。他在纸签上重写了标签。你留下两面图，能说明一个记号朝哪儿，却没读出一句古文字。
      lift: 你见过馆里把印章和印痕并列的图。工台上，帮工在抬印前想辨清手里是哪个面。你请他等提起后再动两边的标签。对照留给他，第三回试印你没等到。
      pair: 你在一幅图下注「刻面」，另一幅下注「印痕」。帮工可以直接取对的那幅。你带回小小的练习印痕，真的符号仍然读不出。
  knossos_linear_a:
    name: 辨不清的一划，先记在页边
    place: 克诺索斯
    figure: 米诺斯的书吏
    story: INSCRIBE 项目登记克诺索斯出土的 KN 1 为线形文字 A 泥板。线形文字 A 仍未被读通。
    relic: 一块泥板
    relic_desc: 一块扁平的泥板，上面是一行行符号和表示数目的小记号。
    points:
      p1: 稳住练习抄板，核对一处辨不清的笔划
      p2: 观察换一个照光方向后，那一划还像不像字
      p3: 让翻译芯片帮忙对照帮工口述的标签
    vignettes:
      stroke: 仓房帮工把一道刮痕也抄进了那行记号里。你换个角度照光，把这道划痕另描在字列外，回头还能复核。你带回两幅图的区别，板上的话仍没翻出来。
      heard: 你知道以后这套文字不好读。帮工报了一只练习托盘里有什么。你把他口头报的标签另记一张，与目见的笔划分开。收队时你说得清货名是谁告诉你的，却还不能把它配进任何真实铭文。
      margin: 你先抄看清的笔划，再在边上用一点标出那处犹疑。下一位知道要重看哪里。归来只带那一个点的草图，把猜的字都留在台边。
  antikythera_rhodes:
    name: 没有留下匠人姓名的机器
    place: 罗得岛
    figure: 不知名的匠人
    story: 安提基特拉沉船出水的齿轮装置残片保留了对应天文周期的刻度和铭文。
    relic: 一枚青铜齿轮
    relic_desc: 一个带齿的小轮，因年久而发绿。
    points:
      p1: 认出练习盘上标着的那圈刻度
      p2: 分清不同圈上对应的两个周期
      p3: 让下一个读者把铭文对回刻度盘
    vignettes:
      rings: 来客嘴里念外圈的标记，手却指向了内圈。你让他转一下练习盘，只跟其中一圈走，这回他沿着同一圈念到了底。
      calendar: 一根指针回转得比来客料想的快。你问他原先数的是哪一个周期。他另画了一行，没有把两个周期挤在同一栏下。
      legend: 你给指针和它所指的位置分别做记号。来客再念一遍标签，两处终于没被叫成同一个名字。
  sappho_lesbos:
    name: 下一口气之前
    place: 米蒂利尼
    figure: 萨福
    story: 大英图书馆藏有一片晚出许多世纪的纸莎草，上面留着一首归于萨福、写及兄长的诗的部分文字。残片提供了部分题材，缺失的诗句和歌声依然无从听见。
    relic: 一片习唱用的纸莎草
    relic_desc: 习唱中的道具，标过一处换气。
    points:
      p1: 找出听者在哪里停下来换气
      p2: 熄灯前再给犹豫的人一次起唱的机会
      p3: 把没听清的字和能跟上的声音分开
    vignettes:
      breath: 菲勒把词全串成一行，念到一半总要换气。她一停，你就在桌上轻敲一下。她记住那处停顿，又试了一遍。几个世纪后还会有残存的字迹，你听见的这口气，却留不进残片里。
      repeat: 米尔托两次张嘴，都没唱出声。菲勒已经要把灯拿走。你在米尔托身边敲出开头一拍，她终于唱了进来。有一行，桌边有两个人的声音。她今天来，就是为了跟上这一行。
      blank: 有人问，唱到你记得的那几句以后，归来的兄长又做了什么。你原可以当场接一个结尾。你只在记忆断掉的地方做了记号。灯灭时，那一段空处依然留着。
  aristarchus_alexandria:
    name: 纸上的三度差
    place: 亚历山大
    figure: 阿利斯塔克斯
    story: 阿里斯塔克斯在《论日月的大小与距离》中，取半月时所见日月夹角比直角少三度。第七命题由此推得日地距离介于月地距离的十八与二十倍之间。
    relic: 一块日晷板
    relic_desc: 一块青铜板，刻着时辰和节气的线。
    points:
      p1: 描三角形前先辨清观测者所在的角
      p2: 对照完成前，让两条视线一直留在同一张纸上
      p3: 说清结果的哪一处依赖所取的角度
    vignettes:
      angle: 学算人把观测者所在的角画成了直角。你标出望向半月和太阳的两条线，在这个角上补回差的三度。图与它用的前提终于对上。你两样都记走，却不能把它们当成今天量得的距离。
      limit: 你知道夹角越接近直角，那一点估计就越要紧。学算人问他只挪一道线，怎么答案就变了。你另画一张，先前那张也留着。还没能把图拿去跟天象对照，你便收队。
      page: 你把前提写在结果旁才折纸。学算人还能看出这个估计从哪一笔起。你自己的副本留好了角度，下一回半月却没留下实测。
  hipparchus_rhodes:
    name: 星群的四处边界
    place: 罗得岛
    figure: 喜帕恰斯
    story: 《阶梯抄本》的多光谱影像显出被擦去的希腊天文文字，其中有北冕座范围的数值。2022 年有研究将这一段归于喜帕恰斯星表，但归属仍有讨论。
    relic: 一只青铜浑仪环
    relic_desc: 一只带刻度的环，用来量星的位置。
    points:
      p1: 在练习图上找出所标的星群边界
      p2: 对照标记时，把两个方向分开
      p3: 把范围和用来界定它的星一同抄下
    vignettes:
      edges: 观察帮工用最亮的那点当边界。你指给他看，同一方向还有个暗些的点伸得更远。他挪一格边界，在页边记下所取的那颗。你把订正带回去，整部星表究竟会由谁写定，这张图答不出。
      copy: 你想起后世能拿来对照的边界数只剩几处。帮工写了一个跨度，却漏写沿哪个方向量。等他重报数字前，你先补上是哪一轴。副本上这两项都齐了，你走时另一轴还没核。
      outline: 观察帮工收纸前，你把标出的跨度两端抄好。草图移了，他还能再标出范围。你带回来两个刻记和一个方向，下一组星还没开始标。
  heron_alexandria:
    name: 门的第二个动作
    place: 亚历山大
    figure: 希罗
    story: 亚历山大的希罗在《气动装置》中描述一种点火时开启、熄火后关闭的门。书留下的是设计。
    relic: 标过的模型门槛
    relic_desc: 工坊的模型零件，在门曾蹭到的位置留了一道刻痕。
    points:
      p1: 帮他把希腊文的《机械学》连图多抄几部，不让原本失传
    points_fail:
      p1: 希腊文的《机械学》照旧只有那几部抄本，这条分支里原本还是失传了，全书只靠后来的阿拉伯文译本留下。
    shift:
      p1:
        was: 公元一世纪，希罗用希腊文写成《机械学》；希腊文原本后来失传，全书只靠九世纪古斯塔·伊本·卢加的阿拉伯文译本留下。
        now: '{staff}帮他把希腊文的《机械学》连图多抄了几部，这条时间线里原本传到了后世。'
        who: heron_alexandria
        bio: IF 线里，希罗《机械学》的希腊文原本没有失传，后世的工匠照他自己的话读这部书。
    vignettes:
      threshold: 尼卡诺尔把模型架上台，门往回收时差一指宽闭合。你标出摩擦的地方。模型底下卡了片扁豆皮，他把它扫出来。门终于关严，他请你留住记号，好叫他下次认得出这处。
      audience: 贝勒尼刻看见门往外打开，已经去拿披风。你请她再等一会儿，盯紧远侧的边。门回来时，她看见尼卡诺尔漏掉的一线亮光。他把模型留在台上再试一次，没急着交货。
      future: 你可以告诉尼卡诺尔，后世读者会把这几页同机器的图画摆在一起。他正等模型门咔哒一响，轻轻落定。你跟他一起听。离开时，他正叫客人回来看她错过的那一下。
  pliny_stabiae:
    name: 斯塔比亚的逆风
    place: 斯塔比亚
    figure: 老普林尼
    story: 公元79年火山喷发时，老普林尼抵达斯塔比亚，找到庞波尼安努斯。小普林尼后来写信告诉塔西佗，送舅舅进来的风也让装好东西的船无法离港。
    relic: 一块蜡板
    relic_desc: 一块涂蜡的木板，用尖笔划出笔记。
    points:
      p1: 浅滩和山上落下的碎石挡住海岸时，帮老普林尼把船靠上雷克蒂娜那片海岸，把她接上船
      p2: 浮石和碎石砸向船身时，护住老普林尼的船一路驶向斯塔比亚，让他上岸见到庞波尼阿努斯
      p3: 硫磺气味和烟尘压到斯塔比亚的海滩上时，替他护住呼吸，救下老普林尼，让他活着离开海滩
    points_fail:
      p1: 船没能靠上她那片海岸，这条分支里没有人把雷克蒂娜接上船。
      p2: 船在斯塔比亚之前被逼回，老普林尼没有见到庞波尼阿努斯。分支与历史脱了节，事务所因同步失败召回员工。
      p3: 他照史实倒在斯塔比亚的海滩上，这条分支里也没能留住他。
    shift:
      p1:
        was: 公元 79 年喷发那天，老普林尼收到雷克蒂娜请他救她离开的信，改了计划出海；浅滩和山上落下的碎石挡住海岸，他转去斯塔比亚找庞波尼阿努斯。
        now: 船靠上了她那片海岸，雷克蒂娜被接上船，随船到了斯塔比亚。
      p2:
        was: 小普林尼后来写信告诉塔西佗，舅舅乘顺风到斯塔比亚见到庞波尼阿努斯，同一阵风挡住了船离岸。
      p3:
        was: 第二天硫磺气味和火光逼近，老普林尼在斯塔比亚的海滩上由两名奴隶扶起，随即倒下；小普林尼信里说是浓重的烟尘堵住了他的呼吸。两天后遗体在原处找到。
        now: '{staff}替他挡住了烟尘，扶他离开海滩。风转向以后，他随船回到米塞努姆，又活了些年。'
        who: pliny_stabiae
        bio: 这条时间线里，老普林尼从斯塔比亚的海滩上活着回来。他回到米塞努姆的舰队，又过了些年。
    vignettes:
      wind: 克里斯普斯把搬上船的木箱全记成了已离开。你们从门边看见第一位来客肩上带灰走进来，装好东西的船却还看得见。克里斯普斯划掉了已离开几个字，请你给下一位进门的人在蜡板上留一行。
      lantern: 灯快熄了，普丽玛只来得及穿过屋子一次。你替她守在门边，她点数还能看见的人。先看不清的是蜡板，她大声念出最后两个名字，你一个个应回去。
      letter: 你记得多年后寄出的那封信。普丽玛问的却是拿名单的人，那封信里找不到他的名字。你把知道的明早结局搁在一旁，帮她点完人。离开时，还能听到有人沿走廊走过来。
  galen_rome:
    name: 火后还在的书名
    place: 罗马
    figure: 盖伦
    story: 盖伦在《论免于忧苦》中叙述罗马192年火灾给自己的藏书和物品带来的损失，也叙说哪些书在他看来已经无从补回。
    relic: 一页书目
    relic_desc: 书目，有个书名依然可读，存卷一栏留空。
    points:
      p1: 在火灾前核对两批书的去向，让原先要送往坎帕尼亚的那批散文词语卷照原计划先发
      p2: 器械入仓前，劝盖伦请工匠另存一套蜡样
      p3: 趁先发的书还没装完，说服盖伦让旧喜剧词语手稿随同这批书离城
    points_fail:
      p1: 书卷错收进罗马的仓房，旧时已经运走的那批也在火里失去。行程同步失败，员工被召回。
      p2: 火后要重做器械，工匠手上没有留下的样件可对。
      p3: 那批手稿仍要等夏初才发运，来不及躲过这场火。
    shift:
      p1:
        was: 公元 192 年冬末罗马起火时，盖伦说那批散文作家词语汇编已经运往坎帕尼亚。
      p2:
        was: 公元 192 年，盖伦存放在罗马仓房的器械随火灾毁坏，其中有他自己设计的器械。
        now: '{staff}请工匠保留一套蜡样在工坊，盖伦回城后还能对照样件重做器械。'
      p3:
        was: 公元 192 年冬末，盖伦编的旧喜剧词语手稿在罗马仓房的火灾中烧毁。
        now: '{staff}让这批卷子随先发的书运走，盖伦回到罗马后能凭副本继续修订。后来另有一份抄本交给外地的藏书处。'
        who: galen_rome
        bio: 盖伦的旧喜剧词语汇编在火灾中留有副本。他继续核订其中的引文，并把另一份交给外地读者查阅。
    vignettes:
      list: 特尔提娅念了三个书名，就记下有三卷。你请她在桌上一本本摸到相应的卷，只摸到两卷。你们把第三个书名留着，在存卷一栏做了个空记。
      borrow: 狄翁记得借出过一份，却想不起借给了谁。特尔提娅想趁清单还没送走，把书名划掉。你帮他想起交书的那扇门。她在清单里留了一处空位，等那条街传来回话。
      survival: 你读过一部写这场损失的书，传本在很久以后才重新被认出来。狄翁只问，明天桌上能放哪本。你留着书目里的名字，把现有两卷指给他看。你走时，还没找到缺掉的那卷。
  ovid_tomis:
    name: 诗与空着的一行
    place: 托米
    figure: 奥维德
    story: 奥维德在《哀歌》第二卷把获罪的缘由写成一首诗和一个过失，接着避谈那个过失。
    relic: 一块写字蜡板
    relic_desc: 一块板，上面是流放路上起笔的诗体书信。
    points:
      p1: 奥维德在托米斯病倒，没有医生、没有合用的吃食、水喝不惯，照看他把病养好
      p2: 骑兵踏着封冻的多瑙河过来劫掠时，护住《哀歌》第三卷，直到它启程去罗马
      p3: 让奥维德知道，被公共书库拒之门外的诗，罗马仍有人在抄、在读
    points_fail:
      p1: 他病中无人照看，这条分支里他在托米斯的头几个月和他诗里写的一样难熬。
      p2: 诗卷在劫掠里丢了，没有到罗马。这条分支与历史脱节，员工被送回。
      p3: 罗马读者的消息没有传到托米斯。他照旧以为罗马已经忘了他。
    shift:
      p1:
        was: 公元 9 年前后，奥维德在托米斯病倒，他在《哀歌》第三卷第三首里写，这里没有医生，没有合用的吃食，水也喝不惯。
        now: '{staff}给他找来干净的水和吃得下的东西，在他发热的日子里守着。他比原来早些下了床。'
      p2:
        was: 公元 9 年至 10 年前后，奥维德在托米斯写成《哀歌》第三卷寄回罗马，卷中写冬天骑兵踏着封冻的多瑙河过河劫掠。
      p3:
        was: 《哀歌》第三卷开篇写这卷书到了罗马，被各处公共书库拒之门外；奥维德终未获召回，公元 17 或 18 年死于托米斯。
        now: '{staff}告诉他，进不了公共书架的诗，罗马人家里仍在一卷卷抄着读。他再往罗马写信写诗时，知道有人在等这些字。'
        who: ovid_tomis
        bio: 在这条分支里，奥维德在托米斯得知被禁的诗卷在罗马仍有人读。流放的余年里，他是写给知道在那里的读者的。
    vignettes:
      rumor: 你告诉捎信人，几个世纪以后还有人追问那个过失。他指指抄本空出来的地方，问该写些什么。你把目的地添在封套上，把空处留在正文里。人带着这份说不清的稿子走了。
      verify: 捎信人记得一个多了人名的版本。你请他指出是哪张纸上的。他能指出那首诗和那个过失，往后便指不出什么了。你在自己的蜡板上记下断在这里。抄本启程时，你仍然没得到那个名字。
      wrap: 捎信人伸手时，风掀起外面一页。你给散页编上号，照原样收好。蜡板上只给自己留了一句提醒，那行没解释的照原样抄。收信人读到这里是什么反应，你没能看见。
  empedocles_akragas:
    name: 合唱从哪句分开
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒的诗歌残篇写到四根，以及爱与争引起的聚合和分离。远在后世，第欧根尼·拉尔修收录了互相矛盾的死因传说。
    relic: 一片诗稿
    relic_desc: 排练用的纸莎草条，在诗句的两处转折做过记号。
    points:
      p1: 把他的《阿波罗颂》另抄一份收好，日后家里人误烧时，烧掉的不是唯一的一份
      p2: 帮他把长诗《论自然》完整地多抄几部，不让它只剩残篇传世
    points_fail:
      p1: 《阿波罗颂》照旧只有一份，这条分支里它还是被家里人无意中烧掉了。
      p2: 《论自然》照旧只有原来那几部抄本，这条分支里它还是失传了，后人只读得到别人引过的句子和几片纸草。
    shift:
      p1:
        was: 公元前五世纪，恩培多克勒写过一首阿波罗颂；据第欧根尼·拉尔修引亚里士多德，后来被他的姐妹，希罗尼穆斯说是女儿，无意中烧掉了。
        now: 那首颂诗另有一份抄本收在别处，这条时间线里它躲过了那把火。
      p2:
        was: 公元前五世纪，恩培多克勒把他的学说写成长诗《论自然》；原诗后来失传，只剩后世作者引用的残篇和 1999 年刊布的斯特拉斯堡纸草。
        now: '{staff}帮他把《论自然》完整地多抄了几部，这条时间线里整首诗传到了后世，不用再从引文里一句句拼回来。'
        who: empedocles_akragas
        bio: IF 线里，恩培多克勒的《论自然》完整传了下来，后人能从第一行读到最后一行，看他怎样讲四根和爱与争。
    vignettes:
      cue: 法翁只记住声音最高的一句，结果两个人同时起了头。你在意思转折的两处做记号。到头一处，两人把凳子挪近，到了第二处，各退一步。这回面朝门的读者不用看稿，也知道念到哪儿。
      handoff: 埃瑞涅能念到第二段，却总是一下跳到末尾。法翁说他一个人念完算了。你请她给第一个提示，让法翁在屋子另一边接腔。喊开饭时，收住这一遍的是她，终于没有半途离开。
      sandal: 法翁问后人会记住哪个故事。你差点说起后来那则埃特纳传说里的铜鞋。他想要的是明天还能练的一句。你收住铜鞋的话，陪他把没念完的那段再走一遍。再想去找埃瑞涅，凳子已经叠起来了。
  democritus_abdera:
    name: 两块陶片之间
    place: 阿布德拉
    figure: 德谟克利特
    story: 亚里士多德《形而上学》把实与虚空、形状与次序及方位等观点归于留基伯和德谟克利特，并拿字母作比。
    relic: 两块字母陶片
    relic_desc: 习作中用来比较次序的两件道具。
    points:
      p1: 不动字形，只交换两块陶片的次序
      p2: 换一只留出空位的托盘再排一遍
      p3: 陶片装回袋前，抄下两种排法
    vignettes:
      order: 欧克勒斯摆出形状各异的陶片，把每种变化都叫变形。你只交换阿尔法和纽的位置。他照样叫得出每一块的名字，陶片也还嵌得进原来的轮廓，抄出来的一行却变了。
      gap: 多丽丝把窄盘塞得满满的，想少跑一趟。你请她先放一片在桌上，再让别的陶片顺着腾出的空格滑过去。第二趟她特意保留一格。这个空位如今也是演示的一部分。
      atom: 你开口讲后世实验室里什么叫原子。欧克勒斯问，这个词能不能解释那行陶片为什么读起来变了。你擦掉题外话，帮他画下陶片的次序。多丽丝已把托盘收走，最后那个角度来不及再核对一次。
  hildegard_bingen:
    name: 没唱出声的开头
    place: 宾根
    figure: 宾根的希尔德加德
    story: 希尔德加德致美因茨教长的信，抗议当局因安葬争议限制修院礼仪。美因茨文书目录还收有1179年关乎这一争议的另一封信。
    relic: 一页圣咏练习稿
    relic_desc: 练习页，一根夹线标明起句。
    points:
      p1: 把死者生前已与教会和解的证词早些送到美因茨，让修院早几个月重新唱起来
    points_fail:
      p1: 禁令照旧拖到 1179 年 3 月才解除，这几个月里修女们不能唱日课。
    shift:
      p1:
        was: 1178 年，因修院墓地葬了一位曾被绝罚的男子，美因茨的教长对鲁珀茨贝格下了禁令；希尔德加德申明他生前已与教会和解，不肯掘墓，禁令到 1179 年 3 月才解除。
        now: '{staff}早早把证人的话送到美因茨，禁令提前解除。她生命的最后一年里，修院的歌多唱了几个月。'
        who: hildegard_bingen
        bio: 希尔德加德八十岁那年修院被禁唱，在这条时间线里禁令几周就解除了，她最后一年里鲁珀茨贝格的歌声几乎没有断过。
    vignettes:
      opening: 阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。
      wait: 阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。
      return: 你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。
  nezahualcoyotl_texcoco:
    name: 歌旁写着的名字
    place: 特斯科科
    figure: 内萨瓦尔科约特尔
    story: 内萨瓦尔科约特尔 1431 年成为特斯科科之主，统治到 1472 年去世。人们记得他是诗人，也是营造者，据说横贯特斯科科湖的一道长堤是他规划的。十六世纪收集的纳瓦特尔语歌谣里，有一些和他的名字连在一起，但是否出自他手，已无法确定。
    relic: 一张接唱提示纸
    relic_desc: 接唱纸，分开给两种名字留了位置。
    points:
      p1: 他去世后贵族推举继承人的那几天，护住七岁的内萨瓦尔皮利
      p2: 帮宫里的一位学徒把与他名字连在一起的那几首歌，从老歌者那里一句不落地学全
      p3: 在他最后的日子里，让他知道五百多年后人们还记得他的名字
    points_fail:
      p1: 推举之前孩子出了事，这条分支里特斯科科没有照史实迎来七岁的新主。
      p2: 老歌者病倒前没教完，这条分支里那几首歌照旧只传下来一部分。
      p3: 他照史实在 1472 年去世，这条分支里，他到最后也不知道后人会记得他。
    shift:
      p1:
        was: 1472 年内萨瓦尔科约特尔去世，七岁的内萨瓦尔皮利被推举继位。
      p2:
        was: 十六世纪后期，写在他名下的一些歌被抄进歌集，最初是谁唱的，没人知道。
        now: 那位学徒把几首歌从头到尾学全，后来又教给了自己的徒弟。
      p3:
        was: 1472 年内萨瓦尔科约特尔在特斯科科去世；与他名字连在一起的歌一百来年后才抄进歌集，墨西哥的百元钞票印他的像，是五百多年以后的事。
        now: '{staff}在他最后的日子里坐在他身边，把这些告诉了他。'
    vignettes:
      voice: 一位歌者唱到以“我”开头的那句走上前来，{staff}在练习纸上留了两处，一处记唱的人，一处记歌里念的名字。
      drum: '{staff}放了一条边角纸作记号，头一位歌者起身时，纸页仍留在下一位够得着的地方。'
      later: '{staff}记下这一句是从哪位歌者那里听来的，至于最初是谁作的，留着没写。'
  maya_codices_mani:
    name: 记住书页怎样折
    place: 马尼
    figure: 玛雅书吏
    story: 1562 年 7 月 12 日，马尼当众烧毁了大批玛雅折页书。玛雅社群与知识仍在延续，但征服以前的玛雅书，今天只剩寥寥几部。
    relic: 一张空白练习折页
    relic_desc: 守书人自愿交给员工的练习折页。
    points:
      p1: 取得守书人信任，赶在焚书前把折页书分批运出马尼，藏到别村
    points_fail:
      p1: 书留在马尼，7 月 12 日和别的书一同烧掉。
    shift:
      p1:
        was: 1562 年 7 月 12 日，马尼当众烧毁了大批玛雅折页书。征服以前的玛雅书，存世的只有寥寥几部。
        now: 焚书之前，守书人把书一批批送出马尼，藏进别村人家。这些书留在了玛雅人手里。
        who: maya_codices_mani
        bio: 这条时间线里，书吏们的书在 1562 年 7 月以前离开马尼，在别的村子收藏下来，玛雅的制书传统有更多页留了下来。
    vignettes:
      fold: 守书人把两张空折页放在凳上，问邻居记得那本书从哪一折先打开。你扶住纸，让他们比对。他说不准第二折在哪里。她把第一折收好，第二折不合上，等下次两人再谈。
      listen: 邻居说起守书人记不清的那段，两人记得的次序却不一样。你听他们各自讲完。他们同意第一折，第二折先不定。守书人请你把两种说法都在的那份留给她。
      survive: 你在后世馆藏里看过一部存世玛雅抄本。守书人问，你能不能说出邻居记的是哪一本。你能说出藏在哪儿，却对不上这一屋人记得的页。她给你一张空白练习折页带走。那本书留在了他们的讲述里。
  rongorongo_rapa_nui:
    name: 翻页之前给这面做一记
    place: 拉帕努伊岛
    figure: 拉帕努伊人
    story: 澳大利亚博物馆记载，拉帕努伊的 kōhau roŋoroŋo 是在木面刻记号的传统。存世实物很少，学界仍未能系统释读。
    relic: 两幅朝向习作
    relic_desc: 各在上缘做了一记的练习图。
    points:
      p1: 给每幅习作各留一个朝向标记
      p2: 帮工转板时保住第一张图的位置
      p3: 把口述标签与对应的草图核对
    vignettes:
      orientation: 帮工把练习板转过来，误拿第二张当第一张。你先在纸上补一支小箭头，才对照两幅。下回照着箭头能复核方向。你带走这个练习，却还读不出任何真实铭文。
      label: 你知道后人会问实物当时怎样摆。帮工告诉你他从哪一边画的，你把这句话另记一张，与图分开。走时能确定站位，仍没给刻写的记号猜一个意思。
      copies: 合起两张纸前，你各在上边做个记号。帮工照记号转回你原来看的方向。你带回两张习作图，启发这道练习的真正文字仍在纸外。
  nalanda_library:
    name: 给下堂课留个叶码
    place: 那烂陀
    figure: 那烂陀的僧人
    story: 那烂陀大寺遗址留有居住与教学建筑，见证长期讲学。
    relic: 一张课签
    relic_desc: 读书记，用叶码标好该从哪处接着读。
    points:
      p1: 在练习叶束里找到上一位读到哪儿
      p2: 交出叶束前抄下所用叶码
      p3: 在课签上分开记两个相近的位置
    vignettes:
      number: 读书人只靠上堂最后一个字找页。你对了两片练习叶，发现两处都有那个字。他这才在签上补一个叶码。下一位可以翻到对的位置。出处能查回去了，你却赶不上下一堂。
      later: 你知道以后还有旅人写到在这里求学。读书人问叶束交到别人手里时，该怎样让他接着读。你另做一张签，把位置写全，哪怕下一个人没听过今天这一段也能找回。叶束交出去了，你没听到下一个人读。
      tie: 叶束系起前，你先记好新课前面是哪一叶。你把课签放在外绳下，下一位先看到的是它。你留了一份抄件。后面会读到什么，正想着，人已经要回去了。
  meroitic_meroe:
    name: 把两组符号分开的点
    place: 麦罗埃
    figure: 麦罗埃的书吏
    story: 麦罗埃文字有草写体与象形体。草写铭文可以用竖排的小点作分隔。不少符号的读音已为研究者所知，语言仍有难以解释之处。
    relic: 一张分组习作
    relic_desc: 两组练习记号，分隔点清楚可见。
    points:
      p1: 抄整行以前先找出分隔记号
      p2: 在副本上记下原图的方向
      p3: 把口述说明和练习上的记号对照
    vignettes:
      dots: 抄写人往窄纸上转写时，把两组记号接成一组。你指着练习行上竖排的小点，把分隔放回原位。两组现在还能各自核对。你带走副本，整行的意思仍没弄明白。
      direction: 你知道后来的读者有时认得一处记号，却解释不了一句。抄写人问从哪边起，你在右端行外添一支箭头，与原行分开。等你走后，方向还认得清。
      margin: 你抄完一组，保留那几个点，再给下一组留地方。抄写人接过来，还能看出两组没有连在一处。你带回分列的形状，下一堂没有赶上。
  tupaia_tahiti:
    name: 领航者的海图
    place: 奋进号上
    figure: 图帕亚
    story: 来自赖阿特阿岛的领航者图帕亚，1769 年 7 月在塔希提登上“奋进号”，画下了他熟悉的群岛海图。1770 年 6 月，船在今天昆士兰外海触礁，修船那些天他得了坏血病。秋天船到巴达维亚修整，船上流行热病与痢疾，塔希提少年泰阿塔先病逝，图帕亚随后也病逝。
    relic: 一张岛屿草图
    relic_desc: 一张墨与淡彩的纸，画着小小的岛形和名字。
    points:
      p1: 触礁那一夜帮着减重、压泵，护住奋进号不沉
      p2: 坏血病在河口把图帕亚拖倒之前，给他弄来鲜食，治好他
      p3: 在巴达维亚拦下一个接一个放倒船员的热病，救下泰阿塔和图帕亚
    points_fail:
      p1: 天亮时船还卡在礁上，水漫过了货舱。分支和历史脱了节，员工在这一天被送回。
      p2: 6 月 16 日他照史实病倒，牙龈出血、腿上发紫，熬了好些天才靠自己钓的鱼缓过来。
      p3: 泰阿塔和图帕亚照史实先后病逝在巴达维亚，离港那天的花名册上没有他们。
    shift:
      p1:
        was: 1770 年 6 月 10 日夜到 11 日，奋进号撞上今天的奋进礁，船员扔掉六门炮、压舱物、淡水和坏了的存粮，涨潮时船才浮起来。
      p2:
        was: 1770 年 6 月 16 日，班克斯记下图帕亚坏血病很重，牙龈坏了，腿上起了青紫的斑，船上的药都不管用。
        now: 他没有在河口病倒，修船那些天天天在岸边钓鱼。
      p3:
        was: 1770 年末奋进号在巴达维亚修整，船上疾病蔓延，少年泰阿塔先病逝，几个星期后图帕亚也病逝，离他海图上的那些岛很远。
        now: 两人熬过了那几个星期，12 月底奋进号离开巴达维亚时，他们都在船上。
        who: tupaia_tahiti
        bio: 这条时间线里，图帕亚和少年泰阿塔熬过了 1770 年巴达维亚的那场病，随奋进号继续航行。
    vignettes:
      pronounce: 一位编出来的抄图人以为两种拼法是两座岛。{staff}请他先把两个名字念出来，他便在名字旁留了个问号，没画新岛。
      route: 抄图人要在两个记号之间拉一条直线，{staff}问刚才说方位是从哪座岛算起的，那条线就没有画下去。
      room: '{staff}压住卷起的纸角，下一个名字写下去时，就不会盖住上一个。'
  heo_nanseolheon_hanyang:
    name: 装着散诗的纸套
    place: 汉阳
    figure: 许兰雪轩
    story: 许兰雪轩去世后，弟弟许筠整理了她留存的作品，现存刊本中有 1608 年的朝鲜木刻本。
    relic: 一页诗稿
    relic_desc: 一页细纸，用毛笔写着写花和远方的诗。
    points:
      p1: 理清许兰雪轩留在娘家的诗稿去向，让许筠后来找得到用来编集的那一份
      p2: 在纸页分散前给作者认可留下的诗注明笔迹，免得传抄时混入别人的句子
      p3: 在诗稿可能被销毁前，请许兰雪轩自己划出肯让人读的诗
    points_fail:
      p1: 分存的诗稿下落也断了，许筠后来无法循原稿编集。行程与史实脱节，员工被召回。
      p2: 同题的抄稿一起传开，后来分不清哪些改字经过作者亲手核定。
      p3: 去世之后，只能由家人从留存稿中替她选篇。
    shift:
      p1:
        was: 1589 年许兰雪轩去世后，许筠后来以娘家留存的稿件整理她的作品。
      p2:
        was: 1608 年《兰雪轩集》朝鲜刻本所收作品中，后来有部分篇目引起真伪争议。
        now: '{staff}请许兰雪轩只为自己同意留下的几首核对字句，再标明哪部分是她的笔迹。'
      p3:
        was: 1589 年许兰雪轩去世后，亲笔稿据记载曾遭焚毁，后来的选编由许筠进行。
        now: '{staff}在生前请许兰雪轩决定哪些诗可以传阅，哪些应按她的意愿处理。后来的选本保留了她亲自挑出的一个小组。'
        who: heo_nanseolheon_hanyang
        bio: 许兰雪轩生前定下了一小组愿意传阅的诗。亲人整理她的遗稿时保留了这个次序。
    vignettes:
      binding: 抄写人把练笔的纸夹在其他页里。你对过两个题头，另折了一个纸套装练抄稿。还有一页看不准，留散着让他再查。哪首诗最后印进了书，你在这趟看不到。
      name: 你知道有些诗以后会传到离这户人家很远的地方。抄写人要递出去一张没题头的练抄稿，你请他把题头一同誊下。送出门的纸多了一张带署名的。你用空白纸条夹住自己读到的位置，木刻本还要等许多年。
      fold: 你把散页套起来，没让折痕压到字，再在多出的纸套上标记有一页还缺题目。带走的是这条提醒，诗页留在屋里。你离开以后，那部诗集才会编成。
  ghalib_delhi:
    name: 先听见韵脚，再去翻诗集
    place: 德里
    figure: 迦利布
    story: 这趟去德里时，迦利布的乌尔都语诗集已于 1841 年刊印。读者可以按加扎勒的韵脚、叠句结尾来翻找。
    relic: 一页格扎勒诗稿
    relic_desc: 一页他亲笔写的乌尔都语诗，有修改的痕迹。
    points:
      p1: 帮他把国王托付的帖木儿王朝史后半部的材料收齐理好，让他写完上半部以后接着写下去
    points_fail:
      p1: 后半部的材料照旧散在各处，这条分支里他还是只写成了上半部，计划中的续篇始终没有动笔。
    shift:
      p1:
        was: 1850 年 7 月 4 日，巴哈杜尔·沙请迦利布撰写帖木儿王朝史；上半部《正午的太阳》1854 至 1855 年间刊行，写到胡马雍去世为止，他计划中的续篇没有写成。
        now: '{staff}趁这份差事刚接下时，帮他把后几朝的材料理出了头绪，这条时间线里他写完上半部又接着写了下去，把国王托付的史书写完了。'
        who: ghalib_delhi
        bio: IF 线里，迦利布写完了巴哈杜尔·沙托付的整部王朝史，不只是上半部。
    vignettes:
      refrain: 卖书人记得诗里的意象，却一直翻错地方。你问他反复听到的是什么词。他念出结尾，你才在刊本里翻到对应的一组。你记下一个页码。最早把这一句念进店里的人是谁，他仍说不上来。
      future: 你告诉卖书人，以后的读者会把几个版本摆在一起对。他问那能不能帮他找到今天这一句。你在他的条子上补了版本年份，又标出结尾。等他有另一本可核对时，你已经走了。
      listen: 你把结尾念给卖书人听，念到两个人都认得。他把条子夹进书里对应的一段。你能带回记得住的那几个字，整句却已经有些想不起来了。
  savitribai_phule_pune:
    name: 包里多带的一件纱丽
    place: 浦那
    figure: 萨维特丽巴伊·普勒
    story: 1848 年，萨维特丽巴伊·普勒与乔蒂拉奥·普勒在浦那开始办女学。有关她的记述里，有她去学校路上受到的侮辱，也有她随身多带、到学校再换上的那件纱丽。后来的办学档案记她担任校长。1897 年，她在照顾鼠疫病人时染病去世。
    relic: 一块石板
    relic_desc: 一块小石板，上面用粉笔写着第一排字母。
    points:
      p1: 开学头一个月最难的那个早上，护住她去比德府的路，让当天的课照常开
      p2: 劝回一个被家里叫回去的女孩，让她回到石板前
      p3: 拦下那段路上朝她扔东西的人，让她不必再在包里多带一件纱丽
    points_fail:
      p1: 那天她没能走到学校，比德府的门没有开。
      p2: 这条分支里，比德府的石板前少了一个人。
      p3: 她照旧每天在包里多带一件纱丽，这条分支与历史一样。
    shift:
      p1:
        was: 1848 年 1 月起，比德府的女子学校照常开课，萨维特丽巴伊每天走路去教书。
      p2:
        was: 1848 年，浦那许多人家反对女孩上学。
        now: 那个女孩又回来上课了。
      p3:
        was: 1848 年起，她去学校的路上被扔石头和粪，包里多带一件纱丽，到校再换上。
        now: 从一个春天的早上起，路边没人再朝她扔东西，那件备用的纱丽一直叠在包里没用上。
    vignettes:
      slate: '{staff}把石板横过来，让两个女孩同时够得着。喊她们回家时，两人都留了一道笔迹，彼此都指得出是谁写的。'
      road: 去布德瓦尔区的路上，{staff}落后半步跟着，把包拎在背对门口的那一侧。那天早上，街上没人说话。
      chalk: '{staff}把最后一支粉笔掰成两截，一截给黑板，一截给石板，又记下要去集市上买的东西。'
  zhu_shijie_yangzhou:
    name: 算板四方各有一元
    place: 扬州
    figure: 朱世杰
    story: 莫若在朱世杰《四元玉鉴》前序里说明四元怎样围着中央摆放：天元在下，地元在左，人元在右，物元在上。序作于 1303 年。
    relic: 一套算筹
    relic_desc: 一根根细棍，排成行来代表数。
    points:
      p1: 帮朱世杰在扬州把《四元玉鉴》多刻、多抄几部，送到跟他学算的人手里，不让这本书在后世失传
    points_fail:
      p1: 书照史实只有少数几部流传，这条分支里到十八世纪后半它在中国还是找不到了，要等阮元四处去访。
    shift:
      p1:
        was: 1303 年《四元玉鉴》刊出，前有莫若序；到十八世纪后半，这本书在中国已经失传，1799 年阮元编《畴人传》时遍寻不得，几年后才访得一部。
        now: '{staff}帮他多刻、多抄了几部，分到来学算的人手里。这条分支里，这本书一直有人在读，不用等人四处去找。'
        who: zhu_shijie_yangzhou
        bio: IF 线里，《四元玉鉴》在 1303 年刊出时多印了几部，留在各地学生手里，一直传了下来。
    vignettes:
      rotate: 两位学算人从算板两侧各抄了一份。你先标出从哪边算作下，再把两张摆在一起。有一张把地元和人元挪回正确位置。你抄走订正的图，还没轮到做那串长长的消元。
      hand: 你问学算人为什么四个名都写在一排。他说这样背得住。你让原来那行留着，另绕中央摆四个记号，好叫他也记得位置。等他收筹，你只看见了起手，还没看到题怎样算完。
      outline: 筹入盒前，你绕着中央画了四条短线，再记哪一端是下。回来时你还摆得出这个布局。大题留在学算人的板上。
  qin_jiushao_huzhou:
    name: 一份答案要过两行
    place: 湖州
    figure: 秦九韶
    story: 秦九韶《数书九章》卷一大衍类详列处理余数问题的方法。
    relic: 一枚算筹
    relic_desc: 一根磨得发亮的竹算筹。
    points:
      p1: 帮秦九韶把《数书九章》多誊几部，交到刻书人手里，别让它只靠抄本传下去
    points_fail:
      p1: 这部书照史实只以抄本流传，近六百年后才有刻本。
    shift:
      p1:
        was: 《数书九章》1247 年以抄本存世，1421 年收入《永乐大典》，1787 年收入《四库全书》，1842 年才有木刻本。
        now: 几部誊本离开了湖州，他在世时书就刻了版。别处的人也能照他排定的次序读这部书。
        who: qin_jiushao_huzhou
        bio: 这条时间线里，秦九韶的书在他生前就刻印出来，在宋代不止一处有人读、有人教。
    vignettes:
      witness: 学算人摆了五根筹。三根一组的确剩二，但五根一组剩零。你请他试八，第一行剩二，第二行剩三。他划去一个答案。再加第三行的题，你没等到。
      rows: 你知道以后还有人研究这套算法，学算人却只想知道两个余数能不能填进同一格。你请他分别标明按三分组与按五分组的两行。他下次能自己验了，那个新答案你仍没赶上。
      counters: 你把八根筹先按三根分，再按五根分。每回重摆之前，先记下没分进组的筹。你带回验过的两行，桌上还有一道更大的题。
  al_biruni_ghazna:
    name: 平原上方的两条线
    place: 加兹尼
    figure: 比鲁尼
    story: 比鲁尼在《确定地点坐标》中记述曾用南达纳附近一座山估算地球大小。山高与地平线低于水平线的角度是两项不同的量。
    relic: 一件星盘
    relic_desc: 一只铜星盘，刻度被手指磨亮。
    points:
      p1: 在草图上区分水平线与望见的地平线
      p2: 带着完整的山高记录到观测点
      p3: 说清山坡坡度为何是另一个量
    vignettes:
      angle: 测量帮手把角标在山坡那一侧。你从他站的点画出水平线，再画望向地平线的较低视线。角的记号得挪到另一处。你带回改过的图，最后的数字还在算。
      height: 你知道后来的书会同时留下山高和角度。到了山顶，帮手只报了角度。你把记山高的条子送上来，请他把两项并着收。等平原没入薄雾，两个读数已经挨在一起。下一回地平线放晴你等不到。
      fold: 你用一张纸条裹住另一张，标明哪项是量山所得，哪项是平望所得。帮手再翻时不用猜。你带回两个量的名字，半径还没算完。
  al_razi_rayy:
    name: 给存疑处另作题头
    place: 雷伊
    figure: 拉齐
    story: 拉齐在《质疑盖伦》中，把盖伦书里的主张与自己的观察并看，也记下他曾在什么情况下暂缓判断。
    relic: 一张分了两栏的页边记
    relic_desc: 读书记，分列出处与读者疑问。
    points:
      p1: 核对页边写的是观察，还是判断
      p2: 留点时间，等读者把疑处说完
      p3: 交接时，让观察记录和出处一并交出去
    vignettes:
      columns: 莱拉把两行都记在盖伦名下。第一行在书里找得到，第二行是有人放下书之后说的。你请她把书名留给第一行，给另一行另作题头。新来的人能看懂疑问从哪里开始。
      doubt: 法尔哈德想用一句判断收尾。莱拉还在回想做观察的人到底说了什么。你放慢读的速度，把最后一行留给她。她把记得的写下来，再跟一个问题，留给接手的读者。
      edition: 你见过后世传本会记下这样的疑问。法尔哈德手里只有这张纸，问最后没定下的一行该怎么写。你帮他标作待对照。下一份抄本还没来，灯就撤走了。
  sushruta_varanasi:
    name: 课前那块练习布
    place: 瓦拉纳西
    figure: 妙闻
    story: 《妙闻集》记述用模型习作，并举到布片。文本经历了长期传承。
    relic: 一片标记过的练习布
    relic_desc: 练习样布，保留下来供比较。
    points:
      p1: 找出哪块布留着给人看最初那次练习
      p2: 学徒比较时，把练习布按在原处
      p3: 帮下一名学徒把两次练习都看一遍
    vignettes:
      cloth: 米拉正要把粗糙些的那片丢进碎布堆。你指出阿难给第一回留下的记号。她拿来同后来那片比，把两块都留在台上。阿难现在可以指明自己哪儿做了改动。
      turn: 阿难不停讲自己的那片，米拉等着上手摸。你把两片摆到她够得着的地方，请阿难先看她指哪儿。她问的正是他刚才跳过的一角。那片布便留在台边，给下一人看。
      text: 你知道后世能读到一章讲模型习作。米拉手里只有片布，上面的一个小记号她认不出。你听着她自己找回早一块来对照。下一堂开始时，你已经走了。
  zhuge_liang_wuzhang:
    name: 灯灭以前的一封回信
    place: 五丈原
    figure: 诸葛亮
    story: 建兴十二年，诸葛亮在五丈原患病，北伐未竟，病逝军中。他曾密表后主，建议由蒋琬接手。蒋琬在他死后受任。史书没有记载诸葛亮生前是否收到回音。
    relic: 一枚没填完的信牍
    relic_desc: 游戏中的纪念物。木牍上划了两格，一格记去信，一格记回音。
    points:
      p1: 帮书佐把密表归到送往成都的文书里，赶上这班信使
      p2: 请书佐暂缓送进例行文书，照料病中的诸葛亮，让他安静歇一下午
      p3: 趁诸葛亮还看得清字，把蒋琬愿意接手的回信交到他手上
    points_fail:
      p1: 这条分支里密表搁错了地方，误了这班信使。朝廷要等下一班才能收到。
      p2: 日常文书照样一摞摞送到病榻边。
      p3: 回信送到时，等它的人已经不在了。
    shift:
      p1:
        was: 本传记下了诸葛亮密表后主，回程文书如何收领未见记载。
      p2:
        was: 诸葛亮在军中病逝。
        now: 例行文书暂放在案上，病榻边安静了一个下午。
      p3:
        was: 蒋琬在诸葛亮死后受任，两篇本传都未记载诸葛亮生前收到答复。
        now: 这条分支里，成都提前回了私信。诸葛亮亲眼看到蒋琬愿意接手。他死后，蒋琬仍受任。
    vignettes:
      bowl: 侍从来换榻边一碗清水，上一碗还温着。
      register: 书佐把回文那一栏空着，等有信来再补日期。
      empty: '{staff}把合上的收文簿搁到灯边，榻上伸手能够着。'
  borobudur_java:
    name: 方台走到圆台
    place: 爪哇
    figure: 婆罗浮屠的建造者们
    story: 爪哇中部的婆罗浮屠建于八至九世纪。联合国教科文组织的遗产档案记有下部的方形台层和上部三层圆台。
    relic: 两张台层轮廓图
    relic_desc: 两张方台与圆台交界的工作草图。
    points:
      p1: 让两张练习图纸在共用的台阶处对齐
      p2: 把平面图带到方台转为圆台的位置
      p3: 在圆台草图上找出多画的一处拐角
    vignettes:
      corner: 画图帮工把下图的形状又画进上图。你先顺着方台图走一处直角，再沿另一张的弧边描过去。他擦掉多出的一角。你带回两个轮廓，走到的地方还没有抵达最高处。
      stair: 你看过后世从上往下画的平面图，站在下面的帮工却只见眼前的台阶。你在两纸都画出这段阶，好叫他登上去能看懂哪里改了形。等他绕圆台一周，你早已走了。
      layers: 你在阶下标出一条直边，又在阶上描一小段弧。帮工核图时请你把两个记号分别留着。你带回两种轮廓，哪一张都画不下整座建筑。
  qin_liangyu_shizhu:
    name: 秦良玉与石砫账册
    place: 石砫
    figure: 秦良玉
    story: 《明史·秦良玉传》记载，崇祯三年，秦良玉与秦翼明奉诏勤王，秦良玉出家财济饷。《补辑石砫厅新志》也记载了这次奉诏出行。
    relic: 石砫领物抄单
    relic_desc: 页边记了一个姓名，包裹旁又写了另一个。
    points:
      p1: 把秦良玉拿出家财的交接款逐笔确认，让石砫经手的人能在开支日期签领
      p2: 把交割手记和家中其余的开销分开记，发回石砫的一份加经手人和实际支付日期
      p3: 请秦良玉核对一份家人也能查的支出单，给因分摊费用而迟领钱的人留待核记录
    points_fail:
      p1: 临时收款的人记不清谁已领款，家财没能按原意交割，事务所因同步失败召回员工。
      p2: 把公私开销抄在一处，后来查一笔支出时，家人得再去问所有经手者。
      p3: 应补支付当作已经给出，不能回来的经手人也没法核清。
    shift:
      p1:
        was: 《明史》记 1630 年秦良玉与秦翼明奉诏应召，秦良玉出家财济饷。
      p2:
        was: 秦良玉的支出由史书概述，公开传记没有留这批款项完整细账。
        now: 留下的副本可以确定哪些钱已交付、哪些家人还在垫付。
      p3:
        was: 石砫地方志也记奉诏出行，后来的记载以出行和事功为主。
        now: 家里能凭留底追对漏项。经手的人来问时，可以看见当日应补的数如何核出。
        who: qin_liangyu_shizhu
        bio: 秦良玉与石砫关系密切。史料明载她用到家中财物，具体如何经手是这条分支考察的内容。
    vignettes:
      ledger: 两行名字只差一个字，账房顺嘴读成了同一个人。你把那个字圈出来，他把两位领物人都叫回来核对。
      hands: 搬货人两手托着包裹，腾不出手展开单子。你替她把纸按平，把名字念给她听，她才重新抱紧包裹。
      copy: 账房念过一行，你就在抄单上对一行。念到最后，你把两张纸并排留在桌上。
  zeami_sado:
    name: 纸上的金岛
    place: 佐渡岛
    figure: 世阿弥
    story: 1432 年 8 月，世阿弥的长子、一座的继承人元雅客死伊势。几个月后，世阿弥写道，元雅一死，这一流的道就断了。1434 年，年过七十的他被流放佐渡，在岛上写下《金岛书》。他的论著此后秘藏数百年，1909 年才刊行于世。
    relic: 一张能面
    relic_desc: 一张小小的木面，眉间有细细的漆痕。
    points:
      p1: 在佐渡陪着世阿弥，让他知道自己写下的东西会传下去、有人读
    points_fail:
      p1: 他照史实在流放中度日，以为自己这一流的道随儿子一起断了。
    shift:
      p1:
        was: 1433 年，元雅去世约七个月后，世阿弥写道，这一流的道已经断绝，一座已经破败。1434 年他被流放佐渡。他的论著此后秘藏数百年，1909 年才刊行。
        now: 他在佐渡知道了，自己写下的东西会传下去，几百年后还有人读。
        who: zeami_sado
        bio: 这条时间线里，世阿弥在佐渡度过流放的岁月，知道自己论艺的文字会比他活得更久。
    vignettes:
      later: 你告诉虚构的念词人，后来写佐渡的书还会提到这个名字。他先像念地名一样试一遍，再念得像一个人对着远处想什么。你记下两个停顿。载世阿弥来岛的船，你已经赶不上了。
      mask: 念词人举起练习用的面具，放下时找不到念到哪儿。你拿一张散纸标出那行的起头，立在他伸手就能找见的位置。面具挂回钩上，下一轮念词你没能留下听。
      wind: 风把念词纸吹散。你从长凳底下拾回一张，用小石子压住。念词人把那一行又念了一遍。你走时纸还压在石头下，记下来的只有那一处停顿。
  ino_tadataka_ezo:
    name: 被直线吞掉的转弯
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬从江户出发，开始第一次测量。队伍沿东北地方一路北测，渡海到虾夷地，再沿海岸测到西别折返。来回全程约半年，不全是在岛上度过。伊能忠敬于 1818 年去世，同伴在 1821 年完成《大日本沿海舆地全图》。
    relic: 一根测杖
    relic_desc: 一根量步距用的细杖，上面刻着尺度。
    points:
      p1: 盘缠见底的时候，护住测量队的行程，让测绳按期铺到西别
      p2: 帮他把一段海岸从步测换成用绳量，让那一段的数先准起来
      p3: 帮他把测绳从西别再往前铺一段，让这一趟多测一截没测到的海岸
    points_fail:
      p1: 队伍在西别之前就撑不下去回了头，回到江户也画不出那一路的图。
      p2: 这条分支里，虾夷地的每一段仍只是步数。
      p3: 测量照旧在西别回头，这条分支与历史一样。
    shift:
      p1:
        was: 1800 年，伊能忠敬的测量队沿虾夷地东南海岸一路测到西别，再折返江户。
      p2:
        was: 1800 年的第一次测量全靠步测，到第二次测量才用上测绳。
        now: 虾夷地有一段海岸先用上了绳。
      p3:
        was: 1800 年的第一次测量到西别为止，北海道其余的海岸要等以后的测量补上。
        now: 测绳越过西别又往前铺了一段，回到江户的那几张图上多了一截海岸。
    vignettes:
      bend: 一处海湾眼看要被画进一条直线里，{staff}请他们在拐弯处再测一次方位，那个弯就留在了纸上。
      repeat: '{staff}用同样的步子把一段路又走了一遍，两次的步数并排记着，没去挑哪一个。'
      sketch: 众人歇脚时，{staff}在计数单背面画了一个岬角的轮廓，标出测绳铺在哪里。
  djenne_builders:
    name: 院边一小块试抹的墙
    place: 杰内
    figure: 杰内的泥砖建造者们
    story: 杰内以土构建筑著称。今日可见的大清真寺于 1907 年重建。
    relic: 一块泥砖
    relic_desc: 一块晒得很硬的泥砖，掰开能看到里面的稻壳。
    points:
      p1: 扶住练习板，别蹭到新抹上的一层
      p2: 带第二小份材料到练习墙另一面
      p3: 与帮工约定下回先回来看哪一块
    vignettes:
      mark: 院里帮工试抹两块，却记不清各是哪碗来的。你在墙边摆两张另记的纸条，两块试抹都有了自己的记录。另一面还没轮到晒太阳，你就收队了。
      time: 你知道几个世纪后人们所见的建筑还有重建的历史。眼下帮工只想把这一碗铺满试墙，你请他先抹一小块，留一个干后可再查的位置。你带回的是下回该看哪处，结果还没出来。
      shade: 你把试抹的那块和阳光照到的边界画下来。帮工把图拿回工台，好下回对同一处。你的副本上只有一小块，整墙还没抹。
  ahmes_thebes:
    name: 纸草上的圆田
    place: 底比斯
    figure: 阿赫摩斯
    story: 莱因德数学纸草第 50 题问直径为九的圆田有多大。题中从直径减去九分之一，再把余下的数平方，得六十四。现存纸草由书吏阿赫摩斯据旧本抄写。
    relic: 一卷纸草残片
    relic_desc: 一小片写着红黑两色字的纸草。
    points:
      p1: 算出平方之前剩下的长度
      p2: 把规则和算例抄在一起
      p3: 指给帮工看，正方形边长为何用八
    vignettes:
      table: 帮工把整个直径平方，在答案处写了八十一。你在九旁边写明先减去它的九分之一，再把剩下的八平方。他把答案改成六十四。两行你都抄走了，这趟却还没丈量过一块真的田。
      outline: 你知道后人会把这个法子与现代公式一起算。帮工只想知道八从哪来，你便给直径画了九个等分，划掉其中一份。他把图留在题旁。等他拿另一块田来试，你就不在了。
      roll: 纸草收起来之前，你把直径、减去的九分之一和余下的长度抄下来。帮工等你走后也能照着求平方。你只带回三个数，这块田究竟要下多少种，还不知道。
  quipu_cusco:
    name: 要数两遍的绳
    place: 库斯科
    figure: 结绳记事的人
    story: 《结绳档案》研究识别出若干记录相同数字的印加结绳，并讨论一笔账如何保存副本。许多数值结绳采用十进位。
    relic: 一束彩色结绳
    relic_desc: 一束长短不一的绳子，打着大小不同的结。
    points:
      p1: 先分清结的位置，再读练习数
      p2: 先独立读另一束，再把两份并到一起
      p3: 请记账人留住两份之间的差异，等复核
    vignettes:
      places: 记账人一眼把两条练习绳读成同一个数。你在纸上把十位和个位拆开，一条是二十三，一条是三十二。他给这对绳加了待复核的签。你带得走这处差异，却还辨不出哪一个数才对。
      copies: 你知道后来的研究者会找能互相对照的绳。记账人正要把两条中的一条单独搁开。你把两条读数分列两行，用记号标出哪一位开始对不上。两条绳一块收好，下一位复核的人还没来。
      tag: 你跟记账人从绳的自由端辨认一条练习绳。收绳前，你标明每个数各来自哪条。归来时就只带回这些。原例拿什么货物做比方，始终没人写。
  humboldt_chimborazo:
    name: 雪线以上的那道深沟
    place: 厄瓜多尔钦博拉索山
    figure: 亚历山大·冯·洪堡
    story: 1802 年 6 月 23 日，洪堡与埃梅·邦普兰、卡洛斯·蒙图法尔攀登钦博拉索山。挑夫不肯再往上走，三人流着鼻血、呕吐、头晕，继续向上，直到山顶以下一道深沟挡住去路，只得折返。
    relic: 一支气压计
    relic_desc: 一支装着水银的气压计，玻璃管上刻着高度。
    points:
      p1: 6 月 23 日那道深沟挡住去路之前，帮一行人顶住高山病，找到越过去的路，登上钦博拉索山顶再平安下来
    points_fail:
      p1: 他们照史实在那道深沟前折返，没有登顶。
    shift:
      p1:
        was: 1802 年 6 月 23 日，洪堡、邦普兰和卡洛斯·蒙图法尔攀登钦博拉索山，一路流鼻血、呕吐、头晕，在山顶以下被一道深沟挡住，只得折返。
        now: 他们越过那道深沟，站上了钦博拉索山顶，又平安回到营地。
        who: humboldt_chimborazo
        bio: 这条时间线里，洪堡 1802 年 6 月 23 日与邦普兰、蒙图法尔一同登上钦博拉索山顶，平安下山。
    vignettes:
      turn: 虚构读者把线路一路画上山顶。你问日记写到哪里就停止往上走了。他把最后一记往山坡下移，没再碰山顶。
      units: 读者要只抄一个高度，把单位省掉。你请他把原单位和测数放在一起，另留一行给今天的换算。
      names: 你请读者在洪堡旁留出地方，记下另外几名同行者。折起纸以后，名单仍跟着当天攀登的记录。
  banneker_maryland:
    name: 要一起寄出的两件东西
    place: 马里兰
    figure: 本杰明·班纳克
    story: 1791年8月19日，本杰明·班纳克致信托马斯·杰斐逊，随信送去下一年的历书手稿，质问种族偏见与奴隶制度。
    relic: 一张留底的信包签
    relic_desc: 留底签，写明里头有历书，也有随附的信。
    points:
      p1: 替班纳克隔开给印坊的底稿，护住他要随信寄出的那份亲笔年历
      p2: 趁印坊审稿时拿计算底表说服排字人，给读者留下一页能复核的算法
      p3: 说服班纳克让校过的观测笔记另存一份，别把多年的草算都押在同一间屋里
    points_fail:
      p1: 唯一能随信寄出的抄本被印坊带走，信里没有年历可供查验。这条分支与史实脱节，员工当天被召回。
      p2: 印出来的只有结果，读者只能看推荐信和表上的数字，复算无从下手。
      p3: 草算依旧集中留在家中，多数手稿和住宅一起烧失。
    shift:
      p1:
        was: 1791 年 8 月 19 日，班纳克写信给杰斐逊，并随信附上一份亲笔抄写的年历。
      p2:
        was: 1792 年年历的巴尔的摩版刊出计算表与推荐信。
        now: '{staff}帮班纳克挑出一段演算，印坊把它留在表旁，读者可以自己重算一次。'
      p3:
        was: 1806 年班纳克下葬当天，他的住宅失火，许多手稿随之烧毁。
        now: '{staff}请班纳克指定哪几册可以交给外地保管，再请印坊替他复抄。后来家中失火，校过的观测和推算还有一份可查。'
        who: banneker_maryland
        bio: 班纳克有一份分开保管的观测记录。后世读者除了年历里的数字，还能查到他当年如何逐项算出来。
    vignettes:
      packet: 蕾切尔看见首页排着月份，就要给包裹写上算表。你把信搁在边上，请她读过收件地址，再把签写完。她用一根线把两件包在一起。表随寄件人署名上路，他要说的话也跟着去。
      handoff: 艾萨克的挎包还能塞进一个薄信包，信上的封蜡还软着。你撑开包纸，让他插一片折纸，把信和表隔开。他两件都带上了。你多站了一会儿，看桌上信包留下的一小块空地。
      reply: 你知道很快会有回信。艾萨克问，这样信里说的事就能解决吗？你抄下寄出日期，把回信那格照原样留空。信包已经上路，还没有任何承诺回来。
  seacole_balaklava:
    name: 自己找路去的战地客栈
    place: 巴拉克拉瓦
    figure: 玛丽·西科尔
    story: 玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。
    relic: 一只药箱
    relic_desc: 一只旧木药箱，里面分格放着草药和纱布。
    points:
      p1: 6 月 18 日进攻棱堡失利那天，在炮火下护住西科尔在沃龙佐夫路临时医院旁照看伤员
      p2: 她为躲炮弹扑倒摔脱了右手拇指，当场替她复位、上夹板
      p3: 拦下夜里来偷英国旅馆马匹的贼
      p4: 塞瓦斯托波尔陷落以后，劝西科尔和托马斯·戴停下进货、结清账目，不让和约一来他们就破产
    points_fail:
      p1: 那天她没能走到临时医院，伤员在路边等不到包扎。这条分支与历史脱节，员工被送回。
      p2: 拇指只是当场草草包上，这条分支里和历史上一样，再也没长回原来的样子。
      p3: 一夜之间马厩空了大半，旅馆还得去陆军运输营借牲口下山拉货。
      p4: 和约之后军队撤走，存货卖不出去，1856 年 11 月两人在伦敦被宣告破产。
    shift:
      p1:
        was: 1855 年 6 月 18 日，联军进攻棱堡失利，西科尔带着绷带和食物冒着炮火走到沃龙佐夫路旁的临时医院，帮医生照看伤员。
      p2:
        was: 1855 年 6 月 18 日，西科尔为躲炮弹扑倒在地，摔脱了右手拇指，当场包扎，此后再没恢复原形。
        now: '{staff} 当场把关节复位、上了夹板。几周后她的右手照常调药、包扎。'
      p3:
        was: 1855 年，春山的英国旅馆屡遭偷窃，有一天早上起来，马厩里的马大半不见了。
        now: '{staff} 守夜时拦住了牵马的人。第二天旅馆的车照常下巴拉克拉瓦取货。'
      p4:
        was: 1856 年 3 月和约签订后军队很快撤离，西科尔与戴剩下卖不掉的存货和欠款，同年 10 月被人申请破产，11 月在伦敦被宣告破产。
        now: '{staff} 在秋天说动两人停了大宗订货，把赊账一笔笔收回。和约来时存货已经不多，他们清了账离开克里米亚，没有走进破产法庭。'
        who: seacole_balaklava
        bio: 这条时间线里，西科尔从克里米亚回来时没有破产，手里还有一笔本钱。她不必靠众人捐款度日，用自己的钱继续行医和远行。
    vignettes:
      meal: 一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。
      counter: 两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。
      shelf: 店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。
  mitchell_nantucket:
    name: 云过来以前，先标下这块天
    place: 楠塔基特
    figure: 玛丽亚·米切尔
    story: 《玛丽亚·米切尔生平、书信与日记》所录的书信记载，她在 1847 年 10 月 1 日于楠塔基特发现一颗需用望远镜观测的彗星。父亲记下发现，并托首班去大陆的邮船寄信给哈佛天文台主任。
    relic: 一架小望远镜
    relic_desc: 一架小小的黄铜望远镜，镜筒上有海盐的痕迹。
    points:
      p1: 护住第一次离岛邮船上的发现通知，让大陆天文台来得及追看彗星
      p2: 赶在第一班邮船开走前，再寄一份给丹麦方面指定的收件人，免去米切尔后来为金牌补申
    points_fail:
      p1: 家中有观测记录，但第一班邮船把通知落下。天文台没赶上那轮观测，员工因同步失败被召回。
      p2: 通知只寄给天文台，评奖人因未按要求及时通报而不能按例授奖。
    shift:
      p1:
        was: 1847 年 10 月 3 日，米切尔的父亲写信把 1 日的发现告知剑桥天文台，信随发现后首班离岛邮件寄出。
      p2:
        was: 1848 年，评奖人认定收件人不合规定，米切尔最终是在另行陈请后获得丹麦金牌。
        now: '{staff}查清通知应送何处，帮家人把另一个写好地址的信封赶上同一班船。评奖人已有在期限内通报的记录，可以按例审理。'
        who: mitchell_nantucket
        bio: 米切尔凭按期送到的发现报告获得认可。她开始在自己的记录里同时保留观测日、发件日和收件人。
    vignettes:
      field: 帮工只画了一个淡点。你问他下次靠什么把镜头转回这里。云遮上来前，他补了两颗星和一个方向。你把这些抄走，还没有第二次位置可以对照。
      post: 你知道消息得送出海岛。帮工还没写清看见的东西，就想把发现先记上去。你把日期和星野另写一张，留下一行等复核。纸包送去岸边时，那一行仍空着。
      cloud: 云挡住淡点时，你在原地拿着草图等。折纸前你圈一颗熟星，即使淡点不见了，也能从它找回这片天。你带回一个可以再找的位置，收队前仍没人看见第二次。
  caroline_herschel_slough:
    name: 扫天的人
    place: 斯劳
    figure: 卡罗琳·赫歇尔
    story: 卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。
    relic: 一把天区扫描记录尺
    relic_desc: 一把刻着刻度的木尺，用来在星图上标出扫过的天区。
    points:
      p1: 趁薄雾遮住参照星前帮赫歇尔绘定星位，护住她第一颗彗星的观测证据
      p2: 拿首份彗星报告为赫歇尔争取固定的独立观测时段
    points_fail:
      p1: 夜雾遮住参照星，第二夜有光点却没有前一夜的位置可比。历史脱节，员工被召回。
      p2: 每逢兄长用大望远镜，她仍得整晚记他的读数，自己的观测只能挤在空当里。
    shift:
      p1:
        was: 1786 年 8 月 1 至 2 日，卡罗琳·赫歇尔记录了疑似彗星的位置变化，随后寄出观测和附图。
      p2:
        was: 1787 年，卡罗琳·赫歇尔作为兄长的助手领取薪金，她在首次报告中已说明助手工作占去自己的观测时间。
        now: '{staff}让赫歇尔把第一份观测报告连同自己的观测排班交给愿意支持她的人。后来议定助手职责时，每月另留给她几个可自行安排的夜晚。'
        who: caroline_herschel_slough
        bio: 赫歇尔担任有薪助手后仍有固定的自主观测时段。她能提前安排自己的寻彗工作。
    vignettes:
      fixed: 你先记下两颗较亮的邻星，再添模糊的那个。第二张纸虽然挪了位置，仍能靠那两颗星找回原处。
      doubt: 帮手说兴许该擦擦镜片。你问同一片玻璃里的别的星怎样。那些仍然清晰，他便把这处可疑的记号留在纸上。
      lamp: 帮手记时刻时，你用手遮住灯。把灯盖好以后，两张图旁都还留着各自的时刻。
  kovalevskaya_stockholm:
    name: 写在首页的前提
    place: 斯德哥尔摩
    figure: 索菲娅·柯瓦列夫斯卡娅
    story: 柯瓦列夫斯卡娅关于刚体绕定点转动的论文发表于 1889 年的《数学学报》。她找到一种可积分的情形，对转动惯量与质心位置有特定要求。
    relic: 一只陀螺模型
    relic_desc: 一只铜陀螺，轴上刻着编号。
    points:
      p1: 在斯德哥尔摩留备份，核对匿名参赛稿和分存的身份封后，再发给巴黎的评委
      p2: 拿着奖项记录与她已经承担的工作清单，请斯德哥尔摩的校方在旧聘期结束前书面定下续聘和课酬
    points_fail:
      p1: 匿名稿附错了识别封，无法在评定后认回作者，事务所因同步失败召回员工。
      p2: 荣誉已转达给学校，新的课时和薪酬仍只靠私下转述。
    shift:
      p1:
        was: 柯瓦列夫斯卡娅以刚体转动问题的研究获得巴黎科学院 1888 年博尔丹奖。
      p2:
        was: 她在斯德哥尔摩工作多年，于 1889 年获正式教授职位。私人通信还记有关于聘期和薪酬的争议。
        now: 校方提前给出书面聘期及课酬。她可以据此安排下一学期的教学和研究，系里也有可查的承诺。
        who: kovalevskaya_stockholm
        bio: 柯瓦列夫斯卡娅在斯德哥尔摩教学并研究刚体转动。国际评奖及本地的工作条件分别由不同机构决定。
    vignettes:
      conditions: 练习纸上省写成了「一个转动的刚体」。你照首页补回两类条件，一类管转动惯量，一类管质心在哪儿。校对人把两条都誊上纸条。你能抄走这两条更正，刊物还没有印出来。
      diagram: 校对人想拿一只陀螺试。你画了一个固定不动的点，再标出代表质心的另一个点。他拿到下一张图就能分清两个地方。收队时陀螺仍在转，这一转证明不了论文。
      clip: 你把前提折在练习纸外头，又把散开的图纸夹在里面。下一个人会先看见条件，再看到结论。你带回陀螺的轮廓，证明还留在桌上。
  chaco_sun_watchers:
    name: 木板上的第二道影
    place: 新墨西哥州查科峡谷
    figure: 查科峡谷的人们
    story: 公开发表的查科峡谷法哈达孤丘测量记录记下，在一年中的特定时候，接近正午的光会落到螺旋岩刻上。这段练习不给真实的刻纹定年，也不判定其原始用途。
    relic: 一张双影线草图
    relic_desc: 同一块木板摆在原地时描的两道影。
    points:
      p1: 看出影边在哪儿移了一点
      p2: 木板不挪位置，再描一次影边
      p3: 帮工折回来复核时留在标记处
    vignettes:
      two: 帮工把木板转向你，两道线却没法互相对照。你让板脚回到第一记，请他重新描一遍。这回两刻的影边能放在一起看了。下一个季节已经超出你能待的时间。
      sky: 你知道后人还会研究光怎样落到岩面。帮工想先给小板上的影起个名字，你请他先画下板摆在哪里。你带走的是摆放位置图，第二回天清时的影子没赶上。
      wait: 你把一粒小石子搁在木板旁，等能描第二道影，再抬起板。纸上两道线共有一个站位，你都带了回来。只待这么久，还说不清过一年会怎么变。
  rapa_nui_moai:
    name: 采石场的一前一侧
    place: 拉帕努伊岛，拉诺拉拉库
    figure: 拉帕努伊的石像匠人
    story: 拉帕努伊岛上的摩艾，多数是在拉诺拉拉库火山的采石场里，直接从火山凝灰岩中凿出来的，年代估计在十三到十六世纪之间。1722 年 4 月 5 日复活节那天，荷兰航海家雅各布·罗赫芬到达这座岛。
    relic: 一把石斧
    relic_desc: 一片手掌大的深色玄武岩刃，磨出了干净的刃口。
    points:
      p1: 护住一尊运往海边的石像，不让它在路上扑倒
      p2: 帮匠人们读懂 Te Tokanga 背后的岩层，把它的背从山体上多凿开一段
    points_fail:
      p1: 石像在半路扑倒，断成了两截，这条分支里海边少了一尊照史实立起来的石像。
      p2: Te Tokanga 照史实停在半途，这条分支里它的背还和山连着，和今天一样。
    shift:
      p1:
        was: 大约从十三世纪起，拉帕努伊人把一尊尊石像从采石场运到海边的平台上。
      p2:
        was: Te Tokanga 一直没有凿完，背脊连着山体，今天仍躺在拉诺拉拉库的采石场里。
        now: '{staff}替匠人们找准了岩层的走向，它的背从山上多凿开了一段。它后来有没有离开山体，没有记载。'
    vignettes:
      pair: '{staff}先标清哪张是正面、哪张是侧面，才把两张并在一起看，岩上的一道凸脊就不会被当成脸的边。'
      surface: '{staff}走回坡上最先站的地方，在图上补了一支箭头，标出是从哪里看的。'
      height: '{staff}从正面描一遍头顶，又绕到侧面描一遍，把两张纸条在同一处对齐。'
  hargrave_stanwell_park:
    name: 第四只风筝
    place: 澳大利亚斯坦威尔公园
    figure: 劳伦斯·哈格雷夫
    story: 劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。
    relic: 一片箱形风筝的备用签
    relic_desc: 一片给箱形风筝骨架用的备用签。
    points:
      p1: 11 月 12 日，在阵风里护住那串风筝，让他升起来，再平安落回沙地
      p2: 帮他完成这四只风筝的尺寸和做法图，在澳洲留下一份
    points_fail:
      p1: 一阵风把风筝串扯偏了，座椅砸回沙地，这条分支里没有那次离地 16 英尺。
      p2: 这四只风筝照史实只留在他自己手里，这条分支里斯坦威尔公园没有另一份。
    shift:
      p1:
        was: 1894 年 11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。
      p2:
        was: 1894 年，这四只风筝的做法只在哈格雷夫自己手里；他晚年把模型送去慕尼黑，大多毁于二战。
        now: 那四只风筝的图纸在斯坦威尔公园留了一份，没有跟着别的模型去慕尼黑。
        who: hargrave_stanwell_park
        bio: 哈格雷夫 1894 年那四只箱形风筝的尺寸和做法图在斯坦威尔公园留了一份。他的模型后来大多毁于二战，这四只怎样做的，在澳洲仍查得到。
    vignettes:
      four: 升空之后，{staff}把沙滩上铺开的风筝又数了一遍，四只都记在本子上，用括号圈在一起，让下一个读的人知道它们是一起飞的。
      tag: 一张签从骨架上扯脱了，{staff}沿着湿沙往回找，找到后重新打了个结系上。
      lift: 先放一只风筝试风时，{staff}和帮手们站在沙丘上，学会了拉着绳该往哪边跑。
  sun_yat_sen_guangzhou:
    name: 从铜像到一所新大学
    place: 广州
    figure: 孙中山
    story: 你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。同一段日子里，他星期天在高等师范的礼堂演讲，讲稿在几个人手里来回走，后来成了一本书。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。
    relic: 孙中山铜像
    relic_desc: 中山大学校园里的孙中山铜像。它是通往 1924 年广州的穿越媒介，不是古董，不能出售。
    points:
      p1: 替筹备处排好城外的招生告示张贴路线，交给送告示的人
      p2: 经人引荐走访三所学校，赶在第一次筹备会议前交回一张汇总单
      p3: 替筹备处踏勘备选校址，在石牌定下来之前交回一张比较图
      p4: 核对三校的毕业名单，为 6 月 21 日的典礼交上一份统一名册
      p5: 跟筹备处的人去石牌，把新校地的界桩一根根立稳
    points_fail:
      p1: 这条分支里，招生告示只贴在城里，城外的学生知道消息时，报名已经开始了。
      p2: 第一次筹备会议照史实召开，三所学校的难处仍是各说各的，没有一张合在一起的单子。
      p3: 选址照史实定在石牌，筹备处桌上没有一张把几处校址画在一起的图。
      p4: 6 月 21 日的毕业典礼照常举行，筹备处仍要分开查阅三份名单。
      p5: 石牌的校地照史实只划在纸上，地上一根界桩也没有立。
    shift:
      p1:
        was: 1924 年 6 月 9 日，国立广东大学委托各省教育厅招生；6 月 10 日，预科考试开始报名，原计划招 520 人。
        now: 这条分支里，城外的路口和码头上也贴着招生告示。
      p2:
        was: 1924 年 3 月 3 日，第一次筹备会议召开，议题里头一件是三所学校学生的毕业问题。
        now: 这条分支里，会上摆着一张把三所学校的难处列在一起的单子。
      p3:
        was: 1924 年，各校分散各处，管理不便，孙中山命邹鲁择石牌为新校址，当年划定土地。
        now: 这条分支里，选址的文书旁边多了一张把几处校址和石牌画在一起的图。
      p4:
        was: 1924 年 6 月 21 日，邹鲁就任国立广东大学校长，同一天为原三所学校的毕业生举行毕业典礼。
        now: 这条分支里，筹备处办典礼时有了一份核对过的统一名册。
      p5:
        was: 1924 年孙中山命邹鲁择石牌为新校址，可新校舍 1933 年才动工，1934 年秋第一批学院才迁入。孙中山 1925 年 3 月 12 日去世，生前没有见到。
        now: 这条分支里，11 月他离开广州之前，石牌校地的界已经一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 这条时间线里，孙中山离开广州之前，新校址石牌的界已经立定。
    shift_all: 五件差事都办妥了。回来再读孙中山后来亲笔题写的校训，才看出这五件事与「博学、审问、慎思、明辨、笃行」的呼应。
    vignettes:
      slips: 一位编出来的办事员正要抄一页稿子，稿上有一张签条盖住了两行。你问他签条是谁的字，稿子又是谁的字。他先抄了稿子，签条留在原处没有动。
      back_row: 一位编出来的学生找不到座位，老是站起来张望。你往里挪了挪。他坐下来听完了后半场，一句话没说，散场时朝你点了点头。
      hundred: 你在本子最后一页画正字，一天一笔。画满一百天的时候，一位编出来的办事员问你在数什么。你说，日子。
  david_fleay_healesville:
    name: 等科里自己出来
    place: 维多利亚州希尔斯维尔野生动物保护区
    figure: 戴维·弗莱
    story: 1943 年末，希尔斯维尔保护区的鸭嘴兽吉尔孵出一只幼兽，后来取名科里。1944 年 1 月，戴维·弗莱和同事打开巢穴，确认幼兽已经孵出。2 月 26 日，弗莱第一次观察到科里出洞游水。
    relic: 一把木饲料勺
    relic_desc: 一把小木勺，柄已经磨光了。
    points:
      p1: 挡住落进洞口的松土，让弗莱来得及把科里送回巢里
      p2: 把干叶备在吉尔的新洞口，让它有材料补回开巢时失去的垫窝
      p3: 科里在全家亮相前躲进洞里，劝保护区放下铁锹，等它自己出来
    points_fail:
      p1: 弗莱还没来得及把科里送回去，松土就堵住了洞口。这条分支失去了首次成功育成的记录，{staff}当天因同步失败被召回。
      p2: 吉尔另挖了洞口，科里像史实中一样，有好几周没有垫窝。
      p3: 约好的钟点过了，保护区还是用了铁锹。科里被带出来时，多数观众已经走了。
    shift:
      p1:
        was: 1944 年 1 月 3 日，弗莱把幼兽送回受扰的巢里，吉尔后来继续把它养大。
      p2:
        was: 1944 年 1 月 3 日开巢后，吉尔清出了原有的垫窝，幼兽有好几周没有垫窝。
        now: '{staff}把干叶留在吉尔傍晚外出觅食的路上，吉尔衔了一些回去重新垫窝。'
      p3:
        was: 1944 年 3 月，全家亮相时科里躲进地道，保护区动土把它挖出来时，多数观众已经离开。
        now: '{staff}拿晚间观察记录说服饲养员收起铁锹，请已经到场的人在池边安静等候。此后的展示也沿用这个办法。'
        who: david_fleay_healesville
        bio: 弗莱在希尔斯维尔开始按晚间的观察记录安排展示，让动物自己决定什么时候露面。他后来把供访客等候的位置留在水边。
eras:
  broad_street_1854:
    vignettes:
      odd_address: 虚构书记员埃伦傍晚要交街单，正想划掉一个离泵太远的地址。你问那家人的水是从哪儿来的。露丝能认准门牌，还得等打水的人来说。埃伦搁下笔。那一栏可以空，地址先别划掉。
      witness: 虚构邻居露丝把地址念了几遍，埃伦就要收表。你请露丝照脚走的路说一遍。到说起转弯，她停下来，回手指向那口泵。埃伦亲手补了走法。真正提水的人还没到。
      street_list: 埃伦可以拿了原册就走，也可以等你抄完。你念门牌，她用指尖挨个跟过去。有个记号该再挪一户。原册还是按时交了出去，校过的双栏副页留在桌上。
    name: 伦敦宽街 1854
    short: 宽街
    place_name: 伦敦苏荷区宽街
    tags:
      - medical
      - infection
      - cholera
      - c19
      - london
      - history
    event_titles:
      door_block: 被拒之门外
      time_strain: 时间错位
    plots:
      microscope:
        name: 送斯诺一台显微镜
        desc: 让他能更清楚地给人看水里的东西。
        character: 约翰·斯诺
        article: people:snow
      germ_theory:
        name: 把细菌致病的理论讲给斯诺
        desc: 需要微生物学的工艺，这个时代还没有。
        character: 约翰·斯诺
        article: people:snow
    blurb: 霍乱，一台水泵，一位还没被人听进去的医生。近，成本低，卫生知识和药物的效果清楚。
    handle_label: 泵柄拆除
    protagonist: 约翰·斯诺
    protagonist_role: 1849 年已提出霍乱可经水传播的医生
    stay: 停留一个事务所日，历史 30 天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: 1854 年 8 月 31 日夜间，伦敦苏荷区宽街一带暴发霍乱。
          check: true
        - text: 当时流行的解释是瘴气，也就是脏空气。
          check: true
        - text: 斯诺在 1849 年已经提出霍乱经水传播，多数同行不接受。
          check: true
        - text: 9 月 8 日，宽街水泵的手柄被拆走。
          check: true
        - text: 拆泵柄时，疫情已经在下降，很多居民早已离开。
          check: true
      regret:
        - 救得了今天的，救不了明天的。主时间线上，泵柄拆在第八天。
        - 数据与地图比药更重要，但让人相信数据需要时间。
    events:
      door_block_stubborn: 邻居拦在门口，说这是瘴气，不能让外人碰病人。{staff}固执，没有退让，被赶出一户，丢了 {d.ors_stock:i} 包补液。
      door_block_stubborn_empty: 邻居拦在门口，说这是瘴气，不能让外人碰病人。{staff}固执，没有退让，被赶了出来。
      door_block_insist_empty: 邻居拦在门口，说这是瘴气。{staff}站在门口把话说完，被推了出来。
      door_block_insist: 邻居拦在门口，说这是瘴气。{staff}站在门口把话说完，被推了出来，丢了 {d.ors_stock:i} 包补液。
      door_block_appeal: 邻居拦在门口，说这是瘴气。{staff}没有硬闯，转身去找斯诺，请他出面说句话。
      door_block_yield: 邻居拦在门口，说这是瘴气。{staff}退了一步，没有吵，浪费了半天。
      time_strain: '{date}，{staff}听见钟声错了半拍。这条分支离史实越来越远，人明显更累了。'
    star_points:
      convince: 说服斯诺
      trust: 赢得街坊的信任
      handle: 比史实更早拆掉水泵手柄
    milestones:
      first_treat: '{date}，{staff}配好了第一杯补液。一个人开始能说话。'
      first_protect: '{date}，{staff}把第一批氯片分到了愿意听的几户，教他们把水烧开或者加药。'
      met_snow: '{date}，{staff}在街口见到了斯诺。他听得很认真，但一直在问：证据在哪里。'
      snow_trusts: '{date}，斯诺开始把{staff}当作自己人，愿意把他挨家挨户记下的名单拿出来对照。'
      snow_convinced: '{date}，斯诺不再只是怀疑水。他有了足够的名单，也相信了这个陌生人说的话。'
      board_moves: '{date}，教区委员会的人开始松口，说也许可以先停一下水泵。'
      handle_off_history: '{date}，水泵手柄被拆走。斯诺的记录注明拆柄日为9月8日。'
      handle_off_early: '{date}，水泵手柄比史实早 {advance_days:1} 天被拆走。主时间线不变，只有这条分支里是这样。'
      trust_won: '{date}，街角的人不再把{staff}拦在门外，有人主动来敲门。'
      exhausted: '{date}，{staff}累得手在抖，被迫停下来休息。'
      outbreak_fades: '{date}，病人数降到了个位数附近。很多人已经离开了这一带。'
    summary:
      near_death: '{staff}在宽街倒下，被回收符接了回来。保住了命，付出了代价。'
      stay_and_gifts: '{staff}完成了任务，却没有回来。离开时留下一封信，说想多陪陪这里的人。以后会有礼物寄来。'
      gave_up: '{staff}提前放弃，回到了现代。{staff}说，这里不属于自己。'
      legend: '{staff}在宽街留下了传说，比史实早 {advance_days:1} 天，泵柄被拆走。'
      perfect: '{staff}在宽街完成任务，平安回来。模型基准的死亡人数为 {base_D:i}，这条分支模拟为 {D:i}。'
      scramble: '{staff}被邻居一次次拦在门外，最后狼狈地逃了回来，带着一个笑话。'
      modest: '{staff}在宽街待了三十天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 我最后还想着，床边的那个人有没有人陪。
        - text: 我以为我能多撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每一个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家。就是这样。
        - text: 我不是做这个的料。
      legend:
        - text: 我只是把该告诉他们的告诉了。
      perfect:
        - trait: kind
          text: 我救得了今天的，救不了明天的。
        - trait: curious
          text: 原来是这样，水真的会带着病走。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们早晚会明白。就是晚了点。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 话我都说了。信不信是他们的事。
        - text: 如果多带一样东西，也许能多救一户人家。
    hints:
      lost_ors: 补液被丢了很多，下一次可以让员工让步，或者多带一点。
      unused_protect: 氯片没用完。受限于邻居的信任，不是氯片不够。
      unused_ors: 补液没用完。可能是员工把时间花在别处，或者病人没让进门。
      ally_gap: 斯诺的证据还不够。手册能帮他，前提是员工愿意花时间陪他。
      none: 换一项配置再派一趟，同一个种子，对照起来最清楚。
  vienna_1847:
    vignettes:
      denominator: 虚构账房埃米尔抄完了死亡人数，收治簿还在病房。总数摆在眼前，玛尔塔先问来过多少人。你帮她在总数旁给两个病房各留一格。下一班来时，埃米尔手里有一个待追查的问题。
      ward_key: 虚构助产士玛尔塔要去问另一间病房的人数，埃米尔两张单上的简称却很像。你等她说完她要去的病房。她亲手把全名写到该带的那张上，才穿过走廊。
      tables: 接班人已在门口，埃米尔可以直接递上两页，也可以先跟你读过表头。你念到月份，玛尔塔发现有一张提前一个月归了档。下一班接到了改好的副表，月底的最终数字还要等。
    name: 维也纳总医院 1847
    short: 产科诊所
