        p3: 维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。
        p2: 下午，三幅画用麻绳捆好，被人扛出了门。卡塔琳娜把钱在厨房桌上数了两遍，拨出一小摞用布包好，放进了围裙口袋。
        p1: 来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。
    relic: 一枚珍珠耳环
    relic_desc: 一颗小珍珠，是他常画的那种。
    points:
      p1: 年底之前，护住画室里那幅《绘画艺术》，不让它被债主拿去抵债
      p2: 帮他把战后压在手里的几幅画卖出去，缓一缓这家人的债
      p3: 让他知道自己的画会被记住
      p4: 十二月中旬之前，治好他，让他活下来
    points_fail:
      p1: 《绘画艺术》在年底被债主拿去抵了债，次年二月卡塔琳娜无画可转给母亲，这条分支与历史脱了节，员工被送回。
      p2: 画照旧压在手里，一幅也没卖出去，这条分支里这家人的债照旧一天天重下去。
      p3: 他照旧不知道这些画以后会怎样，这条分支里没有人告诉过他，两百年后会有人把它们一幅幅找回来。
      p4: 十二月照史实过去，他在一天半里由好好的人到了去世，这条分支里卡塔琳娜照旧一个人带着十一个孩子面对那些债。
    shift:
      p1:
        was: 1676 年 2 月 24 日，卡塔琳娜·博尔内斯把《绘画艺术》转到母亲玛丽亚·廷斯名下，免得被拿去抵债；维米尔负债时也没有卖掉它。
      p2:
        was: 1672 年战事以后，维米尔自己的画卖不出去，经手的别家画作也压在手里；卡塔琳娜后来说这是家里欠债的缘由。
        now: 那个十二月有几幅画找到了买主，面包账和别的欠债暂时不再往上涨。
      p3:
        was: 1675 年去世以后，维米尔被冷落了将近两百年，到 1860 年代托雷-比尔热的研究才让他的画重新被人认出。
        now: 有人告诉过他，这些安静的屋子以后会被人一幅幅找出来、认回来。
      p4:
        was: 1675 年 12 月，据卡塔琳娜后来的陈述，他被债务和孩子压着，一天半里由好好的人到了去世；12 月 15 日葬于代尔夫特，年四十三。
        now: '{staff}陪他过了那个十二月，那一天半没有到来。他回到代尔夫特的画室，又画了些年，卡塔琳娜和十一个孩子没有在那个冬天失去他。'
        who: vermeer_delft
        bio: IF 线里，维米尔挺过了 1675 年的十二月，又在代尔夫特画了些年，陪这一家把债慢慢还清。
    vignettes:
      bread: 12 月 5 日早上，天还没大亮，运河上起着雾，{staff}帮面包铺的伙计沿着老朗恩代克街送面包。到了一家门口，伙计把面包递进去，没收钱，在小本子上画了一道。他说老板每个星期六都对着这一页嘟囔，每个星期一照样叫他把面包送来。
      frames: 一月里，{staff}在一家画框铺里待了一上午，替师傅按住斜角，等胶干，铺子里一股熬胶的腥味。靠墙的画框有一半空着。师傅说自从七二年法国人打进来，人们买框子是为了装镜子，不是装画，镜子至少不会让人付两回钱。
      peat: 二月中旬，{staff}帮一个卖泥炭的女人在集市广场上码湿泥炭块，脚下的石板结了一层薄霜。她朝手指哈气，说今年冬天全代尔夫特都在烧便宜货，整座城闻起来像一条趴在炉边的湿狗。
  rembrandt_amsterdam:
    name: 儿子之后
    place: 阿姆斯特丹
    figure: 伦勃朗
    story: 1668 年 9 月 7 日，伦勃朗的儿子提图斯在阿姆斯特丹下葬，离他成婚只有半年。1669 年 3 月，提图斯的女儿蒂蒂娅出世。这一年，伦勃朗画了几幅署年 1669 的自画像。他在 1669 年 10 月 4 日去世，四天后葬进一处租来的墓穴；他最后一幅画没有画完。10 月 21 日，提图斯的遗孀也下葬了。
    story_prose:
      opening:
        - 1669 年 9 月，阿姆斯特丹。六十三岁的画家伦勃朗画过《夜巡》，1656 年破产，晚年负债住在这座城里。一年前，他唯一长大成人的儿子提图斯下葬，离成婚才半年；今年 3 月，提图斯的女儿蒂蒂娅出世。这一年他画了几幅署了年份的自画像，画架上还立着他的最后一幅画。
        - 史实里，他在 10 月 4 日去世，四天后葬进一处租来的墓穴；画架上那幅画没有画完，如今收在斯德哥尔摩的国立博物馆。两个星期后，提图斯的遗孀也下葬了。在这条分支里，运河边有个颜料商，河上有个撑泥炭船的船夫，街上有个摇木响板的守夜人。
        - 这一趟用得上一种人：拿过画笔、手稳的人，或者有一双画画人的眼睛、手更稳的人，替他研好颜料、扶稳画布。
      outcomes:
        all: 10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画还立着，那个老人的两只手比先前多了几笔，调色板搁在一边，上面的颜色已经干了。
        p1: 10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画还立着，那个老人的两只手比先前多了几笔，调色板搁在一边，上面的颜色已经干了。
      none: 10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画停在他力气断掉的地方，笔插在罐子里，笔毛里的颜料慢慢干了。
      not_admitted: '{staff}没能进那户人家，只在运河边的颜料铺里推过几天研磨石。有一回，铺子里包好了一罐铅白，说是给运河那头的老画家的，一直没人来取，罐子在柜台上放了一下午。'
      points:
        p1:
          trait_artistic: 9 月 29 日上午，伦勃朗坐在画室的画架前，手里的笔停了好一阵才落下去。画上一个老人双手托着一个婴儿，脸上的光还是暗的。{staff}有一双画画人的眼睛，手也稳，把他要的颜色研好，一小堆一小堆排在调色板上，画布松了，就替他扶住画框。下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。
          else: 9 月 29 日上午，伦勃朗坐在画室的画架前，手里的笔停了好一阵才落下去。画上一个老人双手托着一个婴儿，脸上的光还是暗的。{staff}拿过画笔，手稳，把他要的颜色研好，一小堆一小堆排在调色板上，画布松了，就替他扶住画框。下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。
      excerpts:
        p1: 下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。
    relic: 一支画笔
    relic_desc: 一支磨旧的画笔，笔毛里的颜料已经干了。
    points:
      p1: 在他最后几周里，帮伦勃朗把画架上那幅画往下画一段，别让最后一幅画停在他力气断掉的地方
    points_fail:
      p1: 画架上那最后一幅画照史实没画完，留在他的画室里。
    shift:
      p1:
        was: 1669 年 10 月 4 日，伦勃朗在阿姆斯特丹去世。他画架上的最后一幅画在他去世时没有画完。
        now: '{staff}替他研好颜料、扶稳画布，陪他过了最后几周。十月之前，画架上那幅画在他自己手里又往下走了一段。'
        who: rembrandt_amsterdam
        bio: 这条时间线里，伦勃朗在 1669 年 9 月一直画着最后那幅画，把它画得比历史上更远。它离开画室时，更接近他想要的样子。
    vignettes:
      colours: 9 月 22 日下午，{staff}在玫瑰运河边一家颜料铺的后屋里推研磨石，磨一板铅白，磨到两条胳膊都酸了，窗缝里一阵阵进来运河上的潮气。颜料商说如今的画家都要白得像奶油一样滑，他真想卖他们一罐奶油，看看谁分得出来。
      barge: 9 月 26 日，{staff}帮一个船夫撑着一船泥炭沿玫瑰运河走，船头的泥炭湿得发黑。他说今年秋天水浅得很，每过一座桥船底都要刮一下，他已经开始跟桥下的石头一块块打招呼了。
      watchman: 十一月中旬，{staff}陪守夜人冒雨走了一圈，石板路上的积水映着灯笼。他在每个街角摇一下木响板，报一声时辰。他说这个月的雨连响板都淋进去了，摇起来像在咳嗽。
  gaudi_barcelona:
    name: 被电车撞倒
    place: 巴塞罗那
    figure: 安东尼·高迪
    story: 1926 年 6 月 7 日傍晚，七十三岁的安东尼·高迪在巴塞罗那的大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐，路人拦了几辆出租车都不停。6 月 10 日，他在医院去世，12 日安葬在他主持了四十三年的那座建筑地下。多梅内克·苏格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，图纸和石膏模型大多毁掉。
    story_prose:
      opening:
        - 1926 年 5 月底，巴塞罗那。七十三岁的加泰罗尼亚建筑师安东尼·高迪把晚年都放在城里一座还没完工的大建筑上。他的设计用取自自然的曲线，工地上的工房里摆满了图纸和石膏模型。前一年，东立面的第一座钟塔刚刚完工。
        - 史实里，6 月 7 日傍晚他在大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐倒在那里，路人拦了几辆出租车都不停，直到一名国民警卫逼一辆车把他送去诊所，再转进医院；6 月 10 日他在医院去世。弟子多梅内克·苏格拉涅斯接手主持工程。十年后，1936 年 7 月 20 日，工房被烧，里面的图纸和石膏模型大多毁掉。在这条分支里，大道的电车上有个爱拉铃的售票员，工地上有个跟着风声哼调子的年轻石匠，中午有个来卖水的女人。
        - 这一趟用得上几种人：懂医护、带着急救包的人，心善或守得住、身子骨结实的人，或者带着能治伤的器材的人，在电车道边立刻把他送医；做过木工、管过档案的人，或者手巧、有条理的人，把进行中的工程和工房钥匙交接清楚；同样的人再多一点脑子或定力，说得动苏格拉涅斯，把关键模型的照片、尺寸和图纸另存一处。
      outcomes:
        all: 那年夏天，高迪又回到了工房。十年后，柜子烧了，有人从另一处取回一本照相册，翻开一张模型的照片，背面写着当年的比例尺。
        p3: 那年夏天，高迪又回到了工房。他坐在门口的矮凳上看石匠们干活，午后的风从钟塔的孔洞里穿过去，吹出一声哨音。
        p2: 6 月 12 日，高迪下葬。十年后工房被烧，有人从另一处取回一本照相册，照片背面还写着当年的比例尺。
        p1: 6 月 12 日，高迪下葬。苏格拉涅斯接手主持工程，工地上的锤子声没有停，石匠们照着那张清单往上砌。
      none: 6 月 12 日，高迪下葬。十年后，1936 年 7 月 20 日，工房被烧，柜子里的图纸和石膏模型大多毁掉。
      desync: 6 月 10 日，石匠们在工房门口等了一上午，钥匙不知道在谁手里，进行中的活一样也说不清。{staff}被召回时，那个年轻石匠正坐在一块还没放上去的石头上，等着有人来叫他。
      not_admitted: '{staff}没能进那座工地，只在大道上坐过几回电车。远处的脚手架中间立着一座钟塔，风大的下午，隔着几条街也听得见一点哨音。'
      points:
        p3:
          class_medical: 6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}懂医护，一分钟内跪到他身边，按住他的伤处，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。
          trait_kind: 6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}心善，见不得一个老人倒在路上没人管，一分钟内跪到他身边，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。
          trait_vigil: 6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}一直留神着路口，一分钟内跪到他身边，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。
          else: 6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}带着纳米医疗箱，一分钟内跪到他身边，照着说明给他用上，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。
