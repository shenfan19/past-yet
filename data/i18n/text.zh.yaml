          check: true
        - text: 1924 年 1 月 27 日到 8 月 24 日，孙中山利用星期天在高等师范的礼堂演讲，共十六讲。黄昌谷每一讲都随同速记，邹鲁校读誊清的讲稿并贴签注条，孙中山亲笔修正。
          check: true
        - text: 邹鲁 2 月 21 日接手筹备。2 月 24 日他在礼堂召集三所学校的学生宣布此事，3 月 3 日开第一次筹备会议，议题里有三所学校学生的毕业问题。
          check: true
        - text: 头几讲在三月底印成单行本，孙中山 3 月 30 日为它写了序。6 月 3 日邹鲁呈报归并三校的办法，6 月 6 日获批准。
          check: true
        - text: 9 月 19 日开学，11 月 11 日举行成立典礼，用了孙中山写的校训。孙中山 1925 年 3 月 12 日在北京去世，1926 年这所大学改名为国立中山大学。
          check: true
