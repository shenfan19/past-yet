trait_notes:
  kind:
    pro: 容易赢得信任，照护真诚。
    con: 容易被敌意所伤，也容易让步。
  curious:
    pro: 留意到别人没留意的，敢问别人不问的。
    con: 容易被别的事分心。
  glib:
    pro: 靠嘴进得去门，容易说动人。
    con: 太会说的人不一定被信。
  sensitive:
    pro: 容易发现不对劲，也能体会别人的感受。
    con: 体质较弱，更容易染上疾病。
  bold:
    pro: 敢顶住阻力和危险。
    con: 粗心，容易漏掉该留意、该照料的。
  patient:
    pro: 能等，肯花时间把事情慢慢做好。
    con: 遇到突然的变化反应偏慢。
  methodical:
    pro: 做事有章法，记录和核对一丝不苟，被逼也不松口。
    con: 死板，场面没有章法时容易吃力，也不擅长说动别人。
  hardy:
    pro: 身体扛得住，生病也比别人少。
    con: 粗线条，容易看漏细节。
  charismatic:
    pro: 一站出来就有人愿意听、愿意跟。
    con: 精力分给了人，坐不住做细活。
  quiet:
    pro: 不惹眼，看得多，耐得住。
    con: 不爱争，说不动别人。
  wanderer:
    pro: 底层出身或惯了在外，不怎么想家，不太受敌意和熬夜的影响，吃得了苦。
    con: 不容易交心，别人也不太信任，在上层人面前不自在，话说不到点上。
  attached:
    pro: 对人用情很深，肯守着。
    con: 离家越久越想家，容易撑不下去。
  streetwise:
    pro: 市井里练出来的反应，吃了亏也能找条出路。
    con: 耐不住性子，难做长久的事。
  scholarly:
    pro: 读得多，能和学者平等地谈。
    con: 体力一般，也容易生病。
  handy:
    pro: 手艺扎实，能把东西做到位。
    con: 嘴笨，不擅长说服别人。
  artistic:
    pro: 对美和声音特别敏锐，能打动人。
    con: 心思容易飘走，也容易想家。
  calm:
    pro: 事到临头反而稳，照护病人尤其好。
    con: 慢半拍，容易错过细小的变化。
  cosmopolitan:
    pro: 去过很多地方，同陌生人容易搭上话。
    con: 什么都见过，没耐心守着一件事。
  cheerful:
    pro: 爱笑，愿意帮忙，带得起气氛。
    con: 想得简单，看不出暗处的问题。
  vigil:
    pro: 越晚越清醒，守夜熬更不容易走神。
    con: 白天长途劳累就垮。
  faithful:
    pro: 有坚定的信念，难关里不动摇。
    con: 对与信念不合的事不容易接受。
  skeptical:
    pro: 凡事要证据，不轻信，也容易看出破绽。
    con: 对人先有戒心，别人也不容易对他敞开。
  ambitious:
    pro: 目标明确，肯争取，也敢开口要。
    con: 心里装着事，容易忽略身边人的难处。
mainline:
  open:
    name: 开张
    desc: 事务所挂牌，一间店面，三个员工。
  first_trip:
