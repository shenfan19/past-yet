    vignettes:
      parts: 读者卡在整道题里。你标出能先解决的一小问。他先做完这一部分，才翻到写答案的那页。
      claim: 另一位读者说结果显而易见。你请他指出究竟是哪一步让结果这样明白。他们重读例子中段，两人之前都没在这里停过。
      contents: 你把讲方法的一页同例题一起翻开。读者把纸签从自己喜欢的那条规则，移到了能看见它如何使用的一页。
  leeuwenhoek_delft:
    name: 一滴水里的世界
    place: 代尔夫特
    figure: 列文虎克
    story: 1676 年 10 月，列文虎克从代尔夫特写信说，一滴胡椒水里有成千上万的小动物。伦敦皇家学会来信询问怎样核实他的观察。次年 5 月到 8 月，代尔夫特一带有八人先后凑到透镜前看过，写下证词，10 月 5 日随信寄往伦敦。后来，胡克在学会上让会员们亲眼看到了小动物。
    story_prose:
      opening:
        - 代尔夫特，列文虎克把黄铜板递给第一位来客。来客闭一只眼，还是什么都没看见。旁边一位已经拿起笔，却在等他说看到了什么。
        - 1676 年，列文虎克把水里小动物的观察寄往伦敦。次年，代尔夫特有八人陆续签下证词，10 月 5 日寄出。你能守住第一批见证的交接，再在封口前核对十月的每一张附页。
        - 找会引导别人看清细处的人先守在透镜旁。秋天要用能核署名和邮封的员工把信送出。
      points:
        p1: 第一位见证人把黄铜板转过来，原先那点亮光不见了。列文虎克请他把眼移回来，直到又能看见。他写下小动物活动的样子，你把纸反扣在桌上，请第二个人自己看完再拿笔。两位写完才交换纸张，对着各自的字同时笑了一下。
        p2: 十月的封套里已经放进了信。你从外面拈起一张晚到的证词，请列文虎克念出联名处，再照日期逐张核。最后一页的签名不在你习惯找的那一角。手指掀开那折纸，才把最后一个名字补进附页单。
      outcomes:
        all: 证词随信离开代尔夫特。读信的人能把一行说法查回一张署了名的纸；随后胡克在伦敦也让同事亲眼看见。
        p1: 最早两位见证人已经写下了各自的观察。十月那只邮封后来有一页没对齐。
        p2: 你按署名理好了桌上的纸。清点仍缺最初的证词，寄件无法对上历史。
      none: 透镜还立在原处，来客只看过一眼，桌边没有留下可寄的证词。
      not_admitted: 来客与列文虎克的约定没有你的名字。学徒把黄铜板拿进屋内，带上了门。
      desync: 最早的签认或十月寄出的附件已缺，证词与旧日记录不能相合。事务所召回员工。
      excerpts:
        p1: 两位写完才交换纸张，对着各自的字同时笑了一下。
        p2: 手指掀开那折纸，才把最后一个名字补进附页单。
    relic: 一块小黄铜透镜板
    relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
    points:
      p1: 给头两位见证人留出看透镜的时间，请他们用自己的话写下小动物是怎么动的
      p2: 在代尔夫特核对十月的邮封，封口前把散开的证词逐张对回署名
    points_fail:
      p1: 两位见证人还没写下所见就离开了。头一份证词脱节，事务所召回{staff}。
      p2: 信寄出去了，还有一页证词落在桌上。寄件记录脱节，事务所召回{staff}。
    shift:
      p1:
        was: 1677 年 5 月 18 日，两位见证人为所见的小动物签下证词。此后几个月，另有六人也留下了证词。
      p2:
        was: 列文虎克在 10 月 5 日从代尔夫特发出的信中附上见证人的证词。11 月，胡克在伦敦皇家学会演示了小动物。
    vignettes:
      motion: 通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。
      label: 桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。
      read: 你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。
  newton_cambridge:
    name: 苹果与月亮服从同一条定律
    place: 剑桥
    figure: 艾萨克·牛顿
    story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。送去付印的誊清稿不是他的笔迹，抄写的人是汉弗莱·牛顿，这几年做他的抄写助手，与他不是亲戚。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
    story_prose:
      opening:
        - 剑桥的抄写桌堆着发往伦敦的纸。汉弗莱·牛顿刚抄清一个图名，艾萨克·牛顿从另一张样页找出同一处错字。外面的信使已经敲门。
        - 史实里，《自然哲学的数学原理》于 1687 年在伦敦刊行。经办印刷的哈雷在 7 月 5 日报信说已印完。这里可以把最后一批勘误送齐，首版到手之后，还能让读者给一个能查回原页的更正地址。
        - 会读页码或命题的人先看打包稿。适合整理往来信的人可以跟牛顿约定核读和记下更正的办法。
      points:
        p1: 两张改动说的是同一个图，其中一张少了卷号。你和汉弗莱把两份并好，请牛顿读回最后想保留的写法。信使重复了一遍地址，勘误单按卷号从桌这头送到他手里。他收下纸束，桌上只剩改过标题的旧页。
        p2: 第一封读者来信圈了一个数，却没说在哪一页。你把样书递给牛顿，问图编号能不能用作第二个标记。他找回命题后，在更正簿上让你先写来信日期，批准与否留给他自己填。下一封信到时，书记照着这个位置找到了同一幅图。
      outcomes:
        all: 哈雷写信说书已经印完。剑桥这边的簿子刚写完第一栏，下一位读者来借书时还能看见怎么留更正。
        p1: 最后一批勘误送到哈雷手里，书按史实印出，后来的改动仍散在样书和信件里。
        p2: 更正簿能按命题找到页，但发去伦敦的勘误另出差错。回程保留了登记办法。
      none: 桌上两张勘误仍互相重叠。后来有人看到不同的改字，已经分不清哪张先写。
      not_admitted: 信使说包件要从抄写人手里收。你在门外听见有人把两张相似的纸翻得哗哗响。
      desync: 哈雷少收到一份最终勘误。刊行的文本已与史实错开，事务所召回员工。
      excerpts:
        p1: 他收下纸束，桌上只剩改过标题的旧页。
        p2: 下一封信到时，书记照着这个位置找到了同一幅图。
    relic: 一块玻璃三棱镜
    relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
    points:
      p1: 把牛顿最后一批勘误按卷和页打包，从剑桥及时发给伦敦的哈雷
      p2: 首版送达后，和牛顿约定如何收录读者的更正，让他能在剑桥按命题和页码核验答复
    points_fail:
      p1: 同一处改字邮寄了两个版本，哈雷收不齐末批勘误，事务所因同步失败召回员工。
      p2: 读者信各用各的页码，较早的改动散落在信和自己的样书里。
    shift:
      p1:
        was: 1687 年 7 月 5 日，哈雷来信说《原理》已经印完，末批勘误及时赶上。
      p2:
        was: 牛顿在自己的首版留下注记。后来修订再版仍是长期工作。
        now: 学院里有一份按命题编号的更正簿。借书的人可以填下所见的错误，得到牛顿同意的修改会连日期另记。
        who: newton_cambridge
        bio: 《原理》在剑桥写成，在伦敦付印。哈雷经办印刷，书出以后牛顿仍修改它。
    vignettes:
      apple: 你问学院的一位杂役：「听说苹果砸了他的头？」这位杂役是游戏里编出来的。他接着扫地：「砸没砸我不知道。你倒说说，月亮怎么不掉下来？」你一时答不上，回头去看那一页。苹果这件事，要再过六十五年才有人写下来。
      hand: 誊清的稿子不是书上署名那个人的笔迹。杂役说，抄写的是汉弗莱先生，也姓牛顿，不是亲戚。你把这一条记在本子上，没有去打扰他。
      diagram: 你在一张废纸上画出月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。杂役不认得拉丁文，盯着那支箭头看了好一阵。
  bach_leipzig:
    name: 眼医进城的那个春天
    place: 莱比锡
    figure: 约翰·塞巴斯蒂安·巴赫
    story: 到 1750 年春，巴赫的视力已差到难以读写。游方眼医约翰·泰勒在莱比锡给他动刀，术后并发症又引出了第二次手术。同年 7 月 28 日，巴赫去世。
    story_prose:
      opening:
        - 莱比锡的谱架靠向窗口。巴赫听见来帮忙的人把纸倒过来，便请他先读纸上的声部。约翰·泰勒在城里行医，家里有人等巴赫答复哪天见他。
        - 1750 年春，泰勒为巴赫做眼科手术，后来又进行第二次。巴赫当年 7 月 28 日去世。这个分支里，他能听到另一位医护人员的意见，再决定是否改用别人读谱帮忙。
        - 派有医护经验的人去听他自己的顾虑，让识谱的员工确认他愿意由谁代读。进屋前，先问家人什么时段方便他谈。
      points:
        p1: 他把谱纸往来客面前推了推。你请另一位医护人员先听巴赫把最担心的事说完，再说眼下可以先等一等。巴赫请家人回话推掉预约，叫熟识的歌者下午来替他念两个声部。第一段弹完，他让那位歌者把刚才的休止再从头念一次。
      outcomes:
        all: 这一春巴赫把几次读谱排到光足的时候。有人读，他扶着琴沿听。七月家中仍传出他的死讯。
        p1: 泰勒没有来动手术。下午光照到谱架时，帮手按巴赫自己的要求从该停的地方读起。
      none: 约好的拜访照常进行。后来家人收拾谱架，桌上还压着没人来得及代读的一页。
      not_admitted: 家人把等回话的人请到外间。没排上见面，你听不到里面有人讨论什么。
      excerpts:
        p1: 第一段弹完，他让那位歌者把刚才的休止再从头念一次。
    relic: 一根小风琴管
    relic_desc: 一根调好音、试过音的小管子，没有卖掉。
    points:
      p1: 在巴赫同意泰勒动刀前给他第二个医护意见，趁他还在考虑，问他是否愿意请人帮忙读谱
    points_fail:
      p1: 巴赫没听到第二个医护意见，照原定安排接受手术。术后出现并发症，又动了一次刀。
    shift:
      p1:
        was: 1750 年春，约翰·泰勒在莱比锡给巴赫做眼科手术。术后出现并发症，又动了一次刀。
        now: 这条分支里，巴赫听过{staff}的意见后，推掉了泰勒的手术。他的视力仍差，便请人在白天陪他读谱。
        who: bach_leipzig
        bio: 这条分支里，巴赫在 1750 年春推掉泰勒的手术，请人帮他读谱。
    vignettes:
      entry: 你听出低声部比歌者预想的早到一口气。你请他换到屋子另一边听。这次，提示还没来，他就抬起了头。
      rest: 歌者一唱到休止就数乱。你抄下等待时能听到的另一行，他在自己开口前的那个字上做了记号。
      light: 两人合看一页谱。你把纸转向有光的地方，扶住不动，直到两人都看见自己的声部从哪儿分开。
  smith_kirkcaldy:
    name: 托付在身后的书
    place: 苏格兰柯卡尔迪
    figure: 亚当·斯密
    story: 1776 年 3 月，亚当·斯密的《国富论》在伦敦出版。8 月 25 日，他的朋友大卫·休谟在爱丁堡去世。休谟起先托斯密把《自然宗教对话录》印出来，斯密有顾虑，休谟改托印书商威廉·斯特拉恩，要他在身后两年内出版。这年 11 月，斯密在柯卡尔迪给斯特拉恩写信，记下休谟最后几个月的样子。斯特拉恩最终作罢，《对话录》到 1779 年才由休谟的侄子印出。
    story_prose:
      opening:
        - 1776 年深秋，苏格兰柯卡尔迪。亚当·斯密回到了他出生的这座小城。这年 3 月，他的《国富论》在伦敦出版，第一章从做别针讲起。8 月，他的朋友大卫·休谟在爱丁堡去世。
        - 史实里，休谟年初立遗嘱，把遗稿托给斯密，起先要他把《自然宗教对话录》印出来，斯密不愿经手；8 月 7 日的遗嘱附件改托印书商威廉·斯特拉恩，请他在身后两年内出版。11 月，斯密在柯卡尔迪给斯特拉恩写信，记下休谟最后几个月，《对话录》却一直搁着，到 1779 年才由休谟的侄子不署名印出。在这条分支里，面包铺里有个拿铁钉付账的打钉工人，退潮的沙滩上有个拾贻贝的妇人。
        - 这一趟用得上几种人：懂书、懂印书生意的人，或者懂文书、把一份遗愿写得清清楚楚的人；说话有分量、劝得动人的人。
      outcomes:
        p1: 休谟去世后不到两年，斯特拉恩的印坊排好了《自然宗教对话录》。头一批印张晾在绳子上，墨还没干。
      none: 那年冬天，那部手稿还搁在斯特拉恩那里。柯卡尔迪的沙滩上，拾贻贝的妇人提着篮子往回走，对岸爱丁堡的炊烟压得很低。
      not_admitted: '{staff}没能进那户人家的门，只在退潮的沙滩上帮拾贻贝的妇人提了几天篮子。对岸爱丁堡的炊烟，一直压得很低。'
      points:
        p1:
          class_lettered: 11 月 9 日，斯密坐在柯卡尔迪家中的桌前，给斯特拉恩写信，记休谟最后几个月。{staff}照誊录文书的规矩，把 8 月 7 日遗嘱附件里“身后两年内出版”那一句原样抄在一张纸上，下面列出印一本八开小书要几个印张、几个月，放在他的信纸旁边。斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。
          else: 11 月 9 日，斯密坐在柯卡尔迪家中的桌前，给斯特拉恩写信，记休谟最后几个月。{staff}在他桌边坐了一个下午，把 8 月 7 日遗嘱附件里那句话写在一张纸上：两年之内，交斯特拉恩印。写完，把纸推到他面前。斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。
      excerpts:
        p1: 斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。
    relic: 一枚别针
    relic_desc: 他用来说明分工威力的那种别针。
    points:
      p1: 休谟托付的《自然宗教对话录》搁着没人肯印时，劝斯密和斯特拉恩照休谟的遗愿把它印出来
    points_fail:
      p1: 书照史实又搁了三年，1779 年才由休谟的侄子不署名印出，这条分支里休谟要它在身后两年内出版的遗愿也没有照办。
    shift:
      p1:
        was: 1776 年 8 月 7 日，休谟在遗嘱附件里请斯特拉恩在他身后两年内出版《自然宗教对话录》；斯密不肯经手，斯特拉恩最终也作罢，书在 1779 年由休谟的侄子不署名出版。
        now: 斯特拉恩在休谟要求的两年之内把《对话录》印了出来。
        who: david_hume
        bio: 他压了二十多年的《对话录》，在他去世后两年之内由斯特拉恩印了出来，照的是他最后那份遗嘱附件。
    vignettes:
      nails: '{staff}在面包铺排队，前面一个打钉的工人掏出一把铁钉付账，钉子在柜台上滚了几滚，铺主数了数就收下了。过了几个礼拜，{staff}在一本今年春天出的厚书里读到，苏格兰有个村子的工人至今拿钉子去面包铺当钱用，对着那一页笑出了声。'
      post: '{staff}帮驿车夫捆寄往伦敦的邮包，马在门口喷着白气。有一封写着印书商斯特拉恩先生收，比别的都厚，{staff}把它塞到最底下，免得淋了雨。'
      firth: '{staff}趁退潮在沙滩上走，脚底下的沙又湿又硬。福斯湾对岸，爱丁堡的炊烟压得很低，旁边拾贻贝的妇人说，那边住的都是读书的聪明人。'
  kant_konigsberg:
    name: 留在页边的问题
    place: 柯尼斯堡
    figure: 伊曼努尔·康德
    story: 康德的《纯粹理性批判》初版在1781年问世。序言从这样的问题说起：理性无法回避它们，也无法回答它们。1787年新版另有修改过的序言。
    relic: 一张书架题签
    relic_desc: 书签，页边写着初版年份。
    points:
      p1: 在柯尼斯堡给康德备齐随信寄出的新书去向，护住他让赫尔茨接到《纯粹理性批判》消息的这次通邮
      p2: 给短篇导读留首版的互见页码，并请康德在小范围内先给赫尔茨等人读一遍
    points_fail:
      p1: 地址夹错了，装着转交说明的信折回，赫尔茨赶不上书会期间收到他的消息，事务所因同步失败召回员工。
      p2: 新稿再次单独传送，收稿的人不知道哪段是给首版的具体问题作答。
    shift:
      p1:
        was: 1781 年 5 月 1 日，康德致信赫尔茨，提到即将在书会面世的《纯粹理性批判》，并请他转交另一封信。
      p2:
        was: 《未来形而上学导论》后来单独出版，写法还受到书评回应的影响。
        now: 手头有一份带页码的导读和一轮试读答复。康德能看出哪些解释仍需要补例。
        who: kant_konigsberg
        bio: 康德留在柯尼斯堡写作。1781 年的书由里加出版商经办，读者再经书信把批评和疑问带回给他。
    vignettes:
      margin: 洛特只想抄读者绕不开问题的那一节。你请她给同一句后面的限制也留地方。她把字写小些，两部分都抄进纸条。这行字让她还想把书再翻开。
      label: 奥托在签上写，这本书答透了最难的问题。你把签翻过来，请他从序言开头再读一遍。他用一个问题换掉夸口。客人从架上抽书，就知道从哪儿读起。
      editions: 你记得六年后还会有另一篇序言。洛特眼前只有这册书，问该在哪页夹签。你在纸条上写下本版年份。店要关了，她刚翻过第一页。
  mozart_prague:
    name: 开幕前的接句
    place: 布拉格
    figure: 沃尔夫冈·阿马德乌斯·莫扎特
    story: 莫扎特从布拉格写信说，《唐璜》于1787年10月29日登台。更早的一封信提到筹备中的困难。
    relic: 一页改过的排练分谱
    relic_desc: 排练用谱，划掉了一个休止。
    points:
      p1: 在小剧团有人病倒后重新排练开场，保住 10 月 29 日的《唐璜》首演
      p2: 趁首演用的分谱仍在台上，请莫扎特核准一份注明布拉格版的完整副本
    points_fail:
      p1: 狭窄的排练时间挤不出合唱和乐队重来一次，29 日的首演再度取消。行程同步失败，员工被召回。
      p2: 后来为维也纳改写的段落和布拉格旧稿混着流传，排演的人得去找不同的分谱拼。
    shift:
      p1:
        was: 1787 年 10 月 29 日，在排练准备不足及歌手患病造成延期后，《唐璜》在布拉格首演。
      p2:
        was: 1788 年《唐璜》在维也纳上演时，莫扎特为当地演出另作改动。
        now: '{staff}请莫扎特在首演后核准一份照布拉格演出保留的副本，并把后来替换的页另装。另一座城市改谱时，仍可以读到这份原来的演出版本。'
        who: mozart
        bio: 莫扎特为《唐璜》改谱时，有一份经过自己核准的布拉格演出副本可以对照。他保留了两地各自的演员用谱。
    vignettes:
      cue: 安娜的分谱多抄了一个休止。你敲出另一声部进入的位置，让她标下该听哪个词。再合一遍时她进准了。划掉的休止还留在谱上，安娜请你别把它涂没。
      swap: 扬来得及重抄一页，或去找还没回来的歌手。你替他跑一趟楼梯，他留下抄。幕一动，改过的谱和歌手都到了谱架前。台下还有人在找那张旧谱。
      applause: 你知道莫扎特会在信里提到掌声。扬问，那一个多出来的休止会不会有人听出来。你交给他改好的谱，指给他在哪儿等安娜开口。离开时幕已经升起，那句还没到。
  lavoisier_paris:
    name: 逮捕令下来之前
    place: 巴黎
    figure: 拉瓦锡
    story: 1793 年 11 月 24 日，所有前包税官被下令逮捕，拉瓦锡和岳父雅克·保尔兹都在其中，先后入狱。1794 年 5 月 8 日，两人与其他前包税官同日在巴黎被判处死刑并处死。
    story_prose:
      opening:
        - 巴黎，雅克·保尔兹把一份账摊给女儿看。安托万·拉瓦锡在另一头逐页读，两个人都准备留在城里说明自己的账。有家人提议先把册子交给肯保管的人。
        - 1793 年 11 月 24 日，前包税官被下令逮捕。保尔兹和拉瓦锡后来于 1794 年 5 月 8 日同日被处死。这一趟可以分别劝两个人先离城，各自作决定。
        - 善于听人把理由说完的员工可以分别见他们。熟悉账册的员工也能帮忙列出交给家人的东西，让接手的人找得到。
      points:
        p1: 保尔兹说单把整册给家人，他们还是不知道哪些地方有账要问。你请他边说边挑出要做标记的页。女儿把他指到的账核过一遍，才伸手接整本。他听她念出记号，站起身把椅子推回桌边。
        p2: 拉瓦锡拿着一张核好的对账单，说里面有两行得由他亲自解释。你问能否先把解释写给保管人。等家人逐条读回，他才请他们转告来找他的人，自己已经离开巴黎。临走，他把答过的那张搁到家人手边，留出下面一张空纸。
      outcomes:
        all: 两个人各自离开了巴黎。家人到五月开账册时收到各自的消息，两人都还活着。
        p1: 雅克先走，在次年五月之后仍有消息。拉瓦锡留在巴黎，后来被处死。
        p2: 拉瓦锡先走，在次年五月之后仍有消息。雅克·保尔兹留在巴黎，后来被处死。
      none: 家人从账桌边散开，两人都留在城中。次年五月，他们的名姓仍出现在同日的死刑名单中。
      not_admitted: 来问话的人没有家里约过的名帖。桌上的账册合起来，留在已经坐定的人手里。
      excerpts:
        p1: 他听她念出记号，站起身把椅子推回桌边。
        p2: 临走，他把答过的那张搁到家人手边，留出下面一张空纸。
