trait_notes:
  kind:
    pro: 容易赢得信任，照护真诚。
    con: 容易被敌意所伤，也容易让步。
  curious:
    pro: 留意到别人没留意的，敢问别人不问的。
    con: 容易被别的事分心。
  glib:
    pro: 靠嘴进得去门，容易说动人。
    con: 太会说的人不一定被信。
  sensitive:
    pro: 容易发现不对劲，也能体会别人的感受。
    con: 体质较弱，更容易染上疾病。
  bold:
    pro: 敢顶住阻力和危险。
    con: 粗心，容易漏掉该留意、该照料的。
  patient:
    pro: 能等，肯花时间把事情慢慢做好。
    con: 遇到突然的变化反应偏慢。
  methodical:
    pro: 做事有章法，记录和核对一丝不苟，被逼也不松口。
    con: 死板，场面没有章法时容易吃力，也不擅长说动别人。
  hardy:
    pro: 身体扛得住，生病也比别人少。
    con: 粗线条，容易看漏细节。
  charismatic:
    pro: 一站出来就有人愿意听、愿意跟。
    con: 精力分给了人，坐不住做细活。
  quiet:
    pro: 不惹眼，看得多，耐得住。
    con: 不爱争，说不动别人。
  wanderer:
    pro: 底层出身或惯了在外，不怎么想家，不太受敌意和熬夜的影响，吃得了苦。
    con: 不容易交心，别人也不太信任，在上层人面前不自在，话说不到点上。
  attached:
    pro: 对人用情很深，肯守着。
    con: 离家越久越想家，容易撑不下去。
  streetwise:
    pro: 市井里练出来的反应，吃了亏也能找条出路。
    con: 耐不住性子，难做长久的事。
  scholarly:
    pro: 读得多，能和学者平等地谈。
    con: 体力一般，也容易生病。
  handy:
    pro: 手艺扎实，能把东西做到位。
    con: 嘴笨，不擅长说服别人。
  artistic:
    pro: 对美和声音特别敏锐，能打动人。
    con: 心思容易飘走，也容易想家。
  calm:
    pro: 事到临头反而稳，照护病人尤其好。
    con: 慢半拍，容易错过细小的变化。
  cosmopolitan:
    pro: 去过很多地方，同陌生人容易搭上话。
    con: 什么都见过，没耐心守着一件事。
  cheerful:
    pro: 爱笑，愿意帮忙，带得起气氛。
    con: 想得简单，看不出暗处的问题。
  vigil:
    pro: 越晚越清醒，守夜熬更不容易走神。
    con: 白天长途劳累就垮。
  faithful:
    pro: 有坚定的信念，难关里不动摇。
    con: 对与信念不合的事不容易接受。
  skeptical:
    pro: 凡事要证据，不轻信，也容易看出破绽。
    con: 对人先有戒心，别人也不容易对他敞开。
  ambitious:
    pro: 目标明确，肯争取，也敢开口要。
    con: 心里装着事，容易忽略身边人的难处。
mainline:
  open:
    name: 开张
    desc: 事务所挂牌，一间店面，三个员工。
  first_trip:
    name: 第一趟差
    desc: 员工带回了第一笔时空能量。
  reputation:
    name: 有了名声
    desc: 街坊开始提起这家事务所。
  far_past:
    name: 更远的过去
    desc: 够用的能量，足以买通更远的时空。
  home:
    name: 回家
    desc: 能量够了，所长可以回到自己的时空，见家人。
quotes:
  newton:
    who: 牛顿
    quote: 如果说我看得更远，那是因为我站在巨人的肩膀上。
  einstein:
    who: 爱因斯坦
    quote: 重要的是不要停止提问。
  faraday:
    who: 法拉第
    quote: 只要不违背自然规律，再奇妙的事也可能是真的。
  feynman:
    who: 费曼
    quote: 第一条原则是不要欺骗自己，而你恰恰是最容易被骗的人。
  pasteur:
    who: 巴斯德
    quote: 机遇只青睐有准备的头脑。
  carr:
    who: 卡尔
    quote: 历史是历史学家与事实之间不断的互动，是现在与过去之间没有尽头的对话。
  santayana:
    who: 桑塔亚那
    quote: 不能记住过去的人，注定要重蹈覆辙。
  ranke:
    who: 兰克
    quote: 历史只想说明事情本来是怎样的。
  simaqian:
    who: 司马迁
    quote: 究天人之际，通古今之变，成一家之言。
  hippocrates:
    who: 希波克拉底
    quote: 人生短暂，技艺长久。
  thucydides:
    who: 修昔底德
    quote: 这部著作是为了成为一份永久的财富。
catalog:
  pythagoras_croton:
    name: 以数为万物本质的学派
    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 在克罗顿，一个团体把数学、音乐和生活当作同一门功课来学，比例成了和谐的钥匙。
    relic: 单弦琴的弦
    relic_desc: 一根绷紧的弦，按在简单的比例上能发出和谐的音。
    points:
      p1: 听出弦长的比例
      p2: 被学派接纳旁听
      p3: 沉默听满前几年
  thales_miletus:
    name: 不借神明解释自然
    place: 伊奥尼亚米利都
    figure: 泰勒斯
    story: 米利都的泰勒斯去找事物的自然原因，传说他预言过一次日食。
    relic: 一颗琥珀珠
    relic_desc: 在布上擦一擦就能吸起羽毛，是电最古老的谜。
    points:
      p1: 看他怎样量金字塔的影长
      p2: 不借神明地把道理讲给港口的人
      p3: 等到一个晴朗的时辰
  socrates_athens:
