      p1: 像平等的人一样和他交谈
      p2: 留意他身上医生已经知道的事（医生、护士或好奇的人更合适）
      p3: 让他在最后一夜呼吸轻松些
  puccini_brussels:
    name: 未完成的图兰朵
    place: 布鲁塞尔
    figure: 贾科莫·普契尼
    story: 普契尼在布鲁塞尔治疗喉癌，《图兰朵》没有写完，总谱停在柳儿之死不久之后。
    relic: 一页草稿
    relic_desc: 一页用软铅笔写的乐谱草稿。
    points:
