    relic_desc: 一把朴素的木柄冰镐，镐头磨旧了。
    points:
      p1: 在漫长的攀登路上跟上队伍
      p2: 和他们一起分享营地与计划
      p3: 陪他们爬到足够高处送他们出发
  fanny_mendelssohn_berlin:
