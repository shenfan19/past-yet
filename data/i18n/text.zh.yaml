items:
  ors_pack:
    name: 口服补液盐
    desc: 一包兑一升水。救治病人用，每个病人要两包。
  chlorine_tablet:
    name: 氯片
    desc: 一片能让五个人的饮水变安全。又轻又便宜，但要有人肯听你讲。
  handbook:
    name: 现代医护手册
    desc: 提高救治手艺。也是递给当地医生的见面礼。
  recall_charm:
    name: 回收符
    desc: 濒死时把人接回。没带的话，装备全丢。
  detox_water:
    name: 泛用解毒水
    desc: 能中和多种常见毒物的现代药水。比补液盐贵，但一瓶顶三包。
  disinfectant:
    name: 杀菌水
    desc: 现代的消毒液。一瓶能让十几个人的水或手变得安全。
  heart_monitor:
    name: 心率检测器
    desc: 戴在员工身上，能提前发现过劳，疲劳涨得更慢。
  radiation_shield:
    name: 辐射隔离器
    desc: 来自未来的铅衬防护罩，挡住粉尘和辐射。居里夫妇当年没有这样的东西。
  antibiotic:
    name: 抗生素
    desc: 能杀灭多种细菌感染，对病毒无效，也不是万能药。
  mosquito_net:
    name: 蚊帐
    desc: 把传播疟疾和黄热病的蚊虫挡在睡觉的人外面。
  face_mask:
    name: 医用口罩
    desc: 便宜的屏障，减少呼吸道疾病的传播，戴一次就丢。
  thermometer:
    name: 体温计
    desc: 早早看出发热，疾病还不明显时就能察觉。
  sun_hat:
    name: 宽檐帽
    desc: 给头和脖子遮阴，挡住几个小时的日晒。
  water_flask:
    name: 保温水壶
    desc: 带着走的烧开水，热天是凉的，冷天是热的。
  warm_blanket:
    name: 保暖毯
    desc: 很轻的毯子，在寒夜里把体温留住。
  hand_warmer:
    name: 暖宝宝
    desc: 一包能暖一整夜。
  energy_bar:
    name: 能量棒
    desc: 热量很高的食物，快速补上能量缺口。
  neural_chip:
    name: 义体智能芯片
    desc: 耳后的芯片，能翻译任何语言，加快学习。不容易遮住。
  oxygen_can:
    name: 便携氧气瓶
    desc: 在稀薄的空气里救急的几口氧气。
  altitude_pills:
    name: 高原药
    desc: 缓解上得太快引起的头痛和恶心。
  cyber_arm:
    name: 义体手臂
    desc: 力量远超常人的假肢，很显眼。
  back_brace:
    name: 护腰带
    desc: 搬重物时托住腰。
  cyber_lung:
    name: 义体仿生肺
    desc: 能撑长时间重活的人造肺，会轻轻嗡鸣。
  gorilla_arm:
    name: 义体大猩猩手臂
    desc: 又大又夸张的怪力手臂，谁看到都会盯着。
  painkiller:
    name: 止痛药
    desc: 压住几个小时的疼痛，不治病，只是争取时间。
  holo_cloak:
    name: 全息斗篷
    desc: 把光线绕开的斗篷，别人会不自觉地看过去。会降低被发现的几率。
  pack_frame:
    name: 背架
    desc: 把负重分到髋上，能多带五单位的东西。
  caffeine_tablet:
    name: 咖啡因片
    desc: 撑过一个夜晚，之后疲劳会补回来。
  golden_apple:
    name: 金苹果
    desc: 神话里的金苹果，听你说话的人容易被打动，说服力提高 200%。
  elixir:
    name: 灵药
    desc: 一瓶明亮的药水，止痛，恢复体力。
  headlamp:
    name: 头灯
    desc: 夜里腾出双手读书写字用的光。
  ear_plugs:
    name: 耳塞眼罩
    desc: 在吵闹明亮的地方也能睡着。
  thermal_suit:
    name: 恒温服
    desc: 在冰天雪地或酷暑里都保持体温的衣服，样子很奇怪。
  voice_recorder:
    name: 录音笔
    desc: 把要紧的话录下来，最后的谈话不会丢。
  water_station:
    name: 净水站
    desc: 一台小机器，能用泥水为一个村子供上干净的水。
  nutrient_synth:
    name: 营养合成器
    desc: 把几乎任何东西变成营养均衡的一餐，长路上不再挨饿。
  plush_toy:
    name: 毛绒玩具
    desc: 送给孩子或病人的小礼物，让房间不那么可怕。
  ar_glasses:
    name: 增强现实眼镜
    desc: 给看到的东西加标注、让细节浮现的眼镜，不容易遮住。
  period_costume:
    name: 仿古服饰
    desc: 按当地样式缝制的衣服，第一眼没人把你当外人。
  gift_box:
    name: 礼品盒
    desc: 糖、香料和一面小镜子，主人会道谢收下的东西。
  sleep_regulator:
    name: 睡眠调节器
    desc: 把一夜的睡眠压成两小时的头环。
  exoskeleton:
    name: 外骨骼
    desc: 穿在身外替人扛重物的框架，不占义体负荷，能多带十单位的东西。
  magnifier:
    name: 放大镜
    desc: 读细小的字，看清手稿和器物的细节。
  calm_patch:
    name: 情绪稳定贴片
    desc: 压住佩戴者自己的压力，在床边守得住长夜。
  notebook_pen:
    name: 笔记本和笔
    desc: 记下对方说的话，对方会觉得被认真对待。
  hologram_projector:
    name: 全息投影仪
    desc: 在人群面前显出异象，是能带的东西里最扎眼的一件。
  vitamin_c:
    name: 维生素 C 片
    desc: 在没有新鲜食物的长途航行里防坏血病。
  hardtack:
    name: 压缩饼干
    desc: 能放好几个月的干粮。
  nano_kit:
    name: 纳米医疗箱
    desc: 能治好那个时代无法医治的传染病。
  gas_mask:
    name: 防毒面具
    desc: 滤掉吸进去的粉尘和毒气。
  scout_drone:
    name: 探路无人机
    desc: 先飞过前面的路，带回一张图。
  insulated_gloves:
    name: 绝缘手套
    desc: 挡住电击，保护双手。
  first_aid_kit:
    name: 急救包
    desc: 包扎与胶带，止血并合住伤口，让受伤不至于变成死亡。
  compass:
    name: 指南针
    desc: 在没人给你讲过的地方指出方向。
antiques:
  pump_rust:
    name: 宽街水泵的锈片
    desc: 从一台旧水泵上刮下来的一片锈。拿着它，能找到一条街的九月。
  clinic_bell:
    name: 产科病房的铜铃
    desc: 一只铃，铃舌已经没了。拿着它，能找到一间病房的春天。
staff:
  s_ning:
    name: 宁晓雨
    ethnicity: 汉族
    jobs:
      - 护士
      - 护理员
    bio: 做过护士，认死理，见不得病人没人管。
    story: 晓雨在一家繁忙的城市医院病房上了八年夜班，那种走廊里都加着床的病房。她不是科里最机灵的，也不是最有力气的，这一点她从不掩饰。她有的是耐心，还有一条认死理的规矩：身边有人孤零零的，她就不能走过去。有位没有家人的老先生，每天傍晚都等她来帮他把饭吃完，她下班后也还是去。去年她累垮了，离开了病房，现在给没法在家陪老人的人家做护理，心里还是想找一份能坐下来陪人把话说完的工作。
  s_zhou:
    name: 周建国
    ethnicity: 汉族
    jobs:
      - 建筑工人
      - 架子工
    bio: 干过工地，身体好，嘴上功夫了得，不爱绕弯。
    story: 建国十九岁离开河南的村子，去沿海城市砌砖，二十六年来跟着工地跑遍了大半个中国。他的身体从没让他失望，别人扛一袋，他扛两袋，一班下来嘴也不停。可一碰到纸面上的东西他就吃亏，看不懂图纸，也读不明白合同，有两回工头扣了他的工钱，只因为他签了自己没弄懂的字。倒霉事好像总跟着他从一个工地到另一个工地。他想回老家，给父母盖一栋像样的两层小楼，再睡上一张不用再搬的床。
  s_qian:
    name: 钱守仁
    ethnicity: 汉族
    jobs:
      - 旧货商
      - 修复匠
    bio: 倒腾过旧货，眼睛毒，什么东西值几个钱一眼就知道。
    story: 守仁在天津的旧货市场边长大，父亲把自行车和收音机摆在地上的一块布上卖。三十年里他收、修、卖别人扔掉的东西，一上手，凭分量和接缝就能分出真货还是仿的。运气一直待他不薄，有一回他在一堆塑料盆底下翻出过一只清代的木匣。身体却不争气，胸口弱，胃也差，而且他意志不硬，买主缠上一阵子，他就会松口让价。他梦想开一间不讲价的小铺，每样东西都有一张卡片，写着公道的价钱。
  s_amara:
    name: 阿玛拉·奥卡福
    ethnicity: 伊博人
    jobs:
      - 助产士
      - 护士
    bio: 接生过几百个孩子，别人慌的时候她最稳。
    story: 阿玛拉在埃努古长大，是家里五个孩子里的老大，雨季停电的夜晚，她就在黑暗里哄着弟弟们睡觉，慢慢练出了一份稳。二十二岁那年她学了助产，如今在拥挤的产科病房值夜班，手很准，一边接生一边哼歌，好让产妇听出一切正常。她的短处很明显。药量计算和书面记录对她很吃力，要同事替她核对，她容易累，得过三次疟疾，又不会拒绝别人让她加班。可每次停电后灯总能及时亮起，孩子也都平安落地。她想在母亲的村子附近开一间小诊所，有台发电机，还有一壶总是热的水。
  s_kenji:
    name: 森健二
    ethnicity: 大和族
    jobs:
      - 软件工程师
      - 系统管理员
    bio: 靠调试吃饭，见不得没收尾的东西。
    story: 健二在仙台长大，十来岁时用父亲的旧笔记本自学编程，起因只是想修好一个坏掉的游戏。现在他在东京一家物流公司上班，能顺着一个错误追过三个系统，最后写下那份终于讲明白的说明。他的身体却是故事的另一半。他常忘了吃饭，趴在桌上睡，大学以后每个冬天都要病一场。他连螺丝刀都拿不稳，杯子也常打碎。有天傍晚他免费替一家小面摊重做了点单系统，老板请他吃了一个星期的面。他想做一个小小的东西，让老人用起来不害怕。
  s_isabella:
    name: 伊莎贝拉·罗西
    ethnicity: 意大利人
    jobs:
      - 退休教师
      - 家教
      - 刺绣师
    bio: 教了四十年书，什么都能换个说法再耐心讲一遍。
    story: 伊莎贝拉在博洛尼亚郊外的一所学校里教了四十年文学，学生是十三岁上下的孩子，她的字写得漂亮，学生都抢着临摹。身体一直是她最弱的地方，心脏不好，骨头发脆，还在结冰的台阶上摔断过髋骨，所以每一道楼梯她都走得小心，坐火车碰天气也总不顺。退休后她在厨房餐桌边给邻居的孩子补课，学费是几块饼干，也替教堂绣亚麻布。她想每年秋天去西西里看姐姐，只要身体和铁路都肯配合。
  s_tariq:
    name: 塔里克·哈桑
    ethnicity: 阿拉伯人
    jobs:
      - 司机
      - 机修工
    bio: 熟悉每一条小巷，也知道怎么说动一扇关着的门。
    story: 塔里克在安曼开了十六年出租车，之前跟哥哥卖过一阵汽车零件。他是个普通人，本事也都普通，差的那一截就靠胆子和嘴皮子补上。他知道哪几条山路冬天会积水，哪家咖啡馆凌晨四点肯给陌生人倒茶，也知道怎么跟交警说得过去。生意清淡的日子，他在院子里自己修发动机。有个女人曾哀求他赶在丈夫手术前到医院，他钻小巷抄近路，提前六分钟赶到。他每个月存一点钱，想让女儿以后读医学。
  s_meiling:
    name: 陈美玲
    ethnicity: 闽南人
    jobs:
      - 画家
      - 插画师
      - 美术生
    bio: 看到什么都画下来，剩下的就追着问为什么。
    story: 美玲生在台南，爷爷是画庙门的匠人，小时候总让她来调那一抹红。十九岁的她在台北读美术学校，手上的功夫是同年级里最好的，一条线落在哪里，她就像别人选词一样准。可手以外的地方都弱，理论课她学得吃力，开了头的速写簿比画完的多，作品集还在公车上丢过两回。她身体单薄，倒霉事也容易找上她。她希望有一天能画完一整扇自己的庙门，再请爷爷来调那一抹红。
  s_lars:
    name: 拉尔斯·尼尔森
    ethnicity: 瑞典人
    jobs:
      - 木匠
      - 造船匠
      - 木雕匠
    bio: 做东西要做得结实，最不喜欢被人催。
    story: 拉尔斯在斯德哥尔摩群岛的一座小岛上跟叔叔学造船，三十多年来把橡木和松木刨成一条条比主人还长寿的船身。他的手艺极好，可读字很慢，合同看不明白，账目全交给妻子。他的运气坏透了，一场火烧掉了第一间工坊，一场水又淹了第二间。他量两遍尺寸，下刀前还要再等一天，这让他丢过客人，而且谁催他，他都不肯提前给船下水。冬天的晚上，他给村里的孩子刻小木鸭。
  s_priya:
    name: 普里娅·夏尔马
    ethnicity: 马拉地人
    jobs:
      - 药剂师
      - 店主
    bio: 标签要读两遍，剂量要数第三遍。
    story: 普里娅在浦那长大，家就在叔叔的药店楼上，放假时帮着用整齐的大写字母给药瓶贴标签。她是个普通的学生，后来成了普通的专业人员，不算天才，也不算体弱，正因为知道自己不是天才，才格外仔细。二十四岁她成了药剂师，现在管着一家热闹社区药店的柜台和库存，常有老人提着一袋混在一起的药片，请她帮忙分清。有一次她发现处方上开重了剂量，半夜打电话给医生。她有个小本子，记着顾客不好意思开口问的问题，也盼着有一天开自己的药店，门外放一条长凳。
  s_diego:
    name: 迭戈·费尔南德斯
    ethnicity: 西班牙裔
    jobs:
      - 街头乐手
      - 洗碗工
    bio: 一把吉他就能让一群人围过来，也想念妈妈做的饭。
    story: 迭戈十七岁离开学校，从那以后就在圣特尔莫市集旁的街角弹吉他，游客停下就弹探戈，学生路过就弹摇滚。他的手是天赐的，别的却几乎都撑不住。一晚上的硬币他总数不对，活儿干不到一星期就扔下，每年冬天一场胸腔感冒就把他按在床上。他靠的是运气，比如一位退休的面包师每周四都来听一首歌，留下一枚硬币和一个热乎乎的肉馅饼。妈妈每次都往他手里塞几盒饭，他嘴上常说要录一张专辑，其实还没动手。
  s_olga:
    name: 奥尔加·彼得罗娃
    ethnicity: 俄罗斯人
    jobs:
      - 退休医生
      - 讲师
    bio: 行医五十年，相信自己的眼睛胜过任何手册。
    story: 奥尔加在喀山读完医学院，五十年里大半时间待在一家区诊所，下雪天也赶到病人家，因为公交车从来不准点。她学会了先听咳嗽再看病历，而且常常对。可她自己的身体始终跟不上头脑，心脏弱，肺也薄，住过不止一次院，第一次发作时她自己下了诊断，还不肯躺下。同事说她固执，她当成夸奖。如今她仍给年轻医生讲课，门边放着一只小药包，邻居有事就来敲门。
  s_samuel:
    name: 塞缪尔·门萨
    ethnicity: 阿肯人
    jobs:
      - 记者
      - 电台主持
    bio: 敢问别人不敢问的，问完马上记下来。
    story: 塞缪尔在库马西长大，姨妈在路边摆桌卖报纸，总让他趁顾客还没来先看。后来他在阿克拉读新闻，现在为一家小报写稿，也在本地电台念早间新闻。运气一直跟着他，合适的人总在合适的时候路过，他无意中撞见的一条堵塞排水沟淹了一所学校，报道出来后沟很快就修好了。可他没有定力，编辑一皱眉他就放下选题，截稿日常常错过，别人一逼他就让步，疟疾和肠胃病也时不时把他按在床上。他走到哪都带着本子，想总有一天写一本书，收集街头普通人的回答。
  s_minji:
    name: 朴敏智
    ethnicity: 韩民族
    jobs:
      - 厨师
      - 摊主
    bio: 先让大家吃上，自己最后一个坐下。
    story: 敏智二十六岁在釜山一条窄巷里开了自己的第一间小厨房，清早五点给码头工人端炖汤。她的手艺是大师级的，一锅汤尝一口就知道缺什么。可数字和表格能把她难住，账她管不了，由女儿来记，有一回她看错了通知，同一笔罚款交了两次。运气也不帮她，小店淹过一次水，又被隔壁的火灾封过门，两回都是老主顾搬着自己的椅子来，才把店重新坐满。她每天干十四个小时，吃饭常常站着。她的心愿是每个月有一个星期天，让别人下厨，她只当一回客人。
  s_jeanluc:
    name: 让-吕克·莫罗
    ethnicity: 布列塔尼人
    jobs:
      - 退休船长
      - 补网匠
    bio: 见过更大的风浪，下命令从不提高嗓门。
    story: 让-吕克生在布列塔尼海边的渔村，十六岁上货轮，四十岁当了船长。他在海上运气不好，一条船在他脚下起过火，另一条搁过浅，可他的意志从没弯过，每次都把船员平安带回家。有一年二月的风浪里，他把一个落水的水手拉了上来，那个年轻人每年圣诞都给他寄一张卡片。如今他的腰和膝盖都磨坏了，还是在屋后的木板上教港口的孩子们打绳结、补渔网，而且固执地要站着教。
  s_fatima:
    name: 法蒂玛·赛义德
    ethnicity: 阿拉伯人
    jobs:
      - 档案员
      - 翻译
    bio: 能在一屋子的箱子里找出那一页要紧的纸。
    story: 法蒂玛在开罗市政档案室的地下室里待了二十六年，那里总有灰尘和豆蔻茶的味道。她最初是做文员，父亲是装订匠，从小教她爱那些被许多双手摸过的纸。灰尘对她并不友善，她有哮喘，三天两头生病，而且有两回水管恰好在她刚理好的书架上方爆裂。有一回她花了三个星期，替一位老寡妇找出一张地契。晚上她接些奥斯曼旧文书的翻译，挣一点小钱。她相信书架排得整齐也是一种体贴，谁劝她都不改。
  s_tom:
    name: 汤姆·贝克
    ethnicity: 德裔
    jobs:
