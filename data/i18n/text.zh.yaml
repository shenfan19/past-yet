catalog:
  pythagoras_croton:
    name: 第二根弦
    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 亚里士多德后来记述，他所称的毕达哥拉斯派把音阶中的音程同数联系起来。现有出处没有记下毕达哥拉斯亲自上过这样一课。
    relic: 两处点过墨的弦
    relic_desc: 工坊用来练习的弦，一处是凭记忆点的，另一处是量过弦长才点的。
    points:
      p1: 在同一根弦上比较整段与半段
      p2: 请做琴的人让另一个人试用记号
      p3: 稳住拍子，让两个学徒轮流拨弦
    vignettes:
      octave: 墨拉斯凭记忆在老师按过手指的地方点了墨。你把备用弦折成两段，指出中点到底在哪儿。他补了第二个记号，这次听到了八度。头一个点也留着，下一个学徒还可以拨出两处的差别。
      ear: 吕西斯能听声跟上，却没人给他看过手该按哪儿。你敲着拍子，让他听墨拉斯拨一次，再自己试。窗板合上时，吕西斯照着记号就能拨出这个音程，用不着先有人唱给他听。
      credit: 你几乎能看见后世把一个名人印在每道习题上。墨拉斯问备用弦该署谁的名。你记下他试的是哪一段，留他给自己的活署名。下一堂习作开始时，你已经回去了。
  thales_miletus:
    name: 留空的时辰
    place: 伊奥尼亚米利都
    figure: 泰勒斯
    story: 希罗多德把一次战事中白昼转暗的预告归于米利都的泰勒斯，只说他预告了年份，没有交代方法。
    relic: 一片留着空格的蜡板
    relic_desc: 港口记录，分别给年份和时辰留了格。
    points:
      p1: 比较传来的年份和记事人后来加上的时辰
      p2: 劝船主把传闻和约好的时辰分开
      p3: 等一等，看两处空格里有哪一格能填上
    vignettes:
      year: 赫格西亚斯留了两格，一格写年，一格写时辰。讲故事的人说了年份，他自己补了时辰，好让两格都齐整。船开之前，你让他把原话重念一遍。一格仍空着，这回是有意留空的。
      appointment: 船主墨利塔听过传闻，问要不要叫船员提前回来。你递给她两面蜡板，一面记听来的故事，一面写和船员说定的时辰。她自己定下回来的时候。那条传闻管不了谁提前返港。
      spoiler: 你差点说出后世的历书能标出当地时刻。赫格西亚斯把蜡板转到你面前，递来尖笔。你说不出这则故事的传话人怎么算出时刻，便把笔还给了他。回港的船还没露面，你已离开。
  socrates_athens:
    name: 船回来之前
    place: 雅典
    figure: 苏格拉底
    story: 前 399 年，苏格拉底在雅典受审，被判死刑。雅典每年派往提洛岛的船刚刚出发，船回港以前城里不处决人，他在狱中等了约三十天。这些日子里他把伊索寓言改写成诗，朋友们天天来看他。最后那天朋友们都在，只有柏拉图病了没来，傍晚他饮下了毒芹汁。
    story_prose:
      opening:
        - 前 399 年，雅典。苏格拉底被控不敬神、败坏青年，要在陪审法庭受审。他一辈子在街头和集市上同人问答，自己没写下一本书，后人只能从柏拉图和色诺芬笔下认识他。
        - 史实里，派往提洛岛的船审判前一天刚刚出发，船回港以前城里不行刑，他在狱中又等了约三十天。这些日子他照一个反复做的梦的吩咐，把伊索寓言改写成诗，那些诗没有传下来；最后那天朋友们都到了，柏拉图病着，没有来。在这条分支里，狱墙外有个卖灯油的女人，比雷埃夫斯港有个卖鱼的人，进港的船他都看得见。
        - 这一趟用得上三种人：满场喧哗时稳得住人心的人，记得下诗句、抄得出一卷诗的人，懂医药、治得好一场病的人。
      outcomes:
        all: 提洛岛的船回来了，卖鱼的人远远就看见了船帆。最后那天傍晚，狱里坐满了朋友，柏拉图也坐在里面。那卷诗后来压在雅典一户人家的箱底，一直留了下来。
        p3: 最后那天傍晚，狱里坐满了朋友，柏拉图也坐在里面，一直待到最后。
        p2: 那卷诗后来压在雅典一户人家的箱底，一直留了下来，纸边磨得起了毛。
        p1: 三十天后，提洛岛的船进了比雷埃夫斯港，卖鱼的人远远就看见了船帆。那天，朋友们天一亮就等在狱门口。
      none: 提洛岛的船回来了，卖鱼的人远远就看见了船帆。傍晚，狱里的朋友围坐成一圈，谁也没有先开口。
      desync: 庭上的哄闹一阵高过一阵，申辩断在了半句上。{staff}还没走出法庭，就被事务所召了回来。
