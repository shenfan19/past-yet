        now: '{staff}留在床边帮普契尼缓一缓。这一夜没有他想的那么疼，想叫人的时候，手也够得着床边。'
        who: puccini_brussels
        bio: 普契尼在布鲁塞尔度过了稍安稳的一夜。他把谱放下时，床边有人陪着。
    vignettes:
      divider: 抄谱人把两行铅笔谱并排摊开。{staff}顺着低声部划过去，一行兜回原处，另一行给后头留着地方。{staff}把两张都留在桌上，等普契尼来看。
      future: '{staff}的手指差点敲出在剧院听过的结尾。抄谱人抬起头。{staff}往回翻，指在两人都认得的最后一小节上。'
      pin: 抄谱人腾出桌角放杯子，{staff}把稿纸往里挪了挪。页脚的五线谱空了大半，下面挤着两个铅笔字。
  schumann_endenich:
    name: 换了调的曲子
    place: 恩德尼希
    figure: 罗伯特·舒曼
    story: 罗伯特·舒曼住在恩德尼希的那几年，留下过一份钢琴小曲的抄本，比出版的谱低了一个全音。1856 年 7 月，克拉拉·舒曼来波恩请求探视。客店里的莉娜把那首小曲抄了两份，怀疑起音低的那份抄错了。
    story_prose:
      opening:
        - 1856 年 7 月，波恩近郊的恩德尼希。罗伯特·舒曼住在这里养病，曾亲手把《蝴蝶》里的一首小曲移低一个全音。这个月，克拉拉·舒曼来请求探视。
        - 史实里，克拉拉 7 月 27 日见到了他，29 日再来时已迟了一步。在这条分支里，客店的莉娜抄了两份起音不同的谱，埃米尔知道巷子里有两扇门。
        - 这一趟用得上能从两份谱上认出同一首曲子的人。认得路、守得住约定时辰、能在附近等消息的人也有用处。
      points:
        p1: '{staff}沿着两份谱各读一遍，标出起音虽移低，音和音之间的距离仍一样。莉娜在两个页首都写上调名。她把两张标着不同起音的纸并排夹好，露出上头的一线白边。'
        p2: 七月二十七日，{staff}按约先接到克拉拉，穿过巷子找到探视的那扇门。门开时，克拉拉先把手里折着的纸收了起来。门外还斜着一线傍晚的光。
        p3: 二十九日，{staff}守在附近等到消息，在克拉拉回来的路上接到她，直接领到床边。她坐下，把手伸进被沿。罗伯特的手搭在她掌心，一动也没有挪开。
      outcomes:
        all: 两份曲谱后来仍放在一个谱夹里，页首各有调名。二十九日，克拉拉赶到了床边。巷子里的门还敞着，屋里两只手握在一起。
        p3: 二十九日，克拉拉赶到了床边。后来她起身时，椅子还紧贴着床沿。
        p2: 二十七日的探视仍在傍晚。巷子里光线暗了，那扇门才慢慢合上。
        p1: 两份练习谱后来还在一个谱夹里。再翻开来，两张纸的页首各有一个调名。
      none: 谱夹合上，较低的那份练习谱被抽在外头。一根细纸条从夹口探出半寸。
      not_admitted: '{staff}没能在巷子里找到接应的人。隔着街看过去，两扇门都关着。'
      desync: 克拉拉在另一扇门前等过了时辰。{staff}被召回时，折好的纸条还留在外衣口袋里。
      excerpts:
        p3: 她坐下，把手伸进被沿。罗伯特的手搭在她掌心，一动也没有挪开。
        p2: 门开时，克拉拉先把手里折着的纸收了起来。门外还斜着一线傍晚的光。
        p1: 莉娜在两个页首都写上调名。她把两张标着不同起音的纸并排夹好，露出上头的一线白边。
    relic: 两个调的练习谱
    relic_desc: 两张虚构的练习谱，页首各写了一个调名。
    points:
      p1: 对照两份谱，写明为什么起音低了一个全音的那份也该留在谱夹里
      p2: 7 月 27 日在约定的时间前接到克拉拉，领她走对门，让探视如期发生
      p3: 7 月 29 日留在附近等消息，赶在罗伯特去世前把克拉拉带回床边
    points_fail:
      p1: 莉娜把起音较低的那份谱抽了出来。下一个翻开谱夹的人，只会看到原来出版的调。
      p2: 克拉拉在另一扇门前等过了探视时段。这次探视偏离原时间线，事务所召回员工。
      p3: 克拉拉回到恩德尼希时，罗伯特已经去世。
    shift:
      p1:
        was: 舒曼在恩德尼希期间亲笔抄写的《蝴蝶》第十首，把曲子从 C 大调移到了降 B 大调。
        now: 莉娜把两份练习谱留在同一个谱夹里，页首各写上调名。下一个弹它的人知道，两个起音都没抄错。
      p2:
        was: 7 月 23 日，布拉姆斯和里夏茨医生劝克拉拉再等一等。她在 27 日傍晚六到七点之间见到了罗伯特。
      p3:
        was: 7 月 29 日，克拉拉和布拉姆斯、约阿希姆到恩德尼希时，罗伯特已经去世。
        now: '{staff}在克拉拉回来的路上接到她，直接带她去了病房。罗伯特走之前，她握到了他的手。'
        who: schumann_endenich
        bio: 1856 年 7 月 29 日，罗伯特在恩德尼希去世时，克拉拉就在身旁。
    vignettes:
      key: 莉娜把两张纸各弹了一遍。第二小节还没完，她就抬头看{staff}，手在另一个位置，她却已经知道接下来是哪几个音。
      envelope: 埃米尔答应替克拉拉递折好的纸条，问{staff}该敲哪扇门。两人走到巷子对面，并肩站在那里，刚好看得见两扇门。
      gift: 真正的手稿后来会到舒曼的女儿玛丽手里。眼下，莉娜用两根纸条标出练习谱的开头。{staff}掀琴盖时，其中一根已滑到另一根背后。
  nietzsche_turin:
    name: 纸背上的收件人
    place: 都灵
    figure: 弗里德里希·尼采
    story: 都灵寄来一封信，收信的是弗兰茨和伊达·奥弗贝克，尼采签的是狄俄尼索斯。弗兰茨赶到朋友的住处，见他在读自己改过的《尼采反对瓦格纳》校样。离开都灵前，得有人看看箱里除了校样，还该放些什么。
    story_prose:
      opening:
        - 1889 年 1 月，都灵。一封信寄给弗兰茨和伊达·奥弗贝克，署名和收件人各占一处。弗兰茨赶到都灵时，尼采正在看《尼采反对瓦格纳》的最后一份校样。
        - 史实里，奥弗贝克在 1 月 8 日找到了朋友，后来写下他当时在看的是什么。在这条分支里，彼得罗在楼梯口备下行李签，露琪亚手边还有一包没有裹好的信。
        - 这一趟用得上耐心核对门牌、能把人领到住处的人。熟悉校样与私人信件各该怎样登记和保管的人，也有事可做。
      points:
        p1: 一月八日，{staff}把信上的地址与门牌核过，又在楼梯口等到奥弗贝克，领他走完最后一段。弗兰茨在对的门前停下来，抬手敲了一下。屋里翻过一页纸，门把手慢慢转了半圈。
        p2: '{staff}照校样和私信各自的去向分开登记，把书名留在一张纸签上，另一张只记谁来收。两包纸各用一根绳扎住。露琪亚把写有收件人的纸签转到里边，用指腹压住翘起来的一角。'
      outcomes:
        all: 一月八日，奥弗贝克找到了尼采。后来，两包纸一起上路。他只打开标有书名的一包，另一包的绳结还朝着箱盖。
        p2: 纸到了接手的人那里，分成两包。认出书名以后，奥弗贝克把另一包原样放回箱底。
        p1: 一月八日，奥弗贝克进了朋友的屋子。门在他身后合上时，里面还响着一声轻轻的翻纸声。
      none: 纸张叠着包好，校样与信上都露出人名。包它的人抽了抽绳头，找不准该系在哪一面。
      not_admitted: '{staff}没能在住处找到可以接应的人。楼梯扶手上还搁着一张空白的行李签。'
      desync: 另一扇门没有人应。{staff}被召回时，奥弗贝克还站在那一层的楼梯平台上。
      excerpts:
        p2: 两包纸各用一根绳扎住。露琪亚把写有收件人的纸签转到里边，用指腹压住翘起来的一角。
        p1: 弗兰茨在对的门前停下来，抬手敲了一下。屋里翻过一页纸，门把手慢慢转了半圈。
    relic: 一张留底的行李签
    relic_desc: 游戏时间线里留下的一张行李签副本，收件人写在纸背上。
    points:
      p1: 核准住处地址，1 月 8 日把奥弗贝克领到对的门前
      p2: 把改过的校样和私人信件分开登记，确保要交其中一包时不用拆另一包
    points_fail:
      p1: 奥弗贝克走错了住处。这次见面偏离原时间线，事务所召回员工。
      p2: 信和校样叠在一起包走。第一个来找校样的人，也会看到那些信上的名字。
    shift:
      p1:
        was: 尼采从都灵写信给奥弗贝克夫妇。弗兰茨·奥弗贝克于 1889 年 1 月 8 日在都灵找到尼采。
      p2:
        was: 奥弗贝克事后写信说，他赶到时，尼采正在看《尼采反对瓦格纳》的最后一份校样。
        now: 校样和信分作两包上路。奥弗贝克一眼就认得哪份是改过的校样，另一包仍然封着。
    vignettes:
      address: 彼得罗把署名抄进了去向栏。{staff}把纸签翻过来，给他看写着收件人的一面。他用笔划了一道，很轻，底下原来的字还能认出来。
      privacy: 露琪亚让{staff}扶着纸包，好腾出手裹信。楼梯上有人问信是谁的。她把纸签转向墙，才开口答话。
      stairs: '{staff}在楼梯平台听见翻纸的声音，楼下随即有人敲门。彼得罗把空白行李签搁在扶手上，回来还找得到。'
  sophie_germain_paris:
    name: 寄往柏林的论文
    place: 巴黎
    figure: 索菲·热尔曼
    story: 索菲·热尔曼与卡尔·弗里德里希·高斯通信讨论数论，起初署名勒布朗。1816 年，她凭弹性薄板振动研究获得法兰西科学院的奖。1829 年患病后，她仍继续工作。柏林克雷勒主编的杂志第七卷以她的本名刊出了她论曲面曲率的论文。1831 年 6 月 27 日，她在巴黎去世。
    story_prose:
      opening:
        - 1831 年，巴黎。索菲·热尔曼年轻时曾用勒布朗的名字和高斯讨论数论，后来以弹性薄板研究获奖。患病以后，她还在写一篇论曲面曲率的论文。柏林克雷勒主编的杂志最终刊出了它。
        - 史实里，她于六月在巴黎去世。部分传记记载高斯曾推荐她获得哥廷根大学的名誉学位，她生前未得到学位。在这条分支里，送水的人仍要走上萨伏依街的楼梯，楼上的书桌也还有地方搁一张来信。
        - 这一趟用得上校得动数学稿、能把稿件送出去的人。懂得照护病痛的人，以及能把外地学界消息带来的人，也在这里派得上用场。
      points:
        p1: '{staff}逐页校过曲率论文上的记号，把散页按次序叠好，交给送往柏林的信使。热尔曼用指尖按了按最上面的一页。{staff}抽出手时，封套口正好遮住页首最后一个字。'
        p2: '{staff}凭照护经验为她缓解疼痛，守到她可以自己挪到书桌旁。她伸手拖近没写完的纸。窗光照到桌面时，那只手已经在找搁笔的地方。'
        p3: '{staff}把高斯推荐她的消息带来，照信上的原意慢慢读给她听。热尔曼把纸接过去，从头看了一遍。她把纸放在桌上时，两道折痕还支着薄薄的一角。'
      outcomes:
        all: 柏林的刊物后来印出了她的论文。巴黎那张书桌上，她曾在疼痛稍歇时够到稿纸，也在生前读到了高斯推荐她的消息。来信压在纸叠一角，靠外的一边已经卷起。
        p3: 学位仍来得太迟。那条消息先到了巴黎，后来桌上还能找到那封信，纸在折痕处松松地翘起来。
        p2: 疼痛缓下去时，她还有些时候能坐到书桌前。桌上几张纸从中间摊开，没有再合回去。
        p1: 柏林的第七卷刊出了那篇论文。翻到正文前，页首印的是索菲·热尔曼的名字。
      none: 楼上的灯熄得早。楼梯上还有水桶在碰墙，桌前的椅子已经推了回去。
      not_admitted: '{staff}没能进到萨伏依街楼上的房间。有人提着桶走过，木柄在掌心转了半圈。'
      desync: 没有封好的稿子还摊在桌上。{staff}被召回时，装稿的封套还空着，封口朝上。
      excerpts:
        p3: 热尔曼把纸接过去，从头看了一遍。她把纸放在桌上时，两道折痕还支着薄薄的一角。
        p2: 她伸手拖近没写完的纸。窗光照到桌面时，那只手已经在找搁笔的地方。
        p1: 热尔曼用指尖按了按最上面的一页。{staff}抽出手时，封套口正好遮住页首最后一个字。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借来的名字写给高斯的信。
    points:
      p1: 在她病中护住那篇论曲面曲率的论文，让它寄到柏林克雷勒的杂志
      p2: 减轻她最后几个月在巴黎的癌痛
      p3: 让热尔曼生前知道，高斯在为她向哥廷根大学争取名誉博士学位
    points_fail:
      p1: 论文没写完，留在她的书桌上，1831 年那一卷里没有它。这条分支与历史脱节，员工被送回。
      p2: 没人替她压住疼痛，这条分支里她最后几个月和历史上一样难熬。
      p3: 消息没送到她手里，她到去世都不知道高斯为她做了什么。
    shift:
      p1:
        was: 1831 年，热尔曼论曲面曲率的论文刊于克雷勒杂志第七卷，同年她去世。
      p2:
        was: 约 1829 年起热尔曼患乳腺癌，仍坚持工作，1831 年 6 月 27 日在巴黎去世。
        now: '{staff}用现代的药压住疼痛，在最难熬的时候陪着她。她最后几个月少受了些苦，还能坐到书桌前。'
      p3:
        was: 高斯曾推动哥廷根大学授予热尔曼名誉博士学位，1831 年 6 月 27 日她去世时，学位尚未授出。
        now: '{staff}把高斯所做的事带给她。热尔曼得知，那所她从没能进去读书的大学要给她这份荣誉。'
        who: sophie_germain_paris
        bio: 这条时间线里，热尔曼生前得知高斯推荐她获得哥廷根的名誉博士学位。学位本身仍然来得太迟。
    vignettes:
      water: 3 月 7 日，{staff}同送水的人把两桶塞纳河水扛上萨伏依街的五层楼。他数一级台阶喘一口，说工钱还是按桶算。上到最后一级，他把桶先放下来，手还套在提柄里。
      quai: 四月中旬，{staff}在河岸的旧书摊上翻一本历书。摊主说这几本都是同一户人家的，页边的算式他看不懂，便把整摞往秤盘上挪。
      wash: 五月下旬，{staff}在洗衣船上帮洗衣妇拧床单。她说塞纳河一涨一退，船跟着高低，腰也跟着高低。水从拧紧的床单里滴下去，落到船板上。
  bizet_paris:
    name: 《卡门》的那一年
    place: 巴黎
    figure: 乔治·比才
    story: 《卡门》经过数月排练，于 1875 年 3 月 3 日在巴黎喜歌剧院首演。报刊评价不一，剧院在那年春天继续演出。6 月 3 日，比才在布日瓦尔去世，终年三十六岁。
    story_prose:
      opening:
        - 巴黎喜歌剧院的排练剩下最后一轮。合唱第一声准时进了，第二句却被走位挤到后面。钢琴边的人问，是先给乐队留时间，还是从舞台上的那一步重新来。
        - 《卡门》于 1875 年 3 月 3 日在巴黎首演，比才同年六月去世。这里可以先给合唱和乐队一次合排，演出后再把歌手确切想重过的段落交给比才。
        - 让踩得准进声时刻的员工先和舞台两边对好。演出完，有人可把歌手的话按曲目和词头写下。
      points:
        p1: 乐队想从自己听错的那小节开始。你请台上的歌手先退回原位，让指挥看见他们要走到哪里才能齐声。停了一次以后，全组从入场的那个字再唱。第二次才合上时，管台的人从门边打了个手势，可以往后接了。
        p2: 演后有人在便条上写「进来难」。你请她哼出前一句，叫另一位歌手指出是第几回听到这个开头的。比才接了纸，先看清哪几个人说的，再把它夹进当晚用的谱。词头仍露在外头，下次想重过的人一眼能找到。
      outcomes:
        all: 3 月 3 日首演照期开始。演后比才收到能指到段落的便条，六月的死讯仍按史实进入记录。
        p1: 幕照常拉开。之后歌手只送来一条简略的消息，比才还得等人回来说明。
        p2: 一张标清词头的便条已经递到比才手里。首演日期出了差错，回程只保留这段交接。
      none: 谱上留下两处看着一样的记号。下班离场的人仍说不清合唱应该在哪一处进。
      not_admitted: 管台的人没在名单里找到来客，让你站在不碍门的地方。歌手在里面重新数了几拍。
      desync: 排练没能合拢，3 月 3 日的首演未开始。事务所按同步失败召回员工。
      excerpts:
        p1: 第二次才合上时，管台的人从门边打了个手势，可以往后接了。
        p2: 词头仍露在外头，下次想重过的人一眼能找到。
    relic: 一把折扇
    relic_desc: 一把来自池座的彩绘纸扇。
    points:
      p1: 请剧院再留最后一轮排练，让歌手带上走位，和乐队再对一遍最难进声的地方
      p2: 把一晚的演出情况送给比才，替歌手标清下次还想一起过哪一段
    points_fail:
      p1: 排练卡住，剧院 3 月 3 日拉不开幕。分支脱节，事务所因同步失败召回员工。
      p2: 便条到了，却漏了是哪一段。比才只知道有个地方难唱，还要等人回来指明。
    shift:
      p1:
        was: 喜歌剧院的舞台日志记下了 1875 年 3 月 3 日首演当天的排练和舞台准备。
      p2:
        was: 三月首演后，《卡门》在当年春季继续演出。
        now: 这条分支里，{staff}带来了一张能对回总谱的便条。比才把难进声的位置圈出来，下一场之前可以问问歌手怎么唱比较顺。
    vignettes:
      future: 你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。
      label: 帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。
      seat: 你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。
  modigliani_paris:
    name: 肖像背后的一张纸签
    place: 巴黎
    figure: 阿梅迪奥·莫迪利亚尼
    story: 1919 年 5 月底，阿梅迪奥·莫迪利亚尼和让娜·埃比泰纳带着前一年 11 月出生的女儿，从尼斯回到巴黎。他的结核越来越重，到秋天已没有力气作画。1920 年 1 月 24 日，他因结核性脑膜炎在巴黎慈善医院去世，三十五岁。两天后，怀孕八个月的让娜在父母家去世。1 月 27 日的葬礼，是画家朋友们凑钱办成的。两年前，他生前唯一一次个展销路惨淡。
    story_prose:
      opening:
        - 1920 年 1 月，巴黎。莫迪利亚尼和让娜·埃比泰纳带女儿从尼斯回来已有半年多。他的病渐重，到了秋天，画笔已拿不稳。
        - 史实里，莫迪利亚尼在慈善医院去世，让娜两天后也去世。在这条分支里，画室的门还有人敲，医院和让娜身边也可能有人接手。
        - 这一趟用得上能让画家听进去话的人，也用得上照护病人、带着合用器材的人。让娜身边还需要能耐心坐得住的人。
      points:
        p1: '{staff}把肖像移到亮处，指着其中一张，说很多年以后，还会有人走很远的路来看画上的人。画背的纸签翘起一角。莫迪利亚尼把画转过来，让那张纸签靠进掌心。'
        p2: '{staff}赶到画室，靠照护的经验让病人安稳下来，跟着送他去慈善医院的人走到接手处。门内有人拖来一把椅子。等来人接手，{staff}才从扶了一路的门框边让开。'
        p3: 在医院，{staff}用带来的器材治疗，在床边等他能自己把杯子放回去。杯底在桌上碰了一声。莫迪利亚尼把另一只手伸过去，把杯子又往里推了推。
        p4: '{staff}留在让娜身边照料，等她愿意吃点东西，再把碗放到她够得着的地方。让娜把碗托在腿上。窗边那张旧纸被风掀起来，她伸手拿碗沿压住了纸角。'
      outcomes:
        all: 画室后来又开了门，让娜也重新拿起画笔。桌边有两张矮凳，靠窗的一张沾了一点颜料。
        p3: 病好以后，莫迪利亚尼回了画室。桌上放着一张没画完的脸，画笔横在纸边。
        p4: 后来，让娜又画了画。等两个孩子睡下，她把一张纸展到灯旁。
        p1: 很多年后，有人在画前站住了脚。画背那张纸签还压在框里。
        p2: 医院收下了病人。陪他走过那一程的人最后坐在门内那把椅子上。
      none: 画室门边没有人。门下那一道亮光，天黑以后也看不见了。
      not_admitted: '{staff}没能走进画室。楼梯拐角那袋煤还靠着墙。'
      desync: 送医的事没能接上。{staff}被召回时，楼道里还空着半截。
      excerpts:
        p3: 杯底在桌上碰了一声。莫迪利亚尼把另一只手伸过去，把杯子又往里推了推。
        p4: 让娜把碗托在腿上。窗边那张旧纸被风掀起来，她伸手拿碗沿压住了纸角。
        p1: 画背的纸签翘起一角。莫迪利亚尼把画转过来，让那张纸签靠进掌心。
        p2: 门内有人拖来一把椅子。等来人接手，{staff}才从扶了一路的门框边让开。
    relic: 一截炭条
    relic_desc: 一截能把手指染黑的炭条。
    points:
      p1: 趁他还清醒，让他知道他画的这些人以后会被很多人记住
      p2: 他在画室里病重、几天没人来问的时候，护住他被送进慈善医院的那一程
      p3: 在慈善医院里，治好他的结核性脑膜炎
      p4: 一月下旬，陪在怀孕八个月的让娜·埃比泰纳身边，帮她熬过那几天
    points_fail:
      p1: 这条分支里，唯一那场个展销路惨淡后，没人告诉过他，那些肖像以后会去哪里。
      p2: 这条分支里没有人及时进门，他没能被送到慈善医院，与史实脱节，事务所召回员工。
      p3: 这条分支里病照旧发展，1 月 24 日他在慈善医院去世，三十五岁。
      p4: 这几天里，员工没能留在让娜身边照看她。
    shift:
      p1:
        was: 1917 年 12 月 3 日，警方干预了莫迪利亚尼生前唯一一次个展。展览销路惨淡。
        now: '{staff}在他病倒以前告诉他，他画的这些人以后会挂进世界各地的美术馆。'
      p2:
        was: 1920 年 1 月，莫迪利亚尼病重，被送进巴黎慈善医院。
      p3:
        was: 1920 年 1 月 24 日，莫迪利亚尼因结核性脑膜炎在巴黎慈善医院去世，三十五岁。
        now: '{staff}带去的药治好了他的病，他出了院，回到画室。'
        who: modigliani_paris
        bio: 莫迪利亚尼在 1920 年冬天病愈，又画了许多年，画的仍是身边的人。
      p4:
        was: 1920 年 1 月 26 日，莫迪利亚尼去世两天后，怀孕八个月的让娜·埃比泰纳在父母家中去世，留下十四个月大的女儿。
        now: '{staff}那几天一直守在她身边。这条时间线里，让娜生下了孩子，带着一儿一女长大，后来又拿起了画笔。'
        who: jeanne_hebuterne
        bio: 让娜·埃比泰纳在 1920 年冬天活了下来，生下第二个孩子，带大两个孩子，并继续画画。
    vignettes:
      coal: 1 月 10 日，{staff}替卖煤的人把一袋煤扛上楼。他说今年少有人买整袋，往往只买半袋。袋子放到拐角，他伸手掸去楼梯扶手上的煤灰。
      saucers: 二月初，{staff}帮咖啡馆伙计收桌。伙计用碟子数杯，朝里桌努了努嘴，那里几只碟子摞得最高，底下还压着一张画。
      mimosa: 三月初，{staff}替市场里的女人解开一捆含羞草。她说花是夜车带来的，解开绳子时，一抹黄掉进了围裙的褶里。
  boole_ballintemple:
    name: 湿衣服与一堂课
    place: 科克巴林滕普尔
    figure: 乔治·布尔
    story: 科克在下雨，乔治·布尔还有一堂课要上。一名学生拿着《思维规律研究》里的习题，还没想通第二遍该怎么选。城的另一头，布尔还没写完的微分方程书里，一张表以后得重算，只因为公式里的一个符号。
    story_prose:
      opening:
        - 1864 年 11 月，爱尔兰科克。乔治·布尔是女王学院的第一位数学教授。十年前，他在《思维规律研究》里用代数写下推理的规律，其中一条说，照同一个条件选两遍，选出来的东西不变。这时他手上还有一部没写完的微分方程书。
        - 史实里，11 月 24 日他冒着大雨从家里赶到学院上课。12 月 8 日，他因胸膜肺炎在巴林滕普尔的家中去世。第二年，托德亨特整理出补编，序里写明书末那张表因为公式的一个符号写错，由塞普顿重算过。在这条分支里，有个学生攥着编号纸条，还在想照同一个条件选第二遍，会少掉哪一张。
        - 这一趟用得上三种人：守时、肯冒雨把讲义送到的人，核得了公式、找得出错处的人，懂护理、接得住一班夜里照护的人。
      outcomes:
        all: 十二月的那几夜，布尔家的灯整夜亮着，守夜的人换了一班又一班。那张纸签，第二年还夹在原处。
        p3: 那几夜，布尔家的灯整夜亮着，守夜的人换了一班又一班。
        p2: 第二年，编辑打开文件夹，那张纸签还夹在原处。塞普顿从那个符号算起。
        p1: 11 月 24 日那堂课，讲台上的讲义一页也没有湿。
      none: 雨一直下到十二月。巴林滕普尔那栋房子里，守在床边的人一夜没合眼。
      desync: 那天的雨把讲义泡成了一团，讲台上空着。{staff}没等到下一堂课，就被事务所召了回来。
      not_admitted: '{staff}没能进学院的门。雨还在下，讲义还摊在布尔家里的桌上。'
      points:
        p1: 11 月 24 日，雨下得很大。布尔出门之前，{staff}把讲义用油布包了两层，揣在怀里先一步赶到学院，放进讲台的抽屉。布尔进门时外衣在滴水，他拉开抽屉，讲义是干的。他把它摊开，用袖口擦了擦手，开始讲。
        p2: '{staff}把那张表和推出它的公式摊在一起，一行一行往回算。算到一处，数对不上，顺着往上查，是公式里一个符号写反了。{staff}没有改原稿，只在那一页夹了一张纸签，写明哪一行、哪个符号。'
        p3: 十二月初，布尔病倒在家里，家人轮流守着，好几夜没合眼。{staff}照护理的规矩接下晚上那一班，按时替他翻身、喂水、掖好毯子，把夜里的情形一条条记在纸上。家人留着灯，先去睡了几个钟头。天亮前回来时，炉火还旺着，床头的纸上记满了一夜的钟点。
      excerpts:
        p3: 家人留着灯，先去睡了几个钟头。天亮前回来时，炉火还旺着，床头的纸上记满了一夜的钟点。
        p2: 算到一处，数对不上，顺着往上查，是公式里一个符号写反了。{staff}没有改原稿，只在那一页夹了一张纸签，写明哪一行、哪个符号。
        p1: 布尔进门时外衣在滴水，他拉开抽屉，讲义是干的。他把它摊开，用袖口擦了擦手，开始讲。
    relic: 一页逻辑演算
    relic_desc: 一张课堂习题纸，演示照同一条件筛选两次会得到什么。
    points:
      p1: 大雨中从家出门前，把要用的讲义干干地送到学院，护住布尔当天的课
      p2: 拿公式和算出来的表格对照，把可能有问题的符号标出来，留给下一位核稿的人
      p3: 找人来接一班晚间照护，让守在布尔床边的家人歇一会儿
    points_fail:
      p1: 讲义淋湿且没人有备份，当天课没能开讲，事务所因同步失败召回员工。
      p2: 表格装进文件夹，公式还没核过。以后还得塞普顿自己查出错处。
      p3: 晚上没人替班。守在床边的人只有放下灯的时候才离开一小会儿。
    shift:
      p1:
        was: 科克学院档案记布尔在 1864 年 11 月 24 日的大雨里从家赶去教学。
      p2:
        was: 布尔于 1864 年 12 月去世，托德亨特后来整理了补编。编者序记有一张表因稿内符号写错而需重新算过。
        now: 编辑一打开文件夹，就能顺着纸签翻到公式。塞普顿可以从那个符号开始核算。
      p3:
        was: 1864 年 12 月 8 日，布尔因胸膜肺炎在巴林滕普尔的家中去世。
        now: '{staff}找到人来坐一班。家人留着灯，先睡了几个钟头，再回来接替。'
    vignettes:
      repeat: 窗外下着雨。{staff}请学生挑出偶数，再拿着手里的纸条挑一遍。学生想找一张放回桌上，手里却一张都不用放。
      border: 油灯底下，学生要抄一排数字，{staff}问第一个是怎么算来的。他先用笔尖划了一道线连回公式，再往下抄。
      example: 学生把做完的习题压在书下，书脊磨得发白。页边露出一小截纸签，刚好够手指捏住。
  wallace_ternate:
    name: 来自特尔纳特的论文
    place: 特尔纳特
    figure: 阿尔弗雷德·拉塞尔·华莱士
    story: 1858 年 2 月，阿尔弗雷德·拉塞尔·华莱士在摩鹿加群岛发烧，退烧后写了一篇论文，谈变种怎样偏离原型。论文落款是「特尔纳特，1858 年 2 月」。3 月 25 日，他从特尔纳特乘船出发，同行的有年轻猎手朱马特，一行人抵达新几内亚海岸的多雷。论文寄到了英格兰。7 月 1 日，他与达尔文的文章在伦敦一同宣读，两位作者都不在场。
    story_prose:
      opening:
        - 1858 年 2 月，摩鹿加群岛。华莱士在一阵高烧后写下论文，说明生物的变种怎样偏离原型。他在稿末写下特尔纳特。
        - 史实里，论文寄到了英国，华莱士随船去了多雷，在那里伤了脚踝。同行的朱马特在六月病逝。在这条分支里，有人能在写稿时守夜，也能跟着船去多雷。
        - 这一趟用得上能守住病榻、让人歇过一阵的人。熟悉伤口照料、带来合用药物或器材的人，也会有事做。
      points:
        p1: 华莱士烧稍退时，{staff}守在一旁，把纸和水挪到他伸手够得着的地方。他落笔写下地名，手停了一会儿。{staff}把窗边那张已经掀起的纸用指尖按住。
        p2: 到多雷以后，{staff}照料华莱士受伤的脚踝，等他能把脚踩稳，再陪他试着多走几步。门外泥还湿着。华莱士把鞋踏进去，第二个脚印落得和头一个一样实。
        p3: 朱马特卧床起不来。{staff}守着他，用带来的药物或器材照料，等他能自己挪动水碗。朱马特先拿两只手捧碗，后来松开一只。碗里的水沿着他的手腕滴到床边。
      outcomes:
        all: 论文后来到了英国。多雷的船离岸时，朱马特把腿收过船沿，华莱士留出一截长凳。
        p3: 七月底的船上多留了一个位置。朱马特坐下来，脚边放着那只喝水的碗。
        p2: 汽船停在多雷的那些天，华莱士又进了林子。走出一段，他弯腰掸掉鞋上的泥。
        p1: 寄出的论文后来在伦敦宣读。展开稿纸，最后一行还留着「特尔纳特」。
      none: 屋里剩一张靠窗的桌子。潮气上来时，最外边的纸角慢慢弯了起来。
      not_admitted: '{staff}没能跟上这一行人。码头的缆绳松下来，在水面划了一道。'
      desync: 病床边的纸没写完。{staff}被召回时，窗框内侧还留着一小片湿。
      excerpts:
        p3: 朱马特先拿两只手捧碗，后来松开一只。碗里的水沿着他的手腕滴到床边。
        p2: 门外泥还湿着。华莱士把鞋踏进去，第二个脚印落得和头一个一样实。
        p1: 他落笔写下地名，手停了一会儿。{staff}把窗边那张已经掀起的纸用指尖按住。
    relic: 针盒里的一只甲虫
    relic_desc: 一只收集来的甲虫，放在小锡盒里。
    points:
      p1: 疟疾发作的那几天，护住那篇论文写完
      p2: 治好他在多雷伤的那只脚踝，不让它溃烂
      p3: 救下猎手朱马特，治好他的高烧和痢疾
    points_fail:
      p1: 烧一直没退下去，二月里稿子没有写完，邮船带走的信里没有它，这条分支里 7 月 1 日的林奈学会没有这篇论文。
      p2: 伤口照史实溃了，他在小屋里拄着拐坐了一个多月，这条分支里多雷林子里那些虫子还是只有仆人替他去捉。
      p3: 6 月 26 日朱马特照史实病逝，这条分支里七月离开多雷的船上少了他。
    shift:
      p1:
        was: 1858 年 2 月，华莱士疟疾稍好便提笔写成论文，稿末落款特尔纳特。
      p2:
        was: 1858 年 5 月，华莱士在多雷伤了脚踝，伤口溃成溃疡，一个多月下不了地。
        now: 伤口没有溃，汽船到港那些天他照旧每天进林子。
      p3:
        was: 1858 年 6 月 26 日，十八岁上下的朱马特在多雷病逝，华莱士写他是个安静的小伙子，活干得踏实。
        now: '{staff}守着他退了烧、止住了病，七月底离开多雷时，他也在船上。'
    vignettes:
      places: '{staff}抄下鸟类标本的签条，在每张旁补上岛名。放回最后一张时，签角卡进了抽屉的木缝。'
      claim: '{staff}把两座岛上的甲虫排成两行，给相像的那两只之间留了一指宽。合上盘盖前，还能看见那道空隙。'
      mail: '{staff}把一封长信包进油纸，像水手捆海图那样打了双结。油纸上有一点水，绳结压得很紧。'
  hooke_london:
    name: 实验的管理人
    place: 伦敦
    figure: 罗伯特·胡克
    story: 有人翻出胡克的《显微图谱》，照着图版描软木里的小格。描着描着，格子齐得像蜂巢，原图却没那么整齐。屋里还放着几捆讲稿和实验记录。等几年后别人来翻，也得分清哪一页本来是空的，哪一页是真的缺了。
    story_prose:
      opening:
        - 1703 年，伦敦。胡克的《显微图谱》里，软木的格子像蜂巢，边线却并不齐整。屋里的读者顺着图版描，描到歪处就想补齐。
        - 史实里，沃勒后来刊行了一部分讲稿，还有些遗稿等了更久才由别人整理。在这条分支里，潮气上来的屋子里有人翻图，也有人来挪纸捆。
        - 这一趟用得上管得住讲稿、能给别的纸捆留目录的人。懂得读图、能让读者看见一条断线的人，也有事可做。
      points:
        p1: 纸堆要搬动，{staff}依原来的次序点清讲稿，把卷起来的几页归回同一捆。纸捆换了地方，最上面还压着原来的封页。收绳时，{staff}避开了露在外面的纸角。
        p2: '{staff}把余下各捆的题名逐一抄到目录上，再沿着纸捆重对一遍。目录放在箱盖一抬就看得见的地方。最后一行墨还没干，{staff}把箱盖留了一指宽。'
        p3: '{staff}把描图和原图并着拿给胡克，请他认一认哪里该留断。胡克的手指停在两张图之间。那两段没接起来的线，最后还露着纸的底色。'
      outcomes:
        all: 两年后讲稿成书，没入书的那些纸也有了题名。后来有人掀开箱盖，先拿起薄薄一张目录。
        p2: 有人来找一段没刊行的实验记录，报得出纸捆上的题名。箱盖打开，最上面就是目录。
        p3: 后来读者重翻那张描图。手指沿一格走了一圈，到缺口处停了下来。
        p1: 沃勒后来接到那捆讲稿。翻开封页，里面的纸还照原来的次序叠着。
      none: 箱盖落下去，屋里只听到纸擦木头的声音。窗前还有一张没描完的图。
      not_admitted: '{staff}没进到放讲稿的屋里。门缝的光照出木箱一角。'
      desync: 挪过的讲稿散开了。{staff}被召回时，绳子还平放在桌上。
      excerpts:
        p2: 目录放在箱盖一抬就看得见的地方。最后一行墨还没干，{staff}把箱盖留了一指宽。
        p3: 胡克的手指停在两张图之间。那两段没接起来的线，最后还露着纸的底色。
        p1: 纸捆换了地方，最上面还压着原来的封页。收绳时，{staff}避开了露在外面的纸角。
    relic: 一幅跳蚤的图
    relic_desc: 《显微图谱》里那幅折页跳蚤版画的摹本。
    points:
      p1: 挪动纸堆时把讲稿留在一起，让沃勒日后仍能找齐要入书的稿子
      p2: 给讲稿以外的纸捆另留一张目录，让后来的编者有题名可查
      p3: 趁胡克还看得到那张描图，把它拿给他看，问哪几处该留着断线
    points_fail:
      p1: 一捆讲稿跟零散纸件一道运走。沃勒后来凑不齐汇编所需的纸页，事务所召回员工。
      p2: 下一个编者看得出哪些稿印了出来，目录却没告诉他其他的稿在哪里。
      p3: 描图夹回书里，读者已经把断线都接上了，也没来得及问。
    shift:
      p1:
        was: 胡克 1703 年去世。由理查德·沃勒整理的遗著汇编于 1705 年刊行。
      p2:
        was: 沃勒的汇编只保存部分遗稿。胡克的部分日记及其他遗留文献经另一些编辑才陆续出版。
        now: 箱里多了一张目录。下次有人来找没印出来的实验记录，可以先报出纸捆的题名。
      p3:
        was: 胡克在《显微图谱》里把软木的小孔比作蜂巢，同时指出它们的形状并不规整。
        now: '{staff}把描图和旧版画摊在一起。胡克指给读者看，哪里开始就对不上了。那两道断开的线，他没有再补。'
    vignettes:
      edge: 读者顺着小格描完两条边，顺手添了第三条。{staff}把纸举到窗前，最直的一道正是刚添的。
      analogy: '{staff}请读者找一个塞不进蜂巢的格。两只手指伸过去，碰在同一条歪边上。'
      plate: 读者揭开折页，一只跳蚤铺了半张桌。{staff}压着纸角，等墨水瓶挪开。
  leavitt_cambridge_ma:
    name: 星星的一条规则
    place: 马萨诸塞州剑桥
    figure: 亨丽埃塔·勒维特
    story: 1912 年，哈佛天文台的通报把小麦哲伦云里二十五颗变星按周期排成一张表。勒维特把最亮和最暗时的读数分别画成图。两张图上，明暗变化一轮所需时间越长，星就越亮。
    story_prose:
      opening:
        - 1912 年，马萨诸塞州剑桥。勒维特把小麦哲伦云里二十五颗变星按周期排成表，又画出它们最亮和最暗时的读数。周期越长的星，在两张图上都越亮。
        - 史实里，周期表刊在哈佛天文台通报上。后来研究者用银河系里的造父变星完成首次定标。在这条分支里，有人接着核底片，也有人能把候选星名单随观测申请送上去。
        - 这一趟用得上能把很暗的星对回底片的人，也用得上能把下一步观测的理由讲清楚的人。
      points:
        p1: 排印前，{staff}对着玻璃底片和暗星的读数一格格核准。少掉的那颗找到了，勒维特把它放回原来的周期位置。长尺沿着最后一行挪开。透过玻璃看去，那一点还留在原处。
        p2: '{staff}把通报还没解决的定标难题写进观测申请，把候选星的名单附在后面。后来的量测送到时，勒维特把两张纸并拢。她的铅笔跨过纸缝，停在同一颗星上。'
      outcomes:
        all: 周期表印了出来，后来又有观测送到桌上。勒维特拆开封套，把新的读数摊到旧图旁。
        p2: 勒维特后来和合作者一同核过新的量测。他们把两份样本并排压在桌上，同一颗星下有两道铅笔印。
        p1: 排印后的通报摊开在桌面上。两张图上的点还沿着原来的斜线。
      none: 底片一张张收了起来。最上面的一片滑到匣边，露出光下的一角。
      not_admitted: '{staff}没能进到核底片的地方。玻璃匣从门内送过时，边角闪了一下。'
      desync: 表上的空格留到了交稿。{staff}被召回时，尺子还压着没对上的那一行。
      excerpts:
        p2: 后来的量测送到时，勒维特把两张纸并拢。她的铅笔跨过纸缝，停在同一颗星上。
        p1: 长尺沿着最后一行挪开。透过玻璃看去，那一点还留在原处。
    relic: 一块玻璃底片
    relic_desc: 一块布满细小星点的照相底片。
    points:
      p1: 排印前帮勒维特把暗星观测与玻璃底片对上，护住二十五颗变星的周期表
      p2: 用通报里留下的定标难题争取观测时间，让勒维特本人参与下一步
    points_fail:
      p1: 错号让排印人员删去无法查对的几行，二十五颗星的周期表没有发表。行程同步失败，员工被召回。
      p2: 论文留下了亮度与周期的关系，给它定出绝对尺度的工作要由外地的研究者接手。
    shift:
      p1:
        was: 1912 年 3 月 3 日，哈佛天文台第 173 号通报刊登了勒维特整理的二十五颗小麦哲伦云变星周期。
      p2:
        was: 1913 年，首次定标采用了银河系中的造父变星。
        now: '{staff}把候选星名单附在观测时间申请上。等新一批量测结果送到，勒维特能和合作者一起核对样本。'
        who: leavitt_cambridge_ma
        bio: 勒维特继续做变星的亮度研究，并参与将自己的关系式用于测量距离。她给后来的定标留有自己的观测说明。
    vignettes:
      rank: '{staff}念出周期，抄表人翻到底片目录的后一页。少掉的星号回来以前，图上的点一个也没挪。'
      distance: '{staff}并起两张图，指出刻度差了一格。对方先擦掉那个数字，橡皮屑落在两张纸的缝里。'
      period: 抄表人报完亮度就要换行。{staff}把尺按在纸边，等最后一个周期也抄过来才松手。
    remarks:
      trait_methodical: '{staff}将底片收回纸套前，又对了一遍星号。'
  bessie_coleman_jacksonville:
    name: 起飞之前，她的姓名
    place: 杰克逊维尔
    figure: 贝茜·科尔曼
    story: 贝茜·科尔曼于1921年6月15日在法国取得国际飞行执照。1926年4月30日，她在杰克逊维尔帕克森机场为五一活动试飞时遇难。
    story_prose:
      opening:
        - 1926 年四月，杰克逊维尔。贝茜·科尔曼在法国拿到飞行执照，这一回来到佛罗里达，为当地活动做准备。
        - 史实里，她在四月二十九日到学校和学生见面，第二天在试飞中遇难。在这条分支里，活动的人来借原来送她去学校的车。
        - 这趟用得上能跟学校和主办人商量的人，也用得上懂机务、敢在别人都等着起飞时提议再查一遍的人。
      points:
        p4: '{staff}请负责机务的人先到场，和科尔曼、驾驶员一起听完地面检查意见。等候起飞的人问要把领到的座位让给谁，科尔曼说，先把今天的本子拿来。 驾驶员把明日以后可用的时段指给她看。她取过铅笔，把今天那一栏留空。'
        p2: 学生提了许多问题，有一张纸折得太小，开口时没人接。{staff}把它递给留下来的老师，请他单独留一堂课，再问科尔曼有什么训练消息愿意寄来。 老师把回信地址抄在黑板一角。最后一个走的孩子回过头，又抄了一遍门牌。
        p1: '{staff}把主办人的时间表拿到学校，问清哪一段已经通知了学生，再回去借到另一趟车给活动的人用。科尔曼到学校时，走廊已经排起队。 前排一个孩子把写着她名字的纸扶正。等她在桌边坐下，那孩子才把自己的问题推过去。'
      outcomes:
        all: 这天没试飞。科尔曼把老师的地址压在记录本里，和驾驶员一起把留空的那一页翻到了上面。
        p4: 试飞另择日期。当天收场时，还没人往那一栏添新的数字。
        p2: 当地老师把那叠问题收进教室，放到下一堂课要用的本子旁边。
        p1: 学校的会面按约举行。散场时，写着科尔曼名字的纸还有人在门边等着取。
      none: 活动散了，桌上剩下几页无人带走的名单。
      not_admitted: '{staff}没能见到学校和机场两边的人。有人从门边提走了最后一只凳子。'
      desync: 访校安排从时间表上划掉。事务所召回{staff}时，校门边还有孩子等着。
      excerpts:
        p4: 驾驶员把明日以后可用的时段指给她看。她取过铅笔，把今天那一栏留空。
        p2: 老师把回信地址抄在黑板一角。最后一个走的孩子回过头，又抄了一遍门牌。
        p1: 前排一个孩子把写着她名字的纸扶正。等她在桌边坐下，那孩子才把自己的问题推过去。
    relic: 一张有日期的样张
    relic_desc: 地面告示，完整排出了科尔曼的姓名。
    points:
      p1: 护住科尔曼的学校行程，别让赶着筹备试飞的人取消她和学生见面的时间
      p2: 帮科尔曼同当地老师约好一堂后续课，请老师接着回答学生怎样学飞的问题
      p4: 请机务人员先在地面复查飞机，若还需检修，就劝科尔曼和驾驶员改天再飞
    points_fail:
      p1: 临时筹备挤掉了约好的到访，科尔曼赶不到学校，这条分支与史实脱节，员工当天被召回。
      p2: 孩子们问过学飞的事，散场时还没有老师答应接着教。
      p4: 旧飞机按原安排升空，科尔曼和驾驶员在试飞中遇难。
    shift:
      p1:
        was: 1926 年 4 月 29 日，科尔曼到杰克逊维尔的黑人公立学校拜访学生。
      p2:
        was: 科尔曼到杰克逊维尔的学校与学生见面，也想筹办自己的飞行学校。她生前学校未能开办。
        now: 这条分支里，一位老师收好学生的问题，答应再讲一堂课。科尔曼留下这位老师的地址，往后有学飞的消息还能寄来。
      p4:
        was: 1926 年 4 月 30 日，科尔曼和驾驶员在帕克森机场的试飞事故中遇难。
        now: 这条分支里，机务人员建议再做一次地面检查，科尔曼和驾驶员把试飞改到别的日子。
        who: bessie_coleman_jacksonville
        bio: 科尔曼从杰克逊维尔回去后继续飞行，也继续筹办向黑人学生开放的飞行训练。
    vignettes:
      proof: 安少了一行，已经把飞行员的名字裁得只剩姓。你删掉两个吹捧词，给全名腾出位置。跑腿人来取时，她请他念全名，再把样张折好。有人问谁要飞，他可以直接说出名字。
      school: 刘易斯以为围观的人只想知道几点开场。有孩子在围栏边问，这位飞行员在哪儿学的。你告诉他执照是在哪儿发的，把最后一行留给这个可以复述的事实。他取走样张时，连日期也练着念了一遍。
      ground: 场边的人越来越多，你知道明天的告示不会再写这场表演。安问是不是这会儿就发。你留一份注明日期的样张，帮她把别的送到门口。你的行程在地面结束，观众还在往这儿来。
  scott_last_camp:
    name: 冰架上的帐篷
    place: 罗斯冰架
    figure: 罗伯特·法尔肯·斯科特
    story: 斯科特日记最后一则署于 1912 年 3 月 29 日。现存手稿记录了南极点归途上的最后营地。
    story_prose:
      opening:
        - 罗斯冰架的风起来以后，雪橇上有一袋从冰川带回的岩石。斯科特把日记移到离帐门更远的地方，前面的人不敢答应明早能走多远。奥茨脱下靴子，问还有没有一处干的地方可以坐。
        - 1912 年 3 月，斯科特一行在返程遇险。奥茨离开帐篷后未归，斯科特等三人后来被困在距离一吨仓库约十一英里的营地。你可以先保护留存的日记和标本，再分别照护奥茨和斯科特，最后尝试接应到仓库。
        - 找能携带器材和在严寒里照应人的员工。两处冻伤都让照护者问本人，再准备好最后一段补给，多留时间给最慢的人。
      points:
        p1: 有人问能不能卸下一袋石头。你请威尔逊先念袋上的采集地，又跟斯科特对过日记所在的位置。大家把不必翻找的东西放到下头，让日记和岩样各有一处不会合在一起的地方。收帐时，标着冰川名的签条仍能从雪橇侧面看见。
        p2: 奥茨试把靴口撑开，手停在那里，说这回走不了快。你请他先在帐里坐稳，让照护的人留下，和他商量明天怎样跟队伍同走。次日帐门打开时，他等到自己的靴子和其他人的摆在同一边，才起身跟上。
        p3: 斯科特说右脚不像左脚那样能踩住雪。你替他叫了队里能照护的人，请拉雪橇的同伴先放下绳，别为了省几分钟就走。再出发时，他把脚摆稳以后自己告诉旁边的人可以动了。走出第一段，他还能停下来在日记上记当天的进度。
        p4: 风雪压住帐门，前面还有十一英里。你等大家自己说准备好了，和熟悉补给位置的人轮流看方向。等见到仓库边的旗，先请最后那个人过来，再让大家去看里面还有什么。给次日留的那页日记在补给堆旁打开，笔尖还能在纸上移动。
      outcomes:
        all: 日记和岩样随队带到仓库，奥茨、斯科特和留在队伍里的人都过了这一段。到仓库后，记录还添了新的一天。
        p1: 标本和日记留到最后，没有因为减重散在冰架上。
        p2: 奥茨仍随队走。到下一次休息时，他和同伴能一起留在帐里。
        p3: 斯科特还能把脚落稳。其余人的情况和最后一段风雪仍要交给后来行动。
        p4: 队伍里走完最后一段的人到了仓库。报告按各人实际分支登记到达者。
      none: 补给和人的精力越来越少。帐外一直是风雪，记录停在三月下旬。
      not_admitted: 队员还没定谁能跟着出发。你留在帐外，油箱和岩袋都没交到手里。
      desync: 标本与日记的收存中断。原有留下的记录失去同步，事务所召回员工。
      excerpts:
        p1: 收帐时，标着冰川名的签条仍能从雪橇侧面看见。
        p2: 次日帐门打开时，他等到自己的靴子和其他人的摆在同一边，才起身跟上。
        p3: 走出第一段，他还能停下来在日记上记当天的进度。
        p4: 给次日留的那页日记在补给堆旁打开，笔尖还能在纸上移动。
    relic: 一本日记
    relic_desc: 一本用铅笔写的小日记，被冻得发硬。
    points:
      p1: 在燃油见底、人人力竭的三月，护住雪橇上的日记和比尔德莫尔冰川采回的岩石标本
      p2: 治好奥茨冻坏的双脚，让他跟得上队伍，不必在 3 月 16 日前后走出帐篷
      p3: 在 3 月 18 日之前保住斯科特的右脚，不让冻伤拖住整支队伍
      p4: 带三人冒着 3 月 21 日起的暴风雪，走完离一吨仓库的最后十一英里
    points_fail:
      p1: 标本被卸在冰架上，日记也没能留到最后一天。这条分支与历史脱节，员工被送回。
      p2: 他的脚一天比一天坏，这条分支里他照样在 3 月 16 日前后走进风雪，再没回来。
      p3: 右脚冻坏了，这条分支里和历史上一样，队伍越走越慢。
      p4: 暴风雪把帐篷困在原地，3 月 29 日以后日记再没有新的一页。
    shift:
      p1:
        was: 1912 年 3 月，回程燃油短缺，队伍仍把日记和采自比尔德莫尔冰川的舌羊齿化石留在雪橇上，11 月 12 日搜救队在帐篷旁找到它们。
      p2:
        was: 1912 年 3 月初奥茨双脚严重冻伤，越走越慢，3 月 16 日或 17 日他走出帐篷，再没回来。
        now: '{staff} 每晚给他焐脚、换干袜，冻伤没再坏下去。奥茨跟着雪橇走，到最后一个营地仍在队里。'
      p3:
        was: 1912 年 3 月 18 日，斯科特在日记里写右脚的脚趾几乎全冻坏了，此后队伍走得更慢。
        now: '{staff} 每次宿营都给他焐暖右脚、裹好。斯科特的脚保住了，队伍照原来的速度往北走。'
      p4:
        was: 1912 年 3 月 21 日起，暴风雪把斯科特、威尔逊和鲍尔斯困在离一吨仓库十一英里的帐篷里，日记最后一则署 3 月 29 日，搜救队 11 月 12 日找到帐篷。
        now: '{staff} 趁风势稍弱领着三人往北，把最后十一英里分成几段走完。他们在一吨仓库找到燃油和口粮，熬过了这场风雪。入冬之前，他们回到了埃文斯角。'
        who: scott_last_camp
        bio: 这条时间线里，斯科特和威尔逊、鲍尔斯从极点活着回到了埃文斯角。他回到英国，亲自整理了这次远征的日记和科学成果。
    vignettes:
      distance: 回到事务所，虚构书记员把一个数抄进已走路程一栏。你指出那是还没走完的距离。他在抄件入档前把数移了过去。
      blank: 回到事务所，书记员念到最后一个日期停了笔。你等他想好后面的空白该怎么标。他写下「记录到此为止」，才搁下笔。
      opening: 回到事务所，你翻开练习抄本，先读日期再读内容。书记员把同一日期写上封签，下一次还能按顺序找到这一页。
  mallory_everest:
    name: 最后一次被人看见
    place: 珠穆朗玛峰
    figure: 乔治·马洛里
    story: 马洛里在 1924 年远征中留下的信件记述了不同营地的状况和计划。马洛里与欧文的结局无法证明二人是否登顶。
    story_prose:
      opening:
        - 北坳的帐篷口有人问下来的诺顿现在能不能睁眼。另一位队友朝上望，马洛里还在准备下一次出发，夹在旧帐篷里的指南针没有跟他下来。
        - 1924 年，诺顿与萨默维尔从珠峰上方折返，随后马洛里和欧文出发。6 月 8 日奥德尔看到两个人继续向上，二人没有返回。这里可以接应先下来的同伴、归还指南针，也可以让后一队在北坳平安留下回程记名。
        - 带有照护能力的人先看诺顿与萨默维尔想要什么。熟悉营地交接的人核指南针在哪里，之后找能接应另一队回程的员工。
      points:
        p1: 诺顿回头喊了一声，萨默维尔没能回答，只把手按在膝上。你请走在前面的人回来，找一处能让他先坐的地方，等他能说话再问还有什么不适。萨默维尔点了头，两个人才把原本挡在他膝边的包挪开。起身时，他先等诺顿把那句问候听完。
        p2: 诺顿说灯边太亮，话刚说完就把眼闭上。你请他自己挑能歇息的位置，试试让事务所的照护员工帮忙。过了一阵，他说有一处还发痛，另外那只眼已经能辨一点光。等人重新举起记名板，他能自己看清写的是哪一行。
        p3: 奥德尔翻开五号营地的布兜，看见小圆盒挨着一件备用物。你先核过马洛里留的话，再带着牌记把它交到他手里。马洛里打开看了一眼，叫旁人也看清，他这回自己装进要随身带的口袋。 那只指南针最后在他的外袋里。
        p4: 有人从北坳问云里下来的两个人是不是前一队。你等到他们能自己叫出名字，才请守营的人记上。马洛里把包先放在雪地里，欧文坐到靠里的一处。他们在营地复述的是下来的经过，没人能替他们填一个登顶时间。
      outcomes:
        all: 萨默维尔和诺顿平安回来，指南针也交到了马洛里手里。后一队名册上在北坳添了两名返回者。
        p1: 先一队的两个人平安回营。之后上去的一队还要等别的接应。
        p2: 诺顿在分支里恢复到能辨认手边的字。其余记录照行程结算。
        p3: 指南针装进他自己随身的包。仅凭这件物品的去向仍说不准两人的终点。
        p4: 马洛里与欧文活着回到北坳。回程的结局改变了，营地没有确证他们登顶。
      none: 营地眼前只有风雪和没有改过的名单。奥德尔后来记了两人最后一次出现在山脊上。
      not_admitted: 值班人没同意陌生人接替看帐篷。你等在门外，里面只说了几件未归还的用品。
      desync: 萨默维尔没随诺顿回到营地。前一队的回程与史实脱节，事务所召回员工。
      excerpts:
        p1: 起身时，他先等诺顿把那句问候听完。
        p2: 等人重新举起记名板，他能自己看清写的是哪一行。
        p3: 那只指南针最后在他的外袋里。
        p4: 他们在营地复述的是下来的经过，没人能替他们填一个登顶时间。
    relic: 一把冰镐
    relic_desc: 一把朴素的木柄冰镐，镐头磨旧了。
    points:
      p1: 萨默维尔下山时喉头被堵住，帮他喘过这口气，护住他和诺顿那次冲顶平安收尾
      p2: 治好诺顿的雪盲
      p3: 把马洛里落在五号营地的指南针送到他手上
      p4: 劝回马洛里和欧文，或在他们下撤时接住，让两人活着回到北坳
    points_fail:
      p1: 萨默维尔在雪里坐下，再没有站起来。冲顶的两个人只回来一个，这条分支与历史脱了节，事务所召回员工。
      p2: 诺顿的眼睛疼得睁不开，接下来几天他什么也看不见。
      p3: 指南针还留在五号营地的帐篷里。6 月 8 日两人往上走时，身边没有它。
      p4: 6 月 8 日中午过后，奥德尔最后一次看见两人在山脊高处往上走。他们没有回来。
    shift:
      p1:
        was: 1924 年 6 月 4 日，诺顿和萨默维尔从六号营地出发，到达约 8570 米；下山时萨默维尔的喉头被冻坏的组织堵住，几乎窒息，咳出后两人回到营地。
      p2:
        was: 1924 年 6 月 4 日夜里，诺顿患上严重的雪盲，回到北坳后几乎看不见东西。
        now: 诺顿的眼睛第二天就消了肿，他看得见北坳上来来往往的人。
      p3:
        was: 1924 年 6 月 7 日，马洛里从六号营地托挑夫带条子给奥德尔，说指南针落在了五号营地的帐篷里，他们身边没有指南针。
        now: 6 月 8 日清早出发时，马洛里的指南针在他自己口袋里。
      p4:
        was: 1924 年 6 月 8 日，奥德尔最后看见马洛里和欧文在东北山脊高处向上攀登，两人再没有回来；1999 年马洛里的遗体在约 8160 米处被找到。
        now: 6 月 9 日两人下到北坳，冻伤了，但活着。马洛里回到英国，回到露丝和三个孩子身边。他们那天到了哪里，这条时间线也没有答案。
        who: mallory_everest
        bio: 1924 年他和欧文从珠峰活着下来。他回到妻子露丝和三个孩子身边，又活了许多年。
    vignettes:
      date: 虚构的送信人拿着来自两个营地的信，交接单上却只写一个日期。你请他各自看信头，两封信出发时便各带着自己的地名和日期。
      question: 送信人把预定出发念成了准会出发。你在信中说到天气的地方请他停一下。他再念这项计划时，连同那个条件一起说出来。
      wrap: 送信人在膝上分拣纸页，你替他把要带走的信封放在一旁。他可以另把营地清单收好，不用折进信里。
  fanny_mendelssohn_berlin:
    name: 用自己的名字印六首歌
    place: 柏林
    figure: 范妮·门德尔松·亨泽尔
    story: 范妮·亨泽尔的《六首歌曲》作品一号于 1846 年以她本人的名字出版。次年春，她写完钢琴三重奏，也写了《山间之乐》。5 月 14 日，她在柏林排练时发病，当天去世。三重奏于 1850 年刊行。
    story_prose:
      opening:
        - 1847 年春，柏林。范妮·亨泽尔已经以自己的名字出版了六首歌。钢琴三重奏写成以后，她在日记里说，一时没有写出新的乐句。
        - 史实里，她最后又写成一首歌，五月十四日在排练时病倒，当天去世。在这条分支里，排练的人带来的三份谱，各有不同的记号。
        - 这趟用得上能对谱和跟演奏者讲清先后的人。等屋里出了事，还得有人停下手里的活，去请帮手。
      points:
        p3: 亨泽尔在排练时没再翻下一页。{staff}先让合唱停下，请门边的人去找医生，再问哪一位家人她认得。歌手们往后退，把椅子挪出一条路。 一位家人把谱放到地板上，坐到了她旁边。刚才没翻过去的那一页还敞着。
        p1: '{staff}请排练者稍迟一点来领谱，把亨泽尔早已留给自己写歌的那段时间空出来。楼下有人开门，她听见了，也没有站起来。 她把最后一行写进谱纸。墨还没干，第二次敲门已经响了。'
        p2: '{staff}把工作谱和演奏者手里的谱排在一处，逐个问改动从哪儿来。亨泽尔看完两处，拿笔划去其中一处，又把另一处的落笔加重。 演奏者收起谱时，三个本子都翻在同一页。'
      outcomes:
        all: 家里后来拿出同一册谱来查。几个人记得那天最后留在她身边的是谁，也记得她在谱上选的是哪一处。
        p3: 去请医生的人离开后，屋里安静了一会儿。靠近她的椅子再没有挪开。
        p1: 最后的歌已经写成。排练的人再上楼时，谱纸还在原处晾着。
        p2: 三重奏的工作谱留了下来。后来家人翻找她的写法，一下就翻到了那一页。
      none: 架上几份谱没有合起来。收工的人一张一张把它们往背过光的地方挪。
      not_admitted: '{staff}没能进入排练的屋子。楼下的人听到一段没奏完的旋律。'
      desync: 写歌的时段被排练占去。事务所召回{staff}时，谱纸上最后一行还是空的。
      excerpts:
        p3: 一位家人把谱放到地板上，坐到了她旁边。刚才没翻过去的那一页还敞着。
        p1: 她把最后一行写进谱纸。墨还没干，第二次敲门已经响了。
        p2: 演奏者收起谱时，三个本子都翻在同一页。
    relic: 一页歌谱
    relic_desc: 一页手写的歌谱，署名范妮。
    points:
      p1: 在亨泽尔为排练忙碌时替她守住写谱的时间，让她完成最后一首歌
      p2: 把三重奏手稿和排练本摊在一起，请亨泽尔标明哪些改动要留给演奏的人
      p3: 亨泽尔排练时发病，先停下音乐，请人去找医生，也留个人陪她
    points_fail:
      p1: 排练占完了时间，最后的歌停在草稿。行程与史实脱节，员工被召回。
      p2: 改动还各记在分谱上。家人要弄清哪些是她认可的，还得逐个问人。
      p3: 大家各自出门找人，屋里却还是拥挤。家人得等其他人让开，才能到她身边。
    shift:
      p1:
        was: 1847 年 4 月下旬，亨泽尔在日记中写到三重奏之后创作一度停滞，5 月去世前她完成了最后一首歌。
      p2:
        was: 1847 年 5 月 14 日亨泽尔去世，钢琴三重奏的初版直到 1850 年才问世。
        now: 这条分支里，{staff}帮亨泽尔把她选的改动标进一册工作谱。演奏的人有谱可用，家人日后也能查到她留下的标记。
      p3:
        was: 1847 年 5 月 14 日，亨泽尔在排练中发病，当天去世。
        now: 这条分支里，{staff}请人去找医生，也请歌手们先合起谱来。亨泽尔身边腾出了地方，让家里人坐下陪她。
    vignettes:
      cover: 虚构的歌手从中间翻开乐谱，问是谁写的。你找来散开的题名页放在旁边。封面上署的名字足够确定纸套上该写什么。等你把纸理齐，第一首已经唱完。
      forward: 你刚要说后来的收藏者会怎样找这六首歌，歌手指着散开的封面，问他们还找不找得到它。你请她把封面随下一份谱一起交出去。一位读者带着它走了，再往下的去向你够不着。
      order: 你对着目录把六首排好，歌手可以直接翻到要唱的那一首。你另记下一份顺序。等门一关，屋里再响起什么，你带不走。
  camille_claudel_paris:
    name: 同一步舞，两种裙摆
    place: 巴黎
    figure: 卡米耶·克洛岱尔
    story: 克洛岱尔博物馆登记了《华尔兹》的多个版本，其中有一件标为 1905 年的青铜铸件。1913 年，卡米耶的父亲在维尔纳夫去世。葬礼前她没有收到死讯。3 月 10 日，她被送进维尔-埃夫拉尔医院。
    story_prose:
      opening:
        - 1913 年三月，巴黎。卡米耶·克洛岱尔做过不止一版《华尔兹》。工作室里，她从形状很近的东西中也能挑出自己要留的那一件。
        - 史实里，她没在葬礼前得知父亲去世，三月十日被送进医院。在这条分支里，一封可以查实的信送到了巴黎，工作室也还有时间交代。
        - 这趟用得上会把难说的消息慢慢说完的人。记东西时，得等卡米耶自己讲哪样留下，交给谁。
      points:
        p2: '{staff}拿了空纸，把卡米耶指过的几样东西分开记。旁人想把两件相近的东西合写成一行，她把手压在纸上，要留出两个位置。 她在最下面写了收件人的名字。纸页叠上去以前，她把那一行指给来取的人看。'
        p1: '{staff}先到送信的人那里核准了日子，再去工作室。卡米耶把信读过一遍，停了一会儿，问最早哪班车还能赶上。 她把还没干透的手在围裙上擦了两下，把信放进外衣里。'
      outcomes:
        all: 离开前，卡米耶把物件的单子交给她自己选的人。他来取时，先把两个还没写清的名字念给她听。
        p2: 她选的人把单子带走。后来回到工作室，他依着每一行找到了该取的东西。
        p1: 去维尔纳夫的路上，她把那封信又取出来。她只翻到写日子的地方，看了一眼。
      none: 工作室里的东西都在原处。桌角有人摆平了一张纸，上面没有名字。
      not_admitted: '{staff}没能进去。门锁从里面响了一声，脚步随后走远。'
      excerpts:
        p2: 她在最下面写了收件人的名字。纸页叠上去以前，她把那一行指给来取的人看。
        p1: 她把还没干透的手在围裙上擦了两下，把信放进外衣里。
    relic: 一只青铜手
    relic_desc: 一件小小的青铜手部习作。
    points:
      p1: 把父亲的死讯及时带给卡米耶，让她自己决定要不要回维尔纳夫参加葬礼
      p2: 卡米耶离开工作室以前，问她有哪些东西想托付给熟人，把她的选择写下来
    points_fail:
      p1: 消息到巴黎时，葬礼已经结束。卡米耶已经没法决定要不要回去了。
      p2: 离开工作室的日期有记录，屋里几样东西交给谁，却没有一张她亲自交代的纸。
    shift:
      p1:
        was: 1913 年 3 月 3 日，父亲路易-普罗斯佩·克洛岱尔在维尔纳夫去世，家里没有告诉卡米耶，她没有去送葬。
        now: 这条分支里，卡米耶及时收到死讯，决定回维尔纳夫参加父亲的葬礼。
      p2:
        was: 1913 年 3 月 10 日，卡米耶由家人申请送进维尔-埃夫拉尔精神病院，1914 年转到蒙德维尔格，此后再没有出来，1943 年 10 月 19 日在那里去世。
        now: 这条分支里，{staff}记下卡米耶想怎样处理工作室里的几样物件。她离开时，自己选定的人拿着这张单子照办。
    shift_all: 卡米耶来得及决定去父亲的葬礼，也亲自选了替她照管工作室物件的人。
    vignettes:
      light: 你见过后来的博物馆陈列，直到绕着裙摆走一圈，才看见影子怎样转。装箱人正要在两张标签上写同一句，你在边角各添了一道不同的弧线。箱子要分头走，开箱的时候你一处也看不到。
      mark: 装箱人找来两张写着同一标题的纸签。趁箱盖还没合，你各补一项，衣褶收在哪儿。两项也都抄进自己的本子里。你在资料里读过的那笔大理石委托，终究没有成。
      crate: 装箱人伸手拿盖子时，你扶住包纸，没让它压上伸出的裙边。余下的纸上，你凭记忆描出一道弧。箱盖一扣，最后那一点还画得准不准，你再也对不上了。
  artemisia_florence:
    name: 学院里的第一位女性
    place: 佛罗伦萨
    figure: 阿尔泰米西娅·真蒂莱斯基
    story: 1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。
    story_prose:
      opening:
        - 佛罗伦萨的画材铺开着两本账。颜料记在一本里，另一册夹了学院费用的条子。阿尔泰米西娅请经手人把这两笔分开，再问七月哪一天能拿到缴费的回单。
        - 1616 年 7 月 19 日，阿尔泰米西娅获佛罗伦萨绘画学院接纳。她那年也在做委托画。这里可以帮她办妥入会费，再从下一份画约里争取开工前的预付款。
        - 懂核账的人可以先清点学院的钱。擅长把口头约定落实到纸面的人，可帮她按想要的日期问委托方。
      points:
        p1: 账房把学院单夹在着急结清的颜料账里。你请阿尔泰米西娅说清哪笔要先交，再把收款人与入会日期一起核定。经手人把学院的回单抽出来，旁边空了一联给她自己留。她把写着名字的那一联带出了柜台。
        p2: 最后一笔画款结清时，委托人问下一张画能早几天开工。阿尔泰米西娅把颜料单推给他，看着对方逐项念完。你替他们请书记把预付款日写在开工之前，让双方各有一份。她之后去取颜料，带的是已经能照约收款的纸。
      outcomes:
        all: 学院收下入会费，下一份画约也已经写好预付款的日子。她按约买到颜料，再把第一张画布架起来。
        p1: 入会照史实办成。到了下一次订颜料时，先付款的事还得另找对方开口。
        p2: 预付款的条款写下了。入会费未赶上，回程只带回画约交接的一段。
      none: 两笔钱仍在同一沓票里，画材铺只好再问哪一笔先付。
      not_admitted: 账房给预约过的人留了位子。你没进里间，只看见有人把学院的纸条夹回账中。
      desync: 入会费没有按日交妥。学院的录名与史实脱节，事务所召回员工。
      excerpts:
        p1: 她把写着名字的那一联带出了柜台。
        p2: 她之后去取颜料，带的是已经能照约收款的纸。
    relic: 一罐颜料
    relic_desc: 一小罐磨好的青金石蓝。
    points:
      p1: 帮阿尔泰米西娅调出一笔钱缴入会费，赶上 7 月 19 日入会
      p2: 趁上一个委托结款，帮阿尔泰米西娅在下一份画约里定下预付款日期，让她在开工前买齐颜料
    points_fail:
      p1: 这条分支里，阿尔泰米西娅当天没能交齐入会费。入会偏离史实，事务所因同步失败召回员工。
      p2: 8 月的尾款照史实付清。下一次买颜料时，阿尔泰米西娅还得临时开口催钱。
    shift:
      p1:
        was: 1616年7月19日，阿尔泰米西娅·真蒂莱斯基获佛罗伦萨绘画艺术学院接纳。
      p2:
        was: 1615 至 1616 年，博纳罗蒂分期支付画款，档案里还留着阿尔泰米西娅作画期间催付的信。
        now: 下一份画约写明了预付材料款的日期，在开工以前。她可以照约定的款项订好颜料。
        who: artemisia_florence
        bio: 她为小米开朗琪罗·博纳罗蒂的宅邸绘制《倾向的寓意》，作品至今仍属建筑装饰的一部分。入会以后，她也可以向学院的法庭提出与画业有关的争议。
    vignettes:
      pose: 访客面对镜子，问哪种姿势看着自然。你问两种姿势各像在做什么。他选了手还能做自己的事的那一种。
      name: 一张习作只写了画中人的描述，没留画家的名字。你把纸翻过来，请访客在收进一摞图以前把两项都写上。
      mirror: 你挪了镜子，让访客不用扭身也能看见那个角度。他试坐一回，又自己调了一点，才开始画。
  buchner_zurich:
    name: 排练桌上的两份残稿
    place: 苏黎世
    figure: 格奥尔格·毕希纳
    story: 1836 年，格奥尔格·毕希纳流亡到苏黎世，在大学讲课。次年 2 月，他病得很重。未婚妻明娜·耶格勒从斯特拉斯堡赶到时，他已病危。2 月 19 日，二十三岁的毕希纳去世，《沃伊采克》没有写完。
    story_prose:
      opening:
        - 苏黎世有人把两份有相同人名的戏稿分开放在桌上。隔间的毕希纳叫人找一张能写信的纸。他想趁还有力气，请在斯特拉斯堡的明娜过来。
        - 1837 年二月，毕希纳在苏黎世病重，明娜赶来时已很晚，他随后去世。《沃伊采克》留有几组未完成的手稿。这里可以让他的口信更早送出，也可用事务所的虚构医疗箱照护他。
        - 让会送信的人先确认毕希纳自己要说什么。要去床边帮忙，派懂照护并带着医疗箱的人先问家中的安排。
      points:
        p1: 来送信的人拿起一张散稿，以为这是没抄清的来信。你请毕希纳逐句说给帮手听，按他的原话另写一张。明娜的地址对过以后，送信人把戏稿留在桌上，拿着那张新纸动身。收纸的时候，毕希纳听见对方完整念了一遍名字。
        p2: 家里的人想继续念出每张纸的题头，毕希纳请他们先停一下。你解释事务所带来的医疗箱，等照护的人留在床边。过了些时候，毕希纳睁开眼，伸手指两份散稿中较薄的一叠。帮手把它挪近，他没有再请人替他挑。
      outcomes:
        all: 明娜到苏黎世时，毕希纳还能把原先想说的事告诉她。烧已退下，桌上仍有两叠未排定的稿。
        p1: 口信送得早，明娜有时间听他自己说话。病仍没退，他随后在苏黎世去世。
        p2: 毕希纳退烧，醒来要其中一份手稿。早先请明娜来的话，仍没能及时送到。
      none: 信纸和草页仍摊在一起。明娜到时已近最后，他在苏黎世去世。
      not_admitted: 屋里的人请来客先不要打扰。那张信纸还没写上收件人。
      excerpts:
        p1: 收纸的时候，毕希纳听见对方完整念了一遍名字。
        p2: 帮手把它挪近，他没有再请人替他挑。
    relic: 一叠零散的场景稿
    relic_desc: 字迹局促的散页，没有固定的顺序。
    points:
      p1: 趁毕希纳还有力气亲口说明，把他请明娜过来的话送到斯特拉斯堡
      p2: 把事务所的纳米医疗箱带到床边，帮守在那儿的人照护发高烧的毕希纳
    points_fail:
      p1: 明娜赶到时，他已病危。他原想告诉她的几句话，还摊在案上。
      p2: 烧没有退下去。他病得已经开不了口，案上的稿子还摊在那里。
    shift:
      p1:
        was: 1837 年 2 月，未婚妻明娜从斯特拉斯堡赶到苏黎世时，他已病危，不久在她身边去世。
        now: 这条分支里，明娜早几天到了苏黎世。他还有力气，两人能当面说说话。
      p2:
        was: 1837 年 2 月 19 日，毕希纳在苏黎世去世，《沃伊采克》没有写完。
        now: 这条分支里，{staff}用事务所的纳米医疗箱帮他退了烧。毕希纳活过这一场病，有力气问起案上那几页稿子。
        who: buchner_zurich
        bio: 这条分支里，毕希纳熬过了 1837 年 2 月在苏黎世的那场病。
    vignettes:
      order: 试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。
      pause: 你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。
      gap: 纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。
  emily_bronte_haworth:
    name: 冬天的牧师住宅
    place: 霍沃斯
    figure: 艾米莉·勃朗特
    story: 《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。
    story_prose:
      opening:
        - 1848 年，哈沃思。《呼啸山庄》已经用埃利斯·贝尔的名字印出来了。在牧师住宅里，艾米莉还有一册能从头翻看的初版。
        - 史实里，夏洛蒂与安妮七月到伦敦澄清几个笔名，艾米莉于十二月在家中去世。在这条分支里，有人愿意在去伦敦前帮她们找齐纸件，也愿意等她自己开口说要什么。
        - 这趟需要能认清笔迹和拼写的人，也需要有人在艾米莉病重时耐心等她说完。
      points:
        p4: '{staff}问艾米莉想坐在哪里，还问她愿意让谁留在近处。她选了背靠墙的椅子，请人把手边的书挪过去。{staff}把暖毯递到她够得着的地方。 屋里有人正要挪开另一把椅子。她抬起手，指了指原来摆着的位置。'
        p3: 人物说的话和排印误字混在一起，{staff}另外拣出几页给艾米莉看。她把其中一个拼法读出声来，请人把手里的笔放下，等她说完再改。 艾米莉把要留的词圈住。她把纸折回去，露出足够后来人找到的那一角。
        p2: '{staff}替艾米莉把初版翻到她指出的地方。她用指尖抵住断错的一行，{staff}就在一张纸上抄下页码和改法。 她把纸从对面拉过来核了一遍。两处数目写得很近，她在中间留出一道空。'
        p1: '{staff}从几封信中拣出带笔名和书名的纸，把名字可核对的几份分开夹好。夏洛蒂与安妮这才有东西可以带上路。 袋口有两份纸在往外滑。夏洛蒂合上袋口前，先摸了摸标着安妮笔名的那一份。'
      outcomes:
        all: 家里留了两份能分开读的清单。一份给再版用，一份夹在旧书里。冬天那把靠墙的椅子，还在她自己选的地方。
        p4: 家里照艾米莉的意思布置那一角。等灯挪近了，书还在她伸手可及的地方。
        p3: 夏洛蒂编新版时翻到那页，先看见折角，再看见艾米莉留下的圈。
        p2: 后来有人校书，能沿着页码找到初版上那行错印。
        p1: 到了伦敦，两姐妹把材料分别拿出来。出版人只好把原先并在一起的书名重新分开。
      none: 旧印本放回架上，夹页还没有写完。
      not_admitted: '{staff}没能进牧师住宅。门廊下落着一点湿雪。'
      desync: 出门的纸没能按作者分清。事务所召回{staff}时，两份夹页还叠在一块儿。
      excerpts:
        p4: 屋里有人正要挪开另一把椅子。她抬起手，指了指原来摆着的位置。
        p3: 艾米莉把要留的词圈住。她把纸折回去，露出足够后来人找到的那一角。
        p2: 她把纸从对面拉过来核了一遍。两处数目写得很近，她在中间留出一道空。
        p1: 袋口有两份纸在往外滑。夏洛蒂合上袋口前，先摸了摸标着安妮笔名的那一份。
    relic: 一条狗项圈
    relic_desc: 牧师住宅里那条大狗用过的旧皮项圈。
    points:
      p1: 在伦敦来函把几位贝尔的作品混起来时，帮哈沃思的姐妹从书信中理出能各自认领的作品
      p2: 发现初版里不同于原句的误字时，帮艾米莉留下逐条可查的勘误
      p3: 趁艾米莉还能核对人物说话的声音，请她定一份以后重印时可照用的方言校本
      p4: 问艾米莉愿意接受哪些照料，请她自己挑在哪里歇、想让谁陪在近处
    points_fail:
      p1: 几份来函仍把书归到同一个笔名下，姐妹带不出能分开认领的文件。澄清落空，员工因同步失败被召回。
      p2: 下次排印的人只能从初版猜测哪些字本来就这样写，排字错误继续传下去。
      p3: 再版时只能由家人判断哪里读不顺，改字里分不清哪些是作者原意。
      p4: 家里人听得出她上楼越来越费力。她还没开口，大家也不知道她愿意接受什么帮助。
    shift:
      p1:
        was: 1848 年 7 月，夏洛蒂与安妮·勃朗特从哈沃思到伦敦，向出版人澄清几个贝尔笔名并非同一作者。
      p2:
        was: 1847 年版《呼啸山庄》留有排印错误，1850 年新版才作校订。
        now: '{staff}在艾米莉手边留一册可圈改的印本，再把她指出的误字抄成附有页码的清单。'
      p3:
        was: 1848 年艾米莉在哈沃思去世；1850 年的新版由夏洛蒂编辑，其中改动了部分方言拼写。
        now: '{staff}把方言页分开请艾米莉逐句审过，将她亲自核准的拼写和仍可改的排印错误分明标记。夏洛蒂后来再版时有了这份依据。'
        who: emily_bronte_haworth
        bio: 艾米莉的《呼啸山庄》留下一部她亲自核过方言的印本。后来的重印能够保留人物的原有说话方式。
      p4:
        was: 1848 年 12 月 19 日，艾米莉在霍沃斯的牧师住宅去世。病中她一直拒绝看医生，到去世当天才答应。
        now: 这条分支里，{staff}先问艾米莉的意思。她选了个能歇的地方，也选好谁在近处陪她。家里人照她的话安排。
    vignettes:
      witness: 读者以为讲故事的人什么都看见了。你问有一件事她是从哪儿知道的。他把那句话往回找，找到了先说这事的人。
      voices: 读者整页只用一个声音。你请他从内莉接过话头处再念。听的人这回听得出，故事什么时候交到了另一个人手上。
      mark: 你在换人讲述处夹了块纸。读者觉得后面一段同刚才抵触，便先翻回纸签在的地方。
  lili_boulanger_paris:
    name: 桌上摊着几份声部谱
    place: 梅齐
    figure: 莉莉·布朗热
    story: 1918 年冬，莉莉·布朗热在塞纳河畔梅齐病得很重。关于她最后一部作品的记述写到，她把《Pie Jesu》口述给姐姐娜迪亚。乐谱写给人声、弦乐四重奏、竖琴和管风琴。3 月 15 日，莉莉去世，终年二十四岁。
    story_prose:
      opening:
        - 谱桌上的纸分成已誊好和还等着口述的两份。娜迪亚刚写下一个音，莉莉请她先把笔放一放。隔着几张薄纸，已经写下的最后一小节还有些看不清。
        - 莉莉·布朗热病中口述了她生命最后阶段的乐曲《Pie Jesu》，由姐姐娜迪亚记谱。她在 1918 年 3 月 15 日去世。这里能做的是按她自己的节奏暂停，等她要继续时把最后记下的地方还给她。
        - 会读谱的员工可以陪娜迪亚记位置。等莉莉说想继续时，才念出上一段。
      points:
        p1: 娜迪亚要顺手翻过去，莉莉说先别。你拿一根窄纸条标在刚才那一节，给两个人都能看见的位置。屋里歇了一会儿，等莉莉先开口，你才把娜迪亚记下的几拍数给她听。莉莉改了一个音，娜迪亚就在原来的那一行接着写。
      outcomes:
        all: 莉莉自己定了何时继续。桌上留下口述过的乐句，三月十五日的死讯仍进了后来的记录。
        p1: 等她准备好，娜迪亚从标出的地方继续记谱。这一回，她不用重说暂停前的整段。
      none: 停了一会儿再看谱时，姐妹要从上面几行找起。莉莉又将刚才说过的一段分开说完。
      not_admitted: 娜迪亚请来客把脚步放轻，在外面等。休息前最后那一段仍只有姐妹俩听到。
      excerpts:
        p1: 莉莉改了一个音，娜迪亚就在原来的那一行接着写。
    relic: 一条夹谱的窄纸
    relic_desc: 虚构夹条，记口述暂时停在第几小节。
    points:
      p1: 莉莉想歇一会儿时替娜迪亚标好谱上的位置，再按莉莉的意思念回刚记下的一段
    points_fail:
      p1: 停下来以后，姐妹俩要重新找口述的位置。莉莉今天剩下的力气，有一部分得花在重复已经说过的地方。
    shift:
      p1:
        was: 关于《Pie Jesu》的记述写到，莉莉病重时由姐姐娜迪亚帮她记谱。
        now: 这条分支里，莉莉停下时，{staff}替姐妹俩留好了记号。等莉莉觉得能继续了，娜迪亚念回最后一段，莉莉从自己挑的停顿处接着说。
    vignettes:
      entry: '{staff}请娜迪亚翻页前指一下刚记的音。她用手指压着那一行，再核上面的声部。'
      visitor: 门口有人问还剩多少谱。莉莉决定是否休息时，{staff}请来人把话先留在外面。
      stand: '{staff}在谱架上腾出一块地方，让娜迪亚搁笔时不用压住谱纸。'
  qu_yuan_miluo:
    name: 江边的诗句
    place: 汨罗江
    figure: 屈原
    story: 《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。传本对话是文献中的记述。
    story_prose:
      opening:
        - 楚地江边。后人读《楚辞》，读到有些诗被归给离乡的屈原，也读到他在水边遇到一位渔父的故事。
        - 传世的《史记》写他在泽畔行吟，面容憔悴。在这条分支里，有人想把手头的诗带走，还剩一束没抄完。
        - 这趟用得上熟悉书简和渡口的人，也用得上能找一处安静地方、把饭留下的人。
      points:
        p2: '{staff}请卖饭的人先留一处空着的席，把饭端来以后退到一旁。屈原坐下，把诗简放在自己左手边。他先吃了几口，后来自己取出一枚来。 他把那一句重新念了一遍。原先挨着门坐的人，把身子往里挪了挪。'
        p1: 要过江的人已经在收拾，{staff}先问屈原要留哪束，再让抄写的人把已经记下的末句念出来。屈原找出缺在两枚之间的那一枚，放到原处。 送抄件的人把绳穿回来，把结留在外面。下次要重读，手一摸就找得到。
      outcomes:
        all: 送抄件的人把那一束带走了。临行前，他还记得席上听到的一句，到了船边才又翻出来找。
        p2: 饭碗收走以后，留在屋里的人没有急着一起走。屈原借着那一点安静，又把同一枚简拿起来。
        p1: 抄件跟着下水的船走了。拿着它的人坐下以后，先把绳结转到了自己手边。
      none: 开饭前的位置一直没人坐。天暗以后，被风掀动的是空席的一角。
      not_admitted: '{staff}没能找到留饭的地方。摆渡人收了木板，江水仍从板下穿过去。'
      desync: 两枚简之间漏了一段。拿抄件的人刚到岸边，事务所便召回了{staff}。
      excerpts:
        p2: 他把那一句重新念了一遍。原先挨着门坐的人，把身子往里挪了挪。
        p1: 送抄件的人把绳穿回来，把结留在外面。下次要重读，手一摸就找得到。
    relic: 一片写诗的竹简
    relic_desc: 一片竹简，上面是一首长诗中的几行。
    points:
      p1: 众人要分头走时，问屈原想留哪一束诗简，帮读者照着次序抄全
      p2: 给屈原留一餐饭和一个能歇脚的位置，若他愿意，就坐着听他念一首诗
    points_fail:
      p1: 读者带走的抄件，两枚简之间漏了一截。记录脱节，事务所召回{staff}。
      p2: 饭备好了，能歇脚的位置却被占了。没人能请他坐下安静待一会儿。
    shift:
      p1:
        was: 《楚辞》收有归于屈原的诗作。故事中的诗简交接，是分支对传抄过程的演绎。
      p2:
        was: 《史记》记屈原流放时披发行吟泽畔，颜色憔悴，形容枯槁。
        now: 这条分支里，屈原接下饭食，把一束诗简搁在身边。离开以前，他挑了一首念给留下来的人听。
    vignettes:
      two_tales: 渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。
      refrain: 故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。
      wait: 等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。
  sima_qian_changan:
    name: 受刑之后写成的史书
    place: 长安
    figure: 司马迁
    story: 《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。
    story_prose:
      opening:
        - 约公元前 98 年，长安。司马迁替李陵说话后下狱。他后来在《报任安书》里回想起这段日子，记得史稿当时还只是草创。
        - 史实里，家中无钱自赎，他受了宫刑，后来写成史书。在这条分支里，他家中有人能照管散页，也有人想替他把一封请求送给经办人。
        - 这趟需要能按篇辨清史稿的人、能照应受困之人的人，以及能把几家人的承诺落实到一份请求上的人。
      points:
        p3: '{staff}请愿意帮忙的人到桌边逐个说清愿出多少，再把请求与交来的钱一同交到经办人手里。经办人核了数，在副本上写下收讫。过几天司马迁回到家，先点了一盏灯。 他解开最上面那一束，从压着纸角的地方取出一叶，接着往下写。'
        p2: '{staff}把换洗的衣服和饭送到收物的地方，等人点过件数才离开。司马迁打开衣包，先把那件厚的放到腿上。 饭还是温的。他把碗端到膝间，低头吃了一口。'
        p1: 家中人已把桌子腾出来。{staff}顺着每束上露出的首句核对，把临时挪走的几叶找回原位，又嘱咐收起来时照同一顺序。 最后一束合上以前，家里人把题签朝外转过来。伸手去取下一束时，不用先把别的都搬开。
      outcomes:
        all: 稿子一直留在家里。司马迁回来后能从原处续写，门边还有人等着替他添灯。
        p3: 请求被收下了。后来有人来家里问他要不要帮忙，他把面前那束往旁边放了放，给来客腾了坐处。
        p2: 那件厚衣放在他手边。等夜深人散，他还能把它重新裹起来。
        p1: 把桌子照看下来的人，临走前又检查了一遍题签。每一束该在的地方还在。
      none: 门边的人散去后，一盏灯还亮在空桌上。
      not_admitted: '{staff}没能见到收物的经办人。带来的东西还放在门外。'
      desync: 散页没有收齐。事务所召回{staff}时，桌上只剩一根解开的绳。
      excerpts:
        p3: 他解开最上面那一束，从压着纸角的地方取出一叶，接着往下写。
        p2: 饭还是温的。他把碗端到膝间，低头吃了一口。
        p1: 最后一束合上以前，家里人把题签朝外转过来。伸手去取下一束时，不用先把别的都搬开。
    relic: 一捆竹简
    relic_desc: 用绳子编起来的竹简，每一片写着一行字。
    points:
      p1: 司马迁下狱期间，护住他家中尚未写完的史稿，不散不乱
      p2: 往狱里送饭送衣，让他少受狱吏的折辱
      p3: 请认识司马迁的人凑一笔钱，趁刑罚还没执行，把他们愿出的钱报给经办官吏
    points_fail:
      p1: 家中的竹简绳断简散，等他出狱时草稿已不全。这条分支与历史脱节，员工被送回。
      p2: 没人进得了狱门，这条分支里他照样像后来信里写的那样，见了狱吏便低头叩地。
      p3: 家里穷，朋友没有一个出面。这条分支里和历史上一样，他无钱自赎，受了宫刑。
    shift:
      p1:
        was: 约公元前 98 年，司马迁因李陵之事下狱，按他自己的话，书当时只是草创，还没写完。
      p2:
        was: 约公元前 98 年，司马迁因替李陵辩解下狱，他在《报任安书》里写到自己在狱吏面前受的屈辱。
        now: 这条分支里，{staff}把饭食和冬衣送到了司马迁手上。夜里他有衣服裹身，也多了一餐热饭。
      p3:
        was: 约公元前 98 年，司马迁因替李陵辩解获罪，家贫无钱自赎，亲友没有人替他说话，受了宫刑。
        now: 这条分支里，经办官吏接受了{staff}替众人送交的那笔钱。司马迁免于这次刑罚，可以回去继续写手里的史书。
        who: sima_qian_changan
        bio: 这条时间线里，司马迁交钱赎罪，没有受宫刑。他照样把从上古写到当代的那部史书写完了。
    vignettes:
      dates: 书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。
      witness: 书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。
      binding: 书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。
  du_fu_xiang_river:
    name: 船上的诗人
    place: 湘江
    figure: 杜甫
    story: 传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。
    story_prose:
      opening:
        - 大历五年，湘水一带。杜甫有一首寄给湖南亲友的三十六韵长诗，诗题说他是在舟中抱病时写的。
        - 史实留下了诗题和文字，没有记这份诗如何送到。在这条分支里，家里人在船上收过几次纸，下一回停船还没决定。
        - 这趟用得上能帮病人把姿势放舒服的人、能照看诗纸的人，以及认识渡口又听得准收件姓名的人。
      points:
        p3: '{staff}问杜甫想在哪个渡口停，在那儿找到愿意捎稿的人。杜甫隔着船帮跟他慢慢说了要交给谁。那人没立刻接过来，先把名字念了一遍。 杜甫听着听着点了一下头。家人这才把纸包递过船边，压进对方握着的手里。'
        p1: 船又要腾地方给人走动，{staff}先把诗纸一张张数过，照杜甫指的次序移到避风的板下。杜甫伸手取到中间一叶，念了开头给他听。 挪完东西以后，那一处还留着。杜甫不必等人再去找，就能把下一叶抽出来。
        p2: '{staff}问杜甫靠哪一边舒服，把垫在他身后的旧布带着折了一下，再把水挪到船帮不晃的地方。他试着坐起来一点，伸手够到了杯。 船身动了一次。杯子响了一声，没有倒。'
      outcomes:
        all: 家人看船从渡口挪开时，替杜甫把原稿放回他手边。一份还在，一份已经有人带着往前走。
        p3: 那人上了另一条船，先找了个干处放纸。两船错开时，杜甫还能看到装纸的布角。
        p1: 诗纸按次序待在避风处。船靠岸以后，杜甫又从那里抽出中间的一张。
        p2: 杜甫在船上歇了一阵。那只杯还搁在他自己摸得着的地方。
      none: 岸上最后一条船已经离开。纸包仍放在原先的船里。
      not_admitted: '{staff}没能找到那条船。岸上一排缆绳先后从水里提起来。'
      desync: 腾地方时找不到中间的几页。事务所召回{staff}，船家还在拿着首尾两张等。
      excerpts:
        p3: 杜甫听着听着点了一下头。家人这才把纸包递过船边，压进对方握着的手里。
        p1: 挪完东西以后，那一处还留着。杜甫不必等人再去找，就能把下一叶抽出来。
        p2: 船身动了一次。杯子响了一声，没有倒。
    relic: 一盏船灯
    relic_desc: 一盏小小的陶油灯，为了几行诗亮到很晚。
    points:
      p1: 在船上给杜甫留一处可以收好诗纸的位置，护住寄湖南亲友的长诗从零散纸页连成全篇
      p2: 舟中照料他的风疾和旧病，减轻他的病痛
      p3: 问杜甫下一程想在哪里靠岸，帮家人在那里找一个愿意把诗带给亲友的人
    points_fail:
      p1: 匆忙挪舱时只找到头尾几张，长诗没能成篇，事务所因同步失败召回员工。
      p2: 他伏在枕上，在冬天的船里一天比一天病重。
      p3: 家人还没找到能捎信的人，下一条船已经离开。他们只能把诗带到另一个渡口。
    shift:
      p1:
        was: 大历五年，杜甫在舟中抱病，写下寄湖南亲友的三十六韵长诗，诗题记下了这些。
      p2:
        was: 寄湖南亲友的诗题记下杜甫在船上抱病写诗。
        now: 那个冬天他在船上少受了些病痛。
      p3:
        was: 诗题把三十六韵写给湖南亲友，未记交递经过。
        now: 这条分支里，船在杜甫选的地方靠了岸。渡口有人愿意替家人捎去一份诗稿，接手时还能把收稿人的名字念回来。
    vignettes:
      shore: 旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。
      delivery: 你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。
      damp: 旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。
  li_qingzhao_hangzhou:
    name: 这一箱先寄在邻家
    place: 会稽
    figure: 李清照
    story: 李清照记下，寓居会稽时，她的书画已经历过几次散失。她在当地又遇失窃，后来寻回十八轴。
    story_prose:
      opening:
        - 李清照到会稽寓居时，手里的书画已经散过几回。她后来写《金石录后序》，还能说清这一趟陆续失了些什么。
        - 史实里，她在会稽遭窃，后来寻回十八轴。在这条分支里，箱子还都在房里。有一箱靠着床，她每天伸手就够得着。
        - 这趟用得上懂得照管书画的人。遇到别人不肯答应，还得耐着性子问清东西能放在哪、她要取时该敲哪扇门。
      points:
        p1: 李清照打开靠着床的箱子，翻出两卷，放回去一卷。{staff}请邻人先来认好箱子和锁，再让两人在同一张箱签上各按一个记号。搬出门以前，她又把一支短笔塞进盖下的空处。邻人托住箱底，她提着另一边，两个人一前一后过了门槛。
      outcomes:
        all: 后来她取回箱子，先找的就是那支笔。笔还躺在盖边。她从纸角试了一道，墨洇开得比从前慢。
        p1: 后来她取回箱子，先找的就是那支笔。笔还躺在盖边。她从纸角试了一道，墨洇开得比从前慢。
      none: 东西散去以后，她把寻回的卷轴摊开数。数到最后，她把两手停在空出来的桌面上。
      not_admitted: '{staff}没能见到李清照。隔着门，屋里传来箱盖合上的声音。'
      excerpts:
        p1: 搬出门以前，她又把一支短笔塞进盖下的空处。邻人托住箱底，她提着另一边，两个人一前一后过了门槛。
    relic: 一张箱签
    relic_desc: 分支里的箱签，标记李清照亲自挑出、另寄在邻家的一箱。
    points:
      p1: 请一位可靠的邻人，在失窃前接下李清照亲自挑出的一箱书画
    points_fail:
      p1: 员工没能找到肯替她收存那一箱的人。
    shift:
      p1:
        was: 约 1131 年，李清照记述在会稽寓居时遭遇失窃，后来寻回十八轴。
        now: '{staff}请到邻人，把她亲自挑的那一箱收在另一处。李清照后来回来取箱，里面的东西还在。'
        who: li_qingzhao_hangzhou
        bio: 李清照收回了一箱曾寄在邻家保管的书画。
  su_shi_huangzhou:
    name: 东坡的流放
    place: 黄州
    figure: 苏轼
    story: 1079 年乌台诗案之后，苏轼被贬到黄州，在城东一块坡地上开荒种地，以地为号，称东坡。1082 年七月，他与客泛舟赤壁之下，写成《赤壁赋》；十月，他从雪堂步行回临皋，写成《后赤壁赋》。1084 年他离开黄州。
    story_prose:
      opening:
        - 元丰年间，黄州。苏轼经乌台诗案贬到这里，在城东开荒，后来以东坡为号。元丰五年，他两次写到赤壁，秋夜那一次还记下了攀上断岸。
        - 史实里，他一家靠着积蓄过日子。他也听说岳鄂一带有溺婴的事，写信求禁，并在黄州提议帮穷人家养孩子。在这条分支里，坡地、渡口和这些人家的门口都能有人接手。
        - 这一趟用得上懂耕作的人和能走夜路、走陡路的人。会照料新生孩子、能耐心挨家开口的人，也有事要做。
      points:
        p1: '{staff}跟着帮工上坡，照种地的办法引水入畦。收粮时，攒了几担又搬了几趟。最后一袋粮靠墙放下，扫过地上一道陈灰。梁上还挂着剩下的钱串。'
        p2: 十月之望，{staff}帮看陡处哪块石头能踩稳，又守着回到船上的那一段。崖上的身影下来时，{staff}把灯转向水边。水拍上船板，灯在手里晃了一下。
        p3: '{staff}跟着育儿会挨家去看，按照护新生儿的办法安顿孩子，再同留下来照看的大人说话。一家人的门到夜里才关上。门缝还亮着，里面有一小团裹好的布在轻轻动。'
      outcomes:
        all: 那年东坡有粮，赤壁归来的人带回了湿衣，几户家里也多了孩子。夜里，门里有人把一床小被摊开。
        p3: 那个冬天，有几家终于能把孩子养在家里。上门的人退到门外，听见屋里有人把灯移近了一些。
        p1: 秋后，梁上的钱串比预想的多留了几个月。新粮袋靠在墙边，布角还带着地里的土。
        p2: 第二次游赤壁以后，断岸写进了赋。摊开那页，墨最浓的地方是笔势一顿的位置。
      none: 渡口空下来，盘好的绳还在船头。灯放到脚边，火苗只剩一点。
      not_admitted: '{staff}没能在黄州落脚。渡口那盘粗绳在水雾里一点点暗下去。'
      desync: 赤壁那一段出了岔子。被召回以前，{staff}手里的灯只照到船沿下方的水。
      excerpts:
        p3: 一家人的门到夜里才关上。门缝还亮着，里面有一小团裹好的布在轻轻动。
        p1: 最后一袋粮靠墙放下，扫过地上一道陈灰。梁上还挂着剩下的钱串。
        p2: 崖上的身影下来时，{staff}把灯转向水边。水拍上船板，灯在手里晃了一下。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是农人在坡地上穿的那种。
    points:
      p1: 帮他一家把东坡那块荒地种出收成，撑过积蓄见底的日子
      p2: 十月之望那夜，护住他攀上赤壁断岸，让他平安回到船上
      p3: 救下乡间那些一落地就要被按进水盆的孩子
    points_fail:
      p1: 这条分支里，秋收时东坡的地头没有多一个帮手，梁上的钱串照旧一串一串地少下去。
      p2: 那夜他在断岸上失了脚，这条分支里没有回到船上的那一段。
      p3: 这条分支里，乡间的水盆照旧，{staff}没能让哪一家留下那个孩子。
    shift:
      p1:
        was: 元丰四年，苏轼在城东坡地开荒种地，一家每天的用度限在一百五十钱。
        now: 那年秋天东坡的地多打了几担粮，梁上的钱串剩到了年底。
      p2:
        was: 元丰五年十月之望，苏轼独自攀上赤壁断岸，又回到船上，后来写下《后赤壁赋》。
      p3:
        was: 他听说岳鄂一带溺婴，写信请鄂州知州依律禁止，又在黄州倡议育儿会，请富户出钱，帮贫家养活新生的孩子。
        now: '{staff}跟着育儿会挨家去走，那个冬天又有几户人家把刚生下的孩子留了下来。'
    vignettes:
      slope: '{staff}替帮工往坡上挑水。天黑时，邻里把一碗煮豆搁到地头，说第二碗明天给这个外乡人。'
      lamp: '{staff}用手替石头上的灯挡风。三更过了许久，坡上传来脚步声。{staff}把灯转向小路，没出声。'
      ferry: '{staff}在渡口帮船家盘缆绳。船家说，无风时崖下水走得慢，来游的人偏要往对岸去。'
  cao_xueqin_beijing:
    name: 末回后面的一张白纸
    place: 北京西山
    figure: 曹雪芹
    story: 《石头记》甲戌本留下曹雪芹生前已有带批语抄本流传的线索。卷首一条后加眉批回忆曹雪芹去世时书尚未成。故事设在他晚年的冬天，现存资料不足以确定他的卒日或最后写成了多少回。
    story_prose:
      opening:
        - 西山的天暗得早。抄书人抱着一包稿子进屋，先问哪几页能带走。他把包袱搁在床边的小桌上，最上头压着一张白纸。
        - 《石头记》早在曹雪芹生前就已有带批语的抄本。甲戌本后来添的一条眉批记得他去世时书还没写成。这个冬夜是故事里的机会，桌上那叠纸等着他亲手分一分。
        - 抄书人要趁天黑前回去。懂稿子的人可以先把来借的批本从改稿里找出来，会照料人的便看看火和灯。等桌面腾出来，才有地方摊开草稿。
      points:
        p1: 抄书人摸到夹在改稿里的一叠，正要和床边的纸一块儿扎起来。你看见页边有别人写的小字，请他再读一行。他把批本另包了一层，曹雪芹还要改的几张则留在手边。两包纸各系一道绳。
        p2: 炭快熄时，曹雪芹把刚翻到的一页合上了。你请来送炭的人把火续上，再把灯挪近，只递他刚才没看完的那一张。他把手伸出被角，又从那行接着看下去。那一晚，灯在他够得着的地方。
        p3: 你说后来有人续写，写到「兰桂齐芳」。曹雪芹皱了皱眉，翻回第五回《飞鸟各投林》的末句，指着那片白茫茫。你又翻开脂批本，问后世说这书在悼念故明，可是这个意思？曹雪芹大笑，一句话也没说。等他再拿起笔，只在已经想定的几张上点了记号。抄书人照他点的地方抄，余处仍空着。
      outcomes:
        all: 抄书人出门时夹着两页。哪几回已经排定，哪几处作者还想再看看，两张纸一对就明白。至于那一声笑，谁也没有替他写下解释。
        p1: 早期批本让抄书人带走，床边还放着等曹雪芹再看的稿子。
        p2: 床边的灯又多亮了一阵，曹雪芹看完了方才搁下的那页。
        p3: 有记号的地方抄下，尚未想定的地方留白。抄书人没有把自己的猜想添进正文。
      none: 纸还是按来时的样子叠着。后来有人问起最后几回，那张白纸上没有留下答案。
      not_admitted: 抄书人进门去了。你等到院里的灯只剩一盏，也没能把那叠纸拿到桌边。
      desync: 批本混进退还的改稿，抄书人没能把它带走。桌前那段工夫已错过，事务所把你召回。
      excerpts:
        p1: 两包纸各系一道绳。
        p2: 那一晚，灯在他够得着的地方。
        p3: 抄书人照他点的地方抄，余处仍空着。
    relic: 两页章回安排
    relic_desc: 游戏纪念物。一页列着拟好的章回次序，另一页留下作者还未决定的地方。
    points:
      p1: 让抄书人留下早期批本，再把等着曹雪芹改的稿页交还给他
      p2: 替他添火、备好稿页，让曹雪芹有一晚能专心想结尾
      p3: 趁他还有力气核看，照他认可的次序抄出一份收束提纲，托人带走
    points_fail:
      p1: 桌上那份批本混进要退回的改稿里，这条支线里的读者空着手离开。
      p2: 稿纸还没理齐，炭火已经要熄了。只能改天接着写。
      p3: 抄书人能理出散页，却不知道哪些结局曹雪芹已经想定。
    shift:
      p1:
        was: 甲戌本留下了曹雪芹生前已有早期批本传抄的记录。
      p2:
        was: 甲戌本有一条眉批，回忆曹雪芹去世时书还没有写完。
        now: 这条支线里，有人看着炭火，一次递一张稿页。曹雪芹多得了一个晚上，能想清楚故事接下来往哪里走。
      p3:
        was: 甲戌眉批记书未成，没留下曹雪芹亲自核过的收束提纲。
        now: 抄书人带走两张纸。一张是曹雪芹在这条支线里点定的次序，一张是他还没拿定的几个人的下场。后来转抄的人把两张纸一直夹在一起。
        who: cao_xueqin_beijing
        bio: 曹雪芹生前和抄书人核过一份收束提纲。这条支线的读者看得见哪些结局是他定下的，哪些他仍留着空白。
    vignettes:
      ink: 抄书人夹进一张纸签，把拟好的章节次序同读者的猜测隔开。纸页散了也知道各该放回哪一处。
      paper: '{staff}把灯端进来。抄书人把稿子从桌沿往里收了收，让出一小块地方。'
      empty: 末页还能写一个回目。抄书人看了看，照原样空着。
  tang_xianzu_linchuan:
    name: 写爱情超越死亡的戏
    place: 临川
    figure: 汤显祖
    story: 汤显祖在《牡丹亭》题词末署万历戊戌秋，即 1598 年秋。戏到第十出，杜丽娘游过春日的园子，入睡后在梦里遇见一位年轻书生。
    story_prose:
      opening:
        - 1598 年秋，临川。汤显祖在《牡丹亭》的题词末写下年月。戏里，杜丽娘游过园子，在梦中遇见一个书生。
        - 史实里，后来有人改曲文以便演唱，汤显祖写信要宜黄的演员用他的原本。在这条分支里，排练的人手边有一张改过的纸，还有一处接不上的唱词。
        - 这一趟用得上识得错字、听得出哪里丢了接句的人。懂曲文又能把台上台下对起来的人，也有事做。
      points:
        p1: '{staff}把排练纸覆在汤显祖核过的原本旁，顺着演员的唱腔找出落掉的字，再把完整的本子抄给宜黄戏班。台下把定本翻到同一页，跟着一声一声往下听。该接的地方，等在台边的人抬起了脚。'
      outcomes:
        all: 后来那一出仍按定本排唱。等候上场的人手里夹着一张纸，折角正落在他的接句旁。
        p1: 后来那一出仍按定本排唱。等候上场的人手里夹着一张纸，折角正落在他的接句旁。
      none: 排练纸翻过一页。下一句该谁唱，台边的人还拿着那张少写几个字的纸。
      not_admitted: '{staff}没能进到排练的地方。墙里传出一声唱，墙外只看得到移开的那把椅子。'
      excerpts:
        p1: 台下把定本翻到同一页，跟着一声一声往下听。该接的地方，等在台边的人抬起了脚。
    relic: 一册刻印的曲本
    relic_desc: 给歌者用的刻本，每支曲牌的名字写在上方。
    points:
      p1: 帮他把亲手核过的《牡丹亭》原本抄定，交到宜黄戏班手里，让他们照原本排唱
    points_fail:
      p1: 后来的改本照史实传开，他只能写信叮嘱宜黄的伶人别照改本唱，这条分支与历史一样。
    shift:
      p1:
        was: 1598 年以后，汤显祖在信中嘱咐宜黄伶人沿用他的原本，别采用为了便唱而改过的曲文。
        now: 改本出来之前，宜黄班手里已经有了一部他亲手核过的原本，班里一直照原本唱。
        who: tang_xianzu_linchuan
        bio: 这条时间线里，汤显祖亲手核定的《牡丹亭》原本先到了宜黄戏班，班里一直照原本唱。
    vignettes:
      empty_garden: '{staff}把椅子挪到墙根。演员走过空地，唱到一半垂了垂眼。抄本人坐在长凳上，这才看出空园里的小路在哪儿拐弯。'
      cue: 少了几个唱词，台边的人等不到接句。{staff}把字补回排练纸，让两个人从上一句再接一次。
      breath: 演员在句末留了一口气。{staff}把那一顿记下来，将纸条递到台边。
  ban_zhao_luoyang:
    name: 给《汉书》表留一处待核
    place: 洛阳
    figure: 班昭
    story: 《后汉书》说，班固去世时《汉书》八表及《天文志》未完，班昭奉诏到东观藏书阁续成，后又有马续参与。
    relic: 一幅绢上的人名表
    relic_desc: 一条绢，上面是整整齐齐排列的官名与人名。
    points:
      p1: 窦氏事败之前，帮班固把八表与《天文志》各写到哪里、往下怎样续标清楚，留给接手的人
      p2: 班固随窦氏宾客被收捕时，护住他未完成的《汉书》稿，让它日后交到班昭手里
      p3: 从挟私收捕的洛阳令种兢手里救下班固，让他活着出狱
    points_fail:
      p1: 没人标出写到了哪里，接手的人只能对着残稿去猜，班固对后面几表的打算随他一起没了。
      p2: 收捕之中残稿散失，这条分支里班昭到东观时无稿可续。行程同步失败，员工被召回。
      p3: 消息没能及时递到朝廷，班固照旧死在狱中，时年六十一，和帝对种兢的谴责来得太晚。
    shift:
      p1:
        was: 92 年班固去世时，《汉书》八表与《天文志》尚未完成，后来班昭奉诏在东观藏书阁续成，马续又继续参与。
        now: 班固在每一张未完成的表前留了一页，写明停在哪里、往下怎样续。班昭接手时照着他的标记往下写。
      p2:
        was: 92 年六月窦氏事败，班固先被免官，随后在追查窦氏宾客时被收捕。
      p3:
        was: 92 年，洛阳令种兢因班固家奴醉骂结怨，借追查窦氏宾客收捕班固，班固死于狱中，时年六十一，和帝事后下诏谴责种兢，并治主事狱吏之罪。
        now: '{staff}抢在狱中出事之前把挟私收捕的事递到了朝廷，班固被放出狱。他又活了几年，和妹妹一起把几张表往下做。'
        bio: 这条时间线里，班固 92 年活着走出洛阳的监狱。余下的几年他用在《汉书》未完成的几张表上，和妹妹班昭一同续写。
    vignettes:
      column: 抄表人把后一行的人名移进了空格。你把底册摊到旁边，指给他看这个名字原在下面一行。他把名字移回去，另标上面待核。你带回来已对齐的一行，上面的空格仍没有填。
      later: 你知道后人会把整部书放在一起读。抄表人眼下还分不清这张练习表哪行算做完。你和他用一条窄纸夹出仍待核的地方，下一位一翻就能找到。另一份底册送来前，你得收队。
      fold: 你把名字和它所在的行一同抄下，上头仍留一格。抄表人看得出这是特地留下的。你带回一份抄件，那格该写什么还要等别人来核。
  xu_xiake_lijiang:
    name: 校书之外的半日
    place: 丽江
    figure: 徐霞客
    story: 1639 年二月，徐霞客住在丽江解脱林，为木增校书。木增遣人送来酒食，校书后又送礼酬谢。徐霞客听说寺后高处有拱寿台、狮子崖，日记里写校书催得紧，两处都没来得及登。
    story_prose:
      opening:
        - 1639 年二月，丽江。徐霞客在解脱林为木增校书，听说后山有拱寿台和狮子崖。他把两处名字记进日记。
        - 史实里，书催得紧，两处都没去成。木增后来送礼酬谢，又请他修《鸡山志》。在这条分支里，还书单和走山路要用的纸放在一处。
        - 这一趟用得上清点卷册、送得准的人，也用得上跟得上向导和护卫、能记住山路折回处的人。
      points:
        p1: '{staff}照还书单把卷册点过，跟送书的人核对哪些已经交回。送书人把回执搁在最上面。下面的书页收齐了，仍有一根细纸签露在匣外。'
        p2: 交清书以后，{staff}请本地向导带路，同护卫陪徐霞客走上拱寿台。对面的山从脚下一步一步露出来。徐霞客走到能看全的地方，在纸边划了一笔。
        p3: '{staff}陪徐霞客从两面重走狮子崖下的岔口，把要折回的那一段指给他看。草图后来搁在解脱林的门槛里。折到末尾处，那道弯还完整地留在纸面上。'
      outcomes:
        all: 书卷交清后，那半日的山路也进了日记。留在解脱林的草图打开时，纸上两条路各从一道折痕旁拐过去。
        p3: 后来解脱林里留下了一张草图。有人指着狮子崖下那道弯，再把纸折回去。
        p2: 丽江的记述里后来多了一处站过的地方。徐霞客翻回那页，手指在对山初见的那一行停住。
        p1: 木增后来送来酬谢，又请他修志。收起回信时，匣子里卷册的纸签还排得齐。
      none: 木匣合上了。门槛边那张闲纸卷起来，没压住的一端扫过地面。
      not_admitted: '{staff}没能在校书的人中留下。门内有人搬动木匣，盖子响了一声。'
      desync: 送书前没有核清卷册。{staff}被召回时，匣边还有一张没勾完的单子。
      excerpts:
        p3: 草图后来搁在解脱林的门槛里。折到末尾处，那道弯还完整地留在纸面上。
        p2: 对面的山从脚下一步一步露出来。徐霞客走到能看全的地方，在纸边划了一笔。
        p1: 送书人把回执搁在最上面。下面的书页收齐了，仍有一根细纸签露在匣外。
    relic: 一张解脱林步行图
    relic_desc: 一张折过的步行图，坡路用线画出，岔口旁留着空白。
    points:
      p1: 跟送书人核清校过的卷册已经交回，赶上木增初九酬谢和续修《鸡山志》的委托
      p2: 从校书之后腾出半日，请本地人带路、护卫同行，陪徐霞客从解脱林一步步走上拱寿台
      p3: 陪徐霞客沿狮子崖下的岔路往返，记下从哪儿开始折回，离开前给寺里留一份
    points_fail:
      p1: 退回的几卷还缺着签记，来请修志的人无法确认校书已完，这次交接错过，事务所召回员工。
      p2: 等书卷合上，已经走不了这一趟。拱寿台在日记里仍是听来的地名。
      p3: 徐霞客离开丽江时，没能把亲脚丈量过的路线补到听来的路引旁。
    shift:
      p1:
        was: 1639 年二月初九，木增遣人送礼酬谢校书，并再次致书请徐霞客修《鸡山志》。
      p2:
        was: 1639 年二月初六，徐霞客写校书催得紧，没来得及登拱寿台和狮子崖。
        now: 书卷交清后，{staff}陪徐霞客回解脱林，和向导、护卫会合。徐霞客登上拱寿台，记下走到哪里才看得见对面的山。
      p3:
        was: 1639 年的丽江日记把狮子崖记为听说在寺后高处、因校书未及攀登的地方。
        now: '{staff}陪徐霞客从两个方向各走一遍岔口。徐霞客标出路折回的那一弯，给解脱林留了一份草图。'
        who: xu_xiake_lijiang
        bio: 徐霞客的丽江日记在校书和出关之间多了一篇亲历。解脱林另留一份足迹草图。
    vignettes:
      view: 向导拿对面一座山来指弯道。{staff}问清要先过几个弯，把远处的山和脚下的路分成两行记。
      trail: 护卫走到石阶，袖口湿透了。{staff}把干布搭在门边，再把校到一半的稿页往屋里挪。
      slope: '{staff}在解脱林门槛上另抽出一张纸。还书单进了木匣，记路用的那张留在手里。'
    remarks:
      trait_methodical: '{staff}在草图上多画了一个箭头，下一位走到岔口便知道哪边是上坡。'
  song_yingxing_fengxin:
    name: 一本讲万物如何造成的书
    place: 江西
    figure: 宋应星
    story: 宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。
    relic: 一页工具图
    relic_desc: 一张木刻版画，织机的每个部件都标了名。
    points:
      p1: 刻书的钱还没凑齐时，帮他把《天工开物》送进刻坊，让书照常刊刻
      p2: 临付梓前，劝住他删去《观象》《乐律》两卷，让这两卷和全书一起刻出来
    points_fail:
      p1: 书没能付梓，这条分支与历史脱了节，事务所召回员工。
      p2: 两卷照史实临梓删去，后来失传，这条分支里也没有。
    shift:
      p1:
        was: 崇祯十年孟夏，宋应星写成自序，《天工开物》由友人涂伯聚出资刊刻。
      p2:
        was: 崇祯十年，宋应星在自序里说《观象》《乐律》两卷道理太精，自认不是自己的本分，临付梓时删去；这两卷后来失传。
        now: 《观象》《乐律》两卷刻进了初刊本，和全书十八卷一起传了下来。
        who: song_yingxing_fengxin
        bio: 这条时间线里，宋应星没有删去《观象》《乐律》两卷，《天工开物》初刊时就有它们。
    vignettes:
      strainer: 你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。
      drying: 读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。
      sheet: 读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。
  wang_zhenyi_jinling:
    name: 挪到桌下的那面镜
    place: 南京
    figure: 王贞仪
    story: 王贞仪在《月食解》中自述，把镜子移到圆桌下，桌面挡住了吊灯照向镜子的光。提起灯后，光又照到镜上。
    relic: 一面小圆镜
    relic_desc: 在她的月食模型里充当月亮的那面镜子。
    points:
      p1: 提灯之前，请帮工把镜子放回同一个位置
      p2: 看准镜面从暗转亮的那一次
      p3: 把灯最初和最后的位置画在同一张图上
    vignettes:
      one_change: 帮工正要把灯和镜一起抬。你请她这一遍先别动镜，只把两次灯高分别画出来。只动一样，镜上果然有了光。你把图带回去，下一次能拿它对照天色的时候还没到。
      shadow: 你知道后人能在书里读到这次演示，刚进门的帮工眼前却只有一面暗镜。你让她在提灯前后各看一次，指给她看挡在中间的桌沿。她自己就能在图上标出遮挡处。这趟看见的是屋里的现象，没有赶上真正月食。
      outline: 你在纸上画下桌沿、低处的镜子，再从灯处画出一条线。镜面一亮，你在同一页添了第二条线。两条都带回去，今夜的天空没有相应的变化可供比较。
  jianzhen_nara:
    name: 回扬州的长路
    place: 岭南
    figure: 鉴真
    story: 鉴真第五次尝试前往日本，船却被风吹到海南。北返途中，曾来扬州请他东渡的日僧荣叡在端州病逝。鉴真在路上失明，两部早期文献对经过的记述不同。
    story_prose:
      opening:
        - 端州，同行人把刚抄好的路引搁在门边。荣叡的屋里有人坐着，几次让外面传话的人等。鉴真来问，能不能让他先进去坐一会儿。
        - 《唐大和上东征传》记鉴真一行过端州时，荣叡在那里去世。其后鉴真视力减退，一行继续返回扬州。分支借这段行程写两件小事，先给两人留一段说话的时间，之后让鉴真听得到行程。
        - 懂照护的人可以先去问荣叡所愿。会读路引或能听清多方说法的人，再把后面的去向一处处念给鉴真。
      points:
        p1: 等外面来问行期的人走开，你先问荣叡愿不愿让鉴真进来。他点头，要端来一把不挡门的凳子。你与旁人说定这段工夫先不传话，转到院子里等。门里传来两个人说话的声音，声音轻了也没人催他们。
        p2: 路引叠了几层，同行人正想直接告诉鉴真已经定好的走法。你先把还没确定的几个地方念出声，让他听见哪里需要留一宿。鉴真问其中一处的名字，又听了一遍，才说自己想先走哪一段。有人把他的决定写到原先只留着地名的那张纸上。
      outcomes:
        all: 荣叡和鉴真有过一段说话的工夫，荣叡仍在端州去世。往后鉴真看不清字时，一行人照着他听过的路线走。
        p1: 两人保住那一场会面。荣叡仍去世；后来路引上的字，鉴真还要别人慢慢转告。
        p2: 鉴真听过下一程，自己说了想走的路。荣叡身边那段没说完的话没有补回来。
      none: 路引重新捆成一束。屋里要传的话和屋外要走的路，都还等旁人来说明。
      not_admitted: 你没能进荣叡借住的屋子。另一份路引随同行人收回，没从门边念出声。
      excerpts:
        p1: 门里传来两个人说话的声音，声音轻了也没人催他们。
        p2: 有人把他的决定写到原先只留着地名的那张纸上。
    relic: 一页行程纸
    relic_desc: 虚构路记，记一行人北上的去向。
    points:
      p1: 在端州问荣叡想怎样被照料，再替他和鉴真留一段能说话的时间
      p2: 鉴真看不清时，把一行人的行程念出声，请他自己决定接下来怎么走
    points_fail:
      p1: 总有别的事要办，守在榻边的人一再被叫走。两人还能说话的那段时间，就这样过去了。
      p2: 同行的人又把路引捆回了一束。鉴真看不清纸上的字，只能等别人告诉他。
    shift:
      p1:
        was: 第五次渡海失败后的北返途中，荣叡在端州病逝。
        now: 这条分支里，{staff}在端州守着荣叡，把鉴真请到榻边。两人得空单独说了一会儿话。
      p2:
        was: 早期文献记载鉴真在这趟归途中失明，后来仍东渡日本。
        now: 这条分支里，{staff}把接下来几个落脚处念给鉴真听。鉴真请同行改了一站，也说明自己想什么时候再出发。
    vignettes:
      sound: 同行人指着纸上的下一站。鉴真在听，{staff}请对方把地名念两次。
      tie: 一行人要把路引捆起来。{staff}撑开纸束，待有人核对完去处的先后。
      temple: '{staff}到院里回答来人的问题，屋里的两人不用提高声音就能把话讲完。'
  hua_tuo_xuchang:
    name: 史书提到的那一卷
    place: 许昌
    figure: 华佗
    story: 晚出的《三国志》说华佗被关入许狱，并记他试图从狱中交出一卷书而未成。
    story_prose:
      opening:
        - 东汉末年的许。陈寿的《三国志》记下华佗在狱中的结局，也记一卷没有流传下来的书。
        - 史实里，狱吏不敢收华佗交来的书，书后来被烧去。在这条分支里，有人愿意问清书卷可不可以由亲友领取，也有人想试着递一份宽免请求。
        - 这趟用得上熟悉文书来往的人，得能把领书和求宽免说成两件事，各自找到肯听完的人。
      points:
        p2: '{staff}请肯转呈的人等一等，把请求里的姓名和案子逐项对清。他收下以后又叫人回来，把受理的字样写在副本上。几天后，华佗从门里出来，见到等他的人。 门边的人伸手想扶他。他先站了一会儿，才把手递过去。'
        p1: 狱吏一看是华佗的书，手伸出去又缩了回来。{staff}问清由谁具名受领，另请一位亲友到值房登记。簿子翻到新一页以后，那卷书才移到门外。 领书的人找不到合适的包布，便把外衣解下来铺在桌上。
      outcomes:
        all: 华佗回去时，有人把包好的书放在门边等他。他认出用来打结的那一角衣布。
        p2: 熟人陪华佗离开许狱，走到外面才慢慢转过第一个街角。
        p1: 那卷书先留在领书的人家里。包布没有拆，书脊压下的一条折痕还在。
      none: 值房的人收起登记簿。纸角已经卷起来了，本该写领书人的那页仍空着。
      not_admitted: '{staff}没有见到经办人。窗下的桌子直到收工也没有挪动。'
      excerpts:
        p2: 门边的人伸手想扶他。他先站了一会儿，才把手递过去。
        p1: 领书的人找不到合适的包布，便把外衣解下来铺在桌上。
    relic: 一页练习登记簿的副本
    relic_desc: 登记副页，区分传闻与实际交接。
    points:
      p1: 狱吏畏法不敢收时，不让那卷书被烧掉
      p2: 在判决执行前，让宽免的请求重新送到能复议的人手中，使华佗得以活着走出许狱
    points_fail:
      p1: 狱吏畏法不收，华佗把书烧了，这条分支里那卷书一页也没留下。
      p2: 他照史实死在许狱，这条分支里他再没给人看过病。
    shift:
      p1:
        was: 约 208 年，《三国志》记华佗递出的书卷被狱吏拒收，后来由华佗烧去。
        now: 那卷书有人收着带出了许狱，没散失之前已经抄了一份。
      p2:
        was: 约 208 年，《三国志》记曾有人为华佗求情，华佗仍在许狱被处死。
        now: 这条分支里，宽免的请求重新获准审议，判决改了。华佗活着走出许狱。
        who: hua_tuo_xuchang
        bio: 这条分支里，华佗获宽免，活着走出许狱。
    vignettes:
      notice: 阿瑾听说有一卷书，便写进已收物件。你请她指给你看书该搁在哪层。她把那一行移到传闻栏，架上仍留空，话是谁说的也记在旁边。
      shift: 阿长想合上登记簿，再叫下一班来。你请他先把这几行念一遍。念到没人亲见的交接，两人商量把那一栏先挂着。接手人看得见还有哪一笔没核实。
      later: 你知道后来史书会说起一卷书。阿瑾问，有没有真书从这屋交出去过。你指给她看若真有交接该记在哪儿。纸离开她的桌子时，那一栏仍空着。
  miyazawa_kenji_hanamaki:
    name: 很少有人读过的故事
    place: 花卷
    figure: 宫泽贤治
    story: 宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。
    story_prose:
      opening:
        - 1933 年，花卷。宫泽贤治从前教过书，也给附近的农户办肥料咨询。写给孩子的故事有一些一直跟着他改。
        - 史实里，他在九月因病去世。《银河铁道之夜》留下了不同阶段的稿页。在这条分支里，来问田里事情的人和想看稿件的人都要等他有力气说话。
        - 这趟用得上能把农户的问题问准、又知道什么时候应该少问一句的人。还需要有人能带对装备，及时照护病中的宫泽。
      points:
        p3: 九月二十日，门边的人说他刚才已经坐不住。{staff}带着器材来请他允许照料，并请家人留下。隔了一段日子，宫泽伸手，自己接过家里人端来的水。 屋里的人把原来放得太远的凳子拉过来。他把空杯递回去，等手松开才靠回枕上。
        p2: '{staff}把各稿分开递给宫泽，只问他认得出的先后。他在其中一份的末页停下来，用指头在两行之间来回比。 他选了两张纸，叠在整份稿的最上面。夹进来的那一页只有他才知道该先读。'
        p1: '{staff}在门外先问每户种的是什么、到底想问哪一件事，再把相近的几个问题放在一起递进去。有人说不清一块田的大小，便回家找来写过的纸。 宫泽让第一个人坐下，自己把问题纸按到桌面。纸角被水杯压住，这回不用他一直扶着。'
      outcomes:
        all: 农户还会拿新的问题来。稿纸和问题纸分放在两头，宫泽先把门口那位来客的凳子找出来。
        p3: 家里把他用过的杯子洗净，仍放在他能顺手拿到的地方。
        p2: 后来翻到那些草稿时，上面两叶还按宫泽选的顺序叠着。
        p1: 最后离开的农户把问题纸叠成四折，出了门才拿给等候的人看。
      none: 到了九月，稿页仍分在几沓里。窗边那把等人来坐的椅子空了下来。
      not_admitted: '{staff}没能进屋。门边的人把问田里的几张纸收拢，替它们避一会儿雨。'
      desync: 来访的人等不到能问事情的时候。事务所召回{staff}时，问题纸还在最先来的人手里。
      excerpts:
        p3: 屋里的人把原来放得太远的凳子拉过来。他把空杯递回去，等手松开才靠回枕上。
        p2: 他选了两张纸，叠在整份稿的最上面。夹进来的那一页只有他才知道该先读。
        p1: 宫泽让第一个人坐下，自己把问题纸按到桌面。纸角被水杯压住，这回不用他一直扶着。
    relic: 一本口袋笔记本
    relic_desc: 一本小笔记本，里面是铅笔写的诗。
    points:
      p1: 在宫泽无力长谈时，理清来访农户的问题，让这次肥料咨询照常办下去
      p2: 趁宫泽还能辨认草稿，请他给《银河铁道之夜》留下各稿的先后
      p3: 9 月 20 日急性肺炎加重时，让宫泽贤治及时得到医护，帮他熬过这场病
    points_fail:
      p1: 来访的人等不到能问清楚的时候，咨询没办成，这条分支与史实脱节，员工被召回。
      p2: 稿页留了下来，后来整理的人仍要从纸张和改笔判断稿本先后。
      p3: 这条分支里病照旧发展，9 月 21 日他在花卷去世，三十七岁。
    shift:
      p1:
        was: 1933 年 8 月，宫泽贤治病情转重，仍应答农户的肥料咨询。
      p2:
        was: 1933 年 9 月，宫泽贤治去世，《银河铁道之夜》留有多次改写的未定稿。
        now: '{staff}请宫泽指出哪叠在先、哪叠在后，把次序另记在封纸上。后来整理作品的人照着这份记号把不同稿本分别保存。'
        who: miyazawa_kenji_hanamaki
        bio: 宫泽生前留下了《银河铁道之夜》各稿的排序说明。作品身后刊行时，读者可以由早到晚读到他留下的改写。
      p3:
        was: 1933 年 9 月 20 日，宫泽贤治患急性肺炎，次日在花卷去世，三十七岁。
        now: '{staff}在病情最急的那天帮他得到医治。宫泽熬过了这场病，到了秋深时，又能坐到桌边。'
        who: miyazawa_kenji_hanamaki
        bio: 这条分支里，宫泽贤治熬过了 1933 年秋天的肺炎，重新拿起了稿子。
    vignettes:
      call: 你在屋子那头念出站名。还没解释谁在那里，读者就抬了头。他再读时把解释往后放，先保留那一声。
      window: 读者想指出铁道从哪里通进天空。你问乔班尼先从窗里看见了什么。他把小山和车厢分别写在两张纸上。
      ticket: 读者重读转进车厢那几句时，你一直替他翻着这页。下一站还没叫名以前，他先记下眼前已经变了什么。
  higuchi_ichiyo_tokyo:
    name: 柜台上的七期《青梅竹马》
    place: 东京
    figure: 樋口一叶
    story: 樋口一叶的《青梅竹马》在 1895 年至 1896 年 1 月间于《文学界》连载，共七期。1896 年 4 月，《文艺俱乐部》一次刊出全文。书摊上的周折是分支演绎。
    story_prose:
      opening:
        - 1896 年，东京。樋口一叶的《青梅竹马》原来在《文学界》分七次连载，改稿后来在《文艺俱乐部》一次刊全。
        - 史实里，一叶来不及看到这篇变成由她挑底本的单行本，同年十一月因病去世。在这条分支里，柜台上的旧刊还没收齐，书商也还有机会答应早付一笔稿酬。
        - 这趟用得上能追到旧刊和校样的人。有时比找书更难的，是让谈稿酬的人等作者读完条款。病中还需要带着合适装备来的人。
      points:
        p3: 天热起来以后，一叶仍然发烧。{staff}到住处探望，把她愿意接受的照护安排好，又请同住的人先把来催稿的回绝。后来有一天，她重新坐到了桌边。 她把原先靠墙放着的稿子挪回来。纸上泛起一点窗光，正落在她上次停笔的地方。
        p2: '{staff}请书商把付多少、何时付、用哪个校本一并写清。一叶把纸拉近，一条一条读，看到最后一条时才问可以留下哪一份。 书商把他那份对折。一叶手边摊着另一份，她圈出的底本名称一眼就看得见。'
        p1: 七期旧刊摆在柜台上只数得出六本。{staff}跑去找最后借走那期的人，赶回来时，一叶正翻出同一段在改稿上的位置。 她把两页紧挨着摆好，从新写的第一行开始读。柜台底下那道裂缝，这一回没有夹住纸。
      outcomes:
        all: 一叶回到桌边后先看那份单行本约定。窗边搁着两摞东西，一摞是旧刊，一摞是她后来愿意继续写的纸。
        p3: 她能重新坐下来写字的时候，先取了最上面的一页。房里没有人替她把页翻过去。
        p2: 书商把约定的一份送了回来。她把那张底本的校样压在同一册旧刊里。
        p1: 合刊的新本送到桌上时，七期旧刊还叠在一起。她在桌边停下来翻看改过的地方。
      none: 书商留了消息说还要再等。那册合刊合起来时，里面没有新的答复。
      not_admitted: '{staff}没能见到一叶。借阅柜台下还有一摞旧刊，封面用线捆住。'
      desync: 其中一期没能找回。事务所召回{staff}时，柜台上那一叠仍留着中间的空处。
      excerpts:
        p3: 她把原先靠墙放着的稿子挪回来。纸上泛起一点窗光，正落在她上次停笔的地方。
        p2: 书商把他那份对折。一叶手边摊着另一份，她圈出的底本名称一眼就看得见。
        p1: 她把两页紧挨着摆好，从新写的第一行开始读。柜台底下那道裂缝，这一回没有夹住纸。
    relic: 一本随身日记
    relic_desc: 一本写了多年的日记，毛笔字端正。
    points:
      p1: 拿齐《文学界》七次连载的旧刊，同樋口一叶核全《文艺俱乐部》的合刊校样，让改过的全篇能在四月刊出
      p2: 趁合刊新出，请一叶与书商定一份带预付稿酬的单行本约定，由她指定所用校本
      p3: 七月一叶发热不退时，及早查出结核，治好她
    points_fail:
      p1: 零散旧刊少了一期，编辑只收到不全的合刊稿，事务所因同步失败召回员工。
      p2: 已有合刊可以借阅，书商仍只让她等后续消息，稿酬与使用哪个底本都没有定。
      p3: 一叶的病照史实加重。11 月 23 日，她死于肺结核，年二十四。
    shift:
      p1:
        was: 《青梅竹马》分七次刊载，1896 年 4 月 10 日由《文艺俱乐部》刊出修订后的全篇。
      p2:
        was: 一叶晚年仍面对生计压力。《青梅竹马》后来收入 1897 年刊行的全集。
        now: 书商先付一笔稿酬并留下签认的校样。她能用这笔收入周转；往后排版的人也知道这版应照哪一份稿。
      p3:
        was: 1896 年 7 月，一叶病重。同年 11 月 23 日，她死于肺结核，年二十四。
        now: '{staff}替一叶及时找到了医护。她慢慢好起来，又能每天抽一会儿坐到写字桌前。'
        who: higuchi_ichiyo_tokyo
        bio: 这条分支里，樋口一叶在 1896 年病后恢复，重新开始写作。
    vignettes:
      index: 有人在一期杂志上用铅笔写了「全」。你翻到那一期的末尾，拿四月刊本一对，找到了断在何处。摊主让你夹张能取下来的纸签。你带回七期的清单，却没能问到原来的字是谁写的。
      reserve: 有位读者一期期追下来，末回还没来取。你指给摊主看，别的客人如今可以买四月的全文刊本。末回连同预留的小条一起放进柜台底下。那位读者回来以前，你先收队了。
      layout: 你把四月那期放在末回旁边。一本打开是开头，另一本默认读者已经等过前面六回。你给摊主写下区别，也给自己留了一份。最初追连载的读者，等的时间比你整趟穿越还长。
  sei_shonagon_kyoto:
    name: 皇后临产的那个冬天
    place: 京都
    figure: 清少纳言
    story: 清少纳言侍奉藤原定子，也在《枕草子》中写过定子身边的人和事。长保二年岁末，定子生下女儿媄子内亲王，不久去世。
    story_prose:
      opening:
        - 京都入冬以后，屏风边多放了一个坐垫。清少纳言问要留给谁，屋外恰好有人送话进来。定子回望那一处空位，送话人还没有走。
        - 一条天皇时的定子在 1000 年末临产，按换算日期于 1001 年 1 月 13 日去世。后来的清少纳言在《枕草子》写了宫中的往事。这里可以先问定子愿意谁陪着，给她自己选的人腾出位置。
        - 让善于听人说完的员工与清少纳言一起去问。收到外面的消息时，分一人答复，免得屋里又要全停下来。
      points:
        p1: 清少纳言拿起坐垫要往常用的位置放。你候送话人读完，再请她问定子愿意留谁。定子说了一个名字，又说那人来了就坐在灯后一点。清少纳言照她指的地方放下坐垫。等屋里安静下来，那位被点名的人已经坐定，定子的手仍放在自己想放的地方。
      outcomes:
        all: 她要见的人留在近处。她后来仍去世，回程记录留下的是她自己选人陪伴的这一刻。
        p1: 清少纳言替定子把那只坐垫留到来人坐下。后来的日子仍按史实记载。
      none: 门口的消息一条接一条。坐垫最后给了最先被请进来的人，来不及问定子想见谁。
      not_admitted: 外面的人没有传你进去。屋里有人把椅垫换了地方，你在屏风外看不清留给了谁。
      excerpts:
        p1: 等屋里安静下来，那位被点名的人已经坐定，定子的手仍放在自己想放的地方。
    relic: 一张折起来的传话纸
    relic_desc: 虚构便笺，写着谁可以进屋。
    points:
      p1: 临产前问定子想让谁留在近处，帮清少纳言把位置留给她想见的人
    points_fail:
      p1: 门外又有人来传话。屋里还没来得及问定子愿意让谁留下。
    shift:
      p1:
        was: 宫廷纪事记载媄子内亲王出生，定子随后去世。
        now: 这条分支里，{staff}请其他来人先在门边等，屋里留谁由定子自己说。清少纳言听完她的话，还来得及把下一条消息带出去。
    vignettes:
      compare: '{staff}请传话人折纸前把一个名字念清。清少纳言转述时不必再问。'
      colour: 清少纳言移开灯，看看灯后能否坐下。{staff}把多出的坐垫移到定子指的地方。
      listen: '{staff}等门口的消息答完，才问屋里还有什么需要。'
  kabir_maghar:
    name: 一首歌里两个地名
    place: 马格哈尔
    figure: 迦比尔
    story: 《古鲁·格兰特·萨希卜》中归于迦比尔的一首诗，提及贝拿勒斯和马格哈尔，问地点对虔敬何异。
    relic: 一把练习打拍用的梭
    relic_desc: 纪念物，用来给接唱打拍。
    points:
      p1: 留意两名歌者在哪儿想起了不同地名
      p2: 先听两人各唱完一遍，再纠正
      p3: 转唱时，让听众还能听见两个地名
    vignettes:
      towns: 帕萝从贝拿勒斯唱起，萨利姆接马格哈尔。你请他们轮流唱，别让一句压过另一句。听众听清两个地名，也听出哪里转成问句。帕萝把开头交给下一个人，仍把答句留给对方。
      beat: 帕萝还没唱完头一处，萨利姆已唱到第二个地名。你用她凳边的梭在木头上敲一下拍子。这回他等住了，开口便有人听见。唱完，帕萝把梭递给他，请他替下一个声音打拍子。
      collection: 你读过后来的传本，两个地名都在纸上。帕萝问，没来的朋友听她起第一声，会不会认得。你听她试了一遍，没替她唱后世那一版。你离开时，她的朋友还没到。
  ibn_rushd_lucena:
    name: 焚书令之前
    place: 科尔多瓦
    figure: 伊本·鲁世德
    story: 约 1195 年，伊本·鲁世德在穆瓦希德王朝失势，被放逐到卢塞纳。文献还记载了禁书与焚书。他为亚里士多德《物理学》写的长篇注释没有留下阿拉伯文原本，希伯来文和拉丁文译本仍存。
    story_prose:
      opening:
        - 科尔多瓦桌上有两封还没送出的口信，靠门的一封写着卢塞纳。读者问伊本·鲁世德还愿不愿回话，又把准备抄的《物理学》长注拉近一点，好让抄写人看见有一处仍缺词。
        - 伊本·鲁世德约在 1195 年被放逐到卢塞纳。传记留下有关书籍受限的记述；《物理学》长注的阿拉伯文传本残缺。这里可以让散在两地的人恢复联系，还可以为一节长注留出抄过的副本。
        - 会办通信的员工先核去向和回信的收件人。能读阿拉伯文或校注的人，替读者对清原句与注解。
      points:
        p1: 读者写了好几行，临发只求你说一句还想接着读。你到卢塞纳把这句读给伊本·鲁世德，告诉他回信可以交给哪家。伊本·鲁世德问对方读到了第几节，再另取纸写回话。他递来两折已经合好的纸，请你交给真正还在读的那个人。
        p2: 抄写人的笔已经越过一处空。他说前后能接上，可读过底本的人认得是哪一句被漏了。你请他先把那一句和长注分开按行写，再照着复读。副本交给读者时，他把手压在原句和解释的分界处，对你说两段他自己也能找。
      outcomes:
        all: 卢塞纳和科尔多瓦之间多了一封回话。一节长注另有可查的阿拉伯文副本，其他卷页的损失仍留在史实栏。
        p1: 伊本·鲁世德知道还有人在读。去卢塞纳的信回到原处，长注副本还没抄完。
        p2: 读者带走校过的抄页。他要寄去卢塞纳的话仍未送出。
      none: 一封信和一张半抄的页都在原处。读者要等下一次来的人。
      not_admitted: 门边暂不收陌生人代送的信。你没能让读者托的那句话传进去。
      excerpts:
        p1: 他递来两折已经合好的纸，请你交给真正还在读的那个人。
        p2: 副本交给读者时，他把手压在原句和解释的分界处，对你说两段他自己也能找。
    relic: 一页读书练习摘录
    relic_desc: 摘录，为前提另留一处。
    points:
      p1: 从科尔多瓦给卢塞纳的伊本·鲁世德捎个口信，告诉他还有读者想跟他通信，也愿意收他的回信
      p2: 焚书令下来前，把《物理学》阿拉伯文长注的一节抄校清楚，另留一份给读者
    points_fail:
      p1: 读者写好的便条还在科尔多瓦，只能等下一次有人捎过去。
      p2: 副本还没抄完。离开时，读者没有可以带走的阿拉伯文抄页。
    shift:
      p1:
        was: 伊本·鲁世德失势后被放逐到卢塞纳，后来获准回朝。
        now: 这条分支里，一张读者写的便条到了卢塞纳。伊本·鲁世德可以趁还有人捎信时写封回信。
      p2:
        was: 伊本·鲁世德的《物理学》长篇注释失去了阿拉伯文原本，保存下来的是中世纪译本。
        now: 这条分支里，有一节对过的副本在禁书后仍留在读者手里。他再遇到别的抄本，还有阿拉伯文可以对照。
    vignettes:
      premise: 玛丽娅姆把结论抄得很工整。优素福要读通，却得先替她猜一个没写出来的前提。你问他读到哪儿卡住，在结论前留出地方。玛丽娅姆把前提写进去，优素福终于能就它发问。
      together: 优素福想把书还了，只给自己留一句。你给他留点时间，把旁边那一步也抄走。到了门口，玛丽娅姆请他复述结论，他如今也说得出理由。
      language: 你认得一个后来会在译本里出现的术语。玛丽娅姆只想核对前提有没有照原样抄下。你帮她把纸铺平，陪她查。她在边上写的问题，会交给这趟见不到的人。
  rumi_konya:
    name: 开篇是谁在说
    place: 科尼亚
    figure: 鲁米
    story: 鲁米《玛斯纳维》开篇请人听芦管诉说离别。科尼亚梅夫拉纳博物馆藏有六卷全本，抄于1278年，晚于鲁米1273年去世。
    story_prose:
      opening:
        - 1273 年，科尼亚。鲁米写下的长诗后来分为六卷，五年后抄成的一部写本今天仍存。
        - 史实里，鲁米在这一年十二月去世。写本告诉后来的读者长诗是怎么分卷的。在这条分支里，两份借读的抄页还搁在一起。
        - 这趟用得上能辨清抄页顺序的人。也需要有人先听清病中的人想要见谁，再替他守住一小段安静。
      points:
        p2: '{staff}问鲁米想先见谁，把来人请进来，再让门边等候的人稍候一会儿。来客坐在他听得见的地方，有一阵子两个人没有说话。 来客把自己原先捏在手里的纸搁了下来。鲁米看见了，把杯子往他那边推了一点。'
        p1: '{staff}等借书人回来认领时，先把两份抄页在桌上分开，顺着每份露出来的末行去找下一页。来人也坐下来帮忙，读到断的地方时把声音停住。 他找到接下来的那一页，往前放了一寸。借出去的那一束，这一次从头到尾都能接上。'
      outcomes:
        all: 后来借书的人把两份抄页各放在该放的位置。门关上时，出去的人手里还是空的，借书的先留在屋里。
        p2: 门外的人往后让出一点地方。那位来客坐了很久，走的时候没人催他。
        p1: 借书人到门边又回头翻了一页，才把一束贴在衣上带出去。
      none: 两份纸还在同一张桌上。窗边那只杯隔了很久也没人动。
      not_admitted: '{staff}没等到能进屋的时候。借书人站在长凳边，手里空着。'
      desync: 一份抄本漏了一节便被借走。事务所召回{staff}时，另一份还在桌上摊开着。
      excerpts:
        p2: 来客把自己原先捏在手里的纸搁了下来。鲁米看见了，把杯子往他那边推了一点。
        p1: 他找到接下来的那一页，往前放了一寸。借出去的那一束，这一次从头到尾都能接上。
    relic: 一张起句练习稿
    relic_desc: 读书页，在起句处做了记号。
    points:
      p1: 在科尼亚对好一份《玛斯纳维》抄页的卷次，再把它交给下一位借读的人
      p2: 鲁米病中，问他想见谁，等那个人进屋坐下，让屋里先安静一会儿
    points_fail:
      p1: 两份抄本混了页，有一束漏排了一节就被借走。记录脱节，事务所召回{staff}。
      p2: 鲁米想见的人还没坐下，门外又有人来访。
    shift:
      p1:
        was: 科尼亚保存一份 1278 年的《玛斯纳维》全六卷手稿，抄于鲁米去世五年后。
      p2:
        was: 1273 年 12 月，鲁米在科尼亚去世。后出的传记描写有同伴聚到他的病榻前。
        now: 这条分支里，{staff}替鲁米想见的人搬了把椅子。两人可以先坐一会儿，等鲁米有力气了再开口。
    vignettes:
      reed: 娜琳把两处用同一种声音读过去。你问，芦管从哪里开始用自己的口吻说话。她换过一口气，才念下一句。哈桑闭着眼，也听得出哪里换成了芦管。
      hand: 哈桑得离开读书凳，还没念完，娜琳手已够到那页。你按住纸角，等他把一联念完，手指落到下一行。轮到她时，她从那儿起句，一段诗从一人手里递到了另一人。
      manuscript: 你见过后来的六卷抄本。娜琳问，上面能不能看出哈桑在哪里换气。你指着刚练过的那行，让她自己定在哪里停。门关上时，他们还没念到下一联。
  ibn_al_nafis_cairo:
    name: 单独托给一位读者
    place: 开罗
    figure: 伊本·纳菲斯
    story: 伊本·纳菲斯临终把藏书留给医院。他计划撰写的医学大全没有完成，现存卷册分散。在这条分支里，还有一位读者愿意接下一卷自己能够保管的成稿。
    story_prose:
      opening:
        - 1288 年，开罗。伊本·纳菲斯临终把藏书留给了医院。他那部计划写得很长的医学大全没有写完，今天尚见的只是一部分。
        - 史实里，传记记下了他的藏书处置，没逐一说清每卷后来到了哪里。在这条分支里，有位常来翻书的读者，想把自己正在读的一卷借完。
        - 这趟用得上懂书怎么归还、怎么借出去的人。约定得留下后来人也找得到的地址。
      points:
        p1: 读者本来只想借到月底。{staff}请两人先说定，这一卷最后放在哪里、旁人来读时找谁开门。伊本·纳菲斯翻过封面，给他指出尚未校过的地方。读者把借据摊在书上，用拇指把自己刚签的名字盖住了一半。等纸上的墨干透，他才把手移开。
      outcomes:
        all: 后来有人按借据的地址来找这卷书。开门的人取下卷册，把夹在第一叶里的纸一同递过去。
        p1: 后来有人按借据的地址来找这卷书。开门的人取下卷册，把夹在第一叶里的纸一同递过去。
      none: 没有人肯留下可以长期借阅的地址。借据还摊着，书仍在原来那摞里。
      not_admitted: '{staff}没能进屋。窗边的人转过一页，没听见门外的脚步。'
      excerpts:
        p1: 读者把借据摊在书上，用拇指把自己刚签的名字盖住了一半。等纸上的墨干透，他才把手移开。
    relic: 一张署名的借据
    relic_desc: 分支里的借据，记着谁答应照看这一卷。
    points:
      p1: 请伊本·纳菲斯把一卷成稿托给另一位读者，并确认后来的人还能借阅
    points_fail:
      p1: 员工没能找到愿意对这一卷负责的读者。
    shift:
      p1:
        was: 1288 年，伊本·纳菲斯去世，将藏书留给医院。他的医学大全今天只存部分卷册。
        now: '{staff}请到另一位保管人，在交接时写明日后在哪里可以查阅。其余藏书照他的原意托付。'
        who: ibn_al_nafis_cairo
        bio: 他的医学大全有一卷在分支里交由第二位保管人，后来仍可借阅。
  al_khwarizmi_baghdad:
    name: 代数背后的那个人
    place: 巴格达
    figure: 花拉子米
    story: 花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。
    relic: 一张演算过的方程
    relic_desc: 一张逐步解出平方与根的演算纸。
    points:
      p1: 在巴格达交抄时把实用例题与如何归整算式的正文合入同一册
      p2: 给后来的抄写人留一册把题例与它应用的正文相连的底本，让实际用过的读者也能指出抄漏
    points_fail:
      p1: 抄成的纸只记录算式，没有后面的实用题，原拟成册的著作没能完整交出，事务所召回员工。
      p2: 后一批抄本只传数学正文，试着拿去算分割的人没有例子可查。
    shift:
      p1:
        was: 花剌子密约在 830 年编写《还原与对消计算概要》。作者序列举经商、测地和财物分配等用途。
      p2:
        was: 后世传抄和翻译时曾出现章节差异。某些传本没有保留全部实用部分。
        now: 一份有互见的完整本可留给学徒和抄写者核对。后来分抄时也能查到哪一段来自整体中的哪一类题。
        who: al_khwarizmi_baghdad
        bio: 花剌子密编书时关心数学怎样用于日常问题。书在跨地域传抄与翻译时，部分内容的流传路径不同。
    vignettes:
      balance: 你请学算者把两边各做了什么都说出来。他还没算到答案就停了下来。刚才最糊涂的那一步，这回他讲得最清楚。
      tiles: 学算者照着念，你把几块方片摆在桌上。念到绕口处，剩下的形状正好让人看出还缺哪一块。
      check: 学算者做完后，你把第一行留在眼前。他把答案放回去念了一遍，看看两边的数是否还相等。
  ibn_khaldun_cairo:
    name: 亚历山大港的那条船
    place: 开罗
    figure: 伊本·赫勒敦
    story: 伊本·赫勒敦 1382 年应苏丹巴尔库克之邀来到开罗。1384 年，苏丹请突尼斯的君主放他的家人来埃及，8 月 8 日又任命他为马立克派首席法官。从西边来的外人坐上这个高位，城里的对手很快就开始设法把他拉下来。同年，载着他妻女的船在亚历山大港沉没。他在《历史绪论》中提出，史家要用所写社会中可能发生的事情检验传闻。
    story_prose:
      opening:
        - 开罗的书记把一张任命稿和一份要复核的名字放在同一案上。伊本·赫勒敦问哪个人在外面等。他还在等另一封信，想知道妻女从突尼斯来埃及的船到哪儿了。
        - 1384 年，伊本·赫勒敦在开罗获任首席法官。后来载他妻女的船在亚历山大港遇难。这趟可以保住任命经过，之后到港帮船上的人获救。
        - 让擅长与书记办交接的人候在开罗。能同水手配合或在港口照应落水者的人，再尽早去亚历山大。
      points:
        p1: 书记说要重抄名字，等另一位经办人来才知道写谁。你请他先把已经收到的任命和来人的说法逐条核一遍。核到日期一行时，负责交文书的人念了伊本·赫勒敦的全名。书记把原来搁在案边的任命放回当天要发出的那摞。
        p2: 港边有人喊看见了人，又在浪盖过来时丢了位置。你请岸边的人继续指向同一处，让出位置给已经出船帮忙的水手。等伊本·赫勒敦的妻女被接到岸边，守在屋口的人才问先送哪边的消息。给开罗写信的人等到她们亲自答话，才落了笔。
      outcomes:
        all: 伊本·赫勒敦按史实就任。来自港口的急信写的是家人已被接上岸，这一趟的开罗学者会等到另一份消息。
        p1: 任命照原日发出。船仍在亚历山大遇难，他的家人没能来到开罗。
        p2: 妻女在港边有人照料，能把消息带给开罗。任命脱节，回程记录只留下这段救助。
      none: 开罗的人等文书，港上的人等风停。那封报平安的信没有写出来。
      not_admitted: 等在外头的人没获准递交任命稿，船讯也还没有传进这间屋。
      desync: 本该发给伊本·赫勒敦的任命改了收件人。任命失去同步，事务所召回员工。
      excerpts:
        p1: 书记把原来搁在案边的任命放回当天要发出的那摞。
        p2: 给开罗写信的人等到她们亲自答话，才落了笔。
    relic: 一页核对过的记录
    relic_desc: 一页队伍经过的记录，页边写着看的人当时站在哪里。
    points:
      p1: 对手要把外来的人挡在法官席外时，护住他 8 月 8 日出任马立克派首席法官
      p2: 载着他妻女的船在亚历山大港沉没时，把船上的人从水里拉上来，救下她们
    points_fail:
      p1: 这条分支里，8 月 8 日的任命落到了别人头上，与历史脱了节，事务所当天召回员工。
      p2: 那条船照史实在亚历山大港沉没，船上的人无一生还，他的妻女没能到开罗。
    shift:
      p1:
        was: 1384 年 8 月 8 日，苏丹巴尔库克任命伊本·赫勒敦为开罗马立克派首席法官；城里的对手处处与他为难，第二年他就丢了这个职位。
      p2:
        was: 1384 年，载着伊本·赫勒敦妻女从突尼斯来埃及的船在亚历山大港沉没，船上的人无一生还。
        now: 船上的人在亚历山大港被救了上来。他的妻女随后到了开罗，一家人又住在了一起。
        who: ibn_khaldun_cairo
        bio: 这条时间线里，1384 年在亚历山大港沉没的那条船没有带走他的家人，妻女获救，到开罗与他团聚。
    vignettes:
      gate: '{staff}问一位编出来的书吏，人群过城门时门开了多久。书吏把时辰写在总数旁的页边，又把总数改成了估算。'
      two: 另一位编出来的见证人站在街对面。{staff}给她另腾一页纸，她说的那段街景就不必挤在书吏那张纸的边上了。
      copy: '{staff}替法庭里一个学生抄了一页《历史绪论》，行与行之间留出一指宽，给学生以后写批注。'
  taqi_al_din_istanbul:
    name: 天文台里的两声报码
    place: 伊斯坦布尔
    figure: 塔基·丁
    story: 塔基丁的伊斯坦布尔天文台在1580年1月被拆除前进行过观测。档案研究列出的仪器包括象限仪和机械钟。
    story_prose:
      opening:
        - 1580 年初，伊斯坦布尔。塔基丁和同伴在观象台观测，手稿留下他们使用多种仪器的记录。
        - 史实里，观象台在一月被撤除。在这条分支里，一位原来负责扶住读数的人，想在拆除前带走那枚他们共同用过的小部件。
        - 这趟用得上清楚什么能安全交接的人，也得能让那位助手当面说自己愿意接下哪一件。
      points:
        p1: '{staff}和助手在架旁看了两遍，最后问他愿不愿意只接下那枚平时最常读的刻度件。助手点头，拿一块旧布托住，等{staff}和他一起把它平平拿到桌面。拿起布以前，他又沿着尺边摸了一遍。手指停下来时，还压在从前报数的那一格。'
      outcomes:
        all: 助手把包好的部件带回家。以后有人来问当时怎样读数，他把布展开，先让对方看那一格。
        p1: 那件小部件没有跟着旧架散失。助手用从前的旧布把它收在桌下。
      none: 助手来过一次，又空手离开。架子原来立过的地方还留下一块颜色较浅的地面。
      not_admitted: '{staff}没有见到观象台的人。关门以后，屋里传来收木箱的声音。'
      excerpts:
        p1: 拿起布以前，他又沿着尺边摸了一遍。手指停下来时，还压在从前报数的那一格。
    relic: 一张订正对照纸
    relic_desc: 天文台记录副页，保存了原行与订正。
    points:
      p1: 撤除开始前，和使用仪器的助手取下一个带刻度的小部件，交给他们带走保管
    points_fail:
      p1: 工人到场拆除时，带刻度的部件仍在原地。原来的助手没能留住这一件。
    shift:
      p1:
        was: 1580 年 1 月，伊斯坦布尔观象台被拆除。同期诗文记下了仪器被毁。
        now: 有一件带刻度的部件留在助手手里。离开观象台后，他们还能拿它同别的造仪器的人讲解原先怎样划刻度。
    vignettes:
      clock: 哈桑读角度，莱拉抄钟上的时刻。她没听到第二次报码，下一行沿用了前一行的角度。你请两人一先一后再报一遍，他们把订正并排写在原记录旁，下一个人翻到这里就能找到。
      copy: 装订好的记录簿要送下楼，哈桑在台边还得查那次订正。你请莱拉把旧行和改行一起抄在一张纸上，注明先读的是哪一行。簿子送走后，台边还查得到这次改动的来路。
      closure: 你知道这座建筑剩下的时间已经很短。哈桑停在没有配时刻的角度上。你问他合上窗板前还能查出什么。他圈出一处空格。你走时，没再看见这间屋做下一次观测。
  ahmed_baba_timbuktu:
    name: 给补编留一个名字
    place: 廷巴克图
    figure: 艾哈迈德·巴巴
    story: 1591 年摩洛哥军队攻下廷巴克图。学者艾哈迈德·巴巴被指抗拒苏丹，1594 年被押往马拉喀什，在那里编写人物辞书，补伊本·法尔洪的旧作。1608 年他获准回到廷巴克图，1627 年 4 月 22 日在那里去世。
    story_prose:
      opening:
        - 1594 年，廷巴克图。三年前，摩洛哥军队攻下了这座城。艾哈迈德·巴巴是城里的学者，写过几十部法学和语法的书，家里有一座很大的藏书室。
        - 史实里，这一年他被指抗拒苏丹，连同家人被押着穿过撒哈拉，北上马拉喀什。藏书被收走，一说在路上散失。十四年后他获准回家，书已经不在了。在这条分支里，巷子那头有一户人家的主妇肯在床底腾出地方，院子里的抄书人还在替他的书写签条。
        - 这一趟用得上三种人：懂旧书、知道哪几箱该先救的人，胆子大、身子硬、押解那天挡得住推搡的人，懂医护、在沙漠里能替人治伤分水的人。
      outcomes:
        all: 1608 年，艾哈迈德·巴巴回到廷巴克图。邻家的主妇已经老了，她把床底的箱子拖出来，皮面上落了一层灰。他打开最上面那一卷，认出了自己的字。
        p3: 十四年后，他回到廷巴克图。那户人家把床底的几箱书抬了出来，他一卷一卷摸过去，在箱子边上坐了很久。
        p2: 一家老小都走到了马拉喀什。那个孩子的脚，到城门口时已经结了痂。
        p1: 他活着走到了马拉喀什。十四年后，他获准回家。
      none: 北去的队伍走远了。廷巴克图那间屋子的书架空着，门没有关。
      desync: 押解那天，街口一阵乱，{staff}没能挡到他身前，就被事务所召了回来。最后看见的，是人堆里一只被踩掉的鞋。
      not_admitted: '{staff}没能进那座院子。书还在架上，押解的日子已经近了。'
      points:
        p3:
          class_craft: '{staff}照修旧书的规矩，把最脆的几卷用干布隔开，皮面朝里，护舌压平，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
          class_lettered: '{staff}照着书单挑书，先拣他自己写的稿子和只此一部的抄本，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
          else: '{staff}一卷卷翻过书名，把他自己写的稿子和少见的抄本先挑出来，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
        p1: 押解那天，街上挤满了人，推搡里有人亮了刀。{staff}挡在艾哈迈德·巴巴身前，把他拉进一个门洞，用后背顶住门框。那一阵过去，他整了整衣襟，自己走了出去，身上没有伤。
        p2: 北上走了半个月，队里有人发起高烧，有个孩子脚底磨烂了。{staff}每天扎营后替人清洗伤口、换药，把水按人头分好。有一晚，那个孩子把自己的水囊递过来，里面还剩一口。
      excerpts:
        p3: 天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。
        p2: '{staff}每天扎营后替人清洗伤口、换药，把水按人头分好。有一晚，那个孩子把自己的水囊递过来，里面还剩一口。'
        p1: '{staff}挡在艾哈迈德·巴巴身前，把他拉进一个门洞，用后背顶住门框。那一阵过去，他整了整衣襟，自己走了出去，身上没有伤。'
    relic: 一部皮面手稿
    relic_desc: 一部手稿，皮面磨旧了，带一片护舌。
    points:
      p1: 押走之前，拦下冲着被捕学者来的刀兵，护住艾哈迈德·巴巴活着走上北去的路
      p2: 替在沙漠里病倒受伤的族人治伤、分水，护着一家老小不掉队
      p3: 抢在士兵收书之前，从他的藏书里救下几箱，托给城里一户人家藏好
    points_fail:
      p1: 这条分支里他没能活着离开廷巴克图，马拉喀什的人物辞书和在摩洛哥写成的二十九部书都没有了。
      p2: 路上倒下的人没人扶，这条分支里一家人北上的路和原来一样苦。
      p3: 藏书全被收走，这条分支里他十四年后回到廷巴克图，自己的书一卷也没剩下。
    shift:
      p1:
        was: 1594 年，艾哈迈德·巴巴被指抗拒苏丹，押往马拉喀什；1608 年他获准回到廷巴克图。
      p2:
        was: 1594 年，艾哈迈德·巴巴的家人与他一同被押着穿过撒哈拉北上。
        now: 同行的族人走到马拉喀什时少受了些罪。
      p3:
        was: 1594 年，他的藏书被摩洛哥人收走，另一说在北上途中散失；1608 年回到廷巴克图时，书已不在。
        now: 押走之前有几箱书被挪进城里一户人家的床底。十四年后他回到家，那户人家把箱子抬了出来。
        who: ahmed_baba_timbuktu
        bio: 1608 年艾哈迈德·巴巴回到廷巴克图，城里一户人家替他收着的几箱书还在。晚年他就用这些书教学生。
    vignettes:
      same_name: 油灯底下，{staff}发现两卷书里同一个名字有两种写法，没有挑一种，两种都记在单子上，中间画了个记号。
      courtyard: 雨季过后，{staff}把书摊在院子的阴凉里晾。泥墙的影子一点点挪，正午翻一次，让封皮干得匀。
      slip: '{staff}在窄纸条上写下每卷的书名和头一行。墨干得快，纸条塞在皮面的护舌底下，不用打开也叫得出是哪本书。'
  terence_rome:
    name: 留不住的观众
    place: 罗马
    figure: 泰伦提乌斯
    story: 泰伦提乌斯的《婆母》序言回顾演出受扰的经过，先提拳击和走绳的吸引力，再写角斗表演的消息引得人群涌来。
    story_prose:
      opening:
        - 罗马，约公元前 165 年。《婆母》的演出序言后来记下头一回上台遇到的事。开场时，台上的人还在等观众静下来。
        - 史实里，看客被别处的节目分了心，戏没演完。在这条分支里，靠台的几排人还没走，他们只是听不清现在该谁开口。
        - 这趟用得上敢在热闹里说几句话、知道什么时候该把声音交还给演员的人。
      points:
        p1: '{staff}先请前排的人坐回去，指给后面的人看台上已经站好的演员。有人还在问另一场表演何时开始，{staff}听完才请他等一句。说话的演员没提高嗓门。几个人转了头，把后面也带得静下来。 最后一句说完，最靠前的观众把手从台沿收回。等他起身，后头的人才跟着动。'
      outcomes:
        all: 收场的人来解台边的绳时，几个人仍坐着说刚才那一句。
        p1: 尾声过去了，前排的人才陆续从座位上起身。
      none: 人群往另一边涌去。台上的人把已经开口的半句收了回去。
      not_admitted: '{staff}没有挤到前排。近处有人站起来，视线里很快只剩背影。'
      excerpts:
        p1: 最后一句说完，最靠前的观众把手从台沿收回。等他起身，后头的人才跟着动。
    relic: 一副喜剧面具
    relic_desc: 一副亚麻面具，眉毛高挑，演员戴的。
    points:
      p1: 在人声压过台词时，让舞台近处的人重新听戏，帮剧团把《婆母》头一回演完
    points_fail:
      p1: 台上的声音被人声盖住了。剧团照史实提前收场，没有演到末尾。
    shift:
      p1:
        was: 公元前 165 年，《婆母》首演时，拳击和走绳的消息引起骚动，戏没能演完。
        now: 舞台近处的人重新开始听戏，剧团头一回就演到了最后一句。
        who: terence_rome
        bio: 这条分支里，泰伦提乌斯的《婆母》于公元前 165 年首演，同一天演到了结尾。
    vignettes:
      warning: 你告诉舞台帮工，两千年后还有人读到这场戏中断的事。他问后人知不知道收场时演员说到哪儿。你留下听排练，记下最后一句听清的话。正式演出还没到。
      audibility: 你靠门听，听清了一句，却漏掉了接它的那句。帮工挪了一条长凳，请你再听一遍。这回你把两句都听到了。你带回画着长凳两个位置的草图。等你退到街上，末尾的话已被街声盖住。
      bench: 你帮舞台帮工把一条长凳从门口挪开。来迟的人终于能坐下，不用叫整排人都站起来。你在木片上记下空出来的地方。临走时，门里还传着排练的声音。
  mohenjo_daro_indus:
    name: 印面和印痕，朝向各一张
    place: 摩亨佐·达罗
    figure: 印度河流域的居民
    story: 摩亨佐－达罗有刻着印度河符号的印章出土。印痕与刻制印面方向相反。
    relic: 一块练习印痕
    relic_desc: 用带不对称纹样的练习印压出的小样。
    points:
      p1: 辨出哪一张描的是印痕
      p2: 帮工提起练习印时，稳住底面
      p3: 请帮工口头说明标签，同时保留草图
    vignettes:
      mirror: 帮工把刻面抄进纸上，却当成了印痕。你放上一份新印的练习件，发现小缺口落在另一侧。他在纸签上重写了标签。你留下两面图，能说明一个记号朝哪儿，却没读出一句古文字。
      lift: 你见过馆里把印章和印痕并列的图。工台上，帮工在抬印前想辨清手里是哪个面。你请他等提起后再动两边的标签。对照留给他，第三回试印你没等到。
      pair: 你在一幅图下注「刻面」，另一幅下注「印痕」。帮工可以直接取对的那幅。你带回小小的练习印痕，真的符号仍然读不出。
  knossos_linear_a:
    name: 辨不清的一划，先记在页边
    place: 克诺索斯
    figure: 米诺斯的书吏
    story: INSCRIBE 项目登记克诺索斯出土的 KN 1 为线形文字 A 泥板。线形文字 A 仍未被读通。
    relic: 一块泥板
    relic_desc: 一块扁平的泥板，上面是一行行符号和表示数目的小记号。
    points:
      p1: 稳住练习抄板，核对一处辨不清的笔划
      p2: 观察换一个照光方向后，那一划还像不像字
      p3: 让翻译芯片帮忙对照帮工口述的标签
    vignettes:
      stroke: 仓房帮工把一道刮痕也抄进了那行记号里。你换个角度照光，把这道划痕另描在字列外，回头还能复核。你带回两幅图的区别，板上的话仍没翻出来。
      heard: 你知道以后这套文字不好读。帮工报了一只练习托盘里有什么。你把他口头报的标签另记一张，与目见的笔划分开。收队时你说得清货名是谁告诉你的，却还不能把它配进任何真实铭文。
      margin: 你先抄看清的笔划，再在边上用一点标出那处犹疑。下一位知道要重看哪里。归来只带那一个点的草图，把猜的字都留在台边。
  antikythera_rhodes:
    name: 没有留下匠人姓名的机器
    place: 罗得岛
    figure: 不知名的匠人
    story: 安提基特拉沉船出水的齿轮装置残片保留了对应天文周期的刻度和铭文。
    relic: 一枚青铜齿轮
    relic_desc: 一个带齿的小轮，因年久而发绿。
    points:
      p1: 认出练习盘上标着的那圈刻度
      p2: 分清不同圈上对应的两个周期
      p3: 让下一个读者把铭文对回刻度盘
    vignettes:
      rings: 来客嘴里念外圈的标记，手却指向了内圈。你让他转一下练习盘，只跟其中一圈走，这回他沿着同一圈念到了底。
      calendar: 一根指针回转得比来客料想的快。你问他原先数的是哪一个周期。他另画了一行，没有把两个周期挤在同一栏下。
      legend: 你给指针和它所指的位置分别做记号。来客再念一遍标签，两处终于没被叫成同一个名字。
  sappho_lesbos:
    name: 船还没走
    place: 莱斯博斯岛米蒂利尼
    figure: 萨福
    story: 《帕罗斯编年碑》记载，萨福离开米蒂利尼流亡西西里。碑文的日期有残缺，年份只能取约数。在这条分支里，她想见的人还不知道船几点开。
    story_prose:
      opening:
        - 米蒂利尼的海岸。离萨福去西西里已有几百年时，帕罗斯的一块石碑才记下这一趟远行。现在连碑上的年份也残了。
        - 史实里，萨福离开米蒂利尼流亡西西里，原因无从确知。在这条分支里，她有一位想当面道别的人，船家却已经在把行李往船上递。
        - 这趟用得上认得码头和街巷的人。知道托谁找到一个还没听到船讯的人，比催船家有用。
      points:
        p1: '{staff}把随船放行李的地方问清，托船家看着萨福的包，然后照她说的门口标记去找人。两人赶回渡口时，搬东西的人刚空出一截岸边。那人替萨福把手上松开的结系好。萨福没有把手收回去，直到船家来叫她。'
      outcomes:
        all: 船从岸边退开时，萨福抬起系绳的那只手。岸上的人一直站在下船时要踩的那块石头上。
        p1: 船从岸边退开时，萨福抬起系绳的那只手。岸上的人一直站在下船时要踩的那块石头上。
      none: 船先走了。等那人找到渡口时，留在石上的只是一截浸湿的缆绳。
      not_admitted: '{staff}到了岸边，没能找到认识萨福的人。有人蹲在最末一级石阶上，把手里的绳理直。'
      excerpts:
        p1: 那人替萨福把手上松开的结系好。萨福没有把手收回去，直到船家来叫她。
    relic: 一根打过结的绳
    relic_desc: 分支里的绳，和她一起等船的人系在手上。
    points:
      p1: 在去西西里的船出发前，把萨福想见的人带到渡口
    points_fail:
      p1: 船离岸以前，员工没能把萨福请来道别的人带到。
    shift:
      p1:
        was: 约公元前七世纪末至六世纪初，《帕罗斯编年碑》记萨福自米蒂利尼渡海流亡西西里。
        now: '{staff}带着萨福托找的人走到渡口。上船前，两个人还有时间当面道别。'
        who: sappho_lesbos
        bio: 离开米蒂利尼去西西里以前，萨福有机会和她想见的人当面道别。
  aristarchus_alexandria:
    name: 纸上的三度差
    place: 亚历山大
    figure: 阿利斯塔克斯
    story: 阿里斯塔克斯在《论日月的大小与距离》中，取半月时所见日月夹角比直角少三度。第七命题由此推得日地距离介于月地距离的十八与二十倍之间。
    relic: 一块日晷板
    relic_desc: 一块青铜板，刻着时辰和节气的线。
    points:
      p1: 描三角形前先辨清观测者所在的角
      p2: 对照完成前，让两条视线一直留在同一张纸上
      p3: 说清结果的哪一处依赖所取的角度
    vignettes:
      angle: 学算人把观测者所在的角画成了直角。你标出望向半月和太阳的两条线，在这个角上补回差的三度。图与它用的前提终于对上。你两样都记走，却不能把它们当成今天量得的距离。
      limit: 你知道夹角越接近直角，那一点估计就越要紧。学算人问他只挪一道线，怎么答案就变了。你另画一张，先前那张也留着。还没能把图拿去跟天象对照，你便收队。
      page: 你把前提写在结果旁才折纸。学算人还能看出这个估计从哪一笔起。你自己的副本留好了角度，下一回半月却没留下实测。
  hipparchus_rhodes:
    name: 今夜亲眼再看一次
    place: 罗得岛
    figure: 喜帕恰斯
    story: 喜帕恰斯留下的评注指出，一首流传很广的观星诗里有失准之处。在这条分支里，一位读者准备照诗里写的星位教给别人。
    story_prose:
      opening:
        - 约公元前二世纪末，罗得岛。观星的人读诗，也靠它记哪几颗星会一道升起。喜帕恰斯后来留下的评注逐处核这类说法。
        - 史实里，评注指出熟读的诗句有些与观察不合。在这条分支里，一位读者已经把其中一句教给学生，准备照原话再讲一次。
        - 这趟用得上能明白书里说法的人。还得说得动一个已经讲过这堂课的人，再到外面多等一会儿。
      points:
        p1: '{staff}请那位读者把准备教的一句读一遍，再陪他和喜帕恰斯走到能看清低处的地方。第一处星光露出时，读者抬手想说就是这两颗，话到一半停了。另一个位置还是黑的。他用指头空指着那里，等到第二颗出来才把手放下。'
      outcomes:
        all: 下次教学生，他先把书合上，请大家等第一颗升起来。念到那句熟诗时，他把后半句留到下一道光出现。
        p1: 下次教学生，他先把书合上，请大家等第一颗升起来。念到那句熟诗时，他把后半句留到下一道光出现。
      none: 那人照旧读完了那句诗。屋门已经合上，第二颗星才从外面低处露出。
      not_admitted: '{staff}没能见到那位读者，只听见有人隔门背诵一句，念了两遍。'
      excerpts:
        p1: 另一个位置还是黑的。他用指头空指着那里，等到第二颗出来才把手放下。
    relic: 地平线上的两道刻记
    relic_desc: 分支里的观测纸条，两道刻记分别记下两次升起。
    points:
      p1: 说服那位读者和喜帕恰斯同看一夜，再决定怎么教那两处星位
    points_fail:
      p1: 员工没能说服那位读者留下来对照一夜。
    shift:
      p1:
        was: 约公元前二世纪末，喜帕恰斯在评注中指出，常读的观星诗里有些并写的星并不同时升起。
        now: '{staff}请那位读者重新来观测一夜。读者分开看到两次升起，改了原本要教给学生的说法。'
        who: hipparchus_rhodes
        bio: 一位用旧诗教观星的读者亲自复核了有争议的星位，把修正后的观察教给学生。
  heron_alexandria:
    name: 字旁边那一幅图
    place: 亚历山大
    figure: 希罗
    story: 希罗在《机械学》中写到怎样用器械搬动重物。希腊文原著只留下残篇，完整内容见于阿拉伯译本。派遣年份约为公元 62 年，作坊情节由游戏虚构。
    story_prose:
      opening:
        - 约公元 62 年，亚历山大港。希罗的《机械学》讲怎样借器械搬动重物，原著用希腊文写成。
        - 史实里，希腊原文只存残篇，全书由阿拉伯译本保存下来。在这条分支里，一份抄本还等着核图，作坊里有人愿意把校好的那份另存一处。
        - 这趟用得上能看懂图和字怎样对在一起的人，也需要有人办得妥一卷书的交接。
      points:
        p1: '{staff}把抄本挪到作坊里光足的那张凳上，请希罗看两处画得同样长的线。原来其中一处要跟着另一页读。抄写人照着原页把记号改好，先让来领卷的人也试着找了一遍。 那人把卷带到门外才重新摊开。他找到刚才改过的那一处，把指尖停在那里。'
      outcomes:
        all: 另存的那一份没再和工坊的卷册放回同一架。日后借出时，领卷的人还能按相同的记号回到那页。
        p1: 领卷的人走前将它单独系好。架上的旧卷留在工坊，那份校过的已经出了门。
      none: 抄本还是和旧卷待在一处。关门前，没能领走的人把手收了回去。
      not_admitted: '{staff}没能进作坊。在门外还能听见有人把凳子拉到亮处。'
      excerpts:
        p1: 那人把卷带到门外才重新摊开。他找到刚才改过的那一处，把指尖停在那里。
    relic: 标过的模型门槛
    relic_desc: 工坊的模型零件，在门曾蹭到的位置留了一道刻痕。
    points:
      p1: 帮希罗给《机械学》的一份希腊文抄本核清插图，把它与工坊的卷册分开放
    points_fail:
      p1: 作坊还是只把卷册留在自己手里。这条分支和史实一样，希腊文字只存残篇，阿拉伯译本保住了全书。
    shift:
      p1:
        was: 公元一世纪，希罗用希腊文写成《机械学》。希腊文只存残篇，古斯塔·伊本·卢加的阿拉伯译本留下了全书。
        now: 核过图文的希腊文副本存在工坊以外的地方。这条分支里，后世读者还能读到这一份。
        who: heron_alexandria
        bio: 这条分支里，《机械学》的一份完整希腊文抄本与阿拉伯译本一同传到后世。
    vignettes:
      threshold: 尼卡诺尔把模型架上台，门往回收时差一指宽闭合。你标出摩擦的地方。模型底下卡了片扁豆皮，他把它扫出来。门终于关严，他请你留住记号，好叫他下次认得出这处。
      audience: 贝勒尼刻看见门往外打开，已经去拿披风。你请她再等一会儿，盯紧远侧的边。门回来时，她看见尼卡诺尔漏掉的一线亮光。他把模型留在台上再试一次，没急着交货。
      future: 你可以告诉尼卡诺尔，后世读者会把这几页同机器的图画摆在一起。他正等模型门咔哒一响，轻轻落定。你跟他一起听。离开时，他正叫客人回来看她错过的那一下。
  pliny_stabiae:
    name: 斯塔比亚的逆风
    place: 斯塔比亚
    figure: 老普林尼
    story: 公元79年火山喷发时，老普林尼抵达斯塔比亚，找到庞波尼安努斯。小普林尼后来写信告诉塔西佗，送舅舅进来的风也让装好东西的船无法离港。
    story_prose:
      opening:
        - 公元 79 年，海湾上空冒出一片云。后来小普林尼写信给塔西佗，说舅舅接到求助，乘船出了港。
        - 史实里，老普林尼来到斯塔比亚，见到庞波尼阿努斯，后来没能从海滩活着回来。在这条分支里，船有机会比原来更靠近雷克蒂娜求助的那片岸，也有机会把老普林尼从岸边带走。
        - 这趟需要认得海岸和船路的人。到了岸上，还需要带着对路装备、能照顾呼吸困难的人。
      points:
        p3: '{staff}在海滩边跟到老普林尼身旁，拿出带来的防护装备，再请身边的人给他让出一条能走的路。脚下的灰被来去的人踩实，几个人停了一次，等他喘过来才走。 到能坐下的地方，他伸手把同伴肩上的碎石拨掉。靠岸的船还在响。'
        p2: 岸边同来的几个人都想把船掉头。{staff}先问谁认得庞波尼阿努斯住处，再请那个人站到能看见岸边的地方指路。船终于找到能下去的地方。 庞波尼阿努斯来接时，老普林尼手里还有一截没有放开的绳。他把它递回船边，才踏到地面。
        p1: '{staff}问清哪片浅水还能接近，和船上的人一起为雷克蒂娜留出可以抓住的位置。她先把手里的东西往上递，没等拿稳就放开了。 船上的人把她拉上来以后，她自己把湿手按在空出的座位上。有人这才拾起她递来的东西。'
      outcomes:
        all: 离开那片岸以后，有人把雷克蒂娜递来的东西放到干处。老普林尼在另一边歇着，船上终于腾出了一段能走动的地方。
        p3: 回来的船上给老普林尼腾出干的一角。支撑他坐稳的人，一直等他自己把手放下。
        p2: 老普林尼确实到了庞波尼阿努斯家里。随船来的那点碎石，在门前鞋底上掉了一路。
        p1: 雷克蒂娜上船以后留在一处空位。拿回她交出的包时，她还没有换掉湿衣。
      none: 停船的地方看不见更远的海岸了。下过水的人都在等一声新的招呼。
      not_admitted: '{staff}没能上那条船。岸边有人挣了一下绳，船头便慢慢偏开。'
      desync: 船没能到斯塔比亚。事务所召回{staff}时，庞波尼阿努斯还没见到老普林尼。
      excerpts:
        p3: 到能坐下的地方，他伸手把同伴肩上的碎石拨掉。靠岸的船还在响。
        p2: 庞波尼阿努斯来接时，老普林尼手里还有一截没有放开的绳。他把它递回船边，才踏到地面。
        p1: 船上的人把她拉上来以后，她自己把湿手按在空出的座位上。有人这才拾起她递来的东西。
    relic: 一块蜡板
    relic_desc: 一块涂蜡的木板，用尖笔划出笔记。
    points:
      p1: 浅滩和山上落下的碎石挡住海岸时，帮老普林尼把船靠上雷克蒂娜那片海岸，把她接上船
      p2: 浮石和碎石砸向船身时，护住老普林尼的船一路驶向斯塔比亚，让他上岸见到庞波尼阿努斯
      p3: 硫磺气味和烟尘压到斯塔比亚的海滩上时，替他护住呼吸，救下老普林尼，让他活着离开海滩
    points_fail:
      p1: 船没能靠上她那片海岸，这条分支里没有人把雷克蒂娜接上船。
      p2: 船在斯塔比亚之前被逼回，老普林尼没有见到庞波尼阿努斯。分支与历史脱了节，事务所因同步失败召回员工。
      p3: 他照史实倒在斯塔比亚的海滩上，这条分支里也没能留住他。
    shift:
      p1:
        was: 公元 79 年，雷克蒂娜来信求救，老普林尼改了计划出海。小普林尼记下海岸受阻及船驶向斯塔比亚的经过，没有交代雷克蒂娜的下落。
        now: 船靠上了她那片海岸，雷克蒂娜被接上船，随船到了斯塔比亚。
      p2:
        was: 小普林尼后来写信告诉塔西佗，舅舅乘顺风到斯塔比亚见到庞波尼阿努斯，同一阵风挡住了船离岸。
      p3:
        was: 第二天硫磺气味和火光逼近，老普林尼在斯塔比亚的海滩上由两名奴隶扶起，随即倒下；小普林尼信里说是浓重的烟尘堵住了他的呼吸。两天后遗体在原处找到。
        now: '{staff}替他挡住了烟尘，扶他离开海滩。风转向以后，他随船回到米塞努姆，又活了些年。'
        who: pliny_stabiae
        bio: 这条时间线里，老普林尼从斯塔比亚的海滩上活着回来。他回到米塞努姆的舰队，又过了些年。
    vignettes:
      wind: 克里斯普斯把搬上船的木箱全记成了已离开。你们从门边看见第一位来客肩上带灰走进来，装好东西的船却还看得见。克里斯普斯划掉了已离开几个字，请你给下一位进门的人在蜡板上留一行。
      lantern: 灯快熄了，普丽玛只来得及穿过屋子一次。你替她守在门边，她点数还能看见的人。先看不清的是蜡板，她大声念出最后两个名字，你一个个应回去。
      letter: 你记得多年后寄出的那封信。普丽玛问的却是拿名单的人，那封信里找不到他的名字。你把知道的明早结局搁在一旁，帮她点完人。离开时，还能听到有人沿走廊走过来。
  galen_rome:
    name: 火后还在的书名
    place: 罗马
    figure: 盖伦
    story: 盖伦在《论免于忧苦》中叙述罗马192年火灾给自己的藏书和物品带来的损失，也叙说哪些书在他看来已经无从补回。
    story_prose:
      opening:
        - 192 年，罗马。盖伦把一些卷册送往坎帕尼亚，也有书和物件放在罗马的仓间。后来，他在《论免于忧苦》里分开回忆了这些东西。
        - 史实里，火灾烧掉一批藏书，其中有他认为再找不到的词汇手稿。在这条分支里，一批货先走，正好有人可以在装货前和他一起再看一遍。
        - 这趟用得上知道两批书各该去何处的人。还有人须把工坊里能重做和难重做的物件分开问清。
      points:
        p3: '{staff}把那部喜剧词汇手稿从罗马仓间的单子里挑出来，请盖伦再看一次他原先写的收处。盖伦翻到常查的一页，合上以后，让先行的装货人把它放进给坎帕尼亚的那批。 装货人刚要合盖，盖伦又把手伸进去，把卷上的系带翻过来，免得它压在底下。'
        p2: 仓间还没收走所有器械。{staff}先问工匠哪件日后最难重做，请他留在工作台旁做第二份样。工匠等蜡变硬，在底下写了一笔记号。 有人来催着收桌，工匠没把它递出去。他把第二份放在抽屉最里面。
        p1: '{staff}把两张送货单分开，请先行的装货人照着坎帕尼亚那张重念一遍。有人拿起差点放进罗马那堆的卷，等盖伦确认，才把它放回先走的货里。 捆好之前，装货人把目的地重新写在最上面。另一个人把空出来的绳头绕过箱角。'
      outcomes:
        all: 先行的书后来能够借来。有人顺着标签读到那份喜剧词汇，工坊里也还能找出自己留下的蜡样。
        p3: 那份手稿随先走的货离开城里，卷带朝上。以后有人要找，第一眼就知道是哪件。
        p2: 工匠日后重做那件东西前，先去把自己的抽屉打开，找出试样。
        p1: 该先走的卷还是先走。罗马仓间的那张单子留在原处。
      none: 先走的货已经装完。没有赶上的卷仍照原来的去处收着。
      not_admitted: '{staff}没见到负责装货的人。搬运的脚步声从仓门里慢慢远了。'
      desync: 本来先走的卷并入罗马仓间。事务所召回{staff}时，旧单上那道误抄的墨还没干。
      excerpts:
        p3: 装货人刚要合盖，盖伦又把手伸进去，把卷上的系带翻过来，免得它压在底下。
        p2: 有人来催着收桌，工匠没把它递出去。他把第二份放在抽屉最里面。
        p1: 捆好之前，装货人把目的地重新写在最上面。另一个人把空出来的绳头绕过箱角。
    relic: 一页书目
    relic_desc: 书目，有个书名依然可读，存卷一栏留空。
    points:
      p1: 先为要送往坎帕尼亚的散文词语卷留好运送位置，让这批书能照原计划先发
      p2: 器械入仓前，请工匠替一件难补的器械再做一个蜡样，留在工坊
      p3: 趁先发的书还没装完，说服盖伦让旧喜剧词语手稿随同这批书离城
    points_fail:
      p1: 书卷错收进罗马的仓房，旧时已经运走的那批也在火里失去。行程同步失败，员工被召回。
      p2: 火后要重做器械，工匠手上没有留下的样件可对。
      p3: 那批手稿仍要等夏初才发运，来不及躲过这场火。
    shift:
      p1:
        was: 公元 192 年冬末罗马起火时，盖伦说那批散文作家词语汇编已经运往坎帕尼亚。
      p2:
        was: 公元 192 年，盖伦存放在罗马仓房的器械随火灾毁坏，其中有他自己设计的器械。
        now: 另做的蜡样留在工坊。火灾之后，盖伦还能凭这个样件请工匠重做那件器械。
      p3:
        was: 公元 192 年冬末，盖伦编的旧喜剧词语手稿在罗马仓房的火灾中烧毁。
        now: '{staff}让这批卷子随先发的书运走，盖伦回到罗马后能凭副本继续修订。后来另有一份抄本交给外地的藏书处。'
        who: galen_rome
        bio: 盖伦的旧喜剧词语汇编在火灾中留有副本。他继续核订其中的引文，并把另一份交给外地读者查阅。
    vignettes:
      list: 特尔提娅念了三个书名，就记下有三卷。你请她在桌上一本本摸到相应的卷，只摸到两卷。你们把第三个书名留着，在存卷一栏做了个空记。
      borrow: 狄翁记得借出过一份，却想不起借给了谁。特尔提娅想趁清单还没送走，把书名划掉。你帮他想起交书的那扇门。她在清单里留了一处空位，等那条街传来回话。
      survival: 你读过一部写这场损失的书，传本在很久以后才重新被认出来。狄翁只问，明天桌上能放哪本。你留着书目里的名字，把现有两卷指给他看。你走时，还没找到缺掉的那卷。
  ovid_tomis:
    name: 诗与空着的一行
    place: 托米
    figure: 奥维德
    story: 奥维德在《哀歌》第二卷把获罪的缘由写成一首诗和一个过失，接着避谈那个过失。
    story_prose:
      opening:
        - 奥维德在黑海边的托米斯流放。《哀歌》第二卷说他因一首诗和一个过失获罪，没有把那个过失写出来。
        - 史实里，第三卷留有他卧病时写的一首诗，作品后来流传下来。在这条分支里，有几天他连水都喝不惯，整理好的稿件还找不到能往外捎的船。
        - 这趟需要愿意照看病人的人，也需要认得海路、肯和出行的人问清能把纸件带到哪里的人。
      points:
        p2: '{staff}约到一个熟悉冬季行程的船客，先问他离开托米斯以后会在哪一站交给下一位，再请奥维德把名字写在能看见的地方。船客把里外两层包纸分别压平。 开船以前，他把写着地址的一面翻出来，让岸上的人再看一次。奥维德隔着船帮点了点头。'
        p1: '{staff}问他什么样的饭还吃得下，向邻里找来一小份，又把可以喝的水放在床旁。奥维德想伸手拿稿子时，{staff}把杯往他手边推了一下。 他先喝水，过了一会儿才把那一页拿过来。横过纸角的杯影缩成很小一片。'
      outcomes:
        all: 载稿的人已经出了港。屋里的人把床边的水换过一次，奥维德又拿出一张空纸来。
        p2: 船客带着诗卷离开前，到岸边把去向说了一遍。奥维德一直听到最后一站。
        p1: 一天里他有了几段可以安静躺着的时候。床边能喝的水始终没断。
      none: 船只停在背风的一边，等不到出港的消息。托人带的纸还放在桌角。
      not_admitted: '{staff}没遇上能带他进屋的人。门边那碗水放了很久，沿口落进一片叶子。'
      desync: 诗没人肯带走。事务所召回{staff}时，写好去处的纸仍包在外层。
      excerpts:
        p2: 开船以前，他把写着地址的一面翻出来，让岸上的人再看一次。奥维德隔着船帮点了点头。
        p1: 他先喝水，过了一会儿才把那一页拿过来。横过纸角的杯影缩成很小一片。
    relic: 一块写字蜡板
    relic_desc: 一块板，上面是流放路上起笔的诗体书信。
    points:
      p1: 奥维德在托米斯病倒，没有医生、没有合用的吃食、水喝不惯，照看他把病养好
      p2: 托米斯冬季难以通行时，为《哀歌》第三卷找到能把它捎去罗马的人
    points_fail:
      p1: 他病中无人照看，这条分支里他在托米斯的头几个月和他诗里写的一样难熬。
      p2: 这条分支里，没人把诗卷带上路，诗卷没有及时到达罗马。行程同步失败，事务所召回员工。
    shift:
      p1:
        was: 公元 9 年前后，奥维德在托米斯病倒，他在《哀歌》第三卷第三首里写，这里没有医生，没有合用的吃食，水也喝不惯。
        now: '{staff}给他找来干净的水和吃得下的东西，在他发热的日子里守着。他比原来早些下了床。'
      p2:
        was: 公元 9 至 10 年前后，奥维德在流放中写下《哀歌》第三卷。开篇从书到达罗马写起，卷中也写到当地冬季行路困难。
    vignettes:
      rumor: 你告诉捎信人，几个世纪以后还有人追问那个过失。他指指抄本空出来的地方，问该写些什么。你把目的地添在封套上，把空处留在正文里。人带着这份说不清的稿子走了。
      verify: 捎信人记得一个多了人名的版本。你请他指出是哪张纸上的。他能指出那首诗和那个过失，往后便指不出什么了。你在自己的蜡板上记下断在这里。抄本启程时，你仍然没得到那个名字。
      wrap: 捎信人伸手时，风掀起外面一页。你给散页编上号，照原样收好。蜡板上只给自己留了一句提醒，那行没解释的照原样抄。收信人读到这里是什么反应，你没能看见。
  empedocles_akragas:
    name: 合唱从哪句分开
    place: 阿克拉加斯
    figure: 恩培多克勒
    story: 恩培多克勒的诗歌残篇写到四根，以及爱与争引起的聚合和分离。远在后世，第欧根尼·拉尔修收录了互相矛盾的死因传说。
    story_prose:
      opening:
        - 约公元前五世纪中叶，阿克拉加斯。恩培多克勒的诗用四种根来解释事物在一起时怎样成为一体、怎样又分开。
        - 史实里，长诗后来只存残篇和别人引过的句子。在这条分支里，一名抄写人愿意多写一份，另一个地方也有人愿意收下。
        - 这趟用得上能听出抄本里哪一句接不上、确认以后还找得到它的人。
      points:
        p1: '{staff}从头跟抄写人读了一遍，在一处两个人都读快了的地方请他先停手。恩培多克勒把那两句慢一点念开，等抄完再读回给他听。待到第二天，{staff}陪领抄本的人核了头尾。 两卷不再用同一根绳捆着。领卷的人拿起单独系好的那一份，先把它的头一句低声念了一次。'
      outcomes:
        all: 另收的一份没有和原卷同进同出。后来有人来请教那几句，保管者没等别人送来卷子，自己就拿了出来。
        p1: 领走的人把新卷放在自己可以打开的地方。原先那卷仍留在写字的人桌边。
      none: 抄本开头几行还没有接上。收工时，念过一遍的人把卷留在了原处。
      not_admitted: '{staff}没赶上抄写的人开门。有人从隔墙念出一句，听近了才知道是在重读旧卷。'
      excerpts:
        p1: 两卷不再用同一根绳捆着。领卷的人拿起单独系好的那一份，先把它的头一句低声念了一次。
    relic: 一片诗稿
    relic_desc: 排练用的纸莎草条，在诗句的两处转折做过记号。
    points:
      p1: 帮抄写人核全《论自然》的一份抄本，把这一份另找地方存下
    points_fail:
      p1: 这条分支里，后人也只能从后世的引文和纸草残片中读到长诗的一部分。
    shift:
      p1:
        was: 公元前五世纪，恩培多克勒把自己的学说写进诗中。《论自然》传下来的只有引文和纸草残篇，包括 1999 年刊布的斯特拉斯堡藏片。
        now: 这份抄本核过全文，由另一名读者带走保管。这条分支里，后人还能找到整首诗。
        who: empedocles_akragas
        bio: IF 线里，恩培多克勒的《论自然》完整传了下来，后人能从第一行读到最后一行，看他怎样讲四根和爱与争。
    vignettes:
      cue: 法翁只记住声音最高的一句，结果两个人同时起了头。你在意思转折的两处做记号。到头一处，两人把凳子挪近，到了第二处，各退一步。这回面朝门的读者不用看稿，也知道念到哪儿。
      handoff: 埃瑞涅能念到第二段，却总是一下跳到末尾。法翁说他一个人念完算了。你请她给第一个提示，让法翁在屋子另一边接腔。喊开饭时，收住这一遍的是她，终于没有半途离开。
      sandal: 法翁问后人会记住哪个故事。你差点说起后来那则埃特纳传说里的铜鞋。他想要的是明天还能练的一句。你收住铜鞋的话，陪他把没念完的那段再走一遍。再想去找埃瑞涅，凳子已经叠起来了。
  democritus_abdera:
    name: 两块陶片之间
    place: 阿布德拉
    figure: 德谟克利特
    story: 亚里士多德《形而上学》把实与虚空、形状与次序及方位等观点归于留基伯和德谟克利特，并拿字母作比。
    relic: 两块字母陶片
    relic_desc: 习作中用来比较次序的两件道具。
    points:
      p1: 不动字形，只交换两块陶片的次序
      p2: 换一只留出空位的托盘再排一遍
      p3: 陶片装回袋前，抄下两种排法
    vignettes:
      order: 欧克勒斯摆出形状各异的陶片，把每种变化都叫变形。你只交换阿尔法和纽的位置。他照样叫得出每一块的名字，陶片也还嵌得进原来的轮廓，抄出来的一行却变了。
      gap: 多丽丝把窄盘塞得满满的，想少跑一趟。你请她先放一片在桌上，再让别的陶片顺着腾出的空格滑过去。第二趟她特意保留一格。这个空位如今也是演示的一部分。
      atom: 你开口讲后世实验室里什么叫原子。欧克勒斯问，这个词能不能解释那行陶片为什么读起来变了。你擦掉题外话，帮他画下陶片的次序。多丽丝已把托盘收走，最后那个角度来不及再核对一次。
  hildegard_bingen:
    name: 没唱出声的开头
    place: 宾根
    figure: 宾根的希尔德加德
    story: 一场安葬争议使希尔德加德住处的歌声停了下来。她写信给美因茨，谈到歌唱对身边人的意义。限制于 1179 年 3 月解除。留存的文集里，还看得见鲁珀茨贝格抄写人的工作。
    story_prose:
      opening:
        - 十二世纪末，宾根附近。希尔德加德的书信和谱页流传下来，也留下好几个人同她一起校抄的痕迹。
        - 史实里，一场安葬争议使歌声中断，限制到次年三月才解除。在这条分支里，一页练习用过许多次，第一个字上方磨得不太看得清。
        - 这趟用得上懂歌谱或抄本的人，还要能留着那处不确定的记号，等曾唱过的人自己辨认。
      points:
        p1: '{staff}请抄写的人先不要补那个淡下去的记号，把旧页和副页铺开，让希尔德加德和一位熟悉唱法的人分别看。两个人都能认出后面那一处，开头却还得再问。 抄写人把确认的部分落到纸上。到第一个字时，她把那一点空白留得比分别两行的空隙还宽。'
      outcomes:
        all: 限制解除以后，有人拿着副页来对第一句。她的手在那处空白停住，熟悉旧页的人便到她旁边来。
        p1: 下回翻出副页时，还能看出哪一处是照旧页抄下的，哪一处得找人再问。
      none: 副页照旧收起来。第一个字的上面有一点白，谁也没把它与旧页放在一处核。
      not_admitted: '{staff}没进抄写的房间。门边有人合上一卷谱，先把木凳扶回原处。'
      excerpts:
        p1: 抄写人把确认的部分落到纸上。到第一个字时，她把那一点空白留得比分别两行的空隙还宽。
    relic: 一页有记号的练习稿
    relic_desc: 练习页，一根夹线标明起句。
    points:
      p1: 趁屋里安静，请希尔德加德和抄写人辨认旧页上的磨损处，把辨不清的记号注明在副页上
    points_fail:
      p1: 副页先收起来了。第一个字上面仍留着白，下一个读到的人还得问旧页怎么写。
    shift:
      p1:
        was: 希尔德加德在信中谈到歌唱中断。鲁珀茨贝格的抄写人也为她留下了文章和曲谱。
        now: 这条分支里，{staff}把旧页和副页并排留下。抄写人一眼就能看出哪些记号已经读清，哪些还要再看。
    vignettes:
      opening: 阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。
      wait: 阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。
      return: 你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。
  nezahualcoyotl_texcoco:
    name: 歌旁写着的名字
    place: 特斯科科
    figure: 内萨瓦尔科约特尔
    story: 内萨瓦尔科约特尔 1431 年成为特斯科科之主，统治到 1472 年去世。人们记得他是诗人，也是营造者，据说横贯特斯科科湖的一道长堤是他规划的。十六世纪收集的纳瓦特尔语歌谣里，有一些和他的名字连在一起，但是否出自他手，已无法确定。
    story_prose:
      opening:
        - 1472 年，特斯科科。内萨瓦尔科约特尔做这座城的主人已经四十一年，七十岁上下了。人们记得他是诗人，也是营造者，据说横贯特斯科科湖、把湖水分开的那道长堤，就是他规划的。
        - 史实里，他在这一年去世，七岁的儿子内萨瓦尔皮利被推举继位；与他名字连在一起的歌，一百来年后才抄进一部歌集，最初是谁唱的，已经没人知道。在这条分支里，宫里有个会唱那几首歌的老歌者，要把歌教给一位学徒，排练时还有个歌者给接唱的人留提示，有个帮工管着练习稿的先后。
        - 这一趟用得上几种人：守得住夜、胆子大或身子极结实的人，带着睡眠调节器也行，在人心不定的那几天护得住一个孩子；教过书、懂音乐，或有耐心、有条理，带着录音笔也行，一句一句学得全的人；性子安静、肯陪着人，会照护病人，或带着全息投影仪的人，在他最后的日子里坐得住。
      outcomes:
        all: 这年，七岁的内萨瓦尔皮利被推举为特斯科科之主。那几首歌从头到尾传了下去，学徒后来又教给了自己的徒弟。一百来年后，它们被抄进一部歌集，写在他的名下。
        p3: 这年，内萨瓦尔科约特尔在特斯科科去世。一百来年后，与他名字连在一起的歌被抄进一部歌集；五百多年后，墨西哥的百元钞票上印着他的脸。
        p2: 那位学徒把几首歌唱熟了，后来又教给了自己的徒弟。一百来年后，这些歌被抄进一部歌集，歌旁写着他的名字。
        p1: 七岁的内萨瓦尔皮利被推举为特斯科科之主，后来在这个位子上坐了四十多年。
      none: 这年，内萨瓦尔科约特尔在特斯科科去世。老歌者病倒时，那几首歌还没有教完，练习纸的后半截空着；推举那天，宫里没有等来那个七岁的孩子。
      desync: 他去世后的那几夜，门槛边上没有人守着。{staff}被召回时，推举的日子还没到，孩子住过的那间屋子空着，席子卷起来靠在墙角。
      not_admitted: '{staff}没能进宫，只在城里听见歌者们练唱。一位歌者唱完一句，退回去，给接唱的人留出位置；唱的是谁的歌，听的人各说各的。'
      points:
        p2:
          class_teaching: 这一年，宫里的老歌者已经唱不了太久，一首歌唱到一半就要停下来喘口气。他要把那几首和内萨瓦尔科约特尔名字连在一起的歌，教给宫里一位学徒。{staff}教过书，让学徒一句一句跟着念，念熟一句再接下一句，每天收工前从头背一遍，背错的地方在练习纸边上点一个记号。最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。
          else: 这一年，宫里的老歌者已经唱不了太久，一首歌唱到一半就要停下来喘口气。他要把那几首和内萨瓦尔科约特尔名字连在一起的歌，教给宫里一位学徒。{staff}耐着性子坐在一旁，老歌者唱一句，就让学徒跟一句，跟不上的地方请老人再唱一遍，一遍不行就两遍。最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。
        p3:
          class_medical: 他最后的日子里，屋里来来去去的人都放轻了脚步。{staff}会照护病人，替他掖好盖毯，扶着他喝水，等屋里只剩下他们两个，才坐近了，慢慢说起以后的事。一百来年后，有人会把和他名字连在一起的歌一首首抄进书里。五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。
          else: 他最后的日子里，屋里来来去去的人都放轻了脚步。{staff}在他身边坐了一个下午，等屋里只剩下他们两个，才慢慢说起以后的事。一百来年后，有人会把和他名字连在一起的歌一首首抄进书里。五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。
        p1: 他去世后的那几天，贵族们聚在一起商量由谁继位，宫里进进出出的人一天比一天多。七岁的内萨瓦尔皮利被人领着，从一间屋子走到另一间屋子。{staff}守在他住的屋外，夜里也不走开，生人来了先拦下问清楚，孩子睡着了，才在门槛边上坐下来。推举那天早上，孩子被大人牵着走出屋门，衣角在门槛上蹭了一下。门槛边那块坐了几夜的地方，已经磨出了一片浅印。
      excerpts:
        p3: 五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。
        p2: 最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。
        p1: 推举那天早上，孩子被大人牵着走出屋门，衣角在门槛上蹭了一下。门槛边那块坐了几夜的地方，已经磨出了一片浅印。
    relic: 一张接唱提示纸
    relic_desc: 接唱纸，分开给两种名字留了位置。
    points:
      p1: 他去世后贵族推举继承人的那几天，护住七岁的内萨瓦尔皮利
      p2: 帮宫里的一位学徒把与他名字连在一起的那几首歌，从老歌者那里一句不落地学全
      p3: 在他最后的日子里，让他知道五百多年后人们还记得他的名字
    points_fail:
      p1: 推举之前孩子出了事，这条分支里特斯科科没有照史实迎来七岁的新主。
      p2: 老歌者病倒前没教完，这条分支里那几首歌照旧只传下来一部分。
      p3: 他照史实在 1472 年去世，这条分支里，他到最后也不知道后人会记得他。
    shift:
      p1:
        was: 1472 年内萨瓦尔科约特尔去世，七岁的内萨瓦尔皮利被推举继位。
      p2:
        was: 十六世纪后期，写在他名下的一些歌被抄进歌集，最初是谁唱的，没人知道。
        now: 那位学徒把几首歌从头到尾学全，后来又教给了自己的徒弟。
      p3:
        was: 1472 年内萨瓦尔科约特尔在特斯科科去世；与他名字连在一起的歌一百来年后才抄进歌集，墨西哥的百元钞票印他的像，是五百多年以后的事。
        now: '{staff}在他最后的日子里坐在他身边，把这些告诉了他。'
    vignettes:
      voice: 一位歌者唱到以“我”开头的那句走上前来，鼓声停了半拍。{staff}在练习纸上留了两处，一处记唱的人，一处记歌里念的名字。
      drum: '{staff}放了一条边角纸作记号，头一位歌者起身时，纸页仍留在下一位够得着的地方，帮工又把它们按次序码齐。'
      later: '{staff}记下这一句是从哪位歌者那里听来的，至于最初是谁作的，留着没写，那一格空在纸上。'
  maya_codices_mani:
    name: 记住书页怎样折
    place: 马尼
    figure: 玛雅书吏
    story: 1562 年 7 月 12 日，殖民当局在马尼公开焚烧玛雅书籍和其他器物。玛雅社群继续创造和传承知识。西班牙征服之前制作的折页书，今天只存下少数几部。
    story_prose:
      opening:
        - 尤卡坦的马尼。守书人把一本折页书横放在席上，翻到小孩曾跟着读的一页。邻村来客说自己今天要回去，出门前问她愿不愿把一本交到他手里。
        - 1562 年 7 月，马尼发生了有记录的焚书。幸存的玛雅抄本保留文字和图像，不能确定某个现存抄本就在这里。这个分支写一位虚构的守书人替自己手里的一本书选保管人。
        - 找愿意听守书人介绍书页的人。她若同意交托，就按她说的折法把书合起来，再当面问接书人要怎样让后来的人看得到。
      points:
        p1: 守书人打开第二折，指着一处过去看错过的页边。你请接书人照她翻的方向读一次，让她确认两个人能在同一处停下。她把这一册从其他书旁抽出来，用旧布裹好，亲手递过席子。接书人接稳后仍坐在那里，等她把最后一折的记号说明。
      outcomes:
        all: 有一册到了守书人选定的地方。马尼的焚书仍发生，这份虚构分支只存下她亲自交出的那一本。
        p1: 接书人走时把包布抱在身前。等书再打开，照她讲过的法子能找回第二折。
      none: 熟识的读者空手离开。守书人把书摊开又收起，仍须决定先放在哪里。
      not_admitted: 守书人没同意让来客碰页。你从门边看到她把书转回来，继续和邻村来的人说话。
      excerpts:
        p1: 接书人接稳后仍坐在那里，等她把最后一折的记号说明。
    relic: 一张空白练习折页
    relic_desc: 守书人自愿交给员工的练习折页。
    points:
      p1: 问守书人愿把哪一本交给邻村熟识的读者，帮她亲手交托
    points_fail:
      p1: 她选的读者走时没能带上书。接下来把书放在哪里，还得由守书人自己决定。
    shift:
      p1:
        was: 1562 年 7 月 12 日，马尼当众烧毁了大批玛雅折页书。征服以前的玛雅书，存世的只有寥寥几部。
        now: 这条分支里，守书人替其中一本书选好了接手的人。书送到了下一位读者手里，焚书过后，还留在玛雅人手中。
        who: maya_codices_mani
        bio: 这条分支里，1562 年公开焚书前，马尼的一册书由守书人亲自交给了自己选定的读者。
    vignettes:
      fold: 守书人把两张空折页放在凳上，问邻居记得那本书从哪一折先打开。你扶住纸，让他们比对。他说不准第二折在哪里。她把第一折收好，第二折不合上，等下次两人再谈。
      listen: 邻居说起守书人记不清的那段，两人记得的次序却不一样。你听他们各自讲完。他们同意第一折，第二折先不定。守书人请你把两种说法都在的那份留给她。
      survive: 你在后世馆藏里看过一部存世玛雅抄本。守书人问，你能不能说出邻居记的是哪一本。你能说出藏在哪儿，却对不上这一屋人记得的页。她给你一张空白练习折页带走。那本书留在了他们的讲述里。
  rongorongo_rapa_nui:
    name: 翻页之前给这面做一记
    place: 拉帕努伊岛
    figure: 拉帕努伊人
    story: 澳大利亚博物馆记载，拉帕努伊的 kōhau roŋoroŋo 是在木面刻记号的传统。存世实物很少，学界仍未能系统释读。
    relic: 两幅朝向习作
    relic_desc: 各在上缘做了一记的练习图。
    points:
      p1: 给每幅习作各留一个朝向标记
      p2: 帮工转板时保住第一张图的位置
      p3: 把口述标签与对应的草图核对
    vignettes:
      orientation: 帮工把练习板转过来，误拿第二张当第一张。你先在纸上补一支小箭头，才对照两幅。下回照着箭头能复核方向。你带走这个练习，却还读不出任何真实铭文。
      label: 你知道后人会问实物当时怎样摆。帮工告诉你他从哪一边画的，你把这句话另记一张，与图分开。走时能确定站位，仍没给刻写的记号猜一个意思。
      copies: 合起两张纸前，你各在上边做个记号。帮工照记号转回你原来看的方向。你带回两张习作图，启发这道练习的真正文字仍在纸外。
  nalanda_library:
    name: 给下堂课留个叶码
    place: 那烂陀
    figure: 那烂陀的僧人
    story: 那烂陀大寺遗址留有居住与教学建筑，见证长期讲学。
    relic: 一张课签
    relic_desc: 读书记，用叶码标好该从哪处接着读。
    points:
      p1: 在练习叶束里找到上一位读到哪儿
      p2: 交出叶束前抄下所用叶码
      p3: 在课签上分开记两个相近的位置
    vignettes:
      number: 读书人只靠上堂最后一个字找页。你对了两片练习叶，发现两处都有那个字。他这才在签上补一个叶码。下一位可以翻到对的位置。出处能查回去了，你却赶不上下一堂。
      later: 你知道以后还有旅人写到在这里求学。读书人问叶束交到别人手里时，该怎样让他接着读。你另做一张签，把位置写全，哪怕下一个人没听过今天这一段也能找回。叶束交出去了，你没听到下一个人读。
      tie: 叶束系起前，你先记好新课前面是哪一叶。你把课签放在外绳下，下一位先看到的是它。你留了一份抄件。后面会读到什么，正想着，人已经要回去了。
  meroitic_meroe:
    name: 把两组符号分开的点
    place: 麦罗埃
    figure: 麦罗埃的书吏
    story: 麦罗埃文字有草写体与象形体。草写铭文可以用竖排的小点作分隔。不少符号的读音已为研究者所知，语言仍有难以解释之处。
    relic: 一张分组习作
    relic_desc: 两组练习记号，分隔点清楚可见。
    points:
      p1: 抄整行以前先找出分隔记号
      p2: 在副本上记下原图的方向
      p3: 把口述说明和练习上的记号对照
    vignettes:
      dots: 抄写人往窄纸上转写时，把两组记号接成一组。你指着练习行上竖排的小点，把分隔放回原位。两组现在还能各自核对。你带走副本，整行的意思仍没弄明白。
      direction: 你知道后来的读者有时认得一处记号，却解释不了一句。抄写人问从哪边起，你在右端行外添一支箭头，与原行分开。等你走后，方向还认得清。
      margin: 你抄完一组，保留那几个点，再给下一组留地方。抄写人接过来，还能看出两组没有连在一处。你带回分列的形状，下一堂没有赶上。
  tupaia_tahiti:
    name: 领航者的海图
    place: 奋进号上
    figure: 图帕亚
    story: 来自赖阿特阿岛的领航者图帕亚于 1769 年登上奋进号，帮人画下自己熟悉的群岛。1770 年 6 月，船在今天昆士兰外海触礁。班克斯记下图帕亚在修船期间患坏血病，又在同年晚些时候于巴达维亚记下泰阿塔和图帕亚的死讯。
    story_prose:
      opening:
        - 奋进号船上，图帕亚正跟人核自己读得出的岛名，船身忽然一撞。布包从桌角滑下，值班水手往上喊人。天还没亮，大家才知道船卡在礁上。
        - 史实里，1770 年奋进号在今昆士兰外海触礁，之后脱险修理。图帕亚在此期间病过，几个月后班克斯在巴达维亚记下泰阿塔与图帕亚的死讯。分支可以护住脱礁，给图帕亚分到鲜食，也让两人病中有时间见面。
        - 找能帮船员守住工作位置的人。修船时要有人问图帕亚自己吃得下什么，到了巴达维亚要能安排病中探望。
      points:
        p1: 船员要把东西从低处提上来，有一只箱子还堆在挡手的位置。你替下一个压泵的人腾出立足处，留出转运箱子的空当。另一边的人一直守着绳，等叫下一轮时再一起用力。船身动的那一下，有人先问泵边的人还站不站得稳。
        p2: 管分食的人先把鲜食送往修船的队伍。图帕亚听见有人在点名，问他今日还能再等多久。你请人端来一份，让他先挑愿意吃的东西，再把余量记给下一班。那只盘子送到跟前时，鲜食没有在别人手里先分完。
        p3: 巴达维亚一间房里病人多，照看的人几次要被喊走。图帕亚请留下来的人问泰阿塔愿不愿见他。你把这句话带过去，两人都点头，这才有人把一把椅子从门边挪到床旁。你离开时，他们还能听清彼此说话。
      outcomes:
        all: 船照史实脱险。修船和后来病中的探望都留下分支记录，泰阿塔、图帕亚的死讯仍在。
        p1: 奋进号从礁上脱开。修船的人将回来继续分工，船上其他日子的安排还等着办。
        p2: 图帕亚拿到他自己挑的那份鲜食。事情只写到那只盘子递来。
        p3: 两人有一会儿能坐得近。巴达维亚的死讯没有因为这次见面改变。
      none: 船上有人还等着下一个口令。舱里既没留出鲜食，也没能约到后来想见的人。
      not_admitted: 水手让没有分工的人离开泵旁。你留在另一头，看见有人把湿透的纸束从脚边收起来。
      desync: 天亮船仍钉在礁上。未能保住史实中的脱险，事务所召回员工。
      excerpts:
        p1: 船身动的那一下，有人先问泵边的人还站不站得稳。
        p2: 那只盘子送到跟前时，鲜食没有在别人手里先分完。
        p3: 你离开时，他们还能听清彼此说话。
    relic: 一张岛屿草图
    relic_desc: 一张墨与淡彩的纸，画着小小的岛形和名字。
    points:
      p1: 触礁那一夜帮着减重、压泵，护住奋进号不沉
      p2: 修船各队分鲜食时给图帕亚留一份，让他自己挑吃得下的东西
      p3: 在巴达维亚替图帕亚找时间坐到泰阿塔身边，问他们病中想让谁留下来
    points_fail:
      p1: 天亮时船还卡在礁上，水漫过了货舱。分支和历史脱了节，员工在这一天被送回。
      p2: 鲜食先分给修船的人。图帕亚还得等，才有自己的一份。
      p3: 身边的人又被叫去别的病榻。图帕亚想见泰阿塔，还要接着等。
    shift:
      p1:
        was: 1770 年 6 月 10 日夜到 11 日，奋进号撞上今天的奋进礁，船员扔掉六门炮、压舱物、淡水和坏了的存粮，涨潮时船才浮起来。
      p2:
        was: 1770 年 6 月 16 日，班克斯记下图帕亚坏血病很重，牙龈坏了，腿上起了青紫的斑，船上的药都不管用。
        now: 这条分支里，修船期间图帕亚分到了鲜食。他挑得出自己吃得下的东西，也不用先出门捕鱼。
      p3:
        was: 在巴达维亚，班克斯先收到泰阿塔的死讯，又收到图帕亚的死讯。
        now: 这条分支里，{staff}替图帕亚在泰阿塔身边留了座。两人商量谁可以留下陪他们，也有了一点时间说话。
    vignettes:
      pronounce: 一位编出来的抄图人以为两种拼法是两座岛。{staff}请他先把两个名字念出来，他便在名字旁留了个问号，没画新岛。
      route: 抄图人要在两个记号之间拉一条直线，{staff}问刚才说方位是从哪座岛算起的，那条线就没有画下去。
      room: '{staff}压住卷起的纸角，下一个名字写下去时，就不会盖住上一个。'
  heo_nanseolheon_hanyang:
    name: 装着散诗的纸套
    place: 汉阳
    figure: 许兰雪轩
    story: 许兰雪轩去世后，弟弟许筠整理了她留存的作品，现存刊本中有 1608 年的朝鲜木刻本。
    story_prose:
      opening:
        - 抄写人把新裁的纸套压在镇纸底下，递来两张首句一样的散页。一张是练笔，一张有人来借读。他只记得两张纸都从窗边拿来。
        - 史实里，许兰雪轩去世后，弟弟许筠整理留存的诗文。1597 年选本与现存的 1608 年刊本有异文。这一趟先保住能找到的底稿，还可以请她亲自挑出愿意传阅的几篇。
        - 能对读笔迹和题头的员工先理出同篇异稿。能把借阅的来意讲明白的人，再去问她哪几首可以送到门外。
      points:
        p1: 抄写人指着墨色最深的那张说要留它。你让他把两张诗页并在一起，看到浅墨页的尾句另有一笔修改。他照你指出的位置在纸套上写了存放处，才把两稿都收进去。两张纸从此用一个题头，套口留了足够宽的边。
        p2: 许兰雪轩把抄写人挑的第一首移到自己手边，另选一首填进空处。你问这一叠该写借谁的名字，她把笔接过来，在最上面的纸边写下自己的名字，再把纸叠照原来的次序递还。她让抄写人把署名也誊一遍。
      outcomes:
        all: 后来许筠编集时，那一小叠仍按姐姐递出时的次序放在一起。抄写人誊下的名字留在头一页。
        p1: 同篇异稿都找得到。许筠编集时可以自己对读，诗人在世时会怎样取舍，仍无从得知。
        p2: 她为几首诗亲自写下署名。存稿的来路出了岔子，署名留下的选择只能随本趟短记带回。
      none: 抄书桌上仍只有混在一起的纸。后来家人只能从余下的稿子挑选；本趟记录没有带回来一份作者选目。
      not_admitted: 抄写人隔门问来客要借哪一首。没人能说出题头，他把纸套留在桌上。
      desync: 再去问存稿放在哪里时，抄写人只认得已经空了的纸套。编集所需的底稿失去下落，事务所召回员工。
      excerpts:
        p1: 两张纸从此用一个题头，套口留了足够宽的边。
        p2: 她让抄写人把署名也誊一遍。
    relic: 一页诗稿
    relic_desc: 一页细纸，用毛笔写着写花和远方的诗。
    points:
      p1: 替家里把已经传抄的诗篇放在一处，给许筠日后编集留下能找到的底稿
      p2: 请许兰雪轩从中挑出想让人读的几篇，在那一小叠诗稿上署名
    points_fail:
      p1: 分存的诗稿下落也断了，许筠后来无法循原稿编集。行程与史实脱节，员工被召回。
      p2: 去世之后，只能由家人从留存稿中替她选篇。
    shift:
      p1:
        was: 1589 年许兰雪轩去世后，许筠后来以娘家留存的稿件整理她的作品。
      p2:
        was: 1589 年许兰雪轩去世后，弟弟许筠编选了她的诗。1597 年选本和 1608 年刊本的诗句有不同版本。
        now: 许兰雪轩在愿意传阅的几首诗上署名。后来家人编集时，仍把她亲自选出的这些篇目放在一起。
        who: heo_nanseolheon_hanyang
        bio: 许兰雪轩生前定下了一小组愿意传阅的诗。亲人整理她的遗稿时保留了这个次序。
    vignettes:
      binding: 抄写人把练笔的纸夹在其他页里。你对过两个题头，另折了一个纸套装练抄稿。还有一页看不准，留散着让他再查。哪首诗最后印进了书，你在这趟看不到。
      name: 你知道有些诗以后会传到离这户人家很远的地方。抄写人要递出去一张没题头的练抄稿，你请他把题头一同誊下。送出门的纸多了一张带署名的。你用空白纸条夹住自己读到的位置，木刻本还要等许多年。
      fold: 你把散页套起来，没让折痕压到字，再在多出的纸套上标记有一页还缺题目。带走的是这条提醒，诗页留在屋里。你离开以后，那部诗集才会编成。
  ghalib_delhi:
    name: 先听见韵脚，再去翻诗集
    place: 德里
    figure: 迦利布
    story: 这趟去德里时，迦利布的乌尔都语诗集已于 1841 年刊印。读者可以按加扎勒的韵脚、叠句结尾来翻找。
    story_prose:
      opening:
        - 德里书铺里，有人一路念着听过的诗来找刊本，只记得尾字。卖书人请你再听一回，把听清的韵脚和叠句写到一张纸上。他要拿着纸条去翻书。
        - 史实里，迦利布的乌尔都语诗集已有刊本。他受托编写帖木儿王朝史，第一卷刊行，续卷没有写成。这次能帮他把后几朝的材料单独排好，让他交卷以后可以接着写。
        - 擅长对照异名和年代的员工可以按朝次分纸。懂不同文体的人还可以帮忙识别哪一页是引诗，哪一页才是本朝记录。
      points:
        p1: 迦利布从纸堆里抽出一张，叫你读末行。那页看着像一段史文，末行却跟页边抄的韵句相连。你把引用出处写在包纸上，从待排序的几页里抽走它，再把胡马雍之后的材料另立一册。迦利布试翻到空白处，写下了续卷的第一行。
      outcomes:
        all: 等第一卷交出去，旁边已有一册能接上去的纸。你走的时候，第二卷开了头，下面还空着许多页。
        p1: 后几朝的资料有了自己的册子。迦利布可以继续起草，往后的篇章仍要由他一页页写。
      none: 卖书人照纸条找到了诗句。续卷的材料仍积在原来的纸堆里，刊行的第一卷之后没有完稿。
      not_admitted: 纸条送进书铺，店里无人识得来客。半开的账册下面，还压着那几张没交出的材料。
      excerpts:
        p1: 迦利布试翻到空白处，写下了续卷的第一行。
    relic: 一页格扎勒诗稿
    relic_desc: 一页他亲笔写的乌尔都语诗，有修改的痕迹。
    points:
      p1: 帮他把国王托付的帖木儿王朝史后半部的材料收齐理好，让他写完上半部以后接着写下去
    points_fail:
      p1: 第一卷仍然写成。原先计划的第二卷照史实没有留下完稿。
    shift:
      p1:
        was: 1850 年 7 月 4 日，巴哈杜尔·沙请迦利布撰写帖木儿王朝史；上半部《正午的太阳》1854 至 1855 年间刊行，写到胡马雍去世为止，他计划中的续篇没有写成。
        now: 后几朝的材料在迦利布手里单独成册。交了第一卷以后，他能拿出这一册，开始起草第二卷。
        who: ghalib_delhi
        bio: 这条分支里，迦利布交了第一卷以后，接着起草了第二卷。
    vignettes:
      refrain: 卖书人记得诗里的意象，却一直翻错地方。你问他反复听到的是什么词。他念出结尾，你才在刊本里翻到对应的一组。你记下一个页码。最早把这一句念进店里的人是谁，他仍说不上来。
      future: 你告诉卖书人，以后的读者会把几个版本摆在一起对。他问那能不能帮他找到今天这一句。你在他的条子上补了版本年份，又标出结尾。等他有另一本可核对时，你已经走了。
      listen: 你把结尾念给卖书人听，念到两个人都认得。他把条子夹进书里对应的一段。你能带回记得住的那几个字，整句却已经有些想不起来了。
  savitribai_phule_pune:
    name: 包里多带的一件纱丽
    place: 浦那
    figure: 萨维特丽巴伊·普勒
    story: 1848 年，萨维特丽巴伊·普勒与乔蒂拉奥·普勒在浦那开始办女学。有关她的记述里，有她去学校路上受到的侮辱，也有她随身多带、到学校再换上的那件纱丽。后来的办学档案记她担任校长。1897 年，她在照顾鼠疫病人时染病去世。
    story_prose:
      opening:
        - 1848 年，浦那。萨维特丽巴伊·普勒与乔蒂拉奥·普勒开始办女学。有关她的记述里，有她上学路上带在包里、到校才换的那件纱丽。
        - 史实里，她在去教书的路上受到侮辱，有些家庭也不愿女孩去上学。在这条分支里，有人能一起走过那条街，也能坐到一个女孩家里听听她为什么被叫回去。
        - 这一趟用得上能稳稳走过那条街的人，也用得上会教书、懂得同家人说话的人。街边起了哄，还要有人能让人群散开。
      points:
        p1: 街口有人朝她走过来。{staff}看住两侧的门口，陪萨维特丽巴伊走到比德府，把门推开。先来的女孩正把石板放到桌上。窗纸亮起来，低处还留着刚擦过的水印。
        p2: '{staff}在女孩家里坐了一会儿，听家人把话说完，又把她课堂上写过的一行给他们看。女孩后来把石板放回原来的位置。手伸得慢，第一道笔迹却一直写到了边上。'
        p3: '{staff}在那处街口站定，同拦路的人说话，等投掷的人把手放下，再陪她走过。萨维特丽巴伊到校后把包搁在桌上。那件备用纱丽一直叠在里头，布角还照原样扣着。'
      outcomes:
        all: 学校继续上课，回来的女孩也在。萨维特丽巴伊打开包取出课上用的东西，底下那道布折还整整齐齐。
        p3: 从那天起，备用的纱丽留在包底。走进教室时，她腾得出手去开窗。
        p2: 那个女孩又来上课，石板上多出一行字。下课后，她把石板横放回原处。
        p1: 那天的课照常上了。门开着，早来的几块石板靠在桌腿旁。
      none: 教室里少一块石板，粉笔却搁在桌边。街口响过脚步，很快又静了。
      not_admitted: '{staff}没能在学校留下。半扇门挡着里面的桌子，只看得见石板的一角。'
      desync: 去学校的那一程断在街口。{staff}被召回时，窗下摆着的石板还没有写上字。
      excerpts:
        p3: 萨维特丽巴伊到校后把包搁在桌上。那件备用纱丽一直叠在里头，布角还照原样扣着。
        p2: 女孩后来把石板放回原来的位置。手伸得慢，第一道笔迹却一直写到了边上。
        p1: 先来的女孩正把石板放到桌上。窗纸亮起来，低处还留着刚擦过的水印。
    relic: 一块石板
    relic_desc: 一块小石板，上面用粉笔写着第一排字母。
    points:
      p1: 开学头一个月最难的那个早上，护住她去比德府的路，让当天的课照常开
      p2: 劝回一个被家里叫回去的女孩，让她回到石板前
      p3: 拦下那段路上朝她扔东西的人，让她不必再在包里多带一件纱丽
    points_fail:
      p1: 那天她没能走到学校，比德府的门没有开。
      p2: 这条分支里，比德府的石板前少了一个人。
      p3: 她照旧每天在包里多带一件纱丽，这条分支与历史一样。
    shift:
      p1:
        was: 1848 年 1 月起，比德府的女子学校照常开课，萨维特丽巴伊每天走路去教书。
      p2:
        was: 1848 年，浦那许多人家反对女孩上学。
        now: 那个女孩又回来上课了。
      p3:
        was: 1848 年起，她去学校的路上被扔石头和粪，包里多带一件纱丽，到校再换上。
        now: 从一个春天的早上起，路边没人再朝她扔东西，那件备用的纱丽一直叠在包里没用上。
    vignettes:
      slate: '{staff}把石板横过来，让两个女孩都够得着。有人来叫她们回家，石板上已经各有一道笔迹，一人能指出另一人写的那一道。'
      road: 往布德瓦尔区去，{staff}落后半步，把包换到离门口远的一边。一路走过，沿街都没有人开口。
      chalk: '{staff}把最后一支粉笔掰开，一截给黑板，一截给石板。临放下，顺手在采买单上添了一行。'
  zhu_shijie_yangzhou:
    name: 算板四方各有一元
    place: 扬州
    figure: 朱世杰
    story: 莫若在朱世杰《四元玉鉴》前序里说明四元怎样围着中央摆放：天元在下，地元在左，人元在右，物元在上。序作于 1303 年。
    relic: 一套算筹
    relic_desc: 一根根细棍，排成行来代表数。
    points:
      p1: 帮朱世杰在扬州把《四元玉鉴》多刻、多抄几部，送到跟他学算的人手里，不让这本书在后世失传
    points_fail:
      p1: 书照史实只有少数几部流传，这条分支里到十八世纪后半它在中国还是找不到了，要等阮元四处去访。
    shift:
      p1:
        was: 1303 年《四元玉鉴》刊出，前有莫若序；到十八世纪后半，这本书在中国已经失传，1799 年阮元编《畴人传》时遍寻不得，几年后才访得一部。
        now: '{staff}帮他多刻、多抄了几部，分到来学算的人手里。这条分支里，这本书一直有人在读，不用等人四处去找。'
        who: zhu_shijie_yangzhou
        bio: IF 线里，《四元玉鉴》在 1303 年刊出时多印了几部，留在各地学生手里，一直传了下来。
    vignettes:
      rotate: 两位学算人从算板两侧各抄了一份。你先标出从哪边算作下，再把两张摆在一起。有一张把地元和人元挪回正确位置。你抄走订正的图，还没轮到做那串长长的消元。
      hand: 你问学算人为什么四个名都写在一排。他说这样背得住。你让原来那行留着，另绕中央摆四个记号，好叫他也记得位置。等他收筹，你只看见了起手，还没看到题怎样算完。
      outline: 筹入盒前，你绕着中央画了四条短线，再记哪一端是下。回来时你还摆得出这个布局。大题留在学算人的板上。
  qin_jiushao_huzhou:
    name: 一份答案要过两行
    place: 湖州
    figure: 秦九韶
    story: 秦九韶《数书九章》卷一大衍类详列处理余数问题的方法。
    relic: 一枚算筹
    relic_desc: 一根磨得发亮的竹算筹。
    points:
      p1: 帮秦九韶把《数书九章》多誊几部，交到刻书人手里，别让它只靠抄本传下去
    points_fail:
      p1: 这部书照史实只以抄本流传，近六百年后才有刻本。
    shift:
      p1:
        was: 《数书九章》1247 年以抄本存世，1421 年收入《永乐大典》，1787 年收入《四库全书》，1842 年才有木刻本。
        now: 几部誊本离开了湖州，他在世时书就刻了版。别处的人也能照他排定的次序读这部书。
        who: qin_jiushao_huzhou
        bio: 这条时间线里，秦九韶的书在他生前就刻印出来，在宋代不止一处有人读、有人教。
    vignettes:
      witness: 学算人摆了五根筹。三根一组的确剩二，但五根一组剩零。你请他试八，第一行剩二，第二行剩三。他划去一个答案。再加第三行的题，你没等到。
      rows: 你知道以后还有人研究这套算法，学算人却只想知道两个余数能不能填进同一格。你请他分别标明按三分组与按五分组的两行。他下次能自己验了，那个新答案你仍没赶上。
      counters: 你把八根筹先按三根分，再按五根分。每回重摆之前，先记下没分进组的筹。你带回验过的两行，桌上还有一道更大的题。
  al_biruni_ghazna:
    name: 平原上方的两条线
    place: 加兹尼
    figure: 比鲁尼
    story: 比鲁尼在《确定地点坐标》中记述曾用南达纳附近一座山估算地球大小。山高与地平线低于水平线的角度是两项不同的量。
    relic: 一件星盘
    relic_desc: 一只铜星盘，刻度被手指磨亮。
    points:
      p1: 在草图上区分水平线与望见的地平线
      p2: 带着完整的山高记录到观测点
      p3: 说清山坡坡度为何是另一个量
    vignettes:
      angle: 测量帮手把角标在山坡那一侧。你从他站的点画出水平线，再画望向地平线的较低视线。角的记号得挪到另一处。你带回改过的图，最后的数字还在算。
      height: 你知道后来的书会同时留下山高和角度。到了山顶，帮手只报了角度。你把记山高的条子送上来，请他把两项并着收。等平原没入薄雾，两个读数已经挨在一起。下一回地平线放晴你等不到。
      fold: 你用一张纸条裹住另一张，标明哪项是量山所得，哪项是平望所得。帮手再翻时不用猜。你带回两个量的名字，半径还没算完。
  al_razi_rayy:
    name: 给存疑处另作题头
    place: 雷伊
    figure: 拉齐
    story: 拉齐在《质疑盖伦》中，把盖伦书里的主张与自己的观察并看，也记下他曾在什么情况下暂缓判断。
    relic: 一张分了两栏的页边记
    relic_desc: 读书记，分列出处与读者疑问。
    points:
      p1: 核对页边写的是观察，还是判断
      p2: 留点时间，等读者把疑处说完
      p3: 交接时，让观察记录和出处一并交出去
    vignettes:
      columns: 莱拉把两行都记在盖伦名下。第一行在书里找得到，第二行是有人放下书之后说的。你请她把书名留给第一行，给另一行另作题头。新来的人能看懂疑问从哪里开始。
      doubt: 法尔哈德想用一句判断收尾。莱拉还在回想做观察的人到底说了什么。你放慢读的速度，把最后一行留给她。她把记得的写下来，再跟一个问题，留给接手的读者。
      edition: 你见过后世传本会记下这样的疑问。法尔哈德手里只有这张纸，问最后没定下的一行该怎么写。你帮他标作待对照。下一份抄本还没来，灯就撤走了。
  sushruta_varanasi:
    name: 课前那块练习布
    place: 瓦拉纳西
    figure: 妙闻
    story: 《妙闻集》记述用模型习作，并举到布片。文本经历了长期传承。
    relic: 一片标记过的练习布
    relic_desc: 练习样布，保留下来供比较。
    points:
      p1: 找出哪块布留着给人看最初那次练习
      p2: 学徒比较时，把练习布按在原处
      p3: 帮下一名学徒把两次练习都看一遍
    vignettes:
      cloth: 米拉正要把粗糙些的那片丢进碎布堆。你指出阿难给第一回留下的记号。她拿来同后来那片比，把两块都留在台上。阿难现在可以指明自己哪儿做了改动。
      turn: 阿难不停讲自己的那片，米拉等着上手摸。你把两片摆到她够得着的地方，请阿难先看她指哪儿。她问的正是他刚才跳过的一角。那片布便留在台边，给下一人看。
      text: 你知道后世能读到一章讲模型习作。米拉手里只有片布，上面的一个小记号她认不出。你听着她自己找回早一块来对照。下一堂开始时，你已经走了。
  zhuge_liang_wuzhang:
    name: 灯灭以前的一封回信
    place: 五丈原
    figure: 诸葛亮
    story: 建兴十二年，诸葛亮在五丈原患病，北伐未竟，病逝军中。他曾密表后主，建议由蒋琬接手。蒋琬在他死后受任。史书没有记载诸葛亮生前是否收到回音。
    relic: 一枚没填完的信牍
    relic_desc: 游戏中的纪念物。木牍上划了两格，一格记去信，一格记回音。
    points:
      p1: 帮书佐把密表归到送往成都的文书里，赶上这班信使
      p2: 请从成都回来的信使写张私笺报平安，赶在下一摞例行文书之前把回音送到榻边
    points_fail:
      p1: 这条分支里密表搁错了地方，误了这班信使。朝廷要等下一班才能收到。
      p2: 信使的私笺压在例行文书底下。灯熄的时候，回文那一格还空着。
    shift:
      p1:
        was: 《蒋琬传》记载诸葛亮曾密表后主，推荐蒋琬接手。
      p2:
        was: 蒋琬在诸葛亮死后受任，两篇本传都未记载诸葛亮生前收到回音。
        now: 这条分支里，诸葛亮在榻边读到信使的私笺，知道朝廷已经收到密表。蒋琬仍在他死后受任。
    vignettes:
      bowl: 侍从来换榻边一碗清水，上一碗还温着。
      register: 书佐把回文那一栏空着，等有信来再补日期。
      empty: '{staff}把合上的收文簿搁到灯边，榻上伸手能够着。'
  borobudur_java:
    name: 方台走到圆台
    place: 爪哇
    figure: 婆罗浮屠的建造者们
    story: 爪哇中部的婆罗浮屠建于八至九世纪。联合国教科文组织的遗产档案记有下部的方形台层和上部三层圆台。
    relic: 两张台层轮廓图
    relic_desc: 两张方台与圆台交界的工作草图。
    points:
      p1: 让两张练习图纸在共用的台阶处对齐
      p2: 把平面图带到方台转为圆台的位置
      p3: 在圆台草图上找出多画的一处拐角
    vignettes:
      corner: 画图帮工把下图的形状又画进上图。你先顺着方台图走一处直角，再沿另一张的弧边描过去。他擦掉多出的一角。你带回两个轮廓，走到的地方还没有抵达最高处。
      stair: 你看过后世从上往下画的平面图，站在下面的帮工却只见眼前的台阶。你在两纸都画出这段阶，好叫他登上去能看懂哪里改了形。等他绕圆台一周，你早已走了。
      layers: 你在阶下标出一条直边，又在阶上描一小段弧。帮工核图时请你把两个记号分别留着。你带回两种轮廓，哪一张都画不下整座建筑。
  qin_liangyu_shizhu:
    name: 秦良玉与石砫账册
    place: 石砫
    figure: 秦良玉
    story: 《明史·秦良玉传》记载，崇祯三年，秦良玉与秦翼明奉诏勤王，秦良玉出家财济饷。《补辑石砫厅新志》也记载了这次奉诏出行。
    relic: 石砫领物抄单
    relic_desc: 页边记了一个姓名，包裹旁又写了另一个。
    points:
      p1: 把秦良玉拿出家财的交接款逐笔确认，让石砫经手的人能在开支日期签领
      p2: 把交割手记和家中其余的开销分开记，发回石砫的一份加经手人和实际支付日期
      p3: 请秦良玉核对一份家人也能查的支出单，给因分摊费用而迟领钱的人留待核记录
    points_fail:
      p1: 临时收款的人记不清谁已领款，家财没能按原意交割，事务所因同步失败召回员工。
      p2: 把公私开销抄在一处，后来查一笔支出时，家人得再去问所有经手者。
      p3: 应补支付当作已经给出，不能回来的经手人也没法核清。
    shift:
      p1:
        was: 《明史》记 1630 年秦良玉与秦翼明奉诏应召，秦良玉出家财济饷。
      p2:
        was: 秦良玉的支出由史书概述，公开传记没有留这批款项完整细账。
        now: 留下的副本可以确定哪些钱已交付、哪些家人还在垫付。
      p3:
        was: 石砫地方志也记奉诏出行，后来的记载以出行和事功为主。
        now: 家里能凭留底追对漏项。经手的人来问时，可以看见当日应补的数如何核出。
        who: qin_liangyu_shizhu
        bio: 秦良玉与石砫关系密切。史料明载她用到家中财物，具体如何经手是这条分支考察的内容。
    vignettes:
      ledger: 两行名字只差一个字，账房顺嘴读成了同一个人。你把那个字圈出来，他把两位领物人都叫回来核对。
      hands: 搬货人两手托着包裹，腾不出手展开单子。你替她把纸按平，把名字念给她听，她才重新抱紧包裹。
      copy: 账房念过一行，你就在抄单上对一行。念到最后，你把两张纸并排留在桌上。
  zeami_sado:
    name: 纸上的金岛
    place: 佐渡岛
    figure: 世阿弥
    story: 1432 年，世阿弥的儿子元雅去世。世阿弥在《却来华》中写到这场失去，1434 年被流放佐渡。《金岛书》记着他渡海和在岛上的经历，定稿记年为 1436 年。
    story_prose:
      opening:
        - 佐渡岛上，一位念词人拿来一张能折进口袋的纸。世阿弥已经听见他在门口练过两遍，每回都在不一样的地方歇气。他坐着问，这次想从哪一句开始。
        - 世阿弥晚年被流放到佐渡，《金岛书》留下在岛上的见闻。这个分支只设一次由他选听、选停顿的小排演，后来留存的著作仍按史实成稿。
        - 让听得清节奏或擅长读词的员工问世阿弥是否愿听。先念一遍，再把他自己点的停顿记在独立纸条上。
      points:
        p1: 念词人第一遍在词尾换气。世阿弥请他从同一处再念，到了句中抬一下手。你看着他的手示意哪里停，等念完才把停法记在纸条边上。第三遍，念词人没去看纸，在世阿弥抬手前就自己停在那个字上。
      outcomes:
        all: 纸条留下了他听后点出的停顿。世阿弥把它夹回原先的页旁，之后还会写他自己在岛上的见闻。
        p1: 世阿弥亲自挑出停顿，念词人说下次带同一页来。
      none: 念词人没等到能走进来的时候。那一折纸上还没有标停顿。
      not_admitted: 来客还没得到允许诵读。念词人收好纸，从门外退了回去。
      excerpts:
        p1: 第三遍，念词人没去看纸，在世阿弥抬手前就自己停在那个字上。
    relic: 一张能面
    relic_desc: 一张小小的木面，眉间有细细的漆痕。
    points:
      p1: 问佐渡岛上的世阿弥愿不愿听人读一行，听完以后，把他选的停顿另记在纸条上
    points_fail:
      p1: 念词人还没来得及让世阿弥听见这一行，就得先回去了。停在哪儿，纸上还没记。
    shift:
      p1:
        was: 世阿弥留下了缅怀元雅的文字，也留下了记佐渡流放的《金岛书》。
        now: 这条分支里，世阿弥听过同一行的两种念法，亲自挑了停顿的位置，把纸条留在自己那页旁边。
    vignettes:
      later: 你告诉虚构的念词人，后来写佐渡的书还会提到这个名字。他先像念地名一样试一遍，再念得像一个人对着远处想什么。你记下两个停顿。载世阿弥来岛的船，你已经赶不上了。
      mask: 念词人举起练习用的面具，放下时找不到念到哪儿。你拿一张散纸标出那行的起头，立在他伸手就能找见的位置。面具挂回钩上，下一轮念词你没能留下听。
      wind: 风把念词纸吹散。你从长凳底下拾回一张，用小石子压住。念词人把那一行又念了一遍。你走时纸还压在石头下，记下来的只有那一处停顿。
  ino_tadataka_ezo:
    name: 被直线吞掉的转弯
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬从江户出发，开始第一次测量。队伍沿东北地方一路北测，渡海到虾夷地，再沿海岸测到西别折返。来回全程约半年，不全是在岛上度过。伊能忠敬于 1818 年去世，同伴在 1821 年完成《大日本沿海舆地全图》。
    story_prose:
      opening:
        - 1800 年 6 月 11 日，江户。五十五岁的伊能忠敬带着测量队出发，一行六人，要一路北上，渡海到虾夷地，沿着海岸量出一条线。这是他头一回测量，后来他走遍了日本的海岸；他去世三年后，同伴们画成了《大日本沿海舆地全图》。
        - 史实里，幕府给的补助不多，路上的花销大半由他自己掏；这一趟全靠步子量，测绳要到第二次测量才用上；测量队沿虾夷地南岸量到西别，就循原路折返了。在这条分支里，队里有个大声数着步子的挑夫，海边有个知道岸在哪里拐弯的渔夫。
        - 这一趟用得上几种人：会管账、做过买卖，盘缠见底时撑得住的人，或是条理清楚、身子结实的人，带着营养合成器也行；会木工、造船、补网，或懂工程、手巧细心，量得准一段路的人；身子骨极结实、走惯了远路的人，懂航海、飞行或地质的人，或带着探路无人机的人。
      outcomes:
        all: 这年冬天，测量队回到江户，前后一百八十天。带回的图上，虾夷地的海岸一直画过了西别，有一段的数字旁边注着绳量。
        p3: 这年冬天，测量队回到江户。图上的海岸线越过西别又延了一截，末端画着一个小小的岬角。
        p2: 这年冬天，测量队回到江户。图上有一段海岸，步数和绳量的数并排写着；下一回出门，队里带上了测绳。
        p1: 这年冬天，测量队循原路回到江户，前后一百八十天。那根测杖后来又跟着他出了好几趟远门。
      none: 八月底，钱袋空了，测量队没走到西别就收拾行李往回走。挑夫数步子的声音一路低了下去，计数单的最后几行空着。
      desync: 八月底，钱袋见了底，测量队没走到西别就回了头。{staff}被召回时，那根测杖还插在半路的沙里，潮水涨上来，没过了它的半截。
      not_admitted: '{staff}没能跟进测量队，只在海边帮渔夫收了几回网。渔夫说起岸在哪里拐弯时，往东的沙滩上，一行人正一步一步数着走远。'
      points:
        p2:
          class_seafaring: 八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}在船上打惯了绳结，取出一卷细绳，每隔一段打一个结，结与结之间先拿测杖比准，和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。
          class_craft: 八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}做惯了手艺活，搓了一根细绳，每隔一段打一个结，结与结之间先拿测杖比准，和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。
          else: 八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}取出一卷打好了结的细绳，先拿测杖把结与结之间一段段校准，再和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。
        p1:
          class_lettered: 八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}做惯了案头的事，把剩下的钱一文一文摊开，一路要住几处、吃几顿，一样一样记上，能省的那几项用笔圈了出来。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。
          class_trade: 八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}做过买卖，进渔村去讲价，拿米换了几天的干鱼，借宿的价钱也压下来一截。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。
          else: 八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}把剩下的口粮按天数分成小包，每天早上发一包，自己也照这个份量吃。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。
        p3:
          class_seafaring: 九月初，测量队到了西别，照原先的打算，该在这里回头了。秋风一天比一天硬，往东的岸还长着，没有人量过。{staff}在海上看惯了天和潮水，前头哪处岬角好绕、潮水几时退，一样一样指给他看，领着队伍贴着岸往前走。测量队越过西别，又往前量了一段。渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。
          else: 九月初，测量队到了西别，照原先的打算，该在这里回头了。秋风一天比一天硬，往东的岸还长着，没有人量过。{staff}腿脚结实，背着行李先往前探了一程，哪里能落脚、哪里能过河，回来在沙上画给他看。测量队越过西别，又往前量了一段。渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。
      excerpts:
        p3: 渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。
        p2: 伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。
        p1: 到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。
    relic: 一根测杖
    relic_desc: 一根量步距用的细杖，上面刻着尺度。
    points:
      p1: 盘缠见底的时候，护住测量队的行程，让测绳按期铺到西别
      p2: 帮他把一段海岸从步测换成用绳量，让那一段的数先准起来
      p3: 帮他把测绳从西别再往前铺一段，让这一趟多测一截没测到的海岸
    points_fail:
      p1: 队伍在西别之前就撑不下去回了头，回到江户也画不出那一路的图。
      p2: 这条分支里，虾夷地的每一段仍只是步数。
      p3: 测量照旧在西别回头，这条分支与历史一样。
    shift:
      p1:
        was: 1800 年，伊能忠敬的测量队沿虾夷地东南海岸一路测到西别，再折返江户。
      p2:
        was: 1800 年的第一次测量全靠步测，到第二次测量才用上测绳。
        now: 虾夷地有一段海岸先用上了绳。
      p3:
        was: 1800 年的第一次测量到西别为止，北海道其余的海岸要等以后的测量补上。
        now: 测绳越过西别又往前铺了一段，回到江户的那几张图上多了一截海岸。
    vignettes:
      bend: 一处海湾眼看要被画进一条直线里，{staff}请他们在拐弯处再测一次方位。渔夫在一旁看着，那个弯就留在了纸上。
      repeat: '{staff}用同样的步子把一段路又走了一遍，鞋里灌满了沙，两次的步数并排记着，没去挑哪一个。'
      sketch: 众人歇脚时，{staff}在计数单背面画了一个岬角的轮廓，海风掀起纸角，就拿一块石子压住，标出测绳铺在哪里。
  djenne_builders:
    name: 院边一小块试抹的墙
    place: 杰内
    figure: 杰内的泥砖建造者们
    story: 杰内以土构建筑著称。今日可见的大清真寺于 1907 年重建。
    relic: 一块泥砖
    relic_desc: 一块晒得很硬的泥砖，掰开能看到里面的稻壳。
    points:
      p1: 扶住练习板，别蹭到新抹上的一层
      p2: 带第二小份材料到练习墙另一面
      p3: 与帮工约定下回先回来看哪一块
    vignettes:
      mark: 院里帮工试抹两块，却记不清各是哪碗来的。你在墙边摆两张另记的纸条，两块试抹都有了自己的记录。另一面还没轮到晒太阳，你就收队了。
      time: 你知道几个世纪后人们所见的建筑还有重建的历史。眼下帮工只想把这一碗铺满试墙，你请他先抹一小块，留一个干后可再查的位置。你带回的是下回该看哪处，结果还没出来。
      shade: 你把试抹的那块和阳光照到的边界画下来。帮工把图拿回工台，好下回对同一处。你的副本上只有一小块，整墙还没抹。
  ahmes_thebes:
    name: 纸草上的圆田
    place: 底比斯
    figure: 阿赫摩斯
    story: 莱因德数学纸草第 50 题问直径为九的圆田有多大。题中从直径减去九分之一，再把余下的数平方，得六十四。现存纸草由书吏阿赫摩斯据旧本抄写。
    relic: 一卷纸草残片
    relic_desc: 一小片写着红黑两色字的纸草。
    points:
      p1: 算出平方之前剩下的长度
      p2: 把规则和算例抄在一起
      p3: 指给帮工看，正方形边长为何用八
    vignettes:
      table: 帮工把整个直径平方，在答案处写了八十一。你在九旁边写明先减去它的九分之一，再把剩下的八平方。他把答案改成六十四。两行你都抄走了，这趟却还没丈量过一块真的田。
      outline: 你知道后人会把这个法子与现代公式一起算。帮工只想知道八从哪来，你便给直径画了九个等分，划掉其中一份。他把图留在题旁。等他拿另一块田来试，你就不在了。
      roll: 纸草收起来之前，你把直径、减去的九分之一和余下的长度抄下来。帮工等你走后也能照着求平方。你只带回三个数，这块田究竟要下多少种，还不知道。
  quipu_cusco:
    name: 要数两遍的绳
    place: 库斯科
    figure: 结绳记事的人
    story: 《结绳档案》研究识别出若干记录相同数字的印加结绳，并讨论一笔账如何保存副本。许多数值结绳采用十进位。
    relic: 一束彩色结绳
    relic_desc: 一束长短不一的绳子，打着大小不同的结。
    points:
      p1: 先分清结的位置，再读练习数
      p2: 先独立读另一束，再把两份并到一起
      p3: 请记账人留住两份之间的差异，等复核
    vignettes:
      places: 记账人一眼把两条练习绳读成同一个数。你在纸上把十位和个位拆开，一条是二十三，一条是三十二。他给这对绳加了待复核的签。你带得走这处差异，却还辨不出哪一个数才对。
      copies: 你知道后来的研究者会找能互相对照的绳。记账人正要把两条中的一条单独搁开。你把两条读数分列两行，用记号标出哪一位开始对不上。两条绳一块收好，下一位复核的人还没来。
      tag: 你跟记账人从绳的自由端辨认一条练习绳。收绳前，你标明每个数各来自哪条。归来时就只带回这些。原例拿什么货物做比方，始终没人写。
  humboldt_chimborazo:
    name: 雪线以上的那道深沟
    place: 厄瓜多尔钦博拉索山
    figure: 亚历山大·冯·洪堡
    story: 1802 年 6 月 23 日，洪堡与埃梅·邦普兰、卡洛斯·蒙图法尔攀登钦博拉索山。挑夫不肯再往上走，三人流着鼻血、呕吐、头晕，继续向上，直到山顶以下一道深沟挡住去路，只得折返。
    story_prose:
      opening:
        - 钦博拉索山的雪线上，邦普兰把气压计交给洪堡，腾出手来扶自己的包。蒙图法尔停在一块能看见前方的石上。他指的深沟，在云挪开以前看不到边。
        - 1802 年 6 月 23 日，洪堡等人攀登钦博拉索，因深沟折返。这里的分支让一行人找到可以续行的路，从山顶下来才能带回结果。
        - 找能在高处照应同伴的员工。用事务所道具相助时，仍让每个人自己说愿不愿继续。
      points:
        p1: 前面有人踩到雪边就停了，下来告诉洪堡那里没有稳的落脚处。你让一行人先在能站稳的地方歇下，等另一组把可走的地形看明白，再商量要不要继续。洪堡和邦普兰交换着提仪器，回来时蒙图法尔走在能看见两人的地方。下到原先歇脚的石边，他们才取出在顶上写的那半页记录。
      outcomes:
        all: 这一趟确实到了顶，也全员回到原先的歇脚处。报告在山顶记录旁另记了下来的时刻。
        p1: 他们沿本趟找到的路上去，也照原先约好的次序回到山下。
      none: 看到深沟，一行人折返。回到有同伴等着的地方，纸上只有他们实际到过的高度和所见。
      not_admitted: 队伍出发时没留下带你同行的位置。你在下面接到一只空的仪器套。
      excerpts:
        p1: 下到原先歇脚的石边，他们才取出在顶上写的那半页记录。
    relic: 一支气压计
    relic_desc: 一支装着水银的气压计，玻璃管上刻着高度。
    points:
      p1: 6 月 23 日那道深沟挡住去路之前，帮一行人顶住高山病，找到越过去的路，登上钦博拉索山顶再平安下来
    points_fail:
      p1: 他们照史实在那道深沟前折返，没有登顶。
    shift:
      p1:
        was: 1802 年 6 月 23 日，洪堡、邦普兰和卡洛斯·蒙图法尔攀登钦博拉索山，一路流鼻血、呕吐、头晕，在山顶以下被一道深沟挡住，只得折返。
        now: 他们越过那道深沟，站上了钦博拉索山顶，又平安回到营地。
        who: humboldt_chimborazo
        bio: 这条时间线里，洪堡 1802 年 6 月 23 日与邦普兰、蒙图法尔一同登上钦博拉索山顶，平安下山。
    vignettes:
      turn: 虚构读者把线路一路画上山顶。你问日记写到哪里就停止往上走了。他把最后一记往山坡下移，没再碰山顶。
      units: 读者要只抄一个高度，把单位省掉。你请他把原单位和测数放在一起，另留一行给今天的换算。
      names: 你请读者在洪堡旁留出地方，记下另外几名同行者。折起纸以后，名单仍跟着当天攀登的记录。
  banneker_maryland:
    name: 要一起寄出的两件东西
    place: 马里兰
    figure: 本杰明·班纳克
    story: 1791年8月19日，本杰明·班纳克致信托马斯·杰斐逊，随信送去下一年的历书手稿，质问种族偏见与奴隶制度。
    story_prose:
      opening:
        - 印坊的信使和要离开的邮差都在门口。班纳克把磨坊附近的地名写上信，又把历书翻到末页，确认亲笔的那份还在桌上。信里有些话只寄这一次。
        - 史实里，班纳克在 1791 年 8 月 19 日给杰斐逊写信，随信寄了亲笔年历，质问黑人为何被剥夺自由。1806 年住宅失火，他的大部分遗物损毁，至少一本手写笔记幸存。分支里还能另存他愿让人读的草算和观测笔记。
        - 让能核对送印稿和亲笔稿的人守着两个纸包。若能说服印坊为家外另存的一份留出时间，让班纳克自己挑要抄的页。
      points:
        p1: 理事把两份稿都翻到七月，看见差不多相同的一列数。你请班纳克指认给杰斐逊的那份，再请信使当面念出封上的收件人。信和亲笔年历捆在同一根细绳里；给印坊的纸平放在柜上。邮差读完地址，才把手伸向绳结。
        p2: 抄写人递来一个很厚的纸套。班纳克从底下抽出几页，留下有日期、能核查的观测和草算。他让你读一处改过的数，看抄本有没有把旧数也算进去。那份副稿送到住家外时，保管人照着第一页读了一遍日期。
      outcomes:
        all: 杰斐逊的回信确认两个东西都收到。多年后火烧到屋里，屋外那份副稿仍留着班纳克准人抄下的笔记。
        p1: 信和历书一起寄出。更多草算仍留在家里，后来随住宅里的许多物件一起损毁。
        p2: 住家外已有一份核过的副稿。邮包出了差错，员工短记只留着出门前在副稿上看见的日期。
      none: 屋里找不到分开标记的纸包。后来能读到的草算，仍只有原先侥幸留存的部分。
      not_admitted: 印坊的人关上箱子前要核来客的名字。没认出来，他把纸包放回班纳克的门边。
      desync: 印坊从桌上取走了唯一能随信寄出的历书。信件失去史有的附件，事务所召回员工。
      excerpts:
        p1: 邮差读完地址，才把手伸向绳结。
        p2: 那份副稿送到住家外时，保管人照着第一页读了一遍日期。
    relic: 一张留底的信包签
    relic_desc: 留底签，写明里头有历书，也有随附的信。
    points:
      p1: 替班纳克隔开给印坊的底稿，护住他要随信寄出的那份亲笔年历
      p2: 请班纳克选定愿意交人抄录的底稿，把核过的一份交到住家以外的地方保存
    points_fail:
      p1: 唯一能随信寄出的抄本被印坊带走，信里没有年历可供查验。这条分支与史实脱节，员工当天被召回。
      p2: 草算依旧集中留在家中，多数手稿和住宅一起烧失。
    shift:
      p1:
        was: 1791 年 8 月 19 日，班纳克写信给杰斐逊，并随信附上一份亲笔抄写的年历。
      p2:
        was: 1806 年班纳克下葬当天，他的住宅失火，许多手稿随之烧毁。
        now: '{staff}请班纳克指定哪几册可以交给外地保管，再请印坊替他复抄。后来家中失火，校过的观测和推算还有一份可查。'
        who: banneker_maryland
        bio: 除了原本留存的笔记，又有一部分班纳克的工作底稿由于另存而传了下来。
    vignettes:
      packet: 蕾切尔看见首页排着月份，就要给包裹写上算表。你把信搁在边上，请她读过收件地址，再把签写完。她用一根线把两件包在一起。表随寄件人署名上路，他要说的话也跟着去。
      handoff: 艾萨克的挎包还能塞进一个薄信包，信上的封蜡还软着。你撑开包纸，让他插一片折纸，把信和表隔开。他两件都带上了。你多站了一会儿，看桌上信包留下的一小块空地。
      reply: 你知道很快会有回信。艾萨克问，这样信里说的事就能解决吗？你抄下寄出日期，把回信那格照原样留空。信包已经上路，还没有任何承诺回来。
  seacole_balaklava:
    name: 自己找路去的战地客栈
    place: 巴拉克拉瓦
    figure: 玛丽·西科尔
    story: 玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。
    story_prose:
      opening:
        - 巴拉克拉瓦路旁的旅馆刚开柜，玛丽·西科尔把到临时医院用的包往门边推。托马斯·戴问今天备了几份货，她说先去看看伤员，其他事回来再算。
        - 1855 年 6 月 18 日，西科尔记下战斗当天自己在临时医院附近照看伤员，也记下拇指受伤。她与戴经营的旅馆还遇到失窃，和约后于 1856 年破产。这里可以护住当日照护，再分别处理受伤、马匹和积货。
        - 派有照护经验的人跟她去。夜里要有熟悉旅馆的人照管马厩，随后还需会算账的员工同两位经营者讨论何时停止进货。
      points:
        p1: 从路边来的人伸手问能不能给临时医院捎些东西。你把门边那个包和多的一份水交给搬运的人，和西科尔对清谁在靠近病榻的地方等。等她走到医院边，先前问话的人已经给她留出一处可以搁包的位置。她放下包，叫最近的伤员先说要什么。
        p2: 西科尔扶住右手，说拇指一动就疼。你请一位照护者就近来帮她，先问愿在哪儿坐，然后替她叫人接下手里的包。歇了一会儿她抬起手说轻些了，让来查看的人留一张纸给她记病人的名字。
        p3: 后门传来动静，伙计起身才发现马厩原来没人看。你请一人把西科尔叫来，另一人到能看见的地方点马，不跟黑处的人起冲突。听见院内有人应声，门外的动静停了。早晨开门，昨天要套车的那几匹都还在槽边。
        p4: 戴准备再进一批货，西科尔让他把还在货架上的数给你听。你请他们把预订、现货和欠账另列一张，再问哪些能在撤军前卖清。两人核过一遍，划去下一次进货。西科尔把账合上那天，柜台后还有空架留给最后来取货的人。
      outcomes:
        all: 西科尔完成了路边的照护，之后能继续使用自己的手。马和账都有人看守，旅馆停业后两位合伙人还清了账。
        p1: 她按自己的安排在临时医院旁帮伤员，晚上才回到旅馆。
        p2: 她的拇指得到了照护，后来拿笔记字时方便些。
        p3: 夜里想牵走马的人没得手，来车的人第二天仍能从马厩取马。
        p4: 西科尔和戴按清单结账，撤军时没被最后一批货拖住。
      none: 柜上的货没点清，路边的人仍等到后来才有人照护。
      not_admitted: 伙计请来客别挡运货的门。医院要取的包不在你的交接单上。
      desync: 西科尔没能按史实到路旁照护。事务所因同步失败召回员工。
      excerpts:
        p1: 她放下包，叫最近的伤员先说要什么。
        p2: 歇了一会儿她抬起手说轻些了，让来查看的人留一张纸给她记病人的名字。
        p3: 早晨开门，昨天要套车的那几匹都还在槽边。
        p4: 西科尔把账合上那天，柜台后还有空架留给最后来取货的人。
    relic: 一只药箱
    relic_desc: 一只旧木药箱，里面分格放着草药和纱布。
    points:
      p1: 6 月 18 日进攻棱堡失利那天，在炮火下护住西科尔在沃龙佐夫路临时医院旁照看伤员
      p2: 她为躲炮弹扑倒摔脱了右手拇指，当场替她复位、上夹板
      p3: 拦下夜里来偷英国旅馆马匹的贼
      p4: 塞瓦斯托波尔陷落以后，劝西科尔和托马斯·戴停下进货、结清账目，不让和约一来他们就破产
    points_fail:
      p1: 那天她没能走到临时医院，伤员在路边等不到包扎。这条分支与历史脱节，员工被送回。
      p2: 拇指只是当场草草包上，这条分支里和历史上一样，再也没长回原来的样子。
      p3: 一夜之间马厩空了大半，旅馆还得去陆军运输营借牲口下山拉货。
      p4: 和约之后军队撤走，存货卖不出去，1856 年 11 月两人在伦敦被宣告破产。
    shift:
      p1:
        was: 1855 年 6 月 18 日，联军进攻棱堡失利，西科尔带着绷带和食物冒着炮火走到沃龙佐夫路旁的临时医院，帮医生照看伤员。
      p2:
        was: 1855 年 6 月 18 日，西科尔为躲炮弹扑倒在地，摔脱了右手拇指，当场包扎，此后再没恢复原形。
        now: '{staff} 当场把关节复位、上了夹板。几周后她的右手照常调药、包扎。'
      p3:
        was: 1855 年，春山的英国旅馆屡遭偷窃，有一天早上起来，马厩里的马大半不见了。
        now: '{staff} 守夜时拦住了牵马的人。第二天旅馆的车照常下巴拉克拉瓦取货。'
      p4:
        was: 1856 年 3 月和约签订后军队很快撤离，西科尔与戴剩下卖不掉的存货和欠款，同年 10 月被人申请破产，11 月在伦敦被宣告破产。
        now: '{staff} 在秋天说动两人停了大宗订货，把赊账一笔笔收回。和约来时存货已经不多，他们清了账离开克里米亚，没有走进破产法庭。'
        who: seacole_balaklava
        bio: 这条时间线里，西科尔从克里米亚回来时没有破产，手里还有一笔本钱。她不必靠众人捐款度日，用自己的钱继续行医和远行。
    vignettes:
      meal: 一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。
      counter: 两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。
      shelf: 店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。
  mitchell_nantucket:
    name: 云过来以前，先标下这块天
    place: 楠塔基特
    figure: 玛丽亚·米切尔
    story: 《玛丽亚·米切尔生平、书信与日记》所录的书信记载，她在 1847 年 10 月 1 日于楠塔基特发现一颗需用望远镜观测的彗星。父亲记下发现，并托首班去大陆的邮船寄信给哈佛天文台主任。
    story_prose:
      opening:
        - 楠塔基特的屋顶上有一阵风，玛丽亚·米切尔把便笺压到灯座下面。她要记下看见天体的方位和时刻。父亲在下层等着听她读一遍；风雨还拦着邮船。
        - 1847 年 10 月 1 日，米切尔发现一颗彗星。她父亲给剑桥的威廉·邦德写信，发现后来经交涉获颁丹麦金牌。这里可以先确保通知搭上首班离岛邮件，再写一份给丹麦方面指定的人。
        - 能认读星图或读准时刻的人可帮忙核通知，熟悉邮务的人可办两处收件地址。
      points:
        p1: 玛丽亚念出时刻，父亲问一遍是沿哪颗亮星找上去的。你把指示重读给他听，发现写给邦德的通知还少了日期。墨刚干，码头那边就传来准备装船的声音。邮差把第一封信塞进袋里时，日期已经能读清。
        p2: 第二张纸上有同样的观测时刻，信封却不能照抄头一份。你把公告所列的收件人读给邮差听，让他给这封信另记一条去向。玛丽亚在边上等他写完，才收起她那份观测。两封都出了岛，只有一封要过大西洋。
      outcomes:
        all: 丹麦收件人收到按例填写的发现通报。到评奖时，米切尔拿得出首次寄送的记录，不必另请人补陈经过。
        p1: 剑桥收到首班邮船带来的发现通知。关于金牌的通信还要另起一轮。
        p2: 另一个收件地址已经核对。通向剑桥的首班邮件出了差错，这个分支无法完整保留。
      none: 屋顶的便笺仍在家中。法律和奖励都不会随着一条未寄的观测自己改变。
      not_admitted: 家人从楼下问来客是谁。便笺留在屋顶，你只能听见邮差从街上走过去。
      desync: 码头那封给邦德的通知没赶上首班邮件。事务所按脱节召回，屋里的原始观测还在。
      excerpts:
        p1: 邮差把第一封信塞进袋里时，日期已经能读清。
        p2: 两封都出了岛，只有一封要过大西洋。
    relic: 一架小望远镜
    relic_desc: 一架小小的黄铜望远镜，镜筒上有海盐的痕迹。
    points:
      p1: 把家人写好日期的发现通知备齐，赶上首班送往剑桥天文台的离岛邮件
      p2: 赶在第一班邮船开走前，再寄一份给丹麦方面指定的收件人，免去米切尔后来为金牌补申
    points_fail:
      p1: 观测记录仍在家中，但通知没赶上首班邮船。这条分支与史实脱节，员工被召回。
      p2: 通知只寄给天文台，评奖人因未按要求及时通报而不能按例授奖。
    shift:
      p1:
        was: 1847 年 10 月 3 日，米切尔的父亲写信把 1 日的发现告知剑桥天文台，信随发现后首班离岛邮件寄出。
      p2:
        was: 1848 年的奖项通信记载，发现消息没有按规定立即报给指定收件人。丹麦方面另行审理后，米切尔获得金牌。
        now: '{staff}查清通知应送何处，帮家人把另一个写好地址的信封赶上同一班船。评奖人已有在期限内通报的记录，可以按例审理。'
        who: mitchell_nantucket
        bio: 米切尔凭按期送到的发现报告获得认可。她开始在自己的记录里同时保留观测日、发件日和收件人。
    vignettes:
      field: 帮工只画了一个淡点。你问他下次靠什么把镜头转回这里。云遮上来前，他补了两颗星和一个方向。你把这些抄走，还没有第二次位置可以对照。
      post: 你知道消息得送出海岛。帮工还没写清看见的东西，就想把发现先记上去。你把日期和星野另写一张，留下一行等复核。纸包送去岸边时，那一行仍空着。
      cloud: 云挡住淡点时，你在原地拿着草图等。折纸前你圈一颗熟星，即使淡点不见了，也能从它找回这片天。你带回一个可以再找的位置，收队前仍没人看见第二次。
  caroline_herschel_slough:
    name: 扫天的人
    place: 斯劳
    figure: 卡罗琳·赫歇尔
    story: 卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。
    story_prose:
      opening:
        - 斯劳入夜以后，卡罗琳·赫歇尔让帮手把灯移开一点。她刚标的光团在目镜里边缘发虚，旁边的亮星还清楚。要想过一夜再找回来，她得把这一刻的图画给自己看。
        - 史实里，赫歇尔比较 1786 年 8 月 1 日和 2 日的观测，带着图致信查尔斯·布拉格登。她后来有了助手薪金，兄长观测时仍要替他记读数。这条分支可以争取固定给她自己的夜晚。
        - 会读钟和对星图的员工先帮忙做两份能比的记录。擅长交涉的人可以把她的观测排班和报告一并交出去。
      points:
        p1: 第一张图打了三个点。帮手把第二张转错了方向，你请赫歇尔从同一颗参照星讲起，逐个指回原位。两张纸边都补上时刻。她把它们对着灯并好，自己在信里写下那团光相对星点的变化。她收起第二张时，把第一夜的时刻留在外侧。
        p2: 来收报告的人只给星图留了空位。你请赫歇尔把一页排班放上去，让对方看看她在记大望远镜读数的晚上还能剩多少时间。她亲手在两处空行写上自己的名字，请来人把这两类晚上分别列明。在之后的排班上，她能先圈出归自己的夜晚。
      outcomes:
        all: 观测图和她需要的时间都随信留下。后来定助手工作时，几夜明确让她自己安排。
        p1: 信中留下两夜观测的对照和图。她以后仍须在兄长的工作间隙安排自己的望远镜。
        p2: 一页排班表已经递出。失去第一夜的参照点后，本趟只能保存交出的这份请求。
      none: 第二张图摆在第一张旁边，仍凑不齐可核的参照。排班维持原样。
      not_admitted: 帮手请来客别挡着梯子。灯遮好以后，员工仍留在下层。
      desync: 低处起雾，第一夜少了可认的参照星。第二夜已无法和它比较，事务所发来召回。
      excerpts:
        p1: 她收起第二张时，把第一夜的时刻留在外侧。
        p2: 在之后的排班上，她能先圈出归自己的夜晚。
    relic: 一把天区扫描记录尺
    relic_desc: 一把刻着刻度的木尺，用来在星图上标出扫过的天区。
    points:
      p1: 在两夜的图上都标清观测时刻和参照星，让赫歇尔能对比两张图，说明那团光移动了
      p2: 拿首份彗星报告为赫歇尔争取固定的独立观测时段
    points_fail:
      p1: 低空的薄雾让第一张图缺少足够的参照点。第二晚画出的光点没法用来比较位移，这条分支与史实脱节，员工被召回。
      p2: 每逢兄长用大望远镜，她仍得整晚记他的读数，自己的观测只能挤在空当里。
    shift:
      p1:
        was: 1786 年 8 月 1 至 2 日，卡罗琳·赫歇尔记录了疑似彗星的位置变化，随后寄出观测和附图。
      p2:
        was: 1787 年，卡罗琳·赫歇尔作为兄长的助手领取薪金，她在首次报告中已说明助手工作占去自己的观测时间。
        now: '{staff}让赫歇尔把第一份观测报告连同自己的观测排班交给愿意支持她的人。后来议定助手职责时，每月另留给她几个可自行安排的夜晚。'
        who: caroline_herschel_slough
        bio: 赫歇尔担任有薪助手后仍有固定的自主观测时段。她能提前安排自己的寻彗工作。
    vignettes:
      fixed: 你先记下两颗较亮的邻星，再添模糊的那个。第二张纸虽然挪了位置，仍能靠那两颗星找回原处。
      doubt: 帮手说兴许该擦擦镜片。你问同一片玻璃里的别的星怎样。那些仍然清晰，他便把这处可疑的记号留在纸上。
      lamp: 帮手记时刻时，你用手遮住灯。把灯盖好以后，两张图旁都还留着各自的时刻。
  kovalevskaya_stockholm:
    name: 写在首页的前提
    place: 斯德哥尔摩
    figure: 索菲娅·柯瓦列夫斯卡娅
    story: 柯瓦列夫斯卡娅关于刚体绕定点转动的论文发表于 1889 年的《数学学报》。她找到一种可积分的情形，对转动惯量与质心位置有特定要求。
    story_prose:
      opening:
        - 斯德哥尔摩，校对人用铜陀螺压着一张散页。柯瓦列夫斯卡娅拿给他的是工作稿，桌另一头还有修订稿。两份首页写的都是刚体转动，看标题分不出哪里改过。
        - 史实里，她因这项研究获 1888 年博尔丹奖，论文于 1889 年刊行，同年在斯德哥尔摩获正式教授职位。这趟要保证刊行稿带着完整前提，也可以让学校早点书面确认聘期。
        - 找能对照符号和图的员工守住寄刊纸包。巴黎的消息到了以后，让善于办理书面交接的人带着她的课程清单去问学校。
      points:
        p1: 校对人指着陀螺的尖端问是不是质心。你画两个点，让他在首页找哪个叫定点，再回去读写质心的那条前提。柯瓦列夫斯卡娅核过两页的符号，让你把重抄的一页放进纸包。陀螺留给校对人，装订后的第一行重新有了条件。
        p2: 校方的文书把获奖消息摆到一边，问目前的课谁来上。你和她沿着清单逐日读过去，指出第一堂需要提前安排的课。文书带着这张清单去问，再拿回写有起聘日期的回函。她把回函夹在下学期第一周的课表上。
      outcomes:
        all: 送刊的稿子保留了条件，聘期也及时有了书面日期。她把课表上留给研究的几个时段写定。
        p1: 正确的首页随论文一起送出。学校仍未书面回复，她要先把课排下去。
        p2: 她已经拿到写明日期的回函。送刊稿出了岔子，回程只留下回函交到她手里的片段。
      none: 两摞纸仍压在陀螺底下。员工翻到那张课表的时候，起聘日期还是空着的。
      not_admitted: 校对人先收起稿件，礼貌地说明得等作者认人。员工留在外头，听见铜陀螺撞到桌沿。
      desync: 缺了条件的早稿进了寄刊纸包。原有刊行记录无法重合，事务所召回员工。
      excerpts:
        p1: 陀螺留给校对人，装订后的第一行重新有了条件。
        p2: 她把回函夹在下学期第一周的课表上。
    relic: 一只陀螺模型
    relic_desc: 一只铜陀螺，轴上刻着编号。
    points:
      p1: 在斯德哥尔摩把工作稿与修订稿逐页核对，免得早稿混进准备给刊物的纸包
      p2: 拿着巴黎的获奖消息和她承担的教学清单去找校方，请他们书面确认新聘期何时开始
    points_fail:
      p1: 送刊的纸包里混进了早稿，首页少了前提。刊行记录偏离原历史，事务所召回{staff}。
      p2: 获奖消息传到了学校，她排下学期的课时仍拿不到书面的起聘日期。
    shift:
      p1:
        was: 巴黎科学院于 1888 年 12 月公布博尔丹奖，表彰柯瓦列夫斯卡娅对刚体转动的研究。增订论文于 1889 年在《数学学报》刊行。
      p2:
        was: 她于 1889 年在斯德哥尔摩获正式教授职位。
        now: 这条分支里，校方提前书面确认了起聘日期，她可以据此安排下一学期的教学和研究。
        who: kovalevskaya_stockholm
        bio: 柯瓦列夫斯卡娅在斯德哥尔摩教学并研究刚体转动。国际评奖及本地的工作条件分别由不同机构决定。
    vignettes:
      conditions: 练习纸上省写成了「一个转动的刚体」。你照首页补回两类条件，一类管转动惯量，一类管质心在哪儿。校对人把两条都誊上纸条。你能抄走这两条更正，刊物还没有印出来。
      diagram: 校对人想拿一只陀螺试。你画了一个固定不动的点，再标出代表质心的另一个点。他拿到下一张图就能分清两个地方。收队时陀螺仍在转，这一转证明不了论文。
      clip: 你把前提折在练习纸外头，又把散开的图纸夹在里面。下一个人会先看见条件，再看到结论。你带回陀螺的轮廓，证明还留在桌上。
  chaco_sun_watchers:
    name: 木板上的第二道影
    place: 新墨西哥州查科峡谷
    figure: 查科峡谷的人们
    story: 公开发表的查科峡谷法哈达孤丘测量记录记下，在一年中的特定时候，接近正午的光会落到螺旋岩刻上。这段练习不给真实的刻纹定年，也不判定其原始用途。
    relic: 一张双影线草图
    relic_desc: 同一块木板摆在原地时描的两道影。
    points:
      p1: 看出影边在哪儿移了一点
      p2: 木板不挪位置，再描一次影边
      p3: 帮工折回来复核时留在标记处
    vignettes:
      two: 帮工把木板转向你，两道线却没法互相对照。你让板脚回到第一记，请他重新描一遍。这回两刻的影边能放在一起看了。下一个季节已经超出你能待的时间。
      sky: 你知道后人还会研究光怎样落到岩面。帮工想先给小板上的影起个名字，你请他先画下板摆在哪里。你带走的是摆放位置图，第二回天清时的影子没赶上。
      wait: 你把一粒小石子搁在木板旁，等能描第二道影，再抬起板。纸上两道线共有一个站位，你都带了回来。只待这么久，还说不清过一年会怎么变。
  rapa_nui_moai:
    name: 采石场的一前一侧
    place: 拉帕努伊岛，拉诺拉拉库
    figure: 拉帕努伊的石像匠人
    story: 拉帕努伊岛上的摩艾，多数是在拉诺拉拉库火山的采石场里，直接从火山凝灰岩中凿出来的，年代估计在十三到十六世纪之间。1722 年 4 月 5 日复活节那天，荷兰航海家雅各布·罗赫芬到达这座岛。
    relic: 一把石斧
    relic_desc: 一片手掌大的深色玄武岩刃，磨出了干净的刃口。
    points:
      p1: 护住一尊运往海边的石像，不让它在路上扑倒
      p2: 帮匠人们读懂 Te Tokanga 背后的岩层，把它的背从山体上多凿开一段
    points_fail:
      p1: 石像在半路扑倒，断成了两截，这条分支里海边少了一尊照史实立起来的石像。
      p2: Te Tokanga 照史实停在半途，这条分支里它的背还和山连着，和今天一样。
    shift:
      p1:
        was: 大约从十三世纪起，拉帕努伊人把一尊尊石像从采石场运到海边的平台上。
      p2:
        was: Te Tokanga 一直没有凿完，背脊连着山体，今天仍躺在拉诺拉拉库的采石场里。
        now: '{staff}替匠人们找准了岩层的走向，它的背从山上多凿开了一段。它后来有没有离开山体，没有记载。'
    vignettes:
      pair: '{staff}先标清哪张是正面、哪张是侧面，才把两张并在一起看，岩上的一道凸脊就不会被当成脸的边。'
      surface: '{staff}走回坡上最先站的地方，在图上补了一支箭头，标出是从哪里看的。'
      height: '{staff}从正面描一遍头顶，又绕到侧面描一遍，把两张纸条在同一处对齐。'
  hargrave_stanwell_park:
    name: 第四只风筝
    place: 澳大利亚斯坦威尔公园
    figure: 劳伦斯·哈格雷夫
    story: 劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。
    story_prose:
      opening:
        - 1894 年 11 月，斯坦威尔公园。劳伦斯·哈格雷夫已试验箱形风筝一年多。十二日，海滩上排了四只，打算用一根绳串起来。
        - 史实里，四只风筝把他拉到离地近十六英尺。哈格雷夫后来送去慕尼黑的模型大多毁于战事。在这条分支里，海滩的帮手手上有签条，也有地方摊开一份图。
        - 这一趟用得上懂风向、能稳住长绳的人，也用得上能核对尺寸、把四套做法画清楚的人。
      points:
        p1: 阵风扯偏了外侧的风筝。{staff}看着绳的走向同帮手往侧面挪，等四只又拉成一线，再陪着落地的人稳住牵绳。座椅的脚碰到沙，留了两个挨得很近的印。海滩上的人还拉着绳，直到第一只风筝落低。
        p2: '{staff}按骨架逐一核尺寸和签条，把四只风筝怎样做、怎样串在一起画成一份，留给当地保管。四张图在风里翻到最后一张。哈格雷夫把一截绳横放在图上，压住拴点旁的纸角。'
      outcomes:
        all: 离地的高度写进了记录，另一份做法图留在澳洲。后来有人摊开那一叠图，四只之间的线还连着。
        p2: 许多年后，斯坦威尔公园仍有一份图可查。翻到最后一张，还看得见那根线在哪里打结。
        p1: 那次离地的高度写了下来。翻到存着照片的地方，沙滩上的四只风筝还在一条线上。
      none: 风继续从海上过来。沙丘边的绳盘一截一截松了下去。
      not_admitted: '{staff}没能加入海滩上的人。远处有人把一根绳拉直，话音到沙丘边就散了。'
      desync: 座椅落在沙地上，绳却松了。{staff}被召回时，还有一张签条在骨架边响。
      excerpts:
        p2: 四张图在风里翻到最后一张。哈格雷夫把一截绳横放在图上，压住拴点旁的纸角。
        p1: 座椅的脚碰到沙，留了两个挨得很近的印。海滩上的人还拉着绳，直到第一只风筝落低。
    relic: 一片箱形风筝的备用签
    relic_desc: 一片给箱形风筝骨架用的备用签。
    points:
      p1: 11 月 12 日，在阵风里护住那串风筝，让他升起来，再平安落回沙地
      p2: 帮他完成这四只风筝的尺寸和做法图，在澳洲留下一份
    points_fail:
      p1: 一阵风把风筝串扯偏了，座椅砸回沙地，这条分支里没有那次离地 16 英尺。
      p2: 这四只风筝照史实只留在他自己手里，这条分支里斯坦威尔公园没有另一份。
    shift:
      p1:
        was: 1894 年 11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。
      p2:
        was: 1894 年，这四只风筝的做法只在哈格雷夫自己手里；他晚年把模型送去慕尼黑，大多毁于二战。
        now: 那四只风筝的图纸在斯坦威尔公园留了一份，没有跟着别的模型去慕尼黑。
        who: hargrave_stanwell_park
        bio: 哈格雷夫 1894 年那四只箱形风筝的尺寸和做法图在斯坦威尔公园留了一份。他的模型后来大多毁于二战，这四只怎样做的，在澳洲仍查得到。
    vignettes:
      four: 升空以后，{staff}沿着沙上的风筝数到四。铅笔画了一个长括号，把四个数圈在一处。
      tag: 签条从骨架上脱开了。{staff}沿着湿沙找回它，抖掉纸背的水，把绳结又系紧一点。
      lift: 先放一只试风时，{staff}跟帮手站在沙丘上。绳一斜，前面那个人先往侧边跑了两步。
  sun_yat_sen_guangzhou:
    name: 从铜像到一所新大学
    place: 广州
    figure: 孙中山
    story: 你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。同一段日子里，他星期天在高等师范的礼堂演讲，讲稿在几个人手里来回走，后来成了一本书。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。
    relic: 孙中山铜像
    relic_desc: 中山大学校园里的孙中山铜像。它是通往 1924 年广州的穿越媒介，不是古董，不能出售。
    points:
      p1: 替筹备处排好城外的招生告示张贴路线，交给送告示的人
      p2: 经人引荐走访三所学校，赶在第一次筹备会议前交回一张汇总单
      p3: 替筹备处踏勘备选校址，在石牌定下来之前交回一张比较图
      p4: 核对三校的毕业名单，为 6 月 21 日的典礼交上一份统一名册
      p5: 跟筹备处的人去石牌，把新校地的界桩一根根立稳
    points_fail:
      p1: 这条分支里，招生告示只贴在城里，城外的学生知道消息时，报名已经开始了。
      p2: 第一次筹备会议照史实召开，三所学校的难处仍是各说各的，没有一张合在一起的单子。
      p3: 选址照史实定在石牌，筹备处桌上没有一张把几处校址画在一起的图。
      p4: 6 月 21 日的毕业典礼照常举行，筹备处仍要分开查阅三份名单。
      p5: 石牌的校地照史实只划在纸上，地上一根界桩也没有立。
    shift:
      p1:
        was: 1924 年 6 月 9 日，国立广东大学委托各省教育厅招生；6 月 10 日，预科考试开始报名，原计划招 520 人。
        now: 这条分支里，城外的路口和码头上也贴着招生告示。
      p2:
        was: 1924 年 3 月 3 日，第一次筹备会议召开，议题里头一件是三所学校学生的毕业问题。
        now: 这条分支里，会上摆着一张把三所学校的难处列在一起的单子。
      p3:
        was: 1924 年，各校分散各处，管理不便，孙中山命邹鲁择石牌为新校址，当年划定土地。
        now: 这条分支里，选址的文书旁边多了一张把几处校址和石牌画在一起的图。
      p4:
        was: 1924 年 6 月 21 日，邹鲁就任国立广东大学校长，同一天为原三所学校的毕业生举行毕业典礼。
        now: 这条分支里，筹备处办典礼时有了一份核对过的统一名册。
      p5:
        was: 1924 年孙中山命邹鲁择石牌为新校址，可新校舍 1933 年才动工，1934 年秋第一批学院才迁入。孙中山 1925 年 3 月 12 日去世，生前没有见到。
        now: 这条分支里，11 月他离开广州之前，石牌校地的界已经一根根立定。
        who: sun_yat_sen_guangzhou
        bio: 这条时间线里，孙中山离开广州之前，新校址石牌的界已经立定。
    shift_all: 五件差事都办妥了。回来再读孙中山后来亲笔题写的校训，才看出这五件事与「博学、审问、慎思、明辨、笃行」的呼应。
    vignettes:
      slips: 一位编出来的办事员正要抄一页稿子，稿上有一张签条盖住了两行。你问他签条是谁的字，稿子又是谁的字。他先抄了稿子，签条留在原处没有动。
      back_row: 一位编出来的学生找不到座位，老是站起来张望。你往里挪了挪。他坐下来听完了后半场，一句话没说，散场时朝你点了点头。
      hundred: 你在本子最后一页画正字，一天一笔。画满一百天的时候，一位编出来的办事员问你在数什么。你说，日子。
  david_fleay_healesville:
    name: 等科里自己出来
    place: 维多利亚州希尔斯维尔野生动物保护区
    figure: 戴维·弗莱
    story: 1943 年末，希尔斯维尔保护区的鸭嘴兽吉尔孵出一只幼兽，后来取名科里。1944 年 1 月，戴维·弗莱和同事打开巢穴，确认幼兽已经孵出。2 月 26 日，弗莱第一次观察到科里出洞游水。
    story_prose:
      opening:
        - 希尔斯维尔保护区泥土还很松。弗莱打开观察处，想看看鸭嘴兽幼崽科里，再把它送回吉尔的巢。饲养员的靴尖停在塌下来的土边。
        - 史实里，科里是首只在圈养条件下成功育成的鸭嘴兽。1944 年 2 月 26 日，弗莱观察到它自行出巢。到了三月的公开亮相，保护区用了铁锹把它带出来。这里可以让照料继续，也可以请观众再等一会儿。
        - 留心泥土的员工帮弗莱守住洞口。懂动物习性的人可以给吉尔留些它自己会取的叶子。最后要有人和饲养员商量，能否把铁锹放下。
      points:
        p1: 你朝饲养员摆手叫他别再往前。鞋停住时，一小片土顺着洞沿滑下来。你替弗莱稳住洞口边上那块木板，腾出了他送科里回去的余地。弗莱等里面安静下来，才把手收回。
        p2: 饲养员抱着叶子走到水池边，正要往巢旁放。你指给他看吉尔昨晚常上岸的浅边，让他把叶子留在那里。入夜前你们都退开了。吉尔蹚过浅水，嘴里衔着叶子掉头往岸边走。
        p3: 有人瞧了三次表，饲养员已经把铁锹提到围栏边。你问弗莱，可不可以在牌子上只写「等它出来」。前排一个孩子让给后面的人看水面，饲养员把铁锹靠回棚下。科里露出嘴的时候，站得最近的人也没有出声。
      outcomes:
        all: 科里从巢里出来游了一圈。展场后来仍记着这个下午，围栏旁没有留下铁锹挖土的痕迹。
        p1: 洞边的板子移下来时，科里已经回巢。这趟守住了早期育成记录。
        p2: 水边的叶子少了几片。再往巢旁走要踩下去，饲养员把脚从浅泥里拔了出来。
        p3: 人群等到科里自己出现。回程报告保留了这次亮相，并略去了史实中为亮相动用铁锹的记录。
      none: 水池边没有人再换叶子，游客仍等在离开前的最后一班车旁。
      not_admitted: 饲养员请来客在围栏外等。到关门，围栏内没有人来领你。
      desync: 松土堵住了洞口，弗莱没能及时把幼崽送回巢。原有育成记录脱节，事务所召回员工。
      excerpts:
        p1: 弗莱等里面安静下来，才把手收回。
        p2: 吉尔蹚过浅水，嘴里衔着叶子掉头往岸边走。
        p3: 科里露出嘴的时候，站得最近的人也没有出声。
    relic: 一把木饲料勺
    relic_desc: 一把小木勺，柄已经磨光了。
    points:
      p1: 挡住落进洞口的松土，让弗莱来得及把科里送回巢里
      p2: 请饲养员在水池边备些新叶，让吉尔天黑后能自己衔取
      p3: 科里在全家亮相前躲进洞里，劝保护区放下铁锹，等它自己出来
    points_fail:
      p1: 弗莱还没来得及把科里送回去，松土就堵住了洞口。这条分支失去了首次成功育成的记录，{staff}当天因同步失败被召回。
      p2: 饲养员照常离开。吉尔要衔叶子，还得沿着岸边多走一段。
      p3: 约好的钟点过了，保护区还是用了铁锹。科里被带出来时，多数观众已经走了。
    shift:
      p1:
        was: 1944 年 1 月 3 日，弗莱把幼兽送回受扰的巢里，吉尔后来继续把它养大。
      p2:
        was: 弗莱记下了打开巢穴后，吉尔把一部分垫窝的材料和泥土推出洞口。
        now: 这条分支里，{staff}请饲养员把叶子留在水池边。吉尔天黑后可以自己衔取，饲养员也不用再开洞。
      p3:
        was: 1944 年 3 月，全家亮相时科里躲进地道，保护区动土把它挖出来时，多数观众已经离开。
        now: 这条分支里，{staff}拿晚间观察记录说服饲养员收起铁锹。留下的观众可以在池边等，也可以改天再来。
eras:
  broad_street_1854:
    vignettes:
      odd_address: 虚构书记员埃伦傍晚要交街单，正想划掉一个离泵太远的地址。你问那家人的水是从哪儿来的。露丝能认准门牌，还得等打水的人来说。埃伦搁下笔。那一栏可以空，地址先别划掉。
      witness: 虚构邻居露丝把地址念了几遍，埃伦就要收表。你请露丝照脚走的路说一遍。到说起转弯，她停下来，回手指向那口泵。埃伦亲手补了走法。真正提水的人还没到。
      street_list: 埃伦可以拿了原册就走，也可以等你抄完。你念门牌，她用指尖挨个跟过去。有个记号该再挪一户。原册还是按时交了出去，校过的双栏副页留在桌上。
