    bio: 在伊斯法罕的巴扎卖诗集，能把人说动买书，有时顺带也说动一点价钱。
    story: 礼萨从叔叔那里继承了伊斯法罕巴扎拱廊下的一间书店，连同一万一千本没整理的书，和一张能说会道的嘴。他读四种语言，给小杂志翻译法语和英语的随笔。他能对游客背哈菲兹的诗，对出租车司机背公交时刻表，看到顾客像是有钱，也不是不会把价格往上凑一凑。面对香烟、借钱的请求和第二壶茶，他一点定力也没有，多年的灰尘和烟让他的咳嗽始终没有好透。钱总是从他手里漏走，借出去的书也很少还回来。他最想找到叔叔发誓说就在书架某处的那份遗失的手稿。
    sayings:
      full:
        - 出发前我翻了一页哈菲兹，签是好签。
      part:
        - 书卖出去几本，价钱也顺手抬了一点。
      none:
        - 没人买书，我就念诗给自己听，听众很满意。
      rough:
        - 狼狈了点，诗一句也没忘。
  s_leyla:
    name: 蕾拉·耶尔德兹
    ethnicity: 土耳其人
    jobs:
      - 建筑实习生
      - 插画师
    bio: 在电车票背面画房子，凡事先说好，再回头担心。
    story: 蕾拉在伊斯坦布尔一间茶园楼上的公寓长大，常在阳台上画渡轮和宣礼塔。去年夏天她从建筑学院毕业，现在在一家事务所实习，负责修复博斯普鲁斯沿岸的旧木屋，周末还给一本杂志画小幅插画。她在这一行里是个普通的学生，不比同学强，也不比同学差。她爬脚手架毫不犹豫，什么工地都答应去，夜里却睡不着，想着自己够不够好。导师说她的草图很大胆，交图的时间却不大胆。她想给一个没有图书馆的街区设计一座小小的图书馆。
    sayings:
      full:
        - 我先答应的，结果真成了！今晚的茶我请。
      part:
        - 画了半张，另一半在脑子里，脑子里那半更好看。
      none:
        - 我先答应了，现在……现在可以开始担心了。
      rough:
        - 吓得半死，不过我画了张速写，画得还挺好。
  s_aigerim:
    name: 艾格丽姆·苏尔塔诺娃
    ethnicity: 哈萨克族
    jobs:
      - 地质学家
      - 矿业顾问
    bio: 一年有半年在草原上，带着锤子和笔记本，野外不知疲倦，别处笨手笨脚又总倒霉。
    story: 艾格丽姆的祖父在草原上放羊，她从小就觉得大地本身是个会讲故事的人。她在阿拉木图学地质，此后每年有半年待在野外，另外半年给矿业公司做顾问。她在尘土和风里一天能走二十公里，从不觉得累。她的手对小东西很笨，瓶子、拉链和样品袋在她手里总是坏的坏、破的破。运气也不站在她这边。有一次她为了取岩芯，开着爆了胎的车跑了两百公里，雨却比她早到了一小时。一回到城里她就心神不宁。她梦想画出一张没人画过的古河道地图。
    sayings:
      full:
        - 石头开口了，连它祖宗八代的事我都听完了。
      part:
        - 走了二十公里，捡回一兜好石头，丢了一把锤子。我的运气就这样。
      none:
        - 草原那么大，偏偏我站的那一块什么也没有。
      rough:
        - 风把我吹倒三回，我爬起来四回。
  s_chidi:
    name: 奇迪·奥卡福
    ethnicity: 伊博族
    jobs:
      - 土木工程师
      - 工地经理
    bio: 在拉各斯的车流里修桥，认识每个官员的名字，没人看时爱省一道工序。
    story: 奇迪在苏鲁莱莱长大，学校门口的路每年七月都会被淹，他早早就想，总该有人来修好它。他学了土木工程，如今在拉各斯管着桥梁和排水沟的工地。他是个称职而普通的工程师，让他比同行强一点的是，他跟谁都能聊得起来。检查员和供应商都被他哄得高兴，哪位官员该打招呼，哪位该绕开，他心里一清二楚。有时他为了省下一周工期会削减一点规格，并告诉自己结构撑得住。母亲总问他什么时候结婚，他总说等下一座桥通车以后。
    sayings:
      full:
        - 桥修好了，每道工序都做了。真的，不信你去问。
      part:
        - 主体立起来了，剩下的细节……我认识人。
      none:
        - 没批下来。我认识的那位，那天刚好在开会。
      rough:
        - 出了点状况，问题不大。在拉各斯，这叫星期一。
  s_abebe:
    name: 阿贝贝·塔德塞
    ethnicity: 格迪奥族
    jobs:
      - 咖啡农
      - 合作社社员
    bio: 在耶加雪菲的陡坡上种咖啡，不合格的豆子一粒也不肯卖。
    story: 阿贝贝二十二岁接下父亲的坡地，园里有些树比他年纪还大。他手很笨，剪枝剪不直，挑果子也慢，合作社的账目更是算不来，只能请邻居代管。他靠的是一股拧不弯的意志。中间商压价、人人都往里掺次豆的那几年，只有他守着分级的规矩，被人笑了好些年。好在雨水多半赶得及时，渐渐有几个买家每季都回头找他。女儿在亚的斯亚贝巴读农学，回来时替他做精细的修剪，一边做一边争，他嘴上从不认输。
    sayings:
      full:
        - 这一趟值得煮满三轮咖啡：第一轮敬我，第二轮敬他们，第三轮讨个福气。
      part:
        - 好豆子挑出来了。次的？次的我一粒也不卖。
      none:
        - 树还没挂果，不能怪树。明年再来。
      rough:
        - 骨头磕了，可谁也别想往我袋子里掺一粒次豆。
  s_aisha:
    name: 艾莎·本阿里
    ethnicity: 阿马齐格族
    jobs:
      - 导游
      - 店员
    bio: 带游客穿行马拉喀什老城，嘴上功夫好，价钱和窘境都能说得过去。
    story: 艾莎小时候替叔叔的灯具铺跑腿，把老城的小巷摸得很熟，没有团要带的日子她仍在那间铺子里帮忙。她身体弱，灰尘和热浪每个月总有几天把她撂倒在床上。她没有恒心，古典阿拉伯语的课报了三次，也放弃了三次。靠着一张会说的嘴和一双利落的手，她样样都能混过去，法语、英语和一点西班牙语都是从客人那里学来的。运气也一直护着她，有位客人为一趟拖晚了的行程，一次付清了她整整一季的房租。报价时她不总说实话，自己心里清楚。
    sayings:
      full:
        - 价钱我砍了一半，对方还请我喝了一壶薄荷茶。
      part:
        - 一半的门开了，另一半，下回我带着最好看的笑去敲。
      none:
        - 这趟不算，就当是免费试游。
      rough:
        - 热浪又把我撂倒了，好在倒下的地方正好有人卖水。
  s_thabo:
    name: 塔博·莫科埃纳
    ethnicity: 索托族
    jobs:
      - 工会组织者
