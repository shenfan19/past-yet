  methodical: 条理
  hardy: 强健
  charismatic: 感召力
  quiet: 沉静
  wanderer: 漂泊
  attached: 重情
  streetwise: 机灵
  scholarly: 博学
  handy: 手巧
  artistic: 艺术感
  calm: 沉着
  cosmopolitan: 见多识广
  cheerful: 开朗
  vigil: 夜猫子
  faithful: 笃信
