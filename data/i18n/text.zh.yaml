      p2: 在难熬的日子里陪着他
      p3: 减轻他的一点痛苦
  kepler_leonberg:
    name: 母亲受审
    place: 莱昂贝格
    figure: 约翰内斯·开普勒
    story: 开普勒年迈的母亲卡塔琳娜在莱昂贝格被指控为女巫，他花了几个月为她辩护。
    relic: 一页数表
    relic_desc: 一页行星运行数表，他一直没有停下算。
    points:
      p1: 帮他把案子说清楚
      p2: 陪他熬过漫长的审讯
      p3: 在冰冷的牢房里陪卡塔琳娜坐一会
  pushkin_st_petersburg:
    name: 莫伊卡河畔的两天
    place: 圣彼得堡
    figure: 亚历山大·普希金
    story: 普希金在决斗中受伤，在莫伊卡河畔的寓所里度过了生命的最后两天，死时三十七岁，街上聚着许多人打听他的情况。
    relic: 一本诗集
    relic_desc: 一本小书，某首诗里夹着一片压干的叶子。
