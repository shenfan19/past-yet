        bio: 比萨的列奥纳多 1202 年的初编留下了一部完整的抄本，与 1228 年的修订本并存，后人能对出他这些年里改了什么。
    vignettes:
      rabbits: 烛火底下，{staff}在抄本里读到一道题：一对兔子每个月生一对小兔。{staff}忍不住在页边数到第十二个月，数出来的数，和后世课本上的一个也不差。
      zero: 码头的账房里堆着麻袋，{staff}教学徒把空着的一位写成零。学徒说这个小圈什么也不是，凭什么占一栏。{staff}让他把两本账对一遍，他就不吭声了。
      quay: '{staff}在阿诺河边帮人从船上卸货包，跳板踩上去吱呀作响，一包上岸就报一声数。岸上的账房一边听，一边在板上划一道。'
  giotto_padua:
    name: 有分量、有感情的人物
