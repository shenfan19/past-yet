      p3:
        was: 1749 年 9 月 4 日夜里，杜·夏特莱生下一个女儿，9 月 10 日在吕内维尔去世，死因一说产褥热，一说肺栓塞。
        now: 她熬过了产后那几天，秋天里身体慢慢复原。她亲自看着牛顿译本付印，此后又做了多年研究。
        who: du_chatelet_luneville
        bio: 杜·夏特莱在 1749 年产后活了下来，亲自把牛顿《原理》的法译与评注送进印坊，此后继续写作与研究多年。
    vignettes:
      stairs: 9 月 4 日一早，{staff}帮洗衣房的姑娘把一摞干净布巾送上楼。楼梯窄，两个人在转角把布巾一叠叠换手。姑娘说楼上半夜就点了灯，她躺着数脚步，到天亮已经跑了十一趟。
      candles: 八月底，{staff}帮宫里管蜡烛的老仆清点库房。拆开纸包，烛身上还粘着几根细碎的纸屑。老仆说侯爵夫人屋里的蜡烛比国王的书房还费，他这个月得提前一周报账。
      arbour: 十月，{staff}帮园丁取下凉亭的帘子，把沾了露水的一角往外折。园丁说，宫里今年安静得早，往年这时候还在这儿排戏。
  noether_gottingen:
    name: 署着别人名字的课
    place: 哥廷根
    figure: 埃米·诺特
    story: 1915 年，大卫·希尔伯特和费利克斯·克莱因把埃米·诺特请到哥廷根，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。1918 年 7 月 26 日，克莱因把她的论文《不变变分问题》呈交给哥廷根科学学会，9 月底她交了终稿。这篇论文把作用量的连续对称性与守恒定律联系起来。1919 年 6 月，她获准任教，直到 1923 年才第一次领到一小笔固定的教学薪酬。
    story_prose:
      opening:
        - 1918 年 7 月，哥廷根。三十六岁的数学家埃米·诺特三年前被大卫·希尔伯特和费利克斯·克莱因请到这里，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。这个夏天，她写成了《不变变分问题》，把作用量的连续对称性与守恒定律联系了起来。
        - 史实里，7 月 26 日克莱因把这篇论文呈交给哥廷根科学学会，她到 9 月底才交上终稿；第二年她获准任教，直到 1923 年才第一次为教课领到一小笔固定薪酬。在这条分支里，数学楼有个钉了好几个学期课表的工友，她住处的后院有个不再数面包票的房东太太。
        - 这一趟用得上几种人：教过大学、管过档案或做过校对的人，或者有条理、有学问的人，把署名的文稿和提要一起送到；管过档案、教过大学、又说得动系里的人，替她的讨论课要来一份课酬。
      outcomes:
        all: 1919 年 6 月，诺特试讲之后获准在哥廷根任教，任教资格论文就是那篇署着她名字的《不变变分问题》。在那之前，她的讨论课已经有了一笔课酬，跟她做题的学生每周有一段固定的时候可来。
        p2: 那个冬天，她的讨论课有了一笔课酬，跟她做题的学生每周有一段固定的时候可来。1919 年 6 月，她试讲之后获准任教。
        p1: 那篇论文照期呈交，印本上署的是她的名字。1919 年 6 月，它成了她的任教资格论文。
      none: 十二月底，讨论课照旧开着，没有课酬。布告栏上那一行仍写着希尔伯特教授，在诺特博士协助下，图钉边上锈了一圈。
      desync: 7 月 26 日开会前，正文和提要还散在两沓稿子里，作者页找不着了。{staff}被召回时，桌上摊着一页没有署名的首页，窗外的钟正在敲。
      not_admitted: '{staff}没能进数学楼，只在门外的台阶上站过几回。布告栏上钉着课表，有一行写着希尔伯特教授，在诺特博士协助下。'
      points:
        p1:
          class_learned: 7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}教过大学，知道学会的会是怎么开的，把两沓对着页码合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。
          class_lettered: 7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}跟稿子打惯了交道，一页页对着页码把两沓合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。
          else: 7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}做事有条理，从那一摞论文里把两沓都找了出来，对着页码合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。
        p2:
          class_lettered: 十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}管过文书，把这一学期她实际上过的每一堂课按日期抄成一张表，连同那篇署名论文的印本一起送到系里，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。
          class_learned: 十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}教过大学，知道系里的钱是怎么走的，把这一学期她实际上过的每一堂课按日期列成一张表，连同那篇署名论文的印本一起送到系里，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。
          else: 十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}做事有条理，说话也压得住场，在系里的办公室把她这一学期上过的课一堂堂列在一张纸上，当面数给人听，又放下那篇署名论文的印本，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。
      excerpts:
        p2: 系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。
        p1: 克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。
    relic: 一张课程通告
    relic_desc: 一张厅里的通告，应该写她名字的地方写着希尔伯特。
    points:
      p1: 把诺特署名的文稿和提要同时交到克莱因手上，让他能按期将论文呈交给哥廷根学术团体
      p2: 把本学期由诺特实际授课的记录和署名论文一并交给系里，请系里先为下一轮讨论课核定课酬，再随新申请存档
    points_fail:
      p1: 名册上只有呈交人的名字，讲义与作者页没能对回同一份。会议把论文退到下一次，事务所因同步失败召回员工。
      p2: 系里同意有人继续带讨论课，但依然用原来的排课办法，没有经费支付诺特这部分工时。
    shift:
      p1:
        was: 1918 年 7 月 26 日，费利克斯·克莱因在哥廷根的一次会议上呈交《不变变分问题》。印本所署作者是埃米·诺特。
      p2:
        was: 诺特于 1919 年获任教资格，哥廷根大学记录她到 1923 年才取得带少量固定薪酬的教学任务。
        now: 系里在任教资格重审前先拨了一小笔课酬，按实际开课支付。这个学期愿意跟她做题的学生因此有一段固定的时间可来。
        who: noether_gottingen
        bio: 哥廷根的任教规则曾让诺特的第一份申请受阻。她仍开展研究，后来以一系列论文和自己的课堂培养学生。
    vignettes:
      notice: 冬季学期开课前，{staff}帮工友往布告栏上钉课表，旧课表揭下来，木板上留着一圈圈图钉眼。工友指着一行念：希尔伯特教授，在诺特博士协助下。他说这一行他钉了好几个学期，进教室讲课的一直是那位女博士。
      turnips: 十月，{staff}帮房东太太在后院挖萝卜，土又湿又黏，萝卜都不大。她说城里流感又起来了，学生公寓空了一半，面包票她早就不数了，反正也没什么可数的。
      snow: 十二月底，{staff}帮数学楼的门房扫台阶上的雪，扫帚秃了，扫一下要补一下。门房说打完仗回来的学生太多，讲堂里没座位了，有人站在走廊里听。
  wegener_greenland:
    name: 越过冰盖
    place: 格陵兰冰盖
    figure: 阿尔弗雷德·魏格纳
    story: 1930 年，魏格纳运送补给抵达冰盖内陆站艾斯米特，在回程中去世。阿尔弗雷德·魏格纳研究所的档案说明记下了行程，并指出格陵兰同行者拉斯穆斯·威卢姆森的姓名。
    story_prose:
      opening:
        - 格陵兰冰盖上，雪橇的物资已经又点了一遍。魏格纳问勒韦的脚还撑不撑得住。维卢姆森向他们说前面再看得见时，要辨清哪一处是冰中站。
        - 1930 年十月，魏格纳、弗里茨·勒韦与拉斯穆斯·维卢姆森到达艾斯米特。勒韦留下过冬，魏格纳返回途中去世，维卢姆森及他带走的日记失去踪迹。分支里可以先保住到站，再分别照护三人的健康和回程。
        - 让有雪地经验的人护住行进和交接。能照护的人要分别问勒韦和魏格纳的情况，另有人确认维卢姆森何时出发、谁等他到西营。
      points:
        p1: 前面只能看见雪橇背影，维卢姆森请队伍暂时并在一起。你把等着交的物资记在第一张纸，叫最后一个人逐项答过，才跟着走完最后一截。到站的人从里面来接时，待交的包和人一起被点到了。
        p2: 勒韦把冻伤的脚搁到能歇的位置，问需要没收起的一双干袜在哪里。你请照护的人先听他说完，让另一位队员替他拿东西。几天后，照护者来问今天想不想自己换一个坐处。他拿着原先挂在床边的东西，挪到了自己挑的那张凳子旁。
        p3: 有人要把日记和其他纸塞进同一个包，维卢姆森请先让他看一眼。你请他选着方便随时查的地方，又向西营报了要等他回来的消息。雪橇到达时，等着的人准备先帮他放下随身东西。维卢姆森亲手把日记的包从自己的行李边递了过去。
        p4: 回程的帐里，魏格纳问有没有人能先替他报个平安。你把话带出去，请照护员工回来听他想休息多久。等一行抵达西营，守门人从帐里拿来三条毯，让几个归来的人先坐。魏格纳用还在发抖的手，在报到表上写了自己的名字。
      outcomes:
        all: 救援队按期到站，勒韦的脚有了照护。魏格纳和维卢姆森后来抵达西营，日记也被交到等着的人手里。
        p1: 十月三十日到站，接应的人能按清单收下物资。
        p2: 勒韦的冻伤好转，站上的照护让他避开了原来的手术。
        p3: 维卢姆森和日记到了西营。报告另按魏格纳那一星的实际结果记他的去向。
        p4: 魏格纳活着在西营报到。日记的交接仍要看维卢姆森路上得到哪种帮助。
      none: 最后一段冰路越拖越久。西营那张等候的表仍空着名字。
      not_admitted: 物资单没有来客的名字。值班人请你站在雪橇外侧，别挡住接力的队员。
      desync: 队伍没能按 10 月 30 日抵站，交接与史实脱节，事务所召回员工。
      excerpts:
        p1: 到站的人从里面来接时，待交的包和人一起被点到了。
        p2: 他拿着原先挂在床边的东西，挪到了自己挑的那张凳子旁。
        p3: 维卢姆森亲手把日记的包从自己的行李边递了过去。
        p4: 魏格纳用还在发抖的手，在报到表上写了自己的名字。
    relic: 一条雪橇皮带
    relic_desc: 一条冻硬的皮带，系过满载的雪橇。
    points:
      p1: 护住救援队走完最后一段冰路，让魏格纳、勒韦和维卢姆森在 10 月 30 日到达艾斯米特
      p2: 治好勒韦冻坏的脚，让他不必在冰洞里被截去脚趾
      p3: 护住维卢姆森往西的路，让他带着魏格纳的日记走回营地
      p4: 在回程的冰上治好魏格纳，让他活着走回西边的营地
    points_fail:
      p1: 队伍被严寒困在冰上，没能在 10 月 30 日到站，这条分支与历史脱了节，事务所召回员工。
      p2: 勒韦冻坏的脚趾没保住，那年冬天在站上被截去，直到开春都下不了地。
      p3: 维卢姆森埋好魏格纳，带着日记继续往西走，此后再没有人见过他，日记也跟着不见了。
      p4: 魏格纳在回程的冰上去世，约在 11 月中旬，遗体到第二年 5 月才找到。
    shift:
      p1:
        was: 1930 年 10 月 30 日，魏格纳、勒韦和维卢姆森在冰上走了四十天，到达冰盖中央的艾斯米特站。
      p2:
        was: 1930 年冬天，勒韦冻坏的脚趾在艾斯米特站被人用小刀截去，整个冬天不能走路。
        now: 勒韦保住了脚趾，那个冬天他在站上自己走动。
      p3:
        was: 1930 年 11 月，维卢姆森在冰上埋葬了魏格纳，带着他的日记继续往西，此后下落不明。
        now: 维卢姆森走回了西边的营地，把魏格纳的日记交到考察队手里。
        bio: 拉斯穆斯·维卢姆森 1930 年 11 月从冰盖上走了回来，回到自己在格陵兰的家人身边。
      p4:
        was: 1930 年 11 月 1 日，魏格纳在五十岁生日这天离开艾斯米特，约在 11 月中旬死在回程的冰盖上，遗体 1931 年 5 月 12 日才被找到。
        now: '{staff}一路跟着他往回走，每晚看着他的体力。他活着走进了西边的营地，后来亲眼看到这次考察的测量一项项整理出来。'
        who: wegener_greenland
        bio: 魏格纳 1930 年 11 月从冰盖中央活着走了回来。他又活了许多年，看着这次考察的观测整理出来。
    shift_all: 这条时间线里，那年秋天进出艾斯米特的人都活着回到了海岸。
    vignettes:
      names: 虚构的办事员只在远征一栏写下一个姓。你问是谁把那份东西交到站上的。他给其他参与的人另留了一行，没有只记最著名的姓名。
      count: 办事员把出发的数写得像到站的数。你请他在每项数字旁标上是哪一站的记录，两项合计便不再挤在同一个栏头下。
      note: 办事员收拢账本时，你把目的地另抄一张。后来的人仍能看出这些条目记的是哪一站。
  boltzmann_duino:
    name: 同一个数，几种排法
    place: 杜伊诺
    figure: 路德维希·玻尔兹曼
    story: 1877 年，路德维希·玻尔兹曼数出同一种能量分布可以有多少种排法，把热的规律和原子的统计联系起来，可直到二十世纪初，原子是否真实存在仍有许多人怀疑。1906 年 5 月，他因所谓严重的神经衰弱停课，夏天和家人到的里雅斯特附近的杜伊诺度假。9 月 5 日，他在那里去世，六十二岁。两年后，让·佩兰的布朗运动实验开始证实爱因斯坦的预言，原子渐渐被人接受。
    story_prose:
      opening:
        - 1906 年夏，的里雅斯特附近的杜伊诺海湾。路德维希·玻尔兹曼和妻子、女儿在这里度假。将近三十年前，他数出同一种能量分布可以有多少种排法，把热的规律和原子连在一起。到这时，还有许多人不信原子真的存在。
        - 史实里，这年 5 月他因所谓严重的神经衰弱停了课，课由斯特凡·迈尔代讲。9 月 5 日，他在杜伊诺去世，六十二岁。两年后，佩兰的布朗运动实验开始替原子作证。在这条分支里，岸边有晾网的渔夫，沙滩上有数石子的小孩，旅馆的女招待每天把浴巾从海边收回来。
        - 这一趟用得上两种人：讲得清学问、能同他谈原子的人，懂医、带对了药、陪得住一个病人的人。
      outcomes:
        all: 九月，回维也纳的火车开出杜伊诺。玻尔兹曼靠窗坐着，上衣口袋里鼓着那几张算草。
        p2: 九月，回维也纳的火车开出杜伊诺。他靠窗坐着，看了一路的海。
        p1: 那个夏天，那几张算草一直在他的上衣口袋里。
      none: 杜伊诺的海湾很静。旅馆露台的桌上，几张算草被风吹到了地上。
      not_admitted: '{staff}没能走近那一家人。旅馆露台上的人每天对着海坐着，假期一天天少下去。'
      points:
        p1: 八月初的一个傍晚，玻尔兹曼坐在旅馆的露台上，桌上压着几张算草。{staff}拿起一张，从水里微粒的乱跳讲起，讲爱因斯坦前一年怎样算出这种乱跳该走多远，再过两年，就会有人在显微镜底下照着去量。他听完没说话，把那几张算草叠齐，放进了上衣口袋。起身回房时，他的手一直按在那只口袋上。
        p2:
          class_learned: '{staff}照医生的办法，替他定好每天吃药和睡觉的钟点，早晚各诊一回脉，白天陪他沿着海边走一段。八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。'
          else: '{staff}按时给他换上带来的镇静贴片，夜里守着他入睡，白天陪他沿着海边走一段。八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。'
      excerpts:
        p2: 八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。
        p1: 他听完没说话，把那几张算草叠齐，放进了上衣口袋。起身回房时，他的手一直按在那只口袋上。
    relic: 一截粉笔
    relic_desc: 一截用得很短的讲课粉笔。
    points:
      p1: 让他知道，原子的存在过不了几年就会被实验证实，他为之争了半辈子的学说站得住
      p2: 在杜伊诺的假期结束之前，治好他的病，让他回到维也纳
    points_fail:
