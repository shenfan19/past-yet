    points_fail:
      p1: 各组进场时对不上，首演临场缺了一段，这条分支与史实脱节，员工被召回。
      p2: 演奏者在分谱上各记各的，合排里暴露的问题到上台也没有送给作曲者确认。
      p3: 再演时季节已过，空座多，贝多芬没能靠这一场挣回应得的收入。
    shift:
      p1:
        was: 1824 年 5 月 7 日，贝多芬的《第九交响曲》在维也纳首次演出。
      p2:
        was: 1824 年 5 月，首演筹备中，贝多芬借谈话簿接收演奏者转述的排练情况。
        now: '{staff}把几处要紧的进拍问题写在同一页，请各声部按贝多芬认可的记号重试。'
      p3:
        was: 1824 年 5 月 23 日，第二场音乐会在维也纳举行，票房不理想。
        now: '{staff}赶在潜在观众离城前落实一批预订，把实收票款记入结算。贝多芬有余地继续安排为自己筹款的演出。'
        who: beethoven_vienna
        bio: 贝多芬在维也纳安排重演时有了预订收入，演出开支不必全押给当天买票的人。
    vignettes:
      parts: '{staff}坐在抄谱人的桌边，替他们压平刚抄好的分谱等墨干，桌上一股墨水味。圆号的分谱还没干透就被人抢去了排练厅，{staff}一下午都在给第二份吸墨渍。'
      prater: 星期天，{staff}在普拉特的林荫长道上走，树荫很密。长椅上坐满了出城透气的人，卖香肠的嗓子都喊哑了，看不出有谁要去听音乐会。
      stools: '{staff}在剧院后头给合唱队搬凳子，凳脚在石板上刮出响声。一个女高音揉着喉咙说，末乐章那几个高音写得像要把人往天花板上拽，一排人都笑着点头。'
  faraday_london:
    name: 从磁里得到电
    place: 伦敦
    figure: 迈克尔·法拉第
    story: 1831 年 8 月 29 日，法拉第在铁环实验中记录了指针的短暂偏转。10 月 28 日，他让铜盘在磁铁两极之间转动，转动时能持续产生电流。
    story_prose:
      opening:
        - 伦敦皇家研究院的实验桌上有只绕线的铁环。法拉第刚把眼睛从接点抬起来，表针已经回到零位。旁边的记录人问，该记没有反应，还是再看一遍。
        - 1831 年 8 月，法拉第用铁环观察到接通和断开时的短暂偏转。十月，他在铜盘转动时观察到持续电流。这里有两次观测要保住，一次看偏转何时开始，一次看它何时结束。
        - 找能分工看时间和表针的人；换到铜盘时，再让有手上功夫的人照看接触处。
      points:
        p1: 你把记录纸横过来，左边留给接通的时刻，另一边留给谁看见了偏转。法拉第一动手，记录人没等针落回去就报出方向。过了一次短停，他把第二个记号另写在断开的那边。原来空着的栏里有了两个不挨着的记号。
        p2: 铜盘转着，法拉第让看表的人多等一会儿。你扶住刚才滑动过的接触片，记录人又看一眼表，发现针仍然停在偏过去的一边。盘停下来，他才把归零的时刻写在下面。两行读数之间，铅笔留出一截整齐的空格。
      outcomes:
        all: 两份记录并排放着。铁环那边，针很快回去；铜盘那边，记下等了多久，针才随停转回去。
        p1: 铁环的短暂偏转已经写好，另一项观测还不能确认。
        p2: 铜盘的读数比第一次观察维持得久。铁环记录仍有缺口，这条分支无法和史实对齐。
      none: 实验纸上只有原先的栏目。仪器停下以后，读数仍没人能补上。
      not_admitted: 门里提醒来访的人把过道留出来。你在实验室外听到记录人问还能否再看一次。
      desync: 铁环偏转或铜盘的持续读数没有记下来，实验记录脱节，事务所召回员工。
      excerpts:
        p1: 原来空着的栏里有了两个不挨着的记号。
        p2: 两行读数之间，铅笔留出一截整齐的空格。
    relic: 一个铁环和线圈
    relic_desc: 软铁环上绕着两组线圈。
    points:
      p1: 两人分看接通时刻和表针，护住铁环实验里转瞬即逝的偏转
      p2: 让集电片贴住转动的铜盘，让法拉第看清盘一直转时电流能不能持续
    points_fail:
      p1: 表针摆回去才有人抬头，这一趟把实验记成无结果。行程同步失败，员工被召回。
      p2: 铜盘转动时接触处滑开了。这条分支里没有测出持续电流，事务所因同步失败召回员工。
    shift:
      p1:
        was: 1831 年 8 月 29 日，法拉第在铁环装置接通和断开时观察到了短暂的感应电流。
      p2:
        was: 1831 年 10 月 28 日，法拉第观察到铜盘在磁极之间转动时产生的电流。
    vignettes:
      instant: 助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。
      skeptic: 你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。
      sketch: 你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。
  darwin_galapagos:
    name: 岛屿与生命的多样
    place: 加拉帕戈斯群岛
    figure: 查尔斯·达尔文
    story: 1835 年 9 月到 10 月，达尔文随小猎犬号到访加拉帕戈斯。在查尔斯岛，副总督劳森告诉他各岛的龟彼此不同；达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起。10 月 8 日到 17 日，他和拜诺几人带着帐篷留在詹姆斯岛，船去别处取水，营地旁只有一眼可怜的小泉。他的鸟类笔记把嘲鸫标本和各自采集的岛对应起来。
    story_prose:
      opening:
        - 小猎犬号把达尔文一行留在岛上，到别处取水去了。詹姆斯岛的帐篷刚支起，营地旁边的小泉流得很慢。装标本的纸包还没捆好，有两只鸟的标签写在同一张纸上。
        - 1835 年，副总督劳森告诉达尔文，各岛象龟有可辨的区别。达尔文后来记下自己没有及时留心。詹姆斯岛的队伍靠小泉待到船返。这里可以提前分岛标记，也可以保住最后一段岸上采集。
        - 擅长观察、核标签的人先随达尔文听劳森说完。到詹姆斯岛再派能照应水和驻地的人同去。
      points:
        p1: 水壶眼看就快见底，泉旁还排着两个人。你把营地能用的水和这半天要供几个人讲清，请带路的人再去问先前替他们取水的人。等水到了，拜诺才叫人把已经装好的标本从帐边收好。船重新到外湾时，最后一批纸包和空水壶放在一起等装船。
        p2: 劳森说看壳就知道是哪座岛的龟，达尔文问了一个地方名就想接着走。你将两张标本纸打开，请他按原来采集时的去向说一次。记到说不准的就标待核，后采到的另包一处。第一张核好的标签用新绳系回去，岛名留在纸包外。
      outcomes:
        all: 岛名和分包的标本能逐份核对。詹姆斯岛的队伍也带齐采集物回到船上。
        p1: 营地撑到船回，收集的标本照期上船。较早的岛名还有几处无法查明。
        p2: 一点岛屿记录单独保存。营地之后没能撑到完成采集，报告保存这一段在查尔斯岛的核对。
      none: 泉眼旁只有原先那几只水壶，没去另找水。较早的标本包也未写清岛名。
      not_admitted: 离船的名单里没有来客。一只包已经放进小艇，你从甲板上看不清标签。
      desync: 回程前营地断水，詹姆斯岛的采集没能完成。事务所发来召回。
      excerpts:
        p1: 船重新到外湾时，最后一批纸包和空水壶放在一起等装船。
        p2: 第一张核好的标签用新绳系回去，岛名留在纸包外。
    relic: 一根雀的羽毛
    relic_desc: 来自群岛的一根小小的褐色羽毛。
    points:
      p1: 詹姆斯岛营地旁只有一眼小泉，护住岸上这一小队撑到船回来，把岛上的采集做完
      p2: 劳森说各岛的龟一看就分得出时，让达尔文当场留了心，把各岛的鸟分岛记下、分开装好
    points_fail:
      p1: 岸上小队断了水，詹姆斯岛的采集没能做成，这条分支与历史脱了节，事务所当天召回员工。
      p2: 他照史实没把劳森的话放在心上，查塔姆岛和查尔斯岛的采集已经混在一起，雀的标本大多没记岛名。
    shift:
      p1:
        was: 1835 年 10 月 8 日至 17 日，达尔文、拜诺和随从带着帐篷和口粮留在詹姆斯岛，小猎犬号去别处取水；营地旁只有一眼小泉。
      p2:
        was: 1835 年 9 月下旬，查尔斯岛的副总督劳森告诉达尔文，各岛的龟一看就分得出来。达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起，雀的标本也大多混了。
        now: 他当天就记住了劳森的话，各岛的鸟分岛记下、分开装好，带回了英国。
        who: darwin_galapagos
        bio: 这条时间线里，达尔文在加拉帕戈斯听进了劳森那句话，把各岛的雀和嘲鸫分岛采集、分岛标注，带回英国。
    vignettes:
      two_tags: 一张签只写了「岛上」。你把它搁到一边，等帮手找来另记的上岸记录。盘子即便收好，两件标本也还能分清。
      differences: 帮手指着两只相似的鸟，准备合写一条。你问它们各来自哪座岛。他把两个标签都留在册上，下次好重新比较。
      drawer: 帮手能把地名念回给你以前，你一直把签放在盘旁。抽屉关上时，纸签仍在对应的标本旁。
  lovelace_london:
    name: 第一段程序
    place: 伦敦
    figure: 阿达·洛芙莱斯
    story: 1842 年，意大利工程师路易吉·梅纳布雷亚用法文发表了一篇介绍查尔斯·巴贝奇分析机的文章。阿达·洛芙莱斯把它译成英文，又加了七条注释，篇幅约有原文的三倍；最后的注 G 写出了这台机器怎样算伯努利数。1843 年 8 月，巴贝奇想在文中附上他对政府的不满，编辑不肯不署名刊出，他便要她撤稿。她拒绝了，署名 A.A.L. 的译文与注释当年刊在《泰勒科学回忆录》上。8 月 14 日，她提出由自己张罗造机器的事务，请巴贝奇专管工程，巴贝奇拒绝了她的条件。
    story_prose:
      opening:
        - 1843 年夏，伦敦。阿达·洛芙莱斯把意大利工程师梅纳布雷亚介绍巴贝奇分析机的法文文章译成英文，又加了七条注释，篇幅约有原文的三倍。最后一条注 G，一步一步写出这台还停在纸上的机器怎样算伯努利数。
        - 史实里，巴贝奇想在文中附上他对政府的不满，编辑不肯不署名刊出，他便要她撤稿；8 月 6 日，她写信告诉他，不撤，这件事已经拿定。8 月 14 日，她提出由自己张罗造机器的事务，请巴贝奇专管工程，巴贝奇在信边批了一句，所有条件都拒绝。第二天她写信告诉母亲，印坊又召她去盯最后一轮，数学公式校得十分费力。在这条分支里，印坊里有个嫌西格玛不够用的排字工，斯皮塔佛德有个守着提花机的织工。
        - 这一趟用得上几种人：懂翻译与文书、守得住一捆稿子的人；校得了样、一格一格对得了表的人；说话有分寸、谈得拢分工的人。
      outcomes:
        all: 那期《泰勒科学回忆录》印出来了，注 G 的表一格也没有串行，末尾署着 A.A.L. 三个字母。九月里，一位来客坐在多塞特街的屋里，面前摊着设计图、费用草案和那页分工的短约。
        p3: 九月里，一位来客在多塞特街看了设计图和费用草案，带走了那页分工的短约，说等工程评估过后再谈钱。
        p2: 印出来的注 G，那张表一格也没有串行。她核过的那份样表留在印坊的柜子里，边上的红点还在。
        p1: 那期《泰勒科学回忆录》照常印出，译文和七条注释排在一起，末尾署着 A.A.L. 三个字母。
      none: 八月下旬，那期《泰勒科学回忆录》印出来了。斯皮塔佛德的织坊里，穿孔纸板还在一张接一张地翻。
      desync: 印坊同时接到了接着印和暂缓的两种话，译稿与注释从本期撤了下来。{staff}被事务所召回时，排字工正把注 G 那几版拆开，铅字一把一把倒回字盘。
      not_admitted: '{staff}没能进圣詹姆斯广场那座宅子，只在斯皮塔佛德的织坊门口看了几天提花机。纸板一张张翻过去，丝面上的花越织越长。'
      points:
        p1:
          class_lettered: 8 月 6 日，她给巴贝奇写信：译文与注释不撤，这件事她已经拿定。{staff}照管稿件的规矩，把译稿和七条注释按页码点过一遍，用同一根带子扎好，附上她签过字的付印回条，送到印坊。排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。
          else: 8 月 6 日，她给巴贝奇写信：译文与注释不撤，这件事她已经拿定。{staff}抱着那捆用带子扎好的稿子，在印坊门口一直等到开门，没让旁人经手，亲手放到排字工的台子上。排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。
        p2:
          class_lettered: 8 月 15 日，印坊又把她召去盯最后一轮校样，公式要一处处对过。{staff}照校对的规矩，拿一把直尺压在注 G 的表上，和她隔着桌子一行一行横着念，念到容易串列的格子，就在边上点一个红点，排字工在旁边听着。天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。
          else: 8 月 15 日，印坊又把她召去盯最后一轮校样，公式要一处处对过。{staff}把注 G 的表从头抄了一份，和她一人一份，隔着桌子一行一行横着对，容易串列的格子就在边上点一个红点。天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。
        p3:
          class_lettered: 八月下旬，署着 A.A.L. 的注释已经印了出来。{staff}照拟契约的格式，把她 8 月 14 日那封信里提的分工誊成一页短约：她管联络和筹措，巴贝奇专管工程，先请一位出资人来看设计图和费用草案。那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。
          else: 八月下旬，署着 A.A.L. 的注释已经印了出来。{staff}拿着她 8 月 14 日那封信，在她那里和多塞特街之间跑了几趟，把两边各自肯让的一步记在同一页纸上。那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。
      excerpts:
        p3: 那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。
        p2: 天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。
        p1: 排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。
    relic: 一张穿孔卡
    relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
    points:
