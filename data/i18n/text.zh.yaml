      xue: 这条分支里，招生告示只贴在城里，城外的学生知道消息时，报名已经开始了。
      wen: 第一次筹备会议照史实召开，三所学校的难处仍是各说各的，没有一张合在一起的单子。
      si: 选址照史实定在石牌，筹备处桌上没有一张把几处校址画在一起的图。
      bian: 6 月 21 日的毕业典礼照常举行，筹备处仍要分开查阅三份名单。
      xing: 石牌的校地照史实只划在纸上，地上一根界桩也没有立。
    shift:
      xue:
        was: 1924 年 6 月 9 日，国立广东大学委托各省教育厅招生；6 月 10 日，预科考试开始报名，原计划招 520 人。
        now: 这条分支里，城外的路口和码头上也贴着招生告示。
      wen:
        was: 1924 年 3 月 3 日，第一次筹备会议召开，议题里头一件是三所学校学生的毕业问题。
        now: 这条分支里，会上摆着一张把三所学校的难处列在一起的单子。
