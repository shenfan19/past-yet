    place: 佛罗伦萨
    figure: 阿尔泰米西娅·真蒂莱斯基
    story: 阿尔泰米西娅·真蒂莱斯基是第一位被佛罗伦萨绘画学院接纳的女性，她负着重债画大幅油画。此后几百年里，她的许多画被算在别人名下。
    relic: 一罐颜料
    relic_desc: 一小罐磨好的青金石蓝。
    points:
      p1: 看她怎样塑造一个人体（画家或灵巧的手更合适）
      p2: 在赞助人面前替她说话
      p3: 承认这些作品是她的
  buchner_zurich:
    name: 未完成的沃伊采克
    place: 苏黎世
    figure: 格奥尔格·毕希纳
    story: 格奥尔格·毕希纳是年轻的自然科学讲师和剧作家，二十三岁死于苏黎世的伤寒，剧本《沃伊采克》没有写完。
    relic: 一叠零散的场景稿
    relic_desc: 字迹局促的散页，没有固定的顺序。
    points:
      p1: 读着这些场景，感觉它们的次序
      p2: 在高烧中陪着他
      p3: 把稿子妥善保管，留给将来的读者（档案员、图书管理员或固执的人更合适）
  emily_bronte_haworth:
