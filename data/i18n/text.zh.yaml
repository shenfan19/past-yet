    bio: 在亚特兰大开夜班救护车，后座上不管是谁，他都握着手。
    story: 贾马尔在亚特兰大西南区长大，他奶奶当年等救护车等了四十分钟，这件事他一直记在心里。书本上的东西他学得慢，急救医士的考试考了两次，二十九岁才通过，休息日还要开网约车还债。他力气很大，一个人能把病人背下三层楼。他的运气是全站最差的，车坏过，爆过胎，一场车祸让他住了一个月院，最难的出诊也总落到他头上。每次出完难熬的诊，他会在车里坐几分钟再继续上路。在家里他正慢慢学做饭，每周给女儿学一道新菜。
    sayings:
      full:
        - 送到了，手一路没松开。
      part:
        - 送到了几个。剩下那几个，我会一直记着。
      none:
        - 晚了一步。下回我闯红灯，就这么定了。
      rough:
        - 我自己也该躺后座了。先把病人送到，我再躺。
  s_emily:
    name: 艾米莉·塔古纳
    ethnicity: 因纽特人
    jobs:
      - 丛林飞行员
      - 飞行教员
    bio: 驾着小飞机往返加拿大北部的村镇，三十年里只因天气折返过两次。
    story: 艾米莉出生在北方一个小镇的因纽特家庭，冬天出镇的唯一办法就是坐飞机。她看着邮政飞机降在冰面上，九岁就决定要自己开它。书面的东西是她最大的短处，执照的理论考试考了五次才勉强过，飞行日志至今离了别人帮忙也填不好。可一握上操纵杆，她的手就完全不一样。她送过药，送过信，有一回把整支冰球队运过同一片冻湖，也有人对她说这不是镇上姑娘该干的活。她至今仍先抬头看天，再去看天气预报。眼下她在带一位同社区的年轻飞行员，教法多半是大声喊和用手指。
    sayings:
      full:
        - 准点落地，连雪都给我让了道。
      part:
