      p2: 在街上做一个平静的存在
      p3: 用恰当的话让房东明白事情
  sophie_germain_paris:
    name: 来迟了的学位
    place: 巴黎
    figure: 索菲·热尔曼
    story: 索菲·热尔曼靠读书自学数学，曾用男人的名字给高斯写信，后来在巴黎死于癌症。哥廷根本想授给她的荣誉学位没有送到她手上。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借来的名字写给高斯的信。
    points:
      p1: 跟上她关于弹性的工作
      p2: 盼着一次聆听能朝着她有利的方向走
      p3: 陪她走过最后的病中日子
  bizet_paris:
    name: 冷淡的首演
    place: 巴黎
    figure: 乔治·比才
    story: 《卡门》在喜歌剧院首演，反响冷淡，三个月后比才去世，年三十六岁，他不知道这部歌剧后来会传遍世界。
    relic: 一把折扇
    relic_desc: 一把来自池座的彩绘纸扇。
    points:
      p1: 听出观众漏掉的东西（音乐家或敏感的耳朵更合适）
