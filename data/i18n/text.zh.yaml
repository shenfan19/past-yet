trait_notes:
  kind:
    pro: 容易赢得信任，照护真诚。
  curious:
    pro: 留意到别人没留意的，敢问别人不问的。
  glib:
    pro: 靠嘴进得去门，容易说动人。
  sensitive:
    pro: 容易发现不对劲，也能体会别人的感受。
  bold:
    pro: 敢顶住阻力和危险。
  patient:
    pro: 能等，肯花时间把事情慢慢做好。
  methodical:
    pro: 做事有章法，记录和核对一丝不苟，被逼也不松口。
  hardy:
    pro: 身体扛得住，生病也比别人少。
  charismatic:
    pro: 一站出来就有人愿意听、愿意跟。
  quiet:
    pro: 不惹眼，看得多，耐得住。
  wanderer:
    pro: 底层出身或惯了在外，不怎么想家，不太受敌意和熬夜的影响，吃得了苦。
  attached:
    pro: 对人用情很深，肯守着。
  streetwise:
    pro: 市井里练出来的反应，吃了亏也能找条出路。
  scholarly:
    pro: 读得多，能和学者平等地谈。
  handy:
    pro: 手艺扎实，能把东西做到位。
  artistic:
    pro: 对美和声音特别敏锐，能打动人。
  calm:
    pro: 事到临头反而稳，照护病人尤其好。
  cosmopolitan:
    pro: 去过很多地方，同陌生人容易搭上话。
  cheerful:
    pro: 爱笑，愿意帮忙，带得起气氛。
  vigil:
    pro: 越晚越清醒，守夜熬更不容易走神。
  faithful:
    pro: 有坚定的信念，难关里不动摇。
  skeptical:
    pro: 凡事要证据，不轻信，也容易看出破绽。
  ambitious:
    pro: 目标明确，肯争取，也敢开口要。
mainline:
