      - 裁缝
    bio: 车间里缝得最快的人，跟每个主管都吵，却总被给他指捷径的人骗。
    story: 拉菲克十六岁从巴里萨尔的村子来到达卡，一个月就学会了缝纫机。十四年过去，他带着一条三十人的流水线，连上两班也不觉得累，光凭声音就能判断哪根针卡住了。他几乎不识字，签过自己看不懂的合同，一个劳务中介曾骗走他六个月的积蓄。他以前待的那家工厂失了火，两年的工钱也跟着烧没了。他对主管大声嚷嚷，可有人低声施压时，他又会让步。他一直给妹妹寄钱，让她把学念完。他想有一天自己开一间小作坊，要有一扇能打开的窗。
    sayings:
      full:
        - 整条线上没卡一根针，我听声音就知道。
      part:
        - 赶出来一半，另一半是主管的事，我已经跟他吵过了。
      none:
        - 又有人给我指近路，结果绕到吉大港去了。
      rough:
        - 连上两班，眼睛都不眨一下。
  s_nasreen:
    name: 娜斯琳·库雷希
    ethnicity: 旁遮普人
    jobs:
      - 医生
      - 医学教师
    bio: 看病按病人的付得起收费，为此常跟医院董事会争。
    story: 娜斯琳念拉合尔医学院时，同年级一共只有六个女生，她记得每一位的名字。二十五年来她一直经营一间小诊所，收费看病人拿得出什么，有时只是一袋扁豆，同时还带一班年轻医生。她诊断得比她共事过的任何人都快。身体却是她的弱处，脊椎不好，肾功能也在衰退，一到中午就疲惫，所以悄悄不再爬楼梯。诊所被水淹过两次，被偷过一次，董事会还总让她做事商业一些。她客气地回答，然后什么也没改。女儿劝她退休，但她想先再带一班学生。
    sayings:
      full:
        - 都看完了，连一袋扁豆都没收。董事会那边，我明天去吵。
      part:
        - 能治的治了。剩下的要药，要钱，还要我再吵一架。
      none:
        - 诊断是对的，就是没人听。又不是第一回。
      rough:
        - 医生自己病了。嘘，别告诉病人。
  s_reza:
    name: 礼萨·莫拉迪
    ethnicity: 波斯人
    jobs:
      - 书商
      - 译者
    bio: 在伊斯法罕的巴扎卖诗集，能把人说动买书，有时顺带也说动一点价钱。
    story: 礼萨从叔叔那里继承了伊斯法罕巴扎拱廊下的一间书店，连同一万一千本没整理的书，和一张能说会道的嘴。他读四种语言，给小杂志翻译法语和英语的随笔。他能对游客背哈菲兹的诗，对出租车司机背公交时刻表，看到顾客像是有钱，也不是不会把价格往上凑一凑。面对香烟、借钱的请求和第二壶茶，他一点定力也没有，多年的灰尘和烟让他的咳嗽始终没有好透。钱总是从他手里漏走，借出去的书也很少还回来。他最想找到叔叔发誓说就在书架某处的那份遗失的手稿。
    sayings:
      full:
        - 出发前我翻了一页哈菲兹，签是好签。
      part:
        - 书卖出去几本，价钱也顺手抬了一点。
      none:
        - 没人买书，我就念诗给自己听，听众很满意。
      rough:
        - 狼狈了点，诗一句也没忘。
  s_leyla:
    name: 蕾拉·耶尔德兹
    ethnicity: 土耳其人
    jobs:
      - 建筑实习生
      - 插画师
    bio: 在电车票背面画房子，凡事先说好，再回头担心。
    story: 蕾拉在伊斯坦布尔一间茶园楼上的公寓长大，常在阳台上画渡轮和宣礼塔。去年夏天她从建筑学院毕业，现在在一家事务所实习，负责修复博斯普鲁斯沿岸的旧木屋，周末还给一本杂志画小幅插画。她在这一行里是个普通的学生，不比同学强，也不比同学差。她爬脚手架毫不犹豫，什么工地都答应去，夜里却睡不着，想着自己够不够好。导师说她的草图很大胆，交图的时间却不大胆。她想给一个没有图书馆的街区设计一座小小的图书馆。
    sayings:
      full:
        - 我先答应的，结果真成了！今晚的茶我请。
      part:
        - 画了半张，另一半在脑子里，脑子里那半更好看。
      none:
        - 我先答应了，现在……现在可以开始担心了。
      rough:
        - 吓得半死，不过我画了张速写，画得还挺好。
  s_aigerim:
    name: 艾格丽姆·苏尔塔诺娃
    ethnicity: 哈萨克族
    jobs:
      - 地质学家
      - 矿业顾问
    bio: 一年有半年在草原上，带着锤子和笔记本，野外不知疲倦，别处笨手笨脚又总倒霉。
    story: 艾格丽姆的祖父在草原上放羊，她从小就觉得大地本身是个会讲故事的人。她在阿拉木图学地质，此后每年有半年待在野外，另外半年给矿业公司做顾问。她在尘土和风里一天能走二十公里，从不觉得累。她的手对小东西很笨，瓶子、拉链和样品袋在她手里总是坏的坏、破的破。运气也不站在她这边。有一次她为了取岩芯，开着爆了胎的车跑了两百公里，雨却比她早到了一小时。一回到城里她就心神不宁。她梦想画出一张没人画过的古河道地图。
    sayings:
      full:
        - 石头开口了，连它祖宗八代的事我都听完了。
      part:
        - 走了二十公里，捡回一兜好石头，丢了一把锤子。我的运气就这样。
      none:
        - 草原那么大，偏偏我站的那一块什么也没有。
      rough:
        - 风把我吹倒三回，我爬起来四回。
  s_chidi:
    name: 奇迪·奥卡福
    ethnicity: 伊博族
    jobs:
      - 土木工程师
      - 工地经理
    bio: 在拉各斯的车流里修桥，认识每个官员的名字，没人看时爱省一道工序。
    story: 奇迪在苏鲁莱莱长大，学校门口的路每年七月都会被淹，他早早就想，总该有人来修好它。他学了土木工程，如今在拉各斯管着桥梁和排水沟的工地。他是个称职而普通的工程师，让他比同行强一点的是，他跟谁都能聊得起来。检查员和供应商都被他哄得高兴，哪位官员该打招呼，哪位该绕开，他心里一清二楚。有时他为了省下一周工期会削减一点规格，并告诉自己结构撑得住。母亲总问他什么时候结婚，他总说等下一座桥通车以后。
    sayings:
      full:
        - 桥修好了，每道工序都做了。真的，不信你去问。
      part:
        - 主体立起来了，剩下的细节……我认识人。
      none:
        - 没批下来。我认识的那位，那天刚好在开会。
      rough:
        - 出了点状况，问题不大。在拉各斯，这叫星期一。
  s_abebe:
    name: 阿贝贝·塔德塞
    ethnicity: 格迪奥族
    jobs:
      - 咖啡农
      - 合作社社员
    bio: 在耶加雪菲的陡坡上种咖啡，不合格的豆子一粒也不肯卖。
    story: 阿贝贝二十二岁接下父亲的坡地，园里有些树比他年纪还大。他手很笨，剪枝剪不直，挑果子也慢，合作社的账目更是算不来，只能请邻居代管。他靠的是一股拧不弯的意志。中间商压价、人人都往里掺次豆的那几年，只有他守着分级的规矩，被人笑了好些年。好在雨水多半赶得及时，渐渐有几个买家每季都回头找他。女儿在亚的斯亚贝巴读农学，回来时替他做精细的修剪，一边做一边争，他嘴上从不认输。
    sayings:
      full:
        - 这一趟值得煮满三轮咖啡：第一轮敬我，第二轮敬他们，第三轮讨个福气。
      part:
        - 好豆子挑出来了。次的？次的我一粒也不卖。
      none:
        - 树还没挂果，不能怪树。明年再来。
      rough:
        - 骨头磕了，可谁也别想往我袋子里掺一粒次豆。
  s_aisha:
    name: 艾莎·本阿里
    ethnicity: 阿马齐格族
    jobs:
      - 导游
      - 店员
    bio: 带游客穿行马拉喀什老城，嘴上功夫好，价钱和窘境都能说得过去。
    story: 艾莎小时候替叔叔的灯具铺跑腿，把老城的小巷摸得很熟，没有团要带的日子她仍在那间铺子里帮忙。她身体弱，灰尘和热浪每个月总有几天把她撂倒在床上。她没有恒心，古典阿拉伯语的课报了三次，也放弃了三次。靠着一张会说的嘴和一双利落的手，她样样都能混过去，法语、英语和一点西班牙语都是从客人那里学来的。运气也一直护着她，有位客人为一趟拖晚了的行程，一次付清了她整整一季的房租。报价时她不总说实话，自己心里清楚。
    sayings:
      full:
        - 价钱我砍了一半，对方还请我喝了一壶薄荷茶。
      part:
        - 一半的门开了，另一半，下回我带着最好看的笑去敲。
      none:
        - 这趟不算，就当是免费试游。
      rough:
        - 热浪又把我撂倒了，好在倒下的地方正好有人卖水。
  s_thabo:
    name: 塔博·莫科埃纳
    ethnicity: 索托族
    jobs:
      - 工会组织者
      - 工厂工人
    bio: 站在约翰内斯堡的工厂门口，把大家心里想的话说出来。
    story: 塔博在索韦托长大，父亲是公交司机，每晚回家累得说不出话。他十九岁进了工厂车间，力气大得出奇，别人搬不动的东西都交给他，二十六岁又因为敢走进经理办公室，被选为工会代表。他读字慢，也不会摆弄文件，档案都由妻子替他归好。他的运气很差，两次罢工都差了一个星期没赶上时机，一次裁员正好落在谈判结果出来之前，自行车也被偷过三回。他还是一路撑下来，如今晚上教年轻工人逐行读合同，因为没读懂的东西谁也不该签字。
    sayings:
      full:
        - 大家心里想的，我说出来了，事也办成了。今晚得唱一首。
      part:
        - 话说出去了，事办成一半，剩下的接着谈。
      none:
        - 他们没听。下回我嗓门再大一点。
      rough:
        - 挨了几下，一步没退。
  s_ngozi:
    name: 恩戈齐·姆布伊
    ethnicity: 卢巴族
    jobs:
      - 市场商贩
      - 裁缝
    bio: 在金沙萨同一个摊位卖了三十年布和肥皂，砍价从没输过。
    story: 恩戈齐二十六岁接下姑姑在金沙萨市场边上的摊位，卖印花布和肥皂，闲下来就缝衣边、做衬衫。她从没学过认字，签名只按手印，信件靠孩子念，也被一两张纸骗过。她手指灵巧，嘴比手更快。身体却很弱，膝盖肿，气短，常要躺上好几天。可她的运气好得出奇，一场大火烧掉了她两侧的摊位，唯独留下了她的，水灾两次都停在隔她一条街的地方。小儿子大学毕业之前，她谁也不让接手这个摊子，她说那一天快到了。
    sayings:
      full:
        - 砍价，我这辈子没输过，今天也不例外。
      part:
        - 卖出去一半，每一个价都是我定的。
      none:
        - 今天没开张。明天天一亮，摊子照样摆。
      rough:
        - 膝盖又肿了，摊位可一寸没让出去。
  s_carlos:
    name: 卡洛斯·拉米雷斯
    ethnicity: 萨波特克族
    jobs:
      - 面包师
      - 街头小贩
    bio: 每天凌晨三点起床在瓦哈卡烤面包，第一个顾客进门总要先听他讲个笑话。
    story: 卡洛斯十五岁起就在瓦哈卡同一座柴火烤炉前做面包，一双手揉出的面团像是天生就会，周日他还推着小车去广场摆摊。他几乎算不清一张账单，除了自己的名字也写不了几个字，定价全凭习惯，常常卖得太便宜。他运气不好，大事小事都碰上过，炉底裂过，铺子进过水，小车被偷过。有小孩钱带得不够，他总是正好多出一个需要有人吃掉的小面包。想接手的侄女来学艺，他从没写过配方，也写不出几行，只能让她站在案板边，一遍一遍看着学。
    sayings:
      full:
        - 面包出炉！先听个笑话，不听不给吃。
      part:
        - 有一炉没发起来，那我多讲一个笑话补上。
      none:
        - 烤焦了。在瓦哈卡，我们管这叫多放了料。
      rough:
        - 手烫了好几回，笑话一个也没落下。
  s_camila:
    name: 卡米拉·雷斯特雷波
    ethnicity: 梅斯蒂索人
    jobs:
      - 生物学家
      - 大学讲师
    bio: 在麦德林上方的云雾林里数青蛙和兰花，数得忘了吃饭。
    story: 卡米拉在麦德林的一套公寓里长大，那时山只是窗外的风景。十四岁学校组织去云雾林，一切就变了。黑夜里听一声蛙鸣她就能叫出物种，论文也写得犀利，可她几乎没有恒心，丢下了四个做到一半的项目。她还兼职教课，有位同事盯着她按日程走。她身体单薄，不止一次发着烧从山上下来，手脚又笨，有两台相机掉进了溪里。幸好运气一再救她，一笔经费在年末最后一天到账。现在山村里一位小学老师带着学生来数青蛙，还常给她寄孩子们的画。
    sayings:
      full:
        - 每一声蛙叫都对上了名字，连我自己肚子叫我都认得了。
      part:
        - 记了一半，另一半还在树上叫，不肯下来。
      none:
        - 青蛙没出来，我也忘了吃饭，两边扯平。
      rough:
        - 淋得像只青蛙，笔记本倒是干的。
  s_quispe:
    name: 马里亚诺·基斯佩
    ethnicity: 克丘亚族
    jobs:
      - 牧羊人
      - 土豆农
    bio: 在库斯科附近的高地放了五十年羊驼，每一只都叫得出名字。
    story: 马里亚诺十二岁起就走在库斯科附近的高山牧场上，先是跟在父亲身后，后来独自一人，坡下的梯田里还种着土豆。他没上过学，字和地契都让他束手无策，手也笨，羊驼的毛要靠邻居来剪。他有的是山一样的意志。看山顶的颜色就知道天气，听声音就认得每一只羊驼。冰雹和霜冻总爱绕开他那道坡。儿子们去城里找活干时，他没有争，也没有搬。谁对他的羊驼说了不中听的话，他能难过好几天。他最大的心愿，是孙辈有一天陪他爬一次那道坡。
    sayings:
      full:
        - 一只都没少，连最调皮的那只也回来了。
      part:
        - 走散了几只，会回来的，山认得路。
      none:
        - 今天山神没开口。
      rough:
        - 摔了一跤。山还在，我也还在。
  s_jamal:
    name: 贾马尔·惠特菲尔德
    ethnicity: 非洲裔
    jobs:
      - 急救员
      - 网约车司机
    bio: 在亚特兰大开夜班救护车，后座上不管是谁，他都握着手。
    story: 贾马尔在亚特兰大西南区长大，他奶奶当年等救护车等了四十分钟，这件事他一直记在心里。书本上的东西他学得慢，急救医士的考试考了两次，二十九岁才通过，休息日还要开网约车还债。他力气很大，一个人能把病人背下三层楼。他的运气是全站最差的，车坏过，爆过胎，一场车祸让他住了一个月院，最难的出诊也总落到他头上。每次出完难熬的诊，他会在车里坐几分钟再继续上路。在家里他正慢慢学做饭，每周给女儿学一道新菜。
    sayings:
      full:
        - 送到了，手一路没松开。
      part:
        - 送到了几个。剩下那几个，我会一直记着。
      none:
        - 晚了一步。下回我闯红灯，就这么定了。
      rough:
        - 我自己也该躺后座了。先把病人送到，我再躺。
  s_emily:
    name: 艾米莉·塔古纳
    ethnicity: 因纽特人
    jobs:
      - 丛林飞行员
      - 飞行教员
    bio: 驾着小飞机往返加拿大北部的村镇，三十年里只因天气折返过两次。
    story: 艾米莉出生在北方一个小镇的因纽特家庭，冬天出镇的唯一办法就是坐飞机。她看着邮政飞机降在冰面上，九岁就决定要自己开它。书面的东西是她最大的短处，执照的理论考试考了五次才勉强过，飞行日志至今离了别人帮忙也填不好。可一握上操纵杆，她的手就完全不一样。她送过药，送过信，有一回把整支冰球队运过同一片冻湖，也有人对她说这不是镇上姑娘该干的活。她至今仍先抬头看天，再去看天气预报。眼下她在带一位同社区的年轻飞行员，教法多半是大声喊和用手指。
    sayings:
      full:
        - 准点落地，连雪都给我让了道。
      part:
