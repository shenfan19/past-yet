      p3:
        was: 1847 年玛丽·安宁去世，四十七岁，手头一直拮据，写她发现的论文很少提她的名字。
        now: 那个冬天有人告诉过她，她挖出的骨头以后会在伦敦的博物馆里写着她的名字，莱姆里吉斯的海边会立起她的像。
    vignettes:
      stone: '{staff}沿裂缝描过骨架的颈部。裂纹越出骨头，仍往岩石里去。走到那处分界，笔尖便抬了起来。'
      vertebrae: '{staff}从另一端数颈骨。两边数不到一起，就在有疑问的地方留了个括号，等下回再看。'
      pose: '{staff}把抄图转了几回，直到从这边望过去也能一下找见头部，才在图下写上发现者的名字。'
  hertz_bonn:
    name: 最后一个学期
    place: 波恩
    figure: 海因里希·赫兹
    story: 1892 年初起，赫兹的鼻子和喉咙反复剧痛，有时痛得无法工作。1893 年他一边做了几次手术，一边回到波恩大学讲课，写完了《力学原理》。1894 年 1 月 1 日，他在波恩去世，年仅三十六岁，书在他死后出版。
    story_prose:
      opening:
        - 波恩的教室门口已经贴了课表。赫兹手里有自己要讲的一页，还有《力学原理》上想再看一眼的几行。他问年轻同事，此刻有几个学生等着问课。
        - 赫兹在末病中继续整理《力学原理》，1893 年 12 月交稿，次年 1 月 1 日去世。你可以替他办下一堂课的交接，让他决定怎么用空下来的一段时间。
        - 熟悉课堂的人可以帮忙核一遍学生的题。会有人代讲和回答时，仍由赫兹自己决定哪堂能交过去。
      points:
        p1: 同事把两张课单摊开，说后一堂他可以替上，却不知道哪些问题学生已经问过。你请赫兹挑出当天的那张，并把应当接着答的两处圈明。同事把课单拿走前，当面说了答疑会在哪间屋里。赫兹把原来夹在讲稿里的纸取下来，夹到力学书稿要校的那一页。
      outcomes:
        all: 学生照约定在那位同事的课堂上问了问题。书稿按时交出，赫兹在次年元日去世。
        p1: 有同事去教那一堂课。赫兹拿到空出来的时间，先歇了一会儿，再看稿上的记号。
      none: 课单还在赫兹手里。他把书稿合上，留着下回再核那几行。
      not_admitted: 没人答应在开讲前见你。走廊里的学生等了一阵，又回到贴课表的那栋楼。
      excerpts:
        p1: 赫兹把原来夹在讲稿里的纸取下来，夹到力学书稿要校的那一页。
    relic: 一张折过的课单
    relic_desc: 虚构的课单，其中一堂做了记号。
    points:
      p1: 问赫兹哪一堂课可以交给同事，帮他安排当天由谁回答学生的提问
    points_fail:
      p1: 课还在赫兹的日程上。他只好把稿上的那处改动再往后放一放。
    shift:
      p1:
        was: 赫兹于 1893 年在波恩带病讲课，在去世前完成了《力学原理》。
        now: 这条分支里，赫兹请同事代一堂课，自己先歇了一会儿。稿子送出去以前，他还能口述一处更正，请人记下来。
    vignettes:
      repeat: '{staff}把两个问题念给代课的同事。他把不用翻赫兹书稿就能回答的那一个圈起来。'
      signal: 有学生在等错了的教室外。{staff}指给他看代课同事在课表上记的那一间。
      gap: '{staff}在纸上空一行留给讲师写答复，把纸放到下一位学生找得到的地方。'
  kepler_leonberg:
    name: 证人亲眼看见的事
    place: 莱昂贝格
    figure: 约翰内斯·开普勒
    story: 1620 年，莱昂贝格的邻居指控天文学家约翰内斯·开普勒的母亲卡塔琳娜，案子已拖了五年。8 月 7 日，她在霍伊马登的女儿家中被捕，后来从莱昂贝格转押到居格林根，看守费用由家里承担。那年 9 月，约翰内斯从林茨回来为母亲辩护。审理一拖再拖。1621 年秋，卡塔琳娜获释，距被捕已过了一年多。
    story_prose:
      opening:
        - 1620 年，莱昂贝格。卡塔琳娜·开普勒受人指控，争讼已拖了五年。八月她在霍伊马登被捕，儿子约翰内斯于九月从林茨回来为她辩护。
        - 史实里，她在居格林根被关了一年多，戴着锁链过冬，连看守的费用也由家里承担。在这条分支里，狱卒的妻子仍要端汤走上那条巷子，有人能够替她接一接锅，也能在案卷送走前看一眼纸上的字。
        - 这一趟用得上管得住文书、分得清证词来路的人。能照顾老人、带得来御寒衣被的人，在入冬以后也有事可做。
      points:
        p1: 卡塔琳娜被带到莱昂贝格后，{staff}照管文书的办法请保管人另抄一份，当面点过页数，再交存。收件人把副本放进待归档的纸叠。原件折回去时，{staff}用指腹把翘起的纸角压平。
        p2: '{staff}陪家人把证词摊开，依次核对是谁看见的、听谁讲的、哪一段是后来推出来的。一页抄件上多了三栏，原先挤作一行的说法有了空隙。写到一个没人亲眼见过的地方，笔尖停在栏线前。'
        p3: 寒天里，{staff}同看守打点好，把厚衣被和一碗热饭送到挂着锁链的床边。她接碗前，先把被角往膝头掖了掖。铁环靠在床板上，双手慢慢合拢在热碗外面。
      outcomes:
        all: 证词与申辩后来还能按页对读。卡塔琳娜在牢里有厚被和热饭，次年秋天获释时，家里人等在门外，手里带着一件能裹到下巴的外衣。
        p3: 冬尽了，铁锁才不再冰得刺手。她熬过那个冬天，收拾铺位时，把厚被的两个角仔细对齐。
        p2: 抄件到了律师手里。他在证人没有亲眼见到的几行旁作了记号，翻过一页，又把它翻回来。
        p1: 那份申辩后来仍能在卷中找到。翻得多了，折起的纸角只剩一条发白的脊。
      none: 墙边冷下来，汤面很快结了一层皮。窗外经过一辆车，铁轮碾过石缝，一声比一声远。
      not_admitted: '{staff}没能进到保管案卷的屋里。门里的人挪开一捆纸，缚纸的绳子在桌上擦了一声。'
      desync: 缺了申辩的案卷已经合起。{staff}被召回时，桌边还留着一道方方的纸印。
      excerpts:
        p3: 她接碗前，先把被角往膝头掖了掖。铁环靠在床板上，双手慢慢合拢在热碗外面。
        p2: 一页抄件上多了三栏，原先挤作一行的说法有了空隙。写到一个没人亲眼见过的地方，笔尖停在栏线前。
        p1: 收件人把副本放进待归档的纸叠。原件折回去时，{staff}用指腹把翘起的纸角压平。
    relic: 一页申辩书抄本
    relic_desc: 一页誊清的书面申辩，页边改过一个日期。
    points:
      p1: 卡塔琳娜被带到莱昂贝格以后，请保管申辩书的人立刻另抄并交存一份，护住书面申辩继续进入程序
      p2: 让家人整理原证词，逐项区分证人亲眼所见、由人转述和后来附上的推断
      p3: 给居格林根牢里戴着锁链的卡塔琳娜送进厚衣被和热饭，让七十三岁的她熬过这个冬天
    points_fail:
      p1: 家里能找到的那份申辩书没能转交。案卷只剩指控人的陈述，事务所因同步失败召回员工。
      p2: 三种说法抄在同一栏。送进案卷以后，辩护人还要再追问最早是谁说的。
      p3: 这条分支里，她照史实戴着锁链过冬，身边只有日夜看守的两个人，看守的费用还要家里出。
    shift:
      p1:
        was: 卡塔琳娜于 1620 年 8 月被捕。约翰内斯·开普勒随后经律师坚持把程序落实在书面记录上。
      p2:
        was: 审理留下证词及书面辩护。辩方逐项回应并反对把猜测当作说法之间的因果。
        now: 送给律师的抄本可以按栏核查。辩护人先指出证人未能亲验的数项。
      p3:
        was: 1620 年 8 月 7 日卡塔琳娜·开普勒被捕，押到居格林根，戴着锁链关押十四个月，两人日夜看守，费用由她和家人承担；1621 年秋获释，约半年后去世。
        now: '{staff}替家里打点好看守，那个冬天她有厚被和热饭，锁链没有卸下，身子却比历史上撑得住些。'
        who: katharina_kepler
        bio: 这条时间线里，卡塔琳娜·开普勒在居格林根牢里的第一个冬天有厚被和热饭，1621 年秋获释时身子比历史上硬朗些。
    vignettes:
      soup: 9 月 13 日，{staff}替狱卒的妻子端大麦汤走上居格林根的小巷。她说卡塔琳娜的碗很好认，每次送回来都刮得干净，还嫌盐少。锅盖一颠，她伸手把它按住。
      hearing: 10 月 2 日，{staff}和文书各抱一捆案卷爬上市政厅台阶。开庭又改了日子。文书把两捆纸搁在台阶上，说这条路走了这么多回，早该自己认得了。
      frost: 十一月中，{staff}搭运货马车往居格林根去。车夫说察伯河谷这一段一上冻，听车轮的音高就知道还有多远。车进河谷，他松了松缰绳，侧过耳朵。
  pushkin_st_petersburg:
    name: 门牌号尚未出现的那户人家
    place: 圣彼得堡
    figure: 亚历山大·普希金
    story: 1836 年到 1837 年，亚历山大·普希金住在莫伊卡河畔、科纽申内桥旁沃尔孔斯卡娅公爵夫人的房子里。旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，旧历 1 月 29 日，也就是新历 2 月 10 日在那里去世。他葬在米哈伊洛夫斯科耶庄园附近，在他母亲身旁。
    story_prose:
      opening:
        - 新历 1837 年 1 月，圣彼得堡。亚历山大·普希金一家住在莫伊卡河畔、科纽申内桥边沃尔孔斯卡娅公爵夫人的房子里，门上还没有今天那个门牌号。他用诗体写了《叶甫盖尼·奥涅金》，常被看作现代俄国文学的奠基人。
        - 史实里，这一冬他越欠越多；新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，两天后死于腹膜炎，三十七岁，留下妻子和四个孩子，欠下的债后来由沙皇替他还清。在这条分支里，有个来打听寓所的人都找他问路的门房，还有个常差人往桥那头跑腿的女仆。
        - 这一趟用得上几种人：会管账、做过买卖，或条理清楚、心思敏捷，理得清一摞欠单的人；懂医护的人，或带着急救包、临事镇定守得住的人；带着抗生素的医生，或带着纳米医疗箱的医护。
      outcomes:
        all: 二月过去，普希金还在莫伊卡河畔养伤，书桌上的欠单已经理成了一张单子。他又写了几年，《同时代人》仍在他手里办着。
        p3: 二月过去，他还在莫伊卡河畔养伤，能扶着墙走到窗边。后来几年，《同时代人》仍在他手里办着。
        p1: 那张单子一直压在墨水瓶底下。后来家里的开销，都照着它一笔一笔安排。
        p2: 他活着回到了莫伊卡河畔的家，被抬进书房，躺在那张沙发上。门厅里，来打听消息的人一直站到了街上。
      none: 新历 2 月 8 日傍晚，黑溪边的雪地上，他没能撑到城里。书桌上那摞欠单还压着，没有人动过。
      desync: 新历 2 月 8 日傍晚，回城的路走到一半，车厢里没了动静。{staff}被召回时，马车停在雪地里，车门半开着，地上落着一只手套。
      not_admitted: '{staff}没能进那户人家，只跟着门房从桥边沿莫伊卡河走了一趟，数清了指路时要说的几个转弯。门房说，最近来问路的人多了，都要找桥边那栋房子。'
      points:
        p1:
          class_lettered: 新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}做惯了案头的事，把欠单一张张摊开，按日子和数目抄成一张清单，哪笔先还，哪笔能缓，在旁边各画一道。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。
          class_trade: 新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}做过买卖，认得铺子里的规矩，把欠单按债主分成几叠，哪家肯缓一缓，哪家等不得，一叠一叠写上字条，再合抄成一张单子。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。
          else: 新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}心细，把欠单按到期的先后排好，抄成一张单子，一行一行对过数目。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。
        p2:
          class_medical: 新历 2 月 8 日傍晚，黑溪边的雪地上。丹特斯先开了枪，普希金腹部中弹，血流了很多，被人扶上马车往城里赶。{staff}懂急救，跪在车厢里按住伤口，用干净的布一层层压紧，隔一阵摸一次他的脉，一路没有松手。马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。
          else: 新历 2 月 8 日傍晚，黑溪边的雪地上。丹特斯先开了枪，普希金腹部中弹，血流了很多，被人扶上马车往城里赶。{staff}打开带来的急救包，用纱布压住伤口，把自己的大衣也垫在他身下，车一颠就伸手把他托稳。马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。
        p3:
          class_learned: 新历 2 月 9 日，他在书房的沙发上躺了一夜，伤口发起热来，疼得咬紧了牙。{staff}是医生，看出伤口里起了感染，清过伤口，把带来的药用上，换了干净的纱布，一个钟头看一回。2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。
          else: 新历 2 月 9 日，他在书房的沙发上躺了一夜，伤口发起热来，疼得咬紧了牙。{staff}懂医护，打开带来的医疗箱，照着说明把药用上，守着他的体温，一个钟头量一回。2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。
      excerpts:
        p3: 2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。
        p2: 马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。
        p1: 普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。
    relic: 一本诗集
    relic_desc: 一本小书，某首诗里夹着一片压干的叶子。
    points:
      p1: 帮他把越欠越多的债理出头绪，让妻子和孩子的日子不再悬着
      p2: 中弹以后，护住从黑溪回城那一路，让他活着回到莫伊卡河畔的寓所
      p3: 治好他腹部的枪伤，压住伤口里的感染，让他活下来
    points_fail:
      p1: 这条分支里，那个冬天的欠单照旧压在书桌上，没有人替他理过。
      p2: 他没能撑到莫伊卡河畔，这条分支里没有寓所里的那两天。
      p3: 2 月 10 日下午，他照史实在寓所里去世，这条分支里也没能多留他一天。
    shift:
      p1:
        was: 1837 年 2 月普希金去世时欠下大笔债务，后来由尼古拉一世替他还清。
        now: 欠账理成了一张单子，哪笔先还、哪笔能缓，家里心里有了数。
      p2:
        was: 1837 年 2 月 8 日决斗中弹以后，普希金被送回莫伊卡河畔的寓所。
      p3:
        was: 1837 年 2 月 10 日他在寓所里死于腹膜炎，三十七岁，留下妻子和四个孩子。
        now: '{staff}带去的药压住了伤口的感染，二月过去时他还在莫伊卡河畔养伤。他又写了几年，《同时代人》仍在他手里办下去。'
    vignettes:
      number: '{staff}差点把一块博物馆门牌上的号码告诉来访的人，可那块牌子这时还没有，便划掉数字，在纸条上画了那座桥。来人捏着纸条，朝河边走去。'
      queue: '{staff}把同一句回答抄在几张纸条上，门厅里等着的人看了就不用再问。地板上踩满了带雪的脚印。'
      river: '{staff}跟着门房从桥边沿莫伊卡河走一遍，河面结着冰，数清指路时该说的几个转弯。'
  chekhov_badenweiler:
    name: 寄往弗里德里克别墅的回信
    place: 巴登魏勒
    figure: 安东·契诃夫
    story: 1904 年 6 月，四十四岁、肺结核已经很重的安东·契诃夫，和妻子奥尔加·克尼佩尔来到黑森林的疗养地巴登魏勒。他们先住罗马浴旅馆，后住弗里德里克别墅，最后搬进邮局隔壁的索默旅馆。他往家里写的信都很轻快，七月里还托朋友打听哪一班轮船能走海路送他们回俄国。7 月 15 日凌晨，他在那里去世。
    story_prose:
      opening:
        - 1904 年 6 月，黑森林里的疗养地巴登魏勒。安东·契诃夫四十四岁，肺结核已经很重，在莫斯科瘦了一大圈，喘不上气。他和妻子奥尔加·克尼佩尔从俄国一路坐车过来，先住进罗马浴旅馆，两人都累坏了。
        - 史实里，他们后来搬进弗里德里克别墅，又搬到邮局隔壁的索默旅馆。他往家里写的信都很轻快，7 月 11 日还写信打听哪一班轮船能走海路送他们回俄国。7 月 15 日凌晨，他在那里去世。在这条分支里，别墅的女佣跟着太阳挪躺椅，邮局门口的邮差掂得出一封俄国信够不够邮票。
        - 这一趟用得上三种人：做事细、守得住信件和地址的人，耐得住性子、能把一串问题压成一封短电报的人，懂医、带着纳米药箱来的人。
      outcomes:
        all: 那个夏天过去，契诃夫和奥尔加坐船回到了俄国。甲板上风很大，他把那身法兰绒衣服的扣子一颗颗扣上了。
        p3: 夏天过后，契诃夫和奥尔加动身回俄国。站台上，他穿着那身法兰绒衣服。
        p2: 那张回电的薄纸，一直摊在写字桌上，舱位那一行被手指摸得发了毛。
        p1: 玛丽娅收到了那封信。信封背面是弗里德里克别墅的地址，一笔一画，都对。
      none: 巴登魏勒的七月很热。阳台的躺椅跟着太阳挪了一天，傍晚又挪回原处。
      desync: '{staff}被召回时，写字桌上已经空了。玛丽娅还不知道哥哥住到了哪里。'
      not_admitted: '{staff}没能进那座别墅。花园里的太阳一直照到晚上七点，楼上的人写几行信就要歇一歇。'
      points:
        p1: 6 月 25 日，搬进弗里德里克别墅的第三天，契诃夫坐在那张写字桌前给玛丽娅写信，写几行就要歇一歇。{staff}把信末的回信地址一个字母一个字母核过去，街名和门牌都对上了。契诃夫在信尾签了名，把笔搁下，靠回椅背，望着窗外喘了一会儿。
        p2: 7 月 11 日，屋里热得像蒸笼。契诃夫在信里一条条问：船哪天几点开，走几天，能不能要一间两个人的舱。{staff}把这几个问题压成一封短电报，发给熟悉这条航线的人。回电到的时候，开船的日子、路上的天数和舱位，都写在一张薄纸上。奥尔加把纸念给他听，念到舱位那一行，他让她再念一遍。
        p3:
          class_learned: '{staff}先照诊病的老规矩听了他的胸口，数过呼吸，才打开纳米药箱，按他的体重定下剂量，每天早晚各看一回。七月的酷暑里，他咳得少了。十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。'
          else: '{staff}打开纳米药箱，照说明一格格配好药，按钟点守在床边给药、量体温，夜里每隔一阵就看一眼他的呼吸。七月的酷暑里，他咳得少了。十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。'
      excerpts:
        p3: 十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。
        p2: 回电到的时候，开船的日子、路上的天数和舱位，都写在一张薄纸上。奥尔加把纸念给他听，念到舱位那一行，他让她再念一遍。
        p1: '{staff}把信末的回信地址一个字母一个字母核过去，街名和门牌都对上了。契诃夫在信尾签了名，把笔搁下，靠回椅背，望着窗外喘了一会儿。'
    relic: 一副夹鼻眼镜
    relic_desc: 一副系着细绳的小圆眼镜。
    points:
      p1: 契诃夫刚安顿下来时，把他写给妹妹玛丽娅的回信地址逐字核对，趁他还有力气写完，把信交出去
      p2: 用他 7 月 11 日列在信里的问题请熟悉航线的人发一封短电报，让他在巴登魏勒得到想问的返程消息
      p3: 治好他的肺结核，让他和奥尔加一起动身回俄国
    points_fail:
      p1: 行李还按上一处旅馆收放，写字桌上的信封被一并带走。玛丽娅没有收到他从别墅寄出的地址，事务所因同步失败召回员工。
      p2: 他关于船期、舱位和航行天数的问题随普通信寄出。等回信的日子里，手边仍没有一份可以读的答复。
      p3: 7 月 15 日凌晨，契诃夫在巴登魏勒去世，年仅四十四岁。
    shift:
      p1:
        was: 1904 年 6 月 25 日（俄历 6 月 12 日），契诃夫从巴登魏勒写信给玛丽娅，写明弗里德里克别墅的详细回信地址。
      p2:
        was: 1904 年 7 月 11 日，契诃夫写信给罗索利莫询问由马赛乘船去敖德萨的细节。他于 7 月 15 日在巴登魏勒去世，未能作这趟旅行。
        now: 负责航线的人回电报来，把开船日、路程和两人可用的舱位写得清楚。契诃夫和妻子在旅馆把这张纸读完，也商量了若能动身最想选哪一班。
      p3:
        was: 1904 年 7 月 15 日，契诃夫在巴登魏勒因肺结核去世，终年四十四岁。
        now: 他的肺病好了，夏天过后和奥尔加坐船回到俄国。此后他又写了好些年，也回到莫斯科艺术剧院看排练。
        who: chekhov_badenweiler
        bio: 契诃夫在巴登魏勒治好了肺结核，1904 年秋天回到俄国，此后继续写小说和戏剧多年。
    vignettes:
      garden: 6 月 27 日，草叶上的露水刚干，{staff}帮弗里德里克别墅的女佣把一张躺椅跟着太阳在花园里挪位置。她说这里的太阳七点整离开草坪，这家人开晚饭看的是太阳，不是门厅里那座钟。
      post: 7 月 7 日，{staff}坐在索默旅馆隔壁邮局门口的长凳上，邮局的门开开关关。邮差说，夏天巴登魏勒写信最多的是俄国人，写得最短的是英国人；俄国人的信封他掂一掂，就知道够不够邮票。
      ice: 7 月 10 日热得最凶，{staff}帮索默旅馆的门房用麻袋从地窖往楼上扛一块冰，冰水顺着麻袋往下滴。门房说黑森林二十年没见过这样的七月，米尔海姆来的卖冰人都开始按楼梯级数算钱了。
  puccini_brussels:
    name: 没写完的二重唱
    place: 布鲁塞尔
    figure: 贾科莫·普契尼
    story: 1924 年 11 月，普契尼到布鲁塞尔治病，《图兰朵》的结尾还没写完。有一页稿，乐句写到一半停住了。另一页上列着几样乐器。后来，弗兰科·阿尔法诺要从这些零散的音符里接出一段乐团能演奏的音乐。
    story_prose:
      opening:
        - 1924 年 11 月，普契尼到布鲁塞尔治病。《图兰朵》写到末场，二重唱的结尾还留在几张散页上。有的写了几小节，有的只记着乐器。
        - 史实里，他当月在布鲁塞尔去世。后来，阿尔法诺要从留下的草稿里接出乐团能演奏的音乐。在这条分支里，抄谱人把两行相近的谱摊在一张桌上，等人把它们读给作曲家听。
        - 这一趟用得上读得懂总谱、认得出两个接法的人，也用得上会照护病人、能在床边守一夜的人。
      points:
        p1: '{staff}顺着低声部把两种接法对读到转调处，照次序把两页摊给普契尼。普契尼在其中一行边上作了记号。铅笔抬起来时，那一小节的末尾还留着空白。'
        p2: 最后一夜，{staff}靠着照护的经验替普契尼垫好枕头，守在伸手可及的地方。谱合在床边，书脊朝外。他的手伸过来，在挨着床沿的椅背上停住了。
      outcomes:
        all: 后来，接手的人可以从谱上的铅笔印起笔。那夜的病房里，谱已合上，床边的椅子还挨着床沿。
        p2: 那一夜他有片刻睡稳了。椅子一直挨着床沿，伸手就摸得到。
        p1: 接手的人把散页摊开。翻到转调的一小节，一道铅笔印正落在要下笔的地方。
      none: 床边的椅子空着。桌上的两张纸一角相叠，压在上头的是哪张，得走近才看得出。
      not_admitted: '{staff}没能在诊所帮上忙。走廊尽头的门下露出一道灯光。'
      excerpts:
        p2: 谱合在床边，书脊朝外。他的手伸过来，在挨着床沿的椅背上停住了。
        p1: 普契尼在其中一行边上作了记号。铅笔抬起来时，那一小节的末尾还留着空白。
    relic: 二重唱草稿
    relic_desc: 一张五线谱纸，没写完的乐句旁留着铅笔字。
    points:
      p1: 趁普契尼还能审稿，帮他从末场二重唱的两份草稿里标出自己想留的一种写法
      p2: 用照护经验减轻普契尼在最后一夜的病痛
    points_fail:
      p1: 两张草稿照旧分开搁着。接手的人还得自己猜他想用哪一种。
      p2: 这一夜过去，床边的椅子还是空的，病痛也没能缓下来。
    shift:
      p1:
        was: 1924 年 11 月，末场二重唱仍是散页，阿尔法诺后来要从留下的草稿里找出接法。
        now: 普契尼在二重唱转调的地方标下自己想留的一种写法。接手的人从他标的这一处起笔。
      p2:
