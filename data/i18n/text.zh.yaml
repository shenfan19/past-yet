      - 生物学家
      - 大学讲师
    bio: 在麦德林上方的云雾林里数青蛙和兰花，数得忘了吃饭。
    story: 卡米拉在麦德林的一套公寓里长大，那时山只是窗外的风景。十四岁学校组织去云雾林，一切就变了。黑夜里听一声蛙鸣她就能叫出物种，论文也写得犀利，可她几乎没有恒心，丢下了四个做到一半的项目。她还兼职教课，有位同事盯着她按日程走。她身体单薄，不止一次发着烧从山上下来，手脚又笨，有两台相机掉进了溪里。幸好运气一再救她，一笔经费在年末最后一天到账。现在山村里一位小学老师带着学生来数青蛙，还常给她寄孩子们的画。
  s_quispe:
    name: 马里亚诺·基斯佩
