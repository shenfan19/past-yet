    relic: 一只朴素的陶杯
    relic_desc: 一只普通的杯子，被留下来，是因为那个最后的夜晚。
    points:
      p1: 与他对话而不被问倒
      p2: 在广场上做他不嫌烦的熟人
      p3: 站完整个审判的下午
  hippocrates_kos:
    name: 把医学当作细致的观察
    place: 科斯岛
    figure: 希波克拉底
    story: 在科斯岛，一位医生和他的学派教人：疾病有自然的原因，要守在床边仔细看。
    relic: 一根青铜探针
    relic_desc: 一件细细的器具，属于宁愿多看也不乱猜的医生。
    points:
      p1: 在床边记下病程
      p2: 照看同屋的病人
      p3: 同学徒们一起记录
  plato_academy:
    name: 最早的学园
    place: 雅典
    figure: 柏拉图
    story: 柏拉图在雅典城外的树林里办起学园，一个把数学和哲学放在一起学习的地方。
    relic: 一块蜡板
    relic_desc: 木板上的字迹可以抹平，再写一遍。
    points:
      p1: 跟上学园里的论证
      p2: 把对话整理成文
      p3: 在学园门口替这个话题说话
  aristotle_lyceum:
    name: 给生物世界分类
    place: 雅典
    figure: 亚里士多德
