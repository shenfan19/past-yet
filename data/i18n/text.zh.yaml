    place: 马萨诸塞州剑桥
    figure: 亨丽埃塔·勒维特
    story: 亨丽埃塔·勒维特是哈佛天文台的人工计算员，她发现越亮的造父变星脉动越慢，天文学家因此可以量出宇宙的尺度。她拿着微薄的薪水，1921年去世。
    relic: 一块玻璃底片
    relic_desc: 一块布满细小星点的照相底片。
