  sun_yat_sen_1924:
    labels:
      sick: 悬而未决的事
      dead: 没人再问的事
      deaths: 拖到没人再问的事
      treated: 名册抄成的百分数
      protected: 校址走熟的百分数
    identities:
      local_scholar:
        name: 誊清屋里的帮手
        cover: '{staff}说自己读过几年书，字还过得去，愿意帮着抄写。'
      pen:
        name: 外面来的记者
        cover: '{staff}说自己替外面的报纸写稿，想看看这所新大学是怎样办起来的。'
      wanderer:
        name: 来听讲的游方人
        cover: '{staff}说自己是游方的，听说这里星期天有人演讲，想来听听。'
      maker:
        name: 礼堂门口做小买卖的
        cover: '{staff}说自己有一门手艺，想在人多的地方摆个摊。'
      far_guest:
        name: 船上下来的远客
        cover: '{staff}说自己是跟船来的，要在广州住上一阵。'
    personal:
      records_read_aloud:
        s_fan: '{date}，沈凡的字潦草得连自己都要猜。他念名字，一位办事员写，他顺手把三本名册里重了的名字一个个标出来。'
        s_somchai: '{date}，颂猜识字，手笨，写出来的字没人认得。他念名字，一位办事员写。在寺里别人上房修屋顶，他也是在下面扶梯子的那一个。'
      sunday_first:
        s_fan: '{date}，沈凡挤在礼堂最后面，听不全，就数台下有多少人、多少人在记笔记，记在本子上。'
        s_samuel: '{date}，塞缪尔挤在礼堂最后面，踮着脚记。离得太远，他记下的一半是台下人的脸色。'
        s_amara: '{date}，阿玛拉挤在礼堂最后面，听不全。旁边一个学生站久了发晕，她扶他坐下，按着他的手腕数了一阵。'
      spoiler:
        s_fan: '{date}，沈凡知道两年以后这所学校会改用孙先生的名字，也知道一百年以后自己会从这所学校的铜像前出发。他把这两句话写在本子最后一页，合上了。'
        s_guilan: '{date}，桂兰知道两年以后这所学校要改名。那几个字她不会写，在心里记了一遍，没有对人说。'
        s_somchai: '{date}，颂猜知道两年以后这所学校会改用孙先生的名字。他把这句话写在本子最后一页，合上了，接着去问办事员在读什么。'
        s_carlos: '{date}，卡洛斯知道两年以后这所学校要改名。他不会写，就讲给炉子听，讲完自己先笑了。'
        s_samuel: '{date}，塞缪尔知道两年以后这所学校要改名，这是一条谁也没有的消息。他写在本子最后一页，又划掉了，没有地方可以发。'
        s_amara: '{date}，阿玛拉知道两年以后这所学校要改名。她把这句话写在本子最后一页，合上了。'
      pamphlet_given:
        s_fan: '{date}，办事员把一本刚印出来的《民族主义》递给沈凡，说屋里的人一人一本。沈凡先翻到序，看了落款的日子。'
        s_samuel: '{date}，办事员把一本刚印出来的《民族主义》递给塞缪尔。他问这是第几版，办事员说，头一版。'
      errand_frail:
        s_fan: '{date}，沈凡爬几级楼梯就喘，送不了稿。他坐在誊清的屋子门口，数一份稿子来回走了几趟。'
        s_somchai: '{date}，颂猜爬几级楼梯就喘，送不了稿。他坐在誊清的屋子门口，看贴着签注条的稿子进进出出。'
        s_samuel: '{date}，塞缪尔的肠胃又闹了几天，爬几级楼梯就喘。他坐在誊清的屋子门口，把每一趟送稿的时刻记了下来。'
      homesick_may:
        s_fan: '{date}，没有记载的一个月。沈凡在本子上画正字，画满了一百天，又在旁边算了一遍，事务所那边只过了三天多。'
        s_guilan: '{date}，没有记载的一个月。桂兰数着日子，家里的辣椒这时候该下地了。事务所那边只过了三天多。'
        s_somchai: '{date}，没有记载的一个月。颂猜还想亲眼看一次雪，广州的五月没有雪。事务所那边只过了三天多。'
        s_carlos: '{date}，没有记载的一个月。卡洛斯每天三点就醒，这里没有他的炉子，他站在别人的灶边看了一早上。事务所那边只过了三天多。'
        s_samuel: '{date}，没有记载的一个月，对一个记者最难熬。塞缪尔在本子上画正字，画满了一百天。事务所那边只过了三天多。'
        s_amara: '{date}，没有记载的一个月。阿玛拉算了算，这一百天里病房该添了多少个孩子。事务所那边只过了三天多。'
        s_jeanluc: '{date}，没有记载的一个月。让-吕克像记航海日志一样一天记一行，记满了一百天。事务所那边只过了三天多。'
      shipai_frail:
        s_fan: '{date}，沈凡知道城东的石牌以后会盖起什么。路太远，他走不到。'
        s_somchai: '{date}，颂猜知道城东的石牌以后是什么样子。路太远，他走不到。'
        s_samuel: '{date}，塞缪尔知道城东的石牌以后是什么样子，那会是一条好稿子。路太远，他走不到。'
      last_seat:
        s_fan: '{date}，沈凡坐在老位置上听完了这一讲，本子上记的场次停在十六。散场后他多坐了一会儿。'
        s_guilan: '{date}，桂兰坐在老位置上听完了这一讲。散场后她没有马上走，把长凳一条一条摆齐了。'
        s_somchai: '{date}，颂猜坐在老位置上听完了这一讲。散场后他多坐了一会儿，像在寺里等最后一声钟。'
        s_samuel: '{date}，塞缪尔坐在老位置上记完了这一讲。他知道这是最后一讲，本子上只写了场次，没有写最后两个字。'
        s_amara: '{date}，阿玛拉坐在老位置上听完了这一讲。散场后她多坐了一会儿，等最后一个人走出门。'
        s_jeanluc: '{date}，让-吕克站在老位置上听完了这一讲。散场后他最后一个离开，像船长最后一个下船。'
      records_shut:
        s_guilan: '{date}，桂兰只念到三年级，抄名册插不上手。她把三所学校的门房都认熟了，谁在哪里，问她比翻名册快。'
        s_carlos: '{date}，卡洛斯只会写自己的名字，抄名册插不上手。他把三所学校的门房都认熟了，谁在哪里，问他比翻名册快。'
      sunday_sit:
        s_guilan: '{date}，桂兰在礼堂后排坐下，膝盖不好，却从开讲坐到了散场。台上的话她没全听懂，旁边的学生渴了，她把自己的水递了过去。'
        s_somchai: '{date}，颂猜在寺里听了二十年讲经，在礼堂后排一坐到底。散场时他问旁边的学生最近在读什么。'
        s_jeanluc: '{date}，让-吕克腰不好，偏要站着听，在礼堂后排从开讲站到了散场。'
      pamphlet:
        s_guilan: '{date}，刚印出来的《民族主义》摆在办事员的桌上。桂兰隔着窗看了一眼，封面上的字她认得两个。'
        s_somchai: '{date}，刚印出来的《民族主义》摆在办事员的桌上。颂猜隔着窗看了一眼封面。他知道这本书后来印了多少，只问办事员读到哪里了。'
        s_amara: '{date}，刚印出来的《民族主义》摆在办事员的桌上。阿玛拉隔着窗看了一眼，轻轻哼起歌来。'
        s_jeanluc: '{date}，刚印出来的《民族主义》摆在办事员的桌上。让-吕克隔着窗看了一眼封面。'
      errand:
        s_guilan: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。桂兰在门外择菜，谁出来都问一句吃了没有。'
        s_amara: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。阿玛拉在门外，只看得见送稿人的背影，听脚步就知道那人赶得很急。'
        s_jeanluc: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。让-吕克在门外教门房的孩子打绳结，只看得见送稿人的背影。'
      shipai_reached:
        s_guilan: '{date}，桂兰膝盖不好，还是一步一步走到了石牌。那里只有田，她蹲下来捏了一把土，说这地种得出东西。'
        s_carlos: '{date}，卡洛斯推着车出城往东，走到了石牌，回来说那里只有田。他知道那里以后会盖起一所大学，还是说，只有田。'
        s_amara: '{date}，阿玛拉出城往东，走到了石牌。她知道这里以后是什么样子，站了很久，把眼前的样子画了下来，画得很慢。'
      sunday_stall:
        s_carlos: '{date}，卡洛斯听不懂里面讲什么，在礼堂门口支起炉子烤面包。散场时人涌出来，面包一会儿就卖完了，照老习惯又卖便宜了。'
      pamphlet_traded:
        s_carlos: '{date}，卡洛斯拿一炉面包换了一本刚印出来的《民族主义》。他自己读不了，说带回去给家里想接手面包店的那个孩子。'
      errand_carried:
        s_carlos: '{date}，这条分支里，被叫去送稿的人有一回是卡洛斯。一叠贴着签注条的纸，他一个字也不认得，一张也没弄皱。'
      last_stall:
        s_carlos: '{date}，卡洛斯多烤了一炉。他知道以后的星期天，这扇门口不会再有这么多人，剩下的面包都送了出去。'
      records_begun:
        s_amara: '{date}，阿玛拉开始抄三所学校的名册。书面的东西她一向吃力，抄一行，请办事员对一行。'
      spoiler_said:
        s_jeanluc: '{date}，让-吕克对一位抄写的办事员说，两年以后这所学校会改用孙先生的名字，嗓门一点没提高。办事员头也没抬，说先生人还在，哪有这样起校名的。'
      shipai_walk:
        s_jeanluc: '{date}，让-吕克听说新校址选在城东的石牌。他的膝盖走不了那么远，在码头上朝东望了一阵。'
    name: 广州 1924
    short: 广州
    place_name: 广州，高等师范的礼堂
