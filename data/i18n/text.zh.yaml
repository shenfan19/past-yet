          else: 10 月 4 日，病区不许探视，来打听的人都被挡在楼下，福德姆那边还不知道他在哪里。{staff}做事仔细，问清了院方知道的情形：哪天送来的，住在哪间，谁在照看，把这些和一个能回信的地址写成一封信，赶在往北的邮班之前送到了邮局。邮局的伙计在信封上盖了一个戳。信封上写着福德姆，玛丽亚·克莱姆收，他把它丢进了往纽约去的那只邮袋。
        p3: 10 月 5 日夜里，那间带铁栏的屋子只点着一盏捻得很低的灯。坡对着墙说话，一会儿坐起来，一会儿又躺下，递到嘴边的水一口也不肯碰。{staff}懂医护，守在床边，隔一阵量一回他的脉，等他安静下来的空当，就把杯沿凑到他嘴边，让他抿一小口。天快亮时，坡睡着了。几天后的一个早上，他自己坐了起来，要了一杯水，端着喝完，把杯子放回了窗台上。
