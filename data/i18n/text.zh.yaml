        now: '{staff}把书送到几位同行手里，他们那个冬天就读完了全书。关于它的来信和争论早来了好几年，首印也不用等八年。'
        who: freud_vienna
        bio: 弗洛伊德那本讲梦的书在头一年就有了认真的读者。他等了多年的讨论，1899 年冬天就开始了。
    vignettes:
      window: '{staff}在内城一家书店的橱窗前站了半天，呵出的气在玻璃上结了一小片雾。那本讲梦的新书摆在角上，翻开着扉页，印的是 1900 年。店员出来擦玻璃，说这书要到明年才算新书，眼下先占个位子。'
      cafe: '{staff}在咖啡馆从报架上取下几份夹在木杆上的报纸，把书评栏翻了个遍，哪一份都没提这本书。邻桌的医生说，三百多页讲梦的书，谁有工夫读完，说完又叫了一杯咖啡，接着看他的报。'
      snow: 十二月底下了雪。{staff}帮书店的小伙计铲门口的雪，铲子刮着石板吱吱地响。伙计冻着手翻订货簿，说那本讲梦的书这个月几乎没动，又问梦是不是夏天才好卖。
  cajal_barcelona:
    name: 神经细胞是一个个独立的单位
    place: 巴塞罗那
    figure: 圣地亚哥·拉蒙-卡哈尔
    story: 1887 年底起，圣地亚哥·拉蒙-卡哈尔在巴塞罗那任组织学教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥几十份大多寄给国外的研究者，可他们很少读西班牙文。1889 年 10 月，他自费去柏林参加德国解剖学会的会议，把切片放在显微镜下给人看，会上资深的组织学家阿尔伯特·冯·克利克接过了他的研究。1906 年，他与卡米洛·高尔基分享诺贝尔奖。
    story_prose:
      opening:
        - 1889 年秋，巴塞罗那。圣地亚哥·拉蒙-卡哈尔在大学教组织学，用银染的切片去看神经细胞的分支。前一年，他自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。
        - 史实里，国外的同行很少读西班牙文，他的文章少有人注意。9 月 26 日他拿到出行许可，自筹旅费去柏林，10 月在德国解剖学会的会上把切片放到显微镜下，克利克从此支持他。在这条分支里，实验室里有个学生守着一罐泡着组织的重铬酸钾，还跑去火车站问过去柏林的票价。
        - 这一趟用得上两种人：理得清账目和玻片、守得住行程的人，懂外文、找得到合译者、说得动人帮忙的人。
      outcomes:
        all: 十月，柏林的会场里，显微镜前排着队。排在最前面的人，手里拿着那几页译稿。
        p2: 那以后，卡哈尔寄往国外的信封里，总夹着一份译好的图说。
        p1: 十月，柏林的会场里，卡哈尔把切片推到显微镜下，退开一步，请人来看。
      none: 巴塞罗那的实验室里，那几包玻片还码在木匣里，没有离开桌子。
      desync: 旅费到月底还差一截，玻片也没装好。{staff}被召回时，卡哈尔正把一份文字稿装进信封，准备寄往柏林。
      not_admitted: '{staff}没能进那间实验室。玻片还摊在桌上，去柏林的日子一天天近了。'
      points:
        p1: 9 月 26 日，出行许可批了下来，旅费得自己出。{staff}把能动用的钱一笔笔列在纸上，又把要带的玻片按编号分成几包，每包裹上软纸，装进带隔层的木匣。账算平了，木匣的锁也扣上了。卡哈尔把木匣放在膝上，一路抱着上了去柏林的车。
        p2:
          class_lettered: '{staff}照译稿的规矩，同卡哈尔一张图一张图地对，把图下的说明译成德文，哪一根纤维该叫什么，逐处问清了才落笔。短文誊好，先寄给了几位肯拿切片复核的同行。到了柏林，有人已经拿着那几页纸，在显微镜前等他。'
          else: '{staff}在城里找到一位懂德文的译者，劝他放下手头的活，陪卡哈尔一张图一张图地对，把图下的说明译成德文。短文誊好，先寄给了几位肯拿切片复核的同行。到了柏林，有人已经拿着那几页纸，在显微镜前等他。'
      excerpts:
        p2: 短文誊好，先寄给了几位肯拿切片复核的同行。到了柏林，有人已经拿着那几页纸，在显微镜前等他。
        p1: 账算平了，木匣的锁也扣上了。卡哈尔把木匣放在膝上，一路抱着上了去柏林的车。
    relic: 一支极细的绘图笔
    relic_desc: 细到能画出神经元每一条分支的笔。
    points:
      p1: 在公费未获准时帮卡哈尔把旅费与玻片分包凑齐，保住柏林会上那次亲手演示
      p2: 为难以进入外语期刊的图文找一位合译者，让同业在会前就能按图复核
    points_fail:
      p1: 自费凑不齐长途行程，卡哈尔只能把文字寄过去。柏林没有那次演示，员工因同步失败被召回。
      p2: 外地同行会后才有人设法读懂西班牙文稿，复核仍得逐封通信。
    shift:
      p1:
        was: 1889 年 9 月 26 日，卡哈尔获得出行许可，自筹旅费并在 10 月柏林会议上展示显微切片。
      p2:
        was: 1889 年，卡哈尔自述先前的西班牙文研究在国外少受注意，柏林演示后来帮助传播他的结果。
        now: '{staff}让译者同卡哈尔对照原图校过短文，先寄给愿意核对切片的同行。演示之后，卡哈尔有一条持续寄发图文的渠道。'
        who: cajal_barcelona
        bio: 卡哈尔在巴塞罗那为研究图文建立了稳定的外语协作。后来的手稿可以先在国外找到愿意拿切片复核的同行。
    vignettes:
      stain: '{staff}帮一个学生把切好的小块组织泡进重铬酸钾的罐子里，罐里的液体橙红发亮。学生说这罐要原封不动泡到下礼拜，谁要是忍不住打开看，下一百张切片就归谁切。'
      ticket: '{staff}陪学生去火车站问去柏林的车票。站里人声嘈杂，售票员报了价，学生吹了声口哨，回来的路上一直掰着指头算，这笔钱够印几期刊物。'
      rain: 十一月，巴塞罗那下起雨，雨点打在窗台上。{staff}帮学生把窗台上晾着的一叠图版收进屋，学生点了两遍数，才肯把百叶窗关上。
  marconi_bologna:
    name: 一次发报，一次静默
    place: 博洛尼亚
    figure: 古列尔莫·马可尼
    story: 马可尼在1909年的诺贝尔演讲里回忆，自己于1895年初在博洛尼亚附近开始试验无线电报。
    relic: 两张试验记事纸
    relic_desc: 同一趟试验，在两端各留一张记录。
    points:
      p1: 启程前请他给留在当地的家人一份用通俗文字写成的试验索引，再另抄一份带去给英国合作者
    points_fail:
      p1: 相关纸页跟行李一起去了英国，本地的人只能按听过的说法追记。
    shift:
      p1:
        was: 马可尼后来赴英国寻求专利和接洽。抵英后还需要调整和修理设备。
        now: 家里和旅行者各带一份能查的索引，旅途中出现损失也可用留底确认。英方的记录另外接在后面。
        who: marconi_bologna
        bio: 格里福内别墅里的试验与后来在英国取得专利是前后不同的阶段，其中涉及家人和当地支持。
    vignettes:
      blank: 罗莎等的是三声，下笔已经写了三划。下一趟你请她把纸扣在桌上。重新翻开时，她把实际听见的记下来，连静默时多听到的一声也写上。这下有理由再做一遍了。
      times: 卡洛想把两张纸一起带下坡。纸头都写着第一趟，其实有一边重新做过。你请他指出哪一段在等，哪一段重新开始。他走前给两趟各写了记号，发报和接收两边终于能对上同一趟。
      range: 你知道后世读者会在意距离。罗莎却只想知道最后一响是不是约好的记号。你把她的纸拿到发报端，把这个问题留给下一趟。此时两头的人都已经进屋。
  imhotep_saqqara:
    name: 试过的那条边
    place: 埃及萨卡拉
    figure: 伊姆霍特普
    story: 萨卡拉左塞尔建筑群出土的雕像底座刻有伊姆霍特普的姓名和头衔。博物馆将阶梯金字塔的设计归于他。
    relic: 一张接边记号拓片
    relic_desc: 工台上的接边记号拓片。
    points:
      p1: 石工试接边时扶稳练习石
      p2: 留在台边，等两面都查过再走
      p3: 搬石块前找出接缝卡在哪儿
    vignettes:
      rock: 穆特见石面平整，就要去拿下一块。你请她先在台面轻轻摇一下这块。一角敲着木面，另一角没沾上。她在高点做记号，换个人、换个光线也找得着。
      turn: 霍里可以现在搬走两块练习石，也可以留着沉的那块，等穆特来查。你扶住轻的那块，陪他等。穆特在两块石头相接的面上各做记号。石头搬走时，记号也跟着带走。
      name: 你知道后世看雕像底座时会找谁的名字。霍里只想知道哪块试石该跟手里这块配。你指给他看那个能对上的记号。造像和刻字的地方，还在你这趟能走到的工坊外。
  enheduanna_ur:
    name: 穿过荆棘的山路
    place: 美索不达米亚乌尔
    figure: 恩赫杜安娜
    story: 乌尔出土的一块圆盘刻有恩赫杜安娜的名字，也记载她是萨尔贡的女儿。《伊南娜颂》以恩赫杜安娜的口吻写到被逐出神庙，像燕子一样离开窗边，走过荆棘时力气已经耗尽。何时走的、走了哪条路，难以确定。
    story_prose:
      opening:
        - 乌尔外的路一到傍晚，脚下石头就看不清了。恩赫杜安娜停在带刺的灌木边，把空水罐提起来看了看。同行的人还记得前面有一处能坐下的屋檐。
        - 圆盘铭文留下了恩赫杜安娜的名字。后世抄存、传统上归于她的诗歌讲到被逐与异地的荆棘。这趟借诗中的情境设定离开乌尔后的行路，能做的是让她停一会儿。
        - 派有走远路经验的人带上水壶。遇到第一个有人居住的地方，先问她愿不愿意在那儿等天亮。
      points:
        p1: 同行人想把水留到下一处院子。你问恩赫杜安娜现在想往前还是停，她用空罐指了一下近处的矮墙。你把水递给她，同开门的人商量借坐到天明。走了半日，她第一次把装水的罐稳稳放到地上。
      outcomes:
        all: 她在矮墙里歇过一夜。日后传下来的诗还写着荆棘，这趟记录多了在天黑前停下的一小段。
        p1: 那户人把门边的位置让给恩赫杜安娜。出门前，她让同行人也把水罐添满。
      none: 矮墙后的人没来得及答话，天已暗下去。路上的人只有继续往前走。
      not_admitted: 同行人认得自己的队伍，没有叫你跟上。你只来得及把手里的水罐递到门边。
      excerpts:
        p1: 走了半日，她第一次把装水的罐稳稳放到地上。
    relic: 一只陶水杯
    relic_desc: 路旁那户虚构人家的小杯。
    points:
      p1: 恩赫杜安娜离开神庙后，带上水，陪她走到可以歇脚的地方
    points_fail:
      p1: 能歇脚的地方还很远。天已经暗了，你没能替她找到一个停下来的地方。
    shift:
      p1:
        was: 《伊南娜颂》中，自称恩赫杜安娜的叙述者写到被赶出神庙，走过荆棘时力气耗尽。
        now: 这条分支里，{staff}陪恩赫杜安娜走到避风的地方，天黑以前给她递上一碗水。
        who: enheduanna_ur
        bio: 这条分支里，恩赫杜安娜离开神庙后有人同行，也有一处地方歇脚。
    vignettes:
      inscription: '{staff}问添一罐水要给多少。门边的人请他们先喝，其他事等天亮再说。'
      support: '{staff}请同行人先放下水罐，再扶人到矮墙边。水罐这次稳住了。'
      edge: '{staff}问门旁能不能坐，屋里有人把长凳上的篮子拿了下去。'
  hammurabi_babylon:
    name: 刻在石头上的法律
    place: 巴比伦
    figure: 汉谟拉比
    story: 约前 1754 年，汉谟拉比在位的晚年，一块刻着近三百条法律的玄武岩石碑立了起来，此后几百年，书吏一直把这些条文抄在泥板上传习。前十二世纪，石碑被运到苏萨，碑上有几栏文字被磨去。1901 年，法国考古队在苏萨把它挖了出来，如今藏在卢浮宫，被磨掉的条文靠泥板抄本补回了一部分。
    story_prose:
      opening:
        - 约前 1754 年，巴比伦。汉谟拉比在位的晚年，一块玄武岩石碑刻上了序言、约二百八十二条讲财产、交易、家庭与劳作的法律和一段结语。结语里说，受了冤屈的人可以来到碑前，请人把碑上的话念给他听。书吏把这些条文抄在泥板上，一代一代传习。
        - 史实里，前十二世纪，埃兰王舒特鲁克-纳洪特把石碑运到苏萨，碑面下部有几栏后来被磨平；缺掉的条文靠泥板抄本补回了约三十条，其余至今不知道写的是什么。在这条分支里，书吏屋里有个和泥、晒泥板的学徒，幼发拉底河边有个不识字的船夫。
        - 这一趟用得上几种人：做惯了案头活、校得出漏行的人；手稳、会削芦管压字的匠人；一丝不苟、一栏一栏对得下去的人，或是带着能把碑面细节看清的眼镜的人。
      outcomes:
        p1: 三千多年后，那片磨平的石面旁边摆上了一块别的城里传下来的泥板。有人顺着楔形的刻痕一行一行往下念，念到了石头上已经没有的那几条。
      none: 泥板照旧在屋顶上晒着，学徒照旧挨块数。几百年后石碑被运走，碑面下部那几栏磨成了平的，什么也摸不出来。
      not_admitted: '{staff}没能进书吏的屋子，只在幼发拉底河边帮船夫卸了几袋大麦。船夫数着袋子，又说起王的石碑，碑上的字他一个也不认得。'
      points:
        p1:
          class_lettered: 屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}做惯了案头的活，抄完一块，就对着底本从头点一遍行数，漏了一行的那块，趁泥还软抹平了重写。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。
          class_craft: 屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}手稳，把几根芦管削出斜口，一根一根在废泥上试过压痕，挑出最利的递给书吏，自己也照着底本压满了一整块。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。
          else: 屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}一栏一栏对着底本数下去，把每块泥板从哪一条抄到哪一条刻在一片陶片上，几份抄本拼起来，一条也不缺。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。
      excerpts:
        p1: 书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。
    relic: 一枚泥印滚筒
    relic_desc: 一个小石柱，在泥上一滚就留下签名。
    points:
      p1: 帮书吏把石碑全文多抄几块泥板，送到别的城里存放，后世石上被磨掉的那几栏也能读全
    points_fail:
      p1: 全文照旧只有原来那些抄本，这条分支里石碑被搬到苏萨、磨去几栏以后，还是有几条法律再也读不到。
    shift:
      p1:
        was: 公元前十二世纪，石碑被埃兰人搬到苏萨，碑文被磨去几栏；靠泥板抄本补回了约三十条，其余至今不知道写的是什么。
        now: '{staff}帮书吏多抄了几份全文，送到别的城里存放，这条时间线里石碑上的每一条法律都还读得到。'
        who: hammurabi_babylon
        bio: IF 线里，汉谟拉比的法律一条不缺地传了下来，石上磨掉的部分也没有失去。
    vignettes:
      clay: '{staff}帮书吏学徒和泥。学徒两只手插在泥里，说沙得淘干净，不然写到一半，芦管一按就裂，师傅又要他从第一行重抄。'
      river: '{staff}在幼发拉底河边帮船夫卸大麦，袋子压得肩膀发红。船夫一边数袋子一边说，过秤的要是敢少算一袋，他就站到王的石碑跟前把那一条念给他听，虽然碑上的字他一个也不认得。'
      roof: 日头最毒的时候，{staff}和学徒把新抄的泥板摆到屋顶上晒，泥板的边先干成了浅色。学徒挨块数，数到一半乱了，又从头数，生怕有一块被鸟踩过。
  lalibela_rock:
    name: 沟壁上的两层土
    place: 埃塞俄比亚拉利贝拉
    figure: 拉利贝拉的清沟工人
    story: 1966 年 12 月 19 日，拉利贝拉第一期修缮开工。工人掘走淤积的土，重新露出一段段凿进岩石的深槽。现代考古队指出，那次清理的出土物只留下少量照片，缺少可逐件核对的记录。
    relic: 一张沟壁剖面图
    relic_desc: 线图记下土层厚度和碎片还在土里的位置。
    points:
      p1: 趁着下一筐土还没动，和工人量下土层厚度，把露出的陶片位置连同沟壁剖面抄一份留在当地
    points_fail:
      p1: 清理继续进行。泥从沟里运出，后来再也无法量出这些碎片原来的位置。
    shift:
      p1:
        was: 清理时留下的少量照片不足以还原出土物原来的土层与位置。
        now: 当地留有一份沟壁剖面，后来的测绘人员还能查到这一段的土层厚度和陶片的位置。
    vignettes:
      work: '{staff}看着工人用一把窄铲刮出一小片平面，泥里的浅线这才变得清楚。'
    story_prose:
      opening:
        - 1966 年冬，拉利贝拉。岩沟里一筐筐往上提带泥的碎石。沟壁转弯处，湿泥下方露着一条颜色浅些的土。泥里还有几片陶。
        - 这次工程重新露出了被埋的深槽。史实里，清理中发现的东西只留下少量照片。要把某块陶片放回原处，单凭照片已经办不到了。
        - 工人下一趟就会挖过这个弯。派个会看土层又能当场把位置画下来的人去，还来得及。
      points:
        p1: '{staff}请提筐的人稍等，把尺贴到两层土的交界，再从岩壁边量到刚露出的陶片。工人照着报出的数，把同一个位置点在第二张图上。第二张图留在镇上。'
      outcomes:
        all: 多年后，有人展开留在镇上的图，把尺比在那段岩壁上。旧图上的浅色土层就在尺的这一头。
        p1: 多年后，有人展开留在镇上的图，把尺比在那段岩壁上。旧图上的浅色土层就在尺的这一头。
      none: 空筐从坡顶滑回沟里。原先露出陶片的一边已经削平，剩下的土与上一筐混在了一起。
      not_admitted: '{staff}没能跟清沟工人下去。有人从沟沿收起一段绷着的细线，绕回木板上。'
      excerpts:
        p1: '{staff}请提筐的人稍等，把尺贴到两层土的交界，再从岩壁边量到刚露出的陶片。工人照着报出的数，把同一个位置点在第二张图上。'
  ife_bronzes:
    name: 回填前的探沟图
    place: 尼日利亚伊莱伊费
    figure: 伊塔耶穆发掘队
    story: 1957 年 12 月，发掘人员在伊莱伊费的伊塔耶穆开始抢救性发掘。他们清出古代陶片铺地。最早清出的大片铺地后来盖了棚，多数探沟则被回填。后来的考古队得从零散的草图、笔记和照片中重建探沟的分布。
    relic: 一张带基准线的探沟图
    relic_desc: 纸上把几条探沟的位置连到公路边的同一条基准线。
    points:
      p1: 在开挖的边界被填平前，把探沟量到同一条基准线上，在伊费留下可以复测的图
    points_fail:
      p1: 沟口照常回填。随着地表变化，后来的人只能用零散记录重找各条沟的位置。
    shift:
      p1:
        was: 多数探沟回填后，后来的考古队手头没有一张完整的早期现场图，需要重新拼出探沟分布。
        now: 伊费留有一份按固定参照点测出的探沟图。后来的人能按图重找到这些探沟。
    vignettes:
      work: '{staff}看着尺带绕回盘里，泥土在数字二和三之间留了个印。'
    story_prose:
      opening:
        - 1957 年 12 月，伊莱伊费。公路边，几个人蹲在土里，把陶片铺地的边缘一点点刷出来。他们在沟沿下钉桩，免得人一脚踏进去。
        - 最早清出的大片铺地后来有了棚子，多数探沟却要回填。史实里，重来这里的人花了不少时间，把笔记、草图和照片里的位置重新拼到一块。
        - 开口还在地上。趁今天走得通，找个会测量并肯和发掘队一道复核的人，把每条沟接到同一处地标上。
      points:
        p1: '{staff}和队员把长尺拉到公路边的固定标记，逐个报出沟角的距离。一个人先在现场图上点清，一转手又在留给伊费的那张纸上点了一遍。'
      outcomes:
        all: 回填很久以后，拿图的人在路边找回标记，沿着纸上的距离走到旧沟拐角。地上已经看不到沟了。
        p1: 回填很久以后，拿图的人在路边找回标记，沿着纸上的距离走到旧沟拐角。地上已经看不到沟了。
      none: 松土把最后一个沟角填平。两张没标相对位置的草图叠在一起，纸上的线还是对不上。
      not_admitted: '{staff}没能跟发掘队进场。围栏内有人收走了垂在地上的长尺。'
      excerpts:
        p1: '{staff}和队员把长尺拉到公路边的固定标记，逐个报出沟角的距离。一个人先在现场图上点清，一转手又在留给伊费的那张纸上点了一遍。'
  great_zimbabwe:
    name: 墙脚留下的泥台
    place: 津巴布韦马斯温戈
    figure: 大津巴布韦西围区的工人
    story: 1915 年，大津巴布韦山上西围区的塑土台、长凳和墙体大多被拆除。施工时，人们以为附着的泥土会危及干砌石墙。清理后留下的坑口又经年侵蚀。
    story_prose:
      opening:
        - 1915 年，大津巴布韦。西围区的干砌石墙脚下，还有用泥土塑成的台和长凳。清理的人把它们也划进了要搬走的范围。
        - 史实里，工人把这些土构大多拆去，露出的坑口后来继续受侵蚀。在这条分支里，有人能在轮到墙脚那一段之前，和工人一道把相接的地方看清楚。
        - 这一趟用得上读得懂一堵墙、能跟在地做工的人说清楚的人。要留住的那一段，要在动工以前摸得准。
      points:
        p1: '{staff}沿着墙脚和工人核过泥台与石墙相接的地方，指清能让开的一段，等他们把清理界线往外挪。工人把木桩钉在泥台外头。那截台面上，一道旧指痕还贴着石缝。'
      outcomes:
        all: 后来测绘的人蹲到墙脚，把尺横在还留着的泥台上。尺的一边搁在土面，一边轻轻碰到了石头。
        p1: 后来测绘的人蹲到墙脚，把尺横在还留着的泥台上。尺的一边搁在土面，一边轻轻碰到了石头。
      none: 工人从墙脚把空筐带走。坑边土色新鲜，原来接着石墙的地方只剩一道浅线。
      not_admitted: '{staff}没能加入西围区的工人。草图从里头递出来，墙脚处只看得见一截纸角。'
      excerpts:
        p1: 工人把木桩钉在泥台外头。那截台面上，一道旧指痕还贴着石缝。
    relic: 一张墙脚剖面草图
    relic_desc: 纸上画着干砌石墙和紧贴墙脚的塑土台。
    points:
      p1: 与西围区的工人核对墙脚，在清理前争取把一段塑土台留在原处
    points_fail:
      p1: 照史实，塑土构件大多被清掉。这条分支里，原处没有留下这一段。
    shift:
      p1:
        was: 1915 年，西围区的多处塑土台、长凳和墙体在清理中被拆除。
        now: 这条分支里，西围区有一段塑土台留在原处。后来测绘的人还能看出它怎样贴着石墙。
    vignettes:
      lines: '{staff}沿着墙脚看过去，泥台的边到了石缝才低下去。'
      width: '{staff}替工人拿着草图，图上石墙和泥台各有一条线。'
      pace: '{staff}坐到石阶边，把鞋上的干泥碰掉，泥屑落在脚下的砂土上。'
  timbuktu_sankore:
    name: 还赶得上一队人
    place: 马里廷巴克图
    figure: 廷巴克图的学者们
    story: 1468 年前后，廷巴克图易手后，一些学者离开当地，有人去了瓦拉塔。在这条分支里，其中一户人家想找一队能同行的人。
    story_prose:
      opening:
        - 约 1468 年，廷巴克图易手。后来写下这段历史的人，记得有读书人离开了城，有些人去了瓦拉塔。
        - 史实里，编年史写到离城的队伍。在这条分支里，有一户人家已经收行李，几个水袋却还没有系上记号。他们不知道哪队肯等。
        - 这趟需要认得同行规矩的人，能问清队伍在等谁，还能陪走第一程。
      points:
        p1: '{staff}在几队人里问到一位愿意等这户人家的领路人，回来请他们点清水和要带的东西。到第一处落脚点，另一家摊开了一张席。那户人家的孩子把家里最小的水袋提过去，放在两张席之间。他松开手以后，小袋子还站得住。'
      outcomes:
        all: 第二天，队伍收起两张挨在一起的席。那只小水袋先被递上去，然后才有人把孩子抱上来。
        p1: 第二天，队伍收起两张挨在一起的席。那只小水袋先被递上去，然后才有人把孩子抱上来。
      none: 再有人回头问时，最后一队已经走了。一家人把打了结的行李搬回门内。
      not_admitted: '{staff}没有问到那户人家。有人在门边把两只水袋往一起拢。'
      excerpts:
        p1: 那户人家的孩子把家里最小的水袋提过去，放在两张席之间。他松开手以后，小袋子还站得住。
    relic: 水袋上的计数签
    relic_desc: 分支里的计数签，用来核对那户人家带走的水袋。
    points:
      p1: 替一户离城的人家找到能同行的商队，陪他们到第一处安全的落脚点
    points_fail:
      p1: 商队出发前，员工没能替那户人家留到位置。
    shift:
      p1:
        was: 1468 年前后，廷巴克图易手后有学者离开，一些人去了瓦拉塔。
        now: '{staff}让那户人家跟上去瓦拉塔方向的一队人，陪他们走到第一处安全的落脚点。'
        who: timbuktu_sankore
        bio: 离开廷巴克图的一户人家找到了同行者，平安到达第一处落脚点。
  al_haytham_cairo:
    name: 借来的那叠光学笔记
    place: 福斯塔特
    figure: 伊本·海赛姆
    story: 1020 年，福斯塔特在动乱中失火。伊本·海赛姆曾在埃及研究光学。在这条分支里，他约了一位读者讨论光学，借出的手稿正在受灾的街上。
    story_prose:
      opening:
        - 1020 年的福斯塔特。编年史说城中几处失火，许多住处和物件没能保住。伊本·海赛姆在埃及这些年研究光怎样进入眼睛。
        - 史实里，火烧到了住人的街区，史料并未记伊本·海赛姆当天在哪里。在这条分支里，一位约好同他读稿的人住在受灾的街上。
        - 这趟需要临急还能说得清路的人。手稿可以稍后翻看，先得知道读稿的人能不能走到街口。
      points:
        p1: '{staff}找到读者时，门里的光已经暗下来。那人想再进去找一页稿，{staff}请他先把手上的一叠带出来，顺着街坊空出的路离开。等到了能暂住的人家，他坐下，把那叠没有齐边的纸放到膝上。一张纸滑下来。对面的主人弯腰拾起，放回那人指着的地方。'
      outcomes:
        all: 稍后伊本·海赛姆来看他。家里只有一张凳子，两个人便在矮桌旁坐下，把那一页重新找出来。
        p1: 稍后伊本·海赛姆来看他。家里只有一张凳子，两个人便在矮桌旁坐下，把那一页重新找出来。
      none: 街口后来堵住了。伊本·海赛姆来问时，只能把借稿的纸签折进自己手里。
      not_admitted: '{staff}在街外等不到领路的人。门洞里有人喊关门，声音很快就听不清了。'
      excerpts:
        p1: 一张纸滑下来。对面的主人弯腰拾起，放回那人指着的地方。
    relic: 另托的一叠稿纸
    relic_desc: 分支里的光学笔记，临时托给另一户人家保管。
    points:
      p1: 赶在火势蔓延之前带读者离开，并给借出的手稿找到一处能存放的地方
    points_fail:
      p1: 员工没能及时赶到，帮读者带着那叠稿纸离开。
    shift:
      p1:
        was: 1020 年，福斯塔特一些街区在动乱中失火。史料没记伊本·海赛姆及其手稿当日所在。
        now: '{staff}把读者带到远离受灾街区的人家。伊本·海赛姆后来仍能和那位读者一起读这份手稿。'
        who: al_haytham_cairo
        bio: 福斯塔特失火时，一位读者和寄在他手里的光学稿纸一同到了安全的地方。
  house_of_wisdom:
    name: 巴格达抄本上的缺行
    place: 巴格达
    figure: 花拉子米与智慧宫
    story: 侯奈因·伊本·伊斯哈格在约855至856年写成的书信里，谈到搜寻、比对盖伦手稿以供叙利亚语和阿拉伯语翻译。晚出的书信用来说明译者怎样工作，不能给这张桌子定址。
    relic: 一页标出缺行的练习抄本
    relic_desc: 来自巴格达抄写桌的一份练习抄页。
    points:
      p1: 找出两份抄本从哪儿开始不同
      p2: 交接文稿时保住缺行的位置和出处
      p3: 商定怎样标出暂时无法定下的译文
    vignettes:
      line: 萨尔玛顺着整齐的抄本读，滑过了原本两行挤成一行的位置。你照字迹较乱的纸朗读，她用整齐那份对着听。她听到自己这份少掉的内容，在脱漏处做了记号。
      versions: 门要关了，伊利亚斯得先送一份给译者。他可以只送整齐那份，也可以把难读的那份带上。你捆好两份，让人一翻就能看到分歧。译者拿到纸页，可以同时拿两份来判断。
      gloss: 你认得后世书里常用的术语。萨尔玛指给你看原文缺在哪儿，可手头没有字可补。你只给她一条页边备选说法。信包送走时，正文一字没补。
  ibn_sina_hamadan:
    name: 最后一次腹痛
    place: 波斯哈马丹
    figure: 伊本·西那
    story: 伊本·西那早年在哈马丹写完了五卷《医典》。随行的朱兹贾尼在续传中记下他的腹痛反复发作。1037 年，他随效力的君主前往哈马丹，在那里去世。
    story_prose:
      opening:
        - 去哈马丹的一行人正在收起铺地的毯。伊本·西那放下手里的纸，问他们能不能再等一会儿。随行人见他把手按在腹部，却一时找不到能躺下的地方。
        - 续传记伊本·西那晚年腹痛反复，于 1037 年在哈马丹去世。这一趟可以询问他自己的意愿，让同行的人在路上陪他歇息。
        - 让有照护经验的人去问他什么时候想停，再找他熟悉的同行人陪他。能等多久由他和同行的人商量。
      points:
        p1: 有人来问是不是该扶他起来。你蹲在毯边问他想在哪里停，他指了指里侧的暗处，说那里不用一直撑着身子。你请同行的人把手里的东西交给别人拿，坐到他能看见的地方。再次有人来敲门时，屋里答了一声还请再等。
      outcomes:
        all: 这一程里有人等伊本·西那自己说可以起身。后来到了哈马丹，他仍在那里去世。
        p1: 有人留下来陪他，没有催他赶上已经收好的行李。
      none: 同行人等得差不多了，仍没能找到方便他躺下的地方。路还要接着走。
      not_admitted: 随行人替伊本·西那谢过来客，请没约好的人在外头等。你没能问到他的意思。
      excerpts:
        p1: 再次有人来敲门时，屋里答了一声还请再等。
    relic: 一张折起的路记
    relic_desc: 虚构的随行纸条，写着一行人在哪儿停过。
    points:
      p1: 腹痛再犯时，问伊本·西那想在哪里停下，找个人陪他歇一歇
    points_fail:
      p1: 一行人又在等着出发，还没腾出能让他躺下的地方。
    shift:
      p1:
        was: 朱兹贾尼的续传记载伊本·西那的腹痛反复发作，1037 年在哈马丹去世。
        now: 这条分支里，腹痛再犯时，{staff}给伊本·西那找到了歇脚处。有同伴陪他停下，也替他把回话带给等出发的人。
    vignettes:
      section: '{staff}问上一次歇脚之后又走了多远，把回答写在一张便于翻查的纸上。'
      sleeve: 有人开始收铺盖。{staff}请他们暂留一张毯，等伊本·西那自己决定何时走。
      afterlife: '{staff}问大家准备出发时谁留在屋里等。有一位同行人把行李提回里间。'
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯伊斯法罕
    figure: 欧玛尔·海亚姆
    story: 1070 年代，马立克沙召集天文学家开展观测。欧玛尔·海亚姆在伊斯法罕的宫廷随学者共事。1079 年 3 月 15 日，贾拉利历启用，以春分定太阳年的开端。
    story_prose:
      opening:
        - 1079 年春，伊斯法罕。马立克沙召集的学者们在修订历法。海亚姆参与观测，新历把一年开头定在春分。
        - 史实里，新历在三月启用，这些观测后来随马立克沙去世而停下。海亚姆提过自己有一部讲开方的书，那部书没有传下来。在这条分支里，抄历书的人手边还留着一张能再写几行的纸。
        - 这一趟用得上认得清日影读数、能够核对新旧两栏的人，也用得上懂得校书、能把副本送到另一座城的人。
      points:
        p1: 春分前，{staff}按前几天的记录核对影端，从纸上把抄混的一列挑出来，请海亚姆对着原来的读数再看一遍。表边有两道旧折痕。太阳落低时，桌上的纸还打开着，那一列墨重新写到了线内。
        p2: '{staff}替抄书的人核过开方书的副本，把易抄错的几个数逐一对回原本，再交给往别城去的送书人。送书人把抄本包在布里，系完又松开一边。题名朝着外头，隔着第一层布还摸得出纸角。'
      outcomes:
        all: 那年开春的日期写进新历。许多年后，另一座城的书架上有人取下开方书，纸角还照旧卷着。
        p2: 后来有人在另一座城又抄了一遍全书。他从第一行开始，手边放着那一卷边角已有磨损的旧稿。
        p1: 新历照原定的日子启用。对照表还有一份，页上两种题头挨在一起。
      none: 旧历表收回匣里。一张没写完的纸留在外面，风来时贴着匣口响。
      not_admitted: '{staff}没能跟着抄历的人留下。门里一张纸翻了过去，门外已经看不见题头。'
      desync: 两栏数直到收表也没对齐。{staff}被召回时，最后一次读数仍留在纸边。
      excerpts:
        p2: 送书人把抄本包在布里，系完又松开一边。题名朝着外头，隔着第一层布还摸得出纸角。
        p1: 表边有两道旧折痕。太阳落低时，桌上的纸还打开着，那一列墨重新写到了线内。
    relic: 一张有两种题头的历表
    relic_desc: 一张对照表，新旧两种新年并排写着。
    points:
      p1: 春分前那几天，护住观测台上定春分的日影读数，让新历照定的日子启用
      p2: 帮他把那部讲开方的书多抄一份，送到别的城里收好，让它在这条分支里留下来
    points_fail:
      p1: 春分的读数没能对齐，新历没能在 3 月 15 日启用。
      p2: 这部书照旧失传，这条分支与历史一样。
    shift:
      p1:
        was: 1079 年 3 月 15 日，苏丹马立克沙的新历照定的日子启用，一年从春分开始。
      p2:
        was: 海亚姆那部论开方的书没有传下来，只在他的《代数》里留下一句提及。
        now: 有一份抄本被送到别的城里收进了书库，几百年后还有人读得到。
        who: omar_khayyam_nishapur
        bio: 这条时间线里，他那部讲开方的书没有随着岁月散失。存在别城的那份抄本，在他身后仍有人读、有人转抄。
    vignettes:
      spring: '{staff}把新旧历表并排，在日期旁各补一个题头。两张纸的边碰在一起，数字才有了分界。'
      carry: 一张折纸把两栏分开。{staff}把题头抄到纸外，递过去时，有一笔从折痕上跨了过去。
      future: '{staff}用抄历书的人熟悉的纪法落下日期。纸往前挪时，空出来的地方仍留着给下一行。'
  al_jazari_diyarbakir:
    name: 一本奇巧机械之书
    place: 迪亚巴克尔
    figure: 加扎里
    story: 加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。
    story_prose:
      opening:
        - 阿米德的交稿桌上，书吏摊开写有页数的目录。另一个人抱着图册走来，说有张图的题名能归到两章。桌上快没光了，贾扎里请他们趁有光再核一遍。
        - 贾扎里的机械著作在 1206 年完成，存世抄本留下说明和图页。这次可以守住书稿的交接，再请作者为后来传抄挑一份有据可依的底本。
        - 会把图题与段落对齐的人先去核交付册。懂抄写的人可以问作者，旁注和空处哪一些要原样留下。
      points:
        p1: 书吏指着第二个同名题头，说是目录多写了一遍。贾扎里请他往后翻，你在第二张图边看见指向另一页的记号。你把卷和图对应的页写进交付清单，请接册的人自己照目录试一次。他合上书，说两张都找到了。
        p2: 抄写人想趁重新抄一遍，把旁注放进正文省地方。贾扎里让他把已有的正文读到停顿处，你把旁注的另一个来处写在边上。读者翻过这一张时还能看见作者留的空栏。抄写人提起笔，改在底下另添一张标明出处的纸签。
      outcomes:
        all: 书稿如期交付。另外留着一份可参照的底本，后来抄写人可以顺着签条辨认原来的图注。
        p1: 交付册成套收下，目录能领人找到图。还没留出一份能分辨新旧旁注的底本。
        p2: 旁注的来源已经分开写下。交稿的另一册还是缺了对应图，无法保留整次交接。
      none: 两张相似题头的位置没核定。下一位抄手先来问究竟该找哪一本。
      not_admitted: 书吏报出接册人的名字。没被叫到的人留在桌外，目录仍合着。
      desync: 几幅图脱开目录，书稿没能成套交付。事务所因同步失败召回员工。
      excerpts:
        p1: 他合上书，说两张都找到了。
        p2: 抄写人提起笔，改在底下另添一张标明出处的纸签。
    relic: 一个黄铜凸轮
    relic_desc: 一个有形状的轮子，把转动变成往复。
    points:
      p1: 在阿米德交稿时，按目录把装置说明和对应图页逐册核齐，护住书稿完成
      p2: 和作者一起选一册留作传抄底本，列出旁注、图题与后来抄写人不得合并的空白栏
    points_fail:
      p1: 几幅图无从对回章节，书稿无法成套交付，事务所因同步失败召回员工。
      p2: 下一位抄手只能从已混入不同注记的工作本起抄，读者分不开作者所见与后来补记。
    shift:
      p1:
        was: 托普卡帕所藏早期抄本的题记给出 1206 年 1 月 16 日的完成日期。贾扎里的书与阿米德的阿尔图格宫廷相连。
      p2:
        was: 研究所见的后代抄本并非全从同一传抄支系而来，有的图与文本都出现差异。
        now: 库房留下一册有作者核验记号的样本。后来抄写人能在抄本前另记自己的修订，也能拿图题对照底本。
        who: al_jazari_diyarbakir
        bio: 贾扎里在阿米德写下对机械装置的说明，图与文字在后来多次传抄和跨地流通中一同变化。
    vignettes:
      sequence: 学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。
      viewer: 来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。
      paper: 学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。
  ibn_battuta_tangier:
    name: 长途还只有第一站
    place: 摩洛哥丹吉尔
    figure: 伊本·白图泰
    story: 1325 年六月，伊本·白图泰离开故乡丹吉尔。他在《游记》里回忆，父母都还在家，而他出门时没有旅伴，也没有商队可以跟随。他回到摩洛哥后，把前后近三十年的行旅见闻口述给伊本·朱扎伊。
    story_prose:
      opening:
        - 1325 年六月，摩洛哥丹吉尔。二十出头的伊本·白图泰要出一趟远门，父母都还在家。近三十年后他才回到家乡，把一路见闻口述给伊本·朱扎伊，编成了《游记》。
        - 史实里，他是一个人出的城门，没有旅伴，也没有商队可以跟。到了米利亚纳，他追上的突尼斯苏丹的两位使节都在暑热里病倒，其中一位在城外溪边停了三夜后去世；过了贝贾亚，他又发起高烧，拿缠头布把自己绑在鞍上；进突尼斯那天，迎出城来的人里没有一个认得他，他忍不住哭了。在这条分支里，泉边有个替人灌满水囊的邻家妇人，城边有个只认得头一段路的挑夫。
        - 这一趟用得上几种人：懂医护、带够了补液和水的人；身子骨极结实，或带着止痛药、咬得住牙的人，熬得过一路暑热和颠簸；心肠热、肯在陌生城门口走上前去的人。
      outcomes:
        all: 那年秋天，突尼斯苏丹的两位使节都回到了城里。伊本·白图泰在突尼斯住了两个月，进城那天陪着他的人，那些日子常来他住的地方坐一坐。后来他跟着一支更大的商队，又往东去了。
        p2: 那年秋天，两位使节一前一后回到了突尼斯。病过一场的那位走在后面，鞍边挂着那只在溪边用过的水碗。
        p3: 他在突尼斯住了两个月。进城那天陪着他的人，那些日子常来他住的地方坐一坐，两人说的多半是路上的事。
        p1: 他一路没有下鞍，撑到了突尼斯。那条缠头布后来又缠回了他的头上，跟着他往东走了很远。
      none: 七月，米利亚纳城外的溪边停了三夜，一位使节没有再起来。九月，突尼斯城门口，迎出来的人叫着别人的名字，他攥着缰绳站在人群边上，哭出了声。
      desync: 八月，过了君士坦丁，那个结松开了。{staff}被召回时，商队停在路当中，那条缠头布一头还系在空鞍上，垂到了地上。
      not_admitted: '{staff}没能在丹吉尔落下脚，只在泉边帮那位邻家妇人提了几趟水。六月十四日一早，一个年轻人牵着牲口出了城门，身边没有旅伴，后面也没有商队。'
      points:
        p2:
          class_medical: 七月，米利亚纳城外，离城四英里的一条溪边。两位使节都在暑热里病倒了，队伍已经在溪边停了三夜，病得重的那位躺着，叫他也只睁一睁眼。{staff}照医护的法子，把两包补液盐兑进保温壶里的凉开水，扶起他的头一口一口喂，又把浸湿的布搭在他的额头和颈后，隔一阵换一回。第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。
          else: 七月，米利亚纳城外，离城四英里的一条溪边。两位使节都在暑热里病倒了，队伍已经在溪边停了三夜，病得重的那位躺着，叫他也只睁一睁眼。{staff}打开随身带的药箱，给他退了烧，守在他身边，等他一口一口把水咽下去，一夜没有合眼。第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。
        p1:
          class_medical: 八月，过了君士坦丁，伊本·白图泰又发起烧来。在贝贾亚时就有朋友劝他留下养病，他没有留。这回他拿缠头布把自己绑在鞍上，怕烧得没了力气栽下去。{staff}照医护的规矩，每到歇脚就摸他的额头和手腕，把湿布换了又换，看着他把水咽下去，又替他把布结重新勒紧。夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。
          else: 八月，过了君士坦丁，伊本·白图泰又发起烧来。在贝贾亚时就有朋友劝他留下养病，他没有留。这回他拿缠头布把自己绑在鞍上，怕烧得没了力气栽下去。{staff}一路走在他的牲口旁边，一手牵着缰绳，他身子一歪，就伸手把他托回鞍上，晒了一整天也没换过手。夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。
        p3: 九月，商队到了突尼斯。城里的人迎出来，叫着同行商人的名字，一个个拉住手问候。没有人认得伊本·白图泰，他站在人群边上，手里还攥着缰绳。{staff}一路上和他说过不少话，这时走到他身边，喊了他的名字，问他今晚住在哪里。他用袖口抹了一把脸，把攥了一路的缰绳换到另一只手上。两个人一前一后，从迎人的人群旁边走进了城门。
      excerpts:
        p2: 第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。
        p3: 他用袖口抹了一把脸，把攥了一路的缰绳换到另一只手上。两个人一前一后，从迎人的人群旁边走进了城门。
        p1: 夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。
    relic: 一只走旧的凉鞋
    relic_desc: 一只补过很多次底的皮凉鞋。
    points:
      p1: 从贝贾亚往突尼斯那一路，护住他带着高烧撑在鞍上，走到突尼斯
      p2: 在米利亚纳救下那位病倒在暑热里的突尼斯使节
      p3: 进突尼斯那天，让他知道他在异乡不是一个人
    points_fail:
      p1: 烧到一半他从鞍上栽了下来，这条分支里他没有走到突尼斯。
      p2: 那位使节照史实死在米利亚纳外的溪边，这条分支里往突尼斯去的只剩一位使节。
      p3: 他照史实在城门口哭出声来，这条分支里那天陪他进城的只有那位同行的旅伴。
    shift:
      p1:
        was: 1325 年夏天，伊本·白图泰发着高烧从贝贾亚上路，一路撑到了突尼斯。
      p2:
        was: 1325 年夏天，突尼斯苏丹的两位使节在米利亚纳都因暑热病倒，其中一位在城外的溪边停了三夜后去世。
        now: '{staff}在溪边守着他降了温、喝下了水，离开米利亚纳时两位使节都在队伍里。他后来回到了突尼斯，此后的事没有记载。'
      p3:
        was: 1325 年，进突尼斯那天没有人上前问候他，他忍不住哭了出来。
        now: 进城那天他身边多了一个一路认识的人，在突尼斯住下的两个月里他不再是一个人。
    vignettes:
      distance: '{staff}把最远的目的地写在一张纸条上，今晚落脚的地方另写一张，挑夫今天用得上第二张。挑夫把它折了两折，塞进腰带里。'
      departure: '{staff}留着行李单上的题头，底下空出一行，给旅人真正落脚的地方，墨还没干，就拿在风里晃了晃。'
      roll: '{staff}把目的和第一程各写一条，卷在一起，到了城边，路上已经起了尘土，把挑夫当天用得上的那张递过去，自己留下另一张。'
  ulugh_beg_samarkand:
    name: 出撒马尔罕的那条路
    place: 撒马尔罕
    figure: 兀鲁伯
    story: 兀鲁伯在撒马尔罕修建天文台，主持编成收有 1018 颗星的星表。1449 年秋他失去权位，获准前往麦加。十月下旬，他在撒马尔罕附近遇害。墓碑所载的卒日是 10 月 27 日，另有文献记早两天。
    story_prose:
      opening:
        - 撒马尔罕，刚收好的星表旁压着要带出城的东西。兀鲁伯已经交出权位，外面等着上路的人。有人问，出了城今晚准备在哪里停。
        - 兀鲁伯曾在撒马尔罕主持天文观测。他在 1449 年离城后遇害。这条分支可以替他问清第一处落脚地方，让他自己决定是否有人陪着。
        - 找会与同行人商量、能照顾旅途的人。先问兀鲁伯愿在哪里停，再和能接待他们的人核实。
      points:
        p1: 兀鲁伯说有人已经去催行李，不知今晚能否有地方坐下。你向出来送他的同行人说了前头愿留门的一家，再请兀鲁伯自己答应是否同去。他把没带走的星表交给在场的人，拣了只轻包跟上。到留门那处，他先请替他带路的人也坐一坐。
      outcomes:
        all: 兀鲁伯到得了出城后的第一处住处。这条分支留有他那晚平安的消息。
