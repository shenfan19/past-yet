    points:
      p1: 高迪住院期间，把进行中的工程清单和工房钥匙交给多梅内克·苏格拉涅斯，让施工在六月接着往下走
      p2: 请苏格拉涅斯把关键石膏模型的照片、标尺和图纸另存一处，在工房留一份签收的清单
      p3: 6 月 7 日傍晚，大道上的电车撞倒一个没人认得的老人时，立刻把高迪送进医院，救下他
    points_fail:
      p1: 工房等着高迪回来核准，接手的同事拿不到进行中的工程清单。施工交接中断，事务所因同步失败召回员工。
      p2: 照片和图纸仍收在工房同一排柜里。后来工房毁损时，对照材料随石膏模型一起散失。
      p3: 他被当成乞丐躺在街上，几辆出租车都不停，先到一处诊所才转进医院，6 月 10 日在那里去世。
    shift:
      p1:
        was: 高迪 1926 年 6 月遭遇电车事故，在医院去世。他的合作者苏格拉涅斯接掌了他没建完的那座建筑。
      p2:
        was: 1936 年工房毁损，原图和石膏模型多有损失。工程团队后来从残件和已刊照片等材料重建。
        now: 十年后工房里的柜子烧毁，团队从另一处取回照相册和有签收的图纸。以前只能靠残件拼的两个模型面，现在有当年的尺寸可作对照。
      p3:
        was: 1926 年 6 月 7 日，高迪在大道上被电车撞倒，没带证件，衣着破旧，被当成乞丐；6 月 10 日他在医院去世，年七十三岁。
        now: '{staff}一分钟内跪到他身边，说出他是谁，直接把他送到外科医生手里。高迪活了下来，又回工地上的工房干了几年。'
        who: gaudi_barcelona
        bio: 高迪挺过了 1926 年 6 月的电车事故。他回到工地上的工房，和苏格拉涅斯一起又主持了几年工程。
    vignettes:
      tram: 5 月 29 日，{staff}站在电车后平台上，从大道这头坐到那头，车厢里一股晒热的铁味。售票员说这份差事最难的不是收钱，是那些边看报边过马路的人。他每到一个路口就拉一下铃，像在数落整条街。
      stone: 6 月 1 日，{staff}帮工地上两个石匠把一块雕好的石头放到灰浆上，三个人身上都落满了石粉。起风时，风从头顶塔身的孔洞里穿过去，吹出哨音。年轻的那个石匠发誓每天下午都是同一个音，他已经开始跟着哼了。
      water: 7 月 10 日，入夏最热的一天，{staff}替中午来工地的卖水女人提水罐，堆在地上的石料晒得烫手。她说石匠们不到收工铃响就喝掉一整桶，喝完还嫌水里有灰味。她说那是当然，灰就是从他们身上掉进去的。
  kafka_kierling:
    name: 疗养院里的校样
    place: 基尔灵
    figure: 弗朗茨·卡夫卡
    story: 1924 年 3 月，结核侵入弗朗茨·卡夫卡的喉头，他咽东西越来越难。4 月 19 日，他和朵拉·迪亚曼特来到克洛斯特新堡附近基尔灵的霍夫曼疗养院；医生让他少说话，他多半靠纸条交谈。5 月 6 日前后，医学生罗伯特·克洛普施托克赶来帮着照料。6 月 2 日，他还在校故事集《饥饿艺术家》的校样。6 月 3 日中午前后，他去世，四十岁，11 日葬于布拉格。这本收了四篇小说的书，8 月底在柏林出版。
    story_prose:
      opening:
        - 1924 年 5 月，维也纳北边克洛斯特新堡附近的基尔灵，霍夫曼疗养院。四十岁的弗朗茨·卡夫卡患结核，三月起病到了喉头，咽东西越来越难。他住在一间带阳台、望得见花园的屋子里，医生让他禁声，他多半在小纸条上写字说话。朵拉·迪亚曼特住在客房，给他做饭；5 月 6 日前后，医学生罗伯特·克洛普施托克也赶来帮着照料。他手头还在校自己编定的最后一本书，故事集《饥饿艺术家》的校样。
        - 史实里，吞咽痛得他几乎吃不下东西，医生每隔八到十天给他的喉上神经打一针止痛；6 月 2 日他还在改校样，给父母的最后一封信写到一半没了力气，由朵拉替他写完；6 月 3 日中午前后他去世，书到 8 月底才在柏林出版。在这条分支里，疗养院有个修丁香的园丁，有个跑腿送信的男孩，村里面包铺有个面包师的妻子。
        - 这一趟用得上几种人：懂医护、带着止痛药的人，或者当医生、脑子快的人，替他把喉头的痛减下来；管过档案、做过校对、脑子快的人，或者有条理、守得住、意志硬的人，在病一次次打断校稿时，替他记住改到了哪里；懂护理的人，或者心善、耐心、有条理的人，把跑腿和通信排开，让守着的人歇一口气；管过档案、做过校对、脑子快又沉得住气的人，或者有条理、意志更硬的人，说得动柏林的出版人先装订一本寄来。
      outcomes:
        all: 6 月 3 日中午前后，卡夫卡在基尔灵去世。阳台的小桌上放着那本先装订的书，书页里夹着一张窄纸条，旁边一只碗是空的。
        p3: 6 月 3 日中午前后，卡夫卡在基尔灵去世。最后那几个星期，朵拉端进屋的碗，多半是空着端出来的。
        p4: 6 月 3 日中午前后，卡夫卡在基尔灵去世。那本先装订的书留在阳台的小桌上，书页里夹着一张窄纸条。
        p2: 6 月 3 日中午前后，卡夫卡在基尔灵去世。走廊门后那张排班表一直钉到他们离开的那天，最后几格还空着。
        p1: 6 月 3 日中午前后，卡夫卡在基尔灵去世。8 月底，《饥饿艺术家》在柏林出版，四篇小说照他最后改定的样子印了出来。
      none: 6 月 3 日中午前后，卡夫卡在基尔灵去世，四十岁。阳台的小桌上还留着一叠没用完的小纸条。
      desync: 5 月 19 日，校样改到一半，铅笔掉在地上，没人记得他停在了哪一行，改过的几页被收拢起来，混进了没改的里头。{staff}被召回时，风正从阳台吹进来，把最上面一页翻了过去。
      not_admitted: '{staff}没能进疗养院，只在坡下克洛斯特新堡的邮局门口站过几回。跑腿的男孩每天抱着一摞信从坡上下来，有一封厚的，是寄往柏林的。'
      points:
        p3: 5 月 11 日中午，朵拉端来一碗汤。卡夫卡拿起勺子，又放下了，在纸条上写了几个字推过去。{staff}懂医护，跟医生商量着把止痛排在饭前，算好钟点，等药起了效，才把碗端回他面前。卡夫卡一小口一小口地咽，咽一口，停一会儿。碗里剩下小半时，他把勺子横搁在碗沿上，拿起铅笔，在那张纸条背面又写了一行。
        p1:
          class_lettered: 5 月 19 日下午，阳台的小桌上摊着一叠校样。卡夫卡改到一半，咳了起来，铅笔掉到了地上。{staff}做惯了文字活，捡起铅笔，在他停下的那一行边上夹进一张窄纸条，把改过的几页和没改的分成两摞，用一块镇纸压住。卡夫卡歇过一阵，自己把那张纸条抽出来，接着往下改。风把没压住的一页掀起一角，他伸手按住了。
          trait_vigil: 5 月 19 日下午，阳台的小桌上摊着一叠校样。卡夫卡改到一半，咳了起来，铅笔掉到了地上。{staff}一直守在旁边，捡起铅笔，在他停下的那一行边上夹进一张窄纸条，把改过的几页和没改的分成两摞，用一块镇纸压住。卡夫卡歇过一阵，自己把那张纸条抽出来，接着往下改。风把没压住的一页掀起一角，他伸手按住了。
          else: 5 月 19 日下午，阳台的小桌上摊着一叠校样。卡夫卡改到一半，咳了起来，铅笔掉到了地上。{staff}有条理，捡起铅笔，在他停下的那一行边上夹进一张窄纸条，把改过的几页和没改的分成两摞，用一块镇纸压住。卡夫卡歇过一阵，自己把那张纸条抽出来，接着往下改。风把没压住的一页掀起一角，他伸手按住了。
        p2:
          class_medical: 5 月 21 日，走廊上等着送去邮局的信摞了一小摞，朵拉已经几天没出过这扇门。{staff}懂护理，把送信、下坡去邮局、陪坐的钟点排成一张表，钉在走廊的门后，谁几点来、谁几点走，一格一格写清楚。下午轮到{staff}守在屋里。朵拉出了门，沿着花园的篱笆走了一圈，在丁香底下站了一会儿。
          else: 5 月 21 日，走廊上等着送去邮局的信摞了一小摞，朵拉已经几天没出过这扇门。{staff}肯操心，也有耐心，把送信、下坡去邮局、陪坐的钟点排成一张表，钉在走廊的门后，谁几点来、谁几点走，一格一格写清楚。下午轮到{staff}守在屋里。朵拉出了门，沿着花园的篱笆走了一圈，在丁香底下站了一会儿。
        p4:
          class_lettered: 5 月 26 日，改定的印张已经寄回柏林，书要到夏天才印得出来。{staff}管过文书，知道印书的规矩，给柏林的出版社写信，请他们先把改定的印张装成一本，随邮寄来，信里附上四篇的篇目和他定的次序。过了些日子，跑腿的男孩从坡下抱上来一个硬邦邦的包裹。卡夫卡把它放在膝头，一页一页翻过去，翻到最后一篇，手指在标题底下停了一会儿。
          else: 5 月 26 日，改定的印张已经寄回柏林，书要到夏天才印得出来。{staff}有条理，给柏林的出版社写信，请他们先把改定的印张装成一本，随邮寄来，信里附上四篇的篇目和他定的次序。过了些日子，跑腿的男孩从坡下抱上来一个硬邦邦的包裹。卡夫卡把它放在膝头，一页一页翻过去，翻到最后一篇，手指在标题底下停了一会儿。
      excerpts:
        p4: 过了些日子，跑腿的男孩从坡下抱上来一个硬邦邦的包裹。卡夫卡把它放在膝头，一页一页翻过去，翻到最后一篇，手指在标题底下停了一会儿。
        p3: 卡夫卡一小口一小口地咽，咽一口，停一会儿。碗里剩下小半时，他把勺子横搁在碗沿上，拿起铅笔，在那张纸条背面又写了一行。
        p2: 下午轮到{staff}守在屋里。朵拉出了门，沿着花园的篱笆走了一圈，在丁香底下站了一会儿。
        p1: 卡夫卡歇过一阵，自己把那张纸条抽出来，接着往下改。风把没压住的一页掀起一角，他伸手按住了。
    relic: 一页校样
    relic_desc: 一页印刷校样，上面有铅笔改的小字。
    points:
      p1: 病中校稿一中断就给他留下接续的位置，护住卡夫卡最后校过的故事集
      p2: 把跑腿与通信交接给轮换的帮手，给守在基尔灵的人留出一段歇息时间
      p3: 减轻他喉头的痛，让他在最后几个星期还咽得下水和几口软食
      p4: 让柏林出版人先装订一本寄到基尔灵，让卡夫卡生前看到自己选定的四篇小说合在一起
    points_fail:
      p1: 校样寄回柏林时缺了作者最后一轮批改，印本失去这次校订。行程与史实脱节，员工被召回。
      p2: 照料者仍同时守病房、收信和跑腿，连等回信的空当都抽不开身。
      p3: 喉头的痛照旧让他吃不下东西，这条分支里他最后几个星期仍靠纸条说话，几乎咽不下一口。
      p4: 作者来不及看到书，出版者在他去世后才把它交给读者。
    shift:
      p1:
        was: 1924 年 5 月，卡夫卡在基尔灵养病时仍在校订《饥饿艺术家》的校样。
      p2:
        was: 1924 年 5 月，有朋友前往基尔灵协助照料已经病重的卡夫卡，分担伴侣原先承担的工作。
        now: '{staff}把送印、送信和陪伴所需的人手分时安排，帮手到时，原来守着的人可以出门走一会儿。'
      p3:
        was: 1924 年春，结核侵入卡夫卡的喉头，吞咽剧痛，吃不下也睡不好，医生每隔八到十天给喉上神经注射一次止痛；6 月 3 日他在基尔灵去世。
        now: '{staff}帮医生把止痛排在饭前，他在最后几个星期还喝得下水、吃得下几口软食，比历史上少受了些苦。'
      p4:
        was: 1924 年 6 月 3 日卡夫卡去世，同年 8 月《饥饿艺术家》故事集出版。
        now: '{staff}请柏林先把已经改完的印张装成一本随邮寄回。卡夫卡在基尔灵翻过它，认得出自己定的四篇和次序。'
        who: kafka_kierling
        bio: 卡夫卡生前看到一册按最后校样装订的故事集。正式出版时出版社保留了他选定的篇目和次序。
    vignettes:
      lilac: 5 月 13 日，{staff}帮疗养院的园丁修剪篱笆边的丁香，剪下的枝子堆在脚边，香得发闷。园丁说今年丁香晚开了一个星期，蜜蜂到现在还没原谅它，天天飞到厨房窗口来抱怨。
      post: 5 月 23 日，{staff}跟疗养院跑腿的男孩走下坡去克洛斯特新堡的邮局，路边的果树刚落了花。男孩说他不用看就知道信从哪儿来：柏林来的又厚又硬，全是纸；布拉格来的薄，天天都有。
      rain: 六月中旬，{staff}被一场急雨堵在村里面包铺的门洞下，雨点砸在石板上，溅起一层白烟。面包师的妻子看着街面变成一条河，说基尔灵的小溪只在她刚刷完门口台阶的时候才漫上来。
  dickinson_amherst:
    name: 箱子里的诗
    place: 阿默斯特
    figure: 艾米莉·狄金森
    story: 1886 年 5 月 15 日，艾米莉·狄金森在阿默斯特家中去世。妹妹拉维尼娅按姐姐的要求销毁了收到的来信，又发现数百首诗。早期编者后来将艾米莉手缝成册的诗稿拆开整理。
    story_prose:
      opening:
        - 阿默斯特家里，拉维尼娅看见一摞来信下压着一角折过的纸。旁边还有艾米莉已经缝好的小本。楼上的人问今晚要不要留灯，纸页暂时全放在手边的箱子上。
        - 艾米莉·狄金森于 1886 年去世。姐妹拉维尼娅处理她的来信时发现大量诗稿，后来不少诗册被拆开。这次可以先约一晚合艾米莉心意的照护；之后还要分清信与诗，争取整册留下一份。
        - 擅长照顾人的员工先问艾米莉怎么安排夜里的屋子。熟悉手稿的人再帮拉维尼娅识别缝线和备选词，按发现时的顺序核对。
      points:
        p1: 拉维尼娅提起一摞散纸，说来信归一处。你请她先拆开夹在下面的细绳，那里几张折成同一大小的纸，用的是姐姐自己的字。她把信另放，把诗放在一盏不烫纸的灯旁慢慢看。她最后把两摞挪到两只箱盖上，才叫家人来认。
        p2: 拉维尼娅问抄本能不能只留各页最好读的词。你请她指给抄写人看同一行旁边补过的两个字，再把折痕和线孔的位置单独画在副稿上。封套写好页序，小册没有拆。再翻一遍时，抄写人能按折线回到同一个备选词。
        p3: 你问艾米莉今晚愿不愿有人在隔壁。她把灯往窗口指了一下，请那人把走廊的门虚掩着，自己想叫时听得见。家人照她说的，把水和一张可挪的椅子放好。要走的时候，最后一位值夜人把脚步放轻，她还能听出是谁。
      outcomes:
        all: 艾米莉那晚按自己的意思歇息。她去世以后，留存的诗稿中有一本从缝线到备选词都能重新查阅。
        p1: 来信与诗稿分开存放，未刊诗还在。家人日后处理原稿，仍有册页拆散。
        p2: 一册的折页和备选词留了副本。其余诗稿的存放出了差错，只有这册的抄录过程随报告带回。
        p3: 她夜里开口时，有人就在听得见的地方。诗稿的处理还要等家人自己辨认。
      none: 灯边只留下一些折过的纸，没有人替艾米莉安排那一夜。
      not_admitted: 有人从门里应了一声，说家里现在不能接访。两摞纸还没摊开。
      desync: 诗稿和来信混到一起，原来会存世的一批散页找不回了。事务所因同步失败召回员工。
      excerpts:
        p1: 她最后把两摞挪到两只箱盖上，才叫家人来认。
        p2: 再翻一遍时，抄写人能按折线回到同一个备选词。
        p3: 要走的时候，最后一位值夜人把脚步放轻，她还能听出是谁。
    relic: 一册手缝的小本
    relic_desc: 几页手工缝起来的纸，每页一首诗。
    points:
      p1: 帮拉维尼娅分开要销毁的来信和姐姐捆好的诗稿，护住那批尚未刊行的诗
      p2: 请拉维尼娅留下一本未拆的诗册，抄出带折页、页序和备选用词的副本
      p3: 问艾米莉今晚怎样能歇得安稳些，帮家里人照她的意思安排
    points_fail:
      p1: 诗稿和来信混进同一摞纸，大批未刊诗跟着消失。这条分支与史实脱节，员工被召回。
      p2: 清抄稿有了，可纸页怎样折在一起，单看副本已经辨不出来。
      p3: 家里照平时的样子入夜。艾米莉需要人搭把手时，还得开口请人留下。
    shift:
      p1:
        was: 1886 年，狄金森去世后，拉维尼娅按姐姐的要求销毁来信，另外发现了成批诗稿。
      p2:
        was: 狄金森的早期编者拆开了她亲手缝成的诗册。
        now: 这条分支里，{staff}抄了一册留样，始终没拆它。拉维尼娅从副本就能看出纸页怎样叠在一起，页边的备选词也留了下来。
      p3:
        was: 狄金森病重，1886 年 5 月 15 日在家中去世。
        now: 这条分支里，家人照她的意思留了人在近处。她歇下之后，有事也不用提高声音喊。
    vignettes:
      pause: 读者朗读时把破折号滑了过去。你请他在笔迹断开的地方停一停。再读那一行，他听出了另一种收尾。
      variant: 你看见行上还写了一个词。读者想挑一个抄完就算，你腾出页边，把两个都留着，并注明各在何处。
      stack: 读者整理散页时，你把边缘和笔迹对得上的两张留在一起。下一次清抄，便从这两张并排开始。
  poe_baltimore:
    name: 第四选区的一张求助条
    place: 巴尔的摩
    figure: 埃德加·爱伦·坡
    story: 1849 年 9 月 27 日，埃德加·爱伦·坡离开里士满，要回纽约福德姆的家，第二天到了巴尔的摩。此后直到 10 月 3 日，他的行踪没有可靠记载。10 月 3 日是选举日，有人在瑞安那处第四选区投票点发现他处境不妙，印刷工约瑟夫·沃克写条子请约瑟夫·斯诺德格拉斯来。他被送进华盛顿学院医院，不许探视，7 日天亮前在那里去世，四十岁，死因至今不明。他的姨母兼岳母玛丽亚·克莱姆是从报上读到的。
    story_prose:
      opening:
        - 1849 年 9 月底，巴尔的摩。四十岁的作家埃德加·爱伦·坡写过《乌鸦》，也写恐怖和推理故事。这年夏天他在里士满讲演，为办杂志筹钱，9 月 27 日动身回纽约福德姆的家，第二天到了巴尔的摩。福德姆家里等他的，是姨母兼岳母玛丽亚·克莱姆。
        - 史实里，此后五天他的行踪没有可靠记载。10 月 3 日是选举日，印刷工约瑟夫·沃克在第四选区的投票点发现他处境很糟，写条子请斯诺德格拉斯医生来；他被送进华盛顿学院医院收醉汉的病房，一连几天时醒时昏，不许探视，7 日天亮前去世，死因至今不明。两天后，玛丽亚·克莱姆在福德姆从报上读到死讯，写信去巴尔的摩打听。在这条分支里，码头上有个背箱子的脚夫，隆巴德街有个数酒桶的酒馆老板，病区里有个守夜的杂役。
        - 这一趟用得上几种人：懂医护、意志够硬的人，或者有条理、守得住、意志更硬的人，接住那张求助条，护住他从投票点到医院的那段路；懂护理、干过照护、跑过腿或当过记者的人，心善、耐心、有条理的人，或者带着笔记本和笔、脑子不慢的人，把消息送到玛丽亚·克莱姆手上；当医生、脑子快又意志硬的人，或者懂医护、带着纳米医疗箱的人，守着他熬过谵妄。
      outcomes:
        all: 十月底，坡出了院，往北回纽约的家。福德姆的小屋门口，玛丽亚·克莱姆手里攥着那封从巴尔的摩寄来的信，朝路口望着。
        p3: 十月底，坡出了院，往北回纽约的家。他拄着手杖，在医院门口的台阶上停了一下，把领口扣好。
        p2: 10 月 7 日天亮前，坡在医院里去世。玛丽亚·克莱姆的回信已经送到了病区，搁在那间屋子的窗台上。
        p1: 10 月 7 日天亮前，坡在华盛顿学院医院去世，四十岁。第二天他葬在巴尔的摩他祖父的那块地里，来送的人很少，几分钟就完了。
      none: 10 月 7 日天亮前，坡在华盛顿学院医院去世，死因至今不明。两天后，玛丽亚·克莱姆在福德姆读到报上的消息，提笔给巴尔的摩写信，请人什么都不要瞒她。
      desync: 10 月 3 日，那张求助条在投票点楼下的人群里传了几手，不知落进了谁的口袋。{staff}被召回时，楼梯口那张长凳上还靠着一个人，帽子盖住了半张脸。
      not_admitted: '{staff}没能接近他，只在码头上帮人搬过几天箱子。里士满来的汽船一船船靠岸，下船的人里有个拄手杖的瘦个子，走得很慢。'
      points:
        p1:
          class_medical: 10 月 3 日下午，第四选区投票点楼下挤满了人，酒味和湿木头味混在一起。一张条子从楼梯口传出来，在几只手里转了一圈。{staff}懂医护，接过条子，看清了上面要请的人，一路问着找到斯诺德格拉斯医生，又陪着他和坡的姨父叫来一辆马车，把坡从楼梯口的长凳上扶起来。坡靠在车厢的角落里，嘴里说着谁也听不清的话。马车动起来，{staff}把车窗的布帘拉下一半，挡住了投票点门口那些探过来的脸。
          trait_vigil: 10 月 3 日下午，第四选区投票点楼下挤满了人，酒味和湿木头味混在一起。一张条子从楼梯口传出来，在几只手里转了一圈。{staff}一直留神着楼梯口，接过条子，看清了上面要请的人，一路问着找到斯诺德格拉斯医生，又陪着他和坡的姨父叫来一辆马车，把坡从楼梯口的长凳上扶起来。坡靠在车厢的角落里，嘴里说着谁也听不清的话。马车动起来，{staff}把车窗的布帘拉下一半，挡住了投票点门口那些探过来的脸。
          else: 10 月 3 日下午，第四选区投票点楼下挤满了人，酒味和湿木头味混在一起。一张条子从楼梯口传出来，在几只手里转了一圈。{staff}有条理，接过条子，看清了上面要请的人，一路问着找到斯诺德格拉斯医生，又陪着他和坡的姨父叫来一辆马车，把坡从楼梯口的长凳上扶起来。坡靠在车厢的角落里，嘴里说着谁也听不清的话。马车动起来，{staff}把车窗的布帘拉下一半，挡住了投票点门口那些探过来的脸。
        p2:
          class_medical: 10 月 4 日，病区不许探视，来打听的人都被挡在楼下，福德姆那边还不知道他在哪里。{staff}懂护理，进得了病区，问清了院方知道的情形：哪天送来的，住在哪间，谁在照看，把这些和一个能回信的地址写成一封信，赶在往北的邮班之前送到了邮局。邮局的伙计在信封上盖了一个戳。信封上写着福德姆，玛丽亚·克莱姆收，他把它丢进了往纽约去的那只邮袋。
          class_press: 10 月 4 日，病区不许探视，来打听的人都被挡在楼下，福德姆那边还不知道他在哪里。{staff}当过记者，知道消息怎么走得最快，问清了院方知道的情形：哪天送来的，住在哪间，谁在照看，把这些和一个能回信的地址写成一封信，赶在往北的邮班之前送到了邮局。邮局的伙计在信封上盖了一个戳。信封上写着福德姆，玛丽亚·克莱姆收，他把它丢进了往纽约去的那只邮袋。
