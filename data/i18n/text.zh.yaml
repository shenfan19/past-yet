    shift:
      p1:
        was: 1843 年 8 月，巴贝奇要求她请编辑同意撤稿。洛芙莱斯拒绝，译稿与署有她姓名缩写的注释同年合刊。
      p2:
        was: 洛芙莱斯 8 月 15 日写给母亲，说印坊临时召她做最后一轮监督，数学公式的校对十分费力。
        now: 印坊留存一份她核过的逐列样表。排字工再改动一格，就能用同一张样表检查邻列。
      p3:
        was: 8 月 14 日，洛芙莱斯向巴贝奇提议由自己和合作者承担组织事务，让他专心工程。巴贝奇未接受这些条件。
        now: 两人同意先请一位出资人看设计图与费用草案。来客拿到一份分工清楚的说明，并约定工程评估后再决定是否承担费用。
        who: lovelace_london
        bio: 洛芙莱斯同时写译稿和技术注释。除了说明机器可以怎样工作，她还试着为一项停在纸上的工程寻找继续筹办的办法。
    vignettes:
      messenger: '{staff}在圣詹姆斯广场一座宅子的门廊下等回信，石柱被太阳晒得发烫，当信差的规矩是不能坐。屋里的人写了划，划了又写，天擦黑才把一封火漆还软着的信塞到{staff}手里，送多塞特街。'
      compositor: '{staff}帮排字工拣铅字，没一会儿指头就黑了。排字工抱怨这一期满版都是希腊字母、角标和架在行上的小数字，西格玛那一格都快拣空了，写这东西的人该自己来排。'
      loom: '{staff}在斯皮塔佛德一家织坊门口停下。提花机上的穿孔纸板一张接一张翻过去，咔嗒咔嗒响，丝面上慢慢起了一朵花。织工说，这些纸板比他还认得花样。'
  nightingale_scutari:
    name: 把护理做成用数据和关怀的学科
    place: 奥斯曼斯库塔里
    figure: 弗洛伦斯·南丁格尔
    story: 弗洛伦斯·南丁格尔 1858 年的军队卫生报告依据战时经验，收入医院统计。
    story_prose:
      opening:
        - 斯库塔里，病房刚换了一次班。南丁格尔把一份转房名单递给门边的人，请他先和今天新收的人分开。卫生委员会抵达的消息已送来，三位委员正要开始查看。
        - 卫生委员会 1855 年 3 月到斯库塔里查看医院，赫克托·加文四月在巴拉克拉瓦死于一次意外。南丁格尔五月在当地重病，后来脱险，健康长期受影响。这趟可让查看继续，也可改写两人的病险。
        - 让懂病房交接的人护住查访记录。能照应营地的人先关照加文的安全。后来照护南丁格尔的人，要问她愿意怎样休息。
      points:
        p1: 一名书记把换病房的人算作新入院。你请值班护士拎着两份单子读回一遍，在委员会的人到门口前指出哪些是重复的。查访人员沿记录先去了有问题的病房，才问下一个地方。有人带着分开的两册出来，两册都还有许多空页。
        p2: 加文站在营帐口，准备把手里的左轮交给弟弟。你请两个人暂时停一下，让负责营地安全的人来接手。等他们坐回帐里的桌旁，加文把本来要带走的卫生记录重新打开。下午再有人找他签字，他还坐在那一张桌边。
        p3: 南丁格尔还托人送来要看的表，等表真正到了又请人先收起。你问她愿不愿意让事务所照护者留下，叫忙着等答复的人改天再来。她有多些力气时，先说房里可以开一点窗，然后才问原先到哪页。等她再次摊开那张表，家里没有人催她马上签完。
      outcomes:
        all: 查看按期继续，加文免于那次意外，南丁格尔也在分支里从五月的病中恢复。她后来继续工作，按自己的体力决定每天做多少。
        p1: 委员会顺利开始查看，记录带回去供他们继续处理。
        p2: 加文平安留在营地。他手头那份卫生记录还有机会继续整理。
        p3: 南丁格尔在这条分支恢复得更快。她自己选定哪天再展开报表。
      none: 病房单子被混放了一阵。那些等消息的人仍分别等四月和五月的来信。
      not_admitted: 门房请不在查访名单的人在外间等。你听见护士再次核对转房名单。
      desync: 查看没有按期开始。护理与卫生记录脱节，事务所召回员工。
      excerpts:
        p1: 有人带着分开的两册出来，两册都还有许多空页。
        p2: 下午再有人找他签字，他还坐在那一张桌边。
        p3: 等她再次摊开那张表，家里没有人催她马上签完。
    relic: 一盏小油灯
    relic_desc: 她夜里查房时用的那盏灯。
    points:
      p1: 在病房的伤寒和霍乱里，护住卫生委员会 3 月 6 日起对斯库塔里各医院的查看
      p2: 在巴拉克拉瓦的帐篷里拦下走火的左轮枪，救下卫生委员赫克托·加文
      p3: 治好南丁格尔 5 月在巴拉克拉瓦染上的克里米亚热，不让这场病跟她一辈子
    points_fail:
      p1: 查看在病房里拖住，堵着的下水道没能及时打开。这条分支与历史脱节，员工被送回。
      p2: 帐篷里那一枪还是响了，这条分支里委员会登岸一个月就少了一位委员。
      p3: 热病照原样走完。五月底她脱离了危险，这条分支里这场病和历史上一样留在她身上。
    shift:
      p1:
        was: 1855 年 3 月 6 日，卫生委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。
      p2:
        was: 1855 年 4 月 21 日，卫生委员赫克托·加文在克里米亚把左轮枪递给弟弟时枪走了火，中弹身亡。
        now: '{staff}请两人先停一下。加文放下左轮，请负责营地安全的人接手。他继续做委员会的事，后来回到英国。'
      p3:
        was: 1855 年 5 月，南丁格尔去巴拉克拉瓦查看医院，几天内染上克里米亚热，病危约十二天，此后大半生病弱。
        now: '{staff}在发病头几天用这个世纪还没有的药治住了热病。南丁格尔一周内下了床，回到斯库塔里，那场跟她回家的病没有留下。'
        who: nightingale_scutari
        bio: 在这条分支里，南丁格尔 1855 年在巴拉克拉瓦染上的热病被治好。她关于医院和军队卫生的工作，是自己站着去做的，不是在病榻上做的。
    vignettes:
      totals: 虚构书记员把转房名单也算进新收治人数。你问哪些名字是刚入院的。他另留一栏记转房，再把报表送出去。
      name: 书记员隔着嘈杂声没听清名字。你在报名字的人身旁等他再说一遍，下一份抄件就照他给的拼法写。
      fold: 书记员念哪一处，你就按顺序放哪一页。原来夹在合计后面那张，这次先送到了他手里。
  mendel_brno:
    name: 豌豆与遗传的规律
    place: 布尔诺
    figure: 格雷戈尔·孟德尔
    story: 1856 年到 1863 年，格雷戈尔·孟德尔在布尔诺住处的园子里杂交豌豆，一代代数它们的后代。1865 年 2 月 8 日和 3 月 8 日，他在布尔诺自然科学学会分两场报告了结果，论文 1866 年刊在学会的会刊上。他生前，这篇论文几乎没人接着做下去。孟德尔 1884 年去世，1900 年，三位植物学家在研究遗传时各自找到了他的论文。
    story_prose:
      opening:
        - 1865 年冬，布尔诺。修士格雷戈尔·孟德尔从 1856 年起在修道院的园子里杂交豌豆，一代一代数它们的后代，按他自己的说法，前后八年。这个冬天，他要在布尔诺自然科学学会把这些数字讲出来。
        - 史实里，他在 2 月 8 日和 3 月 8 日分两场作了报告，论文第二年刊在学会的会刊上。他生前，这篇论文几乎没人接着做下去；1884 年他在布尔诺去世，到 1900 年，才有三位植物学家各自找到它。在这条分支里，会场门口有个铺草垫的看门人，白菜市场有个卖干豌豆的老太太。
        - 这一趟用得上几种人：心细、守得住两场报告的人；会教书、把数字一代一代拆开摆给人看的人；说得动人、散会前约得下人回去复种的人。
      outcomes:
        all: 那年秋天，一封外地来信寄到修道院，信里是另一处园子里数出的豌豆。孟德尔把它和自己的数字并排摊在桌上，旁边压着那张分代的对照表。
        p3: 那年秋天，一封外地来信寄到修道院，信里是另一处园子里数出的豌豆。孟德尔把两份数字并排摊在桌上，一行一行对下去。
        p2: 那张分代的对照表，几个听过报告的人抄回了家。第二年会刊印出来，他们拿自己的抄本去对，一格一格对得上。
        p1: 1866 年，两场报告合成《植物杂交实验》，刊在学会会刊第 4 卷上。修道院的园子里，那一年的豌豆照常下了种。
      none: 1866 年，论文刊在学会的会刊上，没有几个人接着做下去。修道院的园子里，豌豆架子一到冬天就空着。
      desync: 2 月 8 日那一晚，时间只够讲完做法，第二场没有排上。{staff}被召回时，孟德尔的稿子还有大半叠没翻开，压在会场的桌角上。
      not_admitted: '{staff}没能进学会的会场，只在白菜市场帮老太太分了几天干豌豆。圆的一堆，皱的一堆，她从来不数。'
      points:
        p1:
          class_lettered: 2 月 8 日晚上，学会的会场点着灯，门口草垫上的雪水化了一片。孟德尔手里的稿子，是八年的数字。{staff}照整理档案的办法，前一天替他把稿子分成两叠，夹一张纸条，标明这一晚讲到哪里为止，后一叠写上下一场的日子。讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。
          else: 2 月 8 日晚上，学会的会场点着灯，门口草垫上的雪水化了一片。孟德尔手里的稿子，是八年的数字。{staff}前一夜陪他把稿子念了一遍，看着钟点，在讲到一半的地方折了个角，后一半另放一叠。讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。
        p2:
          class_teaching: 3 月 8 日，第二场。他讲杂种的后代怎样分开，数字一个接一个念出来，底下有人跟着抄，抄着抄着就分不清是哪一代了。{staff}照教书的规矩，在会场后头的黑板上画了一张表，第一代一栏，下一代一栏，他念一个数，就填进一格。散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。
          else: 3 月 8 日，第二场。他讲杂种的后代怎样分开，数字一个接一个念出来，底下有人跟着抄，抄着抄着就分不清是哪一代了。{staff}事先把他的数字按代誊在一张大纸上，第一代一栏，下一代一栏，钉在会场后头的墙上。散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。
        p3:
          class_lettered: 3 月 12 日，两场报告都讲完了，听过的人还没有各自散去。{staff}照登记的办法备了一本小册子，愿意回去复种的人留下姓名和地址，再写明来年要寄回哪几项计数。孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。
          else: 3 月 12 日，两场报告都讲完了，听过的人还没有各自散去。{staff}挨个去找那两晚坐在前排的人，一家一家地说，说动了一位，就请他留下地址。孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。
      excerpts:
        p3: 孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。
        p2: 散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。
        p1: 讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。
    relic: 一只豌豆荚
    relic_desc: 修道院花园里的一只干豆荚。
    points:
      p1: 帮孟德尔把八年的计数拆成两场讲得完的报告，护住布尔诺学会的两次宣读
      p2: 把容易在口头报告里混淆的两代计数分开列给听众核对
      p3: 趁听众还在，替孟德尔约定一份异地复测，让刊印前就有人回报自己的计数
    points_fail:
      p1: 首场念完时间只够交代做法，第二场没有排上。学会少了完整的两次报告，事务所因同步失败召回员工。
      p2: 听众带走的是总数，回去后分不清哪些是第一代、哪些是下一代的观测。
      p3: 报告传到外地要等学会年刊和抽印本，读者听完以后也没有约定谁来复测。
    shift:
      p1:
        was: 1865 年 2 月 8 日和 3 月 8 日，孟德尔在布尔诺自然科学学会分两次报告豌豆杂交实验。
      p2:
        was: 1865 年的两次报告以多年豌豆计数为据，1866 年刊印的论文逐项列出各代结果。
        now: '{staff}请孟德尔在报告后留下分代对照表，听众可以拿自己抄的数字回来核对。'
      p3:
        was: 1866 年布尔诺学会刊印论文，孟德尔用抽印本同外地学者通信，讨论结果能否验证。
        now: '{staff}请愿意复测的人留下地址并约好回报的内容。下一季有人把自己的数字寄回布尔诺，孟德尔可以在年刊流通前把两地结果对照。'
        who: mendel_brno
        bio: 孟德尔的报告后来随年刊刊行。跟随报告启动的异地复测让他较早收到一组可以独立核对的结果。
    vignettes:
      straw: '{staff}帮看门人在会场门口铺草垫，草是从马厩里抱来的，还带着一股潮味。每双靴子上的雪都化在地上，看门人说，这些先生宁可听人讲豌豆，也懒得在门口跺跺脚。'
      market: '{staff}在白菜市场帮一个老太太分拣干豌豆，圆的一堆，皱的一堆，豆子落进筐里沙沙地响。她说圆的好卖。{staff}还是把两堆都数了一遍，差不多三比一，自己先笑了。'
      furrow: 三月底，{staff}在城外的田埂上走，地里的雪化得只剩沟底一线。农人正把攒了一冬的粪摊开，说今年豌豆得早点下种，赶在倒春寒前头。
  mendeleev_petersburg:
    name: 元素周期表
    place: 圣彼得堡
    figure: 门捷列夫
    story: 1869 年 3 月 1 日，德米特里·门捷列夫排好一张单页的表，按原子量和化学性质的相似性给元素分组。3 月 18 日，俄国化学学会开会，门捷列夫不在，尼古拉·缅舒特金代他宣读论文。会议记录把讨论推到下一次，下一次却没再议。3 月下旬，这张表随他的化学教科书刊出，也另印散页寄给同行。那年春天的一份德文摘要，把性质的「周期性重现」译成了「逐级变化」。
    story_prose:
      opening:
        - 1869 年春，圣彼得堡。3 月 1 日，德米特里·门捷列夫排好了一张单页的表，按原子量和化学性质的相似给元素分组，表里留着空格，等还没发现的元素。
        - 史实里，3 月 18 日俄国化学学会开会，他不在场，一说去了特维尔省看奶酪作坊，一说病了，论文由尼古拉·缅舒特金代读；记录写明作者不在，讨论推到下一次，下一次却没有人再提。五月寄往德国的摘要里，他的第一条结论，性质的周期性，被译成了逐级变化。在这条分支里，印刷所有个嫌表上空格太多的排字工，客栈里有个守着茶炊的掌柜。
        - 这一趟用得上几种人：懂文书、分得清原稿和附表的人；会讲课、在会上撑得起一场问答的人；懂德文、校得出一个词的人。
      outcomes:
        all: 那年夏天，德国的读者在摘要里读到了周期性重现。圣彼得堡学会的记录里，元素表那一项后面跟着半页问答，那张表上，几处空格旁边画着铅笔圈。
        p2: 学会的记录里，元素表那一项后面多了半页问答。那张表后来一直留在他手边，几处空格旁边画着铅笔圈。
        p3: 那年夏天，德国的读者在摘要里读到，元素的性质会周期性重现。有人来信问重现和例外怎样分，他摊开那张表，一条一条写了回信。
        p1: 3 月下旬，这张表随《化学原理》第二分册刊出，又另印散页寄给同行。1875 年，镓被发现，填上了表里的一个空格。
      none: 4 月 15 日，学会再开会，没有人提起那张表。印刷所的绳子上，晾干的散页一张张收了下来，空格还是空格。
      desync: 3 月 18 日，缅舒特金手里只有那张表，原稿还压在行李里，学会划掉了这一项。{staff}被召回时，那张表还摊在会场的桌上，没有人去碰。
      not_admitted: '{staff}没能进学会的门，只在客栈里学了几天从茶炊接茶。掌柜一直盯着{staff}的靴子，直到龙头拧对为止。'
      points:
        p1:
          class_lettered: 3 月 18 日，俄国化学学会开会，门捷列夫不在。他留给缅舒特金的东西，表在一处，论文原稿还压在没拆的行李里。{staff}照管文书的规矩，从行李里找出那叠原稿，一页页对过页码，和那张表用同一个纸夹夹好，开会前送到缅舒特金手上。缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。
          else: 3 月 18 日，俄国化学学会开会，门捷列夫不在。他留给缅舒特金的东西，表在一处，论文原稿还压在没拆的行李里。{staff}守了半夜，天亮前从一只没拆的箱子里翻出那叠原稿，和那张表一起抱着赶到会场。缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。
        p2:
          class_teaching: 4 月 15 日，学会再开会，门捷列夫在城里。上一次记录里推后的那一项，还留在旧页上。{staff}照讲课的办法，开会前把那张表抄大，挂在会场前头，又把上次记录里那一行“待作者在场时讨论”抄在议程最上面。轮到这一项，门捷列夫站起来，手里拿着那张表。有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。
          else: 4 月 15 日，学会再开会，门捷列夫在城里。上一次记录里推后的那一项，还留在旧页上。{staff}开会前找到记录员，指着上次记录里“待作者在场时讨论”那一行，请他把它抄进这一回的议程。轮到这一项，门捷列夫站起来，手里拿着那张表。有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。
        p3:
          class_lettered: 六月初，给德国《化学杂志》的那份摘要已经有了德文稿，还没有付印。{staff}照译者的规矩，把德文稿和俄文原稿并排对读，读到第一条结论停下来：原文说性质呈现周期性，译稿写的却是逐级变化。门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。
          else: 六月初，给德国《化学杂志》的那份摘要已经有了德文稿，还没有付印。{staff}一条一条对着俄文原稿核德文稿，在第一条结论的那个词底下画了一道线：原文是周期性，译稿成了逐级变化。门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。
      excerpts:
        p2: 有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。
        p3: 门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。
        p1: 缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。
    relic: 一副元素卡片
    relic_desc: 手写的卡片，可以像摆纸牌一样摆。
    points:
      p1: 门捷列夫已经离城。把他留给缅舒特金的论文和附表合在一起交到会场，赶上俄国化学学会宣读
      p2: 趁作者从外地回来，把下次会议原留待讨论的一项重新排进议程，让他逐一回应来问排表依据的人
      p3: 德文摘要付印前，请门捷列夫确认第一条结论的译法，把表示性质周期性重现的词改回去
    points_fail:
      p1: 报告人只接到附表，原稿还压在门捷列夫的行李里。学会划掉这一项，事务所因同步失败召回员工。
      p2: 上一回记录的待议事项留在旧页上。到下次会议，没有人再为元素表留一段可讨论的时间。
      p3: 德文稿已送去排字。读者看到性质逐级改变的说法，看不出作者强调性质隔一段会重现。
    shift:
      p1:
        was: 1869 年 3 月 18 日（俄历 3 月 6 日），论文由缅舒特金代为宣读。门捷列夫不在场，一说去特维尔省考察奶酪作坊，一说生病。
      p2:
        was: 会议记录因作者缺席而延后讨论，后来学会会议没有接续讨论这件事。
        now: 学会在下一次会上给门捷列夫留出回话的时间。他把几处争议栏圈出来，和提出疑问的人约定后续核查。
      p3:
        was: 1869 年的德文摘要将原文的周期性译成表示逐步变化的词。
        now: 发出的德文摘要写明性质会周期性重现。一位只读到摘要的通信者问起怎样区分重现和例外，门捷列夫用自己的表逐项回复。
        who: mendeleev_petersburg
        bio: 门捷列夫在圣彼得堡写成早期元素表，经学会会议、散印表和期刊让其他化学家见到它。俄文原稿的关键概念在跨语言传递时曾被改变。
    vignettes:
      flyers: '{staff}在印刷所帮忙，把刚印出的表一张张晾在绳上，屋里一股油墨味。排字工嘀咕，他排了半辈子版，没见过这么多空格和问号的，问是不是那位先生忘了填。'
      neva: 涅瓦河的冰化了，碎冰块还贴着岸往下漂。{staff}挤在河岸上看一条小船从要塞划向宫殿，旁边的人说，那条船没过河之前，谁也不许下水。
      samovar: '{staff}在客栈里学着从茶炊里接茶，铜壶擦得能照见人影。掌柜说外国人总把龙头拧反，烫了靴子，一边说一边盯着{staff}的脚。'
  pasteur_paris:
    name: 阿尔布瓦的那个夏天
    place: 阿尔布瓦
    figure: 路易·巴斯德
    story: 1859 年夏，巴斯德在巴黎做研究，九岁的长女让娜住在阿尔布瓦的祖父家。九月她染上伤寒，死在那里。
    story_prose:
      opening:
        - 从巴黎寄来的一封短信放在阿尔布瓦祖父家的窗边。让娜下午没有去院里，祖父隔一会儿到床边看看，从那里还能听见门外收信的脚步。
        - 1859 年夏，让娜住在祖父家。史实里，她在九月因伤寒去世。分支里允许事务所带来的虚构医疗箱改变这次病程，让祖父可以写信说她已经坐得起来。
        - 让有照护经验的人带上事务所的纳米医疗箱。先问祖父需要哪种帮忙，再在旁边陪他等让娜醒过来。
      points:
        p1: 祖父把椅背挪到能看见床的地方。你把事务所的医疗箱交给照护员工，请祖父留在让娜想让他在的地方。等她醒来想坐起，祖父把信纸拿出来，问她要加哪句话。她让他先写信寄给妈妈，再想一句给爸爸。
      outcomes:
        all: 祖父寄出一封平安信。信写得很短，夹在爸爸原先寄来的信旁等邮差来取。
        p1: 让娜慢慢有力气在床边坐一会儿。祖父能把她醒来时自己说的话写给父母。
      none: 等外头来取信时，祖父把纸重新叠了一次。史实中，让娜没能从那次病里恢复。
      not_admitted: 家人尚未同意让来客进屋。门外等着送信的人先走了，窗边那封来信仍收在屋里。
      excerpts:
        p1: 她让他先写信寄给妈妈，再想一句给爸爸。
    relic: 阿尔布瓦寄信的信封
    relic_desc: 让娜祖父留在桌上的一只虚构信封。
    points:
      p1: 等让娜发烧时，带事务所的纳米医疗箱去祖父家，帮祖父照护她
    points_fail:
      p1: 祖父守在身边，让娜还是越烧越重，最后死在阿尔布瓦。
    shift:
      p1:
        was: 1859 年 9 月，巴斯德九岁的长女让娜在阿尔布瓦祖父家患伤寒去世。
        now: 这条分支里，{staff}用上了事务所的纳米医疗箱。让娜退了烧，祖父能给她父母捎信，说她已经有力气坐起来。
        who: pasteur_paris
        bio: 这条分支里，巴斯德的长女让娜在 1859 年阿尔布瓦的那场伤寒后康复。
    vignettes:
      date: 祖父差点把上一封信的日期抄到这一封。{staff}将两个信封并排放好，陪他重新核一遍。
      address: 邮差动身前，{staff}把巴黎的地址念给祖父听。那封信仍折着，留给家人来拆。
      future: '{staff}在巴黎来信旁放一张干净纸。等让娜再说话，那里还有地方可写。'
  curie_paris:
    name: 两种新元素
    place: 巴黎
    figure: 玛丽·居里
    story: 1898 年 4 月，玛丽·居里报告说，沥青铀矿放出的射线比其中的铀能解释的更强。她与皮埃尔·居里在巴黎的工业物理化学学校把矿石一份份分开，追着射线走。1898 年 7 月 18 日，他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭。玛丽·居里 1934 年死于再生障碍性贫血，一般认为与她长年受辐射有关。
    story_prose:
      opening:
        - 1898 年夏，巴黎。玛丽·居里和皮埃尔·居里在工业物理化学学校，把沥青铀矿一份一份分开，追着射线走。这年 4 月，她报告说这种矿石放出的射线，比其中的铀能解释的还要强。
        - 史实里，7 月 18 日他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭，欧仁·德马尔赛看到的一条新光谱线随文刊出。他们工作的那间棚屋通风差，屋顶漏雨，样品多年都是空手处理；1934 年，玛丽死于再生障碍性贫血，一般认为与她长年受辐射有关。在这条分支里，拉丁区有家小馆子的老板娘，塞纳河边有个旧书摊的摊主。
        - 这一趟用得上几种人：带着防护、懂医药或做过实验的人；懂档案、对得齐几份记录的人；说得动人、争得来一间屋子的人。
      outcomes:
        all: 那年冬天，仪器搬进了学校腾出的一间屋子，桌前立着那道防护屏，手套挂在屏边的钉子上。12 月 26 日，镭的报告交到了科学院，那条新光谱线随文刊出。
        p3: 从那年起，那道防护屏一直立在他们的桌前，手套挂在屏边的钉子上。玛丽后来又多工作了些年。
        p2: 那年冬天，仪器搬进了学校腾出的那间屋子，再没有挪过。记录本一本本排在窗台上，按日子摆得整整齐齐。
        p1: 12 月 26 日，镭的报告交到了科学院，那条新光谱线随文刊出。棚屋里，记着那一年测量的几本本子摞在桌角，最上面一本还摊开着。
      none: 那年冬天，雨还从棚屋顶上漏下来。两人照旧空着手端起玻璃皿，皿里的东西在暗处发着一点淡光。
      desync: 12 月 25 日夜里，光谱观察和他们的记录还是对不上，年末那份报告没能交出去。{staff}被召回时，棚屋的桌上摊着三本记录，翻在三个不同的日子。
      not_admitted: '{staff}没能进学校院里那间棚屋，只在拉丁区的小馆子里吃了几顿饭。邻桌的波兰学生还在争，红菜汤又凉了。'
      points:
        p1:
          class_lettered: 12 月 25 日，年末那份报告明天就要交到科学院。德马尔赛看到的那条新光谱线，要和他们本子上的测量一一对上。{staff}照档案的规矩，把光谱观察的日子、样品的编号和本子上的测量一行一行对齐，抄成一张对照表，夹在稿子最前面。皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。
          else: 12 月 25 日，年末那份报告明天就要交到科学院。德马尔赛看到的那条新光谱线，要和他们本子上的测量一一对上。{staff}守着那几本记录熬了一夜，把光谱观察对应的样品编号一个一个找出来，抄在稿子的页边。皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。
        p2:
          class_lettered: 12 月 24 日，雨又从棚屋顶上漏下来，接水的盆已经摆到了门口。{staff}照档案的办法，把七月那份钋的通报、年末要交的稿子，和一本记着哪天漏雨、哪天停工、仪器挪过几回的流水账订成一册，送到管学校房舍的人手里。那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。
          else: 12 月 24 日，雨又从棚屋顶上漏下来，接水的盆已经摆到了门口。{staff}抱着两份报告和那本停工的流水账，在学校的办公室外等了一上午，等到管房舍的人出来，当面一页一页翻给他看。那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。
        p3:
          class_medical: 八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}照医护的规矩，在桌前立起一道防护屏，把样品一只只挪到屏后，又给两人各递了一副手套，说这东西伤人不见血。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。
          class_learned: 八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}照实验室的规矩，在桌前立起一道防护屏，把样品挪到屏后，量过离身子多远才稳妥，用粉笔在桌面上画了一条线，又在线边放了两副手套。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。
          else: 八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}把带来的防护屏立在桌前，样品一只只挪到屏后，又把一副手套搁在玛丽常坐的那张凳子上。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。
      excerpts:
        p3: 玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。
        p2: 那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。
        p1: 皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。
    relic: 一管沥青铀矿
    relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
    points:
      p1: 在年末宣读前把还待独立验证的几份记录对齐，护住第二份新元素报告
      p2: 用两次报告为居里争取一间能稳定工作的房间，替以后反复测量保住仪器和记录
      p3: 从这时起让玛丽和皮埃尔隔着防护处理样品，护住他们的手和身体，少受射线
    points_fail:
      p1: 交稿时独立观察与研究记录对不上，年末没有这份报告。事务所因同步失败召回员工。
      p2: 几个人还在临时场地分着用台面，遇到天气坏时又要挪仪器、等场地。
      p3: 他们照旧徒手处理样品，常年的射线落在两人身上。
    shift:
      p1:
        was: 1898 年 12 月 26 日，巴黎科学院报告新的放射性物质，独立光谱观察随同刊出。
      p2:
        was: 1898 年两次报告之后，居里夫妇的后续研究仍在学校的简陋场地进行。
        now: '{staff}把两份成果和停工的记录一并交给愿意协调场地的人。学院为接下来的测量腾出一间可长期使用的房间。'
      p3:
        was: 1934 年 7 月 4 日，玛丽·居里死于再生障碍性贫血，一般认为与她长年受辐射有关。
        now: 从 1898 年起，两人都隔着防护处理样品，多年里受到的辐射少了许多。玛丽后来的身体比历史上好，又多工作了些年。
        who: curie_paris
        bio: 玛丽·居里从 1898 年起在防护下做放射性研究，晚年没有受到那样重的辐射损伤，多工作了些年。
    vignettes:
      shed: 雨从学校院里那间棚屋的顶上漏下来。{staff}在漏处摆了几只盆，水滴进盆里一声一声地响，把一台摆满玻璃器皿的桌子挪开，角落里那只炉子几乎烘不暖屋子。
      borscht: '{staff}在拉丁区一家小馆子吃饭。邻桌两个波兰学生用波兰话争得面红耳赤，面包屑撒了一桌，红菜汤凉了也没顾上喝。老板娘说，这一带的波兰人比塞纳河边的鸽子还多。'
      bookstall: '{staff}在塞纳河边的旧书摊上，从一摞晒褪了色的旧杂志底下翻到一本讲那种能穿过皮肉的新射线的小册子。摊主说，这年头的人，看不见的东西最肯掏钱。'
  freud_vienna:
    name: 一本书的两个年份
    place: 维也纳
    figure: 西格蒙德·弗洛伊德
    story: 1899 年 11 月 4 日，西格蒙德·弗洛伊德的《梦的解析》在维也纳面世，出版商在扉页上印了 1900 年。弗洛伊德后来说，这本书是他对父亲去世的回应。首印六百册，卖了八年才卖完，第二版到 1909 年才出。
    story_prose:
      opening:
        - 1899 年秋，维也纳。西格蒙德·弗洛伊德的《梦的解析》就要由多伊蒂克出版社印出，11 月 4 日面世，扉页上印的却是 1900 年。三年前的 10 月，他的父亲雅各布在维也纳去世；他后来说，这本书是他对父亲之死的回应。
        - 史实里，书出来以后少有人理会，首印六百册卖了约八年才卖完，第二版到 1909 年才出。在这条分支里，内城一家书店有个擦橱窗的店员和一个管订货簿的小伙计，咖啡馆里有个看报的医生。
        - 这一趟用得上几种人：懂医、在同行之间说得上话的人；跑报馆、知道一本书该送到谁手里的人；能言善道、敲得开别人家门的人。
      outcomes:
        p1: 那个冬天，弗洛伊德陆续收到几封来信，信里一页一页地问那本书。书店的订货簿上，那本讲梦的书往下添了几行。
      none: 十二月底下了雪，书店的小伙计翻着订货簿，那本讲梦的书这个月几乎没动。橱窗角上，扉页还翻在印着 1900 年的那一面。
      not_admitted: '{staff}没能进那几位同行的门，只在内城那家书店的橱窗前站了几回。那本讲梦的书摆在角上，扉页翻开着，玻璃上落了一层薄灰。'
      points:
        p1:
          class_medical: 11 月下旬，那本讲梦的新书在橱窗角上躺了快三个礼拜。{staff}以医生的身份，揣着几本书去了几位同行的诊所，每本都在讲梦的那一章夹一张纸条，写明从哪一页读起。那天夜里，内城一户人家的窗子亮到很晚。桌上摊着那本扉页印着 1900 年的书，已经翻过了一大半。
          class_press: 11 月下旬，那本讲梦的新书在橱窗角上躺了快三个礼拜。{staff}照跑报馆的门路，打听出哪几位医生肯给杂志写长评，把书包好，一家一家送上门。那天夜里，内城一户人家的窗子亮到很晚。桌上摊着那本扉页印着 1900 年的书，已经翻过了一大半。
          else: 11 月下旬，那本讲梦的新书在橱窗角上躺了快三个礼拜。{staff}在咖啡馆里坐了几个下午，跟看报的医生们搭上话，把带来的书一本本借了出去，只说读完再还。那天夜里，内城一户人家的窗子亮到很晚。桌上摊着那本扉页印着 1900 年的书，已经翻过了一大半。
      excerpts:
        p1: 那天夜里，内城一户人家的窗子亮到很晚。桌上摊着那本扉页印着 1900 年的书，已经翻过了一大半。
