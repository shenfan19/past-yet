  finlay_havana:
    name: 蚊子与黄热病
    place: 哈瓦那
    figure: 卡洛斯·芬莱
    story: 卡洛斯·芬莱 1881 年在哈瓦那提出黄热病蚊媒传播的假说，论文题目也表明其假说性质。
    story_prose:
      opening:
        - 哈瓦那暑热未退，芬莱将要宣读的稿子放在课桌边，病例笔记另压在一封信下。有人来问文章首行怎么写，预备把它放进议程。芬莱把题目里的「假说」读得很清楚。
        - 1881 年 8 月 14 日，芬莱在哈瓦那科学院宣读黄热病的蚊媒传播假说。广泛采取防蚊行动还在多年以后。这条分支可以先保住宣读，再请留下的院士听明白已有记录支持到哪一步。
        - 擅长核对稿件的人护住议程上的一份。善于组织讨论的人，问院士愿不愿约时间审阅材料，再把公共防蚊的议案交给市里。
      points:
        p1: 书记说还有一页没人看过，不能跟着其余稿子一起送上台。你拿出芬莱核过的目录，把两个纸包按标记分开，才发现那页夹在病例记录的封里。芬莱把该宣读的一份重新合上。轮到他起身时，书记念出的题目和他手里的相同。
        p2: 读毕，最靠门的人已经拿了帽子。你请他听完芬莱一句话，看看哪条记录愿意留下核查。对方坐下来，只问了一处，另一位院士把下一次可来看材料的日期写到空页边。芬莱从桌上把要讨论的那叠抽了出来，等两人都看见才合好。
        p3: 给市里看的纸上原来有一句「已经证实」。你请芬莱把已有观察和下一步要核查的事分成两项，让议事的人知道该答复哪一条。他们同意提前拨给公共防蚊一笔试行经费。书记盖章前，留下原来的「假说」两个字。
      outcomes:
        all: 芬莱读完论文，病例有人回看。市里的公共防蚊工作在这条分支提前开始，仍要看实际成效。
        p1: 科学院听到了这篇论文，宣读稿留在档里。之后是否跟进仍要等院士决定。
        p2: 有几个人留下问了记录，查阅日期也写好了。市里还没有开始行动。
        p3: 公共防蚊的试行议案有了回执。报告只将提早行动写在这条分支。
      none: 会场散了，下一次讨论的日子还是空着。
      not_admitted: 门口只让已经排上议程的人进去。你从外间听到书记报出第一项。
      desync: 宣读稿没有备齐，八月十四日那次会议听不到芬莱的论文。事务所召回员工。
      excerpts:
        p1: 轮到他起身时，书记念出的题目和他手里的相同。
        p2: 芬莱从桌上把要讨论的那叠抽了出来，等两人都看见才合好。
        p3: 书记盖章前，留下原来的「假说」两个字。
    relic: 一片蚊子的玻片标本
    relic_desc: 一片标本，里面有一只蚊子的翅。
    points:
      p1: 黄热病季里护住他的论文稿和病例笔记，让他 8 月 14 日照期在科学院宣读
      p2: 宣读之后，劝几位院士留下来看他的病例，不让论文在一片沉默里被搁下
      p3: 帮他把蚊子和病例整理成能让人信服的证据，让这座城早些年开始防蚊
    points_fail:
      p1: 病例笔记在黄热病季里散失，8 月 14 日没有宣读，这条分支与历史脱了节，员工被送回。
      p2: 会场照旧一片沉默，没有人要看一份病例，这条分支里论文照旧被搁在一边。
      p3: 他的证据照旧单薄，这条分支里这座城照旧又等了二十年才对蚊子动手，在那之前黄热病每年夏天照旧回来。
    shift:
      p1:
        was: 1881 年 8 月 14 日，卡洛斯·芬莱在哈瓦那皇家科学院宣读《作为黄热病传播媒介的蚊子假说》。
      p2:
        was: 1881 年 8 月 14 日的宣读之后，会场一片沉默，这个说法此后多年被人嘲笑。
        now: 那天散会后，有几位院士留了下来，要看他的病例笔记。
      p3:
        was: 1881 年以后，芬莱用了将近二十年去证明蚊子传播黄热病，直到 1900 年美国陆军黄热病委员会用他培育的蚊子做实验，才证实他是对的。
        now: '{staff}帮他把蚊子和病例一一对上，直到证据站得住。这条时间线里哈瓦那早了些年开始防蚊，黄热病也早些离开了这座城，芬莱在自己的年代就被人相信了。'
        who: finlay_havana
        bio: IF 线里，芬莱的蚊媒说法在 1881 年后几年内就被接受，哈瓦那远在 1900 年以前就照着它防蚊。
    vignettes:
      headline: 虚构的编辑把一个推测写成了确定的事。你慢慢念回原题，他在校样交出去前把「假说」两字补回去。
      columns: 编辑把笔记里每一行都照同一种意思念。你划成所见和所推两栏，有一句移到了另一边。
      place: 你核对宣读论文的地点。编辑把地名记在日期旁，后来的报道才不会把会议说成另一场。
  bell_boston:
    name: 把听到的写下来
    place: 波士顿
    figure: 亚历山大·格雷厄姆·贝尔
    story: 亚历山大·格雷厄姆·贝尔的实验笔记记载，1876 年 3 月 10 日在波士顿，托马斯·沃森听懂了贝尔对着发话装置说的话。6 月 25 日，贝尔在费城百年博览会上向评委演示了电话。
    story_prose:
      opening:
        - 波士顿的房门各关一扇。沃森在隔壁按住一侧耳朵等声音，贝尔把手停在桌上，问还要不要再试一句。有人以为已经试完，想收起装置。
        - 1876 年 3 月 10 日，贝尔记录沃森听懂了从另一房间传来的话。同年 6 月，贝尔去费城百年博览会演示。你可以保住那次试验，还可以请同事在他离开前明确学生这边的安排。
        - 懂得看守器材和听辨语句的人先留在房间两头。善于跟教师商议的人再去核贝尔离校几天的课。
      points:
        p1: 沃森从屋里走出来，说听见了。你把预先写好的纸收回桌底，请他把听到的句子从头说一遍。贝尔拿起笔，记下他并不需要再问的话。两人换了位置，门重新关上，这次轮到沃森出声。
        p2: 同事摊开一张排班单，说有人来上课只认得贝尔。贝尔一边读出几位学生该做的练习，一边请下一位老师把空出来的时间填上。你帮他们把改好的那张另外誊给学生家里。装箱前，贝尔把自己的副本和车票收在不同的口袋。
      outcomes:
        all: 三月的听辨记录留在实验簿。费城演示开始时，波士顿的学生仍按事先说好的安排上课。
        p1: 沃森复述了实际听见的话。六月的准备还没有形成能照做的分工。
        p2: 学生这边有了接手的人。三月的笔记缺最后一次确认，事务所只带回了这次排班的记录。
      none: 装置重新躺回台上，隔壁没有一份核过的复述。学生的课表还等人补。
      not_admitted: 两间屋的门都关着。有人从里面应声，但试验台没有为来客腾出位置。
      desync: 史有的试验复述或六月演示缺了一项。行程脱节，事务所发来召回。
      excerpts:
        p1: 两人换了位置，门重新关上，这次轮到沃森出声。
        p2: 装箱前，贝尔把自己的副本和车票收在不同的口袋。
    relic: 一只电话听筒
    relic_desc: 一个木制听筒，里面有一片薄薄的振膜。
    points:
      p1: 把波士顿的装置多留一轮，请隔壁的沃森复述他实际听到的话
      p2: 趁贝尔还在波士顿，请他和同事定下离校参展几天里学生的事怎么安排
    points_fail:
      p1: 沃森还没来得及确认听见了什么，装置就收回桌上。三月的试验脱节，事务所召回{staff}。
      p2: 贝尔留在波士顿照管学生的事。展会演示脱节，事务所召回{staff}。
    shift:
      p1:
        was: 1876 年 3 月 10 日，贝尔在波士顿用实验装置把一句完整清楚的话传给了隔壁的沃森。
      p2:
        was: 1876 年 6 月 25 日，贝尔在费城把电话演示给百年博览会的评委，其中有佩德罗二世和威廉·汤姆森。
    vignettes:
      blind: 接听的帮工想先看试句。你把纸折起来，请他只写实际听见的。传过来两个完整的词，最后一个留了空。你把这张纸条带回去，收队时又一轮刚要开始。
      future: 你告诉帮工，后人会记住这天传过来的一句话。他猜只要留下说话那端写的句子就够了。你摊开两张纸条，一张给说话人，一张给听话人。眼下这趟究竟漏了哪儿，还得靠这两张对出来。
      door: 你把接听那张折好的条子带过门，这才摊到试句旁。听漏的词依旧空着，听对的两个总算有了记录。你带回对照表，下一句没有听到。
  budj_bim_eels:
    name: 水曾经到过哪块黑石
    place: 澳大利亚维多利亚州布吉比姆
    figure: 贡迪玛拉人
    story: 贡迪特马拉人介绍布吉比姆文化景观时，记述他们长期利用火山岩修渠筑堰、调节水流，其中包括管理短鳍鳗 kooyang。
    relic: 一只编织的鳗鱼笼
    relic_desc: 一只长筐，口像漏斗。
    points:
      p1: 沿练习水道朝向稳住草图
      p2: 辨出湿痕，别把它当成眼下的水位
      p3: 与帮工约好一个能再复看的位置
    vignettes:
      level: 帮工圈了一道湿痕，说水现在就到那儿。你蹲到一片还在漂的叶子旁，在第一记下头再画一记。图里既留着旧痕，也留着眼下流到哪里。等水再涨到旧痕，你早已走了。
      return: 你知道后世仍会把这些水道连起来看。帮工只够留一个记号，你们挑了弯边一块黑石，约定下回从同一处看。你带走这处站位，下场雨后的那笔还写不出。
      bend: 你画到水转弯看不见的地方，就把线停在那里。帮工留下余纸，等以后再走。你带回水道的一处弯，全程还留在图外。
  galois_paris:
    name: 决斗前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽罗瓦
    story: 1832 年 4 月 29 日，埃瓦里斯特·伽罗瓦在巴黎获释出狱。5 月 29 日夜里，他给朋友奥古斯特·舍瓦利耶写信，概述自己关于哪些方程能用根式求解的发现，托他把信刊出。第二天清晨，他在决斗中腹部中枪，被丢在原地，5 月 31 日死在科钦医院，年仅二十岁。那年九月，舍瓦利耶刊出了这封信。十四年后，约瑟夫·刘维尔刊出了他的论文。
    story_prose:
      opening:
        - 1832 年 5 月，巴黎。二十岁的埃瓦里斯特·伽罗瓦一个月前刚获释出狱。他在少年时就找到了方程能否用根式求解的条件，这套想法后来开出了群论，可那时几乎没人读懂。
        - 史实里，5 月 29 日夜里他给朋友奥古斯特·舍瓦利耶写信，概述自己的发现，托他把信刊出；第二天清晨他在决斗中腹部中枪，被丢在原地，5 月 31 日死在科钦医院。那年九月信刊了出来，他的论文要到十四年后才由刘维尔刊行。在这条分支里，他住处有个借给他墨水的看门老妇人，科钦医院门口有个送了十年柴的车夫，印坊里有个抱怨等号不够用的排字工。
        - 这一趟用得上几种人：管过档案、做过翻译或校对的人，或者有条理、熬得住夜的人，守得住那封信和那些稿子；懂医护、带对了急救包或药的人，赶得上那天清晨；管过档案、做过翻译、又说得动编辑的人，让后来的人读得到下文。
      outcomes:
        all: 伽罗瓦活了下来。那年九月，信和一页索引一起刊了出来，有人照着页码来借稿子。舍瓦利耶把他们问的页码抄成一张单子，伽罗瓦坐在桌边，一条一条往下答。
        p3: 伽罗瓦在医院里躺到六月才下床。那年夏天，他又坐回桌前，桌上摊着那封信的草稿，页边那行字还在。
        p2: 九月以后，读到这封信的人可以照着索引借看抄本，问题连着页码寄回舍瓦利耶手里。1846 年，刘维尔刊出了他的论文。
        p1: 那年九月，舍瓦利耶把 5 月 29 日那封信刊在《百科评论》上。十四年后，刘维尔刊出了他的论文。
      none: 6 月 2 日，伽罗瓦葬进蒙帕纳斯公墓的公共墓穴。看门的老妇人把他借去的那瓶墨水收了回来，在账本上划掉了一行。
      desync: 5 月 29 日深夜，那封信和信里提到的稿子散在桌子两头，没有人包起来。{staff}被召回时，蜡烛烧到了底，蜡油淌在一页稿纸的边上。
      not_admitted: '{staff}没能进那栋楼，只在街角站过几个晚上。楼上有一扇窗的灯一直亮到天快亮，有一回窗开了，一张揉皱的纸落在石板路上。'
      points:
        p1:
          class_lettered: 5 月 29 日夜里，桌上摊满了稿纸，那封写给舍瓦利耶的信写了一页又一页，信里提到的论文压在几本书底下。{staff}跟纸和字打惯了交道，趁他还醒着，一页页递给他核过，把信单独折好，论文按他报的顺序另捆一包，两包分别写上收件人，等天亮托人送去给舍瓦利耶。天快亮时，伽罗瓦在一页稿纸的边上匆匆添了一行字，把笔搁下。桌上两个纸包并排放着，上面那个写着舍瓦利耶的名字。
          else: 5 月 29 日夜里，桌上摊满了稿纸，那封写给舍瓦利耶的信写了一页又一页，信里提到的论文压在几本书底下。{staff}做事有条理，熬得住夜，守在桌边，他写完一页就收一页，把信单独折好，论文按他报的顺序另捆一包，两包分别写上收件人，等天亮托人送去给舍瓦利耶。天快亮时，伽罗瓦在一页稿纸的边上匆匆添了一行字，把笔搁下。桌上两个纸包并排放着，上面那个写着舍瓦利耶的名字。
        p3:
          class_medical: 5 月 30 日清晨，枪声过后，城外那片空地上只剩他一个人躺在草里，旁边的人都走了。{staff}懂医护，几分钟内赶到，跪下来用纱布压住他腹部的伤口，压了很久才止住血，又用带来的药防着伤口发炎，拦下一辆路过的车，把他送到医生手里。几天后，他在病床上醒过来，伸手要纸。护士给了他半张，他把纸翻过来，在背面写起了算式。
          else: 5 月 30 日清晨，枪声过后，城外那片空地上只剩他一个人躺在草里，旁边的人都走了。{staff}几分钟内赶到，打开带来的纳米医疗箱，照着说明给他止住了血，又防着伤口发炎，拦下一辆路过的车，把他送到医生手里。几天后，他在病床上醒过来，伸手要纸。护士给了他半张，他把纸翻过来，在背面写起了算式。
        p2:
          class_lettered: 九月，那一期《百科评论》在小印坊里排版，排字工嘀咕着又去隔壁字盘借等号。{staff}管惯了文书，把舍瓦利耶手里的稿子按页编了号，抄成一页索引，请编辑排在信的后面，又写信约好一位愿意逐页读下去的数学同行。印好的那一期摆在印坊的窗台上，信后面多了一页索引，一行一个页码。舍瓦利耶拿起一本，用指头顺着那一列页码往下数。
          else: 九月，那一期《百科评论》在小印坊里排版，排字工嘀咕着又去隔壁字盘借等号。{staff}做事有条理，话也说得动人，坐在编辑桌前，把舍瓦利耶手里的稿子一页页报给他听，说动他在信后面添一页索引，又约好一位愿意逐页读下去的数学同行。印好的那一期摆在印坊的窗台上，信后面多了一页索引，一行一个页码。舍瓦利耶拿起一本，用指头顺着那一列页码往下数。
      excerpts:
        p3: 几天后，他在病床上醒过来，伸手要纸。护士给了他半张，他把纸翻过来，在背面写起了算式。
        p2: 印好的那一期摆在印坊的窗台上，信后面多了一页索引，一行一个页码。舍瓦利耶拿起一本，用指头顺着那一列页码往下数。
        p1: 天快亮时，伽罗瓦在一页稿纸的边上匆匆添了一行字，把笔搁下。桌上两个纸包并排放着，上面那个写着舍瓦利耶的名字。
    relic: 一封匆忙写就的信
    relic_desc: 写满算式的信页，页边写着没有时间了。
    points:
      p1: 5 月 29 日夜里趁伽罗瓦还能逐页核对，把写给舍瓦利耶的信和信中提到的论文分别包好，送到收信人手上
      p2: 趁九月刊信，请编辑一并刊出手稿索引，约一位能逐页核查的数学同行先读留存稿
      p3: 5 月 30 日清晨决斗以后，立刻把伽罗瓦送到医生手里，救下中了腹部一枪的他
    points_fail:
      p1: 约定的交接一再推迟，信与待寄的草稿被分开。舍瓦利耶收不到 5 月 29 日的信，事务所因同步失败召回员工。
      p2: 九月的刊物只有信件。愿意往下核对的人仍须先找到保管手稿的朋友。
      p3: 他中枪后被丢在原地，直到有路人发现，5 月 31 日死在科钦医院，年仅二十岁。这条分支里此后没有伽罗瓦。
    shift:
      p1:
        was: 伽罗瓦 1832 年 5 月 29 日写信给奥古斯特·舍瓦利耶，概述研究，并托他处理稿件和刊出书信。
      p2:
        was: 信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交给刘维尔，刘维尔于 1846 年刊行。
        now: 九月读到这封信的同行可以按刊出的索引申请借看一份抄本。所提问题和对应页码回到舍瓦利耶手中，给下一轮审阅留下记录。
      p3:
        was: 1832 年 5 月 30 日，伽罗瓦在决斗中腹部中枪，被丢在原地；5 月 31 日他死在科钦医院，年仅二十岁。
        now: '{staff}几分钟内赶到，止住了血，又没让伤口感染。伽罗瓦活了下来，回到数学上，亲自向那些没读懂他的数学家讲清自己的理论。'
        who: galois_paris
        bio: 伽罗瓦挺过了 1832 年 5 月的决斗。他在巴黎继续做数学，生前就看到自己关于方程的理论被人读懂、讨论。
    vignettes:
      candle: 5 月 29 日夜里，{staff}替看门的老妇人往楼上送第二支蜡烛，楼梯窄，烛火被风压得一歪一歪。她嘟囔说，这位年轻先生的灯从天黑亮到现在，墨水也是从她这儿借的，回头得记进账里。
      cart: 5 月 31 日，{staff}在科钦医院门口帮一个车夫卸柴，柴上还带着露水。车夫说，昨天抬进去一个年轻人，今早就盖上了布。他往这儿送了十年柴，最受不了的就是这种天气好的早上。
      type: 夏末，{staff}在一家小印坊里帮着捡撒了一地的铅字，指头上沾满了油墨。排字工抱怨这一期有封信满纸算式，等号得一个个从隔壁字盘里借。
  van_gogh_auvers:
    name: 奥维尔的夏天
    place: 奥维尔
    figure: 文森特·梵高
    story: 1890 年 5 月 20 日，文森特·梵高来到瓦兹河畔奥维尔，住进拉武客栈，常去看保罗·加歇医生。他几乎一天画一幅。约 7 月 10 日的一封信里，他写到不安的天空下大片的麦田。7 月 27 日，他朝自己胸口开了一枪，7 月 29 日去世，弟弟提奥在他身边。
    story_prose:
      opening:
        - 1890 年夏，瓦兹河畔奥维尔。梵高住在拉武客栈，几乎天天画。七月的一封信里，他写到不安天空下大片的麦田。
        - 史实里，他为弟弟一家的生计担忧，七月底在奥维尔去世。在这条分支里，麦田和客栈之间那条路上，还有人能扶一下画布，也有人能听他说完。
        - 这一趟用得上能在阵风里看住画架的人，也需要能把账说清楚、能好好听人说话的人。懂得照护的人还能在客栈陪一阵。
      points:
        p1: 麦田里风压着画布。{staff}赶到画架旁，踩实松动的架脚，把迎风的角扶稳，等梵高落下最后几笔。深处的麦子先伏下去，近处还在动。梵高松开画笔时，画布下缘还离地半寸。
        p2: '{staff}和他把来信摊开，从提奥眼下的工作说到家里的花用，逐条把能问清的写在纸边。梵高把那张纸折回信封里。装进去之前，他用手把翘起的封口抚了一遍。'
        p3: '{staff}把他画过的几片麦田一张张摊开，说以后会有人专程走进画馆，看这些地和天。梵高把最靠外的一张移回桌子中间。天色暗下去时，那一线黄还亮着。'
        p4: '{staff}在客栈陪他熬过最难的几天，照应休息和日常起居，等到他自己愿意把窗推开。客栈女孩把托盘搁在门边。梵高伸手接住，往旁边挪出一个摆颜料的位置。'
      outcomes:
        all: 夏天过去以后，麦田也有了别的颜色。客栈门边还晾着几张纸，写过的信夹在最底下。
        p4: 秋天，客栈的人仍能看见他把画具拎出门。门开的时候，一管颜料从兜里露出锡色的一头。
        p3: 后来有人在画馆里停在那几片麦田前。再走近一步，画上的黄几乎挨到眼前。
        p2: 那封谈家计的信后来留在客栈桌上。展开时，从最浅的一道折痕旁还看得见一行小字。
        p1: 麦田留在那幅画里。后来有人把画举到窗边，看见油彩在地平线上有厚薄两层。
      none: 客栈楼道响过一阵脚步。门边的托盘推回去时，杯里的水还平着。
      not_admitted: '{staff}没能在客栈留下。小路尽头看得见一截麦田，往前的路却被屋角挡住。'
      desync: 画架侧倒在麦田里。{staff}被召回时，挂在一条架腿上的麦穗还在风里点头。
      excerpts:
        p4: 客栈女孩把托盘搁在门边。梵高伸手接住，往旁边挪出一个摆颜料的位置。
        p3: 梵高把最靠外的一张移回桌子中间。天色暗下去时，那一线黄还亮着。
        p2: 梵高把那张纸折回信封里。装进去之前，他用手把翘起的封口抚了一遍。
        p1: 深处的麦子先伏下去，近处还在动。梵高松开画笔时，画布下缘还离地半寸。
    relic: 一管铬黄颜料
    relic_desc: 一支挤瘪的锡管，里面是他画麦田用的那种黄。
    points:
      p1: 暴风雨般的天空下，帮他把那幅麦田画完，不让画布倒进麦田
      p2: 从巴黎回来以后，帮他把提奥一家的钱和生计问清、说开，不让那场风暴压在他身上
      p3: 让他知道自己的画会被记住
      p4: 7 月 27 日之前，治好他的身体和心病，让他活下来
    points_fail:
      p1: 那幅画在风里倒进了麦田，这条分支里没有《麦田上空的乌云》。
      p2: 他从巴黎回来，照旧觉得那场威胁提奥的风暴也压在自己身上，这条分支里没有人帮他把钱的事理清。
      p3: 他照旧觉得自己的画是提奥的负担，这条分支里没有人告诉过他这些麦田后来的去处。
      p4: 7 月 27 日照史实发生，这条分支里他没能多画一个季节。
    shift:
      p1:
        was: 1890 年 7 月初，梵高在不安的天空下画成了大片的麦田，7 月 10 日前后写信给提奥和乔说起它。
      p2:
        was: 1890 年 7 月初，梵高去巴黎看提奥一家，得知提奥想辞去做了多年的画廊职位、自己开业；回奥维尔后他写信说，那场威胁提奥的风暴也压在自己身上。
        now: 他从巴黎回来时已经知道提奥家撑得住，回到麦田里画画时，心上少压了一件事。
      p3:
        was: 1890 年 7 月，梵高在信里说觉得自己是个失败者，看不到好的前途；他生前卖出的画很少。
        now: 有人告诉过他，这些麦田以后会挂在博物馆的墙上，有很多人专程去看。
      p4:
        was: 1890 年 7 月 27 日他受了枪伤，两天后在奥维尔去世，只画了大约十年。
        now: '{staff}陪他过了那个七月，病没有再把他压垮，那个夏天过去时他还在拉武客栈。他又画了几年，麦田之后还有别的季节。'
    vignettes:
      sky: '{staff}在本子上画同一片田，一张窄窄地留着天，另一张把天留得多。再并在一起看，第二张才看得见云底的暗。'
      wind: '{staff}等风吹过麦田，看着暗影从这头走到那头。本子上的第一笔还留着。'
      path: '{staff}走到看得见小路尽头的地方。回来时，鞋边沾了两根细小的麦芒。'
  abel_froland:
    name: 一道算得出的五次方程
    place: 弗罗兰
    figure: 尼尔斯·亨里克·阿贝尔
    story: 1828 年圣诞，尼尔斯·亨里克·阿贝尔受着寒、咳着嗽坐雪橇来到弗罗兰铁厂看望未婚妻，此后在那里卧床十二周。1829 年 1 月 6 日，他写下最后一篇论文，两三页，重述他交给巴黎科学院的那篇长稿的要点。4 月 6 日，他死于肺结核，二十六岁。两天后，尚不知情的奥古斯特·利奥波德·克雷勒从柏林来信，说替他谋的职位已经落实。
    story_prose:
      opening:
        - 1829 年 1 月，挪威南部的弗罗兰铁厂。尼尔斯·亨里克·阿贝尔在未婚妻做家庭教师的那户人家里卧床，咳得厉害。他二十六岁，几年前已经证明一般五次方程不能用根式求解，1826 年交给巴黎科学院的长稿却一直没有下落。
        - 史实里，他圣诞坐雪橇来时就已受寒，此后在这里卧床十二周，1 月 6 日写下最后一篇两三页的短稿。4 月 6 日他死于肺结核。两天后，克雷勒从柏林来信，说替他谋的职位已经落实。在这条分支里，楼下的厨房女佣整夜听着楼上的咳嗽，铁厂的账房照旧每天分拣邮包。
        - 这一趟用得上三种人：核得了推导、理得清稿件和收件记录的人，懂护理、守得住病床的人，说得动远方的朋友、肯替他把信催回来的人。
      outcomes:
        all: 四月，柏林确认职位的信写成时，阿贝尔已经不在了。三月那封回信压在他的枕头底下，屋里的炉火还没熄。
        p4: 四月，柏林写来确认职位的信时，阿贝尔已经不在了。三月那封回信，还压在他的枕头底下。
        p3: 弗罗兰那间屋子的炉火，一直烧到了四月。
        p2: 很多年后，有人去巴黎找那篇长稿，翻到短稿页脚那行小字，从那一年的收件簿翻起。
        p1: 那篇两三页的短稿寄了出去。信封上的字，是他自己写的。
      none: 弗罗兰的冬天很长。窗外的雪一直没化，楼上的人咳了一夜又一夜。
      desync: 1 月 6 日，那篇短稿停在校对之前，{staff}被召回了。楼上的咳嗽声还在，两三页纸摊在被面上，墨还没干。
      not_admitted: '{staff}没能进那户人家的门。楼上的人还在咳，柏林的消息还在路上。'
      points:
        p1: 1 月 6 日，阿贝尔靠在枕头上写那篇短稿，两三页纸摊在被面上。{staff}拿着笔一行一行跟着核推导，前后记号对不上的地方逐处标出来，他一处一处改。傍晚，稿子誊清了，被面上落着几点墨。他把三页纸理齐，用手掌压了压，才交出去。
        p2: 短稿还在手边。{staff}把它同巴黎长稿的投递日期对在一处，在两份抄件的页脚各记了一行小字：哪一年交的件，交给了谁，题目叫什么。墨迹很淡，挤在页边，到天黑才干透。两份抄件，一份夹进了短稿，一份留在他的稿夹里。
        p3: 一月底最冷的那些夜里，阿贝尔咳得睡不着。{staff}守着炉子添柴，把床铺焐暖，替他垫高枕头、擦汗、喂水。有一夜窗玻璃上结满了冰花，屋里的炉火一直没断。天快亮时，他咳完一阵，又睡着了。
        p4:
          class_lettered: '{staff}照理来往信件的办法，把柏林那边替他奔走的人和事一条条列清，按人写信，请他们先把进展寄回弗罗兰，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。'
          else: '{staff}一封接一封往柏林写信，说他病得重，请替他奔走的朋友先把进展寄来，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。'
      excerpts:
        p4: 信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。
        p3: 有一夜窗玻璃上结满了冰花，屋里的炉火一直没断。天快亮时，他咳完一阵，又睡着了。
        p2: 墨迹很淡，挤在页边，到天黑才干透。两份抄件，一份夹进了短稿，一份留在他的稿夹里。
        p1: 傍晚，稿子誊清了，被面上落着几点墨。他把三页纸理齐，用手掌压了压，才交出去。
    relic: 一封封着的信
    relic_desc: 一封没拆开的聘书，用细线系着。
    points:
      p1: 在阿贝尔病中写最后一篇短稿时，帮他把证明核对到可以寄出
      p2: 趁短稿还在手边，帮阿贝尔把它同巴黎长稿的投递记录对上，给找稿的人留下索引
      p3: 阿贝尔在弗罗兰卧床的十二周里，替他挡住屋里的冷，减轻他的咳嗽和病痛
      p4: 请替阿贝尔奔走的人先寄一封进展信，让他生前知道柏林还有人为他的职位努力
    points_fail:
      p1: 短稿停在校对之前，巴黎长稿的要点也没有这份及时的公开记录。行程同步失败，员工被召回。
      p2: 寻找巴黎长稿的人只知道大致题目，仍要从旧收件记录一页页找。
      p3: 冷和咳嗽没人减轻，这条分支里他在弗罗兰的最后几周和原来一样难熬。
      p4: 弗罗兰一直等不到柏林的消息，正式的好消息来得太晚。
    shift:
      p1:
        was: 1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学短稿，重述巴黎长稿的主要结果。
      p2:
        was: 1829 年前后，阿贝尔重述巴黎长稿的要点，原稿一度难寻，直到 1841 年才印行。
        now: '{staff}把短稿和旧投递日期对在一处，两边各留一份索引。以后查稿的人能凭交件记录缩小范围。'
      p3:
        was: 1828 年圣诞，阿贝尔受着寒、咳着嗽坐雪橇到弗罗兰，随后开始咳血，此后在那里卧床十二周。
        now: '{staff}守着炉火，把床铺焐暖，最难熬的几夜一直坐在床边。阿贝尔最后几周少受了些罪。'
      p4:
        was: 1829 年 4 月 6 日阿贝尔去世，柏林确认职位的信于两日后写成。
        now: '{staff}请联系人先把奔走过程写回弗罗兰。阿贝尔读到朋友们正在为他争取职位，知道这件事还有人在做。'
        who: abel_froland
        bio: 阿贝尔去世前收到柏林朋友奔走的进展，知道他们还为他留着继续研究的机会。正式任命仍在他去世之后。
    vignettes:
      firewood: 二月最冷的那几天，{staff}帮厨房女佣往楼上搬劈柴。柴捆上的雪一路掉在楼梯上。女佣说，楼上那位先生咳一夜，她就在楼下数一夜，数到天亮也没数清。
      sledge: 一月，{staff}帮马夫给雪橇换一根断了的辕木。马在棚里喷着白气。马夫说圣诞那趟从城里接来一位先生，裹着三层毯子一路咳，下车时连自己的箱子都提不动，是他扛上楼的，赏钱他没要。
      post: 四月，{staff}帮铁厂的账房先生分拣邮包。桌上的信摞了半尺高，各地的邮戳挤在一起。他翻出一封盖着柏林邮戳的信，对着窗户看了半天，说这一封来得不巧，收信的人已经不在了。
  riemann_selasca:
    name: 最后一篇论文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 1862 年，伯恩哈德·黎曼病倒，此后患肺结核，几次南下意大利养病。1866 年 6 月，他第三次来，住进马焦雷湖畔的塞拉斯卡。7 月 19 日，他在无花果树下休息，仍在写最后一篇论文，没有写完。第二天，他在那里去世，三十九岁。十年后，他的全集出版，理查德·戴德金参与了编订。
    story_prose:
      opening:
        - 1866 年 6 月，意大利北部的马焦雷湖畔。三十九岁的数学家伯恩哈德·黎曼第三次南下养病，住进湖边的塞拉斯卡。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，这时他患肺结核已近四年。
        - 史实里，7 月 19 日他躺在无花果树下休息，仍在写最后一篇论文，没有写完；第二天他死在那里。十年后，他的全集由海因里希·韦伯编订、理查德·戴德金参与出版。在这条分支里，房东有个小女儿，每天替他捡树下的落果，湖上有个只好教老婆划桨的船夫。
        - 这一趟用得上几种人：教过大学、做过建模或校对的人，或者有学问、耐得住性子的人，跟得上他口述的公式；懂医护、带着纳米医疗箱的人，治得了那个时代治不好的病。
      outcomes:
        all: 那年秋天，黎曼回到哥廷根，又上起了课。他带回去的稿子里，最后那篇多了几页，是在无花果树下口述的。
        p2: 那年秋天，黎曼回到北边的哥廷根。临走那天早上，他在无花果树下的椅子上坐了一会儿，把一页稿纸折好，放进了外衣口袋。
        p1: 最后那篇论文多写了几页，用的是他自己的话。十年后全集出版，这几页随那篇论文一起印了出来。
      none: 7 月 20 日，黎曼在塞拉斯卡去世。无花果树下的椅子空着，椅面上落了两个果子，没有人去捡。
      not_admitted: '{staff}没能进那户人家，只在帕兰扎码头帮人卸过几回货。从湖上望过去，塞拉斯卡那边有一棵很大的无花果树，树底下摆着一把椅子。'
      points:
        p1:
          class_learned: 7 月 13 日下午，黎曼坐在无花果树下的椅子里，稿纸摊在膝头，写几行就要停下来咳一阵。{staff}教过大学，搬一张小凳坐在他旁边，他说一句，就照着记一句，公式里的指标一个也没记错，记完的稿页按页码压在一块石头底下。傍晚起了风，黎曼伸手把最上面那一页抽出来，凑到眼前看了很久。他把它放回去，又用那块石头压好。
          class_lettered: 7 月 13 日下午，黎曼坐在无花果树下的椅子里，稿纸摊在膝头，写几行就要停下来咳一阵。{staff}做过校对，搬一张小凳坐在他旁边，他说一句，就照着记一句，记完一页再念给他听一遍，稿页按页码压在一块石头底下。傍晚起了风，黎曼伸手把最上面那一页抽出来，凑到眼前看了很久。他把它放回去，又用那块石头压好。
          else: 7 月 13 日下午，黎曼坐在无花果树下的椅子里，稿纸摊在膝头，写几行就要停下来咳一阵。{staff}读过不少书，也耐得住性子，搬一张小凳坐在他旁边，他说一句，就照着记一句，他咳的时候就停笔等着，稿页按页码压在一块石头底下。傍晚起了风，黎曼伸手把最上面那一页抽出来，凑到眼前看了很久。他把它放回去，又用那块石头压好。
        p2: 7 月 17 日夜里，黎曼咳得坐不起来，房东的小女儿端着灯站在门口，不敢进去。{staff}懂医护，打开带来的纳米医疗箱，照着说明给他用上，守在床边，隔一阵摸一回他的额头。天亮时他睡着了，呼吸长了一些。三天后的早上，他自己走到无花果树下，在椅子上坐了一会儿。他弯腰拾起脚边一个落下的无花果，放在了稿纸旁边。
      excerpts:
        p2: 三天后的早上，他自己走到无花果树下，在椅子上坐了一会儿。他弯腰拾起脚边一个落下的无花果，放在了稿纸旁边。
        p1: 傍晚起了风，黎曼伸手把最上面那一页抽出来，凑到眼前看了很久。他把它放回去，又用那块石头压好。
    relic: 一页笔记
    relic_desc: 一页写着没完成公式的纸，字很小。
    points:
      p1: 他在塞拉斯卡力气一天天衰下去时，替他记下口述、理好稿页，帮他把最后那篇论文往下写一段
      p2: 治好拖垮他的肺结核，救下黎曼
    points_fail:
      p1: 最后那篇论文照史实停在原处。
      p2: 他照史实在 7 月 20 日死在塞拉斯卡，这条分支里也没能留住他。
    shift:
      p1:
        was: 皇家学会悼文和戴德金的记述都说，去世前一天他在塞拉斯卡的无花果树下休息，仍在写最后那篇论文，论文没有写完。
        now: 最后那篇论文用他自己的话多写了几页，后来连同这几页一起印出。
      p2:
        was: 1866 年 7 月 20 日，黎曼在马焦雷湖畔的塞拉斯卡死于肺结核，三十九岁。
        now: '{staff}带去的药治好了从 1862 年起拖着他的病。那年秋天他回到北边，又在哥廷根上起了课。'
        who: riemann_selasca
        bio: 这条时间线里，黎曼在 1866 年夏天治好了肺结核。他回到哥廷根，又工作了许多年。
    vignettes:
      figs: 7 月 18 日傍晚，湖面上起了一层薄雾，{staff}帮房东的小女儿把无花果树下的落果捡干净。她说树下那把椅子是给德国先生摆的，漏掉一个，他的稿纸就要染成紫的。
      boat: 七月初，{staff}帮湖上的船夫把一船柠檬卸到帕兰扎码头，筐底的柠檬压破了几个，满码头都是酸味。船夫说今年夏天湖上的船少了一半，年轻人都被叫去当兵了，他只好教老婆划桨。
      chair: 八月，{staff}帮房东把无花果树下那把椅子搬进屋，椅背上还留着一块晒褪了色的印子。房东用袖子擦了又擦，说这树从没结过今年这么多的果子，树底下却没人坐了。
      harvest: 八月，{staff}帮房东把无花果一个个摘下来，摊进扁筐，准备送去因特拉的集市，指头上沾满了白色的果浆。房东说这树从没结过今年这么多的果子，晒裂了口的那些挑出来，摆在窗台上留给家里吃。
  du_chatelet_luneville:
    name: 法语版牛顿
    place: 吕内维尔
    figure: 埃米莉·杜·夏特莱
    story: 1749 年夏，埃米莉·杜·夏特莱住在吕内维尔斯坦尼斯瓦夫的宫廷里待产，手上是快要完成的牛顿《原理》法译和评注。9 月 4 日，她生下一个女儿。9 月 10 日，她去世，四十二岁，死因一说产褥热，一说肺栓塞。同一天，巴黎的王家图书馆为她寄存的三包评注稿签了收据。1759 年，法译全本出版。
    story_prose:
      opening:
        - 1749 年，吕内维尔。杜·夏特莱快要生产了，桌上还有牛顿《原理》的译稿。她把这部拉丁文著作译成法文，还在自己的评注里解释推导。后来的法国读者翻开牛顿，会同时读到她是怎样算明白的。
        - 史实里，她生下女儿六天后去世。那天，巴黎的王家图书馆给三包评注稿开了收据。稿子保住了，十年后出了全本，她连一本印好的书也没见到。
        - 这一趟用得上两种人：懂文稿的人帮得上译稿，懂医护、带对了药械的人能守在产房外。
      outcomes:
        all: 那年秋天，吕内维尔的书桌上又摊开了牛顿。校样一页页送来，她一页页看过，页边留着她自己的笔迹。
        p3: 那年秋天，她回到书桌前。校样送来的时候，有疑问的那页不必托人转问，直接摊在她手边。
        p2: 十年后，克莱罗拆开稿件，那张签了名的纸还夹在原处。哪几行照她的原译印，他照着纸上一处一处办。
        p1: 王家图书馆的收据上，写着她的名字和三包稿子的件数。开出收据的那天，是 9 月 10 日。
      none: 九月的吕内维尔，那张书桌收拾干净了。桌角那只墨水瓶还没盖上。
      desync: 到了该交稿的时候，评注稿仍留在宅邸。寄存手续接不上，事务所先把{staff}召了回来。走的时候，三包稿子还捆在书桌底下。
      not_admitted: '{staff}没能走到那张书桌旁。隔着窗能看见桌上的稿子一摞一摞堆着，灯一直亮到很晚。'
      points:
        p1: 发运前，{staff}把三包评注逐包登记，按清单又核了一遍。最后一包的绳结系紧时，桌上只剩她写给王家图书馆的那封信，墨迹已经干了。
        p2: 两份草稿摊在一起，改动挨得很近。她用笔尖点着纸，一处一处说，{staff}一处一处记在另一张纸上。记完，她把那张纸拿过去看了一遍，在右下角签了自己的名字。
        p3: 产后几天，她的情形急转直下。{staff}打开带来的药箱守在床边，按钟点量体温、喂药，夜里一直留着一盏灯。生下女儿后的第六天过去了，杜·夏特莱还活着。秋天，印坊把校样送来。她翻到正文挤着评注的那页，把纸往近处拉了拉，拿起笔，在印坏的一行下面画了一道。
      excerpts:
        p3: 秋天，印坊把校样送来。她翻到正文挤着评注的那页，把纸往近处拉了拉，拿起笔，在印坏的一行下面画了一道。
        p2: 她用笔尖点着纸，一处一处说，{staff}一处一处记在另一张纸上。记完，她把那张纸拿过去看了一遍，在右下角签了自己的名字。
        p1: 发运前，{staff}把三包评注逐包登记，按清单又核了一遍。最后一包的绳结系紧时，桌上只剩她写给王家图书馆的那封信，墨迹已经干了。
    relic: 一只墨水瓶
    relic_desc: 一只小墨水瓶，来自一张通宵写字的书桌。
    points:
      p1: 在吕内维尔把三包评注稿逐包登记，连同她写给王家图书馆的请求交运
