  hypatia_alexandria:
    name: 那年三月的亚历山大
    place: 亚历山大
    figure: 希帕提娅
    story: 415 年初，希帕提娅仍在亚历山大讲授数学与哲学，城里的官员也来听她讲。城中长官与另一股势力的积怨一周比一周深，她因与长官往来，被卷进了这场争执。
    story_prose:
      opening:
        - 亚历山大港的早课刚散，有个学生把画着刻度的木片留在桌上。他问希帕提娅，明天还到这一间吗。街上传的话已经变了，她本来打算像往常一样来讲课。
        - 史实里，415 年三月希帕提娅在亚历山大遇害。晚古代记述同时留下她公开讲授哲学的声名。这条分支可以请她暂别平常的行程，先到愿留她住的人家。
        - 能听懂学生顾虑并与老师谈成安排的员工有用。新的会面点要让她自己同意，再把归还借书的事托付给人。
      points:
        p1: 希帕提娅先问谁还没拿到答应借读的书。你请她挑出一个能代为交接的人，然后把一位朋友愿让她借住的消息说清。她把没讲完的题目写到木片背面，交给还站在桌边的学生。那天晚些时候，借出去的书仍有人送还，老师已经到了朋友家。
      outcomes:
        all: 朋友屋里有人请她接着讲那道未完的题。这个分支的三月留下了她讲课的记录。
        p1: 她同意改动那天的行程，到了愿意把门打开的朋友家。原来的讲桌暂时空着。
      none: 几天后，学生来还刻度板，听到希帕提娅已经遇害。他把木片放在最后一次听课的位置。
      not_admitted: 学生收好借书人的名单。他没有在名单上找到来客，教室关门后，木片仍在桌上。
      excerpts:
        p1: 那天晚些时候，借出去的书仍有人送还，老师已经到了朋友家。
