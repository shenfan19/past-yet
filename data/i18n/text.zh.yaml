    vignettes:
      stairs: '{staff}数了从门口到房间的台阶，好知道托盘端上去时还热不热，把数字记在买菜单的边上。楼梯拐角那盏灯还没点。'
      window: '{staff}把窗推开一道缝，让广场上泉水的声音进来，窗帘跟着动了一下。屋里没人说什么，也没人去关。'
      fountain: '{staff}在台阶脚下那座船形泉边打水，罐口溢出的水溅湿了鞋面。一位编出来的卖花人问，这栋楼里是谁病了，把一束紫罗兰半价卖了。'
  vermeer_delft:
    name: 负债的画家
    place: 代尔夫特
    figure: 约翰内斯·维米尔
    story: 1672 年战事以后，约翰内斯·维米尔的画几乎卖不出去，1675 年 7 月他去阿姆斯特丹借了一千荷兰盾。据他的遗孀后来陈述，那年 12 月他在一天半里由好好的人到了去世；12 月 15 日他葬在代尔夫特，四十三岁，留下十一个孩子。1676 年初，卡塔琳娜·博尔内斯把他的两幅画交给面包商抵面包钱，2 月 24 日又把《绘画艺术》转到母亲玛丽亚·廷斯名下。2 月 29 日，公证人来家里清点遗产；4 月，她请求高等法院免去她的债务。
    story_prose:
      opening:
        - 1675 年 12 月初，代尔夫特老朗恩代克街。四十三岁的画家约翰内斯·维米尔和妻子卡塔琳娜·博尔内斯、十一个孩子住在这里。他画光线柔和的安静屋子，留到今天的画只有四十来幅。1672 年开战以后画市垮了，他自己的画几乎卖不出去，买来经手的别家画作也只能压在手里；这年 7 月，他去阿姆斯特丹借了一千荷兰盾。
        - 史实里，据卡塔琳娜后来的陈述，他被孩子和债务压着，在一天半里由好好的人到了去世，12 月 15 日下葬。第二年初，她把他的两幅画交给面包商抵三年的面包钱，2 月 24 日把画室里那幅《绘画艺术》转到母亲玛丽亚·廷斯名下，4 月请求高等法院免去她的债。此后将近两百年，他的名字几乎被人忘了。在这条分支里，有个送面包不收钱、只在小本子上画一道的伙计，有个画框铺的师傅，集市上有个卖泥炭的女人。
        - 这一趟用得上几种人：管过档案、做古董买卖或修过画的人，会画画、做过校对或翻译又细心的人，或者守得住夜、有条理、意志硬的人，护得住画室里那幅大画；做过买卖、手气不坏的人，或者能说会道、在市井里混得开的人，把压在手里的画卖出去；懂画、心细或心善的人，说得出这些画以后的样子；当医生、意志硬的人，懂医护、带着情绪稳定贴片的人，或者带着纳米医疗箱的人，守得住十二月中旬那一天半。
      outcomes:
        all: 那个冬天，维米尔没有倒下。正月里一个晴天，他又爬上楼去画画，那幅大画还挂在画室的墙上，厨房柜子里收着一小包用布裹着的钱。
        p4: 那个十二月过去了，维米尔没有倒下。正月里一个晴天，他又爬上楼，把画架挪到了窗前。
        p2: 12 月 15 日，维米尔葬在代尔夫特，四十三岁。那个月卖画得来的钱，卡塔琳娜用布包着，收在厨房的柜子里。
        p3: 12 月 15 日，维米尔葬在代尔夫特，四十三岁。画室里的画架空着，调色板搁在一边，上面那一点新调的蓝已经干了。
        p1: 12 月 15 日，维米尔葬在代尔夫特，四十三岁，留下十一个孩子。第二年二月，卡塔琳娜把画室里那幅大画转到了母亲名下。
      none: 12 月 15 日，维米尔葬在代尔夫特岳母早年买下的墓穴里，四十三岁。此后将近两百年，很少有人叫得出他的名字。
      desync: 12 月 3 日，债主差来的人对着清单点了点头，叫人把墙边那幅大画从钉子上取下来。{staff}被召回时，两个人正抬着它下楼，画上那片蓝在楼梯拐角一晃。
      not_admitted: '{staff}没能进老朗恩代克街那户人家，只在集市广场边站过几个早上。那户人家的窗板总是关着一半，有个孩子趴在窗台上，数着过往的面包篮子。'
      points:
        p1:
          trait_vigil: 12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}守得住，一连两夜睡在画室外的楼梯口，白天把来人的清单一行行对过：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。
          trait_methodical: 12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}有条理，把来人的清单一行行对过，又把画室里每幅画的来历记成一页：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。
          else: 12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}跟画和契据打过交道，把来人的清单一行行对过，指给他看：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。
        p2:
          class_trade: 12 月 6 日是集市日。几幅别家的画用布包着，靠在店里的门后已经好几年了。{staff}做过买卖，把画一幅幅抬到窗前的光里，跟来看画的两个商人从早谈到中午，价钱让了一点，又一点不让。下午，三幅画用麻绳捆好，被人扛出了门。卡塔琳娜把钱在厨房桌上数了两遍，拨出一小摞用布包好，放进了围裙口袋。
