    shift:
      p1:
        was: 1319 年下半年至 1320 年初，但丁在拉文纳写《天堂篇》时，与博洛尼亚的乔万尼·德尔·维尔吉利奥开始拉丁诗通信，这是学界的推定。
      p2:
        was: 1321 年 9 月，但丁在拉文纳去世，到死没能回到佛罗伦萨；1519 年前后佛罗伦萨请求迁回他的遗骨，拉文纳的修士把遗骨藏进了墙里。
        now: '{staff}在拉文纳让他知道，《神曲》往后会一直有人读，他的城市终有一天想把他接回去。'
        who: dante_ravenna
        bio: 流放中的但丁在拉文纳的晚年得知，他的诗会长久流传，佛罗伦萨终会以他为荣。
    vignettes:
      latin: '{staff}在誊写间看见两叠纸：一叠是托斯卡纳话写的《天堂篇》，一叠是要寄往博洛尼亚的拉丁诗，来信说只有拉丁文才配得上桂冠。{staff}知道七百年后人人读的是哪一叠，话到嘴边，又咽了回去。'
      pinewood: '{staff}跟着拾柴的人走进拉文纳城外靠海的松林，松针在脚下软软地陷下去，两人在沙地上歇脚，听得见林子那头的海浪。'
      ink: '{staff}帮卖墨水的人把一罐罐墨从船上搬下来，罐口封着蜡。墨是用栎树瘿和铁锈熬的，卖墨的说，城里誊写的人买得最多。'
  gutenberg_mainz:
    name: 用活动金属字模印书
    place: 美因茨
    figure: 古腾堡
    story: 约翰·富斯特出钱支持古腾堡在美因茨印书。四十二行本留了下来，1455 年 11 月 6 日记下富斯特追讨借款和利息的公证书也在。文书没有写清官司以后各人拿了哪些工具。
    story_prose:
      opening:
        - 美因茨的印工把新印的一张举到光下，在页角做个小记号。送纸的人问他这次能不能结钱。古腾堡手里是一叠要核的页，富斯特手里是一笔要对的账。
        - 史实里，四十二行本在这一时期印成。1455 年 11 月 6 日的公证书留下古腾堡与富斯特争执的记录。这趟可先保住这一批工料，并另外争取两人说清哪些工具散伙后还能用。
        - 懂印工或核账的人可以替印坊核纸、活字和工钱。要谈器具，还要有人能请两边坐下，把商量结果写进纸里。
      points:
        p1: 印工算过纸堆，说还有一叠需要补。你让送纸人照着计工单点过当天印好的份数，再同古腾堡一起把下一批纸和工钱分列。送纸人擦去原先写着要收回的记号。第二天，压床上放着能继续接印的第一张新纸。
        p2: 富斯特拿来一份总账，说看不出哪件是借款置办的。你请古腾堡从眼下还要用的工具讲起，请书记把可继续使用的器具逐条读给两人听。两人各取一份副本，木柄还留在原来的钩上。离开时，古腾堡把自己那份折进工钱簿。
      outcomes:
        all: 四十二行本印完，富斯特和古腾堡仍要解开账上的纠纷。可继续使用的器具已有两人各自收起的副本。
        p1: 工班继续印下去，成书的页叠出门。公证人仍会见到两边争论工具和钱。
        p2: 一份工具使用清单已经写出。书还印不下去，本趟只收回这份商议记录。
      none: 印床剩着没揭下的一页，工料还等双方答复。
      not_admitted: 门里的印工问来客找送纸的还是找记账的。无人招呼你进来，外头只听见木板落在台上的一声。
      desync: 印床停在半途，纸和工钱都没有接上。原有刊印史失去同步，事务所召回员工。
      excerpts:
        p1: 第二天，压床上放着能继续接印的第一张新纸。
        p2: 离开时，古腾堡把自己那份折进工钱簿。
    relic: 一粒铅字
    relic_desc: 铅锡合金的一个小字，是反着的。
    points:
      p1: 护住用借款维持的印工、纸张与活字，让四十二行本能够印完
      p2: 11 月的官司前，请古腾堡和富斯特谈妥散伙后古腾堡还能继续使用哪些印书工具
    points_fail:
      p1: 四十二行本印到一半停在印机上，这条分支与历史脱了节，事务所当天召回员工。
      p2: 双方照样走到公证人那里，工具的用法却没谈拢。古腾堡还不知道自己以后能不能接着用。
    shift:
      p1:
        was: 1455 年，四十二行本在美因茨古腾堡的印坊里用金属活字印成。
      p2:
        was: 1455 年 11 月 6 日，美因茨的公证人记下富斯特讨还借款和利息的案子。文书没有写清工具最后归谁。
        now: 古腾堡与富斯特谈妥自己还能接着用哪些工具。散伙以后，他可以用这些工具安排下一次印书。
        who: gutenberg_mainz
        bio: 这条分支里，1455 年的争议过后，古腾堡还能使用谈妥的那部分印书工具。
    vignettes:
      wrong_sort: 学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。
      reader: 你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。
      proof: 你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。
  leonardo_florence:
    name: 画画的人，也画机器
    place: 佛罗伦萨
    figure: 列奥纳多·达·芬奇
    story: 卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。
    story_prose:
      opening:
        - 佛罗伦萨的工房里，平日靠窗的板子已经挪开，那里要摆进新工作用的架子。经办人来问丽莎的画像放在哪。学徒抱着空架，叫他别去扶还没有干的板。
        - 1503 年 10 月，韦斯普奇的批注提到达·芬奇画丽莎。画像后来留在画家手中。这里可以让画板有一处安全又能干活的地儿，还可以约一天，让丽莎来看画家愿意给她看的阶段稿。
        - 能察看架子、板材和日照的员工先替工房安排位置。善于召集人的员工再联系丽莎与经办人，把看稿时间定下来。
      points:
        p1: 学徒想在旧架里再挤一个空。你请他先把一块空板向里推，见到板角贴住了旁边一幅画。你跟他把窗下最窄的架格单留出来，再请画家写一个装卸时认得出的记号。晚些时候有人收画，伸手先摸到了留给这块板的签条。
        p2: 画家叫学徒把另一张干透的练习拿来挡住手边的颜料。他自己把愿给丽莎看的画像转向门里。丽莎站在他选的位置，问下回是否还要照那样坐。他对照椅背想了片刻，请学徒把凳子的位置记下。丽莎走后，画家把画板转回自己的光里。
      outcomes:
        all: 工房里还有一个能继续画的位子。丽莎知道这块板已经画到了哪里，画家仍自己保管它。
        p1: 画像的暂存格有了签条和光。经办人能问到进度，室内还没有约好看稿的日子。
        p2: 丽莎已看过一回。画板后来受损，这段相约看画的记录随员工带回。
      none: 架子还没腾出。来询问的人在门边等过一阵，只问到画还没交。
      not_admitted: 学徒请来客让开扛架的人。画板在里面，门边看不到正面。
      desync: 未干的画板送进旧架时被邻板挤坏。原有画像无法保住，事务所召回员工。
      excerpts:
        p1: 晚些时候有人收画，伸手先摸到了留给这块板的签条。
        p2: 丽莎走后，画家把画板转回自己的光里。
    relic: 一页镜像书写的笔记
    relic_desc: 一页反着写的字，要对着镜子才读得出。
    points:
      p1: 在工房接下别的市政绘画工作以前，给丽莎的画像留一个白天可用、暂存时可认出的位子
      p2: 替画家与经办人议定分段查看的机会，趁画像还在佛罗伦萨，让坐画的人看到一份由画家同意展示的阶段稿
    points_fail:
      p1: 新工作一到，未干的画板被夹进旧架，画像在这次交接中受损，事务所召回员工。
      p2: 没约定何时可看，画像继续留在画家手中。委托一方只能听工房传来说到了哪一步。
    shift:
      p1:
        was: 韦斯普奇 1503 年十月的书上批注说，达·芬奇正在画丽莎·德尔·焦孔多。
      p2:
        was: 这幅肖像历经长时间修改，最终随画家离开意大利并进入法国收藏。
        now: 丽莎来时，画家给她看这一阶段已成形的肖像。以后画板仍可随画家带走，工房另留一份双方见过的稿样。
        who: leonardo_florence
        bio: 佛罗伦萨的同时代批注证实画家在做丽莎的肖像。后来画作继续发展，流传远离最初的工房。
    vignettes:
      shadow: 你请学徒指一指，脸从哪儿结束，背景从哪儿开始。他伸手又犹豫了，没有加重那道线，先把交界处留着再看。
      hands: 访客记得脸，却把手的位置画变了。你把习作和他凭记忆画的图并排，让他自己找出线条挪到了哪里。
      seat: 学徒收拾东西时，你在地上替模特的椅子做了个记号。他把画留在半成处，下次来仍知道椅子该放哪儿。
  copernicus_frombork:
    name: 太阳在中心
    place: 波兰弗龙堡
    figure: 哥白尼
    story: 1539 年，年轻的数学家雷蒂库斯来到弗龙堡，劝尼古拉·哥白尼把书付印。1543 年，《天体运行论》在纽伦堡印成，书中地球自转并绕太阳运行，卷首多了一篇不署名的《告读者》。哥白尼从 1542 年底起一直病着，1543 年 5 月 24 日在弗龙堡去世。他的朋友蒂德曼·吉泽后来写信说，印好的书到他去世那天才送到他手上。
    story_prose:
      opening:
        - 1543 年春，波兰弗龙堡。尼古拉·哥白尼从去年年底起一直病着。他写了几十年的《天体运行论》正在纽伦堡付印，书里地球自转，绕着太阳运行。四年前，年轻的数学家雷蒂库斯从维滕贝格来到这里，劝他把书付印。
        - 史实里，书在纽伦堡印成，卷首多了一篇不署名的《告读者》。他的朋友蒂德曼·吉泽后来写信说，印好的书到他去世那天才送到他手上；5 月 24 日，他在弗龙堡去世。7 月，吉泽请雷蒂库斯把要求改版的信转交纽伦堡市议会。在这条分支里，山脚的渔村有个补网的渔夫，家里有个仆役，天天往病房里送水。
        - 这一趟用得上几种人：懂护理、守得住病床的人，或者腿脚硬朗、赶得了远路送书的人；懂文书、分得清亲笔原稿和抄件的人；心细、做得出一张勘误页的人。
      outcomes:
        all: 五月初送到的那本书，后来一直放在他床头。那年夏天，附近借出去的几本书里都夹着一张勘误页；那部亲笔原稿包着布，锁在柜子里，后来交到了吉泽手上。
        p3: 那本书后来一直放在他床头，扉页朝上。几周以后，他在弗龙堡去世。
        p2: 那年夏天，附近借出去的几本书里都夹着一张勘误页，纸角被翻得卷了起来。外地印坊的回信，后来也收进了同一个档案夹。
        p1: 那部亲笔原稿包着布，后来交到了吉泽手上，又从他手里到了雷蒂库斯那里。几百年后，它收进了克拉科夫的雅盖隆图书馆。
      none: 5 月 24 日前后，印好的书送到了弗龙堡。病房的窗开着一条缝，送水的仆役在门口站了一会儿，没有进去。
      desync: 书房里的纸收拾乱了，两叠工作纸混进了要交给印坊的那份抄本，亲笔原稿不知去向。{staff}没等到吉泽来，就被事务所召了回来。
      not_admitted: '{staff}没能上山进那栋房子，只在山脚的渔村帮人补了几天网。山上那扇窗，夜里一直亮着灯。'
      points:
        p1:
          class_lettered: 五月下旬，病房隔壁的书房里，桌上的纸越堆越乱。{staff}照管档案的办法，把亲笔原稿和两叠工作纸一页页点清，分开记进一本账，原稿用布包好，单独锁进柜子。收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。
          else: 五月下旬，病房隔壁的书房里，桌上的纸越堆越乱。{staff}一连几夜守在书房，把亲笔原稿和两叠工作纸一页页点清，分开记下，原稿用布包好，单独锁进柜子。收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。
        p2: 七月底，吉泽写信给雷蒂库斯，请他把要求改版的信转交纽伦堡市议会，回音一时还等不来。{staff}照校书的规矩，对着原稿一页页查过，写成一张勘误页，列明作者自己的序言在哪一页，卷首那篇《告读者》原稿里没有。勘误页抄了几份，夹进附近先借出去的那几本书。借书的人翻开封面，先看见的就是那张纸。
        p3:
          class_medical: 五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}照护理的规矩守在床边，按时喂水，替他翻身，屋里的炉火不让它灭，等着纽伦堡来的书。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。
          class_travel: 五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}往南赶路，在半道截住从纽伦堡来的货车，把一本印好的书裹进外衣，日夜兼程送回弗龙堡。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。
          else: 五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}在病房外守了好些天，书一到，没等整包拆完，就先取出一本，双手捧着上了楼。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。
      excerpts:
        p3: 书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。
        p1: 收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。
        p2: 勘误页抄了几份，夹进附近先借出去的那几本书。借书的人翻开封面，先看见的就是那张纸。
    relic: 一个黄铜象限仪
    relic_desc: 四分之一圆，用来量星星的高度。
    points:
      p1: 趁弗龙堡还来得及清点，把《天体运行论》的亲笔原稿和工作纸分开记账，给后来接手的吉泽留一张收执
      p2: 吉泽去信催印坊改版的这段日子里，给附近借出的几本书各夹一张勘误页，写明作者自己的序言在哪一页，卷首那篇《告读者》原稿里没有
      p3: 趁他神志还清楚，把印好的《天体运行论》送到他手里，让他知道这本书印成了
    points_fail:
      p1: 收拾桌上纸张时，两叠工作纸被当作已经交给印坊的那份抄本处理。亲笔原稿没有交到吉泽手上，事务所因同步失败召回员工。
      p2: 吉泽只能等外地的印坊和市议会回信，附近读这本书的人，翻开先读到的还是那篇《告读者》。
      p3: 印好的书送到他手上那天，正是他去世的 5 月 24 日。
    shift:
      p1:
        was: 1543 年，纽伦堡印本以抄本为底，哥白尼的亲笔原稿另存，后来经蒂德曼·吉泽传至雷蒂库斯。
      p2:
        was: 1543 年 7 月，吉泽请雷蒂库斯把要求改版的信转交纽伦堡市议会，1543 年首版的匿名文字已经随着印本流通。
        now: 附近几份先借出的书都补上一张勘误页。新借书的人能从旁边那页查回原稿，外地印坊的回复也留在同一份档案里。
      p3:
        was: 1543 年 5 月 24 日，哥白尼在弗龙堡去世。吉泽后来写信说，印好的书到他去世那天才送到他手上。
        now: 五月初，印好的书就送到了他的床前，他在神志清楚时把它拿在手里。几周以后，他在弗龙堡去世。
        who: copernicus_frombork
        bio: 哥白尼在去世前几周收到了印好的《天体运行论》，知道这部写了几十年的书已经印成。
    vignettes:
      preface: '{staff}翻开一本印好的书。卷首那篇不署名的《告读者》说，书里的说法只是便于计算的假设。{staff}知道要再过五十年左右，开普勒才会说出是谁写的，合上书时，手指还压在那一页上。'
      window: '{staff}在病房外守着一壶热水，壶嘴冒着白气。屋里的人说，老人已经认不太清人了。{staff}把窗推开一条缝，让春天的风吹进去。'
      nets: '{staff}在山脚的渔村帮人补网，望得见维斯瓦潟湖，湖面上停着几条小船。渔夫说，山上住着一位老教士，夜里常看星星。'
  vesalius_padua:
    name: 同一幅图的两个版本
    place: 雷根斯堡
    figure: 安德烈亚斯·维萨里
    story: 维萨里在 1546 年从雷根斯堡写出一封信，批评一部缩小翻刻他插图的书。他认为有些图在翻刻后出现失真。
    story_prose:
      opening:
        - 1546 年六月，维萨里在雷根斯堡写信。他谈到另一部翻刻过自己插图的书，反对其中的缩印，也质疑有些线条的走向。
        - 史实里，这封信留下了他的批评。后人拿两版互相对照，发现并非所有疑处都有实质差异。在这条分支里，书商手上还压着一批未发出的书。
        - 这趟需要能辨认不同版次的人，也需要有人能跟书商谈妥，给将要发出的每册书夹进同一张附页。
      points:
        p1: '{staff}把两版摊在柜台上，逐处标明哪里只是印得小、哪里是维萨里提到的疑点。书商问有几处能写得肯定。两人把没核实的断语划掉，只留下读者可以翻回去看的页码。书商翻开最上面那本，把附页夹进图旁。再合上书时，纸边还露出一线白。'
      outcomes:
        all: 书发出去以后，有人按附页上的页码找另一版借看。两张图平放在桌上，中间压着同一支笔。
        p1: 书发出去以后，有人按附页上的页码找另一版借看。两张图平放在桌上，中间压着同一支笔。
      none: 书商捆好最后一摞书。那张只写了一半的附页还留在柜台下。
      not_admitted: '{staff}没能见到掌柜。柜台上的样书已经翻到图页，只有买书的人过去翻了一下。'
      excerpts:
        p1: 书商翻开最上面那本，把附页夹进图旁。再合上书时，纸边还露出一线白。
    relic: 两处有记号的校样
    relic_desc: 分支里的校样，用两个记号辨认两种版次。
    points:
      p1: 请书商给尚未发出的翻刻本夹一张附页，指出哪些图值得对照原版
    points_fail:
      p1: 经销人没答应，手里的书仍没有附上那张勘误。
    shift:
      p1:
        was: 1546 年 6 月 13 日，维萨里从雷根斯堡写信，质疑翻刻图出现失真。
        now: '{staff}说服经销人附上勘误，列出受质疑的图版，供读者翻查原版。'
        who: vesalius_padua
        bio: 翻刻本的读者拿到了一张标明维萨里对哪些图有异议的附页。
  shakespeare_globe:
    name: 给父亲捎句话
    place: 斯特拉特福
    figure: 威廉·莎士比亚
    story: 斯特拉特福的登记簿记着哈姆内特于 1596 年 8 月 11 日下葬，葬前他的父亲在哪里没有记载。在这条分支里，家里托人给他递信。
    story_prose:
      opening:
        - 1596 年八月的斯特拉特福。教区的登记簿后来会留下孩子的名字和下葬的日子。哈姆内特十一岁。
        - 史实里，哈姆内特在 8 月 11 日下葬，登记簿没说父亲何时回家。在这条分支里，家里折好一封信，想托人赶在天黑前带走。
        - 这趟用得上熟悉路上落脚处的人。能让陌生人答应多走一程，也能帮这封信继续往前。
      points:
        p1: '{staff}在门口问了两遍，终于找到一位认得下一处落脚地的捎信人。那人读过信外的名字，把信放进干燥的内袋。威廉赶回来时，哈姆内特还醒着。孩子往床里让了让，给父亲在床沿挪出一点地方。'
      outcomes:
        all: 威廉坐到窗外全黑。起身取水时，他把椅子挪得离床更近，免得回来时找不着。
        p1: 威廉坐到窗外全黑。起身取水时，他把椅子挪得离床更近，免得回来时找不着。
      none: 暮色到了门口，折过的信还压在杯子底下。
      not_admitted: '{staff}没能进到等信的那户人家。门口有人走过，屋里没有开门。'
      excerpts:
        p1: 威廉赶回来时，哈姆内特还醒着。孩子往床里让了让，给父亲在床沿挪出一点地方。
