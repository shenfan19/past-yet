ui:
  about:
    update_notes: 更新日志
    content_credit:
      mail: 邮件
      design: 游戏由 Fan Shen 设计，AI 参与辅助。
      drafts: 游戏里的故事、历史人物简介和虚构员工故事由 AI 生成，作者陆续校对。个别卡片的贡献者会在条目中注明。
      review: 员工和他们的故事均为虚构。历史细节、文化表述和译文可能有错漏。如果发现不准确、不公平、冒犯性或侵权的内容，欢迎通过 {issues} 或 {mail} 反馈。作者会尽快核查，并移除有问题的内容。
    echoes:
      title: 回响
      rule: 每个可玩的故事都配有历史引文。结算时，即使零星、同步失败，或未能参与事件，也会显示一条有出处的回响。星数和结局决定出现哪一句。医疗撤离和主动召回会跳过回响。
    preview:
      title: 关于早期版本
      project: 这个游戏源于一个研究项目，也帮助我们开发模拟引擎。不用了解研究内容，也可以直接玩。
      changes: 随着功能增加，游戏规则、道具效果和操作结果都可能变化。我们会尽量保留你的进度，但遇到较大的更新，旧存档可能无法继续使用。
    title: 关于 The Past Is Yet to Come（白露未晞）
    version_line: '{v}，发布于 {date}'
    dedication: 首版完成于 2026 年 11 月 19 日。故事从中山大学的孙中山先生铜像前展开，谨以此纪念先生诞辰 160 周年。
    links:
      - id: site
        label: 网站
      - id: code
        label: 源代码
    sections:
      - h: 简介
        echoes: true
        dedication: true
        p:
          - 你经营一家穿越事务所，派员工回到过去，读他们带回来的报告。
      - h: 免责声明
        preview: true
        review: true
        p:
          - 本游戏仅供娱乐，请勿将它用作医疗、公共卫生或历史研究的依据。
      - h: 数据与隐私
        p:
          - 你的存档和设置只存在你自己的浏览器里，是你设备上的本地存储。页面没有账号，没有广告，没有 cookie，也没有第三方跟踪，不会把你的存档发到任何地方。为了显示“您是第几位旅人”和统计访问人数，页面会向作者自己的计数服务发送匿名计数，只包括打开了哪一页、到过哪个故事。不发送任何能识别你的编号；服务器只用网络地址和浏览器信息算出一个当天有效的哈希来去重，不保存地址本身。
          - 你选的语言和你在界面里所处的位置也存在本地。设置里的“清空存档”会删除存档，不能撤销。清除浏览器数据也会删除全部内容。存档在版本更新时可能会重置，可以在设置里导出备份。
          - 游戏面向成年人。如果以后提供账号或云端功能，会先说明收集什么、为什么收集，收集需要你明确同意，并遵守当地的数据保护法律，例如 GDPR。
      - h: 贡献
        p:
          - 游戏以 MIT 许可证发布。界面和逻辑是没有后端的静态网页文件，数据文件是 YAML，用同样是 MIT 许可证的 js-yaml 读取。
          - 非常欢迎您提出建议和批评，也欢迎推荐新的事件和员工，或提供能让它们更准确的数据和出处。事件与遗物、员工、特质和翻译都是 cards 文件夹里的 yaml 卡片，cards/README.md 说明了怎么添加。
          - 被采用的内容会以您的署名在本页发布，姓名或笔名由您决定，作品的权利仍属于您。内容与游戏一样以 MIT 许可证发布，方便大家继续使用和改进。史实类内容请尽量附上出处，方便核对。
      - h: 作者
        p:
          - 我是 Fan Shen，从事动力系统建模与仿真研究，这是我的个人项目，数据结构和计算逻辑由我设计完成。
          - 每个时空是一份公开的 YAML 模型。员工和历史人物是按效用选择行动的主体，事件是带种子的随机事件，每次运行都会和同一种子下没有员工的运行对照，代码只负责解释这些文件。模型里的每个数字都带出处标签，区分史实、模型、游戏设定和校准值，开发者模式下百科会列出公式和变量。游戏使用简化的 JavaScript 引擎，源自研究项目的后端，这个原型里的模型都没有用数据拟合过。
          - Life Matters（LM）是我提出的一个开放研究项目，用 YAML 构造 LM format 格式，汇总部分医学、心理学、社会学研究成果，并以动力学模型描述日常生活中各个要素如何影响健康。格式公开，希望大家使用它、用它建模并分享，也欢迎合作。目前仍在开发中。
          - Care for You 也是 LM 的子项目，是一个家庭照看游戏，同样由 LM 后端改进的引擎驱动。
        links: 0
      - h: 致谢与许可
        credits: true
        p:
          - 受其他游戏启发：百科参考文明 4 的文明百科，派人出去再读结果参考刺客信条兄弟会和旅行青蛙，雇佣参考英雄无敌，时钟和音乐播放器参考群星，星级和关卡参考植物大战僵尸以及刺客信条的完全同步。点名是为了致谢，与本游戏没有任何关联。
          - 世界地图的轮廓来自 Natural Earth，属于公共领域。
          - 音乐是 Mutopia Project 提供的 MIDI 文件，由该项目的志愿者根据公共领域的版本排印，包括巴赫、贝多芬、肖邦、德彪西、格里格、乔普林、莫扎特、萨蒂的作品，以及英格兰、芬兰、日本的传统歌曲。每首曲子的文件头都写明 Public Domain。文件原样放在 assets 文件夹里。放进该文件夹的文件在构建数据时自动加入播放列表。音效是页面自己合成的音调。
          - 历史参考文献列在百科里，每一条都标明有没有核对过。
          - 名称和 logo 不在 MIT 许可证的授权范围内。
