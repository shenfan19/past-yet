      p2: 照顾他们当中最虚弱的人
      p3: 拉动雪橇，让日记和记录能带回家
  mallory_everest:
    name: 最后一次被人看见
    place: 珠穆朗玛峰
    figure: 乔治·马洛里
    story: 马洛里和欧文离开高处营地去登珠峰，最后有人看见他们在高处攀登。七十五年后，人们才找到马洛里的遗体。
