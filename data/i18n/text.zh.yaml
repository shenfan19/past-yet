ui:
  about:
    title: 关于穿越事务所
    version_line: '{app} {v}，发布于 {date}'
    links:
      - id: site
        label: 网站
      - id: code
        label: 源代码
      - id: issues
        label: 意见与问题
      - id: mail
        label: 邮件
    sections:
      - h: 简介
        p:
          - 你经营一家穿越事务所。员工回到历史的转折点，尝试帮上忙，带着一份报告回来。不需要一直盯着，可以让它自己运行，只读发生了什么。
          - 它起于一点单纯的好奇：如果今天的人站在过去某个著名的时刻，会发生什么。希望它好玩，能随手摆弄，也适合安静地看。
          - 历史不可改变。员工做的一切都落在平行分支上，主时间线保持原样，分支与主时间线的差换算成时空能量。事务所不介入战争和政权更替，只做医疗、技术、文献、民生和见证。员工不会死，濒死时被回收符接回，付出代价，但故事继续。
      - h: 免责声明
        p:
          - 这是一个游戏，也是一次仿真练习，不是医疗、公共卫生或历史研究产品。它不提供诊断、治疗、用药或健康建议，里面的内容不应用来指导任何关于健康或安全的真实决定。
          - 模型是简化的。除非数字标为史实，参数都是游戏设定，没有任何一个参数用数据拟合过。游戏里的史实在核对出处之前只是占位，每个条目都会说明有没有核对过。请不要把这个游戏当作引用来源。
          - 179 个事件是有意倾斜地选的：加大了科学、技术、哲学、艺术和思想的比例，减少了政治和军事。其中一半是遗憾，历史对待不公或遗失的人和作品。历史改变不了，所以遗憾的星是你在历史之内能给他们的，最后一颗是救赎。这是第一版的取舍，不代表历史上什么更重要。
          - 约翰·斯诺、伊格纳茨·森梅尔维斯等历史人物是被演绎的形象。他们在游戏里说的话、做的事是围绕史实写的虚构，不代表他们真实的言论、观点或为人。穿越、员工、古董、商品和每一个剧情都是虚构的。
          - 五十位员工都是虚构的人，大致按世界人口分布。他们的特质和故事，有些贴近人们对某个地方或群体的常见印象，有些故意写成相反的，免得谁只是一个类型，两种写法都不代表对任何真实群体的看法。作者不可能完全了解每一种文化，所以人物、族裔和故事另外请 AI 查过有没有可能冒犯的地方，但这个检查也会出错。如果你觉得哪里不公平、不准确或者让人不舒服，请到仓库的 Issues 反馈，作者会尽快修改。
          - 事件里的人物是过去的真实人物，选的都是去世很久的人，他们在游戏里说的话、做的事都是虚构。如果游戏里有任何内容侵犯了某个人或某个家庭的权益，请发邮件到 contact@teleporter.uk 或在仓库里提 issue，作者会尽快删除。
          - 游戏里的产品、名称和物品都是虚构的。名称与别人的作品相似的地方是参考，不代表有任何关联，尚未核查权利的东西会被标出，也不能在游戏里购买。
          - 游戏按现状提供，不附带任何形式的担保。如果你正处在很艰难的地方，请联系你信任的人，或者当地的专业支持。
      - h: 数据与隐私
        p:
          - 你的存档和设置只存在你自己的浏览器里，是你设备上的本地存储。页面没有账号，没有存放你数据的服务器，没有统计分析，没有广告，没有 cookie，也没有第三方跟踪，不会把你的游戏数据发到任何地方。
          - 你选的语言和你在界面里所处的位置也存在本地。设置里的“清空存档”会删除存档，不能撤销。清除浏览器数据也会删除全部内容。存档在版本更新时可能会重置，可以在设置里导出备份。
          - 游戏面向成年人。如果以后提供账号或云端功能，会先说明收集什么、为什么收集，收集需要你明确同意，并遵守当地的数据保护法律，例如 GDPR。
      - h: 贡献
        p:
          - 游戏以 MIT 许可证发布。界面和逻辑是没有后端的静态网页文件，数据文件是 YAML，用同样是 MIT 许可证的 js-yaml 读取。
          - 非常欢迎您提出建议和批评，也欢迎推荐新的事件和员工，或提供能让它们更准确的数据和出处。事件与遗物、员工、特质和翻译都是 cards 文件夹里的 yaml 卡片，cards/README.md 说明了怎么添加。对史实的更正同样欢迎。
          - 被采用的内容会以您的署名在本页发布，姓名或笔名由您决定，作品的权利仍属于您。内容与游戏一样以 MIT 许可证发布，方便大家继续使用和改进。史实类内容请尽量附上出处，方便核对。
      - h: 作者
        p:
          - 我是 Fan Shen，从事动力系统建模与仿真研究，这是我的个人项目，数据结构和计算逻辑由我设计完成。
          - 每个时空是一份公开的 YAML 模型。员工和历史人物是按效用选择行动的主体，事件是带种子的随机事件，每次运行都会和同一种子下没有员工的运行对照，代码只负责解释这些文件。模型里的每个数字都带出处标签，区分史实、模型、游戏设定和校准值，开发者模式下百科会列出公式和变量。引擎是由 LM 后端改进的引擎的简化 JavaScript 版本，这个原型里的模型都没有用数据拟合过。
          - Life Matters（LM）是我提出的一个开放研究项目，用 YAML 构造 LM format 格式，汇总部分医学、心理学、社会学研究成果，并以动力学模型描述日常生活中各个要素如何影响健康。格式公开，希望大家使用它、用它建模并分享，也欢迎合作。目前仍在开发中。
          - Care for You 也是 LM 的子项目，是一个家庭照看游戏，同样由 LM 后端改进的引擎驱动。
        links: 0
      - h: 致谢与许可
        p:
          - 游戏的代码、文字、设计等部分都用 vibe coding 完成。感谢 AI，让我在业余时间实现了这个想法。
          - 受其他游戏启发：百科参考文明 4 的文明百科，派人出去再读结果参考刺客信条兄弟会和旅行青蛙，雇佣参考英雄无敌，时钟和音乐播放器参考群星，星级和关卡参考植物大战僵尸以及刺客信条的完全同步。点名是为了致谢，与本游戏没有任何关联。
          - 世界地图的轮廓来自 Natural Earth，属于公共领域。
          - 音乐是 Mutopia Project 提供的 MIDI 文件，由该项目的志愿者根据公共领域的版本排印，包括巴赫、贝多芬、肖邦、德彪西、格里格、乔普林、莫扎特、萨蒂的作品，以及英格兰、芬兰、日本的传统歌曲。每首曲子的文件头都写明 Public Domain。文件原样放在 assets 文件夹里。放进该文件夹的文件在构建数据时自动加入播放列表。音效是页面自己合成的音调。
          - 历史参考文献列在百科里，每一条都标明有没有核对过。
          - 名称和 logo 不在 MIT 许可证的授权范围内。
