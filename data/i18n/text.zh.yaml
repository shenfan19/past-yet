  archimedes_syracuse:
    name: 城破的那一天
    place: 西西里锡拉库扎
    figure: 阿基米德
    story: 罗马围攻叙拉古时，阿基米德设计器械相助。公元前 212 年，叙拉古城破，他在城里遇害。普鲁塔克记下了几种不同的说法。
    story_prose:
      opening:
        - 叙拉古城破那天，平日从街上传来的叫卖声停了。一个邻人抱着写字板站在门里，问你是不是来找画几何图的老人。他记得阿基米德借走过一块板。
        - 史实里，阿基米德在罗马攻下叙拉古时遇害。古代作者记下不同经过。在这条分支里，可以找到他，陪他到能暂时安顿的地方。
        - 找能认出他、和邻人问清去向的员工。需要带走的是还在屋里的人，他的图板由他自己决定放哪儿。
      points:
        p1: 阿基米德把板转了半圈，说这里还少一道线。你把邻人借出的旧板拿给他，让他知道门外有人能收着这份图。他用手指在木框上点了一下，随后把自己的板交出去。到借宿的屋子里，他先问那块板是不是也到了。
      outcomes:
        all: 这条分支在叙拉古城破之后仍留有阿基米德的消息。新屋里有人把图板放在一张能坐下来的凳旁。
        p1: 你陪他到了暂住处。他掀起图板上的布，还能接着画最后那一道线。
      none: 邻人只听到城破时阿基米德遇害的消息。不同的说法都没有让那个上午重来。
      not_admitted: 邻人没把来客带进里屋。门内有人收走一块旧板，板上的名字仍看不清。
      excerpts:
        p1: 到借宿的屋子里，他先问那块板是不是也到了。
