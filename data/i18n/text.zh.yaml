    name: 走向海边的石像
    place: 拉帕努伊岛，拉诺拉拉库
    figure: 拉帕努伊的石像匠人
    story: 在拉帕努伊岛的拉诺拉拉库采石场，匠人们从火山岩上凿出叫摩艾的石像，再把它们运过全岛，立在面朝内陆的石台上。今天这片采石场和它所在的公园由拉帕努伊人自己照管。
    relic: 一把石斧
    relic_desc: 一片手掌大的深色玄武岩刃，磨出了干净的刃口。
    points:
      p1: 在岩壁上凿出石像的轮廓
      p2: 把石像沿山坡拉下来
      p3: 看懂石像是按什么次序凿的
  hargrave_stanwell_park:
    name: 四只风筝和一把座椅
    place: 澳大利亚斯坦韦尔公园
    figure: 劳伦斯·哈格雷夫
    story: 在斯坦韦尔公园的海崖上，劳伦斯·哈格雷夫把四只箱式风筝连成一串，让海风把他托离地面几米。他从不为自己的设计申请专利，而是把它们公开发表，谁都可以用。
    relic: 一副箱式风筝骨架
    relic_desc: 一副轻巧的细木格架，一端的布已经撕破。
    points:
      p1: 看箱形怎样兜住风
      p2: 帮他绑好绳子和杆
      p3: 在海崖上等风起来
  sun_yat_sen_guangzhou:
    name: 从铜像到一所新大学
    place: 广州
    figure: 孙中山
    story: 你站在中山大学的孙中山像前，被带回 1924 年的广州。2 月 4 日他下令把三所学校合并成国立广东大学，派邹鲁筹备。9 月 19 日开学，11 月 11 日举行成立典礼，会上用的是他为这所大学写的校训：博学、审问、慎思、明辨、笃行。两天后他离开广州，不久病倒，1925 年 3 月 12 日在北京去世。1926 年这所大学以他的名字命名。
    relic: 一枚铜质校徽
    relic_desc: 这所大学最初几年的一枚小徽章。
    points:
      p1: 看出几所学校分散的校址为什么该并到一处
      p2: 帮几所学校的负责人坐下来谈妥
      p3: 在开学前的几个月里把事情一直推着走
      p4: 在开学第一天赢得师生的信任
      p5: 在他最后的病中陪着他
