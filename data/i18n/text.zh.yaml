    place: 罗斯冰架
    figure: 罗伯特·法尔肯·斯科特
    story: 斯科特和同伴从极点折返，在冰架上被严寒和风暴困住，离补给点只有十一英里。几个月后人们找到了他们，也找到他的日记。
    relic: 一本日记
    relic_desc: 一本用铅笔写的小日记，被冻得发硬。
