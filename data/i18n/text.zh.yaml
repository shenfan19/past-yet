      p2: 9 月 5 日照史实发生，这条分支里他没有回到维也纳的讲台。
    shift:
      p1:
        was: 1906 年 9 月 5 日玻尔兹曼去世时，原子是否真实存在仍有不少物理学家和化学家怀疑；1908 年起佩兰的布朗运动实验验证了爱因斯坦 1905 年的预言，原子才被普遍接受。
        now: 那个夏天他已经知道，原子的事过几年就会有人用实验定下来。
      p2:
        was: 1906 年 5 月玻尔兹曼因病停课，课由斯特凡·迈尔代讲；同年 9 月 5 日他在杜伊诺度假时去世，终年六十二岁。
        now: '{staff}陪他过了杜伊诺的那个夏天，病一点点缓下来。秋天他带着家人回到维也纳，又站上了讲台，还亲眼看到原子被实验证实。'
        who: boltzmann_duino
        bio: 这条时间线里，玻尔兹曼 1906 年秋天病好了回到维也纳，又教了几年书，看到了佩兰的实验让原子学说被普遍接受。
    shift_all: 他知道自己的学说站得住，病也好了，秋天回到维也纳接着讲课。
    vignettes:
      pebbles: 七月，潮水刚退，{staff}在海滩上帮渔夫的小儿子数一桶小石子。孩子问，太小、数不清的东西，是不是就不算有。{staff}说没人数它也在那儿。孩子想了想，又往桶里扔了一把。
      nets: 七月初，{staff}帮渔夫把晾在岸边的网收起来，网眼里还挂着几片海草。渔夫说这一湾斯洛文尼亚话、意大利话、德国话都听得到，鱼可不管你用哪种话骂它。
      towels: 八月，{staff}帮旅馆的女招待把海边晾干的浴巾收回来，海风把布吹得鼓鼓的。她说今年海水暖得早，城里来的客人一住就是一整季，她的手让盐水泡得起了皮。
  cantor_halle:
    name: 疗养院寄出的信
    place: 哈雷
    figure: 格奥尔格·康托尔
    story: 康托尔 1913 年退休，晚年多病，又遇上战时缺粮。1917 年，他最后一次住进哈雷的疗养院。他写信给妻子，请求回家，1918 年 1 月 6 日在院中去世。
    story_prose:
      opening:
        - 哈雷疗养院的窗边放着一把椅子。康托尔写完一封信，把还没装封的纸放下，问今天还有没有人来。走廊里的伙房账单刚送上楼，送餐的人也在等。
        - 康托尔在战时最后一段日子住在哈雷疗养院，1918 年 1 月 6 日去世。家人探望和那一冬的食物是这趟能做的事。两件各自商量。
        - 派能听完他的话再安排的人，问谁来见他最合适。能跟伙房核实供应的人，再去找一顿他吃得下的饭。
      points:
        p1: 你把两个可来访的日子写到信纸下面。康托尔看了片刻，请你先带去给他指定的那位家人。探访订下来以后，值班人把椅子放到稍离走廊的地方。那天外面有人经过，椅子上的人也听清了他正说的话。
        p2: 伙房的人只肯说哪几天有余量。你请他把能保证的几天圈出来，回头又和来人核了家里能匀的食物，再问康托尔哪样吃得下。下一次有人送餐，他看了看钟，说和昨日约好的是同一个时刻。
      outcomes:
        all: 那年冬天多了一次探望，也有几顿能按时端来的饭。到了次年一月，家人仍收到他在哈雷去世的消息。
        p1: 康托尔见到自己想见的人。后来送饭仍取决于当日能匀出什么。
        p2: 他有了较安稳的饭点。家里的人没能到椅子上坐下，只从回信问候他。
      none: 椅子仍朝着窗。伙房的人把账单再折起来，送餐的日子还定不下。
      not_admitted: 值班人替房里传话，今天没有约见。你把带来的纸留在门口的信盘。
      excerpts:
        p1: 那天外面有人经过，椅子上的人也听清了他正说的话。
        p2: 下一次有人送餐，他看了看钟，说和昨日约好的是同一个时刻。
    relic: 一只没用过的信封
    relic_desc: 虚构信封，留在哈雷的来信旁。
    points:
      p1: 问康托尔最想见谁，帮他约一次在哈雷疗养院里能安静说话的探望
      p2: 和伙房及家人核对冬天还能匀出哪些食物，给他安排一顿能按时吃上的饭
    points_fail:
      p1: 家里只能回信。他请人搬来的椅子，一直空着。
      p2: 还得等有人匀出食物才有得吃，康托尔有些日子依然饿着。
    shift:
      p1:
        was: 1917 年，康托尔最后一次住进哈雷的疗养院，写信给妻子请求回家。
        now: 这条分支里，{staff}安排了一次探望。那些写在信里的话，康托尔可以当面说给家里人听。
      p2:
        was: 康托尔晚年多病，战时德国又缺粮。
        now: 这条分支里，{staff}让康托尔按时吃上了一顿饭。这几天他饿了，不用先等家里送东西过来。
    vignettes:
      list: 值班人差点把回信放进要寄出去的信里。{staff}核过两个封面上的名字，把回信放回康托尔桌上。
      after: 有只碗从窗前经过。{staff}问谁还在等饭，值班人又把伙房的单子核了一遍。
      end: '{staff}问康托尔希望把椅子放在哪。他指着一个来客坐定就能看见他的位置。'
  tesla_wardenclyffe:
    name: 那一行写着拟建
    place: 长岛肖勒姆
    figure: 尼古拉·特斯拉
    story: 1901 年 3 月，J.P. 摩根答应出资十五万美元，给尼古拉·特斯拉建一座无线电站。建筑师斯坦福·怀特设计了长岛沃登克里弗的房子，这一年特斯拉为塔和实验楼几次写信给他。9 月工地动工。12 月，马可尼收到了一个越过大西洋的信号。1902 年 6 月，特斯拉把实验室搬进砖楼；1903 年 7 月，摩根回信说不再追加款项。1917 年，塔被炸掉。
    story_prose:
      opening:
        - 1901 年 9 月，纽约长岛北岸的沃登克里弗。半年前，J.P. 摩根答应出资十五万美元，给发明家尼古拉·特斯拉建一座无线电站；建筑师斯坦福·怀特设计了这里的实验楼和塔。特斯拉想用这座塔做无线通信和输电。
        - 史实里，九月里各家包工的报价高出预料，特斯拉为塔和实验楼几次写信给怀特，图纸改了又改；12 月马可尼收到了越过大西洋的信号；1903 年 7 月摩根回信说不再追加款项，1917 年塔被炸掉。在这条分支里，工地上有个工头，崖上的木板棚里有个守夜人，沙路上有个往这边拉木板的车夫。
        - 这一趟用得上几种人：管过档案、做过木工的人，或者手巧、有条理的人，分得清哪一张是旧图、哪一张是改过的，也看得懂楼和塔的工钱各是多少；再要说得动人，替特斯拉把拨款一段一段讲清楚。
      outcomes:
        all: 1902 年 6 月，特斯拉把实验室搬进了砖楼。后来钱还是不够，工棚墙上那两页账一直钉着，付清了的那一段底下画着一道线。
        p3: 后来钱还是不够。工地结清了约定的那一段基础工程，没有着落的几项另列在一页纸上，钉在工棚门后。
        p2: 1902 年 6 月，特斯拉把实验室搬进砖楼。塔的报价后来又改过几回，每一回都能跟前一页对上。
        p1: 1902 年 6 月，特斯拉把实验室搬进沃登克里弗的砖楼，在那里一直工作到 1906 年。实验楼和塔址留到了今天。
      none: 1903 年 7 月，摩根回信说不再追加款项。崖上的塔立了十几年，1917 年被炸掉，砖楼还在。
      desync: 9 月 19 日，两套图混在一摞里，包工人照着旧图报了价，没人说得清该照哪一套。{staff}被召回时，工头正把整摞图卷起来，用一根麻绳捆住。
