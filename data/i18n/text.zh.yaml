      p3: 分别标出过河段与回廊，留给下一班
    vignettes:
      route: 工场帮工把堤道和回廊接成同一条边。你把纸转向来路，圈出两条线从哪儿对不上。他现在能用一根手指点出该在哪里交接。你把订正图记下，下一班还没来试走。
      load: 你知道后来的访客会反复写到浮雕，今天这条送图的路却未必有人记得。帮工问拿图的人在哪儿停才不挡路。你走回转弯处，在图上补一点。还没等另一个人照着走，你就收队了。
      edge: 你在一张纸上抄下河沿，另一张抄回廊头一段。帮工把两纸在转弯处对齐。你带走这一小段轮廓，在这里怎么转头也看不见整条回廊。
  sejong_hangul:
    name: 人人都学得会的字母
    place: 首尔
    figure: 世宗大王与学者们
    story: 1443 年，朝鲜世宗亲制二十八个字母，用来书写朝鲜语。1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。世宗于 1450 年去世。
    story_prose:
      opening:
        - 1443 年，汉城。世宗做了二十八个新字母。朝鲜语可以说出口，可想把嘴里的话写下来，得先学一套和自己说话很不一样的文字。世宗想让一张纸也能用来写家常话。
        - 史实里，1444 年二月，集贤殿有人联名上疏反对新字，宫里用新字译书的事正做到一半。那年春天，世宗为眼疾去椒水养病，此后身体每况愈下。在这条分支里，椒水行宫外还有个摊主，账算得清，签名却总要把笔交给别人。
        - 这一趟用得上三种人：守得住文稿的人，肯一笔一笔教人认字的人，懂医药、带对了药的人。
      outcomes:
        all: 那年夏天，世宗回宫时还看得清字。摊主签了名的那张纸，他没让人收走，压在新字校样的最上面。
        p2: 椒水行宫外，那本账的末尾，第一次是摊主自己的笔迹。
        p3: 那年夏天回宫，世宗还能自己看奏章。新字的校样，他一页一页翻到了最后。
        p1: 集贤殿的灯又亮了。用新字译出的《韵会》，一页压着一页往上摞。
      none: 回到事务所后，{staff}还记得摊主递笔时的那一下：手伸出去，在半空停了停，才把笔交给旁人。
      desync: 上疏之后，新字的稿页散在议事厅的地上，没有人去捡。{staff}被召回时，最上面那一页印着半个鞋印。
      not_admitted: '{staff}没能留到把新字教给摊主的时候。她又翻过一页账，纸上仍等着别人替她签名。'
      points:
        p1: 上疏那几天，议事厅里人来人往，没人顾得上桌上的稿页。{staff}把用新字译《韵会》的稿页按次序码好，压上一方镇纸。几天后集贤殿的人回来，掀开了镇纸。最上面那一页，正是先前停笔的地方。
        p2:
          class_teaching: '{staff}照教书的老办法，先让她把名字念响，再把每个音落成字母。椒水行宫外，摊主把自己的名字慢慢念了一遍，跟着那几声在纸上写。最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。'
          else: '{staff}每天收摊前陪她坐一会儿，不催，哪一笔写歪了就再写一遍。椒水行宫外，摊主把自己的名字慢慢念了一遍，跟着那几声在纸上写。最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。'
        p3: 在椒水，{staff}每天替世宗看眼睛，照着病情调药、敷洗。回宫后，世宗把新字的校样举到眼前。字小，他看得慢，到翻页的时候，没有叫人，自己伸手把纸翻了过去。
      excerpts:
        p2: 最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。
        p3: 回宫后，世宗把新字的校样举到眼前。字小，他看得慢，到翻页的时候，没有叫人，自己伸手把纸翻了过去。
        p1: 几天后集贤殿的人回来，掀开了镇纸。最上面那一页，正是先前停笔的地方。
    relic: 一块刻着字母的木板
    relic_desc: 刻着最早几个字母的木板，等着上墨。
    points:
      p1: 上疏那几天，护住议事厅里用新字译《韵会》的草稿，让这件事照常往下做
      p2: 让他亲眼看到一个从没念过书的百姓用新字写出自己的名字
      p3: 在椒水，减轻他的眼疾，让他还看得清新字
    points_fail:
      p1: 译稿在那几天散了、停了，新字少了第一件用场。
      p2: 这条分支里，他到颁布之前都没见过一个百姓用上新字。
      p3: 他照旧带着眼疾回宫，这条分支与历史一样。
    shift:
      p1:
        was: 1444 年二月，集贤殿用新字翻译《韵会》的工作照常进行。
      p2:
        was: 1446 年，新字以《训民正音》之名颁布，四年后世宗去世。
        now: 椒水的行宫外有个摊主会写自己的名字了，有人把这事报了上去。
      p3:
        was: 世宗多年患眼疾，1444 年春去椒水养病，此后身体每况愈下，1450 年去世。
        now: 椒水边一个外乡人帮他把眼睛治得轻了些，那年夏天他回宫时还能自己看奏章和新字的校样。
    vignettes:
      gesture: '{staff}看见一位学士画字母之前先比了比嘴形，便在页边添了一笔，把嘴怎样张开和纸上的字留在一起。'
      spacing: '{staff}把纸划成方格，将一个音节的几部分写进同一格，等墨稍干，便把纸留在桌上。'
      lesson: '{staff}在集市上用树枝写下三个字母。孩子蹲着看了一会儿，把它们连起来念成一个音，念完便转身跑开了。'
  li_shizhen_qizhou:
    name: 送来一页试印
    place: 蕲州
    figure: 李时珍
    story: 李时珍多年修订《本草纲目》，后来金陵本在他去世后问世。在这条分支里，印工可以先给他寄一页试印。
    story_prose:
      opening:
        - 约 1592 年，蕲州。李时珍已经用了很多年改订《本草纲目》。他生前能反复翻开的，是自己还可以动笔的稿本。
        - 史实里，完整的金陵本在他身后才问世。在这条分支里，印工手里有一张先试出来的纸，能不能从金陵寄到蕲州还没说定。
        - 这趟用得上熟悉出版或校对的人。要能跟两地的人讲清，纸寄来给谁看，改完又托谁带回。
      points:
        p1: '{staff}先和印工说好只寄一页，请往返两地的熟人带到蕲州，又约他返程来取。李时珍把旧稿和这张纸摊开，用指甲划住自己要对的一行。他在页边写了个字，等墨干，才把两张纸分别叠回去。'
      outcomes:
        all: 来取的人隔天才到。李时珍把干了的纸交给他，手指还停在自己改过的那个字上。
        p1: 来取的人隔天才到。李时珍把干了的纸交给他，手指还停在自己改过的那个字上。
      none: 始终没有试印送来。他在稿本上改过那个字，又把墨放到远离纸边的地方。
      not_admitted: '{staff}没见到能托带试印的人。几捆纸从铺门进出，包裹上的收处各不相同。'
      excerpts:
        p1: 李时珍把旧稿和这张纸摊开，用指甲划住自己要对的一行。他在页边写了个字，等墨干，才把两张纸分别叠回去。
    relic: 一页试印
    relic_desc: 分支里的试印，页边留给作者亲自改字。
    points:
      p1: 请印工先送一页试印到蕲州，让李时珍还有机会亲自校一遍
    points_fail:
      p1: 员工没能安排试印及时送到。
    shift:
      p1:
        was: 至 1596 年，金陵本已在李时珍身后问世。他未见全书刊行。
        now: '{staff}争取到一页试印。李时珍在桌边读完，往页边写了一条改字意见，把那页送回去。'
        who: li_shizhen_qizhou
        bio: 全书问世以前，李时珍亲自看过并改过一张试印。
  basho_hiraizumi:
    name: 奥州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 1689 年春，松尾芭蕉带着弟子曾良从江户出发，徒步走北方。农历五月十三日，两人从一关去平泉，当天往返：登上北上川边的高馆，由别当带着看了中尊寺的光堂，经堂因为别当不在没有开。芭蕉后来把这一路写成《奥之细道》，平泉一节有咏夏草的俳句，书里写两座堂都开了。
    story_prose:
      opening:
        - 1689 年夏，日本东北的一关。松尾芭蕉带着弟子曾良从江户出发，已经走了一个多月。农历五月十三日，天晴，两人要去二里外的平泉看旧迹，当天赶回。这一路后来写成了《奥之细道》。
        - 史实里，那天看守带他们看了光堂，经堂因为看守不在，没有开。曾良在日记里照实记下，芭蕉后来在书里写两座堂都开了。在这条分支里，一关的住处主人烧着洗澡水等客人回来，街口的脚夫说往北的路全是泥。
        - 这一趟用得上两种人：记得住路、守得住时辰的人，肯去问清规矩、找得到人带路的人。
      outcomes:
        all: 那天傍晚，芭蕉把斗笠挂在一关住处的门边，上面落着一层灰。后来他写平泉那一节时，笔下有一处梁木，是他从格子缝里亲眼看过的。
        p2: 后来芭蕉写平泉那一节时，笔下有一处梁木，是他从格子缝里亲眼看过的。
        p1: 天黑以前，两人回到了一关。斗笠挂在门边，上面落着一层灰。
      none: 平泉的旧迹在暮色里一点点暗下去。经堂的门关着。
      desync: 过了岔路，日头已经偏西，两人离平泉还远。{staff}没等到他们折回一关，就被事务所召了回来。
      not_admitted: '{staff}没能跟上那两个旅人。一关的街口，两顶斗笠已经出了城。'
      points:
        p1: 出了一关，路分了两回岔。{staff}照着曾良本子上记的站点一处处对过去，哪里该折、几时得往回走，都先说给两人听。芭蕉点点头，把斗笠的带子系紧了。日头偏西的时候，两人已经走在回一关的路上。
        p2:
          class_lettered: '{staff}照查档的习惯，先问清看守哪天出的门、谁替他照看着，再问外廊哪一段许人走。附近一个上了年纪的人放下手里的活，领两人沿外廊绕到经堂侧面。门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。'
          else: '{staff}在堂前等了一阵，向附近的住户一个个问过去，问看守几时回来，外廊哪一段许人走。附近一个上了年纪的人放下手里的活，领两人沿外廊绕到经堂侧面。门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。'
      excerpts:
        p2: 门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。
        p1: 芭蕉点点头，把斗笠的带子系紧了。日头偏西的时候，两人已经走在回一关的路上。
    relic: 一顶草笠
    relic_desc: 被雨淋灰了的编织草帽。
    points:
      p1: 把曾良记下的回程站点和折返点核给两人，护住芭蕉与曾良当天往返平泉的行程
      p2: 得知看守不在时，去确认当天有谁能带访客走外廊。先问当地人哪些地方可以看，再把路线交给两位访客
    points_fail:
      p1: 一条路指错了来处，两人到看旧迹的路口时已经赶不及往返。事务所因同步失败召回员工。
      p2: 没人知道看守何时回来，两人只能从外侧经过，入口仍关着。
    shift:
      p1:
        was: 曾良的行程日记记元禄二年农历五月十三日，两人从一关去平泉，当日折回。
      p2:
        was: 元禄二年五月十三日，曾良记别当带路看了光堂，经堂因别当不在没有开；芭蕉后来在纪行里写两座堂都开了。
        now: 附近的人确认经堂外廊可走，带两人从允许的地方看了经堂。芭蕉回到住处时，多了一处自己亲眼看过的建筑细节。
        who: basho_hiraizumi
        bio: 芭蕉与曾良的平泉行程只有当天的一段时间。后来入书的写法与曾良当日的路线记录各有侧重。
    vignettes:
      grass: '{staff}跟着两个旅人登上高馆。北上川在底下流，草长得齐腰高，风从河面上吹过来。年长的那位把斗笠铺在地上坐下，半天没出声，年轻的那位在本子上记着什么，{staff}不好开口，就陪着看河。'
      bath: '{staff}帮一关住处的主人挑水烧洗澡水，灶膛里的柴噼啪响。主人说那两位客人今天去了平泉，回来准是一身汗；看旧迹看哭了回来的客人他见得多了，洗个澡就好。'
      sandal: '{staff}在一关的街口帮人系草鞋带子，鞋底的泥已经干成了块。路过的脚夫说，往北的路这几天全是泥，接着赶路的人最好先换一双新草鞋。'
  hokusai_edo:
    name: 神奈川冲浪里
    place: 日本江户
    figure: 葛饰北斋
    story: 葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。
    story_prose:
      opening:
        - 江户的版元把三张刚摺出的样纸排在柜上。最浓的那张，浪尖有一小段连成一片；最淡的那张，远处的富士几乎看不见。刻工来取一张，摺师伸手想拿另一张。
        - 《神奈川冲浪里》是北斋《富岳三十六景》的一幅。存世印张可用来比较版木磨损等变化。这一趟能为首批出样留一张共同的参照，还能另存一套按印次可查的样张。
        - 会辨印纹或画面的员工先做选样。善于商量保管的人再与北斋、摺师和版元约定添样办法。
      points:
        p1: 刻工把一张样移到窗旁，才在蓝色里认出富士。你请摺师站在相同的地方看浪尖，再对比另一张深浅刚好的。两人同时点在同一段轮廓上。留给工房的那张只在角上做了一个小记号，远山前面整片都很亮。
        p2: 伙计把对照样往待售的印堆里一插，版元问还能不能在下次开印时找回。你请北斋和摺师一起在套纸上标好序，另留一道能添后来样张的开口。下一张出样送来，版元没有直接往柜上摆，先把它夹到了对照套的末尾。
      outcomes:
        all: 首批印张出柜，工房仍留有可对读的样张。以后交给另一个摺师时，也能看出它们哪个先印。
        p1: 刻工和摺师照同一张样印完首批。后来那些样张又各自散到货堆里。
        p2: 样张已定了归档次序。首批仍因断线留在店里，回程只保留整理样张的这一段。
      none: 版元把看着最顺眼的一张单摆在柜边。再来核浪尖的人各持一张，仍对不上。
      not_admitted: 版元问你跟哪位摺师来的。没人认领来客，样纸刚摞好就收回了。
      desync: 首批样张在浪尖同一处仍断线，没能离开印坊。事务所按同步失败召回员工。
      excerpts:
        p1: 留给工房的那张只在角上做了一个小记号，远山前面整片都很亮。
        p2: 下一张出样送来，版元没有直接往柜上摆，先把它夹到了对照套的末尾。
    relic: 一块印刷用的木版
    relic_desc: 一块雕好的樱木版。
    points:
      p1: 从江户版元送来的样张里挑出浪尖与远山都清楚的一张，给刻工和摺师留作首批出样的准绳。
      p2: 在版元打散样张前，请北斋与摺师共同留存一套对照印。让版元约定重开印时把新样也夹进去，并写下顺序。
    points_fail:
      p1: 刻工与摺师手里没有同一张好样，反复送来的样张在浪峰同一处断线。版元扣住第一批货，事务所因同步失败召回员工。
      p2: 版元在柜上只留下好卖的印成品。北斋与摺师核过的样张又回到货堆，换了谁接手也找不回那一套。
    shift:
      p1:
        was: 江户版元永寿堂赶在1831年新年时为《富岳三十六景》登广告，《神奈川冲浪里》是该系列的版画之一，早期印张上浪线仍完整的例子保存至今。
      p2:
        was: 当时这组印张没有日期和批次编号。原版木没有留存，后世主要靠印张上的痕迹判断先后。
        now: 永寿堂柜后留下一封有次序的样张。换了摺师，开印时仍能查出哪处断线是后来才有的，再让北斋核定是否接受这批效果。
        who: hokusai_edo
        bio: 北斋负责画稿。一张版画的面貌还取决于刻工如何落刀、摺师如何转印和版元何时续印；这些人共同影响后来的印张。
    vignettes:
      mountain: 版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。
      edge: 版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。
      counter: 一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。
  bose_calcutta:
    name: 那张一直没有兑的支票
    place: 加尔各答
    figure: 贾格迪什·钱德拉·博斯
    story: 1885 年，博斯到总统学院教物理。他的薪俸低于欧洲同事。他继续授课，但在争议解决前不肯领较低的薪俸。
    story_prose:
      opening:
        - 1885 年，加尔各答。博斯在总统学院教物理。学校给他的薪俸低于做同样工作的欧洲同事，他仍照常上课。
        - 史实里，从拒领较低薪俸到争议解决过了约三年。在这条分支里，头一笔钱还没领，账房仍有机会重开一张支票。
        - 这趟用得上读得懂薪俸条款的人。把两份工作摆在一起谈时，还需要有人能让负责签字的人听完。
      points:
        p1: '{staff}把同一周的课表抄在一张纸上，对照两份薪俸条件，陪博斯到办公室等一本账簿送来。博斯等对方把新条款写完，拿指尖沿着数目读了一遍。那张支票又从桌面另一头递过来。这一回，他用两只手接住了。'
      outcomes:
        all: 博斯回到课堂时，桌上的实验还没摆好。他把支票装进衣袋，先把留给学生的位置擦干净。
        p1: 博斯回到课堂时，桌上的实验还没摆好。他把支票装进衣袋，先把留给学生的位置擦干净。
      none: 账房又送来原来那笔数目。博斯看了一眼，把那张纸原样推回柜台。
      not_admitted: '{staff}没能进签字的那间办公室。走廊那头有人下课，木地板响了一阵。'
      excerpts:
        p1: 那张支票又从桌面另一头递过来。这一回，他用两只手接住了。
    relic: 一张薪俸收据
    relic_desc: 分支里的收据，记着他愿意领的第一张支票。
    points:
      p1: 在博斯执教的第一年，为他争取一份与同事同等薪俸的书面答复
    points_fail:
      p1: 员工没在第一年谈成同等条件，博斯仍不肯领较低的薪俸。
    shift:
      p1:
        was: 1885 年，博斯开始在总统学院教书。他拒领较低的薪俸，争议约三年才解决。
        now: '{staff}争取到与同事同等的书面薪俸条件。博斯读过条款，领了按这个条件开出的第一张支票。'
        who: bose_calcutta
        bio: 博斯在总统学院执教第一年便获得了同等薪俸。
  tagore_santiniketan:
    name: 一首诗，读两遍
    place: 印度圣蒂尼克坦
    figure: 罗宾德拉纳特·泰戈尔
    story: 1912 年 11 月，英文版《吉檀迦利》在伦敦出版，收的是罗宾德拉纳特·泰戈尔自己从孟加拉语译写的散文诗。1913 年 11 月 13 日，瑞典学院把诺贝尔文学奖授予他。十天后，一列火车从加尔各答载来祝贺的人，到了他在圣蒂尼克坦的学校。他在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，许多来客带着不快回去了。奖金给了学校，1921 年，学校成了国际大学。
    story_prose:
      opening:
        - 1913 年 11 月，孟加拉的圣蒂尼克坦。诗人罗宾德拉纳特·泰戈尔在这里办着一所学校。一年前，他自己从孟加拉语译写的英文《吉檀迦利》在伦敦出版；11 月 13 日，瑞典学院把诺贝尔文学奖授予他，他是第一位获此奖的欧洲以外的作家。
        - 史实里，十天后，一列火车从加尔各答载来祝贺的人；他在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，许多来客带着不快回去了，此后他与许多同胞之间隔着一层。在这条分支里，学校里有个爱爬芒果树的男孩和一个管米的厨子，来客里有一位在车站落下了伞。
        - 这一趟用得上几种人：教过书、跑过新闻、做过导游、懂得怎样跟人搭话的人；性子温和沉稳、意志也够的人；带着金苹果的人也行。散场以后，人已经往车站走了。
      outcomes:
        all: 那晚的客人坐夜里的车回了加尔各答。此后几年，从城里来圣蒂尼克坦的人一拨接一拨，1921 年，这所学校成了国际大学。
        p1: 那晚的客人坐夜里的车回了加尔各答。此后几年，从城里来圣蒂尼克坦的人一拨接一拨，1921 年，这所学校成了国际大学。
      none: 11 月 23 日傍晚，来客们在博尔布尔车站等车，月台上没有人说话。火车开走以后，芒果树下的长凳还摆着，一张也没有收。
      not_admitted: '{staff}没能进学校，只在博尔布尔车站的月台上看着那一列火车进站、出站。来时车厢里有人唱歌，回去时窗都关着。'
      points:
        p1:
          class_teaching: 11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}教过书，知道一句话说重了，要等人走出几步再去追，追上那几位，陪他们在路边站了一会儿，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。
          class_press: 11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}跑过新闻，知道一句话传到第二个人嘴里就变了样，追上那几位，请他们先别把今天的话带回城里，回去当面再问一句，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。
          else: 11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}性子和缓，追上那几位，陪他们在路边站了一会儿，没多说什么，只问他们走之前要不要再喝一杯茶，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。
      excerpts:
        p1: 天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的亲笔。
    points:
      p1: 祝贺会散场后，劝回被他的答辞刺伤的来客，让他和这些多半是朋友的人把话说开
    points_fail:
      p1: 来客照史实带着怨气散去，此后他与许多同胞之间照旧隔着一层，这条分支与历史一样。
    shift:
      p1:
        was: 1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人，泰戈尔在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，来客多半不快，此后他与许多同胞之间生了很深的隔阂。
        now: 那天傍晚，有几位客人折了回来。一位问泰戈尔究竟不愿领受哪一份荣誉。泰戈尔等他说完，请他把刚才听到的话再说一遍。几个人留下来，把彼此的话听完。
        who: tagore_santiniketan
        bio: 这条时间线里，1913 年那场祝贺会散场后，泰戈尔当晚就和来客把话说开，没有因那篇答辞与同胞生出隔阂。
    vignettes:
      telegram: 消息传来那天，{staff}帮孩子们往芒果树下搬长凳，凳腿在红土上拖出一道道印子。一个孩子爬上树喊，全加尔各答都要坐火车来了，被老师揪了下来，还不服气，说那总得有人先把凳子数够。
      platform: 天擦黑，月台上的灯还没点，{staff}在博尔布尔车站帮一位来客找回落下的伞。他在月台上攥着伞站了半天，火车进站时才问，诗人对客人说话一向是这样的吗。
      rice: 十二月，{staff}帮学校的厨子在院里摊晒米，竹耙子一过，米粒沙沙地响。厨子说，来看诗人的人一拨接一拨，今年的米下得比哪年都快。
  ramanujan_madras:
    name: 一封请人核算的信
    place: 马德拉斯
    figure: 斯里尼瓦瑟·拉马努金
    story: 1912 年 3 月起，斯里尼瓦瑟·拉马努金在马德拉斯港务局会计部当职员。1913 年 1 月 16 日，星期四，他从那里给剑桥的 G. H. 哈代写信，介绍自己的研究和对发散级数的探索。1914 年他去了英国，1920 年病重回到印度后去世。
    story_prose:
      opening:
        - 1913 年 1 月，马德拉斯。二十五岁的斯里尼瓦瑟·拉马努金在港务局会计部当职员，白天对账，夜里演算。1 月 16 日，星期四，他从这里给剑桥的 G. H. 哈代写信，讲自己在大学课程之外做出的结果。
        - 史实里，哈代 2 月 8 日回了信，要他把证明写出来；2 月 27 日他写成第二封信寄出，信里说自己已经是个半饿着肚子的人；奖学金五月才下来，此前一家靠他每月三十卢比的薪水过活；1914 年他去了英国，1917 年病重，诊断一直没有定论，1920 年回到印度后去世，年仅 32 岁。在这条分支里，港务局有个负责捆寄海外纸包的职员，账房里有个和他合用一盏灯的同事。
        - 这一趟用得上几种人：会做饭、会照顾人的人，或带着营养合成器、意志坚定的人，或性子和气耐心、身子结实的人；会管账、做过买卖，或条理清楚、熟门熟路的人，带一个礼品盒上门也行；带着纳米医疗箱的医生或医护。
      outcomes:
        all: 1914 年，他上船去了英国，行李里装着那块石板。后来在剑桥，他没有住进疗养院；回到印度以后，他又做了很多年数学。
        p3: 1914 年，他去了英国。几年后在剑桥，他没有住进疗养院；回到印度以后，又做了很多年数学。
        p2: 那年五月，奖学金下来了，每月七十五卢比。那几个月，家里的米缸一直没有见底。
        p1: 那封信寄到了剑桥，封口上盖着马德拉斯的邮戳。1914 年，他上船去了英国。
      none: 2 月 27 日夜里，他倒在灯下，写了一半的纸页散在桌上。剑桥那边，哈代没有等到下文。
      desync: 2 月 27 日夜里，他倒在灯下。{staff}被召回时，写了一半的信压在他的胳膊底下，墨迹洇开了一小片。
      not_admitted: '{staff}没能进港务局，只在门外看着职员们抱着账本进进出出。负责捆纸包的那位职员念着封套上的地址，念到剑桥，停了一下。'
      points:
        p1:
          class_food: 2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}会做饭，每天傍晚把一碗热米饭和一碗豆汤送到灯下，看着他吃完，才让他接着写。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。
          class_medical: 2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}懂照护，按时把饭送到桌边，隔一阵劝他起来走几步、喝口水，夜深了把灯捻小，催他躺下歇一会儿。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。
          else: 2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}每天把饭送到桌边，夜里陪着坐到很晚，他的手一停，就把水杯推到他手边。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。
        p2:
          class_lettered: 四月，家里的米缸又快见底了。每月三十卢比的薪水要养活一家人，奖学金的事还没有下文。{staff}做惯了案头的事，把这个月的进出一项项写在纸上，米、油、房租各留多少，算到月底还能剩几个安那。那天晚上，米缸里的米又满到了缸沿。拉马努金坐在门口的台阶上，膝上搁着石板，一笔一笔写下去。
