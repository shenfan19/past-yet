  khayyam_algebra_woepcke: 法国国家图书馆 Gallica，欧玛尔·海亚姆《代数论》，弗朗茨·韦普克编（1851年），阿拉伯文第6、9页。https://gallica.bnf.fr/ark:/12148/bpt6k99503d
  ahmed_baba_nayl_harama: 艾哈迈德·巴巴《绣饰〈锦缎〉以获喜悦》，阿卜杜勒-哈米德·哈拉马编，作者序中以 فما زالت نفسي 开头的一段，以及包含 وزدت في بعض تراجم 的末段，均在 مقدمة 小标题前。https://arabic-keyboard.info/books/ar/read-book/%D9%86%D9%8A%D9%84-%D8%A7%D9%84%D8%A7%D8%A8%D8%AA%D9%87%D8%A7%D8%AC-%D8%A8%D8%AA%D8%B7%D8%B1%D9%8A%D8%B2-%D8%A7%D9%84%D8%AF%D9%8A%D8%A8%D8%A7%D8%AC
  ahmed_baba_nayl_kenny: 艾哈迈德·巴巴《绣饰〈锦缎〉以获喜悦》，约瑟夫·肯尼的阿拉伯文转录，作者序中以 فما زالت نفسي 和 ولو لا فضل 开头的两段。https://dhspriory.org/kenny/NWAfrA/NWAhmadBaba.htm
  nezahualcoyotl_cantares_28v: 墨西哥国家图书馆与墨西哥国立自治大学 Temoa，《墨西哥歌谣集》1628 bis号抄本，第28叶背面，歌题及第525节，影像与纳瓦特尔语转录。https://temoa.iib.unam.mx/cantares-cantares-mexicanos/28v
  nezahualcoyotl_cantares_17r: 墨西哥国家图书馆与墨西哥国立自治大学 Temoa，《墨西哥歌谣集》1628 bis号抄本，第17叶正面，第266至267节，影像与纳瓦特尔语转录。https://temoa.iib.unam.mx/cantares-cantares-mexicanos/17r
  khayyam_algebra_woepcke_scan: 韦普克1851年版扫描件，阿拉伯文第6、9页，阿拉伯语维基文库镜像。https://upload.wikimedia.org/wikisource/ar/9/97/%D8%B1%D8%B3%D8%A7%D9%84%D8%A9_%D9%81%D9%8A_%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%86_%D8%A7%D9%84%D8%AC%D8%A8%D8%B1_%D9%88%D8%A7%D9%84%D9%85%D9%82%D8%A7%D8%A8%D9%84%D8%A9.pdf
  abel_paris_notebook: 《阿贝尔奖 2008–2012》序言及克里斯蒂安·斯考，第 519–520、550 页，录阿贝尔数学笔记（挪威国家图书馆，Ms.fol. 351 A）与致勒让德信。 https://abelprize.no/sites/default/files/2021-09/The%20Abel%20Prize%202008-2012_Full_.pdf
  boltzmann_gas_preface: 玻尔兹曼《气体理论讲义》第二卷（1898），序言第 V–VI 页，TextGrid 学术文本库。 https://www.textgridrep.de/browse/4bjrf.0
  cajal_rules_1923: 圣地亚哥·拉蒙-卡哈尔《科学研究的规则与忠告》，1923 年马德里第六版，第六章，谈如何用有限经费起步。 https://www.gutenberg.org/cache/epub/66373/pg66373.txt
  curie_pierre_biography: 玛丽·居里《皮埃尔·居里》，巴黎，帕约出版社，1924 年，结尾论科学发现背后的工作；法文刊本。 https://fr.wikisource.org/wiki/Pierre_Curie_(Marie_Curie)/Texte_entier
  curie_thesis_1903: 玛丽·居里《放射性物质研究》，巴黎，戈捷-维拉尔出版社，1903 年，引言；初版影印。 https://upload.wikimedia.org/wikipedia/commons/b/bd/Doctoral_thesis_by_Marie_Curie_%281903%29.pdf
  du_chatelet_physics_preface: 杜·夏特莱《物理学原理》，巴黎 1740 年初版，序言第 3、23 节；帕德博恩大学校录。 https://dcpm.historyofwomenphilosophers.org/documents/view/avant_propos/version/l
  freud_dreams_german: 弗洛伊德《梦的解析》第三章与第二版序言，见 1914 年重印本。 https://www.gutenberg.org/files/40739/old/40739-h/40739-h.htm
  kepler_meteorological_diary_study: 德国气象局《气象年刊》第 13 卷，第 43–44 页：开普勒气象日记与赴符腾堡行程研究。 https://www.dwd.de/DE/leistungen/pbfb_verlag_annalen/pdf_einzelbaende/13_pdf.pdf?__blob=publicationFile&v=3
  mendel_textgrid_1866: 孟德尔《植物杂交实验》（布尔诺，1866）引言，TextGrid 据学会会刊校录。 https://www.textgridrep.de/browse/4bn33.0
  mendeleev_periodic_collected: 门捷列夫《周期律》，苏联科学院 1958 年校刊，重印 1869 年论文与法拉第讲演。 https://ru.djvu.online/file/nMumE1vLiNj4B
  noether_gdz_variations: 埃米·诺特《不变变分问题》（1918），第 235 页，哥廷根州立暨大学图书馆刊本扫描。 https://gdz.sub.uni-goettingen.de/download/pdf/PPN252457811_1918/LOG_0022.pdf
  riemann_geometry_print: 黎曼《论几何基础中的假设》，引言与第一节，1854 年 6 月 10 日讲演正文。 https://www.caressa.it/pdf/riemann01.pdf
  cajal_mncn_perseverance: 西班牙国家自然科学博物馆（CSIC）馆刊第 1 期，《我的一生回忆》书评，引证热忱与坚持一语。 https://www.mncn.csic.es/docs/repositorio/es_ES/comunicacion/PeriodicoMNCN_/periodico01.pdf
  noether_hasse_postcard: 埃米·诺特致赫尔穆特·哈塞，第 49 号明信片，第 161 页，哥廷根大学出版社通信校勘本。 https://univerlag.uni-goettingen.de/bitstream/handle/3/isbn-3-938616-35-0/hasse_noether_web.pdf
  abel_legendre_letter: 阿贝尔 1828 年 11 月 25 日致勒让德信，载《纯粹与应用数学杂志》第 6 卷（1830），第 73 至 80 页，哥廷根数字馆藏。 https://gdz.sub.uni-goettingen.de/id/PPN243919689_0006
  mendeleev_druzhinin_publication: 帕维尔·德鲁日宁《门捷列夫表之谜》（2019），第六节，据档案考订分册刊出与散页流传。 https://djvu.online/file/K8OjXhq71iMko
sections:
  places:
    broad_street:
      name: 伦敦宽街，1854
      text: 伦敦苏荷区的一条街，街口有一台公用水泵。1854 年 8 月底到 9 月初，这一带暴发霍乱。
    vienna_clinic:
      name: 维也纳总医院，1847
      text: 十九世纪中叶欧洲最大的医院之一，设有两间产科病房，一间由医生和学生接生，一间由助产士接生。两间病房的产妇死亡率差别很大。
    scutari_barrack:
      name: 斯库塔里兵营医院，1855
      text: 博斯普鲁斯海峡亚洲一侧的一座大型兵营，克里米亚战争中用作医院。1854 年到 1855 年冬天这里拥挤不堪，下水道堵塞。
    havana_district:
      name: 哈瓦那，1881
      text: 一个炎热拥挤的港口，黄热病每年夏天都会回来。
    berkeley_vale:
      name: 伯克利，1796
      text: 格洛斯特郡伯克利谷的一个集镇，爱德华·詹纳在这里做乡村医生。
    balaklava_camp:
      name: 巴拉克拉瓦，1855
      text: 克里米亚南岸的一个小港口，是英军的补给基地。
    greenland_ice_sheet:
      name: 格陵兰冰盖，1930
      text: 格陵兰的内陆冰盖，1930 至 1931 年德国考察队在冰盖中央设了一个站点。
    ross_ice_shelf:
      name: 罗斯冰架，1912
      text: 南极边缘一大片漂浮的冰，新地号考察队往返极点都穿过这里。
    everest_north_side:
      name: 珠穆朗玛峰北坡
      text: 世界最高峰的北坡，山下是绒布冰川，一串营地一直排到北坳和更高处。
    chimborazo_slope:
      name: 钦博拉索，1802
      text: 厄瓜多尔安第斯山上的一座积雪火山，它的山顶是地球表面离地心最远的点。
    galapagos_islands:
      name: 加拉帕戈斯群岛，1835
      text: 太平洋赤道上的一群火山岛，岸边干燥，淡水很少。
    tahiti_endeavour:
      name: 塔希提，1769
      text: 太平洋社会群岛中最大的一座岛，奋进号 1769 年在这里停泊，观测金星凌日。
    guangdong_university_office:
      name: 高等师范的礼堂，广州，1924
      text: 广州国立高等师范学校的礼堂，建在原贡院的旧址上。1924 年三所学校在这里筹备并成一所大学，星期天孙中山也在这座礼堂演讲。
  people:
    snow:
      name: 约翰·斯诺
      text: 英国医生。1849 年已提出霍乱经水传播，1854 年通过逐户调查把病例与宽街水泵联系起来。
    semmelweis:
      name: 伊格纳茨·森梅尔维斯
      text: 匈牙利出身的产科医生，1847 年发现解剖室与产房的死亡有关，并要求接生前用氯化石灰溶液洗手。
    abel_froland:
      name: 尼尔斯·亨里克·阿贝尔
      text: 挪威数学家，1802 年生，1829 年去世。他证明了一般五次方程不能用根式求解，并在椭圆函数上取得早期进展。他二十六岁死于肺结核，不久之后他的工作才获得承认。
    ahmed_baba_timbuktu:
      name: 艾哈迈德·巴巴
      text: 廷巴克图学者，1556 年生，1627 年去世。他写过数十部法学与语法著作，并拥有一座规模很大的私人藏书室。1591 年摩洛哥征服之后他被带往马拉喀什，藏书被没收，后来才回到廷巴克图。
    al_haytham_cairo:
      name: 伊本·海赛姆
      text: 阿拉伯数学家与光学家，约 965 年生，约 1040 年去世，在开罗工作。他的《光学书》提出视觉来自进入眼睛的光，并依靠实验论证，被视为实验方法的早期代表。
    al_jazari_diyarbakir:
      name: 加扎里
      text: 为阿尔图格王朝宫廷服务的工程师，活跃于 1200 年前后。他 1206 年的《精巧机械装置知识之书》记载了水钟、自动机和水泵，其中出现了曲柄连杆与曲轴。
    al_khwarizmi_baghdad:
      name: 花拉子米
      text: 巴格达智慧宫的学者，约 780 年生，约 850 年去世。他讲述还原与对消的计算之书为代数命名，而他本人名字的拉丁化形式则成了“算法”一词。
    angkor_wat:
      name: 高棉的建造者们
      text: 吴哥窟寺庙群的建造者，建于十二世纪上半叶，在高棉国王苏利耶跋摩二世治下。设计仿照世界中心的须弥山，围墙上刻有长卷浮雕。建筑师的名字没有留下。
    antikythera_rhodes:
      name: 不知名的匠人
      text: 安提基特拉机械的不知名制造者。这是一件公元前二世纪前后的齿轮装置，1901 年从沉船中打捞出来，模拟日月运行并预测日月食。制造者的情况无人知晓。
    archimedes_syracuse:
      name: 阿基米德
      text: 叙拉古的希腊数学家与发明家，约公元前 287 年生，公元前 212 年去世。他求出了球体积，提出浮力原理和杠杆定律。罗马军队攻陷叙拉古时他被杀。
    aristarchus_alexandria:
      name: 阿利斯塔克斯
      text: 希腊天文学家，约公元前 310 年生，约公元前 230 年去世。现存著作估算了太阳与月亮的大小和距离，后世作者记载他提出过日心说，当时几乎没人接受。
    aristotle_lyceum:
      name: 亚里士多德
      text: 希腊哲学家，公元前 384 年生，公元前 322 年去世，柏拉图的学生，亚历山大大帝的老师。他在雅典创办吕克昂学园，著作涉及逻辑、生物、物理、伦理和政治，影响学术数百年。
    artemisia_florence:
      name: 阿尔泰米西娅·真蒂莱斯基
      text: 意大利画家，1593 年生，约 1656 年去世。她随父亲奥拉齐奥·真蒂莱斯基学画，1612 年卷入一桩著名的审判，此后画了许多坚毅的圣经与神话女性。1616 年她成为佛罗伦萨绘画艺术学院接纳的第一位女性。
    aryabhata_patna:
      name: 阿耶波多
      text: 印度数学家与天文学家，476 年生。他 499 年在库苏马普拉写成的著作给出接近 3.1416 的圆周率，用影子解释日月食，并论及地球自转。
    bach_leipzig:
      name: 约翰·塞巴斯蒂安·巴赫
      text: 德国作曲家与管风琴家，1685 年生，1750 年去世。1723 年起他担任莱比锡圣托马斯教堂的乐长，写下清唱剧、受难曲和键盘作品。1750 年两次眼科手术后他双目失明，同年 7 月去世。他的音乐在十九世纪复兴之前，除音乐圈外鲜为人知。
    ban_zhao_luoyang:
      name: 班昭
      text: 汉代历史学家与作家，约 45 年生，约 117 年去世。班固去世后，她奉诏续修《汉书》。《后汉书》也记载马续后来参与此事。
    basho_hiraizumi:
      name: 松尾芭蕉
      text: 日本俳句诗人，1644 年生，1694 年去世。1689 年他步行游历北方，写下散文与俳句相间的《奥之细道》。
    beethoven_vienna:
      name: 路德维希·凡·贝多芬
      text: 德国作曲家，1770 年生于波恩，1827 年去世，大半生在维也纳工作。他从二十多岁末起听力渐退，1824 年 5 月 7 日《第九交响曲》在维也纳首演时已几乎全聋。1827 年 3 月 26 日，他在维也纳去世。
    bell_boston:
      name: 亚历山大·格雷厄姆·贝尔
      text: 苏格兰出生的科学家与发明家，1847 年生，1922 年去世，在波士顿教聋人说话。1876 年他取得电话专利，并打出了第一通电话给助手。
    bessie_coleman_jacksonville:
      name: 贝茜·科尔曼
      text: 美国飞行员，1892 年生，1926 年去世，第一位取得飞行执照的黑人女性。她在美国被飞行学校拒之门外，于是学了法语，到法国受训。1926 年她在杰克逊维尔的一次坠机中去世。
    bizet_paris:
      name: 乔治·比才
      text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
    boltzmann_duino:
      name: 路德维希·玻尔兹曼
      text: 奥地利物理学家，1844 年生，1906 年去世。他用原子的统计解释热的规律，熵公式刻在他的墓碑上。他生前，有关原子的研究仍有争议。1906 年，他在杜伊诺去世。
    boole_ballintemple:
      name: 乔治·布尔
      text: 英国数学家（1815–1864），科克女王学院第一位数学教授。他创立的逻辑代数后来用于数字电路。1864 年，他因胸膜肺炎在巴林滕普尔去世。
    bose_calcutta:
      name: 贾格迪什·钱德拉·博斯
      text: 印度物理学家与生物学家，1858 年生，1937 年去世，在加尔各答工作。他制造并探测毫米波无线电，后来用灵敏仪器测量植物的反应。
    brahmagupta_bhillamala:
      name: 婆罗摩笈多
      text: 印度数学家与天文学家，598 年生，约 668 年去世。他 628 年的著作把零当作一个数，给出它和负数的运算规则，还给出解二次方程的方法。
    buchner_zurich:
      name: 格奥尔格·毕希纳
      text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单逃往苏黎世。他二十三岁死于伤寒。
    buddha_sarnath:
      name: 悉达多·乔达摩
      text: 悉达多·乔达摩，即佛陀，生活在公元前五世纪前后的印度北部。传说他经多年修行于菩提伽耶觉悟，并在鹿野苑作了第一次说法，讲苦以及超越苦的道路。
    budj_bim_eels:
      name: 贡迪玛拉人
      text: 澳大利亚维多利亚州西南部的贡迪玛拉人。数千年间，他们在布吉比姆用火山岩修建水渠、堰和池塘来捕捉和养殖鳗鱼，是已知最古老的水产养殖系统之一。
    cajal_barcelona:
      name: 圣地亚哥·拉蒙-卡哈尔
      text: 西班牙神经科学家，1852 年生，1934 年去世。他观察银染切片，发现支持神经系统由独立细胞组成的证据。1887 年至 1892 年在巴塞罗那任教，1906 年与卡米洛·高尔基共享诺贝尔奖；他用的银染法，正是从高尔基的方法改进而来。
    camille_claudel_paris:
      name: 卡米耶·克洛岱尔
      text: 法国雕塑家，1864 年生，1943 年去世。她在罗丹的工作室做事，作品有《华尔兹》《成熟的年纪》。1913 年家人把她送进精神病院，她在那里度过最后三十年。
    cantor_halle:
      name: 格奥尔格·康托尔
      text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。1918 年 1 月他在哈雷的疗养院去世。
    cao_xueqin_beijing:
      name: 曹雪芹
      text: 清代小说家，《红楼梦》早期以《石头记》等题名抄传。脂评抄本与后来的刊本呈现不同的文本面貌。甲戌本上的一条眉批回忆他去世时书尚未成。
    chekhov_badenweiler:
      name: 安东·契诃夫
      text: 俄国作家与医生，1860 年生，1904 年去世。他写短篇小说，也写了《海鸥》《万尼亚舅舅》《三姐妹》《樱桃园》。他在巴登魏勒的疗养地死于肺结核。
    copernicus_frombork:
      name: 哥白尼
      text: 波兰天文学家与教士，1473 年生，1543 年去世，在弗龙堡工作。他的《天体运行论》于 1543 年印行，把太阳放在行星运行的中心。他的朋友蒂德曼·吉泽写信说，印好的书到他去世那天才送到他手上。
    curie_paris:
      name: 玛丽·居里
      text: 波兰出生的物理学家与化学家，1867 年生，1934 年去世，在巴黎工作。她与皮埃尔·居里研究放射性，1898 年发现钋和镭。她 1903 年获诺贝尔物理学奖，1911 年获化学奖，死于与辐射有关的疾病。
    dante_ravenna:
      name: 但丁
      text: 意大利诗人，1265 年生，1321 年去世，出身佛罗伦萨。1302 年被逐出故城，他用托斯卡纳语写下《神曲》，在拉文纳去世并葬在那里。
    darwin_galapagos:
      name: 查尔斯·达尔文
      text: 英国博物学家，1809 年生，1882 年去世。随“小猎犬号”航行时，他在 1835 年到访加拉帕戈斯群岛，观察亲缘物种如何随岛屿而不同。1859 年出版的《物种起源》阐述了自然选择的进化论。
    democritus_abdera:
      name: 德谟克利特
      text: 阿布德拉的希腊哲学家，约公元前460年生。亚里士多德谈到实与虚空的学说时，将他与留基伯并提。德谟克利特的著作以残篇和后人的转述留存。
    descartes_leiden:
      name: 笛卡尔
      text: 法国哲学家与数学家，1596 年生，1650 年去世，一生大部分时间住在荷兰共和国。1637 年的《方法谈》含有“我思故我在”，附录中的几何学引入了坐标。
    dickinson_amherst:
      name: 艾米莉·狄金森
      text: 美国诗人，1830 年生，1886 年去世，大半生住在马萨诸塞州的阿默斯特。她写了近一千八百首诗，许多手工装订成册，生前只发表了寥寥几首。
    du_chatelet_luneville:
      name: 埃米莉·杜·夏特莱
      text: 法国数学家与物理学家，1706 年生，1749 年去世。她把牛顿的《原理》译成法文并作注，论证运动物体的能量与速度的平方有关。她在吕内维尔因产后并发症去世。
    du_fu_xiang_river:
      name: 杜甫
      text: 唐代诗人，712 年生，770 年去世。他写战乱、饥荒和普通人的生活，格律功力深厚，主要在身后才受推崇。他死在湘江的一条船上。
    edison_menlo_park:
      name: 托马斯·爱迪生
      text: 美国发明家，1847 年生，1931 年去世。他在门洛帕克的实验室带领团队，于 1879 年做出耐用的电灯泡以及配套供电系统，持有一千多项专利。
    emily_bronte_haworth:
      name: 艾米莉·勃朗特
      text: 英国小说家与诗人，1818 年生，1848 年去世，住在霍沃斯的牧师住宅。她唯一的小说《呼啸山庄》1847 年以埃利斯·贝尔之名出版。一年后她死于肺结核。
    empedocles_akragas:
      name: 恩培多克勒
      text: 西西里阿克拉加斯的希腊哲学家，约公元前 494 年生，约公元前 434 年去世。他主张万物由土、气、火、水四种根构成，由爱与恨推动。
    enheduanna_ur:
      name: 恩赫杜安娜
      text: 阿卡德王萨尔贡之女，公元前 2300 年前后在乌尔身居高位。几篇用苏美尔语写成的早期作品传统上归于她名下，作者归属学界有争论，存世抄本年代较晚。
    eratosthenes_alexandria:
      name: 埃拉托色尼
      text: 希腊学者，约公元前 276 年生，约公元前 194 年去世，曾任亚历山大图书馆馆长。据后出的记述，他对照塞伊尼与亚历山大城的日照来估算地球周长。换算成现代单位要看取哪一种斯塔迪亚长度。
    euclid_alexandria:
      name: 欧几里得
      text: 约公元前 300 年在亚历山大工作的希腊数学家。他的《几何原本》从定义、公设和证明出发构建几何，两千多年里一直是标准教材。他的生平所知甚少。
    fanny_mendelssohn_berlin:
      name: 范妮·门德尔松·亨泽尔
      text: 德国作曲家与钢琴家，1805 年生，1847 年去世，费利克斯·门德尔松的姐姐。她写了几百首作品，包括歌曲和钢琴曲，但家人不赞成她出版。她在柏林排练时中风去世。
    faraday_london:
      name: 迈克尔·法拉第
      text: 英国科学家，1791 年生，1867 年去世，早年是装订学徒。1831 年他在伦敦皇家研究院发现电磁感应，也奠定了电化学的基础。
    fibonacci_pisa:
      name: 斐波那契
      text: 意大利数学家，约 1170 年生，约 1250 年去世，出身比萨。他 1202 年的《计算之书》把印度阿拉伯数字带到欧洲，书中兔子繁殖的问题产生了斐波那契数列。
    finlay_havana:
      name: 卡洛斯·芬莱
      text: 古巴医生，1833 年生，1915 年去世。1881 年他提出黄热病由蚊子传播，这个想法在 1900 年被里德委员会证实，成为防治这种病的基础。
    franklin_philadelphia:
      name: 本杰明·富兰克林
      text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
    freud_vienna:
      name: 西格蒙德·弗洛伊德
      text: 奥地利医生，1856 年生，1939 年去世，精神分析的创立者。1899 年的《梦的解析》提出梦表达隐藏的愿望。1938 年德国吞并奥地利后，他离开维也纳去了伦敦。
    galen_rome:
      name: 盖伦
      text: 来自佩加蒙的希腊医生，129年生，后来在罗马行医。他留下多部解剖学与医学著作，也写到自己在192年火灾中的损失。
    galileo_padua:
      name: 伽利略
      text: 意大利科学家，1564 年生，1642 年去世，曾在帕多瓦任教。他用望远镜看到木星的卫星和金星的位相，1610 年公布。后来他受宗教裁判所审判，晚年被软禁。
    galois_paris:
      name: 埃瓦里斯特·伽罗瓦
      text: 法国数学家，1811 年生，1832 年去世。他在少年时找到方程能否用根式求解的条件，并开创了群论。他二十岁时在巴黎因决斗去世。
    gaudi_barcelona:
      name: 安东尼·高迪
      text: 加泰罗尼亚建筑师，1852 年生，1926 年去世。他在巴塞罗那的建筑，包括巴特略之家和米拉之家，使用取自自然的曲线形态。他 1926 年被电车撞死，他最大的那座建筑至今未完工。
    ghalib_delhi:
      name: 迦利布
      text: 德里诗人，1797 年生，1869 年去世，用乌尔都语和波斯语写作。他的加扎勒诗是这门语言中最受喜爱的作品之一。他经历了 1857 年的起义，晚年债务缠身。
    giotto_padua:
      name: 乔托
      text: 意大利画家，约 1267 年生，1337 年去世。他约在 1305 年画成的帕多瓦斯克罗维尼礼拜堂壁画，人物有重量感和情感，被视为通向文艺复兴绘画的一步。
    great_zimbabwe:
      name: 大津巴布韦的建造者
      text: 大津巴布韦的建造者。这座石头城属于说绍纳语的族群，大约在十一世纪到十五世纪兴盛。
    gutenberg_mainz:
      name: 古腾堡
      text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
    hammurabi_babylon:
      name: 汉谟拉比
      text: 巴比伦国王，约公元前 1792 年至约公元前 1750 年在位。一块刻有近三百条法律的石碑以他命名，规定了交易、家庭和财产方面的规则与惩罚。
    heo_nanseolheon_hanyang:
      name: 许兰雪轩
      text: 朝鲜时代的诗人，1563 年生，1589 年去世，以汉文写诗。弟弟许筠在她去世后收集她的作品。
    heron_alexandria:
      name: 希罗
      text: 公元一世纪在亚历山大工作的希腊工程师。他描述了汽转球、自动门和投币售水装置，也写过几何学与土地测量的著作。
    hertz_bonn:
      name: 海因里希·赫兹
      text: 德国物理学家，1857 年生，1894 年去世。1887 至 1888 年他产生并探测到无线电波，证实了麦克斯韦的电磁理论。频率单位以他命名，他年纪轻轻就在波恩去世。
    higuchi_ichiyo_tokyo:
      name: 樋口一叶
      text: 日本作家，1872 年生，1896 年去世。她靠写作养家，在 1890 年代中期发表了《比肩》等代表作，写贫苦市民的生活。她二十四岁死于肺结核。
    hildegard_bingen:
      name: 宾根的希尔德加德
      text: 德国女修道院长，1098 年生，1179 年去世，在莱茵河畔的宾根。她写幻象神学、医学与博物学著作，还作了大量圣咏，是中世纪个人留存作品最多的作曲家之一。
    hipparchus_rhodes:
      name: 喜帕恰斯
      text: 希腊天文学家，约公元前 190 年生，约公元前 120 年去世，在罗得岛观测。他编制星表，发现岁差，并为天文学发展了三角学。
    hippocrates_kos:
      name: 希波克拉底
      text: 科斯岛的希腊医生，约公元前 460 年生，约公元前 370 年去世。以他名义流传的医学文集把疾病看作自然现象而非神意，强调仔细观察病人。
    hokusai_edo:
      name: 葛饰北斋
      text: 日本画家，1760 年生，1849 年去世，江户人。1831 年起出版的《富岳三十六景》包括《神奈川冲浪里》。他多次改名，到老仍在作画。
    hooke_london:
      name: 罗伯特·胡克
      text: 英国科学家，1635 年生，1703 年去世。他任皇家学会实验管理员，1665 年出版《显微图谱》，展示了软木的细胞结构，并提出以他命名的弹性定律。
    house_of_wisdom:
      name: 花拉子米与智慧宫
      text: 智慧宫与巴格达阿拔斯宫廷的藏书传统有关。九世纪的翻译活动遍及多处，由不同的学者和赞助人推动。侯奈因在书信中记录了译者搜寻和比勘底本的工作。
    hua_tuo_xuchang:
      name: 华佗
      text: 汉末医生。《三国志》的后出传记叙述其行医经过，把五禽戏归于他，也记下他因曹操下令而被关押、遇害。
    hypatia_alexandria:
      name: 希帕提娅
      text: 希腊数学家与哲学家，约 355 年生，415 年去世，在亚历山大教学。她为数学与天文学著作作注。415 年 3 月，她在城中的动荡里遇害。
    ibn_al_nafis_cairo:
      name: 伊本·纳菲斯
      text: 十三世纪的医生，在大马士革求学，后来在开罗行医。他为伊本·西那《医典》所作的解剖注释认为，血液从心脏右侧经肺到达左侧。
    ibn_battuta_tangier:
      name: 伊本·白图泰
      text: 摩洛哥旅行家，丹吉尔人，1304 年生，约 1369 年去世。他的《游记》在归来后编成，记有近三十年间在北非、阿拉伯、印度、中国和西非的见闻。
    ibn_khaldun_cairo:
      name: 伊本·赫勒敦
      text: 阿拉伯历史学家与政治家，1332 年生，1406 年去世，生于突尼斯。他的《历史绪论》分析王朝的兴衰和群体凝聚力的作用，被视为社会科学的早期著作。他在开罗去世。
    ibn_rushd_lucena:
      name: 伊本·鲁世德
      text: 安达卢斯的哲学家与医生，1126 年生，1198 年去世，拉丁名阿威罗伊。他为亚里士多德作的注释在欧洲广为流传，曾任科尔多瓦和塞维利亚的法官，1195 年被放逐到卢塞纳，著作被下令焚毁。
    ibn_sina_hamadan:
      name: 伊本·西那
      text: 波斯医生与哲学家，约 980 年生，1037 年去世，拉丁名阿维森纳。他的《医典》在欧洲和西亚数百年里是标准教材，他在哈马丹去世。
    ife_bronzes:
      name: 伊费的铸造匠人
      text: 伊费是今尼日利亚境内的约鲁巴城市，当地铸匠留下了写实的黄铜和紫铜头像。大英博物馆将翁莫尼杰院落出土的其中一尊定在 1300—1450 年，铸匠和肖像原型的姓名不可考。
    imhotep_saqqara:
      name: 伊姆霍特普
      text: 古埃及第三王朝的官员与建筑师，活跃于公元前 2650 年前后。相传他设计了萨卡拉的左塞尔阶梯金字塔，这是最早的大型石构建筑之一，后来他被奉为医药之神。
    jenner_berkeley:
      name: 爱德华·詹纳
      text: 英国医生，1749 年生，1823 年去世，格洛斯特郡伯克利人。1796 年他给一个男孩接种牛痘，证明它能预防天花，这是疫苗接种的开端。
    jianzhen_nara:
      name: 鉴真
      text: 唐代扬州人，688 年生，763 年去世。742 年日本来客请他东渡，前五次都没渡成，第五次失败后的归途中双目失明。753 年他再次起航，754 年到奈良讲学，759 年在奈良另建讲学之所，后来在那里去世。
    kabir_maghar:
      name: 迦比尔
      text: 北印度虔敬诗人。有关他生平的细节，各传承记载有异。归于迦比尔的诗歌流传广泛，有些保存在《古鲁·格兰特·萨希卜》中。
    kafka_kierling:
      name: 弗朗茨·卡夫卡
      text: 用德语写作的布拉格作家，1883 年生，1924 年去世。他在保险公司工作，大部分作品没有发表，并请朋友烧掉。马克斯·布罗德出版了《审判》和《城堡》。他在基尔灵的疗养院死于肺结核。
    kant_konigsberg:
      name: 伊曼努尔·康德
      text: 德国哲学家，1724 年生，1804 年去世，一生在柯尼斯堡度过。1781 年出版的《纯粹理性批判》考察理性能知道什么以及它的界限。
    keats_rome:
      name: 约翰·济慈
      text: 英国诗人，1795 年生，1821 年去世。他在短短几年里写出包括颂诗在内的主要作品，二十五岁时在罗马死于肺结核。
    kepler_leonberg:
      name: 约翰内斯·开普勒
      text: 德国天文学家，1571 年生，1630 年去世。他根据第谷·布拉赫的观测归纳出行星运动三定律。1620 年至 1621 年，他的母亲卡塔琳娜被莱昂贝格的邻居告发，关在居格林根的牢里，他替她辩护，直到她获释。
    knossos_linear_a:
      name: 米诺斯的书吏
      text: 米诺斯克里特的书吏，约公元前 1500 年在克诺索斯记账。用来书写米诺斯语的线形文字甲至今没有破译。它的后继者线形文字乙在 1952 年被读出，写的是希腊语。
    lalibela_rock:
      name: 拉利贝拉与石匠们
      text: 拉利贝拉是十三世纪前后的埃塞俄比亚扎格韦王朝国王。以他命名的城镇保存了十一座岩凿建筑，现有形制由多次开凿逐步形成。
    lavoisier_paris:
      name: 拉瓦锡
      text: 法国化学家，1743 年生，1794 年去世。他阐明氧在燃烧中的作用，参与建立现代化学命名体系，并陈述了质量守恒。1794 年 5 月他在巴黎被处死。
    leavitt_cambridge_ma:
      name: 亨丽埃塔·勒维特
      text: 美国天文学家，1868 年生，1921 年去世，在哈佛天文台工作。她发现造父变星的周期与亮度相关，天文学家由此得以测量到其他星系的距离。
    leeuwenhoek_delft:
      name: 列文虎克
      text: 荷兰布商与显微镜学家，1632 年生，1723 年去世，代尔夫特人。他用自己磨制的单透镜显微镜看到细菌、红细胞和精子，并在给皇家学会的信中描述。
    leonardo_florence:
      name: 列奥纳多·达·芬奇
      text: 意大利画家与工程师，1452 年生，1519 年去世。他画了《最后的晚餐》和约 1503 年在佛罗伦萨开始的《蒙娜丽莎》，并用数千页笔记研究解剖、水流和机械。
    li_bai_changan:
      name: 李白
      text: 唐代诗人，701 年生，762 年去世。他写酒、友情和月亮的抒情诗，曾在长安宫廷任职，后来离开。他的许多诗至今仍被传诵。
    li_qingzhao_hangzhou:
      name: 李清照
      text: 宋代词人，约 1084 年生，约 1155 年去世。她写爱情与失去的词，1127 年北方沦陷，家园与丈夫都失去了，晚年住在南方。
    li_shizhen_qizhou:
      name: 李时珍
      text: 明代医生，1518 年生，1593 年去世。他花了近三十年写成《本草纲目》，记载约一千九百种药物，书在他去世后刊行。
    lili_boulanger_paris:
      name: 莉莉·布朗热
      text: 法国作曲家，1893 年生，1918 年去世。1913 年她成为第一位获得罗马大奖作曲奖的女性。她一生体弱，二十四岁去世。
    lovelace_london:
      name: 阿达·洛芙莱斯
      text: 英国数学家，1815 年生，1852 年去世。阿达·洛芙莱斯在梅纳布雷亚论文的译注中，把分析机处理的图式比作雅卡尔织机织出的花叶。注 G 列出了让这台设想中的机器计算伯努利数的步骤；分析机在她生前并未建成。1852 年 11 月 27 日，她在伦敦去世，年仅三十六岁。
    machu_picchu:
      name: 印加的建造者们
      text: 马丘比丘的印加建造者。马丘比丘是约 1450 年建在安第斯山脊上的王室庄园。西班牙征服后遗址被废弃，直到 1911 年才为外界熟知。
    mallory_everest:
      name: 乔治·马洛里
      text: 英国登山家，1886 年生，1924 年去世。在 1924 年的英国探险中，他与安德鲁·欧文在珠穆朗玛峰高处失踪。1999 年他的遗体被找到，他们是否登顶至今不明。
    marconi_bologna:
      name: 古列尔莫·马可尼
      text: 意大利发明家，1874 年生，1937 年去世，博洛尼亚人。从 1895 年起他发展无线电报，1901 年发出跨越大西洋的信号，并分享了 1909 年诺贝尔物理学奖。
    mary_anning_lyme_regis:
      name: 玛丽·安宁
      text: 英国化石采集者，1799 年生，1847 年去世，莱姆里吉斯人。她在海边悬崖挖出了第一批完整的鱼龙和蛇颈龙骨架。作为一个家境普通的女性，她生前很少在科学论文里被署名。
    maya_codices_mani:
      name: 玛雅书吏
      text: 尤卡坦的玛雅书吏用树皮纸制作折页书。1562 年 7 月，马尼烧毁了大批这样的书。《德累斯顿抄本》《墨西哥玛雅抄本》等少数存世写本保存了这一制书传统。
    maya_venus_tables:
      name: 玛雅书吏们
      text: 古典期及之后的玛雅书吏，他们追踪金星、月亮和日月食的周期。《德累斯顿抄本》里有金星 584 天周期的表，误差很小。
    mendel_brno:
      name: 格雷戈尔·孟德尔
      text: 捷克与奥地利的修士与科学家，1822 年生，1884 年去世，布尔诺人。他在修道院花园里杂交豌豆，发现性状按固定比例遗传，成果 1866 年发表，到 1900 年前后才受到注意。
    mendeleev_petersburg:
      name: 门捷列夫
      text: 俄国化学家，1834 年生，1907 年去世。1869 年他在圣彼得堡发表周期表，按原子量排列元素，并为尚未发现的元素留出空位。1907 年 2 月 2 日，他在圣彼得堡去世。
    meroitic_meroe:
      name: 麦罗埃的书吏
      text: 苏丹境内尼罗河畔麦罗埃王国的书吏。他们使用的麦罗埃文字从约公元前二世纪起通行，读音已能辨认，但语言本身大体上仍未被理解。
    miyazawa_kenji_hanamaki:
      name: 宫泽贤治
      text: 日本诗人与童话作家，1896 年生，1933 年去世，花卷人。他教农业，帮助贫苦农民，并写了《银河铁道之夜》。他的作品大多在身后出版。
    modigliani_paris:
      name: 阿梅迪奥·莫迪利亚尼
      text: 意大利画家与雕塑家，1884 年生，1920 年去世，在巴黎工作。他画脖子细长、眼睛如杏仁的肖像和裸体，生前卖得很少，三十五岁死于结核性脑膜炎。
    mohenjo_daro_indus:
      name: 印度河流域的居民
      text: 印度河流域文明的居民，约公元前 2500 年建起摩亨佐·达罗这样的城市，街道规整，有排水系统和砖房。他们留下刻有文字的印章，这种文字至今没有破译。
    morse_washington:
      name: 塞缪尔·莫尔斯
      text: 美国画家与发明家，1791 年生，1872 年去世。他与阿尔弗雷德·维尔合作发展电报机和点划电码。1844 年 5 月 24 日，他从华盛顿向巴尔的摩发出了“上帝创造了何等奇迹”。
    mozart:
      name: 沃尔夫冈·阿马德乌斯·莫扎特
      text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
    murasaki_kyoto:
      name: 紫式部
      text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
    nalanda_library:
      name: 那烂陀的僧人
      text: 那烂陀是比哈尔邦的佛教讲学中心，有供居住和教学的建筑。亚洲各地有人来此求学。《达摩斯瓦明传》仍记有十三世纪在此访学的经历。
    newton_cambridge:
      name: 艾萨克·牛顿
      text: 英国数学家与物理学家，1643 年生，1727 年去世，剑桥人。1687 年的《原理》陈述了运动定律和万有引力定律。他还研究光学并发展了微积分，后来主管皇家铸币厂。
    nezahualcoyotl_texcoco:
      name: 内萨瓦尔科约特尔
      text: 特斯科科统治者，传统生卒年为1402至1472年。晚出的纳瓦特尔语歌集将一些歌曲与他的名字联系起来。歌里的措辞与歌旁的归属题记，各保存了流传过程中的一部分。
    nietzsche_turin:
      name: 弗里德里希·尼采
      text: 德国哲学家（1844–1900），著有《查拉图斯特拉如是说》《善恶的彼岸》。1889 年 1 月，他在都灵病重，友人弗兰茨·奥弗贝克陪他回巴塞尔。此后的岁月里，他由家人照料。
    nightingale_scutari:
      name: 弗洛伦斯·南丁格尔
      text: 英国护士与统计学家，1820 年生，1910 年去世。1854 年克里米亚战争期间，她带领护士到斯库塔里的英军医院，改善卫生，并用图表说明病死的士兵比战死的多。
    noether_gottingen:
      name: 埃米·诺特
      text: 德国数学家，1882 年生，1935 年去世。她在哥廷根阐明了作用量的连续对称性怎样导出守恒定律，并塑造了现代抽象代数。1933 年她丢掉职位，移居美国。
    omar_khayyam_nishapur:
      name: 欧玛尔·海亚姆
      text: 波斯数学家、天文学家与诗人，1048 年生，1131 年去世，尼沙布尔人。他用几何方法分类并求解三次方程，参与历法改革，在英语世界以《鲁拜集》的四行诗闻名。
    ovid_tomis:
      name: 奥维德
      text: 罗马诗人，公元前 43 年生，约公元 17 年去世。他写了《变形记》和爱情诗。公元 8 年，奥古斯都皇帝把他流放到黑海边的托米斯，他死在那里。
    pasteur_paris:
      name: 路易·巴斯德
      text: 法国化学家与微生物学家，1822 年生，1895 年去世。他研究发酵和腐败，发展了巴氏消毒法。他有两个女儿死于伤寒，让娜在 1859 年，塞西尔在 1866 年。1885 年，巴斯德团队为被狗咬伤的约瑟夫·迈斯特接种狂犬病疫苗。
    plato_academy:
      name: 柏拉图
      text: 希腊哲学家，约公元前 428 年生，约公元前 348 年去世，苏格拉底的学生。他在雅典创办学园，写下关于正义、知识和灵魂的对话，主要发言者是苏格拉底。
    pliny_stabiae:
      name: 老普林尼
      text: 罗马作家与海军指挥官，公元 23 年生，79 年去世。他的《博物志》用三十七卷汇集知识。维苏威火山喷发时，他在斯塔比亚附近试图救人而去世。
    poe_baltimore:
      name: 埃德加·爱伦·坡
      text: 美国作家，1809 年生，1849 年去世。他写恐怖和推理故事，有《乌鸦》和《莫格街凶杀案》。他去世前几天被人发现在巴尔的摩神志不清，死因不明。
    puccini_brussels:
      name: 贾科莫·普契尼
      text: 意大利作曲家（1858–1924），作有《波希米亚人》《托斯卡》和《蝴蝶夫人》。他在布鲁塞尔治疗喉癌期间去世，最后一部歌剧《图兰朵》未能写完。
    pushkin_st_petersburg:
      name: 亚历山大·普希金
      text: 俄国诗人，1799 年生，1837 年去世，常被视为现代俄国文学的奠基人。他用诗体写了《叶甫盖尼·奥涅金》。1837 年他在圣彼得堡决斗中受伤，两天后去世。
    pythagoras_croton:
      name: 毕达哥拉斯
      text: 萨摩斯的希腊思想家，传统生卒年约为公元前570至前495年，与克罗顿的一个团体有关。亚里士多德记述，毕达哥拉斯派把音程与数的比例联系起来。
    qu_yuan_miluo:
      name: 屈原
      text: 楚国诗人与大臣，约公元前 340 年生，约公元前 278 年去世。他的长诗《离骚》是中国诗歌的奠基之作。楚国都城陷落后，据说他投汨罗江自尽，端午节与对他的纪念有关。
    ramanujan_madras:
      name: 斯里尼瓦瑟·拉马努金
      text: 印度数学家，1887 年生于埃罗德，主要在贡伯戈讷姆长大，1920 年去世。他在正规课程之外独立钻研数学，在马德拉斯当职员时，于 1913 年把研究结果寄给 G. H. 哈代，后来到剑桥继续研究数论与级数。
    rembrandt_amsterdam:
      name: 伦勃朗
      text: 荷兰画家与蚀刻师，1606 年生，1669 年去世。他画光线强烈的肖像和叙事画，包括《夜巡》。1656 年他破产，晚年在阿姆斯特丹负债度日。
    riemann_selasca:
      name: 伯恩哈德·黎曼
      text: 德国数学家，1826 年生，1866 年去世。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，黎曼猜想至今未解。他在马焦雷湖畔的塞拉斯卡死于肺结核。
    rongorongo_rapa_nui:
      name: 拉帕努伊人
      text: 拉帕努伊人发展了在木面刻写朗格朗格符号的传统。十九世纪的动荡打断了部分知识的传承。存世实物、拉帕努伊人的口述知识和学界的释读工作各保留了这段历史的一部分。
    rumi_konya:
      name: 鲁米
      text: 波斯诗人与导师，1207 年生，1273 年去世，住在科尼亚。他的《玛斯纳维》和抒情诗是苏菲文学中读者最多的作品之一，追随者创立了梅芙莱维教团。
    sappho_lesbos:
      name: 萨福
      text: 莱斯博斯的希腊诗人，活跃于公元前 600 年前后。她写关于渴望与失去的抒情诗，古代汇编成九卷，如今只留下一首完整的诗和一些残片。
    savitribai_phule_pune:
      name: 萨维特丽巴伊·普勒
      text: 印度教师与诗人，1831 年生，1897 年去世。1848 年她与丈夫乔蒂拉奥·普勒在浦那开办女校，为此遭到敌视，后来又开设寡妇之家，并照顾鼠疫病人。
    schubert_vienna:
      name: 弗朗茨·舒伯特
      text: 奥地利作曲家，1797 年生，1828 年去世，生于维也纳。他写了六百多首歌曲，以及交响曲和室内乐，大部分在他生前没有出版或广泛演出。他三十一岁去世。
    schumann_endenich:
      name: 罗伯特·舒曼
      text: 德国作曲家、音乐评论家（1810–1856），作品有《蝴蝶》《少年曲集》和《春天交响曲》。他晚年住在波恩附近恩德尼希的私人疗养院。克拉拉·舒曼是钢琴演奏家、作曲家，也是他的妻子。
    scott_last_camp:
      name: 罗伯特·法尔肯·斯科特
      text: 英国海军军官与探险家，1868 年生，1912 年去世。他率领“新地”号探险队前往南极点，1912 年 1 月到达时发现阿蒙森已先到，返程穿越罗斯冰架时与同伴一起去世。
    sei_shonagon_kyoto:
      name: 清少纳言
      text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
    sejong_hangul:
      name: 世宗大王与学者们
      text: 朝鲜国王，1397 年生，1450 年去世。他与集贤殿的学者创制了一套适合朝鲜语的新文字，1446 年颁布，名为《训民正音》，好让百姓学会读写。
    sequoyah_syllabary:
      name: 塞阔雅
      text: 切罗基银匠，约 1770 年生，1843 年去世。他不识英文，为切罗基语创制了一套八十多个符号的音节文字，1821 年完成。
    shakespeare_globe:
      name: 威廉·莎士比亚
      text: 英国剧作家与诗人，1564 年生，1616 年去世。他为在伦敦环球剧院演出的剧团写了约三十七部戏，包括《哈姆雷特》和《麦克白》，环球剧院于 1599 年开张，他也写十四行诗。
    sima_qian_changan:
      name: 司马迁
      text: 汉代历史学家，约公元前 145 年生，约公元前 86 年去世。他在皇帝面前为一位将军辩护而被处以宫刑，之后完成《史记》，写从传说时代到他当代的历史。
    smith_kirkcaldy:
      name: 亚当·斯密
      text: 苏格兰哲学家与经济学家，1723 年生，1790 年去世，生于柯卡尔迪。1776 年出版的《国富论》论证了分工和自由交换会增加国家的财富。他还写了《道德情操论》。他与大卫·休谟是挚友，1776 年休谟去世后，他写下休谟最后几个月的经过，与休谟的自传一同印出。
    socrates_athens:
      name: 苏格拉底
      text: 雅典的希腊哲学家，公元前 470 年生，公元前 399 年去世。他自己没有留下著作，后人通过柏拉图和色诺芬了解他。他向同胞追问美德，被控不敬神和败坏青年，饮毒芹汁而死。
    song_yingxing_fengxin:
      name: 宋应星
      text: 晚明学者，1587 年生，约 1666 年去世。他的《天工开物》1637 年刊行，详细记述农业、纺织、冶金和许多手工业。
    sophie_germain_paris:
      name: 索菲·热尔曼
      text: 法国数学家，1776 年生，1831 年去世。她被大学拒之门外，靠书本自学，并以男性名字通信。她在费马大定理上取得进展，并因对振动板的研究获得科学院奖。
    sor_juana_mexico_city:
      name: 胡安娜修女
      text: 墨西哥修女、诗人与学者，1648 或 1651 年生，1695 年去世。她在墨西哥城的修道院里收藏了大批图书，写诗和戏剧。1691 年她回复一位主教的信为女性求学的权利辩护，后来在压力下交出了藏书。
    su_shi_huangzhou:
      name: 苏轼
      text: 宋代诗人、书法家与官员，1037 年生，1101 年去世。1080 年因一桩政治案件被贬到黄州，他在那里种地，并写出了几篇最有名的诗文。
    tagore_santiniketan:
      name: 罗宾德拉纳特·泰戈尔
      text: 孟加拉诗人与教育家，1861 年生，1941 年去世。他写诗、歌曲、戏剧和小说，在圣蒂尼克坦创办学校，1913 年成为第一位获得诺贝尔文学奖的非欧洲人。
    tang_xianzu_linchuan:
      name: 汤显祖
      text: 明代剧作家，1550 年生，1616 年去世。1598 年归居临川，同年秋为《牡丹亭》题词。剧中杜丽娘在梦里遇见一名书生，从此寻访梦中人。
    taqi_al_din_istanbul:
      name: 塔基·丁
      text: 奥斯曼学者与天文学家，1526 年生，1585 年去世。1570 年代他在伊斯坦布尔建起带大型仪器的天文台，还写过钟表和力学的著作。天文台在 1580 年被拆毁。
    tenochtitlan_lake:
      name: 墨西卡的建造者们
      text: 墨西卡人在特斯科科湖的一座岛上发展特诺奇蒂特兰，通行的建城纪年是 1325 年。城中有堤道、运河和引水渠。湖盆地区名为奇南帕的耕地为人工垫高的固定田块，由水道分隔。
    terence_rome:
      name: 泰伦提乌斯
      text: 罗马剧作家，约公元前 195 年生，约公元前 159 年去世。据说他作为奴隶从北非被带到罗马，写了六部改编自希腊戏剧的喜剧，全部留存至今。
    tesla_wardenclyffe:
      name: 尼古拉·特斯拉
      text: 塞尔维亚裔美国发明家，1856 年生，1943 年去世。他发展了交流电系统和感应电动机。1901 年他在长岛沃登克里弗开始建造一座用于无线传输的大塔，项目后来因资金耗尽而中止。
    thales_miletus:
      name: 泰勒斯
      text: 米利都的早期希腊思想家，传统生卒年约为公元前624至前546年。后人把他与对自然现象的解释联系起来。希罗多德称他预告过一次白昼转暗的年份，这次事件通常被认为是公元前585年的日食。
    timbuktu_sankore:
      name: 曼萨·穆萨与桑科雷的学者们
      text: 马里皇帝曼萨·穆萨与桑科雷的学者们。据说穆萨在 1324 至 1325 年到麦加朝觐后带回了学者和建筑师，此后数百年里，廷巴克图的清真寺及其学校成为学术中心。
    tupaia_tahiti:
      name: 图帕亚
      text: 来自赖阿特阿岛的领航人，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
    ulugh_beg_samarkand:
      name: 兀鲁伯
      text: 帖木儿王朝的统治者与天文学家，1394 年生，1449 年去世。他在撒马尔罕建起大型天文台，编出精度很高的星表。1449 年 10 月 27 日他在撒马尔罕去世。
    van_gogh_auvers:
      name: 文森特·梵高
      text: 荷兰画家，1853 年生，1890 年去世。他只画了大约十年，留下两千多件作品，卖出的很少。最后几周他住在瓦兹河畔奥维尔，1890 年 7 月因枪伤去世。
    vermeer_delft:
      name: 约翰内斯·维米尔
      text: 荷兰画家，1632 年生，1675 年去世，代尔夫特人。他画光线柔和的静谧室内场景，如《戴珍珠耳环的少女》，留存的作品只有约四十件，去世时家人负债。
    vesalius_padua:
      name: 维萨里
      text: 佛兰德解剖学家，1514 年生，1564 年去世，曾在帕多瓦任教。他 1543 年的《人体构造》配有取自亲自解剖的细致插图，纠正了盖伦的许多说法。
    wallace_ternate:
      name: 阿尔弗雷德·拉塞尔·华莱士
      text: 英国博物学家，1823 年生于威尔士，1913 年去世。在马来群岛考察时，他独立于查尔斯·达尔文提出了自然选择的解释。1858 年，两人的文章在同一次会议上宣读。他还描述了群岛间动物分布的显著变化，那道分界如今称为华莱士线。
    wang_zhenyi_jinling:
      name: 王贞仪
      text: 清代天文学家与数学家，1768 年生，1797 年去世。她用灯、镜子和圆桌做模型解释日月食，还写过数学著作，二十九岁去世。
    wegener_greenland:
      name: 阿尔弗雷德·魏格纳
      text: 德国科学家，1880 年生，1930 年去世。1912 年他提出大陆在地球表面漂移，这一想法被拒绝了几十年。1930 年他在一次考察中死于格陵兰冰盖上。
    wright_kitty_hawk:
      name: 奥维尔和威尔伯·莱特
      text: 威尔伯·莱特（1867–1912）和奥维尔·莱特（1871–1948）在俄亥俄州代顿经营自行车铺，并用滑翔机和风洞检验飞行器设计。1903 年 12 月 17 日，他们在基蒂霍克附近的斩魔山完成四次动力飞行。第一次由奥维尔驾驶，最后一次由威尔伯驾驶。发回家的电报说最长一次是 57 秒，实际是 59 秒。
    xu_xiake_lijiang:
      name: 徐霞客
      text: 明代旅行家，1587 年生，1641 年去世。约三十年里他徒步走过中国的山川和洞穴，笔记后来被整理为《徐霞客游记》，对岩溶地貌有细致描述。
    zhu_shijie_yangzhou:
      name: 朱世杰
      text: 元代数学家，活跃于 1300 年前后。他 1303 年的《四元玉鉴》用类似现代矩阵的方法解最多含四个未知数的多项式方程组。
    qin_jiushao_huzhou:
      name: 秦九韶
      text: 南宋数学家，约 1202 年生，约 1261 年去世。1247 年写成《数书九章》，其中的大衍求一术相当于解一次同余方程组，即后来所说的中国剩余定理。
    al_biruni_ghazna:
      name: 比鲁尼
      text: 中亚学者，973 年生，约 1050 年后去世。他通晓天文、数学、地理和多种语言，曾用山的高度和地平线的俯角估算地球半径，并留下关于印度的详细著作。
    al_razi_rayy:
      name: 拉齐
      text: 波斯医生，约 865 年生，925 年去世。他在雷伊和巴格达行医，留下大量病例记录，在一部专著里把天花与麻疹区分开来。
    sushruta_varanasi:
      name: 妙闻
      text: 古印度医者，传统上被认为是《妙闻集》的作者，书中有外科手术、器械和整形的内容。他生活的年代和是否为同一个人都有争议。
    borobudur_java:
      name: 婆罗浮屠的建造者们
      text: 8 至 9 世纪在爪哇中部建造婆罗浮屠的工匠和劳工，姓名没有留下。建造的确切年代范围有不同说法。
    zeami_sado:
      name: 世阿弥
      text: 日本能乐演员和剧作家，约 1363 年生，约 1443 年去世。他留下多部关于能乐的论著，1434 年被流放到佐渡岛。
    ino_tadataka_ezo:
      name: 伊能忠敬
      text: 日本的测量家，1745 年生，1818 年去世。50 岁以后学习天文和测量，1800 年起走遍日本海岸，主持绘制了精度很高的全国地图。
    djenne_builders:
      name: 杰内的泥砖建造者们
      text: 西非杰内的工匠和街坊有用泥土建屋和维护土墙的传统。现存大清真寺在 1907 年重建，当地社区至今仍定期重抹墙面。
    ahmes_thebes:
      name: 阿赫摩斯
      text: 古埃及书吏，约公元前 16 世纪在底比斯一带抄写了今天所说的莱因德纸草，是现存最重要的古埃及数学文献之一。
    quipu_cusco:
      name: 结绳记事的人
      text: 印加社会里用结绳记录数目的账房人员。绳结的读法有许多至今未解，百科只写已知的部分。
    humboldt_chimborazo:
      name: 亚历山大·冯·洪堡
      text: 德国博物学家和探险家，1769 年生，1859 年去世。1802 年他在厄瓜多尔攀登钦博拉索山，到达约五千六百米，记录了高度、植被与气候的关系。
    banneker_maryland:
      name: 本杰明·班纳克
      text: 美国自学成才的天文学家和农夫，1731 年生，1806 年去世。1791 年他协助测绘华盛顿特区，1792 年起出版历书。
    seacole_balaklava:
      name: 玛丽·西科尔
      text: 牙买加出生的护士和商人，1805 年生，1881 年去世。申请做军队护士被拒绝后自费前往克里米亚，在营地后方照看伤病员。
    mitchell_nantucket:
      name: 玛丽亚·米切尔
      text: 美国天文学家，1818 年生，1889 年去世。1847 年发现一颗彗星，后来在美国担任天文学教授。
    caroline_herschel_slough:
      name: 卡罗琳·赫歇尔
      text: 德国出生的英国天文学家，1750 年生，1848 年去世。她是天文学家威廉·赫歇尔的妹妹，1786 年发现了自己的第一颗彗星，后来又发现多颗彗星。
    kovalevskaya_stockholm:
      name: 索菲娅·柯瓦列夫斯卡娅
      text: 俄国数学家，1850 年生，1891 年去世。她在斯德哥尔摩任教授，1888 年因对刚体旋转问题的研究获得法国科学院的奖。
    chaco_sun_watchers:
      name: 查科峡谷的人们
      text: 先民在查科峡谷建起大型石屋。研究者在法哈达孤丘记录了岩刻上的光影变化。这片峡谷至今是普韦布洛人和其他族群的祖先之地与圣地。
    rapa_nui_moai:
      name: 拉帕努伊的石像匠人
      text: 凿刻并立起摩艾的拉帕努伊人，大多在十三到十六世纪。他们的后裔今天仍生活在岛上，并照管着包含采石场的公园。
    hargrave_stanwell_park:
      name: 劳伦斯·哈格雷夫
      text: 出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱形风筝，并公开发表自己的飞行研究。
    sun_yat_sen_guangzhou:
      name: 孙中山
      text: 中国革命家和政治领袖，1866 年生，1925 年去世。1924 年 2 月 4 日他下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。同一年他还开办了黄埔军校，一文一武。1924 年 1 月 27 日到 8 月 24 日，他利用星期天在高等师范的礼堂演讲，共十六讲，讲稿经记录、校改后印行。9 月 19 日开学，11 月 11 日成立典礼上用的校训是他写的。他 1924 年 12 月 31 日抵达北京，1925 年 1 月 26 日因癌症接受手术，3 月 12 日在北京去世。1926 年 8 月 17 日国民政府下令把这所大学改名为国立中山大学。
    zhuge_liang:
      name: 诸葛亮
      text: 蜀汉丞相。陈寿《三国志》记他最后一次北伐驻五丈原，患病而卒于军。《蒋琬传》另载他密表推荐蒋琬，以及蒋琬在他死后受任。
    qin_liangyu_shizhu:
      name: 秦良玉
      text: 明末忠州人，马千乘之后代领石砫之职。《明史》为她立传，记她所部号白杆兵，亦记崇祯三年她出家财济饷。
    david_fleay_healesville:
      name: 戴维·弗莱
      text: 戴维·弗莱（1907—1993）是澳大利亚博物学家。任希尔斯维尔保护区主任期间，他主持了首次成功的鸭嘴兽人工繁育，随后在《维多利亚博物学家》记录幼兽的发育。
    pappus_alexandria:
      name: 亚历山大的帕普斯
      text: 亚历山大的希腊数学家，活跃于约公元 320 年。他的《数学汇编》八卷汇集并评述前代几何学家的著作，欧几里得《推论集》这类失传之作，今天所知的大多来自这部书。
    cleomedes:
      name: 克莱奥梅德斯
      text: 希腊天文学作者，生卒年不详，一般认为在公元前一世纪到公元四世纪之间。他的教本《论天体的圆周运动》记下了埃拉托色尼测量地球最为人知的说法，并说原来的方法更繁。
    giovanni_del_virgilio:
      name: 乔万尼·德尔·维尔吉利奥
      text: 博洛尼亚的意大利学者与诗人，活跃于 14 世纪初，在那里讲授拉丁诗人。1319 年前后他用拉丁诗写信给但丁，两人往来的牧歌开了拉丁田园诗复兴的先声。
    tiedemann_giese:
      name: 蒂德曼·吉泽
      text: 王室普鲁士的教会人士，1480 年生于但泽，1550 年去世，是哥白尼最亲近的朋友。他劝哥白尼出版著作，写信记下他最后的日子，哥白尼死后又对印本里那篇不署名的序言提出抗议。
    georg_joachim_rheticus:
      name: 格奥尔格·约阿希姆·雷蒂库斯
      text: 维滕贝格的数学家，1514 年生，1574 年去世，哥白尼唯一的学生。他 1539 年来到弗龙堡，1540 年写成第一部介绍新体系的出版物《初讲》，又把《天体运行论》的书稿送到纽伦堡付印。
    david_hume:
      name: 大卫·休谟
      text: 苏格兰哲学家与史学家，1711 年生于爱丁堡，1776 年去世，是亚当·斯密最亲近的朋友。1776 年他立遗嘱，指定斯密为遗稿执行人，8 月 7 日又在遗嘱附件里把《自然宗教对话录》托给印书商威廉·斯特拉恩。他在 1776 年 8 月 25 日于爱丁堡去世，《对话录》在 1779 年出版。
    william_strahan:
      name: 威廉·斯特拉恩
      text: 在伦敦开业的苏格兰印书商与出版人，1715 年生于爱丁堡，1785 年去世。他与托马斯·卡德尔合出了《国富论》，是休谟和斯密共同的朋友。1776 年休谟把《自然宗教对话录》托给了他，他最终没有付印。
    charles_babbage:
      name: 查尔斯·巴贝奇
      text: 英国数学家与发明家，1791 年生，1871 年去世，设计了差分机和分析机，后者是一台用穿孔卡控制的通用计算机器。两台机器在他生前都没有造成。1843 年，阿达·洛芙莱斯翻译了一篇分析机的介绍，并加上了她自己的注释。
    nikolai_menshutkin:
      name: 尼古拉·缅舒特金
      text: 俄国化学家，1842 年生，1907 年去世，圣彼得堡大学教授，俄国化学学会会刊的编辑。1869 年 3 月 18 日，门捷列夫不在场，由他在学会宣读了门捷列夫关于元素体系的论文。把胺变成季铵盐的那个反应以他的名字命名。
    pierre_curie:
      name: 皮埃尔·居里
      text: 法国物理学家，1859 年生，1906 年去世，在巴黎工业物理化学学校任教。他与哥哥雅克发现了压电效应，又与玛丽·居里研究放射性，1898 年宣布发现钋和镭。1903 年他分享诺贝尔物理学奖，1906 年 4 月 19 日在巴黎街头意外身亡。
    auguste_chevalier:
      name: 奥古斯特·舍瓦利耶
      text: 法国人，埃瓦里斯特·伽罗瓦在高等师范学校的朋友。伽罗瓦 1832 年 5 月 29 日的最后一封信就是写给他的，同年 9 月，舍瓦利耶把信刊在《百科评论》上，附了一篇悼念朋友的短文。他保管着伽罗瓦的手稿，这些手稿后来到了约瑟夫·刘维尔手里，1846 年刊出。
    joseph_liouville:
      name: 约瑟夫·刘维尔
      text: 法国数学家，1809 年生，1882 年去世。1836 年他创办《纯粹与应用数学杂志》，1846 年在这份杂志上刊出埃瓦里斯特·伽罗瓦的数学论文，那时伽罗瓦已去世十四年。
    august_crelle:
      name: 奥古斯特·利奥波德·克雷勒
      text: 德国土木工程师与数学家，1780 年生，1855 年去世。1826 年他在柏林创办《纯粹与应用数学杂志》，头几卷刊出了尼尔斯·亨里克·阿贝尔的许多论文。他为阿贝尔在柏林谋职，1829 年 4 月 8 日写信说职位已经落实，那时还不知道阿贝尔两天前已经去世。
    richard_dedekind:
      name: 理查德·戴德金
      text: 德国数学家，1831 年生，1916 年去世，在哥廷根求学，是伯恩哈德·黎曼的朋友。1866 年黎曼在塞拉斯卡最后几周的情形，是他记下来的；1876 年出版的黎曼全集，他参与了编订。
    alexis_clairaut:
      name: 亚历克西·克莱罗
      text: 法国数学家与天文学家，1713 年生，1765 年去世。1736 至 1737 年他随远征队去拉普兰测量地球的形状。他与埃米莉·杜·夏特莱一起做她的牛顿法译，她 1749 年去世后，他参与把译本整理成 1759 年的版本。
    felix_klein:
      name: 费利克斯·克莱因
      text: 德国数学家，1849 年生，1925 年去世。1872 年他提出埃尔朗根纲领，按保持不变的变换群给几何分类，1886 年起在哥廷根任教。1915 年他与大卫·希尔伯特把埃米·诺特请到哥廷根，1918 年 7 月 26 日又把她的论文《不变变分问题》呈交给哥廷根科学学会。
    david_hilbert:
      name: 大卫·希尔伯特
      text: 德国数学家，1862 年生，1943 年去世，1895 年起任哥廷根教授。1900 年他为新世纪提出二十三个问题。1915 年他与费利克斯·克莱因把埃米·诺特请到哥廷根，她不准任教的那几年，她的课在课表上署的是他的名字。
    jean_perrin:
      name: 让·佩兰
      text: 法国物理学家，1870 年生，1942 年去世。1908 年起，他的布朗运动实验证实了爱因斯坦 1905 年的预言，原子的真实存在渐渐被普遍接受。1926 年他因研究物质的不连续结构获得诺贝尔物理学奖。
    stefan_meyer:
      name: 斯特凡·迈尔
      text: 奥地利物理学家，1872 年生，1949 年去世，是路德维希·玻尔兹曼在维也纳的学生和助手。1906 年 5 月玻尔兹曼告假，课由迈尔代讲；玻尔兹曼去世后，他代管研究所一年。1910 年起，他是维也纳镭研究所的第一任代理所长。
    stanford_white:
      name: 斯坦福·怀特
      text: 美国建筑师，1853 年生，1906 年去世，纽约麦金、米德与怀特事务所的合伙人。他为尼古拉·特斯拉设计了长岛沃登克里弗的房子，1901 年特斯拉为塔和实验楼写信给他。1906 年 6 月，他在纽约被枪杀。
    j_pierpont_morgan:
      name: J.P. 摩根
      text: 美国银行家，1837 年生，1913 年去世，纽约摩根公司的掌门人。1901 年 3 月，他答应出资十五万美元，给尼古拉·特斯拉在沃登克里弗建无线电站；1903 年 7 月，他回信说不再追加款项。
    ferdinand_schubert:
      name: 费迪南德·舒伯特
      text: 奥地利作曲家、教师，1794 年生，1859 年去世，弗朗茨·舒伯特的哥哥。1828 年秋，弗朗茨搬进他在维登的新住处，11 月 19 日在那里去世。弟弟死后，费迪南德把他的大部分作品卖给了出版人迪亚贝利。
    catharina_bolnes:
      name: 卡塔琳娜·博尔内斯
      text: 约 1631 年生，1687 年去世，玛丽亚·廷斯的女儿。1653 年 4 月 20 日，她在代尔夫特嫁给约翰内斯·维米尔，生了十五个孩子，1675 年 12 月丈夫去世时还有十一个活着。1676 年初，她把丈夫的两幅画交给面包商抵面包钱，把《绘画艺术》转到母亲名下，4 月又请求高等法院免去她的债。
    maria_thins:
      name: 玛丽亚·廷斯
      text: 1592 年生，1680 年去世，出身豪达的富裕人家，卡塔琳娜·博尔内斯的母亲，约翰内斯·维米尔的岳母。维米尔一家住在她代尔夫特老朗恩代克街的房子里，维米尔葬在她买下的墓穴。1676 年 2 月 24 日，女儿把《绘画艺术》转到她名下。
    thore_burger:
      name: 泰奥菲勒·托雷-比尔热
      text: 法国记者、艺术评论家，1807 年生，1869 年去世。1866 年，他在《美术报》上发表约翰内斯·维米尔的作品目录，让这位被冷落近两百年的画家重新引起广泛注意。
    titus_van_rijn:
      name: 提图斯·范·莱因
      text: 1641 年生于阿姆斯特丹，1668 年 9 月 7 日在那里下葬，伦勃朗与萨斯基亚·范·厄伊伦堡的儿子，他们唯一长大成人的孩子。他给父亲当过模特，也做画商。1668 年 2 月他娶了玛格达莱娜·范·卢，女儿蒂蒂娅在他死后半年出世。
    domenec_sugranyes:
      name: 多梅内克·苏格拉涅斯
      text: 加泰罗尼亚建筑师，1878 年生于雷乌斯，1938 年去世。他从 1905 年起与安东尼·高迪共事，高迪指定他为遗嘱执行人之一。1926 年高迪去世后，他主持高迪留下的那座建筑的工程十年，直到 1936 年 7 月 20 日工房被烧。
    dora_diamant:
      name: 朵拉·迪亚曼特
      text: 演员、教师，1898 年生于波兰，1952 年去世。1923 年 7 月，她在波罗的海边认识弗朗茨·卡夫卡，后来与他同住柏林。1924 年 4 月，她随他来到基尔灵的疗养院，给他做饭，一直陪到他 6 月 3 日去世。她留下了他最后的一些笔记本和信，1933 年被人抄走。
    robert_klopstock:
      name: 罗伯特·克洛普施托克
      text: 匈牙利医学生，1921 年在高塔特拉山的疗养院与弗朗茨·卡夫卡相识。1924 年 5 月 6 日前后，他来到基尔灵帮着照料卡夫卡，替朵拉·迪亚曼特分担；卡夫卡去世后，他坐同一班火车护送遗体回布拉格。
    maria_clemm:
      name: 玛丽亚·克莱姆
      text: 埃德加·爱伦·坡的姨母兼岳母，1790 年生，1871 年去世。坡与养父决裂后投奔她在巴尔的摩的家，后来娶了她的女儿弗吉尼亚，叫她“马迪”；她替他们操持家务，替他往出版人那里送稿。1849 年 10 月坡死在巴尔的摩时，她在福德姆，是从报上读到的。
    katharina_kepler:
      name: 卡塔琳娜·开普勒
      text: 天文学家约翰内斯·开普勒的母亲，娘家姓古尔登曼，1547 年生于莱昂贝格附近的埃尔廷根，1622 年去世。她守寡，不识字，给邻居配草药，1615 年与人起了争执，被告发说用药害人。1620 年 8 月 7 日她被捕，在居格林根戴着锁链关了四百零五天，儿子以书面申辩替她辩护。1621 年秋她获释，第二年四月去世。
    olga_knipper:
      name: 奥尔加·克尼佩尔
      text: 俄国演员，1868 年生，1959 年去世，1898 年莫斯科艺术剧院创办时的第一批演员之一。她演过《海鸥》里的阿尔卡金娜，是《三姐妹》里第一个玛莎、《樱桃园》里第一个朗涅夫斯卡娅。1901 年她与安东·契诃夫结婚，1904 年 6 月陪他去巴登魏勒，7 月 15 日他在那里去世。此后她一直在莫斯科艺术剧院演戏。
    carl_friedrich_gauss:
      name: 卡尔·弗里德里希·高斯
      text: 德国数学家，1777 年生于不伦瑞克，1855 年在哥廷根去世。1807 年起任哥廷根大学天文台台长。1804 年起，他与署名勒布朗先生的索菲·热尔曼通信，1807 年才知道她是谁。他说动哥廷根大学授她名誉博士学位，她没等到授出就去世了。
    franco_alfano:
      name: 弗兰科·阿尔法诺
      text: 意大利作曲家（1876–1954）。普契尼去世后，家属与里科尔迪出版社委托阿尔法诺补完《图兰朵》。他在末场二重唱与终场的第一版总谱上，签了都灵和 1926 年 1 月 28 日。
    clara_schumann:
      name: 克拉拉·舒曼
      text: 钢琴演奏家、作曲家（1819–1896），原名克拉拉·维克。她幼年登台，后来到多地巡演。1856 年 7 月，她结束了第一次英国巡演，回到恩德尼希探视罗伯特。此后她又演出了数十年。
    jeanne_hebuterne:
      name: 让娜·埃比泰纳
      text: 法国画家，1898 年生，1920 年去世。她在巴黎科拉罗西美术学院学习素描和绘画，留下自画像、窗前风景和画家朋友的肖像。1917 年，她结识了阿梅迪奥·莫迪利亚尼，后来多次为他担任模特。两人的女儿出生在法国蔚蓝海岸。1919 年 5 月，他们返回巴黎。1920 年 1 月 26 日，埃比泰纳去世。
    mu_zeng:
      name: 木增
      text: 丽江土知府、诗文作者（1587–1646）。1639 年，徐霞客为他校书。据徐霞客日记，木增随后遣人酬谢，并再次致书请他编修《鸡山志》。
  events:
    pump_handle:
      name: 宽街泵柄被拆
      text: 史载 9 月 8 日泵柄被拆走。拆走时疫情已经在下降，很多居民早已离开，所以泵柄被拆能救多少人至今有争论。
    handwashing_rule:
      name: 维也纳洗手规定
      text: 1847 年 5 月，森梅尔维斯在第一产科病房推行含氯洗手。他的著作按病房和时段比较收治与死亡人数。
    branch:
      name: 分支与主时间线
      text: 游戏设定。历史不可改变，员工的一切行动都落在一条平行分支上，主时间线保持原样，分支与主时间线的差值换算成时空能量。
    sanitary_commission:
      name: 斯库塔里的卫生委员会
      text: 1855 年 3 月初，英国派出的卫生委员会到达斯库塔里，冲洗了下水道，让病房通了风。此后几个月医院里的死亡数大幅下降。
    mosquito_idea:
      name: 蚊子的说法
      text: 1881 年 8 月，卡洛斯·芬莱向哈瓦那科学院宣布黄热病由一种蚊子传播。这个说法多年不被接受，1900 年以后才得到证明。
    first_inoculation:
      name: 第一次牛痘接种
      text: 1796 年 5 月 14 日，爱德华·詹纳把牛痘疮里的物质接种给一个男孩，后来又试了男孩是否受到天花的保护。按今天的标准，这样的试验不会被允许。
    camp_stores:
      name: 营地物资
      text: 玛丽·西科尔自己采购、自己运送物资，并在营地后方开了一家客栈。军队物资向她开放的日期没有记录。
    supply_plan:
      name: 从艾斯米特返回的路
      text: 魏格纳 1930 年 11 月 1 日和拉斯穆斯·维卢姆森从艾斯米特出发，被认为在 11 月 16 日前后去世。搜寻队 1931 年 5 月 12 日找到他的墓。
    depot_plan:
      name: 最后一篇日记
      text: 斯科特的最后一篇日记写于 1912 年 3 月 29 日，离一吨仓库十一英里。搜救队 11 月 12 日找到帐篷。
    oxygen_plan:
      name: 高营地的计划
      text: 高营地怎样补给、氧气装置用到什么程度，在山上一直有争论。
    snow_line:
      name: 攀登的计划
      text: 爬多快、歇多久，是队伍在山坡上自己的选择。
    watering_plan:
      name: 水和食物的计划
      text: 上岸的队伍怎样补水、补食物，是船上军官的选择。
    fresh_food_plan:
      name: 新鲜食物的计划
      text: 船在岛上为长途航行补什么，是船上军官的选择。
    university_order:
      name: 合并学校的命令
      text: 1924 年 2 月 4 日孙中山下令把三所学校并成一所大学。有记载的日期不会变。
model_events:
  door_block: 员工上门救治时，可能被邻居或前辈拦在门外。是让步、坚持还是求助，由员工自己的特质决定。
  time_strain: 分支离史实太远时，员工会感到时间错位，人更累，也更容易出事。
  asked_the_way: 一个拿着信的新生向员工问某间办公室怎么走。这名学生是为游戏编的，没有名字。员工那时已经走熟了校址，就在图上指给他看，否则两个人一起找。一趟只发生一次，不计入与主时间线的对比。
  expedition_handoff: 虚构文书交接。员工的应对习惯决定是先交手里的记录，还是多留一点时间核对。
fact_lines:
  abel_froland:
    quintic: 1824 年，阿贝尔证明一般五次方程不能用根式求解。
    sledge: 1828 年圣诞，阿贝尔受着寒、咳着嗽，坐雪橇到弗罗兰看望未婚妻。
    last_paper: 1829 年 1 月 6 日，阿贝尔在弗罗兰的病床上写下最后一篇论文，两三页，写的是巴黎长稿的主要思想。
    death: 1829 年 4 月 6 日，尼尔斯·亨里克·阿贝尔在弗罗兰去世，二十六岁。
    berlin: 1829 年 4 月 8 日，尚不知情的克雷勒从柏林写信，说替阿贝尔谋的职位已经落实。
    prize: 1830 年，巴黎科学院把大奖授给已经去世的阿贝尔和雅可比。
    memoir: 1841 年，阿贝尔交给巴黎科学院的那篇长稿终于印出。
  ahmed_baba_timbuktu:
    conquest: 1591 年，摩洛哥军队攻下廷巴克图。
    deported: 1594 年，艾哈迈德·巴巴被指抗拒苏丹，押往马拉喀什。
    return: 1608 年，艾哈迈德·巴巴获准回到廷巴克图。
    death: 1627 年 4 月 22 日，艾哈迈德·巴巴在廷巴克图去世。
  archimedes_syracuse:
    siege: 叙拉古，城中顶住罗马军队的围攻。
    death: 叙拉古城破，阿基米德遇害。
  bach_leipzig:
    eyes: 1750 年春，巴赫的眼睛已几乎不能读写。
    operations: 1750 年 3 月底，眼医约翰·泰勒为巴赫的眼睛动刀，约一周后又动了一次。
  basho_hiraizumi:
    set_out: 元禄二年三月二十七日，芭蕉带着曾良从江户深川出发北行。
    depart: 元禄二年五月十三日，天晴。巳时前后，芭蕉与曾良从一关动身去平泉。
    takadachi: 两人登上高馆，看北上川和衣川。
    golden_hall: 在中尊寺，别当带两人看了光堂。
    sutra_hall: 经堂没有开，别当不在。
    back: 申时上刻，两人回到一关的住处，主人已烧好洗澡水等着。
    ogaki: 八月二十一日前后，芭蕉到了大垣，这一趟北行在这里收尾。
    death: 元禄七年十月十二日，松尾芭蕉在大阪去世。
  beethoven_vienna:
    full_rehearsals: 1824 年 5 月 5 日，合唱与乐队第一次合在一起排练，离演出只剩两天。
    premiere: 1824 年 5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，贝多芬站在台上。
    second_concert: 1824 年 5 月 23 日，音乐会在大雷杜滕厅重演，座位空了不少，票房让贝多芬失望。
    death: 1827 年 3 月 26 日，路德维希·凡·贝多芬在维也纳去世。
  bizet_paris:
    premiere: 1875 年 3 月 3 日，《卡门》在喜歌剧院首演。
    rehearsals: 1875 年 2 月，乐队说《卡门》有几段奏不了。
    reception: 1875 年 3 月 4 日，晨报对《卡门》一片冷评。
    death: 1875 年 6 月 3 日，比才在布日瓦尔去世。
  boltzmann_duino:
    counting: 1877 年，玻尔兹曼数出同一种能量分布可由多少种粒子排法得到。
    leave: 1906 年 5 月，玻尔兹曼因所谓严重的神经衰弱，在维也纳停了课。
    duino: 1906 年夏，玻尔兹曼和妻子、女儿来到的里雅斯特附近的杜伊诺。
    death: 1906 年 9 月 5 日，路德维希·玻尔兹曼在杜伊诺去世，六十二岁。
    perrin: 1908 年，让·佩兰的布朗运动实验开始证实爱因斯坦关于原子的预言。
    perrin_nobel: 1926 年，让·佩兰因研究物质的不连续结构获得诺贝尔物理学奖。
  boole_ballintemple:
    lecture: 1864 年 11 月 24 日，布尔在科克女王学院授课。
    death: 1864 年 12 月 8 日，布尔在巴林滕普尔的家中去世。
    supplement: 1865 年 11 月，艾萨克·托德亨特在序中写明了是谁复算了那张表、又为何要复算。
  buchner_zurich:
    typhus: 毕希纳发起高烧。
    death: 毕希纳在苏黎世去世，年二十三岁。
  cajal_barcelona:
    chair: 1887 年，卡哈尔到巴塞罗那大学任组织学教授。
    revista: 1888 年 5 月 1 日，卡哈尔自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。
    berlin: 1889 年 10 月，卡哈尔在柏林德国解剖学会的会上把切片放到显微镜下给各国学者看，克利克接过了他的研究。
    madrid: 1892 年，卡哈尔离开巴塞罗那，去马德里任组织学教授。
    nobel: 1906 年，卡哈尔与高尔基因神经系统结构的研究共享诺贝尔奖。
  cantor_halle:
    hunger: 战时缺粮，康托尔病着，也吃不饱。
    clinic: 康托尔又从疗养院写信给妻子，请求回家。
    death: 1918 年 1 月 6 日，康托尔在哈雷的疗养院去世。
  chekhov_badenweiler:
    departure: 1904 年 6 月 3 日，病重的契诃夫和奥尔加·克尼佩尔离开莫斯科，去德国疗养。
    romerbad: 1904 年 6 月 23 日，契诃夫和奥尔加·克尼佩尔住在巴登魏勒的罗马浴旅馆，路上的疲乏还没缓过来。
    letter: 1904 年 6 月 25 日，契诃夫从弗里德里克别墅给玛丽娅寄去新地址，信里写到晒得到太阳的花园。
    sommer: 1904 年 7 月 5 日，契诃夫从索默旅馆给玛丽娅写信，邮局就在隔壁。
    steamer: 1904 年 7 月 11 日，酷暑里，契诃夫写信打听哪一班轮船能走海路送他和奥尔加回俄国。
    death: 1904 年 7 月 15 日凌晨，安东·契诃夫在巴登魏勒去世，四十四岁。
  copernicus_frombork:
    rheticus: 1539 年，维滕贝格的年轻数学家雷蒂库斯来到弗龙堡，劝哥白尼把书付印。
    giese_worry: 1542 年 12 月 8 日，蒂德曼·吉泽写信说，他很担心老人哥白尼的身体。
    revolutions: 1543 年，《天体运行论》在纽伦堡印成，卷首多了一篇不署名的《告读者》。
    book_reached: 5 月 24 日前后，印好的《天体运行论》送到弗龙堡。吉泽后来说，书在他去世那天才到；也可能到得更晚。
    death: 1543 年 5 月 24 日，尼古拉·哥白尼在弗龙堡去世。
    giese_letter: 7 月 26 日，吉泽写信给雷蒂库斯，谢他寄来两本书，请他把要求改版的信转交纽伦堡市议会。
    autograph: 1999 年，藏在克拉科夫雅盖隆图书馆的《天体运行论》亲笔原稿列入世界记忆名录。
    remains: 2008 年，DNA 比对证实，弗龙堡大教堂地下找到的遗骨是哥白尼的。
  curie_paris:
    april_note: 1898 年 4 月 12 日，玛丽·居里向科学院报告，沥青铀矿放出的射线比铀还强。
    polonium: 1898 年 7 月 18 日，居里夫妇宣布在沥青铀矿里找到一种新元素，以波兰命名为钋。
    radium: 1898 年 12 月 26 日，居里夫妇与贝蒙向科学院宣布了镭。
    shed: 1902 年，居里夫妇从约一吨沥青铀矿里分出了十分之一克氯化镭。
