  finlay_wellcome_address: 惠康收藏，芬莱论文与1881年8月宣读日期 https://wellcomecollection.org/works/paeep774
  jenner_gutenberg_case: 爱德华·詹纳《牛痘的成因及作用之研究》，第十七例 https://www.gutenberg.org/cache/epub/29414/pg29414-images.html
  scutari_commission_report: 《卫生委员会工作报告（1855—1856）》，第6页，惠康馆藏 https://wellcomecollection.org/works/gfy47p8d
sections:
  places:
    broad_street:
      name: 伦敦宽街，1854
      text: 伦敦苏荷区的一条街，街口有一台公用水泵。1854 年 8 月底到 9 月初，这一带暴发霍乱。游戏里的宽街是一个约五百人的街区模型。
    vienna_clinic:
      name: 维也纳总医院，1847
      text: 十九世纪中叶欧洲最大的医院之一，设有两间产科病房，一间由医生和学生接生，一间由助产士接生。两间病房的产妇死亡率差别很大。
    scutari_barrack:
      name: 斯库塔里兵营医院，1855
      text: 博斯普鲁斯海峡亚洲一侧的一座大型兵营，克里米亚战争中用作医院。1854 年到 1855 年冬天这里拥挤不堪，下水道堵塞。游戏里的兵营医院是一个约四百名病人的病房模型。
    havana_district:
      name: 哈瓦那，1881
      text: 一个炎热拥挤的港口，黄热病每年夏天都会回来。游戏里的哈瓦那是一个约六百人的街区模型。
    berkeley_vale:
      name: 伯克利，1796
      text: 格洛斯特郡伯克利谷的一个集镇，爱德华·詹纳在这里做乡村医生。游戏里的伯克利是一个约三百人的村庄模型。
    balaklava_camp:
      name: 巴拉克拉瓦，1855
      text: 克里米亚南岸的一个小港口，是英军的补给基地。游戏里的巴拉克拉瓦是一个约五百人的营地模型。
    greenland_ice_sheet:
      name: 格陵兰冰盖，1930
      text: 格陵兰的内陆冰盖，1930 至 1931 年德国考察队在冰盖中央设了一个站点。游戏里的格陵兰是一个约二十四人的队伍模型。
    ross_ice_shelf:
      name: 罗斯冰架，1912
      text: 南极边缘一大片漂浮的冰，新地号考察队往返极点都穿过这里。游戏里的罗斯冰架是一个约二十四人的队伍模型。
    everest_north_side:
      name: 珠穆朗玛峰北坡
      text: 世界最高峰的北坡，山下是绒布冰川，一串营地一直排到北坳和更高处。游戏里的珠峰是一个约三十人的队伍模型。
    chimborazo_slope:
      name: 钦博拉索，1802
      text: 厄瓜多尔安第斯山上的一座积雪火山，它的山顶是地球表面离地心最远的点。游戏里的钦博拉索是一个约十六人的队伍模型。
    galapagos_islands:
      name: 加拉帕戈斯群岛，1835
      text: 太平洋赤道上的一群火山岛，岸边干燥，淡水很少。游戏里的小猎犬号是一个约七十人的船员模型。
    tahiti_endeavour:
      name: 塔希提，1769
      text: 太平洋社会群岛中最大的一座岛，奋进号 1769 年在这里停泊，观测金星凌日。游戏里的奋进号是一个约九十人的船员模型。
    guangdong_university_office:
      name: 高等师范的礼堂，广州，1924
      text: 广州国立高等师范学校的礼堂，建在原贡院的旧址上。1924 年三所学校在这里筹备并成一所大学，星期天孙中山也在这座礼堂演讲。游戏里悬而未决的事的数目是模型算出来的，不是记载。
  people:
    snow:
      name: 约翰·斯诺
      text: 英国医生。1849 年已提出霍乱经水传播，1854 年通过逐户调查把病例与宽街水泵联系起来。游戏里他是员工可以合作的对象。
    semmelweis:
      name: 伊格纳茨·森梅尔维斯
      text: 匈牙利出身的产科医生，1847 年发现解剖室与产房的死亡有关，并要求接生前用氯化石灰溶液洗手。游戏里他是员工可以合作的对象。
    abel_froland:
      name: 尼尔斯·亨里克·阿贝尔
      text: 挪威数学家，1802 年生，1829 年去世。他证明了一般五次方程不能用根式求解，并在椭圆函数上取得早期进展。他二十六岁死于肺结核，不久之后他的工作才获得承认。
    ahmed_baba_timbuktu:
      name: 艾哈迈德·巴巴
      text: 廷巴克图学者，1556 年生，1627 年去世。他写过数十部法学与语法著作，并拥有一座规模很大的私人藏书室。1591 年摩洛哥征服之后他被带往马拉喀什，藏书被没收，后来才回到廷巴克图。
    al_haytham_cairo:
      name: 伊本·海赛姆
      text: 阿拉伯数学家与光学家，约 965 年生，约 1040 年去世，在开罗工作。他的《光学书》提出视觉来自进入眼睛的光，并依靠实验论证，被视为实验方法的早期代表。
    al_jazari_diyarbakir:
      name: 加扎里
      text: 为阿尔图格王朝宫廷服务的工程师，活跃于 1200 年前后。他 1206 年的《精巧机械装置知识之书》记载了水钟、自动机和水泵，其中出现了曲柄连杆与曲轴。
    al_khwarizmi_baghdad:
      name: 花拉子米
      text: 巴格达智慧宫的学者，约 780 年生，约 850 年去世。他讲述还原与对消的计算之书为代数命名，而他本人名字的拉丁化形式则成了“算法”一词。
    angkor_wat:
      name: 高棉的建造者们
      text: 吴哥窟寺庙群的建造者，建于十二世纪上半叶，在高棉国王苏利耶跋摩二世治下。设计仿照世界中心的须弥山，围墙上刻有长卷浮雕。建筑师的名字没有留下。
    antikythera_rhodes:
      name: 不知名的匠人
      text: 安提基特拉机械的不知名制造者。这是一件公元前二世纪前后的齿轮装置，1901 年从沉船中打捞出来，模拟日月运行并预测日月食。制造者的情况无人知晓。
    archimedes_syracuse:
      name: 阿基米德
      text: 叙拉古的希腊数学家与发明家，约公元前 287 年生，公元前 212 年去世。他求出了球体积，提出浮力原理和杠杆定律。罗马军队攻陷叙拉古时他被杀。
    aristarchus_alexandria:
      name: 阿利斯塔克斯
      text: 希腊天文学家，约公元前 310 年生，约公元前 230 年去世。现存著作估算了太阳与月亮的大小和距离，后世作者记载他提出过日心说，当时几乎没人接受。
    aristotle_lyceum:
      name: 亚里士多德
      text: 希腊哲学家，公元前 384 年生，公元前 322 年去世，柏拉图的学生，亚历山大大帝的老师。他在雅典创办吕克昂学园，著作涉及逻辑、生物、物理、伦理和政治，影响学术数百年。
    artemisia_florence:
      name: 阿尔泰米西娅·真蒂莱斯基
      text: 意大利画家，1593 年生，约 1656 年去世。她随父亲奥拉齐奥·真蒂莱斯基学画，1612 年卷入一桩著名的审判，此后画了许多坚毅的圣经与神话女性。1616 年她成为佛罗伦萨绘画艺术学院接纳的第一位女性。
    aryabhata_patna:
      name: 阿耶波多
      text: 印度数学家与天文学家，476 年生。他 499 年在库苏马普拉写成的著作给出接近 3.1416 的圆周率，用影子解释日月食，并论及地球自转。
    bach_leipzig:
      name: 约翰·塞巴斯蒂安·巴赫
      text: 德国作曲家与管风琴家，1685 年生，1750 年去世。1723 年起他担任莱比锡圣托马斯教堂的乐长，写下清唱剧、受难曲和键盘作品。他的音乐在十九世纪复兴之前，除音乐圈外鲜为人知。
    ban_zhao_luoyang:
      name: 班昭
      text: 汉代历史学家与作家，约 45 年生，约 117 年去世。班固去世后，她奉诏续修《汉书》。《后汉书》也记载马续后来参与此事。
    basho_hiraizumi:
      name: 松尾芭蕉
      text: 日本俳句诗人，1644 年生，1694 年去世。1689 年他步行游历北方，写下散文与俳句相间的《奥之细道》。
    beethoven_vienna:
      name: 路德维希·凡·贝多芬
      text: 德国作曲家，1770 年生，1827 年去世，大半生在维也纳工作。他从二十多岁末起听力渐退，1824 年首演《第九交响曲》时已几乎全聋。
    bell_boston:
      name: 亚历山大·格雷厄姆·贝尔
      text: 苏格兰出生的科学家与发明家，1847 年生，1922 年去世，在波士顿教聋人说话。1876 年他取得电话专利，并打出了第一通电话给助手。
    bessie_coleman_jacksonville:
      name: 贝茜·科尔曼
      text: 美国飞行员，1892 年生，1926 年去世，第一位取得飞行执照的黑人女性。她在美国被飞行学校拒之门外，于是学了法语，到法国受训。1926 年她在杰克逊维尔的一次坠机中去世。
    bi_sheng_printer:
      name: 毕昇
      text: 北宋工匠，约 1051 年去世。约 1041 年他用烧制的黏土制成活字，沈括记下了这种方法。
    bizet_paris:
      name: 乔治·比才
      text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
    boltzmann_duino:
      name: 路德维希·玻尔兹曼
      text: 奥地利物理学家，1844 年生，1906 年去世。他用原子的统计解释热的规律，熵公式刻在他的墓碑上。面对对原子存在的怀疑，又受抑郁困扰，他 1906 年在杜伊诺去世。
    boole_ballintemple:
      name: 乔治·布尔
      text: 英国数学家，1815 年生，1864 年去世，科克女王学院第一位数学教授。他建立了逻辑代数，后来成为数字电路的基础，因肺炎在巴林特普尔去世。
    bose_calcutta:
      name: 贾格迪什·钱德拉·博斯
      text: 印度物理学家与生物学家，1858 年生，1937 年去世，在加尔各答工作。他制造并探测毫米波无线电，后来用灵敏仪器测量植物的反应。
    brahmagupta_bhillamala:
      name: 婆罗摩笈多
      text: 印度数学家与天文学家，598 年生，约 668 年去世。他 628 年的著作把零当作一个数，给出它和负数的运算规则，还给出解二次方程的方法。
    buchner_zurich:
      name: 格奥尔格·毕希纳
      text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单逃往苏黎世。他二十三岁死于伤寒。
    buddha_sarnath:
      name: 悉达多·乔达摩
      text: 悉达多·乔达摩，即佛陀，生活在公元前五世纪前后的印度北部。传说他经多年修行于菩提伽耶觉悟，并在鹿野苑作了第一次说法，讲苦以及超越苦的道路。
    budj_bim_eels:
      name: 贡迪玛拉人
      text: 澳大利亚维多利亚州西南部的贡迪玛拉人。数千年间，他们在布吉比姆用火山岩修建水渠、堰和池塘来捕捉和养殖鳗鱼，是已知最古老的水产养殖系统之一。
    cai_lun_luoyang:
      name: 蔡伦
      text: 东汉宦官，121 年去世。105 年他向皇帝献上用树皮、破布和渔网做成的纸，比丝帛和竹简便宜得多。
    cajal_barcelona:
      name: 圣地亚哥·拉蒙-卡哈尔
      text: 西班牙神经科学家，1852 年生，1934 年去世。他用银染法证明神经系统由彼此分离的细胞组成，即神经元学说。他分享了 1906 年诺贝尔奖，1890 年代在巴塞罗那任教。
    camille_claudel_paris:
      name: 卡米耶·克洛岱尔
      text: 法国雕塑家，1864 年生，1943 年去世。她在罗丹的工作室做事，作品有《华尔兹》《成熟的年纪》。1913 年家人把她送进精神病院，她在那里度过最后三十年。
    cantor_halle:
      name: 格奥尔格·康托尔
      text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。
    cao_xueqin_beijing:
      name: 曹雪芹
      text: 清代小说家，约 1715 年生，约 1763 年去世。他写下《红楼梦》，讲一个大家族的盛衰，晚年住在北京西山，书稿未能写完。
    chekhov_badenweiler:
      name: 安东·契诃夫
      text: 俄国作家与医生，1860 年生，1904 年去世。他写短篇小说，也写了《海鸥》《万尼亚舅舅》《三姐妹》《樱桃园》。他在巴登维勒的疗养地死于肺结核。
    confucius_qufu:
      name: 孔子
      text: 中国思想家，公元前 551 年生，公元前 479 年去世，鲁国人。他讲授伦理、礼和善政，学生把他的言论汇编成《论语》。
    copernicus_frombork:
      name: 哥白尼
      text: 波兰天文学家与教士，1473 年生，1543 年去世，在弗龙堡工作。他的《天体运行论》于 1543 年印行，把太阳放在行星运行的中心。据说他在临终前才拿到第一本印好的书。
    curie_paris:
      name: 玛丽·居里
      text: 波兰出生的物理学家与化学家，1867 年生，1934 年去世，在巴黎工作。她与皮埃尔·居里研究放射性，1898 年发现钋和镭。她 1903 年获诺贝尔物理学奖，1911 年获化学奖，死于与辐射有关的疾病。
    dante_ravenna:
      name: 但丁
      text: 意大利诗人，1265 年生，1321 年去世，出身佛罗伦萨。1302 年被逐出故城，他用托斯卡纳语写下《神曲》，在拉韦纳去世并葬在那里。
    darwin_galapagos:
      name: 查尔斯·达尔文
      text: 英国博物学家，1809 年生，1882 年去世。随“小猎犬号”航行时，他在 1835 年到访加拉帕戈斯群岛，观察亲缘物种如何随岛屿而不同。1859 年出版的《物种起源》阐述了自然选择的进化论。
    democritus_abdera:
      name: 德谟克利特
      text: 阿布德拉的希腊哲学家，约公元前460年生。亚里士多德谈到实与虚空的学说时，将他与留基伯并提。德谟克利特的著作以残篇和后人的转述留存。
    descartes_leiden:
      name: 笛卡尔
      text: 法国哲学家与数学家，1596 年生，1650 年去世，一生大部分时间住在荷兰共和国。1637 年的《方法谈》含有“我思故我在”，附录中的几何学引入了坐标。
    dickinson_amherst:
      name: 艾米莉·狄金森
      text: 美国诗人，1830 年生，1886 年去世，大半生住在马萨诸塞州的阿默斯特。她写了近一千八百首诗，许多手工装订成册，生前只发表了寥寥几首。
    du_chatelet_luneville:
      name: 埃米莉·迪沙特莱
      text: 法国数学家与物理学家，1706 年生，1749 年去世。她把牛顿的《原理》译成法文并作注，论证运动物体的能量与速度的平方有关。她在吕内维尔因产后并发症去世。
    du_fu_xiang_river:
      name: 杜甫
      text: 唐代诗人，712 年生，770 年去世。他写战乱、饥荒和普通人的生活，格律功力深厚，主要在身后才受推崇。他死在湘江的一条船上。
    dunhuang_library_cave:
      name: 敦煌的僧人
      text: 敦煌莫高窟的僧人，约在 1000 年前后封存了一个小石窟。里面有数万件多种文字的写本，包括 868 年的《金刚经》，1900 年被重新打开。
    edison_menlo_park:
      name: 托马斯·爱迪生
      text: 美国发明家，1847 年生，1931 年去世。他在门洛帕克的实验室带领团队，于 1879 年做出耐用的电灯泡以及配套供电系统，持有一千多项专利。
    emily_bronte_haworth:
      name: 艾米莉·勃朗特
      text: 英国小说家与诗人，1818 年生，1848 年去世，住在霍沃斯的牧师住宅。她唯一的小说《呼啸山庄》1847 年以埃利斯·贝尔之名出版。一年后她死于肺结核。
    empedocles_akragas:
      name: 恩培多克勒
      text: 西西里阿克拉加斯的希腊哲学家，约公元前 494 年生，约公元前 434 年去世。他主张万物由土、气、火、水四种根构成，由爱与恨推动。
    enheduanna_ur:
      name: 恩赫杜安娜
      text: 乌尔月神的大祭司，阿卡德萨尔贡之女，活跃于公元前 2300 年前后。几篇用苏美尔语写成的早期作品传统上归于她名下。存世抄本年代较晚。
    eratosthenes_alexandria:
      name: 埃拉托色尼
      text: 希腊学者，约公元前 276 年生，约公元前 194 年去世，曾任亚历山大图书馆馆长。据后出的记述，他对照塞伊尼与亚历山大城的日照来估算地球周长。换算成现代单位要看取哪一种斯塔迪亚长度。
    euclid_alexandria:
      name: 欧几里得
      text: 约公元前 300 年在亚历山大工作的希腊数学家。他的《几何原本》从定义、公设和证明出发构建几何，两千多年里一直是标准教材。他的生平所知甚少。
    fanny_mendelssohn_berlin:
      name: 范妮·门德尔松·亨泽尔
      text: 德国作曲家与钢琴家，1805 年生，1847 年去世，费利克斯·门德尔松的姐姐。她写了几百首作品，包括歌曲和钢琴曲，但家人不赞成她出版。她在柏林排练时中风去世。
    faraday_london:
      name: 迈克尔·法拉第
      text: 英国科学家，1791 年生，1867 年去世，早年是装订学徒。1831 年他在伦敦皇家研究院发现电磁感应，也奠定了电化学的基础。
    fibonacci_pisa:
      name: 斐波那契
      text: 意大利数学家，约 1170 年生，约 1250 年去世，出身比萨。他 1202 年的《计算之书》把印度阿拉伯数字带到欧洲，书中兔子繁殖的问题产生了斐波那契数列。
    finlay_havana:
      name: 卡洛斯·芬莱
      text: 古巴医生，1833 年生，1915 年去世。1881 年他提出黄热病由蚊子传播，这个想法在 1900 年被里德委员会证实，成为防治这种病的基础。
    franklin_philadelphia:
      name: 本杰明·富兰克林
      text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
    freud_vienna:
      name: 西格蒙德·弗洛伊德
      text: 奥地利医生，1856 年生，1939 年去世，精神分析的创立者。1899 年的《梦的解析》提出梦表达隐藏的愿望。1938 年德国吞并奥地利后，他离开维也纳去了伦敦。
    galen_rome:
      name: 盖伦
      text: 来自佩加蒙的希腊医生，129年生，后来在罗马行医。他留下多部解剖学与医学著作，也写到自己在192年火灾中的损失。
    galileo_padua:
      name: 伽利略
      text: 意大利科学家，1564 年生，1642 年去世，曾在帕多瓦任教。他用望远镜看到木星的卫星和金星的位相，1610 年公布。后来他受宗教裁判所审判，晚年被软禁。
    galois_paris:
      name: 埃瓦里斯特·伽罗瓦
      text: 法国数学家，1811 年生，1832 年去世。他在少年时找到方程能否用根式求解的条件，并开创了群论。他二十岁时在巴黎因决斗去世。
    gaudi_barcelona:
      name: 安东尼·高迪
      text: 加泰罗尼亚建筑师，1852 年生，1926 年去世。他在巴塞罗那的建筑，包括巴特略之家和圣家堂，使用取自自然的曲线形态。他 1926 年被电车撞死，圣家堂至今未完工。
    ghalib_delhi:
      name: 迦利布
      text: 德里诗人，1797 年生，1869 年去世，用乌尔都语和波斯语写作。他的加扎勒诗是这门语言中最受喜爱的作品之一。他经历了 1857 年的起义，晚年债务缠身。
    giotto_padua:
      name: 乔托
      text: 意大利画家，约 1267 年生，1337 年去世。他约在 1305 年画成的帕多瓦斯克罗维尼礼拜堂壁画，人物有重量感和情感，被视为通向文艺复兴绘画的一步。
    great_zimbabwe:
      name: 大津巴布韦的建造者
      text: 大津巴布韦的建造者。这座石头城属于说绍纳语的族群，大约在十一世纪到十五世纪兴盛。大围墙不用灰浆垒成，城里的人与海岸做黄金和象牙贸易。
    gutenberg_mainz:
      name: 古腾堡
      text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
    hammurabi_babylon:
      name: 汉谟拉比
      text: 巴比伦国王，约公元前 1792 年至约公元前 1750 年在位。一块刻有近三百条法律的石碑以他命名，规定了交易、家庭和财产方面的规则与惩罚。
    heo_nanseolheon_hanyang:
      name: 许兰雪轩
      text: 朝鲜时代的诗人，1563 年生，1589 年去世，以汉文写诗。弟弟许筠在她去世后收集她的作品。
    heron_alexandria:
      name: 希罗
      text: 公元一世纪在亚历山大工作的希腊工程师。他描述了汽转球、自动门和投币售水装置，也写过几何学与土地测量的著作。
    hertz_bonn:
      name: 海因里希·赫兹
      text: 德国物理学家，1857 年生，1894 年去世。1887 至 1888 年他产生并探测到无线电波，证实了麦克斯韦的电磁理论。频率单位以他命名，他年纪轻轻就在波恩去世。
    higuchi_ichiyo_tokyo:
      name: 樋口一叶
      text: 日本作家，1872 年生，1896 年去世。她靠写作养家，在 1890 年代中期发表了《比肩》等代表作，写贫苦市民的生活。她二十四岁死于肺结核。
    hildegard_bingen:
      name: 宾根的希尔德加德
      text: 德国女修道院长，1098 年生，1179 年去世，在莱茵河畔的宾根。她写幻象神学、医学与博物学著作，还作了大量圣咏，是中世纪个人留存作品最多的作曲家之一。
    hipparchus_rhodes:
      name: 喜帕恰斯
      text: 希腊天文学家，约公元前 190 年生，约公元前 120 年去世，在罗得岛观测。他编制星表，发现岁差，并为天文学发展了三角学。
    hippocrates_kos:
      name: 希波克拉底
      text: 科斯岛的希腊医生，约公元前 460 年生，约公元前 370 年去世。以他名义流传的医学文集把疾病看作自然现象而非神意，强调仔细观察病人。
    hokusai_edo:
      name: 葛饰北斋
      text: 日本画家，1760 年生，1849 年去世，江户人。1831 年起出版的《富岳三十六景》包括《神奈川冲浪里》。他多次改名，到老仍在作画。
    hooke_london:
      name: 罗伯特·胡克
      text: 英国科学家，1635 年生，1703 年去世。他任皇家学会实验管理员，1665 年出版《显微图谱》，展示了软木的细胞结构，并提出以他命名的弹性定律。
    house_of_wisdom:
      name: 花拉子米与智慧宫
      text: 智慧宫与巴格达阿拔斯宫廷的藏书传统有关。九世纪的翻译活动遍及多处，由不同的学者和赞助人推动。侯奈因在书信中记录了译者搜寻和比勘底本的工作。
    hua_tuo_xuchang:
      name: 华佗
      text: 汉末医生。《三国志》的后出传记叙述其行医经过，把五禽戏归于他，也记下他因曹操下令而被关押、遇害。
    hypatia_alexandria:
      name: 希帕提娅
      text: 希腊数学家与哲学家，约 355 年生，415 年去世，在亚历山大教学。她为数学与天文学著作作注。在城中的政治与宗教冲突里，她被暴徒杀害。
    ibn_al_nafis_cairo:
      name: 伊本·纳菲斯
      text: 十三世纪的医生，在大马士革求学，后来在开罗行医。他为伊本·西那《医典》所作的解剖注释认为，血液从心脏右侧经肺到达左侧。
    ibn_battuta_tangier:
      name: 伊本·白图泰
      text: 摩洛哥旅行家，丹吉尔人，1304 年生，约 1369 年去世。他的《游记》在归来后编成，记有近三十年间在北非、阿拉伯、印度、中国和西非的见闻。
    ibn_khaldun_cairo:
      name: 伊本·赫勒敦
      text: 阿拉伯历史学家与政治家，1332 年生，1406 年去世，生于突尼斯。他的《历史绪论》分析王朝的兴衰和群体凝聚力的作用，被视为社会科学的早期著作。他在开罗去世。
    ibn_rushd_lucena:
      name: 伊本·鲁世德
      text: 安达卢斯的哲学家与医生，1126 年生，1198 年去世，拉丁名阿威罗伊。他为亚里士多德作的注释在欧洲广为流传，曾任科尔多瓦和塞维利亚的法官，一度被流放到卢塞纳。
    ibn_sina_hamadan:
      name: 伊本·西那
      text: 波斯医生与哲学家，约 980 年生，1037 年去世，拉丁名阿维森纳。他的《医典》在欧洲和伊斯兰世界数百年里是标准教材，他在哈马丹去世。
    ife_bronzes:
      name: 伊费的铸造匠人
      text: 伊费的铸造匠人。伊费是约鲁巴人的城市，在今尼日利亚境内。大约从十二世纪到十五世纪，他们用失蜡法做出写实的铜合金头像。
    imhotep_saqqara:
      name: 伊姆霍特普
      text: 古埃及第三王朝的官员与建筑师，活跃于公元前 2650 年前后。相传他设计了萨卡拉的左塞尔阶梯金字塔，这是最早的大型石构建筑之一，后来他被奉为医药之神。
    jenner_berkeley:
      name: 爱德华·詹纳
      text: 英国医生，1749 年生，1823 年去世，格洛斯特郡伯克利人。1796 年他给一个男孩接种牛痘，证明它能预防天花，这是疫苗接种的开端。
    jianzhen_nara:
      name: 鉴真
      text: 中国僧人，688年生，763年去世。他于753年起航，754年抵达奈良，在东大寺传戒。唐招提寺创建于759年。
    kabir_maghar:
      name: 迦比尔
      text: 北印度虔敬诗人。有关他生平的细节，各传承记载有异。归于迦比尔的诗歌流传广泛，有些保存在《古鲁·格兰特·萨希卜》中。
    kafka_kierling:
      name: 弗朗茨·卡夫卡
      text: 用德语写作的布拉格作家，1883 年生，1924 年去世。他在保险公司工作，大部分作品没有发表，并请朋友烧掉。马克斯·布罗德出版了《审判》和《城堡》。他在基尔林的疗养院死于肺结核。
    kant_konigsberg:
      name: 伊曼努尔·康德
      text: 德国哲学家，1724 年生，1804 年去世，一生在柯尼斯堡度过。1781 年出版的《纯粹理性批判》考察理性能知道什么以及它的界限。
    keats_rome:
      name: 约翰·济慈
      text: 英国诗人，1795 年生，1821 年去世。他在短短几年里写出包括颂诗在内的主要作品，二十五岁时在罗马死于肺结核。
    kepler_leonberg:
      name: 约翰内斯·开普勒
      text: 德国天文学家，1571 年生，1630 年去世。他根据第谷·布拉赫的观测归纳出行星运动三定律。1620 年他的母亲在莱昂贝格因巫术受审，他协助辩护。
    knossos_linear_a:
      name: 米诺斯的书吏
      text: 米诺斯克里特的书吏，约公元前 1500 年在克诺索斯记账。用来书写米诺斯语的线形文字甲至今没有破译。它的后继者线形文字乙在 1952 年被读出，写的是希腊语。
    lalibela_rock:
      name: 拉利贝拉与石匠们
      text: 拉利贝拉与埃塞俄比亚扎格韦王朝的石匠。十二世纪末到十三世纪初，以他命名的城镇周围，十一座教堂从岩石中向下凿出。
    laozi_hangu:
      name: 老子
      text: 与《道德经》相连的传统称呼。司马迁记老子应尹喜之请在关口留下著作，也收录了有关老子身份的不同说法。游戏所用的函谷关是后世传说中的具体地点。
    lavoisier_paris:
      name: 拉瓦锡
      text: 法国化学家，1743 年生，1794 年去世。他阐明氧在燃烧中的作用，参与建立现代化学命名体系，并陈述了质量守恒。他在恐怖时期被送上断头台。
    leavitt_cambridge_ma:
      name: 亨丽埃塔·勒维特
      text: 美国天文学家，1868 年生，1921 年去世，在哈佛天文台工作。她发现造父变星的周期与亮度相关，天文学家由此得以测量到其他星系的距离。
    leeuwenhoek_delft:
      name: 列文虎克
      text: 荷兰布商与显微镜学家，1632 年生，1723 年去世，代尔夫特人。他用自己磨制的单透镜显微镜看到细菌、红细胞和精子，并在给皇家学会的信中描述。
    leonardo_florence:
      name: 列奥纳多·达·芬奇
      text: 意大利画家与工程师，1452 年生，1519 年去世。他画了《最后的晚餐》和约 1503 年在佛罗伦萨开始的《蒙娜丽莎》，并用数千页笔记研究解剖、水流和机械。
    li_bai_changan:
      name: 李白
      text: 唐代诗人，701 年生，762 年去世。他写酒、友情和月亮的抒情诗，曾在长安宫廷任职，后来离开。他的许多诗至今仍被传诵。
    li_qingzhao_hangzhou:
      name: 李清照
      text: 宋代词人，约 1084 年生，约 1155 年去世。她写爱情与失去的词，1127 年北方沦陷，家园与丈夫都失去了，晚年住在南方。
    li_shizhen_qizhou:
      name: 李时珍
      text: 明代医生，1518 年生，1593 年去世。他花了近三十年写成《本草纲目》，记载约一千九百种药物，书在他去世后刊行。
    lili_boulanger_paris:
      name: 莉莉·布朗热
      text: 法国作曲家，1893 年生，1918 年去世。1913 年她成为第一位获得罗马大奖作曲奖的女性。她一生体弱，二十四岁去世。
    lovelace_london:
      name: 阿达·洛芙莱斯
      text: 英国数学家，1815 年生，1852 年去世，拜伦勋爵之女。1843 年她发表了为查尔斯·巴贝奇分析机所作的注释，其中有计算伯努利数的方法，常被称为第一个程序，并提出这类机器可以处理数以外的东西。
    machu_picchu:
      name: 印加的建造者们
      text: 马丘比丘的印加建造者。马丘比丘是约 1450 年建在安第斯山脊上的王室庄园，石墙不用灰浆砌合。西班牙征服后遗址被废弃，直到 1911 年才为外界熟知。
    mallory_everest:
      name: 乔治·马洛里
      text: 英国登山家，1886 年生，1924 年去世。在 1924 年的英国探险中，他与安德鲁·欧文在珠穆朗玛峰高处失踪。1999 年他的遗体被找到，他们是否登顶至今不明。
    marconi_bologna:
      name: 古列尔莫·马可尼
      text: 意大利发明家，1874 年生，1937 年去世，博洛尼亚人。从 1895 年起他发展无线电报，1901 年发出跨越大西洋的信号，并分享了 1909 年诺贝尔物理学奖。
    mary_anning_lyme_regis:
      name: 玛丽·安宁
      text: 英国化石采集者，1799 年生，1847 年去世，莱姆里吉斯人。她在海边悬崖挖出了第一批完整的鱼龙和蛇颈龙骨架。作为一个家境普通的女性，她生前很少在科学论文里被署名。
    maya_codices_mani:
      name: 玛雅书吏
      text: 尤卡坦的玛雅书吏制作折页写本。1562年，迭戈·德·兰达主持的马尼宗教审判仪式毁去书籍和宗教物件。《墨西哥玛雅抄本》等存世写本保存了这一制书传统的实物证据。
    maya_venus_tables:
      name: 玛雅书吏们
      text: 古典期及之后的玛雅书吏，他们追踪金星、月亮和日月食的周期。《德累斯顿抄本》里有金星 584 天周期的表，误差很小。
    mendel_brno:
      name: 格雷戈尔·孟德尔
      text: 捷克与奥地利的修士与科学家，1822 年生，1884 年去世，布尔诺人。他在修道院花园里杂交豌豆，发现性状按固定比例遗传，成果 1866 年发表，到 1900 年前后才受到注意。
    mendeleev_petersburg:
      name: 门捷列夫
      text: 俄国化学家，1834 年生，1907 年去世。1869 年他在圣彼得堡发表周期表，按原子量排列元素，并为尚未发现的元素留出空位。
    meroitic_meroe:
      name: 麦罗埃的书吏
      text: 苏丹境内尼罗河畔麦罗埃王国的书吏。他们使用的麦罗埃文字从约公元前二世纪起通行，读音已能辨认，但语言本身大体上仍未被理解。
    miyazawa_kenji_hanamaki:
      name: 宫泽贤治
      text: 日本诗人与童话作家，1896 年生，1933 年去世，花卷人。他教农业，帮助贫苦农民，并写了《银河铁道之夜》。他的作品大多在身后出版。
    modigliani_paris:
      name: 阿梅迪奥·莫迪利亚尼
      text: 意大利画家与雕塑家，1884 年生，1920 年去世，在巴黎工作。他画脖子细长、眼睛如杏仁的肖像和裸体，生前卖得很少，三十五岁死于结核性脑膜炎。
    mohenjo_daro_indus:
      name: 印度河流域的居民
      text: 印度河流域文明的居民，约公元前 2500 年建起摩亨佐·达罗这样的城市，街道规整，有排水系统和砖房。他们留下刻有文字的印章，这种文字至今没有破译。
    morse_washington:
      name: 塞缪尔·莫尔斯
      text: 美国画家与发明家，1791 年生，1872 年去世。他与阿尔弗雷德·维尔合作发展电报机和点划电码。1844 年 5 月 24 日，他从华盛顿向巴尔的摩发出了“上帝创造了何等奇迹”。
    mozart:
      name: 沃尔夫冈·阿马德乌斯·莫扎特
      text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
    murasaki_kyoto:
      name: 紫式部
      text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
    nalanda_library:
      name: 那烂陀的僧人
      text: 那烂陀是比哈尔邦的佛教讲学中心，有供居住和教学的建筑。亚洲各地有人来此求学。《达摩斯瓦明传》仍记有十三世纪在此访学的经历。
    newton_cambridge:
      name: 艾萨克·牛顿
      text: 英国数学家与物理学家，1643 年生，1727 年去世，剑桥人。1687 年的《原理》陈述了运动定律和万有引力定律。他还研究光学并发展了微积分，后来主管皇家铸币厂。
    nezahualcoyotl_texcoco:
      name: 内萨瓦尔科约特尔
      text: 特斯科科统治者，传统生卒年为1402至1472年。晚出的纳瓦特尔语歌集将一些歌曲与他的名字联系起来。歌里的措辞与歌旁的归属题记，各保存了流传过程中的一部分。
    nietzsche_turin:
      name: 弗里德里希·尼采
      text: 德国哲学家，1844 年生，1900 年去世。他写了《查拉图斯特拉如是说》，批判道德与宗教。1889 年 1 月他在都灵崩溃，再也没有恢复心智，晚年由母亲和妹妹照料。
    nightingale_scutari:
      name: 弗洛伦斯·南丁格尔
      text: 英国护士与统计学家，1820 年生，1910 年去世。1854 年克里米亚战争期间，她带领护士到斯库塔里的英军医院，改善卫生，并用图表说明病死的士兵比战死的多。
    noether_gottingen:
      name: 埃米·诺特
      text: 德国数学家，1882 年生，1935 年去世。她在哥廷根证明了物理系统的每种对称性对应一个守恒量，并塑造了现代抽象代数。1933 年她丢掉职位，移居美国。
    omar_khayyam_nishapur:
      name: 欧玛尔·海亚姆
      text: 波斯数学家、天文学家与诗人，1048 年生，1131 年去世，尼沙布尔人。他用几何方法分类并求解三次方程，参与历法改革，在英语世界以《鲁拜集》的四行诗闻名。
    ovid_tomis:
      name: 奥维德
      text: 罗马诗人，公元前 43 年生，约公元 17 年去世。他写了《变形记》和爱情诗。公元 8 年，奥古斯都皇帝把他流放到黑海边的托米斯，他死在那里。
    pasteur_paris:
      name: 路易·巴斯德
      text: 法国化学家与微生物学家，1822年生，1895年去世。他研究发酵和腐败，发展了巴氏消毒法。1885年，巴斯德团队为被狗咬伤的约瑟夫·迈斯特接种狂犬病疫苗。
    plato_academy:
      name: 柏拉图
      text: 希腊哲学家，约公元前 428 年生，约公元前 348 年去世，苏格拉底的学生。他在雅典创办学园，写下关于正义、知识和灵魂的对话，主要发言者是苏格拉底。
    pliny_stabiae:
      name: 老普林尼
      text: 罗马作家与海军指挥官，公元 23 年生，79 年去世。他的《博物志》用三十七卷汇集知识。维苏威火山喷发时，他在斯塔比亚附近试图救人而去世。
    poe_baltimore:
      name: 埃德加·爱伦·坡
      text: 美国作家，1809 年生，1849 年去世。他写恐怖和推理故事，有《乌鸦》和《莫格街凶杀案》。他去世前几天被人发现在巴尔的摩神志不清，死因不明。
    puccini_brussels:
      name: 贾科莫·普契尼
      text: 意大利作曲家，1858 年生，1924 年去世，作有《波希米亚人》《托斯卡》《蝴蝶夫人》等歌剧。他因喉癌在布鲁塞尔治疗期间去世，《图兰朵》尚未写完。
    pushkin_st_petersburg:
      name: 亚历山大·普希金
      text: 俄国诗人，1799 年生，1837 年去世，常被视为现代俄国文学的奠基人。他用诗体写了《叶甫盖尼·奥涅金》。1837 年他在圣彼得堡决斗中受伤，两天后去世。
    pythagoras_croton:
      name: 毕达哥拉斯
      text: 萨摩斯的希腊思想家，传统生卒年约为公元前570至前495年，与克罗顿的一个团体有关。亚里士多德记述，毕达哥拉斯派把音程与数的比例联系起来。
    qu_yuan_miluo:
      name: 屈原
      text: 楚国诗人与大臣，约公元前 340 年生，约公元前 278 年去世。他的长诗《离骚》是中国诗歌的奠基之作。楚国都城陷落后，据说他投汨罗江自尽，端午节与对他的纪念有关。
    ramanujan_madras:
      name: 斯里尼瓦瑟·拉马努金
      text: 印度数学家，1887 年生，1920 年去世，在马德拉斯的贫困中长大。他基本靠自学，1913 年写信给 G. H. 哈代，附上有关级数和数论的结果，后来前往剑桥，因病早逝。
    rembrandt_amsterdam:
      name: 伦勃朗
      text: 荷兰画家与蚀刻师，1606 年生，1669 年去世。他画光线强烈的肖像和圣经场景，包括《夜巡》。1656 年他破产，晚年在阿姆斯特丹负债度日。
    riemann_selasca:
      name: 伯恩哈德·黎曼
      text: 德国数学家，1826 年生，1866 年去世。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，黎曼猜想至今未解。他在马焦雷湖畔的塞拉斯卡死于肺结核。
    rongorongo_rapa_nui:
      name: 拉帕努伊人
      text: 拉帕努伊人发展了在木面刻写朗格朗格符号的传统。十九世纪的动荡打断了部分知识的传承。存世实物、拉帕努伊人的口述知识和学界的释读工作各保留了这段历史的一部分。
    rumi_konya:
      name: 鲁米
      text: 波斯诗人与导师，1207 年生，1273 年去世，住在科尼亚。他的《玛斯纳维》和抒情诗是苏菲文学中读者最多的作品之一，追随者创立了梅芙莱维教团。
    sappho_lesbos:
      name: 萨福
      text: 莱斯博斯的希腊诗人，活跃于公元前 600 年前后。她写关于渴望与失去的抒情诗，古代汇编成九卷，如今只留下一首完整的诗和一些残片。
    savitribai_phule_pune:
      name: 萨维特里白·普勒
      text: 印度教师与诗人，1831 年生，1897 年去世。1848 年她与丈夫乔蒂拉奥·普勒在浦那开办女校，为此遭到敌视，后来又开设寡妇之家，并照顾鼠疫病人。
    schubert_vienna:
      name: 弗朗茨·舒伯特
      text: 奥地利作曲家，1797 年生，1828 年去世，生于维也纳。他写了六百多首歌曲，以及交响曲和室内乐，大部分在他生前没有出版或广泛演出。他三十一岁去世。
    schumann_endenich:
      name: 罗伯特·舒曼
      text: 德国作曲家，1810 年生，1856 年去世。1854 年精神崩溃并试图自尽后，他住进波恩附近恩登尼希的私人疗养院，两年后在那里去世。他的妻子克拉拉·舒曼是著名的钢琴家与作曲家。
    scott_last_camp:
      name: 罗伯特·法尔肯·斯科特
      text: 英国海军军官与探险家，1868 年生，1912 年去世。他率领“新地”号探险队前往南极点，1912 年 1 月到达时发现阿蒙森已先到，返程穿越罗斯冰架时与同伴一起去世。
    sei_shonagon_kyoto:
      name: 清少纳言
      text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
    sejong_hangul:
      name: 世宗大王与学者们
      text: 朝鲜国王，1397 年生，1450 年去世。他与集贤殿的学者创制了一套适合朝鲜语的新文字，1446 年颁布，名为《训民正音》，好让百姓学会读写。
    sequoyah_syllabary:
      name: 塞阔雅
      text: 切罗基银匠，约 1770 年生，1843 年去世。他不识英文，在 1809 至 1821 年间为切罗基语创制了含八十五个字符的音节文字。几年之内，大多数切罗基成年人都学会了读。
    shakespeare_globe:
      name: 威廉·莎士比亚
      text: 英国剧作家与诗人，1564 年生，1616 年去世。他为在伦敦环球剧院演出的剧团写了约三十七部戏，包括《哈姆雷特》和《麦克白》，环球剧院于 1599 年开张，他也写十四行诗。
    shen_kuo_runzhou:
      name: 沈括
      text: 宋代学者与官员，1031 年生，1095 年去世。他在润州写成的《梦溪笔谈》记载了指南针、活字印刷、侵蚀地质学以及许多其他观察。
    sima_qian_changan:
      name: 司马迁
      text: 汉代历史学家，约公元前 145 年生，约公元前 86 年去世。他在皇帝面前为一位将军辩护而被处以宫刑，之后完成《史记》，写从传说时代到他当代的历史。
    smith_kirkcaldy:
      name: 亚当·斯密
      text: 苏格兰哲学家与经济学家，1723 年生，1790 年去世，生于柯卡尔迪。1776 年出版的《国富论》论证了分工和自由交换会增加国家的财富。他还写了《道德情操论》。
    socrates_athens:
      name: 苏格拉底
      text: 雅典的希腊哲学家，公元前 470 年生，公元前 399 年去世。他自己没有留下著作，后人通过柏拉图和色诺芬了解他。他向同胞追问美德，被控不敬神和败坏青年，饮毒芹汁而死。
    song_yingxing_fengxin:
      name: 宋应星
      text: 晚明学者，1587 年生，约 1666 年去世。他的《天工开物》1637 年刊行，详细记述农业、纺织、冶金和许多手工业。
    sophie_germain_paris:
      name: 索菲·热尔曼
      text: 法国数学家，1776 年生，1831 年去世。她被大学拒之门外，靠书本自学，并以男性名字通信。她在费马大定理上取得进展，并因对振动板的研究获得科学院奖。
    sor_juana_mexico_city:
      name: 胡安娜修女
      text: 墨西哥修女、诗人与学者，1648 或 1651 年生，1695 年去世。她在墨西哥城的修道院里收藏了大批图书，写诗和戏剧。1691 年她回复一位主教的信为女性求学的权利辩护，后来在压力下交出了藏书。
    su_shi_huangzhou:
      name: 苏轼
      text: 宋代诗人、书法家与官员，1037 年生，1101 年去世。1080 年因一桩政治案件被贬到黄州，他在那里种地，并写出了几篇最有名的诗文。
    su_song_kaifeng:
      name: 苏颂
      text: 宋代官员与工程师，1020 年生，1101 年去世。1088 年他在开封建成一座水力驱动的天文钟塔，带有擒纵机构和转动的天球。
    tagore_santiniketan:
      name: 罗宾德拉纳特·泰戈尔
      text: 孟加拉诗人与教育家，1861 年生，1941 年去世。他写诗、歌曲、戏剧和小说，在圣蒂尼克坦创办学校，1913 年成为第一位获得诺贝尔文学奖的非欧洲人。
    tang_xianzu_linchuan:
      name: 汤显祖
      text: 明代剧作家，1550 年生，1616 年去世。他退居临川，1598 年写成《牡丹亭》，这是一部关于爱情跨越梦与现实界限的长剧。
    taqi_al_din_istanbul:
      name: 塔基·丁
      text: 奥斯曼学者与天文学家，1526 年生，1585 年去世。1570 年代他在伊斯坦布尔建起带大型仪器的天文台，还写过钟表和力学的著作。天文台在 1580 年被拆毁。
    tenochtitlan_lake:
      name: 墨西卡的建造者们
      text: 墨西卡人在特斯科科湖的一座岛上发展特诺奇蒂特兰，通行的建城纪年是 1325 年。城中有堤道、运河和引水渠。湖盆地区名为奇南帕的耕地为人工垫高的固定田块，由水道分隔。
    terence_rome:
      name: 泰伦提乌斯
      text: 罗马剧作家，约公元前 195 年生，约公元前 159 年去世。据说他作为奴隶从北非被带到罗马，写了六部改编自希腊戏剧的喜剧，全部留存至今。
    tesla_wardenclyffe:
      name: 尼古拉·特斯拉
      text: 塞尔维亚裔美国发明家，1856 年生，1943 年去世。他发展了交流电系统和感应电动机。1901 年他在长岛沃登克里弗开始建造一座用于无线传输的大塔，项目后来因资金耗尽而中止。
    thales_miletus:
      name: 泰勒斯
      text: 米利都的早期希腊思想家，传统生卒年约为公元前624至前546年。后人把他与对自然现象的解释联系起来。希罗多德称他预告过一次白昼转暗的年份，这次事件通常被认为是公元前585年的日食。
    timbuktu_sankore:
      name: 曼萨·穆萨与桑科雷的学者们
      text: 马里皇帝曼萨·穆萨与桑科雷的学者们。据说穆萨在 1324 至 1325 年到麦加朝觐后带回了学者和建筑师，此后数百年里，廷巴克图的清真寺及其学校成为学术中心。
    tupaia_tahiti:
      name: 图帕亚
      text: 来自赖阿特阿岛的领航人与祭司，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
    ulugh_beg_samarkand:
      name: 兀鲁伯
      text: 帖木儿王朝的统治者与天文学家，1394 年生，1449 年去世。他在撒马尔罕建起大型天文台，编出精度很高的星表。他被亲生儿子下令杀死。
    van_gogh_auvers:
      name: 文森特·梵高
      text: 荷兰画家，1853 年生，1890 年去世。他只画了大约十年，留下两千多件作品，卖出的很少。最后几周他住在瓦兹河畔奥维尔，1890 年 7 月因枪伤去世。
    vermeer_delft:
      name: 约翰内斯·维米尔
      text: 荷兰画家，1632 年生，1675 年去世，代尔夫特人。他画光线柔和的静谧室内场景，如《戴珍珠耳环的少女》，留存的作品只有约四十件，去世时家人负债。
    vesalius_padua:
      name: 维萨里
      text: 佛兰德解剖学家，1514 年生，1564 年去世，曾在帕多瓦任教。他 1543 年的《人体构造》配有取自亲自解剖的细致插图，纠正了盖伦的许多说法。
    wallace_ternate:
      name: 阿尔弗雷德·拉塞尔·华莱士
      text: 威尔士博物学家，1823 年生，1913 年去世。1858 年他在特尔纳特岛发烧期间写出自然选择的进化思想并寄给查尔斯·达尔文，当年便有了联合宣读。他还划出了今天称为华莱士线的动物分界。
    wang_zhenyi_jinling:
      name: 王贞仪
      text: 清代天文学家与数学家，1768 年生，1797 年去世。她用灯、镜子和圆桌做模型解释日月食，还写过数学著作，二十九岁去世。
    wegener_greenland:
      name: 阿尔弗雷德·魏格纳
      text: 德国科学家，1880 年生，1930 年去世。1912 年他提出大陆在地球表面漂移，这一想法被拒绝了几十年。1930 年他在一次考察中死于格陵兰冰盖上。
    wright_kitty_hawk:
      name: 奥维尔和威尔伯·莱特
      text: 美国的威尔伯·莱特，1867 年生，1912 年去世，以及奥维尔·莱特，1871 年生，1948 年去世，兄弟俩在代顿开自行车铺。他们靠风洞和自制滑翔机，于 1903 年 12 月 17 日在小鹰镇完成了第一次有动力、可操纵的飞行。
    xu_xiake_lijiang:
      name: 徐霞客
      text: 明代旅行家，1587 年生，1641 年去世。约三十年里他徒步走过中国的山川和洞穴，笔记后来被整理为《徐霞客游记》，对岩溶地貌有细致描述。
    zhang_heng_luoyang:
      name: 张衡
      text: 汉代通才，78 年生，139 年去世。《后汉书》记载他于 132 年制铜质候风地动仪，并叙述观测者如何把报动信号与方向对应。他也研制天文仪器，创作诗赋。
    zhu_shijie_yangzhou:
      name: 朱世杰
      text: 元代数学家，活跃于 1300 年前后。他 1303 年的《四元玉鉴》用类似现代矩阵的方法解最多含四个未知数的多项式方程组。
    zu_chongzhi_jiankang:
      name: 祖冲之
      text: 中国数学家与天文学家，429 年生，500 年去世。他算出圆周率介于 3.1415926 和 3.1415927 之间，这个精度近千年无人超过，还编制了大明历。
    xuanzang_changan:
      name: 玄奘
      text: 唐代僧人，约 602 年生，664 年去世。629 年前后西行求法，在印度学习多年，645 年带着六百多部佛经回到长安，其后主持译经，译出七十多部。
    jia_sixie_gaoyang:
      name: 贾思勰
      text: 北魏人，生卒年不详。他写成的《齐民要术》成书约在 6 世纪三四十年代，是中国现存最早的系统农书。
    qin_jiushao_huzhou:
      name: 秦九韶
      text: 南宋数学家，约 1202 年生，约 1261 年去世。1247 年写成《数书九章》，其中的大衍求一术相当于解一次同余方程组，即后来所说的中国剩余定理。
    al_biruni_ghazna:
      name: 比鲁尼
      text: 中亚学者，973 年生，约 1050 年后去世。他通晓天文、数学、地理和多种语言，曾用山的高度和地平线的俯角估算地球半径，并留下关于印度的详细著作。
    al_razi_rayy:
      name: 拉齐
      text: 波斯医生，约 865 年生，925 年去世。他在雷伊和巴格达行医，留下大量病例记录，在一部专著里把天花与麻疹区分开来。
    sushruta_varanasi:
      name: 妙闻
      text: 古印度医者，传统上被认为是《妙闻集》的作者，书中有外科手术、器械和整形的内容。他生活的年代和是否为同一个人都有争议。
    borobudur_java:
      name: 婆罗浮屠的建造者们
      text: 8 至 9 世纪在爪哇中部建造婆罗浮屠的工匠和劳工，姓名没有留下。建造的确切年代范围有不同说法。
    zeami_sado:
      name: 世阿弥
      text: 日本能乐演员和剧作家，约 1363 年生，约 1443 年去世。他留下多部关于能乐的论著，1434 年被流放到佐渡岛。
    ino_tadataka_ezo:
      name: 伊能忠敬
      text: 日本的测量家，1745 年生，1818 年去世。50 岁以后学习天文和测量，1800 年起走遍日本海岸，主持绘制了精度很高的全国地图。
    djenne_builders:
      name: 杰内的泥砖建造者们
      text: 西非杰内的工匠和街坊有用泥土建屋和维护土墙的传统。现存大清真寺在 1907 年重建，当地社区至今仍定期重抹墙面。
    ahmes_thebes:
      name: 阿赫摩斯
      text: 古埃及书吏，约公元前 16 世纪在底比斯一带抄写了今天所说的莱因德纸草，是现存最重要的古埃及数学文献之一。
    quipu_cusco:
      name: 结绳记事的人
      text: 印加社会里用结绳记录数目的账房人员。绳结的读法有许多至今未解，百科只写已知的部分。
    humboldt_chimborazo:
      name: 亚历山大·冯·洪堡
      text: 德国博物学家和探险家，1769 年生，1859 年去世。1802 年他在厄瓜多尔攀登钦博拉索山，到达约五千六百米，记录了高度、植被与气候的关系。
    banneker_maryland:
      name: 本杰明·班纳克
      text: 美国自学成才的天文学家和农夫，1731 年生，1806 年去世。1791 年他协助测绘华盛顿特区，1792 年起出版历书。
    seacole_balaklava:
      name: 玛丽·西科尔
      text: 牙买加出生的护士和商人，1805 年生，1881 年去世。申请做军队护士被拒绝后自费前往克里米亚，在营地后方照看伤病员。
    mitchell_nantucket:
      name: 玛丽亚·米切尔
      text: 美国天文学家，1818 年生，1889 年去世。1847 年发现一颗彗星，后来在美国担任天文学教授。
    caroline_herschel_slough:
      name: 卡罗琳·赫歇尔
      text: 德国出生的英国天文学家，1750 年生，1848 年去世。她是天文学家威廉·赫歇尔的妹妹，1786 年发现了自己的第一颗彗星，后来又发现多颗彗星。
    kovalevskaya_stockholm:
      name: 索菲娅·柯瓦列夫斯卡娅
      text: 俄国数学家，1850 年生，1891 年去世。她在斯德哥尔摩任教授，1888 年因对刚体旋转问题的研究获得法国科学院的奖。
    chaco_sun_watchers:
      name: 查科峡谷的人们
      text: 先民在查科峡谷建起大型石屋。研究者在法哈达孤丘记录了岩刻上的光影变化。这片峡谷至今是普韦布洛人和其他族群的祖先之地与圣地。
    rapa_nui_moai:
      name: 拉帕努伊的石像匠人
      text: 凿刻并立起摩艾的拉帕努伊人，大多在十三到十六世纪。他们的后裔今天仍生活在岛上，并照管着包含采石场的公园。
    hargrave_stanwell_park:
      name: 劳伦斯·哈格雷夫
      text: 出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱式风筝，并把飞行研究公开发表，不申请专利。
    sun_yat_sen_guangzhou:
      name: 孙中山
      text: 中国革命家和政治领袖，1866 年生，1925 年去世。1924 年 2 月 4 日他下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。1924 年 1 月 27 日到 8 月 24 日，他利用星期天在高等师范的礼堂演讲，共十六讲，讲稿经记录、校改后印行。9 月 19 日开学，11 月 11 日成立典礼上用的校训是他写的。他 1924 年 12 月 31 日抵达北京，1925 年 1 月 26 日因癌症接受手术，3 月 12 日在北京去世。1926 年 8 月 17 日国民政府下令把这所大学改名为国立中山大学。
    zhuge_liang:
      name: 诸葛亮
      text: 刘备的谋臣，后来任蜀汉丞相。陈寿《三国志》记他在隆中躬耕陇亩，好为《梁父吟》，《三国志》和他自己的《前出师表》都留下了三顾的说法。诸葛亮草船借箭是《三国演义》第四十六回的情节。
    qin_liangyu_shizhu:
      name: 秦良玉
      text: 明末忠州人，马千乘之后代领石砫之职。《明史》为她立传，记她所部号白杆兵，亦记崇祯三年她出家财济饷。
  events:
    pump_handle:
      name: 宽街泵柄被拆
      text: 史载 9 月 8 日泵柄被拆走。拆走时疫情已经在下降，很多居民早已离开，所以泵柄被拆能救多少人至今有争论。游戏里员工能让泵柄提前拆走，只在这条分支里成立。
    handwashing_rule:
      name: 维也纳洗手规定
      text: 1847 年 5 月，森梅尔维斯在第一产科病房推行含氯洗手。他的著作按病房和时段比较收治与死亡人数。游戏报告中的逐日人数来自模型。
    branch:
      name: 分支与主时间线
      text: 游戏设定。历史不可改变，员工的一切行动都落在一条平行分支上，主时间线保持原样，分支与主时间线的差值换算成时空能量。
    sanitary_commission:
      name: 斯库塔里的卫生委员会
      text: 1855 年 3 月初，英国派出的卫生委员会到达斯库塔里，冲洗了下水道，让病房通了风。此后几个月医院里的死亡数大幅下降。游戏里员工能帮着让这项工作提前，只在这条分支里成立。
    mosquito_idea:
      name: 蚊子的说法
      text: 1881 年 8 月，卡洛斯·芬莱向哈瓦那科学院宣布黄热病由一种蚊子传播。这个说法多年不被接受，1900 年以后才得到证明。游戏里员工能帮着让城市提前行动，只在这条分支里成立。
    first_inoculation:
      name: 第一次牛痘接种
      text: 1796 年 5 月 14 日，爱德华·詹纳把牛痘疮里的物质接种给一个男孩，后来又试了男孩是否受到天花的保护。按今天的标准，这样的试验不会被允许。游戏里员工能帮着让它提前，只在这条分支里成立。
    camp_stores:
      name: 营地物资
      text: 玛丽·西科尔自己采购、自己运送物资，并在营地后方开了一家客栈。军队物资向她开放的日期没有记录，所以游戏自己定了一天，员工能在这条分支里让它提前。
    supply_plan:
      name: 从艾斯米特返回的路
      text: 魏格纳 1930 年 11 月 1 日和拉斯穆斯·维卢姆森从艾斯米特出发，被认为在 11 月 16 日前后去世。搜寻队 1931 年 5 月 12 日找到他的墓。游戏里员工能帮队伍度过这几周，只在这条分支里成立。
    depot_plan:
      name: 最后一篇日记
      text: 斯科特的最后一篇日记写于 1912 年 3 月 29 日，离一吨仓库十一英里。搜救队 11 月 12 日找到帐篷。游戏里员工能帮队伍度过这几周，只在这条分支里成立。
    oxygen_plan:
      name: 高营地的计划
      text: 高营地怎样补给、氧气装置用到什么程度，在山上一直有争论。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
    snow_line:
      name: 攀登的计划
      text: 爬多快、歇多久，是队伍在山坡上自己的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
    watering_plan:
      name: 水和食物的计划
      text: 上岸的队伍怎样补水、补食物，是船上军官的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
    fresh_food_plan:
      name: 新鲜食物的计划
      text: 船在岛上为长途航行补什么，是船上军官的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
    university_order:
      name: 合并学校的命令
      text: 1924 年 2 月 4 日孙中山下令把三所学校并成一所大学。游戏里员工能把三所学校的名册抄成一本，把散在各处的校址画成一张图，只在这条分支里成立。有记载的日期不会变。
model_events:
  door_block: 员工上门救治时，可能被邻居或前辈拦在门外。是让步、坚持还是求助，由员工自己的特质决定。
  time_strain: 分支离史实太远时，员工会感到时间错位，人更累，也更容易出事。
  asked_the_way: 一个拿着信的新生向员工问某间办公室怎么走。这名学生是为游戏编的，没有名字。员工那时已经走熟了校址，就在图上指给他看，否则两个人一起找。一趟只发生一次，不计入与主时间线的对比。
  expedition_handoff: 虚构文书交接。员工的应对习惯决定是先交手里的记录，还是多留一点时间核对。
facts:
  abel_froland:
    quintic: 阿贝尔证明一般五次方程不能用根式求解。卡里的具体算例是演示。
    berlin: 阿贝尔于 4 月 6 日去世。4 月 8 日，克雷勒从柏林写信报告职位已落实。
  ahmed_baba_timbuktu:
    manuscripts: 档案研究记艾哈迈德·巴巴自 1594 年被迫滞留摩洛哥，并指出他在那里编的两部人物辞书以伊本·法尔洪的书为补编对象。
  ahmes_thebes:
    field: 题中圆田直径为九，取八的平方为田积。
    roll: 卷首题记记阿赫摩斯据更早的文字抄写此本。
  al_biruni_ghazna:
    coordinates: 此书为比鲁尼相关自述的英译本。1025 年是著作纪年，并非观测的准确日期。
    horizon: 所引原文记南达纳附近的山、量得的山高及山顶所见的地平线俯角。
  al_haytham_cairo:
    aperture: 书中讨论物体移动时所见部分如何与小孔位置相合。游戏的年份不是此段成文的日期。
  al_jazari_diyarbakir:
    mechanical_book: 加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。本卡的工坊示范为虚构。
  al_khwarizmi_baghdad:
    al_jabr: 花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。本卡的算术练习为虚构。
  al_razi_rayy:
    doubt: 节录中，拉齐说明遇到情形尚不明确时，他暂不作出判断。游戏用约略年份，雷伊的具体场景为虚构。
  angkor_wat:
    site: APSARA 记载吴哥窟及回廊。卡里年份用于定位十二世纪的故事窗口。
    causeway: 保护记录载有堤道的砂岩铺面，记的是现代工程，卡里的交接为虚构。
  antikythera_rhodes:
    dials: 安提基特拉沉船出水的齿轮装置残片保留了对应天文周期的刻度和铭文。工匠与工坊尚不能确定；罗得岛是本卡的虚构场景地点。
  archimedes_syracuse:
    floating: 浮体静止时排开液体的重量与整个浮体相等。所列年份是游戏采用的约略时间。
    bath: 罗马作者把浴池轶事与希耶罗命人制作的王冠联系起来，成文远晚于阿基米德生活的年代。
  aristarchus_alexandria:
    sun_moon: 原书取半月时在观测者处的夹角为 87 度，据此推得距离比大于十八且小于二十。
  aristotle_lyceum:
    motion: 这部公元前四世纪的著作比较游泳和步行，以螃蟹说明在水中生活的动物也能以步行移动。
  artemisia_florence:
    self_portrait: 1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。画室交谈为虚构。
  aryabhata_patna:
    circle: 第 10 颂针对直径 20,000 给出近似圆周算法，62,000 加 104 的八倍。
  bach_leipzig:
    cantata: 1723 年 5 月 30 日，巴赫在莱比锡以康塔塔《困苦人必得吃饱》BWV 75 开启任职后的演出。本篇的排练和歌者是虚构的。
  ban_zhao_luoyang:
    tables: 传记载班昭奉诏赴东观藏书阁续《汉书》，并载又诏马续继成。卡上年份是场景背景。
  banneker_maryland:
    letter: 班纳克提到随信送出的历书手稿，要求杰斐逊正视黑人被剥夺自由的现实。
    reply: 杰斐逊在8月30日的回信里确认收到信与历书。确认收到，与班纳克要求的改变，是两回事。
  basho_hiraizumi:
    hiraizumi: 芭蕉以 1689 年行旅为素材，后来写成《奥之细道》。平泉一节从眼前景物想到旧事，收有咏夏草的俳句。本篇歇脚是虚构的。
  beethoven_vienna:
    premiere: 音乐会海报记录了贝多芬《第九交响曲》于 1824 年 5 月 7 日在维也纳克恩特纳门剧院首演。场景里的引座员和观众为游戏虚构。
  bell_boston:
    notebook: 贝尔在笔记里记下，沃森在 3 月 10 日的试验中听到并听懂了说出的一句话。
  bessie_coleman_jacksonville:
    licence: 馆方所示照片为科尔曼在法国领取的执照，日期为1921年6月15日。
    paxon: 馆方将致命的试飞记于1926年4月30日的帕克森机场。样张及其制作者为虚构。
  bi_sheng_printer:
    clay_type: 《梦溪笔谈》记庆历年间（1041 至 1048）毕昇做泥活字，并按韵收存不用的字。卡中的工坊是虚构的。
  bizet_paris:
    premiere: 《卡门》于 1875 年 3 月 3 日在喜歌剧院首演，加利-马里耶首演卡门。
  boltzmann_duino:
    counting: 论文对得到同种分布的分配方式进行计数。二盒练习为员工用来说明区别的现代类比。
  boole_ballintemple:
    laws_of_thought: 布尔 1854 年出版的《思维规律研究》用代数表示逻辑运算。其中一条规律是，重复同一选择，所得的类不变。本卡的 1864 年阅读练习为虚构。
  borobudur_java:
    tiers: 遗产档案记录方形台层与三层圆台，建造时间跨八至九世纪。
  bose_calcutta:
    polarisation: 博斯报告电辐射通过材料的程度与材料取向有关。其中一个例子使用装订好的书，改变书边的取向九十度后重新测试。
  brahmagupta_bhillamala:
    rules: 第十八章列出负债、财产和零的运算。卡中账页为演示减法规则所编。
  buchner_zurich:
    fragments: 馆藏保存《沃伊采克》不同写作阶段的残稿。游戏试排的顺序仅用于练习。
  buddha_sarnath:
    discourse: 经传把说法地点置于鹿野苑，讲到中道与四圣谛。经中未给出游戏用的公历纪年。
  budj_bim_eels:
    channels: 景观资料说明贡迪特马拉人至少 6600 年来利用火山岩修渠、筑堰与设坝。地图年份未用来给某段墙定年。
  cai_lun_luoyang:
    paper_report: 《后汉书》记蔡伦于元兴元年（105）奏上造纸法，列出树肤、麻头、敝布和鱼网。纸坊试纸的场面为游戏虚构。
  cajal_barcelona:
    histology: 卡哈尔于 1889 年刊行有插图的组织学手册。西班牙国家研究委员会藏有他后来绘制的视网膜结构及传导方向图。本卡在 1889 年的巴塞罗那安排一段虚构的描图练习。
  camille_claudel_paris:
    variants: 馆方区分《华尔兹》的多个版本，说明衣褶怎样改动，列有 1905 年青铜铸件。大理石委托没有落实。
  cantor_halle:
    countability: 康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。本卡的 1884 年阅读场景为虚构。
  cao_xueqin_beijing:
    stone_opening: 脂评本《石头记》开篇提到曹雪芹，并在小说的叙事框架里写到反复增删。卡片沿用 1763 年作为背景，抄书场景为虚构。书里的自述也以原文中的框架来读。
  caroline_herschel_slough:
    comet: 卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。本卡场景为虚构。
  chaco_sun_watchers:
    light: 公园资料记录法哈达孤丘的照光现象。卡里的便携木板仅作演示，未复造遗址的布置。
    measurement: 研究记有法哈达孤丘螺旋刻纹上的正午光影。原始用途以及刻纹与石板的先后，是另外的问题。
  chekhov_badenweiler:
    letter: 契诃夫在信中写下弗雷德里克别墅的地址，提到住处的花园与写字桌。
  confucius_qufu:
    corner: 《述而》7.8以举起一角而让学习者推回其他三角作比，没有记下一场课的具体年月。
  copernicus_frombork:
    revolutions: 《天体运行论》于 1543 年在纽伦堡印行，书中论述地球自转并绕太阳运行。弗龙堡的阅读场景为游戏虚构。
  curie_paris:
    announcements: 钋和镭的发现公布于 1898 年。玛丽·居里 1911 年的诺贝尔演讲回顾了这两项发现，以及随后为确定镭的性质所做的工作。卡中编辑场景为虚构。
  dante_ravenna:
    paradiso: 但丁《天堂篇》末尾写到太阳和其他星辰。卡片在但丁晚年的拉文纳虚构一场读诗。薄伽丘后来讲过梦中得知遗稿下落的故事，属于流传下来的文学轶闻。
  darwin_galapagos:
    surveying: 小猎犬号测量查塔姆岛（今圣克里斯托瓦尔岛）外侧海岸。
    lands: 达尔文记下自己与菲茨罗伊当天下午登上查塔姆岛。
  democritus_abdera:
    full_void: 这部公元前四世纪的著作把实与虚空归于留基伯和德谟克利特，用字母排法解释形状、次序和方位的差异。
  descartes_leiden:
    discourse: 笛卡尔的《谈谈方法》1637 年在莱顿刊行，随附光学、气象和几何三篇论文。本卡读书场景为虚构。
  dickinson_amherst:
    manuscripts: 艾米莉·狄金森许多诗以手稿传世。本卡在 1886 年安排一名虚构的早期读者，用手稿核对一页松散的抄件。
  djenne_builders:
    earth: 资料记载杰内的土构建筑和现存大清真寺于 1907 年重建。卡里年份为分支到访设定。
  du_chatelet_luneville:
    principes: 迪沙特莱翻译并加注的牛顿《原理》完整法译本，于她去世后的 1759 年刊行。卡中 1749 年的读稿场景为虚构。
  du_fu_xiang_river:
    boat_poem: 传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。卡片的停船相遇为虚构。
  dunhuang_library_cave:
    objects: 馆方说明第 17 窟出土物种类多样。地图用的是约略背景年代，非确载封窟之年。
    colophon: 卷末纪年属于第 17 窟发现的这件印本。
  edison_menlo_park:
    entry: 笔记记棉线制直形炭丝的早期试验，并记一盏试验灯的光与电阻读数。
  emily_bronte_haworth:
    wuthering_voices: 《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。本卡在 1848 年安排虚构的阅读场景。
  empedocles_akragas:
    roots: 残篇写出四种成分及交替的聚合、分离。年份取哲学家生平中的约略时间。
    etna: 这部晚出传记记录了数种互不相容的说法，埃特纳火山和铜鞋只是其中一种。
  enheduanna_ur:
    disc: 馆藏将圆盘定在约公元前 2300 年，记载了仪式浮雕和刻有恩赫杜安娜名字的另一面。
    hymn: 诗中以第一人称称自己为恩赫杜安娜。卡上年份表示场景时期，不能据此给现存抄本定年。
  eratosthenes_alexandria:
    cleomedes: 克莱奥梅德斯转述全圆五十分之一与 5000 斯塔迪亚的比例，推得全周 250000 斯塔迪亚。这是后出的记述，卡上年份只作背景设置。
  euclid_alexandria:
    first_proposition: 欧几里得《几何原本》第一卷第一命题在一条给定线段上作等边三角形。约公元前 300 年的亚历山大是本篇虚构课业的背景。
  fanny_mendelssohn_berlin:
    score: 1846 年初版以 F. Hensel 的名字刊行六首有钢琴伴奏的歌曲。
  faraday_london:
    ring: 1831 年 8 月 29 日，法拉第记录了铁环上线圈实验中指针的短暂偏转。
  fibonacci_pisa:
    numerals: 比萨的莱昂纳多于 1202 年写《计算之书》。现传的 1228 年修订本开篇说明九个印度数字和零。本篇市场算账为虚构。
  finlay_havana:
    havana_address: 卡洛斯·芬莱在哈瓦那皇家科学院提出蚊媒假说。
    qualified_title: 同一场宣读中，芬莱在标题里将这个判断写成假说。后来的院刊保留了这一标题。
  franklin_philadelphia:
    kite_letter: 富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。印工之间的谈话为虚构。
  freud_vienna:
    imprint: 馆藏初版依莱比锡与维也纳印记著录为1900年。
    appearance: 档案年表把该书出版记在1899至1900年。游戏虚构的店簿分别记1899年到货和1900年印记。
  galen_rome:
    fire: 盖伦叙述火灾中损失的著作、器物和藏书，以及为何有些书无法用附近藏本补回。
  galileo_padua:
    jupiter: 伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。
  galois_paris:
    letter_to_chevalier: 伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。卡中分拣纸页为虚构。
  gaudi_barcelona:
    tower: 圣家堂诞生立面的圣巴拿巴钟塔于 1925 年完工。1926 年高迪去世时，整座教堂仍未完成。本卡围着图纸说话的一幕为虚构。
  ghalib_delhi:
    divan: 此处提供 1841 年刊本影印，按加扎勒的结尾以及其他诗体编排索引。
  giotto_padua:
    chapel_cycle: 斯克罗威尼礼拜堂将帕多瓦现存的乔托壁画定年为 1303 至 1305 年。画面沿墙分层展开。本卡里领人看画的场面为虚构。
  great_zimbabwe:
    passage: 遗产档案记有椭圆形大围场、整齐垒砌的花岗岩墙体和通往锥形塔的狭道。
  gutenberg_mainz:
    bible: 现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。本趟前往虚构的早期工坊，看的是一张试排页。
  hammurabi_babylon:
    stele: 卢浮宫藏古巴比伦石碑刻有财产、交易、劳作等方面的条文。碑的最初陈列地点并不确定，本卡的对读场景为虚构。
  hargrave_stanwell_park:
    beach: 馆方记载，1894年11月12日的斯坦韦尔公园海滩升空试验连用了四只风筝。
    photo: 图书馆把海滩照片与升空试验联系起来，并认出其中的哈格雷夫、詹姆斯·斯韦恩及试验器材。
  heo_nanseolheon_hanyang:
    edition: 选本研究比较了许筠 1597 年所编选本与现存的 1608 年朝鲜刻本。
    collection: 条目载有许筠在姐姐去世后整理文稿一事，并列出较晚刊本里的诗文。
  heron_alexandria:
    doors: 著作描述点火后开门、熄火后关门的设计。所列年份是游戏设定。
  hertz_bonn:
    resonator: 年表记有火花观察，以及用较小的圆形谐振器与显微镜做的试验。游戏回到波恩的差事为虚构。
  higuchi_ichiyo_tokyo:
    takekurabe: 初刊说明列出《文学界》从 1895 年 1 月至 1896 年 1 月所刊七期，以及 1896 年 4 月《文艺俱乐部》的全文刊本。
  hildegard_bingen:
    interdict: 信中反对妨碍修院歌唱的禁令，并申明歌唱在礼仪中的地位。
    letter: 文书纪要收录她就安葬争议和禁令写给大主教克里斯蒂安的书信。
  hipparchus_rhodes:
    palimpsest: 研究转录了被擦去的北冕座界限，并提出归于喜帕恰斯的解释。
    debate: 后续天文数据分析质疑该归属；两项研究均不是卡里虚构练习的纪年依据。
  hippocrates_kos:
    record: 传世文本保存了塔索斯岛的观察和按天叙述的个案。科斯岛上的这一趟差事与历年是游戏设定。
  hokusai_edo:
    great_wave: 葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。版画铺的会面是虚构的。
  hooke_london:
    micrographia: 胡克 1665 年的《显微图谱》画出了他在软木中观察到的小格。本卡在他晚年安排一场虚构的图版阅读。
  house_of_wisdom:
    epistle: 译文举出译者寻找、比勘与订正底本的例子。编者将书信初次成文定在约855至856年，晚于卡片故事的设置。
  hua_tuo_xuchang:
    account: 传记叙述华佗被关进许狱，以及向狱吏交付一卷书的故事。文本成于事后，没有给这一游戏场景提供确切日期。
  humboldt_chimborazo:
    approach: 攀登前一天，一行人向钦博拉索山进发。
    crevasse: 洪堡、邦普朗与卡洛斯·蒙图法尔攀登钦博拉索，在山顶以下折返。
  hypatia_alexandria:
    hydroscope: 晚期古代书信向希帕提娅求制仪器，描述器具直立漂浮和竖排刻线。年份用于标示游戏的约略时代。
  ibn_al_nafis_cairo:
    transit: 研究讨论解剖注释所说的经肺通路，也谈及后来阅读中世纪医学注释的人；游戏年份为约数。
  ibn_battuta_tangier:
    departure: 第一人称叙事回忆 1325 年离开丹吉尔时有意朝圣。它是后出的出发回忆，未当作路上当天所记的日记。
  ibn_khaldun_cairo:
    method: 绪论讨论依据相关社会中的可能性检验历史叙述。场景采用其生命末年的年份，并非这部书初次成文的时间。
  ibn_rushd_lucena:
    exile: 后出传记记曼苏尔下令放逐至卢塞纳。游戏取流放开始前后的年份，读书练习由游戏虚构。
    reasoning: 书中论及论证、其他推理方式和三段论所需前提。所列约年指这部较早的著作。
  ibn_sina_hamadan:
    canon: 馆方记述《医典》历经多处撰写，在哈马丹完成，全书分五卷，第二卷记单味药，第五卷记复方。
    date: 解说将作品定在约1025年，并展示后出第一卷抄本的题页。
  ife_bronzes:
    cast: 馆方确认该黄铜头像出自翁莫尼杰院落，记录有失蜡铸造和刻划。卡里年份未用于这件藏品的精确定年。
  imhotep_saqqara:
    base: 博物馆陈列刻有伊姆霍特普姓名与头衔的底座。年份是游戏采用的约数。
    pyramid: 馆方将阶梯金字塔的设计归于伊姆霍特普。该馆坐像属于更晚时期。
  ino_tadataka_ezo:
    survey: 馆方年表载，1800 年首次测量本州东北及北海道南部，1821 年完成日本全图。
    notes: 资料介绍测量队采集距离与方位。卡里的线路误记为虚构。
  jenner_berkeley:
    case_xvii: 詹纳把这项牛痘案例的起始日期记在这一天。案例中的男孩后来被确认为詹姆斯·菲普斯。
    case_followup: 约一周后，詹纳记下了男孩在后续观察中第一次说身体不适。
  jia_sixie_gaoyang:
    tillage: 篇中区分高下田，强调要使燥湿得宜。所标年份用于布置场景。
  jianzhen_nara:
    arrival: 展览记述鉴真赴日经历，以及他在奈良传授佛教戒律。
    foundation: 寺方记载，鉴真抵达奈良之后，759年获赐地创建唐招提寺。
  kabir_maghar:
    hymn: 诗中问，心有神明时，贝拿勒斯与马格哈尔有何分别。诗句没有给会面或诗人去世定下年月。
  kafka_kierling:
    four_stories: 卡夫卡 1924 年的《饥饿艺术家》收四篇小说，包括《女歌手约瑟芬，或鼠族》。本卡在基尔灵虚构一位送稿人核对校样。
  kant_konigsberg:
    preface: 康德从理性既无法回避又无法回答的问题引出全书，并谈及经验的界限。
    second: 修改后的序言属于1787年版，末尾署柯尼斯堡、1787年4月。
  keats_rome:
    rome_letter: 济慈在 1820 年 11 月 30 日从罗马写给查尔斯·布朗，信里说写信和告别都变得困难。卡中 1821 年的送信差事为虚构。
  kepler_leonberg:
    arrest: 辩护文书将被捕日记为1620年8月7日，分别列出后来在居格林根的诉讼步骤，并陈述辩方对拖延的异议。
    released: 鲁布拉克据档案研究将卡塔琳娜获释定在1621年秋。
  knossos_linear_a:
    tablet: 数字化记录认定这件克诺索斯出土的泥质实物为线形文字 A 泥板。卡里年份用于布置场景。
  kovalevskaya_stockholm:
    rotation: 论文研究刚体绕定点转动的一个可积分情形，并写明适用前提。
  lalibela_rock:
    drainage: 遗址包括从岩石中凿出的教堂，以及排水沟、深槽和通道。
  laozi_hangu:
    pass: 西汉传记写关令尹喜、上下两篇及老子离去，也记有异说，没有给这次出关定年。
    ox_story: 宋代类书汇集后世老子西行、过关故事，细节与《史记》的叙述有异。
  lavoisier_paris:
    balance: 拉瓦锡 1789 年出版的《化学基础论》用质量测量解释化学变化，把氧视为参与燃烧的物质。
  leavitt_cambridge_ma:
    variable_stars: 1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。本卡的底片室场景为虚构。
  leeuwenhoek_delft:
    letter: 列文虎克 1676 年 4 月从代尔夫特寄出的信记录了他的观察，并附白蜡木切面和酒中鳗状小动物的图。本篇读信的会面为虚构。
  leonardo_florence:
    lisa_portrait: 卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。本卡的作坊场景是虚构的。
  li_bai_changan:
    qingping_tradition: 《清平调》三首传为李白所作。附录讲了宫中演唱的故事，属于后来的记述。本卡在 750 年的长安安排一段虚构相遇，诗作和轶闻并非定年于这一年。
  li_qingzhao_hangzhou:
    postface: 李清照在《金石录后序》中回忆她与赵明诚搜求书籍金石，以及后来收藏散失的经过。1150 年杭州读抄本的场景为虚构。
  li_shizhen_qizhou:
    draft: 研究把编成时间定在1578年，并区分后来的版本及其插图。
    edition: 数字化早期刻本包括卷首体例、目录和插图，并见1603年重刻序。
  lili_boulanger_paris:
    score: 目录列出人声、弦乐四重奏、竖琴、管风琴，并记录作曲注记「罗马—梅济，1918」。
  lovelace_london:
    note_g: 洛芙莱斯 1843 年发表的译注中，注 G 用表格列出了拟议中的分析机计算伯努利数的操作。
  machu_picchu:
    water: 现场研究记录马丘比丘的供水与排水设施。地图年代为场景设定。
    series: 调查记录来自泉水的水渠和串联的十六处出水点。
  mallory_everest:
    camp_iv: 乔治·马洛里和安德鲁·欧文在四号营地。
    odell_sighting: 诺埃尔·奥德尔报告看见两名登山者，认作马洛里与欧文。两人此后到达何处仍有疑问。
  marconi_bologna:
    lecture: 马可尼回忆1895年初在博洛尼亚附近家中试验，不在两端间架设连线而传送电报符号。
  mary_anning_lyme_regis:
    plesiosaur: 1823 年 12 月，玛丽·安宁在莱姆里吉斯发现一具完整的蛇颈龙骨架，她的草图记下了那条长颈。卡片保留 1847 年，用虚构的访客回看早年的图。
  maya_codices_mani:
    mani: 研究把马尼的宗教审判仪式定于1562年7月12日，并讨论相关的毁书毁物。
    account: 传世文本里有兰达关于焚书的叙述，记录的是施害方为自己辩护的话。
    codex: 研究所将抄本制作年代定于公元1021至1152年。它是存世玛雅抄本，游戏里的那本书没有据此被指认为这件。
  maya_venus_tables:
    venus: 手稿的金星表以 584 日为一轮。卡里年份用作较早的故事背景，并非存世抄本的定年。
  mendel_brno:
    peas: 孟德尔在 1865 年报告豌豆杂交结果，1866 年刊出的论文列了计数并比较所得比例。
  mendeleev_petersburg:
    periodic_system: 门捷列夫在 1869 年发表早期元素周期系统，把原子量和化学性质的相似性用来排列元素。现存的 1871 年版记录了随后调整的排法。
  meroitic_meroe:
    script: 资料记草写体自右向左，以及用两三个竖排小点分隔的写法。卡里只借此做练习，未编造一篇历史铭文。
  mitchell_nantucket:
    comet: 书信给出发现日期和地点，写到给 W. C. 邦德寄信。卡里另编的帮工与练习不见于此记录。
  miyazawa_kenji_hanamaki:
    galactic_manuscript: 宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。花卷的这段讨论为虚构。
  modigliani_paris:
    portrait: 馆方将这件莫迪利亚尼 1919 年肖像登记为布面油画。
  mohenjo_daro_indus:
    seal: 实物资料显示摩亨佐－达罗出土带符号的印章。卡里年份是大致场景设定。
    impression: 资料以实物记录印章、印封及其使用痕迹。卡里的练习印为虚构。
  morse_washington:
    telegraph_tape: 1844 年 5 月 24 日，莫尔斯从美国国会大厦向巴尔的摩的阿尔弗雷德·韦尔发送电报。留存的纸带记录了信号；莫尔斯注明文句由安妮·埃尔斯沃思建议。报告里的练习电文为虚构。
  mozart:
    prague_preparations: 信中记下首演推迟，并在25日把29日列为预计首演日。对不上谱的那一句是虚构。
    prague_premiere: 莫扎特在11月4日写成的部分把首演记在10月29日，并描述了热烈的反响。
    vienna_material: 馆藏分作两卷登记，即含苏斯迈尔补写的交付谱和工作稿。
    vienna_hands: 馆方说明稿件上留有多位参与者的笔迹。场景中的纸页和抄谱行为是虚构。
  murasaki_kyoto:
    diary: 紫式部日记记载，1008 年有人借《源氏物语》中的人物开玩笑，可见故事当时已在宫中为人所知。游戏里的闲谈为虚构。
  nalanda_library:
    campus: 遗产档案记录了长期用于住学的寺院遗迹。地图年份用于布置虚构场景。
    later_study: 传记记载十三世纪三十年代在那烂陀求学；卡里的叶束为虚构。
  newton_cambridge:
    principia: 1687 年伦敦初版《原理》第三卷论述引力。
    apple_recollection: 斯图克利的回忆录记下牛顿说自己见苹果落下，便想它为何总朝地面落。书里没写苹果砸到头。
    amanuensis: 汉弗莱·牛顿与牛顿不是亲戚，约 1683 年到 1689 年做他的抄写助手，奉命在付印前把《原理》誊抄一遍。
    seven_years: 剑桥的学者说，这本书他们也许要读七年才懂。
  nezahualcoyotl_texcoco:
    setting: 研究介绍特斯科科地区早期殖民时期抄本，列1472年为内萨瓦尔科约特尔的卒年。
    cantares: 研究将歌中用第一人称说出的姓名与独立归属题记分开讨论。所列约年指后出的手稿传统。
  nietzsche_turin:
    letter: 馆藏目录把信定在都灵、约1889年1月4日，分列署名与收件人。
    journey: 研究列1月8日为奥弗贝克抵达日，对马的轶闻采用有保留的讲法。
  nightingale_scutari:
    commission_leaves: 据委员会报告，委员及随行人员离开伦敦。
    commission_examines: 委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。
  noether_gottingen:
    symmetry: 诺特在 1918 年的论文中说明，在给定条件下，变分问题的连续对称性与相应守恒关系之间的联系。本卡的讨论小练习为虚构。
  omar_khayyam_nishapur:
    reform: 研究考订此历在1079年实施，解释它与春分的关系，以及同旧纪法并存的情形。
    site: 研究复核马立克沙的观测工程及海亚姆参与的记载，包括关乎伊斯法罕的史料。
  ovid_tomis:
    tristia: 第二卷提到一首诗和一个过失，并避谈第二项指控。卡上的年份用于设定穿越时期，未用来给诗句定年。
  pasteur_paris:
    arrival: 机构史记迈斯特于1885年7月6日见巴斯德，并记录该次接种的结果。
  plato_academy:
    academy: 传记说柏拉图回雅典后住在城墙外名为学园的体育场一带。这一节没有记开学日。
    double_square: 篇中以原方形的对角线作新方形的边，得到两倍面积。
  pliny_stabiae:
    letter: 信中记述庞波尼安努斯在斯塔比亚等风转向，老普林尼却正借这阵风抵达。
  poe_baltimore:
    walker: 纸条写明自称坡的人在瑞安的第四选区投票点，并请斯诺德格拉斯赶来。
    death: 坡于 10 月 7 日去世，死因未有定论。
  puccini_brussels:
    catalogue: 该目录分别记载歌剧的草图、草稿与总谱资料。
    completion: 作品目录记载阿尔法诺补写二重唱与最后一场，首演日期为 1926 年 4 月 25 日。
  pushkin_st_petersburg:
    address: 普希金以桥和房主指明住处，博物馆记载现用门牌于 1880 年固定。
    apartment: 普希金于 1837 年 2 月 10 日在该寓所去世，按当时俄历为 1 月 29 日。
  pythagoras_croton:
    ratios: 这部公元前四世纪著作把音程之比同毕达哥拉斯派联系起来，叙述的主体是这一群体。
  qin_jiushao_huzhou:
    remainders: 卷一列出合并多项余数条件的大衍诸术。卡里的小数字为演示所用。
  qin_liangyu_shizhu:
    summons_1630: 崇祯三年，秦良玉奉诏勤王。
    family_funds: 官修《明史》记秦良玉出家财济饷。
  qu_yuan_miluo:
    fisherman_tradition: 《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。本卡采用传统年份作背景，江边场景为虚构。传本对话是文献中的记述。
  quipu_cusco:
    comparison: 原始研究比较成组的结绳实物，并介绍数值结绳用位置表示十进位。卡上年份是场景设定，未用于一件具体藏品定年。
  ramanujan_madras:
    letter: 这封有日期的信介绍拉马努金的数学工作，提到他研究发散级数。
  rapa_nui_moai:
    quarry: Ma’u Henua 记载，多数摩艾取自拉诺拉拉库的火山凝灰岩。卡里年份未用于给某一座摩艾定年。
  rembrandt_amsterdam:
    late_portrait: 伦勃朗有一幅署年 1669 的《六十三岁自画像》，可见他在去世那年仍在画自己的脸。工坊中的习作场景为虚构。
  riemann_selasca:
    geometry_lecture: 黎曼 1854 年的讲稿讨论几何的基本假设及距离如何定义。本卡保留 1866 年马焦雷湖畔的地点，虚构一位读者琢磨讲稿里的一个问题。
  rongorongo_rapa_nui:
    corpus: 馆方说明存世材料有限，也区分学界释读与拉帕努伊口述知识。卡上年份用于设定场景，未给藏品定年。
  rumi_konya:
    reed: 开篇让芦管发声，把它的哀诉与离别相连。年份用于虚构读书场景，并非开篇写定的年份。
    copy: 馆藏文书记载抄本抄于1278年，全六卷。
  sappho_lesbos:
    papyrus: 馆藏目录将现存片段列为萨福书写兄长卡拉克索斯的第5号残篇，目录将这份传抄本定为公元三世纪。
  savitribai_phule_pune:
    early: 讲座引录1851年报纸，把普勒夫妇开始办学的时间追溯到1848年，并记述萨维特里白的参与和受训经过。
    records: 讲座讨论1852年2月5日申请资助的文书及相关女子学校记录，后者指出萨维特里白是该批学校中第一所的校长。
  schubert_vienna:
    programme: 请柬写明 1828 年 3 月 26 日在音乐之友协会会场演出，曲目均为舒伯特所作。
  schumann_endenich:
    papillon: 馆方把抄本归于舒曼在恩德尼希居住期间，提及降B大调移调和后来赠给玛丽。游戏采用这段时期的1856年；馆方没有把抄本确切定在这一年。
  scott_last_camp:
    gale: 斯科特后来在日记里把最后营地持续大风的开始记为3月21日。
    last_entry: 斯科特最后一次日记写于3月29日，提及照料身后家属。
  seacole_balaklava:
    cathcart_evening: 西科尔回忆，入夜后她离开英国旅馆前往卡思卡特山，于午夜过后回来。
    wounded_road: 西科尔记述自己从春山出发，在沃龙佐夫路旁的临时医院附近帮助伤员。
  sei_shonagon_kyoto:
    opening: 开篇写春日破晓，山际渐明，有细细的紫云。卡上的年份不是某一手稿的定年。
  sejong_hangul:
    haerye: 1446 年刊行的《训民正音》解例本说明了世宗在 1443 年完成的文字。本卡以 1443 年为背景，识字练习是虚构的。
  semmelweis:
    clinics: 森梅尔维斯比较维也纳总医院两间产科病房的收治与死亡人数。他记载第一病房用于医生和学生的训练，第二病房训练助产士。
    kolletschka: 森梅尔维斯后来把1847年的推论与雅各布·科莱奇卡因解剖时受伤而死相联系。游戏从五月开始，这件事发生在到访之前。
    washing: 森梅尔维斯于1847年5月在第一病房推行含氯洗手。游戏为比较分支选了一个基准日；该日及逐日人数属于模型设定与结果。
  sequoyah_syllabary:
    syllabary: 塞阔雅为切罗基语创制的音节文字于 1821 年获得采用。这套符号表记音节。现存印刷品见证其早期使用，本趟识读练习是虚构的。
  shakespeare_globe:
    wooden_o: 《亨利五世》的开场合唱请观众想象舞台呈现不了的地点和事件。此剧属于环球剧场早期演出时期，本篇的排练是虚构的。
  shen_kuo_runzhou:
    needle: 沈括在《梦溪笔谈》中记下，磨过的磁针指南，却常微微偏东。卡片用润州时期的年份安排一段虚构的读书场景。
  sima_qian_changan:
    letter_to_ren_an: 《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。卡片在约公元前 98 年的长安虚构抄写场景；游戏年份不是这封信的日期。
  smith_kirkcaldy:
    division: 亚当·斯密 1776 年出版的《国富论》开篇用制针来说明分工。卡片在柯卡尔迪安排一场虚构的桌边演示。
  snow:
    inspection: 斯诺1855年的回顾说，他于9月3日晚看过泵水，单凭当晚的水样还不能下结论。
    interview: 斯诺记载自己9月7日向圣詹姆斯教区救济委员会陈述调查结果。他查问家庭用水，也留意当地之外饮用宽街水的人。
    handle: 斯诺说泵柄次日被拆；他刊出的数据中，新发病例在拆柄前已下降。史料没有给出游戏所用的拆柄时刻，分支人数也来自模拟。
  socrates_athens:
    apology: 柏拉图笔下，苏格拉底先回应旧指责，随后才谈以墨勒托为首的控告。
  song_yingxing_fengxin:
    craft_book: 宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。本篇看校样的会面是虚构的。
  sophie_germain_paris:
    elastic_surfaces: 索菲·热尔曼于 1821 年出版弹性曲面的数学研究，讨论振动薄板上观察到的图样。本卡在 1831 年虚构一位读者对着图解释这项研究。
  sor_juana_mexico_city:
    respuesta: 胡安娜·伊内斯·德·拉·克鲁斯在 1691 年《答菲洛特亚修女》中回顾自己的求学愿望，也以厨房里的日常观察谈学习。本卡的 1695 年墨西哥城读信场景为虚构。
  su_shi_huangzhou:
    red_cliff: 苏轼《前赤壁赋》开篇记壬戌之秋泛舟赤壁，即 1082 年。赋里由眼前江景联想旧事。本趟江边相遇的人是虚构的。
  su_song_kaifeng:
    tower: 苏颂《新仪象法要》图文记载水运仪象台，上有观测仪器，另有随钟鼓报时的木人。卡片用 1088 年作工程进行中的虚构工坊背景。
  sun_yat_sen_guangzhou:
    f01: 孙中山下令把国立高等师范学校、广东法科大学、广东农业专门学校合并为国立广东大学，派邹鲁筹备。
    f02: 邹鲁就任筹备主任。
    f03: 邹鲁在高等师范礼堂召集三校学生，宣布筹建并报告进度。
    f04: 首次筹备会议召开，议题包括三校学生的毕业问题。
    f05: 6 月 3 日呈报的三校归并办法获批准。
    f06: 邹鲁出任校长。
    f07: 各校分散各处，管理不便，孙中山命邹鲁择石牌为新校址，当年划定土地。
    f08: 正式开学。
    f09: 举行成立典礼，用孙中山写的校训。他本人未到场，11 月 13 日离开广州。
    f10: 孙中山抵达北京。
    f11: 住进协和医院并接受手术，发现癌症。
    f12: 移居铁狮子胡同行馆。
    f13: 上午九时三十分在行馆逝世。
    f14: 通行说法是肝癌，协和医院的病历记载为胆囊癌。
    f15: 第 38 次校务会议决议改名为国立中山大学，呈报国民政府批准。
    f16: 国民政府下令改国立广东大学为国立中山大学。
    f17: 另有说法称 1926 年 7 月 17 日更名，或 1925 年已有提议并获批准。
    f18: 石牌的村民反对新校址。
    f19: 筹备委员的名单。
    g1: 1924 年 1 月 27 日到 8 月 24 日，孙中山利用星期天在国立广东高等师范学校礼堂演讲三民主义，共十六讲。民族主义第四讲的讲稿日期是 2 月 17 日，第五讲是 2 月 24 日，4 月 20 日在民权主义之内，8 月 24 日讲到民生主义第四讲后停止。
    g2: 黄昌谷每次随孙中山前往，速记演讲内容，随后校译、整理并发表。
    g3: 邹鲁自述校读的经过：笔记誊清后先呈孙中山，孙中山叫人送给邹鲁校读，邹鲁用签注条贴在稿上，孙中山亲笔修正，往复多次，直到孙中山认为妥适。
    g4: 讲稿先在《中国国民党周刊》发表，三月底以《民族主义》为名出版单行本，孙中山 3 月 30 日为单行本作序。
    g5: 三十五名筹备委员中，三十一人从海外留学归来。
    g6: 广东高等师范建在原贡院旧址上，礼堂在今广州文明路。
  sushruta_varanasi:
    model: 传世文本列出模型习作，材料包括布片。卡片沿用古代约略场景，未将此年定为现存文本成书或真实课堂的时间。
  tagore_santiniketan:
    translation: 英文版题名页注明收入作者自己从孟加拉语译写的散文诗。
    award: 发布记录载有泰戈尔 1913 年获诺贝尔奖一事，并介绍霍顿图书馆保存的手稿。
  tang_xianzu_linchuan:
    peony_dream: 汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。卡片用 1598 年为背景，虚构戏班商量哪一句必须让观众听见。
  taqi_al_din_istanbul:
    observations: 研究比对1570年代后期的仪器与观测记录，其中一项史料把全面观测的开始放在伊斯兰历985年。
    closure: 研究将拆除定在1580年1月，游戏里的那一行抄记是虚构。
  tenochtitlan_lake:
    date: 该研究说明二屋年与 1325 年及定居相联系的通行说法，并讨论建城能否定为某一个年份。
    plots: 遗产档案说明湖中岛城，以及索奇米尔科的人工耕地和水道。卡里未把现存田块定到 1325 年。
  terence_rome:
    prologues: 序言写到走绳吸引观众，以及人群闻知有角斗演出后涌来。报告中排练为分支演绎。
  tesla_wardenclyffe:
    white: 档案指南列有三封1901年致斯坦福·怀特、涉及沃登克里弗塔和实验楼施工的信。
    site: 实验室与塔址尚存。遗址资料记载拟议中的无线供能和通信系统，也列出实验室在1902至1906年间的使用。
  thales_miletus:
    herodotus: 希罗多德说泰勒斯预告了白昼转暗的年份，没有说预告到了某日、某时或能在哪些地方看见。
  timbuktu_sankore:
    year: 调查据所记铭文把1327年与金加雷贝尔联系起来。这个年份不能证明桑科雷发生过游戏中的读书活动。
    astronomy: 展览呈现一份1733年抄于廷巴克图的天文手稿。晚出的抄本仅供对照。
  tupaia_tahiti:
    boards: 班克斯记下图帕亚登船，并重申愿意随船远行。
    departs: 奋进号驶离塔希提，图帕亚与泰阿塔随船。
  ulugh_beg_samarkand:
    observatory: 馆藏展览记录撒马尔罕编成的天文表和台中所用的大子午弧。
    catalogue: 研究分析星表位置及从旧资料取用的条目。卡里年份用于设定场景，未作为星表完成时间。
  van_gogh_auvers:
    auvers_letter: 梵高 1890 年 7 月在奥维尔写信，提到自己画了不安的天空下大片延展的麦田。卡中的访客和散步是围绕这些作品写的虚构情节。
  vermeer_delft:
    delft_records: 维米尔 1675 年在代尔夫特去世。阿姆斯特丹国立博物馆的展览记录了他家留下的债务，以及卡塔琳娜·博尔内斯向面包商抵押画作的事。核对账页的场景为虚构。
  vesalius_padua:
    print: 馆方记述帕多瓦的筹备、木刻版从威尼斯运到巴塞尔及1543年刊印，也指出相关通信未列画工姓名。
  wallace_ternate:
    ternate_essay: 华莱士一篇署地特尔纳特的文章，于 1858 年 7 月 1 日与达尔文材料一同在林奈学会宣读。刊出的合件仍可分辨两人的文字。装寄的场景为虚构。
  wang_zhenyi_jinling:
    diagram: 王贞仪记述灯、桌与镜子，并说提灯后光又照到了镜上。所标年份是场景年代，未用来给演示定年。
  wegener_greenland:
    eismitte_reached: 历经四十天，阿尔弗雷德·魏格纳、弗里茨·勒韦和拉斯穆斯·维卢姆森抵达艾斯米特站。
    left_eismitte: 照片记录了魏格纳与维卢姆森离开艾斯米特、返回西海岸的情景。
  wright_kitty_hawk:
    four_flights: 奥维尔·莱特日记记载，1903 年 12 月 17 日在基蒂霍克附近共试飞四次，随后兄弟俩把消息电告父亲。本篇抄写消息的场面为虚构。
  xu_xiake_lijiang:
    diary: 初六及初七日条写解脱林在山半，面东，以翠屏相对。徐霞客说他在后轩壁图上得知古冈的景致。卡里的带路人是虚构角色。
  xuanzang_changan:
    return: 《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。本卡的接收登记场景为虚构。
  zeami_sado:
    island: 世阿弥于 1434 年被流放佐渡。市政府资料指出《金岛书》写于居岛期间，并引述书中对金之岛佐渡的称呼。
    mask_tradition: 市政府文物档案把某面具与世阿弥的关联记作当地传说。游戏排练道具并非该文物。
  zhang_heng_luoyang:
    instrument: 传记在 132 年记造仪，写了外形，也叙述一次落丸后数日收到陇西驿报。这一例没有确切日期。
  zhu_shijie_yangzhou:
    preface: 前序列四元在中央四方的位置，署大德癸卯，即 1303 年。
  zhuge_liang:
    visits: 陈寿记刘备三往乃见，诸葛亮此前的《前出师表》也写到三顾。
    farming: 陈寿记诸葛亮躬耕陇亩，好为《梁父吟》。
    recommended: 徐庶对刘备说，此人可就见，不可屈致，将军宜枉驾顾之。
    screened: 刘备见到诸葛亮后，先屏退旁人，然后发问。
  zu_chongzhi_jiankang:
    bounds: 志书记两限，换算为 3.1415926 与 3.1415927，并另记密率 355/113。所标年份是场景年代，不是志书成书年代。
stats:
  constitution:
    gain: 扛得住长时间的重活和病房，恢复得快。
    cost: 体质弱，染上疾病时体力掉得更多。
  favor:
    name: 心情
    text: 员工的心情，0 到 100，初始 50。每次成功让它涨，失败和放弃让它掉，奖励一个月工资加 50。
    gain: 所有属性随心情变化，心情满时多 20%，所以顺的时候越来越顺。心情高也更不容易想家放弃。
    cost: 心情见底时所有属性少 20%，不顺时也越来越不顺。奖励要花一个月工资。
  wit:
    gain: 学得快、治得好，也更容易发现不对劲。
    cost: 脑子快的人，最先看见自己改变不了的事。
  finesse:
    gain: 靠嘴和手上的分寸进得去门，容易赢得盟友和信任。
    cost: 太会说的人不一定被信。
  will:
    gain: 在门口守得住，乡愁和敌意对他们影响小。
    cost: 意志强的人，该让的时候也不让。
  luck:
    gain: 运气好的人，交给运气的事常常成：要运气的同步点更容易踩中，也更容易带回古董。
    cost: 运气练不出来也买不到，要本事的地方它不起作用。
