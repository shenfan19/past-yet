sections:
  places:
    broad_street:
      name: 伦敦宽街，1854
      text: 伦敦苏荷区的一条街，街口有一台公用水泵。1854 年 8 月底到 9 月初，这一带暴发霍乱。游戏里的宽街是一个约五百人的街区模型。
    vienna_clinic:
      name: 维也纳总医院，1847
      text: 十九世纪中叶欧洲最大的医院之一，设有两间产科病房，一间由医生和学生接生，一间由助产士接生。两间病房的产妇死亡率差别很大。
  people:
    snow:
      name: 约翰·斯诺
      text: 英国医生。1849 年已提出霍乱经水传播，1854 年通过逐户调查把病例与宽街水泵联系起来。游戏里他是员工可以合作的对象。
    semmelweis:
      name: 伊格纳茨·森梅尔维斯
      text: 匈牙利出身的产科医生，1847 年发现解剖室与产房的死亡有关，并要求接生前用氯化石灰溶液洗手。游戏里他是员工可以合作的对象。
  events:
    pump_handle:
      name: 宽街泵柄被拆
      text: 史载 9 月 8 日泵柄被拆走。拆走时疫情已经在下降，很多居民早已离开，所以泵柄被拆能救多少人至今有争论。游戏里员工能让泵柄提前拆走，只在这条分支里成立。
    handwashing_rule:
      name: 维也纳洗手规定
      text: 史载 1847 年 5 月中旬，森梅尔维斯要求接生前用氯化石灰溶液洗手，随后产房的死亡率下降。具体日期与数字待核对。
    branch:
      name: 分支与主时间线
      text: 游戏设定。历史不可改变，员工的一切行动都落在一条平行分支上，主时间线保持原样，分支与主时间线的差值换算成时空能量。
  stories:
    royal_comb_story:
      name: 少女与王子
      text: 一个少女穿到过去，嫁给了王子。这类小故事没有史实可改，沿用同一套仿真，只是主角和目标换成一个小人物。还没有做成可玩的内容。
model_events:
  door_block: 员工上门救治时，可能被邻居或前辈拦在门外。是让步、坚持还是求助，由员工自己的特质决定。
  time_strain: 分支离史实太远时，员工会感到时间错位，人更累，也更容易出事。
stats:
  constitution:
    gain: 扛得住长时间的重活和病房，恢复得快。
    cost: 体质弱，染上疾病时体力掉得更多。
  favor:
    name: 心情
    text: 员工的心情，0 到 100，初始 50。每次成功让它涨，失败和放弃让它掉，奖励一个月工资加 50。
    gain: 所有属性随心情变化，心情满时多 20%，所以顺的时候越来越顺。心情高也更不容易想家放弃。
    cost: 心情见底时所有属性少 20%，不顺时也越来越不顺。奖励要花一个月工资。
  wit:
    gain: 学得快、治得好，也更容易发现不对劲。
    cost: 脑子快的人，最先看见自己改变不了的事。
  finesse:
    gain: 靠嘴和手上的分寸进得去门，容易赢得盟友和信任。
    cost: 太会说的人不一定被信。
  will:
    gain: 在门口守得住，乡愁和敌意对他们影响小。
    cost: 意志强的人，该让的时候也不让。
  luck:
    gain: 运气好的人，交给运气的事常常成：要运气的同步点更容易踩中，也更容易带回古董。
    cost: 运气练不出来也买不到，要本事的地方它不起作用。
