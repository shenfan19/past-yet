# Generated by tools/build_data.mjs from the cards folder. Do not edit this file, edit the cards and run the build.
refs:
  game: AI의 도움을 받아 제작했습니다.
fact_lines:
  abel_froland:
    quintic: '1824년: 아벨은 5차 일반 방정식이 근수로 풀 수 없음을 증명했습니다.'
    sledge: '1828년 크리스마스: 감기와 기침을 하던 아벨은 약혼자를 만나러 썰매를 타고 프롤랜드로 옵니다.'
    last_paper: '1829년 1월 6일: Froland의 침대에서 Abel은 파리 회고록의 주요 아이디어에 대한 2~3페이지의 마지막 논문을 씁니다.'
    death: '1829년 4월 6일: 닐스 헨리크 아벨이 Froland에서 26세의 나이로 사망합니다.'
    berlin: '1829년 4월 8일: 모르고 있던 Crelle은 베를린에서 Abel의 자리가 확보되었다고 썼습니다.'
    prize: '1830년: 파리 아카데미는 죽은 아벨과 자코비에게 그랑프리를 수여합니다.'
    memoir: '1841년: 아벨이 파리 아카데미에 준 회고록이 마침내 인쇄되었습니다.'
  ahmed_baba_timbuktu:
    conquest: '1591년: 모로코 군대가 팀북투를 점령했습니다.'
    deported: '1594년: 술탄에 저항했다는 혐의로 아마드 바바가 마라케시로 끌려갑니다.'
    return: '1608년: 아마드 바바가 팀북투에 있는 집으로 돌아가는 것이 허용되었습니다.'
    death: '1627년 4월 22일: 아마드 바바가 팀북투에서 사망합니다.'
  al_haytham_cairo:
    fustat_fire: '1020년: 불안한 가운데 푸스타트(Fustat)의 일부 지역에 불이 붙었습니다. 기록에는 그날 이븐 알하이삼이나 그의 원고가 어디에 있었는지 나와 있지 않습니다.'
  archimedes_syracuse:
    siege: '시라쿠사: 이 도시는 로마의 포위 공격에 맞서 버티고 있습니다.'
    death: '시라쿠사: 도시가 함락되고 아르키메데스가 살해됩니다.'
  artemisia_florence:
    admission_fee: '1616년 7월 19일: 아르테미시아가 피렌체의 미술 아카데미에 입학합니다.'
    commission_balance: '1616년 8월: 성향의 우화(Allegory of Inclination)의 마지막 편이 녹음되었습니다.'
  bach_leipzig:
    eyes: '1750년 봄: 바흐는 거의 눈으로 읽거나 쓸 수 없습니다.'
    operations: '1750년 봄: 존 테일러(John Taylor)가 바흐의 눈 수술을 합니다. 합병증에는 두 번째 수술이 필요합니다.'
    death: '1750년 7월 28일: 바흐가 라이프치히에서 사망했습니다.'
  banneker_maryland:
    fire: '1806년: 화재로 인해 Banneker의 집에 보관되어 있던 물건 대부분이 소실되었습니다.'
  basho_hiraizumi:
    set_out: '겐로쿠 2년 3월 27일: 바쇼는 소라와 함께 에도의 후카가와에서 북쪽으로 출발합니다.'
    depart: 5월 13일, 겐로쿠 2일, 날씨가 좋다. 오전 10시쯤 바쇼와 소라는 이치노세키를 떠나 히라이즈미로 향한다.
    takadachi: 다카다치에 올라 기타카미강과 코로모강을 내려다봅니다.
    golden_hall: 주손지에서 관리인은 그들에게 금당을 보여줍니다.
    sutra_hall: 수트라 홀(Sutra Hall)은 폐쇄되어 있습니다. 관리인은 자리를 비웠습니다.
    back: 오후 4시쯤 그들은 호스트가 목욕을 준비한 이치노세키의 숙소로 돌아왔습니다.
    ogaki: '8월 21일경: 바쇼는 좁은 길의 끝인 오가키에 이르렀다.'
    death: '겐로쿠 7년 10월 12일: 마쓰오 바쇼가 오사카에서 사망.'
  beethoven_vienna:
    full_rehearsals: '1824년 5월 5일: 합창단과 오케스트라가 콘서트 이틀 전에 처음으로 함께 연습했습니다.'
    premiere: '1824년 5월 7일: Kärntnertor 극장에서 9번 교향곡이 베토벤과 함께 처음으로 연주되었습니다.'
    second_concert: '1824년 5월 23일: Redoutensaal에서 콘서트가 반복되었습니다. 홀은 얇고 베토벤을 실망시킵니다.'
    death: '1827년 3월 26일: 루트비히 판 베토벤이 비엔나에서 사망합니다.'
  bell_boston:
    notebook: '1876년 3월 10일: Watson은 실험용 전화를 통해 Bell이 말한 내용을 이해합니다.'
    centennial: '1876년 6월 25일: 벨은 필라델피아에서 열린 100주년 전시회에서 전화기를 시연합니다.'
  bessie_coleman_jacksonville:
    paxon: '1926년 4월 30일: Coleman과 조종사가 Paxon Field에서 연습 비행 중 사망.'
  bizet_paris:
    premiere: '1875년 3월 3일: 카르멘이 오페라 코미크에서 개관합니다.'
    rehearsals: 극장은 개장하는 날까지 카르멘을 계속 리허설합니다.
    death: '1875년 6월 3일: Bizet가 Bougival에서 사망합니다.'
  boltzmann_duino:
    counting: '1877년: 볼츠만은 얼마나 많은 입자 배열이 동일한 에너지 분포를 제공하는지 계산합니다.'
    leave: '1906년 5월: 심각한 신경쇠약증을 앓고 있는 볼츠만은 비엔나에서 강의를 중단합니다.'
    duino: '1906년 여름: 볼츠만은 아내와 딸과 함께 트리에스테 근처의 두이노로 왔습니다.'
    death: '1906년 9월 5일: 루트비히 볼츠만(루트비히 볼츠만)이 두이노(Duino)에서 62세의 나이로 사망합니다.'
    perrin: '1908년: 장 페랭(Jean Perrin)의 브라운 운동 실험이 원자에 대한 아인슈타인의 예측을 확증하기 시작했습니다.'
    perrin_nobel: '1926년: 장 페랭(Jean Perrin)이 물질의 불연속 구조에 관한 연구로 노벨 물리학상을 받습니다.'
  boole_ballintemple:
    lecture: 1864년 11월 24일 Boole은 Cork에 있는 Queen's College에서 가르쳤습니다.
    death: 1864년 12월 8일 Boole은 Ballintemple에 있는 그의 집에서 사망했습니다.
    supplement: 1865년 11월, Isaac Todhunter의 서문에는 누가 테이블을 다시 계산했는지, 그 이유는 기록되어 있습니다.
  bose_calcutta:
    salary_wait: '1885년: 보스는 프레지던시 칼리지에서 가르치기 시작했습니다. 그는 낮은 임금을 거부했고, 분쟁이 해결되기까지 약 3년이 걸렸다.'
  buchner_zurich:
    typhus: 뷔히너는 열병에 걸렸습니다.
    minna: '1837년 2월: Minna Jaeglé는 Büchner의 투병 중 늦게 취리히에 도착합니다.'
    death: 뷔히너는 23세의 나이로 취리히에서 사망합니다.
  cajal_barcelona:
    chair: '1887년: Cajal은 바르셀로나 대학의 조직학 학과장을 맡습니다.'
    revista: '1888년 5월 1일: Cajal은 자신의 저널의 첫 번째 호에 대한 비용을 지불합니다. 약 60부 정도가 대부분 해외에 게시되었습니다.'
    berlin: '1889년 10월: 베를린에서 열린 독일 해부학 학회 회의에서 Cajal은 주요 조직학자들을 위해 현미경 아래 슬라이드를 준비하고 Kölliker는 작업을 시작합니다.'
    madrid: '1892: Cajal은 마드리드의 조직학 의장이 되기 위해 바르셀로나를 떠났습니다.'
    nobel: '1906년: Cajal과 Golgi는 신경계 구조에 대한 연구로 노벨상을 공동 수상했습니다.'
  camille_claudel_paris:
    father: '1913년 3월 3일: 카미유 클로델의 아버지가 Villeneuve-sur-Fère에서 사망합니다.'
    admission: '1913년 3월 10일: 카미유 클로델이 빌에브라르에 입학했습니다.'
  cantor_halle:
    hunger: 전쟁으로 인해 저장고가 텅 비었습니다. 칸토어는 아프고 음식이 부족합니다.
    clinic: 병원에서 Cantor는 아내에게 다시 편지를 썼습니다. 그는 집에 오라고 요청합니다.
    death: '1918년 1월 6일: 칸토어는 할레의 병원에서 사망합니다.'
  cao_xueqin_beijing:
    early_copy: Jiaxu 대조는 The Story of the Stone의 초기 주석 텍스트를 기록합니다.
    unfinished: 나중에 여백 메모는 책이 끝나기 전에 Cao가 죽어가는 것을 기억합니다. 그 연대기는 논쟁의 여지가 있습니다.
  caroline_herschel_slough:
    comet_letter: '1786년 8월 2일: 캐럴라인 허셜이 혜성 보고서와 함께 이틀 밤의 그림을 보냅니다.'
  chekhov_badenweiler:
    departure: '1904년 6월 3일: 중병에 걸린 체호프는 올가 크니퍼와 함께 독일 스파로 모스크바를 떠납니다.'
    romerbad: '1904년 6월 23일: 체호프와 올가 크니퍼는 여전히 길에서 피곤한 상태로 바덴바일러의 호텔 뢰머바트에 있습니다.'
    letter: '1904년 6월 25일: 빌라 프리데리케에서 체호프는 마리아에게 새 주소를 보내고 햇살 가득한 정원에 대한 글을 씁니다.'
    sommer: '1904년 7월 5일: 체호프는 좀머 호텔에서 마리아에게 편지를 씁니다. 우체국이 옆집에 있어요.'
    steamer: '1904년 7월 11일: 무더위 속에서 체호프는 어떤 증기선이 자신과 올가를 바다를 통해 러시아로 데려갈 수 있는지 묻는 편지를 썼습니다.'
    death: '1904년 7월 15일: 안톤 체호프가 바덴바일러에서 이른 시간에 44세의 나이로 사망했습니다.'
  copernicus_frombork:
    rheticus: '1539년: 비텐베르크 출신의 젊은 수학자 레티쿠스가 프롬보르크에 와서 코페르니쿠스에게 자신의 책을 출판할 것을 촉구합니다.'
    giese_worry: '1542년 12월 8일: Tiedemann Giese는 노인 코페르니쿠스의 건강에 대해 깊은 걱정을 하고 있다고 썼습니다.'
    revolutions: '1543년: 뉘른베르크에서 De revolutionibus가 인쇄되었으며, 앞에 독자를 위한 서명되지 않은 주소가 있습니다.'
    book_reached: '5월 24일경: 인쇄된 De revolutionibus가 Frombork에 도착합니다. Giese는 그가 죽은 날에 그것이 왔다고 쓸 것입니다. 그 이후에 왔을 수도 있습니다.'
    death: '1543년 5월 24일: 니콜라우스 코페르니쿠스가 Frombork에서 사망합니다.'
    giese_letter: '7월 26일: 기제는 레티쿠스에게 편지를 보내 두 권의 사본에 대해 감사를 표하고 뉘른베르크 의회에 개정판을 요청해 달라고 요청합니다.'
    autograph: '1999년: 크라쿠프의 Jagiellonian 도서관에 보관된 De revolutionibus의 사인이 세계 기록유산에 등재되었습니다.'
    remains: '2008년: DNA 비교 결과 프롬보르크 대성당 바닥 아래에서 발견된 유해가 코페르니쿠스의 것임을 보여줍니다.'
  curie_paris:
    april_note: '1898년 4월 12일: 마리 퀴리는 피치블렌드가 우라늄보다 더 강한 광선을 방출한다고 과학 아카데미에 보고합니다.'
    polonium: '1898년 7월 18일: 퀴리 부부는 피치블렌드의 새로운 원소를 발표하고 폴란드의 이름을 따서 폴로늄이라고 명명했습니다.'
    radium: '1898년 12월 26일: 퀴리 부부와 베몽 부부가 과학 아카데미에 라듐을 발표했습니다.'
    shed: '1902년: 퀴리 부부는 약 1톤의 역청에서 10분의 1그램의 염화라듐을 분리했습니다.'
    pierre_death: '1906년 4월 19일: 피에르 퀴리가 파리에서 마차에 치여 사망.'
    death: '1934년 7월 4일: 마리 퀴리가 오트사부아에서 재생 불량성 빈혈로 사망합니다.'
  dante_ravenna:
    exile: '1302년: 피렌체는 단테에게 추방을 선고하고, 그가 돌아오면 사형을 선고합니다.'
    ravenna: '1318년경: 단테는 귀도 노벨로 다 폴렌타(Guido Novello da Polenta)의 초청으로 라벤나에 정착합니다.'
    bologna_letter: '1319년경: 볼로냐에서 조반니 델 비르길리오(Giovanni del Virgilio)는 단테에게 라틴 시를 보내어 라틴어로 글을 쓰고 월계관을 받기 위해 볼로냐로 오라고 촉구했습니다.'
    questio: '1320년 1월 20일: 베로나에서 단테는 지구상의 물과 땅의 위치에 대해 강의합니다.'
    death: '1321년 9월 14일: 베니스 대사관에서 병들어 단테는 라벤나에서 사망합니다.'
    rehabilitation: '2008년 6월 16일: 피렌체 시의회는 시장에게 단테의 1302년 형을 취소해 줄 것을 요청하는 동의안을 통과시켰습니다.'
  darwin_galapagos:
    lawson: 찰스 섬의 부지사인 로슨(Lawson)은 거북이가 어느 섬에서 왔는지 알 수 있다고 말합니다.
    james_island: 1835년 10월 8일. 다윈 일행 몇 명은 천막을 가지고 제임스섬에 내리고, 비글호는 물을 구하러 떠난다.
  david_fleay_healesville:
    first_swim: '1944년 2월 26일: Fleay는 Corrie가 수영하러 나오는 것을 처음으로 관찰했습니다.'
    public_debut: '1944년 3월: 코리는 공개 데뷔 전에 숨었습니다. 관리인들이 그녀를 파헤쳤을 때 대부분의 방문객들은 떠났습니다.'
  dickinson_amherst:
    death: '1886년 5월 15일: 에밀리 디킨슨이 애머스트의 자택에서 사망합니다.'
  du_chatelet_luneville:
    luneville: '1749년 7월: Du Châtelet는 아이의 탄생을 기다리기 위해 Lunéville에 있는 Stanislas의 궁정에 왔습니다.'
    birth: '1749년 9월 4일: 새벽이 되기 전 Du Châtelet가 딸을 낳습니다.'
    death: '1749년 9월 10일: 에밀리 뒤 샤틀레가 태어난 지 6일 만에 Lunéville에서 사망합니다.'
    receipt: '1749년 9월 10일: 파리 왕립도서관은 뉴턴에 대한 그녀의 논평 3봉지에 서명했습니다.'
    principes: '1759년: 그녀의 논평과 함께 뉴턴의 프린키피아(Principia)에 대한 프랑스어 완역본이 출판되었습니다.'
  du_fu_xiang_river:
    final_journey: Yuan Zhen의 비문에는 두보가 집을 떠나 사망하고 Yueyang에 임시 매장된 내용이 기록되어 있습니다.
  emily_bronte_haworth:
    death: '1848년 12월 19일: 에밀리 브론테가 하워스에서 사망합니다.'
  enheduanna_ur:
    expulsion: The Exaltation of Inana는 연사가 사원에서 추방되는 것을 묘사합니다.
  eratosthenes_alexandria:
    tutor: '기원전 245년경: 프톨레마이오스 3세는 아들을 가르치기 위해 에라토스테네스를 알렉산드리아로 데려왔습니다.'
    librarian: '기원전 240년경: 에라토스테네스가 알렉산드리아 도서관의 사서가 됨.'
    midsummer: '클레오메데스의 후기 기록에 따르면 한여름 정오: 시에네의 포인터 아래에는 그림자가 없습니다. 알렉산드리아에서 태양은 천정으로부터 완전한 원의 50분의 1 지점에 있습니다.'
    death: '기원전 194년경: 에라토스테네스는 노년에 시각 장애인이 되어 알렉산드리아에서 사망합니다.'
  euclid_alexandria:
    elements: '기원전 300년경: 알렉산드리아에서 유클리드가 13권의 원소학 책을 썼습니다.'
    pappus: 'AD 320년경: 알렉산드리아의 파푸스(Pappus)는 포리즘이 171개의 정리와 38개의 보조정리를 가지고 있다고 기록했습니다.'
    printed: '1482년: 에르하르트 라트돌트(Erhard Ratdolt)가 여백에 도표와 함께 베니스의 원소들을 인쇄합니다.'
  fanny_mendelssohn_berlin:
    death: '1847년 5월 14일: 파니 헨젤이 베를린에서 사망합니다.'
  faraday_london:
    disc: '1831년 10월 28일: 구리 디스크가 회전하면서 전류를 생성합니다.'
  fibonacci_pisa:
    bugia: '1190년대: 북아프리카 해안의 부기아에서 피사의 젊은 레오나르도는 인도의 9개의 숫자를 계산하는 법을 배웁니다.'
    numerals: '1202년: 피사에서 레오나르도는 인도 숫자 9개와 0으로 계산하는 책인 Liber abaci를 완성합니다.'
    frederick: '1225년경: 프리드리히 2세의 궁정이 피사에서 회의를 열고 팔레르모의 요하네스가 레오나르도 문제를 제기합니다.'
    revision: '1228년: 레오나르도가 개정된 Liber abaci를 발행합니다. 이후 세기에 내려오는 사본은 이 버전의 것입니다.'
    salary: '1240년: 피사 공화국은 마스터 레오나르도 비골로(Leonardo Bigollo)에게 도시 회계 업무에 도움을 준 대가로 연봉을 지급합니다.'
  freud_vienna:
    father: '1896년 10월 23일: 프로이트의 아버지 야콥이 비엔나에서 사망합니다.'
    appearance: '1899년 11월 4일: Franz Deuticke가 출판한 The Interpretation of Dreams가 비엔나에서 출판되었습니다.'
    imprint: '같은 날: 제목 페이지에 인쇄된 연도는 1900년입니다.'
    second_edition: '1909년: 첫 번째 책 600부가 팔리는 데 8년이 걸린 후, The Interpretation of Dreams의 두 번째 판이 나옵니다.'
    professor: '1902년: 프로이트는 비엔나 대학교의 특별 교수가 되었습니다.'
  galen_rome:
    comedy_glossary_lost: '192: 화재로 인해 갈레노스의 Old Comedy 단어집이 파괴되었습니다.'
  galois_paris:
    release: '1832년 4월 29일: 갈루아는 9개월 이상의 구금 끝에 파리에서 석방됩니다.'
    letter_to_chevalier: '1832년 5월 29일: 갈루아는 밤새 친구인 오귀스트 슈발리에에게 편지를 써서 자신의 작업을 설명하고 그 편지를 인쇄해 달라고 요청했습니다.'
    duel: '1832년 5월 30일: 이른 아침, 갈루아는 결투 중 복부에 총을 맞고 쓰러진 자리에 남겨졌습니다. 지나가던 농부가 그를 발견했습니다.'
    death: '1832년 5월 31일: 에바리스트 갈루아가 코친 병원에서 20세의 나이로 사망합니다.'
    burial: '1832년 6월 2일: 갈루아는 몽파르나스의 공동묘지에 묻혔습니다.'
    printed: '1832년 9월: 슈발리에가 Revue 백과사전에 편지를 인쇄합니다.'
    liouville: '1846년: Joseph Liouville은 자신의 저널에 Galois의 논문을 게재합니다.'
  gaudi_barcelona:
    accident: '1926년 6월 7일: 그란 비아(Gran Via)에서 트램이 가우디를 쓰러뜨립니다. 거지 취급을 받은 그는 택시가 지나가는 동안 거리에 누워 있다.'
    death: '1926년 6월 10일: 안토니 가우디가 바르셀로나 병원에서 73세의 나이로 사망했습니다.'
    burial: '1926년 6월 12일: 가우디가 43년 동안 관리했던 건물 지하에 묻혔습니다.'
    workshop: '1936년 7월 20일: 작업장에 불이 붙었고 가우디의 그림과 모델 대부분이 손실되었습니다.'
  great_zimbabwe:
    builders: 11세기부터 쇼나족의 조상들은 이 언덕에 돌로 된 도시를 건설했습니다. 건물은 300년 이상 지속됩니다.
    mauch: '1871년: 독일의 칼 마우흐(Karl Mauch)가 폐허에 도달했습니다.'
    western_yard_loss: '1915: 승무원들이 서부 인클로저의 흙 플랫폼, 벤치 및 벽 대부분을 제거합니다.'
    name: '1980년: 새로운 국가가 짐바브웨라는 도시에서 이름을 따왔습니다.'
    heritage: '1986년: 그레이트 짐바브웨가 세계문화유산으로 등재되었습니다.'
  gutenberg_mainz:
    loans: Fust는 책 작업을 위해 Gutenberg 800 길더를 두 번 빌려주었습니다.
    bible: '1455년: 42행의 책이 마인츠에서 금속활자로 인쇄되었습니다.'
    lawsuit: '1455년 11월 6일: 공증인은 푸스트가 구텐베르크에게 대출금과 이자에 대해 제기한 사건을 기록합니다.'
    workshop: 분쟁 후 Fust와 Schöffer는 마인츠에서 인쇄를 계속합니다.
  hammurabi_babylon:
    accession: '기원전 1792년경: 함무라비가 바빌론의 왕이 됩니다.'
    stele: '함무라비 통치 말기인 기원전 1754년경: 거의 300개의 법칙이 새겨진 현무암 비석이 세워졌습니다.'
    death: '기원전 1750년경: 함무라비가 죽다.'
    susa: '기원전 12세기: 비석이 수사로 옮겨졌고, 그 본문의 여러 기둥이 긁혀졌습니다.'
    found: '1901년: 프랑스 탐험대가 수사에서 비석을 발굴하여 세 개로 나눴습니다.'
  hargrave_stanwell_park:
    boxkite: '1893년: Hargrave는 연 실험을 시작하고 상자 연을 만듭니다.'
    beach: '11월 12일: 스탠웰 공원(Stanwell Park) 해변에서 4개의 연결된 상자 연이 하그레이브를 거의 16피트 높이의 모래 위로 들어 올립니다.'
    photo: '1894년 11월 12일: 스탠웰 공원에서 연 장비를 들고 하그레이브와 제임스 스웨인을 촬영한 사진.'
    death: '1915년 7월 6일: 하그레이브가 시드니에서 65세의 나이로 사망합니다.'
  hertz_bonn:
    illness: Hertz는 이번 학기에 코와 목 수술 사이에 다시 강의를 할 예정입니다.
    mechanics: '1893년 12월 3일: Hertz는 The 원리 of Mechanics의 원고를 출판사에 보냅니다.'
    death: '1894년 1월 1일: 하인리히 헤르츠가 본에서 사망합니다.'
  higuchi_ichiyo_tokyo:
    death: '1896년 11월 23일: 히구치 이치요가 결핵으로 사망.'
  hildegard_bingen:
    lifted: '1179년 3월: 노래 제한이 종료됩니다.'
  hipparchus_rhodes:
    commentary: '기원전 2세기 후반: 히파르코스의 주석에서는 친숙한 시에 함께 묘사된 일부 별들이 함께 떠오르지 않았다는 점을 지적했습니다.'
  hooke_london:
    death: 1703년 3월 3일 로버트 훅이 런던에서 사망했습니다.
    edition: 1705년에 Richard Waller는 Hooke의 사후 작품을 출판했습니다.
  hua_tuo_xuchang:
    manuscript_lost: Sanguozhi는 간수가 책을 거부했다고 기록합니다. 화타가 그것을 태워버립니다.
    death: Sanguozhi는 Xu에서 화타의 죽음을 기록합니다.
  humboldt_chimborazo:
    crevasse: '1802년 6월 23일: Chimborazo 정상 아래 깊은 도랑이 등반가들을 멈추고 그들은 돌아섰습니다.'
    sickness: 더 높은 곳에는 포터가 멈춥니다. 세 사람은 코피와 현기증을 느끼며 계속됩니다.
  hypatia_alexandria:
    teaching: '415년 초: 히파티아는 여전히 알렉산드리아에서 가르치고 있으며, 도시의 행정관들이 그녀의 말을 들으러 옵니다.'
    feud: 지사와 도시의 다른 세력 사이의 불화가 더욱 날카로워지고 히파티아도 그 불화에 빠져들게 됩니다.
    death: '415년 3월: 히파티아가 알렉산드리아에서 살해됨.'
  ibn_al_nafis_cairo:
    collection: '1288년: 이븐 알나피스가 사망하고 그의 도서관을 병원에 맡겼습니다. 그의 대규모 의학 백과사전 중 일부만이 오늘날 남아 있습니다.'
  ibn_battuta_tangier:
    departure: '2 Rajab 725 (1325년 6월): 이븐 바투타가 Tangier를 떠납니다.'
    return: '1354년경: 약 30년 동안의 여행을 마치고 집으로 돌아와 Ibn Juzayy에게 여행 일정을 지시합니다.'
  ibn_khaldun_cairo:
    cairo: '1382년: 이븐 할둔이 술탄 바르쿠크의 초청으로 카이로에 왔습니다.'
    family_release: '1384년: 술탄의 요청에 따라 튀니스는 아내와 딸들을 이집트로 항해하게 합니다.'
    qadi: '1384년 8월 8일: 그는 말리키 학교의 수석 판사가 되었습니다.'
    rivals: 1385년. 취임한 지 약 열 달 만에 경쟁자들의 압력으로 법관직에서 물러난다.
    shipwreck: 같은 해에 그의 아내와 딸들을 태운 배가 알렉산드리아에 침몰했습니다.
    timur: '1401년 초: 포위된 다마스쿠스 외곽에서 이븐 칼둔이 티무르를 만납니다.'
    death: '1406년 3월 17일: Ibn Khaldun이 카이로에서 사망합니다.'
    burial: 그는 Bab al-Nasr 외곽의 묘지에 묻혔습니다.
  ibn_rushd_lucena:
    exile: Ibn Rushd는 Lucena로 추방됩니다. 계정에는 책을 태우라는 명령도 기록됩니다.
  ibn_sina_hamadan:
    death: '1037년: 이븐 시나가 하마단에서 사망.'
  ife_bronzes:
    frobenius: '1910년: 레오 프로베니우스(Leo Frobenius)는 이페(Ife)에서 획득한 금속 머리를 반환해야 합니다.'
    wunmonije: '1938년 1월: 운모니제(Wunmonije) 단지의 기초를 파다가 건축업자들이 한 무리의 우두머리를 발견했습니다.'
    exhibition: '1948년 7월: Ife 주물이 대영 박물관에 전시됩니다.'
    field_plan_gap: 대부분의 참호가 다시 메워진 후, 이후의 고고학자들은 초기 발굴에 대한 포괄적인 계획이 없었고 배치를 재구성해야 했습니다.
  ino_tadataka_ezo:
    set_out: '1800년 6월 11일: 이노 다다타카와 조사대는 에도를 떠나 에조로 향했습니다.'
    coast: '1800년: 에조(Ezo)에서 조사대는 남쪽 해안을 따라 니시베츠(Nishibetsu)까지 이동했습니다.'
    death: '1818년: 이노 다다타카가 사망. 한동안 아무도 이를 발표하지 않으므로 지도 작업은 계속될 수 있습니다.'
    map: '1821년: 다카하시 가게야스와 다른 사람들이 대일본 해안 지도를 완성합니다.'
  jianzhen_nara:
    eiei: '단주: 건진에게 건너가자고 양주에 온 에이에이가 병으로 사망한다.'
    eyes: 북쪽으로 여행하던 중 Jianzhen은 시력을 잃습니다.
  kafka_kierling:
    larynx: '1924년 3월: 카프카는 삼키는 데 어려움을 겪기 시작합니다. 결핵이 후두까지 이르렀습니다.'
    kierling: '1924년 4월 19일: Kafka와 도라 디아만트가 키얼링의 호프만 요양소에 왔습니다. 그는 종이 쪽지에 대해 이야기합니다.'
    klopstock: '1924년 5월 6일경: 의과대학생 로버트 클롭스톡(Robert Klopstock)이 간호를 돕기 위해 키어링에 왔습니다.'
    last_proofs: '1924년 6월 2일: 카프카는 여전히 『단식 광대』의 교정본을 수정하고 있습니다.'
    death: '1924년 6월 3일: 프란츠 카프카가 키얼링에서 40세의 나이로 사망합니다.'
    burial: '1924년 6월 11일: 카프카가 프라하에 묻혔습니다.'
    four_stories: '1924년 8월 말: 4개의 이야기로 구성된 『단식 광대』가 베를린에서 출간됩니다.'
  keats_rome:
    arrival: '11월 15일: 키츠와 세번이 로마에 도착하여 스페인 계단 옆 26 Piazza di Spagna 2층에 방을 잡습니다.'
    rome_letter: '11월 30일: 키츠는 찰스 브라운에게 편지를 쓰고 작별 인사를 하는 것이 어려워졌다고 썼습니다.'
    death: '2월 23일 늦은 밤: 키츠가 사망함. 세번이 그와 함께 있어요.'
    register: 장지 기록에는 그 날이 2월 24일로 기록되어 있다.
    burial: '2월 26일: 키츠가 피라미드 옆 묘지에 묻혔다.'
    epitaph: 그의 뜻에 따라 돌에는 그의 이름이 새겨지지 않을 것입니다. 다만, 물에 이름이 기록된 분이 여기 누워 계십니다.
    severn: '1879년: 세번이 사망합니다. 그는 키츠 옆에 묻혀있습니다.'
  kepler_leonberg:
    arrest: '1620년 8월 7일: 카타리나 케플러(Katharina Kepler)가 헤마덴(Heumaden)에서 체포되었습니다. 그녀에 대한 소송은 Leonberg에서 시작됩니다.'
    charged: '1620년 9월 4일: Güglingen에서 Katharina는 사형죄로 기소됩니다.'
    kepler_arrives: '1620년 9월: 요하네스 케플러(요하네스 케플러)가 어머니를 변호하기 위해 린츠에서 돌아옵니다.'
    postponed: '1620년 10월 2일: 오늘로 예정된 청문회가 12월 11일까지 10주 연기되었습니다.'
    witnesses: '1621년 1월 8일: Güglingen에서 증인 선서가 시작되었습니다.'
    defence: '1621년 5월 7일: 카타리나 케플러에 대한 변호 서면이 제출되어 각 증인에게 차례로 답변합니다.'
    released: '1621년 가을: 구금된 지 405일 만에 카타리나 케플러가 석방됩니다.'
    death: '1622년 4월: 카타리나 케플러가 석방된 지 약 6개월 만에 사망합니다.'
  kovalevskaya_stockholm:
