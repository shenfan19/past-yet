  riemann_selasca:
    geometry_lecture: '1854년 6월 10일: 괴팅겐에서 리만은 기하학의 기초에 관한 가설에 대해 강의합니다.'
    primes: '1859년: 리만은 주어진 크기 이하의 소수의 수에 관한 논문을 베를린 아카데미에 보냅니다.'
    illness: '1862년 가을: 리만이 병에 걸렸습니다.'
    selasca: '1866년 6월: 세 번째 남쪽 여행 중 리만은 마조레 호수의 셀라스카에 도착합니다.'
    last_work: '1866년 7월 19일: 셀라스카의 무화과나무 아래에서 리만은 마지막 논문을 작성하고 있습니다.'
    death: '1866년 7월 20일: 베른하르트 리만(베른하르트 리만)이 셀라스카(Selasca)에서 39세의 나이로 사망합니다.'
    werke: '1876년: 리만의 전집이 편집자로 데데킨트와 함께 라이프치히에서 출판되었습니다.'
  rumi_konya:
    death: '1273년 12월 17일: 루미가 코냐에서 사망합니다.'
  sappho_lesbos:
    exile: '기원전 7~6세기 초: 파리안 대리석(Parian Marble)은 사포가 미틸레네(Mytilene)에서 시칠리아(Sicily)로 망명하여 항해하는 것을 기록합니다.'
  savitribai_phule_pune:
    records: '1852년 2월 5일: 지원 신청서에 Savitribai가 첫 번째 학교의 교장으로 기재되었습니다.'
    death: '1897년 3월 10일: 사비트리바이가 환자를 간호하던 중 전염병으로 사망합니다.'
  schubert_vienna:
    programme: '1828년 3월 26일: Gesellschaft der Musikfreunde의 방에서 슈베르트가 자신의 작품을 연주합니다.'
    move: '1828년 가을: 병에 걸린 슈베르트는 비에덴에 있는 그의 형 페르디난트의 새 아파트로 이사합니다.'
    probst: '1828년 10월 2일: 슈베르트는 그의 마지막 세 곡의 피아노 소나타를 출판사인 프롭스트(Probst)에 제공합니다.'
    death: '1828년 11월 19일: 프란츠 슈베르트가 비엔나에서 31세의 나이로 사망합니다.'
    first_edition: '1839년: Robert Schumann에게 헌정된 마지막 세 개의 소나타가 Diabelli에서 나왔습니다.'
  schumann_endenich:
    request: 1856년 7월 14일 클라라 슈만은 로베르트를 만나기를 요청했습니다.
    visit: 7월 27일 클라라는 엔데니히(Endenich)에 있는 로버트를 방문했습니다.
    death: 7월 29일 로베르트 슈만은 엔데니히에서 사망했다.
  sei_shonagon_kyoto:
    teishi_death: 비시 공주가 태어난 후 테이시가 조호 2년 12월 16일에 사망합니다.
  sejong_hangul:
    created: 1443년 말, 세종이 우리말을 적는 새 글자 스물여덟 자를 완성했다.
    memorial: 1444년 음력 2월, 최만리와 집현전 동료 여섯 명이 상소를 올려 이의를 제기했다.
    promulgated: 1446년, 백성을 가르치는 바른 소리라는 뜻의 『훈민정음』이 반포되었다.
    sejong_dies: 1450년, 세종이 세상을 떠났다.
  sequoyah_syllabary:
    council: '1821년: 세쿼야는 체로키어 단어를 종이에 적을 수 있는 표지판 세트를 완성합니다.'
    phoenix: '1828년 2월 21일: 뉴 에코타(New Echota)에서 최초의 체로키 피닉스(Cherokee Phoenix)가 인쇄판에서 나왔고, 체로키어와 영어가 나란히 열에 등장했습니다.'
    death: '1843년 8월: 세쿼야가 멕시코에서 사망합니다.'
  shakespeare_globe:
    burial: '1596년 8월 11일: 햄넷 셰익스피어가 스트랫퍼드어폰에이번에 묻혔습니다. 기록에는 그의 아버지가 사전에 그와 함께 있었는지 여부가 기록되어 있지 않습니다.'
  sima_qian_changan:
    sentence: Li Ling 사건 이후 사마천은 처벌을 받습니다.
  smith_kirkcaldy:
    wealth: '1776년 3월 9일: 애덤 스미스의 국부론이 런던에서 출판되었습니다. 첫 번째 장은 핀 만들기에 관한 것입니다.'
    will: '1776년 1월 4일: David Hume은 유언장을 작성하고 그의 서류를 관리하도록 애덤 스미스를 지명합니다.'
    codicil: '1776년 8월 7일: 코디실에서 흄은 자신의 사망 후 2년 이내에 출판되도록 대화록을 인쇄업자 윌리엄 스트라한(William Strahan)에게 맡깁니다.'
    hume_death: '1776년 8월 25일: 데이비드 흄이 에든버러에서 사망합니다.'
    letter_strahan: '1776년 11월 9일: Kirkcaldy에서 Smith는 Strahan에게 Hume의 마지막 달에 대한 설명을 씁니다.'
    copy_money: '1776년 11월 13일: Smith는 300파운드의 복사 비용에 대한 메모와 더 저렴한 2판에 대한 계획과 함께 계정을 Strahan에 게시합니다.'
    own_life: '1777년: 흄 자신의 짧은 생애가 스미스의 편지에 인쇄되었고, 그 편지는 화난 답장을 불러일으켰습니다.'
    dialogues: '1779년: 제목 페이지에 이름이 없는 흄의 조카를 통해 대화가 나옵니다.'
  socrates_athens:
    trial: '기원전 399년: 소크라테스는 아테네에서 배심원단 앞에서 재판을 받고 유죄 판결을 받았습니다.'
    surety: 같은 날 그는 플라톤, 『크리톤』 및 다른 두 친구를 보증인으로 삼아 30미나의 벌금을 부과했습니다. 배심원은 그에게 사형을 선고했습니다.
    ship: 재판 전날 델로스로 가는 배를 출발하였다. 집에 도착할 때까지는 아무도 죽임을 당하지 않을 것이다. 소크라테스는 감옥에 갇혀 기다리게 됩니다.
    verses: 감옥에서 소크라테스는 계속해서 돌아오는 꿈의 지시에 따라 이솝 우화를 운문으로 옮기기 시작합니다.
    crito: 어느 날 이른 아침, 『크리톤』은 감옥에 와서 배가 곧 들어올 것이라고 말하고 탈출을 촉구합니다. 그는 그렇지 않을 것입니다.
    plato_ill: 마지막 날, 그의 친구들은 동이 틀 때 감옥에 모였습니다. 플라톤은 아파서 오지 않습니다.
    death: 저녁 무렵 소크라테스는 감옥에서 독약을 마시고 죽습니다.
  sophie_germain_paris:
    leblanc: '1804년: 르 블랑 씨라는 이름으로 제르맹은 가우스에게 편지를 쓰기 시작합니다.'
    prize: '1816년: 세 번째 시도에서 Germain은 진동 탄성판에 대한 회고록으로 과학 아카데미 상을 수상합니다.'
    cancer: '1829년: 제르맹은 유방암에 걸려 일을 계속합니다.'
    death: '1831년 6월 27일: 소피 제르맹(소피 제르맹)이 파리의 13 rue de Savoie에서 55세의 나이로 사망했습니다.'
    curvature: '1831년: 표면의 곡률에 관한 그녀의 회고록이 베를린에 있는 Crelle의 저널 7권에 게재됩니다.'
  sor_juana_mexico_city:
    carta: '1690년: 푸에블라의 주교는 그녀에게 요청하지 않고 그녀의 설교에 대한 비평을 인쇄하고 편지와 함께 Sor Filotea에 서명합니다.'
    respuesta: '1691년 3월 1일: 그녀는 Sor Filotea에게 답장한 날짜를 기재합니다. 그 책에서 그녀는 부엌에서 많은 것을 배울 수 있다고 썼습니다.'
    books: '1693년: 그녀의 책과 악기가 팔리고 그 돈이 가난한 사람들에게 주어졌습니다.'
    vows: '1694년: 그녀는 서약을 갱신합니다.'
    death: '1695년 4월 17일: 소르 후아나(Sor Juana)가 수녀원에서 병에 걸린 자매들을 간호한 후 사망합니다.'
    printed: '1700년: Sor Filotea에 대한 그녀의 답변이 그녀의 작품집에 처음으로 인쇄되었습니다.'
  su_shi_huangzhou:
    crow_terrace: 1079년 여름, 소식(소식)은 그의 시로 인해 체포되어 카이펑(Kaifeng)에 갇히게 됩니다.
    exile: 1080년 소시가 황저우로 망명해 온다.
    eastern_slope: 1081년에 그는 마을 동쪽 경사면에 있는 땅을 정리하고 농사를 짓기 시작했습니다.
    red_cliff: '7월 16일: 소식과 그의 손님들이 배를 타고 적벽 아래로 나갑니다.'
    later_ode: '10월 보름달: 소시는 두 명의 손님과 함께 눈당에서 링가오(Lingao)를 향해 걸어갑니다.'
    leaving: 1084년 소식은 황저우를 떠났다.
  tagore_santiniketan:
    translation: '1912년 11월: 타고르 자신의 산문 번역으로 된 영어 Gitanjali가 런던에서 출판됩니다.'
    award: '1913년 11월 13일: 스웨덴 아카데미는 타고르에게 노벨 문학상을 수여합니다.'
    reception: '1913년 11월 23일: 기차가 캘커타에서 산티니케탄까지 지지자들을 데려왔습니다. 타고르의 대답은 많은 사람들에게 상처를 입혔습니다.'
    visva_bharati: '1921년: 타고르는 산티니케탄에 비스바-바라티 대학을 설립했습니다.'
    death: '1941년 8월 7일: 라빈드라나트 타고르(라빈드라나트 타고르)가 캘커타에서 사망합니다.'
  tang_xianzu_linchuan:
    dated_preface: 1598년 가을, 당현조는 모란정에 서문을 썼다.
  taqi_al_din_istanbul:
    instrument_damage: '1580년 1월: 천문대가 해체되었습니다. 동시대 기록에는 악기가 파손되었다고 기록되어 있습니다.'
  terence_rome:
    first_interruption: '기원전 165년: 시어머니의 첫 번째 무대가 끝나기 전에 중단됩니다.'
  tesla_wardenclyffe:
    morgan: '1901년 3월: Morgan은 Tesla의 무선 스테이션에 150,000달러를 투자하는 데 동의합니다.'
    white: '1901년 9월 13일: Tesla는 예기치 않게 높은 입찰가에 대해 Stanford White에게 답장을 보냅니다.'
    building: '1901년 9월: Wardenclyffe에서 건축이 시작됩니다.'
    marconi: '1901년 12월 12일: 뉴펀들랜드의 시그널 힐에서 마르코니는 콘월에서 보낸 편지 S를 듣습니다.'
    laboratory: '1902년 6월: Tesla는 자신의 실험실을 Wardenclyffe의 벽돌 건물로 이전합니다.'
    no_more: '1903년 7월: Morgan은 더 이상 진전을 이루지 않을 것이라고 썼습니다.'
    demolished: '1917년 7월 4일: Wardenclyffe 타워의 철거가 시작됩니다.'
  timbuktu_sankore:
    departure: '1468년경: 팀북투의 손이 바뀌자 학자들은 도망쳤습니다. 일부는 Walata로갔습니다.'
  tupaia_tahiti:
    boards: '1769년 7월 12일: 투파이아(Tupaia)가 엔데버(Endeavour)호에 승선하여 이 호와 함께 항해하고 싶다고 다시 말했습니다.'
    departs: '7월 13일: 엔데버 호는 투파이아와 소년 타이타를 태우고 타히티를 떠납니다.'
    chart: '8월 15일: 투파이아는 자신이 알고 있는 약 130개 섬의 지도를 작성하기 시작합니다. 그는 자신의 이름을 일흔넷이라고 불렀다.'
    reef: '1770년 6월 10일 밤: 엔데버호가 암초에 충돌했습니다.'
    scurvy: '1770년 6월 16일: 투파이아가 괴혈병에 걸렸습니다.'
    death: 'Batavia: Banks는 11월에 Taiata와 Tupaia의 사망을 기록합니다.'
  ulugh_beg_samarkand:
    observatory: '1428년: 사마르칸트 외곽에서 울루그 벡(Ulugh Beg) 천문대 건물이 언덕을 깎아 만든 커다란 호와 함께 시작됩니다.'
    catalogue: '1437년경: 사마르칸트의 항성 목록이 완성되었습니다. 1018개의 별이 있었으며 대부분이 새로 측정되었습니다.'
    fall: '사마르칸트: 울루 베그(Ulugh Beg)가 통치를 포기하고 도시를 떠나라는 지시를 받습니다.'
    death: '1449년 10월 하순: 울루그 베그(Ulugh Beg)가 사마르칸트 근처 도로에서 사망했습니다.'
    rediscovered: '1908년: 러시아 고고학자들이 언덕 아래에서 다시 호를 발견합니다.'
  van_gogh_auvers:
    arrival: '1890년 5월 20일: 빈센트 반 고흐가 오베르에 와서 Auberge Ravoux에 방을 잡습니다.'
    work: 그는 하루에 거의 한 장의 그림을 그린다.
    auvers_letter: '7월 10일경: 그는 험난한 하늘 아래 광대한 밀밭에 대해 테오와 조에게 편지를 씁니다.'
    shot: '7월 27일: 반 고흐가 자신의 가슴에 총을 쏜다.'
    death: '7월 29일: 빈센트 반 고흐가 사망한다. 그의 동생 테오도 그와 함께 있다.'
  vermeer_delft:
    war: '1672년: 프랑스, 영국과의 전쟁으로 인해 공화국의 미술 무역이 붕괴되었습니다.'
    loan: '1675년 7월: 베르메르는 천 길더를 빌리기 위해 암스테르담으로 갑니다.'
    burial: '1675년 12월 15일: 요하네스 페르메이르가 43세의 나이로 델프트에 묻혔습니다.'
    baker: '1676년 초: 카타리나는 빵 617길더에 맞춰 자신의 그림 두 점을 제빵사에게 건네줍니다.'
    art_of_painting: '1676년 2월 24일: 카타리나는 어머니 마리아 틴스(Maria Thins)에게 회화 예술을 전수합니다.'
    inventory: '1676년 2월 29일: 공증인이 Oude Langendijk에 있는 집의 목록을 작성했습니다.'
    petition: '1676년 4월: 카타리나는 고등 법원에 빚을 탕감해 달라고 요청합니다.'
    trustee: '1676년 9월 30일: Antonie van Leeuwenhoek이 유산의 수탁자가 되었습니다.'
    rediscovery: '1866년: Thoré-Bürger가 베르메르 작품 카탈로그를 출판합니다.'
  vesalius_padua:
    complaint: '1546년 6월 13일: 베살리우스는 레겐스부르크에서 글을 쓰고 복사된 그림에서 본 왜곡을 비판했습니다.'
  wallace_ternate:
    fever: '1858년 2월: 몰루카스에서 월리스는 열이 식을 때까지 기다리며 논문에 메모를 남깁니다.'
    signed: '1858년 2월: 에세이는 Ternate에서 작성되었습니다.'
    dorey_departure: '1858년 3월 25일: Jumaat를 포함한 Wallace와 그의 일행은 Ternate에서 Dorey를 향해 항해합니다.'
    sent: 에세이는 우편물 증기선에 Ternate를 남깁니다. 3월의 보트였는지 4월의 보트였는지는 여전히 논쟁의 여지가 있습니다.
    received: '6월 18일: 켄트에서 에세이가 다운 하우스의 찰스 다윈에게 전달되었습니다.'
    read: '7월 1일: 런던의 Linnean Society에서 두 논문을 모두 읽습니다. 두 작가 모두 방에 없습니다. 월리스는 나중에서야 그 소식을 듣게 됩니다.'
    jumaat_death: '1858년 6월 26일: Jumaat가 Dorey에서 사망합니다.'
    printed: '1858년 8월 20일: 공동 논문이 Linnean Society의 회보에 인쇄되었습니다.'
  wright_kitty_hawk:
    camp: '9월: 형제들이 키티 호크 근처 캠프로 돌아옵니다. 기계의 문제로 인해 재판은 계속해서 연기됩니다.'
    first_try: '12월 14일: Wilbur가 동전 던지기에서 승리하여 먼저 출발합니다. 시도가 실패합니다.'
    first_flight: '12월 17일 아침: 오빌이 12초 만에 120피트를 비행했습니다. 인명구조소의 존 T. 다니엘스가 셔터를 누른다.'
    fourth_flight: 오늘의 네 번째 비행은 59초에 852피트로 가장 길다.
    flyer_damage: 돌풍이 플라이어를 뒤집습니다. 기계가 심하게 손상되어 다시는 날지 못합니다.
    telegram: '오후: 형제들은 키티 호크까지 4마일을 걸어가 아버지에게 전신을 보냅니다. 메시지에는 가장 긴 비행이 57초라고 적혀 있습니다.'
    dayton: 5시 30분쯤 데이턴에서 그들의 아버지 밀턴 라이트(Milton Wright)가 전보를 받았습니다. 데이턴의 신문은 거의 한 마디도 인쇄하지 않습니다.
  xu_xiake_lijiang:
    diary: 1639년 음력 2월 6일, 쉬(Xu)는 책을 정리하기 위해 Jietuo Lin에 머물었습니다.
    departure: 1639년 음력 2월 8일, 쉬(Xu)는 비를 타고 린절타(Jietuo Lin)에서 내려왔습니다.
    commission: 1639년 음력 2월 9일, 서하객은 『계산지』 편찬을 다시 부탁하는 편지를 받았다.
  zeami_sado:
    island: '사도: 일흔이 넘은 제아미는 섬에서 유배 생활을 하고 있습니다.'
