# Generated by tools/build_data.mjs from the cards folder. Do not edit this file, edit the cards and run the build.
refs:
  game: Réalisé avec l’aide de l’IA.
fact_lines:
  abel_froland:
    quintic: '1824 : Abel prouve que l''équation générale du cinquième degré ne peut être résolue par des radicaux.'
    sledge: 'Noël 1828 : rhume et toux, Abel vient en traîneau à Froland voir sa fiancée.'
    last_paper: '6 janvier 1829 : au lit à Froland, Abel rédige son dernier article, deux ou trois pages sur l''idée principale de ses mémoires de Paris.'
    death: '6 avril 1829 : Niels Henrik Abel décède à Froland, âgé de vingt-six ans.'
    berlin: '8 avril 1829 : sans le savoir, Crelle écrit de Berlin que le poste d''Abel est assuré.'
    prize: '1830 : l''Académie de Paris remet son Grand Prix à Abel, décédé, et à Jacobi.'
    memoir: '1841 : le mémoire qu''Abel donne à l''Académie de Paris est enfin imprimé.'
  ahmed_baba_timbuktu:
    conquest: '1591 : une armée marocaine prend Tombouctou.'
    deported: '1594 : accusé de résistance au sultan, Ahmad Baba est emmené à Marrakech.'
    return: '1608 : Ahmad Baba est autorisé à rentrer chez lui à Tombouctou.'
    death: '22 avril 1627 : Ahmad Baba meurt à Tombouctou.'
  al_haytham_cairo:
    fustat_fire: "1020\_: certaines parties de Fustat ont été incendiées lors des troubles. Le récit ne précise pas où se trouvaient Ibn al-Haytham ou ses manuscrits ce jour-là."
  archimedes_syracuse:
    siege: 'Syracuse : la ville résiste au siège romain.'
    death: 'Syracuse : la ville est prise, et Archimède est tué.'
  artemisia_florence:
    admission_fee: '19 juillet 1616 : Artemisia entre à l''Académie des Arts du Dessin de Florence.'
    commission_balance: "Août 1616\_: le dernier volet d’Allégorie de l’inclinaison est enregistré."
  bach_leipzig:
    eyes: 'Printemps 1750 : Bach sait à peine lire ou écrire avec ses yeux.'
    operations: 'Printemps 1750 : John Taylor opère les yeux de Bach. Les complications nécessitent une deuxième opération.'
    death: '28 juillet 1750 : Bach meurt à Leipzig.'
  banneker_maryland:
    fire: '1806 : un incendie détruit une grande partie de ce que Banneker gardait dans sa maison.'
  basho_hiraizumi:
    set_out: 'Le vingt-septième jour du troisième mois, Genroku 2 : Bashō part de Fukagawa à Edo avec Sora pour le nord.'
    depart: 'Le treizième jour du cinquième mois, Genroku 2, très bien : vers dix heures du matin, Bashō et Sora quittent Ichinoseki pour Hiraizumi.'
    takadachi: Ils gravissent Takadachi et surplombent les rivières Kitakami et Koromo.
    golden_hall: A Chūsonji, l'intendant leur montre la Salle Dorée.
    sutra_hall: 'La salle des Sutras reste fermée : le steward est absent.'
    back: Vers quatre heures de l'après-midi, ils sont de retour à leur logement à Ichinoseki, où l'hôte prépare le bain.
    ogaki: 'Vers le vingt et unième jour du huitième mois : Bashō atteint Ōgaki, la fin de la route étroite.'
    death: 'Le douzième jour du dixième mois, Genroku 7 : Matsuo Bashō meurt à Osaka.'
  beethoven_vienna:
    full_rehearsals: '5 mai 1824 : chœur et orchestre répètent ensemble pour la première fois, deux jours avant le concert.'
    premiere: '7 mai 1824 : au Théâtre Kärntnertor est jouée pour la première fois la Neuvième Symphonie, avec Beethoven sur scène.'
    second_concert: '23 mai 1824 : le concert est répété dans la grande Redoutensaal ; la salle est maigre et les recettes déçoivent Beethoven.'
    death: '26 mars 1827 : Ludwig van Beethoven décède à Vienne.'
  bell_boston:
    notebook: '10 mars 1876 : Watson comprend les paroles prononcées par Bell au téléphone expérimental.'
    centennial: '25 juin 1876 : Bell présente le téléphone à l''exposition du centenaire de Philadelphie.'
  bessie_coleman_jacksonville:
    paxon: '30 avril 1926 : Coleman et le pilote meurent lors d''un vol d''entraînement à Paxon Field.'
  bizet_paris:
    premiere: '3 mars 1875 : Carmen ouvre à l''Opéra-Comique.'
    rehearsals: Le théâtre continue de répéter Carmen jusqu'au jour de son ouverture.
    death: '3 juin 1875 : Bizet meurt à Bougival.'
  boltzmann_duino:
    counting: '1877 : Boltzmann compte combien d''arrangements de particules donnent la même distribution d''énergie.'
    leave: 'Mai 1906 : atteint de ce qu''on appelle une neurasthénie sévère, Boltzmann arrête de donner des cours à Vienne.'
    duino: 'Été 1906 : Boltzmann arrive avec sa femme et sa fille à Duino près de Trieste.'
    death: '5 septembre 1906 : Ludwig Boltzmann décède à Duino, à l''âge de soixante-deux ans.'
    perrin: '1908 : Les expériences de Jean Perrin sur le mouvement brownien commencent à confirmer les prédictions d''Einstein sur les atomes.'
    perrin_nobel: '1926 : Jean Perrin reçoit le prix Nobel de physique pour ses travaux sur la structure discontinue de la matière.'
  boole_ballintemple:
    lecture: Le 24 novembre 1864, Boole enseigna au Queen’s College de Cork.
    death: Le 8 décembre 1864, Boole mourut à son domicile de Ballintemple.
    supplement: En novembre 1865, la préface d’Isaac Todhunter indiquait qui avait recalculé le tableau et pourquoi.
  bose_calcutta:
    salary_wait: '1885 : Bose commence à enseigner au Presidency College. Il a refusé le salaire inférieur et le conflit a mis environ trois ans à être résolu.'
  buchner_zurich:
    typhus: Büchner tombe malade et a de la fièvre.
    minna: 'Février 1837: Minna Jaeglé arrive à Zurich à la fin de la maladie de Büchner.'
    death: Büchner décède à Zurich, à l'âge de vingt-trois ans.
  cajal_barcelona:
    chair: '1887 : Cajal occupe la chaire d''histologie à l''Université de Barcelone.'
    revista: '1er mai 1888 : Cajal paie le premier numéro de son propre journal ; une soixantaine d’exemplaires, la plupart postés à l’étranger.'
    berlin: 'Octobre 1889 : lors de la réunion de la Société allemande d''anatomie à Berlin, Cajal passe ses lames au microscope pour les plus grands histologues et Kölliker reprend son travail.'
    madrid: '1892 : Cajal quitte Barcelone pour la chaire d''histologie de Madrid.'
    nobel: '1906 : Cajal et Golgi se partagent le prix Nobel pour leurs travaux sur la structure du système nerveux.'
  camille_claudel_paris:
    father: '3 mars 1913 : le père de Camille Claudel décède à Villeneuve-sur-Fère.'
    admission: '10 mars 1913 : Camille Claudel est admise à Ville-Évrard.'
  cantor_halle:
    hunger: La guerre a vidé les garde-manger ; Cantor est malade et à court de nourriture.
    clinic: 'Depuis la clinique, Cantor écrit à nouveau à sa femme : il demande à rentrer à la maison.'
    death: '6 janvier 1918 : Cantor décède à la clinique de Halle.'
  cao_xueqin_beijing:
    early_copy: La collation Jiaxu enregistre un premier texte annoté de L'histoire de la pierre.
    unfinished: Une note marginale ultérieure rappelle la mort de Cao avant la fin du livre. Sa chronologie est contestée.
  caroline_herschel_slough:
    comet_letter: '2 août 1786 : Caroline Herschel envoie les dessins des deux nuits avec son rapport sur la comète.'
  chekhov_badenweiler:
    departure: '3 juin 1904 : Tchekhov, gravement malade, quitte Moscou avec Olga Knipper pour une station thermale allemande.'
    romerbad: '23 juin 1904 : Tchekhov et Olga Knipper se trouvent à l''hôtel Römerbad à Badenweiler, encore fatigués par la route.'
    letter: '25 juin 1904 : depuis la Villa Friederike, Tchekhov envoie à Maria sa nouvelle adresse et lui parle du jardin ensoleillé.'
    sommer: '5 juillet 1904 : Tchekhov écrit à Maria depuis l''hôtel Sommer ; la poste est à côté.'
    steamer: '11 juillet 1904 : dans la chaleur, Tchekhov écrit pour demander quel bateau à vapeur pourrait le ramener, lui et Olga, en Russie par voie maritime.'
    death: '15 juillet 1904 : Anton Tchekhov décède au petit matin à Badenweiler, à l''âge de quarante-quatre ans.'
  copernicus_frombork:
    rheticus: '1539 : Rheticus, un jeune mathématicien de Wittenberg, vient à Frombork et presse Copernic de publier son livre.'
    giese_worry: '8 décembre 1542 : Tiedemann Giese écrit qu''il est profondément inquiet de la santé du vieil homme Copernic.'
    revolutions: "1543\_: à Nuremberg, De revolutionibus est imprimé, avec une adresse non signée au lecteur au recto."
    book_reached: 'Vers le 24 mai : le De revolutionibus imprimé arrive à Frombork. Giese écrira que cela est arrivé le jour de sa mort ; c''est peut-être venu après.'
    death: '24 mai 1543 : Nicolas Copernic meurt à Frombork.'
    giese_letter: '26 juillet : Giese écrit à Rheticus, le remercie pour les deux exemplaires et lui demande de présenter une demande d''édition modifiée au conseil de Nuremberg.'
    autograph: '1999 : l''autographe de De revolutionibus, conservé à la Bibliothèque Jagellonne de Cracovie, entre au registre de la Mémoire du monde.'
    remains: '2008 : une comparaison ADN montre que les restes trouvés sous le sol de la cathédrale de Frombork sont ceux de Copernic.'
  curie_paris:
    april_note: '12 avril 1898 : Marie Curie rapporte à l''Académie des Sciences que la pitchblende émet des rayons plus forts que l''uranium.'
    polonium: '18 juillet 1898 : les Curie annoncent un nouvel élément dans la pitchblende et le nomment polonium, du nom de la Pologne.'
    radium: '26 décembre 1898 : les Curie et Bémont annoncent le radium à l''Académie des Sciences.'
    shed: "1902\_: à partir d'environ une tonne de pitchblende, les Curie ont séparé un dixième de gramme de chlorure de radium."
    pierre_death: '19 avril 1906 : Pierre Curie est tué par un véhicule hippomobile à Paris.'
    death: '4 juillet 1934 : Marie Curie meurt d''une anémie aplasique en Haute-Savoie.'
  dante_ravenna:
    exile: '1302 : Florence condamne Dante à l''exil, puis à mort s''il revient un jour.'
    ravenna: 'Vers 1318 : Dante s''installe à Ravenne, à l''invitation de Guido Novello da Polenta.'
    bologna_letter: 'Vers 1319 : de Bologne, Giovanni del Virgilio envoie à Dante un poème latin, l''incitant à écrire en latin et à venir à Bologne pour le laurier.'
    questio: '20 janvier 1320 : à Vérone, Dante donne une conférence sur la place de l''eau et de la terre sur le globe.'
    death: '14 septembre 1321 : de retour malade d''une ambassade à Venise, Dante meurt à Ravenne.'
    rehabilitation: '16 juin 2008 : le conseil municipal de Florence adopte une motion demandant au maire d''annuler la sentence 1302 de Dante.'
  darwin_galapagos:
    lawson: Sur l'île Charles, le vice-gouverneur Lawson dit qu'il peut dire de quelle île vient une tortue.
    james_island: '8 octobre 1835 : Darwin et un petit groupe débarquent sur l''île James avec une tente, tandis que le Beagle va chercher de l''eau.'
  david_fleay_healesville:
    first_swim: '26 février 1944 : Fleay observe pour la première fois Corrie sortir pour nager.'
    public_debut: 'Mars 1944 : Corrie se cache avant ses débuts publics. Au moment où les gardiens l''ont déterrée, la plupart des visiteurs étaient partis.'
  dickinson_amherst:
    death: "15 mai 1886\_:\_Emily Dickinson décède chez elle à Amherst."
  du_chatelet_luneville:
    luneville: En juillet 1749, Émilie du Châtelet rejoint la cour de Stanislas à Lunéville pour y attendre la naissance de son enfant.
    birth: Le 4 septembre 1749, avant l’aube, Émilie donne naissance à une fille.
    death: Le 10 septembre 1749, Émilie du Châtelet meurt à Lunéville, six jours après la naissance.
    receipt: Le 10 septembre 1749, la Bibliothèque royale de Paris signe un reçu pour trois liasses de son commentaire sur Newton.
    principes: En 1759 paraît sa traduction française complète des Principia, accompagnée de son commentaire.
  du_fu_xiang_river:
    final_journey: L'épitaphe de Yuan Zhen relate la mort de Du Fu loin de chez lui et son enterrement temporaire à Yueyang.
  emily_bronte_haworth:
    death: '19 décembre 1848 : Emily Brontë décède à Haworth.'
  enheduanna_ur:
    expulsion: L’Exaltation d’Inana décrit l’expulsion du temple par l’orateur.
  eratosthenes_alexandria:
    tutor: 'Vers 245 avant JC : Ptolémée III amène Ératosthène à Alexandrie pour enseigner à son fils.'
    librarian: 'Vers 240 avant JC : Ératosthène devient bibliothécaire de la Bibliothèque d''Alexandrie.'
    midsummer: "Midi au milieu de l’été, dans le récit ultérieur de Cléomède\_: pas d’ombre sous le pointeur à Syène\_; à Alexandrie, le Soleil est à un cinquantième de cercle complet du zénith."
    death: 'Vers 194 avant JC : Ératosthène, aveugle dans sa vieillesse, meurt à Alexandrie.'
  euclid_alexandria:
    elements: 'Vers 300 avant JC : à Alexandrie, Euclide écrit les treize livres des Éléments.'
    pappus: 'Vers 320 après JC : Pappus, à Alexandrie, écrit que les Porismes contiennent 171 théorèmes et 38 lemmes.'
    printed: '1482 : Erhard Ratdolt imprime les Éléments à Venise, avec des schémas en marge.'
  fanny_mendelssohn_berlin:
    death: '14 mai 1847 : Fanny Hensel décède à Berlin.'
  faraday_london:
    disc: '28 octobre 1831 : le disque de cuivre produit un courant en tournant.'
  fibonacci_pisa:
    bugia: 'Années 1190 : à Bugia, sur la côte d''Afrique du Nord, le jeune Léonard de Pise apprend à compter avec les neuf personnages indiens.'
    numerals: '1202 : à Pise, Léonard termine le Liber abaci, un livre de comptes avec les neuf chiffres indiens et le zéro.'
    frederick: 'Vers 1225 : la cour de Frédéric II se réunit à Pise et Jean de Palerme pose des problèmes à Léonard.'
    revision: '1228 : Léonard publie un Liber abaci révisé. Les copies qui parviennent aux siècles ultérieurs sont de cette version.'
    salary: '1240 : la République de Pise accorde à Maître Leonardo Bigollo un salaire annuel pour son aide aux comptes de la ville.'
  freud_vienna:
    father: '23 octobre 1896 : Jacob, le père de Freud, décède à Vienne.'
    appearance: '4 novembre 1899 : L''Interprétation des rêves paraît à Vienne, aux éditions Franz Deuticke.'
    imprint: 'Le même jour : l''année imprimée sur sa page de titre est 1900.'
    second_edition: '1909 : paraît la deuxième édition de L''Interprétation des rêves, après que les 600 exemplaires de la première aient mis huit ans à se vendre.'
    professor: '1902 : Freud est nommé professeur extraordinaire à l''Université de Vienne.'
  galen_rome:
    comedy_glossary_lost: '192 : l’incendie détruit le glossaire de Galien des mots de la Vieille Comédie.'
  galois_paris:
    release: '29 avril 1832 : Galois est libéré à Paris, après plus de neuf mois de détention.'
    letter_to_chevalier: '29 mai 1832 : dans la nuit, Galois écrit à son ami Auguste Chevalier, lui exposant son ouvrage et lui demandant d''imprimer la lettre.'
    duel: '30 mai 1832 : au petit matin, Galois est touché au ventre lors d''un duel et laissé là où il est tombé, jusqu''à ce qu''un paysan de passage le retrouve.'
    death: '31 mai 1832 : Évariste Galois décède à l''hôpital Cochin, âgé de vingt ans.'
    burial: '2 juin 1832 : Galois est inhumé dans une fosse commune à Montparnasse.'
    printed: 'Septembre 1832 : Chevalier imprime la lettre dans la Revue encyclopédique.'
    liouville: '1846 : Joseph Liouville publie les articles de Galois dans son journal.'
  gaudi_barcelona:
    accident: '7 juin 1926 : sur la Gran Via, un tramway renverse Gaudí ; pris pour un mendiant, il s''allonge dans la rue pendant que passent les taxis.'
    death: '10 juin 1926 : Antoni Gaudí décède à l''hôpital de Barcelone, à l''âge de soixante-treize ans.'
    burial: '12 juin 1926 : Gaudí est enterré sous l''édifice qu''il a dirigé pendant quarante-trois ans.'
    workshop: '20 juillet 1936 : l''atelier est incendié et la plupart des dessins et modèles de Gaudí sont perdus.'
  great_zimbabwe:
    builders: Dès le XIe siècle, les ancêtres des Shona bâtissent une ville de pierre sur cette colline. La construction dure plus de trois cents ans.
    mauch: '1871 : l''Allemand Karl Mauch atteint les ruines.'
    western_yard_loss: '1915 : les équipes retirent la plupart des plates-formes, bancs et murs en terre de l''enceinte ouest.'
    name: '1980 : un nouveau pays tire son nom de la ville, le Zimbabwe.'
    heritage: "1986\_:\_Le Grand Zimbabwe est inscrit sur la liste du patrimoine mondial."
  gutenberg_mainz:
    loans: Fust a prêté à deux reprises à Gutenberg 800 florins pour la rédaction des livres.
    bible: "1455\_: le livre de 42 lignes est imprimé à Mayence avec des caractères métalliques mobiles."
    lawsuit: '6 novembre 1455 : un notaire constate le procès intenté par Fust contre Gutenberg pour ses emprunts et intérêts.'
    workshop: Après la dispute, Fust et Schöffer reprennent l'imprimerie à Mayence.
  hammurabi_babylon:
    accession: 'Vers 1792 avant JC : Hammurabi devient roi de Babylone.'
    stele: 'Vers 1754 avant JC, à la fin du règne d''Hammurabi : une stèle de basalte sculptée de près de trois cents lois est érigée.'
    death: 'Vers 1750 avant JC : Hammurabi meurt.'
    susa: 'XIIe siècle avant JC : la stèle est transportée à Suse, et plusieurs colonnes de son texte sont grattées.'
    found: '1901 : une expédition française déterre la stèle de Suse, brisée en trois.'
  hargrave_stanwell_park:
    boxkite: '1893 : Hargrave commence à expérimenter les cerfs-volants et fabrique le cerf-volant en boîte.'
    beach: '12 novembre : sur la plage de Stanwell Park, quatre cerfs-volants reliés soulèvent Hargrave du sable, à près de 16 pieds de haut.'
    photo: "12 novembre 1894\_: une photographie montre Hargrave et James Swaine avec l'équipement de cerf-volant à Stanwell Park."
    death: '6 juillet 1915 : Hargrave décède à Sydney, à l''âge de 65 ans.'
  hertz_bonn:
    illness: Hertz donne à nouveau des cours ce trimestre, entre deux opérations au nez et à la gorge.
    mechanics: '3 décembre 1893 : Hertz envoie le manuscrit des Principes de mécanique à l''éditeur.'
    death: '1er janvier 1894 : Heinrich Hertz décède à Bonn.'
  higuchi_ichiyo_tokyo:
    death: '23 novembre 1896 : Higuchi Ichiyō meurt de tuberculose.'
  hildegard_bingen:
    lifted: 'Mars 1179 : fin de la restriction du chant.'
  hipparchus_rhodes:
    commentary: "Fin du IIe siècle avant JC\_: le commentaire d’Hipparque souligne que certaines étoiles décrites ensemble dans le poème familier ne se sont pas levées ensemble."
  hooke_london:
    death: Le 3 mars 1703, Robert Hooke mourut à Londres.
    edition: En 1705, Richard Waller publia les œuvres posthumes de Hooke.
  hua_tuo_xuchang:
    manuscript_lost: Le Sanguozhi rapporte que le geôlier refuse le livre. Hua Tuo le brûle.
    death: Le Sanguozhi enregistre la mort de Hua Tuo à Xu.
  humboldt_chimborazo:
    crevasse: '23 juin 1802 : au-dessous du sommet du Chimborazo, un profond ravin arrête les grimpeurs et ils font demi-tour.'
    sickness: Plus haut, les porteurs s'arrêtent ; les trois continuent, avec des saignements de nez et des vertiges.
  hypatia_alexandria:
    teaching: 'Début 415 : Hypatie enseigne toujours à Alexandrie, et les magistrats de la ville viennent l''entendre.'
    feud: La querelle entre le préfet et une autre faction de la ville s'aggrave et Hypatie s'y retrouve entraînée.
    death: 'Mars 415 : Hypatie est tuée à Alexandrie.'
  ibn_al_nafis_cairo:
    collection: '1288 : Ibn al-Nafis meurt et laisse sa bibliothèque à un hôpital. Seules des parties de sa grande encyclopédie médicale survivent aujourd''hui.'
  ibn_battuta_tangier:
    departure: '2 Rajab 725 (juin 1325) : Ibn Battuta quitte Tanger.'
    return: 'Vers 1354 : après près de trente ans de route, il rentre chez lui et dicte son voyage à Ibn Juzayy.'
  ibn_khaldun_cairo:
    cairo: '1382 : Ibn Khaldun vient au Caire à l''invitation du sultan Barquq.'
    family_release: '1384 : à la demande du sultan, Tunis laisse embarquer sa femme et ses filles pour l''Egypte.'
    qadi: '8 août 1384 : il est nommé grand juge de l''école Maliki.'
    rivals: '1385 : après une dizaine de mois en poste, il quitte ses fonctions de juge sous la pression de ses rivaux.'
    shipwreck: La même année, le navire qui transportait sa femme et ses filles fait naufrage à Alexandrie.
    timur: 'Début 1401 : hors de Damas assiégée, Ibn Khaldun rencontre Timur.'
    death: '17 mars 1406 : Ibn Khaldun meurt au Caire.'
    burial: Il est enterré au cimetière à l'extérieur de Bab al-Nasr.
  ibn_rushd_lucena:
    exile: Ibn Rushd est banni à Lucena. Les comptes enregistrent également une commande de brûlage de livres.
  ibn_sina_hamadan:
    death: '1037 : Ibn Sina meurt à Hamadan.'
  ife_bronzes:
    frobenius: "1910\_:\_Léo Frobenius doit restituer une tête métallique qu'il a obtenue à Ife."
    wunmonije: 'Janvier 1938 : en creusant les fondations dans l''enceinte de Wunmonije, des constructeurs font apparaître un groupe de têtes.'
    exhibition: 'Juillet 1948 : les moulages d''Ife sont exposés au British Museum.'
    field_plan_gap: Après que la plupart des tranchées aient été remblayées, les archéologues ultérieurs n'avaient plus de plan complet des premières fouilles et ont dû en reconstruire le tracé.
  ino_tadataka_ezo:
    set_out: '11 juin 1800 : Ino Tadataka et l''équipe d''enquête quittent Edo pour Ezo.'
    coast: '1800 : sur Ezo, l''équipe d''arpentage suit la côte sud jusqu''à Nishibetsu.'
    death: '1818 : Décès d''Ino Tadataka. Pendant un moment, personne ne l''annonce, le travail sur les cartes peut donc continuer.'
    map: '1821 : Takahashi Kageyasu et les autres terminent les cartes des côtes du Grand Japon.'
  jianzhen_nara:
    eiei: 'Duanzhou : Eiei, venu à Yangzhou pour demander à Jianzhen de passer, meurt de sa maladie.'
    eyes: Lors du voyage vers le nord, Jianzhen perd la vue.
  kafka_kierling:
    larynx: 'Mars 1924 : Kafka commence à avoir du mal à avaler ; la tuberculose a atteint son larynx.'
    kierling: '19 avril 1924 : Kafka et Dora Diamant viennent au sanatorium Hoffmann de Kierling ; il parle sur des bouts de papier.'
    klopstock: 'Vers le 6 mai 1924 : l''étudiant en médecine Robert Klopstock vient à Kierling pour aider aux soins infirmiers.'
    last_proofs: '2 juin 1924 : Kafka corrige toujours les épreuves de A Hunger Artist.'
    death: '3 juin 1924 : Franz Kafka décède à Kierling, à l''âge de quarante ans.'
    burial: '11 juin 1924 : Kafka est enterré à Prague.'
    four_stories: 'Fin août 1924 : Un artiste de la faim, quatre histoires, paraît à Berlin.'
  keats_rome:
    arrival: '15 novembre : Keats et Severn atteignent Rome et prennent des chambres au deuxième étage du 26 Piazza di Spagna, près de la Place d''Espagne.'
    rome_letter: '30 novembre : Keats écrit à Charles Brown qu''écrire une lettre et lui dire au revoir est devenu difficile.'
    death: '23 février, tard dans la nuit : Keats décède. Severn est avec lui.'
    register: Dans le registre funéraire, le jour est inscrit le 24 février.
