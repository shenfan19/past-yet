    ship: Le navire à destination de Délos a appareillé la veille du procès, et tant qu'il n'est pas rentré chez lui, personne ne peut être mis à mort ; Socrate est emmené en prison pour attendre.
    verses: En prison, Socrate commence à mettre en vers les fables d'Ésope, comme le lui dit un rêve qui revient sans cesse.
    crito: Un matin très tôt, Criton arrive à la prison, lui dit que le navire sera bientôt là et le presse de s'échapper. Il ne le fera pas.
    plato_ill: Le dernier jour, ses amis se réunissent à la prison aux premières lueurs du jour. Platon est malade et ne vient pas.
    death: Vers le soir, Socrate boit de la ciguë en prison et meurt.
