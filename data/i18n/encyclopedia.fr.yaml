    fall: 'Samarkand : Ulugh Beg abandonne son règne et on lui demande de quitter la ville.'
    death: 'Fin octobre 1449 : Ulugh Beg est tué sur la route près de Samarkand.'
    rediscovered: '1908 : Les archéologues russes retrouvent l''arc sous la colline.'
  van_gogh_auvers:
    arrival: '20 mai 1890 : Vincent van Gogh vient à Auvers et prend une chambre à l''Auberge Ravoux.'
    work: Il peint presque un tableau par jour.
    auvers_letter: 'Vers le 10 juillet : il écrit à Théo et Jo de vastes champs de blé sous un ciel trouble.'
    shot: '27 juillet : Van Gogh se tire une balle dans la poitrine.'
    death: '29 juillet : décès de Vincent van Gogh. Son frère Théo est avec lui.'
  vermeer_delft:
    war: '1672 : guerre avec la France et l''Angleterre, et le commerce de l''art de la République s''effondre.'
    loan: 'Juillet 1675 : Vermeer se rend à Amsterdam pour emprunter mille florins.'
    burial: '15 décembre 1675 : Johannes Vermeer est enterré à Delft, âgé de quarante-trois ans.'
    baker: 'Début 1676 : Catharina donne deux de ses tableaux au boulanger contre 617 florins de pain.'
    art_of_painting: '24 février 1676 : Catharina transmet l''Art de la peinture à sa mère Maria Thins.'
    inventory: '29 février 1676 : un notaire inventorie la maison de l''Oude Langendijk.'
    petition: 'Avril 1676 : Catharina demande à la Haute Cour de la libérer de ses dettes.'
    trustee: '30 septembre 1676 : Antonie van Leeuwenhoek est nommée fiduciaire de la succession.'
    rediscovery: '1866 : Thoré-Bürger publie un catalogue des œuvres de Vermeer.'
  vesalius_padua:
    complaint: '13 juin 1546 : Vésale écrit depuis Ratisbonne et critique les distorsions qu''il voit dans les figures copiées.'
  wallace_ternate:
    fever: 'Février 1858 : aux Moluques, Wallace attend que la fièvre baisse et prend des notes pour son journal.'
    signed: 'Février 1858 : l''essai est daté de Ternate.'
    dorey_departure: "25 mars 1858\_:\_Wallace et son groupe, dont Jumaat, naviguent de Ternate pour Dorey."
    sent: L'essai laisse Ternate sur le bateau à vapeur. La question de savoir s'il s'agit du bateau de mars ou d'avril est encore controversée.
    received: '18 juin : dans le Kent, l''essai parvient à Charles Darwin à Down House.'
    read: '1er juillet : à la Linnean Society de Londres, les deux articles sont lus. Aucun des deux auteurs n’est présent dans la pièce. Wallace n''en entend parler que plus tard.'
    jumaat_death: '26 juin 1858 : Jumaat meurt à Dorey.'
    printed: '20 août 1858 : l''article commun est imprimé dans les Actes de la Linnean Society.'
  wright_kitty_hawk:
    camp: 'Septembre : les frères reviennent à leur camp près de Kitty Hawk. Le procès est sans cesse reporté à cause de problèmes avec la machine.'
    first_try: '14 décembre : Wilbur remporte le tirage au sort et commence le premier. La tentative échoue.'
    first_flight: '17 décembre, matin : Orville vole 120 pieds en 12 secondes. John T. Daniels de la station de sauvetage appuie sur le déclencheur.'
    fourth_flight: 'Le quatrième vol de la journée est le plus long : 852 pieds en 59 secondes.'
    flyer_damage: Une rafale renverse le Flyer. L'engin est gravement endommagé et ne vole plus jamais.
    telegram: 'Après-midi : les frères marchent quatre miles jusqu''à Kitty Hawk et télégraphient à leur père. Le message indique que le vol le plus long a duré 57 secondes.'
    dayton: Vers cinq heures et demie, à Dayton, leur père Milton Wright reçoit le télégramme. Les journaux de Dayton impriment à peine un mot.
  xu_xiake_lijiang:
    diary: Le sixième jour du deuxième mois lunaire de 1639, Xu séjourna à Jietuo Lin pour rassembler des livres.
    departure: Le huitième jour du deuxième mois lunaire de 1639, Xu descendit de Jietuo Lin sous la pluie.
    commission: Le neuvième jour du deuxième mois lunaire de 1639, une lettre demanda à nouveau à Xu de compiler l'annuaire géographique du mont Ji.
  zeami_sado:
    island: 'Sado : Zeami, soixante-dix ans passés, vit son exil sur l''île.'
