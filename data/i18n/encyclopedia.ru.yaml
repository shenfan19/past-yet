    dayton: Около половины шестого в Дейтоне телеграмму получает их отец Милтон Райт. Газеты Дейтона почти не печатают ни слова.
  xu_xiake_lijiang:
    diary: В шестой день второго лунного месяца 1639 года Сюй остановился в Цзетуо Линь, чтобы сверить книги.
    departure: В восьмой день второго лунного месяца 1639 года Сюй под дождем поехал из Цзетуо Линь.
    commission: В девятый день второго лунного месяца 1639 года Сюй снова получил письмо с просьбой составить «Справочник горы Цзи».
  zeami_sado:
    island: 'Садо: Зеами, которому за семьдесят, доживает свое изгнание на острове.'
