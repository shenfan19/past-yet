eras:
  broad_street_1854:
    name: 伦敦宽街 1854
    short: 宽街
    place_name: 伦敦苏荷区宽街
    tags: [medical, infection, cholera, c19, london, history]
    event_titles: {door_block: 被拒之门外, time_strain: 时间错位, pocket: 顺手牵羊}
    blurb: 霍乱，一台水泵，一位还没被人听进去的医生。近，成本低，卫生知识和药物的效果清楚。
    handle_label: 泵柄拆除
    protagonist: 约翰·斯诺
    protagonist_role: 医生，三年前就在说霍乱是喝水喝出来的
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - {text: "1854 年 8 月 31 日夜间，伦敦苏荷区宽街一带暴发霍乱。", check: true}
        - {text: "当时流行的解释是瘴气，也就是脏空气。", check: true}
        - {text: "斯诺在 1849 年已经提出霍乱经水传播，多数同行不接受。", check: true}
        - {text: "9 月 8 日，宽街水泵的手柄被拆走。", check: true}
        - {text: "拆泵柄时，疫情已经在下降，很多居民早已离开。", check: true}
      regret:
        - 救得了今天的，救不了明天的。主时间线上，泵柄拆在第八天。
        - 数据与地图比药更重要，但让人相信数据需要时间。
    events:
      door_block_stubborn: "邻居拦在门口，说这是瘴气，不能让外人碰病人。{staff}固执，没有退让，被赶出一户，丢了 {d.ors_stock:i} 包补液。"
      door_block_stubborn_empty: "邻居拦在门口，说这是瘴气，不能让外人碰病人。{staff}固执，没有退让，被赶了出来。"
      door_block_insist_empty: "邻居拦在门口，说这是瘴气。{staff}站在门口把话说完，被推了出来。"
      door_block_insist: "邻居拦在门口，说这是瘴气。{staff}站在门口把话说完，被推了出来，丢了 {d.ors_stock:i} 包补液。"
      door_block_appeal: "邻居拦在门口，说这是瘴气。{staff}没有硬闯，转身去找斯诺，请他出面说句话。"
      door_block_yield: "邻居拦在门口，说这是瘴气。{staff}退了一步，没有吵，浪费了半天。"
      time_strain: "{date}，{staff}听见钟声错了半拍。这条分支离史实越来越远，人明显更累了。"
      pocket: "{date}，{staff}见一件小东西没人看管，顺手揣进了口袋。有街坊看见了，看他的眼神变了。"
    milestones:
      first_treat: "{date}，{staff}配好了第一杯补液。一个人开始能说话。"
      first_protect: "{date}，{staff}把第一批氯片分到了愿意听的几户，教他们把水烧开或者加药。"
      met_snow: "{date}，{staff}在街口见到了斯诺。他听得很认真，但一直在问：证据在哪里。"
      snow_trusts: "{date}，斯诺开始把{staff}当作自己人，愿意把他挨家挨户记下的名单拿出来对照。"
      snow_convinced: "{date}，斯诺不再只是怀疑水。他有了足够的名单，也相信了这个陌生人说的话。"
      board_moves: "{date}，教区委员会的人开始松口，说也许可以先停一下水泵。"
      handle_off_history: "{date}，水泵手柄被拆走。主时间线不变。"
      handle_off_early: "{date}，水泵手柄比史实早 {advance_days:1} 天被拆走。主时间线不变，只有这条分支里是这样。"
      trust_won: "{date}，街角的人不再把{staff}拦在门外，有人主动来敲门。"
      exhausted: "{date}，{staff}累得手在抖，被迫停下来休息。"
      outbreak_fades: "{date}，病人数降到了个位数附近。很多人已经离开了这一带。"
    summary:
      near_death: "{staff}在宽街倒下，被回收符接了回来。保住了命，付出了代价。"
      stay_and_gifts: "{staff}完成了任务，却没有回来。离开时留下一封信，说想多陪陪这里的人。以后会有礼物寄来。"
      gave_up: "{staff}提前放弃，回到了现代。{staff}说，这里不属于自己。"
      legend: "{staff}在宽街留下了传说，比史实早 {advance_days:1} 天，泵柄被拆走。"
      perfect: "{staff}在宽街完成任务，平安回来。主时间线 {base_D:i} 人死亡，这条分支 {D:i} 人。"
      scramble: "{staff}被邻居一次次拦在门外，最后狼狈地逃了回来，带着一个笑话。"
      modest: "{staff}在宽街待了七天，做了力所能及的事，平安回来。"
    quotes:
      near_death: [{trait: kind, text: "我最后还想着，床边的那个人有没有人陪。"}, {text: "我以为我能多撑一会儿。"}]
      stay_and_gifts: [{trait: kind, text: "我记得他们每一个人的名字。我想再待一阵。"}, {text: "这里需要人。"}]
      gave_up: [{trait: homesick, text: "我想回家。就是这样。"}, {text: "我不是做这个的料。"}]
      legend: [{text: "我只是把该告诉他们的告诉了。"}]
      perfect: [{trait: kind, text: "我救得了今天的，救不了明天的。"}, {trait: curious, text: "原来是这样，水真的会带着病走。"}, {text: "该做的做了。"}]
      scramble: [{trait: stubborn, text: "他们早晚会明白。就是晚了点。"}, {text: "下次我想多带点东西。"}]
      modest: [{trait: glib, text: "话我都说了。信不信是他们的事。"}, {text: "如果多带一样东西，也许能多救一户人家。"}]
    hints:
      lost_ors: 补液被丢了很多，下一次可以让员工让步，或者多带一点。
      unused_protect: 氯片没用完。受限于邻居的信任，不是氯片不够，让员工先去帮病人建立信任。
      unused_ors: 补液没用完。可能是员工把时间花在别处，或者病人没让进门。
      ally_gap: 斯诺的证据还不够。手册能帮他，前提是员工愿意花时间陪他。
      none: 换一项配置再派一趟，同一个种子，对照起来最清楚。

  vienna_1847:
    name: 维也纳总医院 1847
    short: 产科诊所
    place_name: 维也纳总医院产科病房
    tags: [medical, infection, obstetrics, c19, vienna, history]
    event_titles: {door_block: 被前辈挡回, time_strain: 时间错位, pocket: 顺手牵羊}
    blurb: 产褥热，两间产科病房，一位把死亡数字对在一起的年轻医生。要说服的不是病，是一屋子不肯洗手的前辈。
    handle_label: 洗手规定开始
    protagonist: 伊格纳茨·森梅尔维斯
    protagonist_role: 产科助理医生，刚刚发现解剖室和产房的死亡有关
    stay: 停留二十一天
    items:
      chlorine_tablet: {name: 氯化石灰片, desc: 一片能配出一盆洗手液，够几十次检查前用。便宜，但要有人肯洗。}
      handbook: {name: 现代护理手册, desc: 提高照料产妇的手艺。也是递给森梅尔维斯的见面礼。}
      recall_charm: {name: 回收符, desc: 倒下时把人接回。没带的话，装备全丢。}
    strategies:
      focus:
        balanced: {name: 均衡, desc: 有产妇发热就照料，有机会就教洗手，有空见森梅尔维斯。}
        cure: {name: 先照料产妇, desc: 床边照料优先，少去劝人洗手。}
        prevent: {name: 先教洗手, desc: 在病房里一个个劝，分发洗手液。}
        ally: {name: 与森梅尔维斯合作, desc: 多花时间帮他整理数字，陪他去见该去的人。}
      on_block:
        yield: {name: 让步, desc: 被前辈挡回来就算了。}
        insist: {name: 坚持, desc: 站在病房门口把话说完，洗手液被没收也不退。}
        appeal: {name: 求助, desc: 转头去找森梅尔维斯，请他出面。}
    encyclopedia:
      history:
        - {text: "1847 年，维也纳总医院第一产科病房的产妇死亡率明显高于第二产科病房。", check: true}
        - {text: "第一病房由医生和医学生接生，他们常常刚做完尸体解剖。", check: true}
        - {text: "森梅尔维斯在 1847 年 5 月中旬要求医生和学生用含氯石灰溶液洗手后再检查产妇。", check: true}
        - {text: "规定实行后，死亡率在几个月内明显下降。", check: true}
        - {text: "当时的主流同行并没有接受他的解释，细菌致病论还没有建立。", check: true}
      regret:
        - 数字摆在眼前，也要等有权力的人点头。主时间线上，洗手规定在五月中旬才到。
        - 他一生都没有等到同行真正接受他。
    events:
      door_block_stubborn: "一位前辈医生说，没有人需要一个外人来教怎么检查产妇。{staff}固执，没有退让，洗手液被没收了 {d.wash_supply:i} 份。"
      door_block_stubborn_empty: "一位前辈医生说，没有人需要一个外人来教怎么检查产妇。{staff}固执，没有退让，被请出了病房。"
      door_block_insist: "一位前辈医生说，没有人需要外人来教怎么检查产妇。{staff}站在病房门口把话说完，洗手液被没收了 {d.wash_supply:i} 份。"
