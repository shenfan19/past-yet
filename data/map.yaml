# World map and time axis for the dispatch page. Coastlines are in data/world_land.json, Natural Earth 110m land, public domain.
# The map is drawn in degrees, x = lon - lon_min, y = lat_max - lat.
view: {lon_min: -180, lon_max: 180, lat_min: -58, lat_max: 84, grid_step: 30}
zoom: {min: 1, max: 40, step: 1.25, drag_px: 4, label_z: 6}
axis: {from: -5000, to: 2000, tick_count: 6, ticks: [-4000, -3000, -2000, -1000, 1, 500, 1000, 1500, 1800, 2000], min_ticks: 3}
group_radius: 6
calendar: {ad_prefix_below: 1000}
