# Antiques are anchors. An antique points at one place and time, owning it reveals that place on the map. Antiques are never consumed.
# They can be sold for sell, and locked so they cannot be sold by mistake. Sending a dispatch locks its anchor.
# kind: key = a historical turning point, daily = an ordinary place with no history to change, story = a small private story.
# playable: false means the content is not built yet.
antiques:
  pump_rust: {era: broad_street_1854, kind: key, price: 0, sell: 40, start_owned: true, playable: true, tags: [medical, history, key]}
  clinic_bell: {era: vienna_1847, kind: key, price: 150, sell: 75, start_owned: false, playable: true, tags: [medical, history, key]}
  royal_comb: {era: null, kind: story, price: 220, sell: 110, start_owned: false, playable: false, tags: [story, romance]}
