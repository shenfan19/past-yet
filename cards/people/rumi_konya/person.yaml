    text:
      en:
        name: 'The voice at the opening'
        place: "Konya"
        figure: "Rumi"
        story: 'The opening of Rumi’s Masnavi asks the listener to hear a reed speaking of separation. Konya’s Mevlana Museum holds a six-book manuscript copied in 1278, after Rumi’s death in 1273.'
        relic: 'A reader’s opening leaf'
        relic_desc: 'An imagined reading sheet marking the opening of a verse.'
        points:
          p1: 'Put the pages of the Masnavi that Rumi checked in book order in Konya, ready for later copying'
          p2: 'Separate loose pages awaiting review from complete sequences. Have the scribe mark the order at the beginning of each book'
          p3: 'Arrange for two copyists in Konya to keep checked copies separately. Leave readers a way to consult both'
        points_fail:
          p1: 'Different reading copies are mixed. Later the copyists cannot recover a set checked by Rumi, and the office recalls the employee.'
          p2: 'An opening circulates by itself. A later scribe cannot tell which book it introduces.'
          p3: 'After Rumi dies a reader can borrow only one set. To verify an earlier reading, they have to trace a different circle of readers.'
        shift:
          p1:
            was: 'Konya holds a Masnavi manuscript dated 1278. Collection research traces it to a copy that Rumi checked.'
          p2:
            was: 'Surviving manuscripts divide the poem into six books, usually with separate openings.'
            now: 'The first page identifies its book. A scribe copying one passage can still locate it in the longer text.'
          p3:
            was: 'Rumi died in Konya in 1273. Early related copies and manuscripts from other textual traditions survive.'
            now: 'A second checked copy remains with another reader. When a different wording appears, it can be compared against both copies and the earlier marks.'
            who: rumi_konya
            bio: 'Rumi’s work passed through reading, copying and a number of manuscript traditions. Early Konya copies show how it continued to circulate after his death.'
        vignettes:
          reed: 'Narin has performed both parts with the same voice. You ask where the reed first speaks as itself. She lets the next line begin after a breath. When Hasan listens with his eyes shut, he can hear the moment the reed takes over.'
          hand: 'Hasan has to leave the reading bench, and Narin reaches for his page while he is still speaking. You hold its corner until he completes the couplet and can put his finger on the next line. She begins there when it is her turn. The passage has passed between them without a gap.'
          manuscript: 'You have seen the later six-book manuscript. Narin asks if it will show where Hasan took a breath. You point to the line they practised and let her decide where to pause. The door closes before they read the next couplet aloud.'
      zh:
        name: '开篇是谁在说'
        place: "科尼亚"
        figure: "鲁米"
        story: '鲁米《玛斯纳维》开篇请人听芦管诉说离别。科尼亚梅夫拉纳博物馆藏有六卷全本，抄于1278年，晚于鲁米1273年去世。'
        relic: '一张起句练习稿'
        relic_desc: '读书页，在起句处做了记号。'
        points:
          p1: '在科尼亚把鲁米已经核过的《玛斯纳维》抄页按卷收好，留作后来重抄的底稿'
          p2: '将等人校读的散页与已经收齐的长篇分开，请誊写者给卷首留次序'
          p3: '请两名留在科尼亚的抄写人让核过的本子各有存处，并给以后想参读另一套的人写下借抄依据'
        points_fail:
          p1: '抄写人的数份读本混在一起，后来拿不出一套可以查回鲁米亲自核过的稿子，事务所召回员工。'
          p2: '开篇抄页单独传出，后来抄写人不知道它接的是哪一卷。'
          p3: '鲁米去世后，较晚的读者只有借来的其中一套，想核早期读法便得另找一批人。'
        shift:
          p1:
            was: '科尼亚保存一份 1278 年的《玛斯纳维》手稿。馆藏研究认为它依据鲁米本人核过的一份抄本。'
          p2:
            was: '存世写本将诗分为六卷，每卷通常另有卷首。'
            now: '抄本从题页查得到对应的卷。誊写者即使只抄一段，也能把它放回合适的位置。'
          p3:
            was: '鲁米于 1273 年在科尼亚去世。早期同源抄本与其他文本支系均有流传。'
            now: '一份核定抄本留在另一位读者手里。将来出现异文时，读者可以比两本哪里不同，并从较早的记号追问来处。'
            who: rumi_konya
            bio: '鲁米的作品经朗读、誊写和不同手稿转达。科尼亚留存的早期抄本记录了作品能够怎样在作者身后继续传阅。'
        vignettes:
          reed: '娜琳把两处用同一种声音读过去。你问，芦管从哪里开始用自己的口吻说话。她换过一口气，才念下一句。哈桑闭着眼，也听得出哪里换成了芦管。'
          hand: '哈桑得离开读书凳，还没念完，娜琳手已够到那页。你按住纸角，等他把一联念完，手指落到下一行。轮到她时，她从那儿起句，一段诗从一人手里递到了另一人。'
          manuscript: '你见过后来的六卷抄本。娜琳问，上面能不能看出哈桑在哪里换气。你指着刚练过的那行，让她自己定在哪里停。门关上时，他们还没念到下一联。'
text:
  en:
    name: Rumi
    text: Persian poet and teacher, 1207 to 1273, who lived in Konya. His Masnavi and lyric poems are among the most read works of Sufi literature, and followers founded the Mevlevi order.
  zh:
    name: 鲁米
    text: 波斯诗人与导师，1207 年生，1273 年去世，住在科尼亚。他的《玛斯纳维》和抒情诗是苏菲文学中读者最多的作品之一，追随者创立了梅芙莱维教团。
hook: {en: 'The reed speaks before the singer does.', zh: '先开口的是芦管，还是歌者？'}
