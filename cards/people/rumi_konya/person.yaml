    text:
      en:
        name: 'The voice at the opening'
        place: "Konya"
        figure: "Rumi"
        story: 'The opening of Rumi’s Masnavi asks the listener to hear a reed speaking of separation. Konya’s Mevlana Museum holds a six-book manuscript copied in 1278, after Rumi’s death in 1273.'
        story_prose:
          opening:
            - 'Konya, 1273. Rumi’s long poem came to be organised in six books. A copy made five years later still survives.'
            - 'In history, Rumi died that December. The manuscript tells later readers how the poem was ordered. In this branch the pages of two reading copies are still on the same table.'
            - 'Someone who can make sense of the order of loose leaves will be useful. Someone also needs to listen when an ill man says whom he wants to see, and give the two a little quiet.'
          points:
            p2: '{staff} asks Rumi whom he wants to see first, brings the visitor in and asks the others by the door to wait. The visitor sits where Rumi can hear him. For a while neither talks. The visitor sets down the paper he had been holding. Rumi sees this and moves the cup a little closer to him.'
            p1: 'When the borrower comes, {staff} separates the two sets on the table and follows each last line to the next leaf. The borrower sits to help. When a line breaks off, his reading does too. He finds the next leaf and slides it an inch forward. This time the borrowed bundle follows from the first passage to the last.'
          outcomes:
            all: 'Later the borrower leaves the two copies in their separate places. When the door closes, those going out have their hands free, and the reader stays a little longer.'
            p2: 'The people at the door make a little room. The visitor sits a long time. Nobody hurries him out.'
            p1: 'At the door, the borrower turns back a leaf before carrying the bundle out against his coat.'
          none: 'Two sets of pages remain on the table. The cup by the window stands untouched for a long while.'
          not_admitted: '{staff} never gets inside. The borrower waits by the bench with his hands empty.'
          desync: 'One copy is borrowed with a section missing. When the agency recalls {staff}, the other is still open on the table.'
          excerpts:
            p2: 'The visitor sets down the paper he had been holding. Rumi sees this and moves the cup a little closer to him.'
            p1: 'He finds the next leaf and slides it an inch forward. This time the borrowed bundle follows from the first passage to the last.'
        relic: 'A reader’s opening leaf'
        relic_desc: 'An imagined reading sheet marking the opening of a verse.'
        points:
          p1: 'In Konya, check the order of the sheets in a copy of the Masnavi before lending it to another reader'
          p2: 'When Rumi falls ill, ask whom he wants to see and keep the room quiet when they sit down together'
        points_fail:
          p1: 'Two reading copies are mixed. One bundle leaves with a section in the wrong place, and the office recalls {staff} when the record falls out of sync.'
          p2: 'Another visitor is at the door before the person Rumi asked for can sit down.'
        shift:
          p1:
            was: 'Konya holds a six-book manuscript of the Masnavi dated 1278, five years after Rumi’s death.'
          p2:
            was: 'Rumi died in Konya in December 1273. A later account depicts his companions gathered at his bedside.'
            now: 'In this branch {staff} sets a chair for the person Rumi asks to see. The conversation can wait until Rumi is ready to speak.'
        vignettes:
          reed: 'Narin has performed both parts with the same voice. You ask where the reed first speaks as itself. She lets the next line begin after a breath. When Hasan listens with his eyes shut, he can hear the moment the reed takes over.'
          hand: 'Hasan has to leave the reading bench, and Narin reaches for his page while he is still speaking. You hold its corner until he completes the couplet and can put his finger on the next line. She begins there when it is her turn. The passage has passed between them without a gap.'
          manuscript: 'You have seen the later six-book manuscript. Narin asks if it will show where Hasan took a breath. You point to the line they practised and let her decide where to pause. The door closes before they read the next couplet aloud.'
      zh:
        name: '开篇是谁在说'
        place: "科尼亚"
        figure: "鲁米"
        story: '鲁米《玛斯纳维》开篇请人听芦管诉说离别。科尼亚梅夫拉纳博物馆藏有六卷全本，抄于1278年，晚于鲁米1273年去世。'
        story_prose:
          opening:
            - '1273 年，科尼亚。鲁米写下的长诗后来分为六卷，五年后抄成的一部写本今天仍存。'
            - '史实里，鲁米在这一年十二月去世。写本告诉后来的读者长诗是怎么分卷的。在这条分支里，两份借读的抄页还搁在一起。'
            - '这趟用得上能辨清抄页顺序的人。也需要有人先听清病中的人想要见谁，再替他守住一小段安静。'
          points:
            p2: '{staff}问鲁米想先见谁，把来人请进来，再让门边等候的人稍候一会儿。来客坐在他听得见的地方，有一阵子两个人没有说话。 来客把自己原先捏在手里的纸搁了下来。鲁米看见了，把杯子往他那边推了一点。'
            p1: '{staff}等借书人回来认领时，先把两份抄页在桌上分开，顺着每份露出来的末行去找下一页。来人也坐下来帮忙，读到断的地方时把声音停住。 他找到接下来的那一页，往前放了一寸。借出去的那一束，这一次从头到尾都能接上。'
          outcomes:
            all: '后来借书的人把两份抄页各放在该放的位置。门关上时，出去的人手里还是空的，借书的先留在屋里。'
            p2: '门外的人往后让出一点地方。那位来客坐了很久，走的时候没人催他。'
            p1: '借书人到门边又回头翻了一页，才把一束贴在衣上带出去。'
          none: '两份纸还在同一张桌上。窗边那只杯隔了很久也没人动。'
          not_admitted: '{staff}没等到能进屋的时候。借书人站在长凳边，手里空着。'
          desync: '一份抄本漏了一节便被借走。事务所召回{staff}时，另一份还在桌上摊开着。'
          excerpts:
            p2: '来客把自己原先捏在手里的纸搁了下来。鲁米看见了，把杯子往他那边推了一点。'
            p1: '他找到接下来的那一页，往前放了一寸。借出去的那一束，这一次从头到尾都能接上。'
        relic: '一张起句练习稿'
        relic_desc: '读书页，在起句处做了记号。'
        points:
          p1: '在科尼亚对好一份《玛斯纳维》抄页的卷次，再把它交给下一位借读的人'
          p2: '鲁米病中，问他想见谁，等那个人进屋坐下，让屋里先安静一会儿'
        points_fail:
          p1: '两份抄本混了页，有一束漏排了一节就被借走。记录脱节，事务所召回{staff}。'
          p2: '鲁米想见的人还没坐下，门外又有人来访。'
        shift:
          p1:
            was: '科尼亚保存一份 1278 年的《玛斯纳维》全六卷手稿，抄于鲁米去世五年后。'
          p2:
            was: '1273 年 12 月，鲁米在科尼亚去世。后出的传记描写有同伴聚到他的病榻前。'
            now: '这条分支里，{staff}替鲁米想见的人搬了把椅子。两人可以先坐一会儿，等鲁米有力气了再开口。'
        vignettes:
          reed: '娜琳把两处用同一种声音读过去。你问，芦管从哪里开始用自己的口吻说话。她换过一口气，才念下一句。哈桑闭着眼，也听得出哪里换成了芦管。'
          hand: '哈桑得离开读书凳，还没念完，娜琳手已够到那页。你按住纸角，等他把一联念完，手指落到下一行。轮到她时，她从那儿起句，一段诗从一人手里递到了另一人。'
          manuscript: '你见过后来的六卷抄本。娜琳问，上面能不能看出哈桑在哪里换气。你指着刚练过的那行，让她自己定在哪里停。门关上时，他们还没念到下一联。'
text:
  en:
    name: Rumi
    text: Persian poet and teacher, 1207 to 1273, who lived in Konya. His Masnavi and lyric poems are among the most read works of Sufi literature, and followers founded the Mevlevi order.
  zh:
    name: 鲁米
    text: 波斯诗人与导师，1207 年生，1273 年去世，住在科尼亚。他的《玛斯纳维》和抒情诗是苏菲文学中读者最多的作品之一，追随者创立了梅芙莱维教团。
hook: {en: 'The reed speaks before the singer does.', zh: '先开口的是芦管，还是歌者？'}
