    invented: true
    text: {en: 'A fictional reader trying to distinguish the opening voices.', zh: '虚构读者娜琳，要读出开头的不同声音。'}
  hasan:
    invented: true
    text: {en: 'A fictional reader who has to leave before the next couplet.', zh: '虚构读者哈桑，下一联到来前得离开。'}
