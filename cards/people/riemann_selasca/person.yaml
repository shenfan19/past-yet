    text:
      en:
        name: "The last paper"
        place: "Selasca"
        figure: "Bernhard Riemann"
        story: 'Riemann''s 1854 lecture manuscript examines the assumptions underlying geometry and how distances can be defined.'
        relic: "A page of notes"
        relic_desc: "A page of unfinished formulas in a small hand."
        points:
          p1: 'As his strength fails at Selasca, take down what he dictates and keep the pages in order, helping him carry his last paper further than history left it'
          p2: 'Cure the tuberculosis that is killing him, and save Riemann'
        points_fail:
          p1: 'The last paper stopped where history left it.'
          p2: 'He died at Selasca on 20 July as history has it, and in this branch too he could not be kept.'
        shift:
          p1:
            was: 'The Royal Society obituary and Dedekind''s account say that the day before he died, resting under a fig tree at Selasca, Riemann was still working on his last paper, which was left unfinished.'
            now: 'The last paper went several pages further in his own words, and it was printed with them.'
          p2:
            was: 'Riemann died of tuberculosis at Selasca on Lake Maggiore on 20 July 1866, aged 39.'
            now: '{staff} brought the cure for the disease that had worn him down since 1862. That autumn he went back north and taught again in Göttingen.'
            who: riemann_selasca
            bio: 'In this line Riemann recovered from tuberculosis in the summer of 1866. He went home to Göttingen and worked on for many years.'
        vignettes:
          surface: 'The reader stretches a strip across two points and lets it leave the surface in between. You press a second strip down against the curve and ask which journey each one measures.'
          assumption: 'The reader says the distance is obvious. You ask how they decided which paths to allow. They add that choice above the drawing and begin measuring again.'
          paper: 'You help the reader keep the starting points marked when the practice sheet bends. They can now compare their two readings without having to find the points again.'
      zh:
        name: "最后一篇论文"
        place: "塞拉斯卡"
        figure: "伯恩哈德·黎曼"
        story: '黎曼 1854 年的讲稿讨论几何的基本假设及距离如何定义。'
        relic: "一页笔记"
        relic_desc: "一页写着没完成公式的纸，字很小。"
        points:
          p1: '他在塞拉斯卡力气一天天衰下去时，替他记下口述、理好稿页，帮他把最后那篇论文往下写一段'
          p2: '治好拖垮他的肺结核，救下黎曼'
        points_fail:
          p1: '最后那篇论文照史实停在原处。'
          p2: '他照史实在 7 月 20 日死在塞拉斯卡，这条分支里也没能留住他。'
        shift:
          p1:
            was: '皇家学会悼文和戴德金的记述都说，去世前一天他在塞拉斯卡的无花果树下休息，仍在写最后那篇论文，论文没有写完。'
            now: '最后那篇论文用他自己的话多写了几页，后来连同这几页一起印出。'
          p2:
            was: '1866 年 7 月 20 日，黎曼在马焦雷湖畔的塞拉斯卡死于肺结核，三十九岁。'
            now: '{staff}带去的药治好了从 1862 年起拖着他的病。那年秋天他回到北边，又在哥廷根上起了课。'
            who: riemann_selasca
            bio: '这条时间线里，黎曼在 1866 年夏天治好了肺结核。他回到哥廷根，又工作了许多年。'
        vignettes:
          surface: '读者把纸带从一点拉到另一点，中间却离开了曲面。你把另一条沿弧面按下去，请他分清两条量的是哪种走法。'
          assumption: '读者说距离一看就知道。你问哪些走法算数，是怎么定的。他把这个条件添在图上方，重新开始量。'
          paper: '练习纸弯起来时，你帮读者留住起讫两点的记号。现在比较两次读数时，不必重新找点。'
text:
  en:
    name: Bernhard Riemann
    text: German mathematician, 1826 to 1866. His work on geometry of curved spaces and on the distribution of primes opened major fields, and the Riemann hypothesis remains unsolved. He died of tuberculosis at Selasca on Lake Maggiore.
  zh:
    name: 伯恩哈德·黎曼
    text: 德国数学家，1826 年生，1866 年去世。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，黎曼猜想至今未解。他在马焦雷湖畔的塞拉斯卡死于肺结核。
