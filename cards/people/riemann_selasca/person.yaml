  regret_choice: '派带纳米医疗箱的医生去，他秋天回了哥廷根；派会记口述的讲师去，论文多写了几页，第二天他照旧去世。两样都要，得派既懂医又能理稿的人，或者带齐东西。'
  bookend: '从 1854 年那场讲几何假设的讲演开始，以 1876 年全集出版收尾，中间是无花果树下的最后一天。'
  share_line: '去世前一天，他还在无花果树下写论文。'
