facts:
  geometry_lecture:
    date: '1854-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_selasca_primary, riemann_mactutor]
    text:
      en: 'On 10 June 1854 Riemann gave his habilitation lecture at Göttingen, on the hypotheses that lie at the foundations of geometry, which examines how distances can be defined.'
      zh: '1854 年 6 月 10 日，黎曼在哥廷根作任教资格讲演，题为论几何基础中的假设，讨论距离可以怎样定义。'
    line:
      en: '10 June 1854: in Göttingen Riemann lectures on the hypotheses at the foundations of geometry.'
      zh: '1854 年 6 月 10 日，黎曼在哥廷根讲论几何基础中的假设。'
      zh-Hant: '1854 年 6 月 10 日，黎曼在哥廷根講論幾何基礎中的假設。'
      fr: '10 juin 1854 : à Göttingen, Riemann donne une conférence sur les hypothèses à la base de la géométrie.'
      es: '10 de junio de 1854: en Gotinga, Riemann da una conferencia sobre las hipótesis sobre los fundamentos de la geometría.'
      ja: '1854年6月10日: ゲッティンゲンでリーマンが幾何学の基礎となる仮説について講義。'
      ko: '1854년 6월 10일: 괴팅겐에서 리만은 기하학의 기초에 관한 가설에 대해 강의합니다.'
      ru: '10 июня 1854 г.: в Геттингене Риман читает лекции о гипотезах, лежащих в основе геометрии.'
  primes:
    date: '1859'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'In 1859 Riemann sent the Berlin Academy his paper on the number of primes less than a given magnitude, which studies the zeta function as a function of a complex variable.'
      zh: '1859 年，黎曼向柏林科学院呈交论小于给定值的素数个数的论文，把 ζ 函数当作复变函数来研究。'
    line:
      en: '1859: Riemann sends the Berlin Academy his paper on the number of primes below a given size.'
      zh: '1859 年，黎曼向柏林科学院呈交论小于给定值的素数个数的论文。'
      zh-Hant: '1859 年，黎曼向柏林科學院呈交論小於給定值的素數個數的論文。'
      fr: '1859 : Riemann envoie à l''Académie de Berlin son article sur le nombre de nombres premiers en dessous d''une taille donnée.'
      es: '1859: Riemann envía a la Academia de Berlín su artículo sobre el número de números primos por debajo de un tamaño determinado.'
      ja: '1859年: リーマンは、所定のサイズ以下の素数の数に関する論文をベルリンアカデミーに送付。'
      ko: '1859년: 리만은 주어진 크기 이하의 소수의 수에 관한 논문을 베를린 아카데미에 보냅니다.'
      ru: '1859: Риман отправляет в Берлинскую академию свою статью о количестве простых чисел меньше заданного размера.'
  illness:
    date: '1862'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'Riemann fell ill in the autumn of 1862 and suffered from tuberculosis. He spent the following winter in Sicily and went back to Italy more than once.'
      zh: '1862 年秋，黎曼病倒，此后患肺结核。他在西西里过了那个冬天，此后又几次去意大利。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Autumn 1862: Riemann falls ill.'
      zh: '1862 年秋，黎曼病倒，此后患肺结核。'
      zh-Hant: '1862 年秋，黎曼病倒，此後患肺結核。'
      fr: 'Automne 1862 : Riemann tombe malade.'
      es: 'Otoño de 1862: Riemann enferma.'
      ja: '1862年秋: リーマンが病に倒れる。'
      ko: '1862년 가을: 리만이 병에 걸렸습니다.'
      ru: 'Осень 1862 года: Риман заболевает.'
  selasca:
    date: '1866-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_selasca_royal_obituary]
    text:
      en: 'In June 1866, on his third journey to Italy, Riemann came to Selasca on Lake Maggiore; MacTutor gives 16 June, the Royal Society obituary 23 June.'
      zh: '1866 年 6 月，黎曼第三次来意大利，住进马焦雷湖畔的塞拉斯卡。抵达日麦克图托写 6 月 16 日，皇家学会悼文写 6 月 23 日。'
    line:
      en: 'June 1866: on his third journey south, Riemann comes to Selasca on Lake Maggiore.'
      zh: '1866 年 6 月，黎曼第三次南下，住进马焦雷湖畔的塞拉斯卡。'
      zh-Hant: '1866 年 6 月，黎曼第三次南下，住進馬焦雷湖畔的塞拉斯卡。'
      fr: 'Juin 1866 : lors de son troisième voyage vers le sud, Riemann arrive à Selasca, sur le lac Majeur.'
      es: 'Junio de 1866: en su tercer viaje al sur, Riemann llega a Selasca, en el lago Mayor.'
      ja: '1866 年 6 月: リーマンは 3 度目の南下旅行でマッジョーレ湖のセラスカにやって来ます。'
      ko: '1866년 6월: 세 번째 남쪽 여행 중 리만은 마조레 호수의 셀라스카에 도착합니다.'
      ru: 'Июнь 1866 года: во время своего третьего путешествия на юг Риман приезжает в Селаску на озере Маджоре.'
  last_work:
    date: '1866-07-19'
    stay_day: 26
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_selasca_royal_obituary]
    text:
      en: 'By the account of Dedekind, the day before he died Riemann lay resting under a fig tree and worked on his last paper, which was left unfinished.'
      zh: '据戴德金记述，去世前一天，黎曼躺在无花果树下休息，仍在写最后一篇论文，论文没有写完。'
    line:
      en: '19 July 1866: under a fig tree at Selasca, Riemann works on his last paper.'
      zh: '1866 年 7 月 19 日，黎曼在塞拉斯卡的无花果树下写他最后一篇论文。'
      zh-Hant: '1866 年 7 月 19 日，黎曼在塞拉斯卡的無花果樹下寫他最後一篇論文。'
      fr: '19 juillet 1866 : sous un figuier à Selasca, Riemann rédige son dernier papier.'
      es: '19 de julio de 1866: bajo una higuera en Selasca, Riemann trabaja en su último artículo.'
      ja: '1866年7月19日: セラスカのイチジクの木の下で、リーマンは最後の論文に取り組んでいる。'
      ko: '1866년 7월 19일: 셀라스카의 무화과나무 아래에서 리만은 마지막 논문을 작성하고 있습니다.'
      ru: '19 июля 1866 года: под фиговым деревом в Селаске Риман работает над своей последней работой.'
  death:
    date: '1866-07-20'
    stay_day: 27
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'Riemann died of tuberculosis at Selasca on 20 July 1866, aged thirty nine.'
      zh: '1866 年 7 月 20 日，黎曼在塞拉斯卡死于肺结核，三十九岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '20 July 1866: Bernhard Riemann dies at Selasca, aged thirty nine.'
      zh: '1866 年 7 月 20 日，伯恩哈德·黎曼在塞拉斯卡去世，三十九岁。'
      zh-Hant: '1866 年 7 月 20 日，伯恩哈德·黎曼在塞拉斯卡去世，三十九歲。'
      fr: '20 juillet 1866 : Bernhard Riemann décède à Selasca, à l''âge de trente-neuf ans.'
      es: '20 de julio de 1866: Bernhard Riemann muere en Selasca, a la edad de treinta y nueve años.'
      ja: '1866年7月20日：ベルンハルト・リーマンがセラスカで39歳で死去。'
      ko: '1866년 7월 20일: 베른하르트 리만(베른하르트 리만)이 셀라스카(Selasca)에서 39세의 나이로 사망합니다.'
      ru: '20 июля 1866 года: Бернхард Риман умирает в Селаске в возрасте тридцати девяти лет.'
  werke:
    date: '1876'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_wiki, richard_dedekind_mactutor]
    text:
      en: 'In 1876 the collected mathematical works of Riemann were published in Leipzig, edited by Heinrich Weber with Richard Dedekind.'
      zh: '1876 年，黎曼的数学全集在莱比锡出版，由海因里希·韦伯编订，理查德·戴德金参与。'
    line:
      en: '1876: the collected works of Riemann come out in Leipzig, with Dedekind among the editors.'
      zh: '1876 年，黎曼全集在莱比锡出版，戴德金参与了编订。'
      zh-Hant: '1876 年，黎曼全集在萊比錫出版，戴德金參與了編訂。'
      fr: '1876 : les œuvres complètes de Riemann paraissent à Leipzig, avec Dedekind parmi les éditeurs.'
      es: '1876: en Leipzig se publican las obras completas de Riemann, con Dedekind entre los editores.'
      ja: '1876年: リーマンの著作集がライプツィヒで出版され、編集者の中にはデデキントも含まれていた。'
      ko: '1876년: 리만의 전집이 편집자로 데데킨트와 함께 라이프치히에서 출판되었습니다.'
      ru: '1876: в Лейпциге выходит собрание сочинений Римана, в числе редакторов которого находится Дедекинд.'
bystanders:
