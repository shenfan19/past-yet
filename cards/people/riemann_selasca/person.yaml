    text:
      en:
        name: "The last paper"
        place: "Selasca"
        figure: "Bernhard Riemann"
        story: 'Bernhard Riemann fell ill in 1862 and travelled to Italy more than once while suffering from tuberculosis. In June 1866 he came for the third time, to Selasca on Lake Maggiore. On 19 July, resting under a fig tree, he was still working on his last paper, which he did not finish. He died there the next day, aged thirty nine. Ten years later his collected works came out, with Richard Dedekind among the editors.'
        relic: "A page of notes"
        relic_desc: "A page of unfinished formulas in a small hand."
        points:
          p1: 'As his strength fails at Selasca, take down what he dictates and keep the pages in order, helping him carry his last paper further than history left it'
          p2: 'Cure the tuberculosis that is killing him, and save Riemann'
        points_fail:
          p1: 'The last paper stopped where history left it.'
          p2: 'He died at Selasca on 20 July as history has it, and in this branch too he could not be kept.'
        shift:
          p1:
            was: 'The Royal Society obituary and Dedekind''s account say that the day before he died, resting under a fig tree at Selasca, Riemann was still working on his last paper, which was left unfinished.'
            now: 'The last paper went several pages further in his own words, and it was printed with them.'
          p2:
            was: 'Riemann died of tuberculosis at Selasca on Lake Maggiore on 20 July 1866, aged 39.'
            now: '{staff} brought the cure for the disease that had worn him down since 1862. That autumn he went back north and taught again in Göttingen.'
            who: riemann_selasca
            bio: 'In this line Riemann recovered from tuberculosis in the summer of 1866. He went home to Göttingen and worked on for many years.'
        vignettes:
          figs: 'On the evening of 18 July {staff} helps the landlord''s small daughter clear fallen figs from under the tree. The chair there is for the German gentleman, she explains, and if she misses one, his papers come out purple.'
          boat: 'Early in July {staff} helps a boatman unload a cargo of lemons at Pallanza. There are half as many boats on the lake this summer, the boatman says; the young men have all been called up, and he has had to teach his wife to row.'
          chair: 'In August {staff} helps the landlord carry the chair in from under the fig tree. He wipes it down with his sleeve again and again, and says the tree has never borne so many figs as this year, and nobody left to sit under it.'
      zh:
        name: "最后一篇论文"
        place: "塞拉斯卡"
        figure: "伯恩哈德·黎曼"
        story: '1862 年，伯恩哈德·黎曼病倒，此后患肺结核，几次南下意大利养病。1866 年 6 月，他第三次来，住进马焦雷湖畔的塞拉斯卡。7 月 19 日，他在无花果树下休息，仍在写最后一篇论文，没有写完。第二天，他在那里去世，三十九岁。十年后，他的全集出版，理查德·戴德金参与了编订。'
        relic: "一页笔记"
        relic_desc: "一页写着没完成公式的纸，字很小。"
        points:
          p1: '他在塞拉斯卡力气一天天衰下去时，替他记下口述、理好稿页，帮他把最后那篇论文往下写一段'
          p2: '治好拖垮他的肺结核，救下黎曼'
        points_fail:
          p1: '最后那篇论文照史实停在原处。'
          p2: '他照史实在 7 月 20 日死在塞拉斯卡，这条分支里也没能留住他。'
        shift:
          p1:
            was: '皇家学会悼文和戴德金的记述都说，去世前一天他在塞拉斯卡的无花果树下休息，仍在写最后那篇论文，论文没有写完。'
            now: '最后那篇论文用他自己的话多写了几页，后来连同这几页一起印出。'
          p2:
            was: '1866 年 7 月 20 日，黎曼在马焦雷湖畔的塞拉斯卡死于肺结核，三十九岁。'
            now: '{staff}带去的药治好了从 1862 年起拖着他的病。那年秋天他回到北边，又在哥廷根上起了课。'
            who: riemann_selasca
            bio: '这条时间线里，黎曼在 1866 年夏天治好了肺结核。他回到哥廷根，又工作了许多年。'
        vignettes:
          figs: '7 月 18 日傍晚，{staff}帮房东的小女儿把无花果树下的落果捡干净。她说树下那把椅子是给德国先生摆的，漏掉一个，他的稿纸就要染成紫的。'
          boat: '七月初，{staff}帮湖上的船夫把一船柠檬卸到帕兰扎码头。船夫说今年夏天湖上的船少了一半，年轻人都被叫去当兵了，他只好教老婆划桨。'
          chair: '八月，{staff}帮房东把无花果树下那把椅子搬进屋。房东用袖子擦了又擦，说这树从没结过今年这么多的果子，树底下却没人坐了。'
text:
  en:
    name: Bernhard Riemann
    text: German mathematician, 1826 to 1866. His work on geometry of curved spaces and on the distribution of primes opened major fields, and the Riemann hypothesis remains unsolved. He died of tuberculosis at Selasca on Lake Maggiore.
  zh:
    name: 伯恩哈德·黎曼
    text: 德国数学家，1826 年生，1866 年去世。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，黎曼猜想至今未解。他在马焦雷湖畔的塞拉斯卡死于肺结核。
quotes:
  riemann_selasca_space:
    order: 1
    tier: full
    date: '1854-06-10'
    checked: official_record
    sources: [riemann_geometry_print]
    original: de
    text:
      de: {quote: 'der Raum also nur einen besonderen Fall einer dreifach ausgedehnten Grösse bildet'}
      en: {who: 'Bernhard Riemann', quote: 'Space, then, is only one particular case of a three-dimensional magnitude.', occasion: 'Göttingen habilitation lecture, On the Hypotheses Underlying Geometry (game translation)'}
      zh: {who: '伯恩哈德·黎曼', quote: '因此，空间只是三维量的一种特例。', occasion: '哥廷根任教资格讲演《论几何基础中的假设》（游戏译文）'}
  riemann_selasca_concepts:
    order: 2
    tier: none
    date: '1854-06-10'
    checked: official_record
    sources: [riemann_geometry_print]
    original: de
    text:
      de: {quote: 'die Schwierigkeiten mehr in den Begriffen, als in der Construction liegen'}
      en: {who: 'Bernhard Riemann', quote: 'The difficulties lie more in the concepts than in the construction.', occasion: 'Göttingen habilitation lecture, On the Hypotheses Underlying Geometry (game translation)'}
      zh: {who: '伯恩哈德·黎曼', quote: '难处更多在于概念，而不在构造。', occasion: '哥廷根任教资格讲演《论几何基础中的假设》（游戏译文）'}
hook: {en: 'Under the fig tree, writing to the last day', zh: '无花果树下写到最后一天'}
facts:
  geometry_lecture:
    date: '1854-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_selasca_primary, riemann_mactutor]
    text:
      en: 'On 10 June 1854 Riemann gave his habilitation lecture at Göttingen, on the hypotheses that lie at the foundations of geometry, which examines how distances can be defined.'
      zh: '1854 年 6 月 10 日，黎曼在哥廷根作任教资格讲演，题为论几何基础中的假设，讨论距离可以怎样定义。'
    line:
      en: '10 June 1854: in Göttingen Riemann lectures on the hypotheses at the foundations of geometry.'
      zh: '1854 年 6 月 10 日，黎曼在哥廷根讲论几何基础中的假设。'
  primes:
    date: '1859'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'In 1859 Riemann sent the Berlin Academy his paper on the number of primes less than a given magnitude, which studies the zeta function as a function of a complex variable.'
      zh: '1859 年，黎曼向柏林科学院呈交论小于给定值的素数个数的论文，把 ζ 函数当作复变函数来研究。'
    line:
      en: '1859: Riemann sends the Berlin Academy his paper on the number of primes below a given size.'
      zh: '1859 年，黎曼向柏林科学院呈交论小于给定值的素数个数的论文。'
  illness:
    date: '1862'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'Riemann fell ill in the autumn of 1862 and suffered from tuberculosis. He spent the following winter in Sicily and went back to Italy more than once.'
      zh: '1862 年秋，黎曼病倒，此后患肺结核。他在西西里过了那个冬天，此后又几次去意大利。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Autumn 1862: Riemann falls ill.'
      zh: '1862 年秋，黎曼病倒，此后患肺结核。'
  selasca:
    date: '1866-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_selasca_royal_obituary]
    text:
      en: 'In June 1866, on his third journey to Italy, Riemann came to Selasca on Lake Maggiore; MacTutor gives 16 June, the Royal Society obituary 23 June.'
      zh: '1866 年 6 月，黎曼第三次来意大利，住进马焦雷湖畔的塞拉斯卡。抵达日麦克图托写 6 月 16 日，皇家学会悼文写 6 月 23 日。'
    line:
      en: 'June 1866: on his third journey south, Riemann comes to Selasca on Lake Maggiore.'
      zh: '1866 年 6 月，黎曼第三次南下，住进马焦雷湖畔的塞拉斯卡。'
  last_work:
    date: '1866-07-19'
    stay_day: 26
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_selasca_royal_obituary]
    text:
      en: 'By the account of Dedekind, the day before he died Riemann lay resting under a fig tree and worked on his last paper, which was left unfinished.'
      zh: '据戴德金记述，去世前一天，黎曼躺在无花果树下休息，仍在写最后一篇论文，论文没有写完。'
    line:
      en: '19 July 1866: under a fig tree at Selasca, Riemann works on his last paper.'
      zh: '1866 年 7 月 19 日，黎曼在塞拉斯卡的无花果树下写他最后一篇论文。'
  death:
    date: '1866-07-20'
    stay_day: 27
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [riemann_mactutor, riemann_wiki]
    text:
      en: 'Riemann died of tuberculosis at Selasca on 20 July 1866, aged thirty nine.'
      zh: '1866 年 7 月 20 日，黎曼在塞拉斯卡死于肺结核，三十九岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '20 July 1866: Bernhard Riemann dies at Selasca, aged thirty nine.'
      zh: '1866 年 7 月 20 日，伯恩哈德·黎曼在塞拉斯卡去世，三十九岁。'
  werke:
    date: '1876'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [riemann_wiki, richard_dedekind_mactutor]
    text:
      en: 'In 1876 the collected mathematical works of Riemann were published in Leipzig, edited by Heinrich Weber with Richard Dedekind.'
      zh: '1876 年，黎曼的数学全集在莱比锡出版，由海因里希·韦伯编订，理查德·戴德金参与。'
    line:
      en: '1876: the collected works of Riemann come out in Leipzig, with Dedekind among the editors.'
      zh: '1876 年，黎曼全集在莱比锡出版，戴德金参与了编订。'
