    text:
      en:
        name: "The last paper"
        place: "Selasca"
        figure: "Bernhard Riemann"
        story: 'Riemann''s 1854 lecture manuscript examines the assumptions underlying geometry and how distances can be defined.'
        relic: "A page of notes"
        relic_desc: "A page of unfinished formulas in a small hand."
        points:
          p1: 'Keep an uninterrupted period for Riemann’s last work. Give the new pages and related drafts to his family in the same folder'
          p2: 'Put a list beside the outgoing letters showing which notes are here and which remain in Göttingen'
          p3: 'While Riemann can decide, have him mark a set of results colleagues can read and a separate set of questions he hopes they will check'
        points_fail:
          p1: 'New sheets slip into the luggage with the old drafts. No identifiable record of the last session survives, and the office recalls the employee.'
          p2: 'The family remembers only that some papers stayed behind. Later searches have to recover each item from memory.'
          p3: 'The files have only a partial list. Later editors have to decide which pages are working notes and which might be published.'
        shift:
          p1:
            was: 'Riemann reached the Lake Maggiore area on June 23, 1866. A Royal Society obituary says he studied the mechanism of hearing the day before he died in Selasca.'
          p2:
            was: 'After his death, manuscripts, letters and working notes passed between family and scholars.'
            now: 'Two columns give the locations. When colleagues reply, the family can check who has which pages.'
          p3:
            was: 'Dedekind and Weber later collected and edited Riemann’s works. Surviving letters document searches for correspondence and its return.'
            now: 'Readers receive the two sets he marked. They reply first about the results they can check and keep the open questions on a separate list.'
            who: riemann_selasca
            bio: 'Riemann kept working in his last month. Editors later depended on colleagues and relatives to find papers in several places.'
        vignettes:
          surface: 'The reader stretches a strip across two points and lets it leave the surface in between. You press a second strip down against the curve and ask which journey each one measures.'
          assumption: 'The reader says the distance is obvious. You ask how they decided which paths to allow. They add that choice above the drawing and begin measuring again.'
          paper: 'You help the reader keep the starting points marked when the practice sheet bends. They can now compare their two readings without having to find the points again.'
      zh:
        name: "最后一篇论文"
        place: "塞拉斯卡"
        figure: "伯恩哈德·黎曼"
        story: '黎曼 1854 年的讲稿讨论几何的基本假设及距离如何定义。'
        relic: "一页笔记"
        relic_desc: "一页写着没完成公式的纸，字很小。"
        points:
          p1: '替黎曼给最后一项研究留一段不受打扰的时段，把写下的几页与正在查的旧稿一并交给家人保管'
          p2: '给能寄出的信附一张清单，记明各份笔记现在放在当地还是哥廷根'
          p3: '请黎曼趁还能决定时标出一两组可供同行审读的笔记，一组是已有推算，一组是接下去希望有人检验的问题'
        points_fail:
          p1: '沿用旧稿夹的几张新纸被收进行李，最后一次工作没有留下可辨的记录，事务所因同步失败召回员工。'
          p2: '家人只记得有一批稿件留在别处，日后查找时要凭记忆逐件辨认。'
          p3: '各页只有零散目录。身后编辑要先自行判断哪些仍是工作笔记、哪些可以发表。'
        shift:
          p1:
            was: '黎曼 1866 年 6 月 23 日抵达马焦雷湖一带。皇家学会悼文记他在塞拉斯卡去世的前一天仍在研究听觉器官。'
          p2:
            was: '黎曼去世后，遗稿、书信和研究记录经家属与不同学者转交。'
            now: '两处的存稿各有一栏。家人收到同事回信时，可以一项项确认谁手里有哪张纸。'
          p3:
            was: '戴德金与韦伯后来整理黎曼的文稿并出版全集。现存通信记载了寻找和归还书信的工作。'
            now: '审读人收到由他分好的两组纸，先对能核对的部分写下意见。余下的问题保留在一张可回查的清单里。'
            who: riemann_selasca
            bio: '黎曼最后一个月仍设法继续研究。身后编辑要依靠家人和同行找齐分处几地的纸张。'
        vignettes:
          surface: '读者把纸带从一点拉到另一点，中间却离开了曲面。你把另一条沿弧面按下去，请他分清两条量的是哪种走法。'
          assumption: '读者说距离一看就知道。你问哪些走法算数，是怎么定的。他把这个条件添在图上方，重新开始量。'
          paper: '练习纸弯起来时，你帮读者留住起讫两点的记号。现在比较两次读数时，不必重新找点。'
text:
  en:
    name: Bernhard Riemann
    text: German mathematician, 1826 to 1866. His work on geometry of curved spaces and on the distribution of primes opened major fields, and the Riemann hypothesis remains unsolved. He died of tuberculosis at Selasca on Lake Maggiore.
  zh:
    name: 伯恩哈德·黎曼
    text: 德国数学家，1826 年生，1866 年去世。他在弯曲空间的几何和素数分布上的工作开辟了重要领域，黎曼猜想至今未解。他在马焦雷湖畔的塞拉斯卡死于肺结核。
