      zh: {who: '罗宾德拉纳特·泰戈尔', quote: '日夜流过我血脉的那条生命之流，也流过整个世界，有节奏地起舞。', occasion: '泰戈尔自译的英文《吉檀迦利》手稿，第 69 首'}
