    sources: [tagore_stray_birds_six, tagoreweb_stray_birds_six]
    original: en
    text:
      en: {who: 'Rabindranath Tagore', quote: 'If you shed tears when you miss the sun, you also miss the stars.', occasion: 'Stray Birds, no. 6, published in English in 1916'}
      zh: {who: '罗宾德拉纳特·泰戈尔', quote: '如果你为错过太阳而落泪，也会错过群星。', occasion: '1916 年英文版《飞鸟集》，第 6 首'}
