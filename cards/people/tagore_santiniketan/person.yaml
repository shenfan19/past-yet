    text:
      en:
        name: 'One poem, two readings'
        place: Santiniketan, India
        figure: Rabindranath Tagore
        story: 'The English Gitanjali presents Tagore’s own prose translations from Bengali. In 1913 the Swedish Academy awarded him the Nobel Prize in Literature.'
        relic: A hand-copied songbook
        relic_desc: A small book of songs in his own hand.
        points:
          p1: 'After the reception breaks up, bring back the guests his reply has stung, and get him and these people, many of them his friends, to talk it out'
        points_fail:
          p1: 'As in history the guests go home aggrieved, and the distance between him and many of his countrymen stays; this branch is as history was.'
        shift:
          p1:
            was: '23 November 1913: a trainload of well-wishers came from Calcutta; in his reply Tagore said he could not accept without diffidence the honour offered in the country''s name, the guests were largely hurt, and a deep estrangement grew between him and many of his countrymen.'
            now: 'That evening some of the departing guests were asked back in and sat down with him to talk it out. The quarrel did not spread from that day.'
            who: tagore_santiniketan
            bio: 'In this timeline Tagore and the guests of the 1913 reception talked things out the same evening, and his reply did not set him apart from his countrymen.'
        vignettes:
          headline: 'You tell a student helping with the reading that the prize will bring readers who know only the English. The student asks which sheet they will reach for first. You leave both on the desk and label the English as the author’s rendering. You have time to hear only the first reading.'
          pause: 'The student keeps stopping at the ends of the printed lines. You read a sentence aloud and mark one pause that comes earlier. The next reader gets through the whole thought. You keep a copy of the marked sheet, but leave before you can hear how the other version sounds.'
          sheets: 'You pin two loose sheets together after the reading and mark which is which. The student can now hand both to whoever comes next. You take home the one pause you remember. The room is empty by the time you try it again.'
      zh:
        name: '一首诗，读两遍'
        place: 印度圣蒂尼克坦
        figure: 罗宾德拉纳特·泰戈尔
        story: '英文版《吉檀迦利》收入泰戈尔本人从孟加拉语译写的散文诗。1913 年，瑞典学院把诺贝尔文学奖授予泰戈尔。'
        relic: 一本手抄的歌集
        relic_desc: 一本小小的歌本，是他的亲笔。
        points:
          p1: '祝贺会散场后，劝回被他的答辞刺伤的来客，让他和这些多半是朋友的人把话说开'
        points_fail:
          p1: '来客照史实带着怨气散去，此后他与许多同胞之间照旧隔着一层，这条分支与历史一样。'
        shift:
          p1:
            was: '1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人，泰戈尔在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，来客多半不快，此后他与许多同胞之间生了很深的隔阂。'
            now: '那天傍晚，散去的来客里有几位又被请回屋里，和他坐下来把话说开。这场不快没有从那天传开去。'
            who: tagore_santiniketan
            bio: '这条时间线里，1913 年那场祝贺会散场后，泰戈尔当晚就和来客把话说开，没有因那篇答辞与同胞生出隔阂。'
        vignettes:
          headline: '你告诉管朗读的学生，奖项会带来只读得懂英文的新读者。学生问他们会先拿哪张。你把两张都留在桌上，给英文那张标明是作者自己译写。轮到第二遍时，你已得收队。'
          pause: '学生每到印刷行尾就停。你念了一整句，把该停的一处标在更前面。下一位朗读的人念完了整句的意思。你留了一份带停顿记号的纸，但没能听到另一种语言的读法。'
          sheets: '读完后，你把散开的两张稿夹在一起，标明各是哪一种语言。下一个人来了，学生可以把两张一起交给他。你只带回一个记得住的停顿，再念一遍时，教室已经空了。'
text:
  en:
    name: Rabindranath Tagore
    text: Bengali poet and educator, 1861 to 1941. He wrote poems, songs, plays and novels, founded a school at Santiniketan, and in 1913 became the first non European to receive the Nobel Prize in Literature.
  zh:
    name: 罗宾德拉纳特·泰戈尔
    text: 孟加拉诗人与教育家，1861 年生，1941 年去世。他写诗、歌曲、戏剧和小说，在圣蒂尼克坦创办学校，1913 年成为第一位获得诺贝尔文学奖的非欧洲人。
