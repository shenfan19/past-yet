    use: [story, history, wiki]
    sources: [tagore_nobel_facts, tagore_santiniketan_award]
    text:
      en: 'On 13 November 1913 the Swedish Academy awarded Tagore the Nobel Prize in Literature, the first given to a writer from outside Europe.'
      zh: '1913 年 11 月 13 日，瑞典学院把诺贝尔文学奖授予泰戈尔，他是第一位获得此奖的欧洲以外的作家。'
    line:
      en: '13 November 1913: the Swedish Academy awards Tagore the Nobel Prize in Literature.'
      zh: '1913 年 11 月 13 日，瑞典学院把诺贝尔文学奖授予泰戈尔。'
  reception:
    date: '1913-11-23'
    stay_day: 21.9
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tagore_1913_santiniketan_reception, tagore_outlook_prize]
    text:
      en: 'Soon after the news, on 23 November by the account of India Perspectives, a trainload of well-wishers from Calcutta came to Santiniketan; Tagore''s reply, that he could not accept without diffidence an honour offered in the country''s name, disappointed many of them.'
      zh: '消息传来后不久，据《印度展望》记载是 11 月 23 日，一列火车从加尔各答载着祝贺的人来到圣蒂尼克坦。泰戈尔答辞说不能毫无保留地接受以国家名义献上的荣誉，许多来客失望而归。'
    line:
      en: '23 November 1913: a train brings well-wishers from Calcutta to Santiniketan; Tagore''s reply leaves many of them hurt.'
      zh: '1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人。泰戈尔的答辞让许多来客不快。'
  school:
    date: '1913'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [tagore_nobel_school, tagore_visva_bharati]
    text:
      en: 'Tagore gave the prize money to his school at Santiniketan.'
      zh: '泰戈尔把奖金用在了圣蒂尼克坦的学校上。'
  visva_bharati:
    date: '1921'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [tagore_visva_bharati]
    text:
      en: 'In 1921 the school at Santiniketan grew into Visva-Bharati, the university Tagore founded.'
      zh: '1921 年，圣蒂尼克坦的学校发展成泰戈尔创办的国际大学。'
    line:
      en: '1921: Tagore founds the university of Visva-Bharati at Santiniketan.'
      zh: '1921 年，泰戈尔在圣蒂尼克坦创办国际大学。'
  death:
    date: '1941-08-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [tagore_nobel_facts, tagore_britannica]
    text:
      en: 'Rabindranath Tagore died in Calcutta on 7 August 1941.'
      zh: '1941 年 8 月 7 日，罗宾德拉纳特·泰戈尔在加尔各答去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '7 August 1941: Rabindranath Tagore dies in Calcutta.'
      zh: '1941 年 8 月 7 日，罗宾德拉纳特·泰戈尔在加尔各答去世。'
