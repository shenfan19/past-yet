    text:
      en:
        name: 'One poem, two readings'
        place: Santiniketan, India
        figure: Rabindranath Tagore
        story: 'In November 1912 the English Gitanjali, Rabindranath Tagore''s own prose renderings of his Bengali songs, came out in London. On 13 November 1913 the Swedish Academy gave him the Nobel Prize in Literature. Ten days later a trainload of well-wishers came from Calcutta to his school at Santiniketan; in his reply he said he could not accept without diffidence an honour offered in the country''s name, and many of the guests went home hurt. The prize money went to the school, which became the university of Visva-Bharati in 1921.'
        story_prose:
          opening:
            - 'Santiniketan in Bengal, November 1913. The poet Rabindranath Tagore runs a school here. A year ago the English Gitanjali, his own prose renderings of his Bengali songs, came out in London; on 13 November the Swedish Academy gave him the Nobel Prize in Literature, the first given to a writer from outside Europe.'
            - 'In history, ten days later a train brought well-wishers from Calcutta; in his reply he said he could not accept without diffidence an honour offered in the country''s name, many of the guests went home hurt, and from then on a distance stood between him and many of his countrymen. In this branch, the school has a boy who climbs the mango trees and a cook who keeps the rice, and one of the guests leaves his umbrella at the station.'
            - 'A few kinds of people can help on this trip: someone who has taught, worked in the news or guided visitors and knows how to fall into talk with people; someone gentle and steady with will enough; or someone carrying the golden apple. Once the reception breaks up, the guests are already walking to the station.'
          outcomes:
            all: 'The guests of that evening went back to Calcutta on a night train. In the years that followed, people came from the city to Santiniketan one party after another, and in 1921 the school became the university of Visva-Bharati.'
            p1: 'The guests of that evening went back to Calcutta on a night train. In the years that followed, people came from the city to Santiniketan one party after another, and in 1921 the school became the university of Visva-Bharati.'
          none: 'At dusk on 23 November the guests waited for their train at Bolpur station, and nobody on the platform spoke. After the train had gone the benches still stood under the mango trees, not one of them put away.'
          not_admitted: '{staff} never got into the school, and only watched from the platform at Bolpur as the train came in and went out again. On the way in someone in the carriages had been singing; on the way back every window was shut.'
          points:
            p1:
              class_teaching: 'On 23 November the reception breaks up, and the guests walk off in twos and threes towards Bolpur station; the last few have not said a word all the way. {staff}, who has taught, knows that after a hard word you wait until people have gone a few steps before you go after them, catches up with them, stands with them a while by the road, and brings them back into the yard. After dark the lamps are lit indoors, Tagore and a few of the guests sit down round a low table, and the tea is poured twice over. A guest takes up the hand-copied songbook, then shuts it. He tells Tagore what he thought he heard in the yard. Tagore asks which words gave him that impression and waits for the answer.'
              class_press: 'On 23 November the reception breaks up, and the guests walk off in twos and threes towards Bolpur station; the last few have not said a word all the way. {staff}, who has worked in the news, knows how a sentence changes in the second mouth it passes through, catches up with them, asks them not to carry today''s words back to the city before they have asked the poet himself, and brings them back into the yard. After dark the lamps are lit indoors, Tagore and a few of the guests sit down round a low table, and the tea is poured twice over. A guest takes up the hand-copied songbook, then shuts it. He tells Tagore what he thought he heard in the yard. Tagore asks which words gave him that impression and waits for the answer.'
              else: 'On 23 November the reception breaks up, and the guests walk off in twos and threes towards Bolpur station; the last few have not said a word all the way. {staff}, unhurried and mild, catches up with them, stands with them a while by the road without saying much, only asks whether they would like another cup of tea before they go, and brings them back into the yard. After dark the lamps are lit indoors, Tagore and a few of the guests sit down round a low table, and the tea is poured twice over. A guest takes up the hand-copied songbook, then shuts it. He tells Tagore what he thought he heard in the yard. Tagore asks which words gave him that impression and waits for the answer.'
          excerpts:
            p1: 'After dark the lamps are lit indoors, Tagore and a few of the guests sit down round a low table, and the tea is poured twice over. A guest takes up the hand-copied songbook, then shuts it. He tells Tagore what he thought he heard in the yard. Tagore asks which words gave him that impression and waits for the answer.'
        relic: A hand-copied songbook
        relic_desc: A small book of songs in his own hand.
        points:
          p1: 'After the reception breaks up, bring back the guests his reply has stung, and get him and these people, many of them his friends, to talk it out'
        points_fail:
          p1: 'As in history the guests go home aggrieved, and the distance between him and many of his countrymen stays; this branch is as history was.'
        shift:
          p1:
            was: '23 November 1913: a trainload of well-wishers came from Calcutta; in his reply Tagore said he could not accept without diffidence the honour offered in the country''s name, the guests were largely hurt, and a deep estrangement grew between him and many of his countrymen.'
            now: 'That evening some of the departing guests returned. One asked which part of the honour Tagore had meant to decline. Tagore waited for the guest to finish and asked him to repeat the words he had heard. They stayed to hear each other out.'
            who: tagore_santiniketan
            bio: 'In this timeline Tagore and the guests of the 1913 reception talked things out the same evening, and his reply did not set him apart from his countrymen.'
        vignettes:
          telegram: 'The day the news comes, {staff} helps the boys carry benches under the mango trees. One of them climbs a tree and shouts that the whole of Calcutta is coming by train; a teacher pulls him down, and he protests that then somebody had better count the benches.'
          platform: 'At dusk {staff} helps a guest at Bolpur station find the umbrella he left behind. He stands on the platform a long time turning the umbrella in his hands, and only as the train comes in asks whether the poet always speaks to his guests like that.'
          rice: 'In December {staff} helps the school cook spread rice to dry in the yard. People keep coming to see the poet, the cook says, one party after another, and the rice is going faster than in any year he remembers.'
      zh:
        name: '一首诗，读两遍'
        place: 印度圣蒂尼克坦
        figure: 罗宾德拉纳特·泰戈尔
        story: '1912 年 11 月，英文版《吉檀迦利》在伦敦出版，收的是罗宾德拉纳特·泰戈尔自己从孟加拉语译写的散文诗。1913 年 11 月 13 日，瑞典学院把诺贝尔文学奖授予他。十天后，一列火车从加尔各答载来祝贺的人，到了他在圣蒂尼克坦的学校。他在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，许多来客带着不快回去了。奖金给了学校，1921 年，学校成了国际大学。'
        story_prose:
          opening:
            - '1913 年 11 月，孟加拉的圣蒂尼克坦。诗人罗宾德拉纳特·泰戈尔在这里办着一所学校。一年前，他自己从孟加拉语译写的英文《吉檀迦利》在伦敦出版；11 月 13 日，瑞典学院把诺贝尔文学奖授予他，他是第一位获此奖的欧洲以外的作家。'
            - '史实里，十天后，一列火车从加尔各答载来祝贺的人；他在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，许多来客带着不快回去了，此后他与许多同胞之间隔着一层。在这条分支里，学校里有个爱爬芒果树的男孩和一个管米的厨子，来客里有一位在车站落下了伞。'
            - '这一趟用得上几种人：教过书、跑过新闻、做过导游、懂得怎样跟人搭话的人；性子温和沉稳、意志也够的人；带着金苹果的人也行。散场以后，人已经往车站走了。'
          outcomes:
            all: '那晚的客人坐夜里的车回了加尔各答。此后几年，从城里来圣蒂尼克坦的人一拨接一拨，1921 年，这所学校成了国际大学。'
            p1: '那晚的客人坐夜里的车回了加尔各答。此后几年，从城里来圣蒂尼克坦的人一拨接一拨，1921 年，这所学校成了国际大学。'
          none: '11 月 23 日傍晚，来客们在博尔布尔车站等车，月台上没有人说话。火车开走以后，芒果树下的长凳还摆着，一张也没有收。'
          not_admitted: '{staff}没能进学校，只在博尔布尔车站的月台上看着那一列火车进站、出站。来时车厢里有人唱歌，回去时窗都关着。'
          points:
            p1:
              class_teaching: '11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}教过书，知道一句话说重了，要等人走出几步再去追，追上那几位，陪他们在路边站了一会儿，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。'
              class_press: '11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}跑过新闻，知道一句话传到第二个人嘴里就变了样，追上那几位，请他们先别把今天的话带回城里，回去当面再问一句，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。'
              else: '11 月 23 日，祝贺会散了，来客三三两两往博尔布尔车站走，走在后面的几位一路没有说话。{staff}性子和缓，追上那几位，陪他们在路边站了一会儿，没多说什么，只问他们走之前要不要再喝一杯茶，把他们请回了院子。天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。'
          excerpts:
            p1: '天黑以后，屋里点上了灯，泰戈尔和几位客人围着矮桌坐下，茶添了两回。一位客人拿起他手边的手抄歌集，又合上了，说起自己在院里听到的那句答辞。泰戈尔问是哪几个字让他这么想，等他答完才开口。'
        relic: 一本手抄的歌集
        relic_desc: 一本小小的歌本，是他的亲笔。
        points:
          p1: '祝贺会散场后，劝回被他的答辞刺伤的来客，让他和这些多半是朋友的人把话说开'
        points_fail:
          p1: '来客照史实带着怨气散去，此后他与许多同胞之间照旧隔着一层，这条分支与历史一样。'
        shift:
          p1:
            was: '1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人，泰戈尔在答辞里说，自己不能毫无保留地接受这份以国家名义献上的荣誉，来客多半不快，此后他与许多同胞之间生了很深的隔阂。'
            now: '那天傍晚，有几位客人折了回来。一位问泰戈尔究竟不愿领受哪一份荣誉。泰戈尔等他说完，请他把刚才听到的话再说一遍。几个人留下来，把彼此的话听完。'
            who: tagore_santiniketan
            bio: '这条时间线里，1913 年那场祝贺会散场后，泰戈尔当晚就和来客把话说开，没有因那篇答辞与同胞生出隔阂。'
        vignettes:
          telegram: '消息传来那天，{staff}帮孩子们往芒果树下搬长凳，凳腿在红土上拖出一道道印子。一个孩子爬上树喊，全加尔各答都要坐火车来了，被老师揪了下来，还不服气，说那总得有人先把凳子数够。'
          platform: '天擦黑，月台上的灯还没点，{staff}在博尔布尔车站帮一位来客找回落下的伞。他在月台上攥着伞站了半天，火车进站时才问，诗人对客人说话一向是这样的吗。'
          rice: '十二月，{staff}帮学校的厨子在院里摊晒米，竹耙子一过，米粒沙沙地响。厨子说，来看诗人的人一拨接一拨，今年的米下得比哪年都快。'
text:
  en:
    name: Rabindranath Tagore
    text: Bengali poet and educator, 1861 to 1941. He wrote poems, songs, plays and novels, founded a school at Santiniketan, and in 1913 became the first non European to receive the Nobel Prize in Literature.
  zh:
    name: 罗宾德拉纳特·泰戈尔
    text: 孟加拉诗人与教育家，1861 年生，1941 年去世。他写诗、歌曲、戏剧和小说，在圣蒂尼克坦创办学校，1913 年成为第一位获得诺贝尔文学奖的非欧洲人。
