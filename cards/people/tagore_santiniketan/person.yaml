    level: usable
    use: [story, history, wiki]
    sources: [tagore_santiniketan_translation, tagore_gitanjali_wiki]
    text:
      en: 'In November 1912 the India Society in London published Gitanjali, Song Offerings, the author''s own prose translations from Bengali, with an introduction by W. B. Yeats.'
      zh: '1912 年 11 月，伦敦的印度学会出版了英文版《吉檀迦利》，收作者本人从孟加拉语译写的散文诗，叶芝作序。'
    line:
      en: 'November 1912: the English Gitanjali, in Tagore''s own prose translation, is published in London.'
      zh: '1912 年 11 月，泰戈尔自己译写的英文版《吉檀迦利》在伦敦出版。'
