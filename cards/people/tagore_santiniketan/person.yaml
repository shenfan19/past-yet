self_check:
  fact: reception
  quote_line: '1913 年 11 月 23 日，一列火车从加尔各答载来祝贺的人。泰戈尔的答辞让许多来客不快。'
  regret_choice: '派沉着和善、说得动人的去，散场时有几位客人被请回屋里坐下；派不会劝人的去，只能在月台上帮人找伞，看着一车人带着不快走了。'
  bookend: '从 1912 年英文版《吉檀迦利》出版开始，以 1941 年泰戈尔去世收尾，中间是一列来道贺的火车。'
  share_line: '1913 年 11 月，一车人去圣蒂尼克坦道贺，回去的路上没人说话。'
  share_number: '1913'
  knowing: 'visva_bharati'
