    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 22, req: {"any":[{"trait":["charismatic","calm","kind"],"stat":{"will":7}},{"job":["teacher","journalist","radio_host","tour_guide"],"stat":{"wit":6,"will":5}},{"item":"golden_apple","stat":{"will":5}}]}}
