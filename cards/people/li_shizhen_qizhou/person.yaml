    refs: [li_shizhen_qizhou_registry, li_shizhen_qizhou_edition_note, li_shizhen_qizhou_draft, li_shizhen_qizhou_edition]
    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"persuade","day":9,"req":{"any":[{"job":["pharmacist","archivist","proofreader"],"stat":{"wit":6}},{"trait":["methodical","charismatic","scholarly"],"stat":{"wit":6,"will":6}}]}}
    text:
      en:
        name: 'A proof while he can still read it'
        place: 'Qizhou'
        figure: 'Li Shizhen'
        story: 'Li Shizhen revised the Compendium of Materia Medica over many years. The Jinling edition appeared after his death. In this branch a printer can send him a single trial page.'
        story_prose:
          opening:
            - 'Qizhou, around 1592. Li Shizhen has spent years revising the Compendium of Materia Medica. The book he can open and still change himself is his manuscript.'
            - 'In history, the complete Jinling edition appeared after he died. In this branch a printer has struck off a trial page. Whether it can reach Qizhou from Jinling has yet to be settled.'
            - 'Someone who knows printing or proofing can help here. Each end needs to know who will read the sheet and who will carry it back after it is marked.'
          points:
            p1: '{staff} agrees with the printer to send just one sheet, entrusts it to a traveller who goes between the two places, and arranges for it to be collected on the return journey. Li spreads the proof and the manuscript side by side and rests a fingernail beside the line he wants. He writes a character in the margin and waits for it to dry before folding the two sheets separately.'
          outcomes:
            all: 'The traveller comes back the next day. Li hands over the dry sheet, his finger still resting over the character he corrected.'
            p1: 'The traveller comes back the next day. Li hands over the dry sheet, his finger still resting over the character he corrected.'
          none: 'No proof comes. Li changes the character in his manuscript and moves the ink farther from the edge of the paper.'
          not_admitted: '{staff} never meets anyone who can carry the proof. Bundles of paper pass through the shop door, each marked for a different address.'
          excerpts:
            p1: 'Li spreads the proof and the manuscript side by side and rests a fingernail beside the line he wants. He writes a character in the margin and waits for it to dry before folding the two sheets separately.'
        relic: 'A single proof'
        relic_desc: 'An imagined proof that still has space for the author’s marks.'
        points:
          p1: 'Get the printer to send one trial page to Qizhou while Li Shizhen can still check it'
        points_fail:
          p1: 'The employee did not arrange for a proof to reach him in time.'
        shift:
          p1:
            was: 'By 1596: the Jinling edition appeared after Li Shizhen’s death. He did not live to see the complete book in print.'
            now: '{staff} secures one trial page. Li Shizhen reads it at his table and sends it back with a correction in the margin.'
            who: li_shizhen_qizhou
            bio: 'Li Shizhen saw and marked one printed proof of his book before the full edition appeared.'
      zh:
        name: '送来一页试印'
        place: '蕲州'
        figure: '李时珍'
        story: '李时珍多年修订《本草纲目》，后来金陵本在他去世后问世。在这条分支里，印工可以先给他寄一页试印。'
        story_prose:
          opening:
            - '约 1592 年，蕲州。李时珍已经用了很多年改订《本草纲目》。他生前能反复翻开的，是自己还可以动笔的稿本。'
            - '史实里，完整的金陵本在他身后才问世。在这条分支里，印工手里有一张先试出来的纸，能不能从金陵寄到蕲州还没说定。'
            - '这趟用得上熟悉出版或校对的人。要能跟两地的人讲清，纸寄来给谁看，改完又托谁带回。'
          points:
            p1: '{staff}先和印工说好只寄一页，请往返两地的熟人带到蕲州，又约他返程来取。李时珍把旧稿和这张纸摊开，用指甲划住自己要对的一行。他在页边写了个字，等墨干，才把两张纸分别叠回去。'
          outcomes:
            all: '来取的人隔天才到。李时珍把干了的纸交给他，手指还停在自己改过的那个字上。'
            p1: '来取的人隔天才到。李时珍把干了的纸交给他，手指还停在自己改过的那个字上。'
          none: '始终没有试印送来。他在稿本上改过那个字，又把墨放到远离纸边的地方。'
          not_admitted: '{staff}没见到能托带试印的人。几捆纸从铺门进出，包裹上的收处各不相同。'
          excerpts:
            p1: '李时珍把旧稿和这张纸摊开，用指甲划住自己要对的一行。他在页边写了个字，等墨干，才把两张纸分别叠回去。'
        relic: '一页试印'
        relic_desc: '分支里的试印，页边留给作者亲自改字。'
        points:
          p1: '请印工先送一页试印到蕲州，让李时珍还有机会亲自校一遍'
        points_fail:
          p1: '员工没能安排试印及时送到。'
        shift:
          p1:
            was: '至 1596 年，金陵本已在李时珍身后问世。他未见全书刊行。'
            now: '{staff}争取到一页试印。李时珍在桌边读完，往页边写了一条改字意见，把那页送回去。'
            who: li_shizhen_qizhou
            bio: '全书问世以前，李时珍亲自看过并改过一张试印。'
text:
  en:
    name: Li Shizhen
    text: Chinese physician of the Ming, 1518 to 1593. After nearly three decades of work he completed the Compendium of Materia Medica, which describes about nineteen hundred substances, and which was printed after his death.
  zh:
    name: 李时珍
    text: 明代医生，1518 年生，1593 年去世。他花了近三十年写成《本草纲目》，记载约一千九百种药物，书在他去世后刊行。
hook: {en: 'A proof while he can still read it', zh: '送来一页试印'}
facts:
  after_death_edition:
    date: '1596'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [li_shizhen_qizhou_registry, li_shizhen_qizhou_edition_note]
    text:
      en: 'By 1596: the Jinling edition appeared after Li Shizhen’s death. He did not live to see the complete book in print.'
      zh: '至 1596 年，金陵本已在李时珍身后问世。他未见全书刊行。'
    line:
      en: 'By 1596: the Jinling edition appeared after Li Shizhen’s death. He did not live to see the complete book in print.'
      zh: '至 1596 年，金陵本已在李时珍身后问世。他未见全书刊行。'
      zh-Hant: '至 1596 年，金陵本已在李時珍身後問世。他未見全書刊行。'
      fr: "En 1596\_: l’édition Jinling parut après la mort de Li Shizhen. Il n’a pas vécu jusqu’à voir le livre complet imprimé."
      es: 'En 1596: la edición Jinling apareció después de la muerte de Li Shizhen. No vivió para ver el libro completo impreso.'
      ja: '1596年までに：李時珍の死後、金陵版が出版されました。彼は生きてこの本が印刷されるのを見ることができませんでした。'
      ko: '1596년: 이시진이 죽은 후 금릉본이 출판되었습니다. 그는 살아서 책 전체가 출판되는 것을 보지 못했습니다.'
      ru: 'К 1596 году: издание «Цзинлин» появилось после смерти Ли Шичженя. Он не дожил до того, чтобы увидеть полную книгу в печати.'
  draft:
    date: '1578'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [li_shizhen_qizhou_draft]
    text:
      en: 'The study dates completion of the compilation to 1578 and distinguishes later printed editions and illustrations.'
      zh: '研究把编成时间定在1578年，并区分后来的版本及其插图。'
  edition:
    date: '1603'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [li_shizhen_qizhou_edition]
    text:
      en: 'The digitized early edition includes editorial front matter, contents and illustrations, with a reprint preface dated 1603.'
      zh: '数字化早期刻本包括卷首体例、目录和插图，并见1603年重刻序。'
