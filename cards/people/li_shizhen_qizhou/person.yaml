    text:
      en:
        name: 'Which name goes with the entry'
        place: Qizhou, China
        figure: Li Shizhen
        story: 'Li Shizhen completed a draft of the Bencao Gangmu in 1578. Early printed editions came later and included illustrations and editorial apparatus.'
        relic: 'A copied specimen label'
        relic_desc: 'A fictional work label with a place left for an alternate name.'
        points:
          p1: 'Bring both labels back before the study table is cleared'
          p2: 'Check whether the two names came from the same place'
          p3: 'Keep the alternate name and its source with the entry'
        vignettes:
          names: 'Alin has written the name she heard at market beside the one on the specimen wrapper. You ask which vendor called it that. She remembers the stall but not the district. The entry keeps both names and identifies only the source she can actually place.'
          wrap: 'Ahe has time to carry one wrapped sample before the room closes. You put its tag inside the wrapper and copy it onto a scrap before he takes it. When the table is cleared, Alin can still see which name travelled with that sample.'
          print: 'You remember a printed illustration of the entry. Alin wants to know whether she can use it to settle the name on her own wrapper. You leave the name with the source she can describe. The later woodcut will not be ready on this visit.'
      zh:
        name: '哪个名字归在哪一条'
        place: 中国蕲州
        figure: 李时珍
        story: '李时珍于1578年完成《本草纲目》初稿，带编排体例和插图的早期印本问世在后。'
        relic: '一张抄留的样本签'
        relic_desc: '工作标签，给另一种叫法留有位置。'
        points:
          p1: '清桌前把两张签都找回来'
          p2: '核对两个名字是不是在同一地听来的'
          p3: '把异名和它的来处一并留在条目旁'
        vignettes:
          names: '阿林把集市上听来的名字写在样本包纸的名字旁。你问是哪一摊这样叫。她记得摊子，说不上是哪一乡的叫法。条目留住两个名字，只注明她还指得出的来处。'
          wrap: '屋子要关，阿禾只来得及送一包样本。你把签一并放入包内，交给他前另抄在纸头上。桌子清出来后，阿林还查得到哪一个名字随样本送去了。'
          print: '你记得后世印本里这条的图。阿林问，照那幅图能不能断定自己包纸上的名字。你把名字和她说得清的来处一起留在纸上。后来那块刻图的木版，这一趟等不到。'
text:
  en:
    name: Li Shizhen
    text: Chinese physician of the Ming, 1518 to 1593. After nearly three decades of work he completed the Compendium of Materia Medica, which describes about nineteen hundred substances, and which was printed after his death.
  zh:
    name: 李时珍
    text: 明代医生，1518 年生，1593 年去世。他花了近三十年写成《本草纲目》，记载约一千九百种药物，书在他去世后刊行。
hook: {en: 'Two names have slipped onto the same label.', zh: '两个名字，怎么都贴到这一份上？'}
