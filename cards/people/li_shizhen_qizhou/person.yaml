quotes:
  li_shizhen_qizhou_echo_full:
    order: 1
    tier: full
    date: '1590'
    checked: official_record
    sources: [li_shizhen_qizhou_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Li Shizhen, as recorded by Wang Shizhen'
        quote: 'I removed repetitions, filled gaps and corrected errors.'
        occasion: 'Wang Shizhen’s preface, reporting how Li describes his revisions.'
      zh:
        who: '李时珍，由王世贞转述'
        quote: '重复的删去，缺漏的补上，讹错的订正。'
        occasion: '王世贞《本草纲目》原序中转述李时珍的改订。'
      zh-Hant:
        who: '李时珍，由王世贞转述'
        quote: '複者芟之，闕者緝之，訛者繩之'
        occasion: '王世贞《本草纲目》原序中转述李时珍的改订。'
      fr:
        who: 'Li Shizhen, enregistré par Wang Shizhen'
        quote: 'J''ai supprimé les répétitions, comblé les lacunes et corrigé les erreurs.'
        occasion: 'Préface de Wang Shizhen, décrivant comment Li décrit ses révisions.'
      es:
        who: 'Li Shizhen, según lo registrado por Wang Shizhen'
        quote: 'Eliminé repeticiones, llené huecos y corregí errores.'
        occasion: 'Prefacio de Wang Shizhen, que informa cómo Li describe sus revisiones.'
      ja:
        who: '李時珍、王時珍の記録'
        quote: '繰り返しを削除し、ギャップを埋め、エラーを修正しました。'
        occasion: '王世珍の序文は、李氏が自身の改訂版をどのように説明しているかを報告しています。'
      ko:
        who: '이시진(이시진), 왕시진(Wang Shizhen)이 녹음한 것'
        quote: '반복을 제거하고, 공백을 메우고, 오류를 수정했습니다.'
        occasion: 'Li가 자신의 개정판을 어떻게 설명하는지 보고하는 Wang Shizhen의 서문.'
      ru:
        who: 'Ли Шичжэнь, записанный Ван Шичжэнем'
        quote: 'Я убирал повторы, заполнял пробелы и исправлял ошибки.'
        occasion: 'Предисловие Ван Шичжэня, в котором рассказывается, как Ли описывает свои исправления.'
  li_shizhen_qizhou_echo_none:
    order: 2
    tier: none
    date: '1590'
    checked: official_record
    sources: [li_shizhen_qizhou_echo_source_none]
    original: zh-Hant
    text:
      en:
        who: 'Li Shizhen, as recorded by Wang Shizhen'
        quote: 'Over thirty years I consulted more than eight hundred authors and revised the manuscript three times.'
        occasion: 'Wang Shizhen’s preface, reporting Li’s account of the work.'
      zh:
        who: '李时珍，由王世贞转述'
        quote: '前后过了三十年，查过八百多家书，稿子改过三次。'
        occasion: '王世贞《本草纲目》原序中转述李时珍的编书过程。'
      zh-Hant:
        who: '李时珍，由王世贞转述'
        quote: '歲歷三十稔，書考八百餘家，稿凡三易'
        occasion: '王世贞《本草纲目》原序中转述李时珍的编书过程。'
      fr:
        who: 'Li Shizhen, enregistré par Wang Shizhen'
        quote: 'Pendant trente ans, j''ai consulté plus de huit cents auteurs et révisé le manuscrit trois fois.'
        occasion: 'Préface de Wang Shizhen, rapportant le récit de Li sur le travail.'
      es:
        who: 'Li Shizhen, según lo registrado por Wang Shizhen'
        quote: 'Durante treinta años consulté a más de ochocientos autores y revisé el manuscrito tres veces.'
        occasion: 'Prefacio de Wang Shizhen, que informa el relato de Li sobre el trabajo.'
      ja:
        who: '李時珍、王時珍の記録'
        quote: '30年以上にわたり、私は800人以上の著者に相談し、原稿を3回改訂しました。'
        occasion: '李氏の作品説明を報告する王世珍氏の序文。'
      ko:
        who: '이시진(이시진), 왕시진(Wang Shizhen)이 녹음한 것'
        quote: '30년이 넘는 세월 동안 나는 800명이 넘는 저자들과 상담하고 원고를 세 번이나 수정했습니다.'
        occasion: 'Wang Shizhen의 서문, Li의 작업 설명을 보고합니다.'
      ru:
        who: 'Ли Шичжэнь, записанный Ван Шичжэнем'
        quote: 'За тридцать лет я консультировал более восьмисот авторов и трижды редактировал рукопись.'
        occasion: 'Предисловие Ван Шичжэня, в котором изложен отчет Ли о работе.'
