      zh: '该研究说明二屋年与 1325 年及定居相联系的通行说法，并讨论建城能否定为某一个年份。'
  plots:
    date: '1325'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [tenochtitlan_lake_plots]
    text:
      en: 'The listing describes the island city and Xochimilco’s artificial cultivation plots and channels. The game does not date these surviving plots to 1325.'
      zh: '遗产档案说明湖中岛城，以及索奇米尔科的人工耕地和水道。卡里未把现存田块定到 1325 年。'
