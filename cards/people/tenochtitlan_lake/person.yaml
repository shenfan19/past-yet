    text:
      en:
        name: 'A boat route between raised plots'
        place: Tenochtitlan, Mexico
        figure: The Mexica builders
        story: 'Historical Tenochtitlan grew on an island in Lake Texcoco. The game uses 1325, the conventional date associated with its foundation. Raised cultivation beds known as chinampas were fixed plots separated by water channels, as the later Xochimilco landscape shows. The scene imagines a practice route in the wider basin and does not date particular fields to 1325.'
        relic: A sketch of the boat channel
        relic_desc: A row of fixed posts and a movable slip showing the passing boat.
        points:
          p1: 'Walk to where the planted edge meets the boat channel'
          p2: 'Keep the water gap marked as the boat moves through the sketch'
          p3: 'Distinguish a fixed plot from a moving landing mark'
        vignettes:
          fixed: 'The helper has drawn the whole planted plot where the boat was this morning. You show him the posts that still stand at the field edge and mark the boat on a loose slip. The slip can move while the field stays on the page. You leave before the boat returns.'
          channel: 'You know later visitors will call such plots floating gardens. Here the helper has to find a way through water between two planted edges. You walk the bank far enough to mark the opening. There is room for the next boat on the plan. What it will carry is not on your sheet.'
          posts: 'You mark one fixed row of posts and then where the boat passed beside them. The helper can read one mark without treating it as the other. You keep the interval on the sketch. From here you cannot see where the next channel leads.'
      zh:
        name: '从隆起的田块之间过船'
        place: 墨西哥特诺奇蒂特兰
        figure: 墨西卡的建造者们
        story: '特诺奇蒂特兰在特斯科科湖中的岛上发展。卡里采用与建城相联系的通行纪年 1325 年。称为奇南帕的垫高耕地固定在水道之间，后来索奇米尔科的景观仍可见这一形态。卡中的练习水路为虚构，未把某块实田定在 1325 年。'
        relic: 一张船道草图
        relic_desc: 一排固定的桩，另有一张画着船的散纸可以移动。
        points:
          p1: '走到田边与船道相接的地方'
          p2: '画船的路线时，给图上的水道留出宽度'
          p3: '分清固定田块和会随水移动的停船记号'
        vignettes:
          fixed: '帮工把整块田画到早上停船的地方。你指给他看仍立在田边的桩，把船改画在散纸上。船能沿图移动，田仍留在那一处。等船再回来，你已经走了。'
          channel: '你知道后来的来客会把这类田叫浮动园圃。眼下帮工却得在两块固定田地之间找水道。你沿着边走到能标出开口的地方。下一条船在图上有路可走，船上载什么，这张纸没记。'
          posts: '你先标一排固定的桩，再画船贴着它们过去的位置。帮工看图能分清这两种记号。你带回这一小段两者间的距离，从这里还望不出下条水道通哪里。'
text:
  en:
    name: The Mexica builders
    text: The Mexica developed Tenochtitlan on an island in Lake Texcoco. Its founding is conventionally dated to 1325. The city had causeways, canals and aqueducts. Chinampas in the wider basin were raised cultivation beds separated by canals.
  zh:
    name: 墨西卡的建造者们
    text: 墨西卡人在特斯科科湖的一座岛上发展特诺奇蒂特兰，通行的建城纪年是 1325 年。城中有堤道、运河和引水渠。湖盆地区名为奇南帕的耕地为人工垫高的固定田块，由水道分隔。
hook: {en: 'Which part of a garden stays put when the water moves?', zh: '水在动，园圃的哪一边留在原地？'}
