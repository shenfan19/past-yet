text:
  en:
    name: The Mexica builders
    text: The Mexica builders of Tenochtitlan, founded on an island in Lake Texcoco in 1325. The city had causeways, canals, aqueducts and floating gardens called chinampas, and Spanish forces destroyed it in 1521.
  zh:
    name: 墨西卡的建造者们
    text: 特诺奇蒂特兰的墨西卡建造者。这座城建在特斯科科湖的一座岛上，1325 年建立。城里有堤道、运河、引水渠和名为奇南帕的浮田，西班牙人在 1521 年将它摧毁。
