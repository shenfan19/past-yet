    text:
      en:
        name: 'Two callers at the observatory'
        place: "Istanbul"
        figure: "Taqi al-Din"
        story: 'Taqī al-Dīn’s Istanbul observatory carried out observations before its demolition in January 1580. Archival research identifies instruments including quadrants and a mechanical clock.'
        story_prose:
          opening:
            - 'Istanbul, early 1580. Taqi al-Din and his assistants have been observing from the observatory. Manuscripts record several instruments they used there.'
            - 'In history, the observatory was dismantled in January. In this branch a former reader would like to leave with one small part from an instrument they used together.'
            - 'Someone who understands what can be handed over safely can help. They have to ask the assistant which one piece he can take responsibility for.'
          points:
            p1: '{staff} looks over the stand twice with the assistant, then asks if he wants to take only the piece bearing the scale he read most often. The assistant nods and holds an old cloth underneath. He and {staff} lift it flat onto the table. Before picking up the cloth he runs a finger along the edge again. His finger comes to rest at the mark where he used to call out the reading.'
          outcomes:
            all: 'The assistant brings the wrapped piece home. Later someone asks him how they took the readings, and he unfolds it to show them that mark first.'
            p1: 'The small part does not go with the old stand. Still wrapped in the cloth they used that day, it goes under the assistant’s table.'
          none: 'The assistant comes back once and leaves empty-handed. Where the stand once stood, a paler patch shows on the floor.'
          not_admitted: '{staff} never meets anyone from the observatory. After the doors close, a wooden box is moved inside.'
          excerpts:
            p1: 'Before picking up the cloth he runs a finger along the edge again. His finger comes to rest at the mark where he used to call out the reading.'
        relic: 'A comparison slip'
        relic_desc: 'A fictional observatory slip with an original row and its correction.'
        points:
          p1: 'Before the observatory is dismantled, help the people who used the instruments take a small graduated part into their own care'
        points_fail:
          p1: 'The part is still at the observatory when the workers come. Nothing from this handover reaches the former assistants.'
        shift:
          p1:
            was: 'In January 1580 the Istanbul observatory was demolished. A contemporary poem records instruments broken during the dismantling.'
            now: 'One marked component stays with the former assistants. After they leave the observatory, they can still show another instrument maker how that piece was graduated.'
        vignettes:
          clock: 'Hasan reads the angle aloud while Leyla copies the clock. The next row inherits the last angle because she did not hear his second call. You ask them to repeat, one voice at a time. Both workers mark the correction beside the record, where the next reader can find it.'
          copy: 'The bound notebook must go downstairs and Hasan will need the correction at the bench. You let Leyla copy the old and corrected rows onto one slip. She writes which was read first. When the notebook leaves, the bench still has the trail of the change.'
          closure: 'You know how little time the building has left. Hasan has stopped at a line with no time beside the angle. You ask what he can still check before shutting the shutters. He circles one empty space. You leave without seeing another observation from this room.'
      zh:
        name: '天文台里的两声报码'
        place: "伊斯坦布尔"
        figure: "塔基·丁"
        story: '塔基丁的伊斯坦布尔天文台在1580年1月被拆除前进行过观测。档案研究列出的仪器包括象限仪和机械钟。'
        story_prose:
          opening:
            - '1580 年初，伊斯坦布尔。塔基丁和同伴在观象台观测，手稿留下他们使用多种仪器的记录。'
            - '史实里，观象台在一月被撤除。在这条分支里，一位原来负责扶住读数的人，想在拆除前带走那枚他们共同用过的小部件。'
            - '这趟用得上清楚什么能安全交接的人，也得能让那位助手当面说自己愿意接下哪一件。'
          points:
            p1: '{staff}和助手在架旁看了两遍，最后问他愿不愿意只接下那枚平时最常读的刻度件。助手点头，拿一块旧布托住，等{staff}和他一起把它平平拿到桌面。拿起布以前，他又沿着尺边摸了一遍。手指停下来时，还压在从前报数的那一格。'
          outcomes:
            all: '助手把包好的部件带回家。以后有人来问当时怎样读数，他把布展开，先让对方看那一格。'
            p1: '那件小部件没有跟着旧架散失。助手用从前的旧布把它收在桌下。'
          none: '助手来过一次，又空手离开。架子原来立过的地方还留下一块颜色较浅的地面。'
          not_admitted: '{staff}没有见到观象台的人。关门以后，屋里传来收木箱的声音。'
          excerpts:
            p1: '拿起布以前，他又沿着尺边摸了一遍。手指停下来时，还压在从前报数的那一格。'
        relic: '一张订正对照纸'
        relic_desc: '天文台记录副页，保存了原行与订正。'
        points:
          p1: '撤除开始前，和使用仪器的助手取下一个带刻度的小部件，交给他们带走保管'
        points_fail:
          p1: '工人到场拆除时，带刻度的部件仍在原地。原来的助手没能留住这一件。'
        shift:
          p1:
            was: '1580 年 1 月，伊斯坦布尔观象台被拆除。同期诗文记下了仪器被毁。'
            now: '有一件带刻度的部件留在助手手里。离开观象台后，他们还能拿它同别的造仪器的人讲解原先怎样划刻度。'
        vignettes:
          clock: '哈桑读角度，莱拉抄钟上的时刻。她没听到第二次报码，下一行沿用了前一行的角度。你请两人一先一后再报一遍，他们把订正并排写在原记录旁，下一个人翻到这里就能找到。'
          copy: '装订好的记录簿要送下楼，哈桑在台边还得查那次订正。你请莱拉把旧行和改行一起抄在一张纸上，注明先读的是哪一行。簿子送走后，台边还查得到这次改动的来路。'
          closure: '你知道这座建筑剩下的时间已经很短。哈桑停在没有配时刻的角度上。你问他合上窗板前还能查出什么。他圈出一处空格。你走时，没再看见这间屋做下一次观测。'
text:
  en:
    name: Taqi al-Din
    text: Ottoman scholar and astronomer, 1526 to 1585. In the 1570s he built an observatory in Istanbul with large instruments, and wrote on clocks and mechanics. The observatory was demolished in 1580.
  zh:
    name: 塔基·丁
    text: 奥斯曼学者与天文学家，1526 年生，1585 年去世。1570 年代他在伊斯坦布尔建起带大型仪器的天文台，还写过钟表和力学的著作。天文台在 1580 年被拆毁。
hook: {en: 'Keep the clock reading beside the sighting.', zh: '报星位时，钟上又是几刻？'}
facts:
  observations:
    date: '1577'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [taqi_al_din_istanbul_observations]
    text:
      en: 'The study compares documentation of instruments and substantial observations from the late 1570s, including a source that starts full-scale work in AH 985.'
      zh: '研究比对1570年代后期的仪器与观测记录，其中一项史料把全面观测的开始放在伊斯兰历985年。'
  instrument_damage:
    date: '1580-01'
    stay_day: 19
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [taqi_al_din_istanbul_closure_chronology]
    text:
      en: 'An account by the contemporary poet Alā al-Dīn al-Manṣūr describes the observatory’s instruments being broken during the dismantling. It does not trace what happened to every individual instrument.'
      zh: '同期诗人阿拉丁·曼苏尔记到观象台被拆时有仪器被毁。记述没有逐件交代器物去向。'
    line:
      en: 'January 1580: the observatory is dismantled. A contemporary account records that instruments are broken.'
      zh: '1580 年 1 月，观象台被拆。同期记述说有仪器在拆除中被毁。'
  closure:
    date: '1580-01'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [taqi_al_din_istanbul_closure]
    text:
      en: 'The study places demolition in January 1580.'
      zh: '研究将拆除定在1580年1月。'
