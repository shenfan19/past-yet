    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 17, req: {any: [{job: [mechanic, restorer], stat: {finesse: 6}}, {trait: [handy, methodical], stat: {finesse: 7, will: 6}}]}}
