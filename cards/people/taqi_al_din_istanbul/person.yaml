    text:
      en:
        name: 'Two callers at the observatory'
        place: "Istanbul"
        figure: "Taqi al-Din"
        story: 'Taqī al-Dīn’s Istanbul observatory carried out observations before its demolition in January 1580. Archival research identifies instruments including quadrants and a mechanical clock.'
        relic: 'A comparison slip'
        relic_desc: 'A fictional observatory slip with an original row and its correction.'
        points:
          p1: 'As word of the closure reaches the observatory, inventory the existing tables and give the people keeping them a usable set'
          p2: 'Keep drawings, descriptions of instruments and observations identifiable. Leave blanks where the use is known but the drawing cannot be confirmed'
          p3: 'Have Taqī al-Dīn approve an observing book for use elsewhere and leave two assistants copies with a way to exchange corrections'
        points_fail:
          p1: 'The old tables are locked away with equipment scheduled for removal. Their readers cannot retrieve them, and the office recalls the employee.'
          p2: 'Unlabeled diagrams go into the same packet. Readers later copy an image from elsewhere as a drawing of the observatory’s equipment.'
          p3: 'After closure each person can take part of the material. Nobody can count on borrowing the other half later.'
        shift:
          p1:
            was: 'The Istanbul observatory was ordered demolished in 1580. Manuscripts of Taqī al-Dīn’s astronomical work survive.'
          p2:
            was: 'Images, descriptions and observations inform research on the observatory. Surviving records do not trace every instrument.'
            now: 'A later copyist knows which question each diagram can answer. Entries lacking provenance remain visibly open.'
          p3:
            was: 'Demolition ended the work at the observatory. Taqī al-Dīn’s astronomical writings survive in separate manuscripts.'
            now: 'Two copies stay in different places. The assistants can exchange corrections by page and keep a common record after the observatory closes.'
            who: taqi_al_din_istanbul
            bio: 'Taqī al-Dīn organized observations in Istanbul. Instruments, tables and people worked together there. Manuscripts could still be read after the site was gone.'
        vignettes:
          clock: 'Hasan reads the angle aloud while Leyla copies the clock. The next row inherits the last angle because she did not hear his second call. You ask them to repeat, one voice at a time. Both workers mark the correction beside the record, where the next reader can find it.'
          copy: 'The bound notebook must go downstairs and Hasan will need the correction at the bench. You let Leyla copy the old and corrected rows onto one slip. She writes which was read first. When the notebook leaves, the bench still has the trail of the change.'
          closure: 'You know how little time the building has left. Hasan has stopped at a line with no time beside the angle. You ask what he can still check before shutting the shutters. He circles one empty space. You leave without seeing another observation from this room.'
      zh:
        name: '天文台里的两声报码'
        place: "伊斯坦布尔"
        figure: "塔基·丁"
        story: '塔基丁的伊斯坦布尔天文台在1580年1月被拆除前进行过观测。档案研究列出的仪器包括象限仪和机械钟。'
        relic: '一张订正对照纸'
        relic_desc: '天文台记录副页，保存了原行与订正。'
        points:
          p1: '观象台接到撤除的消息时，尽快把台里已有的观测表按组清点，给能继续保管的人留可核的稿件'
          p2: '把仪器图、用途说明和对应观测分别夹好，把只能确认用途而不能确认外形的项目留空'
          p3: '请塔基丁核准一本可在台外使用的观测册，让两名原助手各自保管一份，写明今后如何交换抄件'
        points_fail:
          p1: '旧表和待撤的物件同仓封走，研究者取不到留存数据，事务所因同步失败召回员工。'
          p2: '一叠记录混收无题的示意图，后来读者把用来说明别处仪器的照抄成台内图。'
          p3: '失去观象台后，各人能带走部分材料，下一次能不能借到另一半由不得他们。'
        shift:
          p1:
            was: '伊斯坦布尔观象台于 1580 年奉命撤除。塔基丁的观测与天文工作仍有稿件传世。'
          p2:
            was: '研究观象台可用同期的仪器图、用途说明与观测稿，但所存文献并未记录所有器物的去向。'
            now: '后来的抄写者知道每张图能回答哪一项，也能看见台内没有留下出处说明的空栏。'
          p3:
            was: '拆除中断了这处观象台的工作，仍有塔基丁的天文稿分散传世。'
            now: '两套观测册留在不同地方。助手往后能凭页次互送勘误，离开观象台以后至少还有一份共同底稿。'
            who: taqi_al_din_istanbul
            bio: '塔基丁在伊斯坦布尔组织观测，仪器、计算表和分工一起支撑这项工作。场地消失以后，手稿仍可留给后来的人。'
        vignettes:
          clock: '哈桑读角度，莱拉抄钟上的时刻。她没听到第二次报码，下一行沿用了前一行的角度。你请两人一先一后再报一遍，他们把订正并排写在原记录旁，下一个人翻到这里就能找到。'
          copy: '装订好的记录簿要送下楼，哈桑在台边还得查那次订正。你请莱拉把旧行和改行一起抄在一张纸上，注明先读的是哪一行。簿子送走后，台边还查得到这次改动的来路。'
          closure: '你知道这座建筑剩下的时间已经很短。哈桑停在没有配时刻的角度上。你问他合上窗板前还能查出什么。他圈出一处空格。你走时，没再看见这间屋做下一次观测。'
text:
  en:
    name: Taqi al-Din
    text: Ottoman scholar and astronomer, 1526 to 1585. In the 1570s he built an observatory in Istanbul with large instruments, and wrote on clocks and mechanics. The observatory was demolished in 1580.
  zh:
    name: 塔基·丁
    text: 奥斯曼学者与天文学家，1526 年生，1585 年去世。1570 年代他在伊斯坦布尔建起带大型仪器的天文台，还写过钟表和力学的著作。天文台在 1580 年被拆毁。
hook: {en: 'Keep the clock reading beside the sighting.', zh: '报星位时，钟上又是几刻？'}
facts:
  observations:
    date: '1577'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [taqi_al_din_istanbul_observations]
    text:
      en: 'The study compares documentation of instruments and substantial observations from the late 1570s, including a source that starts full-scale work in AH 985.'
      zh: '研究比对1570年代后期的仪器与观测记录，其中一项史料把全面观测的开始放在伊斯兰历985年。'
  closure:
    date: '1580-01'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [taqi_al_din_istanbul_closure]
    text:
      en: 'The study places demolition in January 1580.'
      zh: '研究将拆除定在1580年1月。'
