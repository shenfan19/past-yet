    scene:
      points:
        - {id: p1, kind: notice, req: {"any":[{"job":["painter"]},{"stat":{"finesse":7}}]}}
        - {id: p2, kind: hold, req: {"any":[{"job":["carpenter","builder"]},{"trait":["attached"]}]}}
