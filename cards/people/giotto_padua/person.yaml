    text:
      en:
        name: Figures with weight and feeling
        place: Padua
        figure: Giotto
        story: 'Giotto''s frescoes at the Scrovegni Chapel in Padua are dated 1303–1305 by the chapel. The scenes occupy successive bands along the walls.'
        relic: A pot of blue pigment
        relic_desc: Ground blue, the colour of the chapel vault.
        points:
          p1: 'After the neighboring house objects to the building, have the patron record exterior work separately from Giotto’s painted walls. Keep time for the painters to care for their work'
          p2: 'Match Giotto’s color samples to wall locations, and leave the booklet with two people who can care for the paintings after the workshop leaves'
        points_fail:
          p1: 'A stop order closes access to the painted surfaces too. The painters cannot attend to them, a section is damaged, and the office recalls the employee.'
          p2: 'The workshop takes its samples away. Those who take over must infer the older materials from the wall’s current appearance.'
        shift:
          p1:
            was: 'On January 9, 1305, the neighboring friars complained about the scale and use of the Scrovegni building. Giotto’s fresco cycle survived.'
          p2:
            was: 'The frescoes have been conserved and restored more than once. Surviving layers and the building itself provide evidence of earlier work.'
            now: 'The incoming crew have samples keyed to the walls. Before a repair they can check where an early layer was recorded.'
            who: giotto_padua
            bio: 'Giotto left in Padua a booklet of colour samples keyed to the walls of the chapel. Centuries of repairs could go back to it to find the colours he had first laid.'
        vignettes:
          eye: 'The visitor always starts where the faces are easiest to see. You ask what their eyes do when you send them back to the corner. They follow a gesture into the next part of the picture.'
          register: 'The visitor tries to continue on the band just below. You trace the route around the wall in the air. They walk a few steps and find the scene they were looking for.'
          step: 'You step back with the visitor until two scenes fit into the same view. The visitor points out one detail that had been invisible when they stood directly beneath it.'
      zh:
        name: 有分量、有感情的人物
        place: 帕多瓦
        figure: 乔托
        story: '斯克罗威尼礼拜堂将帕多瓦现存的乔托壁画定年为 1303 至 1305 年。画面沿墙分层展开。'
        relic: 一罐蓝颜料
        relic_desc: 磨好的蓝色，是礼拜堂穹顶的颜色。
        points:
          p1: '邻院提出异议后，请委托人把外部工程与乔托已画的墙面分别登记，给画工留出能继续照管画面的窗口'
          p2: '请乔托把用于后续修补的颜色样与墙面位置配成册，交给两个能继续照管绘画的人'
        points_fail:
          p1: '停工单把壁画养护也一并撤下。画工进不去，尚需照管的画面受损，事务所召回员工。'
          p2: '工房收走颜色样，接手的人只按墙面现状判断先前用过的材料。'
        shift:
          p1:
            was: '1305 年 1 月 9 日，邻近修院对斯克罗韦尼建筑的规模和使用提出投诉。乔托的壁画组仍然留存。'
          p2:
            was: '这组壁画后来经多次保护与修复，现存画层和建筑痕迹留下许多可研究的信息。'
            now: '接手的人手里有一册写了位置的样纸，可以在修补前先看哪里保留了最早的一层。'
            who: giotto_padua
            bio: '乔托在帕多瓦留下一册注明墙面位置的颜色样。后来几百年的修补都能照着它，找回他当初上的颜色。'
        vignettes:
          eye: '访客总从面孔最清楚的地方看。你请他把视线拉回画角，看看接下来会往哪儿去。他顺着画中人的手势，看到了下一部分。'
          register: '访客要直接往正下方一层接着看。你在空中沿墙比出看画的顺序。他往前走几步，找到了刚才在找的那一幕。'
          step: '你陪访客往后退，直到两幕能一起看见。他指出一处刚才站在画底下看不见的细节。'
text:
  en:
    name: Giotto
    text: Italian painter, about 1267 to 1337. His frescoes in the Scrovegni Chapel in Padua, painted around 1305, show figures with weight and emotion and are seen as a step toward Renaissance painting.
  zh:
    name: 乔托
    text: 意大利画家，约 1267 年生，1337 年去世。他约在 1305 年画成的帕多瓦斯克罗维尼礼拜堂壁画，人物有重量感和情感，被视为通向文艺复兴绘画的一步。
