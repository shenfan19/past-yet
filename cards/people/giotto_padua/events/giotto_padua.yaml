text:
  en:
    name: Figures with weight and feeling
    place: Padua
    figure: Giotto
    story: In the Scrovegni Chapel Giotto paints saints as people with weight and feeling, a turn in European painting.
    relic: A pot of blue pigment
    relic_desc: Ground blue, the colour of the chapel vault.
    points:
      p1: "Look at how he paints the folds of cloth"
      p2: "Build the scaffold and lay the plaster"
      p3: "Stand in silence before the new painting"
  zh:
    name: 有分量、有感情的人物
    place: 帕多瓦
    figure: 乔托
    story: 在斯克罗威尼礼拜堂里，乔托把圣徒画成有分量、有感情的人，欧洲绘画由此转了向。
    relic: 一罐蓝颜料
    relic_desc: 磨好的蓝色，是礼拜堂穹顶的颜色。
    points:
      p1: "看他画的衣褶"
      p2: "搭脚手架与抹灰"
      p3: "站在新画前沉默"
