text:
  en:
    name: Clara Schumann
    text: 'Pianist and composer (1819–1896), born Clara Wieck. She began performing in childhood and toured widely. In July 1856 she returned from her first concert tour of Britain and visited Robert at Endenich. She continued giving concerts for decades.'
  zh:
    name: 克拉拉·舒曼
    text: '钢琴演奏家、作曲家（1819–1896），原名克拉拉·维克。她幼年登台，后来到多地巡演。1856 年 7 月，她结束了第一次英国巡演，回到恩德尼希探视罗伯特。此后她又演出了数十年。'
