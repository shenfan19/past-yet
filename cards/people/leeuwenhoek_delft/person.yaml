    text:
      en:
        name: A world in a drop of water
        place: Delft
        figure: Antonie van Leeuwenhoek
        story: 'In October 1676 Leeuwenhoek wrote from Delft that a drop of pepper water held thousands of little animals. The Royal Society in London asked how it might verify his observations. From May to August 1677, eight witnesses in and around Delft looked through his lenses and put their observations in writing. He sent their statements to London on 5 October. Robert Hooke later showed the little animals to members of the Society.'
        story_prose:
          opening:
            - 'In Delft, Leeuwenhoek hands a brass plate to the first visitor. The visitor closes one eye and still sees nothing. The other is already holding a pen, waiting to hear what he says.'
            - 'In 1676 Leeuwenhoek described tiny animals in water to London. Eight witnesses in Delft signed testimonies over the next year, and their accounts went with his letter of 5 October. You can keep the first two witnesses at the lens and check the enclosures before the autumn mail.'
            - 'Send someone who can guide another observer at the lens. In autumn you will need someone who can check all the signatures against the outgoing envelope.'
          points:
            p1: 'The first witness turns the plate and loses the patch of light. Leeuwenhoek asks him to move his eye back until it reappears. The man writes how the small things move. You turn his sheet over until the other witness can look and write for himself. Only when both have finished do they exchange sheets and smile at the two descriptions.'
            p2: 'The October envelope already contains the letter. You lift a late statement from the table and have Leeuwenhoek read out the joint signatures before checking the sheets in order. The last name is not in the corner where you expect it. A fold has to be lifted before the last name can go onto the enclosure list.'
          outcomes:
            all: 'The statements leave Delft with the letter. A reader can trace each account to a signed sheet. Hooke will also show the tiny animals to others in London.'
            p1: 'The first two witnesses have put down their own observations. An enclosure later goes missing from the October mail.'
            p2: 'The loose papers on the table are accounted for. The earliest signed account is missing, and the packet can no longer match the historical one.'
          none: 'The lens stands where it stood. No signed evidence stays behind after the visitors look.'
          not_admitted: 'Your name is missing from the appointment. The apprentice takes the brass plate inside and closes the door.'
          desync: 'The earliest signatures or an October enclosure are missing. The testimonies fall out of sync, and the office recalls the traveller.'
          excerpts:
            p1: 'Only when both have finished do they exchange sheets and smile at the two descriptions.'
            p2: 'A fold has to be lifted before the last name can go onto the enclosure list.'
        relic: A tiny brass lens plate
        relic_desc: A thumb sized plate holding one very small, very clear lens.
        points:
          p1: 'Give the first witnesses time at the lens and have each put the movement they saw into their own words'
          p2: 'Go through the October packet in Delft. Match the loose statements to the witnesses before the letter leaves for London'
        points_fail:
          p1: 'The first witnesses leave before they put what they saw on paper. The office recalls {staff} when the first testimony falls out of sync.'
          p2: 'The letter goes out but a sheet of testimony is left on the table. The office recalls {staff} when the packet falls out of sync.'
        shift:
          p1:
            was: 'On 18 May 1677 two witnesses signed a statement about the little animals they had seen. Six others added their testimony over the following months.'
          p2:
            was: 'Leeuwenhoek enclosed the witnesses’ statements with his letter from Delft dated 5 October. In November Hooke showed the little animals to the Royal Society in London.'
        vignettes:
          motion: 'The correspondent writes that something moved. You ask what the movement looked like to someone who cannot see the lens. They cross out a comparison and draw a second position beside the first.'
          label: 'There are drawings from wood and from wine on the table. You add temporary labels before the correspondent scrapes up the stray sheets, and the pictures go in the right order.'
          read: 'You read the observation back without pointing at its illustration. The correspondent hears where the description runs out and adds a reference to the correct diagram.'
      zh:
        name: 一滴水里的世界
        place: 代尔夫特
        figure: 列文虎克
        story: '1676 年 10 月，列文虎克从代尔夫特写信说，一滴胡椒水里有成千上万的小动物。伦敦皇家学会来信询问怎样核实他的观察。次年 5 月到 8 月，代尔夫特一带有八人先后凑到透镜前看过，写下证词，10 月 5 日随信寄往伦敦。后来，胡克在学会上让会员们亲眼看到了小动物。'
        story_prose:
          opening:
            - '代尔夫特，列文虎克把黄铜板递给第一位来客。来客闭一只眼，还是什么都没看见。旁边一位已经拿起笔，却在等他说看到了什么。'
            - '1676 年，列文虎克把水里小动物的观察寄往伦敦。次年，代尔夫特有八人陆续签下证词，10 月 5 日寄出。你能守住第一批见证的交接，再在封口前核对十月的每一张附页。'
            - '找会引导别人看清细处的人先守在透镜旁。秋天要用能核署名和邮封的员工把信送出。'
          points:
            p1: '第一位见证人把黄铜板转过来，原先那点亮光不见了。列文虎克请他把眼移回来，直到又能看见。他写下小动物活动的样子，你把纸反扣在桌上，请第二个人自己看完再拿笔。两位写完才交换纸张，对着各自的字同时笑了一下。'
            p2: '十月的封套里已经放进了信。你从外面拈起一张晚到的证词，请列文虎克念出联名处，再照日期逐张核。最后一页的签名不在你习惯找的那一角。手指掀开那折纸，才把最后一个名字补进附页单。'
          outcomes:
            all: '证词随信离开代尔夫特。读信的人能把一行说法查回一张署了名的纸；随后胡克在伦敦也让同事亲眼看见。'
            p1: '最早两位见证人已经写下了各自的观察。十月那只邮封后来有一页没对齐。'
            p2: '你按署名理好了桌上的纸。清点仍缺最初的证词，寄件无法对上历史。'
          none: '透镜还立在原处，来客只看过一眼，桌边没有留下可寄的证词。'
          not_admitted: '来客与列文虎克的约定没有你的名字。学徒把黄铜板拿进屋内，带上了门。'
          desync: '最早的签认或十月寄出的附件已缺，证词与旧日记录不能相合。事务所召回员工。'
          excerpts:
            p1: '两位写完才交换纸张，对着各自的字同时笑了一下。'
            p2: '手指掀开那折纸，才把最后一个名字补进附页单。'
        relic: 一块小黄铜透镜板
        relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
        points:
          p1: '给头两位见证人留出看透镜的时间，请他们用自己的话写下小动物是怎么动的'
          p2: '在代尔夫特核对十月的邮封，封口前把散开的证词逐张对回署名'
        points_fail:
          p1: '两位见证人还没写下所见就离开了。头一份证词脱节，事务所召回{staff}。'
          p2: '信寄出去了，还有一页证词落在桌上。寄件记录脱节，事务所召回{staff}。'
        shift:
          p1:
            was: '1677 年 5 月 18 日，两位见证人为所见的小动物签下证词。此后几个月，另有六人也留下了证词。'
          p2:
            was: '列文虎克在 10 月 5 日从代尔夫特发出的信中附上见证人的证词。11 月，胡克在伦敦皇家学会演示了小动物。'
        vignettes:
          motion: '通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。'
          label: '桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。'
          read: '你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。'
text:
  en:
    name: Antonie van Leeuwenhoek
    text: Dutch cloth merchant and microscopist, 1632 to 1723, of Delft. With single lens microscopes he made himself he saw bacteria, red blood cells and sperm, and described them in letters to the Royal Society.
  zh:
    name: 列文虎克
    text: 荷兰布商与显微镜学家，1632 年生，1723 年去世，代尔夫特人。他用自己磨制的单透镜显微镜看到细菌、红细胞和精子，并在给皇家学会的信中描述。
