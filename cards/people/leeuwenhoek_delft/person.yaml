    text:
      en:
        name: A world in a drop of water
        place: Delft
        figure: Antonie van Leeuwenhoek
        story: 'In October 1676 Leeuwenhoek wrote from Delft that a drop of pepper water held thousands of little animals. The Royal Society in London asked how it might verify his observations. From May to August 1677, eight witnesses in and around Delft looked through his lenses and put their observations in writing. He sent their statements to London on 5 October. Robert Hooke later showed the little animals to members of the Society.'
        relic: A tiny brass lens plate
        relic_desc: A thumb sized plate holding one very small, very clear lens.
        points:
          p1: 'Give the first witnesses time at the lens and have each put the movement they saw into their own words'
          p2: 'Go through the October packet in Delft. Match the loose statements to the witnesses before the letter leaves for London'
        points_fail:
          p1: 'The first witnesses leave before they put what they saw on paper. The office recalls {staff} when the first testimony falls out of sync.'
          p2: 'The letter goes out but a sheet of testimony is left on the table. The office recalls {staff} when the packet falls out of sync.'
        shift:
          p1:
            was: 'On 18 May 1677 two witnesses signed a statement about the little animals they had seen. Six others added their testimony over the following months.'
          p2:
            was: 'Leeuwenhoek enclosed the witnesses’ statements with his letter from Delft dated 5 October. In November Hooke showed the little animals to the Royal Society in London.'
        vignettes:
          motion: 'The correspondent writes that something moved. You ask what the movement looked like to someone who cannot see the lens. They cross out a comparison and draw a second position beside the first.'
          label: 'There are drawings from wood and from wine on the table. You add temporary labels before the correspondent scrapes up the stray sheets, and the pictures go in the right order.'
          read: 'You read the observation back without pointing at its illustration. The correspondent hears where the description runs out and adds a reference to the correct diagram.'
      zh:
        name: 一滴水里的世界
        place: 代尔夫特
        figure: 列文虎克
        story: '1676 年 10 月，列文虎克从代尔夫特写信说，一滴胡椒水里有成千上万的小动物。伦敦皇家学会来信询问怎样核实他的观察。次年 5 月到 8 月，代尔夫特一带有八人先后凑到透镜前看过，写下证词，10 月 5 日随信寄往伦敦。后来，胡克在学会上让会员们亲眼看到了小动物。'
        relic: 一块小黄铜透镜板
        relic_desc: 拇指大的板子，里面嵌着一片极小又极清晰的透镜。
        points:
          p1: '给头两位见证人留出看透镜的时间，请他们用自己的话写下小动物是怎么动的'
          p2: '在代尔夫特核对十月的邮封，封口前把散开的证词逐张对回署名'
        points_fail:
          p1: '两位见证人还没写下所见就离开了。头一份证词脱节，事务所召回{staff}。'
          p2: '信寄出去了，还有一页证词落在桌上。寄件记录脱节，事务所召回{staff}。'
        shift:
          p1:
            was: '1677 年 5 月 18 日，两位见证人为所见的小动物签下证词。此后几个月，另有六人也留下了证词。'
          p2:
            was: '列文虎克在 10 月 5 日从代尔夫特发出的信中附上见证人的证词。11 月，胡克在伦敦皇家学会演示了小动物。'
        vignettes:
          motion: '通信者写了句「有东西在动」。你问看不到透镜的人该怎样想象这个动法。他划去原先的比喻，在第一个位置旁画了第二个。'
          label: '桌上混着木头和酒的观察图。通信者收走散页前，你加了两张临时标签，图才按原来的顺序放进信里。'
          read: '你念回观察时，手不指图。通信者听出哪里只用文字已经说不明白，补上了对应的图号。'
text:
  en:
    name: Antonie van Leeuwenhoek
    text: Dutch cloth merchant and microscopist, 1632 to 1723, of Delft. With single lens microscopes he made himself he saw bacteria, red blood cells and sperm, and described them in letters to the Royal Society.
  zh:
    name: 列文虎克
    text: 荷兰布商与显微镜学家，1632 年生，1723 年去世，代尔夫特人。他用自己磨制的单透镜显微镜看到细菌、红细胞和精子，并在给皇家学会的信中描述。
hook: {en: 'Can the next observer find it too?', zh: '下一个人也看得见吗'}
facts:
  doubt:
    date: '1677-02-14'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [leeuwenhoek_delft_witnesses, leeuwenhoek_delft_wiki]
    text:
      en: 'Early in 1677 the Royal Society asked Leeuwenhoek for his method so that it could confirm his observations; its members did not believe him, and Nehemiah Grew could not repeat them.'
      zh: '1677 年初，皇家学会要列文虎克交代方法，好核实他的观察；会员们不信，格鲁也复现不出来。'
    line:
      en: 'Spring 1677: London does not believe in the little animals.'
      zh: '1677 年春，伦敦不信那些小动物。'
  testimonials:
    date: '1677-05-18'
    stay_day: 17
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leeuwenhoek_delft_rs_1677, leeuwenhoek_delft_witnesses]
    text:
      en: 'Between 18 May and 30 August 1677 eight people in Delft and nearby, among them a notary, a physician and a minister, wrote testimonials to the little animals in Leeuwenhoek’s pepper water; he enclosed them in his letter of 5 October 1677.'
      zh: '1677 年 5 月 18 日到 8 月 30 日，代尔夫特一带有八人为列文虎克胡椒水里的小动物写下证词，其中有公证人、医生和牧师；他把证词附在 1677 年 10 月 5 日的信里。'
    line:
      en: '18 May 1677: the first two witnesses in Delft write down what they saw.'
      zh: '1677 年 5 月 18 日，代尔夫特头两位见证人写下了亲眼所见。'
  sent:
    date: '1677-10-05'
    stay_day: 157
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leeuwenhoek_delft_rs_1677]
    text:
      en: 'Leeuwenhoek’s letter of 5 October 1677 from Delft sent eight testimonials to London.'
      zh: '1677 年 10 月 5 日，列文虎克从代尔夫特寄出附八份证词的信。'
    line:
      en: '5 October 1677: Leeuwenhoek dates the letter from Delft enclosing the testimonials.'
      zh: '1677 年 10 月 5 日，列文虎克在附有证词的信上写下日期与地点代尔夫特。'
  hooke:
    date: '1677-11'
    stay_day: 208
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [leeuwenhoek_delft_hooke, leeuwenhoek_delft_gest]
    text:
      en: 'In November 1677 Robert Hooke failed twice to show the Royal Society the little animals, and at the third meeting, with pepper steeped in rainwater, showed great numbers of them.'
      zh: '1677 年 11 月，胡克两次没能向皇家学会显出小动物，第三次用雨水泡过的胡椒水显出了一大群。'
    line:
      en: 'November 1677: at the third try Hooke shows the Society the little animals.'
      zh: '1677 年 11 月，胡克第三次才向学会显出了小动物。'
  letter:
    date: '1676-04-21'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [leeuwenhoek_delft_primary]
    text:
      en: 'A letter sent from Delft in April 1676 records Leeuwenhoek''s observations and includes figures of ash wood and a tiny eel-like animal found in wine.'
      zh: '列文虎克 1676 年 4 月从代尔夫特寄出的信记录了他的观察，并附白蜡木切面和酒中鳗状小动物的图。'
