  hammurabi_babylon:
    order: 50
    build_step: 3
    year: -1754
    # one office day in Babylon late in the reign, when the stele of the laws was set up; the year is approximate and the days are counted from arriving
    stay: 1
    lon: 44.42
    lat: 32.54
    region: asia
    home: [middle_east]
    near: [central_asia, north_africa]
    crossroads: true
    field: thought
    tier: 2
    channels: {H: 1, S: 1}
    # finished: in the game with release.ready_only
    ready: true
    refs: [hammurabi_babylon_primary, hammurabi_code_wiki, hammurabi_louvre_copy, hammurabi_britannica, hammurabi_history_com, hammurabi_find_record]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 25, req: {"any":[{"job":["archivist","translator","proofreader","writer","woodcarver"],"stat":{"finesse":5}},{"trait":["scholarly","methodical"],"stat":{"finesse":7,"will":5}},{"provides":"scan"}]}}
      vignettes:
        - {id: clay, traits: [handy, patient, methodical, quiet, scholarly], day: 6}
        - {id: river, traits: [bold, cheerful, curious, streetwise, glib], day: 15}
        - {id: roof, day: 27}
    text:
      en:
        name: Law set in stone
        place: Babylon
        figure: Hammurabi
        story: 'Around 1754 BC, late in the reign of Hammurabi, a basalt stele carved with nearly three hundred laws was set up, and scribes copied its laws onto clay tablets for centuries after. In the twelfth century BC the stele was carried off to Susa, and several columns of its text were scraped away. A French expedition dug it up at Susa in 1901; it is in the Louvre now, and the clay copies have given back part of what was scraped off.'
        story_prose:
          opening:
            - 'Babylon, around 1754 BC. Late in the reign of Hammurabi, a basalt stele is carved with a prologue, some 282 laws on property, trade, family and labour, and an epilogue. The epilogue says that a man who has been wronged may come before the stone and have its words read out to him. The scribes copy the laws onto clay tablets and teach them from one generation to the next.'
            - 'In history, in the twelfth century BC the Elamite king Shutruk-Nahhunte carried the stele to Susa, and several columns at the foot of its face were later scraped smooth; clay copies have given back about thirty of the missing laws, and what the rest said is still unknown. In this branch, an apprentice in the scribes'' house kneads the clay and dries the tablets, and a boatman on the Euphrates cannot read.'
            - 'A few kinds of people can help on this trip: someone used to desk work who can catch a skipped line; a steady-handed craftsman who can cut a reed and press the signs; someone meticulous enough to check column by column, or someone with glasses that bring out the detail of the stone.'
          outcomes:
            p1: 'More than three thousand years later, a tablet that had come down in another city was laid beside that smooth stretch of stone. Someone read down it line by line along the wedges, as far as the laws the stone no longer had.'
          none: 'The tablets still dried on the roof, and the apprentice still counted them one by one. Centuries later the stele was carried off, and the columns at its foot were ground flat, with nothing left to feel under the hand.'
          not_admitted: '{staff} never got into the scribes'' house, and helped the boatman unload a few sacks of barley on the Euphrates. Counting the sacks, the boatman talked about the king''s stone again, though he could not read a sign of it.'
          points:
            p1:
              class_lettered: 'A dozen tablets of fresh clay were laid out in the room: the scribe meant to copy the whole text of the stone several times over and send the copies to other cities to keep. {staff}, used to desk work, counted the lines of each finished tablet against the master from the top, and where one had skipped a line, smoothed it over while the clay was soft and wrote it again. The scribe rolled the cylinder seal along the edge of the last tablet, leaving a band of tiny figures and signs. The apprentice packed the tablets one by one into a basket lined with straw, tied the mouth shut, and carried it with the boatman down to the boat on the river.'
              class_craft: 'A dozen tablets of fresh clay were laid out in the room: the scribe meant to copy the whole text of the stone several times over and send the copies to other cities to keep. {staff}, steady of hand, cut slanted tips on a few reeds, tried each one on a scrap of clay, handed the sharpest to the scribe, and pressed a whole tablet from the master too. The scribe rolled the cylinder seal along the edge of the last tablet, leaving a band of tiny figures and signs. The apprentice packed the tablets one by one into a basket lined with straw, tied the mouth shut, and carried it with the boatman down to the boat on the river.'
              else: 'A dozen tablets of fresh clay were laid out in the room: the scribe meant to copy the whole text of the stone several times over and send the copies to other cities to keep. {staff} went down the master column by column and scratched on a potsherd which law each tablet began and ended with, so that the copies, put together, left nothing out. The scribe rolled the cylinder seal along the edge of the last tablet, leaving a band of tiny figures and signs. The apprentice packed the tablets one by one into a basket lined with straw, tied the mouth shut, and carried it with the boatman down to the boat on the river.'
          excerpts:
            p1: 'The scribe rolled the cylinder seal along the edge of the last tablet, leaving a band of tiny figures and signs. The apprentice packed the tablets one by one into a basket lined with straw, tied the mouth shut, and carried it with the boatman down to the boat on the river.'
        relic: A clay cylinder seal
        relic_desc: A small stone cylinder that rolls a signature into clay.
        points:
          p1: 'Help the scribes copy the whole text of the stele onto more clay tablets and send them to other cities, so that every law can still be read after part of the stone is scraped away'
        points_fail:
          p1: 'The full text stayed in the copies there already were. In this branch, after the stone was carried to Susa and part of it scraped, some of the laws were still lost.'
        shift:
          p1:
            was: 'In the twelfth century BC the stele was carried off to Susa and several columns of its text were scraped away; clay copies have restored about thirty of the missing laws, and the rest are still unknown.'
            now: '{staff} helped the scribes make more full copies and send them to other cities. In this timeline every law on the stele can still be read.'
            who: hammurabi_babylon
            bio: 'In this line every one of Hammurabi''s laws came down complete, and nothing that was scraped from the stone was lost.'
        vignettes:
          clay: '{staff} helps an apprentice scribe knead clay. The sand has to be washed out properly, the apprentice says, or the tablet cracks under the stylus halfway down, and then the master has him start again from the first line.'
          river: '{staff} helps a boatman unload barley on the bank of the Euphrates. Counting the sacks, the boatman says that if the weigher cheats him of one, he will go and stand in front of the king''s stone and recite the law at him, though he cannot read a sign of it himself.'
          roof: 'In the worst heat of the day {staff} and the apprentice lay the new tablets out on the roof to dry. The apprentice counts them, loses count halfway, and starts again, afraid a bird has walked across one.'
      zh:
        name: 刻在石头上的法律
        place: 巴比伦
        figure: 汉谟拉比
        story: '约前 1754 年，汉谟拉比在位的晚年，一块刻着近三百条法律的玄武岩石碑立了起来，此后几百年，书吏一直把这些条文抄在泥板上传习。前十二世纪，石碑被运到苏萨，碑上有几栏文字被磨去。1901 年，法国考古队在苏萨把它挖了出来，如今藏在卢浮宫，被磨掉的条文靠泥板抄本补回了一部分。'
        story_prose:
          opening:
            - '约前 1754 年，巴比伦。汉谟拉比在位的晚年，一块玄武岩石碑刻上了序言、约二百八十二条讲财产、交易、家庭与劳作的法律和一段结语。结语里说，受了冤屈的人可以来到碑前，请人把碑上的话念给他听。书吏把这些条文抄在泥板上，一代一代传习。'
            - '史实里，前十二世纪，埃兰王舒特鲁克-纳洪特把石碑运到苏萨，碑面下部有几栏后来被磨平；缺掉的条文靠泥板抄本补回了约三十条，其余至今不知道写的是什么。在这条分支里，书吏屋里有个和泥、晒泥板的学徒，幼发拉底河边有个不识字的船夫。'
            - '这一趟用得上几种人：做惯了案头活、校得出漏行的人；手稳、会削芦管压字的匠人；一丝不苟、一栏一栏对得下去的人，或是带着能把碑面细节看清的眼镜的人。'
          outcomes:
            p1: '三千多年后，那片磨平的石面旁边摆上了一块别的城里传下来的泥板。有人顺着楔形的刻痕一行一行往下念，念到了石头上已经没有的那几条。'
          none: '泥板照旧在屋顶上晒着，学徒照旧挨块数。几百年后石碑被运走，碑面下部那几栏磨成了平的，什么也摸不出来。'
          not_admitted: '{staff}没能进书吏的屋子，只在幼发拉底河边帮船夫卸了几袋大麦。船夫数着袋子，又说起王的石碑，碑上的字他一个也不认得。'
          points:
            p1:
              class_lettered: '屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}做惯了案头的活，抄完一块，就对着底本从头点一遍行数，漏了一行的那块，趁泥还软抹平了重写。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。'
              class_craft: '屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}手稳，把几根芦管削出斜口，一根一根在废泥上试过压痕，挑出最利的递给书吏，自己也照着底本压满了一整块。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。'
              else: '屋里摆开了十几块新和好的泥板，书吏要把碑上的全文再抄几份，送到别的城里去存。{staff}一栏一栏对着底本数下去，把每块泥板从哪一条抄到哪一条刻在一片陶片上，几份抄本拼起来，一条也不缺。书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。'
          excerpts:
            p1: '书吏把泥印滚筒在最后一块泥板的边上滚了一道，留下一串细小的人像和字。学徒把泥板一块块码进垫了干草的筐，扎紧筐口，和船夫一起抬上了河边的船。'
        relic: 一枚泥印滚筒
        relic_desc: 一个小石柱，在泥上一滚就留下签名。
        points:
          p1: '帮书吏把石碑全文多抄几块泥板，送到别的城里存放，后世石上被磨掉的那几栏也能读全'
        points_fail:
          p1: '全文照旧只有原来那些抄本，这条分支里石碑被搬到苏萨、磨去几栏以后，还是有几条法律再也读不到。'
        shift:
          p1:
            was: '公元前十二世纪，石碑被埃兰人搬到苏萨，碑文被磨去几栏；靠泥板抄本补回了约三十条，其余至今不知道写的是什么。'
            now: '{staff}帮书吏多抄了几份全文，送到别的城里存放，这条时间线里石碑上的每一条法律都还读得到。'
            who: hammurabi_babylon
            bio: 'IF 线里，汉谟拉比的法律一条不缺地传了下来，石上磨掉的部分也没有失去。'
        vignettes:
          clay: '{staff}帮书吏学徒和泥。学徒两只手插在泥里，说沙得淘干净，不然写到一半，芦管一按就裂，师傅又要他从第一行重抄。'
          river: '{staff}在幼发拉底河边帮船夫卸大麦，袋子压得肩膀发红。船夫一边数袋子一边说，过秤的要是敢少算一袋，他就站到王的石碑跟前把那一条念给他听，虽然碑上的字他一个也不认得。'
          roof: '日头最毒的时候，{staff}和学徒把新抄的泥板摆到屋顶上晒，泥板的边先干成了浅色。学徒挨块数，数到一半乱了，又从头数，生怕有一块被鸟踩过。'
text:
  en:
    name: Hammurabi
    text: King of Babylon, who reigned from about 1792 BC to about 1750 BC. A stele inscribed with nearly three hundred laws, setting penalties and rules for trade, family and property, is named after him.
  zh:
    name: 汉谟拉比
    text: 巴比伦国王，约公元前 1792 年至约公元前 1750 年在位。一块刻有近三百条法律的石碑以他命名，规定了交易、家庭和财产方面的规则与惩罚。
hook: {en: 'What the stone lost, clay remembered', zh: '石头记不住的，泥板记得'}
quotes:
  hammurabi_words_in_stone:
    order: 1
    tier: full
    date: '-1754'
    checked: official_record
    sources: [hammurabi_seal_epilogue, hammurabi_richardson_epilogue]
    original: akk
    text:
      en: {who: 'Hammurabi', quote: 'I inscribed my treasured words on my stele and set it before my image, the image of the king of justice.', occasion: 'Laws of Hammurabi, stele epilogue xlvii.74–78 (late in his reign; Akkadian in normalized transcription); game translation'}
      zh: {who: '汉谟拉比', quote: '我将珍重的话刻在石碑上，立在我的像前——那是公正之王的像。', occasion: '《汉谟拉比法典》石碑尾声，第 47 栏 74–78 行（在位晚期；阿卡德语规范转写）；本游戏译文'}
      akk: {who: 'Hammurabi', quote: 'awâtiya šūqurātim ina narîya ašṭurma ina maḫar ṣalmiya šar mīšarim ukīn.', occasion: 'Laws of Hammurabi, stele epilogue xlvii.74–78 (late in his reign; Akkadian in normalized transcription)'}
  hammurabi_let_him_take_heart:
    order: 2
    tier: none
    date: '-1754'
    checked: official_record
    sources: [hammurabi_seal_epilogue, hammurabi_richardson_epilogue]
    original: akk
    text:
      en: {who: 'Hammurabi', quote: 'May my stele make his case clear to him. May he see his judgment and take heart.', occasion: 'Laws of Hammurabi, stele epilogue xlviii.15–19, addressing the case of a wronged person (late in his reign; Akkadian in normalized transcription); game translation'}
      zh: {who: '汉谟拉比', quote: '愿我的石碑为他说明案情，愿他明白自己的判决，心里得以宽慰。', occasion: '《汉谟拉比法典》石碑尾声，第 48 栏 15–19 行，谈蒙冤者的申诉（在位晚期；阿卡德语规范转写）；本游戏译文'}
      akk: {who: 'Hammurabi', quote: 'narî awatam likallimšu dīnšu līmur, libbašu linappišma.', occasion: 'Laws of Hammurabi, stele epilogue xlviii.15–19, addressing the case of a wronged person (late in his reign; Akkadian in normalized transcription)'}
facts:
  accession:
    date: '-1792'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hammurabi_code_wiki, hammurabi_britannica]
    text:
      en: 'Hammurabi became king of Babylon around 1792 BC and reigned for about forty-two years.'
      zh: '约前 1792 年，汉谟拉比做了巴比伦的王，在位约四十二年。'
    line:
      en: 'About 1792 BC: Hammurabi becomes king of Babylon.'
      zh: '约前 1792 年，汉谟拉比做了巴比伦的王。'
  stele:
    date: '-1754'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hammurabi_babylon_primary, hammurabi_code_wiki]
    text:
      en: 'Late in his reign a basalt stele was carved with a prologue, some 282 laws on property, trade, family and labour, and an epilogue. Where it first stood is not certain.'
      zh: '汉谟拉比在位晚年，一块玄武岩石碑刻上了序言、约二百八十二条涉及财产、交易、家庭与劳作的法律和结语。它最初立在哪座城，说法不一。'
    line:
      en: 'About 1754 BC, late in Hammurabi''s reign: a basalt stele carved with nearly three hundred laws is set up.'
      zh: '约前 1754 年，汉谟拉比在位的晚年，一块刻着近三百条法律的玄武岩石碑立了起来。'
  copies:
    date: '-1750'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [hammurabi_code_wiki, hammurabi_louvre_copy]
    text:
      en: 'The laws were copied onto clay tablets and studied by scribes for more than a thousand years; these copies now fill in much of what is missing on the stone.'
      zh: '这些法律被抄在泥板上，书吏传习了一千多年；今天石碑上缺掉的条文，大半靠这些抄本补回。'
  death:
    date: '-1750'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [hammurabi_code_wiki, hammurabi_britannica]
    text:
      en: 'Hammurabi died around 1750 BC.'
      zh: '汉谟拉比约在前 1750 年去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: 'About 1750 BC: Hammurabi dies.'
      zh: '约前 1750 年，汉谟拉比去世。'
  susa:
    date: '-1150'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hammurabi_babylon_primary, hammurabi_code_wiki, hammurabi_history_com]
    text:
      en: 'In the twelfth century BC the Elamite king Shutruk-Nahhunte carried the stele to Susa, and several columns at the foot of its face were later scraped smooth.'
      zh: '前十二世纪，埃兰王舒特鲁克-纳洪特把石碑运到了苏萨，碑面下部后来有几栏被磨平。'
    line:
      en: 'Twelfth century BC: the stele is carried to Susa, and several columns of its text are scraped away.'
      zh: '前十二世纪，石碑被运到苏萨，碑上有几栏文字被磨去。'
  found:
    date: '1901'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hammurabi_find_record, hammurabi_history_com, hammurabi_code_wiki]
    text:
      en: 'In the winter of 1901 to 1902 a French expedition under Jacques de Morgan found the stele at Susa in three pieces; it was taken to the Louvre, and Vincent Scheil published the text in 1902.'
      zh: '1901 年到 1902 年之交的冬天，雅克·德摩根带领的法国考古队在苏萨找到断成三块的石碑，运到了卢浮宫，1902 年舍伊尔发表了碑文。'
    line:
      en: '1901: a French expedition digs the stele up at Susa, broken in three.'
      zh: '1901 年，法国考古队在苏萨挖出这块石碑，已断成三块。'
