    text:
      en:
        name: Law set in stone
        place: Babylon
        figure: Hammurabi
        story: 'The Louvre''s Old Babylonian stele preserves decisions concerning property, trade, labour and other matters. Its exact original location is uncertain.'
        relic: A clay cylinder seal
        relic_desc: A small stone cylinder that rolls a signature into clay.
        points:
          p1: 'Help the scribes copy the whole text of the stele onto more clay tablets and send them to other cities, so that every law can still be read after part of the stone is scraped away'
        points_fail:
          p1: 'The full text stayed in the copies there already were. In this branch, after the stone was carried to Susa and part of it scraped, some of the laws were still lost.'
        shift:
          p1:
            was: 'In the twelfth century BC the stele was carried off to Susa and several columns of its text were scraped away; clay copies have restored about thirty of the missing laws, and the rest are still unknown.'
            now: '{staff} helped the scribes make more full copies and send them to other cities. In this timeline every law on the stele can still be read.'
            who: hammurabi_babylon
            bio: 'In this line every one of Hammurabi''s laws came down complete, and nothing that was scraped from the stone was lost.'
        vignettes:
          condition: 'The apprentice skips a sign when he reads the condition aloud. You ask him to start the clause again. The listener now catches when the obligation applies.'
          case: 'The apprentice gives you the same answer twice. You change one detail in the imaginary example and ask him to decide again. He has to go back to the line about the kind of property.'
          edge: 'You set the clay practice tablet where the light catches its angled impressions. The apprentice follows the line without losing the first sign.'
      zh:
        name: 刻在石头上的法律
        place: 巴比伦
        figure: 汉谟拉比
        story: '卢浮宫藏古巴比伦石碑刻有财产、交易、劳作等方面的条文。'
        relic: 一枚泥印滚筒
        relic_desc: 一个小石柱，在泥上一滚就留下签名。
        points:
          p1: '帮书吏把石碑全文多抄几块泥板，送到别的城里存放，后世石上被磨掉的那几栏也能读全'
        points_fail:
          p1: '全文照旧只有原来那些抄本，这条分支里石碑被搬到苏萨、磨去几栏以后，还是有几条法律再也读不到。'
        shift:
          p1:
            was: '公元前十二世纪，石碑被埃兰人搬到苏萨，碑文被磨去几栏；靠泥板抄本补回了约三十条，其余至今不知道写的是什么。'
            now: '{staff}帮书吏多抄了几份全文，送到别的城里存放，这条时间线里石碑上的每一条法律都还读得到。'
            who: hammurabi_babylon
            bio: 'IF 线里，汉谟拉比的法律一条不缺地传了下来，石上磨掉的部分也没有失去。'
        vignettes:
          condition: '学徒念条件时漏过一个字。你请他从条首重念，听的人这才弄清什么时候才有这项义务。'
          case: '学徒两次答得一样。你换了假设例子里的一个细节再问，他只好回去看写明财物种类的那一行。'
          edge: '你把练习泥板挪到斜光能照到楔痕的地方。学徒从第一个字起一路念了下来。'
text:
  en:
    name: Hammurabi
    text: King of Babylon, who reigned from about 1792 BC to about 1750 BC. A stele inscribed with nearly three hundred laws, setting penalties and rules for trade, family and property, is named after him.
  zh:
    name: 汉谟拉比
    text: 巴比伦国王，约公元前 1792 年至约公元前 1750 年在位。一块刻有近三百条法律的石碑以他命名，规定了交易、家庭和财产方面的规则与惩罚。
