events:
- angkor_wat
text:
  en:
    name: The Khmer builders
    text: The builders of the temple complex of Angkor Wat, raised in the first half of the twelfth century under the Khmer king Suryavarman II. Its design follows the model of a mountain at the centre of the world, and its walls carry long carved reliefs. The names of the architects are not known.
  zh:
    name: 高棉的建造者们
    text: 吴哥窟寺庙群的建造者，建于十二世纪上半叶，在高棉国王苏利耶跋摩二世治下。设计仿照世界中心的须弥山，围墙上刻有长卷浮雕。建筑师的名字没有留下。
