    text:
      en:
        name: 'A room on the far bank'
        place: 'Fustat'
        figure: 'Ibn al-Haytham'
        story: 'Fustat suffered fires during unrest in 1020. Ibn al-Haytham’s optical work belonged to his years in Egypt. In this branch he is meeting a reader who has a borrowed optical manuscript in one of the affected streets.'
        story_prose:
          opening:
            - 'Fustat, 1020. The chronicles describe fires leaving homes and belongings ruined. During his years in Egypt, Ibn al-Haytham studied how light reaches the eye.'
            - 'In history, homes were lost in the fires. The sources do not place Ibn al-Haytham on a particular street. In this branch a reader with whom he planned to go over some pages lives in one of the affected streets.'
            - 'Someone who can stay clear-headed and give directions can help. The manuscript can be read later. First find out whether the reader can make it as far as the end of the street.'
          points:
            p1: 'When {staff} finds the reader, the light has already faded behind his door. He wants to go back for another page. {staff} asks him to bring out the stack he has and leave by the way the neighbours have cleared. In a house that can put him up, he sits with the uneven stack on his knees. A sheet slips to the floor. The person across from him picks it up and puts it back where he points.'
          outcomes:
            all: 'Ibn al-Haytham comes to see him later. The household has only one stool, so the two sit by a low table and look for the page again.'
            p1: 'Ibn al-Haytham comes to see him later. The household has only one stool, so the two sit by a low table and look for the page again.'
          none: 'The street eventually closes. When Ibn al-Haytham asks, all he can do is fold the slip recording the loan into his hand.'
          not_admitted: '{staff} waits at the far end of the street for someone to show the way. A voice calls to shut a door, and soon cannot be heard clearly.'
          excerpts:
            p1: 'A sheet slips to the floor. The person across from him picks it up and puts it back where he points.'
        relic: 'A spare set of leaves'
        relic_desc: 'An imagined set of optical notes entrusted to another household in the branch.'
        points:
          p1: 'Get the reader out before the fire reaches the street and find a safe place for the borrowed manuscript'
        points_fail:
          p1: 'The employee did not reach the reader in time to help them leave with the borrowed pages.'
        shift:
          p1:
            was: '1020: parts of Fustat were set on fire during unrest. The record does not say where Ibn al-Haytham or his manuscripts were that day.'
            now: '{staff} takes the reader to a household outside the affected streets. Ibn al-Haytham can resume going through the manuscript with the reader there.'
            who: al_haytham_cairo
            bio: 'During the fires at Fustat, a reader and the pages entrusted to them reached safety.'
      zh:
        name: '借来的那叠光学笔记'
        place: '福斯塔特'
        figure: '伊本·海赛姆'
        story: '1020 年，福斯塔特在动乱中失火。伊本·海赛姆曾在埃及研究光学。在这条分支里，他约了一位读者讨论光学，借出的手稿正在受灾的街上。'
        story_prose:
          opening:
            - '1020 年的福斯塔特。编年史说城中几处失火，许多住处和物件没能保住。伊本·海赛姆在埃及这些年研究光怎样进入眼睛。'
            - '史实里，火烧到了住人的街区，史料并未记伊本·海赛姆当天在哪里。在这条分支里，一位约好同他读稿的人住在受灾的街上。'
            - '这趟需要临急还能说得清路的人。手稿可以稍后翻看，先得知道读稿的人能不能走到街口。'
          points:
            p1: '{staff}找到读者时，门里的光已经暗下来。那人想再进去找一页稿，{staff}请他先把手上的一叠带出来，顺着街坊空出的路离开。等到了能暂住的人家，他坐下，把那叠没有齐边的纸放到膝上。一张纸滑下来。对面的主人弯腰拾起，放回那人指着的地方。'
          outcomes:
            all: '稍后伊本·海赛姆来看他。家里只有一张凳子，两个人便在矮桌旁坐下，把那一页重新找出来。'
            p1: '稍后伊本·海赛姆来看他。家里只有一张凳子，两个人便在矮桌旁坐下，把那一页重新找出来。'
          none: '街口后来堵住了。伊本·海赛姆来问时，只能把借稿的纸签折进自己手里。'
          not_admitted: '{staff}在街外等不到领路的人。门洞里有人喊关门，声音很快就听不清了。'
          excerpts:
            p1: '一张纸滑下来。对面的主人弯腰拾起，放回那人指着的地方。'
        relic: '另托的一叠稿纸'
        relic_desc: '分支里的光学笔记，临时托给另一户人家保管。'
        points:
          p1: '赶在火势蔓延之前带读者离开，并给借出的手稿找到一处能存放的地方'
        points_fail:
          p1: '员工没能及时赶到，帮读者带着那叠稿纸离开。'
        shift:
          p1:
            was: '1020 年，福斯塔特一些街区在动乱中失火。史料没记伊本·海赛姆及其手稿当日所在。'
            now: '{staff}把读者带到远离受灾街区的人家。伊本·海赛姆后来仍能和那位读者一起读这份手稿。'
            who: al_haytham_cairo
            bio: '福斯塔特失火时，一位读者和寄在他手里的光学稿纸一同到了安全的地方。'
text:
  en:
    name: Ibn al-Haytham
    text: Arab scholar of mathematics and optics, about 965 to about 1040, who worked in Cairo. His Book of Optics argued that vision comes from light entering the eye and relied on experiments, which makes him an early figure of the experimental method.
  zh:
    name: 伊本·海赛姆
    text: 阿拉伯数学家与光学家，约 965 年生，约 1040 年去世，在开罗工作。他的《光学书》提出视觉来自进入眼睛的光，并依靠实验论证，被视为实验方法的早期代表。
