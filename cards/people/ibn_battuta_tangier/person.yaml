self_check:
  fact: alone
  quote_line: '他一个人走的。后来他回忆，那天既没有旅伴，也没有商队可以跟。'
  regret_choice: '派会张罗的去，干粮水囊备得齐，城门口却未必送得到；派细心的去，第一程的城镇写清了，家里的人却未必认得下。'
  bookend: '从他一个人走出城门开始，以近三十年后他回到家乡收尾。'
  share_line: '1325 年 6 月，我在丹吉尔送一个年轻人走到了城门口。'
  share_number: '1325'
  knowing: 'return'
  near: 'departure, alone'
  lever: 'p1, p2'
