    scene:
      points:
        - {id: p1, kind: trust, day: 8, req: {"any":[{"trait":["kind","cheerful","attached"]},{"job":["cook","chef"]},{"stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 12, req: {"any":[{"trait":["methodical","scholarly","wanderer"]},{"stat":{"wit":6}}]}}
        - {id: p3, kind: trust, day: 13.2, req: {"any":[{"trait":["curious","attached","faithful"]},{"stat":{"will":6}}]}}
