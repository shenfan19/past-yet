    # finished: in the game with release.ready_only
    ready: true
    refs: [ibn_battuta_tangier_departure, orias_ibn_battuta, worldhistory_ibn_battuta]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: endure, guard: true, day: 70, req: {"any":[{"job":["doctor","physician","nurse","paramedic","caregiver"]},{"stat":{"constitution":9}},{"item":"painkiller","stat":{"will":6}}]}}
        - {id: p2, kind: care, day: 40, req: {"any":[{"job":["doctor","physician","nurse","paramedic"],"item":"ors_pack","any":[{"item":"water_flask"}]},{"provides":"heal"}]}}
