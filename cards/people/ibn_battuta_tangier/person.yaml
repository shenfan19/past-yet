    text:
      en:
        name: 'Before the road grows long'
        place: Tangier, Morocco
        figure: Ibn Battuta
        story: 'In June 1325, Ibn Battuta left his native Tangier. In the Rihla he recalled setting out without a companion or a caravan, leaving both parents behind. Nearly three decades of journeys went into the account he dictated to Ibn Juzayy after returning to Morocco.'
        story_prose:
          opening:
            - 'Tangier, Morocco, June 1325. Ibn Battuta, in his early twenties, is about to set out on a long journey, and both his parents are still at home. Nearly thirty years later he came home and dictated what he had seen to Ibn Juzayy, and it became the Rihla.'
            - 'In history, he went out of the town gate alone, with no companion and no caravan to join. At Miliana the two envoys of the sultan of Tunis he had caught up with both fell ill in the heat, and one of them died after three nights by a stream outside the town; past Bejaia the fever took him again, and he tied himself to the saddle with his turban cloth; on the day he entered Tunis, not one of the people who came out of the town knew him, and he could not keep back his tears. In this branch, a neighbour fills the water skins at the fountain, and a porter at the edge of town knows only the first stretch of road.'
            - 'A few kinds of people can help on this trip: someone who knows nursing and has brought enough rehydration salts and water; someone very tough, or someone with painkillers who can grit their teeth, to last out the heat and the jolting; someone warm-hearted who will step forward at a strange town gate.'
          outcomes:
            all: 'That autumn both envoys of the sultan of Tunis came home to the town. Ibn Battuta stayed two months in Tunis, and the one who had walked in with him that day often came by where he lodged to sit a while. Later he went on east with a larger caravan.'
            p2: 'That autumn the two envoys rode back into Tunis one behind the other. The one who had been ill rode second, the water bowl from the stream hanging at his saddle.'
            p3: 'He stayed two months in Tunis. The one who had walked in with him that day often came by where he lodged to sit a while, and mostly they talked about the road.'
            p1: 'He never left the saddle, and held on as far as Tunis. The turban cloth went back round his head afterwards, and went a long way east with him.'
          none: 'In July, by the stream outside Miliana, the caravan stopped three nights, and one of the envoys did not get up again. In September, at the gate of Tunis, the people who came out called other men''s names, and he stood at the edge of the crowd holding the reins and wept aloud.'
          desync: 'In August, past Constantine, the knot came loose. When {staff} was recalled, the caravan had stopped in the middle of the road, and the turban cloth hung from the empty saddle, one end still tied, the other trailing on the ground.'
          not_admitted: '{staff} never found a footing in Tangier, and carried water a few times at the fountain for the neighbour. Early on 14 June a young man led his animal out of the town gate, with no companion beside him and no caravan behind.'
          points:
            p2:
              class_medical: 'July, by a stream four miles outside Miliana. Both envoys had fallen ill in the heat, and the caravan had stopped three nights by the water; the worse of the two lay there and barely opened his eyes when spoken to. {staff}, as nursing teaches, stirred two packets of rehydration salts into the cooled boiled water in the flask, lifted his head and gave it to him a mouthful at a time, and laid a wet cloth on his forehead and the back of his neck, changing it every so often. On the fourth morning he sat up by himself, held the water bowl in both hands and drank it dry, and handed it back. The caravan packed up to move on, and the stream was still running loud between the stones.'
              else: 'July, by a stream four miles outside Miliana. Both envoys had fallen ill in the heat, and the caravan had stopped three nights by the water; the worse of the two lay there and barely opened his eyes when spoken to. {staff} opened the medical kit brought along, brought his fever down, and stayed beside him all night without sleeping, waiting while he got the water down a mouthful at a time. On the fourth morning he sat up by himself, held the water bowl in both hands and drank it dry, and handed it back. The caravan packed up to move on, and the stream was still running loud between the stones.'
            p1:
              class_medical: 'August, past Constantine: the fever came back on Ibn Battuta. At Bejaia a friend had already urged him to stay until he was well, and he had not stayed. This time he tied himself to the saddle with his turban cloth, afraid that the fever would leave him too weak and he would fall. {staff}, as nursing teaches, felt his forehead and his wrist at every halt, changed the wet cloth again and again, watched him swallow his water, and pulled the knot tight for him once more. At night, when the caravan halted, he was still in the saddle, slumped over the animal''s neck. When the water skin was held to his lips he drank two mouthfuls, then reached down and felt the knot all over again.'
              else: 'August, past Constantine: the fever came back on Ibn Battuta. At Bejaia a friend had already urged him to stay until he was well, and he had not stayed. This time he tied himself to the saddle with his turban cloth, afraid that the fever would leave him too weak and he would fall. {staff} walked beside his animal the whole way, one hand on the reins, and each time he swayed reached up and pushed him back into the saddle, all day in the sun without changing hands. At night, when the caravan halted, he was still in the saddle, slumped over the animal''s neck. When the water skin was held to his lips he drank two mouthfuls, then reached down and felt the knot all over again.'
            p3: 'September, and the caravan came to Tunis. The people of the town came out, calling the merchants of the party by name and taking them by the hand one after another. Nobody knew Ibn Battuta; he stood at the edge of the crowd, still holding the reins. {staff}, who had talked with him a good deal on the road, came up beside him, called him by name, and asked where he was sleeping that night. He wiped his face with his sleeve and moved the reins he had held the whole way into his other hand. The two of them, one behind the other, walked past the welcoming crowd and in through the gate.'
          excerpts:
            p2: 'On the fourth morning he sat up by himself, held the water bowl in both hands and drank it dry, and handed it back. The caravan packed up to move on, and the stream was still running loud between the stones.'
            p3: 'He wiped his face with his sleeve and moved the reins he had held the whole way into his other hand. The two of them, one behind the other, walked past the welcoming crowd and in through the gate.'
            p1: 'At night, when the caravan halted, he was still in the saddle, slumped over the animal''s neck. When the water skin was held to his lips he drank two mouthfuls, then reached down and felt the knot all over again.'
        relic: A travel-worn sandal
        relic_desc: A leather sandal resoled many times.
        points:
          p1: 'On the road from Bejaia, keep him in the saddle through the fever until he reaches Tunis'
          p2: 'At Miliana, save the envoy of Tunis who fell ill in the heat'
          p3: 'On the day he enters Tunis, let him know he is not alone in a strange town'
        points_fail:
          p1: 'Halfway through the fever he fell from the saddle, and in this branch he never reached Tunis.'
          p2: 'The envoy died by the stream outside Miliana as history has it, and in this branch only one envoy went on towards Tunis.'
          p3: 'He wept aloud at the gate as history has it, and in this branch the only one who walked into the town with him that day was a fellow traveller.'
        shift:
          p1:
            was: 'In the summer of 1325 Ibn Battuta set out from Bejaia with a high fever and held on all the way to Tunis.'
          p2:
            was: 'In the summer of 1325, both envoys of the sultan of Tunis fell ill from the heat at Miliana, and one of them died after three nights by a stream outside the town.'
            now: '{staff} sat with him by the stream until he cooled and drank, and when they left Miliana both envoys were with the caravan. He later came home to Tunis; what came after is not recorded.'
          p3:
            was: 'In 1325, on the day he entered Tunis, nobody came to greet him, and he wept.'
            now: 'On the day he entered the town, he had at his side someone he had come to know on the road, and in the two months he stayed in Tunis he was no longer alone.'
        vignettes:
          distance: '{staff} writes the far destination on one slip and the first night''s stop on another, so a porter can use the second today.'
          departure: '{staff} keeps the heading of a packing list but leaves a blank line under it for where the traveller will truly stop.'
          roll: '{staff} rolls two slips together, the purpose and the first stage, and at the edge of town hands back the one a porter can use and keeps the other.'
      zh:
        name: '长途还只有第一站'
        place: 摩洛哥丹吉尔
        figure: 伊本·白图泰
        story: '1325 年六月，伊本·白图泰离开故乡丹吉尔。他在《游记》里回忆，父母都还在家，而他出门时没有旅伴，也没有商队可以跟随。他回到摩洛哥后，把前后近三十年的行旅见闻口述给伊本·朱扎伊。'
        story_prose:
          opening:
            - '1325 年六月，摩洛哥丹吉尔。二十出头的伊本·白图泰要出一趟远门，父母都还在家。近三十年后他才回到家乡，把一路见闻口述给伊本·朱扎伊，编成了《游记》。'
            - '史实里，他是一个人出的城门，没有旅伴，也没有商队可以跟。到了米利亚纳，他追上的突尼斯苏丹的两位使节都在暑热里病倒，其中一位在城外溪边停了三夜后去世；过了贝贾亚，他又发起高烧，拿缠头布把自己绑在鞍上；进突尼斯那天，迎出城来的人里没有一个认得他，他忍不住哭了。在这条分支里，泉边有个替人灌满水囊的邻家妇人，城边有个只认得头一段路的挑夫。'
            - '这一趟用得上几种人：懂医护、带够了补液和水的人；身子骨极结实，或带着止痛药、咬得住牙的人，熬得过一路暑热和颠簸；心肠热、肯在陌生城门口走上前去的人。'
          outcomes:
            all: '那年秋天，突尼斯苏丹的两位使节都回到了城里。伊本·白图泰在突尼斯住了两个月，进城那天陪着他的人，那些日子常来他住的地方坐一坐。后来他跟着一支更大的商队，又往东去了。'
            p2: '那年秋天，两位使节一前一后回到了突尼斯。病过一场的那位走在后面，鞍边挂着那只在溪边用过的水碗。'
            p3: '他在突尼斯住了两个月。进城那天陪着他的人，那些日子常来他住的地方坐一坐，两人说的多半是路上的事。'
            p1: '他一路没有下鞍，撑到了突尼斯。那条缠头布后来又缠回了他的头上，跟着他往东走了很远。'
          none: '七月，米利亚纳城外的溪边停了三夜，一位使节没有再起来。九月，突尼斯城门口，迎出来的人叫着别人的名字，他攥着缰绳站在人群边上，哭出了声。'
          desync: '八月，过了君士坦丁，那个结松开了。{staff}被召回时，商队停在路当中，那条缠头布一头还系在空鞍上，垂到了地上。'
          not_admitted: '{staff}没能在丹吉尔落下脚，只在泉边帮那位邻家妇人提了几趟水。六月十四日一早，一个年轻人牵着牲口出了城门，身边没有旅伴，后面也没有商队。'
          points:
            p2:
              class_medical: '七月，米利亚纳城外，离城四英里的一条溪边。两位使节都在暑热里病倒了，队伍已经在溪边停了三夜，病得重的那位躺着，叫他也只睁一睁眼。{staff}照医护的法子，把两包补液盐兑进保温壶里的凉开水，扶起他的头一口一口喂，又把浸湿的布搭在他的额头和颈后，隔一阵换一回。第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。'
              else: '七月，米利亚纳城外，离城四英里的一条溪边。两位使节都在暑热里病倒了，队伍已经在溪边停了三夜，病得重的那位躺着，叫他也只睁一睁眼。{staff}打开随身带的药箱，给他退了烧，守在他身边，等他一口一口把水咽下去，一夜没有合眼。第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。'
            p1:
              class_medical: '八月，过了君士坦丁，伊本·白图泰又发起烧来。在贝贾亚时就有朋友劝他留下养病，他没有留。这回他拿缠头布把自己绑在鞍上，怕烧得没了力气栽下去。{staff}照医护的规矩，每到歇脚就摸他的额头和手腕，把湿布换了又换，看着他把水咽下去，又替他把布结重新勒紧。夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。'
              else: '八月，过了君士坦丁，伊本·白图泰又发起烧来。在贝贾亚时就有朋友劝他留下养病，他没有留。这回他拿缠头布把自己绑在鞍上，怕烧得没了力气栽下去。{staff}一路走在他的牲口旁边，一手牵着缰绳，他身子一歪，就伸手把他托回鞍上，晒了一整天也没换过手。夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。'
            p3: '九月，商队到了突尼斯。城里的人迎出来，叫着同行商人的名字，一个个拉住手问候。没有人认得伊本·白图泰，他站在人群边上，手里还攥着缰绳。{staff}一路上和他说过不少话，这时走到他身边，喊了他的名字，问他今晚住在哪里。他用袖口抹了一把脸，把攥了一路的缰绳换到另一只手上。两个人一前一后，从迎人的人群旁边走进了城门。'
          excerpts:
            p2: '第四天早上，他自己撑着坐了起来，两手捧着水碗喝干了，把碗递还回来。队伍收拾上路，溪水还在石头缝里响。'
            p3: '他用袖口抹了一把脸，把攥了一路的缰绳换到另一只手上。两个人一前一后，从迎人的人群旁边走进了城门。'
            p1: '夜里队伍歇下，他还坐在鞍上，人伏在牲口的脖子上。水囊递到嘴边，他喝了两口，又伸手把那个结摸了一遍。'
        relic: 一只走旧的凉鞋
        relic_desc: 一只补过很多次底的皮凉鞋。
        points:
          p1: '从贝贾亚往突尼斯那一路，护住他带着高烧撑在鞍上，走到突尼斯'
          p2: '在米利亚纳救下那位病倒在暑热里的突尼斯使节'
          p3: '进突尼斯那天，让他知道他在异乡不是一个人'
        points_fail:
          p1: '烧到一半他从鞍上栽了下来，这条分支里他没有走到突尼斯。'
          p2: '那位使节照史实死在米利亚纳外的溪边，这条分支里往突尼斯去的只剩一位使节。'
          p3: '他照史实在城门口哭出声来，这条分支里那天陪他进城的只有那位同行的旅伴。'
        shift:
          p1:
            was: '1325 年夏天，伊本·白图泰发着高烧从贝贾亚上路，一路撑到了突尼斯。'
          p2:
            was: '1325 年夏天，突尼斯苏丹的两位使节在米利亚纳都因暑热病倒，其中一位在城外的溪边停了三夜后去世。'
            now: '{staff}在溪边守着他降了温、喝下了水，离开米利亚纳时两位使节都在队伍里。他后来回到了突尼斯，此后的事没有记载。'
          p3:
            was: '1325 年，进突尼斯那天没有人上前问候他，他忍不住哭了出来。'
            now: '进城那天他身边多了一个一路认识的人，在突尼斯住下的两个月里他不再是一个人。'
        vignettes:
          distance: '{staff}把最远的目的地写在一张纸条上，今晚落脚的地方另写一张，挑夫今天用得上第二张。挑夫把它折了两折，塞进腰带里。'
          departure: '{staff}留着行李单上的题头，底下空出一行，给旅人真正落脚的地方，墨还没干，就拿在风里晃了晃。'
          roll: '{staff}把目的和第一程各写一条，卷在一起，到了城边，路上已经起了尘土，把挑夫当天用得上的那张递过去，自己留下另一张。'
text:
  en:
    name: Ibn Battuta
    text: Moroccan traveller from Tangier, 1304 to about 1369. His Rihla, compiled after his return, describes journeys through North Africa, Arabia, India, China and West Africa over nearly three decades.
  zh:
    name: 伊本·白图泰
    text: 摩洛哥旅行家，丹吉尔人，1304 年生，约 1369 年去世。他的《游记》在归来后编成，记有近三十年间在北非、阿拉伯、印度、中国和西非的见闻。
quotes:
  ibn_battuta_birds_nests:
    order: 1
    tier: full
    date: '1355'
    checked: two_sources
    sources: [ibn_battuta_iccr_departure, ibn_battuta_mithaq_departure]
    original: ar
    text:
      ar: {who: 'ابن بطوطة', quote: 'وفارقت وطني مفارقة الطيور للوكور', occasion: 'الرحلة، في ذكر الخروج من طنجة'}
      en: {who: 'Ibn Battuta', quote: 'I left my homeland as birds leave their nests.', occasion: 'The Rihla, as told to Ibn Juzayy, recalling his departure in June 1325 (game translation)'}
      zh: {who: '伊本·白图泰', quote: '我离开故乡，就像飞鸟离开巢穴。', occasion: '《游记》口述给伊本·朱扎伊，回忆 1325 年六月离开丹吉尔（本游戏译）'}
  ibn_battuta_parting:
    order: 2
    tier: none
    date: '1355'
    checked: two_sources
    sources: [ibn_battuta_edition_tazi, ibn_battuta_mithaq_departure]
    original: ar
    text:
      ar: {who: 'ابن بطوطة', quote: 'وكان والديّ بقيد الحياة، فتحملت لبعدهما وصبا، ولقيت كما لقيا من الفراق نصبا', occasion: 'الرحلة، في ذكر مفارقة الوالدين عند الخروج من طنجة'}
      en: {who: 'Ibn Battuta', quote: 'My parents were still alive. I bore the pain of being far from them, and the parting weighed on me as it weighed on them.', occasion: 'The Rihla, as told to Ibn Juzayy, recalling parting from his parents in June 1325 (game translation)'}
      zh: {who: '伊本·白图泰', quote: '那时父母还在世。远离他们，我心里难过；离别让他们受苦，也让我受苦。', occasion: '《游记》口述给伊本·朱扎伊，回忆 1325 年六月与父母分别（本游戏译）'}
hook: {en: 'Which road do you write down before leaving home?', zh: '临出门，该写下一站还是最后想去的地方？'}
