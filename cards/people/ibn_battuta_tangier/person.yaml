    text:
      en: 'The first-person account recalls leaving Tangier in 1325 with the intention of pilgrimage. It is a later account of departure, not a diary entry taken on the road.'
      zh: '第一人称叙事回忆 1325 年离开丹吉尔时有意朝圣。它是后出的出发回忆，未当作路上当天所记的日记。'
