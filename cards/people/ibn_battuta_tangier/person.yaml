    text:
      en:
        name: 'Before the road grows long'
        place: Tangier, Morocco
        figure: Ibn Battuta
        story: 'On 14 June 1325, by most accounts, Ibn Battuta left his native Tangier, about twenty one, to make the pilgrimage to Mecca. In the Rihla he recalled setting out alone, with neither a companion nor a caravan to join. He came home some three decades later, at the end of 1353 or in 1354, and dictated his travels to Ibn Juzayy.'
        relic: A travel-worn sandal
        relic_desc: A leather sandal resoled many times.
        points:
          p1: 'On the road from Bejaia, keep him in the saddle through the fever until he reaches Tunis'
          p2: 'At Miliana, save the envoy of Tunis who fell ill in the heat'
          p3: 'On the day he enters Tunis, let him know he is not alone in a strange town'
        points_fail:
          p1: 'Halfway through the fever he fell from the saddle, and in this branch he never reached Tunis.'
          p2: 'The envoy died by the stream outside Miliana as history has it, and in this branch only one envoy went on towards Tunis.'
          p3: 'He wept aloud at the gate as history has it, and in this branch the only one who walked into the town with him that day was the fellow pilgrim.'
        branch:
          p2:
            - 'In history, in the summer of 1325, both envoys of the sultan of Tunis fell ill from the heat at Miliana, and one of them died after three nights by a stream outside the town.'
            - 'In this branch {staff} sat with him by the stream until he cooled and drank, and when they left Miliana both envoys were with the caravan.'
            - 'In this branch he later came home to Tunis; what came after is not recorded.'
          p3:
            - 'In this branch, on the day he entered the town, he had at his side someone he had come to know on the road, and in the two months he stayed in Tunis he was no longer alone.'
        vignettes:
          distance: '{staff} writes the far destination on one slip and the first night''s stop on another, so a porter can use the second today.'
          departure: '{staff} keeps the heading of a packing list but leaves a blank line under it for where the traveller will truly stop.'
          roll: '{staff} rolls two slips together, the purpose and the first stage, and at the edge of town hands back the one a porter can use and keeps the other.'
      zh:
        name: '长途还只有第一站'
        place: 摩洛哥丹吉尔
        figure: 伊本·白图泰
        story: '多数说法是 1325 年 6 月 14 日，二十一岁上下的伊本·白图泰离开家乡丹吉尔，去麦加朝圣。他在《游记》里回忆，那天是独自上路，既没有同行的旅伴，也没有可以随行的商队。约三十年后，1353 年底或 1354 年他才回到家乡，把一路见闻口述给伊本·朱扎伊。'
        relic: 一只走旧的凉鞋
        relic_desc: 一只补过很多次底的皮凉鞋。
        points:
          p1: '从贝贾亚往突尼斯那一路，护住他带着高烧撑在鞍上，走到突尼斯'
          p2: '在米利亚纳救下那位病倒在暑热里的突尼斯使节'
          p3: '进突尼斯那天，让他知道他在异乡不是一个人'
        points_fail:
          p1: '烧到一半他从鞍上栽了下来，这条分支里他没有走到突尼斯。'
          p2: '那位使节照史实死在米利亚纳外的溪边，这条分支里往突尼斯去的只剩一位使节。'
          p3: '他照史实在城门口哭出声来，这条分支里那天陪他进城的只有那位同行的朝圣者。'
        branch:
          p2:
            - '历史上，1325 年夏天，突尼斯苏丹的两位使节在米利亚纳都因暑热病倒，其中一位在城外的溪边停了三夜后去世。'
            - '这条分支里，{staff}在溪边守着他降了温、喝下了水，离开米利亚纳时两位使节都在队伍里。'
            - '这条分支里，他后来回到了突尼斯，此后的事没有记载。'
          p3:
            - '这条分支里，进城那天他身边多了一个一路认识的人，在突尼斯住下的两个月里他不再是一个人。'
        vignettes:
          distance: '{staff}把最远的目的地写在一张纸条上，今晚落脚的地方另写一张，挑夫今天用得上第二张。'
          departure: '{staff}留着行李单上的题头，底下空出一行，给旅人真正落脚的地方。'
          roll: '{staff}把目的和第一程各写一条，卷在一起，到了城边，把挑夫当天用得上的那张递过去，自己留下另一张。'
text:
  en:
    name: Ibn Battuta
    text: Moroccan traveller from Tangier, 1304 to about 1369. His Rihla, compiled after his return, describes journeys through North Africa, Arabia, India, China and West Africa over nearly three decades.
  zh:
    name: 伊本·白图泰
    text: 摩洛哥旅行家，丹吉尔人，1304 年生，约 1369 年去世。他的《游记》在归来后编成，记有近三十年间在北非、阿拉伯、印度、中国和西非的见闻。
hook: {en: 'Which road do you write down before leaving home?', zh: '临出门，该写下一站还是最后想去的地方？'}
facts:
  departure:
    date: '1325-06-14'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [orias_ibn_battuta, worldhistory_ibn_battuta]
    text:
      en: 'Ibn Battuta left Tangier on 14 June 1325 by most accounts, some say 13 June, to make the pilgrimage to Mecca, aged about twenty one.'
      zh: '多数说法是 1325 年 6 月 14 日，也有说 13 日，伊本·白图泰离开丹吉尔去麦加朝圣，那时二十一岁上下。'
    line:
      en: '14 June 1325: Ibn Battuta, about twenty one, leaves Tangier for the pilgrimage to Mecca.'
      zh: '1325 年 6 月 14 日，二十一岁上下的伊本·白图泰离开丹吉尔，去麦加朝圣。'
  alone:
    date: '1325'
    stay_day: 13.4
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ibn_battuta_tangier_departure]
    text:
      en: 'In the opening of the Rihla he recalls that he set out alone, with neither a companion to cheer him nor a caravan to join.'
      zh: '他在《游记》开篇回忆，自己是独自出发的，没有可以作伴的旅伴，也没有可以加入的商队。'
    line:
      en: 'He goes alone. Later he will remember that he had neither a companion nor a caravan to join.'
      zh: '他一个人走的。后来他回忆，那天既没有旅伴，也没有商队可以跟。'
  return:
    date: '1354'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [worldhistory_ibn_battuta, orias_ibn_battuta]
    text:
      en: 'He came home at the end of 1353 or in 1354, after nearly three decades of travel, and dictated his account to the secretary Ibn Juzayy.'
      zh: '近三十年后，他在 1353 年底或 1354 年回到家乡，把一路见闻口述给书记官伊本·朱扎伊。'
    line:
      en: 'About 1354: after nearly thirty years on the road, he comes home and dictates his travels to Ibn Juzayy.'
      zh: '1354 年前后，走了近三十年的他回到家乡，把一路见闻口述给伊本·朱扎伊。'
