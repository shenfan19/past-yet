    text:
      en:
        name: Hindu-Arabic numerals reach Europe
        place: Pisa
        figure: Fibonacci
        story: 'Leonardo of Pisa wrote the Liber abaci in 1202. Its surviving 1228 revision explains the nine Indian digits and zero.'
        relic: A wax tablet of numerals
        relic_desc: A tablet with the ten new numerals set out beside the old Roman ones.
        points:
          p1: 'Keep the beginning, ending and examples of Leonardo’s first Liber abaci together so the compilation of 1202 can be completed'
          p2: 'Have an apprentice in Pisa work through an example and point out the step that needs another line of explanation'
          p3: 'Secure a complete early copy in Pisa and have Leonardo mark it so later examples can be compared separately'
        points_fail:
          p1: 'Only scattered examples circulate, and the complete compilation cannot be handed over. The office recalls the employee.'
          p2: 'The apprentice remembers the answer but cannot start a transaction in a different form.'
          p3: 'After the author revises the work, borrowers know only the new copy and cannot recover the first compilation.'
        shift:
          p1:
            was: 'The surviving revision refers to an initial version composed in 1202. Most surviving manuscripts reflect the revision of 1228.'
          p2:
            was: 'Liber abaci uses many worked examples, including problems that arise in trade.'
            now: 'The author hears exactly where an apprentice stopped. The next learner has an extra line to check their work.'
          p3:
            was: 'No complete first version is known to survive. The main manuscript tradition reflects the later revision.'
            now: 'The early set retains its date and examples. Later readers can put the two compilations side by side and identify newly added work.'
            who: fibonacci_pisa
            bio: 'Leonardo of Pisa drew on calculation he learned while traveling and eventually revised his first compilation substantially.'
        vignettes:
          gap: 'The clerk skips the empty column when copying the total. You put zero back into the gap and ask him to read the number again. It now agrees with the earlier reckoning.'
          tokens: 'You arrange a few counters in groups on the counter. The clerk moves one to the next column, then explains why the same mark would now mean something different.'
          copy: 'Two copies of a total are about to leave the market. You have the clerk read both back before the carriers go their separate ways.'
      zh:
        name: 印度阿拉伯数字传入欧洲
        place: 比萨
        figure: 斐波那契
        story: '比萨的莱昂纳多于 1202 年写《计算之书》。现传的 1228 年修订本开篇说明九个印度数字和零。'
        relic: 一块写着数字的蜡板
        relic_desc: 板上把十个新数字和旧的罗马数字并排写在一起。
        points:
          p1: '替列奥纳多留齐《计算之书》初稿的首尾和面向读者的例题，护住 1202 年那次编成'
          p2: '请比萨的学徒用一份例题自己算完，让他指出哪一行必须多写一步才看得懂'
          p3: '说服作者把一整套早本留在比萨，签写它以后可与新编的例题分开对照'
        points_fail:
          p1: '流出去的试读页只剩几个例子，没有能够交出的整卷，事务所因同步失败召回员工。'
          p2: '学徒能背下答案，碰到样式不同的一笔账，仍不知道从哪里起算。'
          p3: '等作者改写以后，借书人只认得后来那一套抄本，不能恢复早本。'
        shift:
          p1:
            was: '存世修订本提到《计算之书》最初写于 1202 年。现存抄本主要反映 1228 年修订。'
          p2:
            was: '《计算之书》用大量范例介绍不同计算，商贸问题居于其中。'
            now: '作者可从一个做过题的学徒那里听到具体卡住的位置，再补一行给下一位学徒核对。'
          p3:
            was: '早期编本没有完整留存，通行本文本主要来自后来的修订。'
            now: '留存的早本注明旧例和编成年份。等修订本出现，两份可并读，读者能查哪些例题是后来才补的。'
            who: fibonacci_pisa
            bio: '比萨的列奥纳多从学习和旅行中带回计算经验。他的书经历了初编和大幅改编。'
        vignettes:
          gap: '账房照抄合计时跳过空栏。你把零填回空处，请他再读一遍，这才和原先算出的数一致。'
          tokens: '你把几枚算子分列摆在柜台上。账房把一枚挪到下一列，接着讲给你听，怎么同一个记号这时就表示了另一个数。'
          copy: '两份合计马上要带出市集。两位送单人分头走之前，你请账房把两份都念一遍。'
text:
  en:
    name: Fibonacci
    text: Italian mathematician, about 1170 to about 1250, from Pisa. His 1202 Book of Calculation brought the Hindu Arabic numerals to Europe and contains the problem of the rabbits that gives the Fibonacci sequence.
  zh:
    name: 斐波那契
    text: 意大利数学家，约 1170 年生，约 1250 年去世，出身比萨。他 1202 年的《计算之书》把印度阿拉伯数字带到欧洲，书中兔子繁殖的问题产生了斐波那契数列。
