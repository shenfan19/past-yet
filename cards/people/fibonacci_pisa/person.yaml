events:
  fibonacci_pisa:
    order: 11
    build_step: 3
    year: 1202
    # two office days in the year the first version was finished; no day of that year is recorded, so the stay is counted from the arrival
    stay: 2
    lon: 10.4
    lat: 43.72
    region: europe
    home: [europe_west]
    near: [north_africa, europe_east]
    crossroads: true
    field: math
    tier: 2
    channels: {V: 1}
    # finished: in the game with release.ready_only
    ready: true
    refs: [fibonacci_pisa_primary, fibonacci_pisa_mactutor, fibonacci_pisa_dsb, fibonacci_pisa_liber_abaci_versions, fibonacci_pisa_manuscript_versions, fibonacci_pisa_wiki]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 51, req: {"any":[{"job":["archivist","tutor","bookseller"],"stat":{"wit":7,"will":6}},{"trait":["curious","scholarly"],"stat":{"wit":8,"will":6}}]}}
      vignettes:
        - {id: rabbits, traits: [curious, cheerful, kind, scholarly], day: 34}
        - {id: zero, traits: [methodical, vigil, skeptical, patient], day: 21}
        - {id: quay, day: 9}
    text:
      en:
        name: 'The first version of 1202'
        place: Pisa
        figure: Fibonacci
        story: 'Leonardo of Pisa learned to reckon with the nine Indian figures as a boy in Bugia, on the coast of North Africa, where his father worked for the merchants of Pisa. In 1202, back in Pisa, he finished the Liber abaci, which teaches the new figures and zero for counting and trade. In 1228 he revised the book, and the copies that survive come from that second version.'
        story_prose:
          opening:
            - 'Pisa, 1202. As a boy Leonardo went to Bugia on the North African coast, where his father worked for the merchants of Pisa, and there he learned to reckon with the nine Indian figures. Back in Pisa he has written the Liber Abaci, which teaches people to write numbers with these figures and the zero and to use them in buying and selling.'
            - 'In history, in 1228 he revised the book, adding new material and cutting what he thought superfluous; every copy that came down to later readers goes back to that version, and no complete copy of the first version of 1202 is known. In this branch, an apprentice in a counting house on the quay cannot see why a little circle should take up a column, and a boatman on the Arno calls out a number for every bale that comes ashore.'
            - 'Several kinds of people can help on this trip: someone who knows books and how a set of copies is kept, someone who teaches and can talk an author round, or someone studious who can say clearly how an early text and a later one differ.'
          outcomes:
            all: 'More than twenty years later the revised version was being copied in the bookshops of Pisa. The wooden chest was still there, and the early text and the new lay open side by side, readers comparing them page by page for the examples added later.'
            p1: 'More than twenty years later the revised version was being copied in the bookshops of Pisa. The wooden chest was still there, and the early text and the new lay open side by side, readers comparing them page by page for the examples added later.'
          none: 'After 1228 the bookshops of Pisa copied only the revised version. In the counting house the apprentice learned from it, writing a zero, stroke by stroke, into the empty column.'
          not_admitted: '{staff} never got through Leonardo’s door. By the Arno the boatman was still unloading bales, and on the bank someone drew one stroke after another on a board.'
          points:
            p1:
              class_lettered: '{staff} went by the rules of a keeper of books, laid the volumes of the first version out on the table and numbered them one by one, and told Leonardo that revising later was a good thing, but if this set was not kept, no one would ever know how he had first written it. Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.'
              else: '{staff} copied a few worked examples from the first version onto a wax tablet, set them beside the new way he was dictating, and asked him where people in later years should look if they wanted to see how he had first done the sums. Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.'
          excerpts:
            p1: 'Leonardo leafed through the volumes for a long time, took up a pen, and at the end of each wrote his name and the year it was finished. He waited for the ink to dry, laid the volumes one by one in a wooden chest, and fastened the clasp.'
        relic: A wax tablet of numerals
        relic_desc: A tablet with the ten new numerals set out beside the old Roman ones.
        points:
          p1: 'Persuade Leonardo to sign and leave a complete copy of the 1202 first version in Pisa, so the later revision does not replace it'
        points_fail:
          p1: 'After the author revises the work, borrowers know only the new copy and cannot recover the first compilation.'
        shift:
          p1:
            was: '1202: Leonardo of Pisa finished the first version of the Liber abaci; no complete copy of it is known to survive, and the manuscripts that came down reflect the revision of 1228.'
            now: 'The early set retains its date and examples. Later readers can put the two compilations side by side and identify newly added work.'
            who: fibonacci_pisa
            bio: 'The 1202 first version of Leonardo of Pisa''s book survived in a complete copy beside the 1228 revision, so later readers could see what he changed over those years.'
        vignettes:
          rabbits: 'In a copy {staff} comes upon the problem of a pair of rabbits that bear a new pair every month. {staff} cannot help counting in the margin to the twelfth month, and the numbers come out exactly as in the schoolbooks of later centuries.'
          zero: 'In a counting house on the quay {staff} shows an apprentice how to write an empty place as zero. The boy says the little ring is nothing at all and has no right to a column of its own. {staff} has him check two ledgers against each other, and the boy goes quiet.'
          quay: '{staff} helps unload bales from a boat on the Arno and calls out each one as it comes ashore. On the bank a clerk listens and scratches a mark on his board for every call.'
      zh:
        name: '1202 年的初编'
        place: 比萨
        figure: 斐波那契
        story: '比萨的列奥纳多少年时在北非海岸的布吉亚学会用九个印度数字算账，他父亲在那里替比萨商人办事。1202 年，他回到比萨写成《计算之书》，教人用这些新数字和零来记数、做买卖。1228 年他把书改订了一遍，今天传下来的抄本都出自这第二版。'
        story_prose:
          opening:
            - '1202 年，比萨。列奥纳多少年时到过北非海岸的布吉亚，他父亲在那里替比萨商人办事，他在那里学会了用九个印度数字算账。回到比萨，他写成《计算之书》，教人用这些数字和零来记数、做买卖。'
            - '史实里，1228 年他把这部书改订了一遍，添了新内容，删去他觉得多余的部分；传下来的抄本都出自这一版，1202 年的初编没有已知的完整抄本。在这条分支里，码头账房有个学徒，不明白一个小圈凭什么占一栏，阿诺河上有个船夫，一包货上岸就报一声数。'
            - '这一趟用得上几种人：懂书、知道一套抄本该怎么留的人，会教书、说得动作者的人，或者好学肯钻、讲得清早本和新本差在哪里的人。'
          outcomes:
            all: '二十多年后，修订本在比萨的书铺里抄开了。那只木箱还在，早本和新本并排摊开，读的人一页页对着看，找哪些例题是后来补上的。'
            p1: '二十多年后，修订本在比萨的书铺里抄开了。那只木箱还在，早本和新本并排摊开，读的人一页页对着看，找哪些例题是后来补上的。'
          none: '1228 年以后，比萨书铺里抄的都是修订本。账房里的学徒照着它学算，一笔一笔把零写进空着的那一栏。'
          not_admitted: '{staff}没能进列奥纳多的门。阿诺河边，船夫还在一包包往岸上卸货，岸上的人在板上划了一道又一道。'
          points:
            p1:
              class_lettered: '{staff}照管书的规矩，把初编的几卷摊在桌上，一卷卷编好号，对列奥纳多说，日后改订是好事，可这一套若不留下，往后没人知道他起初是怎么写的。列奥纳多把那几卷翻了很久，拿起笔，在每一卷末尾写下自己的名字和编成的年份。他等墨干透，把卷子一卷卷码进木箱，扣上了搭扣。'
              else: '{staff}把初编里的几道例题抄在蜡板上，和他口述的新写法并排放着，问他往后的人想看他起初是怎么算的，该去哪里找。列奥纳多把那几卷翻了很久，拿起笔，在每一卷末尾写下自己的名字和编成的年份。他等墨干透，把卷子一卷卷码进木箱，扣上了搭扣。'
          excerpts:
            p1: '列奥纳多把那几卷翻了很久，拿起笔，在每一卷末尾写下自己的名字和编成的年份。他等墨干透，把卷子一卷卷码进木箱，扣上了搭扣。'
        relic: 一块写着数字的蜡板
        relic_desc: 板上把十个新数字和旧的罗马数字并排写在一起。
        points:
          p1: '说服列奥纳多把 1202 年初编的一整套抄本签好名留在比萨，让它不被后来的修订本取代'
        points_fail:
          p1: '等作者改写以后，借书人只认得后来那一套抄本，不能恢复早本。'
        shift:
          p1:
            was: '1202 年，比萨的列奥纳多写成《计算之书》初编；初编没有完整的抄本留存，传下来的抄本出自 1228 年的修订本。'
            now: '留存的早本注明旧例和编成年份。等修订本出现，两份可并读，读者能查哪些例题是后来才补的。'
            who: fibonacci_pisa
            bio: '比萨的列奥纳多 1202 年的初编留下了一部完整的抄本，与 1228 年的修订本并存，后人能对出他这些年里改了什么。'
        vignettes:
          rabbits: '烛火底下，{staff}在抄本里读到一道题：一对兔子每个月生一对小兔。{staff}忍不住在页边数到第十二个月，数出来的数，和后世课本上的一个也不差。'
          zero: '码头的账房里堆着麻袋，{staff}教学徒把空着的一位写成零。学徒说这个小圈什么也不是，凭什么占一栏。{staff}让他把两本账对一遍，他就不吭声了。'
          quay: '{staff}在阿诺河边帮人从船上卸货包，跳板踩上去吱呀作响，一包上岸就报一声数。岸上的账房一边听，一边在板上划一道。'
text:
  en:
    name: Fibonacci
    text: Italian mathematician, about 1170 to about 1250, from Pisa. His 1202 Book of Calculation brought the Hindu Arabic numerals to Europe and contains the problem of the rabbits that gives the Fibonacci sequence.
  zh:
    name: 斐波那契
    text: 意大利数学家，约 1170 年生，约 1250 年去世，出身比萨。他 1202 年的《计算之书》把印度阿拉伯数字带到欧洲，书中兔子繁殖的问题产生了斐波那契数列。
hook: {en: 'A book written twice. Where did the first go?', zh: '一部书写了两回，头一回去了哪'}
quotes:
  fibonacci_any_number:
    order: 1
    tier: full
    date: '1228'
    checked: official_record
    sources: [fibonacci_umi_chapter_one]
    original: la
    text:
      en: {who: 'Leonardo of Pisa', quote: 'With these nine figures and this sign 0, called zephirum in Arabic, any number can be written, as shown below.', occasion: 'Liber abaci, opening of Chapter I, surviving revised text; game translation'}
      zh: {who: '比萨的列奥纳多', quote: '用这九个数字和符号 0——阿拉伯语称它为 zephirum——便能写出任何数，下文将说明这一点。', occasion: '《计算之书》现传修订本，第一章开篇；本游戏译文'}
      la: {who: 'Leonardo of Pisa', quote: 'Cum his itaque nouem figuris, et cum hoc signo 0, quod arabice zephirum appellatur, scribitur quilibet numerus, ut inferius demonstratur.', occasion: 'Liber abaci, opening of Chapter I, surviving revised text'}
  fibonacci_first_place:
    order: 2
    tier: none
    date: '1228'
    checked: official_record
    sources: [fibonacci_umi_chapter_one]
    original: la
    text:
      en: {who: 'Leonardo of Pisa', quote: 'When writing numbers, the first place starts at the right.', occasion: 'Liber abaci, Chapter I, explanation of place value in the surviving revised text; game translation'}
      zh: {who: '比萨的列奥纳多', quote: '写数时，第一位从右边起。', occasion: '《计算之书》现传修订本，第一章讲解数位；本游戏译文'}
      la: {who: 'Leonardo of Pisa', quote: 'Primus gradus in descriptione numerorum incipit a dextera.', occasion: 'Liber abaci, Chapter I, explanation of place value in the surviving revised text'}
facts:
  bugia:
    date: '1192'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [fibonacci_pisa_mactutor, fibonacci_pisa_dsb]
    text:
      en: 'In the 1190s his father held a post in Bugia, on the coast of North Africa, for the merchants of Pisa, and sent for his son, who was taught there to reckon with the nine Indian figures.'
      zh: '12 世纪 90 年代，他父亲在北非海岸的布吉亚替比萨商人任职，把儿子叫去，他在那里学会了用九个印度数字算账。'
    line:
      en: 'The 1190s: in Bugia, on the coast of North Africa, the young Leonardo of Pisa learns to reckon with the nine Indian figures.'
      zh: '12 世纪 90 年代，少年列奥纳多在北非海岸的布吉亚，学会用九个印度数字算账。'
  numerals:
    date: '1202'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [fibonacci_pisa_primary, fibonacci_pisa_mactutor]
    text:
      en: 'Leonardo of Pisa wrote the Liber abaci in 1202. Its surviving 1228 revision explains the nine Indian figures and zero, and how to reckon with them in trade.'
      zh: '比萨的列奥纳多于 1202 年写《计算之书》。现传的 1228 年修订本开篇说明九个印度数字和零，以及做买卖时怎样用它们计算。'
    line:
      en: '1202: in Pisa, Leonardo finishes the Liber abaci, a book of reckoning with the nine Indian figures and zero.'
      zh: '1202 年，列奥纳多在比萨写成《计算之书》，教人用九个印度数字和零来算账。'
  rabbits:
    date: '1202'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [fibonacci_pisa_mactutor, fibonacci_pisa_wiki]
    text:
      en: 'The Liber abaci asks how many pairs of rabbits one pair will produce in a year, if each pair bears a new pair every month; the answers give the sequence 1, 1, 2, 3, 5, 8 and on.'
      zh: '《计算之书》里有一道题：一对兔子每月生一对，一年后共有多少对；答案依次是 1、1、2、3、5、8……'
  frederick:
    date: '1225'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [fibonacci_pisa_mactutor, fibonacci_pisa_dsb]
    text:
      en: 'About 1225, when the court of Frederick II met in Pisa, Leonardo was presented to the emperor, and Johannes of Palermo set him problems.'
      zh: '约 1225 年，腓特烈二世的宫廷驻在比萨，列奥纳多被引见给皇帝，宫廷里的约翰内斯出题考他。'
    line:
      en: 'About 1225: the court of Frederick II meets in Pisa, and Johannes of Palermo sets Leonardo problems.'
      zh: '约 1225 年，腓特烈二世的宫廷驻在比萨，巴勒莫的约翰内斯出题考列奥纳多。'
  revision:
    date: '1228'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [fibonacci_pisa_liber_abaci_versions, fibonacci_pisa_manuscript_versions]
    text:
      en: 'In 1228 he issued a revised Liber abaci, adding new material and cutting what he thought superfluous. The manuscripts that survive come from this revision; no complete copy of the first version of 1202 is known.'
      zh: '1228 年，他推出《计算之书》修订本，添了新内容，删去他认为多余的部分。传下来的抄本都出自这一版，1202 年的初编没有已知的完整抄本。'
    line:
      en: '1228: Leonardo issues a revised Liber abaci. The copies that come down to later centuries are of this version.'
      zh: '1228 年，列奥纳多推出《计算之书》修订本，后世传下来的都是这一版的抄本。'
  salary:
    date: '1240'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [fibonacci_pisa_dsb, fibonacci_pisa_mactutor]
    text:
      en: 'In 1240 the Republic of Pisa granted the serious and learned Master Leonardo Bigollo a yearly salary, for his service to the city in matters of accounting and for teaching its citizens.'
      zh: '1240 年，比萨共和国下令每年发给"审慎博学的列奥纳多·比戈洛老师"一份薪俸，酬谢他在账目上为城市出力、教导市民。'
    line:
      en: '1240: the Republic of Pisa grants Master Leonardo Bigollo a yearly salary for his help with the city''s accounts.'
      zh: '1240 年，比萨共和国给列奥纳多·比戈洛老师定了一份年俸，谢他帮城里理账。'
