events:
  lalibela_rock:
    order: 51
    year: 1200
    lon: 39.04
    lat: 12.03
    region: africa
    home: [east_africa]
    field: architecture
    tier: 2
    channels: {A: 1, L: 2}
    # finished: in the game with release.ready_only. No year is recorded for any one cut, so the stay carries the year of the reign only.
    ready: true
    refs: [lalibela_rock_drainage, wikipedia_lalibela_churches, everything_everywhere_lalibela]
    scene:
      points:
        - {id: p1, kind: trust, day: 10, req: {"any":[{"trait":["hardy","cheerful","kind"]},{"job":["carpenter"]},{"stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 70, req: {"any":[{"trait":["curious","methodical","scholarly"]},{"stat":{"wit":6}}]}}
        - {id: p3, kind: endure, day: 140, req: {"any":[{"trait":["hardy","patient","vigil"]},{"stat":{"will":6}}]}}
      vignettes:
        - {id: outlet, traits: [methodical, scholarly], day: 75}
        - {id: rain, traits: [hardy, curious], day: 130}
        - {id: bend, day: 40}
    text:
      en:
        name: 'Look for the outlet in the rock'
        place: Lalibela, Ethiopia
        figure: Lalibela and the stonecutters
        story: 'King Lalibela of the Zagwe dynasty reigned from 1181 to 1221, and the eleven churches cut down into the rock of the town that bears his name are attributed to him, with their ditches, trenches and passages; the dating of single churches is not well established. In the 1520s the Portuguese priest Francisco Álvares came with an embassy and wrote the first detailed European description of them. They were inscribed as a World Heritage site in 1978.'
        relic: A stonecutter's chisel
        relic_desc: An iron chisel, the edge ground thin.
        points:
          p1: 'Be taken in by the stonecutters, then carry the broken rock out of the trench'
          p2: 'Before the rains, follow a channel in the rock to its outlet and show where the water will stand'
          p3: 'In the rains, help clear one whole ditch from end to end'
        vignettes:
          outlet: '{staff} follows a channel cut in the rock down past the bend to where it breaks out into the open, and marks the place with a chip of stone.'
          rain: '{staff} stands in the trench with the water to the ankles and passes baskets of silt up to the rim, one after another, until the light goes.'
          bend: '{staff} draws a notch at the turn of a trench on a scrap, so that a helper can find the same turn the next morning.'
      zh:
        name: '沿岩沟找出口'
        place: 埃塞俄比亚拉利贝拉
        figure: 拉利贝拉与石匠们
        story: '扎格韦王朝的拉利贝拉国王在位于 1181 年至 1221 年，以他命名的城镇周围有十一座向下凿进岩石的教堂，连同沟渠、深槽和通道，都归在他名下，各座教堂的确切年代并不确定。1520 年代，葡萄牙神父弗朗西斯科·阿尔瓦雷斯随使团来到这里，写下欧洲人对这些教堂的第一份详细记述。1978 年，岩凿教堂列入世界遗产。'
        relic: 石匠的凿子
        relic_desc: 一把铁凿子，刃口磨得很薄。
        points:
          p1: '先让石匠们认下，再替他们把凿下的碎石运出深槽'
          p2: '雨季前，沿岩沟找到出口，指给他们看哪里会积水'
          p3: '雨季里，帮着把一整条沟渠从头清到尾'
        vignettes:
          outlet: '{staff}顺着一条凿在岩上的沟往下走，过了弯，找到它出岩壁的地方，用一块碎石做了记号。'
          rain: '{staff}站在没过脚踝的水里，把一筐筐淤泥递上槽沿，一筐接一筐，直到天黑。'
          bend: '{staff}在一片碎纸上画了个缺口，标出深槽的转弯处，帮工第二天早上照着就能找到同一个弯。'
text:
  en:
    name: Lalibela and the stonecutters
    text: Lalibela and the stonecutters of the Zagwe dynasty of Ethiopia. In the late twelfth and early thirteenth century eleven churches were cut down into the rock around the town that bears his name.
  zh:
    name: 拉利贝拉与石匠们
    text: 拉利贝拉与埃塞俄比亚扎格韦王朝的石匠。十二世纪末到十三世纪初，以他命名的城镇周围，十一座教堂从岩石中向下凿出。
hook: {en: 'Does the rock channel lead out or stop?', zh: '凿出的水沟通出去了吗？'}
facts:
  reign:
    date: '1181'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage, wikipedia_lalibela_churches]
    text:
      en: 'King Lalibela of the Zagwe dynasty reigned from 1181 to 1221, and the building of the eleven rock hewn churches is attributed to him.'
      zh: '扎格韦王朝的拉利贝拉国王在位于 1181 年至 1221 年，十一座岩凿教堂的修建归在他名下。'
    line:
      en: '1181: Lalibela of the Zagwe dynasty becomes king. The churches cut into the rock of his town will be put down to him.'
      zh: '1181 年，扎格韦王朝的拉利贝拉即位。城边凿进岩石的那些教堂，后来都归在他名下。'
  drainage:
    date: '1200'
    stay_day: 5
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage]
    text:
      en: 'The property includes churches hewn from rock and an extensive system of drainage ditches, trenches and passages.'
      zh: '遗址包括从岩石中凿出的教堂，以及排水沟、深槽和通道。'
    line:
      en: 'Around the churches run ditches, trenches and passages, all cut down into the same rock.'
      zh: '教堂四周是排水沟、深槽和通道，都从同一片岩石里向下凿出。'
  undated:
    date: '1200'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [wikipedia_lalibela_churches, everything_everywhere_lalibela]
    text:
      en: 'The dating of the single churches is not well established; most are thought to date from the twelfth and thirteenth centuries.'
      zh: '各座教堂的确切年代并不确定，多数被认为属于十二、十三世纪。'
  reign_end:
    date: '1221'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage, wikipedia_lalibela_churches]
    text:
      en: 'His reign ended in 1221.'
      zh: '他的统治于 1221 年结束。'
    line:
      en: '1221: the reign of Lalibela ends.'
      zh: '1221 年，拉利贝拉的统治结束。'
  alvares:
    date: '1520'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_lalibela_churches, everything_everywhere_lalibela]
    text:
      en: 'In the 1520s the Portuguese priest Francisco Álvares, travelling with an embassy, gave the first detailed European description of the churches.'
      zh: '1520 年代，葡萄牙神父弗朗西斯科·阿尔瓦雷斯随使团来访，写下欧洲人对这些教堂的第一份详细描述。'
    line:
      en: 'The 1520s: a Portuguese priest, Francisco Álvares, comes with an embassy and writes the churches down for Europe for the first time.'
      zh: '1520 年代，葡萄牙神父弗朗西斯科·阿尔瓦雷斯随使团来到这里，第一次为欧洲人把这些教堂详细写了下来。'
  heritage:
    date: '1978'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage, wikipedia_lalibela_churches]
    text:
      en: 'The rock hewn churches were inscribed on the World Heritage List in 1978.'
      zh: '岩凿教堂于 1978 年列入《世界遗产名录》。'
    line:
      en: '1978: the rock hewn churches of Lalibela are inscribed as a World Heritage site.'
      zh: '1978 年，拉利贝拉的岩凿教堂列入世界遗产。'
