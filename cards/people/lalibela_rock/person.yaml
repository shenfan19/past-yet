text:
  en:
    name: Lalibela and the stonecutters
    text: Lalibela and the stonecutters of the Zagwe dynasty of Ethiopia. In the late twelfth and early thirteenth century eleven churches were cut down into the rock around the town that bears his name.
  zh:
    name: 拉利贝拉与石匠们
    text: 拉利贝拉与埃塞俄比亚扎格韦王朝的石匠。十二世纪末到十三世纪初，以他命名的城镇周围，十一座教堂从岩石中向下凿出。
