      zh: {who: '弗朗西斯科·阿尔瓦雷斯', quote: '这石头很硬。', occasion: '葡萄牙使团成员于 1520 年代到访后，记下在各各他教堂亲眼所见的岩凿入口。本游戏译文。'}
hook:
  en: 'What can a copy of the trench wall keep?'
  zh: '岩沟挖开以后，图上能留下什么？'
facts:
  reign:
    date: '1181'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage, lalibela_archaeology]
    text:
      en: 'Lalibela ruled around the turn of the thirteenth century. Tradition attributes the complex to his patronage.'
      zh: '拉利贝拉约在十三世纪前后掌权。传统将这处建筑群的兴建与他的资助联系起来。'
    line:
      en: 'Around the turn of the thirteenth century: Lalibela rules in the Ethiopian highlands.'
      zh: '十三世纪前后，拉利贝拉统治着埃塞俄比亚高地。'
  drainage:
    date: '1200'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [lalibela_rock_drainage]
    text:
      en: 'The surviving complex includes rock-cut buildings, drainage ditches, trenches and passages. The heritage record does not date any one channel to a particular year.'
      zh: '遗址保留了岩凿建筑、排水沟、深槽和通道。遗产记录没有把某条水沟的开凿定到具体年份。'
  undated:
    date: '1200'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [lalibela_archaeology, lalibela_rock_drainage]
    text:
      en: 'Excavation and analysis of the rock cuts indicate several phases; parts of the site predate the thirteenth-century complex.'
      zh: '发掘和岩石切痕显示，开凿分为多个阶段，部分遗存早于十三世纪的建筑群。'
  reign_end:
    date: '1221'
    checked: single
    level: unused
    use: []
    sources: [lalibela_archaeology]
    text:
      en: 'The available evidence places Lalibela in the late twelfth and early thirteenth centuries without establishing an exact end to his reign.'
      zh: '现有材料将拉利贝拉置于十二世纪末至十三世纪初，不足以确定其统治结束的确切年份。'
  alvares:
    date: '1520'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_alvares, lalibela_inscriptions]
    text:
      en: 'In the 1520s Francisco Álvares visited with a Portuguese embassy and described the rock-cut buildings.'
      zh: '1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团来访，记下了所见的岩凿建筑。'
    line:
      en: '1520s: Francisco Álvares visits with a Portuguese embassy and describes the buildings cut into the rock.'
      zh: '1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团来访，记下这些凿进岩石的建筑。'
  heritage:
    date: '1978'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage]
    text:
      en: 'The rock hewn churches were inscribed on the World Heritage List in 1978.'
      zh: '岩凿教堂于 1978 年列入《世界遗产名录》。'
    line:
      en: '1978: the rock hewn churches of Lalibela are inscribed as a World Heritage site.'
      zh: '1978 年，拉利贝拉的岩凿教堂列入世界遗产。'
