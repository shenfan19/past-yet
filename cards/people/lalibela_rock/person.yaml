      zh: {who: '弗朗西斯科·阿尔瓦雷斯', quote: '整片岩石看起来像一整块大理石。', occasion: '葡萄牙使团成员于 1520 年代到访后，记下在救世主教堂亲眼所见的岩石。本游戏译文。'}
  lalibela_hard_stone:
