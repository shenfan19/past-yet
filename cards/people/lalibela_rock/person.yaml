    text:
      en:
        name: 'Look for the outlet in the rock'
        place: Lalibela, Ethiopia
        figure: Lalibela and the stonecutters
        story: 'At Lalibela, the builders cut down into the rock, leaving standing walls and columns as they cleared stone away. Eleven rock-cut buildings and a network of trenches, channels and passages survive. The complex is traditionally associated with King Lalibela of the Zagwe dynasty, but archaeologists have found traces of successive cuts and earlier structures. In the 1520s Francisco Álvares described the site after visiting with a Portuguese embassy.'
        relic: A stonecutter's chisel
        relic_desc: An iron chisel, the edge ground thin.
        points:
          p1: 'Be taken in by the stonecutters, then carry the broken rock out of the trench'
          p2: 'Before the rains, follow a channel in the rock to its outlet and show where the water will stand'
          p3: 'In the rains, help clear one whole ditch from end to end'
        vignettes:
          outlet: '{staff} follows a channel cut in the rock down past the bend to where it breaks out into the open, and marks the place with a chip of stone.'
          rain: '{staff} stands in the trench with the water to the ankles and passes baskets of silt up to the rim, one after another, until the light goes.'
          bend: '{staff} draws a notch at the turn of a trench on a scrap, so that a helper can find the same turn the next morning.'
      zh:
        name: '沿岩沟找出口'
        place: 埃塞俄比亚拉利贝拉
        figure: 拉利贝拉与石匠们
        story: '拉利贝拉的石匠向下开凿，把周围的石料清出去，墙和柱便从整片岩石中留了下来。如今遗址保存着十一座岩凿建筑，以及相通的深槽、水沟和通道。传统把这处建筑群与扎格韦王朝的拉利贝拉国王相联系；考古人员发现，岩石曾分期开凿，有些地方原来还立着更早的建筑。1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团到访，写下了他的见闻。'
        relic: 石匠的凿子
        relic_desc: 一把铁凿子，刃口磨得很薄。
        points:
          p1: '先让石匠们认下，再替他们把凿下的碎石运出深槽'
          p2: '雨季前，沿岩沟找到出口，指给他们看哪里会积水'
          p3: '雨季里，帮着把一整条沟渠从头清到尾'
        vignettes:
          outlet: '{staff}顺着一条凿在岩上的沟往下走，过了弯，找到它出岩壁的地方，用一块碎石做了记号。'
          rain: '{staff}站在没过脚踝的水里，把一筐筐淤泥递上槽沿，一筐接一筐，直到天黑。'
          bend: '{staff}在一片碎纸上画了个缺口，标出深槽的转弯处，帮工第二天早上照着就能找到同一个弯。'
text:
  en:
    name: Lalibela and the stonecutters
    text: Lalibela was an Ethiopian ruler of the Zagwe dynasty around the turn of the thirteenth century. The town that bears his name preserves eleven rock-cut buildings shaped over successive phases.
  zh:
    name: 拉利贝拉与石匠们
    text: 拉利贝拉是十三世纪前后的埃塞俄比亚扎格韦王朝国王。以他命名的城镇保存了十一座岩凿建筑，现有形制由多次开凿逐步形成。
hook: {en: 'Does the rock channel lead out or stop?', zh: '凿出的水沟通出去了吗？'}
facts:
  reign:
    date: '1181'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage, lalibela_archaeology]
    text:
      en: 'Lalibela ruled around the turn of the thirteenth century. Tradition attributes the complex to his patronage.'
      zh: '拉利贝拉约在十三世纪前后掌权。传统将这处建筑群的兴建与他的资助联系起来。'
    line:
      en: 'Around the turn of the thirteenth century: Lalibela rules in the Ethiopian highlands.'
      zh: '十三世纪前后，拉利贝拉统治着埃塞俄比亚高地。'
  drainage:
    date: '1200'
    stay_day: 5
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [lalibela_rock_drainage]
    text:
      en: 'The surviving complex includes rock-cut buildings, drainage ditches, trenches and passages. The heritage record does not date any one channel to a particular year.'
      zh: '遗址保留了岩凿建筑、排水沟、深槽和通道。遗产记录没有把某条水沟的开凿定到具体年份。'
  undated:
    date: '1200'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [lalibela_archaeology, lalibela_rock_drainage]
    text:
      en: 'Excavation and analysis of the rock cuts indicate several phases; parts of the site predate the thirteenth-century complex.'
      zh: '发掘和岩石切痕显示，开凿分为多个阶段，部分遗存早于十三世纪的建筑群。'
  reign_end:
    date: '1221'
    checked: single
    level: unused
    use: []
    sources: [lalibela_archaeology]
    text:
      en: 'The available evidence places Lalibela in the late twelfth and early thirteenth centuries without establishing an exact end to his reign.'
      zh: '现有材料将拉利贝拉置于十二世纪末至十三世纪初，不足以确定其统治结束的确切年份。'
  alvares:
    date: '1520'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_alvares, lalibela_inscriptions]
    text:
      en: 'In the 1520s Francisco Álvares visited with a Portuguese embassy and described the rock-cut buildings.'
      zh: '1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团来访，记下了所见的岩凿建筑。'
    line:
      en: '1520s: Francisco Álvares visits with a Portuguese embassy and describes the buildings cut into the rock.'
      zh: '1520 年代，弗朗西斯科·阿尔瓦雷斯随葡萄牙使团来访，记下这些凿进岩石的建筑。'
  heritage:
    date: '1978'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [lalibela_rock_drainage]
    text:
      en: 'The rock hewn churches were inscribed on the World Heritage List in 1978.'
      zh: '岩凿教堂于 1978 年列入《世界遗产名录》。'
    line:
      en: '1978: the rock hewn churches of Lalibela are inscribed as a World Heritage site.'
      zh: '1978 年，拉利贝拉的岩凿教堂列入世界遗产。'
