        - {id: work, day: 9}
    text:
      en:
        name: 'Two layers in the trench wall'
        place: 'Lalibela, Ethiopia'
        figure: 'The trench crew at Lalibela'
        story: 'The first phase of conservation at Lalibela began on 19 December 1966. Clearing accumulated sediment exposed trenches that had been cut into the rock. Later archaeologists report that only a few photographs survive of the finds from the 1960s clearance, with no archive that documents them individually.'
        relic: 'A drawing of the trench wall'
        relic_desc: 'The section records the thickness of each layer and the positions of the sherds in the soil.'
        points:
          p1: 'Before the next basket goes up, measure the layers with the trench crew and leave a local copy of the section with the exposed sherds marked'
        points_fail:
          p1: 'The crew carries the soil away. The positions of the sherds in that section can no longer be measured.'
        shift:
          p1:
            was: 'The few photographs that survive from the clearance are insufficient to reconstruct the original layers and positions of the finds.'
            now: 'A copy of the trench section stays in town. A later surveyor can still check the thickness of the layers and the positions of the sherds in this stretch.'
        vignettes:
          work: '{staff} watches a worker shave the face flat with a narrow spade until the pale line in the soil comes clear.'
        story_prose:
          opening:
          - 'Lalibela, the winter of 1966. The baskets coming up from the trench are full of stones and mud. Where the rock wall bends, a paler layer shows below the wet soil. A few potsherds are still embedded in it.'
          - 'The work exposed trenches that had long been buried. In history, only a few photographs survived of the finds. A photograph alone will not put a sherd back where it lay.'
          - 'The crew will dig past the bend on its next pass. There is still time for someone who can read the layers and make a drawing on the spot.'
          points:
            p1: '{staff} asks the person with the basket to wait, puts a rule against the line between the layers, and measures from the rock to the nearest sherd. A worker calls the numbers back and marks the same point on a second drawing. The second sheet stays in town.'
          outcomes:
            all: 'Years later, someone unfolds the local copy and holds a rule against the rock. The pale layer on the old drawing is at this end of the rule.'
            p1: 'Years later, someone unfolds the local copy and holds a rule against the rock. The pale layer on the old drawing is at this end of the rule.'
          none: 'An empty basket slides back down into the trench. The face where the sherds showed has been scraped flat, and the earth has gone in with the previous load.'
          not_admitted: '{staff} cannot go down with the crew. Someone on the rim takes up a length of taut line and winds it round a board.'
          excerpts:
            p1: '{staff} asks the person with the basket to wait, puts a rule against the line between the layers, and measures from the rock to the nearest sherd. A worker calls the numbers back and marks the same point on a second drawing.'
      zh:
        name: '沟壁上的两层土'
        place: '埃塞俄比亚拉利贝拉'
        figure: '拉利贝拉的清沟工人'
        story: '1966 年 12 月 19 日，拉利贝拉第一期修缮开工。工人掘走淤积的土，重新露出一段段凿进岩石的深槽。现代考古队指出，那次清理的出土物只留下少量照片，缺少可逐件核对的记录。'
        relic: '一张沟壁剖面图'
        relic_desc: '线图记下土层厚度和碎片还在土里的位置。'
        points:
          p1: '趁着下一筐土还没动，和工人量下土层厚度，把露出的陶片位置连同沟壁剖面抄一份留在当地'
        points_fail:
          p1: '清理继续进行。泥从沟里运出，后来再也无法量出这些碎片原来的位置。'
        shift:
          p1:
            was: '清理时留下的少量照片不足以还原出土物原来的土层与位置。'
            now: '当地留有一份沟壁剖面，后来的测绘人员还能查到这一段的土层厚度和陶片的位置。'
        vignettes:
          work: '{staff}看着工人用一把窄铲刮出一小片平面，泥里的浅线这才变得清楚。'
        story_prose:
          opening:
          - '1966 年冬，拉利贝拉。岩沟里一筐筐往上提带泥的碎石。沟壁转弯处，湿泥下方露着一条颜色浅些的土。泥里还有几片陶。'
          - '这次工程重新露出了被埋的深槽。史实里，清理中发现的东西只留下少量照片。要把某块陶片放回原处，单凭照片已经办不到了。'
          - '工人下一趟就会挖过这个弯。派个会看土层又能当场把位置画下来的人去，还来得及。'
          points:
            p1: '{staff}请提筐的人稍等，把尺贴到两层土的交界，再从岩壁边量到刚露出的陶片。工人照着报出的数，把同一个位置点在第二张图上。第二张图留在镇上。'
          outcomes:
            all: '多年后，有人展开留在镇上的图，把尺比在那段岩壁上。旧图上的浅色土层就在尺的这一头。'
            p1: '多年后，有人展开留在镇上的图，把尺比在那段岩壁上。旧图上的浅色土层就在尺的这一头。'
          none: '空筐从坡顶滑回沟里。原先露出陶片的一边已经削平，剩下的土与上一筐混在了一起。'
          not_admitted: '{staff}没能跟清沟工人下去。有人从沟沿收起一段绷着的细线，绕回木板上。'
          excerpts:
            p1: '{staff}请提筐的人稍等，把尺贴到两层土的交界，再从岩壁边量到刚露出的陶片。工人照着报出的数，把同一个位置点在第二张图上。'
text:
  en:
    name: Lalibela and the stonecutters
    text: Lalibela was an Ethiopian ruler of the Zagwe dynasty around the turn of the thirteenth century. The town that bears his name preserves eleven rock-cut buildings shaped over successive phases.
  zh:
    name: 拉利贝拉与石匠们
    text: 拉利贝拉是十三世纪前后的埃塞俄比亚扎格韦王朝国王。以他命名的城镇保存了十一座岩凿建筑，现有形制由多次开凿逐步形成。
