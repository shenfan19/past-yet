quotes:
  germain_conjectures:
    order: 1
    tier: full
    date: '1896'
    checked: official_record
    sources: [germain_pensees_eduscol]
    original: fr
    text:
      en:
        who: 'Sophie Germain'
        quote: 'Conjectures and opinions must have a place in human knowledge.'
        occasion: 'Pensées diverses, 1896 posthumous edition; game translation'
      zh:
        who: '索菲·热尔曼'
        quote: '在人类的知识里，猜想和见解也应当有一席之地。'
        occasion: '《杂感》1896 年身后刊本；本游戏译文'
      fr:
        who: 'Sophie Germain'
        quote: 'Les conjectures, les opinions doivent avoir une place dans les connaissances des hommes.'
        occasion: 'Pensées diverses, édition posthume de 1896'
      zh-Hant:
        who: '索菲·熱爾曼'
        quote: '在人類的知識裡，猜想和見解也應當有一席之地。'
        occasion: '《雜感》1896 年身後刊本；本遊戲譯文'
      es:
        who: 'Sophie Germain'
        quote: 'Las conjeturas y opiniones deben tener un lugar en el conocimiento humano.'
        occasion: 'Pensées diversos, edición póstuma de 1896; traducción del juego'
      ja:
        who: 'ソフィー・ジェルマン'
        quote: '推測や意見は人間の知識の中に位置しなければなりません。'
        occasion: '『パンセの多様性』1896 年の死後版。ゲーム翻訳'
      ko:
        who: '소피 제르맹'
        quote: '추측과 의견은 인간의 지식에 자리를 잡아야 합니다.'
        occasion: 'Pensées wides, 1896년 유작; 게임 번역'
      ru:
        who: 'Софи Жермен'
        quote: 'Догадки и мнения должны иметь место в человеческом знании.'
        occasion: 'Pensées Differents, посмертное издание 1896 года; перевод игры'
  germain_borrowed_name:
    order: 2
    tier: none
    date: '1807-02-20'
    checked: two_sources
    sources: [germain_gauss_stupuy, germain_gauss_tamboukou, germain_mactutor]
    original: fr
    text:
      en:
        who: 'Sophie Germain'
        quote: 'I hope that what I am admitting today will not deprive me of the honour you granted me under a borrowed name'
        occasion: 'letter to Carl Friedrich Gauss revealing her identity; game translation'
      zh:
        who: '索菲·热尔曼'
        quote: '我希望，今天说出实情，不会使我失去您曾给予那个借来的名字的礼遇。'
        occasion: '致卡尔·弗里德里希·高斯、说明自己身份的信；本游戏译文'
      fr:
        who: 'Sophie Germain'
        quote: 'J’espère que la singularité, dont je fais aujourd’hui l’aveu, ne me privera pas de l’honneur que vous m’avez accordé sous un nom emprunté'
        occasion: 'lettre à Carl Friedrich Gauss'
      zh-Hant:
        who: '索菲·熱爾曼'
        quote: '我希望，今天說出實情，不會使我失去您曾給予那個借來的名字的禮遇。'
        occasion: '致卡爾·弗里德里希·高斯、說明自己身份的信；本遊戲譯文'
      es:
        who: 'Sophie Germain'
        quote: 'Espero que lo que admito hoy no me prive del honor que me concediste con nombre prestado.'
        occasion: 'carta a Carl Friedrich Gauss revelando su identidad; traducción del juego'
      ja:
        who: 'ソフィー・ジェルマン'
        quote: '今日私が告白することで、あなたが借りた名前で私に与えてくれた名誉が私から剥奪されないことを願っています'
        occasion: 'カール・フリードリヒ・ガウスに宛てた手紙で、彼女の身元を明らかにした。ゲーム翻訳'
      ko:
        who: '소피 제르맹'
        quote: '오늘 내가 인정하는 일이 당신이 빌린 이름으로 나에게 주신 명예를 빼앗기지 않기를 바랍니다.'
        occasion: '그녀의 신원을 밝히는 Carl Friedrich Gauss에게 보낸 편지; 게임 번역'
      ru:
        who: 'Софи Жермен'
        quote: 'Надеюсь, то, что я сегодня признаю, не лишит меня той чести, которую вы мне оказали под заимствованным именем.'
        occasion: 'письмо Карлу Фридриху Гауссу, раскрывающее ее личность; перевод игры'
