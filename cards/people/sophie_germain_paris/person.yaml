    text:
      en:
        name: "A degree that came too late"
        place: "Paris"
        figure: "Sophie Germain"
        story: 'In 1829 Sophie Germain fell ill with breast cancer. She kept working, and finished a memoir on the curvature of surfaces, which appeared in 1831 in volume 7 of Crelle''s journal in Berlin. Barred from the university as a young woman, she had written to Lagrange and to Gauss under the name of Monsieur Le Blanc, and in 1816 she won the prize of the Academy of Sciences for her memoir on the vibrations of elastic plates. Gauss persuaded the University of Göttingen to give her an honorary degree. She died at 13 rue de Savoie in Paris on 27 June 1831, before the degree was conferred.'
        relic: "A letter signed Le Blanc"
        relic_desc: "A letter to Gauss in a borrowed name."
        points:
          p1: 'While she is ill, keep her memoir on the curvature of surfaces on its way to Crelle''s journal in Berlin'
          p2: 'Ease the pain of the cancer in her last months in Paris'
          p3: 'Let Germain know before she dies that Gauss has asked Göttingen to give her an honorary degree'
        points_fail:
          p1: 'The memoir stays unfinished on her desk and the 1831 volume appears without it. This branch falls out of step with history and the office recalls the employee.'
          p2: 'Nobody eases the pain, and in this branch her last months are as hard as they were.'
          p3: 'No word reaches her, and she dies without knowing what Gauss had done for her.'
        shift:
          p1:
            was: 'In 1831 Germain''s memoir on the curvature of surfaces appeared in volume 7 of Crelle''s journal, the year she died.'
          p2:
            was: 'From about 1829 Germain was ill with breast cancer; she went on working and died in Paris on 27 June 1831.'
            now: '{staff} keeps the pain down with modern medicine and sits with her in the worst hours. She suffers less in her last months and keeps working at her desk.'
          p3:
            was: 'Gauss had urged the University of Göttingen to give Germain an honorary degree; when she died on 27 June 1831 it had not been conferred.'
            now: '{staff} brings her word of what Gauss has done. Germain hears that the university she could never attend means to honour her.'
            who: sophie_germain_paris
            bio: 'In this timeline Germain learned before she died that Gauss had put her forward for an honorary degree at Göttingen. The degree itself still came too late.'
        vignettes:
          water: 'On 7 March {staff} helps a water carrier haul two buckets of Seine water up five floors of a house in the rue de Savoie. Counting the steps between breaths, he says the houses of Paris get taller every year, and he is still paid by the bucket, not by the floor.'
          quai: 'In the middle of April {staff} leafs through an old almanac at a bookseller''s stall on the quay. The bookseller says the whole pile came from one household, the margins full of sums he cannot follow, so he sells them by the weight.'
          wash: 'Late in May {staff} helps a washerwoman wring sheets on a wash boat by the river. She says the Seine has risen and fallen all spring, the boat goes up and down with it, and so does her back.'
      zh:
        name: "来迟了的学位"
        place: "巴黎"
        figure: "索菲·热尔曼"
        story: '1829 年，索菲·热尔曼得了乳腺癌。她没有停下，病中写完论曲面曲率的论文，1831 年刊于柏林克雷勒杂志第七卷。她年轻时进不了大学，用勒布朗先生的名字给拉格朗日和高斯写信；1816 年，她以论弹性薄板振动的论文获法兰西科学院的奖。高斯说动哥廷根大学授她名誉博士学位。1831 年 6 月 27 日，她在巴黎萨伏依街 13 号去世，学位还没有授出。'
        relic: "一封署名勒布朗的信"
        relic_desc: "一封用借来的名字写给高斯的信。"
        points:
          p1: '在她病中护住那篇论曲面曲率的论文，让它寄到柏林克雷勒的杂志'
          p2: '减轻她最后几个月在巴黎的癌痛'
          p3: '让热尔曼生前知道，高斯在为她向哥廷根大学争取名誉博士学位'
        points_fail:
          p1: '论文没写完，留在她的书桌上，1831 年那一卷里没有它。这条分支与历史脱节，员工被送回。'
          p2: '没人替她压住疼痛，这条分支里她最后几个月和历史上一样难熬。'
          p3: '消息没送到她手里，她到去世都不知道高斯为她做了什么。'
        shift:
          p1:
            was: '1831 年，热尔曼论曲面曲率的论文刊于克雷勒杂志第七卷，同年她去世。'
          p2:
            was: '约 1829 年起热尔曼患乳腺癌，仍坚持工作，1831 年 6 月 27 日在巴黎去世。'
            now: '{staff}用现代的药压住疼痛，在最难熬的时候陪着她。她最后几个月少受了些苦，还能坐到书桌前。'
          p3:
            was: '高斯曾推动哥廷根大学授予热尔曼名誉博士学位，1831 年 6 月 27 日她去世时，学位尚未授出。'
            now: '{staff}把高斯所做的事带给她。热尔曼得知，那所她从没能进去读书的大学要给她这份荣誉。'
            who: sophie_germain_paris
            bio: '这条时间线里，热尔曼生前得知高斯推荐她获得哥廷根的名誉博士学位。学位本身仍然来得太迟。'
        vignettes:
          water: '3 月 7 日，{staff}帮送水的人把两桶塞纳河水扛上萨伏依街一座楼的五层。送水人一边数台阶一边喘，说巴黎的楼一年比一年高，他的工钱还是按桶算，不按层算。'
          quai: '四月中旬，{staff}在河岸的旧书摊前翻一本旧历书。摊主说这一摞是从同一户人家收来的，页边记满了算式，他看不懂，只好论分量卖。'
          wash: '五月下旬，{staff}在河边的洗衣船上帮洗衣妇拧床单。她说今年春天塞纳河涨了又退，船跟着一高一低，她的腰也跟着一高一低。'
text:
  en:
    name: Sophie Germain
    text: French mathematician, 1776 to 1831. Barred from the university, she studied from books and corresponded under a man's name. She made progress on Fermat's Last Theorem and won a prize of the Academy for her work on vibrating plates.
  zh:
    name: 索菲·热尔曼
    text: 法国数学家，1776 年生，1831 年去世。她被大学拒之门外，靠书本自学，并以男性名字通信。她在费马大定理上取得进展，并因对振动板的研究获得科学院奖。
hook: {en: 'The university that never let her in', zh: '那所没收过她的大学，要给她学位'}
facts:
  leblanc:
    date: '1804'
    checked: two_sources
    level: usable
    use: [history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'Women could not study at the École Polytechnique, so Germain obtained its lecture notes and sent her work to Lagrange under the name of Monsieur Le Blanc. From 1804 she wrote to Gauss under the same name; he learned who she was only in 1807.'
      zh: '综合理工学院不收女生，热尔曼弄来学院的讲义，用勒布朗先生的名字把自己的作业寄给拉格朗日。1804 年起，她又用这个名字给高斯写信，高斯到 1807 年才知道她是谁。'
    line:
      en: '1804: under the name of Monsieur Le Blanc, Germain begins writing to Gauss.'
      zh: '1804 年，热尔曼以勒布朗先生的名字开始给高斯写信。'
  prize:
    date: '1816'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'On her third attempt, in 1816, Germain won the prize of the Academy of Sciences with her memoir on the vibrations of elastic plates.'
      zh: '1816 年，热尔曼第三次参赛，以论弹性薄板振动的论文获得科学院的奖。'
    line:
      en: '1816: on her third attempt, Germain wins the prize of the Academy of Sciences for her memoir on vibrating elastic plates.'
      zh: '1816 年，热尔曼第三次参赛，以论弹性薄板振动的论文获科学院的奖。'
  elastic_surfaces:
    date: '1821'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sophie_germain_paris_primary]
    text:
      en: 'Sophie Germain published her mathematical study of elastic surfaces in 1821, engaging with patterns observed on vibrating plates.'
      zh: '索菲·热尔曼于 1821 年出版弹性曲面的数学研究，讨论振动薄板上观察到的图样。'
  cancer:
    date: '1829'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [germain_mactutor, germain_agnesscott]
    text:
      en: 'In 1829 Germain fell ill with breast cancer. She kept working through the illness and finished papers on number theory and on the curvature of surfaces.'
      zh: '1829 年，热尔曼得了乳腺癌。她病中没有停笔，写完了数论和曲面曲率的论文。'
    note: 'An illness: written as a plain fact.'
    line:
      en: '1829: Germain falls ill with breast cancer, and goes on working.'
      zh: '1829 年，热尔曼得了乳腺癌，仍在工作。'
  degree:
    date: '1831'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [germain_agnesscott, germain_britannica]
    text:
      en: 'Gauss persuaded the University of Göttingen to give Germain an honorary degree. She died before it was conferred. Accounts differ on when the university decided and whether the degree was conferred later.'
      zh: '高斯说动哥廷根大学授热尔曼名誉博士学位，她生前学位没有授出。学校何时作出决定、后来是否补授，各家说法不一。'
    line:
      en: '1831: Gauss has asked Göttingen to give Germain an honorary degree; it is not conferred in her lifetime.'
      zh: '1831 年，高斯为热尔曼向哥廷根大学争取的名誉博士学位，她生前没有授出。'
  death:
    date: '1831-06-27'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'Germain died of breast cancer on 27 June 1831 at 13 rue de Savoie in Paris, aged fifty five.'
      zh: '1831 年 6 月 27 日，热尔曼因乳腺癌在巴黎萨伏依街 13 号去世，五十五岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '27 June 1831: Sophie Germain dies at 13 rue de Savoie in Paris, aged fifty five.'
      zh: '1831 年 6 月 27 日，索菲·热尔曼在巴黎萨伏依街 13 号去世，五十五岁。'
  curvature:
    date: '1831'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [germain_crelle_eudml, germain_mactutor]
    text:
      en: 'Her Mémoire sur la courbure des surfaces appeared in 1831 in volume 7 of the Journal für die reine und angewandte Mathematik, edited by August Leopold Crelle in Berlin, pages 1 to 29.'
      zh: '她的《论曲面的曲率》1831 年刊于克雷勒在柏林主编的《纯粹与应用数学杂志》第七卷第 1 至 29 页。'
    line:
      en: '1831: her memoir on the curvature of surfaces appears in volume 7 of Crelle''s journal in Berlin.'
      zh: '1831 年，她论曲面曲率的论文刊于柏林克雷勒杂志第七卷。'
