quotes:
  germain_conjectures:
    order: 1
    tier: full
    date: '1896'
    checked: official_record
    sources: [germain_pensees_eduscol]
    original: fr
    text:
      en: {who: Sophie Germain, quote: 'Conjectures and opinions must have a place in human knowledge.', occasion: 'Pensées diverses, 1896 posthumous edition; game translation'}
      zh: {who: 索菲·热尔曼, quote: '在人类的知识里，猜想和见解也应当有一席之地。', occasion: '《杂感》1896 年身后刊本；本游戏译文'}
      fr: {who: Sophie Germain, quote: 'Les conjectures, les opinions doivent avoir une place dans les connaissances des hommes.', occasion: 'Pensées diverses, édition posthume de 1896'}
