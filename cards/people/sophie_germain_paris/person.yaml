      zh: {who: 索菲·热尔曼, quote: '我希望，今天说出实情，不会使我失去您曾给予那个借来的名字的礼遇。', occasion: '致卡尔·弗里德里希·高斯、说明自己身份的信；本游戏译文'}
      fr: {who: Sophie Germain, quote: 'J’espère que la singularité, dont je fais aujourd’hui l’aveu, ne me privera pas de l’honneur que vous m’avez accordé sous un nom emprunté', occasion: 'lettre à Carl Friedrich Gauss'}
