    text:
      en:
        name: "A paper for Berlin"
        place: "Paris"
        figure: "Sophie Germain"
        story: 'Sophie Germain exchanged work on number theory with Carl Friedrich Gauss, at first signing her letters Le Blanc. In 1816 the Academy of Sciences awarded her a prize for her work on vibrating plates. She kept working after falling ill in 1829. The seventh volume of Crelle’s journal in Berlin carried her memoir on the curvature of surfaces under her own name. She died in Paris on 27 June 1831.'
        story_prose:
          opening:
            - 'Paris, 1831. As a young woman Sophie Germain discussed number theory with Gauss under the name Le Blanc. She went on to win a prize for her work on vibrating plates. After falling ill she continued working on a paper about the curvature of surfaces, which eventually appeared in Crelle’s journal in Berlin.'
            - 'In history, she died in Paris in June. Some biographers record that Gauss recommended her for an honorary degree at Göttingen. She received no such degree in her lifetime. In this branch, the water carrier still climbs the stairs on the Rue de Savoie, and upstairs there is room on the desk for a letter.'
            - 'This trip needs someone who can check a mathematical manuscript and see it on its way. There is also work for someone who can ease a patient’s pain or bring news from scholars abroad.'
          points:
            p1: '{staff} checked the notation page by page, put the leaves in order and saw the paper into the hands of a courier bound for Berlin. Germain held the top sheet with one fingertip. As {staff} withdrew a hand, the lip of the wrapper came just over the last letter at the top of the page.'
            p2: '{staff} drew on experience of care to ease the pain and stayed until she could move to the desk herself. She reached for the unfinished page and pulled it closer. By the time the light reached the desk, her hand was feeling for the pen.'
            p3: '{staff} brought word of Gauss’s recommendation and read it to her slowly, following the wording of the letter. Germain took the page and read it through from the beginning. When she set it down, its two folds still held up a thin corner.'
          outcomes:
            all: 'The journal in Berlin later printed her paper. At the Paris desk she had been able to reach for her work while the pain eased, and she had lived to read that Gauss had put her name forward. The letter held down one corner of the pile, curling at the edge.'
            p3: 'The degree still came too late. The news reached Paris first, and the letter could still be found on the desk, lifting a little along the folds.'
            p2: 'When the pain eased, there were moments when she could sit at her desk again. Several sheets lay open in the middle of the desk, just as she had left them.'
            p1: 'The paper appeared in the seventh volume in Berlin. At its head was the printed name Sophie Germain.'
          none: 'The lamp upstairs went out early. A bucket still knocked against the stair wall, and the chair had already been pushed back under the desk.'
          not_admitted: '{staff} did not get into the upstairs room on the Rue de Savoie. Someone came past with a bucket, its wooden handle turning in their palm.'
          desync: 'The unsealed manuscript lay spread on the desk. When {staff} was recalled, the empty wrapper still lay open, flap upwards.'
          excerpts:
            p3: 'Germain took the page and read it through from the beginning. When she set it down, its two folds still held up a thin corner.'
            p2: 'She reached for the unfinished page and pulled it closer. By the time the light reached the desk, her hand was feeling for the pen.'
            p1: 'Germain held the top sheet with one fingertip. As {staff} withdrew a hand, the lip of the wrapper came just over the last letter at the top of the page.'
        relic: "A letter signed Le Blanc"
        relic_desc: "A letter to Gauss in a borrowed name."
        points:
          p1: 'While she is ill, keep her memoir on the curvature of surfaces on its way to Crelle''s journal in Berlin'
          p2: 'Ease the pain of the cancer in her last months in Paris'
          p3: 'Let Germain know before she dies that Gauss has asked Göttingen to give her an honorary degree'
        points_fail:
          p1: 'The memoir stays unfinished on her desk and the 1831 volume appears without it. This branch falls out of step with history and the office recalls the employee.'
          p2: 'Nobody eases the pain, and in this branch her last months are as hard as they were.'
          p3: 'No word reaches her, and she dies without knowing what Gauss had done for her.'
        shift:
          p1:
            was: 'In 1831 Germain''s memoir on the curvature of surfaces appeared in volume 7 of Crelle''s journal, the year she died.'
          p2:
            was: 'From about 1829 Germain was ill with breast cancer; she went on working and died in Paris on 27 June 1831.'
            now: '{staff} keeps the pain down with modern medicine and sits with her in the worst hours. She suffers less in her last months and keeps working at her desk.'
          p3:
            was: 'Gauss had urged the University of Göttingen to give Germain an honorary degree; when she died on 27 June 1831 it had not been conferred.'
            now: '{staff} brings her word of what Gauss has done. Germain hears that the university she could never attend means to honour her.'
            who: sophie_germain_paris
            bio: 'In this timeline Germain learned before she died that Gauss had put her forward for an honorary degree at Göttingen. The degree itself still came too late.'
        vignettes:
          water: 'On 7 March {staff} helps a water carrier haul two buckets of Seine water up five floors of a house in the rue de Savoie. Counting the steps between breaths, he says the houses of Paris get taller every year, and he is still paid by the bucket, not by the floor.'
          quai: 'In the middle of April {staff} leafs through an old almanac at a bookseller''s stall on the quay. The bookseller says the whole pile came from one household, the margins full of sums he cannot follow, so he sells them by the weight.'
          wash: 'Late in May {staff} helps a washerwoman wring sheets on a wash boat by the river. She says the Seine has risen and fallen all spring, the boat goes up and down with it, and so does her back.'
      zh:
        name: "寄往柏林的论文"
        place: "巴黎"
        figure: "索菲·热尔曼"
        story: '索菲·热尔曼与卡尔·弗里德里希·高斯通信讨论数论，起初署名勒布朗。1816 年，她凭弹性薄板振动研究获得法兰西科学院的奖。1829 年患病后，她仍继续工作。柏林克雷勒主编的杂志第七卷以她的本名刊出了她论曲面曲率的论文。1831 年 6 月 27 日，她在巴黎去世。'
        story_prose:
          opening:
            - '1831 年，巴黎。索菲·热尔曼年轻时曾用勒布朗的名字和高斯讨论数论，后来以弹性薄板研究获奖。患病以后，她还在写一篇论曲面曲率的论文。柏林克雷勒主编的杂志最终刊出了它。'
            - '史实里，她于六月在巴黎去世。部分传记记载高斯曾推荐她获得哥廷根大学的名誉学位，她生前未得到学位。在这条分支里，送水的人仍要走上萨伏依街的楼梯，楼上的书桌也还有地方搁一张来信。'
            - '这一趟用得上校得动数学稿、能把稿件送出去的人。懂得照护病痛的人，以及能把外地学界消息带来的人，也在这里派得上用场。'
          points:
            p1: '{staff}逐页校过曲率论文上的记号，把散页按次序叠好，交给送往柏林的信使。热尔曼用指尖按了按最上面的一页。{staff}抽出手时，封套口正好遮住页首最后一个字。'
            p2: '{staff}凭照护经验为她缓解疼痛，守到她可以自己挪到书桌旁。她伸手拖近没写完的纸。窗光照到桌面时，那只手已经在找搁笔的地方。'
            p3: '{staff}把高斯推荐她的消息带来，照信上的原意慢慢读给她听。热尔曼把纸接过去，从头看了一遍。她把纸放在桌上时，两道折痕还支着薄薄的一角。'
          outcomes:
            all: '柏林的刊物后来印出了她的论文。巴黎那张书桌上，她曾在疼痛稍歇时够到稿纸，也在生前读到了高斯推荐她的消息。来信压在纸叠一角，靠外的一边已经卷起。'
            p3: '学位仍来得太迟。那条消息先到了巴黎，后来桌上还能找到那封信，纸在折痕处松松地翘起来。'
            p2: '疼痛缓下去时，她还有些时候能坐到书桌前。桌上几张纸从中间摊开，没有再合回去。'
            p1: '柏林的第七卷刊出了那篇论文。翻到正文前，页首印的是索菲·热尔曼的名字。'
          none: '楼上的灯熄得早。楼梯上还有水桶在碰墙，桌前的椅子已经推了回去。'
          not_admitted: '{staff}没能进到萨伏依街楼上的房间。有人提着桶走过，木柄在掌心转了半圈。'
          desync: '没有封好的稿子还摊在桌上。{staff}被召回时，装稿的封套还空着，封口朝上。'
          excerpts:
            p3: '热尔曼把纸接过去，从头看了一遍。她把纸放在桌上时，两道折痕还支着薄薄的一角。'
            p2: '她伸手拖近没写完的纸。窗光照到桌面时，那只手已经在找搁笔的地方。'
            p1: '热尔曼用指尖按了按最上面的一页。{staff}抽出手时，封套口正好遮住页首最后一个字。'
        relic: "一封署名勒布朗的信"
        relic_desc: "一封用借来的名字写给高斯的信。"
        points:
          p1: '在她病中护住那篇论曲面曲率的论文，让它寄到柏林克雷勒的杂志'
          p2: '减轻她最后几个月在巴黎的癌痛'
          p3: '让热尔曼生前知道，高斯在为她向哥廷根大学争取名誉博士学位'
        points_fail:
          p1: '论文没写完，留在她的书桌上，1831 年那一卷里没有它。这条分支与历史脱节，员工被送回。'
          p2: '没人替她压住疼痛，这条分支里她最后几个月和历史上一样难熬。'
          p3: '消息没送到她手里，她到去世都不知道高斯为她做了什么。'
        shift:
          p1:
            was: '1831 年，热尔曼论曲面曲率的论文刊于克雷勒杂志第七卷，同年她去世。'
          p2:
            was: '约 1829 年起热尔曼患乳腺癌，仍坚持工作，1831 年 6 月 27 日在巴黎去世。'
            now: '{staff}用现代的药压住疼痛，在最难熬的时候陪着她。她最后几个月少受了些苦，还能坐到书桌前。'
          p3:
            was: '高斯曾推动哥廷根大学授予热尔曼名誉博士学位，1831 年 6 月 27 日她去世时，学位尚未授出。'
            now: '{staff}把高斯所做的事带给她。热尔曼得知，那所她从没能进去读书的大学要给她这份荣誉。'
            who: sophie_germain_paris
            bio: '这条时间线里，热尔曼生前得知高斯推荐她获得哥廷根的名誉博士学位。学位本身仍然来得太迟。'
        vignettes:
          water: '3 月 7 日，{staff}同送水的人把两桶塞纳河水扛上萨伏依街的五层楼。他数一级台阶喘一口，说工钱还是按桶算。上到最后一级，他把桶先放下来，手还套在提柄里。'
          quai: '四月中旬，{staff}在河岸的旧书摊上翻一本历书。摊主说这几本都是同一户人家的，页边的算式他看不懂，便把整摞往秤盘上挪。'
          wash: '五月下旬，{staff}在洗衣船上帮洗衣妇拧床单。她说塞纳河一涨一退，船跟着高低，腰也跟着高低。水从拧紧的床单里滴下去，落到船板上。'
text:
  en:
    name: Sophie Germain
    text: French mathematician, 1776 to 1831. Barred from the university, she studied from books and corresponded under a man's name. She made progress on Fermat's Last Theorem and won a prize of the Academy for her work on vibrating plates.
  zh:
    name: 索菲·热尔曼
    text: 法国数学家，1776 年生，1831 年去世。她被大学拒之门外，靠书本自学，并以男性名字通信。她在费马大定理上取得进展，并因对振动板的研究获得科学院奖。
hook: {en: 'The university that never let her in', zh: '那所没收过她的大学，要给她学位'}
facts:
  leblanc:
    date: '1804'
    checked: two_sources
    level: usable
    use: [history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'Women could not study at the École Polytechnique, so Germain obtained its lecture notes and sent her work to Lagrange under the name of Monsieur Le Blanc. From 1804 she wrote to Gauss under the same name; he learned who she was only in 1807.'
      zh: '综合理工学院不收女生，热尔曼弄来学院的讲义，用勒布朗先生的名字把自己的作业寄给拉格朗日。1804 年起，她又用这个名字给高斯写信，高斯到 1807 年才知道她是谁。'
    line:
      en: '1804: under the name of Monsieur Le Blanc, Germain begins writing to Gauss.'
      zh: '1804 年，热尔曼以勒布朗先生的名字开始给高斯写信。'
      zh-Hant: '1804 年，熱爾曼以勒布朗先生的名字開始給高斯寫信。'
      fr: '1804 : sous le nom de Monsieur Le Blanc, Germain commence à écrire à Gauss.'
      es: '1804: bajo el nombre de Monsieur Le Blanc, Germain comienza a escribir a Gauss.'
      ja: '1804年：ジェルマンはムッシュ・ル・ブランの名でガウスに手紙を書き始める。'
      ko: '1804년: 르 블랑 씨라는 이름으로 제르맹은 가우스에게 편지를 쓰기 시작합니다.'
      ru: '1804: под именем месье Леблана Жермен начинает писать Гауссу.'
  prize:
    date: '1816'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'On her third attempt, in 1816, Germain won the prize of the Academy of Sciences with her memoir on the vibrations of elastic plates.'
      zh: '1816 年，热尔曼第三次参赛，以论弹性薄板振动的论文获得科学院的奖。'
    line:
      en: '1816: on her third attempt, Germain wins the prize of the Academy of Sciences for her memoir on vibrating elastic plates.'
      zh: '1816 年，热尔曼第三次参赛，以论弹性薄板振动的论文获科学院的奖。'
      zh-Hant: '1816 年，熱爾曼第三次參賽，以論彈性薄板振動的論文獲科學院的獎。'
      fr: '1816 : à sa troisième tentative, Germain remporte le prix de l''Académie des Sciences pour son mémoire sur les plaques élastiques vibrantes.'
      es: '1816: en su tercer intento, Germain gana el premio de la Academia de Ciencias por sus memorias sobre las placas elásticas vibrantes.'
      ja: '1816年: ジャーメインは3度目の挑戦で、振動弾性板に関する回想録で科学アカデミー賞を受賞した。'
      ko: '1816년: 세 번째 시도에서 Germain은 진동 탄성판에 대한 회고록으로 과학 아카데미 상을 수상합니다.'
      ru: '1816: с третьей попытки Жермен получает премию Академии наук за мемуары о вибрирующих упругих пластинах.'
  elastic_surfaces:
    date: '1821'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sophie_germain_paris_primary]
    text:
      en: 'Sophie Germain published her mathematical study of elastic surfaces in 1821, engaging with patterns observed on vibrating plates.'
      zh: '索菲·热尔曼于 1821 年出版弹性曲面的数学研究，讨论振动薄板上观察到的图样。'
  cancer:
    date: '1829'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [germain_mactutor, germain_agnesscott]
    text:
      en: 'In 1829 Germain fell ill with breast cancer. She kept working through the illness and finished papers on number theory and on the curvature of surfaces.'
      zh: '1829 年，热尔曼得了乳腺癌。她病中没有停笔，写完了数论和曲面曲率的论文。'
    note: 'An illness: written as a plain fact.'
    line:
      en: '1829: Germain falls ill with breast cancer, and goes on working.'
      zh: '1829 年，热尔曼得了乳腺癌，仍在工作。'
      zh-Hant: '1829 年，熱爾曼得了乳腺癌，仍在工作。'
      fr: '1829 : Germain tombe malade d''un cancer du sein et continue à travailler.'
      es: '1829: Germain enferma de cáncer de mama y sigue trabajando.'
      ja: '1829年：ジェルマンは乳がんに罹患したが、仕事を続ける。'
      ko: '1829년: 제르맹은 유방암에 걸려 일을 계속합니다.'
      ru: '1829: Жермен заболевает раком груди и продолжает работать.'
  degree:
    date: '1831'
    checked: two_sources
    level: careful
    use: [wiki]
    sources: [germain_agnesscott, germain_degree_ebsco]
    text:
      en: 'Some biographical accounts say Gauss recommended Germain for an honorary degree at Göttingen. They disagree about how the university responded. Germain received no such degree in her lifetime.'
      zh: '部分传记记载，高斯曾推荐哥廷根大学授予热尔曼名誉学位，但对校方如何回应说法不一。热尔曼生前没有获得该学位。'
    note: 'The university decision is disputed; do not place it on the dated record.'
  death:
    date: '1831-06-27'
    stay_day: 118
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [germain_agnesscott, germain_mactutor]
    text:
      en: 'Germain died of breast cancer on 27 June 1831 at 13 rue de Savoie in Paris, aged fifty five.'
      zh: '1831 年 6 月 27 日，热尔曼因乳腺癌在巴黎萨伏依街 13 号去世，五十五岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '27 June 1831: Sophie Germain dies at 13 rue de Savoie in Paris, aged fifty five.'
      zh: '1831 年 6 月 27 日，索菲·热尔曼在巴黎萨伏依街 13 号去世，五十五岁。'
      zh-Hant: '1831 年 6 月 27 日，索菲·熱爾曼在巴黎薩伏依街 13 號去世，五十五歲。'
      fr: '27 juin 1831 : Sophie Germain décède au 13 rue de Savoie à Paris, à l''âge de cinquante-cinq ans.'
      es: '27 de junio de 1831: Sophie Germain muere en el número 13 de la rue de Savoie de París, a la edad de cincuenta y cinco años.'
      ja: '1831年6月27日：ソフィー・ジェルマン、パリのサヴォワ通り13番地で55歳で死去。'
      ko: '1831년 6월 27일: 소피 제르맹(소피 제르맹)이 파리의 13 rue de Savoie에서 55세의 나이로 사망했습니다.'
      ru: '27 июня 1831 года: Софи Жермен умирает на улице Савойя, 13 в Париже в возрасте пятидесяти пяти лет.'
  curvature:
    date: '1831'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [germain_crelle_facsimile, germain_crelle_eudml]
    text:
      en: 'Her Mémoire sur la courbure des surfaces appeared in 1831 in volume 7 of the Journal für die reine und angewandte Mathematik, edited by August Leopold Crelle in Berlin, pages 1 to 29.'
      zh: '她的《论曲面的曲率》1831 年刊于克雷勒在柏林主编的《纯粹与应用数学杂志》第七卷第 1 至 29 页。'
    line:
      en: '1831: her memoir on the curvature of surfaces appears in volume 7 of Crelle''s journal in Berlin.'
      zh: '1831 年，她论曲面曲率的论文刊于柏林克雷勒杂志第七卷。'
      zh-Hant: '1831 年，她論曲面曲率的論文刊於柏林克雷勒雜誌第七卷。'
      fr: '1831 : ses mémoires sur la courbure des surfaces paraissent dans le tome 7 du journal de Crelle à Berlin.'
      es: '1831: sus memorias sobre la curvatura de las superficies aparecen en el volumen 7 del diario de Crelle en Berlín.'
