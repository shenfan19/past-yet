        who: 'G. C.'
        quote: 'But this did not discourage him.'
        occasion: 'Invention of the Cherokee Alphabet, Cherokee Phoenix, p. 2, cols. 1–2, paragraph on opposition to Sequoyah’s work. The contributor signed G. C. and credited an unnamed friend of Sequoyah as the source. G. C.’s identity and the reported details are unconfirmed.'
      zh:
        who: '署名 G. C. 的撰稿人'
        quote: '但这并没有让他灰心。'
        occasion: '《切罗基凤凰报》〈切罗基文字的发明〉，第 2 页第 1–2 栏，述塞阔雅造字受到反对的一段。撰稿人署名 G. C.，称消息来自塞阔雅一位未具名的朋友。撰稿人身份与转述细节未获确认。游戏译文。'
      zh-Hant:
        who: '署名 G. C. 的撰稿人'
        quote: '但這並沒有讓他灰心。'
        occasion: '《切羅基鳳凰報》〈切羅基文字的發明〉，第 2 頁第 1–2 欄，述塞闊雅造字受到反對的一段。撰稿人署名 G. C.，稱消息來自塞闊雅一位未具名的朋友。撰稿人身份與轉述細節未獲確認。遊戲譯文。'
      fr:
        who: 'G.C.'
        quote: 'Mais cela ne l''a pas découragé.'
        occasion: '« Invention of the Cherokee Alphabet », Cherokee Phoenix, p. 2, col. 1–2, passage sur l’opposition aux travaux de Sequoyah. L’auteur, qui signe G. C., cite comme source un ami de Sequoyah dont il tait le nom. Ni son identité ni les détails rapportés ne sont confirmés.'
      es:
        who: 'G.C.'
        quote: 'Pero esto no le desanimó.'
        occasion: 'Invención del alfabeto Cherokee, Cherokee Phoenix, pág. 2, columnas. 1-2, párrafo sobre la oposición al trabajo de Sequoyah. El colaborador firmó con G. C. y acreditó como fuente a un amigo anónimo de Sequoyah. La identidad de G. C. y los detalles reportados no están confirmados.'
      ja:
        who: 'G.C.'
        quote: 'しかし、それでも彼は落胆しませんでした。'
        occasion: 'チェロキー文字の発明、チェロキーフェニックス、p. 2、列。 1-2、セコイアの作品に対する反対に関する段落。寄稿者は G.C. に署名し、情報源としてセコイアの匿名の友人をクレジットしました。 G.C.の身元と報告された内容は未確認です。'
      ko:
        who: 'G.C.'
        quote: '그러나 이것이 그를 낙담시키지는 못했습니다.'
        occasion: '체로키 알파벳의 발명, 체로키 피닉스, p. 2, 열. 1-2, 세쿼야의 작업에 반대하는 단락. 기고자는 G.C.에 서명하고 세쿼야의 익명의 친구를 출처로 명시했습니다. 지씨의 신원과 보도 내용은 확인되지 않았다.'
      ru:
        who: 'Г. К.'
        quote: 'Но это не обескуражило его.'
        occasion: 'Изобретение алфавита чероки, Чероки Феникс, с. 2, кол. 1–2, абзац о несогласии с работой Секвойи. Автор подписался GC и указал в качестве источника неназванного друга Секвойи. Личность Г.С. и сообщенные подробности не подтверждены.'
hook: {en: 'Can the next reader sound it out?', zh: '下一位读者能念出来吗'}
facts:
  council:
    date: '1821'
    stay_day: 60
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sequoyah_wcu_language, sequoyah_nps_language]
    text:
      en: 'Sequoyah completed the syllabary by 1821. Western Carolina University dates its formal adoption to 1825; the National Park Service account dates the council adoption to 1826.'
      zh: '塞阔雅于 1821 年完成音节文字。西卡罗来纳大学资料将正式采纳定在 1825 年，美国国家公园管理局资料则将议会采纳定在 1826 年。'
    line:
      en: '1821: Sequoyah finishes a set of signs that can put Cherokee words on paper.'
      zh: '1821 年，塞阔雅完成一套符号，能把切罗基语写在纸上。'
      zh-Hant: '1821 年，塞闊雅完成一套符號，能把切羅基語寫在紙上。'
      fr: '1821 : Sequoyah achève une série de signes qui permet de coucher les mots cherokees sur le papier.'
      es: '1821: Sequoyah termina una serie de carteles que pueden plasmar palabras cherokee en papel.'
      ja: '1821年: セコイアはチェロキー族の言葉を紙に記せる一連の標識を完成させる。'
      ko: '1821년: 세쿼야는 체로키어 단어를 종이에 적을 수 있는 표지판 세트를 완성합니다.'
      ru: '1821: Секвойя заканчивает набор знаков, с помощью которых можно записать на бумагу слова чероки.'
  phoenix:
    date: '1828-02-21'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sequoyah_asheville_phoenix, sequoyah_wcu_language]
    text:
      en: 'The first issue of the Cherokee Phoenix, the first Native American newspaper, was printed at New Echota on 21 February 1828, in Cherokee and English in parallel columns.'
      zh: '1828 年 2 月 21 日，第一份美洲原住民报纸《切罗基凤凰报》在新埃乔塔出版创刊号，切罗基文和英文分栏并排。'
    line:
      en: '21 February 1828: at New Echota the first Cherokee Phoenix comes off the press, Cherokee and English in columns side by side.'
      zh: '1828 年 2 月 21 日，新埃乔塔印出第一期《切罗基凤凰报》，切罗基文和英文分栏并排。'
      zh-Hant: '1828 年 2 月 21 日，新埃喬塔印出第一期《切羅基鳳凰報》，切羅基文和英文分欄並排。'
      fr: '21 février 1828 : à New Echota, le premier numéro du Cherokee Phoenix sort des presses, avec le cherokee et l’anglais en colonnes côte à côte.'
      es: '21 de febrero de 1828: en New Echota sale de la imprenta el primer Cherokee Phoenix, cherokee e inglés en columnas una al lado de la otra.'
      ja: '1828年2月21日: ニューエコタで、最初のチェロキー族フェニックスがチェロキー族とイギリス人が並んで列をなして報道陣から出てくる。'
      ko: '1828년 2월 21일: 뉴 에코타(New Echota)에서 최초의 체로키 피닉스(Cherokee Phoenix)가 인쇄판에서 나왔고, 체로키어와 영어가 나란히 열에 등장했습니다.'
      ru: '21 февраля 1828 года: в Нью-Эчоте из печати выходит первый чероки Феникс, чероки и англичане стоят в колоннах бок о бок.'
  death:
    date: '1843'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [encyclopedia_alabama_sequoyah, wikipedia_sequoyah]
    text:
      en: 'Sequoyah died in Mexico in August 1843; accounts differ on the exact place.'
      zh: '塞阔雅于 1843 年 8 月在墨西哥去世，具体地点说法不一。'
    note: 'Death: written as a plain fact.'
    line:
      en: 'August 1843: Sequoyah dies in Mexico.'
      zh: '1843 年 8 月，塞阔雅在墨西哥去世。'
      zh-Hant: '1843 年 8 月，塞闊雅在墨西哥去世。'
      fr: 'Août 1843 : Sequoyah meurt au Mexique.'
      es: 'Agosto de 1843: Sequoyah muere en México.'
      ja: '1843年8月：セコイアがメキシコで死去。'
      ko: '1843년 8월: 세쿼야가 멕시코에서 사망합니다.'
      ru: 'Август 1843 года: Секвойя умирает в Мексике.'
bystanders:
  learner:
    invented: true
    text: {en: 'A learner, made up for the game, who sounds out a word one sign at a time.', zh: '一位编出来的学字人，一个符号一个符号地念。'}
  neighbour:
    invented: true
    text: {en: 'A neighbour, made up for the game, who wants to write her name.', zh: '一位编出来的邻家妇人，想写出自己的名字。'}
