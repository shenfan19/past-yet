    text:
      en:
        name: A writing system made by one man
        place: Cherokee country, southeastern United States
        figure: Sequoyah
        story: 'Cherokee silversmith Sequoyah completed a writing system for Cherokee in 1821. Its signs represent syllables rather than individual sounds. The Cherokee Nation formally adopted the syllabary later in the decade. On 21 February 1828 the first Cherokee Phoenix came off the press in New Echota with both Cherokee and English in print.'
        story_prose:
          opening:
            - 'Cherokee country, in the southeast of the United States, 1821. The silversmith Sequoyah cannot read English, yet he has made a syllabary of some eighty signs for Cherokee, each sign standing for one syllable. He has been bent over this work for many years.'
            - 'In history, he was lame in one leg and walked with difficulty; the fields were left to his wife alone, his family begged him again and again to give it up, and his wife once burned his papers; when he showed the writing, people grew suspicious, and one accused him to his face. In this branch, a learner sounds out a word one sign at a time, and a neighbour wants to write her own name.'
            - 'A few kinds of people can help on this trip: someone calm, someone people listen to, or someone with an iron will, or someone with a golden apple, to stand up on the day suspicion runs high; someone who knows medicine, or someone with painkillers; someone strong willed who has farmed, or someone kind and very tough, to carry half a year of this household''s field work.'
          outcomes:
            all: 'In those years the writing spread among the Cherokee town by town, and his wife learned to write with it as well. On 21 February 1828 the first Cherokee Phoenix came off the press at New Echota, Cherokee and English in columns side by side.'
            p3: 'The fields did not go to waste that half year, and the quarrels at home grew fewer. Later his wife learned to write with the signs as well.'
            p2: 'That half year the pain in his leg eased, and he walked faster on the road to the next town to teach; the further he went, the more learners there were.'
            p1: 'The council later formally adopted the writing. On 21 February 1828 the first Cherokee Phoenix came off the press at New Echota, with Cherokee and English in columns side by side.'
          none: 'On the day of the showing the shouting drowned out everything, and Ayoka was never called back to read the word. The paper with the signs on it was trampled underfoot.'
          desync: 'On the day of the showing the shouting grew louder, and nobody waited any more for the child to come back. When {staff} was recalled, the crowd had gone from the open ground, and the paper with one word on it lay in the dirt beside a small footprint.'
          not_admitted: '{staff} never found a footing here, and only helped the neighbour trace her name a few times from a sheet of paper. Far off on the open ground, a man with a limp was pointing out the signs on a paper to a few people.'
          points:
            p2:
              class_medical: 'Sequoyah meant to go to the towns nearby to teach people the signs, but his lame leg hurt after a short way, and he had to rest several times on each stretch of road. {staff}, who knew medicine, put warm compresses on the leg every evening, worked the stiffness out of it, and cut his stick down to a height that fitted his hand. That day he reached the next town before the sun went down. He wrote a line of signs on a sheet of paper, and the learner leaned in and read it out syllable by syllable.'
              else: 'Sequoyah meant to go to the towns nearby to teach people the signs, but his lame leg hurt after a short way, and he had to rest several times on each stretch of road. {staff}, who had brought painkillers, gave him one before setting out each day, walked beside him all the way, and carried the roll of paper covered with signs for him. That day he reached the next town before the sun went down. He wrote a line of signs on a sheet of paper, and the learner leaned in and read it out syllable by syllable.'
            p1:
              trait_calm: 'On the day of the showing the open ground was crowded. Sequoyah sent his six year old daughter Ayoka away first, asked someone to say a word, wrote it down, and would then call her back to read it. Before he had finished writing, someone in the crowd grew suspicious, said the signs were uncanny and not to be trusted, and began shouting at him to his face. {staff} came unhurried to his side and asked everyone to wait, to let the child come back and read it first, and to talk once she had read it right. Ayoka was called back, looked down at the paper, and read the word out syllable by syllable. The ground went quiet for a while, and the one who had said the word took two steps forward and leaned in to look at the signs on the paper.'
              else: 'On the day of the showing the open ground was crowded. Sequoyah sent his six year old daughter Ayoka away first, asked someone to say a word, wrote it down, and would then call her back to read it. Before he had finished writing, someone in the crowd grew suspicious, said the signs were uncanny and not to be trusted, and began shouting at him to his face. {staff} stood out in front of the crowd and said, without raising their voice, that a moment''s wait would settle it once the child came back to read, and talked the shouters down one by one. Ayoka was called back, looked down at the paper, and read the word out syllable by syllable. The ground went quiet for a while, and the one who had said the word took two steps forward and leaned in to look at the signs on the paper.'
            p3:
              class_labour: 'The field work had long fallen on his wife alone, most of the corn ground had gone to waste, and the household had quarrelled over the writing for years. {staff}, who had farmed, went out at first light to hoe the weeds and earth up the rows, planted the abandoned rows again, and in the evening carried water home with his wife. That season''s harvest came into the house. Sequoyah spread the roll of paper covered with signs on the table, and his wife sat down beside him, looked for a long time, then reached out a finger and touched one of the signs.'
              else: 'The field work had long fallen on his wife alone, most of the corn ground had gone to waste, and the household had quarrelled over the writing for years. {staff}, strong and warm-hearted, went out to the fields with his wife every day, took on the heaviest work, and kept at it from morning until dark. That season''s harvest came into the house. Sequoyah spread the roll of paper covered with signs on the table, and his wife sat down beside him, looked for a long time, then reached out a finger and touched one of the signs.'
          excerpts:
            p1: 'Ayoka was called back, looked down at the paper, and read the word out syllable by syllable. The ground went quiet for a while, and the one who had said the word took two steps forward and leaned in to look at the signs on the paper.'
            p3: 'That season''s harvest came into the house. Sequoyah spread the roll of paper covered with signs on the table, and his wife sat down beside him, looked for a long time, then reached out a finger and touched one of the signs.'
            p2: 'That day he reached the next town before the sun went down. He wrote a line of signs on a sheet of paper, and the learner leaned in and read it out syllable by syllable.'
        relic: A syllabary chart
        relic_desc: A sheet with eighty-odd characters laid out in rows.
        points:
          p1: 'On the day he shows it, stop the charge that the signs are something uncanny and not to be trusted, and keep him and six year old Ayoka safe'
          p2: 'Ease the pain in his lame leg so he can walk to the towns to teach'
          p3: 'Help his wife bring the neglected fields back, and talk the family out of the quarrel the writing has caused'
        points_fail:
          p1: 'The charge drowns out the showing, Ayoka is never called back to read the word, and in this branch nobody sees that the signs can carry speech.'
          p2: 'The leg hurts as before, and in this branch he has to stop and rest after every stretch of road.'
          p3: 'The fields stay neglected and the family still begs him to give it up; in this branch the writing is still what it has cost this household for years.'
        shift:
          p1:
            was: 'Sequoyah completed the syllabary in 1821. The Cherokee Nation formally adopted it later in the decade.'
          p2:
            was: 'Sequoyah was lame in one leg and walked with difficulty; accounts of the cause differ.'
            now: 'The pain in his leg eased for those six months, and he walked faster on the road to the next town to teach.'
          p3:
            was: 'For years he left the work of the fields to his wife, his family begged him again and again to give up the writing, and his wife once burned his papers.'
            now: '{staff} kept the fields planted for the household those six months, and the quarrels grew fewer. His wife later learned to write with the signs as well.'
        vignettes:
          sound: '{staff} listens to a learner say a word at his usual speed and then slowly, and points to one sign for each syllable until he can go on alone.'
          lookalike: '{staff} catches a sign that looks like an English letter, and crosses out the letter pencilled beside it before it can mislead anyone.'
          note: '{staff} carries a slip across the council ground to someone who did not hear it spoken, and stands by while it is read out.'
      zh:
        name: 一个人造出来的文字
        place: 美国东南部切罗基地区
        figure: 塞阔雅
        story: '1821 年，切罗基银匠塞阔雅完成了切罗基语的音节文字，每个符号表示一个音节，而不是单个语音。切罗基民族后来正式采纳了这套文字。1828 年 2 月 21 日，《切罗基凤凰报》在新埃乔塔印出创刊号，报上既有切罗基文，也有英文。'
        story_prose:
          opening:
            - '1821 年，美国东南部的切罗基地区。银匠塞阔雅不识英文，却为切罗基语造出了一套八十多个符号的音节文字，每个符号记一个音节。为了这件事，他已经埋头做了好多年。'
            - '史实里，他一条腿跛着，走路吃力；家里的地丢给妻子一个人种，家人一再劝他放手，妻子还烧过他的稿子；演示这套文字时，旁人起了疑心，有人当面指控他。在这条分支里，有个一个符号一个符号往下念的学字人，还有个想写出自己名字的邻家妇人。'
            - '这一趟用得上几种人：沉得住气、说话有人听，或意志极坚的人，带着金苹果也行，在疑心四起的那天站得出来；懂医护的人，或带着止痛药的人；种过地、意志坚定的人，或心肠好、身子极结实的人，撑得起这个家半年的农活。'
          outcomes:
            all: '那几年，这套文字在切罗基人里一镇一镇传开，他的妻子也学会了用它写字。1828 年 2 月 21 日，新埃乔塔印出第一期《切罗基凤凰报》，切罗基文和英文分栏并排。'
            p3: '那半年地里没有荒，家里的争吵少了。后来，他的妻子也学会了用这些符号写字。'
            p2: '那半年他的腿疼得轻了些，去邻镇教字的路走得快了些，走一程，学字的人就多一些。'
            p1: '议会后来正式采纳了这套文字。1828 年 2 月 21 日，新埃乔塔印出第一期《切罗基凤凰报》，报上切罗基文和英文分栏并排。'
          none: '演示那天，嚷声压过了一切，阿约卡没有被叫回来念那个词。那张写着符号的纸被人踩在了脚下。'
          desync: '演示那天，嚷声越来越大，没有人再等那个孩子回来。{staff}被召回时，空地上的人已经散了，那张写着一个词的纸落在土里，边上有一个小小的脚印。'
          not_admitted: '{staff}没能在这里落下脚，只帮邻家妇人照着一张纸描了几遍她的名字。远处的空地上，有个跛着腿的人正给几个人指着纸上的符号。'
          points:
            p2:
              class_medical: '塞阔雅要到附近的镇子上教人认这些符号，那条跛着的腿走不了多远就疼，一段路要歇好几回。{staff}懂医护，每天傍晚给他热敷那条腿，揉开发僵的地方，又把他的拐杖削到合手的高度。那天他走到邻镇，太阳还没落。他在一张纸上写下一行符号，学字的人凑过来，一个音节一个音节念了出来。'
              else: '塞阔雅要到附近的镇子上教人认这些符号，那条跛着的腿走不了多远就疼，一段路要歇好几回。{staff}带着止痛的药，每天出门前让他服下，一路走在他身边，替他背着那卷写满符号的纸。那天他走到邻镇，太阳还没落。他在一张纸上写下一行符号，学字的人凑过来，一个音节一个音节念了出来。'
            p1:
              trait_calm: '演示那天，空地上围满了人。塞阔雅让六岁的女儿阿约卡先走开，请旁人说一个词，他写下来，再叫她回来念。还没写完，人群里就有人起了疑心，说这些符号来路不正，当面冲他嚷了起来。{staff}不慌不忙地走到他身边，请大家先别急，等孩子回来念一遍，念对了再说。阿约卡被叫了回来，低头看着那张纸，一个音节一个音节，把那个词念了出来。空地上静了一会儿，说出那个词的人往前走了两步，凑过去看纸上的符号。'
              else: '演示那天，空地上围满了人。塞阔雅让六岁的女儿阿约卡先走开，请旁人说一个词，他写下来，再叫她回来念。还没写完，人群里就有人起了疑心，说这些符号来路不正，当面冲他嚷了起来。{staff}站到人群前面，声音不高，说只要等一会儿，孩子回来一念就知道了，把嚷着的人一个一个劝了回去。阿约卡被叫了回来，低头看着那张纸，一个音节一个音节，把那个词念了出来。空地上静了一会儿，说出那个词的人往前走了两步，凑过去看纸上的符号。'
            p3:
              class_labour: '地里的活一直是他妻子一个人在扛，玉米地荒了大半，家里为这套文字已经吵了好些年。{staff}种过地，天一亮就下田，锄草、培土，把荒下的几垄重新种上，傍晚和他的妻子一起把水挑回来。那一季的收成进了屋。塞阔雅把那卷写满符号的纸摊在桌上，他的妻子在旁边坐下，看了很久，伸出手指，点在其中一个符号上。'
              else: '地里的活一直是他妻子一个人在扛，玉米地荒了大半，家里为这套文字已经吵了好些年。{staff}力气大，心肠也热，每天跟着他的妻子下地，把最重的活揽过去，从早干到天黑。那一季的收成进了屋。塞阔雅把那卷写满符号的纸摊在桌上，他的妻子在旁边坐下，看了很久，伸出手指，点在其中一个符号上。'
          excerpts:
            p1: '阿约卡被叫了回来，低头看着那张纸，一个音节一个音节，把那个词念了出来。空地上静了一会儿，说出那个词的人往前走了两步，凑过去看纸上的符号。'
            p3: '那一季的收成进了屋。塞阔雅把那卷写满符号的纸摊在桌上，他的妻子在旁边坐下，看了很久，伸出手指，点在其中一个符号上。'
            p2: '那天他走到邻镇，太阳还没落。他在一张纸上写下一行符号，学字的人凑过来，一个音节一个音节念了出来。'
        relic: 一张音节表
        relic_desc: 一张纸，八十多个字符排成行。
        points:
          p1: '演示那天，拦下说这套符号来路不正的指控，护住他和六岁的阿约卡'
          p2: '减轻他那条跛腿的疼，让他走得动去各镇教字'
          p3: '帮他的妻子把荒下的地种起来，劝住家里因为这套文字而起的争执'
        points_fail:
          p1: '指控压过了演示，阿约卡没被叫回来念出那个词，这条分支里没人看见这套符号能把话传出去。'
          p2: '那条腿照旧疼着，这条分支里他每走一段路都要停下来歇。'
          p3: '地照旧荒着，家里人照旧劝他放手，这条分支里，这套文字仍旧是这个家多年的代价。'
        shift:
          p1:
            was: '1821 年，塞阔雅完成了这套音节文字。切罗基民族在同一年代稍后正式采纳。'
          p2:
            was: '塞阔雅一条腿跛，走路吃力，起因各说不一。'
            now: '他那半年腿疼得轻了些，去邻镇教字的路走得快了些。'
          p3:
            was: '他多年把地里的活丢给妻子，家里人一再劝他放下造字，妻子还烧过他的稿子。'
            now: '{staff}那半年替这个家把地种了下来，家里的争执少了。后来，他的妻子也学会了用这套符号写字。'
        vignettes:
          sound: '{staff}听一个学字的人照平常的快慢念一个词，再慢慢念一遍，一个音节指一个符号，指尖在纸上点出了浅浅的印子，直到他自己能指着念下去。'
          lookalike: '{staff}看出有个符号长得像英文字母，把旁边铅笔标的那个字母划掉了，免得把人带偏，纸面被划得起了毛。'
          note: '{staff}捧着一张纸条穿过议会的空地，交给一个没听见口述的人，站在旁边听他念出来，鞋上沾着空地上的湿土。'
text:
  en:
    name: Sequoyah
    text: Cherokee silversmith, about 1770 to 1843. Without being able to read English, he devised a syllabary of some eighty signs for Cherokee, finished in 1821.
  zh:
    name: 塞阔雅
    text: 切罗基银匠，约 1770 年生，1843 年去世。他不识英文，为切罗基语创制了一套八十多个符号的音节文字，1821 年完成。
quotes:
  sequoyah_read_and_write:
    order: 1
    tier: full
    contextual: true
    date: '1828-08-13'
    checked: official_record
    sources: [sequoyah_phoenix_gc_1828]
    original: en
    text:
      en:
        who: 'G. C.'
        quote: 'able to read and write in their own language.'
        occasion: 'Invention of the Cherokee Alphabet, Cherokee Phoenix, p. 2, cols. 1–2, paragraph on the syllabary’s uptake. The contributor signed G. C. and credited an unnamed friend of Sequoyah as the source. G. C.’s identity and the reported details are unconfirmed.'
      zh:
        who: '署名 G. C. 的撰稿人'
        quote: '能够用自己的语言读写。'
        occasion: '《切罗基凤凰报》〈切罗基文字的发明〉，第 2 页第 1–2 栏，述音节文字推广的一段。撰稿人署名 G. C.，称消息来自塞阔雅一位未具名的朋友。撰稿人身份与转述细节未获确认。游戏译文。'
      zh-Hant:
        who: '署名 G. C. 的撰稿人'
        quote: '能夠用自己的語言讀寫。'
        occasion: '《切羅基鳳凰報》〈切羅基文字的發明〉，第 2 頁第 1–2 欄，述音節文字推廣的一段。撰稿人署名 G. C.，稱消息來自塞闊雅一位未具名的朋友。撰稿人身份與轉述細節未獲確認。遊戲譯文。'
      fr:
        who: 'G.C.'
        quote: 'capables de lire et d''écrire dans leur propre langue.'
        occasion: '« Invention of the Cherokee Alphabet », Cherokee Phoenix, p. 2, col. 1–2, passage sur l’apprentissage du syllabaire. L’auteur, qui signe G. C., cite comme source un ami de Sequoyah dont il tait le nom. Ni son identité ni les détails rapportés ne sont confirmés.'
      es:
        who: 'G.C.'
        quote: 'capaz de leer y escribir en su propio idioma.'
        occasion: 'Invención del alfabeto Cherokee, Cherokee Phoenix, pág. 2, columnas. 1-2, párrafo sobre la adopción del silabario. El colaborador firmó con G. C. y acreditó como fuente a un amigo anónimo de Sequoyah. La identidad de G. C. y los detalles reportados no están confirmados.'
      ja:
        who: 'G.C.'
        quote: '自分の言語で読み書きができる。'
        occasion: 'チェロキー文字の発明、チェロキーフェニックス、p. 2、列。 1-2、音節文字の普及に関する段落。寄稿者は G.C. に署名し、情報源としてセコイアの匿名の友人をクレジットしました。 G.C.の身元と報告された内容は未確認です。'
      ko:
        who: 'G.C.'
        quote: '자신의 언어로 읽고 쓸 수 있다.'
        occasion: '체로키 알파벳의 발명, 체로키 피닉스, p. 2, 열. 1-2, 음절 활용에 관한 단락. 기고자는 G.C.에 서명하고 세쿼야의 익명의 친구를 출처로 명시했습니다. 지씨의 신원과 보도 내용은 확인되지 않았다.'
      ru:
        who: 'Г. К.'
        quote: 'умеют читать и писать на своем языке.'
        occasion: 'Изобретение алфавита чероки, Чероки Феникс, с. 2, кол. 1–2, абзац об усвоении слогового письма. Автор подписался GC и указал в качестве источника неназванного друга Секвойи. Личность Г.С. и сообщенные подробности не подтверждены.'
