    text:
      en:
        name: A writing system made by one man
        place: Cherokee country, southeastern United States
        figure: Sequoyah
        story: 'Sequoyah, a Cherokee silversmith, made a syllabary of some eighty signs for writing Cherokee. In 1821 he showed at the Cherokee National Council that it worked, and it was accepted. On 21 February 1828 the first issue of the Cherokee Phoenix, the first Native American newspaper, was printed at New Echota in Cherokee and English side by side. Sequoyah died in Mexico in August 1843.'
        relic: A syllabary chart
        relic_desc: A sheet with eighty-odd characters laid out in rows.
        points:
          p1: 'On the day he shows it, stop the charge that the writing is witchcraft, and keep him and six year old Ayoka safe'
          p2: 'Ease the pain in his lame leg so he can walk to the towns to teach'
          p3: 'Help his wife bring the neglected fields back, and talk the family out of the quarrel the writing has caused'
        points_fail:
          p1: 'The charge drowns out the showing, Ayoka is never called back to read the word, and in this branch nobody sees that the signs can carry speech.'
          p2: 'The leg hurts as before, and in this branch he has to stop and rest after every stretch of road.'
          p3: 'The fields stay neglected and the family still begs him to give it up; in this branch the writing is still what it has cost this household for years.'
        shift:
          p1:
            was: 'In 1821, before the Cherokee national council, Sequoyah and his daughter Ayoka showed the signs at work, and the council took them up.'
          p2:
            was: 'Sequoyah was lame in one leg and walked with difficulty; accounts of the cause differ.'
            now: 'The pain in his leg eased for those six months, and he walked faster on the road to the next town to teach.'
          p3:
            was: 'For years he left the work of the fields to his wife, his family begged him again and again to give up the writing, and his wife once burned his papers.'
            now: '{staff} kept the fields planted for the household those six months, and the quarrels grew fewer. His wife later learned to write with the signs as well.'
        vignettes:
          sound: '{staff} listens to a learner say a word at his usual speed and then slowly, and points to one sign for each syllable until he can go on alone.'
          lookalike: '{staff} catches a sign that looks like an English letter, and crosses out the letter pencilled beside it before it can mislead anyone.'
          note: '{staff} carries a slip across the council ground to someone who did not hear it spoken, and stands by while it is read out.'
      zh:
        name: 一个人造出来的文字
        place: 美国东南部切罗基地区
        figure: 塞阔雅
        story: '切罗基银匠塞阔雅为切罗基语造了一套八十多个符号的音节文字。1821 年，他在切罗基全国议会上演示这套文字确实能用，议会接受了它。1828 年 2 月 21 日，第一份美洲原住民报纸《切罗基凤凰报》在新埃乔塔出了创刊号，切罗基文和英文并排印。1843 年 8 月，塞阔雅在墨西哥去世。'
        relic: 一张音节表
        relic_desc: 一张纸，八十多个字符排成行。
        points:
          p1: '演示那天，拦下把这套文字当成巫术的指控，护住他和六岁的阿约卡'
          p2: '减轻他那条跛腿的疼，让他走得动去各镇教字'
          p3: '帮他的妻子把荒下的地种起来，劝住家里因为这套文字而起的争执'
        points_fail:
          p1: '指控压过了演示，阿约卡没被叫回来念出那个词，这条分支里没人看见这套符号能把话传出去。'
          p2: '那条腿照旧疼着，这条分支里他每走一段路都要停下来歇。'
          p3: '地照旧荒着，家里人照旧劝他放手，这条分支里，这套文字仍旧是这个家多年的代价。'
        shift:
          p1:
            was: '1821 年，切罗基全国议会上，塞阔雅与女儿阿约卡演示这套符号，议会接受了它。'
          p2:
            was: '塞阔雅一条腿跛，走路吃力，起因各说不一。'
            now: '他那半年腿疼得轻了些，去邻镇教字的路走得快了些。'
          p3:
            was: '他多年把地里的活丢给妻子，家里人一再劝他放下造字，妻子还烧过他的稿子。'
            now: '{staff}那半年替这个家把地种了下来，家里的争执少了。后来，他的妻子也学会了用这套符号写字。'
        vignettes:
          sound: '{staff}听一个学字的人照平常的快慢念一个词，再慢慢念一遍，一个音节指一个符号，直到他自己能指着念下去。'
          lookalike: '{staff}看出有个符号长得像英文字母，把旁边铅笔标的那个字母划掉了，免得把人带偏。'
          note: '{staff}捧着一张纸条穿过议会的空地，交给一个没听见口述的人，站在旁边听他念出来。'
text:
  en:
    name: Sequoyah
    text: Cherokee silversmith, about 1770 to 1843. Without being able to read English, he devised a syllabary of some eighty signs for Cherokee, finished in 1821.
  zh:
    name: 塞阔雅
    text: 切罗基银匠，约 1770 年生，1843 年去世。他不识英文，为切罗基语创制了一套八十多个符号的音节文字，1821 年完成。
hook: {en: 'Can the next reader sound it out?', zh: '下一位读者能念出来吗'}
