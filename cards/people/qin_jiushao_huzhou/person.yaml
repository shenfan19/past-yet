    text:
      en:
        name: 'The answer must pass both rows'
        place: "Huzhou"
        figure: "Qin Jiushao"
        story: 'The first volume of Qin Jiushao’s Mathematical Treatise in Nine Sections sets out the Great Expansion procedures for problems involving remainders. The event year is the traditional date associated with the book.'
        relic: "A counting rod"
        relic_desc: "A bamboo counting rod worn smooth."
        points:
          p1: 'Check the problems and solutions against Qin’s categories. Leave the copyist in Huzhou the complete sequence'
          p2: 'Ask two readers to check the same remainder problem independently and record which line to check again'
          p3: 'Have Qin preserve one full example from rough calculation through the error and the final check. Ask a teacher to use it with a beginner'
        points_fail:
          p1: 'A category is bound with answers but its explanations are filed in another volume. The compilation cannot be assembled, and the office recalls the employee.'
          p2: 'The copied text has only a final number. When it fails a second remainder, a reader cannot tell which line to recalculate.'
          p3: 'A reader receives only the polished solution. When a result fails, they can do little but copy the answer.'
        shift:
          p1:
            was: 'Qin’s preface records choosing eighty-one problems for the Mathematical Treatise in Nine Sections, associated with 1247.'
          p2:
            was: 'Volume one presents the method for problems involving remainders, with worked procedures.'
            now: 'Both readers can trace the remainder that fails back to a line of arithmetic. Qin adds the check to the proof.'
          p3:
            was: 'Qin grouped problems by subject. The surviving text gives both statements and methods.'
            now: 'The reader working with a teacher can recover the step after a check fails. A copy Qin reviewed is kept for later copyists.'
            who: qin_jiushao_huzhou
            bio: 'Qin worked on the book during his mourning period in Huzhou. It presents problems, answers and procedures together.'
        vignettes:
          witness: 'The learner puts five counters down. Groups of three leave two, just as requested, but groups of five leave none. You ask him to test eight. That leaves two in the first row and three in the second. He crosses out one answer. You leave before they start a problem with a third row.'
          rows: 'You know the procedure will be studied long after the learner forgets this exercise. He asks why two remainders cannot be written in one box. You have him label the one for groups of three and the one for groups of five. He can now test the next answer on his own. That next answer is still out of reach when you go.'
          counters: 'You make eight counters into groups of three and then into groups of five. Each time you record only the left-over counters before rebuilding the pile. You bring home two checked rows. The larger problem stays on the table.'
      zh:
        name: '一份答案要过两行'
        place: "湖州"
        figure: "秦九韶"
        story: '秦九韶《数书九章》卷一大衍类详列处理余数问题的方法。'
        relic: "一枚算筹"
        relic_desc: "一根磨得发亮的竹算筹。"
        points:
          p1: '照秦九韶手中的题类核齐《数书九章》的题解，在湖州给会誊写的人留成套次序'
          p2: '请两位读者用相同的余数题分别验算，把哪一行需回验写进各自的算纸'
          p3: '让秦九韶挑一题从初算、错算到回验逐步留下，交给带新手的人按这个例子试教'
        points_fail:
          p1: '装订时有一类题只有答案，解说散在别卷。书不能按原来安排合成，事务所召回员工。'
          p2: '誊稿只有一个最终数。用另一条余数检查出问题时，读者不知道应追回哪一行。'
          p3: '传给下一位的人只有整理过的正确演算，初学者遇到坏结果便跳到书后照抄。'
        shift:
          p1:
            was: '秦九韶自序记从许多题中选出八十一题，编入成于 1247 年前后的《数书九章》。'
          p2:
            was: '《数书九章》卷一叙述处理有关余数问题的大衍方法，并展示解题步骤。'
            now: '两人可以把出错的那条余数指回算纸的一行。作者再把检查写在抄本边。'
          p3:
            was: '秦九韶按题类整理问题。现存传本显示题设与解法并列。'
            now: '试教的读者面对一次真实验算失败，能找到应重做的一步。之后仍保留秦九韶校过的例题，便于新抄人对读。'
            who: qin_jiushao_huzhou
            bio: '秦九韶在湖州居丧期间整理数学著作。作品将实际题目、答数与步骤放进同一个可学习的文本。'
        vignettes:
          witness: '学算人摆了五根筹。三根一组的确剩二，但五根一组剩零。你请他试八，第一行剩二，第二行剩三。他划去一个答案。再加第三行的题，你没等到。'
          rows: '你知道以后还有人研究这套算法，学算人却只想知道两个余数能不能填进同一格。你请他分别标明按三分组与按五分组的两行。他下次能自己验了，那个新答案你仍没赶上。'
          counters: '你把八根筹先按三根分，再按五根分。每回重摆之前，先记下没分进组的筹。你带回验过的两行，桌上还有一道更大的题。'
text:
  en:
    name: "Qin Jiushao"
    text: "Mathematician of the Southern Song, born about 1202, died about 1261. In 1247 he completed the Mathematical Treatise in Nine Sections, whose method of the great extension solves systems of linear congruences, later called the Chinese remainder theorem."
  zh:
    name: "秦九韶"
    text: "南宋数学家，约 1202 年生，约 1261 年去世。1247 年写成《数书九章》，其中的大衍求一术相当于解一次同余方程组，即后来所说的中国剩余定理。"
