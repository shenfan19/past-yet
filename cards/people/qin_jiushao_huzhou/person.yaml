      points:
        - {id: p1, kind: persuade, day: 67, req: {"any":[{"job":["archivist","teacher","tutor","bookseller"],"stat":{"wit":7}},{"trait":["scholarly","methodical"],"stat":{"wit":7,"will":6}}]}}
