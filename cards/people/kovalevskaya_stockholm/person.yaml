    text:
      en:
        name: 'The conditions on the first page'
        place: "Stockholm"
        figure: "Sofia Kovalevskaya"
        story: 'Kovalevskaya’s paper on rotation about a fixed point appeared in Acta Mathematica in 1889. The work identifies an integrable case with particular conditions on the moments of inertia and the position of the centre of mass.'
        story_prose:
          opening:
            - 'In Stockholm a proofreader has set a brass top on a loose page. Kovalevskaya gave him a working copy. The revised memoir is at the other end of the desk. Both first pages mention a rotating body, and the headings alone will not tell him what changed.'
            - 'The work earned Kovalevskaya the Prix Bordin in 1888. The memoir appeared in 1889, the year Stockholm gave her a permanent chair. You can keep its assumptions in the journal packet and ask for earlier written confirmation of the appointment date.'
            - 'Have someone who can match symbols to diagrams check the packet. When the news from Paris arrives, send someone who can obtain a written reply with a copy of her teaching schedule.'
          points:
            p1: 'The proofreader points at the tip of the top and asks whether it is also the centre of mass. You draw two points and have him find the fixed one on the first page, then go back to the condition about the other one. Kovalevskaya checks the symbols on both sheets and tells you which page goes into the packet. The proofreader keeps the top, and the bound copy has its conditions on the first page again.'
            p2: 'The clerk sets the news from Paris aside and asks who will teach the classes already listed. The two of you read through her timetable and find the first class she will have to prepare. He takes the list away and comes back with a letter giving the appointment date. She clips it to the first week of next term’s classes.'
          outcomes:
            all: 'The journal receives the conditions with the memoir, and the university confirms the date in time. She fills in the hours she has kept for research.'
            p1: 'The correct first page goes with the paper. With written confirmation still pending, she has to schedule the classes anyway.'
            p2: 'She has a letter with the start date. The journal packet goes wrong, and the trip preserves only the scene in which the clerk hands her the reply.'
          none: 'Both piles remain under the top. The start date is still blank when the traveller turns to the teaching schedule.'
          not_admitted: 'The proofreader gathers his pages and says he will wait for the author to identify the visitor. Outside, the traveller hears the brass top knock against the desk.'
          desync: 'An older first page without the conditions goes into the journal packet. The historical publication no longer matches, and the office recalls the traveller.'
          excerpts:
            p1: 'The proofreader keeps the top, and the bound copy has its conditions on the first page again.'
            p2: 'She clips it to the first week of next term’s classes.'
        relic: "A top model"
        relic_desc: "A brass spinning top with a number cut into its axis."
        points:
          p1: 'Check the Stockholm working copy against the revised memoir. Keep the earlier draft out of the packet for the journal'
          p2: 'Bring the news from Paris and a list of her teaching duties to the Stockholm university. Ask when her new appointment would begin and get it in writing'
        points_fail:
          p1: 'An older draft goes into the journal packet with conditions missing from the first page. The office calls {staff} back when the publication falls out of sync.'
          p2: 'The news reaches the university. She still has to plan the next term without a written start date.'
        shift:
          p1:
            was: 'The Paris Academy announced the Prix Bordin for Kovalevskaya’s work in December 1888. Her expanded memoir appeared in Acta Mathematica in 1889.'
          p2:
            was: 'She became a full professor in Stockholm in 1889.'
            now: 'In this branch the university confirms the start date in writing early enough for her to plan the next term’s teaching and research.'
            who: kovalevskaya_stockholm
            bio: 'Kovalevskaya taught and studied rigid-body rotation in Stockholm. The international prize and her local working conditions were decided by different institutions.'
        vignettes:
          conditions: 'The shorthand on a practice sheet says ‘a rotating body’. You use the first page to restore two qualifications, one for inertia and one for where the centre of mass sits. The proofreader copies both onto his slip. You can take the correction away, but the journal issue is still in the future.'
          diagram: 'The proofreader wants to try a toy top. You sketch a point that stays fixed and mark the separate point that represents the centre of mass. He can point out which is which on the next copy. The toy still spins when your time is up, and it has not proved the paper.'
          clip: 'You put the assumptions on the outside of the exercise and fold its loose diagram into it. The next reader will see the conditions before the result. You bring home the outline of a top and leave the proof on the desk.'
      zh:
        name: '写在首页的前提'
        place: "斯德哥尔摩"
        figure: "索菲娅·柯瓦列夫斯卡娅"
        story: '柯瓦列夫斯卡娅关于刚体绕定点转动的论文发表于 1889 年的《数学学报》。她找到一种可积分的情形，对转动惯量与质心位置有特定要求。'
        story_prose:
          opening:
            - '斯德哥尔摩，校对人用铜陀螺压着一张散页。柯瓦列夫斯卡娅拿给他的是工作稿，桌另一头还有修订稿。两份首页写的都是刚体转动，看标题分不出哪里改过。'
            - '史实里，她因这项研究获 1888 年博尔丹奖，论文于 1889 年刊行，同年在斯德哥尔摩获正式教授职位。这趟要保证刊行稿带着完整前提，也可以让学校早点书面确认聘期。'
            - '找能对照符号和图的员工守住寄刊纸包。巴黎的消息到了以后，让善于办理书面交接的人带着她的课程清单去问学校。'
          points:
            p1: '校对人指着陀螺的尖端问是不是质心。你画两个点，让他在首页找哪个叫定点，再回去读写质心的那条前提。柯瓦列夫斯卡娅核过两页的符号，让你把重抄的一页放进纸包。陀螺留给校对人，装订后的第一行重新有了条件。'
            p2: '校方的文书把获奖消息摆到一边，问目前的课谁来上。你和她沿着清单逐日读过去，指出第一堂需要提前安排的课。文书带着这张清单去问，再拿回写有起聘日期的回函。她把回函夹在下学期第一周的课表上。'
          outcomes:
            all: '送刊的稿子保留了条件，聘期也及时有了书面日期。她把课表上留给研究的几个时段写定。'
            p1: '正确的首页随论文一起送出。学校仍未书面回复，她要先把课排下去。'
            p2: '她已经拿到写明日期的回函。送刊稿出了岔子，回程只留下回函交到她手里的片段。'
          none: '两摞纸仍压在陀螺底下。员工翻到那张课表的时候，起聘日期还是空着的。'
          not_admitted: '校对人先收起稿件，礼貌地说明得等作者认人。员工留在外头，听见铜陀螺撞到桌沿。'
          desync: '缺了条件的早稿进了寄刊纸包。原有刊行记录无法重合，事务所召回员工。'
          excerpts:
            p1: '陀螺留给校对人，装订后的第一行重新有了条件。'
            p2: '她把回函夹在下学期第一周的课表上。'
        relic: "一只陀螺模型"
        relic_desc: "一只铜陀螺，轴上刻着编号。"
        points:
          p1: '在斯德哥尔摩把工作稿与修订稿逐页核对，免得早稿混进准备给刊物的纸包'
          p2: '拿着巴黎的获奖消息和她承担的教学清单去找校方，请他们书面确认新聘期何时开始'
        points_fail:
          p1: '送刊的纸包里混进了早稿，首页少了前提。刊行记录偏离原历史，事务所召回{staff}。'
          p2: '获奖消息传到了学校，她排下学期的课时仍拿不到书面的起聘日期。'
        shift:
          p1:
            was: '巴黎科学院于 1888 年 12 月公布博尔丹奖，表彰柯瓦列夫斯卡娅对刚体转动的研究。增订论文于 1889 年在《数学学报》刊行。'
          p2:
            was: '她于 1889 年在斯德哥尔摩获正式教授职位。'
            now: '这条分支里，校方提前书面确认了起聘日期，她可以据此安排下一学期的教学和研究。'
            who: kovalevskaya_stockholm
            bio: '柯瓦列夫斯卡娅在斯德哥尔摩教学并研究刚体转动。国际评奖及本地的工作条件分别由不同机构决定。'
        vignettes:
          conditions: '练习纸上省写成了「一个转动的刚体」。你照首页补回两类条件，一类管转动惯量，一类管质心在哪儿。校对人把两条都誊上纸条。你能抄走这两条更正，刊物还没有印出来。'
          diagram: '校对人想拿一只陀螺试。你画了一个固定不动的点，再标出代表质心的另一个点。他拿到下一张图就能分清两个地方。收队时陀螺仍在转，这一转证明不了论文。'
          clip: '你把前提折在练习纸外头，又把散开的图纸夹在里面。下一个人会先看见条件，再看到结论。你带回陀螺的轮廓，证明还留在桌上。'
text:
  en:
    name: "Sofia Kovalevskaya"
    text: "Russian mathematician, born 1850, died 1891. She was a professor in Stockholm, and in 1888 won a prize of the French Academy of Sciences for her work on the rotation of a rigid body."
  zh:
    name: "索菲娅·柯瓦列夫斯卡娅"
    text: "俄国数学家，1850 年生，1891 年去世。她在斯德哥尔摩任教授，1888 年因对刚体旋转问题的研究获得法国科学院的奖。"
