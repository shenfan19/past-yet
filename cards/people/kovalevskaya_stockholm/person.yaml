    line:
      en: '24 December 1888: The Paris Academy announced the Prix Bordin for Kovalevskaya’s work on rigid-body rotation.'
      zh: '1888 年 12 月 24 日，巴黎科学院宣布将博尔丹奖授予研究刚体转动的柯瓦列夫斯卡娅。'
      zh-Hant: '1888 年 12 月 24 日，巴黎科學院宣佈將博爾丹獎授予研究剛體轉動的柯瓦列夫斯卡婭。'
      fr: '24 décembre 1888 : L’Académie de Paris annonce le Prix Bordin pour les travaux de Kovalevskaya sur la rotation des corps rigides.'
      es: '24 de diciembre de 1888: La Academia de París anunció el Premio Bordin por el trabajo de Kovalevskaya sobre la rotación de cuerpos rígidos.'
      ja: '1888年12月24日: パリ・アカデミーはコバレフスカヤの剛体回転に関する研究に対してボルダン賞を発表した。'
      ko: '1888년 12월 24일: 파리 아카데미는 강체 회전에 대한 Kovalevskaya의 연구에 대한 Prix Bordin을 발표했습니다.'
      ru: '24 декабря 1888 г.: Парижская академия объявила о присуждении премии Бордена за работу Ковалевской по вращению твердого тела.'
  rotation:
