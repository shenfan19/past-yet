  en:
    name: Mount Everest, north side
    text: The north face of the highest mountain, with the Rongbuk glacier below and a line of camps strung up to the North Col and beyond. Everest in the game is a party model of about thirty people.
  zh:
    name: 珠穆朗玛峰北坡
    text: 世界最高峰的北坡，山下是绒布冰川，一串营地一直排到北坳和更高处。游戏里的珠峰是一个约三十人的队伍模型。
