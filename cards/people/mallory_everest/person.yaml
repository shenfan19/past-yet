      text:
        en:
          name: The plan for the high camps
          text: How the high camps were stocked and how far the oxygen sets were used was argued on the mountain. In the game an employee can help bring a change of plan earlier, which holds only in this branch.
        zh:
          name: 高营地的计划
          text: 高营地怎样补给、氧气装置用到什么程度，在山上一直有争论。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
