  bookend: '目击有地方可写，没看到的也留一格。 结尾还可看到交出的记录有没有待查一栏。'
  share_line: '目击有地方可写，没看到的也留一格。'
  share_number: '6月5日四号营地，6月8日最后目击'
  knowing: 'odell_sighting 知道后续有史料记下的日期。'
  near: 'camp_iv, odell_sighting'
  lever: expedition_handoff
  missed: expedition_send
  brought: expedition_handoff
pack: {author: The Teleporter, license: MIT, version: 1, languages: [en, zh]}
