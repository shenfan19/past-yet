    text:
      en:
        name: 'Same count, different arrangements'
        place: "Duino"
        figure: "Ludwig Boltzmann"
        story: 'In 1877 Ludwig Boltzmann tied the laws of heat to the statistics of atoms by counting the ways a distribution of energy can arise, but into the twentieth century many still doubted that atoms were real. In May 1906, ill with what was called severe neurasthenia, he stopped lecturing, and that summer he went with his family to Duino near Trieste. He died there on 5 September, aged sixty two. Two years later the experiments of Jean Perrin on Brownian motion began to confirm the predictions of Einstein, and atoms came to be accepted.'
        story_prose:
          opening:
            - 'The bay of Duino near Trieste, summer 1906. Ludwig Boltzmann is on holiday here with his wife and daughter. Nearly thirty years ago he counted how many arrangements can give the same distribution of energy, and tied the laws of heat to atoms. Even now, many do not believe that atoms really exist.'
            - 'In history, that May he stopped lecturing, ill with what was called severe neurasthenia, and Stefan Meyer took his lectures. On 5 September he died at Duino, aged sixty two. Two years later Perrin’s experiments on Brownian motion began to bear witness to atoms. In this branch, a fisherman dries his nets on the shore, a small boy counts pebbles on the beach, and the hotel maid brings the towels in from the sea every day.'
            - 'Two kinds of people can help on this trip: someone learned enough to talk with him about atoms, and someone who knows medicine, has brought the right remedy and can stay beside a sick man.'
          outcomes:
            all: 'In September the train for Vienna pulled out of Duino. Boltzmann sat by the window, his coat pocket bulging with those few sheets of working.'
            p2: 'In September the train for Vienna pulled out of Duino. He sat by the window and watched the sea all the way.'
            p1: 'All that summer the sheets of working stayed in his coat pocket.'
          none: 'The bay of Duino was very still. On the hotel terrace, a few sheets of working had blown off the table onto the floor.'
          not_admitted: '{staff} never got near the family. Every day the man on the hotel terrace sat facing the sea, and the holiday grew shorter day by day.'
          points:
            p1: 'One evening early in August Boltzmann sat on the hotel terrace, a few sheets of working weighed down on the table. {staff} picked one up and began with the jittering of tiny particles in water: how Einstein had worked out the year before how far such jittering should carry them, and how in two more years someone would measure it under a microscope. He listened to the end without a word, squared the sheets, and put them in his coat pocket. Going back to his room, he kept his hand pressed on that pocket.'
            p2:
              class_learned: 'As a doctor would, {staff} set the hours for his medicine and his sleep each day, took his pulse morning and evening, and walked with him a stretch along the shore by day. By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.'
              else: '{staff} changed the calming patches they had brought at the set times, sat with him at night until he slept, and walked with him a stretch along the shore by day. By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.'
          excerpts:
            p2: 'By the end of August he was sleeping longer at night than before, and in the mornings could walk to the sea by himself and back again. One day at breakfast he sent his daughter to ask what time the train for Vienna left.'
            p1: 'He listened to the end without a word, squared the sheets, and put them in his coat pocket. Going back to his room, he kept his hand pressed on that pocket.'
        relic: "A chalk stub"
        relic_desc: "A worn stub of lecture chalk."
        points:
          p1: 'Let him know that within a few years experiments will show atoms are real, and the theory he defended for half his life will stand'
          p2: 'Before the Duino holiday ends, cure his illness and see him back to Vienna'
        points_fail:
          p1: 'He spends the summer still among the doubters. In this branch nobody told him that experiments on Brownian motion would bear witness to atoms.'
          p2: '5 September happened as it did in history. In this branch he never returned to his lectern in Vienna.'
        shift:
          p1:
            was: 'When Boltzmann died on 5 September 1906, many physicists and chemists still doubted that atoms were real; from 1908 Perrin''s experiments on Brownian motion confirmed Einstein''s 1905 predictions, and atoms came to be generally accepted.'
            now: 'That summer he already knew that within a few years someone would settle the question of atoms by experiment.'
          p2:
            was: 'In May 1906 Boltzmann went on sick leave and Stefan Meyer took over his lectures; on 5 September he died while on holiday at Duino, aged sixty two.'
            now: '{staff} stayed with him through that summer at Duino, and the illness slowly eased. In the autumn he went home to Vienna with his family, taught again, and lived to see atoms confirmed by experiment.'
            who: boltzmann_duino
            bio: 'In this line Boltzmann recovered in the autumn of 1906, went back to Vienna, taught for some years more, and saw Perrin''s experiments win acceptance for atoms.'
        shift_all: 'He knew his theory would stand, his illness eased, and in the autumn he went back to Vienna to teach.'
        vignettes:
          pebbles: 'In July {staff} helps a fisherman''s small son count a bucket of pebbles on the beach. The boy asks whether things too small to count are there at all. {staff} says they are there whether anyone counts them or not; the boy thinks about it, and throws in another handful.'
          nets: 'Early in July {staff} helps a fisherman bring in the nets drying on the shore. Slovene, Italian, German, the fisherman says, you hear them all round this bay, and the fish do not care which one you curse them in.'
          towels: 'In August {staff} helps the hotel maid bring in the towels drying by the sea. The water warmed early this year, she says, the guests from the city stay the whole season, and the salt has taken the skin off her hands.'
      zh:
        name: '同一个数，几种排法'
        place: "杜伊诺"
        figure: "路德维希·玻尔兹曼"
        story: '1877 年，路德维希·玻尔兹曼数出同一种能量分布可以有多少种排法，把热的规律和原子的统计联系起来，可直到二十世纪初，原子是否真实存在仍有许多人怀疑。1906 年 5 月，他因所谓严重的神经衰弱停课，夏天和家人到的里雅斯特附近的杜伊诺度假。9 月 5 日，他在那里去世，六十二岁。两年后，让·佩兰的布朗运动实验开始证实爱因斯坦的预言，原子渐渐被人接受。'
        story_prose:
          opening:
            - '1906 年夏，的里雅斯特附近的杜伊诺海湾。路德维希·玻尔兹曼和妻子、女儿在这里度假。将近三十年前，他数出同一种能量分布可以有多少种排法，把热的规律和原子连在一起。到这时，还有许多人不信原子真的存在。'
            - '史实里，这年 5 月他因所谓严重的神经衰弱停了课，课由斯特凡·迈尔代讲。9 月 5 日，他在杜伊诺去世，六十二岁。两年后，佩兰的布朗运动实验开始替原子作证。在这条分支里，岸边有晾网的渔夫，沙滩上有数石子的小孩，旅馆的女招待每天把浴巾从海边收回来。'
            - '这一趟用得上两种人：讲得清学问、能同他谈原子的人，懂医、带对了药、陪得住一个病人的人。'
          outcomes:
            all: '九月，回维也纳的火车开出杜伊诺。玻尔兹曼靠窗坐着，上衣口袋里鼓着那几张算草。'
            p2: '九月，回维也纳的火车开出杜伊诺。他靠窗坐着，看了一路的海。'
            p1: '那个夏天，那几张算草一直在他的上衣口袋里。'
          none: '杜伊诺的海湾很静。旅馆露台的桌上，几张算草被风吹到了地上。'
          not_admitted: '{staff}没能走近那一家人。旅馆露台上的人每天对着海坐着，假期一天天少下去。'
          points:
            p1: '八月初的一个傍晚，玻尔兹曼坐在旅馆的露台上，桌上压着几张算草。{staff}拿起一张，从水里微粒的乱跳讲起，讲爱因斯坦前一年怎样算出这种乱跳该走多远，再过两年，就会有人在显微镜底下照着去量。他听完没说话，把那几张算草叠齐，放进了上衣口袋。起身回房时，他的手一直按在那只口袋上。'
            p2:
              class_learned: '{staff}照医生的办法，替他定好每天吃药和睡觉的钟点，早晚各诊一回脉，白天陪他沿着海边走一段。八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。'
              else: '{staff}按时给他换上带来的镇静贴片，夜里守着他入睡，白天陪他沿着海边走一段。八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。'
          excerpts:
            p2: '八月底，他夜里睡得比先前长了，早上能自己走到海边，再走回来。有一天吃早饭时，他让女儿去问回维也纳的火车几点开。'
            p1: '他听完没说话，把那几张算草叠齐，放进了上衣口袋。起身回房时，他的手一直按在那只口袋上。'
        relic: "一截粉笔"
        relic_desc: "一截用得很短的讲课粉笔。"
        points:
          p1: '让他知道，原子的存在过不了几年就会被实验证实，他为之争了半辈子的学说站得住'
          p2: '在杜伊诺的假期结束之前，治好他的病，让他回到维也纳'
        points_fail:
          p1: '他照旧在怀疑声里过完这个夏天，这条分支里没有人告诉过他布朗运动的实验会替原子作证。'
          p2: '9 月 5 日照史实发生，这条分支里他没有回到维也纳的讲台。'
        shift:
          p1:
            was: '1906 年 9 月 5 日玻尔兹曼去世时，原子是否真实存在仍有不少物理学家和化学家怀疑；1908 年起佩兰的布朗运动实验验证了爱因斯坦 1905 年的预言，原子才被普遍接受。'
            now: '那个夏天他已经知道，原子的事过几年就会有人用实验定下来。'
          p2:
            was: '1906 年 5 月玻尔兹曼因病停课，课由斯特凡·迈尔代讲；同年 9 月 5 日他在杜伊诺度假时去世，终年六十二岁。'
            now: '{staff}陪他过了杜伊诺的那个夏天，病一点点缓下来。秋天他带着家人回到维也纳，又站上了讲台，还亲眼看到原子被实验证实。'
            who: boltzmann_duino
            bio: '这条时间线里，玻尔兹曼 1906 年秋天病好了回到维也纳，又教了几年书，看到了佩兰的实验让原子学说被普遍接受。'
        shift_all: '他知道自己的学说站得住，病也好了，秋天回到维也纳接着讲课。'
        vignettes:
          pebbles: '七月，潮水刚退，{staff}在海滩上帮渔夫的小儿子数一桶小石子。孩子问，太小、数不清的东西，是不是就不算有。{staff}说没人数它也在那儿。孩子想了想，又往桶里扔了一把。'
          nets: '七月初，{staff}帮渔夫把晾在岸边的网收起来，网眼里还挂着几片海草。渔夫说这一湾斯洛文尼亚话、意大利话、德国话都听得到，鱼可不管你用哪种话骂它。'
          towels: '八月，{staff}帮旅馆的女招待把海边晾干的浴巾收回来，海风把布吹得鼓鼓的。她说今年海水暖得早，城里来的客人一住就是一整季，她的手让盐水泡得起了皮。'
text:
  en:
    name: Ludwig Boltzmann
    text: Austrian physicist, 1844 to 1906. He explained the laws of heat through the statistics of atoms, and the entropy formula is carved on his tomb. His work on atoms remained controversial in his lifetime. He died at Duino in 1906.
  zh:
    name: 路德维希·玻尔兹曼
    text: 奥地利物理学家，1844 年生，1906 年去世。他用原子的统计解释热的规律，熵公式刻在他的墓碑上。他生前，有关原子的研究仍有争议。1906 年，他在杜伊诺去世。
