    text:
      en: 'From 1908 Jean Perrin''s experiments on Brownian motion confirmed the predictions Einstein had made in 1905, and the reality of atoms came to be generally accepted.'
      zh: '1908 年起，让·佩兰的布朗运动实验证实了爱因斯坦 1905 年的预言，原子的真实存在渐渐被普遍接受。'
    line:
