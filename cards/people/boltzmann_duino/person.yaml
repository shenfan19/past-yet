    text:
      en: 'Boltzmann''s 1877 paper on probability and thermal equilibrium counts how many assignments of particles yield the same distribution of energy.'
      zh: '玻尔兹曼 1877 年关于概率与热平衡的论文，计算同一种能量分布可由多少种粒子分配方式得到。'
    line:
      en: '1877: Boltzmann counts how many arrangements of particles give the same distribution of energy.'
      zh: '1877 年，玻尔兹曼数出同一种能量分布可由多少种粒子排法得到。'
  leave:
