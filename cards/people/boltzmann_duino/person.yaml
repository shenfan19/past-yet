text:
  en:
    name: Ludwig Boltzmann
    text: Austrian physicist, 1844 to 1906. He explained the laws of heat through the statistics of atoms, and the entropy formula is carved on his tomb. Facing doubts about atoms and suffering from depression, he died at Duino in 1906.
  zh:
    name: 路德维希·玻尔兹曼
    text: 奥地利物理学家，1844 年生，1906 年去世。他用原子的统计解释热的规律，熵公式刻在他的墓碑上。面对对原子存在的怀疑，又受抑郁困扰，他 1906 年在杜伊诺去世。
