    text:
      en:
        name: A great water-driven clock tower
        place: Kaifeng, China
        figure: Su Song
        story: 'Su Song''s illustrated treatise describes a water-driven tower with astronomical instruments and figures that announce time.'
        relic: A gear tooth
        relic_desc: One bronze tooth of a gear as tall as a person.
        points:
          p1: 'Help Su Song and Han Gonglian write down, piece by piece, how the wooden model is made, so that later craftsmen could build another from it'
        points_fail:
          p1: 'As in history the tower is carried off after 1127, and when the court sends for Su Song''s son and his father''s papers, he cannot make sense of them; in this branch too nobody can build it again.'
        shift:
          p1:
            was: 'After the Jingkang disaster of 1127 the instruments went to the Jin; when the Southern Song court sent for Su Song''s son Su Xie and his father''s papers to study the old method, Su Xie could not understand it either.'
            now: 'After the court moved south, craftsmen worked from the written method and built a water-driven armillary tower again.'
            who: su_song_kaifeng
            bio: 'In this timeline Su Song and Han Gonglian left an account that craftsmen could build from, and the tower was made again after the move south.'
        vignettes:
          listen: 'You stand beyond the door where the figures cannot be seen. The keeper strikes two practice signals. You repeat them in order and he checks them against their labels.'
          layers: 'The keeper points to one figure but describes the one above it. You trace each storey on the drawing and ask him to assign one sound to each line before the next demonstration.'
          marker: 'You put a marker outside the model where visitors should stand. The next pair can see the doors open without blocking the keeper''s own view.'
      zh:
        name: 一座水力驱动的大钟楼
        place: 中国开封
        figure: 苏颂
        story: '苏颂《新仪象法要》图文记载水运仪象台，上有观测仪器，另有随钟鼓报时的木人。'
        relic: 一枚齿轮的齿
        relic_desc: 一个与人一样高的齿轮上的一颗青铜齿。
        points:
          p1: '帮苏颂和韩公廉把木样怎样一件件做成写进图说，让后来的工匠照着能再造一座'
        points_fail:
          p1: '靖康之后仪象台照史实归了金人，南渡后朝廷召苏颂之子苏携取遗书考证，他也看不懂，这条分支里同样没人造得出来。'
        shift:
          p1:
            was: '靖康之变后，仪象诸器归于金人；南渡后朝廷召苏颂之子苏携取遗书考质旧法，苏携也不能通晓。'
            now: '南渡以后，工匠照着这份写明做法的图说，又造出了一座水运仪象。'
            who: su_song_kaifeng
            bio: '这条时间线里，苏颂与韩公廉留下了一份工匠照着做得出的图说，仪象台在南渡后又造了起来。'
        vignettes:
          listen: '你站到门外，看不见木人。看守敲了两组试声。你依次复述，他拿标签逐一对上。'
          layers: '看守手指着这层，嘴里却讲的是上面那层。你沿图一层层划过去，请他下一次演示前给声音各标一行。'
          marker: '你在模型外做了个站位标记。下一对来看的人能见到门开，也不挡看守自己的视线。'
text:
  en:
    name: Su Song
    text: Chinese official and engineer of the Song, 1020 to 1101. In 1088 at Kaifeng he completed a water driven astronomical clock tower with an escapement and a rotating celestial globe.
  zh:
    name: 苏颂
    text: 宋代官员与工程师，1020 年生，1101 年去世。1088 年他在开封建成一座水力驱动的天文钟塔，带有擒纵机构和转动的天球。
hook: {en: 'Can you tell the hour by sound alone?', zh: '光听声能认出是哪一刻吗'}
