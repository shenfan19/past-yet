text:
  en:
    name: Maria Thins
    text: Born in 1592 and died in 1680, of a well-off family from Gouda, the mother of Catharina Bolnes and mother-in-law of Johannes Vermeer. The Vermeers lived in her house on the Oude Langendijk in Delft, and he was buried in a grave she had bought. On 24 February 1676 her daughter passed The Art of Painting to her.
  zh:
    name: 玛丽亚·廷斯
    text: 1592 年生，1680 年去世，出身豪达的富裕人家，卡塔琳娜·博尔内斯的母亲，约翰内斯·维米尔的岳母。维米尔一家住在她代尔夫特老朗恩代克街的房子里，维米尔葬在她买下的墓穴。1676 年 2 月 24 日，女儿把《绘画艺术》转到她名下。
