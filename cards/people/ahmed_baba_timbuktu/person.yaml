      zh: '1608 年他获准回到廷巴克图。'
    line:
      en: '1608: Ahmad Baba is allowed to go home to Timbuktu.'
      zh: '1608 年，艾哈迈德·巴巴获准回到廷巴克图。'
  death:
    date: '1627-04-22'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [britannica_ahmad_baba, btu_ahmad_baba]
    text:
