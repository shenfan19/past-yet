        - {id: p2, kind: care, day: 75, req: {"any":[{"job":["midwife","nurse","paramedic","doctor","physician","pharmacist","caregiver"]},{"trait":["kind"],"stat":{"constitution":6}},{"item":"water_station"}]}}
