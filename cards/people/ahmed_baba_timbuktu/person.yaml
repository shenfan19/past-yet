    text:
      en: 'The archival study dates Ahmad Baba’s forced stay from 1594 and identifies two biographical works compiled in Morocco as supplements to Ibn Farḥūn.'
      zh: '档案研究记艾哈迈德·巴巴自 1594 年被迫滞留摩洛哥，并指出他在那里编的两部人物辞书以伊本·法尔洪的书为补编对象。'
  return:
