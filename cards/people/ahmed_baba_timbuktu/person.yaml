    text:
      en:
        name: 'A name for the supplement'
        place: "Timbuktu"
        figure: "Ahmed Baba"
        story: 'After the Moroccan army took Timbuktu in 1591, the scholar Ahmad Baba was accused of resisting the sultan and in 1594 was deported to Marrakesh. There he compiled biographical dictionaries as supplements to Ibn Farhun. He was allowed to return to Timbuktu in 1608 and died there on 22 April 1627.'
        story_prose:
          opening:
            - 'Timbuktu, 1594. Three years ago the Moroccan army took the city. Ahmed Baba is a scholar here; he has written dozens of books on law and grammar, and his house holds a very large library.'
            - 'In history, this year he was accused of defying the sultan and marched with his family across the Sahara, north to Marrakesh. His books were taken, or by another account lost on the road. Fourteen years later he was allowed home, and the books were gone. In this branch, the wife of a household at the far end of the lane is willing to clear a space under her bed, and the copyist in the courtyard is still writing labels for his books.'
            - 'Three kinds of people can help on this trip: someone who knows old books and which chests to save first, someone bold and hardy enough to stand against the shoving on the day he is led away, and someone who knows nursing and can treat wounds and share out water in the desert.'
          outcomes:
            all: 'In 1608 Ahmed Baba came back to Timbuktu. The neighbour''s wife had grown old. She dragged the chests out from under her bed, a layer of dust on the leather. He opened the volume on top and knew his own hand.'
            p3: 'Fourteen years later he came back to Timbuktu. That household carried the chests out from under the bed, and he ran his hand over the volumes one by one, and sat beside the chests a long while.'
            p2: 'The whole household, old and young, reached Marrakesh. By the city gate the child''s foot had scabbed over.'
            p1: 'He reached Marrakesh alive. Fourteen years later he was allowed home.'
          none: 'The column going north drew far off. In that room in Timbuktu the shelves stood empty, and the door was not shut.'
          desync: 'On the day he was led away there was a scuffle at the corner of the street, and {staff} was recalled by the office before reaching his side. The last thing in sight was a shoe trampled off in the crowd.'
          not_admitted: '{staff} never got into that courtyard. The books were still on the shelves, and the day he would be led away was drawing near.'
          points:
            p3:
              class_craft: '{staff} went by the rules for mending old books, laid dry cloth between the most brittle volumes, leather facing in, flaps pressed flat, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
              class_lettered: '{staff} chose by the list of books, first his own drafts and the copies of which no other existed, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
              else: '{staff} went through the titles volume by volume, set aside first his own drafts and the rare copies, and packed them into the chests layer by layer. After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
            p1: 'On the day he was led away the street was packed, and in the shoving someone drew a blade. {staff} stood in front of Ahmed Baba, pulled him into a doorway, and braced a back against the door frame. When it had passed he straightened his robe and walked out on his own, unhurt.'
            p2: 'Half a month into the road north, a man in the column ran a high fever, and a child had worn the soles of his feet raw. Every evening after camp was made {staff} washed wounds, changed dressings, and shared out the water a measure to each. One night the child held out his own waterskin; there was one mouthful left in it.'
          excerpts:
            p3: 'After dark two men carried the chests through two lanes into the house of the neighbour''s wife. She dragged the clutter out from under her bed, pushed the chests in, stuffed the clutter back where it had been, and dusted off her hands.'
            p2: 'Every evening after camp was made {staff} washed wounds, changed dressings, and shared out the water a measure to each. One night the child held out his own waterskin; there was one mouthful left in it.'
            p1: '{staff} stood in front of Ahmed Baba, pulled him into a doorway, and braced a back against the door frame. When it had passed he straightened his robe and walked out on his own, unhurt.'
        relic: "A leather bound manuscript"
        relic_desc: "A manuscript in a worn leather cover with a flap."
        points:
          p1: 'Before he is taken away, stop the blades turned on the arrested scholars, and keep Ahmed Baba alive for the road north'
          p2: 'Treat the kinsmen who fall ill or hurt in the desert, share out the water, and keep the household from falling behind'
          p3: 'Before the soldiers take the books, save a few chests of his library and leave them hidden with a family in the town'
        points_fail:
          p1: 'In this branch he did not leave Timbuktu alive, and the biographical dictionaries of Marrakesh and the twenty nine books written in Morocco are gone.'
          p2: 'Nobody helped up those who fell on the road, and in this branch the family''s journey north was as hard as it had been.'
          p3: 'All his books were taken, and in this branch, when he came back to Timbuktu fourteen years later, not one of his own books was left.'
        shift:
          p1:
            was: 'In 1594 Ahmad Baba was charged with defying the sultan and taken to Marrakesh; in 1608 he was allowed home to Timbuktu.'
          p2:
            was: 'In 1594 the family of Ahmad Baba was marched north across the Sahara with him.'
            now: 'The kinsmen who travelled with him reached Marrakesh having suffered a little less.'
          p3:
            was: 'In 1594 his library was taken by the Moroccans, or by another account lost on the way north; when he came back to Timbuktu in 1608 the books were gone.'
            now: 'Before he was taken away, a few chests of books were moved under a bed in a house in the town. When he came home fourteen years later, that family carried the chests out.'
            who: ahmed_baba_timbuktu
            bio: 'Ahmad Baba came home to Timbuktu in 1608 and found a few chests of his own books still kept by a family in the town. He taught from them in his last years.'
        vignettes:
          same_name: '{staff} finds one name written two ways in two volumes and keeps both spellings on the list, with a mark between them, instead of choosing one.'
          courtyard: '{staff} sets the volumes out in the shade of the courtyard to air them after the rains, and turns each one at noon so the covers dry evenly.'
          slip: '{staff} writes the title and the first line of each volume on a narrow slip and tucks it under the leather flap, so the book can be named without opening it.'
      zh:
        name: '给补编留一个名字'
        place: "廷巴克图"
        figure: "艾哈迈德·巴巴"
        story: '1591 年摩洛哥军队攻下廷巴克图。学者艾哈迈德·巴巴被指抗拒苏丹，1594 年被押往马拉喀什，在那里编写人物辞书，补伊本·法尔洪的旧作。1608 年他获准回到廷巴克图，1627 年 4 月 22 日在那里去世。'
        story_prose:
          opening:
            - '1594 年，廷巴克图。三年前，摩洛哥军队攻下了这座城。艾哈迈德·巴巴是城里的学者，写过几十部法学和语法的书，家里有一座很大的藏书室。'
            - '史实里，这一年他被指抗拒苏丹，连同家人被押着穿过撒哈拉，北上马拉喀什。藏书被收走，一说在路上散失。十四年后他获准回家，书已经不在了。在这条分支里，巷子那头有一户人家的主妇肯在床底腾出地方，院子里的抄书人还在替他的书写签条。'
            - '这一趟用得上三种人：懂旧书、知道哪几箱该先救的人，胆子大、身子硬、押解那天挡得住推搡的人，懂医护、在沙漠里能替人治伤分水的人。'
          outcomes:
            all: '1608 年，艾哈迈德·巴巴回到廷巴克图。邻家的主妇已经老了，她把床底的箱子拖出来，皮面上落了一层灰。他打开最上面那一卷，认出了自己的字。'
            p3: '十四年后，他回到廷巴克图。那户人家把床底的几箱书抬了出来，他一卷一卷摸过去，在箱子边上坐了很久。'
            p2: '一家老小都走到了马拉喀什。那个孩子的脚，到城门口时已经结了痂。'
            p1: '他活着走到了马拉喀什。十四年后，他获准回家。'
          none: '北去的队伍走远了。廷巴克图那间屋子的书架空着，门没有关。'
          desync: '押解那天，街口一阵乱，{staff}没能挡到他身前，就被事务所召了回来。最后看见的，是人堆里一只被踩掉的鞋。'
          not_admitted: '{staff}没能进那座院子。书还在架上，押解的日子已经近了。'
          points:
            p3:
              class_craft: '{staff}照修旧书的规矩，把最脆的几卷用干布隔开，皮面朝里，护舌压平，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
              class_lettered: '{staff}照着书单挑书，先拣他自己写的稿子和只此一部的抄本，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
              else: '{staff}一卷卷翻过书名，把他自己写的稿子和少见的抄本先挑出来，一层层码进箱子。天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
            p1: '押解那天，街上挤满了人，推搡里有人亮了刀。{staff}挡在艾哈迈德·巴巴身前，把他拉进一个门洞，用后背顶住门框。那一阵过去，他整了整衣襟，自己走了出去，身上没有伤。'
            p2: '北上走了半个月，队里有人发起高烧，有个孩子脚底磨烂了。{staff}每天扎营后替人清洗伤口、换药，把水按人头分好。有一晚，那个孩子把自己的水囊递过来，里面还剩一口。'
          excerpts:
            p3: '天黑以后，箱子由两个人抬着，穿过两条巷子，进了邻家主妇的屋子。她把床底的杂物拖出来，箱子推了进去，又把杂物塞回原处，拍了拍手上的土。'
            p2: '{staff}每天扎营后替人清洗伤口、换药，把水按人头分好。有一晚，那个孩子把自己的水囊递过来，里面还剩一口。'
            p1: '{staff}挡在艾哈迈德·巴巴身前，把他拉进一个门洞，用后背顶住门框。那一阵过去，他整了整衣襟，自己走了出去，身上没有伤。'
        relic: "一部皮面手稿"
        relic_desc: "一部手稿，皮面磨旧了，带一片护舌。"
        points:
          p1: '押走之前，拦下冲着被捕学者来的刀兵，护住艾哈迈德·巴巴活着走上北去的路'
          p2: '替在沙漠里病倒受伤的族人治伤、分水，护着一家老小不掉队'
          p3: '抢在士兵收书之前，从他的藏书里救下几箱，托给城里一户人家藏好'
        points_fail:
          p1: '这条分支里他没能活着离开廷巴克图，马拉喀什的人物辞书和在摩洛哥写成的二十九部书都没有了。'
          p2: '路上倒下的人没人扶，这条分支里一家人北上的路和原来一样苦。'
          p3: '藏书全被收走，这条分支里他十四年后回到廷巴克图，自己的书一卷也没剩下。'
        shift:
          p1:
            was: '1594 年，艾哈迈德·巴巴被指抗拒苏丹，押往马拉喀什；1608 年他获准回到廷巴克图。'
          p2:
            was: '1594 年，艾哈迈德·巴巴的家人与他一同被押着穿过撒哈拉北上。'
            now: '同行的族人走到马拉喀什时少受了些罪。'
          p3:
            was: '1594 年，他的藏书被摩洛哥人收走，另一说在北上途中散失；1608 年回到廷巴克图时，书已不在。'
            now: '押走之前有几箱书被挪进城里一户人家的床底。十四年后他回到家，那户人家把箱子抬了出来。'
            who: ahmed_baba_timbuktu
            bio: '1608 年艾哈迈德·巴巴回到廷巴克图，城里一户人家替他收着的几箱书还在。晚年他就用这些书教学生。'
        vignettes:
          same_name: '油灯底下，{staff}发现两卷书里同一个名字有两种写法，没有挑一种，两种都记在单子上，中间画了个记号。'
          courtyard: '雨季过后，{staff}把书摊在院子的阴凉里晾。泥墙的影子一点点挪，正午翻一次，让封皮干得匀。'
          slip: '{staff}在窄纸条上写下每卷的书名和头一行。墨干得快，纸条塞在皮面的护舌底下，不用打开也叫得出是哪本书。'
text:
  en:
    name: Ahmed Baba
    text: Scholar of Timbuktu, 1556 to 1627. He wrote dozens of works on law and grammar and held a large private library. After the Moroccan conquest of 1591 he was taken to Marrakesh, where his books were seized, and he later returned to Timbuktu.
  zh:
    name: 艾哈迈德·巴巴
    text: 廷巴克图学者，1556 年生，1627 年去世。他写过数十部法学与语法著作，并拥有一座规模很大的私人藏书室。1591 年摩洛哥征服之后他被带往马拉喀什，藏书被没收，后来才回到廷巴克图。
quotes:
  ahmed_baba_added_to_lives:
    order: 1
    tier: full
    date: '1596'
    checked: two_sources
    sources: [ahmed_baba_nayl_harama, ahmed_baba_nayl_kenny]
    original: ar
    text:
      ar:
        quote: 'وزدت في بعض تراجم من ذكره ما ترك من أوصافه المشكورة'
      en:
        who: 'Ahmad Baba al-Timbukti'
        quote: 'And in some of the lives he had recorded, I added praiseworthy qualities he had left out.'
        occasion: 'Author’s preface to Nayl al-ibtihaj, completed in Marrakesh in 1005 AH (1596–97), closing paragraph on supplementing Ibn Farhun (game translation)'
      zh:
        who: '艾哈迈德·巴巴'
        quote: '在他已写的一些人物传记中，我补上了他略去的可嘉之处。'
        occasion: '伊历1005年（1596至1597年）在马拉喀什完成的《绣饰〈锦缎〉以获喜悦》，作者序末段，谈补写伊本·法尔洪的传记（本游戏译文）'
      zh-Hant:
        who: '艾哈邁德·巴巴'
        quote: '在他已寫的一些人物傳記中，我補上了他略去的可嘉之處。'
        occasion: '伊歷1005年（1596至1597年）在馬拉喀什完成的《繡飾〈錦緞〉以獲喜悅》，作者序末段，談補寫伊本·法爾洪的傳記（本遊戲譯文）'
      fr:
        who: 'Ahmad Baba al-Tomboucti'
        quote: 'Et dans certaines des vies qu’il avait enregistrées, j’ai ajouté des qualités louables qu’il avait laissées de côté.'
        occasion: 'Préface de l''auteur à Nayl al-ibtihaj, achevée à Marrakech en 1005 AH (1596-97), paragraphe de clôture sur le complément d''Ibn Farhun (traduction du jeu)'
      es:
        who: 'Ahmad Baba al-Tombuctí'
        quote: 'Y en algunos de los conciertos que había grabado agregué cualidades loables que él había omitido.'
        occasion: 'Prefacio del autor a Nayl al-ibtihaj, completado en Marrakech en 1005 d. H. (1596–97), párrafo final sobre cómo complementar a Ibn Farhun (traducción del juego)'
      ja:
        who: 'アフマド・ババ・アル・ティンブクティ'
        quote: 'そして、彼が記録した人生のいくつかに、私は彼が省略していた賞賛に値する特質を加えました。'
        occasion: '1005 AH (1596 ～ 1597 年) にマラケシュで完成した Nayl al-ibtihaj への著者の序文、イブン ファルフンの補足に関する最後の段落 (ゲーム翻訳)'
      ko:
        who: '아마드 바바 알-팀북티'
        quote: '그리고 그가 기록한 일부 삶에 나는 그가 빠뜨린 칭찬할 만한 특성들을 추가했습니다.'
        occasion: '1005 AH(1596-97)에 마라케시에서 완성된 Nayl al-ibtihaj의 저자 서문, Ibn Farhun 보충에 대한 단락 마무리(게임 번역)'
      ru:
        who: 'Ахмад Баба аль-Тимбукти'
        quote: 'И в некоторые записанные им выступления я добавил похвальные качества, которые он упустил.'
        occasion: 'Авторское предисловие к Найлю аль-Ибтихадж, завершенному в Марракеше в 1005 г. хиджры (1596–1597 гг.), заключительный абзац о дополнении Ибн Фархуна (перевод игры)'
  ahmed_baba_recorded_what_i_could:
    order: 2
    tier: none
    date: '1596'
    checked: two_sources
    sources: [ahmed_baba_nayl_harama, ahmed_baba_nayl_kenny]
    original: ar
    text:
      ar:
        quote: 'فقيّدت فيه بحسب الإمكان'
      en:
        who: 'Ahmad Baba al-Timbukti'
        quote: 'So I wrote down in it what I could.'
        occasion: 'Author’s preface to Nayl al-ibtihaj, completed in Marrakesh in 1005 AH (1596–97), paragraph on writing far from libraries (game translation)'
      zh:
        who: '艾哈迈德·巴巴'
        quote: '于是，我尽可能把材料记在书里。'
        occasion: '伊历1005年（1596至1597年）在马拉喀什完成的《绣饰〈锦缎〉以获喜悦》，作者序中谈远离藏书之地时的写作（本游戏译文）'
      zh-Hant:
        who: '艾哈邁德·巴巴'
        quote: '於是，我儘可能把材料記在書裡。'
        occasion: '伊歷1005年（1596至1597年）在馬拉喀什完成的《繡飾〈錦緞〉以獲喜悅》，作者序中談遠離藏書之地時的寫作（本遊戲譯文）'
      fr:
        who: 'Ahmad Baba al-Tomboucti'
        quote: 'J''y ai donc écrit ce que je pouvais.'
        occasion: 'Préface de l''auteur à Nayl al-ibtihaj, achevée à Marrakech en 1005 AH (1596-97), paragraphe sur l''écriture loin des bibliothèques (traduction du jeu)'
      es:
        who: 'Ahmad Baba al-Tombuctí'
        quote: 'Entonces escribí en él lo que pude.'
        occasion: 'Prefacio del autor a Nayl al-ibtihaj, completado en Marrakech en 1005 d. H. (1596–97), párrafo sobre la escritura lejos de las bibliotecas (traducción del juego)'
      ja:
        who: 'アフマド・ババ・アル・ティンブクティ'
        quote: 'そこで、私ができることをそこに書き留めました。'
        occasion: '1005 AH (1596 ～ 1597 年) にマラケシュで完成した Nayl al-ibtihaj への著者の序文、図書館から遠く離れた執筆に関する段落 (ゲーム翻訳)'
      ko:
        who: '아마드 바바 알-팀북티'
        quote: '그래서 나는 내가 할 수 있는 것을 그 안에 적었다.'
        occasion: '1005 AH(1596-97)에 마라케시에서 완성된 Nayl al-ibtihaj의 저자 서문, 도서관에서 멀리 떨어진 글쓰기에 관한 단락(게임 번역)'
      ru:
        who: 'Ахмад Баба аль-Тимбукти'
        quote: 'Поэтому я записал в него все, что мог.'
        occasion: 'Предисловие автора к книге «Нейл аль-ибтихадж», завершенной в Марракеше в 1005 году хиджры (1596–97), абзац о письме вдали от библиотек (перевод игры)'
