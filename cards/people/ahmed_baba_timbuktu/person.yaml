      fr: '22 avril 1627 : Ahmad Baba meurt à Tombouctou.'
      es: '22 de abril de 1627: Ahmad Baba muere en Tombuctú.'
      ja: '1627年4月22日：アフマド・ババがトンブクトゥで死去。'
