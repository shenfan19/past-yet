      zh: '1627 年 4 月 22 日，他在廷巴克图去世。'
    note: 'Death: written as a plain fact.'
    line:
      en: '22 April 1627: Ahmad Baba dies in Timbuktu.'
      zh: '1627 年 4 月 22 日，艾哈迈德·巴巴在廷巴克图去世。'
