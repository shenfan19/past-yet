    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 30, req: {"any":[{"job":["translator","archivist"],"stat":{"wit":7,"will":7}},{"trait":["patient","methodical","faithful"],"stat":{"wit":7,"will":8}},{"trait":["charismatic"],"stat":{"will":8}}]}}
