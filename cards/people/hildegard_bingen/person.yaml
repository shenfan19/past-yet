    text:
      en:
        name: 'The unvoiced opening'
        place: "Bingen"
        figure: "Hildegard of Bingen"
        story: 'Hildegard’s letter to the Mainz prelates protests a restriction on her community’s worship during a dispute over a burial. Another letter in the Mainz regesta concerns the dispute in 1179.'
        relic: 'A chant practice page'
        relic_desc: 'An invented page with a thread marking its opening.'
        points:
          p1: 'Get the testimony that the dead man had been reconciled with the Church to Mainz early, so the community can sing again months sooner'
        points_fail:
          p1: 'The interdict runs on until March 1179, and through those months the nuns may not sing the office.'
        shift:
          p1:
            was: 'In 1178 the Mainz prelates placed Rupertsberg under interdict because a man once excommunicated was buried in its cemetery. Hildegard held that he had been reconciled before he died and would not have him dug up. The interdict was lifted only in March 1179.'
            now: '{staff} carries the witnesses'' word to Mainz early and the interdict is lifted sooner. In the last year of her life the community sings for months longer.'
            who: hildegard_bingen
            bio: 'When her community was forbidden to sing in her eightieth year, the interdict in this timeline was lifted within weeks. Singing at Rupertsberg hardly stopped in her last year.'
        vignettes:
          opening: 'Agnes can still find the first word but no longer reads the damaged mark above it. You ask her to compare the spare page with the line she knows. She sets a thread by the right place. Now the next person can open straight to the same beginning.'
          wait: 'Adelheid has the words by heart and is about to file the damaged sheet away. You hold it where Agnes can trace the line once more. Adelheid copies the opening onto a spare leaf, then keeps the old page beside it. The next reader will have both.'
          return: 'You know the community will sing again, but Adelheid has a page to put away today. You help her show the starting place without giving voice to it. When the door closes, you can see the thread between the pages. You leave before there is singing in this room again.'
      zh:
        name: '没唱出声的开头'
        place: "宾根"
        figure: "宾根的希尔德加德"
        story: '希尔德加德致美因茨教长的信，抗议当局因安葬争议限制修院礼仪。美因茨文书目录还收有1179年关乎这一争议的另一封信。'
        relic: '一页圣咏练习稿'
        relic_desc: '练习页，一根夹线标明起句。'
        points:
          p1: '把死者生前已与教会和解的证词早些送到美因茨，让修院早几个月重新唱起来'
        points_fail:
          p1: '禁令照旧拖到 1179 年 3 月才解除，这几个月里修女们不能唱日课。'
        shift:
          p1:
            was: '1178 年，因修院墓地葬了一位曾被绝罚的男子，美因茨的教长对鲁珀茨贝格下了禁令；希尔德加德申明他生前已与教会和解，不肯掘墓，禁令到 1179 年 3 月才解除。'
            now: '{staff}早早把证人的话送到美因茨，禁令提前解除。她生命的最后一年里，修院的歌多唱了几个月。'
            who: hildegard_bingen
            bio: '希尔德加德八十岁那年修院被禁唱，在这条时间线里禁令几周就解除了，她最后一年里鲁珀茨贝格的歌声几乎没有断过。'
        vignettes:
          opening: '阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。'
          wait: '阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。'
          return: '你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。'
text:
  en:
    name: Hildegard of Bingen
    text: German abbess, 1098 to 1179, at Bingen on the Rhine. She wrote visionary theology, books on medicine and natural history, and composed a large body of chant, among the largest surviving by one medieval composer.
  zh:
    name: 宾根的希尔德加德
    text: 德国女修道院长，1098 年生，1179 年去世，在莱茵河畔的宾根。她写幻象神学、医学与博物学著作，还作了大量圣咏，是中世纪个人留存作品最多的作曲家之一。
hook: {en: 'How do you pass on a chant in silence?', zh: '不能唱的时候，圣咏怎样传下去？'}
