quotes:
  hildegard_bingen_story_echo_full:
    order: 1
    tier: full
    date: '1179'
    checked: official_record
    sources: [hildegard_bingen_story_echo_source_full]
    original: la
    text:
      en:
        who: 'Hildegard of Bingen'
        quote: 'Because the soul is attuned to song.'
        occasion: 'Letter 23 to Mainz, on why hearing a song can move the listener.'
      zh:
        who: '宾根的希尔德加德'
        quote: '因为人的心灵原会应和歌声。'
        occasion: '致美因茨第 23 封信，谈人为什么会被歌声打动。'
      la:
        who: 'Hildegard of Bingen'
        quote: 'quia symphonialis est anima'
        occasion: 'Letter 23 to Mainz, on why hearing a song can move the listener.'
      zh-Hant:
        who: '賓根的希爾德加德'
        quote: '因為人的心靈原會應和歌聲。'
        occasion: '致美因茨第 23 封信，談人為什麼會被歌聲打動。'
      fr:
        who: 'Hildegarde de Bingen'
        quote: 'Parce que l''âme est sensible au chant.'
        occasion: 'Lettre 23 à Mayence, expliquant pourquoi entendre une chanson peut émouvoir l''auditeur.'
      es:
        who: 'Hildegarda de Bingen'
        quote: 'Porque el alma está en sintonía con el canto.'
        occasion: 'Carta 23 a Mainz, sobre por qué escuchar una canción puede conmover al oyente.'
      ja:
        who: 'ヒルデガルト・フォン・ビンゲン'
        quote: 'それは魂が歌に同調しているからです。'
        occasion: 'マインツへの手紙 23、なぜ歌を聞くとリスナーが感動するのかについて。'
      ko:
        who: '빙엔의 힐데가르트'
        quote: '영혼이 노래에 적응되어 있기 때문입니다.'
        occasion: '마인츠에게 보내는 편지 23번, 노래를 들으면 듣는 사람의 마음이 감동되는 이유에 대해 설명합니다.'
      ru:
        who: 'Хильдегарда Бингенская'
        quote: 'Потому что душа настроена на песню.'
        occasion: 'Письмо 23 Майнцу о том, почему прослушивание песни может тронуть слушателя.'
  hildegard_bingen_story_echo_none:
    order: 2
    tier: none
    date: '1179'
    checked: official_record
    sources: [hildegard_bingen_story_echo_source_none]
    original: la
    text:
      en:
        who: 'Hildegard of Bingen'
        quote: 'When hearing a song …'
        occasion: 'Letter 23 to Mainz, turning to the experience of listening.'
      zh:
        who: '宾根的希尔德加德'
        quote: '听到一首歌时……'
        occasion: '致美因茨第 23 封信，转而谈听歌者的感受。'
      la:
        who: 'Hildegard of Bingen'
        quote: 'in auditu alicuius cantionis'
        occasion: 'Letter 23 to Mainz, turning to the experience of listening.'
      zh-Hant:
        who: '賓根的希爾德加德'
        quote: '聽到一首歌時……'
        occasion: '致美因茨第 23 封信，轉而談聽歌者的感受。'
      fr:
        who: 'Hildegarde de Bingen'
        quote: 'En écoutant une chanson…'
        occasion: 'Lettre 23 à Mayence, tournée vers l''expérience de l''écoute.'
      es:
        who: 'Hildegarda de Bingen'
        quote: 'Al escuchar una canción...'
        occasion: 'Carta 23 a Maguncia, recurriendo a la experiencia de la escucha.'
      ja:
        who: 'ヒルデガルト・フォン・ビンゲン'
        quote: '歌を聞くと…'
        occasion: 'マインツへの手紙23号、聴くという経験に目を向ける。'
      ko:
        who: '빙엔의 힐데가르트'
        quote: '노래를 들으면...'
        occasion: '마인츠에게 보내는 편지 23번, 듣기 경험으로 전환합니다.'
      ru:
        who: 'Хильдегарда Бингенская'
        quote: 'Когда слушаешь песню…'
        occasion: 'Письмо 23 Майнцу, обращение к опыту слушания.'
