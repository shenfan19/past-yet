    refs: [hildegard_bingen_interdict, hildegard_bingen_letter, hildegard_bingen_mainz_interdict, hildegard_bingen_manuscript_catalogue, hildegard_bingen_scribes]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 30, req: {"any":[{"job":["archivist","proofreader","musician"],"stat":{"wit":7,"will":7}},{"trait":["patient","methodical","artistic"],"stat":{"wit":7,"will":8}}]}}
      vignettes:
        - {id: opening, traits: [methodical, quiet, artistic]}
        - {id: wait, traits: [faithful, calm, attached]}
        - {id: return}
    text:
      en:
        name: 'The unvoiced opening'
        place: "Bingen"
        figure: "Hildegard of Bingen"
        story: 'A dispute over a burial interrupted singing in Hildegard’s community. Her letters to Mainz record what was at stake for her. The restriction was lifted in March 1179. Several collections of her writings and music preserve the work of copyists at Rupertsberg.'
        story_prose:
          opening:
            - 'Near Bingen at the end of the twelfth century. Hildegard’s letters and music survive, bearing signs of the people who copied and checked them alongside her.'
            - 'In history, a dispute over a burial interrupted singing. The restriction was lifted the following March. In this branch an old practice leaf has worn nearly blank just above its first word.'
            - 'Someone who knows a score or a manuscript can help. It also takes someone willing to leave a doubtful mark open until the people who sang from it can look.'
          points:
            p1: '{staff} asks the copyist not to fill in the faint mark yet, spreads the old leaf and the new one, and has Hildegard and someone familiar with the singing look separately. Both recognise the later mark, but the beginning still needs a question. The copyist puts the agreed part down on paper. Above the first word she leaves a space wider than the space between two lines.'
          outcomes:
            all: 'After the restriction ends, someone brings the spare leaf to check the first line. Her hand stops at the gap. A person who knows the old page comes to stand beside her.'
            p1: 'The next time they open the spare leaf, it is still clear which place was copied from the old one and which question was kept open.'
          none: 'The spare page goes back in its place. The space over the first word has not been checked against the older page.'
          not_admitted: '{staff} never gets into the copying room. Someone closes a score by the door and puts a low stool back in its place.'
          excerpts:
            p1: 'The copyist puts the agreed part down on paper. Above the first word she leaves a space wider than the space between two lines.'
        relic: 'A marked practice page'
        relic_desc: 'An invented page with a thread marking its opening.'
        points:
          p1: 'While the room is quiet, ask Hildegard and the copyists which damaged marks to carry over and where to leave a question on the spare leaf'
        points_fail:
          p1: 'The spare leaf is put aside with a blank above the first word. The next reader will still have to ask what the old page says.'
        shift:
          p1:
            was: 'Hildegard’s letters describe the interruption of singing. Copyists at Rupertsberg preserved her writings and music.'
            now: 'In this branch {staff} keeps the old leaf beside the copy. Hildegard’s copyists can tell which marks they read clearly and which need another look.'
        vignettes:
          opening: 'Agnes can still find the first word but no longer reads the damaged mark above it. You ask her to compare the spare page with the line she knows. She sets a thread by the right place. Now the next person can open straight to the same beginning.'
          wait: 'Adelheid has the words by heart and is about to file the damaged sheet away. You hold it where Agnes can trace the line once more. Adelheid copies the opening onto a spare leaf, then keeps the old page beside it. The next reader will have both.'
          return: 'You know the community will sing again, but Adelheid has a page to put away today. You help her show the starting place without giving voice to it. When the door closes, you can see the thread between the pages. You leave before there is singing in this room again.'
      zh:
        name: '没唱出声的开头'
        place: "宾根"
        figure: "宾根的希尔德加德"
        story: '一场安葬争议使希尔德加德住处的歌声停了下来。她写信给美因茨，谈到歌唱对身边人的意义。限制于 1179 年 3 月解除。留存的文集里，还看得见鲁珀茨贝格抄写人的工作。'
        story_prose:
          opening:
            - '十二世纪末，宾根附近。希尔德加德的书信和谱页流传下来，也留下好几个人同她一起校抄的痕迹。'
            - '史实里，一场安葬争议使歌声中断，限制到次年三月才解除。在这条分支里，一页练习用过许多次，第一个字上方磨得不太看得清。'
            - '这趟用得上懂歌谱或抄本的人，还要能留着那处不确定的记号，等曾唱过的人自己辨认。'
          points:
            p1: '{staff}请抄写的人先不要补那个淡下去的记号，把旧页和副页铺开，让希尔德加德和一位熟悉唱法的人分别看。两个人都能认出后面那一处，开头却还得再问。 抄写人把确认的部分落到纸上。到第一个字时，她把那一点空白留得比分别两行的空隙还宽。'
          outcomes:
            all: '限制解除以后，有人拿着副页来对第一句。她的手在那处空白停住，熟悉旧页的人便到她旁边来。'
            p1: '下回翻出副页时，还能看出哪一处是照旧页抄下的，哪一处得找人再问。'
          none: '副页照旧收起来。第一个字的上面有一点白，谁也没把它与旧页放在一处核。'
          not_admitted: '{staff}没进抄写的房间。门边有人合上一卷谱，先把木凳扶回原处。'
          excerpts:
            p1: '抄写人把确认的部分落到纸上。到第一个字时，她把那一点空白留得比分别两行的空隙还宽。'
        relic: '一页有记号的练习稿'
        relic_desc: '练习页，一根夹线标明起句。'
        points:
          p1: '趁屋里安静，请希尔德加德和抄写人辨认旧页上的磨损处，把辨不清的记号注明在副页上'
        points_fail:
          p1: '副页先收起来了。第一个字上面仍留着白，下一个读到的人还得问旧页怎么写。'
        shift:
          p1:
            was: '希尔德加德在信中谈到歌唱中断。鲁珀茨贝格的抄写人也为她留下了文章和曲谱。'
            now: '这条分支里，{staff}把旧页和副页并排留下。抄写人一眼就能看出哪些记号已经读清，哪些还要再看。'
        vignettes:
          opening: '阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。'
          wait: '阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。'
          return: '你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。'
text:
  en:
    name: Hildegard of Bingen
    text: German abbess, 1098 to 1179, at Bingen on the Rhine. She wrote visionary theology, books on medicine and natural history, and composed a large body of chant, among the largest surviving by one medieval composer.
  zh:
    name: 宾根的希尔德加德
    text: 德国女修道院长，1098 年生，1179 年去世，在莱茵河畔的宾根。她写幻象神学、医学与博物学著作，还作了大量圣咏，是中世纪个人留存作品最多的作曲家之一。
hook: {en: 'Which marks can the next reader still make out?', zh: '下一个人翻开这页，还能辨出几个记号？'}
facts:
  interdict:
    date: '1178'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [hildegard_bingen_interdict]
    text:
      en: 'The letter objects to a ban that interrupts the community’s singing and argues for its place in worship.'
      zh: '信中反对妨碍修院歌唱的禁令，并申明歌唱在礼仪中的地位。'
  letter:
    date: '1179'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [hildegard_bingen_letter]
    text:
      en: 'The regesta record correspondence with Archbishop Christian over the burial and the interdict.'
      zh: '文书纪要收录她就安葬争议和禁令写给大主教克里斯蒂安的书信。'
  lifted:
    date: '1179-03'
    checked: two_sources
    level: careful
    use: [history, story, wiki]
    sources: [hildegard_bingen_interdict, hildegard_bingen_mainz_interdict]
    text: {en: 'The dispute over the burial led to an interruption of singing. The restriction was lifted in March 1179.', zh: '安葬争议后，当地的歌唱中断。限制于 1179 年 3 月解除。'}
    line:
      en: 'March 1179: the restriction on singing ends.'
      zh: '1179 年 3 月，歌唱限制解除。'
      zh-Hant: '1179 年 3 月，歌唱限制解除。'
      fr: 'Mars 1179 : fin de la restriction du chant.'
      es: 'Marzo de 1179: finaliza la restricción al canto.'
      ja: '1179年3月：歌唱制限が解除される。'
      ko: '1179년 3월: 노래 제한이 종료됩니다.'
      ru: 'Март 1179 г.: заканчивается ограничение на пение.'
