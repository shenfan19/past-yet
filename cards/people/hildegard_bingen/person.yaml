    text:
      en:
        name: 'The unvoiced opening'
        place: "Bingen"
        figure: "Hildegard of Bingen"
        story: 'Hildegard’s letter to the Mainz prelates protests a restriction on her community’s worship during a dispute over a burial. Another letter in the Mainz regesta concerns the dispute in 1179.'
        relic: 'A chant practice page'
        relic_desc: 'An invented page with a thread marking its opening.'
        points:
          p1: 'Match the names and place in Bingen’s appeal and the written response so the notice lifting the restriction can reach the community in March'
          p2: 'Have the secretary Guibert match outgoing appeals with written replies. Mark reports heard by word of mouth and keep a local copy'
          p3: 'File the appeal and the resolution together in the local chest. Ask Guibert to identify originals and later revisions by recipient'
        points_fail:
          p1: 'The copied response cannot be matched to the right house. The notice goes back to the messenger, and the office recalls the employee.'
          p2: 'An oral message is entered as an official response. The next reader cannot check when it was received.'
          p3: 'Years later, a revised passage is easy to find, but the appeal and response are kept apart. The ending is hard to follow.'
        shift:
          p1:
            was: 'The Rupertsberg community faced an interdict. Hildegard appealed to the church authorities in Mainz, and the restriction ended in March 1179.'
          p2:
            was: 'Guibert served as Hildegard’s secretary. He later arranged a collection that preserves part of her correspondence.'
            now: 'The copies now match appeals and replies. On a separate line the community can record which messages still need written confirmation.'
          p3:
            was: 'Hildegard’s letters circulated in collections and survive in more than one manuscript tradition.'
            now: 'The people compiling the letters receive both sides of the exchange. The house keeps a list of originals, so later readers can check the correspondence after revision.'
            who: hildegard_bingen
            bio: 'Secretaries, copyists and editors helped carry Hildegard’s extensive correspondence into later collections.'
        vignettes:
          opening: 'Agnes can still find the first word but no longer reads the damaged mark above it. You ask her to compare the spare page with the line she knows. She sets a thread by the right place. Now the next person can open straight to the same beginning.'
          wait: 'Adelheid has the words by heart and is about to file the damaged sheet away. You hold it where Agnes can trace the line once more. Adelheid copies the opening onto a spare leaf, then keeps the old page beside it. The next reader will have both.'
          return: 'You know the community will sing again, but Adelheid has a page to put away today. You help her show the starting place without giving voice to it. When the door closes, you can see the thread between the pages. You leave before there is singing in this room again.'
      zh:
        name: '没唱出声的开头'
        place: "宾根"
        figure: "宾根的希尔德加德"
        story: '希尔德加德致美因茨教长的信，抗议当局因安葬争议限制修院礼仪。美因茨文书目录还收有1179年关乎这一争议的另一封信。'
        relic: '一页圣咏练习稿'
        relic_desc: '练习页，一根夹线标明起句。'
        points:
          p1: '把宾根一方的申诉来回件按同一地点和称谓核清，护住三月解除限制的书面通知能送达'
          p2: '与书记吉贝尔把发出的信和各次答复配成对，标明哪些只是转述，给修院留自己的抄本'
          p3: '把这次申诉和结案凭据一起交入本地书箱，请吉贝尔按收件人注明原件与后来的修订'
        points_fail:
          p1: '抄出的回应没有写清适用的修院。通知回到信使手里，事务所因同步失败召回员工。'
          p2: '书记听过的一次口信被抄作正式答复，后面读信的人不能确认它何时传到。'
          p3: '多年以后只有一段改过的文字可以翻读，原信和答复分藏，难对出事情怎样结束。'
        shift:
          p1:
            was: '宾根鲁珀茨贝格团体受到限制，希尔德加德曾写信向美因茨教会当局申诉。1179 年三月限制解除。'
          p2:
            was: '吉贝尔任希尔德加德的书记。后来编成的书信集保留部分往来，也经过他整理。'
            now: '抄本各存一套发信与回信，闻讯日期单列。修院查到哪一条仍等书面确认。'
          p3:
            was: '后世经编订流传希尔德加德的书信，留下多种抄本。'
            now: '后来编书的人领到两面都齐的档案。修院留一份原件清单，书信改订后仍能查回当时的往来。'
            who: hildegard_bingen
            bio: '希尔德加德留下大量书信，书信由代笔、誊抄与后来的整理进入更大的手稿集。'
        vignettes:
          opening: '阿格内斯还认得出第一个词，词上方磨坏的记号却看不清。你请她把知道的那句与备用纸对一遍。她夹一根线在对应处。下一个人翻开，也能找到同一个开头。'
          wait: '阿德尔海德背得出词，正要把损坏的那页收起来。你托住纸，让阿格内斯沿着那行再走一遍。阿德尔海德把开头抄到备用页上，旧纸放在旁边。下一个人来时，两份都还在。'
          return: '你知道修院日后还会唱起来，可阿德尔海德现在得收好那一页。你帮她指明开头，先不唱出来。门合上时，纸页间还看得见那根线。等这屋里再有人唱，你已离开了。'
text:
  en:
    name: Hildegard of Bingen
    text: German abbess, 1098 to 1179, at Bingen on the Rhine. She wrote visionary theology, books on medicine and natural history, and composed a large body of chant, among the largest surviving by one medieval composer.
  zh:
    name: 宾根的希尔德加德
    text: 德国女修道院长，1098 年生，1179 年去世，在莱茵河畔的宾根。她写幻象神学、医学与博物学著作，还作了大量圣咏，是中世纪个人留存作品最多的作曲家之一。
hook: {en: 'How do you pass on a chant in silence?', zh: '不能唱的时候，圣咏怎样传下去？'}
