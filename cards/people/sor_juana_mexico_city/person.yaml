    text:
      en:
        name: "The last books given away"
        place: "Mexico City"
        figure: "Sor Juana Inés de la Cruz"
        story: 'In her 1691 Reply to Sor Filotea, Sor Juana describes her drive to study and uses ordinary kitchen observations to make a point about learning. The reading in the 1695 Mexico City card is invented.'
        relic: "A quill pen"
        relic_desc: "A quill with a split tip beside an empty shelf."
        points:
          p1: 'Find an observation from ordinary life'
          p2: 'Read a passage with its surrounding argument'
          p3: 'Help the reader leave a question for later'
        vignettes:
          aristotle: 'The reader smiles at the passage wondering what Aristotle might have written if he had cooked. You hand them a blank slip and ask for one kitchen question that would actually bear writing down.'
          ordinary: 'You find the everyday example the reader had passed by on the way to a learned name. They reread it and discover which question the name had nearly drowned out.'
          reply: 'You keep the copy open where the reader has stopped. They put a finger on the sentence they want to come back to before returning the rest of the papers.'
      zh:
        name: "送走的最后几本书"
        place: "墨西哥城"
        figure: "胡安娜修女"
        story: '胡安娜·伊内斯·德·拉·克鲁斯在 1691 年《答菲洛特亚修女》中回顾自己的求学愿望，也以厨房里的日常观察谈学习。本卡的 1695 年墨西哥城读信场景为虚构。'
        relic: "一支羽毛笔"
        relic_desc: "一支笔尖裂开的羽毛笔，旁边是空书架。"
        points:
          p1: '找出一条来自日常生活的观察'
          p2: '连着前后论证把一段读完'
          p3: '帮读者留下一道以后还想问的问题'
        vignettes:
          aristotle: '读者读到「如果亚里士多德下过厨」的意思就笑了。你递给他一张空纸，请他说一件发生在厨房、值得记下来再问的问题。'
          ordinary: '读者一路去找一位学者的名字，跳过了一个日常例子。你把那一段翻回来，他才听出那个名字差点盖过了哪一个问题。'
          reply: '读者停在一页，你便替他一直翻那里。他先按住想再看的那一句，才把别的纸还回去。'
text:
  en:
    name: Sor Juana Inés de la Cruz
    text: Mexican nun, poet and scholar, 1648 or 1651 to 1695. In the convent in Mexico City she collected a large library and wrote poems and plays. Her 1691 reply to a bishop defended women's right to study, and she later gave up her books under pressure.
  zh:
    name: 胡安娜修女
    text: 墨西哥修女、诗人与学者，1648 或 1651 年生，1695 年去世。她在墨西哥城的修道院里收藏了大批图书，写诗和戏剧。1691 年她回复一位主教的信为女性求学的权利辩护，后来在压力下交出了藏书。
