    text:
      en:
        name: "The last books given away"
        place: "Mexico City"
        figure: "Sor Juana Inés de la Cruz"
        story: 'In 1690 the bishop of Puebla published, without her leave, Sor Juana''s critique of a sermon as the Carta Atenagórica, with a letter signed Sor Filotea. Her reply is dated 1 March 1691. In 1693 she sold her books and instruments, and in 1694 she renewed her vows. She died on 17 April 1695 in the convent of San Jerónimo, after nursing her sisters through an epidemic.'
        relic: "A quill pen"
        relic_desc: "A quill with a split tip beside an empty shelf."
        points:
          p1: 'In the weeks the sickness spreads, help her keep the sickroom going and hold the nursing of the sisters together'
          p2: 'Save a sister who has fallen ill in the epidemic'
          p3: 'When she falls ill herself, cure her'
        points_fail:
          p1: 'The hands in the sickroom fall ill one after another and the nursing breaks off; in this branch her care of the sick sisters does not go on as it did in history.'
          p2: 'She does not pull through and, as in history, is one of the sisters who die in those months; in this branch another bed in the sickroom is empty.'
          p3: 'As in history, she dies on 17 April. In this branch she does not live through April.'
        shift:
          p2:
            was: 'She does not pull through and, as in history, is one of the sisters who die in those months; another bed in the sickroom is empty.'
            now: 'The sister lived through April, and once she was well she came back to help in the sickroom.'
          p3:
            was: 'On 17 April 1695, Sor Juana died after nursing her sisters through the sickness.'
            now: '{staff} cured her with the medicine brought along, and she lived through April. In the years after, she wrote more at the convent; what she wrote is not in the record of this trip.'
        vignettes:
          kitchen: '{staff} watches an egg set in hot butter and drop apart in syrup, and writes down on a scrap which pan did which, for nobody in particular.'
          shelf: '{staff} dusts the empty shelves in the cell and finds the marks where the books stood, darker squares on the wood, and leaves them as they are.'
          bells: '{staff} counts the bells for the dead from the courtyard, one evening twice, and goes back to the kettle.'
      zh:
        name: "送走的最后几本书"
        place: "墨西哥城"
        figure: "胡安娜修女"
        story: '1690 年，普埃布拉主教未经她同意，把她批评一篇布道的文章刊印出来，题为《雅典娜信札》，附信署名“菲洛特亚修女”。她的《答菲洛特亚修女》署 1691 年 3 月 1 日。1693 年她卖掉了书和乐器，1694 年重申誓愿。1695 年 4 月 17 日，她在照顾染疫的修女之后，死于圣杰罗姆修道院。'
        relic: "一支羽毛笔"
        relic_desc: "一支笔尖裂开的羽毛笔，旁边是空书架。"
        points:
          p1: '疫病传开的那几周，帮她撑住病房，护住对病倒修女的照料'
          p2: '救下一位染疫病倒的修女'
          p3: '她病倒以后，治好她'
        points_fail:
          p1: '病房里的人手一个个倒下，照料断了，这条分支里她照顾病倒的修女这件事没能像史实那样做下去。'
          p2: '她没熬过去，照史实成了那几个月里去世的修女之一，这条分支里病房又空了一张床。'
          p3: '照史实，她 4 月 17 日去世。这条分支里，她没有熬过四月。'
        shift:
          p2:
            was: '她没熬过去，照史实成了那几个月里去世的修女之一，病房又空了一张床。'
            now: '那位修女熬过了四月，病好以后又回到了病房帮忙。'
          p3:
            was: '1695 年 4 月 17 日，胡安娜修女在照顾病倒的修女之后去世。'
            now: '{staff}用带来的药治好了她，她熬过了四月。后来几年，她在修道院里又写下了一些东西，写了什么，这一趟的记录里没有。'
        vignettes:
          kitchen: '{staff}看着一枚蛋在热油里凝住，在糖浆里却散开，在一张碎纸上记下哪口锅是哪样，也不为给谁看。'
          shelf: '{staff}擦净屋里的空书架，木板上还看得出书立过的地方，一块块颜色深些，没去动它。'
          bells: '{staff}在院子里数着报丧的钟声，有一晚响了两回，数完又回去看着水壶。'
text:
  en:
    name: Sor Juana Inés de la Cruz
    text: Mexican nun, poet and scholar, 1648 or 1651 to 1695. In the convent in Mexico City she collected a large library and wrote poems and plays. Her 1691 reply to a bishop defended women's right to study, and she later gave up her books under pressure.
  zh:
    name: 胡安娜修女
    text: 墨西哥修女、诗人与学者，1648 或 1651 年生，1695 年去世。她在墨西哥城的修道院里收藏了大批图书，写诗和戏剧。1691 年她回复一位主教的信为女性求学的权利辩护，后来在压力下交出了藏书。
hook: {en: 'The marks of the books on an empty shelf', zh: '空书架上书立过的印子'}
facts:
  carta:
    date: '1690'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_sor_juana, unl_respuesta]
    text:
      en: 'In 1690 the bishop of Puebla, Manuel Fernández de Santa Cruz, published her critique of a sermon without her leave as the Carta Atenagórica, with a letter of his own signed Sor Filotea de la Cruz.'
      zh: '1690 年，普埃布拉主教曼努埃尔·费尔南德斯·德·圣克鲁斯未经她同意，把她批评一篇布道的文字刊印出来，题为《雅典娜信札》，并附上自己署名“菲洛特亚修女”的信。'
    line:
      en: '1690: the bishop of Puebla prints her critique of a sermon without asking her, with a letter he signs Sor Filotea.'
      zh: '1690 年，普埃布拉主教没问过她，就把她批评一篇布道的文字印了出来，附信署名“菲洛特亚修女”。'
  respuesta:
    date: '1691-03-01'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sor_juana_mexico_city_primary, unl_respuesta]
    text:
      en: 'Her Reply to Sor Filotea is dated 1 March 1691. In it she describes her drive to study and uses ordinary kitchen observations to make a point about learning. It was first printed after her death, in 1700.'
      zh: '她的《答菲洛特亚修女》署 1691 年 3 月 1 日，信里回顾自己的求学愿望，也拿厨房里的日常观察谈学问。这封信到 1700 年她身后才印出。'
    line:
      en: '1 March 1691: she dates her reply to Sor Filotea. In it she writes that much could be learned in a kitchen.'
      zh: '1691 年 3 月 1 日，她写成《答菲洛特亚修女》，信里说，厨房里也能学到许多东西。'
  books:
    date: '1693'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [umass_sor_juana, britannica_sor_juana]
    text:
      en: 'In 1693 she gave up her secular studies and her books and instruments were sold, the proceeds given as alms.'
      zh: '1693 年，她放弃世俗学问，书和乐器都卖掉，所得用作施舍。'
    line:
      en: '1693: her books and her instruments are sold, and the money is given to the poor.'
      zh: '1693 年，她的书和乐器都卖掉了，钱拿去施舍。'
  vows:
    date: '1694'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [umass_sor_juana, britannica_sor_juana]
    text:
      en: 'In 1694 she renewed her religious vows and signed penitential declarations.'
      zh: '1694 年，她重申誓愿，签下几份悔罪文书。'
    line:
      en: '1694: she renews her vows.'
      zh: '1694 年，她重申誓愿。'
  death:
    date: '1695-04-17'
    stay_day: 106
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [britannica_sor_juana, poetry_foundation_sor_juana]
    text:
      en: 'She died on 17 April 1695 in Mexico City, after nursing her sisters during an epidemic that swept the convent.'
      zh: '1695 年 4 月 17 日，她在墨西哥城去世。此前疫病传遍修道院，她一直在照顾病倒的修女。'
    note: 'Death: written as a plain fact.'
    line:
      en: '17 April 1695: Sor Juana dies, after nursing her sisters through the sickness in the convent.'
      zh: '1695 年 4 月 17 日，胡安娜修女去世。此前她一直在照顾病倒的修女。'
  printed:
    date: '1700'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [unl_respuesta, sor_juana_mexico_city_primary]
    text:
      en: 'The Reply was first printed in 1700, in the third volume of her works, published after her death.'
      zh: '《答书》到 1700 年才首次印出，收在她身后出版的文集第三卷里。'
    line:
      en: '1700: her reply to Sor Filotea is printed for the first time, in a volume of her works.'
      zh: '1700 年，《答菲洛特亚修女》第一次印出来，收在她的文集里。'
