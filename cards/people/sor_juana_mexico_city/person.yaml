text:
  en:
    name: Sor Juana Inés de la Cruz
    text: Mexican nun, poet and scholar, 1648 or 1651 to 1695. In the convent in Mexico City she collected a large library and wrote poems and plays. Her 1691 reply to a bishop defended women's right to study, and she later gave up her books under pressure.
  zh:
    name: 胡安娜修女
    text: 墨西哥修女、诗人与学者，1648 或 1651 年生，1695 年去世。她在墨西哥城的修道院里收藏了大批图书，写诗和戏剧。1691 年她回复一位主教的信为女性求学的权利辩护，后来在压力下交出了藏书。
