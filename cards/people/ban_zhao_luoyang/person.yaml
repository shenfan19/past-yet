    text:
      en: 'The biography places Ban Zhao in the Eastern Pavilion library continuing the unfinished Book of Han, and records a subsequent order for Ma Xu to continue the work. The card''s date is the story setting.'
      zh: '传记载班昭奉诏赴东观藏书阁续《汉书》，并载又诏马续继成。卡上年份是场景背景。'
