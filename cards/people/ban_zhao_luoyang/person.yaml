        place: "Luoyang"
        figure: "Ban Zhao"
        story: "When her brother Ban Gu dies with the Book of Han unfinished, Ban Zhao is called to complete it, and much of the finishing, including the tables, is credited to her. She is better remembered for a short book of advice to women."
        relic: "A table of names on silk"
        relic_desc: "A strip of silk with a table of titles and names in neat columns."
        points:
          p1: "Check the tables against the sources (a record keeper or a sharp mind)"
          p2: "Defend the unfinished tables to the court scholars (a teacher or a silver tongued employee)"
          p3: "Stay with her until the last page is read (a teacher or a stubborn employee)"
      zh:
        name: "接着兄长写完的史书"
        place: "洛阳"
        figure: "班昭"
        story: "哥哥班固去世时《汉书》还没有写完，班昭受命续成，书里的表大部分都记在她名下。人们记得更多的，却是她那本劝导女子的小书。"
        relic: "一幅绢上的人名表"
        relic_desc: "一条绢，上面是整整齐齐排列的官名与人名。"
        points:
          p1: "对着史料核对那些表"
          p2: "向朝中学者辩护那些未完成的表"
          p3: "陪她到最后一页读完"
text:
  en:
    name: Ban Zhao
    text: Chinese historian and writer of the Han, about 45 to about 117. She completed the Book of Han after the death of her brother Ban Gu, and served at court as a teacher to the empress and her ladies.
  zh:
    name: 班昭
    text: 汉代历史学家与作家，约 45 年生，约 117 年去世。兄长班固去世后，她续成《汉书》，并在宫中做皇后与宫女们的老师。
