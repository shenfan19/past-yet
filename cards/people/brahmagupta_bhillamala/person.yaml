        name: Zero as a number
        place: Bhillamala, India
        figure: Brahmagupta
        story: Brahmagupta gives rules for working with zero and negative numbers, as numbers like any others.
        relic: A palm-leaf with a small circle
        relic_desc: A leaf with a small round mark for nothing.
        points:
          p1: "Accept that zero is also a number"
          p2: "Explain to merchants that a negative number is a debt"
          p3: "Copy the rules into verse"
      zh:
        name: 零也是一个数
        place: 印度比拉马拉
        figure: 婆罗摩笈多
        story: 婆罗摩笈多给出了用零和负数做运算的规则，把它们当作和别的数一样的数。
        relic: 一片画着小圆圈的棕榈叶
        relic_desc: 一片叶子，上面有个代表“没有”的小圆圈。
        points:
          p1: "接受零也是一个数"
          p2: "向商人解释负数就是债"
          p3: "把规则抄成偈颂"
text:
  en:
    name: Brahmagupta
    text: Indian mathematician and astronomer, 598 to about 668. His 628 work treats zero as a number with rules for arithmetic with it and with negative numbers, and gives methods for solving quadratic equations.
  zh:
    name: 婆罗摩笈多
    text: 印度数学家与天文学家，598 年生，约 668 年去世。他 628 年的著作把零当作一个数，给出它和负数的运算规则，还给出解二次方程的方法。
