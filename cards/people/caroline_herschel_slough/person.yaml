    text:
      en:
        name: "The one who swept the sky"
        place: "Slough"
        figure: "Caroline Herschel"
        story: 'Caroline Herschel reported noticing an object unlike the sharply defined stars on 1 August 1786. She compared observations before writing to Charles Blagden.'
        story_prose:
          opening:
            - 'After dark in Slough, Caroline Herschel asks her assistant to move the lamp. The object she has just drawn is fuzzy at the edge, while the brighter stars nearby are clear. If she is to find it again tomorrow she will need a drawing she can read in the dark.'
            - 'In history Herschel compared observations of 1 and 2 August 1786 and sent drawings to Charles Blagden. She was later paid for assisting her brother and took readings when he was at the telescope. In this branch she can ask for regular nights of her own.'
            - 'Someone who reads the clock and matches diagrams can help make a usable pair. Someone who can negotiate can carry her prospective schedule with the report.'
          points:
            p1: 'There are three dots on the first drawing. The assistant turns the second sheet the wrong way. You ask Herschel to start with the same reference star and have him point to each dot in turn. Both sheets get times in the margin. She puts them together by the lamp and records the change in position herself. When she folds them, she keeps the first night’s hour on the outside.'
            p2: 'The person taking the report has made room for the drawings. You ask Herschel to set her calendar beside them so he can see how much of a night she has left after taking readings at the large telescope. She writes her own name in two clear spaces and asks for the two kinds of work to be listed separately. On the next calendar she can circle nights of her own in advance.'
          outcomes:
            all: 'The report preserves both the drawings and her request for time. When the assistant’s routine is set, some nights are reserved for observations she chooses.'
            p1: 'The letter carries the comparisons and drawings. She will still fit her own telescope around the nights spent recording her brother’s work.'
            p2: 'The proposed schedule has left the house. Without enough reference stars from the first night, the request is the only change this trip can preserve.'
          none: 'Both drawings lie side by side, with too few references to compare. The schedule stays as it was.'
          not_admitted: 'The helper asks the visitor to keep the ladder clear. The lamp goes back under its shade and the traveller stays below.'
          desync: 'Haze has spoiled the reference stars on the first night. When the second drawing cannot be checked against it, the office recalls the traveller.'
          excerpts:
            p1: 'When she folds them, she keeps the first night’s hour on the outside.'
            p2: 'On the next calendar she can circle nights of her own in advance.'
        relic: "A sky sweep ruler"
        relic_desc: "A wooden ruler with a scale, used to mark the swept patches on a star chart."
        points:
          p1: 'Mark the reference stars and the time on both drawings so Herschel can show that the object moved between the two nights'
          p2: 'Use Herschel''s first comet report to secure regular nights for her own observations'
        points_fail:
          p1: 'Low haze leaves too few clear reference points on the first drawing. The second drawing cannot establish motion in this branch, and the office recalls the employee.'
          p2: 'When her brother uses the large telescope she spends the evening taking down his readings, and her own observations still fit around his.'
        shift:
          p1:
            was: 'On 1 and 2 August 1786 Caroline Herschel recorded the movement of a suspected comet and sent out her observations and drawings.'
          p2:
            was: 'In 1787 Caroline Herschel received a salary as her brother''s assistant; in her first report she had already explained how that work limited her observing time.'
            now: '{staff} helps Herschel put her observing schedule beside her comet report and place both before a supporter. The later arrangement for her work reserves several nights a month for her own observations.'
            who: caroline_herschel_slough
            bio: 'As a paid assistant, Herschel had regular nights allotted to her own work and could plan her comet searches in advance.'
        vignettes:
          fixed: 'You mark two bright neighbours before adding the fuzzy object. On the second drawing the stars remain a useful guide, even after the pages have shifted.'
          doubt: 'The helper suggests cleaning the glass. You ask what the other stars look like through it. They stay sharp, and the helper keeps the uncertain mark on the sheet.'
          lamp: 'You shade the lamp while the helper writes the hour. When the cover goes back on, both drawings still have times beside them.'
      zh:
        name: "扫天的人"
        place: "斯劳"
        figure: "卡罗琳·赫歇尔"
        story: '卡罗琳·赫歇尔记载，1786 年 8 月 1 日她看见一团不像周围恒星那样清晰的光，比较观测后写信给查尔斯·布拉格登。'
        story_prose:
          opening:
            - '斯劳入夜以后，卡罗琳·赫歇尔让帮手把灯移开一点。她刚标的光团在目镜里边缘发虚，旁边的亮星还清楚。要想过一夜再找回来，她得把这一刻的图画给自己看。'
            - '史实里，赫歇尔比较 1786 年 8 月 1 日和 2 日的观测，带着图致信查尔斯·布拉格登。她后来有了助手薪金，兄长观测时仍要替他记读数。这条分支可以争取固定给她自己的夜晚。'
            - '会读钟和对星图的员工先帮忙做两份能比的记录。擅长交涉的人可以把她的观测排班和报告一并交出去。'
          points:
            p1: '第一张图打了三个点。帮手把第二张转错了方向，你请赫歇尔从同一颗参照星讲起，逐个指回原位。两张纸边都补上时刻。她把它们对着灯并好，自己在信里写下那团光相对星点的变化。她收起第二张时，把第一夜的时刻留在外侧。'
            p2: '来收报告的人只给星图留了空位。你请赫歇尔把一页排班放上去，让对方看看她在记大望远镜读数的晚上还能剩多少时间。她亲手在两处空行写上自己的名字，请来人把这两类晚上分别列明。在之后的排班上，她能先圈出归自己的夜晚。'
          outcomes:
            all: '观测图和她需要的时间都随信留下。后来定助手工作时，几夜明确让她自己安排。'
            p1: '信中留下两夜观测的对照和图。她以后仍须在兄长的工作间隙安排自己的望远镜。'
            p2: '一页排班表已经递出。失去第一夜的参照点后，本趟只能保存交出的这份请求。'
          none: '第二张图摆在第一张旁边，仍凑不齐可核的参照。排班维持原样。'
          not_admitted: '帮手请来客别挡着梯子。灯遮好以后，员工仍留在下层。'
          desync: '低处起雾，第一夜少了可认的参照星。第二夜已无法和它比较，事务所发来召回。'
          excerpts:
            p1: '她收起第二张时，把第一夜的时刻留在外侧。'
            p2: '在之后的排班上，她能先圈出归自己的夜晚。'
        relic: "一把天区扫描记录尺"
        relic_desc: "一把刻着刻度的木尺，用来在星图上标出扫过的天区。"
        points:
          p1: '在两夜的图上都标清观测时刻和参照星，让赫歇尔能对比两张图，说明那团光移动了'
          p2: '拿首份彗星报告为赫歇尔争取固定的独立观测时段'
        points_fail:
          p1: '低空的薄雾让第一张图缺少足够的参照点。第二晚画出的光点没法用来比较位移，这条分支与史实脱节，员工被召回。'
          p2: '每逢兄长用大望远镜，她仍得整晚记他的读数，自己的观测只能挤在空当里。'
        shift:
          p1:
            was: '1786 年 8 月 1 至 2 日，卡罗琳·赫歇尔记录了疑似彗星的位置变化，随后寄出观测和附图。'
          p2:
            was: '1787 年，卡罗琳·赫歇尔作为兄长的助手领取薪金，她在首次报告中已说明助手工作占去自己的观测时间。'
            now: '{staff}让赫歇尔把第一份观测报告连同自己的观测排班交给愿意支持她的人。后来议定助手职责时，每月另留给她几个可自行安排的夜晚。'
            who: caroline_herschel_slough
            bio: '赫歇尔担任有薪助手后仍有固定的自主观测时段。她能提前安排自己的寻彗工作。'
        vignettes:
          fixed: '你先记下两颗较亮的邻星，再添模糊的那个。第二张纸虽然挪了位置，仍能靠那两颗星找回原处。'
          doubt: '帮手说兴许该擦擦镜片。你问同一片玻璃里的别的星怎样。那些仍然清晰，他便把这处可疑的记号留在纸上。'
          lamp: '帮手记时刻时，你用手遮住灯。把灯盖好以后，两张图旁都还留着各自的时刻。'
text:
  en:
    name: "Caroline Herschel"
    text: "British astronomer born in Germany, 1750 to 1848. The sister of the astronomer William Herschel, she found her first comet in 1786 and several more later."
  zh:
    name: "卡罗琳·赫歇尔"
    text: "德国出生的英国天文学家，1750 年生，1848 年去世。她是天文学家威廉·赫歇尔的妹妹，1786 年发现了自己的第一颗彗星，后来又发现多颗彗星。"
