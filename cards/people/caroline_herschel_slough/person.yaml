text:
  en:
    name: "Caroline Herschel"
    text: "British astronomer born in Germany, 1750 to 1848. The sister of the astronomer William Herschel, she found her first comet in 1786 and several more later."
  zh:
    name: "卡罗琳·赫歇尔"
    text: "德国出生的英国天文学家，1750 年生，1848 年去世。她是天文学家威廉·赫歇尔的妹妹，1786 年发现了自己的第一颗彗星，后来又发现多颗彗星。"
