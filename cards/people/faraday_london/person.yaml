    sources: [faraday_london_story_echo_source_none]
    original: en
    text:
      en: {"who":"Michael Faraday","quote":"the momentary existence of the current","occasion":"First series, explaining why the induced current in an early experiment was hard to use. The date marks the reading of the paper."}
      zh: {"who":"迈克尔·法拉第","quote":"电流只存在片刻。","occasion":"第一辑讨论为何早期实验中的感应电流难以利用。日期为论文宣读日。"}
  faraday:
    order: 3
    text:
      en: {who: Michael Faraday, quote: "Nothing is too wonderful to be true, if it be consistent with the laws of nature."}
      zh: {who: 法拉第, quote: "只要不违背自然规律，再奇妙的事也可能是真的。"}
