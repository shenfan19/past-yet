    text:
      en:
        name: Electricity from magnetism
        place: London
        figure: Michael Faraday
        story: 'On 29 August 1831 Faraday recorded a momentary movement of the needle in his ring experiment. On 28 October he turned a copper disc between the poles of a magnet and obtained a current while the disc kept turning.'
        story_prose:
          opening:
            - 'A wound iron ring sits on the Royal Institution’s bench. Faraday looks up from the contact and the needle is already back at zero. The person keeping the notes asks whether to enter no result or watch again.'
            - 'In August 1831 Faraday observed brief deflections when making and breaking contact with the ring. In October he saw a sustained current with a rotating copper disc. You have two observations to preserve. In the first, watch when the deflection begins. In the second, watch when it ends.'
            - 'Use people who can watch the timing and the needle separately. For the disc, someone with a steady hand can look after the contact.'
          points:
            p1: 'You turn the notebook sideways and leave one side for the instant of contact and the other for the needle. As Faraday moves, the observer calls out the direction before the needle goes back. After a pause he puts another mark by the time the contact was broken. Two separate marks sit in the column that was empty.'
            p2: 'With the disc turning, Faraday asks the observer to wait a little longer. You steady the contact where it slipped. When the observer looks again, the needle is still off to one side. He writes the return to zero only after the disc stops. The pencil leaves a clear space between the two readings.'
          outcomes:
            all: 'The two records lie side by side. With the ring the needle returned quickly. With the disc the notes show how long it stayed over before the turning stopped.'
            p1: 'The brief deflections from the ring are on paper. The other observation has yet to be established.'
            p2: 'The disc gives a reading that lasts longer. The earlier ring record has a gap and the trip cannot stay in sync.'
          none: 'The column headings are all that remain on the sheet. When the apparatus goes quiet there is no reading anyone can fill in.'
          not_admitted: 'Someone indoors asks the visitors to clear the passage. From outside you hear the observer ask to watch once more.'
          desync: 'The deflection at the ring or the sustained reading at the disc fails to reach the notebook. The experimental record falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'Two separate marks sit in the column that was empty.'
            p2: 'The pencil leaves a clear space between the two readings.'
        relic: An iron ring and coil
        relic_desc: Two coils of wire on a ring of soft iron.
        points:
          p1: 'Watch the switching and the needle separately to preserve the fleeting deflection in Faraday''s ring experiment'
          p2: 'Keep the collector in contact with the copper disc as it turns, so Faraday can observe the current while the disc is in motion'
        points_fail:
          p1: 'The needle is back at rest before anyone looks. The experiment is entered as a null result, and the office recalls the employee after a loss of sync.'
          p2: 'The contact slips while the disc is turning. There is no sustained reading in this branch, and the office recalls the employee.'
        shift:
          p1:
            was: 'On 29 August 1831 Faraday observed a brief induced current when the iron-ring apparatus was switched on and off.'
          p2:
            was: 'On 28 October 1831 Faraday observed a current while a copper disc turned between the poles of a magnet.'
        vignettes:
          instant: 'The assistant writes that the needle moved. You leave space for when it moved. By the time he looks back at the instrument, the needle has settled.'
          skeptic: 'You ask whether the reading stayed put. The assistant points to the blank after the first mark. Together you label it as a return to rest so nobody mistakes the blank for a missed reading.'
          sketch: 'You draw the ring in the margin and mark its two sets of windings on opposite sides. The assistant can now match the observation to the right apparatus.'
      zh:
        name: 从磁里得到电
        place: 伦敦
        figure: 迈克尔·法拉第
        story: '1831 年 8 月 29 日，法拉第在铁环实验中记录了指针的短暂偏转。10 月 28 日，他让铜盘在磁铁两极之间转动，转动时能持续产生电流。'
        story_prose:
          opening:
            - '伦敦皇家研究院的实验桌上有只绕线的铁环。法拉第刚把眼睛从接点抬起来，表针已经回到零位。旁边的记录人问，该记没有反应，还是再看一遍。'
            - '1831 年 8 月，法拉第用铁环观察到接通和断开时的短暂偏转。十月，他在铜盘转动时观察到持续电流。这里有两次观测要保住，一次看偏转何时开始，一次看它何时结束。'
            - '找能分工看时间和表针的人；换到铜盘时，再让有手上功夫的人照看接触处。'
          points:
            p1: '你把记录纸横过来，左边留给接通的时刻，另一边留给谁看见了偏转。法拉第一动手，记录人没等针落回去就报出方向。过了一次短停，他把第二个记号另写在断开的那边。原来空着的栏里有了两个不挨着的记号。'
            p2: '铜盘转着，法拉第让看表的人多等一会儿。你扶住刚才滑动过的接触片，记录人又看一眼表，发现针仍然停在偏过去的一边。盘停下来，他才把归零的时刻写在下面。两行读数之间，铅笔留出一截整齐的空格。'
          outcomes:
            all: '两份记录并排放着。铁环那边，针很快回去；铜盘那边，记下等了多久，针才随停转回去。'
            p1: '铁环的短暂偏转已经写好，另一项观测还不能确认。'
            p2: '铜盘的读数比第一次观察维持得久。铁环记录仍有缺口，这条分支无法和史实对齐。'
          none: '实验纸上只有原先的栏目。仪器停下以后，读数仍没人能补上。'
          not_admitted: '门里提醒来访的人把过道留出来。你在实验室外听到记录人问还能否再看一次。'
          desync: '铁环偏转或铜盘的持续读数没有记下来，实验记录脱节，事务所召回员工。'
          excerpts:
            p1: '原来空着的栏里有了两个不挨着的记号。'
            p2: '两行读数之间，铅笔留出一截整齐的空格。'
        relic: 一个铁环和线圈
        relic_desc: 软铁环上绕着两组线圈。
        points:
          p1: '两人分看接通时刻和表针，护住铁环实验里转瞬即逝的偏转'
          p2: '让集电片贴住转动的铜盘，让法拉第看清盘一直转时电流能不能持续'
        points_fail:
          p1: '表针摆回去才有人抬头，这一趟把实验记成无结果。行程同步失败，员工被召回。'
          p2: '铜盘转动时接触处滑开了。这条分支里没有测出持续电流，事务所因同步失败召回员工。'
        shift:
          p1:
            was: '1831 年 8 月 29 日，法拉第在铁环装置接通和断开时观察到了短暂的感应电流。'
          p2:
            was: '1831 年 10 月 28 日，法拉第观察到铜盘在磁极之间转动时产生的电流。'
        vignettes:
          instant: '助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。'
          skeptic: '你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。'
          sketch: '你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。'
text:
  en:
    name: Michael Faraday
    text: English scientist, 1791 to 1867, who began as a bookbinder's apprentice. In 1831 at the Royal Institution in London he discovered electromagnetic induction, and he also laid the foundations of electrochemistry.
  zh:
    name: 迈克尔·法拉第
    text: 英国科学家，1791 年生，1867 年去世，早年是装订学徒。1831 年他在伦敦皇家研究院发现电磁感应，也奠定了电化学的基础。
