    text:
      en:
        name: Electricity from magnetism
        place: London
        figure: Michael Faraday
        story: 'On 29 August 1831 Faraday recorded a momentary movement of the needle in his ring experiment. On 28 October he turned a copper disc between the poles of a magnet and obtained a current while the disc kept turning.'
        relic: An iron ring and coil
        relic_desc: Two coils of wire on a ring of soft iron.
        points:
          p1: 'Watch the switching and the needle separately to preserve the fleeting deflection in Faraday''s ring experiment'
          p2: 'Keep the collector in contact with the copper disc as it turns, so Faraday can observe the current while the disc is in motion'
        points_fail:
          p1: 'The needle is back at rest before anyone looks. The experiment is entered as a null result, and the office recalls the employee after a loss of sync.'
          p2: 'The contact slips while the disc is turning. There is no sustained reading in this branch, and the office recalls the employee.'
        shift:
          p1:
            was: 'On 29 August 1831 Faraday observed a brief induced current when the iron-ring apparatus was switched on and off.'
          p2:
            was: 'On 28 October 1831 Faraday observed a current while a copper disc turned between the poles of a magnet.'
        vignettes:
          instant: 'The assistant writes that the needle moved. You leave space for when it moved. By the time he looks back at the instrument, the needle has settled.'
          skeptic: 'You ask whether the reading stayed put. The assistant points to the blank after the first mark. Together you label it as a return to rest so nobody mistakes the blank for a missed reading.'
          sketch: 'You draw the ring in the margin and mark its two sets of windings on opposite sides. The assistant can now match the observation to the right apparatus.'
      zh:
        name: 从磁里得到电
        place: 伦敦
        figure: 迈克尔·法拉第
        story: '1831 年 8 月 29 日，法拉第在铁环实验中记录了指针的短暂偏转。10 月 28 日，他让铜盘在磁铁两极之间转动，转动时能持续产生电流。'
        relic: 一个铁环和线圈
        relic_desc: 软铁环上绕着两组线圈。
        points:
          p1: '两人分看接通时刻和表针，护住铁环实验里转瞬即逝的偏转'
          p2: '让集电片贴住转动的铜盘，让法拉第看清盘一直转时电流能不能持续'
        points_fail:
          p1: '表针摆回去才有人抬头，这一趟把实验记成无结果。行程同步失败，员工被召回。'
          p2: '铜盘转动时接触处滑开了。这条分支里没有测出持续电流，事务所因同步失败召回员工。'
        shift:
          p1:
            was: '1831 年 8 月 29 日，法拉第在铁环装置接通和断开时观察到了短暂的感应电流。'
          p2:
            was: '1831 年 10 月 28 日，法拉第观察到铜盘在磁极之间转动时产生的电流。'
        vignettes:
          instant: '助手写下「指针偏转」。你腾出一栏补记何时偏转。他再回头时，针已经归位了。'
          skeptic: '你问读数有没有一直停在那里。助手指给你看第一道记号后面的空白。你们补上「回到静止」，免得后来人当成漏记。'
          sketch: '你在页边画出铁环，标出两侧的绕线。助手现在能把这条观察对回对应的器具。'
text:
  en:
    name: Michael Faraday
    text: English scientist, 1791 to 1867, who began as a bookbinder's apprentice. In 1831 at the Royal Institution in London he discovered electromagnetic induction, and he also laid the foundations of electrochemistry.
  zh:
    name: 迈克尔·法拉第
    text: 英国科学家，1791 年生，1867 年去世，早年是装订学徒。1831 年他在伦敦皇家研究院发现电磁感应，也奠定了电化学的基础。
quotes:
  faraday:
    order: 3
    text:
      en: {who: Michael Faraday, quote: "Nothing is too wonderful to be true, if it be consistent with the laws of nature."}
      zh: {who: 法拉第, quote: "只要不违背自然规律，再奇妙的事也可能是真的。"}
hook: {en: 'The needle moves, then settles.', zh: '针动了一下，又归零'}
