      zh: '1831 年 10 月，法拉第让铜盘在磁铁的两极之间转动，用轴和盘沿两处的接点测量电流。'
    line:
      en: '28 October 1831: the copper disc yields a current as it turns.'
      zh: '1831 年 10 月 28 日，铜盘转动时产生了电流。'
  ring:
