    text:
      en:
        name: 'Two lines above the plain'
        place: "Ghazna"
        figure: "Al-Biruni"
        story: 'In his Determination of Coordinates, al-Biruni reports using a mountain near Nandana to estimate the size of Earth. The height of the mountain and the dip of the visible horizon below the horizontal are separate measurements.'
        relic: "An astrolabe"
        relic_desc: "A brass astrolabe with its scale polished by fingers."
        points:
          p1: 'Identify the horizon line and the horizontal line on the sketch'
          p2: 'Reach the observation spot with a complete height record'
          p3: 'Explain why the slope of the mountain is a separate quantity'
        vignettes:
          angle: 'The survey helper has drawn his angle along the slope of the mountain. You extend a horizontal line from the point where he stands, then draw the lower sightline towards the horizon. The mark moves to a different wedge. You carry home the corrected diagram, but the final figure is still being worked on.'
          height: 'You know the book will keep both a height and an angle. At the top the survey helper calls out only the angle. You bring up the slip for the height and have him add it to the other reading. When the plain disappears into haze, the two records are already side by side. You will not see the next clear horizon.'
          fold: 'You fold one slip around the other and mark which came from the mountain and which from looking across the plain. The survey helper can find them again without guessing. You take home the names of two measurements, and no finished radius.'
      zh:
        name: '平原上方的两条线'
        place: "加兹尼"
        figure: "比鲁尼"
        story: '比鲁尼在《确定地点坐标》中记述曾用南达纳附近一座山估算地球大小。山高与地平线低于水平线的角度是两项不同的量。'
        relic: "一件星盘"
        relic_desc: "一只铜星盘，刻度被手指磨亮。"
        points:
          p1: '在草图上区分水平线与望见的地平线'
          p2: '带着完整的山高记录到观测点'
          p3: '说清山坡坡度为何是另一个量'
        vignettes:
          angle: '测量帮手把角标在山坡那一侧。你从他站的点画出水平线，再画望向地平线的较低视线。角的记号得挪到另一处。你带回改过的图，最后的数字还在算。'
          height: '你知道后来的书会同时留下山高和角度。到了山顶，帮手只报了角度。你把记山高的条子送上来，请他把两项并着收。等平原没入薄雾，两个读数已经挨在一起。下一回地平线放晴你等不到。'
          fold: '你用一张纸条裹住另一张，标明哪项是量山所得，哪项是平望所得。帮手再翻时不用猜。你带回两个量的名字，半径还没算完。'
text:
  en:
    name: "Al-Biruni"
    text: "Scholar of Central Asia, born 973, died after about 1050. He worked in astronomy, mathematics, geography and several languages, estimated the radius of the earth from the height of a mountain and the dip of the horizon, and wrote a detailed account of India."
  zh:
    name: "比鲁尼"
    text: "中亚学者，973 年生，约 1050 年后去世。他通晓天文、数学、地理和多种语言，曾用山的高度和地平线的俯角估算地球半径，并留下关于印度的详细著作。"
hook: {en: 'Which line is level at the summit?', zh: '到了山顶，哪条才算水平？'}
facts:
  coordinates:
    date: '1025'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [al_biruni_ghazna_coordinates, al_biruni_ghazna_horizon]
    text:
      en: 'This is the English translation of al-Biruni’s account. The date 1025 belongs to the work, not an exact date of the observation.'
      zh: '此书为比鲁尼相关自述的英译本。1025 年是著作纪年，并非观测的准确日期。'
  horizon:
    date: '1025'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [al_biruni_ghazna_coordinates, al_biruni_ghazna_horizon]
    text:
      en: 'The cited passage describes the mountain near Nandana, the measured height and the horizon’s dip from the summit.'
      zh: '所引原文记南达纳附近的山、量得的山高及山顶所见的地平线俯角。'
