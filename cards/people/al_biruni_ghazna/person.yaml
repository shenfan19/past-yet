order: 214
events:
- al_biruni_ghazna
text:
  en:
    name: "Al-Biruni"
    text: "Scholar of Central Asia, born 973, died after about 1050. He worked in astronomy, mathematics, geography and several languages, estimated the radius of the earth from the height of a mountain and the dip of the horizon, and wrote a detailed account of India."
  zh:
    name: "比鲁尼"
    text: "中亚学者，973 年生，约 1050 年后去世。他通晓天文、数学、地理和多种语言，曾用山的高度和地平线的俯角估算地球半径，并留下关于印度的详细著作。"
