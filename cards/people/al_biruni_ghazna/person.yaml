    scene:
      points:
        - {id: p1, kind: notice, req: {"stat":{"wit":7}}}
        - {id: p2, kind: endure, req: {"stat":{"constitution":5}}}
        - {id: p3, kind: persuade, req: {"any":[{"job":["translator"]},{"provides":"translate"}]}}
      vignettes:
        - {id: angle, traits: [methodical, scholarly]}
        - {id: height, traits: [hardy, curious]}
