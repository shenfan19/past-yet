    text:
      en:
        name: "Measuring the earth from a mountaintop"
        place: "Ghazna"
        figure: "Al-Biruni"
        story: "Al-Biruni climbs a mountain and measures how far the horizon dips, and from the height of the mountain works out the radius of the earth."
        relic: "An astrolabe"
        relic_desc: "A brass astrolabe with its scale polished by fingers."
        points:
          p1: "Follow the angle measuring on the summit"
          p2: "Climb the mountain in the blazing heat"
          p3: "Talk with the scholars in Sanskrit"
      zh:
        name: "从山顶量出地球的大小"
        place: "加兹尼"
        figure: "比鲁尼"
        story: "比鲁尼爬上山顶，量出地平线低下去的角度，用一座山的高度算出了地球的半径。"
        relic: "一件星盘"
        relic_desc: "一只铜星盘，刻度被手指磨亮。"
        points:
          p1: "跟上山顶测角"
          p2: "顶着酷热爬上山"
          p3: "用梵语同学者交谈"
text:
  en:
    name: "Al-Biruni"
    text: "Scholar of Central Asia, born 973, died after about 1050. He worked in astronomy, mathematics, geography and several languages, estimated the radius of the earth from the height of a mountain and the dip of the horizon, and wrote a detailed account of India."
  zh:
    name: "比鲁尼"
    text: "中亚学者，973 年生，约 1050 年后去世。他通晓天文、数学、地理和多种语言，曾用山的高度和地平线的俯角估算地球半径，并留下关于印度的详细著作。"
