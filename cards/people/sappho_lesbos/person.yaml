    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"trust","day":7,"req":{"any":[{"job":["sailor","ferryman","courier","navigator"],"stat":{"will":6}},{"trait":["attached","kind","wanderer"],"stat":{"will":6,"constitution":5}}]}}
    text:
      en:
        name: 'Before the ship leaves'
        place: 'Mytilene, Lesbos'
        figure: 'Sappho'
        story: 'The Parian Marble records Sappho leaving Mytilene for Sicily in exile. Its damaged date leaves the exact year uncertain. In this branch one person she hoped to see has not heard when the ship is leaving.'
        story_prose:
          opening:
            - 'The shore at Mytilene. Centuries after Sappho sailed to Sicily, a stone on Paros recorded the voyage. The year on that stone is now damaged.'
            - 'In history, Sappho left Mytilene in exile for Sicily. The reason is unknown. In this branch there is someone she wants to see before she goes, and the boatmen are already passing baggage aboard.'
            - 'Someone who knows the landing and the neighbouring streets can help. Finding someone who has yet to hear when the boat leaves will do more than urging a boatman to hurry.'
          points:
            p1: '{staff} asks where the baggage goes, leaves Sappho’s bundle in a boatman’s care and looks for the door she described. By the time they come back, the people loading the boat have cleared a stretch of shore. The visitor reties the knot that has come loose at Sappho’s wrist. Sappho leaves her hand where it is until the boatman calls for her.'
          outcomes:
            all: 'As the boat pulls away, Sappho raises the hand with the cord. The visitor stays on the stone passengers step on when they come ashore.'
            p1: 'As the boat pulls away, Sappho raises the hand with the cord. The visitor stays on the stone passengers step on when they come ashore.'
          none: 'The boat leaves first. By the time the visitor finds the landing, there is only a length of wet rope left on the stone.'
          not_admitted: '{staff} reaches the shore but finds no one who knows Sappho. Someone crouches on the last step, straightening a length of rope.'
          excerpts:
            p1: 'The visitor reties the knot that has come loose at Sappho’s wrist. Sappho leaves her hand where it is until the boatman calls for her.'
        relic: 'A knotted cord'
        relic_desc: 'An imagined cord worn by someone waiting with her at the landing.'
        points:
          p1: 'Bring one person Sappho wants to see to the landing before she has to leave for Sicily'
        points_fail:
          p1: 'The ship left before the employee could bring the person Sappho had asked to see.'
        shift:
          p1:
            was: 'Around the turn of the seventh and sixth centuries BC: the Parian Marble records Sappho sailing from Mytilene to Sicily in exile.'
            now: '{staff} brings the person Sappho asked for to the landing. The two get time together before Sappho boards.'
            who: sappho_lesbos
            bio: 'Sappho had time to say goodbye in person before leaving Mytilene for Sicily.'
      zh:
        name: '船还没走'
        place: '莱斯博斯岛米蒂利尼'
        figure: '萨福'
        story: '《帕罗斯编年碑》记载，萨福离开米蒂利尼流亡西西里。碑文的日期有残缺，年份只能取约数。在这条分支里，她想见的人还不知道船几点开。'
        story_prose:
          opening:
            - '米蒂利尼的海岸。离萨福去西西里已有几百年时，帕罗斯的一块石碑才记下这一趟远行。现在连碑上的年份也残了。'
            - '史实里，萨福离开米蒂利尼流亡西西里，原因无从确知。在这条分支里，她有一位想当面道别的人，船家却已经在把行李往船上递。'
            - '这趟用得上认得码头和街巷的人。知道托谁找到一个还没听到船讯的人，比催船家有用。'
          points:
            p1: '{staff}把随船放行李的地方问清，托船家看着萨福的包，然后照她说的门口标记去找人。两人赶回渡口时，搬东西的人刚空出一截岸边。那人替萨福把手上松开的结系好。萨福没有把手收回去，直到船家来叫她。'
          outcomes:
            all: '船从岸边退开时，萨福抬起系绳的那只手。岸上的人一直站在下船时要踩的那块石头上。'
            p1: '船从岸边退开时，萨福抬起系绳的那只手。岸上的人一直站在下船时要踩的那块石头上。'
          none: '船先走了。等那人找到渡口时，留在石上的只是一截浸湿的缆绳。'
          not_admitted: '{staff}到了岸边，没能找到认识萨福的人。有人蹲在最末一级石阶上，把手里的绳理直。'
          excerpts:
            p1: '那人替萨福把手上松开的结系好。萨福没有把手收回去，直到船家来叫她。'
        relic: '一根打过结的绳'
        relic_desc: '分支里的绳，和她一起等船的人系在手上。'
        points:
          p1: '在去西西里的船出发前，把萨福想见的人带到渡口'
        points_fail:
          p1: '船离岸以前，员工没能把萨福请来道别的人带到。'
        shift:
          p1:
            was: '约公元前七世纪末至六世纪初，《帕罗斯编年碑》记萨福自米蒂利尼渡海流亡西西里。'
            now: '{staff}带着萨福托找的人走到渡口。上船前，两个人还有时间当面道别。'
            who: sappho_lesbos
            bio: '离开米蒂利尼去西西里以前，萨福有机会和她想见的人当面道别。'
text:
  en:
    name: Sappho
    text: Greek poet of Lesbos, active around 600 BC. She wrote lyric poems on desire and loss, collected in nine books in antiquity, of which only one complete poem and fragments survive.
  zh:
    name: 萨福
    text: 莱斯博斯的希腊诗人，活跃于公元前 600 年前后。她写关于渴望与失去的抒情诗，古代汇编成九卷，如今只留下一首完整的诗和一些残片。
hook: {en: 'Before the ship leaves', zh: '船还没走'}
facts:
  exile:
    date: '-596'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sappho_lesbos_parian, sappho_lesbos_exile_study]
    text:
      en: 'Around the turn of the seventh and sixth centuries BC: the Parian Marble records Sappho sailing from Mytilene to Sicily in exile.'
      zh: '约公元前七世纪末至六世纪初，《帕罗斯编年碑》记萨福自米蒂利尼渡海流亡西西里。'
    line:
      en: 'Around the turn of the seventh and sixth centuries BC: the Parian Marble records Sappho sailing from Mytilene to Sicily in exile.'
      zh: '约公元前七世纪末至六世纪初，《帕罗斯编年碑》记萨福自米蒂利尼渡海流亡西西里。'
      zh-Hant: '約公元前七世紀末至六世紀初，《帕羅斯編年碑》記薩福自米蒂利尼渡海流亡西西里。'
      fr: "Au tournant des VIIe et VIe siècles avant JC\_: le marbre de Paros enregistre Sappho naviguant de Mytilène vers la Sicile en exil."
      es: 'Alrededor del cambio de siglo VII y VI a. C.: el mármol de Paro registra a Safo navegando desde Mitilene a Sicilia en el exilio.'
      ja: '紀元前 7 世紀から 6 世紀の変わり目頃: パリアンの大理石には、サッポーが亡命先のミティレーネからシチリア島へ航海したことが記録されています。'
      ko: '기원전 7~6세기 초: 파리안 대리석(Parian Marble)은 사포가 미틸레네(Mytilene)에서 시칠리아(Sicily)로 망명하여 항해하는 것을 기록합니다.'
      ru: 'Примерно на рубеже седьмого и шестого веков до нашей эры: в Паросском мраморе записано, как Сапфо плыла из Митилини на Сицилию в изгнании.'
  papyrus:
    date: '250'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sappho_lesbos_papyrus]
    text:
      en: 'The catalogue identifies the surviving piece as fragment 5 of a poem about Sappho’s brother Charaxus. The catalogue dates the manuscript to the third century CE.'
      zh: '馆藏目录将现存片段列为萨福书写兄长卡拉克索斯的第5号残篇，目录将这份传抄本定为公元三世纪。'
