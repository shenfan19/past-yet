quotes:
  sappho_lesbos_echo_full:
    order: 1
    tier: full
    date: '-596'
    checked: official_record
    sources: [sappho_lesbos_echo_source_full]
    original: grc
    text:
      en:
        who: 'Sappho'
        quote: 'Go well, and remember me.'
        occasion: 'Fragment 94, one voice speaking to someone who is leaving. The poem is not an account of the exile.'
      zh:
        who: '萨福'
        quote: '愿你走好，也请记得我。'
        occasion: '残篇第 94 首，诗中一人向离去的人道别。它并非流亡纪事。'
      grc:
        who: 'Sappho'
        quote: 'χαίροιςʼ ἔρχεο κἄμεθεν μέμναιςʼ'
        occasion: 'Fragment 94, one voice speaking to someone who is leaving. The poem is not an account of the exile.'
      zh-Hant:
        who: '薩福'
        quote: '願你走好，也請記得我。'
        occasion: '殘篇第 94 首，詩中一人向離去的人道別。它並非流亡紀事。'
      fr:
        who: 'Sappho'
        quote: 'Allez-y bien et souvenez-vous de moi.'
        occasion: 'Fragment 94, une voix s''adressant à quelqu''un qui s''en va. Le poème n’est pas un récit de l’exil.'
      es:
        who: 'Safo'
        quote: 'Ve bien y acuérdate de mí.'
        occasion: 'Fragmento 94, una voz hablando con alguien que se va. El poema no es un relato del exilio.'
      ja:
        who: 'サッポー'
        quote: '元気に行って、私を覚えていてください。'
        occasion: '断片94、去っていく誰かに語りかける声。この詩は亡命者の説明ではありません。'
      ko:
        who: '사포'
        quote: '잘 가세요, 그리고 저를 기억해주세요.'
        occasion: '조각 94, 떠나는 사람에게 말하는 목소리 하나. 이 시는 유배에 대한 이야기가 아닙니다.'
      ru:
        who: 'Сапфо'
        quote: 'Будьте здоровы и помните обо мне.'
        occasion: 'Фрагмент 94, один голос обращается к уходящему. Стихотворение не является рассказом об изгнании.'
  sappho_lesbos_echo_none:
    order: 2
    tier: none
    date: '-596'
    checked: official_record
    sources: [sappho_lesbos_echo_source_none]
    original: grc
    text:
      en:
        who: 'Sappho'
        quote: 'Sappho, truly I leave you unwillingly.'
        occasion: 'Fragment 94, the other voice in the same poem. Its date is unknown.'
      zh:
        who: '萨福'
        quote: '萨福，我实在不愿离开你。'
        occasion: '同一残篇中另一人的话。作品日期不详。'
      grc:
        who: 'Sappho'
        quote: 'Ψάπφʼ, ἦ μάν ςʼ ἀέκοιςʼ ἀπυλιμπάνω.'
        occasion: 'Fragment 94, the other voice in the same poem. Its date is unknown.'
      zh-Hant:
        who: '薩福'
        quote: '薩福，我實在不願離開你。'
        occasion: '同一殘篇中另一人的話。作品日期不詳。'
      fr:
        who: 'Sappho'
        quote: 'Sappho, vraiment, je te quitte à contrecœur.'
        occasion: 'Fragment 94, l''autre voix du même poème. Sa date est inconnue.'
      es:
        who: 'Safo'
        quote: 'Safo, en verdad te dejo de mala gana.'
        occasion: 'Fragmento 94, la otra voz en el mismo poema. Se desconoce su fecha.'
      ja:
        who: 'サッポー'
        quote: 'サッポー、本当に私は不本意ながらあなたと別れます。'
        occasion: '断片 94、同じ詩のもう一方の声。その日付は不明です。'
      ko:
        who: '사포'
        quote: '사포야, 정말 본의 아니게 너를 떠나는구나.'
        occasion: '조각 94, 같은 시의 다른 목소리. 그 날짜는 알려져 있지 않습니다.'
      ru:
        who: 'Сапфо'
        quote: 'Сапфо, поистине, я неохотно покидаю тебя.'
        occasion: 'Фрагмент 94, второй голос в том же стихотворении. Дата его неизвестна.'
