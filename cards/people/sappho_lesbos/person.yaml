- sappho_lesbos
text:
  en:
    name: Sappho
    text: Greek poet of Lesbos, active around 600 BC. She wrote lyric poems on desire and loss, collected in nine books in antiquity, of which only one complete poem and fragments survive.
  zh:
    name: 萨福
    text: 莱斯博斯的希腊诗人，活跃于公元前 600 年前后。她写关于渴望与失去的抒情诗，古代汇编成九卷，如今只留下一首完整的诗和一些残片。
