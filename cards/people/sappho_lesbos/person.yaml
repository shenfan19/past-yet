    text:
      en:
        name: 'Before the next breath'
        place: "Mytilene"
        figure: "Sappho"
        story: 'A much later papyrus preserved by the British Library carries part of a poem attributed to Sappho about her brother. The game imagines a rehearsal on Lesbos around her lifetime, with two fictional listeners. The modern fragment supplies part of the theme. Its missing words and the sound of the song remain unknown.'
        relic: 'A rehearsal scrap'
        relic_desc: 'A prop from the imagined rehearsal, with one pause marked.'
        points:
          p1: 'Find where the listener stopped to breathe'
          p2: 'Give the hesitant singer a second entrance before the lamp goes out'
          p3: 'Separate the missing words from the sounds you could follow'
        vignettes:
          breath: 'Phile has written one long run of words and keeps losing her breath halfway through. You tap the table when she actually stops. She marks that place and tries the line again. Centuries later there will be scraps of the words. You have caught a pause that a scrap could never contain.'
          repeat: 'Myrto mouths the entrance twice without making a sound. Phile is about to take the lamp away. You tap the opening beat from beside her and she finally joins in. For one line there are two voices at the table. The second voice is the thing she had come to find.'
          blank: 'Someone asks what the returning brother does after the last words you remember from the future fragment. You could give them an ending on the spot. Instead you mark the place where your memory of the words runs out. When the lamp goes, the unfinished space is still there.'
      zh:
        name: '下一口气之前'
        place: "米蒂利尼"
        figure: "萨福"
        story: '大英图书馆藏有一片晚出许多世纪的纸莎草，上面留着一首归于萨福、写及兄长的诗的部分文字。游戏在她生活的时代附近安排一次虚构的莱斯博斯习唱，两名听众是虚构的。残片提供了部分题材，缺失的诗句和歌声依然无从听见。'
        relic: '一片习唱用的纸莎草'
        relic_desc: '虚构习唱中的道具，标过一处换气。'
        points:
          p1: '找出听者在哪里停下来换气'
          p2: '熄灯前再给犹豫的人一次起唱的机会'
          p3: '把没听清的字和能跟上的声音分开'
        vignettes:
          breath: '菲勒把词全串成一行，念到一半总要换气。她一停，你就在桌上轻敲一下。她记住那处停顿，又试了一遍。几个世纪后还会有残存的字迹，你听见的这口气，却留不进残片里。'
          repeat: '米尔托两次张嘴，都没唱出声。菲勒已经要把灯拿走。你在米尔托身边敲出开头一拍，她终于唱了进来。有一行，桌边有两个人的声音。她今天来，就是为了跟上这一行。'
          blank: '有人问，唱到你记得的那几句以后，归来的兄长又做了什么。你原可以当场接一个结尾。你只在记忆断掉的地方做了记号。灯灭时，那一段空处依然留着。'
text:
  en:
    name: Sappho
    text: Greek poet of Lesbos, active around 600 BC. She wrote lyric poems on desire and loss, collected in nine books in antiquity, of which only one complete poem and fragments survive.
  zh:
    name: 萨福
    text: 莱斯博斯的希腊诗人，活跃于公元前 600 年前后。她写关于渴望与失去的抒情诗，古代汇编成九卷，如今只留下一首完整的诗和一些残片。
hook: {en: 'A voice stops before the words do.', zh: '声音停了，词还来不及写完。'}
