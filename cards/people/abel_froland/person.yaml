    text:
      en:
        name: 'The example and the claim'
        place: "Froland"
        figure: "Niels Henrik Abel"
        story: 'At Christmas 1828 Niels Henrik Abel came by sledge to the ironworks at Froland, cold and coughing, to visit his fiancée, and he lay ill there for twelve weeks. On 6 January 1829 he wrote his last paper, two or three pages restating the main result of the long memoir he had given to the Paris Academy. He died of tuberculosis on 6 April, aged twenty six. Two days later, not knowing, August Leopold Crelle wrote from Berlin that a post for him was secured.'
        story_prose:
          opening:
            - 'Froland ironworks, southern Norway, January 1829. Niels Henrik Abel lies ill in the house where his fiancée is a governess, coughing hard. He is twenty six. Some years ago he proved that the general equation of the fifth degree cannot be solved by radicals, but the long memoir he gave the Paris Academy in 1826 has not been heard of since.'
            - 'In history, he was already cold and ill when he came by sledge at Christmas, and he lay in bed here for twelve weeks. On 6 January he wrote his last paper, two or three pages long. He died of tuberculosis on 6 April. Two days later Crelle wrote from Berlin that a post for him was secured. In this branch, the kitchen maid downstairs listens to the coughing all night, and the clerk of the ironworks sorts the post every day as usual.'
            - 'Three kinds of people can help on this trip: someone who can check a derivation and keep papers and intake records in order, someone who knows nursing and can keep watch at a sickbed, and someone who can move friends far away and press them to write back.'
          outcomes:
            all: 'In April, when the letter from Berlin confirming the post was written, Abel was already gone. The March reply lay under his pillow, and the stove in the room had not yet gone out.'
            p4: 'In April, when Berlin wrote to confirm the post, Abel was already gone. The March reply still lay under his pillow.'
            p3: 'The stove in that room at Froland burned on into April.'
            p2: 'Many years later someone went to Paris looking for the long memoir, found the small line at the foot of the short paper, and began with the intake register of that year.'
            p1: 'The paper of two or three pages was sent. The address on the envelope was in his own hand.'
          none: 'Winter was long at Froland. The snow outside the window never melted, and the man upstairs coughed night after night.'
          desync: 'On 6 January the short paper stopped before it could be checked, and {staff} was recalled. The coughing upstairs went on. The pages lay spread on the bedcover, the ink not yet dry.'
          not_admitted: '{staff} never got through the door of that house. The man upstairs was still coughing, and the news from Berlin was still on its way.'
          points:
            p1: 'On 6 January Abel sat propped on the pillow writing the short paper, two or three pages spread on the bedcover. {staff} followed the derivation line by line with a pen and marked each place where the notation did not agree from one step to the next, and he corrected them one by one. By evening the paper was fair-copied, and there were a few spots of ink on the bedcover. He squared the three pages, pressed them flat with his palm, and only then handed them over.'
            p2: 'The short paper was still at hand. {staff} set it beside the date the Paris memoir had been submitted, and at the foot of each copy wrote one small line: the year it was handed in, to whom, and under what title. The ink was faint, squeezed into the margin, and not dry until dusk. Of the two copies, one went in with the short paper and one stayed in his folder of manuscripts.'
            p3: 'On the coldest nights at the end of January Abel coughed too much to sleep. {staff} kept the stove fed, warmed the bed, raised his pillows, wiped his sweat and gave him water. One night the window was covered in frost flowers, and the stove in the room never went out. Near dawn, after a fit of coughing, he fell asleep again.'
            p4:
              class_lettered: '{staff} went about it the way one keeps a correspondence, listing one by one the people in Berlin working on his behalf and what each was doing, and wrote to each in turn, asking them to send word of their progress to Froland without waiting for anything to be settled. In March the reply came. Abel had the letter brought to his bed and read it twice. It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.'
              else: '{staff} wrote to Berlin letter after letter, saying how ill he was and asking the friends working for him to send word of their progress without waiting for anything to be settled. In March the reply came. Abel had the letter brought to his bed and read it twice. It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.'
          excerpts:
            p4: 'It did not say the post was settled, only that they were still trying. He folded the letter and put it under his pillow.'
            p3: 'One night the window was covered in frost flowers, and the stove in the room never went out. Near dawn, after a fit of coughing, he fell asleep again.'
            p2: 'The ink was faint, squeezed into the margin, and not dry until dusk. Of the two copies, one went in with the short paper and one stayed in his folder of manuscripts.'
            p1: 'By evening the paper was fair-copied, and there were a few spots of ink on the bedcover. He squared the three pages, pressed them flat with his palm, and only then handed them over.'
        relic: "A sealed letter"
        relic_desc: "An unopened offer, tied with a thread."
        points:
          p1: 'Help Abel check his last short proof while he is ill so the paper can be sent'
          p2: 'While the short paper is at hand, tie it to the Paris submission record so anyone searching has a reference'
          p3: 'Through the twelve weeks Abel lies in bed at Froland, keep the cold from his room and ease his cough and his pain'
          p4: 'Ask the friends seeking a post for Abel to send an interim letter so he knows before he dies that they are still trying'
        points_fail:
          p1: 'The paper stops before it can be checked, and the central result of the Paris memoir loses this early public record. The office recalls the employee after a loss of sync.'
          p2: 'People searching for the Paris memoir still have to work through the old intake records with little more than a title.'
          p3: 'Nobody eases the cold and the cough, and in this branch his last weeks at Froland are as hard as they were.'
          p4: 'No word reaches Froland in time. The formal confirmation comes too late.'
        shift:
          p1:
            was: 'On 6 January 1829 at Froland, Abel wrote his last mathematical paper, restating a main result of his Paris memoir.'
          p2:
            was: 'Around 1829 Abel restated the Paris memoir''s central result; the manuscript was hard to locate and did not appear in print until 1841.'
            now: '{staff} links the new paper to the earlier submission date and leaves a reference with each copy, narrowing any later search.'
          p3:
            was: 'At Christmas 1828 Abel travelled by sledge to Froland, cold and coughing, and began to cough up blood; he lay in bed there for twelve weeks.'
            now: '{staff} keeps the stove going and the bed warm, and sits up with him through the worst nights. Abel suffers a little less in his last weeks.'
          p4:
            was: 'Abel died on 6 April 1829. The letter confirming a post in Berlin was written two days later.'
            now: '{staff} asks a contact to report on the efforts already underway. Abel reads that his friends are still working to find him a post.'
            who: abel_froland
            bio: 'Before he died, Abel heard how his Berlin friends were trying to keep an opportunity open for him to continue his research. The formal confirmation still came after his death.'
        vignettes:
          firewood: 'In the coldest days of February {staff} helps the kitchen maid carry firewood upstairs. When the gentleman upstairs coughs all night, she says, she lies downstairs counting, and by morning she has lost count.'
          sledge: 'In January {staff} helps the groom fit a new shaft to the sledge. At Christmas he fetched a gentleman out from town, the groom says, wrapped in three blankets and coughing the whole way; on arrival the man could not lift his own trunk, and the groom carried it up and refused the coin.'
          post: 'In April {staff} helps the clerk of the ironworks sort a bag of post. He turns up a letter with a Berlin mark, holds it to the window a while, and says that this one has come at a bad time, because the man it is for is no longer here.'
      zh:
        name: '一道算得出的五次方程'
        place: "弗罗兰"
        figure: "尼尔斯·亨里克·阿贝尔"
        story: '1828 年圣诞，尼尔斯·亨里克·阿贝尔受着寒、咳着嗽坐雪橇来到弗罗兰铁厂看望未婚妻，此后在那里卧床十二周。1829 年 1 月 6 日，他写下最后一篇论文，两三页，重述他交给巴黎科学院的那篇长稿的要点。4 月 6 日，他死于肺结核，二十六岁。两天后，尚不知情的奥古斯特·利奥波德·克雷勒从柏林来信，说替他谋的职位已经落实。'
        story_prose:
          opening:
            - '1829 年 1 月，挪威南部的弗罗兰铁厂。尼尔斯·亨里克·阿贝尔在未婚妻做家庭教师的那户人家里卧床，咳得厉害。他二十六岁，几年前已经证明一般五次方程不能用根式求解，1826 年交给巴黎科学院的长稿却一直没有下落。'
            - '史实里，他圣诞坐雪橇来时就已受寒，此后在这里卧床十二周，1 月 6 日写下最后一篇两三页的短稿。4 月 6 日他死于肺结核。两天后，克雷勒从柏林来信，说替他谋的职位已经落实。在这条分支里，楼下的厨房女佣整夜听着楼上的咳嗽，铁厂的账房照旧每天分拣邮包。'
            - '这一趟用得上三种人：核得了推导、理得清稿件和收件记录的人，懂护理、守得住病床的人，说得动远方的朋友、肯替他把信催回来的人。'
          outcomes:
            all: '四月，柏林确认职位的信写成时，阿贝尔已经不在了。三月那封回信压在他的枕头底下，屋里的炉火还没熄。'
            p4: '四月，柏林写来确认职位的信时，阿贝尔已经不在了。三月那封回信，还压在他的枕头底下。'
            p3: '弗罗兰那间屋子的炉火，一直烧到了四月。'
            p2: '很多年后，有人去巴黎找那篇长稿，翻到短稿页脚那行小字，从那一年的收件簿翻起。'
            p1: '那篇两三页的短稿寄了出去。信封上的字，是他自己写的。'
          none: '弗罗兰的冬天很长。窗外的雪一直没化，楼上的人咳了一夜又一夜。'
          desync: '1 月 6 日，那篇短稿停在校对之前，{staff}被召回了。楼上的咳嗽声还在，两三页纸摊在被面上，墨还没干。'
          not_admitted: '{staff}没能进那户人家的门。楼上的人还在咳，柏林的消息还在路上。'
          points:
            p1: '1 月 6 日，阿贝尔靠在枕头上写那篇短稿，两三页纸摊在被面上。{staff}拿着笔一行一行跟着核推导，前后记号对不上的地方逐处标出来，他一处一处改。傍晚，稿子誊清了，被面上落着几点墨。他把三页纸理齐，用手掌压了压，才交出去。'
            p2: '短稿还在手边。{staff}把它同巴黎长稿的投递日期对在一处，在两份抄件的页脚各记了一行小字：哪一年交的件，交给了谁，题目叫什么。墨迹很淡，挤在页边，到天黑才干透。两份抄件，一份夹进了短稿，一份留在他的稿夹里。'
            p3: '一月底最冷的那些夜里，阿贝尔咳得睡不着。{staff}守着炉子添柴，把床铺焐暖，替他垫高枕头、擦汗、喂水。有一夜窗玻璃上结满了冰花，屋里的炉火一直没断。天快亮时，他咳完一阵，又睡着了。'
            p4:
              class_lettered: '{staff}照理来往信件的办法，把柏林那边替他奔走的人和事一条条列清，按人写信，请他们先把进展寄回弗罗兰，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。'
              else: '{staff}一封接一封往柏林写信，说他病得重，请替他奔走的朋友先把进展寄来，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。'
          excerpts:
            p4: '信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕头底下。'
            p3: '有一夜窗玻璃上结满了冰花，屋里的炉火一直没断。天快亮时，他咳完一阵，又睡着了。'
            p2: '墨迹很淡，挤在页边，到天黑才干透。两份抄件，一份夹进了短稿，一份留在他的稿夹里。'
            p1: '傍晚，稿子誊清了，被面上落着几点墨。他把三页纸理齐，用手掌压了压，才交出去。'
        relic: "一封封着的信"
        relic_desc: "一封没拆开的聘书，用细线系着。"
        points:
          p1: '在阿贝尔病中写最后一篇短稿时，帮他把证明核对到可以寄出'
          p2: '趁短稿还在手边，帮阿贝尔把它同巴黎长稿的投递记录对上，给找稿的人留下索引'
          p3: '阿贝尔在弗罗兰卧床的十二周里，替他挡住屋里的冷，减轻他的咳嗽和病痛'
          p4: '请替阿贝尔奔走的人先寄一封进展信，让他生前知道柏林还有人为他的职位努力'
        points_fail:
          p1: '短稿停在校对之前，巴黎长稿的要点也没有这份及时的公开记录。行程同步失败，员工被召回。'
          p2: '寻找巴黎长稿的人只知道大致题目，仍要从旧收件记录一页页找。'
          p3: '冷和咳嗽没人减轻，这条分支里他在弗罗兰的最后几周和原来一样难熬。'
          p4: '弗罗兰一直等不到柏林的消息，正式的好消息来得太晚。'
        shift:
          p1:
            was: '1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学短稿，重述巴黎长稿的主要结果。'
          p2:
            was: '1829 年前后，阿贝尔重述巴黎长稿的要点，原稿一度难寻，直到 1841 年才印行。'
            now: '{staff}把短稿和旧投递日期对在一处，两边各留一份索引。以后查稿的人能凭交件记录缩小范围。'
          p3:
            was: '1828 年圣诞，阿贝尔受着寒、咳着嗽坐雪橇到弗罗兰，随后开始咳血，此后在那里卧床十二周。'
            now: '{staff}守着炉火，把床铺焐暖，最难熬的几夜一直坐在床边。阿贝尔最后几周少受了些罪。'
          p4:
            was: '1829 年 4 月 6 日阿贝尔去世，柏林确认职位的信于两日后写成。'
            now: '{staff}请联系人先把奔走过程写回弗罗兰。阿贝尔读到朋友们正在为他争取职位，知道这件事还有人在做。'
            who: abel_froland
            bio: '阿贝尔去世前收到柏林朋友奔走的进展，知道他们还为他留着继续研究的机会。正式任命仍在他去世之后。'
        vignettes:
          firewood: '二月最冷的那几天，{staff}帮厨房女佣往楼上搬劈柴。柴捆上的雪一路掉在楼梯上。女佣说，楼上那位先生咳一夜，她就在楼下数一夜，数到天亮也没数清。'
          sledge: '一月，{staff}帮马夫给雪橇换一根断了的辕木。马在棚里喷着白气。马夫说圣诞那趟从城里接来一位先生，裹着三层毯子一路咳，下车时连自己的箱子都提不动，是他扛上楼的，赏钱他没要。'
          post: '四月，{staff}帮铁厂的账房先生分拣邮包。桌上的信摞了半尺高，各地的邮戳挤在一起。他翻出一封盖着柏林邮戳的信，对着窗户看了半天，说这一封来得不巧，收信的人已经不在了。'
text:
  en:
    name: Niels Henrik Abel
    text: Norwegian mathematician, 1802 to 1829. He proved that the general equation of the fifth degree cannot be solved with radicals and made early advances in elliptic functions. He died of tuberculosis at twenty six, shortly before his work was recognised.
  zh:
    name: 尼尔斯·亨里克·阿贝尔
    text: 挪威数学家，1802 年生，1829 年去世。他证明了一般五次方程不能用根式求解，并在椭圆函数上取得早期进展。他二十六岁死于肺结核，不久之后他的工作才获得承认。
quotes:
  abel_froland_equations:
    order: 2
    tier: full
    date: '1828-11-25'
    checked: official_record
    sources: [abel_legendre_letter, abel_paris_notebook]
    original: fr
    text:
      fr:
        who: 'Niels Henrik Abel'
        quote: 'il est impossible de résoudre les équations générales supérieures au quatrième degré'
        occasion: 'lettre à Adrien-Marie Legendre, à propos de la résolution par radicaux'
      en:
        who: 'Niels Henrik Abel'
        quote: 'General equations above the fourth degree cannot be solved [by radicals].'
        occasion: 'letter to Adrien-Marie Legendre, on solutions by radicals (game translation)'
      zh:
        who: '尼尔斯·亨里克·阿贝尔'
        quote: '四次以上的一般方程无法［用根式］求解。'
        occasion: '致阿德里安-马里·勒让德的信，论根式求解（游戏译文）'
      zh-Hant:
        who: '尼爾斯·亨里克·阿貝爾'
        quote: '四次以上的一般方程無法［用根式］求解。'
        occasion: '致阿德里安-馬裡·勒讓德的信，論根式求解（遊戲譯文）'
      es:
        who: 'Niels Henrik Abel'
        quote: 'Las ecuaciones generales superiores al cuarto grado no se pueden resolver [mediante radicales].'
        occasion: 'carta a Adrien-Marie Legendre, sobre las soluciones radicales (traducción del juego)'
      ja:
        who: 'ニールス・ヘンリック・アーベル'
        quote: '4 次以上の一般方程式は [根号では] 解くことができません。'
        occasion: 'アドリアン＝マリー・ルジャンドルへの手紙、急進派による解決策について（ゲーム翻訳）'
      ko:
        who: '닐스 헨리크 아벨'
        quote: '4차 이상의 일반 방정식은 [근수로] 풀 수 없습니다.'
        occasion: '급진주의자들의 해결책에 관해 Adrien-Marie Legendre에게 보낸 편지(게임 번역)'
      ru:
        who: 'Нильс Хенрик Абель'
        quote: 'Общие уравнения выше четвертой степени не могут быть решены [радикалами].'
        occasion: 'письмо Адриану-Мари Лежандру о решениях радикалов (перевод игры)'
  abel_froland_masters:
    order: 1
    tier: none
    date: '1826-08-09'
    checked: official_record
    sources: [abel_paris_notebook]
    original: fr
    text:
      fr:
        who: 'Niels Henrik Abel'
        quote: 'il faut étudier les maîtres et non pas les écoliers'
        occasion: 'carnet de mathématiques tenu à Paris, note en marge de la page 79'
      en:
        who: 'Niels Henrik Abel'
        quote: 'One should study the masters, not their pupils.'
        occasion: 'mathematical notebook kept in Paris, marginal note on p. 79, on making progress in mathematics (game translation)'
      zh:
        who: '尼尔斯·亨里克·阿贝尔'
        quote: '该研读名家的著作，而不是他们学生的著作。'
        occasion: '巴黎数学笔记第 79 页页边批注，谈怎样在数学上取得进展（游戏译文）'
      zh-Hant:
        who: '尼爾斯·亨里克·阿貝爾'
        quote: '該研讀名家的著作，而不是他們學生的著作。'
        occasion: '巴黎數學筆記第 79 頁頁邊批註，談怎樣在數學上取得進展（遊戲譯文）'
      es:
        who: 'Niels Henrik Abel'
        quote: 'Hay que estudiar a los maestros, no a sus alumnos.'
        occasion: 'cuaderno matemático conservado en París, nota marginal en la p. 79, sobre cómo progresar en matemáticas (traducción del juego)'
      ja:
        who: 'ニールス・ヘンリック・アーベル'
        quote: '人はその弟子ではなく、マスターを研究すべきです。'
        occasion: 'パリに保管されている数学ノート、ページの欄外注記。 79、数学の進歩について（ゲーム翻訳）'
      ko:
        who: '닐스 헨리크 아벨'
        quote: '제자가 아니라 스승을 연구해야 합니다.'
        occasion: '파리에 보관된 수학 노트, 페이지의 여백 메모. 79, 수학 발전에 대해 (게임 번역)'
      ru:
        who: 'Нильс Хенрик Абель'
        quote: 'Следует изучать мастеров, а не их учеников.'
        occasion: 'математическая тетрадь хранится в Париже, пометка на полях на стр. 79, об успехах в математике (перевод игры)'
hook: {en: 'The Berlin letter was written two days too late', zh: '柏林的信晚写了两天'}
facts:
  quintic:
    date: '1824'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [abel_froland_quintic]
    text:
      en: 'Abel proves the absence of a general radical solution for equations of degree five.'
      zh: '阿贝尔证明一般五次方程不能用根式求解。'
    line:
      en: '1824: Abel proves that the general equation of the fifth degree cannot be solved by radicals.'
      zh: '1824 年，阿贝尔证明一般五次方程不能用根式求解。'
      zh-Hant: '1824 年，阿貝爾證明一般五次方程不能用根式求解。'
      fr: '1824 : Abel prouve que l''équation générale du cinquième degré ne peut être résolue par des radicaux.'
      es: '1824: Abel demuestra que la ecuación general de quinto grado no puede resolverse mediante radicales.'
      ja: '1824年：アーベルは5次の一般方程式が根号では解けないことを証明した。'
      ko: '1824년: 아벨은 5차 일반 방정식이 근수로 풀 수 없음을 증명했습니다.'
      ru: '1824: Абель доказывает, что общее уравнение пятой степени не может быть решено радикалами.'
  sledge:
    date: '1828-12'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_froland_prize_final_years, abel_mactutor]
    text:
      en: 'At Christmas 1828 Abel travelled by sledge to Froland to visit his fiancée, a governess there, and fell ill on the way. After a ball at Christmas he began to cough up blood, and he lay in bed for twelve weeks under the care of the district doctor.'
      zh: '1828 年圣诞，阿贝尔坐雪橇到弗罗兰看望在那里做家庭教师的未婚妻，路上病倒。圣诞舞会之后他开始咳血，此后在当地医生的照看下卧床十二周。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Christmas 1828: cold and coughing, Abel comes by sledge to Froland to see his fiancée.'
      zh: '1828 年圣诞，阿贝尔受着寒、咳着嗽，坐雪橇到弗罗兰看望未婚妻。'
      zh-Hant: '1828 年聖誕，阿貝爾受著寒、咳著嗽，坐雪橇到弗羅蘭看望未婚妻。'
      fr: 'Noël 1828 : rhume et toux, Abel vient en traîneau à Froland voir sa fiancée.'
      es: 'Navidad de 1828: resfriado y tos, Abel llega en trineo a Froland para ver a su prometida.'
      ja: '1828 年のクリスマス: 寒くて咳き込むアベルは、婚約者に会うためにそりでフロランドにやって来ます。'
      ko: '1828년 크리스마스: 감기와 기침을 하던 아벨은 약혼자를 만나러 썰매를 타고 프롤랜드로 옵니다.'
      ru: 'Рождество 1828 года: простуженный и кашляющий Абель приезжает на санях во Фроланд, чтобы навестить свою невесту.'
  last_paper:
    date: '1829-01-06'
    stay_day: 5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_froland_municipal_record, abel_froland_prize_final_years]
    text:
      en: 'On 6 January 1829 at Froland Abel wrote his last mathematical paper, two or three pages setting out the main idea of his Paris memoir.'
      zh: '1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学论文，两三页，写的是巴黎长稿的主要思想。'
    line:
      en: '6 January 1829: in bed at Froland, Abel writes his last paper, two or three pages on the main idea of his Paris memoir.'
      zh: '1829 年 1 月 6 日，阿贝尔在弗罗兰的病床上写下最后一篇论文，两三页，写的是巴黎长稿的主要思想。'
      zh-Hant: '1829 年 1 月 6 日，阿貝爾在弗羅蘭的病床上寫下最後一篇論文，兩三頁，寫的是巴黎長稿的主要思想。'
      fr: '6 janvier 1829 : au lit à Froland, Abel rédige son dernier article, deux ou trois pages sur l''idée principale de ses mémoires de Paris.'
      es: '6 de enero de 1829: en la cama de Froland, Abel escribe su último artículo, dos o tres páginas sobre la idea principal de sus memorias de París.'
      ja: '1829年1月6日: フロラントのベッドで、アベルはパリ回想録の主なアイデアに関する最後の論文を2、3ページ書きます。'
      ko: '1829년 1월 6일: Froland의 침대에서 Abel은 파리 회고록의 주요 아이디어에 대한 2~3페이지의 마지막 논문을 씁니다.'
      ru: '6 января 1829 года. Лежа в постели во Фроланде, Абель пишет свою последнюю статью, состоящую из двух или трех страниц, посвященную основной идее своих парижских мемуаров.'
  death:
    date: '1829-04-06'
    stay_day: 95
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_wiki]
    text:
      en: 'Abel died of tuberculosis at Froland at eleven in the forenoon of 6 April 1829, aged twenty six.'
      zh: '1829 年 4 月 6 日上午十一点，阿贝尔在弗罗兰死于肺结核，二十六岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '6 April 1829: Niels Henrik Abel dies at Froland, aged twenty six.'
      zh: '1829 年 4 月 6 日，尼尔斯·亨里克·阿贝尔在弗罗兰去世，二十六岁。'
      zh-Hant: '1829 年 4 月 6 日，尼爾斯·亨里克·阿貝爾在弗羅蘭去世，二十六歲。'
      fr: '6 avril 1829 : Niels Henrik Abel décède à Froland, âgé de vingt-six ans.'
      es: '6 de abril de 1829: Niels Henrik Abel muere en Froland, a los veintiséis años.'
      ja: '1829年4月6日：ニールス・ヘンリック・アーベルが26歳でフロラントにて死去。'
      ko: '1829년 4월 6일: 닐스 헨리크 아벨이 Froland에서 26세의 나이로 사망합니다.'
      ru: '6 апреля 1829 года: Нильс Хенрик Абель умирает во Фроланде в возрасте двадцати шести лет.'
  berlin:
    date: '1829-04-08'
    stay_day: 97
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_froland_berlin, abel_wiki]
    text:
      en: 'Abel died on 6 April. Crelle wrote from Berlin on 8 April with news of a guaranteed post.'
      zh: '阿贝尔于 4 月 6 日去世。4 月 8 日，克雷勒从柏林写信报告职位已落实。'
    line:
      en: '8 April 1829: not knowing, Crelle writes from Berlin that the post for Abel is secured.'
      zh: '1829 年 4 月 8 日，尚不知情的克雷勒从柏林写信，说替阿贝尔谋的职位已经落实。'
      zh-Hant: '1829 年 4 月 8 日，尚不知情的克雷勒從柏林寫信，說替阿貝爾謀的職位已經落實。'
      fr: '8 avril 1829 : sans le savoir, Crelle écrit de Berlin que le poste d''Abel est assuré.'
      es: '8 de abril de 1829: Crelle, sin saberlo, escribe desde Berlín que el puesto de Abel está asegurado.'
      ja: '1829年4月8日: それとは知らず、クレルはベルリンからアベルのポストが確保されたと手紙を書く。'
      ko: '1829년 4월 8일: 모르고 있던 Crelle은 베를린에서 Abel의 자리가 확보되었다고 썼습니다.'
      ru: '8 апреля 1829 г.: не зная, Крелль пишет из Берлина, что пост для Абеля обеспечен.'
  prize:
    date: '1830'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_froland_prize_final_years]
    text:
      en: 'In 1830 the Paris Academy gave its Grand Prix to Abel, after his death, and to Carl Jacobi.'
      zh: '1830 年，巴黎科学院把大奖授给已故的阿贝尔和卡尔·雅可比。'
    line:
      en: '1830: the Paris Academy gives its Grand Prix to Abel, who is dead, and to Jacobi.'
      zh: '1830 年，巴黎科学院把大奖授给已经去世的阿贝尔和雅可比。'
      zh-Hant: '1830 年，巴黎科學院把大獎授給已經去世的阿貝爾和雅可比。'
      fr: '1830 : l''Académie de Paris remet son Grand Prix à Abel, décédé, et à Jacobi.'
      es: '1830: la Academia de París concede su Gran Premio a Abel, fallecido, y a Jacobi.'
      ja: '1830年: パリ・アカデミーは、亡くなったアベルとジャコビにグランプリを与える。'
      ko: '1830년: 파리 아카데미는 죽은 아벨과 자코비에게 그랑프리를 수여합니다.'
      ru: '1830: Парижская академия вручает Гран-при умершему Авелю и Якоби.'
  memoir:
    date: '1841'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_paris_academy_records]
    text:
      en: 'The long memoir Abel had given to the Paris Academy in 1826 was found again in 1830 and printed in 1841.'
      zh: '阿贝尔 1826 年交给巴黎科学院的长稿在 1830 年被找到，1841 年印出。'
    line:
      en: '1841: the memoir Abel gave the Paris Academy is printed at last.'
      zh: '1841 年，阿贝尔交给巴黎科学院的那篇长稿终于印出。'
      zh-Hant: '1841 年，阿貝爾交給巴黎科學院的那篇長稿終於印出。'
      fr: '1841 : le mémoire qu''Abel donne à l''Académie de Paris est enfin imprimé.'
      es: '1841: por fin se imprimen las memorias que Abel entregó a la Academia de París.'
      ja: '1841年：アベルがパリのアカデミーに贈った回想録がついに印刷される。'
      ko: '1841년: 아벨이 파리 아카데미에 준 회고록이 마침내 인쇄되었습니다.'
      ru: '1841: мемуары, которые Абель подарил Парижской академии, наконец-то напечатаны.'
