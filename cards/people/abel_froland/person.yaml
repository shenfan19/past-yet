    text:
      en:
        name: 'The example and the claim'
        place: "Froland"
        figure: "Niels Henrik Abel"
        story: 'Abel’s 1824 paper proves that there is no general solution by radicals for equations of degree five. Particular equations can still be solved that way. Abel died in Froland on 6 April 1829. On 8 April, unaware of his death, Crelle wrote from Berlin with news of a permanent post.'
        relic: "A sealed letter"
        relic_desc: "An unopened offer, tied with a thread."
        points:
          p1: 'Help Abel check his last short proof while he is ill so the paper can be sent'
          p2: 'While the short paper is at hand, tie it to the Paris submission record so anyone searching has a reference'
          p3: 'Through the twelve weeks Abel lies in bed at Froland, keep the cold from his room and ease his cough and his pain'
          p4: 'Ask the friends seeking a post for Abel to send an interim letter so he knows before he dies that they are still trying'
        points_fail:
          p1: 'The paper stops before it can be checked, and the central result of the Paris memoir loses this early public record. The office recalls the employee after a loss of sync.'
          p2: 'People searching for the Paris memoir still have to work through the old intake records with little more than a title.'
          p3: 'Nobody eases the cold and the cough, and in this branch his last weeks at Froland are as hard as they were.'
          p4: 'No word reaches Froland in time. The formal confirmation comes too late.'
        shift:
          p1:
            was: 'On 6 January 1829 at Froland, Abel wrote his last mathematical paper, restating a main result of his Paris memoir.'
          p2:
            was: 'Around 1829 Abel restated the Paris memoir''s central result; the manuscript was hard to locate and did not appear in print until 1841.'
            now: '{staff} links the new paper to the earlier submission date and leaves a reference with each copy, narrowing any later search.'
          p3:
            was: 'At Christmas 1828 Abel travelled by sledge to Froland, cold and coughing, and began to cough up blood; he lay in bed there for twelve weeks.'
            now: '{staff} keeps the stove going and the bed warm, and sits up with him through the worst nights. Abel suffers a little less in his last weeks.'
          p4:
            was: 'Abel died on 6 April 1829. The letter confirming a post in Berlin was written two days later.'
            now: '{staff} asks a contact to report on the efforts already underway. Abel reads that his friends are still working to find him a post.'
            who: abel_froland
            bio: 'Before he died, Abel heard how his Berlin friends were trying to keep an opportunity open for him to continue his research. The formal confirmation still came after his death.'
        vignettes:
          example: 'On the practice sheet a copyist has set a fifth power equal to 32. You substitute 2 and get 32, then underline the word ‘general’ on the separate slip about Abel’s result. The copyist files the two together. You can bring back the checked example. The news from Berlin has yet to be written.'
          job: 'Knowing the date of Crelle’s letter, you ask the copyist to leave a place in the file for Berlin. He asks whether to label it as news already received. You leave the pocket empty and write down why. The letter will be written two days after Abel dies.'
          margin: 'You copy a worked example on the back of a spare slip and put the more general statement on the front. A reader can turn it over instead of searching for a second sheet. The space for Berlin remains blank when you leave.'
      zh:
        name: '一道算得出的五次方程'
        place: "弗罗兰"
        figure: "尼尔斯·亨里克·阿贝尔"
        story: '阿贝尔于 1824 年证明，一般五次方程没有根式解法。某些具体的五次方程仍可用根式求解。1829 年 4 月 6 日，阿贝尔在弗罗兰去世。4 月 8 日，尚不知情的克雷勒从柏林寄信告知他有一份长期教职。'
        relic: "一封封着的信"
        relic_desc: "一封没拆开的聘书，用细线系着。"
        points:
          p1: '在阿贝尔病中写最后一篇短稿时，帮他把证明核对到可以寄出'
          p2: '趁短稿还在手边，帮阿贝尔把它同巴黎长稿的投递记录对上，给找稿的人留下索引'
          p3: '阿贝尔在弗罗兰卧床的十二周里，替他挡住屋里的冷，减轻他的咳嗽和病痛'
          p4: '请替阿贝尔奔走的人先寄一封进展信，让他生前知道柏林还有人为他的职位努力'
        points_fail:
          p1: '短稿停在校对之前，巴黎长稿的要点也没有这份及时的公开记录。行程同步失败，员工被召回。'
          p2: '寻找巴黎长稿的人只知道大致题目，仍要从旧收件记录一页页找。'
          p3: '冷和咳嗽没人减轻，这条分支里他在弗罗兰的最后几周和原来一样难熬。'
          p4: '弗罗兰一直等不到柏林的消息，正式的好消息来得太晚。'
        shift:
          p1:
            was: '1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学短稿，重述巴黎长稿的主要结果。'
          p2:
            was: '1829 年前后，阿贝尔重述巴黎长稿的要点，原稿一度难寻，直到 1841 年才印行。'
            now: '{staff}把短稿和旧投递日期对在一处，两边各留一份索引。以后查稿的人能凭交件记录缩小范围。'
          p3:
            was: '1828 年圣诞，阿贝尔受着寒、咳着嗽坐雪橇到弗罗兰，随后开始咳血，此后在那里卧床十二周。'
            now: '{staff}守着炉火，把床铺焐暖，最难熬的几夜一直坐在床边。阿贝尔最后几周少受了些罪。'
          p4:
            was: '1829 年 4 月 6 日阿贝尔去世，柏林确认职位的信于两日后写成。'
            now: '{staff}请联系人先把奔走过程写回弗罗兰。阿贝尔读到朋友们正在为他争取职位，知道这件事还有人在做。'
            who: abel_froland
            bio: '阿贝尔去世前收到柏林朋友奔走的进展，知道他们还为他留着继续研究的机会。正式任命仍在他去世之后。'
        vignettes:
          example: '抄写人练习纸上有一道五次幂等于 32 的题。你代入 2 得到 32，又在写着阿贝尔结论的另一张纸上划出「一般」二字。抄写人把两张收在一起。你带回这道验过的例题。此时，柏林那封信还没有写。'
          job: '你知道克雷勒哪天写信，便请抄写人在夹里给柏林留一处。他问该不该写成消息已到。你把那一格空着，另记原因。那封信要等到阿贝尔去世两天后才写。'
          margin: '你把一道算好的例题抄在纸条背面，正面留下那条一般结论。后来的人把纸翻面就能对照。离开时，留给柏林消息的地方仍空着。'
text:
  en:
    name: Niels Henrik Abel
    text: Norwegian mathematician, 1802 to 1829. He proved that the general equation of the fifth degree cannot be solved with radicals and made early advances in elliptic functions. He died of tuberculosis at twenty six, shortly before his work was recognised.
  zh:
    name: 尼尔斯·亨里克·阿贝尔
    text: 挪威数学家，1802 年生，1829 年去世。他证明了一般五次方程不能用根式求解，并在椭圆函数上取得早期进展。他二十六岁死于肺结核，不久之后他的工作才获得承认。
hook: {en: 'Can a simple fifth power fool you?', zh: '解得出一道，就能解出全部？'}
