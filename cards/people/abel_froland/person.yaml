    line:
      en: '1824: Abel proves that the general equation of the fifth degree cannot be solved by radicals.'
      zh: '1824 年，阿贝尔证明一般五次方程不能用根式求解。'
  sledge:
    date: '1828-12'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_froland_prize_final_years, abel_mactutor]
    text:
      en: 'At Christmas 1828 Abel travelled by sledge to Froland to visit his fiancée, a governess there, and fell ill on the way. After a ball at Christmas he began to cough up blood, and he lay in bed for twelve weeks under the care of the district doctor.'
      zh: '1828 年圣诞，阿贝尔坐雪橇到弗罗兰看望在那里做家庭教师的未婚妻，路上病倒。圣诞舞会之后他开始咳血，此后在当地医生的照看下卧床十二周。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Christmas 1828: cold and coughing, Abel comes by sledge to Froland to see his fiancée.'
      zh: '1828 年圣诞，阿贝尔受着寒、咳着嗽，坐雪橇到弗罗兰看望未婚妻。'
  last_paper:
    date: '1829-01-06'
    stay_day: 5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_froland_municipal_record, abel_froland_prize_final_years]
    text:
      en: 'On 6 January 1829 at Froland Abel wrote his last mathematical paper, two or three pages setting out the main idea of his Paris memoir.'
      zh: '1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学论文，两三页，写的是巴黎长稿的主要思想。'
    line:
      en: '6 January 1829: in bed at Froland, Abel writes his last paper, two or three pages on the main idea of his Paris memoir.'
      zh: '1829 年 1 月 6 日，阿贝尔在弗罗兰的病床上写下最后一篇论文，两三页，写的是巴黎长稿的主要思想。'
  death:
    date: '1829-04-06'
    stay_day: 95
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_wiki]
    text:
      en: 'Abel died of tuberculosis at Froland at eleven in the forenoon of 6 April 1829, aged twenty six.'
      zh: '1829 年 4 月 6 日上午十一点，阿贝尔在弗罗兰死于肺结核，二十六岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '6 April 1829: Niels Henrik Abel dies at Froland, aged twenty six.'
      zh: '1829 年 4 月 6 日，尼尔斯·亨里克·阿贝尔在弗罗兰去世，二十六岁。'
  berlin:
    date: '1829-04-08'
    stay_day: 97
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [abel_froland_berlin, abel_wiki]
    text:
      en: 'Abel died on 6 April. Crelle wrote from Berlin on 8 April with news of a guaranteed post.'
      zh: '阿贝尔于 4 月 6 日去世。4 月 8 日，克雷勒从柏林写信报告职位已落实。'
    line:
      en: '8 April 1829: not knowing, Crelle writes from Berlin that the post for Abel is secured.'
      zh: '1829 年 4 月 8 日，尚不知情的克雷勒从柏林写信，说替阿贝尔谋的职位已经落实。'
  prize:
    date: '1830'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_froland_prize_final_years]
    text:
      en: 'In 1830 the Paris Academy gave its Grand Prix to Abel, after his death, and to Carl Jacobi.'
      zh: '1830 年，巴黎科学院把大奖授给已故的阿贝尔和卡尔·雅可比。'
    line:
      en: '1830: the Paris Academy gives its Grand Prix to Abel, who is dead, and to Jacobi.'
      zh: '1830 年，巴黎科学院把大奖授给已经去世的阿贝尔和雅可比。'
  memoir:
    date: '1841'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [abel_mactutor, abel_paris_academy_records]
    text:
      en: 'The long memoir Abel had given to the Paris Academy in 1826 was found again in 1830 and printed in 1841.'
      zh: '阿贝尔 1826 年交给巴黎科学院的长稿在 1830 年被找到，1841 年印出。'
    line:
      en: '1841: the memoir Abel gave the Paris Academy is printed at last.'
      zh: '1841 年，阿贝尔交给巴黎科学院的那篇长稿终于印出。'
