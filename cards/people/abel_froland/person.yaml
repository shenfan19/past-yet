    text:
      en:
        name: 'The example and the claim'
        place: "Froland"
        figure: "Niels Henrik Abel"
        story: 'At Christmas 1828 Niels Henrik Abel came by sledge to the ironworks at Froland, cold and coughing, to visit his fiancée, and he lay ill there for twelve weeks. On 6 January 1829 he wrote his last paper, two or three pages restating the main result of the long memoir he had given to the Paris Academy. He died of tuberculosis on 6 April, aged twenty six. Two days later, not knowing, August Leopold Crelle wrote from Berlin that a post for him was secured.'
        relic: "A sealed letter"
        relic_desc: "An unopened offer, tied with a thread."
        points:
          p1: 'Help Abel check his last short proof while he is ill so the paper can be sent'
          p2: 'While the short paper is at hand, tie it to the Paris submission record so anyone searching has a reference'
          p3: 'Through the twelve weeks Abel lies in bed at Froland, keep the cold from his room and ease his cough and his pain'
          p4: 'Ask the friends seeking a post for Abel to send an interim letter so he knows before he dies that they are still trying'
        points_fail:
          p1: 'The paper stops before it can be checked, and the central result of the Paris memoir loses this early public record. The office recalls the employee after a loss of sync.'
          p2: 'People searching for the Paris memoir still have to work through the old intake records with little more than a title.'
          p3: 'Nobody eases the cold and the cough, and in this branch his last weeks at Froland are as hard as they were.'
          p4: 'No word reaches Froland in time. The formal confirmation comes too late.'
        shift:
          p1:
            was: 'On 6 January 1829 at Froland, Abel wrote his last mathematical paper, restating a main result of his Paris memoir.'
          p2:
            was: 'Around 1829 Abel restated the Paris memoir''s central result; the manuscript was hard to locate and did not appear in print until 1841.'
            now: '{staff} links the new paper to the earlier submission date and leaves a reference with each copy, narrowing any later search.'
          p3:
            was: 'At Christmas 1828 Abel travelled by sledge to Froland, cold and coughing, and began to cough up blood; he lay in bed there for twelve weeks.'
            now: '{staff} keeps the stove going and the bed warm, and sits up with him through the worst nights. Abel suffers a little less in his last weeks.'
          p4:
            was: 'Abel died on 6 April 1829. The letter confirming a post in Berlin was written two days later.'
            now: '{staff} asks a contact to report on the efforts already underway. Abel reads that his friends are still working to find him a post.'
            who: abel_froland
            bio: 'Before he died, Abel heard how his Berlin friends were trying to keep an opportunity open for him to continue his research. The formal confirmation still came after his death.'
        vignettes:
          firewood: 'In the coldest days of February {staff} helps the kitchen maid carry firewood upstairs. When the gentleman upstairs coughs all night, she says, she lies downstairs counting, and by morning she has lost count.'
          sledge: 'In January {staff} helps the groom fit a new shaft to the sledge. At Christmas he fetched a gentleman out from town, the groom says, wrapped in three blankets and coughing the whole way; on arrival the man could not lift his own trunk, and the groom carried it up and refused the coin.'
          post: 'In April {staff} helps the clerk of the ironworks sort a bag of post. He turns up a letter with a Berlin mark, holds it to the window a while, and says that this one has come at a bad time, because the man it is for is no longer here.'
      zh:
        name: '一道算得出的五次方程'
        place: "弗罗兰"
        figure: "尼尔斯·亨里克·阿贝尔"
        story: '1828 年圣诞，尼尔斯·亨里克·阿贝尔受着寒、咳着嗽坐雪橇来到弗罗兰铁厂看望未婚妻，此后在那里卧床十二周。1829 年 1 月 6 日，他写下最后一篇论文，两三页，重述他交给巴黎科学院的那篇长稿的要点。4 月 6 日，他死于肺结核，二十六岁。两天后，尚不知情的奥古斯特·利奥波德·克雷勒从柏林来信，说替他谋的职位已经落实。'
        story_prose:
          opening:
            - '1829 年 1 月，挪威南部的弗罗兰铁厂。尼尔斯·亨里克·阿贝尔在未婚妻做家庭教师的那户人家里卧床，咳得厉害。他二十六岁，几年前已经证明一般五次方程不能用根式求解，1826 年交给巴黎科学院的长稿却一直没有下落。'
            - '史实里，他圣诞坐雪橇来时就已受寒，此后在这里卧床十二周，1 月 6 日写下最后一篇两三页的短稿。4 月 6 日他死于肺结核。两天后，克雷勒从柏林来信，说替他谋的职位已经落实。在这条分支里，楼下的厨房女佣整夜听着楼上的咳嗽，铁厂的账房照旧每天分拣邮包。'
            - '这一趟用得上三种人：核得了推导、理得清稿件和收件记录的人，懂护理、守得住病床的人，说得动远方的朋友、肯替他把信催回来的人。'
          outcomes:
            all: '那个冬天，短稿核好寄了出去，同巴黎长稿对上了索引。阿贝尔在暖着的屋里过完最后几周，枕边放着柏林的来信。正式的聘书仍是在他去世后才写成的，他走之前已经知道，那边一直有人在为他奔走。'
            p4: '四月，柏林写来确认职位的信时，阿贝尔已经不在了。三月里那封回信，他在床上读过。'
            p3: '那年冬天，弗罗兰那间屋子的炉火没有断过。阿贝尔的咳嗽没有好，最后几周少受了些罪。'
            p2: '后来有人去巴黎找那篇长稿，短稿上的索引写着交件的年份，查的人从那一年的收件簿翻起。'
            p1: '那篇两三页的短稿寄了出去。巴黎长稿的要点，先有了一份及时的公开记录。'
          none: '这一趟没能替阿贝尔做成什么。弗罗兰的冬天照旧过去，柏林的信照旧晚了两天。'
          desync: '1 月 6 日，那篇短稿停在校对之前，{staff}被召回了。楼上的咳嗽声还在，巴黎长稿的要点也没留下这份记录。'
          not_admitted: '{staff}没能进那户人家的门。楼上的人还在咳，柏林的消息还在路上。'
          points:
            p1: '1 月 6 日，阿贝尔靠在枕头上写那篇短稿，两三页纸摊在被面上。{staff}拿着笔一行一行跟着核推导，前后记号对不上的地方逐处标出来，请他改定。傍晚，稿子誊清了，可以寄出。'
            p2: '短稿还在手边。{staff}把它同巴黎长稿的投递日期对在一处，在两份抄件上各记了一条索引：哪一年交的件，交给了谁，题目叫什么。以后有人去找那篇长稿，不必再从旧收件簿里一页页翻。'
            p3: '一月底最冷的那些夜里，阿贝尔咳得睡不着。{staff}守着炉子添柴，把床铺焐暖，替他垫高枕头、擦汗、喂水，最难熬的几夜一直坐在床边。天亮时屋里还是暖的，他咳完一阵，还能再睡一会儿。'
            p4:
              class_lettered: '{staff}照理来往信件的办法，把柏林那边替他奔走的人和事一条条列清，按人写信，请他们先把进展寄回弗罗兰，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕边。'
              else: '{staff}一封接一封往柏林写信，说他病得重，请替他奔走的朋友先把进展寄来，不必等事情落定。三月里，回信到了。阿贝尔让人把信拿到床前，读了两遍。信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕边。'
          excerpts:
            p4: '信上没有说职位已经定下，只说他们还在争取。他把信折好，放在枕边。'
            p3: '天亮时屋里还是暖的，他咳完一阵，还能再睡一会儿。'
            p2: '以后有人去找那篇长稿，不必再从旧收件簿里一页页翻。'
            p1: '傍晚，稿子誊清了，可以寄出。'
        relic: "一封封着的信"
        relic_desc: "一封没拆开的聘书，用细线系着。"
        points:
          p1: '在阿贝尔病中写最后一篇短稿时，帮他把证明核对到可以寄出'
          p2: '趁短稿还在手边，帮阿贝尔把它同巴黎长稿的投递记录对上，给找稿的人留下索引'
          p3: '阿贝尔在弗罗兰卧床的十二周里，替他挡住屋里的冷，减轻他的咳嗽和病痛'
          p4: '请替阿贝尔奔走的人先寄一封进展信，让他生前知道柏林还有人为他的职位努力'
        points_fail:
          p1: '短稿停在校对之前，巴黎长稿的要点也没有这份及时的公开记录。行程同步失败，员工被召回。'
          p2: '寻找巴黎长稿的人只知道大致题目，仍要从旧收件记录一页页找。'
          p3: '冷和咳嗽没人减轻，这条分支里他在弗罗兰的最后几周和原来一样难熬。'
          p4: '弗罗兰一直等不到柏林的消息，正式的好消息来得太晚。'
        shift:
          p1:
            was: '1829 年 1 月 6 日，阿贝尔在弗罗兰写下最后一篇数学短稿，重述巴黎长稿的主要结果。'
          p2:
            was: '1829 年前后，阿贝尔重述巴黎长稿的要点，原稿一度难寻，直到 1841 年才印行。'
            now: '{staff}把短稿和旧投递日期对在一处，两边各留一份索引。以后查稿的人能凭交件记录缩小范围。'
          p3:
            was: '1828 年圣诞，阿贝尔受着寒、咳着嗽坐雪橇到弗罗兰，随后开始咳血，此后在那里卧床十二周。'
            now: '{staff}守着炉火，把床铺焐暖，最难熬的几夜一直坐在床边。阿贝尔最后几周少受了些罪。'
          p4:
            was: '1829 年 4 月 6 日阿贝尔去世，柏林确认职位的信于两日后写成。'
            now: '{staff}请联系人先把奔走过程写回弗罗兰。阿贝尔读到朋友们正在为他争取职位，知道这件事还有人在做。'
            who: abel_froland
            bio: '阿贝尔去世前收到柏林朋友奔走的进展，知道他们还为他留着继续研究的机会。正式任命仍在他去世之后。'
        vignettes:
          firewood: '二月最冷的那几天，{staff}帮厨房女佣往楼上搬劈柴。柴捆上的雪一路掉在楼梯上。女佣说，楼上那位先生咳一夜，她就在楼下数一夜，数到天亮也没数清。'
          sledge: '一月，{staff}帮马夫给雪橇换一根断了的辕木。马在棚里喷着白气。马夫说圣诞那趟从城里接来一位先生，裹着三层毯子一路咳，下车时连自己的箱子都提不动，是他扛上楼的，赏钱他没要。'
          post: '四月，{staff}帮铁厂的账房先生分拣邮包。桌上的信摞了半尺高，各地的邮戳挤在一起。他翻出一封盖着柏林邮戳的信，对着窗户看了半天，说这一封来得不巧，收信的人已经不在了。'
text:
  en:
    name: Niels Henrik Abel
    text: Norwegian mathematician, 1802 to 1829. He proved that the general equation of the fifth degree cannot be solved with radicals and made early advances in elliptic functions. He died of tuberculosis at twenty six, shortly before his work was recognised.
  zh:
    name: 尼尔斯·亨里克·阿贝尔
    text: 挪威数学家，1802 年生，1829 年去世。他证明了一般五次方程不能用根式求解，并在椭圆函数上取得早期进展。他二十六岁死于肺结核，不久之后他的工作才获得承认。
