    text:
      en:
        name: "A history written after the sentence"
        place: "Chang'an"
        figure: "Sima Qian"
        story: 'The Book of Han preserves Sima Qian''s letter to Ren An, in which he discusses the aims and organization of his historical work.'
        story_prose:
          opening:
            - 'Chang’an, around 98 BC. Sima Qian is imprisoned after speaking for Li Ling. Looking back in his Letter to Ren An, he remembers that his history was only a draft then.'
            - 'In history, the family could not pay to redeem the sentence. He was punished and later finished his history. In this branch someone can look after the loose pages at home and someone is trying to get a petition to the clerk responsible.'
            - 'It takes someone who can identify the drafts, someone who can attend to a prisoner’s ordinary needs, and someone who can bring several households’ promises together into one offer.'
          points:
            p3: '{staff} asks those who want to help to say at the table what they can contribute, then brings the petition and the money to the clerk. The clerk counts it and marks the duplicate received. When Sima Qian comes home a few days later, he lights a lamp first. He undoes the top bundle, lifts a leaf from where its corner was held down, and goes on writing.'
            p2: '{staff} brings food and a change of clothes to the place where deliveries are received and waits while they are counted. Sima Qian opens the bundle and puts the thicker garment across his legs. The food is still warm. He brings the bowl down between his knees and bends to eat.'
            p1: 'His household has cleared the table. {staff} checks the opening lines that show at the ends of the bundles, returns displaced leaves to their places, and asks that the bundles go back in the same order. Before the last bundle is shut, someone turns the label outwards. The next one can be found without moving all the others first.'
          outcomes:
            all: 'The manuscript stays in the house. On returning, Sima Qian can pick up where he left off, and someone waits by the door to refill the lamp.'
            p3: 'The petition is accepted. When someone later calls to offer help, Sima Qian moves the bundle by his elbow to make room for a visitor.'
            p2: 'The thicker garment stays beside him. After the others go, he can wrap it round himself again.'
            p1: 'Before leaving, the person watching the table checks the labels once more. Each bundle is still in its place.'
          none: 'After the people at the door go home, a lamp is still burning at the empty table.'
          not_admitted: '{staff} never meets the clerk accepting deliveries. What they brought remains outside.'
          desync: 'The loose drafts cannot be put back in order. When the office recalls {staff}, only a loosened cord remains on the table.'
          excerpts:
            p3: 'He undoes the top bundle, lifts a leaf from where its corner was held down, and goes on writing.'
            p2: 'The food is still warm. He brings the bowl down between his knees and bends to eat.'
            p1: 'Before the last bundle is shut, someone turns the label outwards. The next one can be found without moving all the others first.'
        relic: "A bundle of bamboo slips"
        relic_desc: "Slips tied with cord, each carrying a column of characters."
        points:
          p1: 'While Sima Qian is in prison, keep the unfinished drafts of his history whole and in order at his home'
          p2: 'Bring food and clothing into the prison and spare him the worst of the jailers'' humiliations'
          p3: 'Ask people who know Sima Qian to contribute and present their offer to the officials before the sentence is carried out'
        points_fail:
          p1: 'The bundles at his home come loose and are scattered, and the drafts are not there when he comes out. This branch falls out of step with history and the office recalls the employee.'
          p2: 'Nobody reaches him in prison, and in this branch he bows his head to the jailers as he later wrote that he did.'
          p3: 'The family is poor and no friend speaks for him. In this branch, as in history, he cannot redeem himself and is castrated.'
        shift:
          p1:
            was: 'In about 98 BC, when Sima Qian was imprisoned after the Li Ling affair, his history was, in his own words, only roughly begun and not yet finished.'
          p2:
            was: 'In about 98 BC Sima Qian was imprisoned for defending Li Ling; in his letter to Ren An he wrote of how he had to abase himself before the jailers.'
            now: 'In this branch {staff} gets food and warm clothing delivered to Sima Qian. He has a meal and something to wrap himself in at night.'
          p3:
            was: 'In about 98 BC Sima Qian was sentenced for defending Li Ling; his family was too poor to redeem the sentence, no friend spoke for him, and he was punished by castration.'
            now: 'In this branch the officials accept the payment offered by the people {staff} brought together. Sima Qian is spared that punishment and can go back to his unfinished work.'
            who: sima_qian_changan
            bio: 'In this timeline Sima Qian redeemed his sentence and was not castrated. He still finished his history of the past down to his own day.'
        vignettes:
          dates: 'The clerk starts to merge two entries under one year. You ask them to leave the dates with their respective accounts. It becomes possible to see exactly where the mismatch begins.'
          witness: 'The clerk wants the better story to go first. You ask how each account got to the desk. They mark the origins before deciding what order a reader should see.'
          binding: 'You leave both slips loose while the clerk reads them once more. When the bundle is tied, a short label says that one question is still open.'
      zh:
        name: "受刑之后写成的史书"
        place: "长安"
        figure: "司马迁"
        story: '《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。'
        story_prose:
          opening:
            - '约公元前 98 年，长安。司马迁替李陵说话后下狱。他后来在《报任安书》里回想起这段日子，记得史稿当时还只是草创。'
            - '史实里，家中无钱自赎，他受了宫刑，后来写成史书。在这条分支里，他家中有人能照管散页，也有人想替他把一封请求送给经办人。'
            - '这趟需要能按篇辨清史稿的人、能照应受困之人的人，以及能把几家人的承诺落实到一份请求上的人。'
          points:
            p3: '{staff}请愿意帮忙的人到桌边逐个说清愿出多少，再把请求与交来的钱一同交到经办人手里。经办人核了数，在副本上写下收讫。过几天司马迁回到家，先点了一盏灯。 他解开最上面那一束，从压着纸角的地方取出一叶，接着往下写。'
            p2: '{staff}把换洗的衣服和饭送到收物的地方，等人点过件数才离开。司马迁打开衣包，先把那件厚的放到腿上。 饭还是温的。他把碗端到膝间，低头吃了一口。'
            p1: '家中人已把桌子腾出来。{staff}顺着每束上露出的首句核对，把临时挪走的几叶找回原位，又嘱咐收起来时照同一顺序。 最后一束合上以前，家里人把题签朝外转过来。伸手去取下一束时，不用先把别的都搬开。'
          outcomes:
            all: '稿子一直留在家里。司马迁回来后能从原处续写，门边还有人等着替他添灯。'
            p3: '请求被收下了。后来有人来家里问他要不要帮忙，他把面前那束往旁边放了放，给来客腾了坐处。'
            p2: '那件厚衣放在他手边。等夜深人散，他还能把它重新裹起来。'
            p1: '把桌子照看下来的人，临走前又检查了一遍题签。每一束该在的地方还在。'
          none: '门边的人散去后，一盏灯还亮在空桌上。'
          not_admitted: '{staff}没能见到收物的经办人。带来的东西还放在门外。'
          desync: '散页没有收齐。事务所召回{staff}时，桌上只剩一根解开的绳。'
          excerpts:
            p3: '他解开最上面那一束，从压着纸角的地方取出一叶，接着往下写。'
            p2: '饭还是温的。他把碗端到膝间，低头吃了一口。'
            p1: '最后一束合上以前，家里人把题签朝外转过来。伸手去取下一束时，不用先把别的都搬开。'
        relic: "一捆竹简"
        relic_desc: "用绳子编起来的竹简，每一片写着一行字。"
        points:
          p1: '司马迁下狱期间，护住他家中尚未写完的史稿，不散不乱'
          p2: '往狱里送饭送衣，让他少受狱吏的折辱'
          p3: '请认识司马迁的人凑一笔钱，趁刑罚还没执行，把他们愿出的钱报给经办官吏'
        points_fail:
          p1: '家中的竹简绳断简散，等他出狱时草稿已不全。这条分支与历史脱节，员工被送回。'
          p2: '没人进得了狱门，这条分支里他照样像后来信里写的那样，见了狱吏便低头叩地。'
          p3: '家里穷，朋友没有一个出面。这条分支里和历史上一样，他无钱自赎，受了宫刑。'
        shift:
          p1:
            was: '约公元前 98 年，司马迁因李陵之事下狱，按他自己的话，书当时只是草创，还没写完。'
          p2:
            was: '约公元前 98 年，司马迁因替李陵辩解下狱，他在《报任安书》里写到自己在狱吏面前受的屈辱。'
            now: '这条分支里，{staff}把饭食和冬衣送到了司马迁手上。夜里他有衣服裹身，也多了一餐热饭。'
          p3:
            was: '约公元前 98 年，司马迁因替李陵辩解获罪，家贫无钱自赎，亲友没有人替他说话，受了宫刑。'
            now: '这条分支里，经办官吏接受了{staff}替众人送交的那笔钱。司马迁免于这次刑罚，可以回去继续写手里的史书。'
            who: sima_qian_changan
            bio: '这条时间线里，司马迁交钱赎罪，没有受宫刑。他照样把从上古写到当代的那部史书写完了。'
        vignettes:
          dates: '书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。'
          witness: '书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。'
          binding: '书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。'
text:
  en:
    name: Sima Qian
    text: Chinese historian of the Han, about 145 BC to about 86 BC. After he defended a general before the emperor he was punished by castration, and he finished the Records of the Grand Historian, a history from legendary times to his own day.
  zh:
    name: 司马迁
    text: 汉代历史学家，约公元前 145 年生，约公元前 86 年去世。他在皇帝面前为一位将军辩护而被处以宫刑，之后完成《史记》，写从传说时代到他当代的历史。
quotes:
  sima_qian_changan_story_echo_full:
    order: 1
    tier: full
    date: '-91'
    checked: official_record
    sources: [sima_qian_changan_story_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Sima Qian'
        quote: 'To examine the relation of Heaven and man, understand the changes from past to present, and make a work of my own.'
        occasion: 'Letter to Ren An, recalling his purpose in writing the history. The letter’s year is disputed.'
      zh:
        who: '司马迁'
        quote: '探究天与人的关系，贯通过去与现在的变化，形成一家之言。'
        occasion: '《报任安书》回顾著史的用意，书信年份有异说。'
      zh-Hant:
        who: '司马迁'
        quote: '究天人之際，通古今之變，成一家之言'
        occasion: '《报任安书》回顾著史的用意，书信年份有异说。'
      fr:
        who: 'Sima Qian'
        quote: 'Examiner la relation entre le Ciel et l''homme, comprendre les changements du passé au présent et créer ma propre œuvre.'
        occasion: 'Lettre à Ren An, rappelant son objectif en écrivant l''histoire. L’année de la lettre est contestée.'
      es:
        who: 'Sima Qian'
        quote: 'Examinar la relación entre el Cielo y el hombre, comprender los cambios del pasado al presente y hacer mi propio trabajo.'
        occasion: 'Carta a Ren An, recordando su propósito al escribir la historia. El año de la carta está en disputa.'
      ja:
        who: '司馬遷'
        quote: '天と人の関係を考察し、過去から現代までの変化を理解し、自分なりの作品を作ること。'
        occasion: '歴史を書いた目的を回想するレン・アンへの手紙。この手紙の発行年については議論がある。'
      ko:
        who: '사마천'
        quote: '하늘과 인간의 관계를 살펴보고, 과거와 현재의 변화를 이해하고 나만의 작품을 만들어 보세요.'
        occasion: '역사를 쓴 목적을 회상하는 런안(Ren An)에게 보낸 편지. 편지의 연도에 대해 이의가 있습니다.'
      ru:
        who: 'Сыма Цянь'
        quote: 'Чтобы изучить отношения Неба и человека, понять изменения от прошлого к настоящему и сделать свою собственную работу.'
        occasion: 'Письмо Рен Ану с напоминанием о цели написания истории. Год письма оспаривается.'
  sima_qian_changan_story_echo_none:
    order: 2
    tier: none
    date: '-91'
    checked: official_record
    sources: [sima_qian_changan_story_echo_source_none]
    original: zh-Hant
    text:
      en:
        who: 'Sima Qian'
        quote: 'I had begun the draft but not finished it when this calamity came.'
        occasion: 'Letter to Ren An, recalling the unfinished draft at the time of his imprisonment.'
      zh:
        who: '司马迁'
        quote: '我刚草创，还未写完，就遇上这场祸事。'
        occasion: '《报任安书》回顾下狱时尚未写完的史稿。'
      zh-Hant:
        who: '司马迁'
        quote: '草創未就，適會此禍'
        occasion: '《报任安书》回顾下狱时尚未写完的史稿。'
      fr:
        who: 'Sima Qian'
        quote: 'J''avais commencé le projet mais je ne l''avais pas terminé lorsque cette calamité est arrivée.'
        occasion: 'Lettre à Ren An, rappelant le brouillon inachevé au moment de son emprisonnement.'
      es:
        who: 'Sima Qian'
        quote: 'Había comenzado el borrador pero no lo terminé cuando llegó esta calamidad.'
        occasion: 'Carta a Ren An, recordando el borrador inconcluso en el momento de su encarcelamiento.'
      ja:
        who: '司馬遷'
        quote: '私は草案を書き始めていたが、この災難が来たときまだ書き終えていない。'
        occasion: 'レン・アンへの手紙、投獄当時の未完の草案を回想。'
      ko:
        who: '사마천'
        quote: '나는 초안 작성을 시작했지만 이 재난이 닥쳤을 때 끝내지 못했습니다.'
        occasion: '투옥 당시 미완성 초안을 회상하는 런안(Ren An)에게 보낸 편지.'
      ru:
        who: 'Сыма Цянь'
        quote: 'Я начал черновик, но не закончил его, когда пришло это бедствие.'
        occasion: 'Письмо Рен Ану с напоминанием о незаконченном черновике на момент его заключения.'
  simaqian:
