    text:
      en:
        name: "A history written after the sentence"
        place: "Chang'an"
        figure: "Sima Qian"
        story: 'The Book of Han preserves Sima Qian''s letter to Ren An, in which he discusses the aims and organization of his historical work.'
        relic: "A bundle of bamboo slips"
        relic_desc: "Slips tied with cord, each carrying a column of characters."
        points:
          p1: 'While Sima Qian is in prison, keep the unfinished drafts of his history whole and in order at his home'
          p2: 'Bring food and clothing into the prison and spare him the worst of the jailers'' humiliations'
          p3: 'Raise the money that the law allows to redeem his sentence, so that Sima Qian is spared the punishment of castration'
        points_fail:
          p1: 'The bundles at his home come loose and are scattered, and the drafts are not there when he comes out. This branch falls out of step with history and the office recalls the employee.'
          p2: 'Nobody reaches him in prison, and in this branch he bows his head to the jailers as he later wrote that he did.'
          p3: 'The family is poor and no friend speaks for him. In this branch, as in history, he cannot redeem himself and is castrated.'
        shift:
          p1:
            was: 'In about 98 BC, when Sima Qian was imprisoned after the Li Ling affair, his history was, in his own words, only roughly begun and not yet finished.'
          p2:
            was: 'In about 98 BC Sima Qian was imprisoned for defending Li Ling; in his letter to Ren An he wrote of how he had to abase himself before the jailers.'
            now: '{staff} brings him food and warm clothing and pays the gatekeepers to leave him alone. He passes the months in prison in somewhat less shame.'
          p3:
            was: 'In about 98 BC Sima Qian was sentenced for defending Li Ling; his family was too poor to redeem the sentence, no friend spoke for him, and he was punished by castration.'
            now: '{staff} raises the redemption money from merchants and old acquaintances and it is paid before the sentence is carried out. Sima Qian leaves prison unharmed in body. He goes home to the bamboo slips and finishes the history.'
            who: sima_qian_changan
            bio: 'In this timeline Sima Qian redeemed his sentence and was not castrated. He still finished his history of the past down to his own day.'
        vignettes:
          dates: 'The clerk starts to merge two entries under one year. You ask them to leave the dates with their respective accounts. It becomes possible to see exactly where the mismatch begins.'
          witness: 'The clerk wants the better story to go first. You ask how each account got to the desk. They mark the origins before deciding what order a reader should see.'
          binding: 'You leave both slips loose while the clerk reads them once more. When the bundle is tied, a short label says that one question is still open.'
      zh:
        name: "受刑之后写成的史书"
        place: "长安"
        figure: "司马迁"
        story: '《汉书·司马迁传》保存《报任安书》，信中谈到著史的用意和全书体例。'
        relic: "一捆竹简"
        relic_desc: "用绳子编起来的竹简，每一片写着一行字。"
        points:
          p1: '司马迁下狱期间，护住他家中尚未写完的史稿，不散不乱'
          p2: '往狱里送饭送衣，让他少受狱吏的折辱'
          p3: '凑足依律赎罪的钱，让司马迁免受宫刑'
        points_fail:
          p1: '家中的竹简绳断简散，等他出狱时草稿已不全。这条分支与历史脱节，员工被送回。'
          p2: '没人进得了狱门，这条分支里他照样像后来信里写的那样，见了狱吏便低头叩地。'
          p3: '家里穷，朋友没有一个出面。这条分支里和历史上一样，他无钱自赎，受了宫刑。'
        shift:
          p1:
            was: '约公元前 98 年，司马迁因李陵之事下狱，按他自己的话，书当时只是草创，还没写完。'
          p2:
            was: '约公元前 98 年，司马迁因替李陵辩解下狱，他在《报任安书》里写到自己在狱吏面前受的屈辱。'
            now: '{staff} 往狱里送去饭食和冬衣，又打点了看守。他在狱中的几个月少受了些屈辱。'
          p3:
            was: '约公元前 98 年，司马迁因替李陵辩解获罪，家贫无钱自赎，亲友没有人替他说话，受了宫刑。'
            now: '{staff} 向商人和旧识四处凑钱，赶在行刑前交上了赎金。司马迁出狱时身体完好。他回到家中的竹简前，把书写完。'
            who: sima_qian_changan
            bio: '这条时间线里，司马迁交钱赎罪，没有受宫刑。他照样把从上古写到当代的那部史书写完了。'
        vignettes:
          dates: '书吏要把两条合到同一年。你请他各留原来的年次。重新看过，分歧从哪里开始便看得清。'
          witness: '书吏想把好听些的故事放在前头。你问两个说法各是怎样到桌上的。他先写明来处，再想该让读者先读哪条。'
          binding: '书吏再读一遍时，你先不系那两枚简。收成一束以后，短签上写清还有一个问题待查。'
text:
  en:
    name: Sima Qian
    text: Chinese historian of the Han, about 145 BC to about 86 BC. After he defended a general before the emperor he was punished by castration, and he finished the Records of the Grand Historian, a history from legendary times to his own day.
  zh:
    name: 司马迁
    text: 汉代历史学家，约公元前 145 年生，约公元前 86 年去世。他在皇帝面前为一位将军辩护而被处以宫刑，之后完成《史记》，写从传说时代到他当代的历史。
quotes:
  simaqian:
    order: 9
    text:
      en: {who: Sima Qian, quote: "To examine the relation between heaven and man, to trace the changes from antiquity to the present, and to complete a school of one's own."}
      zh: {who: 司马迁, quote: "究天人之际，通古今之变，成一家之言。"}
