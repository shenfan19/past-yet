    text:
      en:
        name: 'Look up the refrain'
        place: "Delhi"
        figure: "Mirza Ghalib"
        story: 'By the time of this Delhi visit, Ghalib’s Urdu divan had already been printed in 1841. Its ghazals can be browsed by their rhyme and refrain endings.'
        story_prose:
          opening:
            - 'Someone walks into a Delhi bookshop reciting as much of a poem as they remember, all the way to its last word. The bookseller asks you to listen once more and write down the rhyme and refrain. He will take the slip to the printed book.'
            - 'Ghalib’s Urdu divan was already in print. The king commissioned him to write a history of the Timurids. The first part appeared and the projected second volume remained unfinished. You can put the papers for the later reigns in order so he has somewhere to begin after delivering the first book.'
            - 'Send someone who can match variant names to dates. A reader who knows both kinds of writing can also identify where the history quotes verse.'
          points:
            p1: 'Ghalib pulls a sheet from the pile and asks you to read its last line. The page looks like history until the sentence runs into a line of verse in the margin. You put the quotation’s source on its wrapper and give the papers that follow Humayun their own gathering. Ghalib turns to the first blank page and writes the opening line of a second volume.'
          outcomes:
            all: 'When the first book goes out, the next gathering is already beside it. There is a beginning when you leave, and plenty of space below it.'
            p1: 'The later reigns now have a gathering of their own. Ghalib can begin the draft and the pages to come are his to write.'
          none: 'The bookseller finds the ghazal by following the slip. The papers for the later reigns stay in their pile, and no completed sequel follows the first volume.'
          not_admitted: 'The slip reaches the shop, where nobody recognises its bearer. The papers remain under a half-open account book.'
          excerpts:
            p1: 'Ghalib turns to the first blank page and writes the opening line of a second volume.'
        relic: "A page of ghazals"
        relic_desc: "A page of Urdu verse in his own hand, with corrections."
        points:
          p1: 'Help him gather and sort the sources for the second half of the Timurid history the king has asked of him, so that he carries the work on past its first part'
        points_fail:
          p1: 'The first volume is finished. In this branch as in history, the plan for the second does not become a finished manuscript.'
        shift:
          p1:
            was: 'On 4 July 1850 Bahadur Shah engaged Ghalib to write a history of the Timurid house; the first part, Mehr-e nimroz, came out in 1854 or 1855 and ends with the death of Humayun, and the sequel he planned was never written.'
            now: 'Ghalib has a separate set of source notes for the later reigns. After turning in the first volume, he has enough material at hand to start the second.'
            who: ghalib_delhi
            bio: 'In this branch Ghalib begins a draft of the second volume after the first is delivered.'
        vignettes:
          refrain: 'The bookseller remembers the image in the verse and keeps looking for it in the wrong place. You ask for the words he heard repeated. He gives you the ending, and you find the right group in the printed book. You write one page reference. Who first brought the verse into the shop is still a mystery to him.'
          future: 'You tell the bookseller that later readers will compare several editions. He asks if that will help him find the line he needs today. You add the edition year to his slip, then mark the ending. You leave before he can check it against another copy.'
          listen: 'You repeat the ending to the bookseller until the two of you agree on what you heard. He tucks the slip into the right part of his book. You can bring those few words back. The rest of the verse has already slipped away from you.'
      zh:
        name: '先听见韵脚，再去翻诗集'
        place: "德里"
        figure: "迦利布"
        story: '这趟去德里时，迦利布的乌尔都语诗集已于 1841 年刊印。读者可以按加扎勒的韵脚、叠句结尾来翻找。'
        story_prose:
          opening:
            - '德里书铺里，有人一路念着听过的诗来找刊本，只记得尾字。卖书人请你再听一回，把听清的韵脚和叠句写到一张纸上。他要拿着纸条去翻书。'
            - '史实里，迦利布的乌尔都语诗集已有刊本。他受托编写帖木儿王朝史，第一卷刊行，续卷没有写成。这次能帮他把后几朝的材料单独排好，让他交卷以后可以接着写。'
            - '擅长对照异名和年代的员工可以按朝次分纸。懂不同文体的人还可以帮忙识别哪一页是引诗，哪一页才是本朝记录。'
          points:
            p1: '迦利布从纸堆里抽出一张，叫你读末行。那页看着像一段史文，末行却跟页边抄的韵句相连。你把引用出处写在包纸上，从待排序的几页里抽走它，再把胡马雍之后的材料另立一册。迦利布试翻到空白处，写下了续卷的第一行。'
          outcomes:
            all: '等第一卷交出去，旁边已有一册能接上去的纸。你走的时候，第二卷开了头，下面还空着许多页。'
            p1: '后几朝的资料有了自己的册子。迦利布可以继续起草，往后的篇章仍要由他一页页写。'
          none: '卖书人照纸条找到了诗句。续卷的材料仍积在原来的纸堆里，刊行的第一卷之后没有完稿。'
          not_admitted: '纸条送进书铺，店里无人识得来客。半开的账册下面，还压着那几张没交出的材料。'
          excerpts:
            p1: '迦利布试翻到空白处，写下了续卷的第一行。'
        relic: "一页格扎勒诗稿"
        relic_desc: "一页他亲笔写的乌尔都语诗，有修改的痕迹。"
        points:
          p1: '帮他把国王托付的帖木儿王朝史后半部的材料收齐理好，让他写完上半部以后接着写下去'
        points_fail:
          p1: '第一卷仍然写成。原先计划的第二卷照史实没有留下完稿。'
        shift:
          p1:
            was: '1850 年 7 月 4 日，巴哈杜尔·沙请迦利布撰写帖木儿王朝史；上半部《正午的太阳》1854 至 1855 年间刊行，写到胡马雍去世为止，他计划中的续篇没有写成。'
            now: '后几朝的材料在迦利布手里单独成册。交了第一卷以后，他能拿出这一册，开始起草第二卷。'
            who: ghalib_delhi
            bio: '这条分支里，迦利布交了第一卷以后，接着起草了第二卷。'
        vignettes:
          refrain: '卖书人记得诗里的意象，却一直翻错地方。你问他反复听到的是什么词。他念出结尾，你才在刊本里翻到对应的一组。你记下一个页码。最早把这一句念进店里的人是谁，他仍说不上来。'
          future: '你告诉卖书人，以后的读者会把几个版本摆在一起对。他问那能不能帮他找到今天这一句。你在他的条子上补了版本年份，又标出结尾。等他有另一本可核对时，你已经走了。'
          listen: '你把结尾念给卖书人听，念到两个人都认得。他把条子夹进书里对应的一段。你能带回记得住的那几个字，整句却已经有些想不起来了。'
text:
  en:
    name: Mirza Ghalib
    text: Poet of Delhi, 1797 to 1869, who wrote in Urdu and Persian. His ghazals are among the best loved in the language. He lived through the revolt of 1857 and spent his later years in debt.
  zh:
    name: 迦利布
    text: 德里诗人，1797 年生，1869 年去世，用乌尔都语和波斯语写作。他的加扎勒诗是这门语言中最受喜爱的作品之一。他经历了 1857 年的起义，晚年债务缠身。
hook: {en: 'Which refrain tells you where to look?', zh: '哪一个韵脚能找到诗？'}
facts:
  history:
    date: '1855'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ghalib_delhi_history]
    text:
      en: 'Ghalib’s letter to Nabi Baksh Haqir says that he delivered the first volume and intended to write the second. The first was published and the planned second volume was not finished.'
      zh: '迦利布给纳比·巴赫什·哈基尔的来信说，他已经交付第一卷，打算继续写第二卷。第一卷后来刊行，计划中的第二卷没有写完。'
  divan:
    date: '1841'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ghalib_delhi_divan]
    text:
      en: 'The 1841 printed edition is preserved in facsimile, indexed here by the endings of ghazals and by other forms.'
      zh: '此处提供 1841 年刊本影印，按加扎勒的结尾以及其他诗体编排索引。'
