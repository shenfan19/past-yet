    text:
      en:
        name: Doubt as a method
        place: Leiden
        figure: René Descartes
        story: 'The 1637 Leiden edition of Descartes''s Discourse on the Method appeared with three essays, on optics, meteorology and geometry.'
        relic: A folded cogito note
        relic_desc: A slip with a single sentence about thinking and being.
        points:
          p1: 'Check the last proofs of the Discourse and its three essays at the Leiden press so all four parts can appear together'
          p2: 'Use Descartes’s errata to check the text against the figures. Enter late changes in the retained proof'
        points_fail:
          p1: 'Several figures are still missing from an essay. The printer has to split the volume, and the office recalls the employee.'
          p2: 'The first proof has gone out. Late errata survive as a slip without page numbers.'
        shift:
          p1:
            was: 'In 1637 Jan Maire printed the Discourse in Leiden with essays on optics, meteorology and geometry.'
          p2:
            was: 'In early June 1637, in a letter two days before printing ended, Descartes mentioned a packet of errata.'
            now: 'The printer logs late corrections by page. A query about how the text matches a figure can be traced to that copy.'
            who: descartes_leiden
            bio: 'The first edition of 1637 went out with the corrections Descartes sent, and readers found the figures and the text in agreement.'
        vignettes:
          parts: 'The reader is stuck on the whole problem. You mark a smaller one that can be settled first. They finish that part before opening the page with the answer.'
          claim: 'A second reader calls the result obvious. You ask them to name the step that makes it so. They reread the middle of the example, where neither of them had stopped before.'
          contents: 'You keep the method open beside one of its examples. The reader moves the paper marker from the rule they liked to the page where they can see it being used.'
      zh:
        name: 把怀疑当作方法
        place: 莱顿
        figure: 笛卡尔
        story: '笛卡尔的《谈谈方法》1637 年在莱顿刊行，随附光学、气象和几何三篇论文。'
        relic: 一张折起来的小纸条
        relic_desc: 纸条上只有一句话，讲思考与存在。
        points:
          p1: '给莱顿印坊核齐正文和三篇附论的末次校样，护住四部分能一起刊行'
          p2: '照笛卡尔寄出的勘误单逐项查图和正文，把晚到的更正也标进留底本'
        points_fail:
          p1: '印坊发现一篇附论的几张图还缺着，整卷只能拆开处理，事务所因同步失败召回员工。'
          p2: '首轮校样已交，晚到勘误只剩一张没有页码的便条。'
        shift:
          p1:
            was: '1637 年，莱顿的扬·迈尔印行《方法论》，书中合刊光学、气象及几何三篇附论。'
          p2:
            was: '1637 年 6 月初，笛卡尔在付印完成前两天的信里提到一包勘误。'
            now: '印坊把晚到的勘误按页登记，日后问到图和正文如何相对，可以翻出同一位置。'
            who: descartes_leiden
            bio: '笛卡尔 1637 年的初版带着他寄去的勘误一起印出，读者手里的图和正文对得上。'
        vignettes:
          parts: '读者卡在整道题里。你标出能先解决的一小问。他先做完这一部分，才翻到写答案的那页。'
          claim: '另一位读者说结果显而易见。你请他指出究竟是哪一步让结果这样明白。他们重读例子中段，两人之前都没在这里停过。'
          contents: '你把讲方法的一页同例题一起翻开。读者把纸签从自己喜欢的那条规则，移到了能看见它如何使用的一页。'
text:
  en:
    name: René Descartes
    text: French philosopher and mathematician, 1596 to 1650, who lived much of his life in the Dutch Republic. His 1637 Discourse on Method contains the phrase I think, therefore I am, and its appendix on geometry introduced coordinates.
  zh:
    name: 笛卡尔
    text: 法国哲学家与数学家，1596 年生，1650 年去世，一生大部分时间住在荷兰共和国。1637 年的《方法谈》含有“我思故我在”，附录中的几何学引入了坐标。
