text:
  en:
    name: Doubt as a method
    place: Leiden
    figure: René Descartes
    story: Descartes publishes the Discourse on the Method, starting from doubting everything and building up again.
    relic: A folded cogito note
    relic_desc: A slip with a single sentence about thinking and being.
    points:
      p1: "Follow the first step of doubt"
      p2: "Argue with theologians without being misunderstood"
      p3: "Talk in the room until late at night"
  zh:
    name: 把怀疑当作方法
    place: 莱顿
    figure: 笛卡尔
    story: 笛卡尔发表《谈谈方法》，从怀疑一切出发，再一步步重新搭起来。
    relic: 一张折起来的小纸条
    relic_desc: 纸条上只有一句话，讲思考与存在。
    points:
      p1: "跟上第一步的怀疑"
      p2: "同神学家辩论而不被误会"
      p3: "在房间里讨论到深夜"
