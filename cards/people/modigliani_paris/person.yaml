quotes:
  modigliani_art_echo:
    order: 1
    tier: full
    date: '1901'
    checked: official_record
    sources: [modigliani_ghiglia_menarini]
    original: it
    text:
      en: {who: 'Amedeo Modigliani', quote: 'I am trying to express as clearly as I can the truths about art and life that I gathered amid the beauties of Rome.', occasion: 'Letter to the painter Oscar Ghiglia, on what he found in Rome · Game translation'}
      zh: {who: '阿梅迪奥·莫迪利亚尼', quote: '我试着尽可能清楚地写出那些散在罗马美景之中、被我拾起的关于艺术与生活的真理。', occasion: '致画家奥斯卡·吉利亚，谈在罗马的所得 · 游戏译文'}
      it: {who: 'Amedeo Modigliani', quote: 'Cerco di formulare con la maggior lucidità le verità sull’arte e sulla vita che ho raccolto sparse nelle bellezze di Roma', occasion: 'Lettera al pittore Oscar Ghiglia, su Roma'}
  modigliani_joy_echo:
    order: 2
    tier: none
    date: '1901'
    checked: official_record
    sources: [modigliani_ghiglia_arte, modigliani_ghiglia_lam]
