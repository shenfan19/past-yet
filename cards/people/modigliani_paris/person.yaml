    text:
      en:
        name: 'A label behind the portrait'
        place: "Paris"
        figure: "Amedeo Modigliani"
        story: 'The Metropolitan Museum of Art catalogues a 1919 oil portrait of Jeanne Hébuterne by Amedeo Modigliani.'
        relic: "A charcoal stick"
        relic_desc: "A stub of charcoal black to the fingers."
        points:
          p1: 'List the late paintings left in Modigliani’s Paris studio separately and give Zborowski a receipt he can check'
          p2: 'Ask people from the studio to check sitters’ names and working titles separately, leaving unconfirmed cases open'
          p3: 'Have Zborowski and potential lenders keep copies of the exhibition and return records. Discuss a small display first'
        points_fail:
          p1: 'Unmarked work leaves the studio during the clearing. Several pieces cannot be located for later display, and the office recalls the employee.'
          p2: 'Similar labels are treated as the same person. Later witnesses cannot tell which painting they are being asked about.'
          p3: 'Loan requests rely on what friends remember, and lenders receive no confirmation of the owner or return date.'
        shift:
          p1:
            was: 'Modigliani died in January 1920. Zborowski subsequently handled work from his estate and organized exhibitions.'
          p2:
            was: 'He often painted people he knew. Collection research continues to compare the pictures and records to identify some sitters.'
            now: 'The dealer keeps a list of identifications already verified. A new identification can be recorded with its evidence.'
          p3:
            was: 'Zborowski arranged Paris exhibitions in 1920. The artist had had few opportunities to exhibit during his life.'
            now: 'A small list of loans is agreed earlier. Owners can see the return arrangements, and the venue can check how long the works are available.'
            who: modigliani_paris
            bio: 'Modigliani spent part of his last years painting portraits of people he knew in Paris. Dealers, collectors and exhibitions continued to circulate the work after his death.'
        vignettes:
          line: 'You recognise the angle of the head before the painting has been fully uncovered. The attendant compares it with your thumbnail sketch and moves one label to the other pile. You keep the pencil line. By the time there is room to see the whole face, the canvas has been covered again.'
          reverse: 'The labels come loose when the frames are set down. You copy one distinctive line from each portrait before the attendant covers them. Now both labels can be put back. An earlier owner’s handwriting stays unidentified.'
          cloth: 'The cloth catches on the edge of a frame. You hold it while the attendant presses the loose label flat. You copy the name before the cloth goes down. You have the right painting in your notes, but only a glimpse of its face.'
      zh:
        name: '肖像背后的一张纸签'
        place: "巴黎"
        figure: "阿梅迪奥·莫迪利亚尼"
        story: '大都会艺术博物馆藏有莫迪利亚尼于 1919 年所画的让娜·埃比泰纳油画肖像。'
        relic: "一截炭条"
        relic_desc: "一截能把手指染黑的炭条。"
        points:
          p1: '把莫迪利亚尼最后留在巴黎工房的几幅画分开核点，给经手的兹博罗夫斯基交一份可查的单'
          p2: '在交接时请画家身边的人分别核认坐画者和作品暂名，给仍不能肯定的情况留空'
          p3: '给兹博罗夫斯基和愿出借画的人各留一份展品的资料和可归还的记录，先讨论小规模展出'
        points_fail:
          p1: '工房清理时有人拿走没有标名的画。经手人拿不到后续可展出的几件，事务所召回员工。'
          p2: '几个相近的称谓混成了一个人。采访到熟人时已不知道该用哪幅画去问。'
          p3: '邀请借画只能凭熟人转述，出借者迟迟等不到物主和归还期的说明。'
        shift:
          p1:
            was: '莫迪利亚尼 1920 年 1 月去世，画商兹博罗夫斯基之后经手其遗作并继续安排展览。'
          p2:
            was: '他晚年主要画身边的人。馆藏研究仍需依据作品和记录核对部分画中的人物。'
            now: '画商留了一张标明哪些身份已核实的表。新认出一幅时可以另补证据。'
          p3:
            was: '兹博罗夫斯基安排了 1920 年巴黎的多次展出。此前画家的展览机会有限。'
            now: '小范围的出借清单提前准备好，各物主能查到如何取回自己的画，展场也有一份写明可借期限的清单。'
            who: modigliani_paris
            bio: '莫迪利亚尼晚年在巴黎画身边熟人的肖像。作品在他去世后经画商、藏家和展场继续流传。'
        vignettes:
          line: '画布还没完全揭开，你先认出了头偏向的角度。帮工对着你的小草图，把一张纸签挪到另一摞。你把那道铅笔线留在本子上。等你腾出位置好看整张脸，画又被蒙上了。'
          reverse: '画框刚放下，两张纸签就掉了。你趁帮工还没蒙布，各描一道最容易认出的线。这下两张签都能放回原处。纸角有一行前人写的字，仍不知是谁的笔迹。'
          cloth: '蒙布挂在框边。你扶着布，帮工把松掉的签压平。布落下前，你把名字抄好。记下的是对的那幅画，脸却只来得及看一眼。'
text:
  en:
    name: Amedeo Modigliani
    text: Italian painter and sculptor, 1884 to 1920, who worked in Paris. He painted portraits and nudes with long necks and almond eyes, sold little during his life, and died of tubercular meningitis at thirty five.
  zh:
    name: 阿梅迪奥·莫迪利亚尼
    text: 意大利画家与雕塑家，1884 年生，1920 年去世，在巴黎工作。他画脖子细长、眼睛如杏仁的肖像和裸体，生前卖得很少，三十五岁死于结核性脑膜炎。
