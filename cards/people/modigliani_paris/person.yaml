    text:
      en:
        name: 'A label behind the portrait'
        place: "Paris"
        figure: "Amedeo Modigliani"
        story: 'At the end of May 1919 Amedeo Modigliani and Jeanne Hébuterne came back to Paris from Nice, with the daughter born the November before. His tuberculosis was getting worse, and by the autumn he no longer had the strength to paint. On 24 January 1920 he died of tuberculous meningitis at the Charité hospital in Paris, aged thirty five. Two days later Jeanne, eight months pregnant, died at her parents'' home. His fellow painters collected the money for his funeral on 27 January. In his lifetime he had held one solo exhibition, and sold nothing from it.'
        relic: "A charcoal stick"
        relic_desc: "A stub of charcoal black to the fingers."
        points:
          p1: 'While he is still clear-headed, let him know that the people he painted will be remembered by many'
          p2: 'When he lies ill in the studio and nobody has called for days, make sure he is taken to the Charité hospital'
          p3: 'At the Charité, cure his tuberculous meningitis'
          p4: 'In the days after his death, stay with Jeanne Hébuterne, eight months pregnant, so that she and the child live'
        points_fail:
          p1: 'In this branch he has had one solo exhibition, at which nothing sold, and nobody has told him what comes later.'
          p2: 'In this branch nobody comes through the door in time and he is not taken to the Charité. The branch falls out of step with history and the office recalls the employee.'
          p3: 'In this branch the illness runs as it did. He dies at the Charité on 24 January, aged 35.'
          p4: 'In this branch 26 January happens as it did. Jeanne and the child she is carrying do not live.'
        shift:
          p1:
            was: 'In 1917 the nudes were taken down from Modigliani''s only solo exhibition in his lifetime after the police intervened, and not one painting sold. He died destitute.'
            now: '{staff} tells him, before he falls ill, that the people he painted will hang in museums around the world.'
          p2:
            was: 'In January 1920 Modigliani, gravely ill, was taken to the Charité hospital in Paris, where he died on 24 January.'
          p3:
            was: 'On 24 January 1920 Modigliani died of tuberculous meningitis at the Charité hospital in Paris, aged 35.'
            now: '{staff} brings a medicine that cures him. He leaves the hospital and goes back to the studio.'
            who: modigliani_paris
            bio: 'Modigliani recovered in the winter of 1920 and painted for many more years, still painting the people around him.'
          p4:
            was: 'On 26 January 1920, two days after Modigliani''s death, Jeanne Hébuterne, eight months pregnant, died at her parents'' home, leaving a daughter of fourteen months.'
            now: '{staff} stays at her side through those days. In this timeline Jeanne gives birth to the child, raises her son and daughter, and later takes up painting again.'
            who: jeanne_hebuterne
            bio: 'Jeanne Hébuterne lived through the winter of 1920, gave birth to her second child, raised both children and went on painting.'
        vignettes:
          coal: 'On 10 January {staff} carries a sack of coal up the stairs for the coal man of the street, who sells wood, coal and wine from the same counter. He says this winter nobody in Montparnasse buys a whole sack; they buy half, and pay for the other half in promises.'
          saucers: 'Early in February {staff} helps a waiter in a Montparnasse café clear the tables. Each drink comes on its own saucer and the bill is counted from the stack. He points at the back table: the painters build towers of saucers there, and pay in drawings when the money runs out.'
          mimosa: 'In early March {staff} helps a flower seller at the market untie the first bunches of mimosa. She says they came up from the south on the night train, and in a cold March they are the only yellow in Paris.'
      zh:
        name: '肖像背后的一张纸签'
        place: "巴黎"
        figure: "阿梅迪奥·莫迪利亚尼"
        story: '1919 年 5 月底，阿梅迪奥·莫迪利亚尼和让娜·埃比泰纳带着前一年 11 月出生的女儿，从尼斯回到巴黎。他的结核越来越重，到秋天已没有力气作画。1920 年 1 月 24 日，他因结核性脑膜炎在巴黎慈善医院去世，三十五岁。两天后，怀孕八个月的让娜在父母家去世。1 月 27 日的葬礼，是画家朋友们凑钱办成的。他生前只办过一次个展，一幅也没卖出。'
        relic: "一截炭条"
        relic_desc: "一截能把手指染黑的炭条。"
        points:
          p1: '趁他还清醒，让他知道他画的这些人以后会被很多人记住'
          p2: '他在画室里病重、几天没人来问的时候，护住他被送进慈善医院的那一程'
          p3: '在慈善医院里，治好他的结核性脑膜炎'
          p4: '他去世以后的那几天，陪住怀孕八个月的让娜·埃比泰纳，让她和腹中的孩子留下来'
        points_fail:
          p1: '这条分支里，他到最后只办过一次个展，那次一幅也没卖出，没有人告诉过他以后的事。'
          p2: '这条分支里没有人及时进门，他没能被送到慈善医院，与史实脱节，事务所召回员工。'
          p3: '这条分支里病照旧发展，1 月 24 日他在慈善医院去世，三十五岁。'
          p4: '这条分支里，1 月 26 日照史实发生，让娜和腹中的孩子没有留下来。'
        shift:
          p1:
            was: '1917 年，莫迪利亚尼生前唯一的个展因警方干涉撤下了裸体画，一幅也没卖出；他去世时一贫如洗。'
            now: '{staff}在他病倒以前告诉他，他画的这些人以后会挂进世界各地的美术馆。'
          p2:
            was: '1920 年 1 月，莫迪利亚尼病重，被送进巴黎慈善医院，1 月 24 日在那里去世。'
          p3:
            was: '1920 年 1 月 24 日，莫迪利亚尼因结核性脑膜炎在巴黎慈善医院去世，三十五岁。'
            now: '{staff}带去的药治好了他的病，他出了院，回到画室。'
            who: modigliani_paris
            bio: '莫迪利亚尼在 1920 年冬天病愈，又画了许多年，画的仍是身边的人。'
          p4:
            was: '1920 年 1 月 26 日，莫迪利亚尼去世两天后，怀孕八个月的让娜·埃比泰纳在父母家中去世，留下十四个月大的女儿。'
            now: '{staff}那几天一直守在她身边。这条时间线里，让娜生下了孩子，带着一儿一女长大，后来又拿起了画笔。'
            who: jeanne_hebuterne
            bio: '让娜·埃比泰纳在 1920 年冬天活了下来，生下第二个孩子，带大两个孩子，并继续画画。'
        vignettes:
          coal: '1 月 10 日，{staff}替街口卖煤的人把一袋煤扛上楼。他的铺子里柴、煤、酒在同一个柜台上卖。他说今年冬天蒙帕纳斯没人买整袋，都买半袋，另外半袋拿口头答应来付。'
          saucers: '二月初，{staff}帮蒙帕纳斯一家咖啡馆的伙计收桌子。每上一杯就垫一只小碟，结账时数碟子。他朝最里头那张桌努努嘴：画家们在那儿把碟子摞成塔，钱用完了就拿画来抵。'
          mimosa: '三月初，{staff}帮市场上卖花的女人解开头一批含羞草。她说这是夜车从南边运上来的，三月要是冷，巴黎就只有这一点黄。'
text:
  en:
    name: Amedeo Modigliani
    text: Italian painter and sculptor, 1884 to 1920, who worked in Paris. He painted portraits and nudes with long necks and almond eyes, sold little during his life, and died of tubercular meningitis at thirty five.
  zh:
    name: 阿梅迪奥·莫迪利亚尼
    text: 意大利画家与雕塑家，1884 年生，1920 年去世，在巴黎工作。他画脖子细长、眼睛如杏仁的肖像和裸体，生前卖得很少，三十五岁死于结核性脑膜炎。
hook: {en: 'One solo show, and nothing sold', zh: '生前一次个展，一幅没卖出'}
facts:
  exhibition:
    date: '1917'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, modigliani_wiki]
    text:
      en: 'In 1917 Modigliani showed some twenty nudes at a gallery in Paris, his only solo exhibition in his lifetime. A nude in the window caused a scandal; when the police threatened to confiscate the pictures, the nudes were taken down. Not one picture sold.'
      zh: '1917 年，莫迪利亚尼在巴黎一家画廊展出约二十幅裸体画，这是他生前唯一一次个展。橱窗里的一幅裸体画引起风波，警方要没收画作，裸体画被撤下。一幅也没有卖出。'
    line:
      en: '1917: Modigliani''s only solo exhibition; the police step in, the nudes are taken down, and nothing sells.'
      zh: '1917 年，莫迪利亚尼办了生前唯一一次个展，警方插手，裸体画撤下，一幅也没卖出。'
  daughter:
    date: '1918-11'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, hebuterne_wiki]
    text:
      en: 'In March 1918 Modigliani and Jeanne Hébuterne left Paris for Cagnes-sur-Mer and Nice, for the war and for his health. Their daughter Jeanne was born in Nice in November 1918, shortly after the armistice.'
      zh: '1918 年 3 月，为了躲避战事，也为了他的身体，莫迪利亚尼和让娜·埃比泰纳离开巴黎去了滨海卡涅和尼斯。1918 年 11 月停战后不久，女儿让娜在尼斯出生。'
    line:
      en: 'November 1918: in Nice, Jeanne Hébuterne gives birth to their daughter Jeanne.'
      zh: '1918 年 11 月，让娜·埃比泰纳在尼斯生下女儿让娜。'
  back_in_paris:
    date: '1919-05'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, modigliani_wiki]
    text:
      en: 'By the end of May 1919 Modigliani and Jeanne were back in Paris. His tuberculosis had grown much worse. He kept painting the people closest to him, and in the autumn he lost his strength and could no longer work.'
      zh: '1919 年 5 月底，莫迪利亚尼和让娜回到巴黎。他的结核病重了许多，仍在画身边最亲近的人；到秋天，他没了力气，再也画不动了。'
    line:
      en: 'End of May 1919: Modigliani and Jeanne are back in Paris; his tuberculosis is much worse.'
      zh: '1919 年 5 月底，莫迪利亚尼和让娜回到巴黎，他的结核重了许多。'
  portrait:
    date: '1919'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [modigliani_paris_portrait]
    text:
      en: 'The Metropolitan Museum of Art records a 1919 portrait of Jeanne Hébuterne by Modigliani as an oil painting on canvas.'
      zh: '大都会艺术博物馆藏有莫迪利亚尼 1919 年所画的让娜·埃比泰纳肖像，登记为布面油画。'
  death:
    date: '1920-01-24'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, modigliani_wiki]
    text:
      en: 'Modigliani died of tuberculous meningitis at the Charité hospital in Paris on 24 January 1920, aged thirty five.'
      zh: '1920 年 1 月 24 日，莫迪利亚尼因结核性脑膜炎在巴黎慈善医院去世，三十五岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '24 January 1920: Amedeo Modigliani dies of tuberculous meningitis at the Charité hospital, aged thirty five.'
      zh: '1920 年 1 月 24 日，阿梅迪奥·莫迪利亚尼因结核性脑膜炎在慈善医院去世，三十五岁。'
  jeanne_death:
    date: '1920-01-26'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, hebuterne_wiki]
    text:
      en: 'Two days after his death, on 26 January 1920, Jeanne Hébuterne, unmarried, eight months pregnant and disowned by her family, died at her parents'' home. She left a daughter of fourteen months.'
      zh: '1920 年 1 月 26 日，他去世两天后，未婚、怀孕八个月、被家里断绝来往的让娜·埃比泰纳在父母家中去世，留下十四个月大的女儿。'
    note: 'A death by her own hand: written as a plain fact, without how.'
    line:
      en: '26 January 1920: Jeanne Hébuterne, eight months pregnant, dies at her parents'' home.'
      zh: '1920 年 1 月 26 日，怀孕八个月的让娜·埃比泰纳在父母家中去世。'
  funeral:
    date: '1920-01-27'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [modigliani_paris_last_portraits, modigliani_wiki]
    text:
      en: 'Modigliani was buried in Paris on 27 January 1920. His fellow artists collected the money for the burial, and painters, writers, models, dealers and the owners of the bars of Montmartre and Montparnasse came to see him off.'
      zh: '1920 年 1 月 27 日，莫迪利亚尼在巴黎下葬。葬礼的钱是画家朋友们凑的，画家、作家、模特、画商和蒙马特、蒙帕纳斯的酒馆老板都来送他。'
    note: 'A burial: written as a plain fact.'
    line:
      en: '27 January 1920: Modigliani is buried; his fellow artists have collected the money for the funeral.'
      zh: '1920 年 1 月 27 日，莫迪利亚尼下葬，葬礼的钱是画家朋友们凑的。'
  adopted:
    date: '1920'
    checked: two_sources
    level: usable
    use: [history, wiki]
    sources: [modigliani_paris_last_portraits, hebuterne_wiki]
    text:
      en: 'Their daughter Jeanne, fourteen months old, was taken in by Modigliani''s sister in Livorno.'
      zh: '十四个月大的女儿让娜，由莫迪利亚尼在里窝那的姐姐收养。'
    line:
      en: '1920: their daughter Jeanne is taken in by Modigliani''s sister in Livorno.'
      zh: '1920 年，女儿让娜由莫迪利亚尼在里窝那的姐姐收养。'
  grave:
    date: '1930'
    checked: two_sources
    level: careful
    use: [history, wiki]
    sources: [modigliani_paris_last_portraits, hebuterne_wiki]
    text:
      en: 'Only in 1930 was Jeanne Hébuterne laid in the same grave as Modigliani in Paris.'
      zh: '直到 1930 年，让娜·埃比泰纳才与莫迪利亚尼合葬在巴黎同一座墓里。'
    note: 'A burial: written as a plain fact.'
    line:
      en: '1930: Jeanne Hébuterne is laid in the same grave as Modigliani.'
      zh: '1930 年，让娜·埃比泰纳与莫迪利亚尼合葬。'
