text:
  en:
    name: Domènec Sugranyes
    text: Catalan architect, 1878 to 1938, born in Reus. He began working with Antoni Gaudí in 1905, and Gaudí named him an executor of his will. After the death of Gaudí in 1926 he directed the works of the Sagrada Família for ten years, until the workshop was set on fire on 20 July 1936.
  zh:
    name: 多梅内克·苏格拉涅斯
    text: 加泰罗尼亚建筑师，1878 年生于雷乌斯，1938 年去世。他从 1905 年起与安东尼·高迪共事，高迪指定他为遗嘱执行人之一。1926 年高迪去世后，他主持圣家堂工程十年，直到 1936 年 7 月 20 日工房被烧。
