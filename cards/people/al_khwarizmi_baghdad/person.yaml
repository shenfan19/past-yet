        - {id: p1, kind: hold, req: {"any":[{"stat":{"will":7}},{"job":["archivist"]}]}}
        - {id: p2, kind: persuade, req: {"any":[{"trait":["glib","streetwise"]},{"job":["teacher"]}]}}
