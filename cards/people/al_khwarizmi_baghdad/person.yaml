    text:
      en:
        name: "The man behind algebra"
        place: "Baghdad"
        figure: "Al-Khwarizmi"
        story: 'Al-Khwarizmi''s book on completion and balancing, written around 830, explains methods for solving equations through worked examples. The reading lesson is invented.'
        relic: "A sheet of worked equations"
        relic_desc: "A sheet of sums solved step by step with squares and roots."
        points:
          p1: 'Follow a worked calculation step by step'
          p2: 'Explain one change with the learner''s own example'
          p3: 'Check the result against the starting problem'
        vignettes:
          balance: 'You ask the learner to say the same change aloud on both sides. They stop before reaching the answer. The line that did not balance is now the one they can explain best.'
          tiles: 'You put small square tiles on the table as the learner reads. When the words begin to run together, the remaining shape shows which piece is still missing.'
          check: 'You keep the first line in sight after the learner finishes. They read their answer back into it to see if the numbers agree.'
      zh:
        name: "代数背后的那个人"
        place: "巴格达"
        figure: "花拉子米"
        story: '花拉子米约在 830 年写成《还原与对消计算概要》，用算例说明解方程的方法。本卡的算术练习为虚构。'
        relic: "一张演算过的方程"
        relic_desc: "一张逐步解出平方与根的演算纸。"
        points:
          p1: '沿着算例一步步做下去'
          p2: '用学算者自己的例子说明一步变化'
          p3: '把结果放回原题核对'
        vignettes:
          balance: '你请学算者把两边各做了什么都说出来。他还没算到答案就停了下来。刚才最糊涂的那一步，这回他讲得最清楚。'
          tiles: '学算者照着念，你把几块方片摆在桌上。念到绕口处，剩下的形状正好让人看出还缺哪一块。'
          check: '学算者做完后，你把第一行留在眼前。他把答案放回去念了一遍，看看两边的数是否还相等。'
text:
  en:
    name: Al-Khwarizmi
    text: Scholar of the House of Wisdom in Baghdad, about 780 to about 850. His book on calculation by restoration and balancing gave algebra its name, and the Latin form of his own name gave the word algorithm.
  zh:
    name: 花拉子米
    text: 巴格达智慧宫的学者，约 780 年生，约 850 年去世。他讲述还原与对消的计算之书为代数命名，而他本人名字的拉丁化形式则成了“算法”一词。
hook: {en: 'The step must work on both sides.', zh: '两边怎样才还相等'}
