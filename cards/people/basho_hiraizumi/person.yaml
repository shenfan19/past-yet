    stay_day: 0.3
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [basho_hiraizumi_sora_diary, basho_hiraizumi_primary]
    text:
      en: 'They saw Takadachi, the Koromo River and the site of the Koromo barrier. In his book Bashō climbs Takadachi above the Kitakami River and gives the verse on summer grasses and the dreams of warriors.'
      zh: '两人看了高馆、衣川和衣关旧址。芭蕉在书里写登上北上川边的高馆，留下"夏草啊，武士们的梦的遗迹"一句。'
    line:
      en: 'They climb Takadachi and look down on the Kitakami and Koromo rivers.'
      zh: '两人登上高馆，看北上川和衣川。'
      zh-Hant: '兩人登上高館，看北上川和衣川。'
      fr: 'Ils gravissent Takadachi et surplombent les rivières Kitakami et Koromo.'
      es: 'Suben a Takadachi y contemplan los ríos Kitakami y Koromo.'
      ja: '高館に登り、北上川と挙母川を見下ろします。'
      ko: '다카다치에 올라 기타카미강과 코로모강을 내려다봅니다.'
      ru: 'Они поднимаются на Такадачи и смотрят вниз на реки Китаками и Коромо.'
  golden_hall:
    date: '1689-06-29'
    stay_day: 0.45
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [basho_hiraizumi_sora_diary, basho_hiraizumi_hiraizumi_date]
    text:
      en: 'At Chūsonji the steward showed them the Golden Hall.'
      zh: '在中尊寺，别当带两人看了光堂。'
    line:
      en: 'At Chūsonji the steward shows them the Golden Hall.'
      zh: '在中尊寺，别当带两人看了光堂。'
      zh-Hant: '在中尊寺，別當帶兩人看了光堂。'
      fr: 'A Chūsonji, l''intendant leur montre la Salle Dorée.'
      es: 'En Chūsonji, el mayordomo les muestra el Salón Dorado.'
      ja: '中尊寺では執事が金堂を案内する。'
      ko: '주손지에서 관리인은 그들에게 금당을 보여줍니다.'
      ru: 'В Тюсондзи управляющий показывает им Золотой зал.'
  sutra_hall:
    date: '1689-06-29'
    stay_day: 0.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [basho_hiraizumi_sora_diary, basho_hiraizumi_hiraizumi_date]
    text:
      en: 'Sora wrote that the Sutra Hall was not opened because the steward was away, while Bashō''s book says that both halls were opened.'
      zh: '曾良记经堂因别当不在没有开，芭蕉的书里却写两座堂都开了。'
    line:
      en: 'The Sutra Hall stays shut: the steward is away.'
      zh: '经堂没有开，别当不在。'
      zh-Hant: '經堂沒有開，別當不在。'
      fr: 'La salle des Sutras reste fermée : le steward est absent.'
      es: 'La Sala Sutra permanece cerrada: el mayordomo no está.'
      ja: '経堂は閉まったままです。執事は不在です。'
      ko: '수트라 홀(Sutra Hall)은 폐쇄되어 있습니다. 관리인은 자리를 비웠습니다.'
      ru: 'Зал Сутры остается закрытым: управляющий отсутствует.'
  back:
    date: '1689-06-29'
    stay_day: 0.7
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [basho_hiraizumi_sora_diary, basho_hiraizumi_hiraizumi_date]
    text:
      en: 'At the early hour of the monkey, about four in the afternoon, they were back in Ichinoseki, where their host had the bath ready.'
      zh: '申时上刻，约下午四点，两人回到一关，住处的主人烧好洗澡水等着他们。'
    line:
      en: 'About four in the afternoon they are back at their lodging in Ichinoseki, where the host has the bath ready.'
      zh: '申时上刻，两人回到一关的住处，主人已烧好洗澡水等着。'
      zh-Hant: '申時上刻，兩人回到一關的住處，主人已燒好洗澡水等著。'
      fr: 'Vers quatre heures de l''après-midi, ils sont de retour à leur logement à Ichinoseki, où l''hôte prépare le bain.'
      es: 'Sobre las cuatro de la tarde están de regreso en su alojamiento en Ichinoseki, donde el anfitrión tiene listo el baño.'
      ja: '午後４時ごろ一関の宿舎に戻り、主人が風呂の準備をしてくれている。'
      ko: '오후 4시쯤 그들은 호스트가 목욕을 준비한 이치노세키의 숙소로 돌아왔습니다.'
      ru: 'Около четырех часов дня они вернулись в свой дом в Ичиносеки, где хозяин приготовил ванну.'
  ogaki:
    date: '1689-10-04'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [basho_hiraizumi_sora_diary, basho_oku_wiki]
    text:
      en: 'Around the twenty-first day of the eighth month, 4 October 1689, Bashō reached Ōgaki, the end of the journey of the book.'
      zh: '八月二十一日前后，即 1689 年 10 月 4 日，芭蕉到了大垣，《奥之细道》的旅程在这里收尾。'
    line:
      en: 'About the twenty-first day of the eighth month: Bashō reaches Ōgaki, the end of the narrow road.'
      zh: '八月二十一日前后，芭蕉到了大垣，这一趟北行在这里收尾。'
      zh-Hant: '八月二十一日前後，芭蕉到了大垣，這一趟北行在這裡收尾。'
      fr: 'Vers le vingt et unième jour du huitième mois : Bashō atteint Ōgaki, la fin de la route étroite.'
      es: 'Aproximadamente el día veintiuno del octavo mes: Bashō llega a Ōgaki, el final del camino angosto.'
      ja: '八月二十一日頃、芭蕉は細い道の終点である大垣に到着する。'
      ko: '8월 21일경: 바쇼는 좁은 길의 끝인 오가키에 이르렀다.'
      ru: 'Примерно в двадцать первый день восьмого месяца: Басё достигает Огаки, конца узкой дороги.'
  death:
    date: '1694-11-28'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [basho_wiki, basho_britannica]
    text:
      en: 'Matsuo Bashō died in Osaka on 28 November 1694, the twelfth day of the tenth month of Genroku 7. The Narrow Road to the Deep North was printed in 1702.'
      zh: '1694 年 11 月 28 日，即元禄七年十月十二日，松尾芭蕉在大阪去世。《奥之细道》1702 年刊行。'
    note: 'A death: written as a plain fact.'
    line:
      en: 'The twelfth day of the tenth month, Genroku 7: Matsuo Bashō dies in Osaka.'
      zh: '元禄七年十月十二日，松尾芭蕉在大阪去世。'
      zh-Hant: '元祿七年十月十二日，松尾芭蕉在大阪去世。'
      fr: 'Le douzième jour du dixième mois, Genroku 7 : Matsuo Bashō meurt à Osaka.'
      es: 'El duodécimo día del décimo mes, Genroku 7: Matsuo Bashō muere en Osaka.'
      ja: '元禄7年10月12日：松尾芭蕉、大坂で死去。'
      ko: '겐로쿠 7년 10월 12일: 마쓰오 바쇼가 오사카에서 사망.'
      ru: 'Двенадцатый день десятого месяца, Гэнроку 7: Мацуо Басё умирает в Осаке.'
