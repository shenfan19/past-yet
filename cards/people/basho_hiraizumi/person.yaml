    text:
      en:
        name: The narrow road to the deep north
        place: Hiraizumi, Japan
        figure: Matsuo Basho
        story: 'In the spring of 1689 Matsuo Bashō set out from Edo with his pupil Sora on a long walk through the north. On the thirteenth day of the fifth month they went from Ichinoseki to Hiraizumi and back in a day: they climbed Takadachi above the Kitakami River, the steward showed them the Golden Hall of Chūsonji, and the Sutra Hall stayed shut because he was away. Bashō turned the journey into The Narrow Road to the Deep North, where the visit gives his verse on summer grasses and says that both halls were opened.'
        story_prose:
          opening:
            - 'Ichinoseki, in the north of Japan, summer 1689. Matsuo Bashō and his pupil Sora left Edo more than a month ago. On the thirteenth day of the fifth month the sky is clear, and the two mean to walk the two ri to Hiraizumi to see the old ruins and be back the same day. The journey later became The Narrow Road to the Deep North.'
            - 'In history, the keeper showed them the Golden Hall that day, and the Sutra Hall stayed shut because he was away. Sora set it down in his diary as it was; Bashō later wrote in his book that both halls were opened. In this branch, the master of their lodging in Ichinoseki heats the bath for his guests’ return, and a porter at the street corner says the roads to the north are all mud.'
            - 'Two kinds of people can help on this trip: someone who remembers the road and keeps to the hours, and someone willing to ask what is allowed and find a person to show the way.'
          outcomes:
            all: 'That evening Bashō hung his hat by the door of the lodging in Ichinoseki, a layer of dust on it. Later, when he wrote the Hiraizumi passage, there was a beam in it that he had seen with his own eyes through the gaps of a lattice.'
            p2: 'Later, when Bashō wrote the Hiraizumi passage, there was a beam in it that he had seen with his own eyes through the gaps of a lattice.'
            p1: 'Before dark the two were back in Ichinoseki. The hat hung by the door with a layer of dust on it.'
          none: 'The old ruins of Hiraizumi darkened little by little in the dusk. The door of the Sutra Hall stayed shut.'
          desync: 'Past the fork the sun was already low, and the two were still far from Hiraizumi. {staff} was recalled by the office before they could turn back to Ichinoseki.'
          not_admitted: '{staff} could not keep up with the two travellers. At the street corner in Ichinoseki, two straw hats had already gone out of town.'
          points:
            p1: 'Out of Ichinoseki the road forked twice. {staff} checked each stop against the stages Sora had written in his notebook, and told the two beforehand where to turn and by what hour they must start back. Bashō nodded and tied the cord of his hat tighter. When the sun was low, the two were already on the road back to Ichinoseki.'
            p2:
              class_lettered: 'As one does when searching records, {staff} first asked which day the keeper had left and who was looking after things for him, then which part of the outer gallery visitors might walk. An old man nearby put down his work and led the two along the gallery round to the side of the Sutra Hall. The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.'
              else: '{staff} waited a while before the hall, then asked the neighbours one by one when the keeper would be back and which part of the outer gallery visitors might walk. An old man nearby put down his work and led the two along the gallery round to the side of the Sutra Hall. The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.'
          excerpts:
            p2: 'The door was still shut, but through the gaps of the lattice the beams inside could be seen. Bashō stood a long while without a word, and Sora bent his head and added a line to his notebook.'
            p1: 'Bashō nodded and tied the cord of his hat tighter. When the sun was low, the two were already on the road back to Ichinoseki.'
        relic: A straw hat
        relic_desc: A woven hat grey with rain.
        points:
          p1: 'Check Sora’s return route and turning points so the two travelers can make their same-day visit to Hiraizumi'
          p2: 'When the keeper is away, find out who can show visitors around the exterior. Ask what they are allowed to see before passing the route to the two travelers'
        points_fail:
          p1: 'A turn sends both travelers the wrong way. By the time they find the approach they cannot make the return, and the office recalls the employee.'
          p2: 'Nobody knows when the keeper will return. The two pass outside and the entrance remains closed.'
        shift:
          p1:
            was: 'Sora’s diary records a journey from Ichinoseki to Hiraizumi and back that day, the thirteenth day of the fifth lunar month in 1689.'
          p2:
            was: 'On the thirteenth day of the fifth month of 1689 Sora recorded that the steward showed them the Golden Hall but the Sutra Hall stayed shut because he was away; Bashō later wrote that both halls were opened.'
            now: 'A local guide confirms they can walk round the Sutra Hall and shows it to them from the permitted side. Bashō returns with a detail of the building he saw for himself.'
            who: basho_hiraizumi
            bio: 'Bashō and Sora had only part of a day for Hiraizumi. The later book and Sora’s route notes put different things on the page.'
        vignettes:
          grass: '{staff} follows the two travellers up Takadachi. The Kitakami runs below and the grass is waist high. The elder spreads his hat on the ground and sits a long while without a word, the younger writes something in his notebook, and {staff}, not liking to speak, watches the river with them.'
          bath: '{staff} helps the master of the lodging in Ichinoseki carry water and heat the bath. The two guests went to Hiraizumi today, he says, they will be back in a sweat; he has seen plenty of travellers come back from the old ruins in tears, and a bath sees to it.'
          sandal: '{staff} helps a man at the corner of the street in Ichinoseki mend a sandal strap. A passing porter says the roads to the north are all mud this week, and anyone going on had better put on new sandals before he starts.'
      zh:
        name: 奥州小路
        place: 日本平泉
        figure: 松尾芭蕉
        story: '1689 年春，松尾芭蕉带着弟子曾良从江户出发，徒步走北方。农历五月十三日，两人从一关去平泉，当天往返：登上北上川边的高馆，由别当带着看了中尊寺的光堂，经堂因为别当不在没有开。芭蕉后来把这一路写成《奥之细道》，平泉一节有咏夏草的俳句，书里写两座堂都开了。'
        story_prose:
          opening:
            - '1689 年夏，日本东北的一关。松尾芭蕉带着弟子曾良从江户出发，已经走了一个多月。农历五月十三日，天晴，两人要去二里外的平泉看旧迹，当天赶回。这一路后来写成了《奥之细道》。'
            - '史实里，那天看守带他们看了光堂，经堂因为看守不在，没有开。曾良在日记里照实记下，芭蕉后来在书里写两座堂都开了。在这条分支里，一关的住处主人烧着洗澡水等客人回来，街口的脚夫说往北的路全是泥。'
            - '这一趟用得上两种人：记得住路、守得住时辰的人，肯去问清规矩、找得到人带路的人。'
          outcomes:
            all: '那天傍晚，芭蕉把斗笠挂在一关住处的门边，上面落着一层灰。后来他写平泉那一节时，笔下有一处梁木，是他从格子缝里亲眼看过的。'
            p2: '后来芭蕉写平泉那一节时，笔下有一处梁木，是他从格子缝里亲眼看过的。'
            p1: '天黑以前，两人回到了一关。斗笠挂在门边，上面落着一层灰。'
          none: '平泉的旧迹在暮色里一点点暗下去。经堂的门关着。'
          desync: '过了岔路，日头已经偏西，两人离平泉还远。{staff}没等到他们折回一关，就被事务所召了回来。'
          not_admitted: '{staff}没能跟上那两个旅人。一关的街口，两顶斗笠已经出了城。'
          points:
            p1: '出了一关，路分了两回岔。{staff}照着曾良本子上记的站点一处处对过去，哪里该折、几时得往回走，都先说给两人听。芭蕉点点头，把斗笠的带子系紧了。日头偏西的时候，两人已经走在回一关的路上。'
            p2:
              class_lettered: '{staff}照查档的习惯，先问清看守哪天出的门、谁替他照看着，再问外廊哪一段许人走。附近一个上了年纪的人放下手里的活，领两人沿外廊绕到经堂侧面。门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。'
              else: '{staff}在堂前等了一阵，向附近的住户一个个问过去，问看守几时回来，外廊哪一段许人走。附近一个上了年纪的人放下手里的活，领两人沿外廊绕到经堂侧面。门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。'
          excerpts:
            p2: '门还关着，从格子缝里能看见里头的梁木。芭蕉站了很久没有说话，曾良低头在本子上添了一行。'
            p1: '芭蕉点点头，把斗笠的带子系紧了。日头偏西的时候，两人已经走在回一关的路上。'
        relic: 一顶草笠
        relic_desc: 被雨淋灰了的编织草帽。
        points:
          p1: '把曾良记下的回程站点和折返点核给两人，护住芭蕉与曾良当天往返平泉的行程'
          p2: '得知看守不在时，去确认当天有谁能带访客走外廊。先问当地人哪些地方可以看，再把路线交给两位访客'
        points_fail:
          p1: '一条路指错了来处，两人到看旧迹的路口时已经赶不及往返。事务所因同步失败召回员工。'
          p2: '没人知道看守何时回来，两人只能从外侧经过，入口仍关着。'
        shift:
          p1:
            was: '曾良的行程日记记元禄二年农历五月十三日，两人从一关去平泉，当日折回。'
          p2:
            was: '元禄二年五月十三日，曾良记别当带路看了光堂，经堂因别当不在没有开；芭蕉后来在纪行里写两座堂都开了。'
            now: '附近的人确认经堂外廊可走，带两人从允许的地方看了经堂。芭蕉回到住处时，多了一处自己亲眼看过的建筑细节。'
            who: basho_hiraizumi
            bio: '芭蕉与曾良的平泉行程只有当天的一段时间。后来入书的写法与曾良当日的路线记录各有侧重。'
        vignettes:
          grass: '{staff}跟着两个旅人登上高馆。北上川在底下流，草长得齐腰高，风从河面上吹过来。年长的那位把斗笠铺在地上坐下，半天没出声，年轻的那位在本子上记着什么，{staff}不好开口，就陪着看河。'
          bath: '{staff}帮一关住处的主人挑水烧洗澡水，灶膛里的柴噼啪响。主人说那两位客人今天去了平泉，回来准是一身汗；看旧迹看哭了回来的客人他见得多了，洗个澡就好。'
          sandal: '{staff}在一关的街口帮人系草鞋带子，鞋底的泥已经干成了块。路过的脚夫说，往北的路这几天全是泥，接着赶路的人最好先换一双新草鞋。'
text:
  en:
    name: Matsuo Basho
    text: Japanese haiku poet, 1644 to 1694. In 1689 he travelled the far north on foot and recorded the journey in The Narrow Road to the Deep North, mixing prose and verse.
  zh:
    name: 松尾芭蕉
    text: 日本俳句诗人，1644 年生，1694 年去世。1689 年他步行游历北方，写下散文与俳句相间的《奥之细道》。
