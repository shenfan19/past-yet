    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 0.2, req: {"any":[{"job":["archivist","translator"]},{"trait":["vigil","patient"],"stat":{"will":6}}]}}
        - {id: p2, kind: persuade, day: 0.48, req: {"any":[{"job":["archivist","translator"],"stat":{"wit":7,"will":7}},{"trait":["vigil","patient","scholarly"],"stat":{"wit":8,"will":7}}]}}
