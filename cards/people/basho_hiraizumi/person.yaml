  basho_passing_years:
    order: 2
    tier: none
    date: '1689'
    checked: official_record
    sources: [basho_yamanashi_prologue]
    original: ja
    text:
      ja:
        who: '松尾芭蕉'
        quote: '月日は百代の過客にして、行かふ年も又旅人也。'
        occasion: '『おくのほそ道』序、元禄二年の旅を回想'
      en:
        who: 'Matsuo Bashō'
        quote: 'Days and months are wayfarers through the ages; the years that come and go are travellers too.'
        occasion: 'Opening of Oku no Hosomichi, looking back on the 1689 journey (game translation)'
      zh:
        who: '松尾芭蕉'
        quote: '日月是百代的过客，来去的岁月也是旅人。'
        occasion: '《奥之细道》序，回望 1689 年的行旅（本游戏译）'
      zh-Hant:
        who: '松尾芭蕉'
        quote: '日月是百代的過客，來去的歲月也是旅人。'
        occasion: '《奧之細道》序，回望 1689 年的行旅（本遊戲譯）'
      fr:
        who: 'Matsuo Bashō'
        quote: 'Les jours et les mois voyagent à travers les âges ; les années qui vont et viennent sont aussi des voyageurs.'
        occasion: 'Ouverture d''Oku no Hosomichi, retour sur le voyage de 1689 (traduction du jeu)'
      es:
        who: 'Matsuo Bashō'
        quote: 'Los días y los meses son caminantes a través de los tiempos; los años que van y vienen también son viajeros.'
        occasion: 'Apertura de Oku no Hosomichi, una mirada retrospectiva al viaje de 1689 (traducción del juego)'
      ko:
        who: '마쓰오 바쇼'
        quote: '날과 달은 시대를 관통하는 나그네입니다. 오고가는 세월도 여행자입니다.'
        occasion: '오쿠노 호소미치 개봉, 1689년 여정을 되돌아보며(게임 번역)'
      ru:
        who: 'Мацуо Басё'
        quote: 'Дни и месяцы — путники сквозь века; годы, которые приходят и уходят, тоже путешествуют.'
        occasion: 'Открытие Оку-но Хосомити, оглядываясь назад на путешествие 1689 года (перевод игры)'
