    text:
      en:
        name: The narrow road to the deep north
        place: Hiraizumi, Japan
        figure: Matsuo Basho
        story: 'Basho''s Oku no Hosomichi, written after his 1689 journey, recalls Hiraizumi through present landscape and remembered history. It includes his verse on summer grasses.'
        relic: A straw hat
        relic_desc: A woven hat grey with rain.
        points:
          p1: 'Check Sora’s return route and turning points so the two travelers can make their same-day visit to Hiraizumi'
          p2: 'Have Sora list the places they could reach that day. Leave Bashō separate columns for sights and places described by others'
          p3: 'When the keeper is away, find out who can show visitors around the exterior. Ask what they are allowed to see before passing the route to the two travelers'
        points_fail:
          p1: 'A turn sends both travelers the wrong way. By the time they find the approach they cannot make the return, and the office recalls the employee.'
          p2: 'The notes taken in haste mingle places they saw with local directions to old sites. Back in Ichinoseki those entries are hard to untangle.'
          p3: 'Nobody knows when the keeper will return. The two pass outside and the entrance remains closed.'
        shift:
          p1:
            was: 'Sora’s diary records a journey from Ichinoseki to Hiraizumi and back that day, the thirteenth day of the fifth lunar month in 1689.'
          p2:
            was: 'Sora’s diary records the route. Bashō later made a literary work out of travel and the history of Hiraizumi.'
            now: 'Bashō has a route book to consult. As he writes later, he can keep the places he visited distinct from the past they evoked.'
          p3:
            was: 'Sora recorded that the keeper was away and neither hall opened. Bashō wrote about the Golden Hall in his travel account.'
            now: 'A local guide confirms they can walk outside and shows them the covering structure from the permitted side. Bashō returns with an architectural detail he can check from his own notes.'
            who: basho_hiraizumi
            bio: 'Bashō and Sora had only part of a day for Hiraizumi. The later book and Sora’s route notes put different things on the page.'
        vignettes:
          grass: 'The traveler asks what you are looking at. You wait for the grass to move again before answering. When you write the place down later, you remember the movement before the name.'
          accounts: 'The traveler remembers a story that puts a landmark farther away than you can see. You put the story and the view on separate lines, then ask where the name came from.'
          sandal: 'You move your bundle so the traveler can set the damp sandal flat. Between the two of you there is time to point out one place on the ridge before setting off.'
      zh:
        name: 奥州小路
        place: 日本平泉
        figure: 松尾芭蕉
        story: '芭蕉以 1689 年行旅为素材，后来写成《奥之细道》。平泉一节从眼前景物想到旧事，收有咏夏草的俳句。'
        relic: 一顶草笠
        relic_desc: 被雨淋灰了的编织草帽。
        points:
          p1: '把曾良记下的回程站点和折返点核给两人，护住芭蕉与曾良当天往返平泉的行程'
          p2: '请曾良把当天能走到的地点逐个写下，另给芭蕉留听说的旧迹与眼见地点的分栏'
          p3: '得知看守不在时，去确认当天有谁能带访客走外廊。先问当地人哪些地方可以看，再把路线交给两位访客'
        points_fail:
          p1: '一条路指错了来处，两人到看旧迹的路口时已经赶不及往返。事务所因同步失败召回员工。'
          p2: '匆忙记下的地点混着别人指给他们的旧迹，回到一关后难再分开。'
          p3: '没人知道看守何时回来，两人只能从外侧经过，入口仍关着。'
        shift:
          p1:
            was: '曾良的行程日记记元禄二年农历五月十三日，两人从一关去平泉，当日折回。'
          p2:
            was: '曾良的日记记行程。《奥之细道》后来把平泉见闻和当地往事写成文学作品。'
            now: '芭蕉有一份能对照的路簿，后来写作时可以把路上所见与自己联想到的往事各安在一处。'
          p3:
            was: '曾良记到中尊寺时看守不在，两个堂没有打开。芭蕉的纪行把光堂写入平泉一节。'
            now: '附近的人确认外廊可走，并带两人从允许的地方看覆盖屋。芭蕉回到住处时有一项自己能核对的建筑笔记。'
            who: basho_hiraizumi
            bio: '芭蕉与曾良的平泉行程只有当天的一段时间。后来入书的写法与曾良当日的路线记录各有侧重。'
        vignettes:
          grass: '旅人问你在看什么。你等草再动了一下才回答。后来写下这个地方，你先想起的是草动的样子，才想起地名。'
          accounts: '旅人讲的旧事里，有个地方比眼睛能看到的还远。你把故事和所见分两行记，接着问这名字是从哪听来的。'
          sandal: '你挪开包袱，让旅人把湿草鞋摊平。再次出发之前，两人还有空指认山脊上的一处地方。'
text:
  en:
    name: Matsuo Basho
    text: Japanese haiku poet, 1644 to 1694. In 1689 he travelled the far north on foot and recorded the journey in The Narrow Road to the Deep North, mixing prose and verse.
  zh:
    name: 松尾芭蕉
    text: 日本俳句诗人，1644 年生，1694 年去世。1689 年他步行游历北方，写下散文与俳句相间的《奥之细道》。
