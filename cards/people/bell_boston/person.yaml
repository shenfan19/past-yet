    text:
      en:
        name: 'Write down what came through'
        place: Boston
        figure: Alexander Graham Bell
        story: 'Alexander Graham Bell’s laboratory notebook records that on 10 March 1876 in Boston, Thomas Watson heard and understood words Bell spoke into the transmitter. At the Philadelphia Centennial Exhibition on 25 June, Bell demonstrated the telephone to judges.'
        story_prose:
          opening:
            - 'In Boston the two rooms have their doors shut. Watson covers an ear and listens while Bell pauses over the bench and asks if they can try one more sentence. Someone thinks the work is done and starts to put the apparatus away.'
            - 'On 10 March 1876 Bell recorded that Watson understood words sent from another room. In June Bell demonstrated at the Centennial Exhibition in Philadelphia. Here you can preserve the trial and help his colleagues agree what his Boston students will do while he is away.'
            - 'Someone who can mind the equipment and listen closely can help with the two rooms. Before the exhibition, ask someone good with staff schedules to check the teaching arrangements.'
          points:
            p1: 'Watson comes out and says he heard it. You leave the written sentence face down and ask him to say what came through from beginning to end. Bell picks up his pen when he hears the words without prompting. The men change places and close the doors again. This time Watson will speak.'
            p2: 'A colleague opens the timetable and says that some students know only Bell. Bell reads out the exercises already set and asks the next teacher to fill the empty hours. You help make a copy of the agreed timetable for the families. Before the case is packed, Bell slips his copy and the railway ticket into different pockets.'
          outcomes:
            all: 'The March trial stays in the notebook. When the demonstration begins in Philadelphia, the classes in Boston follow their agreed schedule.'
            p1: 'Watson repeats what he heard. The preparations for June still lack a usable teaching plan.'
            p2: 'The students have someone to take their classes. A final confirmation is missing from the March notebook, and the trip preserves only the arrangements for June.'
          none: 'The apparatus goes back on the bench with no confirmed words from the next room. The teaching timetable still has a gap.'
          not_admitted: 'The doors to both rooms are closed. Someone answers through one of them and leaves no place for a visitor at the bench.'
          desync: 'The historical repetition or the exhibition demonstration is lost. The office recalls the traveller after the trip falls out of sync.'
          excerpts:
            p1: 'The men change places and close the doors again. This time Watson will speak.'
            p2: 'Before the case is packed, Bell slips his copy and the railway ticket into different pockets.'
        relic: A telephone receiver
        relic_desc: A wooden handpiece with a thin diaphragm.
        points:
          p1: 'Keep the Boston apparatus ready for one more trial, with Watson listening in the other room until he can repeat the words'
          p2: 'Before Bell leaves Boston, have him and his colleagues agree what must be done for his students while he is away at the exhibition'
        points_fail:
          p1: 'The equipment goes back on the bench before Watson can confirm what he heard. The March trial falls out of sync and the office recalls {staff}.'
          p2: 'Bell stays in Boston to see to his students. His exhibition demonstration falls out of sync and the office recalls {staff}.'
        shift:
          p1:
            was: 'On 10 March 1876 in Boston, Bell used the experimental apparatus to transmit an intelligible sentence to Watson in the next room.'
          p2:
            was: 'On 25 June 1876 in Philadelphia, Bell showed the telephone to Centennial judges, including Dom Pedro II and William Thomson.'
        vignettes:
          blind: 'The assistant at the receiver wants to see the sentence first. You fold the paper and ask him to write only what he hears. Two words come back intact and the last is left blank. You keep that slip. Another trial is about to start when you go.'
          future: 'You tell the assistant that people will remember one sentence from this date. He guesses it will be whatever someone wrote on the transmitter side. You set out two slips, one for the speaker and one for the listener. The pair will show a difference the story of the famous sentence cannot tell you about this trial.'
          door: 'You carry the receiver’s folded slip back through the door. Only then do you lay it beside the test sentence. The missing word is still missing, but the two matching ones now have a record. You take the comparison home and miss the next sentence.'
      zh:
        name: '把听到的写下来'
        place: 波士顿
        figure: 亚历山大·格雷厄姆·贝尔
        story: '亚历山大·格雷厄姆·贝尔的实验笔记记载，1876 年 3 月 10 日在波士顿，托马斯·沃森听懂了贝尔对着发话装置说的话。6 月 25 日，贝尔在费城百年博览会上向评委演示了电话。'
        story_prose:
          opening:
            - '波士顿的房门各关一扇。沃森在隔壁按住一侧耳朵等声音，贝尔把手停在桌上，问还要不要再试一句。有人以为已经试完，想收起装置。'
            - '1876 年 3 月 10 日，贝尔记录沃森听懂了从另一房间传来的话。同年 6 月，贝尔去费城百年博览会演示。你可以保住那次试验，还可以请同事在他离开前明确学生这边的安排。'
            - '懂得看守器材和听辨语句的人先留在房间两头。善于跟教师商议的人再去核贝尔离校几天的课。'
          points:
            p1: '沃森从屋里走出来，说听见了。你把预先写好的纸收回桌底，请他把听到的句子从头说一遍。贝尔拿起笔，记下他并不需要再问的话。两人换了位置，门重新关上，这次轮到沃森出声。'
            p2: '同事摊开一张排班单，说有人来上课只认得贝尔。贝尔一边读出几位学生该做的练习，一边请下一位老师把空出来的时间填上。你帮他们把改好的那张另外誊给学生家里。装箱前，贝尔把自己的副本和车票收在不同的口袋。'
          outcomes:
            all: '三月的听辨记录留在实验簿。费城演示开始时，波士顿的学生仍按事先说好的安排上课。'
            p1: '沃森复述了实际听见的话。六月的准备还没有形成能照做的分工。'
            p2: '学生这边有了接手的人。三月的笔记缺最后一次确认，事务所只带回了这次排班的记录。'
          none: '装置重新躺回台上，隔壁没有一份核过的复述。学生的课表还等人补。'
          not_admitted: '两间屋的门都关着。有人从里面应声，但试验台没有为来客腾出位置。'
          desync: '史有的试验复述或六月演示缺了一项。行程脱节，事务所发来召回。'
          excerpts:
            p1: '两人换了位置，门重新关上，这次轮到沃森出声。'
            p2: '装箱前，贝尔把自己的副本和车票收在不同的口袋。'
        relic: 一只电话听筒
        relic_desc: 一个木制听筒，里面有一片薄薄的振膜。
        points:
          p1: '把波士顿的装置多留一轮，请隔壁的沃森复述他实际听到的话'
          p2: '趁贝尔还在波士顿，请他和同事定下离校参展几天里学生的事怎么安排'
        points_fail:
          p1: '沃森还没来得及确认听见了什么，装置就收回桌上。三月的试验脱节，事务所召回{staff}。'
          p2: '贝尔留在波士顿照管学生的事。展会演示脱节，事务所召回{staff}。'
        shift:
          p1:
            was: '1876 年 3 月 10 日，贝尔在波士顿用实验装置把一句完整清楚的话传给了隔壁的沃森。'
          p2:
            was: '1876 年 6 月 25 日，贝尔在费城把电话演示给百年博览会的评委，其中有佩德罗二世和威廉·汤姆森。'
        vignettes:
          blind: '接听的帮工想先看试句。你把纸折起来，请他只写实际听见的。传过来两个完整的词，最后一个留了空。你把这张纸条带回去，收队时又一轮刚要开始。'
          future: '你告诉帮工，后人会记住这天传过来的一句话。他猜只要留下说话那端写的句子就够了。你摊开两张纸条，一张给说话人，一张给听话人。眼下这趟究竟漏了哪儿，还得靠这两张对出来。'
          door: '你把接听那张折好的条子带过门，这才摊到试句旁。听漏的词依旧空着，听对的两个总算有了记录。你带回对照表，下一句没有听到。'
text:
  en:
    name: Alexander Graham Bell
    text: Scottish born scientist and inventor, 1847 to 1922, who taught the deaf in Boston. In 1876 he patented the telephone and made the first call to his assistant.
  zh:
    name: 亚历山大·格雷厄姆·贝尔
    text: 苏格兰出生的科学家与发明家，1847 年生，1922 年去世，在波士顿教聋人说话。1876 年他取得电话专利，并打出了第一通电话给助手。
