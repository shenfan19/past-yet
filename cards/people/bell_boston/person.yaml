  centennial:
    date: '1876-06-25'
    checked: two_sources
    level: usable
    use: [story, wiki]
    stay_day: 121
    sources: [bell_centennial_pbs, bell_centennial_smithsonian]
    text:
      en: 'On 25 June 1876 Bell demonstrated the telephone to the judges of the Philadelphia Centennial Exhibition. He had examinations to mark at Boston University and did not want to go; Mabel Hubbard persuaded him.'
      zh: '1876 年 6 月 25 日，贝尔在费城百年博览会向评委演示电话。他在波士顿大学有考卷要改，本不想去，是梅布尔·哈伯德劝他去的。'
