    text:
      en:
        name: 'Start with one corner'
        place: Qufu, China
        figure: Confucius
        story: 'In Analects 7.8, the teacher uses one corner and the other three to describe a learner’s participation. The text preserves a teaching saying. This Qufu episode imagines two learners working through a problem during Confucius’s teaching years. The game year is approximate.'
        relic: 'A practice board with one corner marked'
        relic_desc: 'An imagined classroom prop made for the exercise.'
        points:
          p1: 'Give the stuck learner a starting hint and time to use it'
          p2: 'Set out the board with only one corner marked'
          p3: 'Wait through a first attempt before offering the answer'
        vignettes:
          corner: 'Ji holds her stylus above the first mark and waits for you to point to a second. You ask her to turn the board instead. She finds the next corner in her own time. When she hands the board to a classmate, she gives him only the first mark.'
          explain: 'Qiu can point out all the corners and has already drawn them for Ji. You ask him to hide his own board and listen while she finds a way to describe the next turn. He hears her give a reason he had skipped. When he puts his board down, there is room for her to add it.'
          answer: 'You know the exercise under the name it will have in other languages. Ji is about to tell you what she thinks comes next. You let her finish before giving the name. There is time to hear the next step, but you will miss how she teaches it to someone else.'
      zh:
        name: '先从一个角开始'
        place: 中国曲阜
        figure: 孔子
        story: '《论语·述而》用举一隅、反三隅来说明学习者如何接下老师的提示。文本保存的是一则教学言论。游戏把曲阜的练习放在孔子讲学时期，让两名虚构学生动手，年份为约数。'
        relic: '一块只标了一角的练习板'
        relic_desc: '为这一虚构练习而写入游戏的道具。'
        points:
          p1: '给卡住的学生一点提示，让她自己往下试'
          p2: '摆出只标了一角的练习板'
          p3: '等学生做过第一遍，再决定要不要说答案'
        vignettes:
          corner: '季把笔悬在第一个记号上，等你再指一处。你请她先把板转过来。她自己慢慢找到了下一角。把板交给同学时，她也只指了最初那个记号。'
          explain: '秋已经会指齐四个角，也替季全画好了。你请他先把自己的板扣下，听季怎样说下一处该怎么转。他听到一个自己刚才跳过的理由。板再摆下来，他给她留了地方补上。'
          answer: '你知道后世用别的语言怎样叫这道练习。季正要说她以为下一步是什么。你让她先说完，那个名字可以迟一点再给。你听得到她想的下一步，却看不到她以后怎么教别人。'
text:
  en:
    name: Confucius
    text: Chinese thinker, 551 BC to 479 BC, from the state of Lu. He taught ethics, ritual and good government, and his sayings were collected by students in the Analects.
  zh:
    name: 孔子
    text: 中国思想家，公元前 551 年生，公元前 479 年去世，鲁国人。他讲授伦理、礼和善政，学生把他的言论汇编成《论语》。
hook: {en: 'Three corners are still on the ground.', zh: '另外三个角，要谁找出来？'}
facts:
  corner:
    date: '-500'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [confucius_qufu_corner]
    text:
      en: 'Analects 7.8 compares teaching to raising one corner and asking the learner to return with the other three. The saying does not date a particular class.'
      zh: '《述而》7.8以举起一角而让学习者推回其他三角作比，没有记下一场课的具体年月。'
