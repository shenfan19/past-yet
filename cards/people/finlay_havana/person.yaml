      text:
        en:
          name: Havana, 1881
          text: A hot, crowded port where yellow fever came back every summer. The Havana in the game is a district model of about six hundred people.
        zh:
          name: 哈瓦那，1881
          text: 一个炎热拥挤的港口，黄热病每年夏天都会回来。游戏里的哈瓦那是一个约六百人的街区模型。
  events:
    mosquito_idea:
      order: 5
      tags:
        - infection
        - c19
