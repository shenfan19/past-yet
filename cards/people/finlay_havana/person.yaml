      expedition_send: '{staff} 在匆忙写成的摘要上补上「假说」，交给托马斯送出。伊内斯留着全题，另誊一份。'
      door_block_stubborn: 一位医生拦在门口，说黄热病来自污秽和坏空气，不会听外人的话。{staff} 倔强，不肯让路，被推了出去，丢了 {d.ors_stock:i} 包物资。
      door_block_stubborn_empty: 一位医生拦在门口，说黄热病来自污秽和坏空气。{staff} 倔强，不肯让路，被推了出去。
      door_block_insist_empty: 一位医生拦在门口，说是坏空气，不是蚊子。{staff} 站在门口把话说完，被请了出去。
      door_block_insist: 一位医生拦在门口，说是坏空气，不是蚊子。{staff} 站在门口把话说完，被请了出去，丢了 {d.ors_stock:i} 包物资。
      door_block_appeal: 一位医生拦在门口。{staff} 不硬闯，转身去找芬莱，请他出面说话。
      door_block_yield: 一位医生拦在门口。{staff} 没有争吵，退了一步，半天白白过去。
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      convince: "说服芬莱"
      trust: "赢得街区的信任"
      reform: '提前模拟中的安排'
    milestones:
      havana_address: '{date}，卡洛斯·芬莱在哈瓦那皇家科学院提出蚊媒假说。'
      qualified_title: '{date}，同一场宣读中，芬莱在标题里将这个判断写成假说。后来的院刊保留了这一标题。'
