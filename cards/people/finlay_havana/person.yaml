      refs:
        - finlay1881
        - game
      text:
        en:
          name: The mosquito idea
          text: In August 1881 Carlos Finlay told the Havana Academy that a mosquito carried yellow fever. It was not accepted for years and was proved after 1900. In the game an employee can help bring the city to act on it sooner, which holds only in this branch.
        zh:
          name: 蚊子的说法
          text: 1881 年 8 月，卡洛斯·芬莱向哈瓦那科学院宣布黄热病由一种蚊子传播。这个说法多年不被接受，1900 年以后才得到证明。游戏里员工能帮着让城市提前行动，只在这条分支里成立。
