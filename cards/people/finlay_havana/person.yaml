text:
  en:
    name: Carlos Finlay
    text: Cuban physician, 1833 to 1915. In 1881 he proposed that yellow fever is carried by a mosquito, an idea confirmed in 1900 by the Reed commission and the basis of the campaign against the disease.
  zh:
    name: 卡洛斯·芬莱
    text: 古巴医生，1833 年生，1915 年去世。1881 年他提出黄热病由蚊子传播，这个想法在 1900 年被里德委员会证实，成为防治这种病的基础。
