name: 哈瓦那 1881
short: 哈瓦那
place_name: 古巴哈瓦那
tags:
  - medical
  - infection
  - yellow-fever
  - c19
  - havana
  - history
event_titles:
  door_block: 被拒之门外
  time_strain: 时间错位
plots:
  microscope:
    name: 送芬莱一台显微镜
    desc: 让他能更清楚地给人看蚊子和它带的东西。
    character: 卡洛斯·芬莱
    article: people:finlay_havana
  germ_theory:
    name: 把细菌致病的理论讲给芬莱
    desc: 需要微生物学的工艺，这个时代还没有。
    character: 卡洛斯·芬莱
    article: people:finlay_havana
blurb: 热带港口的黄热病，和一位在别人听进去之前就说蚊子传病的医生。近，成本低，蚊帐和护理的效果很明显。
handle_label: 灭蚊行动开始
protagonist: 卡洛斯·芬莱
protagonist_role: 一位说蚊子传播黄热病、却还没被人相信的医生
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: 炎热的月份里黄热病一再回到哈瓦那，夺走许多人的命，新来的人尤其危险。
      check: true
    - text: 1881 年 8 月，卡洛斯·芬莱向哈瓦那科学院宣布，黄热病由一种蚊子传播。
      check: true
    - text: 大多数医生不接受这个说法，直到 1900 年以后城市开始灭蚊，它才得到证明。
      check: true
  regret:
    - 你能救今天的病人，救不了明天的。主时间线上城市大约二十年后才对蚊子采取行动。
    - 一个好想法不够，还要一遍遍给不想听的人看。
events:
  door_block_stubborn: 一位医生拦在门口，说黄热病来自污秽和坏空气，不会听外人的话。{staff} 倔强，不肯让路，被推了出去，丢了 {d.ors_stock:i} 包物资。
  door_block_stubborn_empty: 一位医生拦在门口，说黄热病来自污秽和坏空气。{staff} 倔强，不肯让路，被推了出去。
  door_block_insist_empty: 一位医生拦在门口，说是坏空气，不是蚊子。{staff} 站在门口把话说完，被请了出去。
  door_block_insist: 一位医生拦在门口，说是坏空气，不是蚊子。{staff} 站在门口把话说完，被请了出去，丢了 {d.ors_stock:i} 包物资。
  door_block_appeal: 一位医生拦在门口。{staff} 不硬闯，转身去找芬莱，请他出面说话。
  door_block_yield: 一位医生拦在门口。{staff} 没有争吵，退了一步，半天白白过去。
  time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
star_points:
  convince: "说服芬莱"
  trust: "赢得街区的信任"
  reform: "让城市比历史上更早对蚊子采取行动"
milestones:
  first_treat: '{date}：{staff} 调好第一杯补液盐，一位病人开始说话了。'
  first_protect: '{date}：{staff} 给几户愿意听的人家的床挂上第一批蚊帐，教他们怎样把蚊子挡在外面。'
  met_finlay: '{date}：{staff} 在病床边遇到芬莱。他听得很认真，却一再问同一件事：证据在哪里。'
  finlay_trusts: '{date}：芬莱开始把 {staff} 当自己人，拿出他一直在记的病例笔记来对比。'
  finlay_convinced: '{date}：芬莱不再只是怀疑蚊子。他有了足够的病例，也信了这位陌生人告诉他的话。'
  board_moves: '{date}：卫生委员会开始松口，说也许可以查一查蚊子。'
  reform_history: '{date}：当局开始对蚊子采取行动。主时间线没有变化。'
  reform_early: '{date}：当局比历史上提前 {advance_days:1} 天开始对蚊子采取行动。主时间线没有变化，只是这条分支。'
  trust_won: '{date}：街区里的人不再把 {staff} 挡在外面，有的还自己来敲门。'
  exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
  outbreak_fades: '{date}：病人数降到了个位数，许多人已经去了山里。'
summary:
  near_death: '{staff} 在哈瓦那街头倒下，被召回符拉了回来。人救下了，代价不小。'
  stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
  gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
  legend: '{staff} 在哈瓦那留下了传说。当局比历史上提前 {advance_days:1} 天开始对蚊子采取行动。'
  perfect: '{staff} 在哈瓦那完成了任务，平安回来。主时间线死了 {base_D:i} 人，这条分支死了 {D:i} 人。'
  scramble: '{staff} 一次次被拒之门外，最后带着一个笑话逃了回来。'
  modest: '{staff} 在哈瓦那待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人陪着那些病人。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把他需要听到的话告诉了他。
  perfect:
    - trait: kind
      text: 我能救今天的病人，救不了明天的。
    - trait: curious
      text: 原来是这样，真的是蚊子带的。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，信不信由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 蚊帐剩下了。限制不是蚊帐，是街区对你的信任。先让员工帮病人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进门。
  ally_gap: 芬莱的证据还很薄。手册能帮他，前提是员工花时间和他在一起。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
