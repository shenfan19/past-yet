text:
  en:
    name: David Hilbert
    text: German mathematician, 1862 to 1943, professor at Göttingen from 1895. In 1900 he set out twenty three problems for the new century. With Felix Klein he brought Emmy Noether to Göttingen in 1915, and while she was not allowed to lecture, her courses were announced under his name.
  zh:
    name: 大卫·希尔伯特
    text: 德国数学家，1862 年生，1943 年去世，1895 年起任哥廷根教授。1900 年他为新世纪提出二十三个问题。1915 年他与费利克斯·克莱因把埃米·诺特请到哥廷根，她不准任教的那几年，她的课在课表上署的是他的名字。
