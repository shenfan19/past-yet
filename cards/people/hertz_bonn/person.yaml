      star_rules: 2
      points:
        - {id: p1, kind: care, day: 80, req: {"any":[{"job":["doctor","physician","medical_teacher","nurse","paramedic"],"stat":{"will":6}},{"job":["lecturer","university_lecturer"],"stat":{"will":6,"wit":6}},{"trait":["patient","methodical","kind"],"stat":{"will":7,"wit":6}}]}}
      vignettes:
        - {id: repeat, traits: [methodical, handy]}
