    text:
      en:
        name: 'The last term'
        place: "Bonn"
        figure: "Heinrich Hertz"
        story: 'From early 1892 Hertz suffered again and again from a painful illness of the nose and throat, so bad at times that he could not work. In 1893 he went back to lecturing in Bonn while undergoing several operations, and finished his Principles of Mechanics. He died in Bonn on 1 January 1894, aged thirty six; the book came out after his death.'
        story_prose:
          opening:
            - 'The lecture schedule is already up in Bonn. Hertz has his notes for a class in one hand and a few lines he wants to check in the Principles of Mechanics. He asks a younger colleague how many students are waiting with questions.'
            - 'Hertz worked on the Principles during his final illness, sent the manuscript off in December 1893 and died on 1 January. You can arrange for a colleague to take one lecture and let Hertz decide how to spend the time.'
            - 'Someone who knows how a class runs can help collect the students’ questions. Even with a colleague available to answer them, let Hertz decide which class he will hand over.'
          points:
            p1: 'The colleague lays out two schedules and says he can take the later class, if he knows which questions the students have already asked. You have Hertz choose the lesson and mark the two places that need answers. Before the colleague leaves with the schedule, he says which room he will be in. Hertz takes the slip from his lecture notes and clips it to the page of the mechanics book he wants to check.'
          outcomes:
            all: 'The students bring their questions to the colleague’s lecture. The manuscript goes out on schedule and Hertz dies on New Year’s Day.'
            p1: 'A colleague takes the class. Hertz rests for some of the time he has gained before looking at the marks on the manuscript.'
          none: 'The schedule stays in Hertz’s hands. He closes the manuscript with those few lines still to check.'
          not_admitted: 'Nobody has arranged to see you before the lecture. The students wait a little in the hall and go back to the building where the timetable is posted.'
          excerpts:
            p1: 'Hertz takes the slip from his lecture notes and clips it to the page of the mechanics book he wants to check.'
        relic: 'A folded lecture sheet'
        relic_desc: 'An invented timetable sheet with one lecture marked.'
        points:
          p1: 'Ask Hertz which lecture he would let a colleague cover, and arrange for someone to take questions on that day'
        points_fail:
          p1: 'The lecture stays on his schedule. He has to save the work on his manuscript for later.'
        shift:
          p1:
            was: 'Hertz continued teaching in Bonn in 1893 while ill and finished his Principles of Mechanics before he died.'
            now: 'In this branch Hertz lets a colleague cover one lecture. He uses the time to rest and dictate a correction to the manuscript before sending it away.'
        vignettes:
          repeat: '{staff} reads the two questions back to the colleague. He marks the one he can answer without opening Hertz’s manuscript.'
          signal: 'A student is waiting outside the wrong classroom. {staff} points to the room the substitute has written on the schedule.'
          gap: '{staff} leaves a blank line for the lecturer’s answers and sets the sheet where the next student can find it.'
      zh:
        name: '最后一个学期'
        place: "波恩"
        figure: "海因里希·赫兹"
        story: '1892 年初起，赫兹的鼻子和喉咙反复剧痛，有时痛得无法工作。1893 年他一边做了几次手术，一边回到波恩大学讲课，写完了《力学原理》。1894 年 1 月 1 日，他在波恩去世，年仅三十六岁，书在他死后出版。'
        story_prose:
          opening:
            - '波恩的教室门口已经贴了课表。赫兹手里有自己要讲的一页，还有《力学原理》上想再看一眼的几行。他问年轻同事，此刻有几个学生等着问课。'
            - '赫兹在末病中继续整理《力学原理》，1893 年 12 月交稿，次年 1 月 1 日去世。你可以替他办下一堂课的交接，让他决定怎么用空下来的一段时间。'
            - '熟悉课堂的人可以帮忙核一遍学生的题。会有人代讲和回答时，仍由赫兹自己决定哪堂能交过去。'
          points:
            p1: '同事把两张课单摊开，说后一堂他可以替上，却不知道哪些问题学生已经问过。你请赫兹挑出当天的那张，并把应当接着答的两处圈明。同事把课单拿走前，当面说了答疑会在哪间屋里。赫兹把原来夹在讲稿里的纸取下来，夹到力学书稿要校的那一页。'
          outcomes:
            all: '学生照约定在那位同事的课堂上问了问题。书稿按时交出，赫兹在次年元日去世。'
            p1: '有同事去教那一堂课。赫兹拿到空出来的时间，先歇了一会儿，再看稿上的记号。'
          none: '课单还在赫兹手里。他把书稿合上，留着下回再核那几行。'
          not_admitted: '没人答应在开讲前见你。走廊里的学生等了一阵，又回到贴课表的那栋楼。'
          excerpts:
            p1: '赫兹把原来夹在讲稿里的纸取下来，夹到力学书稿要校的那一页。'
        relic: '一张折过的课单'
        relic_desc: '虚构的课单，其中一堂做了记号。'
        points:
          p1: '问赫兹哪一堂课可以交给同事，帮他安排当天由谁回答学生的提问'
        points_fail:
          p1: '课还在赫兹的日程上。他只好把稿上的那处改动再往后放一放。'
        shift:
          p1:
            was: '赫兹于 1893 年在波恩带病讲课，在去世前完成了《力学原理》。'
            now: '这条分支里，赫兹请同事代一堂课，自己先歇了一会儿。稿子送出去以前，他还能口述一处更正，请人记下来。'
        vignettes:
          repeat: '{staff}把两个问题念给代课的同事。他把不用翻赫兹书稿就能回答的那一个圈起来。'
          signal: '有学生在等错了的教室外。{staff}指给他看代课同事在课表上记的那一间。'
          gap: '{staff}在纸上空一行留给讲师写答复，把纸放到下一位学生找得到的地方。'
text:
  en:
    name: Heinrich Hertz
    text: German physicist, 1857 to 1894. In 1887 and 1888 he generated and detected radio waves, confirming Maxwell's theory of electromagnetism. The unit of frequency is named after him, and he died young in Bonn.
  zh:
    name: 海因里希·赫兹
    text: 德国物理学家，1857 年生，1894 年去世。1887 至 1888 年他产生并探测到无线电波，证实了麦克斯韦的电磁理论。频率单位以他命名，他年纪轻轻就在波恩去世。
