order: 230
events:
  rapa_nui_moai:
    order: 220
    year: 1500
    lon: -109.29
    lat: -27.12
    region: oceania
    home: [pacific]
    field: architecture
    tier: 2
    channels: {L: 3, H: 1}
    # finished: in the game with release.ready_only. The carving is dated only by century, so the stay carries no day.
    ready: true
    refs: [rapa_nui_moai_quarry, newworld_moai, history_easter_island]
    scene:
      points:
        - {id: p1, kind: trust, day: 10, req: {"any":[{"job":["builder","scaffolder","carpenter","woodcarver"]},{"trait":["handy","patient"]},{"stat":{"finesse":6}}]}}
        - {id: p2, kind: notice, day: 60, req: {"any":[{"stat":{"wit":6}},{"trait":["curious","methodical"]}]}}
        - {id: p3, kind: endure, day: 120, req: {"any":[{"stat":{"constitution":6}},{"trait":["hardy","vigil"]},{"stat":{"will":6}}]}}
      vignettes:
        - {id: pair, traits: [methodical, scholarly], day: 65}
        - {id: surface, traits: [hardy, curious], day: 100}
        - {id: height, day: 30}
    text:
      en:
        name: 'Two views of the same quarry face'
        place: "Rapa Nui, Rano Raraku"
        figure: "The Rapa Nui carvers"
        story: 'Most moai of Rapa Nui were carved straight out of the volcanic tuff of the quarry at Rano Raraku, by estimates between the thirteenth and the sixteenth century. On Easter Sunday, 5 April 1722, the Dutch navigator Jacob Roggeveen reached the island.'
        relic: "A stone adze"
        relic_desc: "A hand sized blade of dark basalt, ground to a clean edge."
        points:
          p1: 'Be taken in by the carvers, then grind their basalt adzes sharp'
          p2: 'Walk round a figure in the rock and draw it once from the front and once from the side'
          p3: 'Help cut away the tuff behind a figure, through a whole hot day'
        vignettes:
          pair: '{staff} labels which sketch is the front and which the side before laying them together, so a ridge in the rock is not taken for the edge of the face.'
          surface: '{staff} walks back to the first place on the slope and adds an arrow to the drawing, showing where it was seen from.'
          height: '{staff} draws the top of the head once from the front and once from the side, and lines the two slips up at the same point.'
      zh:
        name: '采石场的一前一侧'
        place: "拉帕努伊岛，拉诺拉拉库"
        figure: "拉帕努伊的石像匠人"
        story: '拉帕努伊岛上的摩艾，多数是在拉诺拉拉库火山的采石场里，直接从火山凝灰岩中凿出来的，年代估计在十三到十六世纪之间。1722 年 4 月 5 日复活节那天，荷兰航海家雅各布·罗赫芬到达这座岛。'
        relic: "一把石斧"
        relic_desc: "一片手掌大的深色玄武岩刃，磨出了干净的刃口。"
        points:
          p1: '先让匠人们认下，再替他们把玄武岩石斧磨利'
          p2: '绕着岩壁上的一尊石像走一圈，正面、侧面各画一遍'
          p3: '顶着一整天的日头，帮着凿开一尊石像背后的凝灰岩'
        vignettes:
          pair: '{staff}先标清哪张是正面、哪张是侧面，才把两张并在一起看，岩上的一道凸脊就不会被当成脸的边。'
          surface: '{staff}走回坡上最先站的地方，在图上补了一支箭头，标出是从哪里看的。'
          height: '{staff}从正面描一遍头顶，又绕到侧面描一遍，把两张纸条在同一处对齐。'
text:
  en:
    name: "The Rapa Nui carvers"
    text: "The Rapa Nui people who carved and raised the moai, mostly between the thirteenth and sixteenth centuries. Their descendants live on the island and care for the park that holds the quarry."
  zh:
    name: "拉帕努伊的石像匠人"
    text: "凿刻并立起摩艾的拉帕努伊人，大多在十三到十六世纪。他们的后裔今天仍生活在岛上，并照管着包含采石场的公园。"
hook: {en: 'What changes in the drawing when you walk around the stone?', zh: '绕到另一面，草图还一样吗？'}
facts:
  carving:
    date: '1250'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [newworld_moai, history_easter_island]
    text:
      en: 'Estimates put the carving of the moai between about the thirteenth and the sixteenth century; they vary from source to source.'
      zh: '摩艾的雕凿年代，估计大约在十三世纪到十六世纪之间，各家说法不一。'
    line:
      en: 'From about the thirteenth century, the people of Rapa Nui carve figures out of the side of a volcano.'
      zh: '大约从十三世纪起，拉帕努伊人在一座火山的山坡上凿出一尊尊石像。'
  quarry:
    date: '1500'
    stay_day: 5
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [rapa_nui_moai_quarry]
    text:
      en: 'Ma’u Henua describes Rano Raraku as the source of most mōai, carved from volcanic tuff.'
      zh: 'Ma’u Henua 记载，多数摩艾取自拉诺拉拉库的火山凝灰岩。'
    line:
      en: 'In the quarry of Rano Raraku, figures lie half cut in the yellow brown tuff, still part of the hill.'
      zh: '拉诺拉拉库的采石场里，一尊尊石像半卧在黄褐色的凝灰岩里，还连着山体。'
  roggeveen:
    date: '1722-04-05'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [history_easter_island, newworld_moai]
    text:
      en: 'The Dutch navigator Jacob Roggeveen reached the island on Easter Sunday, 5 April 1722.'
      zh: '1722 年 4 月 5 日复活节，荷兰航海家雅各布·罗赫芬到达这座岛。'
    line:
      en: 'Easter Sunday, 5 April 1722: the ships of the Dutchman Jacob Roggeveen come to the island.'
      zh: '1722 年 4 月 5 日，复活节，荷兰人雅各布·罗赫芬的船来到这座岛。'
bystanders:
