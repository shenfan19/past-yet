    sources: [heron_alexandria_mechanica]
    text:
      en: 'The British Library describes the complete Arabic translation of the Mechanics and identifies surviving fragments of the Greek. The year on this card places Hero in the first century and does not date a specific work.'
      zh: '大英图书馆著录《机械学》阿拉伯译本及存世希腊文残篇。卡片年份用于标明希罗活动的大致时代，作品写成年份未明。'
  doors:
    date: '62'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [heron_alexandria_doors]
    text:
      en: 'The book explains how a door can open after a fire is kindled and close after the fire is extinguished.'
      zh: '著作描述点火后开门、熄火后关门的设计。'
