    text:
      en:
        name: 'The figure beside the line'
        place: "Alexandria"
        figure: "Heron"
        story: 'Hero’s Mechanics describes machines for lifting and moving heavy loads. Fragments of the original Greek survive alongside a complete Arabic translation. The visit to his workshop is set around AD 62, an approximate date for his activity.'
        story_prose:
          opening:
            - 'Alexandria, around AD 62. Hero’s Mechanics, written in Greek, describes how devices can help move a heavy load.'
            - 'In history, the Greek survives only in fragments, while the complete work survives in Arabic translation. In this branch a copy is waiting to have its diagrams checked, and someone is willing to store it separately.'
            - 'Someone who can match a diagram to its words can help. It also takes someone who can arrange for a book to change hands.'
          points:
            p1: '{staff} moves the copy to the stool in the best light and asks Hero to look at two lines drawn the same length. One must be read with another page. The copyist transfers the mark from the original, then asks the person who will take the copy to find the place himself. The reader takes the roll to the doorway before opening it again. When he reaches the corrected mark, he leaves his finger there.'
          outcomes:
            all: 'The second roll never goes back onto the workshop’s shelf. Whenever it is borrowed, the same mark can still lead a reader to the page.'
            p1: 'The reader ties the copy separately before he leaves. The old rolls stay in the workshop; the corrected one goes out the door.'
          none: 'The copy remains among the older rolls. Before the door shuts, someone who came for it draws back their hand.'
          not_admitted: '{staff} never gets into the workshop. Someone can be heard pulling a stool into the light.'
          excerpts:
            p1: 'The reader takes the roll to the doorway before opening it again. When he reaches the corrected mark, he leaves his finger there.'
        relic: 'A marked model threshold'
        relic_desc: 'A piece from the fictional workshop model, with a nick where the door rubbed.'
        points:
          p1: 'Help Hero check the figures on a Greek copy of the Mechanics and arrange to keep that copy apart from the workshop’s own rolls'
        points_fail:
          p1: 'The workshop keeps its own rolls. In this branch, as in history, only fragments of the Greek text survive, while an Arabic translation preserves the complete work.'
        shift:
          p1:
            was: 'Hero wrote the Mechanics in Greek in the first century AD. Only fragments of the Greek text survive. Qusṭā ibn Lūqā’s Arabic translation preserves the complete work.'
            now: 'A checked copy of the Greek text and its figures is stored away from the workshop. In this branch that copy reaches later readers.'
            who: heron_alexandria
            bio: 'In this branch a complete Greek copy of the Mechanics survives alongside the Arabic tradition.'
        vignettes:
          threshold: 'Nikanor fits the miniature door to the bench and the return stops a finger’s width short. You mark the spot where it rubs. A flat lentil husk has caught under the model; he brushes it out. Once the door shuts, he asks you to leave the mark so he can find the spot again.'
          audience: 'Berenikē has already seen the swing that opens the door and reaches for her cloak. You ask her to watch the far edge for one more count. When it returns she spots a sliver of light that Nikanor missed. He keeps the model on the bench for a second trial instead of sending it out.'
          future: 'You could tell Nikanor how distant readers will put these pages beside pictures of machines. He is watching his doorway settle with a faint click. You listen with him. When you leave, he is calling the customer back to see the one motion she missed.'
      zh:
        name: '字旁边那一幅图'
        place: "亚历山大"
        figure: "希罗"
        story: '希罗在《机械学》中写到怎样用器械搬动重物。希腊文原著只留下残篇，完整内容见于阿拉伯译本。派遣年份约为公元 62 年，作坊情节由游戏虚构。'
        story_prose:
          opening:
            - '约公元 62 年，亚历山大港。希罗的《机械学》讲怎样借器械搬动重物，原著用希腊文写成。'
            - '史实里，希腊原文只存残篇，全书由阿拉伯译本保存下来。在这条分支里，一份抄本还等着核图，作坊里有人愿意把校好的那份另存一处。'
            - '这趟用得上能看懂图和字怎样对在一起的人，也需要有人办得妥一卷书的交接。'
          points:
            p1: '{staff}把抄本挪到作坊里光足的那张凳上，请希罗看两处画得同样长的线。原来其中一处要跟着另一页读。抄写人照着原页把记号改好，先让来领卷的人也试着找了一遍。 那人把卷带到门外才重新摊开。他找到刚才改过的那一处，把指尖停在那里。'
          outcomes:
            all: '另存的那一份没再和工坊的卷册放回同一架。日后借出时，领卷的人还能按相同的记号回到那页。'
            p1: '领卷的人走前将它单独系好。架上的旧卷留在工坊，那份校过的已经出了门。'
          none: '抄本还是和旧卷待在一处。关门前，没能领走的人把手收了回去。'
          not_admitted: '{staff}没能进作坊。在门外还能听见有人把凳子拉到亮处。'
          excerpts:
            p1: '那人把卷带到门外才重新摊开。他找到刚才改过的那一处，把指尖停在那里。'
        relic: '标过的模型门槛'
        relic_desc: '工坊的模型零件，在门曾蹭到的位置留了一道刻痕。'
        points:
          p1: '帮希罗给《机械学》的一份希腊文抄本核清插图，把它与工坊的卷册分开放'
        points_fail:
          p1: '作坊还是只把卷册留在自己手里。这条分支和史实一样，希腊文字只存残篇，阿拉伯译本保住了全书。'
        shift:
          p1:
            was: '公元一世纪，希罗用希腊文写成《机械学》。希腊文只存残篇，古斯塔·伊本·卢加的阿拉伯译本留下了全书。'
            now: '核过图文的希腊文副本存在工坊以外的地方。这条分支里，后世读者还能读到这一份。'
            who: heron_alexandria
            bio: '这条分支里，《机械学》的一份完整希腊文抄本与阿拉伯译本一同传到后世。'
        vignettes:
          threshold: '尼卡诺尔把模型架上台，门往回收时差一指宽闭合。你标出摩擦的地方。模型底下卡了片扁豆皮，他把它扫出来。门终于关严，他请你留住记号，好叫他下次认得出这处。'
          audience: '贝勒尼刻看见门往外打开，已经去拿披风。你请她再等一会儿，盯紧远侧的边。门回来时，她看见尼卡诺尔漏掉的一线亮光。他把模型留在台上再试一次，没急着交货。'
          future: '你可以告诉尼卡诺尔，后世读者会把这几页同机器的图画摆在一起。他正等模型门咔哒一响，轻轻落定。你跟他一起听。离开时，他正叫客人回来看她错过的那一下。'
text:
  en:
    name: Heron
    text: Greek engineer working in Alexandria in the first century AD. He described the aeolipile, a steam driven turbine, automatic doors and a coin operated dispenser, and wrote on geometry and the measuring of land.
  zh:
    name: 希罗
    text: 公元一世纪在亚历山大工作的希腊工程师。他描述了汽转球、自动门和投币售水装置，也写过几何学与土地测量的著作。
