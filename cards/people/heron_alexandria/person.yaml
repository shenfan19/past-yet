    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 20, req: {"any":[{"job":["retired_engineer","mechanic","civil_engineer","electrician","pump_repairer","shipwright"],"stat":{"wit":5}},{"job":["archivist","translator","proofreader","bookseller"],"stat":{"will":5}},{"trait":["handy","methodical"],"stat":{"wit":8}}]}}
      vignettes:
