        name: Paper made cheaply
        place: Luoyang, China
        figure: Cai Lun
        story: Cai Lun reports a way of making paper from bark, rags and old nets, light and cheap to write on.
        relic: A sheet of coarse paper
        relic_desc: A sheet with bits of fibre still showing.
        points:
          p1: "Work the pulp with him (a craftsperson)"
          p2: "Get an even sheet"
          p3: "Good weather for drying"
      zh:
        name: 廉价造纸
        place: 中国洛阳
        figure: 蔡伦
        story: 蔡伦上报了用树皮、破布和旧渔网造纸的办法，写字又轻又便宜。
        relic: 一张粗纸
        relic_desc: 纸里还看得见纤维的碎屑。
        points:
          p1: "和他一起打浆（懂手艺的人）"
          p2: "抄出一张均匀的纸"
          p3: "晾晒的好天气"
text:
  en:
    name: Cai Lun
    text: Chinese court official of the Eastern Han, died in 121. In 105 he presented the emperor with paper made from bark, rags and fishing nets, a cheaper material than silk and bamboo.
  zh:
    name: 蔡伦
    text: 东汉宦官，121 年去世。105 年他向皇帝献上用树皮、破布和渔网做成的纸，比丝帛和竹简便宜得多。
