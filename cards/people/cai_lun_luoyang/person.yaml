    text:
      en:
        name: Paper made cheaply
        place: Luoyang, China
        figure: Cai Lun
        story: 'The Book of the Later Han reports that Cai Lun presented his papermaking method in 105, listing bark, hemp waste, cloth and fishing nets.'
        relic: A sheet of coarse paper
        relic_desc: A sheet with bits of fibre still showing.
        points:
          p1: 'Pack usable writing samples apart from the list of materials and deliver both to the receiving office in Luoyang'
          p2: 'Have one scribe write on each sample and identify its source so the results can be compared'
        points_fail:
          p1: 'Only the list reaches the office. There is no sample to test for writing, and the office recalls the employee.'
          p2: 'Paper from different workshops is mixed together. Nobody can trace which samples took ink cleanly and which blurred.'
        shift:
          p1:
            was: 'In 105 Cai Lun reported his papermaking to the court; the Book of the Later Han names several materials he used.'
          p2:
            was: 'In 105 the Later Han history links the new submission to costly silk and bulky slips. Excavated paper also predates 105.'
            now: 'The receiving office gets writing samples it can trace to their makers and can request the kind that serves its work.'
            who: cai_lun_luoyang
            bio: 'The paper Cai Lun presented came with written trials, and the court offices chose their paper by them.'
        vignettes:
          light: 'You hold the two trial sheets up to the window. A patch that looked even on the board lets much more light through. The worker pins a mark beside it.'
          ink: 'The worker passes you the smoother sheet. You ask to try the same brush on both before choosing one. The smaller mark turns out to be the easier one to read.'
          tag: 'The worker lifts the drying board before you can ask which sample is which. You set two labeled scraps alongside the sheets so they can still be compared later.'
      zh:
        name: 廉价造纸
        place: 中国洛阳
        figure: 蔡伦
        story: '《后汉书》记蔡伦于元兴元年（105）奏上造纸法，列出树肤、麻头、敝布和鱼网。'
        relic: 一张粗纸
        relic_desc: 纸里还看得见纤维的碎屑。
        points:
          p1: '把能写字的纸样与用料记分开装好，在洛阳呈给负责收件的宫署'
          p2: '把几份样纸交给同一位写手试写，在样纸旁注明来源，让后来的人知道哪一张字迹能看清'
        points_fail:
          p1: '呈送时只有用料名，能验写字效果的纸样没有送到。事务所因同步失败召回员工。'
          p2: '不同作坊送来的样纸混放，能写和容易洇墨的几张对不回来源。'
        shift:
          p1:
            was: '105 年，《后汉书》说蔡伦于元兴元年上奏造纸事，并列举数种可以使用的材料。'
          p2:
            was: '105 年，《后汉书》把缣帛贵、简牍重与蔡伦呈上的纸联系起来。也有早于 105 年的出土纸。'
            now: '管收件的人收到一套能查来源的试写样，能按实际用途挑纸并问作坊补样。'
            who: cai_lun_luoyang
            bio: '蔡伦呈上的纸附有试写记录，宫中书署照着这些记录挑纸用纸。'
        vignettes:
          light: '你把两张试纸举到窗前。搁在板上看着平整的一块，透光却多得多。帮工在旁边别了个记号。'
          ink: '帮工递来摸着更滑的那张。你请他先用同一支笔在两张上都试一下。后来认得更清的，倒是墨痕更小的那张。'
          tag: '你还没来得及问哪张是哪张，帮工已经端起晾纸板。你把写好字的两块纸签摆在旁边，好让他回头还能比较。'
text:
  en:
    name: Cai Lun
    text: Chinese court official of the Eastern Han, died in 121. In 105 he presented the emperor with paper made from bark, rags and fishing nets, a cheaper material than silk and bamboo.
  zh:
    name: 蔡伦
    text: 东汉宦官，121 年去世。105 年他向皇帝献上用树皮、破布和渔网做成的纸，比丝帛和竹简便宜得多。
hook: {en: 'Which sheet will take the ink?', zh: '哪一张纸能受得住墨'}
