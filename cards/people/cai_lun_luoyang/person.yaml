    text:
      en:
        name: Paper made cheaply
        place: Luoyang, China
        figure: Cai Lun
        story: 'The Book of the Later Han reports that Cai Lun presented his papermaking method in 105, listing bark, hemp waste, cloth and fishing nets. A workshop trial in the game is invented.'
        relic: A sheet of coarse paper
        relic_desc: A sheet with bits of fibre still showing.
        points:
          p1: 'Help the workshop hand handle a trial sheet'
          p2: 'Find an uneven patch before drying'
          p3: 'Wait until the sample can be lifted intact'
        vignettes:
          light: 'You hold the two trial sheets up to the window. A patch that looked even on the board lets much more light through. The worker pins a mark beside it.'
          ink: 'The worker passes you the smoother sheet. You ask to try the same brush on both before choosing one. The smaller mark turns out to be the easier one to read.'
          tag: 'The worker lifts the drying board before you can ask which sample is which. You set two labeled scraps alongside the sheets so they can still be compared later.'
      zh:
        name: 廉价造纸
        place: 中国洛阳
        figure: 蔡伦
        story: '《后汉书》记蔡伦于元兴元年（105）奏上造纸法，列出树肤、麻头、敝布和鱼网。纸坊试纸的场面为游戏虚构。'
        relic: 一张粗纸
        relic_desc: 纸里还看得见纤维的碎屑。
        points:
          p1: '帮纸坊帮工接住一张试纸'
          p2: '晾之前找出一处厚薄不匀'
          p3: '等到样纸能完整揭下来'
        vignettes:
          light: '你把两张试纸举到窗前。搁在板上看着平整的一块，透光却多得多。帮工在旁边别了个记号。'
          ink: '帮工递来摸着更滑的那张。你请他先用同一支笔在两张上都试一下。后来认得更清的，倒是墨痕更小的那张。'
          tag: '你还没来得及问哪张是哪张，帮工已经端起晾纸板。你把写好字的两块纸签摆在旁边，好让他回头还能比较。'
text:
  en:
    name: Cai Lun
    text: Chinese court official of the Eastern Han, died in 121. In 105 he presented the emperor with paper made from bark, rags and fishing nets, a cheaper material than silk and bamboo.
  zh:
    name: 蔡伦
    text: 东汉宦官，121 年去世。105 年他向皇帝献上用树皮、破布和渔网做成的纸，比丝帛和竹简便宜得多。
hook: {en: 'Which sheet will take the ink?', zh: '哪一张纸能受得住墨'}
