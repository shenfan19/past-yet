events:
- cai_lun_luoyang
text:
  en:
    name: Cai Lun
    text: Chinese court official of the Eastern Han, died in 121. In 105 he presented the emperor with paper made from bark, rags and fishing nets, a cheaper material than silk and bamboo.
  zh:
    name: 蔡伦
    text: 东汉宦官，121 年去世。105 年他向皇帝献上用树皮、破布和渔网做成的纸，比丝帛和竹简便宜得多。
