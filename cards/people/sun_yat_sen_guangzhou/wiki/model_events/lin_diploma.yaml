order: 3
refs:
  - game
text:
  en: A made-up student asks what will happen to the diploma of a school that is about to be joined into another. The question is invented for the game. The records only say that the graduation of the students of the three schools was on the agenda of the first preparatory meeting on 3 March 1924. If the employee is helping people settle at that moment the question is taken down, otherwise the student goes away.
  zh: 一名编出来的学生问，一所就要并入别校的学校，文凭会怎么算。这个问题是为游戏编的，记录里只说三所学校学生的毕业问题列在 1924 年 3 月 3 日第一次筹备会议的议题里。员工那时正在帮人安顿，问题就会被记下来，否则这名学生就走了。
