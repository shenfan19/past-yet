text:
  en:
    name: The order to join the schools
    text: On 4 February 1924 Sun Yat-sen ordered the three schools joined into one university. In the game an employee can help bring the preparatory work earlier, which holds only in this branch.
  zh:
    name: 合并学校的命令
    text: 1924 年 2 月 4 日孙中山下令把三所学校并成一所大学。游戏里员工能帮着让筹备工作提前，只在这条分支里成立。
