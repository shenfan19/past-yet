text:
  en:
    name: "The university takes his name"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "On 5 August 1926 the school affairs meeting of National Guangdong University resolves to rename the university after Sun Yat-sen and to ask the government to approve it. On 17 August the National Government orders the change, and the university becomes National Sun Yat-sen University. He has been dead for a year and five months. The statue you set out from stands on its campus."
    relic: "A wooden sign with the new name"
    relic_desc: "A narrow board, freshly painted, from the first days of the new name."
    points:
      p1: "Find the resolution in the record of the meeting"
      p2: "Sort and file the papers and seals that carry the old name"
      p3: "Help the new students learn the new name and where to go"
  zh:
    name: "这所大学以他的名字命名"
    place: "广州"
    figure: "孙中山"
    story: "1926 年 8 月 5 日，国立广东大学的校务会议决议把学校改名纪念孙中山，并呈请政府批准。8 月 17 日国民政府下令改名，学校成为国立中山大学。这时他已经去世一年零五个月。你出发时面前的那座铜像，就立在这所大学的校园里。"
    relic: "一块写着新校名的木牌"
    relic_desc: "一块窄木板，漆还是新的，来自新校名最初的几天。"
    points:
      p1: "在会议记录里找到那条决议"
      p2: "把带着旧校名的文件和印章清点归档"
      p3: "帮新来的学生认识新校名，知道往哪里去"
