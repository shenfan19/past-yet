# Guangzhou, 1924. A founding: three schools are to become one university, and in the same hall a book is being made from the Sunday lectures.
# This file is laid over cards/templates/founding.lm.yaml. It holds what is its own: the place, the recorded dates, the moments of the traveller, the stars and the identities.
# Day 0 is 27 January 1924, the first of the Sunday lectures. The traveller is meant to arrive on day 8, 4 February, the day the order to join the three schools is given,
# and the crossing may bring them a few days early or late, see travel.drift in the config. One office day is thirty historical days, so a stay of seven ends near 1 September.

template: founding

metadata:
  name: sun_yat_sen_1924
  status: released
  tags: [university, education, guangzhou, 1924]
  era:
    year: 1924
    tech: 5
    geo: {lon: 113.27, lat: 23.13}
    place: guangdong_university_office
    protagonist: sun
    calendar: {month: 1, day0: 27}
    region: asia
    home: [china]
    near: []
    crossroads: true
  description:
    problem: "Guangzhou from February to September 1924. Sun Yat-sen orders three schools joined into one university and Zou Lu prepares it, while on Sundays Sun lectures in the hall of the Higher Normal School and the notes of the lectures go back and forth to become a book. What can one visitor do in the seven months before classes begin?"
    result: "Where the records of the three schools are one book and the scattered sites are drawn on one sheet, fewer matters lapse before the opening. The recorded dates happen on their days whatever the traveller does, and the traveller leaves eighteen days before classes begin."

# Who a traveller can be taken for here, in the order the place prefers. Guangzhou is a port, so a face from far away is a guest and not a wonder.
identities: [local_scholar, pen, wanderer, maker, local_hand, far_guest, lodger]

variables:
  arrive_day: {value: 8.25, note: "4 February 1924, the day of the order. Fact f01."}
  open_day: {value: 236, note: "19 September 1924, classes begin. Fact f08."}
  site_by: {type: parameter, value: 158, unit: day, source: historical, note: "July 1924, when Sun Yat-sen has Zou Lu choose Shipai. Fact f07. The map has to be handed in before it."}
  site_known: {type: parameter, value: 0.5, unit: fraction, source: game_assumption, note: "How much of the sites the traveller has to have walked to draw a map worth handing in."}
  early_day: {value: 36, note: "3 March 1924, the first preparatory meeting. Fact f04."}
  horizon_days: {value: 298}

milestones:
  # ---- the recorded dates: they write themselves, whoever is there ----
  lecture_jan27: {date: "1924-01-27", fact: g1, importance: 4, tag: history, needs_traveler: false}
  order_given: {date: "1924-02-04", fact: f01, importance: 5, tag: history, needs_traveler: false}
  lecture_feb17: {date: "1924-02-17", fact: g1, importance: 4, tag: history, needs_traveler: false}
  zou_takes_up: {date: "1924-02-21", fact: f02, importance: 4, tag: history, needs_traveler: false}
  hall_feb24: {date: "1924-02-24", fact: f03, importance: 4, tag: history, needs_traveler: false}
  first_meeting:
    date: "1924-03-03"
    fact: f04
    importance: 5
    tag: history
    needs_traveler: false
    variants:
      - {when: "records >= 1", key: first_meeting_book}
  proofs_travel: {when: "day >= 46", fact: g3, importance: 4, tag: history, needs_traveler: false}
  preface: {date: "1924-03-30", fact: g4, importance: 4, tag: history, needs_traveler: false}
  lecture_apr20: {date: "1924-04-20", fact: g1, importance: 3, tag: history, needs_traveler: false}
  measures_sent: {date: "1924-06-03", fact: f05, importance: 3, tag: history, needs_traveler: false}
  measures_approved: {date: "1924-06-06", fact: f05, importance: 4, tag: history, needs_traveler: false}
  shipai_chosen: {when: "day >= 158", fact: f07, importance: 3, tag: history, needs_traveler: false}
  last_lecture: {date: "1924-08-24", fact: g1, importance: 5, tag: history, needs_traveler: false}
  classes_begin: {date: "1924-09-19", fact: f08, importance: 5, tag: history, needs_traveler: false}
  ceremony: {date: "1924-11-11", fact: f09, importance: 5, tag: history, needs_traveler: false}

  # ---- the moments of the traveller: the same moment reads differently for different people ----
  sunday_first:
    date: "1924-02-17"
    importance: 4
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: sunday_stall}
      - {when: "tag.steadfast == 1 or tag.class_religious == 1", key: sunday_sit}
  spoiler:
    when: "day >= 48 and arrived == 1"
    importance: 4
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.trait_bold == 1", key: spoiler_said}
  errand:
    when: "day >= 103 and arrived == 1"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "ring_now == 1 and tag.sturdy == 1", key: errand_carried, effects: {carried: "1", traveler.trust: "traveler.trust + 0.05"}}
      - {when: "tag.frail == 1", key: errand_frail}
  pamphlet:
    date: "1924-03-31"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: pamphlet_traded, effects: {has_copy: "1"}}
      - {when: "ring_now == 1", key: pamphlet_given, effects: {has_copy: "1"}}
  homesick_may: {date: "1924-05-14", importance: 3, tag: trait, needs_traveler: true}
  shipai_walk:
    when: "day >= 168 and arrived == 1"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "sites >= 1", key: shipai_reached, effects: {reached_far: "1"}}
      - {when: "tag.frail == 1", key: shipai_frail}
  # The first star. Nothing is recorded of who walked the sites before the choice of Shipai, so the branch may hold this deed of the traveller:
  # once the office takes them in and they know the sites, they hand a map of the sites and of the open ground at Shipai to a clerk.
  # A bold employee does not wait to be asked in and stops a clerk at the door. Whether the map counted is not said; the choice stays as it is recorded.
  site_offered:
    when: "arrived == 1 and sites >= site_known and day < site_by and (ring_now == 1 or tag.trait_bold == 1)"
    importance: 5
    tag: branch
    needs_traveler: true
    variants:
      - {when: "ring_now == 0", key: site_offered_bold}
  last_seat:
    date: "1924-08-24"
    importance: 5
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: last_stall}

# The hints of Guangzhou point at the stars: only the first star needs walking, so only what stops the walking is said, and only when that star was missed.
hints:
  - {when: "tag.frail == 1", key: frail, point: site}
  - {when: "has_compass == 0", key: empty, point: site}
  - {when: "1 == 1", key: none}

# What is recorded long after the stay, told at the end of the record as plain dated lines. The model does not run to these days.
epilogue:
  - {date: "1925-03-12", fact: f13, key: sun_dies}
  - {date: "1926-08-17", fact: f16, key: renamed}

# Three sync points. Each is a deed of the traveller: a map of the sites handed in before the choice of Shipai, a copy of the book of the lectures to take home, and being there for the last lecture.
star_points:
  - {id: site, kind: notice, milestone: site_offered}
  - {id: copy, kind: trust, milestone: copy_kept}
  - {id: last, kind: hold, milestone: last_seat}
