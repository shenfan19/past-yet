# Guangzhou, 1924. A founding: three schools are to become one university. The five stars are the five words of the motto Sun Yat-sen wrote for it, each read from one attribute of the employee.
# This file is laid over cards/templates/founding.lm.yaml. It holds what is its own: the place, the recorded dates, the moments of the traveller, the stars and the identities.
# Day 0 is 27 January 1924, the first of the Sunday lectures. The traveller is meant to arrive on day 8, 4 February, the day the order to join the three schools is given,
# and the crossing may bring them a few days early or late, see travel.drift in the config. One office day is thirty historical days, so a stay of seven ends near 1 September.

template: founding

metadata:
  name: sun_yat_sen_1924
  status: released
  tags: [university, education, guangzhou, 1924]
  era:
    year: 1924
    tech: 5
    geo: {lon: 113.27, lat: 23.13}
    place: guangdong_university_office
    protagonist: sun
    calendar: {month: 1, day0: 27}
    region: asia
    home: [china]
    near: []
    crossroads: true
  description:
    problem: "Guangzhou from February to September 1924. Sun Yat-sen orders three schools joined into one university and Zou Lu prepares it, while on Sundays Sun lectures in the hall of the Higher Normal School and the notes of the lectures go back and forth to become a book. What can one visitor do in the seven months before classes begin?"
    result: "As the work comes in, the preparatory office entrusts the traveller with jobs suited to their abilities. Each completed job leaves something the office can use. Taken together, the five possible jobs echo the motto. The recorded dates happen on their days whatever the traveller does, and the traveller leaves before classes begin."

# Who a traveller can be taken for here, in the order the place prefers. Guangzhou is a port, so a face from far away is a guest and not a wonder.
identities: [local_scholar, pen, wanderer, maker, local_hand, far_guest, lodger]

variables:
  arrive_day: {value: 8.25, note: "4 February 1924, the day of the order. Fact f01."}
  open_day: {value: 236, note: "19 September 1924, classes begin. Fact f08."}
  site_by: {type: parameter, value: 158, unit: day, source: historical, note: "July 1924, when Sun Yat-sen has Zou Lu choose Shipai. Fact f07. The map has to be handed in before it."}
  site_known: {type: parameter, value: 0.5, unit: fraction, source: game_assumption, note: "How much of the sites the traveller has to have walked to draw a map worth handing in."}
  early_day: {value: 36, note: "3 March 1924, the first preparatory meeting. Fact f04."}
  enrol_day: {type: parameter, value: 135, unit: day, source: historical, note: "10 June 1924, registration for the preparatory classes opens. Fact f20."}
  grad_day: {type: parameter, value: 146, unit: day, source: historical, note: "21 June 1924, the graduation ceremony of the three schools. Fact f21."}
  # the five attributes of the employee on the trip, implants and mood included, and the line each star asks of one of them
  a_wit: {type: parameter, value: 4, from_staff: wit_level, source: game_assumption}
  a_luck: {type: parameter, value: 4, from_staff: luck_level, source: game_assumption}
  a_will: {type: parameter, value: 4, from_staff: will_level, source: game_assumption}
  a_finesse: {type: parameter, value: 4, from_staff: finesse_level, source: game_assumption}
  a_constitution: {type: parameter, value: 4, from_staff: constitution_level, source: game_assumption}
  line_xue: {type: parameter, value: 5, source: game_assumption, note: "Study widely: wit."}
  line_wen: {type: parameter, value: 5, source: game_assumption, note: "Enquire carefully: luck brings an introduction to the three schools before the meeting."}
  line_si: {type: parameter, value: 5, source: game_assumption, note: "Think prudently: will, to walk every site before choosing."}
  line_bian: {type: parameter, value: 5, source: game_assumption, note: "Discern clearly: finesse, to sort the lists of three schools."}
  line_xing: {type: parameter, value: 5, source: game_assumption, note: "Practise earnestly: constitution, to stake the ground at Shipai. The fewest employees reach it."}
  horizon_days: {value: 298}

milestones:
  # ---- the recorded dates: they write themselves, whoever is there ----
  lecture_jan27: {date: "1924-01-27", fact: g1, importance: 4, tag: history, needs_traveler: false}
  order_given: {date: "1924-02-04", fact: f01, importance: 5, tag: history, needs_traveler: false}
  lecture_feb17: {date: "1924-02-17", fact: g1, importance: 4, tag: history, needs_traveler: false}
  zou_takes_up: {date: "1924-02-21", fact: f02, importance: 4, tag: history, needs_traveler: false}
  hall_feb24: {date: "1924-02-24", fact: f03, importance: 4, tag: history, needs_traveler: false}
  first_meeting:
    date: "1924-03-03"
    fact: f04
    importance: 5
    tag: history
    needs_traveler: false
    variants:
      - {when: "records >= 1", key: first_meeting_book}
  proofs_travel: {when: "day >= 46", fact: g3, importance: 4, tag: history, needs_traveler: false}
  preface: {date: "1924-03-30", fact: g4, importance: 4, tag: history, needs_traveler: false}
  lecture_apr20: {date: "1924-04-20", fact: g1, importance: 3, tag: history, needs_traveler: false}
  measures_sent: {date: "1924-06-03", fact: f05, importance: 3, tag: history, needs_traveler: false}
  measures_approved: {date: "1924-06-06", fact: f05, importance: 4, tag: history, needs_traveler: false}
  enrol_open: {date: "1924-06-10", fact: f20, importance: 4, tag: history, needs_traveler: false}
  grad_ceremony: {date: "1924-06-21", fact: f21, importance: 5, tag: history, needs_traveler: false}
  shipai_chosen: {when: "day >= 158", fact: f07, importance: 3, tag: history, needs_traveler: false}
  last_lecture: {date: "1924-08-24", fact: g1, importance: 5, tag: history, needs_traveler: false}
  classes_begin: {date: "1924-09-19", fact: f08, importance: 5, tag: history, needs_traveler: false}
  ceremony: {date: "1924-11-11", fact: f09, importance: 5, tag: history, needs_traveler: false}

  # ---- the moments of the traveller: the same moment reads differently for different people ----
  sunday_first:
    date: "1924-02-17"
    importance: 4
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: sunday_stall}
      - {when: "tag.steadfast == 1 or tag.class_religious == 1", key: sunday_sit}
  spoiler:
    when: "day >= 48 and arrived == 1"
    importance: 4
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.trait_bold == 1", key: spoiler_said}
  errand:
    when: "day >= 103 and arrived == 1"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "ring_now == 1 and tag.sturdy == 1", key: errand_carried, effects: {carried: "1", traveler.trust: "traveler.trust + 0.05"}}
      - {when: "tag.frail == 1", key: errand_frail}
  pamphlet:
    date: "1924-03-31"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: pamphlet_traded, effects: {has_copy: "1"}}
      - {when: "ring_now == 1", key: pamphlet_given, effects: {has_copy: "1"}}
  homesick_may: {date: "1924-05-14", importance: 3, tag: trait, needs_traveler: true}
  shipai_walk:
    when: "day >= 168 and arrived == 1"
    importance: 4
    tag: branch
    needs_traveler: true
    variants:
      - {when: "sites >= 1", key: shipai_reached, effects: {reached_far: "1"}}
      - {when: "tag.frail == 1", key: shipai_frail}
  # The traveller helps the preparatory office when work comes in, in a fictional role.
  adviser:
    when: "arrived == 1"
    importance: 4
    tag: branch
    needs_traveler: true
    effects: {traveler.trust: "max(traveler.trust, inner_trust)"}
  # Each milestone records an assignment and its delivery together when the traveller reaches its window and meets the requirement.
  wen_ask:
    when: "arrived == 1 and day >= 30 and day < early_day and a_luck >= line_wen"
    importance: 5
    tag: branch
    needs_traveler: true
  xue_enrol:
    when: "arrived == 1 and day >= 133 and day < enrol_day and a_wit >= line_xue"
    importance: 5
    tag: branch
    needs_traveler: true
  bian_rolls:
    when: "arrived == 1 and day >= 138 and day < grad_day and a_finesse >= line_bian"
    importance: 5
    tag: branch
    needs_traveler: true
  si_site:
    when: "arrived == 1 and day >= 150 and day < site_by and a_will >= line_si"
    importance: 5
    tag: branch
    needs_traveler: true
  xing_shipai:
    when: "arrived == 1 and day >= 190 and a_constitution >= line_xing"
    importance: 5
    tag: branch
    needs_traveler: true
  last_seat:
    date: "1924-08-24"
    importance: 5
    tag: trait
    needs_traveler: true
    variants:
      - {when: "tag.class_food == 1 or tag.class_trade == 1", key: last_stall}

# The hints of Guangzhou point at the stars: each star asks one attribute, so the hint names it, and only when that star was missed.
hints:
  - {when: "a_luck < line_wen", key: low_luck, point: wen}
  - {when: "a_wit < line_xue", key: low_wit, point: xue}
  - {when: "a_finesse < line_bian", key: low_finesse, point: bian}
  - {when: "a_will < line_si", key: low_will, point: si}
  - {when: "a_constitution < line_xing", key: low_constitution, point: xing}
  - {when: "1 == 1", key: none}

# What is recorded long after the stay, told at the end of the record as plain dated lines. The model does not run to these days.
epilogue:
  - {date: "1925-03-12", fact: f13, key: sun_dies}
  - {date: "1926-08-17", fact: f16, key: renamed}

# Five ways to help in the order of the motto. Missing any of them leaves the recorded events intact.
star_rules: 2
star_trait_bonus: false
star_points:
  - {id: xue, kind: persuade, milestone: xue_enrol}
  - {id: wen, kind: trust, milestone: wen_ask}
  - {id: si, kind: hold, milestone: si_site}
  - {id: bian, kind: notice, milestone: bian_rolls}
  - {id: xing, kind: endure, milestone: xing_shipai}
