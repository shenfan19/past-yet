era_text:
  en:
    name: Guangzhou, 1924
    short: Guangzhou
    place_name: Guangzhou, the university office
    tags:
      - thought
      - education
      - university
      - c20
      - guangzhou
      - history
    event_titles:
      time_strain: Time slip
    plots: {}
    blurb: Three schools, one order to join them, and the weeks before anything is built. Close, cheap, and the effect of care and clear directions is clear. This is where the game begins.
    handle_label: The preparatory work begins
    protagonist: Sun Yat-sen
    protagonist_role: A statesman who has just ordered three schools joined into one university
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: 'On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it.'
          check: true
        - text: 'Zou Lu took up the preparation on 21 February. On 24 February he called the students of the three schools together in the hall of the Higher Normal School to announce it, and the first preparatory meeting was held on 3 March, with the graduation of the students of the three schools on its agenda.'
          check: true
        - text: 'On 3 June Zou Lu submitted the measures for joining the schools, and they were approved on 6 June. Zou Lu became the president on 9 June.'
          check: true
        - text: 'The schools were spread over several places, which made them hard to run, and Sun told Zou Lu to choose a new campus at Shipai on the eastern edge of the city. Land was marked out there in 1924.'
          check: true
        - text: 'Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote. Sun died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.'
          check: true
      regret:
        - 'You can help today''s people but not tomorrow''s. On the main timeline the preparatory work began on 21 February.'
        - 'A plan and a place matter more than any one speech, but they only come when someone is heard.'
    events:
      lin_diploma_helped: '{date}: Lin, a final-year student (a character invented for the game), asks what will happen to the diploma of a school that is about to be joined into another. {staff} writes the question down and gets it to the clerk who is collecting such questions. Lin goes home with an answer to wait for.'
      lin_diploma: '{date}: Lin, a final-year student (a character invented for the game), asks what will happen to the diploma of a school that is about to be joined into another. Nobody is free to write it down, and Lin goes away unsure and does not come back.'
      lost_at_gate_helped: '{date}: A new student, Wen (invented for the game), stands in a courtyard with a letter and no idea which office to go to. {staff} points the way on the map, and within minutes Wen is in the right line.'
      lost_at_gate: '{date}: A new student, Wen (invented for the game), stands in a courtyard with a letter and no idea which office to go to, and in the end leaves for another school.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      settled: 'Be of use to the people who come asking'
      campus: 'Put a clear map of the schools in every hand'
      lin: 'Write down the question of the student Lin'
    milestones:
      lin_question: '{date}: The question Lin asked is on paper and on its way to the people who collect such questions.'
      site_known: '{date}: {staff} has the map in every hand. Nobody asks where to go any more.'
      people_settled: '{date}: {staff} has found a place and a class for everyone who came asking.'
      first_treat: '{date}: {staff} writes down the first names and finds a teacher and his class a room.'
      first_protect: '{date}: {staff} draws the first simple map of the schools and their sites and hands it round.'
      reform_history: '{date}: Zou Lu takes up the preparation, as in history. The main timeline does not change.'
      trust_won: '{date}: The clerks of the three schools come to {staff} on their own to ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of people left without a place falls to single digits.'
      students_told: '{date}: Zou Lu calls the students of the three schools together in the hall of the Higher Normal School and announces the preparation.'
      first_meeting: '{date}: The first meeting of the preparatory committee is held, with the graduation of the students of the three schools on its agenda.'
    summary:
      near_death: '{staff} collapses in a Guangzhou lane and is pulled back by the recall charm, and wakes before the statue. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay and see the university open. Gifts will arrive later.'
      gave_up: '{staff} gave up early and woke before the statue, saying the offices of 1924 were not for them.'
      legend: '{staff} woke before the statue with a brass badge in a pocket. The preparation began {advance_days:1} days earlier than in the main timeline.'
      perfect: '{staff} came back to the statue. On the main timeline {base_D:i} people gave up before classes began, in this branch {D:i}.'
      scramble: '{staff} was turned away again and again and finally woke before the statue with a joke to tell.'
      modest: '{staff} spent seven days in the office, did what was within reach, and stood before the statue again.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was keeping watch at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's people, not tomorrow's.
        - trait: curious
          text: So that is how it is, people stay when they know where to go.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they listen is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Maps were left over. The limit was the trust of the three schools, not the supplies. Let the employee help people first to build trust.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    name: 广州 1924
    short: 广州
    place_name: 广州，大学筹备处
    tags:
      - thought
      - education
      - university
      - c20
      - guangzhou
      - history
    event_titles:
      time_strain: 时间错位
    plots: {}
    blurb: 三所学校，四处校址，一道合并的命令。近，成本低，照应和指路的效果很明显。游戏从这里开始。
    handle_label: 筹备工作开始
    protagonist: 孙中山
    protagonist_role: 刚下令把三所学校并成一所大学的政治家
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: '1924 年 2 月 4 日，孙中山下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。'
          check: true
        - text: '邹鲁 2 月 21 日接手筹备。2 月 24 日他在高等师范的礼堂召集三所学校的学生宣布此事，3 月 3 日开第一次筹备会议，议题里有三所学校学生的毕业问题。'
          check: true
        - text: '6 月 3 日邹鲁呈报归并三校的办法，6 月 6 日获批准，6 月 9 日邹鲁出任校长。'
          check: true
        - text: '几所学校分散在好几处，不便管理，孙中山让邹鲁在广州东郊选石牌作新校址，1924 年那里划出了土地。'
          check: true
        - text: '9 月 19 日开学，11 月 11 日举行成立典礼，用了孙中山写的校训。孙中山 1925 年 3 月 12 日在北京去世，1926 年这所大学改名为国立中山大学。'
          check: true
      regret:
        - '你能帮今天的人，帮不了明天的。主时间线上筹备工作 2 月 21 日开始。'
        - '一个计划和一个地方比任何一次演讲都重要，但它们只有在有人被听见时才会来。'
    events:
      lin_diploma_helped: '{date}：阿林是一名毕业班的学生（游戏里编出来的人物），他问，一所就要并入别校的学校，文凭会怎么算。{staff} 把问题记下来，送到收集这类问题的办事员手里。阿林带着一个要等的答复回家了。'
      lin_diploma: '{date}：阿林是一名毕业班的学生（游戏里编出来的人物），他问，一所就要并入别校的学校，文凭会怎么算。没有人有空记下来，阿林带着不安走了，没有再回来。'
      lost_at_gate_helped: '{date}：新生小文（游戏里编出来的人物）拿着一封信站在院子里，不知道该去哪个办公室。{staff} 在简图上给他指了路，几分钟后小文已经排在了对的队里。'
      lost_at_gate: '{date}：新生小文（游戏里编出来的人物）拿着一封信站在院子里，不知道该去哪个办公室，最后去了别的学校。'
      time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
    star_points:
      settled: '帮上每一个来问的人'
      campus: '让清楚的简图人手一份'
      lin: '记下学生阿林的问题'
    milestones:
      lin_question: '{date}：阿林问的问题已经写在纸上，送往收集这类问题的人手里。'
      site_known: '{date}：简图人手一份，没有人再问往哪里去。'
      people_settled: '{date}：来问的人，{staff} 都给找到了位置和班级。'
      first_treat: '{date}：{staff} 记下第一批名字，给一位老师和他的班找到了一间教室。'
      first_protect: '{date}：{staff} 画出第一张几所学校和校址的简图，发了下去。'
      reform_history: '{date}：邹鲁接手筹备，和史实一样。主时间线没有变化。'
      trust_won: '{date}：三所学校的办事员开始主动来找 {staff} 帮忙。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：没有着落的人数降到了个位数。'
      students_told: '{date}：邹鲁在高等师范的礼堂把三所学校的学生召集到一起，宣布筹备工作。'
      first_meeting: '{date}：筹备委员会开第一次会，议题里有三所学校学生的毕业问题。'
    summary:
      near_death: '{staff} 在广州的一条巷子里倒下，被召回符拉了回来，在铜像前醒来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想留下来看着这所大学开学。礼物之后会到。'
      gave_up: '{staff} 提前放弃，在铜像前醒来，说 1924 年的办公室不适合自己。'
      legend: '{staff} 在铜像前醒来，口袋里多了一枚铜质校徽。筹备工作比主时间线提前 {advance_days:1} 天开始。'
      perfect: '{staff} 回到了铜像前。主时间线上开学前有 {base_D:i} 个人放弃，这条分支里是 {D:i} 个。'
      scramble: '{staff} 一次次被拒绝，最后带着一个笑话在铜像前醒来。'
      modest: '{staff} 在办公室待了七天，做了力所能及的事，又站在了铜像前。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人守着。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他们需要听到的话告诉了他们。
      perfect:
        - trait: kind
          text: 我能救今天的人，救不了明天的。
        - trait: curious
          text: 原来是这样，人知道往哪里去，才会留下来。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，听不听由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 简图剩下了。限制不是物资，是三所学校对你的信任。先让员工帮人做事，建立信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
