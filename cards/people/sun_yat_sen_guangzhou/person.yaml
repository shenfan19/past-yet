    plots: {}
    blurb: One hall and two things being made in it, a university and a book. Seven months, from the order to join the schools to eighteen days before classes begin. This is where the game begins.
    handle_label: The records become one book
    protagonist: Sun Yat-sen
    protagonist_role: A statesman who has ordered three schools joined into one university, and lectures in their hall on Sundays
    stay: Stay seven office days, 210 days of history
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: 'On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it.'
          check: true
        - text: 'From 27 January to 24 August 1924 Sun lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all. Huang Changgu took each one down, Zou Lu read the fair copies and pasted slips on them, and Sun corrected them in his own hand.'
          check: true
        - text: 'Zou Lu took up the preparation on 21 February. On 24 February he called the students of the three schools together in the hall to announce it, and the first preparatory meeting was held on 3 March, with the graduation of the students of the three schools on its agenda.'
          check: true
        - text: 'The first lectures were printed as a pamphlet at the end of March, with a preface Sun wrote on 30 March. On 3 June Zou Lu submitted the measures for joining the schools, and they were approved on 6 June.'
          check: true
        - text: 'Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote. Sun died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.'
          check: true
      regret:
        - 'You leave on 1 September. Classes begin on the 19th, and the motto is written after that.'
        - 'The lectures stopped at the sixteenth. Nobody in the hall knew it was the last.'
    events:
      asked_the_way: '{date}: A new student with a letter asks {staff} the way to an office. {staff} does not know either, and they look for it together for half the morning.'
      asked_the_way_shown: '{date}: A new student with a letter asks {staff} the way to an office. {staff} shows it on the sheet, and the student thanks them and goes off with the sheet in hand.'
    star_points:
      site: 'A map of the sites handed to the office before the new campus is chosen'
      copy: 'Bring home a copy of the book of the lectures'
      last: 'Be there for the last lecture'
    milestones:
      order_given: '{date}: Sun Yat-sen orders the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and names Zou Lu to prepare it. Nobody in the city can yet say where this university is.'
      sun_dies: '{date}: Sun Yat-sen dies in Beijing.'
      renamed: '{date}: The National Government orders National Guangdong University renamed National Sun Yat-sen University.'
      lecture_jan27: '{date}: A Sunday. Sun Yat-sen gives the first of his lectures on the Three Principles of the People in the hall of the Higher Normal School.'
      lecture_feb17: '{date}: A Sunday. Sun Yat-sen lectures in the hall of the Higher Normal School. The series began on 27 January and this is the fourth lecture. At the side of the platform a man writes without looking up. That is Huang Changgu, who is there for every one.'
      zou_takes_up: '{date}: Zou Lu takes up the preparation.'
      hall_feb24: '{date}: A Sunday again. The fifth lecture is given in the hall today, and Zou Lu calls the students of the three schools together here to announce the preparation.'
      first_meeting: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad.'
      first_meeting_book: '{date}: The first preparatory meeting is held, with the graduation of the students of the three schools on its agenda. Of the thirty-five members of the preparatory committee, thirty-one have studied abroad. In this branch the names of the graduating classes of the three schools are by now in one book.'
      proofs_travel: 'Through March the text of the lectures goes from hand to hand. The notes of Huang Changgu are copied fair and sent to Sun Yat-sen, he has them carried to Zou Lu to be read, Zou Lu pastes slips on the pages and sends them back, Sun corrects them in his own hand, and they come round again.'
      preface: '{date}: Sun Yat-sen writes the preface for the pamphlet of the first lectures. It is printed at the end of March.'
      lecture_apr20: '{date}: A Sunday. The lectures in the hall have reached their second part.'
      measures_sent: '{date}: Zou Lu submits the measures for joining the three schools.'
      measures_approved: '{date}: The measures are approved.'
      shipai_chosen: 'In this year Sun Yat-sen tells Zou Lu to choose a new campus at Shipai, east of the city. The schools are spread over several places and hard to run.'
      last_lecture: '{date}: The sixteenth lecture. The third part has reached only its fourth lecture, and the rest is never given. Nobody in the hall knows this is the last.'
      classes_begin: '{date}: Classes begin at National Guangdong University.'
      ceremony: '{date}: The founding ceremony is held, with the motto Sun Yat-sen wrote: study widely, enquire carefully, think prudently, discern clearly, practise earnestly. He is not there, and he leaves Guangzhou two days later.'
      sunday_first: '{date}: {staff} is pressed in at the very back of the hall, a long way from the platform, able to see the man and unable to hear all of it.'
      sunday_stall: '{date}: {staff} cannot get into the hall and sets up a stall at the door. When the hall empties the crowd pours out, and everything is sold in no time.'
      sunday_sit: '{date}: {staff} finds a place in a back row of the hall and sits from the first word to the last without moving.'
      records_begun: '{date}: {staff} begins to copy the records of the three schools into one book.'
      records_read_aloud: '{date}: Nobody can read the hand of {staff}. So {staff} reads the names out and a clerk writes, and the three records begin to become one.'
      records_shut: '{date}: Copying the records takes reading, and {staff} has no part in it, but comes to know the gatekeepers of all three schools. To learn who is where, it is quicker to ask {staff} than to turn the pages.'
      site_offered: '{date}: Taken in by the office by now, {staff} draws the sites they have walked on one sheet, with the open ground at Shipai east of the city, and hands it to a clerk. In this branch the sheet lies with the papers on the new campus.'
      site_offered_bold: '{date}: Not yet asked inside, {staff} stops a clerk at the door of the office, says the open ground at Shipai east of the city is wide and the roads reach it, and goes over the sheet of the sites. The clerk keeps the sheet.'
      records_done: '{date}: The records of the three schools are one book, before the first preparatory meeting.'
      records_late: '{date}: The records of the three schools are one book. The first preparatory meeting has already been held.'
      sites_done: '{date}: {staff} has walked every one of the sites scattered over the city and drawn them on one sheet, with how long it takes to walk from each to the next.'
      asked_inside: '{date}: The clerks no longer leave {staff} waiting at the door, and call them in.'
      copy_kept: '{date}: {staff} wraps the pamphlet and puts it in with their things.'
      exhausted: '{date}: {staff} is so tired their hands shake, and has to rest.'
      spoiler: '{date}: {staff} knows that in two years this school will take the name of the man who ordered it. {staff} writes the sentence on the last page of the notebook and closes it.'
      spoiler_said: '{date}: {staff} tells a clerk at his copying that in two years this school will take the name of the man who ordered it. The clerk does not look up. The man is still alive, he says, and who names a school like that.'
      errand: '{date}: Pages with slips pasted on them go in and out of the copying room. {staff} is outside and sees only the back of whoever carries them.'
      errand_carried: '{date}: In this branch, the one sent to carry the pages is once {staff}. A sheaf of paper with slips pasted on it goes from one end to the other, and not a sheet is creased.'
      errand_frail: '{date}: {staff} is out of breath after a few stairs and cannot carry the pages, and sits at the door of the copying room watching the pages with their slips go in and out.'
      pamphlet: '{date}: The pamphlet, new from the printer, lies on the desk of a clerk. {staff} sees the cover through the window.'
      pamphlet_traded: '{date}: {staff} trades what they make with their own hands for a copy of the pamphlet, new from the printer.'
      pamphlet_given: '{date}: A clerk hands {staff} a copy of the pamphlet, new from the printer, and says everyone in the room is to have one.'
      homesick_may: '{date}: A month with nothing on record. {staff} keeps a tally in the notebook, and it reaches a hundred days. At the office a little over three days have gone by.'
      shipai_walk: '{date}: {staff} hears that the new campus is to be at Shipai, east of the city, and does not get there on this trip.'
      shipai_reached: '{date}: {staff} walks out of the city to the east and reaches Shipai. {staff} knows what will stand here, stays a long while, and draws what is here now.'
      shipai_frail: '{date}: {staff} knows what will stand at Shipai, east of the city. It is too far, and {staff} cannot walk it.'
      last_seat: '{date}: {staff} hears this lecture out from the usual place, and stays sitting a while after the hall has emptied.'
      last_stall: '{date}: {staff} brings more to the door of the hall than on other Sundays. {staff} knows that on the Sundays to come there will not be such a crowd at this door.'
    summary:
      near_death: '{staff} falls ill in Guangzhou, is pulled back by the recall charm, and wakes before the statue.'
      stay_and_gifts: '{staff} finished the work and did not come back. They left a note saying they want to stay and see the university open. Gifts will arrive later.'
      gave_up: '{staff} did not last to the end and woke before the statue, saying they could not stay in the Guangzhou of 1924 any longer.'
      legend: '{staff} woke before the statue with a pamphlet printed in March 1924 among their things. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      perfect: '{staff} came back to the statue. On the main timeline {base_D:i} matters lapsed with nobody asking any more, in this branch {D:i}. On the day they left, classes were {countdown:i} days away.'
      modest: '{staff} spent two hundred and ten days in Guangzhou, did what was within reach, and stood before the statue again. On the day they left, classes were {countdown:i} days away.'
    quotes:
      near_death:
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: Seven months is too long.
      legend:
        - trait: curious
          text: So that is how a book is made, a page corrected at a time.
        - text: When I left they had not yet begun classes.
      perfect:
        - trait: kind
          text: The people who came asking were answered in the end.
        - text: Did what had to be done.
      modest:
        - trait: glib
          text: I said the name would change in two years. Nobody believed me.
        - text: I was only there.
    hints:
      frail: This employee is frail and cannot walk the sites in the city, so there is no map to hand in for the first star. Send one who can walk.
      empty: A compass makes the walking of the sites quicker, so the map is more likely ready before the new campus is chosen.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    labels: {sick: '悬而未决的事', dead: '没人再问的事', deaths: '拖到没人再问的事', treated: '名册抄成的百分数', protected: '校址走熟的百分数'}
    identities:
      local_scholar: {name: 誊清屋里的帮手, cover: '{staff}说自己读过几年书，字还过得去，愿意帮着抄写。'}
      pen: {name: 外面来的记者, cover: '{staff}说自己替外面的报纸写稿，想看看这所新大学是怎样办起来的。'}
      wanderer: {name: 来听讲的游方人, cover: '{staff}说自己是游方的，听说这里星期天有人演讲，想来听听。'}
      maker: {name: 礼堂门口做小买卖的, cover: '{staff}说自己有一门手艺，想在人多的地方摆个摊。'}
      far_guest: {name: 船上下来的远客, cover: '{staff}说自己是跟船来的，要在广州住上一阵。'}
    # Lines written for one employee at one moment. Where there is one, it is read in place of the line of the moment.
    personal:
      records_read_aloud:
        s_fan: '{date}，沈凡的字潦草得连自己都要猜。他念名字，一位办事员写，他顺手把三本名册里重了的名字一个个标出来。'
        s_somchai: '{date}，颂猜识字，手笨，写出来的字没人认得。他念名字，一位办事员写。在寺里别人上房修屋顶，他也是在下面扶梯子的那一个。'
      sunday_first:
        s_fan: '{date}，沈凡挤在礼堂最后面，听不全，就数台下有多少人、多少人在记笔记，记在本子上。'
        s_samuel: '{date}，塞缪尔挤在礼堂最后面，踮着脚记。离得太远，他记下的一半是台下人的脸色。'
        s_amara: '{date}，阿玛拉挤在礼堂最后面，听不全。旁边一个学生站久了发晕，她扶他坐下，按着他的手腕数了一阵。'
      spoiler:
        s_fan: '{date}，沈凡知道两年以后这所学校会改用孙先生的名字，也知道一百年以后自己会从这所学校的铜像前出发。他把这两句话写在本子最后一页，合上了。'
        s_guilan: '{date}，桂兰知道两年以后这所学校要改名。那几个字她不会写，在心里记了一遍，没有对人说。'
        s_somchai: '{date}，颂猜知道两年以后这所学校会改用孙先生的名字。他把这句话写在本子最后一页，合上了，接着去问办事员在读什么。'
        s_carlos: '{date}，卡洛斯知道两年以后这所学校要改名。他不会写，就讲给炉子听，讲完自己先笑了。'
        s_samuel: '{date}，塞缪尔知道两年以后这所学校要改名，这是一条谁也没有的消息。他写在本子最后一页，又划掉了，没有地方可以发。'
        s_amara: '{date}，阿玛拉知道两年以后这所学校要改名。她把这句话写在本子最后一页，合上了。'
      pamphlet_given:
        s_fan: '{date}，办事员把一本刚印出来的《民族主义》递给沈凡，说屋里的人一人一本。沈凡先翻到序，看了落款的日子。'
        s_samuel: '{date}，办事员把一本刚印出来的《民族主义》递给塞缪尔。他问这是第几版，办事员说，头一版。'
      errand_frail:
        s_fan: '{date}，沈凡爬几级楼梯就喘，送不了稿。他坐在誊清的屋子门口，数一份稿子来回走了几趟。'
        s_somchai: '{date}，颂猜爬几级楼梯就喘，送不了稿。他坐在誊清的屋子门口，看贴着签注条的稿子进进出出。'
        s_samuel: '{date}，塞缪尔的肠胃又闹了几天，爬几级楼梯就喘。他坐在誊清的屋子门口，把每一趟送稿的时刻记了下来。'
      homesick_may:
        s_fan: '{date}，没有记载的一个月。沈凡在本子上画正字，画满了一百天，又在旁边算了一遍，事务所那边只过了三天多。'
        s_guilan: '{date}，没有记载的一个月。桂兰数着日子，家里的辣椒这时候该下地了。事务所那边只过了三天多。'
        s_somchai: '{date}，没有记载的一个月。颂猜还想亲眼看一次雪，广州的五月没有雪。事务所那边只过了三天多。'
        s_carlos: '{date}，没有记载的一个月。卡洛斯每天三点就醒，这里没有他的炉子，他站在别人的灶边看了一早上。事务所那边只过了三天多。'
        s_samuel: '{date}，没有记载的一个月，对一个记者最难熬。塞缪尔在本子上画正字，画满了一百天。事务所那边只过了三天多。'
        s_amara: '{date}，没有记载的一个月。阿玛拉算了算，这一百天里病房该添了多少个孩子。事务所那边只过了三天多。'
        s_jeanluc: '{date}，没有记载的一个月。让-吕克像记航海日志一样一天记一行，记满了一百天。事务所那边只过了三天多。'
      shipai_frail:
        s_fan: '{date}，沈凡知道城东的石牌以后会盖起什么。路太远，他走不到。'
        s_somchai: '{date}，颂猜知道城东的石牌以后是什么样子。路太远，他走不到。'
        s_samuel: '{date}，塞缪尔知道城东的石牌以后是什么样子，那会是一条好稿子。路太远，他走不到。'
      last_seat:
        s_fan: '{date}，沈凡坐在老位置上听完了这一讲，本子上记的场次停在十六。散场后他多坐了一会儿。'
        s_guilan: '{date}，桂兰坐在老位置上听完了这一讲。散场后她没有马上走，把长凳一条一条摆齐了。'
        s_somchai: '{date}，颂猜坐在老位置上听完了这一讲。散场后他多坐了一会儿，像在寺里等最后一声钟。'
        s_samuel: '{date}，塞缪尔坐在老位置上记完了这一讲。他知道这是最后一讲，本子上只写了场次，没有写最后两个字。'
        s_amara: '{date}，阿玛拉坐在老位置上听完了这一讲。散场后她多坐了一会儿，等最后一个人走出门。'
        s_jeanluc: '{date}，让-吕克站在老位置上听完了这一讲。散场后他最后一个离开，像船长最后一个下船。'
      records_shut:
        s_guilan: '{date}，桂兰只念到三年级，抄名册插不上手。她把三所学校的门房都认熟了，谁在哪里，问她比翻名册快。'
        s_carlos: '{date}，卡洛斯只会写自己的名字，抄名册插不上手。他把三所学校的门房都认熟了，谁在哪里，问他比翻名册快。'
      sunday_sit:
        s_guilan: '{date}，桂兰在礼堂后排坐下，膝盖不好，却从开讲坐到了散场。台上的话她没全听懂，旁边的学生渴了，她把自己的水递了过去。'
        s_somchai: '{date}，颂猜在寺里听了二十年讲经，在礼堂后排一坐到底。散场时他问旁边的学生最近在读什么。'
        s_jeanluc: '{date}，让-吕克腰不好，偏要站着听，在礼堂后排从开讲站到了散场。'
      pamphlet:
        s_guilan: '{date}，刚印出来的《民族主义》摆在办事员的桌上。桂兰隔着窗看了一眼，封面上的字她认得两个。'
        s_somchai: '{date}，刚印出来的《民族主义》摆在办事员的桌上。颂猜隔着窗看了一眼封面。他知道这本书后来印了多少，只问办事员读到哪里了。'
        s_amara: '{date}，刚印出来的《民族主义》摆在办事员的桌上。阿玛拉隔着窗看了一眼，轻轻哼起歌来。'
        s_jeanluc: '{date}，刚印出来的《民族主义》摆在办事员的桌上。让-吕克隔着窗看了一眼封面。'
      errand:
        s_guilan: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。桂兰在门外择菜，谁出来都问一句吃了没有。'
        s_amara: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。阿玛拉在门外，只看得见送稿人的背影，听脚步就知道那人赶得很急。'
        s_jeanluc: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。让-吕克在门外教门房的孩子打绳结，只看得见送稿人的背影。'
      shipai_reached:
        s_guilan: '{date}，桂兰膝盖不好，还是一步一步走到了石牌。那里只有田，她蹲下来捏了一把土，说这地种得出东西。'
        s_carlos: '{date}，卡洛斯推着车出城往东，走到了石牌，回来说那里只有田。他知道那里以后会盖起一所大学，还是说，只有田。'
        s_amara: '{date}，阿玛拉出城往东，走到了石牌。她知道这里以后是什么样子，站了很久，把眼前的样子画了下来，画得很慢。'
      sunday_stall:
        s_carlos: '{date}，卡洛斯听不懂里面讲什么，在礼堂门口支起炉子烤面包。散场时人涌出来，面包一会儿就卖完了，照老习惯又卖便宜了。'
      pamphlet_traded:
        s_carlos: '{date}，卡洛斯拿一炉面包换了一本刚印出来的《民族主义》。他自己读不了，说带回去给家里想接手面包店的那个孩子。'
      errand_carried:
        s_carlos: '{date}，这条分支里，被叫去送稿的人有一回是卡洛斯。一叠贴着签注条的纸，他一个字也不认得，一张也没弄皱。'
      last_stall:
        s_carlos: '{date}，卡洛斯多烤了一炉。他知道以后的星期天，这扇门口不会再有这么多人，剩下的面包都送了出去。'
      records_begun:
        s_amara: '{date}，阿玛拉开始抄三所学校的名册。书面的东西她一向吃力，抄一行，请办事员对一行。'
      spoiler_said:
        s_jeanluc: '{date}，让-吕克对一位抄写的办事员说，两年以后这所学校会改用孙先生的名字，嗓门一点没提高。办事员头也没抬，说先生人还在，哪有这样起校名的。'
      shipai_walk:
        s_jeanluc: '{date}，让-吕克听说新校址选在城东的石牌。他的膝盖走不了那么远，在码头上朝东望了一阵。'
    name: 广州 1924
    short: 广州
    place_name: 广州，高等师范的礼堂
    tags:
      - thought
      - education
      - university
      - c20
      - guangzhou
      - history
    event_titles:
      asked_the_way: 问路
    plots: {}
    blurb: 一座礼堂里同时在成两件事，一所大学和一本书。七个月，从合并学校的命令到开学前十八天。游戏从这里开始。
    handle_label: 名册合成一本
    protagonist: 孙中山
    protagonist_role: 下令把三所学校并成一所大学的政治家，星期天在这座礼堂演讲
    stay: 停留七个事务所日，历史 210 天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: '1924 年 2 月 4 日，孙中山下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。'
          check: true
        - text: '1924 年 1 月 27 日到 8 月 24 日，孙中山利用星期天在高等师范的礼堂演讲，共十六讲。黄昌谷每一讲都随同速记，邹鲁校读誊清的讲稿并贴签注条，孙中山亲笔修正。'
          check: true
        - text: '邹鲁 2 月 21 日接手筹备。2 月 24 日他在礼堂召集三所学校的学生宣布此事，3 月 3 日开第一次筹备会议，议题里有三所学校学生的毕业问题。'
          check: true
        - text: '头几讲在三月底印成单行本，孙中山 3 月 30 日为它写了序。6 月 3 日邹鲁呈报归并三校的办法，6 月 6 日获批准。'
          check: true
        - text: '9 月 19 日开学，11 月 11 日举行成立典礼，用了孙中山写的校训。孙中山 1925 年 3 月 12 日在北京去世，1926 年这所大学改名为国立中山大学。'
          check: true
      regret:
        - '你 9 月 1 日离开。开学在 19 日，校训是那以后的事。'
        - '演讲停在第十六讲。台下没有人知道那是最后一讲。'
    events:
      asked_the_way: '{date}，一个拿着信的新生问{staff}某间办公室怎么走。{staff}也说不清，陪着找了半天。'
      asked_the_way_shown: '{date}，一个拿着信的新生问{staff}某间办公室怎么走。{staff}在图上指给他看，他道了谢，拿着图走了。'
    star_points:
      site: '选址之前，把走熟的校址画成图交给筹备处'
      copy: '带回一本演讲印成的书'
      last: '待到最后一讲'
    milestones:
      order_given: '{date}，孙中山下令把国立高等师范学校、广东法科大学和广东农业专门学校并成国立广东大学，派邹鲁筹备。城里还没有人说得清这所大学在哪里。'
      sun_dies: '{date}，孙中山在北京逝世。'
      renamed: '{date}，国民政府下令把国立广东大学改名为国立中山大学。'
      lecture_jan27: '{date}，星期天。孙中山在高等师范的礼堂讲三民主义的第一讲。'
      lecture_feb17: '{date}，星期天。孙中山在高等师范的礼堂演讲，这个系列从 1 月 27 日讲起，这一天是第四讲。台侧有人埋头速记，那是黄昌谷，每一讲他都在。'
      zou_takes_up: '{date}，邹鲁就任筹备主任。'
      hall_feb24: '{date}，又是星期天。这一天礼堂里有第五讲，邹鲁也在这里召集三所学校的学生，宣布筹建。'
      first_meeting: '{date}，第一次筹备会议，议题里有三所学校学生的毕业问题。三十五名筹备委员里，三十一人留过洋。'
      first_meeting_book: '{date}，第一次筹备会议，议题里有三所学校学生的毕业问题。三十五名筹备委员里，三十一人留过洋。这条分支里，三所学校毕业班的名字这时已经抄在同一本册子上。'
      proofs_travel: '三月里，讲稿在几个人手里来回走。黄昌谷的笔记誊清后送给孙中山，孙中山叫人送给邹鲁校读，邹鲁在稿上贴签注条送回去，孙中山亲笔改，改完又送来。'
      preface: '{date}，孙中山为《民族主义》单行本写了序。单行本在三月底印出。'
      lecture_apr20: '{date}，星期天。礼堂里讲到了民权主义。'
      measures_sent: '{date}，邹鲁呈报归并三校的办法。'
      measures_approved: '{date}，办法获批准。'
      shipai_chosen: '这一年，孙中山让邹鲁在城东的石牌选新校址。几所学校散在城里好几处，不便管理。'
      last_lecture: '{date}，第十六讲。民生主义只讲到第四讲，后面的没有再讲。台下没有人知道这是最后一讲。'
      classes_begin: '{date}，国立广东大学正式开学。'
      ceremony: '{date}，举行成立典礼，用的是孙中山写的校训，博学、审问、慎思、明辨、笃行。他本人没有到场，两天后离开广州。'
      sunday_first: '{date}，{staff}挤在礼堂的最后面，离讲台很远，看得见人，听不全话。'
      sunday_stall: '{date}，{staff}进不去礼堂，在门口摆了个摊。散场时人涌出来，东西一会儿就卖完了。'
      sunday_sit: '{date}，{staff}在礼堂后排找了个位置，从开讲坐到散场，一动没动。'
      records_begun: '{date}，{staff}开始把三所学校的名册往同一本册子上抄。'
      records_read_aloud: '{date}，{staff}的字没人认得。{staff}念名字，一位办事员写，三本名册开始并成一本。'
      records_shut: '{date}，抄名册要识字，{staff}插不上手，倒把三所学校的门房都认熟了。谁在哪里，问{staff}比翻名册快。'
      site_offered: '{date}，已经被筹备处认下的{staff}把走熟的几处校址画在一张纸上，连同城东石牌那一片空地，交给了办事员。这条分支里，这张图和选址的文书放在了一起。'
      site_offered_bold: '{date}，{staff}还没被请进门，就在筹备处门口拦住办事员，说城东石牌那一片地方大，路也通，拿着自己画的图讲了一遍。办事员把图收下了。'
      records_done: '{date}，三所学校的名册合成了一本，赶在第一次筹备会议之前。'
      records_late: '{date}，三所学校的名册合成了一本。第一次筹备会议已经开过了。'
      sites_done: '{date}，{staff}把散在城里的几处校址都走了一遍，画成一张图，注上从这一处到那一处要走多久。'
      asked_inside: '{date}，办事员不再让{staff}在门外等，叫进了屋。'
      copy_kept: '{date}，{staff}把那本《民族主义》包好，放进了行李。'
      exhausted: '{date}，{staff}累得手发抖，不得不歇下来。'
      spoiler: '{date}，{staff}知道两年以后这所学校会改用孙先生的名字。{staff}把这句话写在本子最后一页，合上了。'
      spoiler_said: '{date}，{staff}对一位抄写的办事员说，两年以后这所学校会改用孙先生的名字。办事员头也没抬，说先生人还在，哪有这样起校名的。'
      errand: '{date}，贴着签注条的讲稿从誊清的屋子里进进出出。{staff}在门外，只看得见送稿人的背影。'
      errand_carried: '{date}，这条分支里，被叫去送稿的人有一回是{staff}。一叠贴着签注条的纸，从这头送到那头，一张也没弄皱。'
      errand_frail: '{date}，{staff}爬几级楼梯就喘，送不了稿，坐在誊清的屋子门口，看贴着签注条的稿子进进出出。'
      pamphlet: '{date}，刚印出来的《民族主义》摆在办事员的桌上。{staff}隔着窗看了一眼封面。'
      pamphlet_traded: '{date}，{staff}拿自己亲手做的东西，跟人换了一本刚印出来的《民族主义》。'
      pamphlet_given: '{date}，办事员把一本刚印出来的《民族主义》递给{staff}，说屋里的人一人一本。'
      homesick_may: '{date}，没有记载的一个月。{staff}在本子上画正字，画满了一百天。事务所那边只过了三天多。'
      shipai_walk: '{date}，{staff}听说新校址选在城东的石牌，这一趟没有去成。'
      shipai_reached: '{date}，{staff}出城往东，走到了石牌。{staff}知道这里以后是什么样子，站了很久，把眼前的样子画了下来。'
      shipai_frail: '{date}，{staff}知道城东的石牌以后是什么样子。路太远，{staff}走不到。'
      last_seat: '{date}，{staff}坐在老位置上听完了这一讲。散场后多坐了一会儿。'
      last_stall: '{date}，{staff}在礼堂门口比平常多备了一份货。{staff}知道以后的星期天，这扇门口不会再有这么多人。'
    summary:
      near_death: '{staff}在广州病倒，被召回符拉了回来，在铜像前醒来。'
      stay_and_gifts: '{staff}做完了事，却没有回来。留下一张字条，说想留下来看着这所大学开学。礼物之后会到。'
      gave_up: '{staff}没有撑到最后，在铜像前醒来，说 1924 年的广州待不下去了。'
      legend: '{staff}在铜像前醒来，行李里有一本 1924 年三月印的《民族主义》。主时间线上有 {base_D:i} 件事拖到没人再问，这条分支里是 {D:i} 件。走的那天，离开学还有 {countdown:i} 天。'
      perfect: '{staff}回到了铜像前。主时间线上有 {base_D:i} 件事拖到没人再问，这条分支里是 {D:i} 件。走的那天，离开学还有 {countdown:i} 天。'
      modest: '{staff}在广州待了二百一十天，做了力所能及的事，又站在了铜像前。走的那天，离开学还有 {countdown:i} 天。'
    quotes:
      near_death:
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 七个月太长了。
      legend:
        - trait: curious
          text: 原来一本书是这样一页一页改出来的。
        - text: 我走的时候，他们还没有开学。
      perfect:
        - trait: kind
          text: 来问的人，后来都有人答了。
        - text: 该做的做了。
      modest:
        - trait: glib
          text: 我说两年后这里会改名，没有人信。
        - text: 我只是在那里待过。
    hints:
      frail: 这位员工体弱，走不遍城里的校址，画不成图，第一颗星拿不到。换一位走得动的。
      empty: 带上指南针，走校址快一些，选址之前更容易把图画成。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
hook:
  en: 'One hall, and two things being made in it'
  zh: '一座礼堂里，同时在成两件事'
# Every fact the story may lean on. checked: two_sources, official_record (the record of the institution itself) or single. level: usable, careful or unused. use: where it appears.
facts:
  f01:
    date: '1924-02-04'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [sysu_chronicle, sysu_history_articles]
    text:
      en: 'Sun Yat-sen orders the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and names Zou Lu to prepare it.'
      zh: '孙中山下令把国立高等师范学校、广东法科大学、广东农业专门学校合并为国立广东大学，派邹鲁筹备。'
  f02:
    date: '1924-02-21'
    checked: official_record
    level: usable
    use: [history]
    sources: [sysu_chronicle]
    text:
      en: 'Zou Lu takes up the preparation.'
      zh: '邹鲁就任筹备主任。'
  f03:
    date: '1924-02-24'
    checked: official_record
    level: usable
    use: [history]
    sources: [sysu_history_articles]
    text:
      en: 'Zou Lu calls the students of the three schools together in the hall of the Higher Normal School and announces the preparation.'
      zh: '邹鲁在高等师范礼堂召集三校学生，宣布筹建并报告进度。'
  f04:
    date: '1924-03-03'
    checked: official_record
    level: usable
    use: [history]
    sources: [sysu_history_articles]
    text:
      en: 'The first preparatory meeting is held, and the graduation of the students of the three schools is on its agenda.'
      zh: '首次筹备会议召开，议题包括三校学生的毕业问题。'
  f05:
    date: '1924-06-06'
    checked: official_record
    level: usable
    use: [history, wiki]
    sources: [sysu_chronicle]
    text:
      en: 'The measures for joining the schools, submitted on 3 June, are approved.'
      zh: '6 月 3 日呈报的三校归并办法获批准。'
  f06:
    date: '1924-06-09'
    checked: single
    level: usable
    use: []
    sources: []
    text:
      en: 'Zou Lu becomes the president.'
      zh: '邹鲁出任校长。'
    note: 'Seen in one summary only, so it is not used.'
  f07:
    date: '1924'
    checked: official_record
    level: usable
    use: [history, wiki]
    sources: [sysu_history_articles]
    text:
      en: 'The schools are spread over several places and hard to run, Sun tells Zou Lu to choose a new campus at Shipai, and land is marked out there.'
      zh: '各校分散各处，管理不便，孙中山命邹鲁择石牌为新校址，当年划定土地。'
    note: 'No date inside the year is given, so the line in the report carries no date.'
  f08:
    date: '1924-09-19'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [sysu_chronicle]
    text:
      en: 'Classes begin.'
      zh: '正式开学。'
  f09:
    date: '1924-11-11'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [sysu_chronicle, sysu_history_articles]
    text:
      en: 'The founding ceremony is held with the motto Sun wrote. He is not there, and he leaves Guangzhou on 13 November.'
      zh: '举行成立典礼，用孙中山写的校训。他本人未到场，11 月 13 日离开广州。'
    note: 'One source gives 12 November for the ceremony.'
  f10:
    date: '1924-12-31'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [chnmuseum_sun_1925, people_daily_sun_last_days]
    text:
      en: 'Sun reaches Beijing.'
      zh: '孙中山抵达北京。'
  f11:
    date: '1925-01-26'
    checked: two_sources
    level: careful
    use: [story, wiki]
    sources: [chnmuseum_sun_1925, people_daily_sun_last_days]
    text:
      en: 'He enters the Peking Union Medical College Hospital and is operated on, and cancer is found.'
      zh: '住进协和医院并接受手术，发现癌症。'
    note: 'Illness: written as a plain fact, with no detail.'
  f12:
    date: '1925-02-18'
    checked: two_sources
    level: careful
    use: [story]
    sources: [chnmuseum_sun_1925, people_daily_sun_last_days]
    text:
      en: 'He is moved to the residence in Tieshizi Hutong.'
      zh: '移居铁狮子胡同行馆。'
  f13:
    date: '1925-03-12'
    checked: two_sources
    level: careful
    use: [story, wiki]
    sources: [chnmuseum_sun_1925, people_daily_sun_last_days]
    text:
      en: 'He dies at the residence at half past nine in the morning.'
      zh: '上午九时三十分在行馆逝世。'
    note: 'Death: written as a plain fact.'
  f14:
    date: '1925'
    checked: two_sources
    level: careful
    use: []
    sources: [people_daily_sun_last_days]
    text:
      en: 'The usual account says liver cancer, the hospital records say cancer of the gallbladder.'
      zh: '通行说法是肝癌，协和医院的病历记载为胆囊癌。'
    note: 'The sources disagree, so the game says cancer and no more.'
  f15:
    date: '1926-08-05'
    checked: official_record
    level: usable
    use: [story]
    sources: [sysu_history_articles]
    text:
      en: 'The 38th school affairs meeting resolves to rename the university and to ask the government to approve it.'
      zh: '第 38 次校务会议决议改名为国立中山大学，呈报国民政府批准。'
  f16:
    date: '1926-08-17'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [sysu_history_articles, wikipedia_sysu_history]
    text:
      en: 'The National Government orders the university renamed National Sun Yat-sen University.'
      zh: '国民政府下令改国立广东大学为国立中山大学。'
  f17:
    date: '1926'
    checked: single
    level: unused
    use: []
    sources: []
    text:
      en: 'Other accounts date the renaming to 17 July 1926, or to a proposal of 1925.'
      zh: '另有说法称 1926 年 7 月 17 日更名，或 1925 年已有提议并获批准。'
    note: 'The accounts disagree with the order of 17 August.'
  f18:
    date: '1924'
    checked: single
    level: unused
    use: []
    sources: []
    text:
      en: 'Villagers at Shipai objected to the new campus.'
      zh: '石牌的村民反对新校址。'
    note: 'Only a heading was seen, no text, so it is not a fact here.'
  f19:
    date: '1924'
    checked: single
    level: unused
    use: []
    sources: []
    text:
      en: 'The names of the members of the preparatory committee.'
      zh: '筹备委员的名单。'
    note: 'The names are left out. The count of the members is fact g5.'
  g1:
    date: '1924-01-27'
    checked: two_sources
    level: usable
    use: [history, story, wiki]
    sources: [sysu_news_lectures, sswgw_minsheng, wikisource_sanmin]
    text:
      en: 'From 27 January to 24 August 1924 Sun Yat-sen lectures on Sundays in the hall of the National Higher Normal School, sixteen lectures in three parts. The fourth lecture of the first part is dated 17 February and the fifth 24 February, a lecture of the second part is dated 20 April, and the series stops on 24 August at the fourth lecture of the third part.'
      zh: '1924 年 1 月 27 日到 8 月 24 日，孙中山利用星期天在国立广东高等师范学校礼堂演讲三民主义，共十六讲。民族主义第四讲的讲稿日期是 2 月 17 日，第五讲是 2 月 24 日，4 月 20 日在民权主义之内，8 月 24 日讲到民生主义第四讲后停止。'
    note: 'The fifth lecture and the assembly of fact f03 fall on the same day in the same hall. Which came first is not recorded, so the report does not say.'
  g2:
    date: '1924'
    checked: official_record
    level: usable
    use: [history, wiki]
    sources: [sysu_news_lectures]
    text:
      en: 'Huang Changgu goes with Sun Yat-sen to every lecture and takes it down in shorthand, and afterwards the notes are collated and published.'
      zh: '黄昌谷每次随孙中山前往，速记演讲内容，随后校译、整理并发表。'
  g3:
    date: '1924'
    checked: official_record
    level: usable
    use: [history, wiki]
    sources: [sysu_news_lectures]
    text:
      en: 'Zou Lu tells how the text was read: the notes were copied fair and given to Sun Yat-sen, who had them sent to Zou Lu; Zou Lu pasted slips with his remarks on the pages; Sun corrected the text in his own hand, and it went back and forth until Sun was satisfied.'
      zh: '邹鲁自述校读的经过：笔记誊清后先呈孙中山，孙中山叫人送给邹鲁校读，邹鲁用签注条贴在稿上，孙中山亲笔修正，往复多次，直到孙中山认为妥适。'
  g4:
    date: '1924-03-30'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [sysu_news_lectures]
    text:
      en: 'The lectures are first printed in the weekly of the party, and at the end of March the first part appears as a pamphlet, for which Sun Yat-sen writes a preface on 30 March.'
      zh: '讲稿先在《中国国民党周刊》发表，三月底以《民族主义》为名出版单行本，孙中山 3 月 30 日为单行本作序。'
  g5:
    date: '1924'
    checked: official_record
    level: usable
    use: [history]
    sources: [sysu_news_lectures]
    text:
      en: 'Of the thirty-five members of the preparatory committee, thirty-one have returned from study abroad.'
      zh: '三十五名筹备委员中，三十一人从海外留学归来。'
  g6:
    date: '1924'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sysu_news_lectures]
    text:
      en: 'The Higher Normal School stands on the old site of the examination compound, and its hall is on what is now Wenming Road in Guangzhou.'
      zh: '广东高等师范建在原贡院旧址上，礼堂在今广州文明路。'
    note: 'The street number, 215 Wenming Road, was given by the author of the card and still needs a written source.'
# What was said. A line of the person is written only when it is recorded, and then it names its fact and its sources. A line of a bystander is invented and says so.
dialogue:
  motto:
    who: sun_yat_sen_guangzhou
    recorded: true
    fact: f09
    sources: [sysu_chronicle, sysu_history_articles]
    text:
      en: 'Study widely, enquire carefully, think prudently, discern clearly, practise earnestly.'
      zh: '博学、审问、慎思、明辨、笃行。'
  clerk_name:
    who: clerk
    recorded: false
    text:
      en: 'The man is still alive. Who names a school like that?'
      zh: '先生人还在，哪有这样起校名的。'
# The people who were there and are made up for the game. None of them has a name, and none of them has a star of their own.
bystanders:
  clerk:
    invented: true
    text:
      en: 'A clerk of the preparatory office, who copies and carries.'
      zh: '筹备处的一位办事员，抄写，也跑腿。'
  gatekeeper:
    invented: true
    text:
      en: 'The gatekeepers of the three schools, who know who is where.'
      zh: '三所学校的门房，知道谁在哪里。'
  student:
    invented: true
    text:
      en: 'A new student with a letter, who asks the way.'
      zh: '一个拿着信的新生，来问路。'
# The written check of the story, for the reviewer.
self_check:
