    text:
      en:
        name: "From the statue to a new university"
        place: "Guangzhou"
        figure: "Sun Yat-sen"
        story: "Standing before the statue of Sun Yat-sen at Sun Yat-sen University, you are carried back to Guangzhou on 4 February 1924, the day he orders three schools joined into National Guangdong University and names Zou Lu to prepare it. In the same months he lectures on Sundays in the hall of the Higher Normal School, and the notes of the lectures go back and forth until they are a book. Classes begin on 19 September, and the founding ceremony is held on 11 November with the motto he wrote. He dies in Beijing on 12 March 1925, and in 1926 the university takes his name."
        relic: "The statue of Sun Yat-sen"
        relic_desc: "The statue on the campus of Sun Yat-sen University. It is the way to Guangzhou in 1924 and is not an antique, so it cannot be sold."
        points:
          p1: "Hand in a map of the sites before the new campus is chosen"
          p2: "Bring home a copy of the book of the lectures"
          p3: "Be there for the last lecture"
        vignettes:
          slips: 'A clerk made up for the game is about to copy a page that has a slip pasted over two lines. You ask which hand wrote the slip and which wrote the page. He copies the page first and leaves the slip where it is.'
          back_row: 'A student made up for the game cannot find a seat and keeps standing up to look. You move along the bench. He sits through the rest without a word and nods to you as the hall empties.'
          hundred: 'You keep a tally of the days in the back of your notebook, five strokes to a mark. When it reaches a hundred, a clerk made up for the game asks what you are counting. You tell him, days.'
      zh:
        name: "从铜像到一所新大学"
        place: "广州"
        figure: "孙中山"
        story: "你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。同一段日子里，他星期天在高等师范的礼堂演讲，讲稿在几个人手里来回走，后来成了一本书。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。"
        relic: "孙中山铜像"
        relic_desc: "中山大学校园里的孙中山铜像。它是通往 1924 年广州的穿越媒介，不是古董，不能出售。"
        points:
          p1: "选址之前，把走熟的校址画成图交给筹备处"
          p2: "带回一本演讲印成的书"
          p3: "待到最后一讲"
        vignettes:
          slips: '一位编出来的办事员正要抄一页稿子，稿上有一张签条盖住了两行。你问他签条是谁的字，稿子又是谁的字。他先抄了稿子，签条留在原处没有动。'
          back_row: '一位编出来的学生找不到座位，老是站起来张望。你往里挪了挪。他坐下来听完了后半场，一句话没说，散场时朝你点了点头。'
          hundred: '你在本子最后一页画正字，一天一笔。画满一百天的时候，一位编出来的办事员问你在数什么。你说，日子。'
text:
  en:
    name: "Sun Yat-sen"
    text: "Chinese revolutionary and political leader, 1866 to 1925. On 4 February 1924 he ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it. From 27 January to 24 August 1924 he lectured on Sundays in the hall of the Higher Normal School, sixteen lectures in all, which were taken down, revised and printed. Classes began on 19 September, and he wrote the motto used at the founding ceremony on 11 November. He reached Beijing on 31 December 1924, was operated on for cancer on 26 January 1925, and died there on 12 March 1925. On 17 August 1926 the National Government ordered the university renamed National Sun Yat-sen University."
  zh:
    name: "孙中山"
    text: "中国革命家和政治领袖，1866 年生，1925 年去世。1924 年 2 月 4 日他下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。1924 年 1 月 27 日到 8 月 24 日，他利用星期天在高等师范的礼堂演讲，共十六讲，讲稿经记录、校改后印行。9 月 19 日开学，11 月 11 日成立典礼上用的校训是他写的。他 1924 年 12 月 31 日抵达北京，1925 年 1 月 26 日因癌症接受手术，3 月 12 日在北京去世。1926 年 8 月 17 日国民政府下令把这所大学改名为国立中山大学。"
