order: 232
events:
  sun_yat_sen_guangzhou:
    order: 222
    year: 1924
    lon: 113.27
    lat: 23.13
    region: asia
    field: thought
    tier: 1
    era: sun_yat_sen_1924
    channels: {H: 1}
    start: true
    scene:
      points:
        - {id: p1, kind: care, req: {"trait":["kind","patient","attached","quiet"]}}
        - {id: p2, kind: notice, req: {"stat":{"wit":5}}}
        - {id: p3, kind: hold, req: {"any":[{"trait":["patient","methodical","vigil"]},{"stat":{"will":6}}]}}
    text:
      en:
        name: "From the statue to a new university"
        place: "Guangzhou"
        figure: "Sun Yat-sen"
        story: "Standing before the statue of Sun Yat-sen at Sun Yat-sen University, you are carried back to Guangzhou on 4 February 1924, the day he orders three schools joined into National Guangdong University and names Zou Lu to prepare it. Classes begin on 19 September, and the founding ceremony is held on 11 November with the motto he wrote. He dies in Beijing on 12 March 1925, and in 1926 the university takes his name."
        relic: "A brass school badge"
        relic_desc: "A small badge from the first years of the university."
        points:
          p1: "Be of use to the people who come asking"
          p2: "Put a clear map of the schools in every hand"
          p3: "Keep the work going until the preparation begins"
      zh:
        name: "从铜像到一所新大学"
        place: "广州"
        figure: "孙中山"
        story: "你站在中山大学的孙中山像前，被带回 1924 年 2 月 4 日的广州，这一天他下令把三所学校合并为国立广东大学，派邹鲁筹备。9 月 19 日开学，11 月 11 日举行成立典礼，用的是他写的校训。1925 年 3 月 12 日他在北京去世，1926 年这所大学以他的名字命名。"
        relic: "一枚铜质校徽"
        relic_desc: "这所大学最初几年的一枚小徽章。"
        points:
          p1: "帮上每一个来问的人"
          p2: "让清楚的简图人手一份"
          p3: "把事情一直推到筹备开始"
  sun_yat_sen_beijing_1925:
    order: 223
    year: 1925
    lon: 116.41
    lat: 39.92
    region: asia
    field: thought
    tier: 1
    stay: 7
    after: sun_yat_sen_guangzhou
    channels: {C: 1, G: 2}
    regret: true
    scene:
      points:
        - {id: p1, kind: hold, req: {"any":[{"trait":["vigil","patient"]},{"stat":{"will":6}}]}}
        - {id: p2, kind: care, req: {"any":[{"job":["nurse","caregiver","doctor","physician","paramedic","midwife"]},{"trait":["kind","attached"]}]}}
        - {id: p3, kind: trust, redeem: true, req: {"trait":["attached","faithful","kind","quiet"]}}
    text:
      en:
        name: "The last winter in Beijing"
        place: "Beijing"
        figure: "Sun Yat-sen"
        story: "Sun Yat-sen reaches Beijing on 31 December 1924, already ill. On 26 January 1925 he enters the Peking Union Medical College Hospital and is operated on, and the doctors find cancer. On 18 February he is moved to the residence in Tieshizi Hutong, and he dies there on the morning of 12 March. You can change none of this. You can keep watch."
        relic: "A watcher's scarf"
        relic_desc: "A plain wool scarf, worn through the nights of one winter."
        points:
          p1: "Keep watch through the long nights in the corridor and at the gate"
          p2: "Boil water, carry meals and run errands for those who are keeping watch"
          p3: "Leave a school badge from Guangzhou at the door, as a token of regard"
      zh:
        name: "北京的最后一个冬天"
        place: "北京"
        figure: "孙中山"
        story: "1924 年 12 月 31 日孙中山抵达北京，已经带病。1925 年 1 月 26 日他住进协和医院并接受手术，医生发现是癌症。2 月 18 日他移到铁狮子胡同的行馆，3 月 12 日上午在那里去世。这些你一样也改变不了，你能做的是守着。"
        relic: "一条守夜人的围巾"
        relic_desc: "一条普通的羊毛围巾，陪人熬过了一个冬天的许多个夜晚。"
        points:
          p1: "在走廊里和大门外守过一个个长夜"
          p2: "替守在这里的人烧水、送饭、跑腿"
          p3: "把一枚从广州带来的校徽留在门口，作为一份心意"
  sun_yat_sen_university_1926:
    order: 224
    year: 1926
    lon: 113.27
    lat: 23.13
    region: asia
    field: thought
    tier: 1
    stay: 5
    after: sun_yat_sen_beijing_1925
    channels: {H: 1}
    scene:
      points:
        - {id: p1, kind: notice, req: {"stat":{"wit":5}}}
        - {id: p2, kind: hold, req: {"any":[{"job":["archivist","proofreader","accountant"]},{"trait":["methodical"]}]}}
        - {id: p3, kind: trust, req: {"trait":["kind","cheerful","cosmopolitan","patient"]}}
    text:
      en:
        name: "The university takes his name"
        place: "Guangzhou"
        figure: "Sun Yat-sen"
        story: "On 5 August 1926 the school affairs meeting of National Guangdong University resolves to rename the university after Sun Yat-sen and to ask the government to approve it. On 17 August the National Government orders the change, and the university becomes National Sun Yat-sen University. He has been dead for a year and five months. The statue you set out from stands on its campus."
        relic: "A wooden sign with the new name"
        relic_desc: "A narrow board, freshly painted, from the first days of the new name."
        points:
          p1: "Find the resolution in the record of the meeting"
          p2: "Sort and file the papers and seals that carry the old name"
          p3: "Help the new students learn the new name and where to go"
      zh:
        name: "这所大学以他的名字命名"
        place: "广州"
        figure: "孙中山"
        story: "1926 年 8 月 5 日，国立广东大学的校务会议决议把学校改名纪念孙中山，并呈请政府批准。8 月 17 日国民政府下令改名，学校成为国立中山大学。这时他已经去世一年零五个月。你出发时面前的那座铜像，就立在这所大学的校园里。"
        relic: "一块写着新校名的木牌"
        relic_desc: "一块窄木板，漆还是新的，来自新校名最初的几天。"
        points:
          p1: "在会议记录里找到那条决议"
          p2: "把带着旧校名的文件和印章清点归档"
          p3: "帮新来的学生认识新校名，知道往哪里去"
text:
  en:
    name: "Sun Yat-sen"
    text: "Chinese revolutionary and political leader, 1866 to 1925. On 4 February 1924 he ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University, and named Zou Lu to prepare it. Classes began on 19 September, and he wrote the motto used at the founding ceremony on 11 November. He reached Beijing on 31 December 1924, was operated on for cancer on 26 January 1925, and died there on 12 March 1925. On 17 August 1926 the National Government ordered the university renamed National Sun Yat-sen University."
  zh:
    name: "孙中山"
    text: "中国革命家和政治领袖，1866 年生，1925 年去世。1924 年 2 月 4 日他下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学，派邹鲁筹备。9 月 19 日开学，11 月 11 日成立典礼上用的校训是他写的。他 1924 年 12 月 31 日抵达北京，1925 年 1 月 26 日因癌症接受手术，3 月 12 日在北京去世。1926 年 8 月 17 日国民政府下令把这所大学改名为国立中山大学。"
