    text:
      en:
        name: 'The fold remembered'
        place: "Mani"
        figure: "Maya scribes"
        story: 'On 12 July 1562 colonial authorities burned Maya books and other objects in public at Maní. Maya communities continued making and handing down knowledge. Few folding books made before the Spanish conquest survive.'
        relic: 'A blank practice fold'
        relic_desc: 'A fictional fold offered by its keeper.'
        points:
          p1: 'Ask the keeper which book she wants a trusted reader in another village to hold, and help her make that handover'
        points_fail:
          p1: 'The person she chose leaves without the book. Its keeper has to decide where it can stay.'
        shift:
          p1:
            was: '12 July 1562: at Maní a great many Maya folding books were burned in public. Of the books made before the conquest, only a handful survive anywhere.'
            now: 'In this branch the keeper chooses who will look after one book. It reaches the next reader and remains in Maya hands through the burning.'
            who: maya_codices_mani
            bio: 'In this branch a book from Maní passed to a reader chosen by its keeper before the public burning in 1562.'
        vignettes:
          fold: 'The keeper lays two blank folds on a bench and asks her neighbour which one opened first in the book he remembers. You hold the paper while they compare. He cannot place the second fold. She keeps the first and leaves the other loose for the next time they talk.'
          listen: 'The neighbour starts to retell the part the keeper lost, but they remember the order differently. You listen while each finishes. They agree on the first fold and leave the second undecided. The keeper asks you to leave her the copy that carries both accounts.'
          survive: 'You have seen a surviving Maya codex in a later collection. The keeper asks whether you can say which book her neighbour remembers. You can name the collection but cannot connect its pages to this room. She hands you a blank practice fold for the walk back. The book they were remembering remains with their account of it.'
      zh:
        name: '记住书页怎样折'
        place: "马尼"
        figure: "玛雅书吏"
        story: '1562 年 7 月 12 日，殖民当局在马尼公开焚烧玛雅书籍和其他器物。玛雅社群继续创造和传承知识。西班牙征服之前制作的折页书，今天只存下少数几部。'
        relic: '一张空白练习折页'
        relic_desc: '守书人自愿交给员工的练习折页。'
        points:
          p1: '问守书人愿把哪一本交给邻村熟识的读者，帮她亲手交托'
        points_fail:
          p1: '她选的读者走时没能带上书。接下来把书放在哪里，还得由守书人自己决定。'
        shift:
          p1:
            was: '1562 年 7 月 12 日，马尼当众烧毁了大批玛雅折页书。征服以前的玛雅书，存世的只有寥寥几部。'
            now: '这条分支里，守书人替其中一本书选好了接手的人。书送到了下一位读者手里，焚书过后，还留在玛雅人手中。'
            who: maya_codices_mani
            bio: '这条分支里，1562 年公开焚书前，马尼的一册书由守书人亲自交给了自己选定的读者。'
        vignettes:
          fold: '守书人把两张空折页放在凳上，问邻居记得那本书从哪一折先打开。你扶住纸，让他们比对。他说不准第二折在哪里。她把第一折收好，第二折不合上，等下次两人再谈。'
          listen: '邻居说起守书人记不清的那段，两人记得的次序却不一样。你听他们各自讲完。他们同意第一折，第二折先不定。守书人请你把两种说法都在的那份留给她。'
          survive: '你在后世馆藏里看过一部存世玛雅抄本。守书人问，你能不能说出邻居记的是哪一本。你能说出藏在哪儿，却对不上这一屋人记得的页。她给你一张空白练习折页带走。那本书留在了他们的讲述里。'
text:
  en:
    name: Maya scribes
    text: Maya scribes in Yucatán made folding books of bark paper. At Maní in July 1562 a great many of these books were burned. A few surviving manuscripts, such as the Dresden Codex and the Códice Maya de México, preserve the book tradition.
  zh:
    name: 玛雅书吏
    text: 尤卡坦的玛雅书吏用树皮纸制作折页书。1562 年 7 月，马尼烧毁了大批这样的书。《德累斯顿抄本》《墨西哥玛雅抄本》等少数存世写本保存了这一制书传统。
hook: {en: 'What can the keeper still pass on?', zh: '守书的人还能留下些什么？'}
