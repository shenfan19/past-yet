    sources: [maya_codices_mani_mani]
    text:
      en: 'The research dates the auto de fe at Maní to 12 July 1562 and discusses the destruction associated with it.'
      zh: '研究把马尼的宗教审判仪式定于1562年7月12日，并讨论相关的毁书毁物。'
  account:
    date: '1566'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [maya_codices_mani_account]
    text:
      en: 'The transmitted account has Landa describe burning books. His description gives the persecutor’s justification rather than the keepers’ perspective.'
      zh: '传世文本里有兰达关于焚书的叙述，记录的是施害方为自己辩护的话。'
  codex:
    date: '1021'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [maya_codices_mani_codex]
    text:
      en: 'INAH dates the manuscript’s manufacture to 1021–1152 CE.'
      zh: '研究所将抄本制作年代定于公元1021至1152年。'
