    text:
      en: 'Only a few Maya books from before the conquest survive, among them the Dresden Codex and the Códice Maya de México.'
      zh: '征服以前的玛雅书只存下少数几部，其中有《德累斯顿抄本》和《墨西哥玛雅抄本》。'
