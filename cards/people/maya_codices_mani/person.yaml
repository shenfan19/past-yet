    sources: [maya_codices_mani_account]
    text:
      en: 'The Relación de las cosas de Yucatán, written by the man who ran the burning, describes the books being burned. It gives his side, not the keepers’.'
      zh: '主持焚书的人在《尤卡坦纪事》里写到烧书，记的是他一方的说法，不是守书人的。'
