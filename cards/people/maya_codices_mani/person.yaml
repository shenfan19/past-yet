    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [maya_codices_mani_codex]
    text:
      en: 'INAH dates the manuscript’s manufacture to 1021–1152 CE.'
      zh: '研究所将抄本制作年代定于公元1021至1152年。'
  survivors:
    date: '1562'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [maya_codices_mani_dresden, maya_codices_mani_codex]
    text:
      en: 'Only a few Maya books from before the conquest survive, among them the Dresden Codex and the Códice Maya de México.'
      zh: '征服以前的玛雅书只存下少数几部，其中有《德累斯顿抄本》和《墨西哥玛雅抄本》。'
