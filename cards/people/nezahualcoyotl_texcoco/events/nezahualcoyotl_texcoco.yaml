text:
  en:
    name: "A king who wrote songs"
    place: "Texcoco"
    figure: "Nezahualcoyotl"
    story: "Nezahualcoyotl, ruler of Texcoco and a poet, gathers painted books, songs and gardens in his city, and dies in 1472. The archives were later destroyed, and his songs survive in later copies."
    relic: "A bark paper page"
    relic_desc: "A page of bark paper with painted signs and a few lines of song."
    points:
      p1: "Hear his songs under the garden trees"
      p2: "Walk the aqueduct he planned (a craftsperson or a curious employee)"
      p3: "Copy a song onto a page (a record keeper, a student or a stubborn employee)"
  zh:
    name: "写歌的国王"
    place: "特斯科科"
    figure: "内萨瓦尔科约特尔"
    story: "特斯科科的统治者内萨瓦尔科约特尔也是诗人，他在城里收集绘本、歌和园林，1472年去世。档案后来被毁，他的歌靠后人的抄本流传下来。"
    relic: "一页树皮纸"
    relic_desc: "一页树皮纸，上面有彩绘符号和几行歌。"
    points:
      p1: "在花园的树下听他的歌"
      p2: "走过他规划的引水渠"
      p3: "把一首歌抄到纸上"
