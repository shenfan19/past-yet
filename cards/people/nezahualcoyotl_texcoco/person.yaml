    text:
      en:
        name: 'The name beside a song'
        place: "Texcoco"
        figure: "Nezahualcoyotl"
        story: 'Nezahualcoyotl became lord of Texcoco in 1431 and ruled it until his death in 1472. He is remembered as a poet and a builder; a long dike across Lake Texcoco is said to have been laid out by him. Songs in Nahuatl gathered in the sixteenth century are associated with his name, though whether he made them cannot be settled.'
        relic: 'A singer’s cue strip'
        relic_desc: 'A practice slip with separate places for two names.'
        points:
          p1: 'Be taken in by the singers of the house, then keep time on the drum for their practice'
          p2: 'While the singers take turns, keep the practice sheets in order'
          p3: 'In the last months, help a learner tell the voice inside a song from the name written beside it'
        vignettes:
          voice: '{staff} leaves two places on a practice sheet when a singer steps forward at a line that begins with I: one for the singer, one for the name in the song.'
          drum: '{staff} lays a spare strip as a marker so the pages stay where the next singer can reach them when the first one stands.'
          later: '{staff} writes down which singer a line was heard from, and leaves the question of who first made it open.'
      zh:
        name: '歌旁写着的名字'
        place: "特斯科科"
        figure: "内萨瓦尔科约特尔"
        story: '内萨瓦尔科约特尔 1431 年成为特斯科科之主，统治到 1472 年去世。人们记得他是诗人，也是营造者，据说横贯特斯科科湖的一道长堤是他规划的。十六世纪收集的纳瓦特尔语歌谣里，有一些和他的名字连在一起，但是否出自他手，已无法确定。'
        relic: '一张接唱提示纸'
        relic_desc: '接唱纸，分开给两种名字留了位置。'
        points:
          p1: '先让宫里的歌者们认下，再在他们练唱时打鼓定拍'
          p2: '歌者轮唱时，把练习页按次序留好'
          p3: '最后那几个月，帮一个学徒分清歌里的“我”和歌旁写的名字'
        vignettes:
          voice: '一位歌者唱到以“我”开头的那句走上前来，{staff}在练习纸上留了两处，一处记唱的人，一处记歌里念的名字。'
          drum: '{staff}放了一条边角纸作记号，头一位歌者起身时，纸页仍留在下一位够得着的地方。'
          later: '{staff}记下这一句是从哪位歌者那里听来的，至于最初是谁作的，留着没写。'
text:
  en:
    name: Nezahualcoyotl
    text: Ruler of Texcoco, traditionally dated to 1402–1472. Later Nahuatl collections associate songs with his name. The wording inside a song and the attribution outside it can tell different parts of its history.
  zh:
    name: 内萨瓦尔科约特尔
    text: 特斯科科统治者，传统生卒年为1402至1472年。晚出的纳瓦特尔语歌集将一些歌曲与他的名字联系起来。歌里的措辞与歌旁的归属题记，各保存了流传过程中的一部分。
hook: {en: 'A singer says I. Whose voice is it?', zh: '歌里唱的我，是谁的声音？'}
facts:
  lord:
    date: '1431'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [banxico_nezahualcoyotl, wikiwand_nezahualcoyotl]
    text:
      en: 'In 1431 Nezahualcoyotl was named lord of Texcoco. The alliance of Texcoco, Tenochtitlan and Tlacopan is dated by some to 1428, by others to 1431.'
      zh: '1431 年，内萨瓦尔科约特尔成为特斯科科之主。特斯科科、特诺奇蒂特兰与特拉科潘的三方同盟，有的定在 1428 年，有的定在 1431 年。'
    line:
      en: '1431: Nezahualcoyotl is named lord of Texcoco.'
      zh: '1431 年，内萨瓦尔科约特尔成为特斯科科之主。'
  dike:
    date: '1450'
    checked: two_sources
    level: careful
    use: [story, wiki]
    sources: [banxico_nezahualcoyotl, wikiwand_nezahualcoyotl]
    text:
      en: 'A dike of some sixteen kilometres across Lake Texcoco, dividing its waters, is said to have been laid out by him; the attribution is hedged in the sources.'
      zh: '横贯特斯科科湖、把湖水分开的一道约十六公里的长堤，据说是他规划的，史料对此措辞保留。'
  setting:
    date: '1472'
    stay_day: 150
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [nezahualcoyotl_texcoco_setting]
    text:
      en: 'The study describes early colonial manuscripts relating to the region and gives 1472 as Nezahualcoyotl’s death year.'
      zh: '研究介绍特斯科科地区早期殖民时期抄本，列1472年为内萨瓦尔科约特尔的卒年。'
    line:
      en: '1472: Nezahualcoyotl, lord of Texcoco, dies.'
      zh: '1472 年，特斯科科之主内萨瓦尔科约特尔去世。'
  cantares:
    date: '1590'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [nezahualcoyotl_texcoco_cantares]
    text:
      en: 'The study distinguishes names spoken in the first person inside songs from separate notes of attribution. The approximate date refers to the later manuscript tradition.'
      zh: '研究将歌中用第一人称说出的姓名与独立归属题记分开讨论。所列约年指后出的手稿传统。'
    line:
      en: 'The late sixteenth century: songs in Nahuatl are written down in a collection, some of them under his name. Who first sang them is not known.'
      zh: '十六世纪后期，纳瓦特尔语的歌谣被抄进一部歌集，其中一些写在他的名下。最初是谁唱的，没人知道。'
