    text:
      en:
        name: 'The name beside a song'
        place: "Texcoco"
        figure: "Nezahualcoyotl"
        story: 'Nezahualcoyotl became lord of Texcoco in 1431 and ruled it until his death in 1472. He is remembered as a poet and a builder; a long dike across Lake Texcoco is said to have been laid out by him. Songs in Nahuatl gathered in the sixteenth century are associated with his name, though whether he made them cannot be settled.'
        story_prose:
          opening:
            - 'Texcoco, 1472. Nezahualcoyotl has been lord of the city for forty one years and is about seventy. He is remembered as a poet and a builder, and the long dike across Lake Texcoco that divides its waters is said to have been laid out by him.'
            - 'In history, he died this year, and his seven year old son Nezahualpilli was chosen to succeed him; the songs tied to his name were copied into a book of songs about a hundred years later, and who first sang them nobody knows. In this branch, an old singer in the palace who knows those songs means to teach them to a learner, a singer at the rehearsals leaves a cue for the next, and a helper keeps the practice sheets in order.'
            - 'A few kinds of people can help on this trip: someone who can keep watch, someone bold or very tough, or someone with a sleep regulator, to keep a child safe in the unsettled days; someone who has taught or knows music, someone patient or orderly, or someone with a voice recorder, to learn the songs line by line; someone quiet who will keep a person company, someone who can nurse the sick, or someone with a hologram projector, to sit with him in his last days.'
          outcomes:
            all: 'That year the seven year old Nezahualpilli was chosen lord of Texcoco. The songs were handed on from beginning to end, and the learner later taught them to a learner of their own. About a hundred years later they were copied into a book of songs, under his name.'
            p3: 'That year Nezahualcoyotl died at Texcoco. About a hundred years later the songs tied to his name were copied into a book of songs; more than five hundred years later his face was printed on the Mexican hundred peso note.'
            p2: 'The learner came to know the songs well, and later taught them to a learner of their own. About a hundred years later they were copied into a book of songs, with his name beside them.'
            p1: 'The seven year old Nezahualpilli was chosen lord of Texcoco, and held that seat for more than forty years.'
          none: 'That year Nezahualcoyotl died at Texcoco. When the old singer fell ill the songs were not yet all taught, and the second half of the practice sheet stayed blank; on the day of the choosing, the palace waited in vain for the seven year old boy.'
          desync: 'In the nights after his death nobody kept watch by the threshold. When {staff} was recalled, the day of the choosing had not yet come, the room the boy had slept in was empty, and the mat was rolled up against the wall.'
          not_admitted: '{staff} never got into the palace, and only heard the singers rehearsing from the town. A singer finished a line and stepped back to leave room for the next; whose song it was, each listener said something different.'
          points:
            p2:
              class_teaching: 'That year the old singer of the palace could no longer sing for long, and had to stop for breath halfway through a song. He meant to teach the songs tied to the name of Nezahualcoyotl to a learner of the palace. {staff}, who had taught, had the learner repeat one line at a time, learning each line before going on to the next, going through the whole from the start at the end of each day, and marking the edge of the practice sheet wherever a line went wrong. On the evening the last song was taught, the learner sang them from beginning to end without missing a line. The old singer said nothing, his hand keeping time softly on his knee.'
              else: 'That year the old singer of the palace could no longer sing for long, and had to stop for breath halfway through a song. He meant to teach the songs tied to the name of Nezahualcoyotl to a learner of the palace. {staff} sat patiently beside them; each time the old singer sang a line the learner sang it back, and where the learner faltered, the old man was asked to sing it again, and again if once was not enough. On the evening the last song was taught, the learner sang them from beginning to end without missing a line. The old singer said nothing, his hand keeping time softly on his knee.'
            p3:
              class_medical: 'In his last days the people coming and going in his room walked softly. {staff}, who knew how to nurse the sick, tucked the blanket round him and held the cup while he drank, and only when the two of them were alone drew closer and began slowly to talk about what was to come. About a hundred years later, someone would copy the songs tied to his name into a book one by one. More than five hundred years later, people far away would still know his name, and his face would be printed on their money. When he had heard it all he was silent for a long time, then turned his head to look out of the doorway at the lake.'
              else: 'In his last days the people coming and going in his room walked softly. {staff} sat with him one whole afternoon, and only when the two of them were alone began slowly to talk about what was to come. About a hundred years later, someone would copy the songs tied to his name into a book one by one. More than five hundred years later, people far away would still know his name, and his face would be printed on their money. When he had heard it all he was silent for a long time, then turned his head to look out of the doorway at the lake.'
            p1: 'In the days after his death the nobles gathered to settle who would succeed him, and more people came and went in the palace each day. The seven year old Nezahualpilli was led from one room to another. {staff} kept watch outside the room where he slept, did not leave at night, stopped every stranger who came and asked their business first, and sat down by the threshold only when the boy was asleep. On the morning of the choosing the boy was led out of the door by the hand, the hem of his cloak brushing the threshold. The place beside it where someone had sat for several nights had worn pale.'
          excerpts:
            p3: 'More than five hundred years later, people far away would still know his name, and his face would be printed on their money. When he had heard it all he was silent for a long time, then turned his head to look out of the doorway at the lake.'
            p2: 'On the evening the last song was taught, the learner sang them from beginning to end without missing a line. The old singer said nothing, his hand keeping time softly on his knee.'
            p1: 'On the morning of the choosing the boy was led out of the door by the hand, the hem of his cloak brushing the threshold. The place beside it where someone had sat for several nights had worn pale.'
        relic: 'A singer’s cue strip'
        relic_desc: 'A practice slip with separate places for two names.'
        points:
          p1: 'In the days after his death, while the nobles choose the heir, keep seven year old Nezahualpilli safe'
          p2: 'Help a learner of the house learn every line of the songs tied to his name from an old singer'
          p3: 'In his last days, let him know that his name is still remembered more than five hundred years on'
        points_fail:
          p1: 'Before the choosing, harm comes to the boy, and in this branch Texcoco does not receive its seven year old lord as it did in history.'
          p2: 'The old singer falls ill before the teaching is done, and in this branch only part of those songs is handed on, as before.'
          p3: 'As in history he dies in 1472, and in this branch he never learns that later people will remember him.'
        shift:
          p1:
            was: 'Nezahualcoyotl died in 1472, and the seven year old Nezahualpilli was chosen to succeed him.'
          p2:
            was: 'In the late sixteenth century some songs under his name were copied into a book of songs; who first sang them, nobody knows.'
