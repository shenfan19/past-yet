    text:
      en:
        name: 'The name beside a song'
        place: "Texcoco"
        figure: "Nezahualcoyotl"
        story: 'Nezahualcoyotl ruled Texcoco until 1472. Later Nahuatl song collections preserve works associated with him. Their editors distinguish a name spoken within a song from a separate attribution. This episode imagines two singers comparing a cue in Texcoco. Their song and note are fictional.'
        relic: 'A singer’s cue strip'
        relic_desc: 'An imagined practice slip with separate places for two names.'
        points:
          p1: 'Find whether the name comes from the verse or the singer’s note'
          p2: 'Keep the practice sheets in order as the singers take turns'
          p3: 'Help the next learner distinguish the remembered voice from the attribution'
        vignettes:
          voice: 'A singer steps forward when Citlali gets to the line that begins with I. Citlali asks if the practice sheet needs the singer’s name or the name recited in the song. You help her make separate places for them. When the piece starts again, the person who steps forward knows where to come in.'
          drum: 'Tochtli notices that the paper stays in order while the first singer holds it down, but slides as she stands. You move a spare strip aside as a marker and leave the two pages where the next singer can find them. The second entry comes without someone calling a name across the room.'
          later: 'You have read a later Nahuatl song collection in which names sometimes occur inside the lyrics. Citlali asks which person handed her this line. You record the name of the singer she actually heard. The later collection will be made after everyone in this room is gone.'
      zh:
        name: '歌旁写着的名字'
        place: "特斯科科"
        figure: "内萨瓦尔科约特尔"
        story: '内萨瓦尔科约特尔统治特斯科科至1472年。晚出的纳瓦特尔语歌集保留了与他有关的歌。整理者区分歌词里说出的名字和另行写下的归属。故事虚构两名歌者在特斯科科合一处唱词，歌与提示纸都为虚构。'
        relic: '一张接唱提示纸'
        relic_desc: '虚构接唱纸，分开给两种名字留了位置。'
        points:
          p1: '找出名字是在唱词里，还是歌者另记的'
          p2: '歌者轮唱时，按次序留好练习页'
          p3: '帮接手的学徒分清歌中借用的声音和归属'
        vignettes:
          voice: '西特拉莉唱到以我开头的一句，有位歌者走上前来。她问，练习纸上该记歌者的名，还是歌里念的名。你帮她各留一处。再次唱起时，上前的人知道从哪里接唱。'
          drum: '托奇特利看见头一位歌者坐着时压得住纸，一起身，纸就滑乱了。你挪一条边角纸作记号，两页都留在接唱人够得着的地方。第二个人按时开口，屋里没人隔着老远喊名字。'
          later: '你读过后来的纳瓦特尔语歌集，有时名字就出现在歌词里。西特拉莉问，这一句是谁传给她的。你记下她亲耳听过的歌者。等到后来的歌集收成，这屋里的人都已不在。'
text:
  en:
    name: Nezahualcoyotl
    text: Ruler of Texcoco, traditionally dated to 1402–1472. Later Nahuatl collections associate songs with his name. The wording inside a song and the attribution outside it can tell different parts of its history.
  zh:
    name: 内萨瓦尔科约特尔
    text: 特斯科科统治者，传统生卒年为1402至1472年。晚出的纳瓦特尔语歌集将一些歌曲与他的名字联系起来。歌里的措辞与歌旁的归属题记，各保存了流传过程中的一部分。
hook: {en: 'A singer says I. Whose voice is it?', zh: '歌里唱的我，是谁的声音？'}
facts:
  setting:
    date: '1472'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [nezahualcoyotl_texcoco_setting]
    text:
      en: 'The study describes early colonial manuscripts relating to the region and gives 1472 as Nezahualcoyotl’s death year.'
      zh: '研究介绍特斯科科地区早期殖民时期抄本，列1472年为内萨瓦尔科约特尔的卒年。'
  cantares:
    date: '1590'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [nezahualcoyotl_texcoco_cantares]
    text:
      en: 'The study distinguishes names spoken in the first person inside songs from separate notes of attribution. The approximate date refers to the later manuscript tradition.'
      zh: '研究将歌中用第一人称说出的姓名与独立归属题记分开讨论。所列约年指后出的手稿传统。'
