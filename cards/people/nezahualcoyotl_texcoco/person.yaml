          p3:
            was: 'Nezahualcoyotl died at Texcoco in 1472; the songs tied to his name were copied into a book a century later, and his face on the Mexican hundred peso note came more than five hundred years after.'
            now: '{staff} sat with him in his last days and told him all this.'
        vignettes:
          voice: '{staff} leaves two places on a practice sheet when a singer steps forward at a line that begins with I: one for the singer, one for the name in the song.'
          drum: '{staff} lays a spare strip as a marker so the pages stay where the next singer can reach them when the first one stands.'
          later: '{staff} writes down which singer a line was heard from, and leaves the question of who first made it open.'
      zh:
        name: '歌旁写着的名字'
        place: "特斯科科"
        figure: "内萨瓦尔科约特尔"
        story: '内萨瓦尔科约特尔 1431 年成为特斯科科之主，统治到 1472 年去世。人们记得他是诗人，也是营造者，据说横贯特斯科科湖的一道长堤是他规划的。十六世纪收集的纳瓦特尔语歌谣里，有一些和他的名字连在一起，但是否出自他手，已无法确定。'
        story_prose:
          opening:
            - '1472 年，特斯科科。内萨瓦尔科约特尔做这座城的主人已经四十一年，七十岁上下了。人们记得他是诗人，也是营造者，据说横贯特斯科科湖、把湖水分开的那道长堤，就是他规划的。'
            - '史实里，他在这一年去世，七岁的儿子内萨瓦尔皮利被推举继位；与他名字连在一起的歌，一百来年后才抄进一部歌集，最初是谁唱的，已经没人知道。在这条分支里，宫里有个会唱那几首歌的老歌者，要把歌教给一位学徒，排练时还有个歌者给接唱的人留提示，有个帮工管着练习稿的先后。'
            - '这一趟用得上几种人：守得住夜、胆子大或身子极结实的人，带着睡眠调节器也行，在人心不定的那几天护得住一个孩子；教过书、懂音乐，或有耐心、有条理，带着录音笔也行，一句一句学得全的人；性子安静、肯陪着人，会照护病人，或带着全息投影仪的人，在他最后的日子里坐得住。'
          outcomes:
            all: '这年，七岁的内萨瓦尔皮利被推举为特斯科科之主。那几首歌从头到尾传了下去，学徒后来又教给了自己的徒弟。一百来年后，它们被抄进一部歌集，写在他的名下。'
            p3: '这年，内萨瓦尔科约特尔在特斯科科去世。一百来年后，与他名字连在一起的歌被抄进一部歌集；五百多年后，墨西哥的百元钞票上印着他的脸。'
            p2: '那位学徒把几首歌唱熟了，后来又教给了自己的徒弟。一百来年后，这些歌被抄进一部歌集，歌旁写着他的名字。'
            p1: '七岁的内萨瓦尔皮利被推举为特斯科科之主，后来在这个位子上坐了四十多年。'
          none: '这年，内萨瓦尔科约特尔在特斯科科去世。老歌者病倒时，那几首歌还没有教完，练习纸的后半截空着；推举那天，宫里没有等来那个七岁的孩子。'
          desync: '他去世后的那几夜，门槛边上没有人守着。{staff}被召回时，推举的日子还没到，孩子住过的那间屋子空着，席子卷起来靠在墙角。'
          not_admitted: '{staff}没能进宫，只在城里听见歌者们练唱。一位歌者唱完一句，退回去，给接唱的人留出位置；唱的是谁的歌，听的人各说各的。'
          points:
            p2:
              class_teaching: '这一年，宫里的老歌者已经唱不了太久，一首歌唱到一半就要停下来喘口气。他要把那几首和内萨瓦尔科约特尔名字连在一起的歌，教给宫里一位学徒。{staff}教过书，让学徒一句一句跟着念，念熟一句再接下一句，每天收工前从头背一遍，背错的地方在练习纸边上点一个记号。最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。'
              else: '这一年，宫里的老歌者已经唱不了太久，一首歌唱到一半就要停下来喘口气。他要把那几首和内萨瓦尔科约特尔名字连在一起的歌，教给宫里一位学徒。{staff}耐着性子坐在一旁，老歌者唱一句，就让学徒跟一句，跟不上的地方请老人再唱一遍，一遍不行就两遍。最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。'
            p3:
              class_medical: '他最后的日子里，屋里来来去去的人都放轻了脚步。{staff}会照护病人，替他掖好盖毯，扶着他喝水，等屋里只剩下他们两个，才坐近了，慢慢说起以后的事。一百来年后，有人会把和他名字连在一起的歌一首首抄进书里。五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。'
              else: '他最后的日子里，屋里来来去去的人都放轻了脚步。{staff}在他身边坐了一个下午，等屋里只剩下他们两个，才慢慢说起以后的事。一百来年后，有人会把和他名字连在一起的歌一首首抄进书里。五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。'
            p1: '他去世后的那几天，贵族们聚在一起商量由谁继位，宫里进进出出的人一天比一天多。七岁的内萨瓦尔皮利被人领着，从一间屋子走到另一间屋子。{staff}守在他住的屋外，夜里也不走开，生人来了先拦下问清楚，孩子睡着了，才在门槛边上坐下来。推举那天早上，孩子被大人牵着走出屋门，衣角在门槛上蹭了一下。门槛边那块坐了几夜的地方，已经磨出了一片浅印。'
          excerpts:
            p3: '五百多年后，很远的地方还有人认得他的名字，钱上印着他的脸。他听完，很久没有说话，转过头去，望着门外那片湖水。'
            p2: '最后一首教完的那天傍晚，学徒从头唱到尾，一句没落。老歌者没有出声，手在膝上跟着轻轻打着拍子。'
            p1: '推举那天早上，孩子被大人牵着走出屋门，衣角在门槛上蹭了一下。门槛边那块坐了几夜的地方，已经磨出了一片浅印。'
        relic: '一张接唱提示纸'
        relic_desc: '接唱纸，分开给两种名字留了位置。'
        points:
          p1: '他去世后贵族推举继承人的那几天，护住七岁的内萨瓦尔皮利'
          p2: '帮宫里的一位学徒把与他名字连在一起的那几首歌，从老歌者那里一句不落地学全'
          p3: '在他最后的日子里，让他知道五百多年后人们还记得他的名字'
        points_fail:
          p1: '推举之前孩子出了事，这条分支里特斯科科没有照史实迎来七岁的新主。'
          p2: '老歌者病倒前没教完，这条分支里那几首歌照旧只传下来一部分。'
          p3: '他照史实在 1472 年去世，这条分支里，他到最后也不知道后人会记得他。'
        shift:
          p1:
            was: '1472 年内萨瓦尔科约特尔去世，七岁的内萨瓦尔皮利被推举继位。'
          p2:
            was: '十六世纪后期，写在他名下的一些歌被抄进歌集，最初是谁唱的，没人知道。'
            now: '那位学徒把几首歌从头到尾学全，后来又教给了自己的徒弟。'
          p3:
            was: '1472 年内萨瓦尔科约特尔在特斯科科去世；与他名字连在一起的歌一百来年后才抄进歌集，墨西哥的百元钞票印他的像，是五百多年以后的事。'
            now: '{staff}在他最后的日子里坐在他身边，把这些告诉了他。'
        vignettes:
          voice: '一位歌者唱到以“我”开头的那句走上前来，鼓声停了半拍。{staff}在练习纸上留了两处，一处记唱的人，一处记歌里念的名字。'
          drum: '{staff}放了一条边角纸作记号，头一位歌者起身时，纸页仍留在下一位够得着的地方，帮工又把它们按次序码齐。'
          later: '{staff}记下这一句是从哪位歌者那里听来的，至于最初是谁作的，留着没写，那一格空在纸上。'
text:
  en:
    name: Nezahualcoyotl
    text: Ruler of Texcoco, traditionally dated to 1402–1472. Later Nahuatl collections associate songs with his name. The wording inside a song and the attribution outside it can tell different parts of its history.
  zh:
    name: 内萨瓦尔科约特尔
    text: 特斯科科统治者，传统生卒年为1402至1472年。晚出的纳瓦特尔语歌集将一些歌曲与他的名字联系起来。歌里的措辞与歌旁的归属题记，各保存了流传过程中的一部分。
quotes:
  nezahualcoyotl_song_is_our_attire:
    order: 1
    tier: full
    date: '1590'
    checked: official_record
    sources: [nezahualcoyotl_cantares_28v, nezahualcoyotl_texcoco_cantares]
    original: nah
    contextual: true
    text:
      nah: {quote: 'nictemoan cuicatl ye tonequimilol'}
      en: {who: Unnamed singer in the song, quote: 'I seek the songs. They are our attire.', occasion: 'Cantares mexicanos, fol. 28v, verse 525, in the song headed “Song of Nezahualcoyotl.” The author and historical performer are unknown. The surviving copy dates to the late sixteenth century (game translation).'}
      zh: {who: 歌中无名的歌者, quote: '我寻觅歌谣。歌谣是我们的衣裳。', occasion: '《墨西哥歌谣集》第28叶背面第525节，题为《内萨瓦尔科约特尔之歌》。作者与实际歌者均不详。传世抄本抄于十六世纪末（本游戏译文）。'}
  nezahualcoyotl_a_little_while:
    order: 2
    tier: none
    date: '1590'
    checked: official_record
    sources: [nezahualcoyotl_cantares_17r]
    original: nah
    contextual: true
    text:
      nah: {quote: 'Annochipa tlalticpac çan achica ye nican'}
      en: {who: Voice named Nezahualcoyotl in the song, quote: 'We cannot stay on earth forever. We are here only a little while.', occasion: 'Cantares mexicanos, fol. 17r, verse 267. The voice names itself Nezahualcoyotl in verse 266. Authorship and the historical performer are unknown. The surviving copy dates to the late sixteenth century (game translation).'}
      zh: {who: 歌中自称内萨瓦尔科约特尔的声音, quote: '在这世上不能长留，只能稍作停留。', occasion: '《墨西哥歌谣集》第17叶正面第267节。前一节的歌中人自称内萨瓦尔科约特尔，作者与实际歌者均不详。传世抄本抄于十六世纪末（本游戏译文）。'}
hook: {en: 'A singer says I. Whose voice is it?', zh: '歌里唱的我，是谁的声音？'}
facts:
  lord:
    date: '1431'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [banxico_nezahualcoyotl, wikiwand_nezahualcoyotl]
    text:
      en: 'In 1431 Nezahualcoyotl was named lord of Texcoco. The alliance of Texcoco, Tenochtitlan and Tlacopan is dated by some to 1428, by others to 1431.'
      zh: '1431 年，内萨瓦尔科约特尔成为特斯科科之主。特斯科科、特诺奇蒂特兰与特拉科潘的三方同盟，有的定在 1428 年，有的定在 1431 年。'
    line:
      en: '1431: Nezahualcoyotl is named lord of Texcoco.'
      zh: '1431 年，内萨瓦尔科约特尔成为特斯科科之主。'
  dike:
    date: '1450'
    checked: two_sources
    level: careful
    use: [story, wiki]
    sources: [banxico_nezahualcoyotl, wikiwand_nezahualcoyotl]
    text:
      en: 'A dike of some sixteen kilometres across Lake Texcoco, dividing its waters, is said to have been laid out by him; the attribution is hedged in the sources.'
      zh: '横贯特斯科科湖、把湖水分开的一道约十六公里的长堤，据说是他规划的，史料对此措辞保留。'
  setting:
    date: '1472'
    stay_day: 150
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [nezahualcoyotl_texcoco_setting]
    text:
      en: 'The study describes early colonial manuscripts relating to the region and gives 1472 as Nezahualcoyotl’s death year.'
      zh: '研究介绍特斯科科地区早期殖民时期抄本，列1472年为内萨瓦尔科约特尔的卒年。'
    line:
      en: '1472: Nezahualcoyotl, lord of Texcoco, dies.'
      zh: '1472 年，特斯科科之主内萨瓦尔科约特尔去世。'
  cantares:
    date: '1590'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [nezahualcoyotl_texcoco_cantares]
    text:
      en: 'The Cantares mexicanos survives in a manuscript from long after Nezahualcoyotl’s death. A speaker naming himself inside a song and a gloss attributing a song are different kinds of evidence; neither establishes a verbatim record from his lifetime.'
      zh: '《墨西哥歌谣集》传世抄本远晚于内萨瓦尔科约特尔去世。歌中说「我是某人」，与歌旁题记写作品出自某人，是两种不同的证据；不能据此认定留下了他生前的原话。'
    line:
      en: 'The late sixteenth century: songs in Nahuatl are written down in a collection, some of them under his name. Who first sang them is not known.'
      zh: '十六世纪后期，纳瓦特尔语的歌谣被抄进一部歌集，其中一些写在他的名下。最初是谁唱的，没人知道。'
bystanders:
  citlali:
    invented: true
    text: {en: 'A singer, made up for the game, who leaves a cue for the next one.', zh: '一位编出来的歌者，给接唱的人留一处提示。'}
  tochtli:
    invented: true
    text: {en: 'A helper at the rehearsal, made up for the game, who keeps the sheets in order.', zh: '一位编出来的排练帮工，管着练习稿的次序。'}
