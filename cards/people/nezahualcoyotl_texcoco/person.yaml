events:
- nezahualcoyotl_texcoco
text:
  en:
    name: Nezahualcoyotl
    text: Ruler and poet of Texcoco, 1402 to 1472. He is credited with poems in Nahuatl that reflect on the brevity of life, and with building a library and public works in his city.
  zh:
    name: 内萨瓦尔科约特尔
    text: 特斯科科的统治者与诗人，1402 年生，1472 年去世。相传他用纳瓦特尔语写诗，思考生命的短暂，并在城里修建图书馆和公共工程。
