    text:
      en:
        name: Before the arrest order
        place: Paris
        figure: Antoine Lavoisier
        story: 'On 24 November 1793 the arrest of all the former tax farmers was ordered, and Lavoisier and his father-in-law Jacques Paulze were among those imprisoned. On 8 May 1794 the two of them and other former tax farmers were condemned and put to death in Paris on the same day.'
        story_prose:
          opening:
            - 'In Paris, Jacques Paulze spreads an account out for his daughter. Antoine Lavoisier reads from a different page at the other end of the table. Both men mean to stay in the city to explain their books. Someone in the family asks who could look after the ledgers in their place.'
            - 'On 24 November 1793 the authorities ordered the arrest of the former tax farmers. Paulze and Lavoisier were both executed on 8 May 1794. In this branch you can ask both men to consider leaving Paris. Each decides for himself.'
            - 'Someone who can hear each man’s reasons can speak with them in turn. A traveller who knows his way around accounts can also list the papers for the family to keep.'
          points:
            p1: 'Paulze says handing over an entire book will leave his family with no idea which questions to expect. You ask him to mark each page as he speaks. His daughter checks the accounts he points out before taking the whole ledger. When he hears her read back his marks, he stands and pushes his chair back under the table.'
            p2: 'Lavoisier holds a statement with two entries he thinks he still has to explain himself. You ask if he can write the explanations for the person taking over. After hearing both read back to him, he asks his family to say he has left Paris if anyone calls. He puts the page beside them before he leaves, and leaves a blank sheet underneath it.'
          outcomes:
            all: 'Both men leave the city separately. When the family opens the books in May there is news from each of them. Both are alive.'
            p1: 'Paulze leaves and is still alive after the following May. Lavoisier stays in Paris and is later executed.'
            p2: 'Lavoisier leaves and is still alive after the following May. Jacques Paulze stays in Paris and is later executed.'
          none: 'The family moves away from the table. Both men stay in the city and both names appear in the list of those executed the following May.'
          not_admitted: 'The visitor has no calling card expected by the family. Someone closes the ledger and keeps it on the table.'
          excerpts:
            p1: 'When he hears her read back his marks, he stands and pushes his chair back under the table.'
            p2: 'He puts the page beside them before he leaves, and leaves a blank sheet underneath it.'
        relic: A precision balance
        relic_desc: A fine balance that kept the books of chemistry.
        points:
          p1: 'Ask Jacques Paulze to entrust his papers to his family and leave Paris before the arrest order comes'
          p2: 'Get Lavoisier to consider leaving Paris while he still expects he can justify his accounts in person'
        points_fail:
          p1: 'Paulze stays with his papers in Paris. He is taken into custody and put to death on 8 May 1794.'
          p2: 'As in history Lavoisier is imprisoned at the end of November, and on 8 May 1794 he is put to death in Paris.'
