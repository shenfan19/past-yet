    text:
      en:
        name: A new language for chemistry
        place: Paris
        figure: Antoine Lavoisier
        story: 'Lavoisier''s 1789 treatise uses mass measurements to account for chemical changes and treats oxygen as a participant in combustion.'
        relic: A precision balance
        relic_desc: A fine balance that kept the books of chemistry.
        points:
          p1: 'Match the folded plates to the figure references so the Paris printer can deliver the first edition with all of them'
          p2: 'Have Marie-Anne and the compositor compare captions, letters on the engravings and the pages that cite them. Put errors on a separate sheet'
          p3: 'Set a separate index for students to look up older and newer terms. Where a match is uncertain, point to the relevant definition'
        points_fail:
          p1: 'The text points to folded leaves that are missing from the volume. The illustrated edition cannot be delivered, and the office recalls the employee.'
          p2: 'A label is corrected on the plate, but the text points to the old reference. The reader cannot locate the illustration.'
          p3: 'Readers taught the former names can only guess whether two words refer to the same thing.'
        shift:
          p1:
            was: 'The Traité élémentaire de chimie appeared in Paris in 1789. Surviving first editions contain signed folding plates engraved by Marie-Anne Paulze Lavoisier.'
          p2:
            was: 'The first edition includes her engravings of instruments. The book uses illustrations and passages of text together.'
            now: 'A reader can trace the letters on the plate back to the right passage. The compositor keeps the correction sheet Marie-Anne checked.'
          p3:
            was: 'The preface links improving chemical terminology to organizing the subject and acknowledges earlier work on naming by several collaborators.'
            now: 'Students use the index to find the definitions. Where there is no simple match, a line explains the difficulty and records who contributed to the earlier nomenclature.'
            who: lavoisier_paris
            bio: 'The Paris edition put changing chemical terminology and folding plates into one elementary book. Several people contributed to its text and illustrations.'
        vignettes:
          units: 'Two numbers line up beautifully, but the unit on one row has slipped. You catch it before the compositor locks the columns in place.'
          air: 'You ask why the table accounts for something the reader cannot see. The compositor taps the headings for what entered and what remained, then leaves both headings in the proof.'
          proof: 'You put a scrap of paper under the current row as the compositor reads. A number that looked like part of the next example finds its own heading again.'
      zh:
        name: 化学有了新语言
        place: 巴黎
        figure: 拉瓦锡
        story: '拉瓦锡 1789 年出版的《化学基础论》用质量测量解释化学变化，把氧视为参与燃烧的物质。'
        relic: 一台精密天平
        relic_desc: 一台精细的天平，给化学记账。
        points:
          p1: '把首版折页图按书里所引的图号点齐，护住巴黎印坊交付带齐图版的《化学基础论》'
          p2: '请玛丽－安娜和排字工把图题、图内小字和正文页互相对照，把错位的例次留在单独一张更正纸上'
          p3: '给初学者另外排一页旧称与新称的索引，注明对应不全时先回查哪段定义'
        points_fail:
          p1: '书中几处指向没有装入的折页，印坊无法交付带全图的首版，事务所因同步失败召回员工。'
          p2: '图上纠正了一处写法，正文仍按旧图号指路。后来翻页的人找不到示意图。'
          p3: '按旧名称学过的人拿到新书，只能凭习惯猜两种叫法是不是同一指代。'
        shift:
          p1:
            was: '《化学基础论》1789 年在巴黎付印。现存首版含署了玛丽－安娜·波尔兹·拉瓦锡名字的折页图。'
          p2:
            was: '初版有她雕刻的装置图。书中用图和正文共同说明一些观察所用的器具。'
            now: '每幅图可以按小字在正文中找回。排字工留下一张她确认过的改字号说明。'
          p3:
            was: '拉瓦锡序言把改进化学名称与整理知识相连，也说明沿用了此前几位合作者的命名工作。'
            now: '附页让初学者按旧称回到定义。仍无一一对应的地方，加印一行说明并记明原有命名工作由哪些人参与。'
            who: lavoisier_paris
            bio: '巴黎首版把一套正在更替的术语和折页图放进同一部入门书，文字与图版由多位合作者完成。'
        vignettes:
          units: '两个数字对得很齐，其中一行的单位却串了列。排字工固定版面之前，你把它指了出来。'
          air: '你问表格为什么还要记下看不见的东西。排字工指了指「加入」和「剩余」两栏，把两个栏头都保留在校样上。'
          proof: '排字工念表时，你拿纸条压住正在读的那一行。原本看起来属于下一例的数字，重新对回了自己的栏头。'
text:
  en:
    name: Antoine Lavoisier
    text: French chemist, 1743 to 1794. He showed the role of oxygen in burning, helped found the modern system of chemical names, and stated the conservation of mass. He was guillotined during the Terror.
  zh:
    name: 拉瓦锡
    text: 法国化学家，1743 年生，1794 年去世。他阐明氧在燃烧中的作用，参与建立现代化学命名体系，并陈述了质量守恒。他在恐怖时期被送上断头台。
