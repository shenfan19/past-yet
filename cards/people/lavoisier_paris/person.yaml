    text:
      en:
        name: Before the arrest order
        place: Paris
        figure: Antoine Lavoisier
        story: 'On 24 November 1793 the arrest of all the former tax farmers was ordered, and Lavoisier and his father-in-law Jacques Paulze were among those imprisoned. On 8 May 1794 the two of them and other former tax farmers were condemned and put to death in Paris on the same day.'
        relic: A precision balance
        relic_desc: A fine balance that kept the books of chemistry.
        points:
          p1: 'Before the arrest order comes, persuade his father-in-law Paulze to leave Paris, and save him'
          p2: 'Before the arrest order comes, persuade Lavoisier to leave Paris and keep out of sight, and save him'
        points_fail:
          p1: 'As in history Paulze is imprisoned at the end of November, and on 8 May 1794 he is put to death on the same day as his son-in-law.'
          p2: 'As in history Lavoisier is imprisoned at the end of November, and on 8 May 1794 he is put to death in Paris.'
        shift:
          p1:
            was: '24 November 1793: the arrest of all the former tax farmers was ordered, Jacques Paulze among them. On 8 May 1794 he was put to death on the same day as his son-in-law Lavoisier.'
            now: 'He left Paris before the arrest order came, and lived.'
          p2:
            was: '24 November 1793: the arrest of all the former tax farmers was ordered, and Lavoisier was imprisoned. On 8 May 1794 he was put to death in Paris.'
            now: 'He left Paris ahead of the arrest order, lived through those months, and went back to his laboratory.'
            who: lavoisier_paris
            bio: 'In this timeline Lavoisier left Paris before the arrest order of November 1793, and lived on past 1794.'
        vignettes:
          units: 'Two numbers line up beautifully, but the unit on one row has slipped. You catch it before the compositor locks the columns in place.'
          air: 'You ask why the table accounts for something the reader cannot see. The compositor taps the headings for what entered and what remained, then leaves both headings in the proof.'
          proof: 'You put a scrap of paper under the current row as the compositor reads. A number that looked like part of the next example finds its own heading again.'
      zh:
        name: 逮捕令下来之前
        place: 巴黎
        figure: 拉瓦锡
        story: '1793 年 11 月 24 日，所有前包税官被下令逮捕，拉瓦锡和岳父雅克·保尔兹都在其中，先后入狱。1794 年 5 月 8 日，两人与其他前包税官同日在巴黎被判处死刑并处死。'
        relic: 一台精密天平
        relic_desc: 一台精细的天平，给化学记账。
        points:
          p1: '逮捕令下来之前，劝岳父保尔兹先离开巴黎，救下他'
          p2: '逮捕令下来之前，劝拉瓦锡离开巴黎、避开风头，救下他'
        points_fail:
          p1: '保尔兹照史实在 11 月下旬入狱，1794 年 5 月 8 日与女婿同日被处死。'
          p2: '拉瓦锡照史实在 11 月下旬入狱，1794 年 5 月 8 日在巴黎被处死。'
        shift:
          p1:
            was: '1793 年 11 月 24 日，前包税官一律被下令逮捕，雅克·保尔兹在内；1794 年 5 月 8 日，他与女婿拉瓦锡同日被处死。'
            now: '他在逮捕令下来之前离开了巴黎，活了下来。'
          p2:
            was: '1793 年 11 月 24 日，前包税官一律被下令逮捕，拉瓦锡随后入狱；1794 年 5 月 8 日，他在巴黎被处死。'
            now: '他赶在逮捕令之前离开了巴黎，平安度过那几个月，又回到他的实验室。'
            who: lavoisier_paris
            bio: '这条时间线里，拉瓦锡在 1793 年 11 月的逮捕令下来之前离开巴黎，活过了 1794 年。'
        vignettes:
          units: '两个数字对得很齐，其中一行的单位却串了列。排字工固定版面之前，你把它指了出来。'
          air: '你问表格为什么还要记下看不见的东西。排字工指了指「加入」和「剩余」两栏，把两个栏头都保留在校样上。'
          proof: '排字工念表时，你拿纸条压住正在读的那一行。原本看起来属于下一例的数字，重新对回了自己的栏头。'
text:
  en:
    name: Antoine Lavoisier
    text: French chemist, 1743 to 1794. He showed the role of oxygen in burning, helped found the modern system of chemical names, and stated the conservation of mass. He was put to death in Paris in May 1794.
  zh:
    name: 拉瓦锡
    text: 法国化学家，1743 年生，1794 年去世。他阐明氧在燃烧中的作用，参与建立现代化学命名体系，并陈述了质量守恒。1794 年 5 月他在巴黎被处死。
