    text:
      en:
        name: "The curator of experiments"
        place: "London"
        figure: "Robert Hooke"
        story: 'A reader brings out Hooke’s old Micrographia and tries to copy the cork. The edges in the drawing soon turn into a neat honeycomb that Hooke never saw. In the same room are bundles of lectures and demonstrations. Someone who opens one years from now will have to tell a missing page from a blank one.'
        story_prose:
          opening:
            - 'London, 1703. The cells in the cork in Hooke’s Micrographia look like a honeycomb, though their edges are uneven. A reader tracing the engraving keeps wanting to close the gaps.'
            - 'In history, Waller published some of the lectures, while other papers waited for later editors. In this branch, someone is tracing a plate in the damp room while someone else comes to move the bundles.'
            - 'This trip needs someone who can keep the lectures together and catalogue the other bundles. There is also work for someone who can read a figure and help a reader see a break in a line.'
          points:
            p1: 'When the papers have to be moved, {staff} checks the lectures in order and returns the curled sheets to their bundle. The bundle has moved, but its old cover still lies on top. Tightening the cord, {staff} keeps it clear of a protruding corner.'
            p2: '{staff} lists the titles of the remaining bundles and checks them again against the papers. The catalogue goes where it will be seen as soon as the chest opens. The last line is still wet, so {staff} leaves the lid a finger’s width ajar.'
            p3: '{staff} puts the tracing beside the engraving and asks Hooke where the line should break. Hooke’s finger stops between the two figures. Where the two lines never meet, the unmarked paper still shows.'
          outcomes:
            all: 'Two years later the lectures were printed, and even the papers left out had titles to look up. Someone opening the chest later lifted the thin list first.'
            p2: 'The next person looking for an unpublished record could name the bundle. When the lid went up, the catalogue was on top.'
            p3: 'A reader returned to the tracing. A finger went round one cell and stopped at the gap.'
            p1: 'Waller eventually received the lectures. Under the cover sheet, they lay in their old order.'
          none: 'The lid came down, and there was only the sound of paper against wood. An unfinished tracing still lay by the window.'
          not_admitted: '{staff} did not get into the room with the lectures. A little light through the door showed the corner of a chest.'
          desync: 'The lectures came apart when they were moved. When {staff} was recalled, the cord was still lying flat on the table.'
          excerpts:
            p2: 'The catalogue goes where it will be seen as soon as the chest opens. The last line is still wet, so {staff} leaves the lid a finger’s width ajar.'
            p3: 'Hooke’s finger stops between the two figures. Where the two lines never meet, the unmarked paper still shows.'
            p1: 'The bundle has moved, but its old cover still lies on top. Tightening the cord, {staff} keeps it clear of a protruding corner.'
        relic: "A drawing of a flea"
        relic_desc: 'A copy of the folding engraving of a flea from Micrographia.'
        points:
          p1: 'Keep the lectures together as the bundles are moved, so Waller will still be able to gather them for his edition'
          p2: 'File a list of the bundles outside the lectures, with enough detail for a later editor to find them'
          p3: 'Show Hooke the reader’s tracing while he is still there to look at it, and ask which lines should be left open'
        points_fail:
          p1: 'One bundle of lectures is taken away with loose papers. Waller can no longer assemble the collection, and the office recalls the employee.'
          p2: 'The next editor can tell what went into print. Nothing on that list points to the papers elsewhere.'
          p3: 'The tracing stays in the book. The reader has already filled in the lines and will not get to ask where they belong.'
        shift:
          p1:
            was: 'Hooke died in 1703. Richard Waller prepared the collection of posthumous works published in 1705.'
          p2:
            was: 'Waller’s book preserved some of the papers. Parts of Hooke’s diaries and other work appeared later through other editors.'
            now: 'A second list goes into the chest. Someone looking for the demonstrations that did not go to print can start by asking for a bundle that has a name.'
          p3:
            was: 'In Micrographia Hooke compared the pores of cork to a honeycomb and pointed out that their shape was irregular.'
            now: '{staff} sets the tracing beside the old plate. The reader leaves two lines open after Hooke points to where the copied pattern ceases to match the plate.'
        vignettes:
          edge: 'The reader follows two lines around a pore, then joins them with a third that is absent from the plate. {staff} holds the tracing to the window. The invented line is the straightest one on the sheet.'
          analogy: '{staff} asks the reader to find a cell that would not fit the comb they drew at the top of the page. Soon they are both pointing to the same crooked edge.'
          plate: 'When the reader opens another fold, a flea takes up almost the whole desk. {staff} holds one corner down while the reader moves the ink out of the way.'
      zh:
        name: "实验的管理人"
        place: "伦敦"
        figure: "罗伯特·胡克"
        story: '有人翻出胡克的《显微图谱》，照着图版描软木里的小格。描着描着，格子齐得像蜂巢，原图却没那么整齐。屋里还放着几捆讲稿和实验记录。等几年后别人来翻，也得分清哪一页本来是空的，哪一页是真的缺了。'
        story_prose:
          opening:
            - '1703 年，伦敦。胡克的《显微图谱》里，软木的格子像蜂巢，边线却并不齐整。屋里的读者顺着图版描，描到歪处就想补齐。'
            - '史实里，沃勒后来刊行了一部分讲稿，还有些遗稿等了更久才由别人整理。在这条分支里，潮气上来的屋子里有人翻图，也有人来挪纸捆。'
            - '这一趟用得上管得住讲稿、能给别的纸捆留目录的人。懂得读图、能让读者看见一条断线的人，也有事可做。'
          points:
            p1: '纸堆要搬动，{staff}依原来的次序点清讲稿，把卷起来的几页归回同一捆。纸捆换了地方，最上面还压着原来的封页。收绳时，{staff}避开了露在外面的纸角。'
            p2: '{staff}把余下各捆的题名逐一抄到目录上，再沿着纸捆重对一遍。目录放在箱盖一抬就看得见的地方。最后一行墨还没干，{staff}把箱盖留了一指宽。'
            p3: '{staff}把描图和原图并着拿给胡克，请他认一认哪里该留断。胡克的手指停在两张图之间。那两段没接起来的线，最后还露着纸的底色。'
          outcomes:
            all: '两年后讲稿成书，没入书的那些纸也有了题名。后来有人掀开箱盖，先拿起薄薄一张目录。'
            p2: '有人来找一段没刊行的实验记录，报得出纸捆上的题名。箱盖打开，最上面就是目录。'
            p3: '后来读者重翻那张描图。手指沿一格走了一圈，到缺口处停了下来。'
            p1: '沃勒后来接到那捆讲稿。翻开封页，里面的纸还照原来的次序叠着。'
          none: '箱盖落下去，屋里只听到纸擦木头的声音。窗前还有一张没描完的图。'
          not_admitted: '{staff}没进到放讲稿的屋里。门缝的光照出木箱一角。'
          desync: '挪过的讲稿散开了。{staff}被召回时，绳子还平放在桌上。'
          excerpts:
            p2: '目录放在箱盖一抬就看得见的地方。最后一行墨还没干，{staff}把箱盖留了一指宽。'
            p3: '胡克的手指停在两张图之间。那两段没接起来的线，最后还露着纸的底色。'
            p1: '纸捆换了地方，最上面还压着原来的封页。收绳时，{staff}避开了露在外面的纸角。'
        relic: "一幅跳蚤的图"
        relic_desc: '《显微图谱》里那幅折页跳蚤版画的摹本。'
        points:
          p1: '挪动纸堆时把讲稿留在一起，让沃勒日后仍能找齐要入书的稿子'
          p2: '给讲稿以外的纸捆另留一张目录，让后来的编者有题名可查'
          p3: '趁胡克还看得到那张描图，把它拿给他看，问哪几处该留着断线'
        points_fail:
          p1: '一捆讲稿跟零散纸件一道运走。沃勒后来凑不齐汇编所需的纸页，事务所召回员工。'
          p2: '下一个编者看得出哪些稿印了出来，目录却没告诉他其他的稿在哪里。'
          p3: '描图夹回书里，读者已经把断线都接上了，也没来得及问。'
        shift:
          p1:
            was: '胡克 1703 年去世。由理查德·沃勒整理的遗著汇编于 1705 年刊行。'
          p2:
            was: '沃勒的汇编只保存部分遗稿。胡克的部分日记及其他遗留文献经另一些编辑才陆续出版。'
            now: '箱里多了一张目录。下次有人来找没印出来的实验记录，可以先报出纸捆的题名。'
          p3:
            was: '胡克在《显微图谱》里把软木的小孔比作蜂巢，同时指出它们的形状并不规整。'
            now: '{staff}把描图和旧版画摊在一起。胡克指给读者看，哪里开始就对不上了。那两道断开的线，他没有再补。'
        vignettes:
          edge: '读者顺着小格描完两条边，顺手添了第三条。{staff}把纸举到窗前，最直的一道正是刚添的。'
          analogy: '{staff}请读者找一个塞不进蜂巢的格。两只手指伸过去，碰在同一条歪边上。'
          plate: '读者揭开折页，一只跳蚤铺了半张桌。{staff}压着纸角，等墨水瓶挪开。'
text:
  en:
    name: Robert Hooke
    text: English scientist, 1635 to 1703. As curator of experiments at the Royal Society he published Micrographia in 1665, which showed the cell structure of cork, and formulated the law of elasticity named after him.
  zh:
    name: 罗伯特·胡克
    text: 英国科学家，1635 年生，1703 年去世。他任皇家学会实验管理员，1665 年出版《显微图谱》，展示了软木的细胞结构，并提出以他命名的弹性定律。
hook: {en: 'Draw only the boundary you can see.', zh: '看得见的格子才画下来'}
