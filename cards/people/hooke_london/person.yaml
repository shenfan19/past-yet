    refs: [hooke_london_primary, hooke_london_waller_edition, hooke_london_papers_archive, hooke_london_royal_society]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 19, req: {any: [{job: [archivist, proofreader, bookseller, courier], stat: {will: 5}}, {trait: [methodical, vigil], stat: {will: 6}}]}}
        - {id: p2, kind: notice, day: 27, req: {any: [{job: [archivist, translator, proofreader], stat: {wit: 7, will: 7}}, {trait: [methodical], item: notebook_pen, stat: {wit: 8, will: 7}}]}}
        - {id: p3, kind: trust, day: 12, req: {any: [{trait: [scholarly, sensitive], stat: {will: 7}}, {job: [teacher, university_lecturer, lecturer, writer, biologist, bookseller], stat: {wit: 6, will: 7}}]}}
