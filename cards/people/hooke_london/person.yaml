      es: 'El 3 de marzo de 1703, Robert Hooke murió en Londres.'
      ja: '1703 年 3 月 3 日、ロバート フックはロンドンで亡くなりました。'
      ko: '1703년 3월 3일 로버트 훅이 런던에서 사망했습니다.'
      ru: '3 марта 1703 года Роберт Гук умер в Лондоне.'
  edition:
    date: '1705'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [hooke_london_waller_edition]
    text: {en: 'Waller published a collection that included Hooke’s lectures and papers read at the Royal Society.', zh: '沃勒刊印的遗著包括胡克的讲稿和在皇家学会宣读过的论文。'}
    line:
      en: 'In 1705 Richard Waller published Hooke’s posthumous works.'
      zh: '1705 年，理查德·沃勒刊印了胡克的遗著汇编。'
      zh-Hant: '1705 年，理查德·沃勒刊印了胡克的遺著彙編。'
      fr: 'En 1705, Richard Waller publia les œuvres posthumes de Hooke.'
      es: 'En 1705 Richard Waller publicó las obras póstumas de Hooke.'
      ja: '1705 年にリチャード ウォーラーはフックの遺作を出版しました。'
      ko: '1705년에 Richard Waller는 Hooke의 사후 작품을 출판했습니다.'
      ru: 'В 1705 году Ричард Уоллер опубликовал посмертные произведения Гука.'
bystanders:
  hooke_london_reader:
    invented: true
    text: {en: 'An invented reader trying to draw what a plate shows.', zh: '一位虚构的读者，正试着描下图版里的形状。'}
quotes:
  hooke_london_memory:
    order: 1
    tier: full
    date: '1665'
    checked: official_record
    original: en
    sources: [hooke_london_micrographia_text, hooke_london_wellcome]
    text:
      en:
        who: 'Robert Hooke'
        quote: 'that they may not only be kept in safety, but ready and convenient, to be at any time produc’d for use'
        occasion: 'On arranging material kept for future use, in the preface to Micrographia, 1665.'
      zh:
        who: '罗伯特·胡克'
        quote: '使它们既能安全保存，又能在需要时随手取来。'
        occasion: '《显微图谱》序，谈怎样整理要留待以后使用的材料，1665 年（游戏译文）。'
      zh-Hant:
        who: '羅伯特·胡克'
        quote: '使它們既能安全保存，又能在需要時隨手取來。'
        occasion: '《顯微圖譜》序，談怎樣整理要留待以後使用的材料，1665 年（遊戲譯文）。'
      fr:
        who: 'Robert Hooke'
        quote: 'afin qu''ils puissent non seulement être conservés en sécurité, mais aussi prêts et pratiques, pour être à tout moment produits pour être utilisés'
        occasion: 'Sur l''organisation du matériel conservé pour une utilisation future, dans la préface de Micrographia, 1665.'
      es:
        who: 'Robert Hooke'
        quote: 'que no sólo puedan mantenerse en condiciones de seguridad, sino que estén listos y convenientemente, para ser producidos en cualquier momento para su uso.'
        occasion: 'Sobre la disposición del material guardado para uso futuro, en el prefacio de Micrographia, 1665.'
      ja:
        who: 'ロバート・フック'
        quote: '安全に保管できるだけでなく、いつでも使用できるように準備が整い、便利であること'
        occasion: '将来の使用のために保管されている資料の整理について、Micrographia の序文、1665 年。'
      ko:
        who: '로버트 훅'
        quote: '안전하게 보관할 수 있을 뿐만 아니라 언제든지 사용할 수 있도록 준비되고 편리하게 만들어졌습니다.'
        occasion: '향후 사용을 위해 보관된 자료 정리에 관해, 1665년 Micrographia 서문에서.'
      ru:
        who: 'Роберт Гук'
        quote: 'чтобы они могли не только храниться в безопасности, но и были готовы и удобны для того, чтобы их можно было в любое время изготовить для использования.'
        occasion: 'Об организации материала, хранящегося для будущего использования, в предисловии к «Микрографии», 1665 г.'
  hooke_london_cork_echo:
    order: 2
    tier: none
    date: '1665'
    checked: official_record
    original: en
    sources: [hooke_london_cork_text]
    text:
      en:
        who: 'Robert Hooke'
        quote: 'much like a Honey-comb, but that the pores of it were not regular'
        occasion: 'His description of cork in Observation XVIII of Micrographia, 1665.'
      zh:
        who: '罗伯特·胡克'
        quote: '很像蜂巢，只是那些小孔的形状并不规整。'
        occasion: '《显微图谱》第十八项观察，谈显微镜下的软木，1665 年（游戏译文）。'
      zh-Hant:
        who: '羅伯特·胡克'
        quote: '很像蜂巢，只是那些小孔的形狀並不規整。'
        occasion: '《顯微圖譜》第十八項觀察，談顯微鏡下的軟木，1665 年（遊戲譯文）。'
      fr:
        who: 'Robert Hooke'
        quote: 'un peu comme un rayon de miel, mais que les pores n''étaient pas réguliers'
        occasion: 'Sa description du liège dans Observation XVIII de Micrographia, 1665.'
      es:
        who: 'Robert Hooke'
        quote: 'muy parecido a un panal de miel, pero que sus poros no eran regulares'
        occasion: 'Su descripción del corcho en la Observación XVIII de Micrographia, 1665.'
      ja:
        who: 'ロバート・フック'
        quote: '蜂の巣によく似ていますが、その孔は規則的ではありません'
        occasion: '1665 年の Micrographia の観察 XVIII におけるコルクの記述。'
      ko:
        who: '로버트 훅'
        quote: '벌집과 비슷하지만 모공이 규칙적이지 않다는 점'
        occasion: '1665년 Micrographia의 Observation XVIII에서 코르크에 대한 그의 설명입니다.'
      ru:
        who: 'Роберт Гук'
        quote: 'очень похоже на соты, но поры у них неправильные'
        occasion: 'Его описание пробки в «Наблюдении XVIII микрографии», 1665 г.'
