text:
  en:
    name: Alexis Clairaut
    text: French mathematician and astronomer, 1713 to 1765. He went on the expedition to Lapland of 1736 and 1737 to measure the shape of the Earth. He worked with Émilie du Châtelet on her French Newton, and after her death in 1749 helped prepare it for the edition of 1759.
  zh:
    name: 亚历克西·克莱罗
    text: 法国数学家与天文学家，1713 年生，1765 年去世。1736 至 1737 年他随远征队去拉普兰测量地球的形状。他与埃米莉·杜·夏特莱一起做她的牛顿法译，她 1749 年去世后，他参与把译本整理成 1759 年的版本。
