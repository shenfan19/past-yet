    text:
      en:
        name: "Letters from the clinic"
        place: "Halle"
        figure: "Georg Cantor"
        story: 'Cantor retired in 1913 and spent his last years ill and short of food in wartime Germany. In 1917 he entered the clinic in Halle for the last time. He wrote to his wife asking to come home and died in the clinic on 6 January 1918.'
        relic: "A set of index cards"
        relic_desc: "Cards covered with lists that never end."
        points:
          p1: 'Ask Cantor whom he most wants to see and arrange a quiet visit at the clinic in Halle'
          p2: 'Ask the kitchen and his family what food they can spare that winter, and arrange a regular meal he can finish'
        points_fail:
          p1: 'The family has to answer by letter. The chair Cantor asked for stays empty.'
          p2: 'Food comes when someone can spare it, and Cantor still has days when he goes hungry.'
        shift:
          p1:
            was: 'In 1917 Cantor entered the clinic in Halle for the last time. He wrote to his wife asking to come home.'
            now: 'In this branch {staff} gets a visit arranged. Cantor can tell someone from home what he has been putting into his letters.'
          p2:
            was: 'Cantor was ill in his final years and food was scarce in wartime Germany.'
            now: 'In this branch {staff} arranges a dependable meal for Cantor, so on those days he can eat without waiting for a parcel.'
        vignettes:
          list: 'The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.'
          after: 'The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.'
          end: 'You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.'
      zh:
        name: "疗养院寄出的信"
        place: "哈雷"
        figure: "格奥尔格·康托尔"
        story: '康托尔 1913 年退休，晚年多病，又遇上战时缺粮。1917 年，他最后一次住进哈雷的疗养院。他写信给妻子，请求回家，1918 年 1 月 6 日在院中去世。'
        relic: "一叠索引卡片"
        relic_desc: "卡片上写满了永远列不完的清单。"
        points:
          p1: '问康托尔最想见谁，帮他约一次在哈雷疗养院里能安静说话的探望'
          p2: '和伙房及家人核对冬天还能匀出哪些食物，给他安排一顿能按时吃上的饭'
        points_fail:
          p1: '家里只能回信。他请人搬来的椅子，一直空着。'
          p2: '还得等有人匀出食物才有得吃，康托尔有些日子依然饿着。'
        shift:
          p1:
            was: '1917 年，康托尔最后一次住进哈雷的疗养院，写信给妻子请求回家。'
            now: '这条分支里，{staff}安排了一次探望。那些写在信里的话，康托尔可以当面说给家里人听。'
          p2:
            was: '康托尔晚年多病，战时德国又缺粮。'
            now: '这条分支里，{staff}让康托尔按时吃上了一顿饭。这几天他饿了，不用先等家里送东西过来。'
        vignettes:
          list: '学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。'
          after: '学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。'
          end: '你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。'
text:
  en:
    name: Georg Cantor
    text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression. He died in a clinic in Halle in January 1918.
  zh:
    name: 格奥尔格·康托尔
    text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。1918 年 1 月他在哈雷的疗养院去世。
hook: {en: 'Letter after letter, he asks to be taken home.', zh: '他一封接一封写信，求家里接他回去'}
facts:
  hunger:
    date: '1917'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cantor_halle_mactutor, cantor_halle_duran]
    text:
      en: 'Cantor retired in 1913 and spent his last years ill and short of food under the war conditions in Germany.'
      zh: '康托尔 1913 年退休，最后几年多病，又因战时德国的处境吃不饱。'
    line:
      en: 'The war has emptied the larders; Cantor is ill and short of food.'
      zh: '战时缺粮，康托尔病着，也吃不饱。'
  clinic:
    date: '1917'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [cantor_halle_mactutor, cantor_halle_duran]
    text:
      en: 'In 1917 Cantor entered a clinic in Halle for the last time and wrote to his wife asking to be allowed home.'
      zh: '1917 年，康托尔最后一次住进哈雷的疗养院，写信给妻子请求回家。'
    line:
      en: 'From the clinic Cantor writes to his wife again: he asks to come home.'
      zh: '康托尔又从疗养院写信给妻子，请求回家。'
  death:
    date: '1918-01-06'
    stay_day: 175
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [cantor_halle_mactutor, cantor_halle_duran]
    text:
      en: 'Cantor died of a heart attack in the clinic in Halle on 6 January 1918.'
      zh: '1918 年 1 月 6 日，康托尔在哈雷的疗养院里死于心脏病发作。'
    line:
      en: '6 January 1918: Cantor dies in the clinic in Halle.'
      zh: '1918 年 1 月 6 日，康托尔在哈雷的疗养院去世。'
  countability:
    date: '1874'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [cantor_halle_primary]
    text:
      en: 'Cantor''s 1874 paper gives a way to enumerate the real algebraic numbers and shows that a list cannot contain all real numbers in an interval.'
      zh: '康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。'
