    text:
      en:
        name: "Sizes of infinity"
        place: "Halle"
        figure: "Georg Cantor"
        story: 'Cantor''s 1874 paper gives a way to enumerate the real algebraic numbers and shows that a list cannot contain all real numbers in an interval. The 1884 reading scene is invented.'
        relic: "A set of index cards"
        relic_desc: "Cards covered with lists that never end."
        points:
          p1: 'Tell what the example list is supposed to include'
          p2: 'Follow its rule for another entry'
          p3: 'Explain what still needs proof after drawing the list'
        vignettes:
          list: 'The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.'
          after: 'The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.'
          end: 'You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.'
      zh:
        name: "无穷的大小"
        place: "哈雷"
        figure: "格奥尔格·康托尔"
        story: '康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。本卡的 1884 年阅读场景为虚构。'
        relic: "一叠索引卡片"
        relic_desc: "卡片上写满了永远列不完的清单。"
        points:
          p1: '说明例表打算列进哪些数'
          p2: '照同一规则再添一项'
          p3: '列出一些数后，说清还要证明什么'
        vignettes:
          list: '学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。'
          after: '学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。'
          end: '你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。'
text:
  en:
    name: Georg Cantor
    text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression.
  zh:
    name: 格奥尔格·康托尔
    text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。
