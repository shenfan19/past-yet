    text:
      en:
        name: "Sizes of infinity"
        place: "Halle"
        figure: "Georg Cantor"
        story: 'Cantor''s 1874 paper gives a way to enumerate the real algebraic numbers and shows that a list cannot contain all real numbers in an interval.'
        relic: "A set of index cards"
        relic_desc: "Cards covered with lists that never end."
        points:
          p1: 'In Halle, match Cantor’s successive corrections to the final draft so Mittag-Leffler can receive and review the complete submission'
          p2: 'Have Cantor approve a copy for a small group. Mark what can be demonstrated on its own and which parts remain proposals'
        points_fail:
          p1: 'The editor receives only the previous round of corrections. The final submission cannot be read, and the office recalls the employee.'
          p2: 'Once withdrawn, the work stays in the correspondence. A group willing to read it has no complete copy or stable page references.'
        shift:
          p1:
            was: 'In late 1884 and into spring 1885 Cantor sent a draft and successive changes from Halle. The two corresponded about the editor’s review.'
          p2:
            was: 'In 1885 the early paper on order types was withdrawn. Researchers later edited it from surviving archives.'
            now: 'The circulating copy carries readers’ queries and keeps the dates and authorship of the open sections. Later readers can recover what the first group asked.'
            who: cantor_halle
            bio: 'Cantor worked on sets and order in Halle. Whether readers could follow his new terms was part of his exchange with an editor.'
        vignettes:
          list: 'The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.'
          after: 'The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.'
          end: 'You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.'
      zh:
        name: "无穷的大小"
        place: "哈雷"
        figure: "格奥尔格·康托尔"
        story: '康托尔 1874 年的论文给出了逐一列举实代数数的方法，并说明一张这样排出的名单无法包含区间内所有实数。'
        relic: "一叠索引卡片"
        relic_desc: "卡片上写满了永远列不完的清单。"
        points:
          p1: '在哈雷把坎托尔连寄的修改与最后稿配齐，护住米塔格－莱夫勒确实能收到并回读这项稿件'
          p2: '请坎托尔核准一份小范围传阅本，标出已经能独立说明的部分和仍在拟议的部分'
        points_fail:
          p1: '编辑只收到上一轮的改页，最终稿无法审阅，事务所召回员工。'
          p2: '撤稿后材料只留在编辑往来中，愿意核对的小组没有完整抄本与页次。'
        shift:
          p1:
            was: '1884 年秋冬到 1885 年春，坎托尔从哈雷寄稿并续寄改动，后续通信谈及编辑对稿件的评估。'
          p2:
            was: '1885 年，这篇有关次序类型的早期稿件被撤回，后来由研究者从档案重新整理。'
            now: '小范围传阅本留下阅读意见，未解决的地方仍带原来的署名与日期。日后档案里也能找到当时读者的问题。'
            who: cantor_halle
            bio: '坎托尔在哈雷研究集合与次序。他的新术语能否让读者跟上，是与编辑协商的一部分。'
        vignettes:
          list: '学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。'
          after: '学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。'
          end: '你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。'
text:
  en:
    name: Georg Cantor
    text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression.
  zh:
    name: 格奥尔格·康托尔
    text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。
