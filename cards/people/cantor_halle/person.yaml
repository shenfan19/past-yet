    text:
      en:
        name: "Letters from the clinic"
        place: "Halle"
        figure: "Georg Cantor"
        story: 'Cantor retired in 1913 and spent his last years ill and short of food under the war conditions in Germany. In June 1917 he entered the clinic in Halle for the last time, and wrote to his wife again and again asking to be allowed home. On 6 January 1918 he died there of a heart attack.'
        relic: "A set of index cards"
        relic_desc: "Cards covered with lists that never end."
        points:
          p1: 'Persuade the clinic and his family to let him go home to recover'
          p2: 'Through the last winter of the war, keep him fed and look after his heart, and save him'
        points_fail:
          p1: 'As in history he stays in the clinic. His letters asking to come home go out one after another and are never granted.'
          p2: 'On 6 January 1918, as in history, he dies of a heart attack in the clinic.'
        shift:
          p1:
            was: 'June 1917: Cantor entered the clinic in Halle for the last time and wrote to his wife again and again asking to come home; he was not allowed to.'
            now: 'He went home and recovered among his family.'
          p2:
            was: '6 January 1918: Cantor died of a heart attack in the clinic in Halle, after years of wartime hunger.'
            now: 'That winter he had enough to eat and someone to look after him, and he lived on past January 1918.'
            who: cantor_halle
            bio: 'In this timeline Cantor had food and care through the last winter of the war, and lived on past January 1918.'
        vignettes:
          list: 'The learner says the list is already endless. You ask what would show that everything is on it. They leave a second line for the reasoning rather than merely extending the first.'
          after: 'The learner copies several numbers and forgets the rule for getting the next. You ask them to put the rule first so another person can carry on where the slate ends.'
          end: 'You move the sample list to the side of the slate and let the learner add a line describing which numbers it is meant to include.'
      zh:
        name: "疗养院寄出的信"
        place: "哈雷"
        figure: "格奥尔格·康托尔"
        story: '康托尔 1913 年退休，战时的德国缺粮，他最后几年多病，也吃不饱。1917 年 6 月他最后一次住进哈雷的疗养院，一再写信给妻子，请求让他回家。1918 年 1 月 6 日，他在那里死于心脏病发作。'
        relic: "一叠索引卡片"
        relic_desc: "卡片上写满了永远列不完的清单。"
        points:
          p1: '劝院方和他的家人答应，让他回到家里调养'
          p2: '战时最后一个冬天里，让他吃饱、照看好他的心脏，救下他'
        points_fail:
          p1: '他照史实留在疗养院里，求回家的信一封封寄出去，始终没有获准。'
          p2: '1918 年 1 月 6 日，他照史实在疗养院里死于心脏病发作。'
        shift:
          p1:
            was: '1917 年 6 月，康托尔最后一次住进哈雷的疗养院，一再写信给妻子请求回家，没有获准。'
            now: '他回到了家里，在家人身边养病。'
          p2:
            was: '1918 年 1 月 6 日，康托尔在哈雷的疗养院里死于心脏病发作，此前几年他一直吃不饱。'
            now: '那个冬天他吃得饱，也有人照看，活过了 1918 年 1 月。'
            who: cantor_halle
            bio: '这条时间线里，康托尔在战时最后一个冬天有饭食、有人照看，活过了 1918 年 1 月。'
        vignettes:
          list: '学算者说这张表已经写不到头。你问怎样才知道什么都在上面。他另留一行记理由，没只顾把第一行续长。'
          after: '学算者抄了几个数，却忘了下一个该怎么算。你请他先写规则，石板写到边，换个人也能接下去。'
          end: '你把示例数列移到石板一边，请学算者另添一行，说明它本来打算把哪些数列进去。'
text:
  en:
    name: Georg Cantor
    text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression. He died in a clinic in Halle in January 1918.
  zh:
    name: 格奥尔格·康托尔
    text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。1918 年 1 月他在哈雷的疗养院去世。
