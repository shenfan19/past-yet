    text:
      en:
        name: "Letters from the clinic"
        place: "Halle"
        figure: "Georg Cantor"
        story: 'Cantor retired in 1913 and spent his last years ill and short of food in wartime Germany. In 1917 he entered the clinic in Halle for the last time. He wrote to his wife asking to come home and died in the clinic on 6 January 1918.'
        story_prose:
          opening:
            - 'A chair stands by the window of the clinic in Halle. Cantor sets down a letter he has yet to fold and asks whether anyone will come today. The kitchen ledger has just been brought upstairs. The person carrying the meals is also waiting.'
            - 'Cantor spent his last wartime months in a Halle clinic and died on 6 January 1918. This visit can arrange for him to see a family member and for the kitchen to make a workable meal plan.'
            - 'Send someone who will hear whom he wants to see before arranging a visit. Someone who can check what the kitchen has can find a meal he is able to eat.'
          points:
            p1: 'You write two possible days beneath the letter. Cantor considers them, then names the family member he wants you to ask first. Once there is a date, an attendant moves the chair away from the corridor. People pass outside that afternoon, and the person in the chair can still hear each word.'
            p2: 'The kitchen can say only which days it expects to have something spare. You ask which it can guarantee, check what the family can send, then ask Cantor what he can finish. The next time his meal comes he looks at the clock and says it is the hour they agreed on yesterday.'
          outcomes:
            all: 'There is an extra visit that winter and some meals come at the hour agreed. In January the family still receives word that he has died in Halle.'
            p1: 'Cantor sees the person he most wanted to see. The kitchen can still serve him only what it has to spare that day.'
            p2: 'There are more regular meals. His family cannot come and sends its regards by letter instead.'
          none: 'The chair still looks out of the window. The kitchen folds away the ledger and has no days to promise.'
          not_admitted: 'The attendant says there was no visit arranged today. You leave the folded paper by the door.'
          excerpts:
            p1: 'People pass outside that afternoon, and the person in the chair can still hear each word.'
            p2: 'The next time his meal comes he looks at the clock and says it is the hour they agreed on yesterday.'
        relic: 'An unused envelope'
        relic_desc: 'An invented envelope left beside the letters in Halle.'
        points:
          p1: 'Ask Cantor whom he most wants to see and arrange a quiet visit at the clinic in Halle'
          p2: 'Ask the kitchen and his family what food they can spare that winter, and arrange a regular meal he can finish'
        points_fail:
          p1: 'The family has to answer by letter. The chair Cantor asked for stays empty.'
          p2: 'Food comes when someone can spare it, and Cantor still has days when he goes hungry.'
        shift:
          p1:
            was: 'In 1917 Cantor entered the clinic in Halle for the last time. He wrote to his wife asking to come home.'
            now: 'In this branch {staff} gets a visit arranged. Cantor can tell someone from home what he has been putting into his letters.'
          p2:
            was: 'Cantor was ill in his final years and food was scarce in wartime Germany.'
            now: 'In this branch {staff} arranges a dependable meal for Cantor, so on those days he can eat without waiting for a parcel.'
        vignettes:
          list: 'An attendant starts to put a reply among the outgoing mail. {staff} checks the names on the two covers and returns the reply to Cantor’s table.'
          after: 'A bowl goes past the window. {staff} asks who is still waiting for dinner, and the attendant checks the kitchen list again.'
          end: '{staff} asks Cantor where he wants the chair. He points to the place from which a visitor could see him without standing in the doorway.'
      zh:
        name: "疗养院寄出的信"
        place: "哈雷"
        figure: "格奥尔格·康托尔"
        story: '康托尔 1913 年退休，晚年多病，又遇上战时缺粮。1917 年，他最后一次住进哈雷的疗养院。他写信给妻子，请求回家，1918 年 1 月 6 日在院中去世。'
        story_prose:
          opening:
            - '哈雷疗养院的窗边放着一把椅子。康托尔写完一封信，把还没装封的纸放下，问今天还有没有人来。走廊里的伙房账单刚送上楼，送餐的人也在等。'
            - '康托尔在战时最后一段日子住在哈雷疗养院，1918 年 1 月 6 日去世。家人探望和那一冬的食物是这趟能做的事。两件各自商量。'
            - '派能听完他的话再安排的人，问谁来见他最合适。能跟伙房核实供应的人，再去找一顿他吃得下的饭。'
          points:
            p1: '你把两个可来访的日子写到信纸下面。康托尔看了片刻，请你先带去给他指定的那位家人。探访订下来以后，值班人把椅子放到稍离走廊的地方。那天外面有人经过，椅子上的人也听清了他正说的话。'
            p2: '伙房的人只肯说哪几天有余量。你请他把能保证的几天圈出来，回头又和来人核了家里能匀的食物，再问康托尔哪样吃得下。下一次有人送餐，他看了看钟，说和昨日约好的是同一个时刻。'
          outcomes:
            all: '那年冬天多了一次探望，也有几顿能按时端来的饭。到了次年一月，家人仍收到他在哈雷去世的消息。'
            p1: '康托尔见到自己想见的人。后来送饭仍取决于当日能匀出什么。'
            p2: '他有了较安稳的饭点。家里的人没能到椅子上坐下，只从回信问候他。'
          none: '椅子仍朝着窗。伙房的人把账单再折起来，送餐的日子还定不下。'
          not_admitted: '值班人替房里传话，今天没有约见。你把带来的纸留在门口的信盘。'
          excerpts:
            p1: '那天外面有人经过，椅子上的人也听清了他正说的话。'
            p2: '下一次有人送餐，他看了看钟，说和昨日约好的是同一个时刻。'
        relic: '一只没用过的信封'
        relic_desc: '虚构信封，留在哈雷的来信旁。'
        points:
          p1: '问康托尔最想见谁，帮他约一次在哈雷疗养院里能安静说话的探望'
          p2: '和伙房及家人核对冬天还能匀出哪些食物，给他安排一顿能按时吃上的饭'
        points_fail:
          p1: '家里只能回信。他请人搬来的椅子，一直空着。'
          p2: '还得等有人匀出食物才有得吃，康托尔有些日子依然饿着。'
        shift:
          p1:
            was: '1917 年，康托尔最后一次住进哈雷的疗养院，写信给妻子请求回家。'
            now: '这条分支里，{staff}安排了一次探望。那些写在信里的话，康托尔可以当面说给家里人听。'
          p2:
            was: '康托尔晚年多病，战时德国又缺粮。'
            now: '这条分支里，{staff}让康托尔按时吃上了一顿饭。这几天他饿了，不用先等家里送东西过来。'
        vignettes:
          list: '值班人差点把回信放进要寄出去的信里。{staff}核过两个封面上的名字，把回信放回康托尔桌上。'
          after: '有只碗从窗前经过。{staff}问谁还在等饭，值班人又把伙房的单子核了一遍。'
          end: '{staff}问康托尔希望把椅子放在哪。他指着一个来客坐定就能看见他的位置。'
text:
  en:
    name: Georg Cantor
    text: German mathematician, 1845 to 1918, who taught at Halle. He created set theory and showed that infinite sets come in different sizes. His ideas met fierce criticism and he suffered long periods of depression. He died in a clinic in Halle in January 1918.
  zh:
    name: 格奥尔格·康托尔
    text: 德国数学家，1845 年生，1918 年去世，在哈雷任教。他创立集合论，证明无穷集合有不同的大小。他的想法遭到强烈批评，他本人长期受抑郁困扰。1918 年 1 月他在哈雷的疗养院去世。
hook: {en: 'Letter after letter, he asks to be taken home.', zh: '他一封接一封写信，求家里接他回去'}
