    name: 熔岩平原上的养鱼
    place: 澳大利亚维多利亚州布吉比姆
    figure: 贡迪玛拉人
    story: 贡迪玛拉人在熔岩流上修出水渠和堰，把鳗鱼拦住养起来，这套系统的年代可追到几千年前。
    relic: 一只编织的鳗鱼笼
    relic_desc: 一只长筐，口像漏斗。
    points:
      p1: "垒起引水石堰"
      p2: "看水位怎样被调节"
      p3: "被允许在一旁看养鳗"
