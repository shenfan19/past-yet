    name: Fish farming on a lava plain
    place: Budj Bim, Victoria, Australia
    figure: The Gunditjmara people
    story: The Gunditjmara shape channels and weirs on a lava flow to trap and keep eels, a system dated to thousands of years ago.
    relic: A woven eel trap
    relic_desc: A long basket with a funnel mouth.
    points:
      p1: "Stack the stone weirs that guide the water"
      p2: "Watch how the water level is managed"
      p3: "Be allowed to stand by and watch the eels kept"
