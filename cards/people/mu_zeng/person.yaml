text:
  en:
    name: Mu Zeng
    text: Lijiang prefect and writer (1587–1646). In 1639 Xu Xiake collated books for him. Xu’s diary records that Mu later sent thanks for the work and renewed his request for a gazetteer of Mount Ji.
  zh:
    name: 木增
    text: 丽江土知府、诗文作者（1587–1646）。1639 年，徐霞客为他校书。据徐霞客日记，木增随后遣人酬谢，并再次致书请他编修《鸡山志》。
