    scene:
      points:
        - {id: p1, kind: notice, req: {"stat":{"wit":8}}}
        - {id: p2, kind: hold, req: {"provides":"vigil"}}
        - {id: p3, kind: trust, req: {"job":["teacher"]}}
      vignettes:
        - {id: compare, traits: [methodical, scholarly]}
