    text:
      en: 'The treatise records two bounds, equivalent to 3.1415926 and 3.1415927, separately from 355/113. The year dates the setting, not the treatise’s compilation.'
      zh: '志书记两限，换算为 3.1415926 与 3.1415927，并另记密率 355/113。所标年份是场景年代，不是志书成书年代。'
