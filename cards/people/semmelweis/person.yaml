      text:
        en:
          name: The Vienna handwashing rule
          text: Semmelweis introduced chlorine handwashing in the first maternity clinic in May 1847. His treatise compares patient and death counts by clinic and period.
        zh:
          name: 维也纳洗手规定
          text: 1847 年 5 月，森梅尔维斯在第一产科病房推行含氯洗手。他的著作按病房和时段比较收治与死亡人数。
