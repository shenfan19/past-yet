      text:
        en:
          name: Vienna General Hospital, 1847
          text: One of the largest hospitals in Europe in the mid nineteenth century, with two maternity wards, one where doctors and students delivered and one where midwives did. The maternal death rates of the two wards differed greatly.
        zh:
          name: 维也纳总医院，1847
          text: 十九世纪中叶欧洲最大的医院之一，设有两间产科病房，一间由医生和学生接生，一间由助产士接生。两间病房的产妇死亡率差别很大。
  events:
    handwashing_rule:
      order: 2
      tags:
        - obstetrics
        - sterilize
        - c19
        - vienna
        - history
      related:
        - people:semmelweis
        - places:vienna_clinic
      unlock:
        era: vienna_1847
      refs:
        - semmelweis1861
      text:
        en:
          name: The Vienna handwashing rule
          text: Semmelweis introduced chlorine handwashing in the first maternity clinic in May 1847. His treatise compares patient and death counts by clinic and period. The game's daily counts are model results.
        zh:
          name: 维也纳洗手规定
          text: 1847 年 5 月，森梅尔维斯在第一产科病房推行含氯洗手。他的著作按病房和时段比较收治与死亡人数。游戏报告中的逐日人数来自模型。
