text:
  en:
    name: Ignaz Semmelweis
    text: Obstetrician of Hungarian origin. In 1847 he found that deaths in the dissecting room and the delivery room were linked, and required hands to be washed in a chlorinated lime solution before deliveries.
  zh:
    name: 伊格纳茨·森梅尔维斯
    text: 匈牙利出身的产科医生，1847 年发现解剖室与产房的死亡有关，并要求接生前用氯化石灰溶液洗手。
