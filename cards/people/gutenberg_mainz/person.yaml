    text:
      en:
        name: Printing with movable metal type
        place: Mainz
        figure: Johannes Gutenberg
        story: 'Johann Fust financed Gutenberg’s printing work in Mainz. The 42-line book survives, along with a document from 6 November 1455 recording Fust’s demand for repayment and interest. The document does not record which tools either man kept.'
        relic: A lead type sort
        relic_desc: One small letter of lead and tin, backwards.
        points:
          p1: 'Keep type, paper and workers available long enough to finish the 42-line book while the printing work depends on borrowed money'
          p2: 'Before the November proceedings, help Gutenberg and Fust agree which tools Gutenberg can keep using after their partnership ends'
        points_fail:
          p1: 'The 42-line book stops half printed on the press. This branch has come loose from history, and the office recalls the employee that day.'
          p2: 'The dispute goes ahead without an agreement on the tools. Gutenberg leaves the meeting with no guarantee that he can use them again.'
        shift:
          p1:
            was: '1455: the 42-line book was finished in Gutenberg''s workshop in Mainz, printed with movable metal type.'
          p2:
            was: 'On 6 November 1455 a notary recorded Fust’s demand for repayment and interest. The document leaves the tools’ final ownership unclear.'
            now: 'Gutenberg and Fust agree which tools Gutenberg can keep using. He can plan another run with them when the partnership ends.'
            who: gutenberg_mainz
            bio: 'In this branch Gutenberg secures continued access to some of his printing tools after the 1455 dispute.'
        vignettes:
          wrong_sort: 'You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other''s place.'
          reader: 'You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.'
          proof: 'You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.'
      zh:
        name: 用活动金属字模印书
        place: 美因茨
        figure: 古腾堡
        story: '约翰·富斯特出钱支持古腾堡在美因茨印书。四十二行本留了下来，1455 年 11 月 6 日记下富斯特追讨借款和利息的公证书也在。文书没有写清官司以后各人拿了哪些工具。'
        relic: 一粒铅字
        relic_desc: 铅锡合金的一个小字，是反着的。
        points:
          p1: '护住用借款维持的印工、纸张与活字，让四十二行本能够印完'
          p2: '11 月的官司前，请古腾堡和富斯特谈妥散伙后古腾堡还能继续使用哪些印书工具'
        points_fail:
          p1: '四十二行本印到一半停在印机上，这条分支与历史脱了节，事务所当天召回员工。'
          p2: '双方照样走到公证人那里，工具的用法却没谈拢。古腾堡还不知道自己以后能不能接着用。'
        shift:
          p1:
            was: '1455 年，四十二行本在美因茨古腾堡的印坊里用金属活字印成。'
          p2:
            was: '1455 年 11 月 6 日，美因茨的公证人记下富斯特讨还借款和利息的案子。文书没有写清工具最后归谁。'
            now: '古腾堡与富斯特谈妥自己还能接着用哪些工具。散伙以后，他可以用这些工具安排下一次印书。'
            who: gutenberg_mainz
            bio: '这条分支里，1455 年的争议过后，古腾堡还能使用谈妥的那部分印书工具。'
        vignettes:
          wrong_sort: '学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。'
          reader: '你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。'
          proof: '你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。'
text:
  en:
    name: Johannes Gutenberg
    text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
  zh:
    name: 古腾堡
    text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
hook: {en: 'The book is nearly printed. The money is called in.', zh: '书快印完了，借款也被催讨了。'}
facts:
  loans:
    date: '1452'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_loc, gutenberg_mainz_society]
    text:
      en: 'The Mainz merchant Johann Fust lent Gutenberg 800 guilders on two separate occasions for his printing work.'
      zh: '美因茨商人约翰·富斯特两次各借给古腾堡八百古尔登，供他印书。'
    line:
      en: 'Fust has twice lent Gutenberg 800 guilders for the work of the books.'
      zh: '富斯特已两次各借给古腾堡八百古尔登，供他做印书的事业。'
  bible:
    date: '1455'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_primary]
    text:
      en: 'The surviving 42-line Bible was printed in Mainz around 1454–1455 using movable type.'
      zh: '现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。'
    line:
      en: '1455: the 42-line book is printed in Mainz with movable metal type.'
      zh: '1455 年，四十二行本在美因茨用金属活字印成。'
  lawsuit:
    date: '1455-11-06'
    stay_day: 158
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_helmasperger, gutenberg_mainz_loc]
    text:
      en: 'On 6 November 1455 a notary recorded the case Johann Fust brought against Gutenberg for repayment of his loans with interest; the document is kept at the Göttingen State and University Library.'
      zh: '1455 年 11 月 6 日，公证人记下约翰·富斯特起诉古腾堡、讨还借款和利息一案，文书今藏哥廷根州立与大学图书馆。'
    line:
      en: '6 November 1455: a notary sets down the case Fust has brought against Gutenberg for his loans and interest.'
      zh: '1455 年 11 月 6 日，公证人记下富斯特起诉古腾堡讨还借款和利息一案。'
  workshop:
    date: '1457'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_helmasperger, gutenberg_mainz_bridwell]
    text:
      en: 'Fust later printed in partnership with Peter Schöffer. The legal record does not establish the final division of Gutenberg’s tools.'
      zh: '富斯特后来与彼得·舍费尔合作印书。公证文书没有交代古腾堡的印刷工具最后如何分配。'
    line:
      en: 'After the dispute, Fust and Schöffer go on printing in Mainz.'
      zh: '争议之后，富斯特与舍费尔在美因茨合作印书。'
