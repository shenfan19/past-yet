    text:
      en:
        name: Printing with movable metal type
        place: Mainz
        figure: Johannes Gutenberg
        story: 'Johann Fust financed Gutenberg’s printing work in Mainz. The 42-line book survives, along with a document from 6 November 1455 recording Fust’s demand for repayment and interest. The document does not record which tools either man kept.'
        story_prose:
          opening:
            - 'A Mainz printer holds a fresh sheet to the light and makes a mark in its corner. The paper supplier asks whether he will be paid this time. Gutenberg has a pile of pages to check. Fust has a sum to settle.'
            - 'The forty-two-line edition was completed around this time. A notarial instrument dated 6 November 1455 records the dispute between Gutenberg and Fust. Here you can keep the run supplied and ask them to agree which tools Gutenberg can still use when the partnership ends.'
            - 'Send someone who can check the paper, type and wages. To settle the question of the tools, you also need someone who can get both men to hear an agreement read aloud.'
          points:
            p1: 'The printer counts his stack and says he will need another. You have the supplier count that day’s finished sheets against the work slip, then list the next lot and the wages on separate lines with Gutenberg. The supplier rubs away the mark for taking the stock back. Next morning a fresh sheet is ready on the bed of the press.'
            p2: 'Fust brings the whole account. It does not show what each advance paid for. You ask Gutenberg to begin with the tools he still needs, and have the clerk read the terms for each item to both men. Each takes a copy and the wooden handle stays on its hook. Gutenberg folds his copy into the wages book as he leaves.'
          outcomes:
            all: 'The forty-two-line edition is finished and its backers still have accounts to settle. Each man has a copy of the agreement about the tools Gutenberg can use.'
            p1: 'The printers get through the run and the finished sheets leave the shop. The notary will still hear the argument about tools and money.'
            p2: 'There is a written list of tools he can use. The edition has fallen out of sync and the trip brings back only the record of the discussion.'
          none: 'An unfinished sheet remains on the press. The workers and supplier are still waiting for an answer.'
          not_admitted: 'A printer asks through the doorway whether the visitor has come for the paper or the accounts. Nobody brings you in. From outside there is just the sound of a board set down on the bench.'
          desync: 'The press stops partway through. The paper and wages have run out. The publication falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'Next morning a fresh sheet is ready on the bed of the press.'
            p2: 'Gutenberg folds his copy into the wages book as he leaves.'
        relic: A lead type sort
        relic_desc: One small letter of lead and tin, backwards.
        points:
          p1: 'Keep type, paper and workers available long enough to finish the 42-line book while the printing work depends on borrowed money'
          p2: 'Before the November proceedings, help Gutenberg and Fust agree which tools Gutenberg can keep using after their partnership ends'
        points_fail:
          p1: 'The 42-line book stops half printed on the press. This branch has come loose from history, and the office recalls the employee that day.'
          p2: 'The dispute goes ahead without an agreement on the tools. Gutenberg leaves the meeting with no guarantee that he can use them again.'
        shift:
          p1:
            was: '1455: the 42-line book was finished in Gutenberg''s workshop in Mainz, printed with movable metal type.'
          p2:
            was: 'On 6 November 1455 a notary recorded Fust’s demand for repayment and interest. The document leaves the tools’ final ownership unclear.'
            now: 'Gutenberg and Fust agree which tools Gutenberg can keep using. He can plan another run with them when the partnership ends.'
            who: gutenberg_mainz
            bio: 'In this branch Gutenberg secures continued access to some of his printing tools after the 1455 dispute.'
        vignettes:
          wrong_sort: 'You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other''s place.'
          reader: 'You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.'
          proof: 'You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.'
      zh:
        name: 用活动金属字模印书
        place: 美因茨
        figure: 古腾堡
        story: '约翰·富斯特出钱支持古腾堡在美因茨印书。四十二行本留了下来，1455 年 11 月 6 日记下富斯特追讨借款和利息的公证书也在。文书没有写清官司以后各人拿了哪些工具。'
        story_prose:
          opening:
            - '美因茨的印工把新印的一张举到光下，在页角做个小记号。送纸的人问他这次能不能结钱。古腾堡手里是一叠要核的页，富斯特手里是一笔要对的账。'
            - '史实里，四十二行本在这一时期印成。1455 年 11 月 6 日的公证书留下古腾堡与富斯特争执的记录。这趟可先保住这一批工料，并另外争取两人说清哪些工具散伙后还能用。'
            - '懂印工或核账的人可以替印坊核纸、活字和工钱。要谈器具，还要有人能请两边坐下，把商量结果写进纸里。'
          points:
            p1: '印工算过纸堆，说还有一叠需要补。你让送纸人照着计工单点过当天印好的份数，再同古腾堡一起把下一批纸和工钱分列。送纸人擦去原先写着要收回的记号。第二天，压床上放着能继续接印的第一张新纸。'
            p2: '富斯特拿来一份总账，说看不出哪件是借款置办的。你请古腾堡从眼下还要用的工具讲起，请书记把可继续使用的器具逐条读给两人听。两人各取一份副本，木柄还留在原来的钩上。离开时，古腾堡把自己那份折进工钱簿。'
          outcomes:
            all: '四十二行本印完，富斯特和古腾堡仍要解开账上的纠纷。可继续使用的器具已有两人各自收起的副本。'
            p1: '工班继续印下去，成书的页叠出门。公证人仍会见到两边争论工具和钱。'
            p2: '一份工具使用清单已经写出。书还印不下去，本趟只收回这份商议记录。'
          none: '印床剩着没揭下的一页，工料还等双方答复。'
          not_admitted: '门里的印工问来客找送纸的还是找记账的。无人招呼你进来，外头只听见木板落在台上的一声。'
          desync: '印床停在半途，纸和工钱都没有接上。原有刊印史失去同步，事务所召回员工。'
          excerpts:
            p1: '第二天，压床上放着能继续接印的第一张新纸。'
            p2: '离开时，古腾堡把自己那份折进工钱簿。'
        relic: 一粒铅字
        relic_desc: 铅锡合金的一个小字，是反着的。
        points:
          p1: '护住用借款维持的印工、纸张与活字，让四十二行本能够印完'
          p2: '11 月的官司前，请古腾堡和富斯特谈妥散伙后古腾堡还能继续使用哪些印书工具'
        points_fail:
          p1: '四十二行本印到一半停在印机上，这条分支与历史脱了节，事务所当天召回员工。'
          p2: '双方照样走到公证人那里，工具的用法却没谈拢。古腾堡还不知道自己以后能不能接着用。'
        shift:
          p1:
            was: '1455 年，四十二行本在美因茨古腾堡的印坊里用金属活字印成。'
          p2:
            was: '1455 年 11 月 6 日，美因茨的公证人记下富斯特讨还借款和利息的案子。文书没有写清工具最后归谁。'
            now: '古腾堡与富斯特谈妥自己还能接着用哪些工具。散伙以后，他可以用这些工具安排下一次印书。'
            who: gutenberg_mainz
            bio: '这条分支里，1455 年的争议过后，古腾堡还能使用谈妥的那部分印书工具。'
        vignettes:
          wrong_sort: '学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。'
          reader: '你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。'
          proof: '你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。'
text:
  en:
    name: Johannes Gutenberg
    text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
  zh:
    name: 古腾堡
    text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
hook: {en: 'The book is nearly printed. The money is called in.', zh: '书快印完了，借款也被催讨了。'}
facts:
  loans:
    date: '1452'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_loc, gutenberg_mainz_society]
    text:
      en: 'The Mainz merchant Johann Fust lent Gutenberg 800 guilders on two separate occasions for his printing work.'
      zh: '美因茨商人约翰·富斯特两次各借给古腾堡八百古尔登，供他印书。'
    line:
      en: 'Fust has twice lent Gutenberg 800 guilders for the work of the books.'
      zh: '富斯特已两次各借给古腾堡八百古尔登，供他做印书的事业。'
      zh-Hant: '富斯特已兩次各借給古騰堡八百古爾登，供他做印書的事業。'
      fr: 'Fust a prêté à deux reprises à Gutenberg 800 florins pour la rédaction des livres.'
      es: 'Fust prestó dos veces a Gutenberg 800 florines para la redacción de los libros.'
      ja: 'ファストは書籍の執筆のためにグーテンベルクに二度にわたって800ギルダーを貸している。'
      ko: 'Fust는 책 작업을 위해 Gutenberg 800 길더를 두 번 빌려주었습니다.'
      ru: 'Фуст дважды одолжил Гутенбергу 800 гульденов на работу над книгами.'
  bible:
    date: '1455'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_primary]
    text:
      en: 'The surviving 42-line Bible was printed in Mainz around 1454–1455 using movable type.'
      zh: '现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。'
    line:
      en: '1455: the 42-line book is printed in Mainz with movable metal type.'
      zh: '1455 年，四十二行本在美因茨用金属活字印成。'
      zh-Hant: '1455 年，四十二行本在美因茨用金屬活字印成。'
      fr: "1455\_: le livre de 42 lignes est imprimé à Mayence avec des caractères métalliques mobiles."
      es: '1455: en Maguncia se imprime el libro de 42 líneas con tipos metálicos móviles.'
      ja: '1455年: マインツで42行の本が可動金属活字で印刷される。'
      ko: '1455년: 42행의 책이 마인츠에서 금속활자로 인쇄되었습니다.'
      ru: '1455: 42-строчная книга напечатана в Майнце подвижным металлическим шрифтом.'
  lawsuit:
    date: '1455-11-06'
    stay_day: 158
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_helmasperger, gutenberg_mainz_loc]
    text:
      en: 'On 6 November 1455 a notary recorded the case Johann Fust brought against Gutenberg for repayment of his loans with interest; the document is kept at the Göttingen State and University Library.'
      zh: '1455 年 11 月 6 日，公证人记下约翰·富斯特起诉古腾堡、讨还借款和利息一案，文书今藏哥廷根州立与大学图书馆。'
    line:
      en: '6 November 1455: a notary sets down the case Fust has brought against Gutenberg for his loans and interest.'
      zh: '1455 年 11 月 6 日，公证人记下富斯特起诉古腾堡讨还借款和利息一案。'
      zh-Hant: '1455 年 11 月 6 日，公證人記下富斯特起訴古騰堡討還借款和利息一案。'
      fr: '6 novembre 1455 : un notaire constate le procès intenté par Fust contre Gutenberg pour ses emprunts et intérêts.'
      es: '6 de noviembre de 1455: un notario redacta el proceso que Fust ha iniciado contra Gutenberg por sus préstamos e intereses.'
      ja: '1455年11月6日：公証人がフストがグーテンベルクに対して融資と利息を求めて起こした訴訟を提起する。'
      ko: '1455년 11월 6일: 공증인은 푸스트가 구텐베르크에게 대출금과 이자에 대해 제기한 사건을 기록합니다.'
      ru: '6 ноября 1455 г.: нотариус излагает дело, которое Фуст возбудил против Гутенберга о его займах и процентах.'
  workshop:
    date: '1457'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_helmasperger, gutenberg_mainz_bridwell]
    text:
      en: 'Fust later printed in partnership with Peter Schöffer. The legal record does not establish the final division of Gutenberg’s tools.'
      zh: '富斯特后来与彼得·舍费尔合作印书。公证文书没有交代古腾堡的印刷工具最后如何分配。'
    line:
      en: 'After the dispute, Fust and Schöffer go on printing in Mainz.'
      zh: '争议之后，富斯特与舍费尔在美因茨合作印书。'
      zh-Hant: '爭議之後，富斯特與舍費爾在美因茨合作印書。'
      fr: 'Après la dispute, Fust et Schöffer reprennent l''imprimerie à Mayence.'
      es: 'Después del conflicto, Fust y Schöffer continúan imprimiendo en Maguncia.'
      ja: '論争の後、フストとシェファーはマインツで印刷を続けた。'
      ko: '분쟁 후 Fust와 Schöffer는 마인츠에서 인쇄를 계속합니다.'
      ru: 'После спора Фуст и Шеффер продолжают печатать в Майнце.'
