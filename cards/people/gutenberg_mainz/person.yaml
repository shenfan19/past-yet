      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 20, req: {"any":[{"job":["mechanic","carpenter","woodcarver","proofreader","bookseller"],"stat":{"finesse":5}},{"trait":["handy","methodical"],"stat":{"finesse":7,"will":5}},{"item":"exoskeleton","stat":{"finesse":6}}]}}
