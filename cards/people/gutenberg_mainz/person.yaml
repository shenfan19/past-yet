    text:
      en:
        name: Printing with movable metal type
        place: Mainz
        figure: Johannes Gutenberg
        story: 'The Mainz merchant Johann Fust twice lent Gutenberg 800 guilders for the work of the books. In 1455 the 42-line book was finished in Gutenberg''s workshop, and Fust went to law for his money and interest; on 6 November a notary set down the case. After it the workshop passed to Fust.'
        relic: A lead type sort
        relic_desc: One small letter of lead and tin, backwards.
        points:
          p1: 'While Fust presses for his money, keep the press running and see the last sheets of the 42-line book printed'
          p2: 'Before the notary sets down the case on 6 November, help him put the loans, the accounts and the witnesses in order, and keep his workshop and its tools'
        points_fail:
          p1: 'The 42-line book stops half printed on the press. This branch has come loose from history, and the office recalls the employee that day.'
          p2: 'As in history the workshop and its tools pass to Fust after the case, and in this branch too.'
        shift:
          p1:
            was: '1455: the 42-line book was finished in Gutenberg''s workshop in Mainz, printed with movable metal type.'
          p2:
            was: '6 November 1455: a notary in Mainz set down the case Johann Fust brought against Gutenberg for his loans and interest; afterwards the workshop passed to Fust.'
            now: 'He kept his workshop and its tools through the case, and went on printing in Mainz on his own.'
            who: gutenberg_mainz
            bio: 'In this timeline Gutenberg came through the case of 1455 with his workshop and tools, and went on printing in Mainz in his own shop.'
        vignettes:
          wrong_sort: 'You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other''s place.'
          reader: 'You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.'
          proof: 'You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.'
      zh:
        name: 用活动金属字模印书
        place: 美因茨
        figure: 古腾堡
        story: '美因茨商人约翰·富斯特两次各借给古腾堡八百古尔登，供他做印书的事业。1455 年，四十二行本在古腾堡的印坊里印成，富斯特却打起官司，讨还借款和利息，11 月 6 日公证人把这场官司记了下来。此后印坊归了富斯特。'
        relic: 一粒铅字
        relic_desc: 铅锡合金的一个小字，是反着的。
        points:
          p1: '富斯特催逼还钱的时候，护住印机不停，让四十二行本最后几帖印完'
          p2: '11 月 6 日公证人记下官司之前，帮他把借款、账目和证人理清，保住印坊和那套印书的工具'
        points_fail:
          p1: '四十二行本印到一半停在印机上，这条分支与历史脱了节，事务所当天召回员工。'
          p2: '印坊和那套工具照史实在官司后归了富斯特，这条分支里也一样。'
        shift:
          p1:
            was: '1455 年，四十二行本在美因茨古腾堡的印坊里用金属活字印成。'
          p2:
            was: '1455 年 11 月 6 日，美因茨的公证人记下约翰·富斯特起诉古腾堡讨还借款和利息一案；此后印坊归了富斯特。'
            now: '他在官司里保住了印坊和那套工具，在美因茨接着自己印书。'
            who: gutenberg_mainz
            bio: '这条时间线里，古腾堡在 1455 年的官司里保住了印坊和工具，在美因茨自己的印坊里接着印书。'
        vignettes:
          wrong_sort: '学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。'
          reader: '你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。'
          proof: '你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。'
text:
  en:
    name: Johannes Gutenberg
    text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
  zh:
    name: 古腾堡
    text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
hook: {en: 'The book is nearly printed. The money is called in.', zh: '书快印完了，借款也被催讨了。'}
