text:
  en:
    name: Johannes Gutenberg
    text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
  zh:
    name: 古腾堡
    text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
