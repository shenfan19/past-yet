      zh: '美因茨商人约翰·富斯特两次各借给古腾堡八百古尔登，供他印书。'
    line:
      en: 'Fust has twice lent Gutenberg 800 guilders for the work of the books.'
      zh: '富斯特已两次各借给古腾堡八百古尔登，供他做印书的事业。'
  bible:
    date: '1455'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_primary]
    text:
      en: 'The surviving 42-line Bible was printed in Mainz around 1454–1455 using movable type.'
      zh: '现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。'
    line:
      en: '1455: the 42-line book is printed in Mainz with movable metal type.'
      zh: '1455 年，四十二行本在美因茨用金属活字印成。'
  lawsuit:
    date: '1455-11-06'
    stay_day: 158
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_helmasperger, gutenberg_mainz_loc]
    text:
      en: 'On 6 November 1455 a notary recorded the case Johann Fust brought against Gutenberg for repayment of his loans with interest; the document is kept at the Göttingen State and University Library.'
      zh: '1455 年 11 月 6 日，公证人记下约翰·富斯特起诉古腾堡、讨还借款和利息一案，文书今藏哥廷根州立与大学图书馆。'
    line:
      en: '6 November 1455: a notary sets down the case Fust has brought against Gutenberg for his loans and interest.'
      zh: '1455 年 11 月 6 日，公证人记下富斯特起诉古腾堡讨还借款和利息一案。'
  workshop:
    date: '1455'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gutenberg_mainz_loc, gutenberg_mainz_britannica]
    text:
      en: 'After the dispute Fust took over the workshop and carried on printing.'
      zh: '这场官司之后，富斯特接手了印坊，接着印书。'
    line:
      en: 'After the case the workshop passes to Fust.'
      zh: '官司之后，印坊归了富斯特。'
