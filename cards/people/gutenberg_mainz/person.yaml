    text:
      en:
        name: Printing with movable metal type
        place: Mainz
        figure: Johannes Gutenberg
        story: 'The surviving 42-line Bible was printed in Mainz around 1454–1455 using movable type.'
        relic: A lead type sort
        relic_desc: One small letter of lead and tin, backwards.
        points:
          p1: 'Help the apprentice keep the type in order'
          p2: 'Carry the practice sheets to the reading table'
          p3: 'Catch a mistake in a printed line'
        vignettes:
          wrong_sort: 'You spot a wrong sort just before the apprentice returns it to the box. You set it beside its neighbour and let him see how one face would print into the other''s place.'
          reader: 'You ask whether a crowded line can be read from a lectern. The apprentice moves back and reads it aloud. He marks where his eye jumped to the wrong line.'
          proof: 'You read the fresh proof from the bottom upwards, one line at a time. The apprentice laughs until he catches himself reading what he expects rather than what is on the page.'
      zh:
        name: 用活动金属字模印书
        place: 美因茨
        figure: 古腾堡
        story: '现存的四十二行《圣经》约于 1454 至 1455 年在美因茨以活字印成。'
        relic: 一粒铅字
        relic_desc: 铅锡合金的一个小字，是反着的。
        points:
          p1: '帮学徒把拆下的活字分好'
          p2: '把试印的纸送到读样的桌上'
          p3: '找出校样里漏掉的字'
        vignettes:
          wrong_sort: '学徒正要把一枚活字扔回字格，你认出它放错了。你把它和旁边那枚并在一起，让他看看为什么印出来会串成另一个字。'
          reader: '你问字挤成这样，离远一点还能读吗？学徒退后几步念出声，在眼睛跳错行的地方做了记号。'
          proof: '你拿到校样，从下往上一行一行念。学徒还在笑，转眼发现自己把纸上没印的字也念了出来。'
text:
  en:
    name: Johannes Gutenberg
    text: German printer, about 1400 to 1468, of Mainz. Around 1450 he developed movable metal type and a press, and printed the Bible in the 1450s. His method spread across Europe within decades.
  zh:
    name: 古腾堡
    text: 德国印刷商，约 1400 年生，1468 年去世，美因茨人。约 1450 年他发展出金属活字和印刷机，1450 年代印出了《圣经》。他的方法在几十年里传遍欧洲。
