name: Greenland ice sheet, 1930
short: Greenland
place_name: Greenland ice sheet
tags:
  - medical
  - cold
  - expedition
  - c20
  - greenland
  - history
event_titles:
  time_strain: Time slip
plots: {}
blurb: A scientific expedition on the ice in the last weeks before the dark, with an inland station still short of supplies. Close, cheap, and the effect of warmth and food is clear.
handle_label: Nothing in the record to change
protagonist: Alfred Wegener
protagonist_role: The leader of the German Greenland expedition
stay: Stay seven days
plan_baseline: Main timeline
encyclopedia:
  history:
    - text: 'In 1930 Alfred Wegener led a German expedition to Greenland to study the ice sheet and the weather.'
      check: true
    - text: 'On 30 October 1930 Wegener, Loewe and Villumsen reached the station at Eismitte, in the middle of the ice sheet.'
      check: true
    - text: 'Wegener set out to return on his fiftieth birthday, 1 November, and is thought to have died about 16 November. Villumsen was never found.'
      check: true
    - text: 'A search party found his grave on 12 May 1931.'
      check: true
  regret:
    - You can save today's people but not the whole winter. On the main timeline the plan was not changed in time.
    - Warmth and food matter more than any one clever idea, but a plan only changes when someone is heard.
events:
  time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
star_points:
  settled: 'Keep the ailing going'
  sheltered: 'Get the whole party under cover'
  through: 'Bring the party through these weeks'
milestones:
  first_treat: '{date}: {staff} brews the first hot drink for a man who has stopped talking. He starts to speak.'
  first_protect: '{date}: {staff} hands out the first blankets and sets up a windbreak, and teaches the sledge drivers to do the same.'
  trust_won: '{date}: The sledge drivers no longer keep {staff} out, and some ask for help.'
  exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
  outbreak_fades: '{date}: The number of ailing men falls to one or none.'
  people_settled: '{date}: {staff} has found a warm place and food for everyone who was ailing.'
  well_sheltered: '{date}: {staff} has the whole party under cover and out of the wind.'
  all_through: '{date}: The party is through these weeks with no more than two lost.'
  eismitte_reached: '{date}: Wegener, Loewe and Villumsen reach the Eismitte station in the middle of the ice sheet.'
  left_eismitte: '{date}: On his fiftieth birthday Wegener sets out from Eismitte with Rasmus Villumsen to return to the west coast.'
  last_journey: '{date}: Wegener is thought to have died on the way back about this time. The date is an estimate, and Villumsen was never found.'
summary:
  near_death: '{staff} collapses at Greenland and is pulled back by the recall charm. Life saved, at a price.'
  stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
  gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
  legend: '{staff} left a legend at Greenland. The supply plan was changed {advance_days:1} days earlier than in history.'
  perfect: '{staff} completed the task at Greenland and came back safe. {base_D:i} lost on the main timeline, {D:i} on this branch.'
  scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
  modest: '{staff} spent seven days at Greenland, did what was within reach, and came back safe.'
quotes:
  near_death:
    - trait: kind
      text: At the end I was still wondering whether anyone was keeping watch at night.
    - text: I thought I could hold out a little longer.
  stay_and_gifts:
    - trait: kind
      text: I remember every one of their names. I want to stay a while.
    - text: They need people here.
  gave_up:
    - trait: homesick
      text: I want to go home. That is all.
    - text: I am not cut out for this.
  legend:
    - text: I only told them what they needed to hear.
  perfect:
    - trait: kind
      text: I could save today's people, not tomorrow's.
    - trait: curious
      text: So that is how it is, warmth and food are what keep a party going.
    - text: Did what had to be done.
  scramble:
    - trait: methodical
      text: They will understand sooner or later. Just later.
    - text: Next time I want to bring more.
  modest:
    - trait: glib
      text: I said all I had to say. Whether they listen is up to them.
    - text: With one more item I might have saved one more life.
hints:
  lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
  unused_protect: Blankets were left over. The limit was the trust of the party, not the supplies. Let the employee help people first to build trust.
  unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
  none: Change one thing and send again with the same seed, that makes the comparison clearest.
