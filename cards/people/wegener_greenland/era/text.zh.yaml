quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人守着。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把他们需要听到的话告诉了他们。
  perfect:
    - trait: kind
      text: 我能救今天的人，救不了明天的。
    - trait: curious
      text: 原来是这样，保暖和食物才是让一支队伍撑下去的东西。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，听不听由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 毯子剩下了。限制不是物资，是队伍对你的信任。先让员工帮人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
  ally_gap: 手册在员工花时间和领队在一起时最有用。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
