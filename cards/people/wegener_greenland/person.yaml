    tier: 2
    era: wegener_greenland_1930
    channels: {C: 3, L: 3}
    refs: [wegener_eismitte_archive, wegener_nasa_expedition]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: endure, guard: true, day: 10, req: {"any":[{"trait":["hardy","wanderer"],"stat":{"constitution":7}},{"item":"thermal_suit","stat":{"constitution":5,"will":5}}]}}
        - {id: p2, kind: care, day: 11, req: {"any":[{"job":["doctor","physician","nurse","paramedic"]},{"item":"handbook","stat":{"finesse":7}}]}}
        - {id: p3, kind: hold, day: 12, req: {"any":[{"trait":["hardy","wanderer"],"stat":{"constitution":8,"will":6}},{"item":"scout_drone","stat":{"constitution":6}}]}}
        - {id: p4, kind: care, day: 25, req: {"any":[{"job":["doctor","physician","paramedic"],"stat":{"constitution":7}},{"job":["doctor","physician","paramedic","nurse"],"item":"exoskeleton","stat":{"will":6}}]}}
      vignettes:
