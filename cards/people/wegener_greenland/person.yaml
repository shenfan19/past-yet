        - wegener_sources
        - game
      text:
        en:
          name: The journey back from Eismitte
          text: Wegener set out from Eismitte on 1 November 1930 with Rasmus Villumsen and is thought to have died about 16 November. A search party found his grave on 12 May 1931. In the game an employee can help the party through these weeks, which holds only in this branch.
        zh:
          name: 从艾斯米特返回的路
          text: 魏格纳 1930 年 11 月 1 日和拉斯穆斯·维卢姆森从艾斯米特出发，被认为在 11 月 16 日前后去世。搜寻队 1931 年 5 月 12 日找到他的墓。游戏里员工能帮队伍度过这几周，只在这条分支里成立。
