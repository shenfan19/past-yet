text:
  en:
    name: Greenland ice sheet, 1930
    text: The inland ice of Greenland, where the German expedition of 1930 and 1931 kept a station in the middle of the sheet. Greenland in the game is a party model of about twenty-four people.
  zh:
    name: 格陵兰冰盖，1930
    text: 格陵兰的内陆冰盖，1930 至 1931 年德国考察队在冰盖中央设了一个站点。游戏里的格陵兰是一个约二十四人的队伍模型。
