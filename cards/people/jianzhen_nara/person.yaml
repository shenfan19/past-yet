    refs: [jianzhen_nara_tozhengzhuan, jianzhen_nara_eiei, jianzhen_nara_shoku, jianzhen_nara_arrival, jianzhen_nara_foundation]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: care, day: 8, req: {"any":[{"job":["doctor","physician","nurse","paramedic","medical_teacher","caregiver"],"stat":{"will":5}},{"trait":["kind","patient"],"stat":{"will":5,"constitution":5}}]}}
        - {id: p2, kind: care, day: 150, req: {"any":[{"job":["nurse","caregiver","translator","teacher","archivist"],"stat":{"will":6,"wit":6}},{"trait":["methodical","patient","faithful"],"stat":{"will":7}}]}}
      vignettes:
        - {id: sound, traits: [kind, charismatic, cosmopolitan]}
        - {id: tie, traits: [methodical, vigil, handy]}
        - {id: temple}
    text:
      en:
        name: 'The long road back to Yangzhou'
        place: "Lingnan"
        figure: "Jianzhen"
        story: 'Jianzhen’s fifth attempt to sail to Japan brought him to Hainan instead. On the long way back, Eiei, a monk who had come to ask him to travel to Japan, fell ill and died at Duanzhou. Jianzhen lost his sight on the journey. Accounts give different explanations.'
        story_prose:
          opening:
            - 'In Duanzhou a companion sets the newly copied route papers by the door. Someone inside Eiei’s room has asked the people bringing messages to wait. Jianzhen comes by to ask whether he can sit inside for a little while.'
            - 'The account of Jianzhen’s voyages records Eiei’s death at Duanzhou. Jianzhen’s sight later grew worse, and the party went back toward Yangzhou. This branch takes two small moments from the journey. You can give the two men time to speak and later read the onward route to Jianzhen.'
            - 'Someone with experience in care can ask what Eiei wants. A traveller who can read the papers and listen to different people can later read the route to Jianzhen, stop by stop.'
          points:
            p1: 'After the person asking about departure goes away, you ask Eiei if he wants Jianzhen to come in. He nods and asks for a stool that leaves the door clear. You agree with the others to hold their messages, then wait in the yard. From inside there are two voices. When they grow softer, nobody hurries them.'
            p2: 'The papers are folded in a stack, and a companion is about to tell Jianzhen the route he decided on. You read out the stops still in question and say where the party might have to stay overnight. Jianzhen asks for a name once more before saying which stage he wants to take first. Someone writes his choice on the sheet that held only place names.'
          outcomes:
            all: 'The two men have time to speak. Eiei still dies in Duanzhou. Later, when Jianzhen cannot read the papers, they travel by a route he has heard aloud.'
            p1: 'The two men are able to meet. Eiei still dies, and the later route papers will need someone to explain them to Jianzhen.'
            p2: 'Jianzhen hears the next stages and decides for himself where he wants to go. The chance to spend time with Eiei has already passed.'
          none: 'The route papers go back in their bundle. The messages in the room and the places ahead still await someone to read them out.'
          not_admitted: 'You never enter the room where Eiei is staying. The papers are taken away and nobody reads them by the door.'
          excerpts:
            p1: 'From inside there are two voices. When they grow softer, nobody hurries them.'
            p2: 'Someone writes his choice on the sheet that held only place names.'
        relic: 'A sheet of route notes'
        relic_desc: 'An invented sheet from the party’s journey north.'
        points:
          p1: 'At Duanzhou, ask how Eiei wants to be cared for and make time for him to speak with Jianzhen'
          p2: 'As Jianzhen’s sight fails, have the party read its plans aloud so he can decide how he wants to continue'
        points_fail:
          p1: 'There is always something else to settle and the people at the bedside keep being called away. The time to talk passes.'
          p2: 'The party gathers the route notes in a bundle again. Jianzhen has to wait for someone to tell him what is on the page.'
        shift:
          p1:
            was: 'Eiei fell ill and died at Duanzhou on the return journey after the fifth attempt to sail to Japan.'
            now: 'In this branch {staff} stays with Eiei at Duanzhou and calls Jianzhen to the bedside. There is time for them to speak in private.'
          p2:
            was: 'Accounts say that Jianzhen lost his sight on this journey. He later sailed to Japan.'
            now: 'In this branch {staff} reads out the next stops. Jianzhen asks the others to change one stop and tells them when he wants to set out again.'
        vignettes:
          sound: 'A companion points to the next town on the sheet. {staff} asks for the name to be read twice while Jianzhen listens.'
          tie: 'The party is about to tie the route papers shut. {staff} holds the bundle open until someone checks the order of the stops.'
          temple: '{staff} answers a question in the yard so the people inside can finish speaking without raising their voices.'
      zh:
        name: '回扬州的长路'
        place: "岭南"
        figure: "鉴真"
        story: '鉴真第五次尝试前往日本，船却被风吹到海南。北返途中，曾来扬州请他东渡的日僧荣叡在端州病逝。鉴真在路上失明，两部早期文献对经过的记述不同。'
        story_prose:
          opening:
            - '端州，同行人把刚抄好的路引搁在门边。荣叡的屋里有人坐着，几次让外面传话的人等。鉴真来问，能不能让他先进去坐一会儿。'
            - '《唐大和上东征传》记鉴真一行过端州时，荣叡在那里去世。其后鉴真视力减退，一行继续返回扬州。分支借这段行程写两件小事，先给两人留一段说话的时间，之后让鉴真听得到行程。'
            - '懂照护的人可以先去问荣叡所愿。会读路引或能听清多方说法的人，再把后面的去向一处处念给鉴真。'
          points:
            p1: '等外面来问行期的人走开，你先问荣叡愿不愿让鉴真进来。他点头，要端来一把不挡门的凳子。你与旁人说定这段工夫先不传话，转到院子里等。门里传来两个人说话的声音，声音轻了也没人催他们。'
            p2: '路引叠了几层，同行人正想直接告诉鉴真已经定好的走法。你先把还没确定的几个地方念出声，让他听见哪里需要留一宿。鉴真问其中一处的名字，又听了一遍，才说自己想先走哪一段。有人把他的决定写到原先只留着地名的那张纸上。'
          outcomes:
            all: '荣叡和鉴真有过一段说话的工夫，荣叡仍在端州去世。往后鉴真看不清字时，一行人照着他听过的路线走。'
            p1: '两人保住那一场会面。荣叡仍去世；后来路引上的字，鉴真还要别人慢慢转告。'
            p2: '鉴真听过下一程，自己说了想走的路。荣叡身边那段没说完的话没有补回来。'
          none: '路引重新捆成一束。屋里要传的话和屋外要走的路，都还等旁人来说明。'
          not_admitted: '你没能进荣叡借住的屋子。另一份路引随同行人收回，没从门边念出声。'
          excerpts:
            p1: '门里传来两个人说话的声音，声音轻了也没人催他们。'
            p2: '有人把他的决定写到原先只留着地名的那张纸上。'
        relic: '一页行程纸'
        relic_desc: '虚构路记，记一行人北上的去向。'
        points:
          p1: '在端州问荣叡想怎样被照料，再替他和鉴真留一段能说话的时间'
          p2: '鉴真看不清时，把一行人的行程念出声，请他自己决定接下来怎么走'
        points_fail:
          p1: '总有别的事要办，守在榻边的人一再被叫走。两人还能说话的那段时间，就这样过去了。'
          p2: '同行的人又把路引捆回了一束。鉴真看不清纸上的字，只能等别人告诉他。'
        shift:
          p1:
            was: '第五次渡海失败后的北返途中，荣叡在端州病逝。'
            now: '这条分支里，{staff}在端州守着荣叡，把鉴真请到榻边。两人得空单独说了一会儿话。'
          p2:
            was: '早期文献记载鉴真在这趟归途中失明，后来仍东渡日本。'
            now: '这条分支里，{staff}把接下来几个落脚处念给鉴真听。鉴真请同行改了一站，也说明自己想什么时候再出发。'
        vignettes:
          sound: '同行人指着纸上的下一站。鉴真在听，{staff}请对方把地名念两次。'
          tie: '一行人要把路引捆起来。{staff}撑开纸束，待有人核对完去处的先后。'
          temple: '{staff}到院里回答来人的问题，屋里的两人不用提高声音就能把话讲完。'
text:
  en:
    name: Jianzhen
    text: Teacher from Yangzhou in Tang China, 688 to 763. Asked to Japan by Japanese visitors in 742, he failed five times to cross; after the fifth attempt he lost his sight on the way back. He sailed again in 753, reached Nara in 754 and taught there, and in 759 he founded a new place of study in Nara, where he died.
  zh:
    name: 鉴真
    text: 唐代扬州人，688 年生，763 年去世。742 年日本来客请他东渡，前五次都没渡成，第五次失败后的归途中双目失明。753 年他再次起航，754 年到奈良讲学，759 年在奈良另建讲学之所，后来在那里去世。
hook: {en: 'His eyes grow dimmer with every day of the road.', zh: '路走得越远，他的眼睛越暗。'}
facts:
  fifth_voyage:
    date: '748'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_arrival]
    text:
      en: 'In 748 Jianzhen set out from Yangzhou on his fifth attempt to reach Japan; the ship was blown off course to Hainan, and he made his way back north overland.'
      zh: '748 年，鉴真第五次从扬州出发东渡，船被风吹离航路，漂到海南，此后他走陆路北返。'
  eiei:
    date: '750'
    stay_day: 30
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_eiei]
    text:
      en: 'On the way back, Eiei, the Japanese visitor who had asked Jianzhen to Japan in 742, fell ill and died at Duanzhou. Sources give the year as 749 to 751.'
      zh: '北返途中，742 年请鉴真东渡的日本人荣叡在端州病逝，年份各书记作 749 到 751 年不等。'
    line:
      en: 'Duanzhou: Eiei, who came to Yangzhou to ask Jianzhen across, dies of his illness.'
      zh: '端州，当年到扬州请鉴真东渡的荣叡病逝。'
      fr: 'Duanzhou : Eiei, venu à Yangzhou pour demander à Jianzhen de passer, meurt de sa maladie.'
      es: 'Duanzhou: Eiei, que vino a Yangzhou para invitar a Jianzhen a cruzar, muere a causa de su enfermedad.'
      ja: '端州：鑑真を訪ねるために揚州に来た永栄が病で亡くなる。'
      ko: '단주: 건진에게 건너가자고 양주에 온 에이에이가 병으로 사망한다.'
      ru: 'Дуаньчжоу: Эйэй, приехавший в Янчжоу, чтобы пригласить Цзяньчжэня переправиться, умирает от болезни.'
      zh-Hant: '端州，當年到揚州請鑑真東渡的榮叡病逝。'
  eyes:
    date: '750'
    stay_day: 146
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_shoku]
    text:
      en: 'The account by Ōmi no Mifune places the loss of sight after treatment on the return journey. Shoku Nihongi associates it with Jianzhen grieving Eiei’s death.'
      zh: '真人元开的传记把失明写在归途中治眼之后，《续日本纪》则把失明同鉴真为荣叡病逝而哀哭联系起来。'
    line:
      en: 'On the journey north, Jianzhen loses his sight.'
      zh: '北返途中，鉴真失明。'
      fr: 'Lors du voyage vers le nord, Jianzhen perd la vue.'
      es: 'En el viaje hacia el norte, Jianzhen pierde la vista.'
      ja: '北へ向かう途中、鑑真は視力を失います。'
      ko: '북쪽으로 여행하던 중 Jianzhen은 시력을 잃습니다.'
      ru: 'По пути на север Цзяньчжэнь теряет зрение.'
      zh-Hant: '北返途中，鑑真失明。'
  arrival:
    date: '754'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [jianzhen_nara_arrival]
    text:
      en: 'Jianzhen sailed again in 753 and reached Nara in 754, where he taught.'
      zh: '鉴真 753 年再次起航，754 年到达奈良，在那里讲学。'
  foundation:
    date: '759'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [jianzhen_nara_foundation]
    text:
      en: 'In 759 Jianzhen was granted land in Nara and founded a new place of study there.'
      zh: '759 年，鉴真在奈良获赐土地，另建讲学之所。'
