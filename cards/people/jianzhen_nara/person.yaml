    text:
      en:
        name: 'The long road back to Yangzhou'
        place: "Lingnan"
        figure: "Jianzhen"
        story: 'In 748 Jianzhen of Yangzhou set out for Japan for the fifth time, and his ship was blown to Hainan. On the long way back overland, Eiei, the Japanese visitor who had come to Yangzhou to ask him across, fell ill and died at Duanzhou. Further on, at Shaozhou, Jianzhen''s failing eyes were treated by a man who said he could cure them, and afterwards he was blind.'
        relic: 'A practice wrapper label'
        relic_desc: 'An invented label used by the fictional temple helpers.'
        points:
          p1: 'When Eiei falls ill at Duanzhou, nurse him and cure him'
          p2: 'Before the man at Shaozhou treats Jianzhen''s eyes, talk him out of it and treat the eyes properly'
        points_fail:
          p1: 'As in history Eiei dies at Duanzhou. Jianzhen sees him to his burial and goes on north without him.'
          p2: 'As in history the treatment leaves him blind. Three years later he crosses to Japan without his sight.'
        shift:
          p1:
            was: 'Around 750, on the way back after the fifth failed crossing, Eiei, who had come to Yangzhou ten years before to ask Jianzhen to Japan, fell ill and died at Duanzhou.'
            now: 'He got well at Duanzhou and went on north with the others.'
          p2:
            was: '750, Shaozhou: after the heat and strain of the road Jianzhen''s eyes had grown dim. A man who said he could cure eyes treated them, and afterwards he was blind.'
            now: 'He never let the man treat him. His eyes were cured, and he could see the road and the people beside him.'
            who: jianzhen_nara
            bio: 'In this timeline Jianzhen kept his eyes on the road back of 750, and later saw the sea he crossed to Japan.'
        vignettes:
          sound: 'Chiyo points to the right bundle from across the room. Jun still cannot tell which one she means on the crowded shelf. You ask her to read the opening aloud instead. Jun finds the matching words on the wrapper and sets the bundle down for the next reader.'
          tie: 'Jun starts to retie a loose wrapper before checking the order. You hold the bundle as Chiyo reads the first line of each part in turn. He puts one misplaced part back. The bundle will now open in the order in which they practised it.'
          temple: 'You know the name of the temple that will be founded in 759. Chiyo only needs to mark where to take this reading in the morning. You help her write Tōdai-ji on the wrapper. The other temple still belongs to a future you will not see on this visit.'
      zh:
        name: '回扬州的长路'
        place: "岭南"
        figure: "鉴真"
        story: '748 年，扬州的鉴真第五次动身去日本，船被风吹到海南。走陆路北返的长路上，十年前到扬州请他东渡的日本人荣叡在端州病逝。再往前到了韶州，鉴真日渐昏暗的眼睛经一个自称会治眼的人治过，从此失明。'
        relic: '一张练习用的卷签'
        relic_desc: '故事中的帮工使用的经卷签。'
        points:
          p1: '荣叡在端州病倒，照料他，把病治好'
          p2: '韶州那人给鉴真治眼之前，劝他别让人乱治，把眼睛好好治好'
        points_fail:
          p1: '荣叡照史实病逝于端州，鉴真为他送葬，没有他同行，继续北上。'
          p2: '那次治疗照史实让他双目失明，三年后他看不见地渡海去了日本。'
        shift:
          p1:
            was: '750 年前后，第五次渡海失败后的归途中，十年前到扬州请鉴真东渡的日本人荣叡在端州病逝。'
            now: '他在端州病好了，和一行人一起继续北上。'
          p2:
            was: '750 年，归途走到韶州，鉴真的眼睛因一路炎热劳顿日渐昏暗，一个自称会治眼的人给他治过以后，他双目失明。'
            now: '他没让那人动手，眼睛治好了，看得清路上的山水和身边的人。'
            who: jianzhen_nara
            bio: '这条时间线里，鉴真在 750 年的归途中保住了眼睛，后来看得见他渡过去的那片海。'
        vignettes:
          sound: '千代隔着屋子指给人看，可架上摆得太满，准还是分不清她指哪束。你请她念出开头。准听着去对包纸上的字，找到那一束，给接读的人摆了出来。'
          tie: '准想先把松开的包纸捆上，还没核对里面的次序。你扶着那束经卷，千代挨个念每部分的头一句。准把放错的一份放了回去。下次打开时，次序就是他们练过的那样。'
          temple: '你知道759年还会有一座寺。千代只要写清明早这束经往哪里送。你帮她在包纸上写东大寺。另一座寺还在未来，这趟见不到。'
text:
  en:
    name: Jianzhen
    text: Teacher from Yangzhou in Tang China, 688 to 763. Asked to Japan by Japanese visitors in 742, he failed five times to cross; after the fifth attempt he lost his sight on the way back. He sailed again in 753, reached Nara in 754 and taught there, and in 759 he founded a new place of study in Nara, where he died.
  zh:
    name: 鉴真
    text: 唐代扬州人，688 年生，763 年去世。742 年日本来客请他东渡，前五次都没渡成，第五次失败后的归途中双目失明。753 年他再次起航，754 年到奈良讲学，759 年在奈良另建讲学之所，后来在那里去世。
hook: {en: 'His eyes grow dimmer with every day of the road.', zh: '路走得越远，他的眼睛越暗。'}
facts:
  fifth_voyage:
    date: '748'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_enwiki]
    text:
      en: 'In 748 Jianzhen set out from Yangzhou on his fifth attempt to reach Japan; the ship was blown off course to Hainan, and he made his way back north overland.'
      zh: '748 年，鉴真第五次从扬州出发东渡，船被风吹离航路，漂到海南，此后他走陆路北返。'
  eiei:
    date: '750'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_eiei]
    text:
      en: 'On the way back, Eiei, the Japanese visitor who had asked Jianzhen to Japan in 742, fell ill and died at Duanzhou. Sources give the year as 749 to 751.'
      zh: '北返途中，742 年请鉴真东渡的日本人荣叡在端州病逝，年份各书记作 749 到 751 年不等。'
    line:
      en: 'Duanzhou: Eiei, who came to Yangzhou to ask Jianzhen across, dies of his illness.'
      zh: '端州，当年到扬州请鉴真东渡的荣叡病逝。'
  eyes:
    date: '750'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [jianzhen_nara_tozhengzhuan, jianzhen_nara_enwiki, jianzhen_nara_jawiki]
    text:
      en: 'At Shaozhou, after the heat and strain of the road had dimmed his eyes, Jianzhen was treated by a man who said he could cure eyes, and afterwards he was blind. Later writers suggest infection or age related cataract.'
      zh: '在韶州，一路炎热劳顿使鉴真的眼睛昏暗，一个自称会治眼的人给他治过以后，他双目失明。后人推测是感染或老年白内障。'
    line:
      en: 'Shaozhou: a man who says he can cure eyes treats Jianzhen, and afterwards he cannot see.'
      zh: '韶州，一个自称会治眼的人给鉴真治眼，治过以后他看不见了。'
  arrival:
    date: '754'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [jianzhen_nara_arrival]
    text:
      en: 'Jianzhen sailed again in 753 and reached Nara in 754, where he taught.'
      zh: '鉴真 753 年再次起航，754 年到达奈良，在那里讲学。'
  foundation:
    date: '759'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [jianzhen_nara_foundation]
    text:
      en: 'In 759 Jianzhen was granted land in Nara and founded a new place of study there.'
      zh: '759 年，鉴真在奈良获赐土地，另建讲学之所。'
bystanders:
  chiyo:
    invented: true
    text: {en: 'A fictional temple helper who can read the opening aloud.', zh: '虚构帮工千代，能把开头念给人听。'}
  jun:
    invented: true
    text: {en: 'A fictional helper bundling the texts for the next reader.', zh: '虚构帮工准，要为接读的人把经卷收好。'}
