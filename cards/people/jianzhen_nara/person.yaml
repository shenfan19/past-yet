    text:
      en:
        name: 'The shelf at Tōdai-ji'
        place: "Nara"
        figure: "Jianzhen"
        story: 'After leaving China in 753, Jianzhen reached Nara in 754. He transmitted Buddhist precepts at Tōdai-ji, and Tōshōdai-ji came later.'
        relic: 'A practice wrapper label'
        relic_desc: 'An invented label used by the fictional temple helpers.'
        points:
          p1: 'Prepare a place for the party’s books and belongings at Tōdai-ji. Check which volumes the travelers will need to reach first'
          p2: 'Ask the visiting readers to put their Chinese labels and the receiving office’s names for the same texts on one sheet'
          p3: 'Keep two copies of the catalogue for future delivery, reading and copying. Have the people who know each half check the entries'
        points_fail:
          p1: 'Some fascicles go to another store with the luggage. The receiving clerk cannot find the first set, and the office recalls the employee.'
          p2: 'The same volume is recorded under two names. Someone trying to borrow it has to open each chest.'
          p3: 'The first delivery is complete. Later visitors still have to find someone who was present at the handover to identify the scrolls.'
        shift:
          p1:
            was: 'Jianzhen’s party reached Tōdai-ji in Nara in 754. The travelers and the things they brought entered its community.'
          p2:
            was: 'Documents from Nara-period Tōdai-ji show scrolls registered by number, source and where they were kept.'
            now: 'Both names point to the same fascicle. The visitors know where it is when they first ask to consult it.'
          p3:
            was: 'Jianzhen later helped establish Tōshōdai-ji. Study at both institutions continued through later generations.'
            now: 'When a reader goes to the new site, a catalogue at Tōdai-ji can still be matched to the copies received. Both places can record later additions.'
            who: jianzhen_nara
            bio: 'Jianzhen reached Nara with companions. The texts they brought and the work of people receiving them contributed to what was passed on.'
        vignettes:
          sound: 'Chiyo points to the right bundle from across the room. Jun still cannot tell which one she means on the crowded shelf. You ask her to read the opening aloud instead. Jun finds the matching words on the wrapper and sets the bundle down for the next reader.'
          tie: 'Jun starts to retie a loose wrapper before checking the order. You hold the bundle as Chiyo reads the first line of each part in turn. He puts one misplaced part back. The bundle will now open in the order in which they practised it.'
          temple: 'You know the name of the temple that will be founded in 759. Chiyo only needs to mark where to take this reading in the morning. You help her write Tōdai-ji on the wrapper. The other temple still belongs to a future you will not see on this visit.'
      zh:
        name: '东大寺里的一层架'
        place: "奈良"
        figure: "鉴真"
        story: '鉴真于753年离开中国，754年抵达奈良。他在东大寺传授戒律，后来才有唐招提寺。'
        relic: '一张练习用的卷签'
        relic_desc: '故事中的帮工使用的经卷签。'
        points:
          p1: '在奈良给东大寺接收一行人的书物安排位置，逐件核对哪几份需要先让同行人取用'
          p2: '请同行的讲读者把汉文卷标和熟悉本地收件方式的名字放在同一张纸上'
          p3: '在奈良留下请求讲读与抄阅时能用的双份目录，请两地来的人各核自己知道的部分'
        points_fail:
          p1: '行李暂放时几卷迁往别库，来接收的人找不到第一批书物，事务所召回员工。'
          p2: '一卷只用了来处的叫法，本地经手人又另起一名，日后查卷时只能逐箱找。'
          p3: '第一次接收已完成，后续到访的人仍要找原来在场的人才能辨别书卷。'
        shift:
          p1:
            was: '鉴真一行在 754 年抵达奈良东大寺，带去的人员与物件进入寺院使用。'
          p2:
            was: '奈良时期的东大寺存有按来源、卷数与经房记录收存文书的实例。'
            now: '一份对照表可在两种叫法下找到同一卷。同行人第一次领取就知道卷在何处。'
          p3:
            was: '鉴真后来参与创建唐招提寺。东大寺与唐招提寺的研究和承续由多代人员传下。'
            now: '后来有人另到新处讲读，东大寺的一份目录仍能与他领到的抄卷核对。两处可以据此分别补登记。'
            who: jianzhen_nara
            bio: '鉴真东渡后与同伴到达奈良。他们携来的文书和在地人员的工作共同参与了后续传承。'
        vignettes:
          sound: '千代隔着屋子指给人看，可架上摆得太满，准还是分不清她指哪束。你请她念出开头。准听着去对包纸上的字，找到那一束，给接读的人摆了出来。'
          tie: '准想先把松开的包纸捆上，还没核对里面的次序。你扶着那束经卷，千代挨个念每部分的头一句。准把放错的一份放了回去。下次打开时，次序就是他们练过的那样。'
          temple: '你知道759年还会有一座寺。千代只要写清明早这束经往哪里送。你帮她在包纸上写东大寺。另一座寺还在未来，这趟见不到。'
text:
  en:
    name: Jianzhen
    text: Chinese Buddhist monk, 688 to 763. He sailed in 753 and reached Nara in 754. He taught the Buddhist precepts at Tōdai-ji, and Tōshōdai-ji was established in 759.
  zh:
    name: 鉴真
    text: 中国僧人，688年生，763年去世。他于753年起航，754年抵达奈良，在东大寺传戒。唐招提寺创建于759年。
hook: {en: 'A bundle must be ready before the lesson.', zh: '开讲前，还得找齐一束经卷。'}
