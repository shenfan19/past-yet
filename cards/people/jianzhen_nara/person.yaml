- jianzhen_nara
text:
  en:
    name: Jianzhen
    text: Chinese Buddhist monk, 688 to 763. After five failed attempts and the loss of his sight, he reached Japan in 754, taught monastic rules and founded Toshodaiji temple at Nara.
  zh:
    name: 鉴真
    text: 中国僧人，688 年生，763 年去世。五次东渡失败并双目失明之后，他在 754 年抵达日本，传授戒律，并在奈良创建唐招提寺。
