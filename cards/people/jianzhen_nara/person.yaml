quotes:
  jianzhen_nara_story_echo_full:
    order: 1
    tier: full
    date: '779'
    checked: official_record
    sources: [jianzhen_nara_story_echo_source_full]
    original: zh-Hant
    contextual: true
    text:
      en:
        who: 'Ōmi no Mifune'
        quote: 'They went down the Gui River, reached Wuzhou after seven days, and then came to Longxing Temple in Duanzhou.'
        occasion: 'The later biography lists these stops before recording Eiei’s death. Its date is that of the text.'
      zh:
        who: '真人元开'
        quote: '顺桂江而下，七日到梧州，再到端州龙兴寺。'
        occasion: '后世传记记荣叡去世前的几处停靠。日期为传记成书年。'
      zh-Hant:
        who: '真人元开'
        quote: '下桂江，七日至梧州，次至端州龍興寺。'
        occasion: '后世传记记荣叡去世前的几处停靠。日期为传记成书年。'
      fr:
        who: 'Ōmi no Mifune'
        quote: 'Ils descendirent la rivière Gui, atteignirent Wuzhou après sept jours, puis arrivèrent au temple Longxing à Duanzhou.'
        occasion: 'La biographie ultérieure énumère ces arrêts avant d’enregistrer la mort d’Eiei. Sa date est celle du texte.'
      es:
        who: 'Omi no Mifune'
        quote: 'Bajaron por el río Gui, llegaron a Wuzhou después de siete días y luego llegaron al templo Longxing en Duanzhou.'
        occasion: 'La biografía posterior enumera estas paradas antes de registrar la muerte de Eiei. Su fecha es la del texto.'
      ja:
        who: '近江御船'
        quote: '彼らは桂川を下り、7日後に梧州に到着し、端州の龍興寺にやって来ました。'
        occasion: '後の伝記では、永栄の死を記録する前にこれらの立ち寄り場所が列挙されています。日付は本文の日付です。'
      ko:
        who: '오미노미후네'
        quote: '그들은 귀수를 따라 내려가서 7일 만에 오주에 이르렀고, 단주 용흥사에 이르렀습니다.'
        occasion: '이후의 전기에는 Eiei의 죽음을 기록하기 전의 이러한 정거장이 나열되어 있습니다. 그 날짜는 본문의 날짜입니다.'
      ru:
        who: 'Оми-но Мифунэ'
        quote: 'Они спустились по реке Гуй, через семь дней достигли Учжоу, а затем пришли в храм Лунсин в Дуаньчжоу.'
        occasion: 'В более поздней биографии перечислены эти остановки перед записью смерти Эйэя. Его дата совпадает с датой текста.'
  jianzhen_nara_story_echo_none:
    order: 2
    tier: none
    date: '779'
    checked: official_record
    sources: [jianzhen_nara_story_echo_source_none]
    original: zh-Hant
    contextual: true
    text:
      en:
        who: 'Ōmi no Mifune'
        quote: 'Eiei died suddenly, and the master was in deep grief.'
        occasion: 'The biography describes what happened in Duanzhou. The date is that of the text.'
      zh:
        who: '真人元开'
        quote: '荣叡突然去世，鉴真十分悲痛。'
        occasion: '传记记端州发生的事。日期为传记成书年。'
      zh-Hant:
        who: '真人元开'
        quote: '榮叡師奄然遷化，大和上哀慟悲切'
        occasion: '传记记端州发生的事。日期为传记成书年。'
      fr:
        who: 'Ōmi no Mifune'
        quote: 'Eiei mourut subitement et le maître était profondément chagriné.'
        occasion: 'La biographie décrit ce qui s''est passé à Duanzhou. La date est celle du texte.'
      es:
        who: 'Omi no Mifune'
        quote: 'Eiei murió repentinamente y el maestro quedó profundamente afligido.'
        occasion: 'La biografía describe lo que sucedió en Duanzhou. La fecha es la del texto.'
      ja:
        who: '近江御船'
        quote: '栄栄が急逝し、師匠は深い悲しみに暮れました。'
        occasion: '伝記には端州で何が起こったかが記載されています。日付は本文の日付です。'
      ko:
        who: '오미노미후네'
        quote: '에이에이는 갑자기 세상을 떠났고, 주인은 깊은 슬픔에 빠졌습니다.'
        occasion: '전기는 단저우에서 일어난 일을 설명합니다. 날짜는 본문의 날짜입니다.'
      ru:
