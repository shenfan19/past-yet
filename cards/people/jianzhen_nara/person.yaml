    scene:
      points:
        - {id: p1, kind: hold, req: {"trait":["methodical","vigil"]}}
        - {id: p2, kind: notice, req: {"job":["nurse","pharmacist","physician"]}}
        - {id: p3, kind: trust, redeem: true, req: {"trait":["kind","cosmopolitan","charismatic"]}}
