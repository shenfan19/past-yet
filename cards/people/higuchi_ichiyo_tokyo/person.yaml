    text:
      en:
        name: 'Seven instalments on one counter'
        place: "Tokyo"
        figure: "Higuchi Ichiyo"
        story: 'Higuchi Ichiyō’s Takekurabe appeared in seven instalments in Bungakukai in 1895 and January 1896. Bungei Kurabu published it together in April 1896.'
        relic: "A pocket diary"
        relic_desc: "A diary kept for years in careful brush writing."
        points:
          p1: 'Gather all seven installments from Bungakukai and check the collected proofs with Higuchi so the revised work can appear in April'
          p2: 'When the collected text appears, help Higuchi negotiate a separate edition with a payment in advance and the proofs of her choice'
          p3: 'When Ichiyō''s fever will not break in July, find the tuberculosis early and cure her'
        points_fail:
          p1: 'One issue is missing from the pile. The editor gets an incomplete collected text, and the office recalls the employee.'
          p2: 'The collected version can be borrowed, but the bookseller keeps her waiting without agreeing a fee or a text to use.'
          p3: 'The illness goes on. The doctors who come in August say there is no hope, and she dies at home in Maruyama Fukuyama-chō on 23 November, aged twenty four.'
        shift:
          p1:
            was: 'Takekurabe ran in seven installments. Bungei Kurabu printed the revised work together on April 10, 1896.'
          p2:
            was: 'Ichiyō faced financial hardship late in life. Takekurabe later appeared in her collected works in 1897.'
            now: 'The bookseller advances part of the fee and keeps the approved proofs. She can use the money for household expenses, and the next compositor knows what text to follow.'
          p3:
            was: 'From July 1896 Ichiyō ran a fever that would not go down. In August the doctors called to her judged that she could not recover, and she died of tuberculosis at home on 23 November, aged twenty four.'
            now: '{staff} has a doctor find the tuberculosis in July and brings medicine that holds it back. She lives through that year and goes on writing fiction in Tokyo for many years.'
            who: higuchi_ichiyo_tokyo
            bio: 'Higuchi Ichiyō recovered from the tuberculosis found in the summer of 1896. She went on writing in Tokyo for many more years and lived to see her stories collected.'
        vignettes:
          index: 'Someone has pencilled ‘complete’ on a single issue. You compare its ending to the April printing and find where it breaks off. The bookstall keeper lets you put a removable slip in it. You take home a list of seven instalments. You never find out who wrote the first label.'
          reserve: 'The keeper has a reader who followed the story from issue to issue and hasn’t come back for the last one. You point out that other customers can buy the April printing now. The last instalment goes under the counter with a reservation slip. You leave before that reader returns.'
          layout: 'You set the April issue beside the last instalment. One opens at the beginning and one assumes its reader has waited through six pieces already. You write that distinction on a scrap for the stallkeeper and keep your own copy. The original serial readers have waited longer than your entire visit.'
      zh:
        name: '柜台上的七期《青梅竹马》'
        place: "东京"
        figure: "樋口一叶"
        story: '樋口一叶的《青梅竹马》在 1895 年至 1896 年 1 月间于《文学界》连载，共七期。1896 年 4 月，《文艺俱乐部》一次刊出全文。书摊上的周折是分支演绎。'
        relic: "一本随身日记"
        relic_desc: "一本写了多年的日记，毛笔字端正。"
        points:
          p1: '拿齐《文学界》七次连载的旧刊，同樋口一叶核全《文艺俱乐部》的合刊校样，让改过的全篇能在四月刊出'
          p2: '趁合刊新出，请一叶与书商定一份带预付稿酬的单行本约定，由她指定所用校本'
          p3: '七月一叶发热不退时，及早查出结核，治好她'
        points_fail:
          p1: '零散旧刊少了一期，编辑只收到不全的合刊稿，事务所因同步失败召回员工。'
          p2: '已有合刊可以借阅，书商仍只让她等后续消息，稿酬与使用哪个底本都没有定。'
          p3: '病一路加重，八月请来的医生说已无法挽回，11 月 23 日她在丸山福山町的家中去世，年二十四。'
        shift:
          p1:
            was: '《青梅竹马》分七次刊载，1896 年 4 月 10 日由《文艺俱乐部》刊出修订后的全篇。'
          p2:
            was: '一叶晚年仍面对生计压力。《青梅竹马》后来收入 1897 年刊行的全集。'
            now: '书商先付一笔稿酬并留下签认的校样。她能用这笔收入周转；往后排版的人也知道这版应照哪一份稿。'
          p3:
            was: '1896 年 7 月起一叶发热不退，8 月请来的医生诊断已无法挽回；11 月 23 日她在家中死于肺结核，年二十四。'
            now: '{staff}七月就请医生查出了结核，带去的药压住了病。她熬过了那一年，又在东京写了许多年小说。'
            who: higuchi_ichiyo_tokyo
            bio: '樋口一叶挺过了 1896 年夏天查出的结核。她在东京又写了许多年，生前看到自己的小说结集。'
        vignettes:
          index: '有人在一期杂志上用铅笔写了「全」。你翻到那一期的末尾，拿四月刊本一对，找到了断在何处。摊主让你夹张能取下来的纸签。你带回七期的清单，却没能问到原来的字是谁写的。'
          reserve: '有位读者一期期追下来，末回还没来取。你指给摊主看，别的客人如今可以买四月的全文刊本。末回连同预留的小条一起放进柜台底下。那位读者回来以前，你先收队了。'
          layout: '你把四月那期放在末回旁边。一本打开是开头，另一本默认读者已经等过前面六回。你给摊主写下区别，也给自己留了一份。最初追连载的读者，等的时间比你整趟穿越还长。'
text:
  en:
    name: Higuchi Ichiyo
    text: Japanese writer, 1872 to 1896. She supported her family by writing and published her best known stories, including Takekurabe, in the mid 1890s about the lives of poor townspeople. She died of tuberculosis at twenty four.
  zh:
    name: 樋口一叶
    text: 日本作家，1872 年生，1896 年去世。她靠写作养家，在 1890 年代中期发表了《比肩》等代表作，写贫苦市民的生活。她二十四岁死于肺结核。
