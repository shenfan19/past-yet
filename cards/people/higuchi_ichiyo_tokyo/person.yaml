    text:
      en:
        name: 'Seven instalments on one counter'
        place: "Tokyo"
        figure: "Higuchi Ichiyo"
        story: 'Higuchi Ichiyō’s Takekurabe appeared in seven instalments in Bungakukai in 1895 and January 1896. Bungei Kurabu published it together in April 1896.'
        story_prose:
          opening:
            - 'Tokyo, 1896. Ichiyō Higuchi’s Takekurabe ran over seven issues of Bungakukai, then appeared in a revised complete version in Bungei Kurabu.'
            - 'In history she did not get a separate edition on terms she could choose, and she died in November. In this branch one back issue has yet to be found and a bookseller might still agree to an advance.'
            - 'Someone who can trace back issues and proofs can help. Getting the person discussing payment to wait while the author reads the terms will take patience. The illness needs someone who arrives with the right equipment.'
          points:
            p3: 'When the weather turns hot, Ichiyō still has a fever. {staff} visits, arranges the care she agrees to and asks the people she lives with to turn away anyone pressing for more pages. One day she sits at the desk again. She brings the manuscript back from where it lay against the wall. A little light from the window falls on the place where she last stopped.'
            p2: '{staff} asks the bookseller to put the fee, its date and the version to be used in writing together. Ichiyō pulls the sheet closer and reads each term. Only at the last does she ask which copy she can keep. The bookseller folds his copy in half. On the one lying open by Ichiyō, the name she circled can be seen at once.'
            p1: 'On the counter there should be seven issues, but only six can be counted. {staff} finds the person who last borrowed the absent issue. Back at the counter, Ichiyō is finding the same passage in her revision. She places the pages next to each other and starts reading at the first rewritten line. This time the crack in the counter does not catch the paper.'
          outcomes:
            all: 'When Ichiyō comes back to the desk, she first checks the terms for the separate edition. Two piles lie by the window: the older issues and paper she can still write on.'
            p3: 'When she can sit and write again, she takes the page on top. Nobody in the room turns it for her.'
            p2: 'The bookseller sends back a copy of their agreement. She keeps the chosen proof inside the same back issue.'
            p1: 'When the complete issue arrives, the seven older ones are still stacked together. She stops by the table and reads the place she revised.'
          none: 'A message from the bookseller says there is more waiting to do. When the new issue is closed, it holds no fresh answer.'
          not_admitted: '{staff} never meets Ichiyō. A stack of older issues is still tied below the lending counter.'
          desync: 'One back issue cannot be found. When the office recalls {staff}, the stack on the counter still has a gap in the middle.'
          excerpts:
            p3: 'She brings the manuscript back from where it lay against the wall. A little light from the window falls on the place where she last stopped.'
            p2: 'The bookseller folds his copy in half. On the one lying open by Ichiyō, the name she circled can be seen at once.'
            p1: 'She places the pages next to each other and starts reading at the first rewritten line. This time the crack in the counter does not catch the paper.'
        relic: "A pocket diary"
        relic_desc: "A diary kept for years in careful brush writing."
        points:
          p1: 'Gather all seven installments from Bungakukai and check the collected proofs with Higuchi so the revised work can appear in April'
          p2: 'When the collected text appears, help Higuchi negotiate a separate edition with a payment in advance and the proofs of her choice'
          p3: 'When Ichiyō''s fever will not break in July, find the tuberculosis early and cure her'
        points_fail:
          p1: 'One issue is missing from the pile. The editor gets an incomplete collected text, and the office recalls the employee.'
          p2: 'The collected version can be borrowed, but the bookseller keeps her waiting without agreeing a fee or a text to use.'
          p3: 'Her illness progresses as in history. She dies of tuberculosis on 23 November, aged twenty-four.'
        shift:
          p1:
            was: 'Takekurabe ran in seven installments. Bungei Kurabu printed the revised work together on April 10, 1896.'
          p2:
            was: 'Ichiyō faced financial hardship late in life. Takekurabe later appeared in her collected works in 1897.'
            now: 'The bookseller advances part of the fee and keeps the approved proofs. She can use the money for household expenses, and the next compositor knows what text to follow.'
          p3:
            was: 'In July 1896 Ichiyō fell ill. She died of tuberculosis on 23 November, aged twenty-four.'
            now: '{staff} secures care while there is time to treat her. Ichiyō recovers enough to spend part of a day at her writing desk again.'
            who: higuchi_ichiyo_tokyo
            bio: 'In this branch Higuchi Ichiyō recovers from the illness that began in 1896 and returns to writing.'
        vignettes:
          index: 'Someone has pencilled ‘complete’ on a single issue. You compare its ending to the April printing and find where it breaks off. The bookstall keeper lets you put a removable slip in it. You take home a list of seven instalments. You never find out who wrote the first label.'
          reserve: 'The keeper has a reader who followed the story from issue to issue and hasn’t come back for the last one. You point out that other customers can buy the April printing now. The last instalment goes under the counter with a reservation slip. You leave before that reader returns.'
          layout: 'You set the April issue beside the last instalment. One opens at the beginning and one assumes its reader has waited through six pieces already. You write that distinction on a scrap for the stallkeeper and keep your own copy. The original serial readers have waited longer than your entire visit.'
      zh:
        name: '柜台上的七期《青梅竹马》'
        place: "东京"
        figure: "樋口一叶"
        story: '樋口一叶的《青梅竹马》在 1895 年至 1896 年 1 月间于《文学界》连载，共七期。1896 年 4 月，《文艺俱乐部》一次刊出全文。书摊上的周折是分支演绎。'
        story_prose:
          opening:
            - '1896 年，东京。樋口一叶的《青梅竹马》原来在《文学界》分七次连载，改稿后来在《文艺俱乐部》一次刊全。'
            - '史实里，一叶来不及看到这篇变成由她挑底本的单行本，同年十一月因病去世。在这条分支里，柜台上的旧刊还没收齐，书商也还有机会答应早付一笔稿酬。'
            - '这趟用得上能追到旧刊和校样的人。有时比找书更难的，是让谈稿酬的人等作者读完条款。病中还需要带着合适装备来的人。'
          points:
            p3: '天热起来以后，一叶仍然发烧。{staff}到住处探望，把她愿意接受的照护安排好，又请同住的人先把来催稿的回绝。后来有一天，她重新坐到了桌边。 她把原先靠墙放着的稿子挪回来。纸上泛起一点窗光，正落在她上次停笔的地方。'
            p2: '{staff}请书商把付多少、何时付、用哪个校本一并写清。一叶把纸拉近，一条一条读，看到最后一条时才问可以留下哪一份。 书商把他那份对折。一叶手边摊着另一份，她圈出的底本名称一眼就看得见。'
            p1: '七期旧刊摆在柜台上只数得出六本。{staff}跑去找最后借走那期的人，赶回来时，一叶正翻出同一段在改稿上的位置。 她把两页紧挨着摆好，从新写的第一行开始读。柜台底下那道裂缝，这一回没有夹住纸。'
          outcomes:
            all: '一叶回到桌边后先看那份单行本约定。窗边搁着两摞东西，一摞是旧刊，一摞是她后来愿意继续写的纸。'
            p3: '她能重新坐下来写字的时候，先取了最上面的一页。房里没有人替她把页翻过去。'
            p2: '书商把约定的一份送了回来。她把那张底本的校样压在同一册旧刊里。'
            p1: '合刊的新本送到桌上时，七期旧刊还叠在一起。她在桌边停下来翻看改过的地方。'
          none: '书商留了消息说还要再等。那册合刊合起来时，里面没有新的答复。'
          not_admitted: '{staff}没能见到一叶。借阅柜台下还有一摞旧刊，封面用线捆住。'
          desync: '其中一期没能找回。事务所召回{staff}时，柜台上那一叠仍留着中间的空处。'
          excerpts:
            p3: '她把原先靠墙放着的稿子挪回来。纸上泛起一点窗光，正落在她上次停笔的地方。'
            p2: '书商把他那份对折。一叶手边摊着另一份，她圈出的底本名称一眼就看得见。'
            p1: '她把两页紧挨着摆好，从新写的第一行开始读。柜台底下那道裂缝，这一回没有夹住纸。'
        relic: "一本随身日记"
        relic_desc: "一本写了多年的日记，毛笔字端正。"
        points:
          p1: '拿齐《文学界》七次连载的旧刊，同樋口一叶核全《文艺俱乐部》的合刊校样，让改过的全篇能在四月刊出'
          p2: '趁合刊新出，请一叶与书商定一份带预付稿酬的单行本约定，由她指定所用校本'
          p3: '七月一叶发热不退时，及早查出结核，治好她'
        points_fail:
          p1: '零散旧刊少了一期，编辑只收到不全的合刊稿，事务所因同步失败召回员工。'
          p2: '已有合刊可以借阅，书商仍只让她等后续消息，稿酬与使用哪个底本都没有定。'
          p3: '一叶的病照史实加重。11 月 23 日，她死于肺结核，年二十四。'
        shift:
          p1:
            was: '《青梅竹马》分七次刊载，1896 年 4 月 10 日由《文艺俱乐部》刊出修订后的全篇。'
          p2:
            was: '一叶晚年仍面对生计压力。《青梅竹马》后来收入 1897 年刊行的全集。'
            now: '书商先付一笔稿酬并留下签认的校样。她能用这笔收入周转；往后排版的人也知道这版应照哪一份稿。'
          p3:
            was: '1896 年 7 月，一叶病重。同年 11 月 23 日，她死于肺结核，年二十四。'
            now: '{staff}替一叶及时找到了医护。她慢慢好起来，又能每天抽一会儿坐到写字桌前。'
            who: higuchi_ichiyo_tokyo
            bio: '这条分支里，樋口一叶在 1896 年病后恢复，重新开始写作。'
        vignettes:
          index: '有人在一期杂志上用铅笔写了「全」。你翻到那一期的末尾，拿四月刊本一对，找到了断在何处。摊主让你夹张能取下来的纸签。你带回七期的清单，却没能问到原来的字是谁写的。'
          reserve: '有位读者一期期追下来，末回还没来取。你指给摊主看，别的客人如今可以买四月的全文刊本。末回连同预留的小条一起放进柜台底下。那位读者回来以前，你先收队了。'
          layout: '你把四月那期放在末回旁边。一本打开是开头，另一本默认读者已经等过前面六回。你给摊主写下区别，也给自己留了一份。最初追连载的读者，等的时间比你整趟穿越还长。'
text:
  en:
    name: Higuchi Ichiyo
    text: Japanese writer, 1872 to 1896. She supported her family by writing and published her best known stories, including Takekurabe, in the mid 1890s about the lives of poor townspeople. She died of tuberculosis at twenty four.
  zh:
    name: 樋口一叶
    text: 日本作家，1872 年生，1896 年去世。她靠写作养家，在 1890 年代中期发表了《青梅竹马》等代表作，写贫苦市民的生活。她二十四岁死于肺结核。
