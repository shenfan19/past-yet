    text:
      en:
        name: "A play on love beyond death"
        place: "Linchuan"
        figure: "Tang Xianzu"
        story: 'In The Peony Pavilion, the garden scene passes from spring scenery into Du Liniang''s dream.'
        relic: "A printed songbook"
        relic_desc: "Printed arias for singers, with the tune named above each."
        points:
          p1: 'Help him settle a fair copy of The Peony Pavilion in his own corrected words and put it in the hands of the Yihuang company, so that they rehearse from his text'
        points_fail:
          p1: 'As in history the altered versions spread later, and all he can do is write to the Yihuang players not to sing them; this branch is as history was.'
        shift:
          p1:
            was: 'After The Peony Pavilion was written, Lü Yusheng and others altered its lyrics to suit singing in the Wu style, and Tang wrote telling the Yihuang company to keep to his original and not to follow the Lü version.'
            now: 'The Yihuang company had a copy he had corrected himself before any altered version appeared, and went on singing from it.'
            who: tang_xianzu_linchuan
            bio: 'In this timeline the text of The Peony Pavilion that Tang Xianzu had corrected himself reached the Yihuang company first, and they kept singing from it.'
        vignettes:
          empty_garden: 'You ask the player to rehearse the garden without anything on the stage. After a few lines, a listener points to where they imagined a flower. The player keeps the line that put it there.'
          cue: 'A cut takes away the other player''s entrance signal. You catch it in rehearsal and put the cue where both can hear, without having to restore the whole cut.'
          breath: 'You wait until the singer reaches the end of the line before moving the chair. This time nobody has to stop and explain why the dream began.'
      zh:
        name: "写爱情超越死亡的戏"
        place: "临川"
        figure: "汤显祖"
        story: '汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。'
        relic: "一册刻印的曲本"
        relic_desc: "给歌者用的刻本，每支曲牌的名字写在上方。"
        points:
          p1: '帮他把亲手核过的《牡丹亭》原本抄定，交到宜黄戏班手里，让他们照原本排唱'
        points_fail:
          p1: '后来的改本照史实传开，他只能写信叮嘱宜黄的伶人别照改本唱，这条分支与历史一样。'
        shift:
          p1:
            was: '《牡丹亭》写成后，吕玉绳等人为便于吴地演唱改动曲文，汤显祖写信叮嘱宜黄班要依他的原本，吕家改的不可照用。'
            now: '改本出来之前，宜黄班手里已经有了一部他亲手核过的原本，班里一直照原本唱。'
            who: tang_xianzu_linchuan
            bio: '这条时间线里，汤显祖亲手核定的《牡丹亭》原本先到了宜黄戏班，班里一直照原本唱。'
        vignettes:
          empty_garden: '你请演员在空台上排游园。几句之后，听的人指出想象中花开在什么地方。演员留下了让他看见那朵花的一句。'
          cue: '删词连另一个演员上场的信号也删掉了。你在排练时发现，把那个字留在两人都听得到的位置，余下的删节仍能保留。'
          breath: '你等演员把这一句唱完才挪椅子。这一遍，没人需要停下来解释为什么到了梦里。'
text:
  en:
    name: Tang Xianzu
    text: Chinese playwright of the Ming, 1550 to 1616. He retired to Linchuan, where in 1598 he finished The Peony Pavilion, a long play about love that crosses the boundary between dream and life.
  zh:
    name: 汤显祖
    text: 明代剧作家，1550 年生，1616 年去世。他退居临川，1598 年写成《牡丹亭》，这是一部关于爱情跨越梦与现实界限的长剧。
