    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 80, req: {"any":[{"job":["musician","proofreader","writer"],"stat":{"wit":6}},{"trait":["artistic","methodical"],"stat":{"wit":6,"will":6}}]}}
