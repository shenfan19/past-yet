    text:
      en:
        name: "A play on love beyond death"
        place: "Linchuan"
        figure: "Tang Xianzu"
        story: 'Tang Xianzu dated his preface to The Peony Pavilion to the autumn of 1598. In the tenth scene, Du Liniang visits the garden in spring, then falls asleep and meets a young man in a dream.'
        story_prose:
          opening:
            - 'Linchuan, autumn 1598. Tang Xianzu dates his preface to The Peony Pavilion. In the play, Du Liniang walks through a garden and falls asleep, dreaming of a young scholar.'
            - 'In history, the words were later altered to make them easier to sing. Tang wrote to the Yihuang players asking them to use his text. In this branch, there is an altered sheet at rehearsal and a cue the actors keep missing.'
            - 'This trip calls for someone who can spot missing words and hear when a cue has dropped out. It also needs someone who knows how the text on the page meets the voices on stage.'
          points:
            p1: '{staff} compares the rehearsal sheet with the text Tang checked, follows the singing to the missing words and copies the complete version for the Yihuang troupe. Someone in front opens the copy to the same page and follows the line by ear. At the cue, the actor waiting in the wings lifts a foot.'
          outcomes:
            all: 'They went on rehearsing the scene from the checked text. The actor waiting in the wings held a sheet whose folded corner fell beside the cue.'
            p1: 'They went on rehearsing the scene from the checked text. The actor waiting in the wings held a sheet whose folded corner fell beside the cue.'
          none: 'The rehearsal page turns. Beside the stage, someone still holds the sheet with a few words missing where the next voice is meant to enter.'
          not_admitted: '{staff} did not get into the rehearsal. A voice came from inside the wall, and outside all that showed was a chair that had been moved.'
          excerpts:
            p1: 'Someone in front opens the copy to the same page and follows the line by ear. At the cue, the actor waiting in the wings lifts a foot.'
        relic: "A printed songbook"
        relic_desc: "Printed arias for singers, with the tune named above each."
        points:
          p1: 'Help him settle a fair copy of The Peony Pavilion in his own corrected words and put it in the hands of the Yihuang company, so that they rehearse from his text'
        points_fail:
          p1: 'As in history the altered versions spread later, and all he can do is write to the Yihuang players not to sing them; this branch is as history was.'
        shift:
          p1:
            was: 'After 1598, Tang Xianzu wrote to ask the Yihuang players to stick to his original words instead of using a version altered for singing.'
            now: 'The Yihuang company had a copy he had corrected himself before any altered version appeared, and went on singing from it.'
            who: tang_xianzu_linchuan
            bio: 'In this timeline the text of The Peony Pavilion that Tang Xianzu had corrected himself reached the Yihuang company first, and they kept singing from it.'
        vignettes:
          empty_garden: '{staff} sets the chair back against the wall. The player crosses the bare floor and looks down as she sings. From the bench, the copyist can tell where the path ends.'
          cue: 'The singer stops where a line has been shortened. Her partner misses the entrance. {staff} puts the omitted words back on the rehearsal slip and asks them to try the handover again.'
          breath: 'The singer leaves a little air at the end of the verse. {staff} marks that pause on a separate slip for the player waiting in the wings.'
      zh:
        name: "写爱情超越死亡的戏"
        place: "临川"
        figure: "汤显祖"
        story: '汤显祖在《牡丹亭》题词末署万历戊戌秋，即 1598 年秋。戏到第十出，杜丽娘游过春日的园子，入睡后在梦里遇见一位年轻书生。'
        story_prose:
          opening:
            - '1598 年秋，临川。汤显祖在《牡丹亭》的题词末写下年月。戏里，杜丽娘游过园子，在梦中遇见一个书生。'
            - '史实里，后来有人改曲文以便演唱，汤显祖写信要宜黄的演员用他的原本。在这条分支里，排练的人手边有一张改过的纸，还有一处接不上的唱词。'
            - '这一趟用得上识得错字、听得出哪里丢了接句的人。懂曲文又能把台上台下对起来的人，也有事做。'
          points:
            p1: '{staff}把排练纸覆在汤显祖核过的原本旁，顺着演员的唱腔找出落掉的字，再把完整的本子抄给宜黄戏班。台下把定本翻到同一页，跟着一声一声往下听。该接的地方，等在台边的人抬起了脚。'
          outcomes:
            all: '后来那一出仍按定本排唱。等候上场的人手里夹着一张纸，折角正落在他的接句旁。'
            p1: '后来那一出仍按定本排唱。等候上场的人手里夹着一张纸，折角正落在他的接句旁。'
          none: '排练纸翻过一页。下一句该谁唱，台边的人还拿着那张少写几个字的纸。'
          not_admitted: '{staff}没能进到排练的地方。墙里传出一声唱，墙外只看得到移开的那把椅子。'
          excerpts:
            p1: '台下把定本翻到同一页，跟着一声一声往下听。该接的地方，等在台边的人抬起了脚。'
        relic: "一册刻印的曲本"
        relic_desc: "给歌者用的刻本，每支曲牌的名字写在上方。"
        points:
          p1: '帮他把亲手核过的《牡丹亭》原本抄定，交到宜黄戏班手里，让他们照原本排唱'
        points_fail:
          p1: '后来的改本照史实传开，他只能写信叮嘱宜黄的伶人别照改本唱，这条分支与历史一样。'
        shift:
          p1:
            was: '1598 年以后，汤显祖在信中嘱咐宜黄伶人沿用他的原本，别采用为了便唱而改过的曲文。'
            now: '改本出来之前，宜黄班手里已经有了一部他亲手核过的原本，班里一直照原本唱。'
            who: tang_xianzu_linchuan
            bio: '这条时间线里，汤显祖亲手核定的《牡丹亭》原本先到了宜黄戏班，班里一直照原本唱。'
        vignettes:
          empty_garden: '{staff}把椅子挪到墙根。演员走过空地，唱到一半垂了垂眼。抄本人坐在长凳上，这才看出空园里的小路在哪儿拐弯。'
          cue: '少了几个唱词，台边的人等不到接句。{staff}把字补回排练纸，让两个人从上一句再接一次。'
          breath: '演员在句末留了一口气。{staff}把那一顿记下来，将纸条递到台边。'
text:
  en:
    name: Tang Xianzu
    text: Chinese playwright of the Ming, 1550 to 1616. He retired to Linchuan in 1598 and dated the preface to The Peony Pavilion to that autumn. The play follows Du Liniang from a meeting in a dream to a search for the man she met there.
  zh:
    name: 汤显祖
    text: 明代剧作家，1550 年生，1616 年去世。1598 年归居临川，同年秋为《牡丹亭》题词。剧中杜丽娘在梦里遇见一名书生，从此寻访梦中人。
hook: {en: 'What can one garden scene carry?', zh: '一折惊梦，要留什么给观众'}
facts:
  peony_dream:
    date: '1598'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [tang_xianzu_linchuan_primary]
    text:
      en: 'In The Peony Pavilion, the garden scene passes from spring scenery into Du Liniang''s dream.'
      zh: '汤显祖《牡丹亭》的《惊梦》一出，从游园春色转入杜丽娘的梦。'
  dated_preface:
    date: '1598'
    stay_day: 60
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [tang_xianzu_linchuan_dated_preface, tang_xianzu_linchuan_preface_text]
    text: {en: 'The author dated the preface to the autumn of the wùxū year of the Wanli reign, 1598.', zh: '汤显祖在题词末署「万历戊戌秋」，即 1598 年秋。'}
    line:
      en: 'In the autumn of 1598, Tang Xianzu dated his preface to The Peony Pavilion.'
      zh: '1598 年秋，汤显祖为《牡丹亭》题词。'
      zh-Hant: '1598 年秋，湯顯祖為《牡丹亭》題詞。'
      fr: 'À l''automne 1598, Tang Xianzu date sa préface au Pavillon des Pivoines.'
      es: 'En el otoño de 1598, Tang Xianzu fechó el prefacio de The Peony Pavilion.'
      ja: '1598 年の秋、唐仙祖は序文を『牡丹閣』に日付を付けました。'
      ko: '1598년 가을, 당현조는 모란정에 서문을 썼다.'
      ru: 'Осенью 1598 года Тан Сяньцзу датировал свое предисловие к «Пионовому павильону».'
bystanders:
  tang_xianzu_linchuan_reader:
    invented: true
    text: {en: 'An invented player testing the cue between waking and dreaming.', zh: '一位虚构的演员，正试怎样让观众听出由醒入梦。'}
quotes:
  tang_xianzu_preface_depth:
    order: 1
    tier: full
    date: '1598'
    checked: official_record
    original: zh-Hant
    sources: [tang_xianzu_linchuan_dated_preface, tang_xianzu_linchuan_preface_text]
    text:
      zh-Hant:
        who: '湯顯祖'
        quote: '情不知所起，一往而深。'
        occasion: '《牡丹亭》題詞，萬曆戊戌秋。'
      zh:
        who: '汤显祖'
        quote: '情不知所起，一往而深。'
        occasion: '《牡丹亭》题词，万历戊戌秋。'
      en:
        who: 'Tang Xianzu'
        quote: 'No one knows where love begins. Once it takes hold, it deepens.'
        occasion: 'Author’s preface to The Peony Pavilion, autumn 1598 (game translation).'
      fr:
        who: 'Tang Xianzu'
        quote: 'Personne ne sait où commence l''amour. Une fois qu’il s’installe, il s’approfondit.'
        occasion: 'Préface de l''auteur au Pavillon des Pivoines, automne 1598 (traduction du jeu).'
      es:
        who: 'Tang Xianzu'
        quote: 'Nadie sabe dónde comienza el amor. Una vez que se afianza, se profundiza.'
        occasion: 'Prefacio del autor a The Peony Pavilion, otoño de 1598 (traducción del juego).'
      ja:
        who: '湯顕祖'
        quote: '恋がどこから始まるかは誰にもわかりません。一度定着すると深みが増します。'
        occasion: '『牡丹館』1598年秋の著者の序文（ゲーム翻訳）。'
      ko:
        who: '탕현조'
        quote: '사랑이 어디서 시작되는지는 아무도 모릅니다. 일단 붙잡히면 깊어집니다.'
        occasion: '1598년 가을, 모란정(The Peony Pavilion)의 저자 서문(게임 번역).'
      ru:
        who: 'Тан Сяньцзу'
        quote: 'Никто не знает, где начинается любовь. Как только оно закрепится, оно углубляется.'
        occasion: 'Предисловие автора к «Пионовому павильону», осень 1598 г. (перевод игры).'
  tang_xianzu_preface_dream:
    order: 2
    tier: none
    date: '1598'
    checked: official_record
    original: zh-Hant
    sources: [tang_xianzu_linchuan_dated_preface, tang_xianzu_linchuan_preface_text]
    text:
      zh-Hant:
        who: '湯顯祖'
        quote: '夢中之情，何必非真？'
        occasion: '《牡丹亭》題詞，萬曆戊戌秋。'
      zh:
        who: '汤显祖'
        quote: '梦中之情，何必非真？'
        occasion: '《牡丹亭》题词，万历戊戌秋。'
      en:
        who: 'Tang Xianzu'
        quote: 'Why should love in a dream be any less real?'
        occasion: 'Author’s preface to The Peony Pavilion, autumn 1598 (game translation).'
      fr:
        who: 'Tang Xianzu'
        quote: 'Pourquoi l’amour dans un rêve devrait-il être moins réel ?'
        occasion: 'Préface de l''auteur au Pavillon des Pivoines, automne 1598 (traduction du jeu).'
      es:
        who: 'Tang Xianzu'
        quote: '¿Por qué el amor en un sueño debería ser menos real?'
        occasion: 'Prefacio del autor a The Peony Pavilion, otoño de 1598 (traducción del juego).'
      ja:
        who: '湯顕祖'
        quote: 'なぜ夢の中の愛はそれほど現実的ではないのでしょうか？'
        occasion: '『牡丹館』1598年秋の著者の序文（ゲーム翻訳）。'
      ko:
        who: '탕현조'
        quote: '왜 꿈속의 사랑이 덜 현실적이어야 합니까?'
        occasion: '1598년 가을, 모란정(The Peony Pavilion)의 저자 서문(게임 번역).'
      ru:
        who: 'Тан Сяньцзу'
        quote: 'Почему любовь во сне должна быть менее реальной?'
        occasion: 'Предисловие автора к «Пионовому павильону», осень 1598 г. (перевод игры).'
