text:
  en:
    name: Cleomedes
    text: Greek writer on astronomy, whose dates are uncertain; he is usually placed between the first century BC and the fourth century AD. His handbook On the Circular Motions of the Celestial Bodies gives the best known account of how Eratosthenes measured the Earth, and says that the original method was more involved.
  zh:
    name: 克莱奥梅德斯
    text: 希腊天文学作者，生卒年不详，一般认为在公元前一世纪到公元四世纪之间。他的教本《论天体的圆周运动》记下了埃拉托色尼测量地球最为人知的说法，并说原来的方法更繁。
