    text:
      en:
        name: 'The winter the empress was due'
        place: "Kyoto"
        figure: "Sei Shonagon"
        story: 'Sei Shōnagon served the empress Teishi and later wrote about life around her in The Pillow Book. Near the end of the second year of Chōhō, Teishi gave birth to a daughter, Princess Bishi, and died soon afterward.'
        story_prose:
          opening:
            - 'Winter has come to Kyoto, and there is an extra cushion by the screen. Sei Shōnagon asks who should take it. A messenger arrives as she speaks. Teishi looks back at the empty place while the messenger is still there.'
            - 'Teishi prepared to give birth at the close of 1000 and died on 13 January 1001 in the converted calendar. Sei Shōnagon later wrote about life at her court in The Pillow Book. Here you can ask whom Teishi wants nearby and make room for the people she chooses.'
            - 'Send a traveller who will hear her out with Shōnagon. Someone else can answer the next message from outside while Teishi speaks.'
          points:
            p1: 'Shōnagon picks up the cushion to put it in its usual place. You wait for the messenger to finish, then ask her to find out whom Teishi wants to see. Teishi names one person and asks her to sit a little behind the lamp. Shōnagon sets down the cushion where she points. When the room quiets, the person Teishi asked for is seated and Teishi has her hand where she wants it.'
          outcomes:
            all: 'The person she asked to see remains close. Teishi still dies, and the report preserves the moment when she chose who would sit with her.'
            p1: 'Shōnagon keeps the cushion free until the person Teishi chose arrives. The later record follows her historical life.'
          none: 'One message after another reaches the door. The cushion goes to the first person shown in before anyone can ask Teishi whom she wanted.'
          not_admitted: 'Nobody calls you in. Someone moves a cushion beyond the screen. From outside you cannot see who it was for.'
          excerpts:
            p1: 'When the room quiets, the person Teishi asked for is seated and Teishi has her hand where she wants it.'
        relic: 'A folded note for the household'
        relic_desc: 'An invented note naming who should be shown to the room.'
        points:
          p1: 'Ask whom Teishi wants near her as she prepares to give birth, and help Shōnagon make room for those people'
        points_fail:
          p1: 'Someone is at the door with the next message before there is time to ask whom Teishi wants beside her.'
        shift:
          p1:
            was: 'The court chronicles record Princess Bishi’s birth and Teishi’s death soon after.'
            now: 'In this branch {staff} keeps the other visitors at the door until Teishi says whom she wants to see. Shōnagon has time to listen before she carries the next message out.'
        vignettes:
          compare: '{staff} asks the messenger to read one name clearly before folding the message. Shōnagon can now pass it along without asking again.'
          colour: 'Shōnagon moves the lamp to see the space behind it. {staff} shifts the spare cushion to the place Teishi pointed to.'
          listen: '{staff} waits till the message at the door has been answered before asking whether the room needs anything else.'
      zh:
        name: '皇后临产的那个冬天'
        place: "京都"
        figure: "清少纳言"
        story: '清少纳言侍奉藤原定子，也在《枕草子》中写过定子身边的人和事。长保二年岁末，定子生下女儿媄子内亲王，不久去世。'
        story_prose:
          opening:
            - '京都入冬以后，屏风边多放了一个坐垫。清少纳言问要留给谁，屋外恰好有人送话进来。定子回望那一处空位，送话人还没有走。'
            - '一条天皇时的定子在 1000 年末临产，按换算日期于 1001 年 1 月 13 日去世。后来的清少纳言在《枕草子》写了宫中的往事。这里可以先问定子愿意谁陪着，给她自己选的人腾出位置。'
            - '让善于听人说完的员工与清少纳言一起去问。收到外面的消息时，分一人答复，免得屋里又要全停下来。'
          points:
            p1: '清少纳言拿起坐垫要往常用的位置放。你候送话人读完，再请她问定子愿意留谁。定子说了一个名字，又说那人来了就坐在灯后一点。清少纳言照她指的地方放下坐垫。等屋里安静下来，那位被点名的人已经坐定，定子的手仍放在自己想放的地方。'
          outcomes:
            all: '她要见的人留在近处。她后来仍去世，回程记录留下的是她自己选人陪伴的这一刻。'
            p1: '清少纳言替定子把那只坐垫留到来人坐下。后来的日子仍按史实记载。'
          none: '门口的消息一条接一条。坐垫最后给了最先被请进来的人，来不及问定子想见谁。'
          not_admitted: '外面的人没有传你进去。屋里有人把椅垫换了地方，你在屏风外看不清留给了谁。'
          excerpts:
            p1: '等屋里安静下来，那位被点名的人已经坐定，定子的手仍放在自己想放的地方。'
        relic: '一张折起来的传话纸'
        relic_desc: '虚构便笺，写着谁可以进屋。'
        points:
          p1: '临产前问定子想让谁留在近处，帮清少纳言把位置留给她想见的人'
        points_fail:
          p1: '门外又有人来传话。屋里还没来得及问定子愿意让谁留下。'
        shift:
          p1:
            was: '宫廷纪事记载媄子内亲王出生，定子随后去世。'
            now: '这条分支里，{staff}请其他来人先在门边等，屋里留谁由定子自己说。清少纳言听完她的话，还来得及把下一条消息带出去。'
        vignettes:
          compare: '{staff}请传话人折纸前把一个名字念清。清少纳言转述时不必再问。'
          colour: '清少纳言移开灯，看看灯后能否坐下。{staff}把多出的坐垫移到定子指的地方。'
          listen: '{staff}等门口的消息答完，才问屋里还有什么需要。'
text:
  en:
    name: Sei Shonagon
    text: Japanese court lady of the Heian period, born about 966. Her Pillow Book collects lists, observations and anecdotes of life at the court in Kyoto, written in a sharp and witty voice.
  zh:
    name: 清少纳言
    text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
hook: {en: 'Who does Teishi want beside her?', zh: '定子想让谁留在身边？'}
