    text:
      en:
        name: 'The winter the empress was due'
        place: "Kyoto"
        figure: "Sei Shonagon"
        story: 'Sei Shōnagon had served the empress Teishi at court since about 993. At the end of 1000 Teishi was expecting her third child. On 13 January 1001 she gave birth to a daughter, Princess Bishi, and died soon after, aged twenty four. With her death Sei Shōnagon''s years at court came to an end.'
        relic: "A folded list"
        relic_desc: "A sheet of lightly written lists of things that please and things that do not."
        points:
          p1: 'Stay with Teishi through the birth, bring the child safely and save the mother'
        points_fail:
          p1: 'As in history Teishi dies soon after the birth of her daughter, aged twenty four. Sei Shōnagon leaves the court.'
        shift:
          p1:
            was: '13 January 1001, the sixteenth day of the twelfth month of Chōhō 2: the empress Teishi, whom Sei Shōnagon served, gave birth to Princess Bishi and died soon after, aged twenty four.'
            now: 'The birth went safely, and Teishi lived.'
            who: sei_shonagon_kyoto
            bio: 'In this timeline the empress Teishi came through the birth of early 1001 alive, and Sei Shōnagon still had her mistress.'
        vignettes:
          compare: 'You recognise the opening from a future edition. The copyist has skipped the edge of the mountain while reciting it. You ask where the light first shows, and the omitted place returns to the practice copy. You save the correction on a folded list. From this doorway the mountain itself stays out of sight.'
          colour: 'The painter’s purple you remember is too dark for that sky. The copyist lets you use an offcut. You put a thin grey line over a small patch of violet, and the two of you wait for the paper to dry. By then the colour outside has gone.'
          listen: 'From the doorway you hear the copyist read the opening twice. At dawn you make a list of one thing, the roof tiles that turn pale before the yard does. You take the fold of paper home. You never learn what the writer would have made of your entry.'
      zh:
        name: '皇后临产的那个冬天'
        place: "京都"
        figure: "清少纳言"
        story: '清少纳言约从 993 年起在宫中侍奉皇后定子。1000 年岁末，定子怀着第三个孩子。1001 年 1 月 13 日，她生下女儿媄子内亲王，随即去世，年二十四。清少纳言的宫中岁月随她的去世结束。'
        relic: "一张折起来的清单"
        relic_desc: "一张轻轻写着喜欢和不喜欢的事的单子。"
        points:
          p1: '定子临产时守在她身边，让孩子平安落地，把母亲救下来'
        points_fail:
          p1: '定子照史实在生下女儿后随即去世，年二十四，清少纳言离开宫中。'
        shift:
          p1:
            was: '长保二年十二月十六日（1001 年 1 月 13 日），清少纳言侍奉的皇后定子生下媄子内亲王后随即去世，年二十四。'
            now: '孩子平安落地，定子活了下来。'
            who: sei_shonagon_kyoto
            bio: '这条时间线里，清少纳言侍奉的皇后定子平安度过 1001 年初的生产，她的主人还在。'
        vignettes:
          compare: '你认出后世版本的开头。抄写人念漏了山际，你问光最先从哪里出来，他把漏掉的地方补到练习纸上。你把这处订正记进折起来的清单。从这扇门望出去，山本身却被挡着。'
          colour: '你印象里的紫颜料太深了。抄写人分你一张纸边，你在淡紫上压了一笔细灰。两人等纸干，再往门外望，天上已不是那个颜色。'
          listen: '你在门边听抄写人念了两遍开头。破晓时你也列了一张清单，只有一样东西，院子还黑着，瓦片先白了。你叠起纸带回去。作者若读到这一条会怎么想，你没有机会问。'
text:
  en:
    name: Sei Shonagon
    text: Japanese court lady of the Heian period, born about 966. Her Pillow Book collects lists, observations and anecdotes of life at the court in Kyoto, written in a sharp and witty voice.
  zh:
    name: 清少纳言
    text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
hook: {en: 'The empress is due before the year turns.', zh: '年关前，皇后就要临产。'}
