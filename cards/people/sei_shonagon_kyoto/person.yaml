    text:
      en:
        name: 'The winter the empress was due'
        place: "Kyoto"
        figure: "Sei Shonagon"
        story: 'Sei Shōnagon served the empress Teishi and later wrote about life around her in The Pillow Book. Near the end of the second year of Chōhō, Teishi gave birth to a daughter, Princess Bishi, and died soon afterward.'
        relic: "A folded list"
        relic_desc: "A sheet of lightly written lists of things that please and things that do not."
        points:
          p1: 'Ask whom Teishi wants near her as she prepares to give birth, and help Shōnagon make room for those people'
        points_fail:
          p1: 'Someone is at the door with the next message before there is time to ask whom Teishi wants beside her.'
        shift:
          p1:
            was: 'The court chronicles record Princess Bishi’s birth and Teishi’s death soon after.'
            now: 'In this branch {staff} keeps the other visitors at the door until Teishi says whom she wants to see. Shōnagon has time to listen before she carries the next message out.'
        vignettes:
          compare: 'You recognise the opening from a future edition. The copyist has skipped the edge of the mountain while reciting it. You ask where the light first shows, and the omitted place returns to the practice copy. You save the correction on a folded list. From this doorway the mountain itself stays out of sight.'
          colour: 'The painter’s purple you remember is too dark for that sky. The copyist lets you use an offcut. You put a thin grey line over a small patch of violet, and the two of you wait for the paper to dry. By then the colour outside has gone.'
          listen: 'From the doorway you hear the copyist read the opening twice. At dawn you make a list of one thing, the roof tiles that turn pale before the yard does. You take the fold of paper home. You never learn what the writer would have made of your entry.'
      zh:
        name: '皇后临产的那个冬天'
        place: "京都"
        figure: "清少纳言"
        story: '清少纳言侍奉藤原定子，也在《枕草子》中写过定子身边的人和事。长保二年岁末，定子生下女儿媄子内亲王，不久去世。'
        relic: "一张折起来的清单"
        relic_desc: "一张轻轻写着喜欢和不喜欢的事的单子。"
        points:
          p1: '临产前问定子想让谁留在近处，帮清少纳言把位置留给她想见的人'
        points_fail:
          p1: '门外又有人来传话。屋里还没来得及问定子愿意让谁留下。'
        shift:
          p1:
            was: '宫廷纪事记载媄子内亲王出生，定子随后去世。'
            now: '这条分支里，{staff}请其他来人先在门边等，屋里留谁由定子自己说。清少纳言听完她的话，还来得及把下一条消息带出去。'
        vignettes:
          compare: '你认出后世版本的开头。抄写人念漏了山际，你问光最先从哪里出来，他把漏掉的地方补到练习纸上。你把这处订正记进折起来的清单。从这扇门望出去，山本身却被挡着。'
          colour: '你印象里的紫颜料太深了。抄写人分你一张纸边，你在淡紫上压了一笔细灰。两人等纸干，再往门外望，天上已不是那个颜色。'
          listen: '你在门边听抄写人念了两遍开头。破晓时你也列了一张清单，只有一样东西，院子还黑着，瓦片先白了。你叠起纸带回去。作者若读到这一条会怎么想，你没有机会问。'
text:
  en:
    name: Sei Shonagon
    text: Japanese court lady of the Heian period, born about 966. Her Pillow Book collects lists, observations and anecdotes of life at the court in Kyoto, written in a sharp and witty voice.
  zh:
    name: 清少纳言
    text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
hook: {en: 'Who does Teishi want beside her?', zh: '定子想让谁留在身边？'}
facts:
  service:
    date: '993'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [sei_shonagon_kyoto_britannica, sei_shonagon_kyoto_kobe]
    text:
      en: 'From about 993 to 1000 Sei Shōnagon served the empress Teishi at the court in Kyoto.'
      zh: '约 993 年到 1000 年，清少纳言在京都宫中侍奉皇后定子。'
  teishi_death:
    date: '1001-01-13'
    stay_day: 43
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [sei_shonagon_kyoto_kiryaku, sei_shonagon_kyoto_kobe]
    text:
      en: 'Near the end of the second year of Chōhō, Teishi gave birth to Princess Bishi and died soon afterward. The date on the card refers to her death.'
      zh: '长保二年岁末，定子生下媄子内亲王，不久去世。卡片上的日期是卒日。'
    line:
      en: 'After the birth of Princess Bishi, Teishi dies on the sixteenth day of the twelfth month of Chōhō 2.'
      zh: '媄子内亲王出生后，定子于长保二年十二月十六日去世。'
  opening:
    date: '1000'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sei_shonagon_kyoto_opening]
    text:
      en: 'The opening places spring at dawn and describes the brightening mountain edge and slender purplish clouds. The event year does not date a particular manuscript.'
      zh: '开篇写春日破晓，山际渐明，有细细的紫云。'
