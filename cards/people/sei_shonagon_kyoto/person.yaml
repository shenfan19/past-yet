    text:
      en:
        name: 'A list beginning before sunrise'
        place: "Kyoto"
        figure: "Sei Shonagon"
        story: 'The opening of The Pillow Book begins spring at dawn. The mountain edge brightens first, with slender purple clouds trailing above it. The visits and copyist below are imagined. The map year is a setting for the encounter.'
        relic: "A folded list"
        relic_desc: "A sheet of lightly written lists of things that please and things that do not."
        points:
          p1: 'Give Sei Shōnagon a box for the notes she is gathering in Kyōto and a way to find the sections already written'
          p2: 'Mark which passages she is willing to lend so a reader does not copy the adjacent private pages'
          p3: 'Ask her to choose some lists and scenes for a loan copy and arrange the sequence. Return the other pages to her own box'
        points_fail:
          p1: 'Borrowers separate the loose papers. No collection remains to be copied, and the office recalls the employee.'
          p2: 'The reader takes the whole pile. Only later does she find that a page she kept to herself is circulating.'
          p3: 'The first person to borrow the pages determines their order. Readers cannot tell how she kept them.'
        shift:
          p1:
            was: 'Some manuscripts of The Pillow Book relate how she obtained paper and how the notes came to be seen by others.'
          p2:
            was: 'An authorial account in some manuscripts describes someone taking the notes. This passage does not occur in every version.'
            now: 'A borrower receives the passages she approved, marked where the selection ends.'
          p3:
            was: 'Manuscripts arrange The Pillow Book differently. The order and the status of the authorial notes are matters of study.'
            now: 'The borrower receives a selection she arranged. A second record stays with her so another copyist can tell which order the loan copy used.'
            who: sei_shonagon_kyoto
            bio: 'Sei Shōnagon wrote observations, lists and recollections at court. Different manuscripts preserve different arrangements and accounts of circulation.'
        vignettes:
          compare: 'You recognise the opening from a future edition. The copyist has skipped the edge of the mountain while reciting it. You ask where the light first shows, and the omitted place returns to the practice copy. You save the correction on a folded list. From this doorway the mountain itself stays out of sight.'
          colour: 'The painter’s purple you remember is too dark for that sky. The copyist lets you use an offcut. You put a thin grey line over a small patch of violet, and the two of you wait for the paper to dry. By then the colour outside has gone.'
          listen: 'From the doorway you hear the copyist read the opening twice. At dawn you make a list of one thing, the roof tiles that turn pale before the yard does. You take the fold of paper home. You never learn what the writer would have made of your entry.'
      zh:
        name: '从天亮前写起的清单'
        place: "京都"
        figure: "清少纳言"
        story: '《枕草子》开篇从春日破晓写起，山际渐渐发白，天上拖着细细的紫云。'
        relic: "一张折起来的清单"
        relic_desc: "一张轻轻写着喜欢和不喜欢的事的单子。"
        points:
          p1: '在京都给清少纳言正在积攒的记事留一处可取用的纸盒，把已经写成的段落收好'
          p2: '在清少纳言愿意给人看的段落旁另记节选，不让同一人误把未同意的旁页抄去'
          p3: '请她从自己所写的清单和记事中各挑一组，安排可以借看的顺序，将其余页留回自己的箱中'
        points_fail:
          p1: '随手记的页被借纸的人拆走，没能聚成供后来抄读的笔记，事务所召回员工。'
          p2: '读者拿走的是相邻的整摞纸，作者后来才发现原本私人留存的一页也传出去了。'
          p3: '借阅本的收页次序由第一个抄写人决定。作者很难让后来读者辨别她原来怎么放。'
        shift:
          p1:
            was: '一些《枕草子》传本记清少纳言获得纸张写记事，也叙述笔记怎样被其他人看到。'
          p2:
            was: '部分传本中的自述将笔记流传与一次有人拿走稿子的情节联系起来；该段并非所有版本都有。'
            now: '来借的人只领到她核过的几则，附来的段尾写明节选在此截止。'
          p3:
            was: '《枕草子》有不同的写本编排，段落次序与自述性质均是研究问题。'
            now: '早期借阅者得到一份由她排过的节选，另外有一份留在作者处的次序。后来的抄写可以查到曾经使用哪一种。'
            who: sei_shonagon_kyoto
            bio: '清少纳言在京都宫廷写下见闻、清单和感想。《枕草子》的传本保留不同的安排与流传线索。'
        vignettes:
          compare: '你认出后世版本的开头。抄写人念漏了山际，你问光最先从哪里出来，他把漏掉的地方补到练习纸上。你把这处订正记进折起来的清单。从这扇门望出去，山本身却被挡着。'
          colour: '你印象里的紫颜料太深了。抄写人分你一张纸边，你在淡紫上压了一笔细灰。两人等纸干，再往门外望，天上已不是那个颜色。'
          listen: '你在门边听抄写人念了两遍开头。破晓时你也列了一张清单，只有一样东西，院子还黑着，瓦片先白了。你叠起纸带回去。作者若读到这一条会怎么想，你没有机会问。'
text:
  en:
    name: Sei Shonagon
    text: Japanese court lady of the Heian period, born about 966. Her Pillow Book collects lists, observations and anecdotes of life at the court in Kyoto, written in a sharp and witty voice.
  zh:
    name: 清少纳言
    text: 平安时代的日本宫廷女官，约 966 年生。她的《枕草子》收集了京都宫廷生活的清单、观察和轶事，口吻犀利而机智。
hook: {en: 'When does spring begin on a page?', zh: '春天从哪一刻写起？'}
