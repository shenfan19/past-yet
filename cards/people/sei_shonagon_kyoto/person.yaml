    text:
      en: 'From about 993 to 1000 Sei Shōnagon served the empress Teishi at the court in Kyoto.'
      zh: '约 993 年到 1000 年，清少纳言在京都宫中侍奉皇后定子。'
  teishi_death:
    date: '1001-01-13'
    stay_day: 43
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [sei_shonagon_kyoto_teishi_wiki, sei_shonagon_kyoto_teishi_ja]
    text:
      en: 'On the sixteenth day of the twelfth month of Chōhō 2, 13 January 1001, the empress Teishi died soon after giving birth to Princess Bishi, aged twenty four.'
      zh: '长保二年十二月十六日（1001 年 1 月 13 日），皇后定子生下媄子内亲王后随即去世，年二十四。'
    line:
      en: 'The empress Teishi gives birth to a daughter and dies soon after.'
      zh: '皇后定子生下一个女儿，随即去世。'
  opening:
    date: '1000'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [sei_shonagon_kyoto_opening]
    text:
      en: 'The opening places spring at dawn and describes the brightening mountain edge and slender purplish clouds. The event year does not date a particular manuscript.'
      zh: '开篇写春日破晓，山际渐明，有细细的紫云。'
