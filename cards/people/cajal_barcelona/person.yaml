    text:
      en:
        name: Nerve cells as separate units
        place: Barcelona
        figure: Santiago Ramón y Cajal
        story: 'From the end of 1887 Santiago Ramón y Cajal held the chair of histology in Barcelona. In May 1888 he paid for the first number of his own journal and sent most of its few copies to researchers abroad, who seldom read Spanish. In October 1889 he went to the meeting of the German Anatomical Society in Berlin at his own expense and showed his slides under the microscope; Albert von Kölliker, the senior histologist there, took up his work. In 1906 he shared the Nobel Prize with Camillo Golgi.'
        relic: A fine drawing pen
        relic_desc: A pen so fine it drew every branch of a neuron.
        points:
          p1: 'Assemble the funds and slides after public funding fails and protect Cajal''s demonstration in Berlin'
          p2: 'Find a collaborator to translate the illustrated notes so foreign colleagues can check them before the meeting'
        points_fail:
          p1: 'He cannot make the trip at his own expense and sends only the written account. The branch falls out of sync and the office recalls the employee.'
          p2: 'Readers abroad only start seeking out the Spanish reports after Berlin and still have to write for explanations one by one.'
        shift:
          p1:
            was: 'On 26 September 1889 Cajal received leave, paid for his own journey, and in October showed slides at the Berlin meeting.'
          p2:
            was: 'In 1889 Cajal reported that his Spanish papers had attracted little attention abroad before the Berlin demonstration helped circulate his results.'
            now: '{staff} has a translator check the note with Cajal against the figures, then sends it to colleagues willing to examine the slides. After the meeting Cajal has a regular route for circulating illustrations and text.'
            who: cajal_barcelona
            bio: 'Cajal developed a regular translation collaboration while in Barcelona. He could find readers abroad willing to check his slides as he sent out later papers.'
        vignettes:
          stain: '{staff} helps a student drop small blocks of tissue into a jar of dichromate. The student says this jar is to sit untouched until next week, and anyone who opens it to look will be made to cut the next hundred sections himself.'
          ticket: '{staff} goes with the student to the railway station to ask the fare to Berlin. The clerk names it, the student whistles, and on the way back works out on his fingers how many numbers of the journal that would have printed.'
          rain: 'In November it rains in Barcelona. {staff} helps the student bring in a stack of plates drying on the window sill. The student counts them twice before he lets the shutter close.'
      es:
        name: Las neuronas, una a una
        place: Barcelona
        figure: Santiago Ramón y Cajal
        story: 'Desde finales de 1887, Santiago Ramón y Cajal ocupó la cátedra de histología en Barcelona. En mayo de 1888 publicó a sus expensas el primer número de su revista y envió la mayoría de los ejemplares a investigadores de otros países, donde pocos leían en español. En octubre de 1889 viajó por su cuenta a Berlín y mostró sus preparaciones al microscopio en la reunión de la Sociedad Anatómica Alemana. El histólogo Albert von Kölliker se interesó por su trabajo. En 1906, Cajal compartió el Nobel con Camillo Golgi.'
        relic: Una plumilla de dibujo
        relic_desc: Una plumilla tan fina que permite dibujar cada ramificación de una neurona.
        points:
          p1: 'Reunir fondos y muestras para la demostración en Berlín'
          p2: 'Conseguir una traducción de las notas ilustradas antes de la reunión'
        points_fail:
          p1: 'Cajal no reúne el dinero para el viaje y solo puede enviar su informe. La rama pierde la sincronización y la agencia llama de vuelta al empleado.'
          p2: 'Los colegas de fuera solo empiezan a buscar sus artículos en español después de la reunión de Berlín y tienen que escribirle para aclarar cada duda.'
        shift:
          p1:
            was: 'El 26 de septiembre de 1889 Cajal obtuvo permiso para ausentarse, pagó su viaje y en octubre mostró sus preparaciones en la reunión de Berlín.'
          p2:
            was: 'Cajal contó que sus artículos en español habían despertado poco interés fuera del país antes de que la demostración de Berlín ayudara a difundir sus resultados.'
            now: '{staff} pone a Cajal en contacto con quien traduce la nota. La revisan junto a los dibujos y la envían a colegas dispuestos a cotejar las preparaciones. Después de la reunión, Cajal tiene una vía para seguir compartiendo el texto y las ilustraciones de sus trabajos.'
            who: cajal_barcelona
            bio: 'Durante su etapa en Barcelona, Cajal estableció una colaboración estable para traducir sus trabajos y encontró colegas de otros países dispuestos a cotejar sus preparaciones.'
        vignettes:
          stain: '{staff} ayuda a un estudiante a poner unos trozos de tejido en un frasco con dicromato. El estudiante avisa de que hay que dejarlo quieto hasta la semana que viene. A quien lo abra por curiosidad le tocará cortar las cien secciones siguientes.'
          ticket: '{staff} acompaña al estudiante a la estación para preguntar cuánto cuesta el billete a Berlín. Cuando el taquillero dice el precio, el estudiante silba y, de camino a casa, cuenta con los dedos cuántos números de la revista podrían imprimir con ese dinero.'
          rain: 'En noviembre llueve en Barcelona. {staff} ayuda al estudiante a recoger las láminas que se secan en el alféizar. El estudiante las cuenta dos veces antes de cerrar la contraventana.'
      zh:
        name: 神经细胞是一个个独立的单位
        place: 巴塞罗那
        figure: 圣地亚哥·拉蒙-卡哈尔
        story: '1887 年底起，圣地亚哥·拉蒙-卡哈尔在巴塞罗那任组织学教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥几十份大多寄给国外的研究者，可他们很少读西班牙文。1889 年 10 月，他自费去柏林参加德国解剖学会的会议，把切片放在显微镜下给人看，会上资深的组织学家阿尔伯特·冯·克利克接过了他的研究。1906 年，他与卡米洛·高尔基分享诺贝尔奖。'
        story_prose:
          opening:
            - '1889 年秋，巴塞罗那。圣地亚哥·拉蒙-卡哈尔在大学教组织学，用银染的切片去看神经细胞的分支。前一年，他自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。'
            - '史实里，国外的同行很少读西班牙文，他的文章少有人注意。9 月 26 日他拿到出行许可，自筹旅费去柏林，10 月在德国解剖学会的会上把切片放到显微镜下，克利克从此支持他。在这条分支里，实验室里有个学生守着一罐泡着组织的重铬酸钾，还跑去火车站问过去柏林的票价。'
            - '这一趟用得上两种人：理得清账目和玻片、守得住行程的人，懂外文、找得到合译者、说得动人帮忙的人。'
          outcomes:
            all: '十月，卡哈尔在柏林把切片放到显微镜下。有人先读过那几页译稿，看的时候就知道该找哪一根分支。回到巴塞罗那以后，他的图文有了一条往国外寄的固定路子。'
            p2: '那以后，卡哈尔的图文有了一条往国外寄的固定路子。新写的稿子，先在国外找得到肯拿切片复核的人。'
            p1: '十月，卡哈尔带着那几包玻片到了柏林，在会上亲手把切片放到显微镜下。'
          none: '这一趟没能替卡哈尔做成什么。实验室里那罐组织照旧泡着，国外的人照旧读不懂他的西班牙文。'
          desync: '旅费到月底还差一截，玻片也没装好。{staff}被召回时，卡哈尔正把一份文字稿装进信封，准备寄往柏林。'
          not_admitted: '{staff}没能进那间实验室。玻片还摊在桌上，去柏林的日子一天天近了。'
          points:
            p1: '9 月 26 日，出行许可批了下来，旅费得自己出。{staff}把能动用的钱一笔笔列在纸上，又把要带的玻片按编号分成几包，每包裹上软纸，装进带隔层的木匣。账算平了，木匣的锁也扣上了。去柏林的车票，当天就买了。'
            p2:
              class_lettered: '{staff}照译稿的规矩，同卡哈尔一张图一张图地对，把图下的说明译成德文，哪一根纤维该叫什么，逐处问清了才落笔。短文誊好，先寄给了几位肯拿切片复核的同行。到了柏林，有人已经拿着那几页纸，在显微镜前等他。'
              else: '{staff}在城里找到一位懂德文的译者，劝他放下手头的活，陪卡哈尔一张图一张图地对，把图下的说明译成德文。短文誊好，先寄给了几位肯拿切片复核的同行。到了柏林，有人已经拿着那几页纸，在显微镜前等他。'
          excerpts:
            p2: '到了柏林，有人已经拿着那几页纸，在显微镜前等他。'
            p1: '账算平了，木匣的锁也扣上了。'
        relic: 一支极细的绘图笔
        relic_desc: 细到能画出神经元每一条分支的笔。
        points:
          p1: '在公费未获准时帮卡哈尔把旅费与玻片分包凑齐，保住柏林会上那次亲手演示'
          p2: '为难以进入外语期刊的图文找一位合译者，让同业在会前就能按图复核'
        points_fail:
          p1: '自费凑不齐长途行程，卡哈尔只能把文字寄过去。柏林没有那次演示，员工因同步失败被召回。'
          p2: '外地同行会后才有人设法读懂西班牙文稿，复核仍得逐封通信。'
        shift:
          p1:
            was: '1889 年 9 月 26 日，卡哈尔获得出行许可，自筹旅费并在 10 月柏林会议上展示显微切片。'
          p2:
            was: '1889 年，卡哈尔自述先前的西班牙文研究在国外少受注意，柏林演示后来帮助传播他的结果。'
            now: '{staff}让译者同卡哈尔对照原图校过短文，先寄给愿意核对切片的同行。演示之后，卡哈尔有一条持续寄发图文的渠道。'
            who: cajal_barcelona
            bio: '卡哈尔在巴塞罗那为研究图文建立了稳定的外语协作。后来的手稿可以先在国外找到愿意拿切片复核的同行。'
        vignettes:
          stain: '{staff}帮一个学生把切好的小块组织泡进重铬酸钾的罐子里，罐里的液体橙红发亮。学生说这罐要原封不动泡到下礼拜，谁要是忍不住打开看，下一百张切片就归谁切。'
          ticket: '{staff}陪学生去火车站问去柏林的车票。站里人声嘈杂，售票员报了价，学生吹了声口哨，回来的路上一直掰着指头算，这笔钱够印几期刊物。'
          rain: '十一月，巴塞罗那下起雨，雨点打在窗台上。{staff}帮学生把窗台上晾着的一叠图版收进屋，学生点了两遍数，才肯把百叶窗关上。'
text:
  es:
    name: Santiago Ramón y Cajal
    text: 'Neurocientífico español (1852–1934). Sus observaciones de tejidos teñidos con plata aportaron pruebas de que el sistema nervioso está formado por células diferenciadas. Enseñó en Barcelona de 1887 a 1892 y en 1906 compartió el Nobel con Camillo Golgi, cuyo método de tinción había adaptado.'
  en:
    name: Santiago Ramón y Cajal
    text: Spanish neuroscientist, 1852 to 1934. His observations of silver-stained tissue supported the idea that the nervous system is made up of distinct cells. He taught in Barcelona from 1887 to 1892 and shared the 1906 Nobel Prize with Camillo Golgi, whose staining method he had adapted.
  zh:
    name: 圣地亚哥·拉蒙-卡哈尔
    text: 西班牙神经科学家，1852 年生，1934 年去世。他观察银染切片，发现支持神经系统由独立细胞组成的证据。1887 年至 1892 年在巴塞罗那任教，1906 年与卡米洛·高尔基共享诺贝尔奖；他用的银染法，正是从高尔基的方法改进而来。
