facts:
  chair:
    date: '1887'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_barcelona_sld, cajal_wiki]
    text:
      en: 'At the end of 1887 Cajal took up the chair of normal and pathological histology at the University of Barcelona, where he stayed until he moved to Madrid in 1892.'
      zh: '1887 年底，卡哈尔到巴塞罗那大学任正常与病理组织学教授，在那里待到 1892 年调往马德里。'
    line:
      en: '1887: Cajal takes up the chair of histology at the University of Barcelona.'
      zh: '1887 年，卡哈尔到巴塞罗那大学任组织学教授。'
      es: '1887: Cajal ocupa la cátedra de histología de la Universidad de Barcelona.'
  revista:
    date: '1888-05-01'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_revista_iec, cajal_barcelona_sld]
    text:
      en: 'On 1 May 1888 Cajal brought out the first number of his own Revista trimestral de histología normal y patológica at his own expense; money kept the printing to some sixty copies, most of them sent to researchers abroad, and his family handed them out from home.'
      zh: '1888 年 5 月 1 日，卡哈尔自费出版自己的《正常与病理组织学季刊》第一期。手头紧，只印了六十份上下，大多寄给国外的研究者，由家里人在家中分发。'
    line:
      en: '1 May 1888: Cajal pays for the first number of his own journal; about sixty copies, most of them posted abroad.'
      zh: '1888 年 5 月 1 日，卡哈尔自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。'
      es: '1 de mayo de 1888: Cajal publica a su costa el primer número de su revista. Imprime unos sesenta ejemplares y envía la mayoría al extranjero.'
  histology:
    date: '1889'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [cajal_barcelona_primary, cajal_1889_unizar]
    text:
      en: 'Cajal published an illustrated manual of histology in 1889. A later diagram preserved by the CSIC shows the retina and directions of currents.'
      zh: '卡哈尔于 1889 年刊行有插图的组织学手册。西班牙国家研究委员会藏有他后来绘制的视网膜结构及传导方向图。'
  berlin:
    date: '1889-10'
    stay_day: 40
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_nobel_bio, cajal_kolliker_review, cajal_memories_berlin]
    text:
      en: 'In October 1889 Cajal went to the meeting of the German Anatomical Society at the University of Berlin and showed his preparations to the leading histologists; Albert von Kölliker, the president of the society, became his supporter and introduced him to others.'
      zh: '1889 年 10 月，卡哈尔到柏林大学参加德国解剖学会的会议，把自己的切片给一流的组织学家看。学会会长阿尔伯特·冯·克利克从此支持他，又把他介绍给别的学者。'
    line:
      en: 'October 1889: at the meeting of the German Anatomical Society in Berlin, Cajal sets his slides under the microscope for the leading histologists, and Kölliker takes up his work.'
      zh: '1889 年 10 月，卡哈尔在柏林德国解剖学会的会上把切片放到显微镜下给各国学者看，克利克接过了他的研究。'
      es: 'Octubre de 1889: Cajal muestra sus preparaciones al microscopio en la reunión de Berlín. Albert von Kölliker se interesa por sus resultados.'
  madrid:
    date: '1892'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_barcelona_sld, cajal_wiki]
    text:
      en: 'In 1892 Cajal won the chair of histology in Madrid and left Barcelona.'
      zh: '1892 年，卡哈尔取得马德里的组织学教职，离开巴塞罗那。'
    line:
      en: '1892: Cajal leaves Barcelona for the chair of histology in Madrid.'
      zh: '1892 年，卡哈尔离开巴塞罗那，去马德里任组织学教授。'
      es: '1892: Cajal deja Barcelona para ocupar la cátedra de histología en Madrid.'
  nobel:
    date: '1906'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [cajal_nobel_1906]
    text:
      en: 'The Nobel Prize in Physiology or Medicine 1906 was awarded jointly to Camillo Golgi and Santiago Ramón y Cajal for their work on the structure of the nervous system.'
      zh: '1906 年诺贝尔生理学或医学奖由卡米洛·高尔基与圣地亚哥·拉蒙-卡哈尔共享，表彰他们对神经系统结构的研究。'
    line:
      en: '1906: Cajal and Golgi share the Nobel Prize for their work on the structure of the nervous system.'
      zh: '1906 年，卡哈尔与高尔基因神经系统结构的研究共享诺贝尔奖。'
      es: '1906: Cajal y Golgi comparten el premio Nobel por sus estudios sobre la estructura del sistema nervioso.'
