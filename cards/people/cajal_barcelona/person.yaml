    text:
      en:
        name: Nerve cells as separate units
        place: Barcelona
        figure: Santiago Ramón y Cajal
        story: 'From the end of 1887 Santiago Ramón y Cajal held the chair of histology in Barcelona. In May 1888 he paid for the first number of his own journal and sent most of its few copies to researchers abroad, who seldom read Spanish. In October 1889 he went to the meeting of the German Anatomical Society in Berlin at his own expense and showed his slides under the microscope; Albert von Kölliker, the senior histologist there, took up his work. In 1906 he shared the Nobel Prize with Camillo Golgi.'
        relic: A fine drawing pen
        relic_desc: A pen so fine it drew every branch of a neuron.
        points:
          p1: 'Assemble the funds and slides after public funding fails and protect Cajal''s demonstration in Berlin'
          p2: 'Find a collaborator to translate the illustrated notes so foreign colleagues can check them before the meeting'
        points_fail:
          p1: 'He cannot make the trip at his own expense and sends only the written account. The branch falls out of sync and the office recalls the employee.'
          p2: 'Readers abroad only start seeking out the Spanish reports after Berlin and still have to write for explanations one by one.'
        shift:
          p1:
            was: 'On 26 September 1889 Cajal received leave, paid for his own journey, and in October showed slides at the Berlin meeting.'
          p2:
            was: 'In 1889 Cajal reported that his Spanish papers had attracted little attention abroad before the Berlin demonstration helped circulate his results.'
            now: '{staff} has a translator check the note with Cajal against the figures, then sends it to colleagues willing to examine the slides. After the meeting Cajal has a regular route for circulating illustrations and text.'
            who: cajal_barcelona
            bio: 'Cajal developed a regular translation collaboration while in Barcelona. He could find readers abroad willing to check his slides as he sent out later papers.'
        vignettes:
          stain: '{staff} helps a student drop small blocks of tissue into a jar of dichromate. The student says this jar is to sit untouched until next week, and anyone who opens it to look will be made to cut the next hundred sections himself.'
          ticket: '{staff} goes with the student to the railway station to ask the fare to Berlin. The clerk names it, the student whistles, and on the way back works out on his fingers how many numbers of the journal that would have printed.'
          rain: 'In November it rains in Barcelona. {staff} helps the student bring in a stack of plates drying on the window sill. The student counts them twice before he lets the shutter close.'
      zh:
        name: 神经细胞是一个个独立的单位
        place: 巴塞罗那
        figure: 圣地亚哥·拉蒙-卡哈尔
        story: '1887 年底起，圣地亚哥·拉蒙-卡哈尔在巴塞罗那任组织学教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥几十份大多寄给国外的研究者，可他们很少读西班牙文。1889 年 10 月，他自费去柏林参加德国解剖学会的会议，把切片放在显微镜下给人看，会上资深的组织学家阿尔伯特·冯·克利克接过了他的研究。1906 年，他与卡米洛·高尔基分享诺贝尔奖。'
        relic: 一支极细的绘图笔
        relic_desc: 细到能画出神经元每一条分支的笔。
        points:
          p1: '在公费未获准时帮卡哈尔把旅费与玻片分包凑齐，保住柏林会上那次亲手演示'
          p2: '为难以进入外语期刊的图文找一位合译者，让同业在会前就能按图复核'
        points_fail:
          p1: '自费凑不齐长途行程，卡哈尔只能把文字寄过去。柏林没有那次演示，员工因同步失败被召回。'
          p2: '外地同行会后才有人设法读懂西班牙文稿，复核仍得逐封通信。'
        shift:
          p1:
            was: '1889 年 9 月 26 日，卡哈尔获得出行许可，自筹旅费并在 10 月柏林会议上展示显微切片。'
          p2:
            was: '1889 年，卡哈尔自述先前的西班牙文研究在国外少受注意，柏林演示后来帮助传播他的结果。'
            now: '{staff}让译者同卡哈尔对照原图校过短文，先寄给愿意核对切片的同行。演示之后，卡哈尔有一条持续寄发图文的渠道。'
            who: cajal_barcelona
            bio: '卡哈尔在巴塞罗那为研究图文建立了稳定的外语协作。后来的手稿可以先在国外找到愿意拿切片复核的同行。'
        vignettes:
          stain: '{staff}帮一个学生把切好的小块组织泡进重铬酸钾的罐子里。学生说这罐要原封不动泡到下礼拜，谁要是忍不住打开看，下一百张切片就归谁切。'
          ticket: '{staff}陪学生去火车站问去柏林的车票。售票员报了价，学生吹了声口哨，回来的路上一直掰着指头算，这笔钱够印几期刊物。'
          rain: '十一月，巴塞罗那下起雨。{staff}帮学生把窗台上晾着的一叠图版收进屋，学生点了两遍数，才肯把百叶窗关上。'
text:
  en:
    name: Santiago Ramón y Cajal
    text: Spanish neuroscientist, 1852 to 1934. Using a silver stain he showed that the nervous system is made of separate cells, the neuron doctrine. He shared the 1906 Nobel Prize and taught in Barcelona from 1887 to 1892.
  zh:
    name: 圣地亚哥·拉蒙-卡哈尔
    text: 西班牙神经科学家，1852 年生，1934 年去世。他用银染法证明神经系统由彼此分离的细胞组成，即神经元学说。他分享了 1906 年诺贝尔奖，1887 年到 1892 年在巴塞罗那任教。
hook: {en: 'Is that a join or a crossing?', zh: '两条线相交，就一定相连吗'}
facts:
  chair:
    date: '1887'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_barcelona_sld, cajal_wiki]
    text:
      en: 'At the end of 1887 Cajal took up the chair of normal and pathological histology at the University of Barcelona, where he stayed until he moved to Madrid in 1892.'
      zh: '1887 年底，卡哈尔到巴塞罗那大学任正常与病理组织学教授，在那里待到 1892 年调往马德里。'
    line:
      en: '1887: Cajal takes up the chair of histology at the University of Barcelona.'
      zh: '1887 年，卡哈尔到巴塞罗那大学任组织学教授。'
  revista:
    date: '1888-05-01'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_revista_iec, cajal_barcelona_sld]
    text:
      en: 'On 1 May 1888 Cajal brought out the first number of his own Revista trimestral de histología normal y patológica at his own expense; money kept the printing to some sixty copies, most of them sent to researchers abroad, and his family handed them out from home.'
      zh: '1888 年 5 月 1 日，卡哈尔自费出版自己的《正常与病理组织学季刊》第一期。手头紧，只印了六十份上下，大多寄给国外的研究者，由家里人在家中分发。'
    line:
      en: '1 May 1888: Cajal pays for the first number of his own journal; about sixty copies, most of them posted abroad.'
      zh: '1888 年 5 月 1 日，卡哈尔自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。'
  histology:
    date: '1889'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [cajal_barcelona_primary, cajal_1889_unizar]
    text:
      en: 'Cajal published an illustrated manual of histology in 1889. A later diagram preserved by the CSIC shows the retina and directions of currents.'
      zh: '卡哈尔于 1889 年刊行有插图的组织学手册。西班牙国家研究委员会藏有他后来绘制的视网膜结构及传导方向图。'
  berlin:
    date: '1889-10'
    stay_day: 40
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_nobel_bio, cajal_kolliker_review, cajal_memories_berlin]
    text:
      en: 'In October 1889 Cajal went to the meeting of the German Anatomical Society at the University of Berlin and showed his preparations to the leading histologists; Albert von Kölliker, the president of the society, became his supporter and introduced him to others.'
      zh: '1889 年 10 月，卡哈尔到柏林大学参加德国解剖学会的会议，把自己的切片给一流的组织学家看。学会会长阿尔伯特·冯·克利克从此支持他，又把他介绍给别的学者。'
    line:
      en: 'October 1889: at the meeting of the German Anatomical Society in Berlin, Cajal sets his slides under the microscope for the leading histologists, and Kölliker takes up his work.'
      zh: '1889 年 10 月，卡哈尔在柏林德国解剖学会的会上把切片放到显微镜下给各国学者看，克利克接过了他的研究。'
  madrid:
    date: '1892'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [cajal_barcelona_sld, cajal_wiki]
    text:
      en: 'In 1892 Cajal won the chair of histology in Madrid and left Barcelona.'
      zh: '1892 年，卡哈尔取得马德里的组织学教职，离开巴塞罗那。'
    line:
      en: '1892: Cajal leaves Barcelona for the chair of histology in Madrid.'
      zh: '1892 年，卡哈尔离开巴塞罗那，去马德里任组织学教授。'
  nobel:
    date: '1906'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [cajal_nobel_1906]
    text:
      en: 'The Nobel Prize in Physiology or Medicine 1906 was awarded jointly to Camillo Golgi and Santiago Ramón y Cajal for their work on the structure of the nervous system.'
      zh: '1906 年诺贝尔生理学或医学奖由卡米洛·高尔基与圣地亚哥·拉蒙-卡哈尔共享，表彰他们对神经系统结构的研究。'
    line:
      en: '1906: Cajal and Golgi share the Nobel Prize for their work on the structure of the nervous system.'
      zh: '1906 年，卡哈尔与高尔基因神经系统结构的研究共享诺贝尔奖。'
