      en:
        name: Nerve cells as separate units
        place: Barcelona
        figure: Santiago Ramón y Cajal
        story: Cajal draws silver stained nerve cells in beautiful detail and argues that the brain is made of separate cells.
        relic: A fine drawing pen
        relic_desc: A pen so fine it drew every branch of a neuron.
        points:
          p1: "Recognise the branching cell under the microscope"
          p2: "Draw what is seen as a figure"
          p3: "Wait out the stain through the night"
      zh:
        name: 神经细胞是一个个独立的单位
        place: 巴塞罗那
        figure: 圣地亚哥·拉蒙-卡哈尔
        story: 卡哈尔把银染的神经细胞画得极细致，并论证大脑是由一个个独立的细胞组成的。
        relic: 一支极细的绘图笔
        relic_desc: 细到能画出神经元每一条分支的笔。
        points:
          p1: "在显微镜里认出分叉的细胞"
          p2: "把看到的画成图"
          p3: "整夜等染色"
text:
  en:
    name: Santiago Ramón y Cajal
    text: Spanish neuroscientist, 1852 to 1934. Using a silver stain he showed that the nervous system is made of separate cells, the neuron doctrine. He shared the 1906 Nobel Prize and taught in Barcelona in the 1890s.
  zh:
    name: 圣地亚哥·拉蒙-卡哈尔
    text: 西班牙神经科学家，1852 年生，1934 年去世。他用银染法证明神经系统由彼此分离的细胞组成，即神经元学说。他分享了 1906 年诺贝尔奖，1890 年代在巴塞罗那任教。
