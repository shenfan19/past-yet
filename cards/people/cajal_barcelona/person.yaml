  fact: berlin
  quote_line: '1888 年 5 月 1 日，卡哈尔自掏腰包印出自己期刊的第一期，六十份上下，大多寄往国外。'
  regret_choice: '派管账细致的去，旅费和玻片都凑齐了，柏林照常有那场演示；派会说外语的去，会前就有人按图复核。两样都做到要又细又能说。'
  bookend: '从 1887 年到巴塞罗那任教开始，以 1906 年的诺贝尔奖收尾，中间是六十份没人读的期刊和一趟自费的柏林之行。'
  share_line: '1889 年秋天，有人自掏腰包，带着一箱玻片去柏林。'
