      en: {who: 'Santiago Ramón y Cajal', quote: 'Enthusiasm and perseverance work wonders.', occasion: 'Advice on Scientific Research, sixth edition, chapter on the working environment (game translation)'}
      zh: {who: '圣地亚哥·拉蒙-卡哈尔', quote: '热忱和坚持能创造奇迹。', occasion: '《科学研究的规则与忠告》第六版，谈研究环境一章（游戏译文）'}
