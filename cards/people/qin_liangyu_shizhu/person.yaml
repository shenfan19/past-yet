    text:
      en:
        name: Qin Liangyu and the supply ledger
        place: Shizhu
        figure: Qin Liangyu
        story: The History of Ming records that in 1630 Qin Liangyu and Qin Yiming answered the summons to aid the capital, and that she used family funds for supplies. The Shizhu gazetteer also records the summons and expedition.
        relic: Copy of a Shizhu receipt
        relic_desc: A fictional receipt with one name in the margin and another beside a bundle.
        points:
          p1: 'Verify each transfer of Qin Liangyu’s own funds so the people handling the accounts at Shizhu can sign for what they receive'
          p2: 'Keep the transfer notes apart from household expenses. Send Shizhu a copy identifying the people who handled payments and the dates'
          p3: 'Have Qin approve an expense account her relatives can check. Record any delayed payment still needing confirmation'
        points_fail:
          p1: 'The clerk loses track of who has received a payment. The transfer fails and the office recalls the employee.'
          p2: 'Public and household expenses go into the same book. A family member has to ask everyone who handled a disputed payment.'
          p3: 'Amounts still owed are treated as paid, and those who cannot return have no way to check them.'
        shift:
          p1:
            was: 'The History of Ming says Qin Liangyu and Qin Yiming answered a summons in 1630 and that she contributed her own family funds.'
          p2:
            was: 'The biography describes her expenditure without preserving an itemized ledger.'
            now: 'The retained copy distinguishes funds already paid from those still being advanced by the family.'
          p3:
            was: 'The local gazetteer records the summons and departure. Later records mainly report the expedition and her service.'
            now: 'The household can check a missing entry against its copy. A person who handled a payment can trace how the amount was recorded.'
            who: qin_liangyu_shizhu
            bio: 'Qin Liangyu’s ties to Shizhu were longstanding. Records identify her contribution from household funds. The branch follows how the transfer could be recorded.'
        vignettes:
          ledger: 'Two lines begin with nearly the same name. The clerk has read them as one. You underline the characters that differ, and he calls both bearers back to check.'
          hands: 'The waiting carrier has both hands on a bundle and cannot open her slip. You hold it flat and read the name back to her before she lifts it again.'
          copy: 'The clerk reads the entries aloud while you follow the copy. At the last line you turn the two sheets side by side and leave them on the table.'
      zh:
        name: 秦良玉与石砫账册
        place: 石砫
        figure: 秦良玉
        story: 《明史·秦良玉传》记载，崇祯三年，秦良玉与秦翼明奉诏勤王，秦良玉出家财济饷。《补辑石砫厅新志》也记载了这次奉诏出行。
        relic: 石砫领物抄单
        relic_desc: 页边记了一个姓名，包裹旁又写了另一个。
        points:
          p1: '把秦良玉拿出家财的交接款逐笔确认，让石砫经手的人能在开支日期签领'
          p2: '把交割手记和家中其余的开销分开记，发回石砫的一份加经手人和实际支付日期'
          p3: '请秦良玉核对一份家人也能查的支出单，给因分摊费用而迟领钱的人留待核记录'
        points_fail:
          p1: '临时收款的人记不清谁已领款，家财没能按原意交割，事务所因同步失败召回员工。'
          p2: '把公私开销抄在一处，后来查一笔支出时，家人得再去问所有经手者。'
          p3: '应补支付当作已经给出，不能回来的经手人也没法核清。'
        shift:
          p1:
            was: '《明史》记 1630 年秦良玉与秦翼明奉诏应召，秦良玉出家财济饷。'
          p2:
            was: '秦良玉的支出由史书概述，公开传记没有留这批款项完整细账。'
            now: '留下的副本可以确定哪些钱已交付、哪些家人还在垫付。'
          p3:
            was: '石砫地方志也记奉诏出行，后来的记载以出行和事功为主。'
            now: '家里能凭留底追对漏项。经手的人来问时，可以看见当日应补的数如何核出。'
            who: qin_liangyu_shizhu
            bio: '秦良玉与石砫关系密切。史料明载她用到家中财物，具体如何经手是这条分支考察的内容。'
        vignettes:
          ledger: '两行名字只差一个字，账房顺嘴读成了同一个人。你把那个字圈出来，他把两位领物人都叫回来核对。'
          hands: '搬货人两手托着包裹，腾不出手展开单子。你替她把纸按平，把名字念给她听，她才重新抱紧包裹。'
          copy: '账房念过一行，你就在抄单上对一行。念到最后，你把两张纸并排留在桌上。'
text:
  en:
    name: Qin Liangyu
    text: A late Ming commander from Zhongzhou who took up Ma Qiancheng's office in Shizhu. Her biography in the History of Ming describes the troops called the White Pole Soldiers and records her use of family funds in 1630.
  zh:
    name: 秦良玉
    text: 明末忠州人，马千乘之后代领石砫之职。《明史》为她立传，记她所部号白杆兵，亦记崇祯三年她出家财济饷。
hook: {en: Two similar names, two different bundles., zh: 两个名字相近，包裹却不能拿错}
facts:
  summons_1630:
    date: '1630'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mingshi_qin_liangyu, shizhu_gazetteer_qin]
    note: The official dynastic history records the summons. The later gazetteer gives a parallel account whose independence has not been established.
    text:
      en: Qin Liangyu answered the summons to aid the capital in the third year of Chongzhen.
      zh: 崇祯三年，秦良玉奉诏勤王。
  family_funds:
    date: '1630'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mingshi_qin_liangyu]
    note: This establishes what the official history records. Individual receipts and quantities for the scene are fictional.
    text:
      en: The official dynastic history records that Qin Liangyu used family funds for supplies.
      zh: 官修《明史》记秦良玉出家财济饷。
