text:
  en:
    name: Qu Yuan
    text: Poet and minister of the state of Chu, about 340 BC to about 278 BC. His long poem Li Sao is a founding work of Chinese poetry. After the fall of the Chu capital he is said to have drowned himself in the Miluo River, and the Dragon Boat Festival is linked to his memory.
  zh:
    name: 屈原
    text: 楚国诗人与大臣，约公元前 340 年生，约公元前 278 年去世。他的长诗《离骚》是中国诗歌的奠基之作。楚国都城陷落后，据说他投汨罗江自尽，端午节与对他的纪念有关。
