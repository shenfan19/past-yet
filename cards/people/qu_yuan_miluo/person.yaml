        occasion: '《渔父》开头描写放逐中的屈原，属于传本文辞。'
      zh-Hant:
        who: '《渔父》中的屈原'
        quote: '行吟澤畔'
        occasion: '《渔父》开头描写放逐中的屈原，属于传本文辞。'
      fr:
        who: 'Qu Yuan dans Le Pêcheur'
        quote: 'Il marchait en récitant près du marais.'
        occasion: 'L''ouverture du Pêcheur, un récit littéraire de Qu Yuan en exil.'
      es:
        who: 'Qu Yuan en El pescador'
        quote: 'Caminó recitando junto al pantano.'
        occasion: 'La apertura de El pescador, un relato literario de Qu Yuan en el exilio.'
      ja:
