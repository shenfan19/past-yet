    text:
      en:
        name: "Verses by the river"
        place: "Miluo River"
        figure: "Qu Yuan"
        story: 'The Songs of Chu transmits The Fisherman, a literary exchange between Qu Yuan and a fisherman. The later biography in the Records also preserves a version of the dialogue.'
        story_prose:
          opening:
            - 'On a riverbank in Chu. Readers of the Songs of Chu will know verses attributed to the exiled Qu Yuan, and an account in which he meets a fisherman by the water.'
            - 'The received Records describe him reciting by the marsh, his face drawn. In this branch someone wants to take the verses away, with one bundle still unfinished.'
            - 'Someone who knows books and river crossings can help. So can someone who can find a quiet place and leave a meal there.'
          points:
            p2: '{staff} asks someone selling food to keep a place open, sets down the bowl, and steps aside. Qu Yuan sits and puts the slips at his left hand. He eats a little before taking one out himself. He reads the line a second time. Someone seated by the door shifts farther into the room.'
            p1: 'People crossing the river are packing. {staff} asks Qu Yuan which bundle he wants kept and asks the person copying to read back the last line. Qu Yuan finds the slip that belongs between two others and sets it down in its place. The carrier threads the cord back through and leaves the knot on the outside. A hand can find it the next time the bundle is opened.'
          outcomes:
            all: 'The carrier takes the bundle away. At the boat he still remembers a line he heard over the meal, and only then opens the copy to find it.'
            p2: 'After the bowls are cleared, the people who are still there stay a little longer. In the quiet Qu Yuan takes up the same slip again.'
            p1: 'The copy goes downriver. Once the carrier sits, he turns the knot round to the hand nearest it.'
          none: 'The place put out for the meal remains empty. After dark the wind lifts a corner of the mat.'
          not_admitted: '{staff} never finds the place set out for the meal. The ferryman draws in a plank, and water still passes underneath.'
          desync: 'A part of the copy is missing between two slips. The carrier has just reached the shore when the agency calls {staff} back.'
          excerpts:
            p2: 'He reads the line a second time. Someone seated by the door shifts farther into the room.'
            p1: 'The carrier threads the cord back through and leaves the knot on the outside. A hand can find it the next time the bundle is opened.'
        relic: "A bamboo slip of verse"
        relic_desc: "A slip of bamboo carrying a few lines of a long poem."
        points:
          p1: 'Ask Qu Yuan which bundle he wants copied and help a reader keep those verses together while people are leaving'
          p2: 'Offer Qu Yuan a place to eat and sit down, and listen if he wants to read one of his verses aloud'
        points_fail:
          p1: 'The reader leaves with a gap between two slips. The office recalls {staff} when the copy falls out of sync.'
          p2: 'The meal is ready but the place to sit has been taken. There is no chance to offer him a quiet hour.'
        shift:
          p1:
            was: 'Poems attributed to Qu Yuan were collected in the Songs of Chu. The handover imagined here is one way readers might keep a set of verses together.'
          p2:
            was: 'The Records of the Grand Historian say that Qu Yuan, in exile, walked the marsh banks with his hair unbound, his face haggard and his body wasted.'
            now: 'In this branch Qu Yuan accepts a meal. He sets a bundle of verses beside him and decides which one to read aloud before he leaves.'
        vignettes:
          two_tales: 'The ferryman has heard a different ending from the one you brought. You listen as they tell it through and mark whose telling it is before comparing the lines.'
          refrain: 'The ferryman starts humming after the question in the tale. You wait until the tune ends before asking where they first heard the words.'
          wait: 'While the ferry waits, you ask the teller to go back to where the two people first speak. Onshore, you can still remember who asked the first question.'
      zh:
        name: "江边的诗句"
        place: "汨罗江"
        figure: "屈原"
        story: '《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。传本对话是文献中的记述。'
        story_prose:
          opening:
            - '楚地江边。后人读《楚辞》，读到有些诗被归给离乡的屈原，也读到他在水边遇到一位渔父的故事。'
            - '传世的《史记》写他在泽畔行吟，面容憔悴。在这条分支里，有人想把手头的诗带走，还剩一束没抄完。'
            - '这趟用得上熟悉书简和渡口的人，也用得上能找一处安静地方、把饭留下的人。'
          points:
            p2: '{staff}请卖饭的人先留一处空着的席，把饭端来以后退到一旁。屈原坐下，把诗简放在自己左手边。他先吃了几口，后来自己取出一枚来。 他把那一句重新念了一遍。原先挨着门坐的人，把身子往里挪了挪。'
            p1: '要过江的人已经在收拾，{staff}先问屈原要留哪束，再让抄写的人把已经记下的末句念出来。屈原找出缺在两枚之间的那一枚，放到原处。 送抄件的人把绳穿回来，把结留在外面。下次要重读，手一摸就找得到。'
          outcomes:
            all: '送抄件的人把那一束带走了。临行前，他还记得席上听到的一句，到了船边才又翻出来找。'
            p2: '饭碗收走以后，留在屋里的人没有急着一起走。屈原借着那一点安静，又把同一枚简拿起来。'
            p1: '抄件跟着下水的船走了。拿着它的人坐下以后，先把绳结转到了自己手边。'
          none: '开饭前的位置一直没人坐。天暗以后，被风掀动的是空席的一角。'
          not_admitted: '{staff}没能找到留饭的地方。摆渡人收了木板，江水仍从板下穿过去。'
          desync: '两枚简之间漏了一段。拿抄件的人刚到岸边，事务所便召回了{staff}。'
          excerpts:
            p2: '他把那一句重新念了一遍。原先挨着门坐的人，把身子往里挪了挪。'
            p1: '送抄件的人把绳穿回来，把结留在外面。下次要重读，手一摸就找得到。'
        relic: "一片写诗的竹简"
        relic_desc: "一片竹简，上面是一首长诗中的几行。"
        points:
          p1: '众人要分头走时，问屈原想留哪一束诗简，帮读者照着次序抄全'
          p2: '给屈原留一餐饭和一个能歇脚的位置，若他愿意，就坐着听他念一首诗'
        points_fail:
          p1: '读者带走的抄件，两枚简之间漏了一截。记录脱节，事务所召回{staff}。'
          p2: '饭备好了，能歇脚的位置却被占了。没人能请他坐下安静待一会儿。'
        shift:
          p1:
            was: '《楚辞》收有归于屈原的诗作。故事中的诗简交接，是分支对传抄过程的演绎。'
          p2:
            was: '《史记》记屈原流放时披发行吟泽畔，颜色憔悴，形容枯槁。'
            now: '这条分支里，屈原接下饭食，把一束诗简搁在身边。离开以前，他挑了一首念给留下来的人听。'
        vignettes:
          two_tales: '渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。'
          refrain: '故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。'
          wait: '等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。'
text:
  en:
    name: Qu Yuan
    text: Poet and minister of the state of Chu. His long poem Li Sao is a foundational work of Chinese poetry. The Records of the Grand Historian place his death at the Miluo River. His birth and death years are debated.
  zh:
    name: 屈原
    text: 楚国诗人与大臣。《离骚》是中国诗歌的奠基之作。《史记》将屈原去世的地点记为汨罗江，生卒年份仍有异说。
