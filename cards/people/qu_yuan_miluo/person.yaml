    text:
      en:
        name: "Verses by the river"
        place: "Miluo River"
        figure: "Qu Yuan"
        story: 'The Songs of Chu transmits The Fisherman, a literary exchange between Qu Yuan and a fisherman. The later biography in the Records also preserves a version of the dialogue.'
        relic: "A bamboo slip of verse"
        relic_desc: "A slip of bamboo carrying a few lines of a long poem."
        points:
          p1: 'Ask Qu Yuan which bundle he wants copied and help a reader keep those verses together while people are leaving'
          p2: 'Offer Qu Yuan a place to eat and sit down, and listen if he wants to read one of his verses aloud'
        points_fail:
          p1: 'The reader leaves with a gap between two slips. The office recalls {staff} when the copy falls out of sync.'
          p2: 'The meal is ready but the place to sit has been taken. There is no chance to offer him a quiet hour.'
        shift:
          p1:
            was: 'Poems attributed to Qu Yuan were collected in the Songs of Chu. The handover imagined here is one way readers might keep a set of verses together.'
          p2:
            was: 'The Records of the Grand Historian say that Qu Yuan, in exile, walked the marsh banks with his hair unbound, his face haggard and his body wasted.'
            now: 'In this branch Qu Yuan accepts a meal. He sets a bundle of verses beside him and decides which one to read aloud before he leaves.'
        vignettes:
          two_tales: 'The ferryman has heard a different ending from the one you brought. You listen as they tell it through and mark whose telling it is before comparing the lines.'
          refrain: 'The ferryman starts humming after the question in the tale. You wait until the tune ends before asking where they first heard the words.'
          wait: 'While the ferry waits, you ask the teller to go back to where the two people first speak. Onshore, you can still remember who asked the first question.'
      zh:
        name: "江边的诗句"
        place: "汨罗江"
        figure: "屈原"
        story: '《楚辞》传有《渔父》，写屈原与渔父的文辞问答。《史记》本传也保留了一版对话。传本对话是文献中的记述。'
        relic: "一片写诗的竹简"
        relic_desc: "一片竹简，上面是一首长诗中的几行。"
        points:
          p1: '众人要分头走时，问屈原想留哪一束诗简，帮读者照着次序抄全'
          p2: '给屈原留一餐饭和一个能歇脚的位置，若他愿意，就坐着听他念一首诗'
        points_fail:
          p1: '读者带走的抄件，两枚简之间漏了一截。记录脱节，事务所召回{staff}。'
          p2: '饭备好了，能歇脚的位置却被占了。没人能请他坐下安静待一会儿。'
        shift:
          p1:
            was: '《楚辞》收有归于屈原的诗作。故事中的诗简交接，是分支对传抄过程的演绎。'
          p2:
            was: '《史记》记屈原流放时披发行吟泽畔，颜色憔悴，形容枯槁。'
            now: '这条分支里，屈原接下饭食，把一束诗简搁在身边。离开以前，他挑了一首念给留下来的人听。'
        vignettes:
          two_tales: '渡船人听来的收尾跟你带来的不同。你听他把整段讲完，先记是谁传的，再对照两处词句。'
          refrain: '故事讲到问话，渡船人接着哼起来。你等曲子完了才问，他最早从哪里听到这些话。'
          wait: '等开船时，你请讲故事的人回到两人头一次开口的地方。上岸之后，你还记得是谁先问了一句。'
text:
  en:
    name: Qu Yuan
    text: Poet and minister of the state of Chu. His long poem Li Sao is a foundational work of Chinese poetry. The Records of the Grand Historian place his death at the Miluo River. His birth and death years are debated.
  zh:
    name: 屈原
    text: 楚国诗人与大臣。《离骚》是中国诗歌的奠基之作。《史记》将屈原去世的地点记为汨罗江，生卒年份仍有异说。
hook: {en: 'A fisherman is also a voice in a story.', zh: '渔父在书中，是谁的声音'}
