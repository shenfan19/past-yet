        quote: '渔父微微一笑，敲着船桨离开。'
        occasion: '《渔父》的叙述，两人谈过以后分别。'
      zh-Hant:
        who: '《渔父》叙述者'
        quote: '漁父莞爾而笑，鼓枻而去'
        occasion: '《渔父》的叙述，两人谈过以后分别。'
