        quote: '彼は沼のほとりで朗読しながら歩いた。'
        occasion: '亡命中の屈原を文学的に描いた『漁師』の冒頭。'
      ko:
        who: '어부의 굴 위안'
        quote: '그는 습지 옆에서 낭송하며 걸었습니다.'
        occasion: '망명중인 굴원(굴원)의 문학적 이야기인 어부(The Fisherman)의 시작.'
      ru:
        who: 'Цюй Юань в фильме «Рыбак»'
        quote: 'Он шел, читая, вдоль болота.'
        occasion: 'Открытие «Рыбака», литературного рассказа о Цюй Юане в изгнании.'
