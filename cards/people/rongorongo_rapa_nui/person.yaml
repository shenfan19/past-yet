      en:
        name: "Tablets nobody can read"
        place: "Rapa Nui"
        figure: "Rapa Nui people"
        story: "Only about two dozen wooden tablets carved with rongorongo signs survive from Rapa Nui. Nobody can read them today, and the people who could died or were taken away in the 1860s."
        relic: "A carved wooden tablet"
        relic_desc: "A flat piece of wood cut with rows of small figures."
        points:
          p1: "Study the lines of signs"
          p2: "Sit with the old people who remember"
          p3: "Hear the old chants as they are spoken"
      zh:
        name: "无人能读的木板"
        place: "拉帕努伊岛"
        figure: "拉帕努伊人"
        story: "拉帕努伊岛上刻着朗格朗格符号的木板只留下约二十来块。今天没有人能读懂，会读的人在1860年代死去或被带走了。"
        relic: "一块刻字的木板"
        relic_desc: "一块平整的木头，刻着一行行小小的人形。"
        points:
          p1: "研究那些成行的符号"
          p2: "陪记得那些的老人坐坐"
          p3: "听懂老人念出的古老吟唱"
text:
  en:
    name: Rapa Nui people
    text: The Rapa Nui people of Easter Island, who made wooden tablets carved with the rongorongo glyphs. In the 1860s slave raids and disease killed most of the island's people, including those who could read the tablets, and the script remains undeciphered.
  zh:
    name: 拉帕努伊人
    text: 复活节岛的拉帕努伊人，他们制作刻有朗格朗格文字的木板。1860 年代的奴隶掠夺与疾病夺走了岛上大多数人的生命，包括能读木板的人，这种文字至今没有破译。
