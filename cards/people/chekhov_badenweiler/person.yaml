    text:
      en:
        name: 'A reply to Villa Friederike'
        place: "Badenweiler"
        figure: "Anton Chekhov"
        story: 'In June 1904 Anton Chekhov, forty four and gravely ill with tuberculosis, came with his wife Olga Knipper to the spa of Badenweiler in the Black Forest. They stayed first at the Hotel Römerbad, then in the Villa Friederike, then at the Hotel Sommer, next to the post office. He wrote cheerful letters home, and in July asked friends which steamer could take them back to Russia by sea. He died there early on 15 July.'
        relic: "A pince nez"
        relic_desc: "Small round spectacles on a cord."
        points:
          p1: 'Just after Chekhov settles in, check the return address on his letter to his sister Maria and get it out while he still has the strength to finish it'
          p2: 'Turn the questions in his July 11 letter into a short telegram to someone who knows the route. Give him an answer while he is still in Badenweiler'
          p3: 'Cure his tuberculosis, so that he and Olga can set out for Russia together'
        points_fail:
          p1: 'The luggage is still being handled under the old hotel’s arrangements. The unfinished letter goes with it. Maria receives no address from the villa, and the office recalls the employee.'
          p2: 'His questions about sailing dates, a cabin and the length of the crossing go out by ordinary mail. While he waits, he has no answer to read.'
          p3: 'Early on 15 July Chekhov died in Badenweiler, at forty four.'
        shift:
          p1:
            was: 'On June 25, 1904 (June 12 in the Russian calendar), Chekhov wrote to Maria from Badenweiler with the full return address at Villa Friederike.'
          p2:
            was: 'On 11 July 1904 Chekhov asked Rossolimo about sailing from Marseille to Odessa. He died in Badenweiler on July 15 and never made that journey.'
            now: 'A reply by telegram gives the departure day, the length of the crossing and a cabin for two. Chekhov and his wife read it at the hotel and talk through which sailing they would choose if they could leave.'
          p3:
            was: 'On 15 July 1904 Chekhov died of tuberculosis in Badenweiler, at forty four.'
            now: 'His lungs healed, and after the summer he and Olga sailed home to Russia. He went on writing for years and was back at the Moscow Art Theatre for rehearsals.'
            who: chekhov_badenweiler
            bio: 'Chekhov was cured of tuberculosis in Badenweiler, went home to Russia in the autumn of 1904, and wrote stories and plays for many years more.'
        vignettes:
          garden: 'On 27 June {staff} helps the maid of the Villa Friederike carry a deck chair round the garden after the sun. She says the sun leaves the lawn at seven exactly, and in this house they set the supper by it, not by the clock in the hall.'
          post: 'On 7 July {staff} sits on the bench outside the post office next to the Hotel Sommer. The postman says that in summer the Russians write the most letters of anyone in Badenweiler, and the English the shortest; he can lift a Russian envelope and tell whether it will need another stamp.'
          ice: 'On 10 July, in the worst of the heat, {staff} helps the porter of the Hotel Sommer carry a block of ice up from the cellar in a sack. The porter says the Black Forest has not had a July like it in twenty years, and the ice man from Müllheim has started charging by the stair.'
      zh:
        name: '寄往弗里德里克别墅的回信'
        place: "巴登魏勒"
        figure: "安东·契诃夫"
        story: '1904 年 6 月，四十四岁、肺结核已经很重的安东·契诃夫，和妻子奥尔加·克尼佩尔来到黑森林的疗养地巴登魏勒。他们先住罗马浴旅馆，后住弗里德里克别墅，最后搬进邮局隔壁的索默旅馆。他往家里写的信都很轻快，七月里还托朋友打听哪一班轮船能走海路送他们回俄国。7 月 15 日凌晨，他在那里去世。'
        story_prose:
          opening:
            - '1904 年 6 月，黑森林里的疗养地巴登魏勒。安东·契诃夫四十四岁，肺结核已经很重，在莫斯科瘦了一大圈，喘不上气。他和妻子奥尔加·克尼佩尔从俄国一路坐车过来，先住进罗马浴旅馆，两人都累坏了。'
            - '史实里，他们后来搬进弗里德里克别墅，又搬到邮局隔壁的索默旅馆。他往家里写的信都很轻快，7 月 11 日还写信打听哪一班轮船能走海路送他们回俄国。7 月 15 日凌晨，他在那里去世。在这条分支里，别墅的女佣跟着太阳挪躺椅，邮局门口的邮差掂得出一封俄国信够不够邮票。'
            - '这一趟用得上三种人：做事细、守得住信件和地址的人，耐得住性子、能把一串问题压成一封短电报的人，懂医、带着纳米药箱来的人。'
          outcomes:
            all: '那个夏天过去，契诃夫和奥尔加坐船回到了俄国。甲板上风很大，他把那身法兰绒衣服的扣子一颗颗扣上了。'
            p3: '夏天过后，契诃夫和奥尔加动身回俄国。站台上，他穿着那身法兰绒衣服。'
            p2: '那张回电的薄纸，一直摊在写字桌上，舱位那一行被手指摸得发了毛。'
            p1: '玛丽娅收到了那封信。信封背面是弗里德里克别墅的地址，一笔一画，都对。'
          none: '巴登魏勒的七月很热。阳台的躺椅跟着太阳挪了一天，傍晚又挪回原处。'
          desync: '{staff}被召回时，写字桌上已经空了。玛丽娅还不知道哥哥住到了哪里。'
          not_admitted: '{staff}没能进那座别墅。花园里的太阳一直照到晚上七点，楼上的人写几行信就要歇一歇。'
          points:
            p1: '6 月 25 日，搬进弗里德里克别墅的第三天，契诃夫坐在那张写字桌前给玛丽娅写信，写几行就要歇一歇。{staff}把信末的回信地址一个字母一个字母核过去，街名和门牌都对上了。契诃夫在信尾签了名，把笔搁下，靠回椅背，望着窗外喘了一会儿。'
            p2: '7 月 11 日，屋里热得像蒸笼。契诃夫在信里一条条问：船哪天几点开，走几天，能不能要一间两个人的舱。{staff}把这几个问题压成一封短电报，发给熟悉这条航线的人。回电到的时候，开船的日子、路上的天数和舱位，都写在一张薄纸上。奥尔加把纸念给他听，念到舱位那一行，他让她再念一遍。'
            p3:
              class_learned: '{staff}先照诊病的老规矩听了他的胸口，数过呼吸，才打开纳米药箱，按他的体重定下剂量，每天早晚各看一回。七月的酷暑里，他咳得少了。十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。'
              else: '{staff}打开纳米药箱，照说明一格格配好药，按钟点守在床边给药、量体温，夜里每隔一阵就看一眼他的呼吸。七月的酷暑里，他咳得少了。十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。'
          excerpts:
            p3: '十来天后，他能自己从阳台走回屋里，坐到写字桌前。奥尔加从弗赖堡带回那身法兰绒衣服，他穿上，在镜子前站了一会儿。'
            p2: '奥尔加把纸念给他听，念到舱位那一行，他让她再念一遍。'
            p1: '契诃夫在信尾签了名，把笔搁下，靠回椅背，望着窗外喘了一会儿。'
        relic: "一副夹鼻眼镜"
        relic_desc: "一副系着细绳的小圆眼镜。"
        points:
          p1: '契诃夫刚安顿下来时，把他写给妹妹玛丽娅的回信地址逐字核对，趁他还有力气写完，把信交出去'
          p2: '用他 7 月 11 日列在信里的问题请熟悉航线的人发一封短电报，让他在巴登魏勒得到想问的返程消息'
          p3: '治好他的肺结核，让他和奥尔加一起动身回俄国'
        points_fail:
          p1: '行李还按上一处旅馆收放，写字桌上的信封被一并带走。玛丽娅没有收到他从别墅寄出的地址，事务所因同步失败召回员工。'
          p2: '他关于船期、舱位和航行天数的问题随普通信寄出。等回信的日子里，手边仍没有一份可以读的答复。'
          p3: '7 月 15 日凌晨，契诃夫在巴登魏勒去世，年仅四十四岁。'
        shift:
          p1:
            was: '1904 年 6 月 25 日（俄历 6 月 12 日），契诃夫从巴登魏勒写信给玛丽娅，写明弗里德里克别墅的详细回信地址。'
          p2:
            was: '1904 年 7 月 11 日，契诃夫写信给罗索利莫询问由马赛乘船去敖德萨的细节。他于 7 月 15 日在巴登魏勒去世，未能作这趟旅行。'
            now: '负责航线的人回电报来，把开船日、路程和两人可用的舱位写得清楚。契诃夫和妻子在旅馆把这张纸读完，也商量了若能动身最想选哪一班。'
          p3:
            was: '1904 年 7 月 15 日，契诃夫在巴登魏勒因肺结核去世，终年四十四岁。'
            now: '他的肺病好了，夏天过后和奥尔加坐船回到俄国。此后他又写了好些年，也回到莫斯科艺术剧院看排练。'
            who: chekhov_badenweiler
            bio: '契诃夫在巴登魏勒治好了肺结核，1904 年秋天回到俄国，此后继续写小说和戏剧多年。'
        vignettes:
          garden: '6 月 27 日，草叶上的露水刚干，{staff}帮弗里德里克别墅的女佣把一张躺椅跟着太阳在花园里挪位置。她说这里的太阳七点整离开草坪，这家人开晚饭看的是太阳，不是门厅里那座钟。'
          post: '7 月 7 日，{staff}坐在索默旅馆隔壁邮局门口的长凳上，邮局的门开开关关。邮差说，夏天巴登魏勒写信最多的是俄国人，写得最短的是英国人；俄国人的信封他掂一掂，就知道够不够邮票。'
          ice: '7 月 10 日热得最凶，{staff}帮索默旅馆的门房用麻袋从地窖往楼上扛一块冰，冰水顺着麻袋往下滴。门房说黑森林二十年没见过这样的七月，米尔海姆来的卖冰人都开始按楼梯级数算钱了。'
text:
  en:
    name: Anton Chekhov
    text: Russian writer and physician, 1860 to 1904. He wrote short stories and the plays The Seagull, Uncle Vanya, Three Sisters and The Cherry Orchard. He died of tuberculosis at the spa of Badenweiler.
  zh:
    name: 安东·契诃夫
    text: 俄国作家与医生，1860 年生，1904 年去世。他写短篇小说，也写了《海鸥》《万尼亚舅舅》《三姐妹》《樱桃园》。他在巴登魏勒的疗养地死于肺结核。
hook: {en: 'He asked for a telegram of three words', zh: '他要一封只有三个词的电报'}
facts:
  departure:
    date: '1904-06-03'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [chekhov_wiki, chekhov_complete_letters_1904]
    text:
      en: 'By May 1904 Chekhov was gravely ill with tuberculosis; he had lost much weight in Moscow and was short of breath. On 3 June he set off with Olga Knipper for Germany, by way of Berlin.'
      zh: '到 1904 年 5 月，契诃夫的肺结核已经很重，在莫斯科瘦了一大圈，喘不上气。6 月 3 日，他和奥尔加·克尼佩尔动身去德国，途经柏林。'
    note: 'An illness: written as a plain fact.'
    line:
      en: '3 June 1904: Chekhov, gravely ill, leaves Moscow with Olga Knipper for a German spa.'
      zh: '1904 年 6 月 3 日，病重的契诃夫和奥尔加·克尼佩尔离开莫斯科，去德国疗养。'
  romerbad:
    date: '1904-06-23'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [chekhov_complete_letters_1904]
    text:
      en: 'On 23 June 1904 Olga Knipper wrote from the Hotel Römerbad in Badenweiler that they were both very tired from the journey and had not yet decided whether to live in the hotel or in a private lodging. Chekhov added that the local doctor, Schwörer, was a good doctor and a decent man.'
      zh: '1904 年 6 月 23 日，奥尔加·克尼佩尔从巴登魏勒的罗马浴旅馆写信说，两人路上都累坏了，还没定下住旅馆还是租私人房子。契诃夫在信末添了一句，说当地的施韦勒医生是个好医生，人也正派。'
    line:
      en: '23 June 1904: Chekhov and Olga Knipper are at the Hotel Römerbad in Badenweiler, still tired from the road.'
      zh: '1904 年 6 月 23 日，契诃夫和奥尔加·克尼佩尔住在巴登魏勒的罗马浴旅馆，路上的疲乏还没缓过来。'
  letter:
    date: '1904-06-25'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [chekhov_complete_letters_1904, chekhov_badenweiler_letter]
    text:
      en: 'On 25 June 1904, 12 June in the Russian calendar, Chekhov wrote to his sister Maria that this was his third day in the Villa Friederike, and gave her the full address. The villa stood alone in a lush garden, in sun until seven in the evening; they had a sunny room with a writing table for fourteen or sixteen marks a day. He thought they might come home to Yalta by sea, through Trieste.'
      zh: '1904 年 6 月 25 日，俄历 6 月 12 日，契诃夫写信告诉妹妹玛丽娅，他住进弗里德里克别墅已经第三天，附上详细地址。别墅独自立在一座繁茂的小花园里，太阳一直照到晚上七点；两人每天十四到十六马克，住一间满是阳光、带写字桌的屋子。他想回雅尔塔时也许走海路，经过的里雅斯特。'
    line:
      en: '25 June 1904: from the Villa Friederike, Chekhov sends Maria his new address and writes of the sunny garden.'
      zh: '1904 年 6 月 25 日，契诃夫从弗里德里克别墅给玛丽娅寄去新地址，信里写到晒得到太阳的花园。'
  sommer:
    date: '1904-07-05'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [chekhov_complete_letters_1904]
    text:
      en: 'By 5 July 1904 they had moved to the Hotel Sommer. Chekhov wrote to Maria on a postcard that it was good there, the Villa Friederike had been too dull, and the post office was next door. Olga Knipper later recalled that he liked to sit on the balcony and watch people going in and out of the post office.'
      zh: '到 1904 年 7 月 5 日，他们已搬进索默旅馆。契诃夫在明信片上告诉玛丽娅，这里好，弗里德里克别墅太平庸，邮局就在隔壁。奥尔加·克尼佩尔后来回忆，他爱坐在阳台上看邮局门口进进出出的人。'
    line:
      en: '5 July 1904: Chekhov writes to Maria from the Hotel Sommer; the post office is next door.'
      zh: '1904 年 7 月 5 日，契诃夫从索默旅馆给玛丽娅写信，邮局就在隔壁。'
  steamer:
    date: '1904-07-11'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [chekhov_complete_letters_1904, chekhov_rossolimo_july]
    text:
      en: 'On 11 July 1904, 28 June in the Russian calendar, a sudden heat caught Chekhov with only winter suits, and Olga went to Freiburg to order him one of flannel. That day he wrote to Grigory Rossolimo asking on which day and hour the steamer left Marseille for Odessa, how long it took, and whether he could have a cabin for himself and his wife; and to Maria asking about the steamers from Trieste, with the form of a telegram: Bien. 16. Vendredi.'
      zh: '1904 年 7 月 11 日，俄历 6 月 28 日，突然来了酷暑，契诃夫身边只有冬天的衣服，奥尔加去弗赖堡给他定做一身法兰绒的。这天他写信问格里戈里·罗索利莫，从马赛开往敖德萨的轮船哪天几点开、走几天、能不能给他和妻子一间舱房；又写信请玛丽娅打听的里雅斯特的轮船，连电报的格式都写好了：“Bien. 16. Vendredi.”'
    line:
      en: '11 July 1904: in the heat, Chekhov writes to ask which steamer could take him and Olga home to Russia by sea.'
      zh: '1904 年 7 月 11 日，酷暑里，契诃夫写信打听哪一班轮船能走海路送他和奥尔加回俄国。'
  death:
    date: '1904-07-15'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [chekhov_wiki, chekhov_complete_letters_1904]
    text:
      en: 'Chekhov died of tuberculosis at the Hotel Sommer in Badenweiler in the early hours of 15 July 1904, 2 July in the Russian calendar, aged forty four.'
      zh: '1904 年 7 月 15 日凌晨，俄历 7 月 2 日，契诃夫在巴登魏勒的索默旅馆因肺结核去世，四十四岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '15 July 1904: Anton Chekhov dies in the early hours at Badenweiler, aged forty four.'
      zh: '1904 年 7 月 15 日凌晨，安东·契诃夫在巴登魏勒去世，四十四岁。'
