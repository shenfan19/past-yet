    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"trust","day":8,"req":{"any":[{"job":["courier","driver","rideshare_driver"],"stat":{"will":5}},{"trait":["attached","kind","streetwise"],"stat":{"will":6}}]}}
    text:
      en:
        name: 'A message for his father'
        place: 'Stratford-upon-Avon'
        figure: 'William Shakespeare'
        story: 'The Stratford register records Hamnet Shakespeare’s burial on 11 August 1596. It does not say where his father was before the burial. In this branch a household asks for help getting a message to him.'
        story_prose:
          opening:
            - 'Stratford-upon-Avon, August 1596. The parish register will preserve the boy’s name and the date of his burial. Hamnet is eleven.'
            - 'In history, Hamnet was buried on 11 August. The register gives no date for his father’s return. In this branch the household folds a letter and hopes someone will take it before dark.'
            - 'Someone who knows where travellers stop could help here. So could someone who can persuade a stranger to go a little farther with a letter.'
          points:
            p1: '{staff} asks twice at the door before finding a messenger who knows the next place to stop. The messenger reads the name on the outside and slips it into a dry inside pocket. Hamnet is still awake when William comes home. The boy moves over to make a little room for his father at the edge of the bed.'
          outcomes:
            all: 'William sits there until the window goes dark. When he gets up for water, he moves his chair closer so that he can find it on his way back.'
            p1: 'William sits there until the window goes dark. When he gets up for water, he moves his chair closer so that he can find it on his way back.'
          none: 'Dusk reaches the doorway. The folded letter is still under the cup.'
          not_admitted: '{staff} never gets inside the house where they are waiting. Someone passes the door. It does not open.'
          excerpts:
            p1: 'Hamnet is still awake when William comes home. The boy moves over to make a little room for his father at the edge of the bed.'
        relic: 'A folded message'
        relic_desc: 'An imagined letter with a place for the bearer to add the name of the next person who can help.'
        points:
          p1: 'Find someone who can reach Shakespeare and get the household’s message to him in time for a visit'
        points_fail:
          p1: 'The employee found no one who could promise to deliver the message in time.'
        shift:
          p1:
            was: '11 August 1596: Hamnet Shakespeare was buried in Stratford-upon-Avon. The register does not record whether his father was with him beforehand.'
            now: '{staff} finds a messenger who can reach Shakespeare. In this branch he comes home in time to spend an evening with his son.'
            who: shakespeare_globe
            bio: 'William Shakespeare was able to spend an evening with Hamnet shortly before his son’s death.'
      zh:
        name: '给父亲捎句话'
        place: '斯特拉特福'
        figure: '威廉·莎士比亚'
        story: '斯特拉特福的登记簿记着哈姆内特于 1596 年 8 月 11 日下葬，葬前他的父亲在哪里没有记载。在这条分支里，家里托人给他递信。'
        story_prose:
          opening:
            - '1596 年八月的斯特拉特福。教区的登记簿后来会留下孩子的名字和下葬的日子。哈姆内特十一岁。'
            - '史实里，哈姆内特在 8 月 11 日下葬，登记簿没说父亲何时回家。在这条分支里，家里折好一封信，想托人赶在天黑前带走。'
            - '这趟用得上熟悉路上落脚处的人。能让陌生人答应多走一程，也能帮这封信继续往前。'
          points:
            p1: '{staff}在门口问了两遍，终于找到一位认得下一处落脚地的捎信人。那人读过信外的名字，把信放进干燥的内袋。威廉赶回来时，哈姆内特还醒着。孩子往床里让了让，给父亲在床沿挪出一点地方。'
          outcomes:
            all: '威廉坐到窗外全黑。起身取水时，他把椅子挪得离床更近，免得回来时找不着。'
            p1: '威廉坐到窗外全黑。起身取水时，他把椅子挪得离床更近，免得回来时找不着。'
          none: '暮色到了门口，折过的信还压在杯子底下。'
          not_admitted: '{staff}没能进到等信的那户人家。门口有人走过，屋里没有开门。'
          excerpts:
            p1: '威廉赶回来时，哈姆内特还醒着。孩子往床里让了让，给父亲在床沿挪出一点地方。'
        relic: '折起来的一封信'
        relic_desc: '分支里的信，折角留给捎信人记下一位可以托付的人。'
        points:
          p1: '找到能联系莎士比亚的人，把家里那封信及时送到，让父子见一面'
        points_fail:
          p1: '员工没找到能及时把信送到的人。'
        shift:
          p1:
            was: '1596 年 8 月 11 日，哈姆内特·莎士比亚在斯特拉特福下葬，登记簿没记父亲葬前是否在场。'
            now: '{staff}找到能联系莎士比亚的捎信人。这一回，他赶回家，和儿子度过了一个晚上。'
            who: shakespeare_globe
            bio: '莎士比亚在哈姆内特去世前陪了儿子一晚。'
text:
  en:
    name: William Shakespeare
    text: English playwright and poet, 1564 to 1616. He wrote about thirty seven plays, among them Hamlet and Macbeth, for companies that performed at the Globe Theatre in London, which opened in 1599, and also wrote sonnets.
  zh:
    name: 威廉·莎士比亚
    text: 英国剧作家与诗人，1564 年生，1616 年去世。他为在伦敦环球剧院演出的剧团写了约三十七部戏，包括《哈姆雷特》和《麦克白》，环球剧院于 1599 年开张，他也写十四行诗。
hook: {en: 'A message for his father', zh: '给父亲捎句话'}
