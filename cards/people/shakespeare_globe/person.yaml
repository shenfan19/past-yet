quotes:
  shakespeare_globe_echo_full:
    order: 1
    tier: full
    date: '1609'
    checked: official_record
    sources: [shakespeare_globe_echo_source_full]
    original: en
    text:
      en:
        who: 'William Shakespeare'
        quote: 'But if the while I think on thee, dear friend,'
        occasion: 'Sonnet 30, where the thought of a friend interrupts the speaker’s recollection of losses.'
      zh:
        who: '威廉·莎士比亚'
        quote: '但若此刻我想起你，亲爱的朋友，'
        occasion: '《十四行诗》第 30 首，诗中人想起友人，一时止住了追忆。'
      zh-Hant:
        who: '威廉·莎士比亞'
        quote: '但若此刻我想起你，親愛的朋友，'
        occasion: '《十四行詩》第 30 首，詩中人想起友人，一時止住了追憶。'
      fr:
        who: 'William Shakespeare'
        quote: 'Mais si pendant que je pense à toi, cher ami,'
        occasion: 'Sonnet 30, où la pensée d’un ami interrompt le souvenir des pertes de l’orateur.'
      es:
        who: 'William Shakespeare'
        quote: 'Pero si mientras pienso en ti, querido amigo,'
        occasion: 'Soneto 30, donde el pensamiento de un amigo interrumpe el recuerdo de las pérdidas del hablante.'
      ja:
        who: 'ウィリアム・シェイクスピア'
        quote: 'でももし私があなたのことを考えている間、親愛なる友人よ、'
        occasion: 'ソネット 30 では、友人のことを考えて、話者の喪失の思い出が中断されます。'
      ko:
        who: '윌리엄 셰익스피어'
        quote: '하지만 사랑하는 친구야, 내가 너를 생각하는 동안,'
        occasion: '친구에 대한 생각이 화자의 상실 기억을 방해하는 소네트 30.'
      ru:
        who: 'Уильям Шекспир'
        quote: 'Но если пока я думаю о тебе, дорогой друг,'
        occasion: 'Сонет 30, где мысль о друге прерывает воспоминания говорящего о потерях.'
  shakespeare_globe_echo_none:
    order: 2
    tier: none
    date: '1623'
    checked: official_record
    sources: [shakespeare_globe_echo_source_none]
    original: en
    text:
      en:
        who: 'William Shakespeare'
        quote: 'Grief fills the room up of my absent child,'
        occasion: 'Constance in King John, Act 3, scene 4. Dialogue from a play.'
      zh:
        who: '威廉·莎士比亚'
        quote: '悲伤填满了孩子不在的房间，'
        occasion: '《约翰王》第三幕第四场，康斯坦丝的台词。'
      zh-Hant:
        who: '威廉·莎士比亞'
        quote: '悲傷填滿了孩子不在的房間，'
        occasion: '《約翰王》第三幕第四場，康斯坦絲的臺詞。'
      fr:
        who: 'William Shakespeare'
        quote: 'Le chagrin remplit la chambre de mon enfant absent,'
        occasion: 'Constance dans Le Roi Jean, acte 3, scène 4. Dialogue d''une pièce de théâtre.'
      es:
        who: 'William Shakespeare'
        quote: 'El dolor llena la habitación de mi hijo ausente,'
        occasion: 'Constanza en El rey Juan, acto 3, escena 4. Diálogo de una obra de teatro.'
      ja:
        who: 'ウィリアム・シェイクスピア'
        quote: 'いない我が子の部屋は悲しみで満たされ、'
        occasion: '『ジョン王』のコンスタンス、第 3 幕、第 4 場。劇の会話。'
      ko:
        who: '윌리엄 셰익스피어'
        quote: '슬픔이 나의 부재한 아이의 방을 가득 채우고,'
        occasion: '존 왕의 콘스탄스 3막 4장. 연극의 대화.'
      ru:
        who: 'Уильям Шекспир'
        quote: 'Горе наполняет комнату моего отсутствующего ребенка,'
        occasion: 'Констанция в «Короле Иоанне», действие 3, сцена 4. Диалог из пьесы.'
