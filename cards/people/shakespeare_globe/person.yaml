    line:
      en: '11 August 1596: Hamnet Shakespeare was buried in Stratford-upon-Avon. The register does not record whether his father was with him beforehand.'
      zh: '1596 年 8 月 11 日，哈姆内特·莎士比亚在斯特拉特福下葬，登记簿没记父亲葬前是否在场。'
      zh-Hant: '1596 年 8 月 11 日，哈姆內特·莎士比亞在斯特拉特福下葬，登記簿沒記父親葬前是否在場。'
      fr: '11 août 1596 : Hamnet Shakespeare est enterré à Stratford-upon-Avon. Le registre n''indique pas si son père était avec lui auparavant.'
      es: '11 de agosto de 1596: Hamnet Shakespeare es enterrado en Stratford-upon-Avon. En el registro no consta si su padre estuvo con él anteriormente.'
      ja: '1596年8月11日：ハムネット・シェイクスピアはストラトフォード・アポン・エイボンに埋葬された。登録簿には、父親が事前に一緒にいたかどうかは記録されていない。'
      ko: '1596년 8월 11일: 햄넷 셰익스피어가 스트랫퍼드어폰에이번에 묻혔습니다. 기록에는 그의 아버지가 사전에 그와 함께 있었는지 여부가 기록되어 있지 않습니다.'
      ru: '11 августа 1596 года: Хэмнет Шекспир был похоронен в Стратфорде-на-Эйвоне. В реестре не записано, был ли с ним заранее отец.'
  wooden_o:
