    text:
      en:
        name: 'The note from the Fourth Ward'
        place: "Baltimore"
        figure: "Edgar Allan Poe"
        story: 'On October 3, 1849, printer Joseph Walker sent Joseph Snodgrass a note saying that a man identifying himself as Edgar A. Poe was in distress at Ryan’s Fourth Ward polls. Poe died on October 7. The cause remains uncertain.'
        relic: "A walking cane"
        relic_desc: "A plain cane with a worn handle."
        points:
          p1: 'Use the request for help to find someone who can get Poe from the tavern area to the hospital'
          p2: 'Record where he was found, when he reached the hospital, and who brought him on one dated slip'
          p3: 'Send word to the family before there is a diagnosis so Maria Clemm still has time to write back'
        points_fail:
          p1: 'The note goes into the crowd and no one comes in time to bring Poe to the hospital. The branch falls out of sync and the office recalls the employee.'
          p2: 'Later recollections disagree about the time and date, with no contemporaneous admission record to check.'
          p3: 'His family still expects him to come home, and Maria has to ask what happened after she reads of his death in the paper.'
        shift:
          p1:
            was: 'On 3 October 1849 Poe was found in need of help. After a note was sent, he was taken to a hospital in Baltimore.'
          p2:
            was: 'In early October 1849 Poe was hospitalized in Baltimore. Later accounts differ on when he was admitted.'
            now: '{staff} asks the receiving clerk and the people who brought him to confirm the time on one slip and records what they know without inferring a cause.'
          p3:
            was: 'Poe died in Baltimore on 7 October 1849. On 9 October Maria Clemm wrote that she had just learned of his death from the newspaper.'
            now: '{staff} sends a brief account of what the hospital knows and provides an address where the family can write back. An answer reaches the hospital before Poe dies.'
            who: poe_baltimore
            bio: 'During Poe''s last days his family knew where he was and got their reply to the hospital.'
        vignettes:
          witness: 'A print-shop helper has heard three reasons for the man''s condition. You ask which one he saw. He can give you a place and one man''s name. On the spare slip you keep those two details. Four days later there will still be people filling in the rest.'
          dispatch: 'The print-shop helper wants to wait for someone who knows Poe. You send him with the address he already has. He comes back able to say the note reached the right door. You keep the route on a scrap. He has nothing to tell you about the days before that afternoon.'
          door: 'You move a stool out of the passage and keep it clear while the helper runs the note. On the way back you jot down the two doors you can vouch for. The missing days stay outside the report.'
      zh:
        name: '第四选区的一张求助条'
        place: "巴尔的摩"
        figure: "埃德加·爱伦·坡"
        story: '1849 年 10 月 3 日，印刷工约瑟夫·沃克给约瑟夫·斯诺德格拉斯送了张条子，说瑞安那处第四选区投票点有个自称埃德加·爱伦·坡的人，处境不妙。坡在 10 月 7 日去世，死因未有定论。帮工和你的差事属于分支演绎。'
        relic: "一根手杖"
        relic_desc: "一根朴素的手杖，握柄已被磨旧。"
        points:
          p1: '凭求助条尽快找到能接应的人，护住坡从酒馆附近到医院的那段路'
          p2: '在送院时把发现地点、送达时刻和经手人记在同一张单上'
          p3: '让通知亲属的信在诊断未明时就发出去，给玛丽亚·克莱姆一次及早回信的机会'
        points_fail:
          p1: '求助递进人群里就断了，没有人赶到接他进医院。行程同步失败，员工被召回。'
          p2: '事后几个回忆说法的日期和时刻合不起来，没有同一份当日记录可以核对。'
          p3: '家里继续等他自行回来，玛丽亚只能在报上读到噩耗后再打听他出了什么事。'
        shift:
          p1:
            was: '1849 年 10 月 3 日，有人发现坡急需帮助，写条求援后，坡被送到巴尔的摩的医院。'
          p2:
            was: '1849 年 10 月上旬坡在巴尔的摩住院，此后回忆对送达的日期与时刻有出入。'
            now: '{staff}请接诊方和送来的人在同一张纸上各自确认时间，只记经过，不推断发病原因。'
          p3:
            was: '1849 年 10 月 7 日坡在巴尔的摩去世，10 月 9 日玛丽亚·克莱姆写信说刚从报上得知。'
            now: '{staff}先按院方能确认的情况代发短讯，再留地址让家人直接问到病房。坡去世前已有亲属的回函送到。'
            who: poe_baltimore
            bio: '坡在巴尔的摩最后几天，家里及时知道他在哪里，并把回函送到了医院。'
        vignettes:
          witness: '印刷铺帮工听了三种说法。你问他哪一种是亲眼见的。他能说准一个地点、一个人名。你在备用纸条上只留这两项。四天后，仍有人试着把空下的地方填满。'
          dispatch: '印刷铺帮工想等个认识坡的人来。你请他先按已有的地址跑一趟。他回来时，能说清纸条已经送对了门。你把路记在纸角。至于那天下午以前发生过什么，他也说不上来。'
          door: '帮工去送纸条时，你把挡道的凳子搬开，在原处留出一条通道。回来的路上，你记下自己能确认的两扇门。此前那几天的空白，仍留在报告外。'
text:
  en:
    name: Edgar Allan Poe
    text: American writer, 1809 to 1849. He wrote tales of horror and detection, including The Raven and The Murders in the Rue Morgue, and was found disoriented in Baltimore days before he died. The cause of his death is unknown.
  zh:
    name: 埃德加·爱伦·坡
    text: 美国作家，1809 年生，1849 年去世。他写恐怖和推理故事，有《乌鸦》和《莫格街凶杀案》。他去世前几天被人发现在巴尔的摩神志不清，死因不明。
