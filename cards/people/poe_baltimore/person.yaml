          p2: '家里继续等他自己回来，玛丽亚·克莱姆是从报上读到噩耗的。'
          p3: '他照史实在 10 月 7 日死在医院里，这条分支里也没能留住他。'
        shift:
          p1:
            was: '1849 年 10 月 3 日，有人在巴尔的摩的一处投票点发现坡急需帮助，写条求援后，他被送进华盛顿学院医院。'
          p2:
            was: '1849 年 10 月 9 日，玛丽亚·克莱姆写信给尼尔森·坡，说刚从报上得知他的死讯。'
            now: '{staff}把院方知道的情况和回信地址寄给了她。她的回信在他还在病房时送到了。'
          p3:
            was: '1849 年 10 月 7 日，坡在巴尔的摩的华盛顿学院医院去世，四十岁，死因至今不明。'
            now: '{staff}守着他熬过了最难的几夜，他挺了过来。十月底他出了院，往北回纽约的家。'
            who: poe_baltimore
            bio: '这条时间线里，坡挺过了 1849 年 10 月在巴尔的摩医院里的那几天。他回到纽约，又写了、编了几年。'
        vignettes:
          wharf: '9 月 28 日，{staff}在码头上等里士满来的汽船靠岸，河面上一股煤烟和咸鱼的味道。一个背着三只箱子的脚夫说，诺福克的船运病人，里士满的船运诗人，哪一种给的小费更少，他说不准。'
          ballot: '10 月 2 日，{staff}看几个人在隆巴德街一家酒馆门外钉木牌，街上的泥还没干。酒馆老板说明天楼上每间屋都租给了选区，啤酒由候选人请；他早学会了数酒桶，不数投票的人。'
          ward: '10 月 4 日夜里，{staff}提一桶清水上到收醉汉的病区，走廊的地板一踩就响。守夜的杂役说，带铁栏那间屋里的先生一口水也不肯碰；他把灯捻得很低，灯一亮，那人就对着墙说话。'
text:
  en:
    name: Edgar Allan Poe
    text: American writer, 1809 to 1849. He wrote tales of horror and detection, including The Raven and The Murders in the Rue Morgue, and was found disoriented in Baltimore days before he died. The cause of his death is unknown.
  zh:
    name: 埃德加·爱伦·坡
    text: 美国作家，1809 年生，1849 年去世。他写恐怖和推理故事，有《乌鸦》和《莫格街凶杀案》。他去世前几天被人发现在巴尔的摩神志不清，死因不明。
hook: {en: 'A note from the polls on election day', zh: '选举日投票点送出的一张条子'}
quotes:
  poe_echo_completion:
    order: 1
    tier: full
    date: '1846-04'
    checked: official_record
    sources: [poe_grahams_composition]
    original: en
    text:
      en:
        who: 'Edgar Allan Poe'
        quote: 'the work proceeded, step by step, to its completion with the precision and rigid consequence of a mathematical problem.'
        occasion: 'on writing The Raven, in The Philosophy of Composition'
      zh:
        who: '埃德加·爱伦·坡'
        quote: '这部作品一步一步走向完成，像一道数学题那样精确严密。'
        occasion: '《创作哲学》中谈《乌鸦》的写作（游戏译文）'
      zh-Hant:
        who: '埃德加·愛倫·坡'
        quote: '這部作品一步一步走向完成，像一道數學題那樣精確嚴密。'
        occasion: '《創作哲學》中談《烏鴉》的寫作（遊戲譯文）'
      fr:
        who: 'Edgar Allan Poe'
        quote: 'le travail s''est déroulé, étape par étape, jusqu''à son achèvement avec la précision et la conséquence rigide d''un problème mathématique.'
        occasion: 'sur l''écriture de The Raven, dans The Philosophy of Composition'
      es:
        who: 'Edgar Allan Poe'
        quote: 'el trabajo avanzó, paso a paso, hasta su finalización con la precisión y la consecuencia rígida de un problema matemático.'
        occasion: 'sobre la escritura de El cuervo, en La filosofía de la composición'
      ja:
        who: 'エドガー・アラン・ポー'
        quote: '仕事は段階的に進み、数学的問題の正確さと厳密な結果を伴って完成に達しました。'
        occasion: '『The Raven』の執筆について、『作曲の哲学』より'
      ko:
        who: '에드거 앨런 포'
        quote: '작업은 수학적 문제의 정확성과 엄격한 결과를 바탕으로 한 단계씩 진행되어 완성되었습니다.'
        occasion: '작곡의 철학에서 까마귀(The Raven) 집필에 관하여'
      ru:
        who: 'Эдгар Аллан По'
        quote: 'работа продвигалась шаг за шагом к своему завершению с точностью и жестким следствием математической задачи.'
        occasion: 'о написании «Ворона» в «Философии композиции».'
  poe_echo_mother:
    order: 2
    tier: none
    date: '1849'
    checked: official_record
    sources: [poe_museum_mother]
    original: en
    text:
      en:
        who: 'Edgar Allan Poe'
        quote: 'Are mother to the one I loved so dearly,'
        occasion: 'from To My Mother, the sonnet for Maria Clemm'
      zh:
        who: '埃德加·爱伦·坡'
        quote: '您是我深爱之人的母亲，'
        occasion: '写给玛丽亚·克莱姆的十四行诗《致我的母亲》（游戏译文）'
      zh-Hant:
        who: '埃德加·愛倫·坡'
        quote: '您是我深愛之人的母親，'
        occasion: '寫給瑪麗亞·克萊姆的十四行詩《致我的母親》（遊戲譯文）'
      fr:
        who: 'Edgar Allan Poe'
        quote: 'Sont la mère de celle que j''aimais tant,'
        occasion: 'de À ma mère, le sonnet de Maria Clemm'
      es:
        who: 'Edgar Allan Poe'
        quote: '¿Eres madre de quien amé tanto?'
        occasion: 'de A mi madre, el soneto de Maria Clemm'
      ja:
        who: 'エドガー・アラン・ポー'
        quote: '私がとても愛した人の母親ですか、'
        occasion: 'マリア・クレムのソネット『母へ』より'
      ko:
        who: '에드거 앨런 포'
        quote: '내가 그토록 사랑했던 사람의 어머니이신가요?'
        occasion: '마리아 클렘의 소네트, 나의 어머니에게(To My Mother) 중에서'
      ru:
        who: 'Эдгар Аллан По'
        quote: 'Я мать того, кого я так любил,'
        occasion: 'из сонета «Моей матери» Марии Клемм'
facts:
  leaves_richmond:
    date: '1849-09-27'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [poe_baltimore_chronology, poe_baltimore_death]
    text:
      en: 'Poe had spent the summer of 1849 in Richmond, lecturing to raise money for a magazine. On 27 September he left, perhaps on the steamer Pocahontas, for his home in New York, and he reached Baltimore on 28 September. No reliable record places him between his arrival and 3 October.'
      zh: '1849 年夏天，坡在里士满讲演，为办杂志筹钱。9 月 27 日他动身，也许坐的是汽船波卡洪塔斯号，要回纽约的家，28 日到了巴尔的摩。此后直到 10 月 3 日，他的行踪没有可靠记载。'
    line:
      en: '27 September 1849: Poe leaves Richmond for New York; he reaches Baltimore the next day.'
      zh: '1849 年 9 月 27 日，坡离开里士满回纽约，第二天到巴尔的摩。'
      zh-Hant: '1849 年 9 月 27 日，坡離開里士滿回紐約，第二天到巴爾的摩。'
      fr: '27 septembre 1849 : Poe quitte Richmond pour New York ; il atteint Baltimore le lendemain.'
      es: '27 de septiembre de 1849: Poe deja Richmond hacia Nueva York; llega a Baltimore al día siguiente.'
      ja: '1849年9月27日：ポーはリッチモンドを離れてニューヨークへ向かう。彼は翌日ボルチモアに到着します。'
      ko: '1849년 9월 27일: 포는 리치먼드를 떠나 뉴욕으로 향했습니다. 그는 다음날 볼티모어에 도착합니다.'
      ru: '27 сентября 1849 года: По уезжает из Ричмонда в Нью-Йорк; на следующий день он прибывает в Балтимор.'
  walker:
    date: '1849-10-03'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poe_baltimore_walker, poe_death_society, poe_baltimore_death]
    text:
      en: 'On 3 October 1849, an election day, the printer Joseph W. Walker found Poe in great distress at Ryan''s Fourth Ward polls, also known as Gunner''s Hall, and sent a note asking Dr Joseph E. Snodgrass to come. Snodgrass and Poe''s uncle Henry Herring took him by carriage to Washington College Hospital, where he was put in a room kept for patients brought in drunk.'
      zh: '1849 年 10 月 3 日是选举日，印刷工约瑟夫·沃克在瑞安那处第四选区投票点，又叫炮手厅，发现坡处境很糟，写条子请约瑟夫·斯诺德格拉斯医生来。斯诺德格拉斯和坡的姨父亨利·赫林叫了马车，把他送进华盛顿学院医院，安置在收醉汉的病房。'
    note: 'An illness: written as a plain fact.'
    line:
      en: '3 October 1849: Poe is found in distress at the Fourth Ward polls; after a note is sent, he is taken to Washington College Hospital.'
      zh: '1849 年 10 月 3 日，坡在第四选区投票点被人发现处境很糟，有人写条求援，他被送进华盛顿学院医院。'
      zh-Hant: '1849 年 10 月 3 日，坡在第四選區投票點被人發現處境很糟，有人寫條求援，他被送進華盛頓學院醫院。'
      fr: '3 octobre 1849 : Poe est retrouvé en détresse lors des élections du quatrième arrondissement ; après l''envoi d''une note, il est emmené au Washington College Hospital.'
      es: '3 de octubre de 1849: Poe es encontrado angustiado en las urnas del Cuarto Distrito; Después de enviar una nota, lo llevan al Washington College Hospital.'
      ja: '1849年10月3日：ポーが第4区の投票所で苦しんでいるのが発見される。メモが送られた後、彼はワシントン大学病院に運ばれた。'
      ko: '1849년 10월 3일: 포는 4와드 투표소에서 조난당한 채 발견되었습니다. 메모를 보낸 후 그는 워싱턴 대학 병원으로 이송됩니다.'
      ru: '3 октября 1849 года: По найден в беде на избирательных участках в Четвертом округе; после отправки записки его доставляют в больницу Вашингтонского колледжа.'
  ward:
    date: '1849-10-04'
    checked: two_sources
    level: careful
    use: [story, wiki]
    sources: [poe_baltimore_death, poe_death_society]
    text:
      en: 'In the hospital Poe drifted in and out of consciousness for several days. Dr John J. Moran, who looked after him, could get no coherent answer about what had happened, and kept visitors away because he was so excitable.'
      zh: '在医院里，坡一连几天时醒时昏。照看他的约翰·莫兰医生问他出了什么事，得不到说得通的回答，又因为他太激动，不让人探视。'
    note: 'An illness: written as a plain fact.'
  death:
    date: '1849-10-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poe_baltimore_death, poe_death_society, poe_baltimore_chronology]
    text:
      en: 'Poe died at Washington College Hospital before dawn on Sunday 7 October 1849, aged forty, at about three or five in the morning by different accounts. The cause of his death has never been settled.'
      zh: '1849 年 10 月 7 日星期天天亮前，坡在华盛顿学院医院去世，四十岁，各家记的时刻有凌晨三点、五点两说。死因始终没有定论。'
    note: 'A death: written as a plain fact.'
    line:
      en: '7 October 1849: Edgar Allan Poe dies before dawn at Washington College Hospital, aged forty.'
      zh: '1849 年 10 月 7 日天亮前，埃德加·爱伦·坡在华盛顿学院医院去世，四十岁。'
      zh-Hant: '1849 年 10 月 7 日天亮前，埃德加·愛倫·坡在華盛頓學院醫院去世，四十歲。'
      fr: '7 octobre 1849 : Edgar Allan Poe décède avant l''aube au Washington College Hospital, à l''âge de quarante ans.'
      es: '7 de octubre de 1849: Edgar Allan Poe muere antes del amanecer en el Washington College Hospital, a los cuarenta años.'
      ja: '1849年10月7日：エドガー・アラン・ポーが夜明け前にワシントン大学病院で40歳で死去。'
      ko: '1849년 10월 7일: 에드가 앨런 포(에드거 앨런 포)가 새벽이 되기 전에 워싱턴 대학 병원에서 40세의 나이로 사망합니다.'
      ru: '7 октября 1849 года: Эдгар Аллан По умирает перед рассветом в больнице Вашингтонского колледжа в возрасте сорока лет.'
  burial:
    date: '1849-10-08'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poe_death_wiki, poe_baltimore_chronology]
    text:
      en: 'Poe was buried in his grandfather''s lot in the Westminster Burying Ground in Baltimore, on 8 October by most accounts and on the 8th or 9th by the Poe Society chronology. Few people came, and the burial was over in minutes.'
      zh: '坡葬在巴尔的摩威斯敏斯特墓地他祖父的那块地里，多数记载是 10 月 8 日，坡学会的年表写 8 日或 9 日。来的人很少，几分钟就完了。'
    note: 'A death: written as a plain fact.'
    line:
      en: '8 October 1849: Poe is buried in Baltimore; only a few people come.'
      zh: '1849 年 10 月 8 日，坡葬于巴尔的摩，来送的人寥寥无几。'
      zh-Hant: '1849 年 10 月 8 日，坡葬於巴爾的摩，來送的人寥寥無幾。'
      fr: '8 octobre 1849 : Poe est enterré à Baltimore ; seules quelques personnes viennent.'
      es: '8 de octubre de 1849: Poe es enterrado en Baltimore; Sólo vienen unas pocas personas.'
      ja: '1849年10月8日：ポーはボルチモアに埋葬される。ほんの数人しか来ません。'
      ko: '1849년 10월 8일: 포가 볼티모어에 묻혔습니다. 소수의 사람들만 옵니다.'
      ru: '8 октября 1849 года: По похоронен в Балтиморе; приходит всего несколько человек.'
  ludwig:
    date: '1849-10-09'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [poe_baltimore_chronology, poe_death_wiki]
    stay_day: 19.2
    text:
      en: 'On 9 October 1849 the New York Tribune printed an obituary of Poe signed Ludwig, written by Rufus Wilmot Griswold, which set his gifts against a cruel portrait of his character. It was widely copied, and for decades it shaped how Poe was remembered.'
      zh: '1849 年 10 月 9 日，《纽约论坛报》登出一篇署名路德维希的坡的讣告，执笔的是鲁弗斯·格里斯沃尔德，一边称道他的才华，一边把他的为人写得很不堪。这篇讣告被各报转载，几十年里左右着人们对坡的印象。'
    line:
      en: '9 October 1849: an obituary of Poe signed Ludwig appears in the New York Tribune and is copied far and wide.'
      zh: '1849 年 10 月 9 日，《纽约论坛报》登出署名路德维希的坡的讣告，各报纷纷转载。'
      zh-Hant: '1849 年 10 月 9 日，《紐約論壇報》登出署名路德維希的坡的訃告，各報紛紛轉載。'
      fr: '9 octobre 1849 : une nécrologie de Poe signée Ludwig paraît dans le New York Tribune et est largement copiée.'
      es: '9 de octubre de 1849: un obituario de Poe firmado por Ludwig aparece en el New York Tribune y se copia por todas partes.'
      ja: '1849年10月9日：ルートヴィヒ署名入りのポーの死亡記事がニューヨーク・トリビューンに掲載され、広くコピーされた。'
      ko: '1849년 10월 9일: 포가 서명한 루트비히의 사망 기사가 뉴욕 트리뷴에 실렸고 널리 복사되었습니다.'
      ru: '9 октября 1849 года: некролог По, подписанный Людвигом, появляется в газете New York Tribune и копируется повсюду.'
  clemm_letter:
    date: '1849-10-09'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poe_clemm_october_letter, poe_death_wiki]
    stay_day: 19.4
    text:
      en: 'On 9 October 1849, at Fordham, Maria Clemm wrote to Neilson Poe that she had that moment heard of the death of her son Edgar, that the paper said he had died in Baltimore, and asked him to write at once and conceal nothing.'
      zh: '1849 年 10 月 9 日，玛丽亚·克莱姆在福德姆写信给尼尔森·坡，说她刚刚听到儿子埃德加的死讯，报上说他死在巴尔的摩，请他一收到信就回信，什么都不要瞒她。'
    note: 'A death: written as a plain fact.'
    line:
      en: '9 October 1849: at Fordham, Maria Clemm learns of Poe''s death from the newspaper and writes to Baltimore to ask.'
      zh: '1849 年 10 月 9 日，玛丽亚·克莱姆在福德姆从报上得知坡的死讯，写信去巴尔的摩打听。'
      zh-Hant: '1849 年 10 月 9 日，瑪麗亞·克萊姆在福德姆從報上得知坡的死訊，寫信去巴爾的摩打聽。'
      fr: '9 octobre 1849 : à Fordham, Maria Clemm apprend par le journal la mort de Poe et écrit à Baltimore pour s''enquérir.'
      es: '9 de octubre de 1849: en Fordham, María Clemm se entera por el periódico de la muerte de Poe y escribe a Baltimore para preguntar.'
      ja: '1849年10月9日：フォーダムで、マリア・クレムは新聞でポーの死を知り、ボルチモアに手紙を書いて尋ねる。'
      ko: '1849년 10월 9일: 포드햄에서 마리아 클렘은 신문을 통해 포의 사망 소식을 접하고 볼티모어에 편지를 보내 질문을 했습니다.'
      ru: '9 октября 1849 года: в Фордхэме Мария Клемм узнает из газеты о смерти По и пишет в Балтимор с вопросом.'
  moran_letter:
    date: '1849-11'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poe_death_society, poe_death_wiki]
    text:
      en: 'Dr Moran wrote to Maria Clemm about Poe''s last days only after she asked him in November 1849; his letter is dated 15 November, more than a month after the death.'
      zh: '莫兰医生是在玛丽亚·克莱姆 1849 年 11 月来信询问之后，才写信告诉她坡最后几天的情形，信写于 11 月 15 日，离坡去世已一个多月。'
    note: 'A death: written as a plain fact.'
    line:
      en: 'November 1849: more than a month after the death, Dr Moran writes to Maria Clemm about Poe''s last days.'
      zh: '1849 年 11 月，坡去世一个多月后，莫兰医生才写信告诉玛丽亚·克莱姆他最后几天的情形。'
      zh-Hant: '1849 年 11 月，坡去世一個多月後，莫蘭醫生才寫信告訴瑪麗亞·克萊姆他最後幾天的情形。'
      fr: "Novembre 1849\_: plus d'un mois après le décès, le Dr Moran écrit à Maria Clemm au sujet des derniers jours de Poe."
      es: 'Noviembre de 1849: más de un mes después de la muerte, el Dr. Moran le escribe a Maria Clemm sobre los últimos días de Poe.'
      ja: '1849 年 11 月: 死後 1 か月以上が経過し、モラン博士はマリア クレムにポーの最期について手紙を書きます。'
      ko: '1849년 11월: 사망한 지 한 달 이상이 지난 후, 모란 박사는 포의 마지막 날들에 대해 마리아 클렘에게 편지를 씁니다.'
      ru: 'Ноябрь 1849 года: более чем через месяц после смерти доктор Моран пишет Марии Клемм о последних днях По.'
bystanders:
  porter:
    invented: true
    text: {en: 'A porter on the Baltimore wharf, made up for the game.', zh: '一个编出来的巴尔的摩码头脚夫。'}
  tavern_keeper:
    invented: true
    text: {en: 'A tavern keeper on Lombard Street, made up for the game.', zh: '一个编出来的隆巴德街酒馆老板。'}
  night_porter:
    invented: true
    text: {en: 'The night porter of the hospital ward, made up for the game.', zh: '一个编出来的医院病区守夜杂役。'}
wiki:
  refs:
    poe_grahams_composition:
      order: 857
      status: checked
