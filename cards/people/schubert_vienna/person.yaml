    text:
      en:
        name: 'The March programme'
        place: "Vienna"
        figure: "Franz Schubert"
        story: 'On 26 March 1828, for the only time in his life, Franz Schubert gave a public concert of his own works, in the rooms of the Gesellschaft der Musikfreunde in Vienna. In the autumn, already ill, he moved into the new flat of his brother Ferdinand in Wieden. On 2 October he offered his last three piano sonatas to the publisher Probst. He died in that flat on 19 November, aged thirty one. The sonatas came out only in 1839, with another dedication.'
        story_prose:
          opening:
            - 'Vienna, March 1828. The composer Franz Schubert, thirty one, has written more than six hundred songs, besides symphonies and chamber music, and little of it has been published or widely played. This month, with friends and performers helping, he is to give a concert of nothing but his own works in the rooms of the Gesellschaft der Musikfreunde, on 26 March.'
            - 'In history, it was the only concert of his own he ever gave. By the autumn he was ill, and in September he moved into his brother Ferdinand''s new flat in Wieden; on 2 October he wrote to the Leipzig publisher Probst offering his last three piano sonatas, which he meant to dedicate to a composer he admired, and Probst was not interested in them; on 19 November he died at his brother''s. The sonatas came out only in 1839, dedicated to Robert Schumann. In this branch, the society has a porter who sets out the chairs, a wine garden outside the walls has a fiddler, and the new house in Wieden has a landlady.'
            - 'A few kinds of people can help on this trip: someone who knows music and has steady hands, or someone methodical or able to rally people, with a strong will, to get the hastily gathered players and the hall onto the same evening; a very fine musician, or someone who has kept archives, translated or sold books, quick and steady, to settle the sending of the sonatas with the publisher; someone carrying the nano medical kit, to cure a disease the age could not.'
          outcomes:
            all: 'That November Schubert did not fall ill. The answer from Leipzig came, and he kept it inside the manuscripts of the three sonatas, whose first page bore the name of the man he meant them for.'
            p3: 'That November Schubert did not fall ill. Once winter came, a small table for writing music stood under the window of the room in Wieden, a pile of fresh manuscript paper weighed down at its corner.'
            p2: 'On 19 November Schubert died at his brother''s, aged thirty one. Clearing the room, Ferdinand took a letter from Leipzig out of the drawer and laid it with the manuscripts of the three sonatas.'
            p1: 'On 19 November Schubert died at his brother''s, aged thirty one. The invitation to the evening of 26 March was later printed in a friend''s memoirs.'
          none: 'On 19 November Schubert died at his brother''s flat in Wieden, aged thirty one. Ferdinand kept the manuscripts of the three sonatas, and they were not printed for eleven years.'
          desync: 'On the evening of 25 March the players and the free hall still had different days, and the porter turned the pages of the register without finding whose name belonged against the 26th. When {staff} was recalled, the porter was stacking the chairs he had set out back against the wall.'
          not_admitted: '{staff} never got in among that circle of friends, and only sat a few evenings in a wine garden outside the walls. Once someone at the next table began to hum a song, said it was by a man called Schubert, and lost the words halfway through.'
          points:
            p1:
              trait_methodical: 'On 25 March there is one day left before the concert. The society''s hall is free on the evening of the 26th, but one of the players who promised to help has the wrong day in his head. {staff}, methodical, makes a list, knocks at each player''s door in turn, checks the day and the hour with every one of them and has them sign the list, then goes back to the society and asks the porter to write Schubert''s name against that evening in the register. Before dark Schubert comes to look at the hall. He stands a while among the rows of empty chairs, then reaches out and straightens a chair in the front row that had been set crooked.'
              trait_charismatic: 'On 25 March there is one day left before the concert. The society''s hall is free on the evening of the 26th, but one of the players who promised to help has the wrong day in his head. {staff}, persuasive, goes round to each of the players and talks the one with the wrong day back onto the evening of the 26th, then goes back to the society and asks the porter to write Schubert''s name against that evening in the register. Before dark Schubert comes to look at the hall. He stands a while among the rows of empty chairs, then reaches out and straightens a chair in the front row that had been set crooked.'
              else: 'On 25 March there is one day left before the concert. The society''s hall is free on the evening of the 26th, but one of the players who promised to help has the wrong day in his head. {staff}, who knows music, spreads the parts out on the porter''s table, goes over the programme and the hour with each player, and asks the porter to write Schubert''s name against the evening of the 26th in the register. Before dark Schubert comes to look at the hall. He stands a while among the rows of empty chairs, then reaches out and straightens a chair in the front row that had been set crooked.'
            p3:
              class_medical: 'At the end of August Schubert''s illness has grown worse again, and he sleeps badly at night. {staff}, who knows medicine, opens the nano medical kit brought along, uses it on him as its instructions say, and after that looks in on him every morning and evening. On moving day, Schubert carries an armful of music up the stairs of the new house in Wieden himself, all the way to the top without stopping. He sets the music down under the window of the new room and pushes the window open.'
              else: 'At the end of August Schubert''s illness has grown worse again, and he sleeps badly at night. {staff}, carrying the nano medical kit, uses it on him step by step as the instructions in the case say, and after that looks in on him every morning and evening. On moving day, Schubert carries an armful of music up the stairs of the new house in Wieden himself, all the way to the top without stopping. He sets the music down under the window of the new room and pushes the window open.'
            p2:
              class_lettered: 'On the evening of 1 October the manuscripts of the three sonatas lie spread on the table at Ferdinand''s, and beside them a letter to the Leipzig publisher Probst, barely begun. {staff}, used to paperwork and to publishers, copies the page count and key of each of the three scores into a list of what is being sent, writes the name of the composer Schubert wants them dedicated to at the head of it, and adds a line to the letter asking the publisher first to send back a confirmation that can be checked. Schubert folds the letter and writes the Leipzig address on the envelope. He lays the list on top of the music and smooths the crease flat with his palm.'
              else: 'On the evening of 1 October the manuscripts of the three sonatas lie spread on the table at Ferdinand''s, and beside them a letter to the Leipzig publisher Probst, barely begun. {staff}, who knows music, puts the three manuscripts in order page by page, checks the page numbers and the repeat signs, copies them into a list of what is being sent, writes the name of the composer Schubert wants them dedicated to at the head of it, and adds a line to the letter asking the publisher first to send back a confirmation that can be checked. Schubert folds the letter and writes the Leipzig address on the envelope. He lays the list on top of the music and smooths the crease flat with his palm.'
          excerpts:
            p3: 'On moving day, Schubert carries an armful of music up the stairs of the new house in Wieden himself, all the way to the top without stopping. He sets the music down under the window of the new room and pushes the window open.'
            p2: 'Schubert folds the letter and writes the Leipzig address on the envelope. He lays the list on top of the music and smooths the crease flat with his palm.'
            p1: 'Before dark Schubert comes to look at the hall. He stands a while among the rows of empty chairs, then reaches out and straightens a chair in the front row that had been set crooked.'
        relic: "A song manuscript"
        relic_desc: "A song in a quick hand with the ink still dark."
        points:
          p1: 'Get the volunteer players and the society''s hall onto the same evening and protect Schubert''s own concert'
          p2: 'Turn the inquiry into an agreement while Schubert can still settle publication and the dedication for his last three sonatas'
          p3: 'Before he moves to his brother Ferdinand''s, cure the illness he has carried for years, so that he lives through that autumn'
        points_fail:
          p1: 'The players and the available hall are booked for different days. The friends'' concert is canceled, and the office recalls the employee after a loss of sync.'
          p2: 'The inquiry is left waiting for a reply. The sonatas appear years after his death with a different dedication.'
          p3: 'As in history, he moves to his brother''s still ill in September, and dies there on 19 November.'
        shift:
          p1:
            was: 'On 26 March 1828 Schubert gave a Vienna concert of his own music with help from friends and performers.'
          p2:
            was: 'On 2 October 1828 Schubert offered his final three sonatas and named his intended dedicatee. They were first published in 1839.'
            now: '{staff} gets all three scores and the dedication sent together and asks for written confirmation. Schubert receives it while he is alive, and the dedication stays with the music.'
          p3:
            was: 'September 1828: Schubert, already ill, moved into his brother Ferdinand''s flat in a new house in Wieden, and died there on 19 November, aged thirty one.'
            now: 'The medicine {staff} brought cured him. He did not fall ill that November, and went on living and writing music in Vienna for years. What he wrote is not in the record of this trip.'
            who: schubert_vienna
            bio: 'In this timeline Schubert was cured in the autumn he was thirty one, lived on for many years and kept composing in Vienna.'
        vignettes:
          chairs: 'On the evening of 25 March {staff} helps the porter of the society set out chairs in the hall, row by row, until the porter runs out of chairs before he runs out of names. He says he has never seen so many people want to sit in one room for a man who is not dead yet.'
          tavern: 'One July evening {staff} sits in a wine garden outside the city walls while a fiddler and a guitar player work through waltzes. The fiddler stops between two of them to say that in this heat the strings go flat by the second verse, and that the only cure is to play faster.'
          stairs: 'Early in September {staff} helps the landlady of a new house in Wieden carry baskets up the stairs. The plaster still smells of lime, and she says the stairwell is so new it answers back: say a word on the ground floor and the third floor hears it twice.'
      zh:
        name: '三月那场音乐会的节目单'
        place: "维也纳"
        figure: "弗朗茨·舒伯特"
        story: '1828 年 3 月 26 日，弗朗茨·舒伯特在维也纳音乐之友协会的会场举行了一场只演自己作品的公开音乐会，这是他一生唯一的一场。那年秋天，他已在病中，搬进哥哥费迪南德在维登的新住处。10 月 2 日，他写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。11 月 19 日，他在那处住所去世，三十一岁。三首奏鸣曲到 1839 年才出版，题献也换了人。'
        story_prose:
          opening:
            - '1828 年 3 月，维也纳。三十一岁的作曲家弗朗茨·舒伯特写了六百多首歌，还有交响曲和室内乐，大部分生前没有出版，也很少公开演出。这个月，靠朋友和演奏者帮忙，他要在音乐之友协会的会场办一场只演自己作品的音乐会，日子定在 3 月 26 日。'
            - '史实里，这是他一生唯一的一场专场音乐会。那年秋天他已在病中，9 月搬进哥哥费迪南德在维登的新住处；10 月 2 日他写信给莱比锡的出版人普罗布斯特，推荐最后三首钢琴奏鸣曲，想题献给一位敬重的作曲家，对方对奏鸣曲没有兴趣；11 月 19 日，他在哥哥家里去世。三首奏鸣曲到 1839 年才出版，题献换成了罗伯特·舒曼。在这条分支里，协会有个摆椅子的门房，城墙外的葡萄酒园里有个拉琴的，维登那幢新房子里有个女房东。'
            - '这一趟用得上几种人：懂音乐、手上稳的人，或者有条理、能张罗、意志够硬的人，把临时凑来的演奏者和会场约到同一晚；琴艺极好的乐手，或者管过档案、做过翻译、卖过书，脑子快又沉得住气的人，替他跟出版人把交稿谈定；带着纳米医疗箱的人，治得了那个时代治不好的病。'
          outcomes:
            all: '那年十一月，舒伯特没有病倒。莱比锡的回信来了，他把它夹在三首奏鸣曲的手稿里，第一页上写着他要题献的那个名字。'
            p3: '那年十一月，舒伯特没有病倒。入冬以后，维登那间屋子的窗下多了一张写谱的小桌，桌角压着一摞新的稿纸。'
            p2: '11 月 19 日，舒伯特在哥哥家里去世，三十一岁。费迪南德收拾屋子时，从抽屉里取出一封莱比锡的回信，和三首奏鸣曲的手稿放在了一起。'
            p1: '11 月 19 日，舒伯特在哥哥家里去世，三十一岁。3 月 26 日那晚的请柬，后来印进了一位朋友的回忆录。'
          none: '11 月 19 日，舒伯特在哥哥维登的家里去世，三十一岁。三首奏鸣曲的手稿由费迪南德收着，过了十一年才印出来。'
          desync: '3 月 25 日晚上，演奏的人和空出的会场还对不上日子，门房翻着登记簿，找不到 26 日那一栏该写谁的名字。{staff}被召回时，门房正把摆好的椅子一把一把叠回墙边。'
          not_admitted: '{staff}没能进那群朋友中间，只在城墙外的葡萄酒园里坐过几个傍晚。有一回，邻桌的人哼起一首歌，说是一个叫舒伯特的人写的，哼到一半忘了词。'
          points:
            p1:
              trait_methodical: '3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}做事有条理，列了一张单子，挨家去敲演奏者的门，把日子和钟点一个个对过，请他们在单子上签了名，又回协会请门房在登记簿上把那一晚写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。'
              trait_charismatic: '3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}会说话，挨家去找那几位演奏者，把记错了日子的那一位也劝回了 26 日晚上，又回协会请门房在登记簿上把那一晚写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。'
              else: '3 月 25 日，离音乐会只剩一天。协会会场空出来的是 26 日晚上，答应来帮忙的演奏者里，却有人记成了别的日子。{staff}懂音乐，把几份分谱摊在门房的桌上，跟每位演奏者把曲目和钟点一一对过，又请门房在登记簿上把 26 日晚上那一栏写上舒伯特的名字。天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。'
            p3:
              class_medical: '8 月底，舒伯特的病又重了，夜里睡不安稳。{staff}懂医护，打开带来的纳米医疗箱，照着说明给他用上，此后每天早晚来看他一回。搬家那天，舒伯特自己抱着一摞谱子走上维登那幢新房子的楼梯，一口气走到楼梯顶上，没有停下来。他把谱子放在新屋的窗台下，推开了窗。'
              else: '8 月底，舒伯特的病又重了，夜里睡不安稳。{staff}带着纳米医疗箱，照着箱里的说明一步步给他用上，此后每天早晚来看他一回。搬家那天，舒伯特自己抱着一摞谱子走上维登那幢新房子的楼梯，一口气走到楼梯顶上，没有停下来。他把谱子放在新屋的窗台下，推开了窗。'
            p2:
              class_lettered: '10 月 1 日晚上，费迪南德家的桌上摊着三首奏鸣曲的手稿，旁边是写给莱比锡出版人普罗布斯特的信，只开了个头。{staff}管过文书，和出版人打过交道，把三份谱的页数和调性抄成一张交稿清单，把舒伯特想题献的那个名字写在清单最上面，又在信末添了一句，请出版方先回一封能核对的确认。舒伯特把信折好，在信封上写下莱比锡的地址。他把那张清单压在谱子最上面，用手掌抚平了折痕。'
              else: '10 月 1 日晚上，费迪南德家的桌上摊着三首奏鸣曲的手稿，旁边是写给莱比锡出版人普罗布斯特的信，只开了个头。{staff}懂音乐，把三份手稿一页页理齐，核过页码和反复记号，抄成一张交稿清单，把舒伯特想题献的那个名字写在清单最上面，又在信末添了一句，请出版方先回一封能核对的确认。舒伯特把信折好，在信封上写下莱比锡的地址。他把那张清单压在谱子最上面，用手掌抚平了折痕。'
          excerpts:
            p3: '搬家那天，舒伯特自己抱着一摞谱子走上维登那幢新房子的楼梯，一口气走到楼梯顶上，没有停下来。他把谱子放在新屋的窗台下，推开了窗。'
            p2: '舒伯特把信折好，在信封上写下莱比锡的地址。他把那张清单压在谱子最上面，用手掌抚平了折痕。'
            p1: '天黑前，舒伯特来会场看了一眼。他在一排排空椅子中间站了一会儿，伸手把第一排歪了的一把椅子摆正。'
