    text:
      en:
        name: 'The March programme'
        place: "Vienna"
        figure: "Franz Schubert"
        story: 'On 26 March 1828, for the only time in his life, Franz Schubert gave a public concert of his own works, in the rooms of the Gesellschaft der Musikfreunde in Vienna. In the autumn, already ill, he moved into the new flat of his brother Ferdinand in Wieden. On 2 October he offered his last three piano sonatas to the publisher Probst. He died in that flat on 19 November, aged thirty one. The sonatas came out only in 1839, with another dedication.'
        relic: "A song manuscript"
        relic_desc: "A song in a quick hand with the ink still dark."
        points:
          p1: 'Get the volunteer players and the society''s hall onto the same evening and protect Schubert''s own concert'
          p2: 'Turn the inquiry into an agreement while Schubert can still settle publication and the dedication for his last three sonatas'
          p3: 'Before he moves to his brother Ferdinand''s, cure the illness he has carried for years, so that he lives through that autumn'
        points_fail:
          p1: 'The players and the available hall are booked for different days. The friends'' concert is canceled, and the office recalls the employee after a loss of sync.'
          p2: 'The inquiry is left waiting for a reply. The sonatas appear years after his death with a different dedication.'
          p3: 'As in history, he moves to his brother''s still ill on 1 September, and dies there on 19 November.'
        shift:
          p1:
            was: 'On 26 March 1828 Schubert gave a Vienna concert of his own music with help from friends and performers.'
          p2:
            was: 'On 2 October 1828 Schubert offered his final three sonatas and named his intended dedicatee. They were first published in 1839.'
            now: '{staff} gets all three scores and the dedication sent together and asks for written confirmation. Schubert receives it while he is alive, and the dedication stays with the music.'
          p3:
            was: '1 September 1828: Schubert, already ill, moved into his brother Ferdinand''s flat in a new house in Wieden, and died there on 19 November, aged thirty one.'
            now: 'The medicine {staff} brought cured him. He did not fall ill that November, and went on living and writing music in Vienna for years. What he wrote is not in the record of this trip.'
            who: schubert_vienna
            bio: 'In this timeline Schubert was cured in the autumn he was thirty one, lived on for many years and kept composing in Vienna.'
        vignettes:
          chairs: 'On the evening of 25 March {staff} helps the porter of the society set out chairs in the hall, row by row, until the porter runs out of chairs before he runs out of names. He says he has never seen so many people want to sit in one room for a man who is not dead yet.'
          tavern: 'One July evening {staff} sits in a wine garden outside the city walls while a fiddler and a guitar player work through waltzes. The fiddler stops between two of them to say that in this heat the strings go flat by the second verse, and that the only cure is to play faster.'
          stairs: 'Early in September {staff} helps the landlady of a new house in Wieden carry baskets up the stairs. The plaster still smells of lime, and she says the stairwell is so new it answers back: say a word on the ground floor and the third floor hears it twice.'
      zh:
        name: '三月那场音乐会的节目单'
        place: "维也纳"
        figure: "弗朗茨·舒伯特"
        story: '1828 年 3 月 26 日，弗朗茨·舒伯特在维也纳音乐之友协会的会场举行了一场只演自己作品的公开音乐会，这是他一生唯一的一场。那年秋天，他已在病中，搬进哥哥费迪南德在维登的新住处。10 月 2 日，他写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。11 月 19 日，他在那处住所去世，三十一岁。三首奏鸣曲到 1839 年才出版，题献也换了人。'
        relic: "一份歌曲手稿"
        relic_desc: "一首运笔很快的歌，墨迹还很深。"
        points:
          p1: '把临时凑到的演奏者和音乐协会的场地约到同一晚，护住舒伯特自己的音乐会'
          p2: '把出版问询变成可交稿的约定，让舒伯特赶得及为最后三首钢琴奏鸣曲定下出版与题献'
          p3: '在他搬去哥哥费迪南德家之前，治好缠了他多年的病，让他熬过那年秋天'
        points_fail:
          p1: '出场的人和空出的场地错了日期，靠朋友帮忙才排成的音乐会取消。行程同步失败，员工被召回。'
          p2: '来信仍停在等回音的阶段，三首奏鸣曲在他去世多年后才出版，题献也换了人。'
          p3: '他照旧带着病在 9 月 1 日搬去哥哥家，11 月 19 日在那里去世，这条分支与历史一样。'
        shift:
          p1:
            was: '1828 年 3 月 26 日，舒伯特获朋友和演奏者协助，在维也纳以自己的作品举办专场音乐会。'
          p2:
            was: '1828 年 10 月 2 日舒伯特致函推荐最后三首奏鸣曲并提出题献意愿，三曲直到 1839 年才刊印。'
            now: '{staff}帮舒伯特把三份谱和题献要求随交稿清单送出，请出版方先回一封能核对的确认。舒伯特生前收到了确认，题献随乐谱保留。'
          p3:
            was: '1828 年 9 月 1 日，病中的舒伯特搬进哥哥费迪南德在维登一幢新房子里的住处，11 月 19 日在那里去世，年三十一岁。'
            now: '{staff}带来的药治好了他的病。那年十一月他没有病倒，此后多年仍在维也纳作曲。写了什么，这一趟的记录里没有。'
            who: schubert_vienna
            bio: '这条时间线里，舒伯特三十一岁那年秋天病好了，又活了许多年，在维也纳继续作曲。'
        vignettes:
          chairs: '3 月 25 日晚上，{staff}帮协会的门房在会场里一排排摆椅子，摆到椅子用完了，名单上的名字还没念完。门房说他还没见过这么多人肯挤进一间屋子，听一个还活着的人的曲子。'
          tavern: '七月的一个傍晚，{staff}坐在城墙外的一处葡萄酒园里，听一个拉琴的和一个弹吉他的一支接一支地奏圆舞曲。拉琴的在两支曲子中间停下来说，这么热的天，唱到第二段弦就松了，唯一的办法是拉快点。'
          stairs: '九月初，{staff}帮维登一幢新房子的女房东把几筐东西搬上楼。墙上的灰泥还有石灰味。她说楼梯间新得会回嘴，在一楼说一句，三楼能听见两遍。'
text:
  en:
    name: Franz Schubert
    text: Austrian composer, 1797 to 1828, born in Vienna. He wrote more than six hundred songs, symphonies and chamber music, little of which was published or performed widely in his lifetime. He died at thirty one.
  zh:
    name: 弗朗茨·舒伯特
    text: 奥地利作曲家，1797 年生，1828 年去世，生于维也纳。他写了六百多首歌曲，以及交响曲和室内乐，大部分在他生前没有出版或广泛演出。他三十一岁去世。
hook: {en: 'The only concert of his own he ever gave', zh: '他一生只开过一场自己的音乐会'}
facts:
  programme:
    date: '1828-03-26'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_vienna_programme, schubert_wiki]
    text:
      en: 'The invitation gives the date as 26 March 1828, the venue as the rooms of the Gesellschaft der Musikfreunde and the works as Schubert’s own. It was the only public concert of his own works that he gave.'
      zh: '请柬写明 1828 年 3 月 26 日在音乐之友协会会场演出，曲目均为舒伯特所作。这是他一生唯一一场只演自己作品的公开音乐会。'
    line:
      en: '26 March 1828: in the rooms of the Gesellschaft der Musikfreunde, Schubert gives a concert of his own works.'
      zh: '1828 年 3 月 26 日，舒伯特在音乐之友协会的会场举行只演自己作品的音乐会。'
  move:
    date: '1828-09'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [schubert_sterbewohnung, schubert_wiki]
    text:
      en: 'In the autumn of 1828, already ill, Schubert moved into the flat of his brother Ferdinand in a new house in Wieden, today Kettenbrückengasse 6, where he died. The flat is now a small museum of the Wien Museum.'
      zh: '1828 年秋，舒伯特已在病中，搬进哥哥费迪南德在维登一幢新房子里的住处，即今天的克滕布吕肯巷 6 号，后来就在那里去世。这处住所现在是维也纳博物馆下属的一间小纪念馆。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Autumn 1828: Schubert, ill, moves into his brother Ferdinand''s new flat in Wieden.'
      zh: '1828 年秋，病中的舒伯特搬进哥哥费迪南德在维登的新住处。'
  probst:
    date: '1828-10-02'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_probst_1828, schubert_last_sonatas_wiki]
    text:
      en: 'On 2 October 1828 Schubert wrote to the Leipzig publisher Probst, offering among other new works his last three piano sonatas, which he meant to dedicate to a composer he admired. Probst was not interested in the sonatas.'
      zh: '1828 年 10 月 2 日，舒伯特写信给莱比锡出版人普罗布斯特，推荐几部新作，其中有最后三首钢琴奏鸣曲，他打算把它们题献给一位敬重的作曲家。普罗布斯特对奏鸣曲没有兴趣。'
    line:
      en: '2 October 1828: Schubert offers his last three piano sonatas to the publisher Probst.'
      zh: '1828 年 10 月 2 日，舒伯特写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。'
  death:
    date: '1828-11-19'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [schubert_wiki, schubert_bakers]
    text:
      en: 'At the beginning of November 1828 Schubert fell ill again, and he died at his brother''s flat on 19 November, aged thirty one. The official diagnosis was typhoid fever; other causes have also been proposed.'
      zh: '1828 年 11 月初，舒伯特再次病倒，11 月 19 日在哥哥的住处去世，三十一岁。官方诊断是伤寒，后来也有别的说法。'
    note: 'A death: written as a plain fact.'
    line:
      en: '19 November 1828: Franz Schubert dies in Vienna, aged thirty one.'
      zh: '1828 年 11 月 19 日，弗朗茨·舒伯特在维也纳去世，三十一岁。'
  first_edition:
    date: '1839'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_first_edition, schubert_last_sonatas_wiki]
    text:
      en: 'Diabelli bought the manuscripts of the three sonatas from Ferdinand Schubert and published them in 1839. The composer Schubert had meant them for had died in 1837, and Diabelli dedicated them to Robert Schumann instead.'
      zh: '迪亚贝利从费迪南德·舒伯特手里买下三首奏鸣曲的手稿，1839 年出版。舒伯特原想题献的那位作曲家已在 1837 年去世，迪亚贝利改题献给罗伯特·舒曼。'
    line:
      en: '1839: the last three sonatas come out from Diabelli, dedicated to Robert Schumann.'
      zh: '1839 年，最后三首奏鸣曲由迪亚贝利出版，题献给罗伯特·舒曼。'
