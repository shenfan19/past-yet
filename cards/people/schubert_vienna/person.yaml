            who: schubert_vienna
            bio: '这条时间线里，舒伯特三十一岁那年秋天病好了，又活了许多年，在维也纳继续作曲。'
        vignettes:
          chairs: '3 月 25 日晚上，会场里的炉子刚生上火，{staff}帮协会的门房在会场里一排排摆椅子，摆到椅子用完了，名单上的名字还没念完。门房说他还没见过这么多人肯挤进一间屋子，听一个还活着的人的曲子。'
          tavern: '七月的一个傍晚，{staff}坐在城墙外的一处葡萄酒园里，葡萄架底下的灯一盏盏点起来，一个拉琴的和一个弹吉他的一支接一支地奏圆舞曲。拉琴的在两支曲子中间停下来说，这么热的天，唱到第二段弦就松了，唯一的办法是拉快点。'
          stairs: '九月初，{staff}帮维登一幢新房子的女房东把几筐东西搬上楼。墙上的灰泥还有石灰味，台阶上落着几片刨花。她说楼梯间新得会回嘴，在一楼说一句，三楼能听见两遍。'
text:
  en:
    name: Franz Schubert
    text: Austrian composer, 1797 to 1828, born in Vienna. He wrote more than six hundred songs, symphonies and chamber music, little of which was published or performed widely in his lifetime. He died at thirty one.
  zh:
    name: 弗朗茨·舒伯特
    text: 奥地利作曲家，1797 年生，1828 年去世，生于维也纳。他写了六百多首歌曲，以及交响曲和室内乐，大部分在他生前没有出版或广泛演出。他三十一岁去世。
hook: {en: 'The only concert of his own he ever gave', zh: '他一生只开过一场自己的音乐会'}
facts:
  programme:
    date: '1828-03-26'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_vienna_programme, schubert_wiki]
    text:
      en: 'The invitation gives the date as 26 March 1828, the venue as the rooms of the Gesellschaft der Musikfreunde and the works as Schubert’s own. It was the only public concert of his own works that he gave.'
      zh: '请柬写明 1828 年 3 月 26 日在音乐之友协会会场演出，曲目均为舒伯特所作。这是他一生唯一一场只演自己作品的公开音乐会。'
    line:
      en: '26 March 1828: in the rooms of the Gesellschaft der Musikfreunde, Schubert gives a concert of his own works.'
      zh: '1828 年 3 月 26 日，舒伯特在音乐之友协会的会场举行只演自己作品的音乐会。'
      zh-Hant: '1828 年 3 月 26 日，舒伯特在音樂之友協會的會場舉行只演自己作品的音樂會。'
      fr: '26 mars 1828 : dans les salles de la Gesellschaft der Musikfreunde, Schubert donne un concert de ses propres œuvres.'
      es: '26 de marzo de 1828: en las salas de la Gesellschaft der Musikfreunde, Schubert ofrece un concierto de sus propias obras.'
      ja: '1828年3月26日: 楽友協会の部屋で、シューベルトが自作のコンサートを開催。'
      ko: '1828년 3월 26일: Gesellschaft der Musikfreunde의 방에서 슈베르트가 자신의 작품을 연주합니다.'
      ru: '26 марта 1828 года: в залах Общества друзей музыки Шуберт дает концерт своих произведений.'
  move:
    date: '1828-09'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [schubert_sterbewohnung, schubert_wiki]
    text:
      en: 'In the autumn of 1828, already ill, Schubert moved into the flat of his brother Ferdinand in a new house in Wieden, today Kettenbrückengasse 6, where he died. The flat is now a small museum of the Wien Museum.'
      zh: '1828 年秋，舒伯特已在病中，搬进哥哥费迪南德在维登一幢新房子里的住处，即今天的克滕布吕肯巷 6 号，后来就在那里去世。这处住所现在是维也纳博物馆下属的一间小纪念馆。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'Autumn 1828: Schubert, ill, moves into his brother Ferdinand''s new flat in Wieden.'
      zh: '1828 年秋，病中的舒伯特搬进哥哥费迪南德在维登的新住处。'
      zh-Hant: '1828 年秋，病中的舒伯特搬進哥哥費迪南德在維登的新住處。'
      fr: 'Automne 1828 : Schubert, malade, emménage dans le nouvel appartement de son frère Ferdinand à Wieden.'
      es: 'Otoño de 1828: Schubert, enfermo, se muda al nuevo piso de su hermano Ferdinand en Wieden.'
      ja: '1828年秋: 病気のシューベルトはヴィーデンにある弟フェルディナントの新しいアパートに引っ越します。'
      ko: '1828년 가을: 병에 걸린 슈베르트는 비에덴에 있는 그의 형 페르디난트의 새 아파트로 이사합니다.'
      ru: 'Осень 1828 года: больной Шуберт переезжает в новую квартиру своего брата Фердинанда в Видене.'
  probst:
    date: '1828-10-02'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_probst_1828, schubert_last_sonatas_wiki]
    text:
      en: 'On 2 October 1828 Schubert wrote to the Leipzig publisher Probst, offering among other new works his last three piano sonatas, which he meant to dedicate to a composer he admired. Probst was not interested in the sonatas.'
      zh: '1828 年 10 月 2 日，舒伯特写信给莱比锡出版人普罗布斯特，推荐几部新作，其中有最后三首钢琴奏鸣曲，他打算把它们题献给一位敬重的作曲家。普罗布斯特对奏鸣曲没有兴趣。'
    line:
      en: '2 October 1828: Schubert offers his last three piano sonatas to the publisher Probst.'
      zh: '1828 年 10 月 2 日，舒伯特写信给出版人普罗布斯特，推荐最后三首钢琴奏鸣曲。'
      zh-Hant: '1828 年 10 月 2 日，舒伯特寫信給出版人普羅布斯特，推薦最後三首鋼琴奏鳴曲。'
      fr: '2 octobre 1828 : Schubert offre ses trois dernières sonates pour piano à l''éditeur Probst.'
      es: '2 de octubre de 1828: Schubert ofrece sus tres últimas sonatas para piano al editor Probst.'
      ja: '1828年10月2日：シューベルト、最後の3曲のピアノ・ソナタを出版社プロブストに提供。'
      ko: '1828년 10월 2일: 슈베르트는 그의 마지막 세 곡의 피아노 소나타를 출판사인 프롭스트(Probst)에 제공합니다.'
      ru: '2 октября 1828 года: Шуберт предлагает свои последние три фортепианные сонаты издателю Пробсту.'
  death:
    date: '1828-11-19'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [schubert_wiki, schubert_bakers]
    text:
      en: 'At the beginning of November 1828 Schubert fell ill again, and he died at his brother''s flat on 19 November, aged thirty one. The official diagnosis was typhoid fever; other causes have also been proposed.'
      zh: '1828 年 11 月初，舒伯特再次病倒，11 月 19 日在哥哥的住处去世，三十一岁。官方诊断是伤寒，后来也有别的说法。'
    note: 'A death: written as a plain fact.'
    line:
      en: '19 November 1828: Franz Schubert dies in Vienna, aged thirty one.'
      zh: '1828 年 11 月 19 日，弗朗茨·舒伯特在维也纳去世，三十一岁。'
      zh-Hant: '1828 年 11 月 19 日，弗朗茨·舒伯特在維也納去世，三十一歲。'
      fr: '19 novembre 1828 : Franz Schubert décède à Vienne, à l''âge de trente et un ans.'
      es: '19 de noviembre de 1828: Franz Schubert muere en Viena, a los treinta y un años.'
      ja: '1828年11月19日：フランツ・シューベルトがウィーンで31歳で死去。'
      ko: '1828년 11월 19일: 프란츠 슈베르트가 비엔나에서 31세의 나이로 사망합니다.'
      ru: '19 ноября 1828 года: Франц Шуберт умирает в Вене в возрасте тридцати одного года.'
  first_edition:
    date: '1839'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [schubert_first_edition, schubert_last_sonatas_wiki]
    text:
      en: 'Diabelli bought the manuscripts of the three sonatas from Ferdinand Schubert and published them in 1839. The composer Schubert had meant them for had died in 1837, and Diabelli dedicated them to Robert Schumann instead.'
      zh: '迪亚贝利从费迪南德·舒伯特手里买下三首奏鸣曲的手稿，1839 年出版。舒伯特原想题献的那位作曲家已在 1837 年去世，迪亚贝利改题献给罗伯特·舒曼。'
    line:
      en: '1839: the last three sonatas come out from Diabelli, dedicated to Robert Schumann.'
      zh: '1839 年，最后三首奏鸣曲由迪亚贝利出版，题献给罗伯特·舒曼。'
      zh-Hant: '1839 年，最後三首奏鳴曲由迪亞貝利出版，題獻給羅伯特·舒曼。'
      fr: '1839 : sortent les trois dernières sonates de Diabelli, dédiées à Robert Schumann.'
      es: '1839: salen las tres últimas sonatas de Diabelli, dedicadas a Robert Schumann.'
      ja: '1839年：最後の3つのソナタがディアベリから出版され、ロベルト・シューマンに捧げられる。'
      ko: '1839년: Robert Schumann에게 헌정된 마지막 세 개의 소나타가 Diabelli에서 나왔습니다.'
      ru: '1839: выходят три последние сонаты Диабелли, посвященные Роберту Шуману.'
