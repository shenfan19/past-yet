quotes:
  schubert_sonatas_echo:
    order: 2
    tier: full
    date: '1828-10-02'
    checked: official_record
    sources: [schubert_probst_1828]
    original: de
    text:
      de:
        who: 'Franz Schubert'
        quote: 'Die Sonaten habe ich an mehreren Orten mit vielem Beyfall gespielt'
        occasion: 'Brief an den Verleger Heinrich Albert Probst'
      en:
        who: 'Franz Schubert'
        quote: 'I have played the sonatas in several places to much applause.'
        occasion: 'letter to the publisher Heinrich Albert Probst (game translation)'
      zh:
        who: '弗朗茨·舒伯特'
        quote: '这些奏鸣曲我已在好几处演奏过，颇受喝彩。'
        occasion: '致出版商海因里希·阿尔伯特·普罗布斯特的信（游戏译文）'
      zh-Hant:
        who: '弗朗茨·舒伯特'
        quote: '這些奏鳴曲我已在好幾處演奏過，頗受喝彩。'
        occasion: '致出版商海因里希·阿爾伯特·普羅布斯特的信（遊戲譯文）'
      fr:
        who: 'Franz Schubert'
        quote: 'J''ai joué les sonates à plusieurs endroits sous de nombreux applaudissements.'
        occasion: 'lettre à l''éditeur Heinrich Albert Probst (traduction du jeu)'
      es:
        who: 'Franz Schubert'
        quote: 'He tocado las sonatas en varios lugares con mucho aplauso.'
        occasion: 'carta al editor Heinrich Albert Probst (traducción del juego)'
      ja:
        who: 'フランツ・シューベルト'
        quote: '私はソナタをいくつかの場所で演奏し、多くの拍手をいただきました。'
        occasion: '出版社ハインリヒ・アルベルト・プロブストへの手紙（ゲーム翻訳）'
      ko:
        who: '프란츠 슈베르트'
        quote: '나는 여러 곳에서 소나타를 연주하여 많은 박수를 받았습니다.'
        occasion: '출판사 Heinrich Albert Probst에게 보내는 편지(게임 번역)'
      ru:
        who: 'Франц Шуберт'
        quote: 'Я играл сонаты в нескольких местах под бурные аплодисменты.'
        occasion: 'письмо издателю Генриху Альберту Пробсту (перевод игры)'
  schubert_books_echo:
    order: 1
    tier: none
    date: '1828-11-12'
    checked: official_record
    sources: [schubert_schober_autograph]
    original: de
    text:
      en:
        who: 'Franz Schubert'
        quote: 'Please be kind enough to help me through this desperate situation with something to read.'
        occasion: 'Last surviving letter, asking Franz von Schober for books; date of receipt · Game translation'
      zh:
        who: '弗朗茨·舒伯特'
        quote: '劳驾，给我找点书读，帮我熬过这难捱的时候。'
        occasion: '最后一封存世书信，向弗朗茨·冯·绍贝尔借书；日期为收信日 · 游戏译文'
      de:
        who: 'Franz Schubert'
        quote: 'Sey also so gut, mir in dieser verzweiflungsvollen Lage durch Lecktüre zu Hülfe zu kommen'
        occasion: 'Letzter erhaltener Brief, Bitte um Lektüre an Franz von Schober; Empfangsdatum'
      zh-Hant:
        who: '弗朗茨·舒伯特'
        quote: '勞駕，給我找點書讀，幫我熬過這難捱的時候。'
        occasion: '最後一封存世書信，向弗朗茨·馮·紹貝爾借書；日期為收信日 · 遊戲譯文'
      fr:
        who: 'Franz Schubert'
        quote: 'S''il vous plaît, ayez la gentillesse de m''aider à traverser cette situation désespérée avec quelque chose à lire.'
        occasion: "Dernière lettre survivante demandant des livres à Franz von Schober\_; date de réception · Traduction du jeu"
      es:
        who: 'Franz Schubert'
        quote: 'Por favor, tenga la amabilidad de ayudarme a superar esta situación desesperada con algo para leer.'
        occasion: 'Última carta superviviente, pidiendo libros a Franz von Schober; fecha de recepción · Traducción del juego'
      ja:
        who: 'フランツ・シューベルト'
        quote: 'どうか、この絶望的な状況を乗り越えるために何か読むものを与えてください。'
        occasion: 'フランツ・フォン・ショーバーに本を求めた、現存する最後の手紙。受領日・ゲーム翻訳'
      ko:
        who: '프란츠 슈베르트'
        quote: '읽을거리를 가지고 이 절박한 상황을 극복할 수 있도록 친절하게 도와주세요.'
        occasion: 'Franz von Schober에게 책을 요청하는 마지막 남은 편지; 수령일 · 게임 번역'
      ru:
        who: 'Франц Шуберт'
        quote: 'Пожалуйста, будьте так любезны, помогите мне преодолеть эту отчаянную ситуацию, предоставив что-нибудь для чтения.'
        occasion: 'Последнее сохранившееся письмо с просьбой о книгах у Франца фон Шобера; дата получения · Перевод игры'
