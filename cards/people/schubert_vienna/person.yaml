    text:
      en:
        name: 'The March programme'
        place: "Vienna"
        figure: "Franz Schubert"
        story: 'Schubert gave a concert of his own works in Vienna on 26 March 1828. Eduard von Bauernfeld’s account reproduces the invitation, with the programme and the rooms of the Gesellschaft der Musikfreunde.'
        relic: "A song manuscript"
        relic_desc: "A song in a quick hand with the ink still dark."
        points:
          p1: 'Get the volunteer players and the society''s hall onto the same evening and protect Schubert''s own concert'
          p2: 'While the Trio''s performance is still fresh, give the interested publisher a record of the pieces the audience heard'
          p3: 'Turn the inquiry into an agreement while Schubert can still settle publication and the dedication for his last three sonatas'
        points_fail:
          p1: 'The players and the available hall are booked for different days. The friends'' concert is canceled, and the office recalls the employee after a loss of sync.'
          p2: 'The publisher hears that the concert went well but cannot tell which version of the Trio was played.'
          p3: 'The inquiry is left waiting for a reply. The sonatas appear years after his death with a different dedication.'
        shift:
          p1:
            was: 'On 26 March 1828 Schubert gave a Vienna concert of his own music with help from friends and performers.'
          p2:
            was: 'After the March 1828 concert Schubert offered the Trio to publishers and referred to its reception.'
            now: '{staff} has the players check the parts used that evening and leaves Schubert a list he can compare with what he sends to the publisher.'
          p3:
            was: 'On 2 October 1828 Schubert offered his final three sonatas and named his intended dedicatee. They were first published in 1839.'
            now: '{staff} gets all three scores and the dedication sent together and asks for written confirmation. Schubert receives it while he is alive, and the dedication stays with the music.'
            who: schubert_vienna
            bio: 'Schubert received a publication commitment for his final sonatas before his death. Their later printers followed the dedication he had chosen.'
        vignettes:
          timing: 'The usher wants to open the door as soon as the visitor comes. You count the pieces on the programme and ask them both to wait for the next pause. One person finds a seat and the musicians play on. You hear the ending from the corridor.'
          memory: 'You tell the usher that people will look for this invitation long after the chairs are gone. He asks you to keep a clean copy away from the door. You put it aside and pencil the date on your own note. By the time you return, you have missed the opening.'
          chairs: 'You make a small mark beside one empty chair on the usher’s list. When a late arrival appears, he doesn’t need to ask the whole row to move. You take home the date and the mark. You never see whether the visitor stayed to the end.'
      zh:
        name: '三月那场音乐会的节目单'
        place: "维也纳"
        figure: "弗朗茨·舒伯特"
        story: '1828 年 3 月 26 日，舒伯特在维也纳举行演奏自己作品的音乐会。爱德华·冯·鲍恩费尔德的回忆录载有请柬，上面写着曲目与音乐之友协会的会场。'
        relic: "一份歌曲手稿"
        relic_desc: "一首运笔很快的歌，墨迹还很深。"
        points:
          p1: '把临时凑到的演奏者和音乐协会的场地约到同一晚，护住舒伯特自己的音乐会'
          p2: '趁三重奏得到掌声，把观众想再听的曲目按原谱记给有意付印的出版人'
          p3: '把出版问询变成可交稿的约定，让舒伯特赶得及为最后三首钢琴奏鸣曲定下出版与题献'
        points_fail:
          p1: '出场的人和空出的场地错了日期，靠朋友帮忙才排成的音乐会取消。行程同步失败，员工被召回。'
          p2: '出版人只知道音乐会成功，不知道台上弹过三重奏的哪一版。'
          p3: '来信仍停在等回音的阶段，三首奏鸣曲在他去世多年后才出版，题献也换了人。'
        shift:
          p1:
            was: '1828 年 3 月 26 日，舒伯特获朋友和演奏者协助，在维也纳以自己的作品举办专场音乐会。'
          p2:
            was: '1828 年 3 月音乐会后，舒伯特向出版商推荐三重奏，并提及音乐会反响。'
            now: '{staff}请演奏者核对当晚的声部谱，再为舒伯特留一份能同寄稿核对的曲目和版本清单。'
          p3:
            was: '1828 年 10 月 2 日舒伯特致函推荐最后三首奏鸣曲并提出题献意愿，三曲直到 1839 年才刊印。'
            now: '{staff}帮舒伯特把三份谱和题献要求随交稿清单送出，请出版方先回一封能核对的确认。舒伯特生前收到了确认，题献随乐谱保留。'
            who: schubert_vienna
            bio: '舒伯特生前为最后三首奏鸣曲留下了出版确认与题献说明。后来付印的人沿用他亲自留下的要求。'
        vignettes:
          timing: '引座人见客人一到就想开门。你照节目单数过曲目，请两人等到下一次停顿。迟到的人找到座位，台上接着演。末尾那一段，你站在走廊里听完。'
          memory: '你告诉虚构的引座人，多年后人们还会找这张请柬，到时这些椅子早就不在了。他请你留一张没折的。你收到一边，在自己的纸条上记下日期。回来时，开场已经过去。'
          chairs: '你在引座人的座位纸上给一把空椅子做了个记号。有人来迟时，他不用请整排人都挪动。你带回日期和那个记号。至于那位听众有没有听到最后，你没能看到。'
text:
  en:
    name: Franz Schubert
    text: Austrian composer, 1797 to 1828, born in Vienna. He wrote more than six hundred songs, symphonies and chamber music, little of which was published or performed widely in his lifetime. He died at thirty one.
  zh:
    name: 弗朗茨·舒伯特
    text: 奥地利作曲家，1797 年生，1828 年去世，生于维也纳。他写了六百多首歌曲，以及交响曲和室内乐，大部分在他生前没有出版或广泛演出。他三十一岁去世。
