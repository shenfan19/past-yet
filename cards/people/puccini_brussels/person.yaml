    text:
      en:
        name: 'The unfinished duet'
        place: Brussels
        figure: Giacomo Puccini
        story: 'Puccini went to Brussels for treatment in November 1924 with the ending of Turandot still unfinished. The pen stops in the middle of a thought on one sketch. On another, there is a list of instruments. Franco Alfano later had to turn such fragments into something an orchestra could play.'
        relic: 'A sketch for the duet'
        relic_desc: 'A leaf of music paper with a pencil note beside an unfinished passage.'
        points:
          p1: 'Help Puccini put the two alternative sketches for the final duet in order of preference while he can still weigh them'
          p2: 'Put your experience in care to work so Puccini can spend the last night free of the worst of his discomfort'
        points_fail:
          p1: 'The sheets remain separate. Whoever takes over will still have to choose between them.'
          p2: 'At the end of the night, the chair beside the bed is still empty and the discomfort has not eased.'
        shift:
          p1:
            was: 'In November 1924 the final duet still existed in fragments. Alfano later had to work out how to join what had survived.'
            now: 'Puccini marks which alternative he wants when the music changes at the end of the duet. The composer who takes over can start from that choice.'
          p2:
            was: 'On 24 November 1924 Puccini underwent treatment for throat cancer in Brussels. He died in the same clinic on 29 November.'
            now: '{staff} sits beside Puccini and helps him settle. The night he had been dreading passes with less pain and someone close enough to see when he needs help.'
            who: puccini_brussels
            bio: 'Puccini spent a quieter final night in Brussels. He had someone beside him when he put the score aside.'
        vignettes:
          divider: 'The copyist puts two pencilled measures side by side on the desk. They look almost the same until {staff} traces the bass with a finger. One comes back to where it started. The other leaves room for what follows. {staff} keeps both on the desk for Puccini to see.'
          future: '{staff} catches themself tapping the ending they know from the theatre. The copyist looks up from a bar that has no ending yet. {staff} turns the page back and asks to start at the last measure both of them can read.'
          pin: 'The copyist clears a corner of the desk for a cup. {staff} moves one manuscript leaf a little farther in from the edge. At the bottom of the leaf, below a nearly empty stave, two words have been squeezed into the margin.'
      zh:
        name: '没写完的二重唱'
        place: 布鲁塞尔
        figure: 贾科莫·普契尼
        story: '1924 年 11 月，普契尼到布鲁塞尔治病，《图兰朵》的结尾还没写完。有一页稿，乐句写到一半停住了。另一页上列着几样乐器。后来，弗兰科·阿尔法诺要从这些零散的音符里接出一段乐团能演奏的音乐。'
        relic: '二重唱草稿'
        relic_desc: '一张五线谱纸，没写完的乐句旁留着铅笔字。'
        points:
          p1: '趁普契尼还能审稿，帮他从末场二重唱的两份草稿里标出自己想留的一种写法'
          p2: '用照护经验减轻普契尼在最后一夜的病痛'
        points_fail:
          p1: '两张草稿照旧分开搁着。接手的人还得自己猜他想用哪一种。'
          p2: '这一夜过去，床边的椅子还是空的，病痛也没能缓下来。'
        shift:
          p1:
            was: '1924 年 11 月，末场二重唱仍是散页，阿尔法诺后来要从留下的草稿里找出接法。'
            now: '普契尼在二重唱转调的地方标下自己想留的一种写法。接手的人从他标的这一处起笔。'
          p2:
            was: '1924 年 11 月 24 日，普契尼在布鲁塞尔接受喉癌治疗，29 日在同一家诊所去世。'
            now: '{staff}留在床边帮普契尼缓一缓。这一夜没有他想的那么疼，想叫人的时候，手也够得着床边。'
            who: puccini_brussels
            bio: '普契尼在布鲁塞尔度过了稍安稳的一夜。他把谱放下时，床边有人陪着。'
        vignettes:
          divider: '抄谱人把两行铅笔谱并排摊在桌上。乍看几乎一样，{staff}用指尖顺着低声部走了一遍。一行兜回原处，另一行给后头留了地方。{staff}把两页都留下，等普契尼亲自看。'
          future: '{staff}差点敲出自己在剧院听过的结尾。抄谱人从还没有收尾的一小节上抬头。{staff}把纸往回翻，请他从两人都认得的最后一个小节开始。'
          pin: '抄谱人腾出个桌角放杯子。{staff}把一张稿纸往里挪了挪。页脚一行空了大半的五线谱底下，挤着两个铅笔字。'
text:
  en:
    name: Giacomo Puccini
    text: 'Italian composer (1858–1924) of La Bohème, Tosca and Madama Butterfly. He died in Brussels while receiving treatment for throat cancer. His last opera, Turandot, remained unfinished.'
  zh:
    name: 贾科莫·普契尼
    text: '意大利作曲家（1858–1924），作有《波希米亚人》《托斯卡》和《蝴蝶夫人》。他在布鲁塞尔治疗喉癌期间去世，最后一部歌剧《图兰朵》未能写完。'
hook: {en: 'Two sketches, and one choice he never made', zh: '两张草稿，该留下哪一张？'}
