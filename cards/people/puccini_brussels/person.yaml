    text:
      en:
        name: 'A divider for the unfinished score'
        place: "Brussels"
        figure: "Giacomo Puccini"
        story: 'Puccini left Turandot incomplete. The Puccini Study Centre distinguishes the surviving drafts and scores and credits Franco Alfano with completing the duet and final scene.'
        relic: "A sketch page"
        relic_desc: "A page of musical sketches in soft pencil."
        points:
          p1: 'While Puccini moves into the clinic in Brussels, keep the pages of the Turandot finale he brought together and hand them to Tonio one by one'
          p2: 'While he can still write, help him mark on his sketches the two joins in the final duet he wants kept, so the unfinished ending goes one step further in his own hand'
          p3: 'Through the nights after the radium operation, stop the bleeding and the strain on his heart, and save Puccini'
        points_fail:
          p1: 'Loose sketches went in with the travel papers and several pages of the finale were missing at handover. The branch came apart from history and the office recalled the employee.'
          p2: 'The sketches stayed as they were, and whoever finished the opera had to decide alone how the passages joined.'
          p3: 'He died in Brussels on 29 November as history has it, and in this branch too he could not be kept.'
        shift:
          p1:
            was: 'On 4 November 1924 Puccini left for Brussels with the unfinished sketches for the final duet of Turandot. The sketches survived, and Alfano later completed the ending from them.'
          p2:
            was: 'Puccini left the finale incomplete, and Alfano had to choose how to continue from the surviving sketches.'
            now: 'Two joins in the duet are marked in Puccini''s hand. Whoever finished the ending began from them.'
          p3:
            was: 'On 24 November 1924 Puccini underwent radium treatment for throat cancer in Brussels; he died there on 29 November of complications after the operation, aged 65.'
            now: '{staff} kept watch through the nights after the operation and he came through the strain on his heart. He spent December recovering in Brussels, then went home to Italy and went back to the end of Turandot.'
            who: puccini_brussels
            bio: 'In this line Puccini survived the treatment in Brussels in November 1924. He went home and worked on for some years more.'
        vignettes:
          divider: 'The copyist has laid a sketch after a clean score page as if they belong to one continuous copy. You insert a divider and label each side. He can now retrieve either without mistaking it for the other. The missing stage ending will be someone else’s task.'
          future: 'You almost tell the copyist how the opera will end. He asks which sheet you are reading that from. You put the later ending out of your own notes and write down what is actually in front of you. There are two packets and no final page you can copy.'
          pin: 'A loose sheet lifts when the copyist opens the packet. You keep it where he can find it and draw a little sign on the wrapper. You carry the position away in your notebook. You will not be there when the missing music is supplied.'
      zh:
        name: '给未完稿夹一张分隔纸'
        place: "布鲁塞尔"
        figure: "贾科莫·普契尼"
        story: '普契尼未完成《图兰朵》。普契尼研究中心区分留下的草稿与总谱，并把补完二重唱及最后一场的工作归于弗兰科·阿尔法诺。'
        relic: "一页草稿"
        relic_desc: "一页用软铅笔写的乐谱草稿。"
        points:
          p1: '普契尼住进布鲁塞尔的诊所时，护住他带来的《图兰朵》末场草稿，逐页交到托尼奥手上'
          p2: '趁他还能动笔，帮他在草稿上标出末场二重唱里要留的两处接缝，让没写完的结尾在他自己手里多走一步'
          p3: '镭针手术后的那几夜，止住出血、托住他的心脏，救下普契尼'
        points_fail:
          p1: '散页混进了行李里的旅途文件，交接时缺了末场的几张草稿。分支与历史脱了节，事务所因同步失败召回员工。'
          p2: '草稿照旧，后来补写的人只能自己决定几段怎样相接。'
          p3: '他照史实在 11 月 29 日死在布鲁塞尔，这条分支里也没能留住他。'
        shift:
          p1:
            was: '1924 年 11 月 4 日，普契尼带着《图兰朵》末场二重唱的未完草稿去布鲁塞尔。草稿留存下来，结尾后来由阿尔法诺据此补写。'
          p2:
            was: '普契尼没有写完末场，阿尔法诺只能从留下的草稿里自己选择怎样续写。'
            now: '二重唱里有两处接缝是普契尼亲手标定的。补写结尾的人从这两处起笔。'
          p3:
            was: '1924 年 11 月 24 日，普契尼在布鲁塞尔接受喉癌的镭针放疗手术，11 月 29 日因术后并发症在那里去世，六十五岁。'
            now: '{staff}守住了术后那几夜，他挺过了心脏那一关。十二月他还在布鲁塞尔养病，之后回到意大利，又回到《图兰朵》的结尾上。'
            who: puccini_brussels
            bio: '这条时间线里，普契尼挺过了 1924 年 11 月在布鲁塞尔的治疗。他回到家，又工作了几年。'
        vignettes:
          divider: '抄谱人把一页草稿接在誊清谱后头，好像它们属于一份连贯的谱。你插进分隔纸，分别标了两边。往后两份都找得到，也不必认错。舞台上缺的结尾，要留给后来的人。'
          future: '你差点把后来演出时的结尾告诉抄谱人。他问你是照哪张读的。你从自己的便笺里划去那个未来的结尾，改记眼前的东西。手上是两叠纸，里面没有一张能让你照抄成末页。'
          pin: '抄谱人解开纸包，一页松动的稿子翘起来。你把它扶回原处，在外包纸上画一个小记号，好让他再找得到。你在笔记里带走它的位置。等缺的音乐补上，你早就离开了。'
text:
  en:
    name: Giacomo Puccini
    text: Italian composer, 1858 to 1924, of operas including La Bohème, Tosca and Madama Butterfly. He died in Brussels during treatment for throat cancer, leaving Turandot unfinished.
  zh:
    name: 贾科莫·普契尼
    text: 意大利作曲家，1858 年生，1924 年去世，作有《波希米亚人》《托斯卡》《蝴蝶夫人》等歌剧。他因喉癌在布鲁塞尔治疗期间去世，《图兰朵》尚未写完。
hook: {en: 'Where does the finished music give way to drafts?', zh: '总谱在哪一页变成草稿？'}
