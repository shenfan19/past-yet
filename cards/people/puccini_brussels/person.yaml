    text:
      en:
        name: 'A divider for the unfinished score'
        place: "Brussels"
        figure: "Giacomo Puccini"
        story: 'Puccini left Turandot incomplete. The Puccini Study Centre distinguishes the surviving drafts and scores and credits Franco Alfano with completing the duet and final scene.'
        relic: "A sketch page"
        relic_desc: "A page of musical sketches in soft pencil."
        points:
          p1: 'While Puccini is in hospital, list the pages of the Turandot finale he brought to Brussels and hand them to Tonio one by one.'
          p2: 'Have Tonio separate consecutive bars from individual motifs and keep the original numbering on both groups.'
          p3: 'While Puccini can still indicate choices on paper, let him circle two joins he wants to keep. Have Tonio file those pages with the drafts.'
        points_fail:
          p1: 'Loose sketches are put away with travel papers. Several pages of the finale are missing at handover, and the office recalls the employee.'
          p2: 'A sheet of only a few bars is filed inside the continuous draft. The next reader takes it for a passage the composer had already placed there.'
          p3: 'The inventory only lists the pages that came on the journey. The next composer still has to decide how the two passages fit together.'
        shift:
          p1:
            was: 'When Puccini went to Brussels in November 1924, the final duet existed in unfinished draft and loose sketches. The papers survived, and Alfano later completed the ending.'
          p2:
            was: 'The Puccini Study Centre’s catalogue distinguishes the continuous draft from separate leaves of sketches.'
            now: 'The next musician can find each loose leaf in its own group and tell which joins Puccini wrote and which are still open.'
          p3:
            was: 'Puccini left the finale incomplete. Alfano subsequently had to decide how to continue from the surviving sketches.'
            now: 'Alfano can see the two joins Puccini circled and use them to begin his continuation. The rehearsal score identifies who supplied the passages that were still open.'
            who: puccini_brussels
            bio: 'Puccini was still working out the end of Turandot when he traveled to Brussels. His papers combine continuous sections with ideas he had yet to place in the score.'
        vignettes:
          divider: 'The copyist has laid a sketch after a clean score page as if they belong to one continuous copy. You insert a divider and label each side. He can now retrieve either without mistaking it for the other. The missing stage ending will be someone else’s task.'
          future: 'You almost tell the copyist how the opera will end. He asks which sheet you are reading that from. You put the later ending out of your own notes and write down what is actually in front of you. There are two packets and no final page you can copy.'
          pin: 'A loose sheet lifts when the copyist opens the packet. You keep it where he can find it and draw a little sign on the wrapper. You carry the position away in your notebook. You will not be there when the missing music is supplied.'
      zh:
        name: '给未完稿夹一张分隔纸'
        place: "布鲁塞尔"
        figure: "贾科莫·普契尼"
        story: '普契尼未完成《图兰朵》。普契尼研究中心区分留下的草稿与总谱，并把补完二重唱及最后一场的工作归于弗兰科·阿尔法诺。'
        relic: "一页草稿"
        relic_desc: "一页用软铅笔写的乐谱草稿。"
        points:
          p1: '普契尼住院期间，把他带到布鲁塞尔的《图兰朵》末场草稿逐张登记，离开病房时逐页交给托尼奥。'
          p2: '请托尼奥把有连续小节的草稿与只有动机的散页分开，给两组都留原来的页码。'
          p3: '趁普契尼还可用手势和笔记确认，让他从自己带来的草稿里圈出有意保留的两个接缝，请托尼奥一并留存。'
        points_fail:
          p1: '散页和旅途中收起的纸放到一起，交接时缺了末场的几张草稿。事务所因同步失败召回员工。'
          p2: '一页只有几小节的纸被排进连续草稿。后来读谱的人误以为作者已决定把它接在那里。'
          p3: '交接本只能记下带来了哪些纸。后来接手的作曲家仍得自己解释两段应该如何相接。'
        shift:
          p1:
            was: '普契尼 1924 年 11 月前往布鲁塞尔时，末场二重唱已有未完草稿和散页。草稿留存下来，结尾后来由阿尔法诺补写。'
          p2:
            was: '普契尼研究中心的目录把连续草稿与另外的构想散页分别记载。'
            now: '后续接手的人能把散页找回原组，辨认哪些接续是作者写下的，哪些还要自己选择。'
          p3:
            was: '末场并未由普契尼完成。后来选定阿尔法诺时，他必须从原有草稿中选择怎样续写。'
            now: '铺开草稿时，阿尔法诺能看到普契尼圈定的两处接缝，并把这两处作为续写起点。其余未定处在排练本上注明由谁补写。'
            who: puccini_brussels
            bio: '普契尼去布鲁塞尔时仍在构思《图兰朵》的末场。他留下的稿纸既有连续段落，也有尚未接入总谱的想法。'
        vignettes:
          divider: '抄谱人把一页草稿接在誊清谱后头，好像它们属于一份连贯的谱。你插进分隔纸，分别标了两边。往后两份都找得到，也不必认错。舞台上缺的结尾，要留给后来的人。'
          future: '你差点把后来演出时的结尾告诉抄谱人。他问你是照哪张读的。你从自己的便笺里划去那个未来的结尾，改记眼前的东西。手上是两叠纸，里面没有一张能让你照抄成末页。'
          pin: '抄谱人解开纸包，一页松动的稿子翘起来。你把它扶回原处，在外包纸上画一个小记号，好让他再找得到。你在笔记里带走它的位置。等缺的音乐补上，你早就离开了。'
text:
  en:
    name: Giacomo Puccini
    text: Italian composer, 1858 to 1924, of operas including La Bohème, Tosca and Madama Butterfly. He died in Brussels during treatment for throat cancer, leaving Turandot unfinished.
  zh:
    name: 贾科莫·普契尼
    text: 意大利作曲家，1858 年生，1924 年去世，作有《波希米亚人》《托斯卡》《蝴蝶夫人》等歌剧。他因喉癌在布鲁塞尔治疗期间去世，《图兰朵》尚未写完。
hook: {en: 'Where does the finished music give way to drafts?', zh: '总谱在哪一页变成草稿？'}
