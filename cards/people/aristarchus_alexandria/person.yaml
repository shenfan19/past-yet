    sources: [aristarchus_alexandria_sun_moon]
    text:
      en: 'The text assumes an angle of 87 degrees at the observer at half Moon and derives a distance ratio strictly between eighteen and twenty.'
      zh: '原书取半月时在观测者处的夹角为 87 度，据此推得距离比大于十八且小于二十。'
