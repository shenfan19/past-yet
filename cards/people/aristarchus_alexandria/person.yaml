    text:
      en:
        name: "The Earth moves, and few listened"
        place: "Alexandria"
        figure: "Aristarchus"
        story: "Aristarchus proposes that the Earth moves around the Sun and measures the sizes of the Sun and the Moon. Almost nobody follows him, and the idea survives in a few lines of Archimedes."
        relic: "A sundial plate"
        relic_desc: "A bronze plate with lines for the hours and the seasons."
        points:
          p1: "Follow his geometry of the Sun and Moon"
          p2: "Stand by the idea when the others laugh"
          p3: "Make one listener write his idea down"
      zh:
        name: "地球在动，少有人听"
        place: "亚历山大"
        figure: "阿利斯塔克斯"
        story: "阿利斯塔克斯提出地球绕着太阳转，并测量了太阳和月亮的大小。几乎没有人跟随他，这个想法只在阿基米德的几行文字里留了下来。"
        relic: "一块日晷板"
        relic_desc: "一块青铜板，刻着时辰和节气的线。"
        points:
          p1: "跟上他关于太阳和月亮的几何"
          p2: "别人嘲笑时守住这个想法"
          p3: "让一位听众把他的想法记下来"
text:
  en:
    name: Aristarchus
    text: Greek astronomer, about 310 BC to about 230 BC. The only surviving work estimates the sizes and distances of the sun and moon, and later authors report that he proposed a heliocentric system, which few accepted at the time.
  zh:
    name: 阿利斯塔克斯
    text: 希腊天文学家，约公元前 310 年生，约公元前 230 年去世。现存著作估算了太阳与月亮的大小和距离，后世作者记载他提出过日心说，当时几乎没人接受。
