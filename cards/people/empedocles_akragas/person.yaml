    text:
      en:
        name: 'Where the chorus parts'
        place: "Akragas"
        figure: "Empedocles"
        story: 'Fragments attributed to Empedocles describe four roots and a cycle of joining and separation associated with Love and Strife. Much later, Diogenes Laertius preserves conflicting stories about his death.'
        story_prose:
          opening:
            - 'Akragas, around the middle of the fifth century BC. In his verse Empedocles uses four roots to explain how things come together and separate again.'
            - 'In history, only fragments and quotations survive from the long poem. In this branch a copyist is willing to prepare another copy, and someone elsewhere is willing to keep it.'
            - 'Someone who can hear where one line fails to lead to the next can help, and someone who can make sure the copy will be found again.'
          points:
            p1: '{staff} reads with the copyist from the start and asks him to stop at a place both had passed too quickly. Empedocles repeats the two lines slowly, then waits for them to be read back. Next day {staff} checks the beginning and the end with the person who will take the copy. The two rolls no longer share the same cord. The reader takes the one tied separately and says its first line quietly once.'
          outcomes:
            all: 'The copy kept elsewhere no longer travels with the original. When someone later asks about those lines, its keeper can bring them out without sending for a roll.'
            p1: 'The reader puts the new copy where he can open it himself. The other roll stays on the copyist’s table.'
          none: 'The first lines still do not join up in the copy. At the end of the day the reader puts the roll back where it was.'
          not_admitted: '{staff} misses the copyist’s open door. From over the wall comes a single line, repeated from the older roll.'
          excerpts:
            p1: 'The two rolls no longer share the same cord. The reader takes the one tied separately and says its first line quietly once.'
        relic: "A scrap of verse"
        relic_desc: A strip from the imagined rehearsal, marked at two turns in the verse.
        points:
          p1: 'Help a copyist complete and check a copy of On Nature and arrange for it to be kept separately'
        points_fail:
          p1: 'In this branch, as in history, later readers can piece together only part of the poem from quotations and papyrus fragments.'
        shift:
          p1:
            was: 'Empedocles put his ideas in verse in the fifth century BC. On Nature survives in part through quotations and papyri, including fragments published from the Strasbourg collection in 1999.'
            now: 'The copy is checked against the poem before it goes to another reader. In this branch a complete text survives alongside the extracts preserved in other works.'
            who: empedocles_akragas
            bio: 'In this line Empedocles'' poem On Nature survived whole, and later readers could follow his four roots, Love and Strife from the first line to the last.'
        vignettes:
          cue: 'Phaon has saved only the loudest line and both readers come in together. You mark the two places where the sense turns. At the first mark they draw their stools together; at the second they each take a step back. This time the reader facing the door can tell where she is without seeing the sheet.'
          handoff: 'Eirenē can reach the second verse but keeps jumping straight to the last. Phaon offers to finish alone. You ask her to take the first cue and let him answer from across the room. When supper is called, she closes the rehearsal instead of leaving it halfway.'
          sandal: 'Phaon asks which story people will remember. You almost tell him about the bronze sandal in a later account of Etna. He wants a line he can practise tomorrow. You leave the sandal out and repeat his unfinished part once with him. By the time you can look for Eirenē, the stools are stacked.'
      zh:
        name: '合唱从哪句分开'
        place: "阿克拉加斯"
        figure: "恩培多克勒"
        story: '恩培多克勒的诗歌残篇写到四根，以及爱与争引起的聚合和分离。远在后世，第欧根尼·拉尔修收录了互相矛盾的死因传说。'
        story_prose:
          opening:
            - '约公元前五世纪中叶，阿克拉加斯。恩培多克勒的诗用四种根来解释事物在一起时怎样成为一体、怎样又分开。'
            - '史实里，长诗后来只存残篇和别人引过的句子。在这条分支里，一名抄写人愿意多写一份，另一个地方也有人愿意收下。'
            - '这趟用得上能听出抄本里哪一句接不上、确认以后还找得到它的人。'
          points:
            p1: '{staff}从头跟抄写人读了一遍，在一处两个人都读快了的地方请他先停手。恩培多克勒把那两句慢一点念开，等抄完再读回给他听。待到第二天，{staff}陪领抄本的人核了头尾。 两卷不再用同一根绳捆着。领卷的人拿起单独系好的那一份，先把它的头一句低声念了一次。'
          outcomes:
            all: '另收的一份没有和原卷同进同出。后来有人来请教那几句，保管者没等别人送来卷子，自己就拿了出来。'
            p1: '领走的人把新卷放在自己可以打开的地方。原先那卷仍留在写字的人桌边。'
          none: '抄本开头几行还没有接上。收工时，念过一遍的人把卷留在了原处。'
          not_admitted: '{staff}没赶上抄写的人开门。有人从隔墙念出一句，听近了才知道是在重读旧卷。'
          excerpts:
            p1: '两卷不再用同一根绳捆着。领卷的人拿起单独系好的那一份，先把它的头一句低声念了一次。'
        relic: "一片诗稿"
        relic_desc: 排练用的纸莎草条，在诗句的两处转折做过记号。
        points:
          p1: '帮抄写人核全《论自然》的一份抄本，把这一份另找地方存下'
        points_fail:
          p1: '这条分支里，后人也只能从后世的引文和纸草残片中读到长诗的一部分。'
        shift:
          p1:
            was: '公元前五世纪，恩培多克勒把自己的学说写进诗中。《论自然》传下来的只有引文和纸草残篇，包括 1999 年刊布的斯特拉斯堡藏片。'
            now: '这份抄本核过全文，由另一名读者带走保管。这条分支里，后人还能找到整首诗。'
            who: empedocles_akragas
            bio: 'IF 线里，恩培多克勒的《论自然》完整传了下来，后人能从第一行读到最后一行，看他怎样讲四根和爱与争。'
        vignettes:
          cue: '法翁只记住声音最高的一句，结果两个人同时起了头。你在意思转折的两处做记号。到头一处，两人把凳子挪近，到了第二处，各退一步。这回面朝门的读者不用看稿，也知道念到哪儿。'
          handoff: '埃瑞涅能念到第二段，却总是一下跳到末尾。法翁说他一个人念完算了。你请她给第一个提示，让法翁在屋子另一边接腔。喊开饭时，收住这一遍的是她，终于没有半途离开。'
          sandal: '法翁问后人会记住哪个故事。你差点说起后来那则埃特纳传说里的铜鞋。他想要的是明天还能练的一句。你收住铜鞋的话，陪他把没念完的那段再走一遍。再想去找埃瑞涅，凳子已经叠起来了。'
text:
  en:
    name: Empedocles
    text: Greek philosopher from Akragas in Sicily, about 494 BC to about 434 BC. He taught that all things are mixtures of four roots, earth, air, fire and water, moved by love and strife.
  zh:
    name: 恩培多克勒
    text: 西西里阿克拉加斯的希腊哲学家，约公元前 494 年生，约公元前 434 年去世。他主张万物由土、气、火、水四种根构成，由爱与恨推动。
hook: {en: 'The chorus knows the ending but loses its place.', zh: '会背结尾的人，唱到中间乱了。'}
facts:
  roots:
    date: '-440'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [empedocles_akragas_roots]
    text:
      en: 'The fragments describe the four constituents and alternate union and separation. The year is an approximate setting during the philosopher’s lifetime.'
      zh: '残篇写出四种成分及交替的聚合、分离。年份取哲学家生平中的约略时间。'
  papyrus:
    date: '1999'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [empedocles_papyrus]
    text:
      en: 'The 1999 edition of the Strasbourg papyrus identifies and publishes part of Empedocles’ poem on nature. No complete copy is known.'
      zh: '1999 年，研究者刊布了斯特拉斯堡所藏的恩培多克勒纸草残篇，其中可辨出《论自然》的一部分。完整抄本未见传世。'
  etna:
    date: '220'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [empedocles_akragas_etna]
    text:
      en: 'The much later biography records several incompatible accounts, including the Etna and bronze sandal story.'
      zh: '这部晚出传记记录了数种互不相容的说法，埃特纳火山和铜鞋只是其中一种。'
