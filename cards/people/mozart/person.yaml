      en:
        name: "The Requiem unfinished"
        place: "Vienna"
        figure: "Wolfgang Amadeus Mozart"
        story: "Mozart lies ill in Vienna with his Requiem unfinished. He dies in December at thirty five."
        relic: "A page of the Requiem"
        relic_desc: "A score page ending mid phrase."
        points:
          p1: "Sit by him in the sickroom"
          p2: "Follow the voices he sketches (a musician or sharp wit helps)"
          p3: "Sing the last bars he sketched with him"
      zh:
        name: "未完成的安魂曲"
        place: "维也纳"
        figure: "沃尔夫冈·阿马德乌斯·莫扎特"
        story: "莫扎特病倒在维也纳，《安魂曲》还没写完。十二月他去世，年仅三十五岁。"
        relic: "一页安魂曲手稿"
        relic_desc: "一页乐谱，停在一句的中间。"
        points:
          p1: "在病房里陪着他"
          p2: "跟上他勾勒出的各声部（音乐家或敏锐的头脑更合适）"
          p3: "和他一起唱他留下的最后几小节"
text:
  en:
    name: Wolfgang Amadeus Mozart
    text: Austrian composer, 1756 to 1791. A child prodigy, he wrote operas, symphonies and concertos. His Don Giovanni had its first performance in Prague in 1787, and he left his Requiem unfinished when he died in Vienna in 1791.
  zh:
    name: 沃尔夫冈·阿马德乌斯·莫扎特
    text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
