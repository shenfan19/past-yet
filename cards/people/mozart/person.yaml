self_check:
  fact: prague_premiere
  quote_line: '布拉格｜划掉的休止还留在谱上。 维也纳｜交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。'
  regret_choice: '布拉格｜swap 重抄与找人都来不及，需要员工代跑一趟。 维也纳｜finish 若把后来听过的曲子当原稿，交接时就会混掉笔迹。'
  bookend: '布拉格｜从分谱未齐开场，到幕升起来。 维也纳｜从看到空页，到保住空处的边界。'
  share_line: '布拉格｜开幕之前，换好一张分谱。 维也纳｜一处留白，至少两次交接。'
  share_number: '布拉格｜cue 划掉一个虚构的多余休止。 维也纳｜stack 留下一张原本要拿开的虚构练习页。'
  knowing: '布拉格｜applause 员工知道表演后的来信。 维也纳｜finish 听过后世演奏的补全版。'
  near: '布拉格｜prague_premiere 有莫扎特亲述的首演日期。 维也纳｜vienna_material 以馆藏两类稿本为实物依据。'
  lever: '布拉格｜swap 让抄谱与找人同时做。 维也纳｜hand 后来的抄谱人知道从哪儿补。'
  missed: '布拉格｜applause 没听上安娜进那一句。 维也纳｜finish 赶不上下一版的形成。'
  brought: '布拉格｜cue 带回虚构的分谱练习页。 维也纳｜stack 带回有位置签的虚构页。'
