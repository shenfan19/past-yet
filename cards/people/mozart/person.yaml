events:
  mozart_prague:
    order: 26
    year: 1787
    lon: 14.42
    lat: 50.09
    region: europe
    field: music
    tier: 2
    channels: {V: 2}
    refs: [mozart_prague_prague_preparations, mozart_prague_prague_premiere]
    scene:
      points:
        - {id: p1, kind: notice, req: {"any":[{"trait":["wanderer","quiet","curious"]},{"job":["musician"]}]}}
        - {id: p2, kind: trust, req: {"any":[{"trait":["kind","artistic","attached"]},{"luck":0.4}]}}
        - {id: p3, kind: persuade, req: {"stat":{"finesse":6}}}
      vignettes:
        - {id: cue, traits: [curious, quiet, methodical]}
        - {id: swap, traits: [kind, artistic, attached]}
        - {id: applause}
    text:
      en:
        name: 'The cue before the curtain'
        place: Prague
        figure: Wolfgang Amadeus Mozart
        story: 'Mozart wrote from Prague that Don Giovanni went on stage on 29 October 1787. An earlier letter describes problems getting the opera ready.'
        relic: 'A corrected rehearsal part'
        relic_desc: 'A fictional part with one rest crossed out.'
        points:
          p1: 'Check the singer’s cue against the other part'
          p2: 'Ask the copyist which page she can replace before the curtain rises'
          p3: 'Get both singers to start from the cue once'
        vignettes:
          cue: 'Anna’s part gives her one extra rest. You tap where the other voice enters and let her mark which word she can listen for. On the next run she comes in on time. The part still has the crossed-out rest, and Anna asks you to keep it visible.'
          swap: 'Jan has time to replace a page or fetch the missing singer. You take the walk to the stairs while he copies the page. By the time the curtain moves, both the new page and the singer are at the stand. Someone under the stage is still looking for the old copy.'
          applause: 'You know Mozart will write about the applause. Jan asks whether anyone in the house will hear the extra rest. You give him the corrected page and tell him where to listen for Anna. When you leave, the curtain has risen and the cue has yet to come.'
      zh:
        name: '开幕前的接句'
        place: 布拉格
        figure: 沃尔夫冈·阿马德乌斯·莫扎特
        story: '莫扎特从布拉格写信说，《唐璜》于1787年10月29日登台。更早的一封信提到筹备中的困难。'
        relic: '一页改过的排练分谱'
        relic_desc: '排练用谱，划掉了一个休止。'
        points:
          p1: '拿另一份分谱核对歌手的接句'
          p2: '请抄谱员说清开幕前哪一页还能换'
          p3: '请两个人从那句接头的地方合一遍'
        vignettes:
          cue: '安娜的分谱多抄了一个休止。你敲出另一声部进入的位置，让她标下该听哪个词。再合一遍时她进准了。划掉的休止还留在谱上，安娜请你别把它涂没。'
          swap: '扬来得及重抄一页，或去找还没回来的歌手。你替他跑一趟楼梯，他留下抄。幕一动，改过的谱和歌手都到了谱架前。台下还有人在找那张旧谱。'
          applause: '你知道莫扎特会在信里提到掌声。扬问，那一个多出来的休止会不会有人听出来。你交给他改好的谱，指给他在哪儿等安娜开口。离开时幕已经升起，那句还没到。'
  mozart_requiem_vienna:
    order: 112
    year: 1791
    lon: 16.37
    lat: 48.21
    region: europe
    field: music
    tier: 3
    channels: {E: 2, G: 2}
    regret: true
    refs: [mozart_requiem_vienna_vienna_material, mozart_requiem_vienna_vienna_hands]
    scene:
      points:
        - {id: p1, kind: care, req: {"trait":["faithful","cheerful","calm"]}}
        - {id: p2, kind: notice, req: {"any":[{"job":["musician"]},{"stat":{"wit":7}}]}}
        - {id: p3, kind: hold, redeem: true, req: {"item":"golden_apple"}}
      vignettes:
        - {id: stack, traits: [faithful, cheerful, calm]}
        - {id: hand, traits: [artistic, methodical, scholarly]}
        - {id: finish}
    text:
      en:
        name: 'Leave the hand visible'
        place: "Vienna"
        figure: "Wolfgang Amadeus Mozart"
        story: 'Mozart died in Vienna in December 1791 with the Requiem incomplete. The Austrian National Library preserves working material and a delivery score with contributions by Franz Xaver Süssmayr.'
        relic: 'An unfinished practice leaf'
        relic_desc: 'A fictional copying leaf showing where the surviving notes stop.'
        points:
          p1: 'Make space for the copyist to stack the working pages in order'
          p2: 'Identify where the written music stops on the practice copy'
          p3: 'Protect the unfinished passage from being filled in at the copying table'
        vignettes:
          stack: 'Greta is clearing the table and sets an empty-looking leaf aside. You hold the stack while Emil checks the page before it. The empty staff belongs in the sequence. Greta puts it back with a loose slip marking where it came from.'
          hand: 'Emil can copy the line in front of him and is ready to carry straight on into an unwritten staff. You have him rule a small mark in the margin at the point where copying stops. In the finished handoff, the next reader can see exactly where a new hand would have to begin.'
          finish: 'You can hum the passage as a future choir will sing it. Greta needs the copy now and asks where the written music on that page ends. You show her the boundary and keep the melody to yourself. The next version will be put together after you leave.'
      zh:
        name: '留下能认出的笔迹'
        place: "维也纳"
        figure: "沃尔夫冈·阿马德乌斯·莫扎特"
        story: '莫扎特1791年12月在维也纳去世时，《安魂曲》尚未完成。奥地利国家图书馆保有工作稿和含弗朗茨·克萨韦尔·苏斯迈尔补写的交付谱。'
        relic: '一页留白的练习谱'
        relic_desc: '抄谱习作，留着已经写下的乐句停住的位置。'
        points:
          p1: '给抄谱员腾开桌面，顺次叠好工作页'
          p2: '在习作副本上找出已经写下的音乐从哪儿停住'
          p3: '守好还空的段落，别误在抄谱时填上'
        vignettes:
          stack: '格蕾塔收拾桌面，顺手拿开一页看着空白的纸。你扶住一叠谱，让埃米尔去对它前一页。原来那行空谱也该收在原来的次序里。格蕾塔把它放了回去，夹一张小条记下原来的位置。'
          hand: '眼前的乐句埃米尔抄得出，顺着写下去就要越过原来空着的一行。你请他在抄写停住的地方划个边记。交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。'
          finish: '你哼得出后世合唱团会唱的那段。格蕾塔现在就得带走副本，问原谱在这一页写到了哪儿。你指出分界，把后来听过的旋律留在心里。下一版会在你离开后拼合。'

text:
  en:
    name: Wolfgang Amadeus Mozart
    text: Austrian composer, 1756 to 1791. A child prodigy, he wrote operas, symphonies and concertos. His Don Giovanni had its first performance in Prague in 1787, and he left his Requiem unfinished when he died in Vienna in 1791.
  zh:
    name: 沃尔夫冈·阿马德乌斯·莫扎特
    text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
hook: {en: 'The curtain is ready. The parts are still changing.', zh: '幕要开了，分谱还没齐。'}
facts:
  prague_preparations:
    date: '1787-10-25'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_prague_prague_preparations]
    text:
      en: 'The letter records the postponement and identifies 29 October as the intended first performance.'
      zh: '信中记下首演推迟，并在25日把29日列为预计首演日。'
  prague_premiere:
    date: '1787-10-29'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_prague_prague_premiere]
    text:
      en: 'In the 4 November portion Mozart dates the first performance to 29 October and describes an enthusiastic reception.'
      zh: '莫扎特在11月4日写成的部分把首演记在10月29日，并描述了热烈的反响。'
  vienna_material:
    date: '1791'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_requiem_vienna_vienna_material]
    text:
      en: 'The surviving material is catalogued in two volumes, a delivery score containing Süssmayr’s completion and a working score.'
      zh: '馆藏分作两卷登记，即含苏斯迈尔补写的交付谱和工作稿。'
  vienna_hands:
    date: '1792'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_requiem_vienna_vienna_hands]
    text:
      en: 'The library discusses traces of multiple contributors. The scene supplies neither a recovered final page nor a purported last utterance.'
      zh: '馆方说明稿件上留有多位参与者的笔迹。'
