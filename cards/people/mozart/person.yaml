        occasion: 'Constanze écrit aux éditeurs de Leipzig au sujet de la commande. Sa lettre a été écrite des années après que le travail soit resté inachevé.'
      es:
        who: 'Constanza Mozart'
        quote: 'El propietario y encargado del Réquiem, cuyo nombre permanece totalmente oculto desde 1791, se ha presentado.'
        occasion: 'Constanze escribe a los editores de Leipzig sobre el encargo. Su carta fue escrita años después de que el trabajo quedara inconcluso.'
      ja:
        who: 'コンスタンツェ・モーツァルト'
        quote: '1791年以来名前が完全に隠されてきたレクイエムの所有者兼コミッショナーが名乗り出た。'
        occasion: 'コンスタンツェはライプツィヒの出版社にこの委員会について手紙を書いた。彼女の手紙は、作品が未完成のまま何年も経ってから書かれました。'
      ko:
        who: '콘스탄체 모차르트'
        quote: '1791년부터 이름이 완전히 숨겨졌던 레퀴엠의 소유자이자 커미셔너가 나섰다.'
        occasion: '콘스탄체는 라이프치히 출판사에 위원회에 관해 편지를 보냅니다. 그녀의 편지는 작업이 완료되지 않은 채 몇 년 후에 작성되었습니다.'
      ru:
