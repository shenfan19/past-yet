    text:
      en:
        name: An opera Prague loved
        place: Prague
        figure: Wolfgang Amadeus Mozart
        story: Mozart's Don Giovanni premieres in Prague, a city that had taken his Figaro to heart.
        relic: A manuscript leaf
        relic_desc: One page of fast, clean handwriting with almost no corrections.
        points:
          p1: "Hear the small jokes in the score"
          p2: "Be invited backstage"
          p3: "Speak for him to the theatre"
      zh:
        name: 布拉格喜爱的歌剧
        place: 布拉格
        figure: 沃尔夫冈·阿马德乌斯·莫扎特
        story: 莫扎特的《唐璜》在布拉格首演，这座城早已把他的《费加罗》放进了心里。
        relic: 一页乐谱手稿
        relic_desc: 字迹又快又干净，几乎没有涂改。
        points:
          p1: "听出总谱里的小心思"
          p2: "被邀进后台"
          p3: "替他向剧院说话"
