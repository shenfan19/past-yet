      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 23, req: {"any":[{"job":["musician"],"stat":{"finesse":7}},{"trait":["methodical","vigil"],"stat":{"wit":7}}]}}
        - {id: p2, kind: persuade, day: 24, req: {"any":[{"job":["musician"],"stat":{"finesse":9}},{"trait":["methodical","charismatic"],"stat":{"will":8}}]}}
      vignettes:
        - {id: cue, traits: [curious, quiet, methodical]}
        - {id: swap, traits: [kind, artistic, attached]}
        - {id: applause}
    text:
      en:
        name: 'The cue before the curtain'
        place: Prague
        figure: Wolfgang Amadeus Mozart
        story: 'Mozart wrote from Prague that Don Giovanni went on stage on 29 October 1787. An earlier letter describes problems getting the opera ready.'
        relic: 'A corrected rehearsal part'
        relic_desc: 'A fictional part with one rest crossed out.'
        points:
          p1: 'Reschedule the opening rehearsal after illness hits the small company and protect the 29 October premiere of Don Giovanni'
          p2: 'Have Mozart approve a complete Prague copy while the premiere parts are still in the theater'
        points_fail:
          p1: 'The choir and orchestra cannot fit in another rehearsal and the 29 October premiere is canceled again. The office recalls the employee after a loss of sync.'
          p2: 'Vienna''s revisions and the older Prague passage readings circulate together and a later company has to piece the versions together.'
        shift:
          p1:
            was: 'On 29 October 1787 Don Giovanni premiered in Prague after inadequate preparation and a singer''s illness forced postponements.'
          p2:
            was: 'In 1788 Mozart made changes for the Vienna production of Don Giovanni.'
            now: '{staff} gets a copy checked against the Prague performance and has the replacement pages kept separately. When another city changes the score, the Prague stage version remains legible.'
            who: mozart
            bio: 'When Mozart revised Don Giovanni he had a checked Prague copy to work from. He retained each city''s parts as a distinct version.'
        vignettes:
          cue: 'Anna’s part gives her one extra rest. You tap where the other voice enters and let her mark which word she can listen for. On the next run she comes in on time. The part still has the crossed-out rest, and Anna asks you to keep it visible.'
          swap: 'Jan has time to replace a page or fetch the missing singer. You take the walk to the stairs while he copies the page. By the time the curtain moves, both the new page and the singer are at the stand. Someone under the stage is still looking for the old copy.'
          applause: 'You know Mozart will write about the applause. Jan asks whether anyone in the house will hear the extra rest. You give him the corrected page and tell him where to listen for Anna. When you leave, the curtain has risen and the cue has yet to come.'
      zh:
        name: '开幕前的接句'
        place: 布拉格
        figure: 沃尔夫冈·阿马德乌斯·莫扎特
        story: '莫扎特从布拉格写信说，《唐璜》于1787年10月29日登台。更早的一封信提到筹备中的困难。'
        relic: '一页改过的排练分谱'
        relic_desc: '排练用谱，划掉了一个休止。'
        points:
          p1: '在小剧团有人病倒后重新排练开场，保住 10 月 29 日的《唐璜》首演'
          p2: '趁首演用的分谱仍在台上，请莫扎特核准一份注明布拉格版的完整副本'
        points_fail:
          p1: '狭窄的排练时间挤不出合唱和乐队重来一次，29 日的首演再度取消。行程同步失败，员工被召回。'
          p2: '后来为维也纳改写的段落和布拉格旧稿混着流传，排演的人得去找不同的分谱拼。'
        shift:
          p1:
            was: '1787 年 10 月 29 日，在排练准备不足及歌手患病造成延期后，《唐璜》在布拉格首演。'
          p2:
            was: '1788 年《唐璜》在维也纳上演时，莫扎特为当地演出另作改动。'
            now: '{staff}请莫扎特在首演后核准一份照布拉格演出保留的副本，并把后来替换的页另装。另一座城市改谱时，仍可以读到这份原来的演出版本。'
            who: mozart
            bio: '莫扎特为《唐璜》改谱时，有一份经过自己核准的布拉格演出副本可以对照。他保留了两地各自的演员用谱。'
        vignettes:
          cue: '安娜的分谱多抄了一个休止。你敲出另一声部进入的位置，让她标下该听哪个词。再合一遍时她进准了。划掉的休止还留在谱上，安娜请你别把它涂没。'
          swap: '扬来得及重抄一页，或去找还没回来的歌手。你替他跑一趟楼梯，他留下抄。幕一动，改过的谱和歌手都到了谱架前。台下还有人在找那张旧谱。'
          applause: '你知道莫扎特会在信里提到掌声。扬问，那一个多出来的休止会不会有人听出来。你交给他改好的谱，指给他在哪儿等安娜开口。离开时幕已经升起，那句还没到。'
  mozart_requiem_vienna:
    order: 112
    build_step: 4
    ready: true
    year: 1791
    date: '1791-11-15'
    stay: 2
    lon: 16.37
    lat: 48.21
    region: europe
    field: music
    tier: 3
    channels: {E: 2, G: 2}
    refs: [mozart_requiem_vienna_vienna_material, mozart_requiem_vienna_vienna_hands, mozart_nma_requiem, mozart_1791_requiem_illness]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 6, req: {"any":[{"job":["musician"],"stat":{"finesse":7}},{"job":["archivist"],"stat":{"wit":7}},{"trait":["methodical","vigil"],"stat":{"finesse":7}}]}}
        - {id: p2, kind: care, day: 7, req: {"any":[{"job":["doctor","physician","medical_teacher"],"item":"nano_kit"},{"job":["nurse","paramedic","pharmacist"],"item":"nano_kit","stat":{"wit":6}}]}}
      vignettes:
        - {id: stack, traits: [faithful, cheerful, calm]}
        - {id: hand, traits: [artistic, methodical, scholarly]}
        - {id: finish}
    text:
      en:
        name: 'Leave the hand visible'
        place: "Vienna"
        figure: "Wolfgang Amadeus Mozart"
        story: 'Mozart died in Vienna in December 1791 with the Requiem incomplete. The Austrian National Library preserves working material and a delivery score with contributions by Franz Xaver Süssmayr.'
        story_prose:
          opening:
            - 'In Vienna, a runner reaches for the neatest pile on the table. Mozart asks from his bed whether the instrumental parts for the opening are still there. Constanze asks the runner to wait. Some of the other pages are drafts that have not been put away.'
            - 'Mozart fell ill in his last weeks and died on 5 December 1791. The Requiem remained unfinished, although he had fully scored its opening. Here you can keep that section together and have a caregiver bring the office’s fictional medical kit.'
            - 'A reader who can distinguish the instrumental parts from working sheets can help Constanze sort them. Use someone with the kit and experience in care, after asking the household and Mozart what he wants.'
          points:
            p1: 'The runner turns two sheets and says both name the same voice. You and Constanze ask for the fully scored pile and check the pages to the end of its opening. The drafts go apart with a label. At the door the runner checks inside the wrapper and outside it so he knows which set to give the copyist first.'
            p2: 'Someone brings a clean sheet to the bedside and asks if there will be copying today. You explain the office kit to Mozart and his family and ask the copyist to wait in the other room. When Mozart wakes later, his fever has lifted. He asks them to move the table closer and opens only the page where he stopped.'
          outcomes:
            all: 'The opening parts can be used again, and Mozart can work at the table. The pages after them are still blank when you leave. Nobody yet knows how he will finish them.'
            p1: 'The opening is still one complete packet. Mozart dies on 5 December and the remaining score is left to others.'
            p2: 'Mozart recovers, but the original opening is scattered. This visit preserves the moment he wakes and asks to see the score.'
          none: 'Unfinished phrases lie by the bed. Mozart dies on 5 December and the several piles are still waiting for someone to identify them.'
          not_admitted: 'Constanze did not arrange for this visitor. The copyist stays outside and never sees what is in the pile.'
          desync: 'The opening parts become mixed with loose pages and the historical handover falls out of sync. The office recalls the traveller.'
          excerpts:
            p1: 'At the door the runner checks inside the wrapper and outside it so he knows which set to give the copyist first.'
            p2: 'He asks them to move the table closer and opens only the page where he stopped.'
        relic: 'An unfinished practice leaf'
        relic_desc: 'A fictional copying leaf showing where the surviving notes stop.'
        points:
          p1: 'Keep the finished opening of the Requiem together when illness forces a handover'
          p2: 'After he takes to his bed on 20 November, cure the fever that keeps him there'
        points_fail:
          p1: 'The opening parts get mixed with loose drafts and the first movement can no longer be reassembled. The office recalls the employee after the branch falls out of sync.'
          p2: 'In this branch the illness does not lift. He dies in Vienna on 5 December, aged 35.'
        shift:
          p1:
            was: 'In December 1791, Mozart died with the opening of the Requiem fully orchestrated and much of the rest unfinished.'
          p2:
            was: 'From 20 November 1791 Mozart was confined to bed. He died in Vienna on 5 December, and the parish register gave the cause as severe miliary fever.'
            now: '{staff} brings a medicine that breaks the fever, and in December he sits up again. In this timeline he finishes the Requiem in his own hand and goes on composing and performing in Vienna for many years.'
            who: mozart
            bio: 'Mozart recovered in the winter of 1791, finished the Requiem himself and went on composing and performing in Vienna for many years.'
        vignettes:
          stack: 'Greta is clearing the table and sets an empty-looking leaf aside. You hold the stack while Emil checks the page before it. The empty staff belongs in the sequence. Greta puts it back with a loose slip marking where it came from.'
          hand: 'Emil can copy the line in front of him and is ready to carry straight on into an unwritten staff. You have him rule a small mark in the margin at the point where copying stops. In the finished handoff, the next reader can see exactly where a new hand would have to begin.'
          finish: 'You can hum the passage as a future choir will sing it. Greta needs the copy now and asks where the written music on that page ends. You show her the boundary and keep the melody to yourself. The next version will be put together after you leave.'
      zh:
        name: '留下能认出的笔迹'
        place: "维也纳"
        figure: "沃尔夫冈·阿马德乌斯·莫扎特"
        story: '莫扎特1791年12月在维也纳去世时，《安魂曲》尚未完成。奥地利国家图书馆保有工作稿和含弗朗茨·克萨韦尔·苏斯迈尔补写的交付谱。'
        story_prose:
          opening:
            - '维也纳，送谱的人伸手去拿桌上最整齐的那摞。莫扎特从床边问，第一段的器乐页还在不在。康斯坦策让来人先等一等，另几张是没来得及收起的草稿。'
            - '莫扎特在 1791 年最后几周病重，12 月 5 日去世。《安魂曲》当时尚未完成，开篇已有完整配器。分支里可以先保住那一叠已写成的开篇，也可以带事务所的虚构医疗箱去帮忙照护。'
            - '认得乐器谱和草稿笔迹的人帮康斯坦策把纸分开。另需会照护病人且有医疗箱的员工，先问病人和家人的意愿。'
          points:
            p1: '跑腿的人把两张纸掀开，指给你看上面都有同样的声部名字。你和康斯坦策请他再找完整配器的那一叠，逐页核到开篇结尾，草页标明后另放。纸包递到门边时，他里面外面都看一遍，知道哪一包可以先交给抄谱人。'
            p2: '有人把鲜纸端到床边，问今天还抄不抄。你向莫扎特和家人说明带来的事务所医疗箱，然后让等着抄谱的人先回外屋。后来他醒了，烧已经退下去。他请家人把桌挪近一点，只翻开原来停住的那一页。'
          outcomes:
            all: '开篇的分谱能重新取用，莫扎特也能回到桌前。你离开时，后面还空着，没有人知道他会怎样写完。'
            p1: '第一段仍是一件完整的纸包。12 月 5 日莫扎特去世，后面的曲谱留给别人补写。'
            p2: '莫扎特从病中恢复，但开篇的原谱已经拆散。本趟保留他醒来想翻谱的经过。'
          none: '床边摊着还没抄完的乐句。莫扎特在 12 月 5 日去世，几摞纸仍等人来分辨。'
          not_admitted: '来人和康斯坦策没有约过时间。抄谱人停在屋外，没能看到那一叠纸写了什么。'
          desync: '开篇的完整分谱混进散页，原有谱件的交接没法对上，事务所召回员工。'
          excerpts:
            p1: '纸包递到门边时，他里面外面都看一遍，知道哪一包可以先交给抄谱人。'
            p2: '他请家人把桌挪近一点，只翻开原来停住的那一页。'
        relic: '一页留白的练习谱'
        relic_desc: '抄谱习作，留着已经写下的乐句停住的位置。'
        points:
          p1: '在病中交接时，护住莫扎特已经配完器的《安魂曲》开篇，别让散页错放'
          p2: '他 11 月 20 日卧床不起以后，治好那场让他起不了身的高烧'
        points_fail:
          p1: '第一段的分谱和草页混在一起，再拼不回完整的开篇。这条分支与史实脱节，员工被召回。'
          p2: '这条分支里那场病没有退，12 月 5 日他在维也纳去世，三十五岁。'
        shift:
          p1:
            was: '1791 年 12 月，莫扎特去世时，《安魂曲》的开篇已经配完器，其余多处仍是未完稿。'
          p2:
            was: '1791 年 11 月 20 日起莫扎特卧床不起，12 月 5 日在维也纳去世，教区登记的死因是急性粟粒热。'
            now: '{staff}带去的药退了他的高烧，12 月里他从床上坐了起来。这条时间线里，他亲手写完了《安魂曲》，又在维也纳作曲、演出了许多年。'
            who: mozart
            bio: '莫扎特在 1791 年冬天病愈，亲手写完《安魂曲》，此后在维也纳又作曲、演出了许多年。'
        vignettes:
          stack: '格蕾塔收拾桌面，顺手拿开一页看着空白的纸。你扶住一叠谱，让埃米尔去对它前一页。原来那行空谱也该收在原来的次序里。格蕾塔把它放了回去，夹一张小条记下原来的位置。'
          hand: '眼前的乐句埃米尔抄得出，顺着写下去就要越过原来空着的一行。你请他在抄写停住的地方划个边记。交稿后，下一个人翻到这里，就知道另一只手得从哪儿起笔。'
          finish: '你哼得出后世合唱团会唱的那段。格蕾塔现在就得带走副本，问原谱在这一页写到了哪儿。你指出分界，把后来听过的旋律留在心里。下一版会在你离开后拼合。'

text:
  en:
    name: Wolfgang Amadeus Mozart
    text: Austrian composer, 1756 to 1791. A child prodigy, he wrote operas, symphonies and concertos. His Don Giovanni had its first performance in Prague in 1787, and he left his Requiem unfinished when he died in Vienna in 1791.
  zh:
    name: 沃尔夫冈·阿马德乌斯·莫扎特
    text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
hook: {en: 'The curtain is ready. The parts are still changing.', zh: '幕要开了，分谱还没齐。'}
facts:
  prague_preparations:
    date: '1787-10-25'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_prague_prague_preparations]
    text:
      en: 'The letter records the postponement and identifies 29 October as the intended first performance.'
      zh: '信中记下首演推迟，并在25日把29日列为预计首演日。'
  prague_premiere:
    date: '1787-10-29'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_prague_prague_premiere]
    text:
      en: 'In the 4 November portion Mozart dates the first performance to 29 October and describes an enthusiastic reception.'
      zh: '莫扎特在11月4日写成的部分把首演记在10月29日，并描述了热烈的反响。'
  vienna_material:
    date: '1791'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_requiem_vienna_vienna_material]
    text:
      en: 'The surviving material is catalogued in two volumes, a delivery score containing Süssmayr’s completion and a working score.'
      zh: '馆藏分作两卷登记，即含苏斯迈尔补写的交付谱和工作稿。'
  vienna_hands:
    date: '1792'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [mozart_requiem_vienna_vienna_hands]
    text:
      en: 'The library discusses traces of multiple contributors. The scene supplies neither a recovered final page nor a purported last utterance.'
      zh: '馆方说明稿件上留有多位参与者的笔迹。'
bystanders:
  anna:
    invented: true
    text: {en: 'A fictional singer with a conflicting cue.', zh: '虚构歌手安娜，碰上一处对不上的接句。'}
  jan:
    invented: true
    text: {en: 'A fictional copyist who has time to do just one more job.', zh: '虚构抄谱员扬，开幕前自己只来得及再做一件事。'}
  greta:
    invented: true
    text: {en: 'A fictional attendant collecting a stack from the copying table.', zh: '虚构帮工格蕾塔，来抄谱桌上取走一叠纸。'}
  emil:
    invented: true
    text: {en: 'A fictional copyist intent on producing a clean copy.', zh: '虚构抄谱员埃米尔，想把副本抄得整洁。'}
