        quote: '《安魂曲》的所有者和委托者已经现身。自 1791 年以来，他的姓名一直保密。'
        occasion: '康斯坦策在《安魂曲》留下残稿多年后，写信给莱比锡出版商谈到委托人。'
      de:
        who: 'Constanze Mozart'
        quote: 'Der Eigenthümer und Besteller des Requiems, dessen Name seit 1791. gänzlich verborgen geblieben ist, hat sich eingefunden'
