    invented: true
    text: {en: 'A fictional reader checking which line is from the book.', zh: '虚构读者莱拉，要核对哪一行能在书里找到。'}
  farhad:
    invented: true
    text: {en: 'A fictional scribe who wants an ending before the lamp goes.', zh: '虚构抄写员法尔哈德，撤灯前想收住这一页。'}
