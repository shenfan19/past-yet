        place: "Rayy"
        figure: "Al-Razi"
        story: "On the wards of a hospital Al-Razi compares patient after patient, writes down the course of smallpox and of measles, and shows that they are two diseases."
        relic: "A page of case notes"
        relic_desc: "A page of case notes covered with fever readings and dates."
        points:
          p1: "Compare the course of two fevers"
          p2: "Tend the patients on the ward"
          p3: "Write the cases down one by one"
      zh:
        name: "把天花与麻疹分开"
        place: "雷伊"
        figure: "拉齐"
        story: "拉齐在医院的病房里一个个比对病人，写下天花和麻疹各自的病程，说明它们是两种病。"
        relic: "一页病例笔记"
        relic_desc: "一页写满了热度和日期的病例笔记。"
        points:
          p1: "对比两种热病的过程"
          p2: "照看病房里的病人"
          p3: "把病例逐条记下"
text:
  en:
    name: "Al-Razi"
    text: "Persian physician, born about 865, died in 925. He practised in Rayy and Baghdad, left many case records, and in one treatise distinguished smallpox from measles."
  zh:
    name: "拉齐"
    text: "波斯医生，约 865 年生，925 年去世。他在雷伊和巴格达行医，留下大量病例记录，在一部专著里把天花与麻疹区分开来。"
