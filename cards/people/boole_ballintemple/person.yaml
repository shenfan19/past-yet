    text:
      en:
        name: "Wet clothes and a lecture"
        place: "Ballintemple, Cork"
        figure: "George Boole"
        story: 'Boole''s 1854 Laws of Thought represents logical operations with algebra. One of its laws says that repeating the same selection produces the same class.'
        relic: "A page of logic"
        relic_desc: "A page of equations in which letters stand for yes and no."
        points:
          p1: 'Get the lecture notes to the college dry before Boole sets out in heavy rain, and keep his class on schedule'
          p2: 'Have Boole approve a note to Todhunter identifying tables to recalculate and passages of the supplement still under revision'
          p3: 'Treat the fever that falls on his lungs after the wet day, and bring Boole through the pneumonia'
        points_fail:
          p1: 'The notes are soaked and nobody has a duplicate. The class is missed, and the office recalls the employee.'
          p2: 'The publisher receives papers without a list of which parts have been checked and which still need work.'
          p3: 'The fever reaches his lungs and nobody can stop it. In this branch, too, Boole dies in Ballintemple on 8 December, at forty nine, and leaves five daughters.'
        shift:
          p1:
            was: 'University College Cork records that Boole walked from home to teach in heavy rain on November 24, 1864.'
          p2:
            was: 'Boole died in December 1864. Todhunter prepared the supplement. His preface records a table recalculated after a sign error in the manuscript.'
            now: 'Boole leaves a short list of checks. An editor opening the supplement can assign the table for independent review and file the editorial decision beside the draft.'
            who: boole_ballintemple
            bio: 'Boole taught in Cork and wrote mathematical textbooks. Surviving editions and papers preserve corrections he intended to make.'
          p3:
            was: 'On 8 December 1864 Boole died at Ballintemple of pleuro-pneumonia, after an illness of about two and a half weeks that followed his lecturing in wet clothes.'
            now: 'The fever broke in the second week of December. Boole was back at Queen''s College for the next term, and saw his book on differential equations into its revised edition himself.'
            who: boole_ballintemple
            bio: 'Boole recovered from the pneumonia of the winter of 1864. He kept teaching at Cork and saw his five daughters grow up.'
        vignettes:
          repeat: 'You ask the learner to pick the even numbers, then to pick the even numbers again from the pile they just selected. They laugh once, then write down why the second choice gave back the same pile.'
          border: 'The learner starts to put a slip in both piles without saying which property they used. You ask for the condition first. They label each stack before trying the operation again.'
          example: 'You turn the selection into a few slips the learner can move. When they copy the conclusion, they can still point to the condition it came from.'
      zh:
        name: "湿衣服与一堂课"
        place: "科克巴林滕普尔"
        figure: "乔治·布尔"
        story: '布尔 1854 年出版的《思维规律研究》用代数表示逻辑运算。其中一条规律是，重复同一选择，所得的类不变。'
        relic: "一页逻辑演算"
        relic_desc: "一页方程，其中的字母代表是和否。"
        points:
          p1: '大雨中从家出门前，把要用的讲义干干地送到学院，护住布尔当天的课'
          p2: '请布尔核准给托德亨特的一页交代，标明待复算的表格和仍未定下的补编段落'
          p3: '淋雨后的高烧落到肺上，治好布尔的肺炎，让他挺过这个冬天'
        points_fail:
          p1: '讲义淋湿且没人有备份，当天课没能开讲，事务所因同步失败召回员工。'
          p2: '出版社拿到稿件时，补编里哪些算过、哪些还待查并无一张总单。'
          p3: '高烧落到肺上，没人拦得住。这条分支里布尔仍在 12 月 8 日死于巴林滕普尔，四十九岁，留下五个女儿。'
        shift:
          p1:
            was: '科克学院档案记布尔在 1864 年 11 月 24 日的大雨里从家赶去教学。'
          p2:
            was: '布尔于 1864 年 12 月去世，托德亨特后来整理了补编。编者序记有一张表因稿内符号写错而需重新算过。'
            now: '布尔留下逐项复算的短单。编辑打开补编时，可以先让一位校对者单独核表，再把编辑决定附回原稿。'
            who: boole_ballintemple
            bio: '布尔在科克教课并写数学教材。现存印本与稿件还保有他计划修订的痕迹。'
          p3:
            was: '1864 年 12 月 8 日，布尔在巴林滕普尔死于胸膜肺炎，此前他穿着湿衣讲课，病了大约两个半星期。'
            now: '12 月中旬高烧退了。下一学期布尔回到女王学院上课，微分方程那本书的修订本由他自己改完。'
            who: boole_ballintemple
            bio: '布尔熬过了 1864 年冬天的肺炎，继续在科克教书，看着五个女儿长大。'
        vignettes:
          repeat: '你请学算者先挑出偶数，再从刚挑出的那一堆里挑偶数。他笑了一声，随后记下为什么第二次挑出的还是原来那一堆。'
          border: '学算者没说依据什么，就准备把一张纸同时放进两堆。你请他先说条件。他给各堆贴上标签，再试一遍。'
          example: '你把选择过程换成几张能挪动的纸条。学算者抄下结论时，还能指出它对应哪个条件。'
text:
  en:
    name: George Boole
    text: English mathematician, 1815 to 1864, first professor of mathematics at Queen's College Cork. He built an algebra of logic that became the basis of digital circuits, and died of pneumonia at Ballintemple.
  zh:
    name: 乔治·布尔
    text: 英国数学家，1815 年生，1864 年去世，科克女王学院第一位数学教授。他建立了逻辑代数，后来成为数字电路的基础，因肺炎在巴林特普尔去世。
