    text:
      en:
        name: "Wet clothes and a lecture"
        place: "Ballintemple, Cork"
        figure: "George Boole"
        story: 'It is raining in Cork, and George Boole has a class to teach. A student is still puzzling over an exercise from The Laws of Thought. Across town, a table in Boole’s unfinished work on differential equations will eventually have to be calculated again, all because of one sign.'
        story_prose:
          opening:
            - 'Cork, Ireland, November 1864. George Boole is the first professor of mathematics at Queen’s College. Ten years ago, in The Laws of Thought, he wrote the laws of reasoning in algebra, and one of them says that choosing twice by the same condition leaves the choice unchanged. He still has a book on differential equations unfinished.'
            - 'In history, on 24 November he went from his home to the college through heavy rain to teach. On 8 December he died of pleuro-pneumonia at his home in Ballintemple. The next year Todhunter put together the supplement, and wrote in the preface that the table at the end of the book had been recalculated by Sephton because of a wrong sign in a formula. In this branch, a student clutching numbered slips is still wondering which slip will drop out when he chooses a second time by the same condition.'
            - 'Three kinds of people can help on this trip: someone punctual who will carry the lecture notes through the rain, someone who can check a formula and find the error, and someone who knows nursing and can take over a night watch.'
          outcomes:
            all: 'On those December nights the lamp in Boole’s house burned until morning, and one watch followed another. The paper marker was still in its place the next year.'
            p3: 'On those nights the lamp in Boole’s house burned until morning, and one watch followed another.'
            p2: 'The next year the editor opened the folder, and the paper marker was still in its place. Sephton began his calculation from that sign.'
            p1: 'At the lecture on 24 November, not one page of the notes on the desk was wet.'
          none: 'The rain went on into December. In the house at Ballintemple, the people at the bedside did not close their eyes all night.'
          desync: 'The rain that day soaked the lecture notes into a pulp, and the lectern stood empty. {staff} was recalled by the office before the next lecture.'
          not_admitted: '{staff} never got through the college door. The rain kept falling, and the lecture notes still lay on the table in Boole’s house.'
          points:
            p1: 'On 24 November the rain was heavy. Before Boole left the house, {staff} wrapped the lecture notes in two layers of oilcloth, carried them under a coat to the college ahead of him, and put them in the drawer of the lectern. When Boole came in his coat was dripping, and he pulled open the drawer to find the notes dry. He spread them out, wiped his hands on his cuff, and began.'
            p2: '{staff} laid the table beside the formula that produced it and worked back line by line. At one place the numbers would not agree; traced upward, the fault was a sign in the formula written the wrong way round. {staff} did not alter the manuscript, only slipped a paper marker into that page, noting which line and which sign.'
            p3: 'Early in December Boole fell ill at home, and his family took turns at his bedside, several nights without sleep. {staff} took over the night watch as nursing requires, turning him on time, giving him water, tucking in the blanket, and writing down on a sheet each thing that happened in the night. The family left the lamp burning and went to sleep for a few hours. When they came back before dawn, the fire was still going well, and the sheet at the bedside was filled with the hours of the night.'
          excerpts:
            p3: 'The family left the lamp burning and went to sleep for a few hours. When they came back before dawn, the fire was still going well, and the sheet at the bedside was filled with the hours of the night.'
            p2: 'At one place the numbers would not agree; traced upward, the fault was a sign in the formula written the wrong way round. {staff} did not alter the manuscript, only slipped a paper marker into that page, noting which line and which sign.'
            p1: 'When Boole came in his coat was dripping, and he pulled open the drawer to find the notes dry. He spread them out, wiped his hands on his cuff, and began.'
        relic: "A page of logic"
        relic_desc: 'A classroom exercise showing what happens when the same selection is applied twice.'
        points:
          p1: 'Get the lecture notes to the college dry before Boole sets out in heavy rain, and keep his class on schedule'
          p2: 'Compare the table with the formula that produced it and flag the sign for the next person who checks the manuscript'
          p3: 'Find someone to cover the evening watch so the family at Boole’s bedside can take a break'
        points_fail:
          p1: 'The notes are soaked and nobody has a duplicate. The class is missed, and the office recalls the employee.'
          p2: 'The table goes into the folder with the formula unchecked. Sephton will have to trace the error later.'
          p3: 'The family keeps the evening watch without relief. One of them leaves the room only long enough to set the lamp down.'
        shift:
          p1:
            was: 'University College Cork records that Boole walked from home to teach in heavy rain on November 24, 1864.'
          p2:
            was: 'Boole died in December 1864. Todhunter prepared the supplement. His preface records a table recalculated after a sign error in the manuscript.'
            now: 'When the editor opens the folder, a paper marker takes him straight to the formula. Sephton can start by checking its sign.'
          p3:
            was: 'Boole died of pleuro-pneumonia at home in Ballintemple on 8 December 1864.'
            now: '{staff} finds someone who can take the chair for the evening. The family leaves the lamp burning and gets a few hours of rest before coming back.'
        vignettes:
          repeat: '{staff} asks the student to pick out the even numbers, then to do it again with the slips in hand. The student looks for one to put down. There isn’t one.'
          border: 'The student is about to write down a row of numbers when {staff} asks how they got the first one. The student draws a line back to the formula before copying the rest.'
          example: 'The student slides the finished exercise under a book to keep it flat. At the edge of the page, a paper marker sticks out just far enough to take hold of.'
      zh:
        name: "湿衣服与一堂课"
        place: "科克巴林滕普尔"
        figure: "乔治·布尔"
        story: '科克在下雨，乔治·布尔还有一堂课要上。一名学生拿着《思维规律研究》里的习题，还没想通第二遍该怎么选。城的另一头，布尔还没写完的微分方程书里，一张表以后得重算，只因为公式里的一个符号。'
        story_prose:
          opening:
            - '1864 年 11 月，爱尔兰科克。乔治·布尔是女王学院的第一位数学教授。十年前，他在《思维规律研究》里用代数写下推理的规律，其中一条说，照同一个条件选两遍，选出来的东西不变。这时他手上还有一部没写完的微分方程书。'
            - '史实里，11 月 24 日他冒着大雨从家里赶到学院上课。12 月 8 日，他因胸膜肺炎在巴林滕普尔的家中去世。第二年，托德亨特整理出补编，序里写明书末那张表因为公式的一个符号写错，由塞普顿重算过。在这条分支里，有个学生攥着编号纸条，还在想照同一个条件选第二遍，会少掉哪一张。'
            - '这一趟用得上三种人：守时、肯冒雨把讲义送到的人，核得了公式、找得出错处的人，懂护理、接得住一班夜里照护的人。'
          outcomes:
            all: '十二月的那几夜，布尔家的灯整夜亮着，守夜的人换了一班又一班。那张纸签，第二年还夹在原处。'
            p3: '那几夜，布尔家的灯整夜亮着，守夜的人换了一班又一班。'
            p2: '第二年，编辑打开文件夹，那张纸签还夹在原处。塞普顿从那个符号算起。'
            p1: '11 月 24 日那堂课，讲台上的讲义一页也没有湿。'
          none: '雨一直下到十二月。巴林滕普尔那栋房子里，守在床边的人一夜没合眼。'
          desync: '那天的雨把讲义泡成了一团，讲台上空着。{staff}没等到下一堂课，就被事务所召了回来。'
          not_admitted: '{staff}没能进学院的门。雨还在下，讲义还摊在布尔家里的桌上。'
          points:
            p1: '11 月 24 日，雨下得很大。布尔出门之前，{staff}把讲义用油布包了两层，揣在怀里先一步赶到学院，放进讲台的抽屉。布尔进门时外衣在滴水，他拉开抽屉，讲义是干的。他把它摊开，用袖口擦了擦手，开始讲。'
            p2: '{staff}把那张表和推出它的公式摊在一起，一行一行往回算。算到一处，数对不上，顺着往上查，是公式里一个符号写反了。{staff}没有改原稿，只在那一页夹了一张纸签，写明哪一行、哪个符号。'
            p3: '十二月初，布尔病倒在家里，家人轮流守着，好几夜没合眼。{staff}照护理的规矩接下晚上那一班，按时替他翻身、喂水、掖好毯子，把夜里的情形一条条记在纸上。家人留着灯，先去睡了几个钟头。天亮前回来时，炉火还旺着，床头的纸上记满了一夜的钟点。'
          excerpts:
            p3: '家人留着灯，先去睡了几个钟头。天亮前回来时，炉火还旺着，床头的纸上记满了一夜的钟点。'
            p2: '算到一处，数对不上，顺着往上查，是公式里一个符号写反了。{staff}没有改原稿，只在那一页夹了一张纸签，写明哪一行、哪个符号。'
            p1: '布尔进门时外衣在滴水，他拉开抽屉，讲义是干的。他把它摊开，用袖口擦了擦手，开始讲。'
        relic: "一页逻辑演算"
        relic_desc: '一张课堂习题纸，演示照同一条件筛选两次会得到什么。'
        points:
          p1: '大雨中从家出门前，把要用的讲义干干地送到学院，护住布尔当天的课'
          p2: '拿公式和算出来的表格对照，把可能有问题的符号标出来，留给下一位核稿的人'
          p3: '找人来接一班晚间照护，让守在布尔床边的家人歇一会儿'
        points_fail:
          p1: '讲义淋湿且没人有备份，当天课没能开讲，事务所因同步失败召回员工。'
          p2: '表格装进文件夹，公式还没核过。以后还得塞普顿自己查出错处。'
          p3: '晚上没人替班。守在床边的人只有放下灯的时候才离开一小会儿。'
        shift:
          p1:
            was: '科克学院档案记布尔在 1864 年 11 月 24 日的大雨里从家赶去教学。'
          p2:
            was: '布尔于 1864 年 12 月去世，托德亨特后来整理了补编。编者序记有一张表因稿内符号写错而需重新算过。'
            now: '编辑一打开文件夹，就能顺着纸签翻到公式。塞普顿可以从那个符号开始核算。'
          p3:
            was: '1864 年 12 月 8 日，布尔因胸膜肺炎在巴林滕普尔的家中去世。'
            now: '{staff}找到人来坐一班。家人留着灯，先睡了几个钟头，再回来接替。'
        vignettes:
          repeat: '窗外下着雨。{staff}请学生挑出偶数，再拿着手里的纸条挑一遍。学生想找一张放回桌上，手里却一张都不用放。'
          border: '油灯底下，学生要抄一排数字，{staff}问第一个是怎么算来的。他先用笔尖划了一道线连回公式，再往下抄。'
          example: '学生把做完的习题压在书下，书脊磨得发白。页边露出一小截纸签，刚好够手指捏住。'
text:
  en:
    name: George Boole
    text: English mathematician, 1815 to 1864, first professor of mathematics at Queen's College Cork. He built an algebra of logic that became the basis of digital circuits, and died of pneumonia at Ballintemple.
  zh:
    name: 乔治·布尔
    text: 英国数学家（1815–1864），科克女王学院第一位数学教授。他创立的逻辑代数后来用于数字电路。1864 年，他因胸膜肺炎在巴林滕普尔去世。
hook: {en: 'What changes if you choose twice?', zh: '照同一个条件选两遍，会少掉哪一张？'}
facts:
  laws_of_thought:
    date: '1854'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [boole_ballintemple_primary]
    text:
      en: 'Boole''s 1854 Laws of Thought represents logical operations with algebra. One of its laws says that repeating the same selection produces the same class.'
      zh: '布尔 1854 年出版的《思维规律研究》用代数表示逻辑运算。其中一条规律是，重复同一选择，所得的类不变。'
  lecture:
    date: '1864-11-24'
    stay_day: 8
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [boole_ballintemple_cork_rain]
    text: {en: 'Boole was caught in rain on his way to Queen’s College and continued teaching that day.', zh: '布尔在去女王学院途中遇到大雨，当天仍继续上课。'}
    line:
      en: 'On 24 November 1864 Boole taught at Queen’s College in Cork.'
      zh: '1864 年 11 月 24 日，布尔在科克女王学院授课。'
      zh-Hant: '1864 年 11 月 24 日，布爾在科克女王學院授課。'
      fr: 'Le 24 novembre 1864, Boole enseigna au Queen’s College de Cork.'
      es: 'El 24 de noviembre de 1864, Boole enseñó en el Queen''s College de Cork.'
      ja: '1864年11月24日、ブールはコークのクイーンズ・カレッジで教鞭を執った。'
      ko: '1864년 11월 24일 Boole은 Cork에 있는 Queen''s College에서 가르쳤습니다.'
      ru: '24 ноября 1864 года Буль преподавал в Королевском колледже в Корке.'
  death:
    date: '1864-12-08'
    stay_day: 22
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [boole_ballintemple_cork_rain]
    text: {en: 'Boole died of pleuro-pneumonia. The reported duration of illness leaves its precise onset uncertain.', zh: '布尔死于胸膜肺炎。记录的病程长短并不支持把发病定在某一天。'}
    line:
      en: 'On 8 December 1864 Boole died at his home in Ballintemple.'
      zh: '1864 年 12 月 8 日，布尔在巴林滕普尔的家中去世。'
      zh-Hant: '1864 年 12 月 8 日，布爾在巴林滕普爾的家中去世。'
      fr: 'Le 8 décembre 1864, Boole mourut à son domicile de Ballintemple.'
      es: 'El 8 de diciembre de 1864 Boole murió en su casa de Ballintemple.'
      ja: '1864 年 12 月 8 日、ブールはバリンテンプルの自宅で亡くなりました。'
      ko: '1864년 12월 8일 Boole은 Ballintemple에 있는 그의 집에서 사망했습니다.'
      ru: '8 декабря 1864 года Буль умер в своем доме в Баллинтемпле.'
  supplement:
    date: '1865-11'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [boole_ballintemple_todhunter_preface]
    text: {en: 'In the supplement preface Todhunter states that J. Sephton recomputed the final table because of a wrong sign in a formula.', zh: '托德亨特在补编序言中说，J. 塞普顿为书末的表做了复算，因为公式的一个符号有误。'}
    line:
      en: 'In November 1865, Isaac Todhunter’s preface recorded who had recalculated the table and why.'
      zh: '1865 年 11 月，艾萨克·托德亨特在序中写明了是谁复算了那张表、又为何要复算。'
      zh-Hant: '1865 年 11 月，艾薩克·托德亨特在序中寫明瞭是誰復算了那張表、又為何要復算。'
      fr: 'En novembre 1865, la préface d’Isaac Todhunter indiquait qui avait recalculé le tableau et pourquoi.'
      es: 'En noviembre de 1865, el prefacio de Isaac Todhunter registró quién había recalculado la tabla y por qué.'
      ja: '1865 年 11 月、アイザック・トドゥハンターの序文には、誰がその表を再計算したのか、そしてその理由が記録されています。'
      ko: '1865년 11월, Isaac Todhunter의 서문에는 누가 테이블을 다시 계산했는지, 그 이유는 기록되어 있습니다.'
      ru: 'В ноябре 1865 года в предисловии Исаака Тодхантера было записано, кто и почему пересчитал таблицу.'
bystanders:
  boole_ballintemple_reader:
    invented: true
    text: {en: 'An invented learner sorting numbered slips for a small exercise.', zh: '一位虚构的学算者，拿编号纸条做一道小练习。'}
quotes:
  boole_ballintemple_beginner:
    order: 1
    tier: full
    date: '1859-02'
    checked: official_record
    original: en
    sources: [boole_ballintemple_own_preface]
    text:
      en:
        who: 'George Boole'
        quote: 'It was my object, first of all, to meet the wants of those who had no previous acquaintance with the subject'
        occasion: 'Preface to A Treatise on Differential Equations, Queen’s College, Cork, February 1859.'
      zh:
        who: '乔治·布尔'
        quote: '我首先想照顾那些从未接触过这门课的人。'
        occasion: '《微分方程论》序言，1859 年 2 月，科克女王学院（游戏译文）。'
      zh-Hant:
        who: '喬治·布爾'
        quote: '我首先想照顧那些從未接觸過這門課的人。'
        occasion: '《微分方程論》序言，1859 年 2 月，科克女王學院（遊戲譯文）。'
      fr:
        who: 'George Boole'
        quote: 'Mon objectif était avant tout de répondre aux besoins de ceux qui n''avaient aucune connaissance préalable du sujet.'
        occasion: 'Préface à A Treatise on Differential Equations, Queen''s College, Cork, février 1859.'
      es:
        who: 'George Boole'
        quote: 'Mi objetivo era, en primer lugar, satisfacer las necesidades de aquellos que no tenían ningún conocimiento previo del tema.'
        occasion: 'Prefacio al Tratado sobre ecuaciones diferenciales, Queen''s College, Cork, febrero de 1859.'
      ja:
        who: 'ジョージ・ブール'
        quote: '私の目的は、まず第一に、これまでこの主題についてまったく知らなかった人々の要望に応えることでした。'
        occasion: '微分方程式に関する論文の序文、クイーンズ カレッジ、コーク、1859 年 2 月。'
      ko:
        who: '조지 불'
        quote: '우선, 이 주제에 대해 이전에 전혀 알지 못했던 사람들의 요구를 충족시키는 것이 나의 목표였습니다.'
        occasion: '미분 방정식에 관한 논문 서문, Queen''s College, Cork, 1859년 2월.'
      ru:
        who: 'Джордж Буль'
        quote: 'Моей целью было, прежде всего, удовлетворить потребности тех, кто раньше не был знаком с этим предметом.'
        occasion: 'Предисловие к «Трактату о дифференциальных уравнениях», Королевский колледж, Корк, февраль 1859 г.'
  boole_ballintemple_thought:
    order: 2
    tier: none
    date: '1854'
    checked: official_record
    original: en
    sources: [boole_ballintemple_primary, boole_ballintemple_thought_text]
    text:
      en:
        who: 'George Boole'
        quote: 'to investigate the fundamental laws of those operations of the mind by which reasoning is performed'
        occasion: 'From the opening of An Investigation of the Laws of Thought, Chapter I, 1854.'
      zh:
        who: '乔治·布尔'
        quote: '探究人们借以推理的那些思维活动，找出其中的基本规律。'
        occasion: '《思维规律研究》第一章开头，1854 年（游戏译文）。'
      zh-Hant:
        who: '喬治·布爾'
        quote: '探究人們藉以推理的那些思維活動，找出其中的基本規律。'
        occasion: '《思維規律研究》第一章開頭，1854 年（遊戲譯文）。'
      fr:
        who: 'George Boole'
        quote: 'étudier les lois fondamentales des opérations de l''esprit par lesquelles le raisonnement est effectué'
        occasion: 'Dès l’ouverture d’Une enquête sur les lois de la pensée, chapitre I, 1854.'
      es:
        who: 'George Boole'
        quote: 'Investigar las leyes fundamentales de aquellas operaciones de la mente mediante las cuales se realiza el razonamiento.'
        occasion: 'Desde la apertura de Una investigación de las leyes del pensamiento, Capítulo I, 1854.'
      ja:
        who: 'ジョージ・ブール'
        quote: '推論が実行される心の働きの基本法則を調査すること'
        occasion: '『思考法則の調査』第 1 章の冒頭より、1854 年。'
