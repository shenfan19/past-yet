text:
  en:
    name: Giovanni del Virgilio
    text: Italian scholar and poet of Bologna, active in the early fourteenth century, who lectured there on the Latin poets. About 1319 he wrote to Dante in Latin verse, and their exchange of eclogues began the revival of Latin pastoral poetry.
  zh:
    name: 乔万尼·德尔·维尔吉利奥
    text: 博洛尼亚的意大利学者与诗人，活跃于 14 世纪初，在那里讲授拉丁诗人。1319 年前后他用拉丁诗写信给但丁，两人往来的牧歌开了拉丁田园诗复兴的先声。
