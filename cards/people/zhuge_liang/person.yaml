    text: {en: 'Zhuge Liang fell ill and died with the army at Wuzhang Plains during his last campaign.', zh: '诸葛亮最后一次北伐驻五丈原，患病而卒于军。'}
  recommendation:
    date: '234'
    checked: official_record
    level: careful
    use: [history, story, wiki]
    sources: [sanguozhi_jiang_wan]
    note: 'The biography gives the order of events but does not date the recommendation precisely.'
    text: {en: 'Zhuge Liang privately asked the emperor to entrust affairs to Jiang Wan if he died.', zh: '诸葛亮曾密表后主，建议自己若有不测，由蒋琬接手。'}
  appointment:
    date: '234'
    checked: official_record
    level: usable
