    text:
      en:
        name: Three visits to the thatched cottage
        place: Longzhong area
        figure: Zhuge Liang
        story: Chen Shou's biography says Zhuge Liang worked his own fields and liked to sing the Song of Liangfu. Xu Shu told Liu Bei that this was a man one goes to see and cannot summon. Liu Bei went three times before he met him, and when they met he sent the others out of the room before he spoke. A different account, quoted in Pei Songzhi's notes, has Zhuge Liang seek Liu Bei out first. The trip uses the first account and the conventional year 207 for its setting.
        relic: A sheet with a tune noted on it
        relic_desc: A keepsake made up for the game, the tune of a slow song noted down at the edge of a field, with half the words missing.
        points:
          p1: Find a place in Longzhong and work in the fields until the third visit
          p2: Hear the song across the field and note the tune
          p3: When the guest asks the others to leave, go out and wait until the door opens again
        vignettes:
          future_novel: 'You ask the neighbour who works the next field, a man made up for the game, whether the one in the cottage will some day borrow arrows under cover of a river fog. He straightens his back. “He has not so much as a boat. Where did you hear that?” In your report you mark the arrows as an episode from a much later novel.'
          door: 'The guest comes a third time, and once inside he asks the others to leave. You and the neighbour go out beyond the fence. You do not hear a word of what is said behind the door. The books have it, later.'
          song: 'Someone is singing at the far end of the field, a slow tune. The neighbour says the man often sings that one, the Song of Liangfu. You note the tune down and do not get all the words.'
      zh:
        name: 草庐三访
        place: 隆中一带
        figure: 诸葛亮
        story: 《三国志·诸葛亮传》记诸葛亮躬耕陇亩，好为《梁父吟》。徐庶对刘备说，此人可就见，不可屈致。刘备三次前往才见到他，见面时先屏退旁人，然后开口。裴松之注另引《魏略》，记的是诸葛亮先去见刘备。
        relic: 一页记着调子的纸
        relic_desc: 田边记下的一支慢歌的调子，词缺了一半。
        points:
          p1: 在隆中落脚，下田干活，等到第三次来访
          p2: 听见田那头的歌，把调子记下来
          p3: 客人请旁人退出时，退到门外，守到门再打开
        vignettes:
          future_novel: '你问一同下田的邻人，草庐里那位将来会不会趁江上起雾去借箭。这位邻人是游戏里编出来的。他直起腰：「他连船都没有。你上哪儿听来的？」你在归来报告里把借箭那段另标为后世小说的情节。'
          door: '客人第三次来，进门后请旁人都出去。你和邻人退到篱笆外。门里说了什么，你一句也没听见，后来的书上记着。'
          song: '田那头有人唱歌，调子很慢。邻人说，那位常唱这个，叫《梁父吟》。你把调子记了下来，词没有记全。'
text:
  en:
    name: Zhuge Liang
    text: An adviser to Liu Bei who later served as chancellor of Shu Han. His biography in the Records of the Three Kingdoms says he worked his own fields at Longzhong and liked to sing the Song of Liangfu, and both the biography and his own memorial preserve the account of Liu Bei's three visits. The story of Zhuge Liang borrowing arrows with straw boats belongs to chapter 46 of Romance of the Three Kingdoms.
  zh:
    name: 诸葛亮
    text: 刘备的谋臣，后来任蜀汉丞相。陈寿《三国志》记他在隆中躬耕陇亩，好为《梁父吟》，《三国志》和他自己的《前出师表》都留下了三顾的说法。诸葛亮草船借箭是《三国演义》第四十六回的情节。
hook: {en: 'Three visits, and then the door is shut', zh: 三次来访，然后门关上了}
facts:
  visits:
    date: '207'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [sanguozhi_zhuge, chushi_biao]
    note: The date is the conventional scenario year. The memorial is Zhuge Liang's own official account, preserved by Chen Shou. The two texts need not be independent. Pei Songzhi preserves a competing account.
    text:
      en: Chen Shou describes Liu Bei going three times, and Zhuge Liang's earlier memorial also mentions three visits.
      zh: 陈寿记刘备三往乃见，诸葛亮此前的《前出师表》也写到三顾。
  farming:
    date: '207'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [sanguozhi_zhuge, chushi_biao]
    note: A habit, with no date of its own. The memorial says he ploughed his own land at Nanyang.
    text:
      en: Chen Shou writes that Zhuge Liang worked his own fields and liked to sing the Song of Liangfu.
      zh: 陈寿记诸葛亮躬耕陇亩，好为《梁父吟》。
  recommended:
    date: '207'
    checked: official_record
    level: usable
    use: [story]
    sources: [sanguozhi_zhuge]
    text:
      en: Xu Shu tells Liu Bei that Zhuge Liang is a man one goes to see and cannot summon, and that the general should call on him in person.
      zh: 徐庶对刘备说，此人可就见，不可屈致，将军宜枉驾顾之。
  screened:
    date: '207'
    checked: official_record
    level: usable
    use: [story]
    sources: [sanguozhi_zhuge]
    text:
      en: When Liu Bei at last meets Zhuge Liang, he sends the others away before he asks his question.
      zh: 刘备见到诸葛亮后，先屏退旁人，然后发问。
