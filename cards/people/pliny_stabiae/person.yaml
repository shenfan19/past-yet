    text:
      en:
        name: 'The wind at Stabiae'
        place: "Stabiae"
        figure: "Pliny the Elder"
        story: 'Pliny the Younger later wrote to Tacitus about his uncle reaching Pomponianus at Stabiae during the eruption of 79 CE. The wind that carried him in prevented the loaded ships from leaving.'
        relic: "A wax tablet"
        relic_desc: "A wooden tablet with wax for notes, scratched with a stylus."
        points:
          p1: 'When the shallows and the debris from the mountain block the shore, help the Elder Pliny bring the ship in to Rectina’s coast and take her aboard'
          p2: 'Under the falling pumice and stones, keep the Elder Pliny’s ship on its course to Stabiae, so that he lands and reaches Pomponianus'
          p3: 'When the smell of sulphur and the dust close in on the beach at Stabiae, keep his breathing clear and save the Elder Pliny, getting him off the shore alive'
        points_fail:
          p1: 'The ship could not come in to her shore, and in this branch nobody took Rectina aboard.'
          p2: 'The ship was turned back before Stabiae and Pliny never reached Pomponianus. The branch came apart from history and the office recalled the employee.'
          p3: 'He fell on the beach at Stabiae as history has it, and in this branch too he could not be kept.'
        shift:
          p1:
            was: 'On the day of the eruption in 79, the Elder Pliny changed his plans after a message from Rectina begging to be taken away; shallows and debris from the mountain blocked the shore, and he turned for Pomponianus at Stabiae.'
            now: 'The ship came in to her shore and Rectina was taken aboard. She went on with the ship to Stabiae.'
          p2:
            was: 'Pliny the Younger later told Tacitus that his uncle reached Pomponianus at Stabiae on a following wind, the same wind that kept the boats from leaving.'
          p3:
            was: 'The next day, as the smell of sulphur and the flames came near, the Elder Pliny rose on the beach at Stabiae with two slaves supporting him and collapsed; his nephew wrote that the dust laden air obstructed his breathing. His body was found two days later.'
            now: '{staff} kept the dust from his breathing and got him off the beach. When the wind turned he went back by ship to Misenum, and lived some years more.'
            who: pliny_stabiae
            bio: 'In this line the Elder Pliny came back alive from the beach at Stabiae. He returned to the fleet at Misenum and lived on for some years.'
        vignettes:
          wind: 'Crispus has marked every loaded chest as gone. From the doorway you watch the first newcomer come in with ash on his shoulders while the loaded boats stay in sight. Crispus crosses out the word gone. He asks you to leave him room on the tablet for the next name through the door.'
          lantern: 'Prima has time to make one trip across the room before the lamp goes out. You take her place by the doorway while she calls to the people she can still see. The wax tablet goes dark first. She repeats the last two names aloud and you answer each one back.'
          letter: 'You remember the letter that will be sent years later. Prima is asking about the man who carried the list, whose name will never appear there. You set your account of the coming morning aside and help her finish the roll. At the end of your visit you can still hear someone coming down the corridor.'
      zh:
        name: '斯塔比亚的逆风'
        place: "斯塔比亚"
        figure: "老普林尼"
        story: '公元79年火山喷发时，老普林尼抵达斯塔比亚，找到庞波尼安努斯。小普林尼后来写信告诉塔西佗，送舅舅进来的风也让装好东西的船无法离港。'
        relic: "一块蜡板"
        relic_desc: "一块涂蜡的木板，用尖笔划出笔记。"
        points:
          p1: '浅滩和山上落下的碎石挡住海岸时，帮老普林尼把船靠上雷克蒂娜那片海岸，把她接上船'
          p2: '浮石和碎石砸向船身时，护住老普林尼的船一路驶向斯塔比亚，让他上岸见到庞波尼阿努斯'
          p3: '硫磺气味和烟尘压到斯塔比亚的海滩上时，替他护住呼吸，救下老普林尼，让他活着离开海滩'
        points_fail:
          p1: '船没能靠上她那片海岸，这条分支里没有人把雷克蒂娜接上船。'
          p2: '船在斯塔比亚之前被逼回，老普林尼没有见到庞波尼阿努斯。分支与历史脱了节，事务所因同步失败召回员工。'
          p3: '他照史实倒在斯塔比亚的海滩上，这条分支里也没能留住他。'
        shift:
          p1:
            was: '公元 79 年喷发那天，老普林尼收到雷克蒂娜请他救她离开的信，改了计划出海；浅滩和山上落下的碎石挡住海岸，他转去斯塔比亚找庞波尼阿努斯。'
            now: '船靠上了她那片海岸，雷克蒂娜被接上船，随船到了斯塔比亚。'
          p2:
            was: '小普林尼后来写信告诉塔西佗，舅舅乘顺风到斯塔比亚见到庞波尼阿努斯，同一阵风挡住了船离岸。'
          p3:
            was: '第二天硫磺气味和火光逼近，老普林尼在斯塔比亚的海滩上由两名奴隶扶起，随即倒下；小普林尼信里说是浓重的烟尘堵住了他的呼吸。两天后遗体在原处找到。'
            now: '{staff}替他挡住了烟尘，扶他离开海滩。风转向以后，他随船回到米塞努姆，又活了些年。'
            who: pliny_stabiae
            bio: '这条时间线里，老普林尼从斯塔比亚的海滩上活着回来。他回到米塞努姆的舰队，又过了些年。'
        vignettes:
          wind: '克里斯普斯把搬上船的木箱全记成了已离开。你们从门边看见第一位来客肩上带灰走进来，装好东西的船却还看得见。克里斯普斯划掉了已离开几个字，请你给下一位进门的人在蜡板上留一行。'
          lantern: '灯快熄了，普丽玛只来得及穿过屋子一次。你替她守在门边，她点数还能看见的人。先看不清的是蜡板，她大声念出最后两个名字，你一个个应回去。'
          letter: '你记得多年后寄出的那封信。普丽玛问的却是拿名单的人，那封信里找不到他的名字。你把知道的明早结局搁在一旁，帮她点完人。离开时，还能听到有人沿走廊走过来。'
text:
  en:
    name: Pliny the Elder
    text: Roman author and naval commander, AD 23 to 79. His Natural History collected knowledge in thirty seven books. He died near Stabiae while trying to rescue people during the eruption of Vesuvius.
  zh:
    name: 老普林尼
    text: 罗马作家与海军指挥官，公元 23 年生，79 年去世。他的《博物志》用三十七卷汇集知识。维苏威火山喷发时，他在斯塔比亚附近试图救人而去世。
hook: {en: 'The wind that brings help also holds the boats.', zh: '送来援手的风，船却出不去。'}
facts:
  letter:
    date: '79'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [pliny_stabiae_letter]
    text:
      en: 'The letter puts Pomponianus at Stabiae awaiting a change of wind and describes the elder Pliny arriving on that same wind.'
      zh: '信中记述庞波尼安努斯在斯塔比亚等风转向，老普林尼却正借这阵风抵达。'
bystanders:
  crispus:
    invented: true
    text: {en: 'A fictional household tally keeper who must correct the record of which boats have left.', zh: '虚构的记账人克里斯普斯，要改正哪条船已经离港的记录。'}
  prima:
    invented: true
    text: {en: 'A fictional household helper trying to account for the people she can see.', zh: '虚构的帮工普丽玛，在灯灭前点数还能看见的人。'}
