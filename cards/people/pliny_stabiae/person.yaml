    text:
      en:
        name: 'The wind at Stabiae'
        place: "Stabiae"
        figure: "Pliny the Elder"
        story: 'Pliny the Younger later wrote to Tacitus about his uncle reaching Pomponianus at Stabiae during the eruption of 79 CE. The wind that carried him in prevented the loaded ships from leaving.'
        story_prose:
          opening:
            - 'In AD 79 a cloud rose above the bay. Pliny the Younger later told Tacitus that his uncle received a plea for help and went out by ship.'
            - 'In history, the Elder Pliny reached Pomponianus at Stabiae and did not return alive from its shore. In this branch the ship can get nearer to the part of the coast from which Rectina asked for help. It may also be possible to get Pliny away from the beach.'
            - 'It takes someone who knows the shore and how to reach it by ship. Once ashore it takes someone who has brought suitable equipment and can help a man struggling to breathe.'
          points:
            p3: '{staff} reaches the Elder Pliny on the beach, brings out the protective equipment and asks the people around him to make a clear way. Feet have pressed the ash hard. The group stops once, waiting for his breath before moving again. When he can sit down, he brushes some stones from a companion’s shoulder. The boat by the shore is still making a noise.'
            p2: 'Several of the people on deck want to turn around. {staff} asks who knows where Pomponianus lives, and has that person stand where the shore can be seen. The ship reaches a place where they can get down. When Pomponianus comes to meet him, the Elder Pliny is still holding a length of rope. He passes it back aboard before setting foot on the ground.'
            p1: '{staff} asks which part of the shallows can still be approached and helps the crew leave Rectina a place to grab. She passes up what she is holding first and lets go before anyone has it firmly. Once they have pulled her aboard, she presses a wet hand on the place they cleared for her. Someone picks up what she passed them.'
          outcomes:
            all: 'After they leave the shore, someone puts what Rectina handed up somewhere dry. The Elder Pliny is resting on the other side. At last there is room to walk across the boat.'
            p3: 'The crew leave Pliny a dry corner on the way back. The person helping him sit waits until he lowers his own hand.'
            p2: 'Pliny does reach Pomponianus’s house. Stones brought in with them drop from their shoes in front of the door.'
            p1: 'Once aboard, Rectina stays in the place cleared for her. She gets her bundle back before she has changed out of her wet clothes.'
          none: 'From the mooring they can no longer see farther down the shore. The people who have been in the water wait for another call.'
          not_admitted: '{staff} never gets aboard. Someone on the shore gives a line a tug and the bow slowly turns away.'
          desync: 'The ship does not reach Stabiae. Pomponianus has not seen Pliny when the agency calls {staff} back.'
          excerpts:
            p3: 'When he can sit down, he brushes some stones from a companion’s shoulder. The boat by the shore is still making a noise.'
            p2: 'When Pomponianus comes to meet him, the Elder Pliny is still holding a length of rope. He passes it back aboard before setting foot on the ground.'
            p1: 'Once they have pulled her aboard, she presses a wet hand on the place they cleared for her. Someone picks up what she passed them.'
        relic: "A wax tablet"
        relic_desc: "A wooden tablet with wax for notes, scratched with a stylus."
        points:
          p1: 'When the shallows and the debris from the mountain block the shore, help the Elder Pliny bring the ship in to Rectina’s coast and take her aboard'
          p2: 'Under the falling pumice and stones, keep the Elder Pliny’s ship on its course to Stabiae, so that he lands and reaches Pomponianus'
          p3: 'When the smell of sulphur and the dust close in on the beach at Stabiae, keep his breathing clear and save the Elder Pliny, getting him off the shore alive'
        points_fail:
          p1: 'The ship could not come in to her shore, and in this branch nobody took Rectina aboard.'
          p2: 'The ship was turned back before Stabiae and Pliny never reached Pomponianus. The branch came apart from history and the office recalled the employee.'
          p3: 'He fell on the beach at Stabiae as history has it, and in this branch too he could not be kept.'
        shift:
          p1:
            was: 'In AD 79 Rectina’s message prompted the Elder Pliny to sail out to help. His nephew describes the obstructed shore and the course to Stabiae, but does not say what became of Rectina.'
            now: 'The ship came in to her shore and Rectina was taken aboard. She went on with the ship to Stabiae.'
          p2:
            was: 'Pliny the Younger later told Tacitus that his uncle reached Pomponianus at Stabiae on a following wind, the same wind that kept the boats from leaving.'
          p3:
            was: 'The next day, as the smell of sulphur and the flames came near, the Elder Pliny rose on the beach at Stabiae with two slaves supporting him and collapsed; his nephew wrote that the dust laden air obstructed his breathing. His body was found two days later.'
            now: '{staff} kept the dust from his breathing and got him off the beach. When the wind turned he went back by ship to Misenum, and lived some years more.'
            who: pliny_stabiae
            bio: 'In this line the Elder Pliny came back alive from the beach at Stabiae. He returned to the fleet at Misenum and lived on for some years.'
        vignettes:
          wind: 'Crispus has marked every loaded chest as gone. From the doorway you watch the first newcomer come in with ash on his shoulders while the loaded boats stay in sight. Crispus crosses out the word gone. He asks you to leave him room on the tablet for the next name through the door.'
          lantern: 'Prima has time to make one trip across the room before the lamp goes out. You take her place by the doorway while she calls to the people she can still see. The wax tablet goes dark first. She repeats the last two names aloud and you answer each one back.'
          letter: 'You remember the letter that will be sent years later. Prima is asking about the man who carried the list, whose name will never appear there. You set your account of the coming morning aside and help her finish the roll. At the end of your visit you can still hear someone coming down the corridor.'
      zh:
        name: '斯塔比亚的逆风'
        place: "斯塔比亚"
        figure: "老普林尼"
        story: '公元79年火山喷发时，老普林尼抵达斯塔比亚，找到庞波尼安努斯。小普林尼后来写信告诉塔西佗，送舅舅进来的风也让装好东西的船无法离港。'
        story_prose:
          opening:
            - '公元 79 年，海湾上空冒出一片云。后来小普林尼写信给塔西佗，说舅舅接到求助，乘船出了港。'
            - '史实里，老普林尼来到斯塔比亚，见到庞波尼阿努斯，后来没能从海滩活着回来。在这条分支里，船有机会比原来更靠近雷克蒂娜求助的那片岸，也有机会把老普林尼从岸边带走。'
            - '这趟需要认得海岸和船路的人。到了岸上，还需要带着对路装备、能照顾呼吸困难的人。'
          points:
            p3: '{staff}在海滩边跟到老普林尼身旁，拿出带来的防护装备，再请身边的人给他让出一条能走的路。脚下的灰被来去的人踩实，几个人停了一次，等他喘过来才走。 到能坐下的地方，他伸手把同伴肩上的碎石拨掉。靠岸的船还在响。'
            p2: '岸边同来的几个人都想把船掉头。{staff}先问谁认得庞波尼阿努斯住处，再请那个人站到能看见岸边的地方指路。船终于找到能下去的地方。 庞波尼阿努斯来接时，老普林尼手里还有一截没有放开的绳。他把它递回船边，才踏到地面。'
            p1: '{staff}问清哪片浅水还能接近，和船上的人一起为雷克蒂娜留出可以抓住的位置。她先把手里的东西往上递，没等拿稳就放开了。 船上的人把她拉上来以后，她自己把湿手按在空出的座位上。有人这才拾起她递来的东西。'
          outcomes:
            all: '离开那片岸以后，有人把雷克蒂娜递来的东西放到干处。老普林尼在另一边歇着，船上终于腾出了一段能走动的地方。'
            p3: '回来的船上给老普林尼腾出干的一角。支撑他坐稳的人，一直等他自己把手放下。'
            p2: '老普林尼确实到了庞波尼阿努斯家里。随船来的那点碎石，在门前鞋底上掉了一路。'
            p1: '雷克蒂娜上船以后留在一处空位。拿回她交出的包时，她还没有换掉湿衣。'
          none: '停船的地方看不见更远的海岸了。下过水的人都在等一声新的招呼。'
          not_admitted: '{staff}没能上那条船。岸边有人挣了一下绳，船头便慢慢偏开。'
          desync: '船没能到斯塔比亚。事务所召回{staff}时，庞波尼阿努斯还没见到老普林尼。'
          excerpts:
            p3: '到能坐下的地方，他伸手把同伴肩上的碎石拨掉。靠岸的船还在响。'
            p2: '庞波尼阿努斯来接时，老普林尼手里还有一截没有放开的绳。他把它递回船边，才踏到地面。'
            p1: '船上的人把她拉上来以后，她自己把湿手按在空出的座位上。有人这才拾起她递来的东西。'
        relic: "一块蜡板"
        relic_desc: "一块涂蜡的木板，用尖笔划出笔记。"
        points:
          p1: '浅滩和山上落下的碎石挡住海岸时，帮老普林尼把船靠上雷克蒂娜那片海岸，把她接上船'
          p2: '浮石和碎石砸向船身时，护住老普林尼的船一路驶向斯塔比亚，让他上岸见到庞波尼阿努斯'
          p3: '硫磺气味和烟尘压到斯塔比亚的海滩上时，替他护住呼吸，救下老普林尼，让他活着离开海滩'
        points_fail:
          p1: '船没能靠上她那片海岸，这条分支里没有人把雷克蒂娜接上船。'
          p2: '船在斯塔比亚之前被逼回，老普林尼没有见到庞波尼阿努斯。分支与历史脱了节，事务所因同步失败召回员工。'
          p3: '他照史实倒在斯塔比亚的海滩上，这条分支里也没能留住他。'
        shift:
          p1:
            was: '公元 79 年，雷克蒂娜来信求救，老普林尼改了计划出海。小普林尼记下海岸受阻及船驶向斯塔比亚的经过，没有交代雷克蒂娜的下落。'
            now: '船靠上了她那片海岸，雷克蒂娜被接上船，随船到了斯塔比亚。'
          p2:
            was: '小普林尼后来写信告诉塔西佗，舅舅乘顺风到斯塔比亚见到庞波尼阿努斯，同一阵风挡住了船离岸。'
          p3:
            was: '第二天硫磺气味和火光逼近，老普林尼在斯塔比亚的海滩上由两名奴隶扶起，随即倒下；小普林尼信里说是浓重的烟尘堵住了他的呼吸。两天后遗体在原处找到。'
            now: '{staff}替他挡住了烟尘，扶他离开海滩。风转向以后，他随船回到米塞努姆，又活了些年。'
            who: pliny_stabiae
            bio: '这条时间线里，老普林尼从斯塔比亚的海滩上活着回来。他回到米塞努姆的舰队，又过了些年。'
        vignettes:
          wind: '克里斯普斯把搬上船的木箱全记成了已离开。你们从门边看见第一位来客肩上带灰走进来，装好东西的船却还看得见。克里斯普斯划掉了已离开几个字，请你给下一位进门的人在蜡板上留一行。'
          lantern: '灯快熄了，普丽玛只来得及穿过屋子一次。你替她守在门边，她点数还能看见的人。先看不清的是蜡板，她大声念出最后两个名字，你一个个应回去。'
          letter: '你记得多年后寄出的那封信。普丽玛问的却是拿名单的人，那封信里找不到他的名字。你把知道的明早结局搁在一旁，帮她点完人。离开时，还能听到有人沿走廊走过来。'
text:
  en:
    name: Pliny the Elder
    text: Roman author and naval commander, AD 23 to 79. His Natural History collected knowledge in thirty seven books. He died near Stabiae while trying to rescue people during the eruption of Vesuvius.
  zh:
    name: 老普林尼
    text: 罗马作家与海军指挥官，公元 23 年生，79 年去世。他的《博物志》用三十七卷汇集知识。维苏威火山喷发时，他在斯塔比亚附近试图救人而去世。
hook: {en: 'The wind that brings help also holds the boats.', zh: '送来援手的风，船却出不去。'}
facts:
  death:
    date: '79'
    stay_day: 16
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [pliny_stabiae_letter_616]
    text:
      en: 'Pliny the Younger wrote that his uncle collapsed near the shore at Stabiae and that his body was found after the eruption. He suggested that smoke had obstructed his breathing.'
      zh: '小普林尼在信中记下舅舅在斯塔比亚海岸附近倒下，喷发之后遗体被找到。他把呼吸受阻归因于烟尘。'
    line:
      en: 'AD 79: according to his nephew, the Elder Pliny dies at Stabiae during the eruption.'
      zh: '公元 79 年，据小普林尼的书信，老普林尼在喷发期间死于斯塔比亚。'
  letter:
    date: '79'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [pliny_stabiae_letter]
    text:
      en: 'The letter puts Pomponianus at Stabiae awaiting a change of wind and describes the elder Pliny arriving on that same wind.'
      zh: '信中记述庞波尼安努斯在斯塔比亚等风转向，老普林尼却正借这阵风抵达。'
