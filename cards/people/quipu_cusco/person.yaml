order: 222
events:
- quipu_cusco
text:
  en:
    name: "The keepers of the knotted cords"
    text: "The record keepers of the Inca world who noted numbers on knotted cords. Much about how the knots were read is still unknown, and only what is known is written here."
  zh:
    name: "结绳记事的人"
    text: "印加社会里用结绳记录数目的账房人员。绳结的读法有许多至今未解，百科只写已知的部分。"
