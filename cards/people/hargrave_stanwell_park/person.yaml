    line:
      en: '12 November 1894: a photograph records Hargrave and James Swaine with the kite equipment at Stanwell Park.'
      zh: '1894 年 11 月 12 日，一张斯坦威尔公园的照片留下了哈格雷夫、詹姆斯·斯韦恩和试验器材。'
      zh-Hant: '1894 年 11 月 12 日，一張斯坦威爾公園的照片留下了哈格雷夫、詹姆斯·斯韋恩和試驗器材。'
      fr: "12 novembre 1894\_: une photographie montre Hargrave et James Swaine avec l'équipement de cerf-volant à Stanwell Park."
      es: '12 de noviembre de 1894: una fotografía registra a Hargrave y James Swaine con el equipo de cometa en Stanwell Park.'
      ja: '1894年11月12日：スタンウェル・パークでハーグレイブとジェームス・スウェインが凧の道具を持っている写真が記録されている。'
      ko: '1894년 11월 12일: 스탠웰 공원에서 연 장비를 들고 하그레이브와 제임스 스웨인을 촬영한 사진.'
      ru: '12 ноября 1894 года: на фотографии Харгрейв и Джеймс Суэйн с кайт-оборудованием в Стэнвелл-парке.'
