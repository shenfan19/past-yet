    text:
      en:
        name: 'The fourth kite'
        place: "Stanwell Park, Australia"
        figure: "Lawrence Hargrave"
        story: 'On 12 November 1894 at Stanwell Park beach, Lawrence Hargrave rose from the ground in an experiment with four linked box kites. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and equipment from the test. The beach ledger and the two helpers in this visit are fictional.'
        relic: 'A spare box-kite tag'
        relic_desc: 'A spare label from the fictional tally table.'
        points:
          p1: 'Count the kites laid out before the lift'
          p2: 'Keep the frame labels readable while they are carried off the sand'
          p3: 'Wait until the seat leaves the beach before marking the trial'
        vignettes:
          four: 'Ada has crossed one kite off because she saw its frame carried down in two pieces. You go back with her and count the assembled kites once. All four go onto the page. She draws a small bracket around them so the next reader knows they belong to the same lift.'
          tag: 'Ned finds a tag torn loose as he carries the frames off the beach. You follow back along the wet sand while he keeps the other three frames apart. There is just enough of the mark left to match the loose tag. When he shuts the store, he can still tell the last frame from the first.'
          lift: 'The number you remember from a future display almost goes into the height column. Ada has seen the seat stir but is waiting to see daylight between it and the sand. You watch for that first gap with her. The visit ends before you can check what height was entered into the ledger.'
      zh:
        name: '第四只风筝'
        place: "澳大利亚斯坦韦尔公园"
        figure: "劳伦斯·哈格雷夫"
        story: '1894年11月12日，劳伦斯·哈格雷夫在斯坦韦尔公园海滩用四只相连的箱式风筝试验，被风筝托离地面。新南威尔士州立图书馆藏照有哈格雷夫、詹姆斯·斯韦恩和试验装备。游戏里的海滩记事簿和两位帮工均为虚构。'
        relic: '一片箱式风筝的备用签'
        relic_desc: '虚构记事桌上留的一片备用签。'
        points:
          p1: '试验前数清铺开的风筝'
          p2: '搬离沙滩时，让风筝骨架上的签还能看清'
          p3: '等座椅真正离地再给这一趟做记号'
        vignettes:
          four: '艾达看见一只风筝的骨架拆成两截搬下来，就把那只划掉了。你陪她回去，把拼好的风筝重新数一遍。四只都入了簿。她用括号把它们圈在一起，提醒下一个人读的是同一次试验。'
          tag: '内德往岸上搬骨架时，发现一张签被扯脱了。你沿湿沙往回找，他把另外三副骨架分开摆着。掉下来的签上还剩一点笔迹，刚够认出是哪一副。关库门时，他仍分得清最后一副与第一副。'
          lift: '你差点把后世展牌上的数字填进高度栏。艾达看见座椅动了，还在等座椅和沙地中间露出一点亮。你和她一起等到那道空隙。还没来得及核实簿上最后填了多高，你已经要走了。'
text:
  en:
    name: "Lawrence Hargrave"
    text: "Engineer and inventor born in England, 1850 to 1915, who lived in Australia. He invented the box kite and published his flight work freely without patents."
  zh:
    name: "劳伦斯·哈格雷夫"
    text: "出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱式风筝，并把飞行研究公开发表，不申请专利。"
hook: {en: 'The wind eases. Which number do you keep?', zh: '风一停，你留下哪个数字？'}
