    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hargrave_stanwell_park_photo, hargrave_stanwell_park_beach]
    text:
      en: 'A photograph of the trial on the beach shows Hargrave, James Swaine and equipment from the experiment.'
      zh: '一张海滩试验的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。'
    line:
      en: 'A photograph is taken on the beach: Hargrave, James Swaine and the gear of the trial.'
      zh: '海滩上留下一张照片，照片里是哈格雷夫、詹姆斯·斯韦恩和试验的器材。'
  death:
