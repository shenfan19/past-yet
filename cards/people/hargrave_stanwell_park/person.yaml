    text:
      en: 'On 12 November 1894 at Stanwell Park beach, four linked box kites of his own making lifted Hargrave off the ground, about 4.8 metres, almost 16 feet.'
      zh: '1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只他自己做的、串在一起的箱形风筝把他拉离地面，约 4.8 米，将近 16 英尺。'
    line:
      en: '12 November: on the beach at Stanwell Park, four linked box kites lift Hargrave off the sand, almost 16 feet up.'
      zh: '11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。'
      zh-Hant: '11 月 12 日，斯坦威爾公園的海灘上，四隻串起來的箱形風箏把哈格雷夫拉離沙地，升到將近 16 英尺。'
      fr: '12 novembre : sur la plage de Stanwell Park, quatre cerfs-volants reliés soulèvent Hargrave du sable, à près de 16 pieds de haut.'
      es: '12 de noviembre: en la playa de Stanwell Park, cuatro cometas unidas levantan a Hargrave de la arena, a casi 16 pies de altura.'
      ja: '11月12日：スタンウェルパークのビーチで、4つの連結した箱凧がハーグレイブを砂から約16フィートの高さまで持ち上げた。'
      ko: '11월 12일: 스탠웰 공원(Stanwell Park) 해변에서 4개의 연결된 상자 연이 하그레이브를 거의 16피트 높이의 모래 위로 들어 올립니다.'
      ru: '12 ноября: на пляже в Стэнвелл-парке четыре связанных коробчатых воздушных змея поднимают Харгрейва с песка почти на 16 футов вверх.'
