    text:
      en:
        name: 'The fourth kite'
        place: "Stanwell Park, Australia"
        figure: "Lawrence Hargrave"
        story: 'Lawrence Hargrave began his experiments with box kites in 1893. On 12 November 1894, on the beach at Stanwell Park, four of his linked box kites lifted him off the sand, about 16 feet into the air. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and the equipment of the trial. He died in Sydney on 6 July 1915.'
        story_prose:
          opening:
            - 'Stanwell Park, November 1894. Lawrence Hargrave has been trying box kites for more than a year. On the 12th, four lie on the beach, ready to be flown on one line.'
            - 'In history, the four kites lifted him almost sixteen feet. Most of the models he later sent to Munich were destroyed in wartime. In this branch, the helpers on the beach have tags for the frames and room to spread out a drawing.'
            - 'This trip needs someone who can read the wind and steady a long line, and someone who can check the measurements and draw how the four frames go together.'
          points:
            p1: 'A gust pulls the outer kite aside. {staff} watches the line and moves across with the helpers until the kites pull true again, then helps steady the rope as the seat comes down. The legs touch the sand and leave two prints close together. The people on the beach keep hold until the first kite sinks lower.'
            p2: '{staff} checks the measurements and tags against the frames and makes a copy to keep locally, showing how all four are made and joined. The wind turns the drawings to the last sheet. Hargrave lays a piece of cord across it to hold down the corner by the knot.'
          outcomes:
            all: 'The height went into the record, and a set of drawings stayed in Australia. Someone opened the stack years later and could still follow the line between the four kites.'
            p2: 'Years later, Stanwell Park still had a copy to consult. The last sheet still showed where the line was tied.'
            p1: 'The height went into the record. Beside the entry, the photograph still showed four kites in line on the beach.'
          none: 'The wind kept coming off the sea. One loop after another came loose from the coil at the dunes.'
          not_admitted: '{staff} found no place with the helpers on the beach. Someone pulled a line taut in the distance, but their voice did not carry to the dunes.'
          desync: 'The seat came down and the rope went slack. As {staff} was recalled, a tag still rattled against a frame.'
          excerpts:
            p2: 'The wind turns the drawings to the last sheet. Hargrave lays a piece of cord across it to hold down the corner by the knot.'
            p1: 'The legs touch the sand and leave two prints close together. The people on the beach keep hold until the first kite sinks lower.'
        relic: 'A spare box kite tag'
        relic_desc: 'A spare label for the frame of a box kite.'
        points:
          p1: 'On 12 November, keep the string of kites steady in the gusts, so that he rises and comes down safely on the sand'
          p2: 'Help him finish full drawings of the four kites, their sizes and how they are made, and leave one copy in Australia'
        points_fail:
          p1: 'A gust dragged the string of kites aside and the seat struck the sand, and in this branch there was no lift of 16 feet.'
          p2: 'The four kites stayed only in his own hands as history has it, and in this branch there was no second record at Stanwell Park.'
        shift:
          p1:
            was: 'On 12 November 1894, on the beach at Stanwell Park, four box kites in a train lifted Hargrave off the sand to nearly 16 feet.'
          p2:
            was: 'In 1894 the making of the four kites was in Hargrave''s hands alone; late in life he sent his models to Munich, and most were destroyed in the Second World War.'
            now: 'A set of drawings of the four kites stayed at Stanwell Park and did not go to Munich with the other models.'
            who: hargrave_stanwell_park
            bio: 'The sizes and drawings of Hargrave''s four box kites of 1894 stayed in a copy at Stanwell Park. Most of his models were later destroyed in the Second World War, but how these four were made could still be read in Australia.'
        vignettes:
          four: '{staff} counts the kites laid out on the sand once more after the lift and writes all four on the page, with a bracket round them, so the next reader knows they flew together.'
          tag: '{staff} follows the wet sand back to find a tag torn off a frame, and ties it on again with a new knot.'
          lift: '{staff} stands with the helpers on the dune while the wind is tried with a single kite, and learns which way to run with the line.'
      zh:
        name: '第四只风筝'
        place: "澳大利亚斯坦威尔公园"
        figure: "劳伦斯·哈格雷夫"
        story: '劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。'
        story_prose:
          opening:
            - '1894 年 11 月，斯坦威尔公园。劳伦斯·哈格雷夫已试验箱形风筝一年多。十二日，海滩上排了四只，打算用一根绳串起来。'
            - '史实里，四只风筝把他拉到离地近十六英尺。哈格雷夫后来送去慕尼黑的模型大多毁于战事。在这条分支里，海滩的帮手手上有签条，也有地方摊开一份图。'
            - '这一趟用得上懂风向、能稳住长绳的人，也用得上能核对尺寸、把四套做法画清楚的人。'
          points:
            p1: '阵风扯偏了外侧的风筝。{staff}看着绳的走向同帮手往侧面挪，等四只又拉成一线，再陪着落地的人稳住牵绳。座椅的脚碰到沙，留了两个挨得很近的印。海滩上的人还拉着绳，直到第一只风筝落低。'
            p2: '{staff}按骨架逐一核尺寸和签条，把四只风筝怎样做、怎样串在一起画成一份，留给当地保管。四张图在风里翻到最后一张。哈格雷夫把一截绳横放在图上，压住拴点旁的纸角。'
          outcomes:
            all: '离地的高度写进了记录，另一份做法图留在澳洲。后来有人摊开那一叠图，四只之间的线还连着。'
            p2: '许多年后，斯坦威尔公园仍有一份图可查。翻到最后一张，还看得见那根线在哪里打结。'
            p1: '那次离地的高度写了下来。翻到存着照片的地方，沙滩上的四只风筝还在一条线上。'
          none: '风继续从海上过来。沙丘边的绳盘一截一截松了下去。'
          not_admitted: '{staff}没能加入海滩上的人。远处有人把一根绳拉直，话音到沙丘边就散了。'
          desync: '座椅落在沙地上，绳却松了。{staff}被召回时，还有一张签条在骨架边响。'
          excerpts:
            p2: '四张图在风里翻到最后一张。哈格雷夫把一截绳横放在图上，压住拴点旁的纸角。'
            p1: '座椅的脚碰到沙，留了两个挨得很近的印。海滩上的人还拉着绳，直到第一只风筝落低。'
        relic: '一片箱形风筝的备用签'
        relic_desc: '一片给箱形风筝骨架用的备用签。'
        points:
          p1: '11 月 12 日，在阵风里护住那串风筝，让他升起来，再平安落回沙地'
          p2: '帮他完成这四只风筝的尺寸和做法图，在澳洲留下一份'
        points_fail:
          p1: '一阵风把风筝串扯偏了，座椅砸回沙地，这条分支里没有那次离地 16 英尺。'
          p2: '这四只风筝照史实只留在他自己手里，这条分支里斯坦威尔公园没有另一份。'
        shift:
          p1:
            was: '1894 年 11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。'
          p2:
            was: '1894 年，这四只风筝的做法只在哈格雷夫自己手里；他晚年把模型送去慕尼黑，大多毁于二战。'
            now: '那四只风筝的图纸在斯坦威尔公园留了一份，没有跟着别的模型去慕尼黑。'
            who: hargrave_stanwell_park
            bio: '哈格雷夫 1894 年那四只箱形风筝的尺寸和做法图在斯坦威尔公园留了一份。他的模型后来大多毁于二战，这四只怎样做的，在澳洲仍查得到。'
        vignettes:
          four: '升空以后，{staff}沿着沙上的风筝数到四。铅笔画了一个长括号，把四个数圈在一处。'
          tag: '签条从骨架上脱开了。{staff}沿着湿沙找回它，抖掉纸背的水，把绳结又系紧一点。'
          lift: '先放一只试风时，{staff}跟帮手站在沙丘上。绳一斜，前面那个人先往侧边跑了两步。'
text:
  en:
    name: "Lawrence Hargrave"
    text: "Engineer and inventor born in England, 1850 to 1915, who lived in Australia. He invented the box kite and published his work on flight."
  zh:
    name: "劳伦斯·哈格雷夫"
    text: "出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱形风筝，并公开发表自己的飞行研究。"
