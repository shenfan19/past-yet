    text:
      en:
        name: 'The fourth kite'
        place: "Stanwell Park, Australia"
        figure: "Lawrence Hargrave"
        story: 'Lawrence Hargrave began his experiments with box kites in 1893. On 12 November 1894, on the beach at Stanwell Park, four of his linked box kites lifted him off the sand, about 16 feet into the air. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and the equipment of the trial. He died in Sydney on 6 July 1915.'
        relic: 'A spare box kite tag'
        relic_desc: 'A spare label for the frame of a box kite.'
        points:
          p1: 'Be taken in by the helpers on the beach, then stretch and tie the cloth of the kites'
          p2: 'At the lift, stand by the winch and call out how high the seat has risen'
          p3: 'When the wind drops, hold the line of the fourth kite steady'
        vignettes:
          four: '{staff} counts the kites laid out on the sand once more after the lift and writes all four on the page, with a bracket round them, so the next reader knows they flew together.'
          tag: '{staff} follows the wet sand back to find a tag torn off a frame, and ties it on again with a new knot.'
          lift: '{staff} stands with the helpers on the dune while the wind is tried with a single kite, and learns which way to run with the line.'
      zh:
        name: '第四只风筝'
        place: "澳大利亚斯坦威尔公园"
        figure: "劳伦斯·哈格雷夫"
        story: '劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。'
        relic: '一片箱形风筝的备用签'
        relic_desc: '一片给箱形风筝骨架用的备用签。'
        points:
          p1: '先让海滩上帮忙的人认下，再帮着绷紧、扎好风筝的布面'
          p2: '升空时守在绞盘旁，报出座椅离地多高'
          p3: '风停下来时，稳住第四只风筝的拉绳'
        vignettes:
          four: '升空之后，{staff}把沙滩上铺开的风筝又数了一遍，四只都记在本子上，用括号圈在一起，让下一个读的人知道它们是一起飞的。'
          tag: '一张签从骨架上扯脱了，{staff}沿着湿沙往回找，找到后重新打了个结系上。'
          lift: '先放一只风筝试风时，{staff}和帮手们站在沙丘上，学会了拉着绳该往哪边跑。'
text:
  en:
    name: "Lawrence Hargrave"
    text: "Engineer and inventor born in England, 1850 to 1915, who lived in Australia. He invented the box kite and published his work on flight."
  zh:
    name: "劳伦斯·哈格雷夫"
    text: "出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱形风筝，并公开发表自己的飞行研究。"
hook: {en: 'Sixteen feet off the sand', zh: '离沙地十六英尺'}
