    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hargrave_stanwell_park_beach, ausgeo_hargrave]
    text:
      en: 'On 12 November 1894 at Stanwell Park beach, four linked box kites of his own making lifted Hargrave off the ground, about 4.8 metres, almost 16 feet.'
      zh: '1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只他自己做的、串在一起的箱形风筝把他拉离地面，约 4.8 米，将近 16 英尺。'
    line:
      en: '12 November: on the beach at Stanwell Park, four linked box kites lift Hargrave off the sand, almost 16 feet up.'
      zh: '11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。'
  photo:
