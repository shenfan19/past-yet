    text:
      en:
        name: 'The fourth kite'
        place: "Stanwell Park, Australia"
        figure: "Lawrence Hargrave"
        story: 'Lawrence Hargrave began his experiments with box kites in 1893. On 12 November 1894, on the beach at Stanwell Park, four of his linked box kites lifted him off the sand, about 16 feet into the air. A photograph held by the State Library of New South Wales shows Hargrave, James Swaine and the equipment of the trial. He died in Sydney on 6 July 1915.'
        relic: 'A spare box kite tag'
        relic_desc: 'A spare label for the frame of a box kite.'
        points:
          p1: 'On 12 November, keep the string of kites steady in the gusts, so that he rises and comes down safely on the sand'
          p2: 'Help him finish full drawings of the four kites, their sizes and how they are made, and leave one copy in Australia'
        points_fail:
          p1: 'A gust dragged the string of kites aside and the seat struck the sand, and in this branch there was no lift of 16 feet.'
          p2: 'The four kites stayed only in his own hands as history has it, and in this branch there was no second record at Stanwell Park.'
        shift:
          p1:
            was: 'On 12 November 1894, on the beach at Stanwell Park, four box kites in a train lifted Hargrave off the sand to nearly 16 feet.'
          p2:
            was: 'In 1894 the making of the four kites was in Hargrave''s hands alone; late in life he sent his models to Munich, and most were destroyed in the Second World War.'
            now: 'A set of drawings of the four kites stayed at Stanwell Park and did not go to Munich with the other models.'
            who: hargrave_stanwell_park
            bio: 'The sizes and drawings of Hargrave''s four box kites of 1894 stayed in a copy at Stanwell Park. Most of his models were later destroyed in the Second World War, but how these four were made could still be read in Australia.'
        vignettes:
          four: '{staff} counts the kites laid out on the sand once more after the lift and writes all four on the page, with a bracket round them, so the next reader knows they flew together.'
          tag: '{staff} follows the wet sand back to find a tag torn off a frame, and ties it on again with a new knot.'
          lift: '{staff} stands with the helpers on the dune while the wind is tried with a single kite, and learns which way to run with the line.'
      zh:
        name: '第四只风筝'
        place: "澳大利亚斯坦威尔公园"
        figure: "劳伦斯·哈格雷夫"
        story: '劳伦斯·哈格雷夫 1893 年开始试验箱形风筝。1894 年 11 月 12 日，在斯坦威尔公园的海滩上，四只串在一起的箱形风筝把他拉离沙地，升到约 16 英尺高。新南威尔士州立图书馆藏的照片里有哈格雷夫、詹姆斯·斯韦恩和试验器材。1915 年 7 月 6 日他在悉尼去世。'
        relic: '一片箱形风筝的备用签'
        relic_desc: '一片给箱形风筝骨架用的备用签。'
        points:
          p1: '11 月 12 日，在阵风里护住那串风筝，让他升起来，再平安落回沙地'
          p2: '帮他完成这四只风筝的尺寸和做法图，在澳洲留下一份'
        points_fail:
          p1: '一阵风把风筝串扯偏了，座椅砸回沙地，这条分支里没有那次离地 16 英尺。'
          p2: '这四只风筝照史实只留在他自己手里，这条分支里斯坦威尔公园没有另一份。'
        shift:
          p1:
            was: '1894 年 11 月 12 日，斯坦威尔公园的海滩上，四只串起来的箱形风筝把哈格雷夫拉离沙地，升到将近 16 英尺。'
          p2:
            was: '1894 年，这四只风筝的做法只在哈格雷夫自己手里；他晚年把模型送去慕尼黑，大多毁于二战。'
            now: '那四只风筝的图纸在斯坦威尔公园留了一份，没有跟着别的模型去慕尼黑。'
            who: hargrave_stanwell_park
            bio: '哈格雷夫 1894 年那四只箱形风筝的尺寸和做法图在斯坦威尔公园留了一份。他的模型后来大多毁于二战，这四只怎样做的，在澳洲仍查得到。'
        vignettes:
          four: '升空之后，{staff}把沙滩上铺开的风筝又数了一遍，四只都记在本子上，用括号圈在一起，让下一个读的人知道它们是一起飞的。'
          tag: '一张签从骨架上扯脱了，{staff}沿着湿沙往回找，找到后重新打了个结系上。'
          lift: '先放一只风筝试风时，{staff}和帮手们站在沙丘上，学会了拉着绳该往哪边跑。'
text:
  en:
    name: "Lawrence Hargrave"
    text: "Engineer and inventor born in England, 1850 to 1915, who lived in Australia. He invented the box kite and published his work on flight."
  zh:
    name: "劳伦斯·哈格雷夫"
    text: "出生在英国、生活在澳大利亚的工程师和发明家，1850 年生，1915 年去世。他发明了箱形风筝，并公开发表自己的飞行研究。"
hook: {en: 'Sixteen feet off the sand', zh: '离沙地十六英尺'}
