    tier: none
    date: '1888-12'
    checked: official_record
    sources: [nietzsche_turin_wagner_letter]
    original: de
    text:
      de: {who: Friedrich Nietzsche, quote: 'Hier kommt noch ein schönes Manuskript, etwas Kleines, aber sehr gut Geratenes, auf das ich stolz bin.', occasion: 'Begleitbrief an den Verleger Constantin Georg Naumann, Turin, Dezember 1888.'}
      en: {who: Friedrich Nietzsche, quote: 'Here is another fine manuscript, something small but very well turned out, and I am proud of it.', occasion: 'From the letter accompanying the manuscript to publisher Constantin Georg Naumann, Turin, December 1888 (game translation).'}
      zh: {who: 弗里德里希·尼采, quote: '又寄来一份漂亮的手稿。它很短，但写得很成功，我为它自豪。', occasion: '1888 年 12 月，在都灵随手稿寄给出版社瑙曼的信（游戏译文）。'}
