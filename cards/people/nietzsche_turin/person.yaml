    text:
      en:
        name: 'The address on the back'
        place: "Turin"
        figure: "Friedrich Nietzsche"
        story: 'The letter from Turin is addressed to Franz and Ida Overbeck. Nietzsche signed it Dionysus. When Franz arrives at his friend’s lodging, he finds him reading the corrected proofs of Nietzsche contra Wagner. By the time they leave Turin, someone will have to decide what goes into the case with the proofs.'
        story_prose:
          opening:
            - 'Turin, January 1889. A letter goes to Franz and Ida Overbeck, with the signature and the addressees in separate places. When Franz reaches Turin, Nietzsche is reading the last proofs of Nietzsche contra Wagner.'
            - 'In history, Overbeck found his friend on 8 January and later wrote down what he had been reading. In this branch, Pietro has left a luggage label by the stairs, and Lucia has a bundle of letters still to wrap.'
            - 'This trip calls for someone patient enough to check an address and guide a visitor to the right door. It also needs someone who knows how to list and keep proofs and private letters.'
          points:
            p1: 'On 8 January, {staff} checked the address against the door number, waited for Overbeck at the stairs and took him the rest of the way. Franz stopped at the right door and knocked once. A page turned inside, and the handle slowly moved half a turn.'
            p2: '{staff} listed the proofs and the letters separately, putting the book title on one label and only the recipient on the other. Each packet had its own piece of string. Lucia turned the label with the recipient’s name inwards and pressed down a corner with her thumb.'
          outcomes:
            all: 'On 8 January Overbeck found Nietzsche. Later the two packets travelled together. He opened the one bearing the title, while the other went back with its knot still facing the lid.'
            p2: 'The papers reached the next pair of hands in two packets. Once Overbeck recognised the title, he laid the other packet back in the bottom of the case.'
            p1: 'On 8 January Overbeck went into his friend’s room. As the door closed behind him, there was a soft rustle from a turning page.'
          none: 'The papers were wrapped in one stack, names showing on both letters and proofs. The wrapper pulled at the cord and hesitated over which side to tie it on.'
          not_admitted: '{staff} found no one at the lodging to make the introduction. A blank luggage label still lay on the banister.'
          desync: 'No one answered at the other door. When the agency recalled {staff}, Overbeck was still on the landing.'
          excerpts:
            p2: 'Each packet had its own piece of string. Lucia turned the label with the recipient’s name inwards and pressed down a corner with her thumb.'
            p1: 'Franz stopped at the right door and knocked once. A page turned inside, and the handle slowly moved half a turn.'
        relic: 'A duplicate luggage label'
        relic_desc: 'A duplicate luggage label from the game’s timeline, with a recipient on the back.'
        points:
          p1: 'Check the lodging address and get Overbeck to the right door on 8 January'
          p2: 'Record the corrected proofs separately from the personal letters so each bundle can be handed over without opening the other'
        points_fail:
          p1: 'Overbeck is directed to the wrong lodging, and the office recalls the employee when the meeting slips out of the timeline.'
          p2: 'The letters and proofs go into the same wrapper. The first person looking for the corrections will also see the names on the letters.'
        shift:
          p1:
            was: 'Nietzsche wrote to the Overbecks from Turin. Franz Overbeck arrived there on January 8, 1889, to find him.'
          p2:
            was: 'Overbeck later recalled that Nietzsche was reading the last proofs of Nietzsche contra Wagner when he arrived.'
            now: 'The proofs and the letters travel in separate wrappers. Overbeck can find the corrections at a glance without breaking the other seal.'
        vignettes:
          address: 'Pietro has copied Dionysus into the destination line of his inventory. {staff} turns the slip to show him the names of the recipients. He draws one line through what he wrote, lightly enough that he could still read it back.'
          privacy: 'Lucia asks {staff} to hold the bag while she wraps the papers. Someone on the stairs asks whose they are. She turns the label to the wall before she answers.'
          stairs: 'From the landing, {staff} hears the rustle of a page. Then someone knocks below, and Pietro puts the blank luggage label on the stair rail where he can find it again.'
      zh:
        name: '纸背上的收件人'
        place: "都灵"
        figure: "弗里德里希·尼采"
        story: '都灵寄来一封信，收信的是弗兰茨和伊达·奥弗贝克，尼采签的是狄俄尼索斯。弗兰茨赶到朋友的住处，见他在读自己改过的《尼采反对瓦格纳》校样。离开都灵前，得有人看看箱里除了校样，还该放些什么。'
        story_prose:
          opening:
            - '1889 年 1 月，都灵。一封信寄给弗兰茨和伊达·奥弗贝克，署名和收件人各占一处。弗兰茨赶到都灵时，尼采正在看《尼采反对瓦格纳》的最后一份校样。'
            - '史实里，奥弗贝克在 1 月 8 日找到了朋友，后来写下他当时在看的是什么。在这条分支里，彼得罗在楼梯口备下行李签，露琪亚手边还有一包没有裹好的信。'
            - '这一趟用得上耐心核对门牌、能把人领到住处的人。熟悉校样与私人信件各该怎样登记和保管的人，也有事可做。'
          points:
            p1: '一月八日，{staff}把信上的地址与门牌核过，又在楼梯口等到奥弗贝克，领他走完最后一段。弗兰茨在对的门前停下来，抬手敲了一下。屋里翻过一页纸，门把手慢慢转了半圈。'
            p2: '{staff}照校样和私信各自的去向分开登记，把书名留在一张纸签上，另一张只记谁来收。两包纸各用一根绳扎住。露琪亚把写有收件人的纸签转到里边，用指腹压住翘起来的一角。'
          outcomes:
            all: '一月八日，奥弗贝克找到了尼采。后来，两包纸一起上路。他只打开标有书名的一包，另一包的绳结还朝着箱盖。'
            p2: '纸到了接手的人那里，分成两包。认出书名以后，奥弗贝克把另一包原样放回箱底。'
            p1: '一月八日，奥弗贝克进了朋友的屋子。门在他身后合上时，里面还响着一声轻轻的翻纸声。'
          none: '纸张叠着包好，校样与信上都露出人名。包它的人抽了抽绳头，找不准该系在哪一面。'
          not_admitted: '{staff}没能在住处找到可以接应的人。楼梯扶手上还搁着一张空白的行李签。'
          desync: '另一扇门没有人应。{staff}被召回时，奥弗贝克还站在那一层的楼梯平台上。'
          excerpts:
            p2: '两包纸各用一根绳扎住。露琪亚把写有收件人的纸签转到里边，用指腹压住翘起来的一角。'
            p1: '弗兰茨在对的门前停下来，抬手敲了一下。屋里翻过一页纸，门把手慢慢转了半圈。'
        relic: '一张留底的行李签'
        relic_desc: '游戏时间线里留下的一张行李签副本，收件人写在纸背上。'
        points:
          p1: '核准住处地址，1 月 8 日把奥弗贝克领到对的门前'
          p2: '把改过的校样和私人信件分开登记，确保要交其中一包时不用拆另一包'
        points_fail:
          p1: '奥弗贝克走错了住处。这次见面偏离原时间线，事务所召回员工。'
          p2: '信和校样叠在一起包走。第一个来找校样的人，也会看到那些信上的名字。'
        shift:
          p1:
            was: '尼采从都灵写信给奥弗贝克夫妇。弗兰茨·奥弗贝克于 1889 年 1 月 8 日在都灵找到尼采。'
          p2:
            was: '奥弗贝克事后写信说，他赶到时，尼采正在看《尼采反对瓦格纳》的最后一份校样。'
            now: '校样和信分作两包上路。奥弗贝克一眼就认得哪份是改过的校样，另一包仍然封着。'
        vignettes:
          address: '彼得罗把署名抄进了去向栏。{staff}把纸签翻过来，给他看写着收件人的一面。他用笔划了一道，很轻，底下原来的字还能认出来。'
          privacy: '露琪亚让{staff}扶着纸包，好腾出手裹信。楼梯上有人问信是谁的。她把纸签转向墙，才开口答话。'
          stairs: '{staff}在楼梯平台听见翻纸的声音，楼下随即有人敲门。彼得罗把空白行李签搁在扶手上，回来还找得到。'
text:
  en:
    name: Friedrich Nietzsche
    text: 'German philosopher (1844–1900), author of Thus Spoke Zarathustra and Beyond Good and Evil. He fell seriously ill in Turin in January 1889. His friend Franz Overbeck accompanied him back to Basel. Nietzsche spent his later years in the care of family.'
  zh:
    name: 弗里德里希·尼采
    text: '德国哲学家（1844–1900），著有《查拉图斯特拉如是说》《善恶的彼岸》。1889 年 1 月，他在都灵病重，友人弗兰茨·奥弗贝克陪他回巴塞尔。此后的岁月里，他由家人照料。'
hook: {en: 'He copied the signature where the address should have been.', zh: '他把署名抄到了该填去向的一栏。'}
