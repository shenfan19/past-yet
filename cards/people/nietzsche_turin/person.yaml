    text:
      en:
        name: 'The address on the back'
        place: "Turin"
        figure: "Friedrich Nietzsche"
        story: 'The Basel University Library holds a letter from Nietzsche to Franz and Ida Overbeck, signed Dionysus and dated approximately 4 January 1889 in Turin. Overbeck travelled to Turin after hearing from him. The famous account involving a horse is treated as an anecdote of uncertain detail.'
        relic: 'A duplicate luggage label'
        relic_desc: 'A fictional label copied without reproducing private correspondence.'
        points:
          p1: 'Verify the Turin address so Overbeck can find his friend on January 8 and arrange for someone to stay with him'
          p2: 'Help Overbeck inventory original letters, informal notes and manuscripts intended for publishers in separate packets'
          p3: 'Leave incoming custodians a record of which manuscripts were meant for publication. Keep private letters separately with controlled access'
        points_fail:
          p1: 'Overbeck gets the previous address and cannot find him in Turin. The office recalls the employee.'
          p2: 'In the rush to leave, loose notes go in with the manuscripts. At the next handover nobody can tell what the pieces were for.'
          p3: 'A later editor reads one isolated paper into an unrelated draft. The first custodians left no record of its purpose.'
        shift:
          p1:
            was: 'Nietzsche wrote to the Overbecks from Turin. Franz Overbeck arrived there on January 8, 1889, to find him.'
          p2:
            was: 'The manuscripts and notes were kept in several places. Overbeck and others helped protect them after the crisis.'
            now: 'The papers from Turin have a packet list with their expected recipients. Later readers can use it to trace an original letter.'
          p3:
            was: 'Different people took charge of the papers. Some items were later abridged or altered for print.'
            now: 'Editors receive the papers with records of their purpose. Private letters stay intact, and any cuts to the published text are recorded for later comparison.'
            who: nietzsche_turin
            bio: 'Friends took charge of the letters and papers from Turin. Editing and publication continued for years after Nietzsche could no longer oversee the work.'
        vignettes:
          address: 'Pietro has copied the name Dionysus into the destination line of his inventory. You turn the practice slip and show him the line that names the recipients. He corrects the inventory without writing an explanation of the signature. It is enough to tell him who should be handed the packet.'
          privacy: 'Lucia asks you to hold the bag while she covers the papers. Someone on the stairs wants to know what they say. You leave the outside label visible so she can give directions without opening it. The bag reaches the landing with only the intended name on show.'
          horse: 'Pietro asks whether you know the account people will tell about a horse. You have heard the story many times. When you ask who here saw it, he points to no one. He leaves that line out of the inventory. You hear footsteps on the stairs as the bag is closed.'
      zh:
        name: '纸背上的收件人'
        place: "都灵"
        figure: "弗里德里希·尼采"
        story: '巴塞尔大学图书馆藏有尼采致弗兰茨与伊达·奥弗贝克的信，署名狄俄尼索斯，馆方定在约1889年1月4日，地点为都灵。奥弗贝克接到他的消息后赶到都灵。'
        relic: '一张留底的行李签'
        relic_desc: '留底签，抄写时保留了私信内容的隐私。'
        points:
          p1: '把都灵住址核给奥韦尔贝克，让他能在 1 月 8 日找到旧友并安排有人陪着'
          p2: '陪奥韦尔贝克把住处能找到的原信、随记和准备交出版社的稿分包核点'
          p3: '让接手的人留一张说明，把有证据表明待刊的稿定出来，将属于私人通信的纸另外存放并限定查阅'
        points_fail:
          p1: '他拿到的是上一个住址，到了都灵仍找不到人，事务所因同步失败召回员工。'
          p2: '急着离开时，手边的便纸混入拟刊稿，下一次转交时没有人能辨别各自用途。'
          p3: '日后有人依据孤立的一张纸给别的稿补意，而当时接手的人没留下用途说明。'
        shift:
          p1:
            was: '尼采从都灵写信给奥韦尔贝克夫妇。奥韦尔贝克于 1889 年 1 月 8 日到都灵寻找他。'
          p2:
            was: '尼采的稿件与笔记散存在数地。奥韦尔贝克等人在病发后协助保存材料。'
            now: '都灵带走的纸有分包单，也记录先前拟交给谁。以后找原信时可以从这份单查起。'
          p3:
            was: '病发后遗稿经不同人管理。若干后来出版材料曾删节或改编。'
            now: '出书的人只能领到有相应说明的稿。私人纸件原样存放，编辑删节另有记录，之后读者能区分原件和刊本。'
            who: nietzsche_turin
            bio: '都灵留下的信与稿件由友人接手。它们的编订和刊行经历了多年，原作者当时已无法继续亲自核校。'
        vignettes:
          address: '彼得罗把狄俄尼索斯抄进了登记的去向栏。你翻过练习纸，指给他看写着收件人的一行。他改好登记，没有解说这个署名。知道该把信包递给谁，就够了。'
          privacy: '露琪亚请你扶着提包，她好把文书遮起来。楼梯上有人问里头写了什么。你把包外的签露出来，她不用开包也能说明送到哪里。到了楼梯平台，旁人只看得见应该收包的名字。'
          horse: '彼得罗问，你知不知道人们后来会讲起的那匹马。这故事你听过许多遍。你问在场谁看见了，他一个也指不出来。登记里便空着那一行。提包合上时，楼梯上传来了脚步声。'
text:
  en:
    name: Friedrich Nietzsche
    text: German philosopher, 1844 to 1900. He wrote Thus Spoke Zarathustra and criticised morality and religion. In January 1889 he collapsed in Turin and never recovered his mind, and spent his last years in the care of his mother and sister.
  zh:
    name: 弗里德里希·尼采
    text: 德国哲学家，1844 年生，1900 年去世。他写了《查拉图斯特拉如是说》，批判道德与宗教。1889 年 1 月他在都灵崩溃，再也没有恢复心智，晚年由母亲和妹妹照料。
