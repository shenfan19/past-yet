quotes:
  nietzsche_turin_proofs_echo:
    order: 1
    tier: full
    date: '1888-12'
    checked: official_record
    sources: [nietzsche_turin_preface]
    original: de
    text:
      de:
        who: 'Friedrich Nietzsche'
        quote: 'Die folgenden Kapitel sind sämtlich aus meinen älteren Schriften nicht ohne Vorsicht ausgewählt'
        occasion: 'Vorwort zu Nietzsche kontra Wagner, Turin, Dezember 1888.'
      en:
        who: 'Friedrich Nietzsche'
        quote: 'All the chapters that follow have been selected with some care from my earlier writings'
        occasion: 'From the preface to Nietzsche contra Wagner, Turin, December 1888 (game translation).'
      zh:
        who: '弗里德里希·尼采'
        quote: '接下来的各章全都选自我早年的著作，挑选时我颇为谨慎。'
        occasion: '节选自《尼采反对瓦格纳》序言，1888 年 12 月，都灵（游戏译文）。'
      zh-Hant:
        who: '弗里德里希·尼采'
        quote: '接下來的各章全都選自我早年的著作，挑選時我頗為謹慎。'
        occasion: '節選自《尼采反對瓦格納》序言，1888 年 12 月，都靈（遊戲譯文）。'
      fr:
        who: 'Friedrich Nietzsche'
        quote: 'Tous les chapitres qui suivent ont été sélectionnés avec soin à partir de mes écrits précédents.'
        occasion: 'Extrait de la préface de Nietzsche contra Wagner, Turin, décembre 1888 (traduction du jeu).'
      es:
        who: 'Friedrich Nietzsche'
        quote: 'Todos los capítulos que siguen han sido seleccionados con cierto cuidado de mis escritos anteriores.'
        occasion: 'Del prefacio a Nietzsche contra Wagner, Turín, diciembre de 1888 (traducción del juego).'
      ja:
        who: 'フリードリヒ・ニーチェ'
        quote: '以下のすべての章は、私の以前の著作から慎重に選択されています'
        occasion: 'ニーチェ・コントラ・ワーグナー、トリノ、1888年12月の序文より（ゲーム翻訳）。'
      ko:
        who: '프리드리히 니체'
        quote: '다음의 모든 장은 나의 이전 저작에서 약간의 주의를 기울여 선택되었습니다.'
        occasion: '니체 콘트라 바그너의 서문에서, 토리노, 1888년 12월(게임 번역).'
      ru:
        who: 'Фридрих Ницше'
        quote: 'Все последующие главы были тщательно отобраны из моих предыдущих работ.'
        occasion: 'Из предисловия к книге «Ницше против Вагнера», Турин, декабрь 1888 г. (перевод игры).'
  nietzsche_turin_letter_echo:
    order: 2
    tier: none
    date: '1888-12'
    checked: official_record
    sources: [nietzsche_turin_wagner_letter]
    original: de
    text:
      de:
        who: 'Friedrich Nietzsche'
        quote: 'Hier kommt noch ein schönes Manuskript, etwas Kleines, aber sehr gut Geratenes, auf das ich stolz bin.'
        occasion: 'Begleitbrief an den Verleger Constantin Georg Naumann, Turin, Dezember 1888.'
      en:
        who: 'Friedrich Nietzsche'
        quote: 'Here is another fine manuscript, something small but very well turned out, and I am proud of it.'
        occasion: 'From the letter accompanying the manuscript to publisher Constantin Georg Naumann, Turin, December 1888 (game translation).'
      zh:
        who: '弗里德里希·尼采'
        quote: '又寄来一份漂亮的手稿。它很短，但写得很成功，我为它自豪。'
        occasion: '1888 年 12 月，在都灵随手稿寄给出版社瑙曼的信（游戏译文）。'
      zh-Hant:
        who: '弗里德里希·尼采'
        quote: '又寄來一份漂亮的手稿。它很短，但寫得很成功，我為它自豪。'
        occasion: '1888 年 12 月，在都靈隨手稿寄給出版社瑙曼的信（遊戲譯文）。'
      fr:
        who: 'Friedrich Nietzsche'
        quote: 'Voici encore un beau manuscrit, petit mais très bien réalisé, et j''en suis fier.'
        occasion: 'Extrait de la lettre accompagnant le manuscrit à l''éditeur Constantin Georg Naumann, Turin, décembre 1888 (traduction du jeu).'
      es:
        who: 'Friedrich Nietzsche'
        quote: 'He aquí otro excelente manuscrito, algo pequeño pero muy bien elaborado, y estoy orgulloso de él.'
        occasion: 'De la carta que acompaña al manuscrito al editor Constantin Georg Naumann, Turín, diciembre de 1888 (traducción del juego).'
      ja:
        who: 'フリードリヒ・ニーチェ'
        quote: 'これも素晴らしい原稿です。小さいながらも非常によくできたもので、私はそれを誇りに思っています。'
        occasion: '1888 年 12 月、トリノ、出版者コンスタンティン・ゲオルク・ナウマンに宛てた原稿に添えられた手紙より（ゲーム翻訳）。'
      ko:
        who: '프리드리히 니체'
        quote: '여기 또 하나의 훌륭한 원고가 있습니다. 작지만 매우 훌륭하게 완성된 원고입니다. 저는 그것이 자랑스럽습니다.'
        occasion: '1888년 12월 토리노에서 출판사 콘스탄틴 게오르그 나우만(Constantin Georg Naumann)에게 보낸 원고와 함께 보낸 편지(게임 번역).'
      ru:
        who: 'Фридрих Ницше'
        quote: 'Вот еще одна прекрасная рукопись, небольшая, но очень хорошо сделанная, и я горжусь ею.'
        occasion: 'Из письма к рукописи издателю Константину Георгу Науману, Турин, декабрь 1888 г. (перевод игры).'
