    date: '1888-12'
    checked: official_record
    sources: [nietzsche_turin_preface]
    original: de
    text:
      de: {who: Friedrich Nietzsche, quote: 'Die folgenden Kapitel sind sämtlich aus meinen älteren Schriften nicht ohne Vorsicht ausgewählt', occasion: 'Vorwort zu Nietzsche kontra Wagner, Turin, Dezember 1888.'}
      en: {who: Friedrich Nietzsche, quote: 'All the chapters that follow have been selected with some care from my earlier writings', occasion: 'From the preface to Nietzsche contra Wagner, Turin, December 1888 (game translation).'}
      zh: {who: 弗里德里希·尼采, quote: '接下来的各章全都选自我早年的著作，挑选时我颇为谨慎。', occasion: '节选自《尼采反对瓦格纳》序言，1888 年 12 月，都灵（游戏译文）。'}
  nietzsche_turin_letter_echo:
