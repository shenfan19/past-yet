    text:
      en:
        name: "A book of how things are made"
        place: "Jiangxi"
        figure: "Song Yingxing"
        story: 'Song Yingxing''s Tiangong kaiwu was first printed in 1637. Its chapters describe crafts and production, including papermaking in Killing the Green.'
        relic: "A page of tool drawings"
        relic_desc: "A woodblock print of a loom with every part labelled."
        points:
          p1: 'While the money for the carving is still short, get Tiangong kaiwu to the block cutters so that the book is printed'
          p2: 'Just before the book goes to the carvers, talk him out of cutting the two chapters On Observing the Heavens and On Music, and have them carved with the rest'
        points_fail:
          p1: 'The book is not printed. This branch has come loose from history, and the office recalls the employee.'
          p2: 'As in history the two chapters are cut before printing and later lost; in this branch they are lost too.'
        shift:
          p1:
            was: '1637, fourth month: Song Yingxing wrote his preface, and Tiangong kaiwu was printed with money from his friend Tu Boju.'
          p2:
            was: '1637: in his preface Song wrote that the chapters On Observing the Heavens and On Music were too subtle for him and that he cut them as the book went to the carvers; both were later lost.'
            now: 'The two chapters were carved into the first printing and came down with the eighteen chapters of the book.'
            who: song_yingxing_fengxin
            bio: 'In this timeline Song Yingxing kept the chapters On Observing the Heavens and On Music, and the first printing of Tiangong kaiwu carried them.'
        vignettes:
          strainer: 'You ask which side of the illustrated screen the wet sheet ends up on. The reader turns the print round to mimic the worker''s hands and finally points to the right surface.'
          drying: 'The reader tells the stages out of order. You ask him to trace the wet sheet from the screen to the drying surface. He pauses and moves one caption to the next drawing.'
          sheet: 'The reader drops a loose proof. You pick it up by the blank border and lay it beside the craft it was meant to explain. He puts a drying weight on the corner.'
      zh:
        name: "一本讲万物如何造成的书"
        place: "江西"
        figure: "宋应星"
        story: '宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。'
        relic: "一页工具图"
        relic_desc: "一张木刻版画，织机的每个部件都标了名。"
        points:
          p1: '刻书的钱还没凑齐时，帮他把《天工开物》送进刻坊，让书照常刊刻'
          p2: '临付梓前，劝住他删去《观象》《乐律》两卷，让这两卷和全书一起刻出来'
        points_fail:
          p1: '书没能付梓，这条分支与历史脱了节，事务所召回员工。'
          p2: '两卷照史实临梓删去，后来失传，这条分支里也没有。'
        shift:
          p1:
            was: '崇祯十年孟夏，宋应星写成自序，《天工开物》由友人涂伯聚出资刊刻。'
          p2:
            was: '崇祯十年，宋应星在自序里说《观象》《乐律》两卷道理太精，自认不是自己的本分，临付梓时删去；这两卷后来失传。'
            now: '《观象》《乐律》两卷刻进了初刊本，和全书十八卷一起传了下来。'
            who: song_yingxing_fengxin
            bio: '这条时间线里，宋应星没有删去《观象》《乐律》两卷，《天工开物》初刊时就有它们。'
        vignettes:
          strainer: '你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。'
          drying: '读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。'
          sheet: '读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。'
text:
  en:
    name: Song Yingxing
    text: Chinese scholar of the late Ming, 1587 to about 1666. He wrote The Exploitation of the Works of Nature, printed in 1637, which describes farming, textiles, metallurgy and many crafts in detail.
  zh:
    name: 宋应星
    text: 晚明学者，1587 年生，约 1666 年去世。他的《天工开物》1637 年刊行，详细记述农业、纺织、冶金和许多手工业。
