    text:
      en:
        name: "A book of how things are made"
        place: "Jiangxi"
        figure: "Song Yingxing"
        story: 'Song Yingxing''s Tiangong kaiwu was first printed in 1637. Its chapters describe crafts and production, including papermaking in Killing the Green.'
        relic: "A page of tool drawings"
        relic_desc: "A woodblock print of a loom with every part labelled."
        points:
          p1: 'Follow the sheet through the drawings'
          p2: 'Catch a caption beside the wrong stage'
          p3: 'Set aside a clean copy for the workshop reader'
        vignettes:
          strainer: 'You ask which side of the illustrated screen the wet sheet ends up on. The reader turns the print round to mimic the worker''s hands and finally points to the right surface.'
          drying: 'The reader tells the stages out of order. You ask him to trace the wet sheet from the screen to the drying surface. He pauses and moves one caption to the next drawing.'
          sheet: 'The reader drops a loose proof. You pick it up by the blank border and lay it beside the craft it was meant to explain. He puts a drying weight on the corner.'
      zh:
        name: "一本讲万物如何造成的书"
        place: "江西"
        figure: "宋应星"
        story: '宋应星的《天工开物》初刊于 1637 年，各篇写生产与手艺，其中《杀青》记造纸。'
        relic: "一页工具图"
        relic_desc: "一张木刻版画，织机的每个部件都标了名。"
        points:
          p1: '沿图找到纸张经过的几道工序'
          p2: '找出跟工序串了位置的图注'
          p3: '给工坊读者留一张干净的图样'
        vignettes:
          strainer: '你问图里的纸帘，湿纸最后留在哪一面。读者把图转过来，照着图里人的手势比了一遍，这才指准。'
          drying: '读者把几道工序说串了。你请他顺着湿纸，从纸帘跟到烘干处。他停下来，把一处图注挪到了下一幅图。'
          sheet: '读者掉了一张散开的校样。你捏着空白边捡起来，放回它要说明的那道工序旁。他在纸角压了块镇纸。'
text:
  en:
    name: Song Yingxing
    text: Chinese scholar of the late Ming, 1587 to about 1666. He wrote The Exploitation of the Works of Nature, printed in 1637, which describes farming, textiles, metallurgy and many crafts in detail.
  zh:
    name: 宋应星
    text: 晚明学者，1587 年生，约 1666 年去世。他的《天工开物》1637 年刊行，详细记述农业、纺织、冶金和许多手工业。
hook: {en: 'Could you follow the craft from the page?', zh: '看图能认出哪一步吗'}
