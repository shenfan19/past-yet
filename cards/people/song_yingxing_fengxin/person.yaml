        name: "A book of how things are made"
        place: "Jiangxi"
        figure: "Song Yingxing"
        story: "Song Yingxing, a provincial teacher and official, writes a book on how crops, cloth, salt, iron and paper are made. It was soon almost lost in China and survived in print in Japan."
        relic: "A page of tool drawings"
        relic_desc: "A woodblock print of a loom with every part labelled."
        points:
          p1: "Learn how a loom and a kiln are worked"
          p2: "Check the drawings of tools (a craftsperson)"
          p3: "Keep a copy on the shelf (a record keeper or a stubborn employee)"
      zh:
        name: "一本讲万物如何造成的书"
        place: "江西"
        figure: "宋应星"
        story: "宋应星是地方上的教师和官员，写了一本讲庄稼、布匹、盐、铁和纸怎样制成的书。这本书在中国很快几乎失传，靠日本的刻本保存了下来。"
        relic: "一页工具图"
        relic_desc: "一张木刻版画，织机的每个部件都标了名。"
        points:
          p1: "弄清织机和窑是怎么操作的"
          p2: "核对工具图"
          p3: "把一本留在书架上"
text:
  en:
    name: Song Yingxing
    text: Chinese scholar of the late Ming, 1587 to about 1666. He wrote The Exploitation of the Works of Nature, printed in 1637, which describes farming, textiles, metallurgy and many crafts in detail.
  zh:
    name: 宋应星
    text: 晚明学者，1587 年生，约 1666 年去世。他的《天工开物》1637 年刊行，详细记述农业、纺织、冶金和许多手工业。
