    text:
      en:
        name: "The parsonage in winter"
        place: "Haworth"
        figure: "Emily Brontë"
        story: 'Wuthering Heights appeared in 1847 under the name Ellis Bell. The novel frames much of its story as Nelly Dean''s account to Lockwood.'
        relic: "A dog collar"
        relic_desc: "A worn leather collar from the parsonage mastiff."
        points:
          p1: 'When London letters mix up the Bells'' books, help the sisters assemble papers that identify each author''s work'
          p2: 'When a printer''s error changes a line, help Emily leave corrections that a later printer can check'
          p3: 'While Emily can still check how her characters speak, have her prepare a dialect copy for a later edition'
          p4: 'Ask Emily what help she is willing to accept, and let her choose where and with whom she rests'
        points_fail:
          p1: 'The letters still attribute the books to one pen name and the sisters cannot take separate proof to London. The clarification is lost, and the office recalls the employee.'
          p2: 'The next printer must guess which readings were intentional, and errors carry forward.'
          p3: 'Her family must decide which lines to change when the book is reissued, with no way to establish which spellings the author wanted.'
          p4: 'Her family can see that the stairs tire her. They still have to wait for her to ask before they know what help she wants.'
        shift:
          p1:
            was: 'In July 1848 Charlotte and Anne Brontë went to London from Haworth to explain to a publisher that the Bell pen names belonged to different writers.'
          p2:
            was: 'The 1847 Wuthering Heights contained printing errors. Corrections appeared in the new edition of 1850.'
            now: '{staff} leaves Emily a copy to mark and writes out the errors she identifies with page references.'
          p3:
            was: 'Emily died in Haworth in 1848. Charlotte edited the 1850 edition and changed some dialect spellings.'
            now: '{staff} puts the dialect pages in front of Emily separately and records the spellings she approves apart from printing errors. Charlotte has that copy when she prepares the next edition.'
            who: emily_bronte_haworth
            bio: 'Emily left an annotated copy of Wuthering Heights with the dialect checked in her own hand. Later printers could preserve the way she had written her characters'' voices.'
          p4:
            was: 'On 19 December 1848 Emily died at Haworth parsonage. Through her illness she had refused to see a doctor, and agreed only on the day she died.'
            now: 'In this branch {staff} asks instead of choosing for her. Emily picks a place to rest and a person to stay nearby while the household goes on around her.'
        vignettes:
          witness: 'The reader thinks the person telling the story saw it all. You ask how she learned one particular detail. They trace the sentence back to the speaker who supplied it.'
          voices: 'The reader gives the whole page one voice. You ask them to try again from the place Nelly takes over. A listener can now tell when one speaker is passing the story to another.'
          mark: 'You leave a scrap at the point where the telling changes hands. The reader returns to it before deciding whether a later passage contradicts what they heard.'
      zh:
        name: "冬天的牧师住宅"
        place: "霍沃斯"
        figure: "艾米莉·勃朗特"
        story: '《呼啸山庄》1847 年以埃利斯·贝尔的名字出版。小说的大段故事借内莉·迪恩讲给洛克伍德听。'
        relic: "一条狗项圈"
        relic_desc: "牧师住宅里那条大狗用过的旧皮项圈。"
        points:
          p1: '在伦敦来函把几位贝尔的作品混起来时，帮哈沃思的姐妹从书信中理出能各自认领的作品'
          p2: '发现初版里不同于原句的误字时，帮艾米莉留下逐条可查的勘误'
          p3: '趁艾米莉还能核对人物说话的声音，请她定一份以后重印时可照用的方言校本'
          p4: '问艾米莉愿意接受哪些照料，请她自己挑在哪里歇、想让谁陪在近处'
        points_fail:
          p1: '几份来函仍把书归到同一个笔名下，姐妹带不出能分开认领的文件。澄清落空，员工因同步失败被召回。'
          p2: '下次排印的人只能从初版猜测哪些字本来就这样写，排字错误继续传下去。'
          p3: '再版时只能由家人判断哪里读不顺，改字里分不清哪些是作者原意。'
          p4: '家里人听得出她上楼越来越费力。她还没开口，大家也不知道她愿意接受什么帮助。'
        shift:
          p1:
            was: '1848 年 7 月，夏洛蒂与安妮·勃朗特从哈沃思到伦敦，向出版人澄清几个贝尔笔名并非同一作者。'
          p2:
            was: '1847 年版《呼啸山庄》留有排印错误，1850 年新版才作校订。'
            now: '{staff}在艾米莉手边留一册可圈改的印本，再把她指出的误字抄成附有页码的清单。'
          p3:
            was: '1848 年艾米莉在哈沃思去世；1850 年的新版由夏洛蒂编辑，其中改动了部分方言拼写。'
            now: '{staff}把方言页分开请艾米莉逐句审过，将她亲自核准的拼写和仍可改的排印错误分明标记。夏洛蒂后来再版时有了这份依据。'
            who: emily_bronte_haworth
            bio: '艾米莉的《呼啸山庄》留下一部她亲自核过方言的印本。后来的重印能够保留人物的原有说话方式。'
          p4:
            was: '1848 年 12 月 19 日，艾米莉在霍沃斯的牧师住宅去世。病中她一直拒绝看医生，到去世当天才答应。'
            now: '这条分支里，{staff}先问艾米莉的意思。她选了个能歇的地方，也选好谁在近处陪她。家里人照她的话安排。'
        vignettes:
          witness: '读者以为讲故事的人什么都看见了。你问有一件事她是从哪儿知道的。他把那句话往回找，找到了先说这事的人。'
          voices: '读者整页只用一个声音。你请他从内莉接过话头处再念。听的人这回听得出，故事什么时候交到了另一个人手上。'
          mark: '你在换人讲述处夹了块纸。读者觉得后面一段同刚才抵触，便先翻回纸签在的地方。'
text:
  en:
    name: Emily Brontë
    text: English novelist and poet, 1818 to 1848, who lived at the parsonage in Haworth. Her only novel, Wuthering Heights, appeared in 1847 under the name Ellis Bell. She died of tuberculosis a year later.
  zh:
    name: 艾米莉·勃朗特
    text: 英国小说家与诗人，1818 年生，1848 年去世，住在霍沃斯的牧师住宅。她唯一的小说《呼啸山庄》1847 年以埃利斯·贝尔之名出版。一年后她死于肺结核。
