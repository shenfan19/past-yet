    text: {en: 'Corrie hid in the burrows on the day set for her public debut. Fleay reports that by the time she was dug out, most visitors had gone.', zh: '科里在预告的公开亮相当天躲入洞穴。弗莱记载，挖出科里时，多数观众已经离开。'}
    line: {en: 'March 1944: Corrie hid before her public debut. By the time keepers dug her out, most visitors had left.', zh: '1944 年 3 月，科里在亮相前躲进洞里。饲养员挖出科里时，多数观众已经离开。'}
