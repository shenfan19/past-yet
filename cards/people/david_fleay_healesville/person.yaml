    text:
      en:
        name: Let Corrie come out on her own
        place: Healesville Sanctuary, Victoria
        figure: David Fleay
        story: 'In late 1943 Jill, a platypus at Healesville Sanctuary, hatched a young one later named Corrie. David Fleay and his team confirmed the birth in January 1944 when they opened the nest. On 26 February he first observed Corrie come out to swim.'
        story_prose:
          opening:
            - 'The soil is still soft at the Healesville burrow. David Fleay has opened the observation space to examine Corrie, the young platypus, before returning her to Jill’s nest. A keeper’s boot stops at the crumbling edge.'
            - 'Corrie was the first platypus successfully reared in captivity. On 26 February 1944 Fleay first saw her leave the burrow of her own accord. The March public appearance brought spades to the enclosure. Here you can help with her care and ask the crowd to wait.'
            - 'A traveller who watches the bank can help Fleay keep the opening clear. Someone who pays attention to the animals can leave nesting leaves for Jill to collect. For the public appearance, send someone who can persuade the keepers to put the spades down.'
          points:
            p1: 'You signal to the keeper to stay back. As the boot stops, crumbs of earth slide past the rim. You steady the board at the edge while Fleay returns Corrie to the nest. Fleay waits for things to go quiet inside before he draws back his hand.'
            p2: 'The keeper carries an armful of leaves toward the burrow. You show him the shallows where Jill usually came out the night before and ask him to leave the leaves there. You both walk away while there is still light. Jill wades out with leaves in her bill and turns back for the bank.'
            p3: 'Someone has checked their watch three times, and a keeper brings a spade to the rail. You ask Fleay if the sign can simply say to wait for Corrie. A child in front makes room for someone behind to see the water. The keeper puts the spade away. When Corrie’s bill comes into view, even the people at the rail stay quiet.'
          outcomes:
            all: 'Corrie swims out from the burrow. The sanctuary has its public appearance, and the bank beside the rail has no fresh spade marks.'
            p1: 'By the time the board comes away, Corrie is back in the nest. This trip preserves the early rearing record.'
            p2: 'There are fewer leaves at the water’s edge. The keeper lifts his boot out of the mud and leaves the bank undisturbed.'
            p3: 'The crowd sees Corrie come out on her own. The report records the appearance with the spades put away.'
          none: 'The leaves stay where they were. Some visitors wait where they can still see the last ride home.'
          not_admitted: 'A keeper asks the visitor to wait outside the rail. Nobody comes to fetch you before closing.'
          desync: 'Loose soil blocks the opening before Fleay can return the young animal. The historical rearing record falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'Fleay waits for things to go quiet inside before he draws back his hand.'
            p2: 'Jill wades out with leaves in her bill and turns back for the bank.'
            p3: 'When Corrie’s bill comes into view, even the people at the rail stay quiet.'
        relic: A wooden feed scoop
        relic_desc: A small wooden scoop with a worn handle.
        points:
          p1: 'Keep loose soil clear of the opening long enough for Fleay to get Corrie back into the burrow'
          p2: 'Ask the keepers to leave fresh leaves near the pool where Jill can gather them after dark'
          p3: 'Persuade the sanctuary to leave the burrow closed when Corrie hides on the day of the family display'
        points_fail:
          p1: 'Loose soil covers the opening before Fleay can return Corrie safely. The first successful rearing falls out of sync with history, and the office calls {staff} back that day.'
          p2: 'The keepers leave the area as it is. Jill will have to gather leaves from farther along the bank.'
          p3: 'The advertised time passes and the sanctuary resorts to shovels. By the time Corrie is brought out, most visitors have gone.'
        shift:
          p1:
            was: 'On 3 January 1944, Fleay returned the young platypus to the disturbed nest, and Jill went on rearing her.'
          p2:
            was: 'Fleay records that Jill pushed out some nesting material and earth after the burrow was opened.'
            now: 'In this branch {staff} asks the keepers to leave leaves within reach of the pool. Jill can gather them after dark without anyone opening her burrow again.'
          p3:
            was: 'In March 1944, Corrie retreated into the tunnels during the advertised family display and was dug out after most visitors had left.'
            now: 'In this branch {staff} shows the keepers the evening observations and gets them to put down the shovels. The visitors still there can wait by the pool or come back another day.'
      zh:
        name: 等科里自己出来
        place: 维多利亚州希尔斯维尔野生动物保护区
        figure: 戴维·弗莱
        story: '1943 年末，希尔斯维尔保护区的鸭嘴兽吉尔孵出一只幼兽，后来取名科里。1944 年 1 月，戴维·弗莱和同事打开巢穴，确认幼兽已经孵出。2 月 26 日，弗莱第一次观察到科里出洞游水。'
        story_prose:
          opening:
            - '希尔斯维尔保护区泥土还很松。弗莱打开观察处，想看看鸭嘴兽幼崽科里，再把它送回吉尔的巢。饲养员的靴尖停在塌下来的土边。'
            - '史实里，科里是首只在圈养条件下成功育成的鸭嘴兽。1944 年 2 月 26 日，弗莱观察到它自行出巢。到了三月的公开亮相，保护区用了铁锹把它带出来。这里可以让照料继续，也可以请观众再等一会儿。'
            - '留心泥土的员工帮弗莱守住洞口。懂动物习性的人可以给吉尔留些它自己会取的叶子。最后要有人和饲养员商量，能否把铁锹放下。'
          points:
            p1: '你朝饲养员摆手叫他别再往前。鞋停住时，一小片土顺着洞沿滑下来。你替弗莱稳住洞口边上那块木板，腾出了他送科里回去的余地。弗莱等里面安静下来，才把手收回。'
            p2: '饲养员抱着叶子走到水池边，正要往巢旁放。你指给他看吉尔昨晚常上岸的浅边，让他把叶子留在那里。入夜前你们都退开了。吉尔蹚过浅水，嘴里衔着叶子掉头往岸边走。'
            p3: '有人瞧了三次表，饲养员已经把铁锹提到围栏边。你问弗莱，可不可以在牌子上只写「等它出来」。前排一个孩子让给后面的人看水面，饲养员把铁锹靠回棚下。科里露出嘴的时候，站得最近的人也没有出声。'
          outcomes:
            all: '科里从巢里出来游了一圈。展场后来仍记着这个下午，围栏旁没有留下铁锹挖土的痕迹。'
            p1: '洞边的板子移下来时，科里已经回巢。这趟守住了早期育成记录。'
            p2: '水边的叶子少了几片。再往巢旁走要踩下去，饲养员把脚从浅泥里拔了出来。'
            p3: '人群等到科里自己出现。回程报告保留了这次亮相，并略去了史实中为亮相动用铁锹的记录。'
          none: '水池边没有人再换叶子，游客仍等在离开前的最后一班车旁。'
          not_admitted: '饲养员请来客在围栏外等。到关门，围栏内没有人来领你。'
          desync: '松土堵住了洞口，弗莱没能及时把幼崽送回巢。原有育成记录脱节，事务所召回员工。'
          excerpts:
            p1: '弗莱等里面安静下来，才把手收回。'
            p2: '吉尔蹚过浅水，嘴里衔着叶子掉头往岸边走。'
            p3: '科里露出嘴的时候，站得最近的人也没有出声。'
        relic: 一把木饲料勺
        relic_desc: 一把小木勺，柄已经磨光了。
        points:
          p1: '挡住落进洞口的松土，让弗莱来得及把科里送回巢里'
          p2: '请饲养员在水池边备些新叶，让吉尔天黑后能自己衔取'
          p3: '科里在全家亮相前躲进洞里，劝保护区放下铁锹，等它自己出来'
        points_fail:
          p1: '弗莱还没来得及把科里送回去，松土就堵住了洞口。这条分支失去了首次成功育成的记录，{staff}当天因同步失败被召回。'
          p2: '饲养员照常离开。吉尔要衔叶子，还得沿着岸边多走一段。'
          p3: '约好的钟点过了，保护区还是用了铁锹。科里被带出来时，多数观众已经走了。'
        shift:
          p1:
            was: '1944 年 1 月 3 日，弗莱把幼兽送回受扰的巢里，吉尔后来继续把它养大。'
          p2:
            was: '弗莱记下了打开巢穴后，吉尔把一部分垫窝的材料和泥土推出洞口。'
            now: '这条分支里，{staff}请饲养员把叶子留在水池边。吉尔天黑后可以自己衔取，饲养员也不用再开洞。'
          p3:
            was: '1944 年 3 月，全家亮相时科里躲进地道，保护区动土把它挖出来时，多数观众已经离开。'
            now: '这条分支里，{staff}拿晚间观察记录说服饲养员收起铁锹。留下的观众可以在池边等，也可以改天再来。'
text:
  en:
    name: David Fleay
    text: 'David Fleay (1907–1993) was an Australian naturalist. As director of the sanctuary at Healesville, he led the first successful breeding of a platypus in captivity and documented the young animal’s development in The Victorian Naturalist.'
  zh:
    name: 戴维·弗莱
    text: '戴维·弗莱（1907—1993）是澳大利亚博物学家。任希尔斯维尔保护区主任期间，他主持了首次成功的鸭嘴兽人工繁育，随后在《维多利亚博物学家》记录幼兽的发育。'
hook: {en: 'Corrie has gone underground. Will the keepers put down their shovels?', zh: '科里躲进洞里了，饲养员肯收起铁锹吗？'}
