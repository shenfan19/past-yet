    text:
      en:
        name: 'Her name before takeoff'
        place: "Jacksonville"
        figure: "Bessie Coleman"
        story: 'Bessie Coleman earned an international pilot’s licence in France on 15 June 1921. On 30 April 1926, she died during a practice flight at Paxon Field in Jacksonville, ahead of a May Day event.'
        story_prose:
          opening:
            - 'Jacksonville, April 1926. Bessie Coleman learned to fly in France. She is in Florida now, preparing for a local aviation event.'
            - 'In history, she visited schoolchildren on 29 April and died in a practice flight the next day. In this branch the organisers want to borrow the car meant to get her to the schools.'
            - 'Someone who can talk with the schools and the organisers can help. So can someone who knows aircraft and can ask for another check with everyone waiting to take off.'
          points:
            p4: '{staff} gets the ground crew there first and hears out the inspection with Coleman and the pilot. Someone waiting to watch asks who will take the reserved places. Coleman asks for the flight book. The pilot points out a time they could use on another day. She takes the pencil and leaves today’s line blank.'
            p2: 'The pupils have plenty of questions. One has been folded so small nobody takes it when the pupil holds it up. {staff} hands it to the teacher who stays behind, asks him to make time for another lesson, and gives Coleman the teacher’s address so she can send news about training. The teacher copies his address in one corner of the board. The last pupil out turns round and writes down the house number again.'
            p1: '{staff} takes the event schedule to the school, finds out which times the pupils have already been given, then gets another car for the organisers. By the time Coleman arrives there is a line in the hall. A child at the front straightens a paper with her name on it. Only after she sits does he push his question across the desk.'
          outcomes:
            all: 'There is no practice flight that day. Coleman puts the teacher’s address inside the book, and she and the pilot turn the blank line to the top.'
            p4: 'The practice flight is left for another day. When the field closes, nobody has put a new number on the line.'
            p2: 'The teacher takes the questions into the classroom and puts them beside the book for the next lesson.'
            p1: 'The school visit goes ahead as arranged. At the end, someone is still waiting by the door for the paper with Coleman’s name.'
          none: 'After the event there are still several lists on the table, with nobody left to take them.'
          not_admitted: '{staff} reaches neither the school organisers nor the crew. Someone carries the last stool away from the doorway.'
          desync: 'The school visit is struck off the schedule. As the office calls {staff} back, children are still waiting at the gate.'
          excerpts:
            p4: 'The pilot points out a time they could use on another day. She takes the pencil and leaves today’s line blank.'
            p2: 'The teacher copies his address in one corner of the board. The last pupil out turns round and writes down the house number again.'
            p1: 'A child at the front straightens a paper with her name on it. Only after she sits does he push his question across the desk.'
        relic: 'A dated printer’s proof'
        relic_desc: 'A fictional ground crew notice, with Coleman’s name in full.'
        points:
          p1: 'Keep the air show preparations from displacing Coleman''s visits with Jacksonville students'
          p2: 'Help Coleman arrange one follow-up lesson with a local teacher who can answer the students’ questions about how to learn to fly'
          p4: 'Ask the crew to review the aircraft on the ground and have the two aviators postpone the practice flight if it needs more work'
        points_fail:
          p1: 'The organizers drop the visits to make up time. The branch falls out of sync and the office recalls the employee that day.'
          p2: 'The students go home with their questions and no teacher has agreed to a follow-up lesson.'
          p4: 'The old aircraft takes off as planned. Coleman and the pilot die on the practice flight.'
        shift:
          p1:
            was: 'On 29 April 1926, Coleman visited students at Jacksonville''s Black public schools.'
          p2:
            was: 'Coleman wanted to open a flying school and spoke to students in Jacksonville. Her school did not open in her lifetime.'
            now: 'In this branch a teacher collects the students’ questions and agrees to hold a follow-up lesson. Coleman has an address where she can send news of training opportunities.'
          p4:
            was: 'On 30 April 1926, Coleman and the pilot died in a practice flight accident at Paxon Field.'
            now: 'In this branch the crew recommends another ground inspection and the aviators leave the practice flight for another day.'
            who: bessie_coleman_jacksonville
            bio: 'After Jacksonville, Coleman kept flying and continued working to open flight training to Black students.'
        vignettes:
          proof: 'Ann is short a line and has cut the pilot’s given name. You trade out two words of puffery to free the space. At pickup, she makes the runner read the full name once before folding the proof. He can now tell someone who will fly without saying only that it is a woman.'
          school: 'Lewis thinks the crowd wants nothing but the show time. A child near the fence asks where the pilot learned. You tell Lewis where the licence was issued and let him use the last line for a fact he can repeat. When he takes the proof, he practises saying the date as well as the place.'
          ground: 'The field is filling and you know the next day’s notice will no longer describe the same show. Ann asks whether she should hand out the proof now. You keep one dated copy and help her send the others to the gate. Your visit ends on the ground, with the spectators still arriving.'
      zh:
        name: '起飞之前，她的姓名'
        place: "杰克逊维尔"
        figure: "贝茜·科尔曼"
        story: '贝茜·科尔曼于1921年6月15日在法国取得国际飞行执照。1926年4月30日，她在杰克逊维尔帕克森机场为五一活动试飞时遇难。'
        story_prose:
          opening:
            - '1926 年四月，杰克逊维尔。贝茜·科尔曼在法国拿到飞行执照，这一回来到佛罗里达，为当地活动做准备。'
            - '史实里，她在四月二十九日到学校和学生见面，第二天在试飞中遇难。在这条分支里，活动的人来借原来送她去学校的车。'
            - '这趟用得上能跟学校和主办人商量的人，也用得上懂机务、敢在别人都等着起飞时提议再查一遍的人。'
          points:
            p4: '{staff}请负责机务的人先到场，和科尔曼、驾驶员一起听完地面检查意见。等候起飞的人问要把领到的座位让给谁，科尔曼说，先把今天的本子拿来。 驾驶员把明日以后可用的时段指给她看。她取过铅笔，把今天那一栏留空。'
            p2: '学生提了许多问题，有一张纸折得太小，开口时没人接。{staff}把它递给留下来的老师，请他单独留一堂课，再问科尔曼有什么训练消息愿意寄来。 老师把回信地址抄在黑板一角。最后一个走的孩子回过头，又抄了一遍门牌。'
            p1: '{staff}把主办人的时间表拿到学校，问清哪一段已经通知了学生，再回去借到另一趟车给活动的人用。科尔曼到学校时，走廊已经排起队。 前排一个孩子把写着她名字的纸扶正。等她在桌边坐下，那孩子才把自己的问题推过去。'
          outcomes:
            all: '这天没试飞。科尔曼把老师的地址压在记录本里，和驾驶员一起把留空的那一页翻到了上面。'
            p4: '试飞另择日期。当天收场时，还没人往那一栏添新的数字。'
            p2: '当地老师把那叠问题收进教室，放到下一堂课要用的本子旁边。'
            p1: '学校的会面按约举行。散场时，写着科尔曼名字的纸还有人在门边等着取。'
          none: '活动散了，桌上剩下几页无人带走的名单。'
          not_admitted: '{staff}没能见到学校和机场两边的人。有人从门边提走了最后一只凳子。'
          desync: '访校安排从时间表上划掉。事务所召回{staff}时，校门边还有孩子等着。'
          excerpts:
            p4: '驾驶员把明日以后可用的时段指给她看。她取过铅笔，把今天那一栏留空。'
            p2: '老师把回信地址抄在黑板一角。最后一个走的孩子回过头，又抄了一遍门牌。'
            p1: '前排一个孩子把写着她名字的纸扶正。等她在桌边坐下，那孩子才把自己的问题推过去。'
        relic: '一张有日期的样张'
        relic_desc: '地面告示，完整排出了科尔曼的姓名。'
        points:
          p1: '护住科尔曼的学校行程，别让赶着筹备试飞的人取消她和学生见面的时间'
          p2: '帮科尔曼同当地老师约好一堂后续课，请老师接着回答学生怎样学飞的问题'
          p4: '请机务人员先在地面复查飞机，若还需检修，就劝科尔曼和驾驶员改天再飞'
        points_fail:
          p1: '临时筹备挤掉了约好的到访，科尔曼赶不到学校，这条分支与史实脱节，员工当天被召回。'
          p2: '孩子们问过学飞的事，散场时还没有老师答应接着教。'
          p4: '旧飞机按原安排升空，科尔曼和驾驶员在试飞中遇难。'
        shift:
          p1:
            was: '1926 年 4 月 29 日，科尔曼到杰克逊维尔的黑人公立学校拜访学生。'
          p2:
            was: '科尔曼到杰克逊维尔的学校与学生见面，也想筹办自己的飞行学校。她生前学校未能开办。'
            now: '这条分支里，一位老师收好学生的问题，答应再讲一堂课。科尔曼留下这位老师的地址，往后有学飞的消息还能寄来。'
          p4:
            was: '1926 年 4 月 30 日，科尔曼和驾驶员在帕克森机场的试飞事故中遇难。'
            now: '这条分支里，机务人员建议再做一次地面检查，科尔曼和驾驶员把试飞改到别的日子。'
            who: bessie_coleman_jacksonville
            bio: '科尔曼从杰克逊维尔回去后继续飞行，也继续筹办向黑人学生开放的飞行训练。'
        vignettes:
          proof: '安少了一行，已经把飞行员的名字裁得只剩姓。你删掉两个吹捧词，给全名腾出位置。跑腿人来取时，她请他念全名，再把样张折好。有人问谁要飞，他可以直接说出名字。'
          school: '刘易斯以为围观的人只想知道几点开场。有孩子在围栏边问，这位飞行员在哪儿学的。你告诉他执照是在哪儿发的，把最后一行留给这个可以复述的事实。他取走样张时，连日期也练着念了一遍。'
          ground: '场边的人越来越多，你知道明天的告示不会再写这场表演。安问是不是这会儿就发。你留一份注明日期的样张，帮她把别的送到门口。你的行程在地面结束，观众还在往这儿来。'
text:
  en:
    name: Bessie Coleman
    text: American aviator, 1892 to 1926, the first Black woman to hold a pilot licence. Refused entry to flight schools in the United States, she learned French and trained in France. She died in a crash in Jacksonville in 1926.
  zh:
    name: 贝茜·科尔曼
    text: 美国飞行员，1892 年生，1926 年去世，第一位取得飞行执照的黑人女性。她在美国被飞行学校拒之门外，于是学了法语，到法国受训。1926 年她在杰克逊维尔的一次坠机中去世。
