- bessie_coleman_jacksonville
text:
  en:
    name: Bessie Coleman
    text: American aviator, 1892 to 1926, the first Black woman to hold a pilot licence. Refused entry to flight schools in the United States, she learned French and trained in France. She died in a crash in Jacksonville in 1926.
  zh:
    name: 贝茜·科尔曼
    text: 美国飞行员，1892 年生，1926 年去世，第一位取得飞行执照的黑人女性。她在美国被飞行学校拒之门外，于是学了法语，到法国受训。1926 年她在杰克逊维尔的一次坠机中去世。
