text:
  en:
    name: Tiedemann Giese
    text: Churchman of Royal Prussia, 1480 to 1550, born in Danzig, and the closest friend of Copernicus. He urged Copernicus to publish, wrote about his last days, and after his death protested against the unsigned preface of the printed book.
  zh:
    name: 蒂德曼·吉泽
    text: 王室普鲁士的教会人士，1480 年生于但泽，1550 年去世，是哥白尼最亲近的朋友。他劝哥白尼出版著作，写信记下他最后的日子，哥白尼死后又对印本里那篇不署名的序言提出抗议。
