    level: usable
    use: [story, history, wiki]
    sources: [ahram_ibn_khaldun, encyclopedia_ibn_khaldun]
    text:
      en: 'In 1382 he moved to Cairo at the invitation of Sultan Barquq.'
      zh: '1382 年，他应苏丹巴尔库克之邀移居开罗。'
    line:
      en: '1382: Ibn Khaldun comes to Cairo at the invitation of Sultan Barquq.'
      zh: '1382 年，伊本·赫勒敦应苏丹巴尔库克之邀来到开罗。'
  qadi:
    date: '1384'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ahram_ibn_khaldun, encyclopedia_ibn_khaldun]
    text:
      en: 'In 1384 he became chief judge of the Maliki school in Cairo, a post he held six times in all.'
      zh: '1384 年他出任开罗马立克派首席法官，前后共六次担任此职。'
    line:
      en: '1384: he is made chief judge of the Maliki school.'
      zh: '1384 年，他出任马立克派首席法官。'
  shipwreck:
    date: '1384'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [encyclopedia_ibn_khaldun, ahram_ibn_khaldun]
    text:
      en: 'In 1384 his wife and daughters, on their way to join him, died in a shipwreck off Alexandria.'
      zh: '1384 年，他的妻女在亚历山大港外沉船遇难。'
    note: 'Death: written as a plain fact.'
    line:
      en: 'The same year his wife and daughters die in a shipwreck off Alexandria.'
      zh: '同年，他的妻女在亚历山大港外沉船遇难。'
  timur:
    date: '1401'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_ibn_khaldun_later, encyclopedia_ibn_khaldun]
    text:
      en: 'Early in 1401, during the siege of Damascus, he met Timur outside the city, and later obtained leave to return to Egypt.'
      zh: '1401 年初大马士革被围时，他在城外见到帖木儿，后来获准回到埃及。'
    line:
      en: 'Early 1401: outside besieged Damascus, Ibn Khaldun meets Timur.'
      zh: '1401 年初，在被围的大马士革城外，伊本·赫勒敦见到了帖木儿。'
  death:
