    text:
      en:
        name: 'How long the gate was open'
        place: "Cairo"
        figure: "Ibn Khaldun"
        story: 'Ibn Khaldun came to Cairo in 1382 at the invitation of Sultan Barquq and in 1384 was made chief judge of the Maliki school; that year his wife and daughters died in a shipwreck off Alexandria. Early in 1401 he met Timur outside Damascus. He died in Cairo on 17 March 1406 and was buried outside the Bab al-Nasr. In the Muqaddimah he asks historians to test reports against what could happen in the society they describe.'
        relic: 'A checked report'
        relic_desc: 'A report of a procession, with the place the watcher stood written in the margin.'
        points:
          p1: 'Be taken in by the clerks of the court, then copy the day''s judgements fair'
          p2: 'When a report of a crowd comes in, ask where the teller stood and how long the gate was open'
          p3: 'On the day of the burial, walk with the bier to the Bab al-Nasr'
        vignettes:
          gate: '{staff} asks a clerk, made up for the game, how long the gate stood open while the crowd went through. He writes the minutes in the margin beside the total, and then changes the total to an estimate.'
          two: '{staff} gives a second watcher, made up for the game, a sheet of her own, so that her account of the street does not end up squeezed into the margin of his.'
          copy: '{staff} copies a page of the Muqaddimah for a student of the court and leaves a finger''s width between the lines, for the notes the student will want to make.'
      zh:
        name: '城门开了多久'
        place: "开罗"
        figure: "伊本·赫勒敦"
        story: '伊本·赫勒敦 1382 年应苏丹巴尔库克之邀来到开罗，1384 年任马立克派首席法官，同年妻女在亚历山大港外沉船遇难。1401 年初，他在大马士革城外见到帖木儿。1406 年 3 月 17 日他在开罗去世，葬在胜利门外。他在《历史绪论》中提出，史家要用所写社会中可能发生的事情检验传闻。'
        relic: '一页核对过的记录'
        relic_desc: '一页队伍经过的记录，页边写着看的人当时站在哪里。'
        points:
          p1: '先让法庭的书吏认下，再替他们誊清当天的判词'
          p2: '有人报来一群人数时，问他站在哪里、城门开了多久'
          p3: '出殡那天，跟着灵床走到胜利门外'
        vignettes:
          gate: '{staff}问一位编出来的书吏，人群过城门时门开了多久。书吏把时辰写在总数旁的页边，又把总数改成了估算。'
          two: '另一位编出来的见证人站在街对面。{staff}给她另腾一页纸，她说的那段街景就不必挤在书吏那张纸的边上了。'
          copy: '{staff}替法庭里一个学生抄了一页《历史绪论》，行与行之间留出一指宽，给学生以后写批注。'
text:
  en:
    name: Ibn Khaldun
    text: Arab historian and statesman, 1332 to 1406, born in Tunis. His Muqaddima analyses the rise and fall of dynasties and the role of group solidarity, and is seen as an early work of social science. He died in Cairo.
  zh:
    name: 伊本·赫勒敦
    text: 阿拉伯历史学家与政治家，1332 年生，1406 年去世，生于突尼斯。他的《历史绪论》分析王朝的兴衰和群体凝聚力的作用，被视为社会科学的早期著作。他在开罗去世。
hook: {en: 'A large number sounds right. Can it fit?', zh: '数字听着可信，可城门容得下吗？'}
