        - {id: p2, kind: endure, day: 110, req: {"any":[{"job":["sailor","navigator","ferry_pilot","ferryman","fisher","fisherman"],"stat":{"constitution":5,"will":5}},{"trait":["bold","hardy"],"stat":{"constitution":9,"will":5}}]}}
