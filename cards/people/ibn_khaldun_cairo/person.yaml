quotes:
  ibn_khaldun_cairo_story_echo_full:
    order: 1
    tier: full
    date: '1377'
    checked: official_record
    sources: [ibn_khaldun_cairo_story_echo_source_full]
    original: ar
    text:
      en:
        who: 'Ibn Khaldun'
        quote: 'many sources, varied knowledge, good judgment and care in verification'
        occasion: 'The Muqaddimah describes what an inquiry into the past requires. The date is its approximate initial composition year.'
      zh:
        who: '伊本·赫勒敦'
        quote: '多种来源、广博知识、审慎思考和核实。'
        occasion: '《历史绪论》谈研究往事需要什么。所标为约略初稿年份。'
      ar:
        who: 'Ibn Khaldun'
        quote: 'مآخذ متعدّدة ومعارف متنوّعة وحسن نظر وتثبّت'
        occasion: 'The Muqaddimah describes what an inquiry into the past requires. The date is its approximate initial composition year.'
      fr:
        who: 'Ibn Khaldoun'
        quote: 'nombreuses sources, connaissances variées, bon jugement et soin dans la vérification'
        occasion: 'La Muqaddimah décrit ce qu''exige une enquête sur le passé. La date correspond à son année de composition initiale approximative.'
      es:
        who: 'Ibn Jaldún'
        quote: 'Muchas fuentes, conocimientos variados, buen juicio y cuidado en la verificación.'
        occasion: 'La Muqaddimah describe lo que requiere una investigación del pasado. La fecha es su año aproximado de composición inicial.'
      ja:
        who: 'イブン・ハルドゥーン'
        quote: '多くの情報源、多様な知識、適切な判断力と検証における注意'
        occasion: 'ムカディマは、過去の調査に何が必要かを説明しています。日付は、おおよその最初の作成年です。'
      ko:
        who: '이븐 할둔'
        quote: '많은 출처, 다양한 지식, 올바른 판단 및 검증에 대한 주의'
        occasion: '무카디마(Muqaddimah)는 과거에 대한 탐구에 필요한 것이 무엇인지 설명합니다. 날짜는 대략적인 초기 구성 연도입니다.'
      ru:
        who: 'Ибн Хальдун'
        quote: 'множество источников, разнообразные знания, здравый смысл и тщательность при проверке'
        occasion: 'Мукаддима описывает, что требуется для исследования прошлого. Дата является приблизительным годом его первоначального создания.'
      zh-Hant:
        who: '伊本·赫勒敦'
        quote: '多種來源、廣博知識、審慎思考和核實。'
        occasion: '《歷史緒論》談研究往事需要什麼。所標為約略初稿年份。'
  ibn_khaldun_cairo_story_echo_none:
    order: 2
    tier: none
    date: '1377'
    checked: official_record
    sources: [ibn_khaldun_cairo_story_echo_source_none]
    original: ar
    text:
      en:
        who: 'Ibn Khaldun'
        quote: 'when reports rely on transmission alone'
        occasion: 'The introduction warns against relying on handed-down reports without checking them against circumstances.'
      zh:
        who: '伊本·赫勒敦'
        quote: '传闻若只靠转述。'
        occasion: '开篇提醒，要考察传闻与实情是否相合。'
      ar:
        who: 'Ibn Khaldun'
        quote: 'الأخبار إذا اعتمد فيها على مجرّد النّقل'
        occasion: 'The introduction warns against relying on handed-down reports without checking them against circumstances.'
      fr:
        who: 'Ibn Khaldoun'
        quote: 'quand les rapports reposent uniquement sur la transmission'
        occasion: 'L’introduction met en garde contre le fait de s’appuyer sur des rapports transmis sans les comparer aux circonstances.'
      es:
        who: 'Ibn Jaldún'
        quote: 'cuando los informes se basan únicamente en la transmisión'
        occasion: 'La introducción advierte contra la confianza en informes transmitidos sin compararlos con las circunstancias.'
      ja:
        who: 'イブン・ハルドゥーン'
        quote: 'レポートが送信のみに依存している場合'
        occasion: '序文では、状況を確認せずに伝承された報告書に依存することを警告している。'
      ko:
        who: '이븐 할둔'
        quote: '보고서가 전송에만 의존하는 경우'
        occasion: '서문에서는 상황을 확인하지 않고 전달된 보고서에만 의존하지 말라고 경고합니다.'
      ru:
        who: 'Ибн Хальдун'
        quote: 'когда отчеты основаны только на передаче'
        occasion: 'Введение предостерегает от того, чтобы полагаться на переданные отчеты, не сверяя их с обстоятельствами.'
      zh-Hant:
        who: '伊本·赫勒敦'
        quote: '傳聞若只靠轉述。'
        occasion: '開篇提醒，要考察傳聞與實情是否相合。'
