    text:
      en: 'The introduction describes testing historical reports for possibility in the society they concern. The scene’s year is the end-of-life setting, rather than the date of initial composition.'
      zh: '绪论讨论依据相关社会中的可能性检验历史叙述。场景采用其生命末年的年份，并非这部书初次成文的时间。'
