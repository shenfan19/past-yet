    date: '1384-07-15'
    stay: 7
    lon: 31.24
    lat: 30.04
    region: africa
    home: [north_africa]
    field: thought
    tier: 3
    channels: {G: 2, S: 2}
    refs: [ibn_khaldun_cairo_morimoto, ibn_khaldun_cairo_broadbridge, britannica_ibn_khaldun_later, ahram_ibn_khaldun, encyclopedia_ibn_khaldun, ibn_khaldun_cairo_method]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, guard: true, day: 23, req: {"any":[{"trait":["charismatic","glib","streetwise"],"stat":{"will":6}},{"trait":["cosmopolitan","scholarly"],"stat":{"wit":8,"will":5}},{"item":"golden_apple","stat":{"will":5}}]}}
        - {id: p2, kind: endure, day: 110, req: {"any":[{"job":["sailor","navigator","ferry_pilot","ferryman","fisher","fisherman"],"stat":{"constitution":5,"will":5}},{"trait":["bold","hardy"],"stat":{"constitution":9,"will":5}}]}}
