    scene:
      points:
        - {id: p1, kind: trust, day: 12, req: {"any":[{"trait":["cosmopolitan","quiet","patient"]},{"job":["archivist","teacher","student"]}]}}
        - {id: p2, kind: notice, day: 40, req: {"any":[{"trait":["curious","skeptical","methodical"]},{"stat":{"wit":6}}]}}
        - {id: p3, kind: hold, redeem: true, day: 76, req: {"any":[{"trait":["faithful","attached","vigil"]},{"stat":{"will":6}}]}}
