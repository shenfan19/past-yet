    text:
      en:
        name: 'The ship off Alexandria'
        place: "Cairo"
        figure: "Ibn Khaldun"
        story: 'Ibn Khaldun came to Cairo in 1382 at the invitation of Sultan Barquq. In 1384 the sultan asked the ruler of Tunis to let his family follow him, and on 8 August made him chief judge of the Maliki school, a high post for a newcomer from the west, and rivals in the city soon set to work to unseat him. That year the ship bringing his wife and daughters went down at Alexandria. In the Muqaddimah he asks historians to test reports against what could happen in the society they describe.'
        story_prose:
          opening:
            - 'In Cairo a clerk puts an appointment and a list of names to check on the same desk. Ibn Khaldun asks who is waiting outside. He is waiting for another letter himself, with news of the ship bringing his wife and daughters from Tunis.'
            - 'In 1384 Ibn Khaldun became a chief judge in Cairo. The ship carrying his wife and daughters was later lost at Alexandria. In this trip you can preserve the appointment and go to the port to help people on the ship reach shore.'
            - 'Use someone who can check documents with a clerk in Cairo. Send a traveller who can work with the sailors and assist people on shore to Alexandria early.'
          points:
            p1: 'The clerk says the name has to be copied again and wants to wait for another official to say whose it is. You ask him to read the appointment they already have and compare it with what the visitor says. At the line with the date, the bearer reads out Ibn Khaldun’s full name. The clerk moves the appointment from the edge of the table back into the day’s outgoing papers.'
            p2: 'Someone at the port calls that they see a person, then loses sight of them in the water. You ask the people watching to keep pointing at the same place and make room for the sailors already going out. When Ibn Khaldun’s wife and daughters reach shore, the person waiting at the door asks where the news should go first. The letter to Cairo waits until they can answer in their own voices.'
          outcomes:
            all: 'Ibn Khaldun takes up the appointment as in history. Urgent word comes from the port that his family is ashore. In this branch the man waiting in Cairo gets a different message.'
            p1: 'The appointment goes out on the day recorded. The ship is still lost at Alexandria and his family does not reach Cairo.'
            p2: 'His wife and daughters have people to help them in the port. The appointment has fallen out of sync, but the scene of their rescue can still be recorded.'
          none: 'People wait in Cairo for a document and at the port for the wind to ease. The letter saying his family is safe is never written.'
          not_admitted: 'Nobody admits the person waiting by the door to hand in the appointment. News from the ship has not reached the room.'
          desync: 'The appointment meant for Ibn Khaldun goes to someone else. The office recalls the traveller when the record falls out of sync.'
          excerpts:
            p1: 'The clerk moves the appointment from the edge of the table back into the day’s outgoing papers.'
            p2: 'The letter to Cairo waits until they can answer in their own voices.'
        relic: 'A checked report'
        relic_desc: 'A report of a procession, with the place the watcher stood written in the margin.'
        points:
          p1: 'When his rivals move to keep a newcomer out of the bench, keep his appointment as chief judge of the Maliki school on 8 August'
          p2: 'When the ship bringing his wife and daughters goes down at Alexandria, pull the people on board out of the water and save them'
        points_fail:
          p1: 'In this branch the appointment of 8 August went to someone else. This branch has come loose from history, and the office recalls the employee that day.'
          p2: 'As in history the ship goes down at Alexandria with everyone on board, and his wife and daughters do not reach Cairo.'
        shift:
          p1:
            was: '8 August 1384: Sultan Barquq appointed Ibn Khaldun chief judge of the Maliki school in Cairo; rivals in the city worked against him, and he lost the post the next year.'
          p2:
            was: '1384: the ship bringing Ibn Khaldun''s wife and daughters from Tunis went down at Alexandria, and no one on board survived.'
            now: 'The people on the ship were pulled from the water at Alexandria. His wife and daughters came on to Cairo, and the family lived together again.'
            who: ibn_khaldun_cairo
            bio: 'In this timeline the ship that went down at Alexandria in 1384 did not take his family with it: his wife and daughters were saved and joined him in Cairo.'
        vignettes:
          gate: '{staff} asks a clerk, made up for the game, how long the gate stood open while the crowd went through. He writes the minutes in the margin beside the total, and then changes the total to an estimate.'
          two: '{staff} gives a second watcher, made up for the game, a sheet of her own, so that her account of the street does not end up squeezed into the margin of his.'
          copy: '{staff} copies a page of the Muqaddimah for a student of the court and leaves a finger''s width between the lines, for the notes the student will want to make.'
      zh:
        name: '亚历山大港的那条船'
        place: "开罗"
        figure: "伊本·赫勒敦"
        story: '伊本·赫勒敦 1382 年应苏丹巴尔库克之邀来到开罗。1384 年，苏丹请突尼斯的君主放他的家人来埃及，8 月 8 日又任命他为马立克派首席法官。从西边来的外人坐上这个高位，城里的对手很快就开始设法把他拉下来。同年，载着他妻女的船在亚历山大港沉没。他在《历史绪论》中提出，史家要用所写社会中可能发生的事情检验传闻。'
        story_prose:
          opening:
            - '开罗的书记把一张任命稿和一份要复核的名字放在同一案上。伊本·赫勒敦问哪个人在外面等。他还在等另一封信，想知道妻女从突尼斯来埃及的船到哪儿了。'
            - '1384 年，伊本·赫勒敦在开罗获任首席法官。后来载他妻女的船在亚历山大港遇难。这趟可以保住任命经过，之后到港帮船上的人获救。'
            - '让擅长与书记办交接的人候在开罗。能同水手配合或在港口照应落水者的人，再尽早去亚历山大。'
          points:
            p1: '书记说要重抄名字，等另一位经办人来才知道写谁。你请他先把已经收到的任命和来人的说法逐条核一遍。核到日期一行时，负责交文书的人念了伊本·赫勒敦的全名。书记把原来搁在案边的任命放回当天要发出的那摞。'
            p2: '港边有人喊看见了人，又在浪盖过来时丢了位置。你请岸边的人继续指向同一处，让出位置给已经出船帮忙的水手。等伊本·赫勒敦的妻女被接到岸边，守在屋口的人才问先送哪边的消息。给开罗写信的人等到她们亲自答话，才落了笔。'
          outcomes:
            all: '伊本·赫勒敦按史实就任。来自港口的急信写的是家人已被接上岸，这一趟的开罗学者会等到另一份消息。'
            p1: '任命照原日发出。船仍在亚历山大遇难，他的家人没能来到开罗。'
            p2: '妻女在港边有人照料，能把消息带给开罗。任命脱节，回程记录只留下这段救助。'
          none: '开罗的人等文书，港上的人等风停。那封报平安的信没有写出来。'
          not_admitted: '等在外头的人没获准递交任命稿，船讯也还没有传进这间屋。'
          desync: '本该发给伊本·赫勒敦的任命改了收件人。任命失去同步，事务所召回员工。'
          excerpts:
            p1: '书记把原来搁在案边的任命放回当天要发出的那摞。'
            p2: '给开罗写信的人等到她们亲自答话，才落了笔。'
        relic: '一页核对过的记录'
        relic_desc: '一页队伍经过的记录，页边写着看的人当时站在哪里。'
        points:
          p1: '对手要把外来的人挡在法官席外时，护住他 8 月 8 日出任马立克派首席法官'
          p2: '载着他妻女的船在亚历山大港沉没时，把船上的人从水里拉上来，救下她们'
        points_fail:
          p1: '这条分支里，8 月 8 日的任命落到了别人头上，与历史脱了节，事务所当天召回员工。'
          p2: '那条船照史实在亚历山大港沉没，船上的人无一生还，他的妻女没能到开罗。'
        shift:
          p1:
            was: '1384 年 8 月 8 日，苏丹巴尔库克任命伊本·赫勒敦为开罗马立克派首席法官；城里的对手处处与他为难，第二年他就丢了这个职位。'
          p2:
            was: '1384 年，载着伊本·赫勒敦妻女从突尼斯来埃及的船在亚历山大港沉没，船上的人无一生还。'
            now: '船上的人在亚历山大港被救了上来。他的妻女随后到了开罗，一家人又住在了一起。'
            who: ibn_khaldun_cairo
            bio: '这条时间线里，1384 年在亚历山大港沉没的那条船没有带走他的家人，妻女获救，到开罗与他团聚。'
        vignettes:
          gate: '{staff}问一位编出来的书吏，人群过城门时门开了多久。书吏把时辰写在总数旁的页边，又把总数改成了估算。'
          two: '另一位编出来的见证人站在街对面。{staff}给她另腾一页纸，她说的那段街景就不必挤在书吏那张纸的边上了。'
          copy: '{staff}替法庭里一个学生抄了一页《历史绪论》，行与行之间留出一指宽，给学生以后写批注。'
text:
  en:
    name: Ibn Khaldun
    text: Arab historian and statesman, 1332 to 1406, born in Tunis. His Muqaddima analyses the rise and fall of dynasties and the role of group solidarity, and is seen as an early work of social science. He died in Cairo.
  zh:
    name: 伊本·赫勒敦
    text: 阿拉伯历史学家与政治家，1332 年生，1406 年去世，生于突尼斯。他的《历史绪论》分析王朝的兴衰和群体凝聚力的作用，被视为社会科学的早期著作。他在开罗去世。
hook: {en: 'A new judge, a ship on its way.', zh: '新任的法官，海上的一条船。'}
