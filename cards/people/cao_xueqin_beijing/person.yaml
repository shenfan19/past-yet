quotes:
  cao_xueqin_beijing_story_echo_full:
    order: 1
    tier: full
    date: '1791'
    checked: official_record
    sources: [cao_xueqin_beijing_story_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Cao Xueqin, The Story of the Stone'
        quote: 'And all that vast white ground was swept clean.'
        occasion: 'The last line of the closing song in chapter five, as printed in the 1791 Cheng edition.'
      zh:
        who: '曹雪芹《石头记》'
        quote: '落了片白茫茫大地真干净'
        occasion: '第五回收尾曲《飞鸟各投林》末句，照程甲本。'
      zh-Hant:
        who: '曹雪芹《石头记》'
        quote: '落了片白茫茫大地真乾淨'
        occasion: '第五回收尾曲《飞鸟各投林》末句，照程甲本。'
      fr:
        who: 'Cao Xueqin, L''histoire de la pierre'
        quote: 'Et tout ce vaste sol blanc a été balayé.'
        occasion: 'La dernière ligne de la chanson finale du chapitre cinq, telle qu''imprimée dans l''édition Cheng de 1791.'
      es:
        who: 'Cao Xueqin, La historia de la piedra'
        quote: 'Y todo ese vasto terreno blanco quedó limpio.'
        occasion: 'La última línea de la canción de cierre del capítulo cinco, impresa en la edición Cheng de 1791.'
      ja:
        who: '曹雪琴『石の物語』'
        quote: 'そして、その広大な白い土地はすべてきれいに掃除されました。'
        occasion: '1791 年のチェン版に印刷された、第 5 章の終わりの歌の最後の行。'
      ko:
        who: '조설근, 돌의 이야기'
        quote: '그리고 그 광활한 하얀 땅은 모두 깨끗이 쓸려갔습니다.'
        occasion: '1791년 쳉판에 인쇄된 5장 폐막 노래의 마지막 줄.'
      ru:
        who: 'Цао Сюэцинь, «История камня»'
        quote: 'И вся эта огромная белая земля была выметена начисто.'
        occasion: 'Последняя строка заключительной песни пятой главы, напечатанная в издании Чэна 1791 года.'
  cao_xueqin_beijing_story_echo_none:
    order: 2
    tier: none
    date: '1774'
    checked: official_record
    sources: [cao_xueqin_beijing_story_echo_source_none]
    original: zh-Hant
    contextual: true
    text:
      en:
        who: 'A Jiaxu manuscript annotator'
        quote: 'The book was unfinished when Qin died, his tears spent.'
        occasion: 'A later marginal note in the Jiaxu manuscript. The date it gives for Cao’s death is disputed.'
      zh:
        who: '甲戌本批者'
        quote: '书未成，芹为泪尽而逝。'
        occasion: '甲戌本第一回后加眉批。批语所记卒年仍有争议。'
      zh-Hant:
        who: '甲戌本批者'
        quote: '書未成，芹爲泪盡而逝。'
        occasion: '甲戌本第一回后加眉批。批语所记卒年仍有争议。'
      fr:
        who: 'Un annotateur de manuscrit Jiaxu'
        quote: 'Le livre était inachevé lorsque Qin mourut, ses larmes épuisées.'
        occasion: 'Une note marginale ultérieure dans le manuscrit Jiaxu. La date donnée pour la mort de Cao est contestée.'
      es:
        who: 'Un anotador del manuscrito Jiaxu'
        quote: 'El libro estaba inacabado cuando Qin murió y se le acabaron las lágrimas.'
        occasion: 'Una nota marginal posterior en el manuscrito Jiaxu. La fecha que da para la muerte de Cao es controvertida.'
      ja:
        who: 'Jiaxu 写本注釈者'
        quote: '秦が涙を流しながら亡くなったとき、この本は未完成だった。'
        occasion: '嘉苡写本の後の欄外注。曹操の死亡日については議論がある。'
      ko:
        who: 'Jiaxu 원고 주석가'
        quote: '이 책은 진이 죽었을 때 완성되지 않았으며 그의 눈물은 다 흘렀습니다.'
        occasion: 'Jiaxu 사본의 이후 여백 메모. 조조의 죽음에 대한 날짜는 논쟁의 여지가 있습니다.'
      ru:
        who: 'Аннотатор рукописей Цзясюй'
        quote: 'Книга так и не была закончена, когда Цинь умер, его слезы иссякли.'
        occasion: 'Более поздняя заметка на полях рукописи Цзясюй. Дата смерти Цао является спорной.'
