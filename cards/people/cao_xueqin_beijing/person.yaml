        place: "Western Hills, Beijing"
        figure: "Cao Xueqin"
        story: "Living in poverty on the western edge of Beijing, Cao Xueqin spends years revising Dream of the Red Chamber. He dies leaving it unfinished, and friends copy it out by hand."
        relic: "A hand copied chapter"
        relic_desc: "A chapter copied by friends, with comments in red ink in the margin."
        points:
          p1: "Keep track of the many families in the story"
          p2: "Share a meal in the cold hills"
          p3: "Be a reader he trusts to the last page he wrote"
      zh:
        name: "停在八十回的小说"
        place: "北京西山"
        figure: "曹雪芹"
        story: "曹雪芹在北京西郊过着贫困的日子，花了多年反复修改《红楼梦》。他去世时书还没有写完，朋友们把它一份份抄了下来。"
        relic: "一份手抄的章回"
        relic_desc: "朋友抄下的一回，页边有红笔写的批语。"
        points:
          p1: "理清故事里那么多家人"
          p2: "在寒冷的山里和他分食一餐"
          p3: "做他信得过的读者，读到他写下的最后一页"
text:
  en:
    name: Cao Xueqin
    text: Chinese novelist of the Qing, about 1715 to about 1763. He wrote Dream of the Red Chamber, a novel about the rise and fall of a great family, and left it unfinished in his last years in the Western Hills near Beijing.
  zh:
    name: 曹雪芹
    text: 清代小说家，约 1715 年生，约 1763 年去世。他写下《红楼梦》，讲一个大家族的盛衰，晚年住在北京西山，书稿未能写完。
