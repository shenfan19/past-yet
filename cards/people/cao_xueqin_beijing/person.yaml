    text:
      en:
        name: The blank after the last chapter
        place: Western Hills, Beijing
        figure: Cao Xueqin
        story: An early manuscript of The Story of the Stone attests that annotated copies circulated during Cao Xueqin's lifetime. One later marginal note in that manuscript associates Cao's death with a book left unfinished. The scenario is set in his last winter without fixing the exact date of his death or the number of chapters he wrote.
        story_prose:
          opening:
            - 'It gets dark early in the Western Hills. A copyist comes in with a parcel of pages and asks what he can take with him. He sets the parcel on the little table by the bed. A blank sheet lies on top.'
            - 'Annotated copies of The Story of the Stone were already circulating in Cao Xueqin’s lifetime. A later note in the Jiaxu manuscript remembers him dying before the book was finished. In this imagined winter visit, there is still time for him to sort through the stack himself.'
            - 'The copyist wants to start home before dark. Someone who knows manuscripts can pick the annotated copy out of the working pages. Someone accustomed to caring for others can see to the fire and the lamp. Then there will be room on the table to spread out the draft.'
          points:
            p1: 'The copyist is about to tie up a stack with the loose pages by the bed. You spot a line in another hand in the margin and ask him to read it. He wraps the annotated copy separately and puts the pages Cao is still revising back within reach. Each parcel has a string of its own.'
            p2: 'As the coals die down, Cao closes the page he has just turned to. You ask the person bringing coal to tend the fire, set the lamp nearer, and pass Cao just the page he was reading. He reaches out from under the cover and picks up the line again. That evening the lamp stays within reach.'
            p3: 'You tell Cao about a later continuation in which the family flourishes again. He frowns, turns to the end of the song about birds scattering in chapter five, and points to the words about a world swept bare. You open the annotated copy and ask whether later readers are right to see mourning for the fallen Ming in the book. Cao laughs aloud and says nothing. When he picks up his brush again, he marks only the pages he has settled. The copyist follows the marks and leaves the rest blank.'
          outcomes:
            all: 'The copyist leaves with two sheets. Read together, they show which chapters Cao had put in order and which choices he was still considering. Nobody writes down what he meant by the laugh.'
            p1: 'The copyist leaves with the early annotated copy. The draft Cao still wants to read stays by the bed.'
            p2: 'The lamp burns a little longer by the bed. Cao finishes the page he set aside.'
            p3: 'The marked parts are copied and the undecided spaces stay blank. The copyist leaves his own guesses out.'
          none: 'The pages are stacked as they were when they came in. Later, when someone asks about the last chapters, the blank sheet gives no answer.'
          not_admitted: 'The copyist goes inside. You wait until there is only one lamp left in the courtyard, without getting the papers to the bedside table.'
          desync: 'The annotated copy goes back with the working pages. The copyist leaves without it, and the office recalls you.'
          excerpts:
            p1: 'Each parcel has a string of its own.'
            p2: 'That evening the lamp stays within reach.'
            p3: 'The copyist follows the marks and leaves the rest blank.'
        relic: A loose sheet of chapter plans
        relic_desc: A game keepsake with a proposed order for several chapters and blank space for what Cao had yet to decide.
        points:
          p1: Keep the early annotated copy in the copyist's hands while Cao's working pages are returned to him
          p2: See to the fire and the copying so Cao can spend one good evening thinking through the ending
          p3: While Cao still has strength to review it, leave a separate copy of the chapter plan he agrees to pass on
        points_fail:
          p1: The only copy at this table goes back into the pile of working pages. In this branch the reader leaves without the annotated text.
          p2: The room grows cold before the papers are ready. The work waits for another evening.
          p3: The copyist can arrange the loose pages, but has no record of which ending Cao meant to leave.
        shift:
          p1:
            was: The Jiaxu manuscript preserves notes on an early text that was being copied during Cao Xueqin's lifetime.
          p2:
            was: A marginal note in the Jiaxu manuscript remembers Cao's death and says the book was left unfinished.
            now: In this branch someone tends the fire and brings the pages one at a time. Cao gets one evening to work out where he wants the story to go.
          p3:
            was: The Jiaxu marginal note calls the book unfinished and gives no final chapter plan approved by Cao.
            now: The copyist takes away two sheets. One gives the order Cao has approved in this branch. The other lists the fates he has yet to decide. In the next copying the two sheets stay together.
            who: cao_xueqin_beijing
            bio: Before his death, Cao reviews a chapter plan with a copyist. In this branch later readers can see which decisions he made and where he left the ending open.
        vignettes:
          ink: The copyist sets a slip between the proposed chapter order and a reader's pencilled guess. The pages can now be put back in the right places.
          paper: '{staff} carries in the lamp. The copyist lifts the manuscript away from the edge of the table to make room.'
          empty: The last sheet has room for another heading. The copyist leaves the space as it is.
      zh:
        name: 末回后面的一张白纸
        place: 北京西山
        figure: 曹雪芹
        story: 《石头记》甲戌本留下曹雪芹生前已有带批语抄本流传的线索。卷首一条后加眉批回忆曹雪芹去世时书尚未成。故事设在他晚年的冬天，现存资料不足以确定他的卒日或最后写成了多少回。
        story_prose:
          opening:
            - '西山的天暗得早。抄书人抱着一包稿子进屋，先问哪几页能带走。他把包袱搁在床边的小桌上，最上头压着一张白纸。'
            - '《石头记》早在曹雪芹生前就已有带批语的抄本。甲戌本后来添的一条眉批记得他去世时书还没写成。这个冬夜是故事里的机会，桌上那叠纸等着他亲手分一分。'
            - '抄书人要趁天黑前回去。懂稿子的人可以先把来借的批本从改稿里找出来，会照料人的便看看火和灯。等桌面腾出来，才有地方摊开草稿。'
          points:
            p1: '抄书人摸到夹在改稿里的一叠，正要和床边的纸一块儿扎起来。你看见页边有别人写的小字，请他再读一行。他把批本另包了一层，曹雪芹还要改的几张则留在手边。两包纸各系一道绳。'
            p2: '炭快熄时，曹雪芹把刚翻到的一页合上了。你请来送炭的人把火续上，再把灯挪近，只递他刚才没看完的那一张。他把手伸出被角，又从那行接着看下去。那一晚，灯在他够得着的地方。'
            p3: '你说后来有人续写，写到「兰桂齐芳」。曹雪芹皱了皱眉，翻回第五回《飞鸟各投林》的末句，指着那片白茫茫。你又翻开脂批本，问后世说这书在悼念故明，可是这个意思？曹雪芹大笑，一句话也没说。等他再拿起笔，只在已经想定的几张上点了记号。抄书人照他点的地方抄，余处仍空着。'
          outcomes:
            all: '抄书人出门时夹着两页。哪几回已经排定，哪几处作者还想再看看，两张纸一对就明白。至于那一声笑，谁也没有替他写下解释。'
            p1: '早期批本让抄书人带走，床边还放着等曹雪芹再看的稿子。'
            p2: '床边的灯又多亮了一阵，曹雪芹看完了方才搁下的那页。'
            p3: '有记号的地方抄下，尚未想定的地方留白。抄书人没有把自己的猜想添进正文。'
          none: '纸还是按来时的样子叠着。后来有人问起最后几回，那张白纸上没有留下答案。'
          not_admitted: '抄书人进门去了。你等到院里的灯只剩一盏，也没能把那叠纸拿到桌边。'
          desync: '批本混进退还的改稿，抄书人没能把它带走。桌前那段工夫已错过，事务所把你召回。'
          excerpts:
            p1: '两包纸各系一道绳。'
            p2: '那一晚，灯在他够得着的地方。'
            p3: '抄书人照他点的地方抄，余处仍空着。'
        relic: 两页章回安排
        relic_desc: 游戏纪念物。一页列着拟好的章回次序，另一页留下作者还未决定的地方。
        points:
          p1: 让抄书人留下早期批本，再把等着曹雪芹改的稿页交还给他
          p2: 替他添火、备好稿页，让曹雪芹有一晚能专心想结尾
          p3: 趁他还有力气核看，照他认可的次序抄出一份收束提纲，托人带走
        points_fail:
          p1: 桌上那份批本混进要退回的改稿里，这条支线里的读者空着手离开。
          p2: 稿纸还没理齐，炭火已经要熄了。只能改天接着写。
          p3: 抄书人能理出散页，却不知道哪些结局曹雪芹已经想定。
        shift:
          p1:
            was: 甲戌本留下了曹雪芹生前已有早期批本传抄的记录。
          p2:
            was: 甲戌本有一条眉批，回忆曹雪芹去世时书还没有写完。
            now: 这条支线里，有人看着炭火，一次递一张稿页。曹雪芹多得了一个晚上，能想清楚故事接下来往哪里走。
          p3:
            was: 甲戌眉批记书未成，没留下曹雪芹亲自核过的收束提纲。
            now: 抄书人带走两张纸。一张是曹雪芹在这条支线里点定的次序，一张是他还没拿定的几个人的下场。后来转抄的人把两张纸一直夹在一起。
            who: cao_xueqin_beijing
            bio: 曹雪芹生前和抄书人核过一份收束提纲。这条支线的读者看得见哪些结局是他定下的，哪些他仍留着空白。
        vignettes:
          ink: 抄书人夹进一张纸签，把拟好的章节次序同读者的猜测隔开。纸页散了也知道各该放回哪一处。
          paper: '{staff}把灯端进来。抄书人把稿子从桌沿往里收了收，让出一小块地方。'
          empty: 末页还能写一个回目。抄书人看了看，照原样空着。
text:
  en:
    name: Cao Xueqin
    text: Qing novelist associated with Dream of the Red Chamber, also circulated under the title The Story of the Stone. Annotated manuscript copies and later printed editions preserve different states of the novel. A marginal note in the Jiaxu manuscript links his death with the unfinished book.
  zh:
    name: 曹雪芹
    text: 清代小说家，《红楼梦》早期以《石头记》等题名抄传。脂评抄本与后来的刊本呈现不同的文本面貌。甲戌本上的一条眉批回忆他去世时书尚未成。
hook: {en: 'Will he have one more evening to decide?', zh: '他还能想一晚自己的结尾吗'}
facts:
  early_copy:
    date: '1754'
    checked: official_record
    level: careful
    use: [history, story, wiki]
    sources: [cao_xueqin_beijing_primary, cao_xueqin_beijing_hu]
    text: {en: 'The Jiaxu collation is evidence that an early annotated form of The Story of the Stone circulated during Cao Xueqin’s lifetime.', zh: '甲戌抄阅重评的题记，是《石头记》早期批本在曹雪芹生前已有传抄的证据。'}
    line:
      en: 'The Jiaxu collation records an early annotated text of The Story of the Stone.'
      zh: '甲戌抄阅重评的题记留下了早期批本传抄的线索。'
      fr: 'La collation Jiaxu enregistre un premier texte annoté de L''histoire de la pierre.'
      es: 'La recopilación de Jiaxu registra uno de los primeros textos comentados de La historia de la piedra.'
      ja: 'Jiaxu の照合には、『石の物語』の初期の注釈付きテキストが記録されています。'
      ko: 'Jiaxu 대조는 The Story of the Stone의 초기 주석 텍스트를 기록합니다.'
      ru: 'В сборнике Цзясюй записан ранний аннотированный текст «Истории камня».'
      zh-Hant: '甲戌抄閱重評的題記留下了早期批本傳抄的線索。'
  unfinished:
    date: '1763'
    checked: official_record
    level: careful
    use: [history, story, wiki]
    sources: [cao_xueqin_beijing_primary]
    note: 'This dates the setting. The marginal note gives a cyclical date and its chronology is disputed.'
    text: {en: 'A marginal note in the Jiaxu manuscript recalls that the book was unfinished when Cao died.', zh: '甲戌本一条眉批回忆曹雪芹去世时书尚未成。游戏以此设定场景，卒年仍有争议。'}
    line:
      en: 'A later marginal note remembers Cao dying before the book was finished. Its chronology is disputed.'
      zh: '后来添的一条眉批回忆，曹雪芹去世时书尚未成。眉批所记卒年仍有争议。'
      fr: 'Une note marginale ultérieure rappelle la mort de Cao avant la fin du livre. Sa chronologie est contestée.'
      es: 'Una nota marginal posterior recuerda la muerte de Cao antes de que se terminara el libro. Su cronología está en disputa.'
      ja: '後の欄外メモには、曹操がこの本が完成する前に亡くなったことが記されている。その年代については議論がある。'
      ko: '나중에 여백 메모는 책이 끝나기 전에 Cao가 죽어가는 것을 기억합니다. 그 연대기는 논쟁의 여지가 있습니다.'
      ru: 'В более поздней заметке на полях упоминается, что Цао умер до того, как книга была закончена. Его хронология оспаривается.'
      zh-Hant: '後來添的一條眉批迴憶，曹雪芹去世時書尚未成。眉批所記卒年仍有爭議。'
bystanders:
  copyist:
    invented: true
    text: {en: 'A fictional copyist who comes for the pages Cao can let go of.', zh: '虚构的一位抄书人，来取曹雪芹愿意交出去的稿页。'}
  coal_carrier:
    invented: true
    text: {en: 'A fictional visitor who brings coal and can tend the fire while Cao reads.', zh: '虚构的一位送炭人，在曹雪芹看稿时帮忙添火。'}
