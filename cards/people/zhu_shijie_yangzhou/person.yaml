    text:
      en:
        name: 'The four sides of the counting board'
        place: "Yangzhou"
        figure: "Zhu Shijie"
        story: 'In the preface to Zhu Shijie’s Jade Mirror of the Four Unknowns, Mo Ruo describes the arrangement of the four unknowns around the centre: heaven below, earth left, human right and thing above. The preface is dated 1303.'
        relic: "A set of counting rods"
        relic_desc: "Slender rods laid in rows to stand for numbers."
        points:
          p1: 'Read the four positions before adding a new row'
          p2: 'Show another learner which two groups were swapped'
          p3: 'Keep the orientation marks on the copy until the board is cleared'
        vignettes:
          rotate: 'Two learners have copied the same board from opposite sides. You mark the bottom before comparing their sheets. The earth and human groups exchange places on one copy. You keep the corrected diagram. The long elimination is still ahead of them.'
          hand: 'You ask why the learner has put all four names in one line. He says he can remember the names that way. You keep his line but place four markers around a centre so he can also recover the layout. By the time he clears the board, you have seen how to begin, and not how his exercise ends.'
          outline: 'Before the counters go back into their box, you draw four short lines around the centre and note which end is the bottom. You can reproduce the arrangement when you get home. You leave the larger calculation on the learner’s board.'
      zh:
        name: '算板四方各有一元'
        place: "扬州"
        figure: "朱世杰"
        story: '莫若在朱世杰《四元玉鉴》前序里说明四元怎样围着中央摆放：天元在下，地元在左，人元在右，物元在上。序作于 1303 年。'
        relic: "一套算筹"
        relic_desc: "一根根细棍，排成行来代表数。"
        points:
          p1: '添算式前先认清四元的位置'
          p2: '让另一位学算人看出哪两组放反了'
          p3: '收筹前把方向标记抄到副本上'
        vignettes:
          rotate: '两位学算人从算板两侧各抄了一份。你先标出从哪边算作下，再把两张摆在一起。有一张把地元和人元挪回正确位置。你抄走订正的图，还没轮到做那串长长的消元。'
          hand: '你问学算人为什么四个名都写在一排。他说这样背得住。你让原来那行留着，另绕中央摆四个记号，好叫他也记得位置。等他收筹，你只看见了起手，还没看到题怎样算完。'
          outline: '筹入盒前，你绕着中央画了四条短线，再记哪一端是下。回来时你还摆得出这个布局。大题留在学算人的板上。'
text:
  en:
    name: Zhu Shijie
    text: Chinese mathematician of the Yuan, active around 1300. His Jade Mirror of the Four Unknowns of 1303 solves systems of polynomial equations with up to four unknowns by a method like the modern treatment of matrices.
  zh:
    name: 朱世杰
    text: 元代数学家，活跃于 1300 年前后。他 1303 年的《四元玉鉴》用类似现代矩阵的方法解最多含四个未知数的多项式方程组。
hook: {en: 'Where do you put the fourth unknown?', zh: '第四个未知数摆在哪里？'}
