    text:
      en:
        name: 'The four sides of the counting board'
        place: "Yangzhou"
        figure: "Zhu Shijie"
        story: 'In the preface to Zhu Shijie’s Jade Mirror of the Four Unknowns, Mo Ruo describes the arrangement of the four unknowns around the centre: heaven below, earth left, human right and thing above. The preface is dated 1303.'
        relic: "A set of counting rods"
        relic_desc: "Slender rods laid in rows to stand for numbers."
        points:
          p1: 'At Yangzhou, keep a board diagram with the preface by Mo Ruo and the book’s groups of problems'
          p2: 'Let a student lay out an example and label on the same sketch the two positions most easily reversed'
          p3: 'Leave a checked set of examples with the students. Mark the line to consult when changing the main unknown and retain the diagram captions'
        points_fail:
          p1: 'The preface circulates on its own. The next copy loses the description of the four positions, and the office recalls the employee.'
          p2: 'A copy preserves only the words. Using a different viewpoint, students reverse left and right.'
          p3: 'Students take away only the final lines. In a different problem they cannot work from the original positions.'
        shift:
          p1:
            was: 'The Jade Mirror of the Four Unknowns has a 1303 preface by Mo Ruo. Another preface records that Zhu visited Guangling and attracted students.'
          p2:
            was: 'Mo Ruo’s preface states where the four unknowns go around the center.'
            now: 'The copy identifies where to stand when reading the board. A student can check the sketch after reversing two positions.'
          p3:
            was: 'Surviving copies have prefaces, grouped problems and calculations, and come from different periods.'
            now: 'A student can borrow a copy with both sketch and page references. Recopied exercises can still be matched to their board examples.'
            who: zhu_shijie_yangzhou
            bio: 'Zhu grouped problems involving several unknowns. The preface’s placement of each unknown helps readers follow the calculations.'
        vignettes:
          rotate: 'Two learners have copied the same board from opposite sides. You mark the bottom before comparing their sheets. The earth and human groups exchange places on one copy. You keep the corrected diagram. The long elimination is still ahead of them.'
          hand: 'You ask why the learner has put all four names in one line. He says he can remember the names that way. You keep his line but place four markers around a centre so he can also recover the layout. By the time he clears the board, you have seen how to begin, and not how his exercise ends.'
          outline: 'Before the counters go back into their box, you draw four short lines around the centre and note which end is the bottom. You can reproduce the arrangement when you get home. You leave the larger calculation on the learner’s board.'
      zh:
        name: '算板四方各有一元'
        place: "扬州"
        figure: "朱世杰"
        story: '莫若在朱世杰《四元玉鉴》前序里说明四元怎样围着中央摆放：天元在下，地元在左，人元在右，物元在上。序作于 1303 年。'
        relic: "一套算筹"
        relic_desc: "一根根细棍，排成行来代表数。"
        points:
          p1: '在扬州手边备好四元算板的对照，把莫若的序同正文题类收成一套'
          p2: '请从学者试摆一题，把最容易左右颠倒的两栏标回同一张简图'
          p3: '请朱世杰在扬州留给同学一册对照算板的例题，标清换元时需要回到哪一行，给后续互抄留下图题'
        points_fail:
          p1: '前序独自传出，后来抄手脱去四方所指的说明，事务所召回员工。'
          p2: '只抄下几个字，学者以自己的位置看图，算板左右对不上。'
          p3: '各人只把例题的尾几行抄走，换一题便不知道怎样从原来的方位起算。'
        shift:
          p1:
            was: '《四元玉鉴》有大德癸卯（1303）莫若序。另一篇序记朱世杰曾游广陵，有学者聚而从学。'
          p2:
            was: '莫若的序明确给了四元在中央四周的布置。'
            now: '学者在抄图旁注明看板的方向。误把左右交换时可以从简图查出。'
          p3:
            was: '传世书有前序、分类题目与演算内容，传本跨越多个时期。'
            now: '同学能借出一册带简图与互见页码的抄本，续抄时仍能把题和原来的算板例子配在一起。'
            who: zhu_shijie_yangzhou
            bio: '朱世杰的书把多元问题按类别安排。序文说明了记算位置，为读者保留了理解演算的一条线索。'
        vignettes:
          rotate: '两位学算人从算板两侧各抄了一份。你先标出从哪边算作下，再把两张摆在一起。有一张把地元和人元挪回正确位置。你抄走订正的图，还没轮到做那串长长的消元。'
          hand: '你问学算人为什么四个名都写在一排。他说这样背得住。你让原来那行留着，另绕中央摆四个记号，好叫他也记得位置。等他收筹，你只看见了起手，还没看到题怎样算完。'
          outline: '筹入盒前，你绕着中央画了四条短线，再记哪一端是下。回来时你还摆得出这个布局。大题留在学算人的板上。'
text:
  en:
    name: Zhu Shijie
    text: Chinese mathematician of the Yuan, active around 1300. His Jade Mirror of the Four Unknowns of 1303 solves systems of polynomial equations with up to four unknowns by a method like the modern treatment of matrices.
  zh:
    name: 朱世杰
    text: 元代数学家，活跃于 1300 年前后。他 1303 年的《四元玉鉴》用类似现代矩阵的方法解最多含四个未知数的多项式方程组。
hook: {en: 'Where do you put the fourth unknown?', zh: '第四个未知数摆在哪里？'}
