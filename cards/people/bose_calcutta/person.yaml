    text:
      en:
        name: 'Turn the book a quarter turn'
        place: Calcutta
        figure: Jagadish Chandra Bose
        story: 'In a paper read on 28 January 1897, Jagadis Chunder Bose reports that a bound book placed in a beam of electric rays transmitted the radiation much more readily after a quarter turn.'
        relic: A crescograph part
        relic_desc: A lever that magnified a plant's growth ten thousand times.
        points:
          p1: 'Read the detector before changing the book’s orientation'
          p2: 'Persuade the mechanic to try the first orientation again'
          p3: 'Mark the starting orientation on the apparatus sketch'
        vignettes:
          return: 'The mechanic turns the book and the response drops. You ask him to turn it back instead of packing away the apparatus. The response returns on this run. Now both changes go in the record. There is no time to try a second material.'
          mark: 'The mechanic says he can remember which way the pages faced. You make one orientation mark on the drawing and one corresponding mark on the holder. He can return to the starting angle without guessing. The next comparison belongs to his shift.'
          reading: 'You copy the reading beside a sketch of the book before touching anything. After the turn, you put the second reading on a fresh line. You bring home the pair. From two readings alone, the question of drift stays open.'
      zh:
        name: '把书转回原来的方向'
        place: 加尔各答
        figure: 贾格迪什·钱德拉·博斯
        story: '博斯在 1897 年 1 月 28 日宣读的论文中记载，把一本装订好的书置于电波束中，转过四分之一圈，电波便更容易通过。'
        relic: 一个植物生长记录仪的部件
        relic_desc: 一根把植物的生长放大一万倍的杠杆。
        points:
          p1: '转动书本前先读一次检波结果'
          p2: '请工场帮工转回第一个方向复验'
          p3: '在装置草图上标出起始方向'
        vignettes:
          return: '帮工转过那本书，读数变弱了。你请他先别收，把书转回原位。这次读数也跟着回来了。表里写下了两次变化，第二种材料还来不及试。'
          mark: '帮工说原来朝哪边他自己记得。你在图上做一个记号，又在夹架上找到与它相合的位置标出来。他回到起始方向便不用靠猜。下一轮对照轮到他自己做。'
          reading: '碰装置之前，你先画下书页朝哪边，再把读数写在旁边。转过书，在新的一行记第二个读数。两行都能带回去。仅凭这两下，还分不清有没有漂移。'
text:
  en:
    name: Jagadish Chandra Bose
    text: Indian physicist and biologist, 1858 to 1937, working in Calcutta. He produced and detected millimetre radio waves, and later measured the responses of plants with sensitive instruments.
  zh:
    name: 贾格迪什·钱德拉·博斯
    text: 印度物理学家与生物学家，1858 年生，1937 年去世，在加尔各答工作。他制造并探测毫米波无线电，后来用灵敏仪器测量植物的反应。
hook: {en: 'Did the orientation change or did the detector drift?', zh: '转了方向，还是读数自己变了？'}
facts:
  polarisation:
    date: '1897-01-28'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [bose_calcutta_polarisation]
    text:
      en: 'Bose describes experiments in which the selective transmission of electric radiation depends on orientation. One example uses a bound book and repeats the test with its edge turned by 90 degrees.'
      zh: '博斯报告电辐射通过材料的程度与材料取向有关。其中一个例子使用装订好的书，改变书边的取向九十度后重新测试。'
