        name: Plants that answer back
        place: Calcutta
        figure: Jagadish Chandra Bose
        story: Bose builds instruments so fine that they show plants responding to touch and light, and works on radio waves.
        relic: A crescograph part
        relic_desc: A lever that magnified a plant's growth ten thousand times.
        points:
          p1: "Watch the mimosa leaf move under the needle"
          p2: "Demonstrate before the English scholars"
          p3: "Calibrate the recorder"
      zh:
        name: 会回应的植物
        place: 加尔各答
        figure: 贾格迪什·钱德拉·博斯
        story: 博斯造出极精细的仪器，能显示植物对触碰和光的反应，他还研究无线电波。
        relic: 一个植物生长记录仪的部件
        relic_desc: 一根把植物的生长放大一万倍的杠杆。
        points:
