    text:
      en:
        name: 'The cheque he would not cash'
        place: 'Calcutta'
        figure: 'Jagadish Chandra Bose'
        story: 'In 1885 Bose began teaching physics at Presidency College. His pay was below that offered to European colleagues. He kept teaching and refused the lower pay during the dispute.'
        story_prose:
          opening:
            - 'Calcutta, 1885. Bose teaches physics at Presidency College. The college offers him less than European colleagues doing the same work. He continues to teach.'
            - 'In history, about three years went by before the dispute was resolved. In this branch the first amount has yet to be collected, and there is still time for the office to issue a different cheque.'
            - 'Someone who can read salary terms will be useful here. It also takes someone who can get the person responsible for signing to hear how the two teaching assignments compare.'
          points:
            p1: '{staff} puts a week of classes and both sets of salary terms on one page, then waits with Bose in the office while a ledger is brought down. Once the new terms are written, Bose follows the number with a finger. The cheque comes across the desk again. This time he takes it in both hands.'
          outcomes:
            all: 'When Bose gets back to the classroom, the demonstration is still to be set out. He puts the cheque in his pocket and clears a space for the pupils first.'
            p1: 'When Bose gets back to the classroom, the demonstration is still to be set out. He puts the cheque in his pocket and clears a space for the pupils first.'
          none: 'The office sends the original amount again. Bose looks at it and pushes the paper back across the counter.'
          not_admitted: '{staff} never gets inside the room where the terms are signed. A class ends at the other end of the hall and the boards creak underfoot.'
          excerpts:
            p1: 'The cheque comes across the desk again. This time he takes it in both hands.'
        relic: 'A salary receipt'
        relic_desc: 'An imagined receipt for the first cheque he agreed to take in this branch.'
        points:
          p1: 'Get a written equal-pay offer to Bose during his first year of teaching'
        points_fail:
          p1: 'The employee did not secure equal terms during that first year, and Bose continued to refuse the lower pay.'
        shift:
          p1:
            was: '1885: Bose began teaching at Presidency College. He refused the lower pay, and the dispute took about three years to resolve.'
            now: '{staff} secures a written offer on the same terms as his colleagues. Bose reads it and accepts the first cheque issued on those terms.'
            who: bose_calcutta
            bio: 'Bose received equal terms in his first year at Presidency College.'
      zh:
        name: '那张一直没有兑的支票'
        place: '加尔各答'
        figure: '贾格迪什·钱德拉·博斯'
        story: '1885 年，博斯到总统学院教物理。他的薪俸低于欧洲同事。他继续授课，但在争议解决前不肯领较低的薪俸。'
        story_prose:
          opening:
            - '1885 年，加尔各答。博斯在总统学院教物理。学校给他的薪俸低于做同样工作的欧洲同事，他仍照常上课。'
            - '史实里，从拒领较低薪俸到争议解决过了约三年。在这条分支里，头一笔钱还没领，账房仍有机会重开一张支票。'
            - '这趟用得上读得懂薪俸条款的人。把两份工作摆在一起谈时，还需要有人能让负责签字的人听完。'
          points:
            p1: '{staff}把同一周的课表抄在一张纸上，对照两份薪俸条件，陪博斯到办公室等一本账簿送来。博斯等对方把新条款写完，拿指尖沿着数目读了一遍。那张支票又从桌面另一头递过来。这一回，他用两只手接住了。'
          outcomes:
            all: '博斯回到课堂时，桌上的实验还没摆好。他把支票装进衣袋，先把留给学生的位置擦干净。'
            p1: '博斯回到课堂时，桌上的实验还没摆好。他把支票装进衣袋，先把留给学生的位置擦干净。'
          none: '账房又送来原来那笔数目。博斯看了一眼，把那张纸原样推回柜台。'
          not_admitted: '{staff}没能进签字的那间办公室。走廊那头有人下课，木地板响了一阵。'
          excerpts:
            p1: '那张支票又从桌面另一头递过来。这一回，他用两只手接住了。'
        relic: '一张薪俸收据'
        relic_desc: '分支里的收据，记着他愿意领的第一张支票。'
        points:
          p1: '在博斯执教的第一年，为他争取一份与同事同等薪俸的书面答复'
        points_fail:
          p1: '员工没在第一年谈成同等条件，博斯仍不肯领较低的薪俸。'
        shift:
          p1:
            was: '1885 年，博斯开始在总统学院教书。他拒领较低的薪俸，争议约三年才解决。'
            now: '{staff}争取到与同事同等的书面薪俸条件。博斯读过条款，领了按这个条件开出的第一张支票。'
            who: bose_calcutta
            bio: '博斯在总统学院执教第一年便获得了同等薪俸。'
text:
  en:
    name: Jagadish Chandra Bose
    text: Indian physicist and biologist, 1858 to 1937, working in Calcutta. He produced and detected millimetre radio waves, and later measured the responses of plants with sensitive instruments.
  zh:
    name: 贾格迪什·钱德拉·博斯
    text: 印度物理学家与生物学家，1858 年生，1937 年去世，在加尔各答工作。他制造并探测毫米波无线电，后来用灵敏仪器测量植物的反应。
