text:
  en:
    name: Maria Clemm
    text: Aunt and mother-in-law of Edgar Allan Poe, 1790 to 1871. Poe found a home with her in Baltimore after he broke with his foster father, married her daughter Virginia, and called her Muddy; she kept house for them and carried his manuscripts to publishers. She was at Fordham when he died in Baltimore in October 1849, and learned of it from a newspaper.
  zh:
    name: 玛丽亚·克莱姆
    text: 埃德加·爱伦·坡的姨母兼岳母，1790 年生，1871 年去世。坡与养父决裂后投奔她在巴尔的摩的家，后来娶了她的女儿弗吉尼亚，叫她“马迪”；她替他们操持家务，替他往出版人那里送稿。1849 年 10 月坡死在巴尔的摩时，她在福德姆，是从报上读到的。
