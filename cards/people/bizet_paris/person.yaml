    text:
      en:
        name: 'A programme worth keeping'
        place: "Paris"
        figure: "Georges Bizet"
        story: 'Bizet’s Carmen opened at the Opéra-Comique on 3 March 1875. Célestine Galli-Marié created the title role.'
        relic: "A fan"
        relic_desc: "A painted paper fan from the stalls."
        points:
          p1: 'Before the premiere, give the conductor, chorus and stage staff the same list of changes to the score.'
          p2: 'After the premiere, have Bizet mark which cuts were made for this run and which should be carried into the new score.'
          p3: 'Have Bizet give the publisher a playable version with the original dialogue. Ask the publisher to number any later additions separately.'
        points_fail:
          p1: 'The chorus enters from an old score after the scene has moved on. The theatre calls off that evening’s performance, and the office recalls the employee.'
          p2: 'The only mark is a line through the conductor’s score. When the score is recopied, nobody can tell why the passage disappeared.'
          p3: 'Replacement passages go onto the same pages as the old score. The people who rehearse it later have trouble identifying who wrote the additions.'
        shift:
          p1:
            was: 'Carmen premiered at the Opéra-Comique in Paris on March 3, 1875. The rehearsals demanded considerable work from the chorus.'
          p2:
            was: 'The surviving score shows cuts and revisions made during rehearsal, alongside editorial marks added after Bizet’s death.'
            now: 'The theatre keeps a list Bizet checked. The next rehearsal can use its page numbers to recover a temporarily cut passage.'
          p3:
            was: 'After Bizet’s death, Guiraud supplied recitatives for publication and later performance. The work circulated in different versions.'
            now: 'The publisher keeps a dialogue version signed off by the composer. A theatre that chooses the recitatives can still identify Guiraud’s additions page by page.'
            who: bizet_paris
            bio: 'Bizet revised Carmen with the theatre. The scores left by its performers show how often the version used on stage changed.'
        vignettes:
          future: 'You tell the attendant that later audiences will know this opera in cities he has never visited. He asks why he should keep an extra programme tonight. You show him where the first night and Galli-Marié’s name are printed. One copy goes into his drawer. You leave before it gets a second reader.'
          label: 'The attendant has filed two sheets under the same title. You split them by date and mark the first night on a spare wrapper. A later reader can now ask for the right sheet. You miss the audience coming out.'
          seat: 'You lend a programme to a late visitor and get it back at the door after the visitor has found the seat. You copy one name onto your own slip. By then the music inside has moved on.'
      zh:
        name: '留在架上的《卡门》节目单'
        place: "巴黎"
        figure: "乔治·比才"
        story: '比才的《卡门》于 1875 年 3 月 3 日在巴黎喜歌剧院首演，塞莱斯蒂娜·加利-马里耶首演卡门。'
        relic: "一把折扇"
        relic_desc: "一把来自池座的彩绘纸扇。"
        points:
          p1: '开演前给指挥、合唱和舞台各发一份从同一总谱抄出的改动表，护住《卡门》的首演。'
          p2: '首演后请比才给删过的唱段批注，告诉抄谱员哪些只为这轮演出删节，哪些要从新谱撤掉。'
          p3: '请比才交给出版商一套能照演的原对白版，请出版商把任何后来补写的唱段单独编号。'
        points_fail:
          p1: '合唱按旧谱接唱，台上已进入下一段。剧院撤下当晚的演出，事务所因同步失败召回员工。'
          p2: '排练删节只在指挥的总谱上划了一笔。重新抄谱时，删过的唱段没有留下可追查的说明。'
          p3: '改过的唱段直接抄进旧谱同一页。日后找来排练的人很难判断新增的部分是谁写的。'
        shift:
          p1:
            was: '《卡门》于 1875 年 3 月 3 日在巴黎喜歌剧院首演，合唱在排练中承担了大量工作。'
          p2:
            was: '留存总谱可看到排练期间的删改，也有作曲家身后的编辑笔迹。'
            now: '剧院拿到一份由比才核过的删节表，下次排练可以凭页码找回暂时拿掉的一段。'
          p3:
            was: '比才去世后，吉罗为出版和后来演出另写宣叙调，作品由此以不同版本流传。'
            now: '出版商留下有作者签认的对白本。后来有剧院选用宣叙调，也能按页注明吉罗的增写。'
            who: bizet_paris
            bio: '比才与剧院反复调整《卡门》的乐谱。演出人员留下的谱本显示，舞台上用过的版本经历多次修改。'
        vignettes:
          future: '你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。'
          label: '帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。'
          seat: '你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。'
text:
  en:
    name: Georges Bizet
    text: French composer, 1838 to 1875. His opera Carmen opened in Paris in 1875 to a cool reception and he died a few months later. It became one of the most performed operas.
  zh:
    name: 乔治·比才
    text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
