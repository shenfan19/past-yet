text:
  en:
    name: Georges Bizet
    text: French composer, 1838 to 1875. His opera Carmen opened in Paris in 1875 to a cool reception and he died a few months later. It became one of the most performed operas.
  zh:
    name: 乔治·比才
    text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
