    text:
      en:
        name: 'The year of Carmen'
        place: "Paris"
        figure: "Georges Bizet"
        story: 'In the last weeks of rehearsal for Carmen the orchestra called parts of the score unplayable and the chorus balked at acting while it sang. The opera opened at the Opéra-Comique on 3 March 1875 to cold notices, and Bizet believed it had failed. At the end of May he swam in the Seine at Bougival, fell ill, and died on 3 June, at thirty six.'
        relic: "A fan"
        relic_desc: "A painted paper fan from the stalls."
        points:
          p1: 'When the orchestra calls passages unplayable and the chorus will not act as it sings, rehearse them through it and hold the premiere of 3 March'
          p2: 'When the cold notices after the premiere have sunk Bizet into gloom, let him know that Carmen will go on being played in theatres everywhere'
          p3: 'Stop the fever that follows his swim in the Seine at Bougival from reaching his heart, and save Bizet at thirty six'
        points_fail:
          p1: 'The rehearsals stall and the theatre cannot raise the curtain on 3 March. The branch drifts out of sync, and the office recalls the employee.'
          p2: 'In this branch Bizet goes on believing that Carmen has failed, and spends the spring low in spirits.'
          p3: 'In this branch Bizet still dies at Bougival in the early hours of 3 June, at thirty six.'
        shift:
          p1:
            was: 'Winter 1875: in rehearsal the orchestra called parts of Carmen unplayable and the chorus resisted moving while it sang. The opera opened at the Opéra-Comique on 3 March 1875.'
          p2:
            was: 'Carmen opened on 3 March 1875 to a largely hostile press; Bizet was convinced it had failed and stayed low in spirits through the spring.'
            now: '{staff} tells Bizet at the end of March that this opera will be played in theatres in many countries. He goes on attending the performances, and the spring weighs less on him.'
          p3:
            was: 'At the end of May 1875 Bizet swam in the Seine at Bougival and fell ill with a high fever; after a heart attack on 1 June he died in the early hours of 3 June, at thirty six.'
            now: 'The fever of June passed and Bizet spent the rest of the summer recovering at Bougival. In the autumn he went to Vienna to see Carmen at the Court Opera, and he went on writing for the theatre for many years.'
            who: bizet_paris
            bio: 'Bizet survived the illness of the summer of 1875. He saw Carmen staged in Vienna that autumn and kept writing operas for years after.'
        vignettes:
          future: 'You tell the attendant that later audiences will know this opera in cities he has never visited. He asks why he should keep an extra programme tonight. You show him where the first night and Galli-Marié’s name are printed. One copy goes into his drawer. You leave before it gets a second reader.'
          label: 'The attendant has filed two sheets under the same title. You split them by date and mark the first night on a spare wrapper. A later reader can now ask for the right sheet. You miss the audience coming out.'
          seat: 'You lend a programme to a late visitor and get it back at the door after the visitor has found the seat. You copy one name onto your own slip. By then the music inside has moved on.'
      zh:
        name: '《卡门》的那一年'
        place: "巴黎"
        figure: "乔治·比才"
        story: '《卡门》排练到最后几周，乐队说有几段奏不了，合唱不肯边唱边演。1875 年 3 月 3 日它在巴黎喜歌剧院首演，报刊多是冷评，比才认定它失败了。5 月底他在布日瓦尔下塞纳河游泳，随后病倒，6 月 3 日去世，三十六岁。'
        relic: "一把折扇"
        relic_desc: "一把来自池座的彩绘纸扇。"
        points:
          p1: '乐队说几段奏不了、合唱不肯边唱边演时，陪他们练下来，护住 3 月 3 日的首演'
          p2: '首演遭冷评后比才消沉，让他知道《卡门》会在各地的剧院一直演下去'
          p3: '布日瓦尔下河游泳后的高烧烧到心上之前治好他，救下三十六岁的比才'
        points_fail:
          p1: '排练卡住，剧院 3 月 3 日拉不开幕。分支脱节，事务所因同步失败召回员工。'
          p2: '这条分支里比才一直以为《卡门》失败了，消沉着过完这个春天。'
          p3: '这条分支里比才仍在 6 月 3 日凌晨死于布日瓦尔，三十六岁。'
        shift:
          p1:
            was: '1875 年冬，《卡门》排练时乐队说有几段奏不了，合唱不愿边唱边走动。3 月 3 日它在巴黎喜歌剧院首演。'
          p2:
            was: '1875 年 3 月 3 日《卡门》首演，报刊多是恶评，比才认定这部戏失败了，整个春天情绪低落。'
            now: '三月底{staff}告诉比才，这部戏日后会在许多国家的剧院上演。他照常去剧院看演出，这个春天对他轻了些。'
          p3:
            was: '1875 年 5 月底，比才在布日瓦尔下塞纳河游泳后发起高烧，6 月 1 日心脏病发作，6 月 3 日凌晨去世，三十六岁。'
            now: '六月的高烧退了，比才在布日瓦尔养完这个夏天。秋天他去维也纳，看《卡门》在宫廷歌剧院上演，此后又为剧院写了许多年。'
            who: bizet_paris
            bio: '比才熬过了 1875 年夏天的病，那年秋天看到《卡门》在维也纳上演，之后又写了多年歌剧。'
        vignettes:
          future: '你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。'
          label: '帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。'
          seat: '你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。'
text:
  en:
    name: Georges Bizet
    text: French composer, 1838 to 1875. His opera Carmen opened in Paris in 1875 to a cool reception and he died a few months later. It became one of the most performed operas.
  zh:
    name: 乔治·比才
    text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
hook: {en: 'The orchestra says unplayable, the papers say a failure.', zh: '乐队说奏不了，报纸说失败了'}
facts:
  premiere:
    date: '1875-03-03'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [bizet_paris_premiere]
    text:
      en: 'Carmen premiered at the Opéra-Comique on 3 March 1875, with Célestine Galli-Marié in the title role.'
      zh: '《卡门》于 1875 年 3 月 3 日在喜歌剧院首演，加利-马里耶首演卡门。'
    line:
      en: '3 March 1875: Carmen opens at the Opéra-Comique.'
      zh: '1875 年 3 月 3 日，《卡门》在喜歌剧院首演。'
  rehearsals:
    date: '1875-02'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [bizet_paris_carmen_wiki, bizet_paris_sfopera]
    text:
      en: 'Rehearsals ran longer than planned and delayed the premiere; the orchestra found parts of the score impossible to play, and the chorus resisted being asked to move while it sang.'
      zh: '排练比预计拖得久，首演因此推迟；乐队认为总谱有几处没法演奏，合唱不愿边唱边走动。'
    line:
      en: 'February 1875: the orchestra calls passages of Carmen unplayable.'
      zh: '1875 年 2 月，乐队说《卡门》有几段奏不了。'
  reception:
    date: '1875-03-04'
    stay_day: 18
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [bizet_paris_carmen_wiki, bizet_paris_bizet_wiki]
    text:
      en: 'The press reviews after the premiere ranged from disappointment to outrage, and Bizet believed the opera had failed.'
      zh: '首演后的报刊评论从失望到愤怒都有，比才认定这部戏失败了。'
    line:
      en: '4 March 1875: the morning papers are cold to Carmen.'
      zh: '1875 年 3 月 4 日，晨报对《卡门》一片冷评。'
  death:
    date: '1875-06-03'
    stay_day: 109
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [bizet_paris_bizet_wiki, bizet_paris_hektoen]
    text:
      en: 'At the end of May 1875 Bizet swam in the Seine at Bougival and fell ill with fever; after a heart attack on 1 June he died early on 3 June, at thirty six.'
      zh: '1875 年 5 月底，比才在布日瓦尔下塞纳河游泳后发烧，6 月 1 日心脏病发作，6 月 3 日凌晨去世，三十六岁。'
    line:
      en: '3 June 1875: Bizet dies at Bougival.'
      zh: '1875 年 6 月 3 日，比才在布日瓦尔去世。'
