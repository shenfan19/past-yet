    text:
      en:
        name: 'The year of Carmen'
        place: "Paris"
        figure: "Georges Bizet"
        story: 'Carmen opened at the Opéra-Comique on 3 March 1875 after a long rehearsal period. The press was mixed and the production continued through the spring. On 3 June Bizet died in Bougival, aged thirty-six.'
        relic: "A fan"
        relic_desc: "A painted paper fan from the stalls."
        points:
          p1: 'Help the theatre set aside a final run for the singers to rehearse the difficult entries with the movement and the orchestra'
          p2: 'Take Bizet a report from an evening performance, with the exact passage the singers still want to go over'
        points_fail:
          p1: 'The rehearsals stall and the theatre cannot raise the curtain on 3 March. The branch drifts out of sync, and the office recalls the employee.'
          p2: 'The note reaches Bizet with the passage left out. He learns there was a problem without hearing which part the singers wanted to rehearse.'
        shift:
          p1:
            was: 'The Opéra-Comique’s stage register records rehearsal and stage preparations on 3 March 1875, the day Carmen opened.'
          p2:
            was: 'The first run of Carmen continued after its March premiere.'
            now: 'In this branch {staff} gives Bizet a report he can use. He marks the entry in the score and can discuss it with the singers before their next performance.'
        vignettes:
          future: 'You tell the attendant that later audiences will know this opera in cities he has never visited. He asks why he should keep an extra programme tonight. You show him where the first night and Galli-Marié’s name are printed. One copy goes into his drawer. You leave before it gets a second reader.'
          label: 'The attendant has filed two sheets under the same title. You split them by date and mark the first night on a spare wrapper. A later reader can now ask for the right sheet. You miss the audience coming out.'
          seat: 'You lend a programme to a late visitor and get it back at the door after the visitor has found the seat. You copy one name onto your own slip. By then the music inside has moved on.'
      zh:
        name: '《卡门》的那一年'
        place: "巴黎"
        figure: "乔治·比才"
        story: '《卡门》经过数月排练，于 1875 年 3 月 3 日在巴黎喜歌剧院首演。报刊评价不一，剧院在那年春天继续演出。6 月 3 日，比才在布日瓦尔去世，终年三十六岁。'
        relic: "一把折扇"
        relic_desc: "一把来自池座的彩绘纸扇。"
        points:
          p1: '请剧院再留最后一轮排练，让歌手带上走位，和乐队再对一遍最难进声的地方'
          p2: '把一晚的演出情况送给比才，替歌手标清下次还想一起过哪一段'
        points_fail:
          p1: '排练卡住，剧院 3 月 3 日拉不开幕。分支脱节，事务所因同步失败召回员工。'
          p2: '便条到了，却漏了是哪一段。比才只知道有个地方难唱，还要等人回来指明。'
        shift:
          p1:
            was: '喜歌剧院的舞台日志记下了 1875 年 3 月 3 日首演当天的排练和舞台准备。'
          p2:
            was: '三月首演后，《卡门》在当年春季继续演出。'
            now: '这条分支里，{staff}带来了一张能对回总谱的便条。比才把难进声的位置圈出来，下一场之前可以问问歌手怎么唱比较顺。'
        vignettes:
          future: '你告诉帮工，以后连他没去过的城市也会有人知道这部戏。他问今夜有何必要多留一张。你指给他看首演日期和加利-马里耶的名字。一张节目单收进抽屉。你走时还没有第二个人来翻看。'
          label: '帮工把两张节目单按同一个剧名收了。你按日期把它们分开，给首演那张单独做了个写有日期的纸套。回头要查的人现在能拿准。只是你赶不上散场了。'
          seat: '你把节目单借给来迟的观众，等他找到座位再在门边拿回来。你在自己的纸条上抄下一个名字。这时候，里面已经唱过了你原先想听的那一段。'
text:
  en:
    name: Georges Bizet
    text: French composer, 1838 to 1875. His opera Carmen opened in Paris in 1875 to a cool reception and he died a few months later. It became one of the most performed operas.
  zh:
    name: 乔治·比才
    text: 法国作曲家，1838 年生，1875 年去世。他的歌剧《卡门》1875 年在巴黎首演，反响冷淡，几个月后他就去世了。后来它成了演出最多的歌剧之一。
hook: {en: 'Where does the chorus come in again?', zh: '合唱再进声，是在哪一拍？'}
facts:
  premiere:
    date: '1875-03-03'
    checked: official_record
    level: usable
    stay_day: 17
    use: [story, history, wiki]
    sources: [bizet_paris_premiere, bizet_comique_archive]
    text:
      en: 'Carmen premiered at the Opéra-Comique on 3 March 1875, with Célestine Galli-Marié in the title role.'
      zh: '《卡门》于 1875 年 3 月 3 日在喜歌剧院首演，加利-马里耶首演卡门。'
    line:
      en: '3 March 1875: Carmen opens at the Opéra-Comique.'
      zh: '1875 年 3 月 3 日，《卡门》在喜歌剧院首演。'
  rehearsals:
    date: '1875-02'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [bizet_rehearsal_score, bizet_comique_archive]
    text:
      en: 'The production went through many rehearsals. The Opéra-Comique’s stage register records rehearsals and the last touches to scenery and lighting on opening day.'
      zh: '《卡门》经过许多轮排练。喜歌剧院舞台日志记下首演当日的排练，以及布景和灯光的最后调整。'
    line:
      en: 'The theatre keeps rehearsing Carmen up to the day it opens.'
      zh: '《卡门》一直排练到首演当天。'
  death:
    date: '1875-06-03'
    stay_day: 109
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [bizet_paris_met_letter]
    text:
      en: 'Bizet died in Bougival on 3 June 1875, aged thirty-six, while Carmen was still in its first run.'
      zh: '1875 年 6 月 3 日，比才在布日瓦尔去世，终年三十六岁，当时《卡门》仍在第一轮演出。'
    line:
      en: '3 June 1875: Bizet dies at Bougival.'
      zh: '1875 年 6 月 3 日，比才在布日瓦尔去世。'
