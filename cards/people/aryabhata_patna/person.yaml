    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [aryabhata_patna_circle]
    text:
      en: 'Verse 10 gives an approximate circumference for a diameter of 20,000, computed as 62,000 plus eight times 104.'
      zh: '第 10 颂针对直径 20,000 给出近似圆周算法，62,000 加 104 的八倍。'
