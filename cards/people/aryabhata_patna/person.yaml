    text:
      en:
        name: 'The circle in three steps'
        place: Kusumapura, India
        figure: Aryabhata
        story: 'In the mathematics section of the Āryabhaṭīya, Āryabhaṭa gives a rule for the approximate circumference of a circle of diameter 20,000. Adding 4 to 100, multiplying by 8 and adding 62,000 gives 62,832. The map locates the visit in the period associated with the treatise.'
        relic: A palm-leaf of verses
        relic_desc: A thin leaf with verses scratched in.
        points:
          p1: 'At Kusumapura, check that the mathematics and its dated passage are both present in the compilation'
          p2: 'Ask the author and a teacher to use one example to check when the approximation is enough. Copy it alongside the original verse'
        points_fail:
          p1: 'The rules are copied without the leaves recording the date. The office recalls the employee.'
          p2: 'The verse survives separately from the exercise used to check the approximation.'
        shift:
          p1:
            was: 'The Aryabhatiya names Kusumapura. Its chronological passage is conventionally read as 499 CE.'
          p2:
            was: 'Several commentary traditions developed around the concise verses.'
            now: 'Students circulate a copy with a worked example checked by the author. A later commentator can still distinguish the words of the verse.'
            who: aryabhata_patna
            bio: 'Aryabhata put astronomical and mathematical knowledge into concise verses. How dates, terms and examples traveled affected later readings.'
        vignettes:
          scale: 'The rope maker writes two diameters on the board but gives them the same circumference. You pair 20,000 with 62,832 and show him what scales when the diameter doubles. He changes one line. You take home the two pairs. The rope is still being measured when you go.'
          measure: 'You know the rule will outlast everyone in the workshop. The rope maker wants to know how to remember it while working. You write the three steps in separate lines. He gets the next trial right without asking which addition comes last. The rope itself is left for another day.'
          copy: 'You copy both the diameter and the approximate circumference before the board is wiped. The rope maker sees why he needs two numbers. You keep the pair on one slip and leave before seeing the rope laid around a circle.'
      zh:
        name: '三步算出一圈的长度'
        place: 印度库苏马普拉
        figure: 阿耶波多
        story: '《阿耶波多历数书》的数学篇写了一条求近似圆周的口诀，以 20,000 为直径。100 加 4，乘 8，再加 62,000，得 62,832。'
        relic: 一片棕榈叶经文
        relic_desc: 一片薄叶，上面刻着诗句。
        points:
          p1: '在拘苏摩补罗核齐《阿耶波多历数书》的数学篇和写有纪年的段落，让初编能成册'
          p2: '让作者和教习用一题检查近似何时足够，并把试讲用的算例与原颂合抄'
        points_fail:
          p1: '抄完的一组只见口诀，没有写年代的篇页，事务所因同步失败召回员工。'
          p2: '短颂传下来了，课堂上用来检查近似的例子却不见了。'
        shift:
          p1:
            was: '《阿耶波多历数书》提及拘苏摩补罗，纪年部分通常折为 499 年。'
          p2:
            was: '简练的颂文后来成为不同注释传统的对象。'
            now: '一套供学习者传看的本子带有作者核过的例子。后来作注的人还能识别哪些词出自原颂。'
            who: aryabhata_patna
            bio: '阿耶波多用简短颂文组织历算知识。年代、术语和具体例子如何一同传递，影响后来怎样解释这部书。'
        vignettes:
          scale: '制绳人在板上写了两个直径，配的却是同一个圆周。你把 20,000 和 62,832 配在一行，再指给他看直径加倍时该把哪个数也翻倍。他改了一行，你把两组数字记下来。你走时，绳子还在量。'
          measure: '你知道这条口诀会比作坊里的人流传得久。制绳人问做活时该怎么记，你把三步各写一行。他重算一遍，没再问最后该加哪一个数。真正的绳子得留到另一天。'
          copy: '板擦掉之前，你把直径和近似圆周都抄了下来。制绳人这才看出为什么得留两个数。你带走写在同一张条上的数，没等到绳子绕上圆周。'
text:
  en:
    name: Aryabhata
    text: Indian mathematician and astronomer, born in 476. His work, written at Kusumapura in 499, gives a value of pi close to 3.1416, explains eclipses by shadows and treats the rotation of the Earth.
  zh:
    name: 阿耶波多
    text: 印度数学家与天文学家，476 年生。他 499 年在库苏马普拉写成的著作给出接近 3.1416 的圆周率，用影子解释日月食，并论及地球自转。
hook: {en: 'What if you double the circle?', zh: '直径翻倍，算式往哪儿改？'}
