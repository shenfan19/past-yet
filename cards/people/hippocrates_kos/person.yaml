    text:
      en:
        name: 'A night without a witness'
        place: Kos
        figure: Hippocrates
        story: 'The Hippocratic Epidemics records illnesses day by day, including cases on Thasos. The work is part of a collection transmitted under Hippocrates’ name. This imagined workshop on Kos uses a practice note to compare observers’ dates. Its note and helpers are invented.'
        relic: 'A practice watch record'
        relic_desc: 'A fictional day-by-day record that preserves two starting points.'
        points:
          p1: 'Find where the two accounts start counting days'
          p2: 'Take the watch so the other recorder can rest'
          p3: 'Ask what happened on the night no one wrote about'
        vignettes:
          days: 'Myrine has numbered her first visit day one. Leon starts his count from the night before. You set both pages by the same lamp and ask them to point to the same morning. The two numbers stay on the sheet, alongside an indication of where each count began.'
          watch: 'Leon is about to leave and Myrine has been awake since before sunrise. You give her time to rest while you mind the lamp outside. She brings the sheet back at the next change of watch. There is another observer for that stretch of the night.'
          blank: 'You know later readers will make much of a day-by-day record. The space before Myrine’s first visit has no observer to fill it. You put a small mark beside the gap and leave the rest as it is. The person from the earlier watch will not return before you go.'
      zh:
        name: '无人看守的那一夜'
        place: 科斯岛
        figure: 希波克拉底
        story: '传于希波克拉底名下的《流行病》逐日记录病程，其中有塔索斯岛的病例。游戏虚构科斯岛上一处习作场所，让两位帮工用练习记录核对观察的日子。记录与帮工均为虚构。'
        relic: '一页练习值守记录'
        relic_desc: '虚构逐日记录，留着两个起算点。'
        points:
          p1: '找出两份记录各从哪天开始数'
          p2: '替另一名记录人值守一段，让对方休息'
          p3: '问问没留下笔记的那一夜谁在场'
        vignettes:
          days: '米里涅把自己第一次来看记作第一天，莱昂从前一夜就开始数。你把两张纸放到同一盏灯下，让两人指给你看同一个早晨。纸上保留两个数字，旁边注明各从哪里数起。'
          watch: '莱昂要走了，米里涅从天没亮就醒着。你在外面守灯，让她先歇一会儿。下一轮换班，她把纸拿回来。夜里这一段有人接着看了。'
          blank: '你知道后来的人会看重逐日记录。米里涅初次到访之前那一格，眼下找不到观察人来填。你只在空处旁添个记号。前一轮值守的人，你走之前还不会回来。'
text:
  en:
    name: Hippocrates
    text: Greek physician from the island of Kos, about 460 BC to about 370 BC. The collection of medical writings under his name treats disease as natural rather than divine and stresses careful observation of the patient.
  zh:
    name: 希波克拉底
    text: 科斯岛的希腊医生，约公元前 460 年生，约公元前 370 年去世。以他名义流传的医学文集把疾病看作自然现象而非神意，强调仔细观察病人。
quotes:
  hippocrates:
    order: 10
    text:
      en: {who: Hippocrates, quote: "Life is short, the art long."}
      zh: {who: 希波克拉底, quote: "人生短暂，技艺长久。"}
hook: {en: 'What day does the chart start on?', zh: '记录上的第一天，是哪一天？'}
