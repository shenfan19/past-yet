  site:
    date: '1902'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [tesla_wardenclyffe_site]
    text:
      en: 'The laboratory and tower site survive. The Register account describes the proposed wireless delivery of power and communications and lists the use of the laboratory from 1902 to 1906.'
      zh: '实验室与塔址尚存。遗址资料记载拟议中的无线供能和通信系统，也列出实验室在1902至1906年间的使用。'
