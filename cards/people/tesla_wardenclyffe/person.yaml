    text:
      en:
        name: 'The line marked proposed'
        place: "Shoreham, Long Island"
        figure: "Nikola Tesla"
        story: 'In March 1901 J. Pierpont Morgan agreed to put 150,000 dollars into a wireless station for Nikola Tesla. The architect Stanford White designed the buildings at Wardenclyffe on Long Island, and that year Tesla wrote to him several times about the tower and the laboratory. Building began in September. In December Marconi heard a signal sent across the Atlantic. Tesla moved his laboratory into the brick building in June 1902; in July 1903 Morgan wrote that he would advance no more money. The tower was blown up in 1917.'
        story_prose:
          opening:
            - 'Wardenclyffe, on the north shore of Long Island, September 1901. Half a year ago J. Pierpont Morgan agreed to put 150,000 dollars into a wireless station for the inventor Nikola Tesla, and the architect Stanford White designed the laboratory and the tower here. Tesla means the tower for wireless communication and the wireless sending of power.'
            - 'In history, that September the builders'' bids came in higher than expected, Tesla wrote to White several times about the tower and the laboratory, and the drawings were changed again and again; in December Marconi heard a signal sent across the Atlantic; in July 1903 Morgan wrote that he would advance no more money, and in 1917 the tower was blown up. In this branch, the site has a foreman, a watchman keeps the plank shed on the bluff, and a carter hauls planks up the sandy track.'
            - 'A few kinds of people can help on this trip: someone who has kept archives or worked as a carpenter, or someone handy and methodical, to tell the old drawings from the revised ones and to see what the building and the tower each cost; and someone who can also talk people round, to help Tesla set out the money stretch by stretch.'
          outcomes:
            all: 'In June 1902 Tesla moved his laboratory into the brick building. The money ran short in the end all the same, and the two pages of accounts stayed pinned to the wall of the shed, a line drawn under the stretch that had been paid.'
            p3: 'The money ran short in the end all the same. The site paid off the stretch of foundation work that had been agreed, and the items with no money behind them were listed on a page of their own and pinned behind the shed door.'
            p2: 'In June 1902 Tesla moved his laboratory into the brick building. The bids for the tower changed several more times, and each one could be checked against the page before it.'
            p1: 'In June 1902 Tesla moved his laboratory into the brick building at Wardenclyffe and worked there until 1906. The laboratory and the site of the tower survive today.'
          none: 'In July 1903 Morgan wrote that he would advance no more money. The tower stood on the bluff for more than a decade and was blown up in 1917; the brick building is still there.'
          desync: 'On 19 September the two sets of drawings lay mixed in one pile, the builders had priced the work from the old ones, and nobody could say which set to follow. When {staff} was recalled the foreman was rolling up the whole pile and tying it with a length of twine.'
          not_admitted: '{staff} never got onto the site, and only stood a few days beside the sandy track up to the bluff. Cart after cart of planks went by, the wheels sinking into the sand, and men pushed them out again from behind.'
          points:
            p1:
              class_lettered: 'On 19 September two sets of drawings lie on the long table in the site shed, the headings exactly the same and the dimensions not matching; the builders have priced the work from the old set, well above what anyone expected. {staff}, used to paperwork, separates the old drawings from the revised ones sheet by sheet, pencils a date under the fold of each, signs for each set and weighs them down under two bricks. The foreman picks up the revised set, holds it to the light of the window a while, folds it twice and tucks it into his jacket pocket. He walks out of the shed, calls up the bluff and has the men bring the piles over.'
              class_craft: 'On 19 September two sets of drawings lie on the long table in the site shed, the headings exactly the same and the dimensions not matching; the builders have priced the work from the old set, well above what anyone expected. {staff}, who has worked with tools, measures the dimensions on both sets point by point with a rule, separates the old drawings from the revised ones, pencils a date under the fold of each, signs for each set and weighs them down under two bricks. The foreman picks up the revised set, holds it to the light of the window a while, folds it twice and tucks it into his jacket pocket. He walks out of the shed, calls up the bluff and has the men bring the piles over.'
              else: 'On 19 September two sets of drawings lie on the long table in the site shed, the headings exactly the same and the dimensions not matching; the builders have priced the work from the old set, well above what anyone expected. {staff}, handy and careful, compares them sheet by sheet, separates the old drawings from the revised ones, pencils a date under the fold of each, signs for each set and weighs them down under two bricks. The foreman picks up the revised set, holds it to the light of the window a while, folds it twice and tucks it into his jacket pocket. He walks out of the shed, calls up the bluff and has the men bring the piles over.'
            p2:
              class_lettered: 'At the end of September another bid comes from White''s office, the building and the tower lumped into one column. {staff}, used to paperwork, copies out item by item the laboratory work already agreed in the letters onto a page of its own, lists the tower items still waiting for new bids on a second page, and sends both back for White to look over. When the answer comes the foreman pins the two pages to the two walls of the shed. He stands between them for a look and draws a line under the laboratory page.'
              class_craft: 'At the end of September another bid comes from White''s office, the building and the tower lumped into one column. {staff}, who has worked with tools and knows that the men who lay bricks are not the men who raise a tower, picks out item by item the laboratory work already agreed onto a page of its own, lists the tower items still waiting for new bids on a second page, and sends both back for White to look over. When the answer comes the foreman pins the two pages to the two walls of the shed. He stands between them for a look and draws a line under the laboratory page.'
              else: 'At the end of September another bid comes from White''s office, the building and the tower lumped into one column. {staff}, sharp eyed, sees two kinds of work mixed in that one column, picks out item by item the laboratory work already agreed onto a page of its own, lists the tower items still waiting for new bids on a second page, and sends both back for White to look over. When the answer comes the foreman pins the two pages to the two walls of the shed. He stands between them for a look and draws a line under the laboratory page.'
            p3:
              class_lettered: 'Early in November the walls of the brick building are rising day by day, while the base of the tower is still a dug-out patch of sand. Tesla comes out from New York and turns over the two pages of accounts in the shed. {staff}, used to paperwork, sets out the confirmed costs month by month in a table and asks him to put staged payments to his backer by it, with a separate agreement for the next stretch of foundation work. Tesla changes two figures in the table with his pen, folds it and slips it into the envelope addressed to Morgan. He walks out of the shed, and the wind off the Sound flips up the brim of his hat.'
              class_craft: 'Early in November the walls of the brick building are rising day by day, while the base of the tower is still a dug-out patch of sand. Tesla comes out from New York and turns over the two pages of accounts in the shed. {staff}, who has worked with tools and knows how many months and men a stretch of work takes from digging to masonry, sets out the confirmed costs stage by stage in a table and asks him to put staged payments to his backer by it, with a separate agreement for the next stretch of foundation work. Tesla changes two figures in the table with his pen, folds it and slips it into the envelope addressed to Morgan. He walks out of the shed, and the wind off the Sound flips up the brim of his hat.'
              else: 'Early in November the walls of the brick building are rising day by day, while the base of the tower is still a dug-out patch of sand. Tesla comes out from New York and turns over the two pages of accounts in the shed. {staff}, methodical and persuasive, talks him through the confirmed costs one by one, sets them out in a table and asks him to put staged payments to his backer by it, with a separate agreement for the next stretch of foundation work. Tesla changes two figures in the table with his pen, folds it and slips it into the envelope addressed to Morgan. He walks out of the shed, and the wind off the Sound flips up the brim of his hat.'
          excerpts:
            p3: 'Tesla changes two figures in the table with his pen, folds it and slips it into the envelope addressed to Morgan. He walks out of the shed, and the wind off the Sound flips up the brim of his hat.'
            p2: 'When the answer comes the foreman pins the two pages to the two walls of the shed. He stands between them for a look and draws a line under the laboratory page.'
            p1: 'The foreman picks up the revised set, holds it to the light of the window a while, folds it twice and tucks it into his jacket pocket. He walks out of the shed, calls up the bluff and has the men bring the piles over.'
        relic: 'A drawing copy'
        relic_desc: 'A copy of a Wardenclyffe plan sheet, folded twice, with a date in pencil under the fold.'
        points:
          p1: 'When the September bids come in high, register the original and revised drawings separately at Wardenclyffe so the work can still start that year'
          p2: 'Have White list the laboratory work already agreed apart from the tower work still awaiting bids and give the foreman a separate account for each'
          p3: 'Help Tesla propose staged payments using the confirmed costs, with its own commitment for the next stretch of foundation work'
        points_fail:
          p1: 'Contractors quote from obsolete drawings and nobody can confirm the dimensions. The work is called off for the season, and the office recalls the employee.'
          p2: 'One quote lumps the building and tower together. Later the crew cannot see which portion was already authorized.'
          p3: 'Both sets of work still depend on the same round of funding. When money runs short, the crew cannot tell which work will be paid for.'
        shift:
          p1:
            was: 'Tesla and Stanford White discussed bids and designs in 1901. Construction at Wardenclyffe began that year.'
          p2:
            was: 'Wardenclyffe included a laboratory building and a tower. Correspondence records changes to designs and budgets.'
            now: 'Before starting, the foreman can settle the two accounts separately. A new tower quote can be checked against the previous estimate.'
          p3:
            was: 'Morgan provided initial funding. Later funding fell short and the project did not proceed as originally intended.'
            now: 'A written agreement covers the confirmed stretch. When funds run short later, the site can settle that bill and clearly identify the work still unfunded.'
            who: tesla_wardenclyffe
            bio: 'Tesla envisioned Wardenclyffe as part of a wireless communication and power system. Turning it into a site also required bids, financing and building schedules.'
        vignettes:
          timber: 'Early in October {staff} helps a carter get a load of planks up the sandy track to the site, one shoulder under the tailboard each time the wheels sink. The carter says the farmers down the road have started timing their hens by the hammering, and they lay best on the days the yard is quiet.'
          signal: 'In mid December a boy comes up from the station waving a paper: Marconi has heard a signal from across the ocean. The foreman holds the page at arm''s length and asks {staff} whether a dot can really get that far. {staff} says it can, and the foreman folds the paper into his coat and tells the men to keep hammering.'
          watch: 'Late in December {staff} sits a night out with the watchman in the plank shed on the bluff, stuffing old newspapers into the cracks against the wind off the Sound. The watchman reads out the price of coal from one of them and says a tower that tall had better be worth the draught.'
      zh:
        name: '那一行写着拟建'
        place: "长岛肖勒姆"
        figure: "尼古拉·特斯拉"
        story: '1901 年 3 月，J.P. 摩根答应出资十五万美元，给尼古拉·特斯拉建一座无线电站。建筑师斯坦福·怀特设计了长岛沃登克里弗的房子，这一年特斯拉为塔和实验楼几次写信给他。9 月工地动工。12 月，马可尼收到了一个越过大西洋的信号。1902 年 6 月，特斯拉把实验室搬进砖楼；1903 年 7 月，摩根回信说不再追加款项。1917 年，塔被炸掉。'
        story_prose:
          opening:
            - '1901 年 9 月，纽约长岛北岸的沃登克里弗。半年前，J.P. 摩根答应出资十五万美元，给发明家尼古拉·特斯拉建一座无线电站；建筑师斯坦福·怀特设计了这里的实验楼和塔。特斯拉想用这座塔做无线通信和输电。'
            - '史实里，九月里各家包工的报价高出预料，特斯拉为塔和实验楼几次写信给怀特，图纸改了又改；12 月马可尼收到了越过大西洋的信号；1903 年 7 月摩根回信说不再追加款项，1917 年塔被炸掉。在这条分支里，工地上有个工头，崖上的木板棚里有个守夜人，沙路上有个往这边拉木板的车夫。'
            - '这一趟用得上几种人：管过档案、做过木工的人，或者手巧、有条理的人，分得清哪一张是旧图、哪一张是改过的，也看得懂楼和塔的工钱各是多少；再要说得动人，替特斯拉把拨款一段一段讲清楚。'
          outcomes:
            all: '1902 年 6 月，特斯拉把实验室搬进了砖楼。后来钱还是不够，工棚墙上那两页账一直钉着，付清了的那一段底下画着一道线。'
            p3: '后来钱还是不够。工地结清了约定的那一段基础工程，没有着落的几项另列在一页纸上，钉在工棚门后。'
            p2: '1902 年 6 月，特斯拉把实验室搬进砖楼。塔的报价后来又改过几回，每一回都能跟前一页对上。'
            p1: '1902 年 6 月，特斯拉把实验室搬进沃登克里弗的砖楼，在那里一直工作到 1906 年。实验楼和塔址留到了今天。'
          none: '1903 年 7 月，摩根回信说不再追加款项。崖上的塔立了十几年，1917 年被炸掉，砖楼还在。'
          desync: '9 月 19 日，两套图混在一摞里，包工人照着旧图报了价，没人说得清该照哪一套。{staff}被召回时，工头正把整摞图卷起来，用一根麻绳捆住。'
          not_admitted: '{staff}没能进工地，只在通往崖上的沙路边站过几天。拉木板的车一辆辆过去，轮子陷进沙里，又被人从后面推了出来。'
          points:
            p1:
              class_lettered: '9 月 19 日，工棚的长桌上摊着两套图，抬头一模一样，尺寸却对不上；包工人拿着旧图报的价，比预料的高出一截。{staff}管过文书，把旧图和修订图一张张分开，在每张的折角底下用铅笔写上日期，各签一个收，压在两块砖下。工头拿起修订的那一套，对着窗口的光看了一阵，折了两道，揣进上衣口袋。他走出工棚，朝崖上喊了一声，让人把木桩搬过来。'
              class_craft: '9 月 19 日，工棚的长桌上摊着两套图，抬头一模一样，尺寸却对不上；包工人拿着旧图报的价，比预料的高出一截。{staff}干过手艺活，拿尺子把两套图上的尺寸一处处量过，把旧图和修订图分开，在每张的折角底下用铅笔写上日期，各签一个收，压在两块砖下。工头拿起修订的那一套，对着窗口的光看了一阵，折了两道，揣进上衣口袋。他走出工棚，朝崖上喊了一声，让人把木桩搬过来。'
              else: '9 月 19 日，工棚的长桌上摊着两套图，抬头一模一样，尺寸却对不上；包工人拿着旧图报的价，比预料的高出一截。{staff}手巧心细，一张张比着看，把旧图和修订图分开，在每张的折角底下用铅笔写上日期，各签一个收，压在两块砖下。工头拿起修订的那一套，对着窗口的光看了一阵，折了两道，揣进上衣口袋。他走出工棚，朝崖上喊了一声，让人把木桩搬过来。'
            p2:
              class_lettered: '9 月底，怀特事务所又寄来一份报价，楼和塔的工钱合在一栏里。{staff}管过文书，把通信里已经说定的实验楼工程一项项抄出来，另起一页，塔身那几项还等着重新估价，单列在后面一页，两页一起寄回去请怀特过目。回信来时，工头把两页账分别钉在工棚的两面墙上。他站在中间看了看，在实验楼那一页的底下画了一道线。'
              class_craft: '9 月底，怀特事务所又寄来一份报价，楼和塔的工钱合在一栏里。{staff}干过手艺活，知道砌楼和搭塔用的不是同一拨人，把已经说定的实验楼工程一项项挑出来，另起一页，塔身那几项还等着重新估价，单列在后面一页，两页一起寄回去请怀特过目。回信来时，工头把两页账分别钉在工棚的两面墙上。他站在中间看了看，在实验楼那一页的底下画了一道线。'
              else: '9 月底，怀特事务所又寄来一份报价，楼和塔的工钱合在一栏里。{staff}眼尖，看出这一栏里混着两样活，把已经说定的实验楼工程一项项挑出来，另起一页，塔身那几项还等着重新估价，单列在后面一页，两页一起寄回去请怀特过目。回信来时，工头把两页账分别钉在工棚的两面墙上。他站在中间看了看，在实验楼那一页的底下画了一道线。'
            p3:
              class_lettered: '11 月初，砖楼的墙一天天高起来，塔基那边还是一片挖开的沙土。特斯拉从纽约来到工地，在工棚里翻那两页账。{staff}管过文书，把已经确认的工价按月排成一张表，请他照着这张表向出资人提分段拨款，下一段基础工程单立一份付款约定。特斯拉拿笔在表上改了两个数，把它折好，放进写给摩根的信封里。他走出工棚，海湾上的风把他的帽檐吹得往上一掀。'
              class_craft: '11 月初，砖楼的墙一天天高起来，塔基那边还是一片挖开的沙土。特斯拉从纽约来到工地，在工棚里翻那两页账。{staff}干过手艺活，知道一段工程从挖到砌要花几个月、几个人，把已经确认的工价按工序排成一张表，请他照着这张表向出资人提分段拨款，下一段基础工程单立一份付款约定。特斯拉拿笔在表上改了两个数，把它折好，放进写给摩根的信封里。他走出工棚，海湾上的风把他的帽檐吹得往上一掀。'
              else: '11 月初，砖楼的墙一天天高起来，塔基那边还是一片挖开的沙土。特斯拉从纽约来到工地，在工棚里翻那两页账。{staff}有条理，也说得动人，把已经确认的工价一笔笔讲给他听，排成一张表，请他照着这张表向出资人提分段拨款，下一段基础工程单立一份付款约定。特斯拉拿笔在表上改了两个数，把它折好，放进写给摩根的信封里。他走出工棚，海湾上的风把他的帽檐吹得往上一掀。'
          excerpts:
            p3: '特斯拉拿笔在表上改了两个数，把它折好，放进写给摩根的信封里。他走出工棚，海湾上的风把他的帽檐吹得往上一掀。'
            p2: '回信来时，工头把两页账分别钉在工棚的两面墙上。他站在中间看了看，在实验楼那一页的底下画了一道线。'
            p1: '工头拿起修订的那一套，对着窗口的光看了一阵，折了两道，揣进上衣口袋。他走出工棚，朝崖上喊了一声，让人把木桩搬过来。'
        relic: '一份图纸副本'
        relic_desc: '一张沃登克里弗图纸的副本，折了两道，折角底下有铅笔写的日期。'
        points:
          p1: '九月收到超支估价后，在沃登克里弗把旧图及修订图分别签收，护住当年仍能开工的建筑'
          p2: '请怀特把已能确定的实验楼工程和仍待换报价的塔身分开给工头，两套账各有一页'
          p3: '请特斯拉带已经确认的工价向出资人提出分段拨款，让未来几个月的基础工程有独立的付款约定'
        points_fail:
          p1: '包工人只按旧图估价，没人能确定接受哪套尺寸，工地取消本季安排，事务所因同步失败召回员工。'
          p2: '一份报价把楼与塔的工钱都合在一栏，后来无法据账看出哪部分已经承诺。'
          p3: '两部分仍等同一轮筹款。后续遇到缺口时，工人不知道哪些工作能拿到钱。'
        shift:
          p1:
            was: '1901 年特斯拉与建筑师斯坦福·怀特讨论估价和设计。沃登克里弗在当年动工。'
          p2:
            was: '沃登克里弗包括实验楼和塔，在改预算的通信里能看到多次设计修改。'
            now: '工头在开工前就能把两部分各自结算，塔的改价也有前一轮可对照。'
          p3:
            was: '工程最初得到摩根资助，之后未能取得足够的后续资金，计划未按设想完成。'
            now: '书面约定先付清已确认的一段基础工程。往后资金不够时，工地能结清这部分，并把尚无款项的工作标出来。'
            who: tesla_wardenclyffe
            bio: '特斯拉把沃登克里弗设想为无线通信和输电系统的一环。建设过程还要面对各轮报价、筹款和施工安排。'
        vignettes:
          timber: '十月初，{staff}帮一个车夫把一车木板拉上通往工地的沙路，轮子每陷一回，就拿肩膀顶一回后挡板，新锯的木板一路冒着松脂味。车夫说路那头的农户已经拿这边的锤子声给母鸡定钟点了，工地歇工那几天，鸡下蛋下得最勤。'
          signal: '十二月中旬，一个男孩靴子上全是泥，挥着报纸从车站跑上来：马可尼收到了大洋那边发来的信号。工头把报纸举得老远，问{staff}一个点真能跑那么远吗。{staff}说能。工头把报纸折好塞进外套，叫工人接着敲。'
          watch: '十二月下旬，{staff}陪守夜人在崖上的木板棚里坐了一夜，把旧报纸往墙缝里塞，挡海湾吹来的风，炉子里的煤块烧得通红。守夜人从一张报纸上念出煤价，说塔盖这么高，最好值得这么漏风。'
text:
  en:
    name: Nikola Tesla
    text: Serbian American inventor, 1856 to 1943. He developed alternating current systems and the induction motor. In 1901 he began a large tower at Wardenclyffe on Long Island for wireless transmission, and the project ran out of funds.
  zh:
    name: 尼古拉·特斯拉
    text: 塞尔维亚裔美国发明家，1856 年生，1943 年去世。他发展了交流电系统和感应电动机。1901 年他在长岛沃登克里弗开始建造一座用于无线传输的大塔，项目后来因资金耗尽而中止。
hook: {en: 'Two drawings, the same heading', zh: '两张图，抬头一模一样'}
facts:
  morgan:
    date: '1901-03'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_wiki, tesla_wardenclyffe_society]
    text:
      en: 'In March 1901 J. Pierpont Morgan signed a contract with Tesla to provide 150,000 dollars for a wireless station on Long Island.'
      zh: '1901 年 3 月，J.P. 摩根与特斯拉签约，出资十五万美元在长岛建一座无线电站。'
    line:
      en: 'March 1901: Morgan agrees to put 150,000 dollars into a wireless station for Tesla.'
      zh: '1901 年 3 月，摩根答应出资十五万美元，给特斯拉建一座无线电站。'
      zh-Hant: '1901 年 3 月，摩根答應出資十五萬美元，給特斯拉建一座無線電站。'
      fr: 'Mars 1901 : Morgan accepte d''investir 150 000 dollars dans une station sans fil pour Tesla.'
      es: 'Marzo de 1901: Morgan acepta invertir 150.000 dólares en una estación inalámbrica para Tesla.'
      ja: '1901年3月: モーガンはテスラの無線局に15万ドルを投じることに同意した。'
      ko: '1901년 3월: Morgan은 Tesla의 무선 스테이션에 150,000달러를 투자하는 데 동의합니다.'
      ru: 'Март 1901 года: Морган соглашается вложить 150 000 долларов в беспроводную станцию для Теслы.'
  white:
    date: '1901-09-13'
    stay_day: 6
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_white, tesla_wardenclyffe_white_quotes]
    text:
      en: 'Tesla wrote to Stanford White from New York on 13 September 1901 after receiving the contractor estimates White had sent him.'
      zh: '1901 年 9 月 13 日，特斯拉收到斯坦福·怀特寄来的工程报价后，从纽约写信回复。'
    line:
      en: '13 September 1901: Tesla writes back to Stanford White about the unexpectedly high bids.'
      zh: '1901 年 9 月 13 日，工程报价高出预料，特斯拉给斯坦福·怀特回信。'
      zh-Hant: '1901 年 9 月 13 日，工程報價高出預料，特斯拉給斯坦福·懷特回信。'
      fr: '13 septembre 1901 : Tesla répond à Stanford White au sujet des offres étonnamment élevées.'
      es: '13 de septiembre de 1901: Tesla responde a Stanford White sobre las ofertas inesperadamente altas.'
      ja: '1901年9月13日: テスラは予想外の高額な入札についてスタンフォード・ホワイトに返信した。'
      ko: '1901년 9월 13일: Tesla는 예기치 않게 높은 입찰가에 대해 Stanford White에게 답장을 보냅니다.'
      ru: '13 сентября 1901 г.: Тесла пишет в Стэнфорд Уайт ответ о неожиданно высоких ставках.'
  building:
    date: '1901-09'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_wiki, tesla_wardenclyffe_site_history]
    text:
      en: 'Construction of the Wardenclyffe laboratory and tower began in 1901; Wikipedia gives September.'
      zh: '沃登克里弗的实验楼和塔在 1901 年动工，维基百科写 9 月。'
    line:
      en: 'September 1901: building begins at Wardenclyffe.'
      zh: '1901 年 9 月，沃登克里弗工地动工。'
      zh-Hant: '1901 年 9 月，沃登克里弗工地動工。'
      fr: 'Septembre 1901 : début des travaux à Wardenclyffe.'
      es: 'Septiembre de 1901: comienza la construcción en Wardenclyffe.'
      ja: '1901 年 9 月: ウォーデンクリフで建設が始まる。'
      ko: '1901년 9월: Wardenclyffe에서 건축이 시작됩니다.'
      ru: 'Сентябрь 1901 года: начало строительства в Уорденклиффе.'
  marconi:
    date: '1901-12-12'
    stay_day: 96
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_marconi_parks_canada, tesla_marconi_ethw]
    text:
      en: 'On 12 December 1901 Guglielmo Marconi, at Signal Hill in St. John''s, Newfoundland, received the Morse letter S sent by wireless from Poldhu in Cornwall.'
      zh: '1901 年 12 月 12 日，古列尔莫·马可尼在纽芬兰圣约翰斯的信号山，收到从英国康沃尔的波尔杜无线发出的摩尔斯字母 S。'
    line:
      en: '12 December 1901: at Signal Hill in Newfoundland, Marconi hears the letter S sent from Cornwall.'
      zh: '1901 年 12 月 12 日，马可尼在纽芬兰的信号山收到从康沃尔发来的字母 S。'
      zh-Hant: '1901 年 12 月 12 日，馬可尼在紐芬蘭的信號山收到從康沃爾發來的字母 S。'
      fr: '12 décembre 1901 : à Signal Hill à Terre-Neuve, Marconi entend la lettre S envoyée de Cornwall.'
      es: '12 de diciembre de 1901: en Signal Hill, Terranova, Marconi escucha la carta S enviada desde Cornualles.'
      ja: '1901年12月12日：ニューファンドランド島のシグナル・ヒルで、マルコーニはコーンウォールから送られてきたモールス符号のSを受信する。'
      ko: '1901년 12월 12일: 뉴펀들랜드의 시그널 힐에서 마르코니는 콘월에서 보낸 편지 S를 듣습니다.'
      ru: '12 декабря 1901 года: на Сигнал-Хилл в Ньюфаундленде Маркони слышит письмо S, отправленное из Корнуолла.'
  laboratory:
    date: '1902-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_wiki, tesla_wardenclyffe_nps_lab]
    text:
      en: 'In June 1902 Tesla began moving his laboratory work into the brick building at Wardenclyffe, where he worked until 1906.'
      zh: '1902 年 6 月，特斯拉开始把实验室搬进沃登克里弗的砖楼，在那里一直工作到 1906 年。'
    line:
      en: 'June 1902: Tesla moves his laboratory into the brick building at Wardenclyffe.'
      zh: '1902 年 6 月，特斯拉把实验室搬进沃登克里弗的砖楼。'
      zh-Hant: '1902 年 6 月，特斯拉把實驗室搬進沃登克里弗的磚樓。'
      fr: 'Juin 1902 : Tesla déménage son laboratoire dans le bâtiment en brique de Wardenclyffe.'
      es: 'Junio de 1902: Tesla traslada su laboratorio al edificio de ladrillo de Wardenclyffe.'
      ja: '1902 年 6 月: テスラは自分の研究室をウォーデンクリフのレンガ造りの建物に移転します。'
      ko: '1902년 6월: Tesla는 자신의 실험실을 Wardenclyffe의 벽돌 건물로 이전합니다.'
      ru: 'Июнь 1902 года: Тесла переносит свою лабораторию в кирпичное здание в Уорденклифе.'
  no_more:
    date: '1903-07'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_wiki, tesla_wardenclyffe_society]
    text:
      en: 'In July 1903, after letters from Tesla asking for help, Morgan replied that he did not feel disposed at present to make any further advances; by then the backing of the project was coming to an end.'
      zh: '1903 年 7 月，特斯拉几次写信求助之后，摩根回信说眼下不打算再追加款项；工程的资金到这时已经难以为继。'
    line:
      en: 'July 1903: Morgan writes that he will make no further advances.'
      zh: '1903 年 7 月，摩根回信说不再追加款项。'
      zh-Hant: '1903 年 7 月，摩根回信說不再追加款項。'
      fr: 'Juillet 1903 : Morgan écrit qu''il ne fera plus aucune avancée.'
      es: 'Julio de 1903: Morgan escribe que no hará más avances.'
      ja: '1903年7月: モーガンはこれ以上の資金は出さないと書く。'
      ko: '1903년 7월: Morgan은 더 이상 진전을 이루지 않을 것이라고 썼습니다.'
      ru: 'Июль 1903 г.: Морган пишет, что не будет предпринимать дальнейших шагов.'
  demolished:
    date: '1917-07-04'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [tesla_wardenclyffe_wiki, tesla_wardenclyffe_society]
    text:
      en: 'On 4 July 1917 the Smiley Steel Company began blowing up the Wardenclyffe tower; the work went on into September.'
      zh: '1917 年 7 月 4 日，斯迈利钢铁公司开始炸毁沃登克里弗的塔，一直拆到 9 月。'
    line:
      en: '4 July 1917: demolition of the Wardenclyffe tower begins.'
      zh: '1917 年 7 月 4 日，沃登克里弗塔开始拆除。'
      zh-Hant: '1917 年 7 月 4 日，沃登克里弗塔開始拆除。'
      fr: '4 juillet 1917 : début de la démolition de la tour Wardenclyffe.'
      es: '4 de julio de 1917: comienza la demolición de la torre Wardenclyffe.'
      ja: '1917 年 7 月 4 日: ウォーデンクリフ タワーの取り壊しが始まる。'
      ko: '1917년 7월 4일: Wardenclyffe 타워의 철거가 시작됩니다.'
      ru: '4 июля 1917 года: начинается снос башни Уорденклиф.'
  site:
    date: '1902'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [tesla_wardenclyffe_site]
    text:
      en: 'The laboratory and tower site survive. The Register account describes the proposed wireless delivery of power and communications and lists the use of the laboratory from 1902 to 1906.'
      zh: '实验室与塔址尚存。遗址资料记载拟议中的无线供能和通信系统，也列出实验室在1902至1906年间的使用。'
