        who: 'Nikola Tesla'
        quote: 'J’étais capable de manipuler mes instruments rapidement et j’étais préparé.'
        occasion: 'Article de Electrical World et Engineer sur la transmission sans fil, rappelant les expériences du Colorado qui ont précédé Wardenclyffe'
      es:
        who: 'Nikola Tesla'
