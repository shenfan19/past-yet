    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 12, req: {"any":[{"job":["archivist","carpenter"]},{"trait":["handy","methodical"],"stat":{"will":6}}]}}
        - {id: p2, kind: notice, day: 23, req: {"any":[{"job":["archivist","carpenter","proofreader"]},{"trait":["handy","methodical","curious"],"stat":{"wit":6}}]}}
        - {id: p3, kind: persuade, day: 55, req: {"any":[{"job":["archivist","carpenter"],"stat":{"wit":7,"will":7}},{"trait":["handy","methodical","scholarly"],"stat":{"wit":8,"will":7}}]}}
      vignettes:
        - {id: timber, traits: [handy, hardy, cheerful, streetwise], day: 30}
