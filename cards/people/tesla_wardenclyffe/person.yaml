        occasion: 'Electrical World and Engineer article on wireless transmission, recalling the Colorado experiments that preceded Wardenclyffe'
      zh:
        who: '尼古拉·特斯拉'
        quote: '我已能迅速操作仪器，也做好了准备。'
        occasion: '《电气世界与工程师》无线传输文章，回忆沃登克里弗之前的科罗拉多实验'
      zh-Hant:
        who: '尼古拉·特斯拉'
