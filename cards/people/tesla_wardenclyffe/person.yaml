    text:
      en:
        name: 'The line marked proposed'
        place: "Shoreham, Long Island"
        figure: "Nikola Tesla"
        story: 'Tesla’s 1901 correspondence with architect Stanford White concerns the Wardenclyffe buildings. The site was intended for a wireless system for communications and energy.'
        relic: 'A retained drawing copy'
        relic_desc: 'A fictional copy filed during the Wardenclyffe works.'
        points:
          p1: 'When the September bids come in high, register the original and revised drawings separately at Wardenclyffe so the work can still start that year'
          p2: 'Have White list the laboratory work already agreed apart from the tower work still awaiting bids and give the foreman a separate account for each'
          p3: 'Help Tesla propose staged payments using the confirmed costs, with its own commitment for the next stretch of foundation work'
        points_fail:
          p1: 'Contractors quote from obsolete drawings and nobody can confirm the dimensions. The work is called off for the season, and the office recalls the employee.'
          p2: 'One quote lumps the building and tower together. Later the crew cannot see which portion was already authorized.'
          p3: 'Both sets of work still depend on the same round of funding. When money runs short, the crew cannot tell which work will be paid for.'
        shift:
          p1:
            was: 'Tesla and Stanford White discussed bids and designs in 1901. Construction at Wardenclyffe began that year.'
          p2:
            was: 'Wardenclyffe included a laboratory building and a tower. Correspondence records changes to designs and budgets.'
            now: 'Before starting, the foreman can settle the two accounts separately. A new tower quote can be checked against the previous estimate.'
          p3:
            was: 'Morgan provided initial funding. Later funding fell short and the project did not proceed as originally intended.'
            now: 'A written agreement covers the confirmed stretch. When funds run short later, the site can settle that bill and clearly identify the work still unfunded.'
            who: tesla_wardenclyffe
            bio: 'Tesla envisioned Wardenclyffe as part of a wireless communication and power system. Turning it into a site also required bids, financing and building schedules.'
        vignettes:
          revision: 'The foreman has a page that says to use the latest drawing. Mabel lays two drawings on the desk; both bear the same heading. You find the pencilled date under a fold and send the newer copy to the yard. You mark the older one as superseded before anyone can collect it by mistake.'
          print: 'Joe has set a line saying power is being sent from the site. He needs a full line to keep the notice balanced. You give him a sentence about what the site is being built to test. He reads the notice aloud, once as it was and once as it will go out, and keeps the new line.'
          empty: 'You remember what will later remain of the tower. Mabel wants a place to file the result that nobody has brought from the yard. You make a folder for the proposed building and leave its results sleeve empty. You will not be there if the next shift brings anything to put in it.'
      zh:
        name: '那一行写着拟建'
        place: "长岛肖勒姆"
        figure: "尼古拉·特斯拉"
        story: '特斯拉1901年与建筑师斯坦福·怀特的通信涉及沃登克里弗的建筑工程。这个场地为计划中的无线通信与传能系统而建。'
        relic: '一份留底的图纸'
        relic_desc: '沃登克里弗工地图纸副本。'
        points:
          p1: '九月收到超支估价后，在沃登克里弗把旧图及修订图分别签收，护住当年仍能开工的建筑'
          p2: '请怀特把已能确定的实验楼工程和仍待换报价的塔身分开给工头，两套账各有一页'
          p3: '请特斯拉带已经确认的工价向出资人提出分段拨款，让未来几个月的基础工程有独立的付款约定'
        points_fail:
          p1: '包工人只按旧图估价，没人能确定接受哪套尺寸，工地取消本季安排，事务所因同步失败召回员工。'
          p2: '一份报价把楼与塔的工钱都合在一栏，后来无法据账看出哪部分已经承诺。'
          p3: '两部分仍等同一轮筹款。后续遇到缺口时，工人不知道哪些工作能拿到钱。'
        shift:
          p1:
            was: '1901 年特斯拉与建筑师斯坦福·怀特讨论估价和设计。沃登克里弗在当年动工。'
          p2:
            was: '沃登克里弗包括实验楼和塔，在改预算的通信里能看到多次设计修改。'
            now: '工头在开工前就能把两部分各自结算，塔的改价也有前一轮可对照。'
          p3:
            was: '工程最初得到摩根资助，之后未能取得足够的后续资金，计划未按设想完成。'
            now: '书面约定先付清已确认的一段基础工程。往后资金不够时，工地能结清这部分，并把尚无款项的工作标出来。'
            who: tesla_wardenclyffe
            bio: '特斯拉把沃登克里弗设想为无线通信和输电系统的一环。建设过程还要面对各轮报价、筹款和施工安排。'
        vignettes:
          revision: '工头那一页写着按新图施工。梅布尔在桌上摊开两份图，抬头一模一样。你掀开折角，找到铅笔写的日期，把较新的那张送去场上，并在旧图上标出作废，免得有人拿错。'
          print: '乔已经排了一行，说场地正在把电能送出去。他需要一整行来撑住版面。你给他一句话，写场地建起来准备试什么。他把原句和要印出的句子各念一遍，最后留下新的一行。'
          empty: '你记得后来塔会剩下什么。梅布尔想找个地方放试验结果，可场上还没人送来。你替拟建工程建了一册档，结果袋留空。下一班若真有人拿来东西，你已不在。'
text:
  en:
    name: Nikola Tesla
    text: Serbian American inventor, 1856 to 1943. He developed alternating current systems and the induction motor. In 1901 he began a large tower at Wardenclyffe on Long Island for wireless transmission, and the project ran out of funds.
  zh:
    name: 尼古拉·特斯拉
    text: 塞尔维亚裔美国发明家，1856 年生，1943 年去世。他发展了交流电系统和感应电动机。1901 年他在长岛沃登克里弗开始建造一座用于无线传输的大塔，项目后来因资金耗尽而中止。
hook: {en: 'One stamp will send a promise to print.', zh: '盖一下章，承诺就要付印。'}
