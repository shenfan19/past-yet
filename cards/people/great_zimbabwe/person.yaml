    tier: 2
    channels: {L: 3, H: 1}
    # finished: in the game with release.ready_only. No year is recorded for any wall, so the stay carries the century only.
    ready: true
    refs: [great_zimbabwe_passage, livescience_great_zimbabwe, worldatlas_great_zimbabwe, ancient_history_great_zimbabwe]
    scene:
      points:
        - {id: p1, kind: trust, day: 10, req: {"any":[{"trait":["hardy","cheerful","handy"]},{"job":["builder","carpenter"]},{"stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 60, req: {"any":[{"trait":["methodical","scholarly","curious"]},{"stat":{"wit":6}}]}}
        - {id: p3, kind: endure, day: 120, req: {"any":[{"trait":["hardy","patient","vigil"]},{"stat":{"will":6}}]}}
      vignettes:
        - {id: lines, traits: [methodical, scholarly], day: 65}
        - {id: width, traits: [hardy, curious], day: 90}
        - {id: pace, day: 30}
    text:
      en:
        name: 'The passage in the plan'
        place: Masvingo, Zimbabwe
        figure: The builders of Great Zimbabwe
        story: 'Great Zimbabwe was built by ancestors of the Shona people and flourished from the eleventh to the fifteenth century. Its Great Enclosure has a long curved wall of granite laid in regular courses and a narrow passage between two walls leading to a conical tower. In 1871 the German Karl Mauch reached the ruins. The country took the name Zimbabwe from the city in 1980, and the site was inscribed as a World Heritage site in 1986.'
        relic: 'A sketch of the passage'
        relic_desc: 'A work drawing that leaves the route blank between both walls.'
        points:
          p1: 'Be taken in by the wall builders, then sort stones of a size for the next course'
          p2: 'Walk the passage between the two walls and draw it with the way left blank'
          p3: 'In the dry season, carry water up from the valley to the builders on the hill'
        vignettes:
          lines: '{staff} draws the passage as two lines with the paper left white between them, so that a runner can follow the white and not the walls.'
          width: '{staff} follows the inner wall far enough to see where it stops, and stops the pencil there instead of carrying the line all the way round.'
          pace: '{staff} paces the length of one course and scratches the count on a flat stone at the foot of the wall.'
      zh:
        name: '图上两墙之间的路'
        place: 津巴布韦马斯温戈
        figure: 大津巴布韦的建造者
        story: '大津巴布韦由绍纳人的祖先建造，兴盛于十一世纪到十五世纪。大围场的弧形长墙用花岗岩逐层整齐垒起，两墙之间有一条狭道通向锥形塔。1871 年，德国人卡尔·毛赫来到这片遗址。1980 年，国家以这座城为名，定名津巴布韦；1986 年，遗址列入世界遗产。'
        relic: '一张两墙间的草图'
        relic_desc: '图上两段墙之间留白，标的是能走的狭道。'
        points:
          p1: '先让砌墙的工匠认下，再替他们挑出大小合用的石块'
          p2: '走一遍两墙之间的狭道，画成图，把路留成白'
          p3: '旱季里，从河谷把水挑上山，给砌墙的人'
        vignettes:
          lines: '{staff}把狭道画成两条线，中间留白，送信的人照着白处走，就不会去顺着墙走。'
          width: '{staff}沿内墙走到它停下的地方，铅笔也停在那里，没有把线顺手绕满一圈。'
          pace: '{staff}用步子量了一层石的长度，把数目刻在墙脚一块平石上。'
text:
  en:
    name: The builders of Great Zimbabwe
    text: The builders of Great Zimbabwe, a stone city of the Shona speaking peoples that flourished from about the eleventh to the fifteenth century.
  zh:
    name: 大津巴布韦的建造者
    text: 大津巴布韦的建造者。这座石头城属于说绍纳语的族群，大约在十一世纪到十五世纪兴盛。
hook: {en: 'Why do two people count different walls?', zh: '两人数的到底是不是同一面墙？'}
facts:
  builders:
    date: '1100'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [livescience_great_zimbabwe, worldatlas_great_zimbabwe]
    text:
      en: 'Great Zimbabwe was built by ancestors of the Shona people. Building began in the eleventh century and went on for more than three centuries; the city flourished until the fifteenth.'
      zh: '大津巴布韦由绍纳人的祖先建造，十一世纪开始动工，延续三百多年，一直兴盛到十五世纪。'
    line:
      en: 'From the eleventh century, ancestors of the Shona build a city of stone on this hill. The building goes on for more than three hundred years.'
      zh: '从十一世纪起，绍纳人的祖先在这座山上用石头建城，一建就是三百多年。'
  passage:
    date: '1300'
    stay_day: 5
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [great_zimbabwe_passage]
    text:
      en: 'The site description documents the elliptical Great Enclosure, its regular courses of cut granite and a narrow passage leading to the conical tower.'
      zh: '遗产档案记有椭圆形大围场、整齐垒砌的花岗岩墙体和通往锥形塔的狭道。'
    line:
      en: 'The Great Enclosure stands in an oval of granite laid in even courses. Between two of its walls a narrow passage leads to a conical tower.'
      zh: '大围场是一圈椭圆的花岗岩墙，一层层垒得整齐。两道墙之间，一条狭道通向一座锥形塔。'
  mauch:
    date: '1871'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [livescience_great_zimbabwe, worldatlas_great_zimbabwe]
    text:
      en: 'The German explorer Karl Mauch reached the ruins in 1871.'
      zh: '1871 年，德国探险家卡尔·毛赫来到这片遗址。'
    line:
      en: '1871: the German Karl Mauch reaches the ruins.'
      zh: '1871 年，德国人卡尔·毛赫来到这片遗址。'
  name:
    date: '1980'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [livescience_great_zimbabwe, ancient_history_great_zimbabwe]
    text:
      en: 'In 1980 the country took the name Zimbabwe, the name the Shona had long given to the city.'
      zh: '1980 年，国家以绍纳人早就给这座城起的名字，定名为津巴布韦。'
    line:
      en: '1980: a new country takes its name from the city, Zimbabwe.'
      zh: '1980 年，一个新国家用这座城的名字命名自己：津巴布韦。'
  heritage:
    date: '1986'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ancient_history_great_zimbabwe, great_zimbabwe_passage]
    text:
      en: 'UNESCO inscribed Great Zimbabwe as a World Heritage site in 1986.'
      zh: '1986 年，联合国教科文组织把大津巴布韦列入世界遗产。'
    line:
      en: '1986: Great Zimbabwe is inscribed as a World Heritage site.'
      zh: '1986 年，大津巴布韦列入世界遗产。'
