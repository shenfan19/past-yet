    text:
      en:
        name: 'The earthen platform by the wall'
        place: 'Masvingo, Zimbabwe'
        figure: 'Workers in the Western Enclosure'
        story: 'In 1915, most of the moulded earthen platforms, benches and walls in the Western Enclosure at Great Zimbabwe were removed. The work was based on concerns that the earthen structures endangered the dry-stone walls. The exposed pit continued to erode afterwards.'
        story_prose:
          opening:
            - 'Great Zimbabwe, 1915. Earthen platforms and benches still stood at the foot of the dry-stone walls in the Western Enclosure. The clearing was marked to take those away as well.'
            - 'In history, most of the earthen structures were removed, and the exposed pit continued to erode. In this branch, someone can look at the join with the workers before they reach that part of the wall.'
            - 'This trip needs someone who understands what they are looking at in a wall and can explain it to the people doing the work. They will have to find a section worth leaving before the clearing starts.'
          points:
            p1: '{staff} checks the join with the workers and points out a stretch they can leave, then waits while they move the clearance line farther out. A worker drives a stake beyond the platform. An old finger mark in the earthen surface still meets the joint between two stones.'
          outcomes:
            all: 'Later, a surveyor crouches by the wall and lays a rule across the remaining platform. One edge rests on earth, and the other just touches stone.'
            p1: 'Later, a surveyor crouches by the wall and lays a rule across the remaining platform. One edge rests on earth, and the other just touches stone.'
          none: 'The workers carry an empty basket away. Earth still shows fresh at the pit, with a pale line where the platform met the wall.'
          not_admitted: '{staff} finds no place with the workers in the Western Enclosure. As a sketch is passed out, only a small corner shows at the foot of the wall.'
          excerpts:
            p1: 'A worker drives a stake beyond the platform. An old finger mark in the earthen surface still meets the joint between two stones.'
        relic: 'A sketch of a wall section'
        relic_desc: 'On the paper, an earthen platform rests against the foot of a dry-stone wall.'
        points:
          p1: 'Examine the foot of the wall with the local workers and get one section of the earthen platform left in place before the clearing'
        points_fail:
          p1: 'As in history, most of the earthen structures are cleared away. This section does not remain in place.'
        shift:
          p1:
            was: 'In 1915, many earthen platforms, benches and walls in the Western Enclosure were removed during clearing.'
            now: 'In this branch, a section of earthen platform remains in the Western Enclosure. Later surveyors can still see how it met the stone wall.'
        vignettes:
          lines: '{staff} follows the foot of the wall with their eyes. The edge of the platform dips only where it meets a joint.'
          width: '{staff} holds a worker’s drawing. The stone wall and the platform each have a line of their own.'
          pace: '{staff} sits by the step and taps dried mud off a shoe. The crumbs fall on the sandy ground.'
      zh:
        name: '墙脚留下的泥台'
        place: '津巴布韦马斯温戈'
        figure: '大津巴布韦西围区的工人'
        story: '1915 年，大津巴布韦山上西围区的塑土台、长凳和墙体大多被拆除。施工时，人们以为附着的泥土会危及干砌石墙。清理后留下的坑口又经年侵蚀。'
        story_prose:
          opening:
            - '1915 年，大津巴布韦。西围区的干砌石墙脚下，还有用泥土塑成的台和长凳。清理的人把它们也划进了要搬走的范围。'
            - '史实里，工人把这些土构大多拆去，露出的坑口后来继续受侵蚀。在这条分支里，有人能在轮到墙脚那一段之前，和工人一道把相接的地方看清楚。'
            - '这一趟用得上读得懂一堵墙、能跟在地做工的人说清楚的人。要留住的那一段，要在动工以前摸得准。'
          points:
            p1: '{staff}沿着墙脚和工人核过泥台与石墙相接的地方，指清能让开的一段，等他们把清理界线往外挪。工人把木桩钉在泥台外头。那截台面上，一道旧指痕还贴着石缝。'
          outcomes:
            all: '后来测绘的人蹲到墙脚，把尺横在还留着的泥台上。尺的一边搁在土面，一边轻轻碰到了石头。'
            p1: '后来测绘的人蹲到墙脚，把尺横在还留着的泥台上。尺的一边搁在土面，一边轻轻碰到了石头。'
          none: '工人从墙脚把空筐带走。坑边土色新鲜，原来接着石墙的地方只剩一道浅线。'
          not_admitted: '{staff}没能加入西围区的工人。草图从里头递出来，墙脚处只看得见一截纸角。'
          excerpts:
            p1: '工人把木桩钉在泥台外头。那截台面上，一道旧指痕还贴着石缝。'
        relic: '一张墙脚剖面草图'
        relic_desc: '纸上画着干砌石墙和紧贴墙脚的塑土台。'
        points:
          p1: '与西围区的工人核对墙脚，在清理前争取把一段塑土台留在原处'
        points_fail:
          p1: '照史实，塑土构件大多被清掉。这条分支里，原处没有留下这一段。'
        shift:
          p1:
            was: '1915 年，西围区的多处塑土台、长凳和墙体在清理中被拆除。'
            now: '这条分支里，西围区有一段塑土台留在原处。后来测绘的人还能看出它怎样贴着石墙。'
        vignettes:
          lines: '{staff}沿着墙脚看过去，泥台的边到了石缝才低下去。'
          width: '{staff}替工人拿着草图，图上石墙和泥台各有一条线。'
          pace: '{staff}坐到石阶边，把鞋上的干泥碰掉，泥屑落在脚下的砂土上。'
text:
  en:
    name: The builders of Great Zimbabwe
    text: The builders of Great Zimbabwe, a stone city of the Shona speaking peoples that flourished from about the eleventh to the fifteenth century.
  zh:
    name: 大津巴布韦的建造者
    text: 大津巴布韦的建造者。这座石头城属于说绍纳语的族群，大约在十一世纪到十五世纪兴盛。
hook: {en: 'What will be left at the foot of the wall?', zh: '石墙脚下还会剩什么'}
facts:
  builders:
    date: '1100'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [great_zimbabwe_passage, great_zimbabwe_met]
    text:
      en: 'Great Zimbabwe was built by ancestors of the Shona people. Building began in the eleventh century and went on for more than three centuries; the city flourished until the fifteenth.'
      zh: '大津巴布韦由绍纳人的祖先建造，十一世纪开始动工，延续三百多年，一直兴盛到十五世纪。'
    line:
      en: 'From the eleventh century, ancestors of the Shona build a city of stone on this hill. The building goes on for more than three hundred years.'
      zh: '从十一世纪起，绍纳人的祖先在这座山上用石头建城，一建就是三百多年。'
      zh-Hant: '從十一世紀起，紹納人的祖先在這座山上用石頭建城，一建就是三百多年。'
      fr: 'Dès le XIe siècle, les ancêtres des Shona bâtissent une ville de pierre sur cette colline. La construction dure plus de trois cents ans.'
      es: 'A partir del siglo XI, los antepasados de los Shona construyeron una ciudad de piedra en esta colina. La construcción dura más de trescientos años.'
      ja: '11 世紀以降、ショナ族の先祖がこの丘に石の都市を築きました。この建物は300年以上も存続します。'
      ko: '11세기부터 쇼나족의 조상들은 이 언덕에 돌로 된 도시를 건설했습니다. 건물은 300년 이상 지속됩니다.'
      ru: 'С одиннадцатого века предки шона строят на этом холме каменный город. Строительство продолжается уже более трехсот лет.'
  passage:
    date: '1300'
    stay_day: 5
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [great_zimbabwe_passage]
    text:
      en: 'The fourteenth-century Great Enclosure is elliptical, with even courses of cut granite and a narrow passage leading to the conical tower. The surviving walls do not document the day or order in which workers laid particular stones.'
      zh: '十四世纪的大围场呈椭圆形，花岗岩逐层整齐垒起，一条狭道通向锥形塔。现存的墙无法说明某块石头具体是哪天、按什么顺序垒上的。'
  mauch:
    date: '1871'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [great_zimbabwe_iccrom]
    text:
      en: 'The German explorer Karl Mauch reached the ruins in 1871.'
      zh: '1871 年，德国探险家卡尔·毛赫来到这片遗址。'
    line:
      en: '1871: the German Karl Mauch reaches the ruins.'
      zh: '1871 年，德国人卡尔·毛赫来到这片遗址。'
      zh-Hant: '1871 年，德國人卡爾·毛赫來到這片遺址。'
      fr: '1871 : l''Allemand Karl Mauch atteint les ruines.'
      es: '1871: el alemán Karl Mauch llega a las ruinas.'
      ja: '1871年：ドイツ人のカール・マウフが遺跡に到着。'
      ko: '1871년: 독일의 칼 마우흐(Karl Mauch)가 폐허에 도달했습니다.'
      ru: '1871 год: немец Карл Маух достигает руин.'
  western_yard_loss:
    date: '1915'
    stay_day: 26
    checked: 'official_record'
    level: 'usable'
    use:
      - 'story'
      - 'history'
      - 'wiki'
    sources:
      - 'great_zimbabwe_iccrom'
    text:
      en: 'In 1915, many earthen platforms, benches and walls in the Western Enclosure were removed during clearing.'
      zh: '1915 年，西围区的多处塑土台、长凳和墙体在清理中被拆除。'
    line:
      en: '1915: the crews remove most of the earthen platforms, benches and walls in the Western Enclosure.'
      zh: '1915 年，清理工人拆去了西围区大部分的塑土台、长凳和墙体。'
      zh-Hant: '1915 年，清理工人拆去了西圍區大部分的塑土臺、長凳和牆體。'
      fr: '1915 : les équipes retirent la plupart des plates-formes, bancs et murs en terre de l''enceinte ouest.'
      es: '1915: las cuadrillas retiran la mayoría de las plataformas, bancos y paredes de tierra del recinto occidental.'
      ja: '1915年: 乗組員は西側の囲いのほとんどの土製のプラットフォーム、ベンチ、壁を撤去しました。'
      ko: '1915: 승무원들이 서부 인클로저의 흙 플랫폼, 벤치 및 벽 대부분을 제거합니다.'
      ru: '1915 г.: бригады снимают большую часть земляных площадок, скамеек и стен Западного ограждения.'
  western_yard_erosion:
    date: '1915'
    checked: 'official_record'
    level: 'usable'
    use:
      - 'story'
      - 'wiki'
    sources:
      - 'great_zimbabwe_iccrom'
    text:
      en: 'The clearance left an open pit in the Western Enclosure. Ongoing erosion enlarged it in the following years.'
      zh: '清理后，西围区露出一个坑口，随后数年的侵蚀使它扩大。'
  name:
    date: '1980'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [great_zimbabwe_iccrom]
    text:
      en: 'In 1980 the country took the name Zimbabwe, the name the Shona had long given to the city.'
      zh: '1980 年，国家以绍纳人早就给这座城起的名字，定名为津巴布韦。'
    line:
      en: '1980: a new country takes its name from the city, Zimbabwe.'
      zh: '1980 年，一个新国家用这座城的名字命名自己：津巴布韦。'
      zh-Hant: '1980 年，一個新國家用這座城的名字命名自己：津巴布韋。'
      fr: '1980 : un nouveau pays tire son nom de la ville, le Zimbabwe.'
      es: '1980: un nuevo país toma su nombre de la ciudad, Zimbabwe.'
      ja: '1980年: 新しい国がジンバブエという都市にちなんで名づけられる。'
      ko: '1980년: 새로운 국가가 짐바브웨라는 도시에서 이름을 따왔습니다.'
      ru: '1980: новая страна получила свое название от города Зимбабве.'
  heritage:
    date: '1986'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [great_zimbabwe_passage]
    text:
      en: 'UNESCO inscribed Great Zimbabwe as a World Heritage site in 1986.'
      zh: '1986 年，联合国教科文组织把大津巴布韦列入世界遗产。'
    line:
      en: '1986: Great Zimbabwe is inscribed as a World Heritage site.'
      zh: '1986 年，大津巴布韦列入世界遗产。'
      zh-Hant: '1986 年，大津巴布韋列入世界遺產。'
      fr: "1986\_:\_Le Grand Zimbabwe est inscrit sur la liste du patrimoine mondial."
      es: '1986: El Gran Zimbabwe es inscrito como Patrimonio de la Humanidad.'
      ja: '1986年：グレートジンバブエが世界遺産に登録される。'
      ko: '1986년: 그레이트 짐바브웨가 세계문화유산으로 등재되었습니다.'
      ru: '1986: Великий Зимбабве внесен в список Всемирного наследия.'
bystanders:
  marker:
    invented: true
    text: {en: 'An invented worker preparing to clear the foot of the wall.', zh: '一位虚构的工人，正准备清理石墙脚。'}
  carrier:
    invented: true
    text: {en: 'An invented worker who holds the drawing beside the earthen platform.', zh: '一位虚构的工人，在塑土台旁扶着草图。'}
quotes:
  great_zimbabwe_stone_joints:
    order: 1
    tier: full
    contextual: true
    date: '1552'
    checked: two_sources
    sources: [great_zimbabwe_barros_usp, great_zimbabwe_barros_dialogos]
    original: pt
    text:
      pt:
        quote: 'pedras de maravilhosa grandeza, sem aparecer cal nas juntas dela'
      en:
        who: 'João de Barros'
        quote: 'Stones of remarkable size, with no lime visible in the joints.'
        occasion: 'Da Ásia, an early secondhand account of Symbaoé (game translation)'
      zh:
        who: '若昂·德·巴罗斯'
        quote: '石块大得惊人，接缝间却看不见石灰。'
        occasion: '《亚洲纪事》据商旅转述记录的辛巴奥埃石城（本游戏译）'
      zh-Hant:
        who: '若昂·德·巴羅斯'
        quote: '石塊大得驚人，接縫間卻看不見石灰。'
        occasion: '《亞洲紀事》據商旅轉述記錄的辛巴奧埃石城（本遊戲譯）'
      fr:
        who: 'João de Barros'
        quote: 'Pierres de taille remarquable, sans chaux visible dans les joints.'
        occasion: 'Da Ásia, un premier récit d''occasion de Symbaoé (traduction du jeu)'
      es:
        who: 'Juan de Barros'
        quote: 'Piedras de notable tamaño, sin cal visible en las juntas.'
        occasion: 'Da Ásia, uno de los primeros relatos de segunda mano de Symbaoé (traducción del juego)'
      ja:
        who: 'ジョアン・デ・バロス'
        quote: '顕著な大きさの石で、節目に石灰は見られません。'
        occasion: 'Da Ásia、Symbaoé の初期の中古アカウント (ゲーム翻訳)'
      ko:
        who: '주앙 드 바로스'
        quote: '놀라운 크기의 돌로, 접합 부분에 석회가 전혀 보이지 않습니다.'
        occasion: 'Symbaoé의 초기 중고 계정 Da Ásia(게임 번역)'
      ru:
        who: 'Жоау де Баррос'
        quote: 'Камни замечательного размера, в швах не видна известь.'
        occasion: 'Da Ásia, ранний подержанный отчет о Symbaoé (перевод игры)'
  great_zimbabwe_name_of_court:
    order: 2
    tier: none
    contextual: true
    date: '1552'
    checked: two_sources
    sources: [great_zimbabwe_barros_usp, great_zimbabwe_barros_dialogos]
    original: pt
    text:
      pt:
        quote: 'os da terra lhe chamam Symbaoé, que acerca deles quer dizer corte'
      en:
        who: 'João de Barros'
        quote: 'The people of the land call them Symbaoé, which to them means “court.”'
        occasion: 'Da Ásia, an early secondhand account of Symbaoé (game translation)'
      zh:
        who: '若昂·德·巴罗斯'
        quote: '当地人称这些建筑为辛巴奥埃，在他们的话里是“王廷”的意思。'
        occasion: '《亚洲纪事》据商旅转述记录的辛巴奥埃石城（本游戏译）'
      zh-Hant:
        who: '若昂·德·巴羅斯'
        quote: '當地人稱這些建築為辛巴奧埃，在他們的話裡是“王廷”的意思。'
        occasion: '《亞洲紀事》據商旅轉述記錄的辛巴奧埃石城（本遊戲譯）'
      fr:
        who: 'João de Barros'
        quote: 'Les gens du pays les appellent Symbaoé, ce qui signifie pour eux « tribunal ».'
        occasion: 'Da Ásia, un premier récit d''occasion de Symbaoé (traduction du jeu)'
      es:
        who: 'Juan de Barros'
        quote: 'La gente de la tierra los llama Symbaoé, que para ellos significa "corte".'
        occasion: 'Da Ásia, uno de los primeros relatos de segunda mano de Symbaoé (traducción del juego)'
      ja:
        who: 'ジョアン・デ・バロス'
        quote: '土地の人々は彼らを「シンバオエ」と呼びますが、これは彼らにとって「法廷」を意味します。'
        occasion: 'Da Ásia、Symbaoé の初期の中古アカウント (ゲーム翻訳)'
      ko:
        who: '주앙 드 바로스'
        quote: '그 땅 사람들은 그들을 Symbaoé라고 부르는데, 이는 그들에게 “법원”을 의미합니다.'
        occasion: 'Symbaoé의 초기 중고 계정 Da Ásia(게임 번역)'
      ru:
        who: 'Жоау де Баррос'
        quote: 'Местные жители называют их Симбаоэ, что для них означает «суд».'
        occasion: 'Da Ásia, ранний подержанный отчет о Symbaoé (перевод игры)'
