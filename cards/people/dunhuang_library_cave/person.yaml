events:
  dunhuang_library_cave:
    order: 193
    year: 1000
    lon: 94.8
    lat: 40.04
    region: asia
    field: literature
    tier: 2
    channels: {H: 3, C: 1}
    regret: true
    refs: [dunhuang_library_cave_objects, dunhuang_library_cave_colophon]
    scene:
      points:
        - {id: p1, kind: hold, req: {"job":["archivist","journalist"]}}
        - {id: p2, kind: notice, req: {"trait":["curious","skeptical","scholarly"]}}
        - {id: p3, kind: trust, redeem: true, req: {"any":[{"trait":["attached","artistic"]},{"job":["archivist"]}]}}
      vignettes:
        - {id: date, traits: [methodical, scholarly]}
        - {id: types, traits: [curious, artistic]}
        - {id: twine}
    text:
      en:
        name: 'A loose slip for two kinds of scroll'
        place: "Mogao Caves"
        figure: "Dunhuang monks"
        story: 'Mogao Cave 17 held manuscripts, printed works and paintings. One of the printed objects found there is the Diamond Sutra dated 868 in its colophon. The date marks the production of the scroll, and does not establish the reason or exact year the cave was closed. The bundling exercise is fictional.'
        relic: "A scroll"
        relic_desc: "A rolled sheet of paper with a sutra copied in a steady hand."
        points:
          p1: 'Give each practice bundle its own removable label'
          p2: 'Check the dated colophon before naming a year on the label'
          p3: 'Keep the copy of the label with the bundle during handover'
        vignettes:
          date: 'The bundle keeper puts the date on a slip marked ‘when put away’. You ask to see where the date actually appears. The year comes from a printed scroll’s closing line. He moves that number to the line for the object. There is still no date for the closing of the room.'
          types: 'You know that people will find both handwriting and printing in this cave. The keeper has called both practice rolls ‘copies’. You make him a pair of removable slips, one for each kind of mark. When you leave, the bundles are still waiting to be put away.'
          twine: 'You let the keeper finish tying the bundles and copy the slips on a spare sheet. The two copies identify different rolls. In your report there is a line for what you saw and a blank for why the room was closed.'
      zh:
        name: '两种卷子，一张夹签'
        place: "莫高窟"
        figure: "敦煌的僧人"
        story: '莫高窟第 17 窟藏有写本、印本和绘画。其中一件《金刚经》印本卷末有 868 年的题记。这个日期是卷子的制作纪年，不能据以确定封窟的原因或确切年份。卡里的理卷差事为虚构。'
        relic: "一卷卷轴"
        relic_desc: "一卷纸，上面用稳当的字抄着一部经。"
        points:
          p1: '给每捆练习卷各留一张可取下的签'
          p2: '在标签写年份前先核对卷末题记'
          p3: '交接时让纸签副本跟对卷子'
        vignettes:
          date: '理卷人把年份写到「何时收起」的格里。你请他指明日期出自哪里。那是印本卷尾的一行。他把年份挪到记录卷子的那一行。屋子何时闭上的，笔记里仍然没有。'
          types: '你知道以后有人会在这里找到手写的也找到印出来的。理卷人给两卷练习件都写「抄本」。你给两种字迹各做一张能取下的纸签。收队时，这两捆卷子还在等入窟。'
          twine: '你等理卷人扎好两捆，又把纸签抄到自己的纸上。两张签能认出不同的卷子。报告留了一行给你亲眼所见，至于窟为何被封，还有一处空白。'
text:
  en:
    name: Dunhuang monks
    text: The monks of the Mogao caves near Dunhuang, who sealed a small cave around the year 1000. It held tens of thousands of manuscripts in several languages, among them the Diamond Sutra of 868, and was reopened in 1900.
  zh:
    name: 敦煌的僧人
    text: 敦煌莫高窟的僧人，约在 1000 年前后封存了一个小石窟。里面有数万件多种文字的写本，包括 868 年的《金刚经》，1900 年被重新打开。
hook: {en: 'Can you tell printing from handwriting in a rolled bundle?', zh: '卷子一收，怎么认出是印的？'}
