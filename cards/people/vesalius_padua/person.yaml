    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"persuade","day":9,"req":{"any":[{"job":["restorer","proofreader","archivist","illustrator"],"stat":{"wit":6,"will":5}},{"trait":["methodical","scholarly","skeptical"],"stat":{"wit":7,"will":6}}]}}
    text:
      en:
        name: 'The two versions of the plate'
        place: 'Regensburg'
        figure: 'Andreas Vesalius'
        story: 'In a letter written at Regensburg in 1546, Vesalius criticised an edition that copied and reduced his illustrations. He objected to the distortions in some of the copied figures.'
        story_prose:
          opening:
            - 'Regensburg, June 1546. Vesalius is writing to a colleague about another book that copied his illustrations. He objects to the reduction in scale and questions the course of some of its lines.'
            - 'In history, his letter preserved those objections. Later comparison found that not every objection corresponded to a substantial difference. In this branch a bookseller still has a stack of copies to send out.'
            - 'Someone who can recognise the two editions can help. It will also take someone who can persuade the bookseller to put the same note into each copy before it goes.'
          points:
            p1: '{staff} lays out both editions on the counter, marking where a figure is simply smaller and where Vesalius raised a specific objection. The bookseller asks which claims can be made with confidence. They strike out what has not been checked, leaving page numbers a reader can look up. The bookseller opens the top copy and slips the note in next to the plate. When the book closes, a thin edge of white still shows.'
          outcomes:
            all: 'After the books go out, one reader borrows the other edition using the page numbers on the slip. Both figures lie on the table, with the same pen across them.'
            p1: 'After the books go out, one reader borrows the other edition using the page numbers on the slip. Both figures lie on the table, with the same pen across them.'
          none: 'The bookseller ties the last bundle. The half-written slip is still under the counter.'
          not_admitted: '{staff} never sees the bookseller. A sample lies open at a plate, turned briefly by a customer passing the counter.'
          excerpts:
            p1: 'The bookseller opens the top copy and slips the note in next to the plate. When the book closes, a thin edge of white still shows.'
        relic: 'A proof with two marks'
        relic_desc: 'An imagined print with separate marks for the two editions.'
        points:
          p1: 'Get the bookseller to include a note identifying the disputed plates with the copies still in stock'
        points_fail:
          p1: 'The employee did not reach an agreement with the distributor, and the copies went out without that sheet.'
        shift:
          p1:
            was: '13 June 1546: Vesalius wrote from Regensburg and criticised what he took to be distortions in the copied figures.'
            now: '{staff} gets the distributor to enclose a sheet identifying the disputed plates and pointing readers to the originals.'
            who: vesalius_padua
            bio: 'Readers of the copied edition received a note identifying the figures Vesalius disputed.'
      zh:
        name: '同一幅图的两个版本'
        place: '雷根斯堡'
        figure: '安德烈亚斯·维萨里'
        story: '维萨里在 1546 年从雷根斯堡写出一封信，批评一部缩小翻刻他插图的书。他认为有些图在翻刻后出现失真。'
        story_prose:
          opening:
            - '1546 年六月，维萨里在雷根斯堡写信。他谈到另一部翻刻过自己插图的书，反对其中的缩印，也质疑有些线条的走向。'
            - '史实里，这封信留下了他的批评。后人拿两版互相对照，发现并非所有疑处都有实质差异。在这条分支里，书商手上还压着一批未发出的书。'
            - '这趟需要能辨认不同版次的人，也需要有人能跟书商谈妥，给将要发出的每册书夹进同一张附页。'
          points:
            p1: '{staff}把两版摊在柜台上，逐处标明哪里只是印得小、哪里是维萨里提到的疑点。书商问有几处能写得肯定。两人把没核实的断语划掉，只留下读者可以翻回去看的页码。书商翻开最上面那本，把附页夹进图旁。再合上书时，纸边还露出一线白。'
          outcomes:
            all: '书发出去以后，有人按附页上的页码找另一版借看。两张图平放在桌上，中间压着同一支笔。'
            p1: '书发出去以后，有人按附页上的页码找另一版借看。两张图平放在桌上，中间压着同一支笔。'
          none: '书商捆好最后一摞书。那张只写了一半的附页还留在柜台下。'
          not_admitted: '{staff}没能见到掌柜。柜台上的样书已经翻到图页，只有买书的人过去翻了一下。'
          excerpts:
            p1: '书商翻开最上面那本，把附页夹进图旁。再合上书时，纸边还露出一线白。'
        relic: '两处有记号的校样'
        relic_desc: '分支里的校样，用两个记号辨认两种版次。'
        points:
          p1: '请书商给尚未发出的翻刻本夹一张附页，指出哪些图值得对照原版'
        points_fail:
          p1: '经销人没答应，手里的书仍没有附上那张勘误。'
        shift:
          p1:
            was: '1546 年 6 月 13 日，维萨里从雷根斯堡写信，质疑翻刻图出现失真。'
            now: '{staff}说服经销人附上勘误，列出受质疑的图版，供读者翻查原版。'
            who: vesalius_padua
            bio: '翻刻本的读者拿到了一张标明维萨里对哪些图有异议的附页。'
text:
  en:
    name: Andreas Vesalius
    text: Flemish anatomist, 1514 to 1564, who taught at Padua. His 1543 book On the Fabric of the Human Body, with detailed illustrations from his own dissections, corrected many of Galen's claims.
  zh:
    name: 维萨里
    text: 佛兰德解剖学家，1514 年生，1564 年去世，曾在帕多瓦任教。他 1543 年的《人体构造》配有取自亲自解剖的细致插图，纠正了盖伦的许多说法。
