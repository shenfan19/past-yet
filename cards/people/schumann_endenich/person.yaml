    text:
      en:
        name: 'The tune in another key'
        place: Endenich
        figure: Robert Schumann
        story: 'A copy of a short piano piece survives from Robert Schumann’s years in Endenich. He set it a whole tone lower than the published score. In July 1856, Clara Schumann came to Bonn and asked to see him. At the guesthouse, Lina has copied the tune twice. She thinks the lower one is a mistake.'
        relic: 'A practice score in two keys'
        relic_desc: 'A fictional pair of practice copies with a separate key marked on each.'
        points:
          p1: 'Compare the two copies and jot down why the one starting a tone lower also belongs in the folder'
          p2: 'Keep Clara’s visit on 27 July on schedule by meeting her before the appointed hour and showing her to the right door'
          p3: 'On 29 July, stay within call and bring Clara back to the bedside before Robert dies'
        points_fail:
          p1: 'Lina sets the lower version aside. The next person opening the folder will see only the version in the published key.'
          p2: 'Clara waits at the wrong door and misses the visiting hour. The office recalls you when this visit falls out of the timeline.'
          p3: 'When Clara gets back to Endenich, Robert has already died.'
        shift:
          p1:
            was: 'Schumann’s autograph of Papillon No. 10 from the Endenich years transposes the piece from C major to B-flat major.'
            now: 'Lina keeps both practice copies together. At the top of each one she writes the key, so the next player knows that neither first note is a copying error.'
          p2:
            was: 'On 23 July, Brahms and Dr Richarz urged Clara to wait. She visited Robert on 27 July between six and seven in the evening.'
          p3:
            was: 'On 29 July Clara returned to Endenich with Brahms and Joseph Joachim after Robert had died.'
            now: '{staff} meets Clara on her way back and brings her straight to the room. She takes Robert’s hand before he dies.'
            who: schumann_endenich
            bio: 'At Endenich, Clara was beside Robert when he died on 29 July 1856.'
        vignettes:
          key: 'Lina starts from the first note in each copy. Before she reaches the end of the second bar she looks up at {staff}. She knows what comes next, even though her fingers are somewhere else on the keyboard.'
          envelope: 'Emil has promised to take a folded note out to Clara if she is made to wait again. He asks {staff} which door to try first. They cross to the side of the lane where he can see both.'
          gift: 'The real manuscript will eventually go to Schumann’s daughter Marie. Here at the guesthouse, Lina leaves two paper slips to mark the starts of her practice copies. When {staff} lifts the lid, one slip has slipped behind the other.'
      zh:
        name: '换了调的曲子'
        place: 恩德尼希
        figure: 罗伯特·舒曼
        story: '罗伯特·舒曼住在恩德尼希的那几年，留下过一份钢琴小曲的抄本，比出版的谱低了一个全音。1856 年 7 月，克拉拉·舒曼来波恩请求探视。客店里的莉娜把那首小曲抄了两份，怀疑起音低的那份抄错了。'
        relic: '两个调的练习谱'
        relic_desc: '两张虚构的练习谱，页首各写了一个调名。'
        points:
          p1: '对照两份谱，写明为什么起音低了一个全音的那份也该留在谱夹里'
          p2: '7 月 27 日在约定的时间前接到克拉拉，领她走对门，让探视如期发生'
          p3: '7 月 29 日留在附近等消息，赶在罗伯特去世前把克拉拉带回床边'
        points_fail:
          p1: '莉娜把起音较低的那份谱抽了出来。下一个翻开谱夹的人，只会看到原来出版的调。'
          p2: '克拉拉在另一扇门前等过了探视时段。这次探视偏离原时间线，事务所召回员工。'
          p3: '克拉拉回到恩德尼希时，罗伯特已经去世。'
        shift:
          p1:
            was: '舒曼在恩德尼希期间亲笔抄写的《蝴蝶》第十首，把曲子从 C 大调移到了降 B 大调。'
            now: '莉娜把两份练习谱留在同一个谱夹里，页首各写上调名。下一个弹它的人知道，两个起音都没抄错。'
          p2:
            was: '7 月 23 日，布拉姆斯和里夏茨医生劝克拉拉再等一等。她在 27 日傍晚六到七点之间见到了罗伯特。'
          p3:
            was: '7 月 29 日，克拉拉和布拉姆斯、约阿希姆到恩德尼希时，罗伯特已经去世。'
            now: '{staff}在克拉拉回来的路上接到她，直接带她去了病房。罗伯特走之前，她握到了他的手。'
            who: schumann_endenich
            bio: '1856 年 7 月 29 日，罗伯特在恩德尼希去世时，克拉拉就在身旁。'
        vignettes:
          key: '莉娜照着两张纸各弹一遍。第二小节还没完，她就从键盘上抬头看{staff}。手指明明停在另一个地方，她却知道接下来会响起哪几个音。'
          envelope: '埃米尔答应，如果克拉拉还得等，他就替她递张折好的纸条。他问{staff}该先敲哪扇门。两人走到巷子对边，从那里刚好能看见两扇门。'
          gift: '真正的手稿日后会交到舒曼的女儿玛丽手里。眼下，莉娜用两根纸条标记练习谱的开头。{staff}掀起琴盖时，其中一根已经滑到另一根的背后。'
text:
  en:
    name: Robert Schumann
    text: 'German composer and music writer (1810–1856). His works include Papillons, Album for the Young and the Spring Symphony. He spent his last years at a private clinic in Endenich near Bonn. His wife Clara Schumann was a concert pianist and composer.'
  zh:
    name: 罗伯特·舒曼
    text: '德国作曲家、音乐评论家（1810–1856），作品有《蝴蝶》《少年曲集》和《春天交响曲》。他晚年住在波恩附近恩德尼希的私人疗养院。克拉拉·舒曼是钢琴演奏家、作曲家，也是他的妻子。'
hook: {en: 'Who moved the first note?', zh: '谁把第一个音挪了个地方？'}
