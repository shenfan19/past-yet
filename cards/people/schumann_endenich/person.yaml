    text:
      en:
        name: 'The tune in another key'
        place: Endenich
        figure: Robert Schumann
        story: 'A copy of a short piano piece survives from Robert Schumann’s years in Endenich. He set it a whole tone lower than the published score. In July 1856, Clara Schumann came to Bonn and asked to see him. At the guesthouse, Lina has copied the tune twice. She thinks the lower one is a mistake.'
        story_prose:
          opening:
            - 'Endenich, outside Bonn, July 1856. Robert Schumann is staying here in poor health. He once copied out one of the pieces from Papillons a whole tone lower. This month Clara Schumann comes to ask to see him.'
            - 'In history, Clara saw him on 27 July. When she came back on the 29th, she was too late. In this branch, Lina at the inn has made two copies with different first notes, and Emil knows the two doors in the lane.'
            - 'This trip needs someone who can recognise the same tune in two scores. It also needs someone who knows the way, keeps an appointment and can wait nearby for word.'
          points:
            p1: '{staff} read through both scores and marked how the starting note moved down while the intervals stayed the same. Lina wrote a key at the top of each page. She slipped the two copies into the folder side by side, leaving a narrow white edge in view.'
            p2: 'On 27 July, {staff} met Clara as arranged and crossed the lane to the door where she was expected. When it opened, Clara put away the folded note in her hand. A slant of evening light still lay outside the door.'
            p3: 'On the 29th, {staff} waited nearby for word, met Clara on her way back and took her straight to the bedside. She sat and reached beneath the edge of the blanket. Robert’s hand lay still in her palm.'
          outcomes:
            all: 'Both copies stayed in one folder, each with its key written at the top. On the 29th, Clara reached the bedside. The door in the lane was still open, and in the room two hands were joined.'
            p3: 'On the 29th, Clara reached the bedside. When she rose later, the chair was still drawn right up against the bed.'
            p2: 'The visit on the 27th still took place at dusk. Light faded in the lane before the door slowly closed.'
            p1: 'Both practice copies stayed in one folder. On opening it again, there was a key written at the top of each sheet.'
          none: 'The folder closed with the lower practice copy left outside. A narrow slip still showed at its edge.'
          not_admitted: '{staff} found no one in the lane to make the introduction. Both doors were shut on the other side of the street.'
          desync: 'Clara waited at the other door until the visiting hour passed. When {staff} was recalled, the folded note still lay in a coat pocket.'
          excerpts:
            p3: 'She sat and reached beneath the edge of the blanket. Robert’s hand lay still in her palm.'
            p2: 'When it opened, Clara put away the folded note in her hand. A slant of evening light still lay outside the door.'
            p1: 'Lina wrote a key at the top of each page. She slipped the two copies into the folder side by side, leaving a narrow white edge in view.'
        relic: 'A practice score in two keys'
        relic_desc: 'A fictional pair of practice copies with a separate key marked on each.'
        points:
          p1: 'Compare the two copies and jot down why the one starting a tone lower also belongs in the folder'
          p2: 'Keep Clara’s visit on 27 July on schedule by meeting her before the appointed hour and showing her to the right door'
          p3: 'On 29 July, stay within call and bring Clara back to the bedside before Robert dies'
        points_fail:
          p1: 'Lina sets the lower version aside. The next person opening the folder will see only the version in the published key.'
          p2: 'Clara waits at the wrong door and misses the visiting hour. The office recalls you when this visit falls out of the timeline.'
          p3: 'When Clara gets back to Endenich, Robert has already died.'
        shift:
          p1:
            was: 'Schumann’s autograph of Papillon No. 10 from the Endenich years transposes the piece from C major to B-flat major.'
            now: 'Lina keeps both practice copies together. At the top of each one she writes the key, so the next player knows that neither first note is a copying error.'
          p2:
            was: 'On 23 July, Brahms and Dr Richarz urged Clara to wait. She visited Robert on 27 July between six and seven in the evening.'
          p3:
            was: 'On 29 July Clara returned to Endenich with Brahms and Joseph Joachim after Robert had died.'
            now: '{staff} meets Clara on her way back and brings her straight to the room. She takes Robert’s hand before he dies.'
            who: schumann_endenich
            bio: 'At Endenich, Clara was beside Robert when he died on 29 July 1856.'
        vignettes:
          key: 'Lina starts from the first note in each copy. Before she reaches the end of the second bar she looks up at {staff}. She knows what comes next, even though her fingers are somewhere else on the keyboard.'
          envelope: 'Emil has promised to take a folded note out to Clara if she is made to wait again. He asks {staff} which door to try first. They cross to the side of the lane where he can see both.'
          gift: 'The real manuscript will eventually go to Schumann’s daughter Marie. Here at the guesthouse, Lina leaves two paper slips to mark the starts of her practice copies. When {staff} lifts the lid, one slip has slipped behind the other.'
      zh:
        name: '换了调的曲子'
        place: 恩德尼希
        figure: 罗伯特·舒曼
        story: '罗伯特·舒曼住在恩德尼希的那几年，留下过一份钢琴小曲的抄本，比出版的谱低了一个全音。1856 年 7 月，克拉拉·舒曼来波恩请求探视。客店里的莉娜把那首小曲抄了两份，怀疑起音低的那份抄错了。'
        story_prose:
          opening:
            - '1856 年 7 月，波恩近郊的恩德尼希。罗伯特·舒曼住在这里养病，曾亲手把《蝴蝶》里的一首小曲移低一个全音。这个月，克拉拉·舒曼来请求探视。'
            - '史实里，克拉拉 7 月 27 日见到了他，29 日再来时已迟了一步。在这条分支里，客店的莉娜抄了两份起音不同的谱，埃米尔知道巷子里有两扇门。'
            - '这一趟用得上能从两份谱上认出同一首曲子的人。认得路、守得住约定时辰、能在附近等消息的人也有用处。'
          points:
            p1: '{staff}沿着两份谱各读一遍，标出起音虽移低，音和音之间的距离仍一样。莉娜在两个页首都写上调名。她把两张标着不同起音的纸并排夹好，露出上头的一线白边。'
            p2: '七月二十七日，{staff}按约先接到克拉拉，穿过巷子找到探视的那扇门。门开时，克拉拉先把手里折着的纸收了起来。门外还斜着一线傍晚的光。'
            p3: '二十九日，{staff}守在附近等到消息，在克拉拉回来的路上接到她，直接领到床边。她坐下，把手伸进被沿。罗伯特的手搭在她掌心，一动也没有挪开。'
          outcomes:
            all: '两份曲谱后来仍放在一个谱夹里，页首各有调名。二十九日，克拉拉赶到了床边。巷子里的门还敞着，屋里两只手握在一起。'
            p3: '二十九日，克拉拉赶到了床边。后来她起身时，椅子还紧贴着床沿。'
            p2: '二十七日的探视仍在傍晚。巷子里光线暗了，那扇门才慢慢合上。'
            p1: '两份练习谱后来还在一个谱夹里。再翻开来，两张纸的页首各有一个调名。'
          none: '谱夹合上，较低的那份练习谱被抽在外头。一根细纸条从夹口探出半寸。'
          not_admitted: '{staff}没能在巷子里找到接应的人。隔着街看过去，两扇门都关着。'
          desync: '克拉拉在另一扇门前等过了时辰。{staff}被召回时，折好的纸条还留在外衣口袋里。'
          excerpts:
            p3: '她坐下，把手伸进被沿。罗伯特的手搭在她掌心，一动也没有挪开。'
            p2: '门开时，克拉拉先把手里折着的纸收了起来。门外还斜着一线傍晚的光。'
            p1: '莉娜在两个页首都写上调名。她把两张标着不同起音的纸并排夹好，露出上头的一线白边。'
        relic: '两个调的练习谱'
        relic_desc: '两张虚构的练习谱，页首各写了一个调名。'
        points:
          p1: '对照两份谱，写明为什么起音低了一个全音的那份也该留在谱夹里'
          p2: '7 月 27 日在约定的时间前接到克拉拉，领她走对门，让探视如期发生'
          p3: '7 月 29 日留在附近等消息，赶在罗伯特去世前把克拉拉带回床边'
        points_fail:
          p1: '莉娜把起音较低的那份谱抽了出来。下一个翻开谱夹的人，只会看到原来出版的调。'
          p2: '克拉拉在另一扇门前等过了探视时段。这次探视偏离原时间线，事务所召回员工。'
          p3: '克拉拉回到恩德尼希时，罗伯特已经去世。'
        shift:
          p1:
            was: '舒曼在恩德尼希期间亲笔抄写的《蝴蝶》第十首，把曲子从 C 大调移到了降 B 大调。'
            now: '莉娜把两份练习谱留在同一个谱夹里，页首各写上调名。下一个弹它的人知道，两个起音都没抄错。'
          p2:
            was: '7 月 23 日，布拉姆斯和里夏茨医生劝克拉拉再等一等。她在 27 日傍晚六到七点之间见到了罗伯特。'
          p3:
            was: '7 月 29 日，克拉拉和布拉姆斯、约阿希姆到恩德尼希时，罗伯特已经去世。'
            now: '{staff}在克拉拉回来的路上接到她，直接带她去了病房。罗伯特走之前，她握到了他的手。'
            who: schumann_endenich
            bio: '1856 年 7 月 29 日，罗伯特在恩德尼希去世时，克拉拉就在身旁。'
        vignettes:
          key: '莉娜把两张纸各弹了一遍。第二小节还没完，她就抬头看{staff}，手在另一个位置，她却已经知道接下来是哪几个音。'
          envelope: '埃米尔答应替克拉拉递折好的纸条，问{staff}该敲哪扇门。两人走到巷子对面，并肩站在那里，刚好看得见两扇门。'
          gift: '真正的手稿后来会到舒曼的女儿玛丽手里。眼下，莉娜用两根纸条标出练习谱的开头。{staff}掀琴盖时，其中一根已滑到另一根背后。'
text:
  en:
    name: Robert Schumann
    text: 'German composer and music writer (1810–1856). His works include Papillons, Album for the Young and the Spring Symphony. He spent his last years at a private clinic in Endenich near Bonn. His wife Clara Schumann was a concert pianist and composer.'
  zh:
    name: 罗伯特·舒曼
    text: '德国作曲家、音乐评论家（1810–1856），作品有《蝴蝶》《少年曲集》和《春天交响曲》。他晚年住在波恩附近恩德尼希的私人疗养院。克拉拉·舒曼是钢琴演奏家、作曲家，也是他的妻子。'
hook: {en: 'Who moved the first note?', zh: '谁把第一个音挪了个地方？'}
