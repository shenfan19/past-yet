    text:
      en:
        name: 'The tune in another key'
        place: "Endenich"
        figure: "Robert Schumann"
        story: 'The Library of Congress dates a copy of Schumann’s Papillon no. 10 to his stay at Endenich, 1854–1856, and identifies it as a transposition from C to B-flat major.'
        relic: 'A labelled practice score'
        relic_desc: 'A fictional page marked for a comparison of keys.'
        points:
          p1: 'After Brahms sends news of Robert’s condition, get the doctor’s visiting time to Clara so she can make the visit of 27 July'
          p2: 'Talk the director of the asylum into letting Clara see Robert earlier in July, after she has twice been turned away'
          p3: 'On 29 July keep watch at his bed and call Clara back in time, so that she is with him when he dies'
        points_fail:
          p1: 'The visiting time is not passed to Clara. She arrives too late, and the office recalls the employee.'
          p2: 'Clara receives accounts of Robert’s condition and still has to wait until 27 July to see him.'
          p3: 'At four that afternoon he dies alone, and Clara sees him only half an hour later, as in history.'
        shift:
          p1:
            was: 'Clara visited Robert Schumann at Endenich on July 27, 1856. Robert died there on July 29.'
          p2:
            was: '27 July 1856: after nearly two and a half years at Endenich, and after being twice turned away, Clara saw Robert for the first time.'
            now: 'Clara was let in for a short visit in the third week of July and sat with him for a while. She came again as planned on 27 July.'
          p3:
            was: '29 July 1856: at four in the afternoon Robert Schumann died alone at Endenich; Clara saw him half an hour later.'
            now: '{staff} kept watch at the bed and called Clara back before the end. When he died she was beside him.'
            who: schumann_endenich
            bio: 'In this timeline Clara saw Robert earlier that July, and she was at his side when he died at Endenich.'
        vignettes:
          key: 'Lina thinks the first note was copied wrong. You ask her to start each version on its own note and play a few bars. She can hear the tune go the same way from a different pitch. Instead of rubbing either page out, she writes the key above each.'
          envelope: 'Emil has an envelope ready for only one page. You fold a wider wrapper so he can carry both without covering Lina’s headings. At the door he reads the two key names back to her. She can put the keyboard cover down without wondering which copy went away.'
          gift: 'You remember that a manuscript will eventually be given to Schumann’s daughter Marie. Lina has only the practice pages and wants to know which she should keep by the instrument. You help her put the keys on their sleeves. The history of the actual manuscript will continue beyond the room.'
      zh:
        name: '换了调的曲子'
        place: "恩德尼希"
        figure: "罗伯特·舒曼"
        story: '美国国会图书馆记载，舒曼在1854至1856年住在恩德尼希期间抄写过《蝴蝶》第10首，将它从C大调移到降B大调。'
        relic: '一页写明调号的练习谱'
        relic_desc: '练习谱，标明了对照用的调号。'
        points:
          p1: '布拉姆斯发出病况消息后，把医生同意的探视时段送到克拉拉手里，护住她 7 月 27 日的探视'
          p2: '劝动疗养院院长，让两次被挡在门外的克拉拉在七月里早些见到罗伯特'
          p3: '7 月 29 日守在他床边，及时把克拉拉叫回来，让他走的时候她在身旁'
        points_fail:
          p1: '医生给出的探视时段没有转到克拉拉手中。她赶到时已经错过，事务所因同步失败召回员工。'
          p2: '克拉拉只能收到病况转述，仍要等到 7 月 27 日才见得到他。'
          p3: '那天下午四点他独自去世，克拉拉半小时后才见到他，这条分支与历史一样。'
        shift:
          p1:
            was: '1856 年 7 月 27 日，克拉拉到恩德尼希见罗伯特·舒曼。罗伯特在 7 月 29 日去世。'
          p2:
            was: '1856 年 7 月 27 日，罗伯特在恩德尼希住了将近两年半，克拉拉两次被挡回之后，才第一次见到他。'
            now: '七月第三周，克拉拉获准进去短短见了他一面，在床边坐了一会儿。7 月 27 日她照原来的安排又去了一趟。'
          p3:
            was: '1856 年 7 月 29 日下午四点，罗伯特·舒曼在恩德尼希独自去世，克拉拉半小时后才见到他。'
            now: '{staff}守在床边，在最后那一刻之前把克拉拉叫了回来。他走的时候，她在身旁。'
            who: schumann_endenich
            bio: '这条时间线里，克拉拉在那年七月更早见到了罗伯特，他在恩德尼希去世时，她守在他身边。'
        vignettes:
          key: '莉娜以为起音抄错了。你请她照两份谱各自写的起音，弹几小节。她听出起音不同，旋律的走向却一样。两页都不必擦，她在各自上面标了调。'
          envelope: '埃米尔备好的信封只能放一页。你另折了张宽一点的包纸，他把两份都带走，莉娜的题头也不用折进去。到门口他把两个调名念给她听。她可以安心盖好琴盖了。'
          gift: '你记得一份手稿日后会交给舒曼的女儿玛丽。莉娜只有练习页，想知道琴边该留哪一张。你帮她把两个调名写上各自的纸套。真正的手稿后来怎样流传，你在这屋里看不到了。'
text:
  en:
    name: Robert Schumann
    text: German composer, 1810 to 1856. After a breakdown and an attempt to end his life in 1854 he entered a private asylum at Endenich near Bonn, where he died two years later. His wife Clara Schumann was a leading pianist and composer.
  zh:
    name: 罗伯特·舒曼
    text: 德国作曲家，1810 年生，1856 年去世。1854 年精神崩溃并试图自尽后，他住进波恩附近恩登尼希的私人疗养院，两年后在那里去世。他的妻子克拉拉·舒曼是著名的钢琴家与作曲家。
