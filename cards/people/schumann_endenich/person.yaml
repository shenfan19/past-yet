quotes:
  schumann_endenich_tone:
    order: 1
    tier: full
    date: '1850'
    checked: official_record
    sources: [schumann_rules]
    original: de
    text:
      de:
        who: 'Robert Schumann'
        quote: 'Bemühe dich frühzeitig, Tonart und Ton zu erkennen.'
        occasion: 'Aus den Musikalischen Haus- und Lebensregeln, 1850.'
      en:
        who: 'Robert Schumann'
        quote: 'Learn early to recognise key and pitch.'
        occasion: 'From Musical Rules for the Home and for Life, first published in 1850 (game translation).'
      zh:
        who: '罗伯特·舒曼'
        quote: '要及早学会辨认调性和音高。'
        occasion: '《音乐家训与生活准则》，1850 年首次刊行（游戏译文）。'
      zh-Hant:
        who: '羅伯特·舒曼'
        quote: '要及早學會辨認調性和音高。'
        occasion: '《音樂家訓與生活準則》，1850 年首次刊行（遊戲譯文）。'
      fr:
        who: 'Robert Schumann'
        quote: 'Apprenez tôt à reconnaître la tonalité et la hauteur.'
        occasion: 'Extrait de Règles musicales pour la maison et pour la vie, publié pour la première fois en 1850 (traduction du jeu).'
      es:
        who: 'Robert Schumann'
        quote: 'Aprenda temprano a reconocer la clave y el tono.'
        occasion: 'De Reglas musicales para el hogar y para la vida, publicado por primera vez en 1850 (traducción del juego).'
      ja:
        who: 'ロベルト・シューマン'
        quote: 'キーとピッチを認識することを早いうちに学びましょう。'
        occasion: '1850年に初版が出版された『家庭と人生のための音楽ルール』より（ゲーム翻訳）。'
      ko:
        who: '로베르트 슈만'
        quote: '키와 피치를 인식하는 방법을 일찍 배우십시오.'
        occasion: '1850년에 처음 출판된 가정과 생활을 위한 음악적 규칙(게임 번역)에서 발췌.'
      ru:
        who: 'Роберт Шуман'
        quote: 'Научитесь рано распознавать тональность и высоту звука.'
        occasion: 'Из «Музыкальных правил для дома и жизни», впервые опубликованных в 1850 году (перевод игры).'
  schumann_endenich_listening:
    order: 2
    tier: none
    date: '1850'
    checked: official_record
    sources: [schumann_rules]
    original: de
    text:
      de:
        who: 'Robert Schumann'
        quote: 'Wenn du spielst, kümmere dich nicht darum, wer dir zuhört.'
        occasion: 'Aus den Musikalischen Haus- und Lebensregeln, 1850.'
      en:
        who: 'Robert Schumann'
        quote: 'When you play, do not concern yourself with who is listening.'
        occasion: 'From Musical Rules for the Home and for Life, first published in 1850 (game translation).'
      zh:
        who: '罗伯特·舒曼'
        quote: '演奏时，不必管是谁在听。'
        occasion: '《音乐家训与生活准则》，1850 年首次刊行（游戏译文）。'
      zh-Hant:
        who: '羅伯特·舒曼'
        quote: '演奏時，不必管是誰在聽。'
        occasion: '《音樂家訓與生活準則》，1850 年首次刊行（遊戲譯文）。'
      fr:
        who: 'Robert Schumann'
        quote: 'Lorsque vous jouez, ne vous souciez pas de savoir qui écoute.'
        occasion: 'Extrait de Règles musicales pour la maison et pour la vie, publié pour la première fois en 1850 (traduction du jeu).'
      es:
        who: 'Robert Schumann'
        quote: 'Cuando juegues, no te preocupes por quién te escucha.'
        occasion: 'De Reglas musicales para el hogar y para la vida, publicado por primera vez en 1850 (traducción del juego).'
      ja:
        who: 'ロベルト・シューマン'
        quote: '演奏するときは、誰が聴いているかなど気にしないでください。'
        occasion: '1850年に初版が出版された『家庭と人生のための音楽ルール』より（ゲーム翻訳）。'
      ko:
        who: '로베르트 슈만'
        quote: '연주할 때 누가 듣고 있는지 신경쓰지 마세요.'
        occasion: '1850년에 처음 출판된 가정과 생활을 위한 음악적 규칙(게임 번역)에서 발췌.'
      ru:
        who: 'Роберт Шуман'
        quote: 'Когда вы играете, не беспокойтесь о том, кто вас слушает.'
        occasion: 'Из «Музыкальных правил для дома и жизни», впервые опубликованных в 1850 году (перевод игры).'
