events:
- vermeer_delft
text:
  en:
    name: Johannes Vermeer
    text: Dutch painter, 1632 to 1675, of Delft. He painted quiet interior scenes with soft light, such as Girl with a Pearl Earring, produced only some forty works that survive, and left his family in debt.
  zh:
    name: 约翰内斯·维米尔
    text: 荷兰画家，1632 年生，1675 年去世，代尔夫特人。他画光线柔和的静谧室内场景，如《戴珍珠耳环的少女》，留存的作品只有约四十件，去世时家人负债。
