    text:
      en:
        name: "The painter in debt"
        place: "Delft"
        figure: "Johannes Vermeer"
        story: 'After the war of 1672 Johannes Vermeer could hardly sell a painting, and in July 1675 he went to Amsterdam to borrow a thousand guilders. In December 1675, his widow later wrote, he went within a day and a half from healthy to dead; he was buried in Delft on 15 December, aged forty three, leaving eleven children. Early in 1676 Catharina Bolnes gave two of his paintings to the baker against a bread debt, and on 24 February she passed The Art of Painting to her mother Maria Thins. On 29 February the house was inventoried, and in April she asked the High Court to relieve her of the debts.'
        story_prose:
          opening:
            - 'The Oude Langendijk in Delft, early December 1675. The painter Johannes Vermeer, forty three, lives here with his wife Catharina Bolnes and eleven children. He paints quiet rooms in soft light, and only some forty of his paintings survive. Since the war of 1672 the art trade has collapsed: his own work hardly sells, and the paintings of other masters he bought to deal in are left on his hands. In July he went to Amsterdam to borrow a thousand guilders.'
            - 'In history, Catharina later wrote, under the weight of the children and the debts he went within a day and a half from healthy to dead, and he was buried on 15 December. Early the next year she gave two of his paintings to the baker against three years of bread, on 24 February passed The Art of Painting from his studio to her mother Maria Thins, and in April asked the High Court to relieve her of the debts. For nearly two centuries afterwards his name was all but forgotten. In this branch, a baker''s boy hands in bread unpaid and only makes a mark in his little book, there is a frame maker, and a woman sells peat on the market square.'
            - 'A few kinds of people can help on this trip: someone who has kept archives, dealt in antiques or restored paintings, someone who paints, reads proofs or translates and has a careful eye, or someone watchful or methodical with a strong will, to protect the large painting in the studio; someone who has traded and has some luck, or someone glib and at home in the streets, to sell the paintings left on his hands; someone who knows painting, or is sensitive or kind, to tell him what will become of his pictures; a doctor with a strong will, someone who knows medicine and carries the calm patch, or someone carrying the nano medical kit, to hold off that day and a half in mid December.'
          outcomes:
            all: 'That winter Vermeer did not go under. On a clear day in January he climbed the stairs to paint again; the large painting still hung on the studio wall, and a little bundle of money wrapped in cloth lay in the kitchen cupboard.'
            p4: 'That December passed and Vermeer did not go under. On a clear day in January he climbed the stairs again and moved the easel to the window.'
            p2: 'On 15 December Vermeer was buried in Delft, aged forty three. The money from the paintings sold that month Catharina kept wrapped in a cloth in the kitchen cupboard.'
            p3: 'On 15 December Vermeer was buried in Delft, aged forty three. The easel in the studio stood empty, and the palette lay to one side, the fresh blue on it dried.'
            p1: 'On 15 December Vermeer was buried in Delft, aged forty three, leaving eleven children. The next February Catharina passed the large painting from the studio to her mother.'
          none: 'On 15 December Vermeer was buried in Delft in a grave his mother-in-law had bought years before, aged forty three. For nearly two centuries afterwards few people knew his name.'
          desync: 'On 3 December the creditor''s man checked his list, nodded, and had the large painting by the wall taken down from its nail. When {staff} was recalled, two men were carrying it downstairs, and the blue of it flashed once at the turn of the stairs.'
          not_admitted: '{staff} never got into the house on the Oude Langendijk, and only stood a few mornings at the edge of the market square. The shutters of that house were always half closed, and a child leaned on the sill counting the bread baskets going by.'
          points:
            p1:
              trait_vigil: 'On the morning of 3 December a man sent by a creditor comes into the studio with a list, says some paintings must go against the debt before the year is out, and points at the large painting by the wall: a painter, his back to us, painting a woman in blue who holds a book and a trumpet. {staff}, watchful, sleeps two nights running on the stairs outside the studio, and by day goes through the man''s list line by line: what can go against the debt is the stock of other masters'' paintings from the shop, and this one is not on it. The man rolls up his list and leaves. Vermeer stands a while in front of the painting, then reaches out and wipes a film of dust from the bottom of the frame.'
              trait_methodical: 'On the morning of 3 December a man sent by a creditor comes into the studio with a list, says some paintings must go against the debt before the year is out, and points at the large painting by the wall: a painter, his back to us, painting a woman in blue who holds a book and a trumpet. {staff}, methodical, goes through the man''s list line by line and writes out a page on where each painting in the studio came from: what can go against the debt is the stock of other masters'' paintings from the shop, and this one is not on it. The man rolls up his list and leaves. Vermeer stands a while in front of the painting, then reaches out and wipes a film of dust from the bottom of the frame.'
              else: 'On the morning of 3 December a man sent by a creditor comes into the studio with a list, says some paintings must go against the debt before the year is out, and points at the large painting by the wall: a painter, his back to us, painting a woman in blue who holds a book and a trumpet. {staff}, used to paintings and deeds, goes through the man''s list line by line and shows that what can go against the debt is the stock of other masters'' paintings from the shop, and this one is not on it. The man rolls up his list and leaves. Vermeer stands a while in front of the painting, then reaches out and wipes a film of dust from the bottom of the frame.'
            p2:
              class_trade: 'The 6th of December is market day. Some paintings by other masters, wrapped in cloth, have stood behind the door of the shop for years. {staff}, who has traded, carries them one by one into the light of the window and talks with two dealers who have come to look from morning till noon, giving a little on the price and then not an inch more. In the afternoon three paintings, tied with twine, are carried out of the door on men''s shoulders. Catharina counts the money twice on the kitchen table, sets a small pile aside, wraps it in a cloth and puts it in her apron pocket.'
              else: 'The 6th of December is market day. Some paintings by other masters, wrapped in cloth, have stood behind the door of the shop for years. {staff}, glib, goes round the market and comes back with two dealers, carries the paintings one by one into the light of the window and talks with them from morning till noon. In the afternoon three paintings, tied with twine, are carried out of the door on men''s shoulders. Catharina counts the money twice on the kitchen table, sets a small pile aside, wraps it in a cloth and puts it in her apron pocket.'
            p3:
              trait_artistic: 'On the afternoon of 9 December the studio is very quiet. Vermeer sits at the easel, and for a long time the brush in his hand does not touch the canvas. {staff}, who has an eye for painting too, stands behind him a while and tells him that one day people will seek out these quiet rooms one by one, know them again, and hang them in many cities. Vermeer does not turn round. He picks up the palette, scrapes off a little blue that has dried on it with the knife, and bends to mix some fresh.'
              trait_sensitive: 'On the afternoon of 9 December the studio is very quiet. Vermeer sits at the easel, and for a long time the brush in his hand does not touch the canvas. {staff}, sensitive and seeing how tired he is, stands behind him a while and tells him that one day people will seek out these quiet rooms one by one, know them again, and hang them in many cities. Vermeer does not turn round. He picks up the palette, scrapes off a little blue that has dried on it with the knife, and bends to mix some fresh.'
              trait_kind: 'On the afternoon of 9 December the studio is very quiet. Vermeer sits at the easel, and for a long time the brush in his hand does not touch the canvas. {staff}, kind, stands behind him a while and tells him that one day people will seek out these quiet rooms one by one, know them again, and hang them in many cities. Vermeer does not turn round. He picks up the palette, scrapes off a little blue that has dried on it with the knife, and bends to mix some fresh.'
              else: 'On the afternoon of 9 December the studio is very quiet. Vermeer sits at the easel, and for a long time the brush in his hand does not touch the canvas. {staff}, who knows painting, stands behind him a while and tells him that one day people will seek out these quiet rooms one by one, know them again, and hang them in many cities. Vermeer does not turn round. He picks up the palette, scrapes off a little blue that has dried on it with the knife, and bends to mix some fresh.'
            p4:
              class_medical: 'On the afternoon of 12 December Vermeer comes down from the studio and stops halfway down the stairs, a hand against the wall, his face suddenly grey. {staff}, who knows medicine, helps him to bed, sits by him taking his pulse, wakes him twice in the night to drink, and keeps watch all the next day. The day and a half goes by. On the third morning Vermeer climbs the stairs by himself and opens the shutters of the studio, and the light comes in and falls on the bare floor in front of the easel.'
              else: 'On the afternoon of 12 December Vermeer comes down from the studio and stops halfway down the stairs, a hand against the wall, his face suddenly grey. {staff}, carrying the nano medical kit, helps him to bed, uses it on him as its instructions say, sits by him, wakes him twice in the night to drink, and keeps watch all the next day. The day and a half goes by. On the third morning Vermeer climbs the stairs by himself and opens the shutters of the studio, and the light comes in and falls on the bare floor in front of the easel.'
          excerpts:
            p4: 'The day and a half goes by. On the third morning Vermeer climbs the stairs by himself and opens the shutters of the studio, and the light comes in and falls on the bare floor in front of the easel.'
            p3: 'Vermeer does not turn round. He picks up the palette, scrapes off a little blue that has dried on it with the knife, and bends to mix some fresh.'
            p2: 'In the afternoon three paintings, tied with twine, are carried out of the door on men''s shoulders. Catharina counts the money twice on the kitchen table, sets a small pile aside, wraps it in a cloth and puts it in her apron pocket.'
            p1: 'The man rolls up his list and leaves. Vermeer stands a while in front of the painting, then reaches out and wipes a film of dust from the bottom of the frame.'
        relic: "A pearl earring"
        relic_desc: "A small pearl of the kind he painted so often."
        points:
          p1: 'Before the year ends, keep The Art of Painting in his studio so it is not taken by creditors for his debts'
          p2: 'Help him sell some of the paintings left on his hands since the war, and ease the household''s debts'
          p3: 'Let him know that his paintings will be remembered'
          p4: 'Before mid December, heal him and keep him alive'
        points_fail:
          p1: 'The Art of Painting went to a creditor at the end of the year, and in February Catharina had no painting to pass to her mother. This branch came loose from history, and the office recalled the employee.'
          p2: 'The paintings stayed on his hands and not one sold. In this branch the household''s debts kept growing day by day.'
          p3: 'He never knew what would become of these paintings. In this branch nobody told him that two centuries later people would trace them back one by one.'
          p4: 'December went as it did in history: within a day and a half he went from healthy to dead. In this branch Catharina still faced the debts alone with eleven children.'
        shift:
          p1:
            was: 'On 24 February 1676 Catharina Bolnes passed The Art of Painting to her mother Maria Thins so that it would not be sold to satisfy creditors; Vermeer had never sold it, even in debt.'
          p2:
            was: 'From the war of 1672 Vermeer could not sell his art, and was left holding the paintings of other masters he dealt in; Catharina later gave this as the cause of the household''s debts.'
            now: 'A few of the paintings found buyers that December, and the bread bill and the other debts stopped growing for a while.'
          p3:
            was: 'After his death in 1675 Vermeer was all but forgotten for nearly two centuries; only in the 1860s did Thoré-Bürger''s research bring his work back to notice.'
            now: 'Someone told him that these quiet rooms would one day be sought out and traced back, picture by picture.'
          p4:
            was: 'In December 1675, Catharina later wrote, under the weight of the debts and the children he went within a day and a half from healthy to dead; he was buried in Delft on 15 December, aged 43.'
            now: '{staff} stayed with him through that December, and the day and a half never came. He went back to his studio in Delft and painted for some more years, and Catharina and the eleven children did not lose him that winter.'
            who: vermeer_delft
            bio: 'In this line Vermeer lived through December 1675, painted in Delft for some more years, and saw his household through its debts.'
        vignettes:
          bread: 'On the fifth of December {staff} helps the baker''s boy carry the morning loaves along the Oude Langendijk. At one door the boy hands in the bread without being paid and makes a mark in his little book. He says his master grumbles about that page every Saturday, and every Monday sends the bread all the same.'
          frames: 'In January {staff} spends a morning in a frame maker''s shop, holding mitred corners while the glue sets. Half the frames against the wall are empty. The frame maker says that since the French came in seventy two people buy frames for mirrors, not for paintings, and a mirror at least never asks to be paid for twice.'
          peat: 'In the middle of February {staff} helps a peat seller stack wet turves on the market square. She blows on her fingers and says this is the winter everyone in Delft burns the cheap stuff, so the whole town smells like a wet dog by the fire.'
      zh:
        name: "负债的画家"
        place: "代尔夫特"
        figure: "约翰内斯·维米尔"
        story: '1672 年战事以后，约翰内斯·维米尔的画几乎卖不出去，1675 年 7 月他去阿姆斯特丹借了一千荷兰盾。据他的遗孀后来陈述，那年 12 月他在一天半里由好好的人到了去世；12 月 15 日他葬在代尔夫特，四十三岁，留下十一个孩子。1676 年初，卡塔琳娜·博尔内斯把他的两幅画交给面包商抵面包钱，2 月 24 日又把《绘画艺术》转到母亲玛丽亚·廷斯名下。2 月 29 日，公证人来家里清点遗产；4 月，她请求高等法院免去她的债务。'
        story_prose:
          opening:
            - '1675 年 12 月初，代尔夫特老朗恩代克街。四十三岁的画家约翰内斯·维米尔和妻子卡塔琳娜·博尔内斯、十一个孩子住在这里。他画光线柔和的安静屋子，留到今天的画只有四十来幅。1672 年开战以后画市垮了，他自己的画几乎卖不出去，买来经手的别家画作也只能压在手里；这年 7 月，他去阿姆斯特丹借了一千荷兰盾。'
            - '史实里，据卡塔琳娜后来的陈述，他被孩子和债务压着，在一天半里由好好的人到了去世，12 月 15 日下葬。第二年初，她把他的两幅画交给面包商抵三年的面包钱，2 月 24 日把画室里那幅《绘画艺术》转到母亲玛丽亚·廷斯名下，4 月请求高等法院免去她的债。此后将近两百年，他的名字几乎被人忘了。在这条分支里，有个送面包不收钱、只在小本子上画一道的伙计，有个画框铺的师傅，集市上有个卖泥炭的女人。'
            - '这一趟用得上几种人：管过档案、做古董买卖或修过画的人，会画画、做过校对或翻译又细心的人，或者守得住夜、有条理、意志硬的人，护得住画室里那幅大画；做过买卖、手气不坏的人，或者能说会道、在市井里混得开的人，把压在手里的画卖出去；懂画、心细或心善的人，说得出这些画以后的样子；当医生、意志硬的人，懂医护、带着情绪稳定贴片的人，或者带着纳米医疗箱的人，守得住十二月中旬那一天半。'
          outcomes:
            all: '那个冬天，维米尔没有倒下。正月里一个晴天，他又爬上楼去画画，那幅大画还挂在画室的墙上，厨房柜子里收着一小包用布裹着的钱。'
            p4: '那个十二月过去了，维米尔没有倒下。正月里一个晴天，他又爬上楼，把画架挪到了窗前。'
            p2: '12 月 15 日，维米尔葬在代尔夫特，四十三岁。那个月卖画得来的钱，卡塔琳娜用布包着，收在厨房的柜子里。'
            p3: '12 月 15 日，维米尔葬在代尔夫特，四十三岁。画室里的画架空着，调色板搁在一边，上面那一点新调的蓝已经干了。'
            p1: '12 月 15 日，维米尔葬在代尔夫特，四十三岁，留下十一个孩子。第二年二月，卡塔琳娜把画室里那幅大画转到了母亲名下。'
          none: '12 月 15 日，维米尔葬在代尔夫特岳母早年买下的墓穴里，四十三岁。此后将近两百年，很少有人叫得出他的名字。'
          desync: '12 月 3 日，债主差来的人对着清单点了点头，叫人把墙边那幅大画从钉子上取下来。{staff}被召回时，两个人正抬着它下楼，画上那片蓝在楼梯拐角一晃。'
          not_admitted: '{staff}没能进老朗恩代克街那户人家，只在集市广场边站过几个早上。那户人家的窗板总是关着一半，有个孩子趴在窗台上，数着过往的面包篮子。'
          points:
            p1:
              trait_vigil: '12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}守得住，一连两夜睡在画室外的楼梯口，白天把来人的清单一行行对过：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。'
              trait_methodical: '12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}有条理，把来人的清单一行行对过，又把画室里每幅画的来历记成一页：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。'
              else: '12 月 3 日上午，一个债主差来的人拿着一张清单进了画室，说年底前要拿几幅画去抵账，手指着墙边那幅大画：画里一个画家背对着人，正在画一个穿蓝衣、捧着书和号角的女子。{staff}跟画和契据打过交道，把来人的清单一行行对过，指给他看：能抵账的是店里经手的那些别家画作，这一幅不在里面。来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。'
            p2:
              class_trade: '12 月 6 日是集市日。几幅别家的画用布包着，靠在店里的门后已经好几年了。{staff}做过买卖，把画一幅幅抬到窗前的光里，跟来看画的两个商人从早谈到中午，价钱让了一点，又一点不让。下午，三幅画用麻绳捆好，被人扛出了门。卡塔琳娜把钱在厨房桌上数了两遍，拨出一小摞用布包好，放进了围裙口袋。'
              else: '12 月 6 日是集市日。几幅别家的画用布包着，靠在店里的门后已经好几年了。{staff}能说会道，在集市上转了一圈，领回来两个看画的商人，把画一幅幅抬到窗前的光里，跟他们从早谈到中午。下午，三幅画用麻绳捆好，被人扛出了门。卡塔琳娜把钱在厨房桌上数了两遍，拨出一小摞用布包好，放进了围裙口袋。'
            p3:
              trait_artistic: '12 月 9 日下午，画室里很静。维米尔坐在画架前，手里的笔很久没有落下去。{staff}自己也有一双看画的眼睛，在他身后站了一会儿，告诉他，这些安静的屋子以后会有人一幅一幅找出来，认回来，挂在许多城市里。维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。'
              trait_sensitive: '12 月 9 日下午，画室里很静。维米尔坐在画架前，手里的笔很久没有落下去。{staff}心细，看得出他的累，在他身后站了一会儿，告诉他，这些安静的屋子以后会有人一幅一幅找出来，认回来，挂在许多城市里。维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。'
              trait_kind: '12 月 9 日下午，画室里很静。维米尔坐在画架前，手里的笔很久没有落下去。{staff}心善，在他身后站了一会儿，告诉他，这些安静的屋子以后会有人一幅一幅找出来，认回来，挂在许多城市里。维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。'
              else: '12 月 9 日下午，画室里很静。维米尔坐在画架前，手里的笔很久没有落下去。{staff}懂画，在他身后站了一会儿，告诉他，这些安静的屋子以后会有人一幅一幅找出来，认回来，挂在许多城市里。维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。'
            p4:
              class_medical: '12 月 12 日下午，维米尔从画室下楼，扶着墙在楼梯半中间站住了，脸色一下子灰了下去。{staff}懂医护，扶他躺下，守在床边量他的脉，一夜叫醒他两回喝水，第二天又守了一整天。那一天半过去了。第三天早上，维米尔自己上了楼，推开画室的窗板，光照进来，落在画架前那块空地上。'
              else: '12 月 12 日下午，维米尔从画室下楼，扶着墙在楼梯半中间站住了，脸色一下子灰了下去。{staff}带着纳米医疗箱，扶他躺下，照着说明给他用上，守在床边，一夜叫醒他两回喝水，第二天又守了一整天。那一天半过去了。第三天早上，维米尔自己上了楼，推开画室的窗板，光照进来，落在画架前那块空地上。'
          excerpts:
            p4: '那一天半过去了。第三天早上，维米尔自己上了楼，推开画室的窗板，光照进来，落在画架前那块空地上。'
            p3: '维米尔没有回头。他拿起调色板，用刮刀把上面一点干了的蓝刮掉，又低头调起了颜色。'
            p2: '下午，三幅画用麻绳捆好，被人扛出了门。卡塔琳娜把钱在厨房桌上数了两遍，拨出一小摞用布包好，放进了围裙口袋。'
            p1: '来人卷起清单走了。维米尔在那幅画前站了一会儿，伸手把画框底边的一层灰抹掉了。'
        relic: "一枚珍珠耳环"
        relic_desc: "一颗小珍珠，是他常画的那种。"
        points:
          p1: '年底之前，护住画室里那幅《绘画艺术》，不让它被债主拿去抵债'
          p2: '帮他把战后压在手里的几幅画卖出去，缓一缓这家人的债'
          p3: '让他知道自己的画会被记住'
          p4: '十二月中旬之前，治好他，让他活下来'
        points_fail:
          p1: '《绘画艺术》在年底被债主拿去抵了债，次年二月卡塔琳娜无画可转给母亲，这条分支与历史脱了节，员工被送回。'
          p2: '画照旧压在手里，一幅也没卖出去，这条分支里这家人的债照旧一天天重下去。'
          p3: '他照旧不知道这些画以后会怎样，这条分支里没有人告诉过他，两百年后会有人把它们一幅幅找回来。'
          p4: '十二月照史实过去，他在一天半里由好好的人到了去世，这条分支里卡塔琳娜照旧一个人带着十一个孩子面对那些债。'
        shift:
          p1:
            was: '1676 年 2 月 24 日，卡塔琳娜·博尔内斯把《绘画艺术》转到母亲玛丽亚·廷斯名下，免得被拿去抵债；维米尔负债时也没有卖掉它。'
          p2:
            was: '1672 年战事以后，维米尔自己的画卖不出去，经手的别家画作也压在手里；卡塔琳娜后来说这是家里欠债的缘由。'
            now: '那个十二月有几幅画找到了买主，面包账和别的欠债暂时不再往上涨。'
          p3:
            was: '1675 年去世以后，维米尔被冷落了将近两百年，到 1860 年代托雷-比尔热的研究才让他的画重新被人认出。'
            now: '有人告诉过他，这些安静的屋子以后会被人一幅幅找出来、认回来。'
          p4:
            was: '1675 年 12 月，据卡塔琳娜后来的陈述，他被债务和孩子压着，一天半里由好好的人到了去世；12 月 15 日葬于代尔夫特，年四十三。'
            now: '{staff}陪他过了那个十二月，那一天半没有到来。他回到代尔夫特的画室，又画了些年，卡塔琳娜和十一个孩子没有在那个冬天失去他。'
            who: vermeer_delft
            bio: 'IF 线里，维米尔挺过了 1675 年的十二月，又在代尔夫特画了些年，陪这一家把债慢慢还清。'
        vignettes:
          bread: '12 月 5 日早上，天还没大亮，运河上起着雾，{staff}帮面包铺的伙计沿着老朗恩代克街送面包。到了一家门口，伙计把面包递进去，没收钱，在小本子上画了一道。他说老板每个星期六都对着这一页嘟囔，每个星期一照样叫他把面包送来。'
          frames: '一月里，{staff}在一家画框铺里待了一上午，替师傅按住斜角，等胶干，铺子里一股熬胶的腥味。靠墙的画框有一半空着。师傅说自从七二年法国人打进来，人们买框子是为了装镜子，不是装画，镜子至少不会让人付两回钱。'
          peat: '二月中旬，{staff}帮一个卖泥炭的女人在集市广场上码湿泥炭块，脚下的石板结了一层薄霜。她朝手指哈气，说今年冬天全代尔夫特都在烧便宜货，整座城闻起来像一条趴在炉边的湿狗。'
text:
  en:
    name: Johannes Vermeer
    text: Dutch painter, 1632 to 1675, of Delft. He painted quiet interior scenes with soft light, such as Girl with a Pearl Earring, produced only some forty works that survive, and left his family in debt.
  zh:
    name: 约翰内斯·维米尔
    text: 荷兰画家，1632 年生，1675 年去世，代尔夫特人。他画光线柔和的静谧室内场景，如《戴珍珠耳环的少女》，留存的作品只有约四十件，去世时家人负债。
quotes:
  vermeer_seen_at_bakers:
    order: 1
    tier: full
    contextual: true
    date: '1663-08-11'
    checked: official_record
    sources: [vermeer_monconys_rkd]
    original: fr
    text:
      en:
        who: 'Balthasar de Monconys'
        quote: 'but we saw one at a baker’s'
        occasion: 'Journal des voyages, part II, Voyage des Pays Bas, pp. 148–149. Monconys records seeing a painting by Vermeer at a baker’s in Delft and questions the reported price. The painting’s identity is uncertain. Game translation.'
      zh:
        who: '巴尔塔萨尔·德·蒙科尼'
        quote: '但我们在一位面包师那里看见了一幅'
        occasion: '《旅行日记》第二部《尼德兰之行》，第 148–149 页。蒙科尼记下在代尔夫特一位面包师那里看到维米尔的画，并质疑听到的售价。画作身份未定。游戏译文。'
      fr:
        who: 'Balthasar de Monconys'
        quote: 'mais nous en vismes vn chez vn Boulanger'
        occasion: 'Journal des voyages, II, Voyage des Pays Bas, p. 149'
      zh-Hant:
        who: '巴爾塔薩爾·德·蒙科尼'
        quote: '但我們在一位麵包師那裡看見了一幅'
        occasion: '《旅行日記》第二部《尼德蘭之行》，第 148–149 頁。蒙科尼記下在代爾夫特一位麵包師那裡看到維米爾的畫，並質疑聽到的售價。畫作身份未定。遊戲譯文。'
      es:
        who: 'Baltasar de Monconys'
        quote: 'pero vimos uno en una panadería'
        occasion: 'Journal des voyages, parte II, Voyage des Pays Bas, págs. 148-149. Monconys registra haber visto un cuadro de Vermeer en una panadería en Delft y cuestiona el precio informado. La identidad de la pintura es incierta. Traducción de juegos.'
      ja:
        who: 'バルタザール・デ・モンコニス'
        quote: 'でもパン屋で見たよ'
        occasion: 'Journal des voyages、パート II、Voyage des Pays Bas、148 ～ 149 ページ。モンコニーさんはデルフトのパン屋でフェルメールの絵を見たという記録を持ち、報告された価格に疑問を抱いている。この絵の正体は不明である。ゲーム翻訳。'
      ko:
        who: '발타사르 드 몽코니스'
        quote: '하지만 우리는 빵집에서 하나를 봤어'
        occasion: 'Journal des voyages, 파트 II, Voyage des Pays Bas, pp. 148–149. Monconys는 델프트의 한 빵집에서 베르메르의 그림을 본 기록을 남기고 보고된 가격에 대해 의문을 제기합니다. 그림의 정체는 불확실하다. 게임 번역.'
      ru:
        who: 'Бальтазар де Монконис'
        quote: 'но мы видели одного в булочной'
        occasion: 'Журнал путешествий, часть II, Voyage des Pays Bas, стр. 148–149. Monconys записывает, что видел картину Вермеера в булочной в Делфте, и ставит под сомнение заявленную цену. Личность картины неизвестна. Перевод игры.'
  vermeer_work_survived:
    order: 2
    tier: none
    contextual: true
    date: '1866-10-01'
    checked: two_sources
    sources: [vermeer_thore_offprint, vermeer_thore_nga]
    original: fr
    text:
      en:
        who: 'Théophile Thoré, writing as W. Bürger'
        quote: 'what he had created was still there'
        occasion: 'Van der Meer de Delft, dedication to Champfleury, paragraph beginning “Van der Meer n’était pas mort”. Thoré writes about the survival of Vermeer’s work and the loss of his name. Game translation.'
      zh:
        who: '泰奥菲尔·托雷，笔名 W. 比尔热'
        quote: '他创作的作品依然在世'
        occasion: '《代尔夫特的范德梅尔》献给尚弗勒里的题辞，“Van der Meer n’était pas mort”一段。托雷写维米尔的作品仍存，画家的名字却被淡忘。游戏译文。'
      fr:
        who: 'Théophile Thoré, dit W. Bürger'
        quote: 'ce qu’il avait créé était toujours là'
        occasion: 'Van der Meer de Delft, dédicace à Champfleury'
      zh-Hant:
        who: '泰奧菲爾·托雷，筆名 W. 比爾熱'
        quote: '他創作的作品依然在世'
        occasion: '《代爾夫特的範德梅爾》獻給尚弗勒裡的題辭，“Van der Meer n’était pas mort”一段。托雷寫維米爾的作品仍存，畫家的名字卻被淡忘。遊戲譯文。'
      es:
        who: 'Théophile Thoré, escrito como W. Bürger'
        quote: 'lo que había creado todavía estaba ahí'
        occasion: 'Van der Meer de Delft, dedicatoria a Champfleury, párrafo que comienza con “Van der Meer n’était pas mort”. Thoré escribe sobre la supervivencia de la obra de Vermeer y la pérdida de su nombre. Traducción de juegos.'
      ja:
        who: 'テオフィル・トレ、W. ビュルガーとして執筆'
        quote: '彼が作ったものはまだそこにあった'
        occasion: 'Van der Meer de Delft、シャンフルーリーへの献呈、「Van der Meer n’était pas mort」で始まる段落。トレはフェルメールの作品の存続と名前の喪失について書いています。ゲーム翻訳。'
      ko:
        who: 'W. Burger로 글을 쓰는 테오필 토레'
        quote: '그가 만든 것이 여전히 거기에 있었습니다'
        occasion: 'Van der Meer de Delft, Champfleury에 대한 헌정, "Van der Meer n''était pas mort"로 시작하는 단락. 토레는 베르메르 작품의 생존과 그의 이름 상실에 대해 글을 씁니다. 게임 번역.'
      ru:
        who: 'Теофиль Торе, пишущий как В. Бюргер'
        quote: 'то, что он создал, все еще было там'
        occasion: 'Ван дер Меер де Делфт, посвящение Шампфлёри, абзац, начинающийся со слов «Ван дер Меер n’était pas mort». Торе пишет о выживании работ Вермеера и потере его имени. Перевод игры.'
hook: {en: 'A day and a half, she wrote', zh: '她后来写，只有一天半'}
facts:
  war:
    date: '1672'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_wiki]
    text:
      en: 'From 1672, when the Dutch Republic went to war with France and England, the art trade collapsed. Catharina Bolnes later said that during the war Vermeer could sell hardly any of his own work, and the paintings he had bought to deal in had to be sold at a great loss.'
      zh: '1672 年荷兰共和国与法国、英国开战，画市随之崩塌。卡塔琳娜·博尔内斯后来说，战事期间维米尔自己的画几乎卖不出去，他买来经手的别家画作也只能大亏着卖。'
    line:
      en: '1672: war with France and England, and the art trade of the Republic collapses.'
      zh: '1672 年，荷兰与法国、英国开战，画市一落千丈。'
      zh-Hant: '1672 年，荷蘭與法國、英國開戰，畫市一落千丈。'
      fr: '1672 : guerre avec la France et l''Angleterre, et le commerce de l''art de la République s''effondre.'
      es: '1672: guerra con Francia e Inglaterra y el comercio de arte de la República colapsa.'
      ja: '1672年: フランスおよびイギリスとの戦争、共和国の美術貿易は崩壊。'
      ko: '1672년: 프랑스, 영국과의 전쟁으로 인해 공화국의 미술 무역이 붕괴되었습니다.'
      ru: '1672: война с Францией и Англией, и торговля произведениями искусства в республике рушится.'
  loan:
    date: '1675-07'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_essential_life, vermeer_wiki]
    text:
      en: 'In July 1675 Vermeer travelled to Amsterdam and borrowed 1,000 guilders from the silk trader Jacob Romboutsz, with property of his mother-in-law as surety.'
      zh: '1675 年 7 月，维米尔去阿姆斯特丹，向丝绸商雅各布·龙布茨借了一千荷兰盾，以岳母的产业作保。'
    line:
      en: 'July 1675: Vermeer goes to Amsterdam to borrow a thousand guilders.'
      zh: '1675 年 7 月，维米尔去阿姆斯特丹借了一千荷兰盾。'
      zh-Hant: '1675 年 7 月，維米爾去阿姆斯特丹借了一千荷蘭盾。'
      fr: 'Juillet 1675 : Vermeer se rend à Amsterdam pour emprunter mille florins.'
      es: 'Julio de 1675: Vermeer va a Ámsterdam para pedir prestado mil florines.'
      ja: '1675年7月: フェルメールは1000ギルダーを借りるためにアムステルダムへ行きます。'
      ko: '1675년 7월: 베르메르는 천 길더를 빌리기 위해 암스테르담으로 갑니다.'
      ru: 'Июль 1675 года: Вермеер едет в Амстердам, чтобы занять тысячу гульденов.'
  day_and_half:
    date: '1675-12'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [vermeer_essential_life, vermeer_wiki]
    text:
      en: 'Catharina Bolnes later wrote that, under the burden of the children and the debts, he fell into such decay that within a day and a half he went from being healthy to being dead. He left eleven children, ten of them under age.'
      zh: '卡塔琳娜·博尔内斯后来写道，他被孩子和债务压着，垮得很快，一天半里由好好的人到了去世。他留下十一个孩子，十个还未成年。'
    note: 'A death: written as a plain fact.'
  burial:
    date: '1675-12-15'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_essential_life]
    text:
      en: 'Vermeer was buried in Delft on 15 December 1675, aged forty three, in a grave his mother-in-law had bought years before.'
      zh: '1675 年 12 月 15 日，维米尔葬在代尔夫特岳母早年买下的墓穴里，四十三岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '15 December 1675: Johannes Vermeer is buried in Delft, aged forty three.'
      zh: '1675 年 12 月 15 日，约翰内斯·维米尔葬于代尔夫特，四十三岁。'
      zh-Hant: '1675 年 12 月 15 日，約翰內斯·維米爾葬於代爾夫特，四十三歲。'
      fr: '15 décembre 1675 : Johannes Vermeer est enterré à Delft, âgé de quarante-trois ans.'
      es: '15 de diciembre de 1675: Johannes Vermeer es enterrado en Delft, a la edad de cuarenta y tres años.'
      ja: '1675年12月15日：ヨハネス・フェルメールが43歳でデルフトに埋葬される。'
      ko: '1675년 12월 15일: 요하네스 페르메이르가 43세의 나이로 델프트에 묻혔습니다.'
      ru: '15 декабря 1675 года: Иоганнес Вермеер похоронен в Делфте в возрасте сорока трех лет.'
  baker:
    date: '1676-01'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_baker_document, vermeer_essential_life]
    text:
      en: 'Early in 1676 Catharina Bolnes handed two of his paintings, a woman writing a letter and a figure playing an instrument, to the Delft baker Hendrick van Buyten against a bread debt of 617 guilders, about three years of bread. She could redeem them in yearly payments of fifty guilders.'
      zh: '1676 年初，卡塔琳娜·博尔内斯把他的两幅画，一幅写信的女子、一幅弹琴的人，交给代尔夫特面包商亨德里克·范·拜滕，抵 617 荷兰盾的面包钱，约是三年的面包。她可以每年付五十盾把画赎回。'
    line:
      en: 'Early 1676: Catharina gives two of his paintings to the baker against 617 guilders of bread.'
      zh: '1676 年初，卡塔琳娜把他的两幅画交给面包商，抵 617 荷兰盾的面包钱。'
      zh-Hant: '1676 年初，卡塔琳娜把他的兩幅畫交給麵包商，抵 617 荷蘭盾的麵包錢。'
      fr: 'Début 1676 : Catharina donne deux de ses tableaux au boulanger contre 617 florins de pain.'
      es: 'Principios de 1676: Catalina regala dos de sus cuadros al panadero a cambio de 617 florines de pan.'
      ja: '1676 年初頭: カタリーナは 617 ギルダーのパンに対して自分の絵画 2 枚をパン屋に渡します。'
      ko: '1676년 초: 카타리나는 빵 617길더에 맞춰 자신의 그림 두 점을 제빵사에게 건네줍니다.'
      ru: 'Начало 1676 года: Катарина отдает булочнику две его картины за 617 гульденов хлеба.'
  art_of_painting:
    date: '1676-02-24'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_art_of_painting_wiki]
    text:
      en: 'On 24 February 1676 Catharina Bolnes transferred The Art of Painting to her mother Maria Thins so that it would not be sold for the creditors. The receiver later judged the transfer wrongful, and the painting was handed back on 23 March 1677.'
      zh: '1676 年 2 月 24 日，卡塔琳娜·博尔内斯把《绘画艺术》转到母亲玛丽亚·廷斯名下，免得被拿去抵债。遗产管理人后来认定这次转让不当，1677 年 3 月 23 日画被交了回去。'
    line:
      en: '24 February 1676: Catharina passes The Art of Painting to her mother Maria Thins.'
      zh: '1676 年 2 月 24 日，卡塔琳娜把《绘画艺术》转到母亲玛丽亚·廷斯名下。'
      zh-Hant: '1676 年 2 月 24 日，卡塔琳娜把《繪畫藝術》轉到母親瑪麗亞·廷斯名下。'
      fr: '24 février 1676 : Catharina transmet l''Art de la peinture à sa mère Maria Thins.'
      es: '24 de febrero de 1676: Catharina pasa el arte de pintar a su madre María Thins.'
      ja: '1676 年 2 月 24 日: カタリーナは母親のマリア・シンズに『絵画芸術』を渡します。'
      ko: '1676년 2월 24일: 카타리나는 어머니 마리아 틴스(Maria Thins)에게 회화 예술을 전수합니다.'
      ru: '24 февраля 1676 г.: Катарина передает «Искусство живописи» своей матери Марии Тинс.'
  inventory:
    date: '1676-02-29'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_delft_inventory]
    text:
      en: 'On 29 February 1676 a notary came to the house on the Oude Langendijk to inventory the estate. No unfinished paintings were listed.'
      zh: '1676 年 2 月 29 日，公证人来到老朗恩代克街的家里清点遗产，清册里没有一幅未完成的画。'
    line:
      en: '29 February 1676: a notary inventories the house on the Oude Langendijk.'
      zh: '1676 年 2 月 29 日，公证人到老朗恩代克街的家里清点遗产。'
      zh-Hant: '1676 年 2 月 29 日，公證人到老朗恩代克街的家裡清點遺產。'
      fr: '29 février 1676 : un notaire inventorie la maison de l''Oude Langendijk.'
      es: '29 de febrero de 1676: un notario hace el inventario de la casa de Oude Langendijk.'
      ja: '1676 年 2 月 29 日: 公証人がアウデ ランゲンダイクの家の目録を作成します。'
      ko: '1676년 2월 29일: 공증인이 Oude Langendijk에 있는 집의 목록을 작성했습니다.'
      ru: '29 февраля 1676 года: нотариус описывает дом на Ауде Лангендейк.'
  petition:
    date: '1676-04'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_wiki]
    text:
      en: 'In April 1676 Catharina Bolnes asked the High Court to relieve her of the debts owed to the creditors, giving the war as the reason her husband had earned so little.'
      zh: '1676 年 4 月，卡塔琳娜·博尔内斯请求高等法院免去欠债主的债，说丈夫挣得那么少，是因为战事。'
    line:
      en: 'April 1676: Catharina asks the High Court to relieve her of the debts.'
      zh: '1676 年 4 月，卡塔琳娜请求高等法院免去她的债。'
      zh-Hant: '1676 年 4 月，卡塔琳娜請求高等法院免去她的債。'
      fr: 'Avril 1676 : Catharina demande à la Haute Cour de la libérer de ses dettes.'
      es: 'Abril de 1676: Catharina pide al Tribunal Superior que la libere de sus deudas.'
      ja: '1676 年 4 月: カタリーナは高等裁判所に借金の免除を要請します。'
      ko: '1676년 4월: 카타리나는 고등 법원에 빚을 탕감해 달라고 요청합니다.'
      ru: 'Апрель 1676 г.: Катарина просит Высокий суд избавить ее от долгов.'
  trustee:
    date: '1676-09-30'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_estate_archives, vermeer_essential_life]
    text:
      en: 'On 30 September 1676 Antonie van Leeuwenhoek of Delft was appointed trustee of the estate on behalf of the creditors.'
      zh: '1676 年 9 月 30 日，代尔夫特的安东尼·范·列文虎克被指定为这份遗产的管理人，代表债主。'
    line:
      en: '30 September 1676: Antonie van Leeuwenhoek is made trustee of the estate.'
      zh: '1676 年 9 月 30 日，安东尼·范·列文虎克被指定为这份遗产的管理人。'
      zh-Hant: '1676 年 9 月 30 日，安東尼·範·列文虎克被指定為這份遺產的管理人。'
      fr: '30 septembre 1676 : Antonie van Leeuwenhoek est nommée fiduciaire de la succession.'
      es: '30 de septiembre de 1676: Antonie van Leeuwenhoek se convierte en administradora de la finca.'
      ja: '1676年9月30日: アントニー・ファン・レーウェンフックが財産の管財人に任命される。'
      ko: '1676년 9월 30일: Antonie van Leeuwenhoek이 유산의 수탁자가 되었습니다.'
      ru: '30 сентября 1676 г.: Антони ван Левенгук становится попечителем поместья.'
  rediscovery:
    date: '1866'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [vermeer_wiki, vermeer_delft_primary]
    text:
      en: 'In 1866 Théophile Thoré-Bürger published a catalogue of the works of Vermeer in the Gazette des Beaux-Arts, which drew wide attention back to the painter.'
      zh: '1866 年，泰奥菲勒·托雷-比尔热在《美术报》上发表维米尔作品目录，让这位画家重新引起广泛注意。'
    line:
      en: '1866: Thoré-Bürger publishes a catalogue of the works of Vermeer.'
      zh: '1866 年，托雷-比尔热发表维米尔作品目录。'
      zh-Hant: '1866 年，托雷-比爾熱發表維米爾作品目錄。'
      fr: '1866 : Thoré-Bürger publie un catalogue des œuvres de Vermeer.'
      es: '1866: Thoré-Bürger publica un catálogo de las obras de Vermeer.'
      ja: '1866年: トレ＝ビュルガーがフェルメールの作品目録を出版。'
      ko: '1866년: Thoré-Bürger가 베르메르 작품 카탈로그를 출판합니다.'
      ru: '1866: Торе-Бюргер публикует каталог работ Вермеера.'
