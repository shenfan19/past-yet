self_check:
  echo_review: 'Contextual echoes use the attributed writings of Balthasar de Monconys and Théophile Thoré. No attested first-person wording by Vermeer was found.'
  fact: day_and_half
  quote_line: '镜子至少不会让人付两回钱。'
  regret_choice: '派古董商去，画卖得出去，《绘画艺术》也护得住，可他照旧在一天半里去世；派医生带舒缓贴去，他活过了十二月，家里的债却没有松。四颗要同一趟做齐，得带对路的东西。'
  bookend: '从 1672 年画市崩塌开始，以 1866 年托雷-比尔热的作品目录收尾，中间是一个冬天里的债。'
  share_line: '他在一天半里由好好的人到了去世，留下十一个孩子和一屋子卖不出去的画。'
