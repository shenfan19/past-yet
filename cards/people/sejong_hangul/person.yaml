    stay_day: 35
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_hunminjeongeum, languages_numbers_hangul]
    text:
      en: 'The new script of twenty eight letters was finished in 1443, the twenty fifth year of Sejong.'
      zh: '新文字二十八个字母于 1443 年，即世宗二十五年制成。'
    line:
      en: 'The end of 1443: King Sejong finishes twenty eight letters for writing Korean.'
      zh: '1443 年岁末，世宗制成二十八个字母，用来书写朝鲜语。'
      ko: '1443년 말, 세종이 우리말을 적는 새 글자 스물여덟 자를 완성했다.'
  memorial:
    date: '1444'
    stay_day: 92
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [languagelog_choe, languages_numbers_hangul]
    text:
      en: 'In the second month of 1444 Choe Manri, first counsellor of the Hall of Worthies, sent up a memorial on behalf of himself and six colleagues raising objections; scholars differ on whether it attacked the script itself or Sejong''s wider reform of Sino-Korean pronunciation.'
      zh: '1444 年二月，集贤殿副提学崔万理代表自己和六位同僚上疏提出异议；学者对此疏反对的是新字本身，还是世宗对汉字音的更大改革，看法不一。'
    line:
      en: 'The second month of 1444: Choe Manri and six colleagues of the Hall of Worthies send up a memorial raising objections.'
      zh: '1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。'
      ko: '1444년 음력 2월, 최만리와 집현전 동료 여섯 명이 상소를 올려 이의를 제기했다.'
  promulgated:
    date: '1446'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sejong_hangul_primary, wikipedia_hunminjeongeum]
    text:
      en: 'The script was promulgated in 1446 as Hunminjeongeum, with the explanatory edition known as the Haerye.'
      zh: '1446 年，新字以《训民正音》之名颁布，并有解说本《训民正音解例》。'
    line:
      en: '1446: the letters are promulgated as Hunminjeongeum, the correct sounds for teaching the people.'
      zh: '1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。'
      ko: '1446년, 백성을 가르치는 바른 소리라는 뜻의 『훈민정음』이 반포되었다.'
  sejong_dies:
    date: '1450'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [languages_numbers_hangul, wikipedia_hunminjeongeum]
    text:
      en: 'Sejong died in 1450.'
      zh: '世宗于 1450 年去世。'
    line:
      en: '1450: King Sejong dies.'
      zh: '1450 年，世宗去世。'
      ko: '1450년, 세종이 세상을 떠났다.'
