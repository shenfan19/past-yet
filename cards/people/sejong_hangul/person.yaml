    text:
      en:
        name: An alphabet anyone can learn
        place: Seoul
        figure: King Sejong and the scholars
        story: 'In 1443 King Sejong of Joseon made twenty eight letters for writing Korean. In the second month of 1444 Choe Manri, of the Hall of Worthies, sent up a memorial with six colleagues raising objections. The new letters were promulgated in 1446 as Hunminjeongeum, the correct sounds for teaching the people. Sejong died in 1450.'
        relic: A woodblock of letters
        relic_desc: A block carved with the first letters, ready to ink.
        points:
          p1: 'In the days of the memorial, keep the draft translation of the rhyme book Yunhui into the new letters safe in the council hall, so that the work goes on'
          p2: 'Let him see with his own eyes someone who never went to school write their own name in the new letters'
          p3: 'At Chojeong, ease the trouble in his eyes so that he can still see the new letters clearly'
        points_fail:
          p1: 'In those days the draft was scattered and the work stopped, and the new letters lost their first use.'
          p2: 'In this branch, until the promulgation he never saw anyone among the people use the new letters.'
          p3: 'He went back to the palace with his eyes no better, as in history.'
        shift:
          p1:
            was: 'In the second month of 1444 the work of the Hall of Worthies on rendering the rhyme book Yunhui in the new letters went on.'
          p2:
            was: 'In 1446 the new letters were proclaimed as Hunminjeongeum, and Sejong died four years later.'
            now: 'A stallholder outside the travelling palace at Chojeong learned to write her own name, and someone reported it to the court.'
          p3:
            was: 'Sejong suffered for years with his eyes, went to Chojeong in the spring of 1444 to recover, grew weaker from then on and died in 1450.'
            now: 'A stranger by the springs at Chojeong made his eyes a little better, and when he went back to the palace that summer he could still read memorials and the proofs of the new letters himself.'
        vignettes:
          gesture: '{staff} watches a scholar shape his lips before he draws a letter, and copies the shape of the mouth in the margin beside it.'
          spacing: '{staff} rules a sheet into squares so that the parts of each syllable sit together in one square, and leaves it on the table without a word.'
          lesson: '{staff} draws three letters in the dust with a stick for a child at the market, and the child reads them back as a sound before running off.'
        story_prose:
          opening:
            - 'Seoul, 1443. Sejong has made twenty eight new letters. Korean can be spoken aloud, but to write down the words in one''s mouth, one first has to learn a script very unlike the way one talks. Sejong wants a sheet of paper to be something everyday speech can be written on too.'
            - 'In history, in the second month of 1444 scholars of the Hall of Worthies sent up a joint memorial against the new letters, while the work in the palace of translating books into them was half done. That spring Sejong went to Chojeong to rest his eyes, and from then on his health went down year by year. In this branch there is also a stallholder outside the travelling palace at Chojeong who keeps her accounts straight, yet whenever she has to sign, hands the brush to someone else.'
            - 'Three kinds of people can help on this trip: someone who can keep the papers safe, someone willing to teach a person to read stroke by stroke, and someone who knows medicine and brings the right remedy.'
          outcomes:
            all: 'That summer, when Sejong went back to the palace, he could still see the letters clearly. The sheet the stallholder had signed he did not let anyone take away; it lay on top of the proofs of the new letters.'
            p2: 'Outside the travelling palace at Chojeong, at the end of that account book, the hand was for the first time the stallholder''s own.'
            p3: 'Back at the palace that summer, Sejong could still read the memorials himself. The proofs of the new letters he turned page by page, through to the last.'
            p1: 'The lamps of the Hall of Worthies were lit again. The Yunhui in the new letters piled up page upon page.'
          none: 'Back at the office {staff} still remembered the moment the stallholder held out the brush: the hand reached out, stopped a moment in the air, and only then gave the brush to someone else.'
          desync: 'After the memorial the pages of the new letters lay scattered on the floor of the council hall, and nobody picked them up. When {staff} was recalled, the top page bore half a footprint.'
          not_admitted: '{staff} could not stay long enough to teach the stallholder the new letters. She turned another page of her accounts, and the paper still waited for someone else to sign for her.'
          points:
            p1: 'In the days of the memorial, people came and went in the council hall and nobody had a thought for the pages on the table. {staff} stacked the pages of the Yunhui in the new letters in their order and set a paperweight on them. Some days later the scholars of the Hall came back and lifted the paperweight. The top page was the very place where they had put down their brushes.'
            p2:
              class_teaching: '{staff} went by the old way of teaching: first have her say her name out loud, then set down each sound as a letter. Outside the travelling palace at Chojeong the stallholder said her own name slowly once and wrote on the paper after the sounds. When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.'
              else: '{staff} sat with her a while every day before she closed her stall, never hurrying her, and whenever a stroke went crooked had her write it again. Outside the travelling palace at Chojeong the stallholder said her own name slowly once and wrote on the paper after the sounds. When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.'
            p3: 'At Chojeong {staff} looked at Sejong''s eyes every day, adjusting the medicine and the washes as they changed. Back at the palace, Sejong held a proof of the new letters up before his eyes. The letters were small and he read slowly; when it came time to turn the page, he called no one, and reached out and turned it himself.'
          excerpts:
            p2: 'When the last stroke was down she turned the sheet the right way up, pressed it with a finger, and touched each letter in turn. Later that sheet was sent into the travelling palace, and Sejong held it up before his eyes, looked at it a long time, and did not let anyone take it away.'
            p3: 'Back at the palace, Sejong held a proof of the new letters up before his eyes. The letters were small and he read slowly; when it came time to turn the page, he called no one, and reached out and turned it himself.'
            p1: 'Some days later the scholars of the Hall came back and lifted the paperweight. The top page was the very place where they had put down their brushes.'
      zh:
        name: 人人都学得会的字母
        place: 首尔
        figure: 世宗大王与学者们
        story: '1443 年，朝鲜世宗亲制二十八个字母，用来书写朝鲜语。1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。世宗于 1450 年去世。'
        story_prose:
          opening:
            - '1443 年，汉城。世宗做了二十八个新字母。朝鲜语可以说出口，可想把嘴里的话写下来，得先学一套和自己说话很不一样的文字。世宗想让一张纸也能用来写家常话。'
            - '史实里，1444 年二月，集贤殿有人联名上疏反对新字，宫里用新字译书的事正做到一半。那年春天，世宗为眼疾去椒水养病，此后身体每况愈下。在这条分支里，椒水行宫外还有个摊主，账算得清，签名却总要把笔交给别人。'
            - '这一趟用得上三种人：守得住文稿的人，肯一笔一笔教人认字的人，懂医药、带对了药的人。'
          outcomes:
            all: '那年夏天，世宗回宫时还看得清字。摊主签了名的那张纸，他没让人收走，压在新字校样的最上面。'
            p2: '椒水行宫外，那本账的末尾，第一次是摊主自己的笔迹。'
            p3: '那年夏天回宫，世宗还能自己看奏章。新字的校样，他一页一页翻到了最后。'
            p1: '集贤殿的灯又亮了。用新字译出的《韵会》，一页压着一页往上摞。'
          none: '回到事务所后，{staff}还记得摊主递笔时的那一下：手伸出去，在半空停了停，才把笔交给旁人。'
          desync: '上疏之后，新字的稿页散在议事厅的地上，没有人去捡。{staff}被召回时，最上面那一页印着半个鞋印。'
          not_admitted: '{staff}没能留到把新字教给摊主的时候。她又翻过一页账，纸上仍等着别人替她签名。'
          points:
            p1: '上疏那几天，议事厅里人来人往，没人顾得上桌上的稿页。{staff}把用新字译《韵会》的稿页按次序码好，压上一方镇纸。几天后集贤殿的人回来，掀开了镇纸。最上面那一页，正是先前停笔的地方。'
            p2:
              class_teaching: '{staff}照教书的老办法，先让她把名字念响，再把每个音落成字母。椒水行宫外，摊主把自己的名字慢慢念了一遍，跟着那几声在纸上写。最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。'
              else: '{staff}每天收摊前陪她坐一会儿，不催，哪一笔写歪了就再写一遍。椒水行宫外，摊主把自己的名字慢慢念了一遍，跟着那几声在纸上写。最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。'
            p3: '在椒水，{staff}每天替世宗看眼睛，照着病情调药、敷洗。回宫后，世宗把新字的校样举到眼前。字小，他看得慢，到翻页的时候，没有叫人，自己伸手把纸翻了过去。'
          excerpts:
            p2: '最后一笔落下时，她把纸转正，用手指按着，一个字一个字点过去。那张纸后来送进了行宫，世宗把它拿到眼前，看了很久，没有让人收走。'
            p3: '回宫后，世宗把新字的校样举到眼前。字小，他看得慢，到翻页的时候，没有叫人，自己伸手把纸翻了过去。'
            p1: '几天后集贤殿的人回来，掀开了镇纸。最上面那一页，正是先前停笔的地方。'
        relic: 一块刻着字母的木板
        relic_desc: 刻着最早几个字母的木板，等着上墨。
        points:
          p1: '上疏那几天，护住议事厅里用新字译《韵会》的草稿，让这件事照常往下做'
          p2: '让他亲眼看到一个从没念过书的百姓用新字写出自己的名字'
          p3: '在椒水，减轻他的眼疾，让他还看得清新字'
        points_fail:
          p1: '译稿在那几天散了、停了，新字少了第一件用场。'
          p2: '这条分支里，他到颁布之前都没见过一个百姓用上新字。'
          p3: '他照旧带着眼疾回宫，这条分支与历史一样。'
        shift:
          p1:
            was: '1444 年二月，集贤殿用新字翻译《韵会》的工作照常进行。'
          p2:
            was: '1446 年，新字以《训民正音》之名颁布，四年后世宗去世。'
            now: '椒水的行宫外有个摊主会写自己的名字了，有人把这事报了上去。'
          p3:
            was: '世宗多年患眼疾，1444 年春去椒水养病，此后身体每况愈下，1450 年去世。'
            now: '椒水边一个外乡人帮他把眼睛治得轻了些，那年夏天他回宫时还能自己看奏章和新字的校样。'
        vignettes:
          gesture: '{staff}看见一位学士画字母之前先比了比嘴形，便在页边添了一笔，把嘴怎样张开和纸上的字留在一起。'
          spacing: '{staff}把纸划成方格，将一个音节的几部分写进同一格，等墨稍干，便把纸留在桌上。'
          lesson: '{staff}在集市上用树枝写下三个字母。孩子蹲着看了一会儿，把它们连起来念成一个音，念完便转身跑开了。'
      ko:
        name: '누구나 배울 수 있는 글자'
        place: '한성(서울)'
        figure: '세종과 집현전 학자들'
        story: '1443년 조선의 세종은 우리말을 적을 새 글자 스물여덟 자를 만들었다. 1444년 음력 2월, 집현전의 최만리와 동료 여섯 명이 상소를 올려 이의를 제기했다. 1446년 새 글자는 백성을 가르치는 바른 소리라는 뜻의 『훈민정음』으로 반포되었다. 세종은 1450년에 세상을 떠났다.'
        story_prose:
          opening:
            - '1443년, 한성. 세종은 새 글자 스물여덟 자를 만들었다. 우리말은 입으로 할 수 있었지만, 입에서 나오는 말을 적으려면 먼저 제 말과는 아주 다른 글을 배워야 했다. 세종은 종이 한 장에 집안에서 하는 말도 적을 수 있기를 바랐다.'
            - '역사에서는 1444년 음력 2월, 집현전 학자들이 새 글자에 반대하는 상소를 함께 올렸다. 궁에서 새 글자로 책을 옮기는 일은 반쯤 진행된 때였다. 그해 봄 세종은 눈병 때문에 초정으로 요양을 떠났고, 그 뒤로 몸이 갈수록 쇠약해졌다. 이 시간선에서는 초정 행궁 밖에 장사하는 여인이 하나 있다. 셈은 똑똑히 하지만, 이름을 써야 할 때마다 붓을 남에게 건넨다.'
            - '이번 여정에 쓸모 있는 사람은 세 부류다. 문서를 지켜 낼 사람, 한 획 한 획 글을 가르쳐 줄 사람, 의술을 알고 맞는 약을 가져온 사람.'
          outcomes:
            all: '그해 여름 궁으로 돌아갈 때, 세종은 아직 글자를 똑똑히 볼 수 있었다. 장사하는 여인이 이름을 적은 그 종이를 그는 치우지 못하게 하고, 새 글자 교정지 맨 위에 올려 두었다.'
            p2: '초정 행궁 밖, 그 장부의 맨 끝에 처음으로 여인 자신의 글씨가 남았다.'
            p3: '그해 여름 궁에 돌아온 세종은 상소를 아직 손수 읽을 수 있었다. 새 글자의 교정지를 그는 한 장 한 장 끝까지 넘겼다.'
            p1: '집현전에 다시 불이 켜졌다. 새 글자로 옮긴 『운회』가 한 장 위에 한 장씩 쌓여 갔다.'
          none: '사무소로 돌아온 뒤에도 {staff}는 여인이 붓을 건네던 그 순간을 기억했다. 손이 나갔다가 허공에서 잠깐 멈추고, 그제야 붓이 남의 손으로 넘어갔다.'
          desync: '상소 뒤, 새 글자 원고가 의정청 바닥에 흩어져 있었지만 아무도 줍지 않았다. {staff}가 소환될 때, 맨 위 한 장에는 신발 자국이 반쯤 찍혀 있었다.'
          not_admitted: '{staff}는 여인에게 새 글자를 가르칠 때까지 머물지 못했다. 여인은 장부를 또 한 장 넘겼고, 종이는 여전히 다른 사람이 대신 이름을 써 주기를 기다리고 있었다.'
          points:
            p1: '상소가 오가던 며칠, 의정청에는 사람들이 드나들었고 책상 위 원고를 챙기는 이는 없었다. {staff}는 새 글자로 옮긴 『운회』 원고를 차례대로 가지런히 쌓고 문진을 올려 두었다. 며칠 뒤 집현전 사람들이 돌아와 문진을 들어 올렸다. 맨 위 한 장이 바로 붓을 멈췄던 그 자리였다.'
            p2:
              class_teaching: '{staff}는 글을 가르치는 오랜 방법대로, 먼저 이름을 소리 내어 말하게 하고 소리 하나하나를 글자로 옮기게 했다. 초정 행궁 밖에서 여인은 제 이름을 천천히 한 번 읽고, 그 소리를 따라 종이에 썼다. 마지막 획을 긋고 나서 여인은 종이를 바로 돌려놓고, 손가락으로 누른 채 한 자 한 자 짚어 나갔다. 그 종이는 나중에 행궁으로 들어갔고, 세종은 그것을 눈앞에 들고 오래 들여다보며 치우지 못하게 했다.'
              else: '{staff}는 날마다 장사를 마치기 전에 여인 곁에 잠시 앉아 있었다. 재촉하지 않았고, 획이 비뚤어지면 다시 쓰게 했다. 초정 행궁 밖에서 여인은 제 이름을 천천히 한 번 읽고, 그 소리를 따라 종이에 썼다. 마지막 획을 긋고 나서 여인은 종이를 바로 돌려놓고, 손가락으로 누른 채 한 자 한 자 짚어 나갔다. 그 종이는 나중에 행궁으로 들어갔고, 세종은 그것을 눈앞에 들고 오래 들여다보며 치우지 못하게 했다.'
            p3: '초정에서 {staff}는 날마다 세종의 눈을 살피고, 병세에 따라 약과 씻는 물을 바꾸었다. 궁에 돌아온 세종은 새 글자 교정지를 눈앞에 들어 올렸다. 글자가 작아 그는 천천히 읽었고, 장을 넘길 때가 되자 아무도 부르지 않고, 손을 뻗어 손수 종이를 넘겼다.'
          excerpts:
            p2: '마지막 획을 긋고 나서 여인은 종이를 바로 돌려놓고, 손가락으로 누른 채 한 자 한 자 짚어 나갔다. 그 종이는 나중에 행궁으로 들어갔고, 세종은 그것을 눈앞에 들고 오래 들여다보며 치우지 못하게 했다.'
            p3: '궁에 돌아온 세종은 새 글자 교정지를 눈앞에 들어 올렸다. 글자가 작아 그는 천천히 읽었고, 장을 넘길 때가 되자 아무도 부르지 않고, 손을 뻗어 손수 종이를 넘겼다.'
            p1: '며칠 뒤 집현전 사람들이 돌아와 문진을 들어 올렸다. 맨 위 한 장이 바로 붓을 멈췄던 그 자리였다.'
        relic: '글자를 새긴 목판'
        relic_desc: '처음 만든 글자 몇 자를 새겨 먹을 묻히기만 하면 되는 목판.'
        points:
          p1: '상소 뒤에도 새 글자로 옮긴 『운회』 초고를 지키기'
          p2: '글을 모르는 백성이 새 글자로 이름을 쓰는 모습을 세종에게 보여 주기'
          p3: '초정에서 세종의 눈병을 덜어 새 글자를 계속 볼 수 있게 돕기'
        points_fail:
          p1: '며칠 사이 초고가 흩어지고 작업이 멈췄다. 새 글자는 처음 쓰일 곳을 잃었다.'
          p2: '이 시간선에서 세종은 반포 때까지 백성이 새 글자를 쓰는 모습을 보지 못했다.'
          p3: '세종은 역사에서처럼 눈병이 나아지지 않은 채 궁으로 돌아갔다.'
        shift:
          p1:
            was: '1444년 음력 2월, 집현전은 새 글자로 『운회』를 옮기는 작업을 이어 갔다.'
          p2:
            was: '새 글자는 1446년 『훈민정음』으로 반포되었다. 세종은 4년 뒤에 세상을 떠났다.'
            now: '초정 행궁 밖에서 장사하던 한 여인이 자기 이름을 쓰게 되었다. 이 소식이 궁에 전해졌다.'
          p3:
            was: '세종은 오랫동안 눈병을 앓아 1444년 봄 초정에서 요양했다. 이후 몸이 쇠약해져 1450년에 세상을 떠났다.'
            now: '초정의 샘가에서 만난 이방인이 눈병을 덜어 주었다. 그해 여름 세종은 궁에 돌아와 상소와 새 글자의 교정지를 직접 읽을 수 있었다.'
        vignettes:
          gesture: '{staff}는 학자가 글자를 그리기 전에 입 모양을 만들어 보는 것을 보고, 그 모양을 글자 옆 여백에 그려 두었다.'
          spacing: '{staff}는 종이에 네모 칸을 긋고 한 음절을 이루는 글자들이 같은 칸에 모이게 한 뒤 말없이 책상에 내려놓았다.'
          lesson: '{staff}는 장터에서 아이에게 나뭇가지로 흙 위에 글자 세 자를 써 보였다. 아이는 그것을 한 음절로 읽고 달려갔다.'
text:
  en:
    name: King Sejong and the scholars
    text: King of Joseon, 1397 to 1450. With scholars of the Hall of Worthies he had a new alphabet devised for Korean, promulgated in 1446 as Hunminjeongeum, so that ordinary people could learn to read.
  zh:
    name: 世宗大王与学者们
    text: 朝鲜国王，1397 年生，1450 年去世。他与集贤殿的学者创制了一套适合朝鲜语的新文字，1446 年颁布，名为《训民正音》，好让百姓学会读写。
quotes:
  sejong_daily_use:
    order: 1
    tier: full
    date: '1446'
    checked: official_record
    sources: [sejong_nikh_preface]
    original: zh
    text:
      zh:
        who: '世宗'
        quote: '予爲此憫然，新制二十八字，欲使人人易習便於日用耳。'
        occasion: '《训民正音》御制序，说明制字的用意（原文为汉文）'
      en:
        who: 'King Sejong'
        quote: 'Moved by this, I made twenty-eight new letters, so that everyone could learn them easily and use them in daily life.'
        occasion: 'Royal preface to Hunminjeongeum, explaining the purpose of the letters'
      ko:
        who: '세종'
        quote: '내 이를 가엾게 여겨 새로 스물여덟 자를 만드니, 사람마다 쉽게 익혀 날마다 쓰는 데 편하게 하고자 할 따름이다.'
        occasion: '『훈민정음』 어제 서문, 한문을 현대 한국어로 옮김'
      zh-Hant:
        who: '世宗'
        quote: '予為此憫然，新制二十八字，欲使人人易習便於日用耳。'
        occasion: '《訓民正音》御製序，說明制字的用意（原文為漢文）'
      fr:
        who: 'Roi Sejong'
        quote: 'Ému par cela, j''ai réalisé vingt-huit nouvelles lettres, afin que chacun puisse les apprendre facilement et les utiliser dans la vie quotidienne.'
        occasion: 'Préface royale au Hunminjeongeum, expliquant le but des lettres'
      es:
        who: 'Rey Sejong'
        quote: 'Movido por esto, hice veintiocho letras nuevas, para que todos pudieran aprenderlas fácilmente y utilizarlas en la vida diaria.'
        occasion: 'Prefacio real a Hunminjeongeum, que explica el propósito de las cartas.'
      ja:
        who: '世宗大王'
        quote: 'これに感動して、誰もが簡単に覚えて日常生活で使えるように、新たに28文字を作りました。'
        occasion: '文字を作った目的を説明する『訓民正音』の御製序文。'
      ru:
        who: 'Король Седжон'
        quote: 'Вдохновленный этим, я составил двадцать восемь новых букв, чтобы каждый мог легко их выучить и использовать в повседневной жизни.'
        occasion: 'Королевское предисловие к «Хунминджонгым», объясняющее цель писем.'
  sejong_unheard_words:
    order: 2
    tier: none
    date: '1446'
    checked: official_record
    sources: [sejong_nikh_preface]
    original: zh
    text:
      zh:
        who: '世宗'
        quote: '有所欲言，而終不得伸其情者多矣。'
        occasion: '《训民正音》御制序，说的是有话却写不出的人（原文为汉文）'
      en:
        who: 'King Sejong'
        quote: 'Many have something they wish to say, yet in the end cannot make themselves understood.'
        occasion: 'Royal preface to Hunminjeongeum, on people who lacked a way to write what they meant'
      ko:
        who: '세종'
        quote: '말하고자 하는 바가 있어도 끝내 제 뜻을 펴지 못하는 사람이 많다.'
        occasion: '『훈민정음』 어제 서문, 한문을 현대 한국어로 옮김'
      zh-Hant:
        who: '世宗'
        quote: '有所欲言，而終不得伸其情者多矣。'
        occasion: '《訓民正音》御製序，說的是有話卻寫不出的人（原文為漢文）'
      fr:
        who: 'Roi Sejong'
        quote: 'Beaucoup ont quelque chose à dire, mais ne parviennent finalement pas à se faire comprendre.'
        occasion: 'Préface royale au Hunminjeongeum, sur les personnes qui n''avaient pas le moyen d''écrire ce qu''elles voulaient dire'
      es:
        who: 'Rey Sejong'
        quote: 'Muchos tienen algo que quieren decir, pero al final no pueden hacerse entender.'
        occasion: 'Prefacio real a Hunminjeongeum, sobre las personas que carecían de una forma de escribir lo que querían decir'
      ja:
        who: '世宗大王'
        quote: '言いたいことがあっても、結局自分のことを理解してもらえない人はたくさんいます。'
        occasion: '自分の言いたいことを書く方法がなかった人々についての『訓民正音』の王室序文'
      ru:
        who: 'Король Седжон'
        quote: 'У многих есть что-то, что они хотят сказать, но в конце концов не могут объясниться.'
        occasion: 'Королевское предисловие к «Хунминджонгым» о людях, которые не умели написать, что они имели в виду.'
hook: {en: 'Read the syllable from its parts.', zh: '拆开一格，听见一个音节'}
facts:
  created:
    date: '1443'
    stay_day: 35
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_hunminjeongeum, languages_numbers_hangul]
    text:
      en: 'The new script of twenty eight letters was finished in 1443, the twenty fifth year of Sejong.'
      zh: '新文字二十八个字母于 1443 年，即世宗二十五年制成。'
    line:
      en: 'The end of 1443: King Sejong finishes twenty eight letters for writing Korean.'
      zh: '1443 年岁末，世宗制成二十八个字母，用来书写朝鲜语。'
      ko: '1443년 말, 세종이 우리말을 적는 새 글자 스물여덟 자를 완성했다.'
      zh-Hant: '1443 年歲末，世宗製成二十八個字母，用來書寫朝鮮語。'
      fr: 'Fin 1443 : le roi Sejong termine vingt-huit lettres pour écrire le coréen.'
      es: 'Finales de 1443: el rey Sejong termina veintiocho cartas para escribir en coreano.'
      ja: '1443年末、世宗が朝鮮語を書くための28字を完成させる。'
      ru: 'Конец 1443 года: король Седжон заканчивает писать двадцать восемь букв по-корейски.'
  memorial:
    date: '1444'
    stay_day: 92
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [languagelog_choe, languages_numbers_hangul]
    text:
      en: 'In the second month of 1444 Choe Manri, first counsellor of the Hall of Worthies, sent up a memorial on behalf of himself and six colleagues raising objections; scholars differ on whether it attacked the script itself or Sejong''s wider reform of Sino-Korean pronunciation.'
      zh: '1444 年二月，集贤殿副提学崔万理代表自己和六位同僚上疏提出异议；学者对此疏反对的是新字本身，还是世宗对汉字音的更大改革，看法不一。'
    line:
      en: 'The second month of 1444: Choe Manri and six colleagues of the Hall of Worthies send up a memorial raising objections.'
      zh: '1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。'
      ko: '1444년 음력 2월, 최만리와 집현전 동료 여섯 명이 상소를 올려 이의를 제기했다.'
      zh-Hant: '1444 年二月，集賢殿的崔萬理與六位同僚聯名上疏，提出異議。'
      fr: 'Le deuxième mois de 1444 : Choe Manri et six collègues du Hall of Worthies envoient un mémoire soulevant des objections.'
      es: 'El segundo mes de 1444: Choe Manri y seis colegas del Salón de los Dignoes envían un memorial planteando objeciones.'
      ja: '1444年の第2月、崔万理と集賢殿の同僚六人が反対の上疏を出す。'
      ru: 'Второй месяц 1444 года: Чхве Манри и шесть коллег из Зала Достойных отправляют мемориал, в котором выражают возражения.'
  promulgated:
    date: '1446'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [sejong_hangul_primary, wikipedia_hunminjeongeum]
    text:
      en: 'The script was promulgated in 1446 as Hunminjeongeum, with the explanatory edition known as the Haerye.'
      zh: '1446 年，新字以《训民正音》之名颁布，并有解说本《训民正音解例》。'
    line:
      en: '1446: the letters are promulgated as Hunminjeongeum, the correct sounds for teaching the people.'
      zh: '1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。'
      ko: '1446년, 백성을 가르치는 바른 소리라는 뜻의 『훈민정음』이 반포되었다.'
      zh-Hant: '1446 年，新字以《訓民正音》之名頒佈，意為教百姓的正確字音。'
      fr: '1446 : les lettres sont promulguées sous le nom de Hunminjeongeum, les sons corrects pour enseigner au peuple.'
      es: '1446: las letras se promulgan como Hunminjeongeum, los sonidos correctos para enseñar al pueblo.'
      ja: '1446年: この文字は人々に教えるための正しい音である訓民正音として公布されました。'
      ru: '1446: буквы обнародованы как «Хунминджонгым», правильные звуки для обучения людей.'
  sejong_dies:
    date: '1450'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [languages_numbers_hangul, wikipedia_hunminjeongeum]
    text:
      en: 'Sejong died in 1450.'
      zh: '世宗于 1450 年去世。'
    line:
      en: '1450: King Sejong dies.'
      zh: '1450 年，世宗去世。'
      ko: '1450년, 세종이 세상을 떠났다.'
      zh-Hant: '1450 年，世宗去世。'
      fr: '1450 : Mort du roi Sejong.'
      es: '1450: Muere el rey Sejong.'
      ja: '1450年：世宗大王が死去。'
      ru: '1450: умирает король Седжон.'
