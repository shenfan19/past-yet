    text:
      en:
        name: An alphabet anyone can learn
        place: Seoul
        figure: King Sejong and the scholars
        story: 'The Haerye edition promulgated in 1446 explains the writing system completed under Sejong in 1443. The card uses 1443 as its setting; the reading lesson is invented.'
        relic: A woodblock of letters
        relic_desc: A block carved with the first letters, ready to ink.
        points:
          p1: 'Find the beginning of the spoken syllable'
          p2: 'Group the marks that belong to one syllable'
          p3: 'Help the learner read a familiar word back'
        vignettes:
          gesture: 'You repeat the sound slowly until the learner can describe what the tongue is doing. They return to the written mark and try it again without your voice.'
          spacing: 'The learner leaves a line of parts in a row. You draw a box around the ones that belong together and ask them to read the group as one syllable.'
          lesson: 'The learner sounds out a familiar word and leaves a gap for the part they have forgotten. You cover the earlier example and wait until they can fill it from memory.'
      zh:
        name: 人人都学得会的字母
        place: 首尔
        figure: 世宗大王与学者们
        story: '1446 年刊行的《训民正音》解例本说明了世宗在 1443 年完成的文字。本卡以 1443 年为背景，识字练习是虚构的。'
        relic: 一块刻着字母的木板
        relic_desc: 刻着最早几个字母的木板，等着上墨。
        points:
          p1: '听出这个音节从哪里起音'
          p2: '把属于同一音节的字形排在一起'
          p3: '帮习字人把熟悉的词再读出来'
        vignettes:
          gesture: '你把那个音放慢，直到习字人能说清舌头在哪里。他回到纸上的字形，这次不用你领读就试了一遍。'
          spacing: '习字人把几部分排成一长行。你用方框圈起属于同一组的几笔，请他合起来读成一个音节。'
          lesson: '习字人念出一个熟词，忘记的部分空着。你把前面的例字盖上，等他想起来，自己把空处填了。'
text:
  en:
    name: King Sejong and the scholars
    text: King of Joseon, 1397 to 1450. With scholars of the Hall of Worthies he had a new alphabet devised for Korean, promulgated in 1446 as Hunminjeongeum, so that ordinary people could learn to read.
  zh:
    name: 世宗大王与学者们
    text: 朝鲜国王，1397 年生，1450 年去世。他与集贤殿的学者创制了一套适合朝鲜语的新文字，1446 年颁布，名为《训民正音》，好让百姓学会读写。
