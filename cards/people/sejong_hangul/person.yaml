    text:
      en:
        name: An alphabet anyone can learn
        place: Seoul
        figure: King Sejong and the scholars
        story: 'In 1443 King Sejong of Joseon made twenty eight letters for writing Korean. In the second month of 1444 Choe Manri, of the Hall of Worthies, sent up a memorial with six colleagues raising objections. The new letters were promulgated in 1446 as Hunminjeongeum, the correct sounds for teaching the people. Sejong died in 1450.'
        relic: A woodblock of letters
        relic_desc: A block carved with the first letters, ready to ink.
        points:
          p1: 'In the days of the memorial, keep the draft translation of the rhyme book Yunhui into the new letters safe in the council hall, so that the work goes on'
          p2: 'Let him see with his own eyes someone who never went to school write their own name in the new letters'
          p3: 'At Chojeong, ease the trouble in his eyes so that he can still see the new letters clearly'
        points_fail:
          p1: 'In those days the draft was scattered and the work stopped, and the new letters lost their first use.'
          p2: 'In this branch, until the promulgation he never saw anyone among the people use the new letters.'
          p3: 'He went back to the palace with his eyes no better, as in history.'
        shift:
          p1:
            was: 'In the second month of 1444 the work of the Hall of Worthies on rendering the rhyme book Yunhui in the new letters went on.'
          p2:
            was: 'In 1446 the new letters were proclaimed as Hunminjeongeum, and Sejong died four years later.'
            now: 'A stallholder outside the travelling palace at Chojeong learned to write her own name, and someone reported it to the court.'
          p3:
            was: 'Sejong suffered for years with his eyes, went to Chojeong in the spring of 1444 to recover, grew weaker from then on and died in 1450.'
            now: 'A stranger by the springs at Chojeong made his eyes a little better, and when he went back to the palace that summer he could still read memorials and the proofs of the new letters himself.'
        vignettes:
          gesture: '{staff} watches a scholar shape his lips before he draws a letter, and copies the shape of the mouth in the margin beside it.'
          spacing: '{staff} rules a sheet into squares so that the parts of each syllable sit together in one square, and leaves it on the table without a word.'
          lesson: '{staff} draws three letters in the dust with a stick for a child at the market, and the child reads them back as a sound before running off.'
        story_prose:
          opening:
            - Seoul, 1443. Sejong made twenty-eight new letters. People could speak Korean, but writing it meant learning a script very different from the words they said at home.
            - In this branch a stallholder outside the royal residence at Chojeong keeps track of every debt. Whenever she has to sign the account, she hands the brush to someone else. She has never seen the new letters.
            - Officials object, and the translation draft has to be kept safe. Sejong’s eyes are troubling him, too. Someone who can teach the stallholder to write her name can show him what the letters let her do.
          outcomes:
            p2: The stallholder drew the ledger back and finished her name stroke by stroke. Nobody beside her took the brush. What reached Sejong was news that she had signed for herself.
            p3: Back from Chojeong, Sejong drew the proof of the new letters close. He could still see enough to turn the page himself.
            p1: The draft was still there, and the scholars could pick up where they had left off.
          none: Back at the office, {staff} remembered the stallholder handing over the brush. Someone else still had to write her name.
          desync: After the memorial the draft was scattered. Work could not resume, and the office called {staff} back.
          not_admitted: '{staff} never got to teach the stallholder the new letters. The next page of the ledger was still waiting for someone else’s hand.'
          points:
            p1: In the days of the memorial, {staff} kept the draft translation of the Yunhui in order in the council hall. When the scholars returned, they could start on the same page.
            p2: 'Outside the royal residence the stallholder sounded out her name and put the sounds on paper. At the last stroke she turned the sheet upright and read it back. The message that reached Sejong was brief: someone who had never gone to school could now write her own name.'
            p3: Back from Chojeong, Sejong held up a proof of the new letters. The type was small and he read slowly. When it was time to turn the page, he reached out and did it himself.
          excerpts:
            p2: 'At the last stroke she turned the sheet upright and read it back. The message that reached Sejong was brief: someone who had never gone to school could now write her own name.'
            p3: The type was small and he read slowly. When it was time to turn the page, he reached out and did it himself.
      zh:
        name: 人人都学得会的字母
        place: 首尔
        figure: 世宗大王与学者们
        story: '1443 年，朝鲜世宗亲制二十八个字母，用来书写朝鲜语。1444 年二月，集贤殿的崔万理与六位同僚联名上疏，提出异议。1446 年，新字以《训民正音》之名颁布，意为教百姓的正确字音。世宗于 1450 年去世。'
        story_prose:
          opening:
            - 1443 年，汉城。世宗做了二十八个新字母。朝鲜语可以说出口，可想把嘴里的话写下来，得先学一套和自己说话很不一样的文字。世宗想让一张纸也能用来写家常话。
            - 在这条分支里，初水行宫外有个摊主。她会一笔笔算清欠账，每次要把自己的名字写到账上，却得把笔交给别人。她还没见过宫里的新字。
            - 宫里有人上疏反对，新字译成的书稿要先护住。世宗也正为眼疾所苦。若有人能教摊主写出名字，再把那张纸带进宫，世宗就能看到新字第一次在她手里有什么用。
          outcomes:
            p2: 摊主把账页拉回自己面前，一笔一笔写完名字。旁边的人等了一会儿，没有替她接过笔。后来消息传进了行宫。
            p3: 从初水回宫那天，世宗把新字的校样拉到眼前，还能自己看清一页。
            p1: 新字译稿还在，集贤殿可以继续工作。
          none: 回到事务所后，{staff}想起摊主递笔时的那一下。那张账页照旧记得清卖了多少，名字还是别人替她写的。
          desync: 上疏之后，新字译稿散了。宫里的工作没能接续，{staff}在还能教摊主写字之前就被召回了。
          not_admitted: '{staff}没能留到把新字教给摊主的时候。她又翻过一页账，纸上仍等着别人替她签名。'
          excerpts:
            p2: 最后一笔落下时，她把纸转正，低头从头认了一遍。有人把这件事报进了行宫。宫里等来的消息很短，只说一个从没念过书的人，已经能把自己的名字写下来了。
            p3: 字小，他看得慢，到翻页的时候，仍是自己伸手把纸翻了过去。
          points:
            p1: 上疏那几天，{staff}把用新字译《韵会》的稿页按次序放好，留在议事厅。集贤殿的人回来时，还能接着先前的那一页往下做。
            p2: 初水行宫外，摊主把自己的名字慢慢念了一遍，跟着那几声在纸上写。最后一笔落下时，她把纸转正，低头从头认了一遍。有人把这件事报进了行宫。宫里等来的消息很短，只说一个从没念过书的人，已经能把自己的名字写下来了。
            p3: 从初水回宫后，世宗把新字的校样举到眼前。字小，他看得慢，到翻页的时候，仍是自己伸手把纸翻了过去。
        relic: 一块刻着字母的木板
        relic_desc: 刻着最早几个字母的木板，等着上墨。
        points:
          p1: '上疏那几天，护住议事厅里用新字译《韵会》的草稿，让这件事照常往下做'
          p2: '让他亲眼看到一个从没念过书的百姓用新字写出自己的名字'
          p3: '在初水，减轻他的眼疾，让他还看得清新字'
        points_fail:
          p1: '译稿在那几天散了、停了，新字少了第一件用场。'
          p2: '这条分支里，他到颁布之前都没见过一个百姓用上新字。'
          p3: '他照旧带着眼疾回宫，这条分支与历史一样。'
        shift:
          p1:
            was: '1444 年二月，集贤殿用新字翻译《韵会》的工作照常进行。'
          p2:
            was: '1446 年，新字以《训民正音》之名颁布，四年后世宗去世。'
            now: '初水的行宫外有个摊主会写自己的名字了，有人把这事报了上去。'
          p3:
            was: '世宗多年患眼疾，1444 年春去初水养病，此后身体每况愈下，1450 年去世。'
            now: '初水边一个外乡人帮他把眼睛治得轻了些，那年夏天他回宫时还能自己看奏章和新字的校样。'
        vignettes:
          gesture: '{staff}看见一位学士画字母之前先比了比嘴形，便在页边添了一笔，把嘴怎样张开和纸上的字留在一起。'
          spacing: '{staff}把纸划成方格，将一个音节的几部分写进同一格，等墨稍干，便把纸留在桌上。'
          lesson: '{staff}在集市上用树枝写下三个字母。孩子蹲着看了一会儿，把它们连起来念成一个音，念完便转身跑开了。'
      ko:
        name: '누구나 배울 수 있는 글자'
        place: '한성(서울)'
        figure: '세종과 집현전 학자들'
        story: '1443년 조선의 세종은 우리말을 적을 새 글자 스물여덟 자를 만들었다. 1444년 음력 2월, 집현전의 최만리와 동료 여섯 명이 상소를 올려 이의를 제기했다. 1446년 새 글자는 백성을 가르치는 바른 소리라는 뜻의 『훈민정음』으로 반포되었다. 세종은 1450년에 세상을 떠났다.'
        relic: '글자를 새긴 목판'
        relic_desc: '처음 만든 글자 몇 자를 새겨 먹을 묻히기만 하면 되는 목판.'
        points:
          p1: '상소 뒤에도 새 글자로 옮긴 『운회』 초고를 지키기'
          p2: '글을 모르는 백성이 새 글자로 이름을 쓰는 모습을 세종에게 보여 주기'
          p3: '초정에서 세종의 눈병을 덜어 새 글자를 계속 볼 수 있게 돕기'
        points_fail:
          p1: '며칠 사이 초고가 흩어지고 작업이 멈췄다. 새 글자는 처음 쓰일 곳을 잃었다.'
          p2: '이 시간선에서 세종은 반포 때까지 백성이 새 글자를 쓰는 모습을 보지 못했다.'
          p3: '세종은 역사에서처럼 눈병이 나아지지 않은 채 궁으로 돌아갔다.'
        shift:
          p1:
            was: '1444년 음력 2월, 집현전은 새 글자로 『운회』를 옮기는 작업을 이어 갔다.'
          p2:
            was: '새 글자는 1446년 『훈민정음』으로 반포되었다. 세종은 4년 뒤에 세상을 떠났다.'
            now: '초정 행궁 밖에서 장사하던 한 여인이 자기 이름을 쓰게 되었다. 이 소식이 궁에 전해졌다.'
          p3:
            was: '세종은 오랫동안 눈병을 앓아 1444년 봄 초정에서 요양했다. 이후 몸이 쇠약해져 1450년에 세상을 떠났다.'
            now: '초정의 샘가에서 만난 이방인이 눈병을 덜어 주었다. 그해 여름 세종은 궁에 돌아와 상소와 새 글자의 교정지를 직접 읽을 수 있었다.'
        vignettes:
          gesture: '{staff}는 학자가 글자를 그리기 전에 입 모양을 만들어 보는 것을 보고, 그 모양을 글자 옆 여백에 그려 두었다.'
          spacing: '{staff}는 종이에 네모 칸을 긋고 한 음절을 이루는 글자들이 같은 칸에 모이게 한 뒤 말없이 책상에 내려놓았다.'
          lesson: '{staff}는 장터에서 아이에게 나뭇가지로 흙 위에 글자 세 자를 써 보였다. 아이는 그것을 한 음절로 읽고 달려갔다.'
text:
  en:
    name: King Sejong and the scholars
    text: King of Joseon, 1397 to 1450. With scholars of the Hall of Worthies he had a new alphabet devised for Korean, promulgated in 1446 as Hunminjeongeum, so that ordinary people could learn to read.
  zh:
    name: 世宗大王与学者们
    text: 朝鲜国王，1397 年生，1450 年去世。他与集贤殿的学者创制了一套适合朝鲜语的新文字，1446 年颁布，名为《训民正音》，好让百姓学会读写。
quotes:
  sejong_daily_use:
    order: 1
    tier: full
    date: '1446'
    checked: official_record
    sources: [sejong_nikh_preface]
    original: zh
    text:
      zh: {who: '世宗', quote: '予爲此憫然，新制二十八字，欲使人人易習便於日用耳。', occasion: '《训民正音》御制序，说明制字的用意（原文为汉文）'}
      en: {who: 'King Sejong', quote: 'Moved by this, I made twenty-eight new letters, so that everyone could learn them easily and use them in daily life.', occasion: 'Royal preface to Hunminjeongeum, explaining the purpose of the letters'}
      ko:
        who: '세종'
        quote: '내 이를 가엾게 여겨 새로 스물여덟 자를 만드니, 사람마다 쉽게 익혀 날마다 쓰는 데 편하게 하고자 할 따름이다.'
        occasion: '『훈민정음』 어제 서문, 한문을 현대 한국어로 옮김'
  sejong_unheard_words:
    order: 2
    tier: none
    date: '1446'
    checked: official_record
    sources: [sejong_nikh_preface]
    original: zh
    text:
      zh: {who: '世宗', quote: '有所欲言，而終不得伸其情者多矣。', occasion: '《训民正音》御制序，说的是有话却写不出的人（原文为汉文）'}
      en: {who: 'King Sejong', quote: 'Many have something they wish to say, yet in the end cannot make themselves understood.', occasion: 'Royal preface to Hunminjeongeum, on people who lacked a way to write what they meant'}
      ko:
        who: '세종'
        quote: '말하고자 하는 바가 있어도 끝내 제 뜻을 펴지 못하는 사람이 많다.'
        occasion: '『훈민정음』 어제 서문, 한문을 현대 한국어로 옮김'
hook: {en: 'Read the syllable from its parts.', zh: '拆开一格，听见一个音节'}
