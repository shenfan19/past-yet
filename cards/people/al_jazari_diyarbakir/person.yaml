    text:
      en:
        name: A book of ingenious machines
        place: Diyarbakır
        figure: Al-Jazari
        story: 'Al-Jazari''s treatise on mechanical devices dates to 1206. A surviving manuscript folio copied in 1315 illustrates its elephant clock. This workshop''s demonstration is invented.'
        relic: A brass cam
        relic_desc: A shaped wheel that turns a spin into a stroke.
        points:
          p1: 'Find the visible figures on the diagram'
          p2: 'Describe the order in which two figures appear'
          p3: 'Help the apprentice leave the sketch readable for a visitor'
        vignettes:
          sequence: 'The apprentice explains every figure at once. You point to the first movement and ask what comes immediately after it. They start telling the story of the clock in order.'
          viewer: 'A visitor never looks up from the largest figure. You ask them to watch the spot the apprentice marked instead. On the second demonstration they see the smaller movement in time.'
          paper: 'You hold up the drawing while the apprentice points past it at the model. They add one small mark so a reader without the model will know where to look.'
      zh:
        name: 一本奇巧机械之书
        place: 迪亚巴克尔
        figure: 加扎里
        story: '加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。本卡的工坊示范为虚构。'
        relic: 一个黄铜凸轮
        relic_desc: 一个有形状的轮子，把转动变成往复。
        points:
          p1: '在图上找到能看见的人偶'
          p2: '说清两个人偶出现的先后'
          p3: '帮学徒把图留到来客也看得懂'
        vignettes:
          sequence: '学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。'
          viewer: '来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。'
          paper: '学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。'
text:
  en:
    name: Al-Jazari
    text: Engineer in the service of the Artuqid court, active around 1200. His 1206 Book of Knowledge of Ingenious Mechanical Devices describes water clocks, automata and pumps, with a crank and connecting rod and a crankshaft among its devices.
  zh:
    name: 加扎里
    text: 为阿尔图格王朝宫廷服务的工程师，活跃于 1200 年前后。他 1206 年的《精巧机械装置知识之书》记载了水钟、自动机和水泵，其中出现了曲柄连杆与曲轴。
