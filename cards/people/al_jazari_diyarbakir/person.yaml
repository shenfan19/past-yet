text:
  en:
    name: Al-Jazari
    text: Engineer in the service of the Artuqid court, active around 1200. His 1206 Book of Knowledge of Ingenious Mechanical Devices describes water clocks, automata and pumps, with a crank and connecting rod and a crankshaft among its devices.
  zh:
    name: 加扎里
    text: 为阿尔图格王朝宫廷服务的工程师，活跃于 1200 年前后。他 1206 年的《精巧机械装置知识之书》记载了水钟、自动机和水泵，其中出现了曲柄连杆与曲轴。
