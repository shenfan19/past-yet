quotes:
  al_jazari_diyarbakir_story_echo_full:
    order: 1
    tier: full
    date: '1206'
    checked: official_record
    sources: [al_jazari_diyarbakir_story_echo_source_full]
    original: ar
    text:
      en:
        who: 'Al-Jazari'
        quote: 'A practical art that is never tested in work remains uncertain between soundness and error.'
        occasion: 'Al-Jazari’s preface describes why a device must be tested in practice.'
      zh:
        who: '贾扎里'
        quote: '一门工艺若未在实践中验证，就不能确定它是否可靠。'
        occasion: '贾扎里在序言里谈器械的实际检验。'
      ar:
        who: 'Al-Jazari'
        quote: 'وكل علم صناعيّ لا يتحقّق بالعمل، فهو متردّد بين الصحّة والخلل'
        occasion: 'Al-Jazari’s preface describes why a device must be tested in practice.'
      zh-Hant:
        who: '加扎裡'
        quote: '一門工藝若未在實踐中驗證，就不能確定它是否可靠。'
        occasion: '賈扎裡在序言裡談器械的實際檢驗。'
      fr:
        who: 'Al-Jazari'
        quote: 'Un art pratique qui ne s''éprouve jamais dans le travail reste incertain entre la solidité et l''erreur.'
        occasion: 'La préface d’Al-Jazari explique pourquoi un appareil doit être testé dans la pratique.'
      es:
        who: 'Al-Jazari'
        quote: 'Un arte práctico que nunca se prueba en el trabajo permanece incierto entre la solidez y el error.'
        occasion: 'El prefacio de Al-Jazari describe por qué un dispositivo debe probarse en la práctica.'
      ja:
        who: 'アル＝ジャザリー'
        quote: '仕事でテストされることのない実践的な芸術は、健全性と誤りの間で不確かなままです。'
        occasion: 'アル＝ジャザリー氏の序文では、デバイスが実際にテストされなければならない理由が説明されています。'
      ko:
        who: '알자자리'
        quote: '작업에서 결코 테스트되지 않은 실용적인 예술은 건전성과 오류 사이에서 불확실한 상태로 남아 있습니다.'
        occasion: '알자자리의 서문에서는 실제로 장치를 테스트해야 하는 이유를 설명합니다.'
      ru:
        who: 'Аль-Джазари'
        quote: 'Практическое искусство, которое никогда не проверяется в работе, остается неопределенным между правильностью и ошибкой.'
        occasion: 'В предисловии Аль-Джазари описывается, почему устройство необходимо тестировать на практике.'
  al_jazari_diyarbakir_story_echo_none:
    order: 2
    tier: none
    date: '1206'
    checked: official_record
    sources: [al_jazari_diyarbakir_story_echo_source_none]
    original: ar
    text:
      en:
        who: 'Al-Jazari'
        quote: 'and forms I devised, without knowing that anyone preceded me in them'
        occasion: 'The preface describes several of the author’s additions to the existing craft.'
      zh:
        who: '贾扎里'
        quote: '也有我想出的样式，我未听说先前有人做过。'
        occasion: '序言里作者说到自己在原有工艺之外做过的探索。'
      ar:
        who: 'Al-Jazari'
        quote: 'وأشكال اخترعتها، ولم أعلم أنّي سُبِقت إليها'
        occasion: 'The preface describes several of the author’s additions to the existing craft.'
      zh-Hant:
        who: '加扎裡'
        quote: '也有我想出的樣式，我未聽說先前有人做過。'
        occasion: '序言裡作者說到自己在原有工藝之外做過的探索。'
      fr:
        who: 'Al-Jazari'
        quote: 'et les formes que j''ai imaginées, sans savoir que personne ne m''y a précédé'
        occasion: 'La préface décrit plusieurs des ajouts de l’auteur au métier existant.'
      es:
        who: 'Al-Jazari'
        quote: 'y formas que ideaba, sin saber que nadie me precedía en ellas'
        occasion: 'El prefacio describe varias de las adiciones del autor al oficio existente.'
      ja:
        who: 'アル＝ジャザリー'
        quote: 'そして、私が考案した形式は、その中で誰かが私より先にいたとは知らずに'
        occasion: '序文では、既存の技術に対する著者の追加のいくつかについて説明します。'
      ko:
        who: '알자자리'
        quote: '그리고 내가 고안한 형태는 나보다 앞서는 사람이 있다는 것을 알지 못한 채 만들어졌습니다.'
        occasion: '서문에서는 저자가 기존 기술에 추가한 몇 가지 사항을 설명합니다.'
      ru:
        who: 'Аль-Джазари'
        quote: 'и формы я придумал, не зная, что кто-то предшествовал мне в них'
        occasion: 'В предисловии описаны некоторые авторские дополнения к существующей поделке.'
