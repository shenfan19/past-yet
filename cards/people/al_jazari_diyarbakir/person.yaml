    text:
      en:
        name: A book of ingenious machines
        place: Diyarbakır
        figure: Al-Jazari
        story: 'Al-Jazari''s treatise on mechanical devices dates to 1206. A surviving manuscript folio copied in 1315 illustrates its elephant clock.'
        story_prose:
          opening:
            - 'In Amid a clerk opens a list of pages on the delivery table. Someone arrives with the drawings and says one of their headings could belong to two chapters. The bench is going into shadow. Al-Jazari asks them to check again while they can see.'
            - 'Al-Jazari completed his book of mechanical devices in 1206. Surviving copies preserve descriptions alongside drawings. Here you can protect the handover and ask him to choose a reference set for later copyists.'
            - 'Have someone who can match a caption to a paragraph check the delivery copy. A copyist can ask which notes and blank spaces the author wants left as they are.'
          points:
            p1: 'The clerk points to a repeated heading in the contents. Al-Jazari tells him to turn another page, where you see a mark beside the second drawing leading somewhere else. You add the two page references to the handover list and have the recipient test it himself. He shuts the book and says he found them both.'
            p2: 'The copyist wants to save space by putting the marginal note into the main text. Al-Jazari has him read the original sentence up to the pause, and you label the different source of the note beside it. The next reader can still see where the author left a blank. The copyist lifts his pen and gives the addition a separate label below.'
          outcomes:
            all: 'The clerk receives the complete manuscript. A second copy keeps the references and gives later copyists a way to identify the original captions.'
            p1: 'The set is delivered whole and its contents lead to each illustration. There is still no reference copy that separates the newer notes.'
            p2: 'The origins of the notes are identified. The delivery set still lacks a matching drawing and the trip cannot keep the entire handover.'
          none: 'The repeated headings remain unresolved. The next copyist arrives and has to ask which volume to open.'
          not_admitted: 'The clerk reads the names of the people receiving the set. No one calls for you and the contents stay closed.'
          desync: 'Several drawings can no longer be matched to the contents. The set cannot be delivered and the office recalls the traveller.'
          excerpts:
            p1: 'He shuts the book and says he found them both.'
            p2: 'The copyist lifts his pen and gives the addition a separate label below.'
        relic: A brass cam
        relic_desc: A shaped wheel that turns a spin into a stroke.
        points:
          p1: 'At the handover in Amid, check the descriptions and illustrations against the contents so the manuscript can be delivered complete'
          p2: 'Choose a reference copy with the author. List the notes, captions and blank spaces that later copyists should keep distinct'
        points_fail:
          p1: 'Several diagrams can no longer be matched to their sections. The manuscript cannot be handed over as a set, and the office recalls the employee.'
          p2: 'The next copyist works from a draft that has accumulated other notes. Readers cannot tell the author''s description from later additions.'
        shift:
          p1:
            was: 'The colophon of an early Topkapı manuscript gives January 16, 1206, as its completion date. Al-Jazari’s book was associated with the Artuqid court in Amid.'
          p2:
            was: 'Later manuscripts do not all descend through the same branch. Some have different illustrations and wording.'
            now: 'The collection keeps a copy checked by the author. A later scribe can record their own changes separately and then check captions against it.'
            who: al_jazari_diyarbakir
            bio: 'Al-Jazari wrote his descriptions in Amid. The text and illustrations changed together as the book was copied and moved between places.'
        vignettes:
          sequence: 'The apprentice explains every figure at once. You point to the first movement and ask what comes immediately after it. They start telling the story of the clock in order.'
          viewer: 'A visitor never looks up from the largest figure. You ask them to watch the spot the apprentice marked instead. On the second demonstration they see the smaller movement in time.'
          paper: 'You hold up the drawing while the apprentice points past it at the model. They add one small mark so a reader without the model will know where to look.'
      zh:
        name: 一本奇巧机械之书
        place: 迪亚巴克尔
        figure: 加扎里
        story: '加扎里的机械装置著作成于 1206 年。现存 1315 年抄本的一页画出了书中的象钟。'
        story_prose:
          opening:
            - '阿米德的交稿桌上，书吏摊开写有页数的目录。另一个人抱着图册走来，说有张图的题名能归到两章。桌上快没光了，贾扎里请他们趁有光再核一遍。'
            - '贾扎里的机械著作在 1206 年完成，存世抄本留下说明和图页。这次可以守住书稿的交接，再请作者为后来传抄挑一份有据可依的底本。'
            - '会把图题与段落对齐的人先去核交付册。懂抄写的人可以问作者，旁注和空处哪一些要原样留下。'
          points:
            p1: '书吏指着第二个同名题头，说是目录多写了一遍。贾扎里请他往后翻，你在第二张图边看见指向另一页的记号。你把卷和图对应的页写进交付清单，请接册的人自己照目录试一次。他合上书，说两张都找到了。'
            p2: '抄写人想趁重新抄一遍，把旁注放进正文省地方。贾扎里让他把已有的正文读到停顿处，你把旁注的另一个来处写在边上。读者翻过这一张时还能看见作者留的空栏。抄写人提起笔，改在底下另添一张标明出处的纸签。'
          outcomes:
            all: '书稿如期交付。另外留着一份可参照的底本，后来抄写人可以顺着签条辨认原来的图注。'
            p1: '交付册成套收下，目录能领人找到图。还没留出一份能分辨新旧旁注的底本。'
            p2: '旁注的来源已经分开写下。交稿的另一册还是缺了对应图，无法保留整次交接。'
          none: '两张相似题头的位置没核定。下一位抄手先来问究竟该找哪一本。'
          not_admitted: '书吏报出接册人的名字。没被叫到的人留在桌外，目录仍合着。'
          desync: '几幅图脱开目录，书稿没能成套交付。事务所因同步失败召回员工。'
          excerpts:
            p1: '他合上书，说两张都找到了。'
            p2: '抄写人提起笔，改在底下另添一张标明出处的纸签。'
        relic: 一个黄铜凸轮
        relic_desc: 一个有形状的轮子，把转动变成往复。
        points:
          p1: '在阿米德交稿时，按目录把装置说明和对应图页逐册核齐，护住书稿完成'
          p2: '和作者一起选一册留作传抄底本，列出旁注、图题与后来抄写人不得合并的空白栏'
        points_fail:
          p1: '几幅图无从对回章节，书稿无法成套交付，事务所因同步失败召回员工。'
          p2: '下一位抄手只能从已混入不同注记的工作本起抄，读者分不开作者所见与后来补记。'
        shift:
          p1:
            was: '托普卡帕所藏早期抄本的题记给出 1206 年 1 月 16 日的完成日期。贾扎里的书与阿米德的阿尔图格宫廷相连。'
          p2:
            was: '研究所见的后代抄本并非全从同一传抄支系而来，有的图与文本都出现差异。'
            now: '库房留下一册有作者核验记号的样本。后来抄写人能在抄本前另记自己的修订，也能拿图题对照底本。'
            who: al_jazari_diyarbakir
            bio: '贾扎里在阿米德写下对机械装置的说明，图与文字在后来多次传抄和跨地流通中一同变化。'
        vignettes:
          sequence: '学徒一开口便把所有人偶都说到。你指着第一个动作，问紧跟着是哪一下。他这回按着先后讲起钟来。'
          viewer: '来客始终盯着最大的人偶。你请他改看学徒作了记号的地方。第二遍，他赶在小人偶动的时候看见了。'
          paper: '学徒越过图指向模型，你把纸举稳。他补了一处小记号，让手边没模型的人也知道该看哪里。'
text:
  en:
    name: Al-Jazari
    text: Engineer in the service of the Artuqid court, active around 1200. His 1206 Book of Knowledge of Ingenious Mechanical Devices describes water clocks, automata and pumps, with a crank and connecting rod and a crankshaft among its devices.
  zh:
    name: 加扎里
    text: 为阿尔图格王朝宫廷服务的工程师，活跃于 1200 年前后。他 1206 年的《精巧机械装置知识之书》记载了水钟、自动机和水泵，其中出现了曲柄连杆与曲轴。
