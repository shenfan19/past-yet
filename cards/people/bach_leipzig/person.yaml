    text:
      en:
        name: The spring the oculist came
        place: Leipzig
        figure: Johann Sebastian Bach
        story: 'By the spring of 1750 Bach could barely read or write because of his eyesight. The travelling oculist John Taylor operated on him in Leipzig, and complications led to a second operation. Bach died on 28 July 1750.'
        story_prose:
          opening:
            - 'The Leipzig music stand has been moved to the window. Bach hears the helper turn a sheet upside down and asks him to begin by reading its part. John Taylor is in town. Someone in the house is waiting for Bach to say when he can see him.'
            - 'In spring 1750 Taylor operated on Bach’s eyes, and a second operation followed. Bach died on 28 July. This branch lets him hear another caregiver’s opinion and decide whether a reader would help him with his scores.'
            - 'Send someone with care experience to hear his concerns. A musician can ask whom he would like to read for him. Let the household say when there is time to talk.'
          points:
            p1: 'Bach pushes the score toward the visitor. You ask another caregiver to let him finish describing what worries him before discussing whether he can wait. Bach asks the family to decline the appointment and calls for a singer he knows to read two of the parts that afternoon. At the end of the first passage he asks the singer to read out the rests once more.'
          outcomes:
            all: 'That spring Bach sets a few readings for the hours with the best light. Someone reads and he listens with a hand on the keyboard case. The household still announces his death in July.'
            p1: 'Taylor’s appointment is cancelled. When the light reaches the stand, the reader starts at the pause Bach asked for.'
          none: 'The appointment goes ahead. Later, when the family clears the music stand, a page someone might have read for him is still on the table.'
          not_admitted: 'The family asks those waiting to stay in the front room. The traveller is never called in and hears nothing of what is discussed.'
          excerpts:
            p1: 'At the end of the first passage he asks the singer to read out the rests once more.'
        relic: An organ pipe cut from quill
        relic_desc: A small pipe, tuned and tested, left unsold.
        points:
          p1: 'Give Bach a second medical opinion before he consents to Taylor’s operation, and offer to arrange help with reading while he decides'
        points_fail:
          p1: 'Bach has no second opinion to weigh. He goes ahead with the operation, and complications lead to a second one.'
        shift:
          p1:
            was: 'In spring 1750 John Taylor operated on Bach’s eyes in Leipzig. Complications led to a second operation.'
            now: 'In this branch Bach decides to decline Taylor’s operation after speaking with {staff}. His sight remains poor, and he arranges for someone to read through a score with him in daylight.'
            who: bach_leipzig
            bio: 'In this branch Bach declines Taylor’s operation in spring 1750 and arranges help with reading his scores.'
        vignettes:
          entry: 'You hear the lower part arrive a breath before the singer expects it. You have them listen from the other side of the room. This time they raise their head before the cue.'
          rest: 'The singer loses count during the rest. You copy the line they can hear while waiting, and they mark the word that comes just before their own entrance.'
          light: 'Two singers share one page. You tilt it towards the light and hold it there until both can see the place where their lines separate.'
      zh:
        name: 眼医进城的那个春天
        place: 莱比锡
        figure: 约翰·塞巴斯蒂安·巴赫
        story: '到 1750 年春，巴赫的视力已差到难以读写。游方眼医约翰·泰勒在莱比锡给他动刀，术后并发症又引出了第二次手术。同年 7 月 28 日，巴赫去世。'
        story_prose:
          opening:
            - '莱比锡的谱架靠向窗口。巴赫听见来帮忙的人把纸倒过来，便请他先读纸上的声部。约翰·泰勒在城里行医，家里有人等巴赫答复哪天见他。'
            - '1750 年春，泰勒为巴赫做眼科手术，后来又进行第二次。巴赫当年 7 月 28 日去世。这个分支里，他能听到另一位医护人员的意见，再决定是否改用别人读谱帮忙。'
            - '派有医护经验的人去听他自己的顾虑，让识谱的员工确认他愿意由谁代读。进屋前，先问家人什么时段方便他谈。'
          points:
            p1: '他把谱纸往来客面前推了推。你请另一位医护人员先听巴赫把最担心的事说完，再说眼下可以先等一等。巴赫请家人回话推掉预约，叫熟识的歌者下午来替他念两个声部。第一段弹完，他让那位歌者把刚才的休止再从头念一次。'
          outcomes:
            all: '这一春巴赫把几次读谱排到光足的时候。有人读，他扶着琴沿听。七月家中仍传出他的死讯。'
            p1: '泰勒没有来动手术。下午光照到谱架时，帮手按巴赫自己的要求从该停的地方读起。'
          none: '约好的拜访照常进行。后来家人收拾谱架，桌上还压着没人来得及代读的一页。'
          not_admitted: '家人把等回话的人请到外间。没排上见面，你听不到里面有人讨论什么。'
          excerpts:
            p1: '第一段弹完，他让那位歌者把刚才的休止再从头念一次。'
        relic: 一根小风琴管
        relic_desc: 一根调好音、试过音的小管子，没有卖掉。
        points:
          p1: '在巴赫同意泰勒动刀前给他第二个医护意见，趁他还在考虑，问他是否愿意请人帮忙读谱'
        points_fail:
          p1: '巴赫没听到第二个医护意见，照原定安排接受手术。术后出现并发症，又动了一次刀。'
        shift:
          p1:
            was: '1750 年春，约翰·泰勒在莱比锡给巴赫做眼科手术。术后出现并发症，又动了一次刀。'
            now: '这条分支里，巴赫听过{staff}的意见后，推掉了泰勒的手术。他的视力仍差，便请人在白天陪他读谱。'
            who: bach_leipzig
            bio: '这条分支里，巴赫在 1750 年春推掉泰勒的手术，请人帮他读谱。'
        vignettes:
          entry: '你听出低声部比歌者预想的早到一口气。你请他换到屋子另一边听。这次，提示还没来，他就抬起了头。'
          rest: '歌者一唱到休止就数乱。你抄下等待时能听到的另一行，他在自己开口前的那个字上做了记号。'
          light: '两人合看一页谱。你把纸转向有光的地方，扶住不动，直到两人都看见自己的声部从哪儿分开。'
text:
  en:
    name: Johann Sebastian Bach
    text: German composer and organist, 1685 to 1750. From 1723 he was cantor of St Thomas in Leipzig, where he wrote cantatas, passions and keyboard works. He suffered from severe eyesight problems in his last years and died in July 1750.
  zh:
    name: 约翰·塞巴斯蒂安·巴赫
    text: 德国作曲家与管风琴家，1685 年生，1750 年去世。1723 年起他担任莱比锡圣托马斯教堂的乐长，写下清唱剧、受难曲和键盘作品。晚年视力严重受损，1750 年 7 月去世。
