        name: The first teaching
        place: Sarnath, India
        figure: Siddhartha Gautama
        story: In the Deer Park at Sarnath the Buddha gives his first teaching, on suffering and the path out of it.
        relic: A pressed bodhi leaf
        relic_desc: A leaf with its veins like a map.
        points:
          p1: "Listen to the first sermon"
          p2: "Watch the faces of the five companions"
          p3: "Walk the road with them to its end"
      zh:
        name: 第一次说法
        place: 印度鹿野苑
        figure: 悉达多·乔达摩
        story: 在鹿野苑，佛陀第一次说法，讲苦，也讲走出苦的路。
        relic: 一片压平的菩提叶
        relic_desc: 叶脉像一张地图。
        points:
          p1: "听第一次说法"
          p2: "留意五位同伴脸上的变化"
          p3: "陪着走完一段路"
text:
  en:
    name: Siddhartha Gautama
    text: Siddhartha Gautama, the Buddha, who lived in northern India around the fifth century BC. After years of seeking, he is said to have reached awakening at Bodh Gaya and to have given his first teaching at Sarnath on suffering and the way beyond it.
  zh:
    name: 悉达多·乔达摩
    text: 悉达多·乔达摩，即佛陀，生活在公元前五世纪前后的印度北部。传说他经多年修行于菩提伽耶觉悟，并在鹿野苑作了第一次说法，讲苦以及超越苦的道路。
