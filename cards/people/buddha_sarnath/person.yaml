    text:
      en:
        name: 'What the listener carries'
        place: Sarnath, India
        figure: Siddhartha Gautama
        story: 'The Buddhist discourse preserved as Saṃyutta Nikāya 56.11 places the teaching in the Deer Park at Isipatana near Varanasi, traditionally identified with Sarnath. It introduces a middle way and the four noble truths. The scene is not a dated transcript.'
        relic: 'A listener’s plain cord'
        relic_desc: 'A fictional keepsake from the walk to the Deer Park.'
        points:
          p1: 'Listen while the other person tries to recall the opening'
          p2: 'Separate what one person heard from what the other repeated'
          p3: 'Stay to hear the part the first listener missed'
        vignettes:
          middle: 'Nanda has remembered the rejection of two extremes but thinks the speaker stopped there. You wait while Sona recalls that a path was described next. Nanda tries the sequence aloud for the person she will meet later. This time she gets as far as the description of the path.'
          pause: 'Sona repeats three parts in a rush and hesitates on the fourth. You ask where she stopped hearing the speaker and started relying on Nanda. They try the retelling in turns. After that, each knows which part to ask the other about.'
          retell: 'You know later versions of the discourse will travel far. Nanda has to leave to meet someone and wants a short account she can remember on the walk. You listen to her try it once. You leave the park before hearing how the next person receives it.'
      zh:
        name: '听众带走的话'
        place: 印度鹿野苑
        figure: 悉达多·乔达摩
        story: '《相应部》56.11把这次说法置于波罗奈附近的仙人住处鹿野苑，传统上认作今鹿野苑。经中讲中道和四圣谛。'
        relic: '一段听众留下的素绳'
        relic_desc: '路上纪念物。'
        points:
          p1: '听另一人怎样回想开头'
          p2: '分清一人亲耳所听与另一人转述'
          p3: '再留一会儿，听完先走的人漏掉的那一段'
        vignettes:
          middle: '难陀只记住两端都不可取，以为说法就停在这儿。你等索那慢慢想起，后头其实还说了一条路。难陀练着照次序讲给晚点才会来的人听。这回她讲到了那条路。'
          pause: '索那一口气重述了三部分，到第四部分卡住了。你问她从哪儿开始是靠难陀转述，而非在场听见。两人轮流试着讲一遍，讲完都知道哪一段还要问对方。'
          retell: '你知道这段说法的传本会传得很远。难陀得去见个人，想要一段走在路上也记得住的讲法。你听她试了一遍。后来那个人怎么听，你离开鹿野苑时还不知道。'
text:
  en:
    name: Siddhartha Gautama
    text: Siddhartha Gautama, the Buddha, who lived in northern India around the fifth century BC. After years of seeking, he is said to have reached awakening at Bodh Gaya and to have given his first teaching at Sarnath on suffering and the way beyond it.
  zh:
    name: 悉达多·乔达摩
    text: 悉达多·乔达摩，即佛陀，生活在公元前五世纪前后的印度北部。传说他经多年修行于菩提伽耶觉悟，并在鹿野苑作了第一次说法，讲苦以及超越苦的道路。
hook: {en: 'One listener will have to tell it again.', zh: '有一个听众得再讲给别人听。'}
