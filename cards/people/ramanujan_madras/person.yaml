    text:
      en:
        name: 'A letter that asks to be checked'
        place: Madras
        figure: Srinivasa Ramanujan
        story: 'From March 1912 Srinivasa Ramanujan worked as a clerk in the accounts department of the Madras Port Trust. On Thursday, 16 January 1913, he wrote from there to G. H. Hardy in Cambridge, introducing his work and his study of divergent series. In 1914 he went to England. He died in 1920, after returning to India ill.'
        story_prose:
          opening:
            - 'Madras, January 1913. Srinivasa Ramanujan, twenty five, is a clerk in the accounts department of the Port Trust, checking ledgers by day and working at mathematics by night. On Thursday, 16 January, he writes from here to G. H. Hardy in Cambridge about the results he has reached outside any university course.'
            - 'In history, Hardy replied on 8 February asking him to write out his proofs; on 27 February he finished and sent a second letter, saying he was already a half starving man; the scholarship did not come until May, and until then the family lived on his salary of thirty rupees a month; in 1914 he went to England, fell gravely ill in 1917 without any firm diagnosis, and died in 1920 after returning to India, aged only 32. In this branch, a clerk at the Port Trust ties the packets for the overseas post, and a colleague in the accounts room shares his lamp.'
            - 'A few kinds of people can help on this trip: someone who can cook or look after people, someone strong willed with a nutrient synthesizer, or someone kind, patient and sturdy; someone who can keep accounts or has done some trading, someone orderly who knows their way about, or someone who calls with a gift box; a doctor or medic with a nano medical kit.'
          outcomes:
            all: 'In 1914 he sailed for England, with the slate in his luggage. Later, in Cambridge, he did not go into a sanatorium; after his return to India he did mathematics for many more years.'
            p3: 'In 1914 he went to England. Some years later, in Cambridge, he did not go into a sanatorium; after his return to India he did mathematics for many more years.'
            p2: 'That May the scholarship came, seventy five rupees a month. In those months the rice jar never ran empty.'
            p1: 'The letter reached Cambridge with a Madras postmark on its seal. In 1914 he sailed for England.'
          none: 'On the night of 27 February he collapsed under the lamp, the half written pages scattered on the table. In Cambridge, Hardy heard nothing more.'
          desync: 'On the night of 27 February he collapsed under the lamp. When {staff} was recalled, the half written letter lay under his arm, and the ink had run in a small blot.'
          not_admitted: '{staff} never got into the Port Trust, and only watched from outside as the clerks went in and out with their ledgers. The clerk who tied the packets read out the address on one, and paused at Cambridge.'
          points:
            p1:
              class_food: 'Late February: the reply Hardy had written on 8 February reached Madras, asking him to write out his proofs. Every night he bent over the lamp, filling one sheet and taking another, never more than half fed. {staff}, who could cook, brought a bowl of hot rice and a bowl of dal to the lamp each evening, and watched him finish before letting him go back to writing. On the night of 27 February the letter was done; he squared the sheets one by one, folded them and put them in the envelope. The colleague who shared his lamp was already asleep, and the wick was still burning.'
              class_medical: 'Late February: the reply Hardy had written on 8 February reached Madras, asking him to write out his proofs. Every night he bent over the lamp, filling one sheet and taking another, never more than half fed. {staff}, trained in care, brought his meals to the table on time, got him up every so often to walk a few steps and drink some water, and late at night turned the lamp down and made him lie down for a while. On the night of 27 February the letter was done; he squared the sheets one by one, folded them and put them in the envelope. The colleague who shared his lamp was already asleep, and the wick was still burning.'
              else: 'Late February: the reply Hardy had written on 8 February reached Madras, asking him to write out his proofs. Every night he bent over the lamp, filling one sheet and taking another, never more than half fed. {staff} brought his food to the table each day and sat up with him late into the night, pushing the water cup to his hand whenever his pen stopped. On the night of 27 February the letter was done; he squared the sheets one by one, folded them and put them in the envelope. The colleague who shared his lamp was already asleep, and the wick was still burning.'
            p2:
              class_lettered: 'April, and the rice jar at home was nearly empty again. Thirty rupees a month had to feed the whole family, and there was still no word of the scholarship. {staff}, used to desk work, wrote out the month''s income and spending item by item, how much to keep for rice, for oil, for rent, and worked out how many annas would be left at the end of the month. That evening the rice jar was full to the brim again. Ramanujan sat on the step by the door with the slate on his knees, writing stroke after stroke.'
              class_trade: 'April, and the rice jar at home was nearly empty again. Thirty rupees a month had to feed the whole family, and there was still no word of the scholarship. {staff}, who had done some trading, went to the market to find a rice merchant they knew, bought more at once and beat the price down. That evening the rice jar was full to the brim again. Ramanujan sat on the step by the door with the slate on his knees, writing stroke after stroke.'
              else: 'April, and the rice jar at home was nearly empty again. Thirty rupees a month had to feed the whole family, and there was still no word of the scholarship. {staff} sorted out the household spending item by item, measured out the rice and oil by the day, and took a box of gifts round to a family they knew, coming back with half a month of food. That evening the rice jar was full to the brim again. Ramanujan sat on the step by the door with the slate on his knees, writing stroke after stroke.'
            p3:
              class_learned: 'The end of May, and the scholarship had come. His old illness had come back; he was faint by turns and very thin, from a trouble that had set in years before and never been cured. {staff}, who knew medicine, asked about each time it had flared up over the years, saw that it was the old illness that had never gone away, opened the nano medical kit brought along, and cured it. A month later he was taking a second helping at meals, and sleeping soundly at night. At first light he would pick up the slate, and the chalk moved over it fast and close.'
              else: 'The end of May, and the scholarship had come. His old illness had come back; he was faint by turns and very thin, from a trouble that had set in years before and never been cured. {staff}, trained in medicine, gave him the treatment step by step as the nano medical kit''s instructions said, and noted his temperature and how much he ate each day, comparing one day against the next. A month later he was taking a second helping at meals, and sleeping soundly at night. At first light he would pick up the slate, and the chalk moved over it fast and close.'
          excerpts:
            p3: 'A month later he was taking a second helping at meals, and sleeping soundly at night. At first light he would pick up the slate, and the chalk moved over it fast and close.'
            p1: 'On the night of 27 February the letter was done; he squared the sheets one by one, folded them and put them in the envelope. The colleague who shared his lamp was already asleep, and the wick was still burning.'
            p2: 'That evening the rice jar was full to the brim again. Ramanujan sat on the step by the door with the slate on his knees, writing stroke after stroke.'
        relic: A slate
        relic_desc: A school slate, wiped and written on many times.
        points:
          p1: 'Through the hungry weeks of working by night, keep him on his feet so that the reply of 27 February to Hardy is written and sent'
          p2: 'Help his family through the months on thirty rupees a month, until the scholarship comes'
          p3: 'Before he leaves for England, see the old illness that keeps coming back and cure it'
        points_fail:
          p1: 'On 27 February he collapsed under the lamp, the reply was never written, and Hardy heard nothing more.'
          p2: 'In this branch the family''s food money still weighed on him beside each night''s working, and the record is one line short.'
          p3: 'He set out with the illness still in him, fell ill in 1917 and died in Kumbakonam in 1920, as in history.'
        shift:
          p1:
            was: 'On 27 February 1913 Ramanujan finished his reply to Hardy and sent it, writing that he was half starving.'
          p2:
            was: 'Until the scholarship came in May 1913, the family lived on his salary of thirty rupees a month.'
            now: 'The rice jar did not run empty in those months.'
          p3:
            was: 'He fell gravely ill in England in 1917, was never firmly diagnosed, went back to India in 1919 and died the next April, aged 32.'
            now: 'A stranger in Madras recognised the old illness in him and cured it before he travelled. He did not go into a sanatorium in Cambridge, and after his return to India he did mathematics for many more years.'
        vignettes:
          sums: '{staff} works out 1, 3, 6 and 10 as the first sums of a row of whole numbers beside a single total written at the end, and gives the column of sums its own heading.'
          future: '{staff} knows what will be written of this letter one day, and asks only what a man opening it for the first time will understand, and puts the covering page in front.'
          address: '{staff} asks the clerk to read the address on the packet aloud before it is tied, and keeps the date on a slip.'
      zh:
        name: '一封请人核算的信'
        place: 马德拉斯
        figure: 斯里尼瓦瑟·拉马努金
        story: '1912 年 3 月起，斯里尼瓦瑟·拉马努金在马德拉斯港务局会计部当职员。1913 年 1 月 16 日，星期四，他从那里给剑桥的 G. H. 哈代写信，介绍自己的研究和对发散级数的探索。1914 年他去了英国，1920 年病重回到印度后去世。'
        story_prose:
          opening:
            - '1913 年 1 月，马德拉斯。二十五岁的斯里尼瓦瑟·拉马努金在港务局会计部当职员，白天对账，夜里演算。1 月 16 日，星期四，他从这里给剑桥的 G. H. 哈代写信，讲自己在大学课程之外做出的结果。'
            - '史实里，哈代 2 月 8 日回了信，要他把证明写出来；2 月 27 日他写成第二封信寄出，信里说自己已经是个半饿着肚子的人；奖学金五月才下来，此前一家靠他每月三十卢比的薪水过活；1914 年他去了英国，1917 年病重，诊断一直没有定论，1920 年回到印度后去世，年仅 32 岁。在这条分支里，港务局有个负责捆寄海外纸包的职员，账房里有个和他合用一盏灯的同事。'
            - '这一趟用得上几种人：会做饭、会照顾人的人，或带着营养合成器、意志坚定的人，或性子和气耐心、身子结实的人；会管账、做过买卖，或条理清楚、熟门熟路的人，带一个礼品盒上门也行；带着纳米医疗箱的医生或医护。'
          outcomes:
            all: '1914 年，他上船去了英国，行李里装着那块石板。后来在剑桥，他没有住进疗养院；回到印度以后，他又做了很多年数学。'
            p3: '1914 年，他去了英国。几年后在剑桥，他没有住进疗养院；回到印度以后，又做了很多年数学。'
            p2: '那年五月，奖学金下来了，每月七十五卢比。那几个月，家里的米缸一直没有见底。'
            p1: '那封信寄到了剑桥，封口上盖着马德拉斯的邮戳。1914 年，他上船去了英国。'
          none: '2 月 27 日夜里，他倒在灯下，写了一半的纸页散在桌上。剑桥那边，哈代没有等到下文。'
          desync: '2 月 27 日夜里，他倒在灯下。{staff}被召回时，写了一半的信压在他的胳膊底下，墨迹洇开了一小片。'
          not_admitted: '{staff}没能进港务局，只在门外看着职员们抱着账本进进出出。负责捆纸包的那位职员念着封套上的地址，念到剑桥，停了一下。'
          points:
            p1:
              class_food: '2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}会做饭，每天傍晚把一碗热米饭和一碗豆汤送到灯下，看着他吃完，才让他接着写。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。'
              class_medical: '2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}懂照护，按时把饭送到桌边，隔一阵劝他起来走几步、喝口水，夜深了把灯捻小，催他躺下歇一会儿。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。'
              else: '2 月下旬，哈代 2 月 8 日写的回信寄到了马德拉斯，要他把证明写出来。他每晚伏在灯下，一张纸写满了又换一张，肚子却总是半饱。{staff}每天把饭送到桌边，夜里陪着坐到很晚，他的手一停，就把水杯推到他手边。2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。'
            p2:
              class_lettered: '四月，家里的米缸又快见底了。每月三十卢比的薪水要养活一家人，奖学金的事还没有下文。{staff}做惯了案头的事，把这个月的进出一项项写在纸上，米、油、房租各留多少，算到月底还能剩几个安那。那天晚上，米缸里的米又满到了缸沿。拉马努金坐在门口的台阶上，膝上搁着石板，一笔一笔写下去。'
              class_trade: '四月，家里的米缸又快见底了。每月三十卢比的薪水要养活一家人，奖学金的事还没有下文。{staff}做过买卖，去集市上找相熟的米商，一次多买几斗，把价钱压下来一截。那天晚上，米缸里的米又满到了缸沿。拉马努金坐在门口的台阶上，膝上搁着石板，一笔一笔写下去。'
              else: '四月，家里的米缸又快见底了。每月三十卢比的薪水要养活一家人，奖学金的事还没有下文。{staff}把家里的开销一样样理清，米和油按天分好，又提着一盒东西去相熟的人家，换回了半个月的口粮。那天晚上，米缸里的米又满到了缸沿。拉马努金坐在门口的台阶上，膝上搁着石板，一笔一笔写下去。'
            p3:
              class_learned: '五月底，奖学金已经下来了。他的旧病又犯了，人一阵阵发虚，瘦得厉害，这是好几年前就落下的病根，一直没有断。{staff}懂医，问清了这些年几回发病的经过，看出是那个没断根的旧病，打开带来的纳米医疗箱，把它治了下去。一个月后，他吃饭时多添了一碗，夜里也睡得安稳了。天一亮，他就拿起石板，粉笔在上面写得又快又密。'
              else: '五月底，奖学金已经下来了。他的旧病又犯了，人一阵阵发虚，瘦得厉害，这是好几年前就落下的病根，一直没有断。{staff}懂医护，照着纳米医疗箱里的说明一步步给他用药，每天记下他的体温和饭量，一样一样对着看。一个月后，他吃饭时多添了一碗，夜里也睡得安稳了。天一亮，他就拿起石板，粉笔在上面写得又快又密。'
          excerpts:
            p3: '一个月后，他吃饭时多添了一碗，夜里也睡得安稳了。天一亮，他就拿起石板，粉笔在上面写得又快又密。'
            p1: '2 月 27 日夜里，信写完了，他把纸页一张张对齐，折好装进信封。和他合用一盏灯的同事已经睡了，灯芯还亮着。'
            p2: '那天晚上，米缸里的米又满到了缸沿。拉马努金坐在门口的台阶上，膝上搁着石板，一笔一笔写下去。'
        relic: 一块石板
        relic_desc: 一块学生用的石板，写了擦、擦了写好多次。
        points:
          p1: '饿着肚子熬夜演算的那几个星期，护住他的身体，让 2 月 27 日给哈代的回信写成寄出'
          p2: '奖学金下来之前，帮他一家撑过每月三十卢比的日子'
          p3: '在他动身去英国之前，看出他身上反复发作的旧病，把它治好'
        points_fail:
          p1: '2 月 27 日那天他倒在灯下，回信没有写成，哈代那边等不到下文。'
          p2: '这条分支里，他每晚的演算之外还压着一家的饭钱，记录里少这一行。'
          p3: '他照旧带着病根远行，1917 年病倒，1920 年在贡伯戈讷姆去世，这条分支与历史一样。'
        shift:
          p1:
            was: '1913 年 2 月 27 日，拉马努金写成给哈代的回信寄出，信里说自己已经半饿着肚子。'
          p2:
            was: '1913 年 5 月奖学金下来之前，一家靠每月三十卢比的薪水过活。'
            now: '那几个月家里的米缸没有见底。'
          p3:
            was: '他 1917 年在英国病重，诊断一直没有定论，1919 年回到印度，第二年 4 月去世，年仅 32 岁。'
            now: '马德拉斯的一位外乡人认出了他身上的旧病，在他远行之前治好了。他后来在剑桥没有住进疗养院，回到印度以后又做了很多年数学。'
        vignettes:
          sums: '一排写不完的正整数旁边只写了一个总数。{staff}算出前几个部分和，1、3、6、10，给这一栏另起了题头，粉笔灰落在了袖口上。'
          future: '{staff}知道这封信日后会被人怎样谈起，只问头一回拆信的人能看懂什么，便把说明的那页放在了最前面，又把翘起的纸角压平。'
          address: '捆纸包前，{staff}请帮工把封套上的地址念一遍，又在自己的纸条上记下日期。麻绳在纸包上勒出了两道印子。'
text:
  en:
    name: Srinivasa Ramanujan
    text: Indian mathematician, 1887 to 1920. Born in Erode and raised mostly in Kumbakonam, he pursued much of his mathematics independently. While working as a clerk in Madras, he sent his results to G. H. Hardy in 1913. At Cambridge he continued his work on number theory and series.
  zh:
    name: 斯里尼瓦瑟·拉马努金
    text: 印度数学家，1887 年生于埃罗德，主要在贡伯戈讷姆长大，1920 年去世。他在正规课程之外独立钻研数学，在马德拉斯当职员时，于 1913 年把研究结果寄给 G. H. 哈代，后来到剑桥继续研究数论与级数。
