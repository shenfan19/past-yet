    date: '1913-01-16'
    checked: two_sources
    sources: [ramanujan_imsc_first_letter, ramanujan_madras_letter]
    original: en
    text:
      en:
        who: 'Srinivasa Ramanujan'
        quote: 'Being inexperienced I would very highly value any advice you give me.'
        occasion: 'Close of his first letter to G. H. Hardy'
      zh:
        who: '斯里尼瓦瑟·拉马努金'
        quote: '我经验尚浅，您给我的任何指点，我都会十分珍重。'
        occasion: '致哈代第一封信的末尾'
      zh-Hant:
        who: '斯里尼瓦瑟·拉馬努金'
        quote: '我經驗尚淺，您給我的任何指點，我都會十分珍重。'
        occasion: '致哈代第一封信的末尾'
      fr:
        who: 'Srinivasa Ramanujan'
        quote: 'Etant inexpérimenté, j''apprécierais grandement tous les conseils que vous me donneriez.'
        occasion: 'Fin de sa première lettre à G. H. Hardy'
      es:
        who: 'Srinivasa Ramanujan'
        quote: 'Al no tener experiencia valoraría mucho cualquier consejo que me dieras.'
        occasion: 'Cierre de su primera carta a G. H. Hardy'
      ja:
        who: 'シュリニヴァーサ・ラマヌジャン'
        quote: '経験が浅いので、アドバイスをいただければ幸いです。'
        occasion: 'G. H. ハーディへの最初の手紙の終わり'
      ko:
        who: '스리니바사 라마누잔'
        quote: '경험이 없기 때문에 귀하가 제공하는 조언을 매우 높이 평가할 것입니다.'
        occasion: 'G. H. 하디에게 보낸 첫 번째 편지의 끝부분'
      ru:
        who: 'Сриниваса Рамануджан'
        quote: 'Будучи неопытным, я был бы очень признателен за любой совет, который вы мне дадите.'
        occasion: 'Завершение его первого письма Г. Х. Харди.'
hook: {en: 'What fits into the first letter to Hardy?', zh: '寄给哈代的头一封信放什么？'}
facts:
  clerk:
    date: '1912'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wolfram_ramanujan, imsc_ramanujan_letter]
    text:
      en: 'From March 1912 Ramanujan held a clerical post in the accounts department of the Madras Port Trust.'
      zh: '1912 年 3 月起，拉马努金在马德拉斯港务局会计部任职员。'
    line:
      en: 'March 1912: Ramanujan takes a clerk''s post in the accounts department of the Madras Port Trust.'
      zh: '1912 年 3 月，拉马努金在马德拉斯港务局会计部当上了职员。'
      zh-Hant: '1912 年 3 月，拉馬努金在馬德拉斯港務局會計部當上了職員。'
      fr: 'Mars 1912 : Ramanujan prend un poste de commis au service comptable du Madras Port Trust.'
      es: 'Marzo de 1912: Ramanujan asume un puesto de secretario en el departamento de cuentas del Madras Port Trust.'
      ja: '1912 年 3 月: ラマヌジャン、マドラス ポート トラストの会計部門の事務員のポストに就任。'
      ko: '1912년 3월: Ramanujan은 Madras Port Trust의 회계 부서에서 사무원 직책을 맡습니다.'
      ru: 'Март 1912 года: Рамануджан занимает должность клерка в бухгалтерии Мадрасского портового треста.'
  letter:
    date: '1913-01-16'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ramanujan_madras_letter, wolfram_ramanujan]
    text:
      en: 'The letter of Thursday, 16 January 1913, signed from the accounts department of the Port Trust, introduces Ramanujan’s mathematical work and describes his investigation of divergent series.'
      zh: '这封 1913 年 1 月 16 日星期四的信，落款是港务局会计部，介绍拉马努金的数学工作，提到他研究发散级数。'
    line:
      en: 'Thursday, 16 January 1913: from the Port Trust, Ramanujan writes to G. H. Hardy in Cambridge about his work.'
      zh: '1913 年 1 月 16 日，星期四，拉马努金从港务局给剑桥的 G. H. 哈代写信，讲自己的研究。'
      zh-Hant: '1913 年 1 月 16 日，星期四，拉馬努金從港務局給劍橋的 G. H. 哈代寫信，講自己的研究。'
      fr: "Jeudi 16 janvier 1913\_: depuis le Port Trust, Ramanujan écrit à G. H. Hardy à Cambridge au sujet de son travail."
      es: 'Jueves 16 de enero de 1913: desde Port Trust, Ramanujan escribe a G. H. Hardy en Cambridge sobre su trabajo.'
      ja: '1913年1月16日木曜日：ポート・トラストから、ラマヌジャンはケンブリッジのG・H・ハーディに自分の仕事について手紙を書く。'
      ko: '1913년 1월 16일 목요일: Port Trust에서 Ramanujan은 캠브리지의 G. H. Hardy에게 자신의 작업에 대해 편지를 보냅니다.'
      ru: 'Четверг, 16 января 1913 г.: Рамануджан пишет из Портового треста Г. Х. Харди в Кембридж о своей работе.'
  england:
    date: '1914'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [st_andrews_ramanujan, wolfram_ramanujan]
    text:
      en: 'In 1914 Ramanujan went to England to work in Cambridge.'
      zh: '1914 年，拉马努金前往英国，到剑桥工作。'
    line:
      en: '1914: Ramanujan sails for England.'
      zh: '1914 年，拉马努金去了英国。'
      zh-Hant: '1914 年，拉馬努金去了英國。'
      fr: '1914 : Ramanujan s''embarque pour l''Angleterre.'
      es: '1914: Ramanujan zarpa hacia Inglaterra.'
      ja: '1914年：ラマヌジャンはイギリスに向けて出航。'
      ko: '1914년: 라마누잔이 영국으로 항해함.'
      ru: '1914: Рамануджан отплывает в Англию.'
  death:
    date: '1920'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [st_andrews_ramanujan, wolfram_ramanujan]
    text:
      en: 'He returned to India ill and died in 1920.'
      zh: '他病重回到印度，1920 年去世。'
    note: 'Death: written as a plain fact.'
    line:
      en: '1920: back in India and ill, Ramanujan dies.'
      zh: '1920 年，病重回到印度的拉马努金去世。'
      zh-Hant: '1920 年，病重回到印度的拉馬努金去世。'
      fr: '1920 : de retour en Inde et malade, Ramanujan décède.'
      es: '1920: de regreso a la India y enfermo, Ramanujan muere.'
      ja: '1920年：インドに戻り、病気になったラマヌジャンが死去。'
      ko: '1920년: 인도로 돌아와 병을 앓고 있는 라마누잔이 사망합니다.'
      ru: '1920: Вернувшись в Индию и заболев, Рамануджан умирает.'
