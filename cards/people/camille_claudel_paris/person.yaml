      points:
        - {id: p1, kind: trust, day: 40, req: {"any":[{"trait":["kind","sensitive","attached"],"stat":{"will":5}},{"job":["nurse","caregiver"],"stat":{"will":4}}]}}
        - {id: p2, kind: care, day: 46, req: {"any":[{"job":["nurse","caregiver","archivist","painter"],"stat":{"will":6}},{"trait":["kind","patient","methodical"],"stat":{"will":7,"wit":5}}]}}
