- camille_claudel_paris
text:
  en:
    name: Camille Claudel
    text: French sculptor, 1864 to 1943. She worked in Rodin's studio and made works such as The Waltz and The Mature Age. In 1913 her family had her committed to an asylum, where she spent her last thirty years.
  zh:
    name: 卡米耶·克洛岱尔
    text: 法国雕塑家，1864 年生，1943 年去世。她在罗丹的工作室做事，作品有《华尔兹》《成熟的年纪》。1913 年家人把她送进精神病院，她在那里度过最后三十年。
