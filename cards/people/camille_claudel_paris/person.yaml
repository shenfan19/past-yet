    text:
      en:
        name: 'Two versions of a turn'
        place: "Paris"
        figure: "Camille Claudel"
        story: 'The Musée Camille Claudel catalogues several versions of The Waltz, including a bronze cast dated 1905. In 1913 Claudel’s father died in Villeneuve-sur-Fère and she did not learn of his death before the funeral. On 10 March she was admitted to Ville-Évrard.'
        story_prose:
          opening:
            - 'Paris, March 1913. Camille Claudel has made more than one version of The Waltz. In her studio she can pick out the piece she wants from others that look nearly the same.'
            - 'In history, she did not hear of her father’s death in time for the funeral. On 10 March she was admitted to hospital. In this branch a letter that can be checked has reached Paris, and there is time to give someone instructions about the studio.'
            - 'Someone who can take time over difficult news can help. When it comes to the studio, they need to wait for Claudel to say what goes where, and with whom.'
          points:
            p2: '{staff} takes a blank sheet and lists separately the things Claudel points out. Someone wants to put two similar things on one line. She lays a hand on the paper and asks for two spaces. At the bottom she adds the recipient’s name. Before the paper is folded, she points out that last line to the person who has come for it.'
            p1: '{staff} checks the date with the person who brought the letter, then goes to the studio. Claudel reads it once, waits a little, and asks which is the first train that would still get her there. She wipes her hands twice on her apron before putting the letter into her coat.'
          outcomes:
            all: 'Before leaving, Claudel gives the list to the person she chose. When he comes for it, he reads back the two names she has not made clear yet.'
            p2: 'The person she chose takes the list. Back in the studio, he finds the objects one line at a time.'
            p1: 'On the way to Villeneuve she takes the letter out once more. She turns straight to the date and reads it again.'
          none: 'The objects remain in their places. Someone has flattened a sheet at the corner of the table. No name is written on it.'
          not_admitted: '{staff} never gets in. The lock moves once on the other side, and the footsteps recede.'
          excerpts:
            p2: 'At the bottom she adds the recipient’s name. Before the paper is folded, she points out that last line to the person who has come for it.'
            p1: 'She wipes her hands twice on her apron before putting the letter into her coat.'
        relic: "A bronze hand"
        relic_desc: "A small bronze study of a hand."
        points:
          p1: 'Bring Claudel reliable news of her father’s death in time for her to decide whether to travel for the funeral'
          p2: 'Before Claudel leaves the studio, ask her what she wants entrusted to someone she knows and help write down her choices'
        points_fail:
          p1: 'The news reaches Paris after the funeral. Claudel has already lost the chance to decide whether to go.'
          p2: 'There will be a record of the removal, but the things in the studio still have no note from Claudel saying who should keep them.'
        shift:
          p1:
            was: 'On 3 March 1913 her father, Louis-Prosper Claudel, died at Villeneuve; the family did not tell Camille, and she was not at the funeral.'
            now: 'In this branch Claudel receives the news in time and chooses to travel to Villeneuve-sur-Fère to attend her father’s funeral.'
          p2:
            was: 'On 10 March 1913 Camille was committed to the asylum of Ville-Évrard at her family''s request; moved to Montdevergues in 1914, she never left, and died there on 19 October 1943.'
            now: 'In this branch {staff} records what Claudel wants done with a few studio objects. Someone she chose takes the list and follows it when she leaves.'
        shift_all: 'Claudel could decide to go to her father’s funeral and choose someone to look after objects from her studio.'
        vignettes:
          light: 'You have seen a later museum display, but only now can you watch the shadow change as you walk around the skirt. The packer is about to write the same description on both cards. You draw the two curves in the margins. The crates will leave separately, and you will see neither unpacked.'
          mark: 'The packer finds two labels with the same title. You add one detail to each, where the drapery ends, before the lids go on. You keep both notes in your own hand. The marble commission you read about never arrives.'
          crate: 'While the packer reaches for a lid, you keep a wrapping sheet clear of the projecting skirt. You trace its curve on the spare paper from memory. When the lid comes down, you can no longer check the last inch.'
      zh:
        name: '同一步舞，两种裙摆'
        place: "巴黎"
        figure: "卡米耶·克洛岱尔"
        story: '克洛岱尔博物馆登记了《华尔兹》的多个版本，其中有一件标为 1905 年的青铜铸件。1913 年，卡米耶的父亲在维尔纳夫去世。葬礼前她没有收到死讯。3 月 10 日，她被送进维尔-埃夫拉尔医院。'
        story_prose:
          opening:
            - '1913 年三月，巴黎。卡米耶·克洛岱尔做过不止一版《华尔兹》。工作室里，她从形状很近的东西中也能挑出自己要留的那一件。'
            - '史实里，她没在葬礼前得知父亲去世，三月十日被送进医院。在这条分支里，一封可以查实的信送到了巴黎，工作室也还有时间交代。'
            - '这趟用得上会把难说的消息慢慢说完的人。记东西时，得等卡米耶自己讲哪样留下，交给谁。'
          points:
            p2: '{staff}拿了空纸，把卡米耶指过的几样东西分开记。旁人想把两件相近的东西合写成一行，她把手压在纸上，要留出两个位置。 她在最下面写了收件人的名字。纸页叠上去以前，她把那一行指给来取的人看。'
            p1: '{staff}先到送信的人那里核准了日子，再去工作室。卡米耶把信读过一遍，停了一会儿，问最早哪班车还能赶上。 她把还没干透的手在围裙上擦了两下，把信放进外衣里。'
          outcomes:
            all: '离开前，卡米耶把物件的单子交给她自己选的人。他来取时，先把两个还没写清的名字念给她听。'
            p2: '她选的人把单子带走。后来回到工作室，他依着每一行找到了该取的东西。'
            p1: '去维尔纳夫的路上，她把那封信又取出来。她只翻到写日子的地方，看了一眼。'
          none: '工作室里的东西都在原处。桌角有人摆平了一张纸，上面没有名字。'
          not_admitted: '{staff}没能进去。门锁从里面响了一声，脚步随后走远。'
          excerpts:
            p2: '她在最下面写了收件人的名字。纸页叠上去以前，她把那一行指给来取的人看。'
            p1: '她把还没干透的手在围裙上擦了两下，把信放进外衣里。'
        relic: "一只青铜手"
        relic_desc: "一件小小的青铜手部习作。"
        points:
          p1: '把父亲的死讯及时带给卡米耶，让她自己决定要不要回维尔纳夫参加葬礼'
          p2: '卡米耶离开工作室以前，问她有哪些东西想托付给熟人，把她的选择写下来'
        points_fail:
          p1: '消息到巴黎时，葬礼已经结束。卡米耶已经没法决定要不要回去了。'
          p2: '离开工作室的日期有记录，屋里几样东西交给谁，却没有一张她亲自交代的纸。'
        shift:
          p1:
            was: '1913 年 3 月 3 日，父亲路易-普罗斯佩·克洛岱尔在维尔纳夫去世，家里没有告诉卡米耶，她没有去送葬。'
            now: '这条分支里，卡米耶及时收到死讯，决定回维尔纳夫参加父亲的葬礼。'
          p2:
            was: '1913 年 3 月 10 日，卡米耶由家人申请送进维尔-埃夫拉尔精神病院，1914 年转到蒙德维尔格，此后再没有出来，1943 年 10 月 19 日在那里去世。'
            now: '这条分支里，{staff}记下卡米耶想怎样处理工作室里的几样物件。她离开时，自己选定的人拿着这张单子照办。'
        shift_all: '卡米耶来得及决定去父亲的葬礼，也亲自选了替她照管工作室物件的人。'
        vignettes:
          light: '你见过后来的博物馆陈列，直到绕着裙摆走一圈，才看见影子怎样转。装箱人正要在两张标签上写同一句，你在边角各添了一道不同的弧线。箱子要分头走，开箱的时候你一处也看不到。'
          mark: '装箱人找来两张写着同一标题的纸签。趁箱盖还没合，你各补一项，衣褶收在哪儿。两项也都抄进自己的本子里。你在资料里读过的那笔大理石委托，终究没有成。'
          crate: '装箱人伸手拿盖子时，你扶住包纸，没让它压上伸出的裙边。余下的纸上，你凭记忆描出一道弧。箱盖一扣，最后那一点还画得准不准，你再也对不上了。'
text:
  en:
    name: Camille Claudel
    text: French sculptor, 1864 to 1943. She worked in Rodin's studio and made works such as The Waltz and The Mature Age. In 1913 her family had her committed to an asylum, where she spent her last thirty years.
  zh:
    name: 卡米耶·克洛岱尔
    text: 法国雕塑家，1864 年生，1943 年去世。她在罗丹的工作室做事，作品有《华尔兹》《成熟的年纪》。1913 年家人把她送进精神病院，她在那里度过最后三十年。
