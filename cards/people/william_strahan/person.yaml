text:
  en:
    name: William Strahan
    text: Scottish printer and publisher in London, 1715 to 1785, born in Edinburgh. He published the Wealth of Nations with Thomas Cadell and was a friend of both Hume and Smith. Hume left him the Dialogues Concerning Natural Religion in 1776; in the end he did not print them.
  zh:
    name: 威廉·斯特拉恩
    text: 在伦敦开业的苏格兰印书商与出版人，1715 年生于爱丁堡，1785 年去世。他与托马斯·卡德尔合出了《国富论》，是休谟和斯密共同的朋友。1776 年休谟把《自然宗教对话录》托给了他，他最终没有付印。
