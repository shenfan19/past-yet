name: 罗斯冰架 1912
short: 罗斯冰架
place_name: 南极罗斯冰架
tags:
  - medical
  - cold
  - expedition
  - c20
  - antarctica
  - history
event_titles:
  time_strain: 时间错位
plots: {}
blurb: 从极点返回、穿过冰架的路上，燃料和食物越来越少。近，成本低，保暖和食物的效果很明显。
handle_label: 史实里没有可改的决定
protagonist: 罗伯特·法尔肯·斯科特
protagonist_role: 极地小队的领队，每天都写日记
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: '1912 年 1 月，斯科特和四位同伴到达南极点，发现挪威队已经先到。'
      check: true
    - text: '埃德加·埃文斯 1912 年 2 月 17 日死于返程途中，3 月 17 日奥茨上尉离开帐篷，没有回来。'
      check: true
    - text: '斯科特最后一篇日记写于 1912 年 3 月 29 日。最后的营地离一吨仓库只有十一英里。'
      check: true
    - text: '搜救队 1912 年 11 月 12 日找到那顶帐篷，里面是斯科特、威尔逊和鲍尔斯的遗体。'
      check: true
  regret:
    - 你能救今天的人，救不了整段旅程。主时间线上这支队伍没有回来。
    - 保暖和食物比任何一个聪明的主意都重要，但计划只有在有人被听见时才会改。
events:
  time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
star_points:
  settled: '让病倒的人撑下去'
  sheltered: '让全队躲进遮蔽处'
  through: '带队伍度过这几周'
milestones:
  first_treat: '{date}：{staff} 给一个已经不说话的人化好第一锅水、热好食物，他开始开口了。'
  first_protect: '{date}：{staff} 发下第一批毯子，垒起雪块墙，教其他人照做。'
  trust_won: '{date}：队员们不再把 {staff} 挡在外面，有的还开口求助。'
  exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
  outbreak_fades: '{date}：生病的人数降到了一两个或没有。'
  people_settled: '{date}：{staff} 给每一个病倒的人都找到了暖和的地方和吃的。'
  well_sheltered: '{date}：{staff} 让全队都躲进了遮蔽处，避开了风。'
  all_through: '{date}：队伍度过了这几周，损失不超过两个人。'
  oates_leaves: '{date}：奥茨上尉冻伤严重，在暴风雪中离开帐篷，再没有回来。'
  last_entry: '{date}：斯科特写下日记的最后一篇，请求照顾同伴的家人。'
summary:
  near_death: '{staff} 在罗斯冰架倒下，被召回符拉了回来。人救下了，代价不小。'
  stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
  gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
  legend: '{staff} 在罗斯冰架留下了传说。计划比主时间线提前 {advance_days:1} 天改变。'
  perfect: '{staff} 在罗斯冰架完成了任务，平安回来。主时间线损失 {base_D:i} 人，这条分支损失 {D:i} 人。'
  scramble: '{staff} 一次次被拒绝，最后带着一个笑话逃了回来。'
  modest: '{staff} 在罗斯冰架待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人守着。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把他们需要听到的话告诉了他们。
  perfect:
    - trait: kind
      text: 我能救今天的人，救不了明天的。
    - trait: curious
      text: 原来是这样，保暖和食物才是让一支队伍撑下去的东西。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，听不听由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 毯子剩下了。限制不是物资，是队伍对你的信任。先让员工帮人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
