era_text:
  en:
    labels: {sick: 'Ailing', dead: 'Lost', deaths: 'Lost', treated: 'Cared for', protected: 'Sheltered'}
    name: Ross Ice Shelf, 1912
    short: Ross Ice Shelf
    place_name: Ross Ice Shelf, Antarctica
    tags:
      - medical
      - cold
      - expedition
      - c20
      - antarctica
      - history
    event_titles:
      expedition_handoff: 'The copy outside the tent'
      time_strain: Time slip
    plots: {}
    blurb: Scott’s dated diary follows the historic polar party. The game’s traveller meets an invented group and handles a record away from the named party.
    handle_label: Nothing in the record to change
    protagonist: Robert Falcon Scott
    protagonist_role: The leader of the polar party, who kept a diary of every day
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: 'In January 1912 Scott and four companions reached the South Pole and found that a Norwegian party had been there before them.'
          check: true
        - text: 'Edgar Evans died on 17 February 1912 on the way back, and Scott’s account places Oates’s death around 16–17 March.'
          check: true
        - text: 'Scott''s last diary entry is dated 29 March 1912. The last camp was eleven miles from One Ton Depot.'
          check: true
        - text: 'A search party found the tent on 12 November 1912, with the bodies of Scott, Wilson and Bowers.'
          check: true
      regret:
        - You can save today's people but not the whole journey. On the main timeline the party did not come back.
        - Warmth and food matter more than any one clever idea, but a plan only changes when someone is heard.
    events:
      expedition_handoff: '{date}: In the fictional records exercise, {staff} asks Alice to finish both lines before passing them to Hale. He can now tell the camp from the depot. The missing departure time stays blank.'
      expedition_send: '{date}: In the fictional records exercise, {staff} gives Hale the depot label before Alice finishes copying. He has the destination, and a marked space for the distance still to be confirmed.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      settled: 'Keep the ailing going'
      sheltered: 'Get the whole party under cover'
      through: 'Bring the party through these weeks'
    milestones:
      gale: '{date}: Scott later dates the start of the sustained gale at the last camp to 21 March.'
      first_treat: '{date}: {staff} melts the first pot of water and hot food for a man who has stopped talking. He starts to speak.'
      first_protect: '{date}: {staff} hands out the first blankets and builds a wall of snow blocks, and teaches the others to do the same.'
      trust_won: '{date}: The members of the party no longer keep {staff} out, and some ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of ailing men falls to one or none.'
      people_settled: '{date}: {staff} has found a warm place and food for everyone who was ailing.'
      well_sheltered: '{date}: {staff} has the whole party under cover and out of the wind.'
      all_through: '{date}: The party is through these weeks with no more than two lost.'
      oates_leaves: '{date}: Scott’s diary places the loss of Captain Oates around this date.'
      last_entry: '{date}: Scott writes the last entry in his diary and asks that the families of his companions be looked after.'
    summary:
      near_death: '{staff} collapses at Ross Ice Shelf and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend at Ross Ice Shelf. The plan was changed {advance_days:1} days before the model’s baseline.'
      perfect: '{staff} completed the task at Ross Ice Shelf and came back safe. The simulation records {base_D:i} lost in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days at Ross Ice Shelf, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was keeping watch at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's people, not tomorrow's.
        - trait: curious
          text: So that is how it is, warmth and food are what keep a party going.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they listen is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Blankets were left over. The limit was the trust of the party, not the supplies. Let the employee help people first to build trust.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    labels: {sick: '病倒的人', dead: '损失', deaths: '损失', treated: '照料', protected: '遮蔽'}
    name: 罗斯冰架 1912
    short: 罗斯冰架
    place_name: 南极罗斯冰架
    tags:
      - medical
      - cold
      - expedition
      - c20
      - antarctica
      - history
    event_titles:
      expedition_handoff: '留给读稿人的副页'
      time_strain: 时间错位
    plots: {}
    blurb: 斯科特的日期来自实际极地小队的日记。员工遇到的是虚构队伍，在实际小队之外处理记录。
    handle_label: 史实里没有可改的决定
    protagonist: 罗伯特·法尔肯·斯科特
    protagonist_role: 极地小队的领队，每天都写日记
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: '1912 年 1 月，斯科特和四位同伴到达南极点，发现挪威队已经先到。'
          check: true
        - text: '埃德加·埃文斯 1912 年 2 月 17 日死于返程途中，斯科特日记把奥茨去世记在3月16至17日前后。'
          check: true
        - text: '斯科特最后一篇日记写于 1912 年 3 月 29 日。最后的营地离一吨仓库只有十一英里。'
          check: true
        - text: '搜救队 1912 年 11 月 12 日找到那顶帐篷，里面是斯科特、威尔逊和鲍尔斯的遗体。'
          check: true
      regret:
        - 你能救今天的人，救不了整段旅程。主时间线上这支队伍没有回来。
        - 保暖和食物比任何一个聪明的主意都重要，但计划只有在有人被听见时才会改。
    events:
      expedition_handoff: '{date}，在虚构文书差事里，{staff} 等艾丽斯把两行都抄好，再交给黑尔。他分得清营地和补给点了。出发时刻还没核实，先空着。'
      expedition_send: '{date}，在虚构文书差事里，{staff} 趁艾丽斯还在抄，把补给点题签先递给黑尔。他有了目的地，距离那一格留待核。'
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      settled: '让病倒的人撑下去'
      sheltered: '让全队躲进遮蔽处'
      through: '带队伍度过这几周'
    milestones:
      gale: '{date}，斯科特后来在日记里把最后营地持续大风的开始记为3月21日。'
      first_treat: '{date}：{staff} 给一个已经不说话的人化好第一锅水、热好食物，他开始开口了。'
      first_protect: '{date}：{staff} 发下第一批毯子，垒起雪块墙，教其他人照做。'
      trust_won: '{date}：队员们不再把 {staff} 挡在外面，有的还开口求助。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：生病的人数降到了一两个或没有。'
      people_settled: '{date}：{staff} 给每一个病倒的人都找到了暖和的地方和吃的。'
      well_sheltered: '{date}：{staff} 让全队都躲进了遮蔽处，避开了风。'
      all_through: '{date}：队伍度过了这几周，损失不超过两个人。'
      oates_leaves: '{date}：斯科特日记把奥茨的去世记在这几天。'
      last_entry: '{date}：斯科特写下日记的最后一篇，请求照顾同伴的家人。'
    summary:
      near_death: '{staff} 在罗斯冰架倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在罗斯冰架留下了传说。计划比模型基准提前 {advance_days:1} 天改变。'
      perfect: '{staff} 在罗斯冰架完成了任务，平安回来。模拟基准损失 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒绝，最后带着一个笑话逃了回来。'
      modest: '{staff} 在罗斯冰架待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人守着。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他们需要听到的话告诉了他们。
      perfect:
        - trait: kind
          text: 我能救今天的人，救不了明天的。
        - trait: curious
          text: 原来是这样，保暖和食物才是让一支队伍撑下去的东西。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，听不听由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 毯子剩下了。限制不是物资，是队伍对你的信任。先让员工帮人做事，建立信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

