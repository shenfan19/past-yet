      text:
        en:
          name: The last diary entry
          text: Scott's last diary entry is dated 29 March 1912, eleven miles from One Ton Depot. The tent was found by a search party on 12 November. In the game an employee can help the party through these weeks, which holds only in this branch.
        zh:
          name: 最后一篇日记
          text: 斯科特的最后一篇日记写于 1912 年 3 月 29 日，离一吨仓库十一英里。搜救队 11 月 12 日找到帐篷。游戏里员工能帮队伍度过这几周，只在这条分支里成立。
