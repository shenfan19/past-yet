        en:
          name: Ross Ice Shelf, 1912
          text: A huge floating sheet of ice on the edge of Antarctica, crossed by the Terra Nova expedition on the way to and from the Pole. Ross Ice Shelf in the game is a party model of about twenty-four people.
        zh:
          name: 罗斯冰架，1912
          text: 南极边缘一大片漂浮的冰，新地号考察队往返极点都穿过这里。游戏里的罗斯冰架是一个约二十四人的队伍模型。
