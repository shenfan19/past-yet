    order: 142
    year: 1912
    lon: 169
    lat: -79.67
    region: oceania
    field: exploration
    tier: 3
    era: scott_ross_ice_shelf_1912
    channels: {C: 3, Y: 3, L: 3}
    regret: true
    refs: [scott_last_diary, scott_archive_final, scott_1912_text]
    scene:
      points:
        - {id: p1, kind: endure, req: {"trait":["bold","cheerful","hardy"]}}
        - {id: p2, kind: care, req: {"trait":["patient","attached","cheerful"]}}
        - {id: p3, kind: hold, redeem: true, req: {"provides":"strength"}}
      vignettes:
        - {id: distance, traits: [methodical, vigil]}
        - {id: blank, traits: [patient, quiet]}
        - {id: opening}
    text:
      en:
        name: "The tent on the ice shelf"
        place: "Ross Ice Shelf"
        figure: "Robert Falcon Scott"
        story: 'Scott''s final diary entry is dated 29 March 1912. The surviving manuscript records the party''s last camp during its return from the South Pole. The reading scene is imagined after the return of the papers.'
        relic: "A diary"
        relic_desc: "A small pencilled diary, stiff with cold."
        points:
          p1: "Keep going through the cold"
          p2: "Look after the weakest of them"
          p3: "Drag the sledge so the diary and records come home"
        vignettes:
          distance: 'Back at the Agency, the fictional clerk copies a distance into a column headed as distance travelled. You show them that it was the distance still to go. They move the entry before filing the copy.'
          blank: 'Back at the Agency, the clerk stops at the final date. You wait while they decide how to mark the blank beyond it. They write that the record ends here, then put the pencil down.'
          opening: 'Back at the Agency, you open the practice copy and read the date before the story. The clerk puts the same date on the cover slip so the pages can be found in order again.'
      zh:
        name: "冰架上的帐篷"
        place: "罗斯冰架"
        figure: "罗伯特·法尔肯·斯科特"
        story: '斯科特日记最后一则署于 1912 年 3 月 29 日。现存手稿记录了南极点归途上的最后营地。本卡虚构的是记录带回来以后的一幕对读。'
        relic: "一本日记"
        relic_desc: "一本用铅笔写的小日记，被冻得发硬。"
        points:
          p1: "在严寒里继续前进"
          p2: "照顾他们当中最虚弱的人"
          p3: "拉动雪橇，让日记和记录能带回家"
        vignettes:
          distance: '回到事务所，虚构书记员把一个数抄进已走路程一栏。你指出那是还没走完的距离。他在抄件入档前把数移了过去。'
          blank: '回到事务所，书记员念到最后一个日期停了笔。你等他想好后面的空白该怎么标。他写下「记录到此为止」，才搁下笔。'
          opening: '回到事务所，你翻开练习抄本，先读日期再读内容。书记员把同一日期写上封签，下一次还能按顺序找到这一页。'
text:
  en:
    name: Robert Falcon Scott
    text: British naval officer and explorer, 1868 to 1912. He led the Terra Nova expedition to the South Pole, reached it in January 1912 to find that Roald Amundsen had arrived first, and died with his companions on the return across the Ross Ice Shelf.
  zh:
    name: 罗伯特·法尔肯·斯科特
    text: 英国海军军官与探险家，1868 年生，1912 年去世。他率领“新地”号探险队前往南极点，1912 年 1 月到达时发现阿蒙森已先到，返程穿越罗斯冰架时与同伴一起去世。
