text:
  en:
    name: Georg Büchner
    text: German writer and revolutionary, 1813 to 1837. He wrote the plays Danton's Death and Woyzeck, and fled to Zurich after a pamphlet calling for revolt. He died of typhus at twenty three.
  zh:
    name: 格奥尔格·毕希纳
    text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单逃往苏黎世。他二十三岁死于伤寒。
