    text:
      en:
        name: 'Two drafts on the rehearsal table'
        place: "Zurich"
        figure: "Georg Büchner"
        story: 'Georg Büchner left Woyzeck unfinished. The Klassik Stiftung Weimar holds and digitises the manuscript fragments, which preserve different stages of the play. It makes no claim to recover Büchner’s intended final scene order.'
        relic: "A bundle of scenes"
        relic_desc: "Loose scenes in a cramped hand, in no fixed order."
        points:
          p1: 'When Büchner falls ill, keep each group of Woyzeck drafts together as his Zürich papers are handed over'
          p2: 'While the manuscript is still by him, make a second copy of his play Pietro Aretino and give it to his family to keep'
          p3: 'Send word to Strasbourg in the first days of his fever, so that Minna reaches him days earlier'
          p4: 'Stop the typhus and cure him, so that he lives through this February'
        points_fail:
          p1: 'Different drafts are combined for a single fair copy. The earliest set goes missing, and the office recalls the employee.'
          p2: 'The play existed in a single manuscript, and it did not survive.'
          p3: 'The news reached Minna late. When she came to Zürich he was already dying.'
          p4: 'The fever rose day by day, and on 19 February he died in Zürich at twenty three.'
        shift:
          p1:
            was: 'In February 1837 Büchner left several sets of Woyzeck drafts. The latest is close to a fair copy and remains incomplete.'
          p2:
            was: 'From 1837 on, after his death, the manuscript of his play about Pietro Aretino did not survive.'
            now: 'A second copy stayed with his family, and the play was later printed with the rest of his papers.'
          p3:
            was: 'In February 1837 his fiancée Minna Jaeglé hurried from Strasbourg to Zürich, arriving when he was already dying; he died soon after with her beside him.'
            now: 'Minna arrived in Zürich days earlier and was there through the days when he could still talk with her.'
          p4:
            was: 'On 19 February 1837 Büchner died of typhus in Zürich, at twenty three.'
            now: 'His fever broke, and in spring he was back at the university. He went on teaching and writing plays for years, and sent the plays on his desk to print one after another.'
            who: buchner_zurich
            bio: 'Büchner came through the typhus of 1837 in Zürich. He taught at the university for many years, doing research and writing plays.'
        vignettes:
          order: 'The reader has put the two copies together and numbered the scenes in ink. You add a separate label to each source and write the proposed order on a removable slip. The next reader can undo it. You bring home that slip; you still do not have a final order.'
          pause: 'You know future theatres will have to decide what goes next. The reader asks if your answer is the author’s. You try both beginnings aloud and mark where they leave different questions. You can take two pauses home, and no finished script.'
          gap: 'You ask the reader to stop the moment the page stops. Neither of you supplies the missing line. On your copy you leave a space wide enough to notice at a glance. That space is what you remember when you get back.'
      zh:
        name: '排练桌上的两份残稿'
        place: "苏黎世"
        figure: "格奥尔格·毕希纳"
        story: '格奥尔格·毕希纳留下未完成的《沃伊采克》。魏玛古典基金会保存并数字化了手稿残篇，其中有不同阶段的文字。'
        relic: "一叠零散的场景稿"
        relic_desc: "字迹局促的散页，没有固定的顺序。"
        points:
          p1: '毕希纳病倒以后，趁转交苏黎世住处的纸件时，把《沃伊采克》的几组草稿逐叠留存'
          p2: '趁手稿还在他身边，把他写的戏《彼得罗·阿雷蒂诺》誊出一份副本，交给他的家人保存'
          p3: '他发烧的头几天就往斯特拉斯堡送信，让明娜早几天赶到他身边'
          p4: '拦下伤寒，治好他的病，让他活过这个二月'
        points_fail:
          p1: '几叠不同稿纸被拿去作一套誊稿，退回来时最早的一组失散。事务所因同步失败召回员工。'
          p2: '这部戏只有一份手稿，后来没有传下来。'
          p3: '消息到得晚，明娜赶到苏黎世时，他已经病危。'
          p4: '高烧一天天加重，2 月 19 日他在苏黎世去世，年仅二十三岁。'
        shift:
          p1:
            was: '1837 年 2 月，毕希纳去世时留下多组《沃伊采克》草稿，最后一组近乎誊清但仍不完整。'
          p2:
            was: '1837 年他去世以后，他写的戏《彼得罗·阿雷蒂诺》手稿没有传下来。'
            now: '这部戏另有一份副本留在家人手里，后来同他的其他遗稿一起印了出来。'
          p3:
            was: '1837 年 2 月，未婚妻明娜从斯特拉斯堡赶到苏黎世时，他已病危，不久在她身边去世。'
            now: '明娜早几天到了苏黎世，他还能和她说话的那些日子，她都在。'
          p4:
            was: '1837 年 2 月 19 日，毕希纳在苏黎世死于伤寒，年仅二十三岁。'
            now: '他退了烧，春天回到大学讲台。此后多年他一边教书一边写戏，把桌上的几部戏陆续送去付印。'
            who: buchner_zurich
            bio: '毕希纳熬过了 1837 年苏黎世的那场伤寒，此后在大学任教多年，一边研究，一边写戏。'
        vignettes:
          order: '试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。'
          pause: '你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。'
          gap: '纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。'
text:
  en:
    name: Georg Büchner
    text: German writer and revolutionary, 1813 to 1837. He wrote the plays Danton's Death and Woyzeck, and fled to Zurich after a pamphlet calling for revolt. He died of typhus at twenty three.
  zh:
    name: 格奥尔格·毕希纳
    text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单逃往苏黎世。他二十三岁死于伤寒。
hook: {en: 'Which scene belongs next if there is no final copy?', zh: '没定稿，下一场敢排在哪儿？'}
