    text:
      en:
        name: 'Two drafts on the rehearsal table'
        place: "Zurich"
        figure: "Georg Büchner"
        story: 'In 1836 Georg Büchner came to Zürich as a refugee and began lecturing at the university. He fell gravely ill in February 1837. His fiancée Minna Jaeglé came from Strasbourg and reached him near the end. He died on 19 February at twenty-three, leaving Woyzeck unfinished.'
        story_prose:
          opening:
            - 'In Zurich someone sets two drafts apart on a table because they contain the same character’s name. Büchner asks from the other room for a sheet he can use to write a letter. While he still has strength, he wants to ask Minna to come from Strasbourg.'
            - 'In February 1837 Büchner became very ill in Zurich. Minna arrived late in his illness, and he died there. Woyzeck survives in several unfinished drafts. You can send his message sooner and bring the office’s fictional medical kit to help with his care.'
            - 'Send a courier to find out what Büchner himself wants to say. At his bedside, use someone with care experience and the kit after checking with the people already there.'
          points:
            p1: 'The messenger lifts a stray page, thinking it is an unfinished letter. You ask Büchner to give his own words to the person taking them down on a fresh sheet. Once the address is checked, the messenger leaves the play on the table and takes the new page. As he takes it, Büchner hears him pronounce Minna’s name in full.'
            p2: 'Someone in the house is reading headings aloud until Büchner asks them to stop. You explain the office kit and let his caregiver stay by the bed. After a while Büchner opens his eyes and points to the thinner of the two piles. The helper brings it close. This time Büchner does not need anyone to pick the pages for him.'
          outcomes:
            all: 'Minna reaches Zurich in time for Büchner to tell her what he wanted to say. The fever lifts. The two piles on the desk still wait to be put in order.'
            p1: 'The letter goes soon enough for Minna to hear him speak for himself. His illness continues and he dies in Zurich.'
            p2: 'Büchner’s fever lifts and he asks for a draft. The earlier message to Minna still did not go in time.'
          none: 'The letter and working papers lie open together. Minna arrives near the end and he dies in Zurich.'
          not_admitted: 'The people indoors ask the visitor to wait and leave him undisturbed. The sheet for the letter still has no address.'
          excerpts:
            p1: 'As he takes it, Büchner hears him pronounce Minna’s name in full.'
            p2: 'The helper brings it close. This time Büchner does not need anyone to pick the pages for him.'
        relic: "A bundle of scenes"
        relic_desc: "Loose scenes in a cramped hand, in no fixed order."
        points:
          p1: 'Get a message to Strasbourg while Büchner can still ask Minna to come himself'
          p2: 'Bring the office’s medical kit to the bedside and help the people caring for him through the fever'
        points_fail:
          p1: 'Minna reaches him late in his illness. The message he wanted to send her is still on the table.'
          p2: 'The fever continues. He can no longer ask for the pages lying on his desk.'
        shift:
          p1:
            was: 'February 1837: his fiancée Minna Jaeglé hurried from Strasbourg to Zürich, arriving when he was already dying; he died soon after with her beside him.'
            now: 'In this branch Minna reaches Zürich sooner. They can speak to each other while he is still strong enough.'
          p2:
            was: 'Büchner died in Zürich on 19 February 1837, with Woyzeck unfinished.'
            now: 'In this branch the office’s medical kit helps {staff} bring the fever down. Büchner lives and can ask to see the pages that are still on his desk.'
            who: buchner_zurich
            bio: 'In this branch Büchner lives through his illness in Zürich in February 1837.'
        vignettes:
          order: 'The reader has put the two copies together and numbered the scenes in ink. You add a separate label to each source and write the proposed order on a removable slip. The next reader can undo it. You bring home that slip; you still do not have a final order.'
          pause: 'You know future theatres will have to decide what goes next. The reader asks if your answer is the author’s. You try both beginnings aloud and mark where they leave different questions. You can take two pauses home, and no finished script.'
          gap: 'You ask the reader to stop the moment the page stops. Neither of you supplies the missing line. On your copy you leave a space wide enough to notice at a glance. That space is what you remember when you get back.'
      zh:
        name: '排练桌上的两份残稿'
        place: "苏黎世"
        figure: "格奥尔格·毕希纳"
        story: '1836 年，格奥尔格·毕希纳流亡到苏黎世，在大学讲课。次年 2 月，他病得很重。未婚妻明娜·耶格勒从斯特拉斯堡赶到时，他已病危。2 月 19 日，二十三岁的毕希纳去世，《沃伊采克》没有写完。'
        story_prose:
          opening:
            - '苏黎世有人把两份有相同人名的戏稿分开放在桌上。隔间的毕希纳叫人找一张能写信的纸。他想趁还有力气，请在斯特拉斯堡的明娜过来。'
            - '1837 年二月，毕希纳在苏黎世病重，明娜赶来时已很晚，他随后去世。《沃伊采克》留有几组未完成的手稿。这里可以让他的口信更早送出，也可用事务所的虚构医疗箱照护他。'
            - '让会送信的人先确认毕希纳自己要说什么。要去床边帮忙，派懂照护并带着医疗箱的人先问家中的安排。'
          points:
            p1: '来送信的人拿起一张散稿，以为这是没抄清的来信。你请毕希纳逐句说给帮手听，按他的原话另写一张。明娜的地址对过以后，送信人把戏稿留在桌上，拿着那张新纸动身。收纸的时候，毕希纳听见对方完整念了一遍名字。'
            p2: '家里的人想继续念出每张纸的题头，毕希纳请他们先停一下。你解释事务所带来的医疗箱，等照护的人留在床边。过了些时候，毕希纳睁开眼，伸手指两份散稿中较薄的一叠。帮手把它挪近，他没有再请人替他挑。'
          outcomes:
            all: '明娜到苏黎世时，毕希纳还能把原先想说的事告诉她。烧已退下，桌上仍有两叠未排定的稿。'
            p1: '口信送得早，明娜有时间听他自己说话。病仍没退，他随后在苏黎世去世。'
            p2: '毕希纳退烧，醒来要其中一份手稿。早先请明娜来的话，仍没能及时送到。'
          none: '信纸和草页仍摊在一起。明娜到时已近最后，他在苏黎世去世。'
          not_admitted: '屋里的人请来客先不要打扰。那张信纸还没写上收件人。'
          excerpts:
            p1: '收纸的时候，毕希纳听见对方完整念了一遍名字。'
            p2: '帮手把它挪近，他没有再请人替他挑。'
        relic: "一叠零散的场景稿"
        relic_desc: "字迹局促的散页，没有固定的顺序。"
        points:
          p1: '趁毕希纳还有力气亲口说明，把他请明娜过来的话送到斯特拉斯堡'
          p2: '把事务所的纳米医疗箱带到床边，帮守在那儿的人照护发高烧的毕希纳'
        points_fail:
          p1: '明娜赶到时，他已病危。他原想告诉她的几句话，还摊在案上。'
          p2: '烧没有退下去。他病得已经开不了口，案上的稿子还摊在那里。'
        shift:
          p1:
            was: '1837 年 2 月，未婚妻明娜从斯特拉斯堡赶到苏黎世时，他已病危，不久在她身边去世。'
            now: '这条分支里，明娜早几天到了苏黎世。他还有力气，两人能当面说说话。'
          p2:
            was: '1837 年 2 月 19 日，毕希纳在苏黎世去世，《沃伊采克》没有写完。'
            now: '这条分支里，{staff}用事务所的纳米医疗箱帮他退了烧。毕希纳活过这一场病，有力气问起案上那几页稿子。'
            who: buchner_zurich
            bio: '这条分支里，毕希纳熬过了 1837 年 2 月在苏黎世的那场病。'
        vignettes:
          order: '试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。'
          pause: '你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。'
          gap: '纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。'
text:
  en:
    name: Georg Büchner
    text: German writer and revolutionary, 1813 to 1837. He wrote the plays Danton's Death and Woyzeck, and fled to Zurich after publishing a pamphlet calling for revolt. He died there at twenty-three.
  zh:
    name: 格奥尔格·毕希纳
    text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单流亡，二十三岁时在苏黎世去世。
