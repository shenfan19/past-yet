    text:
      en:
        name: 'Two drafts on the rehearsal table'
        place: "Zurich"
        figure: "Georg Büchner"
        story: 'Georg Büchner left Woyzeck unfinished. The Klassik Stiftung Weimar holds and digitises the manuscript fragments, which preserve different stages of the play. The 1837 Zürich exercise uses invented practice copies and a reader. It makes no claim to recover Büchner’s intended final scene order.'
        relic: "A bundle of scenes"
        relic_desc: "Loose scenes in a cramped hand, in no fixed order."
        points:
          p1: 'Identify which exercise page belongs to which draft'
          p2: 'Help a reader try both orders without discarding a page'
          p3: 'Keep the interruption visible in the reading copy'
        vignettes:
          order: 'The reader has put the two copies together and numbered the scenes in ink. You add a separate label to each source and write the proposed order on a removable slip. The next reader can undo it. You bring home that slip; you still do not have a final order.'
          pause: 'You know future theatres will have to decide what goes next. The reader asks if your answer is the author’s. You try both beginnings aloud and mark where they leave different questions. You can take two pauses home, and no finished script.'
          gap: 'You ask the reader to stop the moment the page stops. Neither of you supplies the missing line. On your copy you leave a space wide enough to notice at a glance. That space is what you remember when you get back.'
      zh:
        name: '排练桌上的两份残稿'
        place: "苏黎世"
        figure: "格奥尔格·毕希纳"
        story: '格奥尔格·毕希纳留下未完成的《沃伊采克》。魏玛古典基金会保存并数字化了手稿残篇，其中有不同阶段的文字。卡里 1837 年苏黎世的试读用的是虚构的练习抄件，也没有替作者定出最后的场序。'
        relic: "一叠零散的场景稿"
        relic_desc: "字迹局促的散页，没有固定的顺序。"
        points:
          p1: '辨认练习纸各属哪一稿'
          p2: '让试读的人把两种顺序都读一遍，保留每一页'
          p3: '让试读本看得出文字在哪里断开'
        vignettes:
          order: '试读人把两份拢在一起，用墨写好了场次。你为两份抄件各补一张出处签，把试排的顺序另写在能取下的纸上。下一个人还可以改排。你带回纸条，仍没有拿到定稿的场序。'
          pause: '你知道后来的剧院也得选下一场怎么接。试读人问你这是不是作者定的。你把两个起头各念一遍，标明它们各把什么问题留给台下。带回的是两个停顿，没有一本完整剧本。'
          gap: '纸上的字断在哪里，你就请试读人停在哪里。谁也没补那句空着的话。你让副本上的空白大到一眼就能认出。回来以后，你记得的正是那处停顿。'
text:
  en:
    name: Georg Büchner
    text: German writer and revolutionary, 1813 to 1837. He wrote the plays Danton's Death and Woyzeck, and fled to Zurich after a pamphlet calling for revolt. He died of typhus at twenty three.
  zh:
    name: 格奥尔格·毕希纳
    text: 德国作家与革命者，1813 年生，1837 年去世。他写了《丹东之死》和《沃伊采克》，因一份号召起义的传单逃往苏黎世。他二十三岁死于伤寒。
hook: {en: 'Which scene belongs next if there is no final copy?', zh: '没定稿，下一场敢排在哪儿？'}
