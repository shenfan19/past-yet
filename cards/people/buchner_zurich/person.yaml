    scene:
      star_rules: 2
      points:
        - {id: p1, kind: care, day: 19, overturns: [minna], req: {"any":[{"trait":["kind","attached","vigil"],"stat":{"will":5}},{"job":["courier","driver","rideshare_driver"]},{"stat":{"luck":8}}]}}
