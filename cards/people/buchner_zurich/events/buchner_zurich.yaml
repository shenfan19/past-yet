text:
  en:
    name: "Woyzeck unfinished"
    place: "Zurich"
    figure: "Georg Büchner"
    story: "Georg Büchner, a young lecturer in natural science and a playwright, dies of typhus in Zurich at twenty three, leaving his play Woyzeck unfinished."
    relic: "A bundle of scenes"
    relic_desc: "Loose scenes in a cramped hand, in no fixed order."
    points:
      p1: "Read the scenes and sense their order"
      p2: "Sit with him through the fever"
      p3: "Keep the scenes safe for those who will read them (an archivist, a librarian or a stubborn one helps)"
  zh:
    name: "未完成的沃伊采克"
    place: "苏黎世"
    figure: "格奥尔格·毕希纳"
    story: "格奥尔格·毕希纳是年轻的自然科学讲师和剧作家，二十三岁死于苏黎世的伤寒，剧本《沃伊采克》没有写完。"
    relic: "一叠零散的场景稿"
    relic_desc: "字迹局促的散页，没有固定的顺序。"
    points:
      p1: "读着这些场景，感觉它们的次序"
      p2: "在高烧中陪着他"
      p3: "把稿子妥善保管，留给将来的读者（档案员、图书管理员或固执的人更合适）"
