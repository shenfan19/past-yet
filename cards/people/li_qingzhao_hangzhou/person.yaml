    text:
      en: 'Around 1131: Li Qingzhao recalled a theft at her lodgings in Kuaiji. She recovered eighteen scrolls afterwards.'
      zh: '约 1131 年，李清照记述在会稽寓居时遭遇失窃，后来寻回十八轴。'
    line:
      en: 'Around 1131: Li Qingzhao recalled a theft at her lodgings in Kuaiji. She recovered eighteen scrolls afterwards.'
      zh: '约 1131 年，李清照记述在会稽寓居时遭遇失窃，后来寻回十八轴。'
      zh-Hant: '約 1131 年，李清照記述在會稽寓居時遭遇失竊，後來尋回十八軸。'
      fr: "Vers 1131\_: Li Qingzhao se souvient d'un vol dans son logement à Kuaiji. Elle a ensuite récupéré dix-huit rouleaux."
      es: 'Alrededor de 1131: Li Qingzhao recordó un robo en su alojamiento en Kuaiji. Después recuperó dieciocho pergaminos.'
      ja: '1131年頃：李青照は会稽の下宿で盗難に遭ったことを思い出した。その後、彼女は18巻の巻物を回収した。'
      ko: '1131년경: 이청조는 Kuaiji의 숙소에서 도난 사건을 회상했습니다. 그 후 그녀는 18개의 두루마리를 되찾았습니다.'
      ru: 'Около 1131 года: Ли Цинчжао вспомнила о краже в ее квартире в Куайцзи. Впоследствии она нашла восемнадцать свитков.'
  postface:
    date: '1132'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [li_qingzhao_hangzhou_primary]
    text:
      en: 'Li Qingzhao''s postface to the Jinshi lu recalls how she and Zhao Mingcheng gathered books and inscriptions and how much of the collection was later dispersed.'
      zh: '李清照在《金石录后序》中回忆她与赵明诚搜求书籍金石，以及后来收藏散失的经过。'
