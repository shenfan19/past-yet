      points:
        - {"id":"p1","kind":"trust","day":8,"req":{"any":[{"job":["archivist","restorer","antique_dealer"],"stat":{"will":5}},{"trait":["methodical","kind","patient"],"stat":{"wit":6,"will":5}}]}}
    text:
      en:
        name: 'Leave this chest with a neighbour'
        place: 'Kuaiji'
        figure: 'Li Qingzhao'
        story: 'Li Qingzhao wrote that her books and pictures had already suffered repeated losses when she lodged in Kuaiji. She described a theft there and the recovery of eighteen scrolls.'
        story_prose:
          opening:
            - 'By the time Li Qingzhao lodges in Kuaiji, she has already lost books and pictures several times. Writing her afterword to the Record of Metal and Stone, she could still account for much of what went missing on this part of the journey.'
            - 'In history, a theft in Kuaiji cost her more of the collection. She recovered eighteen scrolls. In this branch the chests are still in the room. One stands near enough to the bed that she can reach it without rising.'
            - 'Someone who knows how to look after books and pictures can help. If the neighbours hesitate, it takes patience to agree on where a chest would go and which door she should knock on when she wants it back.'
          points:
            p1: 'Li Qingzhao opens the chest by the bed, takes out two scrolls and returns one. {staff} asks the neighbour to look at the chest and its lock, then has them each put a mark on the same tally. Before they carry it out, Li slips a short brush into the gap beneath the lid. The neighbour takes the weight from below; she takes the other end, and together they cross the threshold.'
          outcomes:
            all: 'When she gets the chest back, she looks first for the brush. It is still by the lid. On a corner of paper she tries a stroke. The ink spreads more slowly than she remembers.'
            p1: 'When she gets the chest back, she looks first for the brush. It is still by the lid. On a corner of paper she tries a stroke. The ink spreads more slowly than she remembers.'
          none: 'After the theft she lays out the scrolls she was able to recover. When she finishes counting, her hands come to rest on the bare part of the table.'
          not_admitted: '{staff} never meets Li Qingzhao. Through the door comes the sound of a chest being shut.'
          excerpts:
            p1: 'Before they carry it out, Li slips a short brush into the gap beneath the lid. The neighbour takes the weight from below; she takes the other end, and together they cross the threshold.'
        relic: 'A chest tally'
        relic_desc: 'An imagined tally for the one chest she chose to leave elsewhere.'
        points:
          p1: 'Arrange for a trusted neighbour to take charge of one chest Li Qingzhao chooses before the theft'
        points_fail:
          p1: 'The employee did not find anyone who could take charge of the chest.'
        shift:
          p1:
            was: 'Around 1131: Li Qingzhao recalled a theft at her lodgings in Kuaiji. She recovered eighteen scrolls afterwards.'
            now: '{staff} arranges for one chest of her choice to be kept in another household. Li Qingzhao retrieves it later with its contents intact.'
            who: li_qingzhao_hangzhou
            bio: 'Li Qingzhao recovered a chest of books and pictures she had left in a neighbour’s care.'
      zh:
        name: '这一箱先寄在邻家'
        place: '会稽'
        figure: '李清照'
        story: '李清照记下，寓居会稽时，她的书画已经历过几次散失。她在当地又遇失窃，后来寻回十八轴。'
        story_prose:
          opening:
            - '李清照到会稽寓居时，手里的书画已经散过几回。她后来写《金石录后序》，还能说清这一趟陆续失了些什么。'
            - '史实里，她在会稽遭窃，后来寻回十八轴。在这条分支里，箱子还都在房里。有一箱靠着床，她每天伸手就够得着。'
            - '这趟用得上懂得照管书画的人。遇到别人不肯答应，还得耐着性子问清东西能放在哪、她要取时该敲哪扇门。'
          points:
            p1: '李清照打开靠着床的箱子，翻出两卷，放回去一卷。{staff}请邻人先来认好箱子和锁，再让两人在同一张箱签上各按一个记号。搬出门以前，她又把一支短笔塞进盖下的空处。邻人托住箱底，她提着另一边，两个人一前一后过了门槛。'
          outcomes:
            all: '后来她取回箱子，先找的就是那支笔。笔还躺在盖边。她从纸角试了一道，墨洇开得比从前慢。'
            p1: '后来她取回箱子，先找的就是那支笔。笔还躺在盖边。她从纸角试了一道，墨洇开得比从前慢。'
          none: '东西散去以后，她把寻回的卷轴摊开数。数到最后，她把两手停在空出来的桌面上。'
          not_admitted: '{staff}没能见到李清照。隔着门，屋里传来箱盖合上的声音。'
          excerpts:
            p1: '搬出门以前，她又把一支短笔塞进盖下的空处。邻人托住箱底，她提着另一边，两个人一前一后过了门槛。'
        relic: '一张箱签'
        relic_desc: '分支里的箱签，标记李清照亲自挑出、另寄在邻家的一箱。'
        points:
          p1: '请一位可靠的邻人，在失窃前接下李清照亲自挑出的一箱书画'
        points_fail:
          p1: '员工没能找到肯替她收存那一箱的人。'
        shift:
          p1:
            was: '约 1131 年，李清照记述在会稽寓居时遭遇失窃，后来寻回十八轴。'
            now: '{staff}请到邻人，把她亲自挑的那一箱收在另一处。李清照后来回来取箱，里面的东西还在。'
            who: li_qingzhao_hangzhou
            bio: '李清照收回了一箱曾寄在邻家保管的书画。'
text:
  en:
    name: Li Qingzhao
    text: Chinese poet of the Song, about 1084 to about 1155. She moved south after 1127, lost her husband in 1129, and wrote about the books and objects they had gathered together.
  zh:
    name: 李清照
    text: 宋代词人，约 1084 年生，约 1155 年去世。她在 1127 年以后南渡，丈夫于 1129 年去世。她后来写下了两人共同收集的书籍和器物。
