quotes:
  li_qingzhao_hangzhou_echo_full:
    order: 1
    tier: full
    date: '1134'
    checked: official_record
    sources: [li_qingzhao_hangzhou_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Li Qingzhao'
        quote: 'Two days later, a neighbour, Zhong Fuhao, brought out eighteen scrolls and asked for the reward.'
        occasion: 'Afterword to the Record of Metal and Stone, recollecting the scrolls recovered in Kuaiji.'
      zh:
        who: '李清照'
        quote: '两天以后，邻人钟复皓拿出十八轴，来求赏。'
        occasion: '《金石录后序》，记会稽失窃后寻回的卷轴。'
      zh-Hant:
        who: '李清照'
        quote: '後二日，鄰人鐘復皓出十八軸求賞'
        occasion: '《金石录后序》，记会稽失窃后寻回的卷轴。'
      fr:
        who: 'Li Qingzhao'
        quote: 'Deux jours plus tard, un voisin, Zhong Fuhao, sortit dix-huit rouleaux et demanda la récompense.'
        occasion: 'Postface au Record of Metal and Stone, rappelant les parchemins récupérés à Kuaiji.'
      es:
        who: 'Li Qingzhao'
        quote: 'Dos días después, un vecino, Zhong Fuhao, sacó dieciocho pergaminos y pidió la recompensa.'
        occasion: 'Epílogo al Registro de Metal y Piedra, rememorando los pergaminos recuperados en Kuaiji.'
      ja:
        who: '李清照'
        quote: '2日後、隣人の鍾福豪が18巻の巻物を持ち出し、賞金を要求した。'
        occasion: '『金属と石の記録』のあとがき、会稽で回収された巻物を回想。'
      ko:
        who: '이청조'
        quote: '이틀 후, 이웃 종푸호(Zhong Fuhao)가 두루마리 18권을 가져와 보상을 요구했습니다.'
        occasion: '콰이지에서 회수된 두루마리를 회상하며 금속석기의 후기입니다.'
      ru:
        who: 'Ли Цинчжао'
        quote: 'Два дня спустя сосед Чжун Фухао принес восемнадцать свитков и попросил награду.'
        occasion: 'Послесловие к «Записям о металле и камне», вспоминающее свитки, найденные в Куайджи.'
  li_qingzhao_hangzhou_echo_none:
    order: 2
    tier: none
    date: '1134'
    checked: official_record
    sources: [li_qingzhao_hangzhou_echo_source_none]
    original: zh-Hant
    text:
      en:
        who: 'Li Qingzhao'
        quote: 'One night, someone made a hole in the wall and carried off five chests.'
        occasion: 'Afterword to the Record of Metal and Stone, recollecting the theft at her lodgings.'
      zh:
        who: '李清照'
        quote: '忽然有一夜，有人凿开墙壁，把五只箱子背走了。'
        occasion: '《金石录后序》，记会稽寓所失窃。'
      zh-Hant:
        who: '李清照'
        quote: '忽一夕，穴壁負五簏去'
        occasion: '《金石录后序》，记会稽寓所失窃。'
      fr:
        who: 'Li Qingzhao'
        quote: 'Une nuit, quelqu''un a fait un trou dans le mur et emporté cinq coffres.'
        occasion: 'Postface au Record of Metal and Stone, se remémorant le vol dans son logement.'
      es:
        who: 'Li Qingzhao'
        quote: 'Una noche, alguien hizo un agujero en la pared y se llevó cinco cofres.'
        occasion: 'Epílogo al Registro de Metal y Piedra, recordando el robo en su alojamiento.'
      ja:
        who: '李清照'
        quote: 'ある夜、何者かが壁に穴を開け、5つの箱を持ち去った。'
        occasion: '『金属と石の記録』のあとがき、下宿での盗難事件の回想。'
      ko:
        who: '이청조'
        quote: '어느 날 밤, 누군가가 벽에 구멍을 뚫고 상자 다섯 개를 가져갔습니다.'
        occasion: '금속과 돌의 기록에 대한 후기, 그녀의 숙소에서 도난당한 사건을 회상합니다.'
      ru:
        who: 'Ли Цинчжао'
        quote: 'Однажды ночью кто-то проделал дыру в стене и унес пять сундуков.'
        occasion: 'Послесловие к «Записям о металле и камне», вспоминающее кражу в ее квартире.'
