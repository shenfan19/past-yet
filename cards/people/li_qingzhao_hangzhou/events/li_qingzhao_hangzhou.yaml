text:
  en:
    name: "The lost collection"
    place: "Hangzhou"
    figure: "Li Qingzhao"
    story: "Widowed and far from her northern home, Li Qingzhao has lost most of the books and inscriptions she and her husband gathered. In Hangzhou she writes poems of memory, and the record of her life ends in these years."
    relic: "A rubbing of an old inscription"
    relic_desc: "Ink pressed from a stone, the kind she and her husband collected."
    points:
      p1: "Listen to her read her poems"
      p2: "Find her in a good hour"
      p3: "Help her put the catalogue in order (a record keeper, a teacher or a determined employee)"
  zh:
    name: "失去的藏品"
    place: "杭州"
    figure: "李清照"
    story: "李清照丧夫后远离北方的家乡，她和丈夫一起收集的书籍和金石大多已经失去。在杭州，她写下充满回忆的诗词，关于她生平的记载也止于这几年。"
    relic: "一张古碑拓片"
    relic_desc: "用墨从石头上拓下来的纸，是她和丈夫曾经收集的那种。"
    points:
      p1: "听她读自己的词"
      p2: "碰上她心情好的时候"
      p3: "帮她把目录理清"
