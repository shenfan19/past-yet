text:
  en:
    name: Laozi
    text: Traditional name of the author of the Daodejing, said to have lived around the sixth century BC. According to the account of Sima Qian he wrote the text at Hangu Pass before leaving China. Whether he existed as one person is debated.
  zh:
    name: 老子
    text: 《道德经》作者的传统称呼，相传生活在公元前六世纪前后。据司马迁的记载，他离开中原前在函谷关写下此书。历史上是否确有其人，学界有争议。
