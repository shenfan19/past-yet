    text:
      en:
        name: 'The traveller at the pass'
        place: Hangu Pass, China
        figure: Laozi
        story: 'Sima Qian’s much later Shiji tells of a gatekeeper named Yin Xi asking Laozi to leave a written work. It describes two parts and more than five thousand words, and gives variant accounts of Laozi’s identity. Its year, the named pass, and the helpers’ work are settings for the story.'
        relic: 'A practice slip with a position mark'
        relic_desc: 'An invented prop from the legendary gate scene.'
        points:
          p1: 'Ask the gate helper to let the two bundles lie apart'
          p2: 'Read the position marks before the bundle is tied'
          p3: 'Keep the loose slips in order while the cart is called up'
        vignettes:
          two: 'Shun has made room on his shelf for one bundle. Another comes across the table with the cord still loose. You set the two bundles end to end and ask which was read first. He makes room for both without tying them into one.'
          tie: 'Xi has to move the shelf before the gate closes. You hold the loose slips together while she rethreads the cord. She keeps one practice slip aside with the position marked. The next keeper will know where to put it back.'
          ox: 'You remember pictures of a traveller on an ox. Shun only heard a cart beyond the gate and asks what to enter. You let him write that much. When you turn back for a look yourself, the noise has already passed beyond the wall.'
      zh:
        name: '关前的旅人'
        place: 中国函谷关
        figure: 老子
        story: '晚出数百年的《史记》说，关令尹喜请老子留下著作，书分上下篇、五千余言。同一篇传记还收了关于老子身份的不同说法。'
        relic: '一支留有位置记号的练习简'
        relic_desc: '出关传说场景中的道具。'
        points:
          p1: '请关吏先把两束简分开摆'
          p2: '捆简前认清位置记号'
          p3: '等人叫来车时，守好松散竹简的次序'
        vignettes:
          two: '顺只在架上腾出一束简的地方，桌上却又来一束，绳子还没捆牢。你把两束一前一后摆开，问他哪束刚才先读。他给两束都腾了地，绳子仍然各系各的。'
          tie: '关门前，习得把架子挪开。她重新穿绳时，你按住松开的简。她另留一支练习简，记了原来夹在哪儿。下一班守关人知道该把它搁回哪里。'
          ox: '你记得后人画过旅人骑牛。顺在关门外只听到车声，问登记该写什么。你让他先写自己听到的那一点。等你回头想看，声音已经去了墙外。'
text:
  en:
    name: Laozi
    text: Traditional name associated with the Daodejing. Sima Qian tells of a traveller who left a text at a pass in response to Yin Xi’s request and gives more than one account of Laozi’s identity.
  zh:
    name: 老子
    text: 与《道德经》相连的传统称呼。司马迁记老子应尹喜之请在关口留下著作，也收录了有关老子身份的不同说法。
hook: {en: 'What can the gatekeeper put on the docket?', zh: '守关人能在登记上写下什么？'}
facts:
  pass:
    date: '-100'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [laozi_hangu_pass]
    text:
      en: 'The Western Han biography tells the story of Yin Xi, a written work in two parts, and Laozi leaving. It gives variant accounts and does not date the visit.'
      zh: '西汉传记写关令尹喜、上下两篇及老子离去，也记有异说，没有给这次出关定年。'
  ox_story:
    date: '978'
    checked: official_record
    level: careful
    use: [story, wiki]
    sources: [laozi_hangu_ox_story]
    text:
      en: 'The Song anthology transmits later stories of Laozi travelling west and the gate encounter. Their elaborations differ from the Shiji account.'
      zh: '宋代类书汇集后世老子西行、过关故事，细节与《史记》的叙述有异。'
bystanders:
  shun:
    invented: true
    text: {en: 'A fictional gate helper who keeps a record of arrivals and departures.', zh: '虚构关吏顺，负责登记出入。'}
  xi_helper:
    invented: true
    text: {en: 'A fictional shelf keeper called Xi, distinct from Yin Xi.', zh: '虚构管架的帮工习，与关令尹喜是不同的人。'}
