text:
  en:
    name: Charles Babbage
    text: English mathematician and inventor, 1791 to 1871, who designed the Difference Engine and the Analytical Engine, a general calculating machine to be worked by punched cards. Neither was finished in his lifetime. Ada Lovelace translated an account of the Analytical Engine in 1843 and added her own Notes.
  zh:
    name: 查尔斯·巴贝奇
    text: 英国数学家与发明家，1791 年生，1871 年去世，设计了差分机和分析机，后者是一台用穿孔卡控制的通用计算机器。两台机器在他生前都没有造成。1843 年，阿达·洛芙莱斯翻译了一篇分析机的介绍，并加上了她自己的注释。
