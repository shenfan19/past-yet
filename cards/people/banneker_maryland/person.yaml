    text: {en: 'A fictional workshop helper preparing the wrapper.', zh: '虚构帮工蕾切尔，负责准备包纸。'}
  isaac:
    invented: true
    text: {en: 'A fictional carrier with room for one flat packet.', zh: '虚构送件人艾萨克，包里只剩一个薄信包的位置。'}
