    text:
      en:
        name: 'Two things in the packet'
        place: "Maryland"
        figure: "Benjamin Banneker"
        story: 'On 19 August 1791, Benjamin Banneker wrote to Thomas Jefferson, sent a manuscript of his almanac for the following year, and challenged racial prejudice and slavery. The packing table and its two helpers are imagined. Players can protect the connection between the letter and the work it accompanies.'
        story_prose:
          opening:
            - 'The printer’s messenger and the outgoing post are both at the door. Banneker writes the mills’ name on the letter and turns his almanac to its last page to make sure his handwritten copy is still on the table. He has things to say in that letter he will only send once.'
            - 'On 19 August 1791 Benjamin Banneker sent Thomas Jefferson a manuscript almanac with a letter challenging the denial of liberty to Black people. A fire in 1806 destroyed much of what he kept at home, although at least one manuscript journal survived. This branch can leave more of his chosen papers somewhere else.'
            - 'Have a traveller who can check the printer’s copy against the handwritten one mind both packets. If a copyist can make time for an extra set, ask Banneker which notes may be copied.'
          points:
            p1: 'The messenger turns both sets to July and finds nearly the same column of figures. You ask Banneker to identify the manuscript meant for Jefferson, and the postman to read the name on the envelope aloud. One thread goes round letter and almanac. The printer’s papers lie flat on the counter. The postman reads the address before he reaches for the knot.'
            p2: 'The copyist brings a thick sleeve. Banneker lifts out a few sheets and leaves the dated observations and workings he can check. He asks you to read back a corrected figure and check that the old one was left out of the calculation. At the other house, the keeper opens the extra set and reads the first date aloud.'
          outcomes:
            all: 'Jefferson’s reply acknowledges both items. When fire reaches the house years later, the copy elsewhere still holds the observations Banneker agreed to share.'
            p1: 'The letter and almanac go out together. More of the working papers stay at home and are lost with many of his belongings.'
            p2: 'A checked set has been left away from the house. The outgoing mail goes wrong, and the traveller brings home the date read on the spare set.'
          none: 'There is no separately marked packet on the table. Readers can consult only the working notes that survived in history.'
          not_admitted: 'The printer’s man checks names before closing his box. He does not recognise the visitor and puts the packet back by Banneker’s door.'
          desync: 'The printer collects the only almanac that can go with the letter. The historical enclosure is missing and the office recalls the traveller.'
          excerpts:
            p1: 'The postman reads the address before he reaches for the knot.'
            p2: 'At the other house, the keeper opens the extra set and reads the first date aloud.'
        relic: 'A duplicate wrapper label'
        relic_desc: 'A fictional copy naming the almanac and its accompanying letter.'
        points:
          p1: 'Keep the printer''s copy separate so Banneker can send his handwritten almanac with the letter'
          p2: 'Ask Banneker which working papers he wants copied, then arrange for a checked set to stay away from the house'
        points_fail:
          p1: 'The printer takes the only copy available for the letter. The branch falls out of sync and the office recalls the employee.'
          p2: 'Most of the working papers remain at home and burn with the house.'
        shift:
          p1:
            was: 'On 19 August 1791, Banneker wrote to Jefferson and enclosed a handwritten copy of his almanac.'
          p2:
            was: 'On the day of Banneker''s funeral in 1806, a fire destroyed his home and much of his manuscript material.'
            now: '{staff} asks Banneker which notebooks can be kept elsewhere and finds a printer willing to copy them. After the fire, readers can still consult a copy of his observations and working calculations.'
            who: banneker_maryland
            bio: 'Some of Banneker’s other working papers survive separately alongside the journal that survived in history.'
        vignettes:
          packet: 'Rachel sees the months on the first page and begins a label for a book of calculations. You set the letter beside it and ask her to finish the label after reading the address. She threads one tie through both wrappers. The tables will travel under the sender’s name and with his argument still attached.'
          handoff: 'Isaac has room in the satchel for one flat packet. The wax on the letter is still soft. You hold the wrapper open while he slips in a folded guard to keep the letter from sticking to the tables. He leaves with both. You stay long enough to watch the empty square the packet left on the table.'
          reply: 'You know a reply will come swiftly. Isaac asks whether that settles what the letter has raised. You copy the date on the outgoing packet and leave the space for a reply as you found it. The packet is on its way. No promise has come back through the door.'
      zh:
        name: '要一起寄出的两件东西'
        place: "马里兰"
        figure: "本杰明·班纳克"
        story: '1791年8月19日，本杰明·班纳克致信托马斯·杰斐逊，随信送去下一年的历书手稿，质问种族偏见与奴隶制度。'
        story_prose:
          opening:
            - '印坊的信使和要离开的邮差都在门口。班纳克把磨坊附近的地名写上信，又把历书翻到末页，确认亲笔的那份还在桌上。信里有些话只寄这一次。'
            - '史实里，班纳克在 1791 年 8 月 19 日给杰斐逊写信，随信寄了亲笔年历，质问黑人为何被剥夺自由。1806 年住宅失火，他的大部分遗物损毁，至少一本手写笔记幸存。分支里还能另存他愿让人读的草算和观测笔记。'
            - '让能核对送印稿和亲笔稿的人守着两个纸包。若能说服印坊为家外另存的一份留出时间，让班纳克自己挑要抄的页。'
          points:
            p1: '理事把两份稿都翻到七月，看见差不多相同的一列数。你请班纳克指认给杰斐逊的那份，再请信使当面念出封上的收件人。信和亲笔年历捆在同一根细绳里；给印坊的纸平放在柜上。邮差读完地址，才把手伸向绳结。'
            p2: '抄写人递来一个很厚的纸套。班纳克从底下抽出几页，留下有日期、能核查的观测和草算。他让你读一处改过的数，看抄本有没有把旧数也算进去。那份副稿送到住家外时，保管人照着第一页读了一遍日期。'
          outcomes:
            all: '杰斐逊的回信确认两个东西都收到。多年后火烧到屋里，屋外那份副稿仍留着班纳克准人抄下的笔记。'
            p1: '信和历书一起寄出。更多草算仍留在家里，后来随住宅里的许多物件一起损毁。'
            p2: '住家外已有一份核过的副稿。邮包出了差错，员工短记只留着出门前在副稿上看见的日期。'
          none: '屋里找不到分开标记的纸包。后来能读到的草算，仍只有原先侥幸留存的部分。'
          not_admitted: '印坊的人关上箱子前要核来客的名字。没认出来，他把纸包放回班纳克的门边。'
          desync: '印坊从桌上取走了唯一能随信寄出的历书。信件失去史有的附件，事务所召回员工。'
          excerpts:
            p1: '邮差读完地址，才把手伸向绳结。'
            p2: '那份副稿送到住家外时，保管人照着第一页读了一遍日期。'
        relic: '一张留底的信包签'
        relic_desc: '留底签，写明里头有历书，也有随附的信。'
        points:
          p1: '替班纳克隔开给印坊的底稿，护住他要随信寄出的那份亲笔年历'
          p2: '请班纳克选定愿意交人抄录的底稿，把核过的一份交到住家以外的地方保存'
        points_fail:
          p1: '唯一能随信寄出的抄本被印坊带走，信里没有年历可供查验。这条分支与史实脱节，员工当天被召回。'
          p2: '草算依旧集中留在家中，多数手稿和住宅一起烧失。'
        shift:
          p1:
            was: '1791 年 8 月 19 日，班纳克写信给杰斐逊，并随信附上一份亲笔抄写的年历。'
          p2:
            was: '1806 年班纳克下葬当天，他的住宅失火，许多手稿随之烧毁。'
            now: '{staff}请班纳克指定哪几册可以交给外地保管，再请印坊替他复抄。后来家中失火，校过的观测和推算还有一份可查。'
            who: banneker_maryland
            bio: '除了原本留存的笔记，又有一部分班纳克的工作底稿由于另存而传了下来。'
        vignettes:
          packet: '蕾切尔看见首页排着月份，就要给包裹写上算表。你把信搁在边上，请她读过收件地址，再把签写完。她用一根线把两件包在一起。表随寄件人署名上路，他要说的话也跟着去。'
          handoff: '艾萨克的挎包还能塞进一个薄信包，信上的封蜡还软着。你撑开包纸，让他插一片折纸，把信和表隔开。他两件都带上了。你多站了一会儿，看桌上信包留下的一小块空地。'
          reply: '你知道很快会有回信。艾萨克问，这样信里说的事就能解决吗？你抄下寄出日期，把回信那格照原样留空。信包已经上路，还没有任何承诺回来。'
text:
  en:
    name: "Benjamin Banneker"
    text: "Self taught American astronomer and farmer, born 1731, died 1806. In 1791 he helped survey the site of Washington, and from 1792 he published almanacs."
  zh:
    name: "本杰明·班纳克"
    text: "美国自学成才的天文学家和农夫，1731 年生，1806 年去世。1791 年他协助测绘华盛顿特区，1792 年起出版历书。"
hook: {en: 'Can the argument travel with the tables?', zh: '历书寄出时，那封信也带上吗？'}
facts:
  fire:
    date: '1806'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [banneker_maryland_fire]
    text:
      en: 'Banneker’s house burned on the day of his funeral in 1806. Most of his possessions were lost, but at least his manuscript journal survived.'
      zh: '1806 年班纳克下葬当天，住宅失火。他的大部分遗物损毁，但手写笔记仍有存世。'
    line:
      en: '1806: a fire destroys much of what Banneker kept in his house.'
      zh: '1806 年，一场火烧毁了班纳克存放在家中的许多物件。'
  letter:
    date: '1791-08-19'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [banneker_maryland_letter]
    text:
      en: 'Banneker refers to the manuscript almanac he is enclosing and insists that Jefferson confront the denial of liberty to Black people.'
      zh: '班纳克提到随信送出的历书手稿，要求杰斐逊正视黑人被剥夺自由的现实。'
  reply:
    date: '1791-08-30'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [banneker_maryland_reply]
    text:
      en: 'Jefferson’s 30 August reply acknowledges both the letter and the almanac. Its inventory helps distinguish an acknowledgement from the changes Banneker sought.'
      zh: '杰斐逊在8月30日的回信里确认收到信与历书。确认收到，与班纳克要求的改变，是两回事。'
