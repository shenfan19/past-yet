    text:
      en:
        name: "A room by the steps"
        place: "Rome"
        figure: "John Keats"
        story: 'In November 1820 John Keats, ill with tuberculosis, came to Rome with the painter Joseph Severn and took rooms at 26 Piazza di Spagna beside the Spanish Steps. He died there on the night of 23 February 1821 and was buried on 26 February in the cemetery by the Pyramid of Cestius. At his wish, his gravestone does not give his name.'
        story_prose:
          opening:
            - 'Rome, mid November 1820. The poet John Keats, twenty five and ill with tuberculosis, takes rooms with the painter Joseph Severn on the second floor of 26 Piazza di Spagna, at the foot of the Spanish Steps. In a few short years he has written his main poems, the odes among them, and this is his last winter.'
            - 'In history, the doctor James Clark put him on a starvation diet, one anchovy and a piece of bread a day, and bled him again and again; Severn looked after him alone, the money soon stopped, and the nights went without sleep; to the end he believed he had left nothing behind, and at his wish his gravestone carries no name. In this branch, a flower seller sells violets at the foot of the steps, and a neighbour on the stairs often asks after the sick lodger.'
            - 'A few kinds of people can help on this trip: someone who knows medicine and can stop the bleeding, or someone with a modern care handbook; someone who can keep watch through the long nights and hold out themselves, or someone with a sleep regulator; someone well read who knows poetry, and can tell him what will become of his poems.'
          outcomes:
            all: 'Late on 23 February Keats died, with Severn at the bedside. In those last months he could eat hot soup and bread, and he had heard someone say that his poems would go on being read. Three days later he was buried in the cemetery by the Pyramid of Cestius, and at his wish the stone carried no name.'
            p3: 'On 26 February he was buried in the cemetery by the Pyramid of Cestius, and at his wish the stone carried no name. The room beside the Spanish Steps was kept, and its window still looks onto the square.'
            p2: 'In those last months there was more on the table than one anchovy and a piece of bread. On 26 February 1821 he was buried in the cemetery by the Pyramid of Cestius.'
            p1: 'Late on 23 February Keats died, and Severn was at the bedside to the end. More than fifty years later Severn was buried in the same cemetery, beside Keats.'
          none: 'In January Severn wore himself out and collapsed in the next room. Late on 23 February the piece of bread and the anchovy were still on the table, and the chair by the bed was empty.'
          desync: 'In January Severn collapsed. When {staff} was recalled, he was lying in his clothes in the next room, the half written letter still open on the table and the ink bottle unstoppered.'
          not_admitted: '{staff} never got into the house, and only drew water a few times at the boat shaped fountain at the foot of the steps. When the flower seller asked who was ill upstairs, {staff} had no answer, and the window on the second floor stayed shut.'
          points:
            p2:
              class_medical: 'On the morning of 9 December Keats coughed up two cupfuls of blood. Dr Clark came, rolled up his sleeve and said he would take another eight ounces; on the table was the day''s food, one anchovy and a piece of bread. {staff}, who knew medicine, held the patient''s wrist and said he could not stand to be bled like this, then went through for the doctor everything he had eaten in the last few days, and the doctor put the lancet away. At midday Severn brought up a bowl of hot soup and a piece of bread. Keats sat back against the pillows, finished it spoonful by spoonful, and handed him back the empty bowl.'
              else: 'On the morning of 9 December Keats coughed up two cupfuls of blood. Dr Clark came, rolled up his sleeve and said he would take another eight ounces; on the table was the day''s food, one anchovy and a piece of bread. {staff} opened the modern care handbook brought along, read a passage from it aloud to the doctor, and wrote down everything the patient had eaten in the last few days and laid it in front of him, and the doctor put the lancet away. At midday Severn brought up a bowl of hot soup and a piece of bread. Keats sat back against the pillows, finished it spoonful by spoonful, and handed him back the empty bowl.'
            p1:
              class_medical: 'On 15 January Severn wrote that the bank had sent back his bill, and that the money in hand would pay the rent only once more; Keats would not let him out of his sight, so he could not go out to paint for money, and he had not slept a whole night through. {staff}, trained in nursing, took over the nights, lifting Keats up every so often to cough, wiping his sweat and changing the pillowcase, and turned the lamp down only near dawn. Severn slept in his clothes in the next room, his boots still on. When he woke in the morning he first opened the door and looked at the bed, then went back and finished the letter he had left unfinished.'
              else: 'On 15 January Severn wrote that the bank had sent back his bill, and that the money in hand would pay the rent only once more; Keats would not let him out of his sight, so he could not go out to paint for money, and he had not slept a whole night through. {staff}, used to keeping watch, pulled a chair up to the bed and sent Severn to sleep next door, and got up to look each time the patient turned over. Severn slept in his clothes in the next room, his boots still on. When he woke in the morning he first opened the door and looked at the bed, then went back and finished the letter he had left unfinished.'
            p3:
              class_lettered: 'By mid February Keats could no longer leave his bed. He still felt he had left nothing behind, and wished for no name on his gravestone. {staff}, who had read his books, sat down by the bed and talked about his odes: people would read them again and again and learn them by heart line by line, and this room in Rome would be kept for him. Keats listened without speaking, his fingers still on the sheet for a long while. Through the gap in the window came the sound of the fountain in the square, and in the book by the bed lay a pressed violet.'
              class_teaching: 'By mid February Keats could no longer leave his bed. He still felt he had left nothing behind, and wished for no name on his gravestone. {staff}, who had taught, sat down by the bed and said that in classrooms to come pupils would learn his odes by heart down to the last line, and that this room in Rome would be kept for him. Keats listened without speaking, his fingers still on the sheet for a long while. Through the gap in the window came the sound of the fountain in the square, and in the book by the bed lay a pressed violet.'
              else: 'By mid February Keats could no longer leave his bed. He still felt he had left nothing behind, and wished for no name on his gravestone. {staff} sat down by the bed and talked slowly about what would become of his poems: people would read them again and again and learn them by heart line by line, and this room in Rome would be kept for him. Keats listened without speaking, his fingers still on the sheet for a long while. Through the gap in the window came the sound of the fountain in the square, and in the book by the bed lay a pressed violet.'
          excerpts:
            p3: 'Keats listened without speaking, his fingers still on the sheet for a long while. Through the gap in the window came the sound of the fountain in the square, and in the book by the bed lay a pressed violet.'
            p2: 'At midday Severn brought up a bowl of hot soup and a piece of bread. Keats sat back against the pillows, finished it spoonful by spoonful, and handed him back the empty bowl.'
            p1: 'Severn slept in his clothes in the next room, his boots still on. When he woke in the morning he first opened the door and looked at the bed, then went back and finished the letter he had left unfinished.'
        relic: "A pressed violet"
        relic_desc: "A dried flower kept in a book."
        points:
          p1: 'Keep Severn on his feet through the stopped money and the sleepless nights, so that he stays by Keats to the end'
          p2: 'Stop Dr Clark''s starvation diet and bleeding, so that he can eat and keep his blood'
          p3: 'Before he dies, let him know that his poems will be read for generations'
        points_fail:
          p1: 'Severn collapsed in January, and in the last days nobody was at the bedside in his place.'
          p2: 'On 9 December he was bled another eight ounces as before, and each day he still had only one anchovy and a piece of bread.'
          p3: 'He still believed he had left nothing behind. In this branch nobody told him otherwise in those last days.'
        shift:
          p1:
            was: 'Late on 23 February 1821 Keats died, with Severn beside him to the end.'
          p2:
            was: 'On 9 December 1820 Keats was bled another eight ounces, and still had one anchovy and a piece of bread a day.'
            now: 'He could eat in those last months and was bled several times less, and he suffered somewhat less than in history.'
          p3:
            was: 'When Keats died in February 1821 he still believed he had left no lasting work; at his wish his gravestone bears no name.'
            now: '{staff} let him know in those last days that his odes would go on being read and learned by heart, and that this room in Rome would be kept for him.'
        vignettes:
          stairs: '{staff} counts the steps from the door to the room, so as to know how long the tray will stay warm, and writes the number in the margin of a shopping list.'
          window: '{staff} props the window a little so the sound of the fountain in the square comes in. Nobody in the room says anything about it, and nobody closes it.'
          fountain: '{staff} fills a jug at the boat shaped fountain at the foot of the steps. A flower seller, made up for the game, asks who in the house is ill, and gives a bunch of violets for half the price.'
      zh:
        name: "台阶旁的小屋"
        place: "罗马"
        figure: "约翰·济慈"
        story: '1820 年 11 月，患肺结核的约翰·济慈与画家约瑟夫·塞文来到罗马，住进西班牙台阶旁的西班牙广场 26 号。1821 年 2 月 23 日夜里他在那里去世，2 月 26 日葬在塞斯提乌斯金字塔旁的墓园。照他的意思，墓碑上没有他的名字。'
        story_prose:
          opening:
            - '1820 年 11 月中旬，罗马。二十五岁的诗人约翰·济慈患着肺结核，和画家约瑟夫·塞文住进西班牙台阶脚下、西班牙广场 26 号的二楼。他在短短几年里写出了包括颂诗在内的主要作品，这是他的最后一个冬天。'
            - '史实里，医生詹姆斯·克拉克给他定下饥饿疗法，每天一条凤尾鱼、一片面包，还一次次给他放血；塞文一个人照看他，钱很快断了，夜里也睡不成；他到最后都相信自己没有留下什么，照他的意思，墓碑上不刻名字。在这条分支里，台阶脚下有个卖紫罗兰的卖花人，楼梯上有个常问起楼上病人的邻居。'
            - '这一趟用得上几种人：懂医护、拦得住放血的人，或带着一本现代医护手册的人；守得住长夜、自己也熬得住的人，带着睡眠调节器也行；读过书、懂诗的人，说得出他的诗以后的样子。'
          outcomes:
            all: '2 月 23 日深夜，济慈去世，塞文守在床边。最后那几个月，他吃得上热汤和面包，也听人说过，他的诗以后会一直有人读。三天后，他葬在塞斯提乌斯金字塔旁的墓园，墓碑上照他的意思没有刻名字。'
            p3: '2 月 26 日，他葬在塞斯提乌斯金字塔旁的墓园，墓碑上照他的意思没有刻名字。西班牙台阶旁那间屋子后来留了下来，窗还朝着广场。'
            p2: '最后那几个月，桌上不再只有一条凤尾鱼和一片面包。1821 年 2 月 26 日，他葬在塞斯提乌斯金字塔旁的墓园。'
            p1: '2 月 23 日深夜，济慈去世，塞文一直守在床边。五十多年后，塞文也葬进了那片墓园，就在济慈旁边。'
          none: '一月里，塞文熬垮了，倒在隔壁屋里。2 月 23 日深夜，桌上还摆着那一片面包和一条凤尾鱼，床边的椅子空着。'
          desync: '一月里，塞文倒下了。{staff}被召回时，他和衣躺在隔壁屋里，那封写了一半的信还摊在桌上，墨水瓶没有盖。'
          not_admitted: '{staff}没能进这栋楼，只在台阶脚下的船形泉边打了几回水。卖花人问起楼上是谁病了，{staff}答不上来，二楼那扇窗一直关着。'
          points:
            p2:
              class_medical: '12 月 9 日早上，济慈咳出了两杯血。克拉克医生来了，挽起他的袖子，说要再放八盎司；桌上摆着这一天的饭，一条凤尾鱼，一片面包。{staff}懂医护，按住病人的手腕，说这样放下去人撑不住，又把他这几天吃下去的东西一样样报给医生听，医生把刀收了回去。那天中午，塞文端上来一碗热汤和一块面包。济慈靠在枕头上，一勺一勺喝完了，把空碗递回给他。'
              else: '12 月 9 日早上，济慈咳出了两杯血。克拉克医生来了，挽起他的袖子，说要再放八盎司；桌上摆着这一天的饭，一条凤尾鱼，一片面包。{staff}翻开带来的现代医护手册，指着书页上的一段念给医生听，又把病人这几天吃下去的东西一样样写在纸上，摊在医生面前，医生把刀收了回去。那天中午，塞文端上来一碗热汤和一块面包。济慈靠在枕头上，一勺一勺喝完了，把空碗递回给他。'
            p1:
              class_medical: '1 月 15 日，塞文在信里写，银行把汇票退了回来，手里的钱只够再付一回房租；济慈不让他离开视线，他出不了门画画挣钱，夜里也没睡过一个整觉。{staff}懂护理，接过了夜里的班，隔一阵扶济慈起来咳，替他擦汗、换枕巾，天快亮时才把灯捻小。塞文和衣睡在隔壁，靴子也没脱。早上他醒过来，先推开门朝床上看了一眼，又回去把那封没写完的信写完了。'
              else: '1 月 15 日，塞文在信里写，银行把汇票退了回来，手里的钱只够再付一回房租；济慈不让他离开视线，他出不了门画画挣钱，夜里也没睡过一个整觉。{staff}守得住夜，搬一把椅子坐在床边，让塞文去隔壁睡，病人一翻身，就起来看一眼。塞文和衣睡在隔壁，靴子也没脱。早上他醒过来，先推开门朝床上看了一眼，又回去把那封没写完的信写完了。'
            p3:
              class_lettered: '二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}读过他的书，坐到床边，说起他的几首颂诗：以后会有人一遍遍地读、一句句地背，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。'
              class_teaching: '二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}教过书，坐到床边，说起以后的课堂上，会有学生把他的颂诗一句句背到最后一行，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。'
              else: '二月中，济慈已经下不了床。他还是觉得自己什么也没留下，照他的意思，墓碑上不要刻名字。{staff}在床边坐下，慢慢说起他的诗以后的事：会有人一遍遍地读、一句句地背，罗马这间屋子也会一直为他留着。济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。'
          excerpts:
            p3: '济慈听着，没有说话，手指在被单上停了很久。窗缝里传进广场上泉水的声音，床头那本书里夹着一朵压干的紫罗兰。'
            p2: '那天中午，塞文端上来一碗热汤和一块面包。济慈靠在枕头上，一勺一勺喝完了，把空碗递回给他。'
            p1: '塞文和衣睡在隔壁，靴子也没脱。早上他醒过来，先推开门朝床上看了一眼，又回去把那封没写完的信写完了。'
        relic: "一朵压干的紫罗兰"
        relic_desc: "夹在书里的一朵干花。"
        points:
          p1: '护住塞文，钱断了、人熬垮了也让他守在济慈身边到最后'
          p2: '拦下克拉克医生的饥饿疗法和放血，让他吃得上饭'
          p3: '去世之前让他知道，他的诗会被一代代人读下去'
        points_fail:
          p1: '塞文在一月里倒下了，最后那些日子床边没有他。'
          p2: '12 月 9 日他照旧又被放了八盎司血，每天仍只有一条凤尾鱼和一片面包。'
          p3: '他照旧相信自己什么也没留下，这条分支里没有人在最后那几天告诉过他。'
        shift:
          p1:
            was: '1821 年 2 月 23 日深夜，济慈去世，塞文一直守在他身边。'
          p2:
            was: '1820 年 12 月 9 日，济慈照旧又被放了八盎司血，每天仍只有一条凤尾鱼和一片面包。'
            now: '最后那几个月他吃得上东西，少放了好几次血，比历史上少受了些苦。'
          p3:
            was: '1821 年 2 月济慈去世时，仍相信自己没有留下不朽的作品；照他的意思，墓碑上不刻名字。'
            now: '{staff}在最后那几天让他知道，他的颂诗以后会一直被人读、被人背，罗马这间屋子以后会为他留着。'
        vignettes:
          stairs: '{staff}数了从门口到房间的台阶，好知道托盘端上去时还热不热，把数字记在买菜单的边上。楼梯拐角那盏灯还没点。'
          window: '{staff}把窗推开一道缝，让广场上泉水的声音进来，窗帘跟着动了一下。屋里没人说什么，也没人去关。'
          fountain: '{staff}在台阶脚下那座船形泉边打水，罐口溢出的水溅湿了鞋面。一位编出来的卖花人问，这栋楼里是谁病了，把一束紫罗兰半价卖了。'
text:
  en:
    name: John Keats
    text: English poet, 1795 to 1821. He published his main poems, including the odes, in a few years, and died of tuberculosis in Rome at twenty five.
