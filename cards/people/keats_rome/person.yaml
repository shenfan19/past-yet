text:
  en:
    name: John Keats
    text: English poet, 1795 to 1821. He published his main poems, including the odes, in a few years, and died of tuberculosis in Rome at twenty five.
  zh:
    name: 约翰·济慈
    text: 英国诗人，1795 年生，1821 年去世。他在短短几年里写出包括颂诗在内的主要作品，二十五岁时在罗马死于肺结核。
