        - {id: p1, kind: endure, guard: true, day: 61, req: {"any":[{"job":["nurse","caregiver"],"stat":{"will":5}},{"trait":["vigil","patient"],"stat":{"will":7}},{"item":"sleep_regulator","stat":{"will":5}}]}}
        - {id: p2, kind: care, day: 22, req: {"any":[{"job":["doctor","physician","nurse","pharmacist","paramedic"]},{"item":"handbook"}]}}
        - {id: p3, kind: persuade, day: 96, req: {"any":[{"trait":["scholarly","sensitive","faithful"],"stat":{"will":6}},{"job":["translator","proofreader","bookseller","teacher","writer"],"stat":{"will":6}},{"item":"golden_apple","trait":["kind","sensitive","scholarly","artistic"]}]}}
      vignettes:
        - {id: stairs, traits: [methodical, vigil], day: 40}
        - {id: window, traits: [kind, quiet, artistic, charismatic], day: 70}
        - {id: fountain, day: 30}
    text:
      en:
        name: "A room by the steps"
        place: "Rome"
        figure: "John Keats"
        story: 'In November 1820 John Keats, ill with tuberculosis, came to Rome with the painter Joseph Severn and took rooms at 26 Piazza di Spagna beside the Spanish Steps. He died there on the night of 23 February 1821 and was buried on 26 February in the Protestant Cemetery. At his wish, his gravestone does not give his name.'
        relic: "A pressed violet"
        relic_desc: "A dried flower kept in a book."
        points:
          p1: 'Keep Severn on his feet through the stopped money and the sleepless nights, so that he stays by Keats to the end'
          p2: 'Stop Dr Clark''s starvation diet and bleeding, so that he can eat and keep his blood'
          p3: 'Before he dies, let him know that his poems will be read for generations'
        points_fail:
          p1: 'Severn collapsed in January, and in the last days nobody was at the bedside in his place.'
          p2: 'On 9 December he was bled another eight ounces as before, and each day he still had only one anchovy and a piece of bread.'
          p3: 'He still believed he had left nothing behind. In this branch nobody told him otherwise in those last days.'
        branch:
          p2:
            - 'In this branch, he could eat in those last months and was bled several times less, and he suffered somewhat less than in history.'
          p3:
            - 'In history, he believed to the end that he had left no lasting work, and at his wish his gravestone does not carry his name.'
            - 'In this branch, {staff} let him know in those last days that his odes would go on being read and learned by heart, and that this room in Rome would be kept for him.'
        vignettes:
          stairs: '{staff} counts the steps from the door to the room, so as to know how long the tray will stay warm, and writes the number in the margin of a shopping list.'
          window: '{staff} props the window a little so the sound of the fountain in the square comes in. Nobody in the room says anything about it, and nobody closes it.'
          fountain: '{staff} fills a jug at the boat shaped fountain at the foot of the steps. A flower seller, made up for the game, asks who in the house is ill, and gives a bunch of violets for half the price.'
      zh:
        name: "台阶旁的小屋"
        place: "罗马"
        figure: "约翰·济慈"
        story: '1820 年 11 月，患肺结核的约翰·济慈与画家约瑟夫·塞文来到罗马，住进西班牙台阶旁的西班牙广场 26 号。1821 年 2 月 23 日夜里他在那里去世，2 月 26 日葬在新教徒公墓。照他的意思，墓碑上没有他的名字。'
        relic: "一朵压干的紫罗兰"
        relic_desc: "夹在书里的一朵干花。"
        points:
          p1: '护住塞文，钱断了、人熬垮了也让他守在济慈身边到最后'
          p2: '拦下克拉克医生的饥饿疗法和放血，让他吃得上饭'
          p3: '去世之前让他知道，他的诗会被一代代人读下去'
        points_fail:
          p1: '塞文在一月里倒下了，最后那些日子床边没有他。'
          p2: '12 月 9 日他照旧又被放了八盎司血，每天仍只有一条凤尾鱼和一片面包。'
          p3: '他照旧相信自己什么也没留下，这条分支里没有人在最后那几天告诉过他。'
        branch:
          p2:
            - '这条分支里，最后那几个月他吃得上东西，少放了好几次血，比历史上少受了些苦。'
          p3:
            - '历史上，他到死都相信自己没有留下不朽的作品，照他的意思，墓碑上不刻名字。'
            - '这条分支里，{staff}在最后那几天让他知道，他的颂诗以后会一直被人读、被人背，罗马这间屋子以后会为他留着。'
        vignettes:
          stairs: '{staff}数了从门口到房间的台阶，好知道托盘端上去时还热不热，把数字记在买菜单的边上。'
          window: '{staff}把窗推开一道缝，让广场上泉水的声音进来。屋里没人说什么，也没人去关。'
          fountain: '{staff}在台阶脚下那座船形泉边打水。一位编出来的卖花人问，这栋楼里是谁病了，把一束紫罗兰半价卖了。'
text:
  en:
    name: John Keats
    text: English poet, 1795 to 1821. He published his main poems, including the odes, in a few years, and died of tuberculosis in Rome at twenty five.
  zh:
    name: 约翰·济慈
    text: 英国诗人，1795 年生，1821 年去世。他在短短几年里写出包括颂诗在内的主要作品，二十五岁时在罗马死于肺结核。
hook: {en: 'A name writ in water', zh: '声名水上书'}
facts:
  arrival:
    date: '1820-11-15'
    stay_day: 0
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [keats_locations_house, romeartlover_keats]
    text:
      en: 'Keats and Severn reached Rome in mid November 1820, most accounts say on 15 November, and took rooms on the second floor of 26 Piazza di Spagna, at the foot of the Spanish Steps.'
      zh: '济慈和塞文 1820 年 11 月中旬到达罗马，多数说法是 11 月 15 日，住进西班牙台阶脚下西班牙广场 26 号的二楼。'
    line:
      en: '15 November: Keats and Severn reach Rome and take rooms on the second floor of 26 Piazza di Spagna, by the Spanish Steps.'
      zh: '11 月 15 日，济慈和塞文到了罗马，住进西班牙台阶旁 26 号的二楼。'
  rome_letter:
    date: '1820-11-30'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [keats_rome_primary, keats_locations_house]
    text:
      en: 'Keats wrote to Charles Brown from Rome on 30 November 1820 and remarked on how difficult writing and saying farewell had become.'
      zh: '济慈在 1820 年 11 月 30 日从罗马写给查尔斯·布朗，信里说写信和告别都变得困难。'
    line:
      en: '30 November: Keats writes to Charles Brown that writing a letter, and saying goodbye, has become hard.'
      zh: '11 月 30 日，济慈给查尔斯·布朗写信，说如今写信和道别都很难。'
  death:
    date: '1821-02-23'
    stay_day: 100
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wordsworth_keats_death, keats_locations_house]
    text:
      en: 'Keats died late on the night of 23 February 1821, aged twenty five, with Severn beside him. His gravestone and the burial register give the date as 24 February.'
      zh: '济慈于 1821 年 2 月 23 日深夜去世，年二十五岁，塞文在他身边。墓碑和葬礼登记上写的日子是 2 月 24 日。'
    note: 'Death: written as a plain fact.'
    line:
      en: '23 February, late at night: Keats dies. Severn is with him.'
      zh: '2 月 23 日深夜，济慈去世，塞文在他身边。'
  register:
    date: '1821-02-24'
    stay_day: 100.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wordsworth_keats_death, romeartlover_keats]
    text:
      en: 'The burial register and the gravestone give the date of his death as 24 February.'
      zh: '葬礼登记和墓碑上把他的死期写作 2 月 24 日。'
    line:
      en: 'In the burial register the day is written as 24 February.'
      zh: '葬礼登记上，这个日子写成了 2 月 24 日。'
  burial:
    date: '1821-02-26'
    stay_day: 103
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'He was buried on 26 February 1821 in the Protestant Cemetery near the Pyramid of Cestius.'
      zh: '1821 年 2 月 26 日，他葬在塞斯提乌斯金字塔旁的新教徒公墓。'
    line:
      en: '26 February: Keats is buried in the Protestant Cemetery, by the pyramid.'
      zh: '2 月 26 日，济慈葬在金字塔旁的新教徒公墓。'
  epitaph:
    date: '1821'
    stay_day: 103.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'At his wish his gravestone does not name him and bears the line Here lies One Whose Name was writ in Water.'
      zh: '照他的意思，墓碑上不刻他的名字，刻的是“此地长眠者，声名水上书”。'
    line:
      en: 'At his wish, the stone will not carry his name, only: Here lies One Whose Name was writ in Water.'
      zh: '照他的意思，墓碑上不刻名字，只刻：此地长眠者，声名水上书。'
  severn:
    date: '1879'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'Joseph Severn died in 1879 and lies beside Keats in the Protestant Cemetery.'
      zh: '约瑟夫·塞文 1879 年去世，葬在新教徒公墓济慈的旁边。'
    line:
      en: '1879: Severn dies. He is buried beside Keats.'
      zh: '1879 年，塞文去世，葬在济慈旁边。'
