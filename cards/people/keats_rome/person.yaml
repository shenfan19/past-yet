quotes:
  keats_endymion_echo:
    order: 1
    tier: full
    date: '1818'
    checked: official_record
    sources: [keats_endymion_toronto]
    original: en
    text:
      en:
        who: 'John Keats'
        quote: 'A thing of beauty is a joy for ever:'
        occasion: 'Opening line of Endymion, book I, published in 1818'
      zh:
        who: '约翰·济慈'
        quote: '美的事物，给人长久的欢喜。'
        occasion: '1818 年出版的《恩底弥翁》第一卷开篇 · 游戏译文'
      zh-Hant:
        who: '約翰·濟慈'
        quote: '美的事物，給人長久的歡喜。'
        occasion: '1818 年出版的《恩底彌翁》第一卷開篇 · 遊戲譯文'
      fr:
        who: 'John Keats'
        quote: "Une chose belle est une joie éternelle\_:"
        occasion: 'Première ligne d''Endymion, livre I, publié en 1818'
      es:
        who: 'John Keats'
        quote: 'Una cosa bella es una alegría para siempre:'
        occasion: 'Línea inicial de Endymion, libro I, publicado en 1818'
      ja:
        who: 'ジョン・キーツ'
        quote: '美しいものは永遠の喜びです。'
        occasion: '1818 年に出版されたエンディミオン、第 1 巻の冒頭の行'
      ko:
        who: '존 키츠'
        quote: '아름다운 것은 영원한 기쁨입니다.'
        occasion: '1818년에 출판된 엔디미온 제1권의 첫 줄'
      ru:
        who: 'Джон Китс'
        quote: 'Красота – радость вечная:'
        occasion: 'Первая строка книги I «Эндимиона», опубликованной в 1818 году.'
  keats_awkward_bow_echo:
    order: 2
    tier: none
    date: '1820-11-30'
    checked: official_record
    sources: [keats_brown_uvic]
    original: en
    text:
      en:
        who: 'John Keats'
        quote: 'I can scarcely bid you good bye even in a letter. I always made an awkward bow.'
        occasion: 'Last known letter to Charles Brown, written in Rome'
      zh:
        who: '约翰·济慈'
        quote: '就连在信里，我也几乎说不出再见。我告别时鞠躬总是笨拙。'
        occasion: '在罗马写给查尔斯·布朗的最后一封存世书信 · 游戏译文'
      zh-Hant:
        who: '約翰·濟慈'
        quote: '就連在信裡，我也幾乎說不出再見。我告別時鞠躬總是笨拙。'
        occasion: '在羅馬寫給查爾斯·布朗的最後一封存世書信 · 遊戲譯文'
      fr:
        who: 'John Keats'
        quote: 'Je peux à peine vous dire au revoir, même dans une lettre. J''ai toujours fait une révérence maladroite.'
        occasion: 'Dernière lettre connue à Charles Brown, écrite à Rome'
      es:
        who: 'John Keats'
        quote: 'Apenas puedo despedirme de usted ni siquiera en una carta. Siempre hice una reverencia incómoda.'
        occasion: 'Última carta conocida a Charles Brown, escrita en Roma'
      ja:
        who: 'ジョン・キーツ'
        quote: '手紙でもなかなか別れを告げることができません。私はいつもぎこちないお辞儀をしていました。'
        occasion: 'ローマで書かれたチャールズ・ブラウンへの最後の手紙'
      ko:
        who: '존 키츠'
        quote: '편지로라도 작별 인사를 할 수 없을 것 같아요. 나는 늘 어색한 인사를 했다.'
        occasion: '로마에서 찰스 브라운에게 보낸 마지막 편지'
      ru:
        who: 'Джон Китс'
        quote: 'Я едва могу попрощаться с тобой даже в письме. Я всегда неуклюже кланялся.'
        occasion: 'Последнее известное письмо Чарльзу Брауну, написанное в Риме.'
