    text:
      en: 'Keats wrote to Charles Brown from Rome on 30 November 1820 and remarked on how difficult writing and saying farewell had become.'
      zh: '济慈在 1820 年 11 月 30 日从罗马写给查尔斯·布朗，信里说写信和告别都变得困难。'
    line:
      en: '30 November: Keats writes to Charles Brown that writing a letter, and saying goodbye, has become hard.'
      zh: '11 月 30 日，济慈给查尔斯·布朗写信，说如今写信和道别都很难。'
      zh-Hant: '11 月 30 日，濟慈給查爾斯·布朗寫信，說如今寫信和道別都很難。'
      fr: '30 novembre : Keats écrit à Charles Brown qu''écrire une lettre et lui dire au revoir est devenu difficile.'
      es: '30 de noviembre: Keats le escribe a Charles Brown que escribir una carta y despedirse se ha vuelto difícil.'
      ja: '11月30日: キーツはチャールズ・ブラウンに、手紙を書くことも、別れを告げることも難しくなったと書いている。'
      ko: '11월 30일: 키츠는 찰스 브라운에게 편지를 쓰고 작별 인사를 하는 것이 어려워졌다고 썼습니다.'
      ru: '30 ноября: Китс пишет Чарльзу Брауну, что писать письмо и прощаться стало тяжело.'
  death:
    date: '1821-02-23'
    stay_day: 100
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wordsworth_keats_death, keats_locations_house]
    text:
      en: 'Keats died late on the night of 23 February 1821, aged twenty five, with Severn beside him. His gravestone and the burial register give the date as 24 February.'
      zh: '济慈于 1821 年 2 月 23 日深夜去世，年二十五岁，塞文在他身边。墓碑和葬礼登记上写的日子是 2 月 24 日。'
    note: 'Death: written as a plain fact.'
    line:
      en: '23 February, late at night: Keats dies. Severn is with him.'
      zh: '2 月 23 日深夜，济慈去世，塞文在他身边。'
      zh-Hant: '2 月 23 日深夜，濟慈去世，塞文在他身邊。'
      fr: '23 février, tard dans la nuit : Keats décède. Severn est avec lui.'
      es: '23 de febrero, a altas horas de la noche: Keats muere. Severn está con él.'
      ja: '2月23日深夜：キーツ死去。セバーンは彼と一緒だ。'
      ko: '2월 23일 늦은 밤: 키츠가 사망함. 세번이 그와 함께 있어요.'
      ru: '23 февраля, поздно вечером: Китс умирает. Северн с ним.'
  register:
    date: '1821-02-24'
    stay_day: 100.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wordsworth_keats_death, romeartlover_keats]
    text:
      en: 'The burial register and the gravestone give the date of his death as 24 February.'
      zh: '葬礼登记和墓碑上把他的死期写作 2 月 24 日。'
    line:
      en: 'In the burial register the day is written as 24 February.'
      zh: '葬礼登记上，这个日子写成了 2 月 24 日。'
      zh-Hant: '葬禮登記上，這個日子寫成了 2 月 24 日。'
      fr: 'Dans le registre funéraire, le jour est inscrit le 24 février.'
      es: 'En el registro de entierros el día figura como 24 de febrero.'
      ja: '埋葬台帳にはその日が2月24日と記されている。'
      ko: '장지 기록에는 그 날이 2월 24일로 기록되어 있다.'
      ru: 'В книге захоронений день записан как 24 февраля.'
  burial:
    date: '1821-02-26'
    stay_day: 103
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'He was buried on 26 February 1821 in the cemetery near the Pyramid of Cestius.'
      zh: '1821 年 2 月 26 日，他葬在塞斯提乌斯金字塔旁的墓园。'
    line:
      en: '26 February: Keats is buried in the cemetery by the pyramid.'
      zh: '2 月 26 日，济慈葬在金字塔旁的墓园。'
      zh-Hant: '2 月 26 日，濟慈葬在金字塔旁的墓園。'
      fr: '26 février : Keats est enterré au cimetière près de la pyramide.'
      es: '26 de febrero: Keats es enterrado en el cementerio junto a la pirámide.'
      ja: '2月26日: キーツはピラミッドのそばの墓地に埋葬される。'
      ko: '2월 26일: 키츠가 피라미드 옆 묘지에 묻혔다.'
      ru: '26 февраля: Китс похоронен на кладбище у пирамиды.'
  epitaph:
    date: '1821'
    stay_day: 103.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'At his wish his gravestone does not name him and bears the line Here lies One Whose Name was writ in Water.'
      zh: '照他的意思，墓碑上不刻他的名字，刻的是“此地长眠者，声名水上书”。'
    line:
      en: 'At his wish, the stone will not carry his name, only: Here lies One Whose Name was writ in Water.'
      zh: '照他的意思，墓碑上不刻名字，只刻：此地长眠者，声名水上书。'
      zh-Hant: '照他的意思，墓碑上不刻名字，只刻：此地長眠者，聲名水上書。'
      fr: 'À son souhait, la pierre ne portera pas son nom, seulement : Ici repose Celui dont le nom a été écrit dans l''eau.'
      es: 'Por su deseo, la piedra no llevará su nombre, sólo: Aquí yace Aquel cuyo nombre fue escrito en agua.'
      ja: '本人の望みどおり、墓石には名を刻まず、「その名を水に書かれた者、ここに眠る」とだけ記される。'
      ko: '그의 뜻에 따라 돌에는 그의 이름이 새겨지지 않을 것입니다. 다만, 물에 이름이 기록된 분이 여기 누워 계십니다.'
      ru: 'По его желанию, на камне будет не его имя, а только: Здесь покоится Тот, Чье Имя было написано на Воде.'
  severn:
    date: '1879'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [romeartlover_keats, keats_locations_house]
    text:
      en: 'Joseph Severn died in 1879 and lies beside Keats in the same cemetery.'
      zh: '约瑟夫·塞文 1879 年去世，葬在同一片墓园里济慈的旁边。'
    line:
      en: '1879: Severn dies. He is buried beside Keats.'
      zh: '1879 年，塞文去世，葬在济慈旁边。'
      zh-Hant: '1879 年，塞文去世，葬在濟慈旁邊。'
      fr: "1879\_:\_Décès de Severn. Il est enterré à côté de Keats."
      es: '1879: Muere Severn. Está enterrado junto a Keats.'
      ja: '1879年: セヴァーンが死去。彼はキーツの隣に埋葬されている。'
      ko: '1879년: 세번이 사망합니다. 그는 키츠 옆에 묻혀있습니다.'
      ru: '1879: Северн умирает. Он похоронен рядом с Китсом.'
