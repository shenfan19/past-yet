text:
  en:
    name: Nikolai Menshutkin
    text: Russian chemist, 1842 to 1907, professor at the University of St Petersburg and an editor of the journal of the Russian Chemical Society. On 18 March 1869 he read Mendeleev's paper on the system of the elements to the society in the author's absence. The reaction that turns an amine into a quaternary ammonium salt carries his name.
  zh:
    name: 尼古拉·缅舒特金
    text: 俄国化学家，1842 年生，1907 年去世，圣彼得堡大学教授，俄国化学学会会刊的编辑。1869 年 3 月 18 日，门捷列夫不在场，由他在学会宣读了门捷列夫关于元素体系的论文。把胺变成季铵盐的那个反应以他的名字命名。
