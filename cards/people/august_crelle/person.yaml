text:
  en:
    name: August Leopold Crelle
    text: German civil engineer and mathematician, 1780 to 1855. In 1826 he founded in Berlin the Journal für die reine und angewandte Mathematik, whose first volumes printed many papers of Niels Henrik Abel. He worked for a post for Abel in Berlin, and on 8 April 1829, not knowing that Abel had died two days before, wrote that it was secured.
  zh:
    name: 奥古斯特·利奥波德·克雷勒
    text: 德国土木工程师与数学家，1780 年生，1855 年去世。1826 年他在柏林创办《纯粹与应用数学杂志》，头几卷刊出了尼尔斯·亨里克·阿贝尔的许多论文。他为阿贝尔在柏林谋职，1829 年 4 月 8 日写信说职位已经落实，那时还不知道阿贝尔两天前已经去世。
