    text:
      en:
        name: The Great Wave
        place: Edo, Japan
        figure: Katsushika Hokusai
        story: 'Hokusai''s Under the Wave off Kanagawa is a woodblock print in Thirty-six Views of Mount Fuji. The Met dates its impression to about 1830–1832.'
        story_prose:
          opening:
            - 'An Edo publisher lays three fresh impressions on the counter. On the darkest, a small part of the crest has filled in. On the palest, distant Fuji is hard to see. The carver reaches for one sheet and the printer for another.'
            - 'Under the Wave off Kanagawa is one of Hokusai’s Thirty-six Views of Mount Fuji. Surviving impressions preserve changes such as wear to the blocks. You can put a shared reference by the press and ask the publisher to keep a sequence that can be checked later.'
            - 'Have someone who knows prints compare the sheets. Someone who can arrange custody can ask Hokusai, the printer and the publisher how to keep later samples.'
          points:
            p1: 'The carver carries one proof to the window, where he can just see Fuji through the blue. You ask the printer to look at the crest in the same light and compare it with a different sheet. They both put a finger by the same clear line. The chosen proof gets a small mark in its corner. The space above the distant mountain stays clear.'
            p2: 'A clerk slips the samples into the sale stack. The publisher asks if they can find them again next time. You have Hokusai and the printer write an order on the wrapper and leave it open at one end for later proofs. The next sheet off the block goes to the back of the set before it goes anywhere near the counter.'
          outcomes:
            all: 'The first impressions go on sale and the workshop still has a set to compare. When a different printer takes over, the order can still be read by turning the pages.'
            p1: 'The carver and printer finish the first run from one proof. Later samples disperse among the sale copies.'
            p2: 'The samples have an order. The first run is still held back because the line breaks. The traveller brings home the scene where the proofs were ordered.'
          none: 'The publisher stands the cleanest-looking sheet by the till. The people who come to check the crest are still looking at different copies.'
          not_admitted: 'The publisher asks which printer brought you. Nobody knows the visitor, and the proofs go back behind the counter.'
          desync: 'The wave keeps breaking at the same place and the first batch does not leave the shop. The office recalls the traveller.'
          excerpts:
            p1: 'The chosen proof gets a small mark in its corner. The space above the distant mountain stays clear.'
            p2: 'The next sheet off the block goes to the back of the set before it goes anywhere near the counter.'
        relic: A woodblock for printing
        relic_desc: A carved plank of cherry wood.
        points:
          p1: 'Choose an Edo publisher’s proof in which both the wave crest and the distant peak read clearly. Leave it with the carver and printer as the reference for the first run.'
          p2: 'Before the publisher breaks up the proofs, have Hokusai and the printer keep a comparison set. Ask the publisher to file a new proof in sequence each time printing resumes.'
        points_fail:
          p1: 'The carver and printer have no shared proof and keep sending back sheets with the same broken wave line. The publisher holds back the first delivery, and the office recalls the employee.'
          p2: 'Only sale copies stay at the counter. The proofs Hokusai checked with the printer go back into the stock, where a new printer cannot recover the set.'
        shift:
          p1:
            was: 'The Edo publisher Eijudō advertised Thirty-six Views of Mount Fuji for the New Year of 1831. Under the Wave off Kanagawa belongs to the series, and early impressions with the wave lines intact survive.'
          p2:
            was: 'These impressions carry no dates or batch numbers. The original blocks have not survived, and the marks on the prints are the main clues to their sequence.'
            now: 'Eijudō keeps a packet of proofs in order behind the counter. A new printer can tell which gap appeared later and ask Hokusai to judge whether the run meets his design.'
            who: hokusai_edo
            bio: 'Hokusai designed the image. Its appearance on paper also depended on where the carver cut, how the printer transferred the ink, and when the publisher ordered another run.'
        vignettes:
          mountain: 'The seller points to the foam. You ask him to cover the wave with his hand. Once he uncovers it, the little triangle in the distance looks less like another splash.'
          edge: 'The seller wants to trim a practice sheet. You set the untrimmed copy beside it and show him how close the signature sits to the edge.'
          counter: 'You turn the print towards a customer who keeps looking for Fuji above everything else. The customer finally finds it low on the page and asks to see another view.'
      zh:
        name: 神奈川冲浪里
        place: 日本江户
        figure: 葛饰北斋
        story: '葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。'
        story_prose:
          opening:
            - '江户的版元把三张刚摺出的样纸排在柜上。最浓的那张，浪尖有一小段连成一片；最淡的那张，远处的富士几乎看不见。刻工来取一张，摺师伸手想拿另一张。'
            - '《神奈川冲浪里》是北斋《富岳三十六景》的一幅。存世印张可用来比较版木磨损等变化。这一趟能为首批出样留一张共同的参照，还能另存一套按印次可查的样张。'
            - '会辨印纹或画面的员工先做选样。善于商量保管的人再与北斋、摺师和版元约定添样办法。'
          points:
            p1: '刻工把一张样移到窗旁，才在蓝色里认出富士。你请摺师站在相同的地方看浪尖，再对比另一张深浅刚好的。两人同时点在同一段轮廓上。留给工房的那张只在角上做了一个小记号，远山前面整片都很亮。'
            p2: '伙计把对照样往待售的印堆里一插，版元问还能不能在下次开印时找回。你请北斋和摺师一起在套纸上标好序，另留一道能添后来样张的开口。下一张出样送来，版元没有直接往柜上摆，先把它夹到了对照套的末尾。'
          outcomes:
            all: '首批印张出柜，工房仍留有可对读的样张。以后交给另一个摺师时，也能看出它们哪个先印。'
            p1: '刻工和摺师照同一张样印完首批。后来那些样张又各自散到货堆里。'
            p2: '样张已定了归档次序。首批仍因断线留在店里，回程只保留整理样张的这一段。'
          none: '版元把看着最顺眼的一张单摆在柜边。再来核浪尖的人各持一张，仍对不上。'
          not_admitted: '版元问你跟哪位摺师来的。没人认领来客，样纸刚摞好就收回了。'
          desync: '首批样张在浪尖同一处仍断线，没能离开印坊。事务所按同步失败召回员工。'
          excerpts:
            p1: '留给工房的那张只在角上做了一个小记号，远山前面整片都很亮。'
            p2: '下一张出样送来，版元没有直接往柜上摆，先把它夹到了对照套的末尾。'
        relic: 一块印刷用的木版
        relic_desc: 一块雕好的樱木版。
        points:
          p1: '从江户版元送来的样张里挑出浪尖与远山都清楚的一张，给刻工和摺师留作首批出样的准绳。'
          p2: '在版元打散样张前，请北斋与摺师共同留存一套对照印。让版元约定重开印时把新样也夹进去，并写下顺序。'
        points_fail:
          p1: '刻工与摺师手里没有同一张好样，反复送来的样张在浪峰同一处断线。版元扣住第一批货，事务所因同步失败召回员工。'
          p2: '版元在柜上只留下好卖的印成品。北斋与摺师核过的样张又回到货堆，换了谁接手也找不回那一套。'
        shift:
          p1:
            was: '江户版元永寿堂赶在1831年新年时为《富岳三十六景》登广告，《神奈川冲浪里》是该系列的版画之一，早期印张上浪线仍完整的例子保存至今。'
          p2:
            was: '当时这组印张没有日期和批次编号。原版木没有留存，后世主要靠印张上的痕迹判断先后。'
            now: '永寿堂柜后留下一封有次序的样张。换了摺师，开印时仍能查出哪处断线是后来才有的，再让北斋核定是否接受这批效果。'
            who: hokusai_edo
            bio: '北斋负责画稿。一张版画的面貌还取决于刻工如何落刀、摺师如何转印和版元何时续印；这些人共同影响后来的印张。'
        vignettes:
          mountain: '版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。'
          edge: '版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。'
          counter: '一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。'
text:
  en:
    name: Katsushika Hokusai
    text: Japanese artist, 1760 to 1849, of Edo. His series Thirty Six Views of Mount Fuji, published from 1831, includes The Great Wave off Kanagawa. He changed his name many times and kept working into old age.
  zh:
    name: 葛饰北斋
    text: 日本画家，1760 年生，1849 年去世，江户人。1831 年起出版的《富岳三十六景》包括《神奈川冲浪里》。他多次改名，到老仍在作画。
