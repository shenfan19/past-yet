    text:
      en:
        name: The Great Wave
        place: Edo, Japan
        figure: Katsushika Hokusai
        story: 'Hokusai''s Under the Wave off Kanagawa is a woodblock print in Thirty-six Views of Mount Fuji. The Met dates its impression to about 1830–1832.'
        relic: A woodblock for printing
        relic_desc: A carved plank of cherry wood.
        points:
          p1: 'Choose an Edo publisher’s proof in which both the wave crest and the distant peak read clearly. Leave it with the carver and printer as the reference for the first run.'
          p2: 'Before the publisher breaks up the proofs, have Hokusai and the printer keep a comparison set. Ask the publisher to file a new proof in sequence each time printing resumes.'
        points_fail:
          p1: 'The carver and printer have no shared proof and keep sending back sheets with the same broken wave line. The publisher holds back the first delivery, and the office recalls the employee.'
          p2: 'Only sale copies stay at the counter. The proofs Hokusai checked with the printer go back into the stock, where a new printer cannot recover the set.'
        shift:
          p1:
            was: 'The Edo publisher Eijudō advertised Thirty-six Views of Mount Fuji for the New Year of 1831. Under the Wave off Kanagawa belongs to the series, and early impressions with the wave lines intact survive.'
          p2:
            was: 'These impressions carry no dates or batch numbers. The original blocks have not survived, and the marks on the prints are the main clues to their sequence.'
            now: 'Eijudō keeps a packet of proofs in order behind the counter. A new printer can tell which gap appeared later and ask Hokusai to judge whether the run meets his design.'
            who: hokusai_edo
            bio: 'Hokusai designed the image. Its appearance on paper also depended on where the carver cut, how the printer transferred the ink, and when the publisher ordered another run.'
        vignettes:
          mountain: 'The seller points to the foam. You ask him to cover the wave with his hand. Once he uncovers it, the little triangle in the distance looks less like another splash.'
          edge: 'The seller wants to trim a practice sheet. You set the untrimmed copy beside it and show him how close the signature sits to the edge.'
          counter: 'You turn the print towards a customer who keeps looking for Fuji above everything else. The customer finally finds it low on the page and asks to see another view.'
      zh:
        name: 神奈川冲浪里
        place: 日本江户
        figure: 葛饰北斋
        story: '葛饰北斋的《神奈川冲浪里》是《富岳三十六景》中的木版画。大都会艺术博物馆将所藏这一印本约定年为 1830 至 1832 年。'
        relic: 一块印刷用的木版
        relic_desc: 一块雕好的樱木版。
        points:
          p1: '从江户版元送来的样张里挑出浪尖与远山都清楚的一张，给刻工和摺师留作首批出样的准绳。'
          p2: '在版元打散样张前，请北斋与摺师共同留存一套对照印。让版元约定重开印时把新样也夹进去，并写下顺序。'
        points_fail:
          p1: '刻工与摺师手里没有同一张好样，反复送来的样张在浪峰同一处断线。版元扣住第一批货，事务所因同步失败召回员工。'
          p2: '版元在柜上只留下好卖的印成品。北斋与摺师核过的样张又回到货堆，换了谁接手也找不回那一套。'
        shift:
          p1:
            was: '江户版元永寿堂赶在1831年新年时为《富岳三十六景》登广告，《神奈川冲浪里》是该系列的版画之一，早期印张上浪线仍完整的例子保存至今。'
          p2:
            was: '当时这组印张没有日期和批次编号。原版木没有留存，后世主要靠印张上的痕迹判断先后。'
            now: '永寿堂柜后留下一封有次序的样张。换了摺师，开印时仍能查出哪处断线是后来才有的，再让北斋核定是否接受这批效果。'
            who: hokusai_edo
            bio: '北斋负责画稿。一张版画的面貌还取决于刻工如何落刀、摺师如何转印和版元何时续印；这些人共同影响后来的印张。'
        vignettes:
          mountain: '版画商指着浪花，你请他用手遮住浪头。手再移开，远处那个小三角就不像另一朵水花了。'
          edge: '版画商打算裁一张试印纸。你拿未裁的那张并排放好，给他看落款离纸边多近。'
          counter: '一位客人总往纸的上方找富士山。你把印本转向他，他终于在下面认出来，问还能不能看看另一景。'
text:
  en:
    name: Katsushika Hokusai
    text: Japanese artist, 1760 to 1849, of Edo. His series Thirty Six Views of Mount Fuji, published from 1831, includes The Great Wave off Kanagawa. He changed his name many times and kept working into old age.
  zh:
    name: 葛饰北斋
    text: 日本画家，1760 年生，1849 年去世，江户人。1831 年起出版的《富岳三十六景》包括《神奈川冲浪里》。他多次改名，到老仍在作画。
