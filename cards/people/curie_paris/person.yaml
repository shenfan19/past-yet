    text:
      en:
        name: Two new elements
        place: Paris
        figure: Marie Curie
        story: 'In April 1898 Marie Curie reported that pitchblende gave off stronger rays than its uranium could explain. Working with Pierre Curie at the School of Industrial Physics and Chemistry in Paris, she separated its parts and followed the rays. On 18 July 1898 they announced a new element and named it polonium, after her native Poland; on 26 December, with Gustave Bémont, they announced radium. Marie Curie died in 1934 of aplastic anaemia, generally linked to her long exposure to radiation.'
        story_prose:
          opening:
            - 'Paris, summer 1898. At the School of Industrial Physics and Chemistry, Marie Curie and Pierre Curie are separating pitchblende part by part and following the rays. In April she reported that the ore gave off stronger rays than its uranium could explain.'
            - 'In history, on 18 July they announced a new element and named it polonium, after her native Poland; on 26 December, with Gustave Bémont, they announced radium, and a new spectral line seen by Eugène Demarçay was printed with the note. The shed they worked in was poorly ventilated and let in the rain, and for years they handled their samples bare handed; in 1934 Marie died of aplastic anaemia, generally linked to her long exposure to radiation. In this branch, a woman keeps a small eating house in the Latin Quarter, and a man keeps a bookstall on the Seine.'
            - 'A few kinds of people can help on this trip: someone who brings shielding and knows medicine or laboratory work; someone who knows records and can line several of them up; someone persuasive who can win a room.'
          outcomes:
            all: 'That winter the instruments moved into a room the school had cleared, the shield stood in front of the bench, and the gloves hung on a nail at its edge. On 26 December the report on radium reached the Academy, and the new spectral line was printed with it.'
            p3: 'From that year on the shield stood in front of their bench, the gloves hanging on a nail at its edge. Marie worked some years longer afterwards.'
            p2: 'That winter the instruments moved into the room the school had cleared, and were not moved again. The notebooks stood in a row on the windowsill, in order of date.'
            p1: 'On 26 December the report on radium reached the Academy, and the new spectral line was printed with it. In the shed the notebooks of that year’s measurements lay stacked at the corner of the bench, the top one still open.'
          none: 'That winter the rain still came through the roof of the shed. The two of them still lifted the glass dishes bare handed, and in the dark what lay in them gave off a faint glow.'
          desync: 'On the night of 25 December the spectral observation and their records still would not match, and the year-end report was not sent in. When {staff} was recalled, three notebooks lay open on the bench in the shed, each at a different date.'
          not_admitted: '{staff} never got into the shed in the school yard, and ate a few meals at the small place in the Latin Quarter. At the next table the Polish students were still arguing, and the beetroot soup had gone cold again.'
          points:
            p1:
              class_lettered: 'On 25 December the year-end report was to go to the Academy the next day. The new spectral line Demarçay had seen had to be matched, entry by entry, with the measurements in their notebooks. {staff}, as a keeper of records does, lined up the dates of the spectral observations, the numbers of the samples and the measurements in the notebooks row by row, copied them into a table, and put it at the front of the manuscript. Pierre went through the manuscript from beginning to end, signed it and passed it to Marie. She signed under his name, and laid the spectral record on top of the manuscript.'
              else: 'On 25 December the year-end report was to go to the Academy the next day. The new spectral line Demarçay had seen had to be matched, entry by entry, with the measurements in their notebooks. {staff} sat up all night over the notebooks, found one by one the numbers of the samples that went with the spectral observations, and copied them into the margin of the manuscript. Pierre went through the manuscript from beginning to end, signed it and passed it to Marie. She signed under his name, and laid the spectral record on top of the manuscript.'
            p2:
              class_lettered: 'On 24 December the rain came through the roof of the shed again, and the basins catching it had reached the door. {staff}, as a keeper of records does, bound into one volume the July note on polonium, the manuscript to go in at the year’s end, and a day book of when the roof leaked, when work stopped and how often the instruments had been moved, and took it to the man in charge of the school’s rooms. He turned to the pages where work had stopped and was still a long while, then took a key from his drawer and laid it on the day book. A small wooden tag hung from the key, with a room number on it.'
              else: 'On 24 December the rain came through the roof of the shed again, and the basins catching it had reached the door. {staff} took the two reports and the day book of stoppages and waited a whole morning outside the school office, until the man in charge of the rooms came out, then turned the pages for him one by one. He turned to the pages where work had stopped and was still a long while, then took a key from his drawer and laid it on the day book. A small wooden tag hung from the key, with a room number on it.'
            p3:
              class_medical: 'At the end of August the shed was stifling, and a row of glass dishes stood on the bench, holding solutions purified again and again. Marie and Pierre still lifted the dishes and poured from them bare handed. {staff}, as nursing teaches, set up a shield in front of the bench, moved the samples behind it one by one, and handed each of them a pair of gloves, saying this thing wounds without drawing blood. Marie looked at the shield, put on the gloves, and reached behind it for the glass dish. As the room darkened toward evening, what lay in the dish gave off a faint glow; it fell on the shield, and not on her hands.'
              class_learned: 'At the end of August the shed was stifling, and a row of glass dishes stood on the bench, holding solutions purified again and again. Marie and Pierre still lifted the dishes and poured from them bare handed. {staff}, as a laboratory requires, set up a shield in front of the bench, moved the samples behind it, measured how far from the body was safe, drew a chalk line across the bench, and laid two pairs of gloves beside it. Marie looked at the shield, put on the gloves, and reached behind it for the glass dish. As the room darkened toward evening, what lay in the dish gave off a faint glow; it fell on the shield, and not on her hands.'
              else: 'At the end of August the shed was stifling, and a row of glass dishes stood on the bench, holding solutions purified again and again. Marie and Pierre still lifted the dishes and poured from them bare handed. {staff} set up the shield brought along in front of the bench, moved the samples behind it one by one, and left a pair of gloves on the stool where Marie usually sat. Marie looked at the shield, put on the gloves, and reached behind it for the glass dish. As the room darkened toward evening, what lay in the dish gave off a faint glow; it fell on the shield, and not on her hands.'
          excerpts:
            p3: 'Marie looked at the shield, put on the gloves, and reached behind it for the glass dish. As the room darkened toward evening, what lay in the dish gave off a faint glow; it fell on the shield, and not on her hands.'
            p2: 'He turned to the pages where work had stopped and was still a long while, then took a key from his drawer and laid it on the day book. A small wooden tag hung from the key, with a room number on it.'
            p1: 'Pierre went through the manuscript from beginning to end, signed it and passed it to Marie. She signed under his name, and laid the spectral record on top of the manuscript.'
        relic: A tube of pitchblende
        relic_desc: A glass tube of dark ore that left a faint glow in the dark.
        points:
          p1: 'Before the year-end reading, match the records still awaiting an independent check and protect the second report'
          p2: 'Use the two reports to secure a regular workroom for Curie and protect the instruments and records for later measurements'
          p3: 'From now on, put shielding between Marie and Pierre and their samples, and protect their hands and bodies from the rays'
        points_fail:
          p1: 'The independent observation cannot be matched to the team''s records before submission. The year-end report is lost, and the office recalls the employee.'
          p2: 'The team still shares makeshift benches. When the weather turns they have to move instruments and wait for space.'
          p3: 'They still handle the samples bare handed, and year after year the radiation falls on them both.'
        shift:
          p1:
            was: 'On 26 December 1898 the Paris Academy received a report on a new radioactive substance and published an independent spectroscopic observation alongside it.'
          p2:
            was: 'In 1898, after the two reports, the Curies continued their research in makeshift space at the school.'
            now: '{staff} presents both reports alongside a record of interruptions to someone who can arrange space. The school sets aside a room for long-term measurements.'
          p3:
            was: 'On 4 July 1934 Marie Curie died of aplastic anaemia, generally attributed to her long exposure to radiation.'
            now: 'From 1898 on, both of them worked with their samples behind shielding and took far less radiation over the years. Marie stayed in better health than in history and worked for some years longer.'
            who: curie_paris
            bio: 'Marie Curie worked with radioactive material behind shielding from 1898 on. She was spared the heavy radiation damage of her later years and worked some years longer.'
        vignettes:
          shed: 'Rain comes through the roof of the shed in the school yard. {staff} sets out basins under the leaks and moves a bench of glassware away from the drips, and the stove in the corner hardly warms the room.'
          borscht: '{staff} eats at a small place in the Latin Quarter. At the next table two Polish students argue in Polish until their beetroot soup goes cold, and the owner says there are more Poles round here than pigeons on the Seine.'
          bookstall: 'At a bookstall on the Seine {staff} turns up a pamphlet about the new rays that pass through flesh. The stallholder says people these days will pay for anything they cannot see.'
      zh:
        name: 两种新元素
        place: 巴黎
        figure: 玛丽·居里
        story: '1898 年 4 月，玛丽·居里报告说，沥青铀矿放出的射线比其中的铀能解释的更强。她与皮埃尔·居里在巴黎的工业物理化学学校把矿石一份份分开，追着射线走。1898 年 7 月 18 日，他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭。玛丽·居里 1934 年死于再生障碍性贫血，一般认为与她长年受辐射有关。'
        story_prose:
          opening:
            - '1898 年夏，巴黎。玛丽·居里和皮埃尔·居里在工业物理化学学校，把沥青铀矿一份一份分开，追着射线走。这年 4 月，她报告说这种矿石放出的射线，比其中的铀能解释的还要强。'
            - '史实里，7 月 18 日他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭，欧仁·德马尔赛看到的一条新光谱线随文刊出。他们工作的那间棚屋通风差，屋顶漏雨，样品多年都是空手处理；1934 年，玛丽死于再生障碍性贫血，一般认为与她长年受辐射有关。在这条分支里，拉丁区有家小馆子的老板娘，塞纳河边有个旧书摊的摊主。'
            - '这一趟用得上几种人：带着防护、懂医药或做过实验的人；懂档案、对得齐几份记录的人；说得动人、争得来一间屋子的人。'
          outcomes:
            all: '那年冬天，仪器搬进了学校腾出的一间屋子，桌前立着那道防护屏，手套挂在屏边的钉子上。12 月 26 日，镭的报告交到了科学院，那条新光谱线随文刊出。'
            p3: '从那年起，那道防护屏一直立在他们的桌前，手套挂在屏边的钉子上。玛丽后来又多工作了些年。'
            p2: '那年冬天，仪器搬进了学校腾出的那间屋子，再没有挪过。记录本一本本排在窗台上，按日子摆得整整齐齐。'
            p1: '12 月 26 日，镭的报告交到了科学院，那条新光谱线随文刊出。棚屋里，记着那一年测量的几本本子摞在桌角，最上面一本还摊开着。'
          none: '那年冬天，雨还从棚屋顶上漏下来。两人照旧空着手端起玻璃皿，皿里的东西在暗处发着一点淡光。'
          desync: '12 月 25 日夜里，光谱观察和他们的记录还是对不上，年末那份报告没能交出去。{staff}被召回时，棚屋的桌上摊着三本记录，翻在三个不同的日子。'
          not_admitted: '{staff}没能进学校院里那间棚屋，只在拉丁区的小馆子里吃了几顿饭。邻桌的波兰学生还在争，红菜汤又凉了。'
          points:
            p1:
              class_lettered: '12 月 25 日，年末那份报告明天就要交到科学院。德马尔赛看到的那条新光谱线，要和他们本子上的测量一一对上。{staff}照档案的规矩，把光谱观察的日子、样品的编号和本子上的测量一行一行对齐，抄成一张对照表，夹在稿子最前面。皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。'
              else: '12 月 25 日，年末那份报告明天就要交到科学院。德马尔赛看到的那条新光谱线，要和他们本子上的测量一一对上。{staff}守着那几本记录熬了一夜，把光谱观察对应的样品编号一个一个找出来，抄在稿子的页边。皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。'
            p2:
              class_lettered: '12 月 24 日，雨又从棚屋顶上漏下来，接水的盆已经摆到了门口。{staff}照档案的办法，把七月那份钋的通报、年末要交的稿子，和一本记着哪天漏雨、哪天停工、仪器挪过几回的流水账订成一册，送到管学校房舍的人手里。那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。'
              else: '12 月 24 日，雨又从棚屋顶上漏下来，接水的盆已经摆到了门口。{staff}抱着两份报告和那本停工的流水账，在学校的办公室外等了一上午，等到管房舍的人出来，当面一页一页翻给他看。那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。'
            p3:
              class_medical: '八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}照医护的规矩，在桌前立起一道防护屏，把样品一只只挪到屏后，又给两人各递了一副手套，说这东西伤人不见血。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。'
              class_learned: '八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}照实验室的规矩，在桌前立起一道防护屏，把样品挪到屏后，量过离身子多远才稳妥，用粉笔在桌面上画了一条线，又在线边放了两副手套。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。'
              else: '八月底，棚屋里闷得透不过气，几只玻璃皿在桌上摆成一排，里面是一遍遍提纯过的溶液。玛丽和皮埃尔照旧空着手端皿、倒液。{staff}把带来的防护屏立在桌前，样品一只只挪到屏后，又把一副手套搁在玛丽常坐的那张凳子上。玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。'
          excerpts:
            p3: '玛丽看了看那道屏，戴上手套，把手伸到屏后去够那只玻璃皿。傍晚屋里暗下来，皿里的东西发着一点淡光，落在屏上，没有落到她手上。'
            p2: '那人翻到停工那几页，停了很久，从抽屉里拿出一把钥匙，放在流水账上。钥匙上拴着一块小木牌，写着一个门牌号。'
            p1: '皮埃尔把稿子从头翻到尾，签了名，递给玛丽。她签在他的名字底下，又把那张光谱的记录压在了稿子上。'
        relic: 一管沥青铀矿
        relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
        points:
          p1: '在年末宣读前把还待独立验证的几份记录对齐，护住第二份新元素报告'
          p2: '用两次报告为居里争取一间能稳定工作的房间，替以后反复测量保住仪器和记录'
          p3: '从这时起让玛丽和皮埃尔隔着防护处理样品，护住他们的手和身体，少受射线'
        points_fail:
          p1: '交稿时独立观察与研究记录对不上，年末没有这份报告。事务所因同步失败召回员工。'
          p2: '几个人还在临时场地分着用台面，遇到天气坏时又要挪仪器、等场地。'
          p3: '他们照旧徒手处理样品，常年的射线落在两人身上。'
        shift:
          p1:
            was: '1898 年 12 月 26 日，巴黎科学院报告新的放射性物质，独立光谱观察随同刊出。'
          p2:
            was: '1898 年两次报告之后，居里夫妇的后续研究仍在学校的简陋场地进行。'
            now: '{staff}把两份成果和停工的记录一并交给愿意协调场地的人。学院为接下来的测量腾出一间可长期使用的房间。'
          p3:
            was: '1934 年 7 月 4 日，玛丽·居里死于再生障碍性贫血，一般认为与她长年受辐射有关。'
            now: '从 1898 年起，两人都隔着防护处理样品，多年里受到的辐射少了许多。玛丽后来的身体比历史上好，又多工作了些年。'
            who: curie_paris
            bio: '玛丽·居里从 1898 年起在防护下做放射性研究，晚年没有受到那样重的辐射损伤，多工作了些年。'
        vignettes:
          shed: '雨从学校院里那间棚屋的顶上漏下来。{staff}在漏处摆了几只盆，水滴进盆里一声一声地响，把一台摆满玻璃器皿的桌子挪开，角落里那只炉子几乎烘不暖屋子。'
          borscht: '{staff}在拉丁区一家小馆子吃饭。邻桌两个波兰学生用波兰话争得面红耳赤，面包屑撒了一桌，红菜汤凉了也没顾上喝。老板娘说，这一带的波兰人比塞纳河边的鸽子还多。'
          bookstall: '{staff}在塞纳河边的旧书摊上，从一摞晒褪了色的旧杂志底下翻到一本讲那种能穿过皮肉的新射线的小册子。摊主说，这年头的人，看不见的东西最肯掏钱。'
text:
  en:
    name: Marie Curie
    text: Polish born physicist and chemist, 1867 to 1934, who worked in Paris. With Pierre Curie she studied radioactivity and discovered polonium and radium in 1898. She received the Nobel Prize in Physics in 1903 and in Chemistry in 1911, and died of an illness linked to radiation.
  zh:
    name: 玛丽·居里
    text: 波兰出生的物理学家与化学家，1867 年生，1934 年去世，在巴黎工作。她与皮埃尔·居里研究放射性，1898 年发现钋和镭。她 1903 年获诺贝尔物理学奖，1911 年获化学奖，死于与辐射有关的疾病。
quotes:
  curie_paris_joined:
    order: 2
    tier: full
    date: '1903'
    checked: official_record
    sources: [curie_thesis_1903]
    original: fr
    text:
      fr:
        who: 'Marie Curie'
        quote: 'nous réunîmes nos efforts en vue d’aboutir à l’extraction des substances radioactives nouvelles et de poursuivre leur étude.'
        occasion: 'introduction de sa thèse Recherches sur les substances radioactives'
      en:
        who: 'Marie Curie'
        quote: 'We pooled our efforts to extract the new radioactive substances and continue studying them.'
        occasion: 'introduction to her Paris doctoral thesis, Research on Radioactive Substances (game translation)'
      zh:
        who: '玛丽·居里'
        quote: '我们合力提取新的放射性物质，并继续研究它们。'
        occasion: '巴黎博士论文《放射性物质研究》引言（游戏译文）'
      zh-Hant:
        who: '瑪麗·居里'
