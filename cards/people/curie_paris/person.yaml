  regret_choice: '派懂档案的去，年末那份镭的报告和光谱观察对得上，还争到了一间屋子；派带着防护的医护或学者去，八月起两人的手隔开了射线。前一种护住了发现，后一种护住了发现的人。'
  bookend: '从四月那份说沥青铀矿比铀更强的短文开始，以 1934 年她死于再生障碍性贫血收尾，两种新元素陪了她三十多年。'
