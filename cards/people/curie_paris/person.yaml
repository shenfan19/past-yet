hook: {en: 'After the discovery, the rays', zh: '发现之后，那些射线'}
facts:
  april_note:
    date: '1898-04-12'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [curie_wiki, curie_paris_primary]
    text:
      en: 'On 12 April 1898 a note by Marie Curie on the rays given off by compounds of uranium and thorium was presented to the Academy of Sciences by Gabriel Lippmann, since she was not a member; it observed that pitchblende was more active than uranium itself.'
      zh: '1898 年 4 月 12 日，玛丽·居里关于铀、钍化合物所放射线的短文由加布里埃尔·李普曼代为提交科学院，因为她不是院士；文中指出沥青铀矿比铀本身更活跃。'
    line:
      en: '12 April 1898: Marie Curie reports to the Academy of Sciences that pitchblende gives off stronger rays than uranium.'
      zh: '1898 年 4 月 12 日，玛丽·居里向科学院报告，沥青铀矿放出的射线比铀还强。'
      zh-Hant: '1898 年 4 月 12 日，瑪麗·居里向科學院報告，瀝青鈾礦放出的射線比鈾還強。'
      fr: '12 avril 1898 : Marie Curie rapporte à l''Académie des Sciences que la pitchblende émet des rayons plus forts que l''uranium.'
      es: '12 de abril de 1898: Marie Curie informa a la Academia de Ciencias que la pechblenda emite rayos más fuertes que el uranio.'
      ja: '1898年4月12日：マリー・キュリーはピッチブレンドがウランよりも強い光線を放出すると科学アカデミーに報告した。'
      ko: '1898년 4월 12일: 마리 퀴리는 피치블렌드가 우라늄보다 더 강한 광선을 방출한다고 과학 아카데미에 보고합니다.'
      ru: '12 апреля 1898 г.: Мария Кюри сообщает Академии наук, что настуран испускает более сильные лучи, чем уран.'
  polonium:
    date: '1898-07-18'
    stay_day: 18
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [curie_academy_july_1898, curie_wiki]
    text:
      en: 'On 18 July 1898 Pierre and Marie Curie reported to the Academy of Sciences a new radioactive substance in pitchblende, and proposed to call it polonium, after the country of one of them.'
      zh: '1898 年 7 月 18 日，皮埃尔与玛丽·居里向科学院报告沥青铀矿里有一种新的放射性物质，提议以其中一人的祖国命名为钋。'
    line:
      en: '18 July 1898: the Curies announce a new element in pitchblende and name it polonium, after Poland.'
      zh: '1898 年 7 月 18 日，居里夫妇宣布在沥青铀矿里找到一种新元素，以波兰命名为钋。'
      zh-Hant: '1898 年 7 月 18 日，居里夫婦宣佈在瀝青鈾礦裡找到一種新元素，以波蘭命名為釙。'
      fr: '18 juillet 1898 : les Curie annoncent un nouvel élément dans la pitchblende et le nomment polonium, du nom de la Pologne.'
      es: '18 de julio de 1898: los Curie anuncian un nuevo elemento en la pechblenda y lo llaman polonio, en honor a Polonia.'
      ja: '1898年7月18日：キュリー夫妻はピッチブレンドの新元素を発表し、ポーランドにちなんでポロニウムと名付けた。'
      ko: '1898년 7월 18일: 퀴리 부부는 피치블렌드의 새로운 원소를 발표하고 폴란드의 이름을 따서 폴로늄이라고 명명했습니다.'
      ru: '18 июля 1898 года: Кюри объявляют о новом элементе в утурате и называют его полонием в честь Польши.'
  radium:
    date: '1898-12-26'
    stay_day: 179
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [curie_academy_dec_1898, curie_wiki]
    text:
      en: 'On 26 December 1898 Pierre Curie, Marie Curie and Gustave Bémont reported a second, strongly radioactive substance in pitchblende and named it radium; Eugène Demarçay''s spectroscopic observation of a new line was published with it.'
      zh: '1898 年 12 月 26 日，皮埃尔·居里、玛丽·居里与古斯塔夫·贝蒙报告沥青铀矿里另一种强放射性物质，命名为镭；欧仁·德马尔赛观察到一条新光谱线，随文刊出。'
    line:
      en: '26 December 1898: the Curies and Bémont announce radium to the Academy of Sciences.'
      zh: '1898 年 12 月 26 日，居里夫妇与贝蒙向科学院宣布了镭。'
      zh-Hant: '1898 年 12 月 26 日，居里夫婦與貝蒙向科學院宣佈了鐳。'
      fr: '26 décembre 1898 : les Curie et Bémont annoncent le radium à l''Académie des Sciences.'
      es: '26 de diciembre de 1898: los Curie y Bémont anuncian el radio en la Academia de Ciencias.'
      ja: '1898年12月26日：キュリー夫妻とベモント夫妻がラジウムを科学アカデミーに発表。'
      ko: '1898년 12월 26일: 퀴리 부부와 베몽 부부가 과학 아카데미에 라듐을 발표했습니다.'
      ru: '26 декабря 1898 г.: Кюри и Бемон объявляют Академии наук о радие.'
  shed:
    date: '1902'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [curie_wiki, curie_nobel_lab_conditions]
    text:
      en: 'The Curies worked in a converted shed beside the School of Industrial Physics and Chemistry, poorly ventilated and not fully waterproof; by 1902 they had separated a tenth of a gram of radium chloride from about a tonne of pitchblende.'
      zh: '居里夫妇在工业物理化学学校旁一间改作实验室的棚屋里工作，通风差，屋顶也不完全挡雨；到 1902 年，他们从约一吨沥青铀矿里分出了十分之一克氯化镭。'
    line:
      en: '1902: from about a tonne of pitchblende the Curies have separated a tenth of a gram of radium chloride.'
      zh: '1902 年，居里夫妇从约一吨沥青铀矿里分出了十分之一克氯化镭。'
      zh-Hant: '1902 年，居里夫婦從約一噸瀝青鈾礦裡分出了十分之一克氯化鐳。'
      fr: "1902\_: à partir d'environ une tonne de pitchblende, les Curie ont séparé un dixième de gramme de chlorure de radium."
      es: '1902: de aproximadamente una tonelada de pechblenda, los Curie separan una décima parte de un gramo de cloruro de radio.'
      ja: '1902年：キュリー夫妻は約1トンのピッチブレンドから10分の1グラムの塩化ラジウムを分離した。'
      ko: '1902년: 퀴리 부부는 약 1톤의 역청에서 10분의 1그램의 염화라듐을 분리했습니다.'
      ru: '1902 год: примерно из тонны настурана Кюри выделили десятую часть грамма хлорида радия.'
  pierre_death:
    date: '1906-04-19'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [curie_wiki, pierre_curie_nobel]
    text:
      en: 'Pierre Curie died in Paris on 19 April 1906, struck by a horse-drawn vehicle in the Rue Dauphine.'
      zh: '1906 年 4 月 19 日，皮埃尔·居里在巴黎多菲内街被马车撞倒身亡。'
    note: 'A death in an accident: written as a plain fact.'
    line:
      en: '19 April 1906: Pierre Curie is killed by a horse-drawn vehicle in Paris.'
      zh: '1906 年 4 月 19 日，皮埃尔·居里在巴黎街头被马车撞倒身亡。'
      zh-Hant: '1906 年 4 月 19 日，皮埃爾·居里在巴黎街頭被馬車撞倒身亡。'
      fr: '19 avril 1906 : Pierre Curie est tué par un véhicule hippomobile à Paris.'
      es: '19 de abril de 1906: Pierre Curie muere atropellado por un vehículo tirado por caballos en París.'
      ja: '1906年4月19日：ピエール・キュリーがパリで馬車にはねられ死亡。'
      ko: '1906년 4월 19일: 피에르 퀴리가 파리에서 마차에 치여 사망.'
      ru: '19 апреля 1906 года: Пьер Кюри убит конной повозкой в Париже.'
  death:
    date: '1934-07-04'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [curie_wiki, curie_europeana]
    text:
      en: 'Marie Curie died on 4 July 1934 at the sanatorium of Sancellemoz in Haute-Savoie, of aplastic anaemia, generally linked to her long exposure to radiation.'
      zh: '1934 年 7 月 4 日，玛丽·居里在上萨瓦省桑塞勒莫疗养院去世，死于再生障碍性贫血，一般认为与她长年受辐射有关。'
    note: 'A death and an illness: written as plain facts.'
    line:
      en: '4 July 1934: Marie Curie dies of aplastic anaemia in Haute-Savoie.'
      zh: '1934 年 7 月 4 日，玛丽·居里在上萨瓦省因再生障碍性贫血去世。'
      zh-Hant: '1934 年 7 月 4 日，瑪麗·居里在上薩瓦省因再生障礙性貧血去世。'
      fr: '4 juillet 1934 : Marie Curie meurt d''une anémie aplasique en Haute-Savoie.'
      es: '4 de julio de 1934: Marie Curie muere de anemia aplásica en Alta Saboya.'
      ja: '1934年7月4日：キュリー夫人、再生不良性貧血のためオートサヴォワで死去。'
      ko: '1934년 7월 4일: 마리 퀴리가 오트사부아에서 재생 불량성 빈혈로 사망합니다.'
      ru: '4 июля 1934 года: Мария Кюри умирает от апластической анемии в Верхней Савойе.'
