    text:
      en:
        name: Two new elements
        place: Paris
        figure: Marie Curie
        story: 'In April 1898 Marie Curie reported that pitchblende gave off stronger rays than its uranium could explain. Working with Pierre Curie at the School of Industrial Physics and Chemistry in Paris, she separated its parts and followed the rays. On 18 July 1898 they announced a new element and named it polonium, after her native Poland; on 26 December, with Gustave Bémont, they announced radium. Marie Curie died in 1934 of aplastic anaemia, generally linked to her long exposure to radiation.'
        relic: A tube of pitchblende
        relic_desc: A glass tube of dark ore that left a faint glow in the dark.
        points:
          p1: 'Before the year-end reading, match the records still awaiting an independent check and protect the second report'
          p2: 'Use the two reports to secure a regular workroom for Curie and protect the instruments and records for later measurements'
          p3: 'From now on, put shielding between Marie and Pierre and their samples, and protect their hands and bodies from the rays'
        points_fail:
          p1: 'The independent observation cannot be matched to the team''s records before submission. The year-end report is lost, and the office recalls the employee.'
          p2: 'The team still shares makeshift benches. When the weather turns they have to move instruments and wait for space.'
          p3: 'They still handle the samples bare handed, and year after year the radiation falls on them both.'
        shift:
          p1:
            was: 'On 26 December 1898 the Paris Academy received a report on a new radioactive substance and published an independent spectroscopic observation alongside it.'
          p2:
            was: 'In 1898, after the two reports, the Curies continued their research in makeshift space at the school.'
            now: '{staff} presents both reports alongside a record of interruptions to someone who can arrange space. The school sets aside a room for long-term measurements.'
          p3:
            was: 'On 4 July 1934 Marie Curie died of aplastic anaemia, generally attributed to her long exposure to radiation.'
            now: 'From 1898 on, both of them worked with their samples behind shielding and took far less radiation over the years. Marie stayed in better health than in history and worked for some years longer.'
            who: curie_paris
            bio: 'Marie Curie worked with radioactive material behind shielding from 1898 on. She was spared the heavy radiation damage of her later years and worked some years longer.'
        vignettes:
          shed: 'Rain comes through the roof of the shed in the school yard. {staff} sets out basins under the leaks and moves a bench of glassware away from the drips, and the stove in the corner hardly warms the room.'
          borscht: '{staff} eats at a small place in the Latin Quarter. At the next table two Polish students argue in Polish until their beetroot soup goes cold, and the owner says there are more Poles round here than pigeons on the Seine.'
          bookstall: 'At a bookstall on the Seine {staff} turns up a pamphlet about the new rays that pass through flesh. The stallholder says people these days will pay for anything they cannot see.'
      zh:
        name: 两种新元素
        place: 巴黎
        figure: 玛丽·居里
        story: '1898 年 4 月，玛丽·居里报告说，沥青铀矿放出的射线比其中的铀能解释的更强。她与皮埃尔·居里在巴黎的工业物理化学学校把矿石一份份分开，追着射线走。1898 年 7 月 18 日，他们宣布发现一种新元素，以她的祖国波兰命名为钋；12 月 26 日，又与古斯塔夫·贝蒙一起宣布了镭。玛丽·居里 1934 年死于再生障碍性贫血，一般认为与她长年受辐射有关。'
        relic: 一管沥青铀矿
        relic_desc: 一支装着黑色矿石的玻璃管，在黑暗里有一点微光。
        points:
          p1: '在年末宣读前把还待独立验证的几份记录对齐，护住第二份新元素报告'
          p2: '用两次报告为居里争取一间能稳定工作的房间，替以后反复测量保住仪器和记录'
          p3: '从这时起让玛丽和皮埃尔隔着防护处理样品，护住他们的手和身体，少受射线'
        points_fail:
          p1: '交稿时独立观察与研究记录对不上，年末没有这份报告。事务所因同步失败召回员工。'
          p2: '几个人还在临时场地分着用台面，遇到天气坏时又要挪仪器、等场地。'
          p3: '他们照旧徒手处理样品，常年的射线落在两人身上。'
        shift:
          p1:
            was: '1898 年 12 月 26 日，巴黎科学院报告新的放射性物质，独立光谱观察随同刊出。'
          p2:
            was: '1898 年两次报告之后，居里夫妇的后续研究仍在学校的简陋场地进行。'
            now: '{staff}把两份成果和停工的记录一并交给愿意协调场地的人。学院为接下来的测量腾出一间可长期使用的房间。'
          p3:
            was: '1934 年 7 月 4 日，玛丽·居里死于再生障碍性贫血，一般认为与她长年受辐射有关。'
            now: '从 1898 年起，两人都隔着防护处理样品，多年里受到的辐射少了许多。玛丽后来的身体比历史上好，又多工作了些年。'
            who: curie_paris
            bio: '玛丽·居里从 1898 年起在防护下做放射性研究，晚年没有受到那样重的辐射损伤，多工作了些年。'
        vignettes:
          shed: '雨从学校院里那间棚屋的顶上漏下来。{staff}在漏处摆了几只盆，把一台摆满玻璃器皿的桌子挪开，角落里那只炉子几乎烘不暖屋子。'
          borscht: '{staff}在拉丁区一家小馆子吃饭。邻桌两个波兰学生用波兰话争得面红耳赤，红菜汤凉了也没顾上喝。老板娘说，这一带的波兰人比塞纳河边的鸽子还多。'
          bookstall: '{staff}在塞纳河边的旧书摊上翻到一本讲那种能穿过皮肉的新射线的小册子。摊主说，这年头的人，看不见的东西最肯掏钱。'
text:
  en:
    name: Marie Curie
    text: Polish born physicist and chemist, 1867 to 1934, who worked in Paris. With Pierre Curie she studied radioactivity and discovered polonium and radium in 1898. She received the Nobel Prize in Physics in 1903 and in Chemistry in 1911, and died of an illness linked to radiation.
  zh:
    name: 玛丽·居里
    text: 波兰出生的物理学家与化学家，1867 年生，1934 年去世，在巴黎工作。她与皮埃尔·居里研究放射性，1898 年发现钋和镭。她 1903 年获诺贝尔物理学奖，1911 年获化学奖，死于与辐射有关的疾病。
quotes:
  curie_paris_joined:
    order: 2
    tier: full
    date: '1903'
    checked: official_record
    sources: [curie_thesis_1903]
    original: fr
    text:
      fr: {who: 'Marie Curie', quote: 'nous réunîmes nos efforts en vue d’aboutir à l’extraction des substances radioactives nouvelles et de poursuivre leur étude.', occasion: 'introduction de sa thèse Recherches sur les substances radioactives'}
      en: {who: 'Marie Curie', quote: 'We pooled our efforts to extract the new radioactive substances and continue studying them.', occasion: 'introduction to her Paris doctoral thesis, Research on Radioactive Substances (game translation)'}
      zh: {who: '玛丽·居里', quote: '我们合力提取新的放射性物质，并继续研究它们。', occasion: '巴黎博士论文《放射性物质研究》引言（游戏译文）'}
  curie_paris_persistence:
    order: 1
    tier: none
    date: '1924'
    checked: official_record
    sources: [curie_pierre_biography]
    original: fr
    text:
      fr: {who: 'Marie Curie', quote: 'elle est le fruit d’un labeur préliminaire accumulé.', occasion: 'Pierre Curie, à propos des grandes découvertes'}
      en: {who: 'Marie Curie', quote: 'It is the fruit of all the work that came before.', occasion: 'on great discoveries, in her biography of Pierre Curie (game translation)'}
      zh: {who: '玛丽·居里', quote: '那是此前一点一滴的辛劳结出的果实。', occasion: '在《皮埃尔·居里》一书中谈重大发现（游戏译文）'}
hook: {en: 'After the discovery, the rays', zh: '发现之后，那些射线'}
facts:
  april_note:
    date: '1898-04-12'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [curie_wiki, curie_paris_primary]
    text:
      en: 'On 12 April 1898 a note by Marie Curie on the rays given off by compounds of uranium and thorium was presented to the Academy of Sciences by Gabriel Lippmann, since she was not a member; it observed that pitchblende was more active than uranium itself.'
      zh: '1898 年 4 月 12 日，玛丽·居里关于铀、钍化合物所放射线的短文由加布里埃尔·李普曼代为提交科学院，因为她不是院士；文中指出沥青铀矿比铀本身更活跃。'
    line:
      en: '12 April 1898: Marie Curie reports to the Academy of Sciences that pitchblende gives off stronger rays than uranium.'
      zh: '1898 年 4 月 12 日，玛丽·居里向科学院报告，沥青铀矿放出的射线比铀还强。'
  polonium:
    date: '1898-07-18'
    stay_day: 18
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [curie_academy_july_1898, curie_wiki]
    text:
      en: 'On 18 July 1898 Pierre and Marie Curie reported to the Academy of Sciences a new radioactive substance in pitchblende, and proposed to call it polonium, after the country of one of them.'
      zh: '1898 年 7 月 18 日，皮埃尔与玛丽·居里向科学院报告沥青铀矿里有一种新的放射性物质，提议以其中一人的祖国命名为钋。'
    line:
      en: '18 July 1898: the Curies announce a new element in pitchblende and name it polonium, after Poland.'
      zh: '1898 年 7 月 18 日，居里夫妇宣布在沥青铀矿里找到一种新元素，以波兰命名为钋。'
  radium:
    date: '1898-12-26'
    stay_day: 179
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [curie_academy_dec_1898, curie_wiki]
    text:
      en: 'On 26 December 1898 Pierre Curie, Marie Curie and Gustave Bémont reported a second, strongly radioactive substance in pitchblende and named it radium; Eugène Demarçay''s spectroscopic observation of a new line was published with it.'
      zh: '1898 年 12 月 26 日，皮埃尔·居里、玛丽·居里与古斯塔夫·贝蒙报告沥青铀矿里另一种强放射性物质，命名为镭；欧仁·德马尔赛观察到一条新光谱线，随文刊出。'
    line:
      en: '26 December 1898: the Curies and Bémont announce radium to the Academy of Sciences.'
      zh: '1898 年 12 月 26 日，居里夫妇与贝蒙向科学院宣布了镭。'
  shed:
    date: '1902'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [curie_wiki, curie_nobel_lab_conditions]
    text:
      en: 'The Curies worked in a converted shed beside the School of Industrial Physics and Chemistry, poorly ventilated and not fully waterproof; by 1902 they had separated a tenth of a gram of radium chloride from about a tonne of pitchblende.'
      zh: '居里夫妇在工业物理化学学校旁一间改作实验室的棚屋里工作，通风差，屋顶也不完全挡雨；到 1902 年，他们从约一吨沥青铀矿里分出了十分之一克氯化镭。'
    line:
      en: '1902: from about a tonne of pitchblende the Curies have separated a tenth of a gram of radium chloride.'
      zh: '1902 年，居里夫妇从约一吨沥青铀矿里分出了十分之一克氯化镭。'
  pierre_death:
    date: '1906-04-19'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [curie_wiki, pierre_curie_nobel]
    text:
      en: 'Pierre Curie died in Paris on 19 April 1906, struck by a horse-drawn vehicle in the Rue Dauphine.'
      zh: '1906 年 4 月 19 日，皮埃尔·居里在巴黎多菲内街被马车撞倒身亡。'
    note: 'A death in an accident: written as a plain fact.'
    line:
      en: '19 April 1906: Pierre Curie is killed by a horse-drawn vehicle in Paris.'
      zh: '1906 年 4 月 19 日，皮埃尔·居里在巴黎街头被马车撞倒身亡。'
  death:
    date: '1934-07-04'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [curie_wiki, curie_europeana]
    text:
      en: 'Marie Curie died on 4 July 1934 at the sanatorium of Sancellemoz in Haute-Savoie, of aplastic anaemia, generally linked to her long exposure to radiation.'
      zh: '1934 年 7 月 4 日，玛丽·居里在上萨瓦省桑塞勒莫疗养院去世，死于再生障碍性贫血，一般认为与她长年受辐射有关。'
    note: 'A death and an illness: written as plain facts.'
    line:
      en: '4 July 1934: Marie Curie dies of aplastic anaemia in Haute-Savoie.'
      zh: '1934 年 7 月 4 日，玛丽·居里在上萨瓦省因再生障碍性贫血去世。'
