    refs: [savitribai_phule_pune_early, savitribai_phule_pune_records, wikipedia_savitribai, janata_savitribai, theprint_sari]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: endure, guard: true, day: 24, req: {"any":[{"trait":["bold","vigil","hardy"],"stat":{"will":6}},{"stat":{"constitution":8,"will":7}},{"item":"holo_cloak","stat":{"will":5}}]}}
        - {id: p2, kind: persuade, day: 60, req: {"any":[{"job":["teacher","tutor","caregiver"]},{"trait":["patient","kind","charismatic"],"stat":{"will":5}}]}}
        - {id: p3, kind: hold, day: 90, req: {"any":[{"trait":["charismatic"],"stat":{"will":8}},{"trait":["bold"],"job":["union_organizer","teacher","journalist"]},{"item":"golden_apple","stat":{"will":7}}]}}
