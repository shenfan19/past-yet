    text:
      en:
        name: 'Leave room for another name'
        place: "Pune"
        figure: "Savitribai Phule"
        story: 'Early newspaper accounts reproduced in an NCERT historical lecture trace Jotirao and Savitribai Phule’s educational work in Pune to 1848. A report on the later school network names Savitribai as a head teacher. This visit imagines a lesson in the early school and follows two fictional pupils, with a slate shared between them.'
        relic: "A slate"
        relic_desc: "A small slate with a first row of letters in chalk."
        points:
          p1: 'Make the trip back for a slate before class ends'
          p2: 'Ask the pupil who finished first to leave space for the next hand'
          p3: 'Show each pupil how to make room for the other’s letters'
        vignettes:
          slate: 'Gauri can write the first stroke but stops as soon as Janki reaches for the slate. You turn it sideways and Janki takes one end. By the time they are called home, each has made a mark that the other can point to. They agree which end each will use when the slate comes back.'
          home: 'Janki has to take the slate home in a bag with her other things. Gauri will come on a different day and worries she will find it wiped. You show Janki how to tuck the cloth over the smaller practice mark. The board she carries has one half cleared and one half left for Gauri to read.'
          register: 'You have seen the later report with neatly ruled totals. Gauri wants to know whether the name she has just written can stay up until her family sees it. You point out its place on the slate to Janki. The bell sounds before you can see who comes to read it.'
      zh:
        name: '给另一个名字留地方'
        place: "浦那"
        figure: "萨维特里白·普勒"
        story: '印度国家教育研究与培训委员会刊印的史料讲座引录早期报纸，把乔蒂拉奥与萨维特里白·普勒在浦那开展教育的时间追溯至1848年。后来的办学记录记萨维特里白担任校长。游戏虚构早期学校的一堂课，两位虚构学生合用一块石板。'
        relic: "一块石板"
        relic_desc: "一块小石板，上面用粉笔写着第一排字母。"
        points:
          p1: '下课前跑一趟，把石板取回来'
          p2: '请先写完的学生给另一只手留地方'
          p3: '教两名学生给对方的字留出地方'
        vignettes:
          slate: '高莉能写第一笔，一见詹基来够石板就停了。你把石板横过来，詹基扶住另一头。喊她们回家时，两人都留了一道笔迹，彼此都指得出是谁写的。她们约好下回石板拿来各用哪一端。'
          home: '詹基得把石板和别的东西装在同一个袋里带回家。高莉隔天才来，怕字早被擦了。你帮詹基用布遮好较小的那笔。她带走的石板上，一半已经擦净，一半还留给高莉看。'
          register: '你见过后来的报告，表上把人数归得齐齐整整。高莉问，她刚写的名字能不能留到家里人看见。你把字在石板上的位置指给詹基。钟声一响，后来谁来读它，你就不在场了。'
text:
  en:
    name: Savitribai Phule
    text: Indian teacher and poet, 1831 to 1897. With her husband Jyotirao Phule she opened a school for girls in Pune in 1848, faced hostility for it, and later opened a home for widows and cared for plague patients.
  zh:
    name: 萨维特里白·普勒
    text: 印度教师与诗人，1831 年生，1897 年去世。1848 年她与丈夫乔蒂拉奥·普勒在浦那开办女校，为此遭到敌视，后来又开设寡妇之家，并照顾鼠疫病人。
hook: {en: 'Two pupils have one slate before dismissal.', zh: '放学前，两名学生只剩一块石板。'}
