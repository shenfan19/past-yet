      points:
        - {id: p1, kind: trust, day: 10, req: {"any":[{"trait":["kind","patient","quiet"]},{"job":["teacher","nurse"]}]}}
        - {id: p2, kind: endure, day: 30, req: {"any":[{"trait":["bold","hardy","faithful"]},{"stat":{"will":6}}]}}
        - {id: p3, kind: care, redeem: true, day: 90, req: {"any":[{"job":["teacher"]},{"trait":["patient","faithful","kind"]},{"stat":{"wit":6}}]}}
