    text:
      en: 'The lecture discusses the 5 February 1852 application for aid and accompanying records of later girls’ schools. These describe Savitribai as headmistress in the first of the schools in that series.'
      zh: '讲座讨论1852年2月5日申请资助的文书及相关女子学校记录，后者指出萨维特里白是该批学校中第一所的校长。'
