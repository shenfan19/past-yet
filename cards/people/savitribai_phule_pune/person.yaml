    text:
      en:
        name: 'A spare sari in the bag'
        place: "Pune"
        figure: "Savitribai Phule"
        story: 'In January 1848 Savitribai Phule, Jyotirao Phule and Sagunabai opened a school for girls in the house of Tatyasaheb Bhide in Pune. On the way to the school she was often pelted with stones and dung, and she carried a spare sari to change into. In 1852 she was recorded as head teacher of the first of the Phules'' girls'' schools. She died on 10 March 1897 of plague caught while nursing the sick.'
        relic: "A slate"
        relic_desc: "A small slate with a first row of letters in chalk."
        points:
          p1: 'Be taken in by the household at Bhide Wada, then sweep the room and set out the slates each morning'
          p2: 'Walk beside her to the school and carry the bag with the spare sari'
          p3: 'Sit with one girl until she can write her own name for her family to see'
        vignettes:
          slate: '{staff} turns the slate sideways so two girls can reach it at once. When they are called home, each has left a mark the other can point to.'
          road: '{staff} walks half a step behind on the road to Budhwar Peth and keeps the bag on the side away from the doorways. Nobody in the street says anything that morning.'
          chalk: '{staff} breaks the last stick of chalk in two so that there is one for the board and one for the slates, and writes down what is needed from the market.'
      zh:
        name: '包里多带的一件纱丽'
        place: "浦那"
        figure: "萨维特丽巴伊·普勒"
        story: '1848 年 1 月，萨维特丽巴伊·普勒、乔蒂拉奥·普勒和萨古娜拜在浦那塔蒂亚萨赫布·比德的宅子里开办女子学校。去学校的路上常有人朝她扔石头和粪，她包里多带一件纱丽，到学校再换上。1852 年的记录写她是普勒夫妇办的第一所女校的校长。1897 年 3 月 10 日，她在照顾病人时染上鼠疫去世。'
        relic: "一块石板"
        relic_desc: "一块小石板，上面用粉笔写着第一排字母。"
        points:
          p1: '先让比德府这户人家认下，再每天早上扫好屋子、摆好石板'
          p2: '陪她走到学校，替她拎着装纱丽的那只包'
          p3: '陪一个女孩坐到她能写出自己的名字，留给家里人看'
        vignettes:
          slate: '{staff}把石板横过来，让两个女孩同时够得着。喊她们回家时，两人都留了一道笔迹，彼此都指得出是谁写的。'
          road: '去布德瓦尔区的路上，{staff}落后半步跟着，把包拎在背对门口的那一侧。那天早上，街上没人说话。'
          chalk: '{staff}把最后一支粉笔掰成两截，一截给黑板，一截给石板，又记下要去集市上买的东西。'
text:
  en:
    name: Savitribai Phule
    text: Indian teacher and poet, 1831 to 1897. With her husband Jyotirao Phule she opened a school for girls in Pune in 1848, faced hostility for it, and later opened a home for widows and cared for plague patients.
  zh:
    name: 萨维特丽巴伊·普勒
    text: 印度教师与诗人，1831 年生，1897 年去世。1848 年她与丈夫乔蒂拉奥·普勒在浦那开办女校，为此遭到敌视，后来又开设寡妇之家，并照顾鼠疫病人。
hook: {en: 'A spare sari in the bag', zh: '包里多带一件纱丽'}
facts:
  school:
    date: '1848-01-01'
    stay_day: 0
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_savitribai, janata_savitribai]
    text:
      en: 'In January 1848 Savitribai and Jyotirao Phule, with Sagunabai, started a school for girls at Bhide Wada, the house of Tatyasaheb Bhide in Pune. One account gives the date as 1 January.'
      zh: '1848 年 1 月，萨维特丽巴伊和乔蒂拉奥·普勒与萨古娜拜在浦那塔蒂亚萨赫布·比德的宅子比德府开办女子学校，有说法定在 1 月 1 日。'
    line:
      en: 'January 1848: in Bhide Wada, the house of Tatyasaheb Bhide, Savitribai, Jyotirao and Sagunabai open a school for girls.'
      zh: '1848 年 1 月，萨维特丽巴伊、乔蒂拉奥和萨古娜拜在比德府开办女子学校。'
  sari:
    date: '1848'
    stay_day: 25
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [theprint_sari, wikipedia_savitribai]
    text:
      en: 'On her way to the school she was often pelted with stones and dung and abused, and she carried a spare sari to change into at the school.'
      zh: '去学校的路上，她常被人扔石头和粪、遭人辱骂，所以包里多带一件纱丽，到学校再换上。'
    line:
      en: 'On the road to the school she is pelted with stones and dung. She carries a spare sari in her bag and changes at the school.'
      zh: '去学校的路上有人朝她扔石头和粪。她包里多带一件纱丽，到了学校再换上。'
  early:
    date: '1851'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [savitribai_phule_pune_early]
    text:
      en: 'The lecture reproduces the 1851 account linking the start of the Phules’ educational work to 1848 and describing Savitribai’s role and training.'
      zh: '讲座引录1851年报纸，把普勒夫妇开始办学的时间追溯到1848年，并记述萨维特丽巴伊的参与和受训经过。'
  records:
    date: '1852-02-05'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [savitribai_phule_pune_records]
    text:
      en: 'The 5 February 1852 application for aid and the records of the later girls’ schools describe Savitribai as headmistress of the first of the schools in that series.'
      zh: '1852 年 2 月 5 日申请资助的文书及后来女子学校的记录，记萨维特丽巴伊为这批学校中第一所的校长。'
    line:
      en: '5 February 1852: in an application for aid, Savitribai is written down as headmistress of the first school.'
      zh: '1852 年 2 月 5 日，申请资助的文书上，萨维特丽巴伊被写作第一所女校的校长。'
  death:
    date: '1897-03-10'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wikipedia_savitribai, janata_savitribai]
    text:
      en: 'She died on 10 March 1897 of plague, which she caught while caring for patients.'
      zh: '1897 年 3 月 10 日，她因照顾病人染上鼠疫去世。'
