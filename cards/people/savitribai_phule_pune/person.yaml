    text:
      en:
        name: 'A spare sari in the bag'
        place: "Pune"
        figure: "Savitribai Phule"
        story: 'In 1848 Savitribai and Jyotirao Phule began teaching girls in Pune. Accounts of her work describe the abuse she met on the road and the spare sari she took to change into at school. The records of the later schools list her as headmistress. In 1897 she died of plague while caring for the sick.'
        relic: "A slate"
        relic_desc: "A small slate with a first row of letters in chalk."
        points:
          p1: 'On the hardest morning of the first month, keep her road to Bhide Wada clear so that the day''s lessons begin'
          p2: 'Bring back a girl whose family has called her home, so that she sits at her slate again'
          p3: 'Stop the people on that road who throw things at her, so that she no longer needs a spare sari in her bag'
        points_fail:
          p1: 'That day she did not reach the school, and the door at Bhide Wada stayed shut.'
          p2: 'In this branch there was one girl fewer at the slates in Bhide Wada.'
          p3: 'She still carried a spare sari in her bag every day, as in history.'
        shift:
          p1:
            was: 'From January 1848 the girls'' school at Bhide Wada kept its classes, and Savitribai walked there every day to teach.'
          p2:
            was: 'In 1848 many families in Pune were against girls going to school.'
            now: 'The girl came back to her lessons.'
          p3:
            was: 'From 1848 she was pelted with stones and dung on the way to school, and carried a spare sari to change into when she arrived.'
            now: 'From one spring morning on nobody by the road threw anything at her again, and the spare sari stayed folded in the bag.'
        vignettes:
          slate: '{staff} turns the slate sideways so two girls can reach it at once. When they are called home, each has left a mark the other can point to.'
          road: '{staff} walks half a step behind on the road to Budhwar Peth and keeps the bag on the side away from the doorways. Nobody in the street says anything that morning.'
          chalk: '{staff} breaks the last stick of chalk in two so that there is one for the board and one for the slates, and writes down what is needed from the market.'
      zh:
        name: '包里多带的一件纱丽'
        place: "浦那"
        figure: "萨维特丽巴伊·普勒"
        story: '1848 年，萨维特丽巴伊·普勒与乔蒂拉奥·普勒在浦那开始办女学。有关她的记述里，有她去学校路上受到的侮辱，也有她随身多带、到学校再换上的那件纱丽。后来的办学档案记她担任校长。1897 年，她在照顾鼠疫病人时染病去世。'
        relic: "一块石板"
        relic_desc: "一块小石板，上面用粉笔写着第一排字母。"
        points:
          p1: '开学头一个月最难的那个早上，护住她去比德府的路，让当天的课照常开'
          p2: '劝回一个被家里叫回去的女孩，让她回到石板前'
          p3: '拦下那段路上朝她扔东西的人，让她不必再在包里多带一件纱丽'
        points_fail:
          p1: '那天她没能走到学校，比德府的门没有开。'
          p2: '这条分支里，比德府的石板前少了一个人。'
          p3: '她照旧每天在包里多带一件纱丽，这条分支与历史一样。'
        shift:
          p1:
            was: '1848 年 1 月起，比德府的女子学校照常开课，萨维特丽巴伊每天走路去教书。'
          p2:
            was: '1848 年，浦那许多人家反对女孩上学。'
            now: '那个女孩又回来上课了。'
          p3:
            was: '1848 年起，她去学校的路上被扔石头和粪，包里多带一件纱丽，到校再换上。'
            now: '从一个春天的早上起，路边没人再朝她扔东西，那件备用的纱丽一直叠在包里没用上。'
        vignettes:
          slate: '{staff}把石板横过来，让两个女孩同时够得着。喊她们回家时，两人都留了一道笔迹，彼此都指得出是谁写的。'
          road: '去布德瓦尔区的路上，{staff}落后半步跟着，把包拎在背对门口的那一侧。那天早上，街上没人说话。'
          chalk: '{staff}把最后一支粉笔掰成两截，一截给黑板，一截给石板，又记下要去集市上买的东西。'
text:
  en:
    name: Savitribai Phule
    text: Indian teacher and poet, 1831 to 1897. With her husband Jyotirao Phule she opened a school for girls in Pune in 1848, faced hostility for it, and later opened a home for widows and cared for plague patients.
  zh:
    name: 萨维特丽巴伊·普勒
    text: 印度教师与诗人，1831 年生，1897 年去世。1848 年她与丈夫乔蒂拉奥·普勒在浦那开办女校，为此遭到敌视，后来又开设寡妇之家，并照顾鼠疫病人。
hook: {en: 'A spare sari in the bag', zh: '包里多带一件纱丽'}
