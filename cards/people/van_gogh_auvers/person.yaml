    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 49, req: {"any":[{"job":["painter","illustrator"]},{"trait":["hardy","handy","patient"],"stat":{"constitution":6}}]}}
        - {id: p2, kind: persuade, day: 55, req: {"any":[{"trait":["artistic","sensitive","charismatic","kind"]},{"job":["painter","illustrator","antique_dealer"]}]}}
        - {id: p3, kind: care, day: 66, req: {"any":[{"job":["doctor","physician","nurse","paramedic"],"stat":{"will":6}},{"job":["doctor","physician","nurse","paramedic","caregiver"],"item":"calm_patch"}]}}
