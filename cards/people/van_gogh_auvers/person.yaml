self_check:
  echo_review: 'Echo-only pass: this live event is still at build step 2; its approved-star and story review gates have not been advanced.'
  fact: death
  quote_line: '7 月 29 日，文森特·梵高去世，弟弟提奥在他身边。'
  regret_choice: '派扛得动的去，画架送得到田里，麦田边的风里却没人按住画布；派守得住的去，楼上那两天门外有人，开头那些日子没人帮他背画具。'
