    text:
      en:
        name: "A summer in Auvers"
        place: "Auvers sur Oise"
        figure: "Vincent van Gogh"
        story: 'Vincent van Gogh came to Auvers sur Oise on 20 May 1890, lodged at the Auberge Ravoux and often went to see Dr Paul Gachet. He painted almost a work a day. In a letter of about 10 July he wrote of vast fields of wheat under troubled skies. On 27 July he shot himself in the chest, and he died on 29 July with his brother Theo beside him.'
        story_prose:
          opening:
            - 'Auvers-sur-Oise, summer 1890. Van Gogh is staying at the Auberge Ravoux and paints almost every day. In a letter in July he writes about wide wheatfields beneath troubled skies.'
            - 'In history, he worried about the livelihood of his brother’s family and died at Auvers late that month. In this branch, there is someone on the path between the wheat and the inn to hold a canvas for him or hear him out.'
            - 'This trip needs someone who can steady an easel in the wind, someone who can make sense of the household accounts and someone who will listen. A person who knows care can also sit with him at the inn.'
          points:
            p1: 'Wind pushes against the canvas. {staff} braces the loose foot of the easel and holds the windward corner while Van Gogh makes his last strokes. The farther wheat bows first, while the stalks nearby still stir. When Van Gogh lowers the brush, the bottom of the canvas is still a finger’s width above the ground.'
            p2: '{staff} spreads the letters out with him, goes from Theo’s work to the household expenses, and notes what can be settled at the edge of a sheet. Van Gogh folds the sheet back into its envelope. Before putting it away, he smooths the flap with his palm.'
            p3: '{staff} lays out the painted wheatfields, one after another, and tells him that people will come a long way to a gallery to look at this ground and sky. Van Gogh moves the outermost painting back to the middle of the table. As the room grows dark, a thin line of yellow still shows.'
            p4: '{staff} stays at the inn through the hardest days, sees to rest and daily care, and waits until Van Gogh wants to open the window himself. The girl from the inn puts down the tray by the door. Van Gogh takes it and moves it aside to make room for his paints.'
          outcomes:
            all: 'After summer the fields took on other colours. There were still sheets drying by the door at the inn, with a written letter tucked underneath.'
            p4: 'In autumn, the people at the inn still saw him carry his paints out. As the door opened, the tin end of a tube showed in his pocket.'
            p3: 'Later, people stopped before those fields in a gallery. A step nearer and the yellow seemed almost within reach.'
            p2: 'The letter about the household stayed on the table at the inn. Opened again, it showed a small line beside the faintest crease.'
            p1: 'The field stayed in the painting. Held by a window later, two thicknesses of paint showed along the horizon.'
          none: 'Footsteps sounded in the inn corridor. When the tray came back, the water in the cup was still flat.'
          not_admitted: '{staff} found no place at the inn. A little of the field was visible past the path, but the corner of the building hid the way on.'
          desync: 'The easel lay on its side among the wheat. As {staff} was recalled, a stalk caught on one of its legs still nodded in the wind.'
          excerpts:
            p4: 'The girl from the inn puts down the tray by the door. Van Gogh takes it and moves it aside to make room for his paints.'
            p3: 'Van Gogh moves the outermost painting back to the middle of the table. As the room grows dark, a thin line of yellow still shows.'
            p2: 'Van Gogh folds the sheet back into its envelope. Before putting it away, he smooths the flap with his palm.'
            p1: 'The farther wheat bows first, while the stalks nearby still stir. When Van Gogh lowers the brush, the bottom of the canvas is still a finger’s width above the ground.'
        relic: "A tube of chrome yellow"
        relic_desc: "A squeezed tin tube of the colour he used for the fields."
        points:
          p1: 'Under a stormy sky, help him finish the wheatfield, and keep the canvas from falling into the wheat'
          p2: 'After the visit to Paris, help him get Theo''s money troubles talked through, so that storm does not weigh on him'
          p3: 'Let him know that his paintings will be remembered'
          p4: 'Before 27 July, heal his body and his mind, and keep him alive'
        points_fail:
          p1: 'The canvas went down into the wheat in the wind, and in this branch there is no Wheatfield under Thunderclouds.'
          p2: 'He came back from Paris still feeling the storm that threatened Theo weighing on him too. In this branch nobody helped him get the money matter clear.'
          p3: 'He still felt his paintings were a burden on Theo. In this branch nobody ever told him where these wheatfields would end up.'
          p4: '27 July happened as it did in history. In this branch he did not paint another season.'
        shift:
          p1:
            was: 'In early July 1890 Van Gogh painted vast wheatfields under troubled skies, and wrote of them to Theo and Jo about 10 July.'
          p2:
            was: 'In early July 1890 Van Gogh visited Theo''s family in Paris and learned that Theo was thinking of leaving his post to set up on his own; back in Auvers he wrote that the storm threatening Theo weighed on him too.'
            now: 'When he came back from Paris he knew how Theo''s household would manage, and he went back out to the fields with one weight fewer.'
          p3:
            was: 'In July 1890 Van Gogh wrote that he felt a failure and saw no good future; he sold few paintings in his life.'
            now: 'Someone told him that these wheatfields would one day hang on museum walls, and that many people would travel to see them.'
          p4:
            was: 'He was wounded by a gunshot on 27 July 1890 and died at Auvers two days later, having painted for only about a decade.'
            now: '{staff} stayed with him through that July, the illness did not crush him again, and when the summer was over he was still at the Auberge Ravoux. He painted for a few more years, and after the wheatfields there were other seasons.'
        vignettes:
          sky: '{staff} draws the same field twice in a notebook, first with a strip of sky and then with much more, and sees something in the second that the first had hidden.'
          wind: '{staff} waits for the next gust over the wheat and watches the dark patch move across it, without rubbing out the first look.'
          path: '{staff} walks along a path between the fields until its end can be seen, and on the way back can tell where it goes.'
      zh:
        name: "奥维尔的夏天"
        place: "奥维尔"
        figure: "文森特·梵高"
        story: '1890 年 5 月 20 日，文森特·梵高来到瓦兹河畔奥维尔，住进拉武客栈，常去看保罗·加歇医生。他几乎一天画一幅。约 7 月 10 日的一封信里，他写到不安的天空下大片的麦田。7 月 27 日，他朝自己胸口开了一枪，7 月 29 日去世，弟弟提奥在他身边。'
        story_prose:
          opening:
            - '1890 年夏，瓦兹河畔奥维尔。梵高住在拉武客栈，几乎天天画。七月的一封信里，他写到不安天空下大片的麦田。'
            - '史实里，他为弟弟一家的生计担忧，七月底在奥维尔去世。在这条分支里，麦田和客栈之间那条路上，还有人能扶一下画布，也有人能听他说完。'
            - '这一趟用得上能在阵风里看住画架的人，也需要能把账说清楚、能好好听人说话的人。懂得照护的人还能在客栈陪一阵。'
          points:
            p1: '麦田里风压着画布。{staff}赶到画架旁，踩实松动的架脚，把迎风的角扶稳，等梵高落下最后几笔。深处的麦子先伏下去，近处还在动。梵高松开画笔时，画布下缘还离地半寸。'
            p2: '{staff}和他把来信摊开，从提奥眼下的工作说到家里的花用，逐条把能问清的写在纸边。梵高把那张纸折回信封里。装进去之前，他用手把翘起的封口抚了一遍。'
            p3: '{staff}把他画过的几片麦田一张张摊开，说以后会有人专程走进画馆，看这些地和天。梵高把最靠外的一张移回桌子中间。天色暗下去时，那一线黄还亮着。'
            p4: '{staff}在客栈陪他熬过最难的几天，照应休息和日常起居，等到他自己愿意把窗推开。客栈女孩把托盘搁在门边。梵高伸手接住，往旁边挪出一个摆颜料的位置。'
          outcomes:
            all: '夏天过去以后，麦田也有了别的颜色。客栈门边还晾着几张纸，写过的信夹在最底下。'
            p4: '秋天，客栈的人仍能看见他把画具拎出门。门开的时候，一管颜料从兜里露出锡色的一头。'
            p3: '后来有人在画馆里停在那几片麦田前。再走近一步，画上的黄几乎挨到眼前。'
            p2: '那封谈家计的信后来留在客栈桌上。展开时，从最浅的一道折痕旁还看得见一行小字。'
            p1: '麦田留在那幅画里。后来有人把画举到窗边，看见油彩在地平线上有厚薄两层。'
          none: '客栈楼道响过一阵脚步。门边的托盘推回去时，杯里的水还平着。'
          not_admitted: '{staff}没能在客栈留下。小路尽头看得见一截麦田，往前的路却被屋角挡住。'
          desync: '画架侧倒在麦田里。{staff}被召回时，挂在一条架腿上的麦穗还在风里点头。'
          excerpts:
            p4: '客栈女孩把托盘搁在门边。梵高伸手接住，往旁边挪出一个摆颜料的位置。'
            p3: '梵高把最靠外的一张移回桌子中间。天色暗下去时，那一线黄还亮着。'
            p2: '梵高把那张纸折回信封里。装进去之前，他用手把翘起的封口抚了一遍。'
            p1: '深处的麦子先伏下去，近处还在动。梵高松开画笔时，画布下缘还离地半寸。'
        relic: "一管铬黄颜料"
        relic_desc: "一支挤瘪的锡管，里面是他画麦田用的那种黄。"
        points:
          p1: '暴风雨般的天空下，帮他把那幅麦田画完，不让画布倒进麦田'
          p2: '从巴黎回来以后，帮他把提奥一家的钱和生计问清、说开，不让那场风暴压在他身上'
          p3: '让他知道自己的画会被记住'
          p4: '7 月 27 日之前，治好他的身体和心病，让他活下来'
        points_fail:
          p1: '那幅画在风里倒进了麦田，这条分支里没有《麦田上空的乌云》。'
          p2: '他从巴黎回来，照旧觉得那场威胁提奥的风暴也压在自己身上，这条分支里没有人帮他把钱的事理清。'
          p3: '他照旧觉得自己的画是提奥的负担，这条分支里没有人告诉过他这些麦田后来的去处。'
          p4: '7 月 27 日照史实发生，这条分支里他没能多画一个季节。'
        shift:
          p1:
            was: '1890 年 7 月初，梵高在不安的天空下画成了大片的麦田，7 月 10 日前后写信给提奥和乔说起它。'
          p2:
            was: '1890 年 7 月初，梵高去巴黎看提奥一家，得知提奥想辞去做了多年的画廊职位、自己开业；回奥维尔后他写信说，那场威胁提奥的风暴也压在自己身上。'
            now: '他从巴黎回来时已经知道提奥家撑得住，回到麦田里画画时，心上少压了一件事。'
          p3:
            was: '1890 年 7 月，梵高在信里说觉得自己是个失败者，看不到好的前途；他生前卖出的画很少。'
            now: '有人告诉过他，这些麦田以后会挂在博物馆的墙上，有很多人专程去看。'
          p4:
            was: '1890 年 7 月 27 日他受了枪伤，两天后在奥维尔去世，只画了大约十年。'
            now: '{staff}陪他过了那个七月，病没有再把他压垮，那个夏天过去时他还在拉武客栈。他又画了几年，麦田之后还有别的季节。'
        vignettes:
          sky: '{staff}在本子上画同一片田，一张窄窄地留着天，另一张把天留得多。再并在一起看，第二张才看得见云底的暗。'
          wind: '{staff}等风吹过麦田，看着暗影从这头走到那头。本子上的第一笔还留着。'
          path: '{staff}走到看得见小路尽头的地方。回来时，鞋边沾了两根细小的麦芒。'
text:
  en:
    name: Vincent van Gogh
    text: Dutch painter, 1853 to 1890. He painted for only about a decade, producing more than two thousand works, and sold few. He spent his last weeks at Auvers sur Oise and died of a gunshot wound in July 1890.
  zh:
    name: 文森特·梵高
    text: 荷兰画家，1853 年生，1890 年去世。他只画了大约十年，留下两千多件作品，卖出的很少。最后几周他住在瓦兹河畔奥维尔，1890 年 7 月因枪伤去世。
hook: {en: 'How much sky belongs above the field?', zh: '麦田上方，要留多少天空'}
