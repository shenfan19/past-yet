text:
  en:
    name: David Hume
    text: Scottish philosopher and historian, 1711 to 1776, born in Edinburgh, and the closest friend of Adam Smith. In his will of 1776 he named Smith his literary executor, and in a codicil of 7 August left his Dialogues Concerning Natural Religion to the printer William Strahan. He died in Edinburgh on 25 August 1776; the Dialogues came out in 1779.
  zh:
    name: 大卫·休谟
    text: 苏格兰哲学家与史学家，1711 年生于爱丁堡，1776 年去世，是亚当·斯密最亲近的朋友。1776 年他立遗嘱，指定斯密为遗稿执行人，8 月 7 日又在遗嘱附件里把《自然宗教对话录》托给印书商威廉·斯特拉恩。他在 1776 年 8 月 25 日于爱丁堡去世，《对话录》在 1779 年出版。
