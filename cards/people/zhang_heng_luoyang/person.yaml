text:
  en:
    name: Zhang Heng
    text: Chinese polymath of the Han, 78 to 139. In 132 he made a seismoscope, a bronze vessel that indicated the direction of a distant earthquake, and built a water driven armillary sphere. He also wrote poetry.
  zh:
    name: 张衡
    text: 汉代通才，78 年生，139 年去世。132 年他制成候风地动仪，一件铜制仪器，能指示远处地震的方向，又造了水力驱动的浑天仪。他也写诗。
