    sources: [zhang_heng_luoyang_instrument]
    text:
      en: 'The biography dates construction of the instrument to 132, describes its exterior and recounts a Longxi dispatch days after a ball fell. It gives no exact date for that episode.'
      zh: '传记在 132 年记造仪，写了外形，也叙述一次落丸后数日收到陇西驿报。这一例没有确切日期。'
