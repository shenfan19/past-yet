    text:
      en:
        name: 'A direction and a later dispatch'
        place: Luoyang, China
        figure: Zhang Heng
        story: 'The Book of the Later Han dates Zhang Heng’s seismoscope to 132. It describes eight dragon heads and reports an occasion when one ball fell although the capital felt no shaking, followed days later by news of an earthquake in Longxi. It does not reconstruct the hidden mechanism or date the Longxi report to 132.'
        relic: 'A direction record'
        relic_desc: 'One recorded direction, with a blank to be filled when a dispatch arrives.'
        points:
          p1: 'Help Zhang Heng draw and write out the mechanism inside the seismoscope, and lodge it with the instrument, so the workings are not lost with it'
        points_fail:
          p1: 'As in history the workings were never written down. In this branch later readers can only guess from the few lines on its outside in the Book of the Later Han.'
        shift:
          p1:
            was: 'In 132 Zhang Heng made the seismoscope; the Book of the Later Han records only its outside and one report from Longxi, the mechanism inside was never written down, the instrument was later lost, and modern reconstructions still disagree.'
            now: '{staff} helped him draw the mechanism and write it out, and the sheets were stored with the instrument at the court office. When the instrument was gone the drawings remained, and later makers could build it again from them.'
            who: zhang_heng_luoyang
            bio: 'In this line Zhang Heng''s seismoscope came down together with drawings of its workings, and later craftsmen built more than one from them.'
        vignettes:
          register: 'The record keeper hears the signal in the exercise and reaches for a place name. You draw a space for the indicated direction and another for news received from outside the capital. Only the direction goes in. You take that two-part record home. There is no corroborating message before you leave.'
          later: 'You know a later biography will say that a dispatch came from Longxi. The helper asks if it belongs on the present line. You leave a slip beside the record marked ‘awaiting word’. He can write on it when somebody arrives; your trip ends while the road is still quiet.'
          direction: 'You mark the line for what was noticed at the instrument and leave the remaining space for a witness. When the helper folds the exercise, the blank stays visible. You take home just the direction. The name of the place is still on the road.'
      zh:
        name: '一记方向，一封后到的驿报'
        place: 中国洛阳
        figure: 张衡
        story: '《后汉书》将张衡制候风地动仪记在 132 年。书中载有八龙，还叙述过一回铜丸落下、京师未觉地动，数日后才有陇西地震的驿报。'
        relic: '一张报动记事'
        relic_desc: '记下一处方向，另有一格留待驿报。'
        points:
          p1: '帮张衡把地动仪里面的机关画成图、写成说明，跟仪器一起收存，不让机关随它失传'
        points_fail:
          p1: '机关照史实没有写下来，这条分支里后人只能从《后汉书》里几行外形去猜。'
        shift:
          p1:
            was: '132 年张衡造成候风地动仪，《后汉书》只记下它的外形和一次陇西来报，里面的机关没有写下来；仪器后来失传，今人的复原至今各执一说。'
            now: '{staff}帮他把机关画了图、写了说明，跟仪器一起收进官署。后来仪器没了，图还在，后世的工匠照着图又把它造了出来。'
            who: zhang_heng_luoyang
            bio: 'IF 线里，张衡的地动仪连同机关图一起传了下来，后来的工匠照图造过不止一台。'
        vignettes:
          register: '记事人在练习中听到报动，伸手就要填地名。你划出一处记信号所指方向，另留一处记京外来的消息。这时只够填方向。你带回分成两栏的记法，证实的消息收队前还没到。'
          later: '你知道后世传记会写到陇西来报。帮工问现在是不是就能写上去。你另留一张记着「候报」的纸条。有人到了，他还能添写。你走时，驿路上仍然无声。'
          direction: '你在纸上写一行仪器边所见，余处留给来报的人。帮工折纸时，空格依然露在外头。你带回的只有方向，地名还在路上。'
text:
  en:
    name: Zhang Heng
    text: Chinese polymath of the Han, 78 to 139. The Book of the Later Han records his construction of a bronze seismoscope in 132 and describes how observers associated its signals with directions. He also developed astronomical instruments and wrote poetry.
  zh:
    name: 张衡
    text: 汉代通才，78 年生，139 年去世。《后汉书》记载他于 132 年制铜质候风地动仪，并叙述观测者如何把报动信号与方向对应。他也研制天文仪器，创作诗赋。
hook: {en: 'What did the dropped ball tell you before word came back?', zh: '铜丸落下时，哪一栏还不能填？'}
