text:
  en:
    name: Chimborazo, 1802
    text: A snow-capped volcano in the Andes of Ecuador whose summit is the point on the surface of the earth farthest from its centre. Chimborazo in the game is a party model of about sixteen people.
  zh:
    name: 钦博拉索，1802
    text: 厄瓜多尔安第斯山上的一座积雪火山，它的山顶是地球表面离地心最远的点。游戏里的钦博拉索是一个约十六人的队伍模型。
