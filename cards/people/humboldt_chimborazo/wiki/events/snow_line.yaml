text:
  en:
    name: The plan for the climb
    text: How fast to climb and how long to rest was a choice of the party on the slope. In the game an employee can help bring a change of plan earlier, which holds only in this branch.
  zh:
    name: 攀登的计划
    text: 爬多快、歇多久，是队伍在山坡上自己的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
