    text:
      en:
        name: "The gully above the snow line"
        place: "Mount Chimborazo, Ecuador"
        figure: "Alexander von Humboldt"
        story: 'On 23 June 1802 Humboldt climbed Chimborazo with Aimé Bonpland and Carlos Montúfar. The porters would go no further; the three went on with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them, and they turned back.'
        story_prose:
          opening:
            - 'Above the snow line of Chimborazo, Bonpland hands Humboldt the barometer to free a hand for his bag. Montúfar stops where he can see ahead. You cannot see the far side of the gully he points to until the cloud moves.'
            - 'On 23 June 1802 Humboldt’s party climbed Chimborazo and turned back at a deep gully. This branch lets the group find a way to continue. A summit report counts only once everyone comes down.'
            - 'Send someone who can look after companions at altitude. Even with office gear available, ask each of the climbers whether they want to go on.'
          points:
            p1: 'Someone steps to the snow’s edge and comes back to tell Humboldt there is nowhere firm to stand. You have the party rest on secure ground until the others have looked at the terrain and everyone can decide whether to go on. Humboldt and Bonpland take turns carrying the instrument. Montúfar stays where he can see both on the way back. Only at the rock where they rested do they take out the half page written at the top.'
          outcomes:
            all: 'All the climbers reach the top and return to their resting place. The report gives the time they came down beside the entry from the summit.'
            p1: 'The group goes up by the way they found in this branch and returns in the order agreed before climbing.'
          none: 'The party sees the gully and turns back. Where the others are waiting, its records give the height actually reached and what they could see.'
          not_admitted: 'There was no place for the visitor when the party left. You receive an empty instrument case below.'
          excerpts:
            p1: 'Only at the rock where they rested do they take out the half page written at the top.'
        relic: "A barometer"
        relic_desc: "A mercury barometer with heights marked on the glass."
        points:
          p1: 'Before the deep gully blocks the way on 23 June, help the party hold out against the mountain sickness, find a way across, reach the summit of Chimborazo and come down safely'
        points_fail:
          p1: 'As in history they turn back at the gully, below the summit.'
        shift:
          p1:
            was: '23 June 1802: Humboldt, Bonpland and Carlos Montúfar climbed Chimborazo with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them and they turned back.'
            now: 'They crossed the gully, stood on the summit of Chimborazo, and came back down to camp safely.'
            who: humboldt_chimborazo
            bio: 'In this timeline Humboldt reached the summit of Chimborazo with Bonpland and Montúfar on 23 June 1802, and came down safely.'
        vignettes:
          turn: 'A fictional reader has drawn the summit at the end of the route. You ask where the diary stops describing the ascent. They move their last mark down the slope and leave the top untouched.'
          units: 'The reader wants to copy a height without its unit. You keep it attached to the original measurement and leave space for a separate modern conversion.'
          names: 'You ask the reader to leave space beside Humboldt for the other travellers'' names. When the note is folded, the list still follows the account of the day''s attempt.'
      zh:
        name: "雪线以上的那道深沟"
        place: "厄瓜多尔钦博拉索山"
        figure: "亚历山大·冯·洪堡"
        story: '1802 年 6 月 23 日，洪堡与埃梅·邦普兰、卡洛斯·蒙图法尔攀登钦博拉索山。挑夫不肯再往上走，三人流着鼻血、呕吐、头晕，继续向上，直到山顶以下一道深沟挡住去路，只得折返。'
        story_prose:
          opening:
            - '钦博拉索山的雪线上，邦普兰把气压计交给洪堡，腾出手来扶自己的包。蒙图法尔停在一块能看见前方的石上。他指的深沟，在云挪开以前看不到边。'
            - '1802 年 6 月 23 日，洪堡等人攀登钦博拉索，因深沟折返。这里的分支让一行人找到可以续行的路，从山顶下来才能带回结果。'
            - '找能在高处照应同伴的员工。用事务所道具相助时，仍让每个人自己说愿不愿继续。'
          points:
            p1: '前面有人踩到雪边就停了，下来告诉洪堡那里没有稳的落脚处。你让一行人先在能站稳的地方歇下，等另一组把可走的地形看明白，再商量要不要继续。洪堡和邦普兰交换着提仪器，回来时蒙图法尔走在能看见两人的地方。下到原先歇脚的石边，他们才取出在顶上写的那半页记录。'
          outcomes:
            all: '这一趟确实到了顶，也全员回到原先的歇脚处。报告在山顶记录旁另记了下来的时刻。'
            p1: '他们沿本趟找到的路上去，也照原先约好的次序回到山下。'
          none: '看到深沟，一行人折返。回到有同伴等着的地方，纸上只有他们实际到过的高度和所见。'
          not_admitted: '队伍出发时没留下带你同行的位置。你在下面接到一只空的仪器套。'
          excerpts:
            p1: '下到原先歇脚的石边，他们才取出在顶上写的那半页记录。'
        relic: "一支气压计"
        relic_desc: "一支装着水银的气压计，玻璃管上刻着高度。"
        points:
          p1: '6 月 23 日那道深沟挡住去路之前，帮一行人顶住高山病，找到越过去的路，登上钦博拉索山顶再平安下来'
        points_fail:
          p1: '他们照史实在那道深沟前折返，没有登顶。'
        shift:
          p1:
            was: '1802 年 6 月 23 日，洪堡、邦普兰和卡洛斯·蒙图法尔攀登钦博拉索山，一路流鼻血、呕吐、头晕，在山顶以下被一道深沟挡住，只得折返。'
            now: '他们越过那道深沟，站上了钦博拉索山顶，又平安回到营地。'
            who: humboldt_chimborazo
            bio: '这条时间线里，洪堡 1802 年 6 月 23 日与邦普兰、蒙图法尔一同登上钦博拉索山顶，平安下山。'
        vignettes:
          turn: '虚构读者把线路一路画上山顶。你问日记写到哪里就停止往上走了。他把最后一记往山坡下移，没再碰山顶。'
          units: '读者要只抄一个高度，把单位省掉。你请他把原单位和测数放在一起，另留一行给今天的换算。'
          names: '你请读者在洪堡旁留出地方，记下另外几名同行者。折起纸以后，名单仍跟着当天攀登的记录。'
text:
  en:
    name: "Alexander von Humboldt"
    text: "German naturalist and explorer, born 1769, died 1859. In 1802 he climbed Chimborazo in Ecuador to about 5,600 metres and recorded how height relates to vegetation and climate."
  zh:
    name: "亚历山大·冯·洪堡"
    text: "德国博物学家和探险家，1769 年生，1859 年去世。1802 年他在厄瓜多尔攀登钦博拉索山，到达约五千六百米，记录了高度、植被与气候的关系。"
