era_text:
  en:
    name: Chimborazo, 1802
    short: Chimborazo
    place_name: Chimborazo, Ecuador
    tags:
      - medical
      - altitude
      - expedition
      - c19
      - andes
      - history
    event_titles:
      expedition_handoff: 'The reading in its place'
      time_strain: Time slip
    plots:
      field_notes:
        name: Give Humboldt a field notebook
        desc: Lets him set down the height, the cold and the plants in a form others can check.
        character: Alexander von Humboldt
        article: people:humboldt_chimborazo
      germ_theory:
        name: Explain germ theory to Alexander von Humboldt
        desc: Needs the craft of microbiology, which this era does not have.
        character: Alexander von Humboldt
        article: people:humboldt_chimborazo
    blurb: A slow climb into thin air with instruments, cold and loose rock. Close, cheap, and the effect of rest and warmth is clear.
    handle_label: The plan for the climb is changed
    protagonist: Alexander von Humboldt
    protagonist_role: A naturalist who measures the mountain as he climbs and wants to know how everything fits together
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: In June 1802 Alexander von Humboldt, Aimé Bonpland and Carlos Montúfar climbed Chimborazo, then thought to be the highest mountain in the world.
          check: true
        - text: They measured the air, the temperature and the plants at each height as they went.
          check: true
        - text: They turned back below the summit, stopped by a deep cleft in the ridge.
          check: true
      regret:
        - You can save today's people but not the whole climb. On the main timeline the party turned back below the top.
        - Rest and warmth matter more than any one bold idea, but a plan only changes when someone is heard.
    events:
      expedition_handoff: '{date}: {staff} stays to have Inés read back the place beside the number. Fog covers the mark they had been using on the slope. The sheet carries their last confirmed location, and the next reading will have to wait.'
      expedition_send: '{date}: Diego is ready to go with the reading. {staff} adds the place on a loose slip while Inés keeps the original dry. They send the reading on time, with the place marked for the next person to check.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: 'Convince Humboldt'
      trust: 'Win the trust of the carriers'
      reform: 'Have the plan for the climb changed before the simulation baseline'
    milestones:
      approach: '{date}: The party moves toward Chimborazo on the day before the climb.'
      crevasse: '{date}: Humboldt, Bonpland and Carlos Montúfar climb Chimborazo and turn back below the summit.'
      first_treat: '{date}: {staff} gives the first cup of warm drink and leaf tea to a man with a splitting head. He starts to speak.'
      first_protect: '{date}: {staff} hands out the first blankets and a little oxygen, and teaches the carriers to use them.'
      met_humboldt: '{date}: {staff} is received by Humboldt.'
      humboldt_trusts: '{date}: Humboldt gives {staff} the notes to work from.'
      humboldt_convinced: '{date}: Humboldt takes up the plan that {staff} put to him.'
      board_moves: '{date}: Word goes round that the plan might change.'
      reform_history: '{date}: The simulated expedition sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The plan for the climb is changed {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: The carriers no longer keep {staff} out, and some ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of ailing men falls to one or none.'
    summary:
      near_death: '{staff} collapses at Chimborazo and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend at Chimborazo. The plan was changed {advance_days:1} days before the model’s baseline.'
      perfect: '{staff} completed the task at Chimborazo and came back safe. The simulation records {base_D:i} lost in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days at Chimborazo, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was keeping watch at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's people, not tomorrow's.
        - trait: curious
          text: So that is how it is, rest and warmth let a party go farther.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they listen is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Blankets were left over. The limit was the trust of the carriers, not the supplies.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
      ally_gap: Alexander von Humboldt's evidence is still thin. The handbook helps, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    name: 钦博拉索 1802
    short: 钦博拉索
    place_name: 厄瓜多尔钦博拉索
    tags:
      - medical
      - altitude
      - expedition
      - c19
      - andes
      - history
    event_titles:
      expedition_handoff: '把读数与地点一起交'
      time_strain: 时间错位
    plots:
      field_notes:
        name: 送洪堡一本野外记录本
        desc: 让他把高度、气温和植物记成别人能核对的样子。
        character: 亚历山大·冯·洪堡
        article: people:humboldt_chimborazo
      germ_theory:
        name: 把细菌致病的理论讲给亚历山大·冯·洪堡
        desc: 需要微生物学的工艺，这个时代还没有。
        character: 亚历山大·冯·洪堡
        article: people:humboldt_chimborazo
    blurb: 带着仪器慢慢爬进稀薄的空气，冷，碎石多。近，成本低，休息和保暖的效果很明显。
    handle_label: 攀登计划被改
    protagonist: 亚历山大·冯·洪堡
    protagonist_role: 一边攀登一边测量的博物学家，想弄清万物怎样连在一起
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: 1802 年 6 月亚历山大·冯·洪堡、艾梅·邦普朗与卡洛斯·蒙图法尔攀登钦博拉索，当时人们以为它是世界最高的山。
          check: true
        - text: 他们一路上在每个高度测量空气、气温和植物。
          check: true
        - text: 他们被山脊上一道深裂挡住，在山顶之下折返。
          check: true
      regret:
        - 你能救今天的人，救不了整次攀登。主时间线上这支队伍在山顶之下折返。
        - 休息和保暖比任何一个大胆的主意都重要，但计划只有在有人被听见时才会改。
    events:
      expedition_handoff: '{date}，{staff} 留下来，请伊内斯把数字旁的地点念一遍。雾把坡上用来辨认位置的记号吞没了。纸上只留最后核实的地点，下一次读数得等。'
      expedition_send: '{date}，迭戈已准备带走读数。{staff} 另写一签注明地点，伊内斯护住原纸。他们按时送走读数，也把地点留给接手人复核。'
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      convince: '说服洪堡'
      trust: '赢得挑夫的信任'
      reform: '让攀登计划比模型基准更早改变'
    milestones:
      approach: '{date}，攀登前一天，一行人向钦博拉索山进发。'
      crevasse: '{date}，洪堡、邦普朗与卡洛斯·蒙图法尔攀登钦博拉索，在山顶以下折返。'
      first_treat: '{date}：{staff} 给一个头痛欲裂的人喂下第一杯热饮和叶茶，他开始开口了。'
      first_protect: '{date}：{staff} 发下第一批毯子和一点氧气，教挑夫们使用。'
      met_humboldt: '{date}：{staff} 被洪堡接见。'
      humboldt_trusts: '{date}：洪堡把笔记交给 {staff} 用。'
      humboldt_convinced: '{date}：洪堡采纳了 {staff} 提出的办法。'
      board_moves: '{date}：消息传开，计划也许要改。'
      reform_history: '{date}，模拟中的队伍按模型基准日调整安排。'
      reform_early: '{date}：攀登计划比模型基准提前 {advance_days:1} 天改变。主时间线没有变化，只是这条分支。'
      trust_won: '{date}：挑夫们不再把 {staff} 挡在外面，有的还开口求助。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：生病的人数降到了一两个或没有。'
    summary:
      near_death: '{staff} 在钦博拉索倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在钦博拉索留下了传说。计划比模型基准提前 {advance_days:1} 天改变。'
      perfect: '{staff} 在钦博拉索完成了任务，平安回来。模拟基准损失 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒绝，最后带着一个笑话逃了回来。'
      modest: '{staff} 在钦博拉索待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人守着。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他们需要听到的话告诉了他们。
      perfect:
        - trait: kind
          text: 我能救今天的人，救不了明天的。
        - trait: curious
          text: 原来是这样，休息和保暖能让一支队伍走得更远。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，听不听由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 毯子剩下了。限制不是物资，是挑夫对你的信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
      ally_gap: 亚历山大·冯·洪堡的证据还很薄。手册能帮上忙，前提是员工花时间和他在一起。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

hook: {en: 'The summit is just above, and a gully lies across the way.', zh: '山顶就在上面，脚下横着一道深沟'}
facts:
  approach:
    date: '1802-06-22'
    stay_day: 7
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [humboldt_calpi_history, humboldt_diary_1802]
    text:
      en: 'The party moves toward Chimborazo on the day before the climb.'
      zh: '攀登前一天，一行人向钦博拉索山进发。'
  crevasse:
    date: '1802-06-23'
    stay_day: 8
    checked: two_sources
    level: usable
    use: [history, story, wiki]
    sources: [humboldt_dhm, humboldt_chimborazo_wikipedia, humboldt_diary_1802]
    text:
      en: 'Humboldt, Bonpland and Carlos Montúfar climb Chimborazo and turn back below the summit.'
      zh: '洪堡、邦普朗与卡洛斯·蒙图法尔攀登钦博拉索，在山顶以下折返。'
    line:
      en: '23 June 1802: below the summit of Chimborazo a deep gully stops the climbers, and they turn back.'
      zh: '1802 年 6 月 23 日，钦博拉索山顶以下，一道深沟挡住了攀登的人，他们折返。'
  sickness:
    date: '1802-06-23'
    stay_day: 8
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [humboldt_dhm]
    text:
      en: 'On the climb the porters would go no further; Humboldt, Bonpland and Montúfar went on suffering nosebleeds, vomiting and dizziness, which Humboldt later called mountain sickness.'
      zh: '攀登途中挑夫不肯再往上走；洪堡、邦普兰和蒙图法尔继续向上，流鼻血、呕吐、头晕，洪堡后来称之为高山病。'
    line:
      en: 'Higher up the porters stop; the three go on, with nosebleeds and dizziness.'
      zh: '再往上，挑夫停下了；三人继续走，流着鼻血，头晕得厉害。'
