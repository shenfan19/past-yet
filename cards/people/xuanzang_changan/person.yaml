    text:
      en:
        name: "Six hundred texts from the west"
        place: "Chang'an"
        figure: "Xuanzang"
        story: 'Xuanzang''s early biography places his return to the capital in 645 and lists 657 works carried in 520 bundles.'
        relic: "A palm leaf from a sutra"
        relic_desc: "A palm leaf written in Sanskrit, its edges gone dark."
        points:
          p1: 'When the scriptures and images he brought back are carried into the capital through the crowds, keep them safe all the way into Hongfu Monastery'
          p2: 'Heal the illness he brought back from the long road, so it no longer goes with him'
        points_fail:
          p1: 'The crowd pressed in and the bundles were scattered and trampled on the way, and they did not reach Hongfu Monastery as recorded. This branch came loose from history, and the office recalled the employee.'
          p2: 'The illness stayed with him as in history. In this branch nobody cured it after he came home.'
        shift:
          p1:
            was: 'In the first month of 645 the scriptures and images Xuanzang brought back were carried to Hongfu Monastery; the crowds were so thick that the officials, fearing people would trample one another, ordered everyone to burn incense and scatter flowers where they stood and not to move.'
          p2:
            was: 'In the second month of 645 Xuanzang met Emperor Taizong at Luoyang, and declined to go east with the court, saying he had come a long way and was also ill.'
            now: 'The illness left him that spring, and he sat down to the translation at Hongfu lighter in body.'
            who: xuanzang_changan
            bio: 'In this line Xuanzang was cured of the illness he brought back in 645, and began the translation at Hongfu in better health.'
        vignettes:
          totals: 'The clerk has carried the bundle total into the column for works. You point to the unit before they seal the new copy. The discrepancy disappears without a single bundle changing hands.'
          names: 'Two slips carry titles that look alike to you. The clerk reads them back and has you copy the distinguishing characters before the bundles are carried away.'
          space: 'You clear room for the clerk to lay out one bundle at a time. The person carrying the last stack can set it down without covering the checklist.'
      zh:
        name: "从西域带回的六百多部经"
        place: "长安"
        figure: "玄奘"
        story: '《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。'
        relic: "一片贝叶经"
        relic_desc: "一片写着梵文的贝叶，边缘已经发黑。"
        points:
          p1: '经像穿过人群送进长安时，护住它们一路完好地进到弘福寺'
          p2: '治好他远行带回来的疾疹，不让病跟着他'
        points_fail:
          p1: '人群挤上来，经夹在路上散落、被踩，没有照记载送进弘福寺，这条分支与历史脱了节，员工被送回。'
          p2: '疾疹照史实跟着他，这条分支里他回来以后没有人替他把病治好。'
        shift:
          p1:
            was: '贞观十九年正月，玄奘带回的经像送往弘福寺，围观的人太多，官府怕人群相互践踏，令各人原地烧香散花，不得走动。'
          p2:
            was: '贞观十九年二月，玄奘在洛阳见唐太宗，以远来兼有疾疹为由，推辞随驾东行。'
            now: '那年春天疾疹好了，他坐进弘福寺的译场时，身上轻了许多。'
            who: xuanzang_changan
            bio: 'IF 线里，玄奘在 645 年治好了远行带回的病，带着好些的身子在弘福寺开译。'
        vignettes:
          totals: '书吏把夹数抄进了部数那栏。封好新抄之前，你指明两个单位。没有一夹需要挪动，两份数却对上了。'
          names: '你看着两个签上的名目很像。书吏念给你听，趁经夹还没搬走，请你把不同的几个字另抄下来。'
          space: '你给书吏腾出地方，一次只摊开一夹。搬来最后一摞的人终于能搁下东西，不压住清单。'
text:
  en:
    name: "Xuanzang"
    text: "Buddhist monk of the Tang, born about 602, died 664. He travelled to India about 629, studied there for years, and returned to Chang'an in 645 with more than six hundred texts, which he then led the translation of, some seventy works in all."
  zh:
    name: "玄奘"
    text: "唐代僧人，约 602 年生，664 年去世。629 年前后西行求法，在印度学习多年，645 年带着六百多部佛经回到长安，其后主持译经，译出七十多部。"
