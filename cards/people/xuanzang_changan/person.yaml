    text:
      en:
        name: "Six hundred texts from the west"
        place: "Chang'an"
        figure: "Xuanzang"
        story: 'Xuanzang''s early biography places his return to the capital in 645 and lists 657 works carried in 520 bundles. The receiving-table scene is invented.'
        relic: "A palm leaf from a sutra"
        relic_desc: "A palm leaf written in Sanskrit, its edges gone dark."
        points:
          p1: 'Check two inventory numbers against their units'
          p2: 'Keep the piles in order through the handoff'
          p3: 'Help the clerk get room and paper to finish the list'
        vignettes:
          totals: 'The clerk has carried the bundle total into the column for works. You point to the unit before they seal the new copy. The discrepancy disappears without a single bundle changing hands.'
          names: 'Two slips carry titles that look alike to you. The clerk reads them back and has you copy the distinguishing characters before the bundles are carried away.'
          space: 'You clear room for the clerk to lay out one bundle at a time. The person carrying the last stack can set it down without covering the checklist.'
      zh:
        name: "从西域带回的六百多部经"
        place: "长安"
        figure: "玄奘"
        story: '《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。本卡的接收登记场景为虚构。'
        relic: "一片贝叶经"
        relic_desc: "一片写着梵文的贝叶，边缘已经发黑。"
        points:
          p1: '把两项数各自对回单位'
          p2: '交接时别让东西串了堆'
          p3: '给书吏腾出桌面和纸，写完清单'
        vignettes:
          totals: '书吏把夹数抄进了部数那栏。封好新抄之前，你指明两个单位。没有一夹需要挪动，两份数却对上了。'
          names: '你看着两个签上的名目很像。书吏念给你听，趁经夹还没搬走，请你把不同的几个字另抄下来。'
          space: '你给书吏腾出地方，一次只摊开一夹。搬来最后一摞的人终于能搁下东西，不压住清单。'
text:
  en:
    name: "Xuanzang"
    text: "Buddhist monk of the Tang, born about 602, died 664. He travelled to India about 629, studied there for years, and returned to Chang'an in 645 with more than six hundred texts, which he then led the translation of, some seventy works in all."
  zh:
    name: "玄奘"
    text: "唐代僧人，约 602 年生，664 年去世。629 年前后西行求法，在印度学习多年，645 年带着六百多部佛经回到长安，其后主持译经，译出七十多部。"
