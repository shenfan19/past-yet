events:
- xuanzang_changan
text:
  en:
    name: "Xuanzang"
    text: "Buddhist monk of the Tang, born about 602, died 664. He travelled to India about 629, studied there for years, and returned to Chang'an in 645 with more than six hundred texts, which he then led the translation of, some seventy works in all."
  zh:
    name: "玄奘"
    text: "唐代僧人，约 602 年生，664 年去世。629 年前后西行求法，在印度学习多年，645 年带着六百多部佛经回到长安，其后主持译经，译出七十多部。"
