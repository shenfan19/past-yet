    text:
      en:
        name: "Six hundred texts from the west"
        place: "Chang'an"
        figure: "Xuanzang"
        story: 'Xuanzang''s early biography places his return to the capital in 645 and lists 657 works carried in 520 bundles.'
        relic: "A palm leaf from a sutra"
        relic_desc: "A palm leaf written in Sanskrit, its edges gone dark."
        points:
          p1: 'After reaching Chang’an, hand over the returned manuscripts bundle by bundle and leave a receipt so work can begin at Hongfu Monastery'
          p2: 'Give the readers separate columns for original titles, fascicles and variant readings, with space for terms still undecided'
          p3: 'Leave incoming translators an index to the source manuscripts. Mark translated pages whose originals cannot yet be traced'
        points_fail:
          p1: 'After the transfer nobody can locate the first manuscripts needed. Work is put off, and the office recalls the employee.'
          p2: 'The list treats several provisional titles as settled. Collation later shows that one title was used for different fascicles.'
          p3: 'The team can keep copying translations, but only someone present that day knows which original is missing.'
        shift:
          p1:
            was: 'Early biographies date Xuanzang’s return with many manuscripts to 645. Tang accounts place his first translation work that year at Hongfu Monastery.'
          p2:
            was: 'Accounts of the Hongfu team describe different work performed by its members. Texts passed through collation and revision.'
            now: 'The first checklist keeps disputed entries open. At the next reading the team can find which words still need discussion.'
          p3:
            was: 'Xuanzang continued to translate for years, and the work moved between sites with changes in collaborators.'
            now: 'When the team moves, the source index goes with the copies. A later translator can find the fascicle and the passage to check.'
            who: xuanzang_changan
            bio: 'Several people translated the manuscripts Xuanzang brought to Chang’an. How the sources passed between them shaped what later readers could verify.'
        vignettes:
          totals: 'The clerk has carried the bundle total into the column for works. You point to the unit before they seal the new copy. The discrepancy disappears without a single bundle changing hands.'
          names: 'Two slips carry titles that look alike to you. The clerk reads them back and has you copy the distinguishing characters before the bundles are carried away.'
          space: 'You clear room for the clerk to lay out one bundle at a time. The person carrying the last stack can set it down without covering the checklist.'
      zh:
        name: "从西域带回的六百多部经"
        place: "长安"
        figure: "玄奘"
        story: '《大唐大慈恩寺三藏法师传》记玄奘于 645 年返京，并列出所携典籍共 520 夹、657 部。'
        relic: "一片贝叶经"
        relic_desc: "一片写着梵文的贝叶，边缘已经发黑。"
        points:
          p1: '入长安后把带回的书卷按包交接，先留可追查的纸单，护住弘福寺译场能按计划开工'
          p2: '给对读的人另开一栏记原题、卷数和异读，留出尚未商定的字词'
          p3: '让各组留下一份能交给后来译者的原卷索引，凡找不到原卷的译文暂注底本待查'
        points_fail:
          p1: '交接后有人寻不回第一批要用的原卷，译场开工中止，事务所因同步失败召回员工。'
          p2: '清单把尚须核对的几个题目抄成已定，后来有人发现同名处指的是不同卷。'
          p3: '译本可以继续抄，手边少了哪一卷却只能去问当天在场的人。'
        shift:
          p1:
            was: '早期传记记玄奘 645 年回到长安并带回大批书卷，唐代记载将这一年初译工作系于弘福寺。'
          p2:
            was: '传记与史料载弘福寺译场多人分任不同工作。原稿需要经过对读和修订。'
            now: '初次核对表仍留空栏。下一次对读时能指出哪一处是仍有分歧的译词。'
          p3:
            was: '玄奘之后仍长期从事翻译，工作地点与协作者随时间变动。'
            now: '译场换地点时，原卷索引随抄本一起交过去。后来的译者遇到不确定的词，可以先找到哪卷、哪一处待查。'
            who: xuanzang_changan
            bio: '玄奘从西行带回的书卷在长安由多人参与翻译。文本如何交接直接影响后来的人能核对到什么。'
        vignettes:
          totals: '书吏把夹数抄进了部数那栏。封好新抄之前，你指明两个单位。没有一夹需要挪动，两份数却对上了。'
          names: '你看着两个签上的名目很像。书吏念给你听，趁经夹还没搬走，请你把不同的几个字另抄下来。'
          space: '你给书吏腾出地方，一次只摊开一夹。搬来最后一摞的人终于能搁下东西，不压住清单。'
text:
  en:
    name: "Xuanzang"
    text: "Buddhist monk of the Tang, born about 602, died 664. He travelled to India about 629, studied there for years, and returned to Chang'an in 645 with more than six hundred texts, which he then led the translation of, some seventy works in all."
  zh:
    name: "玄奘"
    text: "唐代僧人，约 602 年生，664 年去世。629 年前后西行求法，在印度学习多年，645 年带着六百多部佛经回到长安，其后主持译经，译出七十多部。"
