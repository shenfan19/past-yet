    text:
      en:
        name: 'The road through the thorns'
        place: Ur, Mesopotamia
        figure: Enheduanna
        story: 'An inscribed disc from Ur names Enheduanna as a daughter of Sargon. In The Exaltation of Inana, the speaker calls herself Enheduanna and describes being driven from the temple. She compares her flight to that of a swallow and speaks of thorns and exhaustion. The date and route of the journey are uncertain.'
        story_prose:
          opening:
            - 'Outside Ur the stones are hard to see by dusk. Enheduanna stops by a thorn bush and lifts an empty water jar. Someone walking with her remembers a doorway farther along where they might sit.'
            - 'The disc inscription preserves Enheduanna’s name. A poem transmitted in later copies and traditionally attributed to her describes displacement and thorns in another land. This trip takes its setting from the poem and gives her a place to stop on the road.'
            - 'Send someone used to a long walk with water to share. At the first occupied house, ask whether she wants to wait there till morning.'
          points:
            p1: 'Her companion wants to save the water till the next yard. You ask Enheduanna if she wants to keep walking. She points with her empty jar to the wall nearest you. You give her water and ask the person at the door if she can sit there till dawn. For the first time in half a day, she sets a full jar down on level ground.'
          outcomes:
            all: 'She spends the night inside the low wall. The later poem still speaks of thorns. The trip has a separate record of the place she found before dark.'
            p1: 'The household makes room for Enheduanna by the door. Before leaving, she asks her companion to fill his jar as well.'
          none: 'No answer comes from beyond the wall before dark. The party has to keep walking.'
          not_admitted: 'The party recognises its own company and does not call you along. You have only time to set the water jar by the door.'
          excerpts:
            p1: 'For the first time in half a day, she sets a full jar down on level ground.'
        relic: 'A clay water cup'
        relic_desc: 'A small cup belonging to the fictional household by the road.'
        points:
          p1: 'After Enheduanna is driven from the temple, carry water and help her reach a place to rest'
        points_fail:
          p1: 'The place you hoped to stop is still too far. You run out of daylight before you can offer her a place to rest.'
        shift:
          p1:
            was: 'The speaker of The Exaltation of Inana describes being driven out of the temple, facing thorns and running out of strength.'
            now: 'In this branch {staff} walks with Enheduanna until they reach shelter and brings her water before dark.'
            who: enheduanna_ur
            bio: 'In this branch Enheduanna has company and finds somewhere to rest after leaving the temple.'
        vignettes:
          inscription: '{staff} checks what the household charges to refill a jar. The person at the door says they can drink first and discuss the rest after daylight.'
          support: '{staff} asks the companion to set down the jar before helping someone to the low wall. This time the jar stays upright.'
          edge: '{staff} checks whether the place beside the doorway is free. Someone inside moves a basket away from the bench.'
      zh:
        name: '穿过荆棘的山路'
        place: 美索不达米亚乌尔
        figure: 恩赫杜安娜
        story: '乌尔出土的一块圆盘刻有恩赫杜安娜的名字，也记载她是萨尔贡的女儿。《伊南娜颂》以恩赫杜安娜的口吻写到被逐出神庙，像燕子一样离开窗边，走过荆棘时力气已经耗尽。何时走的、走了哪条路，难以确定。'
        story_prose:
          opening:
            - '乌尔外的路一到傍晚，脚下石头就看不清了。恩赫杜安娜停在带刺的灌木边，把空水罐提起来看了看。同行的人还记得前面有一处能坐下的屋檐。'
            - '圆盘铭文留下了恩赫杜安娜的名字。后世抄存、传统上归于她的诗歌讲到被逐与异地的荆棘。这趟借诗中的情境设定离开乌尔后的行路，能做的是让她停一会儿。'
            - '派有走远路经验的人带上水壶。遇到第一个有人居住的地方，先问她愿不愿意在那儿等天亮。'
          points:
            p1: '同行人想把水留到下一处院子。你问恩赫杜安娜现在想往前还是停，她用空罐指了一下近处的矮墙。你把水递给她，同开门的人商量借坐到天明。走了半日，她第一次把装水的罐稳稳放到地上。'
          outcomes:
            all: '她在矮墙里歇过一夜。日后传下来的诗还写着荆棘，这趟记录多了在天黑前停下的一小段。'
            p1: '那户人把门边的位置让给恩赫杜安娜。出门前，她让同行人也把水罐添满。'
          none: '矮墙后的人没来得及答话，天已暗下去。路上的人只有继续往前走。'
          not_admitted: '同行人认得自己的队伍，没有叫你跟上。你只来得及把手里的水罐递到门边。'
          excerpts:
            p1: '走了半日，她第一次把装水的罐稳稳放到地上。'
        relic: '一只陶水杯'
        relic_desc: '路旁那户虚构人家的小杯。'
        points:
          p1: '恩赫杜安娜离开神庙后，带上水，陪她走到可以歇脚的地方'
        points_fail:
          p1: '能歇脚的地方还很远。天已经暗了，你没能替她找到一个停下来的地方。'
        shift:
          p1:
            was: '《伊南娜颂》中，自称恩赫杜安娜的叙述者写到被赶出神庙，走过荆棘时力气耗尽。'
            now: '这条分支里，{staff}陪恩赫杜安娜走到避风的地方，天黑以前给她递上一碗水。'
            who: enheduanna_ur
            bio: '这条分支里，恩赫杜安娜离开神庙后有人同行，也有一处地方歇脚。'
        vignettes:
          inscription: '{staff}问添一罐水要给多少。门边的人请他们先喝，其他事等天亮再说。'
          support: '{staff}请同行人先放下水罐，再扶人到矮墙边。水罐这次稳住了。'
          edge: '{staff}问门旁能不能坐，屋里有人把长凳上的篮子拿了下去。'
text:
  en:
    name: Enheduanna
    text: Daughter of Sargon of Akkad, who held high office at Ur around 2300 BC. Several early works in Sumerian are traditionally attributed to her; the attribution is debated, and the surviving copies are later.
  zh:
    name: 恩赫杜安娜
    text: 阿卡德王萨尔贡之女，公元前 2300 年前后在乌尔身居高位。几篇用苏美尔语写成的早期作品传统上归于她名下，作者归属学界有争论，存世抄本年代较晚。
hook: {en: 'Where can she rest before dark?', zh: '天黑前，哪里有地方歇脚？'}
