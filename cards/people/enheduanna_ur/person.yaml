    text:
      en:
        name: 'Turn over the disc'
        place: Ur, Mesopotamia
        figure: Enheduanna
        story: 'A calcite disc from Ur bears a ritual relief on one face and names Enheduanna on the other. Much later surviving copies of The Exaltation of Inana also name her in the voice of the poem. The attribution of the ancient poem is discussed, and your encounter with a workshop is fictional.'
        relic: A carved calcite disc
        relic_desc: A carved disc showing a priestess at an offering.
        points:
          p1: 'Record the inscription face separately from the relief face'
          p2: 'Ask the stoneworker to show which face carries the name'
          p3: 'Leave a drawing that lets a future copyist match the two faces'
        vignettes:
          inscription: 'You remember that the museum will catalogue both faces. The stoneworker has set the disc down with the inscription against the bench. You draw the relief while he works, then get a second drawing when he turns it over. You can take home two views. They do not say who first composed the hymn.'
          support: 'The stoneworker asks you to steady a pad beside the disc. With both hands on it you miss the first glimpse of the inscription. He leaves enough time for you to mark on your sketch which side you missed. The name itself will have to wait for another visit.'
          edge: 'The two sides fill the stoneworker’s account of the disc. On your sketch you also mark how thick the edge is, so you can tell which two drawings belong to the same object. You leave with one sketch and no copy of the hymn.'
      zh:
        name: '翻过圆盘再看'
        place: 美索不达米亚乌尔
        figure: 恩赫杜安娜
        story: '乌尔出土的方解石圆盘一面刻着仪式浮雕，另一面刻有恩赫杜安娜的名字。现存年代更晚的《伊南娜颂》抄本里，诗中人也自称恩赫杜安娜。诗作是否由她本人写成仍有讨论，卡里的作坊差事为分支演绎。'
        relic: 一块方解石圆盘
        relic_desc: 圆盘上刻着一位女祭司在献祭。
        points:
          p1: '把刻字面与浮雕面分开记录'
          p2: '请石工指出哪一面刻着名字'
          p3: '留一张让后来的抄写人认得正反两面的图'
        vignettes:
          inscription: '你记得后世博物馆会登记正反两面。石工把刻字一面朝下搁在木台上。你趁他干活先画下浮雕，翻面后又补了一张。两幅图都能带回去，最先写那首诗的人是谁，图上答不出来。'
          support: '石工请你扶稳圆盘旁的垫子。你腾不出手来，错过了刻字面刚翻起的时候。收工前，他留了点时间让你在草图上圈出漏看的那一面。上面的人名只能下趟再来核对。'
          edge: '石工记了圆盘的正反面。你又在草图上添了边缘的厚薄，好认出哪两幅画的是同一件东西。收队时手里有一张图，那首诗的抄本却没带回来。'
text:
  en:
    name: Enheduanna
    text: High priestess of the moon god at Ur, daughter of Sargon of Akkad, around 2300 BC. Several early works in Sumerian are traditionally attributed to her. The surviving manuscript copies are later.
  zh:
    name: 恩赫杜安娜
    text: 乌尔月神的大祭司，阿卡德萨尔贡之女，活跃于公元前 2300 年前后。几篇用苏美尔语写成的早期作品传统上归于她名下。存世抄本年代较晚。
hook: {en: 'A name on stone and in a hymn', zh: '圆盘背面刻了谁？'}
