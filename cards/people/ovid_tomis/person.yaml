    text:
      en:
        name: 'A poem and an empty line'
        place: "Tomis"
        figure: "Ovid"
        story: 'In Book II of Tristia, Ovid describes his offences as a poem and an error, and declines to explain the latter. The event year sets the visit during exile.'
        story_prose:
          opening:
            - 'Ovid is in exile at Tomis on the Black Sea. In the second book of the Tristia he says he was punished for a poem and an error. He does not say what the error was.'
            - 'In history, the third book preserves a poem about lying ill. In this branch there are days when even the water is hard for him to take, and he has yet to find a traveller to carry the pages out.'
            - 'This trip needs someone willing to look after a patient. It also needs someone who understands the crossing and can ask a traveller where the packet could be handed on.'
          points:
            p2: '{staff} finds a traveller familiar with the winter passage, asks where the packet can go to the next carrier, then has Ovid put the recipient’s name where it can be read. The traveller flattens the inner and outer wrapper separately. Before they cast off he turns the address over for the people on shore to check once more. Ovid nods across the side of the boat.'
            p1: '{staff} asks what food Ovid can still eat, finds a little of it nearby and leaves water by his bed. When Ovid reaches for a draft, {staff} moves the cup closer. He drinks first and takes the page a little later. The shadow of the cup across it shrinks to a small corner.'
          outcomes:
            all: 'The traveller with the pages has left the harbour. Someone changes the water by the bed once more, and Ovid takes out another sheet.'
            p2: 'At the shore the traveller tells Ovid exactly where the packet will go. Ovid listens to the last stop.'
            p1: 'There are a few stretches now when he can lie quietly. More water is always brought before his cup is empty.'
          none: 'The boats remain on the sheltered side of the harbour. The packet waiting for a traveller stays on the corner of the table.'
          not_admitted: '{staff} never meets anyone who can get them in. A leaf falls into the water left at the door.'
          desync: 'Nobody will carry the poems. When the agency calls {staff} back, the address still lies around the packet.'
          excerpts:
            p2: 'Before they cast off he turns the address over for the people on shore to check once more. Ovid nods across the side of the boat.'
            p1: 'He drinks first and takes the page a little later. The shadow of the cup across it shrinks to a small corner.'
        relic: "A wax writing tablet"
        relic_desc: "A tablet of letters in verse begun on the road to exile."
        points:
          p1: 'Nurse Ovid through the illness he falls into at Tomis, with no doctor, no fit food and water he cannot drink'
          p2: 'When winter travel from Tomis is difficult, secure a place for the third book of the Tristia with a carrier going to Rome'
        points_fail:
          p1: 'He lies ill with no one to ease him, and in this branch the first months at Tomis are as hard as he wrote them.'
          p2: 'No carrier takes the packet on the journey in this branch. It does not reach Rome in time, and the office recalls the employee.'
        shift:
          p1:
            was: 'Around AD 9 Ovid fell ill at Tomis; in Tristia III.3 he wrote that there was no doctor, no fit food, and water he could not get used to.'
            now: '{staff} finds him clean water and food he can keep down, and sits with him through the fever. He is on his feet again sooner.'
          p2:
            was: 'Around AD 9 to 10, Ovid wrote the third book of the Tristia in exile. It opens with the book arriving in Rome and describes the difficulty of winter travel in the region.'
        vignettes:
          rumor: 'You tell the carrier that readers centuries from now will still ask what the error was. He points to an open place on the spare sheet and asks what he should put there. You add the destination on the wrapper and leave the space in the copy. The packet leaves with its uncertainty intact.'
          verify: 'The carrier remembers a version with an extra name. You ask to see which sheet it came from. He can point to the poem and the error, and the passage ends there. You mark that line on your own wax tablet. You still have no name when the packet goes.'
          wrap: 'Wind lifts the outer sheet just as the carrier reaches for the packet. You number the loose sheets and put them back in order. Your wax tablet holds one reminder: leave the unexplained line as it stands. You miss what the recipient makes of it.'
      zh:
        name: '诗与空着的一行'
        place: "托米"
        figure: "奥维德"
        story: '奥维德在《哀歌》第二卷把获罪的缘由写成一首诗和一个过失，接着避谈那个过失。'
        story_prose:
          opening:
            - '奥维德在黑海边的托米斯流放。《哀歌》第二卷说他因一首诗和一个过失获罪，没有把那个过失写出来。'
            - '史实里，第三卷留有他卧病时写的一首诗，作品后来流传下来。在这条分支里，有几天他连水都喝不惯，整理好的稿件还找不到能往外捎的船。'
            - '这趟需要愿意照看病人的人，也需要认得海路、肯和出行的人问清能把纸件带到哪里的人。'
          points:
            p2: '{staff}约到一个熟悉冬季行程的船客，先问他离开托米斯以后会在哪一站交给下一位，再请奥维德把名字写在能看见的地方。船客把里外两层包纸分别压平。 开船以前，他把写着地址的一面翻出来，让岸上的人再看一次。奥维德隔着船帮点了点头。'
            p1: '{staff}问他什么样的饭还吃得下，向邻里找来一小份，又把可以喝的水放在床旁。奥维德想伸手拿稿子时，{staff}把杯往他手边推了一下。 他先喝水，过了一会儿才把那一页拿过来。横过纸角的杯影缩成很小一片。'
          outcomes:
            all: '载稿的人已经出了港。屋里的人把床边的水换过一次，奥维德又拿出一张空纸来。'
            p2: '船客带着诗卷离开前，到岸边把去向说了一遍。奥维德一直听到最后一站。'
            p1: '一天里他有了几段可以安静躺着的时候。床边能喝的水始终没断。'
          none: '船只停在背风的一边，等不到出港的消息。托人带的纸还放在桌角。'
          not_admitted: '{staff}没遇上能带他进屋的人。门边那碗水放了很久，沿口落进一片叶子。'
          desync: '诗没人肯带走。事务所召回{staff}时，写好去处的纸仍包在外层。'
          excerpts:
            p2: '开船以前，他把写着地址的一面翻出来，让岸上的人再看一次。奥维德隔着船帮点了点头。'
            p1: '他先喝水，过了一会儿才把那一页拿过来。横过纸角的杯影缩成很小一片。'
        relic: "一块写字蜡板"
        relic_desc: "一块板，上面是流放路上起笔的诗体书信。"
        points:
          p1: '奥维德在托米斯病倒，没有医生、没有合用的吃食、水喝不惯，照看他把病养好'
          p2: '托米斯冬季难以通行时，为《哀歌》第三卷找到能把它捎去罗马的人'
        points_fail:
          p1: '他病中无人照看，这条分支里他在托米斯的头几个月和他诗里写的一样难熬。'
          p2: '这条分支里，没人把诗卷带上路，诗卷没有及时到达罗马。行程同步失败，事务所召回员工。'
        shift:
          p1:
            was: '公元 9 年前后，奥维德在托米斯病倒，他在《哀歌》第三卷第三首里写，这里没有医生，没有合用的吃食，水也喝不惯。'
            now: '{staff}给他找来干净的水和吃得下的东西，在他发热的日子里守着。他比原来早些下了床。'
          p2:
            was: '公元 9 至 10 年前后，奥维德在流放中写下《哀歌》第三卷。开篇从书到达罗马写起，卷中也写到当地冬季行路困难。'
        vignettes:
          rumor: '你告诉捎信人，几个世纪以后还有人追问那个过失。他指指抄本空出来的地方，问该写些什么。你把目的地添在封套上，把空处留在正文里。人带着这份说不清的稿子走了。'
          verify: '捎信人记得一个多了人名的版本。你请他指出是哪张纸上的。他能指出那首诗和那个过失，往后便指不出什么了。你在自己的蜡板上记下断在这里。抄本启程时，你仍然没得到那个名字。'
          wrap: '捎信人伸手时，风掀起外面一页。你给散页编上号，照原样收好。蜡板上只给自己留了一句提醒，那行没解释的照原样抄。收信人读到这里是什么反应，你没能看见。'
text:
  en:
    name: Ovid
    text: Roman poet, 43 BC to about AD 17. He wrote the Metamorphoses and love poetry. In AD 8 the emperor Augustus banished him to Tomis on the Black Sea, where he died.
  zh:
    name: 奥维德
    text: 罗马诗人，公元前 43 年生，约公元 17 年去世。他写了《变形记》和爱情诗。公元 8 年，奥古斯都皇帝把他流放到黑海边的托米斯，他死在那里。
hook: {en: 'What did Ovid leave unnamed?', zh: '哪一行他没写？'}
