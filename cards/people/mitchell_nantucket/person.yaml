        story: "Maria Mitchell sweeps the sky with a telescope from the roof of her home at night, and in the sea wind finds a new comet."
        relic: "A small telescope"
        relic_desc: "A small brass telescope with a trace of sea salt on the tube."
        points:
          p1: "Recognise the comet by the rooftop telescope"
          p2: "Sweep the sky all night"
          p3: "Be the neighbour she consults"
      zh:
