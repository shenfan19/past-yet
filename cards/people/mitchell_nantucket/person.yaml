    text:
      en:
        who: 'William Mitchell'
        quote: 'Maria discovered a telescopic comet at half-past ten on the evening of the first instant'
        occasion: 'Her father reports the discovery to William C. Bond from Nantucket.'
      zh:
        who: '威廉·米切尔'
        quote: '玛丽亚在本月一日晚上十点半发现了一颗望远镜彗星。'
        occasion: '她父亲从楠塔基特向威廉·C. 邦德报告所见。'
      zh-Hant:
        who: '威廉·米切爾'
        quote: '瑪麗亞在本月一日晚上十點半發現了一顆望遠鏡彗星。'
        occasion: '她父親從楠塔基特向威廉·C. 邦德報告所見。'
      fr:
        who: 'William Mitchell'
        quote: 'Maria a découvert une comète télescopique à dix heures et demie le soir du premier instant'
        occasion: 'Son père rapporte la découverte à William C. Bond de Nantucket.'
      es:
        who: 'William Mitchell'
        quote: 'María descubrió un cometa telescópico a las diez y media de la tarde del primer instante.'
        occasion: 'Su padre informa del descubrimiento a William C. Bond de Nantucket.'
      ja:
