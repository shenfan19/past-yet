    text:
      en:
        name: 'Mark the field before the cloud'
        place: "Nantucket"
        figure: "Maria Mitchell"
        story: 'A letter reproduced in Maria Mitchell: Life, Letters, and Journals reports that Mitchell discovered a telescopic comet at Nantucket on 1 October 1847. Her father noted the discovery and wrote to the Harvard observatory’s director by the first mail to the mainland.'
        story_prose:
          opening:
            - 'A gust crosses the Nantucket rooftop. Maria Mitchell slides her notes under the lamp to hold them still. She means to record where the object was and at what hour. Her father waits a floor below to hear the figures. Weather is keeping the mail boat in.'
            - 'Mitchell found a comet on 1 October 1847. Her father wrote to William Bond in Cambridge. The Danish medal was awarded later after correspondence about the claim. Here you can get the first notice on the outgoing mail and send a second to the recipient designated for the prize.'
            - 'Someone who reads sky charts or checks times can help with the notice. Use someone familiar with post to arrange the two addresses.'
          points:
            p1: 'Maria reads the hour and her father asks which bright star she used as a guide. You read the position back to him and find that the notice for Bond still lacks the date. The ink is barely dry when a voice at the wharf calls for the mail. The date is legible by the time the postman puts the first letter in his sack.'
            p2: 'The second page has the same observing hour. The envelope needs a different address. You read the rules aloud, and the postman makes a separate entry for the recipient they name. Maria waits for him to finish before putting away her observations. Two letters leave the island, and only one will cross the Atlantic.'
          outcomes:
            all: 'The Danish recipient gets a notice that follows the published procedure. When the award is considered, Mitchell can produce the dated dispatch record in place of the later appeal.'
            p1: 'Cambridge receives the notice carried by the first mail. The medal will still require correspondence of its own.'
            p2: 'The second address has been checked. The first post to Cambridge has gone wrong and the branch cannot be kept intact.'
          none: 'The rooftop notes stay in the house. The unmailed notice gives the award committee nothing to date.'
          not_admitted: 'The family asks from downstairs who has come. The notes remain on the roof while you hear the postman pass in the street.'
          desync: 'Bond’s letter misses the first mail. The office recalls the traveller when the trip falls out of sync; the original observations are still in the house.'
          excerpts:
            p1: 'The date is legible by the time the postman puts the first letter in his sack.'
            p2: 'Two letters leave the island, and only one will cross the Atlantic.'
        relic: "A small telescope"
        relic_desc: "A small brass telescope with a trace of sea salt on the tube."
        points:
          p1: 'Get the family’s dated notice ready for the first mail to the Cambridge observatory'
          p2: 'Send a second notice to the designated Danish recipient on the first boat and spare Mitchell the later medal appeal'
        points_fail:
          p1: 'The observations remain in the family’s journal, but the notice misses the first mail. The office recalls the employee after a loss of sync.'
          p2: 'Only the observatory gets the notice. The judges cannot grant the medal under the usual rules because the designated recipient was not notified.'
        shift:
          p1:
            was: 'On 3 October 1847 Mitchell''s father wrote to the Cambridge observatory about the discovery on the 1st. His letter left on the first mail after the sighting.'
          p2:
            was: 'In 1848 correspondence about the prize records that the required immediate notice did not reach the designated recipients. Mitchell later received the medal after her claim was taken up with the Danish government.'
            now: '{staff} checks the rules and helps the family put another notice on the same boat. The judges can consider the claim under the usual rules because the notice arrived through the proper channel.'
            who: mitchell_nantucket
            bio: 'Mitchell received recognition on the strength of a timely report. She began recording when she saw an object, when she sent the notice, and who received it.'
        vignettes:
          field: 'The helper has drawn the faint spot by itself. You ask what he would use to point the instrument back to it. He adds two stars and a direction before the cloud comes over. You copy those marks. You still do not have a later position to compare.'
          post: 'You know word will have to travel off the island. The helper wants to record a discovery before he has described what was seen. You put the date and the field on a separate slip and leave the next line for verification. It remains blank when the packet goes down to the shore.'
          cloud: 'You wait with the drawing in hand while cloud covers the faint mark. Before folding it you circle a star you expect to find even if the faint object is gone. You bring back a position that can be sought again. No one sees it a second time before your return.'
      zh:
        name: '云过来以前，先标下这块天'
        place: "楠塔基特"
        figure: "玛丽亚·米切尔"
        story: '《玛丽亚·米切尔生平、书信与日记》所录的书信记载，她在 1847 年 10 月 1 日于楠塔基特发现一颗需用望远镜观测的彗星。父亲记下发现，并托首班去大陆的邮船寄信给哈佛天文台主任。'
        story_prose:
          opening:
            - '楠塔基特的屋顶上有一阵风，玛丽亚·米切尔把便笺压到灯座下面。她要记下看见天体的方位和时刻。父亲在下层等着听她读一遍；风雨还拦着邮船。'
            - '1847 年 10 月 1 日，米切尔发现一颗彗星。她父亲给剑桥的威廉·邦德写信，发现后来经交涉获颁丹麦金牌。这里可以先确保通知搭上首班离岛邮件，再写一份给丹麦方面指定的人。'
            - '能认读星图或读准时刻的人可帮忙核通知，熟悉邮务的人可办两处收件地址。'
          points:
            p1: '玛丽亚念出时刻，父亲问一遍是沿哪颗亮星找上去的。你把指示重读给他听，发现写给邦德的通知还少了日期。墨刚干，码头那边就传来准备装船的声音。邮差把第一封信塞进袋里时，日期已经能读清。'
            p2: '第二张纸上有同样的观测时刻，信封却不能照抄头一份。你把公告所列的收件人读给邮差听，让他给这封信另记一条去向。玛丽亚在边上等他写完，才收起她那份观测。两封都出了岛，只有一封要过大西洋。'
          outcomes:
            all: '丹麦收件人收到按例填写的发现通报。到评奖时，米切尔拿得出首次寄送的记录，不必另请人补陈经过。'
            p1: '剑桥收到首班邮船带来的发现通知。关于金牌的通信还要另起一轮。'
            p2: '另一个收件地址已经核对。通向剑桥的首班邮件出了差错，这个分支无法完整保留。'
          none: '屋顶的便笺仍在家中。法律和奖励都不会随着一条未寄的观测自己改变。'
          not_admitted: '家人从楼下问来客是谁。便笺留在屋顶，你只能听见邮差从街上走过去。'
          desync: '码头那封给邦德的通知没赶上首班邮件。事务所按脱节召回，屋里的原始观测还在。'
          excerpts:
            p1: '邮差把第一封信塞进袋里时，日期已经能读清。'
            p2: '两封都出了岛，只有一封要过大西洋。'
        relic: "一架小望远镜"
        relic_desc: "一架小小的黄铜望远镜，镜筒上有海盐的痕迹。"
        points:
          p1: '把家人写好日期的发现通知备齐，赶上首班送往剑桥天文台的离岛邮件'
          p2: '赶在第一班邮船开走前，再寄一份给丹麦方面指定的收件人，免去米切尔后来为金牌补申'
        points_fail:
          p1: '观测记录仍在家中，但通知没赶上首班邮船。这条分支与史实脱节，员工被召回。'
          p2: '通知只寄给天文台，评奖人因未按要求及时通报而不能按例授奖。'
        shift:
          p1:
            was: '1847 年 10 月 3 日，米切尔的父亲写信把 1 日的发现告知剑桥天文台，信随发现后首班离岛邮件寄出。'
          p2:
            was: '1848 年的奖项通信记载，发现消息没有按规定立即报给指定收件人。丹麦方面另行审理后，米切尔获得金牌。'
            now: '{staff}查清通知应送何处，帮家人把另一个写好地址的信封赶上同一班船。评奖人已有在期限内通报的记录，可以按例审理。'
            who: mitchell_nantucket
            bio: '米切尔凭按期送到的发现报告获得认可。她开始在自己的记录里同时保留观测日、发件日和收件人。'
        vignettes:
          field: '帮工只画了一个淡点。你问他下次靠什么把镜头转回这里。云遮上来前，他补了两颗星和一个方向。你把这些抄走，还没有第二次位置可以对照。'
          post: '你知道消息得送出海岛。帮工还没写清看见的东西，就想把发现先记上去。你把日期和星野另写一张，留下一行等复核。纸包送去岸边时，那一行仍空着。'
          cloud: '云挡住淡点时，你在原地拿着草图等。折纸前你圈一颗熟星，即使淡点不见了，也能从它找回这片天。你带回一个可以再找的位置，收队前仍没人看见第二次。'
text:
  en:
    name: "Maria Mitchell"
    text: "American astronomer, born 1818, died 1889. She discovered a comet in 1847 and later became one of the first women to teach astronomy as a professor in the United States."
  zh:
    name: "玛丽亚·米切尔"
    text: "美国天文学家，1818 年生，1889 年去世。1847 年发现一颗彗星，后来在美国担任天文学教授。"
hook: {en: 'How do you find the same patch of sky twice?', zh: '第二次抬起望远镜，怎样找回同一块天？'}
