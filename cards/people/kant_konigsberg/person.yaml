  preface:
    date: '1781'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [kant_konigsberg_preface]
    text:
      en: 'Kant introduces the inquiry with problems reason can neither dismiss nor answer, and discusses the limits of experience.'
      zh: '康德从理性既无法回避又无法回答的问题引出全书，并谈及经验的界限。'
  second:
    date: '1787'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [kant_konigsberg_second]
    text:
      en: 'The revised preface belongs to the 1787 edition and closes with a date and place, Königsberg, April 1787.'
      zh: '修改后的序言属于1787年版，末尾署柯尼斯堡、1787年4月。'
