    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hipparchus_rhodes_commentary, hipparchus_rhodes_manitius]
    text:
      en: 'Late second century BC: Hipparchus’s commentary pointed out that some stars described together in the familiar poem did not rise together.'
      zh: '约公元前二世纪末，喜帕恰斯在评注中指出，常读的观星诗里有些并写的星并不同时升起。'
    line:
      en: 'Late second century BC: Hipparchus’s commentary pointed out that some stars described together in the familiar poem did not rise together.'
      zh: '约公元前二世纪末，喜帕恰斯在评注中指出，常读的观星诗里有些并写的星并不同时升起。'
      zh-Hant: '約公元前二世紀末，喜帕恰斯在評注中指出，常讀的觀星詩裡有些並寫的星並不同時升起。'
      fr: "Fin du IIe siècle avant JC\_: le commentaire d’Hipparque souligne que certaines étoiles décrites ensemble dans le poème familier ne se sont pas levées ensemble."
      es: 'Finales del siglo II a. C.: el comentario de Hiparco señaló que algunas estrellas descritas juntas en el conocido poema no surgieron juntas.'
      ja: '紀元前 2 世紀後半: ヒッパルコスの注釈は、よく知られた詩の中で一緒に描写されているいくつかの星は一緒に昇っていないことを指摘しました。'
      ko: '기원전 2세기 후반: 히파르코스의 주석에서는 친숙한 시에 함께 묘사된 일부 별들이 함께 떠오르지 않았다는 점을 지적했습니다.'
      ru: 'Конец второго века до нашей эры: в комментарии Гиппарха указывалось, что некоторые звезды, описанные вместе в знакомой поэме, не восходили вместе.'
  palimpsest:
    date: '-130'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [hipparchus_rhodes_palimpsest]
    text:
      en: 'The study transcribes a passage on the boundaries of Corona Borealis from the erased writing and argues for attribution to Hipparchus.'
      zh: '研究转录了被擦去的北冕座界限，并提出归于喜帕恰斯的解释。'
  debate:
    date: '-130'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [hipparchus_rhodes_debate]
    text:
      en: 'A later astronomical analysis questions the proposed attribution.'
      zh: '后续天文数据分析质疑该归属。'
