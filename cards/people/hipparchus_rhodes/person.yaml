text:
  en:
    name: Hipparchus
    text: Greek astronomer, about 190 BC to about 120 BC, who observed from Rhodes. He compiled a star catalogue, discovered the precession of the equinoxes and developed trigonometry for astronomy.
  zh:
    name: 喜帕恰斯
    text: 希腊天文学家，约公元前 190 年生，约公元前 120 年去世，在罗得岛观测。他编制星表，发现岁差，并为天文学发展了三角学。
