    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"persuade","day":8,"req":{"any":[{"job":["university_lecturer","translator","archivist"],"stat":{"wit":7}},{"trait":["curious","methodical","scholarly"],"stat":{"wit":7,"will":5}}]}}
    text:
      en:
        name: 'One night to check the poem'
        place: 'Rhodes'
        figure: 'Hipparchus'
        story: 'Hipparchus’s surviving commentary identifies errors in a widely read poem about the sky. In this branch a reader is about to use the poem to tell others which stars rise together.'
        story_prose:
          opening:
            - 'Rhodes, late in the second century BC. People use a poem to remember which stars rise together. In the commentary that survives, Hipparchus checks claims like these one by one.'
            - 'In history, the commentary shows where familiar lines did not match what could be seen. In this branch a reader has already taught one of those lines and means to teach it the same way again.'
            - 'Someone who can follow the book’s claims is useful. It will also take someone who can persuade a reader who has already taught the lesson to wait outside a little longer.'
          points:
            p1: '{staff} asks the reader to say the line he means to teach, then goes with him and Hipparchus where they can see low on the horizon. When the first star shows, the reader starts to say there they both are. He stops halfway. The other place is still dark. He keeps a finger pointing at it and lowers his hand only when the second star comes up.'
          outcomes:
            all: 'The next time he teaches, he closes the book first and asks the pupils to wait for the first rising. He leaves the second half of the familiar line until the other light appears.'
            p1: 'The next time he teaches, he closes the book first and asks the pupils to wait for the first rising. He leaves the second half of the familiar line until the other light appears.'
          none: 'The reader recites the old line as before. The door has already closed when the second star comes into view low outside.'
          not_admitted: '{staff} never sees the reader. Through a closed door someone recites a line twice.'
          excerpts:
            p1: 'The other place is still dark. He keeps a finger pointing at it and lowers his hand only when the second star comes up.'
        relic: 'Two marks at the horizon'
        relic_desc: 'An imagined observing strip with places for two separate risings.'
        points:
          p1: 'Persuade the reader to observe for one night with Hipparchus before teaching the disputed rising'
        points_fail:
          p1: 'The employee did not persuade the reader to check the poem against the sky that night.'
        shift:
          p1:
            was: 'Late second century BC: Hipparchus’s commentary pointed out that some stars described together in the familiar poem did not rise together.'
            now: '{staff} brings the reader back for a night of observation. The reader watches the two risings separately and changes the instruction they give their own pupils.'
            who: hipparchus_rhodes
            bio: 'A reader using the old poem tested one disputed rising and passed on a corrected account.'
      zh:
        name: '今夜亲眼再看一次'
        place: '罗得岛'
        figure: '喜帕恰斯'
        story: '喜帕恰斯留下的评注指出，一首流传很广的观星诗里有失准之处。在这条分支里，一位读者准备照诗里写的星位教给别人。'
        story_prose:
          opening:
            - '约公元前二世纪末，罗得岛。观星的人读诗，也靠它记哪几颗星会一道升起。喜帕恰斯后来留下的评注逐处核这类说法。'
            - '史实里，评注指出熟读的诗句有些与观察不合。在这条分支里，一位读者已经把其中一句教给学生，准备照原话再讲一次。'
            - '这趟用得上能明白书里说法的人。还得说得动一个已经讲过这堂课的人，再到外面多等一会儿。'
          points:
            p1: '{staff}请那位读者把准备教的一句读一遍，再陪他和喜帕恰斯走到能看清低处的地方。第一处星光露出时，读者抬手想说就是这两颗，话到一半停了。另一个位置还是黑的。他用指头空指着那里，等到第二颗出来才把手放下。'
          outcomes:
            all: '下次教学生，他先把书合上，请大家等第一颗升起来。念到那句熟诗时，他把后半句留到下一道光出现。'
            p1: '下次教学生，他先把书合上，请大家等第一颗升起来。念到那句熟诗时，他把后半句留到下一道光出现。'
          none: '那人照旧读完了那句诗。屋门已经合上，第二颗星才从外面低处露出。'
          not_admitted: '{staff}没能见到那位读者，只听见有人隔门背诵一句，念了两遍。'
          excerpts:
            p1: '另一个位置还是黑的。他用指头空指着那里，等到第二颗出来才把手放下。'
        relic: '地平线上的两道刻记'
        relic_desc: '分支里的观测纸条，两道刻记分别记下两次升起。'
        points:
          p1: '说服那位读者和喜帕恰斯同看一夜，再决定怎么教那两处星位'
        points_fail:
          p1: '员工没能说服那位读者留下来对照一夜。'
        shift:
          p1:
            was: '约公元前二世纪末，喜帕恰斯在评注中指出，常读的观星诗里有些并写的星并不同时升起。'
            now: '{staff}请那位读者重新来观测一夜。读者分开看到两次升起，改了原本要教给学生的说法。'
            who: hipparchus_rhodes
            bio: '一位用旧诗教观星的读者亲自复核了有争议的星位，把修正后的观察教给学生。'
text:
  en:
    name: Hipparchus
    text: Greek astronomer, about 190 BC to about 120 BC, who observed from Rhodes. He compiled a star catalogue, discovered the precession of the equinoxes and developed trigonometry for astronomy.
  zh:
    name: 喜帕恰斯
    text: 希腊天文学家，约公元前 190 年生，约公元前 120 年去世，在罗得岛观测。他编制星表，发现岁差，并为天文学发展了三角学。
hook: {en: 'One night to check the poem', zh: '今夜亲眼再看一次'}
