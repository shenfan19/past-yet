text:
  en:
    name: Richard Dedekind
    text: German mathematician, 1831 to 1916, who studied at Göttingen and was a friend of Bernhard Riemann. He wrote the account of the last weeks of Riemann at Selasca in 1866, and took part in editing the collected works of Riemann, published in 1876.
  zh:
    name: 理查德·戴德金
    text: 德国数学家，1831 年生，1916 年去世，在哥廷根求学，是伯恩哈德·黎曼的朋友。1866 年黎曼在塞拉斯卡最后几周的情形，是他记下来的；1876 年出版的黎曼全集，他参与了编订。
