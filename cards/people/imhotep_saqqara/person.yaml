    text:
      en:
        name: 'The working edge'
        place: Saqqara, Egypt
        figure: Imhotep
        story: 'A statue base from Djoser’s complex at Saqqara bears Imhotep’s name and titles. Museums credit him with designing the Step Pyramid.'
        relic: 'A joining-edge rubbing'
        relic_desc: 'A fictional rubbing from the practice bench.'
        points:
          p1: 'Support the practice block while the mason tries the edge'
          p2: 'Stay at the bench until both surfaces can be checked'
          p3: 'Find the part of the joint that catches before the pieces are moved'
        vignettes:
          rock: 'Mut sees a flat face and reaches for the next block. You ask her to rock this one gently on the bench first. One corner taps the wood while the other stays clear. She marks the high spot so the person on the next shift can find it under a different light.'
          turn: 'Hori can carry the two pieces away or keep the heavier one in place until Mut checks it. You hold the lighter block while he waits. Mut marks the mating edge on both faces. When the pieces are taken away, the marks go with them.'
          name: 'You know which name later viewers will look for on the statue base. Hori wants to know which of the two trial blocks belongs with the one in his hands. You show him the matching mark. The statue and its inscription are still beyond the corner of the workshop you can visit.'
      zh:
        name: '试过的那条边'
        place: 埃及萨卡拉
        figure: 伊姆霍特普
        story: '萨卡拉左塞尔建筑群出土的雕像底座刻有伊姆霍特普的姓名和头衔。博物馆将阶梯金字塔的设计归于他。'
        relic: '一张接边记号拓片'
        relic_desc: '工台上的接边记号拓片。'
        points:
          p1: '石工试接边时扶稳练习石'
          p2: '留在台边，等两面都查过再走'
          p3: '搬石块前找出接缝卡在哪儿'
        vignettes:
          rock: '穆特见石面平整，就要去拿下一块。你请她先在台面轻轻摇一下这块。一角敲着木面，另一角没沾上。她在高点做记号，换个人、换个光线也找得着。'
          turn: '霍里可以现在搬走两块练习石，也可以留着沉的那块，等穆特来查。你扶住轻的那块，陪他等。穆特在两块石头相接的面上各做记号。石头搬走时，记号也跟着带走。'
          name: '你知道后世看雕像底座时会找谁的名字。霍里只想知道哪块试石该跟手里这块配。你指给他看那个能对上的记号。造像和刻字的地方，还在你这趟能走到的工坊外。'
text:
  en:
    name: Imhotep
    text: Official and architect of the Third Dynasty of Egypt, around 2650 BC. He is credited with the step pyramid of King Djoser at Saqqara, among the first large stone buildings, and was later honoured as a god of medicine.
  zh:
    name: 伊姆霍特普
    text: 古埃及第三王朝的官员与建筑师，活跃于公元前 2650 年前后。相传他设计了萨卡拉的左塞尔阶梯金字塔，这是最早的大型石构建筑之一，后来他被奉为医药之神。
