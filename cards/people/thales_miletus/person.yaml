          p1: "看他怎样量金字塔的影长"
          p2: "不借神明地把道理讲给港口的人"
          p3: "等到一个晴朗的时辰"
text:
  en:
    name: Thales
    text: Greek thinker of Miletus, about 624 BC to about 546 BC. He is regarded as the first to seek natural explanations for the world, held that all things come from water, and is said to have predicted the solar eclipse of 585 BC.
  zh:
    name: 泰勒斯
    text: 米利都的希腊思想家，约公元前 624 年生，约公元前 546 年去世。他被看作最早为世界寻求自然解释的人，主张万物来自水，传说曾预言公元前 585 年的日食。
