    invented: true
    text: {en: 'A fictional recorder who wants his two columns filled before the boat leaves.', zh: '虚构记事人赫格西亚斯，想在出船前填齐两格。'}
  melitta:
    invented: true
    text: {en: 'A fictional boat owner who has to agree the return hour with her crew.', zh: '虚构船主墨利塔，得与船员约定返港时辰。'}
