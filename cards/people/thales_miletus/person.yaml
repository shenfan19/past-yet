        name: Explaining nature without gods
        place: Miletus, Ionia
        figure: Thales
        story: Thales of Miletus looks for natural causes of things, and tradition says he foretold a solar eclipse.
        relic: An amber bead
        relic_desc: Rubbed on cloth, it picks up feathers, the oldest puzzle of electricity.
        points:
          p1: "See how he measures the pyramid by its shadow"
          p2: "Explain the reason without gods to the people of the harbour"
          p3: "Wait for a clear hour"
      zh:
        name: 不借神明解释自然
        place: 伊奥尼亚米利都
        figure: 泰勒斯
        story: 米利都的泰勒斯去找事物的自然原因，传说他预言过一次日食。
        relic: 一颗琥珀珠
        relic_desc: 在布上擦一擦就能吸起羽毛，是电最古老的谜。
