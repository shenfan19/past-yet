    text:
      en:
        name: 'The clock beside the lamp'
        place: Menlo Park, New Jersey
        figure: Thomas Edison
        story: 'Charles Batchelor’s Menlo Park notebook entry of 22 October 1879 records early tests with carbon made from cotton thread, including the light observed and a change in resistance. Its figures are practice observations for this branch.'
        relic: A carbon filament bulb
        relic_desc: A glass bulb with one hair thin loop inside.
        points:
          p1: 'Cover a shift on the night fragile filaments are under test and protect the long burn Batchelor recorded'
          p2: 'Before the public lighting at Menlo Park, secure a full-night rehearsal and spare lamps for the shop'
        points_fail:
          p1: 'The next watch arrives after the lamp has gone out. There is no reliable continuous run in the books, and the office recalls the employee after a loss of sync.'
          p2: 'The train brings the visitors before the shop discovers where lamps fail, leaving only a few replacements at hand.'
        shift:
          p1:
            was: 'On 22 and 23 October 1879 the Menlo Park notebook recorded a lamp with a carbonized cotton thread burning for fourteen and a half hours.'
          p2:
            was: 'In late December 1879 Menlo Park displayed its lighting to the public. Visitors saw around a hundred lamps in and around the laboratory.'
            now: '{staff} helps the shop run the full layout overnight and list the places where spare lamps are needed. Edison and his colleagues have a record of a full night before visitors arrive.'
            who: edison_menlo_park
            bio: 'Edison arranged a full rehearsal before the public lighting. The shop used the trial to plan spares and shifts for later displays.'
        vignettes:
          log: 'The workshop assistant writes that the lamp was still lit, but leaves off the time. You ask him to copy the clock reading into the next line before handing over. The next watch can tell how far apart the two observations are. The bulb is still lit when you go. Its full lifetime is not in your notes.'
          future: 'You know electric lights will light whole streets. The workshop assistant wants to mark this lamp as ready on the strength of its first glow. You put a line in the log for a second observation. The lamp can stay on watch for another shift. You miss what the next material does.'
          tag: 'Two slips are loose. You pair the one that names cotton thread with the readings from that bulb, then hand the pair to the next watch. You keep the handover time. The lamp is in someone else’s care when it finally goes out.'
      zh:
        name: '灯旁那块钟'
        place: 新泽西门洛帕克
        figure: 托马斯·爱迪生
        story: '查尔斯·巴彻勒在 1879 年 10 月 22 日的门洛帕克实验笔记里，记下用棉线制成炭丝的早期试验，包括发出的光和电阻的变化。'
        relic: 一只炭丝灯泡
        relic_desc: 玻璃泡里有一根头发丝细的圈。
        points:
          p1: '在灯丝容易坏掉的那夜接上值守，护住巴彻勒记下的长时试灯'
          p2: '趁门洛帕克公开点灯还有准备时间，为工坊争取一次整晚预演和备用灯'
        points_fail:
          p1: '没人及时接班，灯熄灭后才被发现，工坊没有可查的连续试灯时长。事务所因同步失败召回员工。'
          p2: '观众乘车到了，工坊才第一次发现几处灯位难以维持，现场只有几件临时替换件。'
        shift:
          p1:
            was: '1879 年 10 月 22 至 23 日，门洛帕克试验簿记录一盏使用碳化棉线的试验灯亮了十四个半小时。'
          p2:
            was: '1879 年 12 月底，门洛帕克向公众展示灯光，来客看到了实验室和附近建筑里的约百盏灯。'
            now: '{staff}帮工坊按现场载荷提前试亮一夜，把需换的灯位和备件记下来。公众到场前，爱迪生和同事已经拿到能撑过整晚的现场记录。'
            who: edison_menlo_park
            bio: '爱迪生在公开展示前安排了整场预演。团队据试点记录备件和排班，这套办法后来用于准备展示。'
        vignettes:
          log: '工场帮工写了「灯仍然亮」，漏记了钟点。你请他交班前把看钟的结果添到下一行。接班的人于是分得清两次观察隔了多久。你走时灯还亮着，整盏灯到底撑了多久，笔记里没有。'
          future: '你知道以后电灯会照亮整条街。工场帮工看见这盏灯一亮，就想标作已经试好。你给第二次观察留了一行，灯可以交给下一班接着看。换了下一种材料的结果，你没赶上。'
          tag: '两张纸条散着。你把写棉线的那张与这只玻璃泡的读数配好，交给接班的人。你带回交接钟点。灯最后熄灭时，已是别人守着。'
text:
  en:
    name: Thomas Edison
    text: American inventor, 1847 to 1931. At his laboratory in Menlo Park he led a team that developed a durable electric light bulb in 1879 and a system of power supply, and held over a thousand patents.
  zh:
    name: 托马斯·爱迪生
    text: 美国发明家，1847 年生，1931 年去世。他在门洛帕克的实验室带领团队，于 1879 年做出耐用的电灯泡以及配套供电系统，持有一千多项专利。
hook: {en: 'What goes in the notebook while the light is on?', zh: '灯亮的时候，该记下什么？'}
