          p2: "在走廊里替她说话"
          p3: "作为普通听众坐进她的课堂"
text:
  en:
    name: Emmy Noether
    text: German mathematician, 1882 to 1935. At Göttingen she proved that every symmetry of a physical system gives a conserved quantity, and she shaped modern abstract algebra. She lost her post in 1933 and emigrated to the United States.
  zh:
    name: 埃米·诺特
    text: 德国数学家，1882 年生，1935 年去世。她在哥廷根证明了物理系统的每种对称性对应一个守恒量，并塑造了现代抽象代数。1933 年她丢掉职位，移居美国。
