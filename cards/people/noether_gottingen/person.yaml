        place: "哥廷根"
        figure: "埃米·诺特"
        story: "埃米·诺特证明了把对称与守恒联系起来的定理，而系里仍不肯给她职位，她的课程用希尔伯特的名字发布。"
        relic: "一张课程通告"
        relic_desc: "一张厅里的通告，应该写她名字的地方写着希尔伯特。"
