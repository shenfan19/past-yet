hook: {en: 'Her course, under another man''s name', zh: '课表上写着别人的名字'}
facts:
  invited:
    date: '1915'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_mactutor, noether_university_teaching]
    text:
      en: 'In 1915 David Hilbert and Felix Klein invited Noether to Göttingen. Her first application to qualify as a lecturer, that year, was blocked by the rule that women could not.'
      zh: '1915 年，大卫·希尔伯特和费利克斯·克莱因请诺特到哥廷根。同年她第一次申请任教资格，因女性不得任教的规定受阻。'
    line:
      en: '1915: Hilbert and Klein bring Noether to Göttingen; her application to lecture is blocked because she is a woman.'
      zh: '1915 年，希尔伯特和克莱因把诺特请到哥廷根。她申请任教资格，因为是女性而受阻。'
      zh-Hant: '1915 年，希爾伯特和克萊因把諾特請到哥廷根。她申請任教資格，因為是女性而受阻。'
      fr: '1915 : Hilbert et Klein amènent Noether à Göttingen ; sa candidature à un cours est bloquée car elle est une femme.'
      es: '1915: Hilbert y Klein traen a Noether a Gotinga; su solicitud para dar una conferencia está bloqueada porque es mujer.'
      ja: '1915年: ヒルベルトとクラインがネーターをゲッティンゲンに連れて行く。彼女は女性であるため、講演への申し込みはブロックされています。'
      ko: '1915: Hilbert와 Klein은 Noether를 괴팅겐으로 데려왔습니다. 그녀가 여성이라는 이유로 강의 신청이 차단되었습니다.'
      ru: '1915: Гильберт и Кляйн привозят Нётер в Геттинген; ее заявка на лекцию заблокирована, поскольку она женщина.'
  hilbert_name:
    date: '1916'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_mactutor, noether_habilitation_archives]
    text:
      en: 'The course catalogue for the winter semester of 1916 and 1917 announced a seminar in mathematical physics by Professor Hilbert, with the assistance of Dr E. Noether, on Mondays from four to six, without fees.'
      zh: '1916 至 1917 年冬季学期的课表上写着：数学物理讨论课，希尔伯特教授主讲，诺特博士协助，周一四点到六点，免费。'
    line:
      en: 'Winter 1916: the timetable lists her seminar as given by Professor Hilbert, with the assistance of Dr Noether.'
      zh: '1916 年冬季学期，课表上她的讨论课写的是希尔伯特教授主讲，诺特博士协助。'
      zh-Hant: '1916 年冬季學期，課表上她的討論課寫的是希爾伯特教授主講，諾特博士協助。'
      fr: 'Hiver 1916 : l''emploi du temps indique que son séminaire est donné par le professeur Hilbert, avec le concours du Dr Noether.'
      es: 'Invierno de 1916: el calendario enumera su seminario impartido por el profesor Hilbert, con la ayuda del Dr. Noether.'
      ja: '1916 年冬: 時間割には、ネーター博士の協力を得てヒルベルト教授が行ったセミナーが記載されています。'
      ko: '1916년 겨울: 시간표에는 뇌터 박사의 도움을 받아 힐베르트 교수가 진행한 세미나가 나와 있습니다.'
      ru: 'Зима 1916 года: в расписании указан ее семинар, проведенный профессором Гильбертом при содействии доктора Нётер.'
  presented:
    date: '1918-07-26'
    stay_day: 14
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_paper_title_page, noether_habilitation_archives]
    text:
      en: 'At the meeting of 26 July 1918 Felix Klein presented Invariant Variational Problems by Emmy Noether to the Göttingen society of sciences. In it she connects continuous symmetries of a variational problem with corresponding conservation laws.'
      zh: '1918 年 7 月 26 日，费利克斯·克莱因在哥廷根科学学会的会议上呈交埃米·诺特的《不变变分问题》。她在文中把变分问题的连续对称性与相应的守恒律联系起来。'
    line:
      en: '26 July 1918: Felix Klein presents her paper Invariant Variational Problems to the Göttingen society of sciences.'
      zh: '1918 年 7 月 26 日，费利克斯·克莱因把她的论文《不变变分问题》呈交给哥廷根科学学会。'
      zh-Hant: '1918 年 7 月 26 日，費利克斯·克萊因把她的論文《不變變分問題》呈交給哥廷根科學學會。'
      fr: '26 juillet 1918 : Felix Klein présente son article Invariant Variational Problems à la société des sciences de Göttingen.'
      es: '26 de julio de 1918: Felix Klein presenta su artículo Problemas variacionales invariantes en la sociedad de ciencias de Göttingen.'
      ja: '1918年7月26日: フェリックス・クラインがゲッティンゲン科学協会に論文「不変変分問題」を発表。'
      ko: '1918년 7월 26일: 펠릭스 클라인(Felix Klein)이 괴팅겐 과학 협회에 불변 변이 문제(Invariant Variational Problems)라는 논문을 발표했습니다.'
      ru: '26 июля 1918 г.: Феликс Кляйн представляет свою статью «Инвариантные вариационные проблемы» Геттингенскому научному обществу.'
  final_version:
    date: '1918-09'
    stay_day: 80
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_paper_title_page, noether_habilitation_archives]
    text:
      en: 'A note on the first page of the printed paper says that the final version of the manuscript was handed in only at the end of September 1918.'
      zh: '论文印本首页的脚注说，手稿的终稿到 1918 年 9 月底才交上。'
    line:
      en: 'End of September 1918: Noether hands in the final version of the paper.'
      zh: '1918 年 9 月底，诺特交上论文的终稿。'
      zh-Hant: '1918 年 9 月底，諾特交上論文的終稿。'
      fr: 'Fin septembre 1918 : Noether remet la version définitive du document.'
      es: 'Finales de septiembre de 1918: Noether entrega la versión final del artículo.'
      ja: '1918年9月末: ネーターは論文の最終版を提出。'
      ko: '1918년 9월 말: Noether가 논문의 최종 버전을 제출했습니다.'
      ru: 'Конец сентября 1918 года: Нётер сдает окончательную версию статьи.'
  habilitation:
    date: '1919-06-04'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_habilitation_archives, noether_university_teaching]
    text:
      en: 'After a second application, Noether gave her trial lecture on 4 June 1919 and was admitted as a lecturer in mathematics, with Invariant Variational Problems as her thesis.'
      zh: '第二次申请之后，诺特在 1919 年 6 月 4 日作了试讲，获准为数学讲师，任教资格论文就是《不变变分问题》。'
    line:
      en: '4 June 1919: after her trial lecture Noether is admitted to lecture at Göttingen.'
      zh: '1919 年 6 月 4 日，诺特试讲之后获准在哥廷根任教。'
      zh-Hant: '1919 年 6 月 4 日，諾特試講之後獲准在哥廷根任教。'
      fr: '4 juin 1919 : après sa conférence d''essai, Noether est admise comme professeur à Göttingen.'
      es: '4 de junio de 1919: después de su conferencia de prueba, Noether es admitida para dar clases en Gotinga.'
      ja: '1919年6月4日: 試験講義の後、ネーターはゲッティンゲンでの講義を許可される。'
      ko: '1919년 6월 4일: 시험 강의 후 뇌터는 괴팅겐에서 강의를 할 수 있게 되었습니다.'
      ru: '4 июня 1919 г.: после пробной лекции Нётер допускаются к чтению лекций в Геттингене.'
  paid:
    date: '1923'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [noether_university_teaching, noether_wiki]
    text:
      en: 'Only in 1923 did Noether receive her first teaching assignment with a small fixed salary.'
      zh: '直到 1923 年，诺特才第一次得到带一小笔固定薪酬的教学任务。'
    line:
      en: '1923: for the first time Noether is paid a small fixed salary for her teaching.'
      zh: '1923 年，诺特第一次为教课领到一小笔固定薪酬。'
      zh-Hant: '1923 年，諾特第一次為教課領到一小筆固定薪酬。'
      fr: '1923 : Noether reçoit pour la première fois un petit salaire fixe pour son enseignement.'
      es: '1923: por primera vez Noether recibe un pequeño salario fijo por su labor docente.'
      ja: '1923年: ネーターは初めて、教育に対して少額の固定給を受け取った。'
      ko: '1923년: Noether는 처음으로 교육에 대한 대가로 적은 고정 급여를 받았습니다.'
      ru: '1923: Нётер впервые получает небольшую фиксированную зарплату за преподавание.'
  dismissed:
    date: '1933'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [noether_mactutor, noether_university_teaching]
    text:
      en: 'In 1933 Noether was one of the first to lose her post at Göttingen, and she went to Bryn Mawr College in the United States.'
      zh: '1933 年，诺特是哥廷根最早被解职的人之一，此后她去了美国的布林莫尔学院。'
    note: 'A dismissal: written as a plain fact.'
    line:
      en: '1933: Noether loses her post at Göttingen and leaves for Bryn Mawr College in the United States.'
      zh: '1933 年，诺特被哥廷根解职，去了美国的布林莫尔学院。'
      zh-Hant: '1933 年，諾特被哥廷根解職，去了美國的布林莫爾學院。'
      fr: '1933 : Noether perd son poste à Göttingen et part pour le Bryn Mawr College aux États-Unis.'
      es: '1933: Noether pierde su puesto en Göttingen y se marcha al Bryn Mawr College en Estados Unidos.'
      ja: '1933年: ネーターはゲッティンゲンでの職を失い、米国のブリンマー大学へ向かう。'
      ko: '1933: Noether는 괴팅겐에서 자리를 잃고 미국의 Bryn Mawr College로 떠납니다.'
      ru: '1933: Нётер теряет свой пост в Геттингене и уезжает в колледж Брин-Мор в США.'
  death:
    date: '1935-04-14'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [noether_mactutor, noether_wiki]
    text:
      en: 'Emmy Noether died at Bryn Mawr, Pennsylvania, on 14 April 1935.'
      zh: '1935 年 4 月 14 日，埃米·诺特在美国宾夕法尼亚州布林莫尔去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '14 April 1935: Emmy Noether dies at Bryn Mawr.'
      zh: '1935 年 4 月 14 日，埃米·诺特在布林莫尔去世。'
      zh-Hant: '1935 年 4 月 14 日，埃米·諾特在布林莫爾去世。'
      fr: '14 avril 1935 : Emmy Noether décède à Bryn Mawr.'
      es: '14 de abril de 1935: Emmy Noether muere en Bryn Mawr.'
      ja: '1935年4月14日：エミー・ネーターがブリンマーで死亡。'
      ko: '1935년 4월 14일: 에미 뇌터가 Bryn Mawr에서 사망합니다.'
      ru: '14 апреля 1935 года: Эмми Нётер умирает в Брин-Море.'
bystanders:
