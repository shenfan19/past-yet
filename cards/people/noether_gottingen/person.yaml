    text:
      en:
        name: "A lecture under another name"
        place: "Göttingen"
        figure: "Emmy Noether"
        story: 'In 1915 David Hilbert and Felix Klein brought Emmy Noether to Göttingen, but the university would not let a woman qualify to lecture, and from the winter of 1916 her courses were announced under the name of Hilbert. On 26 July 1918 Klein presented her paper Invariant Variational Problems to the Göttingen society of sciences, and she handed in its final version at the end of September. The paper links continuous symmetries of an action to conservation laws. She was admitted to lecture in June 1919, and only in 1923 was she first paid a small fixed salary for teaching.'
        story_prose:
          opening:
            - 'Göttingen, July 1918. Three years ago David Hilbert and Felix Klein brought the mathematician Emmy Noether, now thirty six, to Göttingen, but the university would not let a woman qualify to lecture, and since the winter semester of 1916 her courses have been announced under Hilbert''s name. This summer she has written Invariant Variational Problems, which links continuous symmetries of an action to conservation laws.'
            - 'In history, on 26 July Klein presented the paper to the Göttingen society of sciences, and she handed in the final version only at the end of September; the next year she was admitted to lecture, and only in 1923 was she first paid a small fixed salary for teaching. In this branch, the mathematics building has a porter who has pinned up the timetable for several terms, and the back yard where she lodges has a landlady who has stopped counting her bread coupons.'
            - 'A few kinds of people can help on this trip: someone who has lectured at a university, kept archives or read proofs, or someone methodical and learned, to get the signed paper and its summary there together; someone who has kept archives or lectured and can talk the department round, to get her seminar some pay.'
          outcomes:
            all: 'In June 1919, after her trial lecture, Noether was admitted to lecture at Göttingen, and her thesis was Invariant Variational Problems, under her own name. Before that her seminar already had some pay, and the students working with her had a fixed time each week to come.'
            p2: 'That winter her seminar had some pay, and the students working with her had a fixed time each week to come. In June 1919, after her trial lecture, she was admitted to lecture.'
            p1: 'The paper was presented on time, and the printed copy bore her name. In June 1919 it became her thesis for the right to lecture.'
          none: 'At the end of December the seminar still ran, unpaid. The line on the notice board still read Professor Hilbert, with the assistance of Dr Noether, and a ring of rust had spread round the drawing pin.'
          desync: 'Before the meeting of 26 July the paper and its summary were still scattered in two piles, and the author''s page could not be found. When {staff} was recalled an unsigned first page lay on the table, and outside the clock was striking.'
          not_admitted: '{staff} never got into the mathematics building, and only stood a few times on the steps outside. The timetable was pinned to the board, and one line read Professor Hilbert, with the assistance of Dr Noether.'
          points:
            p1:
              class_learned: 'On the morning of 26 July, before the society meets, the manuscript Klein wants is still in two places: one pile is the paper signed by Noether, the other its summary, both slipped in among other papers. {staff}, who has lectured at a university and knows how such meetings go, puts the two piles together by their page numbers, finds her name on the first page, marks it with a slip of paper and gets it into Klein''s hands before the meeting. Klein turns to the first page, glances at the name on it and puts the manuscript in the top compartment of his briefcase. He snaps the clasp shut and goes into the meeting room with the case under his arm.'
              class_lettered: 'On the morning of 26 July, before the society meets, the manuscript Klein wants is still in two places: one pile is the paper signed by Noether, the other its summary, both slipped in among other papers. {staff}, at home with manuscripts, puts the two piles together page by page, finds her name on the first page, marks it with a slip of paper and gets it into Klein''s hands before the meeting. Klein turns to the first page, glances at the name on it and puts the manuscript in the top compartment of his briefcase. He snaps the clasp shut and goes into the meeting room with the case under his arm.'
              else: 'On the morning of 26 July, before the society meets, the manuscript Klein wants is still in two places: one pile is the paper signed by Noether, the other its summary, both slipped in among other papers. {staff}, methodical, finds both piles in the stack, puts them together by their page numbers, finds her name on the first page, marks it with a slip of paper and gets it into Klein''s hands before the meeting. Klein turns to the first page, glances at the name on it and puts the manuscript in the top compartment of his briefcase. He snaps the clasp shut and goes into the meeting room with the case under his arm.'
            p2:
              class_lettered: 'In December the seminar still meets every week, and the line on the timetable still reads Professor Hilbert, with the assistance of Dr Noether. {staff}, used to paperwork, copies out by date every class she has actually taught this term and takes the list to the department with a printed copy of her signed paper, asking them to set pay for the next round of the seminar first and then file it with her new application. The department takes the list and puts it in a new folder with her name on the cover. At the next week''s seminar Noether pushes open the door; the blackboard has been wiped clean, and two more chairs stand in the front row.'
              class_learned: 'In December the seminar still meets every week, and the line on the timetable still reads Professor Hilbert, with the assistance of Dr Noether. {staff}, who has lectured at a university and knows how money moves in a department, lists by date every class she has actually taught this term and takes the list to the department with a printed copy of her signed paper, asking them to set pay for the next round of the seminar first and then file it with her new application. The department takes the list and puts it in a new folder with her name on the cover. At the next week''s seminar Noether pushes open the door; the blackboard has been wiped clean, and two more chairs stand in the front row.'
              else: 'In December the seminar still meets every week, and the line on the timetable still reads Professor Hilbert, with the assistance of Dr Noether. {staff}, methodical and with a voice that carries a room, sits in the department office, lists on a sheet every class she has taught this term and counts them out loud, lays down a printed copy of her signed paper, and asks them to set pay for the next round of the seminar first and then file it with her new application. The department takes the list and puts it in a new folder with her name on the cover. At the next week''s seminar Noether pushes open the door; the blackboard has been wiped clean, and two more chairs stand in the front row.'
          excerpts:
            p2: 'The department takes the list and puts it in a new folder with her name on the cover. At the next week''s seminar Noether pushes open the door; the blackboard has been wiped clean, and two more chairs stand in the front row.'
            p1: 'Klein turns to the first page, glances at the name on it and puts the manuscript in the top compartment of his briefcase. He snaps the clasp shut and goes into the meeting room with the case under his arm.'
        relic: "A lecture notice"
        relic_desc: "A hall notice with Hilbert's name where hers should be."
        points:
          p1: 'Get Noether’s signed paper and its summary to Klein together so he can submit the work at the scheduled Göttingen meeting'
          p2: 'Give the department a record of the classes Noether has taught and a copy of her signed paper. Ask the department to budget payment for the next seminar and file it with the new application'
        points_fail:
          p1: 'The list has the presenter’s name, but the manuscript and its author’s page cannot be matched. The society puts the paper off to another meeting, and the office recalls the employee.'
          p2: 'The department agrees to keep the seminar running. It uses the old schedule and sets aside no pay for the hours Noether teaches.'
        shift:
          p1:
            was: 'Felix Klein presented Invariant Variational Problems at a meeting in Göttingen on July 26, 1918. The printed paper names Emmy Noether as its author.'
          p2:
            was: 'Noether completed her habilitation in 1919. The university dates her first teaching assignment with a small fixed salary to 1923.'
            now: 'The department approves a small seminar budget ahead of the new habilitation review and pays for the hours she teaches. Students working with her have a regular time to bring their problems.'
            who: noether_gottingen
            bio: 'Göttingen’s rules blocked Noether’s first application to qualify as a lecturer. She continued her research and later taught students in her own classes.'
        vignettes:
          notice: 'Before the winter semester {staff} helps the porter pin the timetable to the board. He taps one line, Professor Hilbert with the assistance of Dr Noether, and says he has pinned that line up for several terms now, and the one who goes in to teach has always been the lady doctor.'
          turnips: 'In October {staff} helps the landlady dig turnips in the back yard. The influenza is back in town, she says, half the student lodgings are empty, and she has stopped counting the bread coupons because there is nothing left to count.'
          snow: 'Late in December {staff} helps the porter of the mathematics building sweep snow from the steps. So many students have come back from the war, the porter says, that the halls have no seats left and some are listening from the corridor.'
      zh:
        name: "署着别人名字的课"
        place: "哥廷根"
        figure: "埃米·诺特"
        story: '1915 年，大卫·希尔伯特和费利克斯·克莱因把埃米·诺特请到哥廷根，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。1918 年 7 月 26 日，克莱因把她的论文《不变变分问题》呈交给哥廷根科学学会，9 月底她交了终稿。这篇论文把作用量的连续对称性与守恒定律联系起来。1919 年 6 月，她获准任教，直到 1923 年才第一次领到一小笔固定的教学薪酬。'
        story_prose:
          opening:
            - '1918 年 7 月，哥廷根。三十六岁的数学家埃米·诺特三年前被大卫·希尔伯特和费利克斯·克莱因请到这里，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。这个夏天，她写成了《不变变分问题》，把作用量的连续对称性与守恒定律联系了起来。'
            - '史实里，7 月 26 日克莱因把这篇论文呈交给哥廷根科学学会，她到 9 月底才交上终稿；第二年她获准任教，直到 1923 年才第一次为教课领到一小笔固定薪酬。在这条分支里，数学楼有个钉了好几个学期课表的工友，她住处的后院有个不再数面包票的房东太太。'
            - '这一趟用得上几种人：教过大学、管过档案或做过校对的人，或者有条理、有学问的人，把署名的文稿和提要一起送到；管过档案、教过大学、又说得动系里的人，替她的讨论课要来一份课酬。'
          outcomes:
            all: '1919 年 6 月，诺特试讲之后获准在哥廷根任教，任教资格论文就是那篇署着她名字的《不变变分问题》。在那之前，她的讨论课已经有了一笔课酬，跟她做题的学生每周有一段固定的时候可来。'
            p2: '那个冬天，她的讨论课有了一笔课酬，跟她做题的学生每周有一段固定的时候可来。1919 年 6 月，她试讲之后获准任教。'
            p1: '那篇论文照期呈交，印本上署的是她的名字。1919 年 6 月，它成了她的任教资格论文。'
          none: '十二月底，讨论课照旧开着，没有课酬。布告栏上那一行仍写着希尔伯特教授，在诺特博士协助下，图钉边上锈了一圈。'
          desync: '7 月 26 日开会前，正文和提要还散在两沓稿子里，作者页找不着了。{staff}被召回时，桌上摊着一页没有署名的首页，窗外的钟正在敲。'
          not_admitted: '{staff}没能进数学楼，只在门外的台阶上站过几回。布告栏上钉着课表，有一行写着希尔伯特教授，在诺特博士协助下。'
          points:
            p1:
              class_learned: '7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}教过大学，知道学会的会是怎么开的，把两沓对着页码合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。'
              class_lettered: '7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}跟稿子打惯了交道，一页页对着页码把两沓合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。'
              else: '7 月 26 日上午，学会开会之前，克莱因要的那份稿子还分在两处：一沓是诺特署名的正文，一沓是提要，夹在别的论文中间。{staff}做事有条理，从那一摞论文里把两沓都找了出来，对着页码合成一份，在首页上找到她的名字，用一张纸条别好，赶在开会前送到克莱因手上。克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。'
            p2:
              class_lettered: '十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}管过文书，把这一学期她实际上过的每一堂课按日期抄成一张表，连同那篇署名论文的印本一起送到系里，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。'
              class_learned: '十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}教过大学，知道系里的钱是怎么走的，把这一学期她实际上过的每一堂课按日期列成一张表，连同那篇署名论文的印本一起送到系里，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。'
              else: '十二月里，讨论课照旧每周开，课表上那一行还是希尔伯特教授，在诺特博士协助下。{staff}做事有条理，说话也压得住场，在系里的办公室把她这一学期上过的课一堂堂列在一张纸上，当面数给人听，又放下那篇署名论文的印本，请他们先为下一轮讨论课核一笔课酬，再随新的任教申请存档。系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。'
          excerpts:
            p2: '系里收下那张表，夹进一个新卷宗，封皮上写着她的名字。下一周的讨论课，诺特推门进去，黑板已经擦干净了，前排多摆了两把椅子。'
            p1: '克莱因翻到首页，看了一眼上面的名字，把稿子放进公文包最上面一层。他扣上搭扣，夹着包进了会议室。'
        relic: "一张课程通告"
        relic_desc: "一张厅里的通告，应该写她名字的地方写着希尔伯特。"
        points:
          p1: '把诺特署名的文稿和提要同时交到克莱因手上，让他能按期将论文呈交给哥廷根学术团体'
          p2: '把本学期由诺特实际授课的记录和署名论文一并交给系里，请系里先为下一轮讨论课核定课酬，再随新申请存档'
        points_fail:
          p1: '名册上只有呈交人的名字，讲义与作者页没能对回同一份。会议把论文退到下一次，事务所因同步失败召回员工。'
          p2: '系里同意有人继续带讨论课，但依然用原来的排课办法，没有经费支付诺特这部分工时。'
        shift:
          p1:
            was: '1918 年 7 月 26 日，费利克斯·克莱因在哥廷根的一次会议上呈交《不变变分问题》。印本所署作者是埃米·诺特。'
          p2:
            was: '诺特于 1919 年获任教资格，哥廷根大学记录她到 1923 年才取得带少量固定薪酬的教学任务。'
            now: '系里在任教资格重审前先拨了一小笔课酬，按实际开课支付。这个学期愿意跟她做题的学生因此有一段固定的时间可来。'
            who: noether_gottingen
            bio: '哥廷根的任教规则曾让诺特的第一份申请受阻。她仍开展研究，后来以一系列论文和自己的课堂培养学生。'
        vignettes:
          notice: '冬季学期开课前，{staff}帮工友往布告栏上钉课表，旧课表揭下来，木板上留着一圈圈图钉眼。工友指着一行念：希尔伯特教授，在诺特博士协助下。他说这一行他钉了好几个学期，进教室讲课的一直是那位女博士。'
          turnips: '十月，{staff}帮房东太太在后院挖萝卜，土又湿又黏，萝卜都不大。她说城里流感又起来了，学生公寓空了一半，面包票她早就不数了，反正也没什么可数的。'
          snow: '十二月底，{staff}帮数学楼的门房扫台阶上的雪，扫帚秃了，扫一下要补一下。门房说打完仗回来的学生太多，讲堂里没座位了，有人站在走廊里听。'
text:
  en:
    name: Emmy Noether
    text: German mathematician, 1882 to 1935. At Göttingen she showed how continuous symmetries of an action lead to conservation laws, and she shaped modern abstract algebra. She lost her post in 1933 and emigrated to the United States.
  zh:
    name: 埃米·诺特
    text: 德国数学家，1882 年生，1935 年去世。她在哥廷根阐明了作用量的连续对称性怎样导出守恒定律，并塑造了现代抽象代数。1933 年她丢掉职位，移居美国。
quotes:
  noether_gottingen_methods:
    order: 1
    tier: full
    date: '1918-07-26'
    checked: official_record
    sources: [noether_gdz_variations]
    original: de
    text:
      de:
        quote: 'Das folgende beruht also auf einer Verbindung der Methoden der formalen Variationsrechnung mit denen der Lieschen Gruppentheorie.'
      en:
        who: 'Emmy Noether'
        quote: 'What follows therefore brings together the methods of the formal calculus of variations and those of Lie group theory.'
        occasion: 'Invariant Variational Problems, paper presented by Felix Klein (game translation)'
      zh:
        who: '埃米·诺特'
        quote: '因此，下文把形式变分法与李群理论的方法结合起来。'
        occasion: '费利克斯·克莱因代呈的《不变变分问题》（游戏译文）'
      zh-Hant:
        who: '埃米·諾特'
        quote: '因此，下文把形式變分法與李群理論的方法結合起來。'
        occasion: '費利克斯·克萊因代呈的《不變變分問題》（遊戲譯文）'
      fr:
        who: 'Emmy Noether'
        quote: 'Ce qui suit rassemble donc les méthodes du calcul formel des variations et celles de la théorie des groupes de Lie.'
        occasion: 'Invariant Variational Problems, article présenté par Felix Klein (traduction du jeu)'
      es:
        who: 'Emmy Noether'
        quote: 'Por lo tanto, lo que sigue reúne los métodos del cálculo formal de variaciones y los de la teoría de grupos de Lie.'
        occasion: 'Problemas variacionales invariantes, artículo presentado por Felix Klein (traducción del juego)'
      ja:
        who: 'エミー・ネーター'
        quote: 'したがって、以下では、変分の形式的な計算の方法とリー群理論の方法をまとめます。'
        occasion: '不変変分問題、Felix Klein 氏による論文 (ゲーム翻訳)'
      ko:
        who: '에미 뇌터'
        quote: '따라서 다음은 형식적인 변분법의 방법과 거짓말 그룹 이론의 방법을 결합한 것입니다.'
        occasion: '불변변동문제(Invariant Variational Problems), 펠릭스 클라인(Felix Klein) 발표 논문(게임 번역)'
      ru:
        who: 'Эмми Нётер'
        quote: 'Поэтому нижеследующее объединяет методы формального вариационного исчисления и теории групп Ли.'
        occasion: 'Инвариантно-вариационные задачи, статья Феликса Кляйна (перевод игры)'
  noether_gottingen_correspondence:
    order: 2
    tier: none
    date: '1932-05-02'
    checked: official_record
    sources: [noether_hasse_postcard]
    original: de
    text:
      de:
        quote: 'Ich habe also jedenfalls meine mathematisch-historischen Kenntnisse durch diese Korrespondenz erweitert!'
      en:
        who: 'Emmy Noether'
        quote: 'At any rate, this correspondence has broadened my knowledge of the history of mathematics!'
        occasion: 'postcard to Helmut Hasse, after revisiting a proof (game translation)'
      zh:
        who: '埃米·诺特'
        quote: '无论如何，这番通信让我多懂了一些数学史！'
        occasion: '重读证明后寄给赫尔穆特·哈塞的明信片（游戏译文）'
      zh-Hant:
        who: '埃米·諾特'
        quote: '無論如何，這番通信讓我多懂了一些數學史！'
        occasion: '重讀證明後寄給赫爾穆特·哈塞的明信片（遊戲譯文）'
      fr:
        who: 'Emmy Noether'
        quote: 'En tout cas, cette correspondance a élargi mes connaissances en histoire des mathématiques !'
        occasion: 'carte postale à Helmut Hasse, après avoir revisité une épreuve (traduction du jeu)'
      es:
        who: 'Emmy Noether'
        quote: 'En cualquier caso, ¡esta correspondencia ha ampliado mis conocimientos sobre la historia de las matemáticas!'
        occasion: 'postal a Helmut Hasse, después de revisar una prueba (traducción del juego)'
      ja:
        who: 'エミー・ネーター'
        quote: 'いずれにせよ、この通信により数学の歴史に関する私の知識が広がりました。'
        occasion: '校正を再検討した後のヘルムート・ハッセへのポストカード (ゲーム翻訳)'
      ko:
