    text:
      en:
        name: "A lecture under another name"
        place: "Göttingen"
        figure: "Emmy Noether"
        story: 'In 1915 David Hilbert and Felix Klein brought Emmy Noether to Göttingen, but the university would not let a woman qualify to lecture, and from the winter of 1916 her courses were announced under the name of Hilbert. On 26 July 1918 Klein presented her paper Invariant Variational Problems to the Göttingen society of sciences, and she handed in its final version at the end of September. The paper links continuous symmetries of an action to conservation laws. She was admitted to lecture in June 1919, and only in 1923 was she first paid a small fixed salary for teaching.'
        relic: "A lecture notice"
        relic_desc: "A hall notice with Hilbert's name where hers should be."
        points:
          p1: 'Get Noether’s signed paper and its summary to Klein together so he can submit the work at the scheduled Göttingen meeting'
          p2: 'Give the department a record of the classes Noether has taught and a copy of her signed paper. Ask the department to budget payment for the next seminar and file it with the new application'
        points_fail:
          p1: 'The list has the presenter’s name, but the manuscript and its author’s page cannot be matched. The society puts the paper off to another meeting, and the office recalls the employee.'
          p2: 'The department agrees to keep the seminar running. It uses the old schedule and sets aside no pay for the hours Noether teaches.'
        shift:
          p1:
            was: 'Felix Klein presented Invariant Variational Problems at a meeting in Göttingen on July 26, 1918. The printed paper names Emmy Noether as its author.'
          p2:
            was: 'Noether completed her habilitation in 1919. The university dates her first teaching assignment with a small fixed salary to 1923.'
            now: 'The department approves a small seminar budget ahead of the new habilitation review and pays for the hours she teaches. Students working with her have a regular time to bring their problems.'
            who: noether_gottingen
            bio: 'Göttingen’s rules blocked Noether’s first application to qualify as a lecturer. She continued her research and later taught students in her own classes.'
        vignettes:
          notice: 'Before the winter semester {staff} helps the porter pin the timetable to the board. He taps one line, Professor Hilbert with the assistance of Dr Noether, and says he has pinned that line up for several terms now, and the one who goes in to teach has always been the lady doctor.'
          turnips: 'In October {staff} helps the landlady dig turnips in the back yard. The influenza is back in town, she says, half the student lodgings are empty, and she has stopped counting the bread coupons because there is nothing left to count.'
          snow: 'Late in December {staff} helps the porter of the mathematics building sweep snow from the steps. So many students have come back from the war, the porter says, that the halls have no seats left and some are listening from the corridor.'
      zh:
        name: "署着别人名字的课"
        place: "哥廷根"
        figure: "埃米·诺特"
        story: '1915 年，大卫·希尔伯特和费利克斯·克莱因把埃米·诺特请到哥廷根，可大学不让女性取得任教资格，从 1916 年冬季学期起，她的课在课表上署的是希尔伯特的名字。1918 年 7 月 26 日，克莱因把她的论文《不变变分问题》呈交给哥廷根科学学会，9 月底她交了终稿。这篇论文把作用量的连续对称性与守恒定律联系起来。1919 年 6 月，她获准任教，直到 1923 年才第一次领到一小笔固定的教学薪酬。'
        relic: "一张课程通告"
        relic_desc: "一张厅里的通告，应该写她名字的地方写着希尔伯特。"
        points:
          p1: '把诺特署名的文稿和提要同时交到克莱因手上，让他能按期将论文呈交给哥廷根学术团体'
          p2: '把本学期由诺特实际授课的记录和署名论文一并交给系里，请系里先为下一轮讨论课核定课酬，再随新申请存档'
        points_fail:
          p1: '名册上只有呈交人的名字，讲义与作者页没能对回同一份。会议把论文退到下一次，事务所因同步失败召回员工。'
          p2: '系里同意有人继续带讨论课，但依然用原来的排课办法，没有经费支付诺特这部分工时。'
        shift:
          p1:
            was: '1918 年 7 月 26 日，费利克斯·克莱因在哥廷根的一次会议上呈交《不变变分问题》。印本所署作者是埃米·诺特。'
          p2:
            was: '诺特于 1919 年获任教资格，哥廷根大学记录她到 1923 年才取得带少量固定薪酬的教学任务。'
            now: '系里在任教资格重审前先拨了一小笔课酬，按实际开课支付。这个学期愿意跟她做题的学生因此有一段固定的时间可来。'
            who: noether_gottingen
            bio: '哥廷根的任教规则曾让诺特的第一份申请受阻。她仍开展研究，后来以一系列论文和自己的课堂培养学生。'
        vignettes:
          notice: '冬季学期开课前，{staff}帮工友往布告栏上钉课表。工友指着一行念：希尔伯特教授，在诺特博士协助下。他说这一行他钉了好几个学期，进教室讲课的一直是那位女博士。'
          turnips: '十月，{staff}帮房东太太在后院挖萝卜。她说城里流感又起来了，学生公寓空了一半，面包票她早就不数了，反正也没什么可数的。'
          snow: '十二月底，{staff}帮数学楼的门房扫台阶上的雪。门房说打完仗回来的学生太多，讲堂里没座位了，有人站在走廊里听。'
text:
  en:
    name: Emmy Noether
    text: German mathematician, 1882 to 1935. At Göttingen she showed how continuous symmetries of an action lead to conservation laws, and she shaped modern abstract algebra. She lost her post in 1933 and emigrated to the United States.
  zh:
    name: 埃米·诺特
    text: 德国数学家，1882 年生，1935 年去世。她在哥廷根阐明了作用量的连续对称性怎样导出守恒定律，并塑造了现代抽象代数。1933 年她丢掉职位，移居美国。
quotes:
  noether_gottingen_methods:
    order: 1
    tier: full
    date: '1918-07-26'
    checked: official_record
    sources: [noether_gdz_variations]
    original: de
    text:
      de: {quote: 'Das folgende beruht also auf einer Verbindung der Methoden der formalen Variationsrechnung mit denen der Lieschen Gruppentheorie.'}
      en: {who: 'Emmy Noether', quote: 'What follows therefore brings together the methods of the formal calculus of variations and those of Lie group theory.', occasion: 'Invariant Variational Problems, paper presented by Felix Klein (game translation)'}
      zh: {who: '埃米·诺特', quote: '因此，下文把形式变分法与李群理论的方法结合起来。', occasion: '费利克斯·克莱因代呈的《不变变分问题》（游戏译文）'}
  noether_gottingen_correspondence:
    order: 2
    tier: none
    date: '1932-05-02'
    checked: official_record
    sources: [noether_hasse_postcard]
    original: de
    text:
      de: {quote: 'Ich habe also jedenfalls meine mathematisch-historischen Kenntnisse durch diese Korrespondenz erweitert!'}
      en: {who: 'Emmy Noether', quote: 'At any rate, this correspondence has broadened my knowledge of the history of mathematics!', occasion: 'postcard to Helmut Hasse, after revisiting a proof (game translation)'}
      zh: {who: '埃米·诺特', quote: '无论如何，这番通信让我多懂了一些数学史！', occasion: '重读证明后寄给赫尔穆特·哈塞的明信片（游戏译文）'}
hook: {en: 'Her course, under another man''s name', zh: '课表上写着别人的名字'}
