    text:
      en:
        name: 'What the witness saw'
        place: "Leonberg"
        figure: "Johannes Kepler"
        story: 'In his defence of his mother Katharina, Johannes Kepler dated her arrest to 7 August 1620 and set out the delays in the proceedings at Güglingen. This visit starts among her papers in Leonberg. The copying exercise is invented and makes no claim to reproduce witness testimony.'
        relic: 'A checked defence copy'
        relic_desc: 'A fictional copying sheet with one corrected date.'
        points:
          p1: 'Ask the scribe to keep an allegation with the name of its speaker'
          p2: 'Keep the two copies together until they can be compared'
          p3: 'Earn enough trust to read back what the messenger actually heard'
        vignettes:
          heard: 'Margarete has written that a neighbour saw something. When you ask which neighbour, she can only name the man who repeated it at the door. She copies the two claims onto separate lines and leaves a place for a first-hand account if one comes.'
          compare: 'Matthias wants to send the first copy now and keep the second at the desk. You read one against the other and find that a date has lost a digit. He waits while Margarete checks the original. The messenger takes the corrected copy as the bells finish striking.'
          release: 'You know Katharina will eventually be released. Margarete asks what should go on the packet she has in her hands today. You write the day of dispatch and help her dry the ink. The date of release still lies beyond this visit.'
      zh:
        name: '证人亲眼看见的事'
        place: "莱昂贝格"
        figure: "约翰内斯·开普勒"
        story: '约翰内斯·开普勒为母亲卡塔琳娜辩护时，把她被捕的日子记为1620年8月7日，也逐一写下居格林根诉讼的拖延。游戏从莱昂贝格整理文书开始。抄写差事是虚构的，其中的说法并非当时的证言。'
        relic: '一页核对过的辩护文书练习稿'
        relic_desc: '虚构的抄写练习，有一处改过日期。'
        points:
          p1: '请抄写员把指控和说出它的人记在一处'
          p2: '把两份抄本放在一起，等人核对'
          p3: '取得信任，把送件人亲耳听到的话念回给他'
        vignettes:
          heard: '玛格丽特写着有邻居亲眼看见。你问是哪位邻居，她只叫得出在门边转述的那个人。她把两种说法分成两行，又给可能收到的亲历说法留个位置。'
          compare: '马蒂亚斯想先送出一份，另一份留桌上。你照着念了两遍，发现有个日期漏了一位数字。他等玛格丽特找原稿核对。钟声刚停，送件人带着改好的副本走了。'
          release: '你知道卡塔琳娜终会获释。玛格丽特问，今天手里这包纸该写什么。你写上送出的日期，帮她等墨晾干。获释的日子这趟还等不到。'
text:
  en:
    name: Johannes Kepler
    text: German astronomer, 1571 to 1630. He formulated three laws of planetary motion from the observations of Tycho Brahe. In 1620 his mother was tried for witchcraft at Leonberg, and he helped her defence.
  zh:
    name: 约翰内斯·开普勒
    text: 德国天文学家，1571 年生，1630 年去世。他根据第谷·布拉赫的观测归纳出行星运动三定律。1620 年他的母亲在莱昂贝格因巫术受审，他协助辩护。
hook: {en: 'Who actually saw what the statement describes?', zh: '这句话写的事，谁亲眼看见？'}
facts:
  arrest:
    date: '1620-08-07'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [kepler_leonberg_arrest]
    text:
      en: 'The defence dates the arrest to 7 August 1620, distinguishes later steps taken at Güglingen and records the defence’s complaints about delay.'
      zh: '辩护文书将被捕日记为1620年8月7日，分别列出后来在居格林根的诉讼步骤，并陈述辩方对拖延的异议。'
  released:
    date: '1621'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [kepler_leonberg_released]
    text:
      en: 'Rublack’s archival research places Katharina’s release in the autumn of 1621.'
      zh: '鲁布拉克据档案研究将卡塔琳娜获释定在1621年秋。'
bystanders:
  margarete:
    invented: true
    text: {en: 'A fictional scribe whose copy has to distinguish two kinds of statement.', zh: '虚构抄写员玛格丽特，得在抄本里分清两种说法。'}
  matthias:
    invented: true
    text: {en: 'A fictional courier about to leave with the first copy he is handed.', zh: '虚构送件人马蒂亚斯，拿到第一份纸就准备走。'}
