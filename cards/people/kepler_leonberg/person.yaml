    text:
      en:
        name: 'What the witness saw'
        place: "Leonberg"
        figure: "Johannes Kepler"
        story: 'In 1620 Katharina Kepler, the mother of the astronomer Johannes Kepler, faced accusations from neighbours in Leonberg that dated back five years. On 7 August she was arrested at her daughter''s home in Heumaden. She was transferred from Leonberg to Güglingen and held under guard at her family''s expense. That September, Johannes returned from Linz to take up her defence. After repeated delays, Katharina was released in the autumn of 1621, more than a year after her arrest.'
        story_prose:
          opening:
            - 'Leonberg, 1620. The accusations against Katharina Kepler had been hanging over her for five years. She was arrested in Heumaden in August, and in September her son Johannes returned from Linz to defend her.'
            - 'In history, she spent more than a year in custody at Güglingen. She wore chains through the winter and her family had to pay the guards. In this branch, the gaoler’s wife still carries soup up the lane. Someone can take the pot from her for a stretch and look over the papers before they are sent away.'
            - 'This trip needs someone who can keep papers in order and trace a statement to the person who made it. Once winter comes, there is also work for a carer or someone who can bring in warm bedding.'
          points:
            p1: 'After Katharina was brought to Leonberg, {staff} followed the habits of a record keeper, asking the custodian for a second copy, counting the pages with him and seeing it handed in. The clerk laid the copy on the pile to be filed. As the original was folded back, {staff} pressed down a corner that had sprung up.'
            p2: '{staff} spread out the testimony with the family and traced each claim back to what was seen, what was heard, or what someone had inferred later. Three columns gave the crowded testimony room to breathe. At something no witness had seen, the pen stopped just short of the ruled line.'
            p3: 'Once the cold came, {staff} arranged with the guards for thick bedding and a hot meal to go in beside the bed where Katharina wore her chains. Before taking the bowl she tucked a corner of the blanket over her knees. An iron link rested against the bedboard as she slowly closed both hands around the warm bowl.'
          outcomes:
            all: 'The testimony and the defence could still be read side by side. Katharina had hot meals and a heavy blanket in prison. When she was released the following autumn, her family waited outside with a coat she could wrap up to her chin.'
            p3: 'The iron lost its bite only after winter ended. She had come through it. Tidying the bed, she put the two corners of the thick blanket carefully together.'
            p2: 'The lawyer received the copy. He marked several lines beside things the witnesses had never seen themselves, turned the page and turned it back.'
            p1: 'The written defence could still be found in the file years later. Where a corner had been folded, repeated handling had worn a pale line.'
          none: 'The wall grew cold, and a skin formed on the soup. A cart passed the window, its iron wheels striking the gaps between the stones, each knock farther away.'
          not_admitted: '{staff} could not enter the room where the papers were kept. Someone inside moved a bundle, and its cord scraped against the table.'
          desync: 'The file had closed without the defence in it. When {staff} was recalled, a square patch on the table still marked where the papers had been.'
          excerpts:
            p3: 'Before taking the bowl she tucked a corner of the blanket over her knees. An iron link rested against the bedboard as she slowly closed both hands around the warm bowl.'
            p2: 'Three columns gave the crowded testimony room to breathe. At something no witness had seen, the pen stopped just short of the ruled line.'
            p1: 'The clerk laid the copy on the pile to be filed. As the original was folded back, {staff} pressed down a corner that had sprung up.'
        relic: 'A copy of a defence plea'
        relic_desc: 'A fair copy of one page of a written plea, with a date corrected in the margin.'
        points:
          p1: 'After Katharina is brought to Leonberg, have the keeper of the defense papers file a second copy so her written response reaches the proceedings'
          p2: 'Help the family sort firsthand testimony, hearsay and later inferences into separate columns'
          p3: 'Get thick bedding and hot food into the cell at Güglingen, so that Katharina, seventy three and in chains, comes through this winter'
        points_fail:
          p1: 'The only copy the family can find is never delivered. The file has only the accusations, and the office recalls the employee.'
          p2: 'The copy puts all three together. Once it reaches the file, the defense still has to ask who originally said what.'
          p3: 'In this branch she spent the winter in chains as history has it, with only the two men who guarded her day and night, and the family paying for the guard.'
        shift:
          p1:
            was: 'Katharina was arrested in August 1620. Through lawyers, Johannes Kepler insisted on a written record of the proceedings.'
          p2:
            was: 'Testimony and written defenses survive. The defense answered claims one by one and challenged inferences used to link them.'
            now: 'The lawyer can compare the three columns and point to claims the witnesses could not verify for themselves.'
          p3:
            was: 'On 7 August 1620 Katharina Kepler was arrested and taken to Güglingen, where she was held in chains for fourteen months under two guards, at her family''s cost. She was released in the autumn of 1621 and died about six months later.'
            now: '{staff} settled things with the guards for the family. That winter she had thick bedding and hot food; the chains stayed on, but she held up better than in history.'
            who: katharina_kepler
            bio: 'In this timeline Katharina Kepler had warm bedding and hot food through her first winter in the cell at Güglingen, and was stronger when she was released in the autumn of 1621.'
        vignettes:
          soup: 'On 13 September {staff} carries a pot of barley soup up the lane at Güglingen for the jailer''s wife. She says she can tell which prisoner is which by the bowls that come back: the old woman sends hers back scraped clean and complains that it wanted salt.'
          hearing: 'On 2 October {staff} helps a lawyer''s clerk carry two bundles of papers to the town hall at Güglingen for the hearing. At the door they are told it is put off. The clerk sets the bundles down on the step and says he has carried them up so often that they ought to know the way by now.'
          frost: 'In the middle of November {staff} rides on a carter''s wagon from Leonberg to Güglingen. The carter says the road is worst where the Zaber valley begins; in the frost the wheels sing, and he has learned to tell the distance by the note.'
      zh:
        name: '证人亲眼看见的事'
        place: "莱昂贝格"
        figure: "约翰内斯·开普勒"
        story: '1620 年，莱昂贝格的邻居指控天文学家约翰内斯·开普勒的母亲卡塔琳娜，案子已拖了五年。8 月 7 日，她在霍伊马登的女儿家中被捕，后来从莱昂贝格转押到居格林根，看守费用由家里承担。那年 9 月，约翰内斯从林茨回来为母亲辩护。审理一拖再拖。1621 年秋，卡塔琳娜获释，距被捕已过了一年多。'
        story_prose:
          opening:
            - '1620 年，莱昂贝格。卡塔琳娜·开普勒受人指控，争讼已拖了五年。八月她在霍伊马登被捕，儿子约翰内斯于九月从林茨回来为她辩护。'
            - '史实里，她在居格林根被关了一年多，戴着锁链过冬，连看守的费用也由家里承担。在这条分支里，狱卒的妻子仍要端汤走上那条巷子，有人能够替她接一接锅，也能在案卷送走前看一眼纸上的字。'
            - '这一趟用得上管得住文书、分得清证词来路的人。能照顾老人、带得来御寒衣被的人，在入冬以后也有事可做。'
          points:
            p1: '卡塔琳娜被带到莱昂贝格后，{staff}照管文书的办法请保管人另抄一份，当面点过页数，再交存。收件人把副本放进待归档的纸叠。原件折回去时，{staff}用指腹把翘起的纸角压平。'
            p2: '{staff}陪家人把证词摊开，依次核对是谁看见的、听谁讲的、哪一段是后来推出来的。一页抄件上多了三栏，原先挤作一行的说法有了空隙。写到一个没人亲眼见过的地方，笔尖停在栏线前。'
            p3: '寒天里，{staff}同看守打点好，把厚衣被和一碗热饭送到挂着锁链的床边。她接碗前，先把被角往膝头掖了掖。铁环靠在床板上，双手慢慢合拢在热碗外面。'
          outcomes:
            all: '证词与申辩后来还能按页对读。卡塔琳娜在牢里有厚被和热饭，次年秋天获释时，家里人等在门外，手里带着一件能裹到下巴的外衣。'
            p3: '冬尽了，铁锁才不再冰得刺手。她熬过那个冬天，收拾铺位时，把厚被的两个角仔细对齐。'
            p2: '抄件到了律师手里。他在证人没有亲眼见到的几行旁作了记号，翻过一页，又把它翻回来。'
            p1: '那份申辩后来仍能在卷中找到。翻得多了，折起的纸角只剩一条发白的脊。'
          none: '墙边冷下来，汤面很快结了一层皮。窗外经过一辆车，铁轮碾过石缝，一声比一声远。'
          not_admitted: '{staff}没能进到保管案卷的屋里。门里的人挪开一捆纸，缚纸的绳子在桌上擦了一声。'
          desync: '缺了申辩的案卷已经合起。{staff}被召回时，桌边还留着一道方方的纸印。'
          excerpts:
            p3: '她接碗前，先把被角往膝头掖了掖。铁环靠在床板上，双手慢慢合拢在热碗外面。'
            p2: '一页抄件上多了三栏，原先挤作一行的说法有了空隙。写到一个没人亲眼见过的地方，笔尖停在栏线前。'
            p1: '收件人把副本放进待归档的纸叠。原件折回去时，{staff}用指腹把翘起的纸角压平。'
        relic: '一页申辩书抄本'
        relic_desc: '一页誊清的书面申辩，页边改过一个日期。'
        points:
          p1: '卡塔琳娜被带到莱昂贝格以后，请保管申辩书的人立刻另抄并交存一份，护住书面申辩继续进入程序'
          p2: '让家人整理原证词，逐项区分证人亲眼所见、由人转述和后来附上的推断'
          p3: '给居格林根牢里戴着锁链的卡塔琳娜送进厚衣被和热饭，让七十三岁的她熬过这个冬天'
        points_fail:
          p1: '家里能找到的那份申辩书没能转交。案卷只剩指控人的陈述，事务所因同步失败召回员工。'
          p2: '三种说法抄在同一栏。送进案卷以后，辩护人还要再追问最早是谁说的。'
          p3: '这条分支里，她照史实戴着锁链过冬，身边只有日夜看守的两个人，看守的费用还要家里出。'
        shift:
          p1:
            was: '卡塔琳娜于 1620 年 8 月被捕。约翰内斯·开普勒随后经律师坚持把程序落实在书面记录上。'
          p2:
            was: '审理留下证词及书面辩护。辩方逐项回应并反对把猜测当作说法之间的因果。'
            now: '送给律师的抄本可以按栏核查。辩护人先指出证人未能亲验的数项。'
          p3:
            was: '1620 年 8 月 7 日卡塔琳娜·开普勒被捕，押到居格林根，戴着锁链关押十四个月，两人日夜看守，费用由她和家人承担；1621 年秋获释，约半年后去世。'
            now: '{staff}替家里打点好看守，那个冬天她有厚被和热饭，锁链没有卸下，身子却比历史上撑得住些。'
            who: katharina_kepler
            bio: '这条时间线里，卡塔琳娜·开普勒在居格林根牢里的第一个冬天有厚被和热饭，1621 年秋获释时身子比历史上硬朗些。'
        vignettes:
          soup: '9 月 13 日，{staff}替狱卒的妻子端大麦汤走上居格林根的小巷。她说卡塔琳娜的碗很好认，每次送回来都刮得干净，还嫌盐少。锅盖一颠，她伸手把它按住。'
          hearing: '10 月 2 日，{staff}和文书各抱一捆案卷爬上市政厅台阶。开庭又改了日子。文书把两捆纸搁在台阶上，说这条路走了这么多回，早该自己认得了。'
          frost: '十一月中，{staff}搭运货马车往居格林根去。车夫说察伯河谷这一段一上冻，听车轮的音高就知道还有多远。车进河谷，他松了松缰绳，侧过耳朵。'
text:
  en:
    name: Johannes Kepler
    text: German astronomer, 1571 to 1630. He formulated three laws of planetary motion from the observations of Tycho Brahe. From 1620 to 1621 he defended his mother Katharina, who had been accused by her neighbours in Leonberg and was held in prison at Güglingen, until she was released.
  zh:
    name: 约翰内斯·开普勒
    text: 德国天文学家，1571 年生，1630 年去世。他根据第谷·布拉赫的观测归纳出行星运动三定律。1620 年至 1621 年，他的母亲卡塔琳娜被莱昂贝格的邻居告发，关在居格林根的牢里，他替她辩护，直到她获释。
quotes:
  kepler_requested_hearing:
    order: 1
    tier: full
    date: '1621-06-20'
    checked: official_record
    sources: [kepler_trial_letters_bavarian]
    original: de
    text:
      en:
        who: 'Johannes Kepler'
        quote: 'so I appeared on the 28th and at once asked for a hearing to contest the charge'
        occasion: 'Autograph petition to Duke Johann Friedrich of Württemberg, letter 917, p. 72. Kepler recalls appearing on 28 September 1620. The edition dates the letter 10 June 1621 Old Style, or 20 June Gregorian. Game translation.'
      zh:
        who: '约翰内斯·开普勒'
        quote: '于是我于二十八日到场，随即请求定期开庭答辩'
        occasion: '致符腾堡公爵约翰·弗里德里希的亲笔请愿书，第 917 封，第 72 页。开普勒回述他于 1620 年 9 月 28 日到场。信件日期为旧历 1621 年 6 月 10 日，即公历 6 月 20 日。游戏译文。'
      de:
        who: 'Johannes Kepler'
        quote: 'als hab Ich den 28 mich eingestelt, und gleich umb einen Gerichtstag zur litis contestation angehalten'
        occasion: 'Bittschrift an Johann Friedrich von Württemberg, Nr. 917, S. 72'
  kepler_year_unfinished:
    order: 2
    tier: none
    date: '1621-08-21'
    checked: official_record
    sources: [kepler_trial_letters_bavarian]
    original: la
    text:
      en:
        who: 'Johannes Kepler'
        quote: 'A year has come round, and my affairs are still unfinished.'
        occasion: 'Letter to Matthias Bernegger, letter 919, opening, p. 75, dated 11/21 August 1621. The autograph is unlocated. The academy edition cites the first printing of their correspondence in 1672. Game translation.'
      zh:
        who: '约翰内斯·开普勒'
        quote: '一年过去了，我的事情仍未了结。'
        occasion: '致马蒂亚斯·贝内格尔的信，第 919 封，第 75 页开篇，署旧历 1621 年 8 月 11 日、公历 8 月 21 日。亲笔原件下落不明，科学院版注明两人通信于 1672 年首次刊印。游戏译文。'
      la:
        who: 'Johannes Kepler'
        quote: 'Annus circumagitur, nec dum negotia mea finem habent.'
        occasion: 'Epistola ad Matthiam Berneggerum, no. 919, p. 75, initium'
hook: {en: 'His mother waited in chains for a hearing', zh: '母亲戴着锁链等开庭'}
facts:
  arrest:
    date: '1620-08-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest, kepler_leonberg_stuttgart_archives, katharina_kepler_wiki]
    text:
      en: 'On 7 August 1620 Katharina Kepler was arrested at Heumaden, in the house of her daughter Margaretha, where she was living. The proceedings began at Leonberg under the governor of that district; at the request of her son Christoph, who feared for his trade in the town, her imprisonment and trial were moved to Güglingen.'
      zh: '1620 年 8 月 7 日，卡塔琳娜·开普勒在霍伊马登被捕，她那时住在女儿玛格丽塔家里。案子先由莱昂贝格的地方官开审；她的儿子克里斯托夫怕在城里的生意受连累，请求把关押和审理移到居格林根。'
    note: 'An imprisonment: written as a plain fact.'
    line:
      en: '7 August 1620: Katharina Kepler is arrested at Heumaden; the case against her begins at Leonberg.'
      zh: '1620 年 8 月 7 日，卡塔琳娜·开普勒在霍伊马登被捕，案子在莱昂贝格开审。'
  charged:
    date: '1620-09-04'
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest]
    text:
      en: 'In his petition to the duke Johannes Kepler set out the dates: his mother was charged with a capital offence at Güglingen on 4 September 1620, was to answer on 13 September, and was granted a delay until he arrived.'
      zh: '约翰内斯·开普勒在呈给公爵的申诉里列出日期：1620 年 9 月 4 日，他的母亲在居格林根被控死罪，本应 13 日答辩，获准延到他来了再说。'
    note: 'A capital charge: written as a plain fact.'
    line:
      en: '4 September 1620: at Güglingen, Katharina is charged with a capital offence.'
      zh: '1620 年 9 月 4 日，卡塔琳娜在居格林根被控死罪。'
  kepler_arrives:
    date: '1620-09-28'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest, kepler_meteorological_diary_study]
    text:
      en: 'Johannes Kepler returned to Württemberg in September 1620 to defend his mother. The proceedings account dates his arrival to 28 September; the study of his weather diaries dates his first meeting with her in custody to 26 September.'
      zh: '1620 年 9 月，约翰内斯·开普勒回到符腾堡替母亲辩护。诉讼研究把他的抵达记在 9 月 28 日，气象日记研究则把他首次探监记在 9 月 26 日。'
    line:
      en: 'September 1620: Johannes Kepler returns from Linz to defend his mother.'
      zh: '1620 年 9 月，约翰内斯·开普勒从林茨回来，为母亲辩护。'
  postponed:
    date: '1620-10-02'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest]
    text:
      en: 'A court date was granted for 2 October 1620, then put off again for ten weeks, until 11 December.'
      zh: '开庭的日子定在 1620 年 10 月 2 日，又往后推了十个星期，推到 12 月 11 日。'
    line:
      en: '2 October 1620: the hearing set for today is put off by ten weeks, to 11 December.'
      zh: '1620 年 10 月 2 日，原定这天的开庭又推后十个星期，推到 12 月 11 日。'
  witnesses:
    date: '1621-01-08'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest]
    text:
      en: 'After the holidays, on 8 January 1621, the swearing in of the witnesses began.'
      zh: '过了年节，1621 年 1 月 8 日，证人开始宣誓作证。'
    line:
      en: '8 January 1621: at Güglingen the witnesses begin to be sworn.'
      zh: '1621 年 1 月 8 日，居格林根开始让证人宣誓作证。'
  defence:
    date: '1621-05-07'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [kepler_leonberg_arrest]
    text:
      en: 'The written defence of Katharina Kepler was presented to the ducal advocate on 7 May 1621. It answered the claims of the witnesses one by one and argued that each spoke only for himself, of things he had not seen done.'
      zh: '1621 年 5 月 7 日，卡塔琳娜·开普勒的书面申辩交到公爵的检察官手里。申辩逐条回应证人的说法，指出每个证人只说自己的一面，说的又不是亲眼看见的事。'
    line:
      en: '7 May 1621: the written defence of Katharina Kepler is handed in, answering each witness in turn.'
      zh: '1621 年 5 月 7 日，卡塔琳娜·开普勒的书面申辩交上去，逐个回应证人。'
  costs:
    date: '1621'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [kepler_leonberg_stuttgart_archives, katharina_kepler_wiki]
    text:
      en: 'Two men guarded her day and night, and the family paid for them. The trial cost Johannes Kepler more than 900 guilders, over two years of his salary, swollen by the delays and by the charges for heating, food and the two guards.'
      zh: '两个人日夜看守她，看守的钱由家里出。这场官司花了约翰内斯·开普勒九百多古尔登，比他两年的薪俸还多，拖延和取暖、伙食、两名看守的费用把它越抬越高。'
  released:
    date: '1621'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [kepler_leonberg_released, kepler_leonberg_stuttgart_archives, katharina_kepler_wiki]
    text:
      en: 'Katharina Kepler would confess nothing, and in the autumn of 1621, after 405 days in custody, she was released.'
      zh: '卡塔琳娜·开普勒什么也不肯认，1621 年秋，关了四百零五天以后，她获释出狱。'
    note: 'An imprisonment: written as a plain fact.'
    line:
      en: 'Autumn 1621: after 405 days in custody, Katharina Kepler is released.'
      zh: '1621 年秋，关了四百零五天的卡塔琳娜·开普勒获释。'
  death:
    date: '1622'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [katharina_kepler_wiki, kepler_leonberg_stuttgart_archives]
    text:
      en: 'Katharina Kepler died in April 1622 at Roßwälden, about six months after her release.'
      zh: '1622 年 4 月，卡塔琳娜·开普勒在罗斯韦尔登去世，离获释约半年。'
    note: 'A death: written as a plain fact.'
    line:
      en: 'April 1622: Katharina Kepler dies, about six months after her release.'
      zh: '1622 年 4 月，卡塔琳娜·开普勒去世，离获释约半年。'
