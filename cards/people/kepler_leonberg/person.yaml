    scene:
      points:
        - {id: p1, kind: persuade, req: {"any":[{"trait":["glib","charismatic"]},{"trait":["glib","scholarly","ambitious"]}]}}
        - {id: p2, kind: hold, req: {"any":[{"trait":["bold","faithful","ambitious"]},{"trait":["cheerful","bold","vigil"]}]}}
        - {id: p3, kind: trust, redeem: true, req: {"any":[{"trait":["kind","charismatic","artistic"]},{"trait":["sensitive","artistic","cosmopolitan"]},{"trait":["attached"]}]}}
