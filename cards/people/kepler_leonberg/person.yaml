    text:
      en:
        name: 'What the witness saw'
        place: "Leonberg"
        figure: "Johannes Kepler"
        story: 'In his defence of his mother Katharina, Johannes Kepler dated her arrest to 7 August 1620 and set out the delays in the proceedings at Güglingen. This visit starts among her papers in Leonberg.'
        relic: 'A checked defence copy'
        relic_desc: 'A fictional copying sheet with one corrected date.'
        points:
          p1: 'After Katharina is brought to Leonberg, have the keeper of the defense papers file a second copy so her written response reaches the proceedings'
          p2: 'Help the family sort firsthand testimony, hearsay and later inferences into separate columns'
          p3: 'Keep a signed witness index and handover dates with the lawyer in Leonberg so Katharina''s family knows where to ask next'
        points_fail:
          p1: 'The only copy the family can find is never delivered. The file has only the accusations, and the office recalls the employee.'
          p2: 'The copy puts all three together. Once it reaches the file, the defense still has to ask who originally said what.'
          p3: 'After the file moves, relatives make separate inquiries. Written replies stay in different places.'
        shift:
          p1:
            was: 'Katharina was arrested in August 1620. Through lawyers, Johannes Kepler insisted on a written record of the proceedings.'
          p2:
            was: 'Testimony and written defenses survive. The defense answered claims one by one and challenged inferences used to link them.'
            now: 'The lawyer can compare the three columns and point to claims the witnesses could not verify for themselves.'
          p3:
            was: 'The case passed between Leonberg and Güglingen and met delays. Katharina was released in 1621.'
            now: 'Delivery dates let the lawyer trace several unanswered items and obtain a written response to one. The family can cite the date when following up.'
            who: kepler_leonberg
            bio: 'Kepler''s defense of his mother involved checking testimony and insisting on written proceedings. The family still needed access to the papers after the case moved.'
        vignettes:
          heard: 'Margarete has written that a neighbour saw something. When you ask which neighbour, she can only name the man who repeated it at the door. She copies the two claims onto separate lines and leaves a place for a first-hand account if one comes.'
          compare: 'Matthias wants to send the first copy now and keep the second at the desk. You read one against the other and find that a date has lost a digit. He waits while Margarete checks the original. The messenger takes the corrected copy as the bells finish striking.'
          release: 'You know Katharina will eventually be released. Margarete asks what should go on the packet she has in her hands today. You write the day of dispatch and help her dry the ink. The date of release still lies beyond this visit.'
      zh:
        name: '证人亲眼看见的事'
        place: "莱昂贝格"
        figure: "约翰内斯·开普勒"
        story: '约翰内斯·开普勒为母亲卡塔琳娜辩护时，把她被捕的日子记为1620年8月7日，也逐一写下居格林根诉讼的拖延。'
        relic: '一页核对过的辩护文书练习稿'
        relic_desc: '抄写练习，有一处改过日期。'
        points:
          p1: '卡塔琳娜被带到莱昂贝格以后，请保管申辩书的人立刻另抄并交存一份，护住书面申辩继续进入程序'
          p2: '让家人整理原证词，逐项区分证人亲眼所见、由人转述和后来附上的推断'
          p3: '在莱昂贝格留一份经律师签收的证词对照和转交日期，让卡塔琳娜的家人能查下一步该问哪个衙署'
        points_fail:
          p1: '家里能找到的那份申辩书没能转交。案卷只剩指控人的陈述，事务所因同步失败召回员工。'
          p2: '三种说法抄在同一栏。送进案卷以后，辩护人还要再追问最早是谁说的。'
          p3: '案卷转走以后，家人仍各自托人询问，书面答复散在不同地方。'
        shift:
          p1:
            was: '卡塔琳娜于 1620 年 8 月被捕。约翰内斯·开普勒随后经律师坚持把程序落实在书面记录上。'
          p2:
            was: '审理留下证词及书面辩护。辩方逐项回应并反对把猜测当作说法之间的因果。'
            now: '送给律师的抄本可以按栏核查。辩护人先指出证人未能亲验的数项。'
          p3:
            was: '诉讼跨越莱昂贝格和居格林根。辩护及审理拖延，直至 1621 年卡塔琳娜方获释放。'
            now: '律师从接收和转交的日期查出几件久无回音的材料，先收到一项书面说明。家人以后据此追问案程。'
            who: kepler_leonberg
            bio: '开普勒为母亲的辩护重视逐项核对证词和书面程序。家人还须在案件移交后继续取得材料。'
        vignettes:
          heard: '玛格丽特写着有邻居亲眼看见。你问是哪位邻居，她只叫得出在门边转述的那个人。她把两种说法分成两行，又给可能收到的亲历说法留个位置。'
          compare: '马蒂亚斯想先送出一份，另一份留桌上。你照着念了两遍，发现有个日期漏了一位数字。他等玛格丽特找原稿核对。钟声刚停，送件人带着改好的副本走了。'
          release: '你知道卡塔琳娜终会获释。玛格丽特问，今天手里这包纸该写什么。你写上送出的日期，帮她等墨晾干。获释的日子这趟还等不到。'
text:
  en:
    name: Johannes Kepler
    text: German astronomer, 1571 to 1630. He formulated three laws of planetary motion from the observations of Tycho Brahe. In 1620 his mother was tried for witchcraft at Leonberg, and he helped her defence.
  zh:
    name: 约翰内斯·开普勒
    text: 德国天文学家，1571 年生，1630 年去世。他根据第谷·布拉赫的观测归纳出行星运动三定律。1620 年他的母亲在莱昂贝格因巫术受审，他协助辩护。
hook: {en: 'Who actually saw what the statement describes?', zh: '这句话写的事，谁亲眼看见？'}
