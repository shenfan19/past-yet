    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 14, req: {"any":[{"job":["archivist","translator"]},{"trait":["methodical","vigil"],"stat":{"will":6}}]}}
        - {id: p2, kind: notice, day: 36, req: {"any":[{"job":["archivist","translator","proofreader"]},{"trait":["methodical","vigil","curious"],"stat":{"wit":6}}]}}
        - {id: p3, kind: care, day: 130, req: {"any":[{"job":["nurse","caregiver","midwife","physician","doctor","paramedic"],"stat":{"will":6}},{"item":"warm_blanket","trait":["kind","patient","faithful"],"stat":{"will":6}}]}}
