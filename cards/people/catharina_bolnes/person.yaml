text:
  en:
    name: Catharina Bolnes
    text: Born about 1631 and died in 1687, the daughter of Maria Thins. She married Johannes Vermeer in Delft on 20 April 1653 and bore him fifteen children, eleven of whom were living when he died in December 1675. Early in 1676 she gave two of his paintings to the baker against a bread debt, passed The Art of Painting to her mother, and in April asked the High Court to relieve her of the debts.
  zh:
    name: 卡塔琳娜·博尔内斯
    text: 约 1631 年生，1687 年去世，玛丽亚·廷斯的女儿。1653 年 4 月 20 日，她在代尔夫特嫁给约翰内斯·维米尔，生了十五个孩子，1675 年 12 月丈夫去世时还有十一个活着。1676 年初，她把丈夫的两幅画交给面包商抵面包钱，把《绘画艺术》转到母亲名下，4 月又请求高等法院免去她的债。
