    scene:
      star_rules: 2
      points:
        - {id: p1, kind: trust, day: 30, req: {"any":[{"trait":["kind","sensitive","patient","calm","attached"],"stat":{"will":7}},{"job":["musician","teacher","tutor","writer","caregiver"],"stat":{"will":7}},{"provides":"calm","trait":["kind","sensitive","patient","calm","attached"],"stat":{"will":5}}]}}
      vignettes:
        - {id: later, traits: [bold, curious]}
