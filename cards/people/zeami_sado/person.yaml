quotes:
  zeami_sado_story_echo_full:
    order: 1
    tier: full
    date: '1424'
    checked: official_record
    sources: [zeami_sado_story_echo_source_full]
    original: ja
    text:
      en:
        who: 'Zeami'
        quote: 'One must not forget the beginnings.'
        occasion: 'From Kakyō, where Zeami speaks of beginnings at different stages of experience.'
      zh:
        who: '世阿弥'
        quote: '不可忘记初学之时。'
        occasion: '《花镜》论不同阶段的初学之心。'
      ja:
        who: 'Zeami'
        quote: '初心不可忘'
        occasion: 'From Kakyō, where Zeami speaks of beginnings at different stages of experience.'
      fr:
        who: 'Zeami'
        quote: 'Il ne faut pas oublier les débuts.'
        occasion: 'De Kakyō, où Zeami parle de débuts à différentes étapes de l''expérience.'
      es:
        who: 'Zeami'
        quote: 'No hay que olvidar los comienzos.'
        occasion: 'De Kakyō, donde Zeami habla de comienzos en diferentes etapas de la experiencia.'
      ko:
        who: '제아미'
        quote: '시작을 잊어서는 안됩니다.'
        occasion: 'Zeami가 경험의 다양한 단계에서의 시작에 대해 말하는 Kakyō에서.'
      ru:
        who: 'Дзэами'
        quote: 'Нельзя забывать истоки.'
        occasion: 'Из Какё, где Дзеами говорит о началах на разных стадиях опыта.'
      zh-Hant:
        who: '世阿彌'
        quote: '不可忘記初學之時。'
        occasion: '《花鏡》論不同階段的初學之心。'
  zeami_sado_story_echo_none:
    order: 2
    tier: none
    date: '1400'
    checked: official_record
    sources: [zeami_sado_story_echo_source_none]
    original: ja
    text:
      en:
        who: 'Zeami'
        quote: 'Kept hidden, it can be the flower. Without concealment it cannot bloom.'
        occasion: 'From the oral instructions collected with Fūshikaden, on withholding a device to keep the audience’s surprise. The date is the approximate period of the work.'
      zh:
        who: '世阿弥'
        quote: '藏而不露，方能成花。若一味显露，便无花可言。'
        occasion: '《风姿花传》别纸口传，谈表演中保留可给观众带来意外的东西。日期为著作的大致写作时期。'
      ja:
        who: 'Zeami'
        quote: '秘すれば花なり、秘せずは花なるべからず'
        occasion: 'From the oral instructions collected with Fūshikaden, on withholding a device to keep the audience’s surprise. The date is the approximate period of the work.'
      fr:
        who: 'Zeami'
        quote: 'Gardée cachée, elle peut être la fleur. Sans dissimulation, il ne peut pas fleurir.'
        occasion: 'D’après les instructions orales recueillies auprès de Fūshikaden, sur la rétention d’un dispositif pour garder la surprise du public. La date est la période approximative des travaux.'
      es:
        who: 'Zeami'
        quote: 'Mantenida oculta, puede ser la flor. Sin ocultamiento no puede florecer.'
        occasion: 'De las instrucciones orales recopiladas con Fūshikaden, sobre cómo retener un dispositivo para mantener la sorpresa de la audiencia. La fecha es el período aproximado de la obra.'
      ko:
        who: '제아미'
        quote: '숨겨두면 꽃이 될 수 있어요. 숨기지 않고는 꽃을 피울 수 없습니다.'
        occasion: 'Fūshikaden에서 수집한 구두 지침에서 청중의 놀라움을 유지하기 위한 장치를 보류하는 방법에 대해 설명합니다. 날짜는 대략적인 작업 기간입니다.'
      ru:
        who: 'Дзэами'
        quote: 'Если спрятать, это может быть цветок. Без сокрытия оно не может цвести.'
        occasion: 'Из устных инструкций, собранных с Фушикаденом, о том, как скрывать устройство, чтобы не вызвать удивления публики. Дата является приблизительным периодом работы.'
      zh-Hant:
        who: '世阿彌'
        quote: '藏而不露，方能成花。若一味顯露，便無花可言。'
        occasion: '《風姿花傳》別紙口傳，談表演中保留可給觀眾帶來意外的東西。日期為著作的大致寫作時期。'
