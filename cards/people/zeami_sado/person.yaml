    text:
      en:
        name: 'The island on the page'
        place: "Sado Island"
        figure: "Zeami"
        story: 'Zeami’s son Motomasa died in 1432. Zeami wrote about the loss in Kyakuraika before he was exiled to Sado in 1434. Kintōsho, the collection of chants that recalls his journey and exile on the island, is dated 1436.'
        relic: "A Noh mask"
        relic_desc: "A small wooden mask with a fine line of lacquer between the brows."
        points:
          p1: 'Ask Zeami whether he wants someone to read a line with him on Sado. If he agrees, help the reader keep his pause on a detachable slip'
        points_fail:
          p1: 'The reader has to leave before Zeami can hear the line aloud. A mark on the page will have to wait.'
        shift:
          p1:
            was: 'Zeami’s surviving writings include the lament for his son and Kintōsho, which recalls his exile on Sado.'
            now: 'In this branch Zeami hears a reader try a line of his in two ways. He chooses where the reader should pause and keeps the slip beside his own page.'
        vignettes:
          later: 'You tell the reader that people will still use the name in books about Sado. He tries the words as a place name, then as something a person longs for. You mark both pauses on a slip. The boat that brought Zeami to Sado has already gone.'
          mask: 'The reader holds up a practice mask and loses his place when he lowers it. You mark the start of the line on a loose slip and prop it where he can find it again. The mask goes back on its peg. You miss the reading after yours.'
          wind: 'A draught scatters the reading slips. You help the reader recover one from under the bench and hold it down with a pebble. He reads that line once more. When you leave, the paper stays under the stone and you carry the pause away in your notes.'
      zh:
        name: '纸上的金岛'
        place: "佐渡岛"
        figure: "世阿弥"
        story: '1432 年，世阿弥的儿子元雅去世。世阿弥在《却来华》中写到这场失去，1434 年被流放佐渡。《金岛书》记着他渡海和在岛上的经历，定稿记年为 1436 年。'
        relic: "一张能面"
        relic_desc: "一张小小的木面，眉间有细细的漆痕。"
        points:
          p1: '问佐渡岛上的世阿弥愿不愿听人读一行，听完以后，把他选的停顿另记在纸条上'
        points_fail:
          p1: '念词人还没来得及让世阿弥听见这一行，就得先回去了。停在哪儿，纸上还没记。'
        shift:
          p1:
            was: '世阿弥留下了缅怀元雅的文字，也留下了记佐渡流放的《金岛书》。'
            now: '这条分支里，世阿弥听过同一行的两种念法，亲自挑了停顿的位置，把纸条留在自己那页旁边。'
        vignettes:
          later: '你告诉虚构的念词人，后来写佐渡的书还会提到这个名字。他先像念地名一样试一遍，再念得像一个人对着远处想什么。你记下两个停顿。载世阿弥来岛的船，你已经赶不上了。'
          mask: '念词人举起练习用的面具，放下时找不到念到哪儿。你拿一张散纸标出那行的起头，立在他伸手就能找见的位置。面具挂回钩上，下一轮念词你没能留下听。'
          wind: '风把念词纸吹散。你从长凳底下拾回一张，用小石子压住。念词人把那一行又念了一遍。你走时纸还压在石头下，记下来的只有那一处停顿。'
text:
  en:
    name: "Zeami"
    text: "Japanese Noh actor and playwright, born about 1363, died about 1443. He left several treatises on Noh and was exiled to Sado Island in 1434."
  zh:
    name: "世阿弥"
    text: "日本能乐演员和剧作家，约 1363 年生，约 1443 年去世。他留下多部关于能乐的论著，1434 年被流放到佐渡岛。"
hook: {en: 'Where does he want the reader to pause?', zh: '这一行，世阿弥想让人停在哪里？'}
facts:
  motomasa:
    date: '1432-08'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [zeami_sado_amano, zeami_sado_motomasa]
    text:
      en: 'In the eighth month of 1432 Zeami''s eldest son Kanze Motomasa died away from home at Anotsu in Ise.'
      zh: '1432 年 8 月，世阿弥的长子观世元雅客死伊势安浓津。'
  lament:
    date: '1433'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [zeami_sado_amano]
    text:
      en: 'Some seven months after Motomasa''s death Zeami wrote at the opening of Kyakuraika that with Motomasa gone the way of their school had been cut off.'
      zh: '元雅去世约七个月后，世阿弥在《却来华》开头写道，元雅一死，这一流的道已经断绝。'
  island:
    date: '1434'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [zeami_sado_island, zeami_sado_ntj]
    text:
      en: 'Zeami was exiled to Sado in 1434; no official record of the sentence survives. On the island he wrote Kintōsho, dated 1436, which calls Sado an island of gold.'
      zh: '1434 年世阿弥被流放佐渡，判罪的官方记录没有留存。他在岛上写下《金岛书》，书成于 1436 年，称佐渡为金之岛。'
    line:
      en: 'Sado: Zeami, past seventy, lives out his exile on the island.'
      zh: '佐渡，年过七十的世阿弥在岛上过着流放的日子。'
  published:
    date: '1909'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [zeami_sado_corpus, zeami_sado_nearman]
    text:
      en: 'Zeami''s treatises were handed down in secret and were published only in 1909, when the historian Yoshida Tōgo edited sixteen of them.'
      zh: '世阿弥的论著秘传数百年，1909 年才由史学家吉田东伍整理十六部刊行。'
  mask_tradition:
    date: '1434'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [zeami_sado_mask_tradition]
    text:
      en: 'The city''s property record attributes the association of a particular mask with Zeami to local tradition.'
      zh: '市政府文物档案把某面具与世阿弥的关联记作当地传说。'
