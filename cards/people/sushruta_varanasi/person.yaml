        place: "瓦拉纳西"
        figure: "妙闻"
        story: "传说中的医者妙闻在他的手册里讲述外科手术、器械和整形，给学徒在模型上练习的办法。"
        relic: "一把青铜手术刀"
        relic_desc: "一把窄窄的青铜刀，刃口磨得很薄。"
        points:
          p1: "看他怎样处理伤口"
          p2: "稳住一次缝合"
          p3: "同学徒们一起练习"
text:
  en:
    name: "Sushruta"
    text: "Physician of ancient India, traditionally credited as the author of the Sushruta Samhita, which covers surgery, instruments and plastic repair. His dates, and whether he was one person, are disputed."
  zh:
    name: "妙闻"
    text: "古印度医者，传统上被认为是《妙闻集》的作者，书中有外科手术、器械和整形的内容。他生活的年代和是否为同一个人都有争议。"
