text:
  en:
    name: Al-Khwarizmi and the House of Wisdom
    text: Al-Khwarizmi and the scholars of the House of Wisdom in Baghdad, a centre of translation and research under the Abbasid caliphs in the ninth century. Texts from Greek, Persian, Syriac and Sanskrit were translated into Arabic and extended there.
  zh:
    name: 花拉子米与智慧宫
    text: 花拉子米与巴格达智慧宫的学者们。智慧宫是九世纪阿拔斯哈里发治下的翻译与研究中心，希腊文、波斯文、叙利亚文和梵文的典籍在那里被译成阿拉伯文并有所发展。
