    text:
      en: 'On the sixth day Xu stayed to collate books, received food from Mu Zeng, and recorded that he had no time to climb to Gongshou Terrace or Lion Cliff.'
      zh: '二月初六，徐霞客留解脱林校书，木增遣人馈食。徐霞客记下拱寿台与狮子崖都因校书未及攀登。'
    line: {en: 'On the sixth day of the second lunar month in 1639, Xu stayed at Jietuo Lin to collate books.', zh: '1639 年二月初六，徐霞客留在解脱林校书。'}
  departure:
    date: '1639'
    stay_day: 19
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [xu_xiake_lijiang_diary, xu_xiake_lijiang_diary7]
    text: {en: 'On the eighth day, the messenger took the books away at dawn. Xu then rode down the mountain in the rain.', zh: '二月初八，送信的人黎明带书离开。徐霞客随后冒雨骑马下山。'}
    line: {en: 'On the eighth day of the second lunar month in 1639, Xu rode down from Jietuo Lin in the rain.', zh: '1639 年二月初八，徐霞客冒雨离开解脱林。'}
  commission:
    date: '1639'
    stay_day: 20.1
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [xu_xiake_lijiang_diary, xu_xiake_lijiang_diary7]
    text: {en: 'On the ninth day Mu Zeng sent thanks for the collated volumes and wrote again asking Xu to compile the Gazetteer of Mount Ji.', zh: '二月初九，木增遣人酬谢校书，并再次致书请求徐霞客编修《鸡山志》。'}
    line: {en: 'On the ninth day of the second lunar month in 1639, a letter again asked Xu to compile the Gazetteer of Mount Ji.', zh: '1639 年二月初九，徐霞客收到再次请他修《鸡山志》的书信。'}
