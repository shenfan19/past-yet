    text:
      en: 'The entries for the sixth and seventh days describe Jietuo Lin facing east on the hillside and mention a wall picture showing Gugang.'
      zh: '初六及初七日条写解脱林在山半，面东，以翠屏相对。徐霞客说他在后轩壁图上得知古冈的景致。'
