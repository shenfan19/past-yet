    text:
      en:
        name: 'The path he did not have time to climb'
        place: "Lijiang"
        figure: "Xu Xiake"
        story: 'In the second lunar month of 1639, Xu Xiake stayed at Jietuo Lin in Lijiang, collating books for Mu Zeng, who sent him food and later gifts in thanks. Xu heard that Gongshou Terrace and Lion Cliff lay above the monastery. He wrote that the pressure of the work left him no time to climb either one.'
        relic: "A route sketch from Jietuo Lin"
        relic_desc: "A folded sketch with a line up the slope and an empty margin beside the fork."
        points:
          p1: 'Check the return of the corrected volumes with the messenger, so Mu Zeng can acknowledge the work and renew his request for the Gazetteer of Mount Ji'
          p2: 'Free up half a day, find a local guide and an escort, and walk from Jietuo Lin to Gongshou Terrace with Xu'
          p3: 'Walk the fork below Lion Cliff with Xu and leave a copy of the new route notes with the monastery'
        points_fail:
          p1: 'The returned volumes lack receipts. The messenger cannot confirm the earlier work was done, the handover is missed, and the office recalls the employee.'
          p2: 'The day''s copying fills the afternoon. Gongshou Terrace stays in the diary as a place Xu heard about.'
          p3: 'Xu leaves Lijiang without a route from his own steps to set down beside the directions he heard.'
        shift:
          p1:
            was: 'On the ninth day of the second lunar month in 1639, Mu Zeng sent gifts in thanks for the collating and again asked Xu to compile the Gazetteer of Mount Ji.'
          p2:
            was: 'On the sixth day of the second lunar month in 1639, Xu wrote that he had been too busy collating to climb to Gongshou Terrace or Lion Cliff.'
            now: 'With the collation delivered, {staff} takes Xu back to Jietuo Lin to meet the guide and escort. Xu climbs the terrace and notes where the opposite slope comes into view.'
          p3:
            was: 'In 1639, the Lijiang diary mentioned Lion Cliff as somewhere Xu heard lay higher up and had no time to climb.'
            now: '{staff} walks the fork with Xu in both directions. Xu marks the bend where the paths double back and leaves a copy of the sketch at Jietuo Lin.'
            who: xu_xiake_lijiang
            bio: 'Xu''s Lijiang diary carries an extra firsthand entry between the collation and his departure. A second copy of his sketch stays with Jietuo Lin.'
        vignettes:
          view: 'The guide describes a bend by the mountain it faces. {staff} asks him how many turns there are before it. The view and the way to get there go on different lines.'
          trail: 'The escort takes the steep way to the steps and arrives with wet cuffs. {staff} hangs a dry cloth by the door and moves the nearly finished pages farther inside.'
          slope: 'At the monastery steps {staff} pulls out a fresh leaf. The dispatch for Mu Zeng goes back in its box. The blank leaf is for the route.'
        remarks:
          trait_methodical: '{staff} adds an arrow to the sketch so the next traveller will know which way is uphill.'
      zh:
        name: '校书之外的半日'
        place: "丽江"
        figure: "徐霞客"
        story: '1639 年二月，徐霞客住在丽江解脱林，为木增校书。木增遣人送来酒食，校书后又送礼酬谢。徐霞客听说寺后高处有拱寿台、狮子崖，日记里写校书催得紧，两处都没来得及登。'
        relic: "一张解脱林步行图"
        relic_desc: "一张折过的步行图，坡路用线画出，岔口旁留着空白。"
        points:
          p1: '跟送书人核清校过的卷册已经交回，赶上木增初九酬谢和续修《鸡山志》的委托'
          p2: '从校书之后腾出半日，请本地人带路、护卫同行，陪徐霞客从解脱林一步步走上拱寿台'
          p3: '陪徐霞客沿狮子崖下的岔路往返，记下从哪儿开始折回，离开前给寺里留一份'
        points_fail:
          p1: '退回的几卷还缺着签记，来请修志的人无法确认校书已完，这次交接错过，事务所召回员工。'
          p2: '等书卷合上，已经走不了这一趟。拱寿台在日记里仍是听来的地名。'
          p3: '徐霞客离开丽江时，没能把亲脚丈量过的路线补到听来的路引旁。'
        shift:
          p1:
            was: '1639 年二月初九，木增遣人送礼酬谢校书，并再次致书请徐霞客修《鸡山志》。'
          p2:
            was: '1639 年二月初六，徐霞客写校书催得紧，没来得及登拱寿台和狮子崖。'
            now: '书卷交清后，{staff}陪徐霞客回解脱林，和向导、护卫会合。徐霞客登上拱寿台，记下走到哪里才看得见对面的山。'
          p3:
            was: '1639 年的丽江日记把狮子崖记为听说在寺后高处、因校书未及攀登的地方。'
            now: '{staff}陪徐霞客从两个方向各走一遍岔口。徐霞客标出路折回的那一弯，给解脱林留了一份草图。'
            who: xu_xiake_lijiang
            bio: '徐霞客的丽江日记在校书和出关之间多了一篇亲历。解脱林另留一份足迹草图。'
        vignettes:
          view: '向导用一座对面的山来指弯道。{staff}问到那里之前要转几次弯，才把望见的山和脚下的路各写一行。'
          trail: '护卫从陡坡走到石阶，袖口已经湿透。{staff}把干布挂在门边，再把快校完的稿页往里挪。'
          slope: '在解脱林门槛上，{staff}另抽出一张纸。给木增的还书单放回木匣，走路要记的留在手里。'
        remarks:
          trait_methodical: '{staff}在草图上多画了一个箭头，下一位走到岔口便知道哪边是上坡。'
text:
  en:
    name: Xu Xiake
    text: Chinese traveller of the Ming, 1587 to 1641. For some thirty years he walked through the mountains and caves of China, and his notes were edited into the Travels of Xu Xiake, with careful descriptions of karst landscapes.
  zh:
    name: 徐霞客
    text: 明代旅行家，1587 年生，1641 年去世。约三十年里他徒步走过中国的山川和洞穴，笔记后来被整理为《徐霞客游记》，对岩溶地貌有细致描述。
hook: {en: 'Can he spare half a day to climb?', zh: '还有半日，能上山吗'}
