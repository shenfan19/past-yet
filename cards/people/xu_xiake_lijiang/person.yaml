    text:
      en:
        name: 'The path he did not have time to climb'
        place: "Lijiang"
        figure: "Xu Xiake"
        story: 'In the second lunar month of 1639, Xu Xiake stayed at Jietuo Lin in Lijiang, collating books for Mu Zeng, who sent him food and later gifts in thanks. Xu heard that Gongshou Terrace and Lion Cliff lay above the monastery. He wrote that the pressure of the work left him no time to climb either one.'
        story_prose:
          opening:
            - 'Lijiang, the second lunar month of 1639. Xu Xiake is checking books for Mu Zeng at Jietuolin. He hears that Gongshou Terrace and Lion Cliff lie higher up behind it and writes their names in his diary.'
            - 'In history, the books kept him too busy to visit either place. Mu Zeng later sent gifts in thanks and asked him again to revise the record of Jizu Mountain. In this branch, the return list and the paper for the walk lie together.'
            - 'This trip needs someone who can check volumes and see them safely delivered. It also needs someone who can keep pace with a guide and escort and remember where the path turns back.'
          points:
            p1: '{staff} checks the volumes against the return list and asks the messenger which have already been handed over. The messenger lays the receipt on top. The pages underneath sit neatly in the box, with one narrow tab still showing outside.'
            p2: 'When the books are handed in, {staff} asks a local guide to lead the way and climbs to Gongshou Terrace with Xu and the escort. The mountain opposite comes into view step by step. When Xu can see it all, he makes a mark at the edge of his page.'
            p3: '{staff} walks the fork below Lion Cliff with Xu from both directions and shows him where the path turns back. The sketch is later set inside the threshold at Jietuolin. Folded to the last section, the bend is still whole on the page.'
          outcomes:
            all: 'After the books went back, the walk also found its way into the diary. When the sketch left at Jietuolin was opened, two paths turned beside two separate creases.'
            p3: 'A sketch remained at Jietuolin. Someone pointed to the bend below Lion Cliff and folded it again.'
            p2: 'The account of Lijiang now held a place Xu had stood himself. He turned back to the page and rested a finger on the line where the mountain first came into view.'
            p1: 'Mu Zeng later sent his thanks and renewed his request. When the reply was put away, the tabs on the volumes still lay in a row.'
          none: 'The box closed. A spare sheet curled beside the threshold, its loose end brushing the ground.'
          not_admitted: '{staff} did not find a place with the people checking books. Inside the door someone moved a box, and the lid knocked.'
          desync: 'The volumes went unchecked before delivery. When {staff} was recalled, a list by the chest was still only half marked.'
          excerpts:
            p3: 'The sketch is later set inside the threshold at Jietuolin. Folded to the last section, the bend is still whole on the page.'
            p2: 'The mountain opposite comes into view step by step. When Xu can see it all, he makes a mark at the edge of his page.'
            p1: 'The messenger lays the receipt on top. The pages underneath sit neatly in the box, with one narrow tab still showing outside.'
        relic: "A route sketch from Jietuo Lin"
        relic_desc: "A folded sketch with a line up the slope and an empty margin beside the fork."
        points:
          p1: 'Check the return of the corrected volumes with the messenger, so Mu Zeng can acknowledge the work and renew his request for the Gazetteer of Mount Ji'
          p2: 'Free up half a day, find a local guide and an escort, and walk from Jietuo Lin to Gongshou Terrace with Xu'
          p3: 'Walk the fork below Lion Cliff with Xu and leave a copy of the new route notes with the monastery'
        points_fail:
          p1: 'The returned volumes lack receipts. The messenger cannot confirm the earlier work was done, the handover is missed, and the office recalls the employee.'
          p2: 'The day''s copying fills the afternoon. Gongshou Terrace stays in the diary as a place Xu heard about.'
          p3: 'Xu leaves Lijiang without a route from his own steps to set down beside the directions he heard.'
        shift:
          p1:
            was: 'On the ninth day of the second lunar month in 1639, Mu Zeng sent gifts in thanks for the collating and again asked Xu to compile the Gazetteer of Mount Ji.'
          p2:
            was: 'On the sixth day of the second lunar month in 1639, Xu wrote that he had been too busy collating to climb to Gongshou Terrace or Lion Cliff.'
            now: 'With the collation delivered, {staff} takes Xu back to Jietuo Lin to meet the guide and escort. Xu climbs the terrace and notes where the opposite slope comes into view.'
          p3:
            was: 'In 1639, the Lijiang diary mentioned Lion Cliff as somewhere Xu heard lay higher up and had no time to climb.'
            now: '{staff} walks the fork with Xu in both directions. Xu marks the bend where the paths double back and leaves a copy of the sketch at Jietuo Lin.'
            who: xu_xiake_lijiang
            bio: 'Xu''s Lijiang diary carries an extra firsthand entry between the collation and his departure. A second copy of his sketch stays with Jietuo Lin.'
        vignettes:
          view: 'The guide describes a bend by the mountain it faces. {staff} asks him how many turns there are before it. The view and the way to get there go on different lines.'
          trail: 'The escort takes the steep way to the steps and arrives with wet cuffs. {staff} hangs a dry cloth by the door and moves the nearly finished pages farther inside.'
          slope: 'At the monastery steps {staff} pulls out a fresh leaf. The dispatch for Mu Zeng goes back in its box. The blank leaf is for the route.'
        remarks:
          trait_methodical: '{staff} adds an arrow to the sketch so the next traveller will know which way is uphill.'
      zh:
        name: '校书之外的半日'
        place: "丽江"
        figure: "徐霞客"
        story: '1639 年二月，徐霞客住在丽江解脱林，为木增校书。木增遣人送来酒食，校书后又送礼酬谢。徐霞客听说寺后高处有拱寿台、狮子崖，日记里写校书催得紧，两处都没来得及登。'
        story_prose:
          opening:
            - '1639 年二月，丽江。徐霞客在解脱林为木增校书，听说后山有拱寿台和狮子崖。他把两处名字记进日记。'
            - '史实里，书催得紧，两处都没去成。木增后来送礼酬谢，又请他修《鸡山志》。在这条分支里，还书单和走山路要用的纸放在一处。'
            - '这一趟用得上清点卷册、送得准的人，也用得上跟得上向导和护卫、能记住山路折回处的人。'
          points:
            p1: '{staff}照还书单把卷册点过，跟送书的人核对哪些已经交回。送书人把回执搁在最上面。下面的书页收齐了，仍有一根细纸签露在匣外。'
            p2: '交清书以后，{staff}请本地向导带路，同护卫陪徐霞客走上拱寿台。对面的山从脚下一步一步露出来。徐霞客走到能看全的地方，在纸边划了一笔。'
            p3: '{staff}陪徐霞客从两面重走狮子崖下的岔口，把要折回的那一段指给他看。草图后来搁在解脱林的门槛里。折到末尾处，那道弯还完整地留在纸面上。'
          outcomes:
            all: '书卷交清后，那半日的山路也进了日记。留在解脱林的草图打开时，纸上两条路各从一道折痕旁拐过去。'
            p3: '后来解脱林里留下了一张草图。有人指着狮子崖下那道弯，再把纸折回去。'
            p2: '丽江的记述里后来多了一处站过的地方。徐霞客翻回那页，手指在对山初见的那一行停住。'
            p1: '木增后来送来酬谢，又请他修志。收起回信时，匣子里卷册的纸签还排得齐。'
          none: '木匣合上了。门槛边那张闲纸卷起来，没压住的一端扫过地面。'
          not_admitted: '{staff}没能在校书的人中留下。门内有人搬动木匣，盖子响了一声。'
          desync: '送书前没有核清卷册。{staff}被召回时，匣边还有一张没勾完的单子。'
          excerpts:
            p3: '草图后来搁在解脱林的门槛里。折到末尾处，那道弯还完整地留在纸面上。'
            p2: '对面的山从脚下一步一步露出来。徐霞客走到能看全的地方，在纸边划了一笔。'
            p1: '送书人把回执搁在最上面。下面的书页收齐了，仍有一根细纸签露在匣外。'
        relic: "一张解脱林步行图"
        relic_desc: "一张折过的步行图，坡路用线画出，岔口旁留着空白。"
        points:
          p1: '跟送书人核清校过的卷册已经交回，赶上木增初九酬谢和续修《鸡山志》的委托'
          p2: '从校书之后腾出半日，请本地人带路、护卫同行，陪徐霞客从解脱林一步步走上拱寿台'
          p3: '陪徐霞客沿狮子崖下的岔路往返，记下从哪儿开始折回，离开前给寺里留一份'
        points_fail:
          p1: '退回的几卷还缺着签记，来请修志的人无法确认校书已完，这次交接错过，事务所召回员工。'
          p2: '等书卷合上，已经走不了这一趟。拱寿台在日记里仍是听来的地名。'
          p3: '徐霞客离开丽江时，没能把亲脚丈量过的路线补到听来的路引旁。'
        shift:
          p1:
            was: '1639 年二月初九，木增遣人送礼酬谢校书，并再次致书请徐霞客修《鸡山志》。'
          p2:
            was: '1639 年二月初六，徐霞客写校书催得紧，没来得及登拱寿台和狮子崖。'
            now: '书卷交清后，{staff}陪徐霞客回解脱林，和向导、护卫会合。徐霞客登上拱寿台，记下走到哪里才看得见对面的山。'
          p3:
            was: '1639 年的丽江日记把狮子崖记为听说在寺后高处、因校书未及攀登的地方。'
            now: '{staff}陪徐霞客从两个方向各走一遍岔口。徐霞客标出路折回的那一弯，给解脱林留了一份草图。'
            who: xu_xiake_lijiang
            bio: '徐霞客的丽江日记在校书和出关之间多了一篇亲历。解脱林另留一份足迹草图。'
        vignettes:
          view: '向导拿对面一座山来指弯道。{staff}问清要先过几个弯，把远处的山和脚下的路分成两行记。'
          trail: '护卫走到石阶，袖口湿透了。{staff}把干布搭在门边，再把校到一半的稿页往屋里挪。'
          slope: '{staff}在解脱林门槛上另抽出一张纸。还书单进了木匣，记路用的那张留在手里。'
        remarks:
          trait_methodical: '{staff}在草图上多画了一个箭头，下一位走到岔口便知道哪边是上坡。'
text:
  en:
    name: Xu Xiake
    text: Chinese traveller of the Ming, 1587 to 1641. For some thirty years he walked through the mountains and caves of China, and his notes were edited into the Travels of Xu Xiake, with careful descriptions of karst landscapes.
  zh:
    name: 徐霞客
    text: 明代旅行家，1587 年生，1641 年去世。约三十年里他徒步走过中国的山川和洞穴，笔记后来被整理为《徐霞客游记》，对岩溶地貌有细致描述。
hook: {en: 'Can he spare half a day to climb?', zh: '还有半日，能上山吗'}
