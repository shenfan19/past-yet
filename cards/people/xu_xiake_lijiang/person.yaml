    text:
      en:
        name: 'The direction of the view'
        place: "Lijiang"
        figure: "Xu Xiake"
        story: 'Xu Xiake’s Travel Diaries describe Jietuo Lin on a slope during his 1639 stay in Lijiang, noting how the site faces the landscape.'
        relic: "A travel notebook"
        relic_desc: "Pages of dense notes on caves, rivers and rocks, written at the end of each day."
        points:
          p1: 'Return the books Xu checked for Mu Zeng volume by volume so the request to continue the Gazetteer of Mount Ji can be handed over as recorded'
          p2: 'Keep travel observations in the route book. Return the notes on the work he checked and ask each custodian to verify their papers'
          p3: 'Before leaving Lijiang, have local readers check several place names and keep a marked copy on each side'
        points_fail:
          p1: 'The returned volumes lack receipts. The messenger cannot confirm the earlier work was done, the handover is missed, and the office recalls the employee.'
          p2: 'Material borrowed for the gazetteer is mixed with the diary and copied later as a firsthand observation.'
          p3: 'The only notebook leaves with Xu. A name changes in a later copy and nobody there has a chance to check it.'
        shift:
          p1:
            was: 'The Yunnan travel diary records that Mu Zeng sent thanks for editorial work and wrote again asking Xu to compile the gazetteer.'
          p2:
            was: 'Xu recorded observations around Lijiang and also edited papers for Mu Zeng.'
            now: 'The route book identifies places Xu visited. The returned sheets show which passages he checked.'
          p3:
            was: 'The travel diaries reached later readers through manuscripts and printed editions. Original notes are missing for parts of the Yunnan journey.'
            now: 'A local copy is checked against familiar names, and the travel book carries the same corrections. Later copyists have two records to compare.'
            who: xu_xiake_lijiang
            bio: 'Xu left firsthand notes on his stay in Lijiang and also worked on papers for Mu Zeng. Later editors transmitted his travel diary.'
        vignettes:
          view: 'The guide turns the east-facing view into an arrow for where you walked. You draw the place where your feet stopped, then add a short line for what you could see from it. He keeps both marks. By the time you return downhill, the view itself is out of sight.'
          trail: 'At Jietuo Lin the guide tells you about a distant mountain called Gugang. You recall that Xu also described learning about it from a wall picture here. On the sheet you distinguish a place drawn on the wall from a stretch you have actually walked. When you leave, the path to Gugang is still only a question in the margin.'
          slope: 'You copy the location before copying what faces it. On one slip there is a point on the slope and an arrow that begins at the point. It is enough to reconstruct what you meant. Beyond that arrow the diary goes on without you.'
      zh:
        name: '一路脚印，一处朝向'
        place: "丽江"
        figure: "徐霞客"
        story: '1639 年徐霞客在丽江停留，《徐霞客游记》写到山腰的解脱林，并记下它面向的景色。'
        relic: "一本旅行笔记"
        relic_desc: "密密麻麻的笔记，写着洞穴、河流和岩石，每天夜里写成。"
        points:
          p1: '在丽江帮徐霞客把木增请他校过的书按卷送回，护住二月初九收到续修《鸡山志》委托的交接'
          p2: '把游历日记夹进路线原簿，把受邀校书留下的批注送回另一边让经办人各验一次'
          p3: '离开丽江前请当地读者复核数处地名，两边各留带修订标记的一份路线笔记'
        points_fail:
          p1: '退回的几卷还缺着签记，来请修志的人无法确认校书已完，这次交接错过，事务所召回员工。'
          p2: '修志参考与途中日记混到一起，再抄时误把借来的材料当成亲历。'
          p3: '回程带走唯一一份草记。后来抄本的地名变了，当地人没有来得及指出。'
        shift:
          p1:
            was: '《滇游日记七》记木增遣人谢校书，并再次致书请修《鸡山志》。'
          p2:
            was: '徐霞客既记录丽江的沿途见闻，也为木增整理和校读书稿。'
            now: '出行原簿留着亲历的地点，交回的校书纸页也能查到他动过哪些字。'
          p3:
            was: '现存游记由手稿与后来的抄刻本传下，滇游的某些时段缺原稿。'
            now: '留在丽江的一份给本地读者校过，随行簿另带批注。日后抄本有异时可以对照两份。'
            who: xu_xiake_lijiang
            bio: '徐霞客在丽江留下自己走访的记录，也与木增一方合作整理文稿。他的游记通过后来的编辑流传。'
        vignettes:
          view: '带路人把朝东的景色画成往东走的箭头。你先落笔画下脚停在哪里，再添一道短线标从那里看见什么。他把两种记号都留下。你一下坡，山腰那处景已经望不见了。'
          trail: '带路人在解脱林说起远处的古冈。你想起徐霞客的游记也写过，他是从这里的一幅壁图得知那处景致的。你把画上看见的远山和脚下走过的路分开记，在古冈旁只留一个问号。等你收队，那条路还没走。'
          slope: '你先抄地点，再抄它朝向什么。一个点留在山腰，箭头从那一点起笔，这张条子就够你回来后认出原意。再往后的游程，你没跟上。'
text:
  en:
    name: Xu Xiake
    text: Chinese traveller of the Ming, 1587 to 1641. For some thirty years he walked through the mountains and caves of China, and his notes were edited into the Travels of Xu Xiake, with careful descriptions of karst landscapes.
  zh:
    name: 徐霞客
    text: 明代旅行家，1587 年生，1641 年去世。约三十年里他徒步走过中国的山川和洞穴，笔记后来被整理为《徐霞客游记》，对岩溶地貌有细致描述。
hook: {en: 'Is the direction in the diary where he looked or where he walked?', zh: '游记写向东，是走还是望？'}
