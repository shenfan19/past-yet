- kabir_maghar
text:
  en:
    name: Kabir
    text: Poet and mystic of north India, about 1440 to about 1518. His short verses in the language of ordinary people reject caste and empty ritual, and are claimed by Hindus, Muslims and Sikhs alike.
  zh:
    name: 迦比尔
    text: 北印度诗人与神秘主义者，约 1440 年生，约 1518 年去世。他用百姓的语言写短诗，否定种姓和空洞的仪式，印度教徒、穆斯林和锡克教徒都奉他为自己人。
