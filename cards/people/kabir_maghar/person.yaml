    text:
      en:
        name: "Verses carried by singers"
        place: "Maghar"
        figure: "Kabir"
        story: "A weaver who sang short poems against pride and division, Kabir never wrote them down himself. Singers carried them, and they were gathered after his death, traditionally in Maghar in 1518."
        relic: "A weaver's shuttle"
        relic_desc: "A worn wooden shuttle, smooth from the hand."
        points:
          p1: "Hear him sing at the loom"
          p2: "Sit among the weavers at a quiet hour"
          p3: "Learn the verses by heart (a musician or a sensitive employee)"
      zh:
        name: "由歌者传下的诗句"
        place: "马格哈尔"
        figure: "迦比尔"
        story: "迦比尔是个织工，用短诗唱出对骄傲与分裂的反对，他自己从没把诗写下来。歌者把诗传了下来，在他身后才被收集，传统上说他于1518年在马格哈尔去世。"
        relic: "一把织梭"
        relic_desc: "一把用旧了的木梭，被手磨得光滑。"
        points:
          p1: "听他在织机旁唱"
          p2: "在安静的时候坐在织工们中间"
          p3: "把诗句背下来"
text:
  en:
    name: Kabir
    text: Poet and mystic of north India, about 1440 to about 1518. His short verses in the language of ordinary people reject caste and empty ritual, and are claimed by Hindus, Muslims and Sikhs alike.
  zh:
    name: 迦比尔
    text: 北印度诗人与神秘主义者，约 1440 年生，约 1518 年去世。他用百姓的语言写短诗，否定种姓和空洞的仪式，印度教徒、穆斯林和锡克教徒都奉他为自己人。
