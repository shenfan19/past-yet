    text: {en: 'A fictional singer passing an opening to someone else.', zh: '虚构歌者帕萝，要把开头教给下一人。'}
  salim:
    invented: true
    text: {en: 'A fictional singer who comes in too soon.', zh: '虚构歌者萨利姆，总是接唱得太快。'}
