    tier: 3
    channels: {A: 3, L: 3}
    # finished: in the game with release.ready_only. The year of building is an estimate, so the stay carries no day.
    ready: true
    refs: [machu_picchu_water, machu_picchu_series, britannica_machu_picchu, ancient_history_machu_picchu]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 58, req: {"any":[{"job":["builder","scaffolder","carpenter","civil_engineer"]},{"provides":"strength"},{"stat":{"constitution":8}}]}}
        - {id: p2, kind: trust, day: 25, req: {"any":[{"provides":"translate"},{"job":["translator","teacher","tutor","sewing_teacher"]},{"trait":["kind","patient"]}]}}
        - {id: p3, kind: endure, day: 120, req: {"any":[{"job":["builder","scaffolder","carpenter","woodcarver","restorer","civil_engineer"],"provides":"strength"},{"job":["builder","scaffolder","carpenter","woodcarver","restorer","civil_engineer"],"stat":{"finesse":8}},{"trait":["handy"],"stat":{"finesse":9}}]}}
      vignettes:
        - {id: wet, traits: [methodical, scholarly], day: 85}
        - {id: steps, traits: [hardy, curious], day: 120}
        - {id: mark, day: 40}
    text:
      en:
        name: 'Follow the water to the next stone basin'
        place: Machu Picchu, Peru
        figure: The Inca builders
        story: 'Machu Picchu was built around 1450, most likely as an estate of the Inca ruler Pachacuti, and abandoned about a century later, at the time of the Spanish conquest. A canal carried water from a spring to a stepped series of sixteen fountains. On 24 July 1911 Melchor Arteaga, a local farmer, led Hiram Bingham up to the ruins; the site was made a historic sanctuary of Peru in 1981 and a World Heritage site in 1983.'
        relic: A carved stone
        relic_desc: A palm sized stone with a straight, true edge.
        points:
          p1: 'On the day of the earthquake, keep the canal from the spring from breaking apart'
          p2: 'See that a helper brought alone from the eastern forests has someone here who understands him'
          p3: 'Help the masons rebuild the cracked walls with the old fitted stones'
        points_fail:
          p1: 'The stone channel slips apart in the shaking, the water spills down the slope, the sixteen basins run dry one by one, and in this branch the estate is without water.'
          p2: 'He still carries stone alone and nobody answers what he says; in this branch he is as he was when he came.'
          p3: 'As in history, the cracked walls are built up again in small stones, and in this branch the fitted stonework stops at these walls.'
        shift:
          p2:
            was: 'He still carries stone alone and nobody answers what he says; he is as he was when he came.'
            now: '{staff} worked out a few words with the helper, and later he had people among the masons he could talk to.'
          p3:
            was: 'After the earthquakes during the building, the masons of Machu Picchu turned to walls of small stones that took less work, and stopped cutting large blocks fitted to one another.'
            now: '{staff} and the masons rebuilt the cracked walls in the old way. In the decades after, those walls came through several more tremors.'
        vignettes:
          wet: '{staff} walks from one basin to the next before marking it wet, and leaves the second box blank until the water is seen.'
          steps: '{staff} counts the basins from the top of the stair, as the water runs, and not from where the morning''s work began.'
          mark: '{staff} cuts a small notch where the channel turns, so the next person to clear it knows where the water bends.'
      zh:
        name: '顺水再走一口石池'
        place: 秘鲁马丘比丘
        figure: 印加的建造者们
        story: '马丘比丘约建于 1450 年，多半是印加统治者帕查库特克的庄园，约一个世纪后、西班牙征服前后被废弃。一条水渠从泉眼引水，沿阶梯流过十六处石池。1911 年 7 月 24 日，当地农民梅尔乔·阿特阿加领着海勒姆·宾厄姆登上遗址；1981 年这里成为秘鲁的历史保护区，1983 年列入世界遗产。'
        relic: 一块切好的石头
        relic_desc: 一块巴掌大的石头，边是直的、正的。
        points:
          p1: '地震那天，护住从泉眼下来的水渠'
          p2: '让一位独自从东边林地被带来的帮工，在这里有人听得懂他的话'
          p3: '帮石匠们把震裂的大墙照原来的咬合砌法修回去'
        points_fail:
          p1: '石槽在摇晃里错开，水从半山泼了出去，十六口石池一口口干了，这条分支里的庄园断了水。'
          p2: '他还是一个人背石头，说的话没人接，这条分支里他和来时一样。'
          p3: '震裂的墙照史实改用小石块垒了起来，这条分支里，咬合的大石砌法在这几面墙上停了。'
        shift:
          p2:
            was: '他还是一个人背石头，说的话没人接，他和来时一样。'
            now: '{staff}陪那位帮工把几句话说通了，后来他在石匠中间有了能说话的人。'
          p3:
            was: '施工期间的地震之后，马丘比丘的工匠改用更省工的小石块垒砌，不再一块块切出互相咬合的大石。'
            now: '{staff}和石匠们一起把震裂的几面墙照原来的砌法修了回去。后来的几十年，这几面墙又扛过了几回摇晃。'
        vignettes:
          wet: '{staff}走到下一口池才落笔标“有水”，没见到水之前，第二个格子空着。'
          steps: '{staff}从台阶顶上顺着水流的方向数石池，不从早上开工的地方数。'
          mark: '{staff}在水渠拐弯处刻了个小口，下一个来清渠的人就知道水在哪里转弯。'
text:
  en:
    name: The Inca builders
    text: The Inca builders of Machu Picchu, a royal estate on a ridge in the Andes built around 1450. The site was abandoned after the Spanish conquest and little known outside the region until 1911.
  zh:
    name: 印加的建造者们
    text: 马丘比丘的印加建造者。马丘比丘是约 1450 年建在安第斯山脊上的王室庄园。西班牙征服后遗址被废弃，直到 1911 年才为外界熟知。
hook: {en: 'If water appears above, why is the next basin dry?', zh: '上边见水，下边为什么还干着？'}
facts:
  built:
    date: '1450'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_machu_picchu, ancient_history_machu_picchu]
    text:
      en: 'Most archaeologists think the Inca ruler Pachacuti had Machu Picchu built as an estate around 1450.'
      zh: '多数考古学家认为，马丘比丘是印加统治者帕查库特克约于 1450 年下令修建的庄园。'
    line:
      en: 'Around 1450: on a ridge above the river, an estate of the Inca ruler Pachacuti is being built of fitted stone.'
      zh: '1450 年前后，河谷上方的山脊上，印加统治者帕查库特克的庄园正一块块用石头砌起来。'
  series:
    date: '1450'
    stay_day: 60
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [machu_picchu_series]
    text:
      en: 'The survey documents the spring-fed canal and the linked series of sixteen fountains.'
      zh: '调查记录来自泉水的水渠和串联的十六处出水点。'
    line:
      en: 'A canal brings water from a spring down a stair of sixteen stone basins.'
      zh: '一条水渠从泉眼引水，顺着台阶流过十六口石池。'
  water:
    date: '1450'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [machu_picchu_water]
    text:
      en: 'Field research documents Machu Picchu’s water and drainage infrastructure.'
      zh: '现场研究记录马丘比丘的供水与排水设施。'
  abandoned:
    date: '1550'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_machu_picchu, ancient_history_machu_picchu]
    text:
      en: 'The Incas abandoned the estate about a century after it was built, around the time of the Spanish conquest.'
      zh: '大约在建成一个世纪后、西班牙征服前后，印加人离开了这处庄园。'
    line:
      en: 'About a century later, around the time of the Spanish conquest, the estate is left empty.'
      zh: '大约一个世纪后，西班牙征服前后，这处庄园空了下来。'
  bingham:
    date: '1911-07-24'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_machu_picchu, ancient_history_machu_picchu]
    text:
      en: 'On 24 July 1911 Melchor Arteaga, a local farmer, led Hiram Bingham across the river and up to the ruins. Bingham was long called its discoverer; that he was guided there by local people is now widely pointed out.'
      zh: '1911 年 7 月 24 日，当地农民梅尔乔·阿特阿加领着海勒姆·宾厄姆过河，登上遗址。宾厄姆长期被称作发现者，如今人们常指出，是当地人把他带到了那里。'
    line:
      en: '24 July 1911: a local farmer, Melchor Arteaga, leads the American Hiram Bingham across the river and up to the ruins.'
      zh: '1911 年 7 月 24 日，当地农民梅尔乔·阿特阿加领着美国人海勒姆·宾厄姆过河，登上了遗址。'
  heritage:
    date: '1983'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [britannica_machu_picchu, ancient_history_machu_picchu]
    text:
      en: 'Machu Picchu was declared a historic sanctuary of Peru in 1981 and a UNESCO World Heritage site in 1983.'
      zh: '马丘比丘 1981 年成为秘鲁历史保护区，1983 年列入联合国教科文组织世界遗产。'
    line:
      en: '1983: Machu Picchu is inscribed as a World Heritage site.'
      zh: '1983 年，马丘比丘列入世界遗产。'
