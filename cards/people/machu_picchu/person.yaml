- machu_picchu
text:
  en:
    name: The Inca builders
    text: The Inca builders of Machu Picchu, a royal estate on a ridge in the Andes built around 1450. The stone walls are fitted without mortar, and the site was abandoned after the Spanish conquest and little known outside the region until 1911.
  zh:
    name: 印加的建造者们
    text: 马丘比丘的印加建造者。马丘比丘是约 1450 年建在安第斯山脊上的王室庄园，石墙不用灰浆砌合。西班牙征服后遗址被废弃，直到 1911 年才为外界熟知。
