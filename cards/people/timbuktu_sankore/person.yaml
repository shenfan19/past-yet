quotes:
  timbuktu_sankore_echo_full:
    order: 1
    tier: full
    date: '1655'
    checked: official_record
    sources: [timbuktu_sankore_echo_source_full]
    original: ar
    contextual: true
    text:
      en:
        who: 'Al-Saʿdi'
        quote: 'And he set out with them for Biru.'
        occasion: 'The later Tarikh al-Sudan describes the group leaving for Biru, also known as Walata.'
      zh:
        who: '萨阿迪'
        quote: '他和他们一道往比鲁去了。'
        occasion: '后出的《苏丹史》记队伍前往比鲁，即瓦拉塔。'
      ar:
        who: 'Al-Saʿdi'
        quote: 'ومشى بهم إلى بير'
        occasion: 'The later Tarikh al-Sudan describes the group leaving for Biru, also known as Walata.'
      zh-Hant:
        who: '薩阿迪'
        quote: '他和他們一道往比魯去了。'
        occasion: '後出的《蘇丹史》記隊伍前往比魯，即瓦拉塔。'
      fr:
        who: 'Al-Sa''di'
        quote: 'Et il partit avec eux pour Biru.'
        occasion: 'Le dernier Tarikh al-Sudan décrit le départ du groupe pour Biru, également connu sous le nom de Walata.'
      es:
        who: 'Al-Sa''di'
        quote: 'Y partió con ellos hacia Biru.'
        occasion: 'El último Tarikh al-Sudan describe al grupo partiendo hacia Biru, también conocido como Walata.'
      ja:
        who: 'アル・サディ'
        quote: 'そして彼は彼らと一緒にビルに向けて出発した。'
        occasion: '後のタリフ・アル・スーダンは、ワラタとしても知られるビルに向けて出発した一行について描写している。'
      ko:
        who: '알사디'
        quote: '그리고 그는 그들과 함께 비루를 향해 출발했습니다.'
        occasion: '후기 Tarikh al-Sudan은 Walata라고도 알려진 Biru로 떠나는 그룹을 설명합니다.'
      ru:
        who: 'Аль-Саади'
        quote: 'И он отправился с ними в Биру.'
        occasion: 'Более поздний Тарих аль-Судан описывает отъезд группы в Биру, также известный как Валата.'
  timbuktu_sankore_echo_none:
    order: 2
    tier: none
    date: '1655'
    checked: official_record
    sources: [timbuktu_sankore_echo_source_none]
    original: ar
    contextual: true
    text:
      en:
        who: 'Al-Saʿdi'
        quote: 'Akil decided at that moment to flee.'
        occasion: 'The later Tarikh al-Sudan records the decision to leave; it does not record the family of the game’s branch.'
      zh:
        who: '萨阿迪'
        quote: '阿基勒当时便决定离开。'
        occasion: '后出的《苏丹史》记下离城的决定。游戏里随队的一家归分支虚构。'
      ar:
        who: 'Al-Saʿdi'
        quote: 'فعزم أكل على الهروب ساعتئذ'
        occasion: 'The later Tarikh al-Sudan records the decision to leave; it does not record the family of the game’s branch.'
      zh-Hant:
        who: '薩阿迪'
        quote: '阿基勒當時便決定離開。'
        occasion: '後出的《蘇丹史》記下離城的決定。遊戲裡隨隊的一家歸分支虛構。'
      fr:
        who: 'Al-Sa''di'
        quote: 'Akil décida à ce moment de s''enfuir.'
        occasion: 'Le dernier Tarikh al-Sudan enregistre la décision de partir ; il n’enregistre pas la famille de la branche du jeu.'
      es:
        who: 'Al-Sa''di'
        quote: 'Akil decidió en ese momento huir.'
        occasion: 'El posterior Tarikh al-Sudan registra la decisión de irse; no registra la familia de la rama del juego.'
      ja:
        who: 'アル・サディ'
        quote: 'その瞬間、アキルは逃げることを決意した。'
        occasion: '後のタリク・アル・スーダンは離脱の決定を記録している。ゲームのブランチのファミリーは記録されません。'
      ko:
        who: '알사디'
        quote: 'Akil은 그 순간 도망치기로 결정했습니다.'
        occasion: '나중에 Tarikh al-Sudan은 떠나기로 결정한 내용을 기록했습니다. 게임 브랜치의 계열은 기록하지 않습니다.'
      ru:
        who: 'Аль-Саади'
        quote: 'Акил решил в этот момент бежать.'
        occasion: 'Более поздний Тарих аль-Судан записывает решение уйти; он не записывает семейство ветки игры.'
