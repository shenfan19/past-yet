    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"endure","day":8,"req":{"any":[{"job":["driver","courier","navigator"],"stat":{"constitution":6}},{"trait":["hardy","wanderer","streetwise"],"stat":{"constitution":7,"will":5}}]}}
    text:
      en:
        name: 'A place on a departing caravan'
        place: 'Timbuktu, Mali'
        figure: 'The scholars of Timbuktu'
        story: 'After Timbuktu changed hands around 1468, scholars left the city for places including Walata. In this branch one household needs a place with a group planning to leave together.'
        story_prose:
          opening:
            - 'Around 1468, Timbuktu changed hands. A later chronicler remembered learned families leaving the city, with some going to Walata.'
            - 'In history, the chronicle recorded the departing groups. In this branch one household is already packing, but several water bags have yet to be marked. They do not know which party will wait.'
            - 'Someone who understands how a travelling party is organised can help. They will have to find out who is still expected, and go the first stretch with the family.'
          points:
            p1: '{staff} goes from one party to another until a guide agrees to wait, then comes back to help the household count the water and the bundles. At the first stop, another family unrolls a mat. The smallest child brings over the household’s smallest water bag and puts it between the two mats. The bag stays upright when he lets go.'
          outcomes:
            all: 'Next morning the two mats beside each other are rolled up. The small bag is passed up first, and then someone lifts the child.'
            p1: 'Next morning the two mats beside each other are rolled up. The small bag is passed up first, and then someone lifts the child.'
          none: 'By the time someone comes back to ask, the last group has gone. The household carries its tied bundles back through the door.'
          not_admitted: '{staff} does not find the household. Beside a door, someone moves two water bags together.'
          excerpts:
            p1: 'The smallest child brings over the household’s smallest water bag and puts it between the two mats. The bag stays upright when he lets go.'
        relic: 'A water bag tally'
        relic_desc: 'An imagined tally used to count the water bags entrusted to the household.'
        points:
          p1: 'Find a place for one household with a departing caravan and escort them to their first safe stop'
        points_fail:
          p1: 'The group left before the employee could arrange a place for the household.'
        shift:
          p1:
            was: 'Around 1468: after Timbuktu changed hands, scholars fled. Some went to Walata.'
            now: '{staff} helps one household join a group travelling towards Walata and escorts them to the first safe stop.'
            who: timbuktu_sankore
            bio: 'One household leaving Timbuktu found a group to travel with and reached its first stop safely.'
      zh:
        name: '还赶得上一队人'
        place: '马里廷巴克图'
        figure: '廷巴克图的学者们'
        story: '1468 年前后，廷巴克图易手后，一些学者离开当地，有人去了瓦拉塔。在这条分支里，其中一户人家想找一队能同行的人。'
        story_prose:
          opening:
            - '约 1468 年，廷巴克图易手。后来写下这段历史的人，记得有读书人离开了城，有些人去了瓦拉塔。'
            - '史实里，编年史写到离城的队伍。在这条分支里，有一户人家已经收行李，几个水袋却还没有系上记号。他们不知道哪队肯等。'
            - '这趟需要认得同行规矩的人，能问清队伍在等谁，还能陪走第一程。'
          points:
            p1: '{staff}在几队人里问到一位愿意等这户人家的领路人，回来请他们点清水和要带的东西。到第一处落脚点，另一家摊开了一张席。那户人家的孩子把家里最小的水袋提过去，放在两张席之间。他松开手以后，小袋子还站得住。'
          outcomes:
            all: '第二天，队伍收起两张挨在一起的席。那只小水袋先被递上去，然后才有人把孩子抱上来。'
            p1: '第二天，队伍收起两张挨在一起的席。那只小水袋先被递上去，然后才有人把孩子抱上来。'
          none: '再有人回头问时，最后一队已经走了。一家人把打了结的行李搬回门内。'
          not_admitted: '{staff}没有问到那户人家。有人在门边把两只水袋往一起拢。'
          excerpts:
            p1: '那户人家的孩子把家里最小的水袋提过去，放在两张席之间。他松开手以后，小袋子还站得住。'
        relic: '水袋上的计数签'
        relic_desc: '分支里的计数签，用来核对那户人家带走的水袋。'
        points:
          p1: '替一户离城的人家找到能同行的商队，陪他们到第一处安全的落脚点'
        points_fail:
          p1: '商队出发前，员工没能替那户人家留到位置。'
        shift:
          p1:
            was: '1468 年前后，廷巴克图易手后有学者离开，一些人去了瓦拉塔。'
            now: '{staff}让那户人家跟上去瓦拉塔方向的一队人，陪他们走到第一处安全的落脚点。'
            who: timbuktu_sankore
            bio: '离开廷巴克图的一户人家找到了同行者，平安到达第一处落脚点。'
