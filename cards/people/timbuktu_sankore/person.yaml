      zh: '1468 年前后，廷巴克图易手后有学者离开，一些人去了瓦拉塔。'
    line:
      en: 'Around 1468: after Timbuktu changed hands, scholars fled. Some went to Walata.'
      zh: '1468 年前后，廷巴克图易手后有学者离开，一些人去了瓦拉塔。'
      zh-Hant: '1468 年前後，廷巴克圖易手後有學者離開，一些人去了瓦拉塔。'
      fr: 'Vers 1468 : après le changement de mains de Tombouctou, les savants s''enfuient. Certains sont allés à Walata.'
      es: 'Alrededor de 1468: después de que Tombuctú cambiara de manos, los eruditos huyeron. Algunos fueron a Walata.'
      ja: '1468年頃: トンブクトゥが政権を交代した後、学者たちは逃亡した。ワラタに行った人もいました。'
      ko: '1468년경: 팀북투의 손이 바뀌자 학자들은 도망쳤습니다. 일부는 Walata로갔습니다.'
      ru: 'Около 1468 года: после того, как Тимбукту перешел из рук в руки, ученые бежали. Некоторые отправились в Валату.'
  year:
