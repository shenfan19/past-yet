quotes:
  rembrandt_diligence_echo:
    order: 2
    tier: none
    date: '1639-01-12'
    checked: official_record
    sources: [rembrandt_huygens_2020]
    original: nl
    text:
      nl: {who: Rembrandt van Rijn, quote: 'dees selvij twe stuckens sijn door stuijdiose vlijt nu meede afgedaen', occasion: 'brief aan Constantijn Huygens over twee schilderijen'}
