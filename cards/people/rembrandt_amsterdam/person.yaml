    text:
      en:
        name: "After his son"
        place: "Amsterdam"
        figure: "Rembrandt van Rijn"
        story: 'The dated Self Portrait at the Age of 63 shows that Rembrandt was painting self-portraits in 1669, the year of his death.'
        relic: "A brush"
        relic_desc: "A worn brush with the paint dried in the hairs."
        points:
          p1: 'Keep a usable easel in Amsterdam for Rembrandt’s late self-portrait. Move dated canvases separately from early studies'
          p2: 'Have the painter record the pose and clothing he intends to keep so the workshop can tell the portraits from that year apart'
          p3: 'Have relatives and the inventory clerk list current paintings separately from tools. Check any revisions the painter had left visible or marked'
        points_fail:
          p1: 'The canvas is taken away as an old study. He cannot continue working on it, and the office recalls the employee.'
          p2: 'The records use the same description for several portraits. A later reader cannot tell which is which.'
          p3: 'The inventory groups objects by room and type. No usable note identifies which portrait was being revised.'
        shift:
          p1:
            was: 'More than one surviving self-portrait dates from 1669, the year Rembrandt died.'
          p2:
            was: 'A painting dated to 1669 today was long assigned to an earlier period, until its date was read on the painting.'
            now: 'Each portrait has a visible detail in the register. Someone receiving a picture with an unclear date has a starting point for identifying it.'
          p3:
            was: 'Rembrandt’s possessions were inventoried after his death. Paintings entered different collections and some inscriptions have been hard to read.'
            now: 'The family keeps a page registering the date and workshop history as the painting is handed over. A later borrower can trace its last stage in the workshop.'
            who: rembrandt_amsterdam
            bio: 'Rembrandt painted himself repeatedly in his last year. Portraits dated 1669 in different collections can be distinguished through inscriptions and technical study.'
        vignettes:
          mirror: 'The apprentice keeps drawing the face they expected to see. You ask them to turn a little and wait until they can describe the light before drawing again.'
          seat: 'You put a chalk mark beside the stool before the apprentice takes a break. On returning they find the angle again without moving the whole table.'
          look: 'You sit beside the apprentice until their gaze stops darting between mirror and paper. When they show you the drawing, one corner is still blank and they decide to leave it.'
      zh:
        name: "儿子之后"
        place: "阿姆斯特丹"
        figure: "伦勃朗"
        story: '伦勃朗有一幅署年 1669 的《六十三岁自画像》，可见他在去世那年仍在画自己的脸。'
        relic: "一支画笔"
        relic_desc: "一支磨旧的画笔，笔毛里的颜料已经干了。"
        points:
          p1: '在阿姆斯特丹给伦勃朗晚年的自画像留出能继续用的画架，换地方时让已署年的画布和旧习作分开归置'
          p2: '请画家在工房册旁补上自己打算留下的姿态和衣帽，辨出同年各幅画像'
          p3: '请家人和接手清点者把正在绘制的作品和工具分别记入临时交接册，再把画家留下的改笔一并核对'
        points_fail:
          p1: '搬画时把这幅画当成早年习作收走，画家无法继续，事务所因同步失败召回员工。'
          p2: '几幅画以同一说法登记，几十年后看册的人已分不出是哪幅。'
          p3: '清点只按屋里放的东西归大类，尚待修改的画像没有一处可用的说明。'
        shift:
          p1:
            was: '现存不止一件 1669 年的伦勃朗自画像，说明他在去世那年仍画自画像。'
          p2:
            was: '有一幅今天定年 1669 年的自画像长期曾被看作早期作品，直到人们辨认出画上的署年。'
            now: '几幅画各有可查的外观记载。后来拿到无清楚署年的一幅时，至少能用册页辨认是哪一件。'
          p3:
            was: '伦勃朗死后有住处物品清理，现存画作各自进入收藏，署记有的难辨。'
            now: '家人交出画时仍留有一页署年和在工房的记录。后来借出画像的人能查到作品还在画架上的阶段。'
            who: rembrandt_amsterdam
            bio: '伦勃朗最后一年反复画自己的肖像。不同馆所藏的 1669 年画作可从署年和技术考察加以辨别。'
        vignettes:
          mirror: '学徒总画成自己想象的样子。你请他稍微转过脸，等能说清光落在哪儿，再往下画。'
          seat: '学徒歇手前，你在凳脚旁画了道粉笔记号。他回来时不用挪整张桌子，也能坐回原来的角度。'
          look: '你陪学徒坐着，等他的眼睛不再急着在镜子和纸之间来回跳。他把画递给你看时还有一角空着，决定先留在那里。'
text:
  en:
    name: Rembrandt van Rijn
    text: Dutch painter and etcher, 1606 to 1669. He painted portraits and biblical scenes with strong light, including The Night Watch. He went bankrupt in 1656 and spent his last years in Amsterdam in debt.
  zh:
    name: 伦勃朗
    text: 荷兰画家与蚀刻师，1606 年生，1669 年去世。他画光线强烈的肖像和圣经场景，包括《夜巡》。1656 年他破产，晚年在阿姆斯特丹负债度日。
