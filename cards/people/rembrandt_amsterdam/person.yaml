    text:
      en:
        name: "After his son"
        place: "Amsterdam"
        figure: "Rembrandt van Rijn"
        story: 'Rembrandt''s son Titus was buried in Amsterdam on 7 September 1668, half a year after his wedding. In March 1669 Titus''s daughter Titia was born. That year Rembrandt painted self-portraits dated 1669. He died on 4 October 1669 and was buried four days later in a rented grave; his last painting was left unfinished. Titus''s widow was buried on 21 October.'
        story_prose:
          opening:
            - 'Amsterdam, September 1669. The painter Rembrandt van Rijn, sixty three, painted The Night Watch, went bankrupt in 1656 and is living out his last years here in debt. A year ago his son Titus, the only one of his children to grow up, was buried, half a year after his wedding; in March Titus''s daughter Titia was born. This year he has painted several self-portraits that carry the date, and his last painting still stands on the easel.'
            - 'In history, he died on 4 October and four days later was buried in a rented grave; the painting on the easel was left unfinished, and is now in the Nationalmuseum in Stockholm. Two weeks after him, Titus''s widow was buried too. In this branch, there is a colourman by the canal, a bargeman poling peat along the water, and a night watchman who shakes his rattle in the streets.'
            - 'One kind of person can help on this trip: someone who has held a brush and has a steady hand, or someone with a painter''s eye and a steadier hand still, to grind his colours and steady the canvas.'
          outcomes:
            all: 'On 4 October Rembrandt died, aged sixty three. The painting still stood on the easel, the old man''s hands a few strokes further on than before, and the palette lay to one side, its colours dried.'
            p1: 'On 4 October Rembrandt died, aged sixty three. The painting still stood on the easel, the old man''s hands a few strokes further on than before, and the palette lay to one side, its colours dried.'
          none: 'On 4 October Rembrandt died, aged sixty three. The painting on the easel stopped where his strength had given out, the brush stood in its jar, and the paint in its hairs slowly dried.'
          not_admitted: '{staff} never got into the house, and only spent a few days at the muller in a colourman''s shop by the canal. Once the shop wrapped a pot of lead white for the old painter at the far end of the canal, and nobody came for it; it sat on the counter all afternoon.'
          points:
            p1:
              trait_artistic: 'On the morning of 29 September Rembrandt sits at the easel in the studio, and the brush in his hand hangs a long while before it comes down. In the painting an old man holds a child in his two hands, the light on his face still dark. {staff}, with a painter''s eye and a steady hand, grinds the colours he asks for and sets them out on the palette in small heaps, and whenever the canvas gives, holds the frame steady for him. Before the light fails in the afternoon, the old man''s two hands have a few more strokes. Rembrandt puts the brush back in its jar and with his thumb rubs a little paint off the edge of the canvas.'
              else: 'On the morning of 29 September Rembrandt sits at the easel in the studio, and the brush in his hand hangs a long while before it comes down. In the painting an old man holds a child in his two hands, the light on his face still dark. {staff}, who has held a brush and has a steady hand, grinds the colours he asks for and sets them out on the palette in small heaps, and whenever the canvas gives, holds the frame steady for him. Before the light fails in the afternoon, the old man''s two hands have a few more strokes. Rembrandt puts the brush back in its jar and with his thumb rubs a little paint off the edge of the canvas.'
          excerpts:
            p1: 'Before the light fails in the afternoon, the old man''s two hands have a few more strokes. Rembrandt puts the brush back in its jar and with his thumb rubs a little paint off the edge of the canvas.'
        relic: "A brush"
        relic_desc: "A worn brush with the paint dried in the hairs."
        points:
          p1: 'In his last weeks, help Rembrandt carry the painting on his easel further, so that his last painting is not left where his strength gave out'
        points_fail:
          p1: 'The last painting on his easel was left unfinished in his studio as history has it.'
        shift:
          p1:
            was: 'Rembrandt died in Amsterdam on 4 October 1669. His last painting, the one on his easel, was left unfinished at his death.'
            now: '{staff} ground his colours and steadied the canvas through the last weeks. The painting on the easel was carried further in his own hand before October.'
            who: rembrandt_amsterdam
            bio: 'In this line Rembrandt worked on his last painting through September 1669 and took it further than history left it. It went out of his studio closer to how he meant it.'
        vignettes:
          colours: 'On 22 September {staff} spends an afternoon in a colourman''s back room off the Rozengracht, turning the muller over a slab of lead white until both arms ache. The colourman says painters these days all want their white smooth as cream, and he has a mind to sell them cream and see if they notice.'
          barge: 'On 26 September {staff} helps a bargeman pole a load of peat along the Rozengracht. The water is so low this autumn, he says, that he scrapes the bottom at every bridge, and he has started greeting the stones by name.'
          watchman: 'In the middle of November {staff} walks a wet round with the night watchman, who shakes his rattle at every corner and calls the hour. He says the rain this month has got into the rattle too, and it now sounds like a cough.'
      zh:
        name: "儿子之后"
        place: "阿姆斯特丹"
        figure: "伦勃朗"
        story: '1668 年 9 月 7 日，伦勃朗的儿子提图斯在阿姆斯特丹下葬，离他成婚只有半年。1669 年 3 月，提图斯的女儿蒂蒂娅出世。这一年，伦勃朗画了几幅署年 1669 的自画像。他在 1669 年 10 月 4 日去世，四天后葬进一处租来的墓穴；他最后一幅画没有画完。10 月 21 日，提图斯的遗孀也下葬了。'
        story_prose:
          opening:
            - '1669 年 9 月，阿姆斯特丹。六十三岁的画家伦勃朗画过《夜巡》，1656 年破产，晚年负债住在这座城里。一年前，他唯一长大成人的儿子提图斯下葬，离成婚才半年；今年 3 月，提图斯的女儿蒂蒂娅出世。这一年他画了几幅署了年份的自画像，画架上还立着他的最后一幅画。'
            - '史实里，他在 10 月 4 日去世，四天后葬进一处租来的墓穴；画架上那幅画没有画完，如今收在斯德哥尔摩的国立博物馆。两个星期后，提图斯的遗孀也下葬了。在这条分支里，运河边有个颜料商，河上有个撑泥炭船的船夫，街上有个摇木响板的守夜人。'
            - '这一趟用得上一种人：拿过画笔、手稳的人，或者有一双画画人的眼睛、手更稳的人，替他研好颜料、扶稳画布。'
          outcomes:
            all: '10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画还立着，那个老人的两只手比先前多了几笔，调色板搁在一边，上面的颜色已经干了。'
            p1: '10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画还立着，那个老人的两只手比先前多了几笔，调色板搁在一边，上面的颜色已经干了。'
          none: '10 月 4 日，伦勃朗去世，六十三岁。画架上那幅画停在他力气断掉的地方，笔插在罐子里，笔毛里的颜料慢慢干了。'
          not_admitted: '{staff}没能进那户人家，只在运河边的颜料铺里推过几天研磨石。有一回，铺子里包好了一罐铅白，说是给运河那头的老画家的，一直没人来取，罐子在柜台上放了一下午。'
          points:
            p1:
              trait_artistic: '9 月 29 日上午，伦勃朗坐在画室的画架前，手里的笔停了好一阵才落下去。画上一个老人双手托着一个婴儿，脸上的光还是暗的。{staff}有一双画画人的眼睛，手也稳，把他要的颜色研好，一小堆一小堆排在调色板上，画布松了，就替他扶住画框。下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。'
              else: '9 月 29 日上午，伦勃朗坐在画室的画架前，手里的笔停了好一阵才落下去。画上一个老人双手托着一个婴儿，脸上的光还是暗的。{staff}拿过画笔，手稳，把他要的颜色研好，一小堆一小堆排在调色板上，画布松了，就替他扶住画框。下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。'
          excerpts:
            p1: '下午光暗下去以前，那个老人的两只手又多了几笔。伦勃朗把笔插回罐子里，用拇指在画布边上蹭掉了一点颜料。'
        relic: "一支画笔"
        relic_desc: "一支磨旧的画笔，笔毛里的颜料已经干了。"
        points:
          p1: '在他最后几周里，帮伦勃朗把画架上那幅画往下画一段，别让最后一幅画停在他力气断掉的地方'
        points_fail:
          p1: '画架上那最后一幅画照史实没画完，留在他的画室里。'
        shift:
          p1:
            was: '1669 年 10 月 4 日，伦勃朗在阿姆斯特丹去世。他画架上的最后一幅画在他去世时没有画完。'
            now: '{staff}替他研好颜料、扶稳画布，陪他过了最后几周。十月之前，画架上那幅画在他自己手里又往下走了一段。'
            who: rembrandt_amsterdam
            bio: '这条时间线里，伦勃朗在 1669 年 9 月一直画着最后那幅画，把它画得比历史上更远。它离开画室时，更接近他想要的样子。'
        vignettes:
          colours: '9 月 22 日下午，{staff}在玫瑰运河边一家颜料铺的后屋里推研磨石，磨一板铅白，磨到两条胳膊都酸了，窗缝里一阵阵进来运河上的潮气。颜料商说如今的画家都要白得像奶油一样滑，他真想卖他们一罐奶油，看看谁分得出来。'
          barge: '9 月 26 日，{staff}帮一个船夫撑着一船泥炭沿玫瑰运河走，船头的泥炭湿得发黑。他说今年秋天水浅得很，每过一座桥船底都要刮一下，他已经开始跟桥下的石头一块块打招呼了。'
          watchman: '十一月中旬，{staff}陪守夜人冒雨走了一圈，石板路上的积水映着灯笼。他在每个街角摇一下木响板，报一声时辰。他说这个月的雨连响板都淋进去了，摇起来像在咳嗽。'
text:
  en:
    name: Rembrandt van Rijn
    text: Dutch painter and etcher, 1606 to 1669. He painted portraits and story scenes with strong light, including The Night Watch. He went bankrupt in 1656 and spent his last years in Amsterdam in debt.
  zh:
    name: 伦勃朗
    text: 荷兰画家与蚀刻师，1606 年生，1669 年去世。他画光线强烈的肖像和叙事画，包括《夜巡》。1656 年他破产，晚年在阿姆斯特丹负债度日。
hook: {en: 'His last painting, left on the easel', zh: '最后一幅画，停在了半路'}
facts:
  titus:
    date: '1668-09-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [rembrandt_genealogy, rembrandt_wiki]
    text:
      en: 'Titus van Rijn, the only son of Rembrandt to grow up, married Magdalena van Loo on 28 February 1668 and was buried in Amsterdam on 7 September 1668. Rembrandt outlived him.'
      zh: '提图斯·范·莱因是伦勃朗唯一长大成人的儿子，1668 年 2 月 28 日娶了玛格达莱娜·范·卢，同年 9 月 7 日在阿姆斯特丹下葬。伦勃朗比他活得久。'
    note: 'A death: written as a plain fact.'
    line:
      en: '7 September 1668: Rembrandt''s son Titus is buried in Amsterdam.'
      zh: '1668 年 9 月 7 日，伦勃朗的儿子提图斯在阿姆斯特丹下葬。'
  titia:
    date: '1669-03'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [rembrandt_genealogy, rembrandt_wiki]
    text:
      en: 'Titia, the daughter of Titus and Magdalena van Loo, was born in Amsterdam half a year after her father died; the Amsterdam register dates her to 22 March 1669. The inheritance of Titus passed to her, his only child.'
      zh: '提图斯与玛格达莱娜·范·卢的女儿蒂蒂娅在父亲死后半年出世，阿姆斯特丹的登记记在 1669 年 3 月 22 日。提图斯的遗产归了这个独生女。'
    line:
      en: 'March 1669: half a year after Titus died, his daughter Titia is born.'
      zh: '1669 年 3 月，提图斯死后半年，他的女儿蒂蒂娅出世。'
  late_portrait:
    date: '1669'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [rembrandt_amsterdam_primary, rembrandt_amsterdam_two_dated_portraits]
    text:
      en: 'The dated Self Portrait at the Age of 63 in London and the self-portrait of 1669 in the Mauritshuis show that Rembrandt was painting self-portraits in the year of his death.'
      zh: '伦敦的《六十三岁自画像》和莫瑞泰斯皇家美术馆所藏的 1669 年自画像都署了年份，可见他在去世那年仍在画自己的脸。'
    line:
      en: '1669: Rembrandt paints self-portraits dated that year.'
      zh: '1669 年，伦勃朗画下几幅署这一年的自画像。'
  death:
    date: '1669-10-04'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [rembrandt_genealogy, rembrandt_wiki]
    text:
      en: 'Rembrandt died in Amsterdam on Friday 4 October 1669, aged sixty three.'
      zh: '1669 年 10 月 4 日，星期五，伦勃朗在阿姆斯特丹去世，六十三岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '4 October 1669: Rembrandt dies in Amsterdam, aged sixty three.'
      zh: '1669 年 10 月 4 日，伦勃朗在阿姆斯特丹去世，六十三岁。'
  burial:
    date: '1669-10-08'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [rembrandt_genealogy, rembrandt_wiki]
    text:
      en: 'Rembrandt was buried in Amsterdam on 8 October 1669, four days after his death, in a rented grave.'
      zh: '1669 年 10 月 8 日，伦勃朗去世四天后，葬进阿姆斯特丹一处租来的墓穴。'
    note: 'A death: written as a plain fact.'
    line:
      en: '8 October 1669: Rembrandt is buried in a rented grave.'
      zh: '1669 年 10 月 8 日，伦勃朗葬进一处租来的墓穴。'
  unfinished:
    date: '1669'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [rembrandt_last_painting]
    text:
      en: 'The Nationalmuseum in Stockholm records that its painting by Rembrandt of about 1669 was his last, and that it was left unfinished at his death.'
      zh: '斯德哥尔摩国立博物馆的藏品记录写明，馆藏这幅约作于 1669 年的伦勃朗油画是他最后一幅画，他去世时没有画完。'
  widow:
    date: '1669-10-21'
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [rembrandt_genealogy]
    text:
      en: 'Magdalena van Loo, the widow of Titus, was buried in Amsterdam on 21 October 1669, two weeks after Rembrandt.'
      zh: '1669 年 10 月 21 日，提图斯的遗孀玛格达莱娜·范·卢在阿姆斯特丹下葬，比伦勃朗晚两个星期。'
    note: 'A death: written as a plain fact.'
    line:
      en: '21 October 1669: Titus''s widow is buried in Amsterdam.'
      zh: '1669 年 10 月 21 日，提图斯的遗孀在阿姆斯特丹下葬。'
