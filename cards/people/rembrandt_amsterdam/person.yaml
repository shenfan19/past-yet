    scene:
      star_rules: 2
      points:
        - {id: p1, kind: care, day: 15, req: {"any":[{"job":["painter","illustrator","restorer"],"stat":{"finesse":7}},{"trait":["artistic"],"stat":{"finesse":8}}]}}
