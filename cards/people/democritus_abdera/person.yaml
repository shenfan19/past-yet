- democritus_abdera
text:
  en:
    name: Democritus
    text: Greek philosopher of Abdera, born about 460 BC. With his teacher Leucippus he held that everything is made of atoms moving in empty space. Only fragments and later reports of his many works survive.
  zh:
    name: 德谟克利特
    text: 阿布德拉的希腊哲学家，约公元前 460 年生。他与老师留基伯主张万物由在虚空中运动的原子构成。他的大量著作只留下残篇和后人的转述。
