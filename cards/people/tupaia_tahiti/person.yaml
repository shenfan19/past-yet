events:
- tupaia_tahiti
text:
  en:
    name: Tupaia
    text: Navigator and priest from Raiatea, about 1725 to 1770. In 1769 he joined James Cook's ship at Tahiti and helped draw a chart of the Pacific islands from memory. He died of illness at Batavia.
  zh:
    name: 图帕亚
    text: 来自赖阿特阿岛的领航人与祭司，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
