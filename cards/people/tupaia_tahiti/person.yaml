era_text:
  en:
    name: Tahiti, 1769
    short: Tahiti
    place_name: Tahiti, Society Islands
    tags:
      - medical
      - voyage
      - scurvy
      - c18
      - tahiti
      - history
    event_titles:
      expedition_handoff: 'The island-name list'
      time_strain: Time slip
    plots:
      chart:
        name: Give Tupaia a chart table
        desc: Lets him lay out the islands he knows so that others can read them.
        character: Tupaia
        article: people:tupaia_tahiti
      germ_theory:
        name: Explain germ theory to Tupaia
        desc: Needs the craft of microbiology, which this era does not have.
        character: Tupaia
        article: people:tupaia_tahiti
    blurb: A ship about to cross the Pacific, and a navigator who knows where the islands are. Close, cheap, and the effect of fresh food and clean water is clear.
    handle_label: The plan for fresh food is changed
    protagonist: Tupaia
    protagonist_role: A navigator and priest of the islands who knows the sea and the islands around Tahiti
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: The Endeavour reached Tahiti in April 1769 and stayed until July.
          check: true
        - text: Tupaia, a navigator and priest from the islands, joined the ship and drew a chart of the islands he knew.
          check: true
        - text: He sailed with the Endeavour and died in Batavia in 1770. Banks records the death on 11 November, and Cook writes about it in his 26 December entry.
          check: true
      regret:
        - You can save today's people but not the whole voyage. On the main timeline sickness came to the ship the following year.
        - Fresh food and clean water matter more than any one clever idea, but a plan only changes when someone is heard.
    events:
      expedition_handoff: '{date}: {staff} waits while Maeva repeats the island name. She has enough time to hear Reed read it back and correct him. The first boat is already away when her version is ready.'
      expedition_send: '{date}: Reed wants a list before the boat leaves. {staff} lets the list go with one uncertain spelling marked beside Maeva’s account. The recorder aboard has a place to put the next answer.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: 'Convince Tupaia'
      trust: 'Win the trust of the ship''s company'
      reform: 'Have the plan for fresh food changed before the simulation baseline'
    milestones:
      boards: '{date}: Banks records that Tupaia came aboard and reaffirmed his wish to sail.'
      departs: '{date}: The Endeavour departs Tahiti with Tupaia and Taiata aboard.'
      first_treat: '{date}: {staff} brings the first cup of fruit juice to a man with swollen gums. He starts to speak.'
      first_protect: '{date}: {staff} hands out the first hats and nets to the working parties, and teaches the men to use them.'
      met_tupaia: '{date}: {staff} is received by Tupaia.'
      tupaia_trusts: '{date}: Tupaia gives {staff} the notes to work from.'
      tupaia_convinced: '{date}: Tupaia takes up the plan that {staff} put to him.'
      board_moves: '{date}: Word goes round that the plan might change.'
      reform_history: '{date}: The simulated expedition sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The plan for fresh food is changed {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: The ship''s company no longer keeps {staff} out, and some ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of ailing men falls to single digits.'
    summary:
      near_death: '{staff} collapses at Tahiti and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend at Tahiti. The plan was changed {advance_days:1} days before the model’s baseline.'
      perfect: '{staff} completed the task at Tahiti and came back safe. The simulation records {base_D:i} lost in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days at Tahiti, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was keeping watch at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's people, not tomorrow's.
        - trait: curious
          text: So that is how it is, fresh food and clean water keep a ship's company well.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they listen is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Hats were left over. The limit was the trust of the ship's company, not the supplies. Let the employee help people first to build trust.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
      ally_gap: Tupaia's evidence is still thin. The handbook helps, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    name: 塔希提 1769
    short: 塔希提
    place_name: 社会群岛塔希提
    tags:
      - medical
      - voyage
      - scurvy
      - c18
      - tahiti
      - history
    event_titles:
      expedition_handoff: '岛名清单'
      time_strain: 时间错位
    plots:
      chart:
        name: 送图帕亚一张海图桌
        desc: 让他把自己熟悉的岛屿摊开，别人才能读懂。
        character: 图帕亚
        article: people:tupaia_tahiti
      germ_theory:
        name: 把细菌致病的理论讲给图帕亚
        desc: 需要微生物学的工艺，这个时代还没有。
        character: 图帕亚
        article: people:tupaia_tahiti
    blurb: 一艘即将横渡太平洋的船，和一位知道岛在哪里的领航员。近，成本低，新鲜食物和干净水的效果很明显。
    handle_label: 新鲜食物计划被改
    protagonist: 图帕亚
    protagonist_role: 熟悉海和塔希提周围岛屿的领航员兼祭司
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: 奋进号 1769 年 4 月到达塔希提，停到 7 月。
          check: true
        - text: 图帕亚是岛上的领航员兼祭司，他上了船，画下了自己熟悉的那些岛的海图。
          check: true
        - text: 他随奋进号航行，1770年死于巴达维亚。班克斯在11月11日记其去世，库克在12月26日的条目中谈到此事。
          check: true
      regret:
        - 你能救今天的人，救不了整次航行。主时间线上第二年疾病上了船。
        - 新鲜食物和干净水比任何一个聪明的主意都重要，但计划只有在有人被听见时才会改。
    events:
      expedition_handoff: '{date}，{staff} 等玛埃娃把岛名再说一次。她听里德念回给她，赶得及纠正。她认可的写法备好时，头一班船已经走了。'
      expedition_send: '{date}，里德要赶在小船走前交单。{staff} 让清单先走，在玛埃娃说过的名字旁标一处拼写待查。船上的记录员有地方添下次问到的答案。'
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      convince: '说服图帕亚'
      trust: '赢得船员的信任'
      reform: '让新鲜食物的计划比模型基准更早改变'
    milestones:
      boards: '{date}，班克斯记下图帕亚登船，并重申愿意随船远行。'
      departs: '{date}，奋进号驶离塔希提，图帕亚与泰阿塔随船。'
      first_treat: '{date}：{staff} 给一个牙龈肿胀的人递上第一杯果汁，他开始开口了。'
      first_protect: '{date}：{staff} 给干活的人发下第一批帽子和网，教大家使用。'
      met_tupaia: '{date}：{staff} 被图帕亚接见。'
      tupaia_trusts: '{date}：图帕亚把笔记交给 {staff} 用。'
      tupaia_convinced: '{date}：图帕亚采纳了 {staff} 提出的办法。'
      board_moves: '{date}：消息传开，计划也许要改。'
      reform_history: '{date}，模拟中的队伍按模型基准日调整安排。'
      reform_early: '{date}：新鲜食物的计划比模型基准提前 {advance_days:1} 天改变。主时间线没有变化，只是这条分支。'
      trust_won: '{date}：船员们不再把 {staff} 挡在外面，有的还开口求助。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：生病的人数降到了个位数。'
    summary:
      near_death: '{staff} 在塔希提倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在塔希提留下了传说。计划比模型基准提前 {advance_days:1} 天改变。'
      perfect: '{staff} 在塔希提完成了任务，平安回来。模拟基准损失 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒绝，最后带着一个笑话逃了回来。'
      modest: '{staff} 在塔希提待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人守着。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他们需要听到的话告诉了他们。
      perfect:
        - trait: kind
          text: 我能救今天的人，救不了明天的。
        - trait: curious
          text: 原来是这样，新鲜食物和干净的水才让一船人保持健康。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，听不听由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 帽子剩下了。限制不是物资，是船员对你的信任。先让员工帮人做事，建立信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
      ally_gap: 图帕亚的证据还很薄。手册能帮上忙，前提是员工花时间和他在一起。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

