        - places:tahiti_endeavour
      unlock:
        era: tupaia_tahiti_1769
      refs:
        - tupaia_banks_july
        - cook1773
        - game
      text:
        en:
          name: The plan for fresh food
          text: What the ship took on at the islands for the long voyage was the choice of the ship's officers. In the game an employee can help bring a change of plan earlier, which holds only in this branch.
        zh:
          name: 新鲜食物的计划
          text: 船在岛上为长途航行补什么，是船上军官的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
