events:
  tupaia_tahiti:
    order: 196
    build_step: 4
    ready: true
    year: 1770
    date: '1770-06-01'
    stay: 7
    lon: 145.57
    lat: -15.78
    region: oceania
    home: [pacific]
    field: exploration
    tier: 2
    channels: {Y: 3, E: 2}
    refs: [tupaia_tepapa_cannon, tupaia_anmm_cannonball, tupaia_banks_june, tupaia_banks_hooker, tupaia_banks_november, tupaia_chart_survival, tupaia_banks_july, potsdam_tupaia_map]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: endure, guard: true, day: 10, req: {"any":[{"job":["sailor","shipwright","navigator","ferry_pilot"]},{"stat":{"constitution":9}},{"provides":"strength","stat":{"will":5}}]}}
        - {id: p2, kind: care, day: 13, req: {"any":[{"item":"vitamin_c"},{"job":["fisher","fisherman","doctor","physician","nurse","pharmacist"]}]}}
        - {id: p3, kind: care, day: 155, req: {"any":[{"job":["doctor","physician","nurse","paramedic","caregiver"],"stat":{"will":6}},{"trait":["kind","patient","vigil"],"stat":{"will":6,"wit":6}}]}}
      vignettes:
        - {id: pronounce, traits: [cosmopolitan, curious], day: 46}
        - {id: route, traits: [methodical, wanderer], day: 30}
        - {id: room, day: 20}
    text:
      en:
        name: "The navigator's chart"
        place: "Aboard the Endeavour"
        figure: "Tupaia"
        story: 'Tupaia, a navigator from Raiatea, joined the Endeavour in 1769 and helped chart the islands he knew. The ship struck a reef off what is now Queensland in June 1770. Banks recorded Tupaia’s scurvy during the repairs and reported the deaths of Taiata and Tupaia later that year at Batavia.'
        story_prose:
          opening:
            - 'On the Endeavour, Tupaia is checking island names he knows when the ship strikes. A bundle slides off the corner of a table and a watchman calls up for help. It is still dark when they learn the ship is fast on a reef.'
            - 'The Endeavour struck a reef off present-day Queensland in 1770. The crew refloated and repaired her. Tupaia fell ill during that period, and Banks recorded news of the deaths of Taiata and Tupaia at Batavia months later. The branch can preserve the ship, get fresh food to Tupaia and give the two time together when ill.'
            - 'Send someone who can help the crew keep its stations. During repairs someone should ask Tupaia what he can eat. In Batavia the party needs time to arrange a visit at the bedside.'
          points:
            p1: 'A box blocks the place where people have to pass a load up from below. You clear room for the next person on the pumps and leave a way for the crew with the box. The hands at the other end stay by the line until they are called to pull together. When the ship moves, the first question is whether the person by the pump still has his footing.'
            p2: 'The fresh food is sent to the repair parties first. Tupaia hears names being called and asks how much longer he is expected to wait. You have a portion brought where he can choose what he wants to eat, then record what is left for the next group. When the plate reaches him, he has first choice of what was set aside for him.'
            p3: 'There are many sick people in the Batavia room and the same carers keep being called away. Tupaia asks someone to find out if Taiata will see him. You pass on the question, and wait for both to agree before moving a chair to the bed. When you leave, they can still hear each other speak.'
          outcomes:
            all: 'The ship comes free as in history. The branch also records Tupaia’s share of food and their bedside visit. The news of both deaths remains in the record.'
            p1: 'The Endeavour comes free. The repair parties will have more work to do; later arrangements remain to be made.'
            p2: 'Tupaia receives the portion he has chosen. This part of the record stops with the plate being brought to him.'
            p3: 'The two are near enough to speak for a short time. The deaths at Batavia still follow.'
          none: 'People are still waiting for the next order on deck. No fresh share has been set aside, and the later visit has not been arranged.'
          not_admitted: 'The crew asks unassigned people to clear the station by the pump. From the other end you see someone pick up a wet bundle of papers.'
          desync: 'The Endeavour is still fast at dawn. The historical recovery falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'When the ship moves, the first question is whether the person by the pump still has his footing.'
            p2: 'When the plate reaches him, he has first choice of what was set aside for him.'
            p3: 'When you leave, they can still hear each other speak.'
        relic: "A sketch of islands"
        relic_desc: "A sheet of ink and wash with small island shapes and names."
        points:
          p1: 'The night the ship strikes the reef, help lighten her and work the pumps, and keep the Endeavour afloat'
          p2: 'Set aside fresh food for Tupaia while the repair parties are being supplied, and let him choose what he can eat'
          p3: 'At Batavia, make time for Tupaia to sit with Taiata and ask whom they want nearby while they are sick'
        points_fail:
          p1: 'At daybreak the ship is still fast on the reef with water over the hold. The branch drifts out of sync with history, and the office recalls the employee that day.'
          p2: 'The fresh supplies go to the repair parties first. Tupaia has to wait for a share.'
          p3: 'The people around them are called away to other sickbeds. The visit Tupaia asked for has to wait.'
        shift:
          p1:
            was: '10 to 11 June 1770: the Endeavour ran onto what is now Endeavour Reef. The crew threw six guns, ballast, water and spoiled stores overboard, and she floated off on the rising tide.'
          p2:
            was: '16 June 1770: Banks wrote that Tupaia had bad scurvy, his gums gone and livid spots on his legs, and that the remedies on board did not help.'
            now: 'In this branch Tupaia has a share of the fresh food while the ship is being repaired. He can choose what to eat without first going out to catch something.'
          p3:
            was: 'At Batavia, Banks received news of Taiata’s death and then news of Tupaia’s.'
            now: 'In this branch {staff} makes a place for Tupaia to sit close to Taiata. The two choose who can stay and have a little time to speak together.'
        vignettes:
          pronounce: '{staff} asks a copyist, made up for the game, to read two spellings aloud before drawing a second island, and he puts a question mark by the names instead.'
          route: '{staff} asks from which island a bearing was given before a straight line is drawn between two marks, and the line is left undrawn.'
          room: '{staff} holds down the rolled corner of a sheet so that a new name can be written without covering the one before.'
      zh:
        name: "领航者的海图"
        place: "奋进号上"
        figure: "图帕亚"
        story: '来自赖阿特阿岛的领航者图帕亚于 1769 年登上奋进号，帮人画下自己熟悉的群岛。1770 年 6 月，船在今天昆士兰外海触礁。班克斯记下图帕亚在修船期间患坏血病，又在同年晚些时候于巴达维亚记下泰阿塔和图帕亚的死讯。'
        story_prose:
          opening:
            - '奋进号船上，图帕亚正跟人核自己读得出的岛名，船身忽然一撞。布包从桌角滑下，值班水手往上喊人。天还没亮，大家才知道船卡在礁上。'
            - '史实里，1770 年奋进号在今昆士兰外海触礁，之后脱险修理。图帕亚在此期间病过，几个月后班克斯在巴达维亚记下泰阿塔与图帕亚的死讯。分支可以护住脱礁，给图帕亚分到鲜食，也让两人病中有时间见面。'
            - '找能帮船员守住工作位置的人。修船时要有人问图帕亚自己吃得下什么，到了巴达维亚要能安排病中探望。'
          points:
            p1: '船员要把东西从低处提上来，有一只箱子还堆在挡手的位置。你替下一个压泵的人腾出立足处，留出转运箱子的空当。另一边的人一直守着绳，等叫下一轮时再一起用力。船身动的那一下，有人先问泵边的人还站不站得稳。'
            p2: '管分食的人先把鲜食送往修船的队伍。图帕亚听见有人在点名，问他今日还能再等多久。你请人端来一份，让他先挑愿意吃的东西，再把余量记给下一班。那只盘子送到跟前时，鲜食没有在别人手里先分完。'
            p3: '巴达维亚一间房里病人多，照看的人几次要被喊走。图帕亚请留下来的人问泰阿塔愿不愿见他。你把这句话带过去，两人都点头，这才有人把一把椅子从门边挪到床旁。你离开时，他们还能听清彼此说话。'
          outcomes:
            all: '船照史实脱险。修船和后来病中的探望都留下分支记录，泰阿塔、图帕亚的死讯仍在。'
            p1: '奋进号从礁上脱开。修船的人将回来继续分工，船上其他日子的安排还等着办。'
            p2: '图帕亚拿到他自己挑的那份鲜食。事情只写到那只盘子递来。'
            p3: '两人有一会儿能坐得近。巴达维亚的死讯没有因为这次见面改变。'
          none: '船上有人还等着下一个口令。舱里既没留出鲜食，也没能约到后来想见的人。'
          not_admitted: '水手让没有分工的人离开泵旁。你留在另一头，看见有人把湿透的纸束从脚边收起来。'
          desync: '天亮船仍钉在礁上。未能保住史实中的脱险，事务所召回员工。'
          excerpts:
            p1: '船身动的那一下，有人先问泵边的人还站不站得稳。'
            p2: '那只盘子送到跟前时，鲜食没有在别人手里先分完。'
            p3: '你离开时，他们还能听清彼此说话。'
        relic: "一张岛屿草图"
        relic_desc: "一张墨与淡彩的纸，画着小小的岛形和名字。"
        points:
          p1: '触礁那一夜帮着减重、压泵，护住奋进号不沉'
          p2: '修船各队分鲜食时给图帕亚留一份，让他自己挑吃得下的东西'
          p3: '在巴达维亚替图帕亚找时间坐到泰阿塔身边，问他们病中想让谁留下来'
        points_fail:
          p1: '天亮时船还卡在礁上，水漫过了货舱。分支和历史脱了节，员工在这一天被送回。'
          p2: '鲜食先分给修船的人。图帕亚还得等，才有自己的一份。'
          p3: '身边的人又被叫去别的病榻。图帕亚想见泰阿塔，还要接着等。'
        shift:
          p1:
            was: '1770 年 6 月 10 日夜到 11 日，奋进号撞上今天的奋进礁，船员扔掉六门炮、压舱物、淡水和坏了的存粮，涨潮时船才浮起来。'
          p2:
            was: '1770 年 6 月 16 日，班克斯记下图帕亚坏血病很重，牙龈坏了，腿上起了青紫的斑，船上的药都不管用。'
            now: '这条分支里，修船期间图帕亚分到了鲜食。他挑得出自己吃得下的东西，也不用先出门捕鱼。'
          p3:
            was: '在巴达维亚，班克斯先收到泰阿塔的死讯，又收到图帕亚的死讯。'
            now: '这条分支里，{staff}替图帕亚在泰阿塔身边留了座。两人商量谁可以留下陪他们，也有了一点时间说话。'
        vignettes:
          pronounce: '一位编出来的抄图人以为两种拼法是两座岛。{staff}请他先把两个名字念出来，他便在名字旁留了个问号，没画新岛。'
          route: '抄图人要在两个记号之间拉一条直线，{staff}问刚才说方位是从哪座岛算起的，那条线就没有画下去。'
          room: '{staff}压住卷起的纸角，下一个名字写下去时，就不会盖住上一个。'
text:
  en:
    name: Tupaia
    text: Navigator from Raiatea, about 1725 to 1770. In 1769 he joined James Cook's ship at Tahiti and helped draw a chart of the Pacific islands from memory. He died of illness at Batavia.
  zh:
    name: 图帕亚
    text: 来自赖阿特阿岛的领航人，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
