events:
  tupaia_tahiti:
    order: 196
    year: 1769
    # the planned arrival is 1 July 1769, a few days before Tupaia went aboard the Endeavour
    date: '1769-07-01'
    lon: -149.5
    lat: -17.5
    region: oceania
    home: [pacific]
    field: exploration
    tier: 2
    era: tupaia_tahiti_1769
    channels: {Y: 2, E: 2}
    regret: true
    # finished: in the game with release.ready_only; its full model is still a draft, so the game plays the scene
    ready: true
    refs: [tupaia_chart_survival, tupaia_banks_july, wikipedia_tupaia, potsdam_tupaia_map]
    scene:
      points:
        - {id: p1, kind: trust, day: 9, req: {"any":[{"trait":["hardy","cheerful","kind"]},{"stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 12.5, req: {"any":[{"trait":["streetwise","wanderer","vigil"]},{"job":["sailor","fisher"]},{"stat":{"wit":6}}]}}
        - {id: p3, kind: trust, redeem: true, day: 45.5, req: {"any":[{"job":["sailor","fisher"]},{"trait":["attached","cosmopolitan","patient"]}]}}
      vignettes:
        - {id: pronounce, traits: [cosmopolitan, curious], day: 46}
        - {id: route, traits: [methodical, wanderer], day: 30}
        - {id: room, day: 20}
    text:
      en:
        name: "The navigator's chart"
        place: "Tahiti"
        figure: "Tupaia"
        story: 'Tupaia, a navigator and priest from Raiatea, came aboard the Endeavour at Tahiti in July 1769 and sailed with James Cook. From the middle of August he worked on a chart of the islands around, some 130 of them, 74 named by him; his own sketch is lost and a copy survives in the papers of Joseph Banks. He died at Batavia late in 1770.'
        relic: "A sketch of islands"
        relic_desc: "A sheet of ink and wash with small island shapes and names."
        points:
          p1: 'Be taken in by the people on the shore, then roll the water casks down to the boats'
          p2: 'On the day the ship sails, write down the wind he points to and the bearing of the first island'
          p3: 'While he draws the chart, write down each island name as he says it'
        vignettes:
          pronounce: '{staff} asks a copyist, made up for the game, to read two spellings aloud before drawing a second island, and he puts a question mark by the names instead.'
          route: '{staff} asks from which island a bearing was given before a straight line is drawn between two marks, and the line is left undrawn.'
          room: '{staff} holds down the rolled corner of a sheet so that a new name can be written without covering the one before.'
      zh:
        name: "领航者的海图"
        place: "塔希提"
        figure: "图帕伊亚"
        story: '来自赖阿特阿岛的领航者兼祭司图帕伊亚，1769 年 7 月在塔希提登上“奋进号”，随詹姆斯·库克远航。从八月中旬起，他画了一幅周边群岛的海图，图上约有 130 座岛，其中 74 座的名字是他说出来的；他自己的草图已经遗失，一份抄本保存在约瑟夫·班克斯的文件里。1770 年末，他在巴达维亚病逝。'
        relic: "一张岛屿草图"
        relic_desc: "一张墨与淡彩的纸，画着小小的岛形和名字。"
        points:
          p1: '先让岸上的人认下，再帮着把淡水桶滚到小船边'
          p2: '起航那天，记下他指的风向和第一座岛的方位'
          p3: '他画海图的时候，把他念出的岛名一个个记下'
        vignettes:
          pronounce: '一位编出来的抄图人以为两种拼法是两座岛。{staff}请他先把两个名字念出来，他便在名字旁留了个问号，没画新岛。'
          route: '抄图人要在两个记号之间拉一条直线，{staff}问刚才说方位是从哪座岛算起的，那条线就没有画下去。'
          room: '{staff}压住卷起的纸角，下一个名字写下去时，就不会盖住上一个。'
text:
  en:
    name: Tupaia
    text: Navigator and priest from Raiatea, about 1725 to 1770. In 1769 he joined James Cook's ship at Tahiti and helped draw a chart of the Pacific islands from memory. He died of illness at Batavia.
  zh:
    name: 图帕亚
    text: 来自赖阿特阿岛的领航人与祭司，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
