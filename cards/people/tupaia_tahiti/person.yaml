    order: 196
    year: 1769
    lon: -149.5
    lat: -17.5
    region: oceania
    field: exploration
    tier: 2
    era: tupaia_tahiti_1769
    channels: {Y: 3, E: 2}
    regret: true
    refs: [tupaia_chart_survival, tupaia_banks_july]
    scene:
      points:
        - {id: p1, kind: endure, req: {"stat":{"constitution":6}}}
        - {id: p2, kind: notice, req: {"trait":["streetwise","wanderer","vigil"]}}
        - {id: p3, kind: trust, redeem: true, req: {"any":[{"job":["sailor","fisher"]},{"trait":["attached","cosmopolitan","artistic"]}]}}
      vignettes:
        - {id: pronounce, traits: [cosmopolitan, curious]}
        - {id: route, traits: [methodical, wanderer]}
        - {id: room}
    text:
      en:
        name: "The navigator's chart"
        place: "Tahiti"
        figure: "Tupaia"
        story: 'Tupaia joined the Endeavour at Tahiti in 1769. The State Library of New South Wales reproduces a surviving copy of a South Sea chart based on Tupaia''s geographical knowledge. This exchange over place names is invented.'
        relic: "A sketch of islands"
        relic_desc: "A sheet of ink and wash with small island shapes and names."
        points:
          p1: "Share the cramped cabin on the passage"
          p2: "Watch him draw the chart of the islands"
          p3: "Learn the island names from him (a seafarer or a kind employee)"
        vignettes:
          pronounce: 'A fictional copyist thinks two spellings belong to different islands. You ask them to read both aloud before drawing another island. They put a question alongside the names until someone who knows can check.'
          route: 'The copyist draws a straight line between two marks. You ask which island the explanation started from. They lift the pen and leave the bearings with the account that gave them.'
          room: 'You hold the folded corner of the sheet while the copyist writes another name. They move their hand so the next name can be written without covering the first.'
      zh:
        name: "领航者的海图"
        place: "塔希提"
        figure: "图帕亚"
        story: '1769 年，图帕亚在塔希提登上奋进号。新南威尔士州立图书馆展示了一幅据图帕亚地理知识绘成的南太平洋海图的传世抄本。这段核对地名的交谈为虚构。'
        relic: "一张岛屿草图"
        relic_desc: "一张墨与淡彩的纸，画着小小的岛形和名字。"
        points:
          p1: "在航程中挤着住那间小舱"
          p2: "看他画那幅群岛海图"
          p3: "向他学岛的名字"
        vignettes:
          pronounce: '虚构的抄图人以为两种拼法是两座岛。你请他先把两个名字念出来，再决定画不画新岛。他在名字旁留了个问号，等熟悉的人来核对。'
          route: '抄图人拿笔要在两个记号间拉道直线。你问刚才说方位时是从哪座岛算起的。他抬起笔，把这个方位留在原先那段说法旁。'
          room: '抄图人写下一个名字时，你压住卷起的纸角。他挪开手，好让下一个名字落笔时不盖住上一个。'
text:
  en:
    name: Tupaia
    text: Navigator and priest from Raiatea, about 1725 to 1770. In 1769 he joined James Cook's ship at Tahiti and helped draw a chart of the Pacific islands from memory. He died of illness at Batavia.
  zh:
    name: 图帕亚
    text: 来自赖阿特阿岛的领航人与祭司，约 1725 年生，1770 年去世。1769 年他在大溪地登上詹姆斯·库克的船，凭记忆帮忙画出太平洋诸岛的海图。他在巴达维亚病逝。
