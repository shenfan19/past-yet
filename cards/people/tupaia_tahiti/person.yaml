  chart:
    date: '1769-08-15'
    stay_day: 45
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_tupaia, potsdam_tupaia_map]
    text:
      en: 'From 15 August 1769 Tupaia worked on a chart of about 130 islands within some two thousand miles, 74 of them named by him. His own sketch is lost; a copy by Cook survives in the papers of Joseph Banks at the British Library.'
      zh: '从 1769 年 8 月 15 日起，图帕伊亚画了一幅方圆约两千英里、约 130 座岛的海图，其中 74 座的名字是他说的。他自己的草图已遗失，库克的抄本保存在大英图书馆的班克斯文件里。'
    line:
      en: '15 August: Tupaia starts on a chart of the islands he knows, some 130 of them. Seventy four he names himself.'
      zh: '8 月 15 日，图帕伊亚开始画他知道的群岛，约 130 座。其中 74 座的名字，是他自己说出来的。'
  death:
    date: '1770'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wikipedia_tupaia, potsdam_tupaia_map]
    text:
      en: 'Tupaia died at Batavia late in 1770, most sources say on 20 December; one gives 11 November.'
      zh: '图帕伊亚 1770 年末在巴达维亚病逝，多数说法是 12 月 20 日，也有一说是 11 月 11 日。'
    note: 'Death: written as a plain fact.'
    line:
      en: 'Late 1770: at Batavia, Tupaia dies of illness, far from the islands on his chart.'
      zh: '1770 年末，图帕伊亚在巴达维亚病逝，离他海图上的那些岛很远。'
