      en: {who: 'Gregor Mendel', quote: 'After eight years, it is now essentially complete.', occasion: 'introduction to Experiments on Plant Hybrids, published after his Brno talks (game translation)'}
      zh: {who: '格雷戈尔·孟德尔', quote: '八年过去，这项实验如今已大体完成。', occasion: '布尔诺报告后刊行的《植物杂交实验》引言（游戏译文）'}
  mendel_brno_courage:
    order: 2
    tier: none
    date: '1866'
    checked: official_record
    sources: [mendel_textgrid_1866]
    original: de
    text:
      de: {quote: 'Es gehört allerdings einiger Muth dazu, sich einer so weit reichenden Arbeit zu unterziehen'}
      en: {who: 'Gregor Mendel', quote: 'It does take some courage to undertake a piece of work that reaches so far.', occasion: 'introduction to Experiments on Plant Hybrids, published after his Brno talks (game translation)'}
      zh: {who: '格雷戈尔·孟德尔', quote: '要着手做这样一项长远的工作，确实需要一点勇气。', occasion: '布尔诺报告后刊行的《植物杂交实验》引言（游戏译文）'}
hook: {en: 'Two evenings of talks, then thirty five years', zh: '讲了两个晚上，等了三十五年'}
facts:
  experiments:
    date: '1856'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_brno_replication_letters, mendel_wiki]
    text:
      en: 'From 1856 to 1863 Mendel grew and crossed pea plants in the garden at Brno, eight years of experiments by his own account.'
      zh: '1856 年到 1863 年，孟德尔在布尔诺的园子里种豌豆、做杂交，按他自己的说法前后八年。'
    line:
      en: '1856: Mendel begins crossing pea plants in the garden at Brno; he will keep at it for eight years.'
      zh: '1856 年，孟德尔在布尔诺的园子里开始杂交豌豆，一做就是八年。'
  first_talk:
    date: '1865-02-08'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_brno_manuscript_1865, mendel_brno_lecture_sources]
    text:
      en: 'On 8 February 1865 Mendel gave the first of two talks to the Natural History Society of Brno, on plant hybrids made by artificial fertilisation.'
      zh: '1865 年 2 月 8 日，孟德尔在布尔诺自然科学学会作两场报告中的第一场，讲人工授粉得来的植物杂种。'
    line:
      en: '8 February 1865: Mendel gives the first of his two talks on pea hybrids to the Brno society.'
      zh: '1865 年 2 月 8 日，孟德尔在布尔诺学会讲豌豆杂交，这是两场里的第一场。'
  second_talk:
    date: '1865-03-08'
    stay_day: 41
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_brno_manuscript_1865, mendel_brno_lecture_sources, mendel_brno_replication_letters]
    text:
      en: 'On 8 March 1865 Mendel gave the second talk, on fertilisation and the forming of seeds, and set out how the offspring of hybrids divide.'
      zh: '1865 年 3 月 8 日，孟德尔作第二场报告，讲受精和种子的形成，列出杂种后代怎样分离。'
    line:
      en: '8 March 1865: Mendel gives his second talk and sets out how the offspring of hybrids divide.'
      zh: '1865 年 3 月 8 日，孟德尔作第二场报告，讲杂种的后代怎样分开。'
  printed:
    date: '1866'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_brno_primary, mendel_brno_replication_letters]
    text:
      en: 'In 1866 the paper Versuche über Pflanzen-Hybriden was printed in the proceedings of the Natural History Society of Brno, volume 4, about a year after the talks.'
      zh: '1866 年，《植物杂交实验》刊在布尔诺自然科学学会会刊第 4 卷，离两场报告约一年。'
    line:
      en: '1866: the paper Experiments on Plant Hybrids is printed in the proceedings of the Brno society.'
      zh: '1866 年，《植物杂交实验》刊在布尔诺学会的会刊上。'
  death:
    date: '1884-01-06'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [mendel_wiki, mendel_britannica]
    text:
      en: 'Gregor Mendel died in Brno on 6 January 1884.'
      zh: '1884 年 1 月 6 日，格雷戈尔·孟德尔在布尔诺去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '6 January 1884: Gregor Mendel dies in Brno.'
      zh: '1884 年 1 月 6 日，格雷戈尔·孟德尔在布尔诺去世。'
  rediscovery:
    date: '1900'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_wiki, mendel_britannica]
    text:
      en: 'In 1900 Hugo de Vries, Carl Correns and Erich von Tschermak, each working on heredity, came upon Mendel''s paper and brought it to notice.'
      zh: '1900 年，雨果·德弗里斯、卡尔·科伦斯和埃里希·冯·切尔马克各自研究遗传时找到了孟德尔的论文，让它重新为人所知。'
    line:
      en: '1900: three botanists, working apart, come upon Mendel''s paper of 1866.'
      zh: '1900 年，三位植物学家各自找到了孟德尔 1866 年的那篇论文。'
