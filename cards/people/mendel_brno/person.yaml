      zh: '1865 年 3 月 8 日，孟德尔作第二场报告，讲杂种的后代怎样分开。'
  printed:
    date: '1866'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_brno_primary, mendel_brno_replication_letters]
    text:
      en: 'In 1866 the paper Versuche über Pflanzen-Hybriden was printed in the proceedings of the Natural History Society of Brno, volume 4, about a year after the talks.'
      zh: '1866 年，《植物杂交实验》刊在布尔诺自然科学学会会刊第 4 卷，离两场报告约一年。'
    line:
      en: '1866: the paper Experiments on Plant Hybrids is printed in the proceedings of the Brno society.'
      zh: '1866 年，《植物杂交实验》刊在布尔诺学会的会刊上。'
  death:
    date: '1884-01-06'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [mendel_wiki, mendel_britannica]
    text:
      en: 'Gregor Mendel died in Brno on 6 January 1884.'
      zh: '1884 年 1 月 6 日，格雷戈尔·孟德尔在布尔诺去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '6 January 1884: Gregor Mendel dies in Brno.'
      zh: '1884 年 1 月 6 日，格雷戈尔·孟德尔在布尔诺去世。'
  rediscovery:
    date: '1900'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendel_wiki, mendel_britannica]
    text:
      en: 'In 1900 Hugo de Vries, Carl Correns and Erich von Tschermak, each working on heredity, came upon Mendel''s paper and brought it to notice.'
      zh: '1900 年，雨果·德弗里斯、卡尔·科伦斯和埃里希·冯·切尔马克各自研究遗传时找到了孟德尔的论文，让它重新为人所知。'
    line:
      en: '1900: three botanists, working apart, come upon Mendel''s paper of 1866.'
      zh: '1900 年，三位植物学家各自找到了孟德尔 1866 年的那篇论文。'
