    text:
      en:
        name: Peas and the rules of heredity
        place: Brno
        figure: Gregor Mendel
        story: 'From 1856 to 1863 Gregor Mendel crossed pea plants in the garden of his house in Brno and counted their offspring. On 8 February and 8 March 1865 he reported the results in two talks to the Natural History Society of Brno, and the paper was printed in the society''s proceedings in 1866. It was hardly taken up in his lifetime. Mendel died in 1884, and in 1900 three botanists came upon his paper while working on heredity themselves.'
        story_prose:
          opening:
            - 'Brno, winter 1865. Since 1856 the friar Gregor Mendel has crossed pea plants in the monastery garden and counted their offspring generation by generation, eight years by his own account. This winter he is to set out those numbers before the Natural History Society of Brno.'
            - 'In history, he gave two talks, on 8 February and 8 March, and the paper was printed in the society’s proceedings the next year. In his lifetime hardly anyone took it further; he died in Brno in 1884, and only in 1900 did three botanists, each on his own, come upon it. In this branch, a porter lays straw mats at the door of the meeting room, and an old woman sells dried peas at the Cabbage Market.'
            - 'A few kinds of people can help on this trip: someone careful who can keep both talks safe; someone who teaches and can lay the numbers out generation by generation; someone persuasive who can get a listener to agree, before the meeting breaks up, to grow the peas again at home.'
          outcomes:
            all: 'That autumn a letter from elsewhere reached the monastery, with peas counted in another garden. Mendel spread it beside his own numbers on the table, with the sheet of counts by generation weighted down beside them.'
            p3: 'That autumn a letter from elsewhere reached the monastery, with peas counted in another garden. Mendel spread the two sets of numbers side by side on the table and went down them line by line.'
            p2: 'A few of those who heard the talk copied the sheet of counts by generation and took it home. When the proceedings came out the next year, they checked their copies against it, and every cell agreed.'
            p1: 'In 1866 the two talks became Experiments on Plant Hybrids, printed in the fourth volume of the society’s proceedings. In the monastery garden that year’s peas went in as usual.'
          none: 'In 1866 the paper was printed in the society’s proceedings, and hardly anyone took it further. In the monastery garden the pea frames stood empty every winter.'
          desync: 'On the evening of 8 February there was only time to describe the method, and the second talk was never set. When {staff} was recalled, most of Mendel’s manuscript lay unturned, pressed under the corner of the table in the meeting room.'
          not_admitted: '{staff} never got into the society’s meeting room, and spent a few days at the Cabbage Market helping the old woman sort dried peas. The round ones in one heap, the wrinkled in another; she never counted them.'
          points:
            p1:
              class_lettered: 'On the evening of 8 February the lamps were lit in the society’s meeting room, and the snow had melted into a pool on the straw mats at the door. In Mendel’s hands were eight years of numbers. The day before, {staff}, as a keeper of records does, had split the manuscript into two piles for him, slipped in a strip of paper to mark where this evening would end, and written the date of the next talk on the second pile. When he reached the dividing page he stopped, squared the rest of the manuscript and put it in his bag. When the meeting broke up, the date of the next talk was already in the minute book: 8 March.'
              else: 'On the evening of 8 February the lamps were lit in the society’s meeting room, and the snow had melted into a pool on the straw mats at the door. In Mendel’s hands were eight years of numbers. The night before, {staff} had heard him read the manuscript through, kept an eye on the clock, turned down a corner at the halfway point, and set the second half apart. When he reached the dividing page he stopped, squared the rest of the manuscript and put it in his bag. When the meeting broke up, the date of the next talk was already in the minute book: 8 March.'
            p2:
              class_teaching: 'On 8 March came the second talk. He told how the offspring of hybrids divide, reading the numbers out one after another, and people below copied them down until they could no longer tell one generation from the next. {staff}, as a teacher would, drew a table on the blackboard at the back of the room, one column for the first generation and one for the next, and filled in a cell each time he read a number. After the meeting several people still stood before the table, checking their notebooks against it line by line with their pencils. One of them, counting, said it aloud: three to one.'
              else: 'On 8 March came the second talk. He told how the offspring of hybrids divide, reading the numbers out one after another, and people below copied them down until they could no longer tell one generation from the next. {staff} had copied his numbers out beforehand by generation on a large sheet, one column for the first generation and one for the next, and pinned it to the wall at the back of the room. After the meeting several people still stood before the table, checking their notebooks against it line by line with their pencils. One of them, counting, said it aloud: three to one.'
            p3:
              class_lettered: 'On 12 March both talks were over, and those who had heard them had not yet gone their ways. {staff}, as a register is kept, set out a small book in which anyone willing to grow the peas again left a name and an address, and which counts were to be sent back the next year. Mendel took out a small packet of dried peas and handed it to the first man who had left his address; the variety and the counts for next year were written on the paper. The man put the packet in the inside pocket of his coat and did up the buttons.'
              else: 'On 12 March both talks were over, and those who had heard them had not yet gone their ways. {staff} sought out one by one the people who had sat in the front rows both evenings, talked to them house by house, and when one was persuaded asked him to leave an address. Mendel took out a small packet of dried peas and handed it to the first man who had left his address; the variety and the counts for next year were written on the paper. The man put the packet in the inside pocket of his coat and did up the buttons.'
          excerpts:
            p3: 'Mendel took out a small packet of dried peas and handed it to the first man who had left his address; the variety and the counts for next year were written on the paper. The man put the packet in the inside pocket of his coat and did up the buttons.'
            p2: 'After the meeting several people still stood before the table, checking their notebooks against it line by line with their pencils. One of them, counting, said it aloud: three to one.'
            p1: 'When he reached the dividing page he stopped, squared the rest of the manuscript and put it in his bag. When the meeting broke up, the date of the next talk was already in the minute book: 8 March.'
        relic: A pea pod
        relic_desc: A dried pod from the monastery garden.
        points:
          p1: 'Help Mendel fit eight years of counts into two talks and protect both readings to the Brno society'
          p2: 'Separate the counts by generation so listeners can check the numbers they heard'
          p3: 'While the listeners are still there, help Mendel arrange a replication at another site before the printed account comes out'
        points_fail:
          p1: 'The first meeting runs out of time and the second is never scheduled. The account is incomplete and the office recalls the employee after a loss of sync.'
          p2: 'Readers take home a total but cannot tell which counts came from the first generation and which came later.'
          p3: 'Readers outside Brno must wait for the proceedings and offprints, and no one who attended has agreed to repeat the counts.'
        shift:
          p1:
            was: 'On 8 February and 8 March 1865 Mendel reported his pea experiments in two talks to the Brno Natural History Society.'
          p2:
            was: 'The 1865 talks drew on years of pea counts. The paper published in 1866 separated the results by generation.'
            now: '{staff} has Mendel leave a comparison sheet after the talk so listeners can check their own notes against it.'
          p3:
            was: 'The Brno society printed the paper in 1866. Mendel used offprints to correspond with other scholars about checking his results.'
            now: '{staff} records the addresses of willing observers and agrees on which counts to send back. In the next growing season one observer sends figures to Brno that Mendel can compare with his own before the proceedings circulate.'
            who: mendel_brno
            bio: 'Mendel''s paper eventually appeared in the proceedings. A replication set in motion at the talks brought him earlier results he could check independently.'
        vignettes:
          straw: '{staff} helps the porter lay straw mats at the door of the meeting room. Snow melts off every pair of boots, and the porter says the gentlemen would sooner hear about peas than wipe their feet.'
          market: '{staff} helps an old woman at the Cabbage Market sort dried peas, the round ones in one heap and the wrinkled in another. The round ones sell better, she says; {staff} counts both heaps anyway and comes out at nearly three to one, and laughs first.'
          furrow: 'At the end of March {staff} walks the field paths outside the town. A farmer is spreading the winter''s dung and says the peas must go in early this year, ahead of the late frosts.'
      zh:
        name: 豌豆与遗传的规律
        place: 布尔诺
        figure: 格雷戈尔·孟德尔
        story: '1856 年到 1863 年，格雷戈尔·孟德尔在布尔诺住处的园子里杂交豌豆，一代代数它们的后代。1865 年 2 月 8 日和 3 月 8 日，他在布尔诺自然科学学会分两场报告了结果，论文 1866 年刊在学会的会刊上。他生前，这篇论文几乎没人接着做下去。孟德尔 1884 年去世，1900 年，三位植物学家在研究遗传时各自找到了他的论文。'
        story_prose:
          opening:
            - '1865 年冬，布尔诺。修士格雷戈尔·孟德尔从 1856 年起在修道院的园子里杂交豌豆，一代一代数它们的后代，按他自己的说法，前后八年。这个冬天，他要在布尔诺自然科学学会把这些数字讲出来。'
            - '史实里，他在 2 月 8 日和 3 月 8 日分两场作了报告，论文第二年刊在学会的会刊上。他生前，这篇论文几乎没人接着做下去；1884 年他在布尔诺去世，到 1900 年，才有三位植物学家各自找到它。在这条分支里，会场门口有个铺草垫的看门人，白菜市场有个卖干豌豆的老太太。'
            - '这一趟用得上几种人：心细、守得住两场报告的人；会教书、把数字一代一代拆开摆给人看的人；说得动人、散会前约得下人回去复种的人。'
          outcomes:
            all: '那年秋天，一封外地来信寄到修道院，信里是另一处园子里数出的豌豆。孟德尔把它和自己的数字并排摊在桌上，旁边压着那张分代的对照表。'
            p3: '那年秋天，一封外地来信寄到修道院，信里是另一处园子里数出的豌豆。孟德尔把两份数字并排摊在桌上，一行一行对下去。'
            p2: '那张分代的对照表，几个听过报告的人抄回了家。第二年会刊印出来，他们拿自己的抄本去对，一格一格对得上。'
            p1: '1866 年，两场报告合成《植物杂交实验》，刊在学会会刊第 4 卷上。修道院的园子里，那一年的豌豆照常下了种。'
          none: '1866 年，论文刊在学会的会刊上，没有几个人接着做下去。修道院的园子里，豌豆架子一到冬天就空着。'
          desync: '2 月 8 日那一晚，时间只够讲完做法，第二场没有排上。{staff}被召回时，孟德尔的稿子还有大半叠没翻开，压在会场的桌角上。'
          not_admitted: '{staff}没能进学会的会场，只在白菜市场帮老太太分了几天干豌豆。圆的一堆，皱的一堆，她从来不数。'
          points:
            p1:
              class_lettered: '2 月 8 日晚上，学会的会场点着灯，门口草垫上的雪水化了一片。孟德尔手里的稿子，是八年的数字。{staff}照整理档案的办法，前一天替他把稿子分成两叠，夹一张纸条，标明这一晚讲到哪里为止，后一叠写上下一场的日子。讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。'
              else: '2 月 8 日晚上，学会的会场点着灯，门口草垫上的雪水化了一片。孟德尔手里的稿子，是八年的数字。{staff}前一夜陪他把稿子念了一遍，看着钟点，在讲到一半的地方折了个角，后一半另放一叠。讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。'
            p2:
              class_teaching: '3 月 8 日，第二场。他讲杂种的后代怎样分开，数字一个接一个念出来，底下有人跟着抄，抄着抄着就分不清是哪一代了。{staff}照教书的规矩，在会场后头的黑板上画了一张表，第一代一栏，下一代一栏，他念一个数，就填进一格。散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。'
              else: '3 月 8 日，第二场。他讲杂种的后代怎样分开，数字一个接一个念出来，底下有人跟着抄，抄着抄着就分不清是哪一代了。{staff}事先把他的数字按代誊在一张大纸上，第一代一栏，下一代一栏，钉在会场后头的墙上。散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。'
            p3:
              class_lettered: '3 月 12 日，两场报告都讲完了，听过的人还没有各自散去。{staff}照登记的办法备了一本小册子，愿意回去复种的人留下姓名和地址，再写明来年要寄回哪几项计数。孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。'
              else: '3 月 12 日，两场报告都讲完了，听过的人还没有各自散去。{staff}挨个去找那两晚坐在前排的人，一家一家地说，说动了一位，就请他留下地址。孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。'
          excerpts:
            p3: '孟德尔取出一小包干豌豆，交到第一个留下地址的人手里，纸包上写着品种和来年要数的几项。那人把纸包揣进大衣内袋，扣好了扣子。'
            p2: '散会以后，几个人还站在那张表前，拿铅笔对着自己的本子一行行核。有人数着数着，念出了声：三比一。'
            p1: '讲到分界的那一页，他停下来，把剩下的稿子理齐，收进包里。散会时，记录本上写好了下一场的日子：3 月 8 日。'
        relic: 一只豌豆荚
        relic_desc: 修道院花园里的一只干豆荚。
        points:
          p1: '帮孟德尔把八年的计数拆成两场讲得完的报告，护住布尔诺学会的两次宣读'
          p2: '把容易在口头报告里混淆的两代计数分开列给听众核对'
          p3: '趁听众还在，替孟德尔约定一份异地复测，让刊印前就有人回报自己的计数'
        points_fail:
          p1: '首场念完时间只够交代做法，第二场没有排上。学会少了完整的两次报告，事务所因同步失败召回员工。'
          p2: '听众带走的是总数，回去后分不清哪些是第一代、哪些是下一代的观测。'
          p3: '报告传到外地要等学会年刊和抽印本，读者听完以后也没有约定谁来复测。'
        shift:
          p1:
            was: '1865 年 2 月 8 日和 3 月 8 日，孟德尔在布尔诺自然科学学会分两次报告豌豆杂交实验。'
          p2:
            was: '1865 年的两次报告以多年豌豆计数为据，1866 年刊印的论文逐项列出各代结果。'
            now: '{staff}请孟德尔在报告后留下分代对照表，听众可以拿自己抄的数字回来核对。'
          p3:
            was: '1866 年布尔诺学会刊印论文，孟德尔用抽印本同外地学者通信，讨论结果能否验证。'
            now: '{staff}请愿意复测的人留下地址并约好回报的内容。下一季有人把自己的数字寄回布尔诺，孟德尔可以在年刊流通前把两地结果对照。'
            who: mendel_brno
            bio: '孟德尔的报告后来随年刊刊行。跟随报告启动的异地复测让他较早收到一组可以独立核对的结果。'
        vignettes:
          straw: '{staff}帮看门人在会场门口铺草垫，草是从马厩里抱来的，还带着一股潮味。每双靴子上的雪都化在地上，看门人说，这些先生宁可听人讲豌豆，也懒得在门口跺跺脚。'
          market: '{staff}在白菜市场帮一个老太太分拣干豌豆，圆的一堆，皱的一堆，豆子落进筐里沙沙地响。她说圆的好卖。{staff}还是把两堆都数了一遍，差不多三比一，自己先笑了。'
          furrow: '三月底，{staff}在城外的田埂上走，地里的雪化得只剩沟底一线。农人正把攒了一冬的粪摊开，说今年豌豆得早点下种，赶在倒春寒前头。'
text:
  en:
    name: Gregor Mendel
    text: Czech Austrian friar and scientist, 1822 to 1884, of Brno. Crossing pea plants in the monastery garden he found that traits are inherited in fixed ratios, work published in 1866 and noticed only around 1900.
  zh:
    name: 格雷戈尔·孟德尔
    text: 捷克与奥地利的修士与科学家，1822 年生，1884 年去世，布尔诺人。他在修道院花园里杂交豌豆，发现性状按固定比例遗传，成果 1866 年发表，到 1900 年前后才受到注意。
