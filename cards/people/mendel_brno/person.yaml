    text:
      en:
        name: Peas and the rules of heredity
        place: Brno
        figure: Gregor Mendel
        story: 'Mendel''s paper, published in 1866 after his 1865 presentations, reports pea-cross counts and compares the resulting ratios.'
        relic: A pea pod
        relic_desc: A dried pod from the monastery garden.
        points:
          p1: 'Help Mendel fit eight years of counts into two talks and protect both readings to the Brno society'
          p2: 'Separate the counts by generation so listeners can check the numbers they heard'
          p3: 'While the listeners are still there, help Mendel arrange a replication at another site before the printed account comes out'
        points_fail:
          p1: 'The first meeting runs out of time and the second is never scheduled. The account is incomplete and the office recalls the employee after a loss of sync.'
          p2: 'Readers take home a total but cannot tell which counts came from the first generation and which came later.'
          p3: 'Readers outside Brno must wait for the proceedings and offprints, and no one who attended has agreed to repeat the counts.'
        shift:
          p1:
            was: 'On 8 February and 8 March 1865 Mendel reported his pea experiments in two talks to the Brno Natural History Society.'
          p2:
            was: 'The 1865 talks drew on years of pea counts. The paper published in 1866 separated the results by generation.'
            now: '{staff} has Mendel leave a comparison sheet after the talk so listeners can check their own notes against it.'
          p3:
            was: 'The Brno society printed the paper in 1866. Mendel used offprints to correspond with other scholars about checking his results.'
            now: '{staff} records the addresses of willing observers and agrees on which counts to send back. In the next growing season one observer sends figures to Brno that Mendel can compare with his own before the proceedings circulate.'
            who: mendel_brno
            bio: 'Mendel''s paper eventually appeared in the proceedings. A replication set in motion at the talks brought him earlier results he could check independently.'
        vignettes:
          ratio: 'The reader rounds the tally until it looks exact. You leave the counts in the margin and ask him to work the ratio back from those numbers.'
          label: 'Two paper labels look alike. You turn both over and find that one belongs to the parent plants. The reader moves it away from the counts for the offspring.'
          tally: 'You read the two shapes out loud as the reader makes tally marks. At the end you leave the tally beside its total for someone else to check.'
      zh:
        name: 豌豆与遗传的规律
        place: 布尔诺
        figure: 格雷戈尔·孟德尔
        story: '孟德尔在 1865 年报告豌豆杂交结果，1866 年刊出的论文列了计数并比较所得比例。'
        relic: 一只豌豆荚
        relic_desc: 修道院花园里的一只干豆荚。
        points:
          p1: '帮孟德尔把八年的计数拆成两场讲得完的报告，护住布尔诺学会的两次宣读'
          p2: '把容易在口头报告里混淆的两代计数分开列给听众核对'
          p3: '趁听众还在，替孟德尔约定一份异地复测，让刊印前就有人回报自己的计数'
        points_fail:
          p1: '首场念完时间只够交代做法，第二场没有排上。学会少了完整的两次报告，事务所因同步失败召回员工。'
          p2: '听众带走的是总数，回去后分不清哪些是第一代、哪些是下一代的观测。'
          p3: '报告传到外地要等学会年刊和抽印本，读者听完以后也没有约定谁来复测。'
        shift:
          p1:
            was: '1865 年 2 月 8 日和 3 月 8 日，孟德尔在布尔诺自然科学学会分两次报告豌豆杂交实验。'
          p2:
            was: '1865 年的两次报告以多年豌豆计数为据，1866 年刊印的论文逐项列出各代结果。'
            now: '{staff}请孟德尔在报告后留下分代对照表，听众可以拿自己抄的数字回来核对。'
          p3:
            was: '1866 年布尔诺学会刊印论文，孟德尔用抽印本同外地学者通信，讨论结果能否验证。'
            now: '{staff}请愿意复测的人留下地址并约好回报的内容。下一季有人把自己的数字寄回布尔诺，孟德尔可以在年刊流通前把两地结果对照。'
            who: mendel_brno
            bio: '孟德尔的报告后来随年刊刊行。跟随报告启动的异地复测让他较早收到一组可以独立核对的结果。'
        vignettes:
          ratio: '听讲人把数约成了一个整齐的比例。你把原始计数留在页边，请他从这些数重新算一遍。'
          label: '两张纸签看着很像。你翻过来才发现，其中一张写的是亲代。听讲人把它从后代的计数旁移开。'
          tally: '听讲人画正字时，你逐粒念出两种形状。数完，你把正字留在合计旁，让别人也能复核。'
text:
  en:
    name: Gregor Mendel
    text: Czech Austrian friar and scientist, 1822 to 1884, of Brno. Crossing pea plants in the monastery garden he found that traits are inherited in fixed ratios, work published in 1866 and noticed only around 1900.
  zh:
    name: 格雷戈尔·孟德尔
    text: 捷克与奥地利的修士与科学家，1822 年生，1884 年去世，布尔诺人。他在修道院花园里杂交豌豆，发现性状按固定比例遗传，成果 1866 年发表，到 1900 年前后才受到注意。
