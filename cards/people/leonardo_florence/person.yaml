    text:
      en:
        name: A painter who drew machines
        place: Florence
        figure: Leonardo da Vinci
        story: 'The Louvre dates the beginning of Leonardo''s portrait known as the Mona Lisa to around 1503 and records that he kept working on it later.'
        story_prose:
          opening:
            - 'Inside the Florence workshop the panels have been moved from the window to make room for a new rack. An agent comes to ask where Lisa’s portrait is. An apprentice stops him from putting a hand on a panel that is still wet.'
            - 'Agostino Vespucci’s dated note of October 1503 mentions Leonardo’s portrait of Lisa. The painting later remained with the artist. Here you can save it a place for work and storage, and arrange for Lisa to see as much as Leonardo is willing to show.'
            - 'Send someone who can judge the rack, the panel and the daylight. To arrange a viewing, bring the sitter, painter and agent together at an agreed hour.'
          points:
            p1: 'The apprentice wants to squeeze one more space from the old rack. You ask him to slide an empty panel in first and watch its corner touch the painting beside it. He clears a space by the window and asks Leonardo to mark the slot. Later, the person putting the work away touches the label for this panel before he reaches for the rack.'
            p2: 'The painter asks for a dry practice board to shield his paints. He turns the portrait to the door himself and shows Lisa where to stand. She asks if he will need her in the same pose next time. He looks at the back of the chair and tells the apprentice to mark where it stands. After Lisa leaves, Leonardo turns the panel back into his light.'
          outcomes:
            all: 'The workshop still has room for the picture. Lisa has seen how far it has come, and Leonardo still keeps the panel.'
            p1: 'The panel has daylight and a labelled storage slot. The agent can ask how it is going. A viewing still has no agreed day.'
            p2: 'Lisa has seen the work once. The panel is damaged later, and the trip brings home the scene in which she saw it.'
          none: 'There is still no room in the rack. By the door, a visitor learns only that the painter has not handed it over.'
          not_admitted: 'The apprentice asks you to make room for the people bringing in the rack. From outside the door you cannot see the front of the panel.'
          desync: 'The old rack squeezes and damages the wet panel. The historical portrait is no longer preserved and the office recalls the traveller.'
          excerpts:
            p1: 'Later, the person putting the work away touches the label for this panel before he reaches for the rack.'
            p2: 'After Lisa leaves, Leonardo turns the panel back into his light.'
        relic: A mirror-written notebook page
        relic_desc: A page of backwards script that needs a mirror to read.
        points:
          p1: 'Before the workshop takes on another civic painting, reserve a place for Lisa’s portrait where there is light to work and where the panel can be found in storage'
          p2: 'Arrange a viewing of work in progress while the portrait is still in Florence and let Leonardo choose what to show the sitter'
        points_fail:
          p1: 'New work arrives and the unfinished panel is squeezed into the old rack. The portrait is damaged and the office recalls the employee.'
          p2: 'No time is set aside for a viewing. The people waiting for the picture can only ask the workshop how far it has come.'
        shift:
          p1:
            was: 'Agostino Vespucci’s margin note from October 1503 records Leonardo painting Lisa del Giocondo.'
          p2:
            was: 'The portrait underwent extended revision, then left Italy with Leonardo and entered the French collection.'
            now: 'Lisa sees the portrait at this stage. Leonardo can continue to take the panel with him, while the workshop keeps a sketch of the version shown to her.'
            who: leonardo_florence
            bio: 'A contemporary Florentine note places the portrait of Lisa in Leonardo’s workshop. The painting continued to change and traveled far from that first setting.'
        vignettes:
          shadow: 'You ask the apprentice to show where the face ends and the background begins. They point, then hesitate. Instead of drawing a heavier line, they leave the transition for a second look.'
          hands: 'The visitor remembers the face but puts the hands in a different place. You set the practice drawing beside their memory sketch and let them find the changed lines.'
          seat: 'You mark the sitter''s chair on the floor while the apprentice packs up. They leave the drawing unfinished, knowing where the chair will go when they return.'
      zh:
        name: 画画的人，也画机器
        place: 佛罗伦萨
        figure: 列奥纳多·达·芬奇
        story: '卢浮宫把列奥纳多开始画《蒙娜丽莎》的时间定在约 1503 年，并记载他后来仍在继续修改。'
        story_prose:
          opening:
            - '佛罗伦萨的工房里，平日靠窗的板子已经挪开，那里要摆进新工作用的架子。经办人来问丽莎的画像放在哪。学徒抱着空架，叫他别去扶还没有干的板。'
            - '1503 年 10 月，韦斯普奇的批注提到达·芬奇画丽莎。画像后来留在画家手中。这里可以让画板有一处安全又能干活的地儿，还可以约一天，让丽莎来看画家愿意给她看的阶段稿。'
            - '能察看架子、板材和日照的员工先替工房安排位置。善于召集人的员工再联系丽莎与经办人，把看稿时间定下来。'
          points:
            p1: '学徒想在旧架里再挤一个空。你请他先把一块空板向里推，见到板角贴住了旁边一幅画。你跟他把窗下最窄的架格单留出来，再请画家写一个装卸时认得出的记号。晚些时候有人收画，伸手先摸到了留给这块板的签条。'
            p2: '画家叫学徒把另一张干透的练习拿来挡住手边的颜料。他自己把愿给丽莎看的画像转向门里。丽莎站在他选的位置，问下回是否还要照那样坐。他对照椅背想了片刻，请学徒把凳子的位置记下。丽莎走后，画家把画板转回自己的光里。'
          outcomes:
            all: '工房里还有一个能继续画的位子。丽莎知道这块板已经画到了哪里，画家仍自己保管它。'
            p1: '画像的暂存格有了签条和光。经办人能问到进度，室内还没有约好看稿的日子。'
            p2: '丽莎已看过一回。画板后来受损，这段相约看画的记录随员工带回。'
          none: '架子还没腾出。来询问的人在门边等过一阵，只问到画还没交。'
          not_admitted: '学徒请来客让开扛架的人。画板在里面，门边看不到正面。'
          desync: '未干的画板送进旧架时被邻板挤坏。原有画像无法保住，事务所召回员工。'
          excerpts:
            p1: '晚些时候有人收画，伸手先摸到了留给这块板的签条。'
            p2: '丽莎走后，画家把画板转回自己的光里。'
        relic: 一页镜像书写的笔记
        relic_desc: 一页反着写的字，要对着镜子才读得出。
        points:
          p1: '在工房接下别的市政绘画工作以前，给丽莎的画像留一个白天可用、暂存时可认出的位子'
          p2: '替画家与经办人议定分段查看的机会，趁画像还在佛罗伦萨，让坐画的人看到一份由画家同意展示的阶段稿'
        points_fail:
          p1: '新工作一到，未干的画板被夹进旧架，画像在这次交接中受损，事务所召回员工。'
          p2: '没约定何时可看，画像继续留在画家手中。委托一方只能听工房传来说到了哪一步。'
        shift:
          p1:
            was: '韦斯普奇 1503 年十月的书上批注说，达·芬奇正在画丽莎·德尔·焦孔多。'
          p2:
            was: '这幅肖像历经长时间修改，最终随画家离开意大利并进入法国收藏。'
            now: '丽莎来时，画家给她看这一阶段已成形的肖像。以后画板仍可随画家带走，工房另留一份双方见过的稿样。'
            who: leonardo_florence
            bio: '佛罗伦萨的同时代批注证实画家在做丽莎的肖像。后来画作继续发展，流传远离最初的工房。'
        vignettes:
          shadow: '你请学徒指一指，脸从哪儿结束，背景从哪儿开始。他伸手又犹豫了，没有加重那道线，先把交界处留着再看。'
          hands: '访客记得脸，却把手的位置画变了。你把习作和他凭记忆画的图并排，让他自己找出线条挪到了哪里。'
          seat: '学徒收拾东西时，你在地上替模特的椅子做了个记号。他把画留在半成处，下次来仍知道椅子该放哪儿。'
text:
  en:
    name: Leonardo da Vinci
    text: Italian painter and engineer, 1452 to 1519. He painted the Last Supper and the Mona Lisa, which he began in Florence around 1503, and filled thousands of notebook pages with studies of anatomy, water and machines.
  zh:
    name: 列奥纳多·达·芬奇
    text: 意大利画家与工程师，1452 年生，1519 年去世。他画了《最后的晚餐》和约 1503 年在佛罗伦萨开始的《蒙娜丽莎》，并用数千页笔记研究解剖、水流和机械。
