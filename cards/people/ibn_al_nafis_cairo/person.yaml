quotes:
  ibn_al_nafis_cairo_echo_full:
    order: 1
    tier: full
    date: '1288'
    checked: official_record
    sources: [ibn_al_nafis_cairo_echo_source_full]
    original: ar
    text:
      en:
        who: 'Ibn al-Nafis'
        quote: 'The reason this passes, while that blood cannot.'
        occasion: 'Commentary on the Anatomy of the Canon, part of an argument that asks what could explain two different observations. The date of the passage is uncertain.'
      zh:
        who: '伊本·纳菲斯'
        quote: '为何这一种能通过，而那样的血却不能。'
        occasion: '《〈医典〉解剖学评注》一节，追问两种现象为什么不同。具体写作日期不详。'
      ar:
        who: 'Ibn al-Nafis'
        quote: 'السبب في نفوذ هذه وتعذر ذلك الدم'
        occasion: 'Commentary on the Anatomy of the Canon, part of an argument that asks what could explain two different observations. The date of the passage is uncertain.'
      zh-Hant:
        who: '伊本·納菲斯'
        quote: '為何這一種能通過，而那樣的血卻不能。'
        occasion: '《〈醫典〉解剖學評注》一節，追問兩種現象為什麼不同。具體寫作日期不詳。'
      fr:
        who: 'Ibn al-Nafis'
        quote: 'La raison pour laquelle cela passe, alors que ce sang ne le peut pas.'
        occasion: 'Commentaire sur l''Anatomie du Canon, partie d''un argument qui demande ce qui pourrait expliquer deux observations différentes. La date du passage est incertaine.'
      es:
        who: 'Ibn al-Nafis'
        quote: 'La razón por la que esto pasa, mientras que esa sangre no.'
        occasion: 'Comentario a la Anatomía del Canon, parte de un argumento que pregunta qué podría explicar dos observaciones diferentes. La fecha del paso es incierta.'
      ja:
        who: 'イブン・アン＝ナフィース'
        quote: 'この血は通過するのに、この血は通過できない理由。'
        occasion: '『正典の解剖学』に関する解説。2 つの異なる観察を何が説明できるかを問う議論の一部。通過の日付は不明です。'
      ko:
        who: '이븐 알나피스'
        quote: '이것은 통과하지만 그 피는 통과하지 못하는 이유입니다.'
        occasion: '두 가지 다른 관찰을 설명할 수 있는 것이 무엇인지 묻는 논증의 일부인 정경의 해부학에 대한 해설. 통과 날짜는 불확실합니다.'
      ru:
        who: 'Ибн ан-Нафис'
        quote: 'Причина, по которой это проходит, а эта кровь – нет.'
        occasion: 'Комментарий к «Анатомии Канона», часть аргумента, в котором задается вопрос, что может объяснить два разных наблюдения. Дата перехода неизвестна.'
  ibn_al_nafis_cairo_echo_none:
    order: 2
    tier: none
    date: '1288'
    checked: official_record
    sources: [ibn_al_nafis_cairo_echo_source_none]
    original: ar
    text:
      en:
        who: 'Ibn al-Nafis'
        quote: 'The severity of the harm in that is plain.'
        occasion: 'Commentary on the Anatomy of the Canon, weighing what would follow if an explanation were true. The date of the passage is uncertain.'
      zh:
        who: '伊本·纳菲斯'
        quote: '那样的危害，显而易见。'
        occasion: '《〈医典〉解剖学评注》一节，讨论某种解释成立时会带来什么后果。具体写作日期不详。'
      ar:
        who: 'Ibn al-Nafis'
        quote: 'وفي ذلك من شدة الضرر ما لا يخفى'
        occasion: 'Commentary on the Anatomy of the Canon, weighing what would follow if an explanation were true. The date of the passage is uncertain.'
      zh-Hant:
        who: '伊本·納菲斯'
        quote: '那樣的危害，顯而易見。'
        occasion: '《〈醫典〉解剖學評注》一節，討論某種解釋成立時會帶來什麼後果。具體寫作日期不詳。'
      fr:
        who: 'Ibn al-Nafis'
        quote: 'La gravité du préjudice est manifeste.'
        occasion: 'Commentaire sur l''Anatomie du Canon, pesant ce qui suivrait si une explication était vraie. La date du passage est incertaine.'
      es:
        who: 'Ibn al-Nafis'
        quote: 'La gravedad del daño que esto supone es evidente.'
        occasion: 'Comentario sobre la Anatomía del Canon, sopesando lo que seguiría si una explicación fuera cierta. La fecha del paso es incierta.'
      ja:
        who: 'イブン・アン＝ナフィース'
        quote: 'その被害の深刻さは明らかです。'
        occasion: '正典の解剖学に関する解説。説明が真実である場合に何が起こるかを比較検討します。通過の日付は不明です。'
      ko:
        who: '이븐 알나피스'
        quote: '그 피해의 심각성은 분명합니다.'
        occasion: '설명이 사실이라면 어떤 결과가 나올지 무게를 두고 정경의 해부학에 대한 해설입니다. 통과 날짜는 불확실합니다.'
      ru:
        who: 'Ибн ан-Нафис'
        quote: 'Серьезность причиненного этим ущерба очевидна.'
        occasion: 'Комментарий к анатомии Канона, взвешивающий, что последовало бы, если бы объяснение было верным. Дата перехода неизвестна.'
