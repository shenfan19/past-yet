    text:
      en:
        name: 'The route in the margin'
        place: "Cairo"
        figure: "Ibn al-Nafis"
        story: 'In his thirteenth-century anatomical commentary on Ibn Sina’s Canon, Ibn al-Nafis says blood passes from the right side of the heart to the left through the lungs and rejects a direct passage through the partition. The Cairo scene is an imagined comparison of text and practice diagrams, with 1242 used as a conventional setting.'
        relic: 'Two practice diagrams'
        relic_desc: 'An imagined pair kept for comparing two descriptions.'
        points:
          p1: 'Compare the diagram with the passage the student is reading'
          p2: 'Keep the earlier outline available while the new one is traced'
          p3: 'Help the next reader tell the two drawn routes apart'
        vignettes:
          trace: 'Hassan’s hand goes straight across the middle of the copy. Salma taps the line she has just read. You ask him to trace the route again while she follows the text. He redraws it via the lungs and marks the earlier line as a separate reading.'
          layer: 'Salma is ready to rub out the older outline so that only one explanation remains. You slide a clean leaf underneath and let Hassan trace the second route there. A new reader can now lay the two together and ask what has changed.'
          name: 'You know the later label for this part of the journey of the blood. Hassan wants to know where the commentator’s objection appears. You bracket that line instead of giving him a new title for his picture. The copy leaves the room before you hear whether his teacher accepts it.'
      zh:
        name: '画在页边的路径'
        place: "开罗"
        figure: "伊本·纳菲斯"
        story: '伊本·纳菲斯在十三世纪为伊本·西那《医典》作的解剖注释中，认为血由心脏右侧经肺到左侧，反对它直接穿过中隔的说法。游戏采用约略的1242年，在开罗虚构一次正文与习作图的对读。'
        relic: '两张解剖注释练习图'
        relic_desc: '虚构练习图，两张一并留下对照说法。'
        points:
          p1: '用学生正在读的一段核对图'
          p2: '另描新图时，把旧轮廓留在手边'
          p3: '帮接手的人认出两条画出的路径'
        vignettes:
          trace: '哈桑一笔穿过练习图正中。萨尔玛点了点自己刚读的一行。你请他照她读的内容再划一遍。他重画路线，让它经过肺，并标清早先一笔对应另一种说法。'
          layer: '萨尔玛准备擦掉旧轮廓，桌上只留下一个讲法。你在底下垫一张干净的纸，让哈桑把第二条路线描在那里。新读者可以把两张叠看，自己问哪里变了。'
          name: '你知道后世怎样称呼血液走的这一程。哈桑问的是注释到底在哪儿提出异议。你框住那句，让他照原文查。图已经带出屋子，老师是否认可，你走前还听不到。'
text:
  en:
    name: Ibn al-Nafis
    text: Thirteenth-century physician who studied in Damascus and worked in Cairo. His anatomical commentary on Ibn Sina’s Canon argues that blood travels from the right side of the heart through the lungs to the left.
  zh:
    name: 伊本·纳菲斯
    text: 十三世纪的医生，在大马士革求学，后来在开罗行医。他为伊本·西那《医典》所作的解剖注释认为，血液从心脏右侧经肺到达左侧。
hook: {en: 'Which arrow came from the commentary?', zh: '哪一笔箭头出自注释？'}
