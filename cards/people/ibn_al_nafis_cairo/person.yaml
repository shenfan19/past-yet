    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"trust","day":8,"req":{"any":[{"job":["archivist","restorer","bookseller"],"stat":{"wit":6,"will":5}},{"trait":["scholarly","methodical","patient"],"stat":{"wit":7,"will":5}}]}}
    text:
      en:
        name: 'One volume in another reader’s hands'
        place: 'Cairo'
        figure: 'Ibn al-Nafis'
        story: 'Ibn al-Nafis left his library to a hospital late in his life. His projected medical encyclopedia was unfinished and surviving parts are dispersed. In this branch a second reader offers to take responsibility for one of the completed volumes.'
        story_prose:
          opening:
            - 'Cairo, 1288. Late in his life Ibn al-Nafis left his library to a hospital. His large planned medical encyclopedia remained unfinished, and only parts can still be read today.'
            - 'In history, the biographies record where he left his library without tracing every volume afterwards. In this branch a reader who often comes by wants to finish the volume he has been reading.'
            - 'Someone who understands how a book is lent and returned can help. The agreement has to give later readers an address they can actually find.'
          points:
            p1: 'The reader originally wanted the loan only until the end of the month. {staff} asks the two to agree first where the volume will be kept and who will open the door for another reader. Ibn al-Nafis turns the cover over and points out what he has yet to check. The reader lays the slip on the book, one thumb half covering the name he has just signed. He moves it only when the ink has dried.'
          outcomes:
            all: 'Someone later comes looking for the volume at the address on the slip. The person at the door takes the book down and hands over the paper at the first leaf with it.'
            p1: 'Someone later comes looking for the volume at the address on the slip. The person at the door takes the book down and hands over the paper at the first leaf with it.'
          none: 'Nobody leaves an address at which the volume can stay available. The slip lies blank. The book is still in the same pile.'
          not_admitted: '{staff} never gets inside. The person by the window turns a page without hearing the steps outside.'
          excerpts:
            p1: 'The reader lays the slip on the book, one thumb half covering the name he has just signed. He moves it only when the ink has dried.'
        relic: 'A named loan slip'
        relic_desc: 'An imagined slip giving the name of the reader who accepted responsibility.'
        points:
          p1: 'Ask Ibn al-Nafis to entrust one completed volume to a second reader who agrees to keep it accessible'
        points_fail:
          p1: 'The employee did not find a second reader willing to take responsibility for the volume.'
        shift:
          p1:
            was: '1288: Ibn al-Nafis died and left his library to a hospital. Only portions of his large medical encyclopedia survive today.'
            now: '{staff} arranges a custodian for one completed volume and has the recipient record where it can be consulted. The rest of the library follows his original plans.'
            who: ibn_al_nafis_cairo
            bio: 'One volume of his unfinished encyclopedia remained accessible in the branch through a second custodian.'
      zh:
        name: '单独托给一位读者'
        place: '开罗'
        figure: '伊本·纳菲斯'
        story: '伊本·纳菲斯临终把藏书留给医院。他计划撰写的医学大全没有完成，现存卷册分散。在这条分支里，还有一位读者愿意接下一卷自己能够保管的成稿。'
        story_prose:
          opening:
            - '1288 年，开罗。伊本·纳菲斯临终把藏书留给了医院。他那部计划写得很长的医学大全没有写完，今天尚见的只是一部分。'
            - '史实里，传记记下了他的藏书处置，没逐一说清每卷后来到了哪里。在这条分支里，有位常来翻书的读者，想把自己正在读的一卷借完。'
            - '这趟用得上懂书怎么归还、怎么借出去的人。约定得留下后来人也找得到的地址。'
          points:
            p1: '读者本来只想借到月底。{staff}请两人先说定，这一卷最后放在哪里、旁人来读时找谁开门。伊本·纳菲斯翻过封面，给他指出尚未校过的地方。读者把借据摊在书上，用拇指把自己刚签的名字盖住了一半。等纸上的墨干透，他才把手移开。'
          outcomes:
            all: '后来有人按借据的地址来找这卷书。开门的人取下卷册，把夹在第一叶里的纸一同递过去。'
            p1: '后来有人按借据的地址来找这卷书。开门的人取下卷册，把夹在第一叶里的纸一同递过去。'
          none: '没有人肯留下可以长期借阅的地址。借据还摊着，书仍在原来那摞里。'
          not_admitted: '{staff}没能进屋。窗边的人转过一页，没听见门外的脚步。'
          excerpts:
            p1: '读者把借据摊在书上，用拇指把自己刚签的名字盖住了一半。等纸上的墨干透，他才把手移开。'
        relic: '一张署名的借据'
        relic_desc: '分支里的借据，记着谁答应照看这一卷。'
        points:
          p1: '请伊本·纳菲斯把一卷成稿托给另一位读者，并确认后来的人还能借阅'
        points_fail:
          p1: '员工没能找到愿意对这一卷负责的读者。'
        shift:
          p1:
            was: '1288 年，伊本·纳菲斯去世，将藏书留给医院。他的医学大全今天只存部分卷册。'
            now: '{staff}请到另一位保管人，在交接时写明日后在哪里可以查阅。其余藏书照他的原意托付。'
            who: ibn_al_nafis_cairo
            bio: '他的医学大全有一卷在分支里交由第二位保管人，后来仍可借阅。'
text:
  en:
    name: Ibn al-Nafis
    text: Thirteenth-century physician who studied in Damascus and worked in Cairo. His anatomical commentary on Ibn Sina’s Canon argues that blood travels from the right side of the heart through the lungs to the left.
  zh:
    name: 伊本·纳菲斯
    text: 十三世纪的医生，在大马士革求学，后来在开罗行医。他为伊本·西那《医典》所作的解剖注释认为，血液从心脏右侧经肺到达左侧。
