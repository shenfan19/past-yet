quotes:
  heo_nanseolheon_hanyang_story_echo_full:
    order: 1
    tier: full
    date: '1608'
    checked: official_record
    sources: [heo_nanseolheon_hanyang_story_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Heo Nanseolheon'
        quote: 'I dreamed I entered the lotus city, riding high on a red dragon.'
        occasion: 'From ‘Poem on Seeking the Immortals,’ preserved in her posthumous collection. The date labels an edition, and the poem is undated.'
      zh:
        who: '许兰雪轩'
        quote: '梦中进入芙蓉城，高高骑着一条赤龙。'
        occasion: '《望仙谣》诗句，见身后所辑诗集。所标为刊本年份，作诗年份未详。'
      zh-Hant:
        who: '许兰雪轩'
        quote: '夢入芙蓉城，翹翹乘赤龍。'
        occasion: '《望仙谣》诗句，见身后所辑诗集。所标为刊本年份，作诗年份未详。'
      fr:
        who: 'Heo Nanseolheon'
        quote: 'J''ai rêvé que j''entrais dans la ville du lotus, chevauchant un dragon rouge.'
        occasion: 'Extrait de « Poème sur la recherche des immortels », conservé dans sa collection posthume. La date indique une édition et le poème n''est pas daté.'
      es:
        who: 'Heo Nanseolheon'
        quote: 'Soñé que entraba en la ciudad del loto, montado en lo alto de un dragón rojo.'
        occasion: 'De ''Poema sobre la búsqueda de los inmortales'', conservado en su colección póstuma. La fecha etiqueta una edición y el poema no tiene fecha.'
      ja:
        who: '許蘭雪軒'
        quote: '赤い竜に乗って蓮の都に入る夢を見た。'
        occasion: '彼女の死後のコレクションに保存されている「不滅を求める詩」より。日付は版を示しており、詩には日付がありません。'
      ko:
        who: '허난설헌'
        quote: '나는 붉은 용을 타고 높이 연꽃 도시에 들어가는 꿈을 꾸었습니다.'
        occasion: '그녀의 유작집에 보존되어 있는 ''불멸자를 구하는 시'' 중에서. 날짜는 판본을 표시하며 시에는 날짜가 없습니다.'
      ru:
        who: 'Хо Нансорхон'
        quote: 'Мне снилось, что я въехал в город лотосов верхом на красном драконе.'
        occasion: 'Из «Поэмы о поисках бессмертных», сохранившейся в ее посмертном сборнике. Дата указывает издание, а стихотворение не датировано.'
  heo_nanseolheon_hanyang_story_echo_none:
    order: 2
    tier: none
    date: '1608'
    checked: official_record
    sources: [heo_nanseolheon_hanyang_story_echo_source_none]
    original: zh-Hant
    text:
      en:
        who: 'Heo Nanseolheon'
        quote: 'Last year I lost my beloved daughter. This year I lost my beloved son.'
        occasion: 'Opening of ‘Mourning My Children,’ preserved in the posthumous collection. The date labels an edition.'
      zh:
        who: '许兰雪轩'
        quote: '去年失去爱女，今年失去爱子。'
        occasion: '《哭子》开头，见身后所辑诗集。所标为刊本年份。'
      zh-Hant:
        who: '许兰雪轩'
        quote: '去年喪愛女，今年喪愛子。'
        occasion: '《哭子》开头，见身后所辑诗集。所标为刊本年份。'
      fr:
        who: 'Heo Nanseolheon'
        quote: 'L''année dernière, j''ai perdu ma fille bien-aimée. Cette année, j''ai perdu mon fils bien-aimé.'
        occasion: "Ouverture de «\_Mourning My Children\_», conservé dans la collection posthume. La date marque une édition."
      es:
        who: 'Heo Nanseolheon'
        quote: 'El año pasado perdí a mi amada hija. Este año perdí a mi amado hijo.'
        occasion: 'Inauguración de ''Duelo a mis hijos'', conservada en la colección póstuma. La fecha etiqueta una edición.'
      ja:
        who: '許蘭雪軒'
        quote: '昨年、私は最愛の娘を亡くしました。今年、私は最愛の息子を亡くしました。'
        occasion: '死後のコレクションに保存されている「Mourning My Children」の冒頭。日付によってエディションがラベル付けされます。'
      ko:
        who: '허난설헌'
        quote: '작년에 나는 사랑하는 딸을 잃었습니다. 올해 나는 사랑하는 아들을 잃었습니다.'
        occasion: '사후 소장품으로 보존되어 있는 ''애도하는 나의 아이들''의 개봉. 날짜는 에디션을 표시합니다.'
      ru:
        who: 'Хо Нансорхон'
        quote: 'В прошлом году я потеряла любимую дочь. В этом году я потеряла любимого сына.'
        occasion: 'Открытие книги «Скорбь по детям моим», сохранившейся в посмертном сборнике. Дата обозначает издание.'
