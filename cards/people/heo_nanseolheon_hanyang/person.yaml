    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [heo_nanseolheon_hanyang_edition, heo_nanseolheon_hanyang_collection]
    text:
      en: 'A study of Heo Gyun’s selection compares the 1597 selection and the extant 1608 Joseon woodblock edition.'
      zh: '选本研究比较了许筠 1597 年所编选本与现存的 1608 年朝鲜刻本。'
  collection:
    date: '1692'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [heo_nanseolheon_hanyang_edition, heo_nanseolheon_hanyang_collection]
    text:
      en: 'The catalogue describes Heo Gyun''s posthumous compilation and lists the verse and prose in a later edition.'
      zh: '条目载有许筠在姐姐去世后整理文稿一事，并列出较晚刊本里的诗文。'
