text:
  en:
    name: Heo Nanseolheon
    text: Korean poet of the Joseon, 1563 to 1589. She wrote about three hundred poems in classical Chinese, and died at twenty six. Her brother gathered her poems and had them published after her death.
  zh:
    name: 许兰雪轩
    text: 朝鲜时代的诗人，1563 年生，1589 年去世。她用汉文写了约三百首诗，二十六岁去世。她的弟弟在她死后收集诗稿并刊行。
