    text:
      en:
        name: 'A sleeve of separate poems'
        place: "Hanyang"
        figure: "Heo Nanseolheon"
        story: 'Heo Gyun compiled surviving work by his sister Heo Nanseolheon after her death. A Joseon woodblock edition of her collected works survives from 1608.'
        story_prose:
          opening:
            - 'The copyist weighs a fresh paper sleeve down with a stone and hands you two sheets with the same opening. One was for practice and someone has asked to borrow the other. He remembers taking both from beside the window.'
            - 'In history Heo Nanseolheon’s brother Heo Gyun gathered the surviving work after her death. The 1597 selection and surviving 1608 edition differ in places. Here you can keep the copies where he will find them and ask the poet which poems she wishes to share.'
            - 'Send someone who can compare hands and headings to sort the drafts. A traveller who can explain who wants to read them can then put the question to the poet herself.'
          points:
            p1: 'The copyist points to the stronger ink. You lay both versions side by side and show him a correction at the end of the paler copy. He makes a note on the sleeve so the two can be found again. Two sheets go under one heading, and the fold stops well short of the writing.'
            p2: 'Heo moves the copyist’s first choice back to her side of the table. She picks another to fill its place. When you ask whose name belongs on the packet, she takes the brush and signs the first sheet herself, then hands back the pages in order. She asks the copyist to copy the signature too.'
          outcomes:
            all: 'When Heo Gyun assembles the collection, he keeps the small packet in the order his sister left it. The name copied at her request stays on its first sheet.'
            p1: 'Both versions can be found. Heo Gyun can compare them when he compiles the collection. He has no record of his sister’s own choice.'
            p2: 'She has signed a few poems herself. The other papers have gone astray; what comes home is a record of her choice on this visit.'
          none: 'The loose copies remain mixed on the table. The later collection still depends on what the family can find.'
          not_admitted: 'The copyist asks for a heading from the other side of the door. When no one can name one, he keeps the sleeve on the table.'
          desync: 'On your return the copyist recognises only the empty sleeve. The papers required for the later collection have gone astray, and the office recalls the traveller.'
          excerpts:
            p1: 'Two sheets go under one heading, and the fold stops well short of the writing.'
            p2: 'She asks the copyist to copy the signature too.'
        relic: "A sheet of poems"
        relic_desc: "A sheet of fine paper with brushed poems on flowers and distant places."
        points:
          p1: 'Keep the family’s copies together so Heo Gyun will have the poems he later included in his selection'
          p2: 'Help Heo set aside and sign a small group of poems she wants other people to read'
        points_fail:
          p1: 'The family loses track of the separate papers and Heo Gyun cannot compile the collection from them. The branch falls out of sync and the office recalls the employee.'
          p2: 'After she dies, the family can only choose for her from the copies that remain.'
        shift:
          p1:
            was: 'After Heo Nanseolheon died in 1589, Heo Gyun used poems kept at her family home to compile her work.'
          p2:
            was: 'After her death in 1589, her brother selected her poems. The 1597 selection and the 1608 edition preserve different readings.'
            now: 'Heo marks the pages she wants to share. The family keeps her signed selection together when they later prepare the collection.'
            who: heo_nanseolheon_hanyang
            bio: 'Heo Nanseolheon selected a small group of poems she was willing to share. Her family kept her chosen order when preparing her surviving work.'
        vignettes:
          binding: 'The copyist has mixed a practice page in with the other sheets. You compare the two headings and fold a second sleeve for the exercises. One ambiguous page stays loose for him to check. You leave before any of the poems reaches a printed book.'
          name: 'You know some of these poems will be read far from this house. The copyist is about to pass on a practice sheet with no heading. You ask him to copy the heading as well, and one more sheet leaves with a name. You keep your place with a blank strip of paper. The woodblock edition lies years ahead.'
          fold: 'You help wrap the loose pages without creasing the brushwork. On the spare wrapper you mark that a title is missing. What you take away is the warning, not the page. The later collection will be put together after you are gone.'
      zh:
        name: '装着散诗的纸套'
        place: "汉阳"
        figure: "许兰雪轩"
        story: '许兰雪轩去世后，弟弟许筠整理了她留存的作品，现存刊本中有 1608 年的朝鲜木刻本。'
        story_prose:
          opening:
            - '抄写人把新裁的纸套压在镇纸底下，递来两张首句一样的散页。一张是练笔，一张有人来借读。他只记得两张纸都从窗边拿来。'
            - '史实里，许兰雪轩去世后，弟弟许筠整理留存的诗文。1597 年选本与现存的 1608 年刊本有异文。这一趟先保住能找到的底稿，还可以请她亲自挑出愿意传阅的几篇。'
            - '能对读笔迹和题头的员工先理出同篇异稿。能把借阅的来意讲明白的人，再去问她哪几首可以送到门外。'
          points:
            p1: '抄写人指着墨色最深的那张说要留它。你让他把两张诗页并在一起，看到浅墨页的尾句另有一笔修改。他照你指出的位置在纸套上写了存放处，才把两稿都收进去。两张纸从此用一个题头，套口留了足够宽的边。'
            p2: '许兰雪轩把抄写人挑的第一首移到自己手边，另选一首填进空处。你问这一叠该写借谁的名字，她把笔接过来，在最上面的纸边写下自己的名字，再把纸叠照原来的次序递还。她让抄写人把署名也誊一遍。'
          outcomes:
            all: '后来许筠编集时，那一小叠仍按姐姐递出时的次序放在一起。抄写人誊下的名字留在头一页。'
            p1: '同篇异稿都找得到。许筠编集时可以自己对读，诗人在世时会怎样取舍，仍无从得知。'
            p2: '她为几首诗亲自写下署名。存稿的来路出了岔子，署名留下的选择只能随本趟短记带回。'
          none: '抄书桌上仍只有混在一起的纸。后来家人只能从余下的稿子挑选；本趟记录没有带回来一份作者选目。'
          not_admitted: '抄写人隔门问来客要借哪一首。没人能说出题头，他把纸套留在桌上。'
          desync: '再去问存稿放在哪里时，抄写人只认得已经空了的纸套。编集所需的底稿失去下落，事务所召回员工。'
          excerpts:
            p1: '两张纸从此用一个题头，套口留了足够宽的边。'
            p2: '她让抄写人把署名也誊一遍。'
        relic: "一页诗稿"
        relic_desc: "一页细纸，用毛笔写着写花和远方的诗。"
        points:
          p1: '替家里把已经传抄的诗篇放在一处，给许筠日后编集留下能找到的底稿'
          p2: '请许兰雪轩从中挑出想让人读的几篇，在那一小叠诗稿上署名'
        points_fail:
          p1: '分存的诗稿下落也断了，许筠后来无法循原稿编集。行程与史实脱节，员工被召回。'
          p2: '去世之后，只能由家人从留存稿中替她选篇。'
        shift:
          p1:
            was: '1589 年许兰雪轩去世后，许筠后来以娘家留存的稿件整理她的作品。'
          p2:
            was: '1589 年许兰雪轩去世后，弟弟许筠编选了她的诗。1597 年选本和 1608 年刊本的诗句有不同版本。'
            now: '许兰雪轩在愿意传阅的几首诗上署名。后来家人编集时，仍把她亲自选出的这些篇目放在一起。'
            who: heo_nanseolheon_hanyang
            bio: '许兰雪轩生前定下了一小组愿意传阅的诗。亲人整理她的遗稿时保留了这个次序。'
        vignettes:
          binding: '抄写人把练笔的纸夹在其他页里。你对过两个题头，另折了一个纸套装练抄稿。还有一页看不准，留散着让他再查。哪首诗最后印进了书，你在这趟看不到。'
          name: '你知道有些诗以后会传到离这户人家很远的地方。抄写人要递出去一张没题头的练抄稿，你请他把题头一同誊下。送出门的纸多了一张带署名的。你用空白纸条夹住自己读到的位置，木刻本还要等许多年。'
          fold: '你把散页套起来，没让折痕压到字，再在多出的纸套上标记有一页还缺题目。带走的是这条提醒，诗页留在屋里。你离开以后，那部诗集才会编成。'
text:
  en:
    name: Heo Nanseolheon
    text: Korean poet of Joseon, 1563 to 1589. She wrote in classical Chinese. Her brother Heo Gyun collected her work after her death.
  zh:
    name: 许兰雪轩
    text: 朝鲜时代的诗人，1563 年生，1589 年去世，以汉文写诗。弟弟许筠在她去世后收集她的作品。
hook: {en: 'Which name belongs at the head of the copy?', zh: '这页的署名写在哪里？'}
