quotes:
  li_bai_changan_echo_full:
    order: 1
    tier: full
    date: '759'
    checked: official_record
    sources: [li_bai_changan_echo_source_full]
    original: zh-Hant
    text:
      en: {"who":"Li Bai","quote":"At dawn I leave White Emperor City amid bright clouds. A thousand li to Jiangling, and I am back in a day.","occasion":"Early Departure from White Emperor City. The poem’s dating is disputed."}
      zh: {"who":"李白","quote":"清早辞别彩云间的白帝城，一天就回到千里之外的江陵。","occasion":"《早发白帝城》。诗的具体写作年代有不同说法。"}
      zh-Hant: {"who":"李白","quote":"朝辭白帝彩雲間，千里江陵一日還。","occasion":"《早发白帝城》。诗的具体写作年代有不同说法。"}
  li_bai_changan_echo_none:
    order: 2
    tier: none
    date: '758'
    checked: official_record
    sources: [li_bai_changan_echo_source_none]
    original: zh-Hant
    text:
      en: {"who":"Li Bai","quote":"I grieve to be sent so far away to Yelang. When will a pardon let me return?","occasion":"To Official Xin on Being Exiled to Yelang, a poem written around the time of the exile."}
      zh: {"who":"李白","quote":"我愁将远远贬去夜郎，哪一天才会有赦令让我回去？","occasion":"《流夜郎赠辛判官》，约作于流放之际。"}
      zh-Hant: {"who":"李白","quote":"我愁遠謫夜郎去，何日金雞放赦回。","occasion":"《流夜郎赠辛判官》，约作于流放之际。"}
