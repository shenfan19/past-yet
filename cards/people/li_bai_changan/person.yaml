    scene:
      star_rules: 2
      points:
        - {"id":"p1","kind":"trust","day":8,"req":{"any":[{"job":["sailor","ferryman","ferry_pilot","courier"],"stat":{"will":5}},{"trait":["streetwise","wanderer","methodical"],"stat":{"wit":6,"will":6}}]}}
    text:
      en:
        name: 'News by the river'
        place: 'Wushan on the Yangtze'
        figure: 'Li Bai'
        story: 'Li Bai was sentenced to exile in Yelang and was pardoned on the way. One account in his collected works associates the pardon with Wushan. The exact day on which he heard is uncertain.'
        story_prose:
          opening:
            - 'A landing near Wushan, around 759. Li Bai is travelling upriver towards exile in Yelang. An account of his journey will later associate this stretch of river with his pardon.'
            - 'In history, the pardon came before he reached Yelang. The day on which he heard has not been established. In this branch a traveller has brought a written copy of the news while the next boat upstream is still loading.'
            - 'This trip needs someone who knows the boats and their stops. Someone has to find out who saw the original and where it was copied before putting the news into Li Bai’s hands.'
          points:
            p1: '{staff} asks the messenger who gave him the copy, then finds a passenger who knows that person’s hand. Only when the two accounts agree does {staff} hurry down to the landing with the page. Li Bai unfolds it and reads the last line twice. As the crew calls for passengers, he rolls up the bedding already in the upstream boat and hands it to a boatman going the other way.'
          outcomes:
            all: 'As the downstream boat turns past the landing, Li Bai folds the copy again. His sleeve is still wet. He covers the fold with the dry side.'
            p1: 'As the downstream boat turns past the landing, Li Bai folds the copy again. His sleeve is still wet. He covers the fold with the dry side.'
          none: 'The upstream boat is well away by the time someone brings the news to its berth. A stray length of straw rope lies beside the mooring post.'
          not_admitted: '{staff} never gets as far as the boat. The awnings are close enough together to hear people packing inside them.'
          excerpts:
            p1: 'Li Bai unfolds it and reads the last line twice. As the crew calls for passengers, he rolls up the bedding already in the upstream boat and hands it to a boatman going the other way.'
        relic: 'A dry message wrapper'
        relic_desc: 'An imagined wrapper a boat passenger could keep dry on the river.'
        points:
          p1: 'Get confirmed news of the pardon to Li Bai before his boat continues upstream'
        points_fail:
          p1: 'The employee did not manage to bring the news before the boat set off.'
        shift:
          p1:
            was: 'Around 759: Li Bai was pardoned on the way to Yelang. An afterword to his collected works places him near Wushan at the time.'
            now: '{staff} brings the news to the landing before the next departure. Li Bai turns back with that morning’s boat downstream.'
            who: li_bai_changan
            bio: 'Li Bai heard of his pardon before his next boat departed and was able to turn back sooner.'
      zh:
        name: '江边来了一封信'
        place: '巫山江边'
        figure: '李白'
        story: '李白被流放夜郎，途中遇赦。《李白集》后序把得释的行程写到巫山。消息究竟哪天传到他手里并不清楚。'
        story_prose:
          opening:
            - '巫山一带的江岸，约 759 年。李白正沿江赴夜郎，后来记他行程的人把遇赦一事写到了这里。'
            - '史实里，他途中遇赦而归，消息确切哪天传到他手里已不可考。在这条分支里，渡口有人带来抄下的消息，上游的船正在装货。'
            - '这趟需要认得沿江船路的人。还得能问清消息是哪个渡口传来的、谁看过原件，才好把它递到李白手里。'
          points:
            p1: '{staff}先问带信人从谁手里拿来的抄件，再去找认得那人笔迹的船客。两处话对上，这才拿着纸赶下渡口。李白展开纸，把最后一行又看了一遍。船上人在催，他把原先放在上行船里的铺盖卷起来，递给了下水船的伙计。'
          outcomes:
            all: '下水船绕过渡口时，李白把抄件重新叠好。袖口还是湿的，他拿干的一面掩住折痕。'
            p1: '下水船绕过渡口时，李白把抄件重新叠好。袖口还是湿的，他拿干的一面掩住折痕。'
          none: '上行船已经走远，有人把消息带到空着的船位。缆桩旁只剩别人没有带走的一根草绳。'
          not_admitted: '{staff}没能到那条船边。岸上各家的船篷挨得很近，能听见有人在里头收行李。'
          excerpts:
            p1: '李白展开纸，把最后一行又看了一遍。船上人在催，他把原先放在上行船里的铺盖卷起来，递给了下水船的伙计。'
        relic: '一张护信纸'
        relic_desc: '分支里的护信纸，渡江时可以把信包好。'
        points:
          p1: '赶在船再往上游走之前，把核实过的赦讯送到李白手里'
        points_fail:
          p1: '船开以前，员工没能把消息送到。'
        shift:
          p1:
            was: '约 759 年，李白流放夜郎途中遇赦。《李白集》后序把这段行程写到巫山。'
            now: '{staff}赶在下一趟船开之前到达渡口。李白听完消息，搭当日下行的船往回走。'
            who: li_bai_changan
            bio: '李白赶在下一趟船开以前收到赦讯，提前踏上归途。'
text:
  en:
    name: Li Bai
    text: Chinese poet of the Tang, 701 to 762. He wrote lyrical poems about wine, friendship and the moon and spent time at the court at Chang'an before leaving it. Many of his poems are still recited.
  zh:
    name: 李白
    text: 唐代诗人，701 年生，762 年去世。他写酒、友情和月亮的抒情诗，曾在长安宫廷任职，后来离开。他的许多诗至今仍被传诵。
