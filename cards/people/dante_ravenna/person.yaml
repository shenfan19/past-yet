    text:
      en:
        name: A poem in the language of the street
        place: Ravenna
        figure: Dante Alighieri
        story: 'The closing lines of Dante''s Paradiso invoke the Sun and the other stars. Boccaccio''s later account of missing cantos found after a dream is a literary tradition.'
        relic: A laurel leaf
        relic_desc: A dried leaf of the poet's crown.
        points:
          p1: 'Set aside time for Dante to send his Latin reply to Giovanni from Ravenna. Keep it apart from the Paradiso pages being copied'
          p2: 'Let Dante in exile know that the Comedy will be read for generations, and that Florence will one day want him back'
        points_fail:
          p1: 'The recipient gets loose narrative pages. The reply remains among the drafts, and the office recalls the employee.'
          p2: 'He goes on writing in Ravenna with no answer to his hope of going home. In this branch nobody tells him what came after.'
        shift:
          p1:
            was: 'In late 1319 or early 1320, while writing the Paradiso in Ravenna, Dante exchanged Latin verse with Giovanni del Virgilio in Bologna.'
          p2:
            was: 'In September 1321 Dante died in Ravenna without ever returning to Florence; around 1519 Florence asked for his remains, and the friars of Ravenna hid his bones in a wall.'
            now: '{staff} let him know in Ravenna that the Comedy would always have readers, and that his city would one day want to bring him home.'
            who: dante_ravenna
            bio: 'In his last years in Ravenna the exiled Dante came to know that his poem would last, and that Florence would one day be proud of him.'
        vignettes:
          dream: 'You ask whether a dream can tell the copyist where a missing canto went. They put down the lamp. “A dream may tell you where to look. What will you read when you get there?” You mark the story as a later tradition in the report.'
          ear: 'The copyist stops when a verse ends. You ask them to keep reading just long enough to hear the next rhyme arrive. The new page no longer sounds like a fresh start.'
          stars: 'You help the copyist find the last line before the lamp goes out. The word for stars is the one they remember when you step into the street.'
      zh:
        name: 用街头的语言写一部长诗
        place: 拉文纳
        figure: 但丁
        story: '但丁《天堂篇》末尾写到太阳和其他星辰。薄伽丘后来讲过梦中得知遗稿下落的故事，属于流传下来的文学轶闻。'
        relic: 一片月桂叶
        relic_desc: 诗人桂冠上的一片干叶。
        points:
          p1: '给但丁腾出从拉文纳寄出答诗的时间，把他答乔万尼的拉丁诗单独封存，别夹入正在誊写的《天堂篇》'
          p2: '让流放中的但丁知道，《神曲》会被一代代人读下去，佛罗伦萨后来也想把他迎回去'
        points_fail:
          p1: '收信人只拿到正文散页，答诗仍在抄稿夹里，事务所因同步失败召回员工。'
          p2: '他照旧在拉文纳写诗，回佛罗伦萨的盼望没有着落，这条分支里没人告诉过他后来的事。'
        shift:
          p1:
            was: '1319 年下半年至 1320 年初，但丁在拉文纳写《天堂篇》时，与博洛尼亚的乔万尼·德尔·维尔吉利奥开始拉丁诗通信，这是学界的推定。'
          p2:
            was: '1321 年 9 月，但丁在拉文纳去世，到死没能回到佛罗伦萨；1519 年前后佛罗伦萨请求迁回他的遗骨，拉文纳的修士把遗骨藏进了墙里。'
            now: '{staff}在拉文纳让他知道，《神曲》往后会一直有人读，他的城市终有一天想把他接回去。'
            who: dante_ravenna
            bio: '流放中的但丁在拉文纳的晚年得知，他的诗会长久流传，佛罗伦萨终会以他为荣。'
        vignettes:
          dream: '你问誊写员，做个梦能不能知道丢了的诗章在哪儿。他放下灯：「梦兴许能叫你去找。到了地方，你打算读什么？」你在报告里注明，托梦是后来流传的故事。'
          ear: '一行诗念完，誊写员正要停。你请他再念几行，听见下一个韵落下再说。翻页以后，这回听着像刚才的话还在往下走。'
          stars: '熄灯前，你帮誊写员找到最后一行。走到街上时，他还记得诗里的星辰。'
text:
  en:
    name: Dante Alighieri
    text: Italian poet, 1265 to 1321, from Florence. Exiled from his city in 1302, he wrote the Divine Comedy in the Tuscan language and died at Ravenna, where he is buried.
  zh:
    name: 但丁
    text: 意大利诗人，1265 年生，1321 年去世，出身佛罗伦萨。1302 年被逐出故城，他用托斯卡纳语写下《神曲》，在拉韦纳去世并葬在那里。
