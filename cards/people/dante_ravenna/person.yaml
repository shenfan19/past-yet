        - {id: p2, kind: trust, day: 77, req: {"any":[{"trait":["scholarly","sensitive","faithful","artistic"],"stat":{"will":7}},{"job":["translator","teacher","bookseller","writer","proofreader"],"stat":{"will":7}},{"item":"golden_apple","trait":["kind","sensitive","scholarly","artistic"]}]}}
