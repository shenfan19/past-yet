text:
  en:
    name: Dante Alighieri
    text: Italian poet, 1265 to 1321, from Florence. Exiled from his city in 1302, he wrote the Divine Comedy in the Tuscan language and died at Ravenna, where he is buried.
  zh:
    name: 但丁
    text: 意大利诗人，1265 年生，1321 年去世，出身佛罗伦萨。1302 年被逐出故城，他用托斯卡纳语写下《神曲》，在拉韦纳去世并葬在那里。
