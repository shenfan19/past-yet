    text:
      en:
        name: A poem in the language of the street
        place: Ravenna
        figure: Dante Alighieri
        story: 'Exiled from Florence in 1302, Dante Alighieri settled in Ravenna about 1318 and there finished the Paradiso, the last part of the Comedy, written in the Tuscan of everyday speech. About 1319 Giovanni del Virgilio, a scholar of Bologna, sent him a Latin poem urging him to write in Latin and come to Bologna for the laurel, and Dante answered in Latin verse. On 20 January 1320 he gave a lecture at Verona. In September 1321, back from an embassy to Venice, he fell ill and died in Ravenna.'
        relic: A laurel leaf
        relic_desc: A dried leaf of the poet's crown.
        points:
          p1: 'Set aside time for Dante to send his Latin reply to Giovanni from Ravenna. Keep it apart from the Paradiso pages being copied'
          p2: 'Let Dante in exile know that the Comedy will be read for generations, and that Florence will one day want him back'
        points_fail:
          p1: 'The recipient gets loose narrative pages. The reply remains among the drafts, and the office recalls the employee.'
          p2: 'He goes on writing in Ravenna with no answer to his hope of going home. In this branch nobody tells him what came after.'
        shift:
          p1:
            was: 'In late 1319 or early 1320, while writing the Paradiso in Ravenna, Dante exchanged Latin verse with Giovanni del Virgilio in Bologna.'
          p2:
            was: 'In September 1321 Dante died in Ravenna without ever returning to Florence; around 1519 Florence asked for his remains, and the friars of Ravenna hid his bones in a wall.'
            now: '{staff} let him know in Ravenna that the Comedy would always have readers, and that his city would one day want to bring him home.'
            who: dante_ravenna
            bio: 'In his last years in Ravenna the exiled Dante came to know that his poem would last, and that Florence would one day be proud of him.'
        vignettes:
          latin: 'In the copying room {staff} sees two piles of paper: the Paradiso in Tuscan, and the Latin verse bound for Bologna, whose sender says only Latin is worthy of the laurel. {staff} knows which pile everyone will be reading seven hundred years on, and swallows the words.'
          pinewood: '{staff} follows the wood gatherers into the pine forest by the sea outside Ravenna, rests on the sandy ground, and hears the waves beyond the trees.'
          ink: '{staff} helps an ink seller carry his jars off a boat. The ink is boiled from oak galls and rusty iron, and the seller says the copyists of the town buy the most of it.'
      zh:
        name: 用街头的语言写一部长诗
        place: 拉文纳
        figure: 但丁
        story: '但丁 1302 年被逐出佛罗伦萨，约 1318 年移居拉文纳，在那里写完《神曲》的最后一部《天堂篇》，用的是托斯卡纳的日常口语。1319 年前后，博洛尼亚的学者乔万尼·德尔·维尔吉利奥寄来拉丁诗，劝他改用拉丁文写作、到博洛尼亚接受桂冠，但丁用拉丁诗作答。1320 年 1 月 20 日，他在维罗纳作了一场讲演。1321 年 9 月，他从威尼斯出使回来后病倒，在拉文纳去世。'
        relic: 一片月桂叶
        relic_desc: 诗人桂冠上的一片干叶。
        points:
          p1: '给但丁腾出从拉文纳寄出答诗的时间，把他答乔万尼的拉丁诗单独封存，别夹入正在誊写的《天堂篇》'
          p2: '让流放中的但丁知道，《神曲》会被一代代人读下去，佛罗伦萨后来也想把他迎回去'
        points_fail:
          p1: '收信人只拿到正文散页，答诗仍在抄稿夹里，事务所因同步失败召回员工。'
          p2: '他照旧在拉文纳写诗，回佛罗伦萨的盼望没有着落，这条分支里没人告诉过他后来的事。'
        shift:
          p1:
            was: '1319 年下半年至 1320 年初，但丁在拉文纳写《天堂篇》时，与博洛尼亚的乔万尼·德尔·维尔吉利奥开始拉丁诗通信，这是学界的推定。'
          p2:
            was: '1321 年 9 月，但丁在拉文纳去世，到死没能回到佛罗伦萨；1519 年前后佛罗伦萨请求迁回他的遗骨，拉文纳的修士把遗骨藏进了墙里。'
            now: '{staff}在拉文纳让他知道，《神曲》往后会一直有人读，他的城市终有一天想把他接回去。'
            who: dante_ravenna
            bio: '流放中的但丁在拉文纳的晚年得知，他的诗会长久流传，佛罗伦萨终会以他为荣。'
        vignettes:
          latin: '{staff}在誊写间看见两叠纸：一叠是托斯卡纳话写的《天堂篇》，一叠是要寄往博洛尼亚的拉丁诗，来信说只有拉丁文才配得上桂冠。{staff}知道七百年后人人读的是哪一叠，话到嘴边，又咽了回去。'
          pinewood: '{staff}跟着拾柴的人走进拉文纳城外靠海的松林，在沙地上歇脚，听得见林子那头的海浪。'
          ink: '{staff}帮卖墨水的人把一罐罐墨从船上搬下来。墨是用栎树瘿和铁锈熬的，卖墨的说，城里誊写的人买得最多。'
text:
  en:
    name: Dante Alighieri
    text: Italian poet, 1265 to 1321, from Florence. Exiled from his city in 1302, he wrote the Divine Comedy in the Tuscan language and died at Ravenna, where he is buried.
  zh:
    name: 但丁
    text: 意大利诗人，1265 年生，1321 年去世，出身佛罗伦萨。1302 年被逐出故城，他用托斯卡纳语写下《神曲》，在拉文纳去世并葬在那里。
hook: {en: 'The laurel in Bologna, the poem in Ravenna', zh: '桂冠在博洛尼亚，诗在拉文纳'}
facts:
  exile:
    date: '1302'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [dante_ravenna_britannica, dante_ravenna_wiki]
    text:
      en: 'In 1302 Florence sentenced Dante to exile, and later that year to death should he return; he never went back to the city.'
      zh: '1302 年，佛罗伦萨判但丁流放，同年又判他回城即处死；他再没回过佛罗伦萨。'
    note: 'A sentence: written as a plain fact.'
    line:
      en: '1302: Florence sentences Dante to exile, and then to death should he ever come back.'
      zh: '1302 年，佛罗伦萨判但丁流放，又判他回城即处死。'
  ravenna:
    date: '1318'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [dante_ravenna_britannica, dante_ravenna_wiki]
    text:
      en: 'About 1318 Dante settled in Ravenna at the invitation of its lord, Guido Novello da Polenta, and there he finished the Paradiso.'
      zh: '约 1318 年，但丁应拉文纳领主圭多·诺韦洛·达·波伦塔之邀移居拉文纳，在那里写完《天堂篇》。'
    line:
      en: 'About 1318: Dante settles in Ravenna, at the invitation of Guido Novello da Polenta.'
      zh: '约 1318 年，但丁应圭多·诺韦洛·达·波伦塔之邀，移居拉文纳。'
  bologna_letter:
    date: '1319'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [dante_ravenna_eclogue_research, dante_ravenna_wiki]
    text:
      en: 'About 1319 Giovanni del Virgilio, who taught at Bologna, sent Dante a Latin poem urging him to write in Latin and to come to Bologna to be crowned with the laurel; Dante answered with a Latin eclogue, and the exchange went on into 1320 and after.'
      zh: '1319 年前后，在博洛尼亚执教的乔万尼·德尔·维尔吉利奥寄给但丁一首拉丁诗，劝他改用拉丁文写作，到博洛尼亚接受桂冠；但丁用一首拉丁牧歌作答，往来一直延续到 1320 年以后。'
    line:
      en: 'About 1319: from Bologna, Giovanni del Virgilio sends Dante a Latin poem, urging him to write in Latin and come to Bologna for the laurel.'
      zh: '1319 年前后，博洛尼亚的乔万尼·德尔·维尔吉利奥寄来一首拉丁诗，劝但丁改用拉丁文写作，来博洛尼亚戴桂冠。'
  questio:
    date: '1320-01-20'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [dante_ravenna_questio, dante_ravenna_wiki]
    text:
      en: 'On 20 January 1320, at Verona, Dante gave the lecture later written up as the Questio de aqua et terra, on the place of water and earth on the globe.'
      zh: '1320 年 1 月 20 日，但丁在维罗纳作了一场讲演，后来写成《水与土之辩》，讨论地球上水与陆地的位置。'
    line:
      en: '20 January 1320: at Verona, Dante lectures on the place of water and earth on the globe.'
      zh: '1320 年 1 月 20 日，但丁在维罗纳讲演，谈地球上水与陆地的位置。'
  paradiso:
    date: '1320'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [dante_ravenna_primary, boccaccio_dante_tradition]
    text:
      en: 'The closing lines of Dante''s Paradiso invoke the Sun and the other stars. Boccaccio''s later account of missing cantos found after a dream is a literary tradition.'
      zh: '但丁《天堂篇》末尾写到太阳和其他星辰。薄伽丘后来讲过梦中得知遗稿下落的故事，属于流传下来的文学轶闻。'
  death:
    date: '1321-09-14'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [dante_ravenna_britannica, dante_ravenna_wiki]
    text:
      en: 'In the summer of 1321 Dante went to Venice on an embassy for Ravenna; he fell ill on the way back and died in Ravenna on the night of 13 to 14 September 1321.'
      zh: '1321 年夏，但丁替拉文纳出使威尼斯，回程中病倒，9 月 13 日夜到 14 日凌晨在拉文纳去世。'
    note: 'Illness and death: written as plain facts.'
    line:
      en: '14 September 1321: back ill from an embassy to Venice, Dante dies in Ravenna.'
      zh: '1321 年 9 月 14 日，从威尼斯出使回来后病倒的但丁，在拉文纳去世。'
  rehabilitation:
    date: '2008-06'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [dante_ravenna_loc_rehabilitation, dante_ravenna_wiki]
    text:
      en: 'In June 2008 the city council of Florence passed a motion asking the mayor to rehabilitate Dante and revoke the sentence of 1302.'
      zh: '2008 年 6 月，佛罗伦萨市议会通过动议，请市长为但丁恢复名誉，撤销 1302 年的判决。'
    line:
      en: 'June 2008: the city council of Florence votes to revoke the sentence it passed on Dante in 1302.'
      zh: '2008 年 6 月，佛罗伦萨市议会表决，撤销 1302 年对但丁的判决。'
