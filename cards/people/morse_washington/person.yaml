    text:
      en:
        name: What hath God wrought
        place: Washington
        figure: Samuel Morse
        story: 'On 24 May 1844 Morse sent a message from the U.S. Capitol to Alfred Vail in Baltimore. A surviving paper tape records the signals; Morse credits Annie Ellsworth with suggesting the wording.'
        relic: A telegraph key
        relic_desc: A brass lever worn bright where a thumb rested.
        points:
          p1: 'Clear a fault with a test signal before the Capitol sends its first formal demonstration to Baltimore'
          p2: 'Use the operating notes to persuade Morse to teach a class so other people can run the line'
        points_fail:
          p1: 'The far end cannot return the signal, the opening demonstration fails, and the office recalls the employee that day.'
          p2: 'In June only Morse and Vail can operate it, and one end has to wait whenever the other has no operator.'
        shift:
          p1:
            was: 'On 24 May 1844, Morse sent the formal demonstration message from the U.S. Capitol to Baltimore.'
          p2:
            was: 'On 9 June 1844, Vail wrote that only he and Morse could operate the telegraph.'
            now: '{staff} has Morse teach a small class with real test messages and lets trainees check the replies at both ends. By the time the line gets busy they can take shifts.'
            who: morse_washington
            bio: 'Morse began training independent operators during the first line''s opening months. They took on routine traffic while he continued improving the telegraph.'
        vignettes:
          gap: 'You see the operator start a new word at the wrong gap. Reading the strip back together, you find the break where the next person will expect it.'
          credit: 'You ask whose words the operator has put on the strip. The operator adds the sender to the ledger, and you leave space for the person who supplied the words.'
          readback: 'The operator hands you a strip without the intended text. You read it back and compare it with the sealed slip only after finishing.'
      zh:
        name: 上帝做了何等的事
        place: 华盛顿
        figure: 塞缪尔·莫尔斯
        story: '1844 年 5 月 24 日，莫尔斯从美国国会大厦向巴尔的摩的阿尔弗雷德·韦尔发送电报。留存的纸带记录了信号；莫尔斯注明文句由安妮·埃尔斯沃思建议。'
        relic: 一只电报键
        relic_desc: 一根黄铜杠杆，拇指放的地方磨亮了。
        points:
          p1: '在发报前用试信号排掉线路故障，护住国会大厦通往巴尔的摩的首场演示'
          p2: '拿操作记录劝莫尔斯开一班练习，让线路在两位发明者以外也有人会用'
        points_fail:
          p1: '对端没能回收信号，预告的首场正式发送落空，这条分支与史实脱节，员工当天被召回。'
          p2: '到六月仍只有莫尔斯和韦尔能操作，谁不能值班，另一端就得等。'
        shift:
          p1:
            was: '1844 年 5 月 24 日，莫尔斯从华盛顿国会大厦向巴尔的摩发出了正式演示电报。'
          p2:
            was: '1844 年 6 月 9 日，韦尔在信中写道，当时只有莫尔斯和他自己会操作电报。'
            now: '{staff}让莫尔斯用实收的试报教一小班学员，由两端的人互相核对回执。线路忙起来后，学员已经能接班。'
            who: morse_washington
            bio: '莫尔斯从第一条线路开张时就开始训练独立值班的人。后来他可以把例行收发交给学员，腾出时间继续改良电报。'
        vignettes:
          gap: '报务员从一道短空隙另起了一个词。你和他把纸带倒回来读，终于找到下一个人读来也合适的分隔。'
          credit: '你问打在纸带上的话是谁想的。报务员在簿上记了发报人，你另外留了一格给先提这句话的人。'
          readback: '报务员把纸带递给你，没告诉你预定的文句。你先完整读一遍，末了才打开纸条核对。'
text:
  en:
    name: Samuel Morse
    text: American painter and inventor, 1791 to 1872. Working with Alfred Vail he developed an electric telegraph and a code of dots and dashes. On 24 May 1844 he sent the message What hath God wrought from Washington to Baltimore.
  zh:
    name: 塞缪尔·莫尔斯
    text: 美国画家与发明家，1791 年生，1872 年去世。他与阿尔弗雷德·维尔合作发展电报机和点划电码。1844 年 5 月 24 日，他从华盛顿向巴尔的摩发出了“上帝创造了何等奇迹”。
hook: {en: 'Can the same message survive the journey?', zh: '隔着城，字还读得通吗'}
