- morse_washington
text:
  en:
    name: Samuel Morse
    text: American painter and inventor, 1791 to 1872. Working with Alfred Vail he developed an electric telegraph and a code of dots and dashes. On 24 May 1844 he sent the message What hath God wrought from Washington to Baltimore.
  zh:
    name: 塞缪尔·莫尔斯
    text: 美国画家与发明家，1791 年生，1872 年去世。他与阿尔弗雷德·维尔合作发展电报机和点划电码。1844 年 5 月 24 日，他从华盛顿向巴尔的摩发出了“上帝创造了何等奇迹”。
