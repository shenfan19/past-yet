text:
  en:
    name: The Broad Street pump handle is removed
    text: History records the handle being removed on 8 September. The outbreak was already declining by then and many residents had left, so how many lives the removal saved is still debated. In the game an employee can get the handle removed earlier, but only on that branch.
  zh:
    name: 宽街泵柄被拆
    text: 史载 9 月 8 日泵柄被拆走。拆走时疫情已经在下降，很多居民早已离开，所以泵柄被拆能救多少人至今有争论。游戏里员工能让泵柄提前拆走，只在这条分支里成立。
