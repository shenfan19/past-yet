        who: 'エヴァリスト・ガロア'
        quote: 'この手紙をレビュー百科事典に掲載してください。'
        occasion: 'オーギュスト・シュヴァリエへの手紙（ゲーム翻訳）'
      ko:
        who: '에바리스트 갈루아'
        quote: '이 편지를 Revue 백과사전에 인쇄해 보세요.'
