text:
  en:
    name: Évariste Galois
    text: French mathematician, 1811 to 1832. As a teenager he found the conditions under which an equation can be solved by radicals and started group theory. He died at twenty after a duel in Paris.
  zh:
    name: 埃瓦里斯特·伽罗瓦
    text: 法国数学家，1811 年生，1832 年去世。他在少年时找到方程能否用根式求解的条件，并开创了群论。他二十岁时在巴黎因决斗去世。
