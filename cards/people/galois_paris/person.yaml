    text:
      en:
        name: "The night before the duel"
        place: "Paris"
        figure: "Évariste Galois"
        story: 'In a letter dated 29 May 1832, Galois summarized mathematical work for Auguste Chevalier and distinguished results from questions still to be pursued.'
        relic: "A hurried letter"
        relic_desc: "Pages crossed with figures and the words that he had no time."
        points:
          p1: 'On the night of 29 May, while Galois can still check the pages, wrap his letter to Chevalier separately from the papers it mentions and see both delivered'
          p2: 'When the letter is printed in September, have the editor print a manuscript index beside it and find a mathematician willing to read the surviving pages in order'
          p3: 'After the duel on the morning of 30 May, get Galois to a doctor at once and save him from the wound in his abdomen'
        points_fail:
          p1: 'The handover is repeatedly put off and the letter is separated from the papers. Chevalier never receives the May 29 letter, and the office recalls the employee.'
          p2: 'Only the letter appears in September. Readers who want to go further still have to find the friend holding the manuscripts.'
          p3: 'He lies wounded and alone until a passer by finds him, and dies in the Cochin hospital on 31 May, aged twenty. In this branch there is no Galois after that.'
        shift:
          p1:
            was: 'On May 29, 1832, Galois wrote to Auguste Chevalier to outline his research and ask him to handle the papers and publish the letter.'
          p2:
            was: 'The letter appeared in September 1832. Chevalier passed manuscripts to Liouville in 1843, and Liouville published them in 1846.'
            now: 'Anyone reading the letter in September can use the index to ask for a copy. Questions come back to Chevalier with page numbers, leaving a record for the next reader.'
          p3:
            was: 'On 30 May 1832 Galois was shot in the abdomen in a duel and left lying where he fell. He died in the Cochin hospital on 31 May, aged twenty.'
            now: '{staff} reaches him within minutes, stops the bleeding and keeps the wound from turning septic. Galois recovers, returns to mathematics and explains his theory himself to the mathematicians who had not understood it.'
            who: galois_paris
            bio: 'Galois survived the duel of May 1832. He went on working in mathematics in Paris and saw his theory of equations read and discussed in his own lifetime.'
        vignettes:
          check: 'The copyist puts a question among the conclusions. You trace it back to the request at the end of the letter. They mark what the next reader is being asked to check.'
          sequence: 'Two pages both begin with the same symbol. You read the last line of each and find which one the argument needs first. The copyist adds a page mark.'
          fold: 'You hold the letter open until the copyist has copied the date and recipient. They fold the notes separately so the two sets of paper can still be found.'
      zh:
        name: "决斗前夜"
        place: "巴黎"
        figure: "埃瓦里斯特·伽罗瓦"
        story: '伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。'
        relic: "一封匆忙写就的信"
        relic_desc: "写满算式的信页，页边写着没有时间了。"
        points:
          p1: '5 月 29 日夜里趁伽罗瓦还能逐页核对，把写给舍瓦利耶的信和信中提到的论文分别包好，送到收信人手上'
          p2: '趁九月刊信，请编辑一并刊出手稿索引，约一位能逐页核查的数学同行先读留存稿'
          p3: '5 月 30 日清晨决斗以后，立刻把伽罗瓦送到医生手里，救下中了腹部一枪的他'
        points_fail:
          p1: '约定的交接一再推迟，信与待寄的草稿被分开。舍瓦利耶收不到 5 月 29 日的信，事务所因同步失败召回员工。'
          p2: '九月的刊物只有信件。愿意往下核对的人仍须先找到保管手稿的朋友。'
          p3: '他中枪后被丢在原地，直到有路人发现，5 月 31 日死在科钦医院，年仅二十岁。这条分支里此后没有伽罗瓦。'
        shift:
          p1:
            was: '伽罗瓦 1832 年 5 月 29 日写信给奥古斯特·舍瓦利耶，概述研究，并托他处理稿件和刊出书信。'
          p2:
            was: '信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交给刘维尔，刘维尔于 1846 年刊行。'
            now: '九月读到这封信的同行可以按刊出的索引申请借看一份抄本。所提问题和对应页码回到舍瓦利耶手中，给下一轮审阅留下记录。'
          p3:
            was: '1832 年 5 月 30 日，伽罗瓦在决斗中腹部中枪，被丢在原地；5 月 31 日他死在科钦医院，年仅二十岁。'
            now: '{staff}几分钟内赶到，止住了血，又没让伤口感染。伽罗瓦活了下来，回到数学上，亲自向那些没读懂他的数学家讲清自己的理论。'
            who: galois_paris
            bio: '伽罗瓦挺过了 1832 年 5 月的决斗。他在巴黎继续做数学，生前就看到自己关于方程的理论被人读懂、讨论。'
        vignettes:
          check: '誊写员把一个问题夹进了结论。你顺着信查到末尾的请求，他另标出下一个读信人要核对哪件事。'
          sequence: '两页都从同一个符号起笔。你分别读了末行，找出论证先用哪一页。誊写员补上页码。'
          fold: '你扶着信，等誊写员抄好日期和收信人。他把笔记另折一份，后来还找得出两套纸。'
text:
  en:
    name: Évariste Galois
    text: French mathematician, 1811 to 1832. As a teenager he found the conditions under which an equation can be solved by radicals and started group theory. He died at twenty after a duel in Paris.
  zh:
    name: 埃瓦里斯特·伽罗瓦
    text: 法国数学家，1811 年生，1832 年去世。他在少年时找到方程能否用根式求解的条件，并开创了群论。他二十岁时在巴黎因决斗去世。
