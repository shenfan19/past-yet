    checked: official_record
    sources: [galois_paris_primary]
    original: fr
    text:
      fr:
        who: 'Évariste Galois'
        quote: 'Après cela, il y aura, j’espère, des gens qui trouveront leur profit à déchiffrer tout ce gâchis.'
        occasion: 'lettre à Auguste Chevalier'
      en:
        who: 'Évariste Galois'
        quote: 'After that, I hope there will be people who find it worthwhile to make sense of this whole muddle.'
        occasion: 'letter to Auguste Chevalier (game translation)'
      zh:
        who: '埃瓦里斯特·伽罗瓦'
        quote: '在那之后，我希望会有人觉得，把这一团乱麻理清是值得的。'
        occasion: '致奥古斯特·舍瓦利耶的信（游戏译文）'
      zh-Hant:
        who: '埃瓦里斯特·伽羅瓦'
        quote: '在那之後，我希望會有人覺得，把這一團亂麻理清是值得的。'
        occasion: '致奧古斯特·舍瓦利耶的信（遊戲譯文）'
      es:
        who: 'Évariste Galois'
        quote: 'Después de eso, espero que haya gente a la que le resulte útil encontrarle sentido a todo este embrollo.'
        occasion: 'carta a Auguste Chevalier (traducción del juego)'
      ja:
        who: 'エヴァリスト・ガロア'
        quote: 'その後、この混乱全体を理解することに価値があると考える人が現れることを願っています。'
        occasion: 'オーギュスト・シュヴァリエへの手紙（ゲーム翻訳）'
      ko:
        who: '에바리스트 갈루아'
        quote: '그 후에는 이 모든 혼란을 이해하는 것이 가치 있다고 생각하는 사람들이 있기를 바랍니다.'
        occasion: 'Auguste Chevalier에게 보낸 편지 (게임 번역)'
      ru:
        who: 'Эварист Галуа'
        quote: 'После этого, надеюсь, найдутся люди, которым будет полезно разобраться во всей этой путанице.'
        occasion: 'письмо Огюсту Шевалье (перевод игры)'
hook: {en: 'He finished the letter, and at dawn went to fight', zh: '写完这封信，天亮就去决斗'}
facts:
  release:
    date: '1832-04-29'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Galois was held in the Sainte-Pélagie prison from July 1831. In March 1832, when cholera broke out in Paris, the prisoners were moved to the nursing home of Sieur Faultrier, and on 29 April 1832 he was released.'
      zh: '伽罗瓦自 1831 年 7 月起关押在圣佩拉吉监狱。1832 年 3 月巴黎霍乱流行，囚犯被移到福尔特里耶疗养所，4 月 29 日他获释。'
    note: 'A prison term: written as a plain fact, without its cause.'
    line:
      en: '29 April 1832: Galois is released in Paris, after more than nine months held.'
      zh: '1832 年 4 月 29 日，伽罗瓦在巴黎被关押九个多月后获释。'
      zh-Hant: '1832 年 4 月 29 日，伽羅瓦在巴黎被關押九個多月後獲釋。'
      fr: '29 avril 1832 : Galois est libéré à Paris, après plus de neuf mois de détention.'
      es: '29 de abril de 1832: Galois es liberado en París, después de más de nueve meses de reclusión.'
      ja: '1832年4月29日：ガロアは9か月以上拘留された後、パリで釈放される。'
      ko: '1832년 4월 29일: 갈루아는 9개월 이상의 구금 끝에 파리에서 석방됩니다.'
      ru: '29 апреля 1832 г.: Галуа освобождают в Париже после более чем девяти месяцев заключения.'
  letter_to_chevalier:
    date: '1832-05-29'
    stay_day: 9
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [galois_paris_primary, galois_chevalier_archive]
    text:
      en: 'In a letter dated 29 May 1832, Galois summarized mathematical work for Auguste Chevalier and distinguished results from questions still to be pursued. He asked Chevalier to have the letter printed and to ask Jacobi or Gauss publicly for their opinion.'
      zh: '伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。他托舍瓦利耶把信刊出，并公开请雅可比或高斯发表意见。'
    line:
      en: '29 May 1832: through the night Galois writes to his friend Auguste Chevalier, setting out his work and asking him to print the letter.'
      zh: '1832 年 5 月 29 日夜里，伽罗瓦给朋友奥古斯特·舍瓦利耶写信，概述自己的研究，托他把信刊出。'
      zh-Hant: '1832 年 5 月 29 日夜裡，伽羅瓦給朋友奧古斯特·舍瓦利耶寫信，概述自己的研究，托他把信刊出。'
      fr: '29 mai 1832 : dans la nuit, Galois écrit à son ami Auguste Chevalier, lui exposant son ouvrage et lui demandant d''imprimer la lettre.'
      es: '29 de mayo de 1832: durante la noche Galois escribe a su amigo Auguste Chevalier, exponiéndole su trabajo y pidiéndole que imprima la carta.'
      ja: '1832年5月29日: ガロアは友人のオーギュスト・シュヴァリエに夜通し手紙を書き、自分の作品を紹介し、その手紙を印刷するように頼んだ。'
      ko: '1832년 5월 29일: 갈루아는 밤새 친구인 오귀스트 슈발리에에게 편지를 써서 자신의 작업을 설명하고 그 편지를 인쇄해 달라고 요청했습니다.'
      ru: '29 мая 1832 года: всю ночь Галуа пишет своему другу Огюсту Шевалье, излагая свою работу и прося его напечатать письмо.'
  duel:
    date: '1832-05-30'
    stay_day: 10
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Early on 30 May 1832 Galois was shot in the abdomen in a duel. His opponent and the seconds left him where he fell, and a passing farmer found him.'
      zh: '1832 年 5 月 30 日清晨，伽罗瓦在一场决斗中腹部中枪。对手和助手们把他丢在原地，一个路过的农人发现了他。'
    note: 'A wound: written as a plain fact, without the cause of the duel or the name of the opponent.'
    line:
      en: '30 May 1832: early in the morning Galois is shot in the abdomen in a duel and left where he fell, until a passing farmer finds him.'
      zh: '1832 年 5 月 30 日清晨，伽罗瓦在决斗中腹部中枪，被丢在原地，直到一个路过的农人发现他。'
      zh-Hant: '1832 年 5 月 30 日清晨，伽羅瓦在決鬥中腹部中槍，被丟在原地，直到一個路過的農人發現他。'
      fr: '30 mai 1832 : au petit matin, Galois est touché au ventre lors d''un duel et laissé là où il est tombé, jusqu''à ce qu''un paysan de passage le retrouve.'
      es: '30 de mayo de 1832: temprano en la mañana, Galois recibe un disparo en el abdomen en un duelo y lo abandonan donde cayó, hasta que un granjero que pasaba lo encuentra.'
      ja: '1832年5月30日：早朝、ガロアは決闘で腹部を撃たれ、倒れた場所に放置され、通りかかった農夫に発見される。'
      ko: '1832년 5월 30일: 이른 아침, 갈루아는 결투 중 복부에 총을 맞고 쓰러진 자리에 남겨졌습니다. 지나가던 농부가 그를 발견했습니다.'
      ru: '30 мая 1832 года: рано утром Галуа ранен в живот на дуэли и оставлен там, где упал, пока его не находит проходящий мимо фермер.'
  death:
    date: '1832-05-31'
    stay_day: 11.2
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Galois died in the Cochin hospital in Paris on the morning of 31 May 1832, aged twenty.'
      zh: '1832 年 5 月 31 日上午，伽罗瓦死在巴黎科钦医院，年仅二十岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '31 May 1832: Évariste Galois dies in the Cochin hospital, aged twenty.'
      zh: '1832 年 5 月 31 日，埃瓦里斯特·伽罗瓦死在科钦医院，年仅二十岁。'
      zh-Hant: '1832 年 5 月 31 日，埃瓦里斯特·伽羅瓦死在科欽醫院，年僅二十歲。'
      fr: '31 mai 1832 : Évariste Galois décède à l''hôpital Cochin, âgé de vingt ans.'
      es: '31 de mayo de 1832: Évariste Galois muere en el hospital de Cochin, a los veinte años.'
      ja: '1832年5月31日：エヴァリスト・ガロアがコーチン病院で20歳で死去。'
      ko: '1832년 5월 31일: 에바리스트 갈루아가 코친 병원에서 20세의 나이로 사망합니다.'
      ru: '31 мая 1832 года: Эварист Галуа умирает в больнице Кочина в возрасте двадцати лет.'
  burial:
    date: '1832-06-02'
    stay_day: 13
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'On 2 June 1832 Galois was buried in a common grave of the Montparnasse cemetery, whose exact place is no longer known.'
      zh: '1832 年 6 月 2 日，伽罗瓦葬在蒙帕纳斯公墓的公共墓穴，确切位置今已不知。'
    note: 'A burial: written as a plain fact.'
    line:
      en: '2 June 1832: Galois is buried in a common grave at Montparnasse.'
      zh: '1832 年 6 月 2 日，伽罗瓦葬进蒙帕纳斯公墓的公共墓穴。'
      zh-Hant: '1832 年 6 月 2 日，伽羅瓦葬進蒙帕納斯公墓的公共墓穴。'
      fr: '2 juin 1832 : Galois est inhumé dans une fosse commune à Montparnasse.'
      es: '2 de junio de 1832: Galois es enterrado en una fosa común en Montparnasse.'
      ja: '1832年6月2日：ガロアはモンパルナスの共同墓地に埋葬される。'
      ko: '1832년 6월 2일: 갈루아는 몽파르나스의 공동묘지에 묻혔습니다.'
      ru: '2 июня 1832 года: Галуа похоронен в братской могиле на Монпарнасе.'
  printed:
    date: '1832-09'
    stay_day: 104.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [galois_chevalier_archive, galois_oeuvres_1897]
    text:
      en: 'In September 1832 Chevalier printed the letter of 29 May in the Revue encyclopédique, with a notice on his friend.'
      zh: '1832 年 9 月，舍瓦利耶把 5 月 29 日那封信刊在《百科评论》上，并附了一篇悼念朋友的短文。'
    line:
      en: 'September 1832: Chevalier prints the letter in the Revue encyclopédique.'
      zh: '1832 年 9 月，舍瓦利耶把那封信刊在《百科评论》上。'
      zh-Hant: '1832 年 9 月，舍瓦利耶把那封信刊在《百科評論》上。'
      fr: 'Septembre 1832 : Chevalier imprime la lettre dans la Revue encyclopédique.'
      es: 'Septiembre de 1832: Chevalier imprime la carta en la Revue encyclopédique.'
      ja: '1832年9月：シュヴァリエ、その手紙をレビュー百科事典に掲載。'
      ko: '1832년 9월: 슈발리에가 Revue 백과사전에 편지를 인쇄합니다.'
      ru: 'Сентябрь 1832 года: Шевалье печатает письмо в энциклопедическом журнале Revue.'
  liouville:
    date: '1846'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [galois_liouville_1846, galois_wiki]
    text:
      en: 'In 1846 Joseph Liouville published the mathematical papers of Galois in his Journal de mathématiques pures et appliquées.'
      zh: '1846 年，约瑟夫·刘维尔在他主编的《纯粹与应用数学杂志》上刊出伽罗瓦的数学论文。'
    line:
      en: '1846: Joseph Liouville publishes the papers of Galois in his journal.'
      zh: '1846 年，约瑟夫·刘维尔在自己的杂志上刊出伽罗瓦的论文。'
      zh-Hant: '1846 年，約瑟夫·劉維爾在自己的雜誌上刊出伽羅瓦的論文。'
      fr: '1846 : Joseph Liouville publie les articles de Galois dans son journal.'
      es: '1846: Joseph Liouville publica los artículos de Galois en su diario.'
      ja: '1846年：ジョセフ・リウヴィルがガロアの論文を雑誌に掲載。'
      ko: '1846년: Joseph Liouville은 자신의 저널에 Galois의 논문을 게재합니다.'
      ru: '1846: Жозеф Лиувилль публикует статьи Галуа в своем журнале.'
