    refs: [galois_paris_primary, galois_chevalier_archive, galois_liouville_1846, galois_mactutor, galois_wiki, galois_oeuvres_1897]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 9, req: {"any":[{"job":["archivist","translator","proofreader"]},{"trait":["methodical","vigil"],"stat":{"will":6}}]}}
        - {id: p2, kind: persuade, day: 104, req: {"any":[{"job":["archivist","translator"],"stat":{"wit":7,"will":7}},{"trait":["methodical","charismatic"],"stat":{"will":8}}]}}
        - {id: p3, kind: care, day: 10, req: {"any":[{"job":["doctor","physician","paramedic"],"item":"first_aid_kit"},{"job":["nurse"],"item":"antibiotic","stat":{"will":6}},{"provides":"cure","stat":{"constitution":6}}]}}
      vignettes:
        - {id: candle, traits: [methodical, vigil, patient, quiet, scholarly], day: 9.3}
        - {id: cart, traits: [bold, hardy, kind, streetwise, cheerful], day: 11.5}
        - {id: type, day: 103}
    text:
      en:
        name: "The night before the duel"
        place: "Paris"
        figure: "Évariste Galois"
        story: 'Évariste Galois came out of prison in Paris on 29 April 1832. On the night of 29 May he wrote to his friend Auguste Chevalier, setting out what he had found about which equations can be solved by radicals and asking him to have the letter printed. The next morning he was shot in the abdomen in a duel and left where he fell; he died in the Cochin hospital on 31 May, aged twenty. Chevalier printed the letter that September. Fourteen years later Joseph Liouville published his papers.'
        relic: "A hurried letter"
        relic_desc: "Pages crossed with figures and the words that he had no time."
        points:
          p1: 'On the night of 29 May, while Galois can still check the pages, wrap his letter to Chevalier separately from the papers it mentions and see both delivered'
          p2: 'When the letter is printed in September, have the editor print a manuscript index beside it and find a mathematician willing to read the surviving pages in order'
          p3: 'After the duel on the morning of 30 May, get Galois to a doctor at once and save him from the wound in his abdomen'
        points_fail:
          p1: 'The handover is repeatedly put off and the letter is separated from the papers. Chevalier never receives the May 29 letter, and the office recalls the employee.'
          p2: 'Only the letter appears in September. Readers who want to go further still have to find the friend holding the manuscripts.'
          p3: 'He lies wounded and alone until a passer by finds him, and dies in the Cochin hospital on 31 May, aged twenty. In this branch there is no Galois after that.'
        shift:
          p1:
            was: 'On May 29, 1832, Galois wrote to Auguste Chevalier to outline his research and ask him to handle the papers and publish the letter.'
          p2:
            was: 'The letter appeared in September 1832. Chevalier passed manuscripts to Liouville in 1843, and Liouville published them in 1846.'
            now: 'Anyone reading the letter in September can use the index to ask for a copy. Questions come back to Chevalier with page numbers, leaving a record for the next reader.'
          p3:
            was: 'On 30 May 1832 Galois was shot in the abdomen in a duel and left lying where he fell. He died in the Cochin hospital on 31 May, aged twenty.'
            now: '{staff} reaches him within minutes, stops the bleeding and keeps the wound from turning septic. Galois recovers, returns to mathematics and explains his theory himself to the mathematicians who had not understood it.'
            who: galois_paris
            bio: 'Galois survived the duel of May 1832. He went on working in mathematics in Paris and saw his theory of equations read and discussed in his own lifetime.'
        vignettes:
          candle: 'On the night of 29 May {staff} carries a second candle up the stairs for the concierge. She grumbles that the young gentleman''s lamp has been burning since dark, and that the ink is hers too, lent, and she means to put it on the account.'
          cart: 'On 31 May {staff} helps a carter unload firewood at the gate of the Cochin hospital. Yesterday they carried a young man in, the carter says, and this morning there was a sheet over him; ten years he has brought wood here, and it is the fine mornings he cannot stand.'
          type: 'At the end of summer {staff} picks up spilled type from the floor of a small print shop. The compositor complains that this number has a letter in it full of sums, and he has had to borrow every equals sign from the case next door.'
      zh:
        name: "决斗前夜"
        place: "巴黎"
        figure: "埃瓦里斯特·伽罗瓦"
        story: '1832 年 4 月 29 日，埃瓦里斯特·伽罗瓦在巴黎获释出狱。5 月 29 日夜里，他给朋友奥古斯特·舍瓦利耶写信，概述自己关于哪些方程能用根式求解的发现，托他把信刊出。第二天清晨，他在决斗中腹部中枪，被丢在原地，5 月 31 日死在科钦医院，年仅二十岁。那年九月，舍瓦利耶刊出了这封信。十四年后，约瑟夫·刘维尔刊出了他的论文。'
        relic: "一封匆忙写就的信"
        relic_desc: "写满算式的信页，页边写着没有时间了。"
        points:
          p1: '5 月 29 日夜里趁伽罗瓦还能逐页核对，把写给舍瓦利耶的信和信中提到的论文分别包好，送到收信人手上'
          p2: '趁九月刊信，请编辑一并刊出手稿索引，约一位能逐页核查的数学同行先读留存稿'
          p3: '5 月 30 日清晨决斗以后，立刻把伽罗瓦送到医生手里，救下中了腹部一枪的他'
        points_fail:
          p1: '约定的交接一再推迟，信与待寄的草稿被分开。舍瓦利耶收不到 5 月 29 日的信，事务所因同步失败召回员工。'
          p2: '九月的刊物只有信件。愿意往下核对的人仍须先找到保管手稿的朋友。'
          p3: '他中枪后被丢在原地，直到有路人发现，5 月 31 日死在科钦医院，年仅二十岁。这条分支里此后没有伽罗瓦。'
        shift:
          p1:
            was: '伽罗瓦 1832 年 5 月 29 日写信给奥古斯特·舍瓦利耶，概述研究，并托他处理稿件和刊出书信。'
          p2:
            was: '信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交给刘维尔，刘维尔于 1846 年刊行。'
            now: '九月读到这封信的同行可以按刊出的索引申请借看一份抄本。所提问题和对应页码回到舍瓦利耶手中，给下一轮审阅留下记录。'
          p3:
            was: '1832 年 5 月 30 日，伽罗瓦在决斗中腹部中枪，被丢在原地；5 月 31 日他死在科钦医院，年仅二十岁。'
            now: '{staff}几分钟内赶到，止住了血，又没让伤口感染。伽罗瓦活了下来，回到数学上，亲自向那些没读懂他的数学家讲清自己的理论。'
            who: galois_paris
            bio: '伽罗瓦挺过了 1832 年 5 月的决斗。他在巴黎继续做数学，生前就看到自己关于方程的理论被人读懂、讨论。'
        vignettes:
          candle: '5 月 29 日夜里，{staff}替看门的老妇人往楼上送第二支蜡烛。她嘟囔说，这位年轻先生的灯从天黑亮到现在，墨水也是从她这儿借的，回头得记进账里。'
          cart: '5 月 31 日，{staff}在科钦医院门口帮一个车夫卸柴。车夫说，昨天抬进去一个年轻人，今早就盖上了布。他往这儿送了十年柴，最受不了的就是这种天气好的早上。'
          type: '夏末，{staff}在一家小印坊里帮着捡撒了一地的铅字。排字工抱怨这一期有封信满纸算式，等号得一个个从隔壁字盘里借。'
text:
  en:
    name: Évariste Galois
    text: French mathematician, 1811 to 1832. As a teenager he found the conditions under which an equation can be solved by radicals and started group theory. He died at twenty after a duel in Paris.
  zh:
    name: 埃瓦里斯特·伽罗瓦
    text: 法国数学家，1811 年生，1832 年去世。他在少年时找到方程能否用根式求解的条件，并开创了群论。他二十岁时在巴黎因决斗去世。
hook: {en: 'He finished the letter, and at dawn went to fight', zh: '写完这封信，天亮就去决斗'}
facts:
  release:
    date: '1832-04-29'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Galois was held in the Sainte-Pélagie prison from July 1831. In March 1832, when cholera broke out in Paris, the prisoners were moved to the nursing home of Sieur Faultrier, and on 29 April 1832 he was released.'
      zh: '伽罗瓦自 1831 年 7 月起关押在圣佩拉吉监狱。1832 年 3 月巴黎霍乱流行，囚犯被移到福尔特里耶疗养所，4 月 29 日他获释。'
    note: 'A prison term: written as a plain fact, without its cause.'
    line:
      en: '29 April 1832: Galois is released in Paris, after more than nine months held.'
      zh: '1832 年 4 月 29 日，伽罗瓦在巴黎被关押九个多月后获释。'
  letter_to_chevalier:
    date: '1832-05-29'
    stay_day: 9
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [galois_paris_primary, galois_chevalier_archive]
    text:
      en: 'In a letter dated 29 May 1832, Galois summarized mathematical work for Auguste Chevalier and distinguished results from questions still to be pursued. He asked Chevalier to have the letter printed and to ask Jacobi or Gauss publicly for their opinion.'
      zh: '伽罗瓦在署于 1832 年 5 月 29 日的致奥古斯特·舍瓦利耶信中概述了自己的数学研究，区分已得结果和有待追究的问题。他托舍瓦利耶把信刊出，并公开请雅可比或高斯发表意见。'
    line:
      en: '29 May 1832: through the night Galois writes to his friend Auguste Chevalier, setting out his work and asking him to print the letter.'
      zh: '1832 年 5 月 29 日夜里，伽罗瓦给朋友奥古斯特·舍瓦利耶写信，概述自己的研究，托他把信刊出。'
  duel:
    date: '1832-05-30'
    stay_day: 10
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Early on 30 May 1832 Galois was shot in the abdomen in a duel. His opponent and the seconds left him where he fell, and a passing farmer found him.'
      zh: '1832 年 5 月 30 日清晨，伽罗瓦在一场决斗中腹部中枪。对手和助手们把他丢在原地，一个路过的农人发现了他。'
    note: 'A wound: written as a plain fact, without the cause of the duel or the name of the opponent.'
    line:
      en: '30 May 1832: early in the morning Galois is shot in the abdomen in a duel and left where he fell, until a passing farmer finds him.'
      zh: '1832 年 5 月 30 日清晨，伽罗瓦在决斗中腹部中枪，被丢在原地，直到一个路过的农人发现他。'
  death:
    date: '1832-05-31'
    stay_day: 11.2
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'Galois died in the Cochin hospital in Paris on the morning of 31 May 1832, aged twenty.'
      zh: '1832 年 5 月 31 日上午，伽罗瓦死在巴黎科钦医院，年仅二十岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '31 May 1832: Évariste Galois dies in the Cochin hospital, aged twenty.'
      zh: '1832 年 5 月 31 日，埃瓦里斯特·伽罗瓦死在科钦医院，年仅二十岁。'
  burial:
    date: '1832-06-02'
    stay_day: 13
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [galois_mactutor, galois_wiki]
    text:
      en: 'On 2 June 1832 Galois was buried in a common grave of the Montparnasse cemetery, whose exact place is no longer known.'
      zh: '1832 年 6 月 2 日，伽罗瓦葬在蒙帕纳斯公墓的公共墓穴，确切位置今已不知。'
    note: 'A burial: written as a plain fact.'
    line:
      en: '2 June 1832: Galois is buried in a common grave at Montparnasse.'
      zh: '1832 年 6 月 2 日，伽罗瓦葬进蒙帕纳斯公墓的公共墓穴。'
  printed:
    date: '1832-09'
    stay_day: 104.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [galois_chevalier_archive, galois_oeuvres_1897]
    text:
      en: 'In September 1832 Chevalier printed the letter of 29 May in the Revue encyclopédique, with a notice on his friend.'
      zh: '1832 年 9 月，舍瓦利耶把 5 月 29 日那封信刊在《百科评论》上，并附了一篇悼念朋友的短文。'
    line:
      en: 'September 1832: Chevalier prints the letter in the Revue encyclopédique.'
      zh: '1832 年 9 月，舍瓦利耶把那封信刊在《百科评论》上。'
  liouville:
    date: '1846'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [galois_liouville_1846, galois_wiki]
    text:
      en: 'In 1846 Joseph Liouville published the mathematical papers of Galois in his Journal de mathématiques pures et appliquées.'
      zh: '1846 年，约瑟夫·刘维尔在他主编的《纯粹与应用数学杂志》上刊出伽罗瓦的数学论文。'
    line:
      en: '1846: Joseph Liouville publishes the papers of Galois in his journal.'
      zh: '1846 年，约瑟夫·刘维尔在自己的杂志上刊出伽罗瓦的论文。'
