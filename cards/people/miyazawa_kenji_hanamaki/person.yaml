- miyazawa_kenji_hanamaki
text:
  en:
    name: Miyazawa Kenji
    text: Japanese poet and writer of children's stories, 1896 to 1933, from Hanamaki. He taught agriculture, worked to help poor farmers, and wrote Night on the Galactic Railroad. Most of his work was published after his death.
  zh:
    name: 宫泽贤治
    text: 日本诗人与童话作家，1896 年生，1933 年去世，花卷人。他教农业，帮助贫苦农民，并写了《银河铁道之夜》。他的作品大多在身后出版。
