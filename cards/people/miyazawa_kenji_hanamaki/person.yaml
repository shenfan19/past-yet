    text:
      en:
        name: "Stories few had read"
        place: "Hanamaki"
        figure: "Miyazawa Kenji"
        story: 'Miyazawa revised Night on the Galactic Railroad in several drafts. In the manuscript-based text, Giovanni hears a station call before finding himself in a carriage.'
        relic: "A pocket notebook"
        relic_desc: "A small notebook of poems in pencil."
        points:
          p1: 'Sort out the farmers'' questions so Miyazawa can still hold the fertilizer consultation when he is too ill for a long conversation'
          p2: 'While Miyazawa can still recognize the drafts of Night on the Galactic Railroad, ask him to leave their order clear'
          p3: 'Get medical care to Miyazawa when his pneumonia worsens on 20 September so he can survive the illness'
        points_fail:
          p1: 'The visitors leave without a consultation, the branch falls out of sync, and the office recalls the employee.'
          p2: 'The pages survive, and later editors still have to infer the order from paper and revisions.'
          p3: 'In this branch the illness runs as it did. He dies in Hanamaki on 21 September, aged 37.'
        shift:
          p1:
            was: 'In August 1933, Miyazawa continued advising farmers about fertilizer as his health worsened.'
          p2:
            was: 'In September 1933, Miyazawa died, leaving several unfinished drafts of Night on the Galactic Railroad.'
            now: '{staff} asks him which stacks came first and records the order on a separate wrapper. Later editors use those notes to keep the versions distinct.'
            who: miyazawa_kenji_hanamaki
            bio: 'Miyazawa left a guide to the order of the drafts before he died. When the story appeared after his death, readers could follow his revisions in sequence.'
          p3:
            was: 'On 20 September 1933 Miyazawa developed acute pneumonia and died in Hanamaki the next day, aged 37.'
            now: '{staff} gets treatment started during the acute illness. Miyazawa survives and is able to sit at his desk again as autumn advances.'
            who: miyazawa_kenji_hanamaki
            bio: 'In this branch Miyazawa survives the pneumonia in the autumn of 1933 and resumes work on his manuscripts.'
        vignettes:
          call: 'You read the station call from across the room. The reader looks up before you explain who is there. They leave the explanation for later and keep the call in their reading.'
          window: 'The reader tries to point to where the route enters the sky. You ask what Giovanni can see through the window first. They put the hill and the carriage on separate scraps.'
          ticket: 'You hold the page open while the reader rereads the shift into the carriage. They make a short note of what changes before the next station is named.'
      zh:
        name: "很少有人读过的故事"
        place: "花卷"
        figure: "宫泽贤治"
        story: '宫泽贤治多次修改《银河铁道之夜》。现行的据稿本整理的文字写乔班尼听见站名，接着发现自己坐在车厢里。'
        relic: "一本口袋笔记本"
        relic_desc: "一本小笔记本，里面是铅笔写的诗。"
        points:
          p1: '在宫泽无力长谈时，理清来访农户的问题，让这次肥料咨询照常办下去'
          p2: '趁宫泽还能辨认草稿，请他给《银河铁道之夜》留下各稿的先后'
          p3: '9 月 20 日急性肺炎加重时，让宫泽贤治及时得到医护，帮他熬过这场病'
        points_fail:
          p1: '来访的人等不到能问清楚的时候，咨询没办成，这条分支与史实脱节，员工被召回。'
          p2: '稿页留了下来，后来整理的人仍要从纸张和改笔判断稿本先后。'
          p3: '这条分支里病照旧发展，9 月 21 日他在花卷去世，三十七岁。'
        shift:
          p1:
            was: '1933 年 8 月，宫泽贤治病情转重，仍应答农户的肥料咨询。'
          p2:
            was: '1933 年 9 月，宫泽贤治去世，《银河铁道之夜》留有多次改写的未定稿。'
            now: '{staff}请宫泽指出哪叠在先、哪叠在后，把次序另记在封纸上。后来整理作品的人照着这份记号把不同稿本分别保存。'
            who: miyazawa_kenji_hanamaki
            bio: '宫泽生前留下了《银河铁道之夜》各稿的排序说明。作品身后刊行时，读者可以由早到晚读到他留下的改写。'
          p3:
            was: '1933 年 9 月 20 日，宫泽贤治患急性肺炎，次日在花卷去世，三十七岁。'
            now: '{staff}在病情最急的那天帮他得到医治。宫泽熬过了这场病，到了秋深时，又能坐到桌边。'
            who: miyazawa_kenji_hanamaki
            bio: '这条分支里，宫泽贤治熬过了 1933 年秋天的肺炎，重新拿起了稿子。'
        vignettes:
          call: '你在屋子那头念出站名。还没解释谁在那里，读者就抬了头。他再读时把解释往后放，先保留那一声。'
          window: '读者想指出铁道从哪里通进天空。你问乔班尼先从窗里看见了什么。他把小山和车厢分别写在两张纸上。'
          ticket: '读者重读转进车厢那几句时，你一直替他翻着这页。下一站还没叫名以前，他先记下眼前已经变了什么。'
text:
  en:
    name: Miyazawa Kenji
    text: Japanese poet and writer of children's stories, 1896 to 1933, from Hanamaki. He taught agriculture, worked to help poor farmers, and wrote Night on the Galactic Railroad. Most of his work was published after his death.
  zh:
    name: 宫泽贤治
    text: 日本诗人与童话作家，1896 年生，1933 年去世，花卷人。他教农业，帮助贫苦农民，并写了《银河铁道之夜》。他的作品大多在身后出版。
hook: {en: 'When does a town become the railway?', zh: '城里走着走着，何时上了车'}
