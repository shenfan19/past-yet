quotes:
  miyazawa_kenji_hanamaki_story_echo_full:
    order: 1
    tier: full
    date: '1931'
    checked: official_record
    sources: [miyazawa_kenji_hanamaki_story_echo_source_full]
    original: ja
    text:
      en:
        who: 'Kenji Miyazawa'
        quote: 'To look well, listen, understand, and then not forget.'
        occasion: 'From a notebook poem about the kind of person he wanted to become.'
      zh:
        who: '宫泽贤治'
        quote: '好好看，好好听，弄懂了，也不忘记。'
        occasion: '手记中写理想的自我。'
      ja:
        who: 'Kenji Miyazawa'
        quote: 'ヨクミキキシワカリ　ソシテワスレズ'
        occasion: 'From a notebook poem about the kind of person he wanted to become.'
      zh-Hant:
        who: '宮澤賢治'
        quote: '好好看，好好聽，弄懂了，也不忘記。'
        occasion: '手記中寫理想的自我。'
      fr:
        who: 'Miyazawa Kenji'
        quote: 'Bien regarder, écouter, comprendre, puis ne pas oublier.'
        occasion: 'Extrait d''un poème de carnet sur le genre de personne qu''il voulait devenir.'
      es:
        who: 'Kenji Miyazawa'
        quote: 'Mirar bien, escuchar, comprender y luego no olvidar.'
        occasion: 'De un poema de cuaderno sobre el tipo de persona que quería convertirse.'
      ko:
        who: '미야자와 겐지'
        quote: '잘 보려면, 듣고, 이해하고, 잊지 마십시오.'
        occasion: '그가 되고 싶은 사람에 대한 노트의 시에서 발췌.'
      ru:
        who: 'Кенджи Миядзава'
        quote: 'Чтобы хорошо посмотреть, послушать, понять и потом не забыть.'
        occasion: 'Из тетради стихотворение о том, каким человеком он хотел стать.'
  miyazawa_kenji_hanamaki_story_echo_none:
    order: 2
    tier: none
    date: '1931'
    checked: official_record
    sources: [miyazawa_kenji_hanamaki_story_echo_source_none]
    original: ja
    text:
      en:
        who: 'Kenji Miyazawa'
        quote: 'That is the sort of person I want to become.'
        occasion: 'A line from his notebook poem Ame ni mo Makezu.'
      zh:
        who: '宫泽贤治'
        quote: '我想成为那样的人。'
        occasion: '手记诗《不畏风雨》中的一行。'
      ja:
        who: 'Kenji Miyazawa'
        quote: 'サウイフモノニ　ワタシハナリタイ'
        occasion: 'A line from his notebook poem Ame ni mo Makezu.'
      zh-Hant:
        who: '宮澤賢治'
        quote: '我想成為那樣的人。'
        occasion: '手記詩《不畏風雨》中的一行。'
      fr:
        who: 'Miyazawa Kenji'
        quote: 'C''est le genre de personne que je veux devenir.'
        occasion: 'Une ligne de son poème de carnet Ame ni mo Makezu.'
      es:
        who: 'Kenji Miyazawa'
        quote: 'Ese es el tipo de persona en la que quiero convertirme.'
        occasion: 'Una línea de su poema de cuaderno Ame ni mo Makezu.'
      ko:
        who: '미야자와 겐지'
        quote: '제가 되고 싶은 사람이 바로 그런 사람입니다.'
        occasion: '그의 노트 시 Ame ni mo Makezu의 한 구절입니다.'
      ru:
        who: 'Кенджи Миядзава'
        quote: 'Именно таким человеком я хочу стать.'
        occasion: 'Строка из его тетрадного стихотворения «Амэ ни мо Макэдзу».'
