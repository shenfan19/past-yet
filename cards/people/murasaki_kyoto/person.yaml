self_check:
  fact: diary
  quote_line: '宽弘五年十一月一日，五十日宴上，藤原公任在女官们中间问起"若紫"在不在。'
  regret_choice: '派手细的去，回宫那天成套的抄本一册不缺；派会说话又懂书的去，早期读者拿到的是她核过的一套。只会其中一样的人，只能护住一头。'
  bookend: '从九月十一日皇子诞生开始，以 2012 年"古典之日"收尾，中间是五十日宴上的一句问话和一套赶在回宫前装订好的书。'
  share_line: '1008 年冬天，我在京都帮人给《源氏物语》分过纸。'
