          p2:
            was: 'Genji comes down through different manuscript traditions. No final copy in Murasaki’s own hand survives.'
            now: 'The first borrowers read a set she has checked. Later copies still vary, but that loan set records which chapters she approved.'
            who: murasaki_kyoto
            bio: 'Murasaki wrote at the Heian court. The provision of paper, copying and lending affected how a work still under revision reached new readers.'
        vignettes:
          banquet: 'The day before the fiftieth-day banquet {staff} helps carry trays along the gallery. One of the ladies says under her breath that tomorrow night, once the gentlemen have drunk, they will start teasing the women with names out of the tale, and the thing to do is not to hear.'
          paper: '{staff} helps a lady sort sheets of coloured paper by chapter and weigh each pile down. Every finished page goes to be checked first, she says, and if the hand slopes, the whole page is done again, and the paper has to be asked for again too.'
          snow: 'Snow falls in the twelfth month. {staff} is sweeping the gallery when the reading inside stops halfway, and a voice asks who has taken the next volume.'
      zh:
        name: 世界上第一部伟大的长篇小说
        place: 京都
        figure: 紫式部
        story: '1008 年秋，中宫彰子生下皇子，侍奉她的紫式部在日记里记下了此后的几个星期。皇子诞生第五十日的宴席上，有位公卿借《源氏物语》里的"若紫"向女官们搭话，这是这部物语见于记载的最早日子。十一月里，女官们挑纸、誊写、装订《源氏物语》，好让彰子带回宫中；道长又从紫式部房里取走了她留着的稿本。她亲笔的定本没有传下来。'
        story_prose:
          opening:
            - '宽弘五年，即 1008 年秋，京都。一条天皇的中宫彰子生下皇子，侍奉她的女官紫式部在日记里记下此后的几个星期。皇子诞生第五十日的宴席上，有位公卿借《源氏物语》里的"若紫"向女官们搭话，这是这部物语见于记载的最早日子。'
            - '史实里，十一月里女官们挑纸、誊写、装订物语，好让彰子带回宫中；道长趁紫式部当值，从她房里取走了还没改好的稿本，转给女儿妍子，她在日记里写下了自己的担心。她亲笔的定本没有传下来，今天读到的是后世彼此有出入的几系抄本。在这条分支里，彰子身边有个管抄书用纸的女官，还有一个对宴席上的事心里有数的女官。'
            - '这一趟用得上几种人：管过档案、做过校对的人，或者手细、耐得住性子的人，守得住一套书一册不错；懂书又说得动人的人，替她把借出去的那一份挑对。'
          outcomes:
            all: '十一月十七日，装订好的物语跟着彰子回了宫，一册不缺。腊月以后来借书的人，翻开的是她点过记号的那一套。2012 年，日本把 11 月 1 日定为古典之日，取的是五十日宴上那一则日记。'
            p2: '腊月以后来借书的人，翻开的是她核过的那一套，页角有她点的小记号。她亲笔的定本还是没有传下来，后世的抄本彼此仍有出入。'
            p1: '十一月十七日，彰子带着皇子回宫，装订好的物语跟着进了宫。2012 年，日本把 11 月 1 日定为古典之日，取的是五十日宴那一则日记。'
          none: '腊月里下了雪。紫式部房里那几帖没改完的稿子被人借走了，案上只剩那只漆盒，盒盖没有合严。'
          desync: '十一月十七日一早，书箱里还混着待核的几册。管纸的女官把纸样摊了一地，一册一册地对。{staff}被召回时，她还跪在那堆纸中间，手里捏着一张对不上的题签。'
          not_admitted: '{staff}没能进到里面，只在土御门邸的墙外站过几回。五十日宴那夜，墙里传出乐声和笑声，有人高声问了一句什么，墙外听不清。'
          points:
            p1:
              class_lettered: '十一月十七日一早，彰子要回宫了。廊下排着刚装订好的一摞摞册子，抄完的和待核的混在一处，有几张题签上的墨还没干透。{staff}跟纸和字打惯了交道，把每一册翻开对着章目核过，抽出一册夹错了帖的，从核过的那摞里换上，再按章次一册册码进书箱。车驾出门前，那位管纸的女官把最后一册放进箱里。她用指尖把箱角的绳结又按了一下，才直起身来。'
              else: '十一月十七日一早，彰子要回宫了。廊下排着刚装订好的一摞摞册子，抄完的和待核的混在一处，有几张题签上的墨还没干透。{staff}手细，又耐得住，把每一册的题签对着纸样一一摸过，抽出一册夹错了帖的，从核过的那摞里换上，再按章次一册册码进书箱。车驾出门前，那位管纸的女官把最后一册放进箱里。她用指尖把箱角的绳结又按了一下，才直起身来。'
            p2:
              class_lettered: '腊月中，雪停了两天，宫里有几位女房托人来借物语，想先读后面几帖。紫式部房里的案上还摊着几帖没改完的稿子，页边有她新添的小字。{staff}跟书打惯了交道，把她核过的那一套另装一箱，箱上写明是借本，每册记下借给谁、几时还；没改完的几帖用纸包好，留在她手边。紫式部把一帖借本翻到末页，提笔在页角点了一个小小的记号。她把笔搁回那只漆盒，盒盖合上时轻轻响了一声。'
              else: '腊月中，雪停了两天，宫里有几位女房托人来借物语，想先读后面几帖。紫式部房里的案上还摊着几帖没改完的稿子，页边有她新添的小字。{staff}心细，话也说得动人，同来借书的人讲明先读这一套核过的，把它另装一箱；没改完的几帖用纸包好，留在她手边。紫式部把一帖借本翻到末页，提笔在页角点了一个小小的记号。她把笔搁回那只漆盒，盒盖合上时轻轻响了一声。'
          excerpts:
            p2: '紫式部把一帖借本翻到末页，提笔在页角点了一个小小的记号。她把笔搁回那只漆盒，盒盖合上时轻轻响了一声。'
            p1: '车驾出门前，那位管纸的女官把最后一册放进箱里。她用指尖把箱角的绳结又按了一下，才直起身来。'
        relic: 一只漆制笔盒
        relic_desc: 一只小盒子，里面有笔、砚和水。
        points:
          p1: '按章分配抄纸，逐册验收给彰子的《源氏物语》抄本，护住这次成册'
          p2: '给想先读的人准备一份她愿意借出的抄本，并把未定稿留在本人处，让新抄人只按签认本领书'
        points_fail:
          p1: '抄完的章和待核章混装，成套的书一直缺一册，事务所因同步失败召回员工。'
          p2: '借去的仍是那份未定稿。后来的抄手不知道作者曾想再改。'
        shift:
          p1:
            was: '紫式部的日记记有彰子身边的人分纸抄写《源氏物语》，道长为此提供纸笔。'
          p2:
            was: '后世留存的是经长期传抄下来的不同抄本，紫式部手定稿没有传到今天。'
            now: '早期几名读者看到的是她核过的一套。以后各处传抄仍会有变化，但这份借本记下了曾由她核过的章节。'
            who: murasaki_kyoto
            bio: '紫式部在平安宫廷写作。别人如何领纸、分抄和借阅，决定了一部未完全改定的作品怎样进入宫外读者手中。'
        vignettes:
          banquet: '五十日宴的前一天，{staff}帮着沿回廊搬膳台，漆面上映着廊外的池水。一个女官压低声音说，明晚男宾喝多了，最爱拿物语里的名字逗女官，听见了也只当没听见。'
          paper: '{staff}帮一个女官把各色的纸按章分好，每摞压上镇纸，窗缝里进来的风掀起了最上面一张的纸角。她说抄好的每一页都得先送去核，字写歪了就整页重抄，纸还得重新去领。'
          snow: '腊月里下了雪，廊下的栏杆上积了薄薄一层。{staff}正在廊下扫雪，屋里念物语的声音念到一半停了，有人问，下一册谁拿走了。'
text:
  en:
    name: Murasaki Shikibu
    text: Japanese court lady and writer of the Heian period, born about 973. Her Tale of Genji, written in the early eleventh century, is often called the first novel. Her diary describes life at the court in Kyoto.
  zh:
    name: 紫式部
    text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
quotes:
  murasaki_paper_and_letters:
    order: 1
    tier: full
    date: '1008'
    checked: two_sources
    sources: [murasaki_kokubun_copying, murasaki_shinshaku]
    original: ja
    text:
      ja: {who: 紫式部, quote: 'いろいろの紙えり調へて、物語の本どもそへつゝ所々にふみかきくばる。', occasion: '『紫式部日記』寛弘五年十一月、御草紙作り'}
      en: {who: Murasaki Shikibu, quote: 'I select and arrange papers of different kinds, enclose copies of the tale, and send letters to one place after another.', occasion: 'Diary, eleventh lunar month of 1008, preparing copies at Shōshi’s court (game translation)'}
      zh: {who: 紫式部, quote: '我挑拣各色纸张，一一理好，附上物语的底本，写信分送各处。', occasion: '《紫式部日记》宽弘五年十一月，为彰子整理抄本（本游戏译）'}
  murasaki_waterbirds:
    order: 2
    tier: none
    date: '1008'
    checked: two_sources
    sources: [murasaki_kokubun_waterbirds, murasaki_gakuen_waterbirds]
    original: ja
    text:
      ja: {who: 紫式部, quote: '水鳥をみづのうへとやよそに見むわれもうきたる世をすぐしつゝ', occasion: '『紫式部日記』寛弘五年十月、土御門殿の池を眺めて'}
      en: {who: Murasaki Shikibu, quote: 'Can I watch the waterbirds as if they had nothing to do with me? I too spend my days afloat in this troubled world.', occasion: 'Diary, tenth lunar month of 1008, a poem watching waterbirds at Tsuchimikado (game translation)'}
      zh: {who: 紫式部, quote: '怎能只当水鸟浮在水上，与我无关？我也在这忧浮的人世里，漂着过日子。', occasion: '《紫式部日记》宽弘五年十月，望土御门邸池中水鸟所作（本游戏译）'}
hook: {en: 'A name steps out of the story.', zh: '小说里的人走进了闲谈'}
