    text:
      en:
        name: The world's first great novel
        place: Kyoto
        figure: Murasaki Shikibu
        story: 'In the autumn of 1008 the empress Shōshi bore a son, and Murasaki Shikibu, one of her ladies, kept a diary of the weeks that followed. At the banquet for the fiftieth day a courtier called out for "Young Murasaki", a girl from The Tale of Genji, the oldest dated sign that the tale was known. In the eleventh month the ladies chose paper, copied and bound the tale for Shōshi to take back to the palace, while Michinaga carried off a draft Murasaki had kept in her room. No copy in her own hand survives.'
        story_prose:
          opening:
            - 'Kyoto, the autumn of Kankō 5, the year 1008. Shōshi, empress to the emperor Ichijō, has borne a son, and Murasaki Shikibu, one of her ladies, keeps a diary of the weeks that follow. At the banquet for the fiftieth day a courtier calls out for "Young Murasaki", a girl from The Tale of Genji, the oldest dated sign that the tale was known.'
            - 'In history, in the eleventh month the ladies chose paper, copied the tale and bound it for Shōshi to take back to the palace; while Murasaki was on duty Michinaga took from her room a draft she had not yet revised and gave it to his daughter Kenshi, and she wrote in her diary of her worry. No copy in her own hand survives, and the tale comes down through later manuscript lines that differ from one another. In this branch, one of Shōshi''s ladies looks after the paper for the copying, and another knows how the banquets go.'
            - 'A few kinds of people can help on this trip: someone who has kept archives or read proofs, or someone deft and patient, to keep a set of books from going wrong by a single volume; someone who knows books and can talk people round, to choose the copy that goes out on loan.'
          outcomes:
            all: 'On the seventeenth day of the eleventh month the bound tale went back to the palace with Shōshi, not a volume missing. Those who came to borrow it after the twelfth month opened the set she had marked. In 2012 Japan made 1 November Classics Day, after the diary entry of the fiftieth-day banquet.'
            p2: 'Those who came to borrow the tale after the twelfth month opened the set she had checked, with her small mark in the corner. No copy in her own hand survived even so, and the later manuscripts still differ from one another.'
            p1: 'On the seventeenth day of the eleventh month Shōshi returned to the palace with the prince, and the bound tale went with her. In 2012 Japan made 1 November Classics Day, after the diary entry of the fiftieth-day banquet.'
          none: 'Snow fell in the twelfth month. The chapters Murasaki had not finished revising were borrowed from her room, and on the desk only the lacquered box was left, its lid not quite shut.'
          desync: 'Early on the seventeenth day of the eleventh month unchecked volumes were still mixed into the chest. The lady who kept the paper had spread the samples across the floor and was matching them one volume at a time, and when {staff} was recalled she was still kneeling among them, a title slip that matched nothing in her hand.'
          not_admitted: '{staff} never got inside, and only stood a few times outside the wall of Tsuchimikado. On the night of the fiftieth-day banquet music and laughter came over the wall, and someone called out a question that could not be made out from the road.'
          points:
            p1:
              class_lettered: 'Early on the seventeenth day of the eleventh month Shōshi is to return to the palace. Along the gallery stand piles of newly bound volumes, finished and unchecked ones mixed together, the ink on a few title slips not yet dry. {staff}, at home with paper and writing, opens each volume and checks it against the list of chapters, pulls out one bound with the wrong chapter, puts in its place the checked one from the other pile, and lays the volumes into the book chest in order. Before the carriages leave, the lady who keeps the paper puts the last volume into the chest. She presses the knot at its corner once more with her fingertip before she straightens up.'
              else: 'Early on the seventeenth day of the eleventh month Shōshi is to return to the palace. Along the gallery stand piles of newly bound volumes, finished and unchecked ones mixed together, the ink on a few title slips not yet dry. {staff}, deft and patient, runs a finger along each title slip against the paper samples, pulls out one bound with the wrong chapter, puts in its place the checked one from the other pile, and lays the volumes into the book chest in order. Before the carriages leave, the lady who keeps the paper puts the last volume into the chest. She presses the knot at its corner once more with her fingertip before she straightens up.'
            p2:
              class_lettered: 'In the middle of the twelfth month, after two days without snow, some ladies of the palace send to borrow the tale; they want to read the later chapters first. On the desk in Murasaki''s room lie several chapters she has not finished revising, small new writing in their margins. {staff}, at home with books, packs the set she has checked into a chest of its own, marks it as the loan set and notes for each volume who has it and when it is due back; the unfinished chapters are wrapped in paper and kept beside her. Murasaki turns one volume of the loan set to its last page and makes a small mark in the corner with her brush. She lays the brush back in the lacquered box, and the lid closes with a soft knock.'
              else: 'In the middle of the twelfth month, after two days without snow, some ladies of the palace send to borrow the tale; they want to read the later chapters first. On the desk in Murasaki''s room lie several chapters she has not finished revising, small new writing in their margins. {staff}, careful and persuasive, asks the borrowers to read the checked set first and packs it into a chest of its own; the unfinished chapters are wrapped in paper and kept beside her. Murasaki turns one volume of the loan set to its last page and makes a small mark in the corner with her brush. She lays the brush back in the lacquered box, and the lid closes with a soft knock.'
          excerpts:
            p2: 'Murasaki turns one volume of the loan set to its last page and makes a small mark in the corner with her brush. She lays the brush back in the lacquered box, and the lid closes with a soft knock.'
            p1: 'Before the carriages leave, the lady who keeps the paper puts the last volume into the chest. She presses the knot at its corner once more with her fingertip before she straightens up.'
        relic: A lacquered brush box
        relic_desc: A small box with brushes, a stone and water.
        points:
          p1: 'Assign paper by chapter and check delivery of the volumes copied for Shōshi so the set can be assembled'
          p2: 'Offer early readers a loan copy she approves. Keep the unfinished papers with her and have new copyists draw from the approved set'
        points_fail:
