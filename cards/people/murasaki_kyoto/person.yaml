    # finished: in the game with release.ready_only
    ready: true
    refs: [murasaki_kyoto_primary, murasaki_kyoto_genji_diary_exhibit, murasaki_kyoto_textual_history, murasaki_diary_wiki, murasaki_classics_day_nijl, murasaki_classics_day_kyoto]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 21, req: {"any":[{"job":["archivist","proofreader"]},{"trait":["artistic","methodical"],"stat":{"will":6}}]}}
        - {id: p2, kind: persuade, day: 48, req: {"any":[{"job":["archivist","proofreader"],"stat":{"wit":7,"will":7}},{"trait":["artistic","methodical","scholarly"],"stat":{"wit":8,"will":7}}]}}
