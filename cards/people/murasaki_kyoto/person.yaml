    text:
      en:
        name: The world's first great novel
        place: Kyoto
        figure: Murasaki Shikibu
        story: 'Murasaki Shikibu''s diary recalls an exchange in 1008 that plays on a character from The Tale of Genji, evidence that the story was already known at court.'
        relic: A lacquered brush box
        relic_desc: A small box with brushes, a stone and water.
        points:
          p1: 'Assign paper by chapter and check delivery of the volumes copied for Shōshi so the set can be assembled'
          p2: 'Have Murasaki identify the first and last pages of the sections she still plans to revise. Give the copyists the list'
          p3: 'Offer early readers a loan copy she approves. Keep the unfinished papers with her and have new copyists draw from the approved set'
        points_fail:
          p1: 'Finished chapters are packed with unchecked ones. The set remains incomplete, and the office recalls the employee.'
          p2: 'Two versions of a chapter circulate. The copyists take the unfinished one for the newer text.'
          p3: 'The draft is lent out. Later copyists do not know the author intended to revise it.'
        shift:
          p1:
            was: 'Murasaki’s diary records women around Shōshi copying The Tale of Genji with writing materials provided by Michinaga.'
          p2:
            was: 'Murasaki recorded that Michinaga took a draft and that its circulation troubled her.'
            now: 'The copyists check the list as they borrow a draft and know which pages she still wants to review.'
          p3:
            was: 'Genji comes down through different manuscript traditions. No final copy in Murasaki’s own hand survives.'
            now: 'The first borrowers read a set she has checked. Later copies still vary, but that loan set records which chapters she approved.'
            who: murasaki_kyoto
            bio: 'Murasaki wrote at the Heian court. The provision of paper, copying and lending affected how a work still under revision reached new readers.'
        vignettes:
          nickname: 'You hear someone use a name from the tale and look around for the wrong person. The attendant catches your mistake and asks whether you have been listening in the doorway again.'
          voice: 'You notice the attendant changes her voice when she reads a letter in the story. You ask her to read the same line plainly. It sounds less certain the second time.'
          return: 'A page gets passed to you halfway through the reading. You keep your finger where she stopped so nobody has to guess where the story should resume.'
      zh:
        name: 世界上第一部伟大的长篇小说
        place: 京都
        figure: 紫式部
        story: '紫式部日记记载，1008 年有人借《源氏物语》中的人物开玩笑，可见故事当时已在宫中为人所知。'
        relic: 一只漆制笔盒
        relic_desc: 一只小盒子，里面有笔、砚和水。
        points:
          p1: '按章分配抄纸，逐册验收给彰子的《源氏物语》抄本，护住这次成册'
          p2: '请紫式部给仍待本人改定的册页另记起讫，给参与抄写的人一份可查的清单'
          p3: '给想先读的人准备一份她愿意借出的抄本，并把未定稿留在本人处，让新抄人只按签认本领书'
        points_fail:
          p1: '抄完的章和待核章混装，成套的书一直缺一册，事务所因同步失败召回员工。'
          p2: '同一章流出两份，抄写的人把还没改完的一份当成了最新本。'
          p3: '借去的仍是那份未定稿。后来的抄手不知道作者曾想再改。'
        shift:
          p1:
            was: '紫式部的日记记有彰子身边的人分纸抄写《源氏物语》，道长为此提供纸笔。'
          p2:
            was: '紫式部记道长取走过自己尚未定稿的一份。她为不完善的抄本流通忧心。'
            now: '参与抄写的人拿着清单借稿，知道哪几页应该等紫式部先看。'
          p3:
            was: '后世留存的是经长期传抄下来的不同抄本，紫式部手定稿没有传到今天。'
            now: '早期几名读者看到的是她核过的一套。以后各处传抄仍会有变化，但这份借本记下了曾由她核过的章节。'
            who: murasaki_kyoto
            bio: '紫式部在平安宫廷写作。别人如何领纸、分抄和借阅，决定了一部未完全改定的作品怎样进入宫外读者手中。'
        vignettes:
          nickname: '你听见有人叫小说里的人名，转头找错了人。侍女看出来了，笑问你是不是又在门口偷听人念故事。'
          voice: '你听出侍女念到故事里的信时换了语气，请她照原来的声音再念一次。第二遍听来，话里竟少了几分笃定。'
          return: '念到一半，纸页传到你手里。你按住刚停下的地方，免得换回去时还得猜从哪里接着念。'
text:
  en:
    name: Murasaki Shikibu
    text: Japanese court lady and writer of the Heian period, born about 973. Her Tale of Genji, written in the early eleventh century, is often called the first novel. Her diary describes life at the court in Kyoto.
  zh:
    name: 紫式部
    text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
