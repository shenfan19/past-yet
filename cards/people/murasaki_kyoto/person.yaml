text:
  en:
    name: Murasaki Shikibu
    text: Japanese court lady and writer of the Heian period, born about 973. Her Tale of Genji, written in the early eleventh century, is often called the first novel. Her diary describes life at the court in Kyoto.
  zh:
    name: 紫式部
    text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
