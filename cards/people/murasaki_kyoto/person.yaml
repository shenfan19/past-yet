    text:
      en:
        name: The world's first great novel
        place: Kyoto
        figure: Murasaki Shikibu
        story: 'In the autumn of 1008 the empress Shōshi bore a son, and Murasaki Shikibu, one of her ladies, kept a diary of the weeks that followed. At the banquet for the fiftieth day a courtier called out for "Young Murasaki", a girl from The Tale of Genji, the oldest dated sign that the tale was known. In the eleventh month the ladies chose paper, copied and bound the tale for Shōshi to take back to the palace, while Michinaga carried off a draft Murasaki had kept in her room. No copy in her own hand survives.'
        relic: A lacquered brush box
        relic_desc: A small box with brushes, a stone and water.
        points:
          p1: 'Assign paper by chapter and check delivery of the volumes copied for Shōshi so the set can be assembled'
          p2: 'Offer early readers a loan copy she approves. Keep the unfinished papers with her and have new copyists draw from the approved set'
        points_fail:
          p1: 'Finished chapters are packed with unchecked ones. The set remains incomplete, and the office recalls the employee.'
          p2: 'The draft is lent out. Later copyists do not know the author intended to revise it.'
        shift:
          p1:
            was: 'Murasaki’s diary records women around Shōshi copying The Tale of Genji with writing materials provided by Michinaga.'
          p2:
            was: 'Genji comes down through different manuscript traditions. No final copy in Murasaki’s own hand survives.'
            now: 'The first borrowers read a set she has checked. Later copies still vary, but that loan set records which chapters she approved.'
            who: murasaki_kyoto
            bio: 'Murasaki wrote at the Heian court. The provision of paper, copying and lending affected how a work still under revision reached new readers.'
        vignettes:
          banquet: 'The day before the fiftieth-day banquet {staff} helps carry trays along the gallery. One of the ladies says under her breath that tomorrow night, once the gentlemen have drunk, they will start teasing the women with names out of the tale, and the thing to do is not to hear.'
          paper: '{staff} helps a lady sort sheets of coloured paper by chapter and weigh each pile down. Every finished page goes to be checked first, she says, and if the hand slopes, the whole page is done again, and the paper has to be asked for again too.'
          snow: 'Snow falls in the twelfth month. {staff} is sweeping the gallery when the reading inside stops halfway, and a voice asks who has taken the next volume.'
      zh:
        name: 世界上第一部伟大的长篇小说
        place: 京都
        figure: 紫式部
        story: '1008 年秋，中宫彰子生下皇子，侍奉她的紫式部在日记里记下了此后的几个星期。皇子诞生第五十日的宴席上，有位公卿借《源氏物语》里的"若紫"向女官们搭话，这是这部物语见于记载的最早日子。十一月里，女官们挑纸、誊写、装订《源氏物语》，好让彰子带回宫中；道长又从紫式部房里取走了她留着的稿本。她亲笔的定本没有传下来。'
        relic: 一只漆制笔盒
        relic_desc: 一只小盒子，里面有笔、砚和水。
        points:
          p1: '按章分配抄纸，逐册验收给彰子的《源氏物语》抄本，护住这次成册'
          p2: '给想先读的人准备一份她愿意借出的抄本，并把未定稿留在本人处，让新抄人只按签认本领书'
        points_fail:
          p1: '抄完的章和待核章混装，成套的书一直缺一册，事务所因同步失败召回员工。'
          p2: '借去的仍是那份未定稿。后来的抄手不知道作者曾想再改。'
        shift:
          p1:
            was: '紫式部的日记记有彰子身边的人分纸抄写《源氏物语》，道长为此提供纸笔。'
          p2:
            was: '后世留存的是经长期传抄下来的不同抄本，紫式部手定稿没有传到今天。'
            now: '早期几名读者看到的是她核过的一套。以后各处传抄仍会有变化，但这份借本记下了曾由她核过的章节。'
            who: murasaki_kyoto
            bio: '紫式部在平安宫廷写作。别人如何领纸、分抄和借阅，决定了一部未完全改定的作品怎样进入宫外读者手中。'
        vignettes:
          banquet: '五十日宴的前一天，{staff}帮着沿回廊搬膳台。一个女官压低声音说，明晚男宾喝多了，最爱拿物语里的名字逗女官，听见了也只当没听见。'
          paper: '{staff}帮一个女官把各色的纸按章分好，每摞压上镇纸。她说抄好的每一页都得先送去核，字写歪了就整页重抄，纸还得重新去领。'
          snow: '腊月里下了雪。{staff}正在廊下扫雪，屋里念物语的声音念到一半停了，有人问，下一册谁拿走了。'
text:
  en:
    name: Murasaki Shikibu
    text: Japanese court lady and writer of the Heian period, born about 973. Her Tale of Genji, written in the early eleventh century, is often called the first novel. Her diary describes life at the court in Kyoto.
  zh:
    name: 紫式部
    text: 平安时代的日本宫廷女官与作家，约 973 年生。她在十一世纪初写的《源氏物语》常被称为第一部长篇小说。她的日记记录了京都宫廷的生活。
hook: {en: 'A name steps out of the story.', zh: '小说里的人走进了闲谈'}
facts:
  prince:
    date: '1008'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_diary_wiki, murasaki_kyoto_primary]
    text:
      en: 'On the eleventh day of the ninth month of Kankō 5, in 1008, Shōshi, the consort of the emperor Ichijō and daughter of Michinaga, bore a son, Prince Atsuhira; Murasaki''s diary opens in the weeks around the birth.'
      zh: '宽弘五年，即 1008 年，九月十一日，一条天皇的中宫、道长之女彰子生下敦成亲王；紫式部的日记从这次生产前后写起。'
    line:
      en: 'The eleventh day of the ninth month, Kankō 5: the empress Shōshi bears a son.'
      zh: '宽弘五年九月十一日，中宫彰子生下皇子。'
  diary:
    date: '1008'
    stay_day: 5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_kyoto_primary, murasaki_classics_day_nijl, murasaki_classics_day_kyoto]
    text:
      en: 'At the banquet for the prince''s fiftieth day, on the first day of the eleventh month of Kankō 5, the courtier Fujiwara no Kintō called out for "Young Murasaki" among the ladies. The entry is the oldest dated record of The Tale of Genji.'
      zh: '宽弘五年十一月一日，皇子诞生第五十日的宴席上，公卿藤原公任在女官们中间问起"若紫"在不在。这一则是《源氏物语》见于记载的最早日期。'
    line:
      en: 'The first day of the eleventh month, Kankō 5: at the fiftieth-day banquet Fujiwara no Kintō calls out for "Young Murasaki" among the ladies.'
      zh: '宽弘五年十一月一日，五十日宴上，藤原公任在女官们中间问起"若紫"在不在。'
  binding:
    date: '1008'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_kyoto_genji_diary_exhibit, murasaki_diary_wiki]
    text:
      en: 'Before the return to the palace, Shōshi''s ladies chose paper, sent chapters out to be copied and bound the tale into books, with paper, brushes and ink supplied by Michinaga.'
      zh: '回宫之前，彰子身边的女官挑纸、把各章分送出去誊写，再装订成册，纸笔墨都由道长送来。'
    line:
      en: 'The eleventh month: the ladies around Shōshi choose paper, copy The Tale of Genji and bind it into books.'
      zh: '十一月里，彰子身边的女官挑纸、誊写《源氏物语》，装订成册。'
  draft:
    date: '1008'
    stay_day: 19
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_kyoto_genji_diary_exhibit, murasaki_diary_wiki]
    text:
      en: 'While Murasaki was in attendance, Michinaga went into her room, took the draft of the tale she had brought from home and gave it to his daughter Kenshi; Murasaki wrote of her worry that an unrevised version was now going round.'
      zh: '紫式部在中宫跟前当值时，道长进了她的房间，取走她从家里带来的物语稿本，转给了女儿妍子。紫式部在日记里写到，她担心这份没改好的稿子就此流传开。'
    line:
      en: 'In those days: while Murasaki is on duty, Michinaga takes the draft of the tale from her room and gives it to his daughter Kenshi.'
      zh: '这些天里，紫式部当值时，道长从她房里取走了物语的稿本，转给女儿妍子。'
  palace:
    date: '1008'
    stay_day: 21.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_kyoto_genji_diary_exhibit, murasaki_diary_wiki]
    text:
      en: 'On the seventeenth day of the eleventh month Shōshi returned to the palace with the prince.'
      zh: '十一月十七日，彰子带着皇子回到宫中。'
    line:
      en: 'The seventeenth day of the eleventh month: Shōshi returns to the palace with the prince.'
      zh: '十一月十七日，彰子带着皇子回宫。'
  manuscripts:
    date: '1008'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [murasaki_kyoto_textual_history, murasaki_diary_wiki]
    text:
      en: 'No copy of The Tale of Genji in Murasaki''s hand survives; the text comes down through later manuscript lines that differ from one another.'
      zh: '紫式部亲笔的《源氏物语》没有留存，今天的文本来自后世彼此有出入的几系抄本。'
  classics_day:
    date: '2012'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [murasaki_classics_day_nijl, murasaki_classics_day_kyoto]
    text:
      en: 'In 2012 a Japanese law made 1 November Classics Day, after the diary entry of the first day of the eleventh month of 1008.'
      zh: '2012 年，日本以法律把 11 月 1 日定为"古典之日"，取的就是《紫式部日记》1008 年十一月一日那一则。'
    line:
      en: '2012: Japan makes 1 November Classics Day, after the diary entry of the fiftieth-day banquet.'
      zh: '2012 年，日本把 11 月 1 日定为"古典之日"，取的就是五十日宴那一则日记。'
