    text:
      en: 'Wang describes the lamp, table and mirror and how changing the lamp’s height made the light reach the mirror again. The year is the setting, not a date established for the observation.'
      zh: '王贞仪记述灯、桌与镜子，并说提灯后光又照到了镜上。所标年份是场景年代，未用来给演示定年。'
