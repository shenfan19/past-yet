    level: usable
    use: [story, wiki]
    sources: [chaco_sun_watchers_measurement]
    text:
      en: 'The study records a midday light pattern on the Fajada Butte spirals. Its original use and the relative timing of the stones and markings are separate questions.'
      zh: '研究记有法哈达孤丘螺旋刻纹上的正午光影。原始用途以及刻纹与石板的先后，是另外的问题。'
