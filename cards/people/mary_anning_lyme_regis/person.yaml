  fact: plesiosaur
  quote_line: '玛丽·安宁在莱姆里吉斯的崖下找到一具近乎完整的骨架，脖子比身子还长。'
  regret_choice: '派力气大的去，退潮时跟得上，崖下的弯线却分不清；派爱说话的去，买主面前把名字说清了，崖下那趟没人陪。'
  bookend: '从一个十三岁女孩挖出的骨架开始，以她死时仍然拮据收尾。'
  share_line: '1823 年冬天，我在莱姆里吉斯的崖下帮人分清哪道线是骨头。'
  share_number: '47'
  knowing: 'pterosaur'
  near: 'plesiosaur, sketch'
  lever: 'p2, p3'
  missed: 'death'
  brought: 'relic'
