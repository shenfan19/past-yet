quotes:
  anning_rough_sketch:
    order: 1
    tier: full
    date: '1823-12-26'
    checked: official_record
    sources: [anning_plesiosaurus_letter_1823]
    original: en
    text:
      en:
        who: 'Mary Anning'
        quote: 'I have endeavoured in a rough sketch to give you some idea of what it is like.'
        occasion: 'letter from Lyme accompanying her drawing of the plesiosaur'
      zh:
        who: '玛丽·安宁'
        quote: '我试着画了一张草图，好让您大致知道它是什么样子。'
        occasion: '从莱姆寄出的信，附她亲绘的蛇颈龙草图'
      zh-Hant:
        who: '瑪麗·安寧'
        quote: '我試著畫了一張草圖，好讓您大致知道它是什麼樣子。'
        occasion: '從萊姆寄出的信，附她親繪的蛇頸龍草圖'
      fr:
        who: 'Mary Anning'
        quote: 'J''ai essayé, par une esquisse, de vous donner une idée de ce que c''est.'
        occasion: 'lettre de Lyme accompagnant son dessin du plésiosaure'
      es:
        who: 'Mary Anning'
        quote: 'Me he esforzado en un boceto para darle una idea de cómo es.'
        occasion: 'carta de Lyme que acompaña a su dibujo del plesiosaurio'
      ja:
        who: 'メアリー・アニング'
        quote: 'それがどのようなものかを少しでも理解していただくために、大まかなスケッチを作成しました。'
        occasion: '首長竜の絵を添えたライムからの手紙'
      ko:
        who: '메리 애닝'
        quote: '나는 당신에게 그것이 어떤 것인지에 대한 아이디어를 제공하기 위해 대략적인 스케치를 시도했습니다.'
        occasion: '수장룡 그림과 함께 라임이 보낸 편지'
      ru:
        who: 'Мэри Эннинг'
        quote: 'Я постарался в общих чертах дать вам некоторое представление о том, на что это похоже.'
        occasion: 'письмо Лаймы, сопровождающее ее рисунок плезиозавра'
  anning_old_passion:
    order: 2
    tier: none
    date: '1829-02-25'
    checked: official_record
    sources: [anning_murchison_letter_1829]
    original: en
    text:
      en:
        who: 'Mary Anning'
        quote: 'I soone lost the green sand mania and returned to my old passion for bones'
        occasion: 'letter to Charlotte Murchison, dated 25 February, assigned to 1829 by the Geological Society'
      zh:
        who: '玛丽·安宁'
        quote: '我很快就不再迷恋绿砂，又回去找那些我一直喜欢的骨头。'
        occasion: '致夏洛特·默奇森的信，署 2 月 25 日，伦敦地质学会推定为 1829 年'
      zh-Hant:
        who: '瑪麗·安寧'
        quote: '我很快就不再迷戀綠砂，又回去找那些我一直喜歡的骨頭。'
        occasion: '致夏洛特·默奇森的信，署 2 月 25 日，倫敦地質學會推定為 1829 年'
      fr:
        who: 'Mary Anning'
        quote: 'J''ai vite perdu la manie du sable vert et je suis revenu à mon ancienne passion pour les os'
        occasion: 'lettre à Charlotte Murchison, datée du 25 février, attribuée à 1829 par la Geological Society'
      es:
        who: 'Mary Anning'
        quote: 'Pronto perdí la manía de la arena verde y volví a mi antigua pasión por los huesos.'
        occasion: 'carta a Charlotte Murchison, fechada el 25 de febrero, asignada a 1829 por la Sociedad Geológica'
      ja:
        who: 'メアリー・アニング'
        quote: '私はすぐに緑の砂へのマニアを失い、骨に対する昔の情熱に戻りました。'
        occasion: 'シャーロット・マーチソンへの手紙、2月25日付、地質学会により1829年に割り当てられた'
      ko:
        who: '메리 애닝'
        quote: '나는 곧 녹색 모래 매니아를 잃었고 뼈에 대한 옛 열정으로 돌아왔습니다.'
        occasion: '지질학회가 1829년에 배정한 2월 25일자 샬롯 머치슨에게 보낸 편지'
      ru:
        who: 'Мэри Эннинг'
        quote: 'Вскоре я потерял манию зеленого песка и вернулся к своей старой страсти к костям.'
        occasion: 'письмо Шарлотте Мерчисон от 25 февраля, отнесенное Геологическим обществом к 1829 году.'
