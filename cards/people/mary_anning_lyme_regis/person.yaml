    text:
      en:
        name: "Bones in the cliff"
        place: "Lyme Regis"
        figure: "Mary Anning"
        story: 'In about 1811 Mary Anning''s brother Joseph found the skull of an ichthyosaur in the cliffs at Lyme Regis, and in November 1812 Mary dug out its skeleton, some five metres long. In December 1823 she found the first complete skeleton of a plesiosaur, and in December 1828 the first pterosaur found in England. She died in 1847, aged 47, still short of money; she was seldom credited in the papers written on her finds.'
        relic: "An ammonite"
        relic_desc: "A coiled fossil shell split from the blue lias."
        points:
          p1: 'On 10 December, keep the plesiosaur under the cliff safe, and get it out whole before the next fall and the returning tide'
          p2: 'Help her count and draw the long neck bone by bone, so that the sketch sent to London stands up to questions'
          p3: 'Let her know in her lifetime that these bones will one day carry her name'
        points_fail:
          p1: 'The returning tide carried off half of the skeleton, and in this branch there is no first complete plesiosaur.'
          p2: 'In this branch the sketch of 26 December went off as it was, with no second check marked on the neck bones.'
          p3: 'In this branch she still did not know she would be remembered, and nobody told her that winter.'
        shift:
          p1:
            was: 'In December 1823 Mary Anning took a whole skeleton out from under the cliff, its neck longer than its body.'
          p2:
            was: 'On 26 December 1823 she sent her drawing of the plesiosaur to London as it was.'
            now: 'Every neck bone on the sketch that reached London had its number, and when the doubts came later, the drawing already held the answer.'
          p3:
            was: 'Mary Anning died in 1847 at forty seven, still short of money, and the papers on what she found seldom gave her name.'
            now: 'Someone told her that winter that the bones she dug out would one day carry her name in a London museum, and that a statue of her would stand by the sea at Lyme Regis.'
        vignettes:
          stone: '{staff} follows a crack past the neck of the skeleton until the line leaves the bones, and lifts the pencil there.'
          vertebrae: '{staff} counts the neck from the other end, and where the two counts do not meet, leaves a bracket instead of adding a bone.'
          pose: '{staff} turns a copy of the sketch until the head can be found without help, and writes under it who found it.'
        story_prose:
          opening:
            - 'Lyme Regis, winter 1823. After the tide has gone out, Mary Anning sees that the skeleton under the cliff has a neck longer than its body. Bringing the bones up is not enough. The people in London will look at it through a sheet of paper, and someone has to follow the crack in the rock and count the neck bones one by one before they can make out what she saw, standing under the cliff.'
            - 'In history, Anning later sent the sketch away. The skeleton became famous, but she was seldom named in the papers written on these finds. This trip arrives before that drawing is sent.'
            - 'Three kinds of people can help on this trip: someone who can do heavy work under the cliff and get the skeleton out before the tide returns, someone who can count and draw and tell bone from rock, and someone willing to sit down and talk with her, in words that reach her.'
          outcomes:
            all: 'On the sketch that went to London that winter, a row of small numbers ran beside the long neck, and in the corner was her name, in her own hand.'
            p3: 'The letter went to London as before. The name in the corner of the drawing she had written there herself.'
            p2: 'After the sketch reached London someone had doubts, took the drawing, and following the row of numbers counted down from below the skull one bone at a time.'
            p1: 'That winter a whole skeleton lay in the little house at the top of the cliff, its neck longer than its body.'
          none: 'On the day the letter went, Anning sat alone over the sketch until late. The long neck had been drawn and rubbed out so often that the paper had gone fuzzy.'
          desync: 'When the tide covered the foot of the cliff, part of the skeleton had not yet been taken out. The last thing {staff} saw before the recall was the water closing over that neck bone.'
          not_admitted: '{staff} never got down under the cliff with Anning. At low tide there was only her at the foot of it, a hammer in her hand.'
          points:
            p1: 'Before the tide came back, Anning and {staff} lifted the long-necked skeleton out piece by piece, wrapped the pieces in old newspaper and carried them up to the top of the cliff. The last piece had only just left when the waves covered the stretch of cliff foot behind them. Anning looked back once; there was nothing on the water but foam.'
            p2:
              class_learned: 'While she drew the sketch, {staff} went by the rule of a field notebook and called out the bones one by one from the other end, writing each down as it was called. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.'
              class_craft: 'While she drew the sketch, {staff} first traced the outline of the bones lightly along the crack, the way one traces a pattern, then counted the long neck from the other end. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.'
              else: 'While she drew the sketch, {staff} helped her count the long neck from the other end. Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.'
            p3: 'Before the sketch was sent, {staff} spoke of London many years on: a museum there would show the bones she had dug from under the cliff, with the name of Mary Anning beside them, and a statue of her would stand by the sea at Lyme. Anning listened without looking up. The pen in her hand stopped a moment in the corner of the drawing, and there she wrote her own name.'
          excerpts:
            p3: 'Anning listened without looking up. The pen in her hand stopped a moment in the corner of the drawing, and there she wrote her own name.'
            p2: 'Where the counts did not agree, Anning looked along the crack a long time, until she could tell where the edge of the bone was. In the end every neck bone had its number, and the small figures ran down the length of the long neck, all the way to below the skull.'
            p1: 'The last piece had only just left when the waves covered the stretch of cliff foot behind them. Anning looked back once; there was nothing on the water but foam.'
      zh:
        name: "崖壁里的骨头"
        place: "莱姆里吉斯"
        figure: "玛丽·安宁"
        story: '约 1811 年，玛丽·安宁的哥哥约瑟夫在莱姆里吉斯的海崖里找到一个鱼龙头骨，1812 年 11 月，玛丽把五米来长的骨架挖了出来。1823 年 12 月，她找到第一具完整的蛇颈龙骨架；1828 年 12 月，又找到英格兰发现的第一具翼龙。她 1847 年去世，年仅 47 岁，一直手头拮据；写她那些发现的论文里，很少提到她的名字。'
        story_prose:
          opening:
            - '1823 年冬，莱姆里吉斯。退潮后，玛丽·安宁看见崖下那具骨架的脖子比身子还长。光把骨头带上来还不够。伦敦的人隔着一张纸看它，要有人沿着岩缝把颈椎一节节数出来，他们才看得懂她站在崖下看见了什么。'
            - '史实里，安宁后来把草图寄了出去。骨架出了名，她却很少在写这些发现的论文里被署名。这一趟赶在那张图寄出去以前。'
            - '这一趟用得上三种人：能在崖下干重活、赶在回潮前取出骨架的人，会数会画、分得清骨头和岩石的人，肯坐下来同她说话、说得进她心里的人。'
          outcomes:
            all: '那个冬天寄往伦敦的草图上，长脖子旁排着一列小小的编号，图角是她自己写的名字。'
            p3: '那封信照旧寄往伦敦。图角那个名字，是她自己写上去的。'
            p2: '草图寄到伦敦以后，有人起了疑心，拿着图顺着那列编号，从头骨底下一节一节数了下去。'
            p1: '那个冬天，崖顶的小屋里摆着一整具骨架，脖子比身子还长。'
          none: '寄信那天，安宁一个人对着草图坐到很晚。那条长脖子画了又擦，纸面起了毛。'
          desync: '潮水盖过崖脚时，骨架还有一截没取下来。{staff}被召回前，最后看见的是水淹过那节颈骨。'
          not_admitted: '{staff}没能跟安宁走到崖下。退潮的时候，崖脚只有她一个人，提着一把锤子。'
          points:
            p1: '潮水尚未回来，安宁和{staff}把长颈的骨架一块块起出来，用旧报纸包好，抬上崖顶。最后一块刚离开，身后那片崖脚就被浪盖住了。安宁回头看了一眼，水面上只剩泡沫。'
            p2:
              class_learned: '画草图时，{staff}照野外记录的规矩，从另一头一节一节报数，报一节记一节。数目对不上的地方，安宁顺着岩缝看了很久，直到认清骨头的边在哪儿。最后每一节颈椎都有了号，小小的数字沿着那条长脖子排下去，一直排到头骨底下。'
              class_craft: '画草图时，{staff}像描样稿那样，先沿着岩缝把骨头的轮廓轻轻勾出来，再从另一头数那条长脖子。数目对不上的地方，安宁顺着岩缝看了很久，直到认清骨头的边在哪儿。最后每一节颈椎都有了号，小小的数字沿着那条长脖子排下去，一直排到头骨底下。'
              else: '画草图时，{staff}从另一头帮她数那条长脖子。数目对不上的地方，安宁顺着岩缝看了很久，直到认清骨头的边在哪儿。最后每一节颈椎都有了号，小小的数字沿着那条长脖子排下去，一直排到头骨底下。'
            p3: '草图还没寄走，{staff}说起很多年后的伦敦：博物馆里会摆着她从崖下挖出来的骨头，旁边写着玛丽·安宁的名字；莱姆的海边还会立起她的像。安宁听着，没有抬头。手里的笔在图角停了一下，在那里写下了自己的名字。'
          excerpts:
            p3: '安宁听着，没有抬头。手里的笔在图角停了一下，在那里写下了自己的名字。'
            p2: '数目对不上的地方，安宁顺着岩缝看了很久，直到认清骨头的边在哪儿。最后每一节颈椎都有了号，小小的数字沿着那条长脖子排下去，一直排到头骨底下。'
            p1: '最后一块刚离开，身后那片崖脚就被浪盖住了。安宁回头看了一眼，水面上只剩泡沫。'
        relic: "一枚菊石"
        relic_desc: "一枚从蓝色里亚斯岩里敲出来的螺旋形化石。"
        points:
          p1: '12 月 10 日，护住崖下那具蛇颈龙，赶在塌方和回潮之前把它完整取出'
          p2: '帮她把那条长颈一节一节数清、画准，让寄往伦敦的草图经得起查问'
          p3: '让她在生前知道，这些骨头以后会写着她的名字'
        points_fail:
          p1: '那具骨架被回潮卷走了一半，这条分支里没有第一具完整的蛇颈龙。'
          p2: '这条分支里，12 月 26 日的草图照原样寄出，颈椎上没有多一道核对的标记。'
          p3: '这条分支里，她照旧不知道自己会被记住，没有人在那个冬天告诉过她。'
        shift:
          p1:
            was: '1823 年 12 月，玛丽·安宁在崖下取出一整具骨架，脖子比身子还长。'
          p2:
            was: '1823 年 12 月 26 日，她把蛇颈龙的草图照原样寄往伦敦。'
            now: '寄到伦敦的草图上每一节颈椎都标了号，后来那场疑心来时，图上已经有了回答。'
          p3:
            was: '1847 年玛丽·安宁去世，四十七岁，手头一直拮据，写她发现的论文很少提她的名字。'
            now: '那个冬天有人告诉过她，她挖出的骨头以后会在伦敦的博物馆里写着她的名字，莱姆里吉斯的海边会立起她的像。'
        vignettes:
          stone: '{staff}沿裂缝描过骨架的颈部。裂纹越出骨头，仍往岩石里去。走到那处分界，笔尖便抬了起来。'
          vertebrae: '{staff}从另一端数颈骨。两边数不到一起，就在有疑问的地方留了个括号，等下回再看。'
          pose: '{staff}把抄图转了几回，直到从这边望过去也能一下找见头部，才在图下写上发现者的名字。'
text:
  en:
    name: Mary Anning
    text: English fossil collector, 1799 to 1847, of Lyme Regis. From the sea cliffs she dug out the first complete ichthyosaur and plesiosaur skeletons. As a woman of modest means she was seldom credited in scientific papers during her life.
  zh:
    name: 玛丽·安宁
    text: 英国化石采集者，1799 年生，1847 年去世，莱姆里吉斯人。她在海边悬崖挖出了第一批完整的鱼龙和蛇颈龙骨架。作为一个家境普通的女性，她生前很少在科学论文里被署名。
hook: {en: 'Which curve belongs to the skeleton?', zh: '哪一道弯线真是骨头'}
facts:
  ichthyosaur:
    date: '1812-11'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mary_anning_lyme_regis_primary, museum_earth_anning]
    text:
      en: 'Her brother Joseph found the skull of an ichthyosaur in about 1811; in November 1812 Mary dug out its skeleton, some five metres long.'
      zh: '约 1811 年，她的哥哥约瑟夫找到一个鱼龙头骨；1812 年 11 月，玛丽挖出了它五米来长的骨架。'
    line:
      en: 'November 1812: Mary Anning, twelve or thirteen, digs a skeleton five metres long out of the cliff. Her brother had found its skull.'
      zh: '1812 年 11 月，十三岁上下的玛丽·安宁从崖壁里挖出一具五米来长的骨架，头骨是哥哥先找到的。'
      zh-Hant: '1812 年 11 月，十三歲上下的瑪麗·安寧從崖壁裡挖出一具五米來長的骨架，頭骨是哥哥先找到的。'
      fr: 'Novembre 1812 : Mary Anning, douze ou treize ans, déterre un squelette de cinq mètres de long dans la falaise. Son frère avait retrouvé son crâne.'
      es: 'Noviembre de 1812: Mary Anning, de doce o trece años, extrae del acantilado un esqueleto de cinco metros de largo. Su hermano había encontrado su cráneo.'
      ja: '1812年11月：12歳か13歳のメアリー・アニングが、崖から長さ5メートルの骸骨を掘り出す。彼女の兄がその頭蓋骨を発見したのだ。'
      ko: '1812년 11월: 메리 애닝(12~13세)이 절벽에서 5미터 길이의 해골을 파냅니다. 그녀의 오빠가 그 두개골을 발견했습니다.'
      ru: 'Ноябрь 1812 года: Мэри Эннинг, двенадцати или тринадцати лет, выкапывает из скалы скелет длиной пять метров. Ее брат нашел его череп.'
  plesiosaur:
    date: '1823-12-10'
    stay_day: 25
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [anning_plesiosaur_geolsoc]
    text:
      en: 'On 10 December 1823 Mary Anning discovered the first near-complete, articulated plesiosaur skeleton at Lyme Regis.'
      zh: '1823 年 12 月 10 日，玛丽·安宁在莱姆里吉斯发现了第一具近乎完整、关节仍相连的蛇颈龙骨架。'
    line:
      en: '10 December 1823: under the cliffs at Lyme Regis, Mary Anning finds a nearly complete skeleton with a neck longer than its body.'
      zh: '1823 年 12 月 10 日，玛丽·安宁在莱姆里吉斯的崖下找到一具近乎完整的骨架，脖子比身子还长。'
      zh-Hant: '1823 年 12 月 10 日，瑪麗·安寧在萊姆里吉斯的崖下找到一具近乎完整的骨架，脖子比身子還長。'
      fr: '10 décembre 1823 : sous les falaises de Lyme Regis, Mary Anning trouve un squelette presque complet avec un cou plus long que le corps.'
      es: '10 de diciembre de 1823: bajo los acantilados de Lyme Regis, Mary Anning encuentra un esqueleto casi completo con un cuello más largo que el cuerpo.'
      ja: '1823年12月10日：ライム・レジスの崖の下で、メアリー・アニングは体よりも首が長いほぼ完全な骸骨を発見した。'
      ko: '1823년 12월 10일: 라임 레지스(Lyme Regis) 절벽 아래에서 메리 애닝(메리 애닝)은 목이 몸보다 긴 거의 완전한 해골을 발견합니다.'
      ru: '10 декабря 1823 года: под скалами Лайм-Реджиса Мэри Эннинг находит почти полный скелет, у которого шея длиннее тела.'
  sketch:
    date: '1823-12-26'
    stay_day: 41
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [anning_plesiosaurus_letter_1823]
    text:
      en: 'Anning’s letter of 26 December includes a sketch of the skeleton and calls attention to its long neck and small head.'
      zh: '安宁在 12 月 26 日的信里附上骨架草图，特别指出它脖子很长，头却很小。'
    line:
      en: '26 December 1823: Anning writes from Lyme and includes a drawing of the skeleton.'
      zh: '1823 年 12 月 26 日，安宁从莱姆寄出一封信，附了一张骨架草图。'
      zh-Hant: '1823 年 12 月 26 日，安寧從萊姆寄出一封信，附了一張骨架草圖。'
      fr: "26 décembre 1823\_:\_Anning écrit depuis Lyme et inclut un dessin du squelette."
      es: '26 de diciembre de 1823: Anning escribe desde Lyme e incluye un dibujo del esqueleto.'
      ja: '1823年12月26日：アニングはライムから手紙を書き、骸骨の絵も載せた。'
      ko: '1823년 12월 26일: Anning이 Lyme에서 글을 쓰고 해골 그림을 포함합니다.'
      ru: '26 декабря 1823 г.: Эннинг пишет из Лайма и включает рисунок скелета.'
  pterosaur:
    date: '1828-12'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mary_anning_lyme_regis_primary, discover_wildlife_anning]
    text:
      en: 'In December 1828 she found the first pterosaur skeleton found in England, described by William Buckland the next year.'
      zh: '1828 年 12 月，她找到英格兰发现的第一具翼龙骨架，次年由威廉·巴克兰描述发表。'
    line:
      en: 'December 1828: she finds a jumble of bones with a long tail and wings, the first pterosaur found in England.'
      zh: '1828 年 12 月，她找到一堆带长尾和翅膀的骨头，是英格兰发现的第一具翼龙。'
      zh-Hant: '1828 年 12 月，她找到一堆帶長尾和翅膀的骨頭，是英格蘭發現的第一具翼龍。'
      fr: 'Décembre 1828 : elle trouve un fouillis d''os avec une longue queue et des ailes, le premier ptérosaure trouvé en Angleterre.'
      es: 'Diciembre de 1828: encuentra un revoltijo de huesos con una larga cola y alas, el primer pterosaurio encontrado en Inglaterra.'
      ja: '1828 年 12 月: 彼女は、長い尾と翼を持つごちゃ混ぜの骨を発見しました。これはイギリスで最初に発見された翼竜です。'
      ko: '1828년 12월: 그녀는 영국에서 발견된 최초의 익룡인 긴 꼬리와 날개를 가진 뒤죽박죽된 뼈를 발견합니다.'
      ru: 'Декабрь 1828 года: она находит кучу костей с длинным хвостом и крыльями, первого птерозавра, найденного в Англии.'
  death:
    date: '1847'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [discover_wildlife_anning, museum_earth_anning]
    text:
      en: 'She died of breast cancer in 1847, aged 47, still short of money.'
      zh: '她 1847 年因乳腺癌去世，年仅 47 岁，生活一直拮据。'
    note: 'Death: written as a plain fact.'
    line:
      en: '1847: Mary Anning dies, aged 47, still short of money.'
      zh: '1847 年，玛丽·安宁去世，年仅 47 岁，手头一直拮据。'
      zh-Hant: '1847 年，瑪麗·安寧去世，年僅 47 歲，手頭一直拮据。'
      fr: '1847 : Mary Anning décède, à l''âge de 47 ans, toujours à court d''argent.'
      es: '1847: Mary Anning muere, a los 47 años, todavía sin dinero.'
      ja: '1847年：メアリー・アニングが47歳で亡くなるが、まだお金がなかった。'
      ko: '1847년: 메리 애닝(메리 애닝)은 아직 돈이 부족한 47세의 나이로 사망합니다.'
      ru: '1847: Мэри Эннинг умирает в возрасте 47 лет, ей все еще не хватает денег.'
