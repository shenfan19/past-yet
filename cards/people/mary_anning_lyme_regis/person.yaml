    text:
      en:
        name: "Bones in the cliff"
        place: "Lyme Regis"
        figure: "Mary Anning"
        story: 'Mary Anning discovered a complete plesiosaur skeleton at Lyme Regis in December 1823. Her sketch records the remarkably long neck. The 1847 card uses an invented visit to look back at the sketch.'
        relic: "An ammonite"
        relic_desc: "A coiled fossil shell split from the blue lias."
        points:
          p1: 'Distinguish a crack from an outline'
          p2: 'Follow the neck on the sketch without skipping a joint'
          p3: 'Leave a useful copy with the discovery credited'
        vignettes:
          stone: 'The visitor traces a crack as though it were bone. You ask them to keep following it past the neck. When the line leaves the skeleton, they lift their pencil.'
          vertebrae: 'You and the visitor trace the neck from opposite ends. Their counts disagree at the same place. You leave a bracket there instead of silently adding a bone.'
          pose: 'You rotate the copy until the visitor can find the head without your help. They turn it back before writing the specimen''s name below.'
      zh:
        name: "崖壁里的骨头"
        place: "莱姆里吉斯"
        figure: "玛丽·安宁"
        story: '1823 年 12 月，玛丽·安宁在莱姆里吉斯发现一具完整的蛇颈龙骨架，她的草图记下了那条长颈。卡片保留 1847 年，用虚构的访客回看早年的图。'
        relic: "一枚菊石"
        relic_desc: "一枚从蓝色里亚斯岩里敲出来的螺旋形化石。"
        points:
          p1: '分清裂纹和骨骼轮廓'
          p2: '沿着草图找颈部，别漏掉关节'
          p3: '留下一张注明发现者的可用抄图'
        vignettes:
          stone: '访客把一条裂缝描成了骨头。你请他沿线继续往下找。那道线离开骨架时，他抬起了笔。'
          vertebrae: '你和访客从颈部两头相向数，偏偏在同一处数不到一起。你在那里留了括号，没有顺手添上一块骨头。'
          pose: '你转动抄图，直到访客不靠你指也能找出头部。他再把纸转回来，在下面补上标本名。'
text:
  en:
    name: Mary Anning
    text: English fossil collector, 1799 to 1847, of Lyme Regis. From the sea cliffs she dug out the first complete ichthyosaur and plesiosaur skeletons. As a woman of modest means she was seldom credited in scientific papers during her life.
  zh:
    name: 玛丽·安宁
    text: 英国化石采集者，1799 年生，1847 年去世，莱姆里吉斯人。她在海边悬崖挖出了第一批完整的鱼龙和蛇颈龙骨架。作为一个家境普通的女性，她生前很少在科学论文里被署名。
