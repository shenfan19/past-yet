    scene:
      points:
        - {id: p1, kind: hold, req: {"any":[{"job":["builder"]},{"trait":["hardy"]}]}}
        - {id: p2, kind: endure, req: {"stat":{"constitution":5}}}
        - {id: p3, kind: trust, req: {"trait":["kind","sensitive"]}}
      vignettes:
        - {id: mark, traits: [methodical, hardy]}
