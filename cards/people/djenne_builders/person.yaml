        name: "A wall replastered every year"
        place: "Djenne"
        figure: "The mud brick builders of Djenne"
        story: "The people of Djenne raise a tall mosque out of mud brick, and every year before the rains they plaster its wall again together."
        relic: "A mud brick"
        relic_desc: "A hard sun dried brick with bits of rice husk showing where it is broken."
        points:
          p1: "Plaster the mud wall"
          p2: "Carry mud in the blazing sun"
          p3: "Mend the wall with the neighbours"
      zh:
        name: "每年重抹一次的泥墙"
        place: "杰内"
        figure: "杰内的泥砖建造者们"
        story: "杰内的街坊们用泥砖垒起高大的清真寺，每年雨季前一起把墙重新抹一遍。"
        relic: "一块泥砖"
        relic_desc: "一块晒得很硬的泥砖，掰开能看到里面的稻壳。"
        points:
          p1: "抹泥墙"
          p2: "烈日下搬泥浆"
          p3: "同街坊一起修墙"
text:
  en:
    name: "The mud brick builders of Djenne"
    text: "The craftsmen and townspeople of Djenne in West Africa who built and kept up the great mosque in mud brick. Dates and details of the building are given differently, and the community still replasters the wall every year."
  zh:
    name: "杰内的泥砖建造者们"
    text: "西非杰内的工匠和街坊，用泥砖修建和维护城里的大清真寺。年代与建造的细节有不同说法，当地社区至今仍每年重抹墙面。"
