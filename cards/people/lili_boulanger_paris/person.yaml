      zh: '1918 年 3 月 15 日，莉莉·布朗热在塞纳河畔梅齐去世，二十四岁。'
    line:
      en: '15 March 1918: Lili dies at Mézy.'
      zh: '1918 年 3 月 15 日，莉莉在梅齐去世。'
