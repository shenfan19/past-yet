    text:
      en: 'Lili Boulanger had poor health from childhood and was gravely ill in early 1918.'
      zh: '莉莉·布朗热自幼体弱，1918 年初病重。'
    line:
      en: 'Winter 1918: Lili is too weak to write.'
      zh: '1918 年冬，莉莉已虚弱得写不了字。'
  last_work:
    date: '1918'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lili_boulanger_paris_pie_jesu, lili_boulanger_paris_score]
    text:
      en: 'Her last work, for voice, string quartet, harp and organ, was dictated from her sickbed to her sister Nadia.'
      zh: '她的最后一部作品，为人声、弦乐四重奏、竖琴和管风琴而写，是在病床上口述给姐姐娜迪亚记下的。'
    line:
      en: '1918: from her bed Lili dictates her last work to Nadia.'
      zh: '1918 年，莉莉在病床上把最后一部作品口述给娜迪亚。'
