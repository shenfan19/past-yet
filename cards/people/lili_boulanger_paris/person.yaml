    text:
      en:
        name: 'Parts spread across the table'
        place: "Mézy sur Seine"
        figure: "Lili Boulanger"
        story: 'Lili Boulanger was gravely ill in the winter of 1918 at Mézy-sur-Seine. Accounts of her last work describe her dictating Pie Jesu to her sister Nadia. The score calls for voice, string quartet, harp and organ. Lili died on 15 March, aged twenty-four.'
        story_prose:
          opening:
            - 'There are two piles on the music table, the fair copy and the pages waiting for dictation. Nadia has just written down a note when Lili asks her to set the pen down. Through the thin paper it is hard to read the last bar that has been written.'
            - 'During her final illness Lili Boulanger dictated the music for Pie Jesu to her sister Nadia. Lili died on 15 March 1918. Here she can pause at her own pace and have someone read back where she stopped when she wants to continue.'
            - 'Someone who reads music can mark Nadia’s place. Let Lili say when she is ready before reading back the passage.'
          points:
            p1: 'Nadia starts to turn the page. Lili asks her to wait. You put a narrow slip where both of them can see the last bar. The room is quiet for a while. Once Lili speaks, you count back the beats Nadia has marked. Lili changes one note, and Nadia carries on at the same line.'
          outcomes:
            all: 'Lili decides when to continue. The passages she dictated stay on the table, and the later record still marks her death on 15 March.'
            p1: 'Nadia returns to the marked place when Lili is ready. This time Lili does not have to repeat the passage she dictated before the pause.'
          none: 'After the break the sisters still have to find their place. Lili uses some of the time to dictate a passage again.'
          not_admitted: 'Nadia asks the visitor to wait outside and keep the passage quiet. Only the sisters hear the last phrase before they stop.'
          excerpts:
            p1: 'Lili changes one note, and Nadia carries on at the same line.'
        relic: 'A narrow paper marker'
        relic_desc: 'An invented slip marking the bar where the dictation stopped.'
        points:
          p1: 'When Lili asks for a break, mark the place for Nadia and read back the last passage when Lili wants to begin again'
        points_fail:
          p1: 'After stopping, the sisters have to find their place again. Lili spends some of the time she has left that day repeating what she has already given Nadia.'
        shift:
          p1:
            was: 'Accounts of Pie Jesu describe Nadia helping Lili write down the music when Lili was very ill.'
            now: 'In this branch {staff} keeps their place when Lili stops. When she is ready, Nadia reads back the last passage and her sister can begin exactly where she chose to pause.'
        vignettes:
          entry: '{staff} asks Nadia to point to the most recent note before the page is turned. She keeps a finger on that line as she checks the voice above it.'
          visitor: 'A person at the door asks how much music remains. {staff} keeps the question outside while Lili decides whether to rest.'
          stand: '{staff} makes room on the stand for Nadia to put down her pen without covering the score.'
      zh:
        name: '桌上摊着几份声部谱'
        place: "梅齐"
        figure: "莉莉·布朗热"
        story: '1918 年冬，莉莉·布朗热在塞纳河畔梅齐病得很重。关于她最后一部作品的记述写到，她把《Pie Jesu》口述给姐姐娜迪亚。乐谱写给人声、弦乐四重奏、竖琴和管风琴。3 月 15 日，莉莉去世，终年二十四岁。'
        story_prose:
          opening:
            - '谱桌上的纸分成已誊好和还等着口述的两份。娜迪亚刚写下一个音，莉莉请她先把笔放一放。隔着几张薄纸，已经写下的最后一小节还有些看不清。'
            - '莉莉·布朗热病中口述了她生命最后阶段的乐曲《Pie Jesu》，由姐姐娜迪亚记谱。她在 1918 年 3 月 15 日去世。这里能做的是按她自己的节奏暂停，等她要继续时把最后记下的地方还给她。'
            - '会读谱的员工可以陪娜迪亚记位置。等莉莉说想继续时，才念出上一段。'
          points:
            p1: '娜迪亚要顺手翻过去，莉莉说先别。你拿一根窄纸条标在刚才那一节，给两个人都能看见的位置。屋里歇了一会儿，等莉莉先开口，你才把娜迪亚记下的几拍数给她听。莉莉改了一个音，娜迪亚就在原来的那一行接着写。'
          outcomes:
            all: '莉莉自己定了何时继续。桌上留下口述过的乐句，三月十五日的死讯仍进了后来的记录。'
            p1: '等她准备好，娜迪亚从标出的地方继续记谱。这一回，她不用重说暂停前的整段。'
          none: '停了一会儿再看谱时，姐妹要从上面几行找起。莉莉又将刚才说过的一段分开说完。'
          not_admitted: '娜迪亚请来客把脚步放轻，在外面等。休息前最后那一段仍只有姐妹俩听到。'
          excerpts:
            p1: '莉莉改了一个音，娜迪亚就在原来的那一行接着写。'
        relic: '一条夹谱的窄纸'
        relic_desc: '虚构夹条，记口述暂时停在第几小节。'
        points:
          p1: '莉莉想歇一会儿时替娜迪亚标好谱上的位置，再按莉莉的意思念回刚记下的一段'
        points_fail:
          p1: '停下来以后，姐妹俩要重新找口述的位置。莉莉今天剩下的力气，有一部分得花在重复已经说过的地方。'
        shift:
          p1:
            was: '关于《Pie Jesu》的记述写到，莉莉病重时由姐姐娜迪亚帮她记谱。'
            now: '这条分支里，莉莉停下时，{staff}替姐妹俩留好了记号。等莉莉觉得能继续了，娜迪亚念回最后一段，莉莉从自己挑的停顿处接着说。'
        vignettes:
          entry: '{staff}请娜迪亚翻页前指一下刚记的音。她用手指压着那一行，再核上面的声部。'
          visitor: '门口有人问还剩多少谱。莉莉决定是否休息时，{staff}请来人把话先留在外面。'
          stand: '{staff}在谱架上腾出一块地方，让娜迪亚搁笔时不用压住谱纸。'
text:
  en:
    name: Lili Boulanger
    text: French composer, 1893 to 1918. In 1913 she became the first woman to win the Prix de Rome for composition. She had lifelong poor health and died at twenty four.
  zh:
    name: 莉莉·布朗热
    text: 法国作曲家，1893 年生，1918 年去世。1913 年她成为第一位获得罗马大奖作曲奖的女性。她一生体弱，二十四岁去世。
hook: {en: 'When she wants to stop, can they keep her place?', zh: '莉莉想歇一会儿，刚念到哪一小节？'}
