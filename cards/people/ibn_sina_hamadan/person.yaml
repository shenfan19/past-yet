    text:
      en:
        name: 'The last attack of colic'
        place: Hamadan, Persia
        figure: Ibn Sina
        story: 'Ibn Sina finished his five-book Canon of Medicine at Hamadan years before his final journey. In the account continued by his companion al-Juzjani, Ibn Sina suffers repeated attacks of abdominal pain. He dies in 1037 on a journey to Hamadan with the ruler he serves.'
        story_prose:
          opening:
            - 'The party on its way to Hamadan is gathering its bedding. Ibn Sina sets down his papers and asks whether they can wait a little. A companion sees him hold his abdomen and looks around for somewhere he can lie down.'
            - 'The continuation of his biography records recurrent pain near the end of his life. Ibn Sina died in Hamadan in 1037. In this branch you can ask where he wants to stop and have someone stay with him while he rests.'
            - 'Someone with care experience can ask him when he wants to stop. Find a companion he already knows. He and the party can decide how long to wait.'
          points:
            p1: 'Someone asks whether it is time to help him up. You crouch by the blanket and ask where he would like to stop. He points to a shady place farther in, where he will have something to lean against. You ask a companion to pass his things to someone else and sit where Ibn Sina can see him. The next knock gets an answer from inside asking for a little more time.'
          outcomes:
            all: 'On this leg of the trip, the party waits for Ibn Sina to say when he can get up. He still dies after arriving in Hamadan.'
            p1: 'One companion stays to sit with him. Nobody asks him to hurry to catch the luggage already packed.'
          none: 'The others are ready again and there is still nowhere for him to lie down. They have more road ahead.'
          not_admitted: 'One of the party thanks you and asks visitors he has not arranged to see to wait outside. You cannot ask what he wants.'
          excerpts:
            p1: 'The next knock gets an answer from inside asking for a little more time.'
        relic: 'A folded scrap of paper'
        relic_desc: 'A fictional travelling note marking where the party stopped.'
        points:
          p1: 'When the pain returns, ask Ibn Sina where he wants to stop and arrange for someone to stay with him while he rests'
        points_fail:
          p1: 'The party is ready to move again before you have made a place for him to lie down.'
        shift:
          p1:
            was: 'Al-Juzjani’s account describes relapses and Ibn Sina’s death at Hamadan in 1037.'
            now: 'In this branch {staff} makes a place for Ibn Sina to rest when the pain returns. A companion stays with him and takes his reply to the people waiting to set out.'
        vignettes:
          section: '{staff} asks how far they travelled after their last stop and puts the answer on a scrap that can be read back later.'
          sleeve: 'Someone starts to roll up the bedding. {staff} asks them to leave one blanket unfolded until Ibn Sina decides whether to go.'
          afterlife: '{staff} asks who will wait in the room while the others get ready. One companion carries his things back indoors.'
      zh:
        name: '最后一次腹痛'
        place: 波斯哈马丹
        figure: 伊本·西那
        story: '伊本·西那早年在哈马丹写完了五卷《医典》。随行的朱兹贾尼在续传中记下他的腹痛反复发作。1037 年，他随效力的君主前往哈马丹，在那里去世。'
        story_prose:
          opening:
            - '去哈马丹的一行人正在收起铺地的毯。伊本·西那放下手里的纸，问他们能不能再等一会儿。随行人见他把手按在腹部，却一时找不到能躺下的地方。'
            - '续传记伊本·西那晚年腹痛反复，于 1037 年在哈马丹去世。这一趟可以询问他自己的意愿，让同行的人在路上陪他歇息。'
            - '让有照护经验的人去问他什么时候想停，再找他熟悉的同行人陪他。能等多久由他和同行的人商量。'
          points:
            p1: '有人来问是不是该扶他起来。你蹲在毯边问他想在哪里停，他指了指里侧的暗处，说那里不用一直撑着身子。你请同行的人把手里的东西交给别人拿，坐到他能看见的地方。再次有人来敲门时，屋里答了一声还请再等。'
          outcomes:
            all: '这一程里有人等伊本·西那自己说可以起身。后来到了哈马丹，他仍在那里去世。'
            p1: '有人留下来陪他，没有催他赶上已经收好的行李。'
          none: '同行人等得差不多了，仍没能找到方便他躺下的地方。路还要接着走。'
          not_admitted: '随行人替伊本·西那谢过来客，请没约好的人在外头等。你没能问到他的意思。'
          excerpts:
            p1: '再次有人来敲门时，屋里答了一声还请再等。'
        relic: '一张折起的路记'
        relic_desc: '虚构的随行纸条，写着一行人在哪儿停过。'
        points:
          p1: '腹痛再犯时，问伊本·西那想在哪里停下，找个人陪他歇一歇'
        points_fail:
          p1: '一行人又在等着出发，还没腾出能让他躺下的地方。'
        shift:
          p1:
            was: '朱兹贾尼的续传记载伊本·西那的腹痛反复发作，1037 年在哈马丹去世。'
            now: '这条分支里，腹痛再犯时，{staff}给伊本·西那找到了歇脚处。有同伴陪他停下，也替他把回话带给等出发的人。'
        vignettes:
          section: '{staff}问上一次歇脚之后又走了多远，把回答写在一张便于翻查的纸上。'
          sleeve: '有人开始收铺盖。{staff}请他们暂留一张毯，等伊本·西那自己决定何时走。'
          afterlife: '{staff}问大家准备出发时谁留在屋里等。有一位同行人把行李提回里间。'
text:
  en:
    name: Ibn Sina
    text: Persian physician and philosopher, about 980 to 1037, known in Latin as Avicenna. His Canon of Medicine was a standard text in Europe and western Asia for centuries, and he died at Hamadan.
  zh:
    name: 伊本·西那
    text: 波斯医生与哲学家，约 980 年生，1037 年去世，拉丁名阿维森纳。他的《医典》在欧洲和西亚数百年里是标准教材，他在哈马丹去世。
hook: {en: 'The physician who wrote the Canon cannot cure his own colic.', zh: '写《医典》的医生，治不好自己的腹痛。'}
