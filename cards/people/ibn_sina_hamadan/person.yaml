    scene:
      star_rules: 2
      points:
        - {id: p1, kind: care, day: 45, req: {"any":[{"job":["physician","doctor","nurse","paramedic","pharmacist","medical_teacher","caregiver","midwife"],"stat":{"will":5}},{"trait":["kind","patient","methodical"],"stat":{"wit":6,"will":6}}]}}
      vignettes:
        - {id: section, traits: [methodical, curious, scholarly]}
