    text:
      en:
        name: 'The last attack of colic'
        place: Hamadan, Persia
        figure: Ibn Sina
        story: 'Ibn Sina finished his five-book Canon of Medicine at Hamadan years before his final journey. In the account continued by his companion al-Juzjani, Ibn Sina suffers repeated attacks of abdominal pain. He dies in 1037 on a journey to Hamadan with the ruler he serves.'
        relic: 'A practice index strip'
        relic_desc: 'A fictional marker distinguishing two of the five books.'
        points:
          p1: 'When the pain returns, ask Ibn Sina where he wants to stop and arrange for someone to stay with him while he rests'
        points_fail:
          p1: 'The party is ready to move again before you have made a place for him to lie down.'
        shift:
          p1:
            was: 'Al-Juzjani’s account describes relapses and Ibn Sina’s death at Hamadan in 1037.'
            now: 'In this branch {staff} makes a place for Ibn Sina to rest when the pain returns. A companion stays with him and takes his reply to the people waiting to set out.'
        vignettes:
          section: 'Ruqayya sends both requests to the same heading because both mention remedies. You ask her to open the index and point out which entry concerns a single substance and which concerns compounds. She puts one tab on each book. The two people at the table can now look for their entries without waiting for each other.'
          sleeve: 'Yahya has to carry one copy away. Its guide slips will slide out if he tips the board. You help him fold the empty wrapper over the bookmarks while Ruqayya copies the two headings for the reader staying behind. The bench keeps a small index even when the book is gone.'
          afterlife: 'You have seen the five books divided differently in a much later binding. Yahya asks where the first heading begins in this copy. You find its first line and leave the dates of future editions out of his note. You will miss his next reader trying the index from scratch.'
      zh:
        name: '最后一次腹痛'
        place: 波斯哈马丹
        figure: 伊本·西那
        story: '伊本·西那早年在哈马丹写完了五卷《医典》。随行的朱兹贾尼在续传中记下他的腹痛反复发作。1037 年，他随效力的君主前往哈马丹，在那里去世。'
        relic: '一张练习索引条'
        relic_desc: '读书签，区分全书五卷中的两卷。'
        points:
          p1: '腹痛再犯时，问伊本·西那想在哪里停下，找个人陪他歇一歇'
        points_fail:
          p1: '一行人又在等着出发，还没腾出能让他躺下的地方。'
        shift:
          p1:
            was: '朱兹贾尼的续传记载伊本·西那的腹痛反复发作，1037 年在哈马丹去世。'
            now: '这条分支里，腹痛再犯时，{staff}给伊本·西那找到了歇脚处。有同伴陪他停下，也替他把回话带给等出发的人。'
        vignettes:
          section: '鲁卡娅见两张单都提到药物，便指向同个题头。你请她打开索引，指出哪条是单味，哪条是复方。她给两卷各夹一签。桌边的两个人现在可以各找各的条目了。'
          sleeve: '叶海亚得带走一份抄本，板一斜，索引签就会滑掉。你帮他用空封纸把几个签护好，鲁卡娅则替还留在桌边的人另抄两个题头。书带走后，桌上还有一张小索引。'
          afterlife: '你见过后世的装帧，同样五卷却分成不同的册子。叶海亚问，在手里这部抄本哪儿才是第一个题头。你找到开头那行，把后世版本的日子留在纸外。接手人第一次自己试索引，你已经看不到了。'
text:
  en:
    name: Ibn Sina
    text: Persian physician and philosopher, about 980 to 1037, known in Latin as Avicenna. His Canon of Medicine was a standard text in Europe and western Asia for centuries, and he died at Hamadan.
  zh:
    name: 伊本·西那
    text: 波斯医生与哲学家，约 980 年生，1037 年去世，拉丁名阿维森纳。他的《医典》在欧洲和西亚数百年里是标准教材，他在哈马丹去世。
hook: {en: 'The physician who wrote the Canon cannot cure his own colic.', zh: '写《医典》的医生，治不好自己的腹痛。'}
facts:
  death:
    date: '1037'
    stay_day: 52
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [ibn_sina_hamadan_juzjani, ibn_sina_hamadan_dsb]
    text:
      en: 'Ibn Sina suffered repeated attacks of abdominal pain and died at Hamadan in 1037.'
      zh: '伊本·西那的腹痛反复发作，1037 年在哈马丹去世。'
    line:
      en: '1037: Ibn Sina dies at Hamadan.'
      zh: '1037 年，伊本·西那在哈马丹去世。'
  canon:
    date: '1025'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ibn_sina_hamadan_canon]
    text:
      en: 'The catalogue describes composition across several places ending at Hamadan and the division into five books. It distinguishes the second book on single substances from the fifth on compound remedies.'
      zh: '馆方记述《医典》历经多处撰写，在哈马丹完成，全书分五卷，第二卷记单味药，第五卷记复方。'
  date:
    date: '1025'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ibn_sina_hamadan_date]
    text:
      en: 'The guide dates the work to about 1025 and displays the title page of a later copy of Book 1.'
      zh: '解说将作品定在约1025年，并展示后出第一卷抄本的题页。'
bystanders:
  ruqayya:
    invented: true
    text: {en: 'A fictional index maker answering two requests at once.', zh: '虚构索引编写人鲁卡娅，同时收到两项查找请求。'}
  yahya:
    invented: true
    text: {en: 'A fictional messenger who has to carry the copying board away.', zh: '虚构送件人叶海亚，要把抄书板带走。'}
