      ar: {"who":"Ibn Sina","quote":"إن الطب علم يتعرف منه أحوال بدن الإنسان","occasion":"Opening of the Canon of Medicine. The date is an approximate completion year."}
  ibn_sina_hamadan_story_echo_none:
    order: 2
    tier: none
    date: '1025'
    checked: official_record
    sources: [ibn_sina_hamadan_story_echo_source_none]
    original: ar
    text:
      en: {"who":"Ibn Sina","quote":"When a thing has causes, knowledge of it is complete only when those causes are known.","occasion":"Book I, second chapter, on what one needs to know about a condition."}
      zh: {"who":"伊本·西那","quote":"事物若有成因，知道成因，认识才能完备。","occasion":"《医典》第一卷第二章，谈怎样认识身体的状态。"}
      ar: {"who":"Ibn Sina","quote":"والعلم بكل شيء إنما يحصل ويتمّ إذا كان له أسباب يعلم أسبابه","occasion":"Book I, second chapter, on what one needs to know about a condition."}
