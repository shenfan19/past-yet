    text:
      en:
        name: 'The day he reached Paris'
        place: Paris
        figure: Louis Pasteur
        story: 'Joseph Meister was brought to Louis Pasteur in Paris on 6 July 1885, and survived after the team’s rabies vaccination.'
        relic: 'An arrival slip'
        relic_desc: 'An invented record that distinguishes arrival from later news.'
        points:
          p1: 'When Joseph Meister and his mother reach Paris, connect their referral to Dr. Grancher so they can be seen on July 6'
          p2: 'Help the reception desk agree a follow-up time and an address with the family. Keep identifying contact information private'
          p3: 'As more families arrive in autumn, put a contact point in place and have the desk assign someone to answer questions about where and when to be seen'
        points_fail:
          p1: 'The family is sent to wait elsewhere. Grancher does not find the child on his list, and the office recalls the employee.'
          p2: 'After the family leaves, there is no address for a follow-up. Staff have to ask another traveler from the area.'
          p3: 'Visitors get directions by word of mouth. Families arriving at night cannot tell whom to contact.'
        shift:
          p1:
            was: 'Joseph Meister was brought to Pasteur in Paris on July 6, 1885. Dr. Jacques-Joseph Grancher was responsible for treating him.'
          p2:
            was: 'Meister came from Alsace. More people living outside Paris subsequently traveled there seeking help.'
            now: 'Staff can send the family confirmation and pass its reply to the person taking over. The public record retains only the dates that can be checked.'
          p3:
            was: 'After 1885 the number of people seeking help in Paris continued to grow. The dedicated institute was built later.'
            now: 'A staffed reception period gives families a place to leave their details and learn where to wait. Referrals from outside Paris now have a traceable record at the existing site.'
            who: pasteur_paris
            bio: 'The early case involved a family traveling to Paris, researchers and a physician responsible for care. Each had a different part in the visit.'
        vignettes:
          date: 'Claire has copied the day the letter was brought in beside the name in the arrival register. You set the envelope next to the register, and she finds the difference. Both dates stay on the desk, each beside the event it marks.'
          address: 'Émile has offered to take the family’s reply while Claire keeps the register. You give him a narrow slip with just the address he needs. He checks it before leaving and the register stays closed while the visitors wait.'
          future: 'You know this case will be remembered long after the boy leaves. Claire needs a line describing what is known today. You enter the arrival and leave the later news for its own date. The latest envelope is still unopened when your visit ends.'
      zh:
        name: '他抵达巴黎的那一天'
        place: 巴黎
        figure: 路易·巴斯德
        story: '1885年7月6日，约瑟夫·迈斯特被带到巴黎见路易·巴斯德，接受团队的狂犬病疫苗接种后存活。'
        relic: '一张抵达登记副页'
        relic_desc: '登记副页，分开记录抵达与后来的来信。'
        points:
          p1: '约瑟夫·迈斯特和母亲到达巴黎时，把来访经过与可接诊的格朗谢医生对上，护住 7 月 6 日的接诊'
          p2: '帮接诊处给一家人留返回时间与能收到消息的地点，由接手人员核对并另存私密联络信息'
          p3: '秋季来访者增多时，给等候的外地家庭明确联络处，请接诊处安排能答复问路和接待时段的人'
        points_fail:
          p1: '母子被转往另一处等候，格朗谢收到的名单漏了这个孩子，事务所因同步失败召回员工。'
          p2: '家人离开后没有可回访的地址。要取得新消息只好请从同地来的人辗转打听。'
          p3: '不同人只收到口头指路，夜间抵达的家庭不知道该跟哪一处联系。'
        shift:
          p1:
            was: '1885 年 7 月 6 日，迈斯特被带到巴黎见巴斯德，医生雅克－约瑟夫·格朗谢负责接诊和治疗。'
          p2:
            was: '迈斯特来自阿尔萨斯。随后越来越多外地来访者赴巴黎寻求帮助。'
            now: '接诊处可以给一家人寄确认信，回函由接手的人拿到；公开记录里只留能核对的日期。'
          p3:
            was: '1885 年之后赴巴黎求助的人数继续增加。新的专门机构后来才建成。'
            now: '接诊处留出一个有人值守的时段，负责接收来访信息并把候诊地点告诉家属。远地转介在已有机构内也能留下可追查的记录。'
            who: pasteur_paris
            bio: '首位著名接种者由外地赶到巴黎，家人、负责研究的人和具备医疗职责的人员分别参与了这一次就诊。'
        vignettes:
          date: '克莱尔把来信送到的日子抄进了抵达簿。你把信封摆到登记簿旁，她看出了两处不同。两天都留在桌上，各标它真正对应的事。'
          address: '埃米尔愿意代送家人的回信，克莱尔留守登记簿。你递给他一张窄条，只写他要核对的地址。他出门前核过一遍，有旁人等候时，登记簿仍合着。'
          future: '你知道男孩离开许久后，人们还会谈到这个病例。克莱尔要填的是今天确知的事。你记下抵达，将以后到的消息留给它自己的日期。你走时，最新一封信还没拆。'
text:
  en:
    name: Louis Pasteur
    text: French chemist and microbiologist, 1822 to 1895. He studied fermentation and spoilage and developed pasteurisation. In 1885 his team vaccinated Joseph Meister against rabies after a dog bite.
  zh:
    name: 路易·巴斯德
    text: 法国化学家与微生物学家，1822年生，1895年去世。他研究发酵和腐败，发展了巴氏消毒法。1885年，巴斯德团队为被狗咬伤的约瑟夫·迈斯特接种狂犬病疫苗。
