text:
  en:
    name: Louis Pasteur
    text: French chemist and microbiologist, 1822 to 1895. He showed that fermentation and spoilage are caused by microbes, developed pasteurisation, and in 1885 gave the first rabies vaccine to a boy bitten by a rabid dog.
  zh:
    name: 路易·巴斯德
    text: 法国化学家与微生物学家，1822 年生，1895 年去世。他证明发酵和腐败由微生物引起，发明巴氏消毒法，1885 年给一个被疯狗咬伤的男孩注射了第一支狂犬病疫苗。
