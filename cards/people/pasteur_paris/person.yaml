    text:
      en:
        name: 'The summer at Arbois'
        place: Arbois
        figure: Louis Pasteur
        story: 'In the summer of 1859 Pasteur''s eldest daughter Jeanne, nine years old, was staying with her grandfather at Arbois while her father worked in Paris. In September she fell ill with typhoid fever and died there.'
        story_prose:
          opening:
            - 'A short letter from Paris sits by the window of Jeanne’s grandfather’s house in Arbois. Jeanne has not gone into the yard this afternoon. Her grandfather goes to the bedside every so often. From there he can hear when someone comes for the mail.'
            - 'Jeanne stayed with her grandfather in the summer of 1859. In history she died of typhoid in September. In this branch the office’s fictional medical kit can change the course of her illness. Her grandfather may get to write that she is sitting up again.'
            - 'Send a traveller with care experience and the office’s nano kit. Ask her grandfather where he needs help, and stay nearby while he waits for her to wake.'
          points:
            p1: 'Her grandfather moves the chair where he can see the bed. You pass the office kit to the caregiver and let him stay where Jeanne wants him. When she wakes and asks to sit up, he takes out his letter paper and asks what she would like him to add. She asks him to write to Mama first, then thinks of a sentence for Papa.'
          outcomes:
            all: 'Her grandfather writes to say she is recovering. He leaves the short letter beside the one her father sent, ready for the post.'
            p1: 'Jeanne has enough strength to sit up for a while. Her grandfather can write to her parents in the words she used when she woke.'
          none: 'When someone comes for the mail, her grandfather folds the sheet one more time. In history Jeanne did not recover from that illness.'
          not_admitted: 'The family has yet to admit the visitor. The person collecting the mail leaves first, and the letter from Paris remains indoors.'
          excerpts:
            p1: 'She asks him to write to Mama first, then thinks of a sentence for Papa.'
        relic: 'An envelope from Arbois'
        relic_desc: 'A fictional copy of the envelope kept by Jeanne’s grandfather.'
        points:
          p1: 'Bring the office’s medical kit to Jeanne’s grandfather and help him care for her when the fever takes hold'
        points_fail:
          p1: 'The fever gets worse despite her grandfather’s care. Jeanne dies in Arbois.'
        shift:
          p1:
            was: 'September 1859: Pasteur''s eldest daughter Jeanne, nine years old, died of typhoid fever at Arbois, where she was staying with her grandfather.'
            now: 'In this branch Jeanne’s fever breaks after {staff} uses the office’s medical kit. Her grandfather can send her parents word that she is well enough to sit up.'
            who: pasteur_paris
            bio: 'In this branch Pasteur’s eldest daughter Jeanne recovers from typhoid fever at Arbois in 1859.'
        vignettes:
          date: 'The grandfather starts to put the date of the last letter on this one. {staff} sets the two envelopes beside each other and checks the date with him.'
          address: 'Before the courier goes, {staff} reads the Paris address back to the grandfather. The letter stays folded until the family can open it.'
          future: '{staff} places a fresh sheet beside the one brought from Paris. There is room to add the next thing Jeanne says.'
      zh:
        name: '阿尔布瓦的那个夏天'
        place: 阿尔布瓦
        figure: 路易·巴斯德
        story: '1859 年夏，巴斯德在巴黎做研究，九岁的长女让娜住在阿尔布瓦的祖父家。九月她染上伤寒，死在那里。'
        story_prose:
          opening:
            - '从巴黎寄来的一封短信放在阿尔布瓦祖父家的窗边。让娜下午没有去院里，祖父隔一会儿到床边看看，从那里还能听见门外收信的脚步。'
            - '1859 年夏，让娜住在祖父家。史实里，她在九月因伤寒去世。分支里允许事务所带来的虚构医疗箱改变这次病程，让祖父可以写信说她已经坐得起来。'
            - '让有照护经验的人带上事务所的纳米医疗箱。先问祖父需要哪种帮忙，再在旁边陪他等让娜醒过来。'
          points:
            p1: '祖父把椅背挪到能看见床的地方。你把事务所的医疗箱交给照护员工，请祖父留在让娜想让他在的地方。等她醒来想坐起，祖父把信纸拿出来，问她要加哪句话。她让他先写信寄给妈妈，再想一句给爸爸。'
          outcomes:
            all: '祖父寄出一封平安信。信写得很短，夹在爸爸原先寄来的信旁等邮差来取。'
            p1: '让娜慢慢有力气在床边坐一会儿。祖父能把她醒来时自己说的话写给父母。'
          none: '等外头来取信时，祖父把纸重新叠了一次。史实中，让娜没能从那次病里恢复。'
          not_admitted: '家人尚未同意让来客进屋。门外等着送信的人先走了，窗边那封来信仍收在屋里。'
          excerpts:
            p1: '她让他先写信寄给妈妈，再想一句给爸爸。'
        relic: '阿尔布瓦寄信的信封'
        relic_desc: '让娜祖父留在桌上的一只虚构信封。'
        points:
          p1: '等让娜发烧时，带事务所的纳米医疗箱去祖父家，帮祖父照护她'
        points_fail:
          p1: '祖父守在身边，让娜还是越烧越重，最后死在阿尔布瓦。'
        shift:
          p1:
            was: '1859 年 9 月，巴斯德九岁的长女让娜在阿尔布瓦祖父家患伤寒去世。'
            now: '这条分支里，{staff}用上了事务所的纳米医疗箱。让娜退了烧，祖父能给她父母捎信，说她已经有力气坐起来。'
            who: pasteur_paris
            bio: '这条分支里，巴斯德的长女让娜在 1859 年阿尔布瓦的那场伤寒后康复。'
        vignettes:
          date: '祖父差点把上一封信的日期抄到这一封。{staff}将两个信封并排放好，陪他重新核一遍。'
          address: '邮差动身前，{staff}把巴黎的地址念给祖父听。那封信仍折着，留给家人来拆。'
          future: '{staff}在巴黎来信旁放一张干净纸。等让娜再说话，那里还有地方可写。'
text:
  en:
    name: Louis Pasteur
    text: French chemist and microbiologist, 1822 to 1895. He studied fermentation and spoilage and developed pasteurisation. Two of his daughters died of typhoid fever, Jeanne in 1859 and Cécile in 1866. In 1885 his team vaccinated Joseph Meister against rabies after a dog bite.
  zh:
    name: 路易·巴斯德
    text: 法国化学家与微生物学家，1822 年生，1895 年去世。他研究发酵和腐败，发展了巴氏消毒法。他有两个女儿死于伤寒，让娜在 1859 年，塞西尔在 1866 年。1885 年，巴斯德团队为被狗咬伤的约瑟夫·迈斯特接种狂犬病疫苗。
