    text:
      en:
        name: 'The summer at Arbois'
        place: Arbois
        figure: Louis Pasteur
        story: 'In the summer of 1859 Pasteur''s eldest daughter Jeanne, nine years old, was staying with her grandfather at Arbois while her father worked in Paris. In September she fell ill with typhoid fever and died there.'
        relic: 'An arrival slip'
        relic_desc: 'An invented record that distinguishes arrival from later news.'
        points:
          p1: 'When the typhoid fever takes hold, nurse Jeanne through it and cure her'
        points_fail:
          p1: 'As in history the fever does not break. Jeanne dies at Arbois in September.'
        shift:
          p1:
            was: 'September 1859: Pasteur''s eldest daughter Jeanne, nine years old, died of typhoid fever at Arbois, where she was staying with her grandfather.'
            now: 'The fever broke and Jeanne got well. In the autumn she went back to her parents in Paris.'
            who: pasteur_paris
            bio: 'In this timeline Pasteur''s eldest daughter Jeanne came through the typhoid fever of 1859 at Arbois and grew up with her brother and sisters.'
        vignettes:
          date: 'Claire has copied the day the letter was brought in beside the name in the arrival register. You set the envelope next to the register, and she finds the difference. Both dates stay on the desk, each beside the event it marks.'
          address: 'Émile has offered to take the family’s reply while Claire keeps the register. You give him a narrow slip with just the address he needs. He checks it before leaving and the register stays closed while the visitors wait.'
          future: 'You know this case will be remembered long after the boy leaves. Claire needs a line describing what is known today. You enter the arrival and leave the later news for its own date. The latest envelope is still unopened when your visit ends.'
      zh:
        name: '阿尔布瓦的那个夏天'
        place: 阿尔布瓦
        figure: 路易·巴斯德
        story: '1859 年夏，巴斯德在巴黎做研究，九岁的长女让娜住在阿尔布瓦的祖父家。九月她染上伤寒，死在那里。'
        relic: '一张抵达登记副页'
        relic_desc: '登记副页，分开记录抵达与后来的来信。'
        points:
          p1: '伤寒烧起来的时候，守着让娜照护，治好她'
        points_fail:
          p1: '高烧照史实没有退下去，让娜九月死在阿尔布瓦。'
        shift:
          p1:
            was: '1859 年 9 月，巴斯德九岁的长女让娜在阿尔布瓦祖父家患伤寒去世。'
            now: '烧退了，让娜病好起来，秋天回到巴黎爸爸妈妈身边。'
            who: pasteur_paris
            bio: '这条时间线里，巴斯德的长女让娜在 1859 年阿尔布瓦的那场伤寒里活了下来，和弟弟妹妹一起长大。'
        vignettes:
          date: '克莱尔把来信送到的日子抄进了抵达簿。你把信封摆到登记簿旁，她看出了两处不同。两天都留在桌上，各标它真正对应的事。'
          address: '埃米尔愿意代送家人的回信，克莱尔留守登记簿。你递给他一张窄条，只写他要核对的地址。他出门前核过一遍，有旁人等候时，登记簿仍合着。'
          future: '你知道男孩离开许久后，人们还会谈到这个病例。克莱尔要填的是今天确知的事。你记下抵达，将以后到的消息留给它自己的日期。你走时，最新一封信还没拆。'
text:
  en:
    name: Louis Pasteur
    text: French chemist and microbiologist, 1822 to 1895. He studied fermentation and spoilage and developed pasteurisation. Two of his daughters died of typhoid fever, Jeanne in 1859 and Cécile in 1866. In 1885 his team vaccinated Joseph Meister against rabies after a dog bite.
  zh:
    name: 路易·巴斯德
    text: 法国化学家与微生物学家，1822 年生，1895 年去世。他研究发酵和腐败，发展了巴氏消毒法。他有两个女儿死于伤寒，让娜在 1859 年，塞西尔在 1866 年。1885 年，巴斯德团队为被狗咬伤的约瑟夫·迈斯特接种狂犬病疫苗。
