text:
  en:
    name: Nicolaus Copernicus
    text: Polish astronomer and canon, 1473 to 1543, who worked at Frombork. His book On the Revolutions of the Heavenly Spheres, printed in 1543, put the sun at the centre of the planets. He is said to have received the first printed copy on his deathbed.
  zh:
    name: 哥白尼
    text: 波兰天文学家与教士，1473 年生，1543 年去世，在弗龙堡工作。他的《天体运行论》于 1543 年印行，把太阳放在行星运行的中心。据说他在临终前才拿到第一本印好的书。
