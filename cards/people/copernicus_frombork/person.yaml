    text:
      en:
        name: The Sun at the centre
        place: Frombork, Poland
        figure: Nicolaus Copernicus
        story: 'In 1539 the young mathematician Rheticus came to Frombork and urged Nicolaus Copernicus to publish his book. In 1543 De revolutionibus, in which the Earth turns and goes round the Sun, was printed in Nuremberg, with an unsigned address to the reader at its front. Copernicus had been ill since the end of 1542 and died in Frombork on 24 May 1543. His friend Tiedemann Giese later wrote that the printed book reached him only on the day he died.'
        story_prose:
          opening:
            - 'Frombork, Poland, spring 1543. Nicolaus Copernicus has been ill since the end of last year. The book he has worked on for decades, On the Revolutions, is being printed at Nuremberg; in it the earth turns on its axis and travels around the sun. Four years ago the young mathematician Rheticus came here from Wittenberg and urged him to have it printed.'
            - 'In history, the book came off the press at Nuremberg with an unsigned address To the Reader at the front. His friend Tiedemann Giese wrote later that the printed book reached him only on the day he died; on 24 May he died at Frombork. In July Giese asked Rheticus to pass a letter asking for a corrected edition to the city council of Nuremberg. In this branch, a fisherman in the village at the foot of the hill mends nets, and a servant of the house carries water up to the sickroom every day.'
            - 'Several kinds of people can help on this trip: someone who knows nursing and can keep a sickbed, or someone strong enough on the road to carry a book a long way; someone who knows papers and can tell an autograph from a copy; and someone careful enough to make an errata sheet.'
          outcomes:
            all: 'The book that came in early May stayed by his bed afterwards. That summer the copies lent out nearby each carried an errata sheet, and the autograph manuscript, wrapped in cloth and locked in the cupboard, later passed into Giese’s hands.'
            p3: 'The book stayed by his bed afterwards, title page up. A few weeks later he died at Frombork.'
            p2: 'That summer the copies lent out nearby each carried an errata sheet, its corners curling from being turned. The answers of the printers elsewhere were later kept in the same file.'
            p1: 'The autograph manuscript, wrapped in cloth, later passed into Giese’s hands, and from him to Rheticus. Centuries later it was in the Jagiellonian Library in Kraków.'
          none: 'Around 24 May the printed books reached Frombork. The sickroom window stood open a crack, and the servant with the water stood a while at the door and did not go in.'
          desync: 'The papers in the study were muddled, the two piles of working papers went in with the copy meant for the printer, and no one could say where the autograph was. {staff} was recalled by the office before Giese came.'
          not_admitted: '{staff} never got up the hill into the house, and spent a few days mending nets in the fishing village below. Up on the hill one window stayed lit at night.'
          points:
            p1:
              class_lettered: 'Late in May the papers in the study next to the sickroom were piling up in disorder. {staff} went by the method of an archivist, counted the autograph manuscript and the two piles of working papers page by page, entered them separately in a ledger, wrapped the autograph in cloth and locked it alone in a cupboard. The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.'
              else: 'Late in May the papers in the study next to the sickroom were piling up in disorder. {staff} sat up in the study several nights running, counted the autograph manuscript and the two piles of working papers page by page, wrote them down separately, wrapped the autograph in cloth and locked it alone in a cupboard. The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.'
            p2: 'At the end of July Giese wrote to Rheticus, asking him to pass a letter requesting a corrected edition to the city council of Nuremberg, and no answer would come for some time. {staff} went through the book page by page against the manuscript as a proofreader would, and made an errata sheet showing on which page the author’s own preface stood, and that the address To the Reader at the front was not in the manuscript. The sheet was copied several times and slipped into the copies already lent out nearby. Whoever opened the cover saw that sheet first.'
            p3:
              class_medical: 'Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} kept the bedside as nursing requires, gave him water on time, turned him, kept the fire in the room from going out, and waited for the book from Nuremberg. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.'
              class_travel: 'Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} went south on the road, met the cart from Nuremberg halfway, wrapped one printed copy in a coat, and brought it back to Frombork travelling day and night. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.'
              else: 'Early in May Copernicus lay in his sickbed at Frombork, awake less and less. {staff} waited outside the sickroom for days, and when the books arrived took one out before the bale was even unpacked and carried it upstairs in both hands. When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.'
          excerpts:
            p3: 'When the book reached his bed, he was awake. He opened it on the blanket, moved his finger slowly along the title on the first page, and let it rest a long time on his own name.'
            p1: 'The receipt was written, headed “For Tiedemann Giese”, folded in two and weighted down with the cupboard key at the corner of the desk. Next door the servant went softly into the sickroom with the water, and came out again.'
            p2: 'The sheet was copied several times and slipped into the copies already lent out nearby. Whoever opened the cover saw that sheet first.'
        relic: A brass quadrant
        relic_desc: A quarter circle for measuring the height of stars.
        points:
          p1: 'While Frombork can still inventory the papers, list the autograph of De revolutionibus apart from the working sheets and leave Giese a receipt for the handover'
          p2: 'While Giese writes asking for a corrected edition, slip an errata sheet into each copy lent out nearby, saying on which page the author’s own preface stands and that the address To the Reader at the front is not in his manuscript'
          p3: 'Bring him the printed De revolutionibus while he is still clear in mind, so that he knows the book is in print'
        points_fail:
          p1: 'Two bundles from the desk are mistaken for the copy already sent to the printer. The original never reaches Giese, and the office recalls the employee.'
          p2: 'Giese can only wait for the printer and the council far away, and the readers nearby still meet the address To the Reader first when they open the book.'
          p3: 'The printed book reached his hands only on 24 May, the day he died.'
        shift:
          p1:
            was: 'In 1543 the Nuremberg edition was printed from a copy. Copernicus’s autograph survived separately and later passed through Tiedemann Giese to Rheticus.'
          p2:
            was: 'In July 1543 Giese asked Rheticus to forward a letter to the Nuremberg council requesting a revised edition. The unsigned text was already circulating in the 1543 first edition.'
            now: 'The copies sent out nearby carry a correction slip. The next reader can use it to check the autograph, and the printer’s eventual response is filed with the same record.'
          p3:
            was: 'On 24 May 1543 Copernicus died in Frombork. Giese later wrote that the finished book reached him only on the day of his death.'
            now: 'In early May the printed book was at his bedside, and he held it while he was still clear in mind. A few weeks later he died in Frombork.'
            who: copernicus_frombork
            bio: 'Copernicus received the printed De revolutionibus some weeks before he died, and knew that the book he had worked on for decades was in print.'
        vignettes:
          preface: '{staff} opens a printed copy. The unsigned address at the front says the book''s account is only a supposition convenient for reckoning. {staff} knows it will be some fifty years before Kepler makes known who wrote it, and closes the book with a finger still on that page.'
          window: '{staff} keeps the water hot outside the sickroom. The people inside say the old man hardly knows anyone now, so {staff} pushes the window open a crack to let in the spring air.'
          nets: '{staff} helps the fishermen at the foot of the hill mend their nets with the Vistula Lagoon in view. A fisherman says that up on the hill there is an old canon who watches the stars at night.'
      zh:
        name: 太阳在中心
        place: 波兰弗龙堡
        figure: 哥白尼
        story: '1539 年，年轻的数学家雷蒂库斯来到弗龙堡，劝尼古拉·哥白尼把书付印。1543 年，《天体运行论》在纽伦堡印成，书中地球自转并绕太阳运行，卷首多了一篇不署名的《告读者》。哥白尼从 1542 年底起一直病着，1543 年 5 月 24 日在弗龙堡去世。他的朋友蒂德曼·吉泽后来写信说，印好的书到他去世那天才送到他手上。'
        story_prose:
          opening:
            - '1543 年春，波兰弗龙堡。尼古拉·哥白尼从去年年底起一直病着。他写了几十年的《天体运行论》正在纽伦堡付印，书里地球自转，绕着太阳运行。四年前，年轻的数学家雷蒂库斯从维滕贝格来到这里，劝他把书付印。'
            - '史实里，书在纽伦堡印成，卷首多了一篇不署名的《告读者》。他的朋友蒂德曼·吉泽后来写信说，印好的书到他去世那天才送到他手上；5 月 24 日，他在弗龙堡去世。7 月，吉泽请雷蒂库斯把要求改版的信转交纽伦堡市议会。在这条分支里，山脚的渔村有个补网的渔夫，家里有个仆役，天天往病房里送水。'
            - '这一趟用得上几种人：懂护理、守得住病床的人，或者腿脚硬朗、赶得了远路送书的人；懂文书、分得清亲笔原稿和抄件的人；心细、做得出一张勘误页的人。'
          outcomes:
            all: '五月初送到的那本书，后来一直放在他床头。那年夏天，附近借出去的几本书里都夹着一张勘误页；那部亲笔原稿包着布，锁在柜子里，后来交到了吉泽手上。'
            p3: '那本书后来一直放在他床头，扉页朝上。几周以后，他在弗龙堡去世。'
            p2: '那年夏天，附近借出去的几本书里都夹着一张勘误页，纸角被翻得卷了起来。外地印坊的回信，后来也收进了同一个档案夹。'
            p1: '那部亲笔原稿包着布，后来交到了吉泽手上，又从他手里到了雷蒂库斯那里。几百年后，它收进了克拉科夫的雅盖隆图书馆。'
          none: '5 月 24 日前后，印好的书送到了弗龙堡。病房的窗开着一条缝，送水的仆役在门口站了一会儿，没有进去。'
          desync: '书房里的纸收拾乱了，两叠工作纸混进了要交给印坊的那份抄本，亲笔原稿不知去向。{staff}没等到吉泽来，就被事务所召了回来。'
          not_admitted: '{staff}没能上山进那栋房子，只在山脚的渔村帮人补了几天网。山上那扇窗，夜里一直亮着灯。'
          points:
            p1:
              class_lettered: '五月下旬，病房隔壁的书房里，桌上的纸越堆越乱。{staff}照管档案的办法，把亲笔原稿和两叠工作纸一页页点清，分开记进一本账，原稿用布包好，单独锁进柜子。收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。'
              else: '五月下旬，病房隔壁的书房里，桌上的纸越堆越乱。{staff}一连几夜守在书房，把亲笔原稿和两叠工作纸一页页点清，分开记下，原稿用布包好，单独锁进柜子。收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。'
            p2: '七月底，吉泽写信给雷蒂库斯，请他把要求改版的信转交纽伦堡市议会，回音一时还等不来。{staff}照校书的规矩，对着原稿一页页查过，写成一张勘误页，列明作者自己的序言在哪一页，卷首那篇《告读者》原稿里没有。勘误页抄了几份，夹进附近先借出去的那几本书。借书的人翻开封面，先看见的就是那张纸。'
            p3:
              class_medical: '五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}照护理的规矩守在床边，按时喂水，替他翻身，屋里的炉火不让它灭，等着纽伦堡来的书。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。'
              class_travel: '五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}往南赶路，在半道截住从纽伦堡来的货车，把一本印好的书裹进外衣，日夜兼程送回弗龙堡。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。'
              else: '五月初，哥白尼躺在弗龙堡的病床上，醒着的时候越来越少。{staff}在病房外守了好些天，书一到，没等整包拆完，就先取出一本，双手捧着上了楼。书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。'
          excerpts:
            p3: '书送到床前时，他正醒着。他把书摊在被子上，手指顺着扉页上的书名慢慢移过去，在自己的名字那里停了很久。'
            p1: '收执写好了，抬头写着“交蒂德曼·吉泽”，折成两折，用柜子的钥匙压在桌角。隔壁病房里，送水的仆役轻手轻脚地进去，又出来了。'
            p2: '勘误页抄了几份，夹进附近先借出去的那几本书。借书的人翻开封面，先看见的就是那张纸。'
        relic: 一个黄铜象限仪
        relic_desc: 四分之一圆，用来量星星的高度。
        points:
          p1: '趁弗龙堡还来得及清点，把《天体运行论》的亲笔原稿和工作纸分开记账，给后来接手的吉泽留一张收执'
          p2: '吉泽去信催印坊改版的这段日子里，给附近借出的几本书各夹一张勘误页，写明作者自己的序言在哪一页，卷首那篇《告读者》原稿里没有'
          p3: '趁他神志还清楚，把印好的《天体运行论》送到他手里，让他知道这本书印成了'
        points_fail:
          p1: '收拾桌上纸张时，两叠工作纸被当作已经交给印坊的那份抄本处理。亲笔原稿没有交到吉泽手上，事务所因同步失败召回员工。'
          p2: '吉泽只能等外地的印坊和市议会回信，附近读这本书的人，翻开先读到的还是那篇《告读者》。'
          p3: '印好的书送到他手上那天，正是他去世的 5 月 24 日。'
        shift:
          p1:
            was: '1543 年，纽伦堡印本以抄本为底，哥白尼的亲笔原稿另存，后来经蒂德曼·吉泽传至雷蒂库斯。'
          p2:
            was: '1543 年 7 月，吉泽请雷蒂库斯把要求改版的信转交纽伦堡市议会，1543 年首版的匿名文字已经随着印本流通。'
            now: '附近几份先借出的书都补上一张勘误页。新借书的人能从旁边那页查回原稿，外地印坊的回复也留在同一份档案里。'
          p3:
            was: '1543 年 5 月 24 日，哥白尼在弗龙堡去世。吉泽后来写信说，印好的书到他去世那天才送到他手上。'
            now: '五月初，印好的书就送到了他的床前，他在神志清楚时把它拿在手里。几周以后，他在弗龙堡去世。'
            who: copernicus_frombork
            bio: '哥白尼在去世前几周收到了印好的《天体运行论》，知道这部写了几十年的书已经印成。'
        vignettes:
          preface: '{staff}翻开一本印好的书。卷首那篇不署名的《告读者》说，书里的说法只是便于计算的假设。{staff}知道要再过五十年左右，开普勒才会说出是谁写的，合上书时，手指还压在那一页上。'
          window: '{staff}在病房外守着一壶热水，壶嘴冒着白气。屋里的人说，老人已经认不太清人了。{staff}把窗推开一条缝，让春天的风吹进去。'
          nets: '{staff}在山脚的渔村帮人补网，望得见维斯瓦潟湖，湖面上停着几条小船。渔夫说，山上住着一位老教士，夜里常看星星。'
text:
  en:
    name: Nicolaus Copernicus
    text: Polish astronomer and canon, 1473 to 1543, who worked at Frombork. His book On the Revolutions of the Heavenly Spheres, printed in 1543, put the sun at the centre of the planets. His friend Tiedemann Giese wrote that the printed book reached him only on the day he died.
  zh:
    name: 哥白尼
    text: 波兰天文学家与教士，1473 年生，1543 年去世，在弗龙堡工作。他的《天体运行论》于 1543 年印行，把太阳放在行星运行的中心。他的朋友蒂德曼·吉泽写信说，印好的书到他去世那天才送到他手上。
hook: {en: 'The book was printed. Did he see it?', zh: '书印成了，他看见了吗'}
quotes:
  copernicus_sun_at_center:
    order: 1
    tier: full
    date: '1543'
    checked: official_record
    sources: [copernicus_first_edition_prefaces]
    original: la
    text:
      en:
        who: 'Nicolaus Copernicus'
        quote: 'But at the center of them all sits the Sun.'
        occasion: 'On the Revolutions, first edition, Book I, chapter 10; game translation'
      zh:
        who: '尼古拉·哥白尼'
        quote: '而在它们的正中央，安坐着太阳。'
        occasion: '《天体运行论》初版，第一卷第十章；本游戏译文'
      la:
        who: 'Nicolaus Copernicus'
        quote: 'In medio uero omnium residet Sol.'
        occasion: 'De revolutionibus I.10, 1543'
      zh-Hant:
        who: '尼古拉·哥白尼'
        quote: '而在它們的正中央，安坐著太陽。'
        occasion: '《天體運行論》初版，第一卷第十章；本遊戲譯文'
      fr:
        who: 'Nicolas Copernic'
        quote: 'Mais au centre de tous se trouve le Soleil.'
        occasion: 'Sur les Révolutions, édition originale, Livre I, chapitre 10 ; traduction du jeu'
      es:
        who: 'Nicolás Copérnico'
        quote: 'Pero en el centro de todos ellos se encuentra el Sol.'
        occasion: 'De las Revoluciones, primera edición, Libro I, capítulo 10; traducción del juego'
      ja:
        who: 'ニコラウス・コペルニクス'
        quote: 'しかし、それらすべての中心には太陽が座っています。'
        occasion: '『革命について』、初版、第 1 巻、第 10 章。ゲーム翻訳'
      ko:
        who: '니콜라우스 코페르니쿠스'
        quote: '하지만 그 중심에는 모두 태양이 있습니다.'
        occasion: '혁명에 대하여(On the Revolutions), 초판, 제1권, 10장; 게임 번역'
      ru:
        who: 'Николай Коперник'
        quote: 'Но в центре их всех находится Солнце.'
        occasion: 'О революциях, первое издание, книга I, глава 10; перевод игры'
  copernicus_beauty_of_sky:
    order: 2
    tier: none
    date: '1541'
    checked: official_record
    sources: [copernicus_autograph_proem, copernicus_critical_proem]
    original: la
    text:
      en:
        who: 'Nicolaus Copernicus'
        quote: 'What is more beautiful than the sky, which holds all that is beautiful?'
        occasion: 'On the Revolutions, Book I, opening of the autograph manuscript (c. 1520–1541), omitted from the first edition; game translation'
      zh:
        who: '尼古拉·哥白尼'
        quote: '还有什么比天空更美？一切美的事物都收在其中。'
        occasion: '《天体运行论》手稿第一卷引言（约 1520—1541 年），未收入初版；本游戏译文'
      la:
        who: 'Nicolaus Copernicus'
        quote: 'Quid autem caelo pulcrius, nempe quod continet pulcra omnia?'
        occasion: 'De revolutionibus I, Prooemium, autograph manuscript'
      zh-Hant:
        who: '尼古拉·哥白尼'
        quote: '還有什麼比天空更美？一切美的事物都收在其中。'
        occasion: '《天體運行論》手稿第一卷引言（約 1520—1541 年），未收入初版；本遊戲譯文'
      fr:
        who: 'Nicolas Copernic'
        quote: 'Quoi de plus beau que le ciel, qui contient tout ce qui est beau ?'
        occasion: 'Sur les Révolutions, livre I, ouverture du manuscrit autographe (vers 1520-1541), omis de la première édition ; traduction du jeu'
      es:
        who: 'Nicolás Copérnico'
        quote: '¿Qué hay más bello que el cielo, que contiene todo lo bello?'
        occasion: 'Sobre las revoluciones, Libro I, apertura del manuscrito autógrafo (c. 1520-1541), omitido en la primera edición; traducción del juego'
      ja:
        who: 'ニコラウス・コペルニクス'
        quote: '美しいものすべてを収めた空よりも美しいものは何でしょうか？'
        occasion: '『革命について』第 1 巻、自筆原稿の冒頭 (1520 年頃 - 1541 年)、初版から省略。ゲーム翻訳'
      ko:
        who: '니콜라우스 코페르니쿠스'
        quote: '아름다운 모든 것을 담고 있는 하늘보다 더 아름다운 것이 어디 있겠습니까?'
        occasion: 'On the Revolutions, Book I, 자필 원고의 시작(c. 1520–1541), 초판에서 생략됨; 게임 번역'
      ru:
        who: 'Николай Коперник'
        quote: 'Что может быть прекраснее неба, в котором заключено все прекрасное?'
        occasion: 'О революциях, Книга I, вскрытие рукописи с автографом (ок. 1520–1541), исключено из первого издания; перевод игры'
facts:
  rheticus:
    date: '1539'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_mactutor, copernicus_torun]
    text:
      en: 'In 1539 Georg Joachim Rheticus, a young mathematician from Wittenberg, came to Frombork, stayed about two years with Copernicus and persuaded him to publish his book.'
      zh: '1539 年，维滕贝格的年轻数学家格奥尔格·约阿希姆·雷蒂库斯来到弗龙堡，在哥白尼身边待了约两年，劝他把书出版。'
    line:
      en: '1539: Rheticus, a young mathematician from Wittenberg, comes to Frombork and urges Copernicus to publish his book.'
      zh: '1539 年，维滕贝格的年轻数学家雷蒂库斯来到弗龙堡，劝哥白尼把书付印。'
      zh-Hant: '1539 年，維滕貝格的年輕數學家雷蒂庫斯來到弗龍堡，勸哥白尼把書付印。'
      fr: '1539 : Rheticus, un jeune mathématicien de Wittenberg, vient à Frombork et presse Copernic de publier son livre.'
      es: '1539: Rheticus, un joven matemático de Wittenberg, llega a Frombork e insta a Copérnico a publicar su libro.'
      ja: '1539年: ヴィッテンベルク出身の若い数学者レティカスがフロムボルクにやって来て、コペルニクスに著書を出版するよう勧める。'
      ko: '1539년: 비텐베르크 출신의 젊은 수학자 레티쿠스가 프롬보르크에 와서 코페르니쿠스에게 자신의 책을 출판할 것을 촉구합니다.'
      ru: '1539: Ретикус, молодой математик из Виттенберга, приезжает во Фромборк и убеждает Коперника опубликовать его книгу.'
  giese_worry:
    date: '1542-12-08'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [copernicus_torun, copernicus_giese_letters]
    text:
      en: 'On 8 December 1542 Tiedemann Giese wrote that he was deeply worried about the poor health of the venerable old man, Copernicus.'
      zh: '1542 年 12 月 8 日，蒂德曼·吉泽写信说，他很担心这位可敬的老人哥白尼的身体。'
    note: 'An illness: written as a plain fact.'
    line:
      en: '8 December 1542: Tiedemann Giese writes that he is deeply worried about the health of the old man, Copernicus.'
      zh: '1542 年 12 月 8 日，蒂德曼·吉泽写信说，他很担心老人哥白尼的身体。'
      zh-Hant: '1542 年 12 月 8 日，蒂德曼·吉澤寫信說，他很擔心老人哥白尼的身體。'
      fr: '8 décembre 1542 : Tiedemann Giese écrit qu''il est profondément inquiet de la santé du vieil homme Copernic.'
      es: '8 de diciembre de 1542: Tiedemann Giese escribe que está profundamente preocupado por la salud del anciano Copérnico.'
      ja: '1542年12月8日：ティーデマン・ギーゼは、老人コペルニクスの健康を非常に心配していると書いている。'
      ko: '1542년 12월 8일: Tiedemann Giese는 노인 코페르니쿠스의 건강에 대해 깊은 걱정을 하고 있다고 썼습니다.'
      ru: '8 декабря 1542 г.: Тидеманн Гизе пишет, что он глубоко обеспокоен здоровьем старика Коперника.'
  revolutions:
    date: '1543'
    stay_day: -1
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_mactutor, copernicus_first_edition_prefaces]
    text:
      en: 'In 1543 De revolutionibus was printed by Johannes Petreius in Nuremberg, with an account in which the Earth turns and goes round the Sun. An unsigned address to the reader stood at the front; Kepler later made known that Andreas Osiander had written it.'
      zh: '1543 年，《天体运行论》在纽伦堡佩特赖乌斯的印坊印成，书中论述地球自转并绕太阳运行。卷首有一篇不署名的《告读者》，后来开普勒指出作者是奥西安德。'
    line:
      en: '1543: in Nuremberg De revolutionibus is printed, with an unsigned address to the reader at the front.'
      zh: '1543 年，《天体运行论》在纽伦堡印成，卷首多了一篇不署名的《告读者》。'
      zh-Hant: '1543 年，《天體運行論》在紐倫堡印成，卷首多了一篇不署名的《告讀者》。'
      fr: "1543\_: à Nuremberg, De revolutionibus est imprimé, avec une adresse non signée au lecteur au recto."
      es: '1543: en Nuremberg se imprime De revolutionibus, con una dirección sin firma dirigida al lector al frente.'
      ja: '1543年: ニュルンベルクで『革命バス』が印刷され、表紙に読者への無署名の宛名が記されている。'
      ko: '1543년: 뉘른베르크에서 De revolutionibus가 인쇄되었으며, 앞에 독자를 위한 서명되지 않은 주소가 있습니다.'
      ru: '1543: в Нюрнберге печатается «De Revolutionibus» с неподписанным обращением к читателю на лицевой стороне.'
  book_reached:
    date: '1543-05-24'
    stay_day: 45.9
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_mactutor, copernicus_torun]
    text:
      en: 'Giese wrote that the printed book reached Copernicus only on the day he died; the Copernicus centre at Toruń holds it likely that the book came to Frombork after his death.'
      zh: '吉泽写信说，印好的书到哥白尼去世那天才送到他手上；托伦的哥白尼中心认为，书很可能在他死后才到弗龙堡。'
    line:
      en: 'About 24 May: the printed De revolutionibus reaches Frombork. Giese will write that it came on the day he died; it may have come after.'
      zh: '5 月 24 日前后，印好的《天体运行论》送到弗龙堡。吉泽后来说，书在他去世那天才到；也可能到得更晚。'
      zh-Hant: '5 月 24 日前後，印好的《天體運行論》送到弗龍堡。吉澤後來說，書在他去世那天才到；也可能到得更晚。'
      fr: 'Vers le 24 mai : le De revolutionibus imprimé arrive à Frombork. Giese écrira que cela est arrivé le jour de sa mort ; c''est peut-être venu après.'
      es: 'Hacia el 24 de mayo: el impreso De revolutionibus llega a Frombork. Giese escribirá que llegó el día de su muerte; puede que haya venido después.'
      ja: '5月24日頃：印刷された革命バスがフロンボルクに到着。ギースはそれが自分が死んだ日に来たと書くだろう。後から来たのかもしれない。'
      ko: '5월 24일경: 인쇄된 De revolutionibus가 Frombork에 도착합니다. Giese는 그가 죽은 날에 그것이 왔다고 쓸 것입니다. 그 이후에 왔을 수도 있습니다.'
      ru: 'Около 24 мая: печатный «De Revolutionibus» достигает Фромборка. Гизе напишет, что это произошло в день его смерти; возможно, это произошло после.'
  death:
    date: '1543-05-24'
    stay_day: 46
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [copernicus_mactutor, copernicus_giese_letters]
    text:
      en: 'Copernicus died in Frombork on 24 May 1543, after several days without consciousness.'
      zh: '1543 年 5 月 24 日，哥白尼昏迷数日后在弗龙堡去世。'
    note: 'Death: written as a plain fact.'
    line:
      en: '24 May 1543: Nicolaus Copernicus dies in Frombork.'
      zh: '1543 年 5 月 24 日，尼古拉·哥白尼在弗龙堡去世。'
      zh-Hant: '1543 年 5 月 24 日，尼古拉·哥白尼在弗龍堡去世。'
      fr: '24 mai 1543 : Nicolas Copernic meurt à Frombork.'
      es: '24 de mayo de 1543: Nicolás Copérnico muere en Frombork.'
      ja: '1543年5月24日：ニコラウス・コペルニクスがフロンボルクで死去。'
      ko: '1543년 5월 24일: 니콜라우스 코페르니쿠스가 Frombork에서 사망합니다.'
      ru: '24 мая 1543 г.: Николай Коперник умирает во Фромборке.'
  giese_letter:
    date: '1543-07-26'
    stay_day: 109.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_giese_letters, copernicus_reception_study]
    text:
      en: 'On 26 July 1543 Giese wrote to Rheticus, thanked him for the two copies of the book, objected to the unsigned preface, and asked him to forward a letter to the city council of Nuremberg requesting an amended edition.'
      zh: '1543 年 7 月 26 日，吉泽写信给雷蒂库斯，谢他寄来两本书，反对那篇不署名的序言，请他把要求改版的信转交纽伦堡市议会。'
    line:
      en: '26 July: Giese writes to Rheticus, thanks him for two copies, and asks him to take a request for an amended edition to the council of Nuremberg.'
      zh: '7 月 26 日，吉泽写信给雷蒂库斯，谢他寄来两本书，请他把要求改版的信转交纽伦堡市议会。'
      zh-Hant: '7 月 26 日，吉澤寫信給雷蒂庫斯，謝他寄來兩本書，請他把要求改版的信轉交紐倫堡市議會。'
      fr: '26 juillet : Giese écrit à Rheticus, le remercie pour les deux exemplaires et lui demande de présenter une demande d''édition modifiée au conseil de Nuremberg.'
      es: '26 de julio: Giese escribe a Rheticus, le agradece las dos copias y le pide que solicite una edición enmendada al concilio de Nuremberg.'
      ja: '7月26日: ギースはレティカスに手紙を書き、2冊のコピーをくれたことに感謝し、ニュルンベルク市議会に修正版の申請を受け付けるよう依頼する。'
      ko: '7월 26일: 기제는 레티쿠스에게 편지를 보내 두 권의 사본에 대해 감사를 표하고 뉘른베르크 의회에 개정판을 요청해 달라고 요청합니다.'
      ru: '26 июля: Гизе пишет Ретикусу, благодарит его за два экземпляра и просит передать просьбу о исправленном издании совету Нюрнберга.'
  autograph:
    date: '1999'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_autograph_provenance, copernicus_wiki]
    text:
      en: 'The autograph manuscript of De revolutionibus passed through the hands of Rheticus and survives in the Jagiellonian Library in Kraków; in 1999 it was entered in the Memory of the World register.'
      zh: '《天体运行论》的亲笔原稿经雷蒂库斯之手流传下来，今藏克拉科夫雅盖隆图书馆，1999 年列入世界记忆名录。'
    line:
      en: '1999: the autograph of De revolutionibus, kept in the Jagiellonian Library in Kraków, enters the Memory of the World register.'
      zh: '1999 年，藏在克拉科夫雅盖隆图书馆的《天体运行论》亲笔原稿列入世界记忆名录。'
      zh-Hant: '1999 年，藏在克拉科夫雅蓋隆圖書館的《天體運行論》親筆原稿列入世界記憶名錄。'
      fr: '1999 : l''autographe de De revolutionibus, conservé à la Bibliothèque Jagellonne de Cracovie, entre au registre de la Mémoire du monde.'
      es: '1999: el autógrafo de De revolutionibus, conservado en la Biblioteca Jagellónica de Cracovia, entra en el registro de la Memoria del Mundo.'
      ja: '1999年: クラクフのヤゲウォ図書館に保管されていた革命家のサインが世界記憶遺産に登録される。'
      ko: '1999년: 크라쿠프의 Jagiellonian 도서관에 보관된 De revolutionibus의 사인이 세계 기록유산에 등재되었습니다.'
      ru: '1999: автограф De Revolutionibus, хранящийся в Ягеллонской библиотеке в Кракове, вносится в реестр «Память мира».'
  remains:
    date: '2008'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [copernicus_remains_pnas, copernicus_wiki]
    text:
      en: 'Remains found under the floor of Frombork Cathedral in 2005 were identified in 2008 as those of Copernicus by a DNA comparison, published in 2009.'
      zh: '2005 年在弗龙堡大教堂地下找到的遗骨，2008 年经 DNA 比对确认是哥白尼，结果次年发表。'
    line:
      en: '2008: a DNA comparison shows that remains found under the floor of Frombork Cathedral are those of Copernicus.'
      zh: '2008 年，DNA 比对证实，弗龙堡大教堂地下找到的遗骨是哥白尼的。'
      zh-Hant: '2008 年，DNA 比對證實，弗龍堡大教堂地下找到的遺骨是哥白尼的。'
      fr: '2008 : une comparaison ADN montre que les restes trouvés sous le sol de la cathédrale de Frombork sont ceux de Copernic.'
      es: '2008: una comparación de ADN muestra que los restos encontrados bajo el suelo de la catedral de Frombork son los de Copérnico.'
      ja: '2008年：DNA比較により、フロンボルク大聖堂の床下で発見された遺骨がコペルニクスのものであることが判明。'
      ko: '2008년: DNA 비교 결과 프롬보르크 대성당 바닥 아래에서 발견된 유해가 코페르니쿠스의 것임을 보여줍니다.'
      ru: '2008: сравнение ДНК показывает, что останки, найденные под полом Фромборкского собора, принадлежат Копернику.'
bystanders:
  copernicus_frombork_reader:
