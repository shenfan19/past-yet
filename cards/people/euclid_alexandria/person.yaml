events:
  euclid_alexandria:
    order: 7
    build_step: 4
    year: -300
    # one office day; the years of his life are not recorded, so the stay is counted from the arrival
    stay: 1
    lon: 29.92
    lat: 31.2
    region: africa
    home: [north_africa]
    near: [europe_east, middle_east]
    crossroads: true
    field: math
    tier: 2
    channels: {V: 1}
    # finished: in the game with release.ready_only
    ready: true
    refs: [euclid_alexandria_primary, euclid_alexandria_mactutor, euclid_alexandria_britannica, euclid_alexandria_porisms_study, euclid_alexandria_ratdolt]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 20, req: {"any":[{"job":["archivist","translator","proofreader","bookseller"],"stat":{"will":5}},{"job":["teacher","tutor","university_lecturer","lecturer"],"stat":{"wit":7}},{"trait":["scholarly","methodical"],"stat":{"wit":8,"will":6}}]}}
      vignettes:
        - {id: lost, traits: [scholarly, curious, sensitive, vigil], day: 18}
        - {id: arcs, traits: [handy, artistic, methodical, patient], day: 9}
        - {id: papyrus, day: 12}
    text:
      en:
        name: 'While the Porisms still existed'
        place: Alexandria
        figure: Euclid
        story: 'Around 300 BC Euclid wrote the thirteen books of the Elements at Alexandria, proving the propositions of geometry step by step from definitions and postulates. He also wrote the Porisms in three books, the Conics and other works, which were later lost. In the fourth century AD Pappus could still describe the Porisms and count its propositions.'
        relic: A bronze compass
        relic_desc: Two arms and a pivot, enough to draw every figure in the book.
        points:
          p1: 'Help him copy the three books of the Porisms several times over and put them in his students'' hands, so the work is not lost'
        points_fail:
          p1: 'The Porisms still existed in a single line of copies. In this branch it was lost all the same, and only the few lines Pappus wrote about it remained.'
        shift:
          p1:
            was: 'Around 300 BC Euclid wrote the Porisms in three books; the work was later lost, and all that is known of it is the count of 171 propositions and the short account that Pappus gave in the fourth century AD.'
            now: '{staff} helped him copy the Porisms several times and hand the copies to those who studied geometry with him. In this timeline the work came down to later readers.'
            who: euclid_alexandria
            bio: 'In this line the Porisms of Euclid were copied more widely and did not disappear, and later readers had more of him than the Elements.'
        vignettes:
          lost: 'On the copyist''s table {staff} sees a roll of the Porisms and knows that later readers will only be able to guess at it from a few lines of Pappus. {staff} keeps a hand on the edge of the roll a while before letting it go.'
          arcs: '{staff} draws circles on a board of sand with a peg and a string, as the students do. The two arcs cross and give the third point. {staff} smooths the sand and draws it again, with a steadier hand the second time.'
          papyrus: '{staff} helps a papyrus seller carry his bundles up the quay, and hears from him which sheets stand the damp of the harbour and which turn brittle in a year.'
      zh:
        name: '《推论集》还在的时候'
        place: 亚历山大
        figure: 欧几里得
        story: '约公元前 300 年，欧几里得在亚历山大写成《几何原本》十三卷，从定义和公设出发，一步步证明几何命题。他还写过《推论集》三卷、《圆锥曲线》等书，后来都失传了。公元四世纪的帕普斯还能介绍《推论集》，记下它的命题数。'
        relic: 一把青铜圆规
        relic_desc: 两条臂和一个轴，足够画出书里的每一个图形。
        points:
          p1: '帮他把《推论集》三卷多抄几部，交到学生手里，不让这部书失传'
        points_fail:
          p1: '《推论集》照旧只有一路抄本，这条分支里它还是失传了，只剩帕普斯留下的几句介绍。'
        shift:
          p1:
            was: '约公元前 300 年，欧几里得写成《推论集》三卷；原书后来失传，今天只知道公元四世纪帕普斯记下的命题数 171 和一段简短的介绍。'
            now: '{staff}帮他把《推论集》多抄了几部，交给跟他学几何的人，这条时间线里这部书传到了后世。'
            who: euclid_alexandria
            bio: 'IF 线里，欧几里得的《推论集》多抄了几部，没有失传，后人读到的他不只有《几何原本》。'
        vignettes:
          lost: '{staff}在抄书人的案头看见一卷《推论集》，知道后世的人只能从帕普斯的几行字里猜它写了什么。{staff}的手按在卷边上，停了好一会儿才松开。'
          arcs: '{staff}学着学生的样子，用木钉和绳子在沙盘上画圆，两道弧一交，第三个点就出来了。{staff}抹平沙子又画一遍，第二遍手稳多了。'
          papyrus: '{staff}帮码头上卖莎草纸的人把一捆捆纸扛上岸，听他讲哪种纸经得住港口的潮气，哪种放一年就脆了。'
text:
  en:
    name: Euclid
    text: Greek mathematician working in Alexandria around 300 BC. His Elements builds geometry from definitions, postulates and proofs and was a standard textbook for over two thousand years. Little is known of his life.
  zh:
    name: 欧几里得
    text: 约公元前 300 年在亚历山大工作的希腊数学家。他的《几何原本》从定义、公设和证明出发构建几何，两千多年里一直是标准教材。他的生平所知甚少。
hook: {en: '171 propositions, and only the number left', zh: '171 个命题，只剩下一个数'}
quotes:
  euclid_equal_to_the_same:
    order: 1
    tier: full
    date: '-300'
    checked: official_record
    sources: [euclid_greek_book_one]
    original: grc
    text:
      en: {who: 'Euclid', quote: 'Things equal to the same thing are equal to one another.', occasion: 'Elements, Book I, first common notion (c. 300 BCE); game translation'}
      zh: {who: '欧几里得', quote: '等于同一量的量，彼此相等。', occasion: '约公元前 300 年，《几何原本》第一卷，第一条公理；本游戏译文'}
      grc: {who: 'Euclid', quote: 'Τὰ τῷ αὐτῷ ἴσα καὶ ἀλλήλοις ἐστὶν ἴσα.', occasion: 'Elements, Book I, first common notion (c. 300 BCE)'}
  euclid_from_a_point:
    order: 2
    tier: none
    date: '-300'
    checked: official_record
    sources: [euclid_greek_book_one]
    original: grc
    text:
      en: {who: 'Euclid', quote: 'Let it be granted that a straight line can be drawn from any point to any point.', occasion: 'Elements, Book I, first postulate (c. 300 BCE); game translation'}
      zh: {who: '欧几里得', quote: '容许从任一点向任一点画一条直线。', occasion: '约公元前 300 年，《几何原本》第一卷，第一条公设；本游戏译文'}
      grc: {who: 'Euclid', quote: 'Ἠιτήσθω ἀπὸ παντὸς σημείου ἐπὶ πᾶν σημεῖον εὐθεῖαν γραμμὴν ἀγαγεῖν.', occasion: 'Elements, Book I, first postulate (c. 300 BCE)'}
facts:
  first_proposition:
    date: '-300'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [euclid_alexandria_primary, euclid_greek_book_one]
    text:
      en: 'The first proposition of Euclid''s Elements constructs an equilateral triangle on a given line segment, with two circles.'
      zh: '欧几里得《几何原本》第一卷第一命题用两个圆，在一条给定线段上作等边三角形。'
  elements:
    date: '-300'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [euclid_alexandria_mactutor, euclid_alexandria_britannica]
    text:
      en: 'Around 300 BC, in Alexandria, Euclid wrote the Elements in thirteen books. Proclus later placed him in the reign of the first Ptolemy.'
      zh: '约公元前 300 年，欧几里得在亚历山大写成《几何原本》十三卷。后来的普罗克洛斯说，他生活在托勒密一世的时代。'
    line:
      en: 'About 300 BC: in Alexandria, Euclid writes the thirteen books of the Elements.'
      zh: '约前 300 年，欧几里得在亚历山大写成《几何原本》十三卷。'
  lost_works:
    date: '-300'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [euclid_alexandria_mactutor, euclid_alexandria_britannica]
    text:
      en: 'Several of his works are lost, among them the Porisms in three books, the Surface Loci in two books and the Conics in four books.'
      zh: '他有几部书失传了，其中有《推论集》三卷、《曲面轨迹》两卷和《圆锥曲线》四卷。'
  pappus:
    date: '320'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [euclid_alexandria_mactutor, euclid_alexandria_porisms_study]
    text:
      en: 'About AD 320 Pappus of Alexandria described the Porisms in his Collection, recording 171 theorems and 38 lemmas; the work itself was later lost.'
      zh: '约公元 320 年，亚历山大的帕普斯在《数学汇编》里介绍了《推论集》，记下它有 171 个定理、38 个引理；原书后来失传。'
    line:
      en: 'About AD 320: Pappus, in Alexandria, writes down that the Porisms holds 171 theorems and 38 lemmas.'
      zh: '约公元 320 年，帕普斯在亚历山大记下，《推论集》共有 171 个定理、38 个引理。'
  printed:
    date: '1482'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [euclid_alexandria_ratdolt]
    text:
      en: 'The Elements was first printed in 1482, in Venice.'
      zh: '1482 年，《几何原本》在威尼斯第一次印刷出版。'
    line:
      en: '1482: Erhard Ratdolt prints the Elements in Venice, with diagrams in the margins.'
      zh: '1482 年，埃尔哈德·拉特多尔特在威尼斯印行《几何原本》，把图形排在页边。'
