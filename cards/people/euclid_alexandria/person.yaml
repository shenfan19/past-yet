text:
  en:
    name: Euclid
    text: Greek mathematician working in Alexandria around 300 BC. His Elements builds geometry from definitions, postulates and proofs and was a standard textbook for over two thousand years. Little is known of his life.
  zh:
    name: 欧几里得
    text: 约公元前 300 年在亚历山大工作的希腊数学家。他的《几何原本》从定义、公设和证明出发构建几何，两千多年里一直是标准教材。他的生平所知甚少。
