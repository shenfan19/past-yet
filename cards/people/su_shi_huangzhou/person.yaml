events:
  su_shi_huangzhou:
    order: 155
    build_step: 3
    year: 1082
    stay: 7
    lon: 114.88
    lat: 30.45
    region: asia
    home: [china]
    field: literature
    tier: 3
    channels: {L: 2, Y: 1}
    # finished: in the game with release.ready_only. The planned arrival is the first day of the seventh month of the fifth Yuanfeng year;
    # the facts of that year are placed by their day of the stay, counted on the lunar calendar from that day.
    ready: true
    refs: [su_shi_huangzhou_primary, wikipedia_crow_terrace, wikipedia_former_ode, wikisource_later_ode]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: endure, day: 60, req: {"any":[{"job":["farmer","potato_farmer","dairy_farmer","coffee_farmer","villager","farmhand","shepherd"]},{"trait":["hardy"],"stat":{"constitution":6}}]}}
        - {id: p2, kind: hold, guard: true, day: 104, req: {"any":[{"trait":["hardy","bold"],"stat":{"constitution":6}},{"job":["geologist","scaffolder","builder","navigator"]},{"item":"headlamp","stat":{"constitution":7}},{"item":"exoskeleton","stat":{"constitution":4}}]}}
        - {id: p3, kind: care, day: 150, req: {"any":[{"job":["midwife","nurse","doctor","physician","paramedic"],"trait":["kind","patient","calm","vigil"]},{"trait":["kind","faithful"],"stat":{"will":8}}]}}
      vignettes:
        - {id: slope, traits: [kind, attached, cheerful]}
        - {id: lamp, traits: [vigil, patient, quiet]}
        - {id: ferry}
    text:
      en:
        name: "Exile on the Eastern Slope"
        place: "Huangzhou"
        figure: "Su Shi"
        story: 'After the Crow Terrace Poetry Trial of 1079, Su Shi was exiled to Huangzhou, where he farmed a plot on an eastern slope and took its name, Dongpo. In the seventh month of 1082 he went out on the river below the Red Cliff with guests and wrote the Former Ode on the Red Cliff; in the tenth month he walked back from the Snow Hall towards Lingao and wrote the Latter Ode. He left Huangzhou in 1084.'
        story_prose:
          opening:
            - 'Huangzhou, in the Yuanfeng reign. Exiled after the Crow Terrace case, Su Shi broke ground east of the town and took the name Dongpo, Eastern Slope. In the fifth year of Yuanfeng he wrote twice about Red Cliff. In the autumn account he described climbing the bluff.'
            - 'In history, his household lived on its savings. Hearing of infants being drowned around Yue and E, he wrote asking for it to be stopped and advocated helping poor families raise their children. In this branch, there is work on the slope, at the ferry and on those families’ doorsteps.'
            - 'This trip needs someone who knows the land and someone who can walk a steep path at night. It also needs someone who can care for newborns and speak patiently from door to door.'
          points:
            p1: '{staff} goes up the slope with the workers and uses what they know about farming to channel water between the beds. At harvest, there are extra sacks to carry. The last sack comes to rest against the wall, brushing a line in the old dust. Above it a string of coins still hangs from the beam.'
            p2: 'On the night of the full moon in the tenth month, {staff} helps find firm footing at the steep places and stays by the way back to the boat. As the figure comes down, {staff} turns the lamp towards the water. A wave strikes the boards and the flame shivers.'
            p3: '{staff} goes from house to house with the group, tends the newborns and speaks with the people who will care for them. One household closes its door only at nightfall. In the strip of light, a small bundle of cloth stirs.'
          outcomes:
            all: 'There was grain on the Eastern Slope that year, wet clothing came back from Red Cliff, and several families kept their children. At night, someone indoors spread out a little coverlet.'
            p3: 'That winter, several families could raise their babies at home. The visitor stepped back out and heard someone move the lamp nearer inside.'
            p1: 'After the harvest, the string of coins lasted several months longer. The new sacks leaned against the wall, with soil still on a corner of the cloth.'
            p2: 'After the second visit, the bluff found its way into the rhapsody. On the open page, the ink is darkest where the brush paused.'
          none: 'The ferry fell quiet, its coiled rope still at the bow. At someone’s feet, the lamp gave one last point of light.'
          not_admitted: '{staff} found no place in Huangzhou. The coil of rope at the ferry grew dim in the mist.'
          desync: 'Things went wrong on that stretch below Red Cliff. Just before the recall, the lamp in {staff}’s hands lit only the water beneath the gunwale.'
          excerpts:
            p3: 'One household closes its door only at nightfall. In the strip of light, a small bundle of cloth stirs.'
            p1: 'The last sack comes to rest against the wall, brushing a line in the old dust. Above it a string of coins still hangs from the beam.'
            p2: 'As the figure comes down, {staff} turns the lamp towards the water. A wave strikes the boards and the flame shivers.'
        relic: "A straw cloak"
        relic_desc: "A rough rain cloak of the kind a farmer wore on the slope."
        points:
          p1: 'Help his family bring in a harvest from the waste land on the eastern slope, and get through the days when the savings run out'
          p2: 'On the night of the full moon of the tenth month, keep him safe on the cliff above the river, so that he comes back down to the boat'
          p3: 'Save the newborn children in the villages who were to be drowned in a basin of water'
        points_fail:
          p1: 'In this branch there was no extra pair of hands on the eastern slope at the autumn harvest, and the strings of coins on the beam went on getting fewer one by one.'
          p2: 'That night he lost his footing on the cliff, and in this branch there is no return to the boat.'
          p3: 'In this branch the basins in the villages stayed as they were, and {staff} did not move a single family to keep that child.'
        shift:
          p1:
            was: 'In 1081 Su Shi broke ground on the slope east of the town, and kept the household to a hundred and fifty cash a day.'
            now: 'The eastern slope gave a few more loads of grain that autumn, and strings of coins were still left on the beam at the end of the year.'
          p2:
            was: 'On the full moon of the tenth month of 1082 Su Shi climbed the broken bank of the Red Cliff alone and came back to the boat, and later wrote the Second Ode on the Red Cliff.'
          p3:
            was: 'He heard of the drowning of infants around Yue and E, wrote to the prefect of Ezhou asking him to forbid it by law, and in Huangzhou proposed a society for raising children, asking the wealthy for money to help poor families keep their newborns.'
            now: '{staff} went from door to door with the society, and that winter a few more families kept the children just born to them.'
        vignettes:
          slope: '{staff} carries water up the slope for the hired hands. At dusk a neighbour, made up for the game, leaves a bowl of cooked beans at the edge of the field and says the newcomer can have the second bowl tomorrow.'
          lamp: '{staff} sits on a stone by the road with a lamp shaded against the wind. Footsteps come down from the slope long after the third watch; {staff} turns the lamp towards the path and says nothing.'
          ferry: '{staff} helps a boatman, made up for the game, coil the rope at the landing. He says the water under the cliff is slow on a still night, and that the guests always ask for the far side.'
      zh:
        name: "东坡的流放"
        place: "黄州"
        figure: "苏轼"
        story: '1079 年乌台诗案之后，苏轼被贬到黄州，在城东一块坡地上开荒种地，以地为号，称东坡。1082 年七月，他与客泛舟赤壁之下，写成《赤壁赋》；十月，他从雪堂步行回临皋，写成《后赤壁赋》。1084 年他离开黄州。'
        story_prose:
          opening:
            - '元丰年间，黄州。苏轼经乌台诗案贬到这里，在城东开荒，后来以东坡为号。元丰五年，他两次写到赤壁，秋夜那一次还记下了攀上断岸。'
            - '史实里，他一家靠着积蓄过日子。他也听说岳鄂一带有溺婴的事，写信求禁，并在黄州提议帮穷人家养孩子。在这条分支里，坡地、渡口和这些人家的门口都能有人接手。'
            - '这一趟用得上懂耕作的人和能走夜路、走陡路的人。会照料新生孩子、能耐心挨家开口的人，也有事要做。'
          points:
            p1: '{staff}跟着帮工上坡，照种地的办法引水入畦。收粮时，攒了几担又搬了几趟。最后一袋粮靠墙放下，扫过地上一道陈灰。梁上还挂着剩下的钱串。'
            p2: '十月之望，{staff}帮看陡处哪块石头能踩稳，又守着回到船上的那一段。崖上的身影下来时，{staff}把灯转向水边。水拍上船板，灯在手里晃了一下。'
            p3: '{staff}跟着育儿会挨家去看，按照护新生儿的办法安顿孩子，再同留下来照看的大人说话。一家人的门到夜里才关上。门缝还亮着，里面有一小团裹好的布在轻轻动。'
          outcomes:
            all: '那年东坡有粮，赤壁归来的人带回了湿衣，几户家里也多了孩子。夜里，门里有人把一床小被摊开。'
            p3: '那个冬天，有几家终于能把孩子养在家里。上门的人退到门外，听见屋里有人把灯移近了一些。'
            p1: '秋后，梁上的钱串比预想的多留了几个月。新粮袋靠在墙边，布角还带着地里的土。'
            p2: '第二次游赤壁以后，断岸写进了赋。摊开那页，墨最浓的地方是笔势一顿的位置。'
          none: '渡口空下来，盘好的绳还在船头。灯放到脚边，火苗只剩一点。'
          not_admitted: '{staff}没能在黄州落脚。渡口那盘粗绳在水雾里一点点暗下去。'
          desync: '赤壁那一段出了岔子。被召回以前，{staff}手里的灯只照到船沿下方的水。'
          excerpts:
            p3: '一家人的门到夜里才关上。门缝还亮着，里面有一小团裹好的布在轻轻动。'
            p1: '最后一袋粮靠墙放下，扫过地上一道陈灰。梁上还挂着剩下的钱串。'
            p2: '崖上的身影下来时，{staff}把灯转向水边。水拍上船板，灯在手里晃了一下。'
        relic: "一件蓑衣"
        relic_desc: "一件粗糙的雨衣，是农人在坡地上穿的那种。"
        points:
          p1: '帮他一家把东坡那块荒地种出收成，撑过积蓄见底的日子'
          p2: '十月之望那夜，护住他攀上赤壁断岸，让他平安回到船上'
          p3: '救下乡间那些一落地就要被按进水盆的孩子'
        points_fail:
          p1: '这条分支里，秋收时东坡的地头没有多一个帮手，梁上的钱串照旧一串一串地少下去。'
          p2: '那夜他在断岸上失了脚，这条分支里没有回到船上的那一段。'
          p3: '这条分支里，乡间的水盆照旧，{staff}没能让哪一家留下那个孩子。'
        shift:
          p1:
            was: '元丰四年，苏轼在城东坡地开荒种地，一家每天的用度限在一百五十钱。'
            now: '那年秋天东坡的地多打了几担粮，梁上的钱串剩到了年底。'
          p2:
            was: '元丰五年十月之望，苏轼独自攀上赤壁断岸，又回到船上，后来写下《后赤壁赋》。'
          p3:
            was: '他听说岳鄂一带溺婴，写信请鄂州知州依律禁止，又在黄州倡议育儿会，请富户出钱，帮贫家养活新生的孩子。'
            now: '{staff}跟着育儿会挨家去走，那个冬天又有几户人家把刚生下的孩子留了下来。'
        vignettes:
          slope: '{staff}替帮工往坡上挑水。天黑时，邻里把一碗煮豆搁到地头，说第二碗明天给这个外乡人。'
          lamp: '{staff}用手替石头上的灯挡风。三更过了许久，坡上传来脚步声。{staff}把灯转向小路，没出声。'
          ferry: '{staff}在渡口帮船家盘缆绳。船家说，无风时崖下水走得慢，来游的人偏要往对岸去。'
text:
  en:
    name: Su Shi
    text: Chinese poet, calligrapher and official of the Song, 1037 to 1101. Exiled to Huangzhou in 1080 after a political case, he farmed a plot of land and wrote some of his best known poems and prose.
  zh:
    name: 苏轼
    text: 宋代诗人、书法家与官员，1037 年生，1101 年去世。1080 年因一桩政治案件被贬到黄州，他在那里种地，并写出了几篇最有名的诗文。
quotes:
  su_shi_wind_and_moon:
    order: 1
    tier: full
    date: '1082'
    checked: official_record
    sources: [su_shi_autograph_red_cliff]
    original: zh
    text:
      zh:
        who: '苏轼'
        quote: '惟江上之清風。與山間之明月。耳得之而為聲。目遇之而成色。取之無禁。用之不竭。'
        occasion: '黄州《前赤壁赋》，赋中苏子答客'
      en:
        who: 'Su Shi'
        quote: 'Only the clear wind over the river and the bright moon among the hills: the ear takes them in as sound, the eye meets them as colour. No one forbids us to take them; using them never exhausts them.'
        occasion: 'Former Ode on the Red Cliff, Su’s reply to his guest within the prose work'
      zh-Hant:
        who: '蘇軾'
        quote: '惟江上之清風。與山間之明月。耳得之而為聲。目遇之而成色。取之無禁。用之不竭。'
        occasion: '黃州《前赤壁賦》，賦中蘇子答客'
      fr:
        who: 'Su Shi'
        quote: 'Seulement le vent clair sur la rivière et la lune brillante parmi les collines : l''oreille les perçoit comme un son, l''œil les rencontre comme une couleur. Personne ne nous interdit de les prendre ; les utiliser ne les épuise jamais.'
        occasion: 'Ancienne Ode sur la Falaise Rouge, réponse de Su à son invité dans l''œuvre en prose'
      es:
        who: 'Su Shi'
        quote: 'Sólo el viento claro sobre el río y la luna brillante entre las colinas: el oído los percibe como sonido, el ojo los percibe como color. Nadie nos prohíbe tomarlos; usarlos nunca los agota.'
        occasion: 'Antigua Oda al Acantilado Rojo, la respuesta de Su a su invitado en la obra en prosa'
      ja:
        who: '蘇軾'
        quote: '川を渡る澄んだ風と丘の間の明るい月だけが、耳はそれらを音として受け取り、目はそれらを色として認識します。誰も私たちがそれらを摂取することを禁じていません。それらを使用しても、決して使い果たされることはありません。'
        occasion: 'かつての「赤壁の頌歌」、散文作品の中でゲストに宛てたスーの返答'
      ko:
        who: '소식'
        quote: '오직 강 위의 맑은 바람과 산 사이의 밝은 달, 귀는 그것을 소리로 받아들이고 눈은 그것을 색깔로 만난다. 아무도 우리가 그것들을 가져가는 것을 금지하지 않습니다. 그것들을 사용해도 결코 지치지 않습니다.'
        occasion: '전 적벽의 송가, 산문 작품 속 손님에게 쑤의 답장'
      ru:
        who: 'Су Ши'
        quote: 'Только ясный ветер над рекой и яркая луна среди холмов: ухо воспринимает их как звук, глаз встречает их как цвет. Никто не запрещает нам их брать; их использование никогда не исчерпывает их.'
        occasion: 'Бывшая «Ода Красному утесу», ответ Су гостю в прозаическом произведении'
  su_shi_what_endures:
    order: 2
    tier: none
    date: '1082'
    checked: official_record
    sources: [su_shi_autograph_red_cliff]
    original: zh
    text:
      zh:
        who: '苏轼'
        quote: '自其不變者而觀之。則物與我皆無盡也。而又何羨乎。'
        occasion: '黄州《前赤壁赋》，赋中苏子以齐观万物答客'
      en:
        who: 'Su Shi'
        quote: 'Look at things from what does not change, and neither the world nor we come to an end. What then is there to envy?'
        occasion: 'Former Ode on the Red Cliff, Su’s reply to his guest on what endures'
      zh-Hant:
        who: '蘇軾'
        quote: '自其不變者而觀之。則物與我皆無盡也。而又何羨乎。'
        occasion: '黃州《前赤壁賦》，賦中蘇子以齊觀萬物答客'
      fr:
        who: 'Su Shi'
        quote: 'Regardez les choses à partir de ce qui ne change pas, et ni le monde ni nous ne finissent. Qu’y a-t-il alors à envier ?'
        occasion: 'Ancienne Ode sur la Falaise Rouge, la réponse de Su à son invité sur ce qui perdure'
      es:
        who: 'Su Shi'
        quote: 'Mira las cosas desde lo que no cambia, y ni el mundo ni nosotros llegamos a su fin. ¿Qué hay entonces que envidiar?'
        occasion: 'Antigua Oda al Acantilado Rojo, la respuesta de Su a su invitado sobre lo que perdura'
      ja:
        who: '蘇軾'
        quote: '変わらないものから物事を見れば、世界も私たちも終わりません。では、何が羨ましいのでしょうか？'
        occasion: 'かつての「赤壁の頌歌」、何が生き残るかについてのゲストへのスーの答え'
      ko:
        who: '소식'
        quote: '변하지 않는 것에서 사물을 바라보면 세상도 우리도 끝나지 않습니다. 그렇다면 부러워할 것이 무엇입니까?'
        occasion: '이전 붉은 절벽의 송가, 지속되는 것에 대한 손님에게 Su의 대답'
      ru:
        who: 'Су Ши'
        quote: 'Смотри на вещи со стороны того, что не меняется, и ни миру, ни нам не приходит конец. Чему же тогда завидовать?'
        occasion: 'Бывшая «Ода на Красной скале», ответ Су своему гостю о том, что останется навсегда'
hook: {en: 'A lamp on the road home', zh: '夜归的路上留一盏灯'}
facts:
  crow_terrace:
    date: '1079'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_crow_terrace, creature_exile]
    text:
      en: 'In the summer of 1079 Su Shi was arrested over his poems and held for months in Kaifeng during his trial, the case known as the Crow Terrace Poetry Trial.'
      zh: '1079 年夏，苏轼因诗文被捕，在开封受审，关押数月，史称乌台诗案。'
    line:
      en: 'In the summer of 1079 Su Shi is arrested over his poems and held in Kaifeng.'
      zh: '元丰二年夏，苏轼因诗文被捕，关进开封的御史台狱。'
      zh-Hant: '元豐二年夏，蘇軾因詩文被捕，關進開封的御史臺獄。'
      fr: 'Au cours de l''été 1079, Su Shi est arrêté pour ses poèmes et détenu à Kaifeng.'
      es: 'En el verano de 1079, Su Shi es arrestado por sus poemas y retenido en Kaifeng.'
      ja: '1079 年の夏、蘇軾は詩を巡って逮捕され、開封で拘留されました。'
      ko: '1079년 여름, 소식(소식)은 그의 시로 인해 체포되어 카이펑(Kaifeng)에 갇히게 됩니다.'
      ru: 'Летом 1079 года Су Ши арестовывают за свои стихи и держат в Кайфэне.'
  exile:
    date: '1080'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_crow_terrace, creature_exile]
    text:
      en: 'He was sentenced to exile in Huangzhou, where he stayed from 1080 to 1084.'
      zh: '他被判贬往黄州，1080 年到 1084 年住在那里。'
    line:
      en: 'In 1080 Su Shi comes to Huangzhou in exile.'
      zh: '元丰三年，苏轼贬到黄州。'
      zh-Hant: '元豐三年，蘇軾貶到黃州。'
      fr: 'En 1080, Su Shi arrive en exil à Huangzhou.'
      es: 'En 1080, Su Shi llega al exilio en Huangzhou.'
      ja: '1080年、蘇軾は亡命して黄州にやって来ます。'
      ko: '1080년 소시가 황저우로 망명해 온다.'
      ru: 'В 1080 году Су Ши приезжает в Хуанчжоу в изгнание.'
  eastern_slope:
    date: '1081'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_crow_terrace, creature_exile]
    text:
      en: 'In 1081 he farmed a plot on a slope east of the town, and took his sobriquet Dongpo, Eastern Slope, from it.'
      zh: '1081 年他在城东一块坡地上耕种，并由此自号东坡。'
    line:
      en: 'In 1081 he clears a plot on the slope east of the town and starts to farm it.'
      zh: '元丰四年，苏轼在城东的坡地上开荒种地，后来以地为号，称东坡。'
      zh-Hant: '元豐四年，蘇軾在城東的坡地上開荒種地，後來以地為號，稱東坡。'
      fr: 'En 1081, il défriche une parcelle sur le versant est de la ville et commence à l''exploiter.'
      es: 'En 1081 despeja un terreno en la ladera al este de la ciudad y comienza a cultivarlo.'
      ja: '1081 年に彼は町の東の斜面にある土地を開墾し、農業を始めました。'
      ko: '1081년에 그는 마을 동쪽 경사면에 있는 땅을 정리하고 농사를 짓기 시작했습니다.'
      ru: 'В 1081 году он расчищает участок на склоне к востоку от города и начинает его обрабатывать.'
  red_cliff:
    date: '1082'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [su_shi_huangzhou_primary, wikipedia_former_ode]
    text:
      en: 'The Former Ode on the Red Cliff opens with a boat outing below the Red Cliff with guests on the sixteenth day of the seventh month of the renxu year, 1082.'
      zh: '《赤壁赋》开篇记壬戌之秋七月既望，即 1082 年农历七月十六，苏轼与客泛舟游于赤壁之下。'
    line:
      en: 'The sixteenth day of the seventh month: Su Shi and his guests go out in a boat below the Red Cliff.'
      zh: '七月既望，苏轼与客泛舟，游于赤壁之下。'
      zh-Hant: '七月既望，蘇軾與客泛舟，遊於赤壁之下。'
      fr: 'Le seizième jour du septième mois : Su Shi et ses invités sortent en bateau sous la Falaise Rouge.'
      es: 'El decimosexto día del séptimo mes: Su Shi y sus invitados salen en un bote por debajo del Acantilado Rojo.'
      ja: '7 月 16 日: 蘇軾と客人は船に乗って赤壁の下へ出かける。'
      ko: '7월 16일: 소식과 그의 손님들이 배를 타고 적벽 아래로 나갑니다.'
      ru: 'Шестнадцатый день седьмого месяца: Су Ши и его гости выходят на лодке под Красную скалу.'
  later_ode:
    date: '1082'
    stay_day: 104
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikisource_later_ode, wikipedia_former_ode]
    text:
      en: 'The Latter Ode on the Red Cliff opens on the full moon of the tenth month of the same year, as Su Shi walks from the Snow Hall towards Lingao with two guests.'
      zh: '《后赤壁赋》开篇记同年十月之望，苏轼从雪堂步行，将回临皋，两位客人同行。'
    line:
      en: 'The full moon of the tenth month: Su Shi walks from the Snow Hall towards Lingao, two guests with him.'
      zh: '十月之望，苏轼从雪堂步行回临皋，两位客人跟着他走过黄泥坂。'
      zh-Hant: '十月之望，蘇軾從雪堂步行回臨皋，兩位客人跟著他走過黃泥坂。'
      fr: 'La pleine lune du dixième mois : Su Shi marche du Snow Hall vers Lingao, deux invités avec lui.'
      es: 'La luna llena del décimo mes: Su Shi camina desde el Salón de Nieve hacia Lingao, con dos invitados con él.'
      ja: '十月の満月：蘇軾は二人の客を連れて雪殿から臨澳に向かって歩く。'
      ko: '10월 보름달: 소시는 두 명의 손님과 함께 눈당에서 링가오(Lingao)를 향해 걸어갑니다.'
      ru: 'Полнолуние десятого месяца: Су Ши идет из Снежного зала в сторону Лингао, с ним двое гостей.'
  leaving:
    date: '1084'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_crow_terrace, creature_exile]
    text:
      en: 'His exile in Huangzhou ended in 1084.'
      zh: '1084 年，他在黄州的贬居结束。'
    line:
      en: 'In 1084 Su Shi leaves Huangzhou.'
      zh: '元丰七年，苏轼离开黄州。'
      zh-Hant: '元豐七年，蘇軾離開黃州。'
      fr: 'En 1084, Su Shi quitte Huangzhou.'
      es: 'En 1084, Su Shi abandona Huangzhou.'
      ja: '1084年、蘇軾は黄州を離れる。'
      ko: '1084년 소식은 황저우를 떠났다.'
      ru: 'В 1084 году Су Ши покидает Хуанчжоу.'
