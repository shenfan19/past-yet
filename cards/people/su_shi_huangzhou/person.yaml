        - {id: p1, kind: care, req: {"any":[{"job":["chef"]},{"trait":["faithful","patient","attached"]}]}}
        - {id: p2, kind: endure, req: {"stat":{"constitution":6}}}
        - {id: p3, kind: notice, redeem: true, req: {"any":[{"trait":["handy","quiet"]},{"job":["painter","musician"]}]}}
