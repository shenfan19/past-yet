    place: "Huangzhou"
    figure: "Su Shi"
    story: "Sent to Huangzhou after a trial over his poems, Su Shi farms a hillside plot, writes some of his best known poems and essays, and visits the Red Cliff."
    relic: "A straw cloak"
    relic_desc: "A rough rain cloak of the kind a farmer wore on the slope."
