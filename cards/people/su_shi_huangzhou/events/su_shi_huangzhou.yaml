  zh:
    name: "东坡的流放"
    place: "黄州"
    figure: "苏轼"
    story: "因为诗文而受审之后，苏轼被贬到黄州，在山坡上种地，写下一些最有名的诗文，并游了赤壁。"
    relic: "一件蓑衣"
    relic_desc: "一件粗糙的雨衣，是农人在坡地上穿的那种。"
    points:
      p1: "和他一起做一顿饭"
      p2: "陪他在坡地上开垦"
      p3: "在月色里的江边听他说话"
