text:
  en:
    name: Emily Dickinson
    text: American poet, 1830 to 1886, who lived most of her life in Amherst, Massachusetts. She wrote nearly eighteen hundred poems, kept many in handmade booklets, and published only a handful in her lifetime.
  zh:
    name: 艾米莉·狄金森
    text: 美国诗人，1830 年生，1886 年去世，大半生住在马萨诸塞州的阿默斯特。她写了近一千八百首诗，许多手工装订成册，生前只发表了寥寥几首。
