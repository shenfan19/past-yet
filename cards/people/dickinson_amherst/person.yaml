    text:
      en:
        name: "Poems in a chest"
        place: "Amherst"
        figure: "Emily Dickinson"
        story: 'Emily Dickinson died at home in Amherst on 15 May 1886. Her sister Lavinia carried out her request to burn her incoming letters and found hundreds of poems. The earliest editors later took apart the booklets in which Emily had sewn many of the poems.'
        relic: "A sewn booklet"
        relic_desc: "A few pages sewn by hand with a poem on each."
        points:
          p1: 'Help Lavinia separate the letters to be destroyed from the bound poems and protect the unpublished work'
          p2: 'Ask Lavinia to keep one booklet together and prepare a copy that marks the folds, page order and alternate words'
          p3: 'Ask Emily what would make it easier to rest tonight, and help her household arrange it'
        points_fail:
          p1: 'The poems are mixed with the correspondence and much of the unpublished work is lost. The branch falls out of sync and the office recalls the employee.'
          p2: 'There is a clean copy, but its pages give no way to tell where the folded sheets joined.'
          p3: 'The household keeps its usual evening routine. Emily still has to ask someone to stay when she needs a hand.'
        shift:
          p1:
            was: 'In 1886, after Dickinson died, Lavinia destroyed the incoming letters as requested and discovered hundreds of poems.'
          p2:
            was: 'Dickinson’s earliest editors disbound the hand-sewn booklets they worked from.'
            now: 'In this branch {staff} copies a booklet without taking it apart. Lavinia has a copy that shows how the pages belong together, down to the alternative words in the margin.'
          p3:
            was: 'Dickinson was gravely ill and died at home on 15 May 1886.'
            now: 'In this branch the household takes her lead and leaves someone close enough to hear her, so she can rest without calling out for help.'
        vignettes:
          pause: 'The reader makes the dash disappear as they read aloud. You ask them to pause where the pencil broke off. They try the line again and hear a different ending.'
          variant: 'You see a word written above the line. The reader wants to choose one version and move on. You make room in the margin for both and label which comes from where.'
          stack: 'The reader straightens a loose pile. You keep two scraps together because their edges and handwriting match. The next clean copy starts with them side by side.'
      zh:
        name: "箱子里的诗"
        place: "阿默斯特"
        figure: "艾米莉·狄金森"
        story: '1886 年 5 月 15 日，艾米莉·狄金森在阿默斯特家中去世。妹妹拉维尼娅按姐姐的要求销毁了收到的来信，又发现数百首诗。早期编者后来将艾米莉手缝成册的诗稿拆开整理。'
        relic: "一册手缝的小本"
        relic_desc: "几页手工缝起来的纸，每页一首诗。"
        points:
          p1: '帮拉维尼娅分开要销毁的来信和姐姐捆好的诗稿，护住那批尚未刊行的诗'
          p2: '请拉维尼娅留下一本未拆的诗册，抄出带折页、页序和备选用词的副本'
          p3: '问艾米莉今晚怎样能歇得安稳些，帮家里人照她的意思安排'
        points_fail:
          p1: '诗稿和来信混进同一摞纸，大批未刊诗跟着消失。这条分支与史实脱节，员工被召回。'
          p2: '清抄稿有了，可纸页怎样折在一起，单看副本已经辨不出来。'
          p3: '家里照平时的样子入夜。艾米莉需要人搭把手时，还得开口请人留下。'
        shift:
          p1:
            was: '1886 年，狄金森去世后，拉维尼娅按姐姐的要求销毁来信，另外发现了成批诗稿。'
          p2:
            was: '狄金森的早期编者拆开了她亲手缝成的诗册。'
            now: '这条分支里，{staff}抄了一册留样，始终没拆它。拉维尼娅从副本就能看出纸页怎样叠在一起，页边的备选词也留了下来。'
          p3:
            was: '狄金森病重，1886 年 5 月 15 日在家中去世。'
            now: '这条分支里，家人照她的意思留了人在近处。她歇下之后，有事也不用提高声音喊。'
        vignettes:
          pause: '读者朗读时把破折号滑了过去。你请他在笔迹断开的地方停一停。再读那一行，他听出了另一种收尾。'
          variant: '你看见行上还写了一个词。读者想挑一个抄完就算，你腾出页边，把两个都留着，并注明各在何处。'
          stack: '读者整理散页时，你把边缘和笔迹对得上的两张留在一起。下一次清抄，便从这两张并排开始。'
text:
  en:
    name: Emily Dickinson
    text: American poet, 1830 to 1886, who lived most of her life in Amherst, Massachusetts. She wrote nearly eighteen hundred poems, kept many in handmade booklets, and published only a handful in her lifetime.
  zh:
    name: 艾米莉·狄金森
    text: 美国诗人，1830 年生，1886 年去世，大半生住在马萨诸塞州的阿默斯特。她写了近一千八百首诗，许多手工装订成册，生前只发表了寥寥几首。
