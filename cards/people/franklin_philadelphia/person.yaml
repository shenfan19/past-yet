    text:
      en:
        name: Lightning is electricity
        place: Philadelphia
        figure: Benjamin Franklin
        story: 'Franklin sent Peter Collinson a letter about an electrical kite in October 1752. The surviving manuscript is in the Royal Society archives. The print-shop conversation is invented.'
        relic: A silk ribbon and key
        relic_desc: A key tied to a kite string with a dry silk ribbon.
        points:
          p1: 'Find the observation on the page'
          p2: 'Separate the date of the letter from the event'
          p3: 'Read the corrected account back to the printer'
        vignettes:
          cloud: 'The printer says the kite must have taken a direct strike. You ask which line reports that. They turn the sheet over and put the street story in a separate note.'
          date: 'You catch the date going into the headline as the day of the event. The printer moves it back beside the address so readers can tell it is the date of the letter.'
          proof: 'The printer asks you to read the proof aloud for someone who has not heard the town''s version. A sentence nobody can trace comes back out of the type.'
      zh:
        name: 闪电就是电
        place: 费城
        figure: 本杰明·富兰克林
        story: '富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。印工之间的谈话为虚构。'
        relic: 一条丝带和一把钥匙
        relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
        points:
          p1: '从纸上找出有记载的观察'
          p2: '分开写信日和事发日'
          p3: '把改好的说法念回给印工'
        vignettes:
          cloud: '印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。'
          date: '你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。'
          proof: '印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。'
text:
  en:
    name: Benjamin Franklin
    text: American printer, writer and scientist, 1706 to 1790, of Philadelphia. His experiments on electricity in the 1740s and 1750s led to the lightning rod, and he took part in drafting the Declaration of Independence.
  zh:
    name: 本杰明·富兰克林
    text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
