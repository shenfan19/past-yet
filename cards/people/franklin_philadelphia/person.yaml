    text:
      en:
        name: Lightning is electricity
        place: Philadelphia
        figure: Benjamin Franklin
        story: 'Franklin sent Peter Collinson a letter about an electrical kite in October 1752. The surviving manuscript is in the Royal Society archives.'
        relic: A silk ribbon and key
        relic_desc: A key tied to a kite string with a dry silk ribbon.
        points:
          p1: 'Before the account goes to the Gazette on 19 October, persuade Franklin to write down the day of the kite trial, the place and who was with him'
        points_fail:
          p1: 'The account goes out without a date, a place or a witness, and is written as directions for what would happen. Later readers argue over whether he ever flew the kite.'
        shift:
          p1:
            was: 'On 19 October 1752 the Pennsylvania Gazette printed Franklin''s account of the kite with no date, place or witness. The date of June 1752 comes only from Joseph Priestley''s history of 1767.'
            now: '{staff} has Franklin add the day, the field and the witness to the account before it goes to print. The trial has a dated record from the year it was made, and the later doubts have less to stand on.'
            who: franklin_philadelphia
            bio: 'Franklin''s account of the kite trial in 1752 carried its date, place and witness. The experiment entered the record as an event, not as a set of directions.'
        vignettes:
          cloud: 'The printer says the kite must have taken a direct strike. You ask which line reports that. They turn the sheet over and put the street story in a separate note.'
          date: 'You catch the date going into the headline as the day of the event. The printer moves it back beside the address so readers can tell it is the date of the letter.'
          proof: 'The printer asks you to read the proof aloud for someone who has not heard the town''s version. A sentence nobody can trace comes back out of the type.'
      zh:
        name: 闪电就是电
        place: 费城
        figure: 本杰明·富兰克林
        story: '富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。'
        relic: 一条丝带和一把钥匙
        relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
        points:
          p1: '在 10 月 19 日的《宾夕法尼亚公报》付印之前，劝富兰克林写明放风筝那次试验的日子、地点和在场的人'
        points_fail:
          p1: '报道照旧没有日期、地点和见证人，写成了照做会如何的说明。后人一直争论他到底有没有放过那只风筝。'
        shift:
          p1:
            was: '1752 年 10 月 19 日，《宾夕法尼亚公报》刊出富兰克林关于风筝的说明，没有日期、地点和见证人。1752 年 6 月这个日子只来自约瑟夫·普里斯特利 1767 年的书。'
            now: '{staff}让富兰克林在付印前补上那天的日子、那片空地和在场的人。这次试验在当年就有了带日期的记录，后来的怀疑少了立足的地方。'
            who: franklin_philadelphia
            bio: '富兰克林 1752 年关于风筝试验的说明写明了日期、地点和见证人。这件事作为一次做过的试验进入记录，不再只是一段做法说明。'
        vignettes:
          cloud: '印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。'
          date: '你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。'
          proof: '印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。'
text:
  en:
    name: Benjamin Franklin
    text: American printer, writer and scientist, 1706 to 1790, of Philadelphia. His experiments on electricity in the 1740s and 1750s led to the lightning rod, and he took part in drafting the Declaration of Independence.
  zh:
    name: 本杰明·富兰克林
    text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
