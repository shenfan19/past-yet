    text:
      en:
        name: Lightning is electricity
        place: Philadelphia
        figure: Benjamin Franklin
        story: 'Franklin sent Peter Collinson a letter about an electrical kite in October 1752. The surviving manuscript is in the Royal Society archives.'
        relic: A silk ribbon and key
        relic_desc: A key tied to a kite string with a dry silk ribbon.
        points:
          p1: 'Before Franklin’s October dispatch leaves Philadelphia, check that the dated pages and Collinson’s address are together'
          p2: 'When the newspaper prepares the report, keep an attribution and the date of printing that another editor can consult'
          p3: 'Have Franklin distinguish what the correspondence reports and what still needs an independent witness. Leave a way for readers to reply'
        points_fail:
          p1: 'An enclosure goes with a different shipment. Collinson receives a report with no context, and the office recalls the employee.'
          p2: 'Another paper takes the short report. Later readers cannot identify where or when it first appeared.'
          p3: 'The reports are merged, and later readers mistake a letter’s date for the date of the observation.'
        shift:
          p1:
            was: 'The Royal Society holds Franklin’s electrical report to Collinson from Philadelphia in October 1752.'
          p2:
            was: 'A Philadelphia newspaper printed the account on October 19, 1752, and versions appeared elsewhere.'
            now: 'A reprint still identifies where the report came from. An editor can compare it with the letter if the two differ.'
          p3:
            was: 'The newspaper and letters provide dates of reporting. These do not establish a day for the observation itself.'
            now: 'The archive keeps the reporting date apart from the unresolved observation date. Independent replies can be entered separately.'
            who: franklin_philadelphia
            bio: 'Franklin’s electrical work traveled through correspondence and the press. Details of how a report reached print did not always travel with it.'
        vignettes:
          cloud: 'The printer says the kite must have taken a direct strike. You ask which line reports that. They turn the sheet over and put the street story in a separate note.'
          date: 'You catch the date going into the headline as the day of the event. The printer moves it back beside the address so readers can tell it is the date of the letter.'
          proof: 'The printer asks you to read the proof aloud for someone who has not heard the town''s version. A sentence nobody can trace comes back out of the type.'
      zh:
        name: 闪电就是电
        place: 费城
        figure: 本杰明·富兰克林
        story: '富兰克林 1752 年 10 月致信彼得·科林森，谈到与电有关的风筝实验。手稿现藏英国皇家学会。'
        relic: 一条丝带和一把钥匙
        relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
        points:
          p1: '从费城寄出富兰克林十月的通信前，把稿纸日序和给科林森的收件页核对'
          p2: '报纸准备转刊时另加一句说明，标出这是作者报告的内容，并保留刊报日期以供别处校对'
          p3: '让富兰克林把尚待独立见证和已经通信说明的部分各列一行，再发给有意回信的读者'
        points_fail:
          p1: '书信附页夹入另一批邮件，科林森只收到一段无来处的报道，事务所因同步失败召回员工。'
          p2: '短文被另一家报纸抄走，后来的读者不知道原来何日、何地刊过。'
          p3: '报道只剩一种笼统说法，后人把寄信日期当成那次观察的当天。'
        shift:
          p1:
            was: '英国皇家学会藏有富兰克林 1752 年 10 月从费城写给科林森的电学报告。'
          p2:
            was: '费城报纸在 1752 年 10 月 19 日刊出了相关报道，后来有别处重印。'
            now: '重印时仍可查到原刊日期与来处。遇到和信件不同的地方，编辑能把两本对读。'
          p3:
            was: '报纸与寄出书信可查日期。具体观察的确日无法由刊行时间推出。'
            now: '存档的说明把公开报告与待核日期分开。后续读者可以回信说明自己的独立观察，编辑也知道该在哪处分开记。'
            who: franklin_philadelphia
            bio: '历史上，富兰克林的电学研究通过私人通信及报纸传递。同一报道在重印后未必带着原来形成的完整时间线。'
        vignettes:
          cloud: '印工说风筝定是挨了一道雷。你请他找出报告里哪一行这么写。他翻过纸，把街上传的那段另记了一笔。'
          date: '你看见信上的日期被排作事情发生的日子。印工把它移回地址旁，读者便能分清这是写信的日期。'
          proof: '印工请你把校样念给没听过市面传闻的人。一句谁也说不清来源的话，最后从版上撤了下来。'
text:
  en:
    name: Benjamin Franklin
    text: American printer, writer and scientist, 1706 to 1790, of Philadelphia. His experiments on electricity in the 1740s and 1750s led to the lightning rod, and he took part in drafting the Declaration of Independence.
  zh:
    name: 本杰明·富兰克林
    text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
