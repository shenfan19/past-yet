text:
  en:
    name: Benjamin Franklin
    text: American printer, writer and scientist, 1706 to 1790, of Philadelphia. His experiments on electricity in the 1740s and 1750s led to the lightning rod, and he took part in drafting the Declaration of Independence.
  zh:
    name: 本杰明·富兰克林
    text: 美国印刷商、作家与科学家，1706 年生，1790 年去世，费城人。他在 1740 至 1750 年代的电学实验导致了避雷针的发明，并参与起草《独立宣言》。
