text:
  en:
    name: Antoni Gaudí
    text: Catalan architect, 1852 to 1926. His buildings in Barcelona, including Casa Batlló and the Sagrada Família, use curved forms taken from nature. He was killed by a tram in 1926 and the Sagrada Família remains unfinished.
  zh:
    name: 安东尼·高迪
    text: 加泰罗尼亚建筑师，1852 年生，1926 年去世。他在巴塞罗那的建筑，包括巴特略之家和圣家堂，使用取自自然的曲线形态。他 1926 年被电车撞死，圣家堂至今未完工。
