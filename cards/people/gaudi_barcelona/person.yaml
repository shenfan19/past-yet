    text:
      en:
        name: "Struck by a tram"
        place: "Barcelona"
        figure: "Antoni Gaudí"
        story: 'On the evening of 7 June 1926 Antoni Gaudí, seventy three, was struck by a tram on the Gran Via in Barcelona. With no papers and in plain clothes he was taken for a beggar, and the taxis that were hailed would not stop. He died in the Hospital de la Santa Creu on 10 June and was buried at the Sagrada Família on 12 June. Domènec Sugranyes took over the direction of the works. On 20 July 1936 the workshop was set on fire, and most of the drawings and plaster models were lost.'
        relic: "A plaster model"
        relic_desc: "A small hanging model of a vault."
        points:
          p1: 'While Gaudí is in hospital, give Domènec Sugranyes the list of works in progress and the workshop keys so the building goes on in June'
          p2: 'Ask Sugranyes to keep photographs, scales and drawings of the main plaster models in a second place, with a signed list left in the workshop'
          p3: 'On the evening of 7 June, when the tram knocks down an old man nobody recognises on the Gran Via, get Gaudí to hospital at once and save him'
        points_fail:
          p1: 'The workshop waits for Gaudí to sign off, and his colleague cannot retrieve the list of active work. The handover stops and the office recalls the employee.'
          p2: 'The photographs and drawings stay in the same row of cupboards. When the workshop is damaged, the comparison material is lost with the plaster models.'
          p3: 'Taken for a beggar, he lies in the street while taxis pass, reaches a dispensary and then the Santa Creu hospital late, and dies there on 10 June.'
        shift:
          p1:
            was: 'A tram accident put Gaudí in hospital in June 1926, where he died. His colleague Sugranyes took charge of the Sagrada Família project.'
          p2:
            was: 'In 1936 much of the workshop’s original drawings and plaster models were lost. The project later drew on fragments and published images for reconstruction.'
            now: 'Ten years later the workshop cupboards burn. The team retrieves an album and the drawings from the second site. Two model faces they would otherwise have to piece together from fragments now have contemporary dimensions for comparison.'
          p3:
            was: 'On 7 June 1926 Gaudí was struck by a tram on the Gran Via. With no papers and in worn clothes he was taken for a beggar, and he died in the Hospital de la Santa Creu on 10 June, aged seventy three.'
            now: '{staff} kneels beside him within a minute, says who he is and gets him straight to a surgeon. Gaudí recovers, and goes back to the workshop at the Sagrada Família for some years more.'
            who: gaudi_barcelona
            bio: 'Gaudí survived the tram accident of June 1926. He returned to the Sagrada Família workshop and went on directing the work with Sugranyes for several more years.'
        vignettes:
          tram: 'On 29 May {staff} rides the length of the Gran Via on a tram, standing on the back platform. The conductor says the worst part of his job is not the fares but the people who cross reading the paper, and he rings the bell at every corner as if he were scolding the whole street.'
          stone: 'On 1 June {staff} helps two masons at the site lower a carved block onto its bed of mortar. When the wind comes up, it whistles through the openings of the tower overhead, and the younger mason swears it hits the same note every afternoon, and that he has started to hum along.'
          water: 'On 10 July, the hottest day yet, {staff} carries jugs for the water seller who comes to the site at noon. She says the stonecutters drink a barrel before the bell and then complain the water tastes of dust, which, she points out, it does because they do.'
      zh:
        name: "被电车撞倒"
        place: "巴塞罗那"
        figure: "安东尼·高迪"
        story: '1926 年 6 月 7 日傍晚，七十三岁的安东尼·高迪在巴塞罗那的大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐，路人拦了几辆出租车都不停。6 月 10 日，他在圣十字医院去世，12 日安葬在圣家堂。多梅内克·苏格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，图纸和石膏模型大多毁掉。'
        relic: "一个石膏模型"
        relic_desc: "一个小小的悬挂式穹顶模型。"
        points:
          p1: '高迪住院期间，把进行中的工程清单和工房钥匙交给多梅内克·苏格拉涅斯，让施工在六月接着往下走'
          p2: '请苏格拉涅斯把关键石膏模型的照片、标尺和图纸另存一处，在工房留一份签收的清单'
          p3: '6 月 7 日傍晚，大道上的电车撞倒一个没人认得的老人时，立刻把高迪送进医院，救下他'
        points_fail:
          p1: '工房等着高迪回来核准，接手的同事拿不到进行中的工程清单。施工交接中断，事务所因同步失败召回员工。'
          p2: '照片和图纸仍收在工房同一排柜里。后来工房毁损时，对照材料随石膏模型一起散失。'
          p3: '他被当成乞丐躺在街上，几辆出租车都不停，先到一处诊所才转进圣十字医院，6 月 10 日在那里去世。'
        shift:
          p1:
            was: '高迪 1926 年 6 月遭遇电车事故，在医院去世。他的合作者苏格拉涅斯接掌圣家堂工程。'
          p2:
            was: '1936 年工房毁损，原图和石膏模型多有损失。工程团队后来从残件和已刊照片等材料重建。'
            now: '十年后工房里的柜子烧毁，团队从另一处取回照相册和有签收的图纸。以前只能靠残件拼的两个模型面，现在有当年的尺寸可作对照。'
          p3:
            was: '1926 年 6 月 7 日，高迪在大道上被电车撞倒，没带证件，衣着破旧，被当成乞丐；6 月 10 日他在圣十字医院去世，年七十三岁。'
            now: '{staff}一分钟内跪到他身边，说出他是谁，直接把他送到外科医生手里。高迪活了下来，又回圣家堂的工房干了几年。'
            who: gaudi_barcelona
            bio: '高迪挺过了 1926 年 6 月的电车事故。他回到圣家堂的工房，和苏格拉涅斯一起又主持了几年工程。'
        vignettes:
          tram: '5 月 29 日，{staff}站在电车后平台上，从大道这头坐到那头。售票员说这份差事最难的不是收钱，是那些边看报边过马路的人。他每到一个路口就拉一下铃，像在数落整条街。'
          stone: '6 月 1 日，{staff}帮工地上两个石匠把一块雕好的石头放到灰浆上。起风时，风从头顶塔身的孔洞里穿过去，吹出哨音。年轻的那个石匠发誓每天下午都是同一个音，他已经开始跟着哼了。'
          water: '7 月 10 日，入夏最热的一天，{staff}替中午来工地的卖水女人提水罐。她说石匠们不到收工铃响就喝掉一整桶，喝完还嫌水里有灰味。她说那是当然，灰就是从他们身上掉进去的。'
text:
  en:
    name: Antoni Gaudí
    text: Catalan architect, 1852 to 1926. His buildings in Barcelona, including Casa Batlló and the Sagrada Família, use curved forms taken from nature. He was killed by a tram in 1926 and the Sagrada Família remains unfinished.
  zh:
    name: 安东尼·高迪
    text: 加泰罗尼亚建筑师，1852 年生，1926 年去世。他在巴塞罗那的建筑，包括巴特略之家和圣家堂，使用取自自然的曲线形态。他 1926 年被电车撞死，圣家堂至今未完工。
hook: {en: 'Nobody knew the old man on the tracks', zh: '倒在电车道上的老人没人认得'}
quotes:
  gaudi_echo_intelligible:
    order: 1
    tier: full
    date: '1878'
    checked: two_sources
    sources: [gaudi_ornament_transcription, gaudi_ornament_study]
    original: es
    text:
      es: {who: Antoni Gaudí, quote: 'Mi objeto es hacerla interesante e inteligible.', occasion: 'cuaderno de Reus, al comenzar sus notas sobre ornamentación'}
      en: {who: Antoni Gaudí, quote: 'My aim is to make it interesting and intelligible.', occasion: 'opening of his notes on ornament in the Reus notebook (game translation)'}
      zh: {who: 安东尼·高迪, quote: '我的目标，是让装饰有趣，也让人看得懂。', occasion: '《雷乌斯手稿》关于装饰的笔记开篇（游戏译文）'}
  gaudi_echo_embryo:
    order: 2
    tier: none
    date: '1878'
    checked: two_sources
    sources: [gaudi_ornament_transcription, gaudi_ornament_montobbio]
    original: es
    text:
      es: {who: Antoni Gaudí, quote: 'Esto necesita madurarse, y no está más que en embrión.', occasion: 'cuaderno de Reus, sobre un bosquejo de iluminación'}
      en: {who: Antoni Gaudí, quote: 'This needs time to mature; it is still only in embryo.', occasion: 'Reus notebook, on a preliminary idea for lighting (game translation)'}
      zh: {who: 安东尼·高迪, quote: '这个想法还得慢慢推敲，现在才刚有个雏形。', occasion: '《雷乌斯手稿》中记下的一项采光构想（游戏译文）'}
facts:
  tower:
    date: '1925'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [gaudi_barcelona_primary]
    text:
      en: 'The first of the bell towers on the east façade was completed in 1925. The Sagrada Família was still unfinished when Gaudí died in 1926.'
      zh: '东立面的第一座钟塔在 1925 年完工。1926 年高迪去世时，圣家堂仍未完成。'
  accident:
    date: '1926-06-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'On the evening of 7 June 1926 Gaudí, crossing the Gran Via between Bailèn and Girona streets, was struck by a tram. Taken for a beggar, he was left lying; the taxis hailed for him would not stop, until a civil guard made one take him to a dispensary in the Ronda de Sant Pere, and from there he was moved to the Hospital de la Santa Creu.'
      zh: '1926 年 6 月 7 日傍晚，高迪在大道上穿过拜伦街与赫罗纳街之间时被电车撞倒。他被当成乞丐，倒在那里没人管；路人拦了几辆出租车都不停，直到一名国民警卫逼一辆车把他送到圣佩雷环路的诊所，再转进圣十字医院。'
    note: 'An accident: written as a plain fact.'
    line:
      en: '7 June 1926: on the Gran Via a tram knocks Gaudí down; taken for a beggar, he lies in the street while taxis pass.'
      zh: '1926 年 6 月 7 日傍晚，高迪在大道上被电车撞倒，被当成乞丐，几辆出租车都不停。'
  death:
    date: '1926-06-10'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'Gaudí died in the Hospital de la Santa Creu at eight minutes past five in the afternoon of 10 June 1926, aged seventy three.'
      zh: '1926 年 6 月 10 日下午五点零八分，高迪在圣十字医院去世，七十三岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '10 June 1926: Antoni Gaudí dies in the Hospital de la Santa Creu, aged seventy three.'
      zh: '1926 年 6 月 10 日，安东尼·高迪在圣十字医院去世，七十三岁。'
  burial:
    date: '1926-06-12'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'On 12 June 1926 Gaudí was buried beneath the Sagrada Família.'
      zh: '1926 年 6 月 12 日，高迪安葬在圣家堂地下。'
    note: 'A death: written as a plain fact.'
    line:
      en: '12 June 1926: Gaudí is buried beneath the Sagrada Família.'
      zh: '1926 年 6 月 12 日，高迪安葬在圣家堂地下。'
  succession:
    date: '1926'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gaudi_workshop_chronology, gaudi_sugranyes_cawiki]
    text:
      en: 'After the death of Gaudí in 1926 his disciple Domènec Sugranyes took over the direction of the works, which he led for ten years.'
      zh: '1926 年高迪去世后，他的弟子多梅内克·苏格拉涅斯接手主持工程，主持了十年。'
  workshop:
    date: '1936-07-20'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gaudi_sugranyes_cawiki, gaudi_workshop_chronology]
    text:
      en: 'On 20 July 1936, at the outbreak of the Spanish Civil War, the workshop Gaudí had used at the site was set on fire, and its documents, plans and many plaster models were destroyed.'
      zh: '1936 年 7 月 20 日，西班牙内战爆发，高迪在工地上用过的工房被人放火，里面的文件、图纸和许多石膏模型都毁了。'
    line:
      en: '20 July 1936: the workshop is set on fire, and most of Gaudí''s drawings and models are lost.'
      zh: '1936 年 7 月 20 日，工房被人放火，高迪的图纸和模型大多毁掉。'
