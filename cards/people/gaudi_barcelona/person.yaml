    text:
      en:
        name: "Struck by a tram"
        place: "Barcelona"
        figure: "Antoni Gaudí"
        story: 'On the evening of 7 June 1926 Antoni Gaudí, seventy three, was struck by a tram on the Gran Via in Barcelona. With no papers and in plain clothes he was taken for a beggar, and the taxis that were hailed would not stop. He died in hospital on 10 June and was buried on 12 June beneath the building he had directed for forty three years. Domènec Sugranyes took over the direction of the works. On 20 July 1936 the workshop was set on fire, and most of the drawings and plaster models were lost.'
        story_prose:
          opening:
            - 'Barcelona, late May 1926. The Catalan architect Antoni Gaudí, seventy three, has given his last years to a great building in the city that is still unfinished. His designs use curves taken from nature, and the workshop on the site is full of drawings and plaster models. Last year the first bell tower of the east façade was completed.'
            - 'In history, on the evening of 7 June he was struck by a tram on the Gran Via. He had no papers and was plainly dressed, so he was taken for a beggar and left lying; the taxis that were hailed would not stop, until a civil guard made one take him to a dispensary, and from there he was moved to hospital, where he died on 10 June. His disciple Domènec Sugranyes took over the direction of the works. Ten years later, on 20 July 1936, the workshop was burned, and most of the drawings and plaster models in it were lost. In this branch, a tram conductor on the Gran Via is fond of his bell, a young mason on the site hums along with the wind, and a woman comes to sell water at noon.'
            - 'A few kinds of people can help on this trip: someone who knows medicine and carries a first aid kit, someone kind or watchful with a strong body, or someone carrying gear that heals wounds, to get him to hospital at once from the tram tracks; someone who has worked as a carpenter or kept archives, or someone handy and methodical, to hand over the work in progress and the workshop keys properly; and the same kind of person with a little more wit or will, to persuade Sugranyes to keep photographs, dimensions and drawings of the key models in a second place.'
          outcomes:
            all: 'That summer Gaudí came back to the workshop. Ten years later the cupboards burned, and someone brought an album back from the second place and turned over a photograph of a model; the scale of that year was written on the back.'
            p3: 'That summer Gaudí came back to the workshop. He sat on a low stool by the door watching the masons work, and in the afternoon the wind passed through the openings of the tower and whistled.'
            p2: 'On 12 June Gaudí was buried. Ten years later the workshop burned, and someone brought an album back from the second place, the scale of that year still written on the backs of the photographs.'
            p1: 'On 12 June Gaudí was buried. Sugranyes took over the direction of the works, the hammers on the site did not stop, and the masons went on building by that list.'
          none: 'On 12 June Gaudí was buried. Ten years later, on 20 July 1936, the workshop was burned, and most of the drawings and plaster models in its cupboards were lost.'
          desync: 'On 10 June the masons waited all morning at the workshop door; nobody knew who had the keys, and nobody could say what work was in hand. When {staff} was recalled, the young mason was sitting on a stone not yet set in place, waiting for someone to call him.'
          not_admitted: '{staff} never got onto the site, and only rode a few times on the trams of the Gran Via. Far off among the scaffolding stood a bell tower, and on windy afternoons a faint whistle carried across several streets.'
          points:
            p3:
              class_medical: 'On the evening of 7 June a tram brakes hard on the Gran Via between Bailèn and Girona streets. An old man in worn clothes lies beside the rails; a few people gather, look, and step back. {staff}, who knows medicine, is kneeling beside him within a minute, pressing on the wound and holding his head steady, and looks up to tell the people around who he is: this is Gaudí, the architect from the site. A taxi pulls up. As the car pulls away, {staff} holds his head with one hand and the door with the other. Behind them the tram rings its bell once and moves slowly off.'
              trait_kind: 'On the evening of 7 June a tram brakes hard on the Gran Via between Bailèn and Girona streets. An old man in worn clothes lies beside the rails; a few people gather, look, and step back. {staff}, kind and unable to leave an old man lying in the road, is kneeling beside him within a minute, holding his head steady, and looks up to tell the people around who he is: this is Gaudí, the architect from the site. A taxi pulls up. As the car pulls away, {staff} holds his head with one hand and the door with the other. Behind them the tram rings its bell once and moves slowly off.'
              trait_vigil: 'On the evening of 7 June a tram brakes hard on the Gran Via between Bailèn and Girona streets. An old man in worn clothes lies beside the rails; a few people gather, look, and step back. {staff}, who has been keeping an eye on the crossing, is kneeling beside him within a minute, holding his head steady, and looks up to tell the people around who he is: this is Gaudí, the architect from the site. A taxi pulls up. As the car pulls away, {staff} holds his head with one hand and the door with the other. Behind them the tram rings its bell once and moves slowly off.'
              else: 'On the evening of 7 June a tram brakes hard on the Gran Via between Bailèn and Girona streets. An old man in worn clothes lies beside the rails; a few people gather, look, and step back. {staff}, carrying the nano medical kit, is kneeling beside him within a minute, using it as its instructions say and holding his head steady, and looks up to tell the people around who he is: this is Gaudí, the architect from the site. A taxi pulls up. As the car pulls away, {staff} holds his head with one hand and the door with the other. Behind them the tram rings its bell once and moves slowly off.'
            p1:
              class_lettered: 'Early on 10 June the models and drawings in the workshop lie where they always do, and the masons stand at the door waiting for Gaudí to come back and approve the day''s work; nobody knows who has the keys. {staff}, used to paperwork, lists the work in progress item by item, which wall has reached which course, which model goes with which drawing, and hands the list to Sugranyes together with the workshop keys, asking him to sign for them. Sugranyes folds the list and closes his hand on the keys. He walks to the door and nods to the masons, and outside the first hammer rings.'
              class_craft: 'Early on 10 June the models and drawings in the workshop lie where they always do, and the masons stand at the door waiting for Gaudí to come back and approve the day''s work; nobody knows who has the keys. {staff}, who has worked with tools, lists the work in progress item by item, which wall has reached which course, which model goes with which drawing, and hands the list to Sugranyes together with the workshop keys, asking him to sign for them. Sugranyes folds the list and closes his hand on the keys. He walks to the door and nods to the masons, and outside the first hammer rings.'
              trait_methodical: 'Early on 10 June the models and drawings in the workshop lie where they always do, and the masons stand at the door waiting for Gaudí to come back and approve the day''s work; nobody knows who has the keys. {staff}, methodical, lists the work in progress item by item, which wall has reached which course, which model goes with which drawing, and hands the list to Sugranyes together with the workshop keys, asking him to sign for them. Sugranyes folds the list and closes his hand on the keys. He walks to the door and nods to the masons, and outside the first hammer rings.'
              else: 'Early on 10 June the models and drawings in the workshop lie where they always do, and the masons stand at the door waiting for Gaudí to come back and approve the day''s work; nobody knows who has the keys. {staff}, handy, lists the work in progress item by item, which wall has reached which course, which model goes with which drawing, and hands the list to Sugranyes together with the workshop keys, asking him to sign for them. Sugranyes folds the list and closes his hand on the keys. He walks to the door and nods to the masons, and outside the first hammer rings.'
            p2:
              class_lettered: 'Early in July the cupboards in the workshop stand in rows, holding the photographs, the drawings and the plaster models, and a hanging model of a vault is strung overhead. {staff}, used to paperwork, measures the key models one by one, writes the scale on the back of each photograph, has the drawings copied, and draws up a list for Sugranyes to sign: one copy stays in the workshop, the other goes with the album to be kept in a second place. Sugranyes signs at the foot of the list and caps his pen. He looks up at the model hanging overhead, and the little weights on its strings sway.'
              class_craft: 'Early in July the cupboards in the workshop stand in rows, holding the photographs, the drawings and the plaster models, and a hanging model of a vault is strung overhead. {staff}, who has worked with tools, measures the key models one by one, writes the scale on the back of each photograph, has the drawings copied, and draws up a list for Sugranyes to sign: one copy stays in the workshop, the other goes with the album to be kept in a second place. Sugranyes signs at the foot of the list and caps his pen. He looks up at the model hanging overhead, and the little weights on its strings sway.'
              trait_methodical: 'Early in July the cupboards in the workshop stand in rows, holding the photographs, the drawings and the plaster models, and a hanging model of a vault is strung overhead. {staff}, methodical and stubborn about detail, measures the key models one by one, writes the scale on the back of each photograph, has the drawings copied, and draws up a list for Sugranyes to sign: one copy stays in the workshop, the other goes with the album to be kept in a second place. Sugranyes signs at the foot of the list and caps his pen. He looks up at the model hanging overhead, and the little weights on its strings sway.'
              else: 'Early in July the cupboards in the workshop stand in rows, holding the photographs, the drawings and the plaster models, and a hanging model of a vault is strung overhead. {staff}, handy and stubborn about detail, measures the key models one by one, writes the scale on the back of each photograph, has the drawings copied, and draws up a list for Sugranyes to sign: one copy stays in the workshop, the other goes with the album to be kept in a second place. Sugranyes signs at the foot of the list and caps his pen. He looks up at the model hanging overhead, and the little weights on its strings sway.'
          excerpts:
            p3: 'As the car pulls away, {staff} holds his head with one hand and the door with the other. Behind them the tram rings its bell once and moves slowly off.'
            p2: 'Sugranyes signs at the foot of the list and caps his pen. He looks up at the model hanging overhead, and the little weights on its strings sway.'
            p1: 'Sugranyes folds the list and closes his hand on the keys. He walks to the door and nods to the masons, and outside the first hammer rings.'
        relic: "A plaster model"
        relic_desc: "A small hanging model of a vault."
        points:
          p1: 'While Gaudí is in hospital, give Domènec Sugranyes the list of works in progress and the workshop keys so the building goes on in June'
          p2: 'Ask Sugranyes to keep photographs, scales and drawings of the main plaster models in a second place, with a signed list left in the workshop'
          p3: 'On the evening of 7 June, when the tram knocks down an old man nobody recognises on the Gran Via, get Gaudí to hospital at once and save him'
        points_fail:
          p1: 'The workshop waits for Gaudí to sign off, and his colleague cannot retrieve the list of active work. The handover stops and the office recalls the employee.'
          p2: 'The photographs and drawings stay in the same row of cupboards. When the workshop is damaged, the comparison material is lost with the plaster models.'
          p3: 'Taken for a beggar, he lies in the street while taxis pass, reaches a dispensary and then a hospital late, and dies there on 10 June.'
        shift:
          p1:
            was: 'A tram accident put Gaudí in hospital in June 1926, where he died. His colleague Sugranyes took charge of the building Gaudí left unfinished.'
          p2:
            was: 'In 1936 much of the workshop’s original drawings and plaster models were lost. The project later drew on fragments and published images for reconstruction.'
            now: 'Ten years later the workshop cupboards burn. The team retrieves an album and the drawings from the second site. Two model faces they would otherwise have to piece together from fragments now have contemporary dimensions for comparison.'
          p3:
            was: 'On 7 June 1926 Gaudí was struck by a tram on the Gran Via. With no papers and in worn clothes he was taken for a beggar, and he died in hospital on 10 June, aged seventy three.'
            now: '{staff} kneels beside him within a minute, says who he is and gets him straight to a surgeon. Gaudí recovers, and goes back to the workshop on the building site for some years more.'
            who: gaudi_barcelona
            bio: 'Gaudí survived the tram accident of June 1926. He returned to the workshop on the building site and went on directing the work with Sugranyes for several more years.'
        vignettes:
          tram: 'On 29 May {staff} rides the length of the Gran Via on a tram, standing on the back platform. The conductor says the worst part of his job is not the fares but the people who cross reading the paper, and he rings the bell at every corner as if he were scolding the whole street.'
          stone: 'On 1 June {staff} helps two masons at the site lower a carved block onto its bed of mortar. When the wind comes up, it whistles through the openings of the tower overhead, and the younger mason swears it hits the same note every afternoon, and that he has started to hum along.'
          water: 'On 10 July, the hottest day yet, {staff} carries jugs for the water seller who comes to the site at noon. She says the stonecutters drink a barrel before the bell and then complain the water tastes of dust, which, she points out, it does because they do.'
      zh:
        name: "被电车撞倒"
        place: "巴塞罗那"
        figure: "安东尼·高迪"
        story: '1926 年 6 月 7 日傍晚，七十三岁的安东尼·高迪在巴塞罗那的大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐，路人拦了几辆出租车都不停。6 月 10 日，他在医院去世，12 日安葬在他主持了四十三年的那座建筑地下。多梅内克·苏格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，图纸和石膏模型大多毁掉。'
        story_prose:
          opening:
            - '1926 年 5 月底，巴塞罗那。七十三岁的加泰罗尼亚建筑师安东尼·高迪把晚年都放在城里一座还没完工的大建筑上。他的设计用取自自然的曲线，工地上的工房里摆满了图纸和石膏模型。前一年，东立面的第一座钟塔刚刚完工。'
            - '史实里，6 月 7 日傍晚他在大道上被电车撞倒。他没带证件，衣着朴素，被当成乞丐倒在那里，路人拦了几辆出租车都不停，直到一名国民警卫逼一辆车把他送去诊所，再转进医院；6 月 10 日他在医院去世。弟子多梅内克·苏格拉涅斯接手主持工程。十年后，1936 年 7 月 20 日，工房被烧，里面的图纸和石膏模型大多毁掉。在这条分支里，大道的电车上有个爱拉铃的售票员，工地上有个跟着风声哼调子的年轻石匠，中午有个来卖水的女人。'
            - '这一趟用得上几种人：懂医护、带着急救包的人，心善或守得住、身子骨结实的人，或者带着能治伤的器材的人，在电车道边立刻把他送医；做过木工、管过档案的人，或者手巧、有条理的人，把进行中的工程和工房钥匙交接清楚；同样的人再多一点脑子或定力，说得动苏格拉涅斯，把关键模型的照片、尺寸和图纸另存一处。'
          outcomes:
            all: '那年夏天，高迪又回到了工房。十年后，柜子烧了，有人从另一处取回一本照相册，翻开一张模型的照片，背面写着当年的比例尺。'
            p3: '那年夏天，高迪又回到了工房。他坐在门口的矮凳上看石匠们干活，午后的风从钟塔的孔洞里穿过去，吹出一声哨音。'
            p2: '6 月 12 日，高迪下葬。十年后工房被烧，有人从另一处取回一本照相册，照片背面还写着当年的比例尺。'
            p1: '6 月 12 日，高迪下葬。苏格拉涅斯接手主持工程，工地上的锤子声没有停，石匠们照着那张清单往上砌。'
          none: '6 月 12 日，高迪下葬。十年后，1936 年 7 月 20 日，工房被烧，柜子里的图纸和石膏模型大多毁掉。'
          desync: '6 月 10 日，石匠们在工房门口等了一上午，钥匙不知道在谁手里，进行中的活一样也说不清。{staff}被召回时，那个年轻石匠正坐在一块还没放上去的石头上，等着有人来叫他。'
          not_admitted: '{staff}没能进那座工地，只在大道上坐过几回电车。远处的脚手架中间立着一座钟塔，风大的下午，隔着几条街也听得见一点哨音。'
          points:
            p3:
              class_medical: '6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}懂医护，一分钟内跪到他身边，按住他的伤处，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。'
              trait_kind: '6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}心善，见不得一个老人倒在路上没人管，一分钟内跪到他身边，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。'
              trait_vigil: '6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}一直留神着路口，一分钟内跪到他身边，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。'
              else: '6 月 7 日傍晚，大道上，一辆电车在拜伦街和赫罗纳街之间猛地刹住。轨道边倒着一个穿旧衣服的老人，几个人围上来看了看，又退开了。{staff}带着纳米医疗箱，一分钟内跪到他身边，照着说明给他用上，托稳他的头，抬头对围着的人说出了他是谁：这是高迪，工地上的建筑师。一辆出租车停了下来。车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。'
            p1:
              class_lettered: '6 月 10 日一早，工房里的模型和图纸照旧摆着，石匠们站在门口，等高迪回来核准当天的活，没有人知道钥匙在谁那里。{staff}管过文书，把进行中的工程一项项列成清单，哪一面墙砌到哪一层，哪个模型对应哪张图，连同工房的钥匙一起交到苏格拉涅斯手里，请他签了收。苏格拉涅斯把清单折好，钥匙攥在手心里。他走到门口，朝石匠们点了点头，外面响起了第一声锤子。'
              class_craft: '6 月 10 日一早，工房里的模型和图纸照旧摆着，石匠们站在门口，等高迪回来核准当天的活，没有人知道钥匙在谁那里。{staff}干过手艺活，把进行中的工程一项项列成清单，哪一面墙砌到哪一层，哪个模型对应哪张图，连同工房的钥匙一起交到苏格拉涅斯手里，请他签了收。苏格拉涅斯把清单折好，钥匙攥在手心里。他走到门口，朝石匠们点了点头，外面响起了第一声锤子。'
              trait_methodical: '6 月 10 日一早，工房里的模型和图纸照旧摆着，石匠们站在门口，等高迪回来核准当天的活，没有人知道钥匙在谁那里。{staff}做事有条理，把进行中的工程一项项列成清单，哪一面墙砌到哪一层，哪个模型对应哪张图，连同工房的钥匙一起交到苏格拉涅斯手里，请他签了收。苏格拉涅斯把清单折好，钥匙攥在手心里。他走到门口，朝石匠们点了点头，外面响起了第一声锤子。'
              else: '6 月 10 日一早，工房里的模型和图纸照旧摆着，石匠们站在门口，等高迪回来核准当天的活，没有人知道钥匙在谁那里。{staff}手巧，把进行中的工程一项项列成清单，哪一面墙砌到哪一层，哪个模型对应哪张图，连同工房的钥匙一起交到苏格拉涅斯手里，请他签了收。苏格拉涅斯把清单折好，钥匙攥在手心里。他走到门口，朝石匠们点了点头，外面响起了第一声锤子。'
            p2:
              class_lettered: '7 月初，工房里的柜子一排挨着一排，照片、图纸和石膏模型都收在里头，头顶还吊着一个悬挂的穹顶模型。{staff}管过文书，把几个关键模型一个个量过，在照片背面写上比例尺，图纸另誊一份，开了一张清单请苏格拉涅斯签字，一份留在工房，一份连同照相册送到另一处收着。苏格拉涅斯在清单底下签了名，扣上笔帽。他抬头看了一眼头顶吊着的那个模型，细绳上的小坠子轻轻晃了一下。'
