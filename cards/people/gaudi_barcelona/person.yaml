              else: '7 月初，工房里的柜子一排挨着一排，照片、图纸和石膏模型都收在里头，头顶还吊着一个悬挂的穹顶模型。{staff}手巧，也肯较真，把几个关键模型一个个量过，在照片背面写上比例尺，图纸另誊一份，开了一张清单请苏格拉涅斯签字，一份留在工房，一份连同照相册送到另一处收着。苏格拉涅斯在清单底下签了名，扣上笔帽。他抬头看了一眼头顶吊着的那个模型，细绳上的小坠子轻轻晃了一下。'
          excerpts:
            p3: '车开动时，{staff}一只手托着他的头，另一只手扶着车门。身后那辆电车叮地响了一声，慢慢开走了。'
            p2: '苏格拉涅斯在清单底下签了名，扣上笔帽。他抬头看了一眼头顶吊着的那个模型，细绳上的小坠子轻轻晃了一下。'
            p1: '苏格拉涅斯把清单折好，钥匙攥在手心里。他走到门口，朝石匠们点了点头，外面响起了第一声锤子。'
        relic: "一个石膏模型"
        relic_desc: "一个小小的悬挂式穹顶模型。"
        points:
          p1: '高迪住院期间，把进行中的工程清单和工房钥匙交给多梅内克·苏格拉涅斯，让施工在六月接着往下走'
          p2: '请苏格拉涅斯把关键石膏模型的照片、标尺和图纸另存一处，在工房留一份签收的清单'
          p3: '6 月 7 日傍晚，大道上的电车撞倒一个没人认得的老人时，立刻把高迪送进医院，救下他'
        points_fail:
          p1: '工房等着高迪回来核准，接手的同事拿不到进行中的工程清单。施工交接中断，事务所因同步失败召回员工。'
          p2: '照片和图纸仍收在工房同一排柜里。后来工房毁损时，对照材料随石膏模型一起散失。'
          p3: '他被当成乞丐躺在街上，几辆出租车都不停，先到一处诊所才转进医院，6 月 10 日在那里去世。'
        shift:
          p1:
            was: '高迪 1926 年 6 月遭遇电车事故，在医院去世。他的合作者苏格拉涅斯接掌了他没建完的那座建筑。'
          p2:
            was: '1936 年工房毁损，原图和石膏模型多有损失。工程团队后来从残件和已刊照片等材料重建。'
            now: '十年后工房里的柜子烧毁，团队从另一处取回照相册和有签收的图纸。以前只能靠残件拼的两个模型面，现在有当年的尺寸可作对照。'
          p3:
            was: '1926 年 6 月 7 日，高迪在大道上被电车撞倒，没带证件，衣着破旧，被当成乞丐；6 月 10 日他在医院去世，年七十三岁。'
            now: '{staff}一分钟内跪到他身边，说出他是谁，直接把他送到外科医生手里。高迪活了下来，又回工地上的工房干了几年。'
            who: gaudi_barcelona
            bio: '高迪挺过了 1926 年 6 月的电车事故。他回到工地上的工房，和苏格拉涅斯一起又主持了几年工程。'
        vignettes:
          tram: '5 月 29 日，{staff}站在电车后平台上，从大道这头坐到那头，车厢里一股晒热的铁味。售票员说这份差事最难的不是收钱，是那些边看报边过马路的人。他每到一个路口就拉一下铃，像在数落整条街。'
          stone: '6 月 1 日，{staff}帮工地上两个石匠把一块雕好的石头放到灰浆上，三个人身上都落满了石粉。起风时，风从头顶塔身的孔洞里穿过去，吹出哨音。年轻的那个石匠发誓每天下午都是同一个音，他已经开始跟着哼了。'
          water: '7 月 10 日，入夏最热的一天，{staff}替中午来工地的卖水女人提水罐，堆在地上的石料晒得烫手。她说石匠们不到收工铃响就喝掉一整桶，喝完还嫌水里有灰味。她说那是当然，灰就是从他们身上掉进去的。'
text:
  en:
    name: Antoni Gaudí
    text: Catalan architect, 1852 to 1926. His buildings in Barcelona, including Casa Batlló and Casa Milà, use curved forms taken from nature. He was killed by a tram in 1926, and his largest building remains unfinished.
  zh:
    name: 安东尼·高迪
    text: 加泰罗尼亚建筑师，1852 年生，1926 年去世。他在巴塞罗那的建筑，包括巴特略之家和米拉之家，使用取自自然的曲线形态。他 1926 年被电车撞死，他最大的那座建筑至今未完工。
hook: {en: 'Nobody knew the old man on the tracks', zh: '倒在电车道上的老人没人认得'}
quotes:
  gaudi_echo_intelligible:
    order: 1
    tier: full
    date: '1878'
    checked: two_sources
    sources: [gaudi_ornament_transcription, gaudi_ornament_study]
    original: es
    text:
      es:
        who: 'Antoni Gaudí'
        quote: 'Mi objeto es hacerla interesante e inteligible.'
        occasion: 'cuaderno de Reus, al comenzar sus notas sobre ornamentación'
      en:
        who: 'Antoni Gaudí'
        quote: 'My aim is to make it interesting and intelligible.'
        occasion: 'opening of his notes on ornament in the Reus notebook (game translation)'
      zh:
        who: '安东尼·高迪'
        quote: '我的目标，是让装饰有趣，也让人看得懂。'
        occasion: '《雷乌斯手稿》关于装饰的笔记开篇（游戏译文）'
      zh-Hant:
        who: '安東尼·高迪'
        quote: '我的目標，是讓裝飾有趣，也讓人看得懂。'
        occasion: '《雷烏斯手稿》關於裝飾的筆記開篇（遊戲譯文）'
      fr:
        who: 'Antoni Gaudí'
        quote: 'Mon objectif est de le rendre intéressant et intelligible.'
        occasion: 'ouverture de ses notes sur l''ornement dans le carnet de Reus (traduction du jeu)'
      ja:
        who: 'アントニ・ガウディ'
        quote: '私の目標は、面白くてわかりやすいものにすることです。'
        occasion: 'レウスノートの装飾に関するメモの冒頭（ゲーム翻訳）'
      ko:
        who: '안토니 가우디'
        quote: '내 목표는 그것을 흥미롭고 이해하기 쉽게 만드는 것입니다.'
        occasion: 'Reus 노트북의 장식에 대한 노트 열기(게임 번역)'
      ru:
        who: 'Антони Гауди'
        quote: 'Моя цель – сделать это интересно и понятно.'
        occasion: 'открытие его записей по орнаменту в блокноте Реуса (перевод игры)'
  gaudi_echo_embryo:
    order: 2
    tier: none
    date: '1878'
    checked: two_sources
    sources: [gaudi_ornament_transcription, gaudi_ornament_montobbio]
    original: es
    text:
      es:
        who: 'Antoni Gaudí'
        quote: 'Esto necesita madurarse, y no está más que en embrión.'
        occasion: 'cuaderno de Reus, sobre un bosquejo de iluminación'
      en:
        who: 'Antoni Gaudí'
        quote: 'This needs time to mature; it is still only in embryo.'
        occasion: 'Reus notebook, on a preliminary idea for lighting (game translation)'
      zh:
        who: '安东尼·高迪'
        quote: '这个想法还得慢慢推敲，现在才刚有个雏形。'
        occasion: '《雷乌斯手稿》中记下的一项采光构想（游戏译文）'
      zh-Hant:
        who: '安東尼·高迪'
        quote: '這個想法還得慢慢推敲，現在才剛有個雛形。'
        occasion: '《雷烏斯手稿》中記下的一項採光構想（遊戲譯文）'
      fr:
        who: 'Antoni Gaudí'
        quote: 'Cela a besoin de temps pour mûrir ; ce n’est encore qu’un embryon.'
        occasion: 'Carnet de Reus, sur une idée préliminaire d''éclairage (traduction du jeu)'
      ja:
        who: 'アントニ・ガウディ'
        quote: 'これが成熟するには時間が必要です。それはまだ胎児の状態にすぎません。'
        occasion: 'レウスノート、照明の予備的なアイデアについて (ゲーム翻訳)'
      ko:
        who: '안토니 가우디'
        quote: '성숙하려면 시간이 필요합니다. 그것은 아직 배아에 불과합니다.'
        occasion: '조명에 대한 예비 아이디어에 관한 Reus 노트북(게임 번역)'
      ru:
        who: 'Антони Гауди'
        quote: 'Этому нужно время, чтобы созреть; оно все еще находится только в зачаточном состоянии.'
        occasion: 'Блокнот Реуса, о предварительной идее освещения (перевод игры)'
facts:
  tower:
    date: '1925'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [gaudi_barcelona_primary]
    text:
      en: 'The first of the bell towers on the east façade was completed in 1925. The building was still unfinished when Gaudí died in 1926.'
      zh: '东立面的第一座钟塔在 1925 年完工。1926 年高迪去世时，这座建筑仍未完成。'
  accident:
    date: '1926-06-07'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'On the evening of 7 June 1926 Gaudí, crossing the Gran Via between Bailèn and Girona streets, was struck by a tram. Taken for a beggar, he was left lying; the taxis hailed for him would not stop, until a civil guard made one take him to a dispensary nearby, and from there he was moved to hospital.'
      zh: '1926 年 6 月 7 日傍晚，高迪在大道上穿过拜伦街与赫罗纳街之间时被电车撞倒。他被当成乞丐，倒在那里没人管；路人拦了几辆出租车都不停，直到一名国民警卫逼一辆车把他送到附近一处诊所，再转进医院。'
    note: 'An accident: written as a plain fact.'
    line:
      en: '7 June 1926: on the Gran Via a tram knocks Gaudí down; taken for a beggar, he lies in the street while taxis pass.'
      zh: '1926 年 6 月 7 日傍晚，高迪在大道上被电车撞倒，被当成乞丐，几辆出租车都不停。'
      zh-Hant: '1926 年 6 月 7 日傍晚，高迪在大道上被電車撞倒，被當成乞丐，幾輛出租車都不停。'
      fr: '7 juin 1926 : sur la Gran Via, un tramway renverse Gaudí ; pris pour un mendiant, il s''allonge dans la rue pendant que passent les taxis.'
      es: '7 de junio de 1926: en la Gran Vía un tranvía atropella a Gaudí; Tomado por un mendigo, yace en la calle mientras pasan los taxis.'
      ja: '1926年6月7日：グランビア通りで路面電車がガウディを轢き殺す。物乞いと思われた彼は、タクシーが通り過ぎる間、道に横たわっていた。'
      ko: '1926년 6월 7일: 그란 비아(Gran Via)에서 트램이 가우디를 쓰러뜨립니다. 거지 취급을 받은 그는 택시가 지나가는 동안 거리에 누워 있다.'
      ru: '7 июня 1926 года: на Гран-Виа трамвай сбивает Гауди; принятый за нищего, он лежит на улице, пока проезжают такси.'
  death:
    date: '1926-06-10'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'Gaudí died in hospital in Barcelona at eight minutes past five in the afternoon of 10 June 1926, aged seventy three.'
      zh: '1926 年 6 月 10 日下午五点零八分，高迪在巴塞罗那的医院去世，七十三岁。'
    note: 'A death: written as a plain fact.'
    line:
      en: '10 June 1926: Antoni Gaudí dies in hospital in Barcelona, aged seventy three.'
      zh: '1926 年 6 月 10 日，安东尼·高迪在巴塞罗那的医院去世，七十三岁。'
      zh-Hant: '1926 年 6 月 10 日，安東尼·高迪在巴塞羅那的醫院去世，七十三歲。'
      fr: '10 juin 1926 : Antoni Gaudí décède à l''hôpital de Barcelone, à l''âge de soixante-treize ans.'
      es: '10 de junio de 1926: Antoni Gaudí muere en un hospital de Barcelona, a los setenta y tres años.'
      ja: '1926年6月10日：アントニ・ガウディがバルセロナの病院で73歳で死去。'
      ko: '1926년 6월 10일: 안토니 가우디가 바르셀로나 병원에서 73세의 나이로 사망했습니다.'
      ru: '10 июня 1926 года. Антони Гауди умирает в больнице Барселоны в возрасте семидесяти трех лет.'
  burial:
    date: '1926-06-12'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gaudi_bellesguard, gaudi_wiki]
    text:
      en: 'On 12 June 1926 Gaudí was buried beneath the building he had directed for forty three years.'
      zh: '1926 年 6 月 12 日，高迪安葬在他主持了四十三年的那座建筑地下。'
    note: 'A death: written as a plain fact.'
    line:
      en: '12 June 1926: Gaudí is buried beneath the building he had directed for forty three years.'
      zh: '1926 年 6 月 12 日，高迪安葬在他主持了四十三年的那座建筑地下。'
      zh-Hant: '1926 年 6 月 12 日，高迪安葬在他主持了四十三年的那座建築地下。'
      fr: '12 juin 1926 : Gaudí est enterré sous l''édifice qu''il a dirigé pendant quarante-trois ans.'
      es: '12 de junio de 1926: Gaudí es enterrado bajo el edificio que dirigió durante cuarenta y tres años.'
      ja: '1926年6月12日：ガウディは43年間指揮した建物の下に埋葬される。'
      ko: '1926년 6월 12일: 가우디가 43년 동안 관리했던 건물 지하에 묻혔습니다.'
      ru: '12 июня 1926 года: Гауди похоронен под зданием, которым он руководил сорок три года.'
  succession:
    date: '1926'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gaudi_workshop_chronology, gaudi_sugranyes_cawiki]
    text:
      en: 'After the death of Gaudí in 1926 his disciple Domènec Sugranyes took over the direction of the works, which he led for ten years.'
      zh: '1926 年高迪去世后，他的弟子多梅内克·苏格拉涅斯接手主持工程，主持了十年。'
  workshop:
    date: '1936-07-20'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [gaudi_sugranyes_cawiki, gaudi_workshop_chronology]
    text:
      en: 'On 20 July 1936, at the outbreak of the Spanish Civil War, the workshop Gaudí had used at the site was set on fire, and its documents, plans and many plaster models were destroyed.'
      zh: '1936 年 7 月 20 日，西班牙内战爆发，高迪在工地上用过的工房被人放火，里面的文件、图纸和许多石膏模型都毁了。'
    line:
      en: '20 July 1936: the workshop is set on fire, and most of Gaudí''s drawings and models are lost.'
      zh: '1936 年 7 月 20 日，工房被人放火，高迪的图纸和模型大多毁掉。'
      zh-Hant: '1936 年 7 月 20 日，工房被人放火，高迪的圖紙和模型大多毀掉。'
      fr: '20 juillet 1936 : l''atelier est incendié et la plupart des dessins et modèles de Gaudí sont perdus.'
      es: '20 de julio de 1936: se incendia el taller y se pierden la mayoría de los dibujos y maquetas de Gaudí.'
      ja: '1936 年 7 月 20 日: 工房が放火され、ガウディの図面と模型のほとんどが失われます。'
      ko: '1936년 7월 20일: 작업장에 불이 붙었고 가우디의 그림과 모델 대부분이 손실되었습니다.'
      ru: '20 июля 1936 г.: мастерская подожжена, большая часть рисунков и моделей Гауди утеряна.'
bystanders:
  conductor:
    invented: true
    text: {en: 'A tram conductor on the Gran Via, made up for the game.', zh: '一个编出来的大道电车售票员。'}
  mason:
    invented: true
    text: {en: 'A young mason at the site, made up for the game.', zh: '一个编出来的工地年轻石匠。'}
  water_seller:
    invented: true
    text: {en: 'A woman who sells water at the site at noon, made up for the game.', zh: '一个编出来的中午来工地卖水的女人。'}
wiki:
  refs:
    gaudi_ornament_transcription:
      order: 99
      status: checked
      text:
        en: 'Antoni Gaudí, notes on ornamentation in the Reus notebook, 1878, Spanish transcription hosted by Artifex Balear. https://artifexbalear.org/gaudi2.htm'
        zh: '安东尼·高迪，1878 年《雷乌斯手稿》装饰札记，Artifex Balear 西班牙语转录。 https://artifexbalear.org/gaudi2.htm'
    gaudi_ornament_study:
      order: 100
      status: checked
      text:
        en: 'El espacio celebrativo como configurador del proyecto arquitectónico de la Sagrada Familia, discussion quoting the start of Gaudí’s 1878 Ornamentación from Laura Mercader’s edition. https://www.academia.edu/46838696/El_Espacio_Celebrativo_Como_Configurador_Del_Proyecto_Arquitectonico_De_La_Sagrada_Familia_De_Antonio_Gaud%C3%AD'
        zh: '《圣家堂建筑方案中的礼仪空间》，引劳拉·梅尔卡德编本中高迪 1878 年装饰札记的开头。 https://www.academia.edu/46838696/El_Espacio_Celebrativo_Como_Configurador_Del_Proyecto_Arquitectonico_De_La_Sagrada_Familia_De_Antonio_Gaud%C3%AD'
    gaudi_ornament_montobbio:
      order: 101
      status: checked
      text:
        en: 'Santiago Montobbio, Gaudí, aire nuestro, quoting the note on the preliminary design from the 1878 manuscript on ornament. https://arcagulharevistadecultura.blogspot.com/2026/03/santiago-montobbio-gaudi-aire-nuestro.html'
        zh: '圣地亚哥·蒙托维奥，《高迪，我们的空气》，引 1878 年装饰手稿对初步构想的记述。 https://arcagulharevistadecultura.blogspot.com/2026/03/santiago-montobbio-gaudi-aire-nuestro.html'
