    text:
      en: 'In 1821 Takahashi Kageyasu and other cartographers completed the maps of the coasts of Great Japan.'
      zh: '1821 年，高桥景保等测绘者完成了《大日本沿海舆地全图》。'
    line:
      en: '1821: Takahashi Kageyasu and the others finish the maps of the coasts of Great Japan.'
      zh: '1821 年，高桥景保等人完成了《大日本沿海舆地全图》。'
      ja: '1821年、高橋景保らが『大日本沿海輿地全図』を完成させた。'
      zh-Hant: '1821 年，高橋景保等人完成了《大日本沿海輿地全圖》。'
      fr: '1821 : Takahashi Kageyasu et les autres terminent les cartes des côtes du Grand Japon.'
      es: '1821: Takahashi Kageyasu y los demás terminan los mapas de las costas del Gran Japón.'
      ko: '1821년: 다카하시 가게야스와 다른 사람들이 대일본 해안 지도를 완성합니다.'
      ru: '1821: Такахаси Кагеясу и другие заканчивают карты побережий Великой Японии.'
