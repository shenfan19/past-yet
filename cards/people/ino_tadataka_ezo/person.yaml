    text:
      en:
        name: 'The bend left out of the line'
        place: "Hokkaido"
        figure: "Ino Tadataka"
        story: 'On 11 June 1800 Ino Tadataka left Edo on his first survey. The party measured as it went north through Tōhoku, crossed to Ezo, and followed the coast as far as Nishibetsu before turning back. The whole expedition, not just the survey on the island, took about six months. Ino died in 1818. His colleagues completed the coastal atlas in 1821.'
        story_prose:
          opening:
            - 'Edo, 11 June 1800. Ino Tadataka, fifty five, sets out with his survey party, six people in all, to go north, cross the strait to Ezo and lay a line along its coast. It is his first survey. Later he walked the coasts of all Japan, and three years after his death his colleagues finished the maps of the coasts of Great Japan.'
            - 'In history, the shogunate gave only a modest allowance, and most of the cost of the road came out of his own pocket; this survey was paced out on foot, and the measuring rope came in only with the second; the party measured along the southern coast of Ezo as far as Nishibetsu, then turned back by the same route. In this branch, a bearer in the party counts the paces aloud, and a fisherman on the shore knows where the coast turns.'
            - 'A few kinds of people can help on this trip: someone who can keep accounts or has done some trading, to hold out when the money runs low, or someone orderly and sturdy, or someone with a nutrient synthesizer; someone who has done carpentry, boatbuilding or net mending, or knows engineering, or is handy and careful, to measure a stretch of road exactly; someone very tough and used to long roads, someone who knows navigation, flying or geology, or someone with a scout drone.'
          outcomes:
            all: 'That winter the party came back to Edo, a hundred and eighty days after it left. On the sheets it brought back, the coast of Ezo ran on past Nishibetsu, and beside the figures for one stretch was a note that it had been measured by cord.'
            p3: 'That winter the party came back to Edo. On the sheet the coastline ran a little way past Nishibetsu, and ended in a small headland.'
            p2: 'That winter the party came back to Edo. On the sheet one stretch of coast had its paces and its cord measure written side by side; on the next survey the party took a measuring rope.'
            p1: 'That winter the party came back to Edo by the same route, a hundred and eighty days after it left. The measuring staff went out with him on several more long journeys.'
          none: 'At the end of August the purse was empty, and the party packed up and turned back before Nishibetsu. The bearer''s counting grew quieter all the way, and the last lines of the tally sheet stayed blank.'
          desync: 'At the end of August the money ran out, and the party turned back before Nishibetsu. When {staff} was recalled, the measuring staff was still standing in the sand halfway along, and the rising tide had come up over half of it.'
          not_admitted: '{staff} never got into the survey party, and helped the fisherman haul in his nets a few times. While he was talking about where the coast turns, a line of people further east along the sand was counting its way out of sight.'
          points:
            p2:
              class_seafaring: 'August, on the south east coast of Ezo. The party measured pace by pace as before, the bearer counting aloud, but on sand and shingle the same stretch walked twice never gave the same count. {staff}, used to tying knots on board ship, took out a coil of thin cord, tied a knot in it at every interval, checked the gaps between the knots against the measuring staff, and with the bearer at the other end pulled it straight along the shore. Ino wrote the cord measure beside the count of paces and drew a short line between the two rows of figures. The bearer wound the cord back round his arm, the knots slipping one by one through his fingers.'
              class_craft: 'August, on the south east coast of Ezo. The party measured pace by pace as before, the bearer counting aloud, but on sand and shingle the same stretch walked twice never gave the same count. {staff}, used to working by hand, twisted a length of thin cord, tied a knot in it at every interval, checked the gaps between the knots against the measuring staff, and with the bearer at the other end pulled it straight along the shore. Ino wrote the cord measure beside the count of paces and drew a short line between the two rows of figures. The bearer wound the cord back round his arm, the knots slipping one by one through his fingers.'
              else: 'August, on the south east coast of Ezo. The party measured pace by pace as before, the bearer counting aloud, but on sand and shingle the same stretch walked twice never gave the same count. {staff} took out a coil of knotted cord, checked the gaps between the knots one by one against the measuring staff, and with the bearer at the other end pulled it straight along the shore. Ino wrote the cord measure beside the count of paces and drew a short line between the two rows of figures. The bearer wound the cord back round his arm, the knots slipping one by one through his fingers.'
            p1:
              class_lettered: 'The end of August, and the purse was nearly empty. The shogunate''s allowance had never been large, the rest of the cost came out of Ino''s own pocket, and Nishibetsu was still days away. {staff}, used to desk work, spread out the money that was left coin by coin, wrote down every night''s lodging and every meal still to come, and ringed the items that could be saved on. The party went on as before. On the day they reached Nishibetsu the bearer counted the last stretch and his voice was gone. Ino pushed the measuring staff into the sand and wrote the word Nishibetsu on the last line of the tally sheet.'
              class_trade: 'The end of August, and the purse was nearly empty. The shogunate''s allowance had never been large, the rest of the cost came out of Ino''s own pocket, and Nishibetsu was still days away. {staff}, who had done some trading, went into the fishing village to bargain, exchanged rice for a few days of dried fish, and beat down the price of their lodging. The party went on as before. On the day they reached Nishibetsu the bearer counted the last stretch and his voice was gone. Ino pushed the measuring staff into the sand and wrote the word Nishibetsu on the last line of the tally sheet.'
              else: 'The end of August, and the purse was nearly empty. The shogunate''s allowance had never been large, the rest of the cost came out of Ino''s own pocket, and Nishibetsu was still days away. {staff} divided the food that was left into small packets, one for each day, handed out one every morning, and ate no more than that share. The party went on as before. On the day they reached Nishibetsu the bearer counted the last stretch and his voice was gone. Ino pushed the measuring staff into the sand and wrote the word Nishibetsu on the last line of the tally sheet.'
            p3:
              class_seafaring: 'Early September, and the party had reached Nishibetsu, where the plan was to turn back. The autumn wind grew harder each day, and the coast to the east ran on, unmeasured. {staff}, used to reading the sky and the tides at sea, showed him which headland could be rounded and when the tide would go out, and led the party on along the shore. The party went past Nishibetsu and measured one more stretch. The fisherman stood on a rock and pointed to where the coast turned, and Ino stopped there and took one more bearing. On the first night of the way back he spread the extra sheet on his knees and slowly traced that stretch of coast with his finger.'
              else: 'Early September, and the party had reached Nishibetsu, where the plan was to turn back. The autumn wind grew harder each day, and the coast to the east ran on, unmeasured. {staff}, strong on the road, went ahead with a pack to scout a stretch, and came back to draw in the sand where they could stop and where a river could be crossed. The party went past Nishibetsu and measured one more stretch. The fisherman stood on a rock and pointed to where the coast turned, and Ino stopped there and took one more bearing. On the first night of the way back he spread the extra sheet on his knees and slowly traced that stretch of coast with his finger.'
          excerpts:
            p3: 'The fisherman stood on a rock and pointed to where the coast turned, and Ino stopped there and took one more bearing. On the first night of the way back he spread the extra sheet on his knees and slowly traced that stretch of coast with his finger.'
            p2: 'Ino wrote the cord measure beside the count of paces and drew a short line between the two rows of figures. The bearer wound the cord back round his arm, the knots slipping one by one through his fingers.'
            p1: 'On the day they reached Nishibetsu the bearer counted the last stretch and his voice was gone. Ino pushed the measuring staff into the sand and wrote the word Nishibetsu on the last line of the tally sheet.'
        relic: "A measuring staff"
        relic_desc: "A thin staff for measuring paces, marked with a scale."
        points:
          p1: 'When the money runs low, keep the party on its way so that the line is laid as far as Nishibetsu in time'
          p2: 'Help him measure one stretch of coast with a cord instead of by paces, so that its numbers are right first'
          p3: 'Help him lay the line on past Nishibetsu, so that this survey takes in a stretch of coast it never reached'
        points_fail:
          p1: 'The party could not hold out and turned back before Nishibetsu, and back in Edo there was no map of that road.'
          p2: 'In this branch every stretch of Ezo is still only a count of paces.'
          p3: 'The survey still turned back at Nishibetsu, as in history.'
        shift:
          p1:
            was: 'In 1800 the survey party of Ino Tadataka worked along the south east coast of Ezo as far as Nishibetsu, and turned back for Edo.'
          p2:
            was: 'The first survey, in 1800, was paced out on foot; the measuring rope came in only with the second.'
            now: 'One stretch of the coast of Ezo was measured with a cord first.'
          p3:
            was: 'The first survey of 1800 ended at Nishibetsu, and the rest of the coast of Hokkaido waited for later surveys.'
            now: 'The line went on past Nishibetsu for one more stretch, and the sheets he brought back to Edo showed a little more coast.'
        vignettes:
          bend: '{staff} sees a bend of the shore about to be drawn as part of a straight line and asks for one more bearing at the turn, so the bend stays on the page.'
          repeat: '{staff} walks a stretch a second time at the same pace and writes the two counts side by side, without choosing between them.'
          sketch: '{staff} draws the outline of a headland on the back of a tally sheet while the others rest, and marks where the line was laid.'
      zh:
        name: '被直线吞掉的转弯'
        place: "北海道"
        figure: "伊能忠敬"
        story: '1800 年 6 月 11 日，伊能忠敬从江户出发，开始第一次测量。队伍沿东北地方一路北测，渡海到虾夷地，再沿海岸测到西别折返。来回全程约半年，不全是在岛上度过。伊能忠敬于 1818 年去世，同伴在 1821 年完成《大日本沿海舆地全图》。'
        story_prose:
          opening:
            - '1800 年 6 月 11 日，江户。五十五岁的伊能忠敬带着测量队出发，一行六人，要一路北上，渡海到虾夷地，沿着海岸量出一条线。这是他头一回测量，后来他走遍了日本的海岸；他去世三年后，同伴们画成了《大日本沿海舆地全图》。'
            - '史实里，幕府给的补助不多，路上的花销大半由他自己掏；这一趟全靠步子量，测绳要到第二次测量才用上；测量队沿虾夷地南岸量到西别，就循原路折返了。在这条分支里，队里有个大声数着步子的挑夫，海边有个知道岸在哪里拐弯的渔夫。'
            - '这一趟用得上几种人：会管账、做过买卖，盘缠见底时撑得住的人，或是条理清楚、身子结实的人，带着营养合成器也行；会木工、造船、补网，或懂工程、手巧细心，量得准一段路的人；身子骨极结实、走惯了远路的人，懂航海、飞行或地质的人，或带着探路无人机的人。'
          outcomes:
            all: '这年冬天，测量队回到江户，前后一百八十天。带回的图上，虾夷地的海岸一直画过了西别，有一段的数字旁边注着绳量。'
            p3: '这年冬天，测量队回到江户。图上的海岸线越过西别又延了一截，末端画着一个小小的岬角。'
            p2: '这年冬天，测量队回到江户。图上有一段海岸，步数和绳量的数并排写着；下一回出门，队里带上了测绳。'
            p1: '这年冬天，测量队循原路回到江户，前后一百八十天。那根测杖后来又跟着他出了好几趟远门。'
          none: '八月底，钱袋空了，测量队没走到西别就收拾行李往回走。挑夫数步子的声音一路低了下去，计数单的最后几行空着。'
          desync: '八月底，钱袋见了底，测量队没走到西别就回了头。{staff}被召回时，那根测杖还插在半路的沙里，潮水涨上来，没过了它的半截。'
          not_admitted: '{staff}没能跟进测量队，只在海边帮渔夫收了几回网。渔夫说起岸在哪里拐弯时，往东的沙滩上，一行人正一步一步数着走远。'
          points:
            p2:
              class_seafaring: '八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}在船上打惯了绳结，取出一卷细绳，每隔一段打一个结，结与结之间先拿测杖比准，和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。'
              class_craft: '八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}做惯了手艺活，搓了一根细绳，每隔一段打一个结，结与结之间先拿测杖比准，和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。'
              else: '八月，虾夷地东南的海岸。队里照旧一步一步地量，挑夫大声数着步子，可到了沙滩和碎石滩上，同一段路走两回，步数总对不上。{staff}取出一卷打好了结的细绳，先拿测杖把结与结之间一段段校准，再和挑夫一人一头，把绳子贴着岸拉直了量。伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。'
            p1:
              class_lettered: '八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}做惯了案头的事，把剩下的钱一文一文摊开，一路要住几处、吃几顿，一样一样记上，能省的那几项用笔圈了出来。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。'
              class_trade: '八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}做过买卖，进渔村去讲价，拿米换了几天的干鱼，借宿的价钱也压下来一截。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。'
              else: '八月底，钱袋快见底了。幕府给的补助本来就不多，剩下的路费是伊能忠敬自己掏的，离西别还有好几天的路。{staff}把剩下的口粮按天数分成小包，每天早上发一包，自己也照这个份量吃。队伍照常往前走。到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。'
            p3:
              class_seafaring: '九月初，测量队到了西别，照原先的打算，该在这里回头了。秋风一天比一天硬，往东的岸还长着，没有人量过。{staff}在海上看惯了天和潮水，前头哪处岬角好绕、潮水几时退，一样一样指给他看，领着队伍贴着岸往前走。测量队越过西别，又往前量了一段。渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。'
              else: '九月初，测量队到了西别，照原先的打算，该在这里回头了。秋风一天比一天硬，往东的岸还长着，没有人量过。{staff}腿脚结实，背着行李先往前探了一程，哪里能落脚、哪里能过河，回来在沙上画给他看。测量队越过西别，又往前量了一段。渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。'
          excerpts:
            p3: '渔夫站在礁石上，指着岸拐弯的地方，伊能忠敬在那里停下来，多测了一次方位。回程的头一夜，他把多出来的那张图摊在膝上，用指头沿着那截海岸慢慢描了一遍。'
            p2: '伊能忠敬把绳量的数写在步数旁边，在两行数字之间画了一道短线。挑夫把那卷绳绕回胳膊上，一个个结从他的指缝里滑了过去。'
            p1: '到西别那天，挑夫数完最后一段步子，嗓子已经哑了。伊能忠敬把测杖插进沙里，在计数单的最末一行写下了西别两个字。'
        relic: "一根测杖"
        relic_desc: "一根量步距用的细杖，上面刻着尺度。"
        points:
          p1: '盘缠见底的时候，护住测量队的行程，让测绳按期铺到西别'
          p2: '帮他把一段海岸从步测换成用绳量，让那一段的数先准起来'
          p3: '帮他把测绳从西别再往前铺一段，让这一趟多测一截没测到的海岸'
        points_fail:
          p1: '队伍在西别之前就撑不下去回了头，回到江户也画不出那一路的图。'
          p2: '这条分支里，虾夷地的每一段仍只是步数。'
          p3: '测量照旧在西别回头，这条分支与历史一样。'
        shift:
          p1:
            was: '1800 年，伊能忠敬的测量队沿虾夷地东南海岸一路测到西别，再折返江户。'
          p2:
            was: '1800 年的第一次测量全靠步测，到第二次测量才用上测绳。'
            now: '虾夷地有一段海岸先用上了绳。'
          p3:
            was: '1800 年的第一次测量到西别为止，北海道其余的海岸要等以后的测量补上。'
            now: '测绳越过西别又往前铺了一段，回到江户的那几张图上多了一截海岸。'
        vignettes:
          bend: '一处海湾眼看要被画进一条直线里，{staff}请他们在拐弯处再测一次方位。渔夫在一旁看着，那个弯就留在了纸上。'
          repeat: '{staff}用同样的步子把一段路又走了一遍，鞋里灌满了沙，两次的步数并排记着，没去挑哪一个。'
          sketch: '众人歇脚时，{staff}在计数单背面画了一个岬角的轮廓，海风掀起纸角，就拿一块石子压住，标出测绳铺在哪里。'
      ja:
        name: '直線に消えかけた曲がり角'
        place: '蝦夷地（北海道）'
        figure: '伊能忠敬'
        story: '1800年6月11日、伊能忠敬は初めての測量に江戸を出発した。一行は東北を北上しながら測量し、海を渡って蝦夷地の海岸を西別までたどり、引き返した。全行程はおよそ半年だった。忠敬は1818年に亡くなり、仲間たちが1821年に『大日本沿海輿地全図』を完成させた。'
        story_prose:
          opening:
            - '1800年6月11日、江戸。五十五歳の伊能忠敬が測量隊を率いて出発する。一行は六人、北へ進み、海を渡って蝦夷地に入り、海岸に沿って一本の線を測っていく。これが初めての測量で、のちに忠敬は日本中の海岸を歩き、その死から三年後に仲間たちが『大日本沿海輿地全図』を描き上げた。'
            - '史実では、幕府の手当はわずかで、旅の費用の大半は忠敬が自分で出した。この測量はすべて歩測で、測量縄を使うのは第二次測量からだった。一行は蝦夷地の南の海岸を西別まで測り、同じ道を引き返した。この時間軸では、隊に歩数を大声で数える荷運びがいて、浜には海岸がどこで曲がるかを知る漁師がいる。'
            - 'この旅で役に立つ人：帳簿をつけられる人や商いをしたことがある人、旅費が尽きかけても持ちこたえられる人、あるいは几帳面で体の丈夫な人、栄養合成器を持った人。大工や船大工、網の繕いの経験がある人、あるいは工学に通じた人、手先が器用で注意深い人、一区間を正確に測れる人。ひどく頑丈で長い道に慣れた人、航海や飛行や地質に通じた人、あるいは偵察ドローンを持った人。'
          outcomes:
            all: 'その冬、一行は江戸に戻った。出発から百八十日だった。持ち帰った図には、蝦夷地の海岸が西別の先まで描かれ、ある一区間の数字の横には縄で測ったと書き添えてあった。'
            p3: 'その冬、一行は江戸に戻った。図の海岸線は西別を越えてさらに少し延び、その先は小さな岬で終わっていた。'
            p2: 'その冬、一行は江戸に戻った。図のある一区間には、歩数と縄で測った数が並べて書いてあった。次の測量には、測量縄が持っていかれた。'
            p1: 'その冬、一行は同じ道を通って江戸に戻った。出発から百八十日だった。あの測量の杖は、その後も何度も遠い旅に忠敬と出かけた。'
          none: '八月の末、財布が空になり、一行は西別に着く前に荷をまとめて引き返した。荷運びの数える声は道々小さくなり、帳面の最後の数行は空いたままだった。'
          desync: '八月の末、旅費が尽き、一行は西別に着く前に引き返した。{staff}が呼び戻されたとき、測量の杖は道半ばの砂に立ったままで、満ちてきた潮がその半分まで浸していた。'
          not_admitted: '{staff}は測量隊に加われず、浜で漁師の網上げを何度か手伝っただけだった。漁師が海岸の曲がる場所の話をしているあいだ、東の砂浜を一列の人々が歩数を数えながら遠ざかっていった。'
          points:
            p2:
              class_seafaring: '八月、蝦夷地の南東の海岸。一行はいつもどおり一歩ずつ測り、荷運びが大声で歩数を数えていたが、砂浜や砂利浜では同じ区間を二度歩いても数が合わなかった。{staff}は船で縄を結び慣れていて、細い縄を一巻き取り出し、一定の間隔ごとに結び目を作り、結び目のあいだを測量の杖で確かめてから、荷運びと両端を持ち、海岸に沿ってまっすぐ張って測った。忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。'
              class_craft: '八月、蝦夷地の南東の海岸。一行はいつもどおり一歩ずつ測り、荷運びが大声で歩数を数えていたが、砂浜や砂利浜では同じ区間を二度歩いても数が合わなかった。{staff}は手仕事に慣れていて、細い縄を一本よって、一定の間隔ごとに結び目を作り、結び目のあいだを測量の杖で確かめてから、荷運びと両端を持ち、海岸に沿ってまっすぐ張って測った。忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。'
              else: '八月、蝦夷地の南東の海岸。一行はいつもどおり一歩ずつ測り、荷運びが大声で歩数を数えていたが、砂浜や砂利浜では同じ区間を二度歩いても数が合わなかった。{staff}は結び目のついた細い縄を一巻き取り出し、結び目のあいだを一つずつ測量の杖で確かめてから、荷運びと両端を持ち、海岸に沿ってまっすぐ張って測った。忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。'
            p1:
              class_lettered: '八月の末、財布はもうすぐ空になるところだった。幕府の手当はもともと少なく、残りの旅費は忠敬が自分で出していて、西別まではまだ何日もかかった。{staff}は机仕事に慣れていて、残った金を一文ずつ広げ、この先の宿と食事を一つずつ書き出し、切り詰められる項目を筆で丸く囲んだ。一行はいつもどおり先へ進んだ。西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。'
              class_trade: '八月の末、財布はもうすぐ空になるところだった。幕府の手当はもともと少なく、残りの旅費は忠敬が自分で出していて、西別まではまだ何日もかかった。{staff}は商いをしたことがあり、漁村に入って値段を掛け合い、米を数日分の干し魚に替え、宿代も少し下げさせた。一行はいつもどおり先へ進んだ。西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。'
              else: '八月の末、財布はもうすぐ空になるところだった。幕府の手当はもともと少なく、残りの旅費は忠敬が自分で出していて、西別まではまだ何日もかかった。{staff}は残った食糧を日数分の小さな包みに分け、毎朝一つずつ配り、自分もその分しか食べなかった。一行はいつもどおり先へ進んだ。西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。'
            p3:
              class_seafaring: '九月の初め、一行は西別に着いた。もとの予定では、ここで引き返すことになっていた。秋風は日ごとに強くなり、東へ続く海岸はまだ誰も測っていなかった。{staff}は海で空と潮を読み慣れていて、どの岬なら回り込めるか、潮がいつ引くかを一つずつ指し示し、一行を連れて海岸沿いに先へ進んだ。一行は西別を越え、さらに一区間を測った。漁師が岩の上に立って海岸の曲がるところを指さし、忠敬はそこで立ち止まって、もう一度方角を測った。帰り道の最初の夜、忠敬は増えた一枚の図を膝に広げ、その海岸を指でゆっくりとなぞった。'
              else: '九月の初め、一行は西別に着いた。もとの予定では、ここで引き返すことになっていた。秋風は日ごとに強くなり、東へ続く海岸はまだ誰も測っていなかった。{staff}は足腰が丈夫で、荷を背負って先へ一区間探りに行き、戻ってくると、どこで泊まれるか、どこで川を渡れるかを砂の上に描いて見せた。一行は西別を越え、さらに一区間を測った。漁師が岩の上に立って海岸の曲がるところを指さし、忠敬はそこで立ち止まって、もう一度方角を測った。帰り道の最初の夜、忠敬は増えた一枚の図を膝に広げ、その海岸を指でゆっくりとなぞった。'
          excerpts:
            p3: '漁師が岩の上に立って海岸の曲がるところを指さし、忠敬はそこで立ち止まって、もう一度方角を測った。帰り道の最初の夜、忠敬は増えた一枚の図を膝に広げ、その海岸を指でゆっくりとなぞった。'
            p2: '忠敬は縄で測った数を歩数の横に書き、二行の数字のあいだに短い線を引いた。荷運びは縄を腕に巻き戻し、結び目が一つずつ指のあいだを滑っていった。'
            p1: '西別に着いた日、荷運びは最後の区間を数え終えたとき、声がすっかり嗄れていた。忠敬は測量の杖を砂に突き立て、帳面の最後の行に西別と書いた。'
        relic: '測量の杖'
        relic_desc: '歩幅を測るための、目盛りの刻まれた細い杖。'
        points:
          p1: '旅費が尽きかけた一行を支え、西別までの測量を続ける'
          p2: '海岸の一部を歩数の代わりに縄で測る'
          p3: '西別を越えて、まだ測っていない海岸をもう一区間測る'
        points_fail:
          p1: '一行は西別に着く前に引き返した。江戸に戻っても、その先の地図は描けなかった。'
          p2: 'この時間軸でも、蝦夷地の海岸はすべて歩数で測った。'
          p3: '史実どおり、一行は西別で引き返した。'
        shift:
