    date: '1800-06-11'
    lon: 143.0
    lat: 42.8
    region: asia
    home: [japan]
    field: exploration
    tier: 2
    channels: {C: 2, L: 3, Y: 1}
    # finished: in the game with release.ready_only
    ready: true
    refs: [ino_tadataka_ezo_survey, ino_tadataka_ezo_notes, nippon_ino, wikipedia_ino]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 80, req: {"any":[{"job":["accountant","tax_preparer","shopkeeper","market_trader"],"stat":{"will":5}},{"trait":["methodical","streetwise"],"stat":{"wit":5,"constitution":5}},{"item":"nutrient_synth","stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 60, req: {"any":[{"job":["civil_engineer","retired_engineer","carpenter","shipwright","net_mender"]},{"trait":["handy","methodical"],"stat":{"finesse":6}}]}}
        - {id: p3, kind: endure, day: 90, req: {"any":[{"trait":["hardy","wanderer"],"stat":{"constitution":8,"will":6}},{"item":"scout_drone","stat":{"constitution":6}},{"job":["navigator","bush_pilot","geologist"],"stat":{"constitution":7}}]}}
      vignettes:
        - {id: bend, traits: [methodical, scholarly], day: 80}
        - {id: repeat, traits: [hardy, curious], day: 100}
        - {id: sketch, day: 50}
    text:
      en:
        name: 'The bend left out of the line'
        place: "Hokkaido"
        figure: "Ino Tadataka"
        story: 'On 11 June 1800 Ino Tadataka set out from Edo with a party of five to survey Ezo, today''s Hokkaido. They spent about six months on the island and measured its southeastern coast. He died in 1818; his death was kept quiet for a time so that the work could go on, and in 1821 Takahashi Kageyasu and others finished the maps of the coasts of Great Japan.'
        relic: "A measuring staff"
        relic_desc: "A thin staff for measuring paces, marked with a scale."
        points:
          p1: 'When the money runs low, keep the party on its way so that the line is laid as far as Nishibetsu in time'
          p2: 'Help him measure one stretch of coast with a cord instead of by paces, so that its numbers are right first'
          p3: 'Help him lay the line on past Nishibetsu, so that this survey takes in a stretch of coast it never reached'
        points_fail:
          p1: 'The party could not hold out and turned back before Nishibetsu, and back in Edo there was no map of that road.'
          p2: 'In this branch every stretch of Ezo is still only a count of paces.'
          p3: 'The survey still turned back at Nishibetsu, as in history.'
        shift:
          p2:
            was: 'The first survey was measured entirely by paces, and cords came in only from the second.'
            now: 'One stretch of the coast of Ezo was measured with a cord first.'
          p3:
            was: 'The first survey went no further than Nishibetsu, and the rest of the coast of Hokkaido waited for later surveys.'
            now: 'The line went on past Nishibetsu for one more stretch, and the sheets he brought back to Edo showed a little more coast.'
        vignettes:
          bend: '{staff} sees a bend of the shore about to be drawn as part of a straight line and asks for one more bearing at the turn, so the bend stays on the page.'
          repeat: '{staff} walks a stretch a second time at the same pace and writes the two counts side by side, without choosing between them.'
          sketch: '{staff} draws the outline of a headland on the back of a tally sheet while the others rest, and marks where the line was laid.'
      zh:
        name: '被直线吞掉的转弯'
        place: "北海道"
        figure: "伊能忠敬"
        story: '1800 年 6 月 11 日，伊能忠敬带着一行五人从江户出发，去测量虾夷地，也就是今天的北海道。他们在岛上待了约半年，测了东南沿岸。他于 1818 年去世，死讯一度被隐瞒，好让测绘继续；1821 年，高桥景保等人完成了《大日本沿海舆地全图》。'
        relic: "一根测杖"
        relic_desc: "一根量步距用的细杖，上面刻着尺度。"
        points:
          p1: '盘缠见底的时候，护住测量队的行程，让测绳按期铺到西别'
          p2: '帮他把一段海岸从步测换成用绳量，让那一段的数先准起来'
          p3: '帮他把测绳从西别再往前铺一段，让这一趟多测一截没测到的海岸'
        points_fail:
          p1: '队伍在西别之前就撑不下去回了头，回到江户也画不出那一路的图。'
          p2: '这条分支里，虾夷地的每一段仍只是步数。'
          p3: '测量照旧在西别回头，这条分支与历史一样。'
        shift:
          p2:
            was: '第一次测量全靠步测，第二次起才用间绳。'
            now: '虾夷地有一段海岸先用上了绳。'
          p3:
            was: '第一次测量到西别为止，北海道其余的海岸要等以后的测量补上。'
            now: '测绳越过西别又往前铺了一段，回到江户的那几张图上多了一截海岸。'
        vignettes:
          bend: '一处海湾眼看要被画进一条直线里，{staff}请他们在拐弯处再测一次方位，那个弯就留在了纸上。'
          repeat: '{staff}用同样的步子把一段路又走了一遍，两次的步数并排记着，没去挑哪一个。'
          sketch: '众人歇脚时，{staff}在计数单背面画了一个岬角的轮廓，标出测绳铺在哪里。'
text:
  en:
    name: "Ino Tadataka"
    text: "Japanese surveyor, born 1745, died 1818. He took up astronomy and surveying after fifty, from 1800 walked the coasts of Japan, and led the making of an accurate map of the country."
  zh:
    name: "伊能忠敬"
    text: "日本的测量家，1745 年生，1818 年去世。50 岁以后学习天文和测量，1800 年起走遍日本海岸，主持绘制了精度很高的全国地图。"
hook: {en: 'Do three stretches of road make one straight coast?', zh: '拐过两回，还能画成一条直线吗？'}
facts:
  set_out:
    date: '1800-06-11'
    stay_day: 0
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ino_tadataka_ezo_survey, nippon_ino]
    text:
      en: 'The first survey set out from Edo on 11 June 1800 with five members, bound for Ezo.'
      zh: '第一次测量于 1800 年 6 月 11 日从江户出发，一行五人，前往虾夷地。'
    line:
      en: '11 June 1800: Ino Tadataka and four others set out from Edo for Ezo.'
      zh: '1800 年 6 月 11 日，伊能忠敬一行五人从江户出发，去测量虾夷地。'
  coast:
    date: '1800'
    stay_day: 60
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_ino, nippon_ino]
    text:
      en: 'In Ezo the party surveyed only the southeastern coast, spending about six months on the island.'
      zh: '测量队在虾夷地只测了东南沿岸，在岛上待了约半年。'
    line:
      en: 'On Ezo the party measures its way along the southeastern coast.'
      zh: '在虾夷地，测量队沿着东南海岸一段一段测过去。'
  death:
    date: '1818'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wikipedia_ino, nippon_ino]
    text:
      en: 'He died in 1818. His death was kept quiet for a time so that the map work could go on.'
      zh: '他于 1818 年去世，死讯一度被隐瞒，好让地图的工作继续下去。'
    note: 'Death: written as a plain fact.'
    line:
      en: '1818: Ino Tadataka dies. For a while nobody announces it, so the work on the maps can go on.'
      zh: '1818 年，伊能忠敬去世。死讯一时没有公布，地图的工作就还能接着做。'
  map:
    date: '1821'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_ino, nippon_ino]
    text:
      en: 'In 1821 Takahashi Kageyasu and other cartographers completed the maps of the coasts of Great Japan.'
      zh: '1821 年，高桥景保等测绘者完成了《大日本沿海舆地全图》。'
    line:
      en: '1821: Takahashi Kageyasu and the others finish the maps of the coasts of Great Japan.'
      zh: '1821 年，高桥景保等人完成了《大日本沿海舆地全图》。'
