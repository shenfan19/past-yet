    text:
      en:
        name: 'The bend left out of the line'
        place: "Hokkaido"
        figure: "Ino Tadataka"
        story: 'The Inō Tadataka Museum dates Inō’s first survey, through northeastern Honshū and southern Hokkaidō, to 1800. His team recorded distances and directions. The finished national maps were presented in 1821, after his death. The crew helper and the route used to check the notes are fictional.'
        relic: "A measuring staff"
        relic_desc: "A thin staff for measuring paces, marked with a scale."
        points:
          p1: 'Carry the distance notes as far as the next turning point'
          p2: 'Check the change of bearing before joining two stretches'
          p3: 'Keep the segments in order until they are transferred to the sketch'
        vignettes:
          bend: 'The survey helper has added the lengths of three stretches and drawn a single line. You copy each bearing beside its length. Once the turns are restored, the last mark sits off to the side. You take two sketches home. The national map is still years away.'
          repeat: 'You go back to the turn where the note was taken and ask the helper to face the next stretch again. He had read from the direction of return. You mark an arrow at the bend and correct his direction. You are not there for the next survey season.'
          sketch: 'You put the length and direction of each stretch on the same line. The helper can redraw the walk when the coast is no longer in sight. You carry the little bend home. The finished map will need many more such sheets.'
      zh:
        name: '被直线吞掉的转弯'
        place: "北海道"
        figure: "伊能忠敬"
        story: '伊能忠敬纪念馆的年表记载，伊能队 1800 年首次测量，走过本州东北和北海道南部。队伍记录距离与方位。全国地图到他去世后的 1821 年才完成呈交。卡里的测量帮手和核对路线是虚构的。'
        relic: "一根测杖"
        relic_desc: "一根量步距用的细杖，上面刻着尺度。"
        points:
          p1: '把测距的记录带到下一个转折点'
          p2: '接两段路前先核对偏转了哪个方向'
          p3: '誊到草图上以前，按顺序看住各段记录'
        vignettes:
          bend: '帮手把三段路的长度加起来，画成一条直线。你给每段长度旁补上方位。转弯画回来，最后一个点落在偏侧。你带回两张对照图，全国地图还要等许多年。'
          repeat: '你回到记数的路口，请帮手再面向下一段。他方才照回头的方向记了。你在拐处画个箭头，把方位改回来。下一季出门测量时，你就不在了。'
          sketch: '你把每段路的长度和方向写到同一行。看不见海岸时，帮手还能照条子画出走过的路。你把这一处拐弯带回去，要成图还得许多页。'
text:
  en:
    name: "Ino Tadataka"
    text: "Japanese surveyor, born 1745, died 1818. He took up astronomy and surveying after fifty, from 1800 walked the coasts of Japan, and led the making of an accurate map of the country."
  zh:
    name: "伊能忠敬"
    text: "日本的测量家，1745 年生，1818 年去世。50 岁以后学习天文和测量，1800 年起走遍日本海岸，主持绘制了精度很高的全国地图。"
hook: {en: 'Do three stretches of road make one straight coast?', zh: '拐过两回，还能画成一条直线吗？'}
