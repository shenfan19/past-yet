text:
  en:
    name: "Ino Tadataka"
    text: "Japanese surveyor, born 1745, died 1818. He took up astronomy and surveying after fifty, from 1800 walked the coasts of Japan, and led the making of an accurate map of the country."
  zh:
    name: "伊能忠敬"
    text: "日本的测量家，1745 年生，1818 年去世。50 岁以后学习天文和测量，1800 年起走遍日本海岸，主持绘制了精度很高的全国地图。"
hook: {en: 'Do three stretches of road make one straight coast?', zh: '拐过两回，还能画成一条直线吗？'}
quotes:
  ino_echo_yoshioka:
    order: 1
    tier: full
    date: '1800-07-14'
    checked: official_record
    sources: [ino_fukushima_letter_diary]
    original: ja
    text:
      ja:
        who: '伊能忠敬'
        quote: '松前より上み三里吉岡と申す川岸へ着船夫に上り一夜宿候'
        occasion: '長男・景敬への書状、寛政十二年五月二十三日'
      en:
        who: 'Inō Tadataka'
        quote: 'We put in at a riverbank called Yoshioka, three ri beyond Matsumae, went ashore and lodged for the night.'
        occasion: 'letter to his eldest son Kagetaka on landing at Yoshioka (game translation)'
      zh:
        who: '伊能忠敬'
        quote: '船驶至松前三里外一个叫吉冈的河岸，我们在那里上岸，住了一夜。'
        occasion: '致长子景敬的信，记述在吉冈登岸（游戏译文）'
      zh-Hant:
        who: '伊能忠敬'
        quote: '船駛至松前三里外一個叫吉岡的河岸，我們在那裡上岸，住了一夜。'
        occasion: '致長子景敬的信，記述在吉岡登岸（遊戲譯文）'
      fr:
        who: 'Inō Tadataka'
        quote: 'Nous nous arrêtâmes au bord d''une rivière appelée Yoshioka, trois ri au-delà de Matsumae, débarquâmes et passâmes la nuit.'
        occasion: 'lettre à son fils aîné Kagetaka lors de son atterrissage à Yoshioka (traduction du jeu)'
      es:
        who: 'Ino Tadataka'
        quote: 'Llegamos a la orilla de un río llamado Yoshioka, tres ri más allá de Matsumae, desembarcamos y nos hospedamos para pasar la noche.'
        occasion: 'carta a su hijo mayor Kagetaka al aterrizar en Yoshioka (traducción del juego)'
      ko:
        who: '이노 다다타카'
        quote: '우리는 마쓰마에에서 3리 떨어진 요시오카라는 강둑에 배를 대고 상륙하여 하룻밤을 묵었습니다.'
        occasion: '요시오카 상륙 시 장남 카게타카에게 보낸 편지(게임 번역)'
      ru:
        who: 'Ино Тадатака'
        quote: 'Мы причалили на берегу реки Ёсиока, в трех ри от Мацумаэ, сошли на берег и остановились на ночлег.'
        occasion: 'письмо своему старшему сыну Кагетаке после приземления в Ёсиоке (перевод игры)'
  ino_echo_same_wind:
    order: 2
    tier: none
    date: '1800'
    checked: official_record
    sources: [ino_fukushima_letter_diary]
    original: ja
    text:
      ja:
        who: '伊能忠敬'
        quote: '同廿日朝四ツ頃迄風待致候へ共 同風にて致方無之陸地一里余福島へ行'
        occasion: '忠敬先生日記、寛政十二年五月二十日'
      en:
        who: 'Inō Tadataka'
        quote: 'On the twentieth we waited for the wind until around the morning hour of Four. It did not change, so we went overland a little more than one ri to Fukushima.'
        occasion: 'survey diary, twentieth day of the fifth lunar month; hour in Edo-period timekeeping (game translation)'
      zh:
        who: '伊能忠敬'
        quote: '二十日早晨，等风等到四时前后。风向没有变，只好走陆路，行一里有余到福岛。'
        occasion: '《忠敬先生日记》，宽政十二年农历五月二十日；原文四时为江户时制（游戏译文）'
      zh-Hant:
        who: '伊能忠敬'
        quote: '二十日早晨，等風等到四時前後。風向沒有變，只好走陸路，行一里有餘到福島。'
        occasion: '《忠敬先生日記》，寬政十二年農曆五月二十日；原文四時為江戶時制（遊戲譯文）'
      fr:
        who: 'Inō Tadataka'
        quote: 'Le 20, nous avons attendu le vent jusqu''à environ quatre heures du matin. Cela n''a pas changé, alors nous avons parcouru un peu plus d''un ri par voie terrestre jusqu''à Fukushima.'
        occasion: 'journal d''enquête, vingtième jour du cinquième mois lunaire ; heure dans le chronométrage de la période Edo (traduction du jeu)'
      es:
        who: 'Ino Tadataka'
        quote: 'El día veinte esperamos el viento hasta las cuatro de la madrugada. No cambió, así que viajamos por tierra un poco más de un ri hasta Fukushima.'
        occasion: 'diario de encuesta, vigésimo día del quinto mes lunar; hora en el cronometraje del período Edo (traducción del juego)'
      ko:
        who: '이노 다다타카'
        quote: '20일에는 새벽 4시쯤까지 바람이 불기를 기다렸습니다. 변함이 없어서 육로로 1리 조금 넘게 후쿠시마로 갔습니다.'
        occasion: '조사 일기, 음력 5월 20일; 에도 시대의 시간 표시(게임 번역)'
      ru:
        who: 'Ино Тадатака'
        quote: 'Двадцатого числа мы ждали ветра примерно до четырёх утра. Оно не изменилось, поэтому мы прошли по суше чуть больше одного ри до Фукусимы.'
        occasion: 'дневник обследований, двадцатый день пятого лунного месяца; час в хронометрии периода Эдо (перевод игры)'
facts:
  set_out:
    date: '1800-06-11'
    stay_day: 0
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ino_katori_first_survey]
    text:
      en: 'The first survey set out from Edo on 11 June 1800. The Ino Tadataka Museum counts six people on the expedition, including Ino.'
      zh: '第一次测量于 1800 年 6 月 11 日从江户出发。伊能忠敬纪念馆记同行共六人，包括伊能忠敬本人。'
    line:
      en: '11 June 1800: Ino Tadataka and the survey party leave Edo for Ezo.'
      zh: '1800 年 6 月 11 日，伊能忠敬与测量队从江户出发，前往虾夷地。'
      ja: '1800年6月11日、伊能忠敬と測量隊は蝦夷地へ向けて江戸を出発した。'
      zh-Hant: '1800 年 6 月 11 日，伊能忠敬與測量隊從江戶出發，前往蝦夷地。'
      fr: '11 juin 1800 : Ino Tadataka et l''équipe d''enquête quittent Edo pour Ezo.'
      es: '11 de junio de 1800: Ino Tadataka y el grupo de reconocimiento abandonan Edo hacia Ezo.'
      ko: '1800년 6월 11일: 이노 다다타카와 조사대는 에도를 떠나 에조로 향했습니다.'
      ru: '11 июня 1800 года: Ино Тадатака и исследовательская группа покидают Эдо и направляются в Эдзо.'
  coast:
    date: '1800'
    stay_day: 60
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ino_katori_first_survey, ino_katori_first_map]
    text:
      en: 'The party surveyed the southern coast of Ezo as far as Nishibetsu, then returned by the same route. The complete expedition from Edo and back took 180 days.'
      zh: '测量队沿虾夷地南部海岸测到西别，再循原路折返。从离开江户到返回，整趟测量共历时 180 天。'
    line:
      en: '1800: on Ezo the survey party follows the southern coast as far as Nishibetsu.'
      zh: '1800 年，测量队沿虾夷地南部海岸一路量到西别。'
      ja: '1800年、一行は蝦夷地の南の海岸を西別まで測った。'
      zh-Hant: '1800 年，測量隊沿蝦夷地南部海岸一路量到西別。'
      fr: '1800 : sur Ezo, l''équipe d''arpentage suit la côte sud jusqu''à Nishibetsu.'
      es: '1800: en Ezo el grupo de reconocimiento recorre la costa sur hasta Nishibetsu.'
      ko: '1800년: 에조(Ezo)에서 조사대는 남쪽 해안을 따라 니시베츠(Nishibetsu)까지 이동했습니다.'
      ru: 'В 1800 году на Эдзо отряд землемеров следует по южному побережью до Нисибэцу.'
  death:
    date: '1818'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [wikipedia_ino, nippon_ino]
    text:
      en: 'He died in 1818. His death was kept quiet for a time so that the map work could go on.'
      zh: '他于 1818 年去世，死讯一度被隐瞒，好让地图的工作继续下去。'
    note: 'Death: written as a plain fact.'
    line:
      en: '1818: Ino Tadataka dies. For a while nobody announces it, so the work on the maps can go on.'
      zh: '1818 年，伊能忠敬去世。死讯一时没有公布，地图的工作就还能接着做。'
      ja: '1818年、伊能忠敬が死去した。地図の作業を続けるため、しばらく死は公表されなかった。'
      zh-Hant: '1818 年，伊能忠敬去世。死訊一時沒有公佈，地圖的工作就還能接著做。'
      fr: '1818 : Décès d''Ino Tadataka. Pendant un moment, personne ne l''annonce, le travail sur les cartes peut donc continuer.'
      es: '1818: Muere Ino Tadataka. Durante un tiempo nadie lo anuncia, por lo que el trabajo en los mapas puede continuar.'
      ko: '1818년: 이노 다다타카가 사망. 한동안 아무도 이를 발표하지 않으므로 지도 작업은 계속될 수 있습니다.'
      ru: '1818: Умирает Ино Тадатака. Пока об этом никто не объявляет, поэтому работа над картами может продолжаться.'
  map:
