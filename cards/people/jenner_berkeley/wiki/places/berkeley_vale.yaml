text:
  en:
    name: Berkeley, 1796
    text: A market town in the Vale of Berkeley in Gloucestershire, where Edward Jenner practised as a country doctor. Berkeley in the game is a village model of about three hundred people.
  zh:
    name: 伯克利，1796
    text: 格洛斯特郡伯克利谷的一个集镇，爱德华·詹纳在这里做乡村医生。游戏里的伯克利是一个约三百人的村庄模型。
