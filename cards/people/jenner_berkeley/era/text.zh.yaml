  modest: '{staff} 在伯克利待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人陪着那些病人。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把他需要听到的话告诉了他。
  perfect:
    - trait: kind
      text: 我能救今天的病人，救不了明天的。
    - trait: curious
      text: 原来是这样，挤奶女工说得没错。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，信不信由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 口罩和清洁用品剩下了。限制不是物资，是村子对你的信任。先让员工帮病人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进门。
  ally_gap: 詹纳的证据还很薄。手册能帮他，前提是员工花时间和他在一起。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
