        - game
      text:
        en:
          name: The first cowpox inoculation
          text: On 14 May 1796 Edward Jenner inoculated a boy with matter from cowpox sores and later tested whether the boy was protected from smallpox. By the standards of today that test is not allowed. In the game an employee can help bring it earlier, which holds only in this branch.
        zh:
          name: 第一次牛痘接种
          text: 1796 年 5 月 14 日，爱德华·詹纳把牛痘疮里的物质接种给一个男孩，后来又试了男孩是否受到天花的保护。按今天的标准，这样的试验不会被允许。游戏里员工能帮着让它提前，只在这条分支里成立。
