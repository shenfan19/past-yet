era_text:
  en:
    name: Berkeley, 1796
    short: Berkeley
    place_name: Berkeley, Gloucestershire
    tags:
      - medical
      - infection
      - smallpox
      - c18
      - england
      - history
    event_titles:
      expedition_handoff: 'Who said it first?'
      time_strain: Time slip
    plots:
      case_book:
        name: Give Jenner a printed case book
        desc: Lets him set down each case in the same form so that others can check it.
        character: Edward Jenner
        article: people:jenner_berkeley
      germ_theory:
        name: Explain germ theory to Jenner
        desc: Needs the craft of microbiology, which this era does not have.
        character: Edward Jenner
        article: people:jenner_berkeley
    blurb: Smallpox in a country village, an old rumour about milkmaids, and a country doctor who wants to test it. Close, cheap, and the effect of nursing and isolation is clear.
    handle_label: First cowpox inoculation
    protagonist: Edward Jenner
    protagonist_role: A country doctor who has heard for years that cowpox protects, and has not yet tried it
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: Smallpox was a common and feared disease in the villages of eighteenth century England, and about three in ten of those who caught the severe form died.
          check: true
        - text: Country people said that milkmaids who had caught cowpox did not catch smallpox.
          check: true
        - text: On 14 May 1796 Edward Jenner inoculated a boy with matter from cowpox sores, and later tested whether the boy was protected.
          check: true
        - text: Jenner published his results in 1798, and the practice spread through the following years.
          check: true
      regret:
        - You can save today's patients but not tomorrow's. On the main timeline the first inoculation was on 14 May.
        - The test was made on a child, by the standards of the day. Today it would not be allowed.
    events:
      expedition_handoff: '{staff} asks Martha to repeat the message slowly while Alice writes down who spoke. The visitor collecting that day’s notes has already left.'
      expedition_send: '{staff} sends the dated note with Martha. Alice flags the sentence that still needs to be checked against the family’s words.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: "Convince Jenner"
      trust: "Win the trust of the village"
      reform: 'Advance the simulated schedule'
    milestones:
      case_xvii: '{date}: Jenner dates the beginning of his cowpox case study involving the boy later identified as James Phipps.'
      case_followup: '{date}: About a week later, Jenner’s account records a first complaint in his follow-up with the boy.'
      first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
      first_protect: '{date}: {staff} hands out the first masks and washes down a few rooms, and teaches the household to keep the sick apart.'
      met_jenner: '{date}: {staff} is received by Jenner.'
      jenner_trusts: '{date}: Jenner gives {staff} the notes to work from.'
      jenner_convinced: '{date}: Jenner takes up the plan that {staff} put to him.'
      board_moves: '{date}: Word goes round that the plan might change.'
      reform_history: '{date}: The simulation sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The simulation records the Berkeley case paperwork {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: People in the village no longer keep {staff} out, and some knock on their own.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of patients falls to single digits.'
    summary:
      near_death: '{staff} collapses on a village lane and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} brought the simulated schedule forward by {advance_days:1} days in this branch.'
      perfect: '{staff} completed the task in Berkeley and came back safe. The simulation records {base_D:i} deaths in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away at the door again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days in Berkeley, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was sitting with the sick at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told him what he needed to hear.
      perfect:
        - trait: kind
          text: I could save today's patients, not tomorrow's.
        - trait: curious
          text: So that is how it is, the milkmaids were right.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they believe it is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Masks and cleaning supplies were left over. The limit was the trust of the village, not the supplies.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or patients were not let in.
      ally_gap: Jenner's evidence is still thin. The handbook helps him, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    name: 伯克利 1796
    short: 伯克利
    place_name: 格洛斯特郡伯克利
    tags:
      - medical
      - infection
      - smallpox
      - c18
      - england
      - history
    event_titles:
      expedition_handoff: '这句话是谁说的？'
      time_strain: 时间错位
    plots:
      case_book:
        name: 送詹纳一本印好的病例册
        desc: 让他把每个病例按同一格式记下来，别人才能核对。
        character: 爱德华·詹纳
        article: people:jenner_berkeley
      germ_theory:
        name: 把细菌致病的理论讲给詹纳
        desc: 需要微生物学的工艺，这个时代还没有。
        character: 爱德华·詹纳
        article: people:jenner_berkeley
    blurb: 乡村里的天花，一个关于挤奶女工的老说法，和一位想试一试的乡村医生。近，成本低，护理和隔离的效果很明显。
    handle_label: 第一次接种牛痘
    protagonist: 爱德华·詹纳
    protagonist_role: 听了多年牛痘能防天花的说法、却还没试过的乡村医生
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: 十八世纪英国乡村里天花常见又可怕，得重症的人大约三成会死。
          check: true
        - text: 乡下人说，得过牛痘的挤奶女工不会得天花。
          check: true
        - text: 1796 年 5 月 14 日，爱德华·詹纳把牛痘疮里的物质接种给一个男孩，后来又试了男孩是否受到保护。
          check: true
        - text: 詹纳 1798 年发表了结果，此后几年这种做法传开了。
          check: true
      regret:
        - 你能救今天的病人，救不了明天的。主时间线上第一次接种在 5 月 14 日。
        - 按今天的标准，那次试验是拿一个孩子做的，现在不会被允许。
    events:
      expedition_handoff: '{staff} 请玛莎慢慢复述口信，艾丽丝记下说话的是谁。当天来收记录的人已经离开。'
      expedition_send: '{staff} 请玛莎先把带日期的字条送出。艾丽丝标出还要向家里人核实的那一句。'
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      convince: "说服詹纳"
      trust: "赢得村子的信任"
      reform: '提前模拟中的安排'
    milestones:
      case_xvii: '{date}，詹纳把这项牛痘案例的起始日期记在这一天。案例中的男孩后来被确认为詹姆斯·菲普斯。'
      case_followup: '{date}，约一周后，詹纳记下了男孩在后续观察中第一次说身体不适。'
      first_treat: '{date}：{staff} 调好第一杯补液盐，一位病人开始说话了。'
      first_protect: '{date}：{staff} 发下第一批口罩，擦洗了几间屋子，教这家人把病人隔开。'
      met_jenner: '{date}：{staff} 被詹纳接见。'
      jenner_trusts: '{date}：詹纳把笔记交给 {staff} 用。'
      jenner_convinced: '{date}：詹纳采纳了 {staff} 提出的办法。'
      board_moves: '{date}：消息传开，计划也许要改。'
      reform_history: '{date}，模拟按模型基准日调整安排。'
      reform_early: '{date}，模拟记录伯克利案例的文书，比模型基准提前 {advance_days:1} 天。'
      trust_won: '{date}：村里的人不再把 {staff} 挡在外面，有的还自己来敲门。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：病人数降到了个位数。'
    summary:
      near_death: '{staff} 在村道上倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在这条虚构分支中把模拟安排提前了 {advance_days:1} 天。'
      perfect: '{staff} 在伯克利完成了任务，平安回来。模拟基准死亡 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒之门外，最后带着一个笑话逃了回来。'
      modest: '{staff} 在伯克利待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人陪着那些病人。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他需要听到的话告诉了他。
      perfect:
        - trait: kind
          text: 我能救今天的病人，救不了明天的。
        - trait: curious
          text: 原来是这样，挤奶女工说得没错。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，信不信由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 口罩和清洁用品剩下了。限制不是物资，是村子对你的信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进门。
      ally_gap: 詹纳的证据还很薄。手册能帮他，前提是员工花时间和他在一起。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

