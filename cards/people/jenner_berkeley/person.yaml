    text:
      en:
        name: The first vaccine
        place: Berkeley, England
        figure: Edward Jenner
        story: 'Jenner''s 1798 Inquiry records earlier observations and cases concerning cowpox and smallpox.'
        story_prose:
          opening:
            - 'In Berkeley, Sarah Nelmes comes to the door with her wrapped hand against her apron. Jenner wants to ask when she first became ill. The copyist puts her name under someone else’s account. She waits by the door and asks first whether she has to go back to the dairy that day.'
            - 'Jenner’s 1798 Inquiry records Sarah’s cowpox and an early vaccination in 1796, traditionally associated with James Phipps. In this branch you can begin with the care Sarah wants and help make later observations traceable to the people who came back.'
            - 'Have someone with care experience hear Sarah first. A traveller who keeps records can check the names and dates while Jenner and the families decide whether to return for more observation.'
          points:
            p1: 'The copyist is waiting for a date. Sarah draws her hand back and asks for a seat. You move a chair to the door and ask if she wants a caregiver to look. Once she says yes, you send word to the dairy that she will be back later. On her way out, Sarah still has a hand free to take the slip with her own name on it.'
            p2: 'A page of Jenner’s notebook describes the boy’s return visit, with no date yet written below it for a check. You give the copyist a new sheet for separating first-hand records from later reports. Jenner asks who will come back for further observation. One household leaves its address. The copyist enters the date and leaves a line for them to check it on arrival.'
          outcomes:
            all: 'Sarah has someone to help with her hand and the people who return have records that can be checked. Jenner can keep working through that year’s observations.'
            p1: 'Sarah can take a few days before returning to the dairy. The later records still depend on other people coming back.'
            p2: 'There are follow-up observations to consult. Sarah still has to put up with the sore hand on her own.'
          none: 'Sarah returns to the dairy without help, and nobody arranges the later observations.'
          not_admitted: 'The copyist checks which family the visitor has come with. You stay outside and the space by the date is still blank.'
          excerpts:
            p1: 'On her way out, Sarah still has a hand free to take the slip with her own name on it.'
            p2: 'The copyist enters the date and leaves a line for them to check it on arrival.'
        relic: A follow-up slip
        relic_desc: A slip with a name, a date, and room to write what was observed.
        points:
          p1: 'Dress the cowpox sores on Sarah Nelmes''s hand, so the milkmaid does not suffer them alone'
          p2: 'Check the names and dates in the early case notes, and arrange follow-up with families who agree to return'
        points_fail:
          p1: 'The sores on her hand ran their course with nobody to dress them. In this branch nobody eased the milkmaid''s days.'
          p2: 'Nobody arranges a return visit. In this branch, as in history, Jenner resumes his vaccination research in 1798.'
        shift:
          p1:
            was: 'In May 1796 the dairymaid Sarah Nelmes caught cowpox from her master''s cows, and a large pustular sore formed on her hand with the usual symptoms of the disease.'
            now: '{staff} kept her hand clean and bound, and she was back at the dairy a few days sooner.'
          p2:
            was: 'After the early case in 1796, Jenner resumed his vaccination research in the spring of 1798.'
            now: '{staff} helped arrange return visits with willing families. That summer Jenner had follow-up notes to check against the earlier observations.'
            who: jenner_berkeley
            bio: 'In this timeline Jenner received follow-up notes from families who had agreed to come back in the summer of 1796.'
        vignettes:
          firsthand: 'A fictional copyist has written every account in the same voice. You ask which one the writer actually saw. The copyist adds a note beside the rest rather than giving every line the same weight.'
          order: 'Two observations have traded places in the copy. You check the dates, and the copyist reverses the slips before using the order to tell a story.'
          blank: 'You leave room under a note the copyist cannot confirm. By the time the page is passed on, the blank has a label so no one mistakes it for an omission.'
      zh:
        name: 第一支疫苗
        place: 英国伯克利
        figure: 爱德华·詹纳
        story: '詹纳 1798 年出版的《探究》回顾了较早的牛痘与天花观察和病例。'
        story_prose:
          opening:
            - '伯克利，萨拉·内尔姆斯到了屋门口，把裹过的手搁在围裙上。詹纳想问她从哪天开始病，抄写人却误把她的名字写到旁人的条目下。她站着等，想先说今天还要不要去奶场。'
            - '1798 年，詹纳出版研究，回顾萨拉患牛痘的经过及 1796 年的一次早期接种。传统上与接种有关的孩子是詹姆斯·菲普斯。这一趟先听萨拉自己想要什么照护，再帮后来观察留下能核对的记录。'
            - '懂照护的员工先去听萨拉说。擅长整理记录的人再把各份病例按姓名和来访日期核对，由家人及詹纳商量是否继续观察。'
          points:
            p1: '抄写人在等日期，萨拉把手收回来，说先要有地方坐。你把椅子移到门边，问她想不想请照护者看看手。等她自己答应，你替她传话给奶场，让她晚些再回去。萨拉离开前还能腾出另一只手，自己拿走写着名字的那张纸。'
            p2: '詹纳的笔记里有一页写着孩子回访的结果，下面还没留核对的日期。你把新页交给抄写人，让他分开当事人的记录和后来听来的说法。詹纳问后续观测谁还愿意回来，一户家人先留下了自己的地址。抄写人把日期填好，空出一行等他们到后自己确认。'
          outcomes:
            all: '萨拉手上的不便有人照应，之后回访也有可核的记录。詹纳可以继续整理这一年的观察。'
            p1: '萨拉能歇几天再回奶场。后续的病例记录仍要等别的来访者。'
            p2: '早期观察之后还有可查的回访。萨拉手上的疮仍是她自己慢慢熬过去。'
          none: '萨拉回到奶场时没有等到照护，后续观察也未约下来。'
          not_admitted: '抄写人先问你跟哪一家的预约来。你没进门，那张日期旁还留着空白。'
          excerpts:
            p1: '萨拉离开前还能腾出另一只手，自己拿走写着名字的那张纸。'
            p2: '抄写人把日期填好，空出一行等他们到后自己确认。'
        relic: 一张回访便笺
        relic_desc: 纸上写着姓名和日期，还留着一行记回访所见。
        points:
          p1: '替挤奶女工萨拉·内尔姆斯包扎手上的牛痘疮，不让她一个人硬熬'
          p2: '核对早期病例记录上的姓名和日期，给愿意回访的家人约好时间'
        points_fail:
          p1: '她手上的疮没人照料，自己慢慢熬过去，这条分支里没有人让她少受几天罪。'
          p2: '没有人安排回访。这条分支里，詹纳和史实一样，到 1798 年才继续接种研究。'
        shift:
          p1:
            was: '1796 年 5 月，挤奶女工萨拉·内尔姆斯从主人家的牛身上染上牛痘，手上长出一大块脓疱，也有这病常见的症状。'
            now: '{staff}替她把手洗净包好，她早几天回到了奶场。'
          p2:
            was: '1796 年的早期病例之后，詹纳到 1798 年春才继续接种研究。'
            now: '{staff}替愿意回访的家人约好了时间。那个夏天，詹纳就拿到了可以与先前记录互相核对的回访便笺。'
            who: jenner_berkeley
            bio: '在这条时间线里，1796 年夏天詹纳收到了自愿回访的家人留下的观察记录。'
        vignettes:
          firsthand: '虚构的誊写员把每则记载都誊成了同一种口气。你问哪一件是记述者亲眼见过的。他在其余条目旁补上说明，没把每一行都当成同一等证据。'
          order: '抄件里两条观察换了位置。你核对日期，誊写员先把纸签调回来，才照先后讲述。'
          blank: '誊写员有一条无法确定，你在下面留了地方。纸递出去以前，空白旁添上说明，免得后来人当成漏抄。'
text:
  en:
    name: Edward Jenner
    text: English physician, 1749 to 1823, of Berkeley in Gloucestershire. In 1796 he inoculated a boy with cowpox and showed that it protected against smallpox, the beginning of vaccination.
  zh:
    name: 爱德华·詹纳
    text: 英国医生，1749 年生，1823 年去世，格洛斯特郡伯克利人。1796 年他给一个男孩接种牛痘，证明它能预防天花，这是疫苗接种的开端。
