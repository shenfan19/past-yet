      trust: "赢得村子的信任"
      reform: '提前模拟中的安排'
    milestones:
      case_xvii: '{date}，詹纳把这项牛痘案例的起始日期记在这一天。案例中的男孩后来被确认为詹姆斯·菲普斯。'
      case_followup: '{date}，约一周后，詹纳记下了男孩在后续观察中第一次说身体不适。'
      first_treat: '{date}：{staff} 调好第一杯补液盐，一位病人开始说话了。'
      first_protect: '{date}：{staff} 发下第一批口罩，擦洗了几间屋子，教这家人把病人隔开。'
      met_jenner: '{date}：{staff} 被詹纳接见。'
      jenner_trusts: '{date}：詹纳把笔记交给 {staff} 用。'
      jenner_convinced: '{date}：詹纳采纳了 {staff} 提出的办法。'
      board_moves: '{date}：消息传开，计划也许要改。'
      reform_history: '{date}，模拟按模型基准日调整安排。'
      reform_early: '{date}，模拟记录伯克利案例的文书，比模型基准提前 {advance_days:1} 天。'
      trust_won: '{date}：村里的人不再把 {staff} 挡在外面，有的还自己来敲门。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：病人数降到了个位数。'
    summary:
      near_death: '{staff} 在村道上倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在这条虚构分支中把模拟安排提前了 {advance_days:1} 天。'
      perfect: '{staff} 在伯克利完成了任务，平安回来。模拟基准死亡 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒之门外，最后带着一个笑话逃了回来。'
      modest: '{staff} 在伯克利待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人陪着那些病人。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把他需要听到的话告诉了他。
      perfect:
        - trait: kind
          text: 我能救今天的病人，救不了明天的。
        - trait: curious
          text: 原来是这样，挤奶女工说得没错。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，信不信由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 口罩和清洁用品剩下了。限制不是物资，是村子对你的信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进门。
      ally_gap: 詹纳的证据还很薄。手册能帮他，前提是员工花时间和他在一起。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

