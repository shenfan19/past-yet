text:
  en:
    name: A life of questions
    place: Athens
    figure: Socrates
    story: Socrates spends his life asking what justice and virtue are, and at his trial chooses his questions over his safety.
    relic: A plain clay cup
    relic_desc: An ordinary cup, kept because of what the last evening was.
    points:
      p1: "Talk with him without being cornered"
      p2: "Be a familiar he does not tire of in the square"
      p3: "Stand through the afternoon of the trial"
  zh:
    name: 一生都在发问
    place: 雅典
    figure: 苏格拉底
    story: 苏格拉底一生都在追问正义和美德是什么，受审时他选择守住提问，而不是保全自己。
    relic: 一只朴素的陶杯
    relic_desc: 一只普通的杯子，被留下来，是因为那个最后的夜晚。
    points:
      p1: "与他对话而不被问倒"
      p2: "在广场上做他不嫌烦的熟人"
      p3: "站完整个审判的下午"
