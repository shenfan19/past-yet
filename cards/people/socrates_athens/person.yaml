    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, guard: true, day: 20, req: {"any":[{"trait":["bold","charismatic","calm"],"stat":{"will":7}},{"job":["union_organizer","teacher","radio_host"],"stat":{"will":6}},{"item":"golden_apple","stat":{"will":5}}]}}
