    text:
      en:
        name: 'What the court heard'
        place: Athens
        figure: Socrates
        story: 'In Plato’s Apology, Socrates distinguishes long-standing rumours about him from the charges at his trial, which include corrupting the young. Their notes are imagined; Plato’s account is a later literary source.'
        relic: 'The listener’s clay cup'
        relic_desc: 'A cup from the fictional pottery seller’s stall.'
        points:
          p1: 'Keep the public charges distinct from older rumors so listeners can hear Socrates make his own defense'
          p2: 'Ask two listeners to record the defense independently and leave gaps for anything they heard only secondhand'
          p3: 'Give friends who have permission to visit one short question each. Ask them to check the part of the defense they may have misunderstood'
        points_fail:
          p1: 'The charges and rumors are treated as the same claim and listeners leave before hearing the defense. The office recalls the employee.'
          p2: 'Two accounts are merged and a report from someone absent is filed as firsthand testimony.'
          p3: 'Friends pass on different interpretations. Their listeners can no longer ask Socrates what he meant.'
        shift:
          p1:
            was: 'Plato and Xenophon both describe the trial and defense of 399 BCE. Plato distinguishes the formal charges from older rumors.'
          p2:
            was: 'Plato and Xenophon give different accounts. No verbatim record of the trial survives.'
            now: 'Later readers can see which listener was present. Where the two accounts differ, both remain available.'
          p3:
            was: 'Ancient dialogues depict friends continuing to speak with Socrates in his last days. No written work by him survives.'
            now: 'Several friends bring out a brief note naming those present and the questions they checked. They still give their own accounts, but readers can trace what was clarified.'
            who: socrates_athens
            bio: 'What survives of the trial comes from later accounts written by different people. This branch follows what listeners heard and could verify.'
        vignettes:
          handoff: 'Kleio has to leave for her pottery stall before she can hear the speech through. You find her at the gate and let her recount the opening in her own order. She leaves a space for the portion she missed. Her brother will hear where she had to stop.'
          charges: 'Pheidon has put a market rumour at the top of his report as if it had been read to the court. You ask him to name its speaker. He can point to one man in the market and one voice inside. The report leaves their words on separate lines.'
          verdict: 'You know how this trial ends. Pheidon wants to hurry the news to someone who could not come. If you tell him now, he will repeat it as something the court has already decided. You give him only what has been heard so far. You will miss the moment he delivers it.'
      zh:
        name: '散庭后还剩哪句话'
        place: 雅典
        figure: 苏格拉底
        story: '柏拉图的《申辩篇》区分针对苏格拉底的旧传闻和庭上的正式控告，后者包括败坏青年。'
        relic: '听众的陶杯'
        relic_desc: '卖陶器人的摊上留下的一只杯子。'
        points:
          p1: '把集市上张贴的指控和较早的传言分开记，让来听的人留在庭上听到苏格拉底自己的辩说'
          p2: '请两名听过的人各自记一遍听见的答辩，哪些只听到转述就另留空栏'
          p3: '给获准探视的朋友准备简短问题，请他们当面向苏格拉底核对自己最可能听错的一处'
        points_fail:
          p1: '两种说法都被当成已提出的罪名，听众离开前没有听到他的答辩，事务所召回员工。'
          p2: '两份笔记合成时，把一位未到庭者的说法抄进了亲闻一栏。'
          p3: '朋友依各自理解把话转述出去，来听的人已不能问他是否有这个意思。'
        shift:
          p1:
            was: '柏拉图和色诺芬都写到前 399 年的审判与辩护。柏拉图区分正式指控与早先的传言。'
          p2:
            was: '柏拉图与色诺芬的叙述有不同形式和内容，现存材料并无逐字庭录。'
            now: '事后读到笔记的人能看见谁在哪段在场。听法不同的地方保留两种。'
          p3:
            was: '古代对话描绘朋友在最后一段时间继续和他谈话。苏格拉底没有著作传世。'
            now: '几位朋友带出一份注明在场者和所核问题的简录。各人还能继续写自己的理解，但有人追问时有一次可查的核对。'
            who: socrates_athens
            bio: '雅典审判留下的是后来作者各自写的辩护与记述。游戏分支把重点放在谁听到什么、能不能当面核对。'
        vignettes:
          handoff: '克莱奥急着回陶器摊，听不到辩词结束。你在门边找到她，请她照自己的次序说开头。她把没听见的那一段空了下来，弟弟听她复述时，会知道她听到哪儿就走了。'
          charges: '费冬把集市听来的闲话写在最上方，仿佛有人在庭上宣读过。你请他认一认证人。他指得出集市上的一个人，也说得出庭里听到的一把嗓音。两人的话分成两行才带走。'
          verdict: '你知道这场审判怎么收场。费冬急着把消息送给来不了的人。现在告诉他结局，他就会当成已经宣判去传。你只说到眼前听过的那一段，之后他怎样转述，你已赶不上了。'
text:
  en:
    name: Socrates
    text: Greek philosopher of Athens, 470 BC to 399 BC. He wrote nothing himself, and is known through Plato and Xenophon. He questioned fellow citizens about virtue, was tried on charges of impiety and corrupting the young, and died by drinking hemlock.
  zh:
    name: 苏格拉底
    text: 雅典的希腊哲学家，公元前 470 年生，公元前 399 年去世。他自己没有留下著作，后人通过柏拉图和色诺芬了解他。他向同胞追问美德，被控不敬神和败坏青年，饮毒芹汁而死。
hook: {en: 'What will you repeat when the court empties?', zh: '散庭后，你会复述哪一句？'}
