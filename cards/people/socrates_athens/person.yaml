    text:
      en:
        name: 'Before the ship comes back'
        place: Athens
        figure: Socrates
        story: 'In 399 BC Socrates was tried in Athens and sentenced to death. The ship Athens sent to Delos each year had just sailed, and no one could be put to death before it came home, so he waited about thirty days in prison. There he put fables of Aesop into verse, and his friends came to see him every day. On the last day they were all there except Plato, who was ill, and in the evening he drank the hemlock.'
        story_prose:
          opening:
            - 'Athens, 399 BC. Socrates has been charged with impiety and with corrupting the young, and is to stand trial before a jury. All his life he has questioned people in the streets and the agora, and he has written no book; later readers know him only through Plato and Xenophon.'
            - 'In history, the ship Athens sent to Delos sailed the day before the trial, and no one could be put to death until it came home, so he waited in prison about thirty days more. In those days, as a recurring dream had told him, he put fables of Aesop into verse, and the verses did not survive; on the last day his friends were all there, but Plato was ill and did not come. In this branch, a woman sells lamp oil by the prison wall, and a fishmonger at Piraeus sees every ship come in.'
            - 'Three kinds of people can help on this trip: someone who can steady a crowd when the shouting starts, someone who can take down verses and copy out a roll of them, and someone who knows medicine and can cure an illness.'
          outcomes:
            all: 'The ship came back from Delos, and the fishmonger saw its sail from far off. On the evening of the last day the prison was full of friends, and Plato sat among them. The roll of verses lay afterwards at the bottom of a chest in a house in Athens, and it lasted.'
            p3: 'On the evening of the last day the prison was full of friends, and Plato sat among them until the end.'
            p2: 'The roll of verses lay afterwards at the bottom of a chest in a house in Athens, and it lasted, its edges worn soft.'
            p1: 'Thirty days later the ship from Delos came into Piraeus, and the fishmonger saw its sail from far off. That day his friends were waiting at the prison door from first light.'
          none: 'The ship came back from Delos, and the fishmonger saw its sail from far off. In the evening the friends in the prison sat in a circle, and none of them spoke first.'
          desync: 'The uproar in the court rose higher and higher, and the defence broke off in the middle of a sentence. {staff} was recalled by the office before leaving the court.'
          not_admitted: '{staff} found no footing in Athens, not even the place to rest at the foot of the prison wall. The ship from Delos was still at sea.'
          points:
            p1: 'On the day of the trial the jurors filled row after row of wooden benches. Every few sentences a roar went up from them and drowned his voice. {staff} sat among the onlookers, and each time the noise rose, stood up without shouting, slowly pressed both hands downward and looked along the rows one by one, and sat down only when it had fallen. Socrates took up again from the half sentence where he had been cut off. When he had finished, he gathered the hem of his cloak and stood still on the platform.'
            p2: 'Light came into the prison only through a small window high in the wall. Socrates spoke a line and {staff} wrote it on a wax tablet, then read it back to him in time with the metre, and where there was a beat too many, smoothed the wax and wrote it again. The fables of Aesop became verses one by one, and last came the hymn to Apollo. At night, by the light of lamp oil at the foot of the wall, {staff} copied the tablets onto a roll of papyrus. Early next morning a friend who had come to visit tucked the roll inside his clothes, and as he walked out of the prison gate he kept one hand pressed to his chest.'
            p3:
              class_medical: 'On the night before the last day Plato was still ill, lying at home and unable to get up. {staff} examined him as a physician would, made up the medicine, gave it to him at the proper hours and did not leave the bedside all night. Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.'
              else: 'On the night before the last day Plato was still ill, lying at home and unable to get up. {staff} opened the nano medical kit, gave him the treatment as its instructions said, and did not leave the bedside all night. Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.'
          excerpts:
            p3: 'Before it was fully light he sat up by himself and tied his sandals in the dark. He threw on his cloak and went out with the friends hurrying to the prison, walking faster than they did.'
            p2: 'At night, by the light of lamp oil at the foot of the wall, {staff} copied the tablets onto a roll of papyrus. Early next morning a friend who had come to visit tucked the roll inside his clothes, and as he walked out of the prison gate he kept one hand pressed to his chest.'
            p1: 'Socrates took up again from the half sentence where he had been cut off. When he had finished, he gathered the hem of his cloak and stood still on the platform.'
        relic: 'A clay cup from the market'
        relic_desc: 'An Athenian cup with a black glaze and a small chip in the rim.'
        points:
          p1: 'When the clamour of the jurors keeps rising against him, keep the court quiet enough for him to finish his defence'
          p2: 'Help him finish the Aesop fables he is putting into verse in prison and the hymn to Apollo, and get a copy out of the prison'
          p3: 'Before the last day, cure Plato of his illness so that he can come to the prison and be with his teacher at the end'
        points_fail:
          p1: 'The noise drowns the defence and he cannot finish it. This branch has come loose from history, and the office recalls the employee.'
          p2: 'As in history none of the verses survives, and in this branch none does either.'
          p3: 'As in history Plato is ill that day and does not come; in this branch too he is not with his teacher.'
        shift:
          p1:
            was: '399 BC: Socrates was tried in Athens; in Plato''s Apology he asks the jurors again and again not to make a disturbance while he speaks, and he is found guilty and sentenced to death.'
          p2:
            was: '399 BC: waiting in prison for the execution, Socrates obeyed a recurring dream by putting Aesop''s fables into verse and composing a hymn to Apollo; none of it survives whole.'
            now: 'The verses were copied into a roll and carried out of the prison by a friend, and they stayed in Athens.'
          p3:
            was: '399 BC: on the day Socrates drank the hemlock in prison his friends were with him; Plato was ill and did not come.'
            now: 'Plato was well again and in the prison that day among the friends, and stayed to the end.'
            who: plato_academy
            bio: 'In this timeline Plato was cured of the illness that kept him away, and was in the prison with Socrates on his last day.'
        vignettes:
          rumours: 'The day before the trial {staff} asks three stalls in the agora what the old man is charged with and gets three different answers. {staff} writes all three down and waits to hear which one is read out in court.'
          harbour: 'Every evening {staff} walks down to the harbour at Piraeus and asks the fishmonger whether the ship from Delos is in yet. Every evening the answer is the same, and {staff} cannot say whether to hope it comes or hope it does not.'
          gate: '{staff} carries water for the woman who sells lamp oil by the prison wall, and is given a place to sit at the foot of the wall in return. The visitors wait at the door from first light each day, and {staff} comes to know their faces.'
      zh:
        name: '船回来之前'
        place: 雅典
        figure: 苏格拉底
        story: '前 399 年，苏格拉底在雅典受审，被判死刑。雅典每年派往提洛岛的船刚刚出发，船回港以前城里不处决人，他在狱中等了约三十天。这些日子里他把伊索寓言改写成诗，朋友们天天来看他。最后那天朋友们都在，只有柏拉图病了没来，傍晚他饮下了毒芹汁。'
        story_prose:
          opening:
            - '前 399 年，雅典。苏格拉底被控不敬神、败坏青年，要在陪审法庭受审。他一辈子在街头和集市上同人问答，自己没写下一本书，后人只能从柏拉图和色诺芬笔下认识他。'
            - '史实里，派往提洛岛的船审判前一天刚刚出发，船回港以前城里不行刑，他在狱中又等了约三十天。这些日子他照一个反复做的梦的吩咐，把伊索寓言改写成诗，那些诗没有传下来；最后那天朋友们都到了，柏拉图病着，没有来。在这条分支里，狱墙外有个卖灯油的女人，比雷埃夫斯港有个卖鱼的人，进港的船他都看得见。'
            - '这一趟用得上三种人：满场喧哗时稳得住人心的人，记得下诗句、抄得出一卷诗的人，懂医药、治得好一场病的人。'
          outcomes:
            all: '提洛岛的船回来了，卖鱼的人远远就看见了船帆。最后那天傍晚，狱里坐满了朋友，柏拉图也坐在里面。那卷诗后来压在雅典一户人家的箱底，一直留了下来。'
            p3: '最后那天傍晚，狱里坐满了朋友，柏拉图也坐在里面，一直待到最后。'
            p2: '那卷诗后来压在雅典一户人家的箱底，一直留了下来，纸边磨得起了毛。'
            p1: '三十天后，提洛岛的船进了比雷埃夫斯港，卖鱼的人远远就看见了船帆。那天，朋友们天一亮就等在狱门口。'
          none: '提洛岛的船回来了，卖鱼的人远远就看见了船帆。傍晚，狱里的朋友围坐成一圈，谁也没有先开口。'
          desync: '庭上的哄闹一阵高过一阵，申辩断在了半句上。{staff}还没走出法庭，就被事务所召了回来。'
          not_admitted: '{staff}在雅典没能落下脚，连狱墙外那块歇脚的地方也没有。提洛岛的船还在海上。'
          points:
            p1: '开庭那天，陪审员坐满了一排排木凳。他每讲几句，底下就哄起来一阵，盖过了他的声音。{staff}坐在旁听的人里，喧哗一起就站起身，不喊，只朝四周慢慢压了压手，一排一排看过去，等声音落了才坐下。苏格拉底从刚才断开的那半句接着往下讲。讲完，他把外袍的下摆拢了拢，在台上站定。'
            p2: '狱里只有高处一扇小窗透光。苏格拉底念一句，{staff}在蜡板上记一句，再照着节拍念回给他听，哪一处多出一拍，就抹平了重写。伊索的寓言一则则成了诗，最后是那首献给阿波罗的颂歌。夜里，{staff}在墙根下就着灯油，把蜡板上的字誊进一卷莎草纸。第二天一早，一位来探视的朋友把纸卷贴身揣好，走出狱门时，手一直按在胸口那一块。'
            p3:
              class_medical: '最后那天的前一晚，柏拉图还病着，躺在家里起不了身。{staff}照医生的规矩替他看了病，配好药，按时喂下，守在床边一夜没有离开。天还没亮透，他自己坐起来，摸黑系好了鞋带。他披上外衣，跟着往狱里赶的朋友出了门，走得比他们还快。'
              else: '最后那天的前一晚，柏拉图还病着，躺在家里起不了身。{staff}打开随身的纳米医疗箱，照说明替他用了药，守在床边一夜没有离开。天还没亮透，他自己坐起来，摸黑系好了鞋带。他披上外衣，跟着往狱里赶的朋友出了门，走得比他们还快。'
          excerpts:
            p3: '天还没亮透，他自己坐起来，摸黑系好了鞋带。他披上外衣，跟着往狱里赶的朋友出了门，走得比他们还快。'
            p2: '夜里，{staff}在墙根下就着灯油，把蜡板上的字誊进一卷莎草纸。第二天一早，一位来探视的朋友把纸卷贴身揣好，走出狱门时，手一直按在胸口那一块。'
            p1: '苏格拉底从刚才断开的那半句接着往下讲。讲完，他把外袍的下摆拢了拢，在台上站定。'
        relic: '集市上的陶杯'
        relic_desc: '一只雅典的黑釉陶杯，杯沿磕掉了一小块。'
        points:
          p1: '陪审席上的喧哗一阵阵压过来时，护住他把申辩讲完'
          p2: '帮他把狱中改写成诗的伊索寓言和献给阿波罗的颂歌写完，抄一份带出狱外'
          p3: '最后那天之前，治好病中的柏拉图，让他赶到狱中送老师最后一程'
        points_fail:
          p1: '喧哗盖过了申辩，他没能把话讲完，这条分支与历史脱了节，事务所召回员工。'
          p2: '这些诗照史实一首也没有传下来，这条分支里也没有。'
          p3: '那天柏拉图照史实病着没来，这条分支里他也没在老师身边。'
        shift:
          p1:
            was: '前 399 年，苏格拉底在雅典受审，柏拉图《申辩篇》里他一再请陪审员不要喧哗，把话听完；他被判有罪，判处死刑。'
          p2:
            was: '前 399 年，苏格拉底在狱中等待行刑时，照一个反复出现的梦的吩咐，把伊索寓言改写成诗，又作了一首献给阿波罗的颂歌；这些诗没有完整传下来。'
            now: '几首诗抄成一卷，由朋友带出狱门，留在了雅典。'
          p3:
            was: '前 399 年，苏格拉底在狱中饮毒芹去世那天，朋友们都在，柏拉图因病没来。'
            now: '柏拉图病好了，那天也在狱中，坐在朋友们中间，一直待到最后。'
            who: plato_academy
            bio: '这条时间线里，柏拉图那场病治好了，苏格拉底最后一天，他在狱中陪着老师。'
        vignettes:
          rumours: '开庭前一天，集市上卖橄榄的、卖陶罐的都在说这件事。{staff}问了三个摊子，这老头犯的是什么事，得了三种说法。{staff}一样记一行，等明天听庭上念的是哪一条。'
          harbour: '{staff}每天傍晚走到比雷埃夫斯港，看一条条船落下帆。问卖鱼的提洛岛的船回来没有，天天是同一个回答，{staff}说不清自己是盼它来，还是盼它别来。'
          gate: '{staff}替狱墙外卖灯油的女人挑水，换来墙根下一块歇脚的地方。探视的人每天天一亮就等在门口，有人提着饭篮，有人两手空空，{staff}渐渐认得了他们的脸。'
text:
  en:
    name: Socrates
    text: Greek philosopher of Athens, 470 BC to 399 BC. He wrote nothing himself, and is known through Plato and Xenophon. He questioned fellow citizens about virtue, was tried on charges of impiety and corrupting the young, and died by drinking hemlock.
  zh:
    name: 苏格拉底
    text: 雅典的希腊哲学家，公元前 470 年生，公元前 399 年去世。他自己没有留下著作，后人通过柏拉图和色诺芬了解他。他向同胞追问美德，被控不敬神和败坏青年，饮毒芹汁而死。
hook: {en: 'Thirty days until the ship comes home', zh: '船回港以前，还有三十天'}
quotes:
  socrates_reason_together:
    order: 1
    tier: full
    date: '-399'
    checked: official_record
    sources: [socrates_crito_48]
    original: grc
    text:
      en: {who: 'Socrates', quote: 'Let us consider it together, my friend. If you can object to anything I say, speak up, and I will listen to you.', occasion: 'Plato’s account of the prison conversation, Crito 48d–e (dramatic date 399 BCE); game translation'}
      zh: {who: '苏格拉底', quote: '朋友，我们一起来想。我的话若有哪里你不同意，就说出来，我会听。', occasion: '柏拉图《克里同篇》48d–e 所记狱中对话（对话设于公元前 399 年）；本游戏译文'}
      grc: {who: 'Socrates', quote: 'σκοπῶμεν, ὦ ἀγαθέ, κοινῇ, καὶ εἴ πῃ ἔχεις ἀντιλέγειν ἐμοῦ λέγοντος, ἀντίλεγε καί σοι πείσομαι', occasion: 'Plato’s account of the prison conversation, Crito 48d–e (dramatic date 399 BCE)'}
  socrates_same_arguments:
    order: 2
    tier: none
    date: '-399'
    checked: official_record
    sources: [socrates_crito_46]
    original: grc
    text:
      en: {who: 'Socrates', quote: 'I cannot now discard the arguments I made before just because this has happened to me. They seem much the same to me, and I still hold and honor them as I did before.', occasion: 'Plato’s account of the prison conversation, Crito 46b–c (dramatic date 399 BCE); game translation'}
      zh: {who: '苏格拉底', quote: '我不能因为遭逢此事，就把从前讲的道理丢开。在我看来，它们并没有变；我仍像从前一样信重它们。', occasion: '柏拉图《克里同篇》46b–c 所记狱中对话（对话设于公元前 399 年）；本游戏译文'}
      grc: {who: 'Socrates', quote: 'τοὺς δὴ λόγους οὓς ἐν τῷ ἔμπροσθεν ἔλεγον οὐ δύναμαι νῦν ἐκβαλεῖν, ἐπειδή μοι ἥδε ἡ τύχη γέγονεν, ἀλλὰ σχεδόν τι ὅμοιοι φαίνονταί μοι, καὶ τοὺς αὐτοὺς πρεσβεύω καὶ τιμῶ οὕσπερ καὶ πρότερον', occasion: 'Plato’s account of the prison conversation, Crito 46b–c (dramatic date 399 BCE)'}
facts:
  apology:
    date: '-399'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [socrates_athens_apology, socrates_athens_trial_sources]
    text:
      en: 'Plato’s account has Socrates answer the older accusers before turning to the formal charge led by Meletus.'
      zh: '柏拉图笔下，苏格拉底先回应多年来的旧指责，随后才谈以墨勒托为首的正式控告。'
  trial:
    date: '-399'
    stay_day: 20.1
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [socrates_athens_apology, socrates_athens_sep]
    text:
      en: 'In 399 BC Socrates was tried before a jury in Athens on charges of impiety and of corrupting the young, and was found guilty.'
      zh: '前 399 年，苏格拉底在雅典的陪审法庭受审，被控不敬神和败坏青年，被判有罪。'
    line:
      en: '399 BC: Socrates stands trial before a jury in Athens and is found guilty.'
      zh: '前 399 年，苏格拉底在雅典的陪审法庭受审，被判有罪。'
  surety:
    date: '-399'
    stay_day: 20.2
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [socrates_athens_apology, socrates_athens_trial_wiki]
    text:
      en: 'After the verdict the accused proposed his own penalty. In the Apology Socrates at last offers a fine of thirty minae, for which Plato, Crito, Critobulus and Apollodorus will stand surety; the jury sentences him to death.'
      zh: '定罪后由被告自己提出刑罚。《申辩篇》里他最后提出罚银三十明那，由柏拉图、克里同、克里托布卢斯和阿波罗多洛斯作保；陪审团判了死刑。'
    note: 'A death sentence: written as a plain fact.'
    line:
      en: 'The same day he offers a fine of thirty minae, with Plato, Crito and two other friends standing surety; the jury sentences him to death.'
      zh: '同一天，他提出罚银三十明那，柏拉图、克里同等几个朋友当庭作保；陪审团判了死刑。'
  ship:
    date: '-399'
    stay_day: 20.3
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [socrates_athens_last_visits, socrates_athens_memorabilia]
    text:
      en: 'Each year Athens sent a ship to Delos, and while it was away no one was put to death in the city. It had sailed the day before the trial, so Socrates lived on in prison for about thirty days.'
      zh: '雅典每年派一条船去提洛岛，船在外的日子城里不处决人。船在审判前一天出发，所以苏格拉底在狱中又活了约三十天。'
    line:
      en: 'The ship to Delos sailed the day before the trial, and until it is home no one may be put to death; Socrates is taken to prison to wait.'
      zh: '派往提洛岛的船审判前一天刚出发，船回来以前不行刑，苏格拉底被押进狱中等着。'
  verses:
    date: '-399'
    stay_day: 36
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [socrates_athens_last_visits, socrates_athens_laertius]
    text:
      en: 'In prison he put fables of Aesop into verse and wrote a hymn, doing what a recurring dream had told him; Diogenes Laertius later quotes the opening of a hymn and of a fable, and nothing more survives.'
      zh: '狱中，他照一个反复出现的梦的吩咐，把伊索寓言改写成诗，又作了一首颂歌；后来第欧根尼·拉尔修只引了一首颂歌和一则寓言的开头，其余没有传下来。'
    line:
      en: 'In prison Socrates begins to put fables of Aesop into verse, as a dream that keeps coming back has told him to.'
      zh: '狱中，苏格拉底开始把伊索寓言改写成诗，说这是一个反复做的梦叫他做的。'
  crito:
    date: '-399'
    stay_day: 48
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [socrates_athens_crito, socrates_athens_sep]
    text:
      en: 'Shortly before the end Crito came to the prison very early, told him the ship would soon be in, and urged him to escape; Socrates refused.'
      zh: '行刑前不久，克里同一大早来到狱中，告诉他船就要回来了，劝他逃走，苏格拉底没有答应。'
    line:
      en: 'Very early one morning Crito comes to the prison, says the ship will soon be in and urges him to escape. He will not.'
      zh: '一个清晨，天还没亮透，克里同来到狱中，说船就要回来了，劝他逃走。他没有答应。'
  plato_ill:
    date: '-399'
    stay_day: 50
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [socrates_athens_last_visits, socrates_athens_phaedo_wiki]
    text:
      en: 'In the Phaedo his friends gathered at the prison early on the last day; Plato was ill and did not come.'
      zh: '据《斐多篇》，最后那天朋友们一早聚到狱中，柏拉图病了，没有来。'
    note: 'An illness: written as a plain fact.'
    line:
      en: 'On the last day his friends gather at the prison at first light. Plato is ill and does not come.'
      zh: '最后那天，朋友们天一亮就聚到狱中。柏拉图病了，没有来。'
  death:
    date: '-399'
    stay_day: 50.5
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [socrates_athens_last_visits, socrates_athens_sep]
    text:
      en: 'Towards evening he drank the hemlock in prison and died, with his friends around him.'
      zh: '傍晚，他在狱中饮下毒芹汁去世，朋友们在他身边。'
    note: 'Death: written as a plain fact.'
    line:
      en: 'Towards evening Socrates drinks the hemlock in prison and dies.'
      zh: '傍晚，苏格拉底在狱中饮下毒芹汁去世。'
