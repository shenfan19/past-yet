    text:
      en:
        name: 'What the court heard'
        place: Athens
        figure: Socrates
        story: 'In Plato’s Apology, Socrates distinguishes long-standing rumours about him from the charges at his trial, which include corrupting the young. Their notes are imagined; Plato’s account is a later literary source.'
        relic: 'The listener’s clay cup'
        relic_desc: 'A cup from the fictional pottery seller’s stall.'
        points:
          p1: 'When the clamour of the jurors keeps rising against him, keep the court quiet enough for him to finish his defence'
          p2: 'Help him finish the Aesop fables he is putting into verse in prison and the hymn to Apollo, and get a copy out of the prison'
          p3: 'Before the last day, cure Plato of his illness so that he can come to the prison and be with his teacher at the end'
        points_fail:
          p1: 'The noise drowns the defence and he cannot finish it. This branch has come loose from history, and the office recalls the employee.'
          p2: 'As in history none of the verses survives, and in this branch none does either.'
          p3: 'As in history Plato is ill that day and does not come; in this branch too he is not with his teacher.'
        shift:
          p1:
            was: '399 BCE: Socrates was tried in Athens; in Plato''s Apology he asks the jurors again and again not to make a disturbance while he speaks, and he is found guilty and sentenced to death.'
          p2:
            was: '399 BCE: waiting in prison for the execution, Socrates obeyed a recurring dream by putting Aesop''s fables into verse and composing a hymn to Apollo; none of it survives.'
            now: 'The verses were copied into a roll and carried out of the prison by a friend, and they stayed in Athens.'
          p3:
            was: '399 BCE: on the day Socrates drank the hemlock in prison his friends were with him; Plato was ill and did not come.'
            now: 'Plato was well again and in the prison that day among the friends, and stayed to the end.'
            who: plato_academy
            bio: 'In this timeline Plato was cured of the illness that kept him away, and was in the prison with Socrates on his last day.'
        vignettes:
          handoff: 'Kleio has to leave for her pottery stall before she can hear the speech through. You find her at the gate and let her recount the opening in her own order. She leaves a space for the portion she missed. Her brother will hear where she had to stop.'
          charges: 'Pheidon has put a market rumour at the top of his report as if it had been read to the court. You ask him to name its speaker. He can point to one man in the market and one voice inside. The report leaves their words on separate lines.'
          verdict: 'You know how this trial ends. Pheidon wants to hurry the news to someone who could not come. If you tell him now, he will repeat it as something the court has already decided. You give him only what has been heard so far. You will miss the moment he delivers it.'
      zh:
        name: '散庭后还剩哪句话'
        place: 雅典
        figure: 苏格拉底
        story: '柏拉图的《申辩篇》区分针对苏格拉底的旧传闻和庭上的正式控告，后者包括败坏青年。'
        relic: '听众的陶杯'
        relic_desc: '卖陶器人的摊上留下的一只杯子。'
        points:
          p1: '陪审席上的喧哗一阵阵压过来时，护住他把申辩讲完'
          p2: '帮他把狱中改写成诗的伊索寓言和献给阿波罗的颂歌写完，抄一份带出狱外'
          p3: '最后那天之前，治好病中的柏拉图，让他赶到狱中送老师最后一程'
        points_fail:
          p1: '喧哗盖过了申辩，他没能把话讲完，这条分支与历史脱了节，事务所召回员工。'
          p2: '这些诗照史实一首也没有传下来，这条分支里也没有。'
          p3: '那天柏拉图照史实病着没来，这条分支里他也没在老师身边。'
        shift:
          p1:
            was: '前 399 年，苏格拉底在雅典受审，柏拉图《申辩篇》里他一再请陪审员不要喧哗，把话听完；他被判有罪，判处死刑。'
          p2:
            was: '前 399 年，苏格拉底在狱中等待行刑时，照一个反复出现的梦的吩咐，把伊索寓言改写成诗，又作了一首献给阿波罗的颂歌；这些诗没有传世。'
            now: '几首诗抄成一卷，由朋友带出狱门，留在了雅典。'
          p3:
            was: '前 399 年，苏格拉底在狱中饮毒芹去世那天，朋友们都在，柏拉图因病没来。'
            now: '柏拉图病好了，那天也在狱中，坐在朋友们中间，一直待到最后。'
            who: plato_academy
            bio: '这条时间线里，柏拉图那场病治好了，苏格拉底最后一天，他在狱中陪着老师。'
        vignettes:
          handoff: '克莱奥急着回陶器摊，听不到辩词结束。你在门边找到她，请她照自己的次序说开头。她把没听见的那一段空了下来，弟弟听她复述时，会知道她听到哪儿就走了。'
          charges: '费冬把集市听来的闲话写在最上方，仿佛有人在庭上宣读过。你请他认一认证人。他指得出集市上的一个人，也说得出庭里听到的一把嗓音。两人的话分成两行才带走。'
          verdict: '你知道这场审判怎么收场。费冬急着把消息送给来不了的人。现在告诉他结局，他就会当成已经宣判去传。你只说到眼前听过的那一段，之后他怎样转述，你已赶不上了。'
text:
  en:
    name: Socrates
    text: Greek philosopher of Athens, 470 BC to 399 BC. He wrote nothing himself, and is known through Plato and Xenophon. He questioned fellow citizens about virtue, was tried on charges of impiety and corrupting the young, and died by drinking hemlock.
  zh:
    name: 苏格拉底
    text: 雅典的希腊哲学家，公元前 470 年生，公元前 399 年去世。他自己没有留下著作，后人通过柏拉图和色诺芬了解他。他向同胞追问美德，被控不敬神和败坏青年，饮毒芹汁而死。
hook: {en: 'What will you repeat when the court empties?', zh: '散庭后，你会复述哪一句？'}
