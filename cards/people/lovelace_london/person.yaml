    text:
      en:
        name: The first program
        place: London
        figure: Ada Lovelace
        story: 'In 1842 the Italian engineer Luigi Menabrea published in French an account of Charles Babbage''s Analytical Engine. Ada Lovelace translated it and added seven notes, about three times as long as the article; the last, Note G, sets out how the engine could work out the Bernoulli numbers. In August 1843 Babbage wanted the paper to carry his own complaint against the government, and asked her to withdraw it when the editor would not print it unsigned. She refused, and the translation and Notes, signed A.A.L., appeared in Taylor''s Scientific Memoirs that year. On 14 August she offered to organise the business of building the engine if Babbage would keep to the engineering; he refused her conditions.'
        story_prose:
          opening:
            - 'London, summer 1843. Ada Lovelace has put into English the Italian engineer Menabrea’s French account of Babbage’s Analytical Engine, and added seven notes, about three times as long as the article. The last of them, Note G, sets out step by step how this engine, still only on paper, would work out the Bernoulli numbers.'
            - 'In history, Babbage wanted his complaint against the government printed with the paper; the editor would not print it unsigned, and Babbage asked her to withdraw. On 6 August she wrote to him that she would not, and that she was entirely decided. On 14 August she offered to run the business of building the engine if he would keep to the engineering, and Babbage noted on the letter that he refused all the conditions. The next day she told her mother that the printers had called her in to oversee a last round, and that correcting the formulas was hard work. In this branch, a compositor at the printer’s complains that the sigma box is running out, and a weaver in Spitalfields keeps a Jacquard loom.'
            - 'A few kinds of people can help on this trip: someone who knows translation and papers and can keep hold of a bundle of copy; someone who can read proofs and check a table cell by cell; someone tactful who can bring two people round to one division of work.'
          outcomes:
            all: 'The number of Taylor’s Scientific Memoirs came out, the table of Note G without a single cell out of its column, and the initials A.A.L. at the end. In September a visitor sat in the house in Dorset Street with the drawings, the outline of costs and the one page dividing the work spread before him.'
            p3: 'In September a visitor looked over the drawings and the outline of costs in Dorset Street, took away the one page dividing the work, and said the money could be settled once the engineering had been reviewed.'
            p2: 'In the printed Note G not a cell of the table slipped out of its column. The proof she had checked stayed in a cupboard at the printer’s, the red dots still in its margin.'
            p1: 'The number of Taylor’s Scientific Memoirs came out as planned, the translation and the seven notes printed together, and the initials A.A.L. at the end.'
          none: 'Late in August the number of Taylor’s Scientific Memoirs came out. In a weaving shop in Spitalfields the punched cards were still turning over one after another.'
          desync: 'The printer had been told both to go on and to wait, and the translation and notes were taken out of the number. When the office recalled {staff}, the compositor was breaking up the formes of Note G and tipping the type back into the case by the handful.'
          not_admitted: '{staff} never got into the house in St James’s Square, and spent a few days watching a Jacquard loom at a weaver’s door in Spitalfields. The cards turned over one by one, and the flower in the silk grew longer.'
          points:
            p1:
              class_lettered: 'On 6 August she wrote to Babbage that the translation and notes would not be withdrawn, and that she was entirely decided. {staff}, as a keeper of papers does, counted the translation and the seven notes through by page number, tied them with one tape, added the instruction to print with her signature, and took them to the printer’s. The compositor untied the tape: the translation on top, the notes below, and at the bottom the great table of Note G. He smoothed the table flat and weighted its corners with two pieces of type.'
              else: 'On 6 August she wrote to Babbage that the translation and notes would not be withdrawn, and that she was entirely decided. {staff} carried the bundle, tied with tape, to the printer’s door and waited there until it opened, let no one else take it, and set it on the compositor’s bench with both hands. The compositor untied the tape: the translation on top, the notes below, and at the bottom the great table of Note G. He smoothed the table flat and weighted its corners with two pieces of type.'
            p2:
              class_lettered: 'On 15 August the printers called her in again to oversee the last proofs, the formulas to be checked one by one. {staff}, as a proofreader does, laid a ruler across the table of Note G and read it with her row by row across the bench, putting a red dot in the margin wherever a cell might slip into the next column, while the compositor listened. By dusk a line of red dots ran down the right-hand margin of the proof. She held the table up to the window, read it again from the first row to the last, and only then handed it back to the compositor.'
              else: 'On 15 August the printers called her in again to oversee the last proofs, the formulas to be checked one by one. {staff} copied out the table of Note G from the beginning, one copy each, and went through it with her row by row across the bench, putting a red dot in the margin wherever a cell might slip into the next column. By dusk a line of red dots ran down the right-hand margin of the proof. She held the table up to the window, read it again from the first row to the last, and only then handed it back to the compositor.'
            p3:
              class_lettered: 'Late in August the notes signed A.A.L. were already in print. {staff}, in the form of an agreement, wrote out on one page the division of work from her letter of 14 August: she would see to the business and the raising of money, Babbage would keep to the engineering, and first one backer would be asked to look at the drawings and an outline of costs. The page spent a night at each house. When it came back, two names in different hands stood at the foot, and below them the same day for a meeting.'
              else: 'Late in August the notes signed A.A.L. were already in print. {staff} took her letter of 14 August back and forth between her house and Dorset Street several times, and wrote on one page the step each side would give. The page spent a night at each house. When it came back, two names in different hands stood at the foot, and below them the same day for a meeting.'
          excerpts:
            p3: 'The page spent a night at each house. When it came back, two names in different hands stood at the foot, and below them the same day for a meeting.'
            p2: 'By dusk a line of red dots ran down the right-hand margin of the proof. She held the table up to the window, read it again from the first row to the last, and only then handed it back to the compositor.'
            p1: 'The compositor untied the tape: the translation on top, the notes below, and at the bottom the great table of Note G. He smoothed the table flat and weighted its corners with two pieces of type.'
        relic: A punched card
        relic_desc: A card of holes, meant to tell an engine what to do.
        points:
          p1: 'With Lovelace’s permission, send her translation and notes to press together'
          p2: 'Before the last proof goes back, have Lovelace and the compositor read across the table in Note G and mark the entries most likely to slip into another column'
          p3: 'Put her division of work in a short proposal for a possible backer. Lovelace would organize the undertaking, Babbage would lead the engineering, and both would agree to a first meeting'
        points_fail:
          p1: 'The printer receives both instructions to proceed and instructions to wait. The translation and notes are pulled from the issue, and the office recalls the employee'
          p2: 'The compositor resets several symbols and nobody reads the rows from the beginning. She has to check the formulas and table against each other in the last few hours'
          p3: 'Her proposal ends with Babbage’s reply. When someone else asks about backing the work, they have no plan both are willing to hand over'
        shift:
          p1:
            was: 'In August 1843 Babbage asked her to request the editor’s permission to withdraw. Lovelace refused, and the translation and her initialed notes appeared together that year.'
          p2:
            was: 'On August 15 Lovelace told her mother that the printers had summoned her for further supervision and that correcting the mathematical formulas was consuming her time.'
            now: 'The printer keeps a proof she has checked column by column. When a symbol has to be reset, the compositor can use it to check the neighboring columns.'
          p3:
            was: 'On August 14 Lovelace proposed that she and other backers conduct the business so Babbage could devote his time to engineering. He declined her terms.'
            now: 'They agree to show one prospective backer the drawings and an outline of costs. The visitor takes away an account of who would do what and agrees to decide about money after a technical review.'
            who: lovelace_london
            bio: 'Lovelace translated the article and wrote its technical notes. She also looked for a way to organize work on an engine that still existed largely on paper.'
        vignettes:
          messenger: '{staff} waits under the portico of a house in St James''s Square as the messenger, and a messenger does not sit. Inside, someone writes, crosses out and writes again; at dusk a letter with the wax still soft is put into {staff}''s hand, for Dorset Street.'
          compositor: '{staff} helps the compositor pick type. This issue is all Greek letters, indices and little numbers set above the line, he grumbles, the sigma box is nearly empty, and whoever wrote it ought to come and set it herself.'
          loom: '{staff} stops at a weaver''s door in Spitalfields. On the Jacquard loom the punched cards turn over one after another, and a flower comes up in the silk. The weaver says the cards know the pattern better than he does.'
      zh:
        name: 第一段程序
        place: 伦敦
        figure: 阿达·洛芙莱斯
        story: '1842 年，意大利工程师路易吉·梅纳布雷亚用法文发表了一篇介绍查尔斯·巴贝奇分析机的文章。阿达·洛芙莱斯把它译成英文，又加了七条注释，篇幅约有原文的三倍；最后的注 G 写出了这台机器怎样算伯努利数。1843 年 8 月，巴贝奇想在文中附上他对政府的不满，编辑不肯不署名刊出，他便要她撤稿。她拒绝了，署名 A.A.L. 的译文与注释当年刊在《泰勒科学回忆录》上。8 月 14 日，她提出由自己张罗造机器的事务，请巴贝奇专管工程，巴贝奇拒绝了她的条件。'
        story_prose:
          opening:
            - '1843 年夏，伦敦。阿达·洛芙莱斯把意大利工程师梅纳布雷亚介绍巴贝奇分析机的法文文章译成英文，又加了七条注释，篇幅约有原文的三倍。最后一条注 G，一步一步写出这台还停在纸上的机器怎样算伯努利数。'
            - '史实里，巴贝奇想在文中附上他对政府的不满，编辑不肯不署名刊出，他便要她撤稿；8 月 6 日，她写信告诉他，不撤，这件事已经拿定。8 月 14 日，她提出由自己张罗造机器的事务，请巴贝奇专管工程，巴贝奇在信边批了一句，所有条件都拒绝。第二天她写信告诉母亲，印坊又召她去盯最后一轮，数学公式校得十分费力。在这条分支里，印坊里有个嫌西格玛不够用的排字工，斯皮塔佛德有个守着提花机的织工。'
            - '这一趟用得上几种人：懂翻译与文书、守得住一捆稿子的人；校得了样、一格一格对得了表的人；说话有分寸、谈得拢分工的人。'
          outcomes:
            all: '那期《泰勒科学回忆录》印出来了，注 G 的表一格也没有串行，末尾署着 A.A.L. 三个字母。九月里，一位来客坐在多塞特街的屋里，面前摊着设计图、费用草案和那页分工的短约。'
            p3: '九月里，一位来客在多塞特街看了设计图和费用草案，带走了那页分工的短约，说等工程评估过后再谈钱。'
            p2: '印出来的注 G，那张表一格也没有串行。她核过的那份样表留在印坊的柜子里，边上的红点还在。'
            p1: '那期《泰勒科学回忆录》照常印出，译文和七条注释排在一起，末尾署着 A.A.L. 三个字母。'
          none: '八月下旬，那期《泰勒科学回忆录》印出来了。斯皮塔佛德的织坊里，穿孔纸板还在一张接一张地翻。'
          desync: '印坊同时接到了接着印和暂缓的两种话，译稿与注释从本期撤了下来。{staff}被事务所召回时，排字工正把注 G 那几版拆开，铅字一把一把倒回字盘。'
          not_admitted: '{staff}没能进圣詹姆斯广场那座宅子，只在斯皮塔佛德的织坊门口看了几天提花机。纸板一张张翻过去，丝面上的花越织越长。'
          points:
            p1:
              class_lettered: '8 月 6 日，她给巴贝奇写信：译文与注释不撤，这件事她已经拿定。{staff}照管稿件的规矩，把译稿和七条注释按页码点过一遍，用同一根带子扎好，附上她签过字的付印回条，送到印坊。排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。'
              else: '8 月 6 日，她给巴贝奇写信：译文与注释不撤，这件事她已经拿定。{staff}抱着那捆用带子扎好的稿子，在印坊门口一直等到开门，没让旁人经手，亲手放到排字工的台子上。排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。'
            p2:
              class_lettered: '8 月 15 日，印坊又把她召去盯最后一轮校样，公式要一处处对过。{staff}照校对的规矩，拿一把直尺压在注 G 的表上，和她隔着桌子一行一行横着念，念到容易串列的格子，就在边上点一个红点，排字工在旁边听着。天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。'
              else: '8 月 15 日，印坊又把她召去盯最后一轮校样，公式要一处处对过。{staff}把注 G 的表从头抄了一份，和她一人一份，隔着桌子一行一行横着对，容易串列的格子就在边上点一个红点。天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。'
            p3:
              class_lettered: '八月下旬，署着 A.A.L. 的注释已经印了出来。{staff}照拟契约的格式，把她 8 月 14 日那封信里提的分工誊成一页短约：她管联络和筹措，巴贝奇专管工程，先请一位出资人来看设计图和费用草案。那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。'
              else: '八月下旬，署着 A.A.L. 的注释已经印了出来。{staff}拿着她 8 月 14 日那封信，在她那里和多塞特街之间跑了几趟，把两边各自肯让的一步记在同一页纸上。那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。'
          excerpts:
            p3: '那页纸在两边各放了一夜。送回来时，页脚添了两个笔迹不同的名字，底下写着同一个见面的日子。'
            p2: '天黑前，样表右边的空白处落了一溜红点。她把表举到窗前，从第一行又看到最后一行，才交还给排字工。'
            p1: '排字工解开带子，译文在上，注释在下，最底下一叠是注 G 的那张大表。他把表摊平，用两块铅字压住了纸角。'
        relic: 一张穿孔卡
        relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
        points:
          p1: '把洛芙莱斯亲自同意付印的译稿和注释一起交给伦敦印坊，护住她在撤稿争议中作出的决定'
          p2: '赶在最后一次交校样前，让她和排字工把注 G 的表横着读一遍，逐列标出容易错行的格子'
          p3: '把她提议的分工抄成一份可交给潜在出资人的短约，由她组织联络，由巴贝奇负责工程，再请两人议定第一次会面'
        points_fail:
          p1: '印坊收到继续付印与暂缓付印两种指示，最后把译稿与注释一并从本期撤下。事务所因同步失败召回员工'
          p2: '排字工换过几格符号，却无人从头对读。她只能在最后几小时重新查公式和对应的表格'
          p3: '她写给巴贝奇的建议止于回信。再有意向出资的人打听时，双方没有一份他们都肯交出的工作安排'
        shift:
          p1:
            was: '1843 年 8 月，巴贝奇要求她请编辑同意撤稿。洛芙莱斯拒绝，译稿与署有她姓名缩写的注释同年合刊。'
          p2:
            was: '洛芙莱斯 8 月 15 日写给母亲，说印坊临时召她做最后一轮监督，数学公式的校对十分费力。'
            now: '印坊留存一份她核过的逐列样表。排字工再改动一格，就能用同一张样表检查邻列。'
          p3:
            was: '8 月 14 日，洛芙莱斯向巴贝奇提议由自己和合作者承担组织事务，让他专心工程。巴贝奇未接受这些条件。'
            now: '两人同意先请一位出资人看设计图与费用草案。来客拿到一份分工清楚的说明，并约定工程评估后再决定是否承担费用。'
            who: lovelace_london
            bio: '洛芙莱斯同时写译稿和技术注释。除了说明机器可以怎样工作，她还试着为一项停在纸上的工程寻找继续筹办的办法。'
        vignettes:
          messenger: '{staff}在圣詹姆斯广场一座宅子的门廊下等回信，石柱被太阳晒得发烫，当信差的规矩是不能坐。屋里的人写了划，划了又写，天擦黑才把一封火漆还软着的信塞到{staff}手里，送多塞特街。'
          compositor: '{staff}帮排字工拣铅字，没一会儿指头就黑了。排字工抱怨这一期满版都是希腊字母、角标和架在行上的小数字，西格玛那一格都快拣空了，写这东西的人该自己来排。'
          loom: '{staff}在斯皮塔佛德一家织坊门口停下。提花机上的穿孔纸板一张接一张翻过去，咔嗒咔嗒响，丝面上慢慢起了一朵花。织工说，这些纸板比他还认得花样。'
text:
  en:
    name: Ada Lovelace
    text: English mathematician, 1815 to 1852. In her notes to Menabrea's memoir, Ada Lovelace compared the Analytical Engine's patterns to the flowers and leaves woven on a Jacquard loom. Note G laid out a method for computing Bernoulli numbers on the proposed machine. The engine was not completed in her lifetime. She died in London on 27 November 1852, aged thirty-six.
  zh:
    name: 阿达·洛芙莱斯
    text: 英国数学家，1815 年生，1852 年去世。阿达·洛芙莱斯在梅纳布雷亚论文的译注中，把分析机处理的图式比作雅卡尔织机织出的花叶。注 G 列出了让这台设想中的机器计算伯努利数的步骤；分析机在她生前并未建成。1852 年 11 月 27 日，她在伦敦去世，年仅三十六岁。
hook: {en: 'She would not take it back', zh: '她不肯撤稿'}
quotes:
  lovelace_echo_weave:
    order: 1
    tier: full
    date: '1843'
    checked: official_record
    sources: [lovelace_print_1843]
    original: en
    text:
      en: {who: Ada Lovelace, quote: 'We may say most aptly, that the Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves.', occasion: 'Note A to her translation of Menabrea’s memoir, Scientific Memoirs'}
      zh: {who: 阿达·洛芙莱斯, quote: '我们不妨这样说：分析机编织代数图式，正如雅卡尔织机织出花叶。', occasion: '《科学回忆录》梅纳布雷亚论文译本注释 A（游戏译文）'}
  lovelace_echo_available:
    order: 2
    tier: none
    date: '1843'
    checked: official_record
    sources: [lovelace_print_1843]
    original: en
    text:
      en: {who: Ada Lovelace, quote: 'Its province is to assist us in making available what we are already acquainted with.', occasion: 'Note G on the scope of the Analytical Engine, Scientific Memoirs'}
      zh: {who: 阿达·洛芙莱斯, quote: '它的职责，是帮助我们把已经掌握的知识用起来。', occasion: '《科学回忆录》论分析机作用的注释 G（游戏译文）'}
facts:
  menabrea:
    date: '1842-10'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lovelace_wiki, lovelace_print_1843]
    text:
      en: 'In October 1842 Luigi Menabrea''s French account of Babbage''s Analytical Engine, drawn from Babbage''s lectures at Turin in 1840, was published in the Bibliothèque universelle de Genève.'
      zh: '1842 年 10 月，路易吉·梅纳布雷亚根据巴贝奇 1840 年在都灵的讲演写成的分析机介绍，用法文刊在《日内瓦万有文库》上。'
    line:
      en: 'October 1842: in Geneva Luigi Menabrea publishes, in French, an account of Babbage''s Analytical Engine.'
      zh: '1842 年 10 月，路易吉·梅纳布雷亚在日内瓦用法文发表巴贝奇分析机的介绍。'
  refused_withdraw:
    date: '1843-08-06'
    stay_day: 14
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lovelace_1843_correspondence, lovelace_wiki]
    text:
      en: 'Babbage wanted his complaint about the government''s treatment of the engine printed with the paper; the editor would not print it unsigned, and Babbage asked Lovelace to withdraw her translation. On 6 August 1843 she wrote to him that on not withdrawing the translation and Notes she was entirely and finally decided.'
      zh: '巴贝奇想把他对政府的不满随文刊出，编辑不肯不署名登，巴贝奇就要洛芙莱斯撤稿。1843 年 8 月 6 日，她写信告诉他，不撤回译文与注释，这件事她已完全拿定了主意。'
    line:
      en: '6 August 1843: Lovelace writes to Babbage that she will not withdraw the translation and Notes.'
      zh: '1843 年 8 月 6 日，洛芙莱斯写信给巴贝奇，说译文与注释不撤。'
  proposal:
    date: '1843-08-14'
    stay_day: 22
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lovelace_1843_correspondence, lovelace_essinger]
    text:
      en: 'On 14 August 1843, from Ockham Park, Lovelace wrote to Babbage offering, with others his friends approved, to conduct the business of executing his engine while his own energies went undivided to the work. Babbage noted on the letter that he had seen her and refused all the conditions.'
      zh: '1843 年 8 月 14 日，洛芙莱斯从奥卡姆庄园写信给巴贝奇，提出由她和巴贝奇的朋友认可的人张罗造机器的事务，让他把精力全放在工程上。巴贝奇在信边批了一句，说见过她，所有条件都拒绝了。'
    line:
      en: '14 August 1843: Lovelace offers to run the business of building the engine, if Babbage will keep to the engineering.'
      zh: '1843 年 8 月 14 日，洛芙莱斯提出替巴贝奇张罗造机器的事务，请他只管工程。'
  printed:
    date: '1843-08-24'
    stay_day: 32
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [lovelace_1843_correspondence, lovelace_wiki]
    text:
      en: 'By 24 August 1843 the volume of Taylor''s Scientific Memoirs with her translation and Notes, signed A.A.L., had appeared; the Notes ran to about three times the length of the article. Some accounts give it as the September number.'
      zh: '到 1843 年 8 月 24 日，载有她的译文与注释的《泰勒科学回忆录》已经印出，署名 A.A.L.，注释的篇幅约为原文的三倍。也有记作 9 月号的。'
    line:
      en: 'Late August 1843: Taylor''s Scientific Memoirs comes out with the translation and the Notes, signed A.A.L.'
      zh: '1843 年 8 月下旬，《泰勒科学回忆录》印出，译文与注释署着 A.A.L. 三个字母。'
  death:
    date: '1852-11-27'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [lovelace_wiki, lovelace_britannica]
    text:
      en: 'Ada Lovelace died of cancer in London on 27 November 1852, at thirty six, and was buried beside her father at Hucknall.'
      zh: '1852 年 11 月 27 日，阿达·洛芙莱斯因癌症在伦敦去世，年仅三十六岁，葬在哈克诺尔她父亲的身旁。'
    note: 'A death and an illness: written as plain facts.'
    line:
      en: '27 November 1852: Ada Lovelace dies in London, at thirty six.'
      zh: '1852 年 11 月 27 日，阿达·洛芙莱斯在伦敦去世，年仅三十六岁。'
