    text:
      en:
        name: "A rule for the stars"
        place: "Cambridge, Massachusetts"
        figure: "Henrietta Leavitt"
        story: 'Harvard’s 1912 circular lists twenty-five variable stars from the Small Magellanic Cloud in order of period. Leavitt plotted their brightest and faintest readings separately. In both plots, the stars that took longer to repeat their cycles were brighter.'
        story_prose:
          opening:
            - 'Cambridge, Massachusetts, 1912. Leavitt has put twenty-five variables in the Small Magellanic Cloud in order by period and plotted their readings at their brightest and faintest. On both graphs, the longer the period, the brighter the star.'
            - 'In history, the table appeared in a Harvard Observatory circular. Later researchers used Cepheids in the Milky Way for the first calibration. In this branch, someone can keep checking the plates and send a list of candidate stars with a request for observing time.'
            - 'This trip needs someone who can match a faint star to the glass and someone who can make the case for the next observations.'
          points:
            p1: 'Before printing, {staff} checks the faint observations against the glass plates. Once the missing star turns up, Leavitt puts it back in its place in the table. The ruler moves off the last row. Through the glass, the tiny dot is still there.'
            p2: '{staff} explains the remaining calibration problem in the application for observing time and attaches a list of candidate stars. When the measurements arrive, Leavitt brings the two sheets together. Her pencil crosses the seam and stops at the same star.'
          outcomes:
            all: 'The table came out in print and more observations eventually reached the desk. Leavitt opened the envelope and laid the new readings beside the old plots.'
            p2: 'Leavitt later checked the measurements with her collaborators. The two sets of readings lay side by side with pencil marks beneath the same star.'
            p1: 'The printed circular lay open on the table. The points on both plots still followed the same sloping line.'
          none: 'The plates went back into their box. The top one slid to the edge, leaving a corner in the light.'
          not_admitted: '{staff} did not get into the room where the plates were checked. As a box passed inside the door, the glass flashed at one corner.'
          desync: 'The gap was still there when the table went in. When {staff} was recalled, the ruler still held down the unmatched row.'
          excerpts:
            p2: 'When the measurements arrive, Leavitt brings the two sheets together. Her pencil crosses the seam and stops at the same star.'
            p1: 'The ruler moves off the last row. Through the glass, the tiny dot is still there.'
        relic: "A glass plate"
        relic_desc: "A photographic plate crowded with tiny stars."
        points:
          p1: 'Match the measurements of faint stars to their plates before printing and protect Leavitt''s table of twenty-five periods'
          p2: 'Use the circular''s unresolved calibration to win observing time for Leavitt to take part in the next step'
        points_fail:
          p1: 'Rows whose plate references cannot be checked are cut and the table of twenty-five periods does not appear. The office recalls the employee after a loss of sync.'
          p2: 'The period and brightness relation survives, and its absolute calibration is taken up elsewhere.'
        shift:
          p1:
            was: 'On 3 March 1912 Harvard Observatory Circular 173 published Leavitt''s periods for twenty-five variables in the Small Magellanic Cloud.'
          p2:
            was: 'In 1913 the first calibration used Cepheids in the Milky Way.'
            now: '{staff} submits a request for observing time with the candidate list attached. Leavitt gets time to check the new measurements with the team when they come in.'
            who: leavitt_cambridge_ma
            bio: 'Leavitt continued working on stellar brightness and took part in applying her relation to distances. She left her own observing notes on the calibration.'
        vignettes:
          rank: 'A blank star number breaks the sequence. {staff} reads the period aloud while the copyist searches the plate log. The dots stay where they are until the number is found.'
          distance: '{staff} holds the two plots side by side. The copyist has changed the scale on one sheet. They recopy the axis before comparing the dots.'
          period: 'The copyist calls out a brightness and reaches for the next row. {staff} lays a ruler underneath the old row until its period has been copied too.'
        remarks:
          trait_methodical: '{staff} checks the number once more before returning the plate to its sleeve.'
      zh:
        name: "星星的一条规则"
        place: "马萨诸塞州剑桥"
        figure: "亨丽埃塔·勒维特"
        story: '1912 年，哈佛天文台的通报把小麦哲伦云里二十五颗变星按周期排成一张表。勒维特把最亮和最暗时的读数分别画成图。两张图上，明暗变化一轮所需时间越长，星就越亮。'
        story_prose:
          opening:
            - '1912 年，马萨诸塞州剑桥。勒维特把小麦哲伦云里二十五颗变星按周期排成表，又画出它们最亮和最暗时的读数。周期越长的星，在两张图上都越亮。'
            - '史实里，周期表刊在哈佛天文台通报上。后来研究者用银河系里的造父变星完成首次定标。在这条分支里，有人接着核底片，也有人能把候选星名单随观测申请送上去。'
            - '这一趟用得上能把很暗的星对回底片的人，也用得上能把下一步观测的理由讲清楚的人。'
          points:
            p1: '排印前，{staff}对着玻璃底片和暗星的读数一格格核准。少掉的那颗找到了，勒维特把它放回原来的周期位置。长尺沿着最后一行挪开。透过玻璃看去，那一点还留在原处。'
            p2: '{staff}把通报还没解决的定标难题写进观测申请，把候选星的名单附在后面。后来的量测送到时，勒维特把两张纸并拢。她的铅笔跨过纸缝，停在同一颗星上。'
          outcomes:
            all: '周期表印了出来，后来又有观测送到桌上。勒维特拆开封套，把新的读数摊到旧图旁。'
            p2: '勒维特后来和合作者一同核过新的量测。他们把两份样本并排压在桌上，同一颗星下有两道铅笔印。'
            p1: '排印后的通报摊开在桌面上。两张图上的点还沿着原来的斜线。'
          none: '底片一张张收了起来。最上面的一片滑到匣边，露出光下的一角。'
          not_admitted: '{staff}没能进到核底片的地方。玻璃匣从门内送过时，边角闪了一下。'
          desync: '表上的空格留到了交稿。{staff}被召回时，尺子还压着没对上的那一行。'
          excerpts:
            p2: '后来的量测送到时，勒维特把两张纸并拢。她的铅笔跨过纸缝，停在同一颗星上。'
            p1: '长尺沿着最后一行挪开。透过玻璃看去，那一点还留在原处。'
        relic: "一块玻璃底片"
        relic_desc: "一块布满细小星点的照相底片。"
        points:
          p1: '排印前帮勒维特把暗星观测与玻璃底片对上，护住二十五颗变星的周期表'
          p2: '用通报里留下的定标难题争取观测时间，让勒维特本人参与下一步'
        points_fail:
          p1: '错号让排印人员删去无法查对的几行，二十五颗星的周期表没有发表。行程同步失败，员工被召回。'
          p2: '论文留下了亮度与周期的关系，给它定出绝对尺度的工作要由外地的研究者接手。'
        shift:
          p1:
            was: '1912 年 3 月 3 日，哈佛天文台第 173 号通报刊登了勒维特整理的二十五颗小麦哲伦云变星周期。'
          p2:
            was: '1913 年，首次定标采用了银河系中的造父变星。'
            now: '{staff}把候选星名单附在观测时间申请上。等新一批量测结果送到，勒维特能和合作者一起核对样本。'
            who: leavitt_cambridge_ma
            bio: '勒维特继续做变星的亮度研究，并参与将自己的关系式用于测量距离。她给后来的定标留有自己的观测说明。'
        vignettes:
          rank: '{staff}念出周期，抄表人翻到底片目录的后一页。少掉的星号回来以前，图上的点一个也没挪。'
          distance: '{staff}并起两张图，指出刻度差了一格。对方先擦掉那个数字，橡皮屑落在两张纸的缝里。'
          period: '抄表人报完亮度就要换行。{staff}把尺按在纸边，等最后一个周期也抄过来才松手。'
        remarks:
          trait_methodical: '{staff}将底片收回纸套前，又对了一遍星号。'
text:
  en:
    name: Henrietta Leavitt
    text: American astronomer, 1868 to 1921, who worked at Harvard College Observatory. She found that the period of a Cepheid variable star is tied to its brightness, which let astronomers measure distances to other galaxies.
  zh:
    name: 亨丽埃塔·勒维特
    text: 美国天文学家，1868 年生，1921 年去世，在哈佛天文台工作。她发现造父变星的周期与亮度相关，天文学家由此得以测量到其他星系的距离。
hook: {en: 'Do the readings still line up?', zh: '二十五颗星能排出什么'}
facts:
  variable_stars:
    date: '1912-03-03'
    stay_day: 15
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leavitt_cambridge_ma_primary]
    text:
      en: 'The 1912 circular presents Leavitt''s comparison of 25 variables in the Small Magellanic Cloud. Among these stars the brighter ones generally have longer periods.'
      zh: '1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。'
    line:
      en: 'On 3 March 1912, Harvard College Observatory Circular 173 published Leavitt’s table of twenty-five variable stars.'
      zh: '1912 年 3 月 3 日，哈佛天文台第 173 号通报刊出勒维特的二十五颗变星周期表。'
      zh-Hant: '1912 年 3 月 3 日，哈佛天文臺第 173 號通報刊出勒維特的二十五顆變星週期表。'
      fr: 'Le 3 mars 1912, la circulaire 173 de l''Observatoire du Harvard College publia le tableau de Leavitt de vingt-cinq étoiles variables.'
      es: 'El 3 de marzo de 1912, la Circular 173 del Observatorio de la Universidad de Harvard publicó la tabla de Leavitt de veinticinco estrellas variables.'
      ja: '1912 年 3 月 3 日、ハーバード大学天文台回覧 173 号は、25 個の変光星のリービットの表を発表しました。'
      ko: '1912년 3월 3일, Harvard College Observatory Circular 173은 25개의 변광성으로 구성된 Leavitt의 표를 출판했습니다.'
      ru: '3 марта 1912 года циркуляр обсерватории Гарвардского колледжа № 173 опубликовал таблицу Ливитта из двадцати пяти переменных звезд.'
  calibration:
    date: '1913'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leavitt_harvard_plates]
    text: {en: 'The following year, Ejnar Hertzsprung used Cepheids in the Milky Way to calibrate the period–luminosity relation.', zh: '次年，埃伊纳·赫茨普龙用银河系内的造父变星为周期与光度的关系定标。'}
    line:
      en: 'In 1913, the relation was calibrated using Cepheids in the Milky Way.'
      zh: '1913 年，银河系内的造父变星被用来为这项关系定标。'
      zh-Hant: '1913 年，銀河系內的造父變星被用來為這項關係定標。'
      fr: 'En 1913, la relation fut calibrée à l’aide des Céphéides de la Voie Lactée.'
      es: 'En 1913, la relación se calibró utilizando Cefeidas en la Vía Láctea.'
      ja: '1913 年に、この関係は天の川銀河のセファイドを使用して校正されました。'
      ko: '1913년에 은하수의 세페이드를 사용하여 관계가 보정되었습니다.'
      ru: 'В 1913 году связь была калибрована с использованием цефеид Млечного Пути.'
