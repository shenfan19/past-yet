    text:
      en:
        name: "A rule for the stars"
        place: "Cambridge, Massachusetts"
        figure: "Henrietta Leavitt"
        story: 'Harvard’s 1912 circular lists twenty-five variable stars from the Small Magellanic Cloud in order of period. Leavitt plotted their brightest and faintest readings separately. In both plots, the stars that took longer to repeat their cycles were brighter.'
        relic: "A glass plate"
        relic_desc: "A photographic plate crowded with tiny stars."
        points:
          p1: 'Match the measurements of faint stars to their plates before printing and protect Leavitt''s table of twenty-five periods'
          p2: 'Use the circular''s unresolved calibration to win observing time for Leavitt to take part in the next step'
        points_fail:
          p1: 'Rows whose plate references cannot be checked are cut and the table of twenty-five periods does not appear. The office recalls the employee after a loss of sync.'
          p2: 'The period and brightness relation survives, and its absolute calibration is taken up elsewhere.'
        shift:
          p1:
            was: 'On 3 March 1912 Harvard Observatory Circular 173 published Leavitt''s periods for twenty-five variables in the Small Magellanic Cloud.'
          p2:
            was: 'In 1913 the first calibration used Cepheids in the Milky Way.'
            now: '{staff} submits a request for observing time with the candidate list attached. Leavitt gets time to check the new measurements with the team when they come in.'
            who: leavitt_cambridge_ma
            bio: 'Leavitt continued working on stellar brightness and took part in applying her relation to distances. She left her own observing notes on the calibration.'
        vignettes:
          rank: 'A blank star number breaks the sequence. {staff} reads the period aloud while the copyist searches the plate log. The dots stay where they are until the number is found.'
          distance: '{staff} holds the two plots side by side. The copyist has changed the scale on one sheet. They recopy the axis before comparing the dots.'
          period: 'The copyist calls out a brightness and reaches for the next row. {staff} lays a ruler underneath the old row until its period has been copied too.'
        remarks:
          trait_methodical: '{staff} checks the number once more before returning the plate to its sleeve.'
      zh:
        name: "星星的一条规则"
        place: "马萨诸塞州剑桥"
        figure: "亨丽埃塔·勒维特"
        story: '1912 年，哈佛天文台的通报把小麦哲伦云里二十五颗变星按周期排成一张表。勒维特把最亮和最暗时的读数分别画成图。两张图上，明暗变化一轮所需时间越长，星就越亮。'
        relic: "一块玻璃底片"
        relic_desc: "一块布满细小星点的照相底片。"
        points:
          p1: '排印前帮勒维特把暗星观测与玻璃底片对上，护住二十五颗变星的周期表'
          p2: '用通报里留下的定标难题争取观测时间，让勒维特本人参与下一步'
        points_fail:
          p1: '错号让排印人员删去无法查对的几行，二十五颗星的周期表没有发表。行程同步失败，员工被召回。'
          p2: '论文留下了亮度与周期的关系，给它定出绝对尺度的工作要由外地的研究者接手。'
        shift:
          p1:
            was: '1912 年 3 月 3 日，哈佛天文台第 173 号通报刊登了勒维特整理的二十五颗小麦哲伦云变星周期。'
          p2:
            was: '1913 年，首次定标采用了银河系中的造父变星。'
            now: '{staff}把候选星名单附在观测时间申请上。等新一批量测结果送到，勒维特能和合作者一起核对样本。'
            who: leavitt_cambridge_ma
            bio: '勒维特继续做变星的亮度研究，并参与将自己的关系式用于测量距离。她给后来的定标留有自己的观测说明。'
        vignettes:
          rank: '表上有一格星号空着。{staff}念出周期，抄表人翻底片目录。星号找回来之前，谁也没挪图上的点。'
          distance: '{staff}把两张图并在一起，发现抄表人把其中一张的刻度抄变了。两人先把刻度改回去，再逐个比图上的点。'
          period: '抄表人报完亮度，正要往下读。{staff}用尺子压住这一行的下缘，等周期也抄过去了才往下挪。'
        remarks:
          trait_methodical: '{staff}将底片收回纸套前，又对了一遍星号。'
text:
  en:
    name: Henrietta Leavitt
    text: American astronomer, 1868 to 1921, who worked at Harvard College Observatory. She found that the period of a Cepheid variable star is tied to its brightness, which let astronomers measure distances to other galaxies.
  zh:
    name: 亨丽埃塔·勒维特
    text: 美国天文学家，1868 年生，1921 年去世，在哈佛天文台工作。她发现造父变星的周期与亮度相关，天文学家由此得以测量到其他星系的距离。
hook: {en: 'Do the readings still line up?', zh: '二十五颗星能排出什么'}
facts:
  variable_stars:
    date: '1912-03-03'
    stay_day: 15
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leavitt_cambridge_ma_primary]
    text:
      en: 'The 1912 circular presents Leavitt''s comparison of 25 variables in the Small Magellanic Cloud. Among these stars the brighter ones generally have longer periods.'
      zh: '1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。'
    line: {en: 'On 3 March 1912, Harvard College Observatory Circular 173 published Leavitt’s table of twenty-five variable stars.', zh: '1912 年 3 月 3 日，哈佛天文台第 173 号通报刊出勒维特的二十五颗变星周期表。'}
  calibration:
    date: '1913'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [leavitt_harvard_plates]
    text: {en: 'The following year, Ejnar Hertzsprung used Cepheids in the Milky Way to calibrate the period–luminosity relation.', zh: '次年，埃伊纳·赫茨普龙用银河系内的造父变星为周期与光度的关系定标。'}
    line: {en: 'In 1913, the relation was calibrated using Cepheids in the Milky Way.', zh: '1913 年，银河系内的造父变星被用来为这项关系定标。'}
