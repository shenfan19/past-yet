    text:
      en:
        who: 'Henrietta Swan Leavitt'
        quote: 'A straight line can readily be drawn'
        occasion: 'On the two sets of plotted points, Circular 173, p. 2.'
      zh:
        who: '亨丽埃塔·斯万·勒维特'
        quote: '很容易画出一条直线。'
        occasion: '论两组描出的点，哈佛天文台第 173 号通报第 2 页（游戏译文）。'
      zh-Hant:
        who: '亨麗埃塔·斯萬·勒維特'
        quote: '很容易畫出一條直線。'
        occasion: '論兩組描出的點，哈佛天文臺第 173 號通報第 2 頁（遊戲譯文）。'
      fr:
        who: 'Henrietta Swan Leavitt'
        quote: 'Une ligne droite peut facilement être tracée'
        occasion: 'Sur les deux ensembles de points tracés, Circulaire 173, p. 2.'
      es:
        who: 'Henrietta Swan Leavitt'
        quote: 'Se puede trazar fácilmente una línea recta'
        occasion: 'Sobre los dos conjuntos de puntos trazados, Circular 173, p. 2.'
      ja:
        who: 'ヘンリエッタ・スワン・リービット'
        quote: 'まっすぐな線が簡単に引けます'
        occasion: 'グラフに示した二組の点について。天文台通報第173号、2頁。'
      ko:
        who: '헨리에타 스완 레빗'
        quote: '직선은 쉽게 그릴 수 있다'
        occasion: '두 세트의 표시된 점에 대해 Circular 173, p. 2.'
      ru:
        who: 'Генриетта Суон Ливитт'
        quote: 'Прямую линию можно легко провести'
        occasion: 'О двух наборах нанесённых точек, Циркуляр 173, с. 2.'
  leavitt_relation:
    order: 2
    tier: none
    date: '1912-03-03'
    checked: official_record
    original: en
    sources: [leavitt_cambridge_ma_primary]
    text:
      en:
        who: 'Henrietta Swan Leavitt'
        quote: 'A remarkable relation between the brightness of these variables and the length of their periods will be noticed.'
        occasion: 'Introducing Table I, Circular 173, p. 1.'
      zh:
        who: '亨丽埃塔·斯万·勒维特'
        quote: '可以看出，这些变星的亮度与周期长短之间有一种显著的关系。'
        occasion: '引出表一，哈佛天文台第 173 号通报第 1 页（游戏译文）。'
      zh-Hant:
        who: '亨麗埃塔·斯萬·勒維特'
        quote: '可以看出，這些變星的亮度與週期長短之間有一種顯著的關係。'
        occasion: '引出表一，哈佛天文臺第 173 號通報第 1 頁（遊戲譯文）。'
      fr:
        who: 'Henrietta Swan Leavitt'
        quote: 'On remarquera une relation remarquable entre l''éclat de ces variables et la durée de leurs périodes.'
        occasion: 'Présentation du tableau I, Circulaire 173, p. 1.'
      es:
        who: 'Henrietta Swan Leavitt'
        quote: 'Se observará una relación notable entre el brillo de estas variables y la duración de sus períodos.'
        occasion: 'Presentación del Cuadro I, Circular 173, pág. 1.'
      ja:
        who: 'ヘンリエッタ・スワン・リービット'
        quote: 'これらの変数の明るさと周期の長さとの間には顕著な関係があることがわかります。'
        occasion: '表 I の導入、回覧 173、p. 1.'
      ko:
        who: '헨리에타 스완 레빗'
        quote: '이들 변수의 밝기와 기간 길이 사이의 놀라운 관계가 주목될 것입니다.'
        occasion: '표 I 소개, 회보 173, p. 1.'
      ru:
        who: 'Генриетта Суон Ливитт'
        quote: 'Можно заметить замечательную связь между яркостью этих переменных и длиной их периодов.'
        occasion: 'Представляем таблицу I, циркуляр 173, стр. 1.'
