    text:
      en:
        name: "A rule for the stars"
        place: "Cambridge, Massachusetts"
        figure: "Henrietta Leavitt"
        story: 'The 1912 circular presents Leavitt''s comparison of 25 variables in the Small Magellanic Cloud. Among these stars the brighter ones generally have longer periods.'
        relic: "A glass plate"
        relic_desc: "A photographic plate crowded with tiny stars."
        points:
          p1: 'Match the measurements of faint stars to their plates before printing and protect Leavitt''s table of twenty-five periods'
          p2: 'Get the printer to keep a plate index with the table so another observer can repeat a measurement'
          p3: 'Use the circular''s unresolved calibration to win observing time for Leavitt to take part in the next step'
        points_fail:
          p1: 'Rows whose plate references cannot be checked are cut and the table of twenty-five periods does not appear. The office recalls the employee after a loss of sync.'
          p2: 'Readers can see the numbers but have to write to Harvard to find the original plates.'
          p3: 'The period and brightness relation survives, and its absolute calibration is taken up elsewhere.'
        shift:
          p1:
            was: 'On 3 March 1912 Harvard Observatory Circular 173 published Leavitt''s periods for twenty-five variables in the Small Magellanic Cloud.'
          p2:
            was: 'In March 1912 the circular printed periods, magnitudes and plots, while plate references were kept in the observing records.'
            now: '{staff} helps Leavitt add a cross-reference from star numbers to plates. Readers can use the printed list to check a measurement.'
          p3:
            was: 'In 1913 Ejnar Hertzsprung used Milky Way Cepheids to calibrate Leavitt''s relation.'
            now: '{staff} helps Leavitt prepare a list for joint observation. The observatory gives her time to review the resulting measurements and check the calibration sample with her collaborators.'
            who: leavitt_cambridge_ma
            bio: 'Leavitt continued working on stellar brightness and took part in applying her relation to distances. She left her own observing notes on the calibration.'
        vignettes:
          rank: 'You put the table in order of period and find one row that lost its label. The reader retrieves its identifier before the plotted point is moved.'
          distance: 'You ask whether a nearer star could merely look brighter. The reader puts a finger on the heading for the Small Magellanic Cloud. You write the reason for comparing this group beside the plot.'
          period: 'The reader gives you the brightness first. You ask for the period as well and keep the two values together until the last dot is marked.'
      zh:
        name: "星星的一条规则"
        place: "马萨诸塞州剑桥"
        figure: "亨丽埃塔·勒维特"
        story: '1912 年哈佛天文台通报刊出勒维特对小麦哲伦云 25 颗变星的比较。在这一组星里，较亮者的周期通常较长。'
        relic: "一块玻璃底片"
        relic_desc: "一块布满细小星点的照相底片。"
        points:
          p1: '排印前帮勒维特把暗星观测与玻璃底片对上，护住二十五颗变星的周期表'
          p2: '劝排印人员在周期表后留一份底片索引，让别人能回到同一颗星重做测量'
          p3: '用通报里留下的定标难题争取观测时间，让勒维特本人参与下一步'
        points_fail:
          p1: '错号让排印人员删去无法查对的几行，二十五颗星的周期表没有发表。行程同步失败，员工被召回。'
          p2: '读者只能对着刊出的数字找星，得向哈佛另问原始底片。'
          p3: '论文留下了亮度与周期的关系，给它定出绝对尺度的工作要由外地的研究者接手。'
        shift:
          p1:
            was: '1912 年 3 月 3 日，哈佛天文台第 173 号通报刊登了勒维特整理的二十五颗小麦哲伦云变星周期。'
          p2:
            was: '1912 年 3 月的通报刊出了周期、亮度与图表，玻璃底片编号另存于观测记录。'
            now: '{staff}帮勒维特把星号同底片号配成附表，印出后读者也能顺着编号核对。'
          p3:
            was: '1913 年，赫茨普龙用了银河系中的造父变星为勒维特的关系式定标。'
            now: '{staff}替勒维特整理一份可供合作观测的名单，天文台给她留出时间审阅后来的量测。她能跟合作者一起核对定标用的样本。'
            who: leavitt_cambridge_ma
            bio: '勒维特继续做变星的亮度研究，并参与将自己的关系式用于测量距离。她给后来的定标留有自己的观测说明。'
        vignettes:
          rank: '你按周期给表格排序，发现一行丢了标号。读表人在图上的点被挪动前找回了对应的星号。'
          distance: '你问近一点的星是不是光看起来就更亮。读表人把手指按在「小麦哲伦云」的标题上，你把为什么选这一组来比记在图旁。'
          period: '读表人先报亮度。你再问周期，把两个数一起记，直到最后一个点也画上去。'
text:
  en:
    name: Henrietta Leavitt
    text: American astronomer, 1868 to 1921, who worked at Harvard College Observatory. She found that the period of a Cepheid variable star is tied to its brightness, which let astronomers measure distances to other galaxies.
  zh:
    name: 亨丽埃塔·勒维特
    text: 美国天文学家，1868 年生，1921 年去世，在哈佛天文台工作。她发现造父变星的周期与亮度相关，天文学家由此得以测量到其他星系的距离。
