    text:
      en:
        name: Moons around Jupiter
        place: Padua
        figure: Galileo Galilei
        story: 'In the Starry Messenger, Galileo records changing positions of four small bodies near Jupiter and concludes that they orbit it.'
        story_prose:
          opening:
            - 'At the end of a January observation in Padua, Galileo draws points of light beside Jupiter. Their positions change on the next evening. A copyist stacks the drawings by size, and the person taking them to Venice asks which night goes first.'
            - 'The observations of Jupiter’s moons appeared in the Sidereus Nuncius in 1610. An April trial in Bologna drew objections and Horký later printed a pamphlet against the book. In this branch you can keep the January nights in order and let some of the guests see the points themselves.'
            - 'Send someone who can compare sketches and dates to check the printer’s copy. At Magini’s house, help the visitors find an unmistakable bright star before looking back at Jupiter.'
          points:
            p1: 'You ask the copyist which came first, the night with three points or the night with two. He brings out the notebook and sees he has them reversed. Galileo reads the dates and you match each corner to its entry before handing over the set for Venice. The copyist turns to the second night and nods when he sees how the points have changed places.'
            p2: 'The first guest at Magini’s pulls back and says he has seen only a wash of light. Galileo makes room. You have the guest find one bright star he recognises, then return to Jupiter. The guest settles in his seat and puts a hand up to get his companion’s attention. He asks her to count for herself before he says the number he saw.'
          outcomes:
            all: 'The printed diagrams keep their January order. In Bologna the guests record their own counts and ask where the points will be the next night.'
            p1: 'The copy for Venice is in order. In Bologna there will still be letters and a pamphlet contesting the observations.'
            p2: 'At least one guest can give his own count of the lights beside Jupiter. The print record goes out of sync and the count remains in the traveller’s account.'
          none: 'The copyist stacks the sheets by size, without putting the nights in order.'
          not_admitted: 'Someone by the door asks who brought you. You stay outside and see the copyist put the loose pictures into a sleeve.'
          desync: 'The loose diagrams change places in the printer’s copy. The original sequence falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'The copyist turns to the second night and nods when he sees how the points have changed places.'
            p2: 'He asks her to count for herself before he says the number he saw.'
        relic: A ground lens
        relic_desc: A small glass lens, polished by hand.
        points:
          p1: 'Keep Galileo’s dated sketches of Jupiter and its points of light in order for the copy going to Venice'
          p2: 'At Bologna in late April, help Magini''s guests see the moons of Jupiter through Galileo''s telescope'
        points_fail:
          p1: 'The loose sketches lose their order. The printer’s copy puts the nights out of sequence, and the office recalls the employee.'
          p2: 'The guests look and say they see nothing. Horký writes to Kepler and prints a pamphlet against the Sidereus Nuncius in June.'
        shift:
          p1:
            was: 'Galileo observed Jupiter over successive nights from January 1610 and printed positional records in Sidereus Nuncius.'
          p2:
            was: 'In late April 1610 Galileo showed his telescope to Magini and other guests at the Palazzo Caprara in Bologna. They said they could not see the satellites, and Martin Horký, who was there, printed a pamphlet against Galileo in June.'
            now: '{staff} sets the tube steady and shows the guests where to look. Several of them see the points of light beside Jupiter that night, and Horký''s pamphlet finds less ground. The new stars are accepted sooner.'
            who: galileo_padua
            bio: 'At Bologna in April 1610 Magini''s guests saw the moons of Jupiter through Galileo''s telescope. The doubt that followed the Sidereus Nuncius was shorter.'
        vignettes:
          alignment: 'You stop the copyist from aligning the pages by their edges. Line up Jupiter instead, you suggest. The dots no longer sit on top of one another.'
          telescope: 'You ask which dot is the fourth. The copyist sets out the sheets from several nights and asks which should be trusted when the dots seem to merge.'
          dates: 'You mark the date on each loose sheet before the copyist stacks them. The order lets the next reader see the dots change position.'
      zh:
        name: 木星身边的卫星
        place: 帕多瓦
        figure: 伽利略
        story: '伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。'
        story_prose:
          opening:
            - '帕多瓦一月的观测结束，伽利略把一排光点画在木星旁边。第二晚位置有了变化，抄写人把两张图按纸的大小叠放。去威尼斯的人问，他该照哪一天的图先排。'
            - '1610 年，《星际信使》刊出对木星卫星的连续观测。那年四月博洛尼亚有一次观测尝试，霍尔基后来印文质疑。分支能先保住一月的图稿日序，再帮来客实际看到几颗光点。'
            - '让会对图和记日期的人整理付印稿。到马吉尼家，要让来客先看清亮星，再自己看木星旁边。'
          points:
            p1: '你问抄写人是先看到了三颗还是先看到了两颗。他把记录簿拿来，发现正好反了。伽利略逐夜读出日期，你把页角和簿上的观测时刻一一对过，再将图交给去威尼斯的抄写人。他翻到第二夜才点头，认得出那些光点怎样换了位置。'
            p2: '进马吉尼家的第一个来客撤回了眼睛，说只看见一层薄光。伽利略让出位置，你请来客先找一颗能认出的亮星，再回到木星那里。来客坐稳后抬起手，隔着桌子指给同伴看。他叫第二个人也数一次，先把自己数到的几个按在心里。'
          outcomes:
            all: '印出来的图保留一月日序。博洛尼亚那晚，来客还留下各自记下的数目，问下一夜会换到哪里。'
            p1: '威尼斯的排印稿顺序正确。博洛尼亚的争议仍会有写信和印小册子的经过。'
            p2: '至少一位来客能自己报出木星旁的光点。印刷稿日序失去同步，这一小段只能随旅途记录保存。'
          none: '抄写人用纸的大小整理，图仍没有排出夜夜的先后。'
          not_admitted: '门边的人问来客跟谁一道。你没能进屋，最后看到的是抄写人把图收入纸套。'
          desync: '散开的图在排印稿里换了日序，原有观测记述失去同步，事务所召回员工。'
          excerpts:
            p1: '他翻到第二夜才点头，认得出那些光点怎样换了位置。'
            p2: '他叫第二个人也数一次，先把自己数到的几个按在心里。'
        relic: 一片磨制的透镜
        relic_desc: 一片小小的玻璃透镜，是手工磨出来的。
        points:
          p1: '把一月连夜画下的木星与光点位置按日期装好，护住送往威尼斯付印时的观测日序'
          p2: '四月下旬在博洛尼亚，帮马吉尼的客人们从伽利略的望远镜里看见木星的卫星'
        points_fail:
          p1: '几夜的简图散开后只剩大致次序，排印稿的日序错位，事务所因同步失败召回员工。'
          p2: '客人们看过以后说什么也没看见。霍尔基写信给开普勒，六月印出反驳《星际信使》的小册子。'
        shift:
          p1:
            was: '伽利略从 1610 年 1 月起连续观测木星，随后在《星际信使》刊出位置记录。'
          p2:
            was: '1610 年 4 月下旬，伽利略在博洛尼亚的卡普拉拉宫把望远镜给马吉尼等客人看，他们说看不到那几颗卫星；在场的马丁·霍尔基六月印出了反驳伽利略的小册子。'
            now: '{staff}把镜筒架稳，教客人往哪里看。好几位客人当晚看见了木星旁边的光点，霍尔基的小册子少了立足的地方，这几颗新星早一些得到承认。'
            who: galileo_padua
            bio: '1610 年 4 月在博洛尼亚，马吉尼的客人们从伽利略的望远镜里看见了木星的卫星。《星际信使》之后的怀疑短了许多。'
        vignettes:
          alignment: '你拦住正要把两页按纸边对齐的誊写员。先对齐木星吧。纸一挪，几个光点就错开了。'
          telescope: '你追问第四个光点是哪一个。誊写员摊开几晚的图，反问你：有两个点挨得看不清时，该相信哪一夜？'
          dates: '誊写员叠起散页之前，你替每张补上日期。下一个人就能按夜看出光点怎样换了位置。'
text:
  en:
    name: Galileo Galilei
    text: Italian scientist, 1564 to 1642, who taught at Padua. With his telescope he saw the moons of Jupiter and the phases of Venus, published in 1610. He was later tried by the Inquisition and spent his last years under house arrest.
  zh:
    name: 伽利略
    text: 意大利科学家，1564 年生，1642 年去世，曾在帕多瓦任教。他用望远镜看到木星的卫星和金星的位相，1610 年公布。后来他受宗教裁判所审判，晚年被软禁。
