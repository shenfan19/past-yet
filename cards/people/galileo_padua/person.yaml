    text:
      en:
        who: 'Galileo Galilei'
        quote: 'four wandering stars, known or observed by none of those who preceded us'
        occasion: 'In the printed report Galileo introduces the four objects found near Jupiter.'
      zh:
        who: '伽利略·伽利莱'
        quote: '四颗游星，在我们以前无人知道或观测到。'
        occasion: '伽利略在刊行报告开头介绍木星附近发现的四颗天体。'
      la:
        who: 'Galileo Galilei'
        quote: 'quatuor Erraticas Stellas, nemini eorum qui ante nos cognitas aut observatas'
        occasion: 'In the printed report Galileo introduces the four objects found near Jupiter.'
      zh-Hant:
        who: '伽利略'
        quote: '四顆遊星，在我們以前無人知道或觀測到。'
        occasion: '伽利略在刊行報告開頭介紹木星附近發現的四顆天體。'
      fr:
        who: 'Galilée'
        quote: 'quatre étoiles errantes, connues ou observées par aucun de ceux qui nous ont précédés'
        occasion: 'Dans le rapport imprimé, Galilée présente les quatre objets trouvés près de Jupiter.'
      es:
        who: 'Galileo Galilei'
        quote: 'cuatro estrellas errantes, conocidas u observadas por ninguno de los que nos precedieron'
        occasion: 'En el informe impreso, Galileo presenta los cuatro objetos encontrados cerca de Júpiter.'
      ja:
        who: 'ガリレオ・ガリレイ'
        quote: '4 つのさまよう星、私たちに先立った人たちの誰も知っておらず、観察していませんでした'
        occasion: '印刷された報告書の中で、ガリレオは木星の近くで発見された 4 つの天体を紹介しています。'
      ko:
        who: '갈릴레오 갈릴레이'
        quote: '떠도는 네 개의 별, 우리보다 앞서 살았던 사람들 중 누구도 알거나 관찰하지 못한 별'
        occasion: '인쇄된 보고서에서 갈릴레오는 목성 근처에서 발견된 네 개의 물체를 소개합니다.'
      ru:
        who: 'Галилео Галилей'
        quote: 'четыре блуждающие звезды, неизвестные и не наблюдаемые никем из предшествовавших нам'
        occasion: 'В печатном отчете Галилей представляет четыре объекта, найденные вблизи Юпитера.'
