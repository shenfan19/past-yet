    text:
      en:
        name: Moons around Jupiter
        place: Padua
        figure: Galileo Galilei
        story: 'In the Starry Messenger, Galileo records changing positions of four small bodies near Jupiter and concludes that they orbit it.'
        relic: A ground lens
        relic_desc: A small glass lens, polished by hand.
        points:
          p1: 'Keep Galileo’s dated sketches of Jupiter and its points of light in order for the copy going to Venice'
          p2: 'At Bologna in late April, help Magini''s guests see the moons of Jupiter through Galileo''s telescope'
        points_fail:
          p1: 'The loose sketches lose their order. The printer’s copy puts the nights out of sequence, and the office recalls the employee.'
          p2: 'The guests look and say they see nothing. Horký writes to Kepler and prints a pamphlet against the Sidereus Nuncius in June.'
        shift:
          p1:
            was: 'Galileo observed Jupiter over successive nights from January 1610 and printed positional records in Sidereus Nuncius.'
          p2:
            was: 'In late April 1610 Galileo showed his telescope to Magini and other guests at the Palazzo Caprara in Bologna. They said they could not see the satellites, and Martin Horký, who was there, printed a pamphlet against Galileo in June.'
            now: '{staff} sets the tube steady and shows the guests where to look. Several of them see the points of light beside Jupiter that night, and Horký''s pamphlet finds less ground. The new stars are accepted sooner.'
            who: galileo_padua
            bio: 'At Bologna in April 1610 Magini''s guests saw the moons of Jupiter through Galileo''s telescope. The doubt that followed the Sidereus Nuncius was shorter.'
        vignettes:
          alignment: 'You stop the copyist from aligning the pages by their edges. Line up Jupiter instead, you suggest. The dots no longer sit on top of one another.'
          telescope: 'You ask which dot is the fourth. The copyist sets out the sheets from several nights and asks which should be trusted when the dots seem to merge.'
          dates: 'You mark the date on each loose sheet before the copyist stacks them. The order lets the next reader see the dots change position.'
      zh:
        name: 木星身边的卫星
        place: 帕多瓦
        figure: 伽利略
        story: '伽利略在《星际信使》中记录了木星附近四个小天体的位置变化，并判断它们绕木星运行。'
        relic: 一片磨制的透镜
        relic_desc: 一片小小的玻璃透镜，是手工磨出来的。
        points:
          p1: '把一月连夜画下的木星与光点位置按日期装好，护住送往威尼斯付印时的观测日序'
          p2: '四月下旬在博洛尼亚，帮马吉尼的客人们从伽利略的望远镜里看见木星的卫星'
        points_fail:
          p1: '几夜的简图散开后只剩大致次序，排印稿的日序错位，事务所因同步失败召回员工。'
          p2: '客人们看过以后说什么也没看见。霍尔基写信给开普勒，六月印出反驳《星际信使》的小册子。'
        shift:
          p1:
            was: '伽利略从 1610 年 1 月起连续观测木星，随后在《星际信使》刊出位置记录。'
          p2:
            was: '1610 年 4 月下旬，伽利略在博洛尼亚的卡普拉拉宫把望远镜给马吉尼等客人看，他们说看不到那几颗卫星；在场的马丁·霍尔基六月印出了反驳伽利略的小册子。'
            now: '{staff}把镜筒架稳，教客人往哪里看。好几位客人当晚看见了木星旁边的光点，霍尔基的小册子少了立足的地方，这几颗新星早一些得到承认。'
            who: galileo_padua
            bio: '1610 年 4 月在博洛尼亚，马吉尼的客人们从伽利略的望远镜里看见了木星的卫星。《星际信使》之后的怀疑短了许多。'
        vignettes:
          alignment: '你拦住正要把两页按纸边对齐的誊写员。先对齐木星吧。纸一挪，几个光点就错开了。'
          telescope: '你追问第四个光点是哪一个。誊写员摊开几晚的图，反问你：有两个点挨得看不清时，该相信哪一夜？'
          dates: '誊写员叠起散页之前，你替每张补上日期。下一个人就能按夜看出光点怎样换了位置。'
text:
  en:
    name: Galileo Galilei
    text: Italian scientist, 1564 to 1642, who taught at Padua. With his telescope he saw the moons of Jupiter and the phases of Venus, published in 1610. He was later tried by the Inquisition and spent his last years under house arrest.
  zh:
    name: 伽利略
    text: 意大利科学家，1564 年生，1642 年去世，曾在帕多瓦任教。他用望远镜看到木星的卫星和金星的位相，1610 年公布。后来他受宗教裁判所审判，晚年被软禁。
