  regret_choice: '派会讲课的去，四月那次会上元素表重新排进了议程；派懂德文的去，六月付印前那个词改回了周期性。两件事隔了一个多月，一个人要从冬天一直守到夏天。'
  bookend: '从 3 月 1 日排好的一页元素表开始，以 1875 年镓被发现填上空位收尾，中间是一场作者缺席的会和一个译错的词。'
