    text:
      en: 'At the meeting of the Russian Chemical Society on 18 March 1869 (6 March in the Russian calendar) Nikolai Menshutkin read Mendeleev''s paper for him. Why Mendeleev was absent is told two ways: a trip to inspect cheese dairies in Tver province, or illness, which Menshutkin''s son gave in 1934. The minutes put the discussion off until the next meeting because the author was absent.'
      zh: '1869 年 3 月 18 日（俄历 3 月 6 日），俄国化学学会开会，尼古拉·缅舒特金代门捷列夫宣读论文。门捷列夫为什么不在场有两种说法：一说去特维尔省考察奶酪作坊，一说生病，后一说出自缅舒特金的儿子 1934 年的回忆。会议记录写明，因作者不在，讨论推到下次会议。'
    line:
      en: '18 March 1869: at the Russian Chemical Society Menshutkin reads Mendeleev''s paper for him; the discussion is put off until the author is present.'
      zh: '1869 年 3 月 18 日，俄国化学学会开会，缅舒特金替门捷列夫宣读论文，讨论推到作者在场的时候。'
  next_meeting:
    date: '1869-04-15'
    stay_day: 39
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [mendeleev_minutes_translation]
    text:
      en: 'At the next meeting of the society, on 15 April 1869 (3 April in the Russian calendar), the classification of the elements was not taken up, nor at the meetings after it.'
      zh: '1869 年 4 月 15 日（俄历 4 月 3 日）学会再开会，元素的分类没有被提起，此后几次会议也没有。'
    line:
      en: '15 April 1869: the society meets again, and nobody brings up the table of the elements.'
      zh: '1869 年 4 月 15 日，学会再次开会，没有人提起那张元素表。'
  german_abstract:
    date: '1869-05'
    stay_day: 66
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendeleev_minutes_translation, mendeleev_giunta_abstract]
    text:
      en: 'In May 1869 Mendeleev prepared a short abstract of his paper for the German Zeitschrift für Chemie. In the German translation his first conclusion, that the elements in order of atomic weight show a periodicity of properties, came out as a stepwise change of properties.'
      zh: '1869 年 5 月，门捷列夫为德国《化学杂志》备了一份论文摘要。译成德文时，他的第一条结论，按原子量排列的元素在性质上呈现周期性，被译成了性质逐级变化。'
    line:
      en: 'May 1869: Mendeleev sends a short abstract of his paper to a German journal, and it goes to a translator.'
      zh: '1869 年 5 月，门捷列夫给德国的期刊寄去一份论文摘要，交人译成德文。'
  gallium:
    date: '1875'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mendeleev_wiki, mendeleev_britannica]
    text:
      en: 'In 1875 gallium was discovered, an element with the properties Mendeleev had foretold for one of the gaps in his table.'
      zh: '1875 年，镓被发现，它的性质与门捷列夫为表中一个空位预言的元素相合。'
    line:
      en: '1875: gallium is found, and it fills one of the gaps Mendeleev left in his table.'
      zh: '1875 年，镓被发现，填上了门捷列夫在表里留下的一个空位。'
  death:
    date: '1907-02-02'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [mendeleev_wiki, mendeleev_britannica]
    text:
      en: 'Dmitri Mendeleev died in St Petersburg on 2 February 1907.'
      zh: '1907 年 2 月 2 日，德米特里·门捷列夫在圣彼得堡去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '2 February 1907: Dmitri Mendeleev dies in St Petersburg.'
      zh: '1907 年 2 月 2 日，德米特里·门捷列夫在圣彼得堡去世。'
