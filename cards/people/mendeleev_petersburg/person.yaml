    text:
      en: 'On 1 March 1869 (17 February in the Russian calendar) Mendeleev drew up his first table. Its publication in the second fascicle of Principles of Chemistry followed on 26 or 27 March, Gregorian; it also circulated as a separate sheet.'
      zh: '1869 年 3 月 1 日（俄历 2 月 17 日），门捷列夫排出第一张表。它在公历 3 月 26 日或 27 日随《化学原理》第二分册刊出，另印散页传阅。'
    line:
