    text:
      en:
        name: The periodic table
        place: Saint Petersburg
        figure: Dmitri Mendeleev
        story: 'On 1 March 1869 Dmitri Mendeleev drew up a one-page table grouping the elements by atomic weight and chemical similarity. At the Russian Chemical Society meeting on 18 March, Nikolai Menshutkin read the paper in Mendeleev''s absence. The minutes deferred discussion to the next meeting, where the subject was not taken up. The table appeared in Mendeleev''s chemistry textbook later in March and was circulated separately. In a German abstract that spring, periodic recurrence became stepwise change.'
        story_prose:
          opening:
            - 'Saint Petersburg, spring 1869. On 1 March Dmitri Mendeleev finished a one-page table grouping the elements by atomic weight and chemical likeness, with gaps left in it for elements not yet found.'
            - 'In history, he was absent when the Russian Chemical Society met on 18 March, gone to look at cheese dairies in Tver province by one account, ill by another, and Nikolai Menshutkin read the paper for him; the minutes put the discussion off because the author was absent, and at the next meeting nobody brought it up. In the abstract sent to Germany in May, his first conclusion, the periodicity of properties, came out as stepwise change. In this branch, a compositor at the printer’s grumbles about the empty boxes in the table, and an innkeeper keeps a samovar.'
            - 'A few kinds of people can help on this trip: someone who knows papers and can tell a manuscript from the table that goes with it; someone who teaches and can carry a round of questions at a meeting; someone who knows German and can catch a single word.'
          outcomes:
            all: 'That summer German readers found periodic recurrence in the abstract. In the minutes of the society in Saint Petersburg the item of the table was followed by half a page of questions and answers, and on the table itself several of the gaps had pencil rings beside them.'
            p2: 'In the society’s minutes the item of the table was now followed by half a page of questions and answers. He kept the table by him afterwards, with pencil rings beside several of the gaps.'
            p3: 'That summer German readers found in the abstract that the properties of the elements recur periodically. When someone wrote to ask how to tell a recurrence from an exception, he spread out the table and answered point by point.'
            p1: 'Late in March the table came out with the second fascicle of Principles of Chemistry, and was also printed as a separate sheet for colleagues. In 1875 gallium was found and filled one of the gaps in it.'
          none: 'On 15 April the society met again, and nobody brought up the table. At the printer’s the dry sheets came down from the line one by one, the gaps still gaps.'
          desync: 'On 18 March Menshutkin had only the table; the manuscript was still packed in the luggage, and the society struck the item. When {staff} was recalled the table still lay spread on the desk in the meeting room, and no one had touched it.'
          not_admitted: '{staff} never got through the society’s door, and spent a few days at an inn learning to draw tea from the samovar. The keeper watched {staff}’s boots the whole time, until the tap was turned the right way.'
          points:
            p1:
              class_lettered: 'On 18 March the Russian Chemical Society met, and Mendeleev was not there. Of what he had left for Menshutkin, the table was in one place and the manuscript of the paper still packed in unopened luggage. {staff}, as a keeper of papers does, found the manuscript in the luggage, checked it page by page, clipped it together with the table, and put both into Menshutkin’s hands before the meeting. Menshutkin spread the table on the desk, opened the manuscript and read it page after page. The table had gaps in it, and in the back row someone craned to see.'
              else: 'On 18 March the Russian Chemical Society met, and Mendeleev was not there. Of what he had left for Menshutkin, the table was in one place and the manuscript of the paper still packed in unopened luggage. {staff} sat up half the night, found the manuscript in an unopened trunk before dawn, and hurried to the meeting with it and the table in both arms. Menshutkin spread the table on the desk, opened the manuscript and read it page after page. The table had gaps in it, and in the back row someone craned to see.'
            p2:
              class_teaching: 'On 15 April the society met again, and Mendeleev was in town. The item put off at the last meeting still stood on the old page. {staff}, as a teacher would, copied the table out large before the meeting and hung it at the front of the room, and copied the line from the last minutes, to be discussed when the author is present, to the top of the agenda. When the item came up Mendeleev stood with the table in his hand. Whenever someone asked about a gap, he drew a pencil ring round that box. By the end of the meeting there were rings in several places, and the pencil point had worn blunt.'
              else: 'On 15 April the society met again, and Mendeleev was in town. The item put off at the last meeting still stood on the old page. {staff} found the secretary before the meeting, pointed to the line in the last minutes, to be discussed when the author is present, and asked him to copy it into the agenda for this one. When the item came up Mendeleev stood with the table in his hand. Whenever someone asked about a gap, he drew a pencil ring round that box. By the end of the meeting there were rings in several places, and the pencil point had worn blunt.'
            p3:
              class_lettered: 'Early in June the abstract for the German Zeitschrift für Chemie was already in German, and not yet printed. {staff}, as a translator does, read the German beside the Russian and stopped at the first conclusion: the original said the properties show periodicity, the translation said they change stepwise. Mendeleev took the sheet, read the line, struck out the word and wrote back beside it the word for periodicity. Before the ink was dry the sheet went into the envelope for Germany.'
              else: 'Early in June the abstract for the German Zeitschrift für Chemie was already in German, and not yet printed. {staff} checked the German against the Russian point by point and underlined one word in the first conclusion: periodicity in the original, stepwise change in the translation. Mendeleev took the sheet, read the line, struck out the word and wrote back beside it the word for periodicity. Before the ink was dry the sheet went into the envelope for Germany.'
          excerpts:
            p2: 'Whenever someone asked about a gap, he drew a pencil ring round that box. By the end of the meeting there were rings in several places, and the pencil point had worn blunt.'
            p3: 'Mendeleev took the sheet, read the line, struck out the word and wrote back beside it the word for periodicity. Before the ink was dry the sheet went into the envelope for Germany.'
            p1: 'Menshutkin spread the table on the desk, opened the manuscript and read it page after page. The table had gaps in it, and in the back row someone craned to see.'
        relic: A deck of element cards
        relic_desc: Hand written cards that can be dealt like patience.
        points:
          p1: 'With Mendeleev already out of town, get the paper and table he left for Menshutkin to the Chemical Society meeting together'
          p2: 'When the author returns, recover the item set aside for discussion and give him time at the next meeting to answer questions about the table'
          p3: 'Before the German abstract goes to press, have Mendeleev check its first conclusion and restore the word that says properties recur periodically'
        points_fail:
          p1: 'Menshutkin receives only the table. The paper is still packed with the author’s things, so the society drops the item and the office recalls the employee.'
          p2: 'The deferred item stays on the previous page of minutes. The next meeting sets aside no time to discuss the elements.'
          p3: 'The German copy has gone to the compositor. Readers see properties changing in steps and miss the claim that they recur.'
        shift:
          p1:
            was: 'On March 18, 1869 (March 6 in the Russian calendar), Menshutkin presented the paper for Mendeleev. Mendeleev was absent: by one account he had left to inspect cheese dairies in Tver Governorate, by another he was ill.'
          p2:
            was: 'The minutes deferred discussion because Mendeleev was absent. Later meetings did not take it up.'
            now: 'The society gives Mendeleev time to answer at its next meeting. He marks the disputed entries and agrees to check them with the chemists who raised them.'
          p3:
            was: 'The 1869 German abstract used a word for stepwise change where the Russian original asserted periodicity.'
            now: 'The German abstract says that the properties recur periodically. A correspondent who has read only the abstract asks about the difference between recurrence and an exception, and Mendeleev can answer from the table.'
            who: mendeleev_petersburg
            bio: 'Mendeleev put together an early table in St. Petersburg and circulated it through a society meeting, loose sheets and journals. As the work crossed languages, a central term changed meaning.'
        vignettes:
          flyers: '{staff} helps at the printer''s, hanging the fresh sheets of a table on a line to dry. The compositor grumbles that he has never set a page with so many empty boxes and question marks, and asks whether the gentleman forgot to fill them in.'
          neva: 'The ice on the Neva has gone. {staff} stands with the crowd on the embankment as a boat crosses from the fortress to the palace, and a man alongside says that until that boat crosses, nobody may.'
          samovar: '{staff} learns to draw tea from a samovar at the inn. The keeper says foreigners always turn the tap the wrong way and scald their boots, and watches {staff}''s feet the whole time.'
      zh:
        name: 元素周期表
        place: 圣彼得堡
        figure: 门捷列夫
        story: '1869 年 3 月 1 日，德米特里·门捷列夫排好一张单页的表，按原子量和化学性质的相似性给元素分组。3 月 18 日，俄国化学学会开会，门捷列夫不在，尼古拉·缅舒特金代他宣读论文。会议记录把讨论推到下一次，下一次却没再议。3 月下旬，这张表随他的化学教科书刊出，也另印散页寄给同行。那年春天的一份德文摘要，把性质的「周期性重现」译成了「逐级变化」。'
        story_prose:
          opening:
            - '1869 年春，圣彼得堡。3 月 1 日，德米特里·门捷列夫排好了一张单页的表，按原子量和化学性质的相似给元素分组，表里留着空格，等还没发现的元素。'
            - '史实里，3 月 18 日俄国化学学会开会，他不在场，一说去了特维尔省看奶酪作坊，一说病了，论文由尼古拉·缅舒特金代读；记录写明作者不在，讨论推到下一次，下一次却没有人再提。五月寄往德国的摘要里，他的第一条结论，性质的周期性，被译成了逐级变化。在这条分支里，印刷所有个嫌表上空格太多的排字工，客栈里有个守着茶炊的掌柜。'
            - '这一趟用得上几种人：懂文书、分得清原稿和附表的人；会讲课、在会上撑得起一场问答的人；懂德文、校得出一个词的人。'
          outcomes:
            all: '那年夏天，德国的读者在摘要里读到了周期性重现。圣彼得堡学会的记录里，元素表那一项后面跟着半页问答，那张表上，几处空格旁边画着铅笔圈。'
            p2: '学会的记录里，元素表那一项后面多了半页问答。那张表后来一直留在他手边，几处空格旁边画着铅笔圈。'
            p3: '那年夏天，德国的读者在摘要里读到，元素的性质会周期性重现。有人来信问重现和例外怎样分，他摊开那张表，一条一条写了回信。'
            p1: '3 月下旬，这张表随《化学原理》第二分册刊出，又另印散页寄给同行。1875 年，镓被发现，填上了表里的一个空格。'
          none: '4 月 15 日，学会再开会，没有人提起那张表。印刷所的绳子上，晾干的散页一张张收了下来，空格还是空格。'
          desync: '3 月 18 日，缅舒特金手里只有那张表，原稿还压在行李里，学会划掉了这一项。{staff}被召回时，那张表还摊在会场的桌上，没有人去碰。'
          not_admitted: '{staff}没能进学会的门，只在客栈里学了几天从茶炊接茶。掌柜一直盯着{staff}的靴子，直到龙头拧对为止。'
          points:
            p1:
              class_lettered: '3 月 18 日，俄国化学学会开会，门捷列夫不在。他留给缅舒特金的东西，表在一处，论文原稿还压在没拆的行李里。{staff}照管文书的规矩，从行李里找出那叠原稿，一页页对过页码，和那张表用同一个纸夹夹好，开会前送到缅舒特金手上。缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。'
              else: '3 月 18 日，俄国化学学会开会，门捷列夫不在。他留给缅舒特金的东西，表在一处，论文原稿还压在没拆的行李里。{staff}守了半夜，天亮前从一只没拆的箱子里翻出那叠原稿，和那张表一起抱着赶到会场。缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。'
            p2:
              class_teaching: '4 月 15 日，学会再开会，门捷列夫在城里。上一次记录里推后的那一项，还留在旧页上。{staff}照讲课的办法，开会前把那张表抄大，挂在会场前头，又把上次记录里那一行“待作者在场时讨论”抄在议程最上面。轮到这一项，门捷列夫站起来，手里拿着那张表。有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。'
              else: '4 月 15 日，学会再开会，门捷列夫在城里。上一次记录里推后的那一项，还留在旧页上。{staff}开会前找到记录员，指着上次记录里“待作者在场时讨论”那一行，请他把它抄进这一回的议程。轮到这一项，门捷列夫站起来，手里拿着那张表。有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。'
            p3:
              class_lettered: '六月初，给德国《化学杂志》的那份摘要已经有了德文稿，还没有付印。{staff}照译者的规矩，把德文稿和俄文原稿并排对读，读到第一条结论停下来：原文说性质呈现周期性，译稿写的却是逐级变化。门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。'
              else: '六月初，给德国《化学杂志》的那份摘要已经有了德文稿，还没有付印。{staff}一条一条对着俄文原稿核德文稿，在第一条结论的那个词底下画了一道线：原文是周期性，译稿成了逐级变化。门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。'
          excerpts:
            p2: '有人问到一个空格，他就用铅笔在那一格上画一个圈。散会时，那张表上已经圈了好几处，铅笔头也磨秃了。'
            p3: '门捷列夫拿过稿子看了那一行，划掉那个词，在旁边改回了表示周期性的那个。墨还没干，稿子就装进了寄往德国的信封。'
            p1: '缅舒特金把表摊在桌上，翻开原稿，一页一页念下去。表上留着几个空格，后排有人伸长了脖子去看。'
        relic: 一副元素卡片
        relic_desc: 手写的卡片，可以像摆纸牌一样摆。
        points:
          p1: '门捷列夫已经离城。把他留给缅舒特金的论文和附表合在一起交到会场，赶上俄国化学学会宣读'
          p2: '趁作者从外地回来，把下次会议原留待讨论的一项重新排进议程，让他逐一回应来问排表依据的人'
          p3: '德文摘要付印前，请门捷列夫确认第一条结论的译法，把表示性质周期性重现的词改回去'
        points_fail:
          p1: '报告人只接到附表，原稿还压在门捷列夫的行李里。学会划掉这一项，事务所因同步失败召回员工。'
          p2: '上一回记录的待议事项留在旧页上。到下次会议，没有人再为元素表留一段可讨论的时间。'
          p3: '德文稿已送去排字。读者看到性质逐级改变的说法，看不出作者强调性质隔一段会重现。'
        shift:
          p1:
            was: '1869 年 3 月 18 日（俄历 3 月 6 日），论文由缅舒特金代为宣读。门捷列夫不在场，一说去特维尔省考察奶酪作坊，一说生病。'
          p2:
            was: '会议记录因作者缺席而延后讨论，后来学会会议没有接续讨论这件事。'
            now: '学会在下一次会上给门捷列夫留出回话的时间。他把几处争议栏圈出来，和提出疑问的人约定后续核查。'
          p3:
            was: '1869 年的德文摘要将原文的周期性译成表示逐步变化的词。'
            now: '发出的德文摘要写明性质会周期性重现。一位只读到摘要的通信者问起怎样区分重现和例外，门捷列夫用自己的表逐项回复。'
            who: mendeleev_petersburg
            bio: '门捷列夫在圣彼得堡写成早期元素表，经学会会议、散印表和期刊让其他化学家见到它。俄文原稿的关键概念在跨语言传递时曾被改变。'
        vignettes:
          flyers: '{staff}在印刷所帮忙，把刚印出的表一张张晾在绳上，屋里一股油墨味。排字工嘀咕，他排了半辈子版，没见过这么多空格和问号的，问是不是那位先生忘了填。'
          neva: '涅瓦河的冰化了，碎冰块还贴着岸往下漂。{staff}挤在河岸上看一条小船从要塞划向宫殿，旁边的人说，那条船没过河之前，谁也不许下水。'
          samovar: '{staff}在客栈里学着从茶炊里接茶，铜壶擦得能照见人影。掌柜说外国人总把龙头拧反，烫了靴子，一边说一边盯着{staff}的脚。'
text:
  en:
    name: Dmitri Mendeleev
    text: Russian chemist, 1834 to 1907. In 1869 in St Petersburg he published a periodic table that arranged the elements by atomic weight and left gaps for elements not yet found. He died in St Petersburg on 2 February 1907.
  zh:
    name: 门捷列夫
    text: 俄国化学家，1834 年生，1907 年去世。1869 年他在圣彼得堡发表周期表，按原子量排列元素，并为尚未发现的元素留出空位。1907 年 2 月 2 日，他在圣彼得堡去世。
quotes:
  mendeleev_petersburg_period:
    order: 1
    tier: full
    date: '1869'
    checked: official_record
    sources: [mendeleev_periodic_collected]
    original: ru
    text:
      ru: {quote: 'Элементы, расположенные по величине их атомного веса, представляют явственную периодичность свойств.'}
      en: {who: 'Dmitri Mendeleev', quote: 'Elements arranged by their atomic weights show a distinct periodicity in their properties.', occasion: 'conclusions of On the Relation of the Properties to the Atomic Weights of the Elements (game translation)'}
      zh: {who: '门捷列夫', quote: '元素按原子量排列时，其性质呈现明显的周期性。', occasion: '《元素性质与原子量的关系》的结论（游戏译文）'}
  mendeleev_petersburg_unfound:
    order: 2
    tier: none
    date: '1869'
    checked: official_record
    sources: [mendeleev_periodic_collected]
    original: ru
    text:
      ru: {quote: 'Должно ожидать открытия еще многих неизвестных простых тел'}
      en: {who: 'Dmitri Mendeleev', quote: 'We should expect many more as yet unknown elementary substances to be discovered.', occasion: 'conclusions of On the Relation of the Properties to the Atomic Weights of the Elements (game translation)'}
      zh: {who: '门捷列夫', quote: '还会有许多未知的单质等待发现。', occasion: '《元素性质与原子量的关系》的结论（游戏译文）'}
hook: {en: 'The evening he was not there', zh: '他不在场的那一晚'}
