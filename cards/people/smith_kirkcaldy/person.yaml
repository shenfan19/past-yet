    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 12, req: {"any":[{"job":["bookseller","translator","archivist"],"stat":{"will":7}},{"trait":["charismatic","bold"],"stat":{"wit":6,"will":7}},{"item":"golden_apple","stat":{"wit":5}}]}}
