    sources: [smith_kirkcaldy_strahan_autograph, smith_kirkcaldy_glasgow_letters]
    text:
      en: 'On 13 November 1776 Smith sent Strahan from Kirkcaldy his addition to Hume''s account of his own life, noted that he had received 300 pounds of copy money for the Wealth of Nations, asked for an account of what was still due, and proposed a second edition in four octavo volumes.'
      zh: '1776 年 11 月 13 日，斯密从柯卡尔迪把给休谟小传的补记寄给斯特拉恩，说《国富论》的稿酬已收到三百镑，请对方算一算还欠多少，又提议出四卷八开本的第二版。'
    line:
      en: '13 November 1776: Smith posts the account to Strahan, with a note on his 300 pounds of copy money and a plan for a cheaper second edition.'
      zh: '1776 年 11 月 13 日，斯密把补记寄给斯特拉恩，信里提到已收到三百镑稿酬，还想出一版便宜些的八开本。'
      zh-Hant: '1776 年 11 月 13 日，斯密把補記寄給斯特拉恩，信裡提到已收到三百鎊稿酬，還想出一版便宜些的八開本。'
      fr: "13 novembre 1776\_:\_Smith publie le compte à Strahan, avec une note sur ses 300 livres d'argent pour la copie et un plan pour une deuxième édition moins chère."
      es: '13 de noviembre de 1776: Smith envía la cuenta a Strahan, con una nota sobre las 300 libras de dinero de las copias y un plan para una segunda edición más barata.'
      ja: '1776 年 11 月 13 日: スミスは、コピー代 300 ポンドと安価な第 2 版の計画に関するメモを添えて、ストラハンにアカウントを投稿します。'
      ko: '1776년 11월 13일: Smith는 300파운드의 복사 비용에 대한 메모와 더 저렴한 2판에 대한 계획과 함께 계정을 Strahan에 게시합니다.'
      ru: '13 ноября 1776 г.: Смит отправляет отчет Стрэхану с примечанием о своих 300 фунтах денег на копию и планом по более дешевому второму изданию.'
  own_life:
    date: '1777'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [smith_dnb_hume, smith_letter_econlib]
    text:
      en: 'In 1777 Hume''s short autobiography was published with Smith''s letter on his last illness; the calm the letter described gave offence to many readers.'
      zh: '1777 年，休谟的自传连同斯密记述他最后病况的信一起出版，信里写他从容赴死，惹恼了不少读者。'
    line:
      en: '1777: Hume''s short life of himself is printed with Smith''s letter, and the letter draws angry replies.'
      zh: '1777 年，休谟的小传连同斯密那封信一起印出，信招来了不少骂声。'
      zh-Hant: '1777 年，休謨的小傳連同斯密那封信一起印出，信招來了不少罵聲。'
      fr: "1777\_: La courte vie de Hume est imprimée avec la lettre de Smith, et la lettre suscite des réponses fâchées."
      es: '1777: La breve vida de Hume sobre sí mismo se imprime con la carta de Smith, y la carta genera respuestas airadas.'
      ja: '1777年: ヒューム自身の短い生涯がスミスの手紙とともに印刷され、その手紙は怒りの返答を集めた。'
      ko: '1777년: 흄 자신의 짧은 생애가 스미스의 편지에 인쇄되었고, 그 편지는 화난 답장을 불러일으켰습니다.'
      ru: '1777: Короткая жизнь Юма напечатана вместе с письмом Смита, и это письмо вызывает гневные ответы.'
  dialogues:
    date: '1779'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [smith_hume_texts_dialogues, smith_dialogues_wiki]
    text:
      en: 'Strahan in the end declined, and the Dialogues Concerning Natural Religion were published in 1779 by Hume''s nephew David, with neither the author''s nor the publisher''s name.'
      zh: '斯特拉恩最终作罢，《自然宗教对话录》在 1779 年由休谟的侄子大卫出版，书上没有作者名，也没有出版者名。'
    line:
      en: '1779: the Dialogues come out through Hume''s nephew, with no name on the title page.'
      zh: '1779 年，《对话录》由休谟的侄子印出，扉页上没有署名。'
      zh-Hant: '1779 年，《對話錄》由休謨的侄子印出，扉頁上沒有署名。'
      fr: '1779 : les Dialogues paraissent par l''intermédiaire du neveu de Hume, sans nom sur la page de titre.'
      es: '1779: los Diálogos salen a través del sobrino de Hume, sin nombre en la portada.'
      ja: '1779年：ヒュームの甥を通じて『対話篇』が出版されるが、タイトルページには名前が記載されていない。'
      ko: '1779년: 제목 페이지에 이름이 없는 흄의 조카를 통해 대화가 나옵니다.'
      ru: '1779: «Диалоги» выходят через племянника Юма без имени на титульном листе.'
