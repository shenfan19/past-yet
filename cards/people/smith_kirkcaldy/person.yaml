    text:
      en:
        name: How a nation grows rich
        place: Kirkcaldy, Scotland
        figure: Adam Smith
        story: 'The opening chapter of Adam Smith''s Wealth of Nations (1776) uses pin-making to illustrate the division of labour.'
        relic: A pin from the pin factory
        relic_desc: The pin he used to show what dividing a job can do.
        points:
          p1: 'In Kirkcaldy, check the enclosure and address for Smith’s November letter to Strahan. Make sure London receives his terms on costs and proceeds for another edition'
          p2: 'Estimate changes to the text separately from the costs of a new format so the publisher can see what would affect the price'
          p3: 'Help Smith arrange a trial loan for Kirkcaldy readers who cannot afford a full set. Use its records when discussing the possible print run'
        points_fail:
          p1: 'The publisher receives the proposed format without the terms on costs. The inquiry stalls and the office recalls the employee.'
          p2: 'The smaller format is costed from the first edition’s pagination, so the bookseller cannot compare the proposals item by item.'
          p3: 'The new edition is considered only at the full set price. The publisher has no record of demand from readers with less to spend.'
        shift:
          p1:
            was: 'On November 13, 1776, Smith wrote from Kirkcaldy to Strahan about the next edition’s format, costs and profits.'
          p2:
            was: 'The first edition and the 1778 second edition both appeared in two quarto volumes. This proposal for four octavo volumes was not adopted.'
            now: 'The bookseller receives page and binding estimates for both formats. For changes still undecided, the estimate keeps a separate line.'
          p3:
            was: 'Smith proposed four octavo volumes with the publisher paying costs and sharing profits. The next edition kept the larger format.'
            now: 'Subscribers share a set at a lower cost and record which parts get read. The bookseller has a record of borrowing when considering a future smaller edition.'
            who: smith_kirkcaldy
            bio: 'Smith returned to Kirkcaldy after the first edition appeared. His talks with publishers addressed size, who paid to print it, and how to divide proceeds.'
        vignettes:
          queue: 'The worker adds more counters at the fastest station. You ask them to count how many are still waiting at the slower one. They change their plan before the second demonstration.'
          handoff: 'Two people both reach for the same tray; no one takes the one behind it. You set the finished pieces where the next worker can reach them and hear the clatter stop.'
          walk: 'You watch each person describe their one small job. To trace the whole route, you have to walk from one end of the bench to the other.'
      zh:
        name: 一个国家怎样变富
        place: 苏格兰柯卡尔迪
        figure: 亚当·斯密
        story: '亚当·斯密 1776 年出版的《国富论》开篇用制针来说明分工。'
        relic: 一枚别针
        relic_desc: 他用来说明分工威力的那种别针。
        points:
          p1: '在柯科迪把斯密 11 月给斯特拉恩的再版建议和来信地址配齐，让伦敦书商收到可议的印费及分成办法'
          p2: '同斯密把可改的正文与纯属开本更换的页数分开估，使出版商知道哪些建议影响定价'
          p3: '请斯密在柯科迪为想购书但嫌整套太贵的读者议一个先试行的借阅安排，带着书会的记账结果再谈印量'
        points_fail:
          p1: '书商收到谈版式的纸，约定印费的那页却没有送到。再版问询断在这一环，事务所召回员工。'
          p2: '开本缩小后的页数仍按首版估，书商无法逐项比较两套方案。'
          p3: '再版仍只按整套售价议，出版商手里没有小额读者的实际需求记录。'
        shift:
          p1:
            was: '1776 年 11 月 13 日，斯密从柯科迪给斯特拉恩写信，谈《国富论》再版开本、印费和分成。'
          p2:
            was: '首版和 1778 年再版均为两卷四开；四卷八开的这次提议未实行。'
            now: '书商拿到两种开本的页数和预计装订数。对于尚不决定的改页，另留一行检查成本。'
          p3:
            was: '斯密在信中希望改用四册八开，并提出由出版商承担印费后分利润。后来再版沿用大开本。'
            now: '几家订户以较低费用共用一套书并登记最常读的章节。书商收到真实的借阅数据，可以继续商量未来小开本的销路。'
            who: smith_kirkcaldy
            bio: '斯密在《国富论》首次出版后回到柯科迪。他同出版商商量的除了文字，还有谁付印费、用何种开本和收益如何分配。'
        vignettes:
          queue: '工人给最快的那道工序多放了几枚算子。你请他数一数慢的那道前还积了多少，第二遍他就换了排法。'
          handoff: '两个人同时去够同一只盘，后头那只却没人拿。你把做完的件移到下一人随手能取的地方，碰撞声这才停下。'
          walk: '你听每个人讲自己负责的一小段。要弄清一根针经过哪些手，你得从桌子一头走到另一头。'
text:
  en:
    name: Adam Smith
    text: Scottish philosopher and economist, 1723 to 1790, born in Kirkcaldy. His The Wealth of Nations, published in 1776, argued that the division of labour and free exchange raise a country's wealth. He also wrote The Theory of Moral Sentiments.
  zh:
    name: 亚当·斯密
    text: 苏格兰哲学家与经济学家，1723 年生，1790 年去世，生于柯卡尔迪。1776 年出版的《国富论》论证了分工和自由交换会增加国家的财富。他还写了《道德情操论》。
