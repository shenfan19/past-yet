    text:
      en:
        name: How a nation grows rich
        place: Kirkcaldy, Scotland
        figure: Adam Smith
        story: 'The opening chapter of Adam Smith''s Wealth of Nations (1776) uses pin-making to illustrate the division of labour.'
        relic: A pin from the pin factory
        relic_desc: The pin he used to show what dividing a job can do.
        points:
          p1: 'While the Dialogues Hume left in trust lie unprinted, talk Smith and Strahan into publishing them as Hume asked'
        points_fail:
          p1: 'As in history the book waits three years and comes out in 1779 from his nephew without a name on it; in this branch Hume''s wish to have it out within two years is not kept either.'
        shift:
          p1:
            was: '7 August 1776: in a codicil Hume asked Strahan to publish the Dialogues Concerning Natural Religion within two years of his death; Smith would not take it on, Strahan in the end declined, and the book came out in 1779 through Hume''s nephew, without the author''s name.'
            now: 'Strahan printed the Dialogues within the two years Hume had asked for.'
        vignettes:
          queue: 'The worker adds more counters at the fastest station. You ask them to count how many are still waiting at the slower one. They change their plan before the second demonstration.'
          handoff: 'Two people both reach for the same tray; no one takes the one behind it. You set the finished pieces where the next worker can reach them and hear the clatter stop.'
          walk: 'You watch each person describe their one small job. To trace the whole route, you have to walk from one end of the bench to the other.'
      zh:
        name: 一个国家怎样变富
        place: 苏格兰柯卡尔迪
        figure: 亚当·斯密
        story: '亚当·斯密 1776 年出版的《国富论》开篇用制针来说明分工。'
        relic: 一枚别针
        relic_desc: 他用来说明分工威力的那种别针。
        points:
          p1: '休谟托付的《自然宗教对话录》搁着没人肯印时，劝斯密和斯特拉恩照休谟的遗愿把它印出来'
        points_fail:
          p1: '书照史实又搁了三年，1779 年才由休谟的侄子不署名印出，这条分支里休谟要它在身后两年内出版的遗愿也没有照办。'
        shift:
          p1:
            was: '1776 年 8 月 7 日，休谟在遗嘱附件里请斯特拉恩在他身后两年内出版《自然宗教对话录》；斯密不肯经手，斯特拉恩最终也作罢，书在 1779 年由休谟的侄子不署名出版。'
            now: '斯特拉恩在休谟要求的两年之内把《对话录》印了出来。'
        vignettes:
          queue: '工人给最快的那道工序多放了几枚算子。你请他数一数慢的那道前还积了多少，第二遍他就换了排法。'
          handoff: '两个人同时去够同一只盘，后头那只却没人拿。你把做完的件移到下一人随手能取的地方，碰撞声这才停下。'
          walk: '你听每个人讲自己负责的一小段。要弄清一根针经过哪些手，你得从桌子一头走到另一头。'
text:
  en:
    name: Adam Smith
    text: Scottish philosopher and economist, 1723 to 1790, born in Kirkcaldy. His The Wealth of Nations, published in 1776, argued that the division of labour and free exchange raise a country's wealth. He also wrote The Theory of Moral Sentiments.
  zh:
    name: 亚当·斯密
    text: 苏格兰哲学家与经济学家，1723 年生，1790 年去世，生于柯卡尔迪。1776 年出版的《国富论》论证了分工和自由交换会增加国家的财富。他还写了《道德情操论》。
