  codicil:
    date: '1776-08-07'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [smith_hume_texts_dialogues, smith_dnb_hume]
    text:
      en: 'In a codicil of 7 August 1776 Hume left his manuscripts to his printer William Strahan, asking that the Dialogues be published within two years of his death; if they were not out within two and a half years, they were to pass to his nephew David.'
      zh: '1776 年 8 月 7 日，休谟在遗嘱附件里把手稿留给印书商威廉·斯特拉恩，请他在身后两年内出版《对话录》；两年半内不出，就归他的侄子大卫。'
    line:
      en: '7 August 1776: in a codicil Hume leaves the Dialogues to the printer William Strahan, to be published within two years of his death.'
      zh: '1776 年 8 月 7 日，休谟在遗嘱附件里把《对话录》托给印书商威廉·斯特拉恩，要他在身后两年内印出。'
      zh-Hant: '1776 年 8 月 7 日，休謨在遺囑附件裡把《對話錄》托給印書商威廉·斯特拉恩，要他在身後兩年內印出。'
      fr: '7 août 1776 : dans un codicille, Hume laisse les Dialogues à l''imprimeur William Strahan, pour qu''ils soient publiés dans les deux ans suivant sa mort.'
      es: '7 de agosto de 1776: en un codicilo, Hume deja los Diálogos al impresor William Strahan, para que los publique dos años después de su muerte.'
      ja: '1776年8月7日: ヒュームは公文書の中で、死後2年以内に出版されるよう印刷者ウィリアム・ストラハンに対話篇を残した。'
      ko: '1776년 8월 7일: 코디실에서 흄은 자신의 사망 후 2년 이내에 출판되도록 대화록을 인쇄업자 윌리엄 스트라한(William Strahan)에게 맡깁니다.'
      ru: '7 августа 1776 г.: в дополнении Хьюм передает «Диалоги» типографу Уильяму Страхану, который должен быть опубликован в течение двух лет после его смерти.'
