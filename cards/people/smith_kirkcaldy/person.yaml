quotes:
  smith_hume_account:
    order: 1
    tier: full
    date: '1776-09-05'
    checked: official_record
    sources: [smith_kirkcaldy_glasgow_letters]
    original: en
    text:
      en:
        who: 'Adam Smith'
        quote: 'I propose to add to his life a very well authenticated account of his behaviour during his last Illness.'
        occasion: 'letter to William Strahan from Dalkeith House, Glasgow Edition, letter 172 (NYPL manuscript)'
      zh:
        who: '亚当·斯密'
        quote: '我打算在他的自传之后附上一篇有充分实证的记述，写他最后一次患病时的举止。'
        occasion: '在达尔基斯府致威廉·斯特拉恩的信，格拉斯哥版第 172 封（纽约公共图书馆手稿）'
      zh-Hant:
        who: '亞當·斯密'
        quote: '我打算在他的自傳之後附上一篇有充分實證的記述，寫他最後一次患病時的舉止。'
        occasion: '在達爾基斯府致威廉·斯特拉恩的信，格拉斯哥版第 172 封（紐約公共圖書館手稿）'
      fr:
        who: 'Adam Smith'
        quote: 'Je propose d''ajouter à sa vie un récit très authentifié de son comportement lors de sa dernière Maladie.'
        occasion: 'lettre à William Strahan de Dalkeith House, Glasgow Edition, lettre 172 (manuscrit NYPL)'
      es:
        who: 'Adam Smith'
        quote: 'Propongo añadir a su vida un relato muy bien autenticado de su comportamiento durante su última Enfermedad.'
        occasion: 'carta a William Strahan desde Dalkeith House, edición de Glasgow, carta 172 (manuscrito de NYPL)'
      ja:
        who: 'アダム・スミス'
        quote: '私は、彼の人生に、彼の最後の病気の間の行動に関する非常によく証明された説明を加えることを提案します。'
        occasion: 'ダルキース・ハウスからウィリアム・ストラハンへの手紙、グラスゴー版、手紙172（NYPL原稿）'
      ko:
        who: '애덤 스미스'
        quote: '나는 그의 마지막 질병 동안 그의 행동에 대해 매우 확실하게 입증된 설명을 그의 삶에 추가할 것을 제안합니다.'
        occasion: 'Dalkeith House에서 William Strahan에게 보낸 편지, Glasgow Edition, 편지 172(NYPL 원고)'
      ru:
        who: 'Адам Смит'
        quote: 'Я предлагаю добавить к его жизни очень достоверный отчет о его поведении во время последней болезни.'
        occasion: 'письмо Уильяму Страхану из Dalkeith House, Glasgow Edition, письмо 172 (рукопись NYPL)'
  smith_hume_gentleness:
    order: 2
    tier: none
    date: '1776-11-09'
    checked: two_sources
    sources: [smith_letter_1777_facsimile, smith_letter_econlib]
    original: en
    text:
      en:
        who: 'Adam Smith'
        quote: 'The extreme gentleness of his nature never weakened either the firmness of his mind, or the steadiness of his resolutions.'
        occasion: 'letter to William Strahan from Kirkcaldy, remembering David Hume'
      zh:
        who: '亚当·斯密'
        quote: '他的性情极其温和，却从不因此动摇心志，也不更改自己的决定。'
        occasion: '在柯卡尔迪致威廉·斯特拉恩的信，追忆大卫·休谟'
      zh-Hant:
        who: '亞當·斯密'
        quote: '他的性情極其溫和，卻從不因此動搖心志，也不更改自己的決定。'
        occasion: '在柯卡爾迪致威廉·斯特拉恩的信，追憶大衛·休謨'
      fr:
        who: 'Adam Smith'
        quote: 'L''extrême douceur de son caractère n''a jamais affaibli ni la fermeté de son esprit, ni la fermeté de ses résolutions.'
        occasion: 'lettre à William Strahan de Kirkcaldy, en souvenir de David Hume'
      es:
        who: 'Adam Smith'
        quote: 'La extrema gentileza de su naturaleza nunca debilitó ni la firmeza de su mente ni la firmeza de sus resoluciones.'
        occasion: 'carta a William Strahan desde Kirkcaldy, recordando a David Hume'
      ja:
        who: 'アダム・スミス'
        quote: '彼の極度の優しさは、彼の心の堅固さや決意の堅さを決して弱めることはなかった。'
        occasion: 'デイビッド・ヒュームを偲んでカーカルディからウィリアム・ストラハンに宛てた手紙'
      ko:
        who: '애덤 스미스'
        quote: '그의 성격의 극도의 온화함은 그의 마음의 확고함이나 그의 결심의 확고함을 결코 약화시키지 않았습니다.'
        occasion: 'David Hume을 기억하며 Kirkcaldy에서 William Strahan에게 보낸 편지'
      ru:
        who: 'Адам Смит'
        quote: 'Чрезвычайная мягкость его натуры никогда не ослабляла ни твердости его ума, ни твердости его решений.'
        occasion: 'письмо Уильяму Страхану от Киркалди, вспоминая Дэвида Хьюма'
