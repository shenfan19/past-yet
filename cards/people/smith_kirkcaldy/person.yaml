    text:
      en:
        name: A book left in trust
        place: Kirkcaldy, Scotland
        figure: Adam Smith
        story: 'In March 1776 Adam Smith''s Wealth of Nations came out in London. On 25 August his friend David Hume died in Edinburgh. Hume had first named Smith to see his Dialogues Concerning Natural Religion into print; Smith made difficulties, and Hume left the work to the printer William Strahan instead, asking for it to appear within two years. That November, back in Kirkcaldy, Smith wrote Strahan an account of Hume''s last months. Strahan in the end declined, and the Dialogues came out in 1779 through Hume''s nephew.'
        story_prose:
          opening:
            - 'Kirkcaldy, Scotland, late autumn 1776. Adam Smith is back in the town where he was born. In March his Wealth of Nations came out in London, its first chapter beginning with the making of pins. In August his friend David Hume died in Edinburgh.'
            - 'In history, Hume named Smith in his will in January to look after his papers, and first meant him to see the Dialogues Concerning Natural Religion into print; Smith was unwilling. A codicil of 7 August left the work to the printer William Strahan instead, asking for it to appear within two years of Hume’s death. In November Smith wrote Strahan an account of Hume’s last months from Kirkcaldy, and the Dialogues stayed where they were until Hume’s nephew brought them out without a name in 1779. In this branch, a nailer pays at the baker’s with a handful of nails, and a woman gathers mussels on the sands at low tide.'
            - 'A few kinds of people can help on this trip: someone who knows books and the printing trade, or knows papers and can set out a last wish plainly; someone whose word carries weight and who can talk a person round.'
          outcomes:
            p1: 'Less than two years after Hume’s death, Strahan’s shop had the Dialogues Concerning Natural Religion set in type. The first sheets hung on the line, the ink not yet dry.'
          none: 'That winter the manuscript was still lying with Strahan. On the sands at Kirkcaldy the woman gathering mussels walked home with her basket, and across the water the smoke of Edinburgh hung low.'
          not_admitted: '{staff} never got through the door of that house, and spent a few days carrying baskets for the woman who gathered mussels on the sands. Across the water, the smoke of Edinburgh hung low the whole time.'
          points:
            p1:
              class_lettered: 'On 9 November Smith sat at his desk in Kirkcaldy writing to Strahan, setting down Hume’s last months. {staff}, as a clerk copies a deed, wrote out the line from the codicil of 7 August word for word, published within two years of his death, and below it how many sheets and how many months a small octavo would take, and laid the paper beside his letter. Smith looked at the paper a long time, folded it, and put it in with the letter to Strahan. When it was sealed it was thicker than the other letters on the desk.'
              else: 'On 9 November Smith sat at his desk in Kirkcaldy writing to Strahan, setting down Hume’s last months. {staff} sat by his desk all afternoon, wrote the line from the codicil of 7 August on a sheet of paper, within two years, for Strahan to print, and pushed it across to him. Smith looked at the paper a long time, folded it, and put it in with the letter to Strahan. When it was sealed it was thicker than the other letters on the desk.'
          excerpts:
            p1: 'Smith looked at the paper a long time, folded it, and put it in with the letter to Strahan. When it was sealed it was thicker than the other letters on the desk.'
        relic: A pin from the pin factory
        relic_desc: The kind of pin he used to show what dividing a job can do.
        points:
          p1: 'While the Dialogues Hume left in trust lie unprinted, talk Smith and Strahan into publishing them as Hume asked'
        points_fail:
          p1: 'As in history the book waits three years and comes out in 1779 from his nephew without a name on it; in this branch Hume''s wish to have it out within two years is not kept either.'
        shift:
          p1:
            was: '7 August 1776: in a codicil Hume asked Strahan to publish the Dialogues Concerning Natural Religion within two years of his death; Smith would not take it on, Strahan in the end declined, and the book came out in 1779 through Hume''s nephew, without the author''s name.'
            now: 'Strahan printed the Dialogues within the two years Hume had asked for.'
            who: david_hume
            bio: 'Within two years of his death the Dialogues he had kept back for a quarter of a century were printed by Strahan, as he had asked in his last codicil.'
        vignettes:
          nails: '{staff} queues at the baker''s. The nailer ahead pays with a handful of nails, the baker counts them and takes them. Weeks later {staff} reads in a thick book out this spring that there is a village in Scotland where workmen still carry nails to the baker''s instead of money, and laughs at the page.'
          post: '{staff} helps the carrier tie up the London post. One packet is for Mr Strahan, the printer, and is thicker than the rest; {staff} slips it under the others so the rain will not reach it.'
          firth: '{staff} walks the sands at low tide. Across the Firth of Forth the smoke of Edinburgh hangs low, and the woman gathering mussels nearby says that is where the clever folk live.'
      zh:
        name: 托付在身后的书
        place: 苏格兰柯卡尔迪
        figure: 亚当·斯密
        story: '1776 年 3 月，亚当·斯密的《国富论》在伦敦出版。8 月 25 日，他的朋友大卫·休谟在爱丁堡去世。休谟起先托斯密把《自然宗教对话录》印出来，斯密有顾虑，休谟改托印书商威廉·斯特拉恩，要他在身后两年内出版。这年 11 月，斯密在柯卡尔迪给斯特拉恩写信，记下休谟最后几个月的样子。斯特拉恩最终作罢，《对话录》到 1779 年才由休谟的侄子印出。'
        story_prose:
          opening:
            - '1776 年深秋，苏格兰柯卡尔迪。亚当·斯密回到了他出生的这座小城。这年 3 月，他的《国富论》在伦敦出版，第一章从做别针讲起。8 月，他的朋友大卫·休谟在爱丁堡去世。'
            - '史实里，休谟年初立遗嘱，把遗稿托给斯密，起先要他把《自然宗教对话录》印出来，斯密不愿经手；8 月 7 日的遗嘱附件改托印书商威廉·斯特拉恩，请他在身后两年内出版。11 月，斯密在柯卡尔迪给斯特拉恩写信，记下休谟最后几个月，《对话录》却一直搁着，到 1779 年才由休谟的侄子不署名印出。在这条分支里，面包铺里有个拿铁钉付账的打钉工人，退潮的沙滩上有个拾贻贝的妇人。'
            - '这一趟用得上几种人：懂书、懂印书生意的人，或者懂文书、把一份遗愿写得清清楚楚的人；说话有分量、劝得动人的人。'
          outcomes:
            p1: '休谟去世后不到两年，斯特拉恩的印坊排好了《自然宗教对话录》。头一批印张晾在绳子上，墨还没干。'
          none: '那年冬天，那部手稿还搁在斯特拉恩那里。柯卡尔迪的沙滩上，拾贻贝的妇人提着篮子往回走，对岸爱丁堡的炊烟压得很低。'
          not_admitted: '{staff}没能进那户人家的门，只在退潮的沙滩上帮拾贻贝的妇人提了几天篮子。对岸爱丁堡的炊烟，一直压得很低。'
          points:
            p1:
              class_lettered: '11 月 9 日，斯密坐在柯卡尔迪家中的桌前，给斯特拉恩写信，记休谟最后几个月。{staff}照誊录文书的规矩，把 8 月 7 日遗嘱附件里“身后两年内出版”那一句原样抄在一张纸上，下面列出印一本八开小书要几个印张、几个月，放在他的信纸旁边。斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。'
              else: '11 月 9 日，斯密坐在柯卡尔迪家中的桌前，给斯特拉恩写信，记休谟最后几个月。{staff}在他桌边坐了一个下午，把 8 月 7 日遗嘱附件里那句话写在一张纸上：两年之内，交斯特拉恩印。写完，把纸推到他面前。斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。'
          excerpts:
            p1: '斯密把那张纸看了很久，折好，夹进了给斯特拉恩的信里。信封好以后，比桌上别的几封都厚。'
        relic: 一枚别针
        relic_desc: 他用来说明分工威力的那种别针。
        points:
          p1: '休谟托付的《自然宗教对话录》搁着没人肯印时，劝斯密和斯特拉恩照休谟的遗愿把它印出来'
        points_fail:
          p1: '书照史实又搁了三年，1779 年才由休谟的侄子不署名印出，这条分支里休谟要它在身后两年内出版的遗愿也没有照办。'
        shift:
          p1:
            was: '1776 年 8 月 7 日，休谟在遗嘱附件里请斯特拉恩在他身后两年内出版《自然宗教对话录》；斯密不肯经手，斯特拉恩最终也作罢，书在 1779 年由休谟的侄子不署名出版。'
            now: '斯特拉恩在休谟要求的两年之内把《对话录》印了出来。'
            who: david_hume
            bio: '他压了二十多年的《对话录》，在他去世后两年之内由斯特拉恩印了出来，照的是他最后那份遗嘱附件。'
        vignettes:
          nails: '{staff}在面包铺排队，前面一个打钉的工人掏出一把铁钉付账，钉子在柜台上滚了几滚，铺主数了数就收下了。过了几个礼拜，{staff}在一本今年春天出的厚书里读到，苏格兰有个村子的工人至今拿钉子去面包铺当钱用，对着那一页笑出了声。'
          post: '{staff}帮驿车夫捆寄往伦敦的邮包，马在门口喷着白气。有一封写着印书商斯特拉恩先生收，比别的都厚，{staff}把它塞到最底下，免得淋了雨。'
          firth: '{staff}趁退潮在沙滩上走，脚底下的沙又湿又硬。福斯湾对岸，爱丁堡的炊烟压得很低，旁边拾贻贝的妇人说，那边住的都是读书的聪明人。'
text:
  en:
    name: Adam Smith
    text: Scottish philosopher and economist, 1723 to 1790, born in Kirkcaldy. His The Wealth of Nations, published in 1776, argued that the division of labour and free exchange raise a country's wealth. He also wrote The Theory of Moral Sentiments. He was a close friend of David Hume, and after Hume's death in 1776 wrote the account of his last months that was printed with Hume's own short life.
  zh:
    name: 亚当·斯密
    text: 苏格兰哲学家与经济学家，1723 年生，1790 年去世，生于柯卡尔迪。1776 年出版的《国富论》论证了分工和自由交换会增加国家的财富。他还写了《道德情操论》。他与大卫·休谟是挚友，1776 年休谟去世后，他写下休谟最后几个月的经过，与休谟的自传一同印出。
hook: {en: 'A friend''s last wish, and a book nobody would print', zh: '朋友的遗愿，和一本没人肯印的书'}
