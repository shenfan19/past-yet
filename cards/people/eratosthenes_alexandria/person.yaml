    text:
      en:
        name: 'The book that measured the Earth'
        place: Alexandria
        figure: Eratosthenes
        story: 'Eratosthenes of Cyrene came to Alexandria about 245 BC as tutor to the son of Ptolemy III, and about 240 BC became librarian there. Comparing the noon shadows at midsummer in Syene and in Alexandria, he worked out the circumference of the Earth as 250,000 stadia. His book On the Measurement of the Earth was later lost, and the method is known mainly from the shorter account of Cleomedes.'
        relic: A gnomon rod
        relic_desc: A plain upright rod whose shadow told him the angle of the sun.
        points:
          p1: 'Help him have On the Measurement of the Earth copied for the Library and beyond, so his own account of the method is not lost'
        points_fail:
          p1: 'The book stayed in the copies it already had. In this branch it was lost all the same, and later readers knew his method only from the simplified retelling of Cleomedes.'
        shift:
          p1:
            was: 'In the third century BC Eratosthenes set out his measurement in On the Measurement of the Earth; the book was later lost, and the method survives mainly in the simplified account of Cleomedes, who says the original was more involved.'
            now: '{staff} helped him have the book copied several times. In this timeline his own account came down to later readers alongside the retelling.'
            who: eratosthenes_alexandria
            bio: 'In this line the book in which Eratosthenes measured the Earth was not lost, and later readers could check his method in his own words.'
        vignettes:
          noon: 'At noon on midsummer day {staff} crouches by an upright rod and scratches the tip of its shadow into the ground with a fingernail. A little later the shadow has moved a finger''s width away.'
          beta: '{staff} hears the copyists of the Library call the librarian Beta behind his back, second in everything. {staff} knows that what later centuries will remember of him is the whole round of the Earth he measured, and keeps a straight face.'
          shelves: '{staff} helps a porter of the Library carry the rolls up to the shelves in bundles, each tied with a little wooden tag. The porter says that even a man who cannot read can tell the marks on the tags apart.'
      zh:
        name: '量地球的那部书'
        place: 亚历山大
        figure: 埃拉托色尼
        story: '昔兰尼人埃拉托色尼约公元前 245 年应托勒密三世之请来到亚历山大，给王子当老师，约公元前 240 年做了亚历山大图书馆的馆长。他对照夏至正午塞伊尼和亚历山大两地的日影，算出地球周长 250000 斯塔迪亚。他写这件事的《论地球的测量》后来失传，方法主要靠克莱奥梅德斯简化过的转述留下。'
        relic: 一根日晷针
        relic_desc: 一根朴素的立杆，影子告诉他太阳的角度。
        points:
          p1: '帮他把《论地球的测量》多抄几部，存进图书馆也送出城去，不让他亲笔写下的方法失传'
        points_fail:
          p1: '这部书照旧只有原来那几部抄本，这条分支里它还是失传了，后人只能从克莱奥梅德斯简化过的转述里认识他的方法。'
        shift:
          p1:
            was: '公元前三世纪，埃拉托色尼把测地的方法写进《论地球的测量》；原书后来失传，方法主要靠克莱奥梅德斯简化过的转述留下，克莱奥梅德斯自己也说原法更繁。'
            now: '{staff}帮他把这部书多抄了几部，这条时间线里他亲笔写的方法和后来的转述一起传了下来。'
            who: eratosthenes_alexandria
            bio: 'IF 线里，埃拉托色尼测量地球的那部书没有失传，后人能照他自己的话核对他的方法。'
        vignettes:
          noon: '夏至正午，{staff}蹲在一根立杆旁，用指甲在地上划下影子的尖。过一会儿再看，影子已经挪开了一指宽。'
          beta: '{staff}听图书馆的抄书人背地里管馆长叫"贝塔"，说他样样都只排第二。{staff}知道后世记住他的，偏偏是他量出来的那一整圈地球，憋着没笑出声。'
          shelves: '{staff}帮图书馆的杂役把卷子一捆捆扛上架，每捆系一块小木牌。杂役说，不识字的人也认得牌上的记号。'
text:
  en:
    name: Eratosthenes
    text: Greek scholar, about 276 BC to about 194 BC, librarian at Alexandria. A later account credits him with estimating the Earth’s circumference from a comparison at Syene and Alexandria. Converting the answer to modern units depends on the length assigned to the stade.
  zh:
    name: 埃拉托色尼
    text: 希腊学者，约公元前 276 年生，约公元前 194 年去世，曾任亚历山大图书馆馆长。据后出的记述，他对照塞伊尼与亚历山大城的日照来估算地球周长。换算成现代单位要看取哪一种斯塔迪亚长度。
hook: {en: 'The whole round of the Earth, in a book that was lost', zh: '一整圈地球，写在一部丢了的书里'}
facts:
  tutor:
    date: '-245'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [eratosthenes_alexandria_mactutor, eratosthenes_alexandria_britannica]
    text:
      en: 'About 245 BC Ptolemy III brought Eratosthenes, born at Cyrene, to Alexandria as tutor to his son.'
      zh: '约公元前 245 年，托勒密三世请生于昔兰尼的埃拉托色尼到亚历山大，给王子当老师。'
    line:
      en: 'About 245 BC: Ptolemy III brings Eratosthenes to Alexandria to teach his son.'
      zh: '约前 245 年，托勒密三世请埃拉托色尼到亚历山大，给王子当老师。'
  librarian:
    date: '-240'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [eratosthenes_alexandria_mactutor, eratosthenes_alexandria_britannica]
    text:
      en: 'About 240 BC, after Callimachus, he became librarian of the Library of Alexandria.'
      zh: '约公元前 240 年，卡利马科斯之后，他做了亚历山大图书馆的馆长。'
    line:
      en: 'About 240 BC: Eratosthenes becomes librarian of the Library of Alexandria.'
      zh: '约前 240 年，埃拉托色尼做了亚历山大图书馆的馆长。'
  beta:
    date: '-240'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [eratosthenes_alexandria_mactutor, eratosthenes_alexandria_britannica]
    text:
      en: 'He was nicknamed Beta, because in each field he was thought to fall just short of the first place.'
      zh: '他有个外号叫"贝塔"，意思是他在每一门学问里都差一点才到第一。'
  midsummer:
    date: '-240'
    stay_day: 25
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [eratosthenes_alexandria_cleomedes, eratosthenes_alexandria_osu]
    text:
      en: 'In the account of Cleomedes, at noon on midsummer day the upright pointers at Syene cast no shadow, while at Alexandria the shadow marks one fiftieth of a circle. The year of the measurement is not recorded.'
      zh: '据克莱奥梅德斯记述，夏至正午，塞伊尼的日晷针不投影子，亚历山大的影子量得全圆的五十分之一。测量在哪一年做的，没有记载。'
    line:
      en: 'Noon, midsummer day: at Syene the pointers of the sundials cast no shadow; at Alexandria the shadow marks one fiftieth of a circle.'
      zh: '夏至正午，塞伊尼的日晷针下没有影子；亚历山大的影子，量得全圆的五十分之一。'
  cleomedes:
    date: '-240'
    checked: two_sources
    level: usable
    use: [story, wiki]
    sources: [eratosthenes_alexandria_cleomedes, eratosthenes_alexandria_mactutor]
    text:
      en: 'Cleomedes relates a comparison using one fiftieth of a circle and 5,000 stadia between the two cities, giving 250,000 stadia for the whole circumference. The book of Eratosthenes, On the Measurement of the Earth, is lost.'
      zh: '克莱奥梅德斯转述，两城之间取 5000 斯塔迪亚，差角取全圆的五十分之一，推得全周 250000 斯塔迪亚。埃拉托色尼自己写的《论地球的测量》已经失传。'
  death:
    date: '-194'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [eratosthenes_alexandria_mactutor, eratosthenes_alexandria_britannica]
    text:
      en: 'Blind in old age, he died at Alexandria about 194 BC.'
      zh: '他晚年失明，约公元前 194 年在亚历山大去世。'
    note: 'Blindness and death: written as plain facts.'
    line:
      en: 'About 194 BC: Eratosthenes, blind in his old age, dies in Alexandria.'
      zh: '约前 194 年，晚年失明的埃拉托色尼在亚历山大去世。'
