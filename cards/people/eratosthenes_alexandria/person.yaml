    text:
      en:
        name: Measuring the Earth with shadows
        place: Alexandria and Syene
        figure: Eratosthenes
        story: By comparing noon shadows in two cities Eratosthenes estimates the size of the Earth, and gets surprisingly close.
        relic: A gnomon rod
        relic_desc: A plain upright rod whose shadow told him the angle of the sun.
        points:
          p1: "Check the shadow in the well at Syene"
          p2: "Pace the distance under the blazing sun"
          p3: "Finish the measurement"
      zh:
        name: 用影子量地球
        place: 亚历山大与赛伊尼
        figure: 埃拉托色尼
        story: 埃拉托色尼比较两座城市正午的影子，估出了地球的大小，结果出奇地接近。
        relic: 一根日晷针
        relic_desc: 一根朴素的立杆，影子告诉他太阳的角度。
        points:
          p1: "核对赛伊尼井里的影子"
          p2: "在烈日下量步距"
          p3: "把测量做完"
text:
  en:
    name: Eratosthenes
    text: Greek scholar, about 276 BC to about 194 BC, librarian at Alexandria. Comparing the sun's shadows at Syene and Alexandria he estimated the circumference of the Earth, with a result close to the modern value.
  zh:
    name: 埃拉托色尼
    text: 希腊学者，约公元前 276 年生，约公元前 194 年去世，亚历山大图书馆馆长。他比较塞伊尼与亚历山大的日影，估算出地球周长，结果与今天的数值相近。
