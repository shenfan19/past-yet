    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 28, req: {"any":[{"job":["archivist","translator","proofreader","bookseller","data_analyst"],"stat":{"wit":7}},{"trait":["scholarly","curious"],"stat":{"wit":8,"will":5}}]}}
      vignettes:
        - {id: noon, traits: [curious, handy, methodical, patient], day: 25.2}
