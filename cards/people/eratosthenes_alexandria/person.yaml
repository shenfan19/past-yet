      text:
        en: 'Eutocius, Commentary on Archimedes’ On the Sphere and Cylinder II.1, Letter to Ptolemy, Heiberg (1881), vol. 3, 106.8–11 (method, opening clause) and 106.26–27 (proof and construction). Greek reproduced in Max Leventhal (2017), pp. 60 and 62. The date approximates the early-sixth-century attestation. Leventhal accepts the attribution, while Wilamowitz considered most of the letter a later fabrication (pp. 43–44). https://www.repository.cam.ac.uk/bitstreams/cee19e6f-ac94-4007-bfb1-6924a8efea86/download'
