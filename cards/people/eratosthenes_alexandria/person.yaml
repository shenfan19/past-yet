      zh: {who: '传为埃拉托色尼所作', quote: '我在下文为你写明了证明，以及怎样制作上面说到的器械。', occasion: '致托勒密的倍立方书信，由欧托基乌斯转录（公元六世纪初，作者有争议）。本游戏译文。'}
