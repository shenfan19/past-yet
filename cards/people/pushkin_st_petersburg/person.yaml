      zh:
        name: '门牌号尚未出现的那户人家'
        place: "圣彼得堡"
        figure: "亚历山大·普希金"
        story: '1836 年到 1837 年，亚历山大·普希金住在莫伊卡河畔、科纽申内桥旁沃尔孔斯卡娅公爵夫人的房子里。旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，旧历 1 月 29 日，也就是新历 2 月 10 日在那里去世。他葬在米哈伊洛夫斯科耶庄园附近，在他母亲身旁。'
        story_prose:
          opening:
            - '新历 1837 年 1 月，圣彼得堡。亚历山大·普希金一家住在莫伊卡河畔、科纽申内桥边沃尔孔斯卡娅公爵夫人的房子里，门上还没有今天那个门牌号。他用诗体写了《叶甫盖尼·奥涅金》，常被看作现代俄国文学的奠基人。'
            - '史实里，这一冬他越欠越多；新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，两天后死于腹膜炎，三十七岁，留下妻子和四个孩子，欠下的债后来由沙皇替他还清。在这条分支里，有个来打听寓所的人都找他问路的门房，还有个常差人往桥那头跑腿的女仆。'
            - '这一趟用得上几种人：会管账、做过买卖，或条理清楚、心思敏捷，理得清一摞欠单的人；懂医护的人，或带着急救包、临事镇定守得住的人；带着抗生素的医生，或带着纳米医疗箱的医护。'
          outcomes:
            all: '二月过去，普希金还在莫伊卡河畔养伤，书桌上的欠单已经理成了一张单子。他又写了几年，《同时代人》仍在他手里办着。'
            p3: '二月过去，他还在莫伊卡河畔养伤，能扶着墙走到窗边。后来几年，《同时代人》仍在他手里办着。'
            p1: '那张单子一直压在墨水瓶底下。后来家里的开销，都照着它一笔一笔安排。'
            p2: '他活着回到了莫伊卡河畔的家，被抬进书房，躺在那张沙发上。门厅里，来打听消息的人一直站到了街上。'
          none: '新历 2 月 8 日傍晚，黑溪边的雪地上，他没能撑到城里。书桌上那摞欠单还压着，没有人动过。'
          desync: '新历 2 月 8 日傍晚，回城的路走到一半，车厢里没了动静。{staff}被召回时，马车停在雪地里，车门半开着，地上落着一只手套。'
          not_admitted: '{staff}没能进那户人家，只跟着门房从桥边沿莫伊卡河走了一趟，数清了指路时要说的几个转弯。门房说，最近来问路的人多了，都要找桥边那栋房子。'
          points:
            p1:
              class_lettered: '新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}做惯了案头的事，把欠单一张张摊开，按日子和数目抄成一张清单，哪笔先还，哪笔能缓，在旁边各画一道。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。'
              class_trade: '新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}做过买卖，认得铺子里的规矩，把欠单按债主分成几叠，哪家肯缓一缓，哪家等不得，一叠一叠写上字条，再合抄成一张单子。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。'
              else: '新历 1 月下旬，书房的桌上压着一摞欠单，印书的、房租的、铺子里赊的，一张叠着一张。{staff}心细，把欠单按到期的先后排好，抄成一张单子，一行一行对过数目。普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。'
            p2:
              class_medical: '新历 2 月 8 日傍晚，黑溪边的雪地上。丹特斯先开了枪，普希金腹部中弹，血流了很多，被人扶上马车往城里赶。{staff}懂急救，跪在车厢里按住伤口，用干净的布一层层压紧，隔一阵摸一次他的脉，一路没有松手。马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。'
              else: '新历 2 月 8 日傍晚，黑溪边的雪地上。丹特斯先开了枪，普希金腹部中弹，血流了很多，被人扶上马车往城里赶。{staff}打开带来的急救包，用纱布压住伤口，把自己的大衣也垫在他身下，车一颠就伸手把他托稳。马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。'
            p3:
              class_learned: '新历 2 月 9 日，他在书房的沙发上躺了一夜，伤口发起热来，疼得咬紧了牙。{staff}是医生，看出伤口里起了感染，清过伤口，把带来的药用上，换了干净的纱布，一个钟头看一回。2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。'
              else: '新历 2 月 9 日，他在书房的沙发上躺了一夜，伤口发起热来，疼得咬紧了牙。{staff}懂医护，打开带来的医疗箱，照着说明把药用上，守着他的体温，一个钟头量一回。2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。'
          excerpts:
            p3: '2 月 10 日下午，他的热退了，要了一杯水，自己端着喝了两口。窗外的莫伊卡河结着冰，桥上有人在走。'
            p2: '马车停在莫伊卡河畔的门口，门房提着灯跑了出来。普希金被抬进屋，放在书房的沙发上，大衣上的雪还没化。'
            p1: '普希金接过那张单子，看了一会儿，把它压在了墨水瓶底下。那一摞欠单被捆成一扎，放进了抽屉。'
        relic: "一本诗集"
        relic_desc: "一本小书，某首诗里夹着一片压干的叶子。"
        points:
          p1: '帮他把越欠越多的债理出头绪，让妻子和孩子的日子不再悬着'
          p2: '中弹以后，护住从黑溪回城那一路，让他活着回到莫伊卡河畔的寓所'
          p3: '治好他腹部的枪伤，压住伤口里的感染，让他活下来'
        points_fail:
          p1: '这条分支里，那个冬天的欠单照旧压在书桌上，没有人替他理过。'
          p2: '他没能撑到莫伊卡河畔，这条分支里没有寓所里的那两天。'
          p3: '2 月 10 日下午，他照史实在寓所里去世，这条分支里也没能多留他一天。'
        shift:
          p1:
            was: '1837 年 2 月普希金去世时欠下大笔债务，后来由尼古拉一世替他还清。'
            now: '欠账理成了一张单子，哪笔先还、哪笔能缓，家里心里有了数。'
          p2:
            was: '1837 年 2 月 8 日决斗中弹以后，普希金被送回莫伊卡河畔的寓所。'
          p3:
            was: '1837 年 2 月 10 日他在寓所里死于腹膜炎，三十七岁，留下妻子和四个孩子。'
            now: '{staff}带去的药压住了伤口的感染，二月过去时他还在莫伊卡河畔养伤。他又写了几年，《同时代人》仍在他手里办下去。'
        vignettes:
          number: '{staff}差点把一块博物馆门牌上的号码告诉来访的人，可那块牌子这时还没有，便划掉数字，在纸条上画了那座桥。来人捏着纸条，朝河边走去。'
          queue: '{staff}把同一句回答抄在几张纸条上，门厅里等着的人看了就不用再问。地板上踩满了带雪的脚印。'
          river: '{staff}跟着门房从桥边沿莫伊卡河走一遍，河面结着冰，数清指路时该说的几个转弯。'
text:
  en:
    name: Alexander Pushkin
    text: Russian poet, 1799 to 1837, often regarded as the founder of modern Russian literature. He wrote Eugene Onegin in verse. In 1837 he was wounded in a duel in St Petersburg and died two days later.
  zh:
    name: 亚历山大·普希金
    text: 俄国诗人，1799 年生，1837 年去世，常被视为现代俄国文学的奠基人。他用诗体写了《叶甫盖尼·奥涅金》。1837 年他在圣彼得堡决斗中受伤，两天后去世。
hook: {en: 'Would you still call this Moika 12?', zh: '这时还不能写莫伊卡十二号'}
facts:
  address:
    date: '1836-10'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [pushkin_st_petersburg_address]
    text:
      en: 'Pushkin described the apartment by the bridge and the owner of the house. The museum dates the current street number to 1880.'
      zh: '普希金以桥和房主指明住处，博物馆记载现用门牌于 1880 年固定。'
    line:
      en: 'October 1836: in a letter Pushkin gives his address as the house of Princess Volkonskaya by the Konyushenny Bridge. There is no number; the one on the door today was fixed in 1880.'
      zh: '1836 年 10 月，普希金在信里写自己住在科纽申内桥边沃尔孔斯卡娅公爵夫人的房子里。没有门牌号，今天门上那个号码是 1880 年才定下的。'
      zh-Hant: '1836 年 10 月，普希金在信裡寫自己住在科紐申內橋邊沃爾孔斯卡婭公爵夫人的房子裡。沒有門牌號，今天門上那個號碼是 1880 年才定下的。'
      fr: 'Octobre 1836 : dans une lettre, Pouchkine donne son adresse comme étant la maison de la princesse Volkonskaya près du pont Konyushenny. Il n''y a pas de numéro ; celui de la porte aujourd''hui a été réparé en 1880.'
      es: 'Octubre de 1836: en una carta, Pushkin da su dirección como casa de la princesa Volkonskaya junto al puente Konyushenny. No hay ningún número; el de la puerta actual fue reparado en 1880.'
      ja: '1836年10月：プーシキンは手紙の中で、コニュシェニ橋のそばにあるヴォルコンスカヤ王女の家としての住所を述べている。数字はありません。現在ドアにあるものは 1880 年に修正されました。'
      ko: '1836년 10월: 푸쉬킨은 편지에서 자신의 주소를 코뉴셰니 다리 옆 볼콘스카야 공주의 집이라고 적었습니다. 숫자가 없습니다. 오늘 문에 있는 것은 1880년에 고쳐진 것입니다.'
      ru: 'Октябрь 1836 г.: в письме Пушкин называет адрес дома княгини Волконской у Конюшенного моста. Нет никакого номера; та, что сегодня на двери, была установлена в 1880 году.'
  duel:
    date: '1837-02-08'
    stay_day: 38
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gw2ru_last_duel, poetry_foundation_pushkin]
    text:
      en: 'On 27 January 1837 by the old calendar, 8 February by the new, Pushkin fought a duel with Georges d''Anthès by the Black River. D''Anthès fired first and wounded him in the stomach; Pushkin fired back and wounded d''Anthès lightly in the arm.'
      zh: '旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，普希金在黑溪边与乔治·丹特斯决斗。丹特斯先开枪，击中普希金腹部；普希金还了一枪，只擦伤丹特斯的手臂。'
    line:
      en: '27 January by the old calendar, 8 February by the new: by the Black River, d''Anthès fires first and hits Pushkin in the stomach. Pushkin fires back and grazes his arm.'
      zh: '旧历 1 月 27 日，也就是新历 2 月 8 日，黑溪边，丹特斯先开枪，打中普希金的腹部。普希金还了一枪，只擦伤对方的手臂。'
      zh-Hant: '舊曆 1 月 27 日，也就是新曆 2 月 8 日，黑溪邊，丹特斯先開槍，打中普希金的腹部。普希金還了一槍，只擦傷對方的手臂。'
      fr: '27 janvier selon l''ancien calendrier, 8 février selon le nouveau : au bord de la Rivière Noire, d''Anthès tire le premier et frappe Pouchkine au ventre. Pouchkine riposte et lui effleure le bras.'
      es: '27 de enero según el calendario antiguo, 8 de febrero según el nuevo: junto al río Negro, d''Anthès dispara primero y alcanza a Pushkin en el estómago. Pushkin responde y le roza el brazo.'
      ja: '旧暦で1月27日、新暦で2月8日。黒川沿いでダンテスが最初に発砲し、プーシキンの腹部を直撃した。プーシキンは反撃し、腕をかすめた。'
      ko: '구력으로는 1월 27일, 신력으로는 2월 8일: Black River 옆에서 d''Anthès가 먼저 사격을 가하고 푸쉬킨의 배를 때립니다. 푸쉬킨은 반격을 가하고 팔을 스쳤습니다.'
      ru: '27 января по старому стилю, 8 февраля по новому: у Черной реки Дантес стреляет первым и попадает Пушкину в живот. Пушкин стреляет в ответ и царапает руку.'
  carried_home:
    date: '1837-02-08'
    stay_day: 38.6
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gw2ru_last_duel, poets_graves_pushkin]
    text:
      en: 'The wounded poet was brought back to his apartment on the Moika.'
      zh: '受伤的诗人被送回莫伊卡河畔的寓所。'
    line:
      en: 'He is brought home to the apartment on the Moika.'
      zh: '他被送回莫伊卡河畔的寓所。'
      zh-Hant: '他被送回莫伊卡河畔的寓所。'
      fr: 'Il est ramené à la maison à l''appartement de la Moika.'
      es: 'Lo llevan a su casa en el apartamento de Moika.'
      ja: '彼はモイカ川のアパートに連れて帰りました。'
      ko: '그는 Moika에 있는 아파트로 집으로 데려옵니다.'
      ru: 'Его привозят домой, в квартиру на Мойке.'
  apartment:
    date: '1837-02-10'
    stay_day: 40
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [pushkin_st_petersburg_apartment]
    text:
      en: 'Pushkin died in this apartment on February 10, 1837, or January 29 by the old calendar.'
      zh: '普希金于 1837 年 2 月 10 日在该寓所去世，按当时俄历为 1 月 29 日。'
    note: 'Death: written as a plain fact.'
    line:
      en: '29 January by the old calendar, 10 February by the new: Pushkin dies in the apartment.'
      zh: '旧历 1 月 29 日，也就是新历 2 月 10 日，普希金在寓所里去世。'
      zh-Hant: '舊曆 1 月 29 日，也就是新曆 2 月 10 日，普希金在寓所裡去世。'
      fr: '29 janvier selon l''ancien calendrier, 10 février selon le nouveau : Pouchkine meurt dans l''appartement.'
      es: '29 de enero según el calendario antiguo, 10 de febrero según el nuevo: Pushkin muere en el apartamento.'
      ja: '旧暦1月29日、新暦2月10日：プーシキンがアパートで死亡。'
      ko: '구력으로는 1월 29일, 신력으로는 2월 10일: 푸쉬킨이 아파트에서 사망합니다.'
      ru: '29 января по старому стилю, 10 февраля по новому: Пушкин умирает в квартире.'
  buried:
    date: '1837'
    stay_day: 48
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poets_graves_pushkin, gw2ru_last_duel]
    text:
      en: 'He was buried beside his mother near his estate of Mikhailovskoye.'
      zh: '他葬在米哈伊洛夫斯科耶庄园附近，在他母亲身旁。'
    line:
      en: 'Far from the city, near Mikhailovskoye, he is buried beside his mother.'
      zh: '远离彼得堡，在米哈伊洛夫斯科耶附近，他葬在母亲身旁。'
      zh-Hant: '遠離彼得堡，在米哈伊洛夫斯科耶附近，他葬在母親身旁。'
      fr: 'Loin de la ville, près de Mikhaïlovskoïe, il est enterré à côté de sa mère.'
      es: 'Lejos de la ciudad, cerca de Mikhailovskoye, está enterrado junto a su madre.'
      ja: '街から遠く離れたミハイロフスコエの近くで、彼は母親の隣に埋葬されている。'
      ko: '도시에서 멀리 떨어진 Mikhailovskoye 근처에 그는 어머니 옆에 묻혀 있습니다.'
      ru: 'Вдали от города, недалеко от Михайловского, он похоронен рядом с матерью.'
