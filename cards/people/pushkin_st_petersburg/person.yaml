    text:
      en:
        name: 'A place before its house number'
        place: "St Petersburg"
        figure: "Alexander Pushkin"
        story: 'In 1836 and 1837 Alexander Pushkin lived in an apartment on the Moika embankment by the Konyushenny Bridge, in the house of Princess Volkonskaya. On 27 January 1837 by the old calendar, 8 February by the new, he fought a duel with Georges d''Anthès by the Black River and was shot in the stomach. He was brought home and died there on 29 January, 10 February by the new calendar. He is buried beside his mother near his family estate of Mikhailovskoye.'
        story_prose:
          opening:
            - 'St Petersburg, January 1837 by the new calendar. Alexander Pushkin and his family live on the Moika embankment by the Konyushenny Bridge, in the house of Princess Volkonskaya, and the door does not yet carry the number it has today. He wrote Eugene Onegin in verse, and is often regarded as the founder of modern Russian literature.'
            - 'In history, his debts grew all that winter; on 8 February by the new calendar he fought a duel with Georges d''Anthès by the Black River, was shot in the stomach and brought home, and two days later died of peritonitis at thirty seven, leaving his wife and four children; the tsar later paid off his debts. In this branch, everyone who asks the way to the apartment asks the porter, and a maid of the house often sends errands across to the far side of the bridge.'
            - 'A few kinds of people can help on this trip: someone who can keep accounts or has done some trading, or someone orderly and quick witted, to sort out a pile of bills; someone who knows medicine, or someone with a first aid kit who stays steady in a crisis; a doctor who has brought antibiotics, or a medic with a nano medical kit.'
          outcomes:
            all: 'When February was over Pushkin was still recovering by the Moika, and the bills on his desk had become a single list. He went on writing for a few more years, and The Contemporary stayed in his hands.'
            p3: 'When February was over he was still recovering by the Moika, and could walk to the window with a hand on the wall. For a few more years The Contemporary stayed in his hands.'
            p1: 'The list stayed under the inkwell. Afterwards the household spent by it, one item at a time.'
            p2: 'He came home alive to the Moika, was carried into the study and laid on the sofa there. In the hall, the people asking for news stood all the way out into the street.'
          none: 'On the evening of 8 February by the new calendar, in the snow by the Black River, he did not live to reach the city. The pile of bills still lay on the desk, untouched.'
          desync: 'On the evening of 8 February by the new calendar, halfway back to the city, the carriage fell silent. When {staff} was recalled, it stood in the snow with its door half open, and a glove lay on the ground.'
          not_admitted: '{staff} never got into the house, and only walked once along the Moika from the bridge with the porter, counting the turns to name when giving directions. The porter said more people had been asking the way lately, all of them looking for the house by the bridge.'
          points:
            p1:
              class_lettered: 'Late January by the new calendar, and a pile of bills lay on the desk in the study, from the printer, for the rent, for credit at the shops, one on top of another. {staff}, used to desk work, spread them out one by one and copied them by date and sum onto a single list, marking beside each which to pay first and which could wait. Pushkin took the list, looked at it for a while, and put it under the inkwell. The pile of bills was tied into a bundle and put away in a drawer.'
              class_trade: 'Late January by the new calendar, and a pile of bills lay on the desk in the study, from the printer, for the rent, for credit at the shops, one on top of another. {staff}, who had done some trading and knew how shops work, sorted the bills into piles by creditor, wrote a slip for each saying which would wait and which would not, and copied them all onto a single list. Pushkin took the list, looked at it for a while, and put it under the inkwell. The pile of bills was tied into a bundle and put away in a drawer.'
              else: 'Late January by the new calendar, and a pile of bills lay on the desk in the study, from the printer, for the rent, for credit at the shops, one on top of another. {staff}, careful by nature, put the bills in order of when they fell due, copied them onto a single list, and checked the sums line by line. Pushkin took the list, looked at it for a while, and put it under the inkwell. The pile of bills was tied into a bundle and put away in a drawer.'
            p2:
              class_medical: 'The evening of 8 February by the new calendar, in the snow by the Black River. D''Anthès fired first; Pushkin was hit in the stomach, lost a great deal of blood, and was helped into a carriage that hurried back to the city. {staff}, trained in first aid, knelt in the carriage pressing on the wound, packed it tight with clean cloth layer on layer, felt his pulse every so often, and did not let go the whole way. The carriage stopped at the door on the Moika, and the porter ran out with a lamp. Pushkin was carried in and laid on the sofa in the study, the snow on his coat not yet melted.'
              else: 'The evening of 8 February by the new calendar, in the snow by the Black River. D''Anthès fired first; Pushkin was hit in the stomach, lost a great deal of blood, and was helped into a carriage that hurried back to the city. {staff} opened the first aid kit brought along, pressed gauze on the wound, spread a coat beneath him as well, and steadied him with a hand each time the carriage jolted. The carriage stopped at the door on the Moika, and the porter ran out with a lamp. Pushkin was carried in and laid on the sofa in the study, the snow on his coat not yet melted.'
            p3:
              class_learned: '9 February by the new calendar. He had lain all night on the sofa in the study; the wound had grown hot, and he clenched his teeth against the pain. {staff}, a doctor, saw that the wound was infected, cleaned it, gave the medicine brought along, put on fresh gauze, and looked at him once an hour. On the afternoon of 10 February his fever broke; he asked for a glass of water and drank two mouthfuls, holding it himself. Outside the window the Moika was frozen, and people were walking across the bridge.'
              else: '9 February by the new calendar. He had lain all night on the sofa in the study; the wound had grown hot, and he clenched his teeth against the pain. {staff}, trained in medicine, opened the medical kit brought along, gave the medicine as its instructions said, and watched his temperature, taking it once an hour. On the afternoon of 10 February his fever broke; he asked for a glass of water and drank two mouthfuls, holding it himself. Outside the window the Moika was frozen, and people were walking across the bridge.'
          excerpts:
            p3: 'On the afternoon of 10 February his fever broke; he asked for a glass of water and drank two mouthfuls, holding it himself. Outside the window the Moika was frozen, and people were walking across the bridge.'
            p2: 'The carriage stopped at the door on the Moika, and the porter ran out with a lamp. Pushkin was carried in and laid on the sofa in the study, the snow on his coat not yet melted.'
            p1: 'Pushkin took the list, looked at it for a while, and put it under the inkwell. The pile of bills was tied into a bundle and put away in a drawer.'
        relic: "A book of his verse"
        relic_desc: "A small book with a pressed leaf at one poem."
        points:
          p1: 'Help him sort out his growing debts, so that his wife and children no longer live from one bill to the next'
          p2: 'After he is shot, keep him alive on the road back from the Black River, so that he reaches his apartment on the Moika'
          p3: 'Heal the gunshot wound in his stomach, hold back the infection, and keep him alive'
        points_fail:
          p1: 'In this branch the bills of that winter still lay on his desk, and nobody ever sorted them for him.'
          p2: 'He did not live to reach the Moika, and in this branch there are no two days in the apartment.'
          p3: 'On the afternoon of 10 February he died in the apartment as he did in history, and in this branch he was not kept even one more day.'
        shift:
