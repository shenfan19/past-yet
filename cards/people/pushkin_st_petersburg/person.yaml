        - {id: river, day: 15}
    text:
      en:
        name: 'A place before its house number'
        place: "St Petersburg"
        figure: "Alexander Pushkin"
        story: 'In 1836 and 1837 Alexander Pushkin lived in an apartment on the Moika embankment by the Konyushenny Bridge, in the house of Princess Volkonskaya. On 27 January 1837 by the old calendar, 8 February by the new, he fought a duel with Georges d''Anthès by the Black River and was shot in the stomach. He was brought home and died there on 29 January, 10 February by the new calendar. He is buried beside his mother at the Svyatogorsky Monastery near Mikhailovskoye.'
        relic: "A book of his verse"
        relic_desc: "A small book with a pressed leaf at one poem."
        points:
          p1: 'Help him sort out his growing debts, so that his wife and children no longer live from one bill to the next'
          p2: 'After he is shot, keep him alive on the road back from the Black River, so that he reaches his apartment on the Moika'
          p3: 'Heal the gunshot wound in his stomach, hold back the infection, and keep him alive'
        points_fail:
          p1: 'In this branch the bills of that winter still lay on his desk, and nobody ever sorted them for him.'
          p2: 'He did not live to reach the Moika, and in this branch there are no two days in the apartment.'
          p3: 'On the afternoon of 10 February he died in the apartment as he did in history, and in this branch he was not kept even one more day.'
        shift:
          p1:
            was: 'When Pushkin died in February 1837 he left heavy debts, which Nicholas I later paid off.'
            now: 'The debts were written out on one sheet, which to pay first and which could wait, and the household knew where it stood.'
          p2:
            was: 'After he was shot in the duel on 8 February 1837, Pushkin was carried home to his apartment on the Moika.'
          p3:
            was: 'On 10 February 1837 he died of peritonitis in the apartment at thirty seven, leaving his wife and four children.'
            now: 'The medicine {staff} brought held back the infection in the wound, and when February was over he was still recovering by the Moika. He went on writing for a few more years, and The Contemporary stayed in his hands.'
        vignettes:
          number: '{staff} nearly gives a visitor a house number from a museum plaque that does not exist yet, then crosses it out and draws the bridge on the slip instead.'
          queue: '{staff} writes the same answer on several slips so that the people waiting in the hall can read it without asking again.'
          river: '{staff} walks from the bridge along the Moika with the porter and counts the turns that belong in directions to the door.'
      zh:
        name: '门牌号尚未出现的那户人家'
        place: "圣彼得堡"
        figure: "亚历山大·普希金"
        story: '1836 年到 1837 年，亚历山大·普希金住在莫伊卡河畔、科纽申内桥旁沃尔孔斯卡娅公爵夫人的房子里。旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，他在黑溪边与乔治·丹特斯决斗，腹部中弹，被送回寓所，旧历 1 月 29 日，也就是新历 2 月 10 日在那里去世。他葬在米哈伊洛夫斯科耶附近的圣山修道院，在他母亲身旁。'
        relic: "一本诗集"
        relic_desc: "一本小书，某首诗里夹着一片压干的叶子。"
        points:
          p1: '帮他把越欠越多的债理出头绪，让妻子和孩子的日子不再悬着'
          p2: '中弹以后，护住从黑溪回城那一路，让他活着回到莫伊卡河畔的寓所'
          p3: '治好他腹部的枪伤，压住伤口里的感染，让他活下来'
        points_fail:
          p1: '这条分支里，那个冬天的欠单照旧压在书桌上，没有人替他理过。'
          p2: '他没能撑到莫伊卡河畔，这条分支里没有寓所里的那两天。'
          p3: '2 月 10 日下午，他照史实在寓所里去世，这条分支里也没能多留他一天。'
        shift:
          p1:
            was: '1837 年 2 月普希金去世时欠下大笔债务，后来由尼古拉一世替他还清。'
            now: '欠账理成了一张单子，哪笔先还、哪笔能缓，家里心里有了数。'
          p2:
            was: '1837 年 2 月 8 日决斗中弹以后，普希金被送回莫伊卡河畔的寓所。'
          p3:
            was: '1837 年 2 月 10 日他在寓所里死于腹膜炎，三十七岁，留下妻子和四个孩子。'
            now: '{staff}带去的药压住了伤口的感染，二月过去时他还在莫伊卡河畔养伤。他又写了几年，《同时代人》仍在他手里办下去。'
        vignettes:
          number: '{staff}差点把一块博物馆门牌上的号码告诉来访的人，可那块牌子这时还没有，便划掉数字，在纸条上画了那座桥。'
          queue: '{staff}把同一句回答抄在几张纸条上，门厅里等着的人看了就不用再问。'
          river: '{staff}跟着门房从桥边沿莫伊卡河走一遍，数清指路时该说的几个转弯。'
text:
  en:
    name: Alexander Pushkin
    text: Russian poet, 1799 to 1837, often regarded as the founder of modern Russian literature. He wrote Eugene Onegin in verse. In 1837 he was wounded in a duel in St Petersburg and died two days later.
  zh:
    name: 亚历山大·普希金
    text: 俄国诗人，1799 年生，1837 年去世，常被视为现代俄国文学的奠基人。他用诗体写了《叶甫盖尼·奥涅金》。1837 年他在圣彼得堡决斗中受伤，两天后去世。
hook: {en: 'Would you still call this Moika 12?', zh: '这时还不能写莫伊卡十二号'}
facts:
  address:
    date: '1836-10'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [pushkin_st_petersburg_address]
    text:
      en: 'Pushkin described the apartment by the bridge and the owner of the house. The museum dates the current street number to 1880.'
      zh: '普希金以桥和房主指明住处，博物馆记载现用门牌于 1880 年固定。'
    line:
      en: 'October 1836: in a letter Pushkin gives his address as the house of Princess Volkonskaya by the Konyushenny Bridge. There is no number; the one on the door today was fixed in 1880.'
      zh: '1836 年 10 月，普希金在信里写自己住在科纽申内桥边沃尔孔斯卡娅公爵夫人的房子里。没有门牌号，今天门上那个号码是 1880 年才定下的。'
  duel:
    date: '1837-02-08'
    stay_day: 38
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gw2ru_last_duel, poetry_foundation_pushkin]
    text:
      en: 'On 27 January 1837 by the old calendar, 8 February by the new, Pushkin fought a duel with Georges d''Anthès by the Black River. D''Anthès fired first and wounded him in the stomach; Pushkin fired back and wounded d''Anthès lightly in the arm.'
      zh: '旧历 1837 年 1 月 27 日，也就是新历 2 月 8 日，普希金在黑溪边与乔治·丹特斯决斗。丹特斯先开枪，击中普希金腹部；普希金还了一枪，只擦伤丹特斯的手臂。'
    line:
      en: '27 January by the old calendar, 8 February by the new: by the Black River, d''Anthès fires first and hits Pushkin in the stomach. Pushkin fires back and grazes his arm.'
      zh: '旧历 1 月 27 日，也就是新历 2 月 8 日，黑溪边，丹特斯先开枪，打中普希金的腹部。普希金还了一枪，只擦伤对方的手臂。'
  carried_home:
    date: '1837-02-08'
    stay_day: 38.6
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [gw2ru_last_duel, poets_graves_pushkin]
    text:
      en: 'The wounded poet was brought back to his apartment on the Moika.'
      zh: '受伤的诗人被送回莫伊卡河畔的寓所。'
    line:
      en: 'He is brought home to the apartment on the Moika.'
      zh: '他被送回莫伊卡河畔的寓所。'
  apartment:
    date: '1837-02-10'
    stay_day: 40
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [pushkin_st_petersburg_apartment]
    text:
      en: 'Pushkin died in this apartment on February 10, 1837, or January 29 by the old calendar.'
      zh: '普希金于 1837 年 2 月 10 日在该寓所去世，按当时俄历为 1 月 29 日。'
    note: 'Death: written as a plain fact.'
    line:
      en: '29 January by the old calendar, 10 February by the new: Pushkin dies in the apartment.'
      zh: '旧历 1 月 29 日，也就是新历 2 月 10 日，普希金在寓所里去世。'
  buried:
    date: '1837'
    stay_day: 48
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [poets_graves_pushkin, gw2ru_last_duel]
    text:
      en: 'He was buried beside his mother at the Svyatogorsky Monastery near his estate of Mikhailovskoye.'
      zh: '他葬在米哈伊洛夫斯科耶庄园附近的圣山修道院，在他母亲身旁。'
    line:
      en: 'Far from the city, near Mikhailovskoye, he is buried at the Svyatogorsky Monastery beside his mother.'
      zh: '远离彼得堡，在米哈伊洛夫斯科耶附近的圣山修道院，他葬在母亲身旁。'
