quotes:
  pushkin_lyre_echo:
    order: 1
    tier: full
    date: '1836-08-21'
    checked: official_record
    sources: [pushkin_lyre_rvb]
    original: ru
    text:
      en: {who: 'Alexander Pushkin', quote: 'No, I shall not wholly die—my soul in the cherished lyre will outlive my ashes and escape decay.', occasion: 'Second stanza of Exegi monumentum; manuscript date, Old Style · Game translation'}
      zh: {who: '亚历山大·普希金', quote: '不，我不会整个死去——我的灵魂在珍爱的琴中，将比我的骨灰活得更久，不归于朽灭。', occasion: '《我为自己筑起一座非手造的纪念碑》第二节；日期为手稿所记俄历 · 游戏译文'}
      ru: {who: 'Alexander Pushkin', quote: 'Нет, весь я не умру — душа в заветной лире / Мой прах переживет и тленья убежит —', occasion: 'Вторая строфа «Exegi monumentum»; дата рукописи по старому стилю'}
  pushkin_life_echo:
    order: 2
    tier: none
    date: '1825'
    checked: official_record
    sources: [pushkin_album_rvb]
    original: ru
    text:
      en: {who: 'Alexander Pushkin', quote: 'If life deceives you, do not grieve or be angry. Bear with the day of sorrow: believe that a day of joy will come.', occasion: 'Opening stanza of If Life Deceives You · Game translation'}
      zh: {who: '亚历山大·普希金', quote: '假如生活欺骗了你，不要悲伤，也不要生气！且忍过忧郁的一天：相信吧，欢喜的日子终会到来。', occasion: '《假如生活欺骗了你》第一节 · 游戏译文'}
      ru: {who: 'Alexander Pushkin', quote: 'Если жизнь тебя обманет, / Не печалься, не сердись! / В день уныния смирись: / День веселья, верь, настанет.', occasion: 'Первая строфа стихотворения «Если жизнь тебя обманет…»'}
