    refs: [pushkin_st_petersburg_address, pushkin_st_petersburg_apartment, poetry_foundation_pushkin, gw2ru_last_duel, poets_graves_pushkin]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: notice, day: 20, req: {"any":[{"job":["accountant","tax_preparer","shopkeeper","antique_dealer","market_trader"]},{"trait":["methodical"],"stat":{"wit":6}}]}}
        - {id: p2, kind: hold, guard: true, day: 38.5, req: {"any":[{"job":["doctor","physician","nurse","paramedic"]},{"item":"first_aid_kit","trait":["calm","vigil","hardy","bold"]}]}}
        - {id: p3, kind: care, day: 39, req: {"any":[{"job":["doctor","physician"],"item":"antibiotic"},{"job":["doctor","physician","nurse","paramedic"],"item":"nano_kit"}]}}
