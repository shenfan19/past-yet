quotes:
  pushkin_lyre_echo:
    order: 1
    tier: full
    date: '1836-08-21'
    checked: official_record
    sources: [pushkin_lyre_rvb]
    original: ru
    text:
      en:
        who: 'Alexander Pushkin'
        quote: 'No, I shall not wholly die—my soul in the cherished lyre will outlive my ashes and escape decay.'
        occasion: 'Second stanza of Exegi monumentum; manuscript date, Old Style · Game translation'
      zh:
        who: '亚历山大·普希金'
        quote: '不，我不会整个死去——我的灵魂在珍爱的琴中，将比我的骨灰活得更久，不归于朽灭。'
        occasion: '《我为自己筑起一座非手造的纪念碑》第二节；日期为手稿所记俄历 · 游戏译文'
      ru:
        who: 'Alexander Pushkin'
        quote: 'Нет, весь я не умру — душа в заветной лире / Мой прах переживет и тленья убежит —'
        occasion: 'Вторая строфа «Exegi monumentum»; дата рукописи по старому стилю'
      zh-Hant:
        who: '亞歷山大·普希金'
        quote: '不，我不會整個死去——我的靈魂在珍愛的琴中，將比我的骨灰活得更久，不歸於朽滅。'
        occasion: '《我為自己築起一座非手造的紀念碑》第二節；日期為手稿所記俄歷 · 遊戲譯文'
      fr:
        who: 'Alexandre Pouchkine'
        quote: 'Non, je ne mourrai pas complètement : mon âme dans la lyre chérie survivra à mes cendres et échappera à la décadence.'
        occasion: 'Deuxième strophe d''Exegi monumentum ; date du manuscrit, style ancien · Traduction du jeu'
      es:
        who: 'Aleksandr Pushkin'
        quote: 'No, no moriré del todo; mi alma en la preciada lira sobrevivirá a mis cenizas y escapará de la decadencia.'
        occasion: 'Segunda estrofa del Exegi monumentum; fecha del manuscrito, estilo antiguo · Traducción del juego'
      ja:
        who: 'アレクサンドル・プーシキン'
        quote: 'いいえ、私は完全に死ぬことはありません。大切にされていた竪琴の中にある私の魂は、私の灰を超えて生き、腐敗を免れます。'
        occasion: 'エクセギ記念碑の第 2 節。原稿日、オールドスタイル・ゲーム翻訳'
      ko:
        who: '알렉산드르 푸시킨'
        quote: '아니요, 나는 완전히 죽지 않을 것입니다. 소중한 수금에 있는 내 영혼은 재보다 오래 살며 부패를 피할 것입니다.'
        occasion: 'Exegi Monumentum의 두 번째 스탠자; 원고 날짜, 구식 · 게임 번역'
  pushkin_life_echo:
    order: 2
    tier: none
    date: '1825'
    checked: official_record
    sources: [pushkin_album_rvb]
    original: ru
    text:
      en:
        who: 'Alexander Pushkin'
        quote: 'If life deceives you, do not grieve or be angry. Bear with the day of sorrow: believe that a day of joy will come.'
        occasion: 'Opening stanza of If Life Deceives You · Game translation'
      zh:
        who: '亚历山大·普希金'
        quote: '假如生活欺骗了你，不要悲伤，也不要生气！且忍过忧郁的一天：相信吧，欢喜的日子终会到来。'
        occasion: '《假如生活欺骗了你》第一节 · 游戏译文'
      ru:
        who: 'Alexander Pushkin'
        quote: 'Если жизнь тебя обманет, / Не печалься, не сердись! / В день уныния смирись: / День веселья, верь, настанет.'
        occasion: 'Первая строфа стихотворения «Если жизнь тебя обманет…»'
      zh-Hant:
        who: '亞歷山大·普希金'
        quote: '假如生活欺騙了你，不要悲傷，也不要生氣！且忍過憂鬱的一天：相信吧，歡喜的日子終會到來。'
        occasion: '《假如生活欺騙了你》第一節 · 遊戲譯文'
      fr:
        who: 'Alexandre Pouchkine'
        quote: 'Si la vie vous trompe, ne vous affligez pas et ne vous mettez pas en colère. Supportez le jour de tristesse : croyez qu’un jour de joie viendra.'
        occasion: 'Strophe d''ouverture de If Life Deceives You · Traduction du jeu'
      es:
        who: 'Aleksandr Pushkin'
        quote: 'Si la vida te engaña, no te aflijas ni te enfades. Soportad el día de tristeza: creed que llegará un día de alegría.'
        occasion: 'Estrofa inicial de If Life Deceives You · Traducción del juego'
      ja:
        who: 'アレクサンドル・プーシキン'
        quote: '人生があなたを欺いても、悲しんだり怒ったりしないでください。悲しみの日を耐えてください。喜びの日が来ることを信じてください。'
        occasion: 'If Life Deceives You のオープニングスタンザ · ゲームの翻訳'
      ko:
        who: '알렉산드르 푸시킨'
        quote: '삶이 당신을 속인다면 슬퍼하거나 화를 내지 마십시오. 슬픔의 날을 견디라, 기쁨의 날이 오리라 믿으라.'
        occasion: '인생이 당신을 속이면의 오프닝 스탠자 · 게임 번역'
