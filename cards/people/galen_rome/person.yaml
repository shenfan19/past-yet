    text:
      en:
        name: 'Names left after the fire'
        place: "Rome"
        figure: "Galen"
        story: 'In On Avoiding Distress, Galen describes losing books and other possessions in Rome’s fire of 192. He distinguishes his missing copies from works he believed he could no longer recover.'
        story_prose:
          opening:
            - 'Rome, 192. Galen has sent some rolls towards Campania and left books and objects in storage in Rome. Later, in On Avoiding Distress, he remembers those things separately.'
            - 'In history the fire destroyed books including work he thought he could never replace. In this branch one load goes early. Someone can look through the lists with him before it is closed.'
            - 'Someone who knows which books go with which load can help. Someone also needs to ask the craftspeople which instruments could be made again from memory, and which could not.'
          points:
            p3: '{staff} finds the comedy glossary on the Rome store list and asks Galen to look at its destination again. Galen opens it to a place he often consults, then tells the person loading the early shipment to put it with the books for Campania. As the lid is being put on, Galen reaches back to turn the tie upwards so it will not be caught underneath.'
            p2: 'The store has not taken all the instruments yet. {staff} asks a craft worker which would be hardest to remake and has him prepare a second model at his bench. He waits for the wax to set and marks the underside. When someone comes to clear the bench, he keeps the model in his hand. The second one goes right at the back of his drawer.'
            p1: '{staff} separates the two manifests and has the person loading the early shipment read back the one for Campania. Someone lifts a roll that was almost put in the Rome pile. After checking with Galen, he moves it to the load leaving first. Before tying it shut the loader writes the destination on top again. Someone winds the loose end of the cord round a corner.'
          outcomes:
            all: 'The books sent out early are still available when needed. Someone follows the label to the comedy glossary, and at the workshop the spare model is still there.'
            p3: 'The manuscript goes ahead of the fire, its tie facing upwards. Anyone looking later can recognise it without taking the load apart.'
            p2: 'Before making the instrument again the craftsman opens his own drawer and takes the model out.'
            p1: 'The rolls marked to go early leave first. The list for the Rome store stays behind.'
          none: 'The early shipment is already loaded. The rolls that missed it are put away as before.'
          not_admitted: '{staff} never meets the person loading. Footsteps carrying things recede beyond the store door.'
          desync: 'The early rolls are filed with the Rome stock. The ink of the mistaken entry is still wet when the agency calls {staff} back.'
          excerpts:
            p3: 'As the lid is being put on, Galen reaches back to turn the tie upwards so it will not be caught underneath.'
            p2: 'When someone comes to clear the bench, he keeps the model in his hand. The second one goes right at the back of his drawer.'
            p1: 'Before tying it shut the loader writes the destination on top again. Someone winds the loose end of the cord round a corner.'
        relic: 'An inventory leaf'
        relic_desc: 'A fictional inventory with one surviving title and an empty copy column.'
        points:
          p1: 'Secure room on the earlier shipment for the prose glossary rolls already meant to go to Campania'
          p2: 'Before the instruments go into storage, have a craft worker make a second wax model of a hard-to-replace instrument and keep it at the workshop'
          p3: 'Persuade Galen to send his Old Comedy glossary out of Rome with the earlier shipment before it is loaded'
        points_fail:
          p1: 'The rolls are filed with the Rome stock and burn instead of reaching Campania. The branch falls out of sync and the office recalls the employee.'
          p2: 'There is no model to consult when the craft worker has to make the instruments again.'
          p3: 'The manuscript waits in storage for the summer shipment and is still there when the fire comes.'
        shift:
          p1:
            was: 'When fire broke out in Rome at the end of winter in AD 192, Galen said his prose glossary had already gone to Campania.'
          p2:
            was: 'In AD 192, the fire destroyed the instruments Galen stored in Rome, including ones he had designed.'
            now: 'A second wax model stays at the workshop. After the fire, Galen can use it to have the instrument made again.'
          p3:
            was: 'At the end of winter in AD 192, Galen''s Old Comedy glossary burned in the fire in Rome.'
            now: '{staff} gets the rolls into the earlier shipment and Galen can go on revising the text from a copy after the fire. Another copy later reaches a collection outside Rome.'
            who: galen_rome
            bio: 'Galen had a surviving copy of his Old Comedy glossary after the fire. He kept checking its quotations and deposited another copy for readers elsewhere.'
        vignettes:
          list: 'Tertia calls three names from a list and counts three books. You ask her to touch the volumes that go with them. There are two. Together you leave the third title readable and put an empty mark in the copy column.'
          borrow: 'Dion remembers lending a copy but cannot name the recipient. Tertia wants to strike the title before the list goes out. You help him recall the doorway where he handed it over. She keeps one place on the list open for a reply from that street.'
          survival: 'You have read a work about this very loss in a copy that will resurface long after the fire. Dion asks which title he can put on tomorrow’s desk. You leave the names in the inventory and show him the two actual volumes. The missing one has not been found when you leave.'
      zh:
        name: '火后还在的书名'
        place: "罗马"
        figure: "盖伦"
        story: '盖伦在《论免于忧苦》中叙述罗马192年火灾给自己的藏书和物品带来的损失，也叙说哪些书在他看来已经无从补回。'
        story_prose:
          opening:
            - '192 年，罗马。盖伦把一些卷册送往坎帕尼亚，也有书和物件放在罗马的仓间。后来，他在《论免于忧苦》里分开回忆了这些东西。'
            - '史实里，火灾烧掉一批藏书，其中有他认为再找不到的词汇手稿。在这条分支里，一批货先走，正好有人可以在装货前和他一起再看一遍。'
            - '这趟用得上知道两批书各该去何处的人。还有人须把工坊里能重做和难重做的物件分开问清。'
          points:
            p3: '{staff}把那部喜剧词汇手稿从罗马仓间的单子里挑出来，请盖伦再看一次他原先写的收处。盖伦翻到常查的一页，合上以后，让先行的装货人把它放进给坎帕尼亚的那批。 装货人刚要合盖，盖伦又把手伸进去，把卷上的系带翻过来，免得它压在底下。'
            p2: '仓间还没收走所有器械。{staff}先问工匠哪件日后最难重做，请他留在工作台旁做第二份样。工匠等蜡变硬，在底下写了一笔记号。 有人来催着收桌，工匠没把它递出去。他把第二份放在抽屉最里面。'
            p1: '{staff}把两张送货单分开，请先行的装货人照着坎帕尼亚那张重念一遍。有人拿起差点放进罗马那堆的卷，等盖伦确认，才把它放回先走的货里。 捆好之前，装货人把目的地重新写在最上面。另一个人把空出来的绳头绕过箱角。'
          outcomes:
            all: '先行的书后来能够借来。有人顺着标签读到那份喜剧词汇，工坊里也还能找出自己留下的蜡样。'
            p3: '那份手稿随先走的货离开城里，卷带朝上。以后有人要找，第一眼就知道是哪件。'
            p2: '工匠日后重做那件东西前，先去把自己的抽屉打开，找出试样。'
            p1: '该先走的卷还是先走。罗马仓间的那张单子留在原处。'
          none: '先走的货已经装完。没有赶上的卷仍照原来的去处收着。'
          not_admitted: '{staff}没见到负责装货的人。搬运的脚步声从仓门里慢慢远了。'
          desync: '本来先走的卷并入罗马仓间。事务所召回{staff}时，旧单上那道误抄的墨还没干。'
          excerpts:
            p3: '装货人刚要合盖，盖伦又把手伸进去，把卷上的系带翻过来，免得它压在底下。'
            p2: '有人来催着收桌，工匠没把它递出去。他把第二份放在抽屉最里面。'
            p1: '捆好之前，装货人把目的地重新写在最上面。另一个人把空出来的绳头绕过箱角。'
        relic: '一页书目'
        relic_desc: '书目，有个书名依然可读，存卷一栏留空。'
        points:
          p1: '先为要送往坎帕尼亚的散文词语卷留好运送位置，让这批书能照原计划先发'
          p2: '器械入仓前，请工匠替一件难补的器械再做一个蜡样，留在工坊'
          p3: '趁先发的书还没装完，说服盖伦让旧喜剧词语手稿随同这批书离城'
        points_fail:
          p1: '书卷错收进罗马的仓房，旧时已经运走的那批也在火里失去。行程同步失败，员工被召回。'
          p2: '火后要重做器械，工匠手上没有留下的样件可对。'
          p3: '那批手稿仍要等夏初才发运，来不及躲过这场火。'
        shift:
          p1:
            was: '公元 192 年冬末罗马起火时，盖伦说那批散文作家词语汇编已经运往坎帕尼亚。'
          p2:
            was: '公元 192 年，盖伦存放在罗马仓房的器械随火灾毁坏，其中有他自己设计的器械。'
            now: '另做的蜡样留在工坊。火灾之后，盖伦还能凭这个样件请工匠重做那件器械。'
          p3:
            was: '公元 192 年冬末，盖伦编的旧喜剧词语手稿在罗马仓房的火灾中烧毁。'
            now: '{staff}让这批卷子随先发的书运走，盖伦回到罗马后能凭副本继续修订。后来另有一份抄本交给外地的藏书处。'
            who: galen_rome
            bio: '盖伦的旧喜剧词语汇编在火灾中留有副本。他继续核订其中的引文，并把另一份交给外地读者查阅。'
        vignettes:
          list: '特尔提娅念了三个书名，就记下有三卷。你请她在桌上一本本摸到相应的卷，只摸到两卷。你们把第三个书名留着，在存卷一栏做了个空记。'
          borrow: '狄翁记得借出过一份，却想不起借给了谁。特尔提娅想趁清单还没送走，把书名划掉。你帮他想起交书的那扇门。她在清单里留了一处空位，等那条街传来回话。'
          survival: '你读过一部写这场损失的书，传本在很久以后才重新被认出来。狄翁只问，明天桌上能放哪本。你留着书目里的名字，把现有两卷指给他看。你走时，还没找到缺掉的那卷。'
text:
  en:
    name: Galen
    text: Greek physician from Pergamum, born in 129, who later practised in Rome. His many writings include works on anatomy and medicine and an account of his losses in the fire of 192.
  zh:
    name: 盖伦
    text: 来自佩加蒙的希腊医生，129年生，后来在罗马行医。他留下多部解剖学与医学著作，也写到自己在192年火灾中的损失。
hook: {en: 'The title survived. Did a copy survive too?', zh: '书名还在，书也还在吗？'}
facts:
  comedy_glossary_lost:
    date: '192'
    stay_day: 45
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [galen_192_critical_edition]
    text:
      en: 'Galen wrote that his glossary of words from Old Comedy was lost in the fire, while copies of the prose glossary had already reached Campania.'
      zh: '盖伦说，旧喜剧词语汇编在火灾中失去。散文词语汇编已有副本先送到坎帕尼亚。'
    line:
      en: '192: the fire destroys Galen’s glossary of words from Old Comedy.'
      zh: '192 年，盖伦的旧喜剧词语汇编在罗马火灾中损失。'
  fire:
    date: '192'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [galen_rome_fire]
    text:
      en: 'Galen describes losing writings, instruments and books in the fire and explains why some textual losses could not be replaced from nearby libraries.'
      zh: '盖伦叙述火灾中损失的著作、器物和藏书，以及为何有些书无法用附近藏本补回。'
