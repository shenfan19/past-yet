    text:
      en: 'The Arabic text of the Long Commentary on Aristotle’s Physics, dated 1186, is lost. Hebrew and Latin translations survive.'
      zh: '约 1186 年写成的亚里士多德《物理学》长篇注释没有阿拉伯文原本存世，仍有希伯来文及拉丁文译本。'
  reasoning:
    date: '1180'
