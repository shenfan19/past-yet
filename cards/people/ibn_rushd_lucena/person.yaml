    sources: [ibn_rushd_lucena_wiki, ibn_rushd_lucena_sep]
    text:
      en: 'A few years after the banishment Ibn Rushd returned to court in Marrakesh, where he died on 11 December 1198.'
      zh: '放逐几年后，伊本·鲁世德回到马拉喀什的朝中，1198 年 12 月 11 日在那里去世。'
