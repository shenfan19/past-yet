      en: 'The treatise discusses demonstration, other styles of inference and the premises needed for a syllogism. The approximate date describes the earlier work, not a Lucena composition.'
      zh: '书中论及论证、其他推理方式和三段论所需前提。所列约年指这部较早的著作。'
