    scene:
      star_rules: 2
      points:
        - {id: p2, kind: hold, day: 15, req: {"any":[{"trait":["scholarly","methodical"],"stat":{"wit":8,"will":7}},{"job":["archivist","translator","bookseller","proofreader","restorer"],"provides":"disguise","stat":{"wit":7}}]}}
        - {id: p1, kind: trust, day: 45, req: {"any":[{"trait":["kind","patient","calm","cosmopolitan","sensitive"],"stat":{"will":7}},{"provides":"calm","trait":["kind","patient","calm","cosmopolitan","sensitive"],"stat":{"will":5}},{"job":["courier","translator"],"stat":{"will":6}}]}}
