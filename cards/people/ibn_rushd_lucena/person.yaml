    text:
      en:
        name: 'Before the order to burn'
        place: "Córdoba"
        figure: "Ibn Rushd"
        story: 'Around 1195 Ibn Rushd fell out of favour with the Almohad court and was sent into exile at Lucena. Accounts record the condemnation and burning of books. The Arabic text of his Long Commentary on Aristotle’s Physics is lost, though translations survive in Hebrew and Latin.'
        relic: 'A reader’s practice extract'
        relic_desc: 'An invented extract with space added for a premise.'
        points:
          p1: 'Send word from Córdoba to Ibn Rushd in Lucena that one of his readers still wants to write to him and can take his reply'
          p2: 'Before the order comes, compare one section of the Arabic commentary on the Physics against its source and leave a second copy with a reader'
        points_fail:
          p1: 'The reader keeps the note in Córdoba. They will have to wait for another chance to send it.'
          p2: 'The additional copy stays unfinished. The reader has no separate Arabic pages to take away.'
        shift:
          p1:
            was: 'Ibn Rushd fell out of favour and was banished to Lucena before returning to court.'
            now: 'In this branch a reader’s note reaches him in Lucena. He can reply while they still have a way to send the letter back.'
          p2:
            was: 'The Arabic text of Ibn Rushd’s Long Commentary on the Physics is lost. Its medieval translations survive.'
            now: 'In this branch one checked section stays in a reader’s hands through the condemnation. The reader can still compare it with another copy in the original Arabic.'
        vignettes:
          premise: 'Mariam has copied a conclusion in careful letters. Yusuf can follow it only by assuming something she has left unstated. You ask him where he stopped and leave space before the conclusion. Mariam writes her assumption in that space, where Yusuf can question it.'
          together: 'Yusuf wants to return the book and keep a single line for his own use. You give him time to copy the step that goes with it. At the door Mariam asks for the conclusion aloud, and he can now give her the reason as well.'
          language: 'You recognise a term that later readers will meet in another language. Mariam just wants to know whether she has copied the premise as it stands. You hold the page flat while she checks it. The question she writes beside it will go to a reader you will not meet.'
      zh:
        name: '焚书令之前'
        place: "科尔多瓦"
        figure: "伊本·鲁世德"
        story: '约 1195 年，伊本·鲁世德在穆瓦希德王朝失势，被放逐到卢塞纳。文献还记载了禁书与焚书。他为亚里士多德《物理学》写的长篇注释没有留下阿拉伯文原本，希伯来文和拉丁文译本仍存。'
        relic: '一页读书练习摘录'
        relic_desc: '摘录，为前提另留一处。'
        points:
          p1: '从科尔多瓦给卢塞纳的伊本·鲁世德捎个口信，告诉他还有读者想跟他通信，也愿意收他的回信'
          p2: '焚书令下来前，把《物理学》阿拉伯文长注的一节抄校清楚，另留一份给读者'
        points_fail:
          p1: '读者写好的便条还在科尔多瓦，只能等下一次有人捎过去。'
          p2: '副本还没抄完。离开时，读者没有可以带走的阿拉伯文抄页。'
        shift:
          p1:
            was: '伊本·鲁世德失势后被放逐到卢塞纳，后来获准回朝。'
            now: '这条分支里，一张读者写的便条到了卢塞纳。伊本·鲁世德可以趁还有人捎信时写封回信。'
          p2:
            was: '伊本·鲁世德的《物理学》长篇注释失去了阿拉伯文原本，保存下来的是中世纪译本。'
            now: '这条分支里，有一节对过的副本在禁书后仍留在读者手里。他再遇到别的抄本，还有阿拉伯文可以对照。'
        vignettes:
          premise: '玛丽娅姆把结论抄得很工整。优素福要读通，却得先替她猜一个没写出来的前提。你问他读到哪儿卡住，在结论前留出地方。玛丽娅姆把前提写进去，优素福终于能就它发问。'
          together: '优素福想把书还了，只给自己留一句。你给他留点时间，把旁边那一步也抄走。到了门口，玛丽娅姆请他复述结论，他如今也说得出理由。'
          language: '你认得一个后来会在译本里出现的术语。玛丽娅姆只想核对前提有没有照原样抄下。你帮她把纸铺平，陪她查。她在边上写的问题，会交给这趟见不到的人。'
text:
  en:
    name: Ibn Rushd
    text: Andalusian philosopher and physician, 1126 to 1198, known in Latin as Averroes. He wrote commentaries on Aristotle that were widely read in Europe, served as judge in Córdoba and Seville, and in 1195 was banished to Lucena and had his works ordered burned.
  zh:
    name: 伊本·鲁世德
    text: 安达卢斯的哲学家与医生，1126 年生，1198 年去世，拉丁名阿威罗伊。他为亚里士多德作的注释在欧洲广为流传，曾任科尔多瓦和塞维利亚的法官，1195 年被放逐到卢塞纳，著作被下令焚毁。
hook: {en: 'Which pages can the reader still keep?', zh: '这几页，有哪一页还能留给读者？'}
