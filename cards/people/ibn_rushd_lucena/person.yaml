quotes:
  ibn_rushd_lucena_story_echo_full:
    order: 1
    tier: full
    date: '1180'
    checked: official_record
    sources: [ibn_rushd_lucena_story_echo_source_full]
    original: ar
    text:
      en:
        who: 'Ibn Rushd'
        quote: 'For truth does not oppose truth. It agrees with it and bears witness to it.'
        occasion: 'From the Decisive Treatise, a separate work from the commentary. The date is approximate.'
      zh:
        who: '伊本·鲁世德'
        quote: '真理不会与真理相抵触。它与真理相合，也为它作证。'
        occasion: '引自与长注不同的著作《决定论》，所标为约略写作年份。'
      ar:
        who: 'Ibn Rushd'
        quote: 'فإن الحق لا يضاد الحق، بل يوافقه ويشهد له'
        occasion: 'From the Decisive Treatise, a separate work from the commentary. The date is approximate.'
      fr:
        who: 'Ibn Rushd'
        quote: 'Car la vérité ne s’oppose pas à la vérité. Il y souscrit et en témoigne.'
        occasion: 'Tiré du Traité décisif, ouvrage distinct du commentaire. La date est approximative.'
      es:
        who: 'Averroes'
        quote: 'Porque la verdad no se opone a la verdad. Está de acuerdo con ello y da testimonio de ello.'
        occasion: 'Del Tratado Decisivo, obra separada del comentario. La fecha es aproximada.'
      ja:
        who: 'イブン・ルシュド'
        quote: 'なぜなら、真実は真実に反対しないからです。それはそれに同意し、それを証言します。'
        occasion: '『決定論』より、注釈とは別の著作。日付はおおよそのものです。'
      ko:
        who: '이븐 루시드'
        quote: '진실은 진실에 반대하지 않기 때문입니다. 그것은 그것에 동의하고 그것을 증언합니다.'
        occasion: '결정적인 논문에서 논평과는 별도의 작업입니다. 날짜는 대략적인 것입니다.'
      ru:
        who: 'Ибн Рушд'
        quote: 'Ибо истина не противоречит истине. Он согласен с этим и свидетельствует об этом.'
        occasion: 'Из «Решающего трактата», отдельного от комментария произведения. Дата приблизительная.'
      zh-Hant:
        who: '伊本·魯世德'
        quote: '真理不會與真理相牴觸。它與真理相合，也為它作證。'
        occasion: '引自與長注不同的著作《決定論》，所標為約略寫作年份。'
  ibn_rushd_lucena_story_echo_none:
    order: 2
    tier: none
    date: '1180'
    checked: official_record
    sources: [ibn_rushd_lucena_story_echo_source_none]
    original: ar
    text:
      en:
        who: 'Ibn Rushd'
        quote: 'to examine existing things by reason and seek to know them by it'
        occasion: 'From the opening argument of the Decisive Treatise. The date is approximate.'
      zh:
        who: '伊本·鲁世德'
        quote: '以理性考察存在之物，并借此求得认识。'
        occasion: '《决定论》开篇论述中的一句，日期为约略写作年份。'
      ar:
        who: 'Ibn Rushd'
        quote: 'اعتبار الموجودات بالعقل وتطلب معرفتها به'
        occasion: 'From the opening argument of the Decisive Treatise. The date is approximate.'
      fr:
        who: 'Ibn Rushd'
        quote: 'examiner les choses existantes par la raison et chercher à les connaître par elle'
        occasion: 'Extrait de l’argumentation d’ouverture du Traité décisif. La date est approximative.'
      es:
        who: 'Averroes'
        quote: 'Examinar las cosas existentes por la razón y tratar de conocerlas por ella.'
        occasion: 'Del argumento inicial del Tratado Decisivo. La fecha es aproximada.'
      ja:
        who: 'イブン・ルシュド'
        quote: '既存のものを理性によって調べ、それによって知ろうとすること'
        occasion: '決定論文の冒頭議論より。日付はおおよそのものです。'
      ko:
        who: '이븐 루시드'
        quote: '존재하는 사물을 이성적으로 조사하고 이를 통해 알려고 노력하다'
        occasion: '결정적인 논문의 첫 번째 주장에서. 날짜는 대략적인 것입니다.'
      ru:
        who: 'Ибн Рушд'
        quote: 'исследовать существующие вещи разумом и стремиться познать их с его помощью'
        occasion: 'Из вступительного аргумента Решающего трактата. Дата приблизительная.'
      zh-Hant:
        who: '伊本·魯世德'
        quote: '以理性考察存在之物，並藉此求得認識。'
        occasion: '《決定論》開篇論述中的一句，日期為約略寫作年份。'
