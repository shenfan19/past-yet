    text:
      en:
        name: One law for the apple and the Moon
        place: Cambridge
        figure: Isaac Newton
        story: Newton's Principia appeared in London in 1687. In the third book he brings the Moon and falling bodies under the same account of gravity. The fair copy that went to the press was not in his hand. It was written out by Humphrey Newton, his amanuensis in these years and no relation. Much later, William Stukeley wrote down Newton's recollection of a falling apple prompting a question about gravity. Stukeley says nothing about a blow to the head.
        story_prose:
          opening:
            - 'The Cambridge copy table is covered in papers for London. Humphrey Newton has just written out the name of a figure when Isaac Newton finds another correction for it on a proof. A messenger knocks.'
            - 'The Principia appeared in London in 1687. Edmond Halley saw it through the press and wrote on 5 July to say it was finished. In this branch you can check the last corrections and give readers a place to log an amendment that Newton can trace to its page.'
            - 'Send a traveller who can check page and proposition numbers against the packet. After publication, a good organiser of correspondence can agree with Newton how changes should be recorded.'
          points:
            p1: 'Two slips correct the same figure. One has no book number. You and Humphrey lay both beside the proof and have Newton read out the version he wants kept. The messenger repeats the address as you sort the sheets by book and hand them across. The messenger takes the packet and a discarded heading stays behind on the table.'
            p2: 'The first reader’s letter marks a number without naming the page. You pass Newton the printed copy and ask whether the figure number will help readers identify it. Once he finds the proposition, he asks you to put the letter’s date in the book and leave him a space to enter his decision. The clerk finds the same figure when the next letter arrives.'
          outcomes:
            all: 'Halley writes that the book is finished. In Cambridge, the first column of the correction book is filled in. The next person who borrows the book can see how to leave a correction.'
            p1: 'Halley receives the last set and the book appears in its historical form. Later changes still accumulate in letters and on copies.'
            p2: 'The correction book can lead a reader from the proposition to its page. The packet for London has gone wrong and this visit preserves the method of recording corrections.'
          none: 'Two slips lie across each other on the table. The next reader can see what changed twice without being able to tell which slip came first.'
          not_admitted: 'The messenger says he must take the packet from the copyist. From outside you hear two similar sheets being turned over.'
          desync: 'Halley never receives one of the final corrections. The publication falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'The messenger takes the packet and a discarded heading stays behind on the table.'
            p2: 'The clerk finds the same figure when the next letter arrives.'
        relic: A glass prism
        relic_desc: A triangle of glass that splits white light into colours.
        points:
          p1: 'Pack Newton’s last corrections by volume and page and get them from Cambridge to Halley before the London press finishes'
          p2: 'When the first edition arrives, agree with Newton how readers can submit corrections he can verify by proposition and page'
        points_fail:
          p1: 'Two versions of a correction go out. Halley cannot assemble the last errata, and the office recalls the employee.'
          p2: 'Correspondents use their own references. Early corrections remain scattered between letters and Newton’s copy.'
        shift:
          p1:
            was: 'On July 5, 1687, Halley wrote that the Principia was finished and that the last errata had arrived in time.'
          p2:
            was: 'Newton annotated his own first edition. Preparing a revised edition took years.'
            now: 'The college keeps a corrections book indexed by proposition. Readers can record a problem and see which changes Newton later approved and when.'
            who: newton_cambridge
            bio: 'Newton wrote the Principia in Cambridge and Halley saw it through the press in London. Newton kept revising the work after printing.'
        vignettes:
          apple: '“Did an apple hit him on the head?” you ask a college servant, a man made up for the game. He goes on sweeping. “I could not say. You tell me why the Moon does not come down.” You have no answer ready, and go back to the page. The apple is not written down by anyone for another sixty-five years.'
          hand: 'The fair copy is not in the hand of the man whose name will be on the book. The servant says the one who writes it out is Mr Humphrey, a Newton too and no relation. You note it down and do not disturb him.'
          diagram: 'On a spoiled sheet you draw the way the Moon would go if nothing held it, and then an arrow for the pull that bends its path. The servant, who cannot read the Latin, looks at the arrow for some time.'
      zh:
        name: 苹果与月亮服从同一条定律
        place: 剑桥
        figure: 艾萨克·牛顿
        story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。送去付印的誊清稿不是他的笔迹，抄写的人是汉弗莱·牛顿，这几年做他的抄写助手，与他不是亲戚。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
        story_prose:
          opening:
            - '剑桥的抄写桌堆着发往伦敦的纸。汉弗莱·牛顿刚抄清一个图名，艾萨克·牛顿从另一张样页找出同一处错字。外面的信使已经敲门。'
            - '史实里，《自然哲学的数学原理》于 1687 年在伦敦刊行。经办印刷的哈雷在 7 月 5 日报信说已印完。这里可以把最后一批勘误送齐，首版到手之后，还能让读者给一个能查回原页的更正地址。'
            - '会读页码或命题的人先看打包稿。适合整理往来信的人可以跟牛顿约定核读和记下更正的办法。'
          points:
            p1: '两张改动说的是同一个图，其中一张少了卷号。你和汉弗莱把两份并好，请牛顿读回最后想保留的写法。信使重复了一遍地址，勘误单按卷号从桌这头送到他手里。他收下纸束，桌上只剩改过标题的旧页。'
            p2: '第一封读者来信圈了一个数，却没说在哪一页。你把样书递给牛顿，问图编号能不能用作第二个标记。他找回命题后，在更正簿上让你先写来信日期，批准与否留给他自己填。下一封信到时，书记照着这个位置找到了同一幅图。'
          outcomes:
            all: '哈雷写信说书已经印完。剑桥这边的簿子刚写完第一栏，下一位读者来借书时还能看见怎么留更正。'
            p1: '最后一批勘误送到哈雷手里，书按史实印出，后来的改动仍散在样书和信件里。'
            p2: '更正簿能按命题找到页，但发去伦敦的勘误另出差错。回程保留了登记办法。'
          none: '桌上两张勘误仍互相重叠。后来有人看到不同的改字，已经分不清哪张先写。'
          not_admitted: '信使说包件要从抄写人手里收。你在门外听见有人把两张相似的纸翻得哗哗响。'
          desync: '哈雷少收到一份最终勘误。刊行的文本已与史实错开，事务所召回员工。'
          excerpts:
            p1: '他收下纸束，桌上只剩改过标题的旧页。'
            p2: '下一封信到时，书记照着这个位置找到了同一幅图。'
        relic: 一块玻璃三棱镜
        relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
        points:
          p1: '把牛顿最后一批勘误按卷和页打包，从剑桥及时发给伦敦的哈雷'
          p2: '首版送达后，和牛顿约定如何收录读者的更正，让他能在剑桥按命题和页码核验答复'
        points_fail:
          p1: '同一处改字邮寄了两个版本，哈雷收不齐末批勘误，事务所因同步失败召回员工。'
          p2: '读者信各用各的页码，较早的改动散落在信和自己的样书里。'
        shift:
          p1:
            was: '1687 年 7 月 5 日，哈雷来信说《原理》已经印完，末批勘误及时赶上。'
          p2:
            was: '牛顿在自己的首版留下注记。后来修订再版仍是长期工作。'
            now: '学院里有一份按命题编号的更正簿。借书的人可以填下所见的错误，得到牛顿同意的修改会连日期另记。'
            who: newton_cambridge
            bio: '《原理》在剑桥写成，在伦敦付印。哈雷经办印刷，书出以后牛顿仍修改它。'
        vignettes:
          apple: '你问学院的一位杂役：「听说苹果砸了他的头？」这位杂役是游戏里编出来的。他接着扫地：「砸没砸我不知道。你倒说说，月亮怎么不掉下来？」你一时答不上，回头去看那一页。苹果这件事，要再过六十五年才有人写下来。'
          hand: '誊清的稿子不是书上署名那个人的笔迹。杂役说，抄写的是汉弗莱先生，也姓牛顿，不是亲戚。你把这一条记在本子上，没有去打扰他。'
          diagram: '你在一张废纸上画出月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。杂役不认得拉丁文，盯着那支箭头看了好一阵。'
text:
  en:
    name: Isaac Newton
    text: English mathematician and physicist, 1643 to 1727, of Cambridge. His Principia of 1687 set out the laws of motion and universal gravitation. He also worked on optics and developed calculus, and later led the Royal Mint.
  zh:
    name: 艾萨克·牛顿
    text: 英国数学家与物理学家，1643 年生，1727 年去世，剑桥人。1687 年的《原理》陈述了运动定律和万有引力定律。他还研究光学并发展了微积分，后来主管皇家铸币厂。
quotes:
  newton_cambridge_story_echo_full:
    order: 1
    tier: full
    date: '1687-07-05'
    checked: official_record
    sources: [newton_cambridge_story_echo_source_full]
    original: en
    contextual: true
    text:
      en:
        who: 'Edmond Halley'
        quote: 'I have at length brought your book to an end, and hope it will please you.'
        occasion: 'Halley announces the completed printing in a letter sent from London.'
      zh:
        who: '埃德蒙·哈雷'
        quote: '我总算把您的书印完了，希望您满意。'
        occasion: '哈雷从伦敦写信，告知书已印完。'
      zh-Hant:
        who: '埃德蒙·哈雷'
        quote: '我總算把您的書印完了，希望您滿意。'
        occasion: '哈雷從倫敦寫信，告知書已印完。'
      fr:
        who: 'Edmond Halley'
        quote: 'J''ai enfin terminé votre livre, et j''espère qu''il vous plaira.'
        occasion: 'Halley annonce l''impression terminée dans une lettre envoyée de Londres.'
      es:
        who: 'Edmond Halley'
        quote: 'Por fin he terminado su libro y espero que sea de su agrado.'
        occasion: 'Halley anuncia la impresión completa en una carta enviada desde Londres.'
      ja:
        who: 'エドモンド・ハレー'
        quote: 'ついにあなたの本を読み終えることになりました。あなたが満足してくれることを願っています。'
        occasion: 'ハレーはロンドンから送った手紙で印刷の完了を発表した。'
      ko:
        who: '에드먼드 핼리'
        quote: '나는 마침내 당신의 책을 끝냈고 그것이 당신을 기쁘게 해주기를 바랍니다.'
        occasion: 'Halley는 런던에서 보낸 편지를 통해 인쇄가 완료되었음을 알립니다.'
      ru:
        who: 'Эдмонд Хэлли'
        quote: 'Я наконец довел вашу книгу до конца и надеюсь, что она вам понравится.'
        occasion: 'Галлей сообщает о завершении печати в письме, отправленном из Лондона.'
  newton_cambridge_story_echo_none:
    order: 2
    tier: none
    date: '1687'
    checked: official_record
    sources: [newton_cambridge_story_echo_source_none]
    original: la
    text:
      en:
        who: 'Isaac Newton'
        quote: 'and the actions of the bodies attracting and attracted are always mutual and equal'
        occasion: 'The Principia describes mutual attraction in the opening of its section on bodies that pull on one another.'
      zh:
        who: '艾萨克·牛顿'
        quote: '施加引力和受到引力的物体，彼此的作用总是相互且相等。'
        occasion: '《原理》第一卷讲相互牵引的物体，在该节开头谈彼此的作用。'
      la:
        who: 'Isaac Newton'
        quote: 'corporum trahentium & attractorum actiones semper mutuæ sunt & æquales'
        occasion: 'The Principia describes mutual attraction in the opening of its section on bodies that pull on one another.'
      zh-Hant:
        who: '艾薩克·牛頓'
        quote: '施加引力和受到引力的物體，彼此的作用總是相互且相等。'
        occasion: '《原理》第一卷講相互牽引的物體，在該節開頭談彼此的作用。'
      fr:
        who: 'Isaac Newton'
        quote: 'et les actions des corps attirants et attirés sont toujours mutuelles et égales'
        occasion: 'Les Principia décrivent l''attraction mutuelle dès l''ouverture de sa section sur des corps qui se tirent les uns sur les autres.'
      es:
        who: 'Isaac Newton'
        quote: 'y las acciones de los cuerpos que se atraen y atraen son siempre mutuas e iguales.'
        occasion: 'Los Principia describen la atracción mutua al comienzo de su sección sobre los cuerpos que se atraen entre sí.'
      ja:
        who: 'アイザック・ニュートン'
        quote: 'そして、物体が引き付けたり引き付けられたりする行為は、常に相互的で平等です。'
        occasion: '『プリンキピア』は、互いに引き寄せ合う物体に関するセクションの冒頭で、相互の引力について説明しています。'
      ko:
        who: '아이작 뉴턴'
        quote: '끌어당기고 끌리는 신체의 행동은 항상 상호적이고 평등합니다.'
        occasion: '프린키피아(Principia)는 서로 끌어당기는 물체에 대한 섹션을 열면서 상호 매력을 설명합니다.'
      ru:
        who: 'Исаак Ньютон'
        quote: 'а действия тел притягивающих и притягиваемых всегда взаимны и равны'
        occasion: 'В «Началах» взаимное притяжение описывается в начале раздела, посвященного телам, притягивающим друг друга.'
  newton:
    order: 1
    text:
      en: {who: Isaac Newton, quote: "If I have seen further, it is by standing on the shoulders of giants."}
      zh: {who: 牛顿, quote: "如果说我看得更远，那是因为我站在巨人的肩膀上。"}
hook: {en: Why does the apple fall and the Moon stay up?, zh: 苹果落地，月亮为何还在天上}
facts:
  principia:
    date: '1687'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [newton_principia_1687]
    text:
      en: The 1687 London first edition sets out Newton's account of gravity in Book III.
      zh: 1687 年伦敦初版《原理》第三卷论述引力。
  apple_recollection:
    date: '1752'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [newton_stukeley_ms142]
    note: The date belongs to the memoir. This entry establishes what Stukeley wrote, not what happened in the orchard.
    text:
      en: Stukeley's memoir records Newton recalling a falling apple and wondering why it fell towards the ground. It records no strike to the head.
      zh: 斯图克利的回忆录记下牛顿说自己见苹果落下，便想它为何总朝地面落。书里没写苹果砸到头。
  amanuensis:
    date: '1687'
    checked: two_sources
    level: usable
    use: [story]
    sources: [newton_humphrey_letters, hall_newton_1992]
    note: The employee does not take his place and does not speak with him. His two letters of 1728 hold more about the habits of Newton in these years, which are to be read in full before any of it is used.
    text:
      en: Humphrey Newton, no relation, is the amanuensis of Isaac Newton from about 1683 to 1689, and writes out the Principia by his order before it goes to the press.
      zh: 汉弗莱·牛顿与牛顿不是亲戚，约 1683 年到 1689 年做他的抄写助手，奉命在付印前把《原理》誊抄一遍。
  seven_years:
    date: '1687'
    checked: single
    level: usable
    use: []
    sources: []
    note: "Seen in one account only, where scholars at Cambridge are said to have remarked that they might need seven years to understand the book. Not used until the letter itself has been read."
    text:
      en: Scholars at Cambridge remark that they may need seven years to understand the book.
      zh: 剑桥的学者说，这本书他们也许要读七年才懂。
