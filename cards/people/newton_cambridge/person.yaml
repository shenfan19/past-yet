    text:
      en:
        name: One law for the apple and the Moon
        place: Cambridge
        figure: Isaac Newton
        story: Newton's Principia appeared in London in 1687. In the third book he brings the Moon and falling bodies under the same account of gravity. Much later, William Stukeley wrote down Newton's recollection of a falling apple prompting a question about gravity. Stukeley says nothing about a blow to the head.
        relic: A glass prism
        relic_desc: A triangle of glass that splits white light into colours.
        points:
          p1: "Trace the Moon's deflection on the copyist's diagram"
          p2: "Use the translation chip to ask the copyist about a disputed label"
          p3: "Finish checking the diagram before the copyist takes it away"
        vignettes:
          apple: '“Did the apple hit him on the head?” you ask. The copyist puts down his pen and holds out a scrap of paper. “Suppose it did. Would that tell you what keeps the Moon up?” You draw a second line beside your first.'
          margin: 'You ask the copyist to show which sentence supports the label in the margin. He stops packing the sheet long enough for you to mark the two passages separately.'
          diagram: 'The copyist lends you a blunt pencil. You draw the direction the Moon would travel if left alone, then add an arrow for the pull that bends its path.'
      zh:
        name: 苹果与月亮服从同一条定律
        place: 剑桥
        figure: 艾萨克·牛顿
        story: 牛顿的《自然哲学的数学原理》于 1687 年在伦敦出版。第三卷用引力解释月球的运动与地面物体的下落。多年后，斯图克利记录了牛顿的回忆，苹果落下引出了一个关于引力的问题。这份回忆没有提到苹果砸在头上。
        relic: 一块玻璃三棱镜
        relic_desc: 一块三角的玻璃，能把白光分成各种颜色。
        points:
          p1: "沿着誊写员的图，找出月球轨迹偏转的方向"
          p2: "用翻译芯片向誊写员问清一处有疑问的标注"
          p3: "赶在誊写员收走图纸前核对完图上的线"
        vignettes:
          apple: '你开口就问：「听说苹果砸到了他的头？」誊写员放下笔，推来一张废纸。「就算砸了，这能解释月亮怎么一直在天上吗？」你在刚画的直线旁又添了一笔。'
          margin: '你请誊写员指出页边的标注依据哪句话。他把卷到一半的纸摊回来，等你把两段分别标清。'
          diagram: '誊写员借你一截钝铅笔。你先画下月球若不受力会走的方向，再添一支箭头，标出让它转弯的拉力。'
text:
  en:
    name: Isaac Newton
    text: English mathematician and physicist, 1643 to 1727, of Cambridge. His Principia of 1687 set out the laws of motion and universal gravitation. He also worked on optics and developed calculus, and later led the Royal Mint.
  zh:
    name: 艾萨克·牛顿
    text: 英国数学家与物理学家，1643 年生，1727 年去世，剑桥人。1687 年的《原理》陈述了运动定律和万有引力定律。他还研究光学并发展了微积分，后来主管皇家铸币厂。
quotes:
  newton:
    order: 1
    text:
      en: {who: Isaac Newton, quote: "If I have seen further, it is by standing on the shoulders of giants."}
      zh: {who: 牛顿, quote: "如果说我看得更远，那是因为我站在巨人的肩膀上。"}
hook: {en: Why does the apple fall and the Moon stay up?, zh: 苹果落地，月亮为何还在天上}
