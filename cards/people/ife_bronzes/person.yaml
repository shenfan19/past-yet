hook:
  en: 'Will the next crew find the trenches again?'
  zh: '下一队人还能找到探沟吗？'
facts:
  cast:
    date: '1300'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ife_bronzes_cast]
    text:
      en: 'The collection record dates the Wunmonije head to 1300–1450 and lists lost-wax casting, incision and painting; it does not date a particular pour or establish when every line was incised.'
      zh: '馆方把翁莫尼杰院落出土的这尊头像定在 1300—1450 年，记载了失蜡铸造、刻划和上色，但没有确定浇铸的日期，也没有判定每道线是在何时刻上的。'
  frobenius:
    date: '1910'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_exhibition_man]
    text:
      en: 'In 1910 Leo Frobenius tried to acquire a metal head at Ife. Accounts differ on how it was obtained; he was required to return it.'
      zh: '1910 年，莱奥·弗罗贝尼乌斯试图取得伊费的一尊金属头像。关于他如何得到头像，记述不一；后来他被要求交还。'
    line:
      en: '1910: Leo Frobenius is required to return a metal head he obtained at Ife.'
      zh: '1910 年，莱奥·弗罗贝尼乌斯被要求交还在伊费取得的一尊金属头像。'
  wunmonije:
    date: '1938-01'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_bronzes_cast]
    text:
      en: 'In 1938 a group of brass and copper heads was found by chance in the Wunmonije compound in Ife, during building work.'
      zh: '1938 年，伊费的翁莫尼杰院落在盖房时意外挖出一批黄铜与紫铜头像。'
    line:
      en: 'January 1938: digging foundations in the Wunmonije compound, builders turn up a group of heads.'
      zh: '1938 年 1 月，翁莫尼杰院落里挖地基的人，挖出了一批头像。'
  exhibition:
    date: '1948-07'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_exhibition_man]
    text:
      en: 'The British Museum exhibited the Ife castings from July to September 1948.'
      zh: '1948 年 7 月至 9 月，大英博物馆展出伊费铸像。'
    line:
      en: 'July 1948: the Ife castings go on display at the British Museum.'
      zh: '1948 年 7 月，伊费铸像在大英博物馆展出。'
  rescue_start:
    date: '1957-12-09'
    checked: 'official_record'
    level: 'usable'
    use:
    - 'story'
    - 'wiki'
    sources:
    - 'ife_ita_yemoo_reconstruction'
    - 'ife_ita_yemoo_field_report'
    text:
      en: 'Rescue excavations at Ita Yemoo in Ile-Ife began in December 1957.'
      zh: '1957 年 12 月，发掘人员在伊莱伊费的伊塔耶穆开始抢救性发掘。'
  field_plan_gap:
    date: '1958'
    stay_day: 26
    checked: 'official_record'
    level: 'usable'
    use:
    - 'story'
    - 'history'
    - 'wiki'
    sources:
    - 'ife_ita_yemoo_reconstruction'
    - 'ife_ita_yemoo_field_report'
    text:
      en: 'After most of the trenches were backfilled, later archaeologists had no comprehensive plan of the early excavations and had to reconstruct the layout.'
      zh: '多数探沟回填后，后来的考古队手头没有一张完整的早期现场图，需要重新拼出探沟分布。'
    line:
      en: 'After most of the trenches were backfilled, later archaeologists had no comprehensive plan of the early excavations and had to reconstruct the layout.'
