    scene:
      points:
        - {id: p1, kind: trust, day: 10, req: {"any":[{"stat":{"finesse":6}},{"trait":["handy","patient"]},{"job":["woodcarver"]}]}}
        - {id: p2, kind: endure, day: 60, req: {"any":[{"stat":{"constitution":6}},{"trait":["hardy","vigil"]}]}}
        - {id: p3, kind: notice, day: 61, req: {"any":[{"stat":{"wit":6}},{"trait":["methodical","curious"]}]}}
