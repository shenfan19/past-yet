    text:
      en:
        name: 'A plan before the trenches close'
        place: 'Ile-Ife, Nigeria'
        figure: 'The excavation team at Ita Yemoo'
        story: 'Rescue excavations at Ita Yemoo in Ile-Ife began in December 1957. The crews exposed ancient potsherd pavements. The first large pavement was later roofed over, but most trenches were backfilled. Later archaeologists had to piece together their positions from scattered sketches, notes and photographs.'
        relic: 'A trench plan with a baseline'
        relic_desc: 'The sheet ties the positions of several trenches to a fixed line by the road.'
        points:
          p1: 'Before the trenches are filled, tie them to a shared baseline and leave a plan in Ife that can be surveyed again'
        points_fail:
          p1: 'The trenches are filled in. As the ground changes, later teams can only use scattered records to find where each cut was made.'
        shift:
          p1:
            was: 'After most of the trenches were backfilled, later archaeologists had no comprehensive plan of the early excavations and had to reconstruct the layout.'
            now: 'A trench plan with fixed reference points stays in Ife. Later crews can use it to find the old trenches.'
        vignettes:
          work: '{staff} watches the tape wind back into the reel, a smear of earth between two of the numbers.'
        story_prose:
          opening:
          - 'Ile-Ife, December 1957. Near the road, people are kneeling in the dirt, brushing out the edge of a potsherd pavement. They stake the lip of the cut so no one will step in.'
          - 'A roof later sheltered the first large pavement. Most trenches were filled in. In history, the people who came back spent years piecing together positions from notebooks, drawings and photographs.'
          - 'The cuts are still open today. Someone who can survey them and check the measurements with the crew can tie them all to the same landmark.'
          points:
            p1: '{staff} and the crew run a tape to a fixed mark by the road and call out the distance to each corner. A worker dots the positions on the field drawing, then copies the same dots onto a sheet to stay in Ife.'
          outcomes:
            all: 'Long after the ground was filled in, a surveyor finds the mark by the road and follows the distance on the plan to an old trench corner. There is no trench left to see.'
            p1: 'Long after the ground was filled in, a surveyor finds the mark by the road and follows the distance on the plan to an old trench corner. There is no trench left to see.'
          none: 'Loose earth levels off the last corner. Two sketches lie one on top of the other with no common reference. The lines still will not meet.'
          not_admitted: '{staff} cannot enter with the crew. Someone behind the fence takes in the tape that was trailing in the dirt.'
          excerpts:
            p1: '{staff} and the crew run a tape to a fixed mark by the road and call out the distance to each corner. A worker dots the positions on the field drawing, then copies the same dots onto a sheet to stay in Ife.'
      zh:
        name: '回填前的探沟图'
        place: '尼日利亚伊莱伊费'
        figure: '伊塔耶穆发掘队'
        story: '1957 年 12 月，发掘人员在伊莱伊费的伊塔耶穆开始抢救性发掘。他们清出古代陶片铺地。最早清出的大片铺地后来盖了棚，多数探沟则被回填。后来的考古队得从零散的草图、笔记和照片中重建探沟的分布。'
        relic: '一张带基准线的探沟图'
        relic_desc: '纸上把几条探沟的位置连到公路边的同一条基准线。'
        points:
          p1: '在开挖的边界被填平前，把探沟量到同一条基准线上，在伊费留下可以复测的图'
        points_fail:
          p1: '沟口照常回填。随着地表变化，后来的人只能用零散记录重找各条沟的位置。'
        shift:
          p1:
            was: '多数探沟回填后，后来的考古队手头没有一张完整的早期现场图，需要重新拼出探沟分布。'
            now: '伊费留有一份按固定参照点测出的探沟图。后来的人能按图重找到这些探沟。'
        vignettes:
          work: '{staff}看着尺带绕回盘里，泥土在数字二和三之间留了个印。'
        story_prose:
          opening:
          - '1957 年 12 月，伊莱伊费。公路边，几个人蹲在土里，把陶片铺地的边缘一点点刷出来。他们在沟沿下钉桩，免得人一脚踏进去。'
          - '最早清出的大片铺地后来有了棚子，多数探沟却要回填。史实里，重来这里的人花了不少时间，把笔记、草图和照片里的位置重新拼到一块。'
          - '开口还在地上。趁今天走得通，找个会测量并肯和发掘队一道复核的人，把每条沟接到同一处地标上。'
          points:
            p1: '{staff}和队员把长尺拉到公路边的固定标记，逐个报出沟角的距离。一个人先在现场图上点清，一转手又在留给伊费的那张纸上点了一遍。'
          outcomes:
            all: '回填很久以后，拿图的人在路边找回标记，沿着纸上的距离走到旧沟拐角。地上已经看不到沟了。'
            p1: '回填很久以后，拿图的人在路边找回标记，沿着纸上的距离走到旧沟拐角。地上已经看不到沟了。'
          none: '松土把最后一个沟角填平。两张没标相对位置的草图叠在一起，纸上的线还是对不上。'
          not_admitted: '{staff}没能跟发掘队进场。围栏内有人收走了垂在地上的长尺。'
          excerpts:
            p1: '{staff}和队员把长尺拉到公路边的固定标记，逐个报出沟角的距离。一个人先在现场图上点清，一转手又在留给伊费的那张纸上点了一遍。'
text:
  en:
    name: The casters of Ife
    text: The casters of the Yoruba city of Ife, in present-day Nigeria, produced naturalistic heads in brass and copper. The British Museum dates one Wunmonije head to 1300–1450; neither its maker nor the person depicted is known by name.
  zh:
    name: 伊费的铸造匠人
    text: 伊费是今尼日利亚境内的约鲁巴城市，当地铸匠留下了写实的黄铜和紫铜头像。大英博物馆将翁莫尼杰院落出土的其中一尊定在 1300—1450 年，铸匠和肖像原型的姓名不可考。
