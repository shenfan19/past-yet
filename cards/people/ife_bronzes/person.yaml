    text:
      en:
        name: 'The line that must survive the cast'
        place: Ife, Nigeria
        figure: The casters of Ife
        story: 'In Ife, a city of the Yoruba, casters made lifelike heads of copper alloy over some four centuries, around 1300 by most estimates. In 1910 the German Leo Frobenius pressed the priest of a grove to sell him a head he called the Olokun head, and had to give it back. In 1938 builders digging in the Wunmonije compound found a group of heads, among them the one now in the British Museum. At a London exhibition of 1948 the heads were said to rank with the finest works of Italy and Greece.'
        relic: 'Two study drawings'
        relic_desc: 'Drawings comparing lines on a plain casting sample.'
        points:
          p1: 'Be taken in by the casters, then shape a practice model in wax'
          p2: 'On the day of pouring, keep the fire under the crucible going'
          p3: 'After the pour, tell which line was cut in the wax and which was added after'
        vignettes:
          line: '{staff} lays the drawing made before the finishing beside the sample of today, and draws the new scratch on a separate sheet.'
          surface: '{staff} tilts the board under a sample so the light runs along it, and marks on paper where a fine line begins.'
          edge: '{staff} draws a plain practice sample once, and next to it the one line seen only today, so the next comparison does not rest on memory.'
      zh:
        name: '铸好以后还能不能认出这道线'
        place: 尼日利亚伊费
        figure: 伊费的铸造匠人
        story: '约鲁巴人的城市伊费，铸匠们在约四个世纪里用铜合金铸出写实的头像，多数估计在 1300 年前后。1910 年，德国人莱奥·弗罗贝尼乌斯逼一处圣林的祭司把一尊他称作“奥洛昆头像”的铜像卖给他，后来被迫交还。1938 年，人们在翁莫尼杰院落盖房挖地时挖出一批头像，其中一尊今藏大英博物馆。1948 年伦敦的一场展览上，有人说这些头像足以与意大利和希腊最好的作品并列。'
        relic: '一对线样小图'
        relic_desc: '对照无像练习铸样上两次所见的线。'
        points:
          p1: '先让铸匠们认下，再用蜡捏一个练习模'
          p2: '浇铸那天，守着坩埚底下的火不让它弱下去'
          p3: '浇铸之后，分辨哪道线是蜡模上刻的，哪道是后来添的'
        vignettes:
          line: '{staff}把收面之前画的小图摆到今天的样块旁边，后来多出的那一道划痕，另画在一张纸上。'
          surface: '{staff}把垫样块的木板略斜一斜，让光顺着它走，在纸上标出一道细线从哪里开始。'
          edge: '{staff}描了一遍没有图像的练习样块，旁边另记下今天才看见的那一道线，下回比对就不用全靠记性。'
text:
  en:
    name: The casters of Ife
    text: The casters of Ife, a city of the Yoruba in what is now Nigeria. Over some four centuries, around 1300 by most estimates, they made lifelike heads in copper alloy.
  zh:
    name: 伊费的铸造匠人
    text: 伊费的铸造匠人。伊费是约鲁巴人的城市，在今尼日利亚境内。在约四个世纪里，多数估计在 1300 年前后，他们做出了写实的铜合金头像。
hook: {en: 'Which mark belongs to the wax model?', zh: '这道线是草样上刻的，还是后来留下的？'}
facts:
  cast:
    date: '1300'
    stay_day: 61
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_bronzes_cast]
    text:
      en: 'The museum record identifies the brass head from Wunmonije and records lost-wax casting and incision.'
      zh: '馆方确认该黄铜头像出自翁莫尼杰院落，记录有失蜡铸造和刻划。'
    line:
      en: 'In the casting yard, a head is cast in brass from a wax model, and its lines are cut in after.'
      zh: '铸场里，一尊头像从蜡模铸成黄铜，脸上的细线是铸成之后再刻上去的。'
  frobenius:
    date: '1910'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [natgeo_ife_heads, wikipedia_ife_head]
    text:
      en: 'In 1910 Leo Frobenius pressed the priest of a grove to sell him a head he named the Olokun head, reportedly for six pounds, and had to return it after the British administration stepped in.'
      zh: '1910 年，莱奥·弗罗贝尼乌斯逼一处圣林的祭司把一尊他称作“奥洛昆头像”的铜像卖给他，据说只给了六英镑；英国殖民当局介入后，他被迫交还。'
    line:
      en: '1910: the German Leo Frobenius presses a priest to sell him a head from a sacred grove, and is made to give it back.'
      zh: '1910 年，德国人莱奥·弗罗贝尼乌斯逼一位祭司卖给他一尊圣林里的头像，后来被迫交还。'
  wunmonije:
    date: '1938'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_ife_head, natgeo_ife_heads]
    text:
      en: 'In 1938 a group of brass and copper heads was found by chance in the Wunmonije compound in Ife, during building work.'
      zh: '1938 年，伊费的翁莫尼杰院落在盖房时意外挖出一批黄铜与紫铜头像。'
    line:
      en: '1938: digging foundations in the Wunmonije compound, builders turn up a group of heads.'
      zh: '1938 年，翁莫尼杰院落里挖地基的人，挖出了一批头像。'
  exhibition:
    date: '1948'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [natgeo_ife_heads, wikipedia_ife_head]
    text:
      en: 'Of an exhibition of the heads at the British Museum in 1948, a London publication wrote that this African art was worthy to rank with the finest works of Italy and Greece.'
      zh: '1948 年这些头像在大英博物馆展出，伦敦一份刊物写道，这些非洲艺术足以与意大利和希腊最好的作品并列。'
    line:
      en: '1948: the heads are shown at the British Museum. A London paper writes that they rank with the finest works of Italy and Greece.'
      zh: '1948 年，头像在大英博物馆展出。伦敦一份刊物写道，它们足以与意大利和希腊最好的作品并列。'
