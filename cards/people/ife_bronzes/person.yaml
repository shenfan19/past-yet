    text:
      en:
        name: 'The line that must survive the cast'
        place: Ife, Nigeria
        figure: The casters of Ife
        story: 'A brass head from the Yoruba city of Ife still holds traces of red and black pigment on its beaded headdress. The head was made by lost-wax casting. It was one of a group found in January 1938 when builders broke ground at the Wunmonije compound. Several of the Ife castings were shown together at the British Museum in 1948.'
        relic: 'Two study drawings'
        relic_desc: 'Drawings comparing lines on a plain casting sample.'
        points:
          p1: 'Be taken in by the casters, then shape a practice model in wax'
          p2: 'On the day of pouring, keep the fire under the crucible going'
          p3: 'After the pour, tell which line was cut in the wax and which was added after'
        vignettes:
          line: '{staff} lays the drawing made before the finishing beside the sample of today, and draws the new scratch on a separate sheet.'
          surface: '{staff} tilts the board under a sample so the light runs along it, and marks on paper where a fine line begins.'
          edge: '{staff} draws a plain practice sample once, and next to it the one line seen only today, so the next comparison does not rest on memory.'
      zh:
        name: '铸好以后还能不能认出这道线'
        place: 尼日利亚伊费
        figure: 伊费的铸造匠人
        story: '约鲁巴城市伊费出土的一尊黄铜头像，珠饰头冠上还留着红色和黑色的颜料。这尊头像用失蜡法铸成。1938 年 1 月，翁莫尼杰院落里开挖房屋地基，人们从土里挖出它和一批其他头像。1948 年，多件伊费铸像在大英博物馆一同展出。'
        relic: '一对线样小图'
        relic_desc: '对照无像练习铸样上两次所见的线。'
        points:
          p1: '先让铸匠们认下，再用蜡捏一个练习模'
          p2: '浇铸那天，守着坩埚底下的火不让它弱下去'
          p3: '浇铸之后，分辨哪道线是蜡模上刻的，哪道是后来添的'
        vignettes:
          line: '{staff}把收面之前画的小图摆到今天的样块旁边，后来多出的那一道划痕，另画在一张纸上。'
          surface: '{staff}把垫样块的木板略斜一斜，让光顺着它走，在纸上标出一道细线从哪里开始。'
          edge: '{staff}描了一遍没有图像的练习样块，旁边另记下今天才看见的那一道线，下回比对就不用全靠记性。'
text:
  en:
    name: The casters of Ife
    text: The casters of the Yoruba city of Ife, in present-day Nigeria, produced naturalistic heads in brass and copper. The British Museum dates one Wunmonije head to 1300–1450; neither its maker nor the person depicted is known by name.
  zh:
    name: 伊费的铸造匠人
    text: 伊费是今尼日利亚境内的约鲁巴城市，当地铸匠留下了写实的黄铜和紫铜头像。大英博物馆将翁莫尼杰院落出土的其中一尊定在 1300—1450 年，铸匠和肖像原型的姓名不可考。
hook: {en: 'Which mark belongs to the wax model?', zh: '这道线是草样上刻的，还是后来留下的？'}
facts:
  cast:
    date: '1300'
    stay_day: 61
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [ife_bronzes_cast]
    text:
      en: 'The collection record dates the Wunmonije head to 1300–1450 and lists lost-wax casting, incision and painting; it does not date a particular pour or establish when every line was incised.'
      zh: '馆方把翁莫尼杰院落出土的这尊头像定在 1300—1450 年，记载了失蜡铸造、刻划和上色，但没有确定浇铸的日期，也没有判定每道线是在何时刻上的。'
  frobenius:
    date: '1910'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_exhibition_man]
    text:
      en: 'In 1910 Leo Frobenius tried to acquire a metal head at Ife. Accounts differ on how it was obtained; he was required to return it.'
      zh: '1910 年，莱奥·弗罗贝尼乌斯试图取得伊费的一尊金属头像。关于他如何得到头像，记述不一；后来他被要求交还。'
    line:
      en: '1910: Leo Frobenius is required to return a metal head he obtained at Ife.'
      zh: '1910 年，莱奥·弗罗贝尼乌斯被要求交还在伊费取得的一尊金属头像。'
  wunmonije:
    date: '1938-01'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_bronzes_cast]
    text:
      en: 'In 1938 a group of brass and copper heads was found by chance in the Wunmonije compound in Ife, during building work.'
      zh: '1938 年，伊费的翁莫尼杰院落在盖房时意外挖出一批黄铜与紫铜头像。'
    line:
      en: 'January 1938: digging foundations in the Wunmonije compound, builders turn up a group of heads.'
      zh: '1938 年 1 月，翁莫尼杰院落里挖地基的人，挖出了一批头像。'
  exhibition:
    date: '1948-07'
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [ife_exhibition_man]
    text:
      en: 'The British Museum exhibited the Ife castings from July to September 1948.'
      zh: '1948 年 7 月至 9 月，大英博物馆展出伊费铸像。'
    line:
      en: 'July 1948: the Ife castings go on display at the British Museum.'
      zh: '1948 年 7 月，伊费铸像在大英博物馆展出。'
