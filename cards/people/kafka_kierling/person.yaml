    text:
      en:
        name: "Proofs in the sanatorium"
        place: "Kierling"
        figure: "Franz Kafka"
        story: 'The 1924 edition of A Hunger Artist contains four stories, including Josephine the Singer, or the Mouse Folk.'
        relic: "A page of proofs"
        relic_desc: "A galley proof with small corrections in pencil."
        points:
          p1: 'Keep Kafka''s place each time illness interrupts the proofing and protect the stories he was correcting'
          p2: 'Share errands and correspondence among helpers so the people staying in Kierling have time to rest'
          p3: 'Ease the pain in his throat, so that in his last weeks he can still swallow water and a few mouthfuls of soft food'
          p4: 'Have the Berlin publisher bind an advance copy and send it to Kierling so Kafka can see his four stories together'
        points_fail:
          p1: 'The proofs go back to Berlin without his final corrections. The branch loses sync and the office recalls the employee.'
          p2: 'The same people are left to keep watch, answer letters and run errands, with no break while waiting for replies.'
          p3: 'The pain in his throat still kept him from eating. In this branch he spent his last weeks speaking through notes and could hardly swallow.'
          p4: 'Kafka never sees the book. The publisher sends it out only after his death.'
        shift:
          p1:
            was: 'In May 1924 Kafka continued correcting proofs for A Hunger Artist while ill in Kierling.'
          p2:
            was: 'In May 1924 a friend came to Kierling to help care for the seriously ill Kafka and relieve some of the work his partner had been doing.'
            now: '{staff} gives the helpers turns taking letters, sending pages and keeping company. When one of them arrives, the person keeping watch can step outside.'
          p3:
            was: 'In the spring of 1924 tuberculosis reached Kafka''s larynx. Swallowing was so painful that he could hardly eat or sleep, and his doctor injected the laryngeal nerve every eight to ten days against the pain. He died at Kierling on 3 June.'
            now: '{staff} helped the doctor time the pain relief before meals. In his last weeks he could drink water and take a few mouthfuls of soft food, and suffered somewhat less than in history.'
          p4:
            was: 'Kafka died on 3 June 1924. The collection A Hunger Artist was published that August.'
            now: '{staff} gets Berlin to bind a single copy of the corrected sheets and send it ahead. Kafka turns through it in Kierling and recognizes the four stories and the order he chose.'
            who: kafka_kierling
            bio: 'Kafka saw a copy bound from the final proofs before he died. The printed edition kept the selection and order he approved.'
        vignettes:
          sound: 'The messenger reads the singer''s title aloud and asks why anyone would doubt what they hear. You have them read the same line to two listeners. The answers differ before you say a word.'
          mark: 'A proof mark sits between two lines. You ask the messenger which line they would change if all they had was this page. They move the mark before it can be taken the wrong way.'
          packet: 'You straighten the loose sheets while the messenger checks the contents. The last story goes in its own fold, with the page number showing.'
      zh:
        name: "疗养院里的校样"
        place: "基尔灵"
        figure: "弗朗茨·卡夫卡"
        story: '卡夫卡 1924 年的《饥饿艺术家》收四篇小说，包括《女歌手约瑟芬，或鼠族》。'
        relic: "一页校样"
        relic_desc: "一页印刷校样，上面有铅笔改的小字。"
        points:
          p1: '病中校稿一中断就给他留下接续的位置，护住卡夫卡最后校过的故事集'
          p2: '把跑腿与通信交接给轮换的帮手，给守在基尔灵的人留出一段歇息时间'
          p3: '减轻他喉头的痛，让他在最后几个星期还咽得下水和几口软食'
          p4: '让柏林出版人先装订一本寄到基尔灵，让卡夫卡生前看到自己选定的四篇小说合在一起'
        points_fail:
          p1: '校样寄回柏林时缺了作者最后一轮批改，印本失去这次校订。行程与史实脱节，员工被召回。'
          p2: '照料者仍同时守病房、收信和跑腿，连等回信的空当都抽不开身。'
          p3: '喉头的痛照旧让他吃不下东西，这条分支里他最后几个星期仍靠纸条说话，几乎咽不下一口。'
          p4: '作者来不及看到书，出版者在他去世后才把它交给读者。'
        shift:
          p1:
            was: '1924 年 5 月，卡夫卡在基尔灵养病时仍在校订《饥饿艺术家》的校样。'
          p2:
            was: '1924 年 5 月，有朋友前往基尔灵协助照料已经病重的卡夫卡，分担伴侣原先承担的工作。'
            now: '{staff}把送印、送信和陪伴所需的人手分时安排，帮手到时，原来守着的人可以出门走一会儿。'
          p3:
            was: '1924 年春，结核侵入卡夫卡的喉头，吞咽剧痛，吃不下也睡不好，医生每隔八到十天给喉上神经注射一次止痛；6 月 3 日他在基尔灵去世。'
            now: '{staff}帮医生把止痛排在饭前，他在最后几个星期还喝得下水、吃得下几口软食，比历史上少受了些苦。'
          p4:
            was: '1924 年 6 月 3 日卡夫卡去世，同年 8 月《饥饿艺术家》故事集出版。'
            now: '{staff}请柏林先把已经改完的印张装成一本随邮寄回。卡夫卡在基尔灵翻过它，认得出自己定的四篇和次序。'
            who: kafka_kierling
            bio: '卡夫卡生前看到一册按最后校样装订的故事集。正式出版时出版社保留了他选定的篇目和次序。'
        vignettes:
          sound: '送稿人念出女歌手的篇名，问听见了还有什么可怀疑。你让他把同一句念给两个人听。你还没说话，两人的回答已经不一样。'
          mark: '校样上一处记号落在两行之间。你问送稿人，如果手头只有这张纸，他会改哪行。他先把记号移准，免得带回去被人改错。'
          packet: '送稿人查目录时，你理平散页。最后一篇另折进去，页码露在外面。'
text:
  en:
    name: Franz Kafka
    text: Writer of Prague who wrote in German, 1883 to 1924. He worked in an insurance office and left most of his work unpublished, asking a friend to burn it. Max Brod published The Trial and The Castle. He died of tuberculosis in a sanatorium at Kierling.
  zh:
    name: 弗朗茨·卡夫卡
    text: 用德语写作的布拉格作家，1883 年生，1924 年去世。他在保险公司工作，大部分作品没有发表，并请朋友烧掉。马克斯·布罗德出版了《审判》和《城堡》。他在基尔林的疗养院死于肺结核。
