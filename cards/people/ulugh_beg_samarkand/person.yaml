    scene:
      star_rules: 2
      points:
        - {id: p1, kind: hold, day: 52, overturns: [death], req: {"any":[{"trait":["bold","hardy"],"stat":{"constitution":7,"will":7}},{"trait":["streetwise","wanderer"],"provides":"disguise","stat":{"will":5}}]}}
