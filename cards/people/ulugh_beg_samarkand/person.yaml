    text:
      en:
        name: 'The road out of Samarkand'
        place: Samarkand
        figure: Ulugh Beg
        story: 'Ulugh Beg built an observatory at Samarkand and oversaw a catalogue of 1,018 stars. In autumn 1449 he lost power and was given leave to travel to Mecca. He was killed near Samarkand in late October. The date on his tomb is 27 October, two days after the date given by another source.'
        story_prose:
          opening:
            - 'In Samarkand a bundle for the road lies beside the newly stacked star tables. Ulugh Beg has yielded power and the party is waiting outside. Someone asks where they mean to spend the first night out of the city.'
            - 'Ulugh Beg took part in astronomical work at Samarkand. In 1449 he was killed after leaving the city. Here you can check where he would stay on the first leg and ask whether he wants company.'
            - 'Send someone who can speak with the party and look after a traveller. Ask Ulugh Beg where he wishes to stop, then check that the household can receive him.'
          points:
            p1: 'Ulugh Beg says someone has already called for the baggage and he does not know where he will be able to sit that night. You tell a companion that a household farther on can leave its door open, then ask Ulugh Beg if he wants to go with you. He leaves the star tables in someone’s care and takes a light bag. On arrival he asks the person who brought him there to sit down too.'
          outcomes:
            all: 'Ulugh Beg reaches a place to stay after leaving the city. In this branch there is news that he is safe that night.'
            p1: 'Someone accompanies him to the place he agreed to stay. The star tables remain in the city.'
          none: 'He leaves with the people already waiting for the baggage. The next news is that he was killed outside the city.'
          not_admitted: 'The visitor is not admitted to the party. The tables remain inside and the people outside are leaving with the baggage.'
          excerpts:
            p1: 'On arrival he asks the person who brought him there to sit down too.'
        relic: 'A slip with two sources'
        relic_desc: 'Two marked rows for an older star position and a new observation.'
        points:
          p1: 'After Ulugh Beg gives up power, arrange somewhere for him to stay on the first leg of his journey and offer to go with him'
        points_fail:
          p1: 'He leaves with the company already waiting for him. The next news you hear is that he was killed near the city.'
        shift:
          p1:
            was: 'After giving up his rule, Ulugh Beg set out from Samarkand and was killed near the city in late October 1449.'
            now: 'In this branch {staff} goes with Ulugh Beg to a place he has agreed to stay. He survives the journey out of Samarkand.'
            who: ulugh_beg_samarkand
            bio: 'In this timeline Ulugh Beg came safely away from Samarkand in the autumn of 1449 and lived on.'
        vignettes:
          source: '{staff} adds a narrow column headed origin to the copyist''s sheet, so that a position taken from the old table and one measured tonight do not sit on the same line.'
          arc: '{staff} lays a cord along the curve of the trench for the arc and walks it end to end with the masons, to see that the curve is true.'
          hold: '{staff} sits by the arc with a brazier and a board, and writes down a reading each time it is called, until the star sinks below the wall.'
      zh:
        name: '出撒马尔罕的那条路'
        place: 撒马尔罕
        figure: 兀鲁伯
        story: '兀鲁伯在撒马尔罕修建天文台，主持编成收有 1018 颗星的星表。1449 年秋他失去权位，获准前往麦加。十月下旬，他在撒马尔罕附近遇害。墓碑所载的卒日是 10 月 27 日，另有文献记早两天。'
        story_prose:
          opening:
            - '撒马尔罕，刚收好的星表旁压着要带出城的东西。兀鲁伯已经交出权位，外面等着上路的人。有人问，出了城今晚准备在哪里停。'
            - '兀鲁伯曾在撒马尔罕主持天文观测。他在 1449 年离城后遇害。这条分支可以替他问清第一处落脚地方，让他自己决定是否有人陪着。'
            - '找会与同行人商量、能照顾旅途的人。先问兀鲁伯愿在哪里停，再和能接待他们的人核实。'
          points:
            p1: '兀鲁伯说有人已经去催行李，不知今晚能否有地方坐下。你向出来送他的同行人说了前头愿留门的一家，再请兀鲁伯自己答应是否同去。他把没带走的星表交给在场的人，拣了只轻包跟上。到留门那处，他先请替他带路的人也坐一坐。'
          outcomes:
            all: '兀鲁伯到得了出城后的第一处住处。这条分支留有他那晚平安的消息。'
            p1: '按他同意的安排，有人陪他走到落脚处。星表仍留在城里。'
          none: '他跟着原先等行李的人出了城。再传回来的，是他在城外遇害的消息。'
          not_admitted: '来客没获准跟着出门。星表留在屋里，门外的人已带着行李离开。'
          excerpts:
            p1: '到留门那处，他先请替他带路的人也坐一坐。'
        relic: '一张星表来源签'
        relic_desc: '一行记旧表星位，一行留给新的观测。'
        points:
          p1: '兀鲁伯交出权位后，替他商量出城以后的第一个落脚处，陪他走一段路'
        points_fail:
          p1: '他跟等着出发的一行人离开。再听到他的消息时，他已经在城外遇害了。'
        shift:
          p1:
            was: '兀鲁伯交出权位后离开撒马尔罕，于 1449 年十月下旬在城外遇害。'
            now: '这条分支里，{staff}陪兀鲁伯到了事先商量好的落脚处。他平安度过了离开撒马尔罕的这段路。'
            who: ulugh_beg_samarkand
            bio: '这条时间线里，兀鲁伯在 1449 年秋平安离开撒马尔罕，活了下来。'
        vignettes:
          source: '{staff}在抄写人的纸上添了窄窄一栏“来历”，旧表取来的位置和今夜量到的位置就不会挤在同一行里。'
          arc: '{staff}顺着子午弧的沟槽拉了一根绳，和石匠们从这头走到那头，看弧线正不正。'
          hold: '{staff}守着一只火盆，坐在子午弧边，膝上搁一块木板，读数报一个记一个，直到那颗星沉到墙后。'
text:
  en:
    name: Ulugh Beg
    text: Timurid ruler and astronomer, 1394 to 1449. At Samarkand he built a large observatory and produced a star catalogue of high accuracy. He was killed near Samarkand in late October 1449.
  zh:
    name: 兀鲁伯
    text: 帖木儿王朝的统治者与天文学家，1394 年生，1449 年去世。他在撒马尔罕建起大型天文台，编出精度很高的星表。1449 年十月下旬，他在撒马尔罕附近遇害。
hook: {en: 'He has been told to leave the city.', zh: '他被遣出城去。'}
facts:
  observatory:
    date: '1428'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [stantrips_observatory, st_andrews_ulugh_beg]
    text:
      en: 'The observatory was built in the 1420s, between 1424 and 1429 by one account; its building is believed to have begun in 1428. Its great meridian arc was used to measure the heights of the stars.'
      zh: '天文台建于 1420 年代，一说在 1424 年至 1429 年间，一般认为 1428 年动工。台中的大子午弧用来测量星体的高度。'
    line:
      en: '1428: outside Samarkand, the building of Ulugh Beg''s observatory begins, with a great arc cut into the hill.'
      zh: '1428 年，撒马尔罕城外，兀鲁伯的天文台动工，一道巨大的弧沿山体开凿下去。'
  catalogue:
    date: '1437'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ulugh_beg_samarkand_catalogue, ulugh_beg_samarkand_observatory]
    text:
      en: 'The tables prepared at Samarkand include a catalogue of 1018 stars. Most positions were measured anew; some were adopted from older work, among them al-Sufi''s.'
      zh: '撒马尔罕编成的天文表收有 1018 颗星，多数位置重新测定，一部分取自前人的星表，其中包括苏菲的星表。'
    line:
      en: 'About 1437: the star catalogue of Samarkand is finished, 1018 stars, most of them measured anew.'
      zh: '1437 年前后，撒马尔罕的星表编成，收星 1018 颗，多数是重新测定的。'
  fall:
    date: '1449'
    stay_day: 48
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [ulugh_beg_samarkand_wiki, ulugh_beg_samarkand_vangent]
    text:
      en: 'In 1449, as power in the realm changed hands, Ulugh Beg withdrew to Samarkand, gave up his rule and was released to travel away from the city.'
      zh: '1449 年政局生变，兀鲁伯退回撒马尔罕，交出权位，获释离城远行。'
    line:
      en: 'Samarkand: Ulugh Beg gives up his rule and is told to leave the city.'
      zh: '撒马尔罕，兀鲁伯交出权位，被遣离城。'
  death:
    date: '1449-10'
    stay_day: 56
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [st_andrews_ulugh_beg, ulugh_beg_samarkand_vangent]
    text:
      en: 'Ulugh Beg was killed on the road in late October 1449. His tomb gives the 27th and other accounts give the 25th.'
      zh: '1449 年十月下旬，兀鲁伯在途中遇害。墓碑记 27 日，另有文献记 25 日。'
    line:
      en: 'Late October 1449: Ulugh Beg is killed on the road near Samarkand.'
      zh: '1449 年十月下旬，兀鲁伯在撒马尔罕附近遇害。'
  rediscovered:
    date: '1908'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [stantrips_observatory, st_andrews_ulugh_beg]
    text:
      en: 'The site of the observatory was found again by Russian archaeologists in 1908.'
      zh: '天文台遗址在 1908 年被俄国考古学家重新发现。'
    line:
      en: '1908: Russian archaeologists find the arc again under the hill.'
      zh: '1908 年，俄国考古学家在山下重新找到了那道弧。'
