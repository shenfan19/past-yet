text:
  en:
    name: Ulugh Beg
    text: Timurid ruler and astronomer, 1394 to 1449. At Samarkand he built a large observatory and produced a star catalogue of high accuracy. He was killed by order of his own son.
  zh:
    name: 兀鲁伯
    text: 帖木儿王朝的统治者与天文学家，1394 年生，1449 年去世。他在撒马尔罕建起大型天文台，编出精度很高的星表。他被亲生儿子下令杀死。
