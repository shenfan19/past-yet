    scene:
      points:
        - {id: p1, kind: notice, req: {"stat":{"wit":7}}}
        - {id: p2, kind: hold, req: {"job":["mechanic","carpenter"]}}
        - {id: p3, kind: endure, req: {"stat":{"will":6}}}
      vignettes:
        - {id: source, traits: [methodical, scholarly]}
