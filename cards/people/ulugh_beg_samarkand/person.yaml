    # finished: in the game with release.ready_only
    ready: true
    refs: [ulugh_beg_samarkand_observatory, ulugh_beg_samarkand_catalogue, st_andrews_ulugh_beg, stantrips_observatory]
    scene:
      points:
        - {id: p1, kind: trust, day: 12, req: {"any":[{"job":["mechanic","carpenter","builder"]},{"trait":["handy","hardy","cheerful"]},{"stat":{"constitution":6}}]}}
        - {id: p2, kind: notice, day: 80, req: {"any":[{"trait":["methodical","scholarly","curious"]},{"stat":{"wit":7}}]}}
        - {id: p3, kind: endure, day: 150, req: {"any":[{"trait":["vigil","patient","hardy"]},{"stat":{"will":6}}]}}
      vignettes:
        - {id: source, traits: [methodical, scholarly], day: 90}
        - {id: arc, traits: [curious, handy], day: 40}
        - {id: hold, day: 120}
    text:
      en:
        name: 'The source column in a star table'
        place: Samarkand
        figure: Ulugh Beg
        story: 'The observatory of Ulugh Beg at Samarkand, with its great meridian arc, was built in the 1420s; its building is believed to have begun in 1428. The tables made there include a catalogue of 1018 stars, most measured anew and some taken from older work. Ulugh Beg died in Samarkand on 27 October 1449. The site of the observatory was found again by Russian archaeologists in 1908.'
        relic: 'A slip with two sources'
        relic_desc: 'Two marked rows for an older star position and a new observation.'
        points:
          p1: 'Be taken in by the masons, then carry bricks for the wall of the great arc'
          p2: 'Write a star''s old position and tonight''s measured one on two separate rows'
          p3: 'On a winter night, keep watch by the arc and write down the readings'
        vignettes:
          source: '{staff} adds a narrow column headed origin to the copyist''s sheet, so that a position taken from the old table and one measured tonight do not sit on the same line.'
          arc: '{staff} lays a cord along the curve of the trench for the arc and walks it end to end with the masons, to see that the curve is true.'
          hold: '{staff} sits by the arc with a brazier and a board, and writes down a reading each time it is called, until the star sinks below the wall.'
      zh:
        name: '星表边上的一栏来源'
        place: 撒马尔罕
        figure: 兀鲁伯
        story: '兀鲁伯在撒马尔罕的天文台建于 1420 年代，台中有巨大的子午弧，一般认为 1428 年动工。那里编成的天文表收有 1018 颗星，多数位置重新测定，一部分取自前人的星表。兀鲁伯于 1449 年 10 月 27 日在撒马尔罕去世。天文台遗址在 1908 年被俄国考古学家重新发现。'
        relic: '一张星表来源签'
        relic_desc: '一行记旧表星位，一行留给新的观测。'
        points:
          p1: '先让石匠们认下，再替他们搬砌大子午弧墙的砖'
          p2: '把一颗星的旧位置和今夜测得的位置分两行记'
          p3: '冬夜守在子午弧边，把读数一一记下'
        vignettes:
          source: '{staff}在抄写人的纸上添了窄窄一栏“来历”，旧表取来的位置和今夜量到的位置就不会挤在同一行里。'
          arc: '{staff}顺着子午弧的沟槽拉了一根绳，和石匠们从这头走到那头，看弧线正不正。'
          hold: '{staff}守着一只火盆，坐在子午弧边，膝上搁一块木板，读数报一个记一个，直到那颗星沉到墙后。'
text:
  en:
    name: Ulugh Beg
    text: Timurid ruler and astronomer, 1394 to 1449. At Samarkand he built a large observatory and produced a star catalogue of high accuracy. He died in Samarkand on 27 October 1449.
  zh:
    name: 兀鲁伯
    text: 帖木儿王朝的统治者与天文学家，1394 年生，1449 年去世。他在撒马尔罕建起大型天文台，编出精度很高的星表。1449 年 10 月 27 日他在撒马尔罕去世。
hook: {en: 'Which reading came from this night?', zh: '哪一行是今夜亲自量的？'}
facts:
  observatory:
    date: '1428'
    stay_day: 5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [stantrips_observatory, st_andrews_ulugh_beg]
    text:
      en: 'The observatory was built in the 1420s, between 1424 and 1429 by one account; its building is believed to have begun in 1428. Its great meridian arc was used to measure the heights of the stars.'
      zh: '天文台建于 1420 年代，一说在 1424 年至 1429 年间，一般认为 1428 年动工。台中的大子午弧用来测量星体的高度。'
    line:
      en: '1428: outside Samarkand, the building of Ulugh Beg''s observatory begins, with a great arc cut into the hill.'
      zh: '1428 年，撒马尔罕城外，兀鲁伯的天文台动工，一道巨大的弧沿山体开凿下去。'
  catalogue:
    date: '1437'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [ulugh_beg_samarkand_catalogue, ulugh_beg_samarkand_observatory]
    text:
      en: 'The tables prepared at Samarkand include a catalogue of 1018 stars. Most positions were measured anew; some were adopted from older work, among them al-Sufi''s.'
      zh: '撒马尔罕编成的天文表收有 1018 颗星，多数位置重新测定，一部分取自前人的星表，其中包括苏菲的星表。'
    line:
      en: 'About 1437: the star catalogue of Samarkand is finished, 1018 stars, most of them measured anew.'
      zh: '1437 年前后，撒马尔罕的星表编成，收星 1018 颗，多数是重新测定的。'
  death:
    date: '1449-10-27'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [st_andrews_ulugh_beg, stantrips_observatory]
    text:
      en: 'Ulugh Beg died in Samarkand on 27 October 1449, aged 55.'
      zh: '兀鲁伯于 1449 年 10 月 27 日在撒马尔罕去世，终年 55 岁。'
    note: 'Death: written as a plain fact.'
    line:
      en: '27 October 1449: Ulugh Beg dies in Samarkand.'
      zh: '1449 年 10 月 27 日，兀鲁伯在撒马尔罕去世。'
  rediscovered:
    date: '1908'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [stantrips_observatory, st_andrews_ulugh_beg]
    text:
      en: 'The site of the observatory was found again by Russian archaeologists in 1908.'
      zh: '天文台遗址在 1908 年被俄国考古学家重新发现。'
    line:
      en: '1908: Russian archaeologists find the arc again under the hill.'
      zh: '1908 年，俄国考古学家在山下重新找到了那道弧。'
bystanders:
  copyist:
