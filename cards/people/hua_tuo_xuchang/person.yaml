        - {id: p2, kind: persuade, day: 151, overturns: [death], req: {"any":[{"job":["archivist","translator","proofreader"],"stat":{"wit":7,"will":8}},{"trait":["charismatic","methodical"],"stat":{"wit":8,"will":8}}]}}
