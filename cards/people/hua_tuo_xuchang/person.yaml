text:
  en:
    name: Hua Tuo
    text: Chinese physician at the end of the Han, about 140 to 208. He is recorded as using a herbal anaesthetic for surgery and teaching exercises modelled on animal movements. He was executed by the warlord Cao Cao.
  zh:
    name: 华佗
    text: 汉末医生，约 140 年生，208 年去世。史书记载他用草药麻醉做外科手术，并传授模仿动物动作的导引。他被曹操处死。
