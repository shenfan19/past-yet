    text:
      en:
        name: 'The book the account remembers'
        place: "Xuchang"
        figure: "Hua Tuo"
        story: 'The later Sanguozhi says that Hua Tuo was confined at Xu and recounts a failed attempt to pass on a book from prison.'
        story_prose:
          opening:
            - 'Xu, at the end of the Eastern Han. Chen Shou’s history records how Hua Tuo’s imprisonment ended, and mentions a volume that did not survive.'
            - 'In history, the keeper did not dare take the volume Hua Tuo offered him. It was burned. In this branch someone will ask whether a friend may claim it, and someone is considering a petition for clemency.'
            - 'Someone who understands how petitions and records pass from hand to hand can help. The book and the petition will each need someone willing to hear a separate request.'
          points:
            p2: '{staff} asks the person willing to carry the petition to wait, then checks the name and the case with him. After taking it, he calls them back and writes an acknowledgment on the duplicate. A few days later Hua Tuo walks out through the gate and sees the people waiting. Someone by the gate offers him an arm. He stands by himself a moment before taking it.'
            p1: 'The keeper starts to take Hua Tuo’s book, then draws his hand back. {staff} asks whose name can go down as the recipient, and brings someone from Hua Tuo’s household to sign. Only after the register is opened at a new page is the volume passed out. The recipient cannot find cloth to wrap it. He takes off his outer garment and spreads it across the table.'
          outcomes:
            all: 'When Hua Tuo comes home someone has left the wrapped book by the door for him. He recognises the corner of cloth used to tie it.'
            p2: 'People who know Hua Tuo accompany him out. Only after they are beyond the prison do they turn slowly at the first corner.'
            p1: 'The book stays with the person who took it. The cloth is still tied, with the spine pressing a line into the fold.'
          none: 'The keeper closes the register. The paper has begun to curl. The page for anyone claiming the book remains empty.'
          not_admitted: '{staff} never sees the clerk. Under the window, the desk does not move before the place closes.'
          excerpts:
            p2: 'Someone by the gate offers him an arm. He stands by himself a moment before taking it.'
            p1: 'The recipient cannot find cloth to wrap it. He takes off his outer garment and spreads it across the table.'
        relic: 'A copy of the practice register'
        relic_desc: 'An invented register leaf that distinguishes a report from a delivery.'
        points:
          p1: 'When the jailer is too afraid to take the book, keep it out of the fire'
          p2: 'Before the sentence is carried out, get a request for clemency back to someone who can reconsider it so Hua Tuo can leave the prison alive'
        points_fail:
          p1: 'The jailer feared the law and would not take it, and Hua Tuo burned the book. In this branch nothing of it is left.'
          p2: 'He was put to death in the prison at Xu, as in history. In this branch he never treated another patient.'
        shift:
          p1:
            was: 'Around 208, the Sanguozhi records that a jailer refused the book Hua Tuo offered him, and that Hua Tuo burned it.'
            now: 'The book left the prison in someone''s keeping, and was copied before it could be lost.'
          p2:
            was: 'Around 208, the Sanguozhi records that Hua Tuo was put to death although there had been a plea for clemency.'
            now: 'In this branch the plea is heard again, and the order is changed. Hua Tuo leaves the prison at Xu alive.'
            who: hua_tuo_xuchang
            bio: 'In this branch Hua Tuo is spared and leaves the prison at Xu alive.'
        vignettes:
          notice: 'Ajin heard there was a volume and has written it under items received. You ask her to touch the shelf where it would go. She moves the line to a report column, leaves the space on the shelf empty and keeps the source of the report beside it.'
          shift: 'Achang wants to close the book before calling the next keeper. You ask him to read the entries aloud one time. When he reaches the unwitnessed delivery, they agree to leave that line waiting. The next keeper can see what has yet to be confirmed.'
          later: 'You know a historian will tell a story about a book. Ajin wants to know if a real volume has come through this room. You show her where a confirmed delivery would be written. The page leaves her desk with that place still open.'
      zh:
        name: '史书提到的那一卷'
        place: "许昌"
        figure: "华佗"
        story: '晚出的《三国志》说华佗被关入许狱，并记他试图从狱中交出一卷书而未成。'
        story_prose:
          opening:
            - '东汉末年的许。陈寿的《三国志》记下华佗在狱中的结局，也记一卷没有流传下来的书。'
            - '史实里，狱吏不敢收华佗交来的书，书后来被烧去。在这条分支里，有人愿意问清书卷可不可以由亲友领取，也有人想试着递一份宽免请求。'
            - '这趟用得上熟悉文书来往的人，得能把领书和求宽免说成两件事，各自找到肯听完的人。'
          points:
            p2: '{staff}请肯转呈的人等一等，把请求里的姓名和案子逐项对清。他收下以后又叫人回来，把受理的字样写在副本上。几天后，华佗从门里出来，见到等他的人。 门边的人伸手想扶他。他先站了一会儿，才把手递过去。'
            p1: '狱吏一看是华佗的书，手伸出去又缩了回来。{staff}问清由谁具名受领，另请一位亲友到值房登记。簿子翻到新一页以后，那卷书才移到门外。 领书的人找不到合适的包布，便把外衣解下来铺在桌上。'
          outcomes:
            all: '华佗回去时，有人把包好的书放在门边等他。他认出用来打结的那一角衣布。'
            p2: '熟人陪华佗离开许狱，走到外面才慢慢转过第一个街角。'
            p1: '那卷书先留在领书的人家里。包布没有拆，书脊压下的一条折痕还在。'
          none: '值房的人收起登记簿。纸角已经卷起来了，本该写领书人的那页仍空着。'
          not_admitted: '{staff}没有见到经办人。窗下的桌子直到收工也没有挪动。'
          excerpts:
            p2: '门边的人伸手想扶他。他先站了一会儿，才把手递过去。'
            p1: '领书的人找不到合适的包布，便把外衣解下来铺在桌上。'
        relic: '一页练习登记簿的副本'
        relic_desc: '登记副页，区分传闻与实际交接。'
        points:
          p1: '狱吏畏法不敢收时，不让那卷书被烧掉'
          p2: '在判决执行前，让宽免的请求重新送到能复议的人手中，使华佗得以活着走出许狱'
        points_fail:
          p1: '狱吏畏法不收，华佗把书烧了，这条分支里那卷书一页也没留下。'
          p2: '他照史实死在许狱，这条分支里他再没给人看过病。'
        shift:
          p1:
            was: '约 208 年，《三国志》记华佗递出的书卷被狱吏拒收，后来由华佗烧去。'
            now: '那卷书有人收着带出了许狱，没散失之前已经抄了一份。'
          p2:
            was: '约 208 年，《三国志》记曾有人为华佗求情，华佗仍在许狱被处死。'
            now: '这条分支里，宽免的请求重新获准审议，判决改了。华佗活着走出许狱。'
            who: hua_tuo_xuchang
            bio: '这条分支里，华佗获宽免，活着走出许狱。'
        vignettes:
          notice: '阿瑾听说有一卷书，便写进已收物件。你请她指给你看书该搁在哪层。她把那一行移到传闻栏，架上仍留空，话是谁说的也记在旁边。'
          shift: '阿长想合上登记簿，再叫下一班来。你请他先把这几行念一遍。念到没人亲见的交接，两人商量把那一栏先挂着。接手人看得见还有哪一笔没核实。'
          later: '你知道后来史书会说起一卷书。阿瑾问，有没有真书从这屋交出去过。你指给她看若真有交接该记在哪儿。纸离开她的桌子时，那一栏仍空着。'
text:
  en:
    name: Hua Tuo
    text: Physician of the late Han. A later biography in the Sanguozhi describes his medical work, attributes the Five Animals exercise to him, and recounts his confinement and death under Cao Cao.
  zh:
    name: 华佗
    text: 汉末医生。《三国志》的后出传记叙述其行医经过，把五禽戏归于他，也记下他因曹操下令而被关押、遇害。
hook: {en: 'There is still a name for the lost book.', zh: '书已不在，名字还能怎么写？'}
