    text:
      en:
        name: 'The book the account remembers'
        place: "Xuchang"
        figure: "Hua Tuo"
        story: 'The later Sanguozhi says that Hua Tuo was confined at Xu and recounts a failed attempt to pass on a book from prison.'
        relic: 'A copy of the practice register'
        relic_desc: 'An invented register leaf that distinguishes a report from a delivery.'
        points:
          p1: 'When the jailer is too afraid to take the book, keep it out of the fire'
          p2: 'Before the sentence is carried out, get a request for clemency back to someone who can reconsider it so Hua Tuo can leave the prison alive'
        points_fail:
          p1: 'The jailer feared the law and would not take it, and Hua Tuo burned the book. In this branch nothing of it is left.'
          p2: 'He was put to death in the prison at Xu, as in history. In this branch he never treated another patient.'
        shift:
          p1:
            was: 'Around 208, the Sanguozhi records that a jailer refused the book Hua Tuo offered him, and that Hua Tuo burned it.'
            now: 'The book left the prison in someone''s keeping, and was copied before it could be lost.'
          p2:
            was: 'Around 208, the Sanguozhi records that Hua Tuo was put to death although there had been a plea for clemency.'
            now: 'In this branch the plea is heard again, and the order is changed. Hua Tuo leaves the prison at Xu alive.'
            who: hua_tuo_xuchang
            bio: 'In this branch Hua Tuo is spared and leaves the prison at Xu alive.'
        vignettes:
          notice: 'Ajin heard there was a volume and has written it under items received. You ask her to touch the shelf where it would go. She moves the line to a report column, leaves the space on the shelf empty and keeps the source of the report beside it.'
          shift: 'Achang wants to close the book before calling the next keeper. You ask him to read the entries aloud one time. When he reaches the unwitnessed delivery, they agree to leave that line waiting. The next keeper can see what has yet to be confirmed.'
          later: 'You know a historian will tell a story about a book. Ajin wants to know if a real volume has come through this room. You show her where a confirmed delivery would be written. The page leaves her desk with that place still open.'
      zh:
        name: '史书提到的那一卷'
        place: "许昌"
        figure: "华佗"
        story: '晚出的《三国志》说华佗被关入许狱，并记他试图从狱中交出一卷书而未成。'
        relic: '一页练习登记簿的副本'
        relic_desc: '登记副页，区分传闻与实际交接。'
        points:
          p1: '狱吏畏法不敢收时，不让那卷书被烧掉'
          p2: '在判决执行前，让宽免的请求重新送到能复议的人手中，使华佗得以活着走出许狱'
        points_fail:
          p1: '狱吏畏法不收，华佗把书烧了，这条分支里那卷书一页也没留下。'
          p2: '他照史实死在许狱，这条分支里他再没给人看过病。'
        shift:
          p1:
            was: '约 208 年，《三国志》记华佗递出的书卷被狱吏拒收，后来由华佗烧去。'
            now: '那卷书有人收着带出了许狱，没散失之前已经抄了一份。'
          p2:
            was: '约 208 年，《三国志》记曾有人为华佗求情，华佗仍在许狱被处死。'
            now: '这条分支里，宽免的请求重新获准审议，判决改了。华佗活着走出许狱。'
            who: hua_tuo_xuchang
            bio: '这条分支里，华佗获宽免，活着走出许狱。'
        vignettes:
          notice: '阿瑾听说有一卷书，便写进已收物件。你请她指给你看书该搁在哪层。她把那一行移到传闻栏，架上仍留空，话是谁说的也记在旁边。'
          shift: '阿长想合上登记簿，再叫下一班来。你请他先把这几行念一遍。念到没人亲见的交接，两人商量把那一栏先挂着。接手人看得见还有哪一笔没核实。'
          later: '你知道后来史书会说起一卷书。阿瑾问，有没有真书从这屋交出去过。你指给她看若真有交接该记在哪儿。纸离开她的桌子时，那一栏仍空着。'
text:
  en:
    name: Hua Tuo
    text: Physician of the late Han. A later biography in the Sanguozhi describes his medical work, attributes the Five Animals exercise to him, and recounts his confinement and death under Cao Cao.
  zh:
    name: 华佗
    text: 汉末医生。《三国志》的后出传记叙述其行医经过，把五禽戏归于他，也记下他因曹操下令而被关押、遇害。
hook: {en: 'There is still a name for the lost book.', zh: '书已不在，名字还能怎么写？'}
facts:
  manuscript_lost:
    date: '208'
    stay_day: 150
    checked: official_record
    level: usable
    use: [story, history, wiki]
    sources: [hua_tuo_xuchang_account]
    text:
      en: 'The later Sanguozhi says that the jailer refused the book Hua Tuo offered and Hua Tuo burned it. The account gives no exact date.'
      zh: '后出的《三国志》记狱吏没有接收华佗交出的书，华佗把书烧了。传记未写确切日期。'
    line:
      en: 'The Sanguozhi records that the jailer refuses the book. Hua Tuo burns it.'
      zh: '《三国志》记狱吏没有收下那卷书，华佗把书烧了。'
  death:
    date: '208'
    stay_day: 152
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [hua_tuo_xuchang_account]
    text:
      en: 'The Sanguozhi says that Hua Tuo died in custody at Xu after a request for clemency had been denied. The account gives no exact date.'
      zh: '《三国志》记为华佗求情未果，他在许狱遇害。传记未写确切日期。'
    line:
      en: 'The Sanguozhi records Hua Tuo’s death at Xu.'
      zh: '《三国志》记华佗在许狱遇害。'
  account:
    date: '208'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [hua_tuo_xuchang_account]
    text:
      en: 'The biography recounts confinement at Xu and a book offered to a prison official. It is a later narrative and supplies no exact date for the imagined scene.'
      zh: '传记叙述华佗被关进许狱，以及向狱吏交付一卷书的故事。文本成于事后。'
