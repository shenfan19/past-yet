    text:
      en:
        name: 'Five cycles in the margin'
        place: Chichen Itza, Mexico
        figure: The Maya scribes
        story: 'The Dresden Maya Codex preserves Venus tables on pages 24 and 46–50, reckoning a cycle as 584 days. The surviving manuscript is later than the game’s 900 setting. The scene imagines an earlier learner testing arithmetic of the kind preserved in the tables. The test numbers are not records of an actual observation.'
        relic: A painted bark strip
        relic_desc: A strip of bark paper with red and black glyphs.
        points:
          p1: 'Distinguish a count of cycles from a count of days'
          p2: 'Check the next line against five cycles of 584 days'
          p3: 'Leave the computed and observed columns with distinct labels'
        vignettes:
          count: 'The learner has copied five beside the days. You write five short marks in one column and 2,920 days in the other. He can see why the labels change what the numbers mean. You bring both home. Neither tells what the sky will look like through a clouded dawn.'
          dawn: 'You recognise the count from tables preserved in a later manuscript. The learner wants to enter the predicted day as a sighting. You ask him to wait until someone has seen the sky. One column now has a computed date and the other a blank. You miss the next clear dawn.'
          margin: 'You copy 584 once, then beside it you write what the number is counting. The learner repeats the label before taking the sheet back. You can reconstruct the exercise at home. A sighting of Venus is still waiting on the weather.'
      zh:
        name: '页边的五轮金星'
        place: 墨西哥奇琴伊察
        figure: 玛雅书吏们
        story: '《德累斯顿玛雅抄本》第 24 页及 46 至 50 页保存了金星表，以 584 日计一轮。存世抄本晚于卡里的 900 年。卡里虚构了更早的学算人验算这类表格的场景，算例不作真实观测。'
        relic: 一条彩绘树皮纸
        relic_desc: 一条树皮纸，上面有红黑的字符。
        points:
          p1: '区分周次与累计日数'
          p2: '按每轮 584 日验算五轮合计'
          p3: '分别标明推算栏与实测栏'
        vignettes:
          count: '学算人把五写到了日数那一栏。你在一栏画五道短划，在另一栏记累计 2920 日。他看得出两栏题头为何不能互换。你把两栏一同带回，至于隔着晨云还能看见什么，这些数答不出来。'
          dawn: '你认出这个日数，后来的抄本里还留着这样的表。学算人想把推出来的日子填进实测一栏。你请他等有人看过天再填。现在一栏有推算的日子，另一栏空着。下一回天晴破晓，你来不及等。'
          margin: '你抄下五百八十四，旁边补一句它数的是甚么。学算人把那个题头重念一遍才收纸。回去时你还能重算这道题。要真看到金星，仍得等天气。'
text:
  en:
    name: The Maya scribes
    text: The Maya scribes of the classic and later periods, who tracked the cycles of Venus, the moon and eclipses. The Dresden Codex contains a table of the 584 day cycle of Venus with only small error.
  zh:
    name: 玛雅书吏们
    text: 古典期及之后的玛雅书吏，他们追踪金星、月亮和日月食的周期。《德累斯顿抄本》里有金星 584 天周期的表，误差很小。
hook: {en: 'How do you label the day count in a Venus table?', zh: '金星表上，哪栏可以先填？'}
