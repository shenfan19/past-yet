    text:
      en:
        name: "Newton in French"
        place: "Lunéville"
        figure: "Émilie du Châtelet"
        story: 'In the summer of 1749 Émilie du Châtelet was at the court of Stanislas at Lunéville, waiting for a child and finishing her French translation of Newton''s Principia with its commentary. On 4 September she gave birth to a daughter. On 10 September she died, aged forty two; the cause is given as childbed fever by some and a pulmonary embolism by others. The same day the Royal Library in Paris signed a receipt for three packets of her commentary. The complete translation came out in 1759.'
        relic: "An inkwell"
        relic_desc: "A small inkwell from a desk worked at through the night."
        points:
          p1: 'In Lunéville, list the three packets of commentary before sending them with her request to the Royal Library'
          p2: 'Have her leave Clairaut decisions on the two hardest passages, identifying where her translation should stand and where a later revision should be listed separately'
          p3: 'Watch over her in the days after the birth, cure her, and keep her alive'
        points_fail:
          p1: 'The packet with the commentary stays behind. The Library receives only the letter, and the office recalls the employee.'
          p2: 'Two drafts reach the editor, but her decisions about how to print the revised passages do not.'
          p3: 'On 10 September she died in Lunéville, six days after her daughter was born.'
        shift:
          p1:
            was: 'On September 10, 1749, the Royal Library issued a receipt for three packets of Du Châtelet’s commentary on Newton.'
          p2:
            was: 'In 1759, after Du Châtelet’s death, the complete French edition appeared, with Clairaut having helped prepare it.'
            now: 'The editor has two decisions she approved and describes any later changes on another page. Readers can distinguish her commentary from editorial additions.'
          p3:
            was: 'On the night of 4 September 1749 Du Châtelet gave birth to a daughter, and on 10 September she died in Lunéville; the cause is given as childbed fever by some and as a pulmonary embolism by others.'
            now: 'She came through the days after the birth and recovered over the autumn. She saw her Newton translation into print herself and went on with her research for many years.'
            who: du_chatelet_luneville
            bio: 'Du Châtelet survived the birth of 1749, took her French Newton and its commentary to the printer herself, and kept writing and researching for years after.'
        vignettes:
          stairs: 'Early on 4 September {staff} helps a laundry girl carry a pile of clean cloths upstairs. The lamp up there was lit at midnight, she says; she counted the feet on the stairs, and by daybreak it was eleven trips.'
          candles: 'At the end of August {staff} helps the old servant who keeps the candles count the store. The lady marquise burns more candles than the king''s own study, he says, and this month he has to send in his account a week early.'
          arbour: 'In October {staff} helps a gardener take down the curtains of the arbour. The court has gone quiet early this autumn, he says; most years they would still be putting on plays out here.'
        story_prose:
          opening:
            - 'Lunéville, 1749. Du Châtelet is close to giving birth, and the manuscript of her translation of Newton''s Principia is still on her desk. She has put the Latin work into French and, in her own commentary, explained the derivations. French readers who open Newton later will read, alongside him, how she worked it out.'
            - 'In history, she died six days after her daughter was born. That day the Royal Library in Paris issued a receipt for three packets of commentary. The manuscript was saved, and ten years later the complete work came out; she never saw a single printed copy.'
            - 'Two kinds of people can help on this trip: someone who knows manuscripts can help with the translation, and someone who knows nursing and brings the right medicine and instruments can keep watch outside the lying-in room.'
          outcomes:
            all: 'That autumn Newton lay open again on the desk at Lunéville. The proofs came page by page, she read them page by page, and the margins carried her own hand.'
            p3: 'That autumn she came back to her desk. When the proofs arrived, the doubtful page did not have to be sent to anyone to ask; it lay spread at her elbow.'
            p2: 'Ten years later Clairaut unwrapped the manuscript, and the signed sheet was still tucked where it had been. Which lines to print as she had translated them, he settled place by place, by that sheet.'
            p1: 'On the receipt of the Royal Library were her name and the count of three packets. The day it was made out was 10 September.'
          none: 'In September at Lunéville the desk was cleared. The inkwell at its corner had not yet been capped.'
          desync: 'When it was time to hand over the manuscript, the commentary was still in the house. The deposit could not be carried through, and the office called {staff} back first. On leaving, the three packets were still tied up under the desk.'
          not_admitted: '{staff} never got as far as that desk. Through the window the papers could be seen stacked pile on pile, and the lamp stayed lit until very late.'
          points:
            p1: 'Before dispatch {staff} entered the three packets of commentary one by one and checked them again against the list. When the knot on the last packet was pulled tight, all that was left on the desk was her letter to the Royal Library, the ink already dry.'
            p2: 'The two drafts lay side by side, the changes crowded close. She touched the paper with the tip of her pen and went through them one place at a time, and {staff} wrote them down one place at a time on another sheet. When it was done she took the sheet, read it through, and signed her name in the lower right corner.'
            p3: 'A few days after the birth her condition turned sharply worse. {staff} opened the medical case brought along and kept watch at the bed, taking her temperature and giving the medicine by the clock, and kept a lamp burning all night. The sixth day after her daughter''s birth went by, and Du Châtelet was still alive. In autumn the printer sent the proofs. She turned to the page where the commentary was squeezed in against the text, drew the paper closer, picked up her pen, and drew a line under a misprinted row.'
          excerpts:
            p3: 'In autumn the printer sent the proofs. She turned to the page where the commentary was squeezed in against the text, drew the paper closer, picked up her pen, and drew a line under a misprinted row.'
            p2: 'She touched the paper with the tip of her pen and went through them one place at a time, and {staff} wrote them down one place at a time on another sheet. When it was done she took the sheet, read it through, and signed her name in the lower right corner.'
            p1: 'Before dispatch {staff} entered the three packets of commentary one by one and checked them again against the list. When the knot on the last packet was pulled tight, all that was left on the desk was her letter to the Royal Library, the ink already dry.'
      zh:
        name: "法语版牛顿"
        place: "吕内维尔"
        figure: "埃米莉·杜·夏特莱"
        story: '1749 年夏，埃米莉·杜·夏特莱住在吕内维尔斯坦尼斯瓦夫的宫廷里待产，手上是快要完成的牛顿《原理》法译和评注。9 月 4 日，她生下一个女儿。9 月 10 日，她去世，四十二岁，死因一说产褥热，一说肺栓塞。同一天，巴黎的王家图书馆为她寄存的三包评注稿签了收据。1759 年，法译全本出版。'
        story_prose:
          opening:
            - '1749 年，吕内维尔。杜·夏特莱快要生产了，桌上还有牛顿《原理》的译稿。她把这部拉丁文著作译成法文，还在自己的评注里解释推导。后来的法国读者翻开牛顿，会同时读到她是怎样算明白的。'
            - '史实里，她生下女儿六天后去世。那天，巴黎的王家图书馆给三包评注稿开了收据。稿子保住了，十年后出了全本，她连一本印好的书也没见到。'
            - '这一趟用得上两种人：懂文稿的人帮得上译稿，懂医护、带对了药械的人能守在产房外。'
          outcomes:
            all: '那年秋天，吕内维尔的书桌上又摊开了牛顿。校样一页页送来，她一页页看过，页边留着她自己的笔迹。'
            p3: '那年秋天，她回到书桌前。校样送来的时候，有疑问的那页不必托人转问，直接摊在她手边。'
            p2: '十年后，克莱罗拆开稿件，那张签了名的纸还夹在原处。哪几行照她的原译印，他照着纸上一处一处办。'
            p1: '王家图书馆的收据上，写着她的名字和三包稿子的件数。开出收据的那天，是 9 月 10 日。'
          none: '九月的吕内维尔，那张书桌收拾干净了。桌角那只墨水瓶还没盖上。'
          desync: '到了该交稿的时候，评注稿仍留在宅邸。寄存手续接不上，事务所先把{staff}召了回来。走的时候，三包稿子还捆在书桌底下。'
          not_admitted: '{staff}没能走到那张书桌旁。隔着窗能看见桌上的稿子一摞一摞堆着，灯一直亮到很晚。'
          points:
            p1: '发运前，{staff}把三包评注逐包登记，按清单又核了一遍。最后一包的绳结系紧时，桌上只剩她写给王家图书馆的那封信，墨迹已经干了。'
            p2: '两份草稿摊在一起，改动挨得很近。她用笔尖点着纸，一处一处说，{staff}一处一处记在另一张纸上。记完，她把那张纸拿过去看了一遍，在右下角签了自己的名字。'
            p3: '产后几天，她的情形急转直下。{staff}打开带来的药箱守在床边，按钟点量体温、喂药，夜里一直留着一盏灯。生下女儿后的第六天过去了，杜·夏特莱还活着。秋天，印坊把校样送来。她翻到正文挤着评注的那页，把纸往近处拉了拉，拿起笔，在印坏的一行下面画了一道。'
          excerpts:
            p3: '秋天，印坊把校样送来。她翻到正文挤着评注的那页，把纸往近处拉了拉，拿起笔，在印坏的一行下面画了一道。'
            p2: '她用笔尖点着纸，一处一处说，{staff}一处一处记在另一张纸上。记完，她把那张纸拿过去看了一遍，在右下角签了自己的名字。'
            p1: '发运前，{staff}把三包评注逐包登记，按清单又核了一遍。最后一包的绳结系紧时，桌上只剩她写给王家图书馆的那封信，墨迹已经干了。'
        relic: "一只墨水瓶"
        relic_desc: "一只小墨水瓶，来自一张通宵写字的书桌。"
        points:
          p1: '在吕内维尔把三包评注稿逐包登记，连同她写给王家图书馆的请求交运'
          p2: '请她把最难厘清的两项留给克莱罗，说明哪里要保留原译，哪里需另列后续校改'
          p3: '产后那几天守着她，治好她的病，让她活下来'
        points_fail:
          p1: '夹有评注的稿包留在宅邸，图书馆只收到信，事务所因同步失败召回员工。'
          p2: '两份相关草稿一起送达，改过的位置却没有留下她想怎样印的说明。'
          p3: '9 月 10 日，她在吕内维尔去世，离生下女儿只有六天。'
        shift:
          p1:
            was: '1749 年 9 月 10 日，王家图书馆为杜·夏特莱寄存的三包牛顿评注稿开出收据。'
          p2:
            was: '1759 年，法语全本出版，杜·夏特莱去世后由克莱罗参与整理。'
            now: '编辑手里有她核过的两份决定，后来附上的修改在另页说明。读者可以区分她的评注与编辑的补充。'
          p3:
            was: '1749 年 9 月 4 日夜里，杜·夏特莱生下一个女儿，9 月 10 日在吕内维尔去世，死因一说产褥热，一说肺栓塞。'
            now: '她熬过了产后那几天，秋天里身体慢慢复原。她亲自看着牛顿译本付印，此后又做了多年研究。'
            who: du_chatelet_luneville
            bio: '杜·夏特莱在 1749 年产后活了下来，亲自把牛顿《原理》的法译与评注送进印坊，此后继续写作与研究多年。'
        vignettes:
          stairs: 9 月 4 日一早，{staff}帮洗衣房的姑娘把一摞干净布巾送上楼。楼梯窄，两个人在转角把布巾一叠叠换手。姑娘说楼上半夜就点了灯，她躺着数脚步，到天亮已经跑了十一趟。
          candles: 八月底，{staff}帮宫里管蜡烛的老仆清点库房。拆开纸包，烛身上还粘着几根细碎的纸屑。老仆说侯爵夫人屋里的蜡烛比国王的书房还费，他这个月得提前一周报账。
          arbour: 十月，{staff}帮园丁取下凉亭的帘子，把沾了露水的一角往外折。园丁说，宫里今年安静得早，往年这时候还在这儿排戏。
      fr:
        name: 'Newton en français'
        place: 'Lunéville'
        figure: 'Émilie du Châtelet'
        story: 'À l’été 1749, Émilie du Châtelet attend un enfant à la cour de Stanislas, à Lunéville, et termine sa traduction commentée des Principia de Newton. Elle donne naissance à une fille le 4 septembre. Elle meurt le 10 septembre, à quarante-deux ans. Les sources évoquent une fièvre puerpérale ou une embolie pulmonaire. Le même jour, la Bibliothèque royale de Paris signe un reçu pour trois liasses de commentaires. La traduction complète paraît en 1759.'
        story_prose:
          opening:
            - 'Lunéville, 1749. Émilie du Châtelet est sur le point d’accoucher, et le manuscrit de sa traduction des Principia de Newton est encore sur son bureau. Elle a fait passer l’ouvrage latin en français et, dans son propre commentaire, elle explique les démonstrations. Les lecteurs français qui ouvriront Newton liront en même temps comment elle en est venue à bout.'
            - 'Dans l’histoire, elle meurt six jours après la naissance de sa fille. Ce jour-là, la Bibliothèque royale de Paris délivre un reçu pour trois liasses de commentaire. Le manuscrit est sauvé, l’ouvrage complet paraît dix ans plus tard, et elle n’en a jamais vu un seul exemplaire imprimé.'
            - 'Deux sortes de personnes peuvent servir dans ce voyage : quelqu’un qui connaît les manuscrits peut aider pour la traduction, et quelqu’un qui sait soigner, avec les bons remèdes et les bons instruments, peut veiller à la porte de la chambre de l’accouchée.'
          outcomes:
            all: 'Cet automne-là, Newton est de nouveau ouvert sur le bureau de Lunéville. Les épreuves arrivent page après page, elle les relit page après page, et les marges portent sa propre écriture.'
            p3: 'Cet automne-là, elle revient à son bureau. Quand les épreuves arrivent, la page douteuse n’a plus à faire le détour par quelqu’un d’autre : elle est étalée à portée de sa main.'
            p2: 'Dix ans plus tard, Clairaut défait le paquet du manuscrit, et la feuille signée est toujours glissée à sa place. Quelles lignes imprimer selon sa traduction, il le règle endroit par endroit, d’après cette feuille.'
            p1: 'Sur le reçu de la Bibliothèque royale figurent son nom et le nombre des liasses, trois. Le jour où il est délivré, c’est le 10 septembre.'
          none: 'En septembre, à Lunéville, le bureau a été rangé. L’encrier, au coin, n’a pas encore été rebouché.'
          desync: 'Quand vient le moment de remettre le manuscrit, le commentaire est encore dans la maison. Le dépôt ne peut pas se faire, et l’agence rappelle d’abord {staff}. Au départ, les trois liasses sont toujours ficelées sous le bureau.'
          not_admitted: '{staff} n’a jamais pu approcher de ce bureau. Par la fenêtre, on voit les papiers empilés liasse sur liasse, et la lampe reste allumée très tard.'
          points:
            p1: 'Avant l’envoi, {staff} inscrit les trois liasses de commentaire une à une et les vérifie encore une fois sur la liste. Quand le nœud de la dernière liasse est serré, il ne reste sur le bureau que sa lettre à la Bibliothèque royale, l’encre déjà sèche.'
            p2: 'Les deux brouillons sont posés côte à côte, les corrections serrées les unes contre les autres. Du bout de sa plume, elle touche le papier et les reprend une à une, et {staff} les note une à une sur une autre feuille. Quand c’est fini, elle prend la feuille, la relit, et signe de son nom dans le coin inférieur droit.'
            p3: 'Quelques jours après la naissance, son état se dégrade d’un coup. {staff} ouvre la trousse apportée et veille au chevet, prend sa température, donne les remèdes à l’heure, et garde une lampe allumée toute la nuit. Le sixième jour après la naissance de sa fille passe, et Émilie du Châtelet est toujours en vie. À l’automne, l’imprimeur envoie les épreuves. Elle tourne jusqu’à la page où le commentaire se serre contre le texte, rapproche la feuille, prend sa plume, et trace un trait sous une ligne mal imprimée.'
          excerpts:
            p3: 'À l’automne, l’imprimeur envoie les épreuves. Elle tourne jusqu’à la page où le commentaire se serre contre le texte, rapproche la feuille, prend sa plume, et trace un trait sous une ligne mal imprimée.'
            p2: 'Du bout de sa plume, elle touche le papier et les reprend une à une, et {staff} les note une à une sur une autre feuille. Quand c’est fini, elle prend la feuille, la relit, et signe de son nom dans le coin inférieur droit.'
            p1: 'Avant l’envoi, {staff} inscrit les trois liasses de commentaire une à une et les vérifie encore une fois sur la liste. Quand le nœud de la dernière liasse est serré, il ne reste sur le bureau que sa lettre à la Bibliothèque royale, l’encre déjà sèche.'
        relic: 'Un encrier'
        relic_desc: 'Un petit encrier qui a servi à écrire toute la nuit.'
        points:
          p1: 'inventorier les trois liasses et les envoyer avec la lettre à la Bibliothèque royale'
          p2: 'consigner pour Clairaut les choix de traduction des deux passages les plus difficiles'
          p3: 'veiller sur Émilie après la naissance et l’aider à survivre'
        points_fail:
          p1: 'La liasse reste sur place. La bibliothèque ne reçoit que la lettre et l’agence rappelle le membre de l’équipe.'
          p2: 'Clairaut reçoit les deux brouillons sans savoir comment elle voulait faire imprimer les passages révisés.'
          p3: 'Émilie meurt à Lunéville le 10 septembre, six jours après la naissance de sa fille.'
        shift:
          p1:
            was: 'Le 10 septembre 1749, la Bibliothèque royale signe un reçu pour trois liasses du commentaire de Du Châtelet sur Newton.'
          p2:
            was: 'En 1759, après sa mort, l’édition française complète paraît avec l’aide de Clairaut.'
            now: 'Les deux choix d’Émilie sont consignés. Les corrections ultérieures figurent sur une autre page, où les lecteurs peuvent les distinguer de son commentaire.'
          p3:
            was: 'Émilie donne naissance à une fille le 4 septembre 1749 et meurt le 10 septembre à Lunéville. Les sources divergent sur la cause de sa mort.'
            now: 'Elle survit à l’accouchement et se rétablit au cours de l’automne. Elle veille elle-même à l’impression de sa traduction et poursuit ses recherches.'
            who: 'du_chatelet_luneville'
            bio: 'Émilie du Châtelet survit aux suites de l’accouchement de 1749, fait imprimer sa traduction commentée des Principia et poursuit ses recherches.'
        vignettes:
          stairs: 'À l’aube du 4 septembre, {staff} aide une blanchisseuse à monter du linge propre. La lampe brûlait dès minuit, dit-elle. Elle a compté onze allers-retours dans l’escalier avant l’aube.'
          candles: 'À la fin d’août, {staff} aide le préposé aux bougies à faire l’inventaire. La marquise en consomme plus que le cabinet du roi, dit-il. Ce mois-ci, il fera ses comptes une semaine plus tôt.'
          arbour: 'En octobre, {staff} aide le jardinier à ôter les rideaux de la tonnelle. D’habitude, dit-il, on y donne encore des pièces à cette époque. Cette année, la cour est déjà silencieuse.'
text:
  en:
    name: Émilie du Châtelet
    text: French mathematician and physicist, 1706 to 1749. She translated Newton's Principia into French with a commentary and argued that the energy of a moving body depends on the square of its speed. She died after childbirth at Lunéville.
  zh:
    name: 埃米莉·杜·夏特莱
    text: 法国数学家与物理学家，1706 年生，1749 年去世。她把牛顿的《原理》译成法文并作注，论证运动物体的能量与速度的平方有关。她在吕内维尔因产后并发症去世。
quotes:
  du_chatelet_luneville_building:
    order: 1
    tier: full
    date: '1740'
    checked: official_record
    sources: [du_chatelet_physics_preface]
    original: fr
    text:
      fr: {who: 'Émilie du Châtelet', quote: 'La Physique est un Bâtiment immense, qui surpasse les forces d’un seul homme', occasion: 'avant-propos des Institutions de physique, adressé à son fils'}
      en: {who: 'Émilie du Châtelet', quote: 'Physics is a vast building, beyond the strength of any one person.', occasion: 'preface to Institutions de physique, addressed to her son (game translation)'}
      zh: {who: '埃米莉·杜·夏特莱', quote: '物理学是一座宏大的建筑，非一人之力所能建成。', occasion: '《物理学原理》写给儿子的序言（游戏译文）'}
  du_chatelet_luneville_study:
    order: 2
    tier: none
    date: '1740'
    checked: official_record
    sources: [du_chatelet_physics_preface]
    original: fr
    text:
      fr: {who: 'Émilie du Châtelet', quote: 'quelles ressources & quelles consolations on trouve dans l’Etude', occasion: 'avant-propos des Institutions de physique, adressé à son fils'}
      en: {who: 'Émilie du Châtelet', quote: '… what support and comfort can be found in study', occasion: 'preface to Institutions de physique, addressed to her son (game translation)'}
      zh: {who: '埃米莉·杜·夏特莱', quote: '……学习能给人多少助益与慰藉。', occasion: '《物理学原理》写给儿子的序言（游戏译文）'}
hook: {en: 'Six days after her daughter was born', zh: '生下女儿后的第六天'}
facts:
  luneville:
    date: '1749-07'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki]
    text:
      en: 'In July 1749 Du Châtelet came to the court of Stanislas, Duke of Lorraine, first at Commercy and from 19 July at Lunéville, where she was to give birth.'
      zh: '1749 年 7 月，杜·夏特莱来到洛林公爵斯坦尼斯瓦夫的宫廷，先在科梅尔西，7 月 19 日起在吕内维尔，在那里待产。'
    line:
      en: 'July 1749: Du Châtelet comes to the court of Stanislas at Lunéville to await the birth of her child.'
      zh: '1749 年 7 月，杜·夏特莱来到吕内维尔斯坦尼斯瓦夫的宫廷待产。'
      fr: 'En juillet 1749, Émilie du Châtelet rejoint la cour de Stanislas à Lunéville pour y attendre la naissance de son enfant.'
  birth:
    date: '1749-09-04'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki]
    text:
      en: 'At four in the morning of 4 September 1749 Du Châtelet gave birth at Lunéville to a daughter, Stanislas-Adélaïde.'
      zh: '1749 年 9 月 4 日凌晨四点，杜·夏特莱在吕内维尔生下女儿斯坦尼斯拉斯－阿德莱德。'
    line:
      en: '4 September 1749: before dawn Du Châtelet gives birth to a daughter.'
      zh: '1749 年 9 月 4 日天亮前，杜·夏特莱生下一个女儿。'
      fr: 'Le 4 septembre 1749, avant l’aube, Émilie donne naissance à une fille.'
  death:
    date: '1749-09-10'
    stay_day: 19.05
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki, du_chatelet_britannica]
    text:
      en: 'Du Châtelet died at Lunéville at one in the morning of 10 September 1749, aged forty two. The cause is given as childbed fever by some and as a pulmonary embolism by others.'
      zh: '1749 年 9 月 10 日凌晨一点，杜·夏特莱在吕内维尔去世，四十二岁。死因一说产褥热，一说肺栓塞。'
    note: 'A death after childbirth: written as a plain fact, both accounts of the cause given.'
    line:
      en: '10 September 1749: Émilie du Châtelet dies at Lunéville, six days after the birth.'
      zh: '1749 年 9 月 10 日，埃米莉·杜·夏特莱在吕内维尔去世，离生下女儿六天。'
      fr: 'Le 10 septembre 1749, Émilie du Châtelet meurt à Lunéville, six jours après la naissance.'
  receipt:
    date: '1749-09-10'
    stay_day: 19.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_luneville_royal_library]
    text:
      en: 'On 10 September 1749 the keepers of the Royal Library in Paris, Sallier and Melot, signed a receipt for three packets of her commentary on Newton''s Principia.'
      zh: '1749 年 9 月 10 日，巴黎王家图书馆的萨利耶和梅洛为她的牛顿《原理》评注稿三包签了收据。'
    line:
      en: '10 September 1749: in Paris the Royal Library signs for three packets of her commentary on Newton.'
      zh: '1749 年 9 月 10 日，巴黎的王家图书馆为她的三包牛顿评注稿签了收据。'
      fr: 'Le 10 septembre 1749, la Bibliothèque royale de Paris signe un reçu pour trois liasses de son commentaire sur Newton.'
  principes:
    date: '1759'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_primary, du_chatelet_luneville_deposit_receipt]
    text:
      en: 'The complete French edition of Newton''s Principia translated and annotated by Émilie du Châtelet appeared posthumously in 1759.'
      zh: '杜·夏特莱翻译并加注的牛顿《原理》完整法译本，于她去世后的 1759 年刊行。'
    line:
      en: '1759: her complete French translation of Newton''s Principia, with her commentary, is published.'
      zh: '1759 年，她翻译并加注的牛顿《原理》法译全本出版。'
      fr: 'En 1759 paraît sa traduction française complète des Principia, accompagnée de son commentaire.'
