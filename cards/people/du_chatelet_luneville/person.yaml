        relic: "一只墨水瓶"
        relic_desc: "一只小墨水瓶，来自一张通宵写字的书桌。"
        points:
          p1: '找出评注正在解释的那句原文'
          p2: '帮读者把两份文字对齐'
          p3: '给下一次读稿留下清楚的标记'
        vignettes:
          source: '读者顺着一句直接念到下一句。到评注开头处，你请他停一下。再翻回第一页，他已能认出是哪一位作者在解释。'
          diagram: '你问这段话画出来该是什么样。读者先画了个方向，又回去翻文字，确认箭头该落在哪儿。'
          mark: '你把夹在下一页的纸签移到读者想回看的那一行。散页收起来时，问题仍和原段夹在一起。'
text:
  en:
    name: Émilie du Châtelet
    text: French mathematician and physicist, 1706 to 1749. She translated Newton's Principia into French with a commentary and argued that the energy of a moving body depends on the square of its speed. She died after childbirth at Lunéville.
  zh:
    name: 埃米莉·迪沙特莱
    text: 法国数学家与物理学家，1706 年生，1749 年去世。她把牛顿的《原理》译成法文并作注，论证运动物体的能量与速度的平方有关。她在吕内维尔因产后并发症去世。
