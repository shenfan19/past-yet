facts:
  luneville:
    date: '1749-07'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki]
    text:
      en: 'In July 1749 Du Châtelet came to the court of Stanislas, Duke of Lorraine, first at Commercy and from 19 July at Lunéville, where she was to give birth.'
      zh: '1749 年 7 月，杜·夏特莱来到洛林公爵斯坦尼斯瓦夫的宫廷，先在科梅尔西，7 月 19 日起在吕内维尔，在那里待产。'
    line:
      en: 'July 1749: Du Châtelet comes to the court of Stanislas at Lunéville to await the birth of her child.'
      zh: '1749 年 7 月，杜·夏特莱来到吕内维尔斯坦尼斯瓦夫的宫廷待产。'
      fr: 'En juillet 1749, Émilie du Châtelet rejoint la cour de Stanislas à Lunéville pour y attendre la naissance de son enfant.'
  birth:
    date: '1749-09-04'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki]
    text:
      en: 'At four in the morning of 4 September 1749 Du Châtelet gave birth at Lunéville to a daughter, Stanislas-Adélaïde.'
      zh: '1749 年 9 月 4 日凌晨四点，杜·夏特莱在吕内维尔生下女儿斯坦尼斯拉斯－阿德莱德。'
    line:
      en: '4 September 1749: before dawn Du Châtelet gives birth to a daughter.'
      zh: '1749 年 9 月 4 日天亮前，杜·夏特莱生下一个女儿。'
      fr: 'Le 4 septembre 1749, avant l’aube, Émilie donne naissance à une fille.'
  death:
    date: '1749-09-10'
    stay_day: 19.05
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_wiki, du_chatelet_britannica]
    text:
      en: 'Du Châtelet died at Lunéville at one in the morning of 10 September 1749, aged forty two. The cause is given as childbed fever by some and as a pulmonary embolism by others.'
      zh: '1749 年 9 月 10 日凌晨一点，杜·夏特莱在吕内维尔去世，四十二岁。死因一说产褥热，一说肺栓塞。'
    note: 'A death after childbirth: written as a plain fact, both accounts of the cause given.'
    line:
      en: '10 September 1749: Émilie du Châtelet dies at Lunéville, six days after the birth.'
      zh: '1749 年 9 月 10 日，埃米莉·杜·夏特莱在吕内维尔去世，离生下女儿六天。'
      fr: 'Le 10 septembre 1749, Émilie du Châtelet meurt à Lunéville, six jours après la naissance.'
  receipt:
    date: '1749-09-10'
    stay_day: 19.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_deposit_receipt, du_chatelet_luneville_royal_library]
    text:
      en: 'On 10 September 1749 the keepers of the Royal Library in Paris, Sallier and Melot, signed a receipt for three packets of her commentary on Newton''s Principia.'
      zh: '1749 年 9 月 10 日，巴黎王家图书馆的萨利耶和梅洛为她的牛顿《原理》评注稿三包签了收据。'
    line:
      en: '10 September 1749: in Paris the Royal Library signs for three packets of her commentary on Newton.'
      zh: '1749 年 9 月 10 日，巴黎的王家图书馆为她的三包牛顿评注稿签了收据。'
      fr: 'Le 10 septembre 1749, la Bibliothèque royale de Paris signe un reçu pour trois liasses de son commentaire sur Newton.'
  principes:
    date: '1759'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [du_chatelet_luneville_primary, du_chatelet_luneville_deposit_receipt]
    text:
      en: 'The complete French edition of Newton''s Principia translated and annotated by Émilie du Châtelet appeared posthumously in 1759.'
      zh: '杜·夏特莱翻译并加注的牛顿《原理》完整法译本，于她去世后的 1759 年刊行。'
    line:
      en: '1759: her complete French translation of Newton''s Principia, with her commentary, is published.'
      zh: '1759 年，她翻译并加注的牛顿《原理》法译全本出版。'
      fr: 'En 1759 paraît sa traduction française complète des Principia, accompagnée de son commentaire.'
