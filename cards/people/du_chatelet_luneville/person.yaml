    text:
      en:
        name: "Newton in French"
        place: "Lunéville"
        figure: "Émilie du Châtelet"
        story: 'In the summer of 1749 Émilie du Châtelet was at the court of Stanislas at Lunéville, waiting for a child and finishing her French translation of Newton''s Principia with its commentary. On 4 September she gave birth to a daughter. On 10 September she died, aged forty two; the cause is given as childbed fever by some and a pulmonary embolism by others. The same day the Royal Library in Paris signed a receipt for three packets of her commentary. The complete translation came out in 1759.'
        relic: "An inkwell"
        relic_desc: "A small inkwell from a desk worked at through the night."
        points:
          p1: 'In Lunéville, list the three packets of commentary before sending them with her request to the Royal Library'
          p2: 'Have her leave Clairaut decisions on the two hardest passages, identifying where her translation should stand and where a later revision should be listed separately'
          p3: 'Watch over her in the days after the birth, cure her, and keep her alive'
        points_fail:
          p1: 'The packet with the commentary stays behind. The Library receives only the letter, and the office recalls the employee.'
          p2: 'Two drafts reach the editor, but her decisions about how to print the revised passages do not.'
          p3: 'On 10 September she died in Lunéville, six days after her daughter was born.'
        shift:
          p1:
            was: 'On September 10, 1749, the Royal Library issued a receipt for three packets of Du Châtelet’s commentary on Newton.'
          p2:
            was: 'In 1759, after Du Châtelet’s death, the complete French edition appeared, with Clairaut having helped prepare it.'
            now: 'The editor has two decisions she approved and describes any later changes on another page. Readers can distinguish her commentary from editorial additions.'
          p3:
            was: 'On the night of 4 September 1749 Du Châtelet gave birth to a daughter, and on 10 September she died in Lunéville; the cause is given as childbed fever by some and as a pulmonary embolism by others.'
            now: 'She came through the days after the birth and recovered over the autumn. She saw her Newton translation into print herself and went on with her research for many years.'
            who: du_chatelet_luneville
            bio: 'Du Châtelet survived the birth of 1749, took her French Newton and its commentary to the printer herself, and kept writing and researching for years after.'
        vignettes:
          stairs: 'Early on 4 September {staff} helps a laundry girl carry a pile of clean cloths upstairs. The lamp up there was lit at midnight, she says; she counted the feet on the stairs, and by daybreak it was eleven trips.'
          candles: 'At the end of August {staff} helps the old servant who keeps the candles count the store. The lady marquise burns more candles than the king''s own study, he says, and this month he has to send in his account a week early.'
          arbour: 'In October {staff} helps a gardener take down the curtains of the arbour. The court has gone quiet early this autumn, he says; most years they would still be putting on plays out here.'
      zh:
        name: "法语版牛顿"
        place: "吕内维尔"
        figure: "埃米莉·杜·夏特莱"
        story: '1749 年夏，埃米莉·杜·夏特莱住在吕内维尔斯坦尼斯瓦夫的宫廷里待产，手上是快要完成的牛顿《原理》法译和评注。9 月 4 日，她生下一个女儿。9 月 10 日，她去世，四十二岁，死因一说产褥热，一说肺栓塞。同一天，巴黎的王家图书馆为她寄存的三包评注稿签了收据。1759 年，法译全本出版。'
        relic: "一只墨水瓶"
        relic_desc: "一只小墨水瓶，来自一张通宵写字的书桌。"
        points:
          p1: '在吕内维尔把三包评注稿逐包登记，连同她写给王家图书馆的请求交运'
          p2: '请她把最难厘清的两项留给克莱罗，说明哪里要保留原译，哪里需另列后续校改'
          p3: '产后那几天守着她，治好她的病，让她活下来'
        points_fail:
          p1: '夹有评注的稿包留在宅邸，图书馆只收到信，事务所因同步失败召回员工。'
          p2: '两份相关草稿一起送达，改过的位置却没有留下她想怎样印的说明。'
          p3: '9 月 10 日，她在吕内维尔去世，离生下女儿只有六天。'
        shift:
          p1:
            was: '1749 年 9 月 10 日，王家图书馆为杜·夏特莱寄存的三包牛顿评注稿开出收据。'
          p2:
            was: '1759 年，法语全本出版，杜·夏特莱去世后由克莱罗参与整理。'
            now: '编辑手里有她核过的两份决定，后来附上的修改在另页说明。读者可以区分她的评注与编辑的补充。'
          p3:
            was: '1749 年 9 月 4 日夜里，杜·夏特莱生下一个女儿，9 月 10 日在吕内维尔去世，死因一说产褥热，一说肺栓塞。'
            now: '她熬过了产后那几天，秋天里身体慢慢复原。她亲自看着牛顿译本付印，此后又做了多年研究。'
            who: du_chatelet_luneville
            bio: '杜·夏特莱在 1749 年产后活了下来，亲自把牛顿《原理》的法译与评注送进印坊，此后继续写作与研究多年。'
        vignettes:
          stairs: '9 月 4 日一早，{staff}帮洗衣房的姑娘把一摞干净布巾送上楼。姑娘说楼上半夜就点了灯，她躺着数楼梯上的脚步，到天亮一共跑了十一趟。'
          candles: '八月底，{staff}帮宫里管蜡烛的老仆清点库房。老仆说侯爵夫人屋里的蜡烛比国王的书房还费，他这个月得提前一周报账。'
          arbour: '十月，{staff}帮园丁把凉亭的帘子收起来。园丁说宫里今年秋天静得早，往年这时候还在这儿排戏。'
      fr:
        name: 'Newton en français'
        place: 'Lunéville'
        figure: 'Émilie du Châtelet'
        story: 'À l’été 1749, Émilie du Châtelet attend un enfant à la cour de Stanislas, à Lunéville, et termine sa traduction commentée des Principia de Newton. Elle donne naissance à une fille le 4 septembre. Elle meurt le 10 septembre, à quarante-deux ans. Les sources évoquent une fièvre puerpérale ou une embolie pulmonaire. Le même jour, la Bibliothèque royale de Paris signe un reçu pour trois liasses de commentaires. La traduction complète paraît en 1759.'
        relic: 'Un encrier'
        relic_desc: 'Un petit encrier qui a servi à écrire toute la nuit.'
        points:
          p1: 'inventorier les trois liasses et les envoyer avec la lettre à la Bibliothèque royale'
          p2: 'consigner pour Clairaut les choix de traduction des deux passages les plus difficiles'
          p3: 'veiller sur Émilie après la naissance et l’aider à survivre'
        points_fail:
          p1: 'La liasse reste sur place. La bibliothèque ne reçoit que la lettre et l’agence rappelle le membre de l’équipe.'
          p2: 'Clairaut reçoit les deux brouillons sans savoir comment elle voulait faire imprimer les passages révisés.'
          p3: 'Émilie meurt à Lunéville le 10 septembre, six jours après la naissance de sa fille.'
        shift:
          p1:
            was: 'Le 10 septembre 1749, la Bibliothèque royale signe un reçu pour trois liasses du commentaire de Du Châtelet sur Newton.'
          p2:
            was: 'En 1759, après sa mort, l’édition française complète paraît avec l’aide de Clairaut.'
            now: 'Les deux choix d’Émilie sont consignés. Les corrections ultérieures figurent sur une autre page, où les lecteurs peuvent les distinguer de son commentaire.'
          p3:
            was: 'Émilie donne naissance à une fille le 4 septembre 1749 et meurt le 10 septembre à Lunéville. Les sources divergent sur la cause de sa mort.'
            now: 'Elle survit à l’accouchement et se rétablit au cours de l’automne. Elle veille elle-même à l’impression de sa traduction et poursuit ses recherches.'
            who: 'du_chatelet_luneville'
            bio: 'Émilie du Châtelet survit aux suites de l’accouchement de 1749, fait imprimer sa traduction commentée des Principia et poursuit ses recherches.'
        vignettes:
          stairs: 'À l’aube du 4 septembre, {staff} aide une blanchisseuse à monter du linge propre. La lampe brûlait dès minuit, dit-elle. Elle a compté onze allers-retours dans l’escalier avant l’aube.'
          candles: 'À la fin d’août, {staff} aide le préposé aux bougies à faire l’inventaire. La marquise en consomme plus que le cabinet du roi, dit-il. Ce mois-ci, il fera ses comptes une semaine plus tôt.'
          arbour: 'En octobre, {staff} aide le jardinier à ôter les rideaux de la tonnelle. D’habitude, dit-il, on y donne encore des pièces à cette époque. Cette année, la cour est déjà silencieuse.'
text:
  en:
    name: Émilie du Châtelet
    text: French mathematician and physicist, 1706 to 1749. She translated Newton's Principia into French with a commentary and argued that the energy of a moving body depends on the square of its speed. She died after childbirth at Lunéville.
  zh:
    name: 埃米莉·杜·夏特莱
    text: 法国数学家与物理学家，1706 年生，1749 年去世。她把牛顿的《原理》译成法文并作注，论证运动物体的能量与速度的平方有关。她在吕内维尔因产后并发症去世。
