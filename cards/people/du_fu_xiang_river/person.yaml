    text:
      en:
        name: "A poet on a boat"
        place: "Xiang River"
        figure: "Du Fu"
        story: 'A poem transmitted under Du Fu''s name is headed as verses written in illness aboard a boat and addressed to friends in Hunan. The poem evokes river and shore scenes.'
        relic: "A boatman's oil lamp"
        relic_desc: "A small clay lamp that burned late over a few lines of verse."
        points:
          p1: 'Keep a place for Du Fu’s pages on the boat so the long poem for friends in Hunan can be assembled'
          p2: 'Ask the poet to check the places in the dispatch copy and keep a set he can compare with his route'
          p3: 'Leave checked copies with two sets of friends. Preserve the title and author’s changes for later collectors'
        points_fail:
          p1: 'Only the first and last leaves turn up after a hurried move. The poem cannot be assembled and the office recalls the employee.'
          p2: 'The copy for friends loses a marginal place name, leaving no reference to consult.'
          p3: 'Only one friend keeps a copy. A later scribe drops the words addressed to the author’s friends.'
        shift:
          p1:
            was: 'A surviving poem attributed to Du Fu has thirty-six rhymes and is headed as written in illness on a boat for friends in Hunan.'
          p2:
            was: 'The poem describes life aboard and scenes along the river. Its title identifies the people it addresses.'
            now: 'The pages distinguish places already visited from entries still to be checked. The poet can compare the dispatch against his copy.'
          p3:
            was: 'Later collections transmit the poem. Its dating and route are studied through the title and related records.'
            now: 'Copies held in two places give the same heading and page sequence. Later editors can compare them while leaving uncertain route details open.'
            who: du_fu_xiang_river
            bio: 'Du Fu spent parts of his last years traveling by boat. This poem’s heading preserves something of how it was written and whom he meant to read it.'
        vignettes:
          shore: 'The traveller writes that the shore looks gloomy. You ask what made them look up from the boat. They pause, then write down one thing that was actually there.'
          delivery: 'You hear that the next boat goes only partway to the friend''s town. The traveller nearly folds the note without a second name on it. You help them find someone who can take it onwards.'
          damp: 'The traveller sets the note where spray has reached the board. You lay a dry scrap beneath it while they finish writing the greeting.'
      zh:
        name: "船上的诗人"
        place: "湘江"
        figure: "杜甫"
        story: '传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。'
        relic: "一盏船灯"
        relic_desc: "一盏小小的陶油灯，为了几行诗亮到很晚。"
        points:
          p1: '在船上给杜甫留一处可以收好诗纸的位置，护住寄湖南亲友的长诗从零散纸页连成全篇'
          p2: '请作者确定寄送稿中按旅程提到的几处地方，给自己另留一套便于沿路核对的稿纸'
          p3: '请两边的亲友各留一份可核作者改笔的抄稿，给后来选诗者指到诗题原来如何署'
        points_fail:
          p1: '匆忙挪舱时只找到头尾几张，长诗没能成篇，事务所因同步失败召回员工。'
          p2: '抄给友人的一套把借写在边上的地名漏掉，后来没有办法回查。'
          p3: '只有受信的友人留了一套抄稿，抄手再传时把题里关于亲友的字漏掉。'
        shift:
          p1:
            was: '传世杜诗有一首题为舟中抱病时写给湖南亲友的三十六韵。'
          p2:
            was: '这首诗写及舟中处境与两岸景物，诗题给出了收信范围。'
            now: '抄页仍分出所经地点和准备另查之处。作者能从原稿核定寄本。'
          p3:
            was: '诗经后来的杜集和唐诗总集传下，舟中寄呈的时间和行程需要依据诗题与其他资料考证。'
            now: '两份不同处保存的抄稿标着相同的诗题与页次，编集者可以对读。有些航行细节依然留待考证。'
            who: du_fu_xiang_river
            bio: '杜甫晚年多在舟中转徙。这首作品把写诗时的处境和希望送给谁都留在题里。'
        vignettes:
          shore: '旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。'
          delivery: '你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。'
          damp: '旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。'
text:
  en:
    name: Du Fu
    text: Chinese poet of the Tang, 712 to 770. He wrote of war, famine and ordinary lives with great technical control and was admired mainly after his death. He died on a boat on the Xiang River.
  zh:
    name: 杜甫
    text: 唐代诗人，712 年生，770 年去世。他写战乱、饥荒和普通人的生活，格律功力深厚，主要在身后才受推崇。他死在湘江的一条船上。
hook: {en: 'What can a poem send upriver?', zh: '舟上的诗能托给谁'}
