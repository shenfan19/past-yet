quotes:
  du_fu_xiang_river_story_echo_full:
    order: 1
    tier: full
    date: '770'
    checked: official_record
    sources: [du_fu_xiang_river_story_echo_source_full]
    original: zh-Hant
    text:
      en:
        who: 'Du Fu'
        quote: 'After all my stumbling, my gratitude is for those who understand the music.'
        occasion: 'The poem to friends in Hunan, on finding readers who understand him.'
      zh:
        who: '杜甫'
        quote: '蹉跎之中，反复学着走，感念的还是知音。'
        occasion: '寄湖南亲友一诗中写对知音的感念。'
      zh-Hant:
        who: '杜甫'
        quote: '蹉跎飜學步，感激在知音。'
        occasion: '寄湖南亲友一诗中写对知音的感念。'
      fr:
        who: 'Du Fu'
        quote: 'Après tous mes trébuchements, ma gratitude va à ceux qui comprennent la musique.'
        occasion: 'Le poème aux amis du Hunan, sur la recherche de lecteurs qui le comprennent.'
      es:
        who: 'Dufu'
        quote: 'Después de todos mis tropiezos, mi agradecimiento es para quienes entienden la música.'
        occasion: 'El poema a los amigos de Hunan, sobre cómo encontrar lectores que lo comprendan.'
      ja:
        who: '杜甫'
        quote: 'つまずきながらも、音楽を理解してくださる方々に感謝します。'
        occasion: '湖南省の友人たちに宛てた、自分を理解してくれる読者の発見についての詩。'
      ko:
        who: '두보'
        quote: '모든 우여곡절 끝에 음악을 이해해 주신 분들께 감사드립니다.'
        occasion: '그를 이해하는 독자를 찾아 후난의 친구들에게 보내는 시입니다.'
      ru:
        who: 'Ду Фу'
        quote: 'После всех моих спотыканий моя благодарность тем, кто понимает музыку.'
        occasion: 'Стихотворение друзьям в провинции Хунань, посвященное поиску понимающих его читателей.'
  du_fu_xiang_river_story_echo_none:
    order: 2
    tier: none
    date: '770'
    checked: official_record
    sources: [du_fu_xiang_river_story_echo_source_none]
    original: zh-Hant
    text:
      en:
        who: 'Du Fu'
        quote: 'The boat often moors to the east; on the still lake Orion comes into view early.'
        occasion: 'The poem to friends in Hunan, looking out from the boat.'
      zh:
        who: '杜甫'
        quote: '舟常泊在东边，湖面平静，早早就能望见参星。'
        occasion: '寄湖南亲友一诗中从舟上写到停泊与星光。'
      zh-Hant:
        who: '杜甫'
        quote: '舟泊常依震，湖平早見參。'
        occasion: '寄湖南亲友一诗中从舟上写到停泊与星光。'
      fr:
        who: 'Du Fu'
        quote: 'Le bateau mouille souvent à l''est ; sur le lac immobile, Orion apparaît tôt.'
        occasion: 'Le poème adressé à des amis du Hunan, regardant depuis le bateau.'
      es:
        who: 'Dufu'
        quote: 'El barco suele atracar hacia el este; En el tranquilo lago, Orión aparece temprano.'
        occasion: 'El poema a unos amigos en Hunan, mirando desde el barco.'
      ja:
        who: '杜甫'
        quote: 'ボートはしばしば東に停泊します。静かなオリオン湖が早くも見えてきます。'
        occasion: 'ボートから景色を眺めながら湖南省の友人に宛てた詩。'
      ko:
        who: '두보'
        quote: '배는 종종 동쪽에 정박해 있습니다. 고요한 호수 위에서 오리온자리가 일찍 눈에 들어온다.'
        occasion: '배에서 밖을 내다보며 후난의 친구들에게 보내는 시입니다.'
      ru:
        who: 'Ду Фу'
        quote: 'Лодка часто швартуется на востоке; на тихом озере Орион рано появляется в поле зрения.'
        occasion: 'Стихотворение друзьям в провинции Хунань, смотрящим из лодки.'
