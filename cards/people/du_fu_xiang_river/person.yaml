    text:
      en:
        name: "A poet on a boat"
        place: "Xiang River"
        figure: "Du Fu"
        story: 'A poem transmitted under Du Fu''s name is headed as verses written in illness aboard a boat and addressed to friends in Hunan. The poem evokes river and shore scenes.'
        relic: "A boatman's oil lamp"
        relic_desc: "A small clay lamp that burned late over a few lines of verse."
        points:
          p1: 'Keep a place for Du Fu’s pages on the boat so the long poem for friends in Hunan can be assembled'
          p2: 'Nurse him through his illness on the boat and ease his pain'
          p3: 'See the boat north, so that he and his family get home safely'
        points_fail:
          p1: 'Only the first and last leaves turn up after a hurried move. The poem cannot be assembled and the office recalls the employee.'
          p2: 'He lies on his pillow in the winter boat, and grows worse day by day.'
          p3: 'The boat never got north. He died that winter far from home, and his coffin was laid in temporary burial at Yueyang.'
        shift:
          p1:
            was: 'In 770 Du Fu, ill on a boat, wrote a poem of thirty six rhymes for his friends and kin in Hunan, as its title says.'
          p2:
            was: 'In the winter of 770 Du Fu lay ill on a boat on the Xiang, and died soon after away from home, at fifty nine.'
            now: 'That winter he suffered less on the boat.'
          p3:
            was: 'In the winter of 770 Du Fu died far from home and was laid in temporary burial at Yueyang; more than forty years later his grandson Du Siye begged the money to rebury him at Yanshi.'
            now: 'The boat reached the north the next spring, and Du Fu and his family came home. He lived some more years there.'
            who: du_fu_xiang_river
            bio: 'Du Fu drifted through Hunan in his last years, came home to the north in 771, and spent the rest of his life with his family.'
        vignettes:
          shore: 'The traveller writes that the shore looks gloomy. You ask what made them look up from the boat. They pause, then write down one thing that was actually there.'
          delivery: 'You hear that the next boat goes only partway to the friend''s town. The traveller nearly folds the note without a second name on it. You help them find someone who can take it onwards.'
          damp: 'The traveller sets the note where spray has reached the board. You lay a dry scrap beneath it while they finish writing the greeting.'
      zh:
        name: "船上的诗人"
        place: "湘江"
        figure: "杜甫"
        story: '传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。'
        relic: "一盏船灯"
        relic_desc: "一盏小小的陶油灯，为了几行诗亮到很晚。"
        points:
          p1: '在船上给杜甫留一处可以收好诗纸的位置，护住寄湖南亲友的长诗从零散纸页连成全篇'
          p2: '舟中照料他的风疾和旧病，减轻他的病痛'
          p3: '护着这条船北上，让他一家平安回到故乡'
        points_fail:
          p1: '匆忙挪舱时只找到头尾几张，长诗没能成篇，事务所因同步失败召回员工。'
          p2: '他伏在枕上，在冬天的船里一天比一天病重。'
          p3: '船没能北上，他在那个冬天客死他乡，灵柩暂殡岳阳。'
        shift:
          p1:
            was: '大历五年，杜甫在舟中抱病，写下寄湖南亲友的三十六韵长诗，诗题记下了这些。'
          p2:
            was: '大历五年冬，杜甫在湘江的船上病重，不久客死他乡，享年五十九。'
            now: '那个冬天他在船上少受了些病痛。'
          p3:
            was: '大历五年冬，杜甫客死他乡，灵柩暂殡岳阳；四十多年后，孙子杜嗣业四处乞借，才把他迁回偃师安葬。'
            now: '那条船第二年开春到了北方，杜甫一家回到故乡，他在家中又过了几年。'
            who: du_fu_xiang_river
            bio: '杜甫晚年漂泊湖湘，大历六年回到北方故乡，在家人身边度过余年。'
        vignettes:
          shore: '旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。'
          delivery: '你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。'
          damp: '旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。'
text:
  en:
    name: Du Fu
    text: Chinese poet of the Tang, 712 to 770. He wrote of war, famine and ordinary lives with great technical control and was admired mainly after his death. He died on a boat on the Xiang River.
  zh:
    name: 杜甫
    text: 唐代诗人，712 年生，770 年去世。他写战乱、饥荒和普通人的生活，格律功力深厚，主要在身后才受推崇。他死在湘江的一条船上。
hook: {en: 'What can a poem send upriver?', zh: '舟上的诗能托给谁'}
