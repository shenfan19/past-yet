    scene:
      points:
        - {id: p1, kind: care, req: {"trait":["attached","faithful","patient"]}}
        - {id: p2, kind: notice, req: {"any":[{"trait":["quiet","wanderer"]},{"job":["teacher","journalist"]}]}}
        - {id: p3, kind: care, redeem: true, req: {"item":"elixir"}}
