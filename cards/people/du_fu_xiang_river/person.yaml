    text:
      en:
        name: "A poet on a boat"
        place: "Xiang River"
        figure: "Du Fu"
        story: 'A poem transmitted under Du Fu''s name is headed as verses written in illness aboard a boat and addressed to friends in Hunan. The poem evokes river and shore scenes.'
        story_prose:
          opening:
            - 'Along the Xiang River, 770. Du Fu addressed a long poem of thirty-six rhymes to friends and kin in Hunan. Its heading says he wrote it in illness aboard a boat.'
            - 'The poem and its heading survive. How it was delivered does not. In this branch the family has had to move the pages several times, and the next landing is not decided.'
            - 'It takes someone who can help a patient rest, someone who can look after pages, and someone who knows the crossings and can remember the recipient’s name.'
          points:
            p3: '{staff} asks Du Fu where he wants to stop and finds a person there willing to carry the verses. Across the side of the boat, Du Fu tells him slowly who should receive them. The man repeats the name before taking the package. Du Fu listens and gives a small nod. Only then does the family pass the wrapped pages over the side into the other man’s hand.'
            p1: 'The boat needs to be cleared for people to pass. {staff} counts the sheets and moves them, in the order Du Fu indicates, to a board out of the wind. Du Fu reaches for a middle page and reads out its first words. After everything is moved, the space is still there. Du Fu can draw out the next leaf without asking anyone to find it.'
            p2: '{staff} asks which side is easier to rest on, folds the old cloth supporting Du Fu and moves the water to a place where it will not slide. He eases himself up a little and reaches the cup. The boat moves once. The cup makes a sound but stays upright.'
          outcomes:
            all: 'As their boat moves from the landing, the family puts the manuscript back by Du Fu. One copy is within reach, and another is already on its way.'
            p3: 'On the other boat the carrier first finds a dry place for the paper. As the boats pass, Du Fu can still see a corner of its cloth wrapping.'
            p1: 'The pages remain in order where the wind cannot reach them. After they land, Du Fu draws a middle sheet out again.'
            p2: 'Du Fu rests a while aboard. The cup is still where he can find it without looking.'
          none: 'The last boat has gone from the landing. The wrapped pages remain where they were.'
          not_admitted: '{staff} never finds the boat. A line of wet mooring ropes is pulled in one by one.'
          desync: 'Several middle leaves are missing after things are moved. When the agency recalls {staff}, the boatman is still holding the first and last sheets.'
          excerpts:
            p3: 'Du Fu listens and gives a small nod. Only then does the family pass the wrapped pages over the side into the other man’s hand.'
            p1: 'After everything is moved, the space is still there. Du Fu can draw out the next leaf without asking anyone to find it.'
            p2: 'The boat moves once. The cup makes a sound but stays upright.'
        relic: "A boatman's oil lamp"
        relic_desc: "A small clay lamp that burned late over a few lines of verse."
        points:
          p1: 'Keep a place for Du Fu’s pages on the boat so the long poem for friends in Hunan can be assembled'
          p2: 'Nurse him through his illness on the boat and ease his pain'
          p3: 'Ask Du Fu where he wants to stop next and help his family find a person who will take the finished verses on to their friends'
        points_fail:
          p1: 'Only the first and last leaves turn up after a hurried move. The poem cannot be assembled and the office recalls the employee.'
          p2: 'He lies on his pillow in the winter boat, and grows worse day by day.'
          p3: 'The next boat leaves before the family finds someone to take the poem. They have to carry it to another landing.'
        shift:
          p1:
            was: 'In 770 Du Fu, ill on a boat, wrote a poem of thirty six rhymes for his friends and kin in Hunan, as its title says.'
          p2:
            was: 'Du Fu’s poem to his friends in Hunan describes writing while ill aboard a boat.'
            now: 'That winter he suffered less on the boat.'
          p3:
            was: 'The poem is addressed to friends in Hunan. Its heading gives no record of how it reached them.'
            now: 'In this branch the family makes a stop Du Fu chooses. Someone at the landing offers to take a copy of the verses onward and can repeat the name of the person to receive it.'
        vignettes:
          shore: 'The traveller writes that the shore looks gloomy. You ask what made them look up from the boat. They pause, then write down one thing that was actually there.'
          delivery: 'You hear that the next boat goes only partway to the friend''s town. The traveller nearly folds the note without a second name on it. You help them find someone who can take it onwards.'
          damp: 'The traveller sets the note where spray has reached the board. You lay a dry scrap beneath it while they finish writing the greeting.'
      zh:
        name: "船上的诗人"
        place: "湘江"
        figure: "杜甫"
        story: '传世杜诗《风疾舟中伏枕书怀三十六韵奉呈湖南亲友》，题中写舟中抱病、作诗寄湖南亲友，诗里也写到水岸景色。'
        story_prose:
          opening:
            - '大历五年，湘水一带。杜甫有一首寄给湖南亲友的三十六韵长诗，诗题说他是在舟中抱病时写的。'
            - '史实留下了诗题和文字，没有记这份诗如何送到。在这条分支里，家里人在船上收过几次纸，下一回停船还没决定。'
            - '这趟用得上能帮病人把姿势放舒服的人、能照看诗纸的人，以及认识渡口又听得准收件姓名的人。'
          points:
            p3: '{staff}问杜甫想在哪个渡口停，在那儿找到愿意捎稿的人。杜甫隔着船帮跟他慢慢说了要交给谁。那人没立刻接过来，先把名字念了一遍。 杜甫听着听着点了一下头。家人这才把纸包递过船边，压进对方握着的手里。'
            p1: '船又要腾地方给人走动，{staff}先把诗纸一张张数过，照杜甫指的次序移到避风的板下。杜甫伸手取到中间一叶，念了开头给他听。 挪完东西以后，那一处还留着。杜甫不必等人再去找，就能把下一叶抽出来。'
            p2: '{staff}问杜甫靠哪一边舒服，把垫在他身后的旧布带着折了一下，再把水挪到船帮不晃的地方。他试着坐起来一点，伸手够到了杯。 船身动了一次。杯子响了一声，没有倒。'
          outcomes:
            all: '家人看船从渡口挪开时，替杜甫把原稿放回他手边。一份还在，一份已经有人带着往前走。'
            p3: '那人上了另一条船，先找了个干处放纸。两船错开时，杜甫还能看到装纸的布角。'
            p1: '诗纸按次序待在避风处。船靠岸以后，杜甫又从那里抽出中间的一张。'
            p2: '杜甫在船上歇了一阵。那只杯还搁在他自己摸得着的地方。'
          none: '岸上最后一条船已经离开。纸包仍放在原先的船里。'
          not_admitted: '{staff}没能找到那条船。岸上一排缆绳先后从水里提起来。'
          desync: '腾地方时找不到中间的几页。事务所召回{staff}，船家还在拿着首尾两张等。'
          excerpts:
            p3: '杜甫听着听着点了一下头。家人这才把纸包递过船边，压进对方握着的手里。'
            p1: '挪完东西以后，那一处还留着。杜甫不必等人再去找，就能把下一叶抽出来。'
            p2: '船身动了一次。杯子响了一声，没有倒。'
        relic: "一盏船灯"
        relic_desc: "一盏小小的陶油灯，为了几行诗亮到很晚。"
        points:
          p1: '在船上给杜甫留一处可以收好诗纸的位置，护住寄湖南亲友的长诗从零散纸页连成全篇'
          p2: '舟中照料他的风疾和旧病，减轻他的病痛'
          p3: '问杜甫下一程想在哪里靠岸，帮家人在那里找一个愿意把诗带给亲友的人'
        points_fail:
          p1: '匆忙挪舱时只找到头尾几张，长诗没能成篇，事务所因同步失败召回员工。'
          p2: '他伏在枕上，在冬天的船里一天比一天病重。'
          p3: '家人还没找到能捎信的人，下一条船已经离开。他们只能把诗带到另一个渡口。'
        shift:
          p1:
            was: '大历五年，杜甫在舟中抱病，写下寄湖南亲友的三十六韵长诗，诗题记下了这些。'
          p2:
            was: '寄湖南亲友的诗题记下杜甫在船上抱病写诗。'
            now: '那个冬天他在船上少受了些病痛。'
          p3:
            was: '诗题把三十六韵写给湖南亲友，未记交递经过。'
            now: '这条分支里，船在杜甫选的地方靠了岸。渡口有人愿意替家人捎去一份诗稿，接手时还能把收稿人的名字念回来。'
        vignettes:
          shore: '旅人写岸上阴沉。你问刚才是什么让他从舱里抬起头。他想了一会儿，只写下一样真正看见的东西。'
          delivery: '你听说下一条船只去半程。旅人差点没写转交人的名字就折起信。你帮他找了一个能再往前带的人。'
          damp: '旅人把纸搁在溅湿了的板上。你拿张干的纸垫住，等他把问候写完。'
text:
  en:
    name: Du Fu
    text: Chinese poet of the Tang, 712 to 770. He wrote about war, famine and ordinary lives. Yuan Zhen’s epitaph says he died away from home and was placed in temporary burial at Yueyang.
  zh:
    name: 杜甫
    text: 唐代诗人，712 年生，770 年去世。他写下许多关于战乱、饥荒与普通人生活的诗。元稹为他所作墓系铭记他客死他乡，暂殡岳阳。
hook: {en: 'What can a poem send upriver?', zh: '舟上的诗能托给谁'}
