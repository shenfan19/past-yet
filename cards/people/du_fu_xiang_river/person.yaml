    text: {en: 'Yuan Zhen records Du Fu dying away from home and being placed in temporary burial at Yueyang. The epitaph does not clearly identify where he died.', zh: '元稹墓系铭记杜甫客死他乡、暂殡岳阳，卒地所指不够明确。'}
    line:
      en: 'Yuan Zhen’s epitaph records Du Fu’s death away from home and his temporary burial at Yueyang.'
      zh: '元稹墓系铭记杜甫客死他乡，暂殡岳阳。'
      zh-Hant: '元稹墓系銘記杜甫客死他鄉，暫殯岳陽。'
      fr: 'L''épitaphe de Yuan Zhen relate la mort de Du Fu loin de chez lui et son enterrement temporaire à Yueyang.'
      es: 'El epitafio de Yuan Zhen registra la muerte de Du Fu fuera de casa y su entierro temporal en Yueyang.'
      ja: '袁真の墓碑銘には、杜甫が家を離れて亡くなり、岳陽に仮埋葬されたことが記録されている。'
      ko: 'Yuan Zhen의 비문에는 두보가 집을 떠나 사망하고 Yueyang에 임시 매장된 내용이 기록되어 있습니다.'
      ru: 'Эпитафия Юань Чжэня описывает смерть Ду Фу вдали от дома и его временное захоронение в Юэяне.'
