    text:
      en:
        name: "The first woman in the academy"
        place: "Florence"
        figure: "Artemisia Gentileschi"
        story: 'Artemisia Gentileschi became the first woman admitted to Florence''s Academy of the Arts of Drawing in 1616. Her Florentine years include the work now known as Self-Portrait as a Lute Player.'
        story_prose:
          opening:
            - 'The shop in Florence has two account books open. Pigments go in one, and a slip for the academy fee is tucked into the other. Artemisia asks the clerk to keep them separate and tell her the day in July when she can collect her receipt.'
            - 'The Florentine drawing academy admitted Artemisia on 19 July 1616. She was also working on commissions. In this branch you can get the admission fee in place and help her secure a dated advance in her next painting agreement.'
            - 'Someone who is good with accounts can check the academy payment. Someone who can put a spoken agreement in writing can help her ask the client for the date she needs.'
          points:
            p1: 'The clerk has filed the academy slip among pigment bills that need settling. You ask Artemisia which payment has to go first and check the name of the recipient beside the date of admission. The clerk pulls out the receipt and leaves a copy for her. She takes the slip with her name on it away from the counter.'
            p2: 'When the last payment comes in, the patron asks how early she can begin the next painting. Artemisia pushes her pigment bill over and waits as he reads it aloud. You ask the clerk to record an advance due before work starts and give one copy to each person. When she goes to buy pigments, she takes the paper that shows when she can draw the money.'
          outcomes:
            all: 'The academy accepts the fee. The next agreement now gives the advance a date. Artemisia pays for the pigments and stretches the first canvas.'
            p1: 'Artemisia is admitted on the historical date. When she next wants to order supplies, she will still have to ask her patron for the money.'
            p2: 'The advance goes into the next agreement. The academy fee is late, and the trip preserves only the negotiation over the painting.'
          none: 'Receipts for the two expenses are still in the same pile. The shopkeeper asks once more which should be paid first.'
          not_admitted: 'The clerk has seats for the people he expects. You stay outside and watch someone file the academy slip among the pigment bills.'
          desync: 'The fee is not paid on the day. The enrolment falls out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'She takes the slip with her name on it away from the counter.'
            p2: 'When she goes to buy pigments, she takes the paper that shows when she can draw the money.'
        relic: "A pigment jar"
        relic_desc: "A small jar of ground lapis blue."
        points:
          p1: 'Help Artemisia arrange the money for her academy fee in time for her admission on 19 July'
          p2: 'As the first commission is settled, help Artemisia secure a dated advance in her next agreement so she can buy materials before she starts painting'
        points_fail:
          p1: 'Artemisia cannot cover the fee on the day in this branch. Her enrolment falls out of sync, and the office recalls the employee.'
          p2: 'The August balance is paid as recorded, but Artemisia still has to ask for money when she needs to buy supplies for another commission.'
        shift:
          p1:
            was: 'On July 19, 1616, the Academy of the Arts of Drawing in Florence admitted Artemisia Gentileschi.'
          p2:
            was: 'In 1615–16, the Buonarroti commission was paid in instalments. The archive preserves Artemisia’s request for money while she was working on it.'
            now: 'The next commission sets a date for the materials advance before work begins. Artemisia can order pigments against the agreed payment.'
            who: artemisia_florence
            bio: 'She painted Allegory of Inclination for Michelangelo Buonarroti the Younger’s house, where it remains part of the decoration. Admission also gave her access to the academy’s tribunal for disputes arising from her trade.'
        vignettes:
          pose: 'The visitor turns towards the mirror and asks which pose looks more natural. You ask what each pose seems to be doing. They pick the one that lets the hand keep its own purpose.'
          name: 'A practice sheet has the sitter''s description but no place for the painter''s name. You turn it over and ask the visitor to put down both before the sheets are stacked.'
          mirror: 'You move the mirror until the visitor can see the angle without twisting. They try the pose once, then make a small change of their own before drawing.'
      zh:
        name: "学院里的第一位女性"
        place: "佛罗伦萨"
        figure: "阿尔泰米西娅·真蒂莱斯基"
        story: '1616 年，阿尔泰米西娅·真蒂莱斯基成为佛罗伦萨绘画学院接纳的首位女性。现称《弹鲁特琴的自画像》的作品属于她在佛罗伦萨的时期。'
        story_prose:
          opening:
            - '佛罗伦萨的画材铺开着两本账。颜料记在一本里，另一册夹了学院费用的条子。阿尔泰米西娅请经手人把这两笔分开，再问七月哪一天能拿到缴费的回单。'
            - '1616 年 7 月 19 日，阿尔泰米西娅获佛罗伦萨绘画学院接纳。她那年也在做委托画。这里可以帮她办妥入会费，再从下一份画约里争取开工前的预付款。'
            - '懂核账的人可以先清点学院的钱。擅长把口头约定落实到纸面的人，可帮她按想要的日期问委托方。'
          points:
            p1: '账房把学院单夹在着急结清的颜料账里。你请阿尔泰米西娅说清哪笔要先交，再把收款人与入会日期一起核定。经手人把学院的回单抽出来，旁边空了一联给她自己留。她把写着名字的那一联带出了柜台。'
            p2: '最后一笔画款结清时，委托人问下一张画能早几天开工。阿尔泰米西娅把颜料单推给他，看着对方逐项念完。你替他们请书记把预付款日写在开工之前，让双方各有一份。她之后去取颜料，带的是已经能照约收款的纸。'
          outcomes:
            all: '学院收下入会费，下一份画约也已经写好预付款的日子。她按约买到颜料，再把第一张画布架起来。'
            p1: '入会照史实办成。到了下一次订颜料时，先付款的事还得另找对方开口。'
            p2: '预付款的条款写下了。入会费未赶上，回程只带回画约交接的一段。'
          none: '两笔钱仍在同一沓票里，画材铺只好再问哪一笔先付。'
          not_admitted: '账房给预约过的人留了位子。你没进里间，只看见有人把学院的纸条夹回账中。'
          desync: '入会费没有按日交妥。学院的录名与史实脱节，事务所召回员工。'
          excerpts:
            p1: '她把写着名字的那一联带出了柜台。'
            p2: '她之后去取颜料，带的是已经能照约收款的纸。'
        relic: "一罐颜料"
        relic_desc: "一小罐磨好的青金石蓝。"
        points:
          p1: '帮阿尔泰米西娅调出一笔钱缴入会费，赶上 7 月 19 日入会'
          p2: '趁上一个委托结款，帮阿尔泰米西娅在下一份画约里定下预付款日期，让她在开工前买齐颜料'
        points_fail:
          p1: '这条分支里，阿尔泰米西娅当天没能交齐入会费。入会偏离史实，事务所因同步失败召回员工。'
          p2: '8 月的尾款照史实付清。下一次买颜料时，阿尔泰米西娅还得临时开口催钱。'
        shift:
          p1:
            was: '1616年7月19日，阿尔泰米西娅·真蒂莱斯基获佛罗伦萨绘画艺术学院接纳。'
          p2:
            was: '1615 至 1616 年，博纳罗蒂分期支付画款，档案里还留着阿尔泰米西娅作画期间催付的信。'
            now: '下一份画约写明了预付材料款的日期，在开工以前。她可以照约定的款项订好颜料。'
            who: artemisia_florence
            bio: '她为小米开朗琪罗·博纳罗蒂的宅邸绘制《倾向的寓意》，作品至今仍属建筑装饰的一部分。入会以后，她也可以向学院的法庭提出与画业有关的争议。'
        vignettes:
          pose: '访客面对镜子，问哪种姿势看着自然。你问两种姿势各像在做什么。他选了手还能做自己的事的那一种。'
          name: '一张习作只写了画中人的描述，没留画家的名字。你把纸翻过来，请访客在收进一摞图以前把两项都写上。'
          mirror: '你挪了镜子，让访客不用扭身也能看见那个角度。他试坐一回，又自己调了一点，才开始画。'
text:
  en:
    name: Artemisia Gentileschi
    text: Italian painter, 1593 to about 1656. Trained by her father Orazio Gentileschi, she took part in a famous trial in 1612 and went on to paint strong biblical and mythological women. In 1616 she became the first woman admitted to the Academy of the Arts of Drawing in Florence.
  zh:
    name: 阿尔泰米西娅·真蒂莱斯基
    text: 意大利画家，1593 年生，约 1656 年去世。她随父亲奥拉齐奥·真蒂莱斯基学画，1612 年卷入一桩著名的审判，此后画了许多坚毅的圣经与神话女性。1616 年她成为佛罗伦萨绘画艺术学院接纳的第一位女性。
