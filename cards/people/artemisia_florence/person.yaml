- artemisia_florence
text:
  en:
    name: Artemisia Gentileschi
    text: Italian painter, 1593 to about 1656. Trained by her father Orazio Gentileschi, she took part in a famous trial in 1612 and went on to paint strong biblical and mythological women. In 1616 she became the first woman admitted to the Academy of the Arts of Drawing in Florence.
  zh:
    name: 阿尔泰米西娅·真蒂莱斯基
    text: 意大利画家，1593 年生，约 1656 年去世。她随父亲奥拉齐奥·真蒂莱斯基学画，1612 年卷入一桩著名的审判，此后画了许多坚毅的圣经与神话女性。1616 年她成为佛罗伦萨绘画艺术学院接纳的第一位女性。
