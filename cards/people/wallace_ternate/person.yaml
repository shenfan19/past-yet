    text:
      en: 'Wallace’s party embarked at Ternate on 25 March 1858 to travel to Dorey, now Manokwari, on the coast of New Guinea. Jumaat joined the expedition as a hunter.'
      zh: '1858 年 3 月 25 日，华莱士一行从特尔纳特乘船出发，前往新几内亚海岸的多雷，即今马诺夸里。朱马特作为猎手随行。'
