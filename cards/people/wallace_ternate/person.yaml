text:
  en:
    name: Alfred Russel Wallace
    text: Welsh naturalist, 1823 to 1913. While ill with fever on Ternate in 1858 he wrote out the idea of evolution by natural selection and sent it to Charles Darwin, which led to a joint presentation that year. He also mapped the faunal boundary now called Wallace's Line.
  zh:
    name: 阿尔弗雷德·拉塞尔·华莱士
    text: 威尔士博物学家，1823 年生，1913 年去世。1858 年他在特尔纳特岛发烧期间写出自然选择的进化思想并寄给查尔斯·达尔文，当年便有了联合宣读。他还划出了今天称为华莱士线的动物分界。
