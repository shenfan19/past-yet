    text:
      en:
        name: "An essay from Ternate"
        place: "Ternate"
        figure: "Alfred Russel Wallace"
        story: 'In February 1858, recovering from a bout of malaria in the Moluccas, Alfred Russel Wallace wrote an essay signed at Ternate on how varieties depart from the original type, and sent it to Charles Darwin. It reached Darwin on 18 June 1858. On 1 July it was read at the Linnean Society in London with material by Darwin; neither author was there.'
        relic: "A beetle in a pin box"
        relic_desc: "A collected beetle in a small tin box."
        points:
          p1: 'Be taken in by the household he lodges with, then pin and dry the day''s specimens'
          p2: 'In the days of the fever, keep the water boiled and the cloths changed'
          p3: 'On the day of the mail steamer, wrap the essay against the damp and see it aboard'
        vignettes:
          places: '{staff} copies the labels of the day''s birds and writes the island beside each one, so that the drawer of skins can be read without its collector.'
          claim: '{staff} sorts a tray of beetles from two islands that look alike, and keeps them in two rows with a gap between, without being asked.'
          mail: '{staff} folds the pages of a long letter inside oiled paper and ties it with a double knot, as a sailor does with a chart.'
      zh:
        name: "来自特尔纳特的论文"
        place: "特尔纳特"
        figure: "阿尔弗雷德·拉塞尔·华莱士"
        story: '1858 年 2 月，阿尔弗雷德·拉塞尔·华莱士在摩鹿加群岛一场疟疾稍退之后，写成一篇落款特尔纳特的论文，谈变种怎样偏离原型，寄给了查尔斯·达尔文。6 月 18 日，论文到了达尔文手里。7 月 1 日，它与达尔文的材料一同在伦敦林奈学会宣读，两位作者都不在场。'
        relic: "针盒里的一只甲虫"
        relic_desc: "一只收集来的甲虫，放在小锡盒里。"
        points:
          p1: '先让他借住的那户人家认下，再替他把当天的标本钉好晾干'
          p2: '他发烧那几天，烧好开水，换好湿布'
          p3: '邮船来的那天，把论文包好防潮，送上船'
        vignettes:
          places: '{staff}抄写当天鸟类标本的签条，在每张旁边写上岛名，这一抽屉皮子没有采集人在旁边也读得懂。'
          claim: '两座岛上的甲虫长得很像，{staff}把一盘甲虫分成两排，中间留出空隙，没人吩咐。'
          mail: '{staff}把一封长信的稿页包进油纸，打了个双结，像水手捆海图那样。'
text:
  en:
    name: Alfred Russel Wallace
    text: Welsh naturalist, 1823 to 1913. While ill with fever on Ternate in 1858 he wrote out the idea of evolution by natural selection and sent it to Charles Darwin, which led to a joint presentation that year. He also mapped the faunal boundary now called Wallace's Line.
  zh:
    name: 阿尔弗雷德·拉塞尔·华莱士
    text: 威尔士博物学家，1823 年生，1913 年去世。1858 年他在特尔纳特岛发烧期间写出自然选择的进化思想并寄给查尔斯·达尔文，当年便有了联合宣读。他还划出了今天称为华莱士线的动物分界。
hook: {en: 'A letter wrapped against the damp', zh: '一封包得防潮的信'}
facts:
  fever:
    date: '1858'
    stay_day: 12
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [victorianweb_wallace, mun_darwin_wallace]
    text:
      en: 'In February 1858, while suffering an attack of malaria in the Moluccas, Wallace conceived the idea and wrote the essay as soon as he was well enough.'
      zh: '1858 年 2 月，华莱士在摩鹿加群岛疟疾发作，其间想到了这个道理，病稍好便写成论文。'
    line:
      en: 'February 1858: in the Moluccas Wallace is down with malaria. As soon as he can hold a pen, he writes the essay.'
      zh: '1858 年 2 月，华莱士在摩鹿加群岛疟疾发作，病稍好便提笔写成论文。'
  signed:
    date: '1858'
    stay_day: 20
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wallace_ternate_primary, wallace_online_s043]
    text:
      en: 'The printed essay is signed Ternate, February, 1858.'
      zh: '印出的论文落款是“特尔纳特，1858 年 2 月”。'
    line:
      en: 'He signs it: Ternate, February, 1858.'
      zh: '他在稿末落款：特尔纳特，1858 年 2 月。'
  sent:
    date: '1858'
    stay_day: 60
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mun_darwin_wallace, wallace_online_s043]
    text:
      en: 'The essay left Ternate by the mail steamer; the usual account says March, while a study of 2012 argues for the steamer of April.'
      zh: '论文随邮船离开特尔纳特；传统说法是三月，2012 年的一项研究认为是四月那一班。'
    line:
      en: 'The essay leaves Ternate on the mail steamer. Whether it was the March boat or the April one is still argued over.'
      zh: '论文随邮船离开特尔纳特。坐的是三月那一班还是四月那一班，至今说法不一。'
  received:
    date: '1858-06-18'
    stay_day: 137
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [mun_darwin_wallace, wallace_online_s043]
    text:
      en: 'The essay reached Darwin at Down House on 18 June 1858.'
      zh: '1858 年 6 月 18 日，论文寄到达尔文的唐屋。'
    line:
      en: '18 June: in Kent, the essay reaches Charles Darwin at Down House.'
      zh: '6 月 18 日，在英格兰肯特郡，论文寄到了查尔斯·达尔文的唐屋。'
  read:
    date: '1858-07-01'
    stay_day: 150
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wallace_ternate_primary, mun_darwin_wallace]
    text:
      en: 'On 1 July 1858 the papers of Darwin and Wallace were read to the Linnean Society by its undersecretary; neither author was present, and Wallace was told only afterwards.'
      zh: '1858 年 7 月 1 日，林奈学会副秘书宣读了达尔文与华莱士的文章，两位作者都不在场，华莱士事后才得知。'
    line:
      en: '1 July: at the Linnean Society in London both papers are read. Neither author is in the room. Wallace hears of it only later.'
      zh: '7 月 1 日，伦敦林奈学会宣读了两人的文章。两位作者都不在场，华莱士事后才知道。'
  printed:
    date: '1858-08-20'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wallace_ternate_primary, mun_darwin_wallace]
    text:
      en: 'The joint paper was printed in the Journal of the Proceedings of the Linnean Society on 20 August 1858.'
      zh: '这篇合写的文章于 1858 年 8 月 20 日刊于《林奈学会会报》。'
    line:
      en: '20 August 1858: the joint paper is printed in the Proceedings of the Linnean Society.'
      zh: '1858 年 8 月 20 日，两人的文章合刊在《林奈学会会报》上。'
