    text:
      en:
        name: "An essay from Ternate"
        place: "Ternate"
        figure: "Alfred Russel Wallace"
        story: 'Wallace''s 1858 essay dated Ternate was read at the Linnean Society alongside material by Darwin on 1 July 1858. Their submissions can be read independently within the published communication. The packing scene is invented.'
        relic: "A beetle in a pin box"
        relic_desc: "A collected beetle in a small tin box."
        points:
          p1: 'Find a dated heading on the manuscript copy'
          p2: 'Leave the pages in order for the journey'
          p3: 'Distinguish an observation from an inference in the essay'
        vignettes:
          places: 'You find a place name copied as if it were part of a heading. The helper puts it back beside the date so a reader can see where the essay was signed.'
          claim: 'The helper reads a conclusion from what they think is an observation. You ask them to show which line actually says what was seen. They fold the copy with a marker at the distinction.'
          mail: 'You leave a short outer note and keep the manuscript pages in order inside it. The helper will be able to tell which part can travel separately.'
      zh:
        name: "来自特尔纳特的论文"
        place: "特尔纳特"
        figure: "阿尔弗雷德·拉塞尔·华莱士"
        story: '华莱士一篇署地特尔纳特的文章，于 1858 年 7 月 1 日与达尔文材料一同在林奈学会宣读。刊出的合件仍可分辨两人的文字。装寄的场景为虚构。'
        relic: "针盒里的一只甲虫"
        relic_desc: "一只收集来的甲虫，放在小锡盒里。"
        points:
          p1: '从抄本上找出带日期的题记'
          p2: '把稿页按顺序留下再寄'
          p3: '在文章里分清观察和推论'
        vignettes:
          places: '你看到署地被抄成了题目的一部分。帮手把它放回日期旁，收件人就能看明白文章在哪里署下。'
          claim: '帮手以为某句话是观察记载，念出来却是一项推论。你请他指明哪行真的写了所见，他夹着记号把抄件折好。'
          mail: '你在外头留一张短笺，里面按序放好稿页。帮手知道哪一页可以单独递给人看。'
text:
  en:
    name: Alfred Russel Wallace
    text: Welsh naturalist, 1823 to 1913. While ill with fever on Ternate in 1858 he wrote out the idea of evolution by natural selection and sent it to Charles Darwin, which led to a joint presentation that year. He also mapped the faunal boundary now called Wallace's Line.
  zh:
    name: 阿尔弗雷德·拉塞尔·华莱士
    text: 威尔士博物学家，1823 年生，1913 年去世。1858 年他在特尔纳特岛发烧期间写出自然选择的进化思想并寄给查尔斯·达尔文，当年便有了联合宣读。他还划出了今天称为华莱士线的动物分界。
