    text:
      en:
        name: "An essay from Ternate"
        place: "Ternate"
        figure: "Alfred Russel Wallace"
        story: 'In February 1858, after a bout of fever in the Moluccas, Alfred Russel Wallace wrote an essay on how varieties depart from their original type. It bears the date and place February 1858, Ternate. On 25 March Wallace sailed from Ternate with a party that included the young hunter Jumaat. They reached Dorey on the coast of New Guinea. The essay went to Charles Darwin in England; on 1 July it was read alongside Darwin’s work in London, with neither author in the room.'
        story_prose:
          opening:
            - 'The Moluccas, February 1858. After a fever, Wallace writes an essay about how varieties diverge from their original forms. He dates it at Ternate.'
            - 'In history, the essay reached England. Wallace sailed to Dorey, where he injured his ankle. Jumaat, who travelled with him, died there in June. In this branch, someone can keep watch while Wallace writes and make the crossing to Dorey.'
            - 'This trip needs someone who can stay by a sickbed and give its occupant time to rest. It also needs someone who knows wound care or brings the right supplies.'
          points:
            p1: 'When the fever lets up, {staff} stays nearby and moves the paper and water into Wallace’s reach. He writes the name of the place and pauses. {staff} catches the corner of a sheet lifting by the window.'
            p2: 'In Dorey, {staff} tends Wallace’s ankle, waits until he can bear weight and goes a few steps farther with him. The mud is still wet outside the door. Wallace steps into it, and the second print is as deep as the first.'
            p3: 'Jumaat cannot get out of bed. {staff} stays with him and uses the supplies brought along, until he can move the bowl himself. At first Jumaat holds the bowl with both hands, then lets one go. Water runs along his wrist and drips beside the bed.'
          outcomes:
            all: 'The paper eventually reached England. When the boat left Dorey, Jumaat drew his legs over the side and Wallace made room on the bench.'
            p3: 'There was room for one more on the boat in late July. Jumaat sat down with the bowl by his feet.'
            p2: 'Wallace went back into the forest while the steamer was in Dorey. A little way along, he bent down to wipe the mud from his shoe.'
            p1: 'The essay was later read in London. On opening the manuscript, the last line still said Ternate.'
          none: 'There was a table by the window. As the damp came in, the outer corner of a sheet began to curl.'
          not_admitted: '{staff} did not get a place with the party. A rope went slack at the quay and traced a line across the water.'
          desync: 'The paper by the bed lay unfinished. When {staff} was recalled, a patch of damp still marked the inside of the frame.'
          excerpts:
            p3: 'At first Jumaat holds the bowl with both hands, then lets one go. Water runs along his wrist and drips beside the bed.'
            p2: 'The mud is still wet outside the door. Wallace steps into it, and the second print is as deep as the first.'
            p1: 'He writes the name of the place and pauses. {staff} catches the corner of a sheet lifting by the window.'
        relic: "A beetle in a pin box"
        relic_desc: "A collected beetle in a small tin box."
        points:
          p1: 'In the days of the malaria, see the essay through to its end'
          p2: 'Heal the ankle he hurt at Dorey before it turns to an ulcer'
          p3: 'Save the young hunter Jumaat from the fever and the dysentery'
        points_fail:
          p1: 'The fever never broke and the draft was not finished in February. The letters the mail boat took did not hold it, and in this branch the Linnean Society had no such paper on 1 July.'
          p2: 'The wound festered as history has it, and he sat in the hut on a crutch for more than a month. In this branch the insects of the Dorey forest were still caught only by his servants.'
          p3: 'Jumaat died on 26 June as history has it, and in this branch the boat that left Dorey in July went without him.'
        shift:
          p1:
            was: 'In February 1858, as soon as the malaria eased, Wallace wrote the paper and signed it Ternate.'
          p2:
            was: 'In May 1858 Wallace hurt his ankle at Dorey; the wound turned to an ulcer and kept him off his feet for over a month.'
            now: 'The wound did not fester, and in the days the steamer was in port he went into the forest every day as before.'
          p3:
            was: 'On 26 June 1858, Jumaat, a youth of about eighteen, died at Dorey; Wallace wrote of him as a quiet lad who did his work well.'
            now: '{staff} sat with him until the fever fell and the illness stopped, and when they left Dorey at the end of July he was on the boat too.'
        vignettes:
          places: '{staff} copies the labels of the day''s birds and writes the island beside each one, so that the drawer of skins can be read without its collector.'
          claim: '{staff} sorts a tray of beetles from two islands that look alike, and keeps them in two rows with a gap between, without being asked.'
          mail: '{staff} folds the pages of a long letter inside oiled paper and ties it with a double knot, as a sailor does with a chart.'
      zh:
        name: "来自特尔纳特的论文"
        place: "特尔纳特"
        figure: "阿尔弗雷德·拉塞尔·华莱士"
        story: '1858 年 2 月，阿尔弗雷德·拉塞尔·华莱士在摩鹿加群岛发烧，退烧后写了一篇论文，谈变种怎样偏离原型。论文落款是「特尔纳特，1858 年 2 月」。3 月 25 日，他从特尔纳特乘船出发，同行的有年轻猎手朱马特，一行人抵达新几内亚海岸的多雷。论文寄到了英格兰。7 月 1 日，他与达尔文的文章在伦敦一同宣读，两位作者都不在场。'
        story_prose:
          opening:
            - '1858 年 2 月，摩鹿加群岛。华莱士在一阵高烧后写下论文，说明生物的变种怎样偏离原型。他在稿末写下特尔纳特。'
            - '史实里，论文寄到了英国，华莱士随船去了多雷，在那里伤了脚踝。同行的朱马特在六月病逝。在这条分支里，有人能在写稿时守夜，也能跟着船去多雷。'
            - '这一趟用得上能守住病榻、让人歇过一阵的人。熟悉伤口照料、带来合用药物或器材的人，也会有事做。'
          points:
            p1: '华莱士烧稍退时，{staff}守在一旁，把纸和水挪到他伸手够得着的地方。他落笔写下地名，手停了一会儿。{staff}把窗边那张已经掀起的纸用指尖按住。'
            p2: '到多雷以后，{staff}照料华莱士受伤的脚踝，等他能把脚踩稳，再陪他试着多走几步。门外泥还湿着。华莱士把鞋踏进去，第二个脚印落得和头一个一样实。'
            p3: '朱马特卧床起不来。{staff}守着他，用带来的药物或器材照料，等他能自己挪动水碗。朱马特先拿两只手捧碗，后来松开一只。碗里的水沿着他的手腕滴到床边。'
          outcomes:
            all: '论文后来到了英国。多雷的船离岸时，朱马特把腿收过船沿，华莱士留出一截长凳。'
            p3: '七月底的船上多留了一个位置。朱马特坐下来，脚边放着那只喝水的碗。'
            p2: '汽船停在多雷的那些天，华莱士又进了林子。走出一段，他弯腰掸掉鞋上的泥。'
            p1: '寄出的论文后来在伦敦宣读。展开稿纸，最后一行还留着「特尔纳特」。'
          none: '屋里剩一张靠窗的桌子。潮气上来时，最外边的纸角慢慢弯了起来。'
          not_admitted: '{staff}没能跟上这一行人。码头的缆绳松下来，在水面划了一道。'
          desync: '病床边的纸没写完。{staff}被召回时，窗框内侧还留着一小片湿。'
          excerpts:
            p3: '朱马特先拿两只手捧碗，后来松开一只。碗里的水沿着他的手腕滴到床边。'
            p2: '门外泥还湿着。华莱士把鞋踏进去，第二个脚印落得和头一个一样实。'
            p1: '他落笔写下地名，手停了一会儿。{staff}把窗边那张已经掀起的纸用指尖按住。'
        relic: "针盒里的一只甲虫"
        relic_desc: "一只收集来的甲虫，放在小锡盒里。"
        points:
          p1: '疟疾发作的那几天，护住那篇论文写完'
          p2: '治好他在多雷伤的那只脚踝，不让它溃烂'
          p3: '救下猎手朱马特，治好他的高烧和痢疾'
        points_fail:
          p1: '烧一直没退下去，二月里稿子没有写完，邮船带走的信里没有它，这条分支里 7 月 1 日的林奈学会没有这篇论文。'
          p2: '伤口照史实溃了，他在小屋里拄着拐坐了一个多月，这条分支里多雷林子里那些虫子还是只有仆人替他去捉。'
          p3: '6 月 26 日朱马特照史实病逝，这条分支里七月离开多雷的船上少了他。'
        shift:
          p1:
            was: '1858 年 2 月，华莱士疟疾稍好便提笔写成论文，稿末落款特尔纳特。'
          p2:
            was: '1858 年 5 月，华莱士在多雷伤了脚踝，伤口溃成溃疡，一个多月下不了地。'
            now: '伤口没有溃，汽船到港那些天他照旧每天进林子。'
          p3:
            was: '1858 年 6 月 26 日，十八岁上下的朱马特在多雷病逝，华莱士写他是个安静的小伙子，活干得踏实。'
            now: '{staff}守着他退了烧、止住了病，七月底离开多雷时，他也在船上。'
        vignettes:
          places: '{staff}抄下鸟类标本的签条，在每张旁补上岛名。放回最后一张时，签角卡进了抽屉的木缝。'
          claim: '{staff}把两座岛上的甲虫排成两行，给相像的那两只之间留了一指宽。合上盘盖前，还能看见那道空隙。'
          mail: '{staff}把一封长信包进油纸，像水手捆海图那样打了双结。油纸上有一点水，绳结压得很紧。'
text:
  en:
    name: Alfred Russel Wallace
    text: British naturalist born in Wales, 1823 to 1913. During his travels in the Malay Archipelago he developed an account of natural selection independently of Charles Darwin. Wallace’s essay and Darwin’s writings were presented together in 1858. Wallace also described a marked change in the distribution of animals across the archipelago; the boundary is now known as Wallace’s Line.
  zh:
    name: 阿尔弗雷德·拉塞尔·华莱士
    text: 英国博物学家，1823 年生于威尔士，1913 年去世。在马来群岛考察时，他独立于查尔斯·达尔文提出了自然选择的解释。1858 年，两人的文章在同一次会议上宣读。他还描述了群岛间动物分布的显著变化，那道分界如今称为华莱士线。
hook: {en: 'A letter wrapped against the damp', zh: '一封包得防潮的信'}
facts:
  fever:
    date: '1858-02'
    stay_day: 12
    checked: official_record
    level: careful
    use: [story, history, wiki]
    sources: [wallace_my_life_1905]
    text:
      en: 'In his autobiography Wallace recalled thinking of the idea during a bout of intermittent fever and making notes that evening.'
      zh: '华莱士在自传中回忆，他在间歇性发烧时想到这个解释，当晚就记下了要点。'
    note: 'The wording follows his retrospective account and does not assign a day or an exact island.'
    line:
      en: 'February 1858: in the Moluccas, Wallace waits for the fever to ease and makes notes for his paper.'
      zh: '1858 年 2 月，在摩鹿加群岛，华莱士等这一阵烧过去，记下了论文的要点。'
