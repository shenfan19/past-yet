    sources: [archimedes_syracuse_floating]
    text:
      en: 'For a floating body at rest, the displaced liquid has the same weight as the whole body.'
      zh: '浮体静止时排开液体的重量与整个浮体相等。'
  bath:
    date: '-25'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [archimedes_syracuse_bath]
    text:
      en: 'The Roman author tells the bath anecdote in connection with a crown commissioned by Hiero, long after Archimedes lived.'
      zh: '罗马作者把浴池轶事与希耶罗命人制作的王冠联系起来，成文远晚于阿基米德生活的年代。'
