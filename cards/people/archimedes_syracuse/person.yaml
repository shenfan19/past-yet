      points:
        - {id: p1, kind: hold, day: 40, overturns: [death], req: {"any":[{"trait":["bold","hardy"],"stat":{"constitution":7,"will":7}},{"trait":["streetwise","wanderer","cosmopolitan"],"provides":"disguise","stat":{"will":5}},{"job":["sailor","navigator","ferryman","ferry_pilot","fisher","fisherman"],"trait":["bold","calm","patient","hardy"],"stat":{"will":7}}]}}
