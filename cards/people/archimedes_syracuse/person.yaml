    text:
      en:
        name: 'The day the city fell'
        place: Syracuse, Sicily
        figure: Archimedes
        story: 'Archimedes devised machines to help defend Syracuse during the Roman siege. When the city fell in 212 BC, he was killed. Plutarch gives several versions of how it happened.'
        story_prose:
          opening:
            - 'The street cries stop on the day Syracuse falls. A neighbour stands inside with a writing tablet and asks whether you have come for the older man who draws figures. Archimedes once borrowed a board from him.'
            - 'Archimedes was killed when Roman forces took Syracuse. Ancient accounts differ about the circumstances. In this branch you can find him and stay with him until he has somewhere to spend the night.'
            - 'Send a traveller who can recognise him and ask the neighbours where he went. He can decide for himself what to do with his drawing board.'
          points:
            p1: 'Archimedes turns the board half a circle and says it still needs a line. You show him the neighbour’s old tablet so he knows someone outside can carry the drawing. He taps the frame once with a finger and hands it over. In the room where he is to stay, he asks first whether the board has arrived too.'
          outcomes:
            all: 'After the fall of the city, there is still news of Archimedes in this branch. Someone in the house sets his board beside a stool where he can sit.'
            p1: 'You stay with him until he reaches shelter. He lifts the cover from the board and can still finish the last line.'
          none: 'The neighbours hear that Archimedes was killed when the city fell. The surviving accounts will differ about the circumstances.'
          not_admitted: 'The neighbour keeps the visitor outside. Someone takes a board from the entryway before you can read the name on it.'
          excerpts:
            p1: 'In the room where he is to stay, he asks first whether the board has arrived too.'
        relic: 'A wax drawing tablet'
        relic_desc: 'A practice tablet marked with a line from the fictional neighbour’s house.'
        points:
          p1: 'Find Archimedes while the city is falling and stay with him until he reaches shelter'
        points_fail:
          p1: 'When you finally find the people who saw him last, they tell you he was killed during the fall of the city.'
        shift:
          p1:
            was: 'Archimedes was killed when Roman forces took Syracuse in 212 BC. Ancient accounts differ on the circumstances.'
            now: 'In this branch Syracuse still falls. Archimedes reaches shelter with {staff} and survives.'
            who: archimedes_syracuse
            bio: 'In this timeline Archimedes came safely through the fall of Syracuse in 212 BC and lived on.'
        vignettes:
          load: '{staff} puts the old board under the newer one and asks which drawing needs to stay legible. The neighbour points to the wax still exposed.'
          settle: 'The neighbour starts to clear the writing board from the stool. {staff} asks him to leave a place where someone can sit with it.'
          crown: '{staff} asks the neighbour to describe the board that was lent. The neighbour traces with two fingers how wide it was.'
      zh:
        name: '城破的那一天'
        place: 西西里锡拉库扎
        figure: 阿基米德
        story: '罗马围攻叙拉古时，阿基米德设计器械相助。公元前 212 年，叙拉古城破，他在城里遇害。普鲁塔克记下了几种不同的说法。'
        story_prose:
          opening:
            - '叙拉古城破那天，平日从街上传来的叫卖声停了。一个邻人抱着写字板站在门里，问你是不是来找画几何图的老人。他记得阿基米德借走过一块板。'
            - '史实里，阿基米德在罗马攻下叙拉古时遇害。古代作者记下不同经过。在这条分支里，可以找到他，陪他到能暂时安顿的地方。'
            - '找能认出他、和邻人问清去向的员工。需要带走的是还在屋里的人，他的图板由他自己决定放哪儿。'
          points:
            p1: '阿基米德把板转了半圈，说这里还少一道线。你把邻人借出的旧板拿给他，让他知道门外有人能收着这份图。他用手指在木框上点了一下，随后把自己的板交出去。到借宿的屋子里，他先问那块板是不是也到了。'
          outcomes:
            all: '这条分支在叙拉古城破之后仍留有阿基米德的消息。新屋里有人把图板放在一张能坐下来的凳旁。'
            p1: '你陪他到了暂住处。他掀起图板上的布，还能接着画最后那一道线。'
          none: '邻人只听到城破时阿基米德遇害的消息。不同的说法都没有让那个上午重来。'
          not_admitted: '邻人没把来客带进里屋。门内有人收走一块旧板，板上的名字仍看不清。'
          excerpts:
            p1: '到借宿的屋子里，他先问那块板是不是也到了。'
        relic: '留着划线的蜡板'
        relic_desc: '虚构邻人家借出的一块练习板，上面还留着一道线。'
        points:
          p1: '城破时找到阿基米德，一路陪他到能暂避的地方'
        points_fail:
          p1: '等找到最后见过他的人，你才听说他已经在城破时遇害。'
        shift:
          p1:
            was: '公元前 212 年，罗马军队攻下叙拉古，阿基米德遇害。古人的记载对经过各有说法。'
            now: '这条分支里，叙拉古仍然城破。{staff}陪阿基米德到了能暂避的地方，他活了下来。'
            who: archimedes_syracuse
            bio: '这条时间线里，阿基米德平安度过公元前 212 年叙拉古城破的那一天，活了下来。'
        vignettes:
          load: '{staff}把旧板垫在新板下面，问哪一幅图得留清楚。邻人指了指还露着的蜡面。'
          settle: '邻人要把蜡板从凳子上收走。{staff}请他留一个能拿着板坐下的位置。'
          crown: '{staff}请邻人说说借出的蜡板。对方用两根手指比了板的宽度。'
text:
  en:
    name: Archimedes
    text: Greek mathematician and inventor of Syracuse, about 287 BC to 212 BC. He worked out the volume of the sphere, the principle of buoyancy and the law of the lever. He was killed when Roman forces took the city.
  zh:
    name: 阿基米德
    text: 叙拉古的希腊数学家与发明家，约公元前 287 年生，公元前 212 年去世。他求出了球体积，提出浮力原理和杠杆定律。罗马军队攻陷叙拉古时他被杀。
hook: {en: 'Can you reach him before the streets empty?', zh: '街上人都散了，你还找得到他吗？'}
facts:
  siege:
    date: '-213'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [archimedes_syracuse_plutarch, archimedes_syracuse_wiki]
    text:
      en: 'From 213 BC Roman forces besieged Syracuse by land and sea, and machines devised by Archimedes kept them from the walls.'
      zh: '公元前 213 年起，罗马军队从海陆两面围攻叙拉古，阿基米德设计的器械让他们近不了城墙。'
    line:
      en: 'Syracuse: the city holds out against the Roman siege.'
      zh: '叙拉古，城中顶住罗马军队的围攻。'
  death:
    date: '-212'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [archimedes_syracuse_plutarch, archimedes_syracuse_wiki]
    text:
      en: 'Archimedes was killed when Syracuse fell in 212 BC. Ancient sources give different accounts of his death.'
      zh: '公元前 212 年叙拉古城破，阿基米德遇害。古代文献对遇害经过的记述不同。'
    line:
      en: 'Syracuse: the city is taken, and Archimedes is killed.'
      zh: '叙拉古城破，阿基米德遇害。'
  floating:
    date: '-250'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [archimedes_syracuse_floating]
    text:
      en: 'For a floating body at rest, the displaced liquid has the same weight as the whole body.'
      zh: '浮体静止时排开液体的重量与整个浮体相等。'
  bath:
    date: '-25'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [archimedes_syracuse_bath]
    text:
      en: 'The Roman author tells the bath anecdote in connection with a crown commissioned by Hiero, long after Archimedes lived.'
      zh: '罗马作者把浴池轶事与希耶罗命人制作的王冠联系起来，成文远晚于阿基米德生活的年代。'
