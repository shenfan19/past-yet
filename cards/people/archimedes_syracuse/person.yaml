    text:
      en:
        name: 'The day the city fell'
        place: Syracuse, Sicily
        figure: Archimedes
        story: 'Archimedes devised machines to help defend Syracuse during the Roman siege. When the city fell in 212 BC, he was killed. Plutarch gives several versions of how it happened.'
        relic: 'A marked toy hull'
        relic_desc: 'A practice hull from the fictional workshop.'
        points:
          p1: 'Find Archimedes while the city is falling and stay with him until he reaches shelter'
        points_fail:
          p1: 'When you finally find the people who saw him last, they tell you he was killed during the fall of the city.'
        shift:
          p1:
            was: 'Archimedes was killed when Roman forces took Syracuse in 212 BC. Ancient accounts differ on the circumstances.'
            now: 'In this branch Syracuse still falls. Archimedes reaches shelter with {staff} and survives.'
            who: archimedes_syracuse
            bio: 'In this timeline Archimedes came safely through the fall of Syracuse in 212 BC and lived on.'
        vignettes:
          load: 'Tyche expects the wide boat to send more water over the rim. You give both boats equal total weight. The wider hull sits shallower and the two catches balance. She keeps both boats instead of cutting down the larger one to match the smaller.'
          settle: 'Nikon has to return the basin before the workshop closes. He starts the second trial while the first catch is still sloshing. You send Tyche to return the weights and use the time to let the bowl settle. Nikon weighs the water again. He leaves with a second reading and still gets the basin back.'
          crown: 'You ask Nikon whether Archimedes ever tested a king’s crown in a bath. He looks down at the two toy boats and asks whose crown you could put on the scale. You have the tale a Roman author will tell long after this workshop. You leave with the mark from the trial you can actually repeat.'
      zh:
        name: '城破的那一天'
        place: 西西里锡拉库扎
        figure: 阿基米德
        story: '罗马围攻叙拉古时，阿基米德设计器械相助。公元前 212 年，叙拉古城破，他在城里遇害。普鲁塔克记下了几种不同的说法。'
        relic: '留着吃水线的小舟'
        relic_desc: '工坊里拿来练习的小舟。'
        points:
          p1: '城破时找到阿基米德，一路陪他到能暂避的地方'
        points_fail:
          p1: '等找到最后见过他的人，你才听说他已经在城破时遇害。'
        shift:
          p1:
            was: '公元前 212 年，罗马军队攻下叙拉古，阿基米德遇害。古人的记载对经过各有说法。'
            now: '这条分支里，叙拉古仍然城破。{staff}陪阿基米德到了能暂避的地方，他活了下来。'
            who: archimedes_syracuse
            bio: '这条时间线里，阿基米德平安度过公元前 212 年叙拉古城破的那一天，活了下来。'
        vignettes:
          load: '堤刻以为宽舟会挤出更多水。你把两只舟配到同样重。宽舟吃水浅一些，接到的两份水却一样重。她把两只舟都留下了，原本还想把大的削成小的那样。'
          settle: '尼孔关坊前得还水盆，头一回接的水还在晃，就要做第二回。你请堤刻先去还砝码，趁空等水静下来。尼孔又称了一次，走时多带走一次读数，水盆也赶得及还。'
          crown: '你问尼孔，阿基米德是不是在浴池里验过国王的冠。他低头看看两只小舟，问你有哪一顶冠可以拿来上秤。你知道的是很久以后罗马人会讲的故事。带走的，是这盆水还能重做一遍的刻痕。'
text:
  en:
    name: Archimedes
    text: Greek mathematician and inventor of Syracuse, about 287 BC to 212 BC. He worked out the volume of the sphere, the principle of buoyancy and the law of the lever. He was killed when Roman forces took the city.
  zh:
    name: 阿基米德
    text: 叙拉古的希腊数学家与发明家，约公元前 287 年生，公元前 212 年去世。他求出了球体积，提出浮力原理和杠杆定律。罗马军队攻陷叙拉古时他被杀。
hook: {en: 'Can you reach him before the streets empty?', zh: '街上人都散了，你还找得到他吗？'}
facts:
  siege:
    date: '-213'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [archimedes_syracuse_plutarch, archimedes_syracuse_wiki]
    text:
      en: 'From 213 BC Roman forces besieged Syracuse by land and sea, and machines devised by Archimedes kept them from the walls.'
      zh: '公元前 213 年起，罗马军队从海陆两面围攻叙拉古，阿基米德设计的器械让他们近不了城墙。'
    line:
      en: 'Syracuse: the city holds out against the Roman siege.'
      zh: '叙拉古，城中顶住罗马军队的围攻。'
  death:
    date: '-212'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [archimedes_syracuse_plutarch, archimedes_syracuse_wiki]
    text:
      en: 'Archimedes was killed when Syracuse fell in 212 BC. Ancient sources give different accounts of his death.'
      zh: '公元前 212 年叙拉古城破，阿基米德遇害。古代文献对遇害经过的记述不同。'
    line:
      en: 'Syracuse: the city is taken, and Archimedes is killed.'
      zh: '叙拉古城破，阿基米德遇害。'
  floating:
    date: '-250'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [archimedes_syracuse_floating]
    text:
      en: 'For a floating body at rest, the displaced liquid has the same weight as the whole body.'
      zh: '浮体静止时排开液体的重量与整个浮体相等。'
  bath:
    date: '-25'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [archimedes_syracuse_bath]
    text:
      en: 'The Roman author tells the bath anecdote in connection with a crown commissioned by Hiero, long after Archimedes lived.'
      zh: '罗马作者把浴池轶事与希耶罗命人制作的王冠联系起来，成文远晚于阿基米德生活的年代。'
