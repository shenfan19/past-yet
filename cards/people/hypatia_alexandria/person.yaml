    text:
      en:
        name: 'Alexandria, that March'
        place: Alexandria
        figure: Hypatia
        story: 'Early in 415 Hypatia still teaches mathematics and philosophy in Alexandria, and the city magistrates come to hear her. Between the prefect of the city and another faction a feud grows sharper by the week, and she is drawn into it through her ties to the prefect.'
        relic: 'A sketched float scale'
        relic_desc: 'A fictional workshop sketch showing where the mark is read.'
        points:
          p1: 'Before the worst of that March, persuade her to leave Alexandria for a while, or to take another road on the day, and save her'
        points_fail:
          p1: 'She goes about the city as before, and in this branch too she is killed that March.'
        shift:
          p1:
            was: 'March 415: Hypatia, mathematician and philosopher, was killed in Alexandria in the unrest of the city.'
            now: 'That March she was away from the city. When things grew quiet she came back to Alexandria and went on teaching.'
            who: hypatia_alexandria
            bio: 'In this timeline Hypatia listened and left Alexandria before March 415, came through that spring, and later went back to teaching in the city.'
        vignettes:
          scale: 'Timon holds his thumb over the mark and calls it the result. Nysa takes a reading from where the float meets the surface. You ask them to put down the tube and look again while it stands free. This time they read the same mark. Nysa adds where they were standing to the record.'
          copy: 'Nysa has one side of a tablet left and wants to copy the result in large letters. You fit the observation on the top half and let her draw the cylinder below it. The next reader will have both the result and a place to look for it on the instrument.'
          name: 'You could offer a future name for the device. Timon has a cloth in one hand and is about to lift the float out of the cup. You use the last quiet moment to ask Nysa for one independent reading. You leave without seeing what the recipient makes of the finished instrument.'
      zh:
        name: '那年三月的亚历山大'
        place: 亚历山大
        figure: 希帕提娅
        story: '415 年初，希帕提娅仍在亚历山大讲授数学与哲学，城里的官员也来听她讲。城中长官与另一股势力的积怨一周比一周深，她因与长官往来，被卷进了这场争执。'
        relic: '一张浮标刻线图'
        relic_desc: '试验台的刻线图，画出了从哪里读数。'
        points:
          p1: '三月风声最紧之前，劝她暂离亚历山大，或那天改走别的路，救下她'
        points_fail:
          p1: '她照旧在城里来往，这条分支里，那个三月她仍然遇害。'
        shift:
          p1:
            was: '415 年 3 月，数学家、哲学家希帕提娅在亚历山大城中的动荡里遇害。'
            now: '那个三月她不在城里，等局势平静下来，才回到亚历山大接着讲课。'
            who: hypatia_alexandria
            bio: '这条时间线里，希帕提娅听了劝，415 年三月之前离开亚历山大，躲过了那个春天，后来回城继续教书。'
        vignettes:
          scale: '提蒙用拇指按住一道刻线，说这就是结果。妮萨照浮标接触液面的位置读。你请他们松开手，等浮标自己立稳再看一遍。这次两人报的是同一格。妮萨把读数时站的位置也写了进去。'
          copy: '妮萨只剩一面蜡板，原想用大字把结果一抄。你把观察写在上半边，留给她在下面画仪器。下一个读到的人，既有读数，也有图可循，知道刻线该从哪里看。'
          name: '你原可以讲讲后世怎么称呼这件器具。提蒙已一手拿布，要把浮标从杯里提出去。你趁最后这点安静，请妮萨自己再读一次。收信人拿到成品后会怎样用，你已看不到了。'
text:
  en:
    name: Hypatia
    text: Greek mathematician and philosopher, about 355 to 415, who taught in Alexandria. She commented on works of mathematics and astronomy. She was killed in March 415 in the unrest of the city.
  zh:
    name: 希帕提娅
    text: 希腊数学家与哲学家，约 355 年生，415 年去世，在亚历山大教学。她为数学与天文学著作作注。415 年 3 月，她在城中的动荡里遇害。
hook: {en: 'Two readers see two marks on one float.', zh: '同一根浮标，两人读出两格。'}
facts:
  teaching:
    date: '0415'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_romana]
    text:
      en: 'Hypatia taught philosophy in Alexandria to students who came from far away, and she often appeared before the city magistrates.'
      zh: '希帕提娅在亚历山大讲授哲学，有学生远道而来；她也常在城中官员面前出现。'
    line:
      en: 'Early 415: Hypatia still teaches in Alexandria, and the magistrates of the city come to hear her.'
      zh: '415 年初，希帕提娅仍在亚历山大讲学，城里的官员也来听她讲。'
  feud:
    date: '0415'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_ebsco]
    text:
      en: 'Her ties to the prefect of the city drew her into the feud between him and another faction in Alexandria.'
      zh: '她与城中长官往来，因此被卷进长官与城中另一股势力的争执。'
    line:
      en: 'The feud between the prefect and another faction of the city grows sharper, and Hypatia is drawn into it.'
      zh: '城中长官与另一股势力的积怨越来越深，希帕提娅被卷了进去。'
  death:
    date: '0415-03'
    stay_day: 73
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_romana]
    text:
      en: 'In March 415 Hypatia was killed in Alexandria in the unrest of the city.'
      zh: '415 年 3 月，希帕提娅在亚历山大城中的动荡里遇害。'
    note: 'Death: written as a plain fact, no perpetrator and no manner.'
    line:
      en: 'March 415: Hypatia is killed in Alexandria.'
      zh: '415 年 3 月，希帕提娅在亚历山大遇害。'
  hydroscope:
    date: '0400'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [hypatia_alexandria_hydroscope]
    text:
      en: 'The late antique letter requests an instrument from Hypatia and describes its vertical markings and upright flotation. The year gives the approximate setting, rather than a dated delivery.'
      zh: '晚期古代书信向希帕提娅求制仪器，描述器具直立漂浮和竖排刻线。'
