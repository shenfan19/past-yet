events:
  hypatia_alexandria:
    order: 10
    build_step: 4
    ready: true
    year: 415
    date: '0415-01-01'
    stay: 3
    lon: 29.93
    lat: 31.21
    region: africa
    field: math
    tier: 2
    channels: {S: 3}
    refs: [hypatia_alexandria_socrates, hypatia_alexandria_romana, hypatia_alexandria_ebsco, hypatia_alexandria_hydroscope]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 60, overturns: [death], req: {"any":[{"trait":["charismatic","glib","cosmopolitan"],"stat":{"wit":5,"will":6}},{"trait":["scholarly"],"stat":{"wit":8,"will":5}},{"item":"golden_apple","stat":{"will":6}}]}}
      vignettes:
        - {id: scale, traits: [methodical, curious, skeptical]}
        - {id: copy, traits: [scholarly, quiet, attached]}
        - {id: name}
    text:
      en:
        name: 'Alexandria, that March'
        place: Alexandria
        figure: Hypatia
        story: 'Early in 415 Hypatia still teaches mathematics and philosophy in Alexandria, and the city magistrates come to hear her. Between the prefect of the city and another faction a feud grows sharper by the week, and she is drawn into it through her ties to the prefect.'
        story_prose:
          opening:
            - 'Morning teaching has just ended in Alexandria. A student leaves a marked wooden strip on the table and asks Hypatia if they should come to the same room tomorrow. The talk in the street has changed. She had meant to teach here as usual.'
            - 'Hypatia was killed in Alexandria in March 415. Late-antique accounts also record her reputation for teaching philosophy in public. This branch can give her a reason to change her plans and stay with someone willing to receive her.'
            - 'Send a traveller who can hear out her students and talk over the new arrangements with their teacher. She needs to agree on where to go and choose someone to take back the borrowed books.'
          points:
            p1: 'Hypatia asks who is still waiting for a book she promised to lend. You ask her to name someone who can handle the loans, then explain which friend has offered her a room. She writes the unfinished question on the back of the wooden strip and hands it to the student still by the table. Later that day books are still returned, and their teacher is already at her friend’s house.'
          outcomes:
            all: 'Someone in the friend’s house asks her to finish the problem. This branch still has a record of her teaching in March.'
            p1: 'She agrees to change the day’s plans and reaches the friend who opens the door for her. The teaching table stands empty for a while.'
          none: 'A student comes to return the marked strip and hears that Hypatia has been killed. He sets it where he sat for the last lesson.'
          not_admitted: 'The student closes the list of people borrowing books. The visitor’s name was never entered, and the strip stays on the table when the door shuts.'
          excerpts:
            p1: 'Later that day books are still returned, and their teacher is already at her friend’s house.'
        relic: 'A marked wooden strip'
        relic_desc: 'A fictional teaching aid with part of a problem on its back.'
        points:
          p1: 'Before the worst of that March, persuade her to leave Alexandria for a while, or to take another road on the day, and save her'
        points_fail:
          p1: 'She goes about the city as before, and in this branch too she is killed that March.'
        shift:
          p1:
            was: 'March 415: Hypatia, mathematician and philosopher, was killed in Alexandria in the unrest of the city.'
            now: 'That March she was away from the city. When things grew quiet she came back to Alexandria and went on teaching.'
            who: hypatia_alexandria
            bio: 'In this timeline Hypatia listened and left Alexandria before March 415, came through that spring, and later went back to teaching in the city.'
        vignettes:
          scale: 'The student points to the wrong mark on the wooden strip. {staff} asks him to show where his count began. He moves his finger one place back.'
          copy: '{staff} asks which books have still to be returned and writes their names where the next student can find them.'
          name: '{staff} checks with the student where to take a borrowed volume if the room is closed. The student folds the answer into its cover.'
      zh:
        name: '那年三月的亚历山大'
        place: 亚历山大
        figure: 希帕提娅
        story: '415 年初，希帕提娅仍在亚历山大讲授数学与哲学，城里的官员也来听她讲。城中长官与另一股势力的积怨一周比一周深，她因与长官往来，被卷进了这场争执。'
        story_prose:
          opening:
            - '亚历山大港的早课刚散，有个学生把画着刻度的木片留在桌上。他问希帕提娅，明天还到这一间吗。街上传的话已经变了，她本来打算像往常一样来讲课。'
            - '史实里，415 年三月希帕提娅在亚历山大遇害。晚古代记述同时留下她公开讲授哲学的声名。这条分支可以请她暂别平常的行程，先到愿留她住的人家。'
            - '能听懂学生顾虑并与老师谈成安排的员工有用。新的会面点要让她自己同意，再把归还借书的事托付给人。'
          points:
            p1: '希帕提娅先问谁还没拿到答应借读的书。你请她挑出一个能代为交接的人，然后把一位朋友愿让她借住的消息说清。她把没讲完的题目写到木片背面，交给还站在桌边的学生。那天晚些时候，借出去的书仍有人送还，老师已经到了朋友家。'
          outcomes:
            all: '朋友屋里有人请她接着讲那道未完的题。这个分支的三月留下了她讲课的记录。'
            p1: '她同意改动那天的行程，到了愿意把门打开的朋友家。原来的讲桌暂时空着。'
          none: '几天后，学生来还刻度板，听到希帕提娅已经遇害。他把木片放在最后一次听课的位置。'
          not_admitted: '学生收好借书人的名单。他没有在名单上找到来客，教室关门后，木片仍在桌上。'
          excerpts:
            p1: '那天晚些时候，借出去的书仍有人送还，老师已经到了朋友家。'
        relic: '一片带刻线的木片'
        relic_desc: '虚构的授课用具，背面写着没讲完的题。'
        points:
          p1: '三月风声最紧之前，劝她暂离亚历山大，或那天改走别的路，救下她'
        points_fail:
          p1: '她照旧在城里来往，这条分支里，那个三月她仍然遇害。'
        shift:
          p1:
            was: '415 年 3 月，数学家、哲学家希帕提娅在亚历山大城中的动荡里遇害。'
            now: '那个三月她不在城里，等局势平静下来，才回到亚历山大接着讲课。'
            who: hypatia_alexandria
            bio: '这条时间线里，希帕提娅听了劝，415 年三月之前离开亚历山大，躲过了那个春天，后来回城继续教书。'
        vignettes:
          scale: '学生指错了木片上的刻线。{staff}问他从哪里开始数，他把手指往回挪了一格。'
          copy: '{staff}问还有哪几册书没还，写下名字，放在下一个学生也能找到的地方。'
          name: '{staff}问学生教室关门后到哪儿还书。学生把写好地址的纸夹进封里。'
text:
  en:
    name: Hypatia
    text: Greek mathematician and philosopher, about 355 to 415, who taught in Alexandria. She commented on works of mathematics and astronomy. She was killed in March 415 in the unrest of the city.
  zh:
    name: 希帕提娅
    text: 希腊数学家与哲学家，约 355 年生，415 年去世，在亚历山大教学。她为数学与天文学著作作注。415 年 3 月，她在城中的动荡里遇害。
hook: {en: 'Two readers see two marks on one float.', zh: '同一根浮标，两人读出两格。'}
facts:
  teaching:
    date: '0415'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_romana]
    text:
      en: 'Hypatia taught philosophy in Alexandria to students who came from far away, and she often appeared before the city magistrates.'
      zh: '希帕提娅在亚历山大讲授哲学，有学生远道而来；她也常在城中官员面前出现。'
    line:
      en: 'Early 415: Hypatia still teaches in Alexandria, and the magistrates of the city come to hear her.'
      zh: '415 年初，希帕提娅仍在亚历山大讲学，城里的官员也来听她讲。'
      zh-Hant: '415 年初，希帕提婭仍在亞歷山大講學，城裡的官員也來聽她講。'
      fr: 'Début 415 : Hypatie enseigne toujours à Alexandrie, et les magistrats de la ville viennent l''entendre.'
      es: 'Principios de 415: Hipatia todavía enseña en Alejandría y los magistrados de la ciudad vienen a escucharla.'
      ja: '415 年初頭: ヒュパティアは今でもアレクサンドリアで教えており、市の判事たちが彼女の話を聞きに来ます。'
      ko: '415년 초: 히파티아는 여전히 알렉산드리아에서 가르치고 있으며, 도시의 행정관들이 그녀의 말을 들으러 옵니다.'
      ru: 'Начало 415 г.: Гипатия все еще преподает в Александрии, и магистраты города приходят послушать ее.'
  feud:
    date: '0415'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_ebsco]
    text:
      en: 'Her ties to the prefect of the city drew her into the feud between him and another faction in Alexandria.'
      zh: '她与城中长官往来，因此被卷进长官与城中另一股势力的争执。'
    line:
      en: 'The feud between the prefect and another faction of the city grows sharper, and Hypatia is drawn into it.'
      zh: '城中长官与另一股势力的积怨越来越深，希帕提娅被卷了进去。'
      zh-Hant: '城中長官與另一股勢力的積怨越來越深，希帕提婭被捲了進去。'
      fr: 'La querelle entre le préfet et une autre faction de la ville s''aggrave et Hypatie s''y retrouve entraînée.'
      es: 'La disputa entre el prefecto y otra facción de la ciudad se agudiza y Hypatia se ve envuelta en ella.'
      ja: '知事と街の別の派閥との間の争いは激化し、ヒュパティアはその争いに巻き込まれていく。'
      ko: '지사와 도시의 다른 세력 사이의 불화가 더욱 날카로워지고 히파티아도 그 불화에 빠져들게 됩니다.'
      ru: 'Вражда между префектом и другой фракцией города обостряется, и в нее втягивается Гипатия.'
  death:
    date: '0415-03'
    stay_day: 73
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [hypatia_alexandria_socrates, hypatia_alexandria_romana]
    text:
      en: 'In March 415 Hypatia was killed in Alexandria in the unrest of the city.'
      zh: '415 年 3 月，希帕提娅在亚历山大城中的动荡里遇害。'
    note: 'Death: written as a plain fact, no perpetrator and no manner.'
    line:
      en: 'March 415: Hypatia is killed in Alexandria.'
      zh: '415 年 3 月，希帕提娅在亚历山大遇害。'
      zh-Hant: '415 年 3 月，希帕提婭在亞歷山大遇害。'
      fr: 'Mars 415 : Hypatie est tuée à Alexandrie.'
      es: 'Marzo de 415: Hipatia es asesinada en Alejandría.'
      ja: '415年3月：ヒュパティアがアレクサンドリアで殺害される。'
      ko: '415년 3월: 히파티아가 알렉산드리아에서 살해됨.'
      ru: 'Март 415 г.: Гипатия убита в Александрии.'
  hydroscope:
    date: '0400'
    checked: official_record
    level: usable
    use: [wiki]
    sources: [hypatia_alexandria_hydroscope]
    text:
      en: 'The late antique letter requests an instrument from Hypatia and describes its vertical markings and upright flotation. The year gives the approximate setting, rather than a dated delivery.'
      zh: '晚期古代书信向希帕提娅求制仪器，描述器具直立漂浮和竖排刻线。'
