      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 60, req: {"any":[{"trait":["charismatic","glib","cosmopolitan"],"stat":{"wit":5,"will":6}},{"trait":["scholarly"],"stat":{"wit":8,"will":5}},{"item":"golden_apple","stat":{"will":6}}]}}
