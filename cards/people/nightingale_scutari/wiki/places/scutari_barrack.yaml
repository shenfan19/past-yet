text:
  en:
    name: Barrack Hospital, Scutari, 1855
    text: A large army barracks on the Asian shore of the Bosphorus, used as a hospital in the Crimean War. In the winter of 1854 to 1855 it was crowded and its sewers were blocked. The Barrack Hospital in the game is a ward model of about four hundred patients.
  zh:
    name: 斯库塔里兵营医院，1855
    text: 博斯普鲁斯海峡亚洲一侧的一座大型兵营，克里米亚战争中用作医院。1854 年到 1855 年冬天这里拥挤不堪，下水道堵塞。游戏里的兵营医院是一个约四百名病人的病房模型。
