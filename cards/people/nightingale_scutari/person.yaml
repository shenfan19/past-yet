    text:
      en:
        name: Nursing as a discipline of data and care
        place: Scutari, Ottoman Empire
        figure: Florence Nightingale
        story: 'Florence Nightingale''s 1858 report on army health drew on the recent war and included hospital statistics. it is not the creation of the eventual report.'
        story_prose:
          opening:
            - 'A ward has just changed shifts in Scutari. Nightingale hands the clerk a list of transfers and asks him to keep it apart from new admissions. The Sanitary Commission has arrived and three commissioners are about to begin looking around.'
            - 'The Sanitary Commission inspected Scutari’s hospitals in March 1855. Hector Gavin died in an accident at Balaklava in April. Nightingale became severely ill there in May and recovered from the immediate illness, with poor health thereafter. Here you can preserve the inspection and change what happens to them.'
            - 'Someone familiar with ward records can help the inspection move on. In camp, have a traveller look out for Gavin. Later, someone providing care can ask Nightingale how she wants to rest.'
          points:
            p1: 'A clerk counts a list of transfers as new admissions. You have the nurse read from both sheets and mark the duplicates before the commissioners reach the door. They can follow the report to the ward with a problem before asking about the next place. Someone comes out with two separate books, each still with many blank pages.'
            p2: 'Gavin is about to hand the revolver to his brother at the tent. You ask both to pause until the person responsible for camp safety comes to take it. At the table inside, Gavin opens the sanitary notes he was about to take away. When someone needs his signature that afternoon, he is still at the same table.'
            p3: 'Nightingale sends for a table of figures and asks for it to be put aside when it comes. You ask whether she wants the office caregiver to stay and tell the people expecting an answer to come another day. When she feels stronger, she first asks them to open the window a little. Then she asks where she left off. The next time she opens the report, nobody insists that she finish signing it at once.'
          outcomes:
            all: 'The inspection continues on time. Gavin survives the accident in this branch, and Nightingale recovers from the May illness. She goes back to work at a pace she can choose.'
            p1: 'The commission begins its inspection and takes away usable lists for its further work.'
            p2: 'Gavin remains safely in camp. He can continue the work recorded in his sanitary notes.'
            p3: 'Nightingale recovers sooner in this branch. She chooses when she is ready to open the figures again.'
          none: 'Lists remain mixed in the ward for a while. The people awaiting news will still wait for the letters of April and May.'
          not_admitted: 'The porter asks people outside the inspection party to wait. You hear the nurse check the transfer list again.'
          desync: 'The inspection does not begin on time. The ward records fall out of sync and the office recalls the traveller.'
          excerpts:
            p1: 'Someone comes out with two separate books, each still with many blank pages.'
            p2: 'When someone needs his signature that afternoon, he is still at the same table.'
            p3: 'The next time she opens the report, nobody insists that she finish signing it at once.'
        relic: A small oil lamp
        relic_desc: The lamp from her night rounds.
        points:
          p1: 'Through the typhus and cholera on the wards, keep the Sanitary Commission’s inspection of the Scutari hospitals going from 6 March'
          p2: 'Stop the revolver going off in the tent at Balaklava and save the sanitary commissioner Hector Gavin'
          p3: 'Cure the Crimean fever Nightingale catches at Balaklava in May, before it can stay with her for the rest of her life'
        points_fail:
          p1: 'The inspection stalls in the sick wards and the blocked sewers are not opened in time. This branch falls out of step with history and the office recalls the employee.'
          p2: 'The shot is fired in the tent, and in this branch too the commission loses one of its three members a month after landing.'
          p3: 'The fever runs its course. She is out of danger by the end of May, but in this branch, as in history, the illness stays with her.'
        shift:
          p1:
            was: 'On 6 March 1855 the Sanitary Commission reached Constantinople and began that afternoon to examine the hospitals at Scutari.'
          p2:
            was: 'On 21 April 1855 the sanitary commissioner Hector Gavin was killed in the Crimea when his revolver went off as he handed it to his brother.'
            now: '{staff} asks both men to pause. Gavin sets the revolver down and calls for the person responsible for camp safety. He continues the commission’s work and later returns to Britain.'
          p3:
            was: 'In May 1855 Nightingale went to inspect the hospitals at Balaklava and caught Crimean fever within days; she was dangerously ill for about twelve days, and was an invalid for much of her later life.'
            now: '{staff} treats the fever in its first days with medicine the century does not have. Nightingale is on her feet within the week and goes back to Scutari without the illness that followed her home.'
            who: nightingale_scutari
            bio: 'In this branch Nightingale was cured of the fever she caught at Balaklava in 1855. She carried her work on hospitals and army health in person, on her feet rather than from a sickroom.'
        vignettes:
          totals: 'A fictional clerk adds the transfer list to the admissions total. You ask which names are newly admitted. They leave the transfers in their own column before sending the return.'
          name: 'The clerk cannot hear a name over the room''s noise. You wait beside the person who gave it until they can say it again. The next copy spells it as they asked.'
          fold: 'You set the ward papers in the order the clerk calls out. The sheet that used to appear after the total now arrives before it.'
      zh:
        name: 把护理做成用数据和关怀的学科
        place: 奥斯曼斯库塔里
        figure: 弗洛伦斯·南丁格尔
        story: '弗洛伦斯·南丁格尔 1858 年的军队卫生报告依据战时经验，收入医院统计。'
        story_prose:
          opening:
            - '斯库塔里，病房刚换了一次班。南丁格尔把一份转房名单递给门边的人，请他先和今天新收的人分开。卫生委员会抵达的消息已送来，三位委员正要开始查看。'
            - '卫生委员会 1855 年 3 月到斯库塔里查看医院，赫克托·加文四月在巴拉克拉瓦死于一次意外。南丁格尔五月在当地重病，后来脱险，健康长期受影响。这趟可让查看继续，也可改写两人的病险。'
            - '让懂病房交接的人护住查访记录。能照应营地的人先关照加文的安全。后来照护南丁格尔的人，要问她愿意怎样休息。'
          points:
            p1: '一名书记把换病房的人算作新入院。你请值班护士拎着两份单子读回一遍，在委员会的人到门口前指出哪些是重复的。查访人员沿记录先去了有问题的病房，才问下一个地方。有人带着分开的两册出来，两册都还有许多空页。'
            p2: '加文站在营帐口，准备把手里的左轮交给弟弟。你请两个人暂时停一下，让负责营地安全的人来接手。等他们坐回帐里的桌旁，加文把本来要带走的卫生记录重新打开。下午再有人找他签字，他还坐在那一张桌边。'
            p3: '南丁格尔还托人送来要看的表，等表真正到了又请人先收起。你问她愿不愿意让事务所照护者留下，叫忙着等答复的人改天再来。她有多些力气时，先说房里可以开一点窗，然后才问原先到哪页。等她再次摊开那张表，家里没有人催她马上签完。'
          outcomes:
            all: '查看按期继续，加文免于那次意外，南丁格尔也在分支里从五月的病中恢复。她后来继续工作，按自己的体力决定每天做多少。'
            p1: '委员会顺利开始查看，记录带回去供他们继续处理。'
            p2: '加文平安留在营地。他手头那份卫生记录还有机会继续整理。'
            p3: '南丁格尔在这条分支恢复得更快。她自己选定哪天再展开报表。'
          none: '病房单子被混放了一阵。那些等消息的人仍分别等四月和五月的来信。'
          not_admitted: '门房请不在查访名单的人在外间等。你听见护士再次核对转房名单。'
          desync: '查看没有按期开始。护理与卫生记录脱节，事务所召回员工。'
          excerpts:
            p1: '有人带着分开的两册出来，两册都还有许多空页。'
            p2: '下午再有人找他签字，他还坐在那一张桌边。'
            p3: '等她再次摊开那张表，家里没有人催她马上签完。'
        relic: 一盏小油灯
        relic_desc: 她夜里查房时用的那盏灯。
        points:
          p1: '在病房的伤寒和霍乱里，护住卫生委员会 3 月 6 日起对斯库塔里各医院的查看'
          p2: '在巴拉克拉瓦的帐篷里拦下走火的左轮枪，救下卫生委员赫克托·加文'
          p3: '治好南丁格尔 5 月在巴拉克拉瓦染上的克里米亚热，不让这场病跟她一辈子'
        points_fail:
          p1: '查看在病房里拖住，堵着的下水道没能及时打开。这条分支与历史脱节，员工被送回。'
          p2: '帐篷里那一枪还是响了，这条分支里委员会登岸一个月就少了一位委员。'
          p3: '热病照原样走完。五月底她脱离了危险，这条分支里这场病和历史上一样留在她身上。'
        shift:
          p1:
            was: '1855 年 3 月 6 日，卫生委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。'
          p2:
            was: '1855 年 4 月 21 日，卫生委员赫克托·加文在克里米亚把左轮枪递给弟弟时枪走了火，中弹身亡。'
            now: '{staff}请两人先停一下。加文放下左轮，请负责营地安全的人接手。他继续做委员会的事，后来回到英国。'
          p3:
            was: '1855 年 5 月，南丁格尔去巴拉克拉瓦查看医院，几天内染上克里米亚热，病危约十二天，此后大半生病弱。'
            now: '{staff}在发病头几天用这个世纪还没有的药治住了热病。南丁格尔一周内下了床，回到斯库塔里，那场跟她回家的病没有留下。'
            who: nightingale_scutari
            bio: '在这条分支里，南丁格尔 1855 年在巴拉克拉瓦染上的热病被治好。她关于医院和军队卫生的工作，是自己站着去做的，不是在病榻上做的。'
        vignettes:
          totals: '虚构书记员把转房名单也算进新收治人数。你问哪些名字是刚入院的。他另留一栏记转房，再把报表送出去。'
          name: '书记员隔着嘈杂声没听清名字。你在报名字的人身旁等他再说一遍，下一份抄件就照他给的拼法写。'
          fold: '书记员念哪一处，你就按顺序放哪一页。原来夹在合计后面那张，这次先送到了他手里。'
text:
  en:
    name: Florence Nightingale
    text: English nurse and statistician, 1820 to 1910. In 1854 she led nurses to the British military hospital at Scutari during the Crimean War, improved sanitation, and used charts to show that disease killed more soldiers than wounds.
  zh:
    name: 弗洛伦斯·南丁格尔
    text: 英国护士与统计学家，1820 年生，1910 年去世。1854 年克里米亚战争期间，她带领护士到斯库塔里的英军医院，改善卫生，并用图表说明病死的士兵比战死的多。
