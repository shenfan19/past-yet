era_text:
  en:
    name: Scutari Barrack Hospital, 1855
    short: Scutari
    place_name: Barrack Hospital, Scutari
    tags:
      - medical
      - infection
      - hospital
      - c19
      - istanbul
      - history
    event_titles:
      expedition_handoff: 'Two wards, one bundle of slips'
      door_block: Turned away at the ward door
      time_strain: Time slip
    plots:
      statistics:
        name: Give Nightingale printed tables
        desc: Lets her turn the ward count into a clear table that others can read at a glance.
        character: Florence Nightingale
        article: people:nightingale_scutari
      germ_theory:
        name: Explain germ theory to Nightingale
        desc: Needs the craft of microbiology, which this era does not have.
        character: Florence Nightingale
        article: people:nightingale_scutari
    blurb: A military hospital in winter, where more men die of infection than of wounds, and a nurse who keeps counting. Close, cheap, and the effect of cleaning and care is clear.
    handle_label: Sanitary reform begins
    protagonist: Florence Nightingale
    protagonist_role: A nurse who keeps the count of the dead and has not yet proved what is killing them
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: In the winter of 1854 to 1855 many more soldiers died in the hospitals at Scutari of infection than of wounds.
          check: true
        - text: Florence Nightingale arrived in November 1854 with a party of nurses, and the army doctors did not all welcome them.
          check: true
        - text: In early March 1855 a Sanitary Commission arrived, flushed the sewers and opened the wards to air, and the deaths fell sharply in the following months.
          check: true
        - text: Nightingale kept careful records, and after the war she argued that sanitation had done more than any other change.
          check: true
      regret:
        - You can save today's patients but not tomorrow's. On the main timeline the Sanitary Commission came in early March.
        - Counts and tables matter more than any one pair of hands, but making people believe a count takes time.
    events:
      expedition_handoff: '{staff} and Agnes trace two requests back to separate wards. Both go on the stores list, but Emil has left and they will be delivered together on the next round.'
      expedition_send: '{staff} gives Emil the signed request first. Agnes clips the unsigned one to the ward book for a second signature.'
      door_block_stubborn: A ward surgeon bars the door, saying the army does not need a stranger. {staff} is stubborn, does not give way, is sent out of one ward and loses {d.ors_stock:i} packets of supplies.
      door_block_stubborn_empty: A ward surgeon bars the door, saying the army does not need a stranger. {staff} is stubborn, does not give way, and is sent out.
      door_block_insist_empty: A ward surgeon bars the door, saying hardship and bad air are what kill. {staff} stands at the door and finishes speaking, and is turned away.
      door_block_insist: A ward surgeon bars the door, saying hardship and bad air are what kill. {staff} stands at the door and finishes speaking, is turned away, and loses {d.ors_stock:i} packets of supplies.
      door_block_appeal: A ward surgeon bars the door. {staff} does not force the way, turns and goes to Nightingale to ask her to speak up.
      door_block_yield: A ward surgeon bars the door. {staff} steps back without a quarrel, and half a day is wasted.
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: "Convince Nightingale"
      trust: "Win the trust of the ward"
      reform: 'Advance the simulated schedule'
    milestones:
      commission_leaves: '{date}: According to the commissioners’ report, they and their officers leave London.'
      commission_examines: '{date}: The commissioners reach Constantinople and begin examining the Scutari hospitals that afternoon.'
      first_treat: '{date}: {staff} spoons the first cup of clean broth and salts to a feverish man. He starts to speak.'
      first_protect: '{date}: {staff} hands out the first chlorinated cloths and washes down a few beds, and teaches the orderlies to do the same.'
      met_nightingale: '{date}: {staff} meets Nightingale on her night round. She listens closely but keeps asking one thing: where are the numbers.'
      nightingale_trusts: '{date}: Nightingale starts to treat {staff} as one of her own and brings out the ward counts she has been keeping.'
      nightingale_convinced: '{date}: Nightingale no longer merely suspects the filth in the wards. She has enough figures, and believes what the stranger told her.'
      board_moves: '{date}: The medical board starts to give way and says a commission might be sent.'
      reform_history: '{date}: The simulation sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The simulated ward changes its delivery schedule {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: The ward surgeons no longer keep {staff} out, and some ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of fevered men on the ward falls to single digits.'
    summary:
      near_death: '{staff} collapses in the ward corridor and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these men a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} brought the simulated schedule forward by {advance_days:1} days in this branch.'
      perfect: '{staff} completed the task at Scutari and came back safe. The simulation records {base_D:i} deaths in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away at the ward door again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days in the Barrack Hospital, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was sitting with the men at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told her what she needed to hear.
      perfect:
        - trait: kind
          text: I could save today's patients, not tomorrow's.
        - trait: curious
          text: So that is how it is, the dirt is what kills them.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they believe it is up to them.
        - text: With one more item I might have saved one more man.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Disinfectant was left over. The limit was the trust of the ward, not the supplies.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or patients were not let in.
      ally_gap: Nightingale's evidence is still thin. The handbook helps her, provided the employee spends time with her.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
  zh:
    name: 斯库塔里兵营医院 1855
    short: 斯库塔里
    place_name: 斯库塔里兵营医院
    tags:
      - medical
      - infection
      - hospital
      - c19
      - istanbul
      - history
    event_titles:
      expedition_handoff: '两间病房，一捆单子'
      door_block: 被拒之病房门外
      time_strain: 时间错位
    plots:
      statistics:
        name: 送南丁格尔印好的统计表
        desc: 让她把病房里的数目做成一眼能看懂的表格。
        character: 弗洛伦斯·南丁格尔
        article: people:nightingale_scutari
      germ_theory:
        name: 把细菌致病的理论讲给南丁格尔
        desc: 需要微生物学的工艺，这个时代还没有。
        character: 弗洛伦斯·南丁格尔
        article: people:nightingale_scutari
    blurb: 冬天的军队医院，死于感染的人比死于伤口的还多，还有一位一直在数数的护士。近，成本低，清洁和护理的效果很明显。
    handle_label: 卫生改革开始
    protagonist: 弗洛伦斯·南丁格尔
    protagonist_role: 一直在记录死亡人数、却还没证明是什么在害死他们的护士
    stay: 停留七天
    plan_baseline: 主时间线
    encyclopedia:
      history:
        - text: 1854 年到 1855 年的冬天，斯库塔里医院里死于感染的士兵比死于伤口的多得多。
          check: true
        - text: 南丁格尔 1854 年 11 月带着一队护士到达，军医们并不都欢迎她们。
          check: true
        - text: 1855 年 3 月初一个卫生委员会到达，冲洗了下水道，让病房通了风，此后几个月死亡数大幅下降。
          check: true
        - text: 南丁格尔一直做着细致的记录，战后她主张卫生改善比其他任何改变都更有效。
          check: true
      regret:
        - 你能救今天的病人，救不了明天的。主时间线上卫生委员会在三月初到来。
        - 数目和表格比任何一双手都重要，但让人相信一个数目需要时间。
    events:
      expedition_handoff: '{staff} 和艾格尼丝查清两张单子分别来自哪间病房。两笔都入库房清单，埃米尔已经离开，要等下一轮一起送。'
      expedition_send: '{staff} 先把签过字的单子递给埃米尔。艾格尼丝把没签字的那张夹在病房账里，等人补签。'
      door_block_stubborn: 一位病房军医拦在门口，说军队不需要外人。{staff} 倔强，不肯让路，被赶出一间病房，丢了 {d.ors_stock:i} 包物资。
      door_block_stubborn_empty: 一位病房军医拦在门口，说军队不需要外人。{staff} 倔强，不肯让路，被赶了出去。
      door_block_insist_empty: 一位病房军医拦在门口，说致命的是艰苦和坏空气。{staff} 站在门口把话说完，被请了出去。
      door_block_insist: 一位病房军医拦在门口，说致命的是艰苦和坏空气。{staff} 站在门口把话说完，被请了出去，丢了 {d.ors_stock:i} 包物资。
      door_block_appeal: 一位病房军医拦在门口。{staff} 不硬闯，转身去找南丁格尔，请她出面说话。
      door_block_yield: 一位病房军医拦在门口。{staff} 没有争吵，退了一步，半天白白过去。
      time_strain: '{date}：{staff} 听到钟声错了半拍。分支在偏离史实，疲态也越来越明显。'
    star_points:
      convince: "说服南丁格尔"
      trust: "赢得病房的信任"
      reform: '提前模拟中的安排'
    milestones:
      commission_leaves: '{date}，据委员会报告，委员及随行人员离开伦敦。'
      commission_examines: '{date}，委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。'
      first_treat: '{date}：{staff} 给一个发烧的人喂下第一勺干净的肉汤和盐水，他开始说话了。'
      first_protect: '{date}：{staff} 发下第一批氯水浸过的布，擦洗了几张床，并教勤务兵照做。'
      met_nightingale: '{date}：{staff} 在夜巡时遇到南丁格尔。她听得很认真，却一再问同一件事：数目在哪里。'
      nightingale_trusts: '{date}：南丁格尔开始把 {staff} 当自己人，拿出她一直在记的病房数目。'
      nightingale_convinced: '{date}：南丁格尔不再只是怀疑病房里的污秽。她有了足够的数字，也信了这位陌生人告诉她的话。'
      board_moves: '{date}：军医委员会开始松口，说也许可以派一个委员会来。'
      reform_history: '{date}，模拟按模型基准日调整安排。'
      reform_early: '{date}，模拟中的病房调整送货安排，比模型基准提前 {advance_days:1} 天。'
      trust_won: '{date}：病房军医不再把 {staff} 拦在外面，有的还开口求助。'
      exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
      outbreak_fades: '{date}：病房里发烧的人数降到了个位数。'
    summary:
      near_death: '{staff} 在病房走廊倒下，被召回符拉了回来。人救下了，代价不小。'
      stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
      gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
      legend: '{staff} 在这条虚构分支中把模拟安排提前了 {advance_days:1} 天。'
      perfect: '{staff} 在斯库塔里完成了任务，平安回来。模拟基准死亡 {base_D:i} 人，这条分支为 {D:i} 人。'
      scramble: '{staff} 一次次被拒之病房门外，最后带着一个笑话逃了回来。'
      modest: '{staff} 在兵营医院待了七天，做了力所能及的事，平安回来。'
    quotes:
      near_death:
        - trait: kind
          text: 到最后我还在想，夜里有没有人陪着那些人。
        - text: 我以为还能再撑一会儿。
      stay_and_gifts:
        - trait: kind
          text: 我记得他们每个人的名字。我想再待一阵。
        - text: 这里需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就这样。
        - text: 我不是干这个的料。
      legend:
        - text: 我只是把她需要听到的话告诉了她。
      perfect:
        - trait: kind
          text: 我能救今天的病人，救不了明天的。
        - trait: curious
          text: 原来是这样，要命的是脏。
        - text: 该做的做了。
      scramble:
        - trait: methodical
          text: 他们迟早会明白，只是会晚一些。
        - text: 下次我想多带点东西。
      modest:
        - trait: glib
          text: 该说的我都说了，信不信由他们。
        - text: 再多带一件东西，也许还能多救一个人。
    hints:
      lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
      unused_protect: 消毒的东西剩下了。限制不是物资，是病房对你的信任。
      unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进病房。
      ally_gap: 南丁格尔的证据还很薄。手册能帮她，前提是员工花时间和她在一起。
      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

hook: {en: 'Two requests reach the same desk. Which ward did each come from?', zh: '两张单子，各是哪间病房的？'}
facts:
  commission_leaves:
    date: '1855-02-22'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [scutari_commission_report, nightingale_army_report]
    text:
      en: 'According to the commissioners’ report, they and their officers leave London.'
      zh: '据委员会报告，委员及随行人员离开伦敦。'
  commission_examines:
    date: '1855-03-06'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [scutari_commission_report, nightingale_army_report]
    text:
      en: 'The commissioners reach Constantinople and begin examining the Scutari hospitals that afternoon.'
      zh: '委员会抵达君士坦丁堡，当天下午开始查看斯库塔里各医院。'
bystanders:
  agnes:
    invented: true
    text: {en: 'Agnes, an invented night attendant, distinguishes requests by ward and time.', zh: '艾格尼丝是虚构的夜班护理员，按病房和时间区分请领单。'}
  emil:
    invented: true
    text: {en: 'Emil, an invented stores messenger, carries the day’s ward slips to the stores desk.', zh: '埃米尔是虚构的库房信使，把当天的病房单据交到库房。'}
quotes:
  nightingale_scutari_story_echo_full:
    order: 1
    tier: full
    date: '1863'
    checked: official_record
    sources: [nightingale_scutari_story_echo_source_full]
    original: en
    text:
      en:
        who: 'Florence Nightingale'
        quote: 'the very first requirement in a hospital that it should do the sick no harm'
        occasion: 'Nightingale opens the 1863 edition of Notes on Hospitals with this requirement.'
      zh:
        who: '弗洛伦斯·南丁格尔'
        quote: '医院的第一项要求，是不能给病人带来伤害。'
        occasion: '南丁格尔在 1863 年版《医院札记》序言提出的要求。'
      fr:
        who: 'Florence Nightingale'
        quote: 'la toute première exigence d''un hôpital selon laquelle il ne doit pas faire de mal aux malades'
        occasion: 'Nightingale ouvre l''édition 1863 des Notes sur les hôpitaux avec cette exigence.'
      es:
        who: 'Florence Nightingale'
        quote: 'El primer requisito en un hospital es que no debe causar daño a los enfermos.'
        occasion: 'Nightingale abre la edición de 1863 de Notes on Hospitals con este requisito.'
      ja:
        who: 'フローレンス・ナイチンゲール'
        quote: '病院における第一の要求は、病人に危害を与えないことである'
        occasion: 'ナイチンゲールは、1863 年版の『病院に関するメモ』をこの要件で開きます。'
      ko:
        who: '플로렌스 나이팅게일'
        quote: '환자에게 해를 끼치지 않아야 한다는 병원의 첫 번째 요구 사항'
        occasion: '나이팅게일은 이 요구 사항을 바탕으로 Notes on Hospitals의 1863년판을 엽니다.'
      ru:
        who: 'Флоренс Найтингейл'
        quote: 'самое первое требование в больнице — не причинять больным никакого вреда'
        occasion: 'Этим требованием Найтингейл открывает издание «Записок о больницах» 1863 года.'
      zh-Hant:
        who: '弗洛倫斯·南丁格爾'
        quote: '醫院的第一項要求，是不能給病人帶來傷害。'
        occasion: '南丁格爾在 1863 年版《醫院札記》序言提出的要求。'
  nightingale_scutari_story_echo_none:
    order: 2
    tier: none
    date: '1858'
    checked: official_record
    sources: [nightingale_scutari_story_echo_source_none]
    original: en
    text:
      en:
        who: 'Florence Nightingale'
        quote: 'Notes on Matters Affecting the Health, Efficiency, and Hospital Administration of the British Army'
        occasion: 'The title of Nightingale’s detailed report after the Crimean War.'
      zh:
        who: '弗洛伦斯·南丁格尔'
        quote: '关于英军卫生、效能及医院管理若干事项的札记。'
        occasion: '南丁格尔在克里米亚战争后所写报告的题名。'
      fr:
        who: 'Florence Nightingale'
        quote: 'Notes sur les questions affectant la santé, l''efficacité et l''administration hospitalière de l''armée britannique'
        occasion: 'Le titre du rapport détaillé de Nightingale après la guerre de Crimée.'
      es:
        who: 'Florence Nightingale'
        quote: 'Notas sobre asuntos que afectan la salud, la eficiencia y la administración hospitalaria del ejército británico'
        occasion: 'El título del informe detallado de Nightingale sobre la guerra de Crimea.'
      ja:
        who: 'フローレンス・ナイチンゲール'
        quote: '英国陸軍の健康、効率、病院管理に影響を与える事項に関するメモ'
        occasion: 'クリミア戦争後のナイチンゲールの詳細な報告書のタイトル。'
      ko:
        who: '플로렌스 나이팅게일'
        quote: '영국군의 건강, 효율성 및 병원 행정에 영향을 미치는 문제에 대한 참고 사항'
        occasion: '크림전쟁 이후 나이팅게일이 자세히 기록한 보고서의 제목.'
      ru:
        who: 'Флоренс Найтингейл'
        quote: 'Заметки по вопросам, влияющим на здоровье, эффективность и госпитальное управление британской армии'
        occasion: 'Название подробного отчета Найтингейла после Крымской войны.'
      zh-Hant:
        who: '弗洛倫斯·南丁格爾'
        quote: '關於英軍衛生、效能及醫院管理若干事項的札記。'
        occasion: '南丁格爾在克里米亞戰爭後所寫報告的題名。'
