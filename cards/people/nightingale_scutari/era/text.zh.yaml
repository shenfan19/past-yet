  - history
event_titles:
  door_block: 被拒之病房门外
  time_strain: 时间错位
plots:
  statistics:
    name: 送南丁格尔印好的统计表
    desc: 让她把病房里的数目做成一眼能看懂的表格。
    character: 弗洛伦斯·南丁格尔
    article: people:nightingale_scutari
  germ_theory:
    name: 把细菌致病的理论讲给南丁格尔
    desc: 需要微生物学的工艺，这个时代还没有。
    character: 弗洛伦斯·南丁格尔
