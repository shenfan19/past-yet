blurb: 冬天的军队医院，死于感染的人比死于伤口的还多，还有一位一直在数数的护士。近，成本低，清洁和护理的效果很明显。
handle_label: 卫生改革开始
protagonist: 弗洛伦斯·南丁格尔
protagonist_role: 一直在记录死亡人数、却还没证明是什么在害死他们的护士
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: 1854 年到 1855 年的冬天，斯库塔里医院里死于感染的士兵比死于伤口的多得多。
      check: true
    - text: 南丁格尔 1854 年 11 月带着一队护士到达，军医们并不都欢迎她们。
      check: true
    - text: 1855 年 3 月初一个卫生委员会到达，冲洗了下水道，让病房通了风，此后几个月死亡数大幅下降。
      check: true
    - text: 南丁格尔一直做着细致的记录，战后她主张卫生改善比其他任何改变都更有效。
      check: true
  regret:
    - 你能救今天的病人，救不了明天的。主时间线上卫生委员会在三月初到来。
    - 数目和表格比任何一双手都重要，但让人相信一个数目需要时间。
events:
  door_block_stubborn: 一位病房军医拦在门口，说军队不需要外人。{staff} 倔强，不肯让路，被赶出一间病房，丢了 {d.ors_stock:i} 包物资。
  door_block_stubborn_empty: 一位病房军医拦在门口，说军队不需要外人。{staff} 倔强，不肯让路，被赶了出去。
  door_block_insist_empty: 一位病房军医拦在门口，说致命的是艰苦和坏空气。{staff} 站在门口把话说完，被请了出去。
  door_block_insist: 一位病房军医拦在门口，说致命的是艰苦和坏空气。{staff} 站在门口把话说完，被请了出去，丢了 {d.ors_stock:i} 包物资。
  door_block_appeal: 一位病房军医拦在门口。{staff} 不硬闯，转身去找南丁格尔，请她出面说话。
  door_block_yield: 一位病房军医拦在门口。{staff} 没有争吵，退了一步，半天白白过去。
  time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
star_points:
  convince: "说服南丁格尔"
  trust: "赢得病房的信任"
  reform: "让改革比历史上更早开始"
milestones:
  first_treat: '{date}：{staff} 给一个发烧的人喂下第一勺干净的肉汤和盐水，他开始说话了。'
  first_protect: '{date}：{staff} 发下第一批氯水浸过的布，擦洗了几张床，并教勤务兵照做。'
  met_nightingale: '{date}：{staff} 在夜巡时遇到南丁格尔。她听得很认真，却一再问同一件事：数目在哪里。'
  nightingale_trusts: '{date}：南丁格尔开始把 {staff} 当自己人，拿出她一直在记的病房数目。'
  nightingale_convinced: '{date}：南丁格尔不再只是怀疑病房里的污秽。她有了足够的数字，也信了这位陌生人告诉她的话。'
  board_moves: '{date}：军医委员会开始松口，说也许可以派一个委员会来。'
  reform_history: '{date}：卫生委员会开始工作。主时间线没有变化。'
  reform_early: '{date}：卫生委员会比历史上提前 {advance_days:1} 天开始工作。主时间线没有变化，只是这条分支。'
  trust_won: '{date}：病房军医不再把 {staff} 拦在外面，有的还开口求助。'
  exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
  outbreak_fades: '{date}：病房里发烧的人数降到了个位数。'
summary:
  near_death: '{staff} 在病房走廊倒下，被召回符拉了回来。人救下了，代价不小。'
  stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
  gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
  legend: '{staff} 在斯库塔里留下了传说。卫生委员会比历史上提前 {advance_days:1} 天开始工作。'
  perfect: '{staff} 在斯库塔里完成了任务，平安回来。主时间线死了 {base_D:i} 人，这条分支死了 {D:i} 人。'
  scramble: '{staff} 一次次被拒之病房门外，最后带着一个笑话逃了回来。'
  modest: '{staff} 在兵营医院待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人陪着那些人。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把她需要听到的话告诉了她。
  perfect:
    - trait: kind
      text: 我能救今天的病人，救不了明天的。
    - trait: curious
      text: 原来是这样，要命的是脏。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，信不信由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 消毒的东西剩下了。限制不是物资，是病房对你的信任。先让员工帮病人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进病房。
  ally_gap: 南丁格尔的证据还很薄。手册能帮她，前提是员工花时间和她在一起。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
