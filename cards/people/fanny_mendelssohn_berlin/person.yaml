    text:
      en:
        name: 'Six songs under one name'
        place: "Berlin"
        figure: "Fanny Mendelssohn Hensel"
        story: 'Fanny Hensel’s Six Songs, Op. 1, appeared under her own name in 1846.'
        relic: "A song sheet"
        relic_desc: "A handwritten song marked Fanny."
        points:
          p1: 'Protect Hensel''s writing time amid rehearsal preparations so she can finish her last song'
          p2: 'While the Trio parts are still together, bring Hensel the markings from the trial performance for her to choose between'
          p3: 'Bring the publisher to Hensel with proofs and let her settle the version of the Trio readers will receive'
        points_fail:
          p1: 'Rehearsal takes up the hours she had set aside and the song stops at the draft. The branch falls out of sync and the office recalls the employee.'
          p2: 'The players take their copies away and later editors have to guess which markings the composer accepted.'
          p3: 'The Trio appears only after her death, so she never reviews the printed text herself.'
        shift:
          p1:
            was: 'In late April 1847 Hensel wrote that composition had stalled after the Trio; in May she finished her final song shortly before her death.'
          p2:
            was: 'In 1850 Hensel''s Piano Trio in D minor was printed as a posthumous work.'
            now: '{staff} copies the different markings onto one sheet and has Hensel indicate which she wants to keep.'
          p3:
            was: 'Hensel died on 14 May 1847. The Piano Trio first appeared in print in 1850.'
            now: '{staff} persuades a publisher to bring proofs while they can still be changed. Her family later has the revisions she settled herself when they see the score into print.'
            who: fanny_mendelssohn_berlin
            bio: 'Hensel reviewed the Trio for publication before her death. Her version appeared with her posthumous works, with the changes she chose still visible.'
        vignettes:
          cover: 'A singer has opened the score in the middle and asks whose music this is. You fetch its loose title sheet and set it beside the score. The initials on the title sheet are enough to settle what to write on the sleeve. You miss the first song while putting the papers together.'
          forward: 'You start to tell the singer how collectors will search for these songs in the future. She points to the loose cover and asks whether they will still have it. You ask for the cover to go out with the next copy. It goes with one reader. You cannot follow it any further.'
          order: 'You work through the contents and lay the six songs in order. The singer can turn straight to the one she needs. You keep the sequence on your own slip. What you cannot take home is the sound from the room after you close its door.'
      zh:
        name: '用自己的名字印六首歌'
        place: "柏林"
        figure: "范妮·门德尔松·亨泽尔"
        story: '范妮·亨泽尔的《六首歌曲》作品一号于 1846 年以她本人的名字出版。'
        relic: "一页歌谱"
        relic_desc: "一页手写的歌谱，署名范妮。"
        points:
          p1: '在亨泽尔为排练忙碌时替她守住写谱的时间，让她完成最后一首歌'
          p2: '趁三重奏的分谱还在一处，把试奏时改过的记号交给亨泽尔挑选'
          p3: '让出版人带着校样来见亨泽尔，请她亲手确认三重奏交到读者手中的版本'
        points_fail:
          p1: '排练占完了时间，最后的歌停在草稿。行程与史实脱节，员工被召回。'
          p2: '奏过的几份分谱各自带走，日后准备印本时只好再猜哪些标记是作者采用的。'
          p3: '三重奏直到她去世后才出版，作者没能亲自审定印本。'
        shift:
          p1:
            was: '1847 年 4 月下旬，亨泽尔在日记中写到三重奏之后创作一度停滞，5 月去世前她完成了最后一首歌。'
          p2:
            was: '1850 年，亨泽尔的《D 小调钢琴三重奏》作为遗作付印。'
            now: '{staff}把试奏分谱上的不同记号摘在一页，让亨泽尔勾出自己要留的几处。'
          p3:
            was: '1847 年 5 月 14 日亨泽尔去世，钢琴三重奏的初版直到 1850 年才问世。'
            now: '{staff}请出版人提前带来可改动的校样。家人后来付印时带着她亲手定下的修订页。'
            who: fanny_mendelssohn_berlin
            bio: '亨泽尔生前审过三重奏的付印稿。她的版本随遗作出版，演奏者可以辨出哪些改动出自她本人。'
        vignettes:
          cover: '虚构的歌手从中间翻开乐谱，问是谁写的。你找来散开的题名页放在旁边。封面上署的名字足够确定纸套上该写什么。等你把纸理齐，第一首已经唱完。'
          forward: '你刚要说后来的收藏者会怎样找这六首歌，歌手指着散开的封面，问他们还找不找得到它。你请她把封面随下一份谱一起交出去。一位读者带着它走了，再往下的去向你够不着。'
          order: '你对着目录把六首排好，歌手可以直接翻到要唱的那一首。你另记下一份顺序。等门一关，屋里再响起什么，你带不走。'
text:
  en:
    name: Fanny Mendelssohn Hensel
    text: German composer and pianist, 1805 to 1847, sister of Felix Mendelssohn. She wrote hundreds of works, including songs and piano pieces, but her family discouraged publication. She died of a stroke in Berlin while rehearsing.
  zh:
    name: 范妮·门德尔松·亨泽尔
    text: 德国作曲家与钢琴家，1805 年生，1847 年去世，费利克斯·门德尔松的姐姐。她写了几百首作品，包括歌曲和钢琴曲，但家人不赞成她出版。她在柏林排练时中风去世。
