      none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。

hook: {en: 'The island name travels with the packet.', zh: '那包标本，得带着岛名走。'}
facts:
  lawson:
    date: '1835-09-25'
    stay_day: 10
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [darwin_galapagos_journal, darwin_galapagos_sulloway]
    text:
      en: 'On Charles Island the vice-governor Lawson told Darwin he could tell from which island a tortoise came. Darwin later wrote that he had not paid enough attention to this, had already partly mixed the collections of two islands, and had mixed most of his finches; he did not begin to keep his birds apart by island while in the archipelago.'
      zh: '在查尔斯岛，副总督劳森告诉达尔文，他一看就知道一只龟出自哪座岛。达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起，雀的标本也大多混了；他在群岛期间没有开始把鸟分岛收存。'
    line:
      en: 'On Charles Island the vice-governor Lawson says he can tell which island a tortoise comes from.'
      zh: '查尔斯岛的副总督劳森说，一只龟出自哪座岛，他一看就知道。'
      fr: 'Sur l''île Charles, le vice-gouverneur Lawson dit qu''il peut dire de quelle île vient une tortue.'
      es: 'En Charles Island, el vicegobernador Lawson dice que puede saber de qué isla proviene una tortuga.'
      ja: 'チャールズ島ではローソン副知事が、カメがどの島から来たのか分かると述べている。'
      ko: '찰스 섬의 부지사인 로슨(Lawson)은 거북이가 어느 섬에서 왔는지 알 수 있다고 말합니다.'
      ru: 'На острове Чарльз вице-губернатор Лоусон говорит, что может сказать, с какого острова родом черепаха.'
      zh-Hant: '查爾斯島的副總督勞森說，一隻龜出自哪座島，他一看就知道。'
  james_island:
    date: '1835-10-08'
    stay_day: 23
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [darwin_galapagos_log, darwin_galapagos_journal]
    text:
      en: 'From 8 to 17 October 1835 Darwin, the surgeon Bynoe and their servants were left on James Island with provisions and a tent while the Beagle went for water; near their camp there was only a poor little spring.'
      zh: '1835 年 10 月 8 日至 17 日，达尔文、随船医生拜诺和随从带着口粮和帐篷留在詹姆斯岛，小猎犬号去别处取水；营地旁只有一眼小泉。'
    line:
      en: '8 October 1835: Darwin and a small party are set ashore on James Island with a tent, while the Beagle goes for water.'
      zh: '1835 年 10 月 8 日，达尔文一小队带着帐篷登上詹姆斯岛，小猎犬号去别处取水。'
      fr: '8 octobre 1835 : Darwin et un petit groupe débarquent sur l''île James avec une tente, tandis que le Beagle va chercher de l''eau.'
      es: '8 de octubre de 1835: Darwin y un pequeño grupo desembarcan en la isla James con una tienda de campaña, mientras el Beagle busca agua.'
      ja: '1835年10月8日。ダーウィンら少人数の一行はテントを持ってジェームズ島に上陸し、ビーグル号は水を取りに向かう。'
      ko: '1835년 10월 8일. 다윈 일행 몇 명은 천막을 가지고 제임스섬에 내리고, 비글호는 물을 구하러 떠난다.'
      ru: '8 октября 1835 года. Дарвин и несколько человек высаживаются на острове Джеймс с палаткой, а «Бигль» отправляется за водой.'
      zh-Hant: '1835 年 10 月 8 日，達爾文一小隊帶著帳篷登上詹姆斯島，小獵犬號去別處取水。'
  surveying:
    date: '1835-09-15'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [darwin_galapagos_log, darwin_beagle_bird_notes]
    text:
      en: 'The Beagle surveys the outer coast of Chatham Island, now San Cristóbal.'
      zh: '小猎犬号测量查塔姆岛（今圣克里斯托瓦尔岛）外侧海岸。'
  lands:
    date: '1835-09-16'
    checked: official_record
    level: usable
    use: [history, story, wiki]
    sources: [darwin_galapagos_log, darwin_beagle_bird_notes]
    text:
      en: 'Darwin records an afternoon landing on Chatham Island with FitzRoy.'
      zh: '达尔文记下自己与菲茨罗伊当天下午登上查塔姆岛。'
