    text:
      en:
        name: Islands and the variety of life
        place: Galápagos Islands
        figure: Charles Darwin
        story: 'Darwin visited the Galápagos on the Beagle from September to October 1835. On Charles Island the vice-governor Lawson told him the tortoises differed from island to island; Darwin later wrote that he did not pay enough attention at the time, and had already mixed the collections of two islands. From 8 to 17 October he, Bynoe and their servants camped on James Island while the ship went for water, with only a poor little spring near the tent. His bird notes associate mockingbird specimens with particular islands.'
        story_prose:
          opening:
            - 'The Beagle has dropped Darwin’s party ashore and gone to water elsewhere. The tents on James Island are just up. A small spring by camp runs slowly, and two bird labels have been written on the same piece of paper.'
            - 'In 1835 the acting governor Lawson told Darwin that the islands’ tortoises could be told apart. Darwin later wrote that he had not taken enough notice. The James Island party waited for the ship with little water. You can preserve the distinctions earlier and help the shore party finish its collecting.'
            - 'Someone who watches specimens and labels can hear Lawson out with Darwin. For James Island, send someone who can help the shore party with water and camp supplies.'
          points:
            p1: 'The flask is nearly empty and two people are still waiting by the spring. You count how much water is left and how many people need it, then ask the guide to speak to the men who brought water earlier. Once the water arrives, Bynoe calls for the remaining packets to be brought in from the tent. When the ship is back in the bay, the last packets wait by the emptied flasks.'
            p2: 'Lawson says he can tell the island from the shape of a tortoise’s shell. Darwin asks for one place name and is about to walk on. You open two specimen packets and read back where he collected them. Places he cannot confirm are left to check, and later specimens go in separate wrappers. A new string goes round the first packet with its island’s name on the outside.'
          outcomes:
            all: 'The names and separate packets can be checked against one another. The James Island party also returns to the ship with its collecting finished.'
            p1: 'The shore party lasts until the ship returns and the specimens are loaded. Some of the earlier island labels remain uncertain.'
            p2: 'Part of the island record is kept apart. The camp fails later and the trip keeps this moment of checking names on Charles Island.'
          none: 'The flasks by the spring are still the only ones at camp, and the earlier packets still have uncertain names.'
          not_admitted: 'The visitor is absent from the shore list. A packet is already in the boat and the label cannot be read from the deck.'
          desync: 'The camp runs out of water before the James Island collecting can be finished. The office recalls the traveller.'
          excerpts:
            p1: 'When the ship is back in the bay, the last packets wait by the emptied flasks.'
            p2: 'A new string goes round the first packet with its island’s name on the outside.'
        relic: A finch feather
        relic_desc: A small brown feather from the islands.
        points:
          p1: 'On James Island, where the camp has one poor little spring, keep the shore party going until the ship returns, and see the island''s collecting done'
          p2: 'When Lawson says the tortoises differ from island to island, make Darwin take note there and then, and keep the birds of each island labelled and packed apart'
        points_fail:
          p1: 'The shore party runs out of water and the James Island collecting is never made. This branch has come loose from history, and the office recalls the employee that day.'
          p2: 'As in history Darwin pays little heed to Lawson. The collections of Chatham and Charles Islands are already mixed, and most of the finches carry no island.'
        shift:
          p1:
            was: '8 to 17 October 1835: Darwin, Bynoe and their servants camped on James Island with a tent and provisions while the Beagle went for water; near the camp there was only a poor little spring.'
          p2:
            was: 'Late September 1835: on Charles Island the vice-governor Lawson told Darwin the tortoises of each island could be told apart. Darwin later wrote that he had not paid enough attention, had already mixed the collections of two islands, and had mixed most of his finches.'
            now: 'He took Lawson at his word that day, and brought the birds of each island home to England labelled and packed apart.'
            who: darwin_galapagos
            bio: 'In this timeline Darwin listened to Lawson on the Galápagos, and collected and labelled the finches and mockingbirds island by island before taking them home to England.'
        vignettes:
          two_tags: 'One tag says only ''island''. You set it aside until the helper can find the separate landing note. The two specimens stay apart even after the trays are put away.'
          differences: 'The helper points to two similar-looking birds and wants one entry for both. You ask which island each came from. They leave both labels in the book so the likeness can be considered again later.'
          drawer: 'You keep the paper label beside the tray until the helper can read the name back to you. When they close the drawer, the note stays where it belongs.'
      zh:
        name: 岛屿与生命的多样
        place: 加拉帕戈斯群岛
        figure: 查尔斯·达尔文
        story: '1835 年 9 月到 10 月，达尔文随小猎犬号到访加拉帕戈斯。在查尔斯岛，副总督劳森告诉他各岛的龟彼此不同；达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起。10 月 8 日到 17 日，他和拜诺几人带着帐篷留在詹姆斯岛，船去别处取水，营地旁只有一眼可怜的小泉。他的鸟类笔记把嘲鸫标本和各自采集的岛对应起来。'
        story_prose:
          opening:
            - '小猎犬号把达尔文一行留在岛上，到别处取水去了。詹姆斯岛的帐篷刚支起，营地旁边的小泉流得很慢。装标本的纸包还没捆好，有两只鸟的标签写在同一张纸上。'
            - '1835 年，副总督劳森告诉达尔文，各岛象龟有可辨的区别。达尔文后来记下自己没有及时留心。詹姆斯岛的队伍靠小泉待到船返。这里可以提前分岛标记，也可以保住最后一段岸上采集。'
            - '擅长观察、核标签的人先随达尔文听劳森说完。到詹姆斯岛再派能照应水和驻地的人同去。'
          points:
            p1: '水壶眼看就快见底，泉旁还排着两个人。你把营地能用的水和这半天要供几个人讲清，请带路的人再去问先前替他们取水的人。等水到了，拜诺才叫人把已经装好的标本从帐边收好。船重新到外湾时，最后一批纸包和空水壶放在一起等装船。'
            p2: '劳森说看壳就知道是哪座岛的龟，达尔文问了一个地方名就想接着走。你将两张标本纸打开，请他按原来采集时的去向说一次。记到说不准的就标待核，后采到的另包一处。第一张核好的标签用新绳系回去，岛名留在纸包外。'
          outcomes:
            all: '岛名和分包的标本能逐份核对。詹姆斯岛的队伍也带齐采集物回到船上。'
            p1: '营地撑到船回，收集的标本照期上船。较早的岛名还有几处无法查明。'
            p2: '一点岛屿记录单独保存。营地之后没能撑到完成采集，报告保存这一段在查尔斯岛的核对。'
          none: '泉眼旁只有原先那几只水壶，没去另找水。较早的标本包也未写清岛名。'
          not_admitted: '离船的名单里没有来客。一只包已经放进小艇，你从甲板上看不清标签。'
          desync: '回程前营地断水，詹姆斯岛的采集没能完成。事务所发来召回。'
          excerpts:
            p1: '船重新到外湾时，最后一批纸包和空水壶放在一起等装船。'
            p2: '第一张核好的标签用新绳系回去，岛名留在纸包外。'
        relic: 一根雀的羽毛
        relic_desc: 来自群岛的一根小小的褐色羽毛。
        points:
          p1: '詹姆斯岛营地旁只有一眼小泉，护住岸上这一小队撑到船回来，把岛上的采集做完'
          p2: '劳森说各岛的龟一看就分得出时，让达尔文当场留了心，把各岛的鸟分岛记下、分开装好'
        points_fail:
          p1: '岸上小队断了水，詹姆斯岛的采集没能做成，这条分支与历史脱了节，事务所当天召回员工。'
          p2: '他照史实没把劳森的话放在心上，查塔姆岛和查尔斯岛的采集已经混在一起，雀的标本大多没记岛名。'
        shift:
          p1:
            was: '1835 年 10 月 8 日至 17 日，达尔文、拜诺和随从带着帐篷和口粮留在詹姆斯岛，小猎犬号去别处取水；营地旁只有一眼小泉。'
          p2:
            was: '1835 年 9 月下旬，查尔斯岛的副总督劳森告诉达尔文，各岛的龟一看就分得出来。达尔文后来写道，他当时没有留心，已把两座岛的采集混在一起，雀的标本也大多混了。'
            now: '他当天就记住了劳森的话，各岛的鸟分岛记下、分开装好，带回了英国。'
            who: darwin_galapagos
            bio: '这条时间线里，达尔文在加拉帕戈斯听进了劳森那句话，把各岛的雀和嘲鸫分岛采集、分岛标注，带回英国。'
        vignettes:
          two_tags: '一张签只写了「岛上」。你把它搁到一边，等帮手找来另记的上岸记录。盘子即便收好，两件标本也还能分清。'
          differences: '帮手指着两只相似的鸟，准备合写一条。你问它们各来自哪座岛。他把两个标签都留在册上，下次好重新比较。'
          drawer: '帮手能把地名念回给你以前，你一直把签放在盘旁。抽屉关上时，纸签仍在对应的标本旁。'
text:
  en:
    name: Charles Darwin
    text: English naturalist, 1809 to 1882. On the voyage of the Beagle he visited the Galapagos Islands in 1835 and observed how related species differ from island to island. His book On the Origin of Species, published in 1859, set out evolution by natural selection.
  zh:
    name: 查尔斯·达尔文
    text: 英国博物学家，1809 年生，1882 年去世。随“小猎犬号”航行时，他在 1835 年到访加拉帕戈斯群岛，观察亲缘物种如何随岛屿而不同。1859 年出版的《物种起源》阐述了自然选择的进化论。
