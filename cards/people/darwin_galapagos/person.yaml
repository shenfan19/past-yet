      text:
        en:
          name: The plan for water and food
          text: How the shore parties were watered and fed was the choice of the ship's officers. In the game an employee can help bring a change of plan earlier, which holds only in this branch.
        zh:
          name: 水和食物的计划
          text: 上岸的队伍怎样补水、补食物，是船上军官的选择。游戏里员工能帮着让计划提前改变，只在这条分支里成立。
