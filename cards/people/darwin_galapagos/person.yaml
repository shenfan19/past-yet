era_text:
  en:
    name: Galapagos, 1835
    short: Galapagos
    place_name: Galapagos Islands
    tags:
      - medical
      - heat
      - voyage
      - c19
      - galapagos
      - history
    event_titles:
      expedition_handoff: 'The specimen label'
      time_strain: Time slip
    plots:
      field_notes:
        name: Give Darwin a field notebook
        desc: Lets him set down each island and each bird so that others can compare them.
        character: Charles Darwin
        article: people:darwin_galapagos
      germ_theory:
        name: Explain germ theory to Charles Darwin
        desc: Needs the craft of microbiology, which this era does not have.
        character: Charles Darwin
        article: people:darwin_galapagos
    blurb: Dry heat and lava on islands with little fresh water, and a young naturalist who writes down everything. Close, cheap, and the effect of water and shade is clear.
    handle_label: The plan for water and food is changed
    protagonist: Charles Darwin
    protagonist_role: A young naturalist who collects on the islands and wants to understand what he finds
    stay: Stay seven days
    plan_baseline: Main timeline
    encyclopedia:
      history:
        - text: In 1835 the survey ship Beagle spent about five weeks at the Galapagos Islands, from 15 September to 20 October.
          check: true
        - text: Charles Darwin went ashore on several islands, collecting birds, plants and rocks in the heat.
          check: true
        - text: What he saw there, and noted, became important to his ideas about how species change, but not at once.
          check: true
      regret:
        - You can save today's people but not the whole voyage. On the main timeline the plan was not changed.
        - Water and shade matter more than any one clever idea, but a plan only changes when someone is heard.
    events:
      expedition_handoff: '{date}: Joan and {staff} take time to copy the island name twice. Wren’s first boat leaves without the bundle. The next boat will have both the specimen and its checked label.'
      expedition_send: '{date}: The survey is beginning and Wren has one bundle ready to send. {staff} keeps the island name with it and hands Joan the blank copy for a later cross-check.'
      time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
    star_points:
      convince: 'Convince Darwin'
      trust: 'Win the trust of the ship''s company'
      reform: 'Have the plan for water and food changed before the simulation baseline'
    milestones:
      surveying: '{date}: The Beagle surveys the outer coast of Chatham Island, now San Cristóbal.'
      lands: '{date}: Darwin records an afternoon landing on Chatham Island with FitzRoy.'
      first_treat: '{date}: {staff} brings the first cup of clean water to a man with the heat sickness. He starts to speak.'
      first_protect: '{date}: {staff} hands out the first mosquito nets to the shore party and shows the men how to put them up.'
      met_darwin: '{date}: {staff} is received by Darwin.'
      darwin_trusts: '{date}: Darwin gives {staff} the notes to work from.'
      darwin_convinced: '{date}: Darwin takes up the plan that {staff} put to him.'
      board_moves: '{date}: Word goes round that the plan might change.'
      reform_history: '{date}: The simulated expedition sets its new plan on the model’s baseline date.'
      reform_early: '{date}: The plan for water and food is changed {advance_days:1} days before the model’s baseline.'
      trust_won: '{date}: The ship''s company no longer keeps {staff} out, and some ask for help.'
      exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
      outbreak_fades: '{date}: The number of ailing men falls to single digits.'
    summary:
      near_death: '{staff} collapses at Galapagos and is pulled back by the recall charm. Life saved, at a price.'
      stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
      gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
      legend: '{staff} left a legend at Galapagos. The plan was changed {advance_days:1} days before the model’s baseline.'
      perfect: '{staff} completed the task at Galapagos and came back safe. The simulation records {base_D:i} lost in the baseline and {D:i} in this branch.'
      scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
      modest: '{staff} spent seven days at Galapagos, did what was within reach, and came back safe.'
    quotes:
      near_death:
        - trait: kind
          text: At the end I was still wondering whether anyone was keeping watch at night.
        - text: I thought I could hold out a little longer.
      stay_and_gifts:
        - trait: kind
          text: I remember every one of their names. I want to stay a while.
        - text: They need people here.
      gave_up:
        - trait: homesick
          text: I want to go home. That is all.
        - text: I am not cut out for this.
      legend:
        - text: I only told them what they needed to hear.
      perfect:
        - trait: kind
          text: I could save today's people, not tomorrow's.
        - trait: curious
          text: So that is how it is, water and shade are what keep the shore parties well.
        - text: Did what had to be done.
      scramble:
        - trait: methodical
          text: They will understand sooner or later. Just later.
        - text: Next time I want to bring more.
      modest:
        - trait: glib
          text: I said all I had to say. Whether they listen is up to them.
        - text: With one more item I might have saved one more life.
    hints:
      lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
      unused_protect: Some mosquito nets stayed packed because the crew had yet to trust you.
      unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
      ally_gap: Charles Darwin's evidence is still thin. The handbook helps, provided the employee spends time with him.
      none: Change one thing and send again with the same seed, that makes the comparison clearest.
