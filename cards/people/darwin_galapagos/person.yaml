      text:
        en:
          name: Galapagos Islands, 1835
          text: A group of volcanic islands on the equator in the Pacific, dry near the shore and with little fresh water. The Beagle in the game is a ship's company model of about seventy people.
        zh:
          name: 加拉帕戈斯群岛，1835
          text: 太平洋赤道上的一群火山岛，岸边干燥，淡水很少。游戏里的小猎犬号是一个约七十人的船员模型。
