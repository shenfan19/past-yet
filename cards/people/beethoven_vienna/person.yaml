    text:
      en:
        name: The Ninth Symphony
        place: Vienna
        figure: Ludwig van Beethoven
        story: 'In the spring of 1824 Beethoven, almost entirely deaf, prepared a concert of his new works in Vienna. The chorus and orchestra rehearsed apart, and there were only two full rehearsals before the night. On 7 May 1824 the Ninth Symphony was first performed at the Kärntnertor Theatre, with the theatre''s Kapellmeister Michael Umlauf conducting and Beethoven on the stage beside him. The repeat on 23 May in the great Redoutensaal drew a thin house, and the receipts disappointed him.'
        relic: An ear trumpet
        relic_desc: A horn he held to his ear as the world went quiet.
        points:
          p1: 'Bring the separately rehearsed choir and orchestra together at the first joint rehearsal and protect the Ninth''s premiere'
          p2: 'Leave Beethoven a written account of the combined rehearsal so he can respond before the concert'
          p3: 'Secure advance blocks of seats before listeners leave Vienna and salvage the second concert''s receipts'
        points_fail:
          p1: 'The groups lose their place when they come in, and a passage drops out at the premiere. The branch falls out of sync and the office recalls the employee.'
          p2: 'Players mark their parts separately and the rehearsal problems never reach the composer for review.'
          p3: 'The repeat comes after the season. Too many seats are empty for Beethoven to make the return he hoped for.'
        shift:
          p1:
            was: 'On 7 May 1824 Beethoven''s Ninth Symphony was first performed in Vienna.'
          p2:
            was: 'In May 1824, during preparations for the premiere, musicians conveyed rehearsal news to Beethoven in his conversation books.'
            now: '{staff} puts the most troublesome entries on one page and has the sections try them again with marks Beethoven has approved.'
          p3:
            was: 'On 23 May 1824 the second concert took place in Vienna and brought in disappointing receipts.'
            now: '{staff} secures reservations before prospective listeners leave the city and has those receipts included in the accounts. Beethoven has room to arrange a further concert on his own behalf.'
            who: beethoven_vienna
            bio: 'Beethoven had advance revenue when he arranged repeat concerts in Vienna. He could cover more of their costs before the doors opened.'
        vignettes:
          parts: '{staff} sits at the copyists'' table pressing parts flat while the ink dries. The horn parts are snatched away to the rehearsal room before they are dry, and {staff} spends the afternoon blotting the smudges out of the second set.'
          prater: 'On Sunday {staff} walks the long avenue of the Prater. Every bench is taken by people come out of town for the air, a sausage seller is shouting himself hoarse, and nobody seems to be on the way to a concert.'
          stools: '{staff} carries stools for the chorus behind the theatre. A soprano rubs her throat and says the high notes in the last movement are written as if to haul a singer up to the ceiling, and the whole row laughs and agrees.'
      zh:
        name: 第九交响曲
        place: 维也纳
        figure: 路德维希·凡·贝多芬
        story: '1824 年春天，几乎全聋的贝多芬在维也纳筹办一场新作音乐会。合唱和乐队分开排练，正式演出前只有两次全体排练。5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，剧院乐长米夏埃尔·乌姆劳夫指挥，贝多芬在台上站在他旁边。5 月 23 日在大雷杜滕厅的第二场，听众稀落，票房让他失望。'
        relic: 一只助听喇叭
        relic_desc: 世界静下来的时候，他举到耳边的号角。
        points:
          p1: '在合唱与乐队第一次合排时把分开练过的开头对齐，护住《第九交响曲》的首演'
          p2: '给听不见乐队的贝多芬留一份合排记录，让他有机会在正式演出前回应'
          p3: '赶在观众出城前替贝多芬找到愿意包座的人，救回第二场的票房'
        points_fail:
          p1: '各组进场时对不上，首演临场缺了一段，这条分支与史实脱节，员工被召回。'
          p2: '演奏者在分谱上各记各的，合排里暴露的问题到上台也没有送给作曲者确认。'
          p3: '再演时季节已过，空座多，贝多芬没能靠这一场挣回应得的收入。'
        shift:
          p1:
            was: '1824 年 5 月 7 日，贝多芬的《第九交响曲》在维也纳首次演出。'
          p2:
            was: '1824 年 5 月，首演筹备中，贝多芬借谈话簿接收演奏者转述的排练情况。'
            now: '{staff}把几处要紧的进拍问题写在同一页，请各声部按贝多芬认可的记号重试。'
          p3:
            was: '1824 年 5 月 23 日，第二场音乐会在维也纳举行，票房不理想。'
            now: '{staff}赶在潜在观众离城前落实一批预订，把实收票款记入结算。贝多芬有余地继续安排为自己筹款的演出。'
            who: beethoven_vienna
            bio: '贝多芬在维也纳安排重演时有了预订收入，演出开支不必全押给当天买票的人。'
        vignettes:
          parts: '{staff}坐在抄谱人的桌边，替他们压平刚抄好的分谱等墨干。圆号的分谱还没干透就被人抢去了排练厅，{staff}一下午都在给第二份吸墨渍。'
          prater: '星期天，{staff}在普拉特的林荫长道上走。长椅上坐满了出城透气的人，卖香肠的嗓子都喊哑了，看不出有谁要去听音乐会。'
          stools: '{staff}在剧院后头给合唱队搬凳子。一个女高音揉着喉咙说，末乐章那几个高音写得像要把人往天花板上拽，一排人都笑着点头。'
text:
  en:
    name: Ludwig van Beethoven
    text: German composer, 1770 to 1827, born in Bonn, who spent most of his working life in Vienna. His hearing declined from his late twenties and was almost gone by the time of the Ninth Symphony, first performed in Vienna on 7 May 1824. He died in Vienna on 26 March 1827.
  zh:
    name: 路德维希·凡·贝多芬
    text: 德国作曲家，1770 年生于波恩，1827 年去世，大半生在维也纳工作。他从二十多岁末起听力渐退，1824 年 5 月 7 日《第九交响曲》在维也纳首演时已几乎全聋。1827 年 3 月 26 日，他在维也纳去世。
hook: {en: 'After the applause, the second night', zh: '掌声过后，第二场呢'}
facts:
  full_rehearsals:
    date: '1824-05-05'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [beethoven_conversation_rehearsals, beethoven_ninth_wiki]
    text:
      en: 'Chorus and orchestra rehearsed in separate rooms until the first combined rehearsal on 5 May 1824; with the dress rehearsal of 6 May there were only two full rehearsals before the premiere.'
      zh: '合唱与乐队分屋排练，直到 1824 年 5 月 5 日才第一次合排，加上 6 日的总排，首演前只有两次全体排练。'
    line:
      en: '5 May 1824: chorus and orchestra rehearse together for the first time, two days before the concert.'
      zh: '1824 年 5 月 5 日，合唱与乐队第一次合在一起排练，离演出只剩两天。'
  premiere:
    date: '1824-05-07'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [beethoven_vienna_primary, beethoven_ninth_wiki, beethoven_conversation_rehearsals]
    text:
      en: 'On the evening of 7 May 1824 Beethoven''s Ninth Symphony was first performed at the Kärntnertor Theatre in Vienna, after the overture The Consecration of the House and three parts of the Missa solemnis. Michael Umlauf conducted, and Beethoven stood on the stage beside him; Henriette Sontag and Caroline Unger were among the soloists.'
      zh: '1824 年 5 月 7 日晚，贝多芬的《第九交响曲》在维也纳克恩特纳门剧院首演，前面演了《献堂式》序曲和《庄严弥撒》的三个乐章。乌姆劳夫指挥，贝多芬站在台上他的身旁，独唱有亨丽埃特·桑塔格和卡罗琳·翁格尔。'
    line:
      en: '7 May 1824: at the Kärntnertor Theatre the Ninth Symphony is played for the first time, with Beethoven on the stage.'
      zh: '1824 年 5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，贝多芬站在台上。'
  second_concert:
    date: '1824-05-23'
    stay_day: 31
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [beethoven_conversation_rehearsals, beethoven_ninth_cambridge]
    text:
      en: 'The concert was given again on Sunday 23 May 1824 in the great Redoutensaal. The hall was poorly attended and Beethoven''s receipts disappointed him; Schindler''s claim that it was not even half full is repeated in later accounts and has been questioned.'
      zh: '1824 年 5 月 23 日星期天，音乐会在大雷杜滕厅重演一场。听众稀落，票房让贝多芬失望；辛德勒说厅里坐不到一半，这话后人常引，也有人存疑。'
    line:
      en: '23 May 1824: the concert is repeated in the great Redoutensaal; the hall is thin and the takings disappoint Beethoven.'
      zh: '1824 年 5 月 23 日，音乐会在大雷杜滕厅重演，座位空了不少，票房让贝多芬失望。'
  death:
    date: '1827-03-26'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [beethoven_wiki, beethoven_britannica]
    text:
      en: 'Beethoven died in Vienna on 26 March 1827.'
      zh: '1827 年 3 月 26 日，贝多芬在维也纳去世。'
    note: 'A death: written as a plain fact.'
    line:
      en: '26 March 1827: Ludwig van Beethoven dies in Vienna.'
      zh: '1827 年 3 月 26 日，路德维希·凡·贝多芬在维也纳去世。'
