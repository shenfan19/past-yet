      zh: '1824 年 5 月 5 日，合唱与乐队第一次合在一起排练，离演出只剩两天。'
      zh-Hant: '1824 年 5 月 5 日，合唱與樂隊第一次合在一起排練，離演出只剩兩天。'
      fr: '5 mai 1824 : chœur et orchestre répètent ensemble pour la première fois, deux jours avant le concert.'
      es: '5 de mayo de 1824: coro y orquesta ensayan juntos por primera vez, dos días antes del concierto.'
      ja: '1824年5月5日：コンサートの2日前に合唱団とオーケストラが初めて一緒にリハーサルを行う。'
      ko: '1824년 5월 5일: 합창단과 오케스트라가 콘서트 이틀 전에 처음으로 함께 연습했습니다.'
      ru: '5 мая 1824 года: хор и оркестр впервые репетируют вместе, за два дня до концерта.'
  premiere:
    date: '1824-05-07'
    stay_day: 15
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [beethoven_vienna_primary, beethoven_ninth_wiki, beethoven_conversation_rehearsals]
    text:
      en: 'On the evening of 7 May 1824 Beethoven''s Ninth Symphony was first performed at the Kärntnertor Theatre in Vienna, after the overture The Consecration of the House and three parts of the Missa solemnis. Michael Umlauf conducted, and Beethoven stood on the stage beside him; Henriette Sontag and Caroline Unger were among the soloists.'
      zh: '1824 年 5 月 7 日晚，贝多芬的《第九交响曲》在维也纳克恩特纳门剧院首演，前面演了《献堂式》序曲和《庄严弥撒》的三个乐章。乌姆劳夫指挥，贝多芬站在台上他的身旁，独唱有亨丽埃特·桑塔格和卡罗琳·翁格尔。'
    line:
      en: '7 May 1824: at the Kärntnertor Theatre the Ninth Symphony is played for the first time, with Beethoven on the stage.'
      zh: '1824 年 5 月 7 日，《第九交响曲》在克恩特纳门剧院首演，贝多芬站在台上。'
      zh-Hant: '1824 年 5 月 7 日，《第九交響曲》在克恩特納門劇院首演，貝多芬站在臺上。'
      fr: '7 mai 1824 : au Théâtre Kärntnertor est jouée pour la première fois la Neuvième Symphonie, avec Beethoven sur scène.'
      es: '7 de mayo de 1824: en el Teatro Kärntnertor se interpreta por primera vez la Novena Sinfonía, con Beethoven en escena.'
      ja: '1824年5月7日：ケルントナートール劇場で、ベートーヴェンがステージに上がり、初めて交響曲第9番が演奏される。'
      ko: '1824년 5월 7일: Kärntnertor 극장에서 9번 교향곡이 베토벤과 함께 처음으로 연주되었습니다.'
      ru: '7 мая 1824 года: в театре Кернтнертор впервые исполняется Девятая симфония с Бетховеном на сцене.'
  second_concert:
    date: '1824-05-23'
    stay_day: 31
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [beethoven_conversation_rehearsals, beethoven_ninth_cambridge]
    text:
      en: 'The concert was given again on Sunday 23 May 1824 in the great Redoutensaal. The hall was poorly attended and Beethoven''s receipts disappointed him; Schindler''s claim that it was not even half full is repeated in later accounts and has been questioned.'
      zh: '1824 年 5 月 23 日星期天，音乐会在大雷杜滕厅重演一场。听众稀落，票房让贝多芬失望；辛德勒说厅里坐不到一半，这话后人常引，也有人存疑。'
    line:
      en: '23 May 1824: the concert is repeated in the great Redoutensaal; the hall is thin and the takings disappoint Beethoven.'
      zh: '1824 年 5 月 23 日，音乐会在大雷杜滕厅重演，座位空了不少，票房让贝多芬失望。'
      zh-Hant: '1824 年 5 月 23 日，音樂會在大雷杜滕廳重演，座位空了不少，票房讓貝多芬失望。'
      fr: '23 mai 1824 : le concert est répété dans la grande Redoutensaal ; la salle est maigre et les recettes déçoivent Beethoven.'
      es: '23 de mayo de 1824: se repite el concierto en la gran Redoutensaal; la sala es escasa y las ganancias decepcionan a Beethoven.'
      ja: '1824年5月23日：偉大なレドゥーテンザールでコンサートが繰り返される。ホールは狭く、ベートーヴェンの期待を裏切る結果となった。'
      ko: '1824년 5월 23일: Redoutensaal에서 콘서트가 반복되었습니다. 홀은 얇고 베토벤을 실망시킵니다.'
      ru: '23 мая 1824 г.: концерт повторяется в большом Редутенсале; зал небольшой, а доходы разочаровывают Бетховена.'
