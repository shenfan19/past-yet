quotes:
  beethoven_heart_echo:
    order: 1
    tier: full
    date: '1823'
    checked: official_record
    sources: [beethoven_missa_autograph]
    original: de
    text:
      en:
        who: 'Ludwig van Beethoven'
        quote: 'From the heart—may it go to the heart again!'
        occasion: 'Inscription on the autograph score of the Missa solemnis · Game translation'
      zh:
        who: '路德维希·范·贝多芬'
        quote: '发自内心——愿它也抵达人心！'
        occasion: '《庄严弥撒》总谱手稿上的题词 · 游戏译文'
      de:
        who: 'Ludwig van Beethoven'
        quote: 'Von Herzen - Möge es wieder - Zu Herzen gehn!'
        occasion: 'Inschrift in der autographen Partitur der Missa solemnis'
      zh-Hant:
        who: '路德維希·範·貝多芬'
        quote: '發自內心——願它也抵達人心！'
        occasion: '《莊嚴彌撒》總譜手稿上的題詞 · 遊戲譯文'
      fr:
        who: 'Ludwig van Beethoven'
        quote: 'Du cœur – puisse-t-il revenir au cœur !'
        occasion: 'Inscription sur la partition autographe de la Missa solemnis · Traduction du jeu'
      es:
        who: 'Ludwig van Beethoven'
        quote: 'Desde el corazón, ¡que vuelva al corazón!'
        occasion: 'Inscripción en la partitura autógrafa de la Missa solemnis · Traducción del juego'
      ja:
        who: 'ルートヴィヒ・ヴァン・ベートーヴェン'
        quote: '心から――また心に届きますように！'
        occasion: 'ミサ・ソレムニスの自筆譜の碑文・ゲーム翻訳'
      ko:
        who: '루트비히 판 베토벤'
        quote: '마음에서, 다시 마음으로 돌아가길 바랍니다!'
        occasion: 'Missa Solemnis의 친필 악보에 각인 · 게임 번역'
      ru:
        who: 'Людвиг ван Бетховен'
        quote: 'От сердца — пусть оно снова дойдет до сердца!'
        occasion: 'Надпись на автографе Missa solemnis · Перевод игры'
  beethoven_work_echo:
    order: 2
    tier: none
    date: '1802-10-06'
    checked: official_record
    sources: [beethoven_heiligenstadt_words]
    original: de
    text:
      en:
        who: 'Ludwig van Beethoven'
        quote: 'Ah, I felt I could not leave the world before bringing forth everything I felt capable of creating.'
        occasion: 'Heiligenstadt Testament, addressed to his brothers · Game translation'
      zh:
        who: '路德维希·范·贝多芬'
        quote: '唉，在把自己觉得能够创作的一切都创作出来之前，我觉得自己不能离开这个世界。'
        occasion: '在海利根施塔特写给两位弟弟的信 · 游戏译文'
      de:
        who: 'Ludwig van Beethoven'
        quote: 'Ach es dünkte mir unmöglich, die Welt eher zu verlassen, bis ich das alles hervorgebracht, wozu ich mich aufgelegt fühlte'
        occasion: 'Heiligenstädter Testament, an seine Brüder'
      zh-Hant:
        who: '路德維希·範·貝多芬'
        quote: '唉，在把自己覺得能夠創作的一切都創作出來之前，我覺得自己不能離開這個世界。'
        occasion: '在海利根施塔特寫給兩位弟弟的信 · 遊戲譯文'
      fr:
        who: 'Ludwig van Beethoven'
        quote: 'Ah, je sentais que je ne pouvais pas quitter le monde avant de donner naissance à tout ce que je me sentais capable de créer.'
        occasion: 'Testament de Heiligenstadt, adressé à ses frères · Traduction du jeu'
      es:
        who: 'Ludwig van Beethoven'
        quote: 'Ah, sentí que no podía dejar el mundo antes de dar a luz todo lo que me sentía capaz de crear.'
        occasion: 'Testamento de Heiligenstadt, dirigido a sus hermanos · Traducción del juego'
      ja:
        who: 'ルートヴィヒ・ヴァン・ベートーヴェン'
        quote: 'ああ、自分が創造できると感じたすべてのものを生み出す前に、この世界を離れることはできないと感じました。'
        occasion: 'ハイリゲンシュタットの遺書、兄弟に宛てたもの・ゲーム翻訳'
      ko:
        who: '루트비히 판 베토벤'
        quote: '아, 내가 만들 수 있다고 느낀 모든 것을 이루기 전에는 세상을 떠날 수 없다고 느꼈습니다.'
        occasion: '그의 형제들에게 보낸 하일리겐슈타트 유언장 · 게임 번역'
      ru:
        who: 'Людвиг ван Бетховен'
        quote: 'Ах, я чувствовал, что не могу покинуть этот мир, прежде чем не создам все, что, по моему мнению, способен создать.'
        occasion: 'Хайлигенштадтское завещание, адресованное братьям · Перевод игры'
self_check:
  fact: second_concert
  quote_line: '1824 年 5 月 23 日，音乐会在大雷杜滕厅重演，座位空了不少，票房让贝多芬失望。'
  regret_choice: '派乐手去，5 月 5 日的合排对得齐，首演稳住了；派会张罗的人去，第二场前就有人包下座位，贝多芬那一场没白忙。一个人很难两头都顾上。'
  bookend: '从分屋排练的乐队与合唱开始，以 5 月 23 日空了不少座位的第二场收尾，首演的掌声没有变成他的收入。'
  share_line: '1824 年 5 月，我在维也纳替一位听不见的作曲家把座位卖出去。'
  share_number: '2'
  knowing: 'full_rehearsals'
  near: 'premiere, second_concert'
  lever: 'p1, p2, p3'
  missed: 'second_concert'
  brought: 'relic'
