      zh: '传记说柏拉图回雅典后住在城墙外名为学园的体育场一带。这一节没有记开学日。'
  double_square:
    date: '-380'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [plato_academy_double_square]
    text:
      en: 'The exercise reaches double the area by making the original diagonal the side of a new square.'
      zh: '篇中以原方形的对角线作新方形的边，得到两倍面积。'
bystanders:
  mikon:
    invented: true
    text: {en: 'A fictional learner whose first line is twice as long as it should be for the intended comparison.', zh: '虚构的学生米孔，为比较面积，第一笔就把边画长了一倍。'}
  doro:
    invented: true
    text: {en: 'A fictional keeper of a borrowed wax tablet, due to return it at dusk.', zh: '虚构的多萝借来蜡板，入夜前得归还。'}
