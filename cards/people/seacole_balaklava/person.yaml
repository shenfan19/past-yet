    text:
      en:
        name: "The inn she found her own way to"
        place: "Balaklava"
        figure: "Mary Seacole"
        story: 'Mary Seacole''s 1857 memoir describes the British Hotel she ran with Thomas Day near Balaklava, the goods it sold and the people who came there in 1855.'
        story_prose:
          opening:
            - 'The hotel by the Balaklava road has just opened its counter. Mary Seacole pushes the bag for the temporary hospital toward the door. Thomas Day asks what has been set out for sale. She says she will see to the wounded first and come back to the accounts.'
            - 'On 18 June 1855 Seacole records helping the wounded near the temporary hospital and injuring her thumb. The hotel she ran with Day also faced theft. After peace, the pair went bankrupt in 1856. You can preserve the work at the hospital and help separately with her injury, the horses and the stock.'
            - 'Send someone with care experience. A traveller who knows the hotel can watch the stable. Later, use someone who can check the books with both partners before deciding whether to order more stock.'
          points:
            p1: 'Someone from the road asks whether you can send anything to the temporary hospital. You pass over the bag by the door and some water, then check with Seacole who is waiting by the beds. By the time she reaches the hospital, the person who asked has found a spot where she can put the bag down. She opens it and asks the closest patient what he needs.'
            p2: 'Seacole supports her right hand and says it hurts to move the thumb. You call someone trained to care for her and ask where she wants to sit. Someone else takes the bag she was carrying. After a rest she lifts her hand and says it hurts less, then asks for a slip to write down a patient’s name.'
            p3: 'A noise comes from the back door. The clerk gets up and finds nobody watching the stable. You have one person call Seacole and another count the horses from a place where the yard is visible. Whoever is outside hears the yard answer and goes away. At dawn the horses wanted for the cart are still at the trough.'
            p4: 'Day is about to put in a fresh order. Seacole asks him to count the goods on the shelves aloud. You set out orders, stock and outstanding debts on a single sheet, then ask what can sell before the army leaves. The partners check it once and cancel the next delivery. When Seacole closes her books, an empty shelf remains behind the counter for the last collection.'
          outcomes:
            all: 'Seacole gets to the temporary hospital and is still able to use her hand later. The stable stays full and the partners settle the books when the hotel closes.'
            p1: 'She looks after people by the temporary hospital as intended and goes back to the hotel that evening.'
            p2: 'Someone sees to her thumb, and using a pen is easier when she gets back to her notes.'
            p3: 'The horses remain in the stable that night. In the morning the people with the cart know where to find them.'
            p4: 'Seacole and Day settle the accounts. The last delivery does not leave them with unsold stock when the troops go home.'
          none: 'Nobody has finished counting the stock and the people by the road still wait for someone to attend them.'
          not_admitted: 'The clerk asks the visitor not to block the door. The hospital bag is not on your list to take.'
          desync: 'Seacole does not reach the place where she helped by the road in history. The office recalls the traveller.'
          excerpts:
            p1: 'She opens it and asks the closest patient what he needs.'
            p2: 'After a rest she lifts her hand and says it hurts less, then asks for a slip to write down a patient’s name.'
            p3: 'At dawn the horses wanted for the cart are still at the trough.'
            p4: 'When Seacole closes her books, an empty shelf remains behind the counter for the last collection.'
        relic: "A medicine chest"
        relic_desc: "An old wooden chest with compartments for herbs and gauze."
        points:
          p1: "On 18 June, the day the assault on the Redan fails, keep Seacole at her work under fire beside the temporary hospital on the Woronzoff Road"
          p2: "When she throws herself down from a shell and dislocates her right thumb, set the joint and splint it on the spot"
          p3: "Stop the thieves who come in the night for the horses of the British Hotel"
          p4: "After Sevastopol falls, persuade Seacole and Thomas Day to stop buying stock and settle their accounts, so that peace does not leave them bankrupt"
        points_fail:
          p1: "She never reaches the temporary hospital that day and the wounded wait by the road unbandaged. This branch falls out of step with history and the office recalls the employee."
          p2: "The thumb is only bound up in haste, and in this branch, as in history, it never returns to its proper shape."
          p3: "Half the stable is empty by morning, and the hotel has to borrow animals from the Land Transport camp to fetch its goods."
          p4: "When the army leaves after the peace the stock will not sell, and in November 1856 the two partners are declared bankrupt in London."
        shift:
          p1:
            was: "On 18 June 1855, the day the allied assault on the Redan failed, Seacole carried bandages and food under fire to the temporary hospital by the Woronzoff Road and helped the doctors with the wounded."
          p2:
            was: "On 18 June 1855 Seacole threw herself down to escape a shell and dislocated her right thumb; it was bound up on the spot and never returned to its proper shape."
            now: "{staff} sets the joint and splints it there and then. A few weeks later her right hand mixes medicines and ties bandages as before."
          p3:
            was: "In 1855 the British Hotel at Spring Hill was robbed again and again; one morning most of its horses were gone."
            now: "{staff} stops the men leading the horses away during the night watch. The next day the hotel carts go down to Balaklava as usual."
          p4:
            was: "After the peace of March 1856 the army left quickly and Seacole and Day were left with unsold stock and debts; a bankruptcy petition was filed against them in October 1856 and they were declared bankrupt in November."
            now: "{staff} persuades the two partners in the autumn to stop the large orders and to collect what they are owed. When the peace comes their stock is small, they leave the Crimea with their accounts settled, and they never stand before the bankruptcy court."
            who: seacole_balaklava
            bio: "In this timeline Seacole came home from the Crimea without being bankrupt and with some capital of her own. She did not have to live on a public subscription and went on nursing and travelling on her own money."
        vignettes:
          meal: 'A fictional customer has been standing so long that they cannot explain what they came for. You find a seat first. By the time the attendant returns, the customer can ask for supper in their own words.'
          counter: 'Two customers repeat the same order, each thinking the other has not been heard. You ask the attendant to read back what they wrote. One tray turns out to be enough.'
          shelf: 'The attendant calls for room at the end of the counter. You move two empty plates and put a stool where a waiting guest can sit without holding up the next customer.'
      zh:
        name: "自己找路去的战地客栈"
        place: "巴拉克拉瓦"
        figure: "玛丽·西科尔"
        story: '玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。'
        story_prose:
          opening:
            - '巴拉克拉瓦路旁的旅馆刚开柜，玛丽·西科尔把到临时医院用的包往门边推。托马斯·戴问今天备了几份货，她说先去看看伤员，其他事回来再算。'
            - '1855 年 6 月 18 日，西科尔记下战斗当天自己在临时医院附近照看伤员，也记下拇指受伤。她与戴经营的旅馆还遇到失窃，和约后于 1856 年破产。这里可以护住当日照护，再分别处理受伤、马匹和积货。'
            - '派有照护经验的人跟她去。夜里要有熟悉旅馆的人照管马厩，随后还需会算账的员工同两位经营者讨论何时停止进货。'
          points:
            p1: '从路边来的人伸手问能不能给临时医院捎些东西。你把门边那个包和多的一份水交给搬运的人，和西科尔对清谁在靠近病榻的地方等。等她走到医院边，先前问话的人已经给她留出一处可以搁包的位置。她放下包，叫最近的伤员先说要什么。'
            p2: '西科尔扶住右手，说拇指一动就疼。你请一位照护者就近来帮她，先问愿在哪儿坐，然后替她叫人接下手里的包。歇了一会儿她抬起手说轻些了，让来查看的人留一张纸给她记病人的名字。'
            p3: '后门传来动静，伙计起身才发现马厩原来没人看。你请一人把西科尔叫来，另一人到能看见的地方点马，不跟黑处的人起冲突。听见院内有人应声，门外的动静停了。早晨开门，昨天要套车的那几匹都还在槽边。'
            p4: '戴准备再进一批货，西科尔让他把还在货架上的数给你听。你请他们把预订、现货和欠账另列一张，再问哪些能在撤军前卖清。两人核过一遍，划去下一次进货。西科尔把账合上那天，柜台后还有空架留给最后来取货的人。'
          outcomes:
            all: '西科尔完成了路边的照护，之后能继续使用自己的手。马和账都有人看守，旅馆停业后两位合伙人还清了账。'
            p1: '她按自己的安排在临时医院旁帮伤员，晚上才回到旅馆。'
            p2: '她的拇指得到了照护，后来拿笔记字时方便些。'
            p3: '夜里想牵走马的人没得手，来车的人第二天仍能从马厩取马。'
            p4: '西科尔和戴按清单结账，撤军时没被最后一批货拖住。'
          none: '柜上的货没点清，路边的人仍等到后来才有人照护。'
          not_admitted: '伙计请来客别挡运货的门。医院要取的包不在你的交接单上。'
          desync: '西科尔没能按史实到路旁照护。事务所因同步失败召回员工。'
          excerpts:
            p1: '她放下包，叫最近的伤员先说要什么。'
            p2: '歇了一会儿她抬起手说轻些了，让来查看的人留一张纸给她记病人的名字。'
            p3: '早晨开门，昨天要套车的那几匹都还在槽边。'
            p4: '西科尔把账合上那天，柜台后还有空架留给最后来取货的人。'
        relic: "一只药箱"
        relic_desc: "一只旧木药箱，里面分格放着草药和纱布。"
        points:
          p1: "6 月 18 日进攻棱堡失利那天，在炮火下护住西科尔在沃龙佐夫路临时医院旁照看伤员"
          p2: "她为躲炮弹扑倒摔脱了右手拇指，当场替她复位、上夹板"
          p3: "拦下夜里来偷英国旅馆马匹的贼"
          p4: "塞瓦斯托波尔陷落以后，劝西科尔和托马斯·戴停下进货、结清账目，不让和约一来他们就破产"
        points_fail:
          p1: "那天她没能走到临时医院，伤员在路边等不到包扎。这条分支与历史脱节，员工被送回。"
          p2: "拇指只是当场草草包上，这条分支里和历史上一样，再也没长回原来的样子。"
          p3: "一夜之间马厩空了大半，旅馆还得去陆军运输营借牲口下山拉货。"
          p4: "和约之后军队撤走，存货卖不出去，1856 年 11 月两人在伦敦被宣告破产。"
        shift:
          p1:
            was: "1855 年 6 月 18 日，联军进攻棱堡失利，西科尔带着绷带和食物冒着炮火走到沃龙佐夫路旁的临时医院，帮医生照看伤员。"
          p2:
            was: "1855 年 6 月 18 日，西科尔为躲炮弹扑倒在地，摔脱了右手拇指，当场包扎，此后再没恢复原形。"
            now: "{staff} 当场把关节复位、上了夹板。几周后她的右手照常调药、包扎。"
          p3:
            was: "1855 年，春山的英国旅馆屡遭偷窃，有一天早上起来，马厩里的马大半不见了。"
            now: "{staff} 守夜时拦住了牵马的人。第二天旅馆的车照常下巴拉克拉瓦取货。"
          p4:
            was: "1856 年 3 月和约签订后军队很快撤离，西科尔与戴剩下卖不掉的存货和欠款，同年 10 月被人申请破产，11 月在伦敦被宣告破产。"
            now: "{staff} 在秋天说动两人停了大宗订货，把赊账一笔笔收回。和约来时存货已经不多，他们清了账离开克里米亚，没有走进破产法庭。"
            who: seacole_balaklava
            bio: "这条时间线里，西科尔从克里米亚回来时没有破产，手里还有一笔本钱。她不必靠众人捐款度日，用自己的钱继续行医和远行。"
        vignettes:
          meal: '一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。'
          counter: '两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。'
          shelf: '店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。'
text:
  en:
    name: "Mary Seacole"
    text: "Nurse and businesswoman born in Jamaica, 1805 to 1881. After being refused as an army nurse she went to the Crimea at her own cost and tended the sick and wounded behind the lines."
  zh:
    name: "玛丽·西科尔"
    text: "牙买加出生的护士和商人，1805 年生，1881 年去世。申请做军队护士被拒绝后自费前往克里米亚，在营地后方照看伤病员。"
