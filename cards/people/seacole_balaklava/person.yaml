        en:
          name: Balaklava, 1855
          text: A small harbour on the south coast of the Crimea that served as the British supply base. Balaklava in the game is a camp model of about five hundred people.
        zh:
          name: 巴拉克拉瓦，1855
          text: 克里米亚南岸的一个小港口，是英军的补给基地。游戏里的巴拉克拉瓦是一个约五百人的营地模型。
  events:
    camp_stores:
      order: 7
      tags:
