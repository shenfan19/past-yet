events:
  seacole_balaklava:
    order: 215
    year: 1855
    lon: 33.6
    lat: 44.5
    region: europe
    field: medicine
    tier: 2
    era: seacole_balaklava_1855
    channels: {E: 3, L: 2, S: 2}
    regret: true
    refs: [seacole_memoir_hotel, seacole_memoir_june]
    scene:
      points:
        - {id: p1, kind: care, req: {"job":["nurse","midwife","physician","paramedic","doctor"]}}
        - {id: p2, kind: persuade, req: {"trait":["streetwise","cosmopolitan","charismatic","skeptical"]}}
        - {id: p3, kind: endure, redeem: true, req: {"provides":"clean_water"}}
      vignettes:
        - {id: meal, traits: [kind, patient]}
        - {id: counter, traits: [streetwise, methodical]}
        - {id: shelf}
    text:
      en:
        name: "The inn she found her own way to"
        place: "Balaklava"
        figure: "Mary Seacole"
        story: 'Mary Seacole''s 1857 memoir describes the British Hotel she ran with Thomas Day near Balaklava, the goods it sold and the people who came there in 1855.'
        relic: "A medicine chest"
        relic_desc: "An old wooden chest with compartments for herbs and gauze."
        points:
          p1: "Tend the dysentery and cholera patients"
          p2: "Ask the quartermaster for a chest of medicine"
          p3: "Get through a whole summer"
        vignettes:
          meal: 'A fictional customer has been standing so long that they cannot explain what they came for. You find a seat first. By the time the attendant returns, the customer can ask for supper in their own words.'
          counter: 'Two customers repeat the same order, each thinking the other has not been heard. You ask the attendant to read back what they wrote. One tray turns out to be enough.'
          shelf: 'The attendant calls for room at the end of the counter. You move two empty plates and put a stool where a waiting guest can sit without holding up the next customer.'
      zh:
        name: "自己找路去的战地客栈"
        place: "巴拉克拉瓦"
        figure: "玛丽·西科尔"
        story: '玛丽·西科尔 1857 年的回忆录记有她同托马斯·戴在巴拉克拉瓦附近经营的英式旅店、卖的东西和 1855 年来过的人。'
        relic: "一只药箱"
        relic_desc: "一只旧木药箱，里面分格放着草药和纱布。"
        points:
          p1: "照看痢疾和霍乱病人"
          p2: "向军需官要一箱药"
          p3: "撑过一整个夏天"
        vignettes:
          meal: '一位虚构的来客站了太久，一时说不清来做什么。你先找了个座位，等店员回来，来客已能自己开口问晚饭。'
          counter: '两个人都以为店员没听见对方，便把同一份点单各报了一次。你请店员把写下来的念回来，原来只要备一盘。'
          shelf: '店员喊着要在柜台末端腾个地方。你挪走两只空盘，再放把凳子，让等候的人能坐下，也不挡下一位来客。'
text:
  en:
    name: "Mary Seacole"
    text: "Nurse and businesswoman born in Jamaica, 1805 to 1881. After being refused as an army nurse she went to the Crimea at her own cost and tended the sick and wounded behind the lines."
  zh:
    name: "玛丽·西科尔"
    text: "牙买加出生的护士和商人，1805 年生，1881 年去世。申请做军队护士被拒绝后自费前往克里米亚，在营地后方照看伤病员。"
