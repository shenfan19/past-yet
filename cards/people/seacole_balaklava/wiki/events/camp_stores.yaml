text:
  en:
    name: The camp stores
    text: Mary Seacole bought and carried her own supplies and ran an inn behind the camp. The date on which the army stores were opened to her is not recorded, so the game picks one and lets an employee bring it earlier in this branch.
  zh:
    name: 营地物资
    text: 玛丽·西科尔自己采购、自己运送物资，并在营地后方开了一家客栈。军队物资向她开放的日期没有记录，所以游戏自己定了一天，员工能在这条分支里让它提前。
