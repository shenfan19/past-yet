    text:
      en:
        name: 'Two years for one book'
        place: Vienna
        figure: Sigmund Freud
        story: 'Freud’s The Interpretation of Dreams reached readers around the turn of 1899–1900. The first edition bears 1900 on its title page, while Freud later recalled having the book before him in 1899.'
        relic: 'A dated bookseller’s slip'
        relic_desc: 'An invented slip that preserves the imprint and the arrival year.'
        points:
          p1: 'In Vienna, reconcile the copies received by shops with those still in transit so the first edition of The Interpretation of Dreams can go on sale'
          p2: 'Record when the advance copies and the published sheets actually leave. Keep both dates in the bookseller’s ledger'
          p3: 'Have the editor read the anonymous examples for details that might identify a person. Mark possible omissions for the author to approve'
        points_fail:
          p1: 'Advance copies are mistaken for the whole shipment. The Vienna seller has no stock on publication day, and the office recalls the employee.'
          p2: 'The catalogue copies only the title-page year. Then the letters and the printing date seem to be in the wrong order.'
          p3: 'The names are gone, but several details can still be matched. The author has to wait until another edition to review them.'
        shift:
          p1:
            was: 'Freud wrote on November 5, 1899, that the book had appeared the day before. The first edition’s title page gives 1900.'
          p2:
            was: 'Fliess received an advance copy. The preserved first edition and Freud’s correspondence give different ways of dating the book.'
            now: 'Early readers can match the dispatch dates to the title-page year. Later correspondence can be filed in the right sequence.'
          p3:
            was: 'The book includes case material and accounts used as examples. Later editions expanded it.'
            now: 'The bookseller retains approved edits without attaching names to copies in circulation. Before expanding an example in a new edition, the editor can check whether it remains recognizable.'
            who: freud_vienna
            bio: 'Freud wrote in Vienna. The book passed through a publisher and several later editions. Tracking versions and protecting people described in examples call for separate editorial decisions.'
        vignettes:
          imprint: 'Grete sees 1900 on the title page and wants to change the arrival ledger. You bring the delivery slip over from the counter. She writes the printed year on the label and keeps today’s year in the ledger. The two records now answer different questions.'
          reader: 'A customer thinks Emil has brought next year’s book by mistake. You invite him to compare the slip with the title page at the counter. The customer leaves with a copy and asks Emil to keep the slip in the shop so the next reader can see it too.'
          edition: 'You know later bibliographies will file the book under the year on the title page. Grete only needs a way to find today’s order. You leave both dates where she can look them up. The door shuts while the last reader is still on the street.'
      zh:
        name: '一本书的两个年份'
        place: 维也纳
        figure: 西格蒙德·弗洛伊德
        story: '《梦的解析》在1899至1900年之交面世，初版扉页印1900年，弗洛伊德后来回忆自己1899年已经拿到书。'
        relic: '一张注明日期的书店存根'
        relic_desc: '书店存根，两处年份都保留。'
        points:
          p1: '在维也纳核清书商已经收货和仍在途的份数，护住《梦的解析》能以首版的面貌开始发售'
          p2: '给预寄本和正式印张分记实际日期，将跨年标注留在维也纳的书商账上'
          p3: '请编辑为使用过的匿名案例做一次识别风险校读。凡可从多处细节认出当事人的，留下能删去的地方供作者确认'
        points_fail:
          p1: '预寄本被当成全批发货。到开售日，维也纳书商没有可售的份数，事务所因同步失败召回员工。'
          p2: '书目只抄扉页年份。转查来往信件时，时间先后对不上。'
          p3: '手稿略去姓名，仍留有几项能互相拼对的个人细节。作者得在下一版才有机会复查。'
        shift:
          p1:
            was: '弗洛伊德 1899 年 11 月 5 日写信说书在前一天面世，首版扉页印的是 1900 年。'
          p2:
            was: '弗里斯收到过先行本，馆藏首版与来信采用了不同的纪年方式。'
            now: '早期收书人能对照发运日期和扉页年份。往后汇集来信时，也能放回正确次序。'
          p3:
            was: '书中包含以个案或叙述举例的材料，并经过多次增订。'
            now: '书商留存经作者核准的删改痕迹，不在流通本里补录身份。新版改写叙述时，校对者先检查是否仍可辨认个案。'
            who: freud_vienna
            bio: '弗洛伊德在维也纳写作，书经出版商刊行，后来多次增订。保存版本和保护被举例者需要编辑作出两种不同的决定。'
        vignettes:
          imprint: '格雷特看了扉页上的1900年，就想改掉到货簿。你从柜台拿来送货单。她把印在书上的年份写给题签，簿上仍记今天是哪一年。两张纸各回答一个问题。'
          reader: '有客人以为埃米尔错拿了明年的书。你请他在柜台上把到货单和扉页对着看。客人带书走时，请埃米尔把单留下，好给再来的人看看。'
          edition: '你知道后世书目常以扉页上的年份著录。格雷特眼下只需要找得到今天的订单。你把两个年份都留在她会查的地方。门关上时，最后一位读者还在街上。'
text:
  en:
    name: Sigmund Freud
    text: Austrian physician, 1856 to 1939, founder of psychoanalysis. His 1899 book The Interpretation of Dreams proposed that dreams express hidden wishes. He left Vienna for London in 1938 after the German annexation.
  zh:
    name: 西格蒙德·弗洛伊德
    text: 奥地利医生，1856 年生，1939 年去世，精神分析的创立者。1899 年的《梦的解析》提出梦表达隐藏的愿望。1938 年德国吞并奥地利后，他离开维也纳去了伦敦。
