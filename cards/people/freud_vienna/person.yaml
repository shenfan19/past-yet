    text:
      en:
        name: 'Two years for one book'
        place: Vienna
        figure: Sigmund Freud
        story: 'Freud’s The Interpretation of Dreams reached readers around the turn of 1899–1900. The first edition bears 1900 on its title page, while Freud later recalled having the book before him in 1899.'
        relic: 'A dated bookseller’s slip'
        relic_desc: 'An invented slip that preserves the imprint and the arrival year.'
        points:
          p1: 'In the quiet weeks after the book appears, get The Interpretation of Dreams into the hands of colleagues who will read it to the end'
        points_fail:
          p1: 'The book draws little notice. The first printing of 600 copies takes eight years to sell.'
        shift:
          p1:
            was: 'On 4 November 1899 The Interpretation of Dreams appeared in Vienna in a first printing of 600 copies, dated 1900. They took eight years to sell.'
            now: '{staff} carries copies to a few colleagues who read the whole book that winter. Letters and argument about it start years earlier, and the first printing does not wait eight years.'
            who: freud_vienna
            bio: 'Freud''s book on dreams found serious readers in its first year. The discussion he waited years for began in the winter of 1899.'
        vignettes:
          imprint: 'Grete sees 1900 on the title page and wants to change the arrival ledger. You bring the delivery slip over from the counter. She writes the printed year on the label and keeps today’s year in the ledger. The two records now answer different questions.'
          reader: 'A customer thinks Emil has brought next year’s book by mistake. You invite him to compare the slip with the title page at the counter. The customer leaves with a copy and asks Emil to keep the slip in the shop so the next reader can see it too.'
          edition: 'You know later bibliographies will file the book under the year on the title page. Grete only needs a way to find today’s order. You leave both dates where she can look them up. The door shuts while the last reader is still on the street.'
      zh:
        name: '一本书的两个年份'
        place: 维也纳
        figure: 西格蒙德·弗洛伊德
        story: '《梦的解析》在1899至1900年之交面世，初版扉页印1900年，弗洛伊德后来回忆自己1899年已经拿到书。'
        relic: '一张注明日期的书店存根'
        relic_desc: '书店存根，两处年份都保留。'
        points:
          p1: '在书面世后无人问津的那几周，把《梦的解析》送到会认真读完它的同行手里'
        points_fail:
          p1: '书出来以后少有人理会，首印六百册要八年才卖完。'
        shift:
          p1:
            was: '1899 年 11 月 4 日，《梦的解析》在维也纳面世，首印六百册，扉页印 1900 年，八年才卖完。'
            now: '{staff}把书送到几位同行手里，他们那个冬天就读完了全书。关于它的来信和争论早来了好几年，首印也不用等八年。'
            who: freud_vienna
            bio: '弗洛伊德那本讲梦的书在头一年就有了认真的读者。他等了多年的讨论，1899 年冬天就开始了。'
        vignettes:
          imprint: '格雷特看了扉页上的1900年，就想改掉到货簿。你从柜台拿来送货单。她把印在书上的年份写给题签，簿上仍记今天是哪一年。两张纸各回答一个问题。'
          reader: '有客人以为埃米尔错拿了明年的书。你请他在柜台上把到货单和扉页对着看。客人带书走时，请埃米尔把单留下，好给再来的人看看。'
          edition: '你知道后世书目常以扉页上的年份著录。格雷特眼下只需要找得到今天的订单。你把两个年份都留在她会查的地方。门关上时，最后一位读者还在街上。'
text:
  en:
    name: Sigmund Freud
    text: Austrian physician, 1856 to 1939, founder of psychoanalysis. His 1899 book The Interpretation of Dreams proposed that dreams express hidden wishes. He left Vienna for London in 1938 after the German annexation.
  zh:
    name: 西格蒙德·弗洛伊德
    text: 奥地利医生，1856 年生，1939 年去世，精神分析的创立者。1899 年的《梦的解析》提出梦表达隐藏的愿望。1938 年德国吞并奥地利后，他离开维也纳去了伦敦。
