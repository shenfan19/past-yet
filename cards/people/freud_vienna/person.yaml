    text:
      en:
        name: 'Two years for one book'
        place: Vienna
        figure: Sigmund Freud
        story: 'On 4 November 1899 Sigmund Freud''s The Interpretation of Dreams appeared in Vienna, and the publisher printed 1900 on its title page. Freud later called the book his reaction to the death of his father. The first printing was 600 copies, and it took eight years to sell them; a second edition came only in 1909.'
        relic: 'A dated bookseller’s slip'
        relic_desc: 'A delivery slip from a Viennese bookshop, dated November 1899, for a book whose title page says 1900.'
        points:
          p1: 'In the quiet weeks after the book appears, get The Interpretation of Dreams into the hands of colleagues who will read it to the end'
        points_fail:
          p1: 'The book draws little notice. The first printing of 600 copies takes eight years to sell.'
        shift:
          p1:
            was: 'On 4 November 1899 The Interpretation of Dreams appeared in Vienna in a first printing of 600 copies, dated 1900. They took eight years to sell.'
            now: '{staff} carries copies to a few colleagues who read the whole book that winter. Letters and argument about it start years earlier, and the first printing does not wait eight years.'
            who: freud_vienna
            bio: 'Freud''s book on dreams found serious readers in its first year. The discussion he waited years for began in the winter of 1899.'
        vignettes:
          window: '{staff} stands a long while at the window of a bookshop in the inner city. The new book on dreams lies in a corner, open at the title page, which says 1900. The assistant comes out to wipe the glass and says it only counts as new next year; for now it is keeping its place warm.'
          cafe: '{staff} takes the newspapers down from the rack in a coffee house and goes through every review column; the book is not in any of them. A doctor at the next table says nobody has time for three hundred pages about dreams, and orders another coffee to finish his paper.'
          snow: 'At the end of December it snows. {staff} helps the bookshop boy clear the doorway, and the boy, leafing through the order book with cold fingers, says the dream book has hardly moved this month, and asks whether dreams sell better in summer.'
      zh:
        name: '一本书的两个年份'
        place: 维也纳
        figure: 西格蒙德·弗洛伊德
        story: '1899 年 11 月 4 日，西格蒙德·弗洛伊德的《梦的解析》在维也纳面世，出版商在扉页上印了 1900 年。弗洛伊德后来说，这本书是他对父亲去世的回应。首印六百册，卖了八年才卖完，第二版到 1909 年才出。'
        relic: '一张注明日期的书店存根'
        relic_desc: '维也纳一家书店的送货单，日期是 1899 年 11 月，单上那本书的扉页印着 1900 年。'
        points:
          p1: '在书面世后无人问津的那几周，把《梦的解析》送到会认真读完它的同行手里'
        points_fail:
          p1: '书出来以后少有人理会，首印六百册要八年才卖完。'
        shift:
          p1:
            was: '1899 年 11 月 4 日，《梦的解析》在维也纳面世，首印六百册，扉页印 1900 年，八年才卖完。'
            now: '{staff}把书送到几位同行手里，他们那个冬天就读完了全书。关于它的来信和争论早来了好几年，首印也不用等八年。'
            who: freud_vienna
            bio: '弗洛伊德那本讲梦的书在头一年就有了认真的读者。他等了多年的讨论，1899 年冬天就开始了。'
        vignettes:
          window: '{staff}在内城一家书店的橱窗前站了半天。那本讲梦的新书摆在角上，翻开着扉页，印的是 1900 年。店员出来擦玻璃，说这书要到明年才算新书，眼下先占个位子。'
          cafe: '{staff}在咖啡馆从报架上取下几份报纸，把书评栏翻了个遍，哪一份都没提这本书。邻桌的医生说，三百多页讲梦的书，谁有工夫读完，说完又叫了一杯咖啡，接着看他的报。'
          snow: '十二月底下了雪。{staff}帮书店的小伙计铲门口的雪。伙计冻着手翻订货簿，说那本讲梦的书这个月几乎没动，又问梦是不是夏天才好卖。'
text:
  en:
    name: Sigmund Freud
    text: Austrian physician, 1856 to 1939, founder of psychoanalysis. His 1899 book The Interpretation of Dreams proposed that dreams express hidden wishes. He left Vienna for London in 1938 after the German annexation.
  zh:
    name: 西格蒙德·弗洛伊德
    text: 奥地利医生，1856 年生，1939 年去世，精神分析的创立者。1899 年的《梦的解析》提出梦表达隐藏的愿望。1938 年德国吞并奥地利后，他离开维也纳去了伦敦。
hook: {en: 'The new book carries next year’s date.', zh: '新书扉页印着明年的年份。'}
facts:
  father:
    date: '1896-10-23'
    checked: two_sources
    level: careful
    use: [story, history, wiki]
    sources: [freud_vienna_appearance, freud_vienna_dreams_wiki]
    text:
      en: 'Freud''s father Jacob died in Vienna in October 1896. In the preface to the second edition Freud called the book a piece of his self-analysis and his reaction to his father''s death.'
      zh: '1896 年 10 月，弗洛伊德的父亲雅各布在维也纳去世。弗洛伊德在第二版序言里说，这本书是他自我分析的一部分，是他对父亲之死的回应。'
    note: 'A death: written as a plain fact.'
    line:
      en: '23 October 1896: Freud''s father Jacob dies in Vienna.'
      zh: '1896 年 10 月 23 日，弗洛伊德的父亲雅各布在维也纳去世。'
  appearance:
    date: '1899-11-04'
    stay_day: 22
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [freud_vienna_publication_letter, freud_vienna_dreams_wiki, freud_vienna_sothebys]
    text:
      en: 'Die Traumdeutung was published by Franz Deuticke of Leipzig and Vienna on 4 November 1899.'
      zh: '1899 年 11 月 4 日，莱比锡与维也纳的弗朗茨·多伊蒂克出版社出版了《梦的解析》。'
    line:
      en: '4 November 1899: The Interpretation of Dreams comes out in Vienna, published by Franz Deuticke.'
      zh: '1899 年 11 月 4 日，《梦的解析》由多伊蒂克出版社在维也纳出版。'
  imprint:
    date: '1899-11-04'
    stay_day: 22.1
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [freud_vienna_imprint, freud_vienna_first_ed_loc]
    text:
      en: 'The title page of the first edition bears the Leipzig and Vienna imprint of 1900, and libraries catalogue it under that year.'
      zh: '初版扉页印的是莱比锡与维也纳 1900 年，图书馆也按这一年著录。'
    line:
      en: 'The same day: the year printed on its title page is 1900.'
      zh: '同一天，书的扉页上印的年份是 1900 年。'
  second_edition:
    date: '1909'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [freud_vienna_dreams_wiki, freud_vienna_sothebys, freud_vienna_shapero]
    text:
      en: 'The first printing of 600 copies sold so slowly that it took about eight years to sell out, and the second edition appeared only in 1909.'
      zh: '首印六百册卖得很慢，前后约八年才卖完，第二版到 1909 年才出。'
    line:
      en: '1909: the second edition of The Interpretation of Dreams appears, after the 600 copies of the first took eight years to sell.'
      zh: '1909 年，《梦的解析》出了第二版，首印的六百册卖了八年才卖完。'
  professor:
    date: '1902'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [freud_vienna_appearance, freud_vienna_wiki]
    text:
      en: 'In 1902 Freud was named an extraordinary professor at the University of Vienna.'
      zh: '1902 年，弗洛伊德被任命为维也纳大学的编外教授。'
    line:
      en: '1902: Freud is made an extraordinary professor at the University of Vienna.'
      zh: '1902 年，弗洛伊德被任命为维也纳大学的编外教授。'
