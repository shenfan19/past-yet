    scene:
      star_rules: 2
      points:
        - {id: p1, kind: persuade, day: 40, req: {"any":[{"job":["bookseller","journalist","doctor","physician","medical_teacher"],"stat":{"will":6}},{"trait":["charismatic","glib","cosmopolitan"],"stat":{"wit":6}}]}}
