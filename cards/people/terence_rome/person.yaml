quotes:
  terence_rome_story_echo_full:
    order: 1
    tier: full
    date: '-165'
    checked: official_record
    sources: [terence_rome_story_echo_source_full]
    original: la
    contextual: true
    text:
      en:
        who: 'Terence’s prologue-speaker'
        quote: 'Hear the case for my sake, and grant us silence.'
        occasion: 'Second prologue to Hecyra, asking the audience to let the actors be heard.'
      zh:
        who: '泰伦提乌斯笔下的报幕人'
        quote: '请为我听一听我们的请求，给我们一点安静。'
        occasion: '《婆母》第二序言，报幕人请观众让演员能被听见。'
      la:
        who: 'Terence’s prologue-speaker'
        quote: 'mea causa causam accipite et date silentium'
        occasion: 'Second prologue to Hecyra, asking the audience to let the actors be heard.'
      zh-Hant:
        who: '泰倫提烏斯筆下的報幕人'
        quote: '請為我聽一聽我們的請求，給我們一點安靜。'
        occasion: '《婆母》第二序言，報幕人請觀眾讓演員能被聽見。'
      fr:
        who: 'Le prologue-conférencier de Terence'
        quote: 'Écoutez l''affaire pour moi et accordez-nous le silence.'
        occasion: 'Deuxième prologue d''Hécyre, demandant au public de laisser entendre les acteurs.'
      es:
        who: 'El orador prólogo de Terence'
        quote: 'Escucha el caso por mí y concédenos silencio.'
        occasion: 'Segundo prólogo de Hecyra, pidiendo al público que deje escuchar a los actores.'
      ja:
        who: 'テレンティウスのプロローグスピーカー'
        quote: '私のために事件を聞いてください、そして私たちに沈黙を与えてください。'
        occasion: 'ヘキュラの 2 番目のプロローグ。観客に俳優の声を聞かせるように求めます。'
      ko:
        who: '테렌티우스의 프롤로그 연사'
        quote: '나를 위해 사건을 들어주시고, 우리에게 침묵을 주소서.'
        occasion: '헤시라의 두 번째 프롤로그로 관객들에게 배우들의 목소리를 들려달라고 요청합니다.'
      ru:
        who: 'Пролог-оратор Теренция'
        quote: 'Выслушай дело ради меня и даруй нам молчание.'
        occasion: 'Второй пролог к «Гекире», в котором зрителям предлагается дать возможность услышать актеров.'
  terence_rome_story_echo_none:
    order: 2
    tier: none
    date: '-165'
    checked: official_record
    sources: [terence_rome_story_echo_source_none]
    original: la
    contextual: true
    text:
      en:
        who: 'Terence’s prologue-speaker'
        quote: 'They made me leave the stage before my time.'
        occasion: 'Second prologue to Hecyra, recounting the first interrupted performance.'
      zh:
        who: '泰伦提乌斯笔下的报幕人'
        quote: '这些声响让我没到收场便离了台。'
        occasion: '《婆母》第二序言，回顾首次演出中断。'
      la:
        who: 'Terence’s prologue-speaker'
        quote: 'fecere ut ante tempus exirem foras'
        occasion: 'Second prologue to Hecyra, recounting the first interrupted performance.'
      zh-Hant:
        who: '泰倫提烏斯筆下的報幕人'
        quote: '這些聲響讓我沒到收場便離了臺。'
        occasion: '《婆母》第二序言，回顧首次演出中斷。'
      fr:
        who: 'Le prologue-conférencier de Terence'
        quote: 'Ils m''ont fait quitter la scène avant mon heure.'
        occasion: 'Deuxième prologue d''Hécyre, relatant la première représentation interrompue.'
      es:
        who: 'El orador prólogo de Terence'
        quote: 'Me hicieron abandonar el escenario antes de tiempo.'
        occasion: 'Segundo prólogo de Hecyra, que relata la primera representación interrumpida.'
      ja:
        who: 'テレンティウスのプロローグスピーカー'
        quote: '彼らは私を時間前にステージから去らせました。'
        occasion: 'ヘキュラへの 2 番目のプロローグ。中断された最初のパフォーマンスを説明します。'
      ko:
        who: '테렌티우스의 프롤로그 연사'
        quote: '그들은 내가 시간보다 먼저 무대를 떠나게 만들었어요.'
        occasion: '헤시라의 두 번째 프롤로그로, 첫 번째 중단된 공연에 대해 설명합니다.'
      ru:
        who: 'Пролог-оратор Теренция'
        quote: 'Они заставили меня уйти со сцены раньше времени.'
        occasion: 'Второй пролог к Гекире, рассказывающий о первом прерванном представлении.'
