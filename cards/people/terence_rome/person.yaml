    text:
      en:
        name: 'An audience that keeps leaving'
        place: "Rome"
        figure: "Terence"
        story: 'The prologues to Terence’s Hecyra describe interruptions. They recall the draw of boxing and a tightrope performer, then a crowd rushing in when gladiators were announced. The map year locates the early productions, while the second prologue looks back on them.'
        relic: "A comic mask"
        relic_desc: "A linen mask with a raised brow, worn by an actor."
        points:
          p1: 'When talk of boxers and a tightrope walker drowns out the players, get the people near the stage listening again so the company can finish its first performance'
        points_fail:
          p1: 'The players cannot make themselves heard above the crowd. As in history, they stop before the end.'
        shift:
          p1:
            was: 'In 165 BC the first staging of The Mother-in-Law was interrupted amid the noise and excitement over other performers.'
            now: 'The audience near the stage starts listening again, and the company gets to the last line on the first attempt.'
            who: terence_rome
            bio: 'In this branch, the first staging of Terence’s The Mother-in-Law reached its ending in 165 BC.'
        vignettes:
          warning: 'You tell a stagehand that people will still read about the interrupted performance two thousand years from now. He asks whether they will know what the actors were saying when they had to stop. You stay for the rehearsal and write down the last line you could hear. The public performance is still ahead of you.'
          audibility: 'You listen from beside the entrance and miss the reply to a line you heard clearly. The stagehand moves one bench and asks you to listen again. This time you hear both halves. You take home a sketch of the bench’s two positions. The street has grown too loud for you to hear the ending from outside.'
          bench: 'You help the stagehand set one bench back from the doorway. A latecomer sits down without making a whole row stand. You mark the clear space on a scrap of wood. You leave with the rehearsal still sounding through the doorway.'
      zh:
        name: '留不住的观众'
        place: "罗马"
        figure: "泰伦提乌斯"
        story: '泰伦提乌斯的《婆母》序言回顾演出受扰的经过，先提拳击和走绳的吸引力，再写角斗表演的消息引得人群涌来。'
        relic: "一副喜剧面具"
        relic_desc: "一副亚麻面具，眉毛高挑，演员戴的。"
        points:
          p1: '在人声压过台词时，让舞台近处的人重新听戏，帮剧团把《婆母》头一回演完'
        points_fail:
          p1: '台上的声音被人声盖住了。剧团照史实提前收场，没有演到末尾。'
        shift:
          p1:
            was: '公元前 165 年，《婆母》首演时，拳击和走绳的消息引起骚动，戏没能演完。'
            now: '舞台近处的人重新开始听戏，剧团头一回就演到了最后一句。'
            who: terence_rome
            bio: '这条分支里，泰伦提乌斯的《婆母》于公元前 165 年首演，同一天演到了结尾。'
        vignettes:
          warning: '你告诉舞台帮工，两千年后还有人读到这场戏中断的事。他问后人知不知道收场时演员说到哪儿。你留下听排练，记下最后一句听清的话。正式演出还没到。'
          audibility: '你靠门听，听清了一句，却漏掉了接它的那句。帮工挪了一条长凳，请你再听一遍。这回你把两句都听到了。你带回画着长凳两个位置的草图。等你退到街上，末尾的话已被街声盖住。'
          bench: '你帮舞台帮工把一条长凳从门口挪开。来迟的人终于能坐下，不用叫整排人都站起来。你在木片上记下空出来的地方。临走时，门里还传着排练的声音。'
text:
  en:
    name: Terence
    text: Roman playwright, about 195 BC to about 159 BC. Said to have been brought to Rome as an enslaved man from North Africa, he wrote six comedies adapted from Greek plays, all of which survive.
  zh:
    name: 泰伦提乌斯
    text: 罗马剧作家，约公元前 195 年生，约公元前 159 年去世。据说他作为奴隶从北非被带到罗马，写了六部改编自希腊戏剧的喜剧，全部留存至今。
hook: {en: 'Will anyone hear the ending?', zh: '今天能演到最后一句吗？'}
