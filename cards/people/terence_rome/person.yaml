      zh: '现存的《婆母》序言回忆了首演中断。观众盼着看拳击和走绳，现场很嘈杂。'
    line:
      en: '165 BC: the first staging of The Mother-in-Law breaks off before the end.'
      zh: '公元前 165 年，《婆母》的首演没有演到结尾。'
      zh-Hant: '公元前 165 年，《婆母》的首演沒有演到結尾。'
      fr: '165 avant JC : la première mise en scène de La Belle-Mère s''interrompt avant la fin.'
      es: '165 aC: la primera puesta en escena de La suegra se interrumpe antes del final.'
      ja: '紀元前 165 年: 『義母』の最初の上演は終了前に中断。'
      ko: '기원전 165년: 시어머니의 첫 번째 무대가 끝나기 전에 중단됩니다.'
      ru: '165 г. до н.э.: первая постановка «Свекрови» обрывается еще до конца.'
  prologues:
    date: '-160'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [terence_rome_prologues]
    text:
      en: 'The prologues describe distraction by a tightrope walker, and a public rushing in at the announcement of gladiators.'
      zh: '序言写到走绳吸引观众，以及人群闻知有角斗演出后涌来。报告中排练为分支演绎。'
