    text:
      en:
        name: 'The first day of spring'
        place: Isfahan, Persia
        figure: Omar Khayyam
        story: 'In the 1070s Sultan Malik-Shah gathered astronomers to make observations. Omar Khayyam worked with scholars at his court in Isfahan. The Jalali calendar came into use on 15 March 1079 and put the start of the solar year at the spring equinox.'
        story_prose:
          opening:
            - 'Isfahan, spring 1079. The scholars gathered by Malik-Shah are revising the calendar. Khayyam has taken part in the observations, and the new reckoning starts the year at the spring equinox.'
            - 'In history, the new calendar came into use that March. The observation programme ended after Malik-Shah died. Khayyam mentioned a book he wrote on extracting roots, which has not survived. In this branch, an almanac copyist has a sheet with room for a few more lines.'
            - 'This trip calls for someone who can check shadow readings and keep the old and new columns straight. It also needs someone who can check a manuscript and send a copy to another city.'
          points:
            p1: 'Before the equinox, {staff} matches the ends of the shadows against earlier readings, sorts out a mixed column and asks Khayyam to check it against the original marks. Two folds run along the edge of the table of readings. When the sun gets low, the sheet is still open and the ink in that column is back inside the lines.'
            p2: '{staff} checks the copyist’s book on extracting roots, compares the easily mistaken numbers with the original and passes the manuscript to someone bound for another city. The messenger wraps the copy in cloth, ties it and eases one side back out. The title faces outwards, and the edge of the paper still shows by touch beneath the first fold.'
          outcomes:
            all: 'That spring’s date went into the new calendar. Years later, someone reached for the book on roots in another city, its old corners still curling.'
            p2: 'Someone in another city later copied the whole book again. They began at the first line with the old, worn manuscript beside them.'
            p1: 'The calendar began on the appointed day. One comparison sheet remained, the two headings sitting side by side.'
          none: 'The old table went back into its box. An unfinished sheet lay outside, tapping the rim whenever the wind stirred.'
          not_admitted: '{staff} never found a place with the copyists. A sheet turned inside the door, and from outside its heading was gone.'
          desync: 'The columns still did not agree when the sheet was collected. When {staff} was recalled, the last reading was still out in the margin.'
          excerpts:
            p2: 'The messenger wraps the copy in cloth, ties it and eases one side back out. The title faces outwards, and the edge of the paper still shows by touch beneath the first fold.'
            p1: 'Two folds run along the edge of the table of readings. When the sun gets low, the sheet is still open and the ink in that column is back inside the lines.'
        relic: 'A calendar leaf with two headings'
        relic_desc: 'A comparison sheet with the old and the new new year written side by side.'
        points:
          p1: 'In the days before the equinox, keep the shadow readings that fix it safe, so that the new calendar begins on the day set for it'
          p2: 'Help him get one more copy made of his book on extracting roots and send it to another city for safe keeping, so that in this branch it survives'
        points_fail:
          p1: 'The equinox readings did not line up, and the new calendar did not begin on 15 March.'
          p2: 'The book was lost all the same, as in history.'
        shift:
          p1:
            was: 'On 15 March 1079 the new calendar of Sultan Malik Shah came into use on its set day, the year beginning at the spring equinox.'
          p2:
            was: 'Khayyam''s book on extracting roots is lost, known only from a mention in his Algebra.'
            now: 'One copy was sent to another city and put in a library, and people could still read it centuries later.'
            who: omar_khayyam_nishapur
            bio: 'In this line his book on roots did not vanish with the observatory years. A copy kept in another city went on being read and copied after his death.'
        vignettes:
          spring: '{staff} lays the old table and the new one side by side and writes against each date which reckoning it belongs to, so that the next reader does not have to guess.'
          carry: '{staff} copies the two headings of a folded sheet onto its outside, so whoever carries it can see which columns to compare without unfolding it.'
          future: '{staff} knows how this calendar will be written of later, and keeps the date of the reckoning the copyists use, not one they have never seen.'
      zh:
        name: '春天的第一天'
        place: 波斯伊斯法罕
        figure: 欧玛尔·海亚姆
        story: '1070 年代，马立克沙召集天文学家开展观测。欧玛尔·海亚姆在伊斯法罕的宫廷随学者共事。1079 年 3 月 15 日，贾拉利历启用，以春分定太阳年的开端。'
        story_prose:
          opening:
            - '1079 年春，伊斯法罕。马立克沙召集的学者们在修订历法。海亚姆参与观测，新历把一年开头定在春分。'
            - '史实里，新历在三月启用，这些观测后来随马立克沙去世而停下。海亚姆提过自己有一部讲开方的书，那部书没有传下来。在这条分支里，抄历书的人手边还留着一张能再写几行的纸。'
            - '这一趟用得上认得清日影读数、能够核对新旧两栏的人，也用得上懂得校书、能把副本送到另一座城的人。'
          points:
            p1: '春分前，{staff}按前几天的记录核对影端，从纸上把抄混的一列挑出来，请海亚姆对着原来的读数再看一遍。表边有两道旧折痕。太阳落低时，桌上的纸还打开着，那一列墨重新写到了线内。'
            p2: '{staff}替抄书的人核过开方书的副本，把易抄错的几个数逐一对回原本，再交给往别城去的送书人。送书人把抄本包在布里，系完又松开一边。题名朝着外头，隔着第一层布还摸得出纸角。'
          outcomes:
            all: '那年开春的日期写进新历。许多年后，另一座城的书架上有人取下开方书，纸角还照旧卷着。'
            p2: '后来有人在另一座城又抄了一遍全书。他从第一行开始，手边放着那一卷边角已有磨损的旧稿。'
            p1: '新历照原定的日子启用。对照表还有一份，页上两种题头挨在一起。'
          none: '旧历表收回匣里。一张没写完的纸留在外面，风来时贴着匣口响。'
          not_admitted: '{staff}没能跟着抄历的人留下。门里一张纸翻了过去，门外已经看不见题头。'
          desync: '两栏数直到收表也没对齐。{staff}被召回时，最后一次读数仍留在纸边。'
          excerpts:
            p2: '送书人把抄本包在布里，系完又松开一边。题名朝着外头，隔着第一层布还摸得出纸角。'
            p1: '表边有两道旧折痕。太阳落低时，桌上的纸还打开着，那一列墨重新写到了线内。'
        relic: '一张有两种题头的历表'
        relic_desc: '一张对照表，新旧两种新年并排写着。'
        points:
          p1: '春分前那几天，护住观测台上定春分的日影读数，让新历照定的日子启用'
          p2: '帮他把那部讲开方的书多抄一份，送到别的城里收好，让它在这条分支里留下来'
        points_fail:
          p1: '春分的读数没能对齐，新历没能在 3 月 15 日启用。'
          p2: '这部书照旧失传，这条分支与历史一样。'
        shift:
          p1:
            was: '1079 年 3 月 15 日，苏丹马立克沙的新历照定的日子启用，一年从春分开始。'
          p2:
            was: '海亚姆那部论开方的书没有传下来，只在他的《代数》里留下一句提及。'
            now: '有一份抄本被送到别的城里收进了书库，几百年后还有人读得到。'
            who: omar_khayyam_nishapur
            bio: '这条时间线里，他那部讲开方的书没有随着岁月散失。存在别城的那份抄本，在他身后仍有人读、有人转抄。'
        vignettes:
          spring: '{staff}把新旧历表并排，在日期旁各补一个题头。两张纸的边碰在一起，数字才有了分界。'
          carry: '一张折纸把两栏分开。{staff}把题头抄到纸外，递过去时，有一笔从折痕上跨了过去。'
          future: '{staff}用抄历书的人熟悉的纪法落下日期。纸往前挪时，空出来的地方仍留着给下一行。'
text:
  en:
    name: Omar Khayyam
    text: Persian mathematician, astronomer and poet, 1048 to 1131, of Nishapur. He classified and solved cubic equations geometrically, helped reform the calendar, and is known in English for the quatrains of the Rubaiyat.
  zh:
    name: 欧玛尔·海亚姆
    text: 波斯数学家、天文学家与诗人，1048 年生，1131 年去世，尼沙布尔人。他用几何方法分类并求解三次方程，参与历法改革，在英语世界以《鲁拜集》的四行诗闻名。
