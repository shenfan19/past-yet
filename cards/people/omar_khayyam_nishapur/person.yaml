    ready: true
    refs: [omar_khayyam_nishapur_reform, omar_khayyam_nishapur_site, st_andrews_khayyam, met_seljuq_science]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: notice, guard: true, day: 28, req: {"any":[{"trait":["methodical","vigil"],"stat":{"wit":7,"will":5}},{"job":["data_analyst","modelling_scientist","programmer","sysadmin"]},{"item":"ar_glasses","stat":{"wit":6}}]}}
        - {id: p2, kind: hold, day: 120, req: {"any":[{"job":["archivist","translator","proofreader","bookseller"],"stat":{"wit":7}},{"trait":["scholarly"],"item":"neural_chip"},{"trait":["methodical"],"item":"neural_chip","stat":{"finesse":6}}]}}
