events:
  omar_khayyam_nishapur:
    order: 58
    build_step: 2
    year: 1079
    # the planned arrival is thirty days before the new calendar began on 15 March 1079; the date sets only the year of the lines
    date: '1079-02-13'
    lon: 58.8
    lat: 36.2
    region: asia
    home: [middle_east, central_asia]
    field: math
    tier: 2
    channels: {C: 1, V: 1}
    # finished: in the game with release.ready_only
    ready: true
    refs: [omar_khayyam_nishapur_reform, omar_khayyam_nishapur_site, st_andrews_khayyam, wikipedia_isfahan_observatory]
    scene:
      star_rules: 2
      points:
        - {id: p1, kind: notice, guard: true, day: 28, req: {"any":[{"trait":["methodical","vigil"],"stat":{"wit":7,"will":5}},{"job":["data_analyst","modelling_scientist","programmer","sysadmin"]},{"item":"ar_glasses","stat":{"wit":6}}]}}
        - {id: p2, kind: persuade, day: 60, req: {"any":[{"job":["farmer","potato_farmer","dairy_farmer","villager","shepherd"]},{"trait":["patient","charismatic","cheerful"],"stat":{"will":5}}]}}
        - {id: p3, kind: hold, day: 120, req: {"any":[{"job":["archivist","translator","proofreader","bookseller"],"stat":{"wit":7}},{"trait":["scholarly"],"item":"neural_chip"},{"trait":["methodical"],"item":"neural_chip","stat":{"finesse":6}}]}}
      vignettes:
        - {id: spring, traits: [methodical, curious, scholarly], day: 31}
        - {id: carry, traits: [faithful, patient, handy], day: 45}
        - {id: future, day: 15}
    text:
      en:
        name: 'The first day of spring'
        place: Nishapur, Persia
        figure: Omar Khayyam
        story: 'Sultan Malik-Shah had an observatory built at Isfahan in the 1070s, and Omar Khayyam was among the astronomers who worked on reforming the calendar. The new Jalali calendar, named for the sultan, was adopted on 15 March 1079 and set the start of the solar year by the spring equinox. The observatory closed after the sultan died in 1092; the calendar stayed in use for some eight centuries, and forms of it are still used in Iran and Afghanistan.'
        relic: 'A calendar leaf with two headings'
        relic_desc: 'A comparison sheet with the old and the new new year written side by side.'
        points:
          p1: 'In the days before the equinox, keep the shadow readings that fix it safe, so that the new calendar begins on the day set for it'
          p2: 'After the new year, bring an old farmer who sows by the old months round to writing his sowing day in the new calendar'
          p3: 'Help him get one more copy made of his book on extracting roots and send it to another city for safe keeping, so that in this branch it survives'
        points_fail:
          p1: 'The equinox readings did not line up, and the new calendar did not begin on 15 March.'
          p2: 'In this branch that field was still sown by the old calendar, and the new one had one user fewer in the country.'
          p3: 'The book was lost all the same, as in history.'
        branch:
          p2:
            - 'In this branch, there was one field outside the town sown by the new calendar.'
          p3:
            - 'In history, Khayyam''s book on the binomial and on extracting roots did not survive, and is known only from a mention in his Algebra.'
            - 'In this branch, one copy was sent to another city and put in a library, and people could still read it centuries later.'
        vignettes:
          spring: '{staff} lays the old table and the new one side by side and writes against each date which reckoning it belongs to, so that the next reader does not have to guess.'
          carry: '{staff} copies the two headings of a folded sheet onto its outside, so whoever carries it can see which columns to compare without unfolding it.'
          future: '{staff} knows how this calendar will be written of later, and keeps the date of the reckoning the copyists use, not one they have never seen.'
      zh:
        name: '春天的第一天'
        place: 波斯内沙布尔
        figure: 欧玛尔·海亚姆
        story: '1070 年代，苏丹马立克沙在伊斯法罕建起天文台，欧玛尔·海亚姆是参与修订历法的天文学家之一。以苏丹命名的贾拉利历于 1079 年 3 月 15 日启用，以春分定太阳年的开端。苏丹 1092 年去世后天文台关闭，这部历法却用了约八个世纪，它的变体今天仍在伊朗和阿富汗使用。'
        relic: '一张有两种题头的历表'
        relic_desc: '一张对照表，新旧两种新年并排写着。'
        points:
          p1: '春分前那几天，护住观测台上定春分的日影读数，让新历照定的日子启用'
          p2: '新年过后，劝一位照旧月份下种的老农改用新历记下播种的日子'
          p3: '帮他把那部讲开方的书多抄一份，送到别的城里收好，让它在这条分支里留下来'
        points_fail:
          p1: '春分的读数没能对齐，新历没能在 3 月 15 日启用。'
          p2: '这条分支里，那块地仍照旧历下种，新历在乡下少了一个用的人。'
          p3: '这部书照旧失传，这条分支与历史一样。'
        branch:
          p2:
            - '这条分支里，城外有一块地是照新历下的种。'
          p3:
            - '历史上，海亚姆论二项式与开方的那部书没有传下来，只在他的《代数》里留下一句提及。'
            - '这条分支里，有一份抄本被送到别的城里收进了书库，几百年后还有人读得到。'
        vignettes:
          spring: '{staff}把旧历表和新历表并排摆好，在每个日期旁写明属于哪种纪法，下一个读表的人不用再猜。'
          carry: '一张折起来的纸，两栏标题正好分在折痕两边。{staff}把两种题头抄到外面，带着它的人不用打开也知道该比哪两栏。'
          future: '{staff}知道后人会怎样写这部历法，可落下的日子还是用抄历书的人用惯的纪法，不写他们从没见过的那一种。'
text:
  en:
    name: Omar Khayyam
    text: Persian mathematician, astronomer and poet, 1048 to 1131, of Nishapur. He classified and solved cubic equations geometrically, helped reform the calendar, and is known in English for the quatrains of the Rubaiyat.
  zh:
    name: 欧玛尔·海亚姆
    text: 波斯数学家、天文学家与诗人，1048 年生，1131 年去世，尼沙布尔人。他用几何方法分类并求解三次方程，参与历法改革，在英语世界以《鲁拜集》的四行诗闻名。
hook: {en: 'When does the new year begin on this copy?', zh: '这份历表把新年记在哪一天？'}
facts:
  observatory:
    date: '1074'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_isfahan_observatory, st_andrews_khayyam]
    text:
      en: 'Malik-Shah had an observatory built at Isfahan in the 1070s; one account says it was begun in 1073 and working in 1074. Khayyam was invited to work there and on the reform of the calendar.'
      zh: '马立克沙在 1070 年代于伊斯法罕建天文台，一说 1073 年动工、1074 年开始运作。海亚姆受邀到那里参与观测和历法修订。'
    line:
      en: 'The 1070s: Sultan Malik-Shah has an observatory built at Isfahan and calls Omar Khayyam to work on the calendar.'
      zh: '1070 年代，苏丹马立克沙在伊斯法罕建起天文台，召欧玛尔·海亚姆去修订历法。'
  reform:
    date: '1079'
    stay_day: 30
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [omar_khayyam_nishapur_reform, wikipedia_isfahan_observatory]
    text:
      en: 'The Jalali calendar was adopted on 15 March 1079 on the recommendation of a committee that included Khayyam, and set the beginning of the solar year by the spring equinox; it lived alongside the older reckoning.'
      zh: '贾拉利历按包括海亚姆在内的委员会的建议，于 1079 年 3 月 15 日启用，以春分定太阳年的开端，并与旧纪法并存。'
    line:
      en: '15 March 1079: the new calendar of Sultan Malik-Shah begins. From now on the year starts at the spring equinox.'
      zh: '1079 年 3 月 15 日，苏丹马立克沙的新历在这一天启用。从此，一年从春分开始。'
  site:
    date: '1079'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [omar_khayyam_nishapur_site]
    text:
      en: 'The study reviews the sources on Malikshāh’s observations and Khayyam’s involvement, including the evidence about Isfahan.'
      zh: '研究复核马立克沙的观测工程及海亚姆参与的记载，包括关乎伊斯法罕的史料。'
  closed:
    date: '1092'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_isfahan_observatory, st_andrews_khayyam]
    text:
      en: 'The observatory at Isfahan was shut down in 1092, after the death of Malik-Shah.'
      zh: '1092 年马立克沙去世后，伊斯法罕天文台关闭。'
    line:
      en: '1092: Malik-Shah dies, and the observatory at Isfahan is shut.'
      zh: '1092 年，马立克沙去世，伊斯法罕的天文台随之关闭。'
  lasting:
    date: '1092'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [wikipedia_isfahan_observatory, omar_khayyam_nishapur_reform]
    text:
      en: 'The calendar stayed in use for some eight centuries, and forms of it are still used in Iran and Afghanistan.'
      zh: '这部历法用了约八个世纪，它的变体今天仍在伊朗和阿富汗使用。'
    line:
      en: 'The calendar outlives the observatory by some eight hundred years. Forms of it are still in use in Iran and Afghanistan.'
      zh: '这部历法比天文台多活了约八百年。今天伊朗和阿富汗用的历法，仍是它的变体。'
