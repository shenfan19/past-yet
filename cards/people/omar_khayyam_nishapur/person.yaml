      zh: {who: 欧玛尔·海亚姆, quote: '我们有一部书，证明那些方法的正确性。', occasion: '约1070年《代数论》，韦普克编阿拉伯文第9页，谈开方方法（本游戏译文）'}
  omar_khayyam_after_us:
    order: 2
    tier: none
    date: '1070'
    checked: official_record
    sources: [khayyam_algebra_woepcke, khayyam_algebra_woepcke_scan, st_andrews_khayyam]
    original: ar
    text:
      ar: {quote: 'ولعل غيرنا ممن يأتي بعدنا يعرفه'}
      en: {who: Omar Khayyam, quote: 'Perhaps someone who comes after us will know it.', occasion: 'Treatise on Algebra, c. 1070, Woepcke’s Arabic text, p. 6, on finding numerical proofs for harder equations (game translation)'}
      zh: {who: 欧玛尔·海亚姆, quote: '也许后来的人会知道。', occasion: '约1070年《代数论》，韦普克编阿拉伯文第6页，谈较难方程的数值证明（本游戏译文）'}
hook: {en: 'When does the new year begin on this copy?', zh: '这份历表把新年记在哪一天？'}
facts:
  observatory:
    date: '1074'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [met_seljuq_science, st_andrews_khayyam]
    text:
      en: 'In the 1070s Malik-Shah brought together astronomers for observations and calendar reform. Khayyam took part in the work at the court in Isfahan.'
      zh: '1070 年代，马立克沙召集天文学家从事观测和历法修订。海亚姆参与伊斯法罕宫廷的研究。'
    line:
      en: 'In the 1070s Malik-Shah gathers astronomers, including Omar Khayyam, for observations and calendar work.'
      zh: '1070 年代，马立克沙召海亚姆等天文学家从事观测和历法工作。'
  reform:
    date: '1079'
    stay_day: 30
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [omar_khayyam_nishapur_reform, met_seljuq_science]
    text:
      en: 'The Jalali calendar was adopted on 15 March 1079 on the recommendation of a committee that included Khayyam, and set the beginning of the solar year by the spring equinox; it lived alongside the older reckoning.'
      zh: '贾拉利历按包括海亚姆在内的委员会的建议，于 1079 年 3 月 15 日启用，以春分定太阳年的开端，并与旧纪法并存。'
    line:
      en: '15 March 1079: the new calendar of Sultan Malik-Shah begins. From now on the year starts at the spring equinox.'
      zh: '1079 年 3 月 15 日，苏丹马立克沙的新历在这一天启用。从此，一年从春分开始。'
  site:
    date: '1079'
    checked: official_record
    level: usable
    use: [story, wiki]
    sources: [omar_khayyam_nishapur_site]
    text:
      en: 'The study reviews the sources on Malikshāh’s observations and Khayyam’s involvement, including the evidence about Isfahan.'
      zh: '研究复核马立克沙的观测工程及海亚姆参与的记载，包括关乎伊斯法罕的史料。'
  closed:
    date: '1092'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [met_seljuq_science, st_andrews_khayyam]
    text:
      en: 'The observation programme ended after Malik-Shah died in 1092.'
      zh: '1092 年马立克沙去世后，观测工作停止。'
    line:
      en: '1092: Malik-Shah dies, and the observations come to an end.'
      zh: '1092 年，马立克沙去世，观测工作随之停止。'
  lasting:
    date: '1092'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [met_seljuq_science, omar_khayyam_nishapur_reform]
    text:
      en: 'The calendar stayed in use for some eight centuries, and forms of it are still used in Iran and Afghanistan.'
      zh: '这部历法用了约八个世纪，它的变体今天仍在伊朗和阿富汗使用。'
    line:
      en: 'The Jalali reckoning survives the observation programme. Its descendants are still in use in Iran and Afghanistan.'
      zh: '观测停止以后，贾拉利历继续使用。今天伊朗和阿富汗的历法仍承继这一传统。'
