text:
  en:
    name: Olga Knipper
    text: Russian actress, 1868 to 1959, one of the original members of the Moscow Art Theatre in 1898. She played Arkadina in The Seagull and was the first Masha of Three Sisters and the first Ranevskaya of The Cherry Orchard. She married Anton Chekhov in 1901, went with him to Badenweiler in June 1904, where he died on 15 July. She acted with the Moscow Art Theatre for the rest of her life.
  zh:
    name: 奥尔加·克尼佩尔
    text: 俄国演员，1868 年生，1959 年去世，1898 年莫斯科艺术剧院创办时的第一批演员之一。她演过《海鸥》里的阿尔卡金娜，是《三姐妹》里第一个玛莎、《樱桃园》里第一个朗涅夫斯卡娅。1901 年她与安东·契诃夫结婚，1904 年 6 月陪他去巴登魏勒，7 月 15 日他在那里去世。此后她一直在莫斯科艺术剧院演戏。
