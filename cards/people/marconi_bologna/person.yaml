text:
  en:
    name: Guglielmo Marconi
    text: Italian inventor, 1874 to 1937, from Bologna. From 1895 he developed wireless telegraphy, sent a signal across the Atlantic in 1901, and shared the 1909 Nobel Prize in Physics.
  zh:
    name: 古列尔莫·马可尼
    text: 意大利发明家，1874 年生，1937 年去世，博洛尼亚人。从 1895 年起他发展无线电报，1901 年发出跨越大西洋的信号，并分享了 1909 年诺贝尔物理学奖。
