    text:
      en:
        name: Twelve seconds in the air
        place: Kitty Hawk, North Carolina
        figure: Orville and Wilbur Wright
        story: 'Orville Wright''s diary records four flights on 17 December 1903 near Kitty Hawk. A telegram reported the trials to their father afterwards.'
        relic: A propeller blade
        relic_desc: A wooden blade shaped like a twisted wing.
        points:
          p1: 'Tell the first flight from the later trials'
          p2: 'Keep the numbers with the right trial'
          p3: 'Prepare a copy that can be read back without the rough notes'
        vignettes:
          numbers: 'The clerk puts the longest duration next to the first flight. You slide the rough notes back across the table and count the trials with them before the figures go out.'
          headline: 'You suggest a big claim for the first line. The clerk asks which words can survive being copied into another newspaper. You try again, this time with the date and a place.'
          copy: 'You hold the rough notes flat while the clerk shortens the message. The details that must reach the family are still legible when the two copies are compared.'
      zh:
        name: 在空中的十二秒
        place: 北卡罗来纳基蒂霍克
        figure: 奥维尔和威尔伯·莱特
        story: '奥维尔·莱特日记记载，1903 年 12 月 17 日在基蒂霍克附近共试飞四次，随后兄弟俩把消息电告父亲。'
        relic: 一片螺旋桨叶
        relic_desc: 一片木头叶子，像一只扭过的翅膀。
        points:
          p1: '分清首次飞行和后面的几次'
          p2: '把数字对回对应的试飞'
          p3: '留一份脱离草记仍读得懂的消息'
        vignettes:
          numbers: '报务员把最长的时长写到了第一次旁边。你把草记推回去，趁数字还没发走，与他重新数一遍四次试飞。'
          headline: '你一开头就提了个大标题。报务员问，哪几个字给另一份报纸抄过去还说得通？你重写一遍，这回留下了日期和地点。'
          copy: '报务员删短消息时，你把草记扶平。两张拿来一对，该让家里知道的数字都还看得清。'
text:
  en:
    name: Orville and Wilbur Wright
    text: American brothers Wilbur Wright, 1867 to 1912, and Orville Wright, 1871 to 1948, who ran a bicycle shop in Dayton. Using a wind tunnel and their own gliders, they made the first powered, controlled flight at Kitty Hawk on 17 December 1903.
  zh:
    name: 奥维尔和威尔伯·莱特
    text: 美国的威尔伯·莱特，1867 年生，1912 年去世，以及奥维尔·莱特，1871 年生，1948 年去世，兄弟俩在代顿开自行车铺。他们靠风洞和自制滑翔机，于 1903 年 12 月 17 日在小鹰镇完成了第一次有动力、可操纵的飞行。
