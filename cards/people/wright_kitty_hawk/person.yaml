    text:
      en:
        name: Twelve seconds in the air
        place: Kitty Hawk, North Carolina
        figure: Orville and Wilbur Wright
        story: 'In September 1903 the Wright brothers came back to their camp near Kitty Hawk with a powered machine. Wilbur''s attempt on 14 December failed. On the morning of 17 December they made four flights, the first of twelve seconds and the last of fifty nine. That afternoon they walked to Kitty Hawk and telegraphed their father in Dayton.'
        relic: A propeller blade
        relic_desc: A wooden blade shaped like a twisted wing.
        points:
          p1: 'In the cold wind on the morning of 17 December, help the brothers steady the Flyer and keep the first take off safe'
          p2: 'After the fourth flight, hold the Flyer down on the sand and save Daniels and the machine'
        points_fail:
          p1: 'Before the take off a gust lifts one wing and drags it in the sand, and the machine never leaves the rail; in this branch there are no twelve seconds.'
          p2: 'The wind turns the Flyer over, Daniels is caught in the wings and tumbled along with it, and as in history the machine is too broken to fly again. In this branch it never leaves the ground after that afternoon.'
        shift:
          p1:
            was: 'On the morning of 17 December 1903 Orville flew for 12 seconds and 120 feet.'
          p2:
            was: 'On 17 December 1903, after the fourth flight, a gust overturned the Flyer with John Daniels caught between the wings, and the machine, badly broken, never flew again.'
            now: '{staff} and the men of the station held it down on the sand, and Daniels was not caught. That winter the brothers flew it a few more times over the dunes before they crated it for Dayton.'
        vignettes:
          numbers: '{staff} copies the four flights into a notebook in the order they were made, the seconds in one column and the feet in the other, and adds them up twice before the light goes.'
          sand: '{staff} digs the rail out of the drift after the night wind and stamps the sand flat at its foot. A helper from the station, made up for the game, says the wind will drop by morning, and it does not.'
          cold: '{staff} keeps the stove going in the shed while the engine is warmed. The puddles outside have frozen over, and nobody mentions it.'
      zh:
        name: 在空中的十二秒
        place: 北卡罗来纳基蒂霍克
        figure: 奥维尔和威尔伯·莱特
        story: '1903 年九月，莱特兄弟带着一架装了发动机的飞机回到基蒂霍克附近的营地。12 月 14 日威尔伯的尝试没有成功。12 月 17 日上午他们飞了四次，第一次 12 秒，最后一次 59 秒。当天下午，兄弟俩走到基蒂霍克，给代顿的父亲发了电报。'
        relic: 一片螺旋桨叶
        relic_desc: 一片木头叶子，像一只扭过的翅膀。
        points:
          p1: '12 月 17 日上午的冷风里，帮兄弟俩稳住飞行者号，护住第一次起飞'
          p2: '第四次飞行落地后，把飞行者号按在沙地上，救下丹尼尔斯和这架飞机'
        points_fail:
          p1: '起飞前一阵风把一侧机翼掀起来擦了沙，飞机没离开滑轨，这条分支里没有那 12 秒。'
          p2: '风把飞行者号掀翻，丹尼尔斯被卷在机翼里滚了出去，飞机照史实坏得再也飞不了。这条分支里，这架飞机在那天下午之后没有再离开过地面。'
        shift:
          p1:
            was: '1903 年 12 月 17 日上午，奥维尔飞了 12 秒，120 英尺。'
          p2:
            was: '1903 年 12 月 17 日，第四次飞行后一阵风掀翻了飞行者号，约翰·丹尼尔斯被卷在机翼中间，飞机损坏严重，从此再没飞过。'
            now: '{staff}和救生站的人把它按在了沙地上，丹尼尔斯没被卷进去。那年冬天，兄弟俩又让它在沙丘上飞了几回，才把它装箱运回代顿。'
        vignettes:
          numbers: '天黑之前，{staff}把四次飞行按先后抄进本子，秒数一栏，英尺一栏，加了两遍。'
          sand: '夜里风大，{staff}把滑轨从沙里刨出来，在滑轨脚下把沙踩平。一位编出来的救生站帮手说，天亮风就会停。天亮了，风没停。'
          cold: '发动机预热时，{staff}在棚里守着炉子。外头的水洼结了冰，谁也没提。'
text:
  en:
    name: Orville and Wilbur Wright
    text: Wilbur Wright (1867–1912) and Orville Wright (1871–1948) ran a bicycle shop in Dayton, Ohio, and tested their aircraft designs with gliders and a wind tunnel. At Kill Devil Hills, near Kitty Hawk, they made four powered flights on 17 December 1903. Orville piloted the first and Wilbur the last. Their telegram home put the longest flight at 57 seconds; it lasted 59.
  zh:
    name: 奥维尔和威尔伯·莱特
    text: 威尔伯·莱特（1867–1912）和奥维尔·莱特（1871–1948）在俄亥俄州代顿经营自行车铺，并用滑翔机和风洞检验飞行器设计。1903 年 12 月 17 日，他们在基蒂霍克附近的斩魔山完成四次动力飞行。第一次由奥维尔驾驶，最后一次由威尔伯驾驶。发回家的电报说最长一次是 57 秒，实际是 59 秒。
hook: {en: 'Fifty nine seconds, telegraphed as fifty seven', zh: '飞了五十九秒，电报上写五十七'}
quotes:
  wright_echo_telegram:
    order: 1
    tier: full
    date: '1903-12-17'
    checked: official_record
    sources: [wright_kitty_hawk_primary, nasm_telegraph_key]
    original: en
    text:
      en: {who: Orville Wright, quote: 'Success four flights Thursday morning', occasion: 'telegram to his father Milton Wright from Kitty Hawk'}
      zh: {who: 奥维尔·莱特, quote: '星期四上午，四次飞行成功', occasion: '在基蒂霍克发给父亲米尔顿·莱特的电报（游戏译文）'}
  wright_echo_belief:
    order: 2
    tier: none
    date: '1900-05-13'
    checked: official_record
    sources: [wright_loc_chanute_letter]
    original: en
    text:
      en: {who: Wilbur Wright, quote: 'For some years I have been afflicted with the belief that flight is possible to man.', occasion: 'letter to Octave Chanute on his plan to experiment with flight'}
      zh: {who: 威尔伯·莱特, quote: '这几年来，我一直被一个念头缠住：人是能够飞行的。', occasion: '致奥克塔夫·沙尼特、谈飞行实验计划的信（游戏译文）'}
facts:
  camp:
    date: '1903'
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [henryford_first_flight, nps_first_flight]
    text:
      en: 'The brothers came to Kitty Hawk in September 1903, and the first powered attempt was put off again and again by trouble with the machine.'
      zh: '兄弟俩 1903 年九月来到基蒂霍克，动力试飞因为机器出问题一再推迟。'
    line:
      en: 'September: the brothers come back to their camp near Kitty Hawk. The trial is put off again and again by trouble with the machine.'
      zh: '九月，兄弟俩回到基蒂霍克附近的营地。机器屡出毛病，试飞一推再推。'
  first_try:
    date: '1903-12-14'
    stay_day: 13
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [nps_first_flight, henryford_first_flight]
    text:
      en: 'On 14 December Wilbur won the toss of a coin and made the first attempt, which failed.'
      zh: '12 月 14 日，威尔伯掷硬币赢了，先上去试，没有成功。'
    line:
      en: '14 December: Wilbur wins the toss of a coin and goes first. The attempt fails.'
      zh: '12 月 14 日，威尔伯掷硬币赢了，先上去试，没有飞起来。'
  first_flight:
    date: '1903-12-17'
    stay_day: 16.1
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [henryford_first_flight, nps_first_flight]
    text:
      en: 'On the morning of 17 December Orville flew 120 feet in 12 seconds. John T. Daniels of the Kill Devil Hills life saving station took the photograph.'
      zh: '12 月 17 日上午，奥维尔飞了 12 秒，120 英尺。救生站的约翰·丹尼尔斯拍下了那张照片。'
    line:
      en: '17 December, morning: Orville flies 120 feet in 12 seconds. John T. Daniels of the life saving station presses the shutter.'
      zh: '12 月 17 日上午，奥维尔飞了 12 秒，120 英尺。救生站的约翰·丹尼尔斯按下了快门。'
  fourth_flight:
    date: '1903-12-17'
    stay_day: 16.3
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [nps_first_flight, henryford_first_flight]
    text:
      en: 'The fourth flight of the day was the longest, 852 feet in 59 seconds. The machine was badly damaged afterwards and never flew again.'
      zh: '当天第四次飞行最长，59 秒，852 英尺。之后飞机严重受损，再也没有飞过。'
    line:
      en: 'The fourth flight of the day is the longest: 852 feet in 59 seconds. Afterwards the machine is badly damaged and never flies again.'
      zh: '当天第四次最长，59 秒，852 英尺。之后飞机严重受损，再也没有飞过。'
  telegram:
    date: '1903-12-17'
    stay_day: 16.5
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [loc_today_dec17, nasm_telegraph_key]
    text:
      en: 'That afternoon the brothers walked four miles to Kitty Hawk and telegraphed their father. The message gave the longest flight as 57 seconds instead of 59 and misspelled Orville''s name.'
      zh: '当天下午，兄弟俩走了四英里到基蒂霍克，给父亲发电报。电文把最长一次写成 57 秒，实际是 59 秒，奥维尔的名字也拼错了。'
    line:
      en: 'Afternoon: the brothers walk four miles to Kitty Hawk and telegraph their father. The message says the longest flight was 57 seconds.'
      zh: '下午，兄弟俩走了四英里到基蒂霍克，给父亲发电报。电文上写着，最长一次 57 秒。'
  dayton:
    date: '1903-12-17'
    stay_day: 16.7
    checked: two_sources
    level: usable
    use: [story, history, wiki]
    sources: [loc_today_dec17, americanheritage_first_fly]
    text:
      en: 'Milton Wright recorded receiving the telegram in Dayton at about half past five that afternoon. The Dayton papers gave the news little or no notice.'
      zh: '米尔顿·莱特在日记里记下，当天下午五点半前后在代顿收到电报。代顿的报纸几乎没有登这条消息。'
    line:
      en: 'About half past five, in Dayton, their father Milton Wright receives the telegram. The papers of Dayton hardly print a word.'
      zh: '五点半前后，父亲米尔顿·莱特在代顿收到电报。代顿的报纸几乎一个字也没登。'
