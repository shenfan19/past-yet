text:
  en:
    name: Orville and Wilbur Wright
    text: American brothers Wilbur Wright, 1867 to 1912, and Orville Wright, 1871 to 1948, who ran a bicycle shop in Dayton. Using a wind tunnel and their own gliders, they made the first powered, controlled flight at Kitty Hawk on 17 December 1903.
  zh:
    name: 奥维尔和威尔伯·莱特
    text: 美国的威尔伯·莱特，1867 年生，1912 年去世，以及奥维尔·莱特，1871 年生，1948 年去世，兄弟俩在代顿开自行车铺。他们靠风洞和自制滑翔机，于 1903 年 12 月 17 日在小鹰镇完成了第一次有动力、可操纵的飞行。
