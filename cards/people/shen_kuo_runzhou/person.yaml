    text:
      en:
        name: A notebook of everything he saw
        place: Runzhou, China
        figure: Shen Kuo
        story: 'In Dream Pool Essays Shen Kuo records that the south-seeking end of a magnetized needle points slightly east of due south.'
        relic: A magnetised needle
        relic_desc: A needle that finds the same direction every time.
        points:
          p1: 'Before he presents the map of the empire to the court, help him draw a second set and keep it in his own hands'
        points_fail:
          p1: 'As in history the map goes to the court and is lost after the Yuan; in this branch he keeps no copy of his own.'
        shift:
          p1:
            was: '1088: Shen Kuo presented the map of the prefectures and counties he had been ordered to make in 1077, and was allowed to move about freely; the map was lost after the Yuan dynasty.'
            now: 'A second set of the map stayed with him and went with him to the Dream Brook garden at Runzhou.'
            who: shen_kuo_runzhou
            bio: 'In this timeline Shen Kuo kept a copy of his map of the empire when he presented it, and took it with him to Dream Brook.'
        vignettes:
          directions: 'You ask the reader which line is due south. He has drawn just one. You add a second line on the paper, and the small angle the passage describes becomes visible.'
          ends: 'The reader turns the paper over to show you the drawing and swaps the two ends as he retells it. You label the south-seeking tip before he copies it into the notebook.'
          copy: 'You ask the reader to keep the word slightly in the caption. The drawing takes up a whole page; the difference described in the book need not.'
      zh:
        name: 什么都记下来的笔记
        place: 中国润州
        figure: 沈括
        story: '沈括在《梦溪笔谈》中记下，磨过的磁针指南，却常微微偏东。'
        relic: 一根磁化的针
        relic_desc: 每次都指向同一个方向的针。
        points:
          p1: '献图之前，帮他把《天下州县图》另绘一套，留在自己手里'
        points_fail:
          p1: '图照史实献进宫里，元代以后散失，这条分支里他手里没有留下一份。'
        shift:
          p1:
            was: '元祐三年，沈括献上熙宁十年奉命编绘的《天下州县图》，获准自由居住；这套图元代以后失传。'
            now: '他手里多了一套副本，后来跟着他搬进润州的梦溪园。'
            who: shen_kuo_runzhou
            bio: '这条时间线里，沈括献图时另留了一套《天下州县图》，带到梦溪园收着。'
        vignettes:
          directions: '你问读者哪一条是正南。他纸上只有一道线。你添上另一道，书里那个微小的偏角才看得出来。'
          ends: '读者把纸转过来给你看，口头重述时却换了针的两头。你趁他还没誊进本子，标明哪一头指南。'
          copy: '你请读者在图旁保留那个「微」字。图画了一整页，书上说的偏差可没那么大。'
text:
  en:
    name: Shen Kuo
    text: Chinese scholar and official of the Song, 1031 to 1095. His Dream Pool Essays, written at Runzhou, record the magnetic compass, movable type, the geology of erosion and many other observations.
  zh:
    name: 沈括
    text: 宋代学者与官员，1031 年生，1095 年去世。他在润州写成的《梦溪笔谈》记载了指南针、活字印刷、侵蚀地质学以及许多其他观察。
hook: {en: 'The needle misses due south.', zh: '针尖为何没有正指南'}
