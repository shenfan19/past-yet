order: 5
unlock: always
gain_in_model: true
cost_in_model: true
text:
  en:
    gain: Sitting at the bedside earns neighbours' trust more easily, and the employee is more willing to treat when there are many patients.
    cost: Attachment grows faster, so they find it harder to leave and are reluctant to leave patients to find the local doctor.
  zh:
    gain: 床边陪伴更容易换来邻居的信任，病人多时更愿意去救。
    cost: 牵挂度涨得更快，更容易舍不得走，也不愿意离开病人去找名医。
