order: 1
kind: office
unlock: always
gain_in_model: true
cost_in_model: true
text:
  en:
    name: Favor
    text: An employee's affection for the agency, 0 to 1, starting at 0.5. Kept up with bonuses and successful trips, lowered by failures and giving up.
    gain: With high favor an employee is slower to get homesick and give up, and a greedy one is less likely to pocket things.
    cost: Favor has to be bought with money and success, and falls fast when trips go badly.
  zh:
    name: 好感度
    text: 员工对事务所的好感，0 到 1，初始 0.5。靠奖金和成功的派遣维持，失败和放弃会让它掉。
    gain: 好感高，员工更不容易想家放弃任务，贪婪的员工也更少顺手拿东西。
    cost: 好感要靠花钱和成功去养，派遣结果不好时掉得很快。
