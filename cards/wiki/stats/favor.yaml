order: 1
kind: office
unlock: always
gain_in_model: true
cost_in_model: true
text:
  en:
    name: Mood
    text: An employee's mood, 0 to 100, starting at 50. Every success raises it, every failure and giving up lowers it, and a reward of a month of wages adds 50.
    gain: Every attribute follows the mood, up to 20% more at full mood, so a good run feeds itself. A high mood also makes an employee slower to get homesick and give up.
    cost: At the bottom every attribute is 20% down, and a bad run feeds itself too. A reward costs a month of wages.
  zh:
    name: 心情
    text: 员工的心情，0 到 100，初始 50。每次成功让它涨，失败和放弃让它掉，奖励一个月工资加 50。
    gain: 所有属性随心情变化，心情满时多 20%，所以顺的时候越来越顺。心情高也更不容易想家放弃。
    cost: 心情见底时所有属性少 20%，不顺时也越来越不顺。奖励要花一个月工资。
