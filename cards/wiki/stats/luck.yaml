order: 5
unlock: always
gain_in_model: true
cost_in_model: true
text:
  en:
    gain: "A lucky person is found by what is left to chance: the points that ask for luck are reached more often, and more antiques come home."
    cost: "Luck cannot be trained or bought, and it does nothing where a point asks for skill."
  zh:
    gain: "运气好的人，交给运气的事常常成：要运气的同步点更容易踩中，也更容易带回古董。"
    cost: "运气练不出来也买不到，要本事的地方它不起作用。"
