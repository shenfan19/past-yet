text:
  en: A made-up new student stands in a courtyard with a letter and does not know which office to go to. The student is invented for the game. If the employee is handing out the simple map at that moment the student is shown the way, otherwise the student leaves for another school.
  zh: 一名编出来的新生拿着一封信站在院子里，不知道该去哪个办公室。这名学生是为游戏编的。员工那时正在发简图，他就被指了路，否则他去了别的学校。
