text:
  en:
    name: Rosalind Franklin, James Watson and Francis Crick
    text: Rosalind Franklin, James Watson and Francis Crick, who worked on the structure of DNA in Cambridge and London in 1951 to 1953. Franklin's X ray images, notably Photograph 51, were shown to Watson without her knowledge. Watson, Crick and Maurice Wilkins received the 1962 Nobel Prize.
  zh:
    name: 罗莎琳德·富兰克林、詹姆斯·沃森和弗朗西斯·克里克
    text: 罗莎琳德·富兰克林、詹姆斯·沃森和弗朗西斯·克里克，1951 至 1953 年在剑桥与伦敦研究 DNA 的结构。富兰克林的 X 光图像，尤其是“照片 51”，在她不知情时被给沃森看。沃森、克里克和莫里斯·威尔金斯获得 1962 年诺贝尔奖。
