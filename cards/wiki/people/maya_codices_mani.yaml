text:
  en:
    name: Maya scribes
    text: The Maya scribes of the Yucatan, whose books were folded bark paper manuscripts. In 1562 at Maní the Spanish friar Diego de Landa burned a large number of them. Only four Maya codices are known to survive.
  zh:
    name: 玛雅书吏
    text: 尤卡坦的玛雅书吏，他们的书是折叠的树皮纸写本。1562 年在马尼，西班牙修士迭戈·德·兰达烧毁了大量书籍。已知留存的玛雅抄本只有四部。
