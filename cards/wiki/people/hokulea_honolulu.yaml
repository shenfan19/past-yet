events:
- hokulea_honolulu
text:
  en:
    name: Mau Piailug and Nainoa Thompson
    text: Mau Piailug, a navigator from Satawal, and Nainoa Thompson. In 1976 the double hulled canoe Hokulea sailed from Hawaii to Tahiti without instruments, guided by Piailug's knowledge of stars and swells. Thompson learned from him and led later voyages.
  zh:
    name: 毛·皮艾卢格与纳伊诺阿·汤普森
    text: 沙塔瓦尔岛的领航人毛·皮艾卢格，以及纳伊诺阿·汤普森。1976 年，双体独木舟“霍库勒阿”不用仪器从夏威夷航行到大溪地，靠的是皮艾卢格对星辰与海浪的知识。汤普森向他学习，并领导了后来的航行。
