events:
- bose_calcutta
text:
  en:
    name: Jagadish Chandra Bose
    text: Indian physicist and biologist, 1858 to 1937, working in Calcutta. He produced and detected millimetre radio waves, and later measured the responses of plants with sensitive instruments.
  zh:
    name: 贾格迪什·钱德拉·博斯
    text: 印度物理学家与生物学家，1858 年生，1937 年去世，在加尔各答工作。他制造并探测毫米波无线电，后来用灵敏仪器测量植物的反应。
