text:
  en:
    name: Chinua Achebe
    text: Nigerian novelist and critic, 1930 to 2013, born into an Igbo family. His novel Things Fall Apart, published in 1958, is among the most widely read African novels and tells of the arrival of colonial rule from inside an Igbo village.
  zh:
    name: 钦努阿·阿契贝
    text: 尼日利亚小说家与评论家，1930 年生，2013 年去世，出身伊博族家庭。1958 年出版的《瓦解》是读者最多的非洲小说之一，从伊博村落内部讲述殖民统治的到来。
