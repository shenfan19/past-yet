- picasso_paris
text:
  en:
    name: Pablo Picasso
    text: Spanish painter and sculptor, 1881 to 1973, who worked mostly in France. In 1907 in Paris he painted Les Demoiselles d'Avignon, a break from earlier ideas of perspective that led to Cubism.
  zh:
    name: 巴勃罗·毕加索
    text: 西班牙画家与雕塑家，1881 年生，1973 年去世，主要在法国工作。1907 年他在巴黎画了《亚威农少女》，打破了以往的透视观念，引出立体主义。
