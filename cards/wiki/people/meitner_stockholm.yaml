text:
  en:
    name: Lise Meitner
    text: Austrian born physicist, 1878 to 1968. With her nephew Otto Frisch she gave the first explanation of nuclear fission in 1938 and 1939, while in exile in Sweden. The 1944 Nobel Prize for fission went to her colleague Otto Hahn alone.
  zh:
    name: 莉泽·迈特纳
    text: 奥地利出生的物理学家，1878 年生，1968 年去世。1938 至 1939 年她流亡瑞典期间，与外甥奥托·弗里施首次解释了核裂变。1944 年裂变的诺贝尔奖只授予了她的同事奥托·哈恩。
