- knossos_linear_a
text:
  en:
    name: Minoan scribes
    text: The scribes of Minoan Crete, who kept records at Knossos around 1500 BC. Linear A, the script used for the Minoan language, has not been deciphered. Its successor, Linear B, was read in 1952 and writes Greek.
  zh:
    name: 米诺斯的书吏
    text: 米诺斯克里特的书吏，约公元前 1500 年在克诺索斯记账。用来书写米诺斯语的线形文字甲至今没有破译。它的后继者线形文字乙在 1952 年被读出，写的是希腊语。
