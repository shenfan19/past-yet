- chaco_sun_watchers
text:
  en:
    name: "The people of Chaco Canyon"
    text: "The people who built the great houses of Chaco Canyon and aligned stone and rock to the sun and moon, from about the ninth to the twelfth century. Pueblo peoples and other nations regard the canyon as ancestral and sacred, and care for its meaning today."
  zh:
    name: "查科峡谷的人们"
    text: "大约九到十二世纪建起查科峡谷的大型石屋、并让石头与岩壁对准太阳和月亮的人们。普韦布洛人和其他族群视这片峡谷为祖先之地与圣地，至今守护着它的意义。"
