- al_haytham_cairo
text:
  en:
    name: Ibn al-Haytham
    text: Arab scholar of mathematics and optics, about 965 to about 1040, who worked in Cairo. His Book of Optics argued that vision comes from light entering the eye and relied on experiments, which makes him an early figure of the experimental method.
  zh:
    name: 伊本·海赛姆
    text: 阿拉伯数学家与光学家，约 965 年生，约 1040 年去世，在开罗工作。他的《光学书》提出视觉来自进入眼睛的光，并依靠实验论证，被视为实验方法的早期代表。
