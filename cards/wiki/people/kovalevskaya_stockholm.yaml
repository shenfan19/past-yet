order: 228
events:
- kovalevskaya_stockholm
text:
  en:
    name: "Sofia Kovalevskaya"
    text: "Russian mathematician, born 1850, died 1891. She was a professor in Stockholm, and in 1888 won a prize of the French Academy of Sciences for her work on the rotation of a rigid body."
  zh:
    name: "索菲娅·柯瓦列夫斯卡娅"
    text: "俄国数学家，1850 年生，1891 年去世。她在斯德哥尔摩任教授，1888 年因对刚体旋转问题的研究获得法国科学院的奖。"
