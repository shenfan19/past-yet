text:
  en:
    name: Brahmagupta
    text: Indian mathematician and astronomer, 598 to about 668. His 628 work treats zero as a number with rules for arithmetic with it and with negative numbers, and gives methods for solving quadratic equations.
  zh:
    name: 婆罗摩笈多
    text: 印度数学家与天文学家，598 年生，约 668 年去世。他 628 年的著作把零当作一个数，给出它和负数的运算规则，还给出解二次方程的方法。
