events:
- ban_zhao_luoyang
text:
  en:
    name: Ban Zhao
    text: Chinese historian and writer of the Han, about 45 to about 117. She completed the Book of Han after the death of her brother Ban Gu, and served at court as a teacher to the empress and her ladies.
  zh:
    name: 班昭
    text: 汉代历史学家与作家，约 45 年生，约 117 年去世。兄长班固去世后，她续成《汉书》，并在宫中做皇后与宫女们的老师。
