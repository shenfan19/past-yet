- apollo_cape_canaveral
text:
  en:
    name: Neil Armstrong, Buzz Aldrin and the Apollo teams
    text: The crew and teams of the Apollo programme. On 20 July 1969 Neil Armstrong and Buzz Aldrin landed on the Moon while Michael Collins stayed in orbit. Hundreds of thousands of engineers, programmers and technicians worked on the programme.
  zh:
    name: 尼尔·阿姆斯特朗、巴兹·奥尔德林和阿波罗团队
    text: 阿波罗计划的乘组与团队。1969 年 7 月 20 日，尼尔·阿姆斯特朗和巴兹·奥尔德林登上月球，迈克尔·柯林斯留在轨道上。数十万工程师、程序员和技术人员参与了这项计划。
