- carson_silver_spring
text:
  en:
    name: Rachel Carson
    text: American biologist and writer, 1907 to 1964. Her 1962 book Silent Spring described the harm of pesticides to wildlife and people, and helped start the environmental movement. She died of cancer two years later.
  zh:
    name: 蕾切尔·卡森
    text: 美国生物学家与作家，1907 年生，1964 年去世。她 1962 年的《寂静的春天》描述了杀虫剂对野生动物和人的危害，推动了环保运动。两年后她死于癌症。
