text:
  en:
    name: Philo Farnsworth
    text: American inventor, 1906 to 1971. In 1927 in San Francisco he transmitted the first fully electronic television image, and later fought long patent disputes over the invention.
  zh:
    name: 菲洛·法恩斯沃思
    text: 美国发明家，1906 年生，1971 年去世。1927 年他在旧金山传输了第一幅完全电子化的电视图像，后来为这项发明长期打专利官司。
