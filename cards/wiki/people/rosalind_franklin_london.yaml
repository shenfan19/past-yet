- rosalind_franklin_london
text:
  en:
    name: Rosalind Franklin
    text: English chemist and X ray crystallographer, 1920 to 1958. In 1952 at King's College London she and her student Raymond Gosling took the diffraction image of DNA known as Photograph 51. She died of ovarian cancer at thirty seven.
  zh:
    name: 罗莎琳德·富兰克林
    text: 英国化学家与 X 射线晶体学家，1920 年生，1958 年去世。1952 年她与学生雷蒙德·戈斯林在伦敦国王学院拍下被称为“照片 51”的 DNA 衍射图像。她三十七岁死于卵巢癌。
