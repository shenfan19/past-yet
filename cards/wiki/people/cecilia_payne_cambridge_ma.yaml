- cecilia_payne_cambridge_ma
text:
  en:
    name: Cecilia Payne
    text: British American astronomer, 1900 to 1979. Her 1925 thesis showed that stars are made mostly of hydrogen and helium. She was told to downplay the result and was accepted only years later.
  zh:
    name: 塞西莉亚·佩恩
    text: 英裔美国天文学家，1900 年生，1979 年去世。她 1925 年的论文指出恒星主要由氢和氦构成。她被要求淡化这个结论，几年之后才被接受。
