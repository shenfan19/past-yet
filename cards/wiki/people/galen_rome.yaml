- galen_rome
text:
  en:
    name: Galen
    text: Greek physician, 129 to about 216, who served gladiators and emperors in Rome. He wrote on anatomy and medicine from animal dissection and his works dominated European and Islamic medicine for over a thousand years.
  zh:
    name: 盖伦
    text: 希腊医生，129 年生，约 216 年去世，在罗马为角斗士和皇帝治病。他通过动物解剖写出解剖与医学著作，影响欧洲和伊斯兰医学一千多年。
