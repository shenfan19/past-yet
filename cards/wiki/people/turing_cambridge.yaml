text:
  en:
    name: Alan Turing
    text: English mathematician, 1912 to 1954. In 1936 he described an abstract machine that defined what can be computed. During the Second World War he led work on breaking German naval ciphers, and in 1952 he was prosecuted for homosexuality.
  zh:
    name: 艾伦·图灵
    text: 英国数学家，1912 年生，1954 年去世。1936 年他描述了一种界定“什么可计算”的抽象机器。第二次世界大战期间，他领导破译德国海军密码的工作，1952 年因同性恋被起诉。
