events:
- ibn_al_nafis_cairo
text:
  en:
    name: Ibn al-Nafis
    text: Arab physician, about 1213 to 1288, who worked in Damascus and Cairo. He described the pulmonary circulation, blood passing from the right side of the heart to the lungs and back, centuries before it was known in Europe.
  zh:
    name: 伊本·纳菲斯
    text: 阿拉伯医生，约 1213 年生，1288 年去世，在大马士革和开罗工作。他描述了肺循环，即血液由心脏右侧到肺再回来，比欧洲人知道此事早了几百年。
