text:
  en:
    name: Robert Falcon Scott
    text: British naval officer and explorer, 1868 to 1912. He led the Terra Nova expedition to the South Pole, reached it in January 1912 to find that Roald Amundsen had arrived first, and died with his companions on the return across the Ross Ice Shelf.
  zh:
    name: 罗伯特·法尔肯·斯科特
    text: 英国海军军官与探险家，1868 年生，1912 年去世。他率领“新地”号探险队前往南极点，1912 年 1 月到达时发现阿蒙森已先到，返程穿越罗斯冰架时与同伴一起去世。
