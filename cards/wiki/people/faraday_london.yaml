text:
  en:
    name: Michael Faraday
    text: English scientist, 1791 to 1867, who began as a bookbinder's apprentice. In 1831 at the Royal Institution in London he discovered electromagnetic induction, and he also laid the foundations of electrochemistry.
  zh:
    name: 迈克尔·法拉第
    text: 英国科学家，1791 年生，1867 年去世，早年是装订学徒。1831 年他在伦敦皇家研究院发现电磁感应，也奠定了电化学的基础。
