text:
  en:
    name: The casters of Ife
    text: The casters of Ife, a city of the Yoruba in what is now Nigeria. From about the twelfth to the fifteenth century they made lifelike heads in copper alloy by the lost wax method.
  zh:
    name: 伊费的铸造匠人
    text: 伊费的铸造匠人。伊费是约鲁巴人的城市，在今尼日利亚境内。大约从十二世纪到十五世纪，他们用失蜡法做出写实的铜合金头像。
