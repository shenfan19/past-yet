text:
  en:
    name: Jorge Luis Borges
    text: Argentine writer, 1899 to 1986. His short stories of labyrinths, libraries and mirrors, such as those collected in Fictions in 1944, shaped modern fiction. He became blind in middle age and was director of the National Library.
  zh:
    name: 豪尔赫·路易斯·博尔赫斯
    text: 阿根廷作家，1899 年生，1986 年去世。他写迷宫、图书馆和镜子的短篇小说，例如 1944 年的《虚构集》，影响了现代小说。他中年失明，曾任国家图书馆馆长。
