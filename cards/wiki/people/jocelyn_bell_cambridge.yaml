text:
  en:
    name: Jocelyn Bell
    text: Northern Irish astronomer, born 1943. In 1967, as a doctoral student in Cambridge, she noticed a regular radio signal that proved to come from a pulsar. The 1974 Nobel Prize for the discovery went to her supervisor and not to her.
  zh:
    name: 乔瑟琳·贝尔
    text: 北爱尔兰天文学家，1943 年生。1967 年她在剑桥读博士时发现一个有规律的射电信号，后来证实来自脉冲星。1974 年这项发现的诺贝尔奖授予了她的导师，没有给她。
