- ibn_khaldun_cairo
text:
  en:
    name: Ibn Khaldun
    text: Arab historian and statesman, 1332 to 1406, born in Tunis. His Muqaddima analyses the rise and fall of dynasties and the role of group solidarity, and is seen as an early work of social science. He died in Cairo.
  zh:
    name: 伊本·赫勒敦
    text: 阿拉伯历史学家与政治家，1332 年生，1406 年去世，生于突尼斯。他的《历史绪论》分析王朝的兴衰和群体凝聚力的作用，被视为社会科学的早期著作。他在开罗去世。
