text:
  en:
    name: Enheduanna
    text: High priestess of the moon god at Ur, daughter of Sargon of Akkad, around 2300 BC. Hymns signed with her name are among the earliest known works by a named author.
  zh:
    name: 恩赫杜安娜
    text: 乌尔月神的大祭司，阿卡德萨尔贡之女，活跃于公元前 2300 年前后。署有她名字的赞美诗是已知最早的署名作者作品之一。
