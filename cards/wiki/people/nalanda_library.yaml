text:
  en:
    name: The monks of Nalanda
    text: The monks and scholars of Nalanda, a Buddhist monastic university in Bihar that flourished from about the fifth century. Students came from across Asia. It was sacked around 1190 and its library is said to have burned for days.
  zh:
    name: 那烂陀的僧人
    text: 那烂陀的僧人与学者。那烂陀是比哈尔邦的佛教寺院大学，从约五世纪起兴盛，学生来自亚洲各地。约 1190 年它被洗劫，据说图书馆烧了好几天。
