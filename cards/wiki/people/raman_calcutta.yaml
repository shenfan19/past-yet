- raman_calcutta
text:
  en:
    name: C. V. Raman
    text: Indian physicist, 1888 to 1970. In 1928 in Calcutta he and K. S. Krishnan observed that light scattered by a liquid changes colour, the effect named after him. He received the Nobel Prize in Physics in 1930.
  zh:
    name: 钱德拉塞卡拉·拉曼
    text: 印度物理学家，1888 年生，1970 年去世。1928 年他与克里希南在加尔各答观察到液体散射的光会变色，这个效应以他命名。1930 年他获得诺贝尔物理学奖。
