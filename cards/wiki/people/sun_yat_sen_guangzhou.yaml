events:
- sun_yat_sen_guangzhou
text:
  en:
    name: "Sun Yat-sen"
    text: "Chinese revolutionary and political leader, 1866 to 1925. On 4 February 1924 he ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University. He died of liver cancer in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University."
  zh:
    name: "孙中山"
    text: "中国革命家和政治领袖，1866 年生，1925 年去世。1924 年 2 月 4 日他下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学。他 1925 年 3 月 12 日因肝癌在北京去世，1926 年这所大学改名为国立中山大学。"
