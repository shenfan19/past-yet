order: 232
events:
- sun_yat_sen_guangzhou
text:
  en:
    name: "Sun Yat-sen"
    text: "Chinese revolutionary and political leader, 1866 to 1925. In 1924 he had several higher schools in Guangzhou joined into National Guangdong University. After his death in 1925 the university was renamed National Sun Yat-sen University in 1926."
  zh:
    name: "孙中山"
    text: "中国革命家和政治领袖，1866 年生，1925 年去世。1924 年他让广州的几所高等学校合并为国立广东大学。他 1925 年去世后，这所大学在 1926 年改名为国立中山大学。"
