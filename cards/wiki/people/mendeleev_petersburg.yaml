- mendeleev_petersburg
text:
  en:
    name: Dmitri Mendeleev
    text: Russian chemist, 1834 to 1907. In 1869 in St Petersburg he published a periodic table that arranged the elements by atomic weight and left gaps for elements not yet found.
  zh:
    name: 门捷列夫
    text: 俄国化学家，1834 年生，1907 年去世。1869 年他在圣彼得堡发表周期表，按原子量排列元素，并为尚未发现的元素留出空位。
