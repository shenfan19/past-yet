text:
  en:
    name: Wolfgang Amadeus Mozart
    text: Austrian composer, 1756 to 1791. A child prodigy, he wrote operas, symphonies and concertos. His Don Giovanni had its first performance in Prague in 1787, and he left his Requiem unfinished when he died in Vienna in 1791.
  zh:
    name: 沃尔夫冈·阿马德乌斯·莫扎特
    text: 奥地利作曲家，1756 年生，1791 年去世。他是神童，写下歌剧、交响曲和协奏曲。《唐璜》1787 年在布拉格首演，1791 年他在维也纳去世时《安魂曲》尚未完成。
