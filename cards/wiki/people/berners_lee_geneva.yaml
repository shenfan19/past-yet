- berners_lee_geneva
text:
  en:
    name: Tim Berners-Lee
    text: English computer scientist, born 1955. In 1989, while working at CERN in Geneva, he proposed an information system of linked documents that became the World Wide Web, and he later helped keep its standards open.
  zh:
    name: 蒂姆·伯纳斯-李
    text: 英国计算机科学家，1955 年生。1989 年在日内瓦的欧洲核子研究中心工作时，他提出一套由链接文档组成的信息系统，这就是万维网，后来他还推动其标准保持开放。
