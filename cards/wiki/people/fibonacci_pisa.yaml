text:
  en:
    name: Fibonacci
    text: Italian mathematician, about 1170 to about 1250, from Pisa. His 1202 Book of Calculation brought the Hindu Arabic numerals to Europe and contains the problem of the rabbits that gives the Fibonacci sequence.
  zh:
    name: 斐波那契
    text: 意大利数学家，约 1170 年生，约 1250 年去世，出身比萨。他 1202 年的《计算之书》把印度阿拉伯数字带到欧洲，书中兔子繁殖的问题产生了斐波那契数列。
