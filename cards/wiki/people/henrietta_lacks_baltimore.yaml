events:
- henrietta_lacks_baltimore
text:
  en:
    name: Henrietta Lacks
    text: American woman, 1920 to 1951, treated for cervical cancer at Johns Hopkins in Baltimore. Cells taken from her tumour without her knowledge became the HeLa line, the first human cells to grow indefinitely in a laboratory, and raised lasting questions about consent.
  zh:
    name: 海瑞塔·拉克斯
    text: 美国女性，1920 年生，1951 年去世，在巴尔的摩的约翰斯·霍普金斯医院治疗宫颈癌。她的肿瘤细胞在她不知情的情况下被取走，成为 HeLa 细胞系，是第一种能在实验室无限培养的人类细胞，也引出了长久的知情同意问题。
