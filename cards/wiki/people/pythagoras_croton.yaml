- pythagoras_croton
text:
  en:
    name: Pythagoras
    text: Greek philosopher from Samos, about 570 BC to about 495 BC, who founded a community at Croton in southern Italy. He and his followers held that number underlies nature and music. The theorem named after him was known earlier in other cultures.
  zh:
    name: 毕达哥拉斯
    text: 萨摩斯的希腊哲学家，约公元前 570 年生，约公元前 495 年去世，在意大利南部的克罗顿创立团体。他和追随者认为数是自然与音乐的根本。以他命名的定理在其他文化里更早就已为人所知。
