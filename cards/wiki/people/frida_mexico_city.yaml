text:
  en:
    name: Frida Kahlo
    text: Mexican painter, 1907 to 1954. After a bus accident at eighteen she painted from her bed, and her self portraits draw on Mexican folk art and her own pain. She lived in the Blue House in Mexico City.
  zh:
    name: 弗里达·卡罗
    text: 墨西哥画家，1907 年生，1954 年去世。十八岁时遭遇公交车事故，之后在床上作画，自画像融合墨西哥民间艺术和她自己的痛苦。她住在墨西哥城的蓝房子里。
