text:
  en:
    name: Wangari Maathai
    text: Kenyan environmentalist, 1940 to 2011. In 1977 she founded the Green Belt Movement in Nairobi, which planted tens of millions of trees and trained rural women. She received the Nobel Peace Prize in 2004.
  zh:
    name: 旺加里·马塔伊
    text: 肯尼亚环保人士，1940 年生，2011 年去世。1977 年她在内罗毕创立绿带运动，种下数千万棵树并培训农村妇女。2004 年她获诺贝尔和平奖。
