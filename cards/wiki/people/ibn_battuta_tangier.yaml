order: 101
events:
- ibn_battuta_tangier
text:
  en:
    name: Ibn Battuta
    text: Moroccan traveller from Tangier, 1304 to about 1369. Over nearly thirty years he travelled through North Africa, Arabia, India, China and West Africa, and dictated his Rihla on his return.
  zh:
    name: 伊本·白图泰
    text: 摩洛哥旅行家，丹吉尔人，1304 年生，约 1369 年去世。近三十年间他走过北非、阿拉伯、印度、中国和西非，回来后口述了《游记》。
