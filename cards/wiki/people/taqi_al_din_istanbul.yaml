- taqi_al_din_istanbul
text:
  en:
    name: Taqi al-Din
    text: Ottoman scholar and astronomer, 1526 to 1585. In the 1570s he built an observatory in Istanbul with large instruments, and wrote on clocks and mechanics. The observatory was demolished in 1580.
  zh:
    name: 塔基·丁
    text: 奥斯曼学者与天文学家，1526 年生，1585 年去世。1570 年代他在伊斯坦布尔建起带大型仪器的天文台，还写过钟表和力学的著作。天文台在 1580 年被拆毁。
