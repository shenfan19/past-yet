- einstein_bern
text:
  en:
    name: Albert Einstein
    text: German born physicist, 1879 to 1955. In 1905, while working as a patent clerk in Bern, he published papers on the photoelectric effect, Brownian motion and special relativity. He received the Nobel Prize in Physics in 1921.
  zh:
    name: 阿尔伯特·爱因斯坦
    text: 德国出生的物理学家，1879 年生，1955 年去世。1905 年他在伯尔尼做专利局职员时，发表了关于光电效应、布朗运动和狭义相对论的论文。1921 年获诺贝尔物理学奖。
