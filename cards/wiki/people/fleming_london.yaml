- fleming_london
text:
  en:
    name: Alexander Fleming
    text: Scottish physician and bacteriologist, 1881 to 1955. In 1928 at St Mary's Hospital in London he noticed that a mould killed bacteria on a culture plate. Howard Florey and Ernst Chain later turned penicillin into a medicine, and the three shared the 1945 Nobel Prize.
  zh:
    name: 亚历山大·弗莱明
    text: 苏格兰医生与细菌学家，1881 年生，1955 年去世。1928 年他在伦敦圣玛丽医院注意到一种霉菌杀死了培养皿上的细菌。后来弗洛里和钱恩把青霉素做成药，三人分享了 1945 年诺贝尔奖。
