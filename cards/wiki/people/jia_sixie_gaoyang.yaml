events:
- jia_sixie_gaoyang
text:
  en:
    name: "Jia Sixie"
    text: "A man of the Northern Wei, with dates of birth and death unknown. His Qimin Yaoshu was written around the 530s or 540s and is the earliest surviving systematic farming treatise in China."
  zh:
    name: "贾思勰"
    text: "北魏人，生卒年不详。他写成的《齐民要术》成书约在 6 世纪三四十年代，是中国现存最早的系统农书。"
