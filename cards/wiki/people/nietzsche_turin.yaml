- nietzsche_turin
text:
  en:
    name: Friedrich Nietzsche
    text: German philosopher, 1844 to 1900. He wrote Thus Spoke Zarathustra and criticised morality and religion. In January 1889 he collapsed in Turin and never recovered his mind, and spent his last years in the care of his mother and sister.
  zh:
    name: 弗里德里希·尼采
    text: 德国哲学家，1844 年生，1900 年去世。他写了《查拉图斯特拉如是说》，批判道德与宗教。1889 年 1 月他在都灵崩溃，再也没有恢复心智，晚年由母亲和妹妹照料。
