- al_khwarizmi_baghdad
text:
  en:
    name: Al-Khwarizmi
    text: Scholar of the House of Wisdom in Baghdad, about 780 to about 850. His book on calculation by restoration and balancing gave algebra its name, and the Latin form of his own name gave the word algorithm.
  zh:
    name: 花拉子米
    text: 巴格达智慧宫的学者，约 780 年生，约 850 年去世。他讲述还原与对消的计算之书为代数命名，而他本人名字的拉丁化形式则成了“算法”一词。
