- li_shizhen_qizhou
text:
  en:
    name: Li Shizhen
    text: Chinese physician of the Ming, 1518 to 1593. After nearly three decades of work he completed the Compendium of Materia Medica, which describes about nineteen hundred substances, and which was printed after his death.
  zh:
    name: 李时珍
    text: 明代医生，1518 年生，1593 年去世。他花了近三十年写成《本草纲目》，记载约一千九百种药物，书在他去世后刊行。
