- wu_chienshiung_washington
text:
  en:
    name: Chien Shiung Wu
    text: Chinese American physicist, 1912 to 1997. In 1956 and 1957 she led an experiment on cobalt 60 that showed that parity is not conserved in weak interactions. The theorists who proposed the idea received the 1957 Nobel Prize and she did not.
  zh:
    name: 吴健雄
    text: 华裔美国物理学家，1912 年生，1997 年去世。1956 至 1957 年她主持钴 60 实验，证明弱相互作用中宇称不守恒。提出这一想法的理论家获得了 1957 年诺贝尔奖，她没有。
