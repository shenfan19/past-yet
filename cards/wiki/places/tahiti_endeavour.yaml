text:
  en:
    name: Tahiti, 1769
    text: The largest of the Society Islands in the Pacific, where the Endeavour anchored in 1769 to observe the transit of Venus. The Endeavour in the game is a ship's company model of about ninety people.
  zh:
    name: 塔希提，1769
    text: 太平洋社会群岛中最大的一座岛，奋进号 1769 年在这里停泊，观测金星凌日。游戏里的奋进号是一个约九十人的船员模型。
