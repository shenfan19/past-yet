text:
  en:
    name: Broad Street, London, 1854
    text: A street in Soho, London, with a public water pump at its corner. From the end of August to early September 1854 cholera broke out here. Broad Street in the game is a neighbourhood model of about five hundred people.
  zh:
    name: 伦敦宽街，1854
    text: 伦敦苏荷区的一条街，街口有一台公用水泵。1854 年 8 月底到 9 月初，这一带暴发霍乱。游戏里的宽街是一个约五百人的街区模型。
