# What an employee is: five attributes from 1 to 10 that the player sees, and nothing hidden behind them: order, wit, constitution, finesse and will.
# Traits do not change the attributes. A trait is worth something at the sync points of a place, and costs something there.
attributes:
  - lawful
  - wit
  - constitution
  - finesse
  - will
default_base:
  lawful: 5
  wit: 5
  constitution: 5
  finesse: 5
  will: 5
default_habit:
  focus: balanced
  on_block: yield
# The era models were written against finer quantities. Each is a plain function of one attribute, and at 5 each is what the models always had.
# A weak will means homesickness and being hurt by hostility, a weak constitution means catching disease, and the order of an employee is not a stat of the models: it is how orderly or chaotic they are, and scenes will ask for either end.
stats:
  - stamina
  - skill
  - eloquence
  - kindness
  - stubbornness
  - curiosity
  - homesick_trait
  - hurt
  - infect
derive:
  stamina: {from: constitution, scale: 0.1, offset: 0.5}
  skill: {from: wit, scale: 0.08, offset: 0}
  curiosity: {from: wit, scale: 0.04, offset: 0}
  eloquence: {from: finesse, scale: 0.08, offset: 0}
  stubbornness: {from: will, scale: 0.04, offset: 0}
  homesick_trait: {from: will, scale: -0.08, offset: 0.6}
  hurt: {from: will, scale: -0.08, offset: 0.6}
  kindness: {offset: 0.2}
  infect: {from: constitution, scale: -0.2, offset: 1}
