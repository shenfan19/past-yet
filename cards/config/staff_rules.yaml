# What an employee is: five attributes from 1 to 10 that the player sees, and nothing hidden behind them: wit, constitution, finesse, will and luck. A person starts at 4 in each, and what they have lived adds a little with age, the average of the five at most 6.
# Traits do not change the attributes. A trait is worth something at the sync points of a place, and costs something there.
attributes:
  - wit
  - constitution
  - finesse
  - will
  - luck
default_base:
  wit: 4
  constitution: 4
  finesse: 4
  will: 4
  luck: 4
default_habit:
  focus: balanced
  on_block: yield
# The era models were written against finer quantities. Each is a plain function of one attribute, and at 5 each is what the models always had, so a person at 4 is a little under.
# A weak will means homesickness and being hurt by hostility, a weak constitution means catching disease, and luck is read where a point or an antique is left to chance.
stats:
  - stamina
  - skill
  - eloquence
  - kindness
  - stubbornness
  - curiosity
  - homesick_trait
  - hurt
  - infect
derive:
  stamina: {from: constitution, scale: 0.1, offset: 0.5}
  skill: {from: wit, scale: 0.08, offset: 0}
  curiosity: {from: wit, scale: 0.04, offset: 0}
  eloquence: {from: finesse, scale: 0.08, offset: 0}
  stubbornness: {from: will, scale: 0.04, offset: 0}
  homesick_trait: {from: will, scale: -0.08, offset: 0.6}
  hurt: {from: will, scale: -0.08, offset: 0.6}
  kindness: {offset: 0.2}
  infect: {from: constitution, scale: -0.2, offset: 1}
# What a point that asks for a woman or a man sees: a trans woman is a woman, a trans man is a man, another gender is its own.
gender_class: {f: f, m: m, tf: f, tm: m, x: x}
