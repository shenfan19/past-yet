# What an employee is: five attributes from 1 to 10 that the player sees, and nothing hidden behind them: wit, constitution, finesse, will and luck. A person starts at 4 in each, and what they have lived adds a little with age, the average of the five at most 6.
# Traits do not change the attributes. A trait is worth something at the sync points of a place, and costs something there.
attributes:
  - wit
  - constitution
  - finesse
  - will
  - luck
default_base:
  wit: 4
  constitution: 4
  finesse: 4
  will: 4
  luck: 4
default_habit:
  focus: balanced
  on_block: yield
# The era models were written against finer quantities. Each is a plain function of one attribute, and at 5 each is what the models always had, so a person at 4 is a little under.
# A weak will means homesickness and being hurt by hostility, a weak constitution means catching disease, and luck is read where a point or an antique is left to chance.
stats:
  - stamina
  - skill
  - eloquence
  - kindness
  - stubbornness
  - curiosity
  - homesick_trait
  - hurt
  - infect
derive:
  stamina: {from: constitution, scale: 0.1, offset: 0.5}
  skill: {from: wit, scale: 0.08, offset: 0}
  curiosity: {from: wit, scale: 0.04, offset: 0}
  eloquence: {from: finesse, scale: 0.08, offset: 0}
  stubbornness: {from: will, scale: 0.04, offset: 0}
  homesick_trait: {from: will, scale: -0.08, offset: 0.6}
  hurt: {from: will, scale: -0.08, offset: 0.6}
  kindness: {offset: 0.2}
  infect: {from: constitution, scale: -0.2, offset: 1}
# What a point that asks for a woman or a man sees: a trans woman is a woman, a trans man is a man, another gender is its own.
gender_class: {f: f, m: m, tf: f, tm: m, x: x}
# What a scene can ask of a person beyond the five attributes: the tags. They are worked out from the card, nothing is entered by hand.
# A model reads each of them as a variable named tag.<name> that is 1 or 0, and an identity asks for them by name.
# Tags from an attribute: at least min, or at most max.
tags:
  steady: {stat: finesse, min: 6}
  clumsy: {stat: finesse, max: 2}
  eloquent: {stat: finesse, min: 6}
  sturdy: {stat: constitution, min: 5}
  frail: {stat: constitution, max: 2}
  sharp: {stat: wit, min: 7}
  steadfast: {stat: will, min: 7}
# The kinds of work. A job may be of several kinds. Each kind is the tag class_<kind>.
job_classes:
  lettered: [accountant, archivist, bookseller, data_analyst, game_designer, journalist, office_worker, programmer, proofreader, tax_preparer, translator, writer, sysadmin, student, architecture_intern, radio_host, union_organizer, tour_guide, site_manager, antique_dealer]
  learned: [biologist, geologist, modelling_scientist, lecturer, university_lecturer, medical_teacher, doctor, physician, civil_engineer, retired_engineer, mining_consultant, pharmacist]
  medical: [doctor, physician, nurse, midwife, paramedic, pharmacist, caregiver, medical_teacher]
  teaching: [teacher, tutor, lecturer, university_lecturer, sewing_teacher, flight_instructor, medical_teacher]
  religious: [former_monk]
  food: [baker, chef, cook, street_food_seller, waitress]
  trade: [market_trader, shopkeeper, stall_keeper, street_vendor, shop_assistant, hardware_shop_assistant, bookseller, antique_dealer, street_food_seller]
  craft: [carpenter, electrician, embroiderer, mechanic, pump_repairer, restorer, seamstress, tailor, woodcarver, shipwright, garment_worker, painter, illustrator, musician]
  labour: [builder, courier, factory_worker, farmer, farmhand, dairy_farmer, potato_farmer, coffee_farmer, shepherd, villager, warehouse_loader, scaffolder, cooperative_member, dishwasher]
  seafaring: [sailor, navigator, ferry_pilot, ferryman, fisher, fisherman, shipwright, net_mender]
  travel: [driver, rideshare_driver, bush_pilot, courier, tour_guide, navigator, sailor, ferry_pilot]
  press: [journalist, radio_host, writer]
# Reading and writing. literate: a job of one of these kinds, or wit at least lettered_wit. learned: a learned job, or literate by a job with wit at least learned_wit.
literacy:
  lettered_classes: [lettered, learned, teaching, medical, press, religious]
  lettered_wit: 6
  learned_classes: [learned]
  learned_wit: 7
# The age tags.
ages: {young_max: 29, elder_min: 60}
# The face of a person in a place is local, near or far. A place names the regions that are at home in it and may name those near it.
# Where it names none near, the regions of the same part of the world are near.
faces:
  conspicuous: {local: 0, near: 0.5, far: 1}
  parts:
    asia: [china, japan, korea, india, south_asia, southeast_asia, central_asia, middle_east]
    europe: [europe_west, europe_east]
    africa: [north_africa, west_africa, east_africa, central_africa, southern_africa]
    americas: [latin_america, north_america]
    oceania: [pacific]
