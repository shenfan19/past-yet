meta:
  app: The Past Is Yet to Come
  chinese_title: 白露未晞
  version: 0.13.4
  released: '2026-11-20'
  card_authors: [AI, Fan Shen]
  links:
    author: https://github.com/shenfan19
    lm: https://lifematters.dev
    care: https://careforyou.dev
    site: https://www.pastyet.com
    code: https://github.com/shenfan19/past-yet-come
    issues: https://github.com/shenfan19/past-yet-come/issues
    mail: mailto:shenfan19@gmail.com
    music: https://www.mutopiaproject.org
i18n:
  fallback: en
  auto: auto
  storage_key: teleporter_lang
  story_locales: [en, zh]
  locales:
    en: English
    zh: 简体中文
    zh-Hant: 繁體中文
    fr: Français
    es: Español
    ja: 日本語
    ko: 한국어
save:
  key: teleporter_save
  version: 13
  file_name: past-yet-come-save
eras:
  - broad_street_1854
  - vienna_1847
  - scutari_1855
  - finlay_havana_1881
  - jenner_berkeley_1796
  - seacole_balaklava_1855
  - sun_yat_sen_1924
  - tupaia_tahiti_1769
  - darwin_galapagos_1835
  - humboldt_chimborazo_1802
  - mallory_everest_1924
  - scott_ross_ice_shelf_1912
  - wegener_greenland_1930
office:
  start_date: '2026-11-12'
  start_funds: 800
  start_energy: 0
  home_cost: 600
  weight_capacity: 20
  # an employee can wear implants up to this load; a piece takes its own load, the big ones more than one
  implant_load_cap: 2
  energy_per_change: 6
  max_plots: 2
  # Full reports are kept per place: the best result (most stars, then the newest) and the latest. The one line summaries of the trips (max_trips) are kept far longer and feed the log and the history of a place.
  keep_best: 2
  keep_latest: 10
  max_trips: 2000
  hire_cost: 100
  # the funds come only from selling antiques, and this scales what they sell for against the price on the card
  sale_scale: 3
  # Each employee earns a point for this many stars across their personal best results.
  stars_per_point: 30
  # Daily wages for everyone hired, idle or not. Each person costs base * (1 + step * (headcount - 1)), so the n-th hire adds base * (1 + step * (2n - 2)) per day.
  # Trips pay no cash. Antique sales cover the wages, and there is no fixed limit on staff.
  # A day that cannot be paid empties the funds and costs every employee unpaid_favor.
  wage: {base: 2.4, step: 0.5, unpaid_favor: -0.02}
  # archived reports are kept, up to this many, the oldest go first and their lines stay
  # The rest after a trip is the rest of its outcome plus rest_per_stay_day for each office day away, rounded up, so a long trip needs a long rest.
  rest_per_stay_day: 0.5
  # The secretary stays at the agency and lends the travellers one thing from each trait. attr adds to that attribute of every traveller the attribute
  # of the secretary divided by attr_divisor and rounded; sure holds the earliest missed guard point of a story, or wins its earliest fulfil point
  # if no fulfil point was won and no missed guard before it sends the traveller back.
  secretary: {attr_divisor: 5}
  max_archived_reports: 200
  # luck is a factor on the chances left to chance: base + per_point * luck, so one at luck 4, and no chance goes past max_chance
  luck: {base: 0.6, per_point: 0.1, max_chance: 0.95}
  # Adjust for repeat-find rarity, then round to grant_step funds before applying the secretary's bonus.
  market:
    period_days: 30
    amp: 0.3
    grant_step: 100
    rarity: {rare_chance: 0.05, common_chance: 0.30, max_adjustment: 25}
  fatal_outcomes: [near_death]
  # the share of the find chance at a star count, for a story with that many stars; a story has 3 stars unless its scene has more points
  # k is set so that a small agency left on the auto mode is stopped by a wage it cannot pay after some fifty days, sells an antique or two and then earns its way,
  # while a large one is stopped again and again: the wage grows with the headcount and the finds do not. Measured with tools/in_probe_economy.mjs idle team=N.
  antique_find: {star_share: {1: {0: 0.25, 1: 1}, 2: {0: 0.25, 1: 0.6, 2: 1}, 3: {0: 0.25, 1: 0.5, 2: 0.75, 3: 1}, 4: {0: 0.25, 1: 0.45, 2: 0.65, 3: 0.85, 4: 1}, 5: {0: 0.25, 1: 0.4, 2: 0.55, 3: 0.75, 4: 0.9, 5: 1}}, k: 1.2, cap: 0.8, tau_years: 120, tau_km: 2500, earth_km: 6371, modelled_place_boost: 12}
  # the places open at the start, besides the events marked start: some of the latest event of the catalogue, which reaches the farthest back, and some at random
  start_scenes: {newest: 0, random: 2}
  # the employees of the start: this many candidates from different regions are offered and the player picks some of them
  start_staff: {offer: 2, pick: 2}
  start_stock:
    ors_pack: 40
    chlorine_tablet: 40
    handbook: 1
# The founder is the player's own character, the 51st employee, who is hired from the start and cannot be let go. The player gives the name, the gender and the skin tone and spreads
# total points over the five attributes, each between min and max. The founder takes one of the places of the first crew, so the cost of wages at the start does not change.
founder:
  id: s_founder
  age: 30
  total: 22
  min: 1
  max: 10
  name_max: 24
  traits_max: 2
  default_gender: m
  default_skin: t3
  default_base: {wit: 4, constitution: 4, finesse: 4, will: 4, luck: 4}
# What is published. A simulated era whose model says `metadata.status: draft`, and a catalogue event that says `draft: true`, is left out of the game while drafts is false, so unfinished content can sit
# in the cards and be added step by step. The page shows drafts with ?devtools, and the tools always check them. See the task about the models for what finished means.
release:
  drafts: false
  # With ready_only, a story is in the game only when its event card says ready: true, and every other one is kept out as a draft:
  # no place on the map, no antique, not drawn for the start, no page in the wiki. A story is turned on when it is finished.
  # The developer mode, and ?drafts in the address, show them all.
  ready_only: true
  # the hook of a story, the one line that makes a reader want the rest, is at most this many characters in Chinese
  hook_max: 20
  # the pictures of a person: the kinds a file name may start with, the extensions, and the fields every picture must have in the card of the person
  images:
    kinds: [portrait, painting, scene, document, map]
    extensions: [jpg, png, webp, svg]
    fields: [title, author, year, source, license, credit]
clock:
  sec_per_day: 60
  speeds:
    - 0
    - 1
    - 2
    - 4
    - 8
    - 16
  # when the funds pay fewer than this many days of wages, the clock is held to the speed below, and an unpaid day stops it
  low_funds_days: 3
  # the pop-ups that stop the clock: only the ones the game forces open. A pop-up the player opens, a report, a page of the wiki, the settings, leaves the clock running.
  hold_modals: [welcome, broke]
  low_funds_speed: 4
favor:
  start: 0.5
  # the mood (favor in the code) changes every attribute by up to this share, up at full mood and down at none, so a trip is run on the attributes of that day
  buff: 0.2
  # a reward costs this many days of the wage of that person and gives this much mood
  gift_days: 1
  gift_gain: 0.1
  rest_recovery_per_day: 0.015
  min: 0
  max: 1
  outcome:
    perfect: 0.08
    legend: 0.1
    modest: 0.02
    stay_and_gifts: 0.05
    scramble: -0.05
    gave_up: -0.08
    near_death: -0.1
    # a guard point of a full model missed: the trip falls out of sync and the traveller is sent home
    desync: -0.05
auto:
  reserve_funds: 100
  wage_reserve_days: 14
  item_buy: {energy_share: 0.5}
  buy_target:
    ors_pack: 40
    chlorine_tablet: 40
  kit_order:
    - handbook
    - recall_charm
    - chlorine_tablet
    - ors_pack
ui:
  currency_icons: {funds: '💰', energy: '⚡', wage: '🧾', secretary: '📋'}
  tab_icons: {home: '🏠', buy: '🛒', shop: '🗂️'}
  tool_icons: {wiki: '📖', settings: '⚙️', about: 'ℹ️'}
  quote: {interval_min_s: 45, interval_max_s: 150, fade_ms: 600}
  # The settlement at the head of a report: its rows come in one after another, step_ms apart, each taking item_ms, and after a pause the echo comes in over echo_ms.
  # A report opened again, or a reader who asks for less motion, sees it all at once.
  settle: {step_ms: 320, item_ms: 380, echo_pause_ms: 500, echo_ms: 1100}
  refresh_ms: 500
  staff_status_max_days: 7
  # a return shows a note this many seconds before it fades; the reports wait on the home page
  toast_seconds: 8
  timeline_max: 9
  # the record of an employee shows this many trips at first, the weightiest: a redeemed regret first, then the share of the stars won, then the year
  record_top: 5
  # the body of the traveller through the stay as LM reads it, its own part of the report: always, dev for the developer mode only, or never
  report_body: dev
  recent_reports: 8
  search_delay_ms: 30
  # every list shows a page of rows, the first size by default, and the player can pick a longer one
  page_sizes: [5, 10, 20, 50]
  box_h: {story: 300, pick_staff: 520, carry: 200, plots: 170}
  chart: {w: 520, h: 170, margin_l: 36, margin_r: 10, margin_t: 10, margin_b: 22, y_lines: 4, x_labels: 8, headroom: 1.1, max_points: 200, body_colors: ['#b3382c', '#2f4f6f', '#8a6a1f', '#5a7f3a', '#7a4f8a', '#3a7f7f', '#8a8272', '#c2622d', '#3f6fb3', '#a3477a'], body_min_max: 0.05}
  tooltip: {offset: 14, edge: 4}
  timeline: {w: 600, h: 70, pad: 30, y: 36, tick_half: 4, line_ext: 20}
# The echo: a line the historical person is recorded to have said, picked by how the trip went and shown at the settlement and on the share card.
# A trip falls in one tier: desync when a guard point was missed, full when every star was won, most above most_share of them, some with any star, none otherwise.
# A person card without a line of that tier takes the first tier of its fallback that has one. See 5.15 of the story outline.
echo:
  tiers: [full, most, some, none, desync]
  most_share: 0.5
  fallback:
    full: [most, some, none]
    most: [some, none, full]
    some: [none, most, full]
    none: [desync, some, most, full]
    desync: [none, some, most, full]
stars:
  # a scene has as many stars as sync points, and the counts the tables below know
  max: 3
  # a story has one to five stars by its weight: a light one one or two, a middling one three, a heavy one four or five
  counts: [1, 2, 3, 4, 5]
  energy_base: {broad_street_1854: 60, vienna_1847: 80, scutari_1855: 80, finlay_havana_1881: 80, jenner_berkeley_1796: 80, seacole_balaklava_1855: 80, sun_yat_sen_1924: 80, tupaia_tahiti_1769: 80, darwin_galapagos_1835: 80, humboldt_chimborazo_1802: 80, mallory_everest_1924: 80, scott_ross_ice_shelf_1912: 80, wegener_greenland_1930: 80}
  # the share of the base paid in total at a star count, so each star above the best pays the difference
  energy_share: {1: {0: 0, 1: 1}, 2: {0: 0, 1: 0.4, 2: 1}, 3: {0: 0, 1: 0.25, 2: 0.5, 3: 1}, 4: {0: 0, 1: 0.2, 2: 0.4, 3: 0.65, 4: 1}, 5: {0: 0, 1: 0.15, 2: 0.3, 3: 0.5, 4: 0.75, 5: 1}}
# The stamp on a report, from how the trip came back, the stars won, and whether the branch differs from the main timeline.
# returns maps an ending of a model to a way of coming back: normal, early or rough; a recall is early and an evacuation rough.
# changed gives a kinder stamp where no star was won but the branch still came out different by more than changed_margin.
stamp:
  default_return: normal
  returns: {gave_up: early, near_death: rough, scramble: rough, desync: early}
  recalled: early
  evacuated: rough
  changed_margin: 0.5
  changed: {normal_none: normal_none_changed, early_none: early_none_changed}
  # saying picks the group of the sayings of the employee card a stamp calls for: full, part, none, or rough for a trip that came back hurt.
  # A stamp with no star but a changed branch counts as part, since something was left behind.
  saying:
    normal_full: full
    normal_part: part
    normal_none_changed: part
    normal_none: none
    early_full: full
    early_part: part
    early_none_changed: part
    early_none: none
    rough_full: rough
    rough_part: rough
    rough_none: rough
travel:
  max_office_days: 7
  history_days_per_office_day: 30
  # The crossing is not exact. A trip arrives up to a share of its stay before or after the planned day, drawn from the seed of the trip, at least min_days
  # and at most max_days, so a short story is not missed and a long one is not thrown off by weeks. A model may set its own in metadata.era.drift
  # as {early, late} in historical days. A trip never arrives before day 0 of its model.
  drift: {share: 0.1, min_days: 1, max_days: 10}
light:
  stay_by_tier: {1: 4, 2: 6, 3: 7}
  difficulty: {base: 0.32, per_tier: 0.1}
  noise: 0.25
  # the three points of a small story are reached, met and made a mark, each at a margin of the traveller against the event
  cuts: {reach: -0.1, meet: 0.08, impress: 0.2}
  kinds: [endure, persuade, trust]
  pay: {1: {energy: 4}, 2: {energy: 8}, 3: {energy: 16}}
  # desync: a guard point was missed and the traveller was sent back early
  rest_days: {success: 2, partial: 2, missed: 3, desync: 4}
  favor: {success: 0.03, partial: 0.01, missed: -0.03, desync: -0.05}
  field_weights:
    science: {"wit": 0.8, "finesse": 0.2}
    technology: {"wit": 0.8, "constitution": 0.2}
    literature: {"finesse": 0.5, "wit": 0.5}
    math: {"wit": 0.9, "will": 0.1}
    medicine: {"wit": 0.6, "constitution": 0.2, "will": 0.2}
    thought: {"finesse": 0.6, "wit": 0.4}
    architecture: {"wit": 0.6, "constitution": 0.4}
    philosophy: {"finesse": 0.5, "wit": 0.5}
    art: {"wit": 0.4, "finesse": 0.4, "will": 0.2}
    exploration: {"constitution": 0.5, "wit": 0.3, "will": 0.2}
    music: {"wit": 0.4, "finesse": 0.6}
scene:
  # the three sync points sit at these shares of the stay, so a point is met on the attributes of that day, not of the start
  point_share: {1: [0.6], 2: [0.4, 0.8], 3: [0.25, 0.55, 0.85], 4: [0.2, 0.4, 0.65, 0.9], 5: [0.15, 0.3, 0.5, 0.7, 0.9]}
  suspicion_by_tier: {1: 0.6, 2: 0.8, 3: 1.2}
  max_discovery: 0.9
  # a scene that has been found out: how, the star cost, the days of rest, the favor lost, and whether the antique is lost
  found:
    reject: {at: 0.6, stars_cost: 1, rest_days: 1, favor: -0.03, keep_antique: true}
    jail: {at: 0.9, stars_cost: 3, rest_days: 4, favor: -0.05, keep_antique: false}
    hunted: {at: 1.01, stars_cost: 3, rest_days: 8, favor: -0.15, keep_antique: false}
engine:
  mc_seed_stride: 7919
  seed_max: 100000
  report_hints: 2
tools:
  probe_seeds:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
settings:
  storage_key: teleporter_settings
  defaults:
    theme: auto
    music_volume: 0.5
    sfx_volume: 0.6
    music_autostart: true
    pause_on_report: false
    map_daynight: true
  options:
    theme: [auto, light, dark]
share:
  file_name: the_past_is_yet_to_come_share.png
  home_file_name: the_past_is_yet_to_come_home.png
  # the card tells the trip from its record: the lines that won a star, the lines written for this employee, then the lines of history by importance, at most this many, in time order
  record_lines: 6
  # The portrait card fits its text up to a 4:5 height limit.
  colors: {bg: '#f1e8d4', ink: '#2b241b', ink2: '#6b5f4d', stamp: '#b3382c', line: '#cdbf9f', qr_bg: '#f8f2e3', echo_bg: '#f9f1df', echo_line: '#c9b28c'}
  canvas: {w: 1080, min_h: 1100, home_min_h: 760, max_h: 1350, pad: 68, border: 6, qr_size: 156, qr_quiet: 4, logo_px: 104, title_px: 49, description_px: 27, event_px: 46, body_px: 33, small_px: 25, line_gap: 1.29, echo_px: 70, echo_min_px: 49}
# The pressure channels of the events, and how they reach the body of the traveller (design: game_事件系统设计 sections 3 and 4 in the home folder).
# Every number here is an uncalibrated starting value. When the traveller core is connected, the levels are tuned in a batch simulation until a traveller with all attributes 4,
# no trait and no gear ends a stay with the main readout near target_readout at level 1, 2 and 3.
channels:
  target_readout: {1: 0.2, 2: 0.45, 3: 0.75}
  # what a day is without any pressure, the handle values the coordinator writes when no channel asks for anything else
  baseline: {fluid_intake: 2.0, activity_load: 60, sleep_duration: 8, psychological_demand: 0.2, injury_exposure: 0.05}
  # two channels that ask for the same handle: the value farthest from the baseline wins for a level handle, the extra above the baseline adds up for a total handle, a context takes the largest
  merge: {level: farthest, total: sum_extra, context: max}
  # the day of the stay on which the effect of a channel is felt in full; before it the effect rises in a straight line from the baseline
  ramp_days: 1
  list:
    W: {pushes: [infection_burden], context: {pathogen_exposure: {1: 0.15, 2: 0.3, 3: 0.5}}}
    E: {pushes: [infection_burden], context: {pathogen_exposure: {1: 0.2, 2: 0.45, 3: 0.75}}}
    H: {pushes: [hydration_deficit, fatigue], level: {activity_load: {1: 90, 2: 120, 3: 150}}, total: {fluid_intake: {1: 1.6, 2: 1.2, 3: 0.8}}}
    C: {pushes: [energy_deficit, fatigue], level: {activity_load: {1: 90, 2: 120, 3: 150}, sleep_duration: {1: 7.5, 2: 7, 3: 6.5}}}
    A: {pushes: [oxygen_deficit, fatigue], level: {activity_load: {1: 80, 2: 100, 3: 120}}}
    L: {pushes: [injury_burden, mobility_loss], level: {activity_load: {1: 120, 2: 180, 3: 240}, injury_exposure: {1: 0.15, 2: 0.3, 3: 0.5}}}
    V: {pushes: [fatigue, psychological_strain], level: {sleep_duration: {1: 6, 2: 4.5, 3: 3}, psychological_demand: {1: 0.3, 2: 0.4, 3: 0.5}}}
    G: {pushes: [psychological_strain, loneliness], level: {psychological_demand: {1: 0.4, 2: 0.6, 3: 0.8}, sleep_duration: {1: 7.5, 2: 7, 3: 6.5}}}
    S: {pushes: [psychological_strain, social_recognition], level: {psychological_demand: {1: 0.35, 2: 0.55, 3: 0.75}}}
    Y: {pushes: [energy_deficit, nutrient_deficit], level: {activity_load: {1: 80, 2: 100, 3: 120}}}
    T: {pushes: [injury_burden, oxygen_deficit], level: {injury_exposure: {1: 0.2, 2: 0.4, 3: 0.7}}, context: {pathogen_exposure: {1: 0.05, 2: 0.1, 3: 0.15}}}
  # most channels an event may name, and the levels a channel may have
  per_event_max: 3
  levels: [1, 2, 3]
  # channels switched off for now: the event cards keep them, but the stay ignores them until the core can move the body for them (see the task file of the event system, T4b)
  off: [A, L, T]
  # items lower the effective level of the channel they name by item_levels each, and all the items together lower one channel by at most item_cap levels, so a level 3 channel cannot be cleared with items alone
  # a piece of gear that names the channel lowers it by gear_levels, outside the cap of the items, so the third level can be cleared with items, gear and traits together
  relief: {item_levels: 1, item_cap: 2, gear_levels: 1, floor: 0}
  # how many items should work against a channel; a channel with fewer is only warned about, because not every channel has that many in a believable kit
  min_items: 2
  # a trait lowers the effective level of a channel by the number in its resist field, summed over the traits of the employee; the trait cards carry that field, a channel they do not name is not touched
  trait_resist: {field: resist}
# The body factor: the attribute of the day is the card value times (1 - k times the reading that carries it). The carrier of an attribute is the largest of the readings listed.
# loneliness has no provider in the core, the game computes it from social contact.
body:
  k: 0.3
  carriers:
    wit: [fatigue, psychological_strain]
    constitution: [infection_burden, hydration_deficit, energy_deficit]
    finesse: [injury_burden, mobility_loss]
    will: [psychological_strain, loneliness]
  # whether the stay is stepped through the body of the traveller at all. Off, a scene is met on the attributes of the card, as it was before the body; on, on the attributes of the day.
  enabled: true
  # minutes of the step the coordinator gives the core, one day
  step_minutes: 1440
  # Health is checked at most one historical week apart and at every scene objective.
  check_days: 7
  # The general defence against pressure is an attribute of the traveller, the attributes after the items: each channel is felt at 1 - per_point times (attribute - ref) of its pull on the handles and its context,
  # between min and max. Bodily channels are met with the constitution, grief and hostility with the will. Traits and the kit take whole levels off a channel on top of it.
  resist: {attr: constitution, by_channel: {G: will, S: will}, ref: 5, per_point: 0.08, min: 0.4, max: 1.3}
  # the readout at which the traveller cannot go on is the incapacity threshold times base + per_point times the attribute
  resilience: {attr: constitution, base: 0.75, per_point: 0.05}
  # Evacuation thresholds are game balance values for LM's normalized readouts.
  incapacity: {readouts: [injury_burden, mobility_loss, infection_burden, hydration_deficit, energy_deficit, psychological_strain], at: 0.9, infection_at: 0.014, rest_days: 3}
  # what the result of a point writes back for the days after it, added to the pressure of the channels as an event source and fading by decay each day
  feedback: {miss: {psychological_demand: 0.1}, hit: {psychological_demand: -0.05}, decay: 0.5}
  # loneliness has no provider in the core, so the game raises it by this much per level of the grief channel each day, and it never falls inside a stay
  loneliness: {per_level_day: 0.05}
