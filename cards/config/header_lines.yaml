      zh: "尹东柱《数星星的夜》"
      zh-Hant: "尹東柱《數星星的夜》"
      fr: "Yun Dong-ju, Nuit à compter les étoiles"
      es: "Yun Dong-ju, Noche de contar estrellas"
      ja: "尹東柱「星を数える夜」"
      ko: "윤동주, 「별 헤는 밤」"
  camoes:
