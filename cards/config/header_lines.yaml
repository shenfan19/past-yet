      zh-Hant: "卡蒙斯《十四行詩》"
      fr: "Luís de Camões, Sonnets"
      es: "Luís de Camões, Sonetos"
      ja: "ルイス・デ・カモンイス「ソネット」"
      ko: "루이스 드 카몽이스, 「소네트」"
lines:
  upstream:
    source: jianjia
    text:
      en: "I follow upstream, where the path is steep and rough."
      zh: "溯洄从之，道阻且跻。"
      zh-Hant: "溯洄從之，道阻且躋。"
      fr: "Je remonte le courant, par un chemin raide et difficile."
      es: "Remonto el río por un camino áspero y empinado."
      ja: "流れをさかのぼって追う。道は険しく、登り坂。"
      ko: "물길을 거슬러 그대를 좇으니, 길은 험하고 가파르다."
  downstream:
    source: jianjia
    text:
      en: "I follow downstream. There you seem to be, on an islet in the river."
      zh: "溯游从之，宛在水中坻。"
      zh-Hant: "溯游從之，宛在水中坻。"
      fr: "Je descends le courant. Tu sembles être là, sur un îlot."
      es: "Sigo la corriente. Pareces estar allí, en un islote del río."
      ja: "流れに沿って追う。あなたは川の中州にいるようだ。"
      ko: "물길을 따라 그대를 좇으니, 강 한가운데 작은 섬에 있는 듯하다."
  been_here:
    source: sudden_light
    text:
      en: "I have been here before, but when or how I cannot tell."
      zh: "我曾来过这里，却说不清何时，又是怎么来的。"
      zh-Hant: "我曾來過這裡，卻說不清何時，又是怎麼來的。"
      fr: "Je suis déjà venu ici, mais quand ni comment, je ne saurais le dire."
      es: "Ya estuve aquí, pero no sabría decir cuándo ni cómo."
      ja: "ここへは前に来たことがある。いつ、どうやって来たのかはわからない。"
      ko: "전에 이곳에 와 본 적이 있다. 언제 어떻게 왔는지는 모르겠다."
  village_smoke:
    source: les_regrets
    text:
      en: "When will I see smoke rise from the chimney of my little village again?"
      zh: "几时能再看见故乡小村的炊烟？"
      zh-Hant: "幾時能再看見故鄉小村的炊煙？"
      fr: "Quand reverrai-je, hélas, de mon petit village fumer la cheminée ?"
      es: "¿Cuándo volveré a ver humear la chimenea de mi pueblecito?"
      ja: "いつまた、あの小さな村の煙突から煙がのぼるのを見られるだろう。"
      ko: "언제 다시 내 작은 마을의 굴뚝에서 연기 오르는 모습을 볼 수 있을까."
  swallows:
    source: rima_liii
    text:
      en: "The dark swallows will return to hang their nests on your balcony."
      zh: "黑燕还会飞回来，把巢筑在你的阳台上。"
      zh-Hant: "黑燕還會飛回來，把巢築在你的陽臺上。"
      fr: "Les hirondelles sombres reviendront suspendre leurs nids à ton balcon."
      es: "Volverán las oscuras golondrinas en tu balcón sus nidos a colgar."
      ja: "黒いツバメが帰ってきて、あなたのバルコニーに巣をかける。"
      ko: "검은 제비들이 돌아와 그대의 발코니에 둥지를 틀리라."
  rapeseed:
    source: buson
    text:
      en: "Rapeseed blossoms. Moon in the east, sun in the west."
      zh: "油菜花开，月在东，日在西。"
      zh-Hant: "油菜花開，月在東，日在西。"
      fr: "Colza en fleurs. La lune à l’est, le soleil à l’ouest."
      es: "Colza en flor. La luna al este, el sol al oeste."
      ja: "菜の花や月は東に日は西に"
      ko: "유채꽃이 피고, 달은 동쪽에 해는 서쪽에."
  stars:
    source: counting_stars
    text:
      en: "One star for a memory, one for love."
      zh: "一颗星里有回忆，一颗星里有爱。"
      zh-Hant: "一顆星裡有回憶，一顆星裡有愛。"
      fr: "À une étoile, un souvenir. À une autre, un amour."
      es: "Un recuerdo en una estrella, un amor en otra."
      ja: "星ひとつに思い出を、星ひとつに愛を。"
      ko: "별 하나에 추억과, 별 하나에 사랑과"
  green_mantle:
    source: camoes
    text:
      pt: "O tempo cobre o chão de verde manto, que já coberto foi de neve fria."
      en: "Time lays a green cloak on ground once covered in cold snow."
      zh: "时光给大地披上绿衣，那里从前覆着寒雪。"
      zh-Hant: "時光給大地披上綠衣，那裡從前覆著寒雪。"
      fr: "Le temps revêt de vert la terre autrefois couverte de neige."
      es: "El tiempo viste de verde la tierra que antes cubría la nieve."
      ja: "時は、かつて冷たい雪に覆われた地に緑の衣をかける。"
      ko: "시간은 차가운 눈이 덮였던 땅에 푸른 옷을 입힌다."
  road_home:
    text:
      en: "On the old map, the road home is still there."
      zh: "旧地图上，那条回家的路还在。"
      zh-Hant: "舊地圖上，那條回家的路還在。"
      fr: "Sur la vieille carte, le chemin du retour est toujours là."
      es: "En el mapa antiguo aún está el camino de vuelta a casa."
      ja: "古い地図には、家へ帰る道がまだ残っている。"
      ko: "오래된 지도에는 집으로 가는 길이 아직 남아 있다."
  afternoon_light:
    text:
      en: "The house number changed. The afternoon light still falls in the same place."
      zh: "门牌换了，下午的光还是落在原来的地方。"
      zh-Hant: "門牌換了，下午的光還是落在原來的地方。"
      fr: "Le numéro a changé. La lumière de l’après-midi tombe toujours au même endroit."
      es: "Cambió el número de la casa. La luz de la tarde sigue cayendo en el mismo sitio."
      ja: "番地は変わった。午後の光は今も同じ場所に差す。"
      ko: "문패의 번호는 바뀌었지만, 오후 햇살은 여전히 같은 곳에 내린다."
  next_stop:
    text:
      en: "Next stop: a long time ago."
      zh: "下一站，是很久以前。"
      zh-Hant: "下一站，是很久以前。"
      fr: "Prochain arrêt : il y a longtemps."
      es: "Próxima parada: hace mucho tiempo."
      ja: "次は、ずっと昔です。"
      ko: "다음 정거장은 아주 오래전입니다."
