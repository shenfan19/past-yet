      fr: "Joachim du Bellay, Les Regrets"
      es: "Joachim du Bellay, Los pesares"
      ja: "ジョアシャン・デュ・ベレー『哀惜詩集』"
      ko: "조아생 뒤 벨레, 『회한』"
