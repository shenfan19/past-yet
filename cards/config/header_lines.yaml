      fr: "Gustavo Adolfo Bécquer, Rime LIII"
      es: "Gustavo Adolfo Bécquer, Rima LIII"
      ja: "G・A・ベッケル『詩集』第53篇"
      ko: "구스타보 아돌포 베케르, 「시 제53편」"
  buson:
