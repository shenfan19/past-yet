view:
  lon_min: -180
  lon_max: 180
  lat_min: -58
  lat_max: 84
  grid_step: 30
zoom:
  min: 1
  max: 40
  step: 1.25
  drag_px: 4
  label_z: 6
axis:
  from: -5000
  to: 2000
  tick_count: 6
  min_span: 20
  ticks:
    - -4000
    - -3000
    - -2000
    - -1000
    - 1
    - 500
    - 1000
    - 1500
    - 1800
    - 2000
  min_ticks: 3
group_radius: 6
calendar:
  ad_prefix_below: 1000
daynight:
  # the shade of the night on the map: the sun is above the longitude that turns once per game day, and its height over the equator swings through the year
  tilt_deg: 23.44
  year_days: 365
  step_deg: 3
  min_decl_deg: 0.5
  # above this speed the shade stops following the clock, so that it never turns so fast that it tires the eye
  speed_cap: 4
