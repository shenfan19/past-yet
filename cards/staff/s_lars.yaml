text:
  en:
    name: Lars Nilsson
    job: Shipwright
    bio: Builds things to last and does not like to be hurried.
    story: Lars learned boatbuilding from his uncle on an island in the Stockholm archipelago, and has spent more than thirty years planing oak and pine into hulls that outlast their owners. He measures twice, then waits a day before cutting, which has cost him a few customers and won him many more. Once he refused to launch a boat a day early for an impatient buyer, and a storm that afternoon proved him right. Winter evenings he carves small wooden ducks for the village children. He hopes to build one last boat for himself, no bigger than a rowing skiff, before his hands grow slow.
  zh:
    name: 拉尔斯·尼尔森
    job: 造船匠
    bio: 做东西要做得结实，最不喜欢被人催。
    story: 拉尔斯在斯德哥尔摩群岛的一座小岛上跟叔叔学造船，三十多年来把橡木和松木刨成一条条比主人还长寿的船身。他量两遍尺寸，下刀前还要再等一天，这让他丢过几个客人，却留住了更多。有一次买主催他提前一天下水，他没答应，当天下午果然来了风暴。冬天的晚上，他给村里的孩子刻小木鸭。他想在手变慢之前，给自己造最后一条船，不用大，一条划艇就好。
