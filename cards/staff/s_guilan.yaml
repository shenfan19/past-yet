text:
  en:
    name: Li Guilan
    job: Villager
    bio: Sichuan villager who feeds anyone at her door and will not be talked out of anything.
    story: Guilan has lived all her life in the same hill village in Sichuan, raising pigs, peppers and three children, two of whom now work in far cities. She never went past third grade but keeps every letter they send in a biscuit tin. Any stranger passing the gate gets a bowl of noodles whether they want one or not. When the young ones tell her to move to the city, she says her pepper plants would miss her. Her knees are bad and the path to the well is steep, yet she still walks it every morning.
  zh:
    name: 李桂兰
    job: 村民
    bio: 四川山村里的老人，谁到门口都要请吃饭，认定的事谁也劝不动。
    story: 桂兰一辈子住在四川的同一个山村里，养猪，种辣椒，拉扯大三个孩子，其中两个如今在很远的城市打工。她只念到三年级，却把孩子们寄来的信都收在一只饼干盒里。路过院门的陌生人，她不管人家要不要，都先盛上一碗面。年轻人劝她搬去城里，她说辣椒苗会想她。她膝盖不好，去井边的路又陡，可每天早晨照样走一趟。
