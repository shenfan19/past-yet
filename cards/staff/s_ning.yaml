text:
  en:
    name: Xiaoyu Ning
    job: Nurse
    bio: Used to be a nurse. Stubborn, cannot bear to see a patient with nobody looking after them.
    story: Xiaoyu worked eight years on the night shift of a busy city hospital ward, the kind where beds line the corridor. She learned to read a patient's fear from how they hold the blanket. An old man with no family once waited for her every evening to help him finish his rice, and she kept doing it after her shift ended. She left nursing last year, worn out but not at peace with it, and still checks on strangers waiting alone in hospital halls. Her quiet wish is a job where she can sit with people long enough to hear their story to the end.
  zh:
    name: 宁晓雨
    job: 护士
    bio: 做过护士，认死理，见不得病人没人管。
    story: 晓雨在一家繁忙的城市医院病房上了八年夜班，那种走廊里都加着床的病房。她学会了从病人抓被角的样子看出他们的害怕。有位没有家人的老先生，每天傍晚都等她来帮他把饭吃完，她下班后也还是去。去年她离开了护士岗位，人累垮了，心里却放不下，在医院走廊里遇到独自等着的人，还是忍不住上前问一句。她心里的愿望是找一份能坐下来陪人把话说完的工作。
