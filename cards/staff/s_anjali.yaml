text:
  en:
    name: Anjali Nair
    job: Accountant
    bio: Accountant from Mumbai who will not let a number go until it adds up.
    story: Anjali grew up in a Malayali family in Thane and took the suburban train into Mumbai every morning for eleven years, first to college, then to a small firm that audits neighbourhood shops. She once spent three nights finding a missing four hundred rupees in a grocer's books, because she knew it would be his daughter's school fees. Her mother keeps asking when she will marry. Anjali says after the quarter closes, and the quarter never closes. What she really wants is a window seat in a quiet office with a plant on the sill.
  zh:
    name: 安佳莉·奈尔
    job: 会计
    bio: 孟买的会计，账目不平就不肯放手。
    story: 安佳莉出身于塔内的一个马拉雅利人家庭，十一年来每天清晨挤郊区火车去孟买，先是上大学，后来去了一家替街坊小店做审计的小事务所。有一回她为了替一位杂货店老板找出短缺的四百卢比，连熬了三个晚上，因为她知道那笔钱多半是他女儿的学费。母亲总问她什么时候结婚，她总说等这个季度结完，可季度从来结不完。她心里真正想要的，是一间安静的办公室，靠窗，窗台上放一盆绿植。
