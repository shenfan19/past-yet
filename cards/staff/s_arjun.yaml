text:
  en:
    name: Arjun Malhotra
    job: Engineering student
    bio: Delhi engineering student, quick with ideas and easily bored by finishing them.
    story: Arjun is in his third year of electronics at a Delhi college and has built a robot arm from scrap that waves at anyone who walks past the hostel. He once climbed onto the roof of a lecture hall to fix a loudspeaker, and nobody has let him forget it. His marks are fine but his projects sit half done in a shared drawer. His father runs a hardware shop in Karol Bagh and wants him to take it over someday. Arjun has not yet found the courage to say he wants to build things nobody has asked for.
  zh:
    name: 阿尔琼·马尔霍特拉
    job: 工科学生
    bio: 德里的工科学生，点子来得快，做到一半就容易厌倦。
    story: 阿尔琼在德里一所学院读电子专业大三，用废料拼出一只机械臂，宿舍楼下有人经过它就挥手。他曾经爬上教学楼楼顶去修一只喇叭，到现在同学还拿这事打趣。他成绩尚可，可手上的项目大多只做到一半，躺在公用抽屉里。父亲在卡罗尔巴格开五金店，盼他将来接手。阿尔琼还没鼓起勇气告诉父亲，自己想做的是那些没人要求过的东西。
