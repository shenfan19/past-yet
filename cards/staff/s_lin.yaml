text:
  en:
    name: Zhiyao Lin
    ethnicity: Han
    jobs: [Graduate student, Tutor]
    bio: Reads a lot, wants to understand everything, gets homesick first.
    story: Zhiyao grew up in a small city in Hunan where her mother kept the books for a shoe shop. She was the first in the family to go to university, and her mind is the sharpest in her seminar, but her body is not. The northern winter air hurts her throat, she catches every cold in the dormitory, and she drops the recorder and the cups in the lab. To pay rent she tutors schoolchildren in the evening. She calls home and talks about nothing much, the neighbours, the price of pork, the cat. She would like to finish her thesis on how dialects fade, and then record her grandmother telling stories in the old speech.
  zh:
    name: 林知遥
    ethnicity: 汉族
    jobs: [研究生, 家教]
    bio: 读过很多书，什么都想弄明白，想家想得最早。
    story: 知遥在湖南的一座小城长大，母亲在一家鞋店里记账。她是家里第一个上大学的人，在课堂上脑子是最快的，身体却跟不上。北方冬天的空气刮得她嗓子疼，宿舍里的感冒她一个不落，实验室里的录音笔和杯子也总被她失手摔掉。为了付房租，她晚上给中小学生做家教。她常给家里打电话，聊些没什么要紧的事，邻居、猪肉的价钱、家里的猫。她想写完那篇关于方言怎样慢慢消失的论文，然后把外婆用老话讲故事的声音录下来。
