text:
  en:
    name: Zhiyao Lin
    job: Graduate student
    bio: Reads a lot, wants to understand everything, gets homesick first.
    story: Zhiyao grew up in a small city in Hunan where her mother kept the books for a shoe shop. She was the first in the family to go to university, and now studies linguistics in a northern city where the winter air hurts her throat. She reads in the library until closing, then calls home and talks about nothing much, the neighbours, the price of pork, the cat. Last month she finally stopped apologising for missing the food. She would like to finish her thesis on how dialects fade, and then record her grandmother telling stories in the old speech.
  zh:
    name: 林知遥
    job: 研究生
    bio: 读过很多书，什么都想弄明白，想家想得最早。
    story: 知遥在湖南的一座小城长大，母亲在一家鞋店里记账。她是家里第一个上大学的人，如今在北方一座城市读语言学，冬天的空气刮得嗓子疼。她常在图书馆读到闭馆，再给家里打电话，聊些没什么要紧的事，邻居、猪肉的价钱、家里的猫。上个月她终于不再为想念家乡的饭菜而不好意思。她想写完那篇关于方言怎样慢慢消失的论文，然后把外婆用老话讲故事的声音录下来。
