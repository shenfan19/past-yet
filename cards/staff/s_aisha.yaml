text:
  en:
    name: Aisha Benali
    ethnicity: Amazigh
    jobs: [Tour Guide, Shop Assistant]
    bio: Walks visitors through the Marrakesh medina and can talk her way into any price, or out of any corner.
    story: Aisha learned the alleys of the medina as a child, running errands for her uncle's lamp shop, and she still works there on the days without a tour. She is frail, and the dust and the heat leave her in bed a few days every month. She has little staying power, and she has begun classical Arabic lessons three times and dropped them three times. Her tongue and her quick hands carry her through, and she has French, English and some Spanish from the people she guides. Luck follows her around, and a visitor once paid a whole season of her rent for a tour that ran late. She does not always tell the truth about prices, and she knows it.
    sayings:
      full: ["I halved the price, and they poured me mint tea for it."]
      part: ["Half the doors opened. The other half get my best smile next time."]
      none: ["That one doesn't count. Call it a free sample tour."]
      rough: ["The heat dropped me again, right next to a man selling water. Lucky."]
  zh:
    name: 艾莎·本阿里
    ethnicity: 阿马齐格族
    jobs: [导游, 店员]
    bio: 带游客穿行马拉喀什老城，嘴上功夫好，价钱和窘境都能说得过去。
    story: 艾莎小时候替叔叔的灯具铺跑腿，把老城的小巷摸得很熟，没有团要带的日子她仍在那间铺子里帮忙。她身体弱，灰尘和热浪每个月总有几天把她撂倒在床上。她没有恒心，古典阿拉伯语的课报了三次，也放弃了三次。靠着一张会说的嘴和一双利落的手，她样样都能混过去，法语、英语和一点西班牙语都是从客人那里学来的。运气也一直护着她，有位客人为一趟拖晚了的行程，一次付清了她整整一季的房租。报价时她不总说实话，自己心里清楚。
    sayings:
      full: ["价钱我砍了一半，对方还请我喝了一壶薄荷茶。"]
      part: ["一半的门开了，另一半，下回我带着最好看的笑去敲。"]
      none: ["这趟不算，就当是免费试游。"]
      rough: ["热浪又把我撂倒了，好在倒下的地方正好有人卖水。"]
