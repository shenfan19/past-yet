text:
  en:
    name: Aisha Benali
    job: Tour Guide
    bio: Walks visitors through the Marrakesh medina and can talk her way into any price, or out of any corner.
    story: Aisha learned the alleys of the medina as a child, running errands for her uncle's lamp shop, and by sixteen she could tell where a stranger came from just by how they held their map. She picked up French, English and a little Spanish from the people she guided, and she is never short of a story, though she admits the stories get better every season. She does not always tell the whole truth about prices, and she knows it. What she really wants is to read the old manuscripts kept in a library near the Ben Youssef school, which she has only ever seen from outside. She has been saving for lessons in classical Arabic, one tip at a time.
  zh:
    name: 艾莎·本阿里
    job: 导游
    bio: 带游客穿行马拉喀什老城，嘴上功夫好，价钱和窘境都能说得过去。
    story: 艾莎小时候替叔叔的灯具铺跑腿，把老城的小巷摸得比自己的手掌还熟，十六岁时只看对方怎么拿地图，就能猜出是哪国人。法语、英语和一点西班牙语，都是从她带过的客人嘴里学来的。她总有讲不完的故事，只是承认每过一季，故事就更精彩一些。报价的时候她不总说实话，自己心里也清楚。她真正想做的，是去读本优素福学院附近那家图书馆里的旧手稿，那些书她至今只在门外望过。她正一笔一笔攒小费，打算报一门古典阿拉伯语的课。
