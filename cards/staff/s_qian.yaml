text:
  en:
    name: Shouren Qian
    job: Antique dealer
    bio: Used to trade in second hand goods. Sharp eyes, knows what anything is worth at a glance.
    story: Shouren grew up beside the old second hand market in Tianjin, where his father sold bicycles and radios from a cloth on the ground. He learned prices before he learned to read, by watching which buyers lingered. For thirty years he bought, mended and sold what other people threw out, and he can tell a copy from the real thing by the weight in his palm. He once returned a jade bracelet to a seller who did not know its worth, and lost money on purpose. Now he dreams of a small shop with no haggling, where every item has a fair price written on a card.
  zh:
    name: 钱守仁
    job: 旧货商
    bio: 倒腾过旧货，眼睛毒，什么东西值几个钱一眼就知道。
    story: 守仁在天津的旧货市场边长大，父亲把自行车和收音机摆在地上的一块布上卖。他没识字就先学会了看价，靠的是看哪些买主在摊前多停了一会儿。三十年里他收、修、卖别人扔掉的东西，一上手掂分量，就知道是真货还是仿的。有一回他把一只玉镯还给不懂行的卖主，自己白白亏了钱。如今他梦想开一间不讲价的小铺，每样东西都有一张卡片，写着公道的价钱。
