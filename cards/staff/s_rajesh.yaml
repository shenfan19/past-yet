text:
  en:
    name: Rajesh Yadav
    job: Farmer
    bio: Wheat and sugarcane farmer from Uttar Pradesh, strong and slow to change his mind.
    story: Rajesh has farmed four acres outside a village near Azamgarh since his father's knees gave out when he was nineteen. He has outlasted two droughts and one flood, and he once walked into the district office alone to argue about a canal gate that never opened. He lost that argument but the gate was repaired the next spring. He reads slowly and does sums in his head faster than the shopkeeper. His son is in Lucknow studying for exams, and Rajesh quietly hopes the boy will come home one day, but will never say so.
  zh:
    name: 拉杰什·亚达夫
    job: 农民
    bio: 北方邦种小麦和甘蔗的农民，力气大，认准的事很难回头。
    story: 拉杰什十九岁那年父亲的膝盖不行了，他便接手了阿扎姆格尔附近村子里的四亩地。这些年他熬过两次旱灾和一次洪水，还曾独自走进县办公室，为一座始终打不开的水渠闸门同官员争执。那场争执他输了，可第二年春天闸门竟然修好了。他认字慢，心算却比店主还快。儿子在勒克瑙备考，他心里盼着孩子有一天回来，嘴上却一个字也不提。
