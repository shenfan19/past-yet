text:
  en:
    name: Meera Banerjee
    job: Translator
    bio: Kolkata translator between Bengali, Hindi and English, who feels every word she carries over.
    story: Meera translates novels and the occasional legal letter from her flat near College Street, with a pot of tea going cold beside the dictionary. She once spent a week on a single line of a poem because no English word held its smell of rain on tin roofs. Loud rooms tire her and a harsh email can ruin her afternoon. Her father taught her to read in three alphabets before she was ten. She wishes more people could hear the old Bengali songs the way they sounded in his voice.
  zh:
    name: 米拉·班纳吉
    job: 翻译
    bio: 加尔各答的翻译，在孟加拉语、印地语和英语之间摆渡，每个词都放在心上。
    story: 米拉在学院街附近的小公寓里翻译小说，偶尔也译法律信件，词典旁边总有一壶放凉的茶。有一次她为一首诗里的一句话想了一整个星期，因为英文里找不到哪个词能装下雨打铁皮屋顶的那种气味。吵闹的房间让她疲惫，一封语气生硬的邮件就能毁掉她一个下午。父亲在她十岁前就教她认了三种文字。她常想，要是更多人能听到父亲唱的那些孟加拉老歌就好了。
