text:
  en:
    name: Wang Xiaoming
    job: Courier
    bio: Shenzhen courier who knows every back alley and wants to know what is behind every door.
    story: Xiaoming came to Shenzhen from a small town in Henan at nineteen and has delivered parcels on an electric scooter for nine years. He knows which building has a broken lift and which security guard likes cigarettes. Every door he knocks on is a small glimpse of a stranger's life, and he wonders about them on the ride home. He once took a night course in electronics and quit when the rent went up. He is saving to open a repair stall, and he has already chosen the corner.
  zh:
    name: 王小明
    job: 快递员
    bio: 深圳快递员，熟悉每条小巷，也想知道每扇门后面是什么。
    story: 小明十九岁从河南一座小县城来到深圳，骑着电动车送了九年快递。他知道哪栋楼电梯坏了，哪个保安爱抽烟。每敲开一扇门，就像瞥见一个陌生人的生活，回家路上他常会琢磨一阵。他曾上过一期电子夜校，房租涨了就停了课。现在他在攒钱，想开一个修理摊，摊子的位置他早就选好了。
