text:
  en:
    name: Emily Tagoona
    job: Bush Pilot
    bio: Flies a small plane between northern Canadian settlements and has turned back for weather exactly twice in thirty years.
    story: Emily grew up in an Inuit family in a small northern town where the only way out in winter was by air. She watched the mail plane land on the ice every week and decided at nine that she would fly it. It took her years to get the licence, and a few people told her it was not a job for a woman from the settlement. She flew medicine, mail and once a whole hockey team over the same frozen lakes. She still checks the sky by eye before she looks at a forecast. Now she is training a young pilot from her own community, and arguing with her about everything.
  zh:
    name: 艾米莉·塔古纳
    job: 丛林飞行员
    bio: 驾着小飞机往返加拿大北部的村镇，三十年里只因天气折返过两次。
    story: 艾米莉出生在北方一个小镇的因纽特家庭，冬天出镇的唯一办法就是坐飞机。她每周看着邮政飞机降在冰面上，九岁就决定要自己开那架飞机。拿到执照花了好几年，也有人对她说，这不是镇上姑娘该干的活。她送过药，送过信，有一回把整支冰球队运过同一片冻湖。她至今仍先抬头看天，再去看天气预报。眼下她在带一位同社区的年轻飞行员，两个人什么事都要争一争。
