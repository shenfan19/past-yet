text:
  en:
    name: Jianguo Zhou
    job: Builder
    bio: Worked construction. Strong, a talker, does not like going around things.
    story: Jianguo left a village in Henan at nineteen to lay bricks in a coastal city, and has followed building sites across the country for twenty six years. He has helped raise towers he will never live in, and he points them out to his son on the phone. On site he talks constantly, jokes with the crane drivers, and argues loudly about whose turn it is to carry the heavy sacks. When a young worker once froze on a high beam, Jianguo walked out and talked him down. He wants to go home, build a proper house with two floors for his parents, and finally sleep in a bed that stays in one place.
  zh:
    name: 周建国
    job: 建筑工人
    bio: 干过工地，身体好，嘴上功夫了得，不爱绕弯。
    story: 建国十九岁离开河南的村子，去沿海城市砌砖，二十六年来跟着工地跑遍了大半个中国。他帮着盖起过许多自己永远住不进去的高楼，打电话时还指给儿子听。在工地上他嘴不停，跟吊车司机开玩笑，为轮到谁扛重麻袋争得大声。有个年轻工友曾在高高的横梁上吓僵了，建国走过去，一句一句把他劝了下来。他想回老家，给父母盖一栋像样的两层小楼，再睡上一张不用再搬的床。
