text:
  en:
    name: Min-ji Park
    job: Chef
    bio: Feeds everyone first and sits down last.
    story: Min-ji opened her first kitchen at twenty six in a narrow alley in Busan, serving stew to dock workers at five in the morning. Her mother had run a similar stall, and Min-ji still uses her recipe for the broth, adding one extra hour of simmering that she has never admitted to. Twice the stall nearly closed, and twice the regulars came with their own chairs and filled it. She works fourteen hours a day and eats standing up. Her wish is quieter than it looks, one Sunday a month when someone else cooks and she is only a guest.
  zh:
    name: 朴敏智
    job: 厨师
    bio: 先让大家吃上，自己最后一个坐下。
    story: 敏智二十六岁在釜山一条窄巷里开了自己的第一间小厨房，清早五点给码头工人端炖汤。母亲也摆过这样的摊子，她至今用母亲的汤底，只是悄悄多煮了一个小时，从没跟人说过。小店有两次差点关门，两次都是老主顾自己搬着椅子来把店坐满。她每天干十四个小时，吃饭常常站着。她的心愿比听上去要安静，每个月有一个星期天，让别人下厨，她只当一回客人。
