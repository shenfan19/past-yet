text:
  en:
    name: Ngozi Mbuyi
    job: Market Trader
    bio: Has sold cloth and soap at the same Kinshasa market stall for thirty years and never lost an argument over a price.
    story: Ngozi took over her aunt's stall at the edge of a Kinshasa market when she was twenty six, selling printed cloth and bars of soap. She raised four children on what she earned and has never told any of them how much it was. She knows every supplier by name, who pays late, and whose scales are a little too kind to the seller, and she has used that knowledge more than once to her own advantage. Her knees are bad now and the morning walk to the stall takes longer. She will not hand the stall to anyone until her youngest finishes university, and she says that day is close.
  zh:
    name: 恩戈齐·姆布伊
    job: 市场商贩
    bio: 在金沙萨同一个摊位卖了三十年布和肥皂，砍价从没输过。
    story: 恩戈齐二十六岁那年接下姑姑在金沙萨市场边上的摊位，卖印花布和肥皂。她靠这个摊子养大了四个孩子，从没告诉过他们到底赚了多少。每个供货商的名字、谁爱拖欠货款、谁家的秤对卖家格外宽厚，她都一清二楚，也不止一次拿这些替自己占了便宜。如今她膝盖不好，早上走到摊位要花更久。小儿子大学毕业之前，她谁也不让接手这个摊子，她说那一天快到了。
