text:
  en:
    name: Ngozi Mbuyi
    ethnicity: Luba
    jobs: [Market Trader, Seamstress]
    bio: Has sold cloth and soap at the same Kinshasa market stall for thirty years and never lost an argument over a price.
    story: Ngozi took over her aunt's stall at the edge of a Kinshasa market at twenty six, selling printed cloth and soap, and she sews hems and blouses in the quiet hours. She never learned to read, and she signs with her thumb, so her children read her letters and she has been cheated by a paper or two. Her fingers are quick and her tongue is quicker. Her body is weak, with swollen knees, short breath and many days in bed. Her luck is extraordinary, though. A fire took the stalls on both sides of hers and left hers standing, and twice a flood stopped one street short. She will not hand the stall over until her youngest finishes university, and she says that day is close.
    sayings:
      full: ["Never lost a haggle in my life, and today was no exception."]
      part: ["Sold half, and every price was mine."]
      none: ["No sales today. At dawn tomorrow, the stall goes up as usual."]
      rough: ["Knees swollen again, but I didn't give up an inch of my spot."]
  zh:
    name: 恩戈齐·姆布伊
    ethnicity: 卢巴族
    jobs: [市场商贩, 裁缝]
    bio: 在金沙萨同一个摊位卖了三十年布和肥皂，砍价从没输过。
    story: 恩戈齐二十六岁接下姑姑在金沙萨市场边上的摊位，卖印花布和肥皂，闲下来就缝衣边、做衬衫。她从没学过认字，签名只按手印，信件靠孩子念，也被一两张纸骗过。她手指灵巧，嘴比手更快。身体却很弱，膝盖肿，气短，常要躺上好几天。可她的运气好得出奇，一场大火烧掉了她两侧的摊位，唯独留下了她的，水灾两次都停在隔她一条街的地方。小儿子大学毕业之前，她谁也不让接手这个摊子，她说那一天快到了。
    sayings:
      full: ["砍价，我这辈子没输过，今天也不例外。"]
      part: ["卖出去一半，每一个价都是我定的。"]
      none: ["今天没开张。明天天一亮，摊子照样摆。"]
      rough: ["膝盖又肿了，摊位可一寸没让出去。"]
