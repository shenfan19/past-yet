text:
  en:
    name: Vikram Singh Sandhu
    job: Electrician
    bio: Punjab electrician with golden hands, a golden tongue and a flexible idea of the bill.
    story: Vikram has wired half the farmhouses between Ludhiana and Jalandhar and can find a loose connection by the sound of a humming wall. He charges the rich a little extra and the poor a little less, and keeps the difference as his own sense of justice, though his wife calls it something else. He once rewired a gurdwara kitchen overnight for free and told the story for ten years. His shoulder aches in the cold now. He dreams of a workshop with his name painted on the front.
  zh:
    name: 维克拉姆·辛格·桑杜
    job: 电工
    bio: 旁遮普电工，手巧嘴甜，账单上的数目却很灵活。
    story: 维克拉姆给卢迪亚纳到贾朗达尔之间一半的农舍接过线，听墙里嗡嗡的声音就能找出松动的接头。他对有钱人多收一点，对穷人少收一点，差额算是他自己的公道，不过他妻子对这事另有说法。他曾经一夜之间免费替一家谒师所的厨房重新布线，这件事后来讲了十年。天冷时他的肩膀会疼。他做梦都想有一间自己的作坊，门脸上漆着自己的名字。
