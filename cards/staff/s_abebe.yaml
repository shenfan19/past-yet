text:
  en:
    name: Abebe Tadesse
    job: Coffee Farmer
    bio: Grows coffee on a steep hillside near Yirgacheffe and will not sell a bean he is ashamed of.
    story: Abebe took over his father's hillside plot at twenty two, when some of the coffee trees were already older than he was. In a good year he and his neighbours shared the cost of a pulping machine, and whoever's cherries ripened first used it first. When middlemen pushed prices down and everyone was tempted to mix in the poor beans, he alone kept to the grading rules. People laughed at him for years, but a few buyers began to come back to him every season. His daughter studies agriculture in Addis Ababa and argues with him about pruning each time she visits. He never gives way aloud, yet at night he reads her notes and wonders about trying her way on one slope.
  zh:
    name: 阿贝贝·塔德塞
    job: 咖啡农
    bio: 在耶加雪菲的陡坡上种咖啡，不合格的豆子一粒也不肯卖。
    story: 阿贝贝从父亲手里接过那片坡地时才二十出头，有些咖啡树比他年纪还大。收成好的年份，他和邻居合伙买了一台脱皮机，谁家的果子先熟就先用。后来中间商压价，大家都想把次品混进去凑数，他一个人守着分级的规矩，被笑了好几年，却也慢慢攒下几个每季都回头找他的买家。他的女儿在亚的斯亚贝巴读农学，每次回来都要和他争怎么修剪树枝，两个人谁也不让步。他嘴上不认输，夜里却会翻她留下的笔记，想着有一天也在某一道坡上试试她的办法。
