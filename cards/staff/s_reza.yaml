text:
  en:
    name: Reza Moradi
    job: Bookseller
    bio: Sells poetry in an Isfahan bazaar, can talk anyone into a book and sometimes into a bargain too.
    story: Reza inherited his uncle's bookshop under the arches of an Isfahan bazaar, along with eleven thousand unsorted volumes and a talent for conversation. He can quote Hafez to a tourist and a bus timetable to a taxi driver, and he can always find the book you did not know you needed. He is not above rounding a price up when a customer looks rich. Money slips through his hands, and he lends books he never gets back. What he wants most is to find the one lost manuscript his uncle swore was somewhere on the shelves.
  zh:
    name: 礼萨·莫拉迪
    job: 书商
    bio: 在伊斯法罕的巴扎卖诗集，能把人说动买书，有时顺带也说动一点价钱。
    story: 礼萨从叔叔那里继承了伊斯法罕巴扎拱廊下的一间书店，连同一万一千本没整理的书，和一张能说会道的嘴。他能对游客背哈菲兹的诗，对出租车司机背公交时刻表，总能找到你自己都不知道需要的那本书。看到顾客像是有钱，他也不是不会把价格往上凑一凑。钱总是从他手里漏走，借出去的书也很少还回来。他最想找到叔叔发誓说就在书架某处的那份遗失的手稿。
