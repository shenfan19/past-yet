text:
  en:
    name: Aigerim Sultanova
    job: Geologist
    bio: Spends months in the steppe with a hammer and a notebook, comes back to Almaty restless.
    story: Aigerim's grandfather herded sheep on the steppe, and she grew up believing the ground itself was a kind of storyteller. She studied geology in Almaty and has spent half of every year since in the field, camping in dust and wind with a hammer and a notebook. She once drove two hundred kilometres on a flat tyre to reach a core sample before the rain. Cities make her restless, and she is clumsy with small things like jars and zips. She dreams of a map of the old riverbeds nobody has drawn.
  zh:
    name: 艾格丽姆·苏尔塔诺娃
    job: 地质学家
    bio: 一年有半年在草原上，带着锤子和笔记本，回到阿拉木图就坐不住。
    story: 艾格丽姆的祖父在草原上放羊，她从小就觉得大地本身是个会讲故事的人。她在阿拉木图学地质，此后每年有半年待在野外，在尘土和风里扎营，随身只有一把锤子和一本笔记。有一次她为了赶在下雨前取到岩芯，开着爆了胎的车跑了两百公里。一回到城里她就心神不宁，遇到瓶盖、拉链这类小东西还会手忙脚乱。她梦想画出一张没人画过的古河道地图。
