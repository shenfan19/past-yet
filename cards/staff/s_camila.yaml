text:
  en:
    name: Camila Restrepo
    job: Biologist
    bio: Counts frogs and orchids in the cloud forests above Medellin, and forgets to eat while doing it.
    story: Camila grew up in a flat in Medellin where the mountains were a view, not a place to go. A school trip to a cloud forest at fourteen changed that, and she has spent her adult life studying the frogs and orchids that live there. She can name a species from a single call in the dark, but she often forgets lunch and sometimes the date. Funding for her project runs out every year and every year she writes the grant again, a little less sure of herself. What keeps her going is a village schoolteacher who now brings her pupils along to count frogs, and who sends her their drawings.
  zh:
    name: 卡米拉·雷斯特雷波
    job: 生物学家
    bio: 在麦德林上方的云雾林里数青蛙和兰花，数得忘了吃饭。
    story: 卡米拉在麦德林的一套公寓里长大，那时山只是窗外的风景，不是能去的地方。十四岁学校组织去云雾林，一切都变了，成年后她一直在研究那里的青蛙和兰花。黑夜里听一声蛙鸣，她就能叫出物种的名字，却常常忘了午饭，有时连日期也忘。项目经费每年都要见底，她每年都得重新写申请书，心里一年比一年没底。让她撑下来的，是山村里一位小学老师，现在带着学生一起来数青蛙，还常给她寄来孩子们的画。
