text:
  en:
    name: Maria Santos
    job: Caregiver
    bio: Fifteen years of nursing homes and night shifts, gentle with the old, bad at saying no.
    story: Maria grew up in a Manila neighbourhood where every aunt looked after every other aunt's children. At twenty-six she took a job in a small care home, meant to be temporary, and stayed fifteen years. She knows which resident wants the window open and which one only hums when the radio is low. She sends most of her pay to her sister in Cebu, who raises two nephews. She cries easily at funerals of people she barely knew, and has stopped apologising for it. Her quiet wish is a small bakery where the old ladies could sit for free.
  zh:
    name: 玛丽亚·桑托斯
    job: 护工
    bio: 在养老院熬了十五年夜班，对老人温柔，却总学不会拒绝别人。
    story: 玛丽亚在马尼拉一条老街长大，那里每个阿姨都帮邻居带孩子。二十六岁那年她进了一家小养老院，本想干几个月，结果一待就是十五年。哪位老人要开窗，哪位老人只有在收音机放轻时才肯哼歌，她都记得。工资大半寄给宿务的姐姐，姐姐一个人养着两个外甥。她遇到不太熟的人的葬礼也会掉泪，现在已经不再为此道歉。她心里悄悄想开一间小面包店，让老太太们可以免费坐一下午。
