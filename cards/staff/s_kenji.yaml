text:
  en:
    name: Kenji Mori
    job: Software engineer
    bio: Debugs for a living and cannot leave a loose end alone.
    story: Kenji grew up in Sendai and taught himself to code on his father's old laptop, mostly to fix a broken game. Now he works at a logistics company in Tokyo, where he has a reputation for tracing a bug through three systems and writing the note that finally explains it. He often misses the last train and walks home past the closed shops. One evening he stopped to repair the sign of a tiny noodle stall, and the owner fed him for a week. He would like to build something small that old people can use without being afraid of it.
  zh:
    name: 森健二
    job: 软件工程师
    bio: 靠调试吃饭，见不得没收尾的东西。
    story: 健二在仙台长大，十来岁时用父亲的旧笔记本自学编程，起因只是想修好一个坏掉的游戏。现在他在东京一家物流公司上班，大家都知道他能顺着一个错误追过三个系统，最后写下那份终于讲明白的说明。他常常赶不上末班电车，便走路回家，经过一排关了门的小店。有天傍晚他替一家小面摊修好了招牌，老板请他吃了一个星期的面。他想做一个小小的东西，让老人用起来不害怕。
