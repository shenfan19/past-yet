text:
  en:
    name: Amara Okafor
    job: Midwife
    bio: Has delivered hundreds of babies and stays calm when everyone else panics.
    story: Amara grew up in Enugu, the eldest of five, and learned to stay steady by minding her little brothers through the rainy season blackouts. She trained as a midwife at twenty two and now works nights in a crowded maternity ward, where she hums under her breath so the mothers can hear that nothing is wrong. One night a mother in her first labour gripped her hand and would not let go until dawn, and Amara found she did not mind. Her quiet wish is a small clinic near her mother's village, with a proper generator and a kettle that is always warm.
  zh:
    name: 阿玛拉·奥卡福
    job: 助产士
    bio: 接生过几百个孩子，别人慌的时候她最稳。
    story: 阿玛拉在埃努古长大，是家里五个孩子里的老大，雨季停电的夜晚，她就在黑暗里哄着弟弟们睡觉，慢慢练出了一份稳。二十二岁那年她学了助产，如今在拥挤的产科病房值夜班，一边接生一边低声哼歌，好让产妇听出一切正常。有个头胎的妈妈攥着她的手一直到天亮，她一点也没觉得累。她心里悄悄有个愿望，想在母亲的村子附近开一间小诊所，有台像样的发电机，还有一壶总是热的水。
