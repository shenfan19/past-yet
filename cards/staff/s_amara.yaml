text:
  en:
    name: Amara Okafor
    ethnicity: Igbo
    jobs: [Midwife, Nurse]
    bio: Has delivered hundreds of babies and stays calm when everyone else panics.
    story: Amara grew up in Enugu, the eldest of five, and learned to stay steady by minding her little brothers through the rainy season blackouts. She trained as a midwife at twenty two and now works nights in a crowded maternity ward, where her hands are sure and she hums so the mothers know nothing is wrong. Her weak points are plain. Drug calculations and written charts are hard for her, a colleague checks them, she tires fast and has had malaria three times, and she cannot say no to an extra shift. Somehow the power returns and the babies come through. She wishes for a small clinic near her mother's village, with a generator and a warm kettle.
    sayings:
      full: ["Everyone landed safe. I hummed the whole way home."]
      part: ["Whatever could be caught, I caught clean."]
      none: ["What's the rush? Babies don't come just because you shout."]
      rough: ["'I'm fine, see to the others.' I've been saying that for twenty years."]
  zh:
    name: 阿玛拉·奥卡福
    ethnicity: 伊博人
    jobs: [助产士, 护士]
    bio: 接生过几百个孩子，别人慌的时候她最稳。
    story: 阿玛拉在埃努古长大，是家里五个孩子里的老大，雨季停电的夜晚，她就在黑暗里哄着弟弟们睡觉，慢慢练出了一份稳。二十二岁那年她学了助产，如今在拥挤的产科病房值夜班，手很准，一边接生一边哼歌，好让产妇听出一切正常。她的短处很明显。药量计算和书面记录对她很吃力，要同事替她核对，她容易累，得过三次疟疾，又不会拒绝别人让她加班。可每次停电后灯总能及时亮起，孩子也都平安落地。她想在母亲的村子附近开一间小诊所，有台发电机，还有一壶总是热的水。
    sayings:
      full: ["都平平安安落地，我一路哼着歌回来的。"]
      part: ["能接住的，我都稳稳接住了。"]
      none: ["急什么？孩子也不是你一喊就出来的。"]
      rough: ["我没事，先看别人。这句话我说了二十年了。"]
