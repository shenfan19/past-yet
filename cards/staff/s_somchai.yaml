text:
  en:
    name: Somchai Boonmee
    job: Former Monk
    bio: Twenty years in a temple, now asks questions about everything, slowly and kindly.
    story: Somchai was born to rice farmers outside Chiang Mai and ordained at twenty-two because the temple had the only library he could walk to. He stayed twenty years, teaching village children to read and mending the temple roof. When his mother fell ill he left the robes to care for her, and found that the outside world had changed its prices, its phones and its manners. He now fixes bicycles and asks customers what they are reading. He is slow on stairs but never slow to listen, and he still wants to see the sea in a country that has snow.
  zh:
    name: 颂猜·汶米
    job: 还俗僧人
    bio: 在寺里待了二十年，如今对什么都好奇，问话慢而温和。
    story: 颂猜出生在清迈郊外的稻农家，二十二岁出家，只因为寺里有他能走路到的唯一一间图书室。他在寺里待了二十年，教村里的孩子识字，也亲手修过寺庙的屋顶。母亲病重时他还俗回家照料，才发现外面的物价、手机和礼数都变了样。现在他修自行车，顾客来取车时他总爱问人家最近在读什么书。他爬楼梯很慢，听别人说话却从不着急，还一直想去看看下雪的国家的海。
