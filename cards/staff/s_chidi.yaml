text:
  en:
    name: Chidi Okafor
    job: Civil Engineer
    bio: Builds bridges around Lagos traffic, knows every official by first name, cuts a corner when nobody is looking.
    story: Chidi grew up in Surulere, where the road outside his school flooded every July, and he decided early that someone should fix it. He trained as a civil engineer and now works on bridges and drains across Lagos, charming inspectors and suppliers alike. He knows which official to greet and which to avoid. Sometimes he trims a specification to save a week, and tells himself the structure will hold. His mother keeps asking when he will marry, and he keeps saying after the next bridge opens.
  zh:
    name: 奇迪·奥卡福
    job: 土木工程师
    bio: 在拉各斯的车流里修桥，认识每个官员的名字，没人看时爱省一道工序。
    story: 奇迪在苏鲁莱莱长大，学校门口的路每年七月都会被淹，他早早就想，总该有人来修好它。他学了土木工程，如今在拉各斯到处修桥和排水沟，对检查员和供应商都能聊得热络。哪位官员该打招呼，哪位该绕开，他心里一清二楚。有时他为了省下一周工期会削减一点规格，并告诉自己结构撑得住。母亲总问他什么时候结婚，他总说等下一座桥通车以后。
