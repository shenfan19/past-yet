text:
  en:
    name: Priya Sharma
    job: Pharmacist
    bio: Reads every label twice and counts the dose a third time.
    story: Priya grew up above her uncle's chemist shop in Pune and spent school holidays labelling bottles in neat capitals. She became a pharmacist at twenty four and now runs the counter of a busy neighbourhood pharmacy, where elderly customers bring bags of mixed tablets and ask her to sort them. Once she caught a double dose on a prescription and phoned the doctor at midnight, and nobody was cross. She keeps a notebook of questions customers were too shy to ask. One day she hopes to open her own shop with a bench outside for people to sit and wait.
  zh:
    name: 普里娅·夏尔马
    job: 药剂师
    bio: 标签要读两遍，剂量要数第三遍。
    story: 普里娅在浦那长大，家就在叔叔的药店楼上，放假时帮着用整齐的大写字母给药瓶贴标签。二十四岁她成了药剂师，现在守着一家热闹社区药店的柜台，常有老人提着一袋混在一起的药片，请她帮忙分清。有一次她发现处方上开重了剂量，半夜打电话给医生，结果没有人责怪她。她有个小本子，记着顾客不好意思开口问的问题。她希望有一天能开自己的药店，门外放一条长凳，让等药的人坐下歇歇。
