text:
  en:
    name: Fan Shen
    ethnicity: Han
    jobs: [Modelling scientist, Game designer]
    bio: Employee number one of the agency. Believes modelling and planning can make a life go better.
    story: Dr Fan worked a few years at Rayfield, then spent a few years as a Nomad taking freelance jobs. Colleagues say he is devoted to his research, only his reports always come in late. In his breaks he built a health model and a care game, and since nobody was chasing him he kept at it bit by bit, until he began to think about trying Trauma Team. Then the boss arrived from the future with the means to travel back, and he became the first to join, hoping to use his research to mend some of the regrets of history. If that works, he would like to help make life better for people today.
  zh:
    name: 沈凡
    ethnicity: 汉族
    jobs: [研究员, 游戏设计师]
    bio: 穿越事务所的一号员工，相信建模和规划能让人的一生过得更好。
    story: 沈凡博士在雷菲尔德工作几年后，当了几年流浪者，接各家的外包。同事说他做研究很投入，就是报告总是交得晚。他在休息的间隙做了一个健康模型和一个看护游戏，没人催他，他就这么一点一点做下去，渐渐也想去创伤小组试试。所长从未来带着穿越的办法来到这里，他成了第一个加入的人，想用自己的研究成果，试着改变一些历史的遗憾。如果成功了，将来也想让今天的人过得更好。
