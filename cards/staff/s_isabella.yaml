text:
  en:
    name: Isabella Rossi
    job: Retired teacher
    bio: Forty years of teaching taught her to explain anything twice, and kindly.
    story: Isabella taught literature to thirteen year olds in a school outside Bologna for forty years, and she can still name most of her classes. She retired two springs ago and found the mornings oddly quiet, so she began tutoring neighbourhood children at her kitchen table, paid in biscuits. A boy who had never finished a book once brought her a battered paperback and asked her to read the ending aloud. She keeps that book on the shelf by the stove. What she wants now is simple, to visit her sister in Sicily every autumn without checking the calendar.
  zh:
    name: 伊莎贝拉·罗西
    job: 退休教师
    bio: 教了四十年书，什么都能换个说法再耐心讲一遍。
    story: 伊莎贝拉在博洛尼亚郊外的一所学校里教了四十年文学，学生是十三岁上下的孩子，直到现在她还叫得出大多数班级的名字。两年前的春天退休后，她觉得早晨静得出奇，便在厨房餐桌边给邻居的孩子补课，学费是几块饼干。有个从没读完过一本书的男孩，拿来一本卷了边的平装书，请她把结尾念出来。那本书如今放在炉灶边的架子上。她现在的心愿很简单，每年秋天去西西里看姐姐，不用再翻日历。
