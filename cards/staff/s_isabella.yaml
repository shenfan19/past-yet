text:
  en:
    name: Isabella Rossi
    ethnicity: Italian
    jobs: [Retired teacher, Tutor, Embroiderer]
    bio: Forty years of teaching taught her to explain anything twice, and kindly.
    story: Isabella taught literature to thirteen year olds in a school outside Bologna for forty years, with handwriting so lovely that pupils copied it. Her body has always been the weak part. A bad heart, brittle bones and a hip broken on an icy step make her careful on every staircase, and her luck with trains and weather has never been good. Since retiring she tutors neighbourhood children at her kitchen table, paid in biscuits, and embroiders linen for the church. She wants to visit her sister in Sicily every autumn, if her health and the railways allow it.
    sayings:
      full: ["Understood after one explanation. I've had a handful of students like that in forty years."]
      part: ["Three ways of explaining, half understood. I'm saving the fourth for next time."]
      none: ["No matter. Pazienza. Tomorrow, another way."]
      rough: ["So many steps. I came down one at a time, slower than getting through Dante."]
  zh:
    name: 伊莎贝拉·罗西
    ethnicity: 意大利人
    jobs: [退休教师, 家教, 刺绣师]
    bio: 教了四十年书，什么都能换个说法再耐心讲一遍。
    story: 伊莎贝拉在博洛尼亚郊外的一所学校里教了四十年文学，学生是十三岁上下的孩子，她的字写得漂亮，学生都抢着临摹。身体一直是她最弱的地方，心脏不好，骨头发脆，还在结冰的台阶上摔断过髋骨，所以每一道楼梯她都走得小心，坐火车碰天气也总不顺。退休后她在厨房餐桌边给邻居的孩子补课，学费是几块饼干，也替教堂绣亚麻布。她想每年秋天去西西里看姐姐，只要身体和铁路都肯配合。
    sayings:
      full: ["讲一遍就懂了。这样的学生，四十年里我只见过几个。"]
      part: ["换了三种讲法，懂了一半。第四种我留着下回用。"]
      none: ["没关系，pazienza，明天换个讲法。"]
      rough: ["台阶太多，我一级一级下来的，比讲完《神曲》还慢。"]
