text:
  en:
    name: Lakshmi Subramanian
    job: Tailor
    bio: Chennai tailor of forty years, talks while she stitches and asks about everything.
    story: Lakshmi has sat at the same Singer treadle machine in a Triplicane lane since she was twenty-two, and half the street has been measured by her tape. She talks the whole time she sews, about weddings, prices, and whose daughter did what, and somehow the blouses are never late. Her eyes are tired now and her back complains by evening. A granddaughter showed her a video of a fashion school abroad, and she watched it three times. She keeps asking how the machines there are different from hers.
  zh:
    name: 拉克希米·苏布拉马尼安
    job: 裁缝
    bio: 金奈做了四十年的裁缝，边缝边聊，什么都想问一问。
    story: 拉克希米二十二岁起就坐在特里普利肯一条小巷里的同一台脚踏胜家缝纫机前，半条街的人都被她的皮尺量过。她缝衣服时嘴也不停，说婚事，说价钱，说谁家的女儿又做了什么，可衣服偏偏从不误工。如今她眼睛容易累，傍晚腰背就开始抱怨。孙女给她看过一段国外服装学校的视频，她一连看了三遍，从此老追着人问，那边的机器和她这台到底哪里不一样。
