text:
  en:
    name: Nguyen Thuy Linh
    job: Street food seller
    bio: Hanoi street food seller, quick with a joke and a bowl, soft on anyone who looks hungry.
    story: Linh sells bun cha from a plastic stool stand in the Old Quarter, using the grill her aunt left her when she moved south. She learned early that a joke sells more noodles than a sign, and her regulars come as much for the teasing as for the broth. She rounds prices in her own favour, then gives free bowls to the students who count their coins. Evenings she studies English from a battered phone, hoping to run a small restaurant with a menu in two languages.
  zh:
    name: 阮翠玲
    job: 街头小吃摊主
    bio: 河内的小吃摊主，玩笑和米线都来得快，见到饿着的人就心软。
    story: 阿玲在河内老城区摆了一个塑料凳小摊卖烤肉米线，炉子是姑姑搬去南方时留给她的。她很早就懂得，一句玩笑比一块招牌更能卖出米线，熟客来这里，一半是为了汤，一半是为了被她打趣。她算价钱时总往自己这边凑个整，却会白送一碗给那些数着硬币的学生。晚上她用一部旧手机自学英语，盼着有一天开一家小馆子，菜单上有两种语言。
