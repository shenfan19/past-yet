text:
  en:
    name: Nasreen Qureshi
    job: Doctor
    bio: Physician who treats the poor for what they can pay, and argues with the hospital board about it.
    story: Nasreen was one of six women in her year at a Lahore medical college, and she remembers every one of them. For twenty-five years she has run a small clinic where fees depend on what the patient can carry, sometimes a bag of lentils. The hospital board has asked her to be more businesslike, and she has answered politely and changed nothing. Her own back aches from long standing, and she has quietly stopped climbing stairs. Her daughter wants her to retire, but she still wants to teach one more class of young doctors.
  zh:
    name: 娜斯琳·库雷希
    job: 医生
    bio: 看病按病人的付得起收费，为此常跟医院董事会争。
    story: 娜斯琳念拉合尔医学院时，同年级一共只有六个女生，她记得每一位的名字。二十五年来她一直经营一间小诊所，收费看病人拿得出什么，有时只是一袋扁豆。医院董事会让她做事商业一些，她客气地回答，然后什么也没改。她站得太久，腰一直在疼，所以悄悄不再爬楼梯。女儿劝她退休，但她还想再带最后一班年轻医生。
