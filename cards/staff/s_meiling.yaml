text:
  en:
    name: Mei-Ling Chen
    job: Art student
    bio: Sketches everything she sees and asks why about the rest.
    story: Mei-Ling was born in Tainan, where her grandfather painted temple doors and let her mix the red. At nineteen she is in her second year at an art school in Taipei, filling a sketchbook every two weeks with bus stops, old men playing chess, and the rooftop laundry of her dormitory. Her teachers say she draws fast and thinks slowly, and she agrees. She still asks why about everything, including why a line feels wrong. She hopes to paint a whole temple door of her own one day, and to let her grandfather mix the red once more.
  zh:
    name: 陈美玲
    job: 美术生
    bio: 看到什么都画下来，剩下的就追着问为什么。
    story: 美玲生在台南，爷爷是画庙门的匠人，小时候总让她来调那一抹红。十九岁的她在台北读美术学校二年级，每两周就画满一本速写簿，画公车站、下棋的老人，还有宿舍楼顶晾着的衣服。老师说她手快心慢，她自己也承认。她还是什么都要问个为什么，连一条线为什么看着不对也要问。她希望有一天能画完一整扇自己的庙门，再请爷爷来调那一抹红。
