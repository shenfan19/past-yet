text:
  en:
    name: Thabo Mokoena
    job: Union Organizer
    bio: Stands up in front of the factory gate in Johannesburg and says what everyone else is thinking.
    story: Thabo grew up in Soweto, the son of a bus driver who came home every night too tired to speak. He started on a factory floor at nineteen and was elected shop steward at twenty six, mostly because he was the one who would walk into the manager's office when no one else would. Since then he has sat through hundreds of meetings and lost a few jobs for it. He is not good with paperwork, and his wife keeps his files in order. These days he spends his evenings teaching younger workers to read a contract line by line, because he thinks nobody should sign what they cannot read.
  zh:
    name: 塔博·莫科埃纳
    job: 工会组织者
    bio: 站在约翰内斯堡的工厂门口，把大家心里想的话说出来。
    story: 塔博在索韦托长大，父亲是公交司机，每晚回家累得说不出话。他十九岁进了工厂车间，二十六岁被选为工会代表，多半因为别人不敢进经理办公室，只有他敢。这些年他开过数不清的会，也因此丢过几份工作。他不擅长整理文件，那些档案都是妻子替他归好的。现在他晚上常教年轻工人逐行读合同，因为他觉得，没读懂的东西谁也不该签字。
