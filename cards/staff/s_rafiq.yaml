text:
  en:
    name: Rafiq Hossain
    job: Garment Worker
    bio: Sews faster than anyone on his floor, argues with every supervisor, and has never lost a week's pay.
    story: Rafiq came to Dhaka from a village in Barisal at sixteen and learned the sewing machine in a month. Fourteen years on, he runs a line of thirty people and can fix a jammed needle by ear. He once walked into the owner's office to demand overdue wages for his whole floor, and got them. He did not finish school, and sends money so his younger sister can. He hums film songs over the noise of the machines. Someday he wants a workshop of his own, with a window that opens.
  zh:
    name: 拉菲克·侯赛因
    job: 制衣工人
    bio: 车间里缝得最快的人，跟每个主管都吵过，却从没少拿过一周工钱。
    story: 拉菲克十六岁从巴里萨尔的村子来到达卡，一个月就学会了缝纫机。十四年过去，他带着一条三十人的流水线，光凭声音就能判断哪根针卡住了。有一次他走进老板办公室，替整层楼的人要回了拖欠的工钱，而且要到了。他没能读完书，所以一直给妹妹寄钱，让她把学念完。机器轰鸣的时候，他哼着电影里的歌。他想有一天自己开一间小作坊，要有一扇能打开的窗。
