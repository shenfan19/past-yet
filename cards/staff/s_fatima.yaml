text:
  en:
    name: Fatima Al-Sayed
    job: Archivist
    bio: Finds the one page that matters in a room full of boxes.
    story: Fatima has spent twenty six years in a Cairo municipal archive, in a basement that smells of dust and cardamom tea. She started as a clerk after her father, a bookbinder, taught her to love paper that had been handled by many hands. Once she spent three weeks finding a single land deed for an old widow, and the widow cried at the counter. Since then she has believed that an orderly shelf is a kind of kindness. In a few years she hopes to teach her niece the filing system, and to leave labels so clear that no one needs to ask her.
  zh:
    name: 法蒂玛·赛义德
    job: 档案员
    bio: 能在一屋子的箱子里找出那一页要紧的纸。
    story: 法蒂玛在开罗市政档案室的地下室里待了二十六年，那里总有灰尘和豆蔻茶的味道。她最初是做文员，父亲是装订匠，从小教她爱那些被许多双手摸过的纸。有一回她花了三个星期，替一位老寡妇找出一张地契，老太太在柜台前哭了。从那以后她就相信，书架排得整齐也是一种体贴。再过几年，她想把整套归档的办法教给侄女，再把标签写得清清楚楚，让以后的人不必再来问她。
