text:
  en:
    name: Jamal Whitfield
    job: Paramedic
    bio: Drives an ambulance through the night shift in Atlanta and holds the hand of whoever is in the back.
    story: Jamal grew up in southwest Atlanta, where the ambulance was often late and his grandmother once waited forty minutes for one. He took that personally. He trained as an emergency medical technician at twenty two and became a paramedic at twenty nine, and he still takes the night shift because that is when people need help most. He is quick to run toward trouble, and his partner often has to remind him to wait until the scene is safe. After a hard call he sits in the car for a few minutes before he drives on. At home he is learning to cook, slowly, one dish a week for his daughter.
  zh:
    name: 贾马尔·惠特菲尔德
    job: 急救员
    bio: 在亚特兰大开夜班救护车，后座上不管是谁，他都握着手。
    story: 贾马尔在亚特兰大西南区长大，那里的救护车常常来得慢，他奶奶当年就等过四十分钟。这件事他一直记在心里。他二十二岁考下急救技术员，二十九岁成了急救医士，至今仍选夜班，因为夜里的人最需要帮忙。他遇事冲得很快，搭档常得提醒他先确认现场安全。碰上一次难熬的出诊后，他会在车里坐几分钟，再继续上路。在家里他正慢慢学做饭，每周给女儿学一道新菜。
