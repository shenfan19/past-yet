text:
  en:
    name: Yuna Kobayashi
    job: Office Worker
    bio: Ten years in the same Tokyo office, notices everything, speaks up rarely and then does not back down.
    story: Yuna studied literature, then joined a mid-sized trading company in Tokyo because the interview was the first one that did not end in silence. Ten years later she still takes the same train at seven forty, and she can tell from the way a colleague puts down a cup whether the day will be bad. She rarely objects in meetings, but when she does, she does not give way. Evenings she writes short stories that nobody has read. Last spring she turned down a promotion without quite knowing why, and she is still working out what she wanted instead.
  zh:
    name: 小林由奈
    job: 公司职员
    bio: 在东京同一间办公室待了十年，什么都看在眼里，很少开口，开口了就不让步。
    story: 由奈大学读的是文学，毕业后进了东京一家中型贸易公司，只因为那是第一场没有以沉默收尾的面试。十年过去，她还是搭七点四十的那班电车，光看同事放杯子的动作，就知道今天会不会难熬。她在会上很少反对，一旦开口就不肯退。晚上她写短篇小说，至今没有人读过。去年春天她推掉了一次升职，自己也说不清为什么，现在还在慢慢想清楚自己真正想要的是什么。
