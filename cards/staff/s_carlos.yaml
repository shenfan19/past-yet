text:
  en:
    name: Carlos Ramirez
    job: Baker
    bio: Gets up at three every morning in Oaxaca to bake bread, and always has a joke ready for the first customer.
    story: Carlos has baked bread in the same wood fired oven in Oaxaca since he was fifteen, learning the work from a neighbour who never wrote down a single measurement. He is known on his street for two things, the first loaves out at dawn and a joke for whoever walks in first. If a child comes in without enough coins, he somehow always has one extra roll that needs eating. His back aches now, and the oven is getting old. He keeps meaning to write the recipes down for his niece, who wants to take over, but he talks so much while he works that the pages stay blank.
  zh:
    name: 卡洛斯·拉米雷斯
    job: 面包师
    bio: 每天凌晨三点起床在瓦哈卡烤面包，第一个顾客进门总要先听他讲个笑话。
    story: 卡洛斯十五岁起就在瓦哈卡同一座柴火烤炉前做面包，手艺是跟一位邻居学的，那位师傅从没写下过一个配方。街坊提起他总是两件事：天亮时最早出炉的面包，还有给第一位进门客人讲的笑话。有小孩钱带得不够，他总是正好多出一个需要有人吃掉的小面包。如今他腰常常酸痛，烤炉也旧了。他一直想把配方写下来留给想接手的侄女，可他干活时话太多，纸页至今还是空的。
