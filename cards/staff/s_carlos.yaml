text:
  en:
    name: Carlos Ramirez
    ethnicity: Zapotec
    jobs: [Baker, Street Vendor]
    bio: Gets up at three every morning in Oaxaca to bake bread, and always has a joke ready for the first customer.
    story: Carlos has baked in the same wood fired oven in Oaxaca since he was fifteen, and his hands shape a loaf as if they had never done anything else. On Sundays he sells from a cart in the plaza. He can barely add up a bill and writes only his name, so he prices by habit and often sells too cheap. His luck is bad in small and large ways, with a cracked oven floor, a flooded shop and a stolen cart. If a child comes in without enough coins, he somehow always has one extra roll that needs eating. His niece wants to take over, but he has never written a recipe down and cannot manage more than a few lines, so he teaches her by standing beside her at the dough.
  zh:
    name: 卡洛斯·拉米雷斯
    ethnicity: 萨波特克族
    jobs: [面包师, 街头小贩]
    bio: 每天凌晨三点起床在瓦哈卡烤面包，第一个顾客进门总要先听他讲个笑话。
    story: 卡洛斯十五岁起就在瓦哈卡同一座柴火烤炉前做面包，一双手揉出的面团像是天生就会，周日他还推着小车去广场摆摊。他几乎算不清一张账单，除了自己的名字也写不了几个字，定价全凭习惯，常常卖得太便宜。他运气不好，大事小事都碰上过，炉底裂过，铺子进过水，小车被偷过。有小孩钱带得不够，他总是正好多出一个需要有人吃掉的小面包。想接手的侄女来学艺，他从没写过配方，也写不出几行，只能让她站在案板边，一遍一遍看着学。
