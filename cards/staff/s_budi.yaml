text:
  en:
    name: Budi Hasanuddin
    job: Ferry pilot
    bio: Ferry pilot out of Makassar, calm in rough water and always ready to take one more passenger.
    story: Budi grew up in a Bugis fishing family on the coast near Makassar and was steering his uncle's boat before he could swim well. Now he pilots a small ferry between the harbour and the islands, carrying schoolchildren, goats and sacks of rice. In a storm last monsoon he turned back for a stranded fisherman and arrived late for his own daughter's birthday. He has never regretted it. He hopes she will study something that keeps her on dry land, and also secretly hopes she will not.
  zh:
    name: 布迪·哈萨努丁
    job: 渡轮驾驶员
    bio: 望加锡的渡轮驾驶员，风浪里沉得住气，总愿意再多载一个人。
    story: 布迪出身于望加锡海边的布吉人渔家，水性还不太好时就替叔叔掌过舵。如今他驾着一条小渡轮往返于港口和岛屿之间，载过学生、山羊和一袋袋大米。去年雨季一场风暴里，他掉头去救一个被困的渔民，结果赶不上自己女儿的生日。他从没后悔过。他希望女儿将来学点能留在陆地上的本事，心底又悄悄希望她别走得太远。
