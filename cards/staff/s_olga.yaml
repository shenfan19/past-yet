text:
  en:
    name: Olga Petrova
    job: Retired physician
    bio: Practised for fifty years and trusts her own eyes over any manual.
    story: Olga qualified as a doctor in Kazan and spent most of fifty years in a district clinic, walking to patients' flats through snow because the bus was never on time. She learned to listen to a cough before she read a chart, and she was often right. Her colleagues called her stubborn, and she took it as praise. After retiring she kept a small bag by the door, and neighbours still knock when a child has a fever. She would like to grow tomatoes on a sunny balcony and watch one summer through without being called away.
  zh:
    name: 奥尔加·彼得罗娃
    job: 退休医生
    bio: 行医五十年，相信自己的眼睛胜过任何手册。
    story: 奥尔加在喀山读完医学院，五十年里大半时间待在一家区诊所，下雪天也步行去病人家，因为公交车从来不准点。她学会了先听咳嗽再看病历，而且常常对。同事说她固执，她当成夸奖。退休后她在门边放着一只小药包，邻居的孩子发烧，还是会来敲门。她想在朝南的阳台种几棵番茄，安安稳稳地看完一个夏天，不被谁叫走。
