text:
  en:
    name: Tom Becker
    job: Apprentice mechanic
    bio: Takes apart every machine he meets, and puts it back together, mostly.
    story: Tom grew up on the edge of a small town in Ohio, where his grandfather kept a barn full of unfinished engines. He took apart his first lawn mower at nine and finished putting it back together at ten, with two screws left over that never mattered. This year he started as an apprentice at a garage on Main Street, sweeping floors in the morning and holding the light for the older mechanics in the afternoon. Last week his boss let him change a clutch alone. He wants to restore his grandfather's old pickup and drive it, slowly, to the lake.
  zh:
    name: 汤姆·贝克
    job: 修理学徒
    bio: 遇到机器就拆开，大部分时候还能装回去。
    story: 汤姆在俄亥俄州一座小镇的边上长大，爷爷的谷仓里堆满了没修完的发动机。他九岁拆了第一台割草机，十岁才装回去，还多出两颗螺丝，后来证明根本不重要。今年他在大街上的一家修车行当学徒，早上扫地，下午给老师傅们打着灯。上周老板头一回让他独自换了一个离合器。他想把爷爷的旧皮卡修好，然后慢慢开到湖边去。
