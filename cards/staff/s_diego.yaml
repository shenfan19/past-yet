text:
  en:
    name: Diego Fernández
    job: Street musician
    bio: Can draw a crowd with one guitar, and misses his mother's cooking.
    story: Diego left school at seventeen and has played guitar on a corner near the San Telmo market ever since, tango when the tourists linger and rock when students pass. His mother still sends him off with food in plastic tubs, and he still eats it cold on the train. Last winter a retired baker stopped every Thursday just to hear one song, and left a coin and a warm empanada each time. That small habit made Diego feel, for the first time, that the corner was a place he belonged. He hopes to record an album before he turns twenty five, and to play it first in his mother's kitchen.
  zh:
    name: 迭戈·费尔南德斯
    job: 街头乐手
    bio: 一把吉他就能让一群人围过来，也想念妈妈做的饭。
    story: 迭戈十七岁离开学校，从那以后就在圣特尔莫市集旁的街角弹吉他，游客停下就弹探戈，学生路过就弹摇滚。妈妈每次都往他手里塞几盒饭，他总是在火车上冷着吃完。去年冬天，一位退休的面包师每周四都来听一首歌，留下一枚硬币和一个热乎乎的肉馅饼。从那时起，迭戈第一次觉得这个街角属于自己。他想在二十五岁前录一张专辑，第一遍先放给妈妈在厨房里听。
