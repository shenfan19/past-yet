text:
  en:
    name: Hiroshi Tanabe
    job: Retired Engineer
    bio: Forty years at a machine tool plant, still corrects other people's drawings.
    story: Hiroshi joined a machine tool factory in Osaka at eighteen and retired at sixty-five as the man other engineers brought their worst problems to. He remembers the years when the whole street smelled of cutting oil and every apprentice wanted a bench of his own. Since his wife passed, the house has been very quiet, and he fills it by rebuilding old radios on the kitchen table. His knees complain and his hands do not. He will not be told a tolerance is good enough, and he still hopes someone young will ask him how a thing is really made.
  zh:
    name: 田边宏
    job: 退休工程师
    bio: 在机床厂干了四十年，至今还爱改别人的图纸。
    story: 宏十八岁进了大阪一家机床厂，六十五岁退休时，已经是年轻工程师遇到难题就来找的那个人。他记得那些年整条街都是切削油的味道，每个学徒都盼着有一张自己的工作台。妻子去世后家里安静了许多，他便在厨房桌上修旧收音机，把时间填满。膝盖常常抱怨，手却一点不抖。公差只要差一点，他就绝不肯说够用了，他心里还盼着有个年轻人来问他，东西到底是怎么做出来的。
