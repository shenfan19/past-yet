text:
  en:
    name: Jean-Luc Moreau
    job: Retired sea captain
    bio: Has weathered worse storms and gives orders without raising his voice.
    story: Jean-Luc was born in a fishing village on the Brittany coast, went to sea at sixteen on a cargo ship, and made captain at forty. He once pulled a deckhand out of a February sea, and the young man still sends him a card every Christmas. Now retired, he mends nets for the harbour children and teaches them knots on a plank behind his house. His quiet wish is to sail once more along the coast of his childhood at walking speed, with no schedule and no cargo.
  zh:
    name: 让-吕克·莫罗
    job: 退休船长
    bio: 见过更大的风浪，下命令从不提高嗓门。
    story: 让-吕克生在布列塔尼海边的渔村，十六岁上货轮，四十岁当了船长。有一年二月的风浪里，他把一个落水的水手拉了上来，那个年轻人每年圣诞都给他寄一张卡片。退休后，他在屋后的木板上教港口的孩子们打绳结，也替他们补渔网。他悄悄盼着再沿着童年那段海岸慢慢航行一次，不赶时间，也不载货。
