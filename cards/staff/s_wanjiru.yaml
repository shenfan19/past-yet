text:
  en:
    name: Wanjiru Kamau
    job: Data analyst
    bio: Is the first to see the pattern in the numbers.
    story: Wanjiru grew up in Nyeri, where her father farmed coffee and kept his yields in a school exercise book, year after year. She studied statistics in Nairobi on a scholarship and now works at a mobile payments firm, where she is usually the first to notice when a graph bends the wrong way. Last spring her model flagged a village agent whose numbers had gone strange, and it turned out his shop had been robbed and he was too frightened to say. She calls her father every Sunday and they compare the rain. She hopes to build a simple tool that lets small farmers see their own seasons.
  zh:
    name: 万吉鲁·卡毛
    job: 数据分析师
    bio: 总是第一个从数字里看出规律。
    story: 万吉鲁在涅里长大，父亲种咖啡，把每年的收成一笔笔记在一本学生练习簿上。她靠奖学金在内罗毕读统计，现在在一家移动支付公司上班，图表一旦走偏，往往是她第一个察觉。去年春天，她的模型标出一位乡村代理商的数字不对劲，原来他的店被抢了，他吓得不敢说。她每个星期天都给父亲打电话，两个人比一比各自那边的雨水。她想做一个简单的工具，让小农户自己看清自己的季节。
