text:
  en:
    name: Tariq Hassan
    job: Driver
    bio: Knows every back street, and how to talk his way past a closed door.
    story: Tariq has driven a taxi through Amman for sixteen years, after a short spell selling spare parts with his brother. He knows which hill roads flood in winter and which cafe will give a stranger a glass of tea at four in the morning. A woman once begged him to reach the hospital before her husband's surgery, and he took the back streets and made it with six minutes to spare. He still keeps her note on the dashboard. He saves a little each month so his daughter can study medicine, and tells her the long roads are worth it.
  zh:
    name: 塔里克·哈桑
    job: 司机
    bio: 熟悉每一条小巷，也知道怎么说动一扇关着的门。
    story: 塔里克在安曼开了十六年出租车，之前跟哥哥卖过一阵汽车零件。他知道哪几条山路冬天会积水，也知道哪家咖啡馆凌晨四点肯给陌生人倒一杯茶。有个女人曾哀求他赶在丈夫手术前到医院，他钻小巷抄近路，提前六分钟赶到。那张她写的字条他至今夹在仪表盘上。他每个月存一点钱，想让女儿以后读医学，还跟她说，路再远也值得。
