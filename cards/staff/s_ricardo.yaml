text:
  en:
    name: Ricardo Silva
    job: Retired fisherman
    bio: Waits for the tide without hurry and tells long stories while he does.
    story: Ricardo fished from a wooden boat off the coast of Bahia for more than fifty years, starting at eleven when his father fell ill. He knows the tide by the smell of the wind and the colour of the water near the reef. Three of his grandchildren now live in the city and visit every January, and he tells them the same long story about a fish too big to carry, adding a little each year. His knees no longer allow the boat. He sits on the sand at dawn all the same, mending one net slowly, just to have something in his hands.
  zh:
    name: 里卡多·席尔瓦
    job: 退休渔夫
    bio: 守着潮水一点也不着急，一边等一边讲长故事。
    story: 里卡多在巴伊亚海边划着木船打了五十多年的鱼，十一岁那年父亲病倒，他就接过了船。他闻风的味道、看礁石旁海水的颜色，就知道潮水什么时候来。三个孙辈如今住在城里，每年一月回来看他，他总给他们讲那条大得扛不动的鱼，每年多添一点。现在膝盖不允许他再出海了，他还是天一亮就坐到沙滩上，慢慢补一张网，好让手里有点事做。
