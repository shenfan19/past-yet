text:
  en:
    name: Leyla Yildiz
    job: Architecture Intern
    bio: Draws buildings on the back of tram tickets, says yes to everything first and worries afterwards.
    story: Leyla grew up in a flat above a tea garden in Istanbul, drawing the ferries and the minarets from the balcony. She finished architecture school last summer and now interns at a firm that restores old wooden houses along the Bosphorus. She climbs scaffolds without a second thought and says yes to every site visit, then lies awake wondering whether she is good enough. Her mentor says her sketches are brave and her deadlines are not. She wants to design one small library for a neighbourhood that has none.
  zh:
    name: 蕾拉·耶尔德兹
    job: 建筑实习生
    bio: 在电车票背面画房子，凡事先说好，再回头担心。
    story: 蕾拉在伊斯坦布尔一间茶园楼上的公寓长大，常在阳台上画渡轮和宣礼塔。去年夏天她从建筑学院毕业，现在在一家事务所实习，负责修复博斯普鲁斯沿岸的旧木屋。她爬脚手架毫不犹豫，什么工地都答应去，夜里却睡不着，想着自己够不够好。导师说她的草图很大胆，交图的时间却不大胆。她想给一个没有图书馆的街区设计一座小小的图书馆。
