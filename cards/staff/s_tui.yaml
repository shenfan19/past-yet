text:
  en:
    name: Tui Fuimaono
    job: Navigator
    bio: Learning to cross the open Pacific by stars and swells, and impatient to go farther than anyone in his family has.
    story: Tui grew up in Apia, where his grandfather told stories of sailing between islands with no instruments, only stars, swells and the flight of birds. At eighteen he joined a canoe crew that was reviving the old routes, and he fell in love with the work at once. He is not yet patient enough to wait for a calm sea, and the older navigators tease him for it. He studies the star paths at night and tests himself on the water by day. His wish is simple. One day he wants to bring a canoe into a harbour far away, guided only by what his grandfather taught him.
  zh:
    name: 图伊·富伊马奥诺
    job: 航海导航员
    bio: 正在学着凭星辰和涌浪横渡太平洋，急着去家里人没去过的远方。
    story: 图伊在阿皮亚长大，爷爷常讲从前不用仪器、只靠星星、涌浪和飞鸟在岛屿之间航行的故事。十八岁那年，他加入了一支复兴古航线的独木舟船队，一下就爱上了这份活。他还没有耐心等一片平静的海，年长的领航员常拿这个打趣他。夜里他背星路，白天到海上检验自己。他的心愿很简单：有一天，把一条独木舟开进遥远的港口，靠的只是爷爷教给他的东西。
