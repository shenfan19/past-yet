text:
  en:
    name: Samuel Mensah
    job: Journalist
    bio: Asks the question nobody else dares to, and writes the answer down at once.
    story: Samuel grew up in Kumasi, where his aunt sold newspapers from a roadside table and let him read them before the customers came. He studied journalism in Accra and now writes for a small paper about water, markets and the long queues at government offices. Last year he spent three weeks on a story about a clogged drain that flooded a school, and the council fixed it the week after it ran. He carries a notebook everywhere and writes down what people say before they decide to soften it. Someday he wants to publish a book of ordinary street answers.
  zh:
    name: 塞缪尔·门萨
    job: 记者
    bio: 敢问别人不敢问的，问完马上记下来。
    story: 塞缪尔在库马西长大，姨妈在路边摆桌卖报纸，总让他趁顾客还没来先看。后来他在阿克拉读新闻，现在为一家小报写水、集市，还有政府办事处门口排的长队。去年他花了三个星期写一个堵塞的排水沟淹了一所学校的报道，登出后一周，市政就把沟修好了。他走到哪都带着本子，把人们还没来得及改口说软的话先记下来。他想总有一天写一本书，收集街头普通人的回答。
