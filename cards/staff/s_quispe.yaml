text:
  en:
    name: Mariano Quispe
    job: Shepherd
    bio: Has herded alpacas on the high ground near Cusco for fifty years and still talks to each one by name.
    story: Mariano has walked the same high pastures near Cusco since he was twelve, first behind his father and then alone. He knows the weather by the colour of the peaks and every alpaca by its voice, and he talks to them as he would to cousins. When his sons moved to the city for work, he did not argue, but he did not move either. The cold gets into his chest more each winter now. He says little to visitors, yet a wrong word about his animals will hurt him for days. His one wish is for a grandchild to climb the slope with him once, just to hear the wind up there.
  zh:
    name: 马里亚诺·基斯佩
    job: 牧羊人
    bio: 在库斯科附近的高地放了五十年羊驼，每一只都叫得出名字。
    story: 马里亚诺十二岁起就走在库斯科附近的高山牧场上，先是跟在父亲身后，后来独自一人。他看山顶的颜色就知道天气，听声音就认得每一只羊驼，跟它们说话像跟表亲聊天。儿子们去城里找活干时，他没有争，也没有搬。如今每到冬天，寒气往胸口钻得更深。他对来客话不多，可谁要是对他的羊驼说了不中听的话，他能难过好几天。他最大的心愿，是孙辈有一天陪他爬一次那道坡，听听山顶的风。
