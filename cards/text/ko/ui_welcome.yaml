ui:
  welcome:
    story:
      - "당신은 시간 여행 사무소의 소장입니다. 직원을 고용해 과거로 보내세요."
      - "역사가 달라질 수 있는 순간에는 일어나야 할 일을 지키고, 평행 시간선에서는 역사가 남긴 아쉬움을 메우세요."
      - "중요한 순간을 지키고 과거의 아쉬움을 메우면 시간 에너지를 얻습니다. 충분히 모으면 미래로 돌아가 가족과 다시 만날 수 있습니다."
    story_start: "모든 것은 중산대학교의 쑨원 선생 동상 앞에서 시작합니다. 선생의 탄생 160주년을 기립니다."
    disclaimer_title: 안내 및 면책
