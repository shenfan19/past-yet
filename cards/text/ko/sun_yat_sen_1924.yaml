      sunday_sit:
        s_guilan: '{date}: Guilan은 무릎이 좋지 않은 상태로 홀 뒷줄에 앉아 첫 단어부터 마지막 단어까지 머물러 있습니다. 그녀는 플랫폼에서 말한 모든 것을 따르지 않습니다. 옆에 있던 학생이 목이 말라서 물을 건네줍니다.'
        s_somchai: '{date}: 솜차이는 20년 동안 절에서 설교를 듣고, 홀 맨 뒷줄에 맨 끝까지 앉아 있었습니다. 책이 비워지자 그는 옆에 있는 학생에게 무엇을 읽었는지 묻습니다.'
        s_jeanluc: '{date}: Jean-Luc은 허리가 좋지 않아 서 있기를 고집하며, 첫 단어부터 마지막 단어까지 홀 뒤쪽에 서 있습니다.'
      pamphlet:
        s_guilan: '{date}: 프린터에서 새로 나온 팜플렛이 직원 책상 위에 놓여 있습니다. Guilan은 창문을 통해 그것을 보고 표지에 있는 두 명의 문자를 알고 있습니다.'
        s_somchai: '{date}: 프린터에서 새로 나온 팜플렛이 직원 책상 위에 놓여 있습니다. 솜차이는 창문 너머로 덮개를 본다. 그는 언젠가 이 책이 몇 부나 나올지 알고 점원에게 자신이 그 책을 얼마나 읽었는지 묻습니다.'
        s_amara: '{date}: 프린터에서 새로 나온 팜플렛이 직원 책상 위에 놓여 있습니다. 아마라는 창문을 통해 그것을 보고 윙윙거리기 시작한다.'
        s_jeanluc: '{date}: 프린터에서 새로 나온 팜플렛이 직원 책상 위에 놓여 있습니다. Jean-Luc은 창문을 통해 덮개를 봅니다.'
      errand:
        s_guilan: '{date}: 전표가 붙여진 페이지가 복사실을 드나듭니다. Guilan은 밖에 앉아 야채를 손질하며 나오는 모든 사람에게 식사를 했는지 묻습니다.'
        s_amara: '{date}: 전표가 붙여진 페이지가 복사실을 드나듭니다. 아마라는 밖에 있고 그것을 옮기는 사람의 뒷모습만 볼 수 있으며, 발자국을 보면 그가 서두르고 있다는 것을 알 수 있습니다.'
        s_jeanluc: '{date}: 전표가 붙여진 페이지가 복사실을 드나듭니다. 장뤽은 밖에서 문지기의 아이에게 매듭 묶는 법을 가르치고 있는데, 매듭을 지는 사람의 뒷모습만 보입니다.'
      shipai_reached:
        s_guilan: '{date}: 무릎이 좋지 않은 Guilan은 한 번에 한 걸음씩 Shipai로 걸어갑니다. 필드만 있습니다. 그녀는 쪼그리고 앉아서 손가락 사이에 흙을 조금 문지르며 여기에서 식물이 자랄 것이라고 말했습니다.'
        s_carlos: '{date}: 카를로스는 도시에서 동쪽으로 수레를 밀고 시파이에 도착하고 돌아와서 거기에는 들판밖에 없다고 말합니다. 그는 그곳에 대학이 세워질 것이라는 것을 알고 있으면서도 여전히 들판만 있을 뿐이라고 말합니다.'
        s_amara: '{date}: Amara는 도시에서 동쪽으로 걸어나와 Shipai에 도달합니다. 그녀는 여기에 무엇이 서게 될지 알고, 오랫동안 머물며, 지금 여기에 있는 것을 천천히 그린다.'
      sunday_stall:
        s_carlos: '{date}: 카를로스는 안에서 무슨 말을 하는지 이해하지 못하고 빵을 굽기 위해 홀 문에 오븐을 설치합니다. 홀이 텅 비면 사람들이 쏟아져 나오고 빵은 금새 없어져 평소처럼 너무 싸게 팔렸습니다.'
      pamphlet_traded:
        s_carlos: '{date}: Carlos는 오븐에 가득 담긴 빵을 인쇄소에서 새로 나온 팜플렛 한 부와 교환합니다. 그는 그것을 스스로 읽을 수 없으며 빵집을 물려받고 싶어하는 집에 있는 아이를 위한 것이라고 말했습니다.'
      errand_carried:
        s_carlos: '{date}: 이 분기에서 페이지를 전달하기 위해 전송된 사람은 한때 Carlos입니다. 쪽지가 붙어 있는 종이 뭉치. 그는 한 글자도 읽을 수 없고, 한 장도 구겨지지 않습니다.'
      last_stall:
        s_carlos: '{date}: Carlos는 평소보다 오븐에 하나 더 굽습니다. 그는 다가올 일요일에는 이 문에 그렇게 많은 사람이 모이지 않을 것임을 알고 남은 것을 나누어 줍니다.'
      records_begun:
        s_amara: '{date}: 아마라는 세 학교의 기록을 복사하기 시작합니다. 글쓰기는 항상 그녀에게 어려웠기 때문에 그녀는 한 줄을 복사하고 점원에게 한 줄을 확인하도록 했습니다.'
      spoiler_said:
        s_jeanluc: '{date}: Jean-Luc은 복사할 때 점원에게 2년 안에 이 학교가 주문한 사람의 이름을 따를 것이며 목소리를 높이지 않을 것이라고 말했습니다. 점원은 올려다보지 않습니다. 그 사람은 아직 살아 있고, 학교에 그런 이름을 붙인 사람이 있다고 그는 말합니다.'
      shipai_walk:
        s_jeanluc: '{date}: Jean-Luc은 새 캠퍼스가 도시 동쪽의 Shipai에 있을 것이라는 소식을 들었습니다. 그의 무릎은 그를 지금까지 데려갈 수 없었고 그는 동쪽을 바라보며 부두에 잠시 서 있었습니다.'
