eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - '1924년 2월 4일, 광저우. 쑨원은 세 학교를 합쳐 국립광둥대학을 세우라고 지시하고 쩌우루에게 준비를 맡겼다. 학생들은 아직 각 학교에 있다. 입학과 졸업 일정을 챙기고 새 터를 골라야 한다.'
        - '역사에서 대학은 그해 문을 열었지만 스파이의 새 교사는 아홉 해 뒤에야 공사를 시작했다. 쑨원은 그 모습을 보지 못했다. 이 갈래에서 준비처는 세 학교의 서류가 놓인 탁자 곁에 의자 하나를 내준다.'
        - '길을 잘 찾고 각 학교의 사정을 물으며 이름을 꼼꼼히 대조할 사람이 필요하다. 후보지를 걸어 볼 사람과 스파이에서 경계 말뚝을 받쳐 줄 손도 필요하다.'
      points:
        xue: '준비처에 성 밖에 붙일 입학 공고가 왔다. {staff}는 나루를 돌아가는 길을 지우고 지도에 길목과 선착장을 동그라미 쳤다. 심부름꾼은 공고 위에 지도를 얹고 두 번 접었다. 접힌 자리가 강을 가로질러 선착장 표시가 반만 보였다.'
        wen: '사무원이 {staff}를 세 학교 사람들에게 소개했다. {staff}는 학교마다 찾아가 들은 교사와 학생의 사정을 회의 전에 한 장에 정리했다. 탁자에는 종이가 세 무더기로 놓여 있었다. 사무원은 새 종이를 꺼내 세 무더기 위에 가로놓았다.'
        si: '{staff}는 후보지를 걸어서 둘러보고 성 동쪽 스파이까지 갔다. 드나드는 길을 한 지도에 표시했다. 준비처에서 지도를 펼치자 종이가 오그라들었다. {staff}는 동쪽을 손끝으로 눌러 모서리를 등잔 가까이 밀었다.'
        bian: '세 학교의 졸업 명단에 서로 맞지 않는 이름이 있었다. {staff}는 원본을 하나씩 대조해 명단을 한 권에 모았다. 건네기 전에 {staff}는 쪽수를 다시 셌다. 마지막 장에서 잉크가 가장 짙은 곳은 방금 확인한 줄이었다.'
        xing: '스파이로 말뚝을 박으러 갈 일손이 모자랐다. {staff}는 함께 나가 동료가 내리치는 말뚝을 받치고 경계를 다시 걸었다. 마지막 말뚝에서 {staff}는 진흙 묻은 손을 뗐다. 뒤돌아보니 처음 세운 말뚝들이 아직 한 줄에 서 있었다.'
      outcomes:
        all: '사무소로 돌아오면 11월 행사를 위해 쓰인 교훈을 읽을 수 있다. 누군가 다섯 가지 일을 적은 기록 옆에 그 종이를 놓았다. 다섯 줄과 다섯 접힌 자리가 마주 보았다.'
        xing: '쑨원이 광저우를 떠나기 전에 스파이의 경계가 잡혔다. 훗날 지나가던 사람이 말뚝을 하나씩 눈으로 따라갔다.'
        bian: '졸업식을 준비하던 사무원은 한 권을 펼쳐 이름을 찾았다. 장을 넘기자 책등 곁 잉크가 아직 더 짙었다.'
        si: '부지 서류 곁에 비교 지도가 놓였다. 누군가 스파이로 가는 길을 확인하고 접힌 자리를 따라 지도를 닫았다.'
        xue: '접수가 시작되자 성 밖 길목에도 공고가 붙었다. 선착장에 멈춰 선 사람이 종이 아래쪽을 가만히 폈다.'
        wen: '회의 때 세 학교 사정이 한 장에 놓였다. 그 종이는 다음 사람 손에 가서도 펼쳐져 있었다.'
      none: '해가 져도 준비처에서는 종이 넘기는 소리가 났다. 문 앞을 지나던 {staff}에게 등잔불이 종이 아래쪽마다 닿는 것이 보였다.'
      not_admitted: '{staff}는 준비처에 자리를 얻지 못했다. 문 안쪽에는 빈 의자가 탁자 아래 가지런히 들어가 있었다.'
      excerpts:
        xing: '마지막 말뚝에서 {staff}는 진흙 묻은 손을 뗐다. 뒤돌아보니 처음 세운 말뚝들이 아직 한 줄에 서 있었다.'
        bian: '건네기 전에 {staff}는 쪽수를 다시 셌다. 마지막 장에서 잉크가 가장 짙은 곳은 방금 확인한 줄이었다.'
        si: '준비처에서 지도를 펼치자 종이가 오그라들었다. {staff}는 동쪽을 손끝으로 눌러 모서리를 등잔 가까이 밀었다.'
        xue: '심부름꾼은 공고 위에 지도를 얹고 두 번 접었다. 접힌 자리가 강을 가로질러 선착장 표시가 반만 보였다.'
        wen: '탁자에는 종이가 세 무더기로 놓여 있었다. 사무원은 새 종이를 꺼내 세 무더기 위에 가로놓았다.'
    name: "광저우, 1924년"
    short: "광저우"
    place_name: "광저우 고등사범학교 강당"
    blurb: "세 학교가 하나의 대학이 되려 합니다. 준비처는 일이 생길 때마다 그 일을 맡길 만한 사람을 고릅니다. 맡은 일을 하나 마칠 때마다 별을 하나 얻습니다."
    handle_label: "강연 기록이 한 권의 책이 되다"
    protagonist_role: "세 학교를 한 대학으로 합치라고 지시하고 일요일마다 그 강당에서 강연하는 정치가"
    stay: "사무소 기준 7일, 역사 속에서 210일 머무르기"
    plan_baseline: "원래의 시간선"
    protagonist: "쑨원"
    summary:
      near_death: "{staff}는 광저우에서 병이 났다. 귀환 부적에 이끌려 돌아와 동상 앞에서 눈을 떴다."
      stay_and_gifts: "{staff}는 일을 마치고도 돌아오지 않았다. 대학이 문을 여는 것을 보고 싶어 남겠다는 쪽지를 두고 갔다. 선물은 나중에 도착한다."
      gave_up: "{staff}는 끝까지 버티지 못하고 동상 앞에서 눈을 떴다. 1924년의 광저우에는 더 머물 수 없었다고 했다."
      legend: "{staff}는 동상 앞에서 눈을 떴다. 짐 속에는 1924년 3월에 인쇄된 소책자가 있었다. 원래 시간선에서 더는 아무도 묻지 않아 흐지부지된 일은 {base_D:i}건, 이 분기에서는 {D:i}건이었다. 떠나던 날은 개강 {countdown:i}일 전이었다."
      perfect: "{staff}는 동상 앞으로 돌아왔다. 원래 시간선에서 더는 아무도 묻지 않아 흐지부지된 일은 {base_D:i}건, 이 분기에서는 {D:i}건이었다. 떠나던 날은 개강 {countdown:i}일 전이었다."
      modest: "{staff}는 광저우에서 이백십 일을 보내며 할 수 있는 일을 했다. 그리고 다시 동상 앞에 섰다. 떠나던 날은 개강 {countdown:i}일 전이었다."
    star_points:
      xue: "성 밖에 학생 모집 공고를 붙일 경로를 짜서 전달원에게 건네기"
      wen: "소개를 받아 세 학교를 방문하고 첫 회의 전에 사정을 한 장으로 정리해 제출하기"
      si: "후보지를 둘러보고 스파이가 결정되기 전에 비교 지도를 제출하기"
      bian: "세 학교 졸업 명단을 대조하고 6월 21일 행사에 쓸 통합 명부를 제출하기"
      xing: "스파이로 가는 일행에 합류해 새 교지에 경계 말뚝을 세우기"
    points_fail:
      xue: '이 분기에서는 공고가 시내에만 붙어, 성 밖의 학생들이 소식을 들었을 때는 이미 접수가 시작된 뒤였다.'
      wen: '제1차 준비 회의는 역사대로 열렸고, 세 학교의 어려움은 여전히 따로따로 말해질 뿐 한데 모은 목록은 없었다.'
      si: '새 캠퍼스는 역사대로 스파이로 정해졌고, 준비처 책상에는 후보지를 한데 그린 지도가 없었다.'
      bian: '6월 21일 졸업식은 예정대로 열렸다. 준비위원회는 여전히 세 학교의 명단을 따로 확인해야 했다.'
      xing: '스파이의 교지는 역사대로 종이 위에만 그어졌고, 땅에는 경계 말뚝이 하나도 서지 않았다.'
    shift:
      xue:
        was: '1924년 6월 9일 국립 광둥대학은 각 성의 교육청에 학생 모집을 맡겼고, 6월 10일 예과 시험 접수를 시작했다. 모집 계획은 520명이었다.'
        now: '이 분기에서는 성 밖의 길목과 부두에도 모집 공고가 붙었다.'
      wen:
        was: '1924년 3월 3일 제1차 준비 회의가 열렸고, 첫 의제는 세 학교 학생들의 졸업 문제였다.'
        now: '이 분기에서는 회의 탁자 위에 세 학교의 어려움을 한데 적은 목록이 놓였다.'
      si:
        was: '1924년, 학교들이 여러 곳에 흩어져 관리가 어렵자 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했고, 그해에 땅이 정해졌다.'
        now: '이 분기에서는 부지 선정 문서 옆에 후보지와 스파이를 함께 그린 지도가 놓였다.'
      bian:
        was: '1924년 6월 21일 쩌우루가 국립 광둥대학 교장에 취임했고, 같은 날 옛 세 학교의 졸업식이 열렸다.'
        now: '이 분기에서는 준비위원회가 검토를 마친 통합 명단을 졸업식에 사용했다.'
      xing:
        was: '1924년 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했지만, 새 교사는 1933년에야 착공했고 첫 단과대학은 1934년 가을에야 옮겨 갔다. 쑨원은 1925년 3월 12일 세상을 떠나 그것을 보지 못했다.'
        now: '이 분기에서는 11월 그가 광저우를 떠나기 전에 스파이 교지의 경계 말뚝이 이미 하나하나 서 있었다.'
        who: sun_yat_sen_guangzhou
        bio: '이 시간선에서는 쑨원이 광저우를 떠나기 전에 새 교지 스파이의 경계가 정해져 있었다.'
    shift_all: "다섯 가지 일을 모두 마쳤다. 돌아와 쑨원이 훗날 직접 쓴 교훈을 다시 읽으니, 그 일들이 박학·심문·신사·명변·독행이라는 다섯 마디와 맞닿아 있었다."
    milestones:
      adviser: "{date}, 준비처에는 일손이 부족하다. 사무원이 {staff}에게 자리를 내주고, 일이 들어오면 부르기로 했다."
      wen_ask: "{date}, 마침 사무원이 세 학교마다 시간을 내 줄 사람을 알고 있어 {staff}에게 소개해 주었다. {staff}는 교사와 학생들의 사정을 듣고, 첫 회의에 올릴 한 장짜리 문서로 정리해 제출했다."
      xue_enrol: "{date}, 사무원은 {staff}가 성 밖의 길을 금세 파악하는 것을 보고 모집 공고를 붙일 경로를 맡겼다. {staff}는 길목과 나루터를 표시하고 경로도와 공고를 전달원에게 건넸다."
      bian_rolls: "{date}, 세 학교에서 보내온 졸업 명단에는 서로 맞지 않는 이름이 몇 개 있었다. 문서를 꼼꼼히 살피는 {staff}에게 사무원이 세 묶음을 맡겼다. {staff}는 원본과 대조해 행사에서 쓸 통합 명부를 제출했다."
      si_site: "{date}, 준비처는 {staff}에게 시내와 스파이의 후보지를 비교해 달라고 했다. {staff}는 모든 곳을 걸어 본 뒤 진입로를 한 장의 지도에 표시해 가져왔다."
      xing_shipai: "{date}, 스파이에서 경계 말뚝을 세울 일손이 모자라 사무원이 {staff}에게 함께 가 달라고 했다. {staff}는 동료들이 말뚝을 박는 동안 말뚝을 똑바로 잡고, 돌아가기 전에 함께 경계를 한 번 더 걸었다."
      order_given: '{date}: 쑨원은 국립고등사범학교, 광동법정학원, 광둥농업학교를 국립광동대학에 합병하라고 명령하고 조우루(Zou Lu)라는 이름을 붙여 준비하게 했습니다. 도시의 어느 누구도 아직 이 대학이 어디에 있는지 말할 수 없습니다.'
      sun_dies: '{date}: Sun Yat-sen이 베이징에서 사망합니다.'
      renamed: '{date}: 국가 정부는 국립광동대학교를 국립중산대학교로 이름을 바꾸도록 명령합니다.'
      lecture_jan27: '{date}: 일요일. 쑨원(孫文)이 고등사범학교 강당에서 인민3원칙에 관해 첫 강의를 하고 있다.'
      lecture_feb17: '{date}: 일요일. 쑨원이 고등사범학교 홀에서 강의를 하고 있다. 시리즈는 1월 27일부터 시작되었으며 이번이 네 번째 강의입니다. 플랫폼 옆에서 한 남자가 고개를 들지 않고 글을 쓰고 있습니다. 바로 모든 사람을 위해 존재하는 황창구(Huang Changgu)입니다.'
      zou_takes_up: '{date}: Zou Lu가 준비를 맡습니다.'
      hall_feb24: '{date}: 또 일요일이네. 오늘 강당에서 다섯 번째 강의가 열리는데, Zou Lu가 세 학교의 학생들을 여기에 모아 준비를 알렸습니다.'
      first_meeting: '{date}: 세 학교 학생들의 졸업을 안건으로 첫 번째 준비 회의가 열립니다. 준비위원 35명 중 31명이 해외 유학 경험이 있다.'
      first_meeting_book: '{date}: 세 학교 학생들의 졸업을 안건으로 첫 번째 준비 회의가 열립니다. 준비위원 35명 중 31명이 해외 유학 경험이 있다. 이 지점에는 세 학교의 졸업반 이름이 이제 한 권의 책에 있습니다.'
      proofs_travel: '3월까지 강의 내용이 직접 전달됩니다. 황장고의 주석은 공정하게 복사되어 손중산에게 보내지고, 그는 그것을 조로(Zou Lu)에게 가져다가 읽게 하고, 조루(Zou Lu)는 페이지에 전표를 붙여 돌려보낸다.'
      preface: '{date}: Sun Yat-sen이 첫 번째 강의 팜플렛 서문을 작성합니다. 3월 말에 인쇄됩니다.'
      lecture_apr20: '{date}: 일요일. 강당에서의 강의가 두 번째 부분에 이르렀습니다.'
      measures_sent: '{date}: Zou Lu는 세 학교에 합류하기 위한 방안을 제출합니다.'
      measures_approved: '{date}: 조치가 승인되었습니다.'
      shipai_chosen: '올해 Sun Yat-sen은 Zou Lu에게 도시 동쪽의 Shipai에 새 캠퍼스를 선택하라고 말합니다. 학교는 여러 곳에 분산되어 있어 운영하기가 어렵습니다.'
      last_lecture: '{date}: 열여섯 번째 강의입니다. 세 번째 부분은 네 번째 강의에 이르렀고 나머지는 전혀 제공되지 않습니다. 홀에 있는 누구도 이것이 마지막이라는 것을 알지 못합니다.'
      classes_begin: '{date}: 국립 광동 대학교에서 수업이 시작됩니다.'
