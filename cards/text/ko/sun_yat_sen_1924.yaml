eras:
  sun_yat_sen_1924:
    name: "광저우, 1924년"
    short: "광저우"
    place_name: "광저우 고등사범학교 강당"
    blurb: "세 학교가 하나의 대학이 되려 한다. 학교 통합 명령이 내려진 날부터 개강을 열여드레 앞둔 날까지 일곱 달. 게임은 여기서 시작한다."
    handle_label: "강연 기록이 한 권의 책이 되다"
    protagonist_role: "세 학교를 한 대학으로 합치라고 지시하고 일요일마다 그 강당에서 강연하는 정치가"
    stay: "사무소 기준 7일, 역사 속에서 210일 머무르기"
    plan_baseline: "원래의 시간선"
    protagonist: "쑨원"
    summary:
      near_death: "{staff}는 광저우에서 병이 났다. 귀환 부적에 이끌려 돌아와 동상 앞에서 눈을 떴다."
      stay_and_gifts: "{staff}는 일을 마치고도 돌아오지 않았다. 대학이 문을 여는 것을 보고 싶어 남겠다는 쪽지를 두고 갔다. 선물은 나중에 도착한다."
      gave_up: "{staff}는 끝까지 버티지 못하고 동상 앞에서 눈을 떴다. 1924년의 광저우에는 더 머물 수 없었다고 했다."
      legend: "{staff}는 동상 앞에서 눈을 떴다. 짐 속에는 1924년 3월에 인쇄된 소책자가 있었다. 원래 시간선에서 더는 아무도 묻지 않아 흐지부지된 일은 {base_D:i}건, 이 분기에서는 {D:i}건이었다. 떠나던 날은 개강 {countdown:i}일 전이었다."
      perfect: "{staff}는 동상 앞으로 돌아왔다. 원래 시간선에서 더는 아무도 묻지 않아 흐지부지된 일은 {base_D:i}건, 이 분기에서는 {D:i}건이었다. 떠나던 날은 개강 {countdown:i}일 전이었다."
      modest: "{staff}는 광저우에서 이백십 일을 보내며 할 수 있는 일을 했다. 그리고 다시 동상 앞에 섰다. 떠나던 날은 개강 {countdown:i}일 전이었다."
    star_points:
      xue: '박학: 접수가 시작되기 전에 모집 공고를 성 밖에도 붙이자고 준비처에 건의해, 성 밖의 학생들도 늦지 않게 한다'
      wen: '심문: 제1차 준비 회의 전에 세 학교가 저마다 겪는 어려움을 물어 한 장의 목록으로 낸다'
      si: '신사: 새 캠퍼스가 정해지기 전에 시내의 후보지와 스파이의 관유지를 하나씩 걸어 보고 비교해 지도로 준비처에 건넨다'
      bian: '명변: 세 학교 졸업반 명단의 어긋난 곳을 바로잡아 6월 21일 졸업식을 지킨다'
      xing: '독행: 스파이까지 따라가 새 교지의 경계 말뚝을 하나씩 박는다'
    points_fail:
      xue: '이 분기에서는 공고가 시내에만 붙어, 성 밖의 학생들이 소식을 들었을 때는 이미 접수가 시작된 뒤였다.'
      wen: '제1차 준비 회의는 역사대로 열렸고, 세 학교의 어려움은 여전히 따로따로 말해질 뿐 한데 모은 목록은 없었다.'
      si: '새 캠퍼스는 역사대로 스파이로 정해졌고, 준비처 책상에는 후보지를 한데 그린 지도가 없었다.'
      bian: '졸업 명단이 정리되지 않아 6월 21일 졸업식을 제날에 치르지 못했다. 이 분기는 역사에서 벗어났고, 사무소는 그날 직원을 불러들였다.'
      xing: '스파이의 교지는 역사대로 종이 위에만 그어졌고, 땅에는 경계 말뚝이 하나도 서지 않았다.'
    shift:
      xue:
        was: '1924년 6월 9일 국립 광둥대학은 각 성의 교육청에 학생 모집을 맡겼고, 6월 10일 예과 시험 접수를 시작했다. 모집 계획은 520명이었다.'
        now: '이 분기에서는 성 밖의 길목과 부두에도 모집 공고가 붙었다.'
      wen:
        was: '1924년 3월 3일 제1차 준비 회의가 열렸고, 첫 의제는 세 학교 학생들의 졸업 문제였다.'
        now: '이 분기에서는 회의 탁자 위에 세 학교의 어려움을 한데 적은 목록이 놓였다.'
      si:
        was: '1924년, 학교들이 여러 곳에 흩어져 관리가 어렵자 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했고, 그해에 땅이 정해졌다.'
        now: '이 분기에서는 부지 선정 문서 옆에 후보지와 스파이를 함께 그린 지도가 놓였다.'
      bian:
        was: '1924년 6월 21일 쩌우루가 국립 광둥대학 교장에 취임했고, 같은 날 옛 세 학교의 졸업식이 열렸다.'
      xing:
        was: '1924년 쑨원은 쩌우루에게 스파이를 새 교지로 고르게 했지만, 새 교사는 1933년에야 착공했고 첫 단과대학은 1934년 가을에야 옮겨 갔다. 쑨원은 1925년 3월 12일 세상을 떠나 그것을 보지 못했다.'
        now: '이 분기에서는 11월 그가 광저우를 떠나기 전에 스파이 교지의 경계 말뚝이 이미 하나하나 서 있었다.'
        who: sun_yat_sen_guangzhou
        bio: '이 시간선에서는 쑨원이 광저우를 떠나기 전에 새 교지 스파이의 경계가 정해져 있었다.'
    shift_all: '교훈은 쑨원이 직접 쓴 다섯 마디, 박학·심문·신사·명변·독행이다. 직원이 쪽지 귀퉁이에 적은 다섯 마디는 교훈과 한 글자도 다르지 않았다.'
quotes:
  sun_motto: {who: '쑨원', quote: '박학, 심문, 신사, 명변, 독행.', occasion: '국립 광둥대학을 위해 쓴 교훈'}
  sun_great_things: {who: '쑨원', quote: '여러분께 권합니다. 뜻을 세운다면 큰일을 하려 해야지, 큰 벼슬을 하려 해서는 안 됩니다.', occasion: '링난대학 학생 환영회 연설'}
