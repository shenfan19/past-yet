    event_titles:
      asked_the_way: '길을 물었다'
    plots: {}
    encyclopedia:
      history:
        - text: '1924년 2월 4일 쑨원은 국립고등사범학교, 광동법정학원, 광동농업학교를 국립광동대학교에 합병시키고 조우루(Zou Lu)라는 이름으로 설립하도록 명령했습니다.'
          check: true
        - text: '1924년 1월 27일부터 8월 24일까지 Sun은 일요일마다 고등 사범 학교 홀에서 총 16번의 강의를 했습니다. 황창구(Huang Changgu)가 한 권씩 내려놓았고, 조우루(Zou Lu)는 공정한 사본을 읽고 거기에 전표를 붙였으며, 손(Sun)은 직접 그것을 수정했습니다.'
          check: true
        - text: 'Zou Lu는 2월 21일에 준비를 시작했습니다. 2월 24일 그는 세 학교 학생들을 강당에 모아 이를 발표했고, 3월 3일 세 학교 학생들의 졸업을 안건으로 첫 준비회의가 열렸다.'
          check: true
        - text: '첫 번째 강의는 3월 말에 팜플렛으로 인쇄되었으며, 서문은 Sun이 3월 30일에 썼습니다. 6월 3일 Zou Lu는 학교 가입을 위한 법안을 제출했고 6월 6일 승인을 받았습니다.'
          check: true
        - text: '9월 19일 수업이 시작되었고, 11월 11일 창립식은 Sun이 쓴 모토로 진행되었습니다. Sun은 1925년 3월 12일 베이징에서 사망했으며, 1926년에 대학은 국립 Sun Yat-sen University로 이름이 변경되었습니다.'
          check: true
      regret:
        - '9월 1일에 떠나시네요. 수업은 19일부터 시작하고 그 이후에 모토를 쓴다.'
        - '강의는 16시에 중단되었습니다. 홀에 있던 누구도 그것이 마지막이라는 것을 알지 못했습니다.'
    events:
      asked_the_way: '{date}: 편지를 받은 신입생이 {staff}에게 사무실로 가는 길을 묻습니다. {staff}도 모르고 오전 내내 함께 찾아본다.'
      asked_the_way_shown: '{date}: 편지를 받은 신입생이 {staff}에게 사무실로 가는 길을 묻습니다. {staff}가 그것을 시트에 보여주었고, 학생은 감사 인사를 하고 시트를 손에 들고 나갔습니다.'
    quotes:
      near_death:
        - text: '조금 더 버틸 수 있을 것 같았다.'
      stay_and_gifts:
        - trait: '종류'
          text: '나는 그들의 이름을 모두 기억합니다. 나는 잠시 머물고 싶다.'
        - text: '여기에는 사람이 필요합니다.'
      gave_up:
        - trait: '향수병'
          text: '나는 집에 가고 싶다. 그게 전부입니다.'
        - text: '7개월은 너무 길어요.'
      legend:
        - trait: '호기심'
          text: '그렇게 해서 한 페이지씩 수정되는 책이 만들어지는 것입니다.'
        - text: '내가 떠났을 때 그들은 아직 수업을 시작하지 않았습니다.'
      perfect:
        - trait: '종류'
          text: '질문하러 오신 분들이 결국 답변을 주셨네요.'
        - text: '해야 할 일을 했습니다.'
      modest:
        - trait: '글립'
          text: '2년 뒤에 이름이 바뀔 거라고 하더군요. 아무도 나를 믿지 않았습니다.'
        - text: '나는 거기에만 있었다.'
    hints:
      low_luck: '행운이 찾아와 세 학교를 시기적절하게 소개합니다.'
      low_wit: '사무실에서는 재치가 충분한 직원에게 통지 경로를 신뢰합니다. 사이보그 신경 칩이 도움이 됩니다.'
      low_finesse: '사무실에서는 세 가지 목록을 누군가에게 맡기기 전에 문서를 안정적으로 관리할 사람을 찾습니다.'
      low_will: '사무실은 제안된 모든 장소를 둘러볼 의지를 찾습니다. 사이보그 생체공학 폐가 도움이 됩니다.'
      low_constitution: '선원들은 스파이까지 걸어가 현장에서 일할 수 있도록 체질을 갖춘 사람을 찾습니다. 사이보그 생체공학 폐가 도움이 됩니다.'
      none: '한 가지를 변경하고 동일한 시드로 다시 보내면 비교가 가장 명확해집니다.'
quotes:
  sun_motto: {who: '쑨원', quote: '박학, 심문, 신사, 명변, 독행.', occasion: '국립 광둥대학을 위해 쓴 교훈'}
  sun_great_things: {who: '쑨원', quote: '여러분께 권합니다. 뜻을 세운다면 큰일을 하려 해야지, 큰 벼슬을 하려 해서는 안 됩니다.', occasion: '링난대학 학생 환영회 연설'}
