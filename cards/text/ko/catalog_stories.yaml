        p3: '마지막 날 저녁, 감옥은 친구들로 가득했다. 플라톤은 그들 사이에서 끝까지 자리를 지켰다.'
        p2: '시가 적힌 두루마리는 아테네 어느 집의 궤짝 밑바닥에서 세월을 보냈다. 파피루스 가장자리에 보풀이 일었다.'
        p1: '서른 날 뒤, 델로스에서 온 배가 피레우스에 들어왔다. 생선 장수는 멀리서 돛을 알아보았다. 그날 새벽부터 친구들은 감옥 문 앞에서 기다렸다.'
