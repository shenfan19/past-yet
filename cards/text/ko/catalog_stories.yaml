catalog:
  sun_yat_sen_guangzhou:
    name: "동상에서 새 대학으로"
    place: "광저우"
    figure: "쑨원"
    story: "중산대학교의 쑨원 동상 앞에 서자 1924년 2월 4일의 광저우로 돌아간다. 이날 쑨원은 세 학교를 합쳐 국립 광둥대학을 세우라고 지시하고, 쩌우루에게 준비를 맡긴다. 같은 시기 그는 일요일마다 고등사범학교 강당에서 강연한다. 강연 기록은 여러 사람의 손을 거쳐 한 권의 책이 된다. 9월 19일에 수업이 시작되고, 11월 11일 창립식에서는 그가 쓴 교훈을 사용한다. 1925년 3월 12일 베이징에서 그가 세상을 떠난 뒤, 1926년 대학은 그의 이름을 따 새 이름을 얻는다."
    relic: "쑨원 동상"
    relic_desc: "중산대학교 캠퍼스에 있는 동상. 1924년 광저우로 가는 통로이며 골동품이 아니어서 팔 수 없다."
    points:
      p1: "새 캠퍼스 부지를 정하기 전에 후보지 지도를 제출하기"
      p2: "강연을 엮은 책 한 권을 가져오기"
      p3: "마지막 강연까지 자리에 있기"
    vignettes:
      slips: "가상의 사무원이 두 줄을 가린 쪽지가 붙은 원고를 베끼려 한다. 당신은 쪽지와 원고가 각각 누구의 글씨인지 묻는다. 그는 원고를 먼저 베끼고 쪽지는 그대로 둔다."
      back_row: "가상의 학생이 자리를 찾지 못해 자꾸 일어나 두리번거린다. 당신이 긴 의자에서 옆으로 비켜 준다. 그는 말없이 끝까지 듣고, 강당이 비어 갈 때 당신에게 고개를 끄덕인다."
      hundred: "당신은 수첩 맨 뒤에서 다섯 획씩 묶어 날을 센다. 백 일이 되자 가상의 사무원이 무엇을 세느냐고 묻는다. 당신은 날을 센다고 답한다."
  lalibela_rock:
    name: "바위를 깎은 물길의 출구 찾기"
    place: "에티오피아 랄리벨라"
    figure: "랄리벨라 왕과 석공들"
    story: "자그웨 왕조의 랄리벨라 왕은 1181년부터 1221년까지 다스렸다. 그의 이름을 딴 마을에는 바위를 파서 만든 교회 열한 곳과 도랑, 참호, 통로가 있으며, 그가 만들게 했다고 전해진다. 교회별 건립 시기는 확실하지 않다. 1520년대에 사절단과 함께 온 포르투갈 사제 프란시스쿠 알바르스가 유럽인으로서는 처음으로 자세한 기록을 남겼다. 1978년에 세계유산으로 등재되었다."
    relic: "석공의 끌"
    relic_desc: "날을 얇게 갈아 낸 쇠끌."
    points:
      p1: "석공들의 일원이 되어 도랑 밖으로 돌 부스러기를 나르기"
      p2: "우기가 오기 전에 물길을 출구까지 따라가 물이 고일 곳을 알려 주기"
      p3: "우기에 도랑 하나를 처음부터 끝까지 치우는 일 돕기"
    vignettes:
      outlet: "{staff}는 바위에 파인 물길을 따라 굽이를 지나 바깥으로 트이는 곳에 돌조각을 놓아 표시한다."
      rain: "{staff}는 발목까지 물이 찬 도랑에서 날이 저물 때까지 진흙 바구니를 하나씩 위로 건넨다."
      bend: "{staff}는 일꾼이 이튿날 아침 같은 곳을 찾을 수 있도록 종이 조각에 도랑의 굽이를 표시한다."
  ife_bronzes:
    name: "주조 뒤에도 남아야 할 선"
    place: "나이지리아 이페"
    figure: "이페의 주조 장인들"
    story: "요루바인의 도시 이페에서는 약 4세기에 걸쳐 구리 합금으로 사실적인 두상을 만들었다. 대다수 추정은 작품의 시기를 1300년 무렵으로 본다. 1910년 독일인 레오 프로베니우스는 성스러운 숲의 사제에게 자신이 올로쿤 두상이라 부른 작품을 팔라고 압박했지만 결국 돌려주어야 했다. 1938년 운모니제 구역을 파던 일꾼들이 여러 두상을 발견했으며, 그중 하나가 지금 영국박물관에 있다. 1948년 런던 전시에서는 이 두상들이 이탈리아와 그리스의 걸작에 견줄 만하다는 평가를 받았다."
    relic: "연구용 스케치 두 장"
    relic_desc: "장식 없는 시험 주물에 나타난 선을 비교한 그림."
    points:
      p1: "주조 장인들의 일원이 되어 밀랍으로 시험 모형 만들기"
      p2: "쇳물을 붓는 날 도가니 밑의 불을 지키기"
      p3: "주조 뒤 밀랍에 새긴 선과 나중에 더한 선을 구별하기"
    vignettes:
      line: "{staff}는 마감 전에 그린 그림을 오늘의 시험 주물 옆에 놓고, 새 흠집은 별도의 종이에 그린다."
      surface: "{staff}는 시험 주물 밑의 판자를 기울여 빛이 표면을 스치게 하고 가느다란 선이 시작되는 곳을 종이에 표시한다."
      edge: "{staff}는 장식 없는 시험 주물을 그리고, 그 옆에 오늘 처음 보인 선 하나를 그린다. 다음에는 기억에만 기대지 않고 비교할 수 있다."
  great_zimbabwe:
    name: "도면 속 통로"
    place: "짐바브웨 마스빙고"
    figure: "그레이트 짐바브웨를 세운 사람들"
    story: "그레이트 짐바브웨는 쇼나인의 조상이 세웠으며 11세기부터 15세기까지 번성했다. 대성벽에는 화강암을 일정한 단으로 쌓은 길고 굽은 벽이 있고, 두 벽 사이의 좁은 통로는 원뿔형 탑으로 이어진다. 1871년 독일인 카를 마우흐가 유적에 도착했다. 1980년 국가는 이 도시에서 이름을 따 짐바브웨가 되었고, 유적은 1986년 세계유산으로 등재되었다."
    relic: "통로 스케치"
    relic_desc: "두 벽 사이의 길을 비워 둔 작업 도면."
    points:
      p1: "벽을 쌓는 일꾼들과 어울려 다음 단에 맞는 크기의 돌 고르기"
      p2: "두 벽 사이를 걸어 보고, 길은 비워 둔 채 그림으로 남기기"
      p3: "건기에 골짜기에서 언덕 위 일꾼들에게 물을 나르기"
    vignettes:
      lines: "{staff}는 두 줄을 긋고 그사이를 하얗게 남긴다. 심부름꾼은 벽이 아니라 빈 곳을 따라가면 된다."
      width: "{staff}는 안쪽 벽이 끝나는 곳까지 걸어 보고, 선을 한 바퀴 잇지 않고 거기서 연필을 멈춘다."
      pace: "{staff}는 돌을 쌓은 한 단의 길이를 걸음으로 재고, 벽 아래 넓적한 돌에 그 수를 새긴다."
