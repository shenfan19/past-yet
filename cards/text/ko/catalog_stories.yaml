        p2: '높이 난 작은 창 하나로만 빛이 들었다. 소크라테스가 한 줄 읊으면 {staff}는 밀랍판에 적고 박자를 맞춰 다시 읽었다. 한 박이 남으면 밀랍을 고르고 다시 썼다. 이솝의 우화가 하나씩 시가 되었고 마지막은 아폴론에게 바치는 찬가였다. 밤이 되자 {staff}는 담장 밑에서 등잔을 밝히고 밀랍판의 글을 파피루스에 옮겼다. 이튿날 아침 찾아온 친구 하나가 두루마리를 옷 속에 넣고, 가슴에 한 손을 얹은 채 감옥 문을 나섰다.'
