  socrates_athens:
    name: '배가 돌아오기 전에'
    place: '아테네'
    figure: '소크라테스'
    story: '기원전 399년, 소크라테스는 아테네에서 재판을 받고 사형을 선고받았다. 아테네가 해마다 델로스섬으로 보내는 배가 막 떠난 뒤였다. 돌아올 때까지 형을 집행할 수 없어 그는 감옥에서 서른 날쯤 기다렸다. 그동안 이솝 우화를 운문으로 옮겼고, 친구들은 날마다 찾아왔다. 마지막 날엔 병든 플라톤만 빠졌다. 저녁에 소크라테스는 독배를 마셨다.'
    relic: '시장의 토기 잔'
    relic_desc: '검은 유약을 입힌 아테네의 잔. 가장자리가 조금 이지러졌다.'
    points:
      p1: '배심원들의 소란을 가라앉혀 소크라테스가 변론을 끝낼 수 있게 하기'
      p2: '이솝 우화의 운문과 아폴론에게 바치는 찬가를 마무리하도록 돕고 사본을 감옥 밖으로 내보내기'
      p3: '마지막 날 전에 플라톤을 치료해 감옥에서 스승 곁을 지키게 하기'
    points_fail:
      p1: '고함에 변론이 묻혀 끝까지 이어지지 못했다. 이 갈래는 원래 시간선과 어긋나고 사무소는 직원을 불러들인다.'
      p2: '역사에서처럼 이 갈래에서도 시는 남지 않았다.'
      p3: '역사에서처럼 플라톤은 그날 아팠고 스승 곁에 가지 못했다.'
    shift:
      p1:
        was: '기원전 399년, 소크라테스가 아테네에서 재판을 받았다. 플라톤의 《소크라테스의 변명》에서 그는 배심원들에게 소란을 피우지 말라고 거듭 청한다. 유죄 판결과 사형 선고를 받았다.'
      p2:
        was: '기원전 399년, 소크라테스는 형을 기다리며 거듭 꾸던 꿈에 따라 이솝 우화를 운문으로 옮기고 아폴론에게 바치는 찬가를 지었다. 온전하게 남은 것은 없다.'
        now: '친구 하나가 시를 옮겨 쓴 두루마리를 감옥 밖으로 가져갔고, 두루마리는 아테네에 남았다.'
      p3:
        was: '기원전 399년, 소크라테스가 감옥에서 독배를 마시는 날 친구들이 함께했다. 플라톤은 병 때문에 오지 못했다.'
        now: '회복한 플라톤이 감옥에서 친구들과 합류해 끝까지 자리를 지켰다.'
        who: 'plato_academy'
        bio: '이 시간선에서는 플라톤이 병에서 회복해 마지막 날 감옥에서 소크라테스 곁을 지켰다.'
    vignettes:
      rumours: '재판 전날 {staff}는 광장의 가판 세 곳에서 노인이 무슨 혐의를 받는지 물었고 세 가지 답을 들었다. {staff}는 모두 적어 두고 법정에서 어느 것이 낭독될지 기다렸다.'
      harbour: '저녁마다 {staff}는 피레우스 항구의 생선 장수에게 델로스의 배가 들어왔는지 묻는다. 매번 같은 대답을 듣고도 {staff}는 배가 오기를 바라야 할지, 더디 오기를 바라야 할지 알 수 없다.'
      gate: '{staff}는 감옥 담장 곁의 등잔 기름 장수에게 물을 나르고 그 대신 담 밑에 앉을 자리를 얻었다. 찾아오는 사람들은 날마다 새벽부터 문에서 기다렸고 {staff}는 차츰 그 얼굴들을 알아보았다.'
    story_prose:
      opening:
        - '기원전 399년, 아테네. 소크라테스는 불경과 젊은이들을 타락시킨 혐의로 배심원들 앞에 선다. 평생 거리와 광장에서 사람들에게 질문을 던졌지만 책 한 권 남기지 않았다. 후대에는 플라톤과 크세노폰의 글을 통해 그를 알게 된다.'
        - '역사에서는 재판 전날 델로스섬으로 가는 배가 떠났다. 배가 돌아올 때까지 형을 집행할 수 없어서 소크라테스는 감옥에서 서른 날가량 더 기다렸다. 거듭 꾸던 꿈에 따라 이솝 우화를 운문으로 옮겼으나 그 시는 전해지지 않는다. 마지막 날 친구들이 모두 찾아왔고, 병든 플라톤만 오지 못했다. 이 갈래에서는 감옥 담장 곁에 등잔 기름을 파는 여자가 있고, 피레우스의 생선 장수는 들어오는 배를 모두 볼 수 있다.'
        - '소란이 일 때 사람들을 진정시킬 사람, 시를 받아 적어 두루마리로 옮길 사람, 약을 알고 병자를 돌볼 사람이 힘을 보탤 수 있다.'
      outcomes:
