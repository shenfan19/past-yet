          class_lettered: '필사 공방의 방식대로 {staff}는 파피루스를 자르고 《포리스마》 세 권을 하나씩 베낀 뒤 원본과 대조해 글자와 도형을 확인했다. 필사본을 말아 가는 끈으로 묶고 기하학을 배우는 제자들의 손에 건넸다. 에우클레이데스는 한 권을 집어 끈을 풀어 첫 장을 살피고, 다시 원래대로 묶었다.'
