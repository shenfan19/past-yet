    vignettes:
      stack: '그레타는 테이블을 치우고 비어 보이는 나뭇잎을 옆에 놓아두었습니다. Emil이 이전 페이지를 확인하는 동안 당신은 스택을 잡고 있습니다. 빈 직원은 순서에 속합니다. Greta는 원래 있던 자리에 헐거운 미끄럼 표시를 붙여서 다시 제자리에 놓았습니다.'
