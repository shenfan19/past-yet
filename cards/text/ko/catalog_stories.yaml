      finish: '미래의 합창단이 부를 때 해당 구절을 흥얼거리실 수 있습니다. Greta는 지금 사본이 필요하며 해당 페이지에 쓰여진 음악이 어디서 끝나는지 묻습니다. 당신은 그녀에게 경계를 보여주고 멜로디는 혼자만 간직합니다. 다음 버전은 귀하께서 떠나신 후에 정리될 것입니다.'
