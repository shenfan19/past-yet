strategies:
  focus:
    balanced:
      name: Равновесие
      desc: Лечить больных, беречь воду и, если будет время, встретиться с местным врачом.
  on_block:
    yield:
      name: Уступить
      desc: Отступить, не спорить.
    insist:
      name: Настоять
      desc: Стоять у двери и говорить своё, пусть даже ценой части снаряжения.
    appeal:
      name: Попросить заступничества
      desc: Попросить местного знакомого замолвить слово.
