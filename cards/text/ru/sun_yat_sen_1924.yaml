    hints:
      low_luck: 'Удача приносит своевременное знакомство с тремя школами.'
      low_wit: 'Офис доверяет маршрут уведомления достаточно смекалистому сотруднику. Нейронный чип киборга помогает.'
      low_finesse: 'Офис ищет надежного человека с документами, прежде чем доверить кому-то три списка.'
