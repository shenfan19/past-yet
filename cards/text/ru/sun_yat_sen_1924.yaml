eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 'Гуанчжоу, 4 февраля 1924 года. Сунь Ятсен поручает объединить три школы в Национальный университет Гуандуна, а подготовку доверяет Цзоу Лу. Ученики пока остаются в своих школах. Предстоит устроить приём и выпуск и найти участок.'
        - 'В истории университет открылся в том же году, а строить кампус в Шипае начали девять лет спустя. Сунь до этого не дожил. В этой ветви в подготовительной канцелярии освобождают стул у стола с бумагами трёх школ.'
        - 'Пригодится тот, кто умеет найти дорогу, расспросить людей и сверить имена. Кому-то предстоит обойти участки, а в Шипае нужны руки, чтобы придержать межевые колья.'
      points:
        xue: 'Из канцелярии приносят объявления о приёме для мест за городской чертой. {staff} вычёркивает обход у переправы и обводит на схеме перекрёстки и пристани. Посыльный кладёт схему на объявления и дважды складывает свёрток. Сгиб проходит по реке, оставляя у пристани половину кружка.'
        wen: 'Служащий знакомит {staff} с людьми из трёх школ. До заседания {staff} успевает собрать на одном листе нужды учителей и заботы учеников. На столе уже лежат три стопки. Служащий достаёт новый лист и кладёт его поперёк всех трёх.'
        si: '{staff} пешком обходит возможные участки до самого Шипая на востоке города и наносит все подъезды на одну схему. В канцелярии схема сворачивается, едва её разворачивают. {staff} придерживает восточный край и подвигает угол к лампе.'
        bian: 'Некоторые имена в выпускных списках не совпадают. {staff} сверяет их с подлинниками и сводит три списка в один реестр. Перед сдачей {staff} ещё раз считает страницы. На последней темнее всего чернила в строке, которую только что сверили.'
        xing: 'Людей для разметки в Шипае не хватает. {staff} придерживает колья, пока спутники вбивают их, и ещё раз обходит границу. У последнего кола {staff} отнимает перепачканные землёй руки. Если оглянуться, первые колья всё ещё стоят в одну линию.'
      outcomes:
        all: 'По возвращении в агентство можно прочесть девиз, написанный для ноябрьской церемонии. Кто-то кладёт копию рядом с записью о пяти поручениях. Пять строк лежат напротив пяти сгибов.'
        xing: 'Границу в Шипае обозначили до отъезда Суня из Гуанчжоу. Позднее прохожий ведёт взглядом вдоль кольев, от одного к другому.'
        bian: 'Готовясь к выпуску, служащий находит имя в одном реестре. Когда он переворачивает страницу, чернила у корешка всё ещё темнее.'
        si: 'Возле бумаг о выборе участка остаётся сравнительная схема. Кто-то проверяет дорогу в Шипай и складывает её по прежним сгибам.'
        xue: 'Когда начался приём, объявления висели и на перекрёстках за городом. Кто-то остановился у пристани и разгладил нижний край листа.'
        wen: 'На заседании нужды трёх школ помещаются на одном листе. Он остаётся раскрытым, переходя в следующие руки.'
      none: 'В канцелярии и под вечер шелестят бумаги. Проходя мимо двери, {staff} видит, как свет ложится на нижние края листов.'
      not_admitted: '{staff} так и не удаётся устроиться в подготовительной канцелярии. Через дверь виден пустой стул, аккуратно задвинутый под стол.'
      excerpts:
        xing: 'У последнего кола {staff} отнимает перепачканные землёй руки. Если оглянуться, первые колья всё ещё стоят в одну линию.'
        bian: 'Перед сдачей {staff} ещё раз считает страницы. На последней темнее всего чернила в строке, которую только что сверили.'
        si: 'В канцелярии схема сворачивается, едва её разворачивают. {staff} придерживает восточный край и подвигает угол к лампе.'
        xue: 'Посыльный кладёт схему на объявления и дважды складывает свёрток. Сгиб проходит по реке, оставляя у пристани половину кружка.'
        wen: 'На столе уже лежат три стопки. Служащий достаёт новый лист и кладёт его поперёк всех трёх.'
    labels:
      sick: 'Вопросы все еще открыты'
      dead: 'Дела, о которых больше никто не спрашивает'
      deaths: 'Дела, которые истекли'
      treated: 'Записи в одной книге, проценты'
      protected: 'Пройденные участки, процент'
    identities:
      local_scholar:
        name: 'помощник в комнате переписчиков'
        cover: '{staff} говорит, что они получили некоторое образование, хорошо пишут и с радостью помогут с копированием.'
      pen:
        name: 'репортер со стороны'
        cover: '{staff} говорит, что они пишут для какой-то другой газеты и хотят посмотреть, как создается новый университет.'
      wanderer:
        name: 'странник пришел послушать лекции'
        cover: '{staff} говорит, что они в дороге, услышали, что здесь кто-то выступает по воскресеньям, и пришли послушать.'
      maker:
        name: 'кто-то продает у двери зала'
        cover: '{staff} говорит, что у них есть сделка, и они хотели бы обосноваться там, где находится толпа.'
      far_guest:
        name: 'гость с корабля'
        cover: '{staff} говорит, что они прибыли на корабле и некоторое время пробудут в Гуанчжоу.'
    personal:
      records_read_aloud:
        s_fan: '{date}: Шен Фань пишет раздачу, которую он должен угадать сам. Он зачитывает имена, а клерк записывает, и по ходу дела он отмечает каждое имя, которое стоит в двух из трех записей.'
        s_somchai: '{date}: Сомчай умеет читать, но руки у него неуклюжие, и никто не может разобрать, что он пишет. Он зачитывает имена, а клерк пишет. В храме, когда остальные чинили крышу, именно он держал лестницу.'
      sunday_first:
        s_fan: '{date}: Шэнь Фан зажат в самом конце зала и не может всего слышать, поэтому он подсчитывает, сколько человек находится в зале и сколько делает записи, и записывает эти два числа.'
        s_samuel: '{date}: Сэмюэл стоит в самом конце зала и делает записи на цыпочках. Он находится слишком далеко, и половина того, что он записывает, — это лица слушающих людей.'
        s_amara: '{date}: Амара зажата в самом конце зала и не может всего слышать. Студент рядом с ней простоял слишком долго и потерял сознание. Она помогает ему сесть и некоторое время считает на его запястье.'
      spoiler:
        s_fan: '{date}: Шэнь Фан знает, что через два года эта школа получит имя человека, который ее заказал, и что через сто лет он выступит из ее статуи. Он пишет два предложения на последней странице блокнота и закрывает его.'
        s_guilan: '{date}: Гуйлан знает, что через два года эта школа сменит название. Она не может написать иероглифы, поэтому проговаривает их в уме один раз и никому не рассказывает.'
        s_somchai: '{date}: Сомчай знает, что через два года эта школа будет носить имя человека, который ее заказал. Он записывает предложение на последней странице тетради, закрывает ее и идет спросить клерка, что он читает.'
        s_carlos: '{date}: Карлос знает, что через два года эта школа сменит название. Он не может это записать, поэтому рассказывает об этом духовке и смеется, не успев закончить.'
        s_samuel: '{date}: Сэмюэл знает, что через два года эта школа сменит название, но этой новости больше ни у кого нет. Он записывает это на последней странице тетради и снова зачеркивает. Некуда его подать.'
        s_amara: '{date}: Амара знает, что через два года эта школа сменит название. Она записывает предложение на последней странице блокнота и закрывает его.'
      pamphlet_given:
        s_fan: '{date}: Клерк вручает Шен Фаню копию брошюры, только что из принтера, и говорит, что она должна быть у всех в комнате. Шэнь Фань сначала открывает предисловие и смотрит на дату под ним.'
        s_samuel: '{date}: Клерк вручает Сэмюэлу копию брошюры, только что из принтера. Он спрашивает, какое это издание, и приказчик говорит, первое.'
      errand_frail:
        s_fan: '{date}: Шэнь Фань запыхался после нескольких ступенек и не может нести страницы. Он сидит у двери копировальной и считает, сколько раз прозвучит один текст.'
        s_somchai: '{date}: Сомчай запыхался после нескольких ступенек и не может нести страницы. Он сидит у двери копировальной и наблюдает, как страницы с бланками входят и выходят.'
        s_samuel: '{date}: У Сэмюэля снова проблемы с желудком, уже несколько дней, и он задыхается после нескольких шагов по лестнице. Он сидит у двери копировальной и отмечает час каждого переноса страниц.'
      homesick_may:
        s_fan: '{date}: Месяц, когда ничего не было зарегистрировано. Шэнь Фан ведет подсчет в блокноте, пока он не достигнет ста дней, а затем снова подсчитывает его рядом с ним. В офисе прошло чуть больше трёх дней.'
        s_guilan: '{date}: Месяц, когда ничего не было зарегистрировано. Гуйлань считает дни. Дома перец чили уже должен отправиться в землю. В офисе прошло чуть больше трёх дней.'
        s_somchai: '{date}: Месяц, когда ничего не было зарегистрировано. Сомчай все еще хочет хоть раз увидеть снег, а в мае в Гуанчжоу его нет. В офисе прошло чуть больше трёх дней.'
        s_carlos: '{date}: Месяц, когда ничего не было зарегистрировано. Карлос просыпается каждое утро в три. Его печи здесь нет, и он целое утро стоит у чужой печи и наблюдает. В офисе прошло чуть больше трёх дней.'
        s_samuel: '{date}: Месяц без каких-либо записей, самый тяжелый период для репортера. Сэмюэль ведет подсчет в блокноте, и он достигает ста дней. В офисе прошло чуть больше трёх дней.'
        s_amara: '{date}: Месяц, когда ничего не было зарегистрировано. Амара подсчитывает, сколько детей в палате должно было родиться за эти сто дней. В офисе прошло чуть больше трёх дней.'
        s_jeanluc: '{date}: Месяц, когда ничего не было зарегистрировано. Жан-Люк пишет по строчке в день, как в журнале в море, пока не наберется сотня. В офисе прошло чуть больше трёх дней.'
      shipai_frail:
        s_fan: '{date}: Шен Фан знает, что будет построено в Шипае, к востоку от города. Это слишком далеко, и он не может пройти по нему.'
        s_somchai: '{date}: Сомчай знает, что будет в Шипае, к востоку от города. Это слишком далеко, и он не может пройти по нему.'
        s_samuel: '{date}: Сэмюэль знает, что будет стоять в Шипае, к востоку от города, и что это будет хороший образец. Это слишком далеко, и он не может пройти по нему.'
      last_seat:
        s_fan: '{date}: Шэнь Фань слушает эту лекцию с обычного места, и счет в его блокноте останавливается на шестнадцати. Он остается сидеть еще некоторое время после того, как зал опустел.'
        s_guilan: '{date}: Гилан слушает эту лекцию из обычного места. Когда зал опустел, она не уходит сразу, а расставляет скамейки одну за другой.'
        s_somchai: '{date}: Сомчай слушает эту лекцию из обычного места. Он остается сидеть некоторое время после того, как зал опустел, как обычно ждал в храме последнего звонка.'
        s_samuel: '{date}: Сэмюэл переносит эту лекцию с обычного места. Он знает, что оно последнее, и записывает в тетрадке только его номер, а не слово «последний».'
        s_amara: '{date}: Амара слушает эту лекцию из обычного места. Некоторое время она остается сидеть, пока из двери не выйдет последний человек.'
        s_jeanluc: '{date}: Жан-Люк слушает эту лекцию, стоя на обычном месте. Он последним покидает зал, так как капитан последним покидает корабль.'
      records_shut:
        s_guilan: '{date}: Гуйлань бросил школу после третьего года обучения и не участвует в копировании записей. Она знакомится с привратниками всех трех школ. Чтобы узнать, кто где, быстрее спросить ее, чем перелистывать страницы.'
        s_carlos: '{date}: Карлос пишет только свое имя и не участвует в копировании записей. Он знакомится с привратниками всех трех школ. Чтобы узнать, кто где, быстрее спросить его, чем перелистывать страницы.'
      sunday_sit:
        s_guilan: '{date}: Гуйлан садится в заднем ряду зала, с больными коленями и всем остальным, и сидит от первого до последнего слова. Она не следует всему, что говорится на платформе. Студенту рядом с ней хочется пить, и она протягивает ему воду.'
        s_somchai: '{date}: Сомчай слушал проповеди в храме двадцать лет и сидит в заднем ряду зала до самого конца. Когда она опустошается, он спрашивает стоящего рядом студента, что он читал.'
        s_jeanluc: '{date}: У Жан-Люка больная спина, он настаивает на том, чтобы стоять, и стоит в конце зала от первого до последнего слова.'
      pamphlet:
        s_guilan: '{date}: Брошюра, только что вышедшая из типографии, лежит на столе клерка. Гилан видит это через окно и знает двух персонажей на обложке.'
        s_somchai: '{date}: Брошюра, только что вышедшая из типографии, лежит на столе клерка. Сомчай видит обложку через окно. Он знает, сколько экземпляров этой книги однажды выйдет, и спрашивает клерка лишь о том, насколько далеко он в ней продвинулся.'
        s_amara: '{date}: Брошюра, только что вышедшая из принтера, лежит на столе клерка. Амара видит это через окно и начинает напевать.'
        s_jeanluc: '{date}: Брошюра, только что вышедшая из типографии, лежит на столе клерка. Жан-Люк видит обложку через окно.'
      errand:
        s_guilan: '{date}: Страницы с наклеенными на них бланками входят и выходят из копировальной. Гуйлань сидит на улице, режет овощи и спрашивает всех, кто выходит, поели ли они.'
        s_amara: '{date}: Страницы с наклеенными на них бланками входят и выходят из копировальной комнаты. Амара находится снаружи и видит только спину того, кто их несет, и по шагам может сказать, что он спешит.'
        s_jeanluc: '{date}: Страницы с наклеенными на них бланками входят и выходят из копировальной. Жан-Люк на улице учит ребенка привратника завязывать узлы и видит только спину того, кто их несет.'
      shipai_reached:
        s_guilan: '{date}: Больные колени и все такое, Гуйлан шаг за шагом идет к Шипаю. Есть только поля. Она приседает, растирает между пальцами щепотку земли и говорит, что здесь все вырастет.'
        s_carlos: '{date}: Карлос выталкивает свою тележку из города на восток, достигает Шипай и возвращается, говоря, что там одни поля. Он знает, что там будет построен университет, но говорит, что только поля.'
        s_amara: '{date}: Амара выходит из города на восток и достигает Шипай. Она знает, что здесь будет стоять, остается надолго и медленно рисует то, что здесь сейчас.'
      sunday_stall:
        s_carlos: '{date}: Карлос не понимает, о чем говорят внутри, и ставит у двери зала печь, чтобы испечь хлеб. Когда зал пустеет, толпа высыпается наружу, а хлеб мгновенно исчезает, как обычно, продается слишком дешево.'
      pamphlet_traded:
        s_carlos: '{date}: Карлос обменивает полную духовку хлеба на копию брошюры, только что из принтера. Он не может прочитать это сам и говорит, что это для домашнего ребенка, который хочет взять на себя управление пекарней.'
      errand_carried:
        s_carlos: '{date}: В этой ветви однажды послали нести страницы Карлоса. Пачка бумаги с наклеенными на ней листочками, из которых он не может прочесть ни слова, и ни один лист не помят.'
      last_stall:
        s_carlos: '{date}: Карлос испечет на одну порцию духовки больше, чем обычно. Он знает, что в ближайшие воскресенья у этой двери не будет такой толпы, и раздает то, что осталось.'
      records_begun:
        s_amara: '{date}: Амара начинает копировать записи трёх школ. Письменная работа всегда давалась ей тяжело, поэтому она переписывает строку и просит клерка проверить ее.'
      spoiler_said:
        s_jeanluc: '{date}: Жан-Люк сообщает клерку, занимающемуся копированием, что через два года эта школа возьмет имя человека, который ее заказал, и не повышает голос, чтобы сказать это. Клерк не поднимает глаз. Мужчина еще жив, говорит он, и который так называет школу.'
      shipai_walk:
        s_jeanluc: '{date}: Жан-Люк слышит, что новый кампус будет находиться в Шипае, к востоку от города. Колени не выдерживают его так далеко, и он некоторое время стоит на набережной, глядя на восток.'
    name: 'Гуанчжоу, 1924 год.'
    short: 'Гуанчжоу'
    place_name: 'Гуанчжоу, зал Высшей педагогической школы'
    tags:
      - 'мысль'
      - 'образование'
      - 'университет'
      - 'с20'
      - 'Гуанчжоу'
      - 'история'
    event_titles:
      asked_the_way: 'Спросил дорогу'
    plots: {}
    blurb: 'Три школы должны стать одним университетом. По мере поступления работы подготовительный офис распределяет задания между людьми, которые могут их выполнить. Ваш сотрудник получает звезду за каждое выполненное и выполненное задание.'
    handle_label: 'Записи становятся одной книгой'
    protagonist: 'Сунь Ятсен'
    protagonist_role: 'Государственный деятель, заказавший три школы, объединились в один университет и читает лекции в их зале по воскресеньям.'
    stay: 'Пребывание семь рабочих дней, 210 дней истории'
    plan_baseline: 'Основная временная шкала'
    encyclopedia:
      history:
        - text: '4 февраля 1924 года Сунь Ятсен приказал Национальной высшей педагогической школе, Гуандунской школе права и политики и Гуандунской сельскохозяйственной школе объединиться в Национальный университет Гуандуна и поручил Цзоу Лу подготовить их.'
          check: true
        - text: 'С 27 января по 24 августа 1924 года Сунь читал лекции по воскресеньям в зале Высшего педагогического училища, всего шестнадцать лекций. Хуан Чангу записал каждую, Цзоу Лу прочитал чистые копии и наклеил на них листочки, а Сунь исправил их собственноручно.'
          check: true
        - text: 'Цзоу Лу приступил к подготовке 21 февраля. 24 февраля он созвал учеников трех школ в холле, чтобы объявить об этом, и 3 марта состоялось первое подготовительное собрание, на повестке дня которого стоял выпуск учащихся трех школ.'
          check: true
        - text: 'Первые лекции были напечатаны в виде брошюры в конце марта с предисловием, которое Сан написал 30 марта. 3 июня Цзоу Лу представил меры по присоединению к школам, которые были одобрены 6 июня.'
          check: true
        - text: 'Занятия начались 19 сентября, а 11 ноября состоялась церемония основания под девизом, написанным Саном. Сунь умер в Пекине 12 марта 1925 года, а в 1926 году университет был переименован в Национальный университет Сунь Ятсена.'
          check: true
      regret:
        - 'Вы уезжаете 1 сентября. Занятия начинаются 19 числа, после этого пишется девиз.'
        - 'Лекции закончились на шестнадцатом. Никто в зале не знал, что это последний раз.'
    events:
      asked_the_way: '{date}: Новый студент с письмом спрашивает {staff} дорогу в кабинет. {staff} тоже не знает, и они вместе ищут его пол утра.'
      asked_the_way_shown: '{date}: Новый студент с письмом спрашивает {staff} дорогу в офис. {staff} показывает это на листе, ученик благодарит их и уходит с листом в руке.'
    star_points:
      xue: 'Спланируйте, где уведомления о зачислении должны выходить за стены, и передайте маршрут курьерам офиса.'
      wen: 'Познакомьтесь с тремя школами и изложите их проблемы на одном листе для первой встречи.'
      si: 'Сравните участки, которые рассматривает офис, и предоставьте карту до принятия решения по Шипаю.'
      bian: 'Проверьте три списка выпускников и доставьте один список на церемонию 21 июня.'
      xing: 'Присоединяйтесь к команде в Шипае и установите пограничные столбы для нового кампуса.'
    points_fail:
