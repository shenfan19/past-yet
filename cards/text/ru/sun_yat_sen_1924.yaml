      wen: 'Первое подготовительное собрание проводится в соответствии с записью, и каждая школа по-прежнему говорит только о своих проблемах, без списка, объединяющего их.'
      si: 'Шипай выбран записанным, а листа со срисованными участками в офисе нет.'
      bian: 'Выпускной 21 июня состоится, как и было записано. Офису приходится работать по трем отдельным спискам.'
