    shift:
      xue:
        was: '9 июня 1924 г.: Национальный университет Гуандуна просит провинциальные управления образования набрать студентов, и 10 июня открывается регистрация на подготовительный экзамен, запланировано 520 мест.'
        now: 'В этой ветви также вывешивается объявление о наборе на перекрестках за городом и на набережных.'
      wen:
        was: '3 марта 1924 г.: проводится первое подготовительное собрание, и первым на его повестке дня стоит выпуск учащихся трех школ.'
        now: 'В этой ветви на столе собрания лежит список бед всех трех школ.'
      si:
        was: '1924 год: школы разбросаны по нескольким местам, и ими трудно управлять. Сунь Ятсен велит Цзоу Лу выбрать новый кампус в Шипае, и в этом году размечается земля.'
        now: 'В этой ветви рядом с бумагами на выбор лежит карта достопримечательностей и Шипая.'
      bian:
        was: '21 июня 1924 г.: Цзоу Лу занимает пост президента Национального университета Гуандуна, и в тот же день проводится церемония выпуска всех трех школ.'
        now: 'В этой ветви в офисе имеется единый проверенный список на церемонию.'
      xing:
        was: '1924: Сунь Ятсен предлагает Цзоу Лу выбрать Шипай для нового кампуса, но строительство начинается только в 1933 году, а первые колледжи въезжают осенью 1934 года. Сунь умирает 12 марта 1925 года и никогда его не видит.'
        now: 'В этой ветви, прежде чем он покинет Гуанчжоу в ноябре, границы территории Шипай уже стоят, столб за столбом.'
        who: 'sun_yat_sen_guangzhou'
        bio: 'На этой временной шкале границы нового кампуса в Шипае находятся до того, как Сунь Ятсен покинул Гуанчжоу.'
    shift_all: 'На каждой работе оставалось что-то, что могло бы пригодиться офису. Оглядываясь назад, можно сказать, что эти пять должностей перекликаются с девизом, который Сунь Ятсен позже написал для университета, с его призывом широко учиться, тщательно исследовать, разумно мыслить, ясно различать и усердно практиковать.'
    milestones:
      order_given: '{date}: Сунь Ятсен приказывает объединить Национальную высшую педагогическую школу, Гуандунскую школу права и политики и Гуандунскую сельскохозяйственную школу в Национальный университет Гуандуна и поручает Цзоу Лу подготовить их. Никто в городе пока не может сказать, где находится этот университет.'
      sun_dies: '{date}: Сунь Ятсен умирает в Пекине.'
      renamed: '{date}: Национальное правительство распорядилось переименовать Национальный университет Гуандуна в Национальный университет Сунь Ятсена.'
      lecture_jan27: '{date}: Воскресенье. Сунь Ятсен читает первую из своих лекций о Трех принципах народа в зале Высшей педагогической школы.'
      lecture_feb17: '{date}: Воскресенье. Сунь Ятсен читает лекции в зале Высшей педагогической школы. Серия началась 27 января, и это четвертая лекция. Сбоку от платформы мужчина пишет, не поднимая глаз. Это Хуан Чангу, который рядом со всеми.'
      zou_takes_up: '{date}: Цзоу Лу приступает к подготовке.'
      hall_feb24: '{date}: Опять воскресенье. Сегодня в зале читается пятая лекция, и Цзоу Лу созывает сюда учеников трех школ, чтобы объявить о подготовке.'
      first_meeting: '{date}: Проводится первое подготовительное собрание, на повестке дня которого стоит выпуск учащихся трех школ. Из тридцати пяти членов подготовительного комитета тридцать один учился за рубежом.'
      first_meeting_book: '{date}: Проводится первое подготовительное собрание, на повестке дня которого стоит выпуск учащихся трех школ. Из тридцати пяти членов подготовительного комитета тридцать один учился за рубежом. В этой ветви имена выпускников трех школ теперь собраны в одной книге.'
      proofs_travel: 'В течение марта текст лекций переходит из рук в руки. Записи Хуан Чангу копируются и отправляются Сунь Ятсену, он передает их Цзоу Лу для прочтения, Цзоу Лу наклеивает листочки на страницы и отправляет их обратно, Сунь исправляет их собственной рукой, и они приходят снова.'
      preface: '{date}: Сунь Ятсен пишет предисловие к брошюре первых лекций. Он напечатан в конце марта.'
      lecture_apr20: '{date}: Воскресенье. Лекции в зале подошли к второй части.'
      measures_sent: '{date}: Цзоу Лу представляет меры по присоединению к трем школам.'
      measures_approved: '{date}: Меры одобрены.'
      shipai_chosen: 'В этом году Сунь Ятсен советует Цзоу Лу выбрать новый кампус в Шипае, к востоку от города. Школы разбросаны по нескольким местам, и ими трудно управлять.'
      last_lecture: '{date}: Шестнадцатая лекция. Третья часть дошла только до четвертой лекции, а остальная так и не была прочитана. Никто в зале не знает, что это последний раз.'
      classes_begin: '{date}: Начало занятий в Национальном университете Гуандуна.'
      ceremony: '{date}: Церемония основания проводится под девизом, который написал Сунь Ятсен: широко учитесь, тщательно спрашивайте, думайте благоразумно, ясно различайте, усердно практикуйте. Его там нет, и через два дня он уезжает из Гуанчжоу.'
      sunday_first: '{date}: {staff} зажат в самом конце зала, далеко от платформы, и может видеть мужчину, но не может все это слышать.'
      sunday_stall: '{date}: {staff} не может попасть в зал и ставит палатку у двери. Когда зал пустеет, толпа выливается наружу, и все мгновенно распродается.'
      sunday_sit: '{date}: {staff} находит место в заднем ряду зала и сидит от первого до последнего слова, не двигаясь.'
      records_begun: '{date}: {staff} начинает копировать записи трёх школ в одну книгу.'
      records_read_aloud: '{date}: Никто не может прочитать руку {staff}. Итак, {staff} считывает имена, а служащий записывает, и три записи начинают сливаться в одну.'
      records_shut: '{date}: Копирование записей требует чтения, и {staff} не участвует в этом, но знакомится с привратниками всех трех школ. Чтобы узнать, кто где, быстрее спросить {staff}, чем перелистывать страницы.'
      records_done: '{date}: Записи трех школ представляют собой одну книгу до первого подготовительного собрания.'
      records_late: '{date}: Записи трех школ представляют собой одну книгу. Первая подготовительная встреча уже проведена.'
      sites_done: '{date}: {staff} обошел все места, разбросанные по городу, и нарисовал их на одном листе, указав, сколько времени потребуется, чтобы пройти от одного к другому.'
      asked_inside: '{date}: Клерки больше не оставляют {staff} ждать у двери и не вызывают их.'
      copy_kept: '{date}: {staff} упаковывает брошюру и кладет ее к своим вещам.'
      exhausted: '{date}: {staff} так устал, что у него трясутся руки, и ему нужно отдохнуть.'
      spoiler: '{date}: {staff} знает, что через два года эта школа будет носить имя человека, который ее заказал. {staff} записывает предложение на последней странице блокнота и закрывает его.'
      spoiler_said: '{date}: {staff} сообщает клерку, занимающемуся копированием, что через два года эта школа будет носить имя человека, который ее заказал. Клерк не поднимает глаз. Мужчина еще жив, говорит он, и который так называет школу.'
      errand: '{date}: Страницы с наклеенными на них бланками входят и выходят из копировальной комнаты. {staff} находится снаружи и видит только спину того, кто их несет.'
      errand_carried: '{date}: В этой ветви для переноса страниц присылают один раз {staff}. Стопка бумаги с наклеенными на нее листочками идет от одного конца к другому, и ни один лист не сгибается.'
      errand_frail: '{date}: {staff} запыхался после нескольких ступенек и не может нести страницы, и сидит у двери копировальной комнаты, наблюдая, как страницы с листками входят и выходят.'
      pamphlet: '{date}: Брошюра, только что вышедшая из типографии, лежит на столе клерка. {staff} видит крышку через окно.'
      pamphlet_traded: '{date}: {staff} обменивают то, что они делают своими руками, на копию брошюры, только что распечатанную.'
      pamphlet_given: '{date}: Клерк вручает {staff} копию брошюры, только что из принтера, и говорит, что она должна быть у всех в комнате.'
      homesick_may: '{date}: Месяц, когда ничего не было зарегистрировано. {staff} ведет подсчет в блокноте, и он достигает ста дней. В офисе прошло чуть больше трёх дней.'
      shipai_walk: '{date}: {staff} слышит, что новый кампус будет находиться в Шипае, к востоку от города. Сегодня никакого путешествия туда нет.'
      shipai_reached: '{date}: {staff} выходит из города на восток и достигает Шипай. {staff} знает, что здесь будет стоять, остается надолго и рисует то, что находится здесь сейчас.'
      shipai_frail: '{date}: {staff} знает, что будет стоять в Шипае, к востоку от города. Это долгий путь, и сегодня {staff} остается в городе.'
      last_seat: '{date}: {staff} слушает эту лекцию с обычного места и остается сидеть некоторое время после того, как зал опустел.'
      last_stall: '{date}: {staff} приносит больше, чем в другие воскресенья. {staff} знает, что в ближайшие воскресенья у этой двери не будет такой толпы.'
      adviser: '{date}: В подготовительном офисе не хватает рабочих рук. Клерк освобождает место для {staff} и говорит, что они могут передавать задания по мере их поступления.'
      wen_ask: '{date}: Перед первой встречей в каждой школе у секретаря есть знакомый, у которого есть свободное время. Секретарь отправляет {staff} со вступительными словами и просит предоставить один лист, который может использовать комитет. {staff} выслушивает учителей и учеников и излагает их опасения на одной странице.'
      xue_enrol: '{date}: Клерк видит, как быстро {staff} определяет, какие дороги обслуживают деревни за пределами стен, и спрашивает маршрут для уведомлений о зачислении. {staff} отмечает переправы и причалы, затем передает курьерам готовый маршрут с заметками.'
      bian_rolls: '{date}: Приходят три списка выпускников с несовпадающими именами. Клерк, который видел, как {staff} проверял документы, осторожно передал три пачки. {staff} сверяет имена с оригиналами и возвращает один состав для церемонии.'
      si_site: '{date}: Офису нужен кто-то, кто обойдет каждый участок, прежде чем сделать вывод. Они просят {staff} сравнить территорию в городе и в Шипае. {staff} обходит их всех и приносит одну карту с отмеченными подходами.'
      xing_shipai: '{date}: Экипажу, отправляющемуся на Шипай, все еще нужна дополнительная пара рук. Клерк спрашивает {staff}, кто сможет управлять прогулкой и работой. В Шипае {staff} удерживает столбы прямо, пока команда их загоняет, и еще раз проходит с ними границу, прежде чем вернуться.'
      enrol_open: '{date}: Открывается регистрация на подготовительный экзамен. Накануне университет обратился в провинциальные управления образования с просьбой принять студентов, запланировано 520 мест.'
      grad_ceremony: '{date}: Цзоу Лу занимает пост президента, и в тот же день проводится церемония выпуска всех трех школ.'
    summary:
      near_death: '{staff} заболевает в Гуанчжоу, его оттягивает назад чары возврата, и он просыпается перед статуей.'
      stay_and_gifts: '{staff} завершил работу и не вернулся. Они оставили записку, в которой говорилось, что хотят остаться и увидеть открытие университета. Подарки будут позже.'
      gave_up: '{staff} не дожили до конца и проснулись перед статуей, заявив, что больше не могут оставаться в Гуанчжоу 1924 года.'
      legend: '{staff} проснулись перед статуей с брошюрой, напечатанной в марте 1924 года, среди своих вещей. На основной временной шкале дела {base_D:i} закончились, и никто больше не спрашивал, в этой ветке {D:i}. В день их отъезда до занятий оставалось {countdown:i} дней.'
      perfect: '{staff} вернулся к статуе. На основной временной шкале дела {base_D:i} закончились, и никто больше не спрашивал, в этой ветке {D:i}. В день их отъезда до занятий оставалось {countdown:i} дней.'
      modest: '{staff} провел двести десять дней в Гуанчжоу, сделал все, что было под рукой, и снова встал перед статуей. В день их отъезда до занятий оставалось {countdown:i} дней.'
