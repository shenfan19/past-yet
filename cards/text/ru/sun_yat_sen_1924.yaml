eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 'Гуанчжоу, 4 февраля 1924 года. Сунь Ятсен поручает объединить три школы в Национальный университет Гуандуна, а подготовку доверяет Цзоу Лу. Ученики пока остаются в своих школах. Предстоит устроить приём и выпуск и найти участок.'
        - 'В истории университет открылся в том же году, а строить кампус в Шипае начали девять лет спустя. Сунь до этого не дожил. В этой ветви в подготовительной канцелярии освобождают стул у стола с бумагами трёх школ.'
        - 'Пригодится тот, кто умеет найти дорогу, расспросить людей и сверить имена. Кому-то предстоит обойти участки, а в Шипае нужны руки, чтобы придержать межевые колья.'
      points:
        xue: 'Из канцелярии приносят объявления о приёме для мест за городской чертой. {staff} вычёркивает обход у переправы и обводит на схеме перекрёстки и пристани. Посыльный кладёт схему на объявления и дважды складывает свёрток. Сгиб проходит по реке, оставляя у пристани половину кружка.'
        wen: 'Служащий знакомит {staff} с людьми из трёх школ. До заседания {staff} успевает собрать на одном листе нужды учителей и заботы учеников. На столе уже лежат три стопки. Служащий достаёт новый лист и кладёт его поперёк всех трёх.'
        si: '{staff} пешком обходит возможные участки до самого Шипая на востоке города и наносит все подъезды на одну схему. В канцелярии схема сворачивается, едва её разворачивают. {staff} придерживает восточный край и подвигает угол к лампе.'
        bian: 'Некоторые имена в выпускных списках не совпадают. {staff} сверяет их с подлинниками и сводит три списка в один реестр. Перед сдачей {staff} ещё раз считает страницы. На последней темнее всего чернила в строке, которую только что сверили.'
        xing: 'Людей для разметки в Шипае не хватает. {staff} придерживает колья, пока спутники вбивают их, и ещё раз обходит границу. У последнего кола {staff} отнимает перепачканные землёй руки. Если оглянуться, первые колья всё ещё стоят в одну линию.'
      outcomes:
        all: 'По возвращении в агентство можно прочесть девиз, написанный для ноябрьской церемонии. Кто-то кладёт копию рядом с записью о пяти поручениях. Пять строк лежат напротив пяти сгибов.'
        xing: 'Границу в Шипае обозначили до отъезда Суня из Гуанчжоу. Позднее прохожий ведёт взглядом вдоль кольев, от одного к другому.'
        bian: 'Готовясь к выпуску, служащий находит имя в одном реестре. Когда он переворачивает страницу, чернила у корешка всё ещё темнее.'
        si: 'Возле бумаг о выборе участка остаётся сравнительная схема. Кто-то проверяет дорогу в Шипай и складывает её по прежним сгибам.'
        xue: 'Когда начался приём, объявления висели и на перекрёстках за городом. Кто-то остановился у пристани и разгладил нижний край листа.'
        wen: 'На заседании нужды трёх школ помещаются на одном листе. Он остаётся раскрытым, переходя в следующие руки.'
      none: 'В канцелярии и под вечер шелестят бумаги. Проходя мимо двери, {staff} видит, как свет ложится на нижние края листов.'
      not_admitted: '{staff} так и не удаётся устроиться в подготовительной канцелярии. Через дверь виден пустой стул, аккуратно задвинутый под стол.'
      excerpts:
        xing: 'У последнего кола {staff} отнимает перепачканные землёй руки. Если оглянуться, первые колья всё ещё стоят в одну линию.'
        bian: 'Перед сдачей {staff} ещё раз считает страницы. На последней темнее всего чернила в строке, которую только что сверили.'
        si: 'В канцелярии схема сворачивается, едва её разворачивают. {staff} придерживает восточный край и подвигает угол к лампе.'
        xue: 'Посыльный кладёт схему на объявления и дважды складывает свёрток. Сгиб проходит по реке, оставляя у пристани половину кружка.'
