  ino_tadataka_ezo:
    name: 'Изгиб, которого нет на линии'
    place: 'Хоккайдо'
    figure: 'Ино Тадатака'
    story: '11 июня 1800 года Ино Тадатака покинул Эдо для своего первого исследования. Отряд проследовал на север через Тохоку, переправился в Эдзо и проследовал вдоль побережья до Нисибецу, прежде чем повернуть обратно. Вся экспедиция, а не только обследование острова, заняла около полугода. Ино умер в 1818 году. Его коллеги завершили прибрежный атлас в 1821 году.'
    story_prose:
      opening:
        - 'Эдо, 11 июня 1800 года. Ино Тадатака, пятидесяти пяти лет, отправляется со своей исследовательской группой в составе шести человек, чтобы идти на север, пересечь пролив до Эдзо и проложить линию вдоль его побережья. Это его первый опрос. Позже он обошел берега всей Японии, а через три года после его смерти его коллеги закончили карты побережий Великой Японии.'
        - 'Исторически сёгунат давал лишь скромное пособие, и большая часть расходов на дорогу шла из его собственного кармана; съемку эту совершали пешком, и мерная веревка вошла только со второй; группа проследовала вдоль южного побережья Эдзо до Нисибецу, а затем повернула обратно тем же маршрутом. В этом отделении носильщик в группе вслух считает шаги, а рыбак на берегу знает, куда поворачивает берег.'
        - 'В этом путешествии могут помочь несколько типов людей: кто-то, кто умеет вести счета или занимался торговлей, чтобы продержаться, когда деньги иссякают, или кто-то аккуратный и крепкий, или кто-то с синтезатором питательных веществ; тот, кто занимался плотницкими работами, постройкой лодок или ремонтом сетей, или разбирается в инженерном деле, или умел и осторожен, чтобы точно измерить участок дороги; кто-то очень крепкий и привыкший к долгим дорогам, кто-то, кто знает навигацию, полеты или геологию, или кто-то с дроном-разведчиком.'
      outcomes:
        all: 'Той зимой отряд вернулся в Эдо, через сто восемьдесят дней после отъезда. На принесенных им листах берег Эдзо пролегал мимо Нисибецу, а рядом с цифрами одного участка была пометка, что он был измерен веревкой.'
        p3: 'Той зимой компания вернулась в Эдо. Береговая линия проходила немного мимо Нисибецу и заканчивалась небольшим мысом.'
        p2: 'Той зимой компания вернулась в Эдо. На листе рядом были написаны шаги и длина береговой линии одного участка берега; на очередном осмотре группа взяла с собой мерную веревку.'
        p1: 'Той зимой отряд вернулся в Эдо тем же маршрутом, через сто восемьдесят дней после отъезда. Измерительный состав отправился с ним еще в несколько дальних путешествий.'
      none: 'В конце августа кошелек опустел, группа собрала вещи и направилась обратно в Нисибецу. Счет носильщика по всей дороге становился все тише, и последние строки подсчетного листа оставались пустыми.'
      desync: 'В конце августа деньги закончились, и партия вернулась к Нисибецу. Когда {staff} был отозван, измерительный посох все еще стоял на песке на полпути, а прилив поднялся более чем на половину пути.'
      not_admitted: '{staff} так и не попал в исследовательскую группу и несколько раз помогал рыбаку вытаскивать сети. Пока он говорил о том, куда поворачивает берег, шеренга людей, идущих дальше на восток вдоль песка, отсчитывала свой путь, скрывшись из виду.'
      points:
        p2:
          class_seafaring: 'Август, на юго-восточном побережье Эзо. Группа, как и прежде, отмеряла шаг за шагом, носильщик считал вслух, но по песку и гальке один и тот же участок, пройденный дважды, никогда не давал одинакового счета. {staff}, привыкший завязывать узлы на корабле, достал моток тонкого шнура, завязал в нем узел через каждый интервал, проверил промежутки между узлами с помощью мерной рейки и с носильщиком на другом конце потянул его прямо вдоль берега. Ино написала меру шнура рядом с количеством шагов и провела короткую линию между двумя рядами цифр. Носитель намотал веревку обратно на руку, узлы один за другим выскальзывали из его пальцев.'
          class_craft: 'Август, на юго-восточном побережье Эзо. Группа, как и прежде, отмеряла шаг за шагом, носильщик считал вслух, но по песку и гальке один и тот же участок, пройденный дважды, никогда не давал одинакового счета. {staff}, привыкший работать вручную, скрутил отрезок тонкого шнура, завязал на нем узел через каждый интервал, проверил промежутки между узлами с помощью мерной рейки и вместе с носильщиком на другом конце протянул его прямо вдоль берега. Ино написала меру шнура рядом с количеством шагов и провела короткую линию между двумя рядами цифр. Носитель намотал веревку обратно на руку, узлы один за другим выскальзывали из его пальцев.'
          else: 'Август, на юго-восточном побережье Эзо. Группа, как и прежде, отмеряла шаг за шагом, носильщик считал вслух, но по песку и гальке один и тот же участок, пройденный дважды, никогда не давал одинакового счета. {staff} достал моток завязанного шнура, проверил зазоры между узлами один за другим с помощью измерительной рейки и с носителем на другом конце потянул его прямо вдоль берега. Ино написала меру шнура рядом с количеством шагов и провела короткую линию между двумя рядами цифр. Носитель намотал веревку обратно на руку, узлы один за другим выскальзывали из его пальцев.'
        p1:
          class_lettered: 'Конец августа, а кошелек почти опустел. Пособие сёгуната никогда не было большим, остальная часть расходов шла из собственного кармана Ино, а до Нисибецу оставалось еще несколько дней. {staff}, привыкший работать за столом, раздавал оставшиеся деньги монета за монетой, записывал стоимость проживания на каждую ночь и каждый предстоящий прием пищи и отмечал предметы, на которых можно было сэкономить. Вечеринка продолжалась, как прежде. В тот день, когда они достигли Нисибецу, носильщик отсчитал последний отрезок пути, и его голос пропал. Ино толкнула измерительную рейку в песок и написала слово Нишибэцу в последней строке протокола.'
          class_trade: 'Конец августа, а кошелек почти опустел. Пособие сёгуната никогда не было большим, остальная часть расходов шла из собственного кармана Ино, а до Нисибецу оставалось еще несколько дней. {staff}, которые занимались торговлей, пошли в рыбацкую деревню, чтобы поторговаться, обменяли рис на несколько дней сушеной рыбы и сбили цену на жилье. Вечеринка продолжалась, как прежде. В тот день, когда они достигли Нисибецу, носильщик отсчитал последний отрезок пути, и его голос пропал. Ино толкнула измерительную рейку в песок и написала слово Нишибэцу в последней строке протокола.'
          else: 'Конец августа, а кошелек почти опустел. Пособие сёгуната никогда не было большим, остальная часть расходов шла из собственного кармана Ино, а до Нисибецу оставалось еще несколько дней. {staff} разделил оставшуюся еду на небольшие пакеты, по одному на каждый день, раздал по одному каждое утро и съел не больше этой доли. Вечеринка продолжалась, как прежде. В тот день, когда они достигли Нисибецу, носильщик отсчитал последний отрезок пути, и его голос пропал. Ино толкнула измерительную рейку в песок и написала слово Нишибэцу в последней строке протокола.'
        p3:
          class_seafaring: 'Начало сентября, и отряд достиг Нисибецу, где планировалось повернуть назад. Осенний ветер с каждым днем становился все сильнее, а побережье на востоке тянулось неудержимо. {staff}, привыкший читать небо и приливы и отливы на море, показал ему, какой мыс можно обогнуть и когда закончится прилив, и повел группу дальше вдоль берега. Группа прошла мимо Нисибецу и сделала еще один шаг. Рыбак встал на камень и указал туда, куда поворачивал берег, а Ино остановилась и сделала еще один пеленг. В первую ночь обратного пути он расстелил лишнюю простыню на коленях и медленно провел пальцем по берегу.'
          else: 'Начало сентября, и отряд достиг Нисибецу, где планировалось повернуть назад. Осенний ветер с каждым днем становился все сильнее, а побережье на востоке тянулось неудержимо. {staff}, сильные на дороге, пошли вперед с рюкзаком, чтобы разведать участок, и вернулись, чтобы выкопать песок, где можно остановиться и где можно пересечь реку. Группа прошла мимо Нисибецу и сделала еще один шаг. Рыбак встал на камень и указал туда, куда поворачивал берег, а Ино остановилась и сделала еще один пеленг. В первую ночь обратного пути он расстелил лишнюю простыню на коленях и медленно провел пальцем по берегу.'
      excerpts:
        p3: 'Рыбак встал на камень и указал туда, куда поворачивал берег, а Ино остановилась и сделала еще один пеленг. В первую ночь обратного пути он расстелил лишнюю простыню на коленях и медленно провел пальцем по берегу.'
        p2: 'Ино написала меру шнура рядом с количеством шагов и провела короткую линию между двумя рядами цифр. Носитель намотал веревку обратно на руку, узлы один за другим выскальзывали из его пальцев.'
        p1: 'В тот день, когда они достигли Нисибецу, носильщик отсчитал последний отрезок пути, и его голос пропал. Ино толкнула измерительную рейку в песок и написала слово Нишибэцу в последней строке протокола.'
    relic: 'Мерная рейка'
    relic_desc: 'Тонкая рейка для измерения шагов, размеченная шкалой.'
    points:
      p1: 'Когда деньги закончатся, продолжайте путь группы, чтобы вовремя проложить линию до Нисибецу.'
      p2: 'Помогите ему измерить один участок берега веревкой, а не шагами, чтобы его числа были правильными первыми.'
      p3: 'Помогите ему проложить линию мимо Нисибецу, чтобы это исследование охватило участок побережья, которого он никогда не достигал.'
    points_fail:
      p1: 'Отряд не смог удержаться и повернул назад перед Нисибецу, а в Эдо не было карты этой дороги.'
      p2: 'В этой ветке каждый участок Эзо по-прежнему представляет собой лишь счет шагов.'
      p3: 'Обзор все равно вернулся к Нишибэцу, как и в истории.'
    shift:
      p1:
        was: 'В 1800 году исследовательская группа Ино Тадатака работала вдоль юго-восточного побережья Эдзо до Нисибецу и повернула обратно в Эдо.'
      p2:
        was: 'Первое обследование, проведенное в 1800 году, проводилось пешком; мерная веревка вошла только со второй.'
        now: 'Сначала один участок побережья Эдзо был измерен веревкой.'
      p3:
        was: 'Первая съемка 1800 года закончилась в Нисибецу, а остальная часть побережья Хоккайдо ждала более поздних съемок.'
        now: 'Линия прошла мимо Нисибецу еще на один отрезок, и листы, которые он привез обратно в Эдо, показали немного больший берег.'
    vignettes:
      bend: '{staff} видит изгиб берега, который должен быть нарисован, как часть прямой линии, и запрашивает еще один пеленг на повороте, поэтому изгиб остается на странице.'
      repeat: '{staff} второй раз проходит отрезок в том же темпе и записывает два счета рядом, не делая выбора между ними.'
      sketch: '{staff} рисует контур разворотной полосы на обратной стороне контрольного листа, пока остальные отдыхают, и отмечает место, где была проложена линия.'
  lalibela_rock:
    name: 'Два слоя в стенке траншеи'
    place: 'Лалибэла, Эфиопия'
    figure: 'Рабочие на раскопках в Лалибэле'
    story: 'Первый этап консервации Лалибелы начался 19 декабря 1966 года. Расчистка скопившихся отложений обнажила траншеи, вырезанные в скале. Позже археологи сообщают, что от находок, сделанных в 1960-х годах, сохранилось лишь несколько фотографий, без архива, документирующего их по отдельности.'
    relic: 'Чертеж стены траншеи'
    relic_desc: 'В разрезе фиксируется толщина каждого слоя и положение черепков в почве.'
    points:
      p1: 'Прежде чем поднимется следующая корзина, измерьте слои с помощью траншейной бригады и оставьте локальную копию разреза с пометкой обнаженных осколков.'
    points_fail:
      p1: 'Экипаж вывозит грунт. Положение осколков в этом разделе больше невозможно измерить.'
    shift:
      p1:
        was: 'Немногочисленных фотографий, сохранившихся после расчистки, недостаточно для восстановления первоначальных слоев и положения находок.'
        now: 'Копия участка траншеи остается в городе. Более поздний геодезист все еще может проверить толщину слоев и положение осколков на этом участке.'
    vignettes:
      work: '{staff} наблюдает, как рабочий бреет лицо узкой лопатой, пока бледная линия на земле не становится отчетливой.'
    story_prose:
      opening:
        - 'Лалибела, зима 1966 года. Корзины, выходящие из траншеи, полны камней и грязи. Там, где каменная стена изгибается, под влажной почвой виден более светлый слой. В нем до сих пор сохранилось несколько керамических черепков.'
        - 'В ходе работ были обнаружены давно засыпанные траншеи. За всю историю из находок сохранилось лишь несколько фотографий. Одна только фотография не вернет осколок на место.'
        - 'На следующем проходе экипаж будет копать за поворотом. Еще есть время для того, кто сможет прочитать слои и сделать рисунок на месте.'
      points:
        p1: '{staff} просит человека с корзиной подождать, устанавливает правило относительно линии между слоями и измеряет расстояние от камня до ближайшего черепка. Рабочий называет цифры и отмечает ту же точку на втором чертеже. Второй лист остается в городе.'
      outcomes:
        all: 'Спустя годы кто-то разворачивает местную копию и придерживается правила против камня. Бледный слой на старом рисунке находится на этом конце правила.'
        p1: 'Спустя годы кто-то разворачивает местную копию и придерживается правила против камня. Бледный слой на старом рисунке находится на этом конце правила.'
      none: 'Пустая корзина соскальзывает обратно в траншею. Лицо, на котором виднелись осколки, было выскоблено, и земля ушла вместе с предыдущим грузом.'
      not_admitted: '{staff} не может затонуть вместе с экипажем. Кто-то на ободе берет натянутую леску и обматывает ею доску.'
      excerpts:
        p1: '{staff} просит человека с корзиной подождать, устанавливает правило относительно линии между слоями и измеряет расстояние от камня до ближайшего черепка. Рабочий называет цифры и отмечает ту же точку на втором чертеже.'
  ife_bronzes:
    name: 'План до засыпки траншей'
    place: 'Иле-Ифе, Нигерия'
    figure: 'Археологи Ита-Йему'
    story: 'Спасательные раскопки на Ита Йемоо в Иль-Ифе начались в декабре 1957 года. Бригады обнажили древние тротуары из керамических черепков. Первый большой тротуар позже был перекрыт крышей, но большинство траншей было засыпано. Позже археологам пришлось собирать свои позиции по разрозненным зарисовкам, записям и фотографиям.'
    relic: 'План траншеи с базовой линией'
    relic_desc: 'Лист привязывает позиции нескольких траншей к фиксированной линии у дороги.'
    points:
      p1: 'Прежде чем траншеи будут заполнены, привяжите их к общей базовой линии и оставьте план в Ife, который можно будет снова изучить.'
    points_fail:
      p1: 'Траншеи засыпаются. По мере изменения местности последующие команды могут использовать только разбросанные записи, чтобы найти, где был сделан каждый разрез.'
    shift:
      p1:
        was: 'После того, как большая часть траншей была засыпана, у более поздних археологов не было подробного плана ранних раскопок, и им пришлось реконструировать планировку.'
        now: 'План траншеи с фиксированными ориентирами остается в Ифе. Позже бригады смогут использовать его для поиска старых траншей.'
    vignettes:
      work: '{staff} наблюдает, как лента сматывается обратно на катушку, образуя пятно земли между двумя цифрами.'
    story_prose:
      opening:
        - 'Иль-Ифе, декабрь 1957 года. У дороги люди стоят на коленях в грязи, счищая край тротуарной плитки. Они закалывают край разреза, чтобы никто не вмешался.'
        - 'Позже крыша укрыла первый большой тротуар. Большинство траншей было засыпано. В истории вернувшиеся люди годами собирали воедино позиции из блокнотов, рисунков и фотографий.'
        - 'Сокращения остаются открытыми и сегодня. Кто-то, кто сможет их обследовать и сверить измерения с командой, сможет привязать их все к одному ориентиру.'
      points:
        p1: '{staff} и команда подводят ленту к фиксированной отметке на дороге и называют расстояние до каждого угла. Рабочий расставляет точки на полевом чертеже, затем копирует те же точки на лист, чтобы остаться в Ифе.'
      outcomes:
        all: 'Спустя долгое время после того, как земля была засыпана, геодезист находит отметку у дороги и прослеживает расстояние по плану до угла старой траншеи. Никакой траншеи, которую можно было бы увидеть, не осталось.'
        p1: 'Спустя долгое время после того, как земля была засыпана, геодезист находит отметку у дороги и прослеживает расстояние по плану до угла старой траншеи. Никакой траншеи, которую можно было бы увидеть, не осталось.'
      none: 'Рыхлая земля выравнивается за последним углом. Два эскиза лежат один поверх другого и не имеют общей ссылки. Очереди все равно не сойдутся.'
      not_admitted: '{staff} не может войти с экипажем. Кто-то за забором замечает ленту, волочившуюся по грязи.'
      excerpts:
        p1: '{staff} и команда подводят ленту к фиксированной отметке на дороге и называют расстояние до каждого угла. Рабочий расставляет точки на полевом чертеже, затем копирует те же точки на лист, чтобы остаться в Ифе.'
  great_zimbabwe:
    name: 'Земляная площадка у стены'
    place: 'Масвинго, Зимбабве'
    figure: 'Рабочие Западной ограды'
    story: 'В 1915 году большая часть глиняных платформ, скамеек и стен Западного ограждения в Великом Зимбабве была удалена. Работа была основана на опасениях, что земляные конструкции ставят под угрозу стены из сухого камня. Обнаженная яма впоследствии продолжала разрушаться.'
    story_prose:
      opening:
        - 'Великий Зимбабве, 1915 год. Земляные платформы и скамейки все еще стояли у подножия каменных стен Западного ограждения. На поляне было отмечено, что и их нужно убрать.'
        - 'В истории большая часть земляных построек была удалена, а обнаженная яма продолжала разрушаться. В этой ветке кто-то может посмотреть на соединение с рабочими до того, как они достигнут этой части стены.'
        - 'Для этой поездки нужен кто-то, кто понимает, на что они смотрят на стене, и может объяснить это людям, выполняющим работу. Им придется найти участок, который стоит покинуть, до начала расчистки.'
      points:
        p1: '{staff} проверяет соединение с рабочими и указывает участок, который они могут покинуть, затем ждет, пока они отодвинут линию зазора дальше. Рабочий выгоняет кол за пределы платформы. Старый след пальца на земной поверхности до сих пор встречается на стыке двух камней.'
      outcomes:
        all: 'Позже геодезист приседает у стены и прокладывает линейку поперек оставшейся платформы. Один край упирается в землю, а другой лишь касается камня.'
        p1: 'Позже геодезист приседает у стены и прокладывает линейку поперек оставшейся платформы. Один край упирается в землю, а другой лишь касается камня.'
      none: 'Рабочие уносят пустую корзину. Земля в яме все еще видна свежая, с бледной линией там, где платформа соприкасается со стеной.'
      not_admitted: '{staff} не находит места среди рабочих в Западном корпусе. Когда эскиз разослан, у подножия стены виден только небольшой угол.'
      excerpts:
        p1: 'Рабочий выгоняет кол за пределы платформы. Старый след пальца на земной поверхности до сих пор встречается на стыке двух камней.'
    relic: 'Эскиз участка стены'
    relic_desc: 'На рисунке земляная площадка примыкает к подножию стены сухой кладки.'
    points:
      p1: 'Осмотрите подножие стены вместе с местными рабочими и оставьте одну часть земляной платформы на месте перед расчисткой.'
    points_fail:
      p1: 'Как и в истории, большая часть земляных построек снесена. Этот раздел не остается на месте.'
    shift:
      p1:
        was: 'В 1915 году во время расчистки были сняты многие земляные площадки, скамейки и стены Западного ограды.'
        now: 'В этом ответвлении в Западном ограждении сохранился участок земляной платформы. Более поздние геодезисты все еще могут видеть, как оно встречалось с каменной стеной.'
    vignettes:
      lines: '{staff} провожает взглядом подножие стены. Край платформы опускается только в месте соединения.'
      width: '{staff} содержит чертеж рабочего. У каменной стены и платформы есть своя линия.'
      pace: '{staff} сидит на ступеньке и стряхивает засохшую грязь с ботинка. Крошки падают на песчаную землю.'
  omar_khayyam_nishapur:
    name: 'Первый день весны'
    place: 'Исфахан, Персия'
    figure: 'Омар Хайям'
    story: 'В 1070-х годах султан Малик-Шах собрал астрономов для проведения наблюдений. Омар Хайям работал с учеными при своем дворе в Исфахане. Календарь Джалали вступил в употребление 15 марта 1079 года и положил начало солнечного года в день весеннего равноденствия.'
    story_prose:
      opening:
        - 'Исфахан, весна 1079 года. Ученые, собранные Малик-Шахом, пересматривают календарь. Хайям принял участие в наблюдениях, и новый отсчет года начинается с весеннего равноденствия.'
        - 'Исторически новый календарь вступил в употребление в марте. Программа наблюдения завершилась после смерти Малик-Шаха. Хайям упомянул написанную им книгу об извлечении корней, которая не сохранилась. В этой ветке у переписчика альманаха имеется лист, на котором можно разместить еще несколько строк.'
        - 'В этой поездке нужен кто-то, кто сможет проверять показания теней и следить за правильностью старых и новых колонок. Также нужен кто-то, кто сможет проверить рукопись и отправить копию в другой город.'
      points:
        p1: 'Перед равноденствием {staff} сопоставляет концы теней с предыдущими показаниями, сортирует смешанный столбец и просит Хайяма сверить его с исходными отметками. По краю таблицы показаний проходят две складки. Когда солнце садится низко, лист все еще открыт, и чернила в столбце снова находятся внутри строк.'
        p2: '{staff} проверяет книгу переписчика по извлечению корней, сравнивает легко ошибающиеся числа с оригиналом и передает рукопись кому-то, направляющемуся в другой город. Посыльный оборачивает копию тканью, завязывает ее и вытягивает одну сторону обратно. Заголовок обращен наружу, а край бумаги все еще виден на ощупь под первым сгибом.'
      outcomes:
        all: 'Дата той весны вошла в новый календарь. Спустя годы кто-то потянулся за книгой о корнях в другом городе, старые уголки которого все еще закручиваются.'
        p2: 'Кто-то в другом городе позже скопировал всю книгу еще раз. Они начали с первой строки, рядом со старой потрепанной рукописью.'
        p1: 'Календарь начинался в назначенный день. Остался один лист сравнения, два заголовка лежали рядом.'
      none: 'Старый стол вернулся в коробку. Снаружи лежал незавершенный лист, постукивавший по краю всякий раз, когда дул ветер.'
      not_admitted: '{staff} так и не нашел себе места у переписчиков. Лист повернулся внутри двери, а снаружи заголовок исчез.'
      desync: 'Колонки все еще не сошлись, когда лист был собран. Когда {staff} был отозван, последнее показание все еще отсутствовало.'
      excerpts:
        p2: 'Посыльный оборачивает копию тканью, завязывает ее и вытягивает одну сторону обратно. Заголовок обращен наружу, а край бумаги все еще виден на ощупь под первым сгибом.'
        p1: 'По краю таблицы показаний проходят две складки. Когда солнце садится низко, лист все еще открыт, и чернила в столбце снова находятся внутри строк.'
    relic: 'Календарный лист с двумя заголовками'
    relic_desc: 'Лист, на котором рядом отмечены даты Нового года по старому и новому календарям.'
    points:
      p1: 'В дни перед равноденствием сохраняйте фиксирующие его теневые показания, чтобы новый календарь начинался в назначенный для него день.'
      p2: 'Помогите ему сделать еще один экземпляр его книги по извлечению корней и отправить его на хранение в другой город, чтобы он сохранился в этой ветке.'
    points_fail:
      p1: 'Показания равноденствия не совпали, и новый календарь не начался 15 марта.'
      p2: 'Книга потерялась все так же, как и история.'
    shift:
      p1:
        was: '15 марта 1079 года новый календарь султана Малик Шаха вступил в употребление в установленный день, год, начинающийся с весеннего равноденствия.'
      p2:
        was: 'Книга Хайяма по извлечению корней утеряна, известна лишь по упоминанию в его «Алгебре».'
        now: 'Один экземпляр был отправлен в другой город и помещен в библиотеку, и люди все еще могли читать его столетия спустя.'
        who: 'omar_khayyam_nishapur'
        bio: 'В этом отношении его книга о корнях не исчезла с годами обсерватории. Копию, хранившуюся в другом городе, продолжали читать и копировать после его смерти.'
    vignettes:
      spring: '{staff} кладет старую таблицу и новую рядом и напротив каждой даты записывает, к какой дате она принадлежит, чтобы следующему читателю не пришлось гадать.'
      carry: '{staff} копирует два заголовка сложенного листа на его внешнюю сторону, чтобы тот, кто носит его, мог видеть, какие столбцы сравнивать, не разворачивая его.'
      future: '{staff} знает, как этот календарь будет написан позже, и сохраняет дату расчета, которую используют переписчики, а не ту, которую они никогда не видели.'
  wright_kitty_hawk:
    name: 'Двенадцать секунд в воздухе'
    place: 'Китти Хок, Северная Каролина'
    figure: 'Орвилл и Уилбер Райт'
    story: 'В сентябре 1903 года братья Райт вернулись в свой лагерь недалеко от Китти-Хок с механической машиной. Попытка Уилбура 14 декабря провалилась. Утром 17 декабря они совершили четыре полета: первый из двенадцати секунд и последний из пятидесяти девяти. В тот же день они отправились в Китти-Хок и телеграфировали отцу в Дейтон.'
    story_prose:
      opening:
        - 'Рядом с Китти-Хок, декабрь 1903 года. Братья Райт привезли с собой флаер с двигателем. Попытка 14-го числа провалилась. Рельс нужно прокладывать заново, а ветер все еще дует.'
        - 'В истории первый полет 17-го числа длился двенадцать секунд. После четвертого приземления порыв ветра перевернул машину, и Джон Дэниелс из спасательной станции оказался зажат между крыльями. В этом отделении в лагере есть еще одна пара рук, которая помогает с рельсами и машиной на земле.'
        - 'В этом путешествии нужен кто-то, кто сможет держать ногу на ветру. Кто-то с подходящим оборудованием также может помочь устойчиво удерживать широкое крыло.'
      points:
        p1: 'Перед взлетом {staff} проверяет песок под поручнями и направляет крыло по ветру, пока оно не выйдет за пределы досягаемости. Дэниелс стоит у камеры. Законцовка крыла пересекает конец направляющей, а под ней яркая полоса песка.'
        p2: 'После четвертого приземления {staff} чувствует усиление ветра и помогает спасательной команде удержать крыло и отвести Дэниелса. Песок катится под крылом, а руки на его краю держатся. Когда ветер стихает, на ткани лежит слабая полоска песка.'
      outcomes:
        all: 'Расстояния ушли в телеграм. Упаковывая флаер, братья еще раз протерли ткань, оставив на дне коробки тонкий слой песка.'
        p2: '«Флаер» еще несколько раз пролетел над дюнами. Тот, кто его упаковал, проложил рядом с тканью кусок троса и закрыл крышку.'
        p1: 'На ноты ушло двенадцать секунд и сто двадцать футов. Фотография лежала рядом с этой страницей.'
      none: 'Ветер пересек лагерь и снова закопал подножие перил. В печи виднелась только красная точка.'
      not_admitted: '{staff} не нашел места среди помощников. Проходя мимо сарая, один конец рельса все еще виднелся над песком.'
      desync: 'Крыло заскребло песок, и «Флаер» остановился у поручня. Когда {staff} был отозван, ветер все еще поднимал ткань.'
      excerpts:
        p2: 'Песок катится под крылом, а руки на его краю держатся. Когда ветер стихает, на ткани лежит слабая полоска песка.'
        p1: 'Дэниелс стоит у камеры. Законцовка крыла пересекает конец направляющей, а под ней яркая полоса песка.'
    relic: 'Лопасть пропеллера'
    relic_desc: 'Деревянная лопасть в форме изогнутого крыла.'
    points:
      p1: 'Утром 17 декабря на холодном ветру помогите братьям стабилизировать «Флайер» и обеспечить безопасность первого взлета.'
      p2: 'После четвертого полета удерживайте Флайер на песке и спасите Дэниелса и машину.'
    points_fail:
      p1: 'Перед взлетом порыв ветра поднимает одно крыло и утаскивает его в песок, и машина так и не отрывается от рельсов; в этой ветке нет двенадцати секунд.'
      p2: 'Ветер переворачивает «Флаер», Дэниелс попадает в крылья и падает вместе с ним, и, как и в истории, машина слишком сломана, чтобы снова летать. В этой ветке он никогда не отрывается от земли после полудня.'
    shift:
      p1:
        was: 'Утром 17 декабря 1903 года Орвилл пролетел 12 секунд и 120 футов.'
      p2:
        was: '17 декабря 1903 года, после четвертого полета, порыв ветра перевернул «Флаер», Джон Дэниэлс застрял между крыльями, и машина, сильно сломанная, больше никогда не летала.'
        now: '{staff} и сотрудники станции прижали его к песку, и Дэниэлса не поймали. Той зимой братья еще несколько раз пролетели на нем над дюнами, прежде чем отправить его в ящик для Дейтона.'
    vignettes:
      numbers: '{staff} копирует четыре полета в блокнот в том порядке, в котором они были сделаны: секунды в одном столбце, а футы в другом, и складывает их дважды, прежде чем погаснет свет.'
      sand: '{staff} выкапывает рельс из сугроба после ночного ветра и утрамбовывает песок у его подножия. Помощник станции, подготовленный к игре, говорит, что к утру ветер утихнет, но это не так.'
      cold: '{staff} поддерживает работу печки в сарае, пока двигатель прогрет. Лужи снаружи замерзли, и никто об этом не упоминает.'
  van_gogh_auvers:
    name: 'Лето в Овере'
    place: 'Овер-сюр-Уаз'
    figure: 'Винсент ван Гог'
    story: 'Винсент ван Гог приехал в Овер-сюр-Уаз 20 мая 1890 года, поселился в отеле Auberge Ravoux и часто навещал доктора Поля Гаше. Он рисовал почти по работе в день. В письме примерно от 10 июля он писал об огромных полях пшеницы под тревожным небом. 27 июля он выстрелил себе в грудь и умер 29 июля вместе со своим братом Тео.'
    story_prose:
      opening:
        - 'Овер-сюр-Уаз, лето 1890 года. Ван Гог остановился в отеле Auberge Ravoux и рисует почти каждый день. В июльском письме он пишет о широких пшеничных полях под беспокойным небом.'
        - 'Исторически он беспокоился о средствах к существованию семьи своего брата и умер в Овере в конце того же месяца. В этой ветке на пути между пшеницей и гостиницей есть кто-то, кто подержит для него холст или выслушает его.'
        - 'В этой поездке нужен кто-то, кто сможет удержать мольберт на ветру, кто-то, кто сможет разобраться в домашних счетах, и кто-то, кто будет слушать. С ним в гостинице может посидеть и человек, знающий уход.'
      points:
        p1: 'Ветер толкает холст. {staff} упирается в свободную ножку мольберта и удерживает наветренный угол, пока Ван Гог делает свои последние мазки. Дальняя пшеница склоняется первой, а стебли рядом еще шевелятся. Когда Ван Гог опускает кисть, нижняя часть холста все еще находится на ширине пальца над землей.'
        p2: '{staff} вместе с ним разкладывает письма, переходит от работы Тео к домашним расходам и отмечает, что можно уладить на краю листа. Ван Гог складывает лист обратно в конверт. Прежде чем убрать его, он разглаживает клапан ладонью.'
        p3: '{staff} выкладывает нарисованные пшеничные поля одно за другим и говорит ему, что люди пройдут долгий путь до галереи, чтобы посмотреть на эту землю и небо. Ван Гог перемещает самую дальнюю картину обратно на середину стола. В комнате темнеет, но тонкая желтая линия все еще видна.'
        p4: '{staff} остается в гостинице в самые тяжелые дни, заботится об отдыхе и ежедневных заботах и ждет, пока Ван Гог сам захочет открыть окно. Девушка из гостиницы ставит поднос у двери. Ван Гог берет его и отодвигает в сторону, чтобы освободить место для своих красок.'
      outcomes:
        all: 'После лета поля приобрели другие цвета. У двери гостиницы все еще сушились простыни, под которыми было спрятано письмо.'
        p4: 'Осенью жители гостиницы все еще видели, как он выносил краски. Когда дверь открылась, в его кармане показался оловянный конец трубки.'
        p3: 'Позже люди останавливались перед этими полями в галерее. Шаг ближе, и желтый, казалось, был почти в пределах досягаемости.'
        p2: 'Письмо о семье осталось на столе в гостинице. Когда его снова открыли, рядом с едва заметной складкой виднелась небольшая линия.'
        p1: 'Поле осталось на картине. Позже, когда его держали у окна, на горизонте показались две толщи краски.'
      none: 'В коридоре гостиницы послышались шаги. Когда поднос вернулся, вода в чашке все еще была ровной.'
      not_admitted: '{staff} не нашел места в гостинице. За тропинкой была видна часть поля, но угол здания скрывал дорогу.'
      desync: 'Мольберт лежал на боку среди пшеницы. Когда {staff} был отозван, стебель, зацепившийся за одну из его ног, все еще кивал на ветру.'
      excerpts:
        p4: 'Девушка из гостиницы ставит поднос у двери. Ван Гог берет его и отодвигает в сторону, чтобы освободить место для своих красок.'
        p3: 'Ван Гог перемещает самую дальнюю картину обратно на середину стола. В комнате темнеет, но тонкая желтая линия все еще видна.'
        p2: 'Ван Гог складывает лист обратно в конверт. Прежде чем убрать его, он разглаживает клапан ладонью.'
        p1: 'Дальняя пшеница склоняется первой, а стебли рядом еще шевелятся. Когда Ван Гог опускает кисть, нижняя часть холста все еще находится на ширине пальца над землей.'
    relic: 'Тюбик хромовой жёлтой краски'
    relic_desc: 'Смятый жестяной тюбик краски, которой он писал поля.'
    points:
      p1: 'Под грозовым небом помогите ему закончить пшеничное поле и не допускайте падения холста на пшеницу.'
      p2: 'После визита в Париж помогите ему обсудить финансовые проблемы Тео, чтобы на него не обрушилась буря.'
      p3: 'Дайте ему знать, что его картины запомнят.'
      p4: 'До 27 июля исцелите его тело и разум и сохраните ему жизнь.'
    points_fail:
      p1: 'Полотно по ветру ушло в пшеницу, и в этой ветке нет Пшеничного поля под Грозовыми тучами.'
      p2: 'Он вернулся из Парижа, все еще чувствуя, как буря, грозившая Тео, давит и на него. В этом отделении ему никто не помог прояснить денежный вопрос.'
      p3: 'Он все еще чувствовал, что его картины обременяют Тео. В этой отрасли ему никто никогда не говорил, где окажутся эти пшеничные поля.'
      p4: '27 июля произошло так, как случилось в истории. В этой ветке он не рисовал еще один сезон.'
    shift:
      p1:
        was: 'В начале июля 1890 года Ван Гог нарисовал обширные пшеничные поля под беспокойным небом и около 10 июля написал о них Тео и Джо.'
      p2:
        was: 'В начале июля 1890 года Ван Гог посетил семью Тео в Париже и узнал, что Тео подумывает оставить свой пост и обосноваться самостоятельно; еще в Овере он писал, что гроза, угрожающая Тео, тяготит и его.'
        now: 'Когда он вернулся из Парижа, он знал, как поведет себя дом Тео, и вернулся в поля с одним весом меньше.'
      p3:
        was: 'В июле 1890 года Ван Гог писал, что чувствует себя неудачником и не видит хорошего будущего; за свою жизнь он продал несколько картин.'
        now: 'Кто-то сказал ему, что однажды эти пшеничные поля будут висеть на стенах музеев, и что многие люди будут приезжать, чтобы увидеть их.'
      p4:
        was: 'Он был ранен выстрелом 27 июля 1890 года и умер в Овере два дня спустя, рисуя всего около десяти лет.'
        now: '{staff} оставался с ним до июля, болезнь не сломила его снова, и когда лето закончилось, он все еще находился в отеле Auberge Ravoux. Он рисовал еще несколько лет, и после пшеничных полей были и другие времена года.'
    vignettes:
      sky: '{staff} дважды рисует в блокноте одно и то же поле, сначала с полоской неба, а потом с гораздо большей, и видит во втором что-то, что первый спрятал.'
      wind: '{staff} ждет следующего порыва ветра над пшеницей и наблюдает, как темное пятно движется по ней, не стирая первого взгляда.'
      path: '{staff} идет по тропинке между полями до тех пор, пока не станет виден ее конец, а на обратном пути может сказать, куда она идет.'
  sor_juana_mexico_city:
    name: 'Последние отданные книги'
    place: 'Мехико'
    figure: 'Сор Хуана Инес де ла Крус'
    story: 'В 1690 году епископ Пуэблы без ее разрешения опубликовал критику проповеди Сор Хуаны под названием Carta Atenagórica с письмом, подписанным Sor Filotea. Ее ответ датирован 1 марта 1691 года. В 1693 году она продала свои книги и инструменты, а в 1694 году возобновила свои обеты. Она умерла 17 апреля 1695 года в монастыре Сан-Херонимо после того, как вылечила своих сестер во время эпидемии.'
    story_prose:
      opening:
        - 'Мехико, начало 1695 года. Книги и инструменты Хуаны были проданы двумя годами ранее. Она написала длинное письмо, защищая свое стремление к обучению. К тому времени, когда оно появилось в коллекции ее работ, ее уже не было.'
        - 'В истории по городу распространилась эпидемия. Хуана заботилась о тех, кто заболел и сама умерла в апреле. В этом отделении у пустых полок есть место для стола, где ухаживающие за больными могут оставить воду и сухие тряпки.'
        - 'В этой поездке нужен кто-то, кто сможет обеспечить переход палаты больного из рук в руки. Ему также нужны люди, которые знают, как ухаживать за больными, и имеют при себе необходимые лекарства или оборудование.'
      points:
        p1: 'Следующая смена опоздала. {staff} разложил воду, чистую одежду и пустые миски по разным местам и освободил руку, чтобы присмотреть за следующей кроватью. Кто-то у двери снова закатал оба рукава. Стопка сухих тряпок была ниже, и внизу все еще виднелась одна квадратная складка.'
        p2: 'Женщина на одной кровати не могла встать. {staff} остался, пока она пила, и ухаживал за ней, используя доступные лекарства и уход. После рассвета она потянулась к краю кровати. Когда {staff} протянула чашу, она освободила одну руку и обхватила ее основание.'
        p3: 'Хуана тоже заболела. {staff} угостил ее принесенными с собой припасами и подождал у кровати, пока она сможет сделать еще глоток. Она вернула пустую миску и коснулась страницы, лежащей рядом с подушкой. Кончики ее пальцев были мокрыми, и она подтолкнула бумагу к сухому углу кровати.'
      outcomes:
        all: 'После апреля обе женщины снова могли стоять за столом в палате больных. Один сложил свежевысушенные тряпки, а другой вернулся к пустым полкам и добавил на страницу несколько строк.'
        p3: 'После апреля Хуана снова могла сидеть за своим столом. Полки все еще были пусты, но на краю стола лежали свежеисписанные страницы.'
        p2: 'После апреля женщина вернулась, чтобы помочь в палате больного. Стоя возле кровати, на которой она лежала, она вытряхнула чистую ткань.'
        p1: 'Заболело больше людей, и работа в палате продолжалась. При смене дежурства кто-то поставил на стол чистые миски вверх дном.'
      none: 'Кувшин с водой простоял нетронутым всю ночь. На рассвете прямо под его изливом появилось пятно света, видимое через дверь.'
      not_admitted: '{staff} так и не попал в комнату, где лечили больных. Сквозь щель в двери едва виднелись ножка стола и пустая банка с водой.'
      desync: 'Никто не пришел занять место у постели больного. Когда агентство отозвало {staff}, таз с теплой водой все еще стоял в углу стола.'
      excerpts:
        p3: 'Она вернула пустую миску и коснулась страницы, лежащей рядом с подушкой. Кончики ее пальцев были мокрыми, и она подтолкнула бумагу к сухому углу кровати.'
        p2: 'После рассвета она потянулась к краю кровати. Когда {staff} протянула чашу, она освободила одну руку и обхватила ее основание.'
        p1: 'Кто-то у двери снова закатал оба рукава. Стопка сухих тряпок была ниже, и внизу все еще виднелась одна квадратная складка.'
    relic: 'Перо'
    relic_desc: 'Перо с разделенным кончиком рядом с пустой полкой.'
    points:
      p1: 'В те недели, когда болезнь распространяется, помогите ей поддерживать работу палаты и обеспечить совместный уход за сестрами.'
      p2: 'Спасти сестру, заболевшую во время эпидемии'
      p3: 'Когда она заболеет сама, вылечите ее'
    points_fail:
      p1: 'Руки в больничной палате заболевают одна за другой, и уход прерывается; в этом филиале ее забота о больных сестрах идет не так, как это было в истории.'
      p2: 'Она не выживает и, как и в истории, является одной из сестер, умирающих в те месяцы; в этом отделении еще одна койка в палате пуста.'
      p3: 'Как и в истории, она умирает 17 апреля. В этой ветке она не доживает до апреля.'
    shift:
      p1:
        was: 'Весной 1695 года по Мехико прошла эпидемия, и Сор Хуана ухаживала за заболевшими сестрами.'
      p2:
        was: 'Во время эпидемии весны 1695 года умерло несколько сестер ее монастыря.'
        now: 'Сестра дожила до апреля и, поправившись, вернулась, чтобы помочь в палате больных.'
      p3:
        was: '17 апреля 1695 года Сор Хуана умерла после того, как вылечила своих сестер от болезни.'
        now: '{staff} вылечил ее принесенными с собой лекарствами, и она дожила до апреля. В последующие годы она еще больше писала в монастыре; того, что она написала, нет в отчете об этой поездке.'
    vignettes:
