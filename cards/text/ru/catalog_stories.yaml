  pushkin_st_petersburg:
    name: 'Место до появления номера дома'
    place: 'Санкт-Петербург'
    figure: 'Александр Пушкин'
    story: 'В 1836 и 1837 годах Александр Пушкин жил в квартире на набережной Мойки у Конюшенного моста, в доме княгини Волконской. 27 января 1837 года по старому календарю, 8 февраля по новому, он дрался на дуэли с Жоржем Дантесом у Черной реки и был ранен в живот. Его привезли домой, и он умер там 29 января и 10 февраля по новому стилю. Похоронен рядом с матерью недалеко от родового имения Михайловское.'
    story_prose:
      opening:
        - 'Санкт-Петербург, январь 1837 года по новому стилю. Александр Пушкин с семьей живет на набережной Мойки у Конюшенного моста, в доме княгини Волконской, и на двери еще нет того номера, который она имеет сегодня. Он написал «Евгения Онегина» в стихах и часто считается основоположником современной русской литературы.'
        - 'В истории его долги росли всю ту зиму; 8 февраля по новому стилю он дрался на дуэли с Жоржем Дантесом у Черной реки, был ранен в живот и доставлен домой, а через два дня умер от перитонита в тридцать семь лет, оставив жену и четверых детей; царь позже расплатился с долгами. В этом филиале каждый, кто спрашивает дорогу в квартиру, спрашивает швейцара, а горничная часто посылает поручения на дальнюю сторону моста.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто умеет вести счета или занимался торговлей, или кто-то организованный и сообразительный, чтобы разобраться в куче счетов; кто-то, кто знает медицину, или кто-то с аптечкой, который остается устойчивым в кризисной ситуации; врач, принесший антибиотики, или медик с наноаптечкой.'
      outcomes:
        all: 'Когда февраль закончился, Пушкин все еще приходил в себя на Мойке, и счета на его столе слились в единый список. Он продолжал писать еще несколько лет, и «Современник» оставался у него в руках.'
        p3: 'Когда февраль закончился, он все еще приходил в себя на Мойке и мог подойти к окну, положив руку на стену. Еще несколько лет «Современник» оставался в его руках.'
        p1: 'Список остался под чернильницей. После этого домохозяйство тратило на него по одному предмету за раз.'
        p2: 'Он живым пришел домой на Мойку, был отнесен в кабинет и уложен там на диван. В зале люди, спрашивавшие новости, стояли на улице.'
      none: 'Вечером 8 февраля по новому стилю, в снегу у Черной реки, он не дожил до города. Стопка счетов все еще лежала на столе нетронутая.'
      desync: 'Вечером 8 февраля по новому стилю, на полпути в город, карета замолчала. Когда {staff} был отозван, он стоял на снегу с полуоткрытой дверью, а на земле лежала перчатка.'
      not_admitted: '{staff} в дом так и не попал, а лишь один раз прошёл по Мойке от моста с носильщиком, считая обороты до имени при указании направления. Носильщик сказал, что в последнее время все больше людей спрашивали дорогу, и все они искали дом у моста.'
      points:
        p1:
          class_lettered: 'Конец января по новому календарю, и на столе в кабинете лежит стопка счетов от принтера, за аренду, за кредит в магазинах, один на другом. {staff}, привыкший к офисной работе, разложил их одну за другой и скопировал их по дате и сумме в единый список, отмечая рядом с каждым, что платить в первую очередь, а что может подождать. Пушкин взял список, некоторое время рассматривал его и положил под чернильницу. Пачку купюр связали в пачку и убрали в ящик.'
          class_trade: 'Конец января по новому календарю, и на столе в кабинете лежит стопка счетов от принтера, за аренду, за кредит в магазинах, один на другом. {staff}, который немного занимался торговлей и знал, как работают магазины, рассортировал счета по стопкам по кредиторам, написал квитанцию для каждого высказывания, которое подождет, а какое нет, и скопировал их все в один список. Пушкин взял список, некоторое время рассматривал его и положил под чернильницу. Пачку купюр связали в пачку и убрали в ящик.'
          else: 'Конец января по новому календарю, и на столе в кабинете лежит стопка счетов от принтера, за аренду, за кредит в магазинах, один на другом. {staff}, осторожный по натуре, расставил счета по срокам их оплаты, скопировал их в единый список и проверил суммы построчно. Пушкин взял список, некоторое время рассматривал его и положил под чернильницу. Пачку купюр связали в пачку и убрали в ящик.'
        p2:
          class_medical: 'Вечер 8 февраля по новому стилю, в снегу у Черной речки. Дантес выстрелил первым; Пушкин был ранен в живот, потерял много крови, и его помогли сесть в карету, которая поспешила обратно в город. {staff}, обученный оказанию первой помощи, стоял на коленях в карете, прижимая рану, плотно обматывал ее чистой тканью слой за слоем, время от времени щупал пульс и не отпускал всю дорогу. Карета остановилась у дверей на Мойке, и швейцар выбежал с лампой. Пушкина внесли и положили на диван в кабинете, снег на его пальто еще не растаял.'
          else: 'Вечер 8 февраля по новому стилю, в снегу у Черной речки. Дантес выстрелил первым; Пушкин был ранен в живот, потерял много крови, и его помогли сесть в карету, которая поспешила обратно в город. {staff} открыл взятую с собой аптечку, прижал марлю к ране, также расстелил под собой пальто и поддерживал его рукой каждый раз, когда карета тряслась. Карета остановилась у дверей на Мойке, и швейцар выбежал с лампой. Пушкина внесли и положили на диван в кабинете, снег на его пальто еще не растаял.'
        p3:
          class_learned: '9 февраля по новому календарю. Он всю ночь пролежал на диване в кабинете; рана стала горячей, и он стиснул зубы от боли. {staff}, врач, увидел, что рана инфицирована, прочистил ее, дал принесенное с собой лекарство, наложил свежую марлю и осматривал его раз в час. Днем 10 февраля у него спала лихорадка; он попросил стакан воды и выпил два глотка, держа его в руках. За окном Мойка замерзла, и по мосту шли люди.'
          else: '9 февраля по новому календарю. Он всю ночь пролежал на диване в кабинете; рана стала горячей, и он стиснул зубы от боли. {staff}, имеющий медицинское образование, открыл принесенную с собой аптечку, дал лекарство, как сказано в инструкции, и следил за температурой, измеряя его раз в час. Днем 10 февраля у него спала лихорадка; он попросил стакан воды и выпил два глотка, держа его в руках. За окном Мойка замерзла, и по мосту шли люди.'
      excerpts:
        p3: 'Днем 10 февраля у него спала лихорадка; он попросил стакан воды и выпил два глотка, держа его в руках. За окном Мойка замерзла, и по мосту шли люди.'
        p2: 'Карета остановилась у дверей на Мойке, и швейцар выбежал с лампой. Пушкина внесли и положили на диван в кабинете, снег на его пальто еще не растаял.'
        p1: 'Пушкин взял список, некоторое время рассматривал его и положил под чернильницу. Пачку купюр связали в пачку и убрали в ящик.'
    relic: 'Книга его стихов'
    relic_desc: 'Небольшая книжечка со спрессованным листом на одно стихотворение.'
    points:
      p1: 'Помогите ему разобраться с растущими долгами, чтобы его жена и дети больше не жили от одного счета к другому.'
      p2: 'После того, как его застрелят, оставьте его в живых на обратном пути с Черной реки, чтобы он добрался до своей квартиры на Мойке.'
      p3: 'Вылечите огнестрельное ранение в его животе, сдержите инфекцию и сохраните ему жизнь.'
    points_fail:
      p1: 'В этом отделении счета за ту зиму все еще лежали у него на столе, и никто никогда их за него не сортировал.'
      p2: 'Он не дожил до Мойки, а в этой ветке нет двух дней в квартире.'
      p3: 'Днем 10 февраля он умер в квартире, как и в истории, и в этом отделении его не продержали еще ни одного дня.'
    shift:
      p1:
        was: 'Когда Пушкин умер в феврале 1837 года, у него остались тяжелые долги, которые позже расплатился Николай I.'
        now: 'Долги записывались на одном листе, какой платить в первую очередь, а какой мог подождать, и в хозяйстве знали, где он находится.'
      p2:
        was: 'После того как Пушкин был застрелен на дуэли 8 февраля 1837 года, его отвезли домой, в свою квартиру на Мойке.'
      p3:
        was: '10 февраля 1837 года он умер от перитонита в квартире в тридцать семь лет, оставив жену и четверых детей.'
        now: 'Лекарство {staff} остановило инфекцию в ране, и когда февраль закончился, он все еще лечился на Мойке. Он продолжал писать еще несколько лет, и «Современник» оставался у него в руках.'
    vignettes:
      number: '{staff} почти дает посетителю номер дома с еще не существующей музейной таблички, затем зачеркивает его и вместо этого рисует на листе мост.'
      queue: '{staff} записывает один и тот же ответ на нескольких листах, чтобы люди, ожидающие в холле, могли прочитать его, не спрашивая еще раз.'
      river: '{staff} идет от моста по Мойке с носильщиком и считает повороты, принадлежащие по направлению к двери.'
  chekhov_badenweiler:
    name: 'Ответ на виллу Фридерике'
    place: 'Баденвайлер'
    figure: 'Антон Чехов'
    story: 'В июне 1904 года Антон Чехов, сорок четыре года, тяжело больной туберкулезом, приехал со своей женой Ольгой Книппер на курорт Баденвайлер в Шварцвальде. Сначала они остановились в отеле «Рёмербад», затем на вилле Фридерике, затем в отеле «Зоммер», рядом с почтой. Он писал домой веселые письма, а в июле спрашивал у друзей, какой пароход сможет доставить их обратно в Россию морем. Он умер там рано утром 15 июля.'
    story_prose:
      opening:
        - 'Баденвайлер, курорт в Шварцвальде, июнь 1904 года. Антону Чехову сорок четыре года, он тяжело болен туберкулезом; он похудел в Москве и задыхается. Он и его жена Ольга Книппер приехали из России на поезде и сначала сняли номера в отеле «Рёмербад», оба изношенные.'
        - 'Исторически они переехали на виллу Фридерике, а затем в отель Sommer рядом с почтой. Его письма домой были веселыми, и 11 июля он написал с вопросом, какой пароход сможет доставить их обратно в Россию морским путем. Он умер там рано утром 15 июля. В этом отделении горничная виллы передвигает шезлонг после захода солнца, а почтальон возле почтового отделения может поднять русское письмо и сказать, достаточно ли в нем марок.'
        - 'В этой поездке могут помочь три типа людей: кто-то осторожный, кто может сохранить письма и адреса в безопасности, кто-то достаточно терпеливый, чтобы втиснуть ряд вопросов в одну короткую телеграмму, и кто-то, кто знает медицину и имеет нано-набор.'
      outcomes:
        all: 'Когда то лето закончилось, Чехов и Ольга отплыли обратно в Россию. На палубе дул сильный ветер, и он одну за другой застегивал пуговицы фланелевого костюма.'
        p3: 'После лета Чехов и Ольга отправились в Россию. На платформе он был одет во фланелевой костюм.'
        p2: 'Тонкий листок телеграммы остался разложенным на письменном столе, линия вокруг каюты мягко потерлась его пальцами.'
        p1: 'Мария получила письмо. На оборотной стороне конверта был адрес виллы Фридерике, все буквы верные.'
      none: 'Июль в Баденвайлере был жарким. Шезлонг на балконе весь день следовал за солнцем, а вечером его отодвинули обратно.'
      desync: 'Когда {staff} был отозван, письменный стол уже был пуст. Мария все еще не знала, где остановился ее брат.'
      not_admitted: '{staff} так и не попал на виллу. Солнце светило в саду до семи вечера, а наверху мужчина написал несколько строк письма и должен был отдохнуть.'
      points:
        p1: '25 июня, на третий день пребывания на вилле Фридерике, Чехов сидел за письменным столом и писал Марии, отдыхая через каждые несколько строк. {staff} проверил обратный адрес в конце письма по одной букве, и улица и номер дома оказались верными. Чехов расписался под письмом, отложил перо, откинулся на спинку стула и посмотрел в окно, переводя дыхание.'
        p2: '11 июля в комнате было жарко, как в паровой бане. В своем письме Чехов по пунктам спрашивал: в какой день и в какой час отходит пароход, сколько дней он идет, может ли быть каюта на двоих. {staff} собрал вопросы в одну короткую телеграмму и отправил ее тому, кто знал маршрут. Когда пришел ответ, день отплытия, дни в море и каюта были записаны на одном тонком листе. Ольга прочитала ему это, и когда она дошла до строки о хижине, он попросил ее прочитать еще раз.'
        p3:
          class_learned: '{staff} сначала поступил по старому способу диагностики: прослушал грудную клетку и подсчитал дыхания, а только потом открыл нанонабор, установил дозу по своему весу и заглядывал к нему каждое утро и каждый вечер. В июльскую жару он меньше кашлял. Примерно через десять дней он мог один вернуться с балкона в комнату и сесть за письменный стол. Ольга привезла фланелевой костюм из Фрайбурга; он надел его и постоял некоторое время перед зеркалом.'
          else: '{staff} открыл нано-набор, разложил дозы по отсекам, как сказано в инструкции, дежурил у постели больного, давая лекарства и измеряя температуру, а по ночам время от времени следил за своим дыханием. В июльскую жару он меньше кашлял. Примерно через десять дней он мог один вернуться с балкона в комнату и сесть за письменный стол. Ольга привезла фланелевой костюм из Фрайбурга; он надел его и постоял некоторое время перед зеркалом.'
      excerpts:
        p3: 'Примерно через десять дней он мог один вернуться с балкона в комнату и сесть за письменный стол. Ольга привезла фланелевой костюм из Фрайбурга; он надел его и постоял некоторое время перед зеркалом.'
        p2: 'Когда пришел ответ, день отплытия, дни в море и каюта были записаны на одном тонком листе. Ольга прочитала ему это, и когда она дошла до строки о хижине, он попросил ее прочитать еще раз.'
        p1: '{staff} проверил обратный адрес в конце письма по одной букве, и улица и номер дома оказались верными. Чехов расписался под письмом, отложил перо, откинулся на спинку стула и посмотрел в окно, переводя дыхание.'
    relic: 'Пенсне'
    relic_desc: 'Маленькие круглые очки на шнурке.'
    points:
      p1: 'Сразу после того, как Чехов устроится, проверьте обратный адрес в его письме к сестре Марии и доставьте его, пока у него еще есть силы закончить его.'
      p2: 'Превратите вопросы из его письма от 11 июля в короткую телеграмму тому, кто знает маршрут. Дайте ему ответ, пока он еще в Баденвайлере.'
      p3: 'Вылечите его от туберкулеза, чтобы они с Ольгой могли вместе отправиться в Россию.'
    points_fail:
      p1: 'Багаж все еще обрабатывается в соответствии с правилами старого отеля. Незаконченное письмо идет вместе с ним. Мария не получает адреса с виллы, и офис отзывает сотрудницу.'
      p2: 'Его вопросы о датах отплытия, каюте и продолжительности переправы приходят обычной почтой. Пока он ждет, ему нечего прочитать.'
      p3: 'Рано утром 15 июля Чехов умер в Баденвайлере в сорок четыре года.'
    shift:
      p1:
        was: '25 июня 1904 года (12 июня по российскому календарю) Чехов написал Марии из Баденвайлера с полным обратным адресом на вилле Фридерике.'
      p2:
        was: '11 июля 1904 года Чехов спросил Россолимо о путешествии из Марселя в Одессу. Он умер в Баденвайлере 15 июля и так и не совершил это путешествие.'
        now: 'В ответе телеграммой указывается день отъезда, длина переправы и каюта на двоих. Чехов и его жена читают его в гостинице и обсуждают, какой рейс они бы выбрали, если бы могли уехать.'
      p3:
        was: '15 июля 1904 года Чехов умер от туберкулеза в Баденвайлере в возрасте сорока четырех лет.'
        now: 'Его легкие зажили, и после лета они с Ольгой отплыли домой в Россию. Он продолжал писать в течение многих лет и вернулся в МХАТ на репетиции.'
        who: 'chekhov_badenweiler'
        bio: 'Чехов вылечился от туберкулеза в Баденвайлере, осенью 1904 года вернулся домой в Россию и еще много лет писал рассказы и пьесы.'
    vignettes:
      garden: '27 июня {staff} помогает горничной виллы Фридерике нести шезлонг по саду после захода солнца. Она говорит, что солнце покидает лужайку ровно в семь, и в этом доме ужин ставят по нему, а не по часам в холле.'
      post: '7 июля {staff} сидит на скамейке возле почтового отделения рядом с отелем Sommer. Почтальон говорит, что летом русские пишут больше всех писем в Баденвейлере, а англичане — самые короткие; он может поднять русский конверт и сказать, понадобится ли ему еще одна марка.'
      ice: '10 июля, в самую сильную жару, {staff} помогает носильщику отеля «Зоммер» вынести из подвала кусок льда в мешке. Носильщик говорит, что такого июля в Шварцвальде не было уже двадцать лет, и ледяной человек из Мюльхайма начал бегать по лестнице.'
  boole_ballintemple:
    name: 'Мокрая одежда и лекция'
    place: 'Баллинтемпл, Корк'
    figure: 'Джордж Буль'
    story: 'В Корке идет дождь, и Джорджу Булю предстоит преподавать. Студент все еще ломает голову над упражнением из «Законов мышления». На другом конце города таблицу из незаконченной работы Буля по дифференциальным уравнениям в конечном итоге придется рассчитывать заново, и все из-за одного знака.'
    story_prose:
      opening:
        - 'Корк, Ирландия, ноябрь 1864 года. Джордж Буль — первый профессор математики в Королевском колледже. Десять лет назад в «Законах мышления» он написал законы рассуждения в алгебре, и в одном из них говорится, что выбор дважды по одному и тому же условию оставляет выбор неизменным. У него до сих пор незакончена книга по дифференциальным уравнениям.'
        - 'Исторически 24 ноября он пошел из дома в колледж, чтобы преподавать в колледже, несмотря на сильный дождь. 8 декабря он умер от плевропневмонии в своем доме в Баллинтемпле. В следующем году Тодхантер составил приложение и написал в предисловии, что таблица в конце книги была пересчитана Сефтоном из-за неправильного знака в формуле. В этой ветке студент, сжимающий в руках пронумерованные листочки, все еще задается вопросом, какой же листок выпадет, когда он выберет второй раз по тому же условию.'
        - 'В этой поездке могут помочь три типа людей: кто-то пунктуальный, кто пронесет конспекты лекций под дождем, кто-то, кто может проверить формулу и найти ошибку, и кто-то, кто знает медсестру и может взять на себя ночное дежурство.'
      outcomes:
        all: 'В те декабрьские ночи лампа в доме Буля горела до утра, и одна вахта следовала за другой. В следующем году бумажный маркер все еще оставался на своем месте.'
        p3: 'В такие ночи лампа в доме Буля горела до утра, и одна вахта следовала за другой.'
        p2: 'На следующий год редактор открыл папку, а бумажный маркер все еще был на своем месте. Сефтон начал свои расчеты с этого знака.'
        p1: 'На лекции 24 ноября ни одна страница конспектов на столе не была мокрой.'
      none: 'Дожди продолжались до декабря. В доме в Баллинтемпле люди у постели всю ночь не смыкали глаз.'
      desync: 'Из-за дождя в тот день конспекты лекций превратились в кашу, и кафедра стояла пустой. {staff} был отозван офисом перед следующей лекцией.'
      not_admitted: '{staff} так и не прошел через дверь колледжа. Дождь продолжал идти, а конспекты лекций все еще лежали на столе в доме Буля.'
      points:
        p1: '24 ноября шёл сильный дождь. Прежде чем Буль вышел из дома, {staff} завернул конспекты лекций в два слоя клеенки, отнес их под пальто в колледж впереди себя и положил в ящик кафедры. Когда Буль вошел, с его пальто капало, и он выдвинул ящик и обнаружил, что банкноты сухие. Он разложил их, вытер руки о манжеты и начал.'
        p2: '{staff} положил таблицу рядом с формулой, которая ее создала, и начал работать строчка за строкой. В одном месте цифры не совпадали; Если проследить вверх, то неисправность заключалась в том, что знак в формуле написан неправильно. {staff} не стал изменять рукопись, а лишь вставил бумажный маркер в эту страницу, отмечая, какая строка и какой знак.'
        p3: 'В начале декабря Буль заболел дома, и его семья по очереди сидела у его постели, несколько ночей не спала. {staff} взял на себя ночное дежурство, как того требует медсестра: вовремя переворачивал его, давал воды, укутывал одеяло и записывал на листке все, что происходило ночью. Семья оставила лампу включенной и легла спать на несколько часов. Когда они вернулись перед рассветом, огонь все еще горел, а простыня у кровати была заполнена ночными часами.'
      excerpts:
        p3: 'Семья оставила лампу включенной и легла спать на несколько часов. Когда они вернулись перед рассветом, огонь все еще горел, а простыня у кровати была заполнена ночными часами.'
        p2: 'В одном месте цифры не совпадали; Если проследить вверх, то неисправность заключалась в том, что знак в формуле написан неправильно. {staff} не стал изменять рукопись, а лишь вставил бумажный маркер в эту страницу, отмечая, какая строка и какой знак.'
        p1: 'Когда Буль вошел, с его пальто капало, и он выдвинул ящик и обнаружил, что банкноты сухие. Он разложил их, вытер руки о манжеты и начал.'
    relic: 'Страница логики'
    relic_desc: 'Классное упражнение, показывающее, что происходит, когда один и тот же выбор применяется дважды.'
    points:
      p1: 'Отнесите конспекты лекций в колледж до того, как Буль отправится в проливной дождь, и соблюдайте график занятий.'
      p2: 'Сравните таблицу с формулой, по которой она была получена, и отметьте знак для следующего человека, который проверит рукопись.'
      p3: 'Найдите кого-нибудь, кто будет дежурить на вечернем дежурстве, чтобы семья у постели Буля могла отдохнуть.'
    points_fail:
      p1: 'Записи промокли, и ни у кого нет дубликата. Занятие пропущено, и офис отзывает сотрудника.'
      p2: 'Таблица попадает в папку со снятой формулой. Сефтону придется отследить ошибку позже.'
      p3: 'Семья без перерыва несет вечернюю стражу. Один из них выходит из комнаты лишь на время, достаточное для того, чтобы потушить лампу.'
    shift:
      p1:
        was: 'Университетский колледж Корка сообщает, что 24 ноября 1864 года Буль вышел из дома, чтобы преподавать под проливным дождем.'
      p2:
        was: 'Буль умер в декабре 1864 года. Тодхантер подготовил приложение. В его предисловии записана таблица, пересчитанная после знаковой ошибки в рукописи.'
        now: 'Когда редактор открывает папку, маркер на бумаге приводит его прямо к формуле. Сефтон может начать с проверки его знака.'
      p3:
        was: 'Буль умер от плевропневмонии дома в Баллинтемпле 8 декабря 1864 года.'
        now: '{staff} находит человека, который сможет занять место на вечер. Семья оставляет лампу включенной и отдыхает несколько часов перед возвращением.'
    vignettes:
      repeat: '{staff} просит ученика выбрать четные числа, а затем сделать это еще раз с листочками в руках. Студент ищет одну, которую можно положить. Нет ни одного.'
      border: 'Учащийся собирается записать ряд чисел, когда {staff} спрашивает, как он получил первое число. Учащийся проводит линию обратно к формуле, прежде чем скопировать остальную часть.'
      example: 'Готовое упражнение ученик кладет под книгу, чтобы оно лежало ровно. На краю страницы бумажный маркер торчит ровно настолько, чтобы за него можно было ухватиться.'
  ahmed_baba_timbuktu:
    name: 'Имя для дополнения'
    place: 'Тимбукту'
    figure: 'Ахмед Баба'
    story: 'После того, как марокканская армия взяла Тимбукту в 1591 году, учёный Ахмад Баба был обвинен в сопротивлении султану и в 1594 году был депортирован в Марракеш. Там он составил биографические словари как приложения к Ибн Фархуну. Ему разрешили вернуться в Тимбукту в 1608 году, и он умер там 22 апреля 1627 года.'
    story_prose:
      opening:
        - 'Тимбукту, 1594 год. Три года назад марокканская армия взяла город. Ахмед Баба здесь учёный; он написал десятки книг по праву и грамматике, и в его доме есть очень большая библиотека.'
        - 'В истории в этом году его обвинили в неповиновении султану, и он вместе со своей семьей двинулся через Сахару на север в Марракеш. Его книги были украдены или потеряны в дороге. Четырнадцать лет спустя его отпустили домой, а книги пропали. В этом филиале жена семьи в дальнем конце переулка готова освободить место под своей кроватью, а переписчик во дворе все еще пишет этикетки для своих книг.'
        - 'В этом путешествии могут помочь три типа людей: кто-то, кто знает старые книги и какие сундуки нужно спасти в первую очередь, кто-то достаточно смелый и выносливый, чтобы выстоять против толчка в тот день, когда его уведут, и кто-то, кто умеет ухаживать за больными, может лечить раны и раздавать воду в пустыне.'
      outcomes:
        all: 'В 1608 году Ахмед Баба вернулся в Тимбукту. Жена соседа состарилась. Она вытащила сундуки из-под кровати, на коже лежал слой пыли. Он открыл том сверху и узнал свою руку.'
        p3: 'Четырнадцать лет спустя он вернулся в Тимбукту. Этот домочадец вынес сундуки из-под кровати, и он провел рукой по томам один за другим и долго сидел возле сундуков.'
        p2: 'Вся семья, старые и молодые, добралась до Марракеша. У городских ворот у ребенка зарубцевалась нога.'
        p1: 'Он добрался до Марракеша живым. Четырнадцать лет спустя его отпустили домой.'
      none: 'Колонна, идущая на север, отодвинулась далеко. В той комнате в Тимбукту полки стояли пустыми, а дверь не была закрыта.'
      desync: 'В тот день, когда его увели, на углу улицы произошла драка, и {staff} был отозван офисом еще до того, как добрался до него. Последним, что было видно, был растоптанный в толпе ботинок.'
      not_admitted: '{staff} так и не попал в этот двор. Книги все еще стояли на полках, и день, когда его уведут, приближался.'
      points:
        p3:
          class_craft: '{staff} следовал правилам починки старых книг: между наиболее хрупкими томами прокладывал сухую ткань, кожей лицевой стороной внутрь, прижимая клапаны, и укладывал их в сундуки слой за слоем. После наступления темноты двое мужчин пронесли сундуки через два переулка в дом жены соседа. Она вытащила беспорядок из-под кровати, задвинула сундуки, запихнула его обратно на место и отряхнула руки.'
          class_lettered: '{staff} выбрал из списка книги сначала свои черновики и экземпляры, которых больше не существовало, и уложил их в сундуки слой за слоем. После наступления темноты двое мужчин пронесли сундуки через два переулка в дом жены соседа. Она вытащила беспорядок из-под кровати, задвинула сундуки, запихнула его обратно на место и отряхнула руки.'
          else: '{staff} просмотрел названия том за томом, отложил сначала свои черновики и редкие экземпляры и уложил их в сундуки слой за слоем. После наступления темноты двое мужчин пронесли сундуки через два переулка в дом жены соседа. Она вытащила беспорядок из-под кровати, задвинула сундуки, запихнула его обратно на место и отряхнула руки.'
        p1: 'В тот день, когда его увели, улица была переполнена, и в толчее кто-то выхватил нож. {staff} встал перед Ахмедом Бабой, вытащил его в дверной проем и прижался спиной к дверному косяку. Когда все прошло, он поправил одежду и вышел невредимый.'
        p2: 'Через полмесяца пути на север у мужчины в колонне поднялась высокая температура, а у ребенка ободрались подошвы ног. Каждый вечер, когда вставали лагерем, {staff} промывал раны, менял повязки и раздавал воду поровну. Однажды ночью ребёнок протянул свой бурдюк: там оставался всего один глоток.'
      excerpts:
        p3: 'После наступления темноты двое мужчин пронесли сундуки через два переулка в дом жены соседа. Она вытащила беспорядок из-под кровати, задвинула сундуки, запихнула его обратно на место и отряхнула руки.'
        p2: 'Каждый вечер, когда вставали лагерем, {staff} промывал раны, менял повязки и раздавал воду поровну. Однажды ночью ребёнок протянул свой бурдюк: там оставался всего один глоток.'
        p1: '{staff} встал перед Ахмедом Бабой, вытащил его в дверной проем и прижался спиной к дверному косяку. Когда все прошло, он поправил одежду и вышел невредимый.'
    relic: 'Рукопись в кожаном переплете'
    relic_desc: 'Рукопись в потертой кожаной обложке с клапаном.'
    points:
      p1: 'Прежде чем его заберут, остановите лезвия, направленные против арестованных ученых, и сохраните жизнь Ахмеду Бабе до дороги на север.'
      p2: 'Лечите родственников, которые заболели или получили ранения в пустыне, разделите воду и не позволяйте семье отставать.'
      p3: 'Прежде чем солдаты заберут книги, сохраните несколько сундуков из его библиотеки и спрячьте их у семьи в городе.'
    points_fail:
      p1: 'В этой ветви он не покинул Тимбукту живым, а биографические словари Марракеша и двадцать девять книг, написанных в Марокко, исчезли.'
      p2: 'Никто не помог тем, кто упал на дороге, и в этой ветке путь семьи на север был таким же трудным, как и прежде.'
      p3: 'Все его книги были взяты, и в этом филиале, когда он четырнадцать лет спустя вернулся в Тимбукту, не осталось ни одной его собственной книги.'
    shift:
      p1:
        was: 'В 1594 году Ахмад-Баба был обвинен в неповиновении султану и отправлен в Марракеш; в 1608 году ему разрешили вернуться домой в Тимбукту.'
      p2:
        was: 'В 1594 году семья Ахмад-Бабы вместе с ним двинулась на север через Сахару.'
        now: 'Сородичи, путешествовавшие с ним, добрались до Марракеша, пострадав немного меньше.'
      p3:
        was: 'В 1594 году его библиотека была захвачена марокканцами или по другому счету, потерянному по пути на север; когда он вернулся в Тимбукту в 1608 году, книг уже не было.'
        now: 'Прежде чем его увезли, несколько ящиков с книгами засунули под кровать в одном из городских домов. Когда он вернулся домой четырнадцать лет спустя, эта семья вынесла сундуки.'
        who: 'ahmed_baba_timbuktu'
        bio: 'Ахмад Баба вернулся домой в Тимбукту в 1608 году и обнаружил несколько сундуков со своими книгами, которые все еще хранились в семье в городе. Он преподавал у них в последние годы своей жизни.'
    vignettes:
      same_name: '{staff} находит одно имя, написанное двумя способами в двух томах, и сохраняет оба варианта написания в списке с пометкой между ними вместо выбора одного.'
      courtyard: '{staff} выставляет тома в тени двора, чтобы проветрить их после дождя, и переворачивает каждый в полдень, чтобы обложки высохли равномерно.'
      slip: '{staff} пишет название и первую строку каждого тома на узком листке и засовывает его под кожаный клапан, чтобы книгу можно было назвать, не открывая ее.'
  nezahualcoyotl_texcoco:
    name: 'Имя рядом с песней'
    place: 'Тескоко'
    figure: 'Несауалькойотль'
    story: 'Несауалькойотль стал правителем Тескоко в 1431 году и правил им до своей смерти в 1472 году. Его помнят как поэта и строителя; Говорят, что им была проложена длинная дамба через озеро Тескоко. С его именем связаны песни на языке науатль, собранные в шестнадцатом веке, хотя неизвестно, сочинил ли он их.'
    story_prose:
      opening:
        - 'Тескоко, 1472 год. Несауалькойотль был правителем города сорок один год, ему около семидесяти. Его помнят как поэта и строителя, и говорят, что длинная дамба через озеро Тескоко, разделяющее его воды, была проложена им.'
        - 'Исторически он умер в этом году, и его преемником был выбран его семилетний сын Несауальпилли; песни, связанные с его именем, были переписаны в сборник песен примерно сто лет спустя, и кто первым их спел, никто не знает. В этом филиале старый дворцовый певец, знающий эти песни, собирается научить им ученика, певец на репетициях оставляет реплику для следующей, а помощник следит за порядком в листах упражнений.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто может следить, кто-то смелый или очень жесткий, или кто-то с регулятором сна, чтобы обезопасить ребенка в тревожные дни; кто-то, кто преподавал музыку или знает ее, кто-то терпеливый или санитар, или кто-то с диктофоном, чтобы выучить песни построчно; кто-то тихий, кто составит человеку компанию, кто-то, кто может ухаживать за больными, или кто-то с проектором голограммы, чтобы посидеть с ним в его последние дни.'
      outcomes:
        all: 'В том же году семилетний Несауальпилли был избран правителем Тескоко. Песни передавались от начала до конца, а позже ученик обучал их своему ученику. Примерно через сто лет они были переписаны в сборник песен под его именем.'
        p3: 'В том же году Несауалькойотль умер в Тескоко. Примерно через сто лет песни, связанные с его именем, были переписаны в сборник песен; более пятисот лет спустя его лицо было напечатано на мексиканской банкноте в сто песо.'
        p2: 'Учащийся хорошо знал песни и позже научил их своему ученику. Примерно сто лет спустя они были скопированы в сборник песен, рядом с которым стояло его имя.'
        p1: 'Семилетний Несауальпилли был избран правителем Тескоко и занимал этот пост более сорока лет.'
      none: 'В том же году Несауалькойотль умер в Тескоко. Когда старый певец заболел, песни еще не были выучены, и вторая половина тренировочного листа осталась пустой; В день выбора дворец напрасно ждал семилетнего мальчика.'
      desync: 'В ночи после его смерти у порога никто не дежурил. Когда вспомнили о {staff}, день выбора еще не наступил, комната, в которой спал мальчик, была пуста, а циновка была прислонена к стене.'
      not_admitted: '{staff} никогда не попадал во дворец и только слышал репетиций певцов из города. Певец закончил строчку и отступил назад, чтобы освободить место для следующей; чья это была песня, каждый слушатель говорил что-то свое.'
      points:
        p2:
          class_teaching: 'В тот год старый дворцовый певец уже не мог долго петь, и ему пришлось остановиться на середине песни, чтобы перевести дыхание. Он намеревался научить дворцового ученика песням, связанным с именем Несауалькойотля. {staff}, который преподавал, заставлял ученика повторять одну строку за раз, запоминая каждую строку, прежде чем переходить к следующей, проходя весь текст с начала и в конце каждого дня и отмечая края тренировочного листа там, где строка идет не так. Вечером, когда разучивалась последняя песня, ученик пел ее от начала до конца, не пропуская ни строчки. Старый певец ничего не сказал, его рука мягко отсчитывала такт на колене.'
          else: 'В тот год старый дворцовый певец уже не мог долго петь, и ему пришлось остановиться на середине песни, чтобы перевести дыхание. Он намеревался научить дворцового ученика песням, связанным с именем Несауалькойотля. {staff} терпеливо сидел рядом с ними; каждый раз, когда старый певец пел строчку, ученик повторял ее в ответ, а там, где ученик запинался, старика просили спеть ее еще раз, и еще раз, если одного раза было недостаточно. Вечером, когда разучивалась последняя песня, ученик пел ее от начала до конца, не пропуская ни строчки. Старый певец ничего не сказал, его рука мягко отсчитывала такт на колене.'
        p3:
          class_medical: 'В его последние дни люди, приходящие и уходящие в его комнату, шли тихо. {staff}, который знал, как ухаживать за больными, завернул его в одеяло и держал чашку, пока он пил, и только когда они остались одни, подошел ближе и начал медленно рассказывать о том, что должно было произойти. Примерно сто лет спустя кто-то одну за другой скопирует песни, связанные с его именем, в книгу. Более пятисот лет спустя люди вдалеке все еще будут знать его имя, и его лицо будет напечатано на их деньгах. Выслушав все это, он долго молчал, затем повернул голову и посмотрел в дверной проем на озеро.'
          else: 'В его последние дни люди, приходящие и уходящие в его комнату, шли тихо. {staff} просидел с ним целый день, и только когда они остались одни, начал медленно говорить о том, что должно было произойти. Примерно сто лет спустя кто-то одну за другой скопирует песни, связанные с его именем, в книгу. Более пятисот лет спустя люди вдалеке все еще будут знать его имя, и его лицо будет напечатано на их деньгах. Выслушав все это, он долго молчал, затем повернул голову и посмотрел в дверной проем на озеро.'
        p1: 'Через несколько дней после его смерти дворяне собрались, чтобы решить, кто станет его преемником, и каждый день во дворец приходили и уходили все больше людей. Семилетнего Несауальпилли водили из одной комнаты в другую. {staff} дежурил возле комнаты, где он спал, не выходил по ночам, останавливал каждого незнакомца, который приходил и первым спрашивал о его делах, и садился у порога только тогда, когда мальчик спал. Утром, в день выбора, мальчика вывели за руку за дверь, так что подол его плаща задел порог. Место рядом с ним, где кто-то сидел несколько ночей, побледнело.'
      excerpts:
        p3: 'Более пятисот лет спустя люди вдалеке все еще будут знать его имя, и его лицо будет напечатано на их деньгах. Выслушав все это, он долго молчал, затем повернул голову и посмотрел в дверной проем на озеро.'
        p2: 'Вечером, когда разучивалась последняя песня, ученик пел ее от начала до конца, не пропуская ни строчки. Старый певец ничего не сказал, его рука мягко отсчитывала такт на колене.'
        p1: 'Утром, в день выбора, мальчика вывели за руку за дверь, так что подол его плаща задел порог. Место рядом с ним, где кто-то сидел несколько ночей, побледнело.'
    relic: 'Полоска с подсказкой для певца'
    relic_desc: 'Листок для репетиции с отдельным местом для каждого из двух имён.'
    points:
