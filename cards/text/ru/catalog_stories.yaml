    relic: 'Лист корректуры'
    relic_desc: 'Лист типографской корректуры с карандашными исправлениями.'
    points:
      p1: 'Сохраняйте место Кафки каждый раз, когда болезнь прерывает корректуру, и защищайте истории, которые он исправлял.'
      p2: 'Разделите поручения и переписку между помощниками, чтобы у людей, остающихся в Кирлинге, было время отдохнуть.'
      p3: 'Облегчите боль в горле, чтобы в последние недели он мог глотать воду и несколько глотков мягкой пищи.'
      p4: 'Попросите берлинского издателя переплести предварительный экземпляр и отправить его Кирлингу, чтобы Кафка мог увидеть свои четыре рассказа вместе.'
    points_fail:
      p1: 'Корректуры возвращаются в Берлин без его окончательных исправлений. Филиал теряет синхронизацию, и офис отзывает сотрудника.'
      p2: 'Те же самые люди остаются дежурить, отвечать на письма и выполнять поручения, не отрываясь от ожидания ответа.'
      p3: 'Боль в горле все еще не давала ему есть. В этом филиале он провел свои последние недели, разговаривая по заметкам и едва мог глотать.'
      p4: 'Кафка никогда не видит книги. Издатель рассылает его только после его смерти.'
    shift:
      p1:
        was: 'В мае 1924 года Кафка, будучи больным в Кирлинге, продолжал корректировать корректуру к «Голодному художнику».'
      p2:
        was: 'В мае 1924 года к Кирлингу приехал друг, чтобы помочь ухаживать за тяжелобольным Кафкой и облегчить часть работы, которую выполнял его партнер.'
        now: '{staff} дает помощникам возможность по очереди принимать письма, отправлять страницы и составлять компанию. Когда один из них прибудет, дежурный может выйти наружу.'
      p3:
        was: 'Весной 1924 года туберкулез достиг гортани Кафки. Глотание было настолько болезненным, что он едва мог есть и спать, и его врач делал инъекции в гортанный нерв каждые восемь-десять дней, чтобы избавиться от боли. Он умер в Кирлинге 3 июня.'
        now: '{staff} помог врачу рассчитать время обезболивания перед едой. В свои последние недели он мог пить воду и делать несколько глотков мягкой пищи и страдал несколько меньше, чем когда-либо в истории.'
      p4:
        was: 'Кафка умер 3 июня 1924 года. В августе того же года вышел сборник «Голодный художник».'
        now: '{staff} заставляет Берлин переплести одну копию исправленных листов и отправить ее вперед. Кафка просматривает его в Кирлинге и узнает четыре истории и выбранный им порядок.'
        who: 'kafka_kierling'
        bio: 'Перед смертью Кафка увидел переплетенную копию последней корректуры. В печатном издании сохранились одобренные им подборка и порядок.'
    vignettes:
      lilac: '13 мая {staff} помогает садовнику санатория срезать сирень у забора. Садовник говорит, что в этом году оно зацвело на неделю позже, и пчелы этого не простили; он клянется, что теперь они подходят к кухонному окну только для того, чтобы жаловаться.'
      post: '23 мая {staff} идет на почту в Клостернойбурге с мальчиком на побегушках из санатория. Мальчик говорит, что может определить, откуда пришло письмо, не читая его: письма из Берлина толстые и жесткие от бумаги, письма из Праги тонкие и приходят каждый день.'
      rain: 'В середине июня {staff} укрывается от ливня у дверей деревенского пекаря. Жена пекаря наблюдает, как улица превращается в ручей, и говорит, что ручей Кирлинг разливается только тогда, когда она только что вымыла ступеньку.'
  poe_baltimore:
    name: 'Записка из Четвёртого округа'
    place: 'Балтимор'
    figure: 'Эдгар Аллан По'
    story: '27 сентября 1849 года Эдгар Аллан По уехал из Ричмонда в свой дом в Фордхэме в Нью-Йорке и на следующий день прибыл в Балтимор. Его местонахождение в течение следующих пяти дней неизвестно. 3 октября, в день выборов, он был найден в сильном расстройстве на избирательных участках в Четвертом округе Райана, и печатник Джозеф Уокер отправил записку Джозефу Снодграссу. Его доставили в больницу Вашингтонского колледжа, не допускали посетителей, и он умер там перед рассветом 7 октября в возрасте сорока лет. Причина до сих пор неизвестна. Его тетя и теща Мария Клемм узнали об этом из газеты.'
    story_prose:
      opening:
        - 'Балтимор, конец сентября 1849 года. Сорокалетний писатель Эдгар Аллан По написал «Ворона» и пишет рассказы об ужасах и открытиях. Этим летом он читал лекции в Ричмонде, чтобы собрать деньги для журнала; 27 сентября он отправился к себе домой в Фордхэм в Нью-Йорке, а на следующий день прибыл в Балтимор. В Фордхэме его ждут тетя и теща Мария Клемм.'
        - 'В истории в течение следующих пяти дней нет достоверных сведений о том, где он находился. 3 октября, в день выборов, печатник Джозеф Уокер обнаружил, что он в сильном расстройстве на избирательных участках в Четвертом округе, и отправил записку с просьбой приехать к доктору Снодграссу; его доставили в больницу Вашингтонского колледжа и поместили в палату для пациентов, привезенных пьяными, он несколько дней приходил в сознание и терял его, не допускался к посетителям и умер до рассвета 7-го числа, причина которого до сих пор неизвестна. Два дня спустя Мария Клемм прочитала о его смерти в газете в Фордхэме и написала в Балтимор, чтобы задать вопрос. В этом филиале носильщик несет чемоданы на пристани, трактирщик на Ломбард-стрит считает свои бочки, а ночной портье охраняет палату.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает медицину с твердой волей, или кто-то методичный или бдительный с более твердой волей, чтобы взять записку с просьбой о помощи и благополучно доставить его от избирательного участка до больницы; кто-то обученный медсестринскому делу или уходу, курьер или журналист, кто-то добрый, терпеливый или методичный, или кто-то с блокнотом, ручкой и остроумием, чтобы передать сообщение Марии Клемм; врач с быстрым умом и сильной волей или кто-то, кто знает медицину и носит с собой наноаптечку, чтобы помочь ему пережить бред.'
      outcomes:
        all: 'В конце октября По выписался из больницы и отправился на север, к себе домой в Нью-Йорк. У дверей маленького домика в Фордеме Мария Клемм стояла с письмом из Балтимора в руке и смотрела в конец дороги.'
        p3: 'В конце октября По покинул больницу и отправился на север, к себе домой в Нью-Йорк. Опираясь на трость, он остановился на ступеньках больницы и застегнул воротник.'
