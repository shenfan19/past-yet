          else: 'В конце мая бумаги в кабинете рядом с комнатой больного были в беспорядке скоплены. {staff} несколько ночей подряд сидел в кабинете, пересчитывал рукопись с автографом и две стопки рабочих документов страницу за страницей, записывал их отдельно, завернул автограф в ткань и запер его один в шкафу. Квитанция была написана под заголовком «Для Тидеманна Гизе», сложена пополам и прижата ключом от шкафа в углу стола. Соседний слуга тихонько вошел в комнату больного с водой и снова вышел.'
        p2: 'В конце июля Гизе написал Ретикусу с просьбой передать письмо с просьбой исправить издание в городской совет Нюрнберга, но ответа не последовало в течение некоторого времени. {staff} пролистал книгу страницу за страницей, сверяя с рукописью, как это делает корректор, и составил лист с опечатками, показывающий, на какой странице находится собственное предисловие автора и что в рукописи нет адреса «К читателю» в начале. Лист был скопирован несколько раз и вставлен в копии, уже выданные поблизости. Тот, кто открыл обложку, первым увидел этот лист.'
        p3:
          class_medical: 'В начале мая Коперник лежал на своей постели во Фромборке и все реже бодрствовал. {staff} держал у постели больного, как того требует медсестра, вовремя давал ему воду, переворачивал, не давал погаснуть огню в комнате и ждал книгу из Нюрнберга. Когда книга добралась до его кровати, он проснулся. Он развернул его на одеяле, медленно провел пальцем по заголовку на первой странице и надолго задержал его на своем имени.'
          class_travel: 'В начале мая Коперник лежал на своей постели во Фромборке и все реже бодрствовал. {staff} отправился на юг по дороге, встретил на полпути тележку из Нюрнберга, завернул один печатный экземпляр в пальто и привез его обратно во Фромборк, путешествуя день и ночь. Когда книга добралась до его кровати, он проснулся. Он развернул его на одеяле, медленно провел пальцем по заголовку на первой странице и надолго задержал его на своем имени.'
