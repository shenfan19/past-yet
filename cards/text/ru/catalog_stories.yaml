      p2:
        was: 'В мае 1824 года, во время подготовки к премьере, музыканты передавали Бетховену новости о репетициях в его разговорниках.'
        now: '{staff} помещает самые проблемные записи на одну страницу и предлагает разделам попробовать их еще раз с оценками, одобренными Бетховеном.'
      p3:
        was: '23 мая 1824 года в Вене состоялся второй концерт, принесший неутешительные результаты.'
        now: '{staff} обеспечивает бронирование до того, как потенциальные слушатели покинут город, и включает эти квитанции в счета. У Бетховена есть возможность устроить еще один концерт от своего имени.'
        who: 'beethoven_vienna'
        bio: 'Бетховен получил авансовый доход, когда устраивал повторные концерты в Вене. Он мог бы покрыть большую часть их расходов до того, как двери откроются.'
    vignettes:
