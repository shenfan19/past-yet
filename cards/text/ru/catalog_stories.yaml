  sequoyah_syllabary:
    name: 'Письменность, созданная одним человеком'
    place: 'Страна чероки, юго-восток США.'
    figure: 'Секвойя'
    story: 'Серебряный мастер чероки Секвойя завершил систему письма чероки в 1821 году. Ее знаки представляют собой слоги, а не отдельные звуки. Позже в том же десятилетии нация чероки официально приняла слоговую азбуку. 21 февраля 1828 года в Нью-Эчоте вышел из печати первый «Чероки Феникс», напечатанный как на языке чероки, так и на английском языке.'
    story_prose:
      opening:
        - 'Страна чероки, на юго-востоке Соединенных Штатов, 1821 год. Серебряный мастер Секвойя не умеет читать по-английски, однако он составил для чероки слоговую азбуку из восьмидесяти знаков, каждый знак соответствует одному слогу. Он работал над этой работой много лет.'
        - 'В истории он был хромым на одну ногу и ходил с трудом; поля остались одной его жене, семья снова и снова умоляла его отказаться от них, а жена однажды сожгла его бумаги; когда он показал надпись, у людей возникли подозрения, и один из них обвинил его в лицо. В этом ответвлении учащийся произносит слово по одному знаку, а соседка хочет написать свое имя.'
        - 'В этом путешествии могут помочь несколько типов людей: кто-то спокойный, кто-то, кого люди слушают, или кто-то с железной волей, или кто-то с золотым яблоком, чтобы встать в тот день, когда подозрения возрастают; кто-то, кто знает медицину, или кто-то, кто принимает обезболивающие; кто-то сильный духом, кто занимался сельским хозяйством, или кто-то добрый и очень выносливый, чтобы провести полгода полевых работ в этом доме.'
      outcomes:
        all: 'В те годы письменность чероки распространилась по городам, и его жена тоже научилась ею писать. 21 февраля 1828 года первый «Чероки Феникс» вышел из печати в Нью-Эчоте, «Чероки» и «Инглиш», стоя в колоннах бок о бок.'
        p3: 'Поля не пропали даром за эти полгода, и ссор дома стало меньше. Позже его жена тоже научилась писать знаками.'
        p2: 'За эти полгода боль в ноге утихла, и он быстрее пошел по дороге в следующий город, чтобы преподавать; чем дальше он шел, тем больше было учеников.'
        p1: 'Позже совет официально утвердил текст. 21 февраля 1828 года первый «Чероки Феникс» вышел из печати в Нью-Эчоте, где чероки и англичане шли колоннами бок о бок.'
      none: 'В день показа крики заглушили все, и Айоке так и не позвонили, чтобы прочитать слово. Бумага с вывесками была растоптана ногами.'
      desync: 'В день показа крики стали громче, и никто уже не ждал возвращения ребенка. Когда {staff} был отозван, толпа ушла с открытой площадки, а бумага с одним словом лежала в грязи рядом с небольшим следом.'
      not_admitted: '{staff} так и не нашла здесь опоры и лишь несколько раз помогла соседке выследить ее имя по листу бумаги. Далеко на открытой местности хромой мужчина показывал нескольким людям знаки на бумаге.'
      points:
        p2:
          class_medical: 'Секвойя собирался отправиться в близлежащие города, чтобы учить людей знакам, но вскоре у него заболела хромая нога, и ему приходилось несколько раз отдыхать на каждом участке дороги. {staff}, знавший медицину, каждый вечер накладывал на ногу теплые компрессы, устранял ее жесткость и обрезал палку до высоты, подходящей для его руки. В тот день он добрался до следующего города еще до захода солнца. Он писал строку знаков на листе бумаги, а ученик наклонялся и читал ее по слогам.'
          else: 'Секвойя собирался отправиться в близлежащие города, чтобы учить людей знакам, но вскоре у него заболела хромая нога, и ему приходилось несколько раз отдыхать на каждом участке дороги. {staff}, который принес с собой обезболивающие, давал ему одно перед отъездом каждый день, шел рядом с ним всю дорогу и нес для него рулон бумаги, покрытый знаками. В тот день он добрался до следующего города еще до захода солнца. Он писал строку знаков на листе бумаги, а ученик наклонялся и читал ее по слогам.'
        p1:
          trait_calm: 'В день показа на открытой площадке было многолюдно. Секвойя первым отослал свою шестилетнюю дочь Айоку, попросил кого-нибудь сказать слово, записал его, а затем перезвонил ей, чтобы прочитать. Прежде чем он закончил писать, кто-то в толпе заподозрил подозрение, сказал, что знаки странные и им нельзя доверять, и начал кричать ему в лицо. {staff} неторопливо подошел к нему и попросил всех подождать, позволить ребенку вернуться и прочитать его первым, а затем поговорить, как только она прочитает правильно. Айоку перезвонили, она посмотрела на бумагу и прочитала слово по слогам. Земля на какое-то время воцарилась тишина, и тот, кто произнес это слово, сделал два шага вперед и наклонился, чтобы посмотреть на знаки на бумаге.'
          else: 'В день показа на открытой площадке было многолюдно. Секвойя первым отослал свою шестилетнюю дочь Айоку, попросил кого-нибудь сказать слово, записал его, а затем перезвонил ей, чтобы прочитать. Прежде чем он закончил писать, кто-то в толпе заподозрил подозрение, сказал, что знаки странные и им нельзя доверять, и начал кричать ему в лицо. {staff} выступил перед толпой и сказал, не повышая голоса, что минутное ожидание уладит дело, как только ребенок вернется читать, и уговорил кричащих одного за другим. Айоку перезвонили, она посмотрела на бумагу и прочитала слово по слогам. Земля на какое-то время воцарилась тишина, и тот, кто произнес это слово, сделал два шага вперед и наклонился, чтобы посмотреть на знаки на бумаге.'
        p3:
          class_labour: 'Полевые работы уже давно легли на плечи одной его жены, большая часть кукурузной земли пропала, и в семье много лет ссорились из-за написания. {staff}, который занимался сельским хозяйством, вышел с первыми лучами солнца, чтобы прополоть сорняки и окучить ряды, снова засадил заброшенные ряды, а вечером принес воду домой со своей женой. Урожай того сезона пришел в дом. Секвойя разложил на столе сверток бумаги, исписанный знаками, а его жена села рядом с ним, долго смотрела, затем протянула палец и коснулась одного из знаков.'
          else: 'Полевые работы уже давно легли на плечи одной его жены, большая часть кукурузной земли пропала, и в семье много лет ссорились из-за написания. {staff}, сильный и сердечный, каждый день выходил с женой в поле, брал на себя самую тяжелую работу и выполнял ее с утра до темноты. Урожай того сезона пришел в дом. Секвойя разложил на столе сверток бумаги, исписанный знаками, а его жена села рядом с ним, долго смотрела, затем протянула палец и коснулась одного из знаков.'
