      shelf: '{staff} вытирает пыль с пустых полок в камере, находит следы на местах, где стояли книги, темные квадраты на дереве, и оставляет их такими, какие они есть.'
      bells: '{staff} дважды пересчитывает звонки по умершим во дворе за один вечер и возвращается к чайнику.'
  kepler_leonberg:
    name: 'То, что видел свидетель'
    place: 'Леонберг'
    figure: 'Иоганн Кеплер'
    story: 'В 1620 году Катарина Кеплер, мать астронома Иоганна Кеплера, столкнулась с обвинениями со стороны соседей в Леонберге, датированными пятью годами ранее. 7 августа ее арестовали в доме дочери в Хумадене. Ее перевели из Леонберга в Гюглинген и держали под охраной за счет семьи. В сентябре того же года Йоханнес вернулся из Линца, чтобы встать на ее защиту. После неоднократных проволочек Катарина была освобождена осенью 1621 года, более чем через год после ареста.'
    story_prose:
      opening:
        - 'Леонберг, 1620 г. Обвинения против Катарины Кеплер висели над ней пять лет. В августе ее арестовали в Хумадене, а в сентябре ее сын Йоханнес вернулся из Линца, чтобы защитить ее.'
        - 'Исторически она провела под стражей в Гюглингене более года. Всю зиму она носила цепи, и ее семье пришлось платить охранникам. В этом отделении жена тюремщика все еще носит суп по переулку. Кто-нибудь может на время отобрать у нее горшок и просмотреть бумаги, прежде чем их отошлют.'
        - 'В этой поездке нужен кто-то, кто сможет держать документы в порядке и отследить заявление до человека, который его сделал. С наступлением зимы также найдется работа для сиделки или того, кто сможет принести теплое постельное белье.'
      points:
        p1: 'После того, как Катарину доставили в Леонберг, {staff} последовал привычкам регистратора: попросил у хранителя второй экземпляр, вместе с ним пересчитал страницы и увидел, как их сдали. Клерк положил копию в стопку для подшивки. Когда оригинал был сложен, {staff} прижал поднявшийся угол.'
        p2: '{staff} распространил показания вместе с семьей и проследил каждое утверждение до того, что было видно, что было услышано или что кто-то сделал вывод позже. Три колонны давали многолюдной комнате для свидетельских показаний передохнуть. На месте, которого не видел ни один свидетель, перо остановилось недалеко от разлинованной линии.'
        p3: 'Когда наступили холода, {staff} договорился с охранниками о том, что толстая подстилка и горячая еда будут лежать рядом с кроватью, на которой Катарина носила свои цепи. Прежде чем взять миску, она подоткнула угол одеяла себе на колени. Железное звено прижалось к кровати, когда она медленно сжала обе руки вокруг теплой миски.'
      outcomes:
        all: 'Показания и защиту все еще можно было прочитать рядом. В тюрьме у Катарины была горячая еда и тяжелое одеяло. Когда следующей осенью ее освободили, ее семья ждала снаружи с пальто, которое она могла закутать до подбородка.'
        p3: 'Железо потеряло свою остроту только после того, как закончилась зима. Она прошла через это. Приведя в порядок кровать, она осторожно сложила вместе два угла толстого одеяла.'
        p2: 'Адвокат получил копию. Он отметил несколько строк рядом с вещами, которых свидетели никогда не видели сами, перевернул страницу и перевернул ее обратно.'
        p1: 'Письменную защиту все еще можно было найти в деле спустя годы. Там, где угол был загнут, от неоднократного обращения осталась бледная линия.'
      none: 'Стена остыла, и на супе образовалась корочка. Телега проехала мимо окна, ее железные колеса ударялись о щели между камнями, и каждое ударялось все дальше и дальше.'
      not_admitted: '{staff} не мог войти в комнату, где хранились бумаги. Кто-то внутри передвинул сверток, и его шнур задел стол.'
      desync: 'Дело закрылось без защиты. Когда {staff} был отозван, квадратное пятно на столе все еще отмечало место, где лежали бумаги.'
      excerpts:
        p3: 'Прежде чем взять миску, она подоткнула угол одеяла себе на колени. Железное звено прижалось к кровати, когда она медленно сжала обе руки вокруг теплой миски.'
        p2: 'Три колонны давали многолюдной комнате для свидетельских показаний передохнуть. На месте, которого не видел ни один свидетель, перо остановилось недалеко от разлинованной линии.'
        p1: 'Клерк положил копию в стопку для подшивки. Когда оригинал был сложен, {staff} прижал поднявшийся угол.'
    relic: 'Копия защитительной речи'
    relic_desc: 'Чистовая копия страницы письменного выступления защиты. На полях исправлена дата.'
    points:
      p1: 'После того, как Катарину доставят в Леонберг, попросите хранителя документов защиты подать вторую копию, чтобы ее письменный ответ дошел до суда.'
      p2: 'Помогите семье рассортировать свидетельства из первых рук, слухи и последующие выводы в отдельные колонки.'
      p3: 'Доставьте в камеру в Гюглингене толстую подстилку и горячую еду, чтобы Катарина, семидесятитрехлетняя и закованная в цепи, пережила эту зиму.'
    points_fail:
      p1: 'Единственный экземпляр, который смогла найти семья, так и не был доставлен. В деле есть только обвинения, а офис отозвал сотрудника.'
      p2: 'Копия объединяет все три. Как только дело дойдет до дела, защите все равно придется спрашивать, кто что изначально сказал.'
      p3: 'В этом филиале она, как гласит история, провела зиму в цепях, и только двое мужчин охраняли ее день и ночь, а охрану платила семья.'
    shift:
      p1:
        was: 'Катарина была арестована в августе 1620 года. Через адвокатов Иоганн Кеплер настоял на письменном протоколе процесса.'
      p2:
        was: 'Показания и письменная защита сохранились. Защита ответила на претензии одно за другим и оспорила выводы, использованные для их связи.'
        now: 'Адвокат может сравнить три колонки и указать на утверждения, которые свидетели не смогли проверить самостоятельно.'
      p3:
        was: '7 августа 1620 года Катарина Кеплер была арестована и доставлена в Гюглинген, где четырнадцать месяцев содержалась в цепях под двумя охранниками за счет своей семьи. Она была освобождена осенью 1621 года и умерла примерно через шесть месяцев.'
        now: '{staff} уладил дела с охранниками семьи. Той зимой у нее была толстая постель и горячая еда; цепи остались, но она выдержала лучше, чем когда-либо в истории.'
        who: 'katharina_kepler'
        bio: 'В этом временном графике Катарина Кеплер имела теплую постель и горячую еду всю свою первую зиму в камере в Гюглингене и была сильнее, когда ее освободили осенью 1621 года.'
    vignettes:
      soup: '13 сентября {staff} несет кастрюлю ячменного супа по переулку в Гюглингене для жены тюремщика. Она говорит, что может определить, кто из заключенных, по возвращенным мискам: старуха отправляет свою обратно чистой и жалуется, что ей нужна соль.'
      hearing: '2 октября {staff} помогает секретарю адвоката доставить две пачки бумаг в ратушу Гюглингена для слушания. У дверей им говорят, что это отложено. Продавец ставит свертки на ступеньку и говорит, что он так часто их нес, что им уже пора бы знать дорогу.'
      frost: 'В середине ноября {staff} едет на возчике из Леонберга в Гюглинген. Возчик говорит, что дорога хуже всего там, где начинается долина Забер; на морозе поют колеса, и он научился определять расстояние по ноте.'
  puccini_brussels:
    name: 'Неоконченный дуэт'
    place: 'Брюссель'
    figure: 'Джакомо Пуччини'
    story: 'Пуччини отправился на лечение в Брюссель в ноябре 1924 года, когда финал «Турандот» еще не был закончен. Перо останавливается посреди мысли на одном наброске. На другом есть список инструментов. Позже Франко Альфано пришлось превратить такие фрагменты во что-то, что мог бы играть оркестр.'
    story_prose:
      opening:
        - 'Брюссель, ноябрь 1924 года. Пуччини приехал на лечение. «Турандот» подошла к своей финальной сцене, но конец дуэта все еще лежит в разрозненных листах. Некоторые содержат несколько тактов, другие — только названия инструментов.'
        - 'Исторически он умер в Брюсселе в том же месяце. Альфано выпало создать музыку, которую мог бы играть оркестр, по оставленным им эскизам. В этой ветке переписчик размещает две одинаковые строки на одном столе, где кто-то может их прочитать вместе с составителем.'
        - 'Этому путешествию нужен кто-то, кто сможет прочитать партитуру и проследить два возможных продолжения. Ему также нужен кто-то, кто знает, как ухаживать за пациентом, и может провести ночь у постели больного.'
      points:
        p1: '{staff} проследил басовую партию в обеих версиях вплоть до смены тональности, а затем разложил страницы по порядку перед Пуччини. Пуччини обозначил одну из линий. Когда карандаш поднялся, в конце перекладины все еще оставалось пустое место.'
        p2: 'В последнюю ночь {staff}, опираясь на опыт ухода за пациентами, положил подушку Пуччини и остался в пределах досягаемости. Нота лежала возле кровати корешком наружу. Его рука пересеклась и легла на спинку стула, поставленного рядом с ним.'
      outcomes:
        all: 'Позже тот, кто принимал счет, мог начать с карандашной отметки. В ту ночь в комнате лежала закрытая партитура, а стул все еще стоял возле кровати.'
        p2: 'Той ночью он какое-то время спал спокойно. Стул оставался достаточно близко, чтобы он мог прикоснуться к нему.'
        p1: 'Следующая рука, приступившая к работе над партитурой, разложила свободные страницы. На той полосе, где сменилась тональность, карандашная отметка попала как раз в то место, где должно было начаться новое письмо.'
      none: 'Стул у кровати был пуст. Углы двух листов налегали на стол. Только вблизи можно было определить, что лежит сверху.'
      not_admitted: '{staff} так и не нашел места в клинике, где можно было бы помочь. Полоса света показалась под дверью в конце коридора.'
      excerpts:
        p2: 'Нота лежала возле кровати корешком наружу. Его рука пересеклась и легла на спинку стула, поставленного рядом с ним.'
        p1: 'Пуччини обозначил одну из линий. Когда карандаш поднялся, в конце перекладины все еще оставалось пустое место.'
    relic: 'Эскиз для дуэта'
    relic_desc: 'Лист нотной бумаги с карандашной пометкой рядом с незаконченным отрывком.'
    points:
      p1: 'Помогите Пуччини расположить два альтернативных эскиза финального дуэта в порядке предпочтения, пока он еще может их взвесить.'
      p2: 'Используйте свой опыт, чтобы Пуччини мог провести последнюю ночь без худшего дискомфорта.'
    points_fail:
      p1: 'Листы остаются отдельными. Тому, кто возьмет на себя управление, все равно придется выбирать между ними.'
      p2: 'К концу ночи стул возле кровати все еще пуст, и дискомфорт не утих.'
    shift:
      p1:
        was: 'В ноябре 1924 года финальный дуэт все еще существовал фрагментами. Позже Альфано пришлось придумать, как присоединиться к выжившим.'
        now: 'Пуччини отмечает, какую альтернативу он хочет, когда музыка меняется в конце дуэта. Композитор, вступающий во владение, может начать с этого выбора.'
      p2:
        was: '24 ноября 1924 года Пуччини лечился от рака горла в Брюсселе. Он скончался в той же клинике 29 ноября.'
        now: '{staff} сидит рядом с Пуччини и помогает ему успокоиться. Ночь, которой он так боялся, прошла с меньшей болью и с кем-то достаточно близким, чтобы увидеть, когда ему понадобится помощь.'
        who: 'puccini_brussels'
        bio: 'Пуччини провел последнюю ночь в Брюсселе более спокойно. Рядом с ним был кто-то, когда он откладывал счет в сторону.'
    vignettes:
      divider: 'Переписчик кладет рядом на стол две карандашные меры. Они выглядят почти одинаково, пока {staff} не проводит пальцем по басу. Человек возвращается к тому, с чего начал. Другой оставляет место для дальнейшего. {staff} оставляет оба на столе, чтобы Пуччини мог их увидеть.'
      future: '{staff} ловит себя на том, что прослушивает концовку, которую знает по театру. Переписчик поднимает взгляд от планки, у которой еще нет конца. {staff} переворачивает страницу назад и просит начать с последнего такта, который они оба могут прочитать.'
      pin: 'Переписчик освобождает угол стола в поисках чашки. {staff} перемещает один лист рукописи немного дальше от края. Внизу листа, под почти пустым нотоносцем, на полях втиснуты два слова.'
  schumann_endenich:
    name: 'Мелодия в другой тональности'
    place: 'Эндених'
    figure: 'Роберт Шуман'
    story: 'Сохранилась копия короткой фортепианной пьесы времен Роберта Шумана, проведенного в Энденихе. Он поставил ее на целый тон ниже опубликованной оценки. В июле 1856 года Клара Шуман приехала в Бонн и попросила о встрече с ним. В гостевом доме Лина дважды скопировала мелодию. Она думает, что нижний — это ошибка.'
    story_prose:
      opening:
        - 'Эндених, недалеко от Бонна, июль 1856 года. Роберт Шуман находится здесь в плохом состоянии здоровья. Однажды он переписал одну из пьес из «Папиллонов» на целый тон ниже. В этом месяце к нему приезжает Клара Шуман.'
        - 'В истории Клара увидела его 27 июля. Когда она вернулась 29-го числа, она опоздала. В этой ветке Лина в гостинице сделала две копии с разными первыми нотами, а Эмиль знает две двери в переулке.'
        - 'Для этого путешествия нужен кто-то, кто сможет узнать одну и ту же мелодию в двух партитурах. Ему также нужен кто-то, кто знает дорогу, записывает встречи и может ждать поблизости, чтобы получить известия.'
      points:
        p1: '{staff} прочел обе партитуры и отметил, как начальная нота опустилась вниз, а интервалы остались прежними. Лина написала ключ вверху каждой страницы. Она положила две копии в папку рядом, оставляя на виду узкий белый край.'
        p2: '27 июля {staff} встретил Клару, как и было договорено, и пересек переулок к двери, где ее ждали. Когда он открылся, Клара убрала сложенную записку в руку. За дверью все еще светился косой вечерний свет.'
        p3: '29-го {staff} ждал поблизости вестей, встретил Клару на обратном пути и отвел ее прямо к постели. Она села и полезла под край одеяла. Рука Роберта неподвижно лежала у нее на ладони.'
      outcomes:
        all: 'Обе копии остались в одной папке, на каждой из которых вверху был написан ключ. 29-го числа Клара подошла к постели. Дверь в переулке все еще была открыта, а в комнате сплелись две руки.'
        p3: '29-го числа Клара подошла к постели. Когда она позже встала, стул все еще был придвинут к кровати.'
        p2: 'Визит 27-го числа все же состоялся в сумерках. Свет в переулке померк, прежде чем дверь медленно закрылась.'
        p1: 'Обе копии практики остались в одной папке. Когда я открыл его снова, вверху каждого листа был написан ключ.'
      none: 'Папка закрылась, а нижняя копия практики осталась снаружи. На его краю все еще виднелся узкий прогиб.'
      not_admitted: '{staff} не нашел на переулке никого, кто мог бы представиться. Обе двери на другой стороне улицы были закрыты.'
      desync: 'Клара ждала у другой двери, пока не прошел час посещения. Когда {staff} был отозван, сложенная записка все еще лежала в кармане пальто.'
      excerpts:
        p3: 'Она села и полезла под край одеяла. Рука Роберта неподвижно лежала у нее на ладони.'
        p2: 'Когда он открылся, Клара убрала сложенную записку в руку. За дверью все еще светился косой вечерний свет.'
        p1: 'Лина написала ключ вверху каждой страницы. Она положила две копии в папку рядом, оставляя на виду узкий белый край.'
    relic: 'Учебные ноты в двух тональностях'
    relic_desc: 'Две вымышленные копии нот для упражнений, каждая в своей тональности.'
    points:
      p1: 'Сравните две копии и запишите, почему в папке находится и та, которая начинается на тон ниже.'
      p2: 'Соблюдайте график визита Клары 27 июля, встретив ее до назначенного часа и проводя к нужной двери.'
      p3: '29 июля оставайтесь на связи и верните Клару к постели, прежде чем Роберт умрет.'
    points_fail:
      p1: 'Лина откладывает нижнюю версию в сторону. Следующий человек, открывший папку, увидит только версию опубликованного ключа.'
      p2: 'Клара ждет не у той двери и пропускает час посещения. Офис отзывает вас, когда этот визит выпадает из графика.'
      p3: 'Когда Клара возвращается в Энденич, Роберт уже умер.'
    shift:
      p1:
        was: 'Автограф Шумана на Папийоне № 10 времен Эндениха переносит пьесу из до мажора в си-бемоль мажор.'
        now: 'Лина хранит оба экземпляра для тренировок вместе. Вверху каждой она пишет ключ, чтобы следующий игрок знал, что ни одна из первых нот не является ошибкой копирования.'
      p2:
        was: '23 июля Брамс и доктор Рихарц призвали Клару подождать. Она навестила Роберта 27 июля между шестью и семью часами вечера.'
      p3:
        was: '29 июля Клара вернулась в Эндених с Брамсом и Йозефом Иоахимом после смерти Роберта.'
        now: '{staff} встречает Клару на обратном пути и приводит ее прямо в комнату. Она берет Роберта за руку, прежде чем он умирает.'
        who: 'schumann_endenich'
        bio: 'В Энденихе Клара была рядом с Робертом, когда он умер 29 июля 1856 года.'
    vignettes:
      key: 'Лина начинает с первой ноты в каждой копии. Прежде чем дойти до конца второго бара, она смотрит на {staff}. Она знает, что будет дальше, хотя ее пальцы находятся где-то в другом месте на клавиатуре.'
      envelope: 'Эмиль пообещал передать Кларе сложенную записку, если ее снова заставят ждать. Он спрашивает {staff}, какую дверь попробовать первой. Они переходят дорогу, где он может видеть обоих.'
      gift: 'Настоящая рукопись в конечном итоге перейдет к дочери Шумана Мари. Здесь, в гостевом доме, Лина оставляет два бумажных листка, чтобы отметить начало занятий. Когда {staff} поднимает крышку, одна пластина заскользила за другой.'
  nietzsche_turin:
    name: 'Адрес на обороте'
    place: 'Турин'
    figure: 'Фридрих Ницше'
    story: 'Письмо из Турина адресовано Францу и Иде Овербек. Ницше подписал его Дионис. Прибыв на квартиру к своему другу, Франц застает его читающим исправленные корректуры «Ницше против Вагнера». К тому времени, как они покинут Турин, кто-то должен будет решить, что будет с доказательствами по делу.'
    story_prose:
      opening:
        - 'Турин, январь 1889 года. Письмо отправляется Францу и Иде Овербекам с подписью и адресатами в разных местах. Когда Франц приезжает в Турин, Ницше читает последние корректуры «Ницше против Вагнера».'
        - 'По истории Овербек нашел своего друга 8 января и позже записал то, что он читал. В этом отделении Пьетро оставил багажную бирку у лестницы, а Люсии еще предстоит упаковать пачку писем.'
        - 'Эта поездка требует терпения, чтобы проверить адрес и направить посетителя к нужной двери. Ему также нужен кто-то, кто знает, как составлять и хранить доказательства и частные письма.'
      points:
        p1: '8 января {staff} сверил адрес с номером двери, дождался Овербека на лестнице и провел с ним остаток пути. Франц остановился у правой двери и постучал. Страница перевернулась внутрь, и ручка медленно повернулась на пол-оборота.'
        p2: '{staff} перечислил корректуры и письма отдельно, указав название книги на одной этикетке и только получателя на другой. У каждого пакета был свой кусок веревки. Люсия перевернула этикетку с именем получателя внутрь и большим пальцем надавила на угол.'
      outcomes:
        all: '8 января Овербек нашел Ницше. Позже два пакета отправились вместе. Он открыл тот, на котором было написано название, а другой вернулся, узлом по-прежнему обращенным к крышке.'
        p2: 'Бумаги дошли до следующей пары рук двумя пачками. Как только Овербек узнал название, он положил вторую пачку обратно на дно ящика.'
        p1: '8 января Овербек вошел в комнату своего друга. Когда дверь за ним закрылась, послышался тихий шорох переворачиваемой страницы.'
      none: 'Бумаги были сложены в одну стопку, имена были видны как на буквах, так и на корректурах. Обертка тянула шнур и колебалась, с какой стороны его завязать.'
      not_admitted: '{staff} не нашел в квартире никого, кто мог бы представиться. На перилах все еще лежала пустая багажная бирка.'
      desync: 'У другой двери никто не ответил. Когда агентство отозвало {staff}, Овербек все еще был на лестничной площадке.'
      excerpts:
        p2: 'У каждого пакета был свой кусок веревки. Люсия перевернула этикетку с именем получателя внутрь и большим пальцем надавила на угол.'
        p1: 'Франц остановился у правой двери и постучал. Страница перевернулась внутрь, и ручка медленно повернулась на пол-оборота.'
    relic: 'Дубликат багажной бирки'
    relic_desc: 'Вымышленная копия багажной бирки. На обороте указано, кому её передать.'
    points:
      p1: 'Проверьте адрес проживания и 8 января доставьте Овербека до нужной двери.'
      p2: 'Записывайте исправленные корректуры отдельно от личных писем, чтобы каждую пачку можно было передать, не открывая другую.'
    points_fail:
      p1: 'Овербека направляют не в то помещение, и офис отзывает сотрудника, когда встреча выпадает из расписания.'
      p2: 'Письма и корректуры помещаются в одну обертку. Тот, кто первым найдет исправления, также увидит имена в буквах.'
    shift:
      p1:
        was: 'Ницше написал Овербекам из Турина. Франц Овербек прибыл туда 8 января 1889 года, чтобы найти его.'
      p2:
        was: 'Позже Овербек вспоминал, что Ницше, когда приехал, читал последние корректуры «Ницше против Вагнера».'
        now: 'Корректуры и письма отправляются в отдельных упаковках. Овербек может сразу найти исправления, не нарушая вторую печать.'
    vignettes:
      address: 'Пьетро скопировал Диониса в строку назначения своего инвентаря. {staff} переворачивает квитанцию и показывает имена получателей. Он проводит одну линию через то, что написал, достаточно легко, чтобы можно было перечитать ее.'
      privacy: 'Люсия просит {staff} подержать сумку, пока она заворачивает бумаги. Кто-то на лестнице спрашивает, чьи они. Прежде чем ответить, она поворачивает этикетку к стене.'
      stairs: 'С лестничной площадки {staff} слышит шелест страницы. Затем кто-то стучит внизу, и Пьетро прикрепляет пустую багажную бирку к перилам лестницы, где он сможет снова ее найти.'
  sophie_germain_paris:
    name: 'Статья для Берлина'
    place: 'Париж'
    figure: 'Софи Жермен'
    story: 'Софи Жермен обменивалась работами по теории чисел с Карлом Фридрихом Гауссом, сначала подписывая свои письма Ле Блан. В 1816 году Академия наук наградила ее премией за работы по вибрирующим пластинам. Она продолжала работать после болезни в 1829 году. В седьмом томе журнала Крелле в Берлине были опубликованы ее мемуары о кривизне поверхностей под ее собственным именем. Она умерла в Париже 27 июня 1831 года.'
    story_prose:
      opening:
        - 'Париж, 1831 год. В юности Софи Жермен обсуждала теорию чисел с Гауссом под псевдонимом Ле Блан. Она получила приз за свою работу над вибрирующими пластинами. После болезни она продолжила работу над статьей о кривизне поверхностей, которая в конечном итоге появилась в журнале Крелля в Берлине.'
        - 'По истории она умерла в Париже в июне. Некоторые биографы отмечают, что Гаусс рекомендовал ей получить почетную степень в Геттингене. При жизни она не получила такой степени. В этом отделении водовоз все еще поднимается по лестнице на улице Савойя, а наверху на столе есть место для письма.'
        - 'Этой поездке нужен кто-то, кто сможет проверить математическую рукопись и увидеть ее в пути. Также найдется работа для того, кто сможет облегчить боль пациента или сообщить новости от ученых из-за границы.'
      points:
        p1: '{staff} проверил пометку страницу за страницей, привел листы в порядок и увидел бумагу в руках курьера, направлявшегося в Берлин. Жермен придержал верхний лист кончиком пальца. Когда {staff} убрал руку, край обертки оказался прямо над последней буквой вверху страницы.'
        p2: '{staff}, опираясь на свой опыт ухода, чтобы облегчить боль, оставалась там до тех пор, пока не смогла сама подойти к столу. Она потянулась к незаконченной странице и притянула ее ближе. К тому времени, как свет достиг стола, ее рука нащупала ручку.'
        p3: '{staff} принес рекомендацию Гаусса и медленно прочитал ее, следуя формулировке письма. Жермен взял страницу и прочитал ее с начала. Когда она положила его, в двух складках все еще оставался тонкий угол.'
      outcomes:
        all: 'Журнал в Берлине позже напечатал ее статью. За парижским столом она смогла заняться своей работой, пока боль утихла, и она дожила до того, чтобы прочитать, что Гаусс выдвинул ее имя. Письмо прижимало один угол стопки, скручиваясь по краю.'
        p3: 'Степень все же пришла слишком поздно. Новость дошла первым до Парижа, и письмо все еще можно было найти на столе, немного приподнявшись по складкам.'
        p2: 'Когда боль утихла, были моменты, когда она снова могла сидеть за столом. Несколько листов лежали раскрытыми посередине стола, точно так же, как она их и оставила.'
        p1: 'Статья появилась в седьмом томе в Берлине. В заголовке было напечатано имя Софи Жермен.'
      none: 'Лампа наверху погасла рано. Ведро все еще стучало о стену лестницы, а стул уже был задвинут под стол.'
      not_admitted: '{staff} не попал в комнату наверху на улице Савойя. Кто-то прошел мимо с ведром, деревянная ручка которого крутилась у него на ладони.'
      desync: 'Незапечатанная рукопись лежала на столе. Когда {staff} был отозван, пустая упаковка все еще лежала открытой, клапаном вверх.'
      excerpts:
        p3: 'Жермен взял страницу и прочитал ее с начала. Когда она положила его, в двух складках все еще оставался тонкий угол.'
        p2: 'Она потянулась к незаконченной странице и притянула ее ближе. К тому времени, как свет достиг стола, ее рука нащупала ручку.'
        p1: 'Жермен придержал верхний лист кончиком пальца. Когда {staff} убрал руку, край обертки оказался прямо над последней буквой вверху страницы.'
    relic: 'Письмо за подписью Ле Блан'
    relic_desc: 'Письмо Гауссу, написанное под чужим именем.'
    points:
      p1: 'Пока она болеет, сохраните ее мемуары о кривизне поверхностей по пути в журнал Крелля в Берлине.'
      p2: 'Облегчить боль от рака в ее последние месяцы в Париже'
      p3: 'Прежде чем она умрет, сообщите Жермен, что Гаусс просил Геттинген присвоить ей почетную степень.'
    points_fail:
      p1: 'Мемуары остаются незаконченными на ее столе, а том 1831 года появляется без них. Этот филиал выпадает из истории, и офис отзывает сотрудника.'
      p2: 'Никто не облегчает боль, и в этом отделении ее последние месяцы проходят так же тяжело, как и были.'
      p3: 'Ни одно слово не доходит до нее, и она умирает, так и не узнав, что Гаусс сделал для нее.'
    shift:
      p1:
        was: 'В 1831 году мемуары Жермен о кривизне поверхностей появились в седьмом томе журнала Крелль, в год ее смерти.'
      p2:
        was: 'Примерно с 1829 г. Жермен болел раком груди; она продолжала работать и умерла в Париже 27 июня 1831 года.'
        now: '{staff} подавляет боль с помощью современной медицины и сидит с ней в самые тяжелые часы. В последние месяцы она меньше страдает и продолжает работать за столом.'
      p3:
        was: 'Гаусс призвал Геттингенский университет присвоить Жермену почетную степень; когда она умерла 27 июня 1831 года, оно не было вручено.'
        now: '{staff} рассказывает о том, что сделал Гаусс. Жермен слышит, что университет, в котором она никогда не сможет поступить, хочет оказать ей честь.'
        who: 'sophie_germain_paris'
        bio: 'В этом временном графике Жермен перед своей смертью узнала, что Гаусс выдвинул ее на получение почетной степени в Геттингене. Сама степень все же пришла слишком поздно.'
    vignettes:
      water: '7 марта {staff} помогает водовозу доставить два ведра сенной воды на пять этажей дома на улице Савойя. Считая шаги между вдохами, он говорит, что дома в Париже становятся выше с каждым годом, а ему по-прежнему платят за ведро, а не за этаж.'
      quai: 'В середине апреля {staff} листает старый альманах в ларьке книготорговца на набережной. Книготорговец говорит, что вся стопка пришла из одного дома, а наценка полна сумм, которые он не может уследить, поэтому он продает их на вес.'
      wash: 'В конце мая {staff} помогает прачке отжимать простыни на лодке для стирки на берегу реки. Она говорит, что Сена всю весну поднималась и опускалась, лодка поднимается и опускается вместе с ней, и ее спина тоже.'
  modigliani_paris:
    name: 'Ярлык на обороте портрета'
    place: 'Париж'
    figure: 'Амедео Модильяни'
    story: 'В конце мая 1919 года Амедео Модильяни и Жанна Эбютерн вернулись в Париж из Ниццы с дочерью, родившейся в ноябре прошлого года. Его туберкулез ухудшался, и к осени у него уже не было сил рисовать. 24 января 1920 года он умер от туберкулезного менингита в больнице Шарите в Париже в возрасте тридцати пяти лет. Через два дня Жанна, на восьмом месяце беременности, умерла в доме своих родителей. Его коллеги-художники собрали деньги на его похороны 27 января. Его единственная персональная выставка в жизни, состоявшаяся двумя годами ранее, оказалась коммерческим разочарованием.'
    story_prose:
      opening:
        - 'Париж, январь 1920 года. Прошло более шести месяцев с тех пор, как Модильяни и Жанна Эбютерн вернулись из Ниццы с дочерью. Его болезнь обострилась. К осени ему стало трудно держать кисть.'
        - 'По истории Модильяни умер в больнице Шарите, а Жанна скончалась через два дня. В этой ветке кто-то еще может постучать в студию и повернуть в больницу или рядом с Жанной.'
        - 'В этой поездке нужен кто-то, кого художник будет слушать, и кто-то, кто сможет ухаживать за пациентом с необходимыми расходными материалами. Жанне также нужен человек, который сможет посидеть с ней и подождать.'
      points:
        p1: '{staff} перемещает портрет на свет и говорит ему, что через много лет люди пройдут долгий путь, чтобы увидеть людей на его картинах. Угол этикетки приподнимается сзади. Модильяни переворачивает портрет и кладет листок себе на ладонь.'
        p2: '{staff} добирается до студии, оказывает пациенту необходимую помощь и следует за людьми, везущими его в больницу. Кто-то подносит к двери стул. Только когда подопечный берет верх, {staff} отходит от рамки, которую он держал.'
        p3: 'В больнице {staff} лечит его с помощью привезенного оборудования и ждет, пока он сам сможет поставить чашку. Чашка стучит по столу. Модильяни протягивает другую руку и толкает ее немного дальше.'
        p4: '{staff} остается с Жанной и ждет, пока она сможет поесть, оставляя миску так, чтобы она могла до нее дотянуться. Жанна держит миску на коленях. Когда бумага на окне поднимается на сквозняке, она опускает ее угол под край.'
      outcomes:
        all: 'Студия снова открылась, и Жанна взялась за кисть. У стола стояли два низких табурета, на том, что у окна, было пятно краски.'
        p3: 'Модильяни вернулся в студию, когда выздоровел. Незаконченное лицо лежало на столе, кисть пересекала край страницы.'
        p4: 'Жанна снова рисовала. После того, как двое ее детей уснули, она расстелила возле лампы лист бумаги.'
        p1: 'Спустя годы кто-то остановился перед портретом. Этикетка все еще оставалась за рамкой.'
        p2: 'Его приняли в больницу. Человек, который шел с ним, сел на стул у двери.'
      none: 'У двери студии никого не было. После наступления темноты даже тонкий свет под ним исчез.'
      not_admitted: '{staff} так и не добрался до студии. Мешок с углем все еще стоял у стены на повороте лестницы.'
      desync: 'Трансфер в больницу сорвался. Когда агентство отозвало {staff}, половина площадки все еще оставалась пустой.'
      excerpts:
        p3: 'Чашка стучит по столу. Модильяни протягивает другую руку и толкает ее немного дальше.'
        p4: 'Жанна держит миску на коленях. Когда бумага на окне поднимается на сквозняке, она опускает ее угол под край.'
        p1: 'Угол этикетки приподнимается сзади. Модильяни переворачивает портрет и кладет листок себе на ладонь.'
        p2: 'Кто-то подносит к двери стул. Только когда подопечный берет верх, {staff} отходит от рамки, которую он держал.'
    relic: 'Палочка угля для рисунка'
    relic_desc: 'Кусочек угля для рисунка, от которого чернеют пальцы.'
    points:
      p1: 'Пока он еще в здравом уме, дайте ему знать, что люди, которых он нарисовал, запомнятся многим.'
      p2: 'Когда он лежит больной в студии и никто не звонит несколько дней, убедитесь, что его отвезли в больницу Шарите.'
      p3: 'В Шарите вылечить его туберкулезный менингит.'
      p4: 'В конце января побудьте с Жанной Эбютерн, на восьмом месяце беременности, и помогите ей пережить эти дни.'
    points_fail:
      p1: 'В этом отделении ему никто не говорит, что станет с его портретами после разочаровывающего приема на его единственной персональной выставке.'
      p2: 'В этом отделении никто вовремя не проходит через дверь, и его не проводят в «Шарите». Филиал выпадает из истории, и офис отзывает сотрудника.'
      p3: 'В этой отрасли болезнь протекает так же, как и раньше. Он умирает в Шарите 24 января в возрасте 35 лет.'
      p4: 'Сотруднику не удалось пробыть с Жанной все эти дни.'
    shift:
      p1:
        was: '3 декабря 1917 года полиция вмешалась в работу единственной за всю его жизнь персональной выставки Модильяни. Шоу прошло плохо.'
        now: '{staff} сообщает ему, прежде чем он заболеет, что нарисованные им люди будут висеть в музеях по всему миру.'
      p2:
        was: 'В январе 1920 года тяжело больной Модильяни был доставлен в больницу Шарите в Париже.'
      p3:
        was: '24 января 1920 года Модильяни умер от туберкулезного менингита в больнице Шарите в Париже в возрасте 35 лет.'
        now: '{staff} приносит лекарство, которое его вылечит. Он покидает больницу и возвращается в студию.'
        who: 'modigliani_paris'
        bio: 'Модильяни выздоровел зимой 1920 года и рисовал еще много лет, продолжая рисовать людей вокруг себя.'
      p4:
        was: '26 января 1920 года, через два дня после смерти Модильяни, Жанна Эбютерн, на восьмом месяце беременности, умерла в доме своих родителей, оставив четырнадцатимесячную дочь.'
        now: '{staff} остается с ней все эти дни. В этом временном графике Жанна рожает ребенка, воспитывает сына и дочь, а затем снова начинает рисовать.'
        who: 'jeanne_hebuterne'
        bio: 'Жанна Эбютерн пережила зиму 1920 года, родила второго ребенка, вырастила обоих детей и занялась живописью.'
    vignettes:
      coal: '10 января {staff} несет мешок с углем вверх по лестнице для уличного угольщика, который продает дрова, уголь и вино с одного и того же прилавка. Он говорит, что этой зимой никто на Монпарнасе не покупает целый мешок; они покупают половину, а за вторую половину платят обещаниями.'
      saucers: 'В начале февраля {staff} помогает официанту в кафе на Монпарнасе убирать со столов. Каждый напиток поставляется на отдельном блюдце, а счет считается по стопке. Он указывает на задний стол: там художники строят башни из тарелок и расплачиваются рисунками, когда кончаются деньги.'
      mimosa: 'В начале марта {staff} помогает продавцу цветов на рынке развязать первые букетики мимозы. Она говорит, что они приехали с юга на ночном поезде и в холодном марте они единственные желтые в Париже.'
  wallace_ternate:
    name: 'Статья с Тернате'
    place: 'Тернате'
    figure: 'Альфред Рассел Уоллес'
    story: 'В феврале 1858 года, после приступа лихорадки на Молуккских островах, Альфред Рассел Уоллес написал эссе о том, как разновидности отходят от своего первоначального типа. На нем указана дата и место: февраль 1858 года, Тернате. 25 марта Уоллес отплыл из Тернате с группой, в которую входил молодой охотник Джумаат. Они достигли Дори на побережье Новой Гвинеи. Эссе было отправлено Чарльзу Дарвину в Англию; 1 июля ее читали вместе с работой Дарвина в Лондоне, причем ни одного автора не было в зале.'
    story_prose:
      opening:
        - 'Молуккские острова, февраль 1858 года. После лихорадки Уоллес пишет эссе о том, как разновидности отклоняются от своих первоначальных форм. Он датирует это в Тернате.'
        - 'В истории эссе дошло до Англии. Уоллес отплыл в Дори, где повредил лодыжку. Джумаат, который путешествовал с ним, умер там в июне. В этом ответвлении кто-нибудь может наблюдать, пока Уоллес пишет, и добраться до Дори.'
        - 'В этом путешествии нужен кто-то, кто сможет остаться у постели больного и дать ее пациенту время отдохнуть. Ему также нужен кто-то, кто знает уход за ранами или принесет нужные материалы.'
      points:
        p1: 'Когда жар спадает, {staff} остается рядом и подносит бумагу и воду так, чтобы Уоллес мог до них дотянуться. Он пишет название места и делает паузу. {staff} ловит угол простыни, поднятой у окна.'
        p2: 'В Дори {staff} ухаживает за лодыжкой Уоллеса, ждет, пока он сможет выдержать вес, и идет с ним на несколько шагов дальше. Грязь за дверью все еще мокрая. Уоллес вступает в него, и второй отпечаток оказывается таким же глубоким, как и первый.'
        p3: 'Джумаат не может встать с постели. {staff} остается с ним и использует принесенные с собой припасы, пока не сможет переместить миску самостоятельно. Джумаат сначала держит чашу обеими руками, затем отпускает одну. Вода течет по его запястью и капает возле кровати.'
      outcomes:
        all: 'В конце концов газета достигла Англии. Когда лодка отошла от Дори, Джумаат скинул ноги за борт, а Уоллес освободил место на скамейке.'
        p3: 'В конце июля на лодке нашлось место еще для одного. Джумаат сел с миской у ног.'
        p2: 'Уоллес вернулся в лес, пока пароход находился в Дори. Пройдя немного дальше, он наклонился, чтобы вытереть грязь со своего ботинка.'
        p1: 'Позднее эссе было прочитано в Лондоне. При открытии рукописи в последней строке все еще было написано «Тернате».'
      none: 'У окна стоял стол. Когда вошла влага, внешний угол простыни начал скручиваться.'
      not_admitted: '{staff} не попал в группу. Веревка у причала провисла и прочертила линию по воде.'
      desync: 'Газета у кровати лежала незаконченной. Когда {staff} был отозван, внутри рамы все еще оставался след сырости.'
      excerpts:
        p3: 'Джумаат сначала держит чашу обеими руками, затем отпускает одну. Вода течет по его запястью и капает возле кровати.'
        p2: 'Грязь за дверью все еще мокрая. Уоллес вступает в него, и второй отпечаток оказывается таким же глубоким, как и первый.'
        p1: 'Он пишет название места и делает паузу. {staff} ловит угол простыни, поднятой у окна.'
    relic: 'Жук в игольной коробке'
    relic_desc: 'Собранный жук в небольшой жестяной коробочке.'
    points:
      p1: 'Во времена малярии дочитайте эссе до конца.'
      p2: 'Вылечите лодыжку, которую он повредил в Дори, прежде чем она превратится в язву'
      p3: 'Спасите юного охотника Джумаата от лихорадки и дизентерии.'
    points_fail:
      p1: 'Лихорадка так и не спала, и проект не был закончен в феврале. Письма, которые взял почтовый корабль, не вмещали его, и в этом отделении Линнеевского общества на 1 июля такой бумаги не было.'
      p2: 'Рана, как гласит история, гноилась, и он больше месяца просидел в избе на костыле. В этой ветке насекомых леса Дори по-прежнему ловили только его слуги.'
      p3: 'Джумаат умер 26 июня, как гласит история, и в этой ветке лодка, покинувшая Дорей в июле, прошла без него.'
    shift:
      p1:
        was: 'В феврале 1858 года, как только малярия пошла на убыль, Уоллес написал статью и подписал ее «Тернате».'
      p2:
        was: 'В мае 1858 года Уоллес повредил лодыжку в Дори; рана превратилась в язву, из-за которой он больше месяца не мог стоять на ногах.'
        now: 'Рана не гноилась, и в те дни, когда пароход находился в порту, он, как и прежде, каждый день ходил в лес.'
      p3:
        was: '26 июня 1858 года в Дори умер Джумаат, юноша лет восемнадцати; Уоллес писал о нем как о тихом парне, который хорошо выполнял свою работу.'
        now: '{staff} сидел с ним, пока лихорадка не спадала и болезнь не прекратилась, а когда в конце июля они покинули Дори, он тоже был на лодке.'
    vignettes:
      places: '{staff} копирует метки дневных птиц и пишет остров рядом с каждой, чтобы ящик со шкурами можно было прочитать без коллекционера.'
      claim: '{staff} сортирует лоток с жуками с двух похожих друг на друга островов и держит их в два ряда с промежутком между ними, даже не спросив об этом.'
      mail: '{staff} складывает страницы длинного письма в промасленную бумагу и завязывает двойным узлом, как это делает моряк с картой.'
  hooke_london:
    name: 'Распорядитель опытов'
    place: 'Лондон'
    figure: 'Роберт Гук'
    story: 'Читатель достает старую «Микрографию» Гука и пытается скопировать пробку. Края рисунка вскоре превращаются в аккуратные соты, которых Гук никогда не видел. В той же комнате проходят пачки лекций и демонстраций. Тому, кто откроет через год, придется отличить недостающую страницу от пустой.'
    story_prose:
      opening:
        - 'Лондон, 1703 год. Ячейки пробки в «Микрографии Гука» похожи на соты, хотя края у них неровные. Читатель, прослеживающий гравюру, продолжает хотеть закрыть пробелы.'
        - 'По истории Уоллер опубликовал некоторые лекции, в то время как другие статьи ждали более поздних редакторов. В этой ветке кто-то вычерчивает тарелку в сырой комнате, а кто-то другой приходит передвигать свертки.'
        - 'Для этой поездки нужен кто-то, кто сможет хранить лекции вместе и каталогизировать остальные пакеты. Также найдется работа для того, кто умеет прочитать рисунок и помочь читателю увидеть разрыв строки.'
      points:
        p1: 'Когда бумаги нужно переместить, {staff} проверяет лекции по порядку и возвращает скрученные листы в пачку. Комплект переехал, но его старая обложка все еще лежит сверху. Затягивая шнур, {staff} удерживает его от выступающего угла.'
        p2: '{staff} перечисляет названия оставшихся пакетов и еще раз сверяет их с документами. Каталог попадает туда, где его можно будет увидеть, как только откроется сундук. Последняя линия еще влажная, поэтому {staff} оставляет крышку приоткрытой на ширину пальца.'
        p3: '{staff} кладет черту рядом с гравировкой и спрашивает Гука, где линия должна прерываться. Палец Гука останавливается между двумя фигурами. Там, где две линии никогда не пересекаются, все еще видна бумага без пометок.'
      outcomes:
        all: 'Два года спустя лекции были напечатаны, и даже у оставленных статей были названия, которые нужно было искать. Позже кто-то, открыв сундук, первым поднял тонкий список.'
        p2: 'Следующий человек, ищущий неопубликованную запись, может назвать пакет. Когда крышка поднялась, каталог оказался сверху.'
        p3: 'Читатель вернулся к обрисовке. Палец обошел одну ячейку и остановился на щели.'
        p1: 'В конце концов Уоллер прочитал лекции. Под обложкой они лежали в старом порядке.'
      none: 'Крышка опустилась, и был слышен только звук ударов бумаги по дереву. Незаконченный рисунок все еще лежал у окна.'
      not_admitted: '{staff} не попал в комнату с лекциями. Небольшой свет через дверь показал угол сундука.'
      desync: 'Лекции развалились, когда их перенесли. Когда отозвали {staff}, шнур все еще лежал на столе.'
      excerpts:
        p2: 'Каталог попадает туда, где его можно будет увидеть, как только откроется сундук. Последняя линия еще влажная, поэтому {staff} оставляет крышку приоткрытой на ширину пальца.'
        p3: 'Палец Гука останавливается между двумя фигурами. Там, где две линии никогда не пересекаются, все еще видна бумага без пометок.'
        p1: 'Комплект переехал, но его старая обложка все еще лежит сверху. Затягивая шнур, {staff} удерживает его от выступающего угла.'
    relic: 'Рисунок блохи'
    relic_desc: 'Копия складной гравюры с изображением блохи из Micrographia.'
    points:
      p1: 'Сохраняйте лекции вместе при перемещении пакетов, чтобы Уоллер все равно мог собрать их для своего издания.'
      p2: 'Сохраните список пакетов вне лекций с достаточной детализацией, чтобы будущий редактор мог их найти.'
      p3: 'Покажите Гуку след читателя, пока он еще здесь и смотрит на него, и спросите, какие строки следует оставить открытыми.'
    points_fail:
      p1: 'Одну пачку лекций забирают вместе с разбросанными бумагами. Уоллер больше не может собрать коллекцию, и офис отзывает сотрудника.'
      p2: 'Следующий редактор сможет сказать, что было напечатано. Ничто в этом списке не указывает на другие документы.'
      p3: 'След остается в книге. Читатель уже заполнил строки и не сможет спрашивать, где они находятся.'
    shift:
      p1:
        was: 'Гук умер в 1703 году. Ричард Уоллер подготовил сборник посмертных сочинений, изданный в 1705 году.'
      p2:
        was: 'В книге Уоллера сохранились некоторые документы. Части дневников и других работ Гука появились позже через других редакторов.'
        now: 'Второй список попадает в сундук. Тот, кто ищет демонстрации, которые не были напечатаны, может начать с запроса пакета с названием.'
      p3:
        was: 'В «Микрографии» Гук сравнил поры пробки с сотами и указал, что их форма неправильная.'
        now: '{staff} устанавливает трассировку рядом со старой пластиной. Читатель оставляет открытыми две строки после того, как Гук указывает на то место, где скопированный узор перестает соответствовать пластине.'
    vignettes:
      edge: 'Читатель проводит две линии вокруг поры, затем соединяет их с третьей, отсутствующей на пластинке. {staff} сохраняет трассировку в окне. Придуманная линия – самая прямая на листе.'
      analogy: '{staff} просит читателя найти ячейку, которая не соответствует гребню, который он нарисовал вверху страницы. Вскоре они оба указывают на один и тот же кривой край.'
      plate: 'Когда ридер открывает еще один створ, блоха занимает почти весь стол. {staff} удерживает один угол вниз, пока считывающее устройство убирает чернила с пути.'
  leavitt_cambridge_ma:
    name: 'Правило для звёзд'
    place: 'Кембридж, Массачусетс'
    figure: 'Генриетта Ливитт'
    story: 'В циркуляре Гарварда 1912 года перечислены двадцать пять переменных звезд из Малого Магелланова Облака в порядке периода. Ливитт отдельно составил график их самых ярких и самых слабых показаний. На обоих графиках звезды, которым потребовалось больше времени для повторения своих циклов, были ярче.'
    story_prose:
      opening:
        - 'Кембридж, Массачусетс, 1912 год. Ливитт расставил двадцать пять переменных в Малом Магеллановом Облаке по периодам и нанес на график их показания при самых ярких и самых слабых значениях. На обоих графиках чем больше период, тем ярче звезда.'
        - 'В истории таблица появилась в проспекте Гарвардской обсерватории. Более поздние исследователи использовали цефеиды Млечного Пути для первой калибровки. В этой ветке кто-то может постоянно проверять таблички и присылать список звезд-кандидатов с просьбой указать время наблюдения.'
        - 'Для этого путешествия нужен кто-то, кто сможет сопоставить тусклую звезду со стеклом, и кто-то, кто сможет обосновать следующие наблюдения.'
      points:
        p1: 'Перед печатью {staff} сверяет слабые наблюдения со стеклянными пластинами. Как только появляется недостающая звезда, Ливитт возвращает ее на место в столе. Линейка отодвигается от последней строки. Сквозь стекло крошечная точка все еще там.'
        p2: '{staff} объясняет оставшуюся проблему калибровки в приложении для наблюдения за временем и прикрепляет список звезд-кандидатов. Когда приходят измерения, Ливитт соединяет два листа вместе. Ее карандаш пересекает шов и останавливается на той же звезде.'
      outcomes:
        all: 'Таблица вышла в печати, и в конечном итоге на стол попали новые наблюдения. Ливитт открыл конверт и положил новые показания рядом со старыми графиками.'
        p2: 'Позже Ливитт проверила измерения со своими коллегами. Два набора показаний лежали рядом с пометками карандаша под одной и той же звездой.'
        p1: 'Распечатанный проспект лежал на столе в раскрытом виде. Точки на обоих графиках по-прежнему следовали одной и той же наклонной линии.'
      none: 'Тарелки вернулись в свою коробку. Верхняя соскользнула к краю, оставив угол на свету.'
      not_admitted: '{staff} не попал в комнату, где проверялись номера. Когда в дверь вошел ящик, в одном углу стекла сверкнуло.'
      desync: 'Когда таблица вошла, разрыв все еще был. Когда был вызван {staff}, линейка все еще удерживала несовпадающую строку.'
      excerpts:
        p2: 'Когда приходят измерения, Ливитт соединяет два листа вместе. Ее карандаш пересекает шов и останавливается на той же звезде.'
        p1: 'Линейка отодвигается от последней строки. Сквозь стекло крошечная точка все еще там.'
    relic: 'Стеклянная фотопластинка'
    relic_desc: 'Фотопластинка, усыпанная крошечными звездочками.'
    points:
      p1: 'Сопоставьте размеры слабых звезд с их пластинами перед печатью и защитите таблицу двадцати пяти периодов Ливитта.'
      p2: 'Используйте неразрешенную калибровку циркуляра, чтобы выиграть время для наблюдения, чтобы Ливитт мог принять участие в следующем этапе.'
    points_fail:
      p1: 'Строки, номера которых невозможно проверить, вырезаются, и таблица двадцати пяти периодов не отображается. Офис отзывает сотрудника после потери синхронизации.'
      p2: 'Соотношение периода и яркости сохраняется, и его абсолютная калибровка применяется в другом месте.'
    shift:
      p1:
        was: '3 марта 1912 года в циркуляре 173 Гарвардской обсерватории были опубликованы периоды Ливитта для двадцати пяти переменных в Малом Магеллановом Облаке.'
      p2:
        was: 'В 1913 году в первой калибровке использовались цефеиды Млечного Пути.'
        now: '{staff} отправляет запрос на наблюдение за временем с прикрепленным списком кандидатов. У Ливитта есть время проверить новые измерения с командой, когда они придут.'
        who: 'leavitt_cambridge_ma'
        bio: 'Ливитт продолжала работать над яркостью звезд и принимала участие в применении своего отношения к расстояниям. Она оставила свои собственные записи наблюдений по калибровке.'
    vignettes:
      rank: 'Пустой номер звезды нарушает последовательность. {staff} зачитывает точку вслух, пока переписчик просматривает журнал пластин. Точки остаются на своих местах, пока число не будет найдено.'
      distance: '{staff} удерживает два графика рядом. Переписчик изменил масштаб на одном листе. Они перекопируют ось перед сравнением точек.'
      period: 'Переписчик вызывает яркость и тянется к следующему ряду. {staff} помещает линейку под старую строку до тех пор, пока ее точка тоже не будет скопирована.'
    remarks:
      trait_methodical: '{staff} еще раз проверяет номер, прежде чем вернуть пластину в чехол.'
  su_shi_huangzhou:
    name: 'Ссылка на Восточном склоне'
    place: 'Хуанчжоу'
    figure: 'Су Ши'
    story: 'После суда над поэзией на террасе ворон в 1079 году Су Ши был сослан в Хуанчжоу, где он обрабатывал участок на восточном склоне и взял его название Дунпо. В седьмом месяце 1082 года он вышел с гостями на реку ниже Красного утеса и написал «Бывшую оду на Красном утесе»; на десятом месяце он вернулся из Снежного зала в Лингао и написал «Последнюю оду». Он покинул Хуанчжоу в 1084 году.'
    story_prose:
      opening:
        - 'Хуанчжоу во времена правления Юаньфэна. Изгнанный после дела о Вороньей террасе, Су Ши начал строительство к востоку от города и взял себе имя Дунпо, Восточный склон. На пятом курсе Юаньфэна он дважды писал о Красной скале. В осеннем отчете он описал восхождение на утес.'
        - 'Исторически его семья жила на свои сбережения. Услышав о том, что вокруг Юэ и Э тонут младенцы, он написал письмо с просьбой остановить это и выступил за помощь бедным семьям в воспитании своих детей. В этом филиале есть работа на склоне, на пароме и на пороге домов этих семей.'
        - 'Для этого путешествия нужен кто-то, кто знает местность и кто-то, кто сможет пройти ночью по крутой тропе. Ему также нужен кто-то, кто сможет ухаживать за новорожденными и терпеливо разговаривать от двери к двери.'
      points:
        p1: '{staff} вместе с рабочими поднимается по склону и использует свои знания о сельском хозяйстве, чтобы направлять воду между грядками. Во время сбора урожая приходится носить с собой дополнительные мешки. Последний мешок прислоняется к стене, затрагивая линию старой пыли. Над ним на балке все еще свисает связка монет.'
        p2: 'В ночь полнолуния десятого месяца {staff} помогает найти твердую опору на крутых местах и остается на обратном пути к лодке. Когда фигура опускается, {staff} поворачивает лампу к воде. Волна ударяется о доски, и пламя дрожит.'
        p3: '{staff} вместе с группой ходит от дома к дому, ухаживает за новорожденными и разговаривает с людьми, которые будут о них заботиться. Одно домохозяйство закрывает дверь только с наступлением темноты. В полоске света шевелится небольшой сверток ткани.'
      outcomes:
        all: 'В тот год на Восточном склоне было зерно, из Ред-Клиффа вернулась мокрая одежда, и несколько семей оставили своих детей. Ночью кто-то в помещении расстелил маленькое покрывало.'
        p3: 'Той зимой несколько семей могли растить своих малышей дома. Посетитель отступил назад и услышал, как кто-то придвинул лампу поближе.'
        p1: 'После сбора урожая цепочка монет продержалась на несколько месяцев дольше. Новые мешки были прислонены к стене, а в углу ткани все еще оставалась земля.'
        p2: 'После второго визита блеф нашел свое отражение в рапсодии. На открытой странице чернила темнее всего там, где кисть остановилась.'
      none: 'Паром затих, свернутый канат все еще находился на носу. У чьих-то ног лампа дала последний свет.'
      not_admitted: '{staff} не нашел места в Хуанчжоу. Моток веревки на пароме потускнел в тумане.'
      desync: 'На участке ниже Красного утеса дела пошли не так. Незадолго до отзыва лампа в руках {staff} освещала только воду под планширем.'
      excerpts:
        p3: 'Одно домохозяйство закрывает дверь только с наступлением темноты. В полоске света шевелится небольшой сверток ткани.'
        p1: 'Последний мешок прислоняется к стене, затрагивая линию старой пыли. Над ним на балке все еще свисает связка монет.'
        p2: 'Когда фигура опускается, {staff} поворачивает лампу к воде. Волна ударяется о доски, и пламя дрожит.'
    relic: 'Соломенный плащ'
    relic_desc: 'Грубый дождевик, какой носили фермеры на склоне.'
    points:
      p1: 'Помогите его семье собрать урожай на пустыре на восточном склоне и пережить дни, когда сбережения закончатся.'
      p2: 'В ночь полнолуния десятого месяца держите его на утесе над рекой, чтобы он вернулся к лодке.'
      p3: 'Спасите новорожденных детей в деревнях, которых должны были утопить в тазике с водой'
    points_fail:
      p1: 'В этой ветви во время осенней жатвы на восточном склоне не было лишней пары рук, и ниток монет на балке становилось все меньше и меньше одна за другой.'
      p2: 'Той ночью он потерял равновесие на скале, и в этой ветке нет возврата к лодке.'
      p3: 'В этой ветке тазики в деревнях остались прежними, и {staff} не переселил ни одну семью, чтобы оставить себе этого ребенка.'
    shift:
      p1:
        was: 'В 1081 году Су Ши заложил землю на склоне к востоку от города и содержал в хозяйстве сто пятьдесят денег в день.'
        now: 'Той осенью восточный склон дал еще несколько возов зерна, и в конце года на балке все еще оставались связки монет.'
      p2:
        was: 'В полнолуние десятого месяца 1082 года Су Ши в одиночку поднялся на обломок Красного утеса и вернулся к лодке, а позже написал Вторую оду на Красном утесе.'
      p3:
        was: 'Он услышал о утоплении младенцев в окрестностях Юэ и Э, написал префекту Эчжоу с просьбой запретить это законом, а в Хуанчжоу предложил создать общество по воспитанию детей, прося у богатых денег, чтобы помочь бедным семьям содержать своих новорожденных.'
        now: '{staff} ходил от двери к двери вместе с обществом, и той зимой еще несколько семей оставили себе только что родившихся у них детей.'
    vignettes:
      slope: '{staff} несет воду по склону для наемных рабочих. В сумерках сосед, приготовленный к игре, оставляет на краю поля миску с вареной фасолью и говорит, что новичок может получить вторую миску завтра.'
      lamp: '{staff} сидит на камне у дороги с лампой, защищенной от ветра. Шаги раздаются со склона уже после третьей стражи; {staff} поворачивает лампу в сторону дорожки и ничего не говорит.'
      ferry: '{staff} помогает лодочнику, подготовленному для игры, смотать веревку на пристани. Он говорит, что в тихую ночь вода под скалой течет медленно, и гости всегда просятся на дальнюю сторону.'
  tang_xianzu_linchuan:
    name: 'Пьеса о любви сильнее смерти'
    place: 'Линьчуань'
    figure: 'Тан Сяньцзу'
    story: 'Тан Сяньцзу датировал свое предисловие к «Пионовому павильону» осенью 1598 года. В десятой сцене Ду Линян весной посещает сад, затем засыпает и встречает во сне молодого человека.'
    story_prose:
      opening:
        - 'Линьчуань, осень 1598 года. Тан Сяньцзу датирует свое предисловие «Пионовым павильоном». В пьесе Ду Линян идет по саду и засыпает, мечтая о молодом ученом.'
        - 'В истории слова позже были изменены, чтобы их было легче петь. Тан написал игрокам Ихуана с просьбой использовать его текст. В этой ветке есть измененный лист на репетиции и реплика, которую актеры постоянно пропускают.'
        - 'В этой поездке нужен человек, который сможет найти пропущенные слова и услышать, когда пропала реплика. Также нужен кто-то, кто знает, как текст на странице соответствует голосам на сцене.'
      points:
        p1: '{staff} сравнивает репетиционный лист с текстом, проверенным Таном, прослеживает пение до пропущенных слов и копирует полную версию для труппы Ихуан. Кто-то впереди открывает копию на той же странице и следит за строкой на слух. По сигналу ожидающий своего часа актер поднимает ногу.'
      outcomes:
        all: 'Они продолжали репетировать сцену по проверенному тексту. Ожидавший своего часа актер держал листок, сложенный угол которого упал рядом с кием.'
        p1: 'Они продолжали репетировать сцену по проверенному тексту. Ожидавший своего часа актер держал листок, сложенный угол которого упал рядом с кием.'
      none: 'Страница репетиции переворачивается. Рядом со сценой кто-то все еще держит листок, на котором не хватает нескольких слов там, где должен был появиться следующий голос.'
      not_admitted: '{staff} не попал на репетицию. Из-за стены раздался голос, а снаружи все, что было видно, — это передвинутый стул.'
      excerpts:
        p1: 'Кто-то впереди открывает копию на той же странице и следит за строкой на слух. По сигналу ожидающий своего часа актер поднимает ногу.'
    relic: 'Печатный песенник'
    relic_desc: 'Печатные арии для певцов с названием мелодии над каждой.'
    points:
      p1: 'Помогите ему оформить чистовую копию «Пионового павильона» с его собственными исправленными словами и передать ее в руки компании Ихуан, чтобы они репетировали по его тексту.'
    points_fail:
      p1: 'Как и в истории, измененные версии распространились позже, и все, что он может сделать, это написать музыкантам Ихуана, чтобы они не пели их; эта ветка такая же, как была история.'
    shift:
      p1:
        was: 'После 1598 года Тан Сяньцзу написал письмо, в котором просил игроков Ихуана придерживаться его оригинальных слов вместо использования версии, измененной для пения.'
        now: 'У компании Ихуана была копия, которую он сам исправил до появления каких-либо измененных версий, и продолжал петь на ее основе.'
        who: 'tang_xianzu_linchuan'
        bio: 'На этой временной шкале текст «Пионового павильона», который Тан Сяньцзу исправил сам, первым достиг компании Ихуана, и они продолжали петь из него.'
    vignettes:
      empty_garden: '{staff} ставит стул спиной к стене. Игрок пересекает голый пол и смотрит вниз, пока она поет. Со скамейки переписчик может сказать, где заканчивается тропа.'
      cue: 'Певица останавливается там, где строка сократилась. Ее партнер пропускает вход. {staff} возвращает пропущенные слова в бланк репетиции и просит их повторить попытку передачи.'
      breath: 'Певица оставляет немного воздуха в конце куплета. {staff} отмечает эту паузу на отдельном слипе для игрока, ожидающего своего часа.'
  xu_xiake_lijiang:
    name: 'Тропа, по которой он не успел подняться'
    place: 'Лицзян'
    figure: 'Сюй Сякэ'
    story: 'Во втором лунном месяце 1639 года Сюй Сякэ остановился в Цзетуо Линь в Лицзяне, собирая книги для Му Цзэна, который в знак благодарности прислал ему еду, а затем и подарки. Сюй слышал, что над монастырем расположены терраса Гуншоу и Львиная скала. Он написал, что из-за напряженной работы у него не было времени подняться ни на одну из них.'
    story_prose:
      opening:
        - 'Лицзян, второй лунный месяц 1639 года. Сюй Сяке проверяет книги Му Цзэна в Цзетуолине. Он слышит, что Терраса Гуншоу и Львиная скала лежат выше за ней, и записывает их имена в свой дневник.'
        - 'В истории книги не давали ему возможности посетить какое-либо место. Позже Му Цзэн прислал ему подарки в знак благодарности и снова попросил его пересмотреть запись о горе Дзидзу. В этой ветке вместе лежат возвратный лист и бумага для прогулки.'
        - 'Для этой поездки нужен кто-то, кто сможет проверять объемы и следить за их безопасной доставкой. Ему также нужен кто-то, кто сможет идти в ногу с проводником и сопровождающим и помнить, где путь поворачивает назад.'
      points:
        p1: '{staff} сверяет тома со списком возврата и спрашивает у мессенджера, какие уже сданы. Посыльный кладет квитанцию сверху. Страницы внизу аккуратно лежат в коробке, снаружи все еще виден один узкий язычок.'
        p2: 'Когда книги сданы, {staff} просит местного гида провести его и вместе с Сюем и сопровождающими поднимается на террасу Гуншоу. Шаг за шагом появляется гора напротив. Когда Сюй видит все это, он делает отметку на краю страницы.'
        p3: '{staff} идет по развилке под Львиным утесом вместе с Сюем с обеих сторон и показывает ему, где тропа поворачивает назад. Эскиз позже установлен внутри порога в Цзетуолине. В сложенном виде до последней секции сгиб остается целым на странице.'
      outcomes:
        all: 'После того, как книги вернулись, прогулка также попала в дневник. Когда эскиз, оставленный в Цзетуолине, был открыт, две дорожки свернули рядом с двумя отдельными складками.'
        p3: 'Эскиз остался в Цзетуолине. Кто-то указал на изгиб под Лайон-Клифом и снова сложил его.'
        p2: 'Счет Лицзяна теперь занимал то место, где стоял сам Сюй. Он снова повернулся к странице и приложил палец к той линии, где впервые появилась гора.'
        p1: 'Позже Му Цзэн поблагодарил и возобновил свою просьбу. Когда ответ был убран, вкладки томов все еще лежали в ряд.'
      none: 'Ящик закрылся. Запасная простыня вилась у порога, ее свободный конец касался земли.'
      not_admitted: '{staff} не нашел места среди людей, проверяющих книги. За дверью кто-то передвинул коробку, и крышка постучала.'
      desync: 'Перед доставкой объемы не проверялись. Когда {staff} был отозван, список у сундука был помечен лишь наполовину.'
      excerpts:
        p3: 'Эскиз позже установлен внутри порога в Цзетуолине. В сложенном виде до последней секции сгиб остается целым на странице.'
        p2: 'Шаг за шагом появляется гора напротив. Когда Сюй видит все это, он делает отметку на краю страницы.'
        p1: 'Посыльный кладет квитанцию сверху. Страницы внизу аккуратно лежат в коробке, снаружи все еще виден один узкий язычок.'
    relic: 'Эскиз маршрута от Цзетуо Линя'
    relic_desc: 'Сложенный эскиз с линией вверх по склону и пустым полем рядом с развилкой.'
    points:
      p1: 'Проверьте возврат исправленных томов с помощью посланника, чтобы Му Цзэн мог подтвердить работу и возобновить свой запрос на Справочник горы Цзи.'
      p2: 'Освободите полдня, найдите местного гида и сопровождающего и прогуляйтесь от Цзетуо Линь до террасы Гуншоу вместе с Сюем.'
      p3: 'Пройдите развилку под Львиной скалой вместе с Сюем и оставьте копию новых заметок о маршруте в монастыре.'
    points_fail:
      p1: 'На возвращенные тома отсутствуют чеки. Мессенджер не может подтвердить, что ранее работа была выполнена, передача пропускается, и офис отзывает сотрудника.'
      p2: 'Дневное копирование занимает весь день. Терраса Гуншоу осталась в дневнике как место, о котором Сюй слышал.'
      p3: 'Сюй покидает Лицзян, не имея возможности сесть рядом с услышанными им указаниями.'
    shift:
      p1:
        was: 'В девятый день второго лунного месяца 1639 года Му Цзэн прислал подарки в знак благодарности за сопоставление и снова попросил Сюя составить «Справочник горы Цзи».'
      p2:
        was: 'В шестой день второго лунного месяца 1639 года Сюй написал, что он был слишком занят сопоставлением, чтобы подняться на террасу Гуншоу или Львиную скалу.'
        now: 'После доставки заказа {staff} отвозит Сюй обратно в Цзетуо Линь, чтобы встретить гида и сопровождающего. Сюй поднимается на террасу и замечает, где виден противоположный склон.'
      p3:
        was: 'В 1639 году в дневнике Лицзяна упоминается Львиная скала, поскольку Сюй слышал, что где-то она находится выше, и у него не было времени подняться.'
        now: '{staff} вместе с Сюй идет по развилке в обоих направлениях. Сюй отмечает поворот, где тропинки разворачиваются, и оставляет копию эскиза в Цзетуо Линь.'
        who: 'xu_xiake_lijiang'
        bio: 'Дневник Сюя Лицзяна содержит дополнительную запись из первых рук между сопоставлением и его отъездом. Вторая копия его эскиза остается у Цзетуо Линя.'
    vignettes:
      view: 'Гид описывает изгиб горы, перед которой он стоит. {staff} спрашивает его, сколько ходов осталось до этого. Вид и путь туда идут по разным направлениям.'
      trail: 'Сопровождающий поднимается по крутой лестнице и приходит с мокрыми наручниками. {staff} вешает сухую ткань у двери и передвигает почти законченные страницы дальше внутрь.'
      slope: 'На ступенях монастыря {staff} вытаскивает свежий лист. Депеша для Му Цзэна возвращается в коробку. Чистый лист предназначен для маршрута.'
    remarks:
      trait_methodical: '{staff} добавляет к эскизу стрелку, чтобы следующий путешественник знал, в какую сторону идти в гору.'
  savitribai_phule_pune:
    name: 'Запасное сари в сумке'
    place: 'Пуна'
    figure: 'Савитрибаи Пхуле'
    story: 'В 1848 году Савитрибай и Джьотирао Пхуле начали обучать девочек в Пуне. В отчетах о ее работе описываются оскорбления, с которыми она столкнулась по дороге, и запасное сари, которое она взяла, чтобы переодеться в школе. В записях более поздних школ она указана как директриса. В 1897 году она умерла от чумы, ухаживая за больными.'
    story_prose:
      opening:
        - 'Пуна, 1848 год. Савитрибай Пхуле и Джьотирао Пхуле открывают школу для девочек. В рассказах Савитрибай есть сари, которое она носила в своей сумке, чтобы переодеться, когда пришла в школу.'
        - 'Исторически она подвергалась насилию по дороге преподавать, и некоторые семьи выступали против отправки девочек в школу. В этой ветке кто-то может пройтись с ней по улице и посидеть с семьей, чтобы услышать, почему девочку позвали домой.'
        - 'Для этой поездки нужен кто-то, кто сможет устойчиво держаться на этой улице, и кто-то, кто знает, как преподавать и как разговаривать с семьей. Когда собирается толпа, кто-то должен ее успокоить.'
      points:
        p1: 'Кто-то выходит на улицу. {staff} следит за дверными проемами и идет с Савитрибаем к Бхиде Вада, где они толкают дверь. Первая девочка уже кладет доску на стол. Окно светлеет, внизу все еще видны влажные следы от протирки.'
        p2: '{staff} сидит с семьей девочки, выслушивает их и показывает строчку, которую она написала в классе. Позже девушка возвращает свою доску на старое место. Ее рука движется медленно, но первая линия доходит до самого края.'
        p3: '{staff} стоит в углу и разговаривает с людьми, преграждающими путь, ждет, пока бросание прекратится, и проходит вместе с ней мимо. В школе Савитрибай ставит сумку на парту. Запасное сари по-прежнему сложено внутрь, его угол по-прежнему заправлен.'
      outcomes:
        all: 'Занятия продолжались с вернувшейся девочкой в числе учениц. Савитрибай открыла сумку для своих учебных материалов. Внизу ткань все еще лежала аккуратно сложенной.'
        p3: 'С того дня запасное сари оставалось на дне сумки. Когда она вошла в комнату, у нее была свободна рука, чтобы открыть окно.'
        p2: 'Девочка вернулась в класс, и на ее доске появилась еще одна строчка. Когда урок закончился, она положила доску на прежнее место.'
        p1: 'В то утро урок продолжился. Дверь была открыта, и первые пластинки прислонились к ножке стола.'
      none: 'В комнате не хватило одной доски, но мел лежал на столе. Шаги послышались из-за угла и вскоре затихли.'
      not_admitted: '{staff} не нашел места в школе. Половина двери скрывала стол, и виден был только угол грифельной доски.'
      desync: 'Дорога в школу оборвалась на углу. Когда {staff} был отозван, табличка под окном все еще была пустой.'
      excerpts:
        p3: 'В школе Савитрибай ставит сумку на парту. Запасное сари по-прежнему сложено внутрь, его угол по-прежнему заправлен.'
        p2: 'Позже девушка возвращает свою доску на старое место. Ее рука движется медленно, но первая линия доходит до самого края.'
        p1: 'Первая девочка уже кладет доску на стол. Окно светлеет, внизу все еще видны влажные следы от протирки.'
    relic: 'Грифельная доска'
    relic_desc: 'Небольшая доска с первым рядом букв, написанных мелом.'
    points:
      p1: 'В самое тяжелое утро первого месяца держите ее дорогу в Бхиде Вада свободной, чтобы начались дневные уроки.'
      p2: 'Верните девочку, которую семья позвала ее домой, чтобы она снова села за доску.'
      p3: 'Остановите на дороге людей, которые бросают в нее вещи, чтобы ей больше не требовалось запасное сари в сумке.'
    points_fail:
      p1: 'В тот день она не дошла до школы, и дверь в Бхиде Вада осталась закрытой.'
      p2: 'В этом филиале на сланцах в Бхиде Вада было на одну девушку меньше.'
      p3: 'Она по-прежнему носила с собой в сумке запасное сари каждый день, как и раньше.'
    shift:
      p1:
        was: 'С января 1848 года в школе для девочек в Бхиде Вада продолжались занятия, и Савитрибай каждый день ходила туда преподавать.'
      p2:
        was: 'В 1848 году многие семьи в Пуне были против того, чтобы девочки ходили в школу.'
        now: 'Девушка вернулась к урокам.'
      p3:
        was: 'С 1848 года ее забрасывали камнями и навозом по дороге в школу, и она несла с собой запасное сари, чтобы переодеться по прибытии.'
        now: 'С одного весеннего утра никто на дороге больше ничего в нее не швырял, а запасное сари так и осталось сложенным в сумке.'
    vignettes:
      slate: '{staff} поворачивает планшет боком, чтобы к нему могли дотянуться сразу две девушки. Когда их зовут домой, каждый оставляет след, на который может указать другой.'
      road: '{staff} идет на полшага позади по дороге в Будвар Пет и держит сумку сбоку от дверных проемов. В то утро на улице никто ничего не сказал.'
      chalk: '{staff} ломает последнюю палочку мела пополам, чтобы одна была для доски, а другая для грифельных досок, и записывает то, что нужно с рынка.'
  hargrave_stanwell_park:
    name: 'Четвёртый воздушный змей'
    place: 'Стэнвелл Парк, Австралия'
    figure: 'Лоуренс Харгрейв'
    story: 'Лоуренс Харгрейв начал свои эксперименты с коробчатыми воздушными змеями в 1893 году. 12 ноября 1894 года на пляже в Стэнвелл-парке четыре связанных коробчатых воздушных змея подняли его с песка примерно на 16 футов в воздух. На фотографии, хранящейся в Государственной библиотеке Нового Южного Уэльса, изображены Харгрейв, Джеймс Суэйн и оборудование для судебного разбирательства. Он умер в Сиднее 6 июля 1915 года.'
    story_prose:
      opening:
        - 'Стэнвелл-Парк, ноябрь 1894 года. Лоуренс Харгрейв уже больше года пробует коробчатые воздушные змеи. 12-го четверо лежат на пляже, готовые к вылету на одной линии.'
        - 'В истории четыре воздушных змея подняли его почти на шестнадцать футов. Большинство моделей, которые он позже отправил в Мюнхен, были уничтожены во время войны. В этой ветке у помощников на пляже есть метки для рамок и место для разложения рисунка.'
        - 'Для этого путешествия нужен кто-то, кто умеет читать ветер и удерживать длинную веревку, а также кто-то, кто может проверить размеры и нарисовать, как сочетаются четыре кадра.'
      points:
        p1: 'Порыв ветра отбрасывает внешний змей в сторону. {staff} наблюдает за линией и движется вместе с помощниками, пока воздушные змеи снова не натянутся, а затем помогает удержать веревку, когда сиденье опускается. Ноги касаются песка и оставляют два отпечатка близко друг к другу. Люди на пляже держатся до тех пор, пока первый воздушный змей не опустится ниже.'
        p2: '{staff} сверяет размеры и метки с кадрами и делает копию, чтобы сохранить ее локально, показывая, как все четыре сделаны и соединены. Ветер переворачивает рисунки до последнего листа. Харгрейв прокладывает через него кусок шнура, чтобы закрепить угол за узел.'
      outcomes:
        all: 'Высота вошла в рекорд, а комплект рисунков остался в Австралии. Спустя годы кто-то открыл стопку и все еще мог проследить линию между четырьмя воздушными змеями.'
        p2: 'Спустя годы у Стэнвелла Парка все еще была копия, с которой он мог ознакомиться. На последнем листе все еще было видно, где была привязана веревка.'
        p1: 'Высота вошла в рекорд. Рядом с записью на фотографии все еще были изображены четыре воздушных змея, выстроенных в ряд на пляже.'
      none: 'Ветер продолжал дуть с моря. Одна петля за другой отрывалась от катушки на дюнах.'
      not_admitted: '{staff} не нашел места среди помощников на пляже. Кто-то вдалеке натянул веревку, но его голос не донесся до дюн.'
      desync: 'Сиденье опустилось, и веревка провисла. Когда {staff} был отозван, бирка все еще стучала по раме.'
      excerpts:
        p2: 'Ветер переворачивает рисунки до последнего листа. Харгрейв прокладывает через него кусок шнура, чтобы закрепить угол за узел.'
        p1: 'Ноги касаются песка и оставляют два отпечатка близко друг к другу. Люди на пляже держатся до тех пор, пока первый воздушный змей не опустится ниже.'
    relic: 'Запасная бирка для коробчатого змея'
    relic_desc: 'Запасная этикетка для каркаса коробчатого воздушного змея.'
    points:
      p1: '12 ноября держите веревку воздушных змеев устойчиво при порывах ветра, чтобы он безопасно поднимался и опускался на песок.'
      p2: 'Помогите ему закончить полные чертежи четырех воздушных змеев, их размеров и способа изготовления, а один экземпляр оставьте в Австралии.'
    points_fail:
      p1: 'Порыв ветра оттащил веревку воздушных змеев в сторону, и сиденье ударилось о песок, а в этой ветке не было подъема на 16 футов.'
      p2: 'Как гласит история, четыре воздушных змея остались только в его собственных руках, и в этой отрасли не было второго рекорда в Стэнвелл-парке.'
    shift:
      p1:
        was: '12 ноября 1894 года на пляже в Стэнвелл-парке четыре коробчатых воздушных змея в поезде подняли Харгрейва с песка почти на 16 футов.'
      p2:
        was: 'В 1894 году изготовление четырех воздушных змеев было в руках одного Харгрейва; В конце жизни он отправил свои модели в Мюнхен, и большинство из них были уничтожены во время Второй мировой войны.'
        now: 'Набор чертежей четырех воздушных змеев остался в Стэнвелл-парке и не отправился в Мюнхен вместе с другими моделями.'
        who: 'hargrave_stanwell_park'
        bio: 'Размеры и чертежи четырех коробчатых воздушных змеев Харгрейва 1894 года остались в копии в Стэнвелл-парке. Большинство его моделей позже были уничтожены во время Второй мировой войны, но о том, как были изготовлены эти четыре, до сих пор можно прочитать в Австралии.'
    vignettes:
      four: '{staff} еще раз пересчитывает воздушные змеи, разложенные на песке, после подъема и записывает все четыре на странице, заключая их в скобки, чтобы следующий читатель знал, что они летали вместе.'
      tag: '{staff} следует по мокрому песку обратно, находит оторванную от рамы бирку и снова завязывает ее новым узлом.'
      lift: '{staff} стоит с помощниками на дюне, пока проверяет ветер с помощью одного воздушного змея и учится, в какую сторону бежать с леской.'
  sun_yat_sen_guangzhou:
    name: 'От статуи к новому университету'
    place: 'Гуанчжоу'
    figure: 'Сунь Ятсен'
    story: 'У статуи Сунь Ятсена в университете, который носит его имя, вы переноситесь в Гуанчжоу 4 февраля 1924 года. В этот день он поручает объединить три школы в Национальный университет Гуандуна и доверяет подготовку Цзоу Лу. В те же месяцы Сунь по воскресеньям читает лекции в зале Высшей педагогической школы. Записи переходят из рук в руки, пока из них не складывается книга. Занятия начинаются 19 сентября, а 11 ноября проходит церемония основания с девизом, который он написал. Сунь Ятсен умирает в Пекине 12 марта 1925 года. В 1926 году университет получает его имя.'
    relic: 'Статуя Сунь Ятсена'
    relic_desc: 'Статуя в кампусе Университета Сунь Ятсена открывает путь в Гуанчжоу 1924 года. Её нельзя продать как антиквариат.'
    points:
      p1: 'Наметьте, где вывесить объявления о приёме за городской чертой, и передайте маршрут посыльным канцелярии'
      p2: 'Воспользуйтесь рекомендацией, посетите три школы и к первому заседанию сведите их просьбы на одном листе'
      p3: 'Сравните намеченные участки и передайте схему до выбора Шипая'
      p4: 'Сверьте три списка выпускников и подготовьте единый реестр к церемонии 21 июня'
      p5: 'Присоединитесь к бригаде в Шипае и обозначьте границу нового кампуса межевыми кольями'
    points_fail:
      p1: 'В этой ветви объявление висит только в городе, а студенты за его пределами узнают о нем после начала регистрации.'
      p2: 'Первое подготовительное собрание проводится в соответствии с записью, и каждая школа по-прежнему говорит только о своих проблемах, без списка, объединяющего их.'
      p3: 'Шипай выбран записанным, а листа со срисованными участками в офисе нет.'
      p4: 'Выпускной 21 июня состоится, как и было записано. Офису приходится работать по трем отдельным спискам.'
      p5: 'Земля в Шипае размечена только на бумаге, как записано, и на ней не стоит ни одного столба.'
    shift:
      p1:
        was: '9 июня 1924 г.: Национальный университет Гуандуна просит провинциальные управления образования набрать студентов, и 10 июня открывается регистрация на подготовительный экзамен, запланировано 520 мест.'
        now: 'В этой ветви также вывешивается объявление о наборе на перекрестках за городом и на набережных.'
      p2:
        was: '3 марта 1924 г.: проводится первое подготовительное собрание, и первым на его повестке дня стоит выпуск учащихся трех школ.'
        now: 'В этой ветви на столе собрания лежит список бед всех трех школ.'
      p3:
        was: '1924 год: школы разбросаны по нескольким местам, и ими трудно управлять. Сунь Ятсен велит Цзоу Лу выбрать новый кампус в Шипае, и в этом году размечается земля.'
        now: 'В этой ветви к бумагам о выборе места приложена схема участков, включая Шипай.'
      p4:
        was: '21 июня 1924 г.: Цзоу Лу занимает пост президента Национального университета Гуандуна, и в тот же день проводится церемония выпуска всех трех школ.'
        now: 'В этой ветви в офисе имеется единый проверенный список на церемонию.'
      p5:
        was: '1924: Сунь Ятсен предлагает Цзоу Лу выбрать Шипай для нового кампуса, но строительство начинается только в 1933 году, а первые колледжи въезжают осенью 1934 года. Сунь умирает 12 марта 1925 года и никогда его не видит.'
        now: 'В этой ветви, прежде чем он покинет Гуанчжоу в ноябре, границы территории Шипай уже стоят, столб за столбом.'
        who: 'sun_yat_sen_guangzhou'
        bio: 'В этой ветви границу нового кампуса в Шипае обозначили до отъезда Сунь Ятсена из Гуанчжоу.'
    shift_all: 'После каждого поручения в канцелярии оставалось то, чем можно было воспользоваться. Пять поручений перекликаются с девизом, который Сунь Ятсен позже написал для университета: учиться широко, спрашивать внимательно, размышлять осмотрительно, различать ясно и применять усердно.'
    vignettes:
      slips: 'Вымышленный служащий собирается переписать страницу, на которой две строки закрыты приклеенной запиской. Вы спрашиваете, кто написал записку и кто написал страницу. Он сперва переписывает страницу, оставляя записку на месте.'
      back_row: 'Вымышленному студенту не досталось места, и он то и дело встаёт, чтобы увидеть происходящее. Вы подвигаетесь на скамье. Он молча дослушивает лекцию и кивает вам, когда зал пустеет.'
      hundred: 'На последних страницах блокнота вы отмечаете дни чертами по пять. Когда набирается сотня, вымышленный служащий спрашивает, что вы считаете. Вы отвечаете: дни.'
