        p2: 'В ночь на 17 июля Риман так сильно кашляет, что не может сесть, а маленькая дочь хозяина стоит в дверях с лампой, боясь войти. {staff}, знающий медицину, открывает принесенную с собой наноаптечку, использует ее, как сказано в инструкции, и остается у кровати, время от времени прикладывая руку ко лбу. К рассвету он засыпает, его дыхание немного удлинилось. Через три дня, утром, он один выходит к смоковнице и некоторое время сидит на стуле. Он наклоняется, чтобы поднять упавший инжир за ногу, и кладет его рядом с бумагами.'
