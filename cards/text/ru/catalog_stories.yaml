        now: '{staff} получает письменное предложение на тех же условиях, что и его коллеги. Бозе читает его и принимает первый чек, выписанный на этих условиях.'
        who: 'bose_calcutta'
        bio: 'Бозе получил равные условия на первом году обучения в Президентском колледже.'
  li_qingzhao_hangzhou:
    name: 'Оставить сундук у соседей'
    place: 'Куайцзи'
    figure: 'Ли Цинчжао'
    story: 'Ли Цинчжао писала, что ее книги и картины уже неоднократно терпели убытки, когда она поселилась в Куайцзи. Она описала там кражу и возвращение восемнадцати свитков.'
    story_prose:
      opening:
        - 'К тому времени, как Ли Цинчжао поселилась в Куайцзи, она уже несколько раз теряла книги и картины. Написав послесловие к «Записям о металле и камне», она все же смогла объяснить многое из того, что пропало на этой части пути.'
        - 'Исторически сложилось так, что кража в Куайджи стоила ей большей части коллекции. Она нашла восемнадцать свитков. В этой ветке сундуки все еще находятся в комнате. Одна стоит достаточно близко к кровати, чтобы можно было дотянуться до нее, не вставая.'
        - 'Кто-то, кто знает, как ухаживать за книгами и картинами, может помочь. Если соседи колеблются, нужно терпение, чтобы договориться о том, куда пойдет сундук и в какую дверь ей следует постучать, когда она захочет его вернуть.'
      points:
        p1: 'Ли Цинчжао открывает сундук у кровати, достает два свитка и возвращает один. {staff} просит соседа посмотреть на сундук и его замок, а затем предлагает каждому поставить отметку на одном и том же счете. Прежде чем они это сделают, Ли просовывает короткую кисть в щель под крышкой. Сосед берет тяжесть снизу; она берет другой конец, и вместе они переступают порог.'
      outcomes:
        all: 'Когда она возвращает сундук, она сначала ищет кисть. Он все еще стоит под крышкой. На углу бумаги она пробует нанести штрих. Чернила растекаются медленнее, чем она помнит.'
        p1: 'Когда она возвращает сундук, она сначала ищет кисть. Он все еще стоит под крышкой. На углу бумаги она пробует нанести штрих. Чернила растекаются медленнее, чем она помнит.'
      none: 'После кражи она выкладывает свитки, которые ей удалось вернуть. Когда она заканчивает считать, ее руки останавливаются на голой части стола.'
      not_admitted: '{staff} никогда не встречался с Ли Цинчжао. Из-за двери доносится звук закрывающегося сундука.'
      excerpts:
        p1: 'Прежде чем они это сделают, Ли просовывает короткую кисть в щель под крышкой. Сосед берет тяжесть снизу; она берет другой конец, и вместе они переступают порог.'
    relic: 'Опись содержимого сундука'
    relic_desc: 'Вымышленная опись содержимого единственного сундука, который она решила оставить в другом месте.'
    points:
      p1: 'Перед кражей поручите доверенному соседу взять на себя ответственность за один сундук, который выберет Ли Цинчжао.'
    points_fail:
      p1: 'Сотрудник не нашел никого, кто мог бы взять на себя ответственность за сундук.'
    shift:
      p1:
        was: 'Около 1131 года: Ли Цинчжао вспомнила о краже в ее квартире в Куайцзи. Впоследствии она нашла восемнадцать свитков.'
        now: '{staff} организует хранение одного сундука по своему выбору в другом доме. Ли Цинчжао позже забирает его с нетронутым содержимым.'
        who: 'li_qingzhao_hangzhou'
        bio: 'Ли Цинчжао нашла сундук с книгами и фотографиями, который она оставила на попечении соседки.'
  ibn_al_nafis_cairo:
    name: 'Один том в руках другого читателя'
    place: 'Каир'
    figure: 'Ибн ан-Нафис'
    story: 'В конце жизни Ибн ан-Нафис оставил свою библиотеку в больнице. Его проектируемая медицинская энциклопедия осталась незавершенной, а уцелевшие части разбросаны. В этой ветке второй читатель предлагает взять на себя ответственность за один из законченных томов.'
    story_prose:
      opening:
        - 'Каир, 1288 год. В конце жизни Ибн ан-Нафис оставил свою библиотеку в больнице. Его большая запланированная медицинская энциклопедия осталась незавершенной, и сегодня можно прочитать лишь ее части.'
        - 'В истории биографии фиксируют, где он оставил свою библиотеку, не отслеживая впоследствии каждый том. В этой ветке часто заходящий читатель хочет закончить прочитанный том.'
        - 'Кто-то, кто понимает, как книга одалживается и возвращается, может помочь. Соглашение должно дать последующим читателям адрес, который они действительно смогут найти.'
      points:
        p1: 'Изначально читатель хотел получить кредит только до конца месяца. {staff} просит двоих сначала договориться, где будет храниться том и кто откроет дверь для другого читателя. Ибн ан-Нафис переворачивает обложку и указывает на то, что ему еще предстоит проверить. Читатель кладет листок на книгу, наполовину прикрывая большим пальцем имя, которое он только что подписал. Он перемещает его только тогда, когда чернила высохли.'
      outcomes:
        all: 'Позже кто-то приходит в поисках тома по адресу, указанному на бланке. Человек у двери снимает книгу и вместе с ней передает бумагу на первом листе.'
        p1: 'Позже кто-то приходит в поисках тома по адресу, указанному на бланке. Человек у двери снимает книгу и вместе с ней передает бумагу на первом листе.'
      none: 'Никто не оставляет адреса, по которому том может оставаться доступным. Квитанция лежит пустая. Книга все еще лежит в той же стопке.'
      not_admitted: '{staff} никогда не попадает внутрь. Человек у окна переворачивает страницу, не слыша шагов снаружи.'
      excerpts:
        p1: 'Читатель кладет листок на книгу, наполовину прикрывая большим пальцем имя, которое он только что подписал. Он перемещает его только тогда, когда чернила высохли.'
    relic: 'Именная расписка о выдаче'
    relic_desc: 'Вымышленная расписка с именем читателя, взявшего книгу под свою ответственность.'
    points:
      p1: 'Попросите Ибн ан-Нафиса доверить один завершенный том второму читателю, который согласится сохранить его доступным.'
    points_fail:
      p1: 'Сотрудник не нашел второго читателя, готового взять на себя ответственность за этот том.'
    shift:
      p1:
        was: '1288: Ибн ан-Нафис умер и оставил свою библиотеку в больнице. Сегодня сохранились лишь части его большой медицинской энциклопедии.'
        now: '{staff} назначает хранителя для одного завершенного тома и имеет запись получателя, по которой с ним можно ознакомиться. Остальная часть библиотеки следует его первоначальным планам.'
        who: 'ibn_al_nafis_cairo'
        bio: 'Один том его незаконченной энциклопедии оставался доступным в филиале через второго хранителя.'
  sappho_lesbos:
    name: 'Прежде чем отплывёт корабль'
    place: 'Митилена, Лесбос'
    figure: 'Сапфо'
    story: 'В «Паросском мраморе» записано, что Сапфо покинула Митилини и отправилась на Сицилию в изгнание. Дата повреждения оставляет неясным точный год. В этой ветке один человек, которого она надеялась увидеть, не услышал, когда корабль уходит.'
    story_prose:
      opening:
        - 'Берег в Митилини. Спустя столетия после того, как Сапфо отплыла на Сицилию, камень на Паросе зафиксировал это путешествие. Год на этом камне теперь поврежден.'
        - 'Исторически Сапфо покинула Митилини в изгнании на Сицилии. Причина неизвестна. В этом отделении есть кое-кто, с кем она хочет встретиться перед отъездом, а лодочники уже передают багаж на борт.'
        - 'Кто-то, кто знает лестничную площадку и соседние улицы, может помочь. Найти кого-то, кто еще не услышал, когда отплывает лодка, значит больше, чем просто убедить лодочника поторопиться.'
      points:
        p1: '{staff} спрашивает, куда идет багаж, оставляет узел Сапфо на попечение лодочника и ищет дверь, которую она описала. К тому времени, как они вернулись, люди, загружающие лодку, уже очистили участок берега. Посетитель завязывает развязавшийся узел на запястье Сапфо. Сапфо оставляет руку на месте, пока ее не зовет лодочник.'
      outcomes:
        all: 'Когда лодка отплывает, Сапфо поднимает руку со шнуром. Посетитель остается на камне, на который наступают пассажиры, когда они выходят на берег.'
        p1: 'Когда лодка отплывает, Сапфо поднимает руку со шнуром. Посетитель остается на камне, на который наступают пассажиры, когда они выходят на берег.'
      none: 'Лодка уходит первой. К тому времени, как посетитель находит площадку, на камне остается только кусок мокрой веревки.'
      not_admitted: '{staff} достигает берега, но не находит никого, кто знает Сапфо. Кто-то приседает на последней ступеньке, выпрямляя веревку.'
      excerpts:
        p1: 'Посетитель завязывает развязавшийся узел на запястье Сапфо. Сапфо оставляет руку на месте, пока ее не зовет лодочник.'
    relic: 'Завязанный шнур'
    relic_desc: 'Воображаемый шнур, который носил кто-то, ожидавший ее на пристани.'
    points:
      p1: 'Приведите на пристань одного человека, которого хочет видеть Сапфо, прежде чем ей придется отправиться на Сицилию.'
    points_fail:
      p1: 'Корабль ушел прежде, чем служащий смог привести человека, которого просила видеть Сапфо.'
    shift:
      p1:
        was: 'Примерно на рубеже седьмого и шестого веков до нашей эры: в Паросском мраморе записано, как Сапфо плыла из Митилини на Сицилию в изгнании.'
        now: '{staff} приводит на лестничную площадку человека, которого просила Сапфо. Они проводят время вместе перед тем, как Сапфо сядет на борт.'
        who: 'sappho_lesbos'
        bio: 'Сапфо успела попрощаться лично перед отъездом из Митилини на Сицилию.'
  hipparchus_rhodes:
    name: 'Одна ночь, чтобы сверить стихотворение'
    place: 'Родос'
    figure: 'Гиппарх'
    story: 'Сохранившийся комментарий Гиппарха указывает на ошибки в широко читаемом стихотворении о небе. В этой ветке читатель собирается использовать стихотворение, чтобы рассказать другим, какие звезды восходят вместе.'
    story_prose:
      opening:
        - 'Родос, конец второго века до нашей эры. Люди используют стихотворение, чтобы вспомнить, какие звезды восходят вместе. В сохранившемся комментарии Гиппарх проверяет подобные утверждения одно за другим.'
        - 'В истории комментарии показывают, где знакомые строки не совпадают с тем, что можно было увидеть. В этой ветке читатель уже преподавал одну из этих строк и намерен преподавать ее снова таким же образом.'
        - 'Полезен тот, кто может следовать утверждениям книги. Также понадобится кто-то, кто сможет убедить читателя, который уже преподал урок, подождать еще немного снаружи.'
      points:
        p1: '{staff} просит читателя произнести строку, которую он хочет преподать, а затем идет с ним и Гиппархом туда, где они могут видеть низко на горизонте. Когда появляется первая звезда, читатель начинает говорить, что они оба здесь. Он останавливается на полпути. В другом месте все еще темно. Он продолжает указывать на нее пальцем и опускает руку только тогда, когда взойдет вторая звезда.'
      outcomes:
        all: 'В следующий раз, когда он будет преподавать, он сначала закроет книгу и попросит учеников дождаться первого подъема. Он покидает вторую половину знакомой линии до тех пор, пока не появится другой свет.'
        p1: 'В следующий раз, когда он будет преподавать, он сначала закроет книгу и попросит учеников дождаться первого подъема. Он покидает вторую половину знакомой линии до тех пор, пока не появится другой свет.'
      none: 'Читатель, как и раньше, повторяет старую строчку. Дверь уже закрылась, когда низко снаружи появилась вторая звезда.'
      not_admitted: '{staff} никогда не видит читалку. Через закрытую дверь кто-то дважды произносит строчку.'
      excerpts:
        p1: 'В другом месте все еще темно. Он продолжает указывать на нее пальцем и опускает руку только тогда, когда взойдет вторая звезда.'
    relic: 'Две отметки на горизонте'
    relic_desc: 'Воображаемая наблюдательная полоса с местами для двух отдельных восходов.'
    points:
      p1: 'Убедите читателя понаблюдать одну ночь за Гиппархом, прежде чем рассказывать о спорном восстании.'
    points_fail:
      p1: 'Сотрудник в ту ночь не уговорил читателя сверить стихотворение на фоне неба.'
    shift:
      p1:
        was: 'Конец второго века до нашей эры: в комментарии Гиппарха указывалось, что некоторые звезды, описанные вместе в знакомой поэме, не восходили вместе.'
        now: '{staff} возвращает читателя на ночь наблюдений. Читатель наблюдает за двумя восстаниями по отдельности и меняет наставления, которые они дают своим ученикам.'
        who: 'hipparchus_rhodes'
        bio: 'Читатель, использующий старое стихотворение, проверил одно спорное восстание и представил исправленную версию.'
  eratosthenes_alexandria:
    name: 'Книга, в которой измерили Землю'
    place: 'Александрия'
    figure: 'Эратосфен'
    story: 'Эратосфен Киренский стал библиотекарем в Александрии в третьем веке до нашей эры. Его собственная книга по измерению Земли утеряна. В более позднем рассказе Клеомеда солнце в середине лета находится над Сиеной, но оставляет тень в Александрии. Разница составляет одну пятидесятую круга; с учетом 5000 стадий между двумя местами это составляет 250 000 стадий для всей Земли.'
    story_prose:
      opening:
        - 'Александрия, третий век до нашей эры. Эратосфен Киренский стал главой Александрийской библиотеки. У него есть прозвище Бета, что означает, что в любой области знаний он едва ли не дотягивает до первого места.'
        - 'В истории, согласно более позднему сообщению Клеомеда, в полдень дня середины лета гномон в Сиене не отбрасывал тени, тогда как в Александрии солнце стояло на одной пятидесятой полного круга от зенита; два города находились на расстоянии пяти тысяч стадий друг от друга, так что весь круг составил двести пятьдесят тысяч. Книга «Об измерении Земли», в которой Эратосфен изложил свой собственный метод, была утеряна, а сам Клеомед говорит, что первоначальный метод был более сложным, чем его описание. В этом филиале не умеющий читать носильщик в библиотеке знает каждую бирку, а переписчик быстро находит кличку.'
        - 'В этой поездке могут помочь два типа людей: кто-то, кто умеет копировать, проверять и хранить книги, или кто-то любопытный и прилежный, кто может проработать страницу с цифрами.'
      outcomes:
        all: 'Позже читатели последовали шагам, которые он написал своей рукой, и снова установили гномона в полдень летнего дня. Рядом лежал раскрытый рулон, края которого были прижаты камешками.'
        p1: 'Позже читатели последовали шагам, которые он написал своей рукой, и снова установили гномона в полдень летнего дня. Рядом лежал раскрытый рулон, края которого были прижаты камешками.'
      none: 'У книги все еще оставалось лишь несколько старых экземпляров, и они старели один за другим. В полдень летнего дня гномон в Александрии все еще отбрасывал свою короткую тень.'
      not_admitted: '{staff} так и не смог пройти через дверь Библиотеки. В полдень летнего дня городские гномоны все еще отбрасывали свои короткие тени.'
      points:
        p1:
          class_lettered: '{staff} следовал правилам хранителя книг и сделал несколько копий «Об измерении Земли», после каждой из которых сверял длины теней, углы и расстояния построчно с оригиналом, не сбиваясь ни на одну цифру. Один экземпляр попал на полку библиотеки, привязанный небольшой деревянной биркой, которую мог бы знать носильщик; другого завернули в клеенку и оставили на корабле, отправляющемся в другой город. Эратосфен встал перед полкой и одним пальцем поправил бирку.'
          else: '{staff} сначала проработал описанный в книге метод с самого начала, пока не стал ясен каждый шаг, затем сделал несколько копий «Об измерении Земли» и сверил цифры построчно с оригиналом. Один экземпляр попал на полку библиотеки, привязанный небольшой деревянной биркой, которую мог бы знать носильщик; другого завернули в клеенку и оставили на корабле, отправляющемся в другой город. Эратосфен встал перед полкой и одним пальцем поправил бирку.'
      excerpts:
