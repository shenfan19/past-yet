        p3: 'Несколько дней спустя он просыпается на больничной койке и тянется за бумагой. Медсестра дает ему половину листа, он переворачивает его и начинает писать на обороте суммы.'
        p2: 'Напечатанный номер лежит на подоконнике магазина, страница указателя после буквы, номер страницы через строку. Шевалье берет копию и проводит пальцем по столбцу цифр.'
        p1: 'На рассвете Галуа торопливо добавляет линию на полях страницы и откладывает перо. Два свертка лежат рядом на столе, а на верхнем написано имя Шевалье.'
    relic: 'Поспешное письмо'
    relic_desc: 'Страницы перечеркнуты цифрами и словами, на которые ему некогда.'
    points:
      p1: 'Ночью 29 мая, пока Галуа еще может проверить страницы, заверните свое письмо Шевалье отдельно от упомянутых в нем бумаг и увидите, как они доставлены.'
      p2: 'Когда письмо будет напечатано в сентябре, попросите редактора напечатать рядом с ним указатель рукописи и найдите математика, готового прочитать сохранившиеся страницы по порядку.'
      p3: 'После дуэли утром 30 мая немедленно доставьте Галуа к врачу и спасите его от раны в животе.'
    points_fail:
      p1: 'Передача неоднократно откладывается, и письмо отделяется от бумаг. Шевалье так и не получил письмо от 29 мая, и офис отозвал сотрудника.'
      p2: 'Только письмо появляется в сентябре. Читателям, желающим пойти дальше, еще предстоит найти друга, держащего рукописи.'
      p3: 'Он лежит раненый и одинокий, пока его не находит прохожий, и он умирает в больнице Кочина 31 мая в возрасте двадцати лет. В этой ветке Галуа после этого нет.'
    shift:
      p1:
        was: '29 мая 1832 года Галуа написал Огюсту Шевалье, чтобы изложить свое исследование и попросить его разобраться с бумагами и опубликовать письмо.'
      p2:
        was: 'Письмо появилось в сентябре 1832 года. Шевалье передал рукописи Лиувиллю в 1843 году, а Лиувилль опубликовал их в 1846 году.'
        now: 'Любой, кто прочитает письмо в сентябре, может воспользоваться указателем и попросить копию. Вопросы возвращаются к Шевалье с номерами страниц, оставляя запись для следующего читателя.'
      p3:
        was: '30 мая 1832 года Галуа был ранен в живот на дуэли и оставлен лежать там, где упал. Он умер в больнице Кочина 31 мая в возрасте двадцати лет.'
        now: '{staff} достигает его за считанные минуты, останавливает кровотечение и не дает ране заразиться. Галуа выздоравливает, возвращается к математике и сам объясняет свою теорию математикам, которые ее не поняли.'
        who: 'galois_paris'
        bio: 'Галуа пережил дуэль в мае 1832 года. Он продолжал заниматься математикой в Париже и видел, как его теорию уравнений читали и обсуждали при его жизни.'
    vignettes:
      candle: 'Ночью 29 мая {staff} несет вторую свечу вверх по лестнице для консьержа. Она ворчит, что лампа у молодого господина горит с темноты, а чернила тоже ее, одолженные, и она собирается поставить их на счет.'
      cart: '31 мая {staff} помогает возчику разгружать дрова у ворот больницы Кочина. Вчера принесли молодого человека, говорит возчик, а сегодня утром его накрыли простыней; десять лет он привозил сюда дрова, а погожие утра он терпеть не может.'
      type: 'В конце лета {staff} собирает рассыпанный шрифт с пола небольшой типографии. Наборщик жалуется, что в этом числе есть буквы, полные сумм, и ему пришлось позаимствовать все знаки равенства из соседнего футляра.'
  abel_froland:
    name: 'Пример и утверждение'
    place: 'Фроланд'
    figure: 'Нильс Хенрик Абель'
    story: 'На Рождество 1828 года Нильс Хенрик Абель приехал на санях на металлургический завод во Фроланде, холодный и кашляющий, чтобы навестить свою невесту, и пролежал там больной двенадцать недель. 6 января 1829 года он написал свою последнюю статью, на двух или трех страницах повторяющую основной результат длинного мемуара, который он дал Парижской академии. Он умер от туберкулеза 6 апреля в возрасте двадцати шести лет. Через два дня, сам того не зная, Август Леопольд Крель написал из Берлина, что ему обеспечен пост.'
    story_prose:
      opening:
        - 'Металлургический завод Фроланд, южная Норвегия, январь 1829 года. Нильс Хенрик Абель лежит больной в доме, где его невеста работает гувернанткой, и сильно кашляет. Ему двадцать шесть. Несколько лет назад он доказал, что общее уравнение пятой степени не может быть решено радикалами, но о длинном мемуаре, который он дал Парижской академии в 1826 году, с тех пор ничего не было слышно.'
        - 'Исторически он уже был простужен и болен, когда приехал на санях на Рождество, и пролежал здесь в постели двенадцать недель. 6 января он написал свою последнюю статью объемом в две или три страницы. Он умер от туберкулеза 6 апреля. Через два дня Крелль написал из Берлина, что ему обеспечен пост. В этом филиале кухарка внизу всю ночь слушает кашель, а служащий металлургического завода каждый день, как обычно, сортирует почту.'
        - 'В этой поездке могут помочь три типа людей: кто-то, кто может проверить вывод и держать в порядке документы и записи о приеме, кто-то, кто знает уход за больными и может дежурить у постели больного, и кто-то, кто может перевезти друзей далеко и заставить их написать ответ.'
      outcomes:
        all: 'В апреле, когда было написано письмо из Берлина, подтверждающее эту должность, Абеля уже не было. Мартовский ответ лежал у него под подушкой, а печь в комнате еще не погасла.'
        p4: 'В апреле, когда Берлин написал письмо с подтверждением поста, Абеля уже не было. Мартовский ответ все еще лежал у него под подушкой.'
        p3: 'Печь в комнате во Фроланде горела до апреля.'
        p2: 'Много лет спустя кто-то поехал в Париж в поисках длинных мемуаров, нашел небольшую строчку в конце короткой газеты и начал с журнала приема за тот год.'
        p1: 'Прислали статью в две-три страницы. Адрес на конверте был написан его рукой.'
      none: 'Зима во Фроланде была долгой. Снег за окном так и не таял, а человек наверху кашлял ночь за ночью.'
      desync: '6 января выпуск коротких бумаг был остановлен до того, как его можно было проверить, и {staff} был отозван. Кашель наверху продолжался. Страницы лежали на покрывале, чернила еще не высохли.'
      not_admitted: '{staff} так и не смог пройти через дверь этого дома. Мужчина наверху все еще кашлял, а новости из Берлина все еще были в пути.'
      points:
        p1: '6 января Абель сидел, откинувшись на подушке, и писал короткую статью, две или три страницы были разложены на покрывале. {staff} следовал выводу построчно ручкой и отмечал каждое место, где обозначения не согласовывались от одного шага к другому, и исправлял их одно за другим. К вечеру бумага была полностью отпечатана, и на покрывале осталось несколько чернильных пятен. Он сложил три страницы в квадрат, сжал их ладонью и только потом протянул.'
        p2: 'Короткая газета все еще была под рукой. {staff} поставил его рядом с датой подачи парижских мемуаров, а внизу каждого экземпляра написал одну небольшую строчку: год, кому он был вручен и под каким названием. Чернила были слабыми, вдавились на поля и не высыхали до наступления сумерек. Из двух экземпляров один ушел вместе с короткой статьей, а другой остался в папке с рукописями.'
        p3: 'В самые холодные ночи конца января Авель слишком сильно кашлял, чтобы уснуть. {staff} следил за тем, чтобы печь топилась, согревал постель, поднимал подушки, вытирал пот и давал ему воды. Однажды ночью окно было залито морозными цветами, а печь в комнате так и не погасла. Ближе к рассвету, после приступа кашля, он снова заснул.'
        p4:
          class_lettered: '{staff} делал это так, как ведут переписку, перечисляя по одному людей в Берлине, работающих от его имени, и чем каждый из них занимался, и писал каждому по очереди, прося сообщить Фроланду о своих успехах, не дожидаясь, пока что-нибудь уладится. В марте пришел ответ. Авель приказал принести письмо к себе в постель и дважды прочитал его. В нем не говорилось, что вопрос решен, но говорилось лишь, что они все еще пытаются. Он сложил письмо и положил его под подушку.'
          else: '{staff} писал в Берлин письмо за письмом, сообщая, как он болен, и просил друзей, работающих на него, сообщать о своих успехах, не дожидаясь, пока что-нибудь уладится. В марте пришел ответ. Авель приказал принести письмо к себе в постель и дважды прочитал его. В нем не говорилось, что вопрос решен, но говорилось лишь, что они все еще пытаются. Он сложил письмо и положил его под подушку.'
      excerpts:
        p4: 'В нем не говорилось, что вопрос решен, но говорилось лишь, что они все еще пытаются. Он сложил письмо и положил его под подушку.'
        p3: 'Однажды ночью окно было залито морозными цветами, а печь в комнате так и не погасла. Ближе к рассвету, после приступа кашля, он снова заснул.'
        p2: 'Чернила были слабыми, вдавились на поля и не высыхали до наступления сумерек. Из двух экземпляров один ушел вместе с короткой статьей, а другой остался в папке с рукописями.'
        p1: 'К вечеру бумага была полностью отпечатана, и на покрывале осталось несколько чернильных пятен. Он сложил три страницы в квадрат, сжал их ладонью и только потом протянул.'
    relic: 'Запечатанное письмо'
    relic_desc: 'Нераспечатанное предложение, перевязанное ниткой.'
    points:
      p1: 'Помогите Авелю проверить его последнее краткое доказательство, пока он болен, чтобы можно было отправить статью.'
      p2: 'Пока короткая статья под рукой, привяжите ее к протоколу подачи заявок в Париже, чтобы у всех, кто ищет, была ссылка.'
      p3: 'Двенадцать недель Авель лежит в постели во Фроланде, не допускает холода в свою комнату и облегчает его кашель и боль.'
      p4: 'Попросите друзей, ищущих должность для Авеля, отправить временное письмо, чтобы он перед смертью знал, что они все еще пытаются.'
    points_fail:
      p1: 'Газета останавливается, прежде чем ее можно будет проверить, и главный результат парижских мемуаров теряет этот ранний публичный рекорд. Офис отзывает сотрудника после потери синхронизации.'
      p2: 'Людям, ищущим парижские мемуары, все еще приходится просматривать старые записи о приеме, у которых осталось лишь название.'
      p3: 'Никто не облегчает простуду и кашель, и в этом отделении его последние недели во Фроланде проходят так же тяжело, как и раньше.'
      p4: 'Ни одно слово не доходит до Фроланда вовремя. Официальное подтверждение приходит слишком поздно.'
    shift:
      p1:
        was: '6 января 1829 года во Фроланде Абель написал свою последнюю математическую статью, вновь изложив основной результат своих парижских мемуаров.'
      p2:
        was: 'Примерно в 1829 году Абель еще раз сформулировал главный результат парижских мемуаров; рукопись было трудно найти, и она не появлялась в печати до 1841 года.'
        now: '{staff} связывает новую статью с более ранней датой подачи и оставляет ссылку с каждой копией, что сужает последующий поиск.'
      p3:
        was: 'На Рождество 1828 года Авель поехал на санях во Фроланд, холодный, кашляющий, и начал кашлять кровью; он пролежал там двенадцать недель.'
        now: '{staff} поддерживает работу печи и теплую постель и проводит с ним самые худшие ночи. В последние недели Авель страдает немного меньше.'
      p4:
        was: 'Абель умер 6 апреля 1829 года. Письмо, подтверждающее должность в Берлине, было написано через два дня.'
        now: '{staff} просит контактное лицо сообщить об уже предпринимаемых усилиях. Абель читает, что его друзья все еще пытаются найти ему должность.'
        who: 'abel_froland'
        bio: 'Перед смертью Абель услышал, как его берлинские друзья пытались сохранить для него возможность продолжить свои исследования. Официальное подтверждение пришло и после его смерти.'
    vignettes:
      firewood: 'В самые холодные дни февраля {staff} помогает кухарке носить дрова наверх. Когда господин наверху кашляет всю ночь, говорит она, она лежит внизу и считает, а к утру уже теряет счет.'
      sledge: 'В январе {staff} помогает конюху прикрепить к саням новую рукоятку. На Рождество он привез из города джентльмена, по словам жениха, завернутого в три одеяла и всю дорогу кашлявшего; по прибытии мужчина не смог поднять свой сундук, и конюх поднял его и отказался от монеты.'
      post: 'В апреле {staff} помогает клерку металлургического завода сортировать мешок с почтой. Он достает письмо с клеймом Берлина, подносит его к окну и говорит, что это пришло не вовремя, потому что человека, которому оно адресовано, уже нет.'
  riemann_selasca:
    name: 'Последняя статья'
    place: 'Селаска'
    figure: 'Бернхард Риман'
    story: 'Бернхард Риман заболел в 1862 году и не раз ездил в Италию, страдая туберкулезом. В июне 1866 года он приехал в третий раз в Селаску на озере Маджоре. 19 июля, отдыхая под фиговым деревом, он все еще работал над своей последней работой, которую так и не закончил. Он умер там на следующий день в возрасте тридцати девяти лет. Десять лет спустя вышло его собрание сочинений, редактором которого был Рихард Дедекинд.'
    story_prose:
      opening:
        - 'Озеро Маджоре на севере Италии, июнь 1866 года. Тридцатидевятилетний математик Бернхард Риман в третий раз приехал на юг поправить здоровье и снял комнаты в Селаске на берегу. Его работы по геометрии искривленных пространств и распределению простых чисел открыли большие области, и к настоящему времени он болеет туберкулезом уже почти четыре года.'
        - 'Исторически 19 июля он отдыхал под фиговым деревом, все еще работая над своей последней работой, которую так и не закончил; на следующий день он умер там. Десять лет спустя вышло его собрание сочинений под редакцией Генриха Вебера и Рихарда Дедекинда. В этом филиале у его домовладельца есть маленькая дочь, которая каждый день убирает для него упавший инжир из-под дерева, а лодочнику на озере пришлось учить жену грести.'
        - 'В этом путешествии могут помочь несколько типов людей: тот, кто читал лекции в университете, строил модели или читал доказательства, или кто-то образованный и терпеливый, чтобы не отставать от формул, которые он диктует; тот, кто знает медицину и носит с собой наноаптечку, чтобы вылечить болезнь, которую век не смог.'
      outcomes:
        all: 'Той осенью Риман вернулся в Геттинген и снова преподавал. Среди бумаг, которые он взял домой, последняя была на несколько страниц длиннее и была продиктована под смоковницей.'
        p2: 'Той осенью Риман вернулся на север, в Геттинген. Утром, уходя, он посидел немного в кресле под фиговым деревом, затем сложил страницу с заметками и положил ее в карман пальто.'
        p1: 'Последняя статья, по его собственным словам, шла на несколько страниц дальше. Когда десять лет спустя собрание сочинений вышло, эти страницы были напечатаны вместе с ним.'
      none: '20 июля Риман умер в Селаске. Стул под смоковницей стоял пустой, две смоквы упали на сиденье, и никто их не подобрал.'
      not_admitted: '{staff} так и не проник в дом, а лишь помог разгрузить несколько лодок на пристани в Палланце. За водой, со стороны Селаски, стояло большое фиговое дерево, под которым стоял стул.'
      points:
        p1:
          class_learned: 'Днем 13 июля Риман сидит в кресле под фиговым деревом, разложив газету на коленях и останавливаясь после каждых нескольких строк, чтобы кашлять. {staff}, читавший лекции в университете, ставит рядом с собой табуретку и записывает каждое предложение по мере его произнесения, ни одного неправильного индекса в формулах, и держит готовые страницы в порядке под камнем. К вечеру поднимается ветер, и Риман вытаскивает верхнюю страницу и долго держит ее у глаз. Он кладет его обратно и снова кладет на него камень.'
          class_lettered: 'Днем 13 июля Риман сидит в кресле под фиговым деревом, разложив газету на коленях и останавливаясь после каждых нескольких строк, чтобы кашлять. {staff}, который читал корректуру, ставит рядом с собой табуретку и записывает каждое предложение по мере его произнесения, зачитывает ему каждую законченную страницу один раз и держит страницы в порядке под камнем. К вечеру поднимается ветер, и Риман вытаскивает верхнюю страницу и долго держит ее у глаз. Он кладет его обратно и снова кладет на него камень.'
