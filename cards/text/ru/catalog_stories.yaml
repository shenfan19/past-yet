  keats_rome:
    name: 'Комната у лестницы'
    place: 'Рим'
    figure: 'Джон Китс'
    story: 'В ноябре 1820 года Джон Китс, больной туберкулезом, приехал в Рим вместе с художником Джозефом Северном и снял комнату на площади Испании, 26, рядом с Испанской лестницей. Он умер там в ночь на 23 февраля 1821 года и был похоронен 26 февраля на кладбище у пирамиды Цестия. По его желанию на надгробии не указано его имя.'
    story_prose:
      opening:
        - 'Рим, середина ноября 1820 года. Двадцатипятилетний поэт Джон Китс, больной туберкулезом, снимает комнату с художником Джозефом Северном на втором этаже дома 26 по площади Испании, у подножия Испанской лестницы. За несколько коротких лет он написал свои главные стихи, в том числе и оды, и это его последняя зима.'
        - 'В истории врач Джеймс Кларк посадил его на голодную диету, по одному анчоусу и куску хлеба в день, и снова и снова пустил ему кровь; Северн присматривал за ним один, деньги скоро кончились, и ночи прошли без сна; до конца он считал, что ничего после себя не оставил, и по его желанию на его надгробии нет имени. В этом филиале продавец цветов продает фиалки у подножия лестницы, а сосед по лестнице часто спрашивает о больном жильце.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает медицину и может остановить кровотечение, или кто-то, у кого есть современное руководство по уходу; кто-то, кто может дежурить долгие ночи и продержаться, или кто-то с регулятором сна; кто-то начитанный, знающий поэзию и способный сказать ему, что станет с его стихами.'
      outcomes:
        all: 'Поздно вечером 23 февраля Китс умер, а Северн находился у его постели. В те последние месяцы он мог есть горячий суп и хлеб и слышал, как кто-то говорил, что его стихи будут читать и дальше. Через три дня его похоронили на кладбище у пирамиды Цестия, и по его желанию камень не получил имени.'
        p3: '26 февраля он был похоронен на кладбище у пирамиды Цестия, и по его желанию на камне не было имени. Комната у Испанской лестницы сохранилась, и ее окно до сих пор выходит на площадь.'
        p2: 'В те последние месяцы на столе было больше, чем один анчоус и кусок хлеба. 26 февраля 1821 года он был похоронен на кладбище у пирамиды Цестия.'
        p1: 'Поздно вечером 23 февраля Китс умер, а Северн до конца находился у его постели. Более пятидесяти лет спустя Северн был похоронен на том же кладбище, рядом с Китсом.'
      none: 'В январе Северн выбился из сил и потерял сознание в соседней комнате. Поздно вечером 23 февраля кусок хлеба и анчоусы все еще лежали на столе, а стул у кровати был пуст.'
      desync: 'В январе Северн рухнул. Когда {staff} был отозван, он лежал в своей одежде в соседней комнате, наполовину написанное письмо все еще лежало на столе, а бутылочка с чернилами была открыта.'
      not_admitted: '{staff} никогда не заходил в дом и лишь несколько раз черпал воду из фонтана в форме лодки у подножия лестницы. Когда продавец цветов спросил, кто наверху болен, у {staff} не было ответа, и окно на втором этаже осталось закрытым.'
      points:
        p2:
          class_medical: 'Утром 9 декабря Китс выкашлял две чашки крови. Пришел доктор Кларк, засучил рукав и сказал, что выпьет еще восемь унций; на столе лежала дневная еда: один анчоус и кусок хлеба. {staff}, знавший медицину, взял пациента за запястье и сказал, что он не вынесет такого кровотечения, затем рассказал врачу все, что он ел за последние несколько дней, и врач убрал ланцет. В полдень Северн принес тарелку горячего супа и кусок хлеба. Китс откинулся на подушках, доедал ложку за ложкой и вернул ему пустую миску.'
          else: 'Утром 9 декабря Китс выкашлял две чашки крови. Пришел доктор Кларк, засучил рукав и сказал, что выпьет еще восемь унций; на столе лежала дневная еда: один анчоус и кусок хлеба. {staff} открыл принесенное с собой современное руководство по уходу, прочитал вслух отрывок из него врачу, записал все, что пациент ел за последние несколько дней, и положил перед ним, а врач убрал ланцет. В полдень Северн принес тарелку горячего супа и кусок хлеба. Китс откинулся на подушках, доедал ложку за ложкой и вернул ему пустую миску.'
        p1:
          class_medical: '15 января Северн написал, что банк вернул ему счет и что имеющиеся деньги позволят оплатить арендную плату только один раз; Китс не выпускал его из виду, поэтому он не мог выйти рисовать за деньги и не спал целую ночь. {staff}, обученный медсестринскому делу, брал на себя обязанности по ночам, время от времени поднимая Китса, чтобы он кашлял, вытирая пот и меняя наволочку, и выключал лампу только ближе к рассвету. Северн спал в соседней комнате в своей одежде, в ботинках. Проснувшись утром, он сначала открыл дверь и посмотрел на кровать, затем вернулся и дочитал письмо, которое оставил незаконченным.'
          else: '15 января Северн написал, что банк вернул ему счет и что имеющиеся деньги позволят оплатить арендную плату только один раз; Китс не выпускал его из виду, поэтому он не мог выйти рисовать за деньги и не спал целую ночь. {staff}, привыкший к дежурству, пододвинул стул к кровати и отправил Северна спать в соседнюю дверь, а сам вставал, чтобы посмотреть каждый раз, когда пациент переворачивался. Северн спал в соседней комнате в своей одежде, в ботинках. Проснувшись утром, он сначала открыл дверь и посмотрел на кровать, затем вернулся и дочитал письмо, которое оставил незаконченным.'
        p3:
          class_lettered: 'К середине февраля Китс уже не мог вставать с постели. Он все еще чувствовал, что ничего не оставил после себя, и не хотел, чтобы имя было написано на его надгробии. {staff}, читавший его книги, сел у кровати и рассказывал о его одах: люди будут читать их снова и снова и заучивать наизусть строчка за строчкой, и эта комната в Риме будет сохранена для него. Китс молча слушал, его пальцы еще долгое время оставались на простыне. Сквозь щель в окне доносился шум фонтана на площади, а в книге у кровати лежала прессованная фиалка.'
          class_teaching: 'К середине февраля Китс уже не мог вставать с постели. Он все еще чувствовал, что ничего не оставил после себя, и не хотел, чтобы имя было написано на его надгробии. {staff}, который преподавал, сел у кровати и сказал, что в будущих классах ученики будут выучивать его оды наизусть до последней строчки, и что эта комната в Риме будет сохранена для него. Китс молча слушал, его пальцы еще долгое время оставались на простыне. Сквозь щель в окне доносился шум фонтана на площади, а в книге у кровати лежала прессованная фиалка.'
          else: 'К середине февраля Китс уже не мог вставать с постели. Он все еще чувствовал, что ничего не оставил после себя, и не хотел, чтобы имя было написано на его надгробии. {staff} сел у кровати и медленно рассказал о том, что станет с его стихами: люди будут читать их снова и снова и заучивать наизусть строчка за строчкой, и эта комната в Риме будет сохранена для него. Китс молча слушал, его пальцы еще долгое время оставались на простыне. Сквозь щель в окне доносился шум фонтана на площади, а в книге у кровати лежала прессованная фиалка.'
      excerpts:
