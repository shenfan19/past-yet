  mendel_brno:
    name: 'Горох и законы наследственности'
    place: 'Брно'
    figure: 'Грегор Мендель'
    story: 'С 1856 по 1863 год Грегор Мендель скрещивал растения гороха в саду своего дома в Брно и подсчитывал их потомство. 8 февраля и 8 марта 1865 года он сообщил о результатах в двух беседах с Обществом естествознания Брно, и статья была напечатана в протоколах общества в 1866 году. При его жизни она почти не рассматривалась. Мендель умер в 1884 году, а в 1900 году три ботаника наткнулись на его работу, сами занимаясь наследственностью.'
    story_prose:
      opening:
        - 'Брно, зима 1865 года. С 1856 года монах Грегор Мендель скрещивал растения гороха в монастырском саду и подсчитывал их потомство поколение за поколением, восемь лет по его собственным данным. Этой зимой он должен представить эти цифры Брненскому обществу естествознания.'
        - 'За всю историю он выступил с двумя лекциями, 8 февраля и 8 марта, а в следующем году статья была напечатана в материалах общества. При его жизни вряд ли кто-то пошел дальше; он умер в Брно в 1884 году, и только в 1900 году его обнаружили три ботаника, каждый по отдельности. В этом филиале носильщик стелит соломенные циновки у дверей конференц-зала, а старушка продает сушеный горох на Капустном рынке.'
        - 'Несколько типов людей могут помочь в этой поездке: кто-то осторожный, кто сможет сохранить оба разговора в безопасности; тот, кто учит и может излагать цифры из поколения в поколение; кто-то убедительный, кто может убедить слушателя согласиться, прежде чем собрание закончится, снова вырастить горох дома.'
      outcomes:
        all: 'Той осенью в монастырь дошло письмо откуда-то с пересчетом гороха в другом саду. Мендель разложил его рядом со своими цифрами на столе, а рядом с ними прижал лист подсчетов по поколениям.'
        p3: 'Той осенью в монастырь дошло письмо откуда-то с пересчетом гороха в другом саду. Мендель разложил два набора чисел рядом на столе и просмотрел их построчно.'
        p2: 'Некоторые из тех, кто слышал эту речь, переписали лист подсчета по поколениям и забрали его домой. Когда в следующем году материалы были опубликованы, они сверили с ними свои копии, и каждая ячейка согласилась.'
        p1: 'В 1866 году эти два доклада стали называться «Эксперименты над гибридами растений» и были напечатаны в четвертом томе трудов общества. В монастырском саду в тот год как обычно завезли горох.'
      none: 'В 1866 году статья была напечатана в трудах общества, и вряд ли кто-то пошел дальше. В монастырском саду каждую зиму гороховые рамки стояли пустыми.'
      desync: 'Вечером 8 февраля было время только описать метод, а второй разговор так и не был назначен. Когда {staff} был отозван, большая часть рукописи Менделя лежала неперевернутой, зажатой под углом стола в конференц-зале.'
      not_admitted: '{staff} так и не попал в зал заседаний общества и провел несколько дней на Капустном рынке, помогая старухе сортировать сушеный горох. Круглые в одну кучу, морщинистые в другую; она никогда их не считала.'
      points:
        p1:
          class_lettered: 'Вечером 8 февраля в зале заседаний общества зажглись лампы, а снег растаял лужицей на соломенных циновках у двери. В руках Менделя были цифры за восемь лет. Накануне {staff}, как это делает хранитель записей, разложил для него рукопись на две стопки, подсунул полоску бумаги, чтобы отметить, где закончится этот вечер, и на второй стопке написал дату следующего выступления. Достигнув разделительной страницы, он остановился, разровнял остальную часть рукописи и положил ее в сумку. Когда собрание закончилось, дата следующего выступления уже была в протоколе: 8 марта.'
          else: 'Вечером 8 февраля в зале заседаний общества зажглись лампы, а снег растаял лужицей на соломенных циновках у двери. В руках Менделя были цифры за восемь лет. Накануне вечером {staff} слышал, как он читал рукопись, следил за часами, свернул за угол на полпути и отложил вторую половину. Достигнув разделительной страницы, он остановился, разровнял остальную часть рукописи и положил ее в сумку. Когда собрание закончилось, дата следующего выступления уже была в протоколе: 8 марта.'
        p2:
          class_teaching: '8 марта состоялся второй разговор. Он рассказывал, как делятся потомки гибридов, читая числа одно за другим, а люди внизу записывали их до тех пор, пока уже не могли отличить одно поколение от другого. {staff}, как это делал бы учитель, нарисовал на доске в конце класса таблицу, один столбец для первого поколения, другой для следующего, и заполнял ячейку каждый раз, когда читал число. После встречи несколько человек все еще стояли перед столом, проверяя карандашами свои тетради по строкам. Один из них, считая, произнес это вслух: три к одному.'
          else: '8 марта состоялся второй разговор. Он рассказывал, как делятся потомки гибридов, читая числа одно за другим, а люди внизу записывали их до тех пор, пока уже не могли отличить одно поколение от другого. {staff} заранее скопировал свои номера по поколениям на большом листе, один столбец для первого поколения, другой для следующего, и прикрепил его к стене в задней части комнаты. После встречи несколько человек все еще стояли перед столом, проверяя карандашами свои тетради по строкам. Один из них, считая, произнес это вслух: три к одному.'
        p3:
          class_lettered: '12 марта оба разговора завершились, а те, кто их слышал, еще не разошлись. {staff}, как ведется реестр, изложил небольшую книжку, в которой каждый, желающий снова вырастить горох, оставил свое имя и адрес, а счета должны были быть отправлены обратно в следующем году. Мендель достал небольшой пакетик сушеного горошка и протянул его первому человеку, оставившему свой адрес; На бумаге были написаны сорт и подсчеты на следующий год. Мужчина положил пакет во внутренний карман пальто и застегнул пуговицы.'
          else: '12 марта оба разговора завершились, а те, кто их слышал, еще не разошлись. {staff} разыскал одного за другим людей, сидевших в первых рядах оба вечера, беседовал с ними дом за домом и, когда одного убедил, попросил его оставить адрес. Мендель достал небольшой пакетик сушеного горошка и протянул его первому человеку, оставившему свой адрес; На бумаге были написаны сорт и подсчеты на следующий год. Мужчина положил пакет во внутренний карман пальто и застегнул пуговицы.'
      excerpts:
        p3: 'Мендель достал небольшой пакетик сушеного горошка и протянул его первому человеку, оставившему свой адрес; На бумаге были написаны сорт и подсчеты на следующий год. Мужчина положил пакет во внутренний карман пальто и застегнул пуговицы.'
        p2: 'После встречи несколько человек все еще стояли перед столом, проверяя карандашами свои тетради по строкам. Один из них, считая, произнес это вслух: три к одному.'
        p1: 'Достигнув разделительной страницы, он остановился, разровнял остальную часть рукописи и положил ее в сумку. Когда собрание закончилось, дата следующего выступления уже была в протоколе: 8 марта.'
    relic: 'стручок гороха'
    relic_desc: 'Засушенный стручок из монастырского сада.'
    points:
      p1: 'Помогите Менделю уместить восемь лет в два выступления и защитить оба чтения для общества Брно.'
      p2: 'Разделите подсчеты по поколениям, чтобы слушатели могли проверить услышанные цифры.'
      p3: 'Пока слушатели еще здесь, помогите Менделю организовать репликацию на другом сайте до того, как выйдет печатный отчет.'
    points_fail:
      p1: 'Время первой встречи истекает, а вторая никогда не запланирована. Учетная запись неполная, и офис отзывает сотрудника после потери синхронизации.'
      p2: 'Читатели забирают домой общую сумму, но не могут сказать, какие цифры относятся к первому поколению, а какие — к более позднему.'
      p3: 'Читателям за пределами Брно приходится ждать слушаний и отпечатков, и никто из присутствовавших не согласился повторить подсчеты.'
    shift:
      p1:
        was: '8 февраля и 8 марта 1865 года Мендель сообщил о своих экспериментах с горошком в двух беседах с Брненским обществом естествознания.'
      p2:
        was: 'Переговоры 1865 года основывались на годах подсчетов гороха. В статье, опубликованной в 1866 году, результаты были разделены по поколениям.'
        now: '{staff} просит Менделя после выступления оставить лист сравнения, чтобы слушатели могли сверить с ним свои записи.'
      p3:
        was: 'Общество Брно напечатало эту статью в 1866 году. Мендель использовал ее отпечатки, чтобы переписываться с другими учеными для проверки своих результатов.'
        now: '{staff} записывает адреса желающих наблюдателей и согласовывает, какие счетчики отправить обратно. В следующем вегетационном сезоне один наблюдатель отправляет в Брно цифры, которые Мендель может сравнить со своими собственными, прежде чем рассылать материалы.'
        who: 'mendel_brno'
        bio: 'Статья Менделя в конечном итоге появилась в материалах дела. Повторение, начатое на переговорах, принесло ему более ранние результаты, которые он мог проверить самостоятельно.'
    vignettes:
      straw: '{staff} помогает носильщику постелить соломенные циновки у двери конференц-зала. Снег тает с каждой пары сапог, и швейцар говорит, что господа скорее услышат о горохе, чем вытрут ноги.'
      market: '{staff} помогает пожилой женщине на Капустном рынке сортировать сушеный горох: круглый в одну кучу, а морщинистый в другую. По ее словам, круглые продаются лучше; {staff} все равно считает обе кучки и выходит почти три к одному, и смеется первым.'
      furrow: 'В конце марта {staff} гуляет по полевым тропинкам за городом. Фермер разбрасывает зимний навоз и говорит, что горох в этом году должен быть убран в начале года, до поздних заморозков.'
  mendeleev_petersburg:
    name: 'Периодическая таблица элементов'
    place: 'Санкт-Петербург'
    figure: 'Дмитрий Менделеев'
    story: '1 марта 1869 года Дмитрий Менделеев составил одностраничную таблицу, сгруппировавшую элементы по атомному весу и химическому сходству. На заседании Российского химического общества 18 марта Николай Меншуткин зачитал доклад в отсутствие Менделеева. Протокол отложил обсуждение до следующего заседания, на котором этот вопрос не поднимался. Таблица появилась в учебнике химии Менделеева позднее в марте и распространялась отдельно. В немецком реферате той весной периодическое повторение превратилось в пошаговое изменение.'
    story_prose:
      opening:
        - 'Санкт-Петербург, весна 1869 года. 1 марта Дмитрий Менделеев закончил одностраничную таблицу, группирующую элементы по атомному весу и химическому сходству, оставив в ней пробелы для еще не обнаруженных элементов.'
        - 'Исторически он отсутствовал на собрании Русского химического общества 18 марта: по одним сведениям, он отправился осматривать сыроварни в Тверской губернии, по другим - заболел, и Николай Меншуткин читал ему газету; протокол отложил дискуссию из-за отсутствия автора, и на следующем заседании никто не поднял эту тему. В реферате, отправленном в Германию в мае, его первый вывод о периодичности свойств выражался как ступенчатое изменение. В этом филиале наборщик в типографии ворчит по поводу пустых коробок в столе, а трактирщик держит самовар.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто разбирается в бумагах и может отличить рукопись от прилагаемого к ней стола; тот, кто учит и может задавать вопросы на собрании; кто-то, кто знает немецкий и может уловить одно слово.'
      outcomes:
        all: 'Тем летом немецкие читатели обнаружили периодические повторения в абстрактном видении. В протоколе общества в Петербурге за пунктом таблицы следовала полстраницы вопросов и ответов, а на самой таблице рядом с несколькими пробелами были карандашные кольца.'
        p2: 'В протоколе общества за пунктом таблицы следовала теперь полстраницы вопросов и ответов. После этого он держал стол при себе, а рядом с несколькими щелями у него были кольца для карандашей.'
        p3: 'Тем летом немецкие читатели абстрактно обнаружили, что свойства элементов периодически повторяются. Когда кто-то написал с вопросом, как отличить повторение от исключения, он разложил таблицу и ответил по пунктам.'
        p1: 'В конце марта таблица вышла вместе со вторым выпуском «Основ химии», а также была напечатана отдельным листом для коллег. В 1875 году был найден галлий и заполнил одну из пустот в нем.'
      none: '15 апреля общество собралось снова, но никто не поднял стол. В типографии сухие листы сходили с линии один за другим, пробелы все еще остаются.'
      desync: '18 марта у Меншуткина был только стол; рукопись все еще была упакована в багаж, и общество ударило по ней. Когда {staff} был отозван, стол все еще лежал на столе в конференц-зале, и никто к нему не прикасался.'
      not_admitted: '{staff} так и не переступил порог общества и провел несколько дней в гостинице, учась заваривать чай из самовара. Вратарь все время следил за бутсами {staff}, пока кран не повернули в нужную сторону.'
      points:
        p1:
          class_lettered: '18 марта собралось Российское химическое общество, а Менделеева там не было. Из того, что он оставил Меншуткину, стол стоял на одном месте, а рукопись газеты все еще была упакована в нераспечатанный багаж. {staff}, как это делает хранитель бумаг, нашел рукопись в багаже, проверил ее страницу за страницей, скрепил ее со столом и перед свиданием вручил обе руки Меньшуткину. Меншуткин разложил таблицу на столе, развернул рукопись и прочел ее страницу за страницей. В столе были щели, и в заднем ряду кто-то вытянул руку, чтобы посмотреть.'
          else: '18 марта собралось Российское химическое общество, а Менделеева там не было. Из того, что он оставил Меншуткину, стол стоял на одном месте, а рукопись газеты все еще была упакована в нераспечатанный багаж. {staff} просидел полночи, нашел рукопись в неоткрытом сундуке еще до рассвета и поспешил на встречу с ней и столом в обеих руках. Меншуткин разложил таблицу на столе, развернул рукопись и прочел ее страницу за страницей. В столе были щели, и в заднем ряду кто-то вытянул руку, чтобы посмотреть.'
        p2:
          class_teaching: '15 апреля общество собралось снова, и Менделеев был в городе. Пункт, отложенный на прошлой встрече, все еще стоял на старой странице. {staff}, как это сделал бы учитель, перед собранием скопировал большую таблицу и повесил ее в передней части комнаты, а также скопировал строку из последних минут, которая будет обсуждаться в присутствии автора, в начало повестки дня. Когда предмет подошел, Менделеев стоял со столом в руке. Всякий раз, когда кто-то спрашивал о пробеле, он обводил коробку карандашным кольцом. К концу встречи в нескольких местах появились кольца, а кончик карандаша затупился.'
          else: '15 апреля общество собралось снова, и Менделеев был в городе. Пункт, отложенный на прошлой встрече, все еще стоял на старой странице. {staff} нашел секретаря перед собранием, указал на строку в последних минутах, которая будет обсуждаться при присутствии автора, и попросил скопировать ее в повестку дня на этот раз. Когда предмет подошел, Менделеев стоял со столом в руке. Всякий раз, когда кто-то спрашивал о пробеле, он обводил коробку карандашным кольцом. К концу встречи в нескольких местах появились кольца, а кончик карандаша затупился.'
        p3:
          class_lettered: 'В начале июня реферат немецкого Zeitschrift für Chemie уже был на немецком языке, но еще не напечатан. {staff}, как это делает переводчик, прочитал рядом с русским немецкое и остановился на первом выводе: в оригинале говорилось, что свойства показывают периодичность, в переводе говорилось, что они меняются ступенчато. Менделеев взял лист, прочитал строку, вычеркнул слово и написал рядом слово периодичности. Прежде чем чернила высохли, лист был отправлен в конверт для Германии.'
          else: 'В начале июня реферат немецкого Zeitschrift für Chemie уже был на немецком языке, но еще не напечатан. {staff} сверил немецкий язык с русским по пунктам и в первом выводе подчеркнул одно слово: периодичность в оригинале, поэтапное изменение в переводе. Менделеев взял лист, прочитал строку, вычеркнул слово и написал рядом слово периодичности. Прежде чем чернила высохли, лист был отправлен в конверт для Германии.'
      excerpts:
        p2: 'Всякий раз, когда кто-то спрашивал о пробеле, он обводил коробку карандашным кольцом. К концу встречи в нескольких местах появились кольца, а кончик карандаша затупился.'
        p3: 'Менделеев взял лист, прочитал строку, вычеркнул слово и написал рядом слово периодичности. Прежде чем чернила высохли, лист был отправлен в конверт для Германии.'
        p1: 'Меншуткин разложил таблицу на столе, развернул рукопись и прочел ее страницу за страницей. В столе были щели, и в заднем ряду кто-то вытянул руку, чтобы посмотреть.'
    relic: 'Набор карточек с элементами'
    relic_desc: 'Карточки с рукописными надписями, которые можно раскладывать как пасьянс.'
    points:
      p1: 'Поскольку Менделеева уже нет в городе, отнесите вместе бумагу и стол, которые он оставил Меншуткину, на собрание Химического общества.'
      p2: 'Когда автор вернется, заберите вопрос, отложенный для обсуждения, и дайте ему время на следующей встрече ответить на вопросы о таблице.'
      p3: 'Прежде чем немецкий реферат пойдет в печать, пусть Менделеев проверит его первый вывод и восстановит слово, в котором говорится, что свойства периодически повторяются.'
    points_fail:
      p1: 'Меншуткин получает только стол. Газета до сих пор забита вещами автора, поэтому общество отказывается от вещи, а офис отзывает сотрудника.'
      p2: 'Отложенный элемент остается на предыдущей странице минут. Следующая встреча не оставляет времени для обсуждения элементов.'
      p3: 'Немецкий экземпляр отправился в наборщик. Читатели видят, что свойства меняются поэтапно, и упускают из виду, что они повторяются.'
    shift:
      p1:
        was: '18 марта 1869 года (6 марта по российскому календарю) Меншуткин представил доклад Менделееву. Менделеев отсутствовал: по одним сведениям, он уехал осматривать сыроварни в Тверской губернии, по другим сведениям, он был болен.'
      p2:
        was: 'Протокол отложил обсуждение, поскольку Менделеев отсутствовал. На более поздних собраниях этот вопрос не рассматривался.'
        now: 'Общество дает Менделееву время ответить на следующем заседании. Он отмечает спорные записи и соглашается проверить их у химиков, которые их подняли.'
      p3:
        was: 'В немецком реферате 1869 года использовалось слово, обозначающее поэтапные изменения, тогда как в русском оригинале утверждалась периодичность.'
        now: 'В немецком аннотации говорится, что свойства периодически повторяются. Корреспондент, прочитавший только аннотацию, спрашивает, чем отличается повторение от исключения, и Менделеев может ответить по таблице.'
        who: 'mendeleev_petersburg'
        bio: 'Менделеев составил раннюю таблицу в Петербурге и распространил ее через собрания общества, отдельные листы и журналы. По мере того, как работа пересекала языки, центральный термин менял значение.'
    vignettes:
      flyers: '{staff} помогает типографу, развешивая свежие листы на столе для просушки. Наборщик ворчит, что никогда еще он не ставил страницу с таким количеством пустых клеточек и вопросительных знаков, и спрашивает, не забыл ли господин их заполнить.'
      neva: 'Лед на Неве сошёл. {staff} стоит с толпой на набережной, когда лодка переправляется из крепости во дворец, а мужчина рядом говорит, что пока эта лодка не переправится, никто не сможет.'
      samovar: '{staff} учится заваривать чай из самовара в гостинице. Хранитель говорит, что иностранцы всегда поворачивают кран не в ту сторону и обжигают ботинки, и все время следит за ногами {staff}.'
  curie_paris:
    name: 'Два новых элемента'
    place: 'Париж'
    figure: 'Мария Кюри'
    story: 'В апреле 1898 года Мария Кюри сообщила, что настуран испускает более сильные лучи, чем мог объяснить содержащийся в нем уран. Работая вместе с Пьером Кюри в Школе промышленной физики и химии в Париже, она разделяла его части и следовала за лучами. 18 июля 1898 года они объявили о новом элементе и назвали его полонием в честь ее родной Польши; 26 декабря вместе с Гюставом Бемоном они объявили о радие. Мария Кюри умерла в 1934 году от апластической анемии, обычно связанной с длительным воздействием радиации.'
    story_prose:
      opening:
        - 'Париж, лето 1898 года. В Школе промышленной физики и химии Мария Кюри и Пьер Кюри разделяют настуран по частям и следуют за лучами. В апреле она сообщила, что руда испускала более сильные лучи, чем мог объяснить содержащийся в ней уран.'
        - 'В истории 18 июля они объявили о новом элементе и назвали его полонием, в честь ее родной Польши; 26 декабря вместе с Гюставом Бемоном они объявили о радие, и вместе с заметкой была напечатана новая спектральная линия, увиденная Эженом Демарсе. Сарай, в котором они работали, плохо вентилировался и пропускал дождь, и в течение многих лет они брали образцы голыми руками; в 1934 году Мари умерла от апластической анемии, обычно связанной с длительным воздействием радиации. В этом филиале женщина держит небольшую столовую в Латинском квартале, а мужчина держит книжный киоск на берегу Сены.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто имеет защиту и знает медицину или лабораторную работу; тот, кто знает записи и может составить несколько из них; кто-то убедительный, кто может выиграть комнату.'
      outcomes:
        all: 'Той зимой инструменты перенесли в комнату, которую освободила школа, щит стоял перед скамейкой, а перчатки висели на гвозде у ее края. 26 декабря отчет о радие поступил в Академию, и вместе с ним была напечатана новая спектральная линия.'
        p3: 'С этого года щит стоял перед их скамейкой, а перчатки висели на гвозде на краю. После этого Мари проработала еще несколько лет.'
        p2: 'Той зимой инструменты были перенесены в комнату, которую освободила школа, и больше не переносились. Тетради стояли в ряд на подоконнике, в порядке дат.'
        p1: '26 декабря отчет о радие поступил в Академию, и вместе с ним была напечатана новая спектральная линия. В сарае в углу скамейки лежали тетради с измерениями того года, верхняя из которых была еще открыта.'
      none: 'Той зимой дождь все еще шел сквозь крышу сарая. Они вдвоем по-прежнему голыми руками поднимали стеклянные блюда, и в темноте то, что лежало в них, излучало слабое свечение.'
      desync: 'В ночь на 25 декабря спектральные наблюдения и их записи все еще не совпадали, и отчет на конец года не был отправлен. Когда {staff} был отозван, на скамейке в сарае лежали открытые три блокнота, каждый на разную дату.'
      not_admitted: '{staff} никогда не заходил в сарай на школьном дворе и несколько раз пообедал в маленьком заведении в Латинском квартале. За соседним столом все еще спорили польские студенты, а свекольник снова остыл.'
      points:
        p1:
          class_lettered: '25 декабря отчет по итогам года должен был быть отправлен в Академию на следующий день. Новую спектральную линию, которую видел Демарсай, пришлось сопоставить, запись за записью, с измерениями в их записных книжках. {staff}, как это делает хранитель записей, выстроил в тетрадях даты спектральных наблюдений, номера образцов и измерений ряд за рядом, скопировал их в таблицу и поместил ее в начале рукописи. Пьер просмотрел рукопись от начала до конца, подписал ее и передал Мари. Она расписалась под его именем и положила спектральную запись поверх рукописи.'
          else: '25 декабря отчет по итогам года должен был быть отправлен в Академию на следующий день. Новую спектральную линию, которую видел Демарсай, пришлось сопоставить, запись за записью, с измерениями в их записных книжках. {staff} всю ночь просидел над блокнотами, нашел один за другим номера образцов, соответствующих спектральным наблюдениям, и скопировал их на поля рукописи. Пьер просмотрел рукопись от начала до конца, подписал ее и передал Мари. Она расписалась под его именем и положила спектральную запись поверх рукописи.'
        p2:
          class_lettered: '24 декабря дождь снова прошел через крышу сарая, и поймавшие его тазики достигли двери. {staff}, как это делает хранитель документации, сплел в один том июльскую записку о полонии, рукопись, которую нужно было сдать в конце года, и ежедневник с указанием того, когда протекла крыша, когда остановились работы и как часто переносили инструменты, и отнес его человеку, ответственному за школьные помещения. Он перевернул страницы, на которых работа остановилась и продолжалась еще долгое время, затем достал ключ из ящика и положил его в ежедневник. На ключе висела маленькая деревянная бирка с номером комнаты.'
          else: '24 декабря дождь снова прошел через крышу сарая, и поймавшие его тазики достигли двери. {staff} взял два отчета и ежедневную книгу простоев и целое утро ждал возле школьного офиса, пока не вышел человек, отвечающий за классы, а затем перелистывал ему страницы одну за другой. Он перевернул страницы, на которых работа остановилась и продолжалась еще долгое время, затем достал ключ из ящика и положил его в ежедневник. На ключе висела маленькая деревянная бирка с номером комнаты.'
        p3:
          class_medical: 'В конце августа в сарае было душно, и на лавке стоял ряд стеклянных блюд, в которых хранились вновь и вновь очищенные растворы. Мари и Пьер по-прежнему поднимали тарелки и наливали из них голые руки. {staff}, как учит медсестра, установил щит перед скамейкой, переместил за него образцы один за другим и вручил каждому из них пару перчаток, сказав, что эта штука ранит, не вызывая кровотечения. Мари посмотрела на щит, надела перчатки и потянулась за стеклянным блюдом. Когда к вечеру в комнате потемнело, то, что лежало на блюде, начало слабо светиться; оно упало на щит, а не на ее руки.'
          class_learned: 'В конце августа в сарае было душно, и на лавке стоял ряд стеклянных блюд, в которых хранились вновь и вновь очищенные растворы. Мари и Пьер по-прежнему поднимали тарелки и наливали из них голые руки. {staff}, как того требует лаборатория, установил перед столом щит, переместил за него образцы, измерил, на каком расстоянии от тела было безопасно, провел мелом линию поперек стола и положил рядом с ним две пары перчаток. Мари посмотрела на щит, надела перчатки и потянулась за стеклянным блюдом. Когда к вечеру в комнате потемнело, то, что лежало на блюде, начало слабо светиться; оно упало на щит, а не на ее руки.'
          else: 'В конце августа в сарае было душно, и на лавке стоял ряд стеклянных блюд, в которых хранились вновь и вновь очищенные растворы. Мари и Пьер по-прежнему поднимали тарелки и наливали из них голые руки. {staff} установил принесенный с собой щит перед скамейкой, переместил образцы за ним один за другим и оставил пару перчаток на табурете, где обычно сидела Мари. Мари посмотрела на щит, надела перчатки и потянулась за стеклянным блюдом. Когда к вечеру в комнате потемнело, то, что лежало на блюде, начало слабо светиться; оно упало на щит, а не на ее руки.'
      excerpts:
        p3: 'Мари посмотрела на щит, надела перчатки и потянулась за стеклянным блюдом. Когда к вечеру в комнате потемнело, то, что лежало на блюде, начало слабо светиться; оно упало на щит, а не на ее руки.'
        p2: 'Он перевернул страницы, на которых работа остановилась и продолжалась еще долгое время, затем достал ключ из ящика и положил его в ежедневник. На ключе висела маленькая деревянная бирка с номером комнаты.'
        p1: 'Пьер просмотрел рукопись от начала до конца, подписал ее и передал Мари. Она расписалась под его именем и положила спектральную запись поверх рукописи.'
    relic: 'Пробирка с урановой смолкой'
