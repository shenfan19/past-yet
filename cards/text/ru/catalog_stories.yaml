        now: 'Первые заемщики прочитали проверенный ею набор. Более поздние копии все еще различаются, но в этом заимствовании зафиксировано, какие главы она одобрила.'
        who: 'murasaki_kyoto'
        bio: 'Мурасаки писал при дворе Хэйан. Предоставление бумаги, копирование и предоставление во временное пользование повлияло на то, как произведение, все еще находящееся в стадии редактирования, достигло новых читателей.'
    vignettes:
      banquet: 'Накануне пятидесятого банкета {staff} помогает нести подносы по галерее. Одна из дам шепчет себе под нос, что завтра вечером, как только господа выпьют, они начнут дразнить женщин именами из сказки, и надо только не слушать.'
      paper: '{staff} помогает женщине сортировать листы цветной бумаги по главам и взвешивать каждую стопку. По ее словам, сначала проверяется каждая готовая страница, и если рука наклоняется, вся страница делается заново, и бумагу тоже приходится запрашивать заново.'
      snow: 'Снег выпадает в двенадцатом месяце. {staff} прочесывает галерею, когда чтение внутри останавливается на полпути, и голос спрашивает, кто взял следующий том.'
