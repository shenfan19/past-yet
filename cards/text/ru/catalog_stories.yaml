  freud_vienna:
    name: 'Два года для одной книги'
    place: 'Вена'
    figure: 'Зигмунд Фрейд'
    story: '4 ноября 1899 года в Вене появилось «Толкование сновидений» Зигмунда Фрейда, и на титульном листе издательство напечатало 1900 год. Позже Фрейд назвал книгу своей реакцией на смерть отца. Первый тираж составил 600 экземпляров, и на их продажу ушло восемь лет; второе издание вышло только в 1909 году.'
    story_prose:
      opening:
        - 'Вена, осень 1899 года. В издательстве Дойтике вот-вот выйдет книга Зигмунда Фрейда «Толкование сновидений»; он появится 4 ноября, на титульном листе будет напечатано «1900». Три года назад, в октябре, в Вене умер его отец Якоб; Позже Фрейд сказал, что эта книга была его реакцией на смерть отца.'
        - 'В истории книга не привлекла особого внимания, когда вышла; на продажу первого тиража в 600 экземпляров ушло около восьми лет, а второе издание вышло только в 1909 году. В этом филиале книжного магазина в центре города есть помощник, который протирает окно, и мальчик на побегушках, который ведет книгу заказов, а в кофейне газеты читает врач.'
        - 'В этой поездке могут помочь несколько типов людей: тот, кто разбирается в медицине и может говорить с коллегами как один из них; тот, кто знает газеты и в какие руки должна дойти книга; кто-то с готовым языком, который может открыть дверь.'
      outcomes:
        p1: 'Той зимой к Фрейду одно за другим приходили письма, в которых страница за страницей спрашивали о книге. В книге заказов книжного магазина сонник протянулся еще на несколько строчек.'
      none: 'В конце декабря выпал снег, и мальчик из книжного магазина, просматривая книгу заказов, обнаружил, что сонник в этом месяце почти не двигался. В углу окна книга все еще лежала раскрытой, на титульном листе было написано «1900 год».'
      not_admitted: '{staff} так и не проник в двери этих коллег и лишь несколько раз стоял у витрины книжного магазина в центре города. Сонник лежал в углу, раскрытый на титульном листе, на стекле тонкая пленка пыли.'
      points:
        p1:
          class_medical: 'В конце ноября новая книга о снах почти три недели пролежала в углу витрины. {staff} в качестве врача посетил кабинеты нескольких коллег с копиями в сумке и каждому вложил в главу о снах записку, указав, с какой страницы начать. Той ночью окно в центре города светилось допоздна. На столе лежала книга с цифрой «1900» на титульном листе, больше половины уже прочитано.'
          class_press: 'В конце ноября новая книга о снах почти три недели пролежала в углу витрины. {staff} использовал контакты репортера, чтобы узнать, какие врачи будут писать длинные рецензии для журналов, упаковывать копии и носить их от двери к двери. Той ночью окно в центре города светилось допоздна. На столе лежала книга с цифрой «1900» на титульном листе, больше половины уже прочитано.'
          else: 'В конце ноября новая книга о снах почти три недели пролежала в углу витрины. {staff} несколько дней сидел в кофейне, беседовал с врачами, читающими газеты, и раздавал копии одну за другой, прося только вернуть их после прочтения. Той ночью окно в центре города светилось допоздна. На столе лежала книга с цифрой «1900» на титульном листе, больше половины уже прочитано.'
      excerpts:
        p1: 'Той ночью окно в центре города светилось допоздна. На столе лежала книга с цифрой «1900» на титульном листе, больше половины уже прочитано.'
