  murasaki_kyoto:
    name: 'Первый великий роман в мире'
    place: 'Киото'
    figure: 'Мурасаки Сикибу'
    story: 'Осенью 1008 года императрица Сёси родила сына, и Мурасаки Сикибу, одна из ее придворных, вела дневник последующих недель. На банкете в честь пятидесятого дня придворный позвал «Молодую Мурасаки», девушку из «Повести о Гэндзи», старейшего датированного знака, известного в этой истории. На одиннадцатом месяце женщины выбрали бумагу, переписали и переплели сказку, чтобы Сёши отнес ее во дворец, а Мичинага унесла черновик, который Мурасаки хранила в своей комнате. Ни одна копия, написанная ее рукой, не сохранилась.'
    story_prose:
      opening:
        - 'Киото, осень 5 года Канко 1008 года. Сёси, императрица императора Итидзё, родила сына, а Мурасаки Сикибу, одна из ее придворных, ведет дневник последующих недель. На банкете в честь пятидесятого дня придворный зовет «Молодую Мурасаки», девушку из «Повести о Гэндзи», старейшего датированного знака, известного в этой истории.'
        - 'Исторически сложилось так, что на одиннадцатом месяце женщины выбирали бумагу, переписывали сказку и переплетали ее, чтобы Сёши отнес ее во дворец; Пока Мурасаки был на дежурстве, Мичинага взяла из своей комнаты черновик, который она еще не отредактировала, и дала его дочери Кенши, и она записала в своем дневнике свое беспокойство. Ни одна копия, написанная ее рукой, не сохранилась, и история доходит до более поздних строк рукописи, которые отличаются друг от друга. В этом филиале одна из дам Сёши присматривает за бумагой для копирования, а другая знает, как проходят банкеты.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто хранит архивы или читает корректуру, или кто-то ловкий и терпеливый, чтобы не допустить, чтобы набор книг ошибся на один том; кто-то, кто знает книги и может поговорить с людьми, чтобы выбрать экземпляр, который дадут взаймы.'
      outcomes:
        all: 'На семнадцатый день одиннадцатого месяца переплетенная история вернулась во дворец вместе с Сёши, ни одного тома не пропало. Те, кто приходил одолжить его после двенадцатого месяца, открывали отмеченный ею набор. В 2012 году Япония объявила 1 ноября Днем классики после дневниковой записи о банкете в честь пятидесятого дня.'
        p2: 'Те, кто приходил позаимствовать сказку после двенадцатого месяца, открывали проверенный ею набор с ее маленькой отметкой в углу. Несмотря на это, ни одна рукописная копия не сохранилась, а более поздние рукописи до сих пор отличаются друг от друга.'
        p1: 'В семнадцатый день одиннадцатого месяца Сёши вернулась во дворец с принцем, и переплетенная сказка ушла с ней. В 2012 году Япония объявила 1 ноября Днем классики после дневниковой записи о банкете в честь пятидесятого дня.'
      none: 'Снег выпал в двенадцатом месяце. Главы, которые Мурасаки еще не доработала, были взяты из ее комнаты, а на столе осталась только лакированная шкатулка с неплотно закрытой крышкой.'
      desync: 'Рано утром семнадцатого дня одиннадцатого месяца в сундуке все еще лежали непроверенные тома. Женщина, которая хранила газету, разложила образцы по полу и сопоставляла их по одному тому, и когда был отозван {staff}, она все еще стояла на коленях среди них, а в ее руке был титульный лист, который ни к чему не соответствовал.'
      not_admitted: '{staff} так и не проник внутрь и лишь несколько раз стоял за стеной Цучимикадо. В ночь на пятидесятый день банкета музыка и смех доносились из-за стены, и кто-то задал вопрос, который нельзя было разобрать с дороги.'
      points:
        p1:
          class_lettered: 'Рано утром семнадцатого дня одиннадцатого месяца Сёши должен вернуться во дворец. Вдоль галереи стоят груды недавно переплетенных томов, готовых и непроверенных, смешанных вместе, чернила на нескольких титульных листах еще не высохли. {staff}, дома с бумагой и письмом, открывает каждый том и сверяет его со списком глав, вытаскивает один переплет с неправильной главой, кладет на его место проверенный из другой стопки и раскладывает тома в сундук с книгами по порядку. Перед отъездом экипажа дама, хранящая бумагу, кладет последний том в сундук. Она еще раз прижимает кончик пальца к узлу в углу, прежде чем выпрямиться.'
          else: 'Рано утром семнадцатого дня одиннадцатого месяца Сёши должен вернуться во дворец. Вдоль галереи стоят груды недавно переплетенных томов, готовых и непроверенных, смешанных вместе, чернила на нескольких титульных листах еще не высохли. {staff}, ловкий и терпеливый, проводит пальцем по каждому титульному листу по образцам бумаги, вытаскивает один переплет с неправильной главой, кладет на его место проверенный из другой стопки и раскладывает тома в сундук с книгами по порядку. Перед отъездом экипажа дама, хранящая бумагу, кладет последний том в сундук. Она еще раз прижимает кончик пальца к узлу в углу, прежде чем выпрямиться.'
        p2:
          class_lettered: 'В середине двенадцатого месяца, после двух дней без снега, некоторые дворцовые дамы послали позаимствовать эту сказку; они хотят сначала прочитать последующие главы. На столе в комнате Мурасаки лежат несколько глав, которые она еще не закончила редактировать, с небольшими новыми надписями на полях. {staff}, дома с книгами, упаковывает набор, который она сдала, в собственный сундук, помечает его как набор, взятый во временное пользование, и отмечает для каждого тома, у кого он есть и когда он должен быть возвращен; незаконченные главы заворачиваются в бумагу и хранятся рядом с ней. Мурасаки переворачивает один том сборника на последнюю страницу и делает кистью небольшую пометку в углу. Она кладет кисть обратно в лакированную коробочку, и крышка с тихим стуком закрывается.'
          else: 'В середине двенадцатого месяца, после двух дней без снега, некоторые дворцовые дамы послали позаимствовать эту сказку; они хотят сначала прочитать последующие главы. На столе в комнате Мурасаки лежат несколько глав, которые она еще не закончила редактировать, с небольшими новыми надписями на полях. {staff}, осторожный и убедительный, просит заемщиков сначала прочитать проверенный набор и упаковывает его в собственный сундук; незаконченные главы заворачиваются в бумагу и хранятся рядом с ней. Мурасаки переворачивает один том сборника на последнюю страницу и делает кистью небольшую пометку в углу. Она кладет кисть обратно в лакированную коробочку, и крышка с тихим стуком закрывается.'
      excerpts:
        p2: 'Мурасаки переворачивает один том сборника на последнюю страницу и делает кистью небольшую пометку в углу. Она кладет кисть обратно в лакированную коробочку, и крышка с тихим стуком закрывается.'
        p1: 'Перед отъездом экипажа дама, хранящая бумагу, кладет последний том в сундук. Она еще раз прижимает кончик пальца к узлу в углу, прежде чем выпрямиться.'
    relic: 'Лакированная коробочка для кистей'
    relic_desc: 'Небольшая коробочка с кистями, тушечницей и водой.'
    points:
      p1: 'Распределяйте статьи по главам и проверяйте доставку томов, скопированных для Сёши, чтобы можно было собрать комплект.'
      p2: 'Предложите первым читателям копию, которую она одобрит. Держите у нее незаконченные бумаги и попросите новых переписчиков рисовать из утвержденного набора.'
    points_fail:
