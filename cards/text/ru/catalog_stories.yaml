      prater: 'В воскресенье {staff} гуляет по длинному проспекту Пратера. Каждую скамейку занимают люди, приехавшие на воздух из города, продавец колбасы кричит до хрипоты, а на концерт, похоже, никто не едет.'
      stools: '{staff} несет табуреты для хора позади театра. Сопрано чешет себе горло и говорит, что высокие ноты в последней части написаны так, будто для того, чтобы поднять певца к потолку, и весь ряд смеется и соглашается.'
  lovelace_london:
    name: 'Первая программа'
    place: 'Лондон'
    figure: 'Ада Лавлейс'
    story: 'В 1842 году итальянский инженер Луиджи Менабреа опубликовал на французском языке отчет об аналитической машине Чарльза Бэббиджа. Ада Лавлейс перевела ее и добавила семь примечаний, что примерно в три раза длиннее статьи; последнее, примечание G, описывает, как машина может вычислять числа Бернулли. В августе 1843 года Бэббидж захотел, чтобы газета опубликовала его собственную жалобу на правительство, и попросил ее отозвать ее, если редактор не напечатает ее без подписи. Она отказалась, и в том же году перевод и примечания, подписанные AAL, появились в «Научных мемуарах Тейлора». 14 августа она предложила организовать строительство двигателя, если Бэббидж продолжит проектирование; он отказался от ее условий.'
    story_prose:
      opening:
        - 'Лондон, лето 1843 года. Ада Лавлейс перевела на английский французский отчет итальянского инженера Менабреа об аналитической машине Бэббиджа и добавила семь примечаний, что примерно в три раза длиннее статьи. Последняя из них, «Примечание G», шаг за шагом описывает, как эта машина, пока еще только на бумаге, будет вычислять числа Бернулли.'
        - 'В истории Бэббидж хотел, чтобы его жалоба на правительство была напечатана вместе с газетой; редактор не стал печатать его без подписи, и Бэббидж попросил ее отказаться. 6 августа она написала ему, что не будет и что она твердо решила. 14 августа она предложила заняться строительством двигателя, если он продолжит проектирование, и Бэббидж отметил в письме, что отказывается от всех условий. На следующий день она рассказала матери, что типографии вызвали ее, чтобы она наблюдала за последним туром, и что исправление формул - тяжелая работа. В этом филиале наборщик типографии жалуется, что сигма заканчивается, а ткачиха в Спиталфилдсе держит жаккардовый ткацкий станок.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает перевод и документы и может держать пачку копий; тот, кто умеет читать доказательства и проверять таблицу ячейку за ячейкой; кто-то тактичный, который может объединить двух людей в одно подразделение работы.'
      outcomes:
        all: 'Вышел номер «Научных воспоминаний Тейлора», таблица примечания «Ж» без единой ячейки из столбца и инициалы А.А.Л. в конце. В сентябре в доме на Дорсет-стрит сидел посетитель, развернувший перед ним чертежи, очертания затрат и одну страницу, разделяющую работу.'
        p3: 'В сентябре посетитель просмотрел чертежи и схему затрат на Дорсет-стрит, забрал одну страницу, разделяющую работу, и сказал, что деньги можно будет выплатить после того, как инженерные работы будут проверены.'
        p2: 'В напечатанной заметке Ж ни одна ячейка таблицы не выскользнула из своего столбца. Проверка, которую она проверила, осталась в шкафу типографии, красные точки все еще оставались на ее полях.'
        p1: 'Номер «Научных мемуаров» Тейлора вышел, как и планировалось, перевод и семь примечаний были напечатаны вместе, а инициалы А.А.Л. в конце.'
      none: 'В конце августа вышел номер «Научных мемуаров Тейлора». В ткацкой мастерской в Спиталфилдсе перфокарты все еще переворачивались одна за другой.'
      desync: 'Принтеру было приказано продолжать работу и подождать, а перевод и примечания были удалены из номера. Когда офис отозвал {staff}, наборщик разбивал формы Note G и пригоршнями складывал шрифт обратно в футляр.'
      not_admitted: '{staff} так и не зашел в дом на площади Сент-Джеймс и провел несколько дней, наблюдая за жаккардовым ткацким станком у двери ткача в Спиталфилдсе. Карты переворачивались одна за другой, и цветок на шелке становился длиннее.'
      points:
        p1:
          class_lettered: '6 августа она написала Бэббиджу, что перевод и примечания не будут отозваны и что она приняла полное решение. {staff}, как это делает хранительница бумаг, пересчитала перевод и семь примечаний по номерам страниц, перевязала их одной лентой, добавила инструкцию о печати своей подписью и отнесла в типографию. Наборщик развязал ленту: перевод вверху, примечания внизу и внизу большая таблица ноты G. Он разгладил таблицу и утяжелил ее углы двумя кусочками шрифта.'
          else: '6 августа она написала Бэббиджу, что перевод и примечания не будут отозваны и что она приняла полное решение. {staff} отнес сверток, перевязанный скотчем, к двери типографии и подождал там, пока она откроется, не позволяя никому больше его взять, и положил обеими руками на верстак наборщика. Наборщик развязал ленту: перевод вверху, примечания внизу и внизу большая таблица ноты G. Он разгладил таблицу и утяжелил ее углы двумя кусочками шрифта.'
        p2:
          class_lettered: '15 августа печатники снова вызвали ее, чтобы посмотреть последние корректуры и формулы, которые нужно было проверить одну за другой. {staff}, как это делает корректор, положила линейку на таблицу примечания G и читала ее ряд за рядом через скамью, ставя красную точку на полях там, где ячейка могла проскользнуть в следующий столбец, пока наборщик слушал. В сумерках по правому полю корректуры пробежала линия красных точек. Она поднесла таблицу к окну, прочитала ее еще раз от первого ряда до последнего и только потом отдала обратно наборщику.'
          else: '15 августа печатники снова вызвали ее, чтобы посмотреть последние корректуры и формулы, которые нужно было проверить одну за другой. {staff} скопировала таблицу из примечания G с начала, по одной копии, и просматривала ее ряд за рядом через скамейку, ставя красную точку на полях там, где ячейка могла перейти в следующий столбец. В сумерках по правому полю корректуры пробежала линия красных точек. Она поднесла таблицу к окну, прочитала ее еще раз от первого ряда до последнего и только потом отдала обратно наборщику.'
        p3:
          class_lettered: 'В конце августа банкноты подписали A.A.L. уже были в печати. {staff} в форме соглашения изложила на одной странице разделение работ из своего письма от 14 августа: она будет следить за бизнесом и сбором денег, Бэббидж будет заниматься проектированием, и сначала одному спонсору будет предложено просмотреть чертежи и схему затрат. Паж ночевал в каждом доме. Когда оно вернулось, два имени в разных руках стояли у подножия, а под ними тот же день для встречи.'
          else: 'В конце августа банкноты подписали A.A.L. уже были в печати. {staff} несколько раз носила свое письмо от 14 августа туда и обратно между своим домом и Дорсет-стрит и написала на одной странице, какой шаг сделает каждая сторона. Паж ночевал в каждом доме. Когда оно вернулось, два имени в разных руках стояли у подножия, а под ними тот же день для встречи.'
      excerpts:
        p3: 'Паж ночевал в каждом доме. Когда оно вернулось, два имени в разных руках стояли у подножия, а под ними тот же день для встречи.'
        p2: 'В сумерках по правому полю корректуры пробежала линия красных точек. Она поднесла таблицу к окну, прочитала ее еще раз от первого ряда до последнего и только потом отдала обратно наборщику.'
        p1: 'Наборщик развязал ленту: перевод вверху, примечания внизу и внизу большая таблица ноты G. Он разгладил таблицу и утяжелил ее углы двумя кусочками шрифта.'
    relic: 'Перфокарта'
    relic_desc: 'Карточка, на которой расположение отверстий указывает машине, какие операции выполнить.'
    points:
      p1: 'С разрешения Лавлейс пришлите ее перевод и примечания для печати.'
      p2: 'Прежде чем вернуться к последнему доказательству, попросите Лавлейс и наборщика прочитать таблицу в примечании G и отметить записи, которые, скорее всего, попадут в другой столбец.'
      p3: 'Изложите ее разделение работы в коротком предложении для возможного спонсора. Лавлейс организовала бы проект, Бэббидж возглавил проектирование, и оба согласились на первую встречу.'
    points_fail:
