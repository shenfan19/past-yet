  fibonacci_pisa:
    name: 'Первая версия 1202 года'
    place: 'Пиза'
    figure: 'Фибоначчи'
    story: 'Леонардо Пизанский научился считаться с девятью индийскими фигурами еще мальчиком в Буджиа, на побережье Северной Африки, где его отец работал на пизанских купцов. В 1202 году, вернувшись в Пизу, он закончил «Liber abaci», обучающую новым цифрам и нулю для счета и торговли. В 1228 году он переработал книгу, и сохранившиеся копии относятся к этой второй версии.'
    story_prose:
      opening:
        - 'Пиза, 1202 год. Мальчиком Леонардо отправился в Буджиа на североафриканском побережье, где его отец работал у пизанских купцов, и там он научился считаться с девятью индийскими цифрами. Вернувшись в Пизу, он написал «Liber Abaci», которая учит людей писать числа с помощью этих цифр и нуля и использовать их при покупке и продаже.'
        - 'По истории в 1228 году он переработал книгу, добавив новый материал и вырезав то, что считал лишним; каждая копия, дошедшая до более поздних читателей, восходит к этой версии, и полная копия первой версии 1202 года неизвестна. В этом отделении ученик конторы на набережной не может понять, почему маленький кружок должен занимать колонну, а лодочник на «Арно» называет номер каждого тюка, приходящего на берег.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает книги и как хранится набор экземпляров, кто-то, кто учит и может поговорить с автором, или кто-то прилежный, кто может ясно сказать, чем ранний текст отличается от более позднего.'
      outcomes:
        all: 'Более двадцати лет спустя исправленную версию копировали в книжных магазинах Пизы. Деревянный сундук все еще был там, а ранний текст и новый лежали открытыми рядом, и читатели сравнивали их страницу за страницей в поисках примеров, добавленных позже.'
        p1: 'Более двадцати лет спустя исправленную версию копировали в книжных магазинах Пизы. Деревянный сундук все еще был там, а ранний текст и новый лежали открытыми рядом, и читатели сравнивали их страницу за страницей в поисках примеров, добавленных позже.'
      none: 'После 1228 года книжные магазины Пизы копировали только исправленную версию. В счетной конторе ученик учился на этом, записывая ноль штрих за штрихом в пустой столбец.'
      not_admitted: '{staff} так и не прошел через дверь Леонардо. У «Арно» лодочник все еще разгружал тюки, а на берегу кто-то чертил на доске один штрих за другим.'
      points:
        p1:
          class_lettered: '{staff} следовал правилам хранителя книг, разложил тома первой версии на столе, пронумеровал их один за другим и сказал Леонардо, что вносить изменения позже - это хорошо, но если этот набор не будет сохранен, никто никогда не узнает, как он впервые его написал. Леонардо долго листал тома, взялся за перо и в конце каждого написал свое имя и год окончания. Он подождал, пока чернила высохнут, положил тома один за другим в деревянный сундук и застегнул застежку.'
          else: '{staff} скопировал несколько обработанных примеров из первой версии на восковую табличку, положил их рядом с новым способом, которым он диктовал, и спросил его, куда людям в последующие годы следует обратиться, если они хотят увидеть, как он впервые подсчитывал суммы. Леонардо долго листал тома, взялся за перо и в конце каждого написал свое имя и год окончания. Он подождал, пока чернила высохнут, положил тома один за другим в деревянный сундук и застегнул застежку.'
      excerpts:
        p1: 'Леонардо долго листал тома, взялся за перо и в конце каждого написал свое имя и год окончания. Он подождал, пока чернила высохнут, положил тома один за другим в деревянный сундук и застегнул застежку.'
    relic: 'Восковая табличка с числами'
    relic_desc: 'Табличка с десятью новыми цифрами рядом со старыми римскими цифрами.'
    points:
      p1: 'Убедить Леонардо подписать и оставить полную копию первой версии 1202 года в Пизе, чтобы более поздняя версия не заменяла ее.'
    points_fail:
      p1: 'После того как автор редактирует произведение, заемщики знают только новую копию и не могут восстановить первую компиляцию.'
    shift:
      p1:
        was: '1202: Леонардо Пизанский завершил первую версию Liber abaci; Насколько известно, не сохранилась ни одна его полная копия, а дошедшие до нас рукописи отражают редакцию 1228 года.'
        now: 'Ранний набор сохраняет свою дату и примеры. Позже читатели смогут поставить два сборника рядом и найти новые добавленные работы.'
        who: 'fibonacci_pisa'
        bio: 'Первая версия книги Леонардо Пизанского 1202 года сохранилась в полной копии рядом с редакцией 1228 года, так что более поздние читатели смогут увидеть, что он изменил за эти годы.'
    vignettes:
      rabbits: 'В копии {staff} возникает проблема с парой кроликов, которая каждый месяц рожает новую пару. {staff} не может не считать на полях до двенадцатого месяца, и цифры получаются точно такие же, как в учебниках последующих столетий.'
      zero: 'В конторе на набережной {staff} показывает ученику, как записывать пустое место как ноль. Мальчик говорит, что колечко вообще ничто и не имеет права на отдельный столбик. {staff} просит его сверить две бухгалтерские книги друг с другом, и мальчик замолкает.'
      quay: '{staff} помогает разгружать тюки с лодки на Арно и окликает каждый, когда тот выходит на берег. В банке служащий слушает и делает отметку на доске для каждого звонка.'
  dante_ravenna:
    name: 'Поэма на языке улицы'
    place: 'Равенна'
    figure: 'Данте Алигьери'
    story: 'Изгнанный из Флоренции в 1302 году, Данте Алигьери поселился в Равенне около 1318 года и там закончил «Рай», последнюю часть «Комедии», написанную на тосканском повседневном языке. Около 1319 года Джованни дель Виргилио, ученый из Болоньи, прислал ему латинское стихотворение, призывающее его писать на латыни и приехать в Болонью за лавром, и Данте ответил латинскими стихами. 20 января 1320 г. он прочитал лекцию в Вероне. В сентябре 1321 года, возвращаясь из посольства в Венецию, он заболел и умер в Равенне.'
    story_prose:
      opening:
        - 'Равенна, начало 1320 года. Данте был изгнан из Флоренции на восемнадцать лет, и в приговоре 1302 года говорится, что он будет казнен, если вернется. По приглашению сеньора Равенны Гвидо Новелло да Полента он живет здесь и пишет последнюю часть «Божественной комедии» «Рай» на повседневном тосканском уличном языке.'
        - 'Что касается истории, Джованни дель Виргилио, преподававший в Болонье, прислал ему латинское стихотворение, призывающее его писать на латыни и приехать в Болонью за лавром, на что Данте ответил латинской эклогой. В сентябре 1321 года, возвращаясь из посольства в Венецию, он заболел и умер в Равенне, так и не вернувшись во Флоренцию. В этом филиале городской продавец чернил считает переписчиков своими лучшими клиентами, а сборщик дров отправляется в сосновый лес у моря.'
        - 'В этом путешествии могут помочь два типа людей: тот, кто знает бумаги и может сказать, какую стопку следует отправить, а какую оставить, и тот, кто знает поэзию и книги и может сесть рядом с ним и сказать несколько правдивых слов.'
      outcomes:
        all: 'В следующем году латинские стихи ходили взад и вперед, каждое из которых было запечатано воском. В сентябре 1321 года он заболел после возвращения из Венеции, и в стопке «Парадизо» у его кровати последний лист был исписан до конца.'
        p2: 'Он прожил в Равенне еще больше года. В сентябре 1321 года он заболел после возвращения из Венеции, и в стопке «Парадизо» у его кровати последний лист был исписан до конца.'
        p1: 'Латинские стихи ходили взад и вперед в следующем году. Каждый ответ складывался отдельно, с небольшой каплей воска.'
      none: 'Письмо из Болоньи все еще лежало на столе. В сосновом лесу под Равенной порывами дул морской ветер.'
      desync: 'Латинский ответ поступил вместе с экземпляром «Рай» и был отправлен среди отдельных листов, а Болонья получила лишь несколько страниц на тосканском языке. {staff} был отозван офисом до того, как пришел какой-либо ответ.'
      not_admitted: '{staff} так и не проник в дверь копировальной и провел несколько дней, собирая дрова в сосновом лесу за городом. Две стопки бумаг все еще лежали на столе Данте.'
      points:
        p1:
          class_lettered: '{staff} следовал правилам хранителя бумаг и разделил две стопки в копировальной: Paradiso на тосканском языке остался на столе, а латинский ответ на Болонью был отложен и сложен отдельно. Данте капнул воск на складку и прижал ее костяшкой пальца. Посыльный заправил его под пальто и вышел за городские ворота на холодный январский ветер по дороге в Болонью.'
          else: '{staff}, осторожный по натуре, прошелся по копировальной комнате стопку за стопкой, выбрал латинский ответ для Болоньи из отдельных листов Paradiso и сложил его самостоятельно. Данте капнул воск на складку и прижал ее костяшкой пальца. Посыльный заправил его под пальто и вышел за городские ворота на холодный январский ветер по дороге в Болонью.'
        p2: 'Однажды мартовским днем Данте прочитал {staff} строки, которые он только что закончил. {staff} повторял их вслед за ним построчно и только в конце сказал то, что долго сдерживал: люди будут читать эти стихи веками, только на этом уличном языке, и однажды Флоренс захочет привести его домой. Данте положил ручку на край чернильницы и посмотрел на лист. Спустя долгое время он снова окунул его и продолжил писать.'
      excerpts:
        p2: 'Данте положил ручку на край чернильницы и посмотрел на лист. Спустя долгое время он снова окунул его и продолжил писать.'
        p1: 'Данте капнул воск на складку и прижал ее костяшкой пальца. Посыльный заправил его под пальто и вышел за городские ворота на холодный январский ветер по дороге в Болонью.'
    relic: 'Лавровый лист'
    relic_desc: 'Засохший лист из лаврового венка поэта.'
    points:
      p1: 'Выделите время, чтобы Данте отправил Джованни свой ответ на латыни из Равенны. Храните его отдельно от копируемых страниц Paradiso.'
      p2: 'Пусть Данте в изгнании знает, что «Комедию» будут читать поколениями и что однажды Флоренция захочет его вернуть.'
    points_fail:
      p1: 'Получатель получает отдельные страницы повествования. Ответ остается среди черновиков, и офис отзывает сотрудника.'
      p2: 'Он продолжает писать в Равенну, не имея ответа на свою надежду вернуться домой. В этой ветке ему никто не рассказывает, что было дальше.'
    shift:
      p1:
        was: 'В конце 1319 или начале 1320 года, во время написания «Рая» в Равенне, Данте обменивался латинскими стихами с Джованни дель Вирджилио в Болонье.'
      p2:
        was: 'В сентябре 1321 года Данте умер в Равенне, так и не вернувшись во Флоренцию; около 1519 года Флоренция потребовала его останки, и монахи Равенны спрятали его кости в стене.'
        now: '{staff} сообщил ему в Равенне, что у «Комедии» всегда будут читатели и что однажды его город захочет вернуть его домой.'
        who: 'dante_ravenna'
        bio: 'В последние годы своего пребывания в Равенне изгнанный Данте понял, что его поэма будет жить долго и что однажды Флоренция будет им гордиться.'
    vignettes:
      latin: 'В копировальной {staff} видит две стопки бумаги: «Рай» на тосканском языке и латинский стих, направляемый в Болонью, отправитель которого говорит, что только латынь достойна лавра. {staff} знает, какую стопку все будут читать через семьсот лет, и проглатывает слова.'
      pinewood: '{staff} следует за сборщиками леса в сосновый лес у моря недалеко от Равенны, отдыхает на песчаной земле и слышит шум волн за деревьями.'
      ink: '{staff} помогает продавцу чернил вынести банки с лодки. Чернила варятся из дубовых галлов и ржавого железа, и продавец говорит, что большую часть их покупают городские переписчики.'
  copernicus_frombork:
    name: 'Солнце в центре'
    place: 'Фромборк, Польша'
    figure: 'Николай Коперник'
    story: 'В 1539 году во Фромборк приехал молодой математик Ретикус и убедил Николая Коперника опубликовать его книгу. В 1543 году в Нюрнберге был напечатан «De Revolutionibus», в котором Земля вращается и вращается вокруг Солнца, с неподписанным обращением к читателю на лицевой стороне. Коперник болел с конца 1542 года и умер во Фромборке 24 мая 1543 года. Его друг Тидеманн Гизе позже писал, что печатная книга дошла до него только в день его смерти.'
    story_prose:
      opening:
        - 'Фромборк, Польша, весна 1543 года. Николай Коперник болен с конца прошлого года. Книга «О революциях», над которой он работал десятилетиями, печатается в Нюрнберге; в нем Земля вращается вокруг своей оси и движется вокруг Солнца. Четыре года назад молодой математик Ретикус приехал сюда из Виттенберга и уговорил его напечатать эту книгу.'
        - 'В истории книга вышла из печати в Нюрнберге с неподписанным обращением к читателю на лицевой стороне. Его друг Тидеман Гизе позже писал, что печатная книга дошла до него только в день его смерти; 24 мая он умер во Фромборке. В июле Гизе попросил Ретикуса передать письмо с просьбой выпустить исправленное издание в городской совет Нюрнберга. В этом филиале рыбак из деревни у подножия холма чинит сети, а слуга каждый день носит воду в палату больного.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто умеет ухаживать за больными и может удержать постель больного, или кто-то, кто достаточно силен в дороге, чтобы нести книгу вдаль; тот, кто разбирается в бумагах и может отличить автограф от копии; и кто-то достаточно внимательный, чтобы составить список опечаток.'
      outcomes:
        all: 'Книга, полученная в начале мая, после этого осталась у его кровати. Тем летом в экземплярах, выдававшихся поблизости, был лист с опечатками, а рукопись с автографом, завернутая в ткань и запертая в шкафу, позже перешла в руки Гизе.'
        p3: 'После этого книга осталась у его кровати титульным листом вверх. Несколько недель спустя он умер во Фромборке.'
        p2: 'Тем летом в экземплярах, которые давали поблизости, был лист с опечатками, углы которого скручивались от переворачивания. Ответы печатников в других местах позже были сохранены в том же файле.'
        p1: 'Рукопись с автографом, завернутая в ткань, позже перешла в руки Гизе, а от него — к Ретикусу. Спустя столетия оно оказалось в Ягеллонской библиотеке в Кракове.'
      none: 'Около 24 мая печатные книги достигли Фромборка. Окно больничной комнаты было приоткрыто, а слуга с водой постоял у двери и не входил.'
