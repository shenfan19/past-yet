  rembrandt_amsterdam:
    name: 'После смерти сына'
    place: 'Амстердам'
    figure: 'Рембрандт ван Рейн'
    story: 'Сын Рембрандта Титус был похоронен в Амстердаме 7 сентября 1668 года, через полгода после его свадьбы. В марте 1669 года у Тита родилась дочь Тиция. В том же году Рембрандт написал автопортреты, датированные 1669 годом. Он умер 4 октября 1669 года и был похоронен через четыре дня в арендованной могиле; его последняя картина осталась незавершенной. Вдову Тита похоронили 21 октября.'
    story_prose:
      opening:
        - 'Амстердам, сентябрь 1669 года. Шестидесятитрехлетний художник Рембрандт ван Рейн, написавший «Ночной дозор», обанкротился в 1656 году и доживает здесь свои последние годы в долгах. Год тому назад, через полгода после свадьбы, похоронили его сына Тита, единственного из его детей, выросшего; в марте у Тита родилась дочь Тиция. В этом году он написал несколько автопортретов с этой датой, а его последняя картина до сих пор стоит на мольберте.'
        - 'Исторически он умер 4 октября и через четыре дня был похоронен в арендованной могиле; картина на мольберте осталась незавершенной и сейчас находится в Национальном музее в Стокгольме. Через две недели после него была похоронена и вдова Тита. В этом ответвлении есть колорист у канала, баржа, разбрасывающий торф по воде, и ночной сторож, который трясет погремушкой на улице.'
        - 'В этом путешествии может помочь один человек: кто-то, кто держит кисть и имеет твердую руку, или кто-то с глазом художника и еще более твердой рукой, чтобы растирать краски и стабилизировать холст.'
      outcomes:
        all: '4 октября Рембрандт умер в возрасте шестидесяти трех лет. Картина все еще стояла на мольберте, руки старика были на несколько мазков дальше, чем раньше, а палитра лежала в стороне, ее краски высохли.'
        p1: '4 октября Рембрандт умер в возрасте шестидесяти трех лет. Картина все еще стояла на мольберте, руки старика были на несколько мазков дальше, чем раньше, а палитра лежала в стороне, ее краски высохли.'
      none: '4 октября Рембрандт умер в возрасте шестидесяти трех лет. Картина на мольберте остановилась там, где его силы иссякли, кисть стояла в банке, и краска в ее волосках медленно высыхала.'
