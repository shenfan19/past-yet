          else: 'В ночь на 29 мая стол покрыт бумагой; письмо к Шевалье занимает страницу за страницей, а документы, о которых в нем говорится, лежат под несколькими книгами. {staff}, методичный и способный сидеть всю ночь, остается за столом и берет каждую страницу, когда он ее заканчивает, складывает письмо отдельно, связывает бумаги во вторую пачку в том порядке, в котором он дает, пишет на каждой имя, чтобы отправиться к Шевалье вручную с первыми лучами солнца. На рассвете Галуа торопливо добавляет линию на полях страницы и откладывает перо. Два свертка лежат рядом на столе, а на верхнем написано имя Шевалье.'
