  ramanujan_madras:
    name: 'Письмо с просьбой проверить вычисления'
    place: 'Мадрас'
    figure: 'Сриниваса Рамануджан'
    story: 'С марта 1912 года Шриниваса Рамануджан работал клерком в бухгалтерии Мадрасского портового треста. В четверг, 16 января 1913 года, он написал оттуда Г. Х. Харди в Кембридж, рассказывая о своей работе и исследовании расходящихся рядов. В 1914 году он уехал в Англию. Он умер в 1920 году, вернувшись в Индию больным.'
    story_prose:
      opening:
        - 'Мадрас, январь 1913 года. Двадцатипятилетний Шриниваса Рамануджан работает клерком в бухгалтерии Портового треста: днем он проверяет бухгалтерские книги, а ночью занимается математикой. В четверг, 16 января, он пишет отсюда Г. Х. Харди в Кембридж о результатах, которых он достиг за пределами университетского курса.'
        - 'Что касается истории, 8 февраля Харди ответил с просьбой написать доказательства; 27 февраля он закончил и отправил второе письмо, в котором говорилось, что он уже наполовину голоден; стипендия пришла только в мае, и до тех пор семья жила на его жалованье в тридцать рупий в месяц; в 1914 году он уехал в Англию, тяжело заболел в 1917 году без какого-либо точного диагноза и умер в 1920 году после возвращения в Индию в возрасте всего 32 лет. В этом филиале служащий Портового треста перевязывает пакеты для заграничной почты, а коллега в бухгалтерии делится своей лампой.'
        - 'В этом путешествии могут помочь несколько типов людей: кто-то, кто умеет готовить или присматривать за людьми, кто-то волевой, владеющий синтезатором питательных веществ, или кто-то добрый, терпеливый и сильный; кто-то, кто умеет вести счета или занимался торговлей, кто-то санитар, знающий свое дело, или тот, кто звонит с подарочной коробкой; врач или медик с наноаптечкой.'
      outcomes:
        all: 'В 1914 году он отплыл в Англию с грифельной доской в багаже. Позже, в Кембридже, он не побывал в санатории; после возвращения в Индию он еще много лет занимался математикой.'
        p3: 'В 1914 году он уехал в Англию. Несколько лет спустя, в Кембридже, он не пошел в санаторий; после возвращения в Индию он еще много лет занимался математикой.'
        p2: 'В мае того же года пришла стипендия — семьдесят пять рупий в месяц. В те месяцы банка из-под риса никогда не опустела.'
        p1: 'Письмо дошло до Кембриджа с мадрасским штемпелем на печати. В 1914 году он отплыл в Англию.'
      none: 'Ночью 27 февраля он рухнул под лампой, наполовину исписанные страницы разбросаны по столу. В Кембридже Харди больше ничего не слышал.'
      desync: 'В ночь на 27 февраля он потерял сознание под лампой. Когда {staff} был отозван, наполовину написанное письмо лежало у него под мышкой, а чернила растеклись небольшим пятном.'
      not_admitted: '{staff} никогда не проникал в Портовый трест и лишь наблюдал снаружи, как служащие входили и выходили со своими бухгалтерскими книгами. Клерк, связывавший пакеты, зачитал адрес одного из них и остановился в Кембридже.'
      points:
        p1:
          class_food: 'Конец февраля: ответ, который Харди написал 8 февраля, достиг Мадраса и просил его написать доказательства. Каждую ночь он склонялся над лампой, наполняя одну простыню и беря другую, никогда не наедавшись больше, чем наполовину. {staff}, который умел готовить, каждый вечер приносил к лампе миску горячего риса и миску дал и смотрел, как он заканчивает, прежде чем позволить ему вернуться к письму. В ночь на 27 февраля письмо было готово; он сложил листы один за другим, сложил их и вложил в конверт. Коллега, деливший с ним лампу, уже спал, а фитиль все еще горел.'
          class_medical: 'Конец февраля: ответ, который Харди написал 8 февраля, достиг Мадраса и просил его написать доказательства. Каждую ночь он склонялся над лампой, наполняя одну простыню и беря другую, никогда не наедавшись больше, чем наполовину. {staff}, обученный уходу, вовремя приносил ему еду к столу, время от времени поднимал его, чтобы он сделал несколько шагов и попил немного воды, а поздно вечером выключал лампу и заставлял его ненадолго прилечь. В ночь на 27 февраля письмо было готово; он сложил листы один за другим, сложил их и вложил в конверт. Коллега, деливший с ним лампу, уже спал, а фитиль все еще горел.'
          else: 'Конец февраля: ответ, который Харди написал 8 февраля, достиг Мадраса и просил его написать доказательства. Каждую ночь он склонялся над лампой, наполняя одну простыню и беря другую, никогда не наедавшись больше, чем наполовину. {staff} каждый день приносил ему еду на стол и сидел с ним до поздней ночи, поднося чашку с водой к его руке всякий раз, когда его ручка останавливалась. В ночь на 27 февраля письмо было готово; он сложил листы один за другим, сложил их и вложил в конверт. Коллега, деливший с ним лампу, уже спал, а фитиль все еще горел.'
        p2:
          class_lettered: 'Апрель, и банка из-под риса дома снова опустела. На тридцать рупий в месяц нужно было прокормить всю семью, а о стипендии все еще не было известий. {staff}, привыкший работать за столом, записывал ежемесячные доходы и расходы по статьям, сколько оставить на рис, на масло, на аренду, и подсчитывал, сколько анн останется в конце месяца. В тот вечер банка с рисом снова была полной до краев. Рамануджан сидел на ступеньке у двери с грифельной доской на коленях и писал черточку за чертой.'
          class_trade: 'Апрель, и банка из-под риса дома снова опустела. На тридцать рупий в месяц нужно было прокормить всю семью, а о стипендии все еще не было известий. {staff}, которые немного торговали, пошли на рынок, чтобы найти знакомого торговца рисом, сразу купили еще и сбили цену. В тот вечер банка с рисом снова была полной до краев. Рамануджан сидел на ступеньке у двери с грифельной доской на коленях и писал черточку за чертой.'
          else: 'Апрель, и банка из-под риса дома снова опустела. На тридцать рупий в месяц нужно было прокормить всю семью, а о стипендии все еще не было известий. {staff} разобрал расходы семьи по статьям, отмерил рис и масло по дням и отнес коробку подарков знакомой семье, а затем вернулся с едой на полмесяца. В тот вечер банка с рисом снова была полной до краев. Рамануджан сидел на ступеньке у двери с грифельной доской на коленях и писал черточку за чертой.'
        p3:
          class_learned: 'Конец мая, и стипендия пришла. Его старая болезнь вернулась; он время от времени терял сознание и очень худел из-за болезни, которая возникла много лет назад и так и не была излечена. {staff}, который знал медицину, расспрашивал о каждом случае, когда она вспыхивала на протяжении многих лет, видел, что это была старая болезнь, которая никогда не проходила, открывал принесенную с собой наноаптечку и вылечивал ее. Месяц спустя он принимал вторую порцию во время еды и крепко спал по ночам. С первыми лучами солнца он брал в руки грифель, и мел двигался по нему быстро и близко.'
          else: 'Конец мая, и стипендия пришла. Его старая болезнь вернулась; он время от времени терял сознание и очень худел из-за болезни, которая возникла много лет назад и так и не была излечена. {staff}, имеющий медицинское образование, давал ему лечение шаг за шагом, как сказано в инструкциях к наномедицинскому набору, и записывал его температуру и то, сколько он ел каждый день, сравнивая один день с другим. Месяц спустя он принимал вторую порцию во время еды и крепко спал по ночам. С первыми лучами солнца он брал в руки грифель, и мел двигался по нему быстро и близко.'
