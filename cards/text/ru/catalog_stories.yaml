  du_chatelet_luneville:
    name: 'Ньютон на французском'
    place: 'Люневиль'
    figure: 'Эмили дю Шатле'
    story: 'Летом 1749 года Эмили дю Шатле находилась при дворе Станислава в Люневиле, ждала ребенка и заканчивала французский перевод «Начал» Ньютона с комментариями. 4 сентября она родила дочь. 10 сентября она умерла в возрасте сорока двух лет; Некоторые называют причиной родильную лихорадку, а другие - легочную эмболию. В тот же день Королевская библиотека в Париже подписала квитанцию на три пакета ее комментариев. Полный перевод вышел в 1759 году.'
    relic: 'Чернильница'
    relic_desc: 'Всю ночь работала маленькая чернильница на письменном столе.'
    points:
      p1: 'В Люневиле перечислите три пакета комментариев, прежде чем отправить их вместе с ее запросом в Королевскую библиотеку.'
      p2: 'Попросите ее оставить Клеро решения по двум самым трудным отрывкам, определив, где должен стоять ее перевод, а где более поздняя редакция должна быть указана отдельно.'
      p3: 'Присматривайте за ней в первые дни после рождения, вылечите ее и сохраните ей жизнь.'
    points_fail:
      p1: 'Пакет с комментарием остается. Библиотека получает только письмо, а офис отзывает сотрудника.'
      p2: 'Два черновика доходят до редактора, но ее решения о том, как печатать исправленные отрывки, не принимаются.'
      p3: '10 сентября она умерла в Люневиле, через шесть дней после рождения дочери.'
    shift:
      p1:
        was: '10 сентября 1749 года Королевская библиотека выдала квитанцию на три пакета комментариев Дю Шатле к Ньютону.'
      p2:
        was: 'В 1759 году, после смерти Дю Шатле, вышло полное французское издание, в подготовке которого участвовал Клеро.'
        now: 'У редактора есть два решения, которые она одобрила, и все последующие изменения описаны на другой странице. Читатели смогут отличить ее комментарий от редакционных дополнений.'
      p3:
        was: 'В ночь на 4 сентября 1749 года Дю Шатле родила дочь, а 10 сентября она умерла в Люневиле; Некоторые называют причиной родильную лихорадку, а другие - легочную эмболию.'
        now: 'Она пережила несколько дней после родов и выздоровела осенью. Она сама видела перевод Ньютона в печать и продолжала свои исследования в течение многих лет.'
        who: 'du_chatelet_luneville'
        bio: 'Дю Шатле пережила рождение в 1749 году, сама отнесла свой французский «Ньютон» и комментарии к нему в типографию и продолжала писать и исследовать в течение многих лет.'
    vignettes:
      stairs: 'Рано утром 4 сентября {staff} помогает прачке нести наверх стопку чистой одежды. По ее словам, лампа там зажглась в полночь; она пересчитала шаги на лестнице, и к рассвету было одиннадцать шагов.'
      candles: 'В конце августа {staff} помогает старому слуге, хранящему свечи, пересчитать магазин. По его словам, дама-маркиза сжигает больше свечей, чем кабинет короля, и в этом месяце ему придется отправить свой отчет на неделю раньше.'
      arbour: 'В октябре {staff} помогает садовнику снять занавески в беседке. По его словам, в начале осени в суде наступила тишина; большую часть лет они все еще ставили бы здесь спектакли.'
    story_prose:
      opening:
        - 'Люневиль, 1749 год. Дю Шатле близка к родам, а рукопись ее перевода «Начал» Ньютона все еще лежит у нее на столе. Она перевела латинский текст на французский и в своих комментариях объяснила его происхождение. Французские читатели, которые позже откроют «Ньютона», вместе с ним прочитают, как она это придумала.'
        - 'По историческим данным, она умерла через шесть дней после рождения дочери. В тот день Королевская библиотека в Париже выдала квитанцию на три пакета комментариев. Рукопись была сохранена, и десять лет спустя вышла полная работа; она никогда не видела ни одного печатного экземпляра.'
        - 'В этой поездке могут помочь два типа людей: тот, кто разбирается в рукописях, может помочь с переводом, а тот, кто разбирается в медсестринском деле и имеет с собой нужные лекарства и инструменты, может дежурить за пределами родильной комнаты.'
      outcomes:
        all: 'Той осенью «Ньютон» снова лежал раскрытым на столе в Люневиле. Корректуры приходили страница за страницей, она читала их страницу за страницей, а поля вела ее собственная рука.'
        p3: 'Той осенью она вернулась за свой стол. Когда корректуры прибыли, сомнительную страницу не нужно было кому-либо посылать и спрашивать; он лежал у нее на локте.'
        p2: 'Десять лет спустя Клеро развернул рукопись, а подписанный лист все еще лежал там, где лежал. Какие строки печатать так, как она их перевела, он определял место за местом, на этом листе.'
        p1: 'На квитанции Королевской библиотеки было ее имя и количество трех пакетов. День, когда это было оформлено, был 10 сентября.'
      none: 'В сентябре в Люневиле стол был очищен. Чернильница в углу еще не была закрыта крышкой.'
      desync: 'Когда пришло время сдавать рукопись, комментарий все еще находился в доме. Депозит не удалось внести, и офис сначала перезвонил {staff}. Когда мы уходили, три пакета все еще лежали под столом.'
      not_admitted: '{staff} так и не добрался до этого стола. В окно были видны сложенные стопкой бумаги, а лампа горела до поздней ночи.'
      points:
        p1: 'Перед отправкой {staff} один за другим ввел три пакета комментариев и еще раз сверил их со списком. Когда узел на последней пачке был туго затянут, на столе осталось только ее письмо в Королевскую библиотеку, чернила уже высохли.'
        p2: 'Два черновика лежали рядом, изменения толпились рядом. Она коснулась бумаги кончиком ручки и просматривала их одно место за другим, а {staff} записывал их одно место за другим на другом листе. Закончив, она взяла лист, прочитала его и подписала свое имя в правом нижнем углу.'
        p3: 'Через несколько дней после родов ее состояние резко ухудшилось. {staff} открыла принесенный с собой медицинский чемодан и дежурила у кровати, измеряя ей температуру и давая лекарства по часам, и всю ночь поддерживала горящую лампу. Прошел шестой день после рождения дочери, а Дю Шатле была еще жива. Осенью типография прислала корректуру. Она повернулась к странице, где комментарий был втиснут в текст, подтянула бумагу ближе, взяла ручку и провела линию под опечаткой.'
      excerpts:
        p3: 'Осенью типография прислала корректуру. Она повернулась к странице, где комментарий был втиснут в текст, подтянула бумагу ближе, взяла ручку и провела линию под опечаткой.'
        p2: 'Она коснулась бумаги кончиком ручки и просматривала их одно место за другим, а {staff} записывал их одно место за другим на другом листе. Закончив, она взяла лист, прочитала его и подписала свое имя в правом нижнем углу.'
        p1: 'Перед отправкой {staff} один за другим ввел три пакета комментариев и еще раз сверил их со списком. Когда узел на последней пачке был туго затянут, на столе осталось только ее письмо в Королевскую библиотеку, чернила уже высохли.'
  noether_gottingen:
    name: 'Лекция под чужим именем'
    place: 'Геттинген'
    figure: 'Эмми Нётер'
    story: 'В 1915 году Давид Гильберт и Феликс Кляйн привезли Эмми Нётер в Геттинген, но университет не позволял женщине читать лекции, и с зимы 1916 года ее курсы были объявлены под именем Гильберт. 26 июля 1918 года Кляйн представила свою статью «Инвариантные вариационные проблемы» Геттингенскому научному обществу, а в конце сентября она передала ее окончательную версию. В статье непрерывные симметрии действия связываются с законами сохранения. Ее допустили к лекциям в июне 1919 года, и только в 1923 году ей впервые заплатили небольшое фиксированное жалованье за преподавание.'
    story_prose:
      opening:
        - 'Геттинген, июль 1918 года. Три года назад Давид Гильберт и Феликс Кляйн привезли в Геттинген математика Эмми Нётер, которой сейчас тридцать шесть лет, но университет не позволял женщине читать лекции, и с зимнего семестра 1916 года ее курсы были объявлены под именем Гильберта. Этим летом она написала «Инвариантные вариационные задачи», в которых непрерывная симметрия действия связывается с законами сохранения.'
        - 'По истории, 26 июля Кляйн представила статью Геттингенскому научному обществу, а окончательную версию она передала только в конце сентября; в следующем году ее допустили к лекциям, и только в 1923 году ей впервые заплатили небольшое фиксированное жалованье за преподавание. В этом отделении в математическом корпусе есть швейцар, который закрепил расписание на несколько семестров, а на заднем дворе, где она квартирует, есть хозяйка, которая перестала считать талоны на хлеб.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто читал лекции в университете, хранил архивы или читал доказательства, или кто-то методичный и образованный, чтобы собрать вместе подписанный документ и его резюме; кто-то, кто хранит архивы или читает лекции и может поговорить с кафедрой, чтобы получить некоторую плату за ее семинар.'
      outcomes:
        all: 'В июне 1919 года, после пробной лекции, Нётер была допущена к чтению лекций в Геттингене, и ее диссертация «Инвариантные вариационные задачи» была написана под ее собственным именем. До этого ее семинар уже оплачивался, и студенты, работавшие с ней, каждую неделю приходили в определенное время.'
        p2: 'Той зимой ее семинар оплачивался, и студенты, работавшие с ней, каждую неделю приходили в определенное время. В июне 1919 года, после пробной лекции, ее допустили к лекциям.'
        p1: 'Статья была представлена вовремя, а печатный экземпляр носил ее имя. В июне 1919 года это стало ее диссертацией на право чтения лекций.'
      none: 'В конце декабря семинар все еще продолжался, но не оплачивался. На доске объявлений все еще значилось «Профессор Гильберт» с помощью доктора Нётер, а вокруг канцелярской кнопки появилось кольцо ржавчины.'
      desync: 'До заседания 26 июля статья и ее резюме еще лежали в двух стопках, а страницу автора найти не удалось. Когда {staff} был отозван, на столе лежала неподписанная первая страница, а снаружи били часы.'
      not_admitted: '{staff} никогда не заходил в математический корпус и лишь несколько раз стоял на ступеньках снаружи. Расписание было прикреплено к доске, и в одной строке было написано «Профессор Гильберт» при содействии доктора Нётер.'
      points:
        p1:
          class_learned: 'Утром 26 июля, перед собранием общества, рукопись, которую хочет Кляйн, все еще находится в двух местах: в одной стопке находится статья, подписанная Нётер, в другой - ее краткое изложение, и обе стопки просунуты среди других бумаг. {staff}, читавшая лекции в университете и знающая, как проходят такие встречи, складывает две стопки вместе по номерам страниц, находит свое имя на первой странице, отмечает ее на листке бумаги и передает ее в руки Кляйн перед встречей. Кляйн открывает первую страницу, бросает взгляд на написанное на ней имя и кладет рукопись в верхнее отделение портфеля. Он защелкивает застежку и идет в конференц-зал с чемоданом под мышкой.'
          class_lettered: 'Утром 26 июля, перед собранием общества, рукопись, которую хочет Кляйн, все еще находится в двух местах: в одной стопке находится статья, подписанная Нётер, в другой - ее краткое изложение, и обе стопки просунуты среди других бумаг. {staff}, дома с рукописями, складывает две стопки вместе, страница за страницей, находит свое имя на первой странице, отмечает ее на листке бумаги и перед встречей передает ее в руки Кляйну. Кляйн открывает первую страницу, бросает взгляд на написанное на ней имя и кладет рукопись в верхнее отделение портфеля. Он защелкивает застежку и идет в конференц-зал с чемоданом под мышкой.'
          else: 'Утром 26 июля, перед собранием общества, рукопись, которую хочет Кляйн, все еще находится в двух местах: в одной стопке находится статья, подписанная Нётер, в другой - ее краткое изложение, и обе стопки просунуты среди других бумаг. {staff} методично находит обе стопки в стопке, складывает их вместе по номерам страниц, находит свое имя на первой странице, отмечает ее листком бумаги и передает ее в руки Кляйн перед встречей. Кляйн открывает первую страницу, бросает взгляд на написанное на ней имя и кладет рукопись в верхнее отделение портфеля. Он защелкивает застежку и идет в конференц-зал с чемоданом под мышкой.'
        p2:
          class_lettered: 'В декабре семинар по-прежнему проводится каждую неделю, и в расписании по-прежнему стоит надпись «Профессор Гильберт при содействии доктора Нётер». {staff}, привыкшая к бумажной работе, переписывает по дате все занятия, которые она преподавала в этом семестре, и приносит список в отдел вместе с распечатанной копией своей подписанной статьи, прося их сначала установить оплату за следующий раунд семинара, а затем приложить его к ее новому заявлению. Департамент берет список и кладет его в новую папку с ее именем на обложке. На семинаре, который состоится на следующей неделе, Нётер распахивает дверь; доска вытерта, и в первом ряду стоят еще два стула.'
          class_learned: 'В декабре семинар по-прежнему проводится каждую неделю, и в расписании по-прежнему стоит надпись «Профессор Гильберт при содействии доктора Нётер». {staff}, которая читала лекции в университете и знает, как движутся деньги на факультете, перечисляет по датам все занятия, которые она фактически преподавала в этом семестре, и приносит список на факультет вместе с распечатанной копией своей подписанной статьи, прося их сначала установить оплату за следующий раунд семинара, а затем приложить его к ее новому заявлению. Департамент берет список и кладет его в новую папку с ее именем на обложке. На семинаре, который состоится на следующей неделе, Нётер распахивает дверь; доска вытерта, и в первом ряду стоят еще два стула.'
          else: 'В декабре семинар по-прежнему проводится каждую неделю, и в расписании по-прежнему стоит надпись «Профессор Гильберт при содействии доктора Нётер». {staff}, методичная и с громким голосом, сидит в кабинете кафедры, перечисляет на листе все занятия, которые она преподавала в этом семестре, подсчитывает их вслух, кладет распечатанную копию своей подписанной статьи и просит их сначала установить оплату за следующий раунд семинара, а затем приложить ее к ее новому заявлению. Департамент берет список и кладет его в новую папку с ее именем на обложке. На семинаре, который состоится на следующей неделе, Нётер распахивает дверь; доска вытерта, и в первом ряду стоят еще два стула.'
      excerpts:
        p2: 'Департамент берет список и кладет его в новую папку с ее именем на обложке. На семинаре, который состоится на следующей неделе, Нётер распахивает дверь; доска вытерта, и в первом ряду стоят еще два стула.'
        p1: 'Кляйн открывает первую страницу, бросает взгляд на написанное на ней имя и кладет рукопись в верхнее отделение портфеля. Он защелкивает застежку и идет в конференц-зал с чемоданом под мышкой.'
    relic: 'Объявление о лекции'
    relic_desc: 'Объявление в зале с именем Хилберта там, где должно быть ее имя.'
    points:
      p1: 'Передайте подписанную Нётер статью и ее резюме Кляйну, чтобы он мог представить работу на запланированной встрече в Геттингене.'
      p2: 'Передайте кафедре записи занятий, которые вела Нётер, и копию ее подписанной статьи. Попросите отдел запланировать оплату следующего семинара и приложите его к новому заявлению.'
    points_fail:
      p1: 'В списке есть имя докладчика, но соответствие рукописи и страницы ее автора невозможно. Общество откладывает работу на другое собрание, а офис отзывает сотрудника.'
      p2: 'Департамент согласен продолжить семинар. Он использует старое расписание и не оплачивает часы преподавания Нётер.'
    shift:
      p1:
        was: 'Феликс Кляйн представил инвариантные вариационные задачи на встрече в Геттингене 26 июля 1918 года. В печатной статье ее автором названа Эмми Нётер.'
      p2:
        was: 'Нётер получила абилитацию в 1919 году. Университет датирует ее первое преподавательское назначение с небольшой фиксированной зарплатой 1923 годом.'
        now: 'Департамент утверждает небольшой бюджет семинаров перед новой аттестацией и оплачивает часы, которые она преподает. Студенты, работающие с ней, имеют регулярное время, чтобы рассказать о своих проблемах.'
        who: 'noether_gottingen'
        bio: 'Правила Геттингена заблокировали первое заявление Нётер на получение квалификации преподавателя. Она продолжила свои исследования и позже преподавала студентам в своих классах.'
    vignettes:
      notice: 'Перед началом зимнего семестра {staff} помогает носильщику прикрепить расписание к доске. Он нажимает на одну строку: «Профессор Гильберт с помощью доктора Нётер» и говорит, что закрепил эту очередь уже на несколько семестров, и преподавать всегда была женщина-доктор.'
      turnips: 'В октябре {staff} помогает хозяйке копать репу на заднем дворе. В город вернулся грипп, говорит она, половина студенческих общежитий пустует, а талоны на хлеб она считать перестала, потому что считать уже нечего.'
      snow: 'В конце декабря {staff} помогает швейцару математического корпуса сметать снег со ступенек. С войны вернулось столько студентов, говорит швейцар, что в залах уже не осталось мест, а некоторые слушают из коридора.'
  boltzmann_duino:
    name: 'Одно и то же число, разные расположения'
    place: 'Дуино'
    figure: 'Людвиг Больцман'
    story: 'В 1877 году Людвиг Больцман связал законы теплоты со статистикой атомов, рассчитав способы распределения энергии, но в двадцатом веке многие все еще сомневались в реальности атомов. В мае 1906 года, заболев так называемой тяжелой неврастенией, он прекратил читать лекции и тем летом поехал с семьей в Дуино недалеко от Триеста. Он умер там 5 сентября в возрасте шестидесяти двух лет. Два года спустя эксперименты Жана Перрена по броуновскому движению начали подтверждать предсказания Эйнштейна, и атомы были признаны.'
    story_prose:
      opening:
        - 'Залив Дуино недалеко от Триеста, лето 1906 года. Здесь отдыхает Людвиг Больцман с женой и дочерью. Почти тридцать лет назад он подсчитал, сколько устройств может дать одинаковое распределение энергии, и связал законы теплоты с атомами. Даже сейчас многие не верят, что атомы действительно существуют.'
        - 'По истории, в мае того же года он прекратил читать лекции, заболев так называемой тяжелой неврастенией, и его лекции слушал Стефан Мейер. 5 сентября он умер в Дуино в возрасте шестидесяти двух лет. Два года спустя эксперименты Перрена по броуновскому движению начали подтверждать существование атомов. В этом филиале рыбак сушит на берегу свои сети, маленький мальчик считает гальку на пляже, а горничная отеля каждый день приносит полотенца с моря.'
        - 'В этом путешествии могут помочь два типа людей: кто-то узнал достаточно, чтобы говорить с ним об атомах, и кто-то, кто знает медицину, принес нужное лекарство и может остаться рядом с больным человеком.'
      outcomes:
        all: 'В сентябре поезд на Вену отправился из Дуино. Больцман сидел у окна, карман его пальто был набит несколькими листами работ.'
        p2: 'В сентябре поезд на Вену отправился из Дуино. Он сидел у окна и всю дорогу смотрел на море.'
        p1: 'Все лето рабочие листы лежали у него в кармане пальто.'
      none: 'В заливе Дуино было очень тихо. На террасе отеля со стола на пол слетело несколько листов работы.'
      not_admitted: '{staff} никогда не приближался к семье. Каждый день мужчина на террасе отеля сидел лицом к морю, и отпуск становился короче с каждым днем.'
      points:
        p1: 'Однажды вечером в начале августа Больцман сидел на террасе отеля, на столе лежало несколько листов работы. {staff} взял один из них и начал с дрожания крошечных частиц в воде: как Эйнштейн годом ранее рассчитал, как далеко должно их занести такое дрожание, и как через два года кто-то измерит это под микроскопом. Он дослушал до конца, не говоря ни слова, сложил листы в квадрат и положил их в карман пальто. Вернувшись в свою комнату, он держал руку на кармане.'
        p2:
          class_learned: 'Как врач, {staff} каждый день устанавливал часы приема лекарств и сна, измерял пульс утром и вечером и гулял с ним днем вдоль берега. К концу августа он стал спать дольше, чем раньше, а по утрам мог самостоятельно дойти до моря и обратно. Однажды за завтраком он послал дочь спросить, во сколько отправляется поезд в Вену.'
          else: '{staff} менял успокаивающие пластыри, которые они приносили в установленное время, сидел с ним по ночам, пока он не засыпал, а днем гулял с ним по берегу. К концу августа он стал спать дольше, чем раньше, а по утрам мог самостоятельно дойти до моря и обратно. Однажды за завтраком он послал дочь спросить, во сколько отправляется поезд в Вену.'
      excerpts:
        p2: 'К концу августа он стал спать дольше, чем раньше, а по утрам мог самостоятельно дойти до моря и обратно. Однажды за завтраком он послал дочь спросить, во сколько отправляется поезд в Вену.'
        p1: 'Он дослушал до конца, не говоря ни слова, сложил листы в квадрат и положил их в карман пальто. Вернувшись в свою комнату, он держал руку на кармане.'
    relic: 'Огарок мела'
    relic_desc: 'Потертый огрызок лекционного мела.'
    points:
      p1: 'Дайте ему знать, что через несколько лет эксперименты покажут, что атомы реальны, и теория, которую он защищал полжизни, останется в силе.'
      p2: 'Прежде чем каникулы в Дуино закончатся, вылечите его болезнь и верните его в Вену.'
    points_fail:
      p1: 'Лето он все еще проводит среди сомневающихся. В этом разделе ему никто не сказал, что эксперименты по броуновскому движению подтвердят существование атомов.'
      p2: '5 сентября произошло так, как случилось в истории. В этом филиале он так и не вернулся к своей кафедре в Вене.'
    shift:
      p1:
        was: 'Когда 5 сентября 1906 года Больцман умер, многие физики и химики все еще сомневались в реальности атомов; с 1908 года эксперименты Перрена по броуновскому движению подтвердили предсказания Эйнштейна 1905 года, и атомы стали общепринятыми.'
        now: 'Тем летом он уже знал, что через несколько лет кто-нибудь разрешит вопрос об атомах экспериментальным путем.'
      p2:
        was: 'В мае 1906 года Больцман ушел в отпуск по болезни, и его лекции взял на себя Стефан Мейер; 5 сентября он умер во время отпуска в Дуино в возрасте шестидесяти двух лет.'
        now: '{staff} оставался с ним все лето в Дуино, и болезнь постепенно пошла на убыль. Осенью он поехал домой в Вену со своей семьей, снова преподавал и дожил до того, чтобы увидеть атомы, подтвержденные экспериментом.'
        who: 'boltzmann_duino'
        bio: 'В этом духе Больцман выздоровел осенью 1906 года, вернулся в Вену, преподавал еще несколько лет и стал свидетелем того, как эксперименты Перрена получили признание для атомов.'
    shift_all: 'Он знал, что его теория подтвердится, его болезнь облегчилась, и осенью он вернулся в Вену, чтобы преподавать.'
    vignettes:
      pebbles: 'В июле {staff} помогает маленькому сыну рыбака пересчитать ведро с галькой на пляже. Мальчик спрашивает, есть ли там вообще вещи, слишком маленькие, чтобы их можно было сосчитать. {staff} говорит, что они существуют независимо от того, считает их кто-нибудь или нет; мальчик думает об этом и бросает еще пригоршню.'
      nets: 'В начале июля {staff} помогает рыбаку донести сети, сохнущие на берегу. Словенские, итальянские, немецкие, говорит рыбак, их слышно повсюду в этой бухте, и рыбам все равно, в какую из них вы их проклинаете.'
      towels: 'В августе {staff} помогает горничной отеля принести полотенца, сушившиеся у моря. Вода в этом году прогрелась рано, говорит она, гости из города остаются весь сезон, а соль сдирает кожу с рук.'
  tesla_wardenclyffe:
    name: 'Строка с пометкой «проект»'
    place: 'Шорхэм, Лонг-Айленд'
    figure: 'Никола Тесла'
    story: 'В марте 1901 года Дж. Пирпон Морган согласился вложить 150 000 долларов в радиостанцию для Николы Теслы. Архитектор Стэнфорд Уайт спроектировал здания в Уорденклифе на Лонг-Айленде, и в том же году Тесла несколько раз писал ему о башне и лаборатории. Строительство началось в сентябре. В декабре Маркони услышал сигнал, посланный через Атлантику. Тесла перенес свою лабораторию в кирпичное здание в июне 1902 года; в июле 1903 года Морган написал, что больше не будет давать денег. Башня была взорвана в 1917 году.'
    story_prose:
      opening:
        - 'Уорденклиф, на северном берегу Лонг-Айленда, сентябрь 1901 года. Полгода назад Дж. Пирпон Морган согласился вложить 150 000 долларов в беспроводную станцию для изобретателя Николы Теслы, а архитектор Стэнфорд Уайт спроектировал здесь лабораторию и башню. Тесла означает башню для беспроводной связи и беспроводной передачи энергии.'
        - 'В истории в тот сентябрь предложения строителей оказались выше, чем ожидалось, Тесла несколько раз писал Уайту о башне и лаборатории, и чертежи менялись снова и снова; в декабре Маркони услышал сигнал, посланный через Атлантику; в июле 1903 года Морган написал, что больше не будет давать денег, и в 1917 году башня была взорвана. В этом филиале есть бригадир, сторож держит навес для досок на обрыве, а возчик тащит доски по песчаной дороге.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто хранил архивы или работал плотником, или кто-то умелый и методичный, чтобы отличить старые чертежи от исправленных и посмотреть, сколько стоит здание и башня; и кто-то, кто также может уговорить людей, чтобы помочь Тесле распределить деньги по частям.'
      outcomes:
        all: 'В июне 1902 года Тесла перенес свою лабораторию в кирпичное здание. В конце концов деньги все равно закончились, и две страницы счетов остались приколотыми к стене сарая, подведенной чертой под уплаченным отрезком.'
        p3: 'В конце концов денег все равно не хватило. Сайт окупил согласованный участок фундаментных работ, а предметы, за которыми не было денег, были перечислены на отдельной странице и закреплены за дверью сарая.'
        p2: 'В июне 1902 года Тесла перенес свою лабораторию в кирпичное здание. Ставки на башню менялись еще несколько раз, и каждую можно было сверить с предыдущей страницей.'
        p1: 'В июне 1902 года Тесла перенес свою лабораторию в кирпичное здание в Уорденклиффе и работал там до 1906 года. Лаборатория и башня сохранились до наших дней.'
      none: 'В июле 1903 года Морган написал, что больше не будет давать денег. Башня простояла на утесе более десяти лет и была взорвана в 1917 году; кирпичное здание все еще там.'
      desync: '19 сентября два комплекта чертежей лежали смешанными в одной куче, строители оценили работу по старым, и никто не мог сказать, какой комплект будет следовать. Когда {staff} был отозван, бригадир скатывал всю кучу и связывал ее бечевкой.'
      not_admitted: '{staff} так и не попал на это место и простоял всего несколько дней у песчаной тропы, ведущей к обрыву. Мимо проезжала телега с досками, колеса погружались в песок, и люди снова выталкивали их сзади.'
      points:
        p1:
          class_lettered: '19 сентября на длинном столе в сарае лежат два комплекта чертежей, заголовки совершенно одинаковые, а размеры не совпадают; строители оценили работу из старого набора намного выше, чем кто-либо ожидал. {staff}, привыкший к бумажной работе, отделяет старые чертежи от исправленных лист за листом, карандашом ставит дату под сгибом каждого, подписывает каждый комплект и прижимает их под двумя кирпичами. Бригадир берет исправленный комплект, некоторое время держит его на свету из окна, дважды складывает и засовывает в карман пиджака. Он выходит из сарая, вызывает обрыв и велит мужчинам принести штабели.'
          class_craft: '19 сентября на длинном столе в сарае лежат два комплекта чертежей, заголовки совершенно одинаковые, а размеры не совпадают; строители оценили работу из старого набора намного выше, чем кто-либо ожидал. {staff}, который работал с инструментами, измеряет размеры обоих наборов по точкам с помощью правила, отделяет старые чертежи от исправленных, пишет карандашом дату под сгибом каждого, подписывает каждый набор и прижимает их под двумя кирпичами. Бригадир берет исправленный комплект, некоторое время держит его на свету из окна, дважды складывает и засовывает в карман пиджака. Он выходит из сарая, вызывает обрыв и велит мужчинам принести штабели.'
          else: '19 сентября на длинном столе в сарае лежат два комплекта чертежей, заголовки совершенно одинаковые, а размеры не совпадают; строители оценили работу из старого набора намного выше, чем кто-либо ожидал. {staff}, ловкий и осторожный, сравнивает их лист за листом, отделяет старые рисунки от исправленных, карандашом ставит дату под сгибом каждого, подписывает каждый комплект и прижимает их под двумя кирпичами. Бригадир берет исправленный комплект, некоторое время держит его на свету из окна, дважды складывает и засовывает в карман пиджака. Он выходит из сарая, вызывает обрыв и велит мужчинам принести штабели.'
        p2:
          class_lettered: 'В конце сентября из офиса Уайта поступает еще одно предложение: здание и башня объединены в одну колонну. {staff}, привыкший к бумажной работе, копирует по пунктам лабораторную работу, уже согласованную в письмах, на отдельную страницу, перечисляет объекты башни, все еще ожидающие новых предложений, на второй странице и отправляет оба обратно Уайту для просмотра. Когда приходит ответ, бригадир прикрепляет две страницы к двум стенам сарая. Он стоит между ними, чтобы посмотреть, и проводит линию под страницей лаборатории.'
          class_craft: 'В конце сентября из офиса Уайта поступает еще одно предложение: здание и башня объединены в одну колонну. {staff}, который работал с инструментами и знает, что люди, укладывающие кирпичи, не являются людьми, которые возводят башню, выбирает элемент за элементом, уже согласованный в лабораторной работе, на отдельной странице, перечисляет элементы башни, все еще ожидающие новых предложений, на второй странице и отправляет оба обратно Уайту для просмотра. Когда приходит ответ, бригадир прикрепляет две страницы к двум стенам сарая. Он стоит между ними, чтобы посмотреть, и проводит линию под страницей лаборатории.'
          else: 'В конце сентября из офиса Уайта поступает еще одно предложение: здание и башня объединены в одну колонну. {staff}, зоркий глаз, видит два вида работ, смешанных в одном столбце, выбирает элемент за элементом уже согласованной лабораторной работы на отдельной странице, перечисляет элементы башни, все еще ожидающие новых заявок, на второй странице и отправляет оба обратно Уайту для просмотра. Когда приходит ответ, бригадир прикрепляет две страницы к двум стенам сарая. Он стоит между ними, чтобы посмотреть, и проводит линию под страницей лаборатории.'
        p3:
          class_lettered: 'В начале ноября стены кирпичного здания растут день ото дня, а основание башни все еще представляет собой выкопанный участок песка. Тесла приезжает из Нью-Йорка и переворачивает две страницы отчетов в сарае. {staff}, привыкший к бумажной работе, излагает подтвержденные затраты по месяцам в таблице и просит его внести поэтапные платежи своему покровителю с отдельным соглашением на следующий этап фундаментных работ. Тесла меняет пером две фигуры в таблице, складывает ее и вкладывает в конверт, адресованный Моргану. Он выходит из сарая, и ветер со стороны Звука поднимает поля его шляпы.'
          class_craft: 'В начале ноября стены кирпичного здания растут день ото дня, а основание башни все еще представляет собой выкопанный участок песка. Тесла приезжает из Нью-Йорка и переворачивает две страницы отчетов в сарае. {staff}, который работал с инструментами и знает, сколько месяцев и человек занимает этап работы от раскопок до каменной кладки, поэтапно излагает подтвержденные затраты в таблице и просит его внести поэтапные платежи своему спонсору с отдельным соглашением на следующий этап фундаментных работ. Тесла меняет пером две фигуры в таблице, складывает ее и вкладывает в конверт, адресованный Моргану. Он выходит из сарая, и ветер со стороны Звука поднимает поля его шляпы.'
          else: 'В начале ноября стены кирпичного здания растут день ото дня, а основание башни все еще представляет собой выкопанный участок песка. Тесла приезжает из Нью-Йорка и переворачивает две страницы отчетов в сарае. {staff}, методичный и убедительный, рассказывает ему о подтвержденных расходах одну за другой, складывает их в таблицу и просит внести поэтапные выплаты своему покровителю с отдельным соглашением на следующий этап фундаментных работ. Тесла меняет пером две фигуры в таблице, складывает ее и вкладывает в конверт, адресованный Моргану. Он выходит из сарая, и ветер со стороны Звука поднимает поля его шляпы.'
      excerpts:
