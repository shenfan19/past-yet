    vignettes:
      nails: '{staff} стоит в очереди в булочной. Идущий впереди гвоздезабивщик платит горстью гвоздей, булочник их пересчитывает и забирает. Спустя несколько недель {staff} этой весной читает в толстой книге, что в Шотландии есть деревня, где рабочие до сих пор несут в булочную гвозди вместо денег, и смеется над этой страницей.'
      post: '{staff} помогает перевозчику закрепить лондонскую почту. Один пакет предназначен для мистера Страхана, принтера, и он толще остальных; {staff} кладет его под остальные, чтобы дождь не попадал на него.'
      firth: '{staff} гуляет по песку во время отлива. За заливом Ферт-оф-Форт низко висит дым Эдинбурга, и женщина, собирающая поблизости мидии, говорит, что именно здесь живут умные люди.'
  beethoven_vienna:
    name: 'Девятая симфония'
    place: 'Вена'
    figure: 'Людвиг ван Бетховен'
    story: 'Весной 1824 года Бетховен, почти полностью глухой, готовил в Вене концерт своих новых произведений. Хор и оркестр репетировали отдельно, и до вечера было всего две полных репетиции. 7 мая 1824 года Девятая симфония была впервые исполнена в театре Кернтнертор под управлением капельмейстера театра Михаэля Умлауфа и Бетховена на сцене рядом с ним. Повторение 23 мая в огромном Редутенсале нарисовало худой дом, и квитанции его разочаровали.'
    story_prose:
      opening:
        - 'Вена, весна 1824 года. Бетховен почти полностью глух. Он готовит концерт своих новых произведений, который закроет Девятая симфония. То, что оркестр играет на репетиции, кто-то должен записать для него в беседку.'
        - 'В истории хор и оркестр репетировали в разных залах и впервые собрались вместе всего за два дня до премьеры. После премьеры 7 мая концерт снова состоялся 23-го числа в большом Редутенсале, при этом многие места были пусты, и расписки его разочаровали. В этом отделении еще не высохшие партии лежат под тяжестями на столе переписчиков, а за театром сопрано чешет горло и жалуется на высокие ноты в последней части.'
        - 'В этой поездке могут помочь три типа людей: кто-то, кто читает партитуру и может удерживать ритм, когда две группы впервые репетируют вместе, кто-то, кто слышит, что не так, и записывает это композитору по пунктам, и кто-то достаточно убедительный, чтобы продать места до того, как горожане уйдут.'
      outcomes:
        all: 'В ночь на 23 мая в зале еще было много свободных мест, но забронированные ряды в первых рядах были заняты. С тех пор список оставался в его разговорной книге.'
        p3: 'В ночь на 23 мая в зале еще было много свободных мест, но забронированные ряды были полны.'
        p2: 'В ночь премьеры каждая секция воспроизводила отмеченные записи в том виде, в котором они были отмечены. После этого листок так и остался в его дневнике разговоров.'
        p1: 'Вечером 7 мая хор и оркестр заиграли в одном ритме. Бетховен стоял рядом с Умлауфом, спиной к публике.'
      none: 'В зале 23 мая ряды пустых стульев стояли аккуратными рядами под лампами.'
      desync: 'На совместной репетиции 5 мая обе стороны так и не пришли вместе. Когда {staff} был отозван, до премьеры оставалось два дня, а музыканты в оркестре все еще спорили о том, какой бит вступить.'
      not_admitted: '{staff} никогда не попадал за кулисы театра. Хор и оркестр все еще репетировали в своих отдельных комнатах, а до премьеры оставалось всего несколько дней.'
      points:
        p1: '5 мая хор и оркестр впервые собрались в одном зале. В первых тактах каждая сторона действовала со своей скоростью. {staff} стоял между оркестром и хором и отбивал время по партитуре, такт за тактом, на виду у обоих. Они пошли снова, и на последнем ударе обе стороны вышли вместе. Бетховен стоял в углу, ничего не слыша, и видел только, что каждый поклон и каждый рот замолчали в одно и то же мгновение.'
        p2: 'В день генеральной репетиции {staff} скопировал на один лист записи, которые пошли не так на совместной репетиции накануне, отметив, какая часть, какой такт и что отключено, и передал его Бетховену. Он долго держал листок у глаз и в нескольких местах делал пометки ручкой. Когда он вернул его обратно, на отметках были следы.'
        p3: 'В конце мая богатые семьи города начали отправлять свои чемоданы в деревню. {staff} ходил с программой от двери к двери. В одном доме управляющий лишь наполовину открыл дверь и сказал, что его хозяин уезжает послезавтра. {staff} развернул программу, указал на строчку с Девятой симфонией и сказал, что написавший ее человек уже не слышит. Стюард взял листок внутрь и вернулся с запиской о залоге. В тот же вечер список забронированных мест был доставлен на квартиру Бетховена. Он положил листок под свой разговорник и прочел имена одно за другим, а когда дошел до последнего, снова прочитал их сверху.'
      excerpts:
        p3: 'В тот же вечер список забронированных мест был доставлен на квартиру Бетховена. Он положил листок под свой разговорник и прочел имена одно за другим, а когда дошел до последнего, снова прочитал их сверху.'
        p2: 'Он долго держал листок у глаз и в нескольких местах делал пометки ручкой. Когда он вернул его обратно, на отметках были следы.'
        p1: 'Они пошли снова, и на последнем ударе обе стороны вышли вместе. Бетховен стоял в углу, ничего не слыша, и видел только, что каждый поклон и каждый рот замолчали в одно и то же мгновение.'
    relic: 'Слуховой рожок'
    relic_desc: 'Рожок, который он подносил к уху, когда мир вокруг постепенно затихал.'
    points:
      p1: 'Соберите отдельно репетируемый хор и оркестр на первой совместной репетиции и защитите премьеру Девятого оркестра.'
      p2: 'Оставьте Бетховену письменный отчет о совместной репетиции, чтобы он мог ответить до концерта.'
      p3: 'Закрепите заранее блоки мест, прежде чем слушатели покинут Вену, и сохраните чеки на второй концерт.'
    points_fail:
      p1: 'При входе группы теряют свои места, а на премьере выпадает отрывок. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Исполнители отмечают свои партии отдельно, и проблемы с репетицией никогда не доходят до композитора на рассмотрение.'
      p3: 'Повторение происходит после сезона. Слишком много мест пусто, чтобы Бетховен смог добиться того возвращения, на которое он надеялся.'
    shift:
