    relic: 'Копия чертежа'
    relic_desc: 'Копия листа плана Уорденклифа, сложенная вдвое, с датой, написанной карандашом под сгибом.'
    points:
      p1: 'Когда сентябрьские предложения станут высокими, зарегистрируйте оригинальные и исправленные чертежи отдельно в Wardenclyffe, чтобы работа могла начаться в этом году.'
      p2: 'Составьте белый список уже согласованных лабораторных работ, кроме работ по башне, все еще ожидающих предложений, и дайте бригадиру отдельный отчет по каждой из них.'
      p3: 'Помогите Tesla предложить поэтапные платежи, используя подтвержденные затраты, с собственными обязательствами по следующему этапу фундаментальных работ.'
    points_fail:
      p1: 'Подрядчики ссылаются на устаревшие чертежи, и никто не может подтвердить размеры. Работа отменяется на сезон, и офис отзывает сотрудника.'
      p2: 'Одна цитата объединяет здание и башню в одно целое. Позже экипаж не сможет увидеть, какая часть уже была разрешена.'
      p3: 'Оба комплекса работ по-прежнему зависят от одного и того же раунда финансирования. Когда денег не хватает, бригада не может сказать, за какую работу будут платить.'
    shift:
      p1:
        was: 'Тесла и Стэнфорд Уайт обсуждали предложения и проекты в 1901 году. В том же году началось строительство в Уорденклиффе.'
      p2:
        was: 'Уорденклиф включал в себя лабораторное здание и башню. В переписке фиксируются изменения в проектах и бюджетах.'
        now: 'Прежде чем начать, бригадир может оплатить два счета отдельно. Цену новой башни можно сравнить с предыдущей оценкой.'
      p3:
        was: 'Морган предоставил первоначальное финансирование. Позже финансирование прекратилось, и проект не пошел так, как первоначально предполагалось.'
        now: 'Письменное соглашение охватывает подтвержденный участок. Когда позже средства закончатся, сайт может оплатить этот счет и четко определить работу, которая все еще не профинансирована.'
        who: 'tesla_wardenclyffe'
        bio: 'Тесла рассматривал Уорденклифф как часть системы беспроводной связи и энергоснабжения. Для превращения его в сайт также потребовались заявки, финансирование и графики строительства.'
    vignettes:
      timber: 'В начале октября {staff} помогает возчику доставить груз досок по песчаной дороге к площадке, подставляя одно плечо под задний борт каждый раз, когда колеса проваливаются. Возчик говорит, что фермеры дальше по дороге начали определять время содержания кур по забиванию молотком, и лучше всего они несутся в те дни, когда во дворе тихо.'
      signal: 'В середине декабря со станции подходит мальчик и размахивает бумагой: Маркони услышал сигнал из-за океана. Бригадир держит страницу на расстоянии вытянутой руки и спрашивает {staff}, действительно ли точка может зайти так далеко. {staff} говорит, что можно, и бригадир складывает бумагу в пальто и приказывает людям продолжать забивать молотком.'
      watch: 'В конце декабря {staff} ночует со сторожем в дощатом сарае на утесе, засовывая старые газеты в щели, чтобы защититься от ветра со стороны Саунда. Сторож зачитывает цену угля у одного из них и говорит, что такая высокая башня стоит того.'
  schubert_vienna:
    name: 'Программа мартовского концерта'
    place: 'Вена'
    figure: 'Франц Шуберт'
    story: '26 марта 1828 года, единственный раз в жизни, Франц Шуберт дал публичный концерт своих произведений в залах Общества друзей музыки в Вене. Осенью, уже больной, он переехал в новую квартиру своего брата Фердинанда в Видене. 2 октября он предложил свои последние три фортепианные сонаты издателю Пробсту. Он умер в этой квартире 19 ноября в возрасте тридцати одного года. Сонаты вышли только в 1839 году, уже с другим посвящением.'
    story_prose:
      opening:
        - 'Вена, март 1828 года. Тридцатиоднолетний композитор Франц Шуберт написал более шестисот песен, не считая симфоний и камерной музыки, и лишь немногие из них были опубликованы или широко исполнялись. В этом месяце, с помощью друзей и исполнителей, он должен дать концерт, состоящий только из собственных произведений, в залах Общества друзей музыки 26 марта.'
        - 'В истории это был единственный его собственный концерт, который он когда-либо давал. К осени он заболел и в сентябре переехал в новую квартиру своего брата Фердинанда в Видене; 2 октября он написал лейпцигскому издателю Пробсту письмо с предложением своих последних трех фортепианных сонат, которые он намеревался посвятить композитору, которым он восхищался, но Пробст ими не интересовался; 19 ноября он умер у своего брата. Сонаты вышли только в 1839 году, посвященные Роберту Шуману. В этом отделении общества есть швейцар, который расставляет стулья, в винном саду за стенами есть скрипач, а в новом доме в Видене есть хозяйка.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает музыку и имеет твердые руки, или кто-то методичный или способный с сильной волей сплотить людей, чтобы собрать наспех собравшихся музыкантов и зал в один вечер; очень хороший музыкант или кто-то, кто хранит архивы, переводит или продает книги, быстро и стабильно, чтобы договориться об отправке сонат с издателем; кто-то, несущий наноаптечку, чтобы вылечить болезнь, которую век не мог вылечить.'
      outcomes:
        all: 'В том ноябре Шуберт не заболел. Ответ пришел из Лейпцига, и он сохранил его в рукописях трех сонат, на первой странице которых было написано имя человека, для которого он их предназначал.'
        p3: 'В том ноябре Шуберт не заболел. Когда наступила зима, под окном комнаты в Видене стоял небольшой столик для сочинения музыки, в углу которого тяготилась стопка свежей рукописной бумаги.'
        p2: '19 ноября Шуберт умер у своего брата в возрасте тридцати одного года. Очистив комнату, Фердинанд достал из ящика письмо из Лейпцига и положил его вместе с рукописями трех сонат.'
        p1: '19 ноября Шуберт умер у своего брата в возрасте тридцати одного года. Приглашение на вечер 26 марта было позже напечатано в воспоминаниях друга.'
      none: '19 ноября Шуберт умер в квартире своего брата в Видене в возрасте тридцати одного года. Фердинанд хранил рукописи трех сонат, и они не печатались одиннадцать лет.'
      desync: 'Вечером 25 марта у игроков и свободного зала все еще были разные дни, и швейцар перелистывал страницы журнала, не находя, чье имя принадлежит против 26-го числа. Когда был отозван {staff}, носильщик складывал расставленные им стулья спиной к стене.'
      not_admitted: '{staff} никогда не входил в этот круг друзей и лишь несколько вечеров сидел в винном саду за стенами. Однажды кто-то за соседним столиком начал напевать песню, сказал, что ее написал человек по имени Шуберт, и на середине потерял слова.'
      points:
        p1:
          trait_methodical: '25 марта до концерта остался один день. Зал общества вечером 26-го числа свободен, но у одного из игроков, обещавших помочь, в голове неправильный день. {staff} методично составляет список, стучится в дверь каждого игрока по очереди, сверяет день и час с каждым из них и просит их подписать список, затем возвращается в общество и просит швейцара записать имя Шуберта против этого вечера в журнале. Еще до наступления темноты Шуберт приходит посмотреть в зал. Он стоит некоторое время среди рядов пустых стульев, затем протягивает руку и поправляет криво поставленный стул в первом ряду.'
          trait_charismatic: '25 марта до концерта остался один день. Зал общества вечером 26-го числа свободен, но у одного из игроков, обещавших помочь, в голове неправильный день. {staff}, настойчиво, обходит каждого из игроков и переговаривает того, у кого был неправильный день, на вечер 26-го числа, затем возвращается к обществу и просит швейцара записать в журнале имя Шуберта напротив того вечера. Еще до наступления темноты Шуберт приходит посмотреть в зал. Он стоит некоторое время среди рядов пустых стульев, затем протягивает руку и поправляет криво поставленный стул в первом ряду.'
          else: '25 марта до концерта остался один день. Зал общества вечером 26-го числа свободен, но у одного из игроков, обещавших помочь, в голове неправильный день. {staff}, знающий музыку, раскладывает партии на столе швейцара, обсуждает программу и час с каждым исполнителем и просит швейцара записать в реестре имя Шуберта против вечера 26-го числа. Еще до наступления темноты Шуберт приходит посмотреть в зал. Он стоит некоторое время среди рядов пустых стульев, затем протягивает руку и поправляет криво поставленный стул в первом ряду.'
        p3:
          class_medical: 'В конце августа болезнь Шуберта снова обострилась, и он плохо спит по ночам. {staff}, знающий медицину, открывает принесенную с собой наноаптечку, использует ее, как сказано в инструкции, и после этого заглядывает к нему каждое утро и вечер. В день переезда Шуберт сам несет охапку музыки по лестнице нового дома в Видене до самого верха, не останавливаясь. Он ставит музыку под окном новой комнаты и распахивает окно.'
