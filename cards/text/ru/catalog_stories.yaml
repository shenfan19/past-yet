        p3: 'В ночь на 5 октября в зарешеченной комнате догорает единственная лампа. По разговаривает со стеной, садится, снова ложится и не прикасается к воде, поднесенной к его губам. {staff}, знающий медицину, сидит у кровати и время от времени измеряет пульс, и всякий раз, когда он замолкает, подносит край чашки ко рту, чтобы сделать небольшой глоток. На рассвете По засыпает. Несколько дней спустя он садится один, просит чашку воды, выпивает ее, держа ее в руках, и ставит чашку обратно на подоконник.'
