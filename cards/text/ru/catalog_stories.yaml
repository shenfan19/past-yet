    place: 'Сеул'
    figure: 'Седжон и учёные'
    story: 'В 1443 году король Чосон Седжон составил двадцать восемь букв для корейского письма. Во втором месяце 1444 года Чхве Манри из Зала Достойных отправил мемориал вместе с шестью коллегами, выразившими возражения. Новые буквы были обнародованы в 1446 году как Хунминджонгым, правильные звуки для обучения людей. Седжон умер в 1450 году.'
    relic: 'Деревянная печатная доска с буквами'
    relic_desc: 'На деревянной доске вырезаны первые буквы. С неё уже можно печатать.'
    points:
      p1: 'В дни поминовения сохраните черновой вариант перевода сборника рифм «Юньхуэй» на новые буквы в зале совета, чтобы работа продолжалась.'
      p2: 'Пусть он своими глазами увидит, как человек, который никогда не ходил в школу, пишет свое имя новыми буквами.'
      p3: 'В Чочжоне облегчите его глаза, чтобы он все еще мог ясно видеть новые буквы.'
    points_fail:
      p1: 'В те дни черновик был разбросан, работы остановились, а новые буквы потеряли свое первое применение.'
      p2: 'В этой ветке до обнародования он ни разу не видел, чтобы кто-нибудь из народа использовал новые буквы.'
      p3: 'Он вернулся во дворец с глазами не лучше, как и в истории.'
    shift:
      p1:
        was: 'Во втором месяце 1444 года работа Зала Достойных по переводу книги рифм Юньхуэй на новые буквы продолжалась.'
      p2:
        was: 'В 1446 году новые буквы были провозглашены Хунминджоным, а четыре года спустя Седжон умер.'
        now: 'Продавщица ларька возле передвижного дворца в Чочжоне научилась писать свое имя, и кто-то сообщил об этом в суд.'
      p3:
        was: 'Седжон много лет страдал от глаз, весной 1444 года отправился в Чочжон, чтобы выздороветь, с тех пор стал слабеть и умер в 1450 году.'
        now: 'Незнакомец у источников в Чочжоне немного улучшил его зрение, и когда он тем летом вернулся во дворец, он все еще мог сам читать мемориалы и корректуры новых писем.'
    vignettes:
      gesture: '{staff} наблюдает, как ученый формирует губы перед тем, как нарисовать букву, и копирует форму рта на полях рядом с ней.'
      spacing: '{staff} разбивает лист на квадраты так, чтобы части каждого слога располагались вместе в одном квадрате, и оставляет его на столе без слова.'
      lesson: '{staff} рисует палочкой на пыли три буквы для ребенка на рынке, и ребенок читает их вслух, прежде чем убежать.'
    story_prose:
      opening:
        - 'Сеул, 1443 год. Седжон написал двадцать восемь новых букв. На корейском можно говорить вслух, но чтобы записать слова в рот, сначала нужно выучить сценарий, очень непохожий на то, как говорят. Седжон хочет, чтобы на листе бумаги можно было писать повседневную речь.'
        - 'Исторически сложилось так, что во втором месяце 1444 года ученые Зала Достойных выдвинули совместный мемориал против новых букв, в то время как работа во дворце по переводу книг на них была наполовину завершена. Той весной Седжон отправился в Чочжон, чтобы дать отдых глазам, и с тех пор его здоровье ухудшалось год от года. В этом филиале также есть продавщица возле передвижного дворца в Чочжоне, которая ведет свои счета в чистоте, но всякий раз, когда ей нужно подписать, она передает кисть кому-то другому.'
        - 'В этой поездке могут помочь три типа людей: кто-то, кто сможет сохранить бумаги в безопасности, кто-то, кто готов научить человека читать штрих за штрихом, и тот, кто знает медицину и подскажет правильное лекарство.'
      outcomes:
        all: 'Тем летом, когда Седжон вернулся во дворец, он все еще ясно видел буквы. Лист, подписанный владельцем ларька, он никому не позволил забрать; оно лежало поверх корректур новых писем.'
        p2: 'За пределами передвижного дворца в Чочжоне, в конце бухгалтерской книги, рука впервые принадлежала владельцу ларька.'
        p3: 'Вернувшись во дворец тем летом, Седжон все еще мог сам читать мемориалы. Корректуры новых писем он перелистывал страницу за страницей, до последней.'
        p1: 'Лампы Зала Достойных снова зажглись. Юньхуэй в новых письмах накапливался страница за страницей.'
      none: 'Вернувшись в офис, {staff} до сих пор помнит момент, когда владелец ларька протянул кисть: рука протянулась, на мгновение остановилась в воздухе и только потом отдала кисть кому-то другому.'
      desync: 'После мемориала страницы новых писем разбросаны по полу зала совета, и никто их не подобрал. Когда {staff} был отозван, верхняя страница занимала половину размера.'
      not_admitted: '{staff} не мог оставаться достаточно долго, чтобы научить владельца ларька новым буквам. Она перевернула еще одну страницу своих отчетов, а газета все еще ждала, пока кто-нибудь еще подпишется за нее.'
      points:
        p1: 'В дни поминовения люди приходили и уходили в зал совета, и никто не думал о страницах на столе. {staff} разложил страницы Юнхуэй по новым буквам в нужном порядке и установил на них пресс-папье. Несколько дней спустя ученые Холла вернулись и подняли пресс-папье. Верхняя страница была тем самым местом, куда они положили кисти.'
        p2:
          class_teaching: '{staff} училась по старому методу: сначала просила ее произнести свое имя вслух, а затем записать каждый звук в виде буквы. Возле передвижного дворца в Чочжоне хозяйка ларька медленно произнесла свое имя и написала на бумаге вслед за звуками. Когда последний штрих был нанесен, она перевернула лист вверх, прижала его пальцем и поочередно касалась каждой буквы. Позже этот лист был отправлен в путевой дворец, и Седжон держал его перед глазами, долго смотрел на него и не позволил никому его забрать.'
          else: '{staff} каждый день какое-то время сидела с ней, прежде чем она закрывала свою кабинку, никогда не торопила ее, и всякий раз, когда штрих шел криво, она заставляла ее писать это снова. Возле передвижного дворца в Чочжоне хозяйка ларька медленно произнесла свое имя и написала на бумаге вслед за звуками. Когда последний штрих был нанесен, она перевернула лист вверх, прижала его пальцем и поочередно касалась каждой буквы. Позже этот лист был отправлен в путевой дворец, и Седжон держал его перед глазами, долго смотрел на него и не позволил никому его забрать.'
        p3: 'В Чочжоне {staff} каждый день осматривал глаза Седжона, корректируя дозу лекарства и промывания по мере их изменения. Вернувшись во дворец, Седжон держал перед глазами доказательство новых букв. Буквы были маленькими, и он читал медленно; когда пришло время перевернуть страницу, он никого не позвал, а сам протянул руку и перевернул ее.'
      excerpts:
        p2: 'Когда последний штрих был нанесен, она перевернула лист вверх, прижала его пальцем и поочередно касалась каждой буквы. Позже этот лист был отправлен в путевой дворец, и Седжон держал его перед глазами, долго смотрел на него и не позволил никому его забрать.'
        p3: 'Вернувшись во дворец, Седжон держал перед глазами доказательство новых букв. Буквы были маленькими, и он читал медленно; когда пришло время перевернуть страницу, он никого не позвал, а сам протянул руку и перевернул ее.'
        p1: 'Несколько дней спустя ученые Холла вернулись и подняли пресс-папье. Верхняя страница была тем самым местом, куда они положили кисти.'
  basho_hiraizumi:
    name: 'По узкой тропе на дальний север'
    place: 'Хираидзуми, Япония'
    figure: 'Мацуо Басё'
    story: 'Весной 1689 года Мацуо Басё отправился из Эдо со своим учеником Сорой в долгую прогулку по северу. На тринадцатый день пятого месяца они отправились из Ичиносеки в Хираидзуми и через день вернулись обратно: они поднялись на Такадати над рекой Китаками, управляющий показал им Золотой зал Тюсондзи, а Зал Сутры остался закрытым, потому что его не было. Басё повернул путешествие на Узкую дорогу на Глубокий Север, где посетитель читает стихи о летних травах и говорит, что оба зала были открыты.'
    story_prose:
      opening:
        - 'Ичиносеки, на севере Японии, лето 1689 года. Мацуо Басё и его ученик Сора покинули Эдо более месяца назад. На тринадцатый день пятого месяца небо прояснилось, и они собираются пройти два ри до Хираидзуми, чтобы увидеть старые руины и вернуться в тот же день. Позже это путешествие стало «Узкой дорогой на Глубокий Север».'
        - 'Исторически сложилось так, что в тот день хранитель показал им Золотой зал, а Зал Сутры остался закрытым, потому что его не было. Сора записал это в своем дневнике как есть; Позже Басё написал в своей книге, что оба зала были открыты. В этом филиале хозяин их квартиры в Ичиносеки нагревает ванну к возвращению своих гостей, а носильщик на углу улицы говорит, что дороги на север сплошь грязные.'
        - 'В этой поездке могут помочь два типа людей: тот, кто помнит дорогу и соблюдает часы, и тот, кто готов спросить, что разрешено, и найти человека, который покажет дорогу.'
      outcomes:
        all: 'В тот вечер Басё повесил свою шляпу у двери дома в Ичиносеки, вся в пыли. Позже, когда он писал отрывок Хираидзуми, в нем была балка, которую он видел собственными глазами сквозь щели решетки.'
        p2: 'Позже, когда Басё написал отрывок о Хираидзуми, в нем была балка, которую он видел собственными глазами через щели решетки.'
        p1: 'Еще до наступления темноты они вернулись в Ичиносеки. Шляпа висела у двери, вся в пыли.'
      none: 'Старые руины Хираидзуми постепенно темнели в сумерках. Дверь Зала Сутры оставалась закрытой.'
      desync: 'За развилкой солнце уже стояло низко, а до Хираидзуми они были еще далеко. {staff} был отозван офисом прежде, чем они смогли вернуться в Ичиносеки.'
      not_admitted: '{staff} не смог поспеть за двумя путешественниками. На углу улицы Ичиносеки две соломенные шляпы уже вышли из города.'
      points:
        p1: 'Из Ичиносеки дорога дважды раздваивалась. {staff} сверил каждую остановку с этапами, которые Сора записал в своем блокноте, и заранее сообщил им двоим, где повернуть и к какому часу они должны вернуться назад. Басё кивнул и потуже завязал шнурок шляпы. Когда солнце село низко, они уже были на обратном пути в Ичиносеки.'
        p2:
          class_lettered: 'Как и при поиске записей, {staff} сначала спросил, в какой день ушел хранитель и кто присматривает за ним, а затем в какую часть внешней галереи могут ходить посетители. Старик, находившийся неподалеку, отложил работу и повел их по галерее в сторону Зала Сутры. Дверь все еще была закрыта, но сквозь щели решетки можно было видеть балки внутри. Басё долго стоял молча, а Сора наклонил голову и добавил строчку в свой блокнот.'
          else: '{staff} подождал некоторое время перед залом, а затем по одному спросил соседей, когда вернется смотритель и в какую часть внешней галереи могут ходить посетители. Старик, находившийся неподалеку, отложил работу и повел их по галерее в сторону Зала Сутры. Дверь все еще была закрыта, но сквозь щели решетки можно было видеть балки внутри. Басё долго стоял молча, а Сора наклонил голову и добавил строчку в свой блокнот.'
      excerpts:
        p2: 'Дверь все еще была закрыта, но сквозь щели решетки можно было видеть балки внутри. Басё долго стоял молча, а Сора наклонил голову и добавил строчку в свой блокнот.'
        p1: 'Басё кивнул и потуже завязал шнурок шляпы. Когда солнце село низко, они уже были на обратном пути в Ичиносеки.'
    relic: 'Соломенная шляпа'
    relic_desc: 'Тканая шапка серая от дождя.'
    points:
      p1: 'Проверьте обратный маршрут Соры и поворотные моменты, чтобы двое путешественников могли посетить Хираидзуми в один день.'
      p2: 'Когда смотрителя нет, выясните, кто может показать посетителям внешний вид. Спросите, что им разрешено увидеть, прежде чем передать маршрут двум путешественникам.'
    points_fail:
      p1: 'Поворот отправляет обоих путешественников не в ту сторону. К моменту нахождения подхода возврат сделать не могут, и офис отзывает сотрудника.'
      p2: 'Никто не знает, когда вратарь вернется. Двое выходят наружу, и вход остается закрытым.'
    shift:
      p1:
        was: 'В дневнике Соры записано путешествие из Ичиносеки в Хираидзуми и обратно в тот день, тринадцатый день пятого лунного месяца 1689 года.'
      p2:
        was: 'В тринадцатый день пятого месяца 1689 года Сора записал, что управляющий показал им Золотой Зал, но Зал Сутры остался закрытым, потому что его не было; Позже Басё написал, что оба зала были открыты.'
        now: 'Местный гид подтверждает, что они могут обойти Зал Сутры, и показывает его с разрешенной стороны. Басё возвращается с подробностями здания, которое он видел сам.'
        who: 'basho_hiraizumi'
        bio: 'У Басё и Соры была только часть дня для Хираидзуми. В более поздней книге и в маршрутных заметках Соры на странице написано разное.'
    vignettes:
      grass: '{staff} следует за двумя путешественниками вверх по Такадачи. Внизу течет Китаками, а трава достигает пояса. Старший расстилает шляпу на земле и долго сидит, не говоря ни слова, младший что-то пишет в блокноте, а {staff}, не любящий говорить, смотрит вместе с ними на реку.'
      bath: '{staff} помогает хозяину дома в Ичиносеки носить воду и нагревать ванну. Он говорит, что двое гостей сегодня отправились в Хираидзуми и вернутся в поту; он видел множество путешественников, возвращавшихся из старых руин в слезах, и об этом заботится баня.'
      sandal: '{staff} помогает мужчине на углу улицы в Ичиносеки починить ремешок сандалий. Проходящий носильщик говорит, что на этой неделе дороги на севере покрыты грязью, и всем, кто собирается идти, лучше надеть новые сандалии, прежде чем отправляться в путь.'
  tagore_santiniketan:
    name: 'Одно стихотворение, два чтения'
    place: 'Шантиникетан, Индия'
    figure: 'Рабиндранат Тагор'
    story: 'В ноябре 1912 года в Лондоне вышла английская «Гитанджали», собственная прозаическая обработка его бенгальских песен Рабиндраната Тагора. 13 ноября 1913 года Шведская академия вручила ему Нобелевскую премию по литературе. Десять дней спустя в его школу в Шантиникетане прибыл целый поезд доброжелателей из Калькутты; в своем ответе он сказал, что не может без робости принять честь, оказанную от имени страны, и многие гости разошлись домой обиженными. Призовые деньги пошли в школу, которая в 1921 году стала университетом Вишва-Бхарати.'
    story_prose:
      opening:
        - 'Шантиникетан в Бенгалии, ноябрь 1913 года. Поэт Рабиндранат Тагор руководит здесь школой. Год назад в Лондоне вышла английская «Гитанджали», его собственная прозаическая обработка его бенгальских песен; 13 ноября Шведская академия вручила ему Нобелевскую премию по литературе, первую премию, вручаемую писателю из-за пределов Европы.'
        - 'В истории десять дней спустя поезд привез доброжелателей из Калькутты; в своем ответе он сказал, что не может без робости принять честь, оказанную от имени страны, многие гости вернулись домой ранеными, и с тех пор между ним и многими его соотечественниками возникла дистанция. В этом филиале школы есть мальчик, который лазает по манговым деревьям, и повар, который хранит рис, а один из гостей оставляет на станции свой зонтик.'
        - 'В этой поездке могут помочь несколько типов людей: тот, кто преподавал, работал в новостях или сопровождал посетителей и знает, как вступить в разговор с людьми; кто-то нежный и уравновешенный, обладающий достаточной волей; или кто-то, несущий золотое яблоко. Как только прием заканчивается, гости уже идут на вокзал.'
      outcomes:
        all: 'Гости того вечера вернулись в Калькутту на ночном поезде. В последующие годы люди приезжали из города в Шантиникетан одна за другой, и в 1921 году школа стала университетом Вишва-Бхарати.'
        p1: 'Гости того вечера вернулись в Калькутту на ночном поезде. В последующие годы люди приезжали из города в Шантиникетан одна за другой, и в 1921 году школа стала университетом Вишва-Бхарати.'
      none: 'В сумерках 23 ноября гости ждали поезда на станции Болпур, и на платформе никто не разговаривал. После того, как поезд ушел, скамейки все еще стояли под манговыми деревьями, ни одну из них не убрали.'
