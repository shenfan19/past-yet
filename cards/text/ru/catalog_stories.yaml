  vermeer_delft:
    name: 'Художник в долгах'
    place: 'Делфт'
    figure: 'Ян Вермеер'
    story: 'После войны 1672 года Иоганн Вермеер с трудом мог продать картину и в июле 1675 года отправился в Амстердам, чтобы занять тысячу гульденов. В декабре 1675 года, как позже писала его вдова, за полтора дня он превратился из здорового в мертвого; он был похоронен в Делфте 15 декабря в возрасте сорока трех лет, оставив одиннадцать детей. В начале 1676 года Катарина Болнес отдала две его картины булочнику в счет долга за хлеб, а 24 февраля передала «Искусство живописи» своей матери Марии Тинс. 29 февраля дом прошел инвентаризацию, а в апреле она обратилась в Высокий суд с просьбой избавить ее от долгов.'
    story_prose:
      opening:
        - 'Ауде Лангендейк в Делфте, начало декабря 1675 года. Здесь живет сорокатрехлетний художник Ян Вермеер со своей женой Катариной Болнес и одиннадцатью детьми. Он рисует тихие комнаты в мягком свете, и сохранилось только около сорока его картин. После войны 1672 года художественная торговля пришла в упадок: его собственные работы почти не продаются, а купленные им для торговли картины других мастеров остались у него на руках. В июле он поехал в Амстердам, чтобы занять тысячу гульденов.'
        - 'В истории, как позже писала Катарина, под тяжестью детей и долгов он за полтора дня превратился из здорового в мертвого и был похоронен 15 декабря. В начале следующего года она отдала две его картины булочнику в обмен на три года хлеба, 24 февраля передала «Искусство живописи» из его студии своей матери Марии Тинс, а в апреле обратилась в Высокий суд с просьбой избавить ее от долгов. В течение почти двух столетий после этого его имя было почти забыто. В этом филиале мальчик-пекарь сдает хлеб бесплатно и только делает пометку в своей книжке, есть рамщик, а на рыночной площади женщина торгует торфом.'
        - 'В этой поездке могут помочь несколько типов людей: тот, кто хранит архивы, занимается антиквариатом или реставрирует картины, тот, кто рисует, читает корректуру или переводит и имеет внимательный глаз, или кто-то бдительный или методичный с сильной волей, чтобы защитить большую картину в студии; кто-то, кто торговал и ему повезло, или кто-то бойкий и дома на улице, чтобы продать картины, оставшиеся у него на руках; кто-то, кто разбирается в живописи, или чувствителен, или добр, чтобы рассказать ему, что станет с его картинами; врач с сильной волей, кто-то, кто знает медицину и носит с собой пластырь успокоения, или кто-то с наноаптечкой, чтобы продержаться эти полтора дня в середине декабря.'
      outcomes:
        all: 'Той зимой Вермеер не затонул. В ясный январский день он поднялся по лестнице, чтобы снова рисовать; большая картина все еще висела на стене мастерской, а в кухонном шкафу лежала небольшая пачка денег, завернутая в ткань.'
        p4: 'Прошел декабрь, а Вермеер не обанкротился. В ясный январский день он снова поднялся по лестнице и передвинул мольберт к окну.'
        p2: '15 декабря Вермеер был похоронен в Делфте в возрасте сорока трех лет. Деньги от картин, проданных в этом месяце, Катарина хранила завернутую в ткань в кухонном шкафу.'
        p3: '15 декабря Вермеер был похоронен в Делфте в возрасте сорока трех лет. Мольберт в мастерской стоял пустой, а палитра лежала в стороне, свежая синева на ней высохла.'
        p1: '15 декабря Вермеер был похоронен в Делфте в возрасте сорока трех лет, оставив одиннадцать детей. В феврале следующего года Катарина передала большую картину из студии своей матери.'
      none: '15 декабря Вермеер был похоронен в Делфте в могиле, которую его теща купила много лет назад, в возрасте сорока трех лет. Спустя почти два столетия мало кто знал его имя.'
      desync: '3 декабря человек кредитора проверил список, кивнул и приказал снять с гвоздя большую картину на стене. Когда {staff} был отозван, двое мужчин несли его вниз, и его синий цвет вспыхнул один раз на повороте лестницы.'
      not_admitted: '{staff} так и не проник в дом на Ауде Лангендейк и лишь несколько дней стоял на краю рыночной площади. Ставни в этом доме всегда были полузакрыты, и ребенок, облокотившись на подоконник, считал проходящие мимо корзины с хлебом.'
      points:
        p1:
          trait_vigil: 'Утром 3 декабря в студию приходит человек, посланный кредитором, со списком, говорит, что некоторые картины должны быть погашены в счет долга до конца года, и указывает на большую картину на стене: художник, спиной к нам, рисует женщину в синем, держащую книгу и трубу. {staff}, бдительный, спит две ночи, бегая по лестнице возле мастерской, а днем перебирает список мужчины построчно: что может пойти в счет долга, так это запас картин других мастеров из магазина, а этой в нем нет. Мужчина сворачивает свой список и уходит. Вермеер некоторое время стоит перед картиной, затем протягивает руку и стирает пленку пыли с нижней части рамы.'
          trait_methodical: 'Утром 3 декабря в студию приходит человек, посланный кредитором, со списком, говорит, что некоторые картины должны быть погашены в счет долга до конца года, и указывает на большую картину на стене: художник, спиной к нам, рисует женщину в синем, держащую книгу и трубу. {staff} методично просматривает мужской список построчно и выписывает страницу, откуда взялась каждая картина в мастерской: что может пойти в счет долга, так это запас картин других мастеров из магазина, а этой в нем нет. Мужчина сворачивает свой список и уходит. Вермеер некоторое время стоит перед картиной, затем протягивает руку и стирает пленку пыли с нижней части рамы.'
          else: 'Утром 3 декабря в студию приходит человек, посланный кредитором, со списком, говорит, что некоторые картины должны быть погашены в счет долга до конца года, и указывает на большую картину на стене: художник, спиной к нам, рисует женщину в синем, держащую книгу и трубу. {staff}, привыкший к картинам и делам, перебирает список мужчины построчно и показывает, что в счет долга может пойти запас картин других мастеров из магазина, а этой в нем нет. Мужчина сворачивает свой список и уходит. Вермеер некоторое время стоит перед картиной, затем протягивает руку и стирает пленку пыли с нижней части рамы.'
        p2:
          class_trade: '6 декабря – базарный день. Некоторые картины других мастеров, завернутые в ткань, годами стояли за дверью магазина. {staff}, который торговал, выносит их по одному на свет окна и с утра до полудня разговаривает с двумя пришедшими посмотреть дилерами, уступая немного цене, а потом ни на дюйм больше. Днем из двери на плечах мужчин выносят три картины, перевязанные бечевкой. Катарина дважды пересчитывает деньги на кухонном столе, откладывает небольшую стопку, заворачивает в ткань и кладет в карман фартука.'
          else: '6 декабря – базарный день. Некоторые картины других мастеров, завернутые в ткань, годами стояли за дверью магазина. {staff}, бойкий, обходит рынок и возвращается с двумя торговцами, выносит картины одну за другой на свет окна и разговаривает с ними с утра до полудня. Днем из двери на плечах мужчин выносят три картины, перевязанные бечевкой. Катарина дважды пересчитывает деньги на кухонном столе, откладывает небольшую стопку, заворачивает в ткань и кладет в карман фартука.'
        p3:
          trait_artistic: 'Днем 9 декабря в студии очень тихо. Вермеер сидит за мольбертом, и кисть в его руке долго не касается холста. {staff}, который тоже любит рисовать, некоторое время стоит позади него и говорит ему, что однажды люди начнут искать эти тихие комнаты одну за другой, узнают их снова и развесят их во многих городах. Вермеер не оборачивается. Он берет палитру, соскребает ножом немного засохшей синевы и наклоняется, чтобы смешать немного свежей.'
