  galois_paris:
    name: 'Ночь перед дуэлью'
    place: 'Париж'
    figure: 'Эварист Галуа'
    story: 'Эварист Галуа вышел из тюрьмы в Париже 29 апреля 1832 года. В ночь на 29 мая он написал своему другу Огюсту Шевалье, в котором изложил свои открытия о том, какие уравнения могут быть решены радикалами, и попросил его напечатать письмо. На следующее утро он был ранен в живот на дуэли и оставлен там, где упал; он умер в больнице Кочина 31 мая в возрасте двадцати лет. Шевалье напечатал письмо в сентябре того же года. Четырнадцать лет спустя Жозеф Лиувилл опубликовал свои статьи.'
    story_prose:
      opening:
        - 'Париж, май 1832 года. Двадцатилетний Эварист Галуа вышел из тюрьмы месяц назад. Еще подростком он нашел условия, при которых уравнение может быть решено радикалами, идеи, из которых выросла теория групп, но вряд ли кто-то тогда мог им следовать.'
        - 'Согласно истории, в ночь на 29 мая он написал своему другу Огюсту Шевалье, изложив то, что он нашел, и попросив его напечатать письмо; На следующее утро он был ранен в живот на дуэли и оставлен там, где упал, а 31 мая он скончался в больнице Кочина. Письмо было напечатано в сентябре того же года, и его газетам пришлось ждать четырнадцать лет, пока Лиувилль их опубликует. В этом филиале консьерж, у которого он живет, одалживает ему чернила, возчик уже десять лет возит дрова к воротам кочинской больницы, а наборщик в типографии жалуется, что ему не хватает знаков равенства.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто хранит архивы, переводит или читает корректуру, или кто-то методичный, кто может бодрствовать всю ночь, чтобы сохранить письмо и бумаги вместе; кто-то, кто знает медицину и принес с собой нужный набор или лекарство, чтобы быть там ранним утром; кто-то, кто хранит архивы или переводит и может поговорить с редактором, чтобы последующие читатели могли найти то, что будет дальше.'
      outcomes:
        all: 'Галуа жил. В сентябре того же года письмо было напечатано с индексной страницей, и люди приходили с просьбой предоставить бумаги по номерам страниц. Шевалье записал их вопросы в список, а Галуа сидел за столом, отвечая на них один за другим.'
        p3: 'Галуа пролежал в больнице до июня, не успев подняться. Тем летом он снова сел за стол, перед ним был разложен черновик письма, а линия на полях все еще была на месте.'
        p2: 'С сентября любой, кто прочитал письмо, мог попросить копию по указателю, и вопросы возвращались Шевалье с номерами страниц. В 1846 году Лиувилл опубликовал свои статьи.'
        p1: 'В сентябре того же года Шевалье напечатал письмо от 29 мая в энциклопедическом журнале «Ревю». Четырнадцать лет спустя Лиувилл опубликовал свои статьи.'
      none: '2 июня Галуа был похоронен в братской могиле на Монпарнасе. Консьержка забрала одолженную им бутылочку с чернилами и провела черту в ее бухгалтерской книге.'
      desync: 'Поздно вечером 29 мая письмо и бумаги, о которых в нем говорилось, лежали на двух концах стола, и никто их не завернул. Когда {staff} был отозван, свеча догорела, и ее воск вытек за край страницы.'
      not_admitted: '{staff} так и не проник в здание и простоял на углу улицы всего несколько ночей. Одно окно наверху светилось почти до рассвета, а однажды оно открылось, и на булыжник упала скомканная простыня.'
