        was: 'В июне 1926 года в результате аварии трамвая Гауди попал в больницу, где он скончался. Его коллега Суграньес взял на себя управление зданием, которое Гауди оставил незавершенным.'
      p2:
        was: 'В 1936 году большая часть оригинальных рисунков и гипсовых моделей мастерской была утеряна. Позже проект использовал фрагменты и опубликовал изображения для реконструкции.'
        now: 'Десять лет спустя горят шкафы мастерской. Команда извлекает альбом и рисунки со второго сайта. Два лица модели, которые в противном случае пришлось бы собирать из фрагментов, теперь имеют современные размеры для сравнения.'
      p3:
        was: '7 июня 1926 года Гауди сбил трамвай на Гран-Виа. Без документов и в поношенной одежде его приняли за нищего, и он умер в больнице 10 июня в возрасте семидесяти трех лет.'
        now: '{staff} через минуту становится рядом с ним на колени, говорит, кто он такой, и направляет его прямо к хирургу. Гауди выздоравливает и возвращается в мастерскую на стройке еще на несколько лет.'
        who: 'gaudi_barcelona'
        bio: 'Гауди пережил трамвайную аварию в июне 1926 года. Он вернулся в мастерскую на строительной площадке и продолжал руководить работами вместе с Суграньесом еще несколько лет.'
    vignettes:
      tram: '29 мая {staff} проезжает по улице Гран Виа на трамвае, стоя на задней платформе. Кондуктор говорит, что худшая часть его работы - это не плата за проезд, а люди, которые переходят дорогу и читают газету, и он звонит в колокольчик на каждом углу, как будто ругает всю улицу.'
      stone: '1 июня {staff} помогает двум каменщикам на строительной площадке опустить резной блок на слой раствора. Когда поднимается ветер, он свистит в проемах башни над головой, и младший каменщик клянется, что каждый день он играет одну и ту же ноту, и что он начал подпевать.'
      water: '10 июля, в самый жаркий день, {staff} несет кувшины для продавца воды, который приходит на объект в полдень. Она говорит, что каменотесы выпивают бочку перед звонком, а затем жалуются, что вода имеет вкус пыли, и, как она отмечает, это происходит потому, что они так и делают.'
  kafka_kierling:
    name: 'Корректура в санатории'
    place: 'Кирлинг'
    figure: 'Франц Кафка'
    story: 'В марте 1924 года туберкулез достиг гортани Франца Кафки, и глотание стало затрудненным. 19 апреля он приехал в санаторий Гофмана в Кирлинге недалеко от Клостернойбурга вместе с Дорой Диамант; ему сказали не говорить, и он говорил в основном на листках бумаги. Около 6 мая студент-медик Роберт Клопшток пришел помочь ему. 2 июня он все еще корректировал корректуру своего сборника «Голодный художник». Он умер около полудня 3 июня в возрасте сорока лет и был похоронен в Праге 11 июня. Книга четырех рассказов вышла в Берлине в конце августа.'
    story_prose:
      opening:
        - 'Санаторий Хоффмана в Кирлинге, недалеко от Клостернойбурга к северу от Вены, май 1924 года. Франц Кафка, сорок лет, болен туберкулезом, и с марта он достиг гортани, так что глотание становится труднее. У него есть комната с балконом, выходящим в сад; ему сказали не говорить, он говорит в основном на небольших листках бумаги. У Доры Диамант есть комната для гостей, и она готовит для него, а около 6 мая студент-медик Роберт Клопшток пришел помочь с уходом. Он все еще корректирует корректуры своего сборника «Голодный художник», последней книги, которую он составил сам.'
        - 'В анамнезе ему было так больно глотать, что он едва мог есть, и его врач делал инъекции в гортанный нерв от боли каждые восемь-десять дней; 2 июня он все еще исправлял корректуру, и свое последнее письмо родителям он слишком устал, чтобы закончить, и Дора закончила его за него; около полудня 3 июня он умер, и книга вышла в Берлине только в конце августа. В этом филиале санатория есть садовник, обрезающий сирень, и мальчик на побегушках, разносящий письма, а в деревенской пекарне есть жена булочника.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает медицину и имеет при себе обезболивающие, или сообразительный врач, чтобы облегчить боль в горле; кто-то, кто вел архивы или читал корректуры, с быстрым умом, или кто-то методичный или бдительный, с сильной волей, чтобы сохранять свое место каждый раз, когда болезнь прерывает проверку; кто-то, обученный медсестринскому делу, или кто-то добрый, терпеливый или методичный, чтобы разделить поручения и письма, чтобы те, кто дежурит, могли отдохнуть; кто-то, кто вел архивы или читал корректуру, быстро и упорно, или кто-то методичный, но с еще более сильной волей, чтобы заставить берлинского издателя переплести копию и отправить ее вперед.'
      outcomes:
        all: 'Около полудня 3 июня Кафка умер в Кирлинге. На столике на балконе лежал заранее переплетенный экземпляр, между страницами узкая полоска бумаги, а рядом пустая миска.'
        p3: 'Около полудня 3 июня Кафка умер в Кирлинге. В те последние недели миски, которые приносила Дора, в основном оказывались пустыми.'
        p4: 'Около полудня 3 июня Кафка умер в Кирлинге. Переплетенный заранее экземпляр остался на столике на балконе, с узкой полоской бумаги между страницами.'
        p2: 'Около полудня 3 июня Кафка умер в Кирлинге. Таблица очередей оставалась приколотой за дверью коридора до того дня, когда они ушли, ее последние клетки все еще были пусты.'
        p1: 'Около полудня 3 июня Кафка умер в Кирлинге. В конце августа в Берлине вышел «Голодный художник», четыре рассказа которого были напечатаны в том виде, в каком он последний раз их исправлял.'
      none: 'Около полудня 3 июня Кафка умер в Кирлинге в возрасте сорока лет. На столике на балконе осталась стопка неиспользованных листов бумаги.'
      desync: '19 мая корректура была наполовину исправлена, когда карандаш упал; никто не помнил, на какой строке он остановился, и исправленные страницы были собраны среди остальных. Когда {staff} был отозван, с балкона дул ветер и перевернул верхнюю страницу.'
      not_admitted: '{staff} так и не попал в санаторий и лишь несколько раз стоял возле почтового отделения на холме в Клостернойбурге. Каждый день мальчик на побегушках приносил охапку писем, и одно толстое было адресовано Берлину.'
      points:
        p3: 'В полдень 11 мая Дора приносит тарелку супа. Кафка берет ложку, снова кладет ее, пишет несколько слов на листке бумаги и проталкивает ее. {staff}, разбирающийся в медицине, обсуждает с врачом, как дать обезболивающее перед едой, рассчитывает время его действия и только когда оно подействует, снова ставит перед собой миску. Кафка сглатывает очень маленькими глотками, останавливаясь после каждого. Когда остается чуть меньше половины, он кладет ложку на край миски, берет карандаш и пишет еще одну линию на обратной стороне листа.'
        p1:
          class_lettered: 'Днем 19 мая на столике на балконе лежит стопка корректур. На середине исправлений Кафка начинает кашлять, и карандаш падает на пол. {staff}, привыкший работать с бумагой, берет карандаш, кладет узкую полоску бумаги рядом с линией, на которой он остановился, отделяет исправленные страницы от остальных на две стопки и кладет на них пресс-папье. Отдохнув немного, Кафка сам вытягивает полоску и продолжает исправлять. Ветер поднимает оставленный незакрепленным угол страницы, он протягивает руку и придерживает ее.'
          trait_vigil: 'Днем 19 мая на столике на балконе лежит стопка корректур. На середине исправлений Кафка начинает кашлять, и карандаш падает на пол. {staff}, дежуривший рядом с ним, берет карандаш, кладет узкую полоску бумаги рядом с линией, на которой он остановился, отделяет исправленные страницы от остальных на две стопки и кладет на них пресс-папье. Отдохнув немного, Кафка сам вытягивает полоску и продолжает исправлять. Ветер поднимает оставленный незакрепленным угол страницы, он протягивает руку и придерживает ее.'
          else: 'Днем 19 мая на столике на балконе лежит стопка корректур. На середине исправлений Кафка начинает кашлять, и карандаш падает на пол. {staff} методично берет карандаш, кладет узкую полоску бумаги рядом с линией, на которой он остановился, отделяет исправленные страницы от остальных на две стопки и кладет на них пресс-папье. Отдохнув немного, Кафка сам вытягивает полоску и продолжает исправлять. Ветер поднимает оставленный незакрепленным угол страницы, он протягивает руку и придерживает ее.'
        p2:
          class_medical: '21 мая в коридоре ждет небольшая стопка писем, и Дора уже несколько дней не выходила из дома. {staff}, прошедший обучение медсестринскому делу, заносит в таблицу часы приема писем, посещения почты и сидения рядом с ним, прикрепляет ее за дверью в коридор и заполняет квадрат за квадратом, кто когда приходит и кто когда уходит. Днем настала очередь {staff} сидеть в комнате. Дора выходит, обходит сад вдоль забора и стоит под сиренью.'
          else: '21 мая в коридоре ждет небольшая стопка писем, и Дора уже несколько дней не выходила из дома. {staff}, заботливый и терпеливый, заносит в таблицу часы приема писем, спуска на почту и сидения рядом с ним, прикрепляет ее за дверью в коридор и заполняет квадрат за квадратом, кто когда приходит и кто когда уходит. Днем настала очередь {staff} сидеть в комнате. Дора выходит, обходит сад вдоль забора и стоит под сиренью.'
        p4:
          class_lettered: '26 мая исправленные листы были отправлены обратно в Берлин, и книга выйдет в печать только летом. {staff}, привыкший к бумажной работе и типографиям, пишет издателю в Берлине, прося сначала сшить исправленные листы в один экземпляр и отправить его по почте, и прилагает заголовки четырех рассказов в том порядке, в котором выбрал Кафка. Несколько дней спустя мальчик на побегушках несет на холм твердый сверток. Кафка ставит его на колени и перелистывает страницы одну за другой, и на последнем рассказе его палец на некоторое время задерживается под заголовком.'
          else: '26 мая исправленные листы были отправлены обратно в Берлин, и книга выйдет в печать только летом. {staff} методично пишет издателю в Берлине, прося сначала сшить исправленные листы в один экземпляр и отправить его по почте, а также прилагает названия четырех рассказов в том порядке, в котором выбрал Кафка. Несколько дней спустя мальчик на побегушках несет на холм твердый сверток. Кафка ставит его на колени и перелистывает страницы одну за другой, и на последнем рассказе его палец на некоторое время задерживается под заголовком.'
