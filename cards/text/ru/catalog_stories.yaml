      p2: 'Наборщик сбрасывает несколько символов, и строки с начала никто не читает. Ей приходится сверять формулы и таблицу друг с другом за последние несколько часов.'
      p3: 'Ее предложение заканчивается ответом Бэббиджа. Когда кто-то другой спрашивает о поддержке работы, у него нет плана, и оба готовы передать его.'
