  mary_anning_lyme_regis:
    name: 'Кости в обрыве'
    place: 'Лайм-Риджис'
    figure: 'Мэри Эннинг'
    story: 'Примерно в 1811 году брат Мэри Эннинг Джозеф нашел череп ихтиозавра в скалах Лайм-Реджиса, а в ноябре 1812 года Мэри выкопала его скелет длиной около пяти метров. В декабре 1823 года она нашла первый полный скелет плезиозавра, а в декабре 1828 года — первого птерозавра, найденного в Англии. Она умерла в 1847 году в возрасте 47 лет, все еще не имея денег; о ней редко упоминали в статьях, написанных о ее находках.'
    relic: 'Аммонит'
    relic_desc: 'Свернутая ископаемая раковина откололась от синей лии.'
    points:
      p1: '10 декабря сохраните плезиозавра под скалой и вытащите его целиком до следующего падения и возвратного прилива.'
      p2: 'Помогите ей посчитать и нарисовать длинную шею кость за косточкой, чтобы эскиз, отправленный в Лондон, выдержал вопросы.'
      p3: 'Дайте ей знать при жизни, что однажды эти кости будут носить ее имя.'
    points_fail:
      p1: 'Возвратный прилив унес половину скелета, и в этой ветви нет первого полноценного плезиозавра.'
      p2: 'В этой ветке эскиз от 26 декабря ушел как есть, без второй галочки на костях шеи.'
      p3: 'В этой ветке она еще не знала, что ее будут помнить, и той зимой ей никто не сказал.'
    shift:
      p1:
        was: 'В декабре 1823 года Мэри Эннинг вытащила из-под скалы целый скелет, шея которого длиннее тела.'
      p2:
        was: '26 декабря 1823 года она отправила в Лондон свой рисунок плезиозавра в том виде, в котором он был.'
        now: 'Каждая шейная кость на эскизе, дошедшем до Лондона, имела свой номер, и когда позже возникли сомнения, рисунок уже содержал ответ.'
      p3:
        was: 'Мэри Эннинг умерла в 1847 году в возрасте сорока семи лет, все еще не имея денег, и в документах о том, что она нашла, редко упоминалось ее имя.'
        now: 'Той зимой кто-то сказал ей, что кости, которые она выкопала, однажды будут носить ее имя в лондонском музее и что ее статуя будет стоять на берегу моря в Лайм-Реджисе.'
    vignettes:
      stone: '{staff} следует по трещине мимо шеи скелета, пока линия не выйдет из костей, и поднимает там карандаш.'
      vertebrae: '{staff} считает шею с другого конца, и там, где эти два счета не совпадают, вместо добавления кости остается скобка.'
      pose: '{staff} крутит копию эскиза до тех пор, пока голову не удастся найти без посторонней помощи, и пишет под ней, кто ее нашел.'
    story_prose:
      opening:
        - 'Лайм-Реджис, зима 1823 года. После отлива Мэри Эннинг видит, что у скелета под скалой шея длиннее тела. Поднять кости недостаточно. Люди в Лондоне будут смотреть на это через лист бумаги, и кто-то должен проследить за трещиной в скале и пересчитать кости шеи одну за другой, прежде чем они смогут разглядеть то, что она увидела, стоя под скалой.'
        - 'По истории, Эннинг позже отослала эскиз. Скелет стал знаменитым, но его имя редко упоминалось в статьях, посвященных этим находкам. Эта поездка прибудет до отправки рисунка.'
        - 'В этом путешествии могут помочь три типа людей: кто-то, кто может выполнить тяжелую работу под скалой и вытащить скелет до того, как вернется прилив, кто-то, кто может считать, рисовать и отличать кость от камня, и кто-то, кто готов сесть и поговорить с ней словами, которые дойдут до нее.'
      outcomes:
        all: 'На эскизе, который той зимой отправился в Лондон, рядом с длинной шеей шел ряд маленьких цифр, а в углу было написано ее имя, написанное ее собственной рукой.'
        p3: 'Письмо, как и раньше, отправилось в Лондон. Имя в углу рисунка она написала там сама.'
        p2: 'После того, как эскиз прибыл в Лондон, у кого-то возникли сомнения, он взял рисунок и, следуя за рядом цифр, отсчитал снизу черепа по одной кости за раз.'
        p1: 'Той зимой в домике на вершине утеса лежал целый скелет, шея которого была длиннее туловища.'
      none: 'В тот день, когда письмо было отправлено, Эннинг сидела одна над наброском допоздна. Длинную шею так часто вытягивали и стерли, что бумага стала нечеткой.'
      desync: 'Когда прилив накрыл подножье скалы, часть скелета еще не была вынута. Последнее, что увидел {staff} перед отзывом, — это вода, закрывавшая шейную кость.'
      not_admitted: '{staff} никогда не спускался под скалу вместе с Эннинг. Во время отлива у подножия горы была только она с молотком в руке.'
      points:
        p1: 'Прежде чем прилив вернулся, Эннинг и {staff} по частям вытащили скелет с длинной шеей, завернули куски в старую газету и понесли на вершину скалы. Последний кусок только что ушел, когда волны накрыли участок утеса позади них. Эннинг оглянулась один раз; на воде не было ничего, кроме пены.'
        p2:
          class_learned: 'Пока она рисовала эскиз, {staff} действовала по правилу полевой тетради и называла кости одну за другой с другого конца, записывая каждую так, как она называлась. Там, где счетчики не сходились во мнении, Эннинг долго смотрела вдоль трещины, пока не смогла определить, где находится край кости. В конце концов, каждая шейная кость имела свой номер, и маленькие фигурки тянулись по всей длине шеи, вплоть до нижней части черепа.'
          class_craft: 'Рисуя эскиз, {staff} сначала слегка обвела контур костей вдоль трещины, как чертят узор, а затем пересчитала длинную шею с другого конца. Там, где счетчики не сходились во мнении, Эннинг долго смотрела вдоль трещины, пока не смогла определить, где находится край кости. В конце концов, каждая шейная кость имела свой номер, и маленькие фигурки тянулись по всей длине шеи, вплоть до нижней части черепа.'
          else: 'Пока она рисовала эскиз, {staff} помогал ей считать длинную шею с другого конца. Там, где счетчики не сходились во мнении, Эннинг долго смотрела вдоль трещины, пока не смогла определить, где находится край кости. В конце концов, каждая шейная кость имела свой номер, и маленькие фигурки тянулись по всей длине шеи, вплоть до нижней части черепа.'
        p3: 'Прежде чем отправить эскиз, {staff} рассказала о Лондоне много лет спустя: в музее будут показаны кости, которые она выкопала из-под скалы, с именем Мэри Эннинг рядом с ними, а ее статуя будет стоять на берегу моря в Лайме. Эннинг слушала, не поднимая глаз. Ручка в ее руке на мгновение остановилась в углу рисунка, и там она написала свое имя.'
