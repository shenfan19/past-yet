  smith_kirkcaldy:
    name: 'Книга, оставленная на хранение'
    place: 'Киркалди, Шотландия'
    figure: 'Адам Смит'
    story: 'В марте 1776 года в Лондоне вышло «Богатство народов» Адама Смита. 25 августа в Эдинбурге умер его друг Дэвид Хьюм. Хьюм сначала попросил Смита увидеть в печати его «Диалоги о естественной религии»; Смит создал трудности, и вместо этого Юм поручил работу печатнику Уильяму Страхану, попросив, чтобы она появилась в течение двух лет. В ноябре того же года, вернувшись в Кирколди, Смит написал Стрэхану отчет о последних месяцах жизни Хьюма. В конце концов Страхан отказался, и «Диалоги» вышли в 1779 году через племянника Юма.'
    story_prose:
      opening:
        - 'Киркалди, Шотландия, поздняя осень 1776 года. Адам Смит вернулся в город, где он родился. В марте в Лондоне вышло его «Богатство народов», первая глава которого началась с изготовления булавок. В августе в Эдинбурге умер его друг Дэвид Хьюм.'
        - 'В истории Юм в своем завещании в январе поручил Смиту присматривать за его бумагами и сначала хотел, чтобы он увидел в печати «Диалоги о естественной религии»; Смит не хотел. В дополнении от 7 августа эта работа была передана типографу Уильяму Страхану с просьбой опубликовать ее в течение двух лет после смерти Юма. В ноябре Смит написал Страхану отчет о последних месяцах Юма из Киркалди, и «Диалоги» оставались там, где они были, пока племянник Юма не вывел их без названия в 1779 году. В этом отделении гвоздезабивщик платит булочнику горстью гвоздей, а женщина собирает мидии на песке во время отлива.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто разбирается в книгах и полиграфическом деле, или разбирается в бумагах и может ясно изложить последнее желание; тот, чье слово имеет вес и кто может убедить человека.'
      outcomes:
        p1: 'Менее чем через два года после смерти Юма в магазине Страхана были напечатаны «Диалоги о естественной религии». На веревке висели первые листы, чернила еще не высохли.'
      none: 'Той зимой рукопись все еще лежала у Страхана. На песках в Киркалди женщина, собиравшая мидии, шла домой со своей корзиной, а над водой низко висел дым Эдинбурга.'
      not_admitted: '{staff} так и не вошел в дверь этого дома и провел несколько дней, неся корзины для женщины, которая собирала мидии на песке. Над водой все время низко висел дым Эдинбурга.'
      points:
        p1:
          class_lettered: '9 ноября Смит сидел за своим столом в Кирколди и писал Стрэхану последние месяцы жизни Хьюма. {staff}, как писарь переписывает акт, слово в слово выписал строчку из дополнения от 7 августа, опубликованного через два года после его смерти, а под ней, сколько листов и сколько месяцев займет маленькое октаво, и положил бумагу рядом со своим письмом. Смит долго смотрел на бумагу, сложил ее и вложил вместе с письмом Стрэхану. Когда письмо было запечатано, оно оказалось толще остальных букв на столе.'
          else: '9 ноября Смит сидел за своим столом в Кирколди и писал Стрэхану последние месяцы жизни Хьюма. {staff} весь день просидел за своим столом, написал на листе бумаги строку из дополнения от 7 августа, которая в течение двух лет должна была распечатать Страхану, и передал ему. Смит долго смотрел на бумагу, сложил ее и вложил вместе с письмом Стрэхану. Когда письмо было запечатано, оно оказалось толще остальных букв на столе.'
      excerpts:
        p1: 'Смит долго смотрел на бумагу, сложил ее и вложил вместе с письмом Стрэхану. Когда письмо было запечатано, оно оказалось толще остальных букв на столе.'
    relic: 'Булавка с фабрики'
    relic_desc: 'Такими булавками Смит пояснял, что даёт разделение труда.'
    points:
      p1: 'Пока «Диалоги», оставленные Хьюмом в доверительном управлении, лежат неизданными, уговорите Смита и Страхана опубликовать их, как просил Юм.'
    points_fail:
