catalog:
  euclid_alexandria:
    name: 'Пока сохранялись «Поризмы»'
    place: 'Александрия'
    figure: 'Евклид'
    story: 'Около 300 года до н. э. Евклид написал в Александрии тринадцать книг «Начал», доказывая геометрические положения шаг за шагом из определений и постулатов. Он написал также три книги «Поризмов», труд о конических сечениях и другие сочинения, которые позже утратили. В IV веке Папп ещё мог описать «Поризмы» и сосчитать их предложения.'
    relic: 'Бронзовый циркуль'
    relic_desc: 'Две ножки и шарнир, чтобы вычертить любую фигуру из книги.'
    points:
      p1: 'Помочь сделать несколько копий трёх книг «Поризмов» и передать их ученикам, чтобы сочинение сохранилось'
    points_fail:
      p1: 'У «Поризмов» по-прежнему была одна цепочка списков. Книги исчезли и в этой ветви, остались только несколько строк Паппа.'
    shift:
      p1:
        was: 'Около 300 года до н. э. Евклид написал три книги «Поризмов». Сочинение утрачено, и о нём известны только число 171 и краткое описание, данное Паппом в IV веке.'
        now: 'При содействии {staff} с «Поризмов» сняли несколько копий и передали их ученикам, изучавшим геометрию. В этой ветви книга дошла до потомков.'
        who: 'euclid_alexandria'
        bio: 'В этой ветви «Поризмы» разошлись по разным рукам и уцелели. У позднейших читателей остались и другие работы Евклида помимо «Начал».'
    vignettes:
      lost: 'На столе переписчика {staff} видит свиток «Поризмов». Позднейшим читателям придётся судить о нём по нескольким строкам Паппа. {staff} на миг задерживает ладонь на краю свитка.'
      arcs: '{staff} чертит окружности на песке с помощью колышка и шнура, как это делают ученики. Две дуги пересекаются в третьей точке. {staff} разравнивает песок и чертит снова, теперь более твёрдой рукой.'
      papyrus: '{staff} помогает торговцу папирусом перенести связки на пристань. Торговец рассказывает, какие листы переносят портовую сырость, а какие через год становятся ломкими.'
    story_prose:
      opening:
        - 'Александрия, около 300 года до н. э. Здесь Евклид пишет тринадцать книг «Начал» и выводит геометрические положения одно за другим из определений и постулатов. В первом же предложении двух окружностей хватает, чтобы построить равносторонний треугольник на заданном отрезке. Евклид пишет также три книги «Поризмов» и труд о конических сечениях.'
        - 'В истории «Поризмы» со временем исчезли. Около 320 года н. э. Папп ещё мог описать их и насчитал 171 теорему и 38 лемм. Позднейшие списки неизвестны. В этой ветви один ученик чертит фигуры на дощечке с песком, а торговец на пристани знает, какой папирус не отсыреет.'
        - 'Здесь пригодится тот, кто умеет переписывать, сверять и хранить книги. Пригодится и учитель геометрии, способный вести группу учеников, или внимательный знаток, готовый сверять строку за строкой.'
      outcomes:
        all: 'На полках у читателей следующих поколений рядом с «Началами» стоят три свитка «Поризмов». Их края размягчились от частого чтения.'
        p1: 'На полках у читателей следующих поколений рядом с «Началами» стоят три свитка «Поризмов». Их края размягчились от частого чтения.'
      none: 'Песок разровняли и начертили новые окружности. После Паппа этих трёх книг никто больше не разворачивал.'
      not_admitted: '{staff} так и не попадает в комнату переписчиков. На пристани торговец всё ещё переносит на берег связки папируса.'
      points:
        p1:
          class_teaching: 'Опыт преподавания подсказывает {staff} поручить по книге «Поризмов» самым внимательным ученикам у песчаной доски, а затем дать им сверить свои копии вслух, слово за словом и чертёж за чертежом. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.'
          class_lettered: 'По правилам переписной мастерской {staff} нарезает папирус, переписывает три книги «Поризмов» и сверяет с подлинником каждую строку и каждый чертёж. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.'
          else: '{staff} следит за работой переписчиков. Каждый готовый свиток «Поризмов» ложится рядом с подлинником, чтобы можно было сверить рисунки один за другим. Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.'
      excerpts:
        p1: 'Готовые копии свернули, перевязали тонким шнуром и передали ученикам. Евклид взял один свиток, развязал шнур, взглянул на первый лист и снова завязал узел.'
  socrates_athens:
    name: 'Пока корабль в море'
    place: 'Афины'
    figure: 'Сократ'
    story: 'В 399 году до н. э. Сократа судили в Афинах и приговорили к смерти. Корабль, который афиняне каждый год отправляли на Делос, только что отплыл. До его возвращения казни были запрещены, и Сократ провёл в тюрьме около тридцати дней. Там он перелагал басни Эзопа в стихи, а друзья навещали его каждый день. В последний вечер пришли все, кроме заболевшего Платона, и Сократ выпил цикуту.'
    relic: 'Глиняная чаша с рынка'
    relic_desc: 'Афинская чаша в чёрной глазури с небольшим сколом на краю.'
    points:
      p1: 'Утихомирить присяжных, чтобы Сократ смог закончить защитную речь'
      p2: 'Помочь закончить переложение басен Эзопа и гимн Аполлону и передать копию из тюрьмы'
      p3: 'Вылечить Платона до последнего дня, чтобы он мог быть рядом с учителем в тюрьме'
    points_fail:
      p1: 'Шум заглушает защитную речь, и закончить её не удаётся. Ветвь теряет синхронизацию, и агентство отзывает сотрудника.'
      p2: 'Стихи в этой ветви не сохранились, как и в истории.'
      p3: 'Как и в истории, Платон болен в тот день и не приходит к учителю.'
    shift:
      p1:
        was: '399 год до н. э. Сократа судят в Афинах. В платоновской «Апологии» он раз за разом просит присяжных не шуметь. Его признают виновным и приговаривают к смерти.'
      p2:
        was: '399 год до н. э. В ожидании казни Сократ по велению повторяющегося сна переложил басни Эзопа в стихи и написал гимн Аполлону. Ничего целиком не сохранилось.'
        now: 'Один из друзей вынес из тюрьмы свиток с копией стихов, и тот остался в Афинах.'
      p3:
        was: '399 год до н. э. В день, когда Сократ выпил цикуту, друзья были с ним в тюрьме. Платон болел и не пришёл.'
        now: 'Платон выздоровел, пришёл в тюрьму к друзьям и остался до конца.'
        who: 'plato_academy'
        bio: 'В этой ветви Платон выздоровел и провёл последний день Сократа рядом с ним в тюрьме.'
    vignettes:
      rumours: 'Накануне суда {staff} спрашивает в трёх лавках на площади, в чём обвиняют старика, и получает три разных ответа. {staff} записывает все три и ждёт, какой прозвучит в суде.'
      harbour: 'Каждый вечер {staff} спускается в Пирей и спрашивает торговца рыбой, пришёл ли корабль с Делоса. Ответ всё тот же, и {staff} не знает, ждать возвращения или надеяться на задержку.'
      gate: '{staff} носит воду продавщице масла и получает за это место у тюремной стены. Посетители ждут у ворот с рассвета, и {staff} понемногу запоминает их лица.'
    story_prose:
      opening:
        - 'Афины, 399 год до н. э. Сократу предстоит суд по обвинению в нечестии и развращении молодёжи. Всю жизнь он задавал людям вопросы на улицах и на площади. Сам он не написал ни одной книги, и потомки знают его по сочинениям Платона и Ксенофонта.'
        - 'В истории корабль на Делос ушёл накануне суда. До его возвращения казнить никого нельзя, и Сократ проводит в тюрьме ещё около тридцати дней. По велению повторяющегося сна он переложил басни Эзопа в стихи, но стихи не сохранились. В последний день пришли все друзья, кроме заболевшего Платона. В этой ветви у тюремной стены женщина продаёт масло для светильников, а торговец рыбой в Пирее видит каждый входящий корабль.'
        - 'Пригодится тот, кто умеет унять шумную толпу, тот, кто может записать стихи и переписать их на свиток, и тот, кто знает лекарства и умеет лечить.'
      outcomes:
        all: 'Корабль с Делоса вернулся, и торговец рыбой издали заметил парус. В последний вечер тюрьма полна друзей, и Платон сидит среди них. Потом свиток со стихами ещё долго лежит на дне сундука в одном афинском доме.'
        p3: 'В последний вечер тюрьма полна друзей. Платон сидит среди них до самого конца.'
        p2: 'Свиток со стихами пролежал годы на дне сундука в афинском доме. Края папируса истрепались.'
        p1: 'Через тридцать дней корабль с Делоса вошёл в Пирей, и торговец рыбой издали заметил его парус. В тот день друзья с рассвета стояли у ворот тюрьмы.'
      none: 'Корабль с Делоса вернулся, и торговец рыбой издали заметил парус. Вечером друзья в тюрьме сели в круг. Никто не заговорил первым.'
      desync: 'Шум в суде нарастал, и защитная речь оборвалась на полуслове. Агентство отозвало {staff} прямо из зала.'
      not_admitted: '{staff} так и не удаётся устроиться в Афинах, даже присесть у подножия тюремной стены негде. Корабль с Делоса всё ещё в море.'
      points:
        p1: 'В день суда присяжные заполнили ряды деревянных скамей. Каждые несколько фраз поднимался крик и заглушал Сократа. {staff} встаёт среди слушателей, молча и медленно опускает ладони, обводит взглядом ряд за рядом и садится лишь тогда, когда шум стихает. Сократ продолжил с той фразы, на которой его перебили. Закончив, он подобрал край плаща и замер на возвышении.'
        p2: 'В тюрьму свет попадал только из маленького окна высоко в стене. Сократ произносит строку, а {staff} записывает её на восковой табличке и читает вслух, отбивая ритм. Если доля лишняя, воск разглаживают и строку пишут заново. За стихами из басен Эзопа следует гимн Аполлону. Ночью у стены {staff} при свете масляного светильника переносит строки с табличек на папирус. Рано утром один из друзей прячет свиток под одеждой и выходит из тюрьмы, прижимая ладонь к груди.'
        p3:
          class_medical: 'Накануне последнего дня Платон ещё болел и не мог встать с постели. {staff} осматривает его, как подобает врачу, готовит лекарство, даёт его в положенное время и всю ночь остаётся у постели. Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.'
          else: 'Накануне последнего дня Платон ещё болел и не мог встать с постели. {staff} открывает наноаптечку, проводит лечение по инструкции и всю ночь остаётся у постели. Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.'
      excerpts:
        p3: 'Ещё до рассвета он сам сел и в темноте завязал ремешки сандалий. Накинув плащ, он вышел с друзьями, спешившими в тюрьму, и скоро обогнал их.'
        p2: 'Ночью у стены {staff} при свете масляного светильника переносит строки с табличек на папирус. Рано утром один из друзей прячет свиток под одеждой и выходит из тюрьмы, прижимая ладонь к груди.'
        p1: 'Сократ продолжил с той фразы, на которой его перебили. Закончив, он подобрал край плаща и замер на возвышении.'
  cao_xueqin_beijing:
    name: 'Чистый лист после последней главы'
    place: 'Западные горы, Пекин'
    figure: 'Цао Сюэцинь'
    story: 'Ранняя рукопись «Истории камня» свидетельствует, что аннотированные копии распространялись при жизни Цао Сюэциня. Одна более поздняя заметка на полях этой рукописи связывает смерть Цао с книгой, оставшейся незавершенной. Сценарий разворачивается в его последнюю зиму, без указания точной даты его смерти или количества написанных им глав.'
    story_prose:
      opening:
        - 'В Западных Холмах темнеет рано. Заходит переписчик с пачкой страниц и спрашивает, что можно взять с собой. Он кладет сверток на столик у кровати. Сверху лежит чистый лист.'
        - 'Аннотированные копии «Истории камня» циркулировали еще при жизни Цао Сюэциня. В более поздней записи в рукописи Цзясюй говорится, что он умер до того, как книга была закончена. Во время этого воображаемого зимнего визита у него еще есть время самому разобраться со стопкой.'
        - 'Переписчик хочет вернуться домой до наступления темноты. Кто-то, кто знает рукописи, может выбрать аннотированную копию среди рабочих страниц. Тот, кто привык заботиться о других, может присматривать за огнем и лампой. Тогда на столе останется место, чтобы разложить черновик.'
      points:
        p1: 'Переписчик собирается перевязать стопку разрозненных страниц у кровати. Вы замечаете на полях строку, написанную другой рукой, и просите его прочитать ее. Он упаковывает аннотированную копию отдельно и кладет страницы, которые Цао все еще просматривает, обратно в доступную область. Каждый свёрток перевязан своей бечёвкой.'
        p2: 'Когда угли гаснут, Цао закрывает страницу, на которую только что открыл. Вы просите человека, приносящего уголь, ухаживать за огнем, ставите лампу поближе и передаете Цао только страницу, которую он читает. Он вытягивает руку из-под чехла и снова берет трубку. В тот вечер лампа стоит у него под рукой.'
        p3: 'Вы рассказываете Цао, что в позднем продолжении род снова процветает. Он хмурится, открывает конец песни о разлетающихся птицах в пятой главе и указывает на строки о земле, ставшей белым пустым полем. Вы раскрываете рукопись с примечаниями и спрашиваете, правы ли потомки, которые читают эту книгу как скорбь о падении династии Мин. Цао громко смеётся. Ни слова в ответ. Взяв кисть, он отмечает только те страницы, по которым уже принял решение. Переписчик следует пометкам, а остальное оставляет пустым.'
      outcomes:
        all: 'Переписчик уходит с двумя листами. Прочитанные вместе, они показывают, какие главы Цао привел в порядок и какой выбор он все еще обдумывал. Никто не записывает, что он имел в виду под смехом.'
        p1: 'Переписчик уходит с ранним аннотированным экземпляром. Черновик, который Цао все еще хочет прочитать, остается у кровати.'
        p2: 'Лампа у кровати еще немного горит. Цао заканчивает отложенную страницу.'
        p3: 'Отмеченные части копируются, а нерешенные места остаются пустыми. Переписчик оставляет свои догадки.'
      none: 'Страницы сложены в стопку, в которой они были доставлены. Позже, когда кто-то спрашивает о последних главах, пустой лист не дает ответа.'
      not_admitted: 'Переписчик заходит внутрь. Вы ждете, пока во дворе останется одна лампа, так и не доставив бумаги на тумбочку.'
      desync: 'Аннотированная копия возвращается к рабочим страницам. Переписчик уходит без него, и контора вас отзывает.'
      excerpts:
        p1: 'Каждый свёрток перевязан своей бечёвкой.'
        p2: 'В тот вечер лампа стоит у него под рукой.'
        p3: 'Переписчик следует пометкам, а остальное оставляет пустым.'
    relic: 'Незакрепленный лист с планами глав'
    relic_desc: 'Сувенир из игры с предложенным порядком на несколько глав и пустым местом для того, что еще предстоит решить Цао.'
    points:
      p1: 'Держите ранний экземпляр с аннотациями в руках переписчика, пока рабочие страницы Цао не будут возвращены ему.'
      p2: 'Следите за огнем и копированием, чтобы Цао мог провести один хороший вечер, обдумывая финал.'
      p3: 'Пока у Цао еще есть силы просмотреть его, оставьте отдельный экземпляр плана отделения, который он согласен передать.'
    points_fail:
      p1: 'Единственная копия на этом столе возвращается в стопку рабочих страниц. В эту ветку читатель уходит без аннотированного текста.'
      p2: 'В комнате становится холодно еще до того, как бумаги готовы. Работа ждет еще вечера.'
      p3: 'Переписчик может разложить отдельные страницы, но не знает, какой финал Цао хотел оставить.'
    shift:
      p1:
        was: 'В рукописи Цзясюй сохранились примечания к раннему тексту, который копировался при жизни Цао Сюэциня.'
      p2:
        was: 'В заметке на полях рукописи Цзясюй упоминается о смерти Цао и говорится, что книга осталась незавершенной.'
        now: 'В этом отделении кто-то поддерживает огонь и приносит страницы по одной. У Цао есть один вечер, чтобы решить, куда он хочет, чтобы история развивалась.'
      p3:
        was: 'В примечании на полях Цзясюй книга названа незавершенной и не приводится окончательный план глав, одобренный Цао.'
        now: 'Переписчик забирает два листа. В этой ветке отдается приказ, одобренный Цао. Другой перечисляет судьбы, которые ему еще предстоит решить. При следующем копировании два листа останутся вместе.'
        who: 'cao_xueqin_beijing'
        bio: 'Перед смертью Цао просматривает план отделения с переписчиком. В этой ветке позже читатели смогут увидеть, какие решения он принял и где оставил концовку открытой.'
    vignettes:
      ink: 'Переписчик делает разрыв между предлагаемым порядком глав и карандашным предположением читателя. Теперь страницы можно вернуть в нужные места.'
      paper: '{staff} несет лампу. Переписчик отодвигает рукопись от края стола, чтобы освободить место.'
      empty: 'На последнем листе есть место для еще одного заголовка. Переписчик оставляет пространство как есть.'
  jenner_berkeley:
    name: 'Первая вакцина'
    place: 'Беркли, Англия'
    figure: 'Эдвард Дженнер'
    story: 'В расследовании Дженнера 1798 года зафиксированы более ранние наблюдения и случаи коровьей оспы и оспы.'
    story_prose:
      opening:
        - 'В Беркли Сара Нелмс подходит к двери, прижав руку к фартуку. Дженнер хочет спросить, когда она впервые заболела. Переписчик помещает свое имя под чужой учетной записью. Она ждет у двери и сначала спрашивает, нужно ли ей сегодня вернуться на молочную ферму.'
        - 'В расследовании Дженнера 1798 года зафиксированы коровья оспа Сары и ранняя вакцинация в 1796 году, традиционно связываемая с Джеймсом Фиппсом. В этом разделе вы можете начать с заботы, которую хочет Сара, и помочь в последующих наблюдениях, связанных с людьми, которые вернулись.'
        - 'Пусть сначала Сару выслушает кто-нибудь с опытом ухода. Путешественник, ведущий записи, может проверить имена и даты, пока Дженнер и семьи решают, возвращаться ли для дальнейших наблюдений.'
      points:
        p1: 'Переписчик ждет свидания. Сара убирает руку и просит присесть. Вы придвигаете стул к двери и спрашиваете, хочет ли она, чтобы за ней присмотрела сиделка. Как только она скажет «да», вы сообщите на молочную ферму, что она вернется позже. На выходе Сара свободной рукой берёт листок со своим именем.'
        p2: 'Страница записной книжки Дженнер описывает ответный визит мальчика, но под ней для проверки еще не указана дата. Вы даете переписчику новый лист для отделения записей из первых рук от последующих отчетов. Дженнер спрашивает, кто вернется для дальнейшего наблюдения. Одно домохозяйство оставляет свой адрес. Переписчик ставит дату и оставляет строчку, чтобы семья могла сверить её по прибытии.'
      outcomes:
        all: 'Саре есть кому помочь, а у людей, которые возвращаются, есть записи, которые можно проверить. Дженнер может продолжить работу над наблюдениями того года.'
        p1: 'Саре может пройти несколько дней, прежде чем она вернется на молочную ферму. Более поздние записи все еще зависят от возвращения других людей.'
        p2: 'Есть последующие наблюдения, к которым можно обратиться. Саре все еще приходится терпеть больную руку самостоятельно.'
      none: 'Сара возвращается на молочную ферму без посторонней помощи, и последующие наблюдения никто не устраивает.'
      not_admitted: 'Переписчик проверяет, с какой семьей пришел посетитель. Вы остаетесь снаружи, а место возле даты все еще пусто.'
      excerpts:
        p1: 'На выходе Сара свободной рукой берёт листок со своим именем.'
        p2: 'Переписчик ставит дату и оставляет строчку, чтобы семья могла сверить её по прибытии.'
    relic: 'Последующий промах'
    relic_desc: 'Бланк с именем, датой и местом для записи того, что наблюдалось.'
    points:
      p1: 'Перевяжите язвы коровьей оспы на руке Сары Нельмс, чтобы доярка не страдала от них одна.'
      p2: 'Проверьте имена и даты в первых описаниях случаев и организуйте последующее наблюдение с семьями, которые согласились вернуться.'
    points_fail:
      p1: 'Язвы на ее руке затянулись, и никто их не перевязал. В этом отделении никто не облегчал будни доярки.'
      p2: 'Никто не организует ответный визит. В этой отрасли, как и в истории, Дженнер возобновляет свои исследования вакцинации в 1798 году.'
    shift:
      p1:
        was: 'В мае 1796 года доярка Сара Нельмес заразилась коровьей оспой от коров своего хозяина, и на ее руке образовалась большая гнойничковая язва с обычными симптомами болезни.'
        now: '{staff} держал ее руки чистыми и связанными, и на несколько дней раньше она вернулась на молочную ферму.'
      p2:
        was: 'После первого случая в 1796 году Дженнер возобновил исследования вакцинации весной 1798 года.'
        now: '{staff} помог организовать повторные визиты с желающими семьями. Тем летом у Дженнер были дополнительные записи, которые нужно было сверить с предыдущими наблюдениями.'
        who: 'jenner_berkeley'
        bio: 'В этот график Дженнер получил последующие записки от семей, которые согласились вернуться летом 1796 года.'
    vignettes:
      firsthand: 'Вымышленный переписчик написал все отчеты одним и тем же голосом. Вы спрашиваете, какой из них на самом деле видел писатель. Переписчик добавляет примечание рядом с остальными, вместо того, чтобы придавать каждой строке одинаковый вес.'
      order: 'Два наблюдения поменялись местами в копии. Вы проверяете даты, и переписчик переворачивает листы, прежде чем использовать порядок рассказа.'
      blank: 'Вы оставляете место под запиской, которую переписчик не может подтвердить. К моменту передачи страницы на бланке уже есть метка, поэтому никто не примет его за пропуск.'
  mallory_everest:
    name: 'Последний раз их видели на подъёме'
    place: 'Эверест'
    figure: 'Джордж Мэллори'
    story: 'Сохранившиеся письма Мэллори из экспедиции 1924 года описывают условия и планы в разных лагерях. Судьба Мэллори и Ирвина не позволяет установить, достигли ли они вершины.'
    story_prose:
      opening:
        - 'Кто-то у палатки Северного седла спрашивает, может ли Нортон открыть глаза после спуска. Другой альпинист смотрит на Мэллори, которая готовится идти следующей. Компас из предыдущей палатки с ним не вернулся.'
        - 'Нортон и Сомервелл вернулись на Эверест в 1924 году. Следующими пошли Мэллори и Ирвин. 8 июня Оделл увидел двух альпинистов, все еще идущих вверх, но ни один из них не вернулся. В этой ветке вы можете помочь предыдущей группе, вернуть компас и помочь следующей паре вернуться на Северное седло.'
        - 'Отправьте кого-нибудь, кто сможет позаботиться о Нортоне и Сомервелле. Путешественник, знакомый с передачей лагерей, может найти компас. Для последнего спуска отправьте кого-нибудь, кто поможет следующей группе вернуться в лагерь.'
      points:
        p1: 'Нортон снова окликает Сомервелла. Тот не может ответить и кладёт руку на колено. Вы зовёте обратно одного из тех, кто ушёл вперёд, чтобы найти Сомервеллу место для отдыха. Вы ждёте, пока он сможет рассказать, как себя чувствует. Он кивает, и вы вместе отодвигаете сумку у его ног. Поднявшись, он ждёт, пока Нортон закончит спрашивать, как он себя чувствует.'
        p2: 'Нортон говорит, что свет причиняет боль, и снова закрывает глаза. Вы просите его выбрать, где отдохнуть, и позволяете сиделке в офисе присмотреть за ним. Через некоторое время он говорит, что одно место все еще болит, а другим глазом он может различить свет. Когда служащий снова поднимает список, Нортон сам находит свою строку.'
        p3: 'Оделл открывает чемодан в лагере V и рядом с запасным предметом находит небольшую круглую коробку. Вы сверяете его с сообщением Мэллори и приносите с пометкой. Он открывает его на глазах у другого альпиниста и кладет в карман, который планирует использовать по пути наверх. Он сам убирает компас туда, откуда его можно достать, не снимая рюкзака.'
        p4: 'Кто-то на Северном седле спрашивает, являются ли две фигуры, выходящие из облака, теми людьми, которых они ждут. Вы ждете, пока они назовут свои имена, прежде чем попросить клерка ввести их. Мэллори кладет рюкзак на снег, а Ирвин садится дальше. Они рассказывают о спуске. В лагере никто не знает, добрались ли они до вершины и в котором часу.'
      outcomes:
        all: 'Сомервелл и Нортон возвращаются, и у Мэллори есть компас. Еще два имени занесены в историю, как только они вернулись на Северное седло.'
        p1: 'Оба альпиниста из первой группы возвращаются в лагерь. Следующей паре все равно понадобится кто-то, кто их встретит.'
        p2: 'В этой ветке Нортон видит достаточно хорошо, чтобы самому прочитать написанное рядом. Другие результаты последуют за оставшейся частью поездки.'
        p3: 'У Мэллори компас в кармане, до которого он может дотянуться. Его возвращение оставляет неопределенным их самую дальнюю точку.'
        p4: 'Мэллори и Ирвин живыми возвращаются на Северное седло. Измененный спуск оставляет открытым вопрос, достигли ли они вершины.'
      none: 'Ветер и снег доходят до лагеря, и список никто не меняет. Позже Оделл запишет две фигуры, которые он в последний раз видел на хребте.'
      not_admitted: 'Служитель лагеря не предоставит постороннему человеку место в палатке. Вы ждете снаружи, пока они обсуждают недостающее оборудование.'
      desync: 'Сомервелл никогда не возвращается с Нортоном. Предыдущий спуск рассинхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'Поднявшись, он ждёт, пока Нортон закончит спрашивать, как он себя чувствует.'
        p2: 'Когда служащий снова поднимает список, Нортон сам находит свою строку.'
        p3: 'Он сам убирает компас туда, откуда его можно достать, не снимая рюкзака.'
        p4: 'Они рассказывают о спуске. В лагере никто не знает, добрались ли они до вершины и в котором часу.'
    relic: 'Ледоруб'
    relic_desc: 'Обычный деревянный ледоруб с потертой головкой.'
    points:
      p1: 'Когда Сомервелл задохнется при спуске, помогите ему восстановить дыхание и увидите, как попытка, которую он предпринял с Нортоном, благополучно закончится.'
      p2: 'Вылечить Нортона от снежной слепоты'
      p3: 'Возьмите в руки компас, оставленный Мэллори в лагере V.'
      p4: 'Поверните Мэллори и Ирвина обратно или встретите их на пути вниз, чтобы оба дошли до Северного седла живыми.'
    points_fail:
      p1: 'Сомервелл садится на снег и не встает. Только один из двух альпинистов возвращается. Этот филиал отошел от истории, и офис отзывает сотрудника.'
      p2: 'Глаза Нортона слишком сильно болят, чтобы их открыть, и следующие дни он ничего не видит.'
      p3: 'Компас все еще находится в палатке лагеря V. Когда они поднимаются 8 июня, у них его не оказалось.'
      p4: 'Где-то после полудня 8 июня Оделл в последний раз видел двоих высоко на гребне, которые все еще карабкались. Они не возвращаются.'
    shift:
      p1:
        was: '4 июня 1924 года Нортон и Сомервелл вышли из лагеря VI и достигли высоты около 8570 м; По пути вниз горло Сомервелла было заблокировано обмороженной тканью, и он чуть не задохнулся, закашлялся, и оба добрались до лагеря.'
      p2:
        was: 'В ночь на 4 июня 1924 года Нортон сильно ослеп из-за снега и едва мог видеть после того, как вернулся на Северное седло.'
        now: 'На следующий день глаза Нортона прояснились, и он мог видеть людей, приходящих и уходящих на Северное седло.'
      p3:
        was: '7 июня 1924 года Мэллори отправил Оделлу записку из лагеря VI, в которой говорилось, что он оставил свой компас в палатке лагеря V, а у них его нет.'
        now: 'Когда они отправились рано утром 8 июня, у Мэллори компас был в кармане.'
      p4:
        was: '8 июня 1924 года Оделл в последний раз видел, как Мэллори и Ирвин поднимались высоко на северо-восточный гребень, и ни один из них не вернулся; Тело Мэллори было найдено в 1999 году на высоте около 8160 метров.'
        now: '9 июня они спустились к Северному седлу, обмороженные, но живые. Мэллори уехала домой в Англию, к Рут и их трем детям. Куда они попали в тот день, эта хронология также не дает ответа.'
        who: 'mallory_everest'
        bio: 'В 1924 году он и Ирвин спустились с Эвереста живыми. Он вернулся домой к своей жене Руфи и трем детям и прожил еще много лет.'
    vignettes:
      date: 'У вымышленного посыльного на бланке есть два письма из разных лагерей, но одна общая дата. Вы просите их проверить заголовки отдельно. Каждое письмо уходит со своим местом и датой.'
      question: 'Посланник воспринимает предполагаемый отъезд как обещание. Вы останавливаетесь на предложении, где в письме говорится о погоде. На этот раз они повторяют план, сохраняя при этом условие.'
      wrap: 'Вы откладываете исходящий конверт, пока посыльный сортирует бумаги у него на коленях. Они могут убрать список лагерей, не складывая его в письмо.'
  nightingale_scutari:
    name: 'Сестринское дело: наблюдение и забота'
    place: 'Скутари, Османская империя'
    figure: 'Флоренс Найтингейл'
    story: 'Отчет Флоренс Найтингейл о здоровье армии за 1858 год опирался на недавнюю войну и включал статистику больниц. это не создание окончательного отчета.'
    story_prose:
      opening:
        - 'В Скутари только что сменилась палата. Найтингейл передает клерку список переводов и просит хранить его отдельно от новых поступлений. Санитарная комиссия прибыла, и трое членов комиссии собираются осмотреть окрестности.'
        - 'Санитарная комиссия проинспектировала больницы Скутари в марте 1855 года. Гектор Гэвин погиб в результате несчастного случая в Балаклаве в апреле. В мае Найтингейл серьезно заболел и выздоровел от первой болезни, после чего у нее ухудшилось здоровье. Здесь вы можете сохранить осмотры и изменить, что с ними происходит.'
        - 'Кто-то, знакомый с записями отделения, может помочь проверке продолжить работу. В лагере попросите путешественника присмотреть за Гэвином. Позже кто-то, осуществляющий уход, может спросить Найтингейл, как она хочет отдохнуть.'
      points:
        p1: 'Клерк считает список переводов новыми поступлениями. Вы просите медсестру прочитать оба листа и отметить дубликаты до того, как члены комиссии доберутся до двери. Они могут проследить за отчетом до отделения с проблемой, прежде чем спрашивать о следующем месте. Кто-то выходит с двумя отдельными журналами. В каждом ещё много чистых страниц.'
        p2: 'Гэвин собирается передать револьвер своему брату в палатке. Вы просите обоих сделать паузу, пока человек, ответственный за безопасность лагеря, не придет и не заберет его. За столом внутри Гэвин открывает санитарные записи, которые собирался забрать. Когда днём кому-то нужна его подпись, он всё ещё сидит за тем же столом.'
        p3: 'Найтингейл посылает за таблицей цифр и просит отложить ее, когда она придет. Вы спрашиваете, хочет ли она, чтобы сиделка осталась, и говорите людям, ожидающим ответа, что они придут в другой день. Когда она чувствует себя сильнее, она сначала просит их немного приоткрыть окно. Затем она спрашивает, где она остановилась. Когда она снова открывает отчёт, никто не торопит её с подписью.'
      outcomes:
        all: 'Проверка продолжается вовремя. Гэвин выживает в аварии в этом отделении, а Найтингейл выздоравливает от Мэйской болезни. Она возвращается к работе в темпе, который может выбрать.'
        p1: 'Комиссия начинает проверку и забирает списки, пригодные для дальнейшей работы.'
        p2: 'Гэвин остается в безопасности в лагере. Он может продолжать работу, записанную в его санитарных записях.'
        p3: 'В этой ветке Найтингейл быстрее выздоравливает. Она выбирает, когда будет готова снова открыть фигурки.'
      none: 'Некоторое время в отделении списки остаются смешанными. Люди, ожидающие новостей, все равно будут ждать писем от апреля и мая.'
      not_admitted: 'Носильщик просит людей, не входящих в инспекционную группу, подождать. Вы слышите, как медсестра снова проверяет список переводов.'
      desync: 'Проверка не начинается вовремя. Записи прихода рассинхронизируются, и офис отзывает путешественника.'
      excerpts:
        p1: 'Кто-то выходит с двумя отдельными журналами. В каждом ещё много чистых страниц.'
        p2: 'Когда днём кому-то нужна его подпись, он всё ещё сидит за тем же столом.'
        p3: 'Когда она снова открывает отчёт, никто не торопит её с подписью.'
    relic: 'Маленькая масляная лампа'
    relic_desc: 'Лампа из ее ночных обходов.'
    points:
      p1: 'Несмотря на тиф и холеру в палатах, продолжить проверку Санитарной комиссией больниц Скутари с 6 марта.'
      p2: 'Остановите выстрел из револьвера в палатке в Балаклаве и спасите санитарного комиссара Гектора Гэвина.'
      p3: 'Вылечить крымскую лихорадку, которую Соловей подхватила в Балаклаве в мае, прежде чем она останется с ней на всю оставшуюся жизнь.'
    points_fail:
      p1: 'В больничных палатах не открываются вовремя смотровые стойла и засоренная канализация. Этот филиал выпадает из истории, и офис отзывает сотрудника.'
      p2: 'Выстрел раздается в палатке, и и в этом отделении комиссия через месяц после приземления теряет одного из трех своих членов.'
      p3: 'Лихорадка идет своим чередом. К концу мая она вне опасности, но в этой отрасли, как и в истории, болезнь остается с ней.'
    shift:
      p1:
        was: '6 марта 1855 года Санитарная комиссия прибыла в Константинополь и во второй половине дня приступила к осмотру больниц в Скутари.'
      p2:
        was: '21 апреля 1855 года санитарный комиссар Гектор Гэвин был убит в Крыму, когда его револьвер выстрелил, когда он передавал его своему брату.'
        now: '{staff} просит обоих мужчин сделать паузу. Гэвин кладет револьвер и вызывает человека, ответственного за безопасность лагеря. Он продолжает работу комиссии, а затем возвращается в Великобританию.'
      p3:
        was: 'В мае 1855 года Найтингейл отправился осмотреть больницы в Балаклаве и через несколько дней заразился крымской лихорадкой; она была опасно больна около двенадцати дней и большую часть своей дальнейшей жизни была инвалидом.'
        now: '{staff} лечит лихорадку в первые дни с помощью лекарств, которых нет в столетии. Через неделю Найтингейл встает на ноги и возвращается в Скутари, избавившись от болезни, которая последовала за ней домой.'
        who: 'nightingale_scutari'
        bio: 'В этом отделении Найтингейл вылечилась от лихорадки, которую она подхватила в Балаклаве в 1855 году. Работу по госпиталям и армейскому здравоохранению она выполняла лично, на ногах, а не из палаты больного.'
    vignettes:
      totals: 'Вымышленный клерк добавляет список переводов к общему количеству поступивших. Вы спрашиваете, какие имена вновь приняты. Они оставляют переводы в отдельной колонке перед отправкой возврата.'
      name: 'Клерк не может расслышать имя из-за шума в комнате. Вы ждете рядом с человеком, который дал это, пока он не сможет сказать это еще раз. В следующем экземпляре написано так, как они просили.'
      fold: 'Вы раскладываете документы отделения в том порядке, в котором называет секретарь. Лист, который раньше появлялся после итоговой суммы, теперь появляется перед ней.'
  scott_last_camp:
    name: 'Палатка на шельфовом леднике'
    place: 'Шельфовый ледник Росса'
    figure: 'Роберт Фолкон Скотт'
    story: 'Последняя дневниковая запись Скотта датирована 29 марта 1912 года. Сохранившаяся рукопись описывает последний лагерь группы во время ее возвращения с Южного полюса. Сцена чтения представлена после возвращения бумаг.'
    story_prose:
      opening:
        - 'Когда над шельфовым ледником Росса поднимается ветер, на санях лежит мешок с камнями с ледника. Скотт отодвигает дневник дальше от начала. Никто впереди не может обещать, как далеко они пойдут завтра. Оутс снимает ботинок и спрашивает, где ему можно посидеть где-нибудь сухо.'
        - 'В марте 1912 года по возвращении партия Скотта столкнулась с проблемами. Оутс вышел из палатки и не вернулся. Скотта и еще двоих задержали примерно в одиннадцати милях от склада One Ton Depot. Вы можете хранить дневники и образцы вместе, помогать Оутсу и Скотту по очереди и пытаться доставить оставшуюся партию на склад.'
        - 'Отправьте кого-нибудь, кто сможет справиться с грузом и присмотреть за другими в холода. Пусть воспитатели спросят, что нужно каждому мужчине, а затем дайте достаточно времени самому медленному человеку на последнем этапе.'
      points:
        p1: 'Кто-то предлагает снять один мешок с камнями. Вы просите Уилсона прочитать на бирке место сбора, а Скотта — проверить, где лежит дневник. То, что не понадобится искать в темноте, убирают вниз. Камням и дневнику отводят отдельные места. Когда они сворачивают палатку, на боку саней ещё видно название ледника.'
        p2: 'Оутс пытается открыть багажник и удерживает его там. Он говорит, что на этот раз не сможет идти быстро. Вы просите его сесть в палатке и обсудить планы на завтра с человеком, который останется присматривать за ним. На следующий день, когда открывают вход в палатку, он встаёт, лишь дождавшись, пока его ботинки поставят рядом с остальными.'
        p3: 'Скотт говорит, что его правая нога больше не выдерживает его вес, как левая. Вы звоните человеку, который может за ним присмотреть, и просите людей, которые тянут груз, на некоторое время отключить линию. Вначале он твердо ставит ногу, прежде чем дать команду двигаться. После первого перехода у него ещё хватает сил остановиться и записать в дневнике, сколько они прошли.'
        p4: 'Сугроб прижимается к палатке. Осталось одиннадцать миль. Вы ждете, пока все скажут, что готовы, и по очереди ищете направление вместе с человеком, знающим депо. У флага вы ждете последнего человека, прежде чем кто-нибудь пойдет посмотреть, что внутри. Возле запасов на складе открывается чистая страница. Карандаш всё ещё может идти по ней.'
      outcomes:
        all: 'Дневники и камни достигают склада вместе с группой. Оутс и Скотт преодолевают это расстояние вместе с остальными, и в журнал попадает новый день.'
        p1: 'Записи и образцы хранятся до последних дней. Они остаются в санях, когда группе приходится облегчить груз.'
        p2: 'Оутс остается с группой. На следующей остановке он сможет отдохнуть внутри вместе с остальными.'
        p3: 'Скотт может твердо стоять на ногах. Что произойдет с остальной частью команды, все еще зависит от последнего отрезка.'
        p4: 'Люди, которые делают последний перегон, добираются до депо. В отчете отмечается их прибытие согласно остальной части поездки.'
      none: 'Топливо и силы на исходе. Ветер удерживает палатку на месте, и в конце марта рекорд останавливается.'
      not_admitted: 'Партия не освободила места для новичка. Вы остаетесь снаружи, а топливо и камни все еще находятся под их контролем.'
      desync: 'Дневники или образцы остаются до того, как закончатся исторические записи. Офис отзывает путешественника.'
      excerpts:
        p1: 'Когда они сворачивают палатку, на боку саней ещё видно название ледника.'
        p2: 'На следующий день, когда открывают вход в палатку, он встаёт, лишь дождавшись, пока его ботинки поставят рядом с остальными.'
        p3: 'После первого перехода у него ещё хватает сил остановиться и записать в дневнике, сколько они прошли.'
        p4: 'Возле запасов на складе открывается чистая страница. Карандаш всё ещё может идти по ней.'
    relic: 'Дневник'
    relic_desc: 'Маленький дневник, написанный карандашом, застывший от холода.'
    points:
      p1: 'В походе с нехваткой топлива и слабыми силами держите на санях дневники и образцы горных пород с ледника Бердмор.'
      p2: 'Вылечите обмороженные ноги Оутса, чтобы он мог не отставать от вечеринки и не выходить из палатки около 16 марта.'
      p3: 'До 18 марта спасите правую ногу Скотта от обморожения, которое замедлит всю вечеринку.'
      p4: 'Проведите троих мужчин через метель, которая начнется 21 марта, и пройдите последние одиннадцать миль до склада One Ton Depot.'
    points_fail:
      p1: 'Экземпляры остаются на шельфовом леднике, а дневники не доходят до последнего дня. Этот филиал выпадает из истории, и офис отзывает сотрудника.'
      p2: 'Ногам становится хуже с каждым днём, и в этой ветке он тоже уходит в сугроб около 16 марта и не возвращается.'
      p3: 'Нога замерзает, и по этой ветке, как и в истории, марш замедляется до ползания.'
      p4: 'Вьюга удерживает палатку на месте, и после 29 марта в дневнике нет новой страницы.'
    shift:
      p1:
        was: 'В марте 1912 года, не имея топлива на обратном пути, группа хранила на санях дневники и окаменелости Glossopteris с ледника Бердмор; поисковая группа нашла их вместе с палаткой 12 ноября.'
      p2:
        was: 'В начале марта 1912 года ноги Оутса сильно обморозились, и он замедлил ход; 16 или 17 марта он вышел из палатки, и больше его никто не видел.'
        now: '{staff} греет ноги и меняет носки каждую ночь, и обморожение не усиливается. Оутс идет в ногу с санями и все еще находится с группой в последнем лагере.'
      p3:
        was: '18 марта 1912 года Скотт написал, что почти все пальцы его правой ноги оторвались, и марш еще больше замедлился.'
        now: '{staff} разогревает и бинтует правую ногу в каждом лагере. Скотт держит ногу, и группа движется на север в своем старом темпе.'
      p4:
        was: 'С 21 марта 1912 года метель задержала Скотта, Уилсона и Бауэрса в их палатке в одиннадцати милях от склада One Ton Depot; последняя запись в дневнике датирована 29 марта, а поисковая группа нашла палатку 12 ноября.'
        now: '{staff} ведет троих мужчин на север в затишье и разбивает последние одиннадцать миль на короткие этапы. Они находят топливо и еду на складе One Ton Depot и переживают метель. Перед зимой они вернулись на мыс Эванс.'
        who: 'scott_last_camp'
        bio: 'В этом временном графике Скотт вернулся живым с полюса вместе с Уилсоном и Бауэрсом и достиг мыса Эванс. Он вернулся в Британию и сам редактировал дневники и научные результаты экспедиции.'
    vignettes:
      distance: 'Вернувшись в Агентство, вымышленный клерк записывает расстояние в столбец, заголовок которого соответствует пройденному расстоянию. Вы показываете им, что это еще долгий путь. Они перемещают запись перед сохранением копии.'
      blank: 'Вернувшись в агентство, клерк останавливается на последнем свидании. Вы ждете, пока они решат, как пометить пробел за ним. Пишут, что на этом запись заканчивается, потом кладут карандаш.'
      opening: 'Вернувшись в Агентство, вы открываете практический экземпляр и читаете дату перед рассказом. Клерк ставит ту же дату на титульном листе, чтобы страницы можно было снова найти в порядке.'
  seacole_balaklava:
    name: 'Трактир, до которого она добралась сама'
    place: 'Балаклава'
    figure: 'Мэри Сикол'
    story: 'В мемуарах Мэри Сикол 1857 года описывается отель «Британский», которым она управляла вместе с Томасом Дэйем недалеко от Балаклавы, товары, которые там продавались, и люди, приехавшие туда в 1855 году.'
    story_prose:
      opening:
        - 'Только что открылась стойка гостиницы у Балаклавской дороги. Мэри Сикол подталкивает сумку для временной больницы к двери. Томас Дэй спрашивает, что выставлено на продажу. Она говорит, что сначала позаботится о раненых и вернется к счетам.'
        - '18 июня 1855 года Сикол записывает, как помогала раненым возле временного госпиталя и повредила большой палец. Отель, которым она управляла вместе с Дэй, также столкнулся с кражей. После мира пара обанкротилась в 1856 году. Вы можете сохранить работу в больнице и помочь отдельно ей с травмой, лошадьми и инвентарем.'
        - 'Отправьте кого-нибудь с опытом ухода. Путешественник, знающий отель, может посмотреть конюшню. Позже наймите кого-нибудь, кто сможет проверить бухгалтерские книги обоих партнеров, прежде чем решить, заказывать ли дополнительные акции.'
      points:
        p1: 'Кто-то с дороги спрашивает, можно ли что-нибудь отправить во временный госпиталь. Вы передаете сумку у двери и немного воды, затем уточняете у Сикола, который ждет у кроватей. К тому времени, как она добралась до больницы, человек, который спрашивал, нашел место, где она могла поставить сумку. Она открывает его и спрашивает ближайшего пациента, что ему нужно.'
        p2: 'Сикол поддерживает ее правую руку и говорит, что ей больно двигать большим пальцем. Вы звоните кому-то, кто обучен заботиться о ней, и спрашиваете, где она хочет сидеть. Кто-то другой забирает сумку, которую она несла. Отдохнув, она поднимает руку и говорит, что боль утихла. Затем просит листок, чтобы записать имя пациента.'
        p3: 'Из задней двери доносится шум. Клерк встает и обнаруживает, что за конюшней никто не следит. Один человек позовет Сикола, а другой пересчитает лошадей с того места, откуда виден двор. Тот, кто снаружи, слышит ответ двора и уходит. На рассвете лошади, которых предстоит запрячь в повозку, всё ещё стоят у поилки.'
        p4: 'Дэй собирается навести новый порядок. Сикол просит его вслух пересчитать товары на полках. Вы записываете заказы, запасы и непогашенные долги на одном листе, а затем спрашиваете, что можно продать до ухода армии. Партнеры проверяют его один раз и отменяют следующую поставку. Когда Сикол закрывает счётную книгу, за прилавком остаётся пустая полка для последней выдачи.'
      outcomes:
        all: 'Сикол попадает во временный госпиталь и позже все еще может пользоваться рукой. Конюшня остается полной, и партнеры расплачиваются за нее, когда отель закрывается.'
        p1: 'Как и предполагалось, она присматривает за людьми во временной больнице и вечером того же дня возвращается в отель.'
        p2: 'Кто-то присматривает за ее большим пальцем, и пользоваться ручкой становится легче, когда она возвращается к своим заметкам.'
        p3: 'В ту ночь лошади остаются в конюшне. Утром люди с телегой знают, где их найти.'
        p4: 'Сикол и Дэй сводят счеты. Последняя поставка не оставит у них непроданных запасов, когда войска отправятся домой.'
      none: 'Никто еще не закончил пересчитывать товар, а люди у дороги все еще ждут, когда к ним кто-нибудь придет.'
      not_admitted: 'Продавец просит посетителя не блокировать дверь. Больничная сумка не входит в ваш список.'
      desync: 'Сикол не достигает места, где ей помогла дорога в истории. Офис отзывает путешественника.'
      excerpts:
        p1: 'Она открывает его и спрашивает ближайшего пациента, что ему нужно.'
        p2: 'Отдохнув, она поднимает руку и говорит, что боль утихла. Затем просит листок, чтобы записать имя пациента.'
        p3: 'На рассвете лошади, которых предстоит запрячь в повозку, всё ещё стоят у поилки.'
        p4: 'Когда Сикол закрывает счётную книгу, за прилавком остаётся пустая полка для последней выдачи.'
    relic: 'Аптечка'
    relic_desc: 'Старый деревянный сундук с отделениями для трав и марли.'
    points:
      p1: '18 июня, в день провала штурма Редана, держите Сикол на работе под обстрелом рядом со временным госпиталем на Воронцовской дороге.'
      p2: 'Когда она бросится со снаряда и вывихнет большой палец правой руки, вправьте сустав и наложите шину на месте.'
      p3: 'Остановите воров, которые ночью приходят за лошадьми Британского отеля.'
      p4: 'После падения Севастополя убедить Сикола и Томаса Дэй прекратить покупать акции и погасить свои счета, чтобы мир не оставил их банкротами.'
    points_fail:
      p1: 'В тот день она так и не добралась до временного госпиталя, а раненые ждут у дороги без повязок. Этот филиал выпадает из истории, и офис отзывает сотрудника.'
      p2: 'Большой палец перевязывают лишь в спешке, и в этой отрасли, как и в истории, он никогда не возвращается в свою правильную форму.'
      p3: 'К утру половина конюшни пустует, и отелю приходится одалживать животных в лагере наземного транспорта, чтобы доставить товар.'
      p4: 'Когда после заключения мира армия уйдет, акции не будут продаваться, и в ноябре 1856 года оба партнера будут объявлены банкротами в Лондоне.'
    shift:
      p1:
        was: '18 июня 1855 года, в день провала атаки союзников на Редан, Сикол под обстрелом отнес бинты и еду во временный госпиталь на Воронцовской дороге и помог врачам с ранеными.'
      p2:
        was: '18 июня 1855 года Сикол бросилась вниз, спасаясь от снаряда, и вывихнула большой палец правой руки; он был связан на месте и так и не вернулся в свою правильную форму.'
        now: '{staff} тут же вправляет сустав и шинирует его. Через несколько недель ее правая рука, как и прежде, смешивает лекарства и завязывает бинты.'
      p3:
        was: 'В 1855 году Британский отель в Спринг-Хилле снова и снова подвергался ограблениям; однажды утром большая часть его лошадей исчезла.'
        now: '{staff} останавливает мужчин, уводящих лошадей во время ночного дежурства. На следующий день тележки отеля, как обычно, спускаются в Балаклаву.'
      p4:
        was: 'После мира в марте 1856 года армия быстро ушла, а Сикол и Дэй остались с непроданными товарами и долгами; В октябре 1856 года против них было подано заявление о банкротстве, а в ноябре они были объявлены банкротами.'
        now: 'Осенью {staff} убеждает двух партнеров прекратить выполнение крупных заказов и взыскать причитающуюся им задолженность. Когда наступит мир, их акции невелики, они уедут из Крыма с погашенными счетами и никогда не предстанут перед судом по делам о банкротстве.'
        who: 'seacole_balaklava'
        bio: 'На данном этапе Сикол вернулась домой из Крыма, не будучи банкротом и имея некоторый собственный капитал. Ей не пришлось жить на общественную подписку, и она продолжала ухаживать за больными и путешествовать на свои деньги.'
    vignettes:
      meal: 'Вымышленный покупатель стоит так долго, что не может объяснить, зачем пришел. Сначала ты найди место. К моменту возвращения обслуживающего персонала клиент может попросить ужин своими словами.'
      counter: 'Два клиента повторяют один и тот же заказ, каждый из которых думает, что другого не услышали. Вы просите дежурного перечитать то, что они написали. Одного лотка оказывается достаточно.'
      shelf: 'Дежурный требует места в конце стойки. Вы перемещаете две пустые тарелки и ставите табурет, на котором ожидающий гость может сидеть, не задерживая следующего клиента.'
  wegener_greenland:
    name: 'Через ледяной щит'
    place: 'Ледяной щит Гренландии'
    figure: 'Альфред Вегенер'
    story: 'Вегенер достиг внутренней станции Айсмитте в 1930 году с припасами и умер на обратном пути. В отчете Института Альфреда Вегенера сохранена последовательность экспедиции и указан его гренландский спутник Расмус Виллумсен.'
    story_prose:
      opening:
        - 'Груз саней на льду Гренландии снова подсчитан. Вегенер спрашивает, сможет ли Loewe стоять на ногах. Виллумсен говорит, что как только видимость улучшится, они должны будут узнать место, которое еще впереди, как Айсмитте.'
        - 'В октябре 1930 года Альфред Вегенер, Фриц Леве и Расмус Виллумсен достигли Эйсмитте. Леве остался. Вегенер умер на обратном пути, а Виллумсен и дневник, который он взял с собой, пропали. В этой ветке вы можете сохранить прибытие и помочь каждому человеку в разных точках пути.'
        - 'Отправьте кого-нибудь с опытом работы по снегу, чтобы помочь группе передвигаться и передавать припасы. Попросите лиц, осуществляющих уход, проверить Loewe и Wegener отдельно. Убедитесь, что западный лагерь знает, когда ожидать Виллумсена.'
      points:
        p1: 'Видна только задняя часть саней. Виллумсен просит вечеринку на время закрыться. Вы отмечаете припасы для передачи на первом листе и просите последнего человека назвать каждый из них, прежде чем вы все пройдете оставшееся расстояние. Когда люди со станции выходят, они пересчитывают и людей, и оставленный рядом багаж.'
        p2: 'Лоу дает отдых обмороженным ногам и спрашивает, куда делись сухие носки. Вы просите опекуна услышать, что он говорит, прежде чем кто-то другой нападет на него. Несколько дней спустя его спрашивают, хочет ли он попробовать сесть в другом месте. Он берёт то, что висело у его кровати, и пересаживается на выбранный табурет.'
        p3: 'Кто-то начинает складывать дневник в сумку с бумагами. Виллумсен просит сначала показать это. Вы позволяете ему выбрать, куда он может добраться, и сообщаете, что его должен ждать западный лагерь. Когда подъезжают сани, кто-то выходит вперед, чтобы забрать его вещи. Виллумсен берёт дневник возле своего багажа и передаёт его сам.'
        p4: 'По возвращении в палатке Вегенер спрашивает, может ли кто-нибудь сообщить заранее. Вы выносите запрос на улицу, затем возвращаете опекуна, чтобы спросить, как долго он хочет отдохнуть. Когда группа достигает западного лагеря, человек у двери приносит одеяла и просит их сесть. Вегенер всё ещё дрожащей рукой сам вписывает своё имя в список прибывших.'
      outcomes:
        all: 'Вечеринка по оказанию помощи назначает дату, и Loewe получает помощь. Позже Вегенер и Виллумсен достигают западного лагеря, и дневник передается ожидающим его людям.'
        p1: 'Группа прибывает на станцию 30 октября, и поставки проверяются по списку.'
        p2: 'Ноги Лоу улучшаются после лечения на станции, и в этом отделении он избегает операции.'
        p3: 'Виллумсен и дневник возвращаются в западный лагерь. Отчет повторяет собственные результаты Вегенера для остальной части пути.'
        p4: 'Вегенер достигает западного лагеря живым. Передача дневника по-прежнему зависит от того, что случилось с Виллумсеном.'
      none: 'Последний переход по льду занимает все больше времени. В списке прибывших на западе все еще есть пустая строка.'
      not_admitted: 'В списке припасов нет места для посетителя. Кто-то просит вас держаться подальше от людей, работающих у саней.'
      desync: 'Вечеринка пропускает прибытие 30 октября. Передача не синхронизирована, и офис отзывает путешественника.'
      excerpts:
        p1: 'Когда люди со станции выходят, они пересчитывают и людей, и оставленный рядом багаж.'
        p2: 'Он берёт то, что висело у его кровати, и пересаживается на выбранный табурет.'
        p3: 'Виллумсен берёт дневник возле своего багажа и передаёт его сам.'
        p4: 'Вегенер всё ещё дрожащей рукой сам вписывает своё имя в список прибывших.'
    relic: 'Санный ремень'
    relic_desc: 'Замерзший кожаный ремень от груженых саней.'
    points:
      p1: 'Продолжайте движение группы помощи через последний участок льда, чтобы Вегенер, Лёве и Виллумсен достигли Айсмитте 30 октября.'
      p2: 'Вылечите обмороженные ноги Лоу, чтобы ему не пришлось отрезать пальцы в ледяной пещере'
      p3: 'Обеспечьте безопасность Виллумсену на пути на запад, чтобы он добрался до лагеря с дневником Вегенера.'
      p4: 'Угостите Вегенера на льду на обратном пути, чтобы он живым дошел до западного лагеря.'
    points_fail:
      p1: 'Из-за холода партия держится на льду и 30 октября не доходит до станции. Этот филиал отошел от истории, и офис отзывает сотрудника.'
      p2: 'Обмороженные пальцы ног Лоу спасти не удалось. Той зимой на станции их отрезали, и он не смог идти до весны.'
      p3: 'Виллумсен похоронил Вегенера и отправился с дневником на запад. Больше его никто не видел, и дневник затерялся вместе с ним.'
      p4: 'Вегенер умер на обратном пути, примерно в середине ноября, в палатке на льду. Его нашли в мае следующего года.'
    shift:
      p1:
        was: '30 октября 1930 года: после сорока дней пребывания на льду Вегенер, Лёве и Виллумсен достигают станции Айсмитте в центре ледникового покрова.'
      p2:
        was: 'Зима 1930 года: в Айсмитте Лёве отрезают обмороженные пальцы на ногах перочинным ножом, и он не может ходить до конца зимы.'
        now: 'Лоу держал пальцы ног. Зиму он провел на станции на своих ногах.'
      p3:
        was: 'Ноябрь 1930 года: Виллумсен хоронит Вегенера на льду, берет его дневник и отправляется на запад. Его никогда не находят.'
        now: 'Виллумсен добрался до западного лагеря и передал в руки экспедиции дневник Вегенера.'
        bio: 'Расмус Виллумсен вернулся со льда в ноябре 1930 года и поехал домой к семье в Гренландию.'
      p4:
        was: '1 ноября 1930 г.: Вегенер покидает Эйсмитте в день своего пятидесятилетия. Он погибает на льду примерно в середине ноября, а его тело найдено 12 мая 1931 года.'
        now: '{staff} оставался с ним всю обратную дорогу и каждую ночь следил за его силой. Он вошел в западный лагерь живым и дожил до того, чтобы увидеть результаты экспедиции.'
        who: 'wegener_greenland'
        bio: 'Вегенер вернулся живым из середины ледникового покрова в ноябре 1930 года. Он прожил еще много лет и увидел, как отрабатываются наблюдения экспедиции.'
    shift_all: 'В этой временной шкале все, кто входил и выходил из Эйсмитте той осенью, вернулись на побережье живыми.'
    vignettes:
      names: 'Вымышленный клерк называет экспедицию только одной фамилией. Вы спрашиваете, кто передал груз. Они оставляют очередь для других участников вместо того, чтобы записать только самое известное имя.'
      count: 'Продавец сделал первый подсчет похожим на доставленное количество. Вы просите их отметить, с какой станции прибыла каждая фигурка. Эти два итога больше не относятся к одному и тому же заголовку.'
      note: 'Вы копируете пункт назначения на второй бланк, пока клерк подвязывает пустую бухгалтерскую книгу. Следующий человек все равно сможет сказать, к какой станции относятся записи.'
  tupaia_tahiti:
    name: 'Карта мореплавателя'
    place: 'На борту «Индевора»'
    figure: 'Тупайя'
    story: 'Тупайя, мореплаватель из Райатеи, присоединился к «Индевору» в 1769 году и помог нанести на карту известные ему острова. В июне 1770 года корабль налетел на риф у территории нынешнего Квинсленда. Бэнкс зафиксировал цингу Тупайи во время ремонта и сообщил о смерти Тайаты и Тупайи позже в том же году в Батавии.'
    story_prose:
      opening:
        - 'На «Индеворе» Тупайя проверяет названия островов, которые он знает, когда корабль наносит удар. Сверток соскальзывает с угла стола, и сторож зовет на помощь. Еще темно, когда они узнают, что корабль стоит на рифе.'
        - 'В 1770 году «Индевор» наткнулся на риф у современного Квинсленда. Экипаж снял его с мели и отремонтировал. В этот период Тупайя заболел, и несколько месяцев спустя Бэнкс записал известие о смерти Тайаты и Тупайи в Батавии. Филиал может сохранить корабль, доставить Тупайе свежие продукты и провести время вместе, когда они заболеют.'
        - 'Отправьте кого-нибудь, кто сможет помочь команде оставаться на своих местах. Во время ремонта кто-нибудь должен спросить Тупайя, что ему можно есть. В Батавии группе нужно время, чтобы договориться о визите у постели больного.'
      points:
        p1: 'Ящик загораживает проход, по которому поднимают груз из трюма. Вы освобождаете место для сменщика у помпы и даёте пройти морякам с ящиком. На другом конце матросы остаются у каната и ждут сигнала тянуть вместе. Когда судно сдвигается, первым делом спрашивают, удержался ли на ногах человек у помпы.'
        p2: 'Свежие продукты в первую очередь отправляются ремонтным партиям. Тупайя слышит, как называют имена, и спрашивает, сколько еще ему придется ждать. Вам приносят порцию, где он может выбрать, что он хочет съесть, а затем записать, что осталось для следующей группы. Когда ему подают тарелку, он первым выбирает из того, что для него отложили.'
        p3: 'В палате Батавии много больных, и постоянно вызывают одних и тех же сиделок. Тупайя просит кого-нибудь узнать, увидит ли его Тайата. Вы передаете вопрос и ждете, пока оба согласятся, прежде чем пододвинуть стул к кровати. Когда вы уходите, они всё ещё слышат друг друга.'
      outcomes:
        all: 'Корабль освобождается, как и в истории. Филиал также записывает долю еды, которую Тупайя получала, и их визиты к постели больного. Новость об обеих смертях осталась в протоколе.'
        p1: 'Endeavor предоставляется бесплатно. Ремонтным партиям предстоит еще больше работы; дальнейшие приготовления еще предстоит принять.'
        p2: 'Тупайя получает выбранную им долю. Эта часть пластинки заканчивается, когда ему подносят пластинку.'
        p3: 'Эти двое находятся достаточно близко, чтобы поговорить некоторое время. Смерти в Батавии продолжаются.'
      none: 'Люди все еще ждут следующего заказа на палубе. Никакой новой доли не было выделено, и последующий визит не был назначен.'
      not_admitted: 'Экипаж просит посторонних людей очистить станцию у насоса. С другого конца вы видите, как кто-то поднимает мокрую пачку бумаг.'
      desync: '«Индевор» все еще быстро движется на рассвете. Историческое восстановление не синхронизировано, и офис отзывает путешественника.'
      excerpts:
        p1: 'Когда судно сдвигается, первым делом спрашивают, удержался ли на ногах человек у помпы.'
        p2: 'Когда ему подают тарелку, он первым выбирает из того, что для него отложили.'
        p3: 'Когда вы уходите, они всё ещё слышат друг друга.'
    relic: 'Эскиз островов'
    relic_desc: 'Лист чернил и размывки с небольшими островными формами и названиями.'
    points:
      p1: 'В ту ночь, когда корабль ударится о риф, помогите осветить его, запустить насосы и удержать «Индевор» на плаву.'
      p2: 'Отложите для Тупаи свежую еду, пока доставляются ремонтные бригады, и позвольте ему самому выбирать, что ему есть.'
      p3: 'В Батавии найдите время, чтобы Тупайя посидела с Таятой и спросила, кого они хотят видеть рядом, пока они больны.'
    points_fail:
      p1: 'На рассвете корабль все еще стоит на рифе, а вода захлестнула трюм. Филиал отходит от истории, и бюро отзывает сотрудника в тот день.'
      p2: 'Свежие запасы в первую очередь поступают в ремонтные партии. Тупайе приходится ждать акции.'
      p3: 'Окружающих их людей вызывают на другие койки больных. Визит, о котором просил Тупайя, придется подождать.'
    shift:
      p1:
        was: '10–11 июня 1770 года: «Индевор» наткнулся на то, что сейчас является рифом Индевор. Экипаж выбросил за борт шесть орудий, балласт, воду и испорченные запасы, и она уплыла с приливом.'
      p2:
        was: '16 июня 1770 г.: Бэнкс написал, что у Тупайя тяжелая цинга, у него исчезли десны и на ногах появились синюшные пятна, и что лекарства, имевшиеся на борту, не помогли.'
        now: 'В этом филиале Тупайя получает долю свежих продуктов, пока корабль ремонтируется. Он может выбирать, что поесть, не выходя предварительно что-нибудь поймать.'
      p3:
        was: 'В Батавии Бэнкс получил известие о смерти Тайаты, а затем и о смерти Тупаи.'
        now: 'В этой ветке {staff} предоставляет место, где Тупайя может сидеть рядом с Тайатой. Они выбирают, кто сможет остаться и немного поговорить вместе.'
    vignettes:
      pronounce: '{staff} просит переписчика, созданного для игры, прочитать вслух два варианта написания, прежде чем нарисовать второй остров, и вместо этого ставит вопросительный знак возле названий.'
      route: '{staff} спрашивает, от какого острова был задан пеленг, прежде чем между двумя отметками будет проведена прямая линия, и линия останется непрорисованной.'
      room: '{staff} удерживает свернутый угол листа, чтобы можно было написать новое имя, не закрывая предыдущее.'
  ulugh_beg_samarkand:
    name: 'Дорога из Самарканда'
    place: 'Самарканд'
    figure: 'Улугбек'
    story: 'Улугбек построил обсерваторию в Самарканде и вел каталог из 1018 звезд. Осенью 1449 года он лишился власти и получил разрешение поехать в Мекку. Он был убит под Самаркандом в конце октября. Дата на его могиле — 27 октября, на два дня позже даты, указанной в другом источнике.'
    story_prose:
      opening:
        - 'В Самарканде рядом со только что поставленными звездными столиками лежит сверток в дорогу. Улугбек уступил власть, и партия ждет снаружи. Кто-то спрашивает, где они собираются провести первую ночь за городом.'
        - 'Улугбек принимал участие в астрономических работах в Самарканде. В 1449 году он был убит после выхода из города. Здесь вы можете проверить, где он остановится на первом матче, и спросить, хочет ли он компании.'
        - 'Отправьте кого-нибудь, кто сможет поговорить с отрядом и присмотреть за путешественником. Спросите Улугбека, где он желает остановиться, а затем проверьте, сможет ли дом его принять.'
      points:
        p1: 'Улугбек говорит, что кто-то уже позвонил за багажом, и он не знает, где сможет пересидеть этой ночью. Вы говорите товарищу, что дом дальше может оставить дверь открытой, а затем спрашиваете Улугбека, хочет ли он пойти с вами. Он оставляет звездные столики на чью-то опеку и берет с собой легкую сумку. Добравшись до места, он предлагает присесть и тому, кто его привёл.'
      outcomes:
        all: 'Улугбек достигает места ночлега после выхода из города. В этой ветке есть новость о том, что этой ночью он в безопасности.'
        p1: 'Кто-то сопровождает его до места, где он согласился остаться. Звездные столы остаются в городе.'
      none: 'Он уходит с людьми, уже ожидающими багажа. Следующая новость — его убили за городом.'
      not_admitted: 'Посетителя на вечеринку не пускают. Столы остаются внутри, а люди снаружи уходят с багажом.'
      excerpts:
        p1: 'Добравшись до места, он предлагает присесть и тому, кто его привёл.'
    relic: 'Промах с двумя источниками'
    relic_desc: 'Две отмеченные строки обозначают старое положение звезды и новое наблюдение.'
    points:
      p1: 'После того как Улугбек откажется от власти, организуйте для него место, где он сможет остановиться на первом этапе пути, и предложите пойти с ним.'
    points_fail:
      p1: 'Он уходит с уже ожидающей его компанией. Следующая новость, которую вы услышите, это то, что он был убит недалеко от города.'
    shift:
      p1:
        was: 'Отказавшись от власти, Улугбек выступил из Самарканда и был убит недалеко от города в конце октября 1449 года.'
        now: 'В этой ветке {staff} отправляется с Улугбеком в место, где он согласился остаться. Он выживает в путешествии из Самарканда.'
        who: 'ulugh_beg_samarkand'
        bio: 'В этой временной шкале Улугбек благополучно покинул Самарканд осенью 1449 года и жил дальше.'
    vignettes:
      source: '{staff} добавляет начало узкого столбца к листу переписчика, чтобы позиция, взятая из старой таблицы, и позиция, измеренная сегодня вечером, не находились на одной линии.'
      arc: '{staff} прокладывает шнур по изгибу траншеи для дуги и проводит его вплотную к каменщикам, чтобы убедиться в правильности изгиба.'
      hold: '{staff} сидит у дуги с жаровней и доской и записывает показания каждый раз, когда его вызывают, пока звезда не опустится под стену.'
  darwin_galapagos:
    name: 'Острова и разнообразие жизни'
    place: 'Галапагосские острова'
    figure: 'Чарльз Дарвин'
    story: 'Дарвин посетил Галапагосские острова на корабле «Бигль» с сентября по октябрь 1835 года. На острове Чарльз вице-губернатор Лоусон рассказал ему, что черепахи различаются от острова к острову; Позднее Дарвин писал, что он тогда не уделил должного внимания и уже смешал коллекции двух островов. С 8 по 17 октября он, Байно и их слуги разбили лагерь на острове Джеймса, пока корабль шел за водой, и возле палатки был только бедный родник. В его заметках о птицах экземпляры пересмешников связаны с конкретными островами.'
    story_prose:
      opening:
        - '«Бигль» высадил группу Дарвина на берег и отправился на воду в другом месте. Палатки на острове Джеймс только что встали. Небольшой родник возле лагеря течет медленно, и на одном листе бумаги написаны две надписи с птицами.'
        - 'В 1835 году исполняющий обязанности губернатора Лоусон сказал Дарвину, что черепах на островах можно отличить друг от друга. Позже Дарвин писал, что не обратил на это должного внимания. Группа острова Джеймс ждала корабль с небольшим количеством воды. Вы можете сохранить отличия раньше и помочь береговой группе закончить сбор.'
        - 'Тот, кто наблюдает за образцами и этикетками, может услышать разговор Лоусона с Дарвином. На остров Джеймс отправьте кого-нибудь, кто сможет помочь береговой группе с водой и лагерными припасами.'
      points:
        p1: 'Фляга почти пуста, а у родника все еще ждут два человека. Вы подсчитываете, сколько воды осталось и скольким людям она нужна, затем просите гида поговорить с мужчинами, которые ранее принесли воду. Как только вода прибывает, Байно просит принести оставшиеся пакеты из палатки. Когда судно возвращается в бухту, последние свёртки ждут у опустевших фляг.'
        p2: 'Лоусон говорит, что может отличить остров по форме панциря черепахи. Дарвин спрашивает название одного места и собирается идти дальше. Вы открываете два пакета с образцами и перечитываете, где он их собрал. Места, которые он не может подтвердить, оставляют на проверку, а позже образцы отправляют в отдельные обертки. Первый свёрток перевязан новой бечёвкой, а снаружи написано название острова.'
      outcomes:
        all: 'Имена и отдельные пакеты можно сверить друг с другом. Группа с острова Джеймс также возвращается на корабль, завершив сбор.'
        p1: 'Береговая вечеринка длится до возвращения корабля и загрузки образцов. Некоторые из более ранних названий островов остаются неопределенными.'
        p2: 'Часть островных записей хранится отдельно. Позже лагерь терпит неудачу, и в поездке сохраняется момент проверки имен на острове Чарльз.'
      none: 'Фляжки у источника по-прежнему единственные в лагере, а более ранние пакеты до сих пор имеют неопределенные названия.'
      not_admitted: 'Посетитель отсутствует в береговом списке. Пакет уже находится в лодке, и этикетку невозможно прочитать с палубы.'
      desync: 'В лагере заканчивается вода до того, как сбор воды на острове Джеймс может быть завершен. Офис отзывает путешественника.'
      excerpts:
        p1: 'Когда судно возвращается в бухту, последние свёртки ждут у опустевших фляг.'
        p2: 'Первый свёрток перевязан новой бечёвкой, а снаружи написано название острова.'
    relic: 'Перо зяблика'
    relic_desc: 'Маленькое коричневое перо с островов.'
    points:
      p1: 'На острове Джеймс, где в лагере есть один плохой источник, продолжайте береговую вечеринку до тех пор, пока корабль не вернется, и посмотрите, как будет завершен сбор урожая на острове.'
      p2: 'Когда Лоусон говорит, что черепахи различаются на разных островах, пусть Дарвин тут же примет это к сведению и держит птиц на каждом острове помеченными и упакованными отдельно.'
    points_fail:
      p1: 'У береговой группы заканчивается вода, а сбор урожая на острове Джеймс так и не производится. Эта ветвь потеряла связь с историей, и в тот день бюро отзывает сотрудника.'
      p2: 'Как и в истории, Дарвин мало обращает внимания на Лоусона. Коллекции островов Чатем и Чарльз уже смешаны, и у большинства вьюрков нет островов.'
    shift:
      p1:
        was: 'С 8 по 17 октября 1835 года: Дарвин, Байно и их слуги разбили лагерь на острове Джеймс с палаткой и провизией, пока «Бигль» отправился за водой; возле лагеря был только бедный родник.'
      p2:
        was: 'Конец сентября 1835 года: на острове Чарльз вице-губернатор Лоусон сказал Дарвину, что черепах на каждом острове можно отличить друг от друга. Позже Дарвин писал, что он не уделил должного внимания, уже смешал коллекции двух островов и перепутал большую часть своих вьюрков.'
        now: 'В тот день он поверил Лоусону на слово и привез домой в Англию птиц каждого острова, помеченных и упакованных отдельно.'
        who: 'darwin_galapagos'
        bio: 'На этой временной шкале Дарвин слушал Лоусона на Галапагосских островах, собирал и маркировал вьюрков и пересмешников остров за островом, прежде чем отвезти их домой в Англию.'
    vignettes:
      two_tags: 'На одной бирке написано только «остров». Вы откладываете его до тех пор, пока помощник не найдет отдельную посадочную заметку. Два экземпляра остаются отдельно даже после того, как лотки убраны.'
      differences: 'Помощник указывает на двух похожих птиц и хочет, чтобы для обеих была одна запись. Вы спрашиваете, с какого острова прибыл каждый. Они оставляют обе метки в книге, чтобы позже можно было снова рассмотреть сходство.'
      drawer: 'Вы держите бумажную этикетку рядом с лотком до тех пор, пока помощник не сможет прочитать вам название. Когда они закроют ящик, записка останется на своем месте.'
  finlay_havana:
    name: 'Комары и жёлтая лихорадка'
    place: 'Гавана'
    figure: 'Карлос Финлей'
    story: 'Карлос Финлей представил гипотезу передачи желтой лихорадки комарами в Гаване в 1881 году. Название его статьи идентифицирует ее как гипотезу.'
    story_prose:
      opening:
        - 'В Гаване по-прежнему жарко. Финлей кладет бумагу, которую собирается прочитать, на кафедру и хранит записи по делу под письмом. Кто-то приходит за первой строкой, чтобы поставить на повестку дня. Финлей отчетливо произносит слово «гипотетически».'
        - '14 августа 1881 года Финлей представил свою гипотезу желтой лихорадки, связанную с комарами, в Гаванской академии. Городские меры по борьбе с комарами последовали гораздо позже. Эта ветвь может сохранить чтение и предложить участникам подумать, насколько записи подтверждают его предложения.'
        - 'Кто-нибудь, хорошо владеющий документами, может проверить копию для академии. Кто-то, кто может организовать обсуждение, может организовать его рассмотрение членами и внести в город предложение по публичной борьбе с комарами.'
      points:
        p1: 'Клерк говорит, что одна страница никогда не проверялась и не может быть открыта вместе с остальными. Вы сопоставляете обертки со списком Финлей и находите недостающий лист в складках коробок. Финлей снова закрывает копию для чтения. Когда подходит его очередь, секретарь зачитывает заглавие с листа, который Финлей держит в руке.'
        p2: 'Член, ближайший к двери, уже надел шляпу после чтения. Вы просите его прослушать еще одно предложение и сказать, какую запись он хотел бы просмотреть. Он сидит и спрашивает об одном случае. Другой участник ставит на полях дату возвращения. Финлей поднимает нужные листы и ждёт, пока оба поймут, о каких бумагах речь.'
        p3: 'Копия для города начинается с утверждения теории. Вы просите Финлей перечислить наблюдения отдельно от вопросов, которые еще предстоит проверить. Городской комитет соглашается профинансировать более раннее испытание общественной борьбы с комарами. Прежде чем поставить печать, секретарь возвращает на лист слово «гипотеза».'
      outcomes:
        all: 'Документ заслушивается, и дела проходят второе чтение. Общественная борьба с комарами в этой отрасли начинается раньше, но результаты еще предстоит увидеть.'
        p1: 'Академия прослушивает доклад и сохраняет копию. Члены еще не решили, будут ли предпринимать дальнейшие действия.'
        p2: 'Несколько слушателей остаются, чтобы спросить о пластинках. Дата рассмотрения указывается в примечаниях. Город еще не принял меры.'
        p3: 'Предложение о муниципальном суде получает ответ. В отчете фиксируются предыдущие действия в этой отрасли.'
      none: 'Комната пустеет. Никто не указал дату второго обсуждения.'
      not_admitted: 'Впускают только тех, кто стоит на повестке дня. Снаружи слышно, как клерк объявляет первый пункт.'
      desync: 'Читающую копию собрать невозможно. Академия не слушает доклад Финлей от 14 августа и отзывает путешественника.'
      excerpts:
        p1: 'Когда подходит его очередь, секретарь зачитывает заглавие с листа, который Финлей держит в руке.'
        p2: 'Финлей поднимает нужные листы и ждёт, пока оба поймут, о каких бумагах речь.'
        p3: 'Прежде чем поставить печать, секретарь возвращает на лист слово «гипотеза».'
    relic: 'Стеклянная пластинка с комарами'
    relic_desc: 'Навесная горка с москитным крылом.'
    points:
      p1: 'В сезон лихорадки храните его статью и записи дела в безопасности, чтобы он прочитал статью Академии 14 августа, как и планировалось.'
      p2: 'После прочтения убедите нескольких членов Академии остаться и просмотреть его дела, чтобы статья не осталась в молчании.'
      p3: 'Помогите ему представить комаров и случаи в качестве убедительных доказательств, чтобы город начал борьбу с комарами на несколько лет раньше.'
    points_fail:
      p1: 'Материалы дела были утеряны в сезон лихорадки, и 14 августа газета не была прочитана. Этот филиал вышел из истории, и офис отозвал сотрудника.'
      p2: 'Зал молчал, и никто не просил показать ни одного случая. В этой ветке бумага была отложена, как это было в истории.'
      p3: 'Его доказательства остались такими же слабыми, как и раньше. В этом филиале город все еще ждал около двадцати лет, прежде чем начать действовать против комаров, и до тех пор лихорадка возвращалась каждое лето.'
    shift:
      p1:
        was: '14 августа 1881 года Карлос Финлей прочитал свою статью о комарах как гипотетическом возбудителе желтой лихорадки Королевской академии наук в Гаване.'
      p2:
        was: '14 августа 1881 года его чтение было встречено молчанием, и в течение многих лет эта идея высмеивалась.'
        now: 'Несколько членов остались в тот вечер и попросили показать записи его дела.'
      p3:
        was: 'С 1881 года Финлей потратил почти двадцать лет, пытаясь доказать, что комары переносят желтую лихорадку; только в 1900 году руководство армии Соединенных Штатов, используя комаров, выведенных из его яиц, доказало его правоту.'
        now: '{staff} помог ему расположить комаров и ящики рядом, пока не будут собраны доказательства. В этом временном графике Гавана начала борьбу с комарами несколькими годами раньше, и лихорадка покинула город раньше. В Финлей верили в его время.'
        who: 'finlay_havana'
        bio: 'В этом отношении идея Финлей о комарах была принята в течение нескольких лет после 1881 года, а Гавана реализовала ее задолго до 1900 года.'
    vignettes:
      headline: 'Вымышленный редактор превращает в заголовке предположение в уверенность. Вы медленно перечитываете заголовок. Они снова вставили слово «гипотеза», прежде чем приступить к доказательству.'
      columns: 'Редактор читает их заметки так, как будто каждая строка означает одно и то же. Вы правите две колонки за то, что наблюдалось и что было предложено. Предложение меняет колонки.'
      place: 'Вы проверяете название места, где была прочитана статья. Редактор помещает ее рядом с датой, чтобы отчет не превращал встречу в другую.'
  humboldt_chimborazo:
    name: 'Расселина выше снежной линии'
    place: 'Чимборасо, Эквадор'
    figure: 'Александр фон Гумбольдт'
    story: '23 июня 1802 года Гумбольдт поднялся на Чимборасо вместе с Эме Бонпланом и Карлосом Монтуфаром. Носильщики не пошли дальше; у троих продолжалось кровотечение из носа, рвота и головокружение, пока глубокая оврага под вершиной не остановила их, и они не повернули назад.'
    story_prose:
      opening:
        - 'Над снежной линией Чимборасо Бонплан протягивает Гумбольдту барометр, чтобы освободить руку для его сумки. Монтуфар останавливается так, чтобы видеть вперед. Вы не можете увидеть дальнюю сторону оврага, на который он указывает, пока облако не двинется.'
        - '23 июня 1802 года группа Гумбольдта поднялась на Чимборасо и повернула обратно в глубокий овраг. Эта ветка позволяет группе найти способ продолжить работу. Отчет о саммите имеет значение только тогда, когда все соберутся.'
        - 'Отправьте кого-нибудь, кто сможет присмотреть за спутниками на высоте. Даже имея в наличии офисное снаряжение, спросите каждого альпиниста, хотят ли они продолжать восхождение.'
      points:
        p1: 'Кто-то подходит к краю снега и возвращается, чтобы сказать Гумбольдту, что ему негде твердо стоять. Вы оставляете группу на безопасной территории, пока остальные не осмотрят местность и каждый не решит, идти ли дальше. Гумбольдт и Бонплан по очереди несут инструмент. На обратном пути Монтуфар остается там, где он может видеть обоих. Лишь у камня, где они отдыхали, они достают полстраницы, исписанные на вершине.'
      outcomes:
        all: 'Все альпинисты достигают вершины и возвращаются на место отдыха. В отчете указано время, когда они спустились возле входа на вершину.'
        p1: 'Группа поднимается по тому пути, который нашли в этой ветке, и возвращается в том порядке, который был оговорен перед восхождением.'
      none: 'Группа видит овраг и поворачивает назад. Там, где ждут остальные, в его записях указана фактически достигнутая высота и то, что они могли видеть.'
      not_admitted: 'Когда группа ушла, для гостя не было места. Ниже вы получите пустой футляр для инструмента.'
      excerpts:
        p1: 'Лишь у камня, где они отдыхали, они достают полстраницы, исписанные на вершине.'
    relic: 'Барометр'
    relic_desc: 'Ртутный барометр с отметками высот на стекле.'
    points:
      p1: 'Прежде чем 23 июня глубокий овраг преградит путь, помогите группе выстоять против горной болезни, найти путь через реку, достичь вершины Чимборасо и безопасно спуститься.'
    points_fail:
      p1: 'Как и в истории, они поворачивают обратно у оврага, ниже вершины.'
    shift:
      p1:
        was: '23 июня 1802 года: Гумбольдт, Бонплан и Карлос Монтуфар поднялись на Чимборасо с кровотечением из носа, рвотой и головокружением, пока глубокая оврага под вершиной не остановила их, и они не повернули назад.'
        now: 'Они пересекли овраг, остановились на вершине Чимборасо и благополучно вернулись в лагерь.'
        who: 'humboldt_chimborazo'
        bio: 'В этом временном графике Гумбольдт достиг вершины Чимборасо вместе с Бонпланном и Монтуфаром 23 июня 1802 года и благополучно спустился.'
    vignettes:
      turn: 'Вымышленный читатель нарисовал вершину в конце маршрута. Вы спрашиваете, где заканчивается дневник, описывающий восхождение. Они перемещают последнюю отметку вниз по склону, оставляя вершину нетронутой.'
      units: 'Читатель хочет скопировать высоту без ее единицы измерения. Вы сохраняете его привязанным к исходному размеру и оставляете место для отдельного современного преобразования.'
      names: 'Вы просите читателя оставить место рядом с Гумбольдтом для имен других путешественников. Когда заметка сложена, список по-прежнему соответствует отчету о дневной попытке.'
  ibn_khaldun_cairo:
    name: 'Судно у берегов Александрии'
    place: 'Каир'
    figure: 'Ибн Хальдун'
    story: 'Ибн Хальдун приехал в Каир в 1382 году по приглашению султана Баркука. В 1384 году султан попросил правителя Туниса позволить своей семье следовать за ним, а 8 августа назначил его главным судьей маликитской школы, высокий пост для пришельца с запада, и вскоре соперники в городе принялись за его свержение. В том же году корабль с его женой и дочерьми затонул в Александрии. В «Мукаддиме» он просит историков сопоставить отчеты с тем, что может произойти в описываемом ими обществе.'
    story_prose:
      opening:
        - 'В Каире служащий кладет на один стол запись о встрече и список имен, которые нужно проверить. Ибн Хальдун спрашивает, кто ждет снаружи. Он сам ждет еще одного письма с известием о корабле, привезшем его жену и дочерей из Туниса.'
        - 'В 1384 году Ибн Хальдун стал главным судьей Каира. Корабль, на борту которого находились его жена и дочери, позже затерялся в Александрии. В этой поездке вы можете сохранить встречу и отправиться в порт, чтобы помочь людям на корабле добраться до берега.'
        - 'Используйте кого-нибудь, кто сможет проверить документы у клерка в Каире. Заранее отправьте в Александрию путешественника, который сможет работать с моряками и помогать людям на берегу.'
      points:
        p1: 'Клерк говорит, что имя нужно скопировать еще раз, и хочет подождать, пока другой чиновник скажет, чье оно. Вы просите его прочитать уже назначенную встречу и сравнить ее с тем, что говорит посетитель. Рядом с датой предъявитель зачитывает полное имя Ибн Хальдуна. Писарь забирает указ о назначении с края стола и возвращает его в бумаги на отправку.'
        p2: 'Кто-то в порту звонит, что видит человека, потом теряет его из виду в воде. Вы просите наблюдающих продолжать указывать на одно и то же место и освободить место для уже выходящих моряков. Когда жена и дочери Ибн Хальдуна достигают берега, человек, ожидающий у двери, спрашивает, куда следует послать новости в первую очередь. Письмо в Каир ждёт, пока они смогут ответить сами, своим голосом.'
      outcomes:
        all: 'Ибн Хальдун вступает в должность, как это было в истории. Из порта приходит срочное сообщение о том, что его семья находится на берегу. В этом отделении мужчина, ожидающий в Каире, получает другое сообщение.'
        p1: 'Назначение прекращается в записанный день. Корабль все еще затерян в Александрии, а его семья не добирается до Каира.'
        p2: 'У его жены и дочерей есть люди, которые помогают им в порту. Встреча не синхронизирована, но сцену их спасения все еще можно записать.'
      none: 'Люди ждут в Каире документов и в порту, пока стихнет ветер. Письмо о том, что его семья в безопасности, так и не было написано.'
      not_admitted: 'Никто не впускает человека, ожидающего у двери, чтобы записаться на прием. Вести с корабля не дошли до комнаты.'
      desync: 'Назначение, предназначенное для Ибн Хальдуна, достается кому-то другому. Офис отзывает путешественника, когда запись рассинхронизируется.'
      excerpts:
        p1: 'Писарь забирает указ о назначении с края стола и возвращает его в бумаги на отправку.'
        p2: 'Письмо в Каир ждёт, пока они смогут ответить сами, своим голосом.'
    relic: 'Проверенный отчет'
    relic_desc: 'Отчет о процессии с указанием места, где стоял наблюдатель, написанного на полях.'
    points:
      p1: 'Когда соперники пытаются не допустить нового судью к должности, защитить назначение Ибн Хальдуна главным судьёй маликитской школы 8 августа.'
      p2: 'Когда корабль с его женой и дочерьми затонет в Александрии, вытащите людей на борту из воды и спасите их.'
    points_fail:
      p1: 'В этой ветке 8 августа на эту должность назначили другого человека. Эта ветвь потеряла связь с историей, и в тот день бюро отзывает сотрудника.'
      p2: 'Как и в истории, корабль со всеми на борту затонул в Александрии, а его жена и дочери не дошли до Каира.'
    shift:
      p1:
        was: '8 августа 1384 г.: султан Баркук назначил Ибн Хальдуна главным судьей маликитской школы в Каире; соперники в городе работали против него, и в следующем году он потерял этот пост.'
      p2:
        was: '1384 год: корабль, привезший жену и дочерей Ибн Хальдуна из Туниса, затонул в Александрии, и никто на борту не выжил.'
        now: 'Людей на корабле вытащили из воды в Александрии. Его жена и дочери переехали в Каир, и семья снова зажила вместе.'
        who: 'ibn_khaldun_cairo'
        bio: 'В этом временном графике корабль, затонувший в Александрии в 1384 году, не забрал с собой его семью: его жена и дочери были спасены и присоединились к нему в Каире.'
    vignettes:
      gate: '{staff} спрашивает клерка, загримированного к игре, как долго ворота стояли открытыми, пока через них проходила толпа. Он записывает минуты на полях рядом с итоговой суммой, а затем меняет ее на приблизительную.'
      two: '{staff} дает второму наблюдателю, подготовленному для игры, свой собственный лист, чтобы ее отчет об улице не оказался на полях его.'
      copy: '{staff} копирует страницу Мукаддимы для ученика суда и оставляет между строками ширину пальца для пометок, которые ученик захочет сделать.'
  lili_boulanger_paris:
    name: 'Партии, разложенные на столе'
    place: 'Мези-сюр-Сен'
    figure: 'Лили Буланже'
    story: 'Лили Буланже тяжело заболела зимой 1918 года в Мези-сюр-Сен. В отчетах о ее последней работе рассказывается, как она диктовала Pie Jesu своей сестре Наде. В партитуре используются голос, струнный квартет, арфа и орган. Лили умерла 15 марта в возрасте двадцати четырех лет.'
    story_prose:
      opening:
        - 'На музыкальном столе лежат две стопки: чистый экземпляр и страницы, ожидающие диктовки. Надя только что написала записку, когда Лили просит ее отложить ручку. Сквозь тонкую бумагу трудно прочитать последний написанный такт.'
        - 'Во время своей последней болезни Лили Буланже диктовала музыку для Pie Jesu своей сестре Наде. Лили умерла 15 марта 1918 года. Здесь она может сделать паузу в своем темпе и попросить кого-нибудь прочитать, где она остановилась, когда она захочет продолжить.'
        - 'Место Нади может отметить тот, кто читает ноты. Позвольте Лили сказать, когда она будет готова, прежде чем перечитывать отрывок.'
      points:
        p1: 'Надя начинает переворачивать страницу. Лили просит ее подождать. Вы ставите узкую полоску так, чтобы они оба могли видеть последний бар. В комнате на некоторое время воцаряется тишина. Как только Лили заговорит, вы отсчитываете доли, отмеченные Надей. Лили меняет одну ноту, и Надя продолжает с той же строки.'
      outcomes:
        all: 'Лили решает, когда продолжить. Отрывки, которые она продиктовала, остаются на столе, а более поздние записи до сих пор отмечают ее смерть 15 марта.'
        p1: 'Надя возвращается в отмеченное место, когда Лили будет готова. На этот раз Лили не придется повторять отрывок, который она продиктовала перед паузой.'
      none: 'После перерыва сестрам еще предстоит найти свое место. Лили использует некоторое время, чтобы снова продиктовать отрывок.'
      not_admitted: 'Надя просит посетителя подождать снаружи и соблюдать тишину в проходе. Только сестры слышат последнюю фразу, прежде чем остановиться.'
      excerpts:
        p1: 'Лили меняет одну ноту, и Надя продолжает с той же строки.'
    relic: 'Узкий бумажный маркер'
    relic_desc: 'Придуманная табличка, обозначающая полосу, на которой остановился диктант.'
    points:
      p1: 'Когда Лили попросит перерыв, отметьте место для Нади и прочитайте последний отрывок, когда Лили захочет начать снова.'
    points_fail:
      p1: 'Остановившись, сестрам предстоит снова найти свое место. Лили проводит часть времени, оставшегося у нее в тот день, повторяя то, что она уже дала Наде.'
    shift:
      p1:
        was: 'В рассказах Pie Jesu описывается, как Надя помогала Лили записывать музыку, когда Лили была очень больна.'
        now: 'В этой ветке {staff} сохраняют свое место, когда Лили останавливается. Когда она будет готова, Надя перечитывает последний отрывок, и ее сестра может начать именно с того места, где она решила сделать паузу.'
    vignettes:
      entry: '{staff} просит Надю указать на самую последнюю заметку, прежде чем перевернуть страницу. Она держит палец на этой строке, проверяя голос над ней.'
      visitor: 'Человек у двери спрашивает, сколько осталось музыки. {staff} оставляет вопрос снаружи, пока Лили решает, стоит ли отдыхать.'
      stand: '{staff} освобождает место на трибуне, чтобы Надя могла отложить ручку, не закрывая счет.'
  jianzhen_nara:
    name: 'Долгая дорога обратно в Янчжоу'
    place: 'Линнань'
    figure: 'Цзяньчжэнь'
    story: 'Пятая попытка Цзяньчжэня отправиться в Японию вместо этого привела его на Хайнань. На обратном пути Эйэй, монах, приехавший просить его поехать в Японию, заболел и умер в Дуаньчжоу. Цзяньчжэнь потерял зрение во время путешествия. Отчеты дают разные объяснения.'
    story_prose:
      opening:
        - 'В Дуаньчжоу товарищ кладет у двери только что переписанные маршрутные документы. Кто-то в комнате Эйэя попросил людей, приносящих сообщения, подождать. Цзяньчжэнь приходит и спрашивает, может ли он немного посидеть внутри.'
        - 'В отчете о путешествиях Цзяньчжэня упоминается смерть Эйэя в Дуаньчжоу. Позже зрение Цзяньчжэня ухудшилось, и группа вернулась в Янчжоу. Эта ветка занимает два небольших момента из путешествия. Вы можете дать двоим мужчинам время поговорить, а затем прочитать дальнейший маршрут в Цзяньчжэнь.'
        - 'Кто-то с опытом ухода может спросить, чего хочет Эйэй. Путешественник, умеющий читать газеты и слушать разных людей, позже сможет прочитать маршрут до Цзяньчжэня, останавливаясь за остановкой.'
      points:
        p1: 'После того, как человек, спрашивающий об уходе, уходит, вы спрашиваете Эйэя, хочет ли он, чтобы Цзяньчжэнь вошел. Он кивает и просит табуретку, которая оставляет дверь свободной. Вы соглашаетесь с остальными сохранить их сообщения, а затем ждете во дворе. Изнутри слышны два голоса. Когда они стихают, никто не торопит говорящих.'
        p2: 'Бумаги сложены в стопку, и товарищ собирается рассказать Цзяньчжэню маршрут, который он выбрал. Вы зачитываете остановки, о которых еще идет речь, и говорите, где группе, возможно, придется переночевать. Цзяньчжэнь еще раз спрашивает имя, прежде чем сказать, какой этап он хочет пройти первым. Кто-то записывает его выбор на листе, где прежде были одни названия мест.'
      outcomes:
        all: 'У двоих мужчин есть время поговорить. Эйэй все еще умирает в Дуаньчжоу. Позже, когда Цзяньчжэнь не может читать газеты, они едут по маршруту, который он слышал вслух.'
        p1: 'Двое мужчин могут встретиться. Эйэй все еще умирает, и для последующих маршрутных документов понадобится кто-то, кто объяснит их Цзяньчжэню.'
        p2: 'Цзяньчжэнь слышит следующие этапы и решает для себя, куда он хочет идти. Шанс провести время с Эйэем уже упущен.'
      none: 'Маршрутные документы возвращаются в пачку. Сообщения в комнате и местах впереди все еще ждут, чтобы кто-нибудь их прочитал.'
      not_admitted: 'Вы никогда не входите в комнату, где остановился Эйэй. Бумаги забирают, и у двери их никто не читает.'
      excerpts:
        p1: 'Изнутри слышны два голоса. Когда они стихают, никто не торопит говорящих.'
        p2: 'Кто-то записывает его выбор на листе, где прежде были одни названия мест.'
    relic: 'Лист с маршрутными заметками'
    relic_desc: 'Придуманный листок из путешествия группы на север.'
    points:
      p1: 'В Дуаньчжоу спросите, как Эйэй хочет, чтобы о нем заботились, и найдите время, чтобы поговорить с Цзяньчжэнем.'
      p2: 'Поскольку зрение Цзяньчжэня ухудшается, пусть группа зачитает свои планы вслух, чтобы он мог решить, как он хочет продолжать.'
    points_fail:
      p1: 'Всегда есть что-то еще, что нужно уладить, и людей, стоящих у постели больного, продолжают звать. Время разговоров проходит.'
      p2: 'Группа снова собирает записи маршрута в пачку. Цзяньчжэню приходится ждать, пока кто-нибудь скажет ему, что написано на странице.'
    shift:
      p1:
        was: 'Эйэй заболел и умер в Дуаньчжоу на обратном пути после пятой попытки отплыть в Японию.'
        now: 'В этом филиале {staff} остается с Эйэем в Дуаньчжоу и зовет Цзяньчжэня к постели. У них есть время поговорить наедине.'
      p2:
        was: 'Согласно сообщениям, во время этого путешествия Цзяньчжэнь потерял зрение. Позже он отплыл в Японию.'
        now: 'В этой ветке {staff} считывает следующие остановки. Цзяньчжэнь просит остальных сменить одну остановку и сообщает им, когда он хочет снова отправиться в путь.'
    vignettes:
      sound: 'Спутник указывает на следующий город на листе. {staff} просит дважды прочитать имя, пока Цзяньчжэнь слушает.'
      tie: 'Партия собирается закрыть маршрутные документы. {staff} держит пакет открытым, пока кто-нибудь не проверит порядок стопов.'
      temple: '{staff} отвечает на вопрос во дворе, чтобы люди внутри могли закончить говорить, не повышая голоса.'
  sei_shonagon_kyoto:
    name: 'Зима, когда императрица ждала родов'
    place: 'Киото'
    figure: 'Сэй-Сёнагон'
    story: 'Сэй Сёнагон служил императрице Тейси, а позже писал о жизни вокруг нее в «Книге подушек». Ближе к концу второго года правления Чохо Тэйси родила дочь, принцессу Биши, и вскоре умерла.'
    story_prose:
      opening:
        - 'В Киото пришла зима, и у ширмы лежит дополнительная подушка. Сэй Сёнагон спрашивает, кто его возьмет. Пока она говорит, прибывает посланник. Тэйси оглядывается на пустое место, пока посланник все еще находится там.'
        - 'Тэйси приготовилась родить в конце 1000 года и умерла 13 января 1001 года по преобразованному календарю. Позже Сэй Сёнагон написала о жизни при своем дворе в «Книге подушек». Здесь вы можете спросить, кого Тэйси хочет видеть рядом, и освободить место для людей, которых она выберет.'
        - 'Отправьте путешественника, который выслушает ее вместе с Сёнагоном. Пока говорит Тэйси, кто-то другой может ответить на следующее сообщение снаружи.'
      points:
        p1: 'Сёнагон берет подушку и кладет ее на свое обычное место. Вы ждете, пока посланник закончит, а затем просите ее узнать, кого хочет видеть Тэйси. Тэйси называет имя одного человека и просит ее сесть немного за лампой. Сёнагон кладет подушку туда, куда она указывает. Когда в комнате стихает шум, тот, кого просила Тэйси, уже сидит рядом, а сама Тэйси держит руку там, где хотела.'
      outcomes:
        all: 'Человек, которого она просила о встрече, остается рядом. Тэйси все еще умирает, и в отчете сохранен момент, когда она выбирала, кто будет сидеть с ней.'
        p1: 'Сёнагон оставляет подушку свободной, пока не прибудет человек, которого выбрал Тэйси. Более поздняя запись рассказывает о ее исторической жизни.'
      none: 'Одно сообщение за другим доходит до двери. Подушка достается первому появившемуся человеку, прежде чем кто-либо сможет спросить Тэйси, кого она хочет.'
      not_admitted: 'Никто вас не зовет. Кто-то выдвигает подушку за ширму. Со стороны не видно, для кого это было.'
      excerpts:
        p1: 'Когда в комнате стихает шум, тот, кого просила Тэйси, уже сидит рядом, а сама Тэйси держит руку там, где хотела.'
    relic: 'Сложенная записка для домохозяйства'
    relic_desc: 'Придуманная записка с названием, кого следует проводить в комнату.'
    points:
      p1: 'Спросите, кого Тэйси хочет видеть рядом с собой, пока она готовится к родам, и помогите Сёнагону освободить место для этих людей.'
    points_fail:
      p1: 'Кто-то уже у двери со следующим сообщением, прежде чем появляется время спросить, кого Тэйси хочет видеть рядом с собой.'
    shift:
      p1:
        was: 'В придворных хрониках зафиксировано рождение принцессы Биши и вскоре после этого смерть Тэйси.'
        now: 'В этой ветке {staff} держит остальных посетителей у двери, пока Тэйси не скажет, кого она хочет видеть. Сёнагон успевает послушать, прежде чем передать следующее сообщение.'
    vignettes:
      compare: '{staff} просит посланника четко прочитать одно имя, прежде чем сворачивать сообщение. Теперь Сёнагон может передать его, не спрашивая снова.'
      colour: 'Сёнагон перемещает лампу, чтобы увидеть пространство за ней. {staff} перекладывает запасную подушку туда, куда указал Тэйси.'
      listen: '{staff} ждет, пока не будет получен ответ на сообщение у двери, прежде чем спрашивать, нужно ли помещению что-нибудь еще.'
  ibn_rushd_lucena:
    name: 'До приказа сжечь книги'
    place: 'Кордова'
    figure: 'Ибн Рушд'
    story: 'Около 1195 года Ибн Рушд впал в немилость двора Альмохадов и был отправлен в ссылку в Лусену. Отчеты фиксируют осуждение и сожжение книг. Арабский текст его Длинного комментария к физике Аристотеля утерян, хотя сохранились переводы на иврите и латыни.'
    story_prose:
      opening:
        - 'Два сообщения все еще лежат на столе в Кордове, одно из них адресовано Лусене. Читатель спрашивает, ответит ли еще Ибн Рушд. Он протягивает переписчику длинный комментарий к физике и указывает на место, где пропущено слово.'
        - 'Ибн Рушд был отправлен в ссылку в Лусену около 1195 года. В более поздних отчетах зафиксированы ограничения на книги. Арабский текст его «Длинного комментария к физике» сохранился лишь частично. Здесь вы можете вернуть читателя к нему и оставить проверенную копию одного раздела для этого читателя.'
        - 'Назначьте ответственным за оба адреса человека, который сможет организовать переписку. Читатель по-арабски или внимательный переписчик может проверить, где заканчивается оригинал и начинается комментарий.'
      points:
        p1: 'Читатель написал несколько строк. Когда придет время, он попросит вас сказать только, что он все еще хочет читать дальше. В Лусене вы читаете эти слова Ибн Рушду и говорите ему, куда послать ответ. Он спрашивает, до какого раздела дошел читатель, и берет свой лист. Он подаёт вам два сложенных листа и просит передать их тому, кто всё ещё читает.'
        p2: 'Переписчик написал сразу после пробела. Он говорит, что текст имеет смысл, но читатель оригинала может назвать пропущенное предложение. Вы просите его оставить место для исходной строки и скопировать комментарий под ней, а затем прочитать оба текста. Получив копию, читатель кладёт палец между двумя отрывками и говорит, что сам найдёт оба места.'
      outcomes:
        all: 'Ответ передается между Лусеной и Кордовой, и читатель получает один проверенный раздел комментария на арабском языке. Утрата других страниц остается в исторических записях.'
        p1: 'Ибн Рушд знает, что кто-то все еще читает. Его ответ возвращается из Лусены, а проверенная копия остается незаконченной.'
        p2: 'Читатель уходит с проверенными страницами на арабском языке. Сообщение, которое он хотел отправить Лусене, все еще ждет.'
      none: 'И сообщение, и наполовину написанная страница остаются на столе. Читатель ждет, когда придет следующий человек.'
      not_admitted: 'Люди у дверей не возьмут письмо от неизвестного курьера. Слова читателя никогда не доходят до Ибн Рушда.'
      excerpts:
        p1: 'Он подаёт вам два сложенных листа и просит передать их тому, кто всё ещё читает.'
        p2: 'Получив копию, читатель кладёт палец между двумя отрывками и говорит, что сам найдёт оба места.'
    relic: 'Отрывок из практики читателя'
    relic_desc: 'Придуманная вытяжка с добавлением места под помещение.'
    points:
      p1: 'Отправьте из Кордовы известие Ибн Рушду в Лусену, что один из его читателей все еще хочет написать ему и может принять его ответ.'
      p2: 'Прежде чем приказ придет, сравните один раздел арабского комментария к физике с его источником и оставьте второй экземпляр читателю.'
    points_fail:
      p1: 'Читатель хранит записку в Кордове. Им придется дождаться еще одного шанса отправить его.'
      p2: 'Дополнительная копия остается незавершенной. У читателя нет отдельных страниц на арабском языке, которые он мог бы отобрать.'
    shift:
      p1:
        was: 'Ибн Рушд впал в немилость и был сослан в Лусену, прежде чем вернуться в суд.'
        now: 'В этой ветке к нему в Лусену попадает записка читателя. Он может ответить, пока у них еще есть возможность отправить письмо обратно.'
      p2:
        was: 'Арабский текст «Длинного комментария Ибн Рушда по физике» утерян. Его средневековые переводы сохранились.'
        now: 'В этой ветке один проверенный раздел остается в руках читателя благодаря осуждению. Читатель все еще может сравнить его с другой копией на арабском языке.'
    vignettes:
      premise: 'Мариам аккуратно переписала заключение. Юсуф может следовать этому, только предполагая что-то, что она оставила невысказанным. Вы спрашиваете его, где он остановился, и оставляете место перед заключением. Мариам записывает свое предположение в этом месте, где Юсуф может его подвергнуть сомнению.'
      together: 'Юсуф хочет вернуть книгу и оставить одну строчку для себя. Вы даете ему время скопировать следующий шаг. У двери Мариам вслух спрашивает заключение, и теперь он может назвать ей и причину.'
      language: 'Вы узнаете термин, который позже читатели встретят на другом языке. Мариам просто хочет знать, скопировала ли она посылку в ее нынешнем виде. Ты держишь страницу ровно, пока она ее проверяет. Вопрос, который она напишет рядом с ним, попадет к читателю, которого вы не встретите.'
  maya_codices_mani:
    name: 'Как складывали бумагу'
    place: 'Мани'
    figure: 'Писцы майя'
    story: '12 июля 1562 года колониальные власти публично сожгли книги майя и другие предметы в Мани. Сообщества майя продолжали создавать и передавать знания. Сохранилось несколько складных книг, изготовленных до испанского завоевания.'
    story_prose:
      opening:
        - 'В Мани, Юкатан, хранительница кладет сложенную книгу на циновку и переворачивает ее на страницу, которую когда-то читал вместе с ней ребенок. Сегодня уезжает гость из соседней деревни. Прежде чем уйти, он спрашивает, доверит ли она ему одну книгу.'
        - 'Задокументировано сожжение книг в Мани в июле 1562 года. В сохранившихся кодексах майя сохранились письмена и изображения, точная история которых зачастую неизвестна. Хранительница здесь вымышленная и может выбрать кого-нибудь, кто будет хранить одну из ее книг.'
        - 'Отправьте кого-нибудь, кто позволит хранителю показать, как работают страницы. Если она решит передать книгу, сложите ее по ее указанию и спросите получателя, как читатели смогут ее найти.'
      points:
        p1: 'Хранитель открывает второй сгиб и указывает на поле, которое когда-то ошибся другой читатель. Вы просите получателя следовать ее направлению, чтобы он мог видеть, что оба читателя остановились в одном и том же месте. Она берет одну книгу подальше от остальных, заворачивает ее в потертую ткань и пропускает через коврик. Получатель держит его обеими руками и ждёт, пока она объяснит отметку на последнем сгибе.'
      outcomes:
        all: 'Одна книга отправляется в то место, которое выбрал ее хранитель. Пожары в Мани происходят до сих пор, и в этой ветке хранится единственный том, который она передала сама.'
        p1: 'Читатель выносит завернутую книгу на грудь. Когда она снова откроется, он сможет найти вторую складку, как она ему показывала.'
      none: 'Читатель уходит домой с пустыми руками. Хранитель разворачивает книгу и снова закрывает ее. Ей еще предстоит решить, где она останется.'
      not_admitted: 'Хранитель не предлагает посетителю прикасаться к страницам. У двери вы видите, как она поворачивает их назад и продолжает говорить со своей соседкой.'
      excerpts:
        p1: 'Получатель держит его обеими руками и ждёт, пока она объяснит отметку на последнем сгибе.'
    relic: 'Пустой тренировочный сгиб'
    relic_desc: 'Вымышленный складок, предложенный его хранителем.'
    points:
      p1: 'Спросите хранительницу, какую книгу она хочет передать доверенному читателю из другой деревни, и помогите ей передать ее.'
    points_fail:
      p1: 'Человек, которого она выбрала, уходит без книги. Его хранителю предстоит решить, где он сможет остановиться.'
    shift:
      p1:
        was: '12 июля 1562 г.: в Мани публично сожгли множество складных книг майя. Из книг, созданных до завоевания, сохранилось лишь несколько.'
        now: 'В этой ветке хранитель выбирает, кто будет присматривать за той или иной книгой. Оно достигает следующего читателя и остается в руках Майя даже после сожжения.'
        who: 'maya_codices_mani'
        bio: 'В этом филиале книга из Мани передавалась читателю, выбранному ее хранителем, перед публичным сожжением в 1562 году.'
    vignettes:
      fold: 'Хранительница кладет на скамейку два незаполненных сгиба и спрашивает соседа, какой из них в книге, которую он помнит, открылся первым. Вы держите бумагу, пока они сравнивают. Он не может разместить вторую складку. Первую она оставляет себе, а вторую оставляет на случай следующего разговора.'
      listen: 'Сосед начинает пересказывать пропущенную хранителем часть, но порядок они запоминают по-разному. Вы слушаете, пока каждый из них заканчивается. Они соглашаются по первому вопросу и оставляют нерешенным второй. Хранительница просит вас оставить ей копию, содержащую обе учетные записи.'
      survive: 'Вы видели сохранившийся кодекс майя в более поздней коллекции. Хранительница спрашивает, можете ли вы сказать, какую книгу помнит ее соседка. Вы можете назвать коллекцию, но не можете связать ее страницы с этой комнатой. Она вручает вам чистый бланк для тренировки, чтобы вы могли вернуться обратно. Книга, которую они помнили, осталась с их рассказом о ней.'
  zeami_sado:
    name: 'Остров на бумаге'
    place: 'Остров Садо'
    figure: 'Дзэами'
    story: 'Сын Дзэами, Мотомаса, умер в 1432 году. Дзэами писал о потере в Кьякурайке перед тем, как его сослали на Садо в 1434 году. Кинтосё, сборник песнопений, напоминающий о его путешествии и изгнании на остров, датируется 1436 годом.'
    story_prose:
      opening:
        - 'В комплект поставки ридера Sado входит лист, достаточно маленький, чтобы его можно было положить в карман. Дзэами уже дважды слышал, как он тренируется у двери, каждый раз дыша в разной точке. Со своего места он спрашивает, с чего читатель хочет начать.'
        - 'В более позднем возрасте Дзэами был сослан на Садо и писал об острове на Кинтошо. Эта ветка дает ему короткое чтение, которое он может послушать, и паузу, которую он может выбрать сам. Более поздние работы до сих пор остаются такими же, как и в истории.'
        - 'Отправьте кого-нибудь, кто будет слушать слова и их ритм. Спросите, хочет ли Дзэами их услышать, и запишите паузу, которую он выберет сам по себе.'
      points:
        p1: 'Читатель вздыхает в конце фразы. Дзэами просит его начать снова с того же места и в середине поднимает руку. Вы смотрите, где рука останавливает слова, и отмечаете оговорку после окончания чтения. На третий раз чтец останавливается на этом слове, не опуская глаз, ещё до того, как Дзэами поднимает руку.'
      outcomes:
        all: 'Оговорка сохраняет паузу, которую Дзэами выбрал после того, как услышал фразу. Оно лежит рядом со страницей, пока он продолжает писать об острове.'
        p1: 'Дзэами сам выбрал паузу. Читатель говорит, что в следующий раз принесет тот же лист.'
      none: 'Читатель не может оставаться достаточно долго, чтобы его позвали. На его сложенном листе все еще нет отметки для паузы.'
      not_admitted: 'Посетителя еще не пригласили прочитать. Читатель складывает страницу и отходит от двери.'
      excerpts:
        p1: 'На третий раз чтец останавливается на этом слове, не опуская глаз, ещё до того, как Дзэами поднимает руку.'
    relic: 'Маска Но'
    relic_desc: 'Маленькая деревянная маска с тонкой лаковой линией между бровями.'
    points:
      p1: 'Спросите Дзэами, хочет ли он, чтобы кто-нибудь прочитал вместе с ним строчку из «Садо». Если он согласен, помогите читателю удержать паузу на отрывном листке.'
    points_fail:
      p1: 'Читатель должен уйти, прежде чем Дзэами сможет услышать фразу вслух. Отметке на странице придется подождать.'
    shift:
      p1:
        was: 'Среди сохранившихся сочинений Дзеами — оплакивание его сына и Кинтошо, в котором вспоминается его изгнание на Садо.'
        now: 'В этой ветке Дзэами слышит, как читатель пробует свою фразу двумя способами. Он выбирает, где читателю следует сделать паузу, и оставляет листок рядом со своей страницей.'
    vignettes:
      later: 'Вы сообщаете читателю, что люди по-прежнему будут использовать это имя в книгах о Садо. Он пробует использовать эти слова как название места, а затем как то, чего жаждет человек. Вы отмечаете обе паузы на слипе. Лодка, которая доставила Дзэами на Садо, уже ушла.'
      mask: 'Читатель держит тренировочную маску и теряет свое место, когда опускает ее. Вы отмечаете начало лески на свободном листе и подпираете его там, где он сможет снова его найти. Маска возвращается на крючок. Вы пропускаете чтение после своего.'
      wind: 'Сквозняк разбрасывает бланки для чтения. Вы помогаете читателю вытащить один из них из-под скамейки и прижать его камешком. Он читает эту строчку еще раз. Когда вы уходите, бумага остается под камнем, и вы уносите паузу в свои записи.'
  mozart_requiem_vienna:
    name: 'Чтобы можно было узнать почерк'
    place: 'Вена'
    figure: 'Вольфганг Амадей Моцарт'
    story: 'Моцарт умер в Вене в декабре 1791 года, не закончив Реквием. В Австрийской национальной библиотеке хранятся рабочие материалы и экземпляр партитуры для передачи заказчику с дополнениями Франца Ксавера Зюссмайра.'
    story_prose:
      opening:
        - 'В Вене посыльный тянется к самой аккуратной стопке на столе. Моцарт спрашивает, лежа на кровати, остались ли еще инструментальные партии вступительной части. Констанца просит посыльного подождать. Некоторые другие страницы представляют собой черновики, которые не были убраны.'
        - 'Моцарт заболел в последние недели своей жизни и умер 5 декабря 1791 года. Реквием так и остался незаконченным, хотя он полностью записал его начало. Здесь вы можете сохранить этот раздел вместе и попросить сиделку принести вымышленную аптечку из офиса.'
        - 'Читатель, умеющий отличать инструментальные партии от рабочих листов, может помочь Констанце разобраться в них. Используйте кого-нибудь с набором и опытом ухода, предварительно спросив домочадцев и Моцарта, чего он хочет.'
      points:
        p1: 'Посыльный переворачивает два листа и читает на обоих название одной и той же партии. Вместе с Констанцей вы просите пачку с полной оркестровкой и проверяете начальную часть до конца. Черновики складывают отдельно и снабжают ярлыком. У двери посыльный проверяет, что внутри свёртка и что на нём снаружи, чтобы знать, какую пачку первой отдать переписчику.'
        p2: 'Кто-то подносит к кровати чистый лист и спрашивает, будет ли сегодня копирование. Вы объясняете Моцарту и его семье канцелярский набор и просите переписчика подождать в другой комнате. Когда Моцарт позже просыпается, его лихорадка прошла. Он просит придвинуть стол и открывает только ту страницу, на которой остановился.'
      outcomes:
        all: 'Открывающиеся части можно использовать снова, а Моцарт – работать за столом. Когда вы уходите, страницы после них остаются пустыми. Никто еще не знает, как он их закончит.'
        p1: 'Открытие по-прежнему представляет собой один полный пакет. Моцарт умирает 5 декабря, и оставшийся счет остается за другими.'
        p2: 'Моцарт выздоравливает, но исходное начало разбросано. Этот визит сохраняет тот момент, когда он просыпается и просит посмотреть счет.'
      none: 'Незаконченные фразы лежат у кровати. Моцарт умирает 5 декабря, а несколько груд до сих пор ждут, пока кто-нибудь их опознает.'
      not_admitted: 'Констанция не устроила этого гостя. Переписчик остается снаружи и никогда не видит, что находится в стопке.'
      desync: 'Вступительные части смешиваются с отдельными страницами, и историческая передача не синхронизируется. Офис отзывает путешественника.'
      excerpts:
        p1: 'У двери посыльный проверяет, что внутри свёртка и что на нём снаружи, чтобы знать, какую пачку первой отдать переписчику.'
        p2: 'Он просит придвинуть стол и открывает только ту страницу, на которой остановился.'
    relic: 'Незаконченный практический лист'
    relic_desc: 'Вымышленный лист для копирования, показывающий, где заканчиваются сохранившиеся записи.'
    points:
      p1: 'Сохраните законченное начало Реквиема, когда болезнь вынудит его передать его.'
      p2: 'После того, как 20 ноября он слегнет в постель, вылечите лихорадку, которая удерживает его там.'
    points_fail:
      p1: 'Открывающиеся части смешиваются со свободными сквозняками, и первый механизм уже невозможно собрать заново. Офис отзывает сотрудника после того, как филиал потерял синхронизацию.'
      p2: 'В этой отрасли болезнь не поднимается. Он умирает в Вене 5 декабря в возрасте 35 лет.'
    shift:
      p1:
        was: 'В декабре 1791 года Моцарт умер, когда начало Реквиема было полностью оркестровано, а большая часть остального осталась незаконченной.'
      p2:
        was: 'С 20 ноября 1791 года Моцарт был прикован к постели. Он умер в Вене 5 декабря, и в приходской книге указана причина - тяжелая милиарная лихорадка.'
        now: '{staff} приносит лекарство, снимающее жар, и в декабре он снова садится. На этом графике он заканчивает Реквием собственноручно и в течение многих лет продолжает сочинять и выступать в Вене.'
        who: 'mozart'
        bio: 'Моцарт выздоровел зимой 1791 года, сам закончил «Реквием» и в течение многих лет продолжал сочинять и выступать в Вене.'
    vignettes:
      stack: 'Грета убирает со стола и откладывает в сторону пустой на вид лист. Вы держите стопку, пока Эмиль проверяет страницу перед ней. Пустой нотоносец принадлежит к последовательности. Грета кладет его обратно с незакрепленной маркировкой того места, откуда он был взят.'
      hand: 'Эмиль может скопировать строку перед собой и готов сразу перейти к ненаписанному нотоносцу. Вы просите его сделать небольшую отметку на полях в том месте, где копирование прекращается. В завершенной передаче следующий читатель сможет точно увидеть, где должна начаться новая раздача.'
      finish: 'Вы можете напевать этот отрывок так, как его будет петь будущий хор. Грете нужна копия сейчас, и она спрашивает, где заканчивается музыка на этой странице. Ты показываешь ей границу и оставляешь мелодию при себе. Следующая версия будет собрана после вашего ухода.'
  dickinson_amherst:
    name: 'Стихи в сундуке'
    place: 'Амхерст'
    figure: 'Эмили Дикинсон'
    story: 'Эмили Дикинсон умерла дома в Амхерсте 15 мая 1886 года. Ее сестра Лавиния выполнила ее просьбу сжечь входящие письма и нашла сотни стихов. Первые редакторы позже разобрали буклеты, в которые Эмили вшила многие стихи.'
    story_prose:
      opening:
        - 'В доме в Амхерсте Лавиния видит угол сложенного листа под стопкой писем. Рядом лежат несколько сшитых Эмили буклетов. Кто-то наверху спрашивает, оставить ли включенным свет. Все бумаги на данный момент отправляются на крышку ближайшей коробки.'
        - 'Эмили Дикинсон умерла в 1886 году. Ее сестра Лавиния, разбираясь с письмами, нашла большое количество стихов, и многие брошюры позже были распечатаны. Вы можете сначала организовать уход так, как этого хочет Эмили, затем помочь Лавинии отличить буквы от стихов и сохранить один буклет нетронутым.'
        - 'Путешественник с опытом ухода может спросить Эмили, чего она хочет на ночь. Тот, кто читает рукописи, может помочь Лавинии распознать строчки и варианты слов и сохранить порядок, в котором они были найдены.'
      points:
        p1: 'Лавиния берет разрозненные листы и говорит, что буквы могут сочетаться друг с другом. Вы просите ее сначала развязать веревку внизу. Она находит в руке сестры несколько страниц, сложенных до одинакового размера, и кладет их возле лампы, чтобы прочитать. Только после того, как она переложила две стопки по разным крышкам, она зовет семью посмотреть.'
        p2: 'Лавиния спрашивает, сможет ли стенограмма сохранить самое легкое для чтения слово на каждой странице. Вы просите ее показать переписчику два слова рядом с одной линией, затем обвести сгиб и зашить отверстия на копии. Буклет остается зашитым, а порядок страниц в обертке сохраняется. При следующем чтении складка возвращает переписчика к тому же альтернативному слову.'
        p3: 'Вы спрашиваете Эмили, хочет ли она, чтобы кто-нибудь был сегодня вечером в соседней комнате. Она жестикулирует лампой и просит, чтобы дверь в коридор оставалась приоткрытой, чтобы ее можно было услышать, если она позвонит. Семья ставит воду и стул туда, куда она просит. Последний человек на страже тихонько ступает к выходу. Эмили всё ещё узнаёт человека по шагам.'
      outcomes:
        all: 'Эмили проводит вечер, как она просила. После ее смерти среди сохранившихся документов есть один буклет, который все еще можно читать с сохранением швов и альтернативных слов.'
        p1: 'Письма и стихи хранятся отдельно, а неопубликованные стихи сохранились. Некоторые буклеты до сих пор разбирают, пока остальными занимается семья.'
        p2: 'Складки одного буклета и альтернативные слова были скопированы. Остальные бумаги затерялись, и поездка запомнилась копированием того единственного буклета.'
        p3: 'Когда Эмили звонит той ночью, кто-то достаточно близко, чтобы услышать. Семья по-прежнему должна сама сортировать бумаги.'
      none: 'Сложенная бумага — это все, что осталось у лампы. Никто не делает новых приготовлений на ночь.'
      not_admitted: 'Кто-то отвечает изнутри и говорит, что семья сейчас не может принимать посетителей. Обе стопки еще предстоит вскрыть.'
      desync: 'Письма и стихи смешаны. Некоторые документы, сохранившиеся в истории, не могут быть восстановлены в этой отрасли. Офис отзывает путешественника.'
      excerpts:
        p1: 'Она находит в руке сестры несколько страниц, сложенных до одинакового размера, и кладет их возле лампы, чтобы прочитать. Только после того, как она переложила две стопки по разным крышкам, она зовет семью посмотреть.'
        p2: 'Буклет остается зашитым, а порядок страниц в обертке сохраняется. При следующем чтении складка возвращает переписчика к тому же альтернативному слову.'
        p3: 'Последний человек на страже тихонько ступает к выходу. Эмили всё ещё узнаёт человека по шагам.'
    relic: 'Сшитый буклет'
    relic_desc: 'Несколько страниц, сшитых вручную, со стихотворением на каждой.'
    points:
      p1: 'Помогите Лавинии отделить письма, которые нужно уничтожить, от переплетенных стихов и защитить неопубликованную работу.'
      p2: 'Попросите Лавинию собрать один буклет и подготовить копию, в которой отмечены сгибы, порядок страниц и альтернативные слова.'
      p3: 'Спросите Эмили, что поможет ей отдохнуть сегодня вечером, и помогите ее семье это устроить.'
    points_fail:
      p1: 'Стихи смешались с перепиской, и большая часть неопубликованных произведений утеряна. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Есть чистый экземпляр, но на его страницах невозможно определить, где соединялись согнутые листы.'
      p3: 'В семье сохраняется обычный вечерний распорядок. Эмили все еще приходится просить кого-нибудь остаться, когда ей нужна помощь.'
    shift:
      p1:
        was: 'В 1886 году, после смерти Дикинсона, Лавиния уничтожила входящие письма по запросу и обнаружила сотни стихотворений.'
      p2:
        was: 'Первые редакторы Дикинсона распечатывали сшитые вручную буклеты, над которыми они работали.'
        now: 'В этой ветке {staff} копирует буклет не разбирая его. У Лавинии есть копия, на которой показано, как страницы соотносятся друг с другом, вплоть до альтернативных слов на полях.'
      p3:
        was: 'Дикинсон был тяжело болен и умер дома 15 мая 1886 года.'
        now: 'В этом ответвлении домохозяйство берет на себя ее инициативу и оставляет кого-то достаточно близко, чтобы услышать ее, чтобы она могла отдохнуть, не взывая о помощи.'
    vignettes:
      pause: 'Читатель заставляет тире исчезнуть, пока читает вслух. Вы просите их сделать паузу там, где сломался карандаш. Они пробуют линию еще раз и слышат другой финал.'
      variant: 'Вы видите слово, написанное над линией. Читатель хочет выбрать одну версию и двигаться дальше. Вы освобождаете место на полях для обоих и указываете, что и откуда.'
      stack: 'Читатель поправляет рыхлую стопку. Вы держите два лоскута вместе, потому что их края и почерк совпадают. Следующая чистая копия начинается с их размещения рядом.'
  hertz_bonn:
    name: 'Последний семестр'
    place: 'Бонн'
    figure: 'Генрих Герц'
    story: 'С начала 1892 года Герц снова и снова страдал от мучительной болезни носа и горла, временами настолько тяжелой, что он не мог работать. В 1893 году он вернулся к чтению лекций в Бонне, перенес несколько операций, и закончил свои «Принципы механики». Он умер в Бонне 1 января 1894 года в возрасте тридцати шести лет; книга вышла после его смерти.'
    story_prose:
      opening:
        - 'Расписание лекций уже составлено в Бонне. В одной руке у Герца конспекты урока, а в «Основах механики» он хочет проверить несколько строк. Он спрашивает младшего коллегу, сколько студентов ждут с вопросами.'
        - 'Герц работал над «Принципами» во время своей последней болезни, отправил рукопись в декабре 1893 года и умер 1 января. Вы можете организовать для коллеги прослушивание одной лекции, а Hertz решит, как провести это время.'
        - 'Кто-то, кто знает, как проходит урок, может помочь собрать вопросы учащихся. Даже если у вас есть коллега, который сможет на них ответить, позвольте Герцу решить, какой класс он сдаст.'
      points:
        p1: 'Коллега выкладывает два расписания и говорит, что может пойти на следующий урок, если знает, какие вопросы студенты уже задали. Вы предлагаете Герцу выбрать урок и отметить два места, на которые нужны ответы. Прежде чем уйти с расписанием, коллега говорит, в какой комнате он будет. Герц берет листок из своих конспектов лекций и прикрепляет его к странице учебника по механике, который он хочет проверить.'
      outcomes:
        all: 'Студенты приносят свои вопросы на лекцию коллеги. Рукопись выходит в срок, и Герц умирает в первый день Нового года.'
        p1: 'Коллега посещает занятия. Герц отдыхает некоторое время, которое он выиграл, прежде чем взглянуть на пометки на рукописи.'
      none: 'Расписание остается в руках Hertz. Он закрывает рукопись, оставив несколько строк, которые еще предстоит проверить.'
      not_admitted: 'Никто не договорился о встрече с вами перед лекцией. Студенты немного ждут в коридоре и возвращаются в здание, где вывешено расписание.'
      excerpts:
        p1: 'Прежде чем уйти с расписанием, коллега говорит, в какой комнате он будет. Герц берет листок из своих конспектов лекций и прикрепляет его к странице учебника по механике, который он хочет проверить.'
    relic: 'Сложенный лист лекции'
    relic_desc: 'Придуманный лист расписания с пометкой одной лекции.'
    points:
      p1: 'Спросите Герца, какую лекцию он бы позволил прочитать коллеге, и попросите кого-нибудь ответить на вопросы в этот день.'
    points_fail:
      p1: 'Лекция остается в его расписании. Ему приходится сохранить работу над рукописью на потом.'
    shift:
      p1:
        was: 'Герц продолжал преподавать в Бонне в 1893 году, будучи больным, и перед смертью завершил свои «Принципы механики».'
        now: 'В этом разделе Hertz позволяет коллеге прочитать одну лекцию. Он использует это время, чтобы отдохнуть и продиктовать исправления в рукописи, прежде чем отправить ее.'
    vignettes:
      repeat: '{staff} зачитывает два вопроса коллеге. Он отмечает тот, на который может ответить, не открывая рукопись Герца.'
      signal: 'Студент ждет возле неправильного класса. {staff} указывает на комнату, которую запасной написал в расписании.'
      gap: '{staff} оставляет пустую строку для ответов лектора и помещает лист туда, где его сможет найти следующий студент.'
  bizet_paris:
    name: 'Год «Кармен»'
    place: 'Париж'
    figure: 'Жорж Бизе'
    story: '«Кармен» открылась в Комической опере 3 марта 1875 года после долгих репетиций. Пресса была смешанной, и производство продолжалось всю весну. 3 июня Бизе умер в Буживале в возрасте тридцати шести лет.'
    story_prose:
      opening:
        - 'У Комической Оперы осталась последняя репетиция. Хор входит вовремя, но переход через сцену задерживает вторую строчку. Кто-то за роялем спрашивает, хочет ли оркестр сам по себе или им следует начать заново с движения по сцене.'
        - 'Премьера «Кармен» состоялась в Париже 3 марта 1875 года. Бизе умер в июне того же года. Вы можете дать актерам и оркестру еще одну совместную пробежку, а затем передать Бизе именно ту часть, которую певец хочет отрепетировать.'
        - 'Используйте кого-то, кто сможет посчитать вход с обеих сторон. После выступления кто-нибудь может записать беспокойство певца номером и первыми словами раздела.'
      points:
        p1: 'Оркестр хочет начать с такта, который он ослышался. Вы просите хор вернуться в исходное положение и показать дирижеру, где он должен находиться, прежде чем он сможет петь как единое целое. После одной остановки все начинают со слова, которое вызывает припев. Когда со второй попытки всё сходится, человек у выхода на сцену даёт знак продолжать.'
        p2: 'После выступления кто-то пишет на бланке «трудный вход». Вы просите ее спеть предыдущую строчку, а другой певец определяет, в какое время они ее слышат. Бизе проверяет, чья это просьба, и вставляет листок в партитуру, которую они использовали в тот вечер. Первые слова остаются на виду, чтобы певец, спросивший о них, в следующий раз сразу их нашёл.'
      outcomes:
        all: 'Занавес откроется 3 марта. Бизе получает записку, в которой указан этот отрывок, и в записи до сих пор записана его смерть в июне.'
        p1: 'Занавес поднимается вовремя. Короткую записку исполнители присылают позже, и Бизе еще приходится спрашивать, о какой партии она идет.'
        p2: 'Бизе получает промах и находит в партитуре свои первые слова. Премьера не синхронизирована, и в отчете о поездке сохранилась только передача.'
      none: 'Две отметки в партитуре выглядят одинаково. Уходящие люди до сих пор не могут договориться, кто из них приведет припев.'
      not_admitted: 'Человек у служебного входа никогда не узнает твоего имени. Вы стоите подальше от входа и слышите, как певцы снова отсчитывают несколько ударов.'
      desync: 'Репетиция срывается, и премьера 3 марта не начинается. Офис отзывает путешественника.'
      excerpts:
        p1: 'После одной остановки все начинают со слова, которое вызывает припев. Когда со второй попытки всё сходится, человек у выхода на сцену даёт знак продолжать.'
        p2: 'Бизе проверяет, чья это просьба, и вставляет листок в партитуру, которую они использовали в тот вечер. Первые слова остаются на виду, чтобы певец, спросивший о них, в следующий раз сразу их нашёл.'
    relic: 'Веер'
    relic_desc: 'Расписной бумажный веер из партера.'
    points:
      p1: 'Помогите театру выделить певцам финальный прогон для репетиции сложных номеров с движением и оркестром.'
      p2: 'Возьмите Бизе репортаж с вечернего выступления, с точным отрывком, который певцы все еще хотят повторить.'
    points_fail:
      p1: 'Репетиции замирают, и 3 марта театр не может поднять занавес. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Записка доходит до Бизе с опущенным отрывком. Он узнает, что возникла проблема, и он не услышал, какую часть певцы хотели репетировать.'
    shift:
      p1:
        was: 'В сценическом реестре Оперы-Комик записаны репетиции и приготовления к сцене 3 марта 1875 года, в день открытия «Кармен».'
      p2:
        was: 'Первый показ «Кармен» продолжился после мартовской премьеры.'
        now: 'В этой ветке {staff} предоставляет Бизе отчет, который он может использовать. Он отмечает запись в партитуре и может обсудить ее с певцами перед следующим выступлением.'
    vignettes:
      future: 'Вы говорите служителю, что позже эту оперу узнают зрители в городах, в которых он никогда не был. Он спрашивает, почему ему сегодня вечером нужно вести дополнительную программу. Вы показываете ему, где напечатаны первая ночь и имя Галли-Мари. Один экземпляр уходит в его ящик. Вы уходите до того, как у него появится второй читатель.'
      label: 'Дежурный подложил два листа под одним заголовком. Вы разделяете их по дате и отмечаете первую ночь на запасной обертке. Более поздний читатель теперь может попросить нужный лист. Вы скучаете по выходящей публике.'
      seat: 'Вы одалживаете программу опоздавшему посетителю и возвращаете ее у двери после того, как посетитель занял свое место. Вы копируете одно имя на свой бланк. К тому времени музыка внутри продолжилась.'
  artemisia_florence:
    name: 'Первая женщина в Академии'
    place: 'Флоренция'
    figure: 'Артемизия Джентилески'
    story: 'Артемизия Джентилески стала первой женщиной, принятой во Флорентийскую академию рисования в 1616 году. В ее флорентийские годы входит работа, ныне известная как «Автопортрет лютниста».'
    story_prose:
      opening:
        - 'В магазине во Флоренции открыты две бухгалтерские книги. В один помещаются пигменты, а в другой — квитанция об оплате обучения. Артемизия просит клерка держать их отдельно и сообщить ей июльский день, когда она сможет получить квитанцию.'
        - 'Флорентийская академия рисования приняла Артемизию 19 июля 1616 года. Она также работала над заказами. В этом филиале вы можете оплатить вступительный взнос и помочь ей получить аванс к следующему договору на покраску.'
        - 'Тот, кто хорошо разбирается в счетах, может проверить оплату академии. Кто-то, кто может заключить устное соглашение в письменной форме, может помочь ей узнать у клиента нужную дату.'
      points:
        p1: 'Клерк отнес квитанцию академии к счетам за пигменты, которые необходимо оплатить. Вы спрашиваете Artemisia, какой платеж должен быть произведен первым, и проверяете имя получателя рядом с датой поступления. Клерк достает квитанцию и оставляет ей копию. Она забирает со стойки листок со своим именем.'
        p2: 'Когда поступает последний платеж, покупательница спрашивает, когда раньше она сможет приступить к следующей картине. Артемизия отодвигает свою бумажку с пигментом и ждет, пока он прочитает ее вслух. Вы просите клерка записать аванс до начала работы и раздать по одному экземпляру каждому человеку. Когда она идет покупать пигменты, она берет бумагу, на которой указано, когда она сможет получить деньги.'
      outcomes:
        all: 'Академия принимает плату. В следующем соглашении указывается дата аванса. Артемизия платит за пигменты и натягивает первый холст.'
        p1: 'Артемисия принята в историческую дату. Когда она в следующий раз захочет заказать припасы, ей все равно придется просить деньги у своего покровителя.'
        p2: 'Аванс идет на следующий договор. Взнос в академию задерживается, и от поездки остаются только переговоры по картине.'
      none: 'Квитанции по двум расходам все еще лежат в одной куче. Продавец еще раз спрашивает, за что платить первым.'
      not_admitted: 'У клерка есть места для людей, которых он ожидает. Вы остаетесь снаружи и смотрите, как кто-то подкладывает академический бланк среди счетов за пигмент.'
      desync: 'Плата в день оплаты не взимается. Регистрация не синхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'Клерк достает квитанцию и оставляет ей копию. Она забирает со стойки листок со своим именем.'
        p2: 'Вы просите клерка записать аванс до начала работы и раздать по одному экземпляру каждому человеку. Когда она идет покупать пигменты, она берет бумагу, на которой указано, когда она сможет получить деньги.'
    relic: 'Баночка с пигментом'
    relic_desc: 'Небольшая баночка молотого ляписа синего цвета.'
    points:
      p1: 'Помогите Артемизии собрать деньги на оплату обучения в академии к моменту ее поступления 19 июля.'
      p2: 'Когда первая комиссия будет рассчитана, помогите Артемизии получить аванс в следующем соглашении, чтобы она могла купить материалы до того, как начнет рисовать.'
    points_fail:
      p1: 'Артемизия не может покрыть плату за день в этом отделении. Ее регистрация рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Остаток за август выплачен, как указано, но Артемизии все равно придется просить деньги, когда ей нужно будет купить материалы для очередной комиссии.'
    shift:
      p1:
        was: '19 июля 1616 года в Академию рисования во Флоренции была принята Артемизия Джентилески.'
      p2:
        was: 'В 1615–1616 гг. комиссия Буонарроти выплачивалась в рассрочку. В архиве хранится просьба Артемизии о деньгах, пока она над ней работала.'
        now: 'Следующая комиссия устанавливает дату подачи материалов до начала работ. Artemisia может заказать пигменты по согласованной оплате.'
        who: 'artemisia_florence'
        bio: 'Она написала «Аллегорию наклонения» для дома Микеланджело Буонарроти Младшего, где она остается частью декора. Прием также дал ей доступ к трибуналу академии по спорам, возникающим из ее профессии.'
    vignettes:
      pose: 'Посетитель поворачивается к зеркалу и спрашивает, какая поза выглядит более естественной. Вы спрашиваете, что делает каждая поза. Они выбирают тот, который позволяет руке сохранять свою цель.'
      name: 'В листе практики есть описание натурщика, но нет места для имени художника. Вы переворачиваете его и просите посетителя положить оба, прежде чем листы будут сложены в стопку.'
      mirror: 'Вы перемещаете зеркало до тех пор, пока посетитель не сможет видеть угол, не поворачиваясь. Они пробуют позу один раз, затем перед рисованием вносят небольшие изменения.'
  buchner_zurich:
    name: 'Два черновика на репетиционном столе'
    place: 'Цюрих'
    figure: 'Георг Бюхнер'
    story: 'В 1836 году Георг Бюхнер приехал в Цюрих как беженец и начал читать лекции в университете. Он тяжело заболел в феврале 1837 года. Его невеста Минна Ягле приехала из Страсбурга и добралась до него ближе к концу. Он умер 19 февраля в возрасте двадцати трех лет, оставив Войцека незавершенным.'
    story_prose:
      opening:
        - 'В Цюрихе кто-то кладет на стол два черновика отдельно, потому что в них написано имя одного и того же персонажа. Бюхнер просит из другой комнаты лист, на котором можно написать письмо. Пока у него еще есть силы, он хочет попросить Минну приехать из Страсбурга.'
        - 'В феврале 1837 года Бюхнер сильно заболел в Цюрихе. Минна прибыл поздно из-за болезни, и он умер там. Войцек сохранился в нескольких незаконченных черновиках. Вы можете отправить ему сообщение раньше и принести в офис вымышленную аптечку, чтобы помочь с его уходом.'
        - 'Отправьте курьера узнать, что хочет сказать сам Бюхнер. У его постели используйте кого-нибудь с опытом ухода и набор, предварительно проконсультировавшись с уже находящимися там людьми.'
      points:
        p1: 'Посыльный поднимает заблудшую страницу, думая, что это незаконченное письмо. Вы просите Бюхнера передать его собственные слова тому, кто записывает их на новом листе. Как только адрес проверен, мессенджер оставляет игру на столе и переходит на новую страницу. Пока он это делает, Бюхнер слышит, как он произносит имя Минны полностью.'
        p2: 'Кто-то в доме читает заголовки вслух, пока Бюхнер не просит их остановиться. Вы объясняете, что такое офисный набор, и позволяете его сиделке остаться у кровати. Через некоторое время Бюхнер открывает глаза и указывает на более тонкую из двух стопок. Помощник приближает его. На этот раз Бюхнеру не нужно, чтобы кто-то выбирал за него страницы.'
      outcomes:
        all: 'Минна приезжает в Цюрих как раз вовремя, чтобы Бюхнер сказал ей то, что он хотел сказать. Лихорадка поднимается. Две стопки на столе все еще ждут, чтобы их привели в порядок.'
        p1: 'Письмо отправляется достаточно скоро, чтобы Минна услышала, как он говорит сам. Его болезнь продолжается, и он умирает в Цюрихе.'
        p2: 'У Бюхнера поднимается температура, и он просит глоток. Предыдущее сообщение Минне все еще не пришло вовремя.'
      none: 'Письмо и рабочие документы лежат вместе. Минна прибывает ближе к концу, и он умирает в Цюрихе.'
      not_admitted: 'Люди в помещении просят посетителя подождать и не беспокоить его. На листе для письма до сих пор нет адреса.'
      excerpts:
        p1: 'Как только адрес проверен, мессенджер оставляет игру на столе и переходит на новую страницу. Пока он это делает, Бюхнер слышит, как он произносит имя Минны полностью.'
        p2: 'Помощник приближает его. На этот раз Бюхнеру не нужно, чтобы кто-то выбирал за него страницы.'
    relic: 'Набор сцен'
    relic_desc: 'Свободные сцены в скрюченной руке, в произвольном порядке.'
    points:
      p1: 'Отправьте сообщение в Страсбург, пока Бюхнер еще может попросить Минну приехать сам.'
      p2: 'Поднесите к его постели медицинскую аптечку и помогите людям, ухаживающим за ним, справиться с лихорадкой.'
    points_fail:
      p1: 'Минна приходит к нему на позднем этапе его болезни. Сообщение, которое он хотел ей отправить, все еще лежит на столе.'
      p2: 'Лихорадка продолжается. Он больше не может просить страницы, лежащие на его столе.'
    shift:
      p1:
        was: 'Февраль 1837 года: его невеста Минна Ягле поспешила из Страсбурга в Цюрих, прибыв туда, когда он уже умирал; вскоре он умер вместе с ней.'
        now: 'В этой ветке Минна быстрее доберется до Цюриха. Они могут разговаривать друг с другом, пока он еще достаточно силен.'
      p2:
        was: 'Бюхнер умер в Цюрихе 19 февраля 1837 года, а Войцек остался незавершенным.'
        now: 'В этом филиале офисная аптечка помогает {staff} снизить температуру. Бюхнер жив и может попросить показать страницы, которые все еще лежат у него на столе.'
        who: 'buchner_zurich'
        bio: 'В этой ветви Бюхнер переживает свою болезнь в Цюрихе в феврале 1837 года.'
    vignettes:
      order: 'Читатель сложил два экземпляра вместе и пронумеровал сцены чернилами. Вы добавляете к каждому источнику отдельную этикетку и записываете предлагаемый заказ на съемном бланке. Следующий читатель может отменить это. Вы приносите домой этот бланк; у вас еще нет окончательного заказа.'
      pause: 'Вы знаете, что будущим театрам придется решать, что будет дальше. Читатель спрашивает, принадлежит ли ваш ответ автору. Вы пробуете оба начала вслух и отмечаете, где они оставляют разные вопросы. Можно взять две паузы домой и ни одного законченного сценария.'
      gap: 'Вы просите читателя остановиться в тот момент, когда страница останавливается. Никто из вас не вставляет недостающую строку. В своем экземпляре вы оставляете достаточно широкое пространство, чтобы его можно было заметить с первого взгляда. Это пространство — то, что вы помните, когда вернетесь.'
  enheduanna_ur:
    name: 'Дорога сквозь колючки'
    place: 'Ур, Месопотамия'
    figure: 'Энхедуанна'
    story: 'На диске из Ура Энхедуанна названа дочерью Саргона. В «Возвышении Инаны» оратор называет себя Энхедуанной и описывает, как ее изгнали из храма. Она сравнивает свой полет с полетом ласточки и говорит о шипах и утомлении. Дата и маршрут путешествия неизвестны.'
    story_prose:
      opening:
        - 'За пределами Ура в сумерках камни трудно разглядеть. Энхедуанна останавливается у тернового куста и поднимает пустой кувшин с водой. Кто-то, идущий с ней, помнит дверной проем дальше, где они могли сидеть.'
        - 'Надпись на диске сохраняет имя Энхедуанны. Стихотворение, переданное в более поздних копиях и традиционно приписываемое ей, описывает перемещение и тернии в другой стране. Эта поездка берет свое начало из стихотворения и дает ей возможность остановиться в дороге.'
        - 'Отправьте кого-нибудь, кто привык, на долгую прогулку с водой, чтобы поделиться. У первого занятого дома спросите, не хочет ли она подождать там до утра.'
      points:
        p1: 'Ее спутник хочет сохранить воду до следующего двора. Вы спрашиваете Энхедуанну, хочет ли она продолжать идти. Она указывает пустой банкой на ближайшую к вам стену. Вы даете ей воды и спрашиваете человека у двери, может ли она посидеть там до рассвета. Впервые за полдня она ставит полную банку на ровную землю.'
      outcomes:
        all: 'Она проводит ночь внутри низкой стены. В более позднем стихотворении все еще говорится о шипах. В поездке есть отдельная запись о месте, которое она нашла засветло.'
        p1: 'Домочадцы освобождают место для Энхедуанны у двери. Перед уходом она просит своего спутника наполнить и его банку.'
      none: 'До наступления темноты из-за стены не приходит ответа. Партия должна продолжать идти.'
      not_admitted: 'Партия признает свою компанию и не зовет вас с собой. У вас есть только время, чтобы поставить банку с водой у двери.'
      excerpts:
        p1: 'Вы даете ей воды и спрашиваете человека у двери, может ли она посидеть там до рассвета. Впервые за полдня она ставит полную банку на ровную землю.'
    relic: 'Глиняная чашка для воды'
    relic_desc: 'Маленькая чашка, принадлежащая вымышленному дому у дороги.'
    points:
      p1: 'После того, как Энхедуанну выгонят из храма, принесите воды и помогите ей добраться до места для отдыха.'
    points_fail:
      p1: 'Место, где вы надеялись остановиться, еще слишком далеко. У вас закончится дневной свет, прежде чем вы сможете предложить ей место для отдыха.'
    shift:
      p1:
        was: 'Оратор «Возвышения Инаны» описывает, как его выгнали из храма, он столкнулся с шипами и исчерпал силы.'
        now: 'В этой ветке {staff} ходит с Энхедуанной, пока они не достигают убежища, и до наступления темноты приносит ей воды.'
        who: 'enheduanna_ur'
        bio: 'В этом филиале Энхедуанна встречается с компанией и находит место для отдыха после выхода из храма.'
    vignettes:
      inscription: '{staff} проверяет, сколько взимает домохозяйство за повторное наполнение банки. Человек у двери говорит, что они могут сначала выпить, а остальное обсудить после рассвета.'
      support: '{staff} просит компаньона поставить банку, прежде чем помочь кому-то добраться до низкой стены. На этот раз банка останется вертикально.'
      edge: '{staff} проверяет, свободно ли место возле дверного проема. Кто-то внутри убирает корзину со скамейки.'
  ibn_sina_hamadan:
    name: 'Последний приступ колик'
    place: 'Хамадан, Персия'
    figure: 'Ибн Сина'
    story: 'Ибн Сина закончил свой пятикнижный «Канон медицины» в Хамадане за несколько лет до своего последнего путешествия. В рассказе, продолженном его товарищем аль-Джузджани, Ибн Сина страдает от повторяющихся приступов болей в животе. Он умирает в 1037 году во время путешествия в Хамадан вместе с правителем, которому он служит.'
    story_prose:
      opening:
        - 'Группа, направляющаяся в Хамадан, собирает постельное белье. Ибн Сина откладывает свои бумаги и спрашивает, могут ли они немного подождать. Товарищ видит, как он держится за живот и ищет место, где можно прилечь.'
        - 'В продолжении его биографии зафиксированы периодические боли ближе к концу его жизни. Ибн Сина умер в Хамадане в 1037 году. В этой ветке вы можете спросить, где он хочет остановиться, и попросить кого-нибудь остаться с ним, пока он отдыхает.'
        - 'Кто-то, обладающий опытом ухода, может спросить его, когда он захочет остановиться. Найдите компаньона, которого он уже знает. Он и партия могут решить, как долго ждать.'
      points:
        p1: 'Кто-то спрашивает, не пора ли ему помочь подняться. Вы приседаете у одеяла и спрашиваете, где он хотел бы остановиться. Он указывает на тенистое место дальше, где ему будет на что опереться. Вы просите товарища передать его вещи кому-нибудь другому и сесть так, чтобы Ибн Сина мог его видеть. На следующий стук изнутри приходит ответ с просьбой дать еще немного времени.'
      outcomes:
        all: 'На этом этапе пути группа ждет, пока Ибн Сина скажет, когда он сможет встать. Он все еще умирает после прибытия в Хамадан.'
        p1: 'Один товарищ остается сидеть с ним. Никто не просит его поспешить за уже упакованным багажом.'
      none: 'Остальные снова готовы, а ему по-прежнему негде лечь. У них впереди еще дорога.'
      not_admitted: 'Один из участников группы благодарит вас и просит посетителей, которых он не пригласил, подождать снаружи. Вы не можете спрашивать, чего он хочет.'
      excerpts:
        p1: 'Вы просите товарища передать его вещи кому-нибудь другому и сесть так, чтобы Ибн Сина мог его видеть. На следующий стук изнутри приходит ответ с просьбой дать еще немного времени.'
    relic: 'Сложенный клочок бумаги'
    relic_desc: 'Вымышленная путевая записка, отмечающая место остановки вечеринки.'
    points:
      p1: 'Когда боль вернется, спросите Ибн Сину, где он хочет остановиться, и попросите кого-нибудь остаться с ним, пока он отдыхает.'
    points_fail:
      p1: 'Отряд снова готов двигаться дальше, прежде чем вы подготовите для него место, где он сможет лечь.'
    shift:
      p1:
        was: 'В отчете Аль-Джузджани описываются рецидивы и смерть Ибн Сины в Хамадане в 1037 году.'
        now: 'В этой ветке {staff} находит место, где Ибн Сина может отдохнуть, когда боль вернется. Спутник остается с ним и передает его ответ людям, ожидающим отправления.'
    vignettes:
      section: '{staff} спрашивает, как далеко они проехали после последней остановки, и записывает ответ в записку, которую можно будет прочитать позже.'
      sleeve: 'Кто-то начинает скатывать постельное белье. {staff} просит их оставить одно одеяло развернутым, пока Ибн Сина не решит, идти ли ему.'
      afterlife: '{staff} спрашивает, кто будет ждать в комнате, пока остальные готовятся. Один товарищ несет его вещи обратно в дом.'
  al_jazari_diyarbakir:
    name: 'Книга хитроумных машин'
    place: 'Диярбакыр'
    figure: 'Аль-Джазари'
    story: 'Трактат Аль-Джазари о механических устройствах датируется 1206 годом. Сохранившийся рукописный фолиант, скопированный в 1315 году, иллюстрирует часы со слоном.'
    story_prose:
      opening:
        - 'В Amid клерк открывает список страниц на доставочном столе. Кто-то приходит с рисунками и говорит, что один из заголовков может принадлежать двум главам. Скамейка уходит в тень. Аль-Джазари просит их проверить еще раз, пока они видят.'
        - 'Аль-Джазари завершил свою книгу о механических устройствах в 1206 году. В сохранившихся копиях наряду с рисунками сохранились описания. Здесь вы можете защитить передачу и попросить его выбрать справочный набор для последующих переписчиков.'
        - 'Попросите кого-нибудь, кто сможет сопоставить подпись с абзацем, проверить исходный текст. Переписчик может спросить, какие примечания и пробелы автор хочет оставить как есть.'
      points:
        p1: 'Клерк указывает на повторяющийся заголовок в содержании. Аль-Джазари велит ему перевернуть еще одну страницу, где рядом со вторым рисунком вы увидите отметку, ведущую куда-то еще. Вы добавляете две ссылки на страницы в список передачи и предлагаете получателю проверить их самостоятельно. Он закрывает книгу и говорит, что нашел их обоих.'
        p2: 'Переписчик хочет сэкономить место, помещая примечание на полях в основной текст. Аль-Джазари просит его прочитать исходное предложение до паузы, а вы указываете рядом с ним другой источник примечания. Следующий читатель все равно сможет увидеть, где автор оставил пробел. Переписчик поднимает ручку и снабжает дополнение отдельной надписью внизу.'
      outcomes:
        all: 'Клерк получает полную рукопись. Вторая копия сохраняет ссылки и дает переписчикам возможность идентифицировать оригинальные подписи.'
        p1: 'Набор поставляется целиком, а его содержимое приводится к каждой иллюстрации. До сих пор не существует эталонной копии, которая разделяла бы новые заметки.'
        p2: 'Происхождение заметок установлено. В комплекте поставки по-прежнему отсутствует соответствующий чертеж, и поездка не может сохранить всю передачу.'
      none: 'Повторяющиеся заголовки остаются неразрешенными. Приходит следующий переписчик и спрашивает, какой том открыть.'
      not_admitted: 'Клерк зачитывает имена людей, получивших набор. Вам никто не звонит, и содержимое остается закрытым.'
      desync: 'Некоторые рисунки больше не могут быть сопоставлены с содержимым. Комплект не может быть доставлен, и офис отзывает путешественника.'
      excerpts:
        p1: 'Вы добавляете две ссылки на страницы в список передачи и предлагаете получателю проверить их самостоятельно. Он закрывает книгу и говорит, что нашел их обоих.'
        p2: 'Следующий читатель все равно сможет увидеть, где автор оставил пробел. Переписчик поднимает ручку и снабжает дополнение отдельной надписью внизу.'
    relic: 'Латунный кулачок'
    relic_desc: 'Колесо особой формы, которое превращает вращение в удар.'
    points:
      p1: 'При передаче в Амид сверьте описания и иллюстрации с содержанием, чтобы рукопись можно было передать в полной комплектации.'
      p2: 'Выберите эталонный экземпляр вместе с автором. Перечислите примечания, подписи и пробелы, которые впоследствии переписчикам следует различать.'
    points_fail:
      p1: 'Некоторые диаграммы больше не могут быть сопоставлены со своими разделами. Рукопись не может быть сдана комплектом, и офис отзывает сотрудника.'
      p2: 'Следующий переписчик работает по черновику, накопившему другие записи. Читатели не могут отличить описание автора от более поздних дополнений.'
    shift:
      p1:
        was: 'В колофоне ранней рукописи Топкапы указана дата ее завершения 16 января 1206 года. Книга Аль-Джазари была связана с двором Артукидов в Амиде.'
      p2:
        was: 'Не все более поздние рукописи происходят по одной и той же ветви. Некоторые имеют другие иллюстрации и формулировки.'
        now: 'В коллекции хранится копия, проверенная автором. Более поздний писец может записать свои изменения отдельно, а затем сверить с ними подписи.'
        who: 'al_jazari_diyarbakir'
        bio: 'Аль-Джазари написал свои описания в «Амиде». Текст и иллюстрации менялись вместе по мере копирования и перемещения книги между местами.'
    vignettes:
      sequence: 'Ученик объясняет сразу каждую цифру. Вы указываете на первое движение и спрашиваете, что следует сразу за ним. Они начинают рассказывать историю часов по порядку.'
      viewer: 'Посетитель никогда не отрывает взгляда от самой большой фигуры. Вместо этого вы просите их посмотреть на место, отмеченное учеником. На второй демонстрации они видят меньшее движение во времени.'
      paper: 'Вы держите рисунок, пока ученик указывает на модель. Они добавляют одну небольшую пометку, чтобы читатель без модели знал, где искать.'
  hokusai_edo:
    name: 'Большая волна в Канагаве'
    place: 'Эдо, Япония'
    figure: 'Кацусика Хокусай'
    story: '«Под волной у Канагавы» Хокусая — гравюра на дереве из книги «Тридцать шесть видов горы Фудзи». Метрополитен датирует свое впечатление примерно 1830–1832 годами.'
    story_prose:
      opening:
        - 'Издатель Эдо выкладывает на прилавок три свежих отпечатка. На самом темном изображении небольшая часть гребня заполнилась. На самом бледном отдалённую Фудзи трудно увидеть. Резчик тянется за одним листом, а принтер — за другим.'
        - '«Под волной у Канагавы» — один из «Тридцати шести видов горы Фудзи» Хокусая. Сохранившиеся отпечатки сохраняют такие изменения, как износ блоков. Вы можете разместить общую ссылку в прессе и попросить издателя сохранить последовательность, которую можно будет проверить позже.'
        - 'Попросите кого-нибудь, кто знает отпечатки, сравнить листы. Тот, кто может организовать хранение, может спросить Хокусая, типографа и издателя, как хранить более поздние образцы.'
      points:
        p1: 'Резчик подносит одно доказательство к окну, откуда он может видеть Фудзи сквозь синеву. Вы просите принтер посмотреть на герб в том же свете и сравнить его с другим листом. Они оба приложили палец к одной и той же четкой линии. Выбранное доказательство получает небольшую отметку в углу. Пространство над далекой горой остается чистым.'
        p2: 'Продавец кладет образцы в стопку для продажи. Издатель спрашивает, смогут ли они найти их снова в следующий раз. Вы просите Хокусая и печатника написать заказ на обертке и оставить ее открытой с одного конца для последующих корректур. Следующий лист из блока отправляется в заднюю часть набора, прежде чем он окажется где-нибудь рядом с прилавком.'
      outcomes:
        all: 'Первые впечатления поступают в продажу и в мастерской еще есть набор для сравнения. Когда другой принтер вступает во владение, заказ все равно можно прочитать, перелистывая страницы.'
        p1: 'Резчик и печатник заканчивают первый тираж с одной корректуры. Позже образцы расходятся среди проданных экземпляров.'
        p2: 'Образцы имеют порядок. Первый запуск по-прежнему задерживается, поскольку линия рвется. Путешественник приносит домой сцену, где были заказаны корректуры.'
      none: 'Издатель выставляет на кассу самый чистый на вид лист. Люди, которые приходят проверить герб, по-прежнему рассматривают разные экземпляры.'
      not_admitted: 'Издатель спрашивает, какой принтер вам принёс. Никто не знает посетителя, и доказательства возвращаются за прилавок.'
      desync: 'Волна продолжает разбиваться на одном и том же месте, а первая партия не уходит из цеха. Офис отзывает путешественника.'
      excerpts:
        p1: 'Выбранное доказательство получает небольшую отметку в углу. Пространство над далекой горой остается чистым.'
        p2: 'Следующий лист из блока отправляется в заднюю часть набора, прежде чем он окажется где-нибудь рядом с прилавком.'
    relic: 'Ксилография для печати'
    relic_desc: 'Резная доска из вишневого дерева.'
    points:
      p1: 'Выберите корректуру издателя Эдо, в которой четко читаются и гребень волны, и далекий пик. Оставьте его резчику и принтеру в качестве образца для первого запуска.'
      p2: 'Прежде чем издатель разберет гранки, попросите Хокусая и типографа сохранить набор для сравнения. Попросите издателя подавать новое доказательство каждый раз, когда возобновляется печать.'
    points_fail:
      p1: 'Резчик и печатник не имеют общих доказательств и продолжают присылать обратно листы с одной и той же ломаной волнистой линией. Издательство задерживает первую доставку, и офис отзывает сотрудника.'
      p2: 'На прилавке остаются только распродажные экземпляры. Корректуры, проверенные Хокусаем на принтере, возвращаются в запас, и новый принтер не может восстановить комплект.'
    shift:
      p1:
        was: 'Издатель Эдо Эйдзюдо рекламировал «Тридцать шесть видов горы Фудзи» к Новому 1831 году. «Под волной у Канагавы» входит в эту серию, и ранние впечатления с неповрежденными линиями волн сохранились.'
      p2:
        was: 'Эти оттиски не содержат дат или номеров партий. Оригинальные блоки не сохранились, и следы на отпечатках являются основным ключом к разгадке их последовательности.'
        now: 'Эйдзюдо держит в порядке пачку доказательств за прилавком. Новый принтер может определить, какой пробел появился позже, и попросить Хокусая оценить, соответствует ли тираж его замыслу.'
        who: 'hokusai_edo'
        bio: 'Хокусай разработал изображение. Его внешний вид на бумаге также зависел от того, где вырезал резчик, как принтер переносил чернила и когда издатель заказал еще один тираж.'
    vignettes:
      mountain: 'Продавец указывает на пенопласт. Вы просите его накрыть волну рукой. Как только он его обнаруживает, маленький треугольник вдалеке уже не похож на еще один всплеск.'
      edge: 'Продавец хочет обрезать тренировочный лист. Вы кладете необрезанную копию рядом и показываете ему, насколько близко подпись расположена к краю.'
      counter: 'Вы поворачиваете отпечаток к покупателю, который превыше всего ищет Fuji. В конце концов клиент находит его внизу страницы и просит показать его в другом представлении.'
  bell_boston:
    name: 'Запишите то, что услышали'
    place: 'Бостон'
    figure: 'Александр Грэм Белл'
    story: 'В лабораторной записной книжке Александра Грэма Белла записано, что 10 марта 1876 года в Бостоне Томас Уотсон услышал и понял слова, произнесенные Беллом в передатчик. На выставке столетия в Филадельфии 25 июня Белл продемонстрировал судьям телефон.'
    story_prose:
      opening:
        - 'В Бостоне двери обеих комнат закрыты. Ватсон закрывает ухо и слушает, пока Белл останавливается над скамейкой и спрашивает, могут ли они попробовать еще одно предложение. Кто-то думает, что работа окончена, и начинает убирать аппарат.'
        - '10 марта 1876 года Белл записал, что Ватсон понимал слова, посланные из другой комнаты. В июне Белл продемонстрировал свою продукцию на Столетней выставке в Филадельфии. Здесь вы можете сохранить процесс и помочь его коллегам договориться, чем будут заниматься его бостонские ученики, пока его нет.'
        - 'Кто-то, кто умеет следить за оборудованием и внимательно слушать, может помочь с двумя комнатами. Перед выставкой попросите кого-нибудь, кто разбирается в расписании персонала, проверить порядок обучения.'
      points:
        p1: 'Ватсон выходит и говорит, что слышал это. Вы оставляете написанное предложение лицевой стороной вниз и просите его рассказать, что получилось, от начала до конца. Белл берет ручку, когда слышит слова без подсказки. Мужчины меняются местами и снова закрывают двери. На этот раз будет говорить Ватсон.'
        p2: 'Коллега открывает расписание и говорит, что некоторые ученики знают только Белла. Белл зачитывает уже заданные упражнения и просит следующего учителя заполнить пустые часы. Вы помогаете сделать копию согласованного расписания для семей. Прежде чем чемодан будет упакован, Белл раскладывает свой экземпляр и железнодорожный билет по разным карманам.'
      outcomes:
        all: 'Мартовский процесс остается в блокноте. Когда в Филадельфии начинается демонстрация, занятия в Бостоне следуют согласованному графику.'
        p1: 'Ватсон повторяет то, что услышал. При подготовке к июню все еще отсутствует полезный план обучения.'
        p2: 'У студентов есть кому вести занятия. В мартовской записной книжке отсутствует окончательное подтверждение, и в поездке сохранились только договоренности на июнь.'
      none: 'Аппарат возвращается на скамейку без подтвержденных слов из соседней комнаты. В расписании занятий по-прежнему имеются пробелы.'
      not_admitted: 'Двери в обе комнаты закрыты. Кто-то отвечает через один из них и не оставляет посетителю места на скамейке.'
      desync: 'Историческое повторение или выставочная демонстрация теряются. Офис отзывает путешественника после того, как поездка рассинхронизируется.'
      excerpts:
        p1: 'Мужчины меняются местами и снова закрывают двери. На этот раз будет говорить Ватсон.'
        p2: 'Вы помогаете сделать копию согласованного расписания для семей. Прежде чем чемодан будет упакован, Белл раскладывает свой экземпляр и железнодорожный билет по разным карманам.'
    relic: 'Телефонная трубка'
    relic_desc: 'Деревянный наконечник с тонкой диафрагмой.'
    points:
      p1: 'Держите Бостонский аппарат наготове для еще одного испытания, а Ватсон будет слушать в другой комнате, пока он не сможет повторить слова.'
      p2: 'Прежде чем Белл покинет Бостон, попросите его и его коллег договориться о том, что следует сделать для его учеников, пока его нет на выставке.'
    points_fail:
      p1: 'Оборудование возвращается на место прежде, чем Ватсон сможет подтвердить то, что он услышал. Мартовский судебный процесс не синхронизирован, и офис отзывает {staff}.'
      p2: 'Белл остается в Бостоне, чтобы присматривать за своими учениками. Его выставочная демонстрация рассинхронизируется, и в офисе вспоминают {staff}.'
    shift:
      p1:
        was: '10 марта 1876 года в Бостоне Белл использовал экспериментальный аппарат, чтобы передать внятное предложение Ватсону, находившемуся в соседней комнате.'
      p2:
        was: '25 июня 1876 года в Филадельфии Белл показал телефон судьям Centennial, в том числе дону Педро II и Уильяму Томсону.'
    vignettes:
      blind: 'Помощник получателя хочет сначала просмотреть предложение. Вы складываете бумагу и просите его писать только то, что он слышит. Два слова возвращаются без изменений, а последнее остается пустым. Держите эту оговорку. Когда ты уйдешь, вот-вот начнется еще одно испытание.'
      future: 'Вы говорите ассистенту, что люди запомнят одно предложение из этой даты. Он предполагает, что это будет то, что кто-то написал на стороне передатчика. Вы раздаете два листка: один для говорящего, другой для слушателя. Эта пара покажет разницу, которую история знаменитого приговора не может рассказать вам об этом процессе.'
      door: 'Вы несете сложенную сумку обратно через дверь. Только тогда вы кладете его рядом с проверочным предложением. Пропущенное слово по-прежнему отсутствует, но у двух совпадающих слов теперь есть запись. Вы вспоминаете сравнение и пропускаете следующее предложение.'
  cantor_halle:
    name: 'Письма из лечебницы'
    place: 'Галле'
    figure: 'Георг Кантор'
    story: 'Кантор вышел в отставку в 1913 году и провел свои последние годы больным и лишенным еды в военной Германии. В 1917 году он в последний раз поступил в клинику Галле. Он написал жене с просьбой вернуться домой и умер в клинике 6 января 1918 года.'
    story_prose:
      opening:
        - 'Стул стоит у окна клиники в Галле. Кантор кладет письмо, которое ему еще предстоит сложить, и спрашивает, придет ли кто-нибудь сегодня. Кухонную книгу только что перенесли наверх. Человек, несущий еду, тоже ждет.'
        - 'Кантор провел свои последние месяцы военного времени в клинике Галле и умер 6 января 1918 года. Этот визит может помочь ему увидеть члена семьи, а на кухне составить действенный план питания.'
        - 'Отправьте кого-нибудь, кто услышит, кого он хочет видеть, прежде чем назначать визит. Тот, кто может проверить, что есть на кухне, может найти еду, которую он сможет съесть.'
      points:
        p1: 'Вы пишете два возможных дня под письмом. Кантор рассматривает их, затем называет члена семьи, о котором он хочет, чтобы вы спросили в первую очередь. Когда наступает свидание, дежурный убирает стул из коридора. В тот день люди выходят на улицу, и человек в кресле все еще слышит каждое слово.'
        p2: 'Кухня может сказать только, в какие дни она ожидает иметь что-то запасное. Вы спрашиваете, что оно может гарантировать, проверяете, что может прислать семья, а затем спрашиваете Кантора, что он может закончить. В следующий раз, когда ему приносят еду, он смотрит на часы и говорит, что сейчас час, о котором они договорились вчера.'
      outcomes:
        all: 'Зимой у нас будет дополнительный визит, и некоторые блюда придут в оговоренный час. В январе семья все еще получает известие о его смерти в Галле.'
        p1: 'Кантор видит человека, которого больше всего хотел видеть. Кухня по-прежнему может служить ему только тем, что у нее есть в запасе на этот день.'
        p2: 'Есть более регулярное питание. Его семья не может приехать и вместо этого передает привет письмом.'
      none: 'Стул по-прежнему смотрит в окно. Кухня складывает бухгалтерскую книгу, и ей нечего обещать.'
      not_admitted: 'Дежурный говорит, что визит сегодня не был запланирован. Вы оставляете сложенную бумагу у двери.'
      excerpts:
        p1: 'Когда наступает свидание, дежурный убирает стул из коридора. В тот день люди выходят на улицу, и человек в кресле все еще слышит каждое слово.'
        p2: 'В следующий раз, когда ему приносят еду, он смотрит на часы и говорит, что сейчас час, о котором они договорились вчера.'
    relic: 'Неиспользованный конверт'
    relic_desc: 'Придуманный конверт, оставленный рядом с письмами в Галле.'
    points:
      p1: 'Спросите Кантора, кого он больше всего хочет увидеть, и договоритесь о спокойном визите в клинику в Галле.'
      p2: 'Спросите на кухне и его семью, какую еду они могут оставить на зиму, и организуйте регулярный обед, который он сможет съесть.'
    points_fail:
      p1: 'Семья должна ответить письмом. Кресло, которое просил Кантор, остается пустым.'
      p2: 'Еда приходит, когда кто-то может ее пожалеть, и у Кантора все еще бывают дни, когда он голодает.'
    shift:
      p1:
        was: 'В 1917 году Кантор в последний раз поступил в клинику Галле. Он написал жене с просьбой приехать домой.'
        now: 'В этом филиале {staff} организуется визит. Кантор может рассказать кому-нибудь из дома, что он вкладывает в свои письма.'
      p2:
        was: 'Кантор в последние годы своей жизни болел, и в военной Германии во время войны не хватало еды.'
        now: 'В этом филиале {staff} организует для Кантора надежное питание, чтобы в эти дни он мог поесть, не дожидаясь посылки.'
    vignettes:
      list: 'Дежурный начинает помещать ответ в исходящую почту. {staff} проверяет имена на двух обложках и возвращает ответ в таблицу Кантора.'
      after: 'Миска проходит мимо окна. {staff} спрашивает, кто еще ждет ужин, и служитель еще раз проверяет список блюд.'
      end: '{staff} спрашивает Кантора, где ему нужен стул. Он указывает на то место, с которого посетитель мог видеть его, не стоя в дверях.'
  leeuwenhoek_delft:
    name: 'Мир в капле воды'
    place: 'Делфт'
    figure: 'Антони ван Левенгук'
    story: 'В октябре 1676 года Левенгук писал из Делфта, что в капле перечной воды содержатся тысячи маленьких животных. Королевское общество в Лондоне спросило, как оно могло бы проверить его наблюдения. С мая по август 1677 года восемь свидетелей в Делфте и его окрестностях смотрели через его линзы и письменно записывали свои наблюдения. 5 октября он отправил их заявления в Лондон. Позже Роберт Гук показал зверушек членам Общества.'
    story_prose:
      opening:
        - 'В Делфте Левенгук вручает медную тарелку первому посетителю. Посетитель закрывает один глаз и по-прежнему ничего не видит. Другой уже держит ручку и ждет, что он скажет.'
        - 'В 1676 году Левенгук описал в Лондоне крошечных животных в воде. В течение следующего года восемь свидетелей в Делфте подписали показания, и их показания соответствовали его письму от 5 октября. Вы можете держать первых двух свидетелей у объектива и проверять вложения перед осенней почтой.'
        - 'Отправьте кого-нибудь, кто сможет направить другого наблюдателя к линзе. Осенью вам понадобится кто-то, кто сможет проверить все подписи на исходящем конверте.'
      points:
        p1: 'Первый свидетель переворачивает пластинку и теряет блик. Левенгук просит его отвести глаз назад, пока он не появится снова. Мужчина пишет, как движутся мелкие предметы. Вы переворачиваете его лист до тех пор, пока другой свидетель не сможет посмотреть и написать сам. Только когда оба закончили, они обмениваются листами и улыбаются двум описаниям.'
        p2: 'В октябрьском конверте уже есть письмо. Вы берете со стола просроченное заявление и просите Левенгука зачитать совместные подписи, прежде чем проверить листы по порядку. Фамилия находится не в том углу, где вы ее ожидаете. Прежде чем фамилия попадет в список вложений, необходимо поднять складку.'
      outcomes:
        all: 'Заявления покидают Делфт с письмом. Читатель может отслеживать каждую учетную запись по подписанному листу. Гук также покажет крошечных животных другим жителям Лондона.'
        p1: 'Первые два свидетеля изложили свои собственные наблюдения. Позже из октябрьской почты пропадает вложение.'
        p2: 'Разбросанные бумаги на столе учтены. Самая ранняя подписанная учетная запись отсутствует, и пакет больше не может соответствовать историческому.'
      none: 'Объектив стоит там, где стоял. Никакие подписанные доказательства не остаются после того, как посетители их осмотрят.'
      not_admitted: 'Ваше имя отсутствует в записи. Ученик берет латунную пластину внутрь и закрывает дверь.'
      desync: 'Самые ранние подписи и октябрьское приложение отсутствуют. Свидетельства расходятся, и офис отзывает путешественника.'
      excerpts:
        p1: 'Вы переворачиваете его лист до тех пор, пока другой свидетель не сможет посмотреть и написать сам. Только когда оба закончили, они обмениваются листами и улыбаются двум описаниям.'
        p2: 'Фамилия находится не в том углу, где вы ее ожидаете. Прежде чем фамилия попадет в список вложений, необходимо поднять складку.'
    relic: 'Крошечная латунная линза.'
    relic_desc: 'Пластина размером с большой палец, на которой находится одна очень маленькая и очень прозрачная линза.'
    points:
      p1: 'Дайте первым свидетелям время посмотреть в объектив и пусть каждый изложит увиденное движение своими словами.'
      p2: 'Пройдите октябрьский пакет в Делфте. Сопоставьте свободные показания свидетелей до того, как письмо отправится в Лондон.'
    points_fail:
      p1: 'Первые свидетели уходят, не успев изложить увиденное на бумаге. Офис отзывает {staff}, когда первые показания не синхронизируются.'
      p2: 'Письмо уходит, но на столе остается лист показаний. Офис отзывает {staff}, когда пакет не синхронизируется.'
    shift:
      p1:
        was: '18 мая 1677 года два свидетеля подписали протокол об увиденных ими зверьках. Еще шесть человек добавили свои показания в последующие месяцы.'
      p2:
        was: 'Левенгук приложил показания свидетелей к своему письму из Делфта от 5 октября. В ноябре Гук показал зверюшек Королевскому обществу в Лондоне.'
    vignettes:
      motion: 'Корреспондент пишет, что что-то двинулось. Вы спрашиваете, как выглядело это движение для человека, который не может видеть линзу. Они перечеркивают сравнение и рисуют вторую позицию рядом с первой.'
      label: 'На столе рисунки из дерева и от вина. Вы добавляете временные метки до того, как корреспондент соберет бесполезные листы, и изображения располагаются в правильном порядке.'
      read: 'Вы перечитываете наблюдение, не указывая на его иллюстрацию. Корреспондент слышит, где описание заканчивается, и добавляет ссылку на правильную схему.'
  newton_cambridge:
    name: 'Один закон для яблока и Луны'
    place: 'Кембридж'
    figure: 'Исаак Ньютон'
    story: '«Начала» Ньютона появились в Лондоне в 1687 году. В третьей книге он рассматривает Луну и падающие тела под одним и тем же понятием гравитации. Точная копия, отправленная в печать, не была у него в руках. Его написал Хамфри Ньютон, его секретарь в те годы и не являвшийся родственником. Намного позже Уильям Стьюкли записал воспоминания Ньютона о падающем яблоке, что вызвало вопрос о гравитации. Стьюкли ничего не говорит об ударе по голове.'
    story_prose:
      opening:
        - 'Копировальный стол в Кембридже завален бумагами для Лондона. Хамфри Ньютон только что выписал название фигуры, когда Исаак Ньютон нашел в доказательстве еще одну поправку к ней. Посыльный стучит.'
        - '«Начала» появились в Лондоне в 1687 году. Эдмон Галлей увидел их в прессе и 5 июля написал, что работа завершена. В этой ветке вы можете проверить последние исправления и предоставить читателям место для внесения изменений, которые Ньютон сможет отслеживать на своей странице.'
        - 'Отправьте путешественника, который сможет сверить номера страниц и предложений с пакетом. После публикации хороший организатор переписки может договориться с Ньютоном о том, как следует фиксировать изменения.'
      points:
        p1: 'Две промахи исправляют одну и ту же цифру. У одной нет номера книги. Вы с Хамфри лежите рядом с доказательством и просите Ньютона зачитать ту версию, которую он хочет сохранить. Посыльный повторяет адрес, пока вы сортируете листы по книгам и передаете их. Посыльный забирает пакет, а выброшенный заголовок остается на столе.'
        p2: 'Первая буква читателя обозначает номер без названия страницы. Вы передаете Ньютону распечатанный экземпляр и спрашиваете, поможет ли номер рисунка читателям его идентифицировать. Как только он найдет предложение, он попросит вас поставить дату письма в книге и оставить ему место для записи своего решения. Клерк находит ту же фигуру, когда приходит следующее письмо.'
      outcomes:
        all: 'Галлей пишет, что книга закончена. В Кембридже заполняется первая графа коррекционной книжки. Следующий человек, который возьмет книгу, сможет увидеть, как оставить исправление.'
        p1: 'Галлей получает последний комплект, и книга предстает в своей исторической форме. Более поздние изменения еще накапливаются в письмах и копиях.'
        p2: 'Корректирующая книга может привести читателя от предложения к его странице. Пакет для Лондона пошел не так, и этот визит сохраняет метод записи исправлений.'
      none: 'Два листка лежат друг на друге на столе. Следующий читатель сможет увидеть, что изменилось дважды, но не сможет сказать, какая оговорка произошла первой.'
      not_admitted: 'Посыльный говорит, что он должен забрать пакет у переписчика. Снаружи вы слышите, как переворачиваются два одинаковых листа.'
      desync: 'Галлей так и не получил ни одного из последних исправлений. Публикация рассинхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'Посыльный повторяет адрес, пока вы сортируете листы по книгам и передаете их. Посыльный забирает пакет, а выброшенный заголовок остается на столе.'
        p2: 'Как только он найдет предложение, он попросит вас поставить дату письма в книге и оставить ему место для записи своего решения. Клерк находит ту же фигуру, когда приходит следующее письмо.'
    relic: 'Стеклянная призма'
    relic_desc: 'Треугольник из стекла, который разделяет белый свет на цвета.'
    points:
      p1: 'Упакуйте последние исправления Ньютона по томам и страницам и доставьте их из Кембриджа в Галли до того, как закончится лондонская пресса.'
      p2: 'Когда выйдет первое издание, договоритесь с Ньютоном, как читатели могут вносить исправления, которые он сможет проверить по предложению и странице.'
    points_fail:
      p1: 'Выходят две версии исправления. Хэлли не может собрать последние исправления, и офис отзывает сотрудника.'
      p2: 'Корреспонденты используют собственные ссылки. Ранние исправления остаются разбросанными между письмами и экземпляром Ньютона.'
    shift:
      p1:
        was: '5 июля 1687 года Галлей написал, что «Начала» закончены и что последние исправления прибыли вовремя.'
      p2:
        was: 'Ньютон аннотировал свое первое издание. Подготовка исправленного издания заняла годы.'
        now: 'В колледже ведется книга исправлений, индексированная по предложениям. Читатели могут записать проблему и увидеть, какие изменения позже одобрил Ньютон и когда.'
        who: 'newton_cambridge'
        bio: 'Ньютон написал «Начала» в Кембридже, а Галлей увидел их в лондонской прессе. Ньютон продолжал редактировать работу после печати.'
    vignettes:
      apple: '— Ему яблоко по голове попало? — спросишь ты служащего колледжа, человека, созданного для игры. Он продолжает подметать. "Я не мог сказать. Ты скажи мне, почему Луна не заходит". У вас нет готового ответа, и вернитесь на страницу. Яблоко никем не записано еще шестьдесят пять лет.'
      hand: 'Чистый экземпляр не находится в руках человека, чье имя будет в книге. Слуга говорит, что это пишет мистер Хамфри, тоже Ньютон и не родственник. Запишите это и не беспокойте его.'
      diagram: 'На испорченном листе вы рисуете путь, по которому двигалась бы Луна, если бы ее ничто не удерживало, а затем стрелку для притяжения, изменяющего ее путь. Слуга, не умеющий читать по-латыни, некоторое время смотрит на стрелу.'
  bach_leipzig:
    name: 'Весна, когда приехал глазной врач'
    place: 'Лейпциг'
    figure: 'Иоганн Себастьян Бах'
    story: 'К весне 1750 года Бах из-за зрения едва мог читать и писать. Путешествующий окулист Джон Тейлор прооперировал его в Лейпциге, и осложнения привели к повторной операции. Бах умер 28 июля 1750 года.'
    story_prose:
      opening:
        - 'Пюпитр Лейпцига перенесен к окну. Бах слышит, как помощник переворачивает лист, и просит его начать с чтения его части. Джон Тейлор в городе. Кто-то в доме ждет, пока Бах скажет, когда он сможет его увидеть.'
        - 'Весной 1750 года Тейлор прооперировал Баха на глазах, после чего последовала вторая операция. Бах умер 28 июля. Эта ветка позволяет ему услышать мнение другого опекуна и решить, поможет ли читатель ему с его оценками.'
        - 'Отправьте кого-нибудь с опытом ухода, чтобы выслушать его опасения. Музыкант может спросить, кого бы он хотел ему прочитать. Пусть домочадцы сами скажут, когда будет время поговорить.'
      points:
        p1: 'Бах подталкивает партитуру к посетителю. Вы просите другого человека, осуществляющего уход, дать ему закончить описание того, что его беспокоит, прежде чем обсуждать, может ли он подождать. Бах просит семью отказаться от встречи и зовет знакомого певца, чтобы тот прочитал две части во второй половине дня. В конце первого отрывка он просит певца еще раз прочитать остальные.'
      outcomes:
        all: 'Той весной Бах установил несколько показаний для часов с лучшим освещением. Кто-то читает, а он слушает, положив руку на корпус клавиатуры. Семья все еще объявляет о его смерти в июле.'
        p1: 'Назначение Тейлора отменено. Когда свет достигает подставки, читатель начинает с паузы, которую просил Бах.'
      none: 'Встреча продолжается. Позже, когда семья убирает пюпитр, страница, которую кто-то мог прочитать для него, все еще лежит на столе.'
      not_admitted: 'Семья просит ожидающих остаться в передней комнате. Путешественника никогда не вызывают, и он ничего не слышит из того, что обсуждается.'
      excerpts:
        p1: 'Бах просит семью отказаться от встречи и зовет знакомого певца, чтобы тот прочитал две части во второй половине дня. В конце первого отрывка он просит певца еще раз прочитать остальные.'
    relic: 'Органная труба, вырезанная из пера'
    relic_desc: 'Небольшая трубка, настроенная и проверенная, осталась непроданной.'
    points:
      p1: 'Дайте Баху второе медицинское заключение, прежде чем он согласится на операцию Тейлора, и предложите организовать помощь с чтением, пока он примет решение.'
    points_fail:
      p1: 'У Баха нет другого мнения, которое можно было бы принять во внимание. Он продолжает операцию, но осложнения приводят к повторной.'
    shift:
      p1:
        was: 'Весной 1750 года Джон Тейлор прооперировал глаза Баха в Лейпциге. Осложнения привели к повторной операции.'
        now: 'В этой ветке Бах решает отказаться от операции Тейлора после разговора с {staff}. Его зрение остается плохим, и он просит кого-нибудь прочитать вместе с ним партитуру при дневном свете.'
        who: 'bach_leipzig'
        bio: 'В этом ответвлении Бах отклоняет операцию Тейлора весной 1750 года и просит помощи в чтении его партитур.'
    vignettes:
      entry: 'Вы слышите, как нижняя часть звучит на вдохе раньше, чем этого ожидает певец. Вы просите их слушать с другого конца комнаты. На этот раз они поднимают голову перед сигналом.'
      rest: 'Во время отдыха певец теряет счет. Вы копируете строку, которую они могут услышать во время ожидания, и они отмечают слово, которое появляется непосредственно перед их собственным входом.'
      light: 'Два певца делят одну страницу. Вы наклоняете его к свету и держите так, пока оба не увидят место, где их линии расходятся.'
  lavoisier_paris:
    name: 'До приказа об аресте'
    place: 'Париж'
    figure: 'Антуан Лавуазье'
    story: '24 ноября 1793 года было приказано арестовать всех бывших откупщиков, и Лавуазье и его тесть Жак Поль были среди заключенных. 8 мая 1794 года они оба и другие бывшие откупщики были осуждены и казнены в Париже в тот же день.'
    story_prose:
      opening:
        - 'В Париже Жак Поль раскрывает счет своей дочери. Антуан Лавуазье читает с другой страницы на другом конце стола. Оба мужчины намерены остаться в городе, чтобы рассказать о своих книгах. Кто-то из членов семьи спрашивает, кто мог бы присматривать за бухгалтерскими книгами вместо них.'
        - '24 ноября 1793 г. власти распорядились арестовать бывших откупщиков. Польз и Лавуазье были казнены 8 мая 1794 года. В этой ветке вы можете попросить обоих рассмотреть возможность покинуть Париж. Каждый решает сам.'
        - 'Кто-то, кто может выслушать доводы каждого человека, может поговорить с ними по очереди. Путешественник, который разбирается в счетах, также может составить список документов, которые должна оставить семья на хранение.'
      points:
        p1: 'Паулзе говорит, что, передав ему всю книгу, его семья не будет знать, каких вопросов ожидать. Вы просите его отмечать каждую страницу, пока он говорит. Его дочь проверяет счета, на которые он указывает, прежде чем забрать всю книгу. Когда он слышит, как она перечитывает его оценки, он встает и задвигает стул обратно под стол.'
        p2: 'У Лавуазье есть заявление с двумя записями, которые, по его мнению, ему еще предстоит объяснить. Вы спрашиваете, может ли он написать объяснения для человека, вступившего во владение. Услышав, как оба прочитали ему ответ, он просит свою семью сказать, что он уехал из Парижа, если кто-нибудь позвонит. Прежде чем уйти, он кладет страницу рядом с ними и оставляет под ней чистый лист.'
      outcomes:
        all: 'Оба мужчины покидают город по отдельности. Когда в мае семья открывает книги, от каждой из них есть новости. Оба живы.'
        p1: 'Паульзе уходит и все еще жив после мая следующего года. Лавуазье остается в Париже и позже казнен.'
        p2: 'Лавуазье уходит и все еще жив после мая следующего года. Жак Поль остается в Париже и позже казнен.'
      none: 'Семья отходит от стола. Оба мужчины остаются в городе, и оба имени фигурируют в списке казненных в мае следующего года.'
      not_admitted: 'У посетителя нет визитной карточки, ожидаемой семьей. Кто-то закрывает книгу и оставляет ее на столе.'
      excerpts:
        p1: 'Его дочь проверяет счета, на которые он указывает, прежде чем забрать всю книгу. Когда он слышит, как она перечитывает его оценки, он встает и задвигает стул обратно под стол.'
        p2: 'Услышав, как оба прочитали ему ответ, он просит свою семью сказать, что он уехал из Парижа, если кто-нибудь позвонит. Прежде чем уйти, он кладет страницу рядом с ними и оставляет под ней чистый лист.'
    relic: 'Точные весы'
    relic_desc: 'Чувствительные весы, на которых сводили счета химии.'
    points:
      p1: 'Попросите Жака Поля передать свои документы семье и покинуть Париж до того, как придет приказ об аресте.'
      p2: 'Заставьте Лавуазье подумать об отъезде из Парижа, хотя он все еще надеется, что сможет подтвердить свои показания лично.'
    points_fail:
      p1: 'Паульзе остается со своими бумагами в Париже. Он взят под стражу и казнен 8 мая 1794 года.'
      p2: 'Как и в истории, в конце ноября Лавуазье заключают в тюрьму, а 8 мая 1794 года казнят в Париже.'
    shift:
      p1:
        was: 'Жак Польз был взят под стражу в ноябре 1793 года и казнен 8 мая 1794 года.'
        now: 'В этом филиале Паульзе оставляет бумаги своей семье и уходит. Он живет после мая 1794 года.'
      p2:
        was: '24 ноября 1793 г.: был приказано арестовать всех бывших откупщиков, а Лавуазье был заключен в тюрьму. 8 мая 1794 года он был казнен в Париже.'
        now: 'В этой ветви Лавуазье покидает Париж до приказа об аресте и доживает до мая 1794 года.'
        who: 'lavoisier_paris'
        bio: 'В этом временном графике Лавуазье покинул Париж до приказа об аресте в ноябре 1793 года и жил до 1794 года.'
    vignettes:
      units: 'Два числа красиво выстраиваются в ряд, но единица в одном ряду промахнулась. Вы поймаете это до того, как наборщик зафиксирует столбцы на месте.'
      air: 'Вы спрашиваете, почему таблица объясняет то, чего читатель не видит. Наборщик просматривает заголовки того, что вошло и что осталось, затем оставляет оба заголовка в корректуре.'
      proof: 'Вы кладете клочок бумаги под текущую строку, пока наборщик читает. Число, которое выглядело как часть следующего примера, снова обретает собственный заголовок.'
  faraday_london:
    name: 'Электричество из магнетизма'
    place: 'Лондон'
    figure: 'Майкл Фарадей'
    story: '29 августа 1831 года Фарадей зафиксировал мгновенное движение иглы в своем эксперименте с кольцом. 28 октября он повернул медный диск между полюсами магнита и получил ток, пока диск продолжал вращаться.'
    story_prose:
      opening:
        - 'На скамейке Королевского института лежит закрученное железное кольцо. Фарадей отрывается от контакта, и стрелка уже вернулась к нулю. Человек, ведущий записи, спрашивает, оставить ли результат или посмотреть еще раз.'
        - 'В августе 1831 года Фарадей наблюдал кратковременные отклонения при контакте с кольцом и его разрыве. В октябре он увидел устойчивый ток с вращающимся медным диском. Вам нужно сохранить два наблюдения. В первом наблюдайте, когда начнется прогиб. Во втором смотрите, когда он закончится.'
        - 'Используйте людей, которые могут следить за временем и иглой отдельно. Что касается диска, за контактом может позаботиться кто-то с твердой рукой.'
      points:
        p1: 'Вы поворачиваете блокнот боком и оставляете одну сторону для момента контакта, а другую для иглы. Когда Фарадей движется, наблюдатель называет направление, прежде чем стрелка вернется назад. После паузы он ставит еще одну отметку к моменту разрыва контакта. В пустом столбце находятся две отдельные отметки.'
        p2: 'Когда диск вращается, Фарадей просит наблюдателя подождать еще немного. Вы фиксируете контакт там, где он соскользнул. Когда наблюдатель смотрит снова, игла все еще находится в стороне. Возврат в ноль он пишет только после остановки диска. Карандаш оставляет свободное пространство между двумя показаниями.'
      outcomes:
        all: 'Два рекорда лежат рядом. Вместе с кольцом игла быстро вернулась. На диске примечания показывают, как долго он оставался до того, как вращение прекратилось.'
        p1: 'Кратковременные отклонения от кольца зафиксированы на бумаге. Другое наблюдение еще предстоит установить.'
        p2: 'Диск дает показания, которые сохраняются дольше. В предыдущей кольцевой записи есть пробел, и поездка не может быть синхронизирована.'
      none: 'Заголовки столбцов — это все, что остается на листе. Когда аппарат замолкает, никто не может ничего прочитать.'
      not_admitted: 'Кто-то в помещении просит посетителей освободить проход. Снаружи вы слышите, как наблюдатель просит посмотреть еще раз.'
      desync: 'Из-за отклонения кольца или длительного чтения с диска ноутбук не достигает ноутбука. Экспериментальная запись рассинхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'После паузы он ставит еще одну отметку к моменту разрыва контакта. В пустом столбце находятся две отдельные отметки.'
        p2: 'Возврат в ноль он пишет только после остановки диска. Карандаш оставляет свободное пространство между двумя показаниями.'
    relic: 'Железное кольцо и катушка'
    relic_desc: 'Две катушки проволоки на кольце из мягкого железа.'
    points:
      p1: 'Следите за переключением и стрелкой отдельно, чтобы сохранить мимолетное отклонение в эксперименте с кольцом Фарадея.'
      p2: 'Держите коллектор в контакте с медным диском во время его вращения, чтобы Фарадей мог наблюдать ток во время движения диска.'
    points_fail:
      p1: 'Стрелка снова останавливается, прежде чем кто-нибудь посмотрит. Эксперимент вводится как нулевой результат, и офис отзывает сотрудника после потери синхронизации.'
      p2: 'Контакт проскальзывает при вращении диска. Устойчивого чтения в этой ветке нет, и контора отзывает сотрудника.'
    shift:
      p1:
        was: '29 августа 1831 года Фарадей наблюдал кратковременный индуцированный ток при включении и выключении аппарата с железным кольцом.'
      p2:
        was: '28 октября 1831 года Фарадей наблюдал ток, когда медный диск вращался между полюсами магнита.'
    vignettes:
      instant: 'Ассистент пишет, что игла сдвинулась. Вы оставляете место на тот момент, когда он переместился. К тому времени, как он снова смотрит на инструмент, игла уже остановилась.'
      skeptic: 'Вы спрашиваете, осталось ли чтение на месте. Ассистент указывает на пропуск после первой отметки. Вместе вы называете это возвращением к покою, чтобы никто не принял пропуск за пропущенное чтение.'
      sketch: 'Вы рисуете кольцо на полях и отмечаете два набора его обмоток на противоположных сторонах. Теперь ассистент может сопоставить наблюдение с нужным аппаратом.'
  pasteur_paris:
    name: 'Лето в Арбуа'
    place: 'Арбуа'
    figure: 'Луи Пастер'
    story: 'Летом 1859 года старшая девятилетняя дочь Пастера Жанна жила у дедушки в Арбуа, пока ее отец работал в Париже. В сентябре она заболела брюшным тифом и умерла там.'
    story_prose:
      opening:
        - 'Короткое письмо из Парижа лежит у окна дома дедушки Жанны в Арбуа. Сегодня днём Жанна не выходила во двор. Ее дедушка время от времени подходит к постели. Оттуда он может услышать, когда кто-то приходит за почтой.'
        - 'Летом 1859 года Жанна гостила у деда. По историческим данным, она умерла от брюшного тифа в сентябре. В этом филиале вымышленная аптечка офиса может изменить течение ее болезни. Ее дедушка, возможно, напишет, что она снова сидит.'
        - 'Отправьте путешественника с опытом ухода и нано-набором офиса. Спросите ее дедушку, где ему нужна помощь, и оставайтесь рядом, пока он ждет, пока она проснется.'
      points:
        p1: 'Ее дедушка передвигает стул так, чтобы видеть кровать. Вы передаете офисный набор опекуну и позволяете ему оставаться там, где хочет Жанна. Когда она просыпается и просит сесть, он достает бумагу для писем и спрашивает, что она хотела бы, чтобы он добавил. Она просит его сначала написать маме, а потом придумывает предложение папе.'
      outcomes:
        all: 'Ее дедушка пишет, что она выздоравливает. Он оставляет короткое письмо рядом с письмом, отправленным ее отцом, готовым к отправке.'
        p1: 'У Жанны достаточно сил, чтобы посидеть некоторое время. Ее дедушка может написать ее родителям теми словами, которыми она произнесла, когда проснулась.'
      none: 'Когда кто-то приходит за почтой, ее дедушка еще раз складывает лист. В истории Жанна так и не оправилась от этой болезни.'
      not_admitted: 'Семья пока не приняла гостя. Первым уходит тот, кто заберет почту, а письмо из Парижа остается в помещении.'
      excerpts:
        p1: 'Когда она просыпается и просит сесть, он достает бумагу для писем и спрашивает, что она хотела бы, чтобы он добавил. Она просит его сначала написать маме, а потом придумывает предложение папе.'
    relic: 'Конверт из Арбуа'
    relic_desc: 'Вымышленная копия конверта, хранившегося у дедушки Жанны.'
    points:
      p1: 'Принесите аптечку из офиса дедушке Жанны и помогите ему позаботиться о ней, когда поднимется температура.'
    points_fail:
      p1: 'Несмотря на заботу дедушки, температура ухудшается. Жанна умирает в Арбуа.'
    shift:
      p1:
        was: 'Сентябрь 1859 года: старшая дочь Пастера Жанна, девяти лет, умерла от брюшного тифа в Арбуа, где она жила со своим дедушкой.'
        now: 'В этом филиале у Жанны спадает лихорадка после того, как {staff} использует аптечку офиса. Ее дедушка может передать родителям, что она достаточно здорова, чтобы сидеть.'
        who: 'pasteur_paris'
        bio: 'В этом филиале старшая дочь Пастера Жанна выздоравливает от брюшного тифа в Арбуа в 1859 году.'
    vignettes:
      date: 'На этом дедушка начинает ставить дату последнего письма. {staff} кладет два конверта рядом и сверяет с собой дату.'
      address: 'Прежде чем курьер уйдет, {staff} зачитывает дедушке парижский адрес. Письмо остается сложенным до тех пор, пока семья не сможет его открыть.'
      future: '{staff} кладет свежий лист рядом с листом, привезенным из Парижа. Есть место, чтобы добавить следующее, что говорит Жанна.'
  david_fleay_healesville:
    name: 'Пусть Корри выйдет сама'
    place: 'Святилище Хилсвилл, Виктория'
    figure: 'Дэвид Флей'
    story: 'В конце 1943 года Джилл, утконос из заповедника Хилсвилл, вылупила детеныша, позже названного Корри. Дэвид Фли и его команда подтвердили рождение в январе 1944 года, когда открыли гнездо. 26 февраля он впервые увидел, как Корри вышла купаться.'
    story_prose:
      opening:
        - 'Почва в норе Хилсвилля все еще мягкая. Дэвид Фли открыл наблюдательное пространство, чтобы осмотреть Корри, молодого утконоса, прежде чем вернуть ее в гнездо Джилл. Ботинок вратаря останавливается на осыпающемся крае.'
        - 'Корри была первым утконосом, успешно выращенным в неволе. 26 февраля 1944 года Фли впервые увидел, как она покинула нору по собственному желанию. Мартовское публичное выступление принесло пики в вольер. Здесь вы можете помочь с ее уходом и попросить толпу подождать.'
        - 'Путешественник, наблюдающий за банком, может помочь Фли сохранить проход свободным. Тот, кто обращает внимание на животных, может оставить Джилл скворечники. Для публичного выступления пришлите кого-нибудь, кто сможет убедить хранителей положить пики.'
      points:
        p1: 'Вы даете сигнал вратарю оставаться на месте. Когда ботинок останавливается, крошки земли скользят мимо обода. Вы держите доску за край, пока Фли возвращает Корри в гнездо. Фли ждет, пока внутри все стихнет, прежде чем отдернуть руку.'
        p2: 'Хранитель несет охапку листьев к норе. Вы показываете ему мелководье, куда Джилл обычно выходила накануне вечером, и просите его оставить там листья. Вы оба уходите, пока еще светло. Джилл выходит с листьями в счете и возвращается в банк.'
        p3: 'Кто-то трижды сверился с часами, и вратарь подносит лопату к перилам. Вы спрашиваете Фли, может ли табличка просто сказать: «Ждите Корри». Ребенок впереди дает место тому, кто сзади, чтобы увидеть воду. Вратарь убирает лопату. Когда в поле зрения появляется счет Корри, даже люди на железной дороге молчат.'
      outcomes:
        all: 'Корри выплывает из норы. Святилище имеет свой публичный вид, а на берегу у железной дороги нет свежих следов лопаты.'
        p1: 'К тому времени, как доска убирается, Корри снова в гнезде. Эта поездка сохраняет рекорд раннего выращивания.'
        p2: 'У кромки воды листьев меньше. Вратарь вытаскивает свой ботинок из грязи и спокойно покидает берег.'
        p3: 'Толпа видит, как Корри выходит сама. В отчете зафиксировано появление с убранными лопатами.'
      none: 'Листья остаются на месте. Некоторые посетители ждут там, где еще можно увидеть последнюю поездку домой.'
      not_admitted: 'Хранитель просит посетителя подождать у перил. Никто не придет за вами перед закрытием.'
      desync: 'Рыхлая почва блокирует отверстие, прежде чем Фли сможет вернуть молодое животное. Исторические данные о выращивании рассинхронизируются, и офис отзывает путешественника.'
      excerpts:
        p1: 'Вы держите доску за край, пока Фли возвращает Корри в гнездо. Фли ждет, пока внутри все стихнет, прежде чем отдернуть руку.'
        p2: 'Вы оба уходите, пока еще светло. Джилл выходит с листьями в счете и возвращается в банк.'
        p3: 'Вратарь убирает лопату. Когда в поле зрения появляется счет Корри, даже люди на железной дороге молчат.'
    relic: 'Деревянная ложка для корма'
    relic_desc: 'Небольшой деревянный совок с потертой ручкой.'
    points:
      p1: 'Держите рыхлую почву подальше от отверстия достаточно долго, чтобы Фли мог вернуть Корри обратно в нору.'
      p2: 'Попросите смотрителей оставить свежие листья возле бассейна, чтобы Джилл могла собрать их после наступления темноты.'
      p3: 'Убедить приют оставить нору закрытой, когда Корри прячется в день семейного представления.'
    points_fail:
      p1: 'Рыхлая почва закрывает отверстие, прежде чем Фли сможет благополучно вернуть Корри. Первое успешное выращивание не соответствует истории, и в тот же день офис перезванивает {staff}.'
      p2: 'Хранители покидают территорию как есть. Джилл придется собирать листья на берегу.'
      p3: 'Рекламируемое время проходит, и святилище прибегает к лопатам. К тому времени, как Корри выводят, большинство посетителей уже ушли.'
    shift:
      p1:
        was: '3 января 1944 года Фли вернул молодого утконоса в потревоженное гнездо, а Джилл продолжила его выращивать.'
      p2:
        was: 'Фли записывает, что Джилл вытолкнула немного материала для гнезда и земли после того, как нору открыли.'
        now: 'В этой ветке {staff} просит хранителей оставлять листья в пределах досягаемости от бассейна. Джилл может собрать их после наступления темноты, и никто больше не откроет ее нору.'
      p3:
        was: 'В марте 1944 года Корри скрылась в туннелях во время рекламируемой семейной выставки и была выкопана после того, как большинство посетителей ушли.'
        now: 'В этой ветке {staff} показывает смотрителям вечерние наблюдения и просит их положить лопаты. Посетители, оставшиеся там, могут подождать у бассейна или вернуться в другой день.'
  archimedes_syracuse:
    name: 'День, когда пал город'
    place: 'Сиракузы, Сицилия'
    figure: 'Архимед'
    story: 'Архимед изобрел машины для защиты Сиракуз во время римской осады. Когда город пал в 212 г. до н.э., он был убит. Плутарх приводит несколько версий того, как это произошло.'
    story_prose:
      opening:
        - 'Уличные крики прекращаются в день падения Сиракуз. Сосед стоит внутри с планшетом и спрашивает, не пришли ли вы за пожилым мужчиной, который рисует фигуры. Однажды Архимед одолжил у него доску.'
        - 'Архимед был убит, когда римские войска взяли Сиракузы. Древние сведения об обстоятельствах расходятся. В этой ветке вы сможете его найти и остаться с ним, пока ему не будет где переночевать.'
        - 'Отправьте путника, который сможет его узнать, и расспросите соседей, куда он пошел. Он может сам решить, что делать со своей чертежной доской.'
      points:
        p1: 'Архимед поворачивает доску на полкруга и говорит, что ей еще нужна линия. Вы показываете ему старый планшет соседа, чтобы он знал, что кто-то снаружи может отнести рисунок. Он постукивает по рамке один раз пальцем и передает ее. В комнате, где ему предстоит остановиться, он сначала спрашивает, прибыла ли и доска.'
      outcomes:
        all: 'После падения города в этой ветке до сих пор есть новости об Архимеде. Кто-то в доме ставит доску рядом с табуретом, на котором он может сидеть.'
        p1: 'Вы остаетесь с ним, пока он не достигнет убежища. Он снимает крышку с доски и все еще может закончить последнюю строчку.'
      none: 'Соседи слышат, что Архимед погиб при падении города. Сохранившиеся отчеты будут различаться в зависимости от обстоятельств.'
      not_admitted: 'Сосед держит гостя снаружи. Кто-то берет доску у входа прежде, чем вы успеете прочитать на ней имя.'
      excerpts:
        p1: 'Он постукивает по рамке один раз пальцем и передает ее. В комнате, где ему предстоит остановиться, он сначала спрашивает, прибыла ли и доска.'
    relic: 'Восковой планшет для рисования.'
    relic_desc: 'Табличка для тренировок, отмеченная линией от дома вымышленного соседа.'
    points:
      p1: 'Найдите Архимеда, пока город падает, и оставайтесь с ним, пока он не достигнет убежища.'
    points_fail:
      p1: 'Когда вы наконец найдете людей, которые видели его последними, они скажут вам, что он был убит во время падения города.'
    shift:
      p1:
        was: 'Архимед был убит, когда римские войска взяли Сиракузы в 212 г. до н.э. Древние сведения расходятся в зависимости от обстоятельств.'
        now: 'В этой ветви Сиракузы все еще находятся. Архимед достигает убежища с {staff} и выживает.'
        who: 'archimedes_syracuse'
        bio: 'В этой временной шкале Архимед благополучно пережил падение Сиракуз в 212 г. до н. э. и жил дальше.'
    vignettes:
      load: '{staff} кладет старую доску под новую и спрашивает, какой рисунок должен оставаться разборчивым. Сосед указывает на все еще обнаженный воск.'
      settle: 'Сосед начинает убирать со стула доску для письма. {staff} просит его покинуть место, где кто-нибудь может с ним посидеть.'
      crown: '{staff} просит соседа описать одолженную доску. Сосед двумя пальцами показывает, насколько она широка.'
  hypatia_alexandria:
    name: 'Александрия, тот март'
    place: 'Александрия'
    figure: 'Гипатия'
    story: 'В начале 415 года Гипатия все еще преподает математику и философию в Александрии, и ее приходят слушать городские магистраты. Между префектом города и другой фракцией вражда с каждой неделей обостряется, и она втянута в нее из-за своих связей с префектом.'
    story_prose:
      opening:
        - 'В Александрии только что закончилось утреннее обучение. Студент оставляет на столе помеченную деревянную полоску и спрашивает Гипатию, стоит ли им прийти завтра в ту же комнату. Разговоры на улице изменились. Она собиралась преподавать здесь, как обычно.'
        - 'Гипатия была убита в Александрии в марте 415 года. В позднеантичных источниках также зафиксирована ее репутация публичного преподавателя философии. Эта ветка может дать ей повод изменить свои планы и остаться с тем, кто готов ее принять.'
        - 'Отправьте путешественника, который сможет выслушать своих учеников и обсудить новые договоренности с их учителем. Ей нужно договориться, куда идти, и выбрать кого-нибудь, кто заберет взятые напрокат книги.'
      points:
        p1: 'Гипатия спрашивает, кто еще ждет книгу, которую она обещала одолжить. Вы просите ее назвать кого-нибудь, кто сможет справиться с кредитами, а затем объясняете, какой друг предложил ей комнату. Она пишет незаконченный вопрос на обратной стороне деревянной полоски и передает его студенту, все еще стоящему за столом. Позже в тот же день книги все же возвращают, а их учительница уже в доме подруги.'
      outcomes:
        all: 'Кто-то в доме подруги просит ее закончить задачу. В этом филиале до сих пор хранятся записи ее преподавания в марте.'
        p1: 'Она соглашается изменить планы на день и обращается к другу, который открывает ей дверь. Учебный стол некоторое время стоит пустым.'
      none: 'Студент приходит вернуть отмеченную полоску и слышит, что Гипатия убита. Он ставит его там, где сидел на последнем уроке.'
      not_admitted: 'Студент замыкает список людей, берущих книги. Имя посетителя никогда не вводилось, и полоска остается на столе, когда дверь закрывается.'
      excerpts:
        p1: 'Она пишет незаконченный вопрос на обратной стороне деревянной полоски и передает его студенту, все еще стоящему за столом. Позже в тот же день книги все же возвращают, а их учительница уже в доме подруги.'
    relic: 'Маркированная деревянная полоска'
    relic_desc: 'Вымышленное учебное пособие с частью проблемы на обороте.'
    points:
      p1: 'Прежде чем наступит худшее в марте, убедите ее на время покинуть Александрию или пойти другой дорогой в тот же день и спасти ее.'
    points_fail:
      p1: 'Она по-прежнему ходит по городу, и в этом марте ее тоже убивают.'
    shift:
      p1:
        was: 'Март 415 г.: Гипатия, математик и философ, была убита в Александрии во время городских беспорядков.'
        now: 'В том марте она была вдали от города. Когда все стихло, она вернулась в Александрию и продолжила преподавать.'
        who: 'hypatia_alexandria'
        bio: 'В этой временной шкале Гипатия послушалась и покинула Александрию до марта 415 года, пережила ту весну и позже вернулась к преподаванию в городе.'
    vignettes:
      scale: 'Учащийся указывает на неправильную отметку на деревянной полоске. {staff} просит его показать, с чего начался его отсчет. Он перемещает палец на одно место назад.'
      copy: '{staff} спрашивает, какие книги еще нужно вернуть, и записывает их названия, чтобы их мог найти следующий ученик.'
      name: '{staff} уточняет у студента, где взять взятый напрокат том, если комната закрыта. Студент складывает ответ в обложку.'
  gutenberg_mainz:
    name: 'Печать подвижными металлическими литерами'
    place: 'Майнц'
    figure: 'Иоганн Гутенберг'
    story: 'Иоганн Фуст финансировал типографию Гутенберга в Майнце. Книга из 42 строк сохранилась вместе с документом от 6 ноября 1455 года, в котором записано требование Фуста о выплате долга и процентах. В документе не указано, какие инструменты хранил тот или иной мужчина.'
    story_prose:
      opening:
        - 'Майнцский печатник подносит свежий лист к свету и делает отметку в его углу. Поставщик бумаги спрашивает, заплатят ли ему на этот раз. Гутенбергу нужно проверить кучу страниц. Фусту нужно рассчитаться с суммой.'
        - 'Примерно в это же время было завершено издание из сорока двух строк. Нотариальный акт от 6 ноября 1455 года записывает спор между Гутенбергом и Фустом. Здесь вы можете сохранить тираж и попросить их согласовать, какие инструменты Гутенберг все еще сможет использовать, когда партнерство закончится.'
        - 'Отправьте кого-нибудь, кто сможет проверить бумагу, шрифт и заработную плату. Чтобы решить вопрос об инструментах, вам также нужен кто-то, кто сможет заставить обоих мужчин услышать соглашение, зачитанное вслух.'
      points:
        p1: 'Печатник пересчитывает свою стопку и говорит, что ему понадобится еще одна. Вы просите поставщика сосчитать готовые листы за этот день по рабочему листу, а затем перечислить следующую партию и заработную плату в отдельных строках с Гутенбергом. Поставщик стирает отметку о возврате товара. На следующее утро свежий лист готов на станине печатного станка.'
        p2: 'Фуст подводит весь счет. Он не показывает, за что был уплачен каждый аванс. Вы просите Гутенберга начать с инструментов, которые ему все еще нужны, и просите клерка прочитать условия для каждого предмета обоим мужчинам. Каждый берет копию, и деревянная ручка остается на крючке. Гутенберг складывает свой экземпляр в книгу заработной платы, уходя.'
      outcomes:
        all: 'Издание, состоящее из сорока двух строк, закончено, и его спонсорам еще предстоит свести счеты. У каждого человека есть копия соглашения об инструментах, которые может использовать Гутенберг.'
        p1: 'Принтеры проходят тираж, и готовые листы покидают цех. Нотариус все равно выслушает спор об инструментах и деньгах.'
        p2: 'Существует письменный список инструментов, которые он может использовать. Издание рассинхронизировано, и поездка приносит только запись дискуссии.'
      none: 'На печати остается незаконченный лист. Рабочие и поставщик все еще ждут ответа.'
      not_admitted: 'Принтер спрашивает через дверь, пришел ли посетитель за бумагой или счетами. Вас никто не приводит. Снаружи слышен только звук брошенной на скамейку доски.'
      desync: 'Пресс останавливается на полпути. Кончились бумага и зарплата. Публикация рассинхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'Поставщик стирает отметку о возврате товара. На следующее утро свежий лист готов на станине печатного станка.'
        p2: 'Каждый берет копию, и деревянная ручка остается на крючке. Гутенберг складывает свой экземпляр в книгу заработной платы, уходя.'
    relic: 'Свинцовая литера'
    relic_desc: 'Маленькая литера из свинца и олова, с зеркальным изображением буквы.'
    points:
      p1: 'Сохраняйте шрифт, бумагу и рабочих достаточно долго, чтобы закончить книгу из 42 строк, в то время как печатные работы зависят от заемных денег.'
      p2: 'Перед ноябрьскими слушаниями помогите Гутенбергу и Фусту договориться, какие инструменты Гутенберг сможет продолжать использовать после прекращения их партнерства.'
    points_fail:
      p1: 'Книга из 42 строк останавливается наполовину напечатанной на печатной машине. Этот филиал выпал из истории, и в тот день офис вспоминает сотрудника.'
      p2: 'Спор продолжается без соглашения об инструментах. Гутенберг покидает встречу без всякой гарантии, что сможет использовать их снова.'
    shift:
      p1:
        was: '1455: книга из 42 строк была закончена в мастерской Гутенберга в Майнце и напечатана подвижным металлическим шрифтом.'
      p2:
        was: '6 ноября 1455 года нотариус записал требование Фуста о возврате долга и процентах. Документ оставляет неясным окончательное право собственности на инструменты.'
        now: 'Гутенберг и Фуст соглашаются, какие инструменты Гутенберг может продолжать использовать. Он может спланировать с ними еще одну попытку, когда партнерство закончится.'
        who: 'gutenberg_mainz'
        bio: 'В этом филиале Гутенберг обеспечивает постоянный доступ к некоторым из своих печатных инструментов после спора 1455 года.'
