      reader: 'Вы спрашиваете, можно ли прочитать переполненную строку с кафедры. Ученик отходит назад и читает вслух. Он отмечает, где его взгляд перескочил на неправильную линию.'
      proof: 'Вы читаете новую корректуру снизу вверх, по строке за раз. Ученик смеется, пока не поймает себя на том, что читает то, что ожидает, а не то, что написано на странице.'
  leonardo_florence:
    name: 'Художник, рисовавший машины'
    place: 'Флоренция'
    figure: 'Леонардо да Винчи'
    story: 'Лувр датирует создание портрета Леонардо, известного как Мона Лиза, примерно 1503 годом и отмечает, что он продолжал работать над ним позже.'
    story_prose:
      opening:
        - 'Внутри мастерской во Флоренции панели с окна были перенесены, чтобы освободить место для новой стойки. Приходит агент спросить, где портрет Лизы. Ученик не дает ему положить руку на еще влажную панель.'
        - 'В записке Агостино Веспуччи, датированной октябрем 1503 года, упоминается портрет Лизы работы Леонардо. Картина впоследствии осталась у художника. Здесь вы можете оставить ему место для работы и хранения, а также сделать так, чтобы Лиза увидела столько, сколько Леонардо готов показать.'
        - 'Отправьте кого-нибудь, кто сможет оценить стойку, панель и дневной свет. Чтобы организовать просмотр, соберите натурщика, художника и агента в согласованное время.'
      points:
        p1: 'Ученик хочет выжать из старой стойки еще одно место. Вы просите его сначала вставить пустую панель и наблюдать, как ее угол касается картины рядом с ней. Он расчищает место у окна и просит Леонардо отметить это место. Позже человек, убирающий работу, касается этикетки этой панели, прежде чем тянуться к стойке.'
        p2: 'Художник просит сухую доску для занятий, чтобы защитить свои краски. Он сам поворачивает портрет к двери и показывает Лизе, где стоять. Она спрашивает, понадобится ли она ему в той же позе в следующий раз. Он смотрит на спинку стула и просит ученика отметить, где он стоит. После того, как Лиза уходит, Леонардо снова включает панель в свой свет.'
      outcomes:
        all: 'В мастерской еще есть место для картины. Лиза видела, как далеко дело зашло, а Леонардо до сих пор держит панно.'
        p1: 'Панель имеет дневное освещение и маркированное место для хранения. Агент может спросить, как дела. У просмотра еще нет согласованного дня.'
        p2: 'Лиза видела эту работу один раз. Позже панель повреждается, и поездка приносит домой сцену, в которой она ее увидела.'
      none: 'В стойке по-прежнему нет места. У двери посетитель узнает только, что художник ее не сдал.'
      not_admitted: 'Ученик просит вас освободить место для людей, вносящих стойку. Снаружи двери не видно передней части панели.'
      desync: 'Старая стойка сдавливает и повреждает мокрую панель. Исторический портрет больше не сохранился и офис напоминает о путешественнике.'
      excerpts:
        p1: 'Он расчищает место у окна и просит Леонардо отметить это место. Позже человек, убирающий работу, касается этикетки этой панели, прежде чем тянуться к стойке.'
        p2: 'Он смотрит на спинку стула и просит ученика отметить, где он стоит. После того, как Лиза уходит, Леонардо снова включает панель в свой свет.'
    relic: 'Зеркально написанная страница блокнота'
    relic_desc: 'Страница обратного сценария, для чтения которой требуется зеркало.'
    points:
      p1: 'Прежде чем мастерская возьмется за очередную гражданскую картину, зарезервируйте для портрета Лизы место, где будет свет для работы и где панно можно будет найти на складе.'
      p2: 'Устройте просмотр незавершенной работы, пока портрет еще находится во Флоренции, и позвольте Леонардо выбрать, что показать натурщику.'
    points_fail:
      p1: 'Приходит новая работа, и недоделанная панель втискивается в старый стеллаж. Портрет поврежден, и офис отзывает сотрудника.'
      p2: 'На просмотр времени не отводится. Люди, ожидающие картину, могут только спросить мастерскую, как далеко она продвинулась.'
    shift:
      p1:
        was: 'В заметке на полях Агостино Веспуччи от октября 1503 года записано, что Леонардо рисовал Лизу дель Джокондо.'
      p2:
        was: 'Портрет подвергся расширенной доработке, затем вместе с Леонардо покинул Италию и поступил во французскую коллекцию.'
        now: 'Лиза видит портрет на этом этапе. Леонардо может продолжать брать панно с собой, а в мастерской хранится эскиз показанного ей варианта.'
        who: 'leonardo_florence'
        bio: 'Современная флорентийская заметка помещает портрет Лизы в мастерскую Леонардо. Картина продолжала меняться и далеко ушла от той первой обстановки.'
    vignettes:
      shadow: 'Вы просите ученика показать, где заканчивается лицо и начинается фон. Они указывают, а затем колеблются. Вместо того, чтобы рисовать более толстую линию, они оставляют переход на второй взгляд.'
      hands: 'Посетитель помнит лицо, но руки кладет в другое место. Вы кладете тренировочный рисунок рядом с наброском из памяти и позволяете ему найти измененные линии.'
      seat: 'Вы отмечаете на полу стул натурщика, пока ученик собирает вещи. Они оставляют рисунок незавершенным, зная, куда пойдет стул, когда они вернутся.'
  galileo_padua:
    name: 'Спутники Юпитера'
    place: 'Падуя'
    figure: 'Галилео Галилей'
    story: 'В «Звездном вестнике» Галилей фиксирует изменение положения четырех небольших тел вблизи Юпитера и приходит к выводу, что они вращаются вокруг него.'
    story_prose:
      opening:
        - 'В конце январского наблюдения в Падуе Галилей рисует точки света рядом с Юпитером. Их позиции меняются на следующий вечер. Переписчик складывает рисунки по размеру, и человек, везущий их в Венецию, спрашивает, какая ночь наступит первой.'
        - 'Наблюдения спутников Юпитера появились в Sidereus Nuncius в 1610 году. Апрельский процесс в Болонье вызвал возражения, и Горький позже напечатал брошюру против этой книги. В этом филиале вы сможете привести в порядок январские вечера и позволить некоторым гостям самим увидеть точки.'
        - 'Отправьте кого-нибудь, кто сможет сравнить эскизы и даты, чтобы проверить копию принтера. В доме Маджини помогите посетителям найти безошибочно яркую звезду, прежде чем снова посмотреть на Юпитер.'
      points:
        p1: 'Вы спрашиваете у переписчика, что было раньше: ночь с тремя точками или ночь с двумя. Он достает блокнот и видит, что они перевернуты. Галилей читает даты, и вы сопоставляете каждый угол с соответствующей записью, прежде чем передать комплект Венеции. Переписчик поворачивается ко второй ночи и кивает, когда видит, как точки поменялись местами.'
        p2: 'Первый гость у Маджини отстраняется и говорит, что видел лишь полоску света. Галилей освобождает место. Вы предлагаете гостю найти одну яркую звезду, которую он узнает, а затем вернуться на Юпитер. Гость усаживается на свое место и поднимает руку, чтобы привлечь внимание собеседника. Он просит ее посчитать самостоятельно, прежде чем назвать число, которое он увидел.'
      outcomes:
        all: 'Напечатанные диаграммы сохраняют свой январский порядок. В Болонье гости записывают свои счёты и спрашивают, где будут очки в следующий вечер.'
        p1: 'Копия для Венеции в порядке. В Болонье все еще будут письма и брошюры, оспаривающие эти наблюдения.'
        p2: 'По крайней мере, один гость может подсчитать количество огней рядом с Юпитером. Запись печати рассинхронизируется, и счетчик остается в учетной записи путешественника.'
      none: 'Переписчик складывает листы по размерам, не приводя ночи в порядок.'
      not_admitted: 'Кто-то у двери спрашивает, кто тебя привел. Вы остаетесь снаружи и видите, как переписчик складывает разрозненные картинки в конверт.'
      desync: 'Отдельные диаграммы меняются местами в печатной копии. Исходная последовательность рассинхронизируется, и офис отзывает путешественника.'
      excerpts:
        p1: 'Галилей читает даты, и вы сопоставляете каждый угол с соответствующей записью, прежде чем передать комплект Венеции. Переписчик поворачивается ко второй ночи и кивает, когда видит, как точки поменялись местами.'
        p2: 'Гость усаживается на свое место и поднимает руку, чтобы привлечь внимание собеседника. Он просит ее посчитать самостоятельно, прежде чем назвать число, которое он увидел.'
    relic: 'Шлифованная линза'
    relic_desc: 'Небольшая стеклянная линза, отполированная вручную.'
    points:
      p1: 'Сохраните датированные наброски Юпитера и его точек света, сделанные Галилеем, чтобы копию отправили в Венецию.'
      p2: 'В Болонье в конце апреля помогите гостям Маджини увидеть спутники Юпитера в телескоп Галилея.'
    points_fail:
      p1: 'Беспорядочные наброски теряют порядок. Распечатанная копия сбивает ночи с ног, и офис отзывает сотрудника.'
      p2: 'Гости смотрят и говорят, что ничего не видят. Горький пишет Кеплеру и в июне печатает брошюру против Sidereus Nuncius.'
    shift:
      p1:
        was: 'Галилей наблюдал Юпитер в течение нескольких ночей, начиная с января 1610 года, и напечатал записи о местоположении Юпитера в Sidereus Nuncius.'
      p2:
        was: 'В конце апреля 1610 года Галилей показал свой телескоп Маджини и другим гостям в Палаццо Капрара в Болонье. Они сказали, что не видят спутников, а находившийся там Мартин Горки в июне напечатал брошюру против Галилея.'
        now: '{staff} фиксирует трубку и показывает гостям, куда смотреть. Некоторые из них видят в ту ночь точки света рядом с Юпитером, а брошюра Горького не находит отклика. Новых звезд принимают раньше.'
        who: 'galileo_padua'
        bio: 'В Болонье в апреле 1610 года гости Маджини увидели спутники Юпитера в телескоп Галилея. Сомнение, последовавшее за Sidereus Nuncius, было короче.'
    vignettes:
      alignment: 'Вы не даете переписчику выровнять страницы по краям. Вместо этого вы предлагаете выстроить в линию Юпитер. Точки больше не сидят друг на друге.'
      telescope: 'Вы спрашиваете, какая точка четвертая. Переписчик раскладывает листы за несколько ночей и спрашивает, кому следует доверять, когда точки словно сливаются.'
      dates: 'Вы отмечаете дату на каждом отдельном листе, прежде чем переписчик складывает их стопкой. Порядок позволяет следующему читателю увидеть, как точки меняют положение.'
  heo_nanseolheon_hanyang:
    name: 'Разрозненные стихи в папке'
    place: 'Ханян'
    figure: 'Хо Нансорхон'
    story: 'Хо Гюн собрал сохранившиеся работы своей сестры Хо Нансольхон после ее смерти. Издание ее собрания сочинений, гравюра на дереве эпохи Чосон, сохранилось с 1608 года.'
    story_prose:
      opening:
        - 'Переписчик прижимает камнем свежий бумажный конверт и протягивает вам два листа с одинаковым отверстием. Один был для практики, а другой попросили одолжить. Он помнит, как взял оба из окна.'
        - 'В истории брат Хо Нансольхон, Хо Гюн, собрал сохранившиеся работы после ее смерти. Подборка 1597 года и сохранившееся издание 1608 года местами различаются. Здесь вы можете оставить копии там, где он их найдет, и спросить поэтессу, какими стихами она хочет поделиться.'
        - 'Отправьте кого-нибудь, кто сможет сравнить руки и заголовки, чтобы отсортировать черновики. Путешественник, который может объяснить, кто хочет их прочитать, может затем задать вопрос самой поэтессе.'
      points:
        p1: 'Переписчик указывает на более сильные чернила. Вы кладете обе версии рядом и показываете ему исправление в конце более бледной копии. Он делает пометку на рукаве, чтобы их снова можно было найти. Два листа помещаются под одним заголовком, и сгиб заканчивается далеко от надписи.'
        p2: 'Хио перемещает первый вариант переписчика обратно на свою сторону стола. Она выбирает другого, чтобы занять его место. Когда вы спрашиваете, чье имя написано на пачке, она берет кисть и сама подписывает первый лист, а затем возвращает страницы по порядку. Она просит переписчика тоже скопировать подпись.'
      outcomes:
        all: 'Когда Хо Гюн собирает коллекцию, он хранит небольшой пакет в том порядке, в котором его оставила его сестра. Имя, скопированное по ее просьбе, остается на первом листе.'
        p1: 'Обе версии можно найти. Хо Гюн сможет сравнить их, когда будет составлять коллекцию. У него нет никаких сведений о собственном выборе сестры.'
        p2: 'Она сама подписала несколько стихотворений. Остальные бумаги затерялись; домой возвращается запись по ее выбору во время этого визита.'
      none: 'Разрозненные экземпляры остаются смешанными на столе. Дальнейшая коллекция по-прежнему зависит от того, что сможет найти семья.'
      not_admitted: 'Переписчик просит заголовок с другой стороны двери. Когда никто не может назвать имя, он держит рукав на столе.'
      desync: 'Когда вы вернетесь, переписчик узнает только пустой конверт. Бумаги, необходимые для последующего сбора, затерялись, и офис отзывает путешественника.'
      excerpts:
        p1: 'Он делает пометку на рукаве, чтобы их снова можно было найти. Два листа помещаются под одним заголовком, и сгиб заканчивается далеко от надписи.'
        p2: 'Когда вы спрашиваете, чье имя написано на пачке, она берет кисть и сама подписывает первый лист, а затем возвращает страницы по порядку. Она просит переписчика тоже скопировать подпись.'
    relic: 'Лист со стихами'
    relic_desc: 'Лист тонкой бумаги с мазковыми стихами о цветах и далеких местах.'
    points:
      p1: 'Храните семейные копии вместе, чтобы у Хо Гёна были стихи, которые он позже включил в свою подборку.'
      p2: 'Помогите Хо отложить и подписать небольшую группу стихов, которые она хочет, чтобы другие прочитали.'
    points_fail:
      p1: 'Семья теряет отдельные документы, и Хо Гюн не может составить из них коллекцию. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'После ее смерти семья сможет выбирать для нее только из оставшихся копий.'
    shift:
      p1:
        was: 'После смерти Хо Нансольхон в 1589 году Хо Гюн использовала стихи, хранившиеся в доме ее семьи, для составления своего произведения.'
      p2:
        was: 'После ее смерти в 1589 году ее стихи отобрал брат. Подборка 1597 года и издание 1608 года сохраняют разные прочтения.'
        now: 'Хи отмечает страницы, которыми хочет поделиться. Семья хранит ее подписанную подборку вместе, когда позже готовит коллекцию.'
        who: 'heo_nanseolheon_hanyang'
        bio: 'Хо Нансольхон выбрала небольшую группу стихов, которыми хотела поделиться. Семья соблюдала выбранный ею порядок при подготовке сохранившейся работы.'
    vignettes:
      binding: 'Переписчик перепутал страницу практики с другими листами. Вы сравниваете два заголовка и складываете второй рукав для упражнений. Одна страница с неоднозначным толкованием остается свободной, чтобы он мог ее проверить. Вы уходите прежде, чем какое-либо из стихотворений попадет в печатную книгу.'
      name: 'Знаешь, некоторые из этих стихов будут читать вдали от этого дома. Переписчик собирается передать тренировочный лист без заголовка. Просишь его скопировать еще и заголовок, и уходит еще один лист с названием. Вы сохраняете свое место с чистой полоской бумаги. Выпуск гравюры на дереве ожидается на годы вперед.'
      fold: 'Вы помогаете свернуть свободные страницы, не сминая мазок. На запасной обертке вы отмечаете, что заголовок отсутствует. Вы забираете предупреждение, а не страницу. Следующая коллекция будет собрана после вашего ухода.'
  ghalib_delhi:
    name: 'Найти припев'
    place: 'Дели'
    figure: 'Мирза Галиб'
    story: 'Ко времени визита в Дели диван Галиба на урду уже был напечатан в 1841 году. Его газели можно просматривать по рифмам и окончаниям припевов.'
    story_prose:
      opening:
        - 'Кто-то заходит в книжный магазин в Дели и читает столько стихотворений, сколько помнит, до последнего слова. Книготорговец просит вас еще раз послушать и записать рифму и припев. Он отнесет листок к печатной книге.'
        - 'Диван Галиба на урду уже был в печати. Царь поручил ему написать историю Тимуридов. Появилась первая часть, а запланированный второй том остался незавершенным. Вы можете привести в порядок бумаги последующих периодов правления, чтобы ему было с чего начать после доставки первой книги.'
        - 'Отправьте кого-нибудь, кто сможет сопоставить названия вариантов с датами. Читатель, знающий оба вида письма, также может определить, где в истории цитируются стихи.'
      points:
        p1: 'Галиб вытаскивает из стопки лист и просит прочитать последнюю строчку. Страница выглядит как история, пока предложение не переходит в строку стиха на полях. Вы помещаете источник цитаты на обертку и даете газетам, которые следуют за Хумаюном, их собственное собрание. Галиб поворачивается к первой пустой странице и пишет первую строку второго тома.'
      outcomes:
        all: 'Когда выходит первая книга, рядом с ней уже идет следующая сборка. Когда вы уходите, есть начало, и под ним много места.'
        p1: 'У более поздних правителей теперь есть собственное собрание. Галиб может приступить к черновому варианту, и ему предстоит написать следующие страницы.'
      none: 'Книготорговец находит газель, следуя за листком. Бумаги последних периодов правления остаются в стопке, и за первым томом не следует законченное продолжение.'
      not_admitted: 'Квитанция доходит до магазина, где ее предъявителя никто не узнает. Бумаги остаются под полуоткрытой бухгалтерской книгой.'
      excerpts:
        p1: 'Вы помещаете источник цитаты на обертку и даете газетам, которые следуют за Хумаюном, их собственное собрание. Галиб поворачивается к первой пустой странице и пишет первую строку второго тома.'
    relic: 'Страница газелей'
    relic_desc: 'Страница стихов на урду с правками, написанная его рукой.'
    points:
      p1: 'Помогите ему собрать и отсортировать источники по второй половине истории Тимуридов, о которых просил его король, чтобы он продолжил работу после ее первой части.'
    points_fail:
      p1: 'Первый том закончен. В этой отрасли, как и в истории, план второй не становится законченной рукописью.'
    shift:
      p1:
        was: '4 июля 1850 года Бахадур-шах поручил Галибу написать историю дома Тимуридов; первая часть, «Мехр-е нимроз», вышла в 1854 или 1855 году и заканчивается смертью Хумаюна, а запланированное им продолжение так и не было написано.'
        now: 'У Галиба есть отдельный набор исходных данных для более поздних периодов правления. После того, как он сдал первый том, у него под рукой оказалось достаточно материала, чтобы приступить ко второму.'
        who: 'ghalib_delhi'
        bio: 'В этой ветке Галиб начинает набросок второго тома после выхода первого.'
    vignettes:
      refrain: 'Книготорговец запоминает образ в стихе и продолжает искать его не там, где надо. Вы просите повторить слова, которые он услышал. Он дает вам концовку, и вы находите нужную группу в печатной книге. Вы пишете ссылку на одну страницу. Кто первым принес стих в магазин, для него до сих пор загадка.'
      future: 'Вы сообщаете продавцу книг, что позже читатели сравнят несколько изданий. Он спрашивает, поможет ли это ему найти нужную ему сегодня линию. Вы добавляете год издания к его бланку, а затем отмечаете окончание. Вы уходите прежде, чем он сможет сверить его с другой копией.'
      listen: 'Вы повторяете финал продавцу книг до тех пор, пока вы оба не согласитесь с услышанным. Он засовывает листок в правую часть книги. Ты можешь вернуть эти несколько слов обратно. Остальная часть стиха уже ускользнула от вас.'
  banneker_maryland:
    name: 'Две вещи в одной посылке'
    place: 'Мэриленд'
    figure: 'Бенджамин Баннекер'
    story: '19 августа 1791 года Бенджамин Баннекер написал Томасу Джефферсону, отправил рукопись своего альманаха на следующий год и бросил вызов расовым предрассудкам и рабству. Представлены упаковочный стол и два его помощника. Игроки могут защитить связь между письмом и произведением, которое оно сопровождает.'
    story_prose:
      opening:
        - 'Гонец типографии и исходящая почта находятся у двери. Баннекер пишет на письме название заводов и переворачивает альманах на последнюю страницу, чтобы убедиться, что его рукописная копия все еще находится на столе. Ему есть что сказать в этом письме, которое он отправит только один раз.'
        - '19 августа 1791 года Бенджамин Баннекер отправил Томасу Джефферсону рукописный альманах с письмом, в котором оспаривался отказ в свободе чернокожих людей. Пожар 1806 года уничтожил большую часть того, что он хранил дома, хотя по крайней мере один рукописный журнал уцелел. Этот филиал может оставить больше выбранных им документов где-нибудь еще.'
        - 'Попросите путешественника, который сможет сравнить распечатанную копию с рукописной, следить за обоими пакетами. Если переписчик может найти время для дополнительного комплекта, спросите Баннекера, какие заметки можно копировать.'
      points:
        p1: 'Посыльный переворачивает оба набора данных на июль и находит почти один и тот же столбец цифр. Вы просите Баннекера назвать рукопись, предназначенную Джефферсону, а почтальона прочитать вслух имя на конверте. Одна нить обвивает письмо и альманах. Бумаги принтера лежат на столе. Почтальон читает адрес, прежде чем тянуться к узлу.'
        p2: 'Переписчик приносит толстый рукав. Баннекер достает несколько листов и оставляет датированные наблюдения и работы, которые он может проверить. Он просит вас прочитать исправленное значение и убедиться, что старое не было исключено из расчета. В другом доме хранитель открывает дополнительный комплект и зачитывает вслух первое число.'
      outcomes:
        all: 'Ответ Джефферсона подтверждает оба пункта. Когда много лет спустя пожар достиг дома, копия в другом месте все еще хранит наблюдения, которыми Баннекер согласился поделиться.'
        p1: 'Письмо и альманах выходят вместе. Большая часть рабочих документов остается дома и потерялась вместе со многими его вещами.'
        p2: 'Проверенный комплект остался далеко от дома. Исходящая почта идет не так, и путешественник приносит домой дату, указанную на запасном комплекте.'
      none: 'Отдельно отмеченного пакета на столе нет. Читатели могут ознакомиться только с сохранившимися в истории рабочими заметками.'
      not_admitted: 'Типографский работник проверяет имена, прежде чем закрыть коробку. Он не узнает посетителя и кладет пакет обратно у двери Баннекера.'
      desync: 'Принтер собирает единственный альманах, который может сопровождать письмо. Историческое ограждение отсутствует, и офис напоминает о путешественнике.'
      excerpts:
        p1: 'Бумаги принтера лежат на столе. Почтальон читает адрес, прежде чем тянуться к узлу.'
        p2: 'Он просит вас прочитать исправленное значение и убедиться, что старое не было исключено из расчета. В другом доме хранитель открывает дополнительный комплект и зачитывает вслух первое число.'
    relic: 'Копия ярлыка посылки'
    relic_desc: 'Вымышленная копия ярлыка с указанием альманаха и приложенного письма.'
    points:
      p1: 'Сохраните копию для принтера отдельно, чтобы Баннекер мог отправить свой рукописный альманах вместе с письмом.'
      p2: 'Спросите Баннекера, какие рабочие документы он хочет скопировать, а затем позаботьтесь о том, чтобы проверенный комплект хранился подальше от дома.'
    points_fail:
      p1: 'Принтер берет единственную копию письма. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Большая часть рабочих бумаг остается дома и сгорает вместе с домом.'
    shift:
      p1:
        was: '19 августа 1791 года Баннекер написал Джефферсону и приложил рукописную копию своего альманаха.'
      p2:
        was: 'В день похорон Баннекера в 1806 году пожар уничтожил его дом и большую часть рукописных материалов.'
        now: '{staff} спрашивает Баннекера, какие блокноты можно хранить где-нибудь еще, и находит принтер, готовый их скопировать. После пожара читатели все еще могут ознакомиться с копией его наблюдений и рабочих расчетов.'
        who: 'banneker_maryland'
        bio: 'Некоторые другие рабочие документы Баннекера сохранились отдельно вместе с журналом, сохранившимся в истории.'
    vignettes:
      packet: 'Рэйчел видит месяцы на первой странице и начинает делать этикетку для книги расчетов. Вы кладете письмо рядом и просите ее закончить надпись после прочтения адреса. Она продевает по одному галстуку в обе обертки. Таблицы будут перемещаться под именем отправителя и с его аргументами.'
      handoff: 'В ранце Айзека есть место для одного плоского пакета. Воск на букве еще мягкий. Вы держите обертку открытой, пока он надевает сложенный защитный чехол, чтобы письмо не прилипло к столу. Он уходит с обоими. Вы остаетесь достаточно долго, чтобы наблюдать за пустым квадратом, оставленным пакетом на столе.'
      reply: 'Вы знаете, что ответ придет быстро. Исаак спрашивает, решает ли это то, что было поднято в письме. Вы копируете дату в исходящем пакете и оставляете место для ответа в том виде, в каком вы его нашли. Пакет уже в пути. Никакое обещание не вернулось через дверь.'
  mitchell_nantucket:
    name: 'Отметить участок неба до прихода облака'
    place: 'Нантакет'
    figure: 'Мария Митчелл'
    story: 'В письме, воспроизведенном в журнале «Мария Митчелл: Жизнь, письма и журналы», сообщается, что Митчелл обнаружила телескопическую комету в Нантакете 1 октября 1847 года. Ее отец отметил это открытие и написал директору Гарвардской обсерватории первой почтой на материк.'
    story_prose:
      opening:
        - 'Порыв ветра пронесся над крышей Нантакета. Мария Митчелл кладет свои записи под лампу, чтобы они оставались неподвижными. Она намерена записать, где находился объект и в какой час. Ее отец ждет этажом ниже, чтобы услышать цифры. Погода не позволяет почтовому судну оставаться в пути.'
        - 'Митчелл нашла комету 1 октября 1847 года. Ее отец написал Уильяму Бонду в Кембридж. Датская медаль была вручена позже, после переписки по поводу претензии. Здесь вы можете получить первое уведомление об исходящей почте и отправить второе получателю, назначенному для приза.'
        - 'Кто-то, кто читает карты неба или проверяет время, может помочь с уведомлением. Попросите кого-нибудь, знакомого с почтой, организовать два адреса.'
      points:
        p1: 'Мария читает час, и ее отец спрашивает, какую яркую звезду она использовала в качестве ориентира. Вы зачитываете ему позицию и обнаруживаете, что в уведомлении о Бонде все еще нет даты. Чернила едва высохли, когда голос на пристани требует почту. Дата становится разборчивой к тому моменту, когда почтальон кладет первое письмо в мешок.'
        p2: 'На второй странице указан тот же час наблюдений. Конверту нужен другой адрес. Вы читаете правила вслух, а почтальон делает отдельную запись для получателя, которого называет. Мария ждет, пока он закончит, прежде чем отложить свои наблюдения. Два письма покинут остров, и только одно пересечёт Атлантику.'
      outcomes:
        all: 'Датский получатель получает уведомление в соответствии с опубликованной процедурой. Когда решение будет рассмотрено, Митчелл сможет предоставить датированный протокол отправки вместо более поздней апелляции.'
        p1: 'Кембридж получает уведомление первой почтой. Медаль по-прежнему потребует собственной переписки.'
        p2: 'Второй адрес проверен. Первая почта в Кембридж пошла не так, и ветку невозможно сохранить в целости.'
      none: 'Записки с крыши остаются в доме. Неотправленное уведомление на сегодняшний день ничего не дает комитету по наградам.'
      not_admitted: 'Семья спрашивает снизу, кто пришел. Записки остаются на крыше, пока вы слышите, как по улице проходит почтальон.'
      desync: 'Письмо Бонда не дошло до первой почты. Офис отзывает путешественника, когда поездка рассинхронизируется; оригинальные наблюдения все еще находятся в доме.'
      excerpts:
        p1: 'Чернила едва высохли, когда голос на пристани требует почту. Дата становится разборчивой к тому моменту, когда почтальон кладет первое письмо в мешок.'
        p2: 'Мария ждет, пока он закончит, прежде чем отложить свои наблюдения. Два письма покинут остров, и только одно пересечёт Атлантику.'
    relic: 'Небольшой телескоп'
    relic_desc: 'Небольшой латунный телескоп со следами морской соли на трубке.'
    points:
      p1: 'Подготовьте датированное уведомление семьи к первой почте в Кембриджскую обсерваторию.'
      p2: 'Отправьте второе уведомление назначенному датскому получателю на первой лодке и избавьте Митчелла от более поздней апелляции на медаль.'
    points_fail:
      p1: 'Наблюдения остаются в семейном журнале, но уведомление не доходит до первой почты. Офис отзывает сотрудника после потери синхронизации.'
      p2: 'Уведомление получает только обсерватория. Судьи не могут вручить медаль по обычным правилам, поскольку назначенный получатель не был уведомлен.'
    shift:
      p1:
        was: '3 октября 1847 года отец Митчелла написал в Кембриджскую обсерваторию об открытии 1-го числа. Его письмо ушло первой почтой после наблюдения.'
      p2:
        was: 'В переписке 1848 года о премии отмечалось, что требуемое немедленное уведомление не дошло до назначенных получателей. Позже Митчелл получила медаль после того, как ее иск был рассмотрен правительством Дании.'
        now: '{staff} проверяет правила и помогает семье разместить еще одно объявление на той же лодке. Судьи могут рассмотреть иск по обычным правилам, поскольку уведомление поступило по соответствующему каналу.'
        who: 'mitchell_nantucket'
        bio: 'Митчелл получил признание благодаря своевременному отчету. Она начала записывать, когда увидела объект, когда отправила уведомление и кто его получил.'
    vignettes:
      field: 'Помощник сам нарисовал слабое место. Вы спрашиваете, что бы он использовал, чтобы направить инструмент обратно на него. Он добавляет две звезды и направление до появления облака. Вы копируете эти знаки. У вас все еще нет более поздней позиции для сравнения.'
      post: 'Вы знаете, что слуху придется покинуть остров. Помощник хочет записать открытие до того, как он опишет увиденное. Вы помещаете дату и поле на отдельный бланк и оставляете следующую строку для проверки. Оно остается пустым, когда пакет спускается на берег.'
      cloud: 'Вы ждете с рисунком в руке, пока облако закроет слабый знак. Прежде чем сложить его, вы обводите звезду, которую ожидаете найти, даже если слабый объект исчез. Вы возвращаете позицию, которую можно искать снова. Никто не увидит его второй раз до вашего возвращения.'
  caroline_herschel_slough:
    name: 'Та, что обшаривала небо'
    place: 'Слау'
    figure: 'Каролина Гершель'
    story: 'Кэролайн Гершель сообщила, что 1 августа 1786 года заметила объект, отличающийся от четко очерченных звезд. Она сравнила наблюдения, прежде чем написать Чарльзу Благдену.'
    story_prose:
      opening:
        - 'После наступления темноты в Слау Кэролайн Гершель просит свою помощницу переместить лампу. Края объекта, который она только что нарисовала, размыты, а более яркие звезды поблизости ясны. Если она хочет найти его завтра, ей понадобится рисунок, который она сможет прочитать в темноте.'
        - 'В истории Гершель сравнил наблюдения 1 и 2 августа 1786 года и отправил рисунки Чарльзу Благдену. Позже ей заплатили за помощь брату и она снимала показания, когда он был у телескопа. В этом филиале она может попросить о регулярных собственных вечерах.'
        - 'Тот, кто читает часы и сопоставляет диаграммы, может помочь составить удобную пару. Тот, кто умеет вести переговоры, может приложить к отчету ее предполагаемый график.'
      points:
        p1: 'На первом рисунке три точки. Помощник переворачивает второй лист не в ту сторону. Вы просите Гершеля начать с одной и той же опорной звезды и просите его по очереди указывать на каждую точку. Оба листа получают время с отрывом. Она складывает их возле лампы и сама фиксирует изменение положения. Когда она их складывает, первый ночной час остается снаружи.'
        p2: 'Лицо, составившее отчет, освободило место для рисунков. Вы просите Гершеля положить рядом с ними ее календарь, чтобы он мог видеть, сколько ночи ей осталось после снятия показаний в большой телескоп. Она пишет свое имя в двух свободных местах и просит указать эти два вида работ отдельно. В следующем календаре она может заранее обвести свои ночи.'
      outcomes:
        all: 'В отчете сохранены как рисунки, так и ее просьба о времени. Когда у ассистентки установлен распорядок дня, несколько ночей отводятся для наблюдений по ее выбору.'
        p1: 'В письме приведены сравнения и рисунки. Она по-прежнему будет использовать свой собственный телескоп в те ночи, когда будет записывать работы своего брата.'
        p2: 'Предложенный график вышел из дома. Без достаточного количества звезд с первой ночи просьба — единственное изменение, которое может сохранить эта поездка.'
      none: 'Оба рисунка лежат рядом, и ссылок слишком мало для сравнения. График остается прежним.'
      not_admitted: 'Помощник просит посетителя держать лестницу чистой. Лампа уходит обратно под абажур, а путник остается внизу.'
      desync: 'Дымка испортила эталонные звезды в первую ночь. Когда второй рисунок не может быть сверен с ним, контора отзывает путешественника.'
      excerpts:
        p1: 'Она складывает их возле лампы и сама фиксирует изменение положения. Когда она их складывает, первый ночной час остается снаружи.'
        p2: 'Она пишет свое имя в двух свободных местах и просит указать эти два вида работ отдельно. В следующем календаре она может заранее обвести свои ночи.'
    relic: 'Линейка для звёздной карты'
    relic_desc: 'Деревянная линейка со шкалой, используемая для обозначения пройденных участков на звездной карте.'
    points:
      p1: 'Отметьте опорные звезды и время на обоих рисунках, чтобы Гершель мог показать, что объект перемещался между двумя ночами.'
      p2: 'Используйте первый отчет о комете Гершеля, чтобы обеспечить себе регулярные ночи для собственных наблюдений.'
    points_fail:
      p1: 'Низкая дымка оставляет слишком мало четких ориентиров на первом рисунке. Второй рисунок не может установить движение в этом отделении, и офис отзывает сотрудника.'
      p2: 'Когда ее брат пользуется большим телескопом, она проводит вечера, записывая его показания, и ее собственные наблюдения по-прежнему совпадают с его наблюдениями.'
    shift:
      p1:
        was: '1 и 2 августа 1786 года Каролина Гершель зафиксировала движение предполагаемой кометы и разослала свои наблюдения и рисунки.'
      p2:
        was: 'В 1787 году Каролина Гершель получала зарплату в качестве помощницы своего брата; в своем первом отчете она уже объяснила, как эта работа ограничивала ее время наблюдений.'
        now: '{staff} помогает Гершелю поместить график наблюдений рядом с отчетом о комете и передать оба отчета стороннику. Более поздний порядок ее работы оставляет несколько ночей в месяц для ее собственных наблюдений.'
        who: 'caroline_herschel_slough'
        bio: 'Будучи оплачиваемой помощницей, Гершель регулярно по ночам отводила себе работу и могла заранее планировать поиски комет.'
    vignettes:
      fixed: 'Прежде чем добавить нечеткий объект, вы отмечаете двух ярких соседей. На втором рисунке звезды остаются полезным ориентиром даже после того, как страницы сместились.'
      doubt: 'Помощник предлагает почистить стекло. Вы спрашиваете, как выглядят через него другие звезды. Они остаются острыми, и помощник сохраняет неопределенную отметку на листе.'
      lamp: 'Вы затемняете лампу, пока помощник записывает час. Когда обложка снова закрывается, рядом с обоими рисунками все еще есть время.'
  kovalevskaya_stockholm:
    name: 'Условия на первой странице'
    place: 'Стокгольм'
    figure: 'Софья Ковалевская'
    story: 'Статья Ковалевской о вращении вокруг неподвижной точки появилась в Acta Mathematica в 1889 году. В работе выявлен интегрируемый случай с частными условиями на моменты инерции и положение центра масс.'
    story_prose:
      opening:
        - 'В Стокгольме корректор прикрепил медную накладку на свободную страницу. Ковалевская передала ему рабочий экземпляр. Переработанные мемуары лежат на другом конце стола. На обеих первых страницах упоминается вращающееся тело, и одни только заголовки не расскажут ему, что изменилось.'
        - 'Эта работа принесла Ковалевской премию Бордена в 1888 году. Мемуары появились в 1889 году, когда Стокгольм предоставил ей постоянную кафедру. Вы можете сохранить свои предположения в журнальном пакете и запросить ранее письменное подтверждение даты встречи.'
        - 'Попросите кого-нибудь, кто сможет сопоставить символы с диаграммами, проверить пакет. Когда придут новости из Парижа, пошлите кого-нибудь, кто сможет получить письменный ответ с копией ее расписания занятий.'
      points:
        p1: 'Корректор указывает на кончик вершины и спрашивает, является ли он также центром масс. Вы рисуете две точки и просите его найти фиксированную на первой странице, а затем возвращаетесь к условию относительно другой. Ковалевская проверяет символы на обоих листах и сообщает, какая страница попадает в пачку. Корректор сохраняет верх, и в переплетенном экземпляре условия снова появляются на первой странице.'
        p2: 'Секретарь откладывает новости из Парижа и спрашивает, кто будет преподавать уже перечисленные классы. Вы вдвоем прочитайте ее расписание и найдете первый урок, к которому ей придется подготовиться. Он забирает список и возвращается с письмом, в котором указана дата встречи. Она записывает это на первую неделю занятий следующего семестра.'
      outcomes:
        all: 'Журнал получает условия с мемуарами, а университет подтверждает дату во времени. Она заполняет часы, которые отвела на исследования.'
        p1: 'Правильная первая страница идет вместе с бумагой. Поскольку письменное подтверждение все еще не получено, ей все равно придется планировать занятия.'
        p2: 'У нее есть письмо с датой начала. Пакет с журналом идет не так, и в поездке сохранилась только сцена, в которой клерк вручает ей ответ.'
      none: 'Обе стопки остаются под верхом. Дата начала все еще остается пустой, когда путешественник обращается к расписанию обучения.'
      not_admitted: 'Корректор собирает страницы и говорит, что будет ждать, пока автор опознает посетителя. Снаружи путешественник слышит, как латунная крышка стучит по столу.'
      desync: 'Более старая первая страница без условий попадает в пакет журнала. Историческое издание уже не соответствует, и контора отзывает путешественника.'
      excerpts:
        p1: 'Ковалевская проверяет символы на обоих листах и сообщает, какая страница попадает в пачку. Корректор сохраняет верх, и в переплетенном экземпляре условия снова появляются на первой странице.'
        p2: 'Он забирает список и возвращается с письмом, в котором указана дата встречи. Она записывает это на первую неделю занятий следующего семестра.'
    relic: 'Демонстрационный волчок'
    relic_desc: 'Латунный волчок с номером, вырезанным на его оси.'
    points:
      p1: 'Сравните рабочую копию Стокгольма с исправленными мемуарами. Не кладите предыдущий черновик в пакет для журнала.'
      p2: 'Принесите новости из Парижа и список ее преподавательских обязанностей в Стокгольмский университет. Спросите, когда начнется ее новый прием, и получите его в письменном виде.'
    points_fail:
      p1: 'В пакет журнала попадает более старый черновик, в котором на первой странице отсутствуют условия. Офис перезванивает {staff}, когда публикация не синхронизируется.'
      p2: 'Новость доходит до университета. Ей все еще приходится планировать следующий семестр без письменной даты начала.'
    shift:
      p1:
        was: 'Парижская академия объявила о присуждении премии Бордена за работы Ковалевской в декабре 1888 года. Ее расширенные мемуары появились в Acta Mathematica в 1889 году.'
      p2:
        was: 'В 1889 году она стала профессором в Стокгольме.'
        now: 'В этом филиале университет письменно подтверждает дату начала обучения заблаговременно, чтобы она могла спланировать преподавание и исследования на следующий семестр.'
        who: 'kovalevskaya_stockholm'
        bio: 'Ковалевская преподавала и изучала вращение твердого тела в Стокгольме. Международная премия и условия ее работы на местах определялись разными учреждениями.'
    vignettes:
      conditions: 'В тренировочном листе сокращенно написано «вращающееся тело». Вы используете первую страницу, чтобы восстановить два уточнения: одно для инерции, а другое для того, где находится центр масс. Корректор копирует оба документа на свой бланк. Корректировку можно убрать, но выпуск журнала еще в будущем.'
      diagram: 'Корректор хочет примерить игрушечный топ. Вы рисуете точку, которая остается неподвижной, и отмечаете отдельную точку, которая представляет центр масс. Он может указать, что есть что на следующей копии. Игрушка все еще вращается, когда ваше время истекло, и бумага еще не затвердела.'
      clip: 'Вы помещаете предположения за пределы упражнения и вкладываете в него свободную диаграмму. Следующий читатель увидит условия перед результатом. Вы приносите домой контур топа и оставляете корректуру на столе.'
  heron_alexandria:
    name: 'Чертёж рядом со строкой'
    place: 'Александрия'
    figure: 'Герон Александрийский'
    story: '«Механика героя» описывает машины для подъема и перемещения тяжелых грузов. Фрагменты греческого оригинала сохранились наряду с полным арабским переводом. Посещение его мастерской происходит примерно в 62 году нашей эры, примерной дате его деятельности.'
    story_prose:
      opening:
        - 'Александрия, около 62 года нашей эры. «Механика героя», написанная на греческом языке, описывает, как устройства могут помочь переместить тяжелый груз.'
        - 'В истории греческий язык сохранился лишь фрагментами, тогда как полное произведение сохранилось в арабском переводе. В этой ветке копия ожидает проверки своих диаграмм, и кто-то готов хранить ее отдельно.'
        - 'Кто-то, кто может сопоставить диаграмму с ее словами, может помочь. Также нужен кто-то, кто сможет организовать передачу книги из рук в руки.'
      points:
        p1: '{staff} перемещает копию на табуретку в лучшем свете и просит Героя посмотреть на две линии, нарисованные одинаковой длины. Одно надо читать с другой страницы. Переписчик переносит отметку с оригинала, затем просит человека, который возьмет копию, самому найти это место. Читатель подносит рулон к дверному проему, прежде чем снова открыть его. Достигнув исправленной отметки, он оставляет там палец.'
      outcomes:
        all: 'Второй рулон никогда не возвращается на полку мастерской. Когда бы он ни был заимствован, тот же знак все равно может привести читателя на страницу.'
        p1: 'Прежде чем уйти, читатель завязывает копию отдельно. Старые рулоны остаются в мастерской; исправленный уходит за дверь.'
      none: 'Копия остается среди старых рулонов. Прежде чем дверь захлопнется, кто-то, пришедший за ней, отдергивает руку.'
      not_admitted: '{staff} никогда не попадает в мастерскую. Слышно, как кто-то выдвигает табуретку на свет.'
      excerpts:
        p1: 'Читатель подносит рулон к дверному проему, прежде чем снова открыть его. Достигнув исправленной отметки, он оставляет там палец.'
    relic: 'Порог макета с отметкой'
    relic_desc: 'Деталь вымышленной модели мастерской, с вмятиной на месте потертости двери.'
    points:
      p1: 'Помогите Герою проверить цифры на греческой копии «Механики» и позаботьтесь о том, чтобы эта копия хранилась отдельно от собственных свитков мастерской.'
    points_fail:
      p1: 'В цехе имеются собственные рулоны. В этой ветви, как и в истории, сохранились лишь фрагменты греческого текста, тогда как арабский перевод сохраняет всю работу.'
    shift:
      p1:
        was: 'Герой написал «Механику» на греческом языке в первом веке нашей эры. Сохранились лишь фрагменты греческого текста. Арабский перевод Кусты ибн Луки сохранил всю работу.'
        now: 'Проверенная копия греческого текста и рисунков хранится отдельно от мастерской. В этой ветке эта копия доходит до более поздних читателей.'
        who: 'heron_alexandria'
        bio: 'В этой ветви наряду с арабской традицией сохранилась полная греческая копия «Механики».'
    vignettes:
      threshold: 'Никанор прикрепляет миниатюрную дверцу к скамейке, и возврат останавливается на расстоянии пальца. Вы отмечаете место, где оно трется. Под моделью застряла плоская чечевичная шелуха; он вычищает это. Как только дверь закроется, он попросит вас оставить отметку, чтобы он мог снова найти это место.'
      audience: 'Беренике уже увидела качели, открывающие дверь, и потянулась за плащом. Вы просите ее наблюдать за дальним краем еще раз. Когда он возвращается, она замечает полоску света, которую Никанор пропустил. Он оставляет модель на скамейке запасных для повторного испытания вместо того, чтобы отправить ее.'
      future: 'Можно было бы сказать Никанору, как далекие читатели положат эти страницы рядом с изображениями машин. Он наблюдает, как его дверной проем оседает со слабым щелчком. Вы слушаете вместе с ним. Когда вы уходите, он перезванивает клиенту, чтобы узнать, какое движение она пропустила.'
  pliny_stabiae:
    name: 'Ветер в Стабиях'
    place: 'Стабии'
    figure: 'Плиний Старший'
    story: 'Плиний Младший позже написал Тациту о том, что его дядя достиг Помпониана в Стабиях во время извержения 79 г. н. э. Ветер, который нес его, не позволил груженым кораблям уйти.'
    story_prose:
      opening:
        - 'В 79 году нашей эры над заливом поднялось облако. Плиний Младший позже рассказал Тациту, что его дядя получил просьбу о помощи и отправился на корабле.'
        - 'В истории Плиний Старший достиг Помпониана в Стабиях и не вернулся живым с его берегов. В этой ветке корабль сможет приблизиться к той части побережья, у которой Ректина обратилась за помощью. Возможно, также удастся увести Плиния подальше от пляжа.'
        - 'Нужен тот, кто знает берег и знает, как добраться до него на корабле. На берегу требуется кто-то, кто принес подходящее оборудование и может помочь человеку, который пытается дышать.'
      points:
        p3: '{staff} достигает Старшего Плиния на пляже, достает защитное снаряжение и просит окружающих его людей освободить дорогу. Ноги сильно прижали пепел. Группа останавливается, ожидая его дыхания, прежде чем снова двигаться. Когда он может сесть, он смахивает несколько камней с плеча товарища. Лодка у берега все еще шумит.'
        p2: 'Некоторые люди на палубе хотят развернуться. {staff} спрашивает, кто знает, где живет Помпониан, и просит этого человека встать там, где виден берег. Корабль достигает места, где они могут спуститься. Когда Помпониан выходит к нему навстречу, Старший Плиний все еще держит в руках кусок веревки. Он передает его обратно на борт, прежде чем ступить на землю.'
        p1: '{staff} спрашивает, к какой части отмели еще можно подойти, и помогает команде оставить Rectina место, где можно схватиться. Она первой отдает то, что держит, и отпускает прежде, чем кто-нибудь крепко это схватит. Как только ее вытащили на борт, она прижимает мокрую руку к месту, которое они для нее расчистили. Кто-то забирает то, что она им передала.'
      outcomes:
        all: 'После того, как они покидают берег, кто-то кладет куда-нибудь сушиться то, что передала Ректина. На другом берегу отдыхает Старший Плиний. Наконец-то есть место, чтобы пройти по лодке.'
        p3: 'Экипаж оставляет Плинию сухой угол на обратном пути. Человек, помогающий ему сесть, ждет, пока он не опустит руку.'
        p2: 'Плиний все же достигает дома Помпониана. Принесенные с собой камни падают из их ботинок перед дверью.'
        p1: 'Оказавшись на борту, Ректина остается на отведенном для нее месте. Она возвращает свой сверток прежде, чем переоделась в мокрую одежду.'
      none: 'С причала они уже не могут видеть дальше берега. Люди, побывавшие в воде, ждут нового звонка.'
      not_admitted: '{staff} никогда не попадает на борт. Кто-то на берегу дергает леску, и нос медленно отворачивается.'
      desync: 'Корабль не достигает Стабий. Помпониан не видел Плиния, когда агентство перезванивает {staff}.'
      excerpts:
        p3: 'Когда он может сесть, он смахивает несколько камней с плеча товарища. Лодка у берега все еще шумит.'
        p2: 'Когда Помпониан выходит к нему навстречу, Старший Плиний все еще держит в руках кусок веревки. Он передает его обратно на борт, прежде чем ступить на землю.'
        p1: 'Как только ее вытащили на борт, она прижимает мокрую руку к месту, которое они для нее расчистили. Кто-то забирает то, что она им передала.'
    relic: 'Восковая табличка'
    relic_desc: 'Деревянная табличка с воском для записей, процарапанная стилусом.'
    points:
      p1: 'Когда мелководье и обломки горы блокируют берег, помогите Старшему Плинию привести корабль к берегу Ректины и взять ее на борт.'
      p2: 'Под падающей пемзой и камнями удержать корабль Плиния Старшего на пути к Стабиям, чтобы он приземлился и достиг Помпониана.'
      p3: 'Когда запах серы и пыли приблизится к пляжу в Стабиях, сохраните ему чистое дыхание и спасите Старшего Плиния, вытащив его с берега живым.'
    points_fail:
      p1: 'Корабль не смог подойти к ее берегу, и в этом рукаве Ректину никто не взял на борт.'
      p2: 'Корабль повернули назад до того, как Стабии и Плиний так и не достигли Помпониана. Филиал вышел из истории и офис отозвал сотрудника.'
      p3: 'Как гласит история, он упал на пляж в Стабиях, и в этом рукаве его тоже невозможно было удержать.'
    shift:
      p1:
        was: 'В 79 году нашей эры сообщение Ректины побудило Старшего Плиния отплыть на помощь. Его племянник описывает запруженный берег и путь к Стабиям, но не говорит, что случилось с Ректиной.'
        now: 'Корабль подошел к ее берегу, и Ректину взяли на борт. Она отправилась на корабле в Стабии.'
      p2:
        was: 'Плиний Младший позже рассказал Тациту, что его дядя достиг Помпониана в Стабиях при попутном ветре, том же самом ветре, который не давал лодкам уйти.'
      p3:
        was: 'На следующий день, когда запах серы и пламя приблизились, Старший Плиний поднялся на пляж в Стабиях, поддерживаемый двумя рабами, и упал; его племянник писал, что запыленный воздух мешал ему дышать. Его тело нашли через два дня.'
        now: '{staff} не давал пыли дышать ему и вытащил его с пляжа. Когда ветер переменился, он вернулся на корабле в Мизен и прожил еще несколько лет.'
        who: 'pliny_stabiae'
        bio: 'В этой строке Старший Плиний вернулся живым с пляжа в Стабиях. Он вернулся во флот в Мизенуме и прожил несколько лет.'
    vignettes:
      wind: 'Крисп пометил каждый нагруженный сундук как пропавший. Из дверного проема вы наблюдаете, как входит первый новичок с пеплом на плечах, а нагруженные лодки остаются на виду. Крисп вычеркивает слово «ушел». Он просит вас оставить ему место на планшете для следующего имени через дверь.'
      lantern: 'Прима успевает совершить один проход через комнату, прежде чем лампа погаснет. Ты занимаешь ее место у двери, пока она обращается к людям, которых все еще видит. Восковая таблетка сначала темнеет. Она повторяет вслух два последних имени, и вы отвечаете на каждое из них.'
      letter: 'Вы помните письмо, которое будет отправлено много лет спустя. Прима спрашивает о человеке, который нес список, имя которого там никогда не появится. Вы откладываете отчет о предстоящем утре и помогаете ей закончить рулон. В конце вашего визита вы все равно можете услышать, как кто-то идет по коридору.'
  galen_rome:
    name: 'Названия книг, пережившие пожар'
    place: 'Рим'
    figure: 'Гален'
    story: 'В книге «Как избежать бедствий» Гален описывает потерю книг и другого имущества во время римского пожара 192 года. Он отличает пропавшие экземпляры от произведений, которые, как он считал, он больше не сможет восстановить.'
    story_prose:
      opening:
        - 'Рим, 192. Гален отправил несколько свитков в Кампанию, а книги и предметы оставил на складе в Риме. Позже, в книге «Как избежать стресса», он вспоминает эти вещи отдельно.'
        - 'В истории пожар уничтожил книги, в том числе работы, которые, как он думал, он никогда не сможет заменить. В этой ветке одна загрузка идет раньше времени. Кто-то может вместе с ним просмотреть списки, прежде чем они будут закрыты.'
        - 'Кто-то, кто знает, какие книги идут с какой нагрузкой, может помочь. Кто-то тоже должен спросить у мастеров, какие инструменты можно изготовить заново по памяти, а какие нет.'
      points:
        p3: '{staff} находит глоссарий комедий в списке магазинов в Риме и просит Галена еще раз просмотреть пункт назначения. Гален открывает его в том месте, к которому он часто обращается, а затем просит человека, загружающего первую партию, положить его вместе с книгами для Кампании. Когда крышка надевается, Гален тянется назад и переворачивает галстук вверх, чтобы он не попал под нее.'
        p2: 'Магазин еще не все инструменты забрал. {staff} спрашивает мастера, что сложнее всего переделать, и просит его подготовить вторую модель на своем верстаке. Он ждет, пока воск застынет, и делает пометку на нижней стороне. Когда кто-то приходит убрать скамейку, он держит модель в руке. Второй лежит прямо в задней части его ящика.'
        p1: '{staff} разделяет два манифеста и заставляет человека, загружающего раннюю партию, прочитать манифест для Кампании. Кто-то поднимает рулон, который почти положили в стопку «Рим». Посоветовавшись с Галеном, он перемещает его к грузу, уходящему первым. Прежде чем завязать его, загрузчик снова записывает пункт назначения сверху. Кто-то заворачивает свободный конец шнура за угол.'
      outcomes:
        all: 'Книги, отправленные заранее, по-прежнему доступны при необходимости. Кто-то идет по этикетке к юмористическому глоссарию, а в мастерской запасная модель все еще там.'
        p3: 'Рукопись идет впереди огня, перевязью вверх. Любой, кто посмотрит позже, сможет распознать это, не разбирая груз.'
        p2: 'Прежде чем снова изготовить инструмент, мастер открывает свой ящик и достает модель.'
        p1: 'Рулоны, отмеченные как ранние, уходят первыми. Список магазинов в Риме остался позади.'
      none: 'Ранняя партия уже загружена. Булочки, пропустившие это, убираются, как и раньше.'
      not_admitted: '{staff} никогда не встречает человека, загружающего. Шаги с вещами удаляются за дверью магазина.'
      desync: 'Первые рулоны подаются на склад Рима. Чернила ошибочной записи все еще влажные, когда агентство перезванивает {staff}.'
      excerpts:
        p3: 'Когда крышка надевается, Гален тянется назад и переворачивает галстук вверх, чтобы он не попал под нее.'
        p2: 'Когда кто-то приходит убрать скамейку, он держит модель в руке. Второй лежит прямо в задней части его ящика.'
        p1: 'Прежде чем завязать его, загрузчик снова записывает пункт назначения сверху. Кто-то заворачивает свободный конец шнура за угол.'
    relic: 'Лист инвентаря'
    relic_desc: 'Вымышленный инвентарь с одним сохранившимся заголовком и пустой колонкой с копиями.'
    points:
      p1: 'Обезопасить место в предыдущей партии для рулонов прозаических глоссариев, уже предназначенных для отправки в Кампанию.'
      p2: 'Прежде чем инструменты попадут на хранение, попросите мастера изготовить вторую восковую модель труднозаменяемого инструмента и оставить ее в мастерской.'
      p3: 'Убедить Галена отправить из Рима глоссарий старой комедии вместе с предыдущей поставкой до ее погрузки.'
    points_fail:
      p1: 'Рулоны подаются на склад Рима и сгорают, не доезжая до Кампании. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Не существует модели, к которой можно было бы обратиться, когда ремесленнику снова придется изготавливать инструменты.'
      p3: 'Рукопись ожидает летней отправки и все еще находится там, когда начинается пожар.'
    shift:
      p1:
        was: 'Когда в конце зимы 192 года нашей эры в Риме вспыхнул пожар, Гален сказал, что его прозаический глоссарий уже отправился в Кампанию.'
      p2:
        was: 'В 192 году нашей эры пожар уничтожил инструменты, хранившиеся Галеном в Риме, в том числе разработанные им самим.'
        now: 'Вторая восковая модель остается в мастерской. После пожара Гален может использовать его, чтобы заново изготовить инструмент.'
      p3:
        was: 'В конце зимы 192 года нашей эры глоссарий Галена «Старая комедия» сгорел во время пожара в Риме.'
        now: '{staff} получает рулоны в предыдущую партию, и Гален может продолжать редактировать текст из копии после пожара. Другая копия позже попадает в коллекцию за пределами Рима.'
        who: 'galen_rome'
        bio: 'После пожара у Галена осталась сохранившаяся копия глоссария Старой комедии. Он продолжал проверять цитаты и отдал еще один экземпляр читателям в другом месте.'
    vignettes:
      list: 'Терция называет три имени из списка и считает три книги. Вы просите ее потрогать тома, которые идут с ними. Есть два. Вместе вы оставляете третий заголовок читабельным и ставите пустую отметку в графе копирования.'
      borrow: 'Дион помнит, что давал копию, но не может назвать получателя. Терция хочет завоевать титул до того, как список будет опубликован. Вы помогаете ему вспомнить дверной проем, куда он его передал. Она оставляет одно место в списке открытым для ответа с этой улицы.'
      survival: 'Вы читали произведение об этой самой утрате в экземпляре, который всплывет спустя много времени после пожара. Дион спрашивает, какой титул он сможет поставить на завтрашнем столе. Вы оставляете имена в инвентаре и показываете ему два настоящих тома. Пропавший не был найден, когда вы ушли.'
  ovid_tomis:
    name: 'Стихотворение и пустая строка'
    place: 'Томис'
    figure: 'Овидий'
    story: 'Во второй книге «Тристии» Овидий описывает свои преступления как стихотворение и ошибку и отказывается объяснять последнюю. Годом события назначен визит во время ссылки.'
    story_prose:
      opening:
        - 'Овидий находится в ссылке в Томисе на Черном море. Во второй книге «Тристии» он говорит, что был наказан за стихотворение и ошибку. Он не говорит, в чем заключалась ошибка.'
        - 'В истории третья книга сохранила стихотворение о лежащем больном. В этом отделении бывают дни, когда ему трудно набирать даже воду, и ему еще предстоит найти путешественника, который вынес бы страницы.'
        - 'В этой поездке нужен кто-то, кто готов присмотреть за пациентом. Ему также нужен кто-то, кто разбирается в переходе и может спросить путешественника, где можно передать посылку.'
      points:
        p2: '{staff} находит путешественника, знакомого с зимним переходом, спрашивает, куда можно доставить пакет следующему перевозчику, а затем просит Овидия указать имя получателя там, где его можно прочитать. Путешественник расправляет внутреннюю и внешнюю обертку отдельно. Прежде чем они отчалят, он передает адрес людям на берегу, чтобы они еще раз проверили. Овидий кивает через борт лодки.'
        p1: '{staff} спрашивает, какую еду Овидий еще может есть, находит немного поблизости и оставляет воду возле своей кровати. Когда Овидий тянется за напитком, {staff} приближает чашку. Сначала он пьет, а чуть позже берет страницу. Тень чашки на ней сжимается до небольшого уголка.'
      outcomes:
        all: 'Путешественник с пажами покинул гавань. Кто-то еще раз меняет воду у кровати, и Овидий достает еще одну простыню.'
        p2: 'На берегу путешественник сообщает Овидию, куда именно пойдет пакет. Овидий слушает последнюю остановку.'
        p1: 'Теперь есть несколько моментов, когда он может лежать спокойно. Прежде чем его чашка опустеет, ему всегда приносят еще воды.'
      none: 'Лодки остаются на защищенной стороне гавани. Пакет, ожидающий путешественника, остается на углу стола.'
      not_admitted: '{staff} никогда не встречает никого, кто мог бы их провести. Лист падает в воду, оставшуюся у двери.'
      desync: 'Стихи никто не принесет. Когда агентство перезванивает {staff}, адрес все еще находится в пакете.'
      excerpts:
        p2: 'Прежде чем они отчалят, он передает адрес людям на берегу, чтобы они еще раз проверили. Овидий кивает через борт лодки.'
        p1: 'Сначала он пьет, а чуть позже берет страницу. Тень чашки на ней сжимается до небольшого уголка.'
    relic: 'Восковая табличка для письма'
    relic_desc: 'Табличка с буквами в стихах, начатая по дороге в ссылку.'
    points:
      p1: 'Медсестра Овидий из-за болезни, которой он заболел в Томисе, без врача, без подходящей еды и воды, которую он не мог пить.'
      p2: 'Если зимнее путешествие из Томиса затруднительно, обеспечьте место для третьей книги «Тристии» перевозчику, идущему в Рим.'
    points_fail:
      p1: 'Он лежит больной, и никто не может его облегчить, и в этом отделении первые месяцы в Томисе даются так же тяжело, как он о них писал.'
      p2: 'Ни один перевозчик не принимает посылку в дорогу в этом отделении. Он не доезжает вовремя до Рима, и офис отзывает сотрудника.'
    shift:
      p1:
        was: 'Около 9 года нашей эры Овидий заболел в Томисе; в Тристии III.3 он писал, что не было ни врача, ни подходящей еды, ни воды, к которой он не мог привыкнуть.'
        now: '{staff} находит ему чистую воду и еду, которую он может съесть, и сидит с ним, несмотря на лихорадку. Вскоре он снова встает на ноги.'
      p2:
        was: 'Примерно с 9 по 10 год нашей эры Овидий в изгнании написал третью книгу «Тристии». Он начинается с книги о прибытии в Рим и описывает трудности зимних путешествий по этому региону.'
    vignettes:
      rumor: 'Вы сообщаете перевозчику, что читатели спустя столетия все равно будут спрашивать, в чем заключалась ошибка. Он указывает на свободное место на запасном листе и спрашивает, что ему туда положить. Вы добавляете пункт назначения на обертку и оставляете место в копии. Пакет уходит, сохранив свою неопределенность.'
      verify: 'Оператор помнит версию с дополнительным названием. Вы просите посмотреть, с какого листа оно взято. Он может указать на стихотворение и ошибку, и на этом отрывок закончится. Вы отмечаете эту линию на своей восковой табличке. Когда пакет отправится, у вас все еще не будет имени.'
      wrap: 'Ветер поднимает внешний лист как раз в тот момент, когда перевозчик тянется за пакетом. Вы нумеруете отдельные листы и раскладываете их по порядку. Ваша восковая табличка хранит одно напоминание: оставьте необъяснимую линию в ее нынешнем виде. Вы упускаете из виду то, что думает об этом получатель.'
  empedocles_akragas:
    name: 'Где разделяется хор'
    place: 'Акрагас'
    figure: 'Эмпедокл'
    story: 'Фрагменты, приписываемые Эмпедоклу, описывают четыре корня и цикл соединения и разделения, связанные с Любовью и Раздором. Много позже Диоген Лаэртский сохраняет противоречивые рассказы о своей смерти.'
    story_prose:
      opening:
        - 'Акрагас, примерно середина пятого века до нашей эры. В своем стихе Эмпедокл использует четыре корня, чтобы объяснить, как вещи соединяются и снова разделяются.'
        - 'В истории из этого длинного стихотворения сохранились лишь фрагменты и цитаты. В этом филиале переписчик готов подготовить еще один экземпляр, а кто-то в другом месте готов оставить его себе.'
        - 'Тот, кто может услышать, где одна строка не ведет к другой, может помочь, и тот, кто может убедиться, что копия будет найдена снова.'
      points:
        p1: '{staff} читает переписчику с самого начала и просит его остановиться в том месте, где оба прошли слишком быстро. Эмпедокл медленно повторяет две строки, затем ждет, пока их прочитают. На следующий день {staff} сверяет начало и конец с человеком, который возьмет копию. Два рулона больше не используют один и тот же шнур. Читатель берет тот, который связан отдельно, и один раз тихо произносит его первую строчку.'
      outcomes:
        all: 'Копия, хранящаяся в другом месте, больше не путешествует вместе с оригиналом. Когда позже кто-то спросит об этих строках, хранитель может вывести их, не посылая за броском.'
        p1: 'Читатель помещает новую копию туда, где он сможет открыть ее сам. Другой рулон остается на столе переписчика.'
      none: 'Первые строки в тексте все еще не соединяются. В конце дня читатель возвращает свиток на место.'
      not_admitted: '{staff} не попадает в открытую дверь переписчика. Из-за стены доносится единственная строка, повторяющаяся из старого рулона.'
      excerpts:
        p1: 'Два рулона больше не используют один и тот же шнур. Читатель берет тот, который связан отдельно, и один раз тихо произносит его первую строчку.'
    relic: 'Обрывок стиха'
    relic_desc: 'Отрывок из воображаемой репетиции, отмеченный двумя оборотами в куплете.'
    points:
      p1: 'Помогите переписчику заполнить и проверить копию «О природе» и организовать ее отдельное хранение.'
    points_fail:
      p1: 'В этой ветви, как и в истории, более поздние читатели могут собрать из цитат и фрагментов папируса лишь часть стихотворения.'
    shift:
      p1:
        was: 'Эмпедокл изложил свои идеи в стихах в пятом веке до нашей эры. Книга «О природе» сохранилась частично благодаря цитатам и папирусам, включая фрагменты, опубликованные из Страсбургской коллекции в 1999 году.'
        now: 'Копия сверяется со стихотворением, прежде чем попасть к другому читателю. В этой ветке сохранился полный текст наряду с отрывками, сохранившимися в других произведениях.'
        who: 'empedocles_akragas'
        bio: 'В этой строке стихотворение Эмпедокла «О природе» сохранилось целиком, и позднее читатели могли проследить его четыре корня, Любовь и Борьба, от первой строки до последней.'
    vignettes:
      cue: 'Фаон сохранил только самую громкую строчку, и оба читателя заходят вместе. Вы отмечаете два места, где поворачивается смысл. При первой отметке они собирают табуреты вместе; в секунду каждый из них делает шаг назад. На этот раз читатель, стоящий лицом к двери, может сказать, где она находится, не видя листа.'
      handoff: 'Эйрене может дойти до второго куплета, но продолжает прыгать до последнего. Фаон предлагает финишировать в одиночку. Вы просите ее услышать первый сигнал и позволяете ему ответить с другого конца комнаты. Когда зовут ужин, она закрывает репетицию, вместо того чтобы оставить ее на полпути.'
      sandal: 'Фаон спрашивает, какую историю люди запомнят. Вы почти рассказываете ему о бронзовой сандалии в более позднем рассказе об Этне. Ему нужна линия, которую он сможет потренировать завтра. Вы оставляете сандалию и повторяете с ним его незаконченную часть один раз. К тому времени, когда вы можете искать Эйрене, табуреты уже сложены.'
  hildegard_bingen:
    name: 'Начало, оставшееся без голоса'
    place: 'Бинген'
    figure: 'Хильдегарда Бингенская'
    story: 'Спор по поводу захоронения прервал пение в общине Хильдегард. Ее письма в Майнц показывают, что для нее было на кону. Ограничение было снято в марте 1179 года. В нескольких сборниках ее сочинений и музыки сохранились работы переписчиков в Рупертсберге.'
    story_prose:
      opening:
        - 'Около Бингена в конце двенадцатого века. Письма и музыка Хильдегард сохранились, на них сохранились следы людей, которые копировали и проверяли их вместе с ней.'
        - 'В истории пение прерывалось спором по поводу захоронения. Ограничение было снято в марте следующего года. В этой ветке старый практический лист почти пустой, чуть выше первого слова.'
        - 'Кто-то, кто знает партитуру или рукопись, может помочь. Также нужен кто-то, готовый оставить сомнительный след открытым, пока люди, которые его пели, не смогут посмотреть.'
      points:
        p1: '{staff} просит переписчика пока не заполнять слабую пометку, раскладывает старый лист и новый, а Хильдегард и кто-то, знакомый с пением, смотрят отдельно. Оба признают более позднюю отметку, но начало все еще требует вопроса. Переписчик записывает согласованную часть на бумагу. Над первым словом она оставляет пробел шире, чем пробел между двумя строками.'
      outcomes:
        all: 'После окончания ограничения кто-то приносит запасной лист для проверки первой строчки. Ее рука останавливается на щели. Рядом с ней останавливается человек, знающий старую страницу.'
        p1: 'Когда в следующий раз откроют запасной лист, все равно будет видно, какое место было скопировано со старого, а какой вопрос остался открытым.'
      none: 'Запасная страница возвращается на свое место. Пространство над первым словом не сверялось с более старой страницей.'
      not_admitted: '{staff} никогда не попадает в копировальную. Кто-то закрывает счет у двери и ставит на место низкую табуретку.'
      excerpts:
        p1: 'Переписчик записывает согласованную часть на бумагу. Над первым словом она оставляет пробел шире, чем пробел между двумя строками.'
    relic: 'Лист для репетиции с отметкой'
    relic_desc: 'Придуманная страница с нитью, обозначающей ее открытие.'
    points:
      p1: 'Пока в комнате тихо, спросите Хильдегард и переписчиков, какие поврежденные пометки следует перенести и где оставить вопрос на запасном листе.'
    points_fail:
      p1: 'Запасной лист откладывается в сторону с пробелом над первым словом. Следующему читателю все равно придется спросить, что написано на старой странице.'
    shift:
      p1:
        was: 'В письмах Хильдегард описывается перерыв в пении. Переписчики в Рупертсберге сохранили ее сочинения и музыку.'
        now: 'В этой ветке {staff} хранит старый лист рядом с копией. Переписчики Хильдегард могут сказать, какие отметки они читают ясно, а какие требуют еще одного взгляда.'
    vignettes:
      opening: 'Агнес все еще может найти первое слово, но больше не читает поврежденную отметку над ним. Вы просите ее сравнить запасную страницу с известной ей строкой. Она устанавливает нить в нужном месте. Теперь следующий человек может открыться прямо в том же самом начале.'
      wait: 'Адельхейд запомнила слова наизусть и собирается убрать поврежденный лист. Держишь его так, чтобы Агнес могла еще раз проследить линию. Адельхейд копирует начало на запасной лист, а затем оставляет старую страницу рядом с ним. У следующего читателя будет и то, и другое.'
      return: 'Вы знаете, что сообщество снова будет петь, но Адельхайд сегодня нужно убрать страницу. Вы помогаете ей показать отправную точку, не озвучивая ее. Когда дверь закрывается, вы можете увидеть нить между страницами. Вы уходите прежде, чем в этой комнате снова поют.'
  hua_tuo_xuchang:
    name: 'Книга, упомянутая в летописи'
    place: 'Сюйчан'
    figure: 'Хуа То'
    story: 'Более поздний Сангочжи сообщает, что Хуа То был заключен в Сюй, и рассказывает о неудачной попытке передать книгу из тюрьмы.'
    story_prose:
      opening:
        - 'Сюй, в конце Восточной Хань. В истории Чэнь Шоу записано, как закончилось заключение Хуа То, и упоминается том, который не сохранился.'
        - 'В истории хранитель не осмелился взять том, который предложил ему Хуа То. Оно было сожжено. В этой ветке кто-то спросит, может ли на это претендовать друг, а кто-то рассматривает прошение о помиловании.'
        - 'Помочь может тот, кто понимает, как петиции и записи передаются из рук в руки. И для книги, и для петиции потребуется кто-то, готовый выслушать отдельную просьбу.'
      points:
        p2: '{staff} просит человека, желающего передать петицию, подождать, затем сверяет с ним имя и дело. Взяв его, он перезванивает им и пишет на дубликате подтверждение. Несколько дней спустя Хуа То выходит через ворота и видит ожидающих людей. Кто-то у ворот предлагает ему руку. Он стоит один на мгновение, прежде чем взять его.'
        p1: 'Хранитель начинает брать книгу Хуа То, но затем отдергивает руку. {staff} спрашивает, чье имя может быть указано в качестве получателя, и приводит на подпись кого-то из семьи Хуа То. Только после открытия реестра на новой странице том выдается. Получатель не может найти ткань, чтобы обернуть его. Он снимает верхнюю одежду и расстилает ее на столе.'
      outcomes:
        all: 'Когда Хуа То приходит домой, кто-то оставил ему у двери завернутую книгу. Он узнает уголок ткани, которым его завязывали.'
        p2: 'Его сопровождают люди, знающие Хуа То. Только выйдя за пределы тюрьмы, они медленно поворачивают за первый угол.'
        p1: 'Книга остаётся у того, кто её взял. Ткань все еще связана, а корешок вдавливает веревку в складку.'
      none: 'Хранитель закрывает реестр. Бумага начала скручиваться. Страница для тех, кто претендует на книгу, остается пустой.'
      not_admitted: '{staff} никогда не видит клерка. Под окном стол не сдвинется с места, пока заведение не закроется.'
      excerpts:
        p2: 'Кто-то у ворот предлагает ему руку. Он стоит один на мгновение, прежде чем взять его.'
        p1: 'Получатель не может найти ткань, чтобы обернуть его. Он снимает верхнюю одежду и расстилает ее на столе.'
    relic: 'Копия журнала приёма'
    relic_desc: 'Придуманный лист журнала, отличающий отчет от доставки.'
    points:
      p1: 'Если тюремщик боится взять книгу, держите ее подальше от огня.'
      p2: 'Прежде чем приговор будет приведен в исполнение, верните просьбу о помиловании тому, кто сможет ее пересмотреть, чтобы Хуа То мог покинуть тюрьму живым.'
    points_fail:
      p1: 'Тюремщик боялся закона и не принял его, а Хуа То сжег книгу. В этой ветке от этого ничего не осталось.'
      p2: 'Как и в истории, его казнили в тюрьме Сюй. В этом отделении он ни разу не лечил другого пациента.'
    shift:
      p1:
        was: 'Около 208 года в Сангочжи записано, что тюремщик отказался от книги, предложенной ему Хуа То, и Хуа То сжег ее.'
        now: 'Книга покинула тюрьму на чье-то хранение и была скопирована, прежде чем ее можно было потерять.'
      p2:
        was: 'Около 208 года в «Саньгочжи» сообщается, что Хуа То был казнен, несмотря на просьбу о помиловании.'
        now: 'В этом отделении заявление рассматривается вновь, и приказ изменяется. Хуа То покидает тюрьму в Сюй живым.'
        who: 'hua_tuo_xuchang'
        bio: 'В этом ответвлении Хуа То спасают и покидают тюрьму в Сюй живым.'
    vignettes:
      notice: 'Аджин услышал, что существует том, и записал его в разделе «Полученные предметы». Вы просите ее дотронуться до полки, куда она пойдет. Она перемещает строку в столбец отчета, оставляет место на полке пустым и оставляет рядом источник отчета.'
      shift: 'Ачан хочет закрыть книгу, прежде чем вызывать следующего хранителя. Вы просите его один раз прочитать записи вслух. Когда он добирается до места доставки без свидетелей, они соглашаются оставить эту очередь в ожидании. Следующий хранитель сможет увидеть то, что еще не подтверждено.'
      later: 'Вы знаете, что историк расскажет историю о книге. Аджин хочет знать, прошел ли через эту комнату настоящий том. Вы показываете ей, где будет написано подтверждение доставки. Страница покидает ее стол, а это место все еще открыто.'
  miyazawa_kenji_hanamaki:
    name: 'Рассказы, которые мало кто читал'
    place: 'Ханамаки'
    figure: 'Миядзава Кэндзи'
    story: 'Миядзава переработал «Ночь на галактической железной дороге» в нескольких черновиках. В рукописном тексте Джованни слышит звонок станции, прежде чем оказаться в карете.'
    story_prose:
      opening:
        - 'Ханамаки, 1933 год. Кендзи Миядзава преподавал в школе и консультировал фермеров по поводу удобрений. Некоторые рассказы, которые он пишет для детей, до сих пор пересматриваются.'
        - 'По истории он умер после болезни в сентябре. «Ночь на Галактической железной дороге» сохранилась в нескольких черновиках. В этой ветке и посетителям с близлежащих ферм, и людям, желающим увидеть страницы, приходится ждать, пока у него появятся силы поговорить.'
        - 'Тот, кто может понять суть вопроса фермера, может помочь, и тот, кто знает, когда перестать спрашивать. Кто-то также должен принести подходящее оборудование для ухода за Миядзавой, когда он заболеет.'
      points:
        p3: '20 сентября кто-то у двери сказал, что не может сидеть. {staff} приходит с оборудованием, просит его разрешения помочь и оставляет семью. Некоторое время спустя Миядзава тянется за водой, которую ему кто-то принес, и берет ее сам. Кто-то тащит табуретку с того места, где он стоял слишком далеко. Он возвращает пустую чашку и ждет, пока тот отпустит ее, прежде чем откинуться на подушку.'
        p2: '{staff} передает ему черновики отдельно и спрашивает только о том порядке, который он узнает. Он останавливается на последней странице одной из них и перемещает палец между двумя строками. Он выбирает два листа и кладет их сверху. Только он знал, какую из этих разрозненных страниц следует прочитать первой.'
        p1: 'У двери {staff} спрашивает каждого фермера, что выращивает и что именно ему нужно знать, а затем заносит аналогичные вопросы на одном листе. Никто не знает размера одного поля, поэтому его владелец идет домой за запиской, где он его записал. Миядзава просит первого человека сесть и кладет лист с вопросами на стол. Чашка держит один угол, так что ему не нужно держать на ней руку.'
      outcomes:
        all: 'Фермеры вернутся с новыми вопросами. Черновики и записи разкладываются по противоположным концам стола, а Миядзава находит у двери табуретку для посетителя.'
        p3: 'После этого его семья моет чашку и ставит ее обратно туда, где он может взять ее, не спрашивая.'
        p2: 'Когда черновики будут прочитаны позже, первые два листа все еще лежат в том порядке, в котором он их задал.'
        p1: 'Фермер, ушедший последним, складывает лист с вопросами вчетверо и показывает его людям, ожидающим снаружи.'
      none: 'К сентябрю рукопись все еще лежит в отдельных стопках. Кресло, приготовленное для гостя, у окна пусто.'
      not_admitted: '{staff} никогда не попадает внутрь. Кто-то у двери собирает фермерские бумаги, чтобы уберечь их от дождя.'
      desync: 'Фермеры не могут найти время, чтобы спросить. Когда агентство вспоминает {staff}, у первого посетителя все еще есть вопросы.'
      excerpts:
        p3: 'Кто-то тащит табуретку с того места, где он стоял слишком далеко. Он возвращает пустую чашку и ждет, пока тот отпустит ее, прежде чем откинуться на подушку.'
        p2: 'Он выбирает два листа и кладет их сверху. Только он знал, какую из этих разрозненных страниц следует прочитать первой.'
        p1: 'Миядзава просит первого человека сесть и кладет лист с вопросами на стол. Чашка держит один угол, так что ему не нужно держать на ней руку.'
    relic: 'Карманный блокнот'
    relic_desc: 'Небольшой блокнот со стихами карандашом.'
    points:
      p1: 'Разберитесь с вопросами фермеров, чтобы Миядзава мог провести консультацию по удобрениям, когда он слишком болен для долгого разговора.'
      p2: 'Хотя Миядзава все еще может распознавать черновики «Ночи на Галактической железной дороге», попросите его оставить их порядок ясным.'
      p3: 'Окажите медицинскую помощь Миядзаве, когда его пневмония ухудшится 20 сентября, чтобы он мог пережить болезнь.'
    points_fail:
      p1: 'Посетители уходят без консультации, филиал рассинхронизируется, офис отзывает сотрудника.'
      p2: 'Страницы сохранились, и более поздним редакторам все равно придется определять порядок на основе бумаги и исправлений.'
      p3: 'В этой отрасли болезнь протекает так же, как и раньше. Он умирает в Ханамаки 21 сентября в возрасте 37 лет.'
    shift:
      p1:
        was: 'В августе 1933 года Миядзава продолжал консультировать фермеров по поводу удобрений, поскольку его здоровье ухудшалось.'
      p2:
        was: 'В сентябре 1933 года Миядзава умер, оставив несколько незаконченных набросков «Ночи на галактической железной дороге».'
        now: '{staff} спрашивает его, какие стопки пришли первыми, и записывает порядок в отдельную обертку. Более поздние редакторы используют эти примечания, чтобы сохранить различия между версиями.'
        who: 'miyazawa_kenji_hanamaki'
        bio: 'Перед смертью Миядзава оставил руководство по порядку чертежей. Когда история появилась после его смерти, читатели могли последовательно следить за его изменениями.'
      p3:
        was: '20 сентября 1933 года у Миядзавы развилась острая пневмония, и на следующий день он умер в Ханамаки в возрасте 37 лет.'
        now: '{staff} начинает лечение во время острого заболевания. Миядзава выживает и с наступлением осени снова может сидеть за своим столом.'
        who: 'miyazawa_kenji_hanamaki'
        bio: 'В этом филиале Миядзава осенью 1933 года перенес пневмонию и возобновляет работу над своими рукописями.'
    vignettes:
      call: 'Вы читаете вызов станции с другого конца комнаты. Читатель поднимает взгляд, прежде чем вы объясните, кто там. Они оставляют объяснение на потом и продолжают читать разговор.'
      window: 'Читатель пытается указать, где маршрут выходит в небо. Вы спрашиваете, что Джованни видит в окне в первую очередь. Горку и карету разложили на отдельные обломки.'
      ticket: 'Вы держите страницу открытой, пока читатель перечитывает сдвиг в каретку. Они делают короткую заметку о том, что изменилось, прежде чем называть следующую станцию.'
  higuchi_ichiyo_tokyo:
    name: 'Семь выпусков на одном прилавке'
    place: 'Токио'
    figure: 'Хигути Итиё'
    story: '«Такекурабе» Хигути Ичиё появилось в семи выпусках в «Бунгакукай» в 1895 и январе 1896 года. «Бунгей Курабу» опубликовал его вместе в апреле 1896 года.'
    story_prose:
      opening:
        - 'Токио, 1896 год. Такекурабе Итиё Хигучи опубликовал семь выпусков «Бунгакукай», а затем появился в переработанной полной версии в «Бунгей Курабу».'
        - 'По истории она не получила отдельного издания на условиях, которые могла выбрать, и умерла в ноябре. В этом филиале еще не найден ни один старый выпуск, и продавец книг все еще может согласиться на аванс.'
        - 'Кто-то, кто может проследить проблемы и найти доказательства, может помочь. Заставить человека, обсуждающего оплату, подождать, пока автор прочитает условия, потребует терпения. Болезнь нуждается в ком-то, кто прибудет с нужным оборудованием.'
      points:
        p3: 'Когда погода становится жаркой, у Ичиё все еще поднимается температура. {staff} посещает ее, организует уход, на который она согласна, и просит людей, с которыми она живет, отказывать всем, кто требует дополнительных страниц. Однажды она снова сидит за столом. Она возвращает рукопись с того места, где она лежала у стены. Немного света из окна падает на то место, где она в последний раз остановилась.'
        p2: '{staff} просит продавца книг указать сумму сбора, дату его выплаты и версию, которая будет использоваться в письменном виде. Ичиё подтягивает лист ближе и читает каждый термин. Лишь в последний момент она спрашивает, какую копию она может оставить себе. Книготорговец складывает свой экземпляр пополам. На той, что лежит открытой у Итиё, сразу видно имя, которое она обвела.'
        p1: 'На прилавке должно быть семь выпусков, но насчитать можно только шесть. {staff} находит человека, который последним брал отсутствующий выпуск. Вернувшись за стойку, Ичиё находит тот же отрывок в своей редакции. Она кладет страницы рядом и начинает читать с первой переписанной строки. На этот раз бумага не попала в трещину в стойке.'
      outcomes:
        all: 'Когда Ичиё возвращается к столу, она сначала проверяет условия отдельного издания. У окна лежат две стопки: старые выпуски и бумага, на которой она еще может писать.'
        p3: 'Когда она снова может сесть и писать, она берет страницу сверху. Никто в комнате не поворачивает ей это.'
        p2: 'Книготорговец отправляет обратно копию своего соглашения. Она хранит выбранное доказательство в том же последнем выпуске.'
        p1: 'Когда выходит полный выпуск, семь старых все еще лежат вместе. Она останавливается у стола и читает исправленное место.'
      none: 'В сообщении продавца книг говорится, что еще многое предстоит сделать. Когда новый вопрос закрыт, в нем нет свежего ответа.'
      not_admitted: '{staff} никогда не встречает Ичиё. Под стойкой кредитования все еще хранится стопка старых выпусков.'
      desync: 'Невозможно найти один предыдущий выпуск. Когда офис отзывает {staff}, стопка на прилавке все еще имеет зазор посередине.'
      excerpts:
        p3: 'Она возвращает рукопись с того места, где она лежала у стены. Немного света из окна падает на то место, где она в последний раз остановилась.'
        p2: 'Книготорговец складывает свой экземпляр пополам. На той, что лежит открытой у Итиё, сразу видно имя, которое она обвела.'
        p1: 'Она кладет страницы рядом и начинает читать с первой переписанной строки. На этот раз бумага не попала в трещину в стойке.'
    relic: 'Карманный дневник'
    relic_desc: 'Дневник, который велся годами в тщательном письме.'
    points:
      p1: 'Соберите все семь частей из Bungakukai и проверьте собранные корректуры у Хигучи, чтобы переработанная работа могла появиться в апреле.'
      p2: 'Когда появится собранный текст, помогите Хигучи договориться об отдельном издании с предоплатой и доказательствами ее выбора.'
      p3: 'Когда в июле у Ичиё не спадет жар, выявите туберкулез как можно раньше и вылечите ее.'
    points_fail:
      p1: 'В стопке не хватает одного вопроса. Редактор получает неполный собранный текст, а офис отзывает сотрудника.'
      p2: 'Собранную версию можно взять, но продавец книг заставляет ее ждать, не согласовывая плату или текст для использования.'
      p3: 'Ее болезнь прогрессирует, как и в анамнезе. Она умирает от туберкулеза 23 ноября в возрасте двадцати четырех лет.'
    shift:
      p1:
        was: 'Такекурабе состоял из семи частей. Бунгей Курабу вместе напечатал исправленную работу 10 апреля 1896 года.'
      p2:
        was: 'В конце жизни Ичиё столкнулся с финансовыми трудностями. Позже Такекурабе появилась в ее собрании сочинений в 1897 году.'
        now: 'Книготорговец вносит часть гонорара и сохраняет утвержденные доказательства. Она может использовать деньги на домашние расходы, а следующий наборщик знает, какому тексту следовать.'
      p3:
        was: 'В июле 1896 года Итиё заболел. Она умерла от туберкулеза 23 ноября в возрасте двадцати четырех лет.'
        now: '{staff} обеспечивает уход, пока есть время лечить ее. Ичиё достаточно выздоравливает, чтобы снова провести часть дня за письменным столом.'
        who: 'higuchi_ichiyo_tokyo'
        bio: 'В этой ветви Хигучи Итиё выздоравливает от болезни, начавшейся в 1896 году, и возвращается к писательству.'
    vignettes:
      index: 'Кто-то написал карандашом «завершено» по одному вопросу. Вы сравниваете окончание с апрельским изданием и находите, где оно обрывается. В держатель книжного киоска можно положить съемный чехол. Вы приносите домой список из семи частей. Вы никогда не узнаете, кто написал первую этикетку.'
      reserve: 'У хранителя есть читатель, который следил за историей от номера к выпуску и не вернулся за последним. Вы отмечаете, что другие клиенты теперь могут купить апрельскую печать. Последний взнос уходит под прилавок вместе с квитанцией о бронировании. Вы уходите до того, как этот читатель вернется.'
      layout: 'Вы кладете апрельский номер рядом с последним выпуском. Один открывается в начале, и можно предположить, что читатель уже прождал шесть произведений. Вы записываете это отличие на записке для продавца и оставляете себе копию. Читатели оригинального сериала ждали дольше, чем весь ваш визит.'
  rumi_konya:
    name: 'Голос в начале рассказа'
    place: 'Конья'
    figure: 'Руми'
    story: 'В начале «Маснави» Руми слушателю предлагается услышать тростник, говорящий о разлуке. В музее Мевланы в Конье хранится рукопись из шести книг, скопированная в 1278 году, после смерти Руми в 1273 году.'
    story_prose:
      opening:
        - 'Конья, 1273 год. Длинное стихотворение Руми было разбито на шесть книг. Копия, сделанная пять лет спустя, сохранилась до сих пор.'
        - 'Согласно истории, Руми умер в декабре того же года. Рукопись расскажет последующим читателям, как было построено стихотворение. В этой ветке страницы двух экземпляров для чтения по-прежнему лежат на одном столе.'
        - 'Будет полезен тот, кто сможет разобраться в порядке вкладышей. Кто-то тоже должен выслушать, когда больной человек говорит, кого он хочет видеть, и дать двоим немного помолчать.'
      points:
        p2: '{staff} спрашивает Руми, кого он хочет увидеть первым, приводит посетителя и просит остальных у двери подождать. Посетитель сидит так, чтобы Руми мог его слышать. Некоторое время никто не разговаривает. Посетитель откладывает бумагу, которую держал в руках. Руми видит это и приближает чашку к себе.'
        p1: 'Когда приходит заемщик, {staff} разделяет два набора на столе и следует за каждой последней строкой до следующего листа. Заемщик сидит, чтобы помочь. Когда строка обрывается, его чтение тоже. Он находит следующий лист и сдвигает его на дюйм вперед. На этот раз заимствованный пучок следует от первого отрывка к последнему.'
      outcomes:
        all: 'Позже заемщик оставляет два экземпляра в разных местах. Когда дверь закрывается, у выходящих руки освобождаются, а читатель остается еще немного.'
        p2: 'Люди у дверей освобождают немного места. Посетитель долго сидит. Его никто не торопит.'
        p1: 'У двери заемщик переворачивает лист и выносит сверток, прислонив его к пальто.'
      none: 'На столе остаются два комплекта страниц. Чашка у окна долго стоит нетронутой.'
      not_admitted: '{staff} никогда не попадает внутрь. Заемщик ждет у скамейки с пустыми руками.'
      desync: 'Один экземпляр заимствован, в котором отсутствует какой-либо раздел. Когда агентство отзывает {staff}, другой все еще лежит на столе.'
      excerpts:
        p2: 'Посетитель откладывает бумагу, которую держал в руках. Руми видит это и приближает чашку к себе.'
        p1: 'Он находит следующий лист и сдвигает его на дюйм вперед. На этот раз заимствованный пучок следует от первого отрывка к последнему.'
    relic: 'Лист для начала чтения'
    relic_desc: 'Воображаемый лист для чтения, обозначающий начало стиха.'
    points:
      p1: 'В Конье проверьте порядок листов в экземпляре «Маснави», прежде чем одолжить его другому читателю.'
      p2: 'Когда Руми заболеет, спросите, кого он хочет видеть, и соблюдайте тишину в комнате, когда они сядут вместе.'
    points_fail:
      p1: 'Две копии чтения перемешаны. Одна связка уходит с разделом не в том месте, и контора отзывает {staff}, когда запись рассинхронизируется.'
      p2: 'Еще один посетитель появляется в дверях прежде, чем человек, которого просил Руми, может сесть.'
    shift:
      p1:
        was: 'Конья хранит рукопись Маснави из шести книг, датированную 1278 годом, через пять лет после смерти Руми.'
      p2:
        was: 'Руми умер в Конье в декабре 1273 года. В более позднем отчете изображены его товарищи, собравшиеся у его постели.'
        now: 'В этой ветке {staff} устанавливает стул для человека, которого просит показать Руми. Разговор может подождать, пока Руми не будет готов говорить.'
    vignettes:
      reed: 'Нарин исполнила обе партии одним и тем же голосом. Вы спрашиваете, где тростник впервые говорит сам за себя. Она позволяет следующей строке начаться после вздоха. Когда Хасан слушает с закрытыми глазами, он может услышать момент, когда тростник берет верх.'
      hand: 'Хасану приходится покинуть скамейку для чтения, а Нарин тянется к своей странице, пока он все еще говорит. Вы держите его угол до тех пор, пока он не закончит куплет и не сможет ткнуть пальцем в следующую строку. Она начинает там, когда наступает ее очередь. Проход прошел между ними без зазора.'
      manuscript: 'Вы видели более позднюю рукопись из шести книг. Нарин спрашивает, будет ли показано, где Хасан вздохнул. Вы указываете на линию, которую они отрабатывали, и позволяете ей решить, где сделать паузу. Дверь закрывается, прежде чем они читают вслух следующий куплет.'
  terence_rome:
    name: 'Зрители, которые всё время уходят'
    place: 'Рим'
    figure: 'Теренций'
    story: 'В прологах к «Гекире» Теренция описываются перерывы. Они вспоминают жеребьевку бокса и спортсмена на канате, а затем толпу, ворвавшуюся, когда было объявлено о гладиаторах. Год карты указывает на ранние постановки, а второй пролог оглядывается на них.'
    story_prose:
      opening:
        - 'Рим, около 165 г. до н.э. В прологах «Хекиры» будет записано то, что произошло при первом ее показе. Игроки ждут, пока зрители успокоятся.'
        - 'В истории зрители были отвлечены другими развлечениями и комедия не дошла до конца. В этой ветке еще не пошли первые несколько рядов. Они просто не могут услышать, кто будет говорить дальше.'
        - 'Кто-то, кто может говорить сквозь толпу и знает, когда вернуть комнату актерам, мог бы помочь.'
      points:
        p1: '{staff} просит первый ряд занять свои места, затем указывает на актера, уже ожидающего слова. Мужчина спрашивает, когда начнутся другие развлечения. {staff} выслушивает его и просит подождать всего одну очередь. Актер не повышает голос. Несколько человек оборачиваются, и люди позади них тоже затихают. Когда произносится последняя строчка, человек, ближайший к сцене, убирает руку с ее края. Люди позади него ждут, пока он встанет, прежде чем двигаться.'
      outcomes:
        all: 'Когда команда пришла развязать веревки, несколько человек все еще сидели и говорили о только что услышанной веревке.'
        p1: 'Последняя сцена заканчивается еще до того, как люди впереди начинают вставать.'
      none: 'Толпа движется к другому шоу. На сцене актер останавливается посреди очереди.'
      not_admitted: '{staff} никогда не достигает первой строки. Кто-то стоит рядом, и вскоре остается только смотреть на спины.'
      excerpts:
        p1: 'Когда произносится последняя строчка, человек, ближайший к сцене, убирает руку с ее края. Люди позади него ждут, пока он встанет, прежде чем двигаться.'
    relic: 'Маска для комедии'
    relic_desc: 'Льняная маска с приподнятой бровью, которую носил актер.'
    points:
      p1: 'Когда разговоры о боксерах и канатоходцах заглушают игроков, пусть люди возле сцены снова слушают, чтобы труппа могла закончить свое первое выступление.'
    points_fail:
      p1: 'Игроки не могут быть услышаны из-за толпы. Как и в истории, они останавливаются перед концом.'
    shift:
      p1:
        was: 'В 165 г. до н.э. первая постановка «Тещи» была прервана из-за шума и волнений по поводу других исполнителей.'
        now: 'Публика у сцены снова начинает прислушиваться, и труппа с первой попытки добирается до последней строчки.'
        who: 'terence_rome'
        bio: 'В этой ветви первая постановка «Тещи» Теренция завершилась в 165 г. до н. э.'
    vignettes:
      warning: 'Вы говорите рабочему сцены, что люди будут читать о прерванном спектакле и через две тысячи лет. Он спрашивает, узнают ли они, что говорили актеры, когда им пришлось остановиться. Ты остаешься на репетиции и записываешь последнюю строчку, которую услышал. Публичное выступление у вас еще впереди.'
      audibility: 'Вы слушаете, стоя у входа, и пропускаете ответ на фразу, которую отчетливо слышите. Работник сцены передвигает одну скамейку и просит вас послушать еще раз. На этот раз вы слышите обе половины. Вы приносите домой эскиз двух положений скамьи. На улице стало слишком шумно, чтобы вы могли услышать финал снаружи.'
      bench: 'Вы помогаете рабочему сцены отодвинуть одну скамейку от дверного проема. Опоздавший садится, не выстроившись в ряд. Вы отмечаете свободное место на куске дерева. Вы уходите, а репетиция все еще звучит через дверной проем.'
  taqi_al_din_istanbul:
    name: 'Два голоса в обсерватории'
    place: 'Стамбул'
    figure: 'Таки ад-Дин'
    story: 'Стамбульская обсерватория Таки ад-Дина проводила наблюдения перед ее сносом в январе 1580 года. Архивные исследования выявили инструменты, включая квадранты и механические часы.'
    story_prose:
      opening:
        - 'Стамбул, начало 1580 года. Таки ад-Дин и его помощники ведут наблюдения из обсерватории. В рукописях записано несколько инструментов, которые они там использовали.'
        - 'Исторически обсерваторию демонтировали в январе. В этой ветке бывший читатель хотел бы оставить одну небольшую деталь от инструмента, который они использовали вместе.'
        - 'Помочь может тот, кто понимает, что можно передать безопасно. Им приходится спрашивать помощника, за какую часть он может взять на себя ответственность.'
      points:
        p1: '{staff} вместе с ассистентом дважды осматривает стенд, затем спрашивает, хочет ли он взять только тот фрагмент, в котором указан масштаб, который он читает чаще всего. Ассистент кивает и держит под ним старую ткань. Он и {staff} кладут его на стол. Прежде чем взять ткань, он снова проводит пальцем по краю. Его палец останавливается на отметке, с которой он произносил чтение.'
      outcomes:
        all: 'Помощник приносит завернутый кусок домой. Позже кто-то спрашивает его, как они снимали показания, и он разворачивает его, чтобы сначала показать им эту отметку.'
        p1: 'Небольшая деталь не идет со старой подставкой. Все еще завернутый в ткань, которую они использовали в тот день, он уходит под стол ассистента.'
      none: 'Помощник однажды возвращается и уходит с пустыми руками. Там, где когда-то стоял стенд, на полу виднеется более бледное пятно.'
      not_admitted: '{staff} никогда не встречает никого из обсерватории. После закрытия дверей внутрь перемещается деревянный ящик.'
      excerpts:
        p1: 'Прежде чем взять ткань, он снова проводит пальцем по краю. Его палец останавливается на отметке, с которой он произносил чтение.'
    relic: 'Листок для сверки'
    relic_desc: 'Вымышленная обсерватория с оригинальным рядом и его исправлением.'
    points:
      p1: 'Прежде чем обсерваторию разберут, помогите людям, использовавшим инструменты, взять небольшую деталь на свое попечение.'
    points_fail:
      p1: 'Деталь все еще находится в обсерватории, когда приходят рабочие. Ничего из этой передачи до бывших помощников не дошло.'
    shift:
      p1:
        was: 'В январе 1580 года Стамбульская обсерватория была снесена. В современном стихотворении записаны инструменты, сломанные во время разборки.'
        now: 'Один отмеченный компонент остается у бывших помощников. Покинув обсерваторию, они все еще могут показать другому мастеру инструментов, как было градуировано это изделие.'
    vignettes:
      clock: 'Хасан читает вслух ракурс, а Лейла копирует часы. Следующая строка наследует последний угол, поскольку она не услышала его второй звонок. Вы просите их повторить, по одному голосу за раз. Оба работника отмечают исправление рядом с записью, где его сможет найти следующий читатель.'
      copy: 'Переплетенная тетрадь должна спуститься вниз, а Хасану понадобится исправление на скамейке. Вы позволяете Лейле скопировать старые и исправленные строки на один лист. Она пишет то, что было прочитано первым. Когда блокнот уходит, на скамейке все еще остается след изменений.'
      closure: 'Вы знаете, как мало времени осталось до строительства. Хасан остановился на линии, не успев выйти за угол. Вы спрашиваете, что он еще может проверить, прежде чем закрыть ставни. Он обводит одно пустое место. Вы уходите, не увидев еще одного наблюдения из этой комнаты.'
  bessie_coleman_jacksonville:
    name: 'Её имя перед взлётом'
    place: 'Джексонвилл'
    figure: 'Бесси Коулман'
    story: 'Бесси Коулман получила международную лицензию пилота во Франции 15 июня 1921 года. 30 апреля 1926 года она погибла во время тренировочного полета на аэродроме Паксон-Филд в Джексонвилле накануне первомайского праздника.'
    story_prose:
      opening:
        - 'Джексонвилл, апрель 1926 года. Бесси Коулман училась летать во Франции. Сейчас она находится во Флориде, готовится к местному авиационному событию.'
        - 'По истории она навестила школьников 29 апреля и на следующий день погибла во время тренировочного полета. В этом филиале организаторы хотят одолжить машину, предназначенную для того, чтобы отвезти ее в школы.'
        - 'Кто-то, кто может поговорить со школами и организаторами, может помочь. То же самое может сделать тот, кто разбирается в самолетах и может попросить еще один чек, когда все ждут взлета.'
      points:
        p4: '{staff} первым доставляет туда наземную команду и выслушивает осмотр вместе с Коулманом и пилотом. Кто-то из ожидающих просмотра спрашивает, кто займет зарезервированные места. Коулман просит полетную книжку. Пилот указывает время, которое они могли бы использовать в другой день. Она берет карандаш и оставляет сегодняшнюю строку пустой.'
        p2: 'У учеников много вопросов. Один из них сложен настолько мал, что его никто не возьмет, когда ученик поднимет его. {staff} передает его учителю, который остается, просит его выделить время для еще одного урока и дает Коулману адрес учителя, чтобы она могла прислать новости об обучении. Учитель копирует свой адрес в один угол доски. Последний ученик оборачивается и снова записывает номер дома.'
        p1: '{staff} приносит в школу расписание мероприятий, выясняет, какое время ученикам уже назначено, а затем достает организаторам еще одну машину. К приходу Коулмана в холле уже выстроилась очередь. Ребенок впереди поправляет бумагу со своим именем. Только после того, как она сядет, он швыряет свой вопрос через стол.'
      outcomes:
        all: 'Тренировочного полета в этот день не будет. Коулман помещает адрес учителя в книгу, и они с пилотом переворачивают пустую строку вверх.'
        p4: 'Тренировочный полет перенесен на другой день. Когда поле закрывается, никто не поставил на линию новый номер.'
        p2: 'Учитель приносит вопросы в класс и кладет их рядом с книгой для следующего урока.'
        p1: 'Посещение школы продолжается, как и было запланировано. В конце концов, кто-то все еще ждет у двери газету с именем Коулмана.'
      none: 'После мероприятия на столе все еще лежит несколько списков, и взять их некому.'
      not_admitted: '{staff} не доходит ни до организаторов школы, ни до команды. Кто-то уносит последний табурет от двери.'
      desync: 'Посещение школы исключено из графика. Когда офис перезванивает {staff}, дети все еще ждут у ворот.'
      excerpts:
        p4: 'Пилот указывает время, которое они могли бы использовать в другой день. Она берет карандаш и оставляет сегодняшнюю строку пустой.'
        p2: 'Учитель копирует свой адрес в один угол доски. Последний ученик оборачивается и снова записывает номер дома.'
        p1: 'Ребенок впереди поправляет бумагу со своим именем. Только после того, как она сядет, он швыряет свой вопрос через стол.'
    relic: 'Датированный пробный оттиск'
    relic_desc: 'Вымышленное уведомление наземной бригады с полным именем Коулмана.'
    points:
      p1: 'Не позволяйте подготовке к авиашоу вытеснять визиты Коулмана к студентам Джексонвилля.'
      p2: 'Помогите Коулману организовать один дополнительный урок с местным учителем, который сможет ответить на вопросы учеников о том, как научиться летать.'
      p4: 'Попросите экипаж осмотреть самолет на земле и попросите двух авиаторов отложить тренировочный полет, если он нуждается в дополнительной доработке.'
    points_fail:
      p1: 'Организаторы отказываются от визитов, чтобы наверстать время. Филиал рассинхронизируется, и в тот день офис отзывает сотрудника.'
      p2: 'Учащиеся уходят домой со своими вопросами, и ни один учитель не согласился на дополнительный урок.'
      p4: 'Старый самолет взлетает по плану. Коулман и пилот погибают во время тренировочного полета.'
    shift:
      p1:
        was: '29 апреля 1926 года Коулман посетил учеников государственных школ для чернокожих Джексонвилля.'
      p2:
        was: 'Коулман хотел открыть летную школу и разговаривал со студентами в Джексонвилле. Ее школа так и не открылась при ее жизни.'
        now: 'В этом разделе преподаватель собирает вопросы учеников и соглашается провести дополнительный урок. У Коулман есть адрес, по которому она может присылать новости о возможностях обучения.'
      p4:
        was: '30 апреля 1926 года Коулман и пилот погибли в результате тренировочного полета на аэродроме Паксон-Филд.'
        now: 'В этом ответвлении экипаж рекомендует провести еще один наземный осмотр, и авиаторы покидают тренировочный полет еще на один день.'
        who: 'bessie_coleman_jacksonville'
        bio: 'После Джексонвилля Коулман продолжал летать и продолжил работу над открытием летного обучения для чернокожих студентов.'
    vignettes:
      proof: 'У Анны не хватает строки, и она вырезала имя пилота. Вы обмениваете два пышных слова, чтобы освободить место. При получении она заставляет бегуна один раз прочитать полное имя, прежде чем сложить корректуру. Теперь он может сказать тому, кто полетит, не говоря только, что это женщина.'
      school: 'Льюис думает, что толпа не хочет ничего, кроме шоу. Ребенок возле забора спрашивает, где пилот научился. Вы сообщаете Льюису, где была выдана лицензия, и позволяете ему использовать последнюю строку для факта, который он может повторить. Когда он берет доказательство, он тренируется произносить дату и место.'
      ground: 'Поле заполняется, и вы знаете, что в объявлении на следующий день больше не будет описываться то же шоу. Энн спрашивает, следует ли ей раздать доказательства сейчас. Вы оставляете себе один датированный экземпляр и помогаете ей отправить остальные к воротам. Ваш визит заканчивается на земле, а зрители все еще прибывают.'
  fanny_mendelssohn_berlin:
    name: 'Шесть песен под своим именем'
    place: 'Берлин'
    figure: 'Фанни Мендельсон-Гензель'
    story: 'Шесть песен Фанни Хензель, соч. 1, появилась под своим собственным именем в 1846 году. В последнюю весну она закончила фортепианное трио и написала Bergeslust. Она заболела во время репетиции в Берлине 14 мая 1847 года и в тот же день умерла. Трио появилось в печати в 1850 году.'
    story_prose:
      opening:
        - 'Берлин, весна 1847 года. Фанни Хензель опубликовала под своим именем шесть песен. Закончив фортепианное трио, она пишет в дневнике, что музыки больше не было.'
        - 'В истории она завершила одну последнюю песню. 14 мая на репетиции она заболела и в тот же день умерла. В этой ветке три результата, набранные игроками, имеют разные оценки.'
        - 'Может помочь тот, кто сможет сравнить результаты и объяснить игрокам порядок работы. Если что-то случится, кому-то придется выключить музыку и позвать на помощь.'
      points:
        p3: 'Хензель не переворачивает следующую страницу на репетиции. {staff} просит певцов остановиться, отправляет кого-нибудь к двери за врачом и спрашивает, кого из членов семьи она узнает. Певцы отходят назад и проходят между стульями. Кто-то из членов ее семьи кладет счет на пол и садится рядом с ней. Страница, которую она так и не перевернула, все еще открыта.'
        p1: '{staff} просит игроков подвести свои баллы позже, чтобы Хензель сохранила час, который она отвела для своей песни. Она слышит, как кто-то открывает дверь внизу, и остается сидеть. Она пишет последнюю строчку на бумаге. Ее чернила все еще влажные, когда раздается второй стук.'
        p2: '{staff} помещает рабочий счет рядом с копиями игроков и спрашивает, откуда взялось каждое изменение. Хензель просматривает два места, зачеркивает одно и сильнее нажимает ручку на другое. Когда игроки подсчитывают свои очки, все три книги открываются на одной странице.'
      outcomes:
        all: 'Позже семье придется посоветоваться с тем же счетом. Несколько человек помнят, кто сидел рядом с ней в тот день и какое чтение она предпочла оставить на странице.'
        p3: 'После того, как кто-то уходит за доктором, в комнате на некоторое время воцаряется тишина. Стул, ближайший к Хензелю, больше не сдвигается.'
        p1: 'Финальная песня готова. Когда игроки поднимаются наверх, простыня все еще остается там, где она оставила ее сохнуть.'
        p2: 'Рабочая партитура трио сохраняется. Когда члены семьи захотят позже проверить, как она читает, они могут сразу перейти к этой странице.'
      none: 'Несколько баллов остаются открытыми. Человек, закрывающий комнату, убирает их один за другим из света.'
      not_admitted: '{staff} никогда не попадает в репетиционную комнату. Снизу доносится оборванная фраза.'
      desync: 'Репетиция отнимает все время, которое она выделила. Когда агентство вспоминает {staff}, последняя строка песни остается пустой.'
      excerpts:
        p3: 'Кто-то из членов ее семьи кладет счет на пол и садится рядом с ней. Страница, которую она так и не перевернула, все еще открыта.'
        p1: 'Она пишет последнюю строчку на бумаге. Ее чернила все еще влажные, когда раздается второй стук.'
        p2: 'Хензель просматривает два места, зачеркивает одно и сильнее нажимает ручку на другое. Когда игроки подсчитывают свои очки, все три книги открываются на одной странице.'
    relic: 'Рукописные ноты песни'
    relic_desc: 'Написанная от руки песня с пометкой Фанни.'
    points:
      p1: 'Берегите время Хенсель, пока она пишет, во время подготовки к репетиции, чтобы она могла закончить свою последнюю песню.'
      p2: 'Положите рукопись Трио и репетиционную копию рядом и попросите Хензель отметить, какие изменения она хочет, чтобы игроки сохранили.'
      p3: 'Когда Хензель заболеет на репетиции, выключите музыку, позовите на помощь и держите кого-нибудь рядом с ней.'
    points_fail:
      p1: 'Репетиция занимает отведенные ей часы, и песня заканчивается на черновике. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Игроки сохраняют свои изменения на отдельных страницах. Ее семье придется спросить, какие из них она одобрила.'
      p3: 'Люди идут в разные стороны в поисках помощи. Комната остается переполненной, пока ее семья ждет, чтобы добраться до нее.'
    shift:
      p1:
        was: 'В конце апреля 1847 года Хензель написал, что после Трио состав застопорился; в мае незадолго до смерти она закончила свою последнюю песню.'
      p2:
        was: 'Хензель умер 14 мая 1847 года. Фортепианное трио впервые появилось в печати в 1850 году.'
        now: 'В этой ветке {staff} помогает Хензель пометить рабочую копию Трио, к которой могут обращаться игроки и ее семья. Отдельная публикация выйдет позже.'
      p3:
        was: 'Хензель заболел во время репетиции 14 мая 1847 года и умер в тот же день.'
        now: 'В этой ветке {staff} получает помощь и просит певцов закрыть свои партитуры. Рядом с Хензель есть место, где может остановиться член ее семьи.'
    vignettes:
      cover: 'Певец открыл партитуру посередине и спрашивает, чья это музыка. Вы достаете титульный лист и кладете его рядом с партитурой. Инициалов на титульном листе достаточно, чтобы решить, что писать на конверте. Вы пропускаете первую песню, пока собираете бумаги.'
      forward: 'Вы начинаете рассказывать певцу, как коллекционеры будут искать эти песни в дальнейшем. Она указывает на незакрепленную обложку и спрашивает, сохранится ли она у них. Вы просите, чтобы обложка вышла со следующим экземпляром. Это идет с одним читателем. Вы не можете следовать за ним дальше.'
      order: 'Вы прорабатываете содержание и раскладываете шесть песен по порядку. Певица может обратиться сразу к тому, кто ей нужен. Вы сохраняете последовательность на своем собственном листе. Чего вы не сможете забрать домой, так это звука из комнаты после того, как вы закроете дверь.'
  camille_claudel_paris:
    name: 'Две версии одного поворота'
    place: 'Париж'
    figure: 'Камилла Клодель'
    story: 'В Музее Камиллы Клодель каталогизировано несколько версий «Вальса», в том числе бронзовая отливка, датированная 1905 годом. В 1913 году в Вильнев-сюр-Фер умер отец Клодель, и она не узнала о его смерти до похорон. 10 марта ее поместили в Виль-Эврар.'
    story_prose:
      opening:
        - 'Париж, март 1913 года. Камилла Клодель написала не одну версию «Вальса». В своей студии она может выбрать понравившуюся вещь среди других, которые выглядят почти так же.'
        - 'Исторически она не услышала о смерти своего отца к похоронам. 10 марта ее госпитализировали. В этой ветке письмо, которое можно проверить, дошло до Парижа, и есть время дать кому-нибудь инструкции по поводу студии.'
        - 'Помочь может тот, кто может уделить время трудным новостям. Когда дело доходит до студии, им нужно дождаться, пока Клодель скажет, что, куда и с кем.'
      points:
        p2: '{staff} берет чистый лист и отдельно перечисляет то, на что указывает Клодель. Кто-то хочет поместить две похожие вещи в одну строку. Она кладет руку на бумагу и просит два места. Внизу она добавляет имя получателя. Прежде чем сложить бумагу, она указывает на последнюю строчку тому, кто пришел за ней.'
        p1: '{staff} сверяет дату с человеком, принесшим письмо, затем идет в студию. Клодель читает это один раз, немного ждет и спрашивает, какой первый поезд еще довезет ее туда. Прежде чем положить письмо в пальто, она дважды вытирает руки о фартук.'
      outcomes:
        all: 'Перед уходом Клодель передает список выбранному ею человеку. Когда он приходит за ним, он зачитывает два имени, которые она еще не разъяснила.'
        p2: 'Человек, которого она выбрала, берет список. Вернувшись в студию, он находит объекты по одной строке за раз.'
        p1: 'По дороге в Вильнев она еще раз достает письмо. Она поворачивается прямо к дате и перечитывает ее еще раз.'
      none: 'Предметы остаются на своих местах. Кто-то расправил простыню в углу стола. На нем не написано имя.'
      not_admitted: '{staff} так и не попадает внутрь. Замок сдвигается с другой стороны, и шаги удаляются.'
      excerpts:
        p2: 'Внизу она добавляет имя получателя. Прежде чем сложить бумагу, она указывает на последнюю строчку тому, кто пришел за ней.'
        p1: 'Клодель читает это один раз, немного ждет и спрашивает, какой первый поезд еще довезет ее туда. Прежде чем положить письмо в пальто, она дважды вытирает руки о фартук.'
    relic: 'Бронзовая рука'
    relic_desc: 'Небольшой бронзовый этюд руки.'
    points:
      p1: 'Принесите Клодель достоверные новости о смерти ее отца, чтобы она могла решить, ехать ли на похороны.'
      p2: 'Прежде чем Клодель покинет студию, спросите ее, что она хочет доверить кому-то из своих знакомых, и помогите записать ее выбор.'
    points_fail:
      p1: 'Новости достигают Парижа после похорон. Клодель уже потеряла возможность решить, идти ли ей.'
      p2: 'Запись об удалении будет, но на вещах в студии до сих пор нет записки от Клодель о том, кто должен их хранить.'
    shift:
      p1:
        was: '3 марта 1913 года ее отец, Луи-Проспер Клодель, умер в Вильнёве; Семья не сказала Камилле, и ее не было на похоронах.'
        now: 'В этой ветке Клодель вовремя получает новости и решает поехать в Вильнёв-сюр-Фер, чтобы присутствовать на похоронах своего отца.'
      p2:
        was: '10 марта 1913 года Камилла была помещена в приют Виль-Эврара по просьбе своей семьи; переехала в Мондеверг в 1914 году, она так и не уехала и умерла там 19 октября 1943 года.'
        now: 'В этой ветке {staff} записывает то, что Клодель хочет сделать с несколькими объектами студии. Кто-то, кого она выбрала, берет список и следует ему, когда она уходит.'
    shift_all: 'Клодель могла бы решить пойти на похороны отца и выбрать кого-нибудь, кто будет присматривать за предметами из ее студии.'
    vignettes:
      light: 'Вы видели более позднюю музейную экспозицию, но только сейчас вы можете наблюдать, как меняется тень, когда вы идете вокруг юбки. Упаковщик собирается написать одинаковое описание на обеих карточках. Вы рисуете две кривые на полях. Ящики уйдут отдельно, и вы не увидите ни одного распакованного.'
      mark: 'Упаковщик находит две этикетки с одинаковым названием. К каждой добавляете по одной детали там, где заканчивается драпировка, прежде чем наденутся крышки. Обе записи вы держите у себя. Комиссия по мрамору, о которой вы читаете, так и не приходит.'
      crate: 'Пока упаковщик тянется к крышке, вы держите упаковочный лист подальше от выступающей юбки. Вы прорисовываете его кривую на запасном листе бумаги по памяти. Когда крышка опустится, вы больше не сможете проверить последний дюйм.'
  emily_bronte_haworth:
    name: 'Приходской дом зимой'
    place: 'Хаворт'
    figure: 'Эмили Бронте'
    story: '«Грозовой перевал» появился в 1847 году под именем Эллис Белл. Большая часть истории романа представляет собой рассказ Нелли Дин Локвуду.'
    story_prose:
      opening:
        - 'Хаворт, 1848 год. «Грозовой перевал» издается под именем Эллис Белл. В пасторском доме у Эмили все еще хранится первое издание, которое она может просмотреть с самого начала.'
        - 'Исторически Шарлотта и Энн отправились в Лондон в июле, чтобы узнать псевдонимы, а Эмили умерла дома в декабре. В этом отделении кто-то может помочь собрать бумаги перед Лондоном и дождаться, пока Эмили скажет то, что она хочет, дома.'
        - 'Нужен кто-то, кто сможет отличить почерк от орфографии, и кто-то, кто может дождаться, пока Эмили закончит говорить, когда она заболеет.'
      points:
        p4: '{staff} спрашивает Эмили, где она хочет сидеть и кого бы она хотела видеть рядом с собой. Она выбирает стул у стены и просит книгу. {staff} кладет теплое одеяло так, чтобы оно было доступно. Кто-то начинает уносить другой стул. Эмили поднимает руку и указывает туда, где это было.'
        p3: 'То, что говорят персонажи, и то, что ошибается принтер, смешано на одних и тех же страницах. {staff} помещает несколько из них отдельно перед Эмили. Она читает вслух одно слово и просит человека, держащего ручку, подождать, пока она закончит. Эмили обводит слово, которое она хочет сохранить. Она складывает лист так, чтобы угол был виден ровно настолько, чтобы снова найти его.'
        p2: '{staff} открывает первое издание в том месте, которое указывает Эмили. Она прикладывает палец к пунктирной линии, и {staff} записывает номер страницы и исправление на отдельном листе. Она тянет лист, чтобы проверить его. Два числа сбиваются вместе, и она делает между ними пространство.'
        p1: '{staff} выбирает буквы для страниц, на которых есть как имена, так и названия книг, и отсекает проверяемые наборы. Шарлотте и Анне есть что взять с собой. Два листа начинают выскальзывать из пакета. Прежде чем закрыть его, Шарлотта нащупывает тот, на котором написано имя Анны.'
      outcomes:
        all: 'В доме священника остаются два списка: один для следующего издания и один внутри старой книги. Той зимой стул у стены остается именно там, где его просила Эмили.'
        p4: 'Семья покидает уголок, обустроенный по ее просьбе. Когда лампа подносится ближе, книга все еще находится в пределах досягаемости.'
        p3: 'Готовя следующее издание, Шарлотта сначала находит складку, а затем круг Эмили.'
        p2: 'Более поздний корректор может сразу перейти от номера страницы к строке в первом отпечатке.'
        p1: 'В Лондоне сестры разложили свои бумаги отдельно. Издателю приходится разделить собранные вместе названия.'
      none: 'Первое издание возвращается на полку. Лист между его страницами еще не закончен.'
      not_admitted: '{staff} никогда не попадает в дом священника. Под крыльцом лежит немного мокрого снега.'
      desync: 'Газеты, отправляющиеся в Лондон, лежат в одной стопке. Когда офис отзывает {staff}, два отмеченных бланка все еще лежат вместе.'
      excerpts:
        p4: 'Кто-то начинает уносить другой стул. Эмили поднимает руку и указывает туда, где это было.'
        p3: 'Эмили обводит слово, которое она хочет сохранить. Она складывает лист так, чтобы угол был виден ровно настолько, чтобы снова найти его.'
        p2: 'Она тянет лист, чтобы проверить его. Два числа сбиваются вместе, и она делает между ними пространство.'
        p1: 'Два листа начинают выскальзывать из пакета. Прежде чем закрыть его, Шарлотта нащупывает тот, на котором написано имя Анны.'
    relic: 'Ошейник для собаки'
    relic_desc: 'Потертый кожаный ошейник пасторского мастифа.'
    points:
      p1: 'Когда лондонские письма путают книги Беллов, помогите сестрам собрать бумаги, в которых идентифицируются работы каждого автора.'
      p2: 'Когда ошибка принтера меняет строку, помогите Эмили оставить исправления, которые позже сможет проверить принтер.'
      p3: 'Пока Эмили еще может проверить, как говорят ее персонажи, попросите ее подготовить копию диалекта для более позднего издания.'
      p4: 'Спросите Эмили, какую помощь она готова принять, и позвольте ей выбрать, где и с кем ей отдыхать.'
    points_fail:
      p1: 'В письмах книги по-прежнему приписывают одному псевдониму, и сестры не могут привезти в Лондон отдельные доказательства. Разъяснение теряется, и офис отзывает сотрудника.'
      p2: 'Следующий принтер должен угадать, какие показания были преднамеренными, и ошибки сохраняются.'
      p3: 'Ее семья должна решить, какие строки изменить при переиздании книги, не имея возможности установить, какое написание хотел автор.'
      p4: 'Ее семья видит, что лестница ее утомляет. Им все еще приходится ждать, пока она спросит, прежде чем они узнают, какую помощь она хочет.'
    shift:
      p1:
        was: 'В июле 1848 года Шарлотта и Энн Бронте отправились в Лондон из Хауорта, чтобы объяснить издателю, что псевдонимы Белла принадлежали разным писателям.'
      p2:
        was: 'В «Грозовом перевале» 1847 года были опечатки. Исправления появились в новом издании 1850 года.'
        now: '{staff} оставляет Эмили копию для пометки и записывает ошибки, которые она идентифицирует с помощью ссылок на страницы.'
      p3:
        was: 'Эмили умерла в Хаворте в 1848 году. Шарлотта отредактировала издание 1850 года и изменила некоторые диалектные варианты написания.'
        now: '{staff} отдельно кладет перед Эмили страницы диалектов и записывает одобренные ею варианты написания, исключая опечатки. Этот экземпляр будет у Шарлотты, когда она готовит следующее издание.'
        who: 'emily_bronte_haworth'
        bio: 'Эмили оставила аннотированную копию «Грозового перевала» с проверенным ею диалектом. Более поздние принтеры смогли сохранить то, как она написала голоса своих персонажей.'
      p4:
        was: '19 декабря 1848 года Эмили умерла в доме священника Хаворта. Из-за болезни она отказалась обратиться к врачу и согласилась только в день своей смерти.'
        now: 'В этой ветке {staff} спрашивает вместо выбора за нее. Эмили выбирает место для отдыха и человека, который будет оставаться поблизости, пока вокруг нее ведется домашнее хозяйство.'
    vignettes:
      witness: 'Читатель думает, что человек, рассказывающий эту историю, все это видел. Вы спрашиваете, как она узнала одну конкретную деталь. Они прослеживают предложение до говорящего, который его произнес.'
      voices: 'Читатель придает всей странице один голос. Вы просите их попробовать еще раз с того места, где Нелли занимает место. Слушатель теперь может определить, когда один говорящий передает историю другому.'
      mark: 'Вы оставляете записку в тот момент, когда рассказ переходит из рук в руки. Читатель возвращается к нему, прежде чем решить, противоречит ли более поздний отрывок тому, что он услышал.'
  qu_yuan_miluo:
    name: 'Стихи у реки'
    place: 'река Милоцзян'
    figure: 'Цюй Юань'
    story: '«Песни Чу» передают «Рыбака», литературный диалог между Цюй Юанем и рыбаком. В более поздней биографии в «Записях» также сохранилась версия диалога.'
    story_prose:
      opening:
        - 'На берегу реки в Чу. Читатели «Песен Чу» знают стихи, приписываемые изгнаннику Цюй Юаню, а также рассказ, в котором он встречает у воды рыбака.'
        - 'В полученных записях описывается, как он читал на болоте с осунувшимся лицом. В этой ветке кто-то хочет забрать стихи, причем одна связка еще не дописана.'
        - 'Кто-то, кто знает книги и переправы через реки, может помочь. То же самое может сделать и тот, кто сможет найти тихое место и оставить там еду.'
      points:
        p2: '{staff} просит продавца еды держать место открытым, ставит миску и отходит в сторону. Цюй Юань садится и кладет листочки в левую руку. Он немного ест, прежде чем взять что-нибудь сам. Он читает строчку во второй раз. Кто-то, сидящий у двери, проходит дальше в комнату.'
        p1: 'Люди, переходящие реку, собирают вещи. {staff} спрашивает Цюй Юаня, какой пакет он хочет сохранить, и просит человека, копирующего, перечитать последнюю строку. Цюй Юань находит листок, который находится между двумя другими, и кладет его на место. Носитель продевает шнур обратно, оставляя узел снаружи. Рука сможет найти его, когда в следующий раз откроет сверток.'
      outcomes:
        all: 'Перевозчик забирает посылку. На лодке он все еще помнит фразу, которую услышал за едой, и только потом открывает копию, чтобы найти ее.'
        p2: 'После того, как чаши очищены, люди, которые еще там, остаются еще немного. В тишине Цюй Юань снова делает ту же оговорку.'
        p1: 'Копия уходит вниз по течению. Как только носитель сядет, он переворачивает узел на ближайшую к нему руку.'
      none: 'Место, отведенное для трапезы, остается пустым. После наступления темноты ветер поднимает угол циновки.'
      not_admitted: '{staff} так и не находит место, предназначенное для еды. Паромщик подтягивает доску, а под ней все еще течет вода.'
      desync: 'Между двумя листами отсутствует часть копии. Перевозчик только что достиг берега, когда агентство перезванивает {staff}.'
      excerpts:
        p2: 'Он читает строчку во второй раз. Кто-то, сидящий у двери, проходит дальше в комнату.'
        p1: 'Носитель продевает шнур обратно, оставляя узел снаружи. Рука сможет найти его, когда в следующий раз откроет сверток.'
    relic: 'Бамбуковая планка со стихами'
    relic_desc: 'Листок бамбука, несущий несколько строк длинного стихотворения.'
    points:
      p1: 'Спросите Цюяня, какой комплект он хочет скопировать, и помогите читателю сохранить эти стихи вместе, пока люди уходят.'
      p2: 'Предложите Цюй Юаню место, где можно поесть, сесть и послушать, если он захочет прочитать вслух один из своих стихов.'
    points_fail:
      p1: 'Читатель уходит с пробелом между двумя листками. Офис отзывает {staff}, когда копия не синхронизируется.'
      p2: 'Еда готова, но место для сидения занято. Нет никакой возможности предложить ему тихий час.'
    shift:
      p1:
        was: 'Стихи, приписываемые Цюй Юаню, собраны в «Песнях Чу». Представленная здесь передача — это один из способов, с помощью которого читатели могут сохранить набор стихов вместе.'
      p2:
        was: 'В «Записках великого историка» говорится, что Цюй Юань в изгнании ходил по берегам болот с распущенными волосами, с изможденным лицом и истощенным телом.'
        now: 'В этом филиале Цюй Юань принимает еду. Он кладет рядом с собой стопку стихов и решает, какой из них прочитать вслух, прежде чем уйти.'
    vignettes:
      two_tales: 'Паромщик услышал другую концовку, отличную от той, которую вы привели. Вы слушаете, как они рассказывают, и отмечаете, чей это рассказ, прежде чем сравнивать строки.'
      refrain: 'Паромщик начинает напевать после вопроса в сказке. Вы ждете, пока мелодия закончится, прежде чем спрашивать, где они впервые услышали эти слова.'
      wait: 'Пока паром ждет, вы просите кассира вернуться туда, где два человека впервые разговаривают. На берегу еще можно вспомнить, кто задал первый вопрос.'
  sima_qian_changan:
    name: 'История, написанная после приговора'
    place: 'Чанъань'
    figure: 'Сыма Цянь'
    story: 'В «Книге Хань» сохранилось письмо Сыма Цяня Жэнь Аню, в котором он обсуждает цели и организацию своей исторической работы.'
    story_prose:
      opening:
        - 'Чанъань, около 98 г. до н.э. Сыма Цянь заключен в тюрьму после того, как выступил от имени Ли Лин. Оглядываясь назад в свое «Письмо к Рен Ану», он вспоминает, что его история тогда была лишь черновиком.'
        - 'Исторически сложилось так, что семья не могла заплатить, чтобы искупить приговор. Он был наказан и позже завершил свою историю. В этом отделении кто-то может дома присмотреть за потерявшимися страницами, а кто-то пытается получить прошение к ответственному делопроизводителю.'
        - 'Нужен кто-то, кто сможет распознать черновики, кто-то, кто сможет позаботиться об обычных потребностях заключенного, и кто-то, кто сможет объединить обещания нескольких семей в одно предложение.'
      points:
        p3: '{staff} просит тех, кто хочет помочь, сказать за столом, какой вклад они могут внести, затем приносит прошение и деньги клерку. Клерк пересчитывает его и отмечает полученный дубликат. Когда Сыма Цянь приходит домой через несколько дней, он первым зажигает лампу. Он развязывает верхнюю связку, поднимает лист из-под угла и продолжает писать.'
        p2: '{staff} приносит еду и сменную одежду к месту приема посылок и ждет, пока их пересчитают. Сыма Цянь раскрывает сверток и накидывает более толстую одежду себе на ноги. Еда еще теплая. Он опускает миску между колен и наклоняется, чтобы поесть.'
        p1: 'Его домочадцы убрали со стола. {staff} проверяет линии открытия на концах связок, возвращает смещенные листья на свои места и просит вернуть связки в том же порядке. Прежде чем закроют последнюю пачку, кто-то выворачивает этикетку наружу. Следующий можно найти, не перемещая сначала все остальные.'
      outcomes:
        all: 'Рукопись остается в доме. Вернувшись, Сыма Цянь может продолжить с того места, на котором остановился, а кто-то ждет у двери, чтобы наполнить лампу.'
        p3: 'Петиция принята. Когда позже кто-то звонит и предлагает помощь, Сыма Цянь сдвигает сверток под локоть, чтобы освободить место для посетителя.'
        p2: 'Более толстая одежда остается рядом с ним. После того, как остальные уйдут, он сможет снова обернуть его вокруг себя.'
        p1: 'Прежде чем уйти, человек, наблюдающий за столом, еще раз проверяет этикетки. Каждая связка по-прежнему находится на своем месте.'
      none: 'После того, как люди у дверей расходятся по домам, на пустом столе все еще горит лампа.'
      not_admitted: '{staff} ни разу не встретился с клерком, принимающим поставки. То, что они принесли, остаётся снаружи.'
      desync: 'Ослабленные сквозняки невозможно привести в порядок. Когда в конторе отзывают {staff}, на столе остается только разболтавшийся шнур.'
      excerpts:
        p3: 'Когда Сыма Цянь приходит домой через несколько дней, он первым зажигает лампу. Он развязывает верхнюю связку, поднимает лист из-под угла и продолжает писать.'
        p2: 'Еда еще теплая. Он опускает миску между колен и наклоняется, чтобы поесть.'
        p1: 'Прежде чем закроют последнюю пачку, кто-то выворачивает этикетку наружу. Следующий можно найти, не перемещая сначала все остальные.'
    relic: 'Связка бамбуковых планок'
    relic_desc: 'Листочки, перевязанные шнуром, на каждом из которых находится столбец с буквами.'
    points:
      p1: 'Пока Сыма Цянь находится в тюрьме, храните незаконченные наброски его истории в целости и порядке у него дома.'
      p2: 'Принесите в тюрьму еду и одежду и избавьте его от худших унижений тюремщиков.'
      p3: 'Попросите людей, знающих Сыма Цяня, внести свой вклад и представить свое предложение чиновникам до приведения приговора в исполнение.'
    points_fail:
      p1: 'Свертки у него дома расшатываются и разбрасываются, а сквозняков уже нет, когда он выходит. Этот филиал выпадает из истории, и офис отзывает сотрудника.'
      p2: 'В тюрьме до него никто не доходит, и в этой ветке он склоняет голову перед тюремщиками, как он потом написал, что так и сделал.'
      p3: 'Семья бедная, и ни один друг не говорит за него. В этой ветке, как и в истории, он не может искупить свою вину и кастрируется.'
    shift:
      p1:
        was: 'Примерно в 98 г. до н.э., когда Сыма Цянь был заключен в тюрьму после дела Ли Лина, его история, по его собственным словам, только началась и еще не закончилась.'
      p2:
        was: 'Примерно в 98 г. до н. э. Сыма Цянь был заключен в тюрьму за защиту Ли Линя; в своем письме Рен Ану он писал о том, как ему приходилось унижаться перед тюремщиками.'
        now: 'В этом филиале {staff} доставляет Сыма Цяну еду и теплую одежду. У него есть еда и что-то, во что можно завернуться на ночь.'
      p3:
        was: 'Примерно в 98 г. до н.э. Сыма Цянь был приговорен за защиту Ли Линя; его семья была слишком бедна, чтобы искупить приговор, ни один друг не говорил за него, и он был наказан кастрацией.'
        now: 'В этой ветке чиновники принимают оплату, предложенную собравшимися людьми {staff}. Сыма Цянь избавлен от этого наказания и может вернуться к своей незавершенной работе.'
        who: 'sima_qian_changan'
        bio: 'В этот период времени Сыма Цянь отбыл свой приговор и не был кастрирован. Он все же завершил свою историю прошлого вплоть до своего времени.'
    vignettes:
      dates: 'Клерк начинает объединять две записи сроком до одного года. Вы просите их оставить даты в своих отчетах. Становится возможным увидеть, где именно начинается несоответствие.'
      witness: 'Клерк хочет, чтобы сначала была рассказана лучшая история. Вы спрашиваете, как каждый счет попал на стол. Они отмечают происхождение, прежде чем решить, в каком порядке читатель должен видеть.'
      binding: 'Вы оставляете обе квитанции открытыми, пока клерк читает их еще раз. Когда связка завязана, короткая метка сообщает, что один вопрос еще открыт.'
  du_fu_xiang_river:
    name: 'Поэт на борту'
    place: 'река Сянцзян'
    figure: 'Ду Фу'
    story: 'Стихотворение, переданное от имени Ду Фу, озаглавлено как стихи, написанные во время болезни на борту лодки и адресованные друзьям в провинции Хунань. Стихотворение напоминает сцены реки и берега.'
    story_prose:
      opening:
        - 'Вдоль реки Сян, 770 год. Ду Фу адресовал длинное стихотворение из тридцати шести рифм друзьям и родственникам в провинции Хунань. В заголовке говорится, что он написал это во время болезни на борту корабля.'
        - 'Стихотворение и его заголовок сохранились. Как это было доставлено, не уточняется. В этой ветке семье приходилось перемещать страницы несколько раз, и следующая страница не определена.'
        - 'Нужен кто-то, кто может помочь пациенту отдохнуть, кто-то, кто может присмотреть за страницами, и кто-то, кто знает переходы и может запомнить имя получателя.'
      points:
        p3: '{staff} спрашивает Ду Фу, где он хочет остановиться, и находит там человека, желающего нести стихи. По другую сторону лодки Ду Фу медленно говорит ему, кто должен их получить. Мужчина повторяет имя, прежде чем взять пакет. Ду Фу слушает и слегка кивает. Только после этого семья передает завернутые страницы в руки другого мужчины.'
        p1: 'Лодку необходимо очистить, чтобы могли пройти люди. {staff} пересчитывает листы и перемещает их в том порядке, в котором указывает Ду Фу, на доску, защищенную от ветра. Ду Фу тянется к средней странице и зачитывает первые слова. После того, как все перенесено, пространство все еще существует. Ду Фу может вытянуть следующий лист, не прося никого его найти.'
        p2: '{staff} спрашивает, на какой стороне легче лежать, складывает старую ткань, поддерживающую Ду Фу, и перемещает воду туда, где она не будет скользить. Он немного расслабляется и достигает чашки. Лодка движется один раз. Чашка издает звук, но остается вертикально.'
      outcomes:
        all: 'Когда их лодка отходит от пристани, семья возвращает рукопись Ду Фу. Одна копия находится в пределах досягаемости, а другая уже в пути.'
        p3: 'На другой лодке перевозчик сначала находит сухое место для бумаги. Пока лодки проходят, Ду Фу все еще видит уголок ее тканевой обертки.'
        p1: 'Страницы остаются в порядке, где ветер не может до них добраться. После того, как они приземлились, Ду Фу снова вытягивает средний лист.'
        p2: 'Ду Фу некоторое время отдыхает на борту. Чашка по-прежнему находится там, где он может найти ее, не глядя.'
      none: 'Последняя лодка ушла с пристани. Завернутые страницы остаются там, где они были.'
      not_admitted: '{staff} так и не находит лодку. Один за другим протягивают линию мокрых швартовных канатов.'
      desync: 'Несколько средних листьев отсутствуют после перемещения вещей. Когда агентство отзывает {staff}, лодочник все еще держит первый и последний листы.'
      excerpts:
        p3: 'Ду Фу слушает и слегка кивает. Только после этого семья передает завернутые страницы в руки другого мужчины.'
        p1: 'После того, как все перенесено, пространство все еще существует. Ду Фу может вытянуть следующий лист, не прося никого его найти.'
        p2: 'Лодка движется один раз. Чашка издает звук, но остается вертикально.'
    relic: 'Масляная лампа лодочника'
    relic_desc: 'Маленькая глиняная лампада, которая догорала допоздна на протяжении нескольких строк стихов.'
    points:
      p1: 'Оставьте место для страниц Ду Фу на лодке, чтобы можно было собрать длинное стихотворение для друзей в провинции Хунань.'
      p2: 'Вылечите его во время болезни на лодке и облегчите его боль.'
      p3: 'Спросите Ду Фу, где он хочет остановиться в следующий раз, и помогите его семье найти человека, который передаст готовые стихи своим друзьям.'
    points_fail:
      p1: 'После поспешного движения поднимаются только первый и последний листы. Стихотворение не может быть собрано, и офис отзывает сотрудника.'
      p2: 'Он лежит на подушке в зимней лодке, и ему становится хуже с каждым днем.'
      p3: 'Следующая лодка уходит до того, как семья найдет кого-нибудь, кто возьмет стихотворение. Им придется отнести его на другую площадку.'
    shift:
      p1:
        was: 'В 770 году Ду Фу, находясь на лодке, написал стихотворение из тридцати шести рифм для своих друзей и родственников в Хунани, как следует из его названия.'
      p2:
        was: 'В стихотворении Ду Фу своим друзьям в провинции Хунань рассказывается о том, как он писал, будучи больным на борту лодки.'
        now: 'Той зимой он меньше пострадал на лодке.'
      p3:
        was: 'Стихотворение адресовано друзьям в провинции Хунань. В заголовке не указано, как оно дошло до них.'
        now: 'В этой ветке семья делает остановку по выбору Ду Фу. Кто-то на лестничной площадке предлагает взять копию стихов и может повторить имя человека, который ее получит.'
    vignettes:
      shore: 'Путешественник пишет, что берег выглядит мрачным. Вы спрашиваете, что заставило их поднять глаза от лодки. Они делают паузу, затем записывают одну вещь, которая на самом деле там была.'
      delivery: 'Вы слышите, что следующая лодка идет лишь на полпути к городу друга. Путешественник почти складывает записку, на которой нет второго имени. Вы помогаете им найти кого-то, кто сможет продолжить дело.'
      damp: 'Путешественник устанавливает записку там, где на доску попали брызги. Вы подкладываете под него сухой клочок бумаги, пока они заканчивают писать поздравление.'
  vesalius_padua:
    name: 'Две версии иллюстрации'
    place: 'Регенсбург'
    figure: 'Андреас Везалий'
    story: 'В письме, написанном в Регенсбурге в 1546 году, Везалий раскритиковал издание, скопировавшее и сократившее его иллюстрации. Он возражал против искажений в некоторых скопированных рисунках.'
    story_prose:
      opening:
        - 'Регенсбург, июнь 1546 года. Везалий пишет коллеге о другой книге, в которой были скопированы его иллюстрации. Он возражает против уменьшения масштаба и ставит под сомнение ход некоторых его линий.'
        - 'В истории его письмо сохранило эти возражения. Позднее сравнение показало, что не каждое возражение соответствует существенной разнице. В этом филиале у продавца книг все еще есть стопка экземпляров, которые нужно разослать.'
        - 'Кто-то, кто может узнать эти два издания, может помочь. Также потребуется кто-то, кто сможет убедить продавца книг вставлять одну и ту же заметку в каждый экземпляр перед его отправкой.'
      points:
        p1: '{staff} раскладывает оба издания на прилавке, отмечая, где цифра просто меньше, а где Везалий высказал конкретное возражение. Книготорговец спрашивает, какие утверждения можно выдвигать с уверенностью. Они вычеркивают то, что не было проверено, оставляя номера страниц, которые читатель может найти. Книготорговец открывает верхний экземпляр и кладет записку рядом с тарелкой. Когда книга закрывается, тонкий белый край все еще виден.'
      outcomes:
        all: 'После выхода книг один читатель берет другое издание, используя номера страниц на бланке. Обе фигуры лежат на столе, на них лежит одна и та же ручка.'
        p1: 'После выхода книг один читатель берет другое издание, используя номера страниц на бланке. Обе фигуры лежат на столе, на них лежит одна и та же ручка.'
      none: 'Книготорговец завязывает последнюю связку. Наполовину написанный бланк все еще лежит под прилавком.'
      not_admitted: '{staff} никогда не видит продавца книг. Образец лежит открытым на тарелке, и его на мгновение переворачивает покупатель, проходящий мимо прилавка.'
      excerpts:
        p1: 'Книготорговец открывает верхний экземпляр и кладет записку рядом с тарелкой. Когда книга закрывается, тонкий белый край все еще виден.'
    relic: 'Доказательство с двумя отметками'
    relic_desc: 'Воображаемый отпечаток с отдельными пометками для двух изданий.'
    points:
      p1: 'Попросите продавца книг приложить примечание, идентифицирующее спорные номера, к экземплярам, которые все еще имеются на складе.'
    points_fail:
      p1: 'Сотрудник не договорился с дистрибьютором, и копии ушли без этого листа.'
    shift:
      p1:
        was: '13 июня 1546 г.: Везалий написал из Регенсбурга и раскритиковал то, что он посчитал искажением скопированных цифр.'
        now: '{staff} просит дистрибьютора приложить лист с указанием спорных номерных знаков и указанием читателям на оригиналы.'
        who: 'vesalius_padua'
        bio: 'Читатели скопированного издания получили примечание с указанием цифр, которые оспаривал Везалий.'
  shakespeare_globe:
    name: 'Весть для отца'
    place: 'Стратфорд-на-Эйвоне'
    figure: 'Уильям Шекспир'
    story: 'В Стратфордском реестре зафиксировано захоронение Хамнета Шекспира 11 августа 1596 года. В нем не указано, где находился его отец до похорон. В этой ветке домохозяйство просит помочь передать ему сообщение.'
    story_prose:
      opening:
        - 'Стратфорд-на-Эйвоне, август 1596 года. В приходской книге сохранится имя мальчика и дата его похорон. Хэмнету одиннадцать.'
        - 'Исторически Хамнет был похоронен 11 августа. В реестре не указана дата возвращения его отца. В этой ветке домочадцы складывают письмо и надеются, что кто-нибудь заберет его до наступления темноты.'
        - 'Здесь может помочь тот, кто знает, где останавливаются путешественники. То же самое может сделать тот, кто сможет убедить незнакомца пойти с письмом немного дальше.'
      points:
        p1: '{staff} дважды спрашивает у двери, прежде чем найти посланника, который знает, где остановиться дальше. Посыльный читает имя на внешней стороне и кладет его в сухой внутренний карман. Хэмнет все еще не спит, когда Уильям возвращается домой. Мальчик отодвигается, чтобы освободить место для отца на краю кровати.'
      outcomes:
        all: 'Уильям сидит там, пока окно не темнеет. Когда он встает за водой, он пододвигает стул поближе, чтобы найти его на обратном пути.'
        p1: 'Уильям сидит там, пока окно не темнеет. Когда он встает за водой, он пододвигает стул поближе, чтобы найти его на обратном пути.'
      none: 'Сумерки достигают дверного проема. Сложенное письмо все еще находится под чашкой.'
      not_admitted: '{staff} никогда не попадает в дом, где их ждут. Кто-то проходит мимо двери. Он не открывается.'
      excerpts:
        p1: 'Хэмнет все еще не спит, когда Уильям возвращается домой. Мальчик отодвигается, чтобы освободить место для отца на краю кровати.'
    relic: 'Свернутое сообщение'
    relic_desc: 'Воображаемое письмо с местом, где предъявитель может добавить имя следующего человека, который сможет помочь.'
    points:
      p1: 'Найдите кого-нибудь, кто сможет связаться с Шекспиром и передать ему послание от семьи ко времени визита.'
    points_fail:
      p1: 'Сотрудник не нашел никого, кто мог бы пообещать доставить сообщение вовремя.'
    shift:
      p1:
        was: '11 августа 1596 года: Хэмнет Шекспир был похоронен в Стратфорде-на-Эйвоне. В реестре не записано, был ли с ним заранее отец.'
        now: '{staff} находит посланника, который может связаться с Шекспиром. В этом филиале он приходит домой вовремя, чтобы провести вечер с сыном.'
        who: 'shakespeare_globe'
        bio: 'Уильяму Шекспиру удалось провести вечер с Хэмнетом незадолго до смерти сына.'
  timbuktu_sankore:
    name: 'Место в уходящем караване'
    place: 'Тимбукту, Мали'
    figure: 'Учёные Тимбукту'
    story: 'После того, как Тимбукту перешел из рук в руки около 1468 года, ученые покинули город и отправились в такие места, как Валата. В этом филиале одной семье нужно место, а группа планирует уехать вместе.'
    story_prose:
      opening:
        - 'Около 1468 года Тимбукту перешел из рук в руки. Более поздний летописец вспоминал, как образованные семьи покидали город, а некоторые направлялись в Валату.'
        - 'В истории летопись фиксировала уходящие группы. В этом филиале одно домохозяйство уже собирает вещи, но несколько мешков с водой еще не промаркированы. Они не знают, какая сторона будет ждать.'
        - 'Кто-то, кто понимает, как организуется путешествующая компания, может помочь. Им предстоит узнать, кого еще ждут, и пройти первый этап вместе с семьей.'
      points:
        p1: '{staff} ходит от одной вечеринки к другой, пока гид не согласится подождать, а затем возвращается, чтобы помочь домочадцам пересчитать воду и свертки. На первой остановке другая семья разворачивает коврик. Самый маленький ребенок приносит самый маленький мешок с водой в семье и кладет его между двумя ковриками. Когда ребёнок убирает руки, бурдюк остаётся стоять.'
      outcomes:
        all: 'На следующее утро две циновки, стоящие рядом друг с другом, свернуты. Сначала передают небольшую сумку, а затем кто-то поднимает ребенка.'
        p1: 'На следующее утро две циновки, стоящие рядом друг с другом, свернуты. Сначала передают небольшую сумку, а затем кто-то поднимает ребенка.'
      none: 'К тому времени, когда кто-то возвращается и спрашивает, последняя группа уже ушла. Домочадцы выносят связанные узлы обратно через дверь.'
      not_admitted: '{staff} не находит дом. Возле двери кто-то складывает вместе два мешка с водой.'
      excerpts:
        p1: 'Самый маленький ребенок приносит самый маленький мешок с водой в семье и кладет его между двумя ковриками. Когда ребёнок убирает руки, бурдюк остаётся стоять.'
    relic: 'Запись о числе бурдюков'
    relic_desc: 'Воображаемый счетчик, используемый для подсчета мешков с водой, переданных в домашнее хозяйство.'
    points:
      p1: 'Найдите место для одной семьи с отправляющимся караваном и сопроводите их до первой безопасной остановки.'
    points_fail:
      p1: 'Группа ушла до того, как сотрудник успел обустроить место для домочадцев.'
    shift:
      p1:
        was: 'Около 1468 года: после того, как Тимбукту перешел из рук в руки, ученые бежали. Некоторые отправились в Валату.'
        now: '{staff} помогает одной семье присоединиться к группе, направляющейся в сторону Валаты, и сопровождает ее до первой безопасной остановки.'
        who: 'timbuktu_sankore'
        bio: 'Одна семья, покидающая Тимбукту, нашла группу, с которой отправилась путешествовать, и благополучно добралась до своей первой остановки.'
  al_haytham_cairo:
    name: 'Комната на другом берегу'
    place: 'Фустат'
    figure: 'Ибн аль-Хайсам'
    story: 'Фустат пострадал от пожара во время волнений в 1020 году. Оптические работы Ибн аль-Хайсама принадлежали годам его пребывания в Египте. В этом филиале он встречает читателя, у которого на одной из пострадавших улиц есть одолженная оптическая рукопись.'
    story_prose:
      opening:
        - 'Фустат, 1020 г. В хрониках описаны пожары, в результате которых были уничтожены дома и имущество. За годы своего пребывания в Египте Ибн аль-Хайсам изучал, как свет достигает глаза.'
        - 'В истории дома гибли при пожарах. Источники не помещают Ибн аль-Хайсама на конкретную улицу. В этой ветке на одной из пострадавших улиц проживает читатель, с которым он планировал просмотреть несколько страниц.'
        - 'Тот, кто может сохранять ясную голову и давать указания, может помочь. Рукопись можно будет прочитать позже. Сначала выясните, сможет ли читатель дойти до конца улицы.'
      points:
        p1: 'Когда {staff} находит читателя, свет за его дверью уже погас. Он хочет вернуться на другую страницу. {staff} просит его достать стопку и уйти той дорогой, которую очистили соседи. В доме, где его можно разместить, он сидит с неровной стопкой на коленях. Лист соскальзывает на пол. Сидящий напротив поднимает его и кладёт туда, куда указывает Ибн аль-Хайсам.'
      outcomes:
        all: 'Ибн аль-Хайсам приходит к нему позже. В доме есть только один табурет, поэтому они вдвоем садятся за низкий столик и снова ищут страницу.'
        p1: 'Ибн аль-Хайсам приходит к нему позже. В доме есть только один табурет, поэтому они вдвоем садятся за низкий столик и снова ищут страницу.'
      none: 'Улица в конце концов закрывается. Когда Ибн аль-Хайсам спрашивает, все, что он может сделать, это сложить квитанцию с записью ссуды себе в руку.'
      not_admitted: '{staff} ждет в дальнем конце улицы, пока кто-нибудь покажет дорогу. Голос призывает закрыть дверь, но вскоре его уже невозможно услышать.'
      excerpts:
        p1: 'Лист соскальзывает на пол. Сидящий напротив поднимает его и кладёт туда, куда указывает Ибн аль-Хайсам.'
    relic: 'Запасной комплект листов'
    relic_desc: 'Вымышленный комплект записей по оптике, переданный другой семье в этой ветви событий.'
    points:
      p1: 'Вытащите читателя, прежде чем огонь достигнет улицы, и найдите безопасное место для взятой напрокат рукописи.'
    points_fail:
      p1: 'Сотрудник не успел вовремя связаться с читателем, чтобы помочь ему уйти с заимствованными страницами.'
    shift:
      p1:
        was: '1020: части Фустата были подожжены во время беспорядков. В записях не сказано, где в тот день находился Ибн аль-Хайсам и его рукописи.'
        now: '{staff} переносит читателя в дом за пределами пострадавших улиц. Ибн аль-Хайсам может продолжить чтение рукописи вместе с читателем.'
        who: 'al_haytham_cairo'
        bio: 'Во время пожаров в Фустате читатель и вверенные ему страницы достигли безопасности.'
  li_bai_changan:
    name: 'Весть у реки'
    place: 'Ушань на Янцзы'
    figure: 'Ли Бо'
    story: 'Ли Бо был приговорен к ссылке в Елан и по дороге помилован. В одном из собраний его сочинений помилование связывается с Ушанем. Точный день, когда он услышал, неизвестен.'
    story_prose:
      opening:
        - 'Высадка возле Ушаня, около 759 года. Ли Бо движется вверх по реке, направляясь в изгнание в Елан. В отчетах о его путешествии этот участок реки позже будет связан с его помилованием.'
        - 'В истории прощение произошло еще до того, как он достиг Елана. День, когда он услышал, не установлен. В этой ветке путешественник принес письменную копию новостей, пока следующая лодка, идущая вверх по течению, еще загружается.'
        - 'Для этой поездки нужен кто-то, кто знает лодки и их остановки. Кто-то должен выяснить, кто видел оригинал и где он был скопирован, прежде чем передать новость в руки Ли Бая.'
      points:
        p1: 'Спросив посланника, который дал ему копию, {staff} находит пассажира, который знает руку этого человека, и ждет согласия счетов, прежде чем спешить на площадку со страницей. Ли Бо разворачивает его и дважды читает последнюю строчку. Когда команда зовет пассажиров, он скатывает подстилку уже в идущей вверх по течению лодке и передает ее лодочнику, идущему в другую сторону.'
      outcomes:
        all: 'Когда лодка, идущая вниз по течению, обходит пристань, Ли Бо снова складывает копию. Его рукав все еще мокрый. Прикрывает складку сухой стороной.'
        p1: 'Когда лодка, идущая вниз по течению, обходит пристань, Ли Бо снова складывает копию. Его рукав все еще мокрый. Прикрывает складку сухой стороной.'
      none: 'Лодка, идущая вверх по течению, уже далеко, когда кто-то приносит новости к ее причалу. Рядом с причальной стойкой лежит кусок соломенной веревки.'
      not_admitted: '{staff} никогда не добирается до лодки. Навесы расположены достаточно близко друг к другу, чтобы было слышно, как внутри них собираются люди.'
      excerpts:
        p1: 'Ли Бо разворачивает его и дважды читает последнюю строчку. Когда команда зовет пассажиров, он скатывает подстилку уже в идущей вверх по течению лодке и передает ее лодочнику, идущему в другую сторону.'
    relic: 'Сухая обёртка для письма'
    relic_desc: 'Воображаемая обертка, которую пассажир лодки может оставить сухой на реке.'
    points:
      p1: 'Получите подтвержденные новости о помиловании Ли Бая, прежде чем его лодка продолжит движение вверх по течению.'
    points_fail:
      p1: 'Сотрудник не успел сообщить новость до того, как лодка отправилась в путь.'
    shift:
      p1:
        was: 'Около 759 г.: Ли Бо был помилован по дороге в Елан. В послесловии к его собранию сочинений он упоминается в то время недалеко от Ушаня.'
        now: '{staff} приносит новости на лестничную площадку перед следующим вылетом. Ли Бо возвращается с утренней лодкой вниз по течению.'
        who: 'li_bai_changan'
        bio: 'Ли Бо узнал о своем помиловании еще до отбытия следующего корабля и смог повернуть обратно раньше.'
  li_shizhen_qizhou:
    name: 'Оттиск, который он ещё может прочесть'
    place: 'Цичжоу'
    figure: 'Ли Шичжэнь'
    story: 'Ли Шичжэнь в течение многих лет пересматривал «Сборник Материи медики». Издание «Цзинлин» появилось после его смерти. В этой ветке принтер может отправить ему одну пробную страницу.'
    story_prose:
      opening:
        - 'Цичжоу, около 1592 года. Ли Шичжэнь потратил годы на пересмотр «Сборника Материи медики». Книга, которую он может открыть и при этом изменить сам, — это его рукопись.'
        - 'В истории полное издание Цзиньлина появилось уже после его смерти. В этой ветке принтер вычеркнул пробную страницу. Сможет ли он достичь Цичжоу из Цзиньлина, еще предстоит выяснить.'
        - 'Здесь может помочь тот, кто разбирается в печати или корректуре. Каждый конец должен знать, кто будет читать лист и кто принесет его обратно после того, как он будет помечен.'
      points:
        p1: '{staff} соглашается с типографией отправить только один лист, поручает его путешественнику, который курсирует между двумя местами, и организует его получение на обратном пути. Ли разкладывает корректуру и рукопись рядом и прикладывает ноготь к нужной строке. Он пишет символ на полях и ждет, пока он высохнет, прежде чем сложить два листа по отдельности.'
      outcomes:
        all: 'Путешественник возвращается на следующий день. Ли протягивает сухой лист, его палец все еще лежит на исправленном иероглифе.'
        p1: 'Путешественник возвращается на следующий день. Ли протягивает сухой лист, его палец все еще лежит на исправленном иероглифе.'
      none: 'Никаких доказательств не приходит. Ли меняет символ в своей рукописи и отодвигает чернила дальше от края бумаги.'
      not_admitted: '{staff} никогда не встречал никого, кто мог бы предоставить доказательства. Через дверь магазина проходят пачки бумаг, на каждой из которых указан свой адрес.'
      excerpts:
        p1: 'Ли разкладывает корректуру и рукопись рядом и прикладывает ноготь к нужной строке. Он пишет символ на полях и ждет, пока он высохнет, прежде чем сложить два листа по отдельности.'
    relic: 'Пробный оттиск'
    relic_desc: 'Вымышленный пробный оттиск, на котором ещё есть место для авторских пометок.'
    points:
      p1: 'Заставьте принтер отправить одну пробную страницу в Цичжоу, пока Ли Шичжэнь еще может ее проверить.'
    points_fail:
      p1: 'Сотрудник не позаботился о том, чтобы доказательства были доставлены к нему вовремя.'
    shift:
      p1:
        was: 'К 1596 году: издание «Цзинлин» появилось после смерти Ли Шичженя. Он не дожил до того, чтобы увидеть полную книгу в печати.'
        now: '{staff} защищает одну пробную страницу. Ли Шичжэнь читает его за своим столом и отправляет обратно с исправлением на полях.'
        who: 'li_shizhen_qizhou'
        bio: 'Ли Шичжэнь увидел и пометил одну печатную версию своей книги до того, как появилось полное издание.'
  bose_calcutta:
    name: 'Чек, который он не хотел обналичивать'
    place: 'Калькутта'
    figure: 'Джагадиш Чандра Бос'
    story: 'В 1885 году Бозе начал преподавать физику в Президентском колледже. Его зарплата была ниже той, которую предлагали европейским коллегам. Он продолжал преподавать и во время спора отказался от более низкой зарплаты.'
    story_prose:
      opening:
        - 'Калькутта, 1885 год. Бозе преподает физику в Президентском колледже. Колледж предлагает ему меньше, чем европейским коллегам, выполняющим ту же работу. Он продолжает преподавать.'
        - 'В истории прошло около трёх лет, прежде чем спор был разрешен. В этом отделении еще не собрана первая сумма, и у конторы еще есть время выписать другой чек.'
        - 'Здесь будет полезен тот, кто умеет читать условия заработной платы. Также нужен кто-то, кто сможет убедить человека, ответственного за подпись, услышать, как сравниваются два учебных задания.'
      points:
        p1: '{staff} помещает неделю занятий и оба набора условий заработной платы на одной странице, а затем вместе с Бозе ждет в офисе, пока будет снесена бухгалтерская книга. Как только новые термины написаны, Бозе пальцем следует за числом. Чек снова попадает на стол. На этот раз он берет его обеими руками.'
      outcomes:
        all: 'Когда Бозе возвращается в класс, демонстрация еще не началась. Он кладет чек в карман и сначала освобождает место для учеников.'
        p1: 'Когда Бозе возвращается в класс, демонстрация еще не началась. Он кладет чек в карман и сначала освобождает место для учеников.'
      none: 'Офис снова отправляет первоначальную сумму. Бозе смотрит на него и швыряет бумагу обратно через стойку.'
      not_admitted: '{staff} никогда не попадает в комнату, где подписывают условия. Урок заканчивается в другом конце коридора, и доски скрипят под ногами.'
      excerpts:
        p1: 'Чек снова попадает на стол. На этот раз он берет его обеими руками.'
    relic: 'Квитанция о зарплате'
    relic_desc: 'Воображаемая квитанция за первый чек, который он согласился получить в этой ветви событий.'
    points:
      p1: 'Получите письменное предложение о равной оплате труда Бозе в течение его первого года преподавания.'
    points_fail:
      p1: 'Сотруднику не удалось обеспечить равные условия в течение первого года, и Bose продолжала отказываться от более низкой заработной платы.'
