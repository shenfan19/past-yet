  gaudi_barcelona:
    name: 'Под колёсами трамвая'
    place: 'Барселона'
    figure: 'Антони Гауди'
    story: 'Вечером 7 июня 1926 года семидесятитрехлетний Антони Гауди был сбит трамваем на Гран-Виа в Барселоне. Без документов и в штатском его приняли за нищего, а пойманные такси не останавливались. Он умер в больнице 10 июня и был похоронен 12 июня под зданием, которым руководил сорок три года. Руководство работами взял на себя Доменек Суграньес. 20 июля 1936 года мастерская была подожжена, большая часть рисунков и гипсовых моделей пропала.'
    story_prose:
      opening:
        - 'Барселона, конец мая 1926 года. Каталонский архитектор Антони Гауди, семидесяти трех лет, отдал свои последние годы жизни великолепному зданию в городе, которое до сих пор не достроено. В его проектах используются кривые, взятые из натуры, а мастерская на сайте полна рисунков и гипсовых моделей. В прошлом году была построена первая колокольня восточного фасада.'
        - 'По истории, вечером 7 июня его сбил трамвай на Гран-Виа. У него не было документов, и он был просто одет, поэтому его приняли за нищего и оставили лежать; пойманные такси не останавливались, пока гражданская охрана не заставила его отвезти в диспансер, а оттуда его перевезли в больницу, где он скончался 10 июня. Руководство работами взял на себя его ученик Доменек Суграньес. Десять лет спустя, 20 июля 1936 года, мастерская сгорела, и большая часть находившихся в ней рисунков и гипсовых моделей пропала. В этой ветке кондуктор трамвая на Гран Виа любит свой колокольчик, молодой каменщик на площадке гудит вместе с ветром, а в полдень приходит женщина продавать воду.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто знает медицину и носит с собой аптечку, кто-то добрый или бдительный, с сильным телом, или кто-то, несущий с собой средства для заживления ран, чтобы немедленно доставить его в больницу с трамвайных путей; кто-то, кто работал плотником или вел архивы, или кто-то умелый и методичный, чтобы правильно передать незавершенную работу и ключи от мастерской; и такой же человек, обладающий немного большим умом или волей, чтобы убедить Суграньеса оставить фотографии, размеры и рисунки ключевых моделей на втором месте.'
      outcomes:
        all: 'Тем летом Гауди вернулся в мастерскую. Через десять лет шкафы сгорели, и кто-то принес со второго места альбом и перевернул фотографию модели; На оборотной стороне был написан масштаб того года.'
        p3: 'Тем летом Гауди вернулся в мастерскую. Он сидел на низком табурете у двери и смотрел, как работают каменщики, а днем ветер проходил через проемы башни и свистел.'
        p2: '12 июня Гауди был похоронен. Десять лет спустя мастерская сгорела, и со второго места кто-то принес альбом, масштаб того года все еще написан на оборотах фотографий.'
        p1: '12 июня Гауди был похоронен. Суграньес взял на себя руководство работами, молотки на объекте не останавливались, и каменщики продолжали строить по этому списку.'
      none: '12 июня Гауди был похоронен. Десять лет спустя, 20 июля 1936 года, мастерская сгорела, а большая часть рисунков и гипсовых моделей, находившихся в ее шкафах, пропала.'
      desync: '10 июня каменщики все утро ждали у дверей мастерской; никто не знал, у кого ключи, и никто не мог сказать, какая работа предстоит. Когда {staff} был отозван, молодой каменщик сидел на еще не установленном на месте камне и ждал, пока кто-нибудь его позовет.'
      not_admitted: '{staff} так и не попал на сайт и лишь несколько раз проехал на трамваях Гран Виа. Вдали, среди строительных лесов, стояла колокольня, и в ветреные дни по нескольким улицам доносился слабый свист.'
      points:
        p3:
          class_medical: 'Вечером 7 июня трамвай резко тормозит на Гран-Виа между улицами Байлен и Жирона. У рельсов лежит старик в поношенной одежде; несколько человек собираются, смотрят и отступают. {staff}, знающий медицину, через минуту становится рядом с ним на колени, надавливает на рану и устойчиво держит голову, и поднимает глаза, чтобы рассказать окружающим, кто он: это Гауди, архитектор с этого места. Подъезжает такси. Когда машина трогается с места, {staff} одной рукой держит голову, а другой — дверь. Позади них трамвай звонит один раз и медленно трогается с места.'
          trait_kind: 'Вечером 7 июня трамвай резко тормозит на Гран-Виа между улицами Байлен и Жирона. У рельсов лежит старик в поношенной одежде; несколько человек собираются, смотрят и отступают. {staff}, добрый и неспособный оставить старика, лежащего на дороге, через минуту становится на колени рядом с ним, устойчиво держа его голову, и смотрит вверх, чтобы рассказать окружающим, кто он: это Гауди, архитектор с этого места. Подъезжает такси. Когда машина трогается с места, {staff} одной рукой держит голову, а другой — дверь. Позади них трамвай звонит один раз и медленно трогается с места.'
