    shift:
      p1:
        was: '4 ноября 1899 года «Толкование снов» появилось в Вене первым тиражом в 600 экземпляров, датированным 1900 годом. На продажу ушло восемь лет.'
        now: '{staff} раздает копии нескольким коллегам, которые той зимой прочитали книгу целиком. Письма и споры по этому поводу начались годами раньше, и первая печать не заставила себя ждать восемь лет.'
        who: 'freud_vienna'
        bio: 'Книга Фрейда о снах нашла серьезных читателей уже в первый год своего существования. Дискуссия, которую он ждал годы, началась зимой 1899 года.'
    vignettes:
      window: '{staff} долго стоит у витрины книжного магазина в центре города. В углу лежит новая книга о снах, открытая на титульном листе с надписью «1900 год». Ассистент выходит, чтобы протереть стекло, и говорит, что оно считается новым только в следующем году; пока что он сохраняет свое место в тепле.'
      cafe: '{staff} снимает газеты со стойки в кофейне и просматривает каждую колонку обзоров; книги нет ни в одном из них. Доктор за соседним столиком говорит, что ни у кого нет времени читать триста страниц о снах, и заказывает еще кофе, чтобы закончить работу.'
      snow: 'В конце декабря идет снег. {staff} помогает мальчику из книжного магазина расчистить дверной проем, и мальчик, перелистывая книгу заказов холодными пальцами, говорит, что сонник почти не двигался в этом месяце, и спрашивает, лучше ли сны продаются летом.'
  cajal_barcelona:
    name: 'Нервные клетки как отдельные единицы'
    place: 'Барселона'
    figure: 'Сантьяго Рамон-и-Кахаль'
    story: 'С конца 1887 года Сантьяго Рамон-и-Кахаль возглавлял кафедру гистологии в Барселоне. В мае 1888 года он оплатил первый номер своего журнала и разослал большую часть его немногочисленных экземпляров зарубежным исследователям, которые редко читали по-испански. В октябре 1889 года он за свой счет отправился на собрание Немецкого анатомического общества в Берлине и показал свои препараты под микроскопом; К его работе приступил Альберт фон Кёлликер, старший гистолог. В 1906 году он разделил Нобелевскую премию с Камилло Гольджи.'
    story_prose:
      opening:
        - 'Барселона, осень 1889 года. Сантьяго Рамон-и-Кахаль преподает гистологию в университете и изучает ветви нервных клеток на окрашенных серебром срезах. Годом ранее он заплатил из собственного кармана за первый номер своего журнала, около шестидесяти экземпляров, большая часть которых была отправлена за границу.'
        - 'В истории зарубежные коллеги редко читают по-испански, и его статьи не привлекали особого внимания. 26 сентября он получил разрешение на поездку, сам увеличил стоимость проезда до Берлина и в октябре поместил свои препараты под микроскоп на заседании Немецкого анатомического общества; с тех пор Кёлликер поддерживал его. В этом филиале студент в лаборатории наблюдает за банкой с тканью, пропитанной дихроматом калия, и пришел на вокзал, чтобы узнать цену на билет до Берлина.'
        - 'В этой поездке могут помочь два типа людей: кто-то, кто умеет держать счета и слайды в порядке и придерживаться графика, и кто-то, кто знает иностранные языки, может найти переводчика и может убедить людей помочь.'
      outcomes:
        all: 'В октябре в конференц-зале Берлина выстроилась очередь к микроскопу. Мужчина, стоявший впереди, держал несколько переведенных страниц.'
        p2: 'С тех пор каждый конверт, отправляемый Кахалем за границу, содержал внутри переведенный набор подписей.'
        p1: 'В октябре в конференц-зале в Берлине Кахаль поднес срез под микроскоп, отступил на шаг и попросил людей посмотреть.'
      none: 'В лаборатории в Барселоне пакеты со слайдами все еще лежали сложенными в деревянном ящике и никогда не покидали стола.'
      desync: 'К концу месяца стоимость проезда все еще была низкой, а горки еще не были заполнены. Когда {staff} был отозван, Кахаль вкладывал письменный отчет в конверт и отправлял его в Берлин.'
      not_admitted: '{staff} никогда не попадал в эту лабораторию. Слайды все еще лежали на столе, а день Берлина приближался.'
      points:
        p1: '26 сентября отпуск на выезд был получен, но ему пришлось оплатить проезд. {staff} перечислил на листе каждую сумму, на которую можно было рассчитывать, затем рассортировал слайды по пакетам по номерам, завернул каждый пакет в мягкую бумагу и упаковал их в деревянный ящик с перегородками. Счета сравнялись, и замок на корпусе щелкнул. Кахаль положил чемодан на колени и держал его в руках всю дорогу до поезда, идущего в Берлин.'
        p2:
          class_lettered: 'Как это делают переводчики, {staff} вместе с Кахалем просматривал рисунки один за другим, помещая под каждым подпись на немецком языке и в каждом месте спрашивая, как следует называть каждое волокно, прежде чем записывать его. После того как короткая статья была полностью скопирована, ее сначала передали нескольким коллегам, желающим сверить ее со слайдами. В Берлине его уже ждали у микроскопа с этими несколькими страницами в руках.'
          else: '{staff} нашел в городе переводчика, знавшего немецкий язык, убедил его отложить собственную работу и усадил его с Кахалем, чтобы тот просматривал рисунки один за другим, ставя под каждым подпись на немецком языке. После того как короткая статья была полностью скопирована, ее сначала передали нескольким коллегам, желающим сверить ее со слайдами. В Берлине его уже ждали у микроскопа с этими несколькими страницами в руках.'
      excerpts:
        p2: 'После того как короткая статья была полностью скопирована, ее сначала передали нескольким коллегам, желающим сверить ее со слайдами. В Берлине его уже ждали у микроскопа с этими несколькими страницами в руках.'
        p1: 'Счета сравнялись, и замок на корпусе щелкнул. Кахаль положил чемодан на колени и держал его в руках всю дорогу до поезда, идущего в Берлин.'
    relic: 'Перо для тонких рисунков'
    relic_desc: 'Ручка настолько тонкая, что рисовала каждую веточку нейрона.'
    points:
      p1: 'Соберите фонды и слайды после прекращения государственного финансирования и защитите демонстрацию Кахаля в Берлине.'
      p2: 'Найдите соавтора, который переведет иллюстрированные заметки, чтобы иностранные коллеги могли проверить их перед встречей.'
    points_fail:
      p1: 'Он не может совершить поездку за свой счет и отправляет только письменный отчет. Филиал рассинхронизируется, и офис отзывает сотрудника.'
      p2: 'Читатели за границей начинают искать испанские отчеты только после Берлина, и им все равно приходится писать одно за другим за разъяснениями.'
    shift:
      p1:
        was: '26 сентября 1889 года Кахаль получил отпуск, оплатил поездку и в октябре продемонстрировал слайды на встрече в Берлине.'
      p2:
        was: 'В 1889 году Кахаль сообщил, что его испанские газеты не привлекали особого внимания за рубежом до того, как демонстрация в Берлине помогла распространить его результаты.'
        now: '{staff} просит переводчика сверить записку Кахаля с цифрами, а затем отправляет ее коллегам, желающим изучить слайды. После встречи Кахаля регулярно распространяются иллюстрации и тексты.'
        who: 'cajal_barcelona'
        bio: 'Во время пребывания в Барселоне Кахаль наладил регулярное сотрудничество в области переводов. Он мог найти читателей за рубежом, готовых проверить его слайды, когда он рассылал последующие статьи.'
    vignettes:
      stain: '{staff} помогает студенту бросать небольшие кусочки ткани в банку с дихроматом. Студент говорит, что эта банка будет стоять нетронутой до следующей недели, и любой, кто откроет ее и осмотрит, будет вынужден сам разрезать следующие сто частей.'
      ticket: '{staff} идет со студентом на вокзал узнать стоимость проезда до Берлина. Клерк называет, студент свистит и на обратном пути подсчитывает на пальцах, сколько номеров журнала он бы напечатал.'
      rain: 'В ноябре в Барселоне идут дожди. {staff} помогает ученику принести стопку тарелок, сохнущих на подоконнике. Ученик пересчитывает их дважды, прежде чем позволить ставню закрыться.'
  hammurabi_babylon:
    name: 'Закон, высеченный в камне'
    place: 'Вавилон'
    figure: 'Хаммурапи'
    story: 'Примерно в 1754 году до нашей эры, в конце правления Хаммурапи, была установлена базальтовая стела с вырезанными на ней почти тремястами законами, и писцы веками копировали ее законы на глиняные таблички. В двенадцатом веке до нашей эры стелу перевезли в Сузы, а несколько колонок ее текста соскоблили. Французская экспедиция раскопала его в Сузах в 1901 году; сейчас он находится в Лувре, и глиняные копии вернули часть того, что было соскоблено.'
    story_prose:
      opening:
        - 'Вавилон, около 1754 г. до н.э. В конце правления Хаммурапи на базальтовой стеле вырезана пролог, около 282 законов о собственности, торговле, семье и труде, а также эпилог. В эпилоге говорится, что человек, с которым поступили несправедливо, может предстать перед камнем и услышать слова камня. Книжники записывают законы на глиняные таблички и передают их из поколения в поколение.'
        - 'Исторически сложилось так, что в двенадцатом веке до нашей эры эламский царь Шутрук-Наххунте перенес стелу в Сузы, и несколько колонн у подножия ее лица позже были отшлифованы до гладкости; Глиняные копии вернули около тридцати пропавших законов, а что написано в остальных, до сих пор неизвестно. В этом филиале подмастерье в доме писцов месит глину и сушит скрижали, а лодочник на Евфрате не умеет читать.'
        - 'В этой поездке могут помочь несколько типов людей: тот, кто привык работать за столом и может поймать пропущенную очередь; умелый мастер, умеющий нарезать тростник и нажимать знаки; кто-то достаточно дотошный, чтобы проверять столбец за столбцом, или кто-то в очках, которые подчеркивают детали камня.'
      outcomes:
        p1: 'Более трех тысяч лет спустя рядом с этим гладким камнем была положена табличка, упавшая в другом городе. Кто-то прочитал его построчно вдоль клиньев, поскольку законов в камне уже не было.'
      none: 'Таблички все еще сохли на крыше, а ученик все еще пересчитывал их одну за другой. Столетия спустя стелу унесли, а колонны у ее подножия сравняли с землей, и под рукой не осталось ничего, что можно было бы ощутить.'
      not_admitted: '{staff} так и не проник в дом писцов и помог лодочнику выгрузить несколько мешков с ячменем по Евфрату. Пересчитывая мешки, лодочник снова заговорил о королевском камне, хотя и не смог прочитать ни следа.'
      points:
        p1:
          class_lettered: 'В комнате была разложена дюжина табличек из свежей глины: писец намеревался несколько раз переписать весь текст с камня и отправить копии на хранение в другие города. {staff}, привыкший работать за столом, считал строки каждой готовой таблички по мастеру сверху, а там, где была пропущена строка, разглаживал ее, пока глина была мягкой, и писал снова. Писец прокатал цилиндрическую печать по краю последней таблички, оставив полосу крошечных фигурок и знаков. Ученик сложил таблетки одну за другой в корзину, выстланную соломой, завязал ей рот и вместе с лодочником отнес ее к лодке на реке.'
          class_craft: 'В комнате была разложена дюжина табличек из свежей глины: писец намеревался несколько раз переписать весь текст с камня и отправить копии на хранение в другие города. {staff}, твердо держа руку, срезал скошенные кончики на нескольких тростях, опробовал каждый на клочке глины, отдал самый острый писцу, а также отжал у мастера целую табличку. Писец прокатал цилиндрическую печать по краю последней таблички, оставив полосу крошечных фигурок и знаков. Ученик сложил таблетки одну за другой в корзину, выстланную соломой, завязал ей рот и вместе с лодочником отнес ее к лодке на реке.'
          else: 'В комнате была разложена дюжина табличек из свежей глины: писец намеревался несколько раз переписать весь текст с камня и отправить копии на хранение в другие города. {staff} просматривал главный столбец за столбцом и выцарапывал на глиняном черепке закон, которым начиналась и заканчивалась каждая табличка, так что копии, собранные вместе, ничего не упускали. Писец прокатал цилиндрическую печать по краю последней таблички, оставив полосу крошечных фигурок и знаков. Ученик сложил таблетки одну за другой в корзину, выстланную соломой, завязал ей рот и вместе с лодочником отнес ее к лодке на реке.'
      excerpts:
        p1: 'Писец прокатал цилиндрическую печать по краю последней таблички, оставив полосу крошечных фигурок и знаков. Ученик сложил таблетки одну за другой в корзину, выстланную соломой, завязал ей рот и вместе с лодочником отнес ее к лодке на реке.'
    relic: 'Цилиндрическая печать'
    relic_desc: 'Маленький каменный цилиндр, оставляющий оттиск подписи, когда его прокатывают по глине.'
    points:
      p1: 'Помогите писцам скопировать весь текст стелы на большее количество глиняных табличек и разослать их в другие города, чтобы каждый закон можно было прочитать даже после того, как часть камня будет соскоблена.'
    points_fail:
      p1: 'Полный текст остался в уже существовавших копиях. В этой ветви, после того как камень был перенесен в Сузы и часть его соскоблена, некоторые законы все же были утеряны.'
    shift:
      p1:
        was: 'В двенадцатом веке до нашей эры стелу перевезли в Сузы, а несколько колонок ее текста соскоблили; По глиняным копиям восстановлено около тридцати пропавших законов, остальные до сих пор неизвестны.'
        now: '{staff} помог писцам сделать больше полных копий и отправить их в другие города. На этой временной шкале все еще можно прочитать каждый закон на стеле.'
        who: 'hammurabi_babylon'
        bio: 'В этой линии каждый из законов Хаммурапи был выполнен полностью, и ничего из того, что было соскоблено с камня, не потерялось.'
    vignettes:
      clay: '{staff} помогает ученику писца месить глину. Песок надо как следует промыть, говорит ученик, иначе табличка треснет под стилусом на полпути, и тогда мастер просит его начать заново с первой строчки.'
      river: '{staff} помогает лодочнику разгружать ячмень на берегу Евфрата. Пересчитывая мешки, лодочник говорит, что, если весовщик обманет его в одном, он пойдет, встанет перед королевским камнем и прочитает ему закон, хотя сам не сможет прочитать ни знака.'
      roof: 'В самую сильную жару {staff} и ученик раскладывают новые таблетки на крыше, чтобы они высохли. Ученик пересчитывает их, сбивается на полпути и начинает снова, боясь, что на кого-то наткнулась птица.'
  ibn_battuta_tangier:
    name: 'В начале долгого пути'
    place: 'Танжер, Марокко'
    figure: 'Ибн Баттута'
    story: 'В июне 1325 года Ибн Баттута покинул родной Танжер. Он вспомнил, как отправился в Рихлу без компаньона или каравана, оставив обоих родителей. Почти три десятилетия путешествий вошли в отчет, который он продиктовал Ибн Джузайю после возвращения в Марокко.'
    story_prose:
      opening:
        - 'Танжер, Марокко, июнь 1325 года. Ибн Баттута, которому чуть больше двадцати, собирается отправиться в долгое путешествие, а оба его родителя все еще дома. Почти тридцать лет спустя он пришел домой и продиктовал Ибн Джузайю то, что видел, и это стало Рихлой.'
        - 'Исторически он выходил из городских ворот один, без компаньона и без каравана, к которому можно было бы присоединиться. В Милиане два посланника тунисского султана, которых он догнал, оба заболели от жары, и один из них умер через три ночи у ручья за городом; Пройдя Беджайю, его снова охватила лихорадка, и он привязал себя к седлу тюрбаном; в тот день, когда он въехал в Тунис, никто из вышедших из города людей не знал его, и он не мог сдержать слез. В этой ветке сосед наполняет бурдюки водой у фонтана, а носильщик на окраине города знает только первый участок дороги.'
        - 'В этой поездке могут помочь несколько типов людей: кто-то, кто разбирается в уходе за больными и имеет с собой достаточно регидратационной соли и воды; кто-то очень крепкий или кто-то с обезболивающими, кто может стиснуть зубы, чтобы выдержать жару и тряску; кто-то добросердечный, кто выйдет вперед у чужих городских ворот.'
      outcomes:
        all: 'Той осенью оба посланника султана Туниса вернулись домой в город. Ибн Баттута пробыл в Тунисе два месяца, и тот, кто вошел с ним в тот день, часто приходил к нему, чтобы посидеть некоторое время. Позже он отправился на восток с большим караваном.'
        p2: 'Той осенью два посланника один за другим вернулись в Тунис. Больной ехал вторым, у него на седле висела чаша с водой из ручья.'
        p3: 'Он пробыл в Тунисе два месяца. Тот, кто ходил с ним в тот день, часто приходил к тому месту, где он ночевал, посидеть, и в основном они разговаривали о дороге.'
        p1: 'Он никогда не покидал седла и продержался до Туниса. После этого тюрбан снова обернулся вокруг его головы и ушел вместе с ним далеко на восток.'
      none: 'В июле у ручья возле Милианы караван остановился на три ночи, и один из посланников больше не встал. В сентябре у ворот Туниса вышедшие люди выкрикивали имена других мужчин, а он стоял на краю толпы, держа вожжи, и громко плакал.'
      desync: 'В августе, мимо Константина, узел развязался. Когда {staff} был отозван, караван остановился посреди дороги, а тюрбан свисал с пустого седла, один конец все еще был привязан, а другой волочился по земле.'
      not_admitted: '{staff} так и не нашел опоры в Танжере и несколько раз носил воду соседу у фонтана. Рано утром 14 июня молодой человек вывел свое животное из городских ворот, без сопровождающего и каравана позади.'
      points:
        p2:
          class_medical: 'Июль, у ручья в четырех милях от Милианы. Оба посланника заболели на жаре, и караван три ночи стоял у воды; худший из двоих лежал там и едва открывал глаза, когда с ним разговаривали. {staff}, как учит медсестра, размешал два пакета регидратационных солей в остывшую кипяченую воду в колбе, поднял голову и давал ему по глотку, а затем положил мокрую ткань на лоб и затылок, время от времени меняя ее. На четвертое утро он сел один, взял чашу с водой обеими руками, выпил ее досуха и отдал обратно. Караван собрался, чтобы двигаться дальше, а ручей все еще громко журчал между камнями.'
          else: 'Июль, у ручья в четырех милях от Милианы. Оба посланника заболели на жаре, и караван три ночи стоял у воды; худший из двоих лежал там и едва открывал глаза, когда с ним разговаривали. {staff} открыл принесенную с собой аптечку, сбил его температуру и оставался рядом с ним всю ночь, не спал, ожидая, пока он нальет воды в рот. На четвертое утро он сел один, взял чашу с водой обеими руками, выпил ее досуха и отдал обратно. Караван собрался, чтобы двигаться дальше, а ручей все еще громко журчал между камнями.'
        p1:
          class_medical: 'Август, мимо Константина: лихорадка вернулась к Ибн Баттуте. В Беджая друг уже уговаривал его остаться, пока он не поправится, но он не остался. На этот раз он привязал себя к седлу тюрбаном, боясь, что лихорадка сделает его слишком слабым и он упадет. {staff}, как учит медсестра, ощупывал его лоб и запястье при каждой остановке, снова и снова менял влажную ткань, смотрел, как он глотает воду, и еще раз туго затягивал для него узел. Ночью, когда караван остановился, он все еще был в седле, свесившись на шею животного. Когда бурдюк с водой поднесли к его губам, он сделал два глотка, затем наклонился и снова ощупал узел.'
          else: 'Август, мимо Константина: лихорадка вернулась к Ибн Баттуте. В Беджая друг уже уговаривал его остаться, пока он не поправится, но он не остался. На этот раз он привязал себя к седлу тюрбаном, боясь, что лихорадка сделает его слишком слабым и он упадет. {staff} всю дорогу шел рядом со своим животным, держа одну руку за поводья, и каждый раз, когда он покачивался, поднимал руку и толкал его обратно в седло, весь день на солнце, не меняя рук. Ночью, когда караван остановился, он все еще был в седле, свесившись на шею животного. Когда бурдюк с водой поднесли к его губам, он сделал два глотка, затем наклонился и снова ощупал узел.'
        p3: 'Сентябрь, и караван пришел в Тунис. Горожане вышли, называя купцов отряда по имени и взяв их одного за другим за руки. Никто не знал Ибн Баттуту; он стоял на краю толпы, все еще держа вожжи. {staff}, который много разговаривал с ним в дороге, подошел к нему, назвал его по имени и спросил, где он спал той ночью. Он вытер лицо рукавом и переложил поводья, которые держал всю дорогу, в другую руку. Они вдвоем, один за другим, прошли мимо встречающей толпы и вошли в ворота.'
      excerpts:
        p2: 'На четвертое утро он сел один, взял чашу с водой обеими руками, выпил ее досуха и отдал обратно. Караван собрался, чтобы двигаться дальше, а ручей все еще громко журчал между камнями.'
        p3: 'Он вытер лицо рукавом и переложил поводья, которые держал всю дорогу, в другую руку. Они вдвоем, один за другим, прошли мимо встречающей толпы и вошли в ворота.'
        p1: 'Ночью, когда караван остановился, он все еще был в седле, свесившись на шею животного. Когда бурдюк с водой поднесли к его губам, он сделал два глотка, затем наклонился и снова ощупал узел.'
    relic: 'Изношенные в путешествии сандалии'
    relic_desc: 'Кожаные сандалии перешивались много раз.'
    points:
      p1: 'По дороге из Беджая держите его в седле во время лихорадки, пока он не достигнет Туниса.'
      p2: 'В Милиане спасти заболевшего в жару посланника Туниса.'
      p3: 'В тот день, когда он приедет в Тунис, дайте ему знать, что он не один в чужом городе.'
