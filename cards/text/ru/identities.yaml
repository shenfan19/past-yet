# За кого принимают сотрудника на месте. name — как называется эта роль, cover — что сотрудник рассказывает о себе, это пишется в отчёт при прибытии.
identities:
  local_hand: {name: местный в поисках работы, cover: '{staff} говорит, что ищет работу.'}
  local_scholar: {name: грамотный местный житель, cover: '{staff} говорит, что умеет читать, писать и считать.'}
  healer: {name: лекарь, cover: '{staff} говорит, что знает толк в лечении и носит свои снадобья.'}
  pen: {name: чужак с пером, cover: '{staff} говорит, что пишет для газеты и хочет всё увидеть своими глазами.'}
  scholar_guest: {name: приезжий учёный, cover: '{staff} говорит, что занимается наукой в других краях и хочет посмотреть, как здесь всё устроено.'}
  wanderer: {name: странник, cover: '{staff} говорит, что держит путь дальше и здесь проездом.'}
  maker: {name: ремесленник, cover: '{staff} говорит, что владеет ремеслом и работает, где придётся.'}
  far_guest: {name: гость издалека, cover: '{staff} говорит, что держит путь издалека и ждёт корабля.'}
  lodger: {name: 'чужак, нашедший ночлег', cover: '{staff} говорит, что здесь проездом и ищет, где пожить какое-то время.'}
