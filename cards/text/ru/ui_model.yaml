ui:
  model:
    note: Модель бэкенда — это один YAML-файл. В нём все числа правил игры, код только их интерпретирует.
    variables: Переменные
    provenance: Источник
    show_yaml: Показать весь YAML
    count: переменных
    ext: Расширения LM 1.0
    ext_text:
      agents: Многоагентность. У каждого агента своё состояние, и на каждом шаге он выбирает доступное действие с наибольшей полезностью, записанное как входной уровень.
      actions: Предусловия и полезности — выражения над объявленными переменными.
      events: Случайные события с зерном. Выпадение зависит только от зерна, идентификатора события и номера появления.
      milestones: Фразы отчёта, срабатывающие один раз, когда выражение становится истинным.
      outcomes: Упорядоченные конечные состояния, применяется первое истинное.
      scoring: Контрфактическая оценка. Тот же прогон с тем же зерном, но без сотрудника, служит для сравнения.
      provenance: У каждой переменной и события указано происхождение — история, модель LM, допущение игры, калибровка.
      item_bindings: Предметы, выбранные перед отправкой, один раз записываются в свои переменные при прибытии.
      strategies: Полевые склонности сотрудника идут от его черт. Отправленный действует по своим склонностям, каждый вариант задаёт некоторые входные переменные.
    blocks: Блоки
