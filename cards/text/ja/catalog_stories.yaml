    points:
      p1: 'メンデルが 8 年間の記録を 2 つの講演にまとめ、両方の記録をブルノ社会に保護できるように支援してください。'
      p2: 'リスナーが聞いた数字を確認できるように、カウントを世代ごとに分ける'
