  galois_paris:
    name: '決闘の前夜'
    place: 'パリ'
    figure: 'エヴァリスト・ガロア'
    story: 'エヴァリスト・ガロワは、1832年4月29日にパリの刑務所から出所した。5月29日の夜、彼は友人のオーギュスト・シュヴァリエに手紙を書き、どの方程式が根号で解けるかについて発見したことを述べ、その手紙を印刷してもらうよう頼んだ。翌朝、彼は決闘で腹部を撃たれ、倒れたまま放置された。彼は5月31日にコーチン病院で20歳で亡くなった。シュヴァリエはその9月に手紙を印刷した。 14年後、ジョセフ・リウヴィルは論文を発表しました。'
    story_prose:
      opening:
        - 'パリ、1832年5月。20歳のエヴァリスト・ガロワは1か月前に刑務所から出所した。彼は 10 代のころ、群理論の元となったアイデアであるラジカルによって方程式を解くことができる条件を発見しましたが、当時はほとんど誰もそれに従うことができませんでした。'
        - '歴史上、5月29日の夜、彼は友人のオーギュスト・シュヴァリエに手紙を書き、発見したことを説明し、その手紙を印刷してもらうよう頼んだ。翌朝、彼は決闘で腹部を撃たれ、倒れたまま放置され、5月31日にコーチンの病院で死亡した。手紙はその9月に印刷され、彼の論文はリウヴィルが出版するまで14年も待たなければならなかった。この支店では、下宿先のコンシェルジュがインクを貸してくれたり、カーターはコーチン病院の門まで10年間薪を運んできたし、印刷所の製版者は等号が足りないと文句を言ったりする。'
        - 'この旅行では、何種類かの人々が協力してくれるでしょう。アーカイブを保管し、翻訳したり校正刷りを読んだりする人、あるいは手紙と書類を一緒に保管するために一晩中起きていられる几帳面な人です。医学の知識があり、その朝早くそこにいるために適切なキットまたは薬を持ってきた人。アーカイブを保存したり翻訳したりして、後から読む人が次に何が来るかを見つけられるように編集者と話し合える人。'
      outcomes:
        all: 'Galois lived.その9月、手紙には索引ページが印刷され、人々はページ番号を見て書類を求めに来た。シュヴァリエは彼らの質問をリストに書き写し、ガロアはテーブルに座って一つ一つ答えた。'
        p3: 'ガロアさんは6月まで病院で横たわり、起き上がることができなかった。その夏、彼は再びテーブルに座った。手紙の下書きが目の前に広がり、欄外の線はまだ残っていた。'
        p2: '9月以降、手紙を読んだ人は誰でも索引を参照してコピーを要求できるようになり、質問はページ番号とともにシュヴァリエに返された。 1846 年にリウヴィルは論文を発表しました。'
        p1: 'その9月、シュヴァリエはレビュー百科事典に5月29日の手紙を掲載した。 14年後、リウヴィルは論文を発表した。'
      none: '6月2日、ガロアはモンパルナスの共同墓地に埋葬された。コンシェルジュは借りていたインクのボトルを取り戻し、家計簿に線を引いた。'
      desync: '5月29日の夜遅く、手紙とその手紙に書かれていた書類はテーブルの両端に置かれていたが、誰もそれを包んでいなかった。 {staff} がリコールされたとき、ろうそくは燃え落ち、ろうそくはページの端に流れ落ちていました。'
      not_admitted: '{staff} は建物に一度も入ったことはなく、数晩通りの角に立っただけでした。 2階の窓の1つは夜明け近くまで明かりがついていたが、窓が開くと丸石の上に丸まったシートが落ちた。'
      points:
        p1:
          class_lettered: '5月29日の夜、テーブルは紙で覆われていました。シュヴァリエへの手紙は何ページにもわたって書かれており、その中で言及されている書類は数冊の本の下にあります。 {staff} は、紙と手紙を持って家にいて、彼がまだ起きている間に確認するためにページを 1 枚ずつ彼に渡し、手紙を単独で折り、彼が与えた順序で紙を 2 番目の束に結び、それぞれに名前を書き、最初の明るいうちに手でシュヴァリエに行きます。夜明け近く、ガロアはページの余白に急いで線を追加し、ペンを置きます。 2つの束はテーブルの上に並んで置かれ、一番上の束にはシュヴァリエの名前が刻まれています。'
          else: '5月29日の夜、テーブルは紙で覆われていました。シュヴァリエへの手紙は何ページにもわたって書かれており、その中で言及されている書類は数冊の本の下にあります。 {staff} は、几帳面で徹夜もできるので、テーブルにいて、読み終えるごとに各ページを取り、手紙を単独で折り、指定した順序で紙を 2 番目の束に結び、それぞれに名前を書き、明るくなると手でシュヴァリエのところに行きます。夜明け近く、ガロアはページの余白に急いで線を追加し、ペンを置きます。 2つの束はテーブルの上に並んで置かれ、一番上の束にはシュヴァリエの名前が刻まれています。'
        p3:
          class_medical: '5月30日早朝、撃たれた後、彼は市郊外の空き地の芝生に一人で横たわっていた。他の人たちは行ってしまいました。薬に詳しい{staff}は数分以内に到着し、ひざまずいて腹部の傷をガーゼで押さえ、ようやく出血が止まり、持参した感染症対策の薬を使い、通りかかったカートを止めて医者に連れて行った。数日後、彼は病院のベッドで目覚め、紙に手を伸ばしました。看護師が彼に半分のシートを渡すと、彼はそれを裏返し、裏面に金額を書き始めました。'
          else: '5月30日早朝、撃たれた後、彼は市郊外の空き地の芝生に一人で横たわっていた。他の人たちは行ってしまいました。 {staff} は数分以内に到着し、持参したナノ医療キットを開け、指示に従って出血を止め、傷口が化膿するのを防ぎ、通りかかったカートを止めて医師の所へ連れて行きます。数日後、彼は病院のベッドで目覚め、紙に手を伸ばしました。看護師が彼に半分のシートを渡すと、彼はそれを裏返し、裏面に金額を書き始めました。'
        p2:
          class_lettered: '9月には、小さな印刷所でレビュー百科事典のその号数が設定され、構成者は、もっと等号を求めて隣のケースにぶつぶつ言いに行きます。文書処理に慣れている{staff}は、シュヴァリエが持っているページに番号を付け、それを索引のページにコピーし、編集者に手紙の後に印刷するように頼み、ページを順番に読んでくれる数学者に手紙を書いた。印刷された番号は店の窓辺にあり、文字の後にインデックスのページがあり、1 行に 1 ページ番号が付いています。シュバリエはコピーを手に取り、数字の列を指でなぞります。'
          else: '9月には、小さな印刷所でレビュー百科事典のその号数が設定され、構成者は、もっと等号を求めて隣のケースにぶつぶつ言いに行きます。几帳面で説得力のある{staff}は編集者の机に座り、シュヴァリエが持っているページを1枚ずつ読み、手紙の後に索引のページを追加するよう説得し、ページを順番に読んでくれる数学者を見つけた。印刷された番号は店の窓辺にあり、文字の後にインデックスのページがあり、1 行に 1 ページ番号が付いています。シュバリエはコピーを手に取り、数字の列を指でなぞります。'
      excerpts:
        p3: '数日後、彼は病院のベッドで目覚め、紙に手を伸ばしました。看護師が彼に半分のシートを渡すと、彼はそれを裏返し、裏面に金額を書き始めました。'
        p2: '印刷された番号は店の窓辺にあり、文字の後にインデックスのページがあり、1 行に 1 ページ番号が付いています。シュバリエはコピーを手に取り、数字の列を指でなぞります。'
        p1: '夜明け近く、ガロアはページの余白に急いで線を追加し、ペンを置きます。 2つの束はテーブルの上に並んで置かれ、一番上の束にはシュヴァリエの名前が刻まれています。'
    relic: '急いでいる手紙'
    relic_desc: 'ページには数字と時間がないという言葉が書かれていた。'
