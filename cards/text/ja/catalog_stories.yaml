      p2:
        was: '1906年5月、ボルツマンは病気休暇に入り、ステファン・マイヤーが講義を引き継いだ。 9月5日、彼はドゥイーノで休暇中に62歳で亡くなった。'
        now: '{staff} はその夏の間、ドゥイーノで彼と一緒に過ごし、病気はゆっくりと和らぎました。秋になると、彼は家族とともにウィーンに帰り、再び教え、実験によって原子が確認されるまで生き延びました。'
        who: 'boltzmann_duino'
