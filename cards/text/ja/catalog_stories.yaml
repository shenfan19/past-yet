        now: '彼が連れ去られる前に、いくつかの本の箱が町の家のベッドの下に移動されました。 14年後、彼が帰宅したとき、その家族はタンスを運び出しました。'
        who: 'ahmed_baba_timbuktu'
        bio: 'アフマド・ババは 1608 年にトンブクトゥに帰郷し、町の家族がまだ保管している自分の本が入った箱をいくつか見つけました。彼は晩年に彼らから教えを受けました。'
    vignettes:
