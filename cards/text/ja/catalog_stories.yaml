  boltzmann_duino:
    name: '同じ数、違う並べ方'
    place: 'ドゥイーノ'
    figure: 'ルートヴィヒ・ボルツマン'
    story: '1877 年、ルートヴィヒ ボルツマンは、エネルギー分布がどのようにして生じるかを数えることにより、熱の法則を原子の統計と結び付けましたが、20 世紀に入っても多くの人は依然として原子が実在するかどうかを疑っていました。 1906年5月、いわゆる重度の神経衰弱症を患った彼は講義をやめ、その夏、家族とともにトリエステ近くのドゥイーノへ出かけた。彼は9月5日に62歳でそこで亡くなった。 2 年後、ブラウン運動に関するジャン ペランの実験によりアインシュタインの予測が確認され始め、原子が受け入れられるようになりました。'
    story_prose:
      opening:
        - '1906 年夏、トリエステ近くのドゥイーノ湾。ルートヴィヒ ボルツマンは妻と娘とともにここで休暇中です。 30 年近く前、彼は同じエネルギー分布を与える配置がいくつあるのかを数え、熱の法則を原子に結びつけました。今でも、多くの人は原子が実際に存在することを信じていません。'
        - '歴史上、その5月に彼は重度の神経衰弱症と呼ばれる病気で講義をやめ、ステファン・マイヤーが彼の講義を受講した。 9月5日、彼はドゥイーノで62歳で死去した。 2 年後、ブラウン運動に関するペリンの実験は原子の証拠となり始めました。この支店では、漁師が海岸で網を干し、小さな男の子が浜辺で小石を数え、ホテルのメイドが毎日海からタオルを持ってきます。'
        - 'この旅行では 2 種類の人が助けてくれます。原子について話すことができるほど学んだ人、もう 1 つは医学の知識があり、適切な治療法を持ってきて、病人のそばにいてくれる人です。'
      outcomes:
        all: '9月にウィーン行きの列車がドゥイーノから出発した。ボルツマンは窓際に座り、コートのポケットは数枚の仕事で膨らんでいた。'
        p2: '9月にウィーン行きの列車がドゥイーノから出発した。彼は窓際に座ってずっと海を眺めていました。'
        p1: 'その夏の間ずっと、仕事用のシーツがコートのポケットに入れられたままだった。'
      none: 'ドゥイーノ湾はとても静かでした。ホテルのテラスでは、数枚の作業用シートがテーブルから床に吹き飛ばされていました。'
      not_admitted: '{staff} は家族に近づくことはありませんでした。男は毎日ホテルのテラスで海に面して座っており、休日は日に日に短くなっていた。'
      points:
        p1: '8月初旬のある晩、ボルツマンはホテルのテラスに座り、数枚の仕事資料がテーブルの上に重くのしかかっていた。 {staff} はその粒子を手に取り、水中の小さな粒子の揺れから始めました。アインシュタインはその前年に、そのような揺れが粒子をどのくらい遠くまで運ぶのかをどのように計算し、さらに 2 年後には誰かがそれを顕微鏡でどのように測定するのかを調べました。彼は何も言わずに最後まで聞き、シーツを四角くしてコートのポケットに入れました。部屋に戻ると、彼はそのポケットに手を押し当てたままでした。'
        p2:
          class_learned: '医師のように、{staff} さんは毎日薬を飲む時間と睡眠時間を決め、朝と夕方に脈拍を測り、日中は海岸沿いを一緒に散歩しました。8月末までに、彼は以前よりも夜の睡眠時間が長くなり、朝には一人で海まで歩いて戻ってくることができるようになりました。ある日、朝食時に彼は娘にウィーン行きの電車の出発時間を尋ねさせました。'
          else: '{staff} さんは、決まった時間に持参した心を落ち着かせるパッチを交換し、夜は彼が眠るまで一緒に座り、日中は海岸沿いを一緒に歩きました。8月末までに、彼は以前よりも夜の睡眠時間が長くなり、朝には一人で海まで歩いて戻ってくることができるようになりました。ある日、朝食時に彼は娘にウィーン行きの電車の出発時間を尋ねさせました。'
      excerpts:
        p2: '8月末までに、彼は以前よりも夜の睡眠時間が長くなり、朝には一人で海まで歩いて戻ってくることができるようになりました。ある日、朝食時に彼は娘にウィーン行きの電車の出発時間を尋ねさせました。'
        p1: '彼は何も言わずに最後まで聞き、シーツを四角くしてコートのポケットに入れました。部屋に戻ると、彼はそのポケットに手を押し当てたままでした。'
    relic: '短くなったチョーク'
    relic_desc: '使い古された講義用チョークの切れ端。'
    points:
      p1: '数年以内に原子が本物であることが実験で証明され、彼が人生の半分をかけて擁護した理論は有効であることを彼に伝えてください。'
      p2: 'ドゥイーノの休暇が終わる前に、彼の病気を治してウィーンに戻るのを見届けてください。'
    points_fail:
      p1: '彼はまだ懐疑的な人々の中で夏を過ごしている。この支部では、ブラウン運動の実験が原子の証拠になるとは誰も彼に言いませんでした。'
      p2: '9月5日は歴史上そうであったように起こった。この支部では、彼はウィーンの演台に戻ることはありませんでした。'
    shift:
