  lovelace_london:
    name: '最初のプログラム'
    place: 'ロンドン'
    figure: 'エイダ・ラブレス'
    story: '1842 年、イタリアの技術者ルイージ メナブレアは、チャールズ バベッジの分析エンジンの説明をフランス語で出版しました。エイダ・ラブレスはこれを翻訳し、記事の約 3 倍の長さとなる 7 つのメモを追加しました。最後の Note G は、エンジンがベルヌーイ数を計算する方法を示しています。 1843年8月、バベッジは同紙に政府に対する自身の苦情を掲載することを望み、編集者が署名なしで印刷しない場合は撤回するよう彼女に求めた。彼女は拒否し、A.A.L.と署名された翻訳とメモは、その年のテイラーの科学回想録に掲載された。 8月14日、彼女はバベッジがエンジニアリングを続けるならエンジン製造事業を組織すると申し出た。彼は彼女の条件を拒否した。'
    story_prose:
      opening:
        - '1843 年夏、ロンドン。エイダ・ラブレスは、バベッジの分析エンジンに関するイタリア人技術者メナブレアのフランス語による説明を英語に翻訳し、記事の約 3 倍の長さとなる 7 つのメモを追加しました。最後の Note G では、このエンジンがまだ紙の上でどのようにベルヌーイ数を計算するかを段階的に説明しています。'
        - '歴史上、バベッジは政府に対する自分の訴えを紙に印刷することを望んでいた。編集者は署名なしでは印刷しなかったので、バベッジは彼女に撤回するよう求めた。 8月6日、彼女は彼に、そうはしない、完全に決意していると手紙を書いた。 8月14日、彼女はエンジニアリングを続けるならエンジン製造の事業を経営すると申し出たが、バベッジは手紙の中ですべての条件を拒否したと述べた。翌日、彼女は母親に、印刷業者が最終ラウンドの監督のために彼女を呼んだこと、数式を修正するのが大変だったことを話した。この支店では、印刷所の製版業者がシグマ ボックスがなくなりつつあると不満を漏らしており、スピタルフィールズの織工はジャカード織機を保管しています。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。翻訳と論文に精通していて、コピーの束を保管できる人。校正刷りを読んで表をセルごとにチェックできる人。 2 人を 1 つの仕事部門にまとめることができる機転の利く人。'
      outcomes:
        all: 'テイラーの科学回想録の番号が出てきて、列のセルが 1 つも表示されていない音符 G の表と、A.A.L. のイニシャルが表示されました。最後に。 9月、ある訪問者がドーセット・ストリートの家に座り、図面、費用の概要、作業を分割した1ページを目の前に広げた。'
        p3: '9月にドーセット・ストリートの訪問者が図面と費用の概要に目を通し、作業を分割していた1ページを取り上げ、エンジニアリングがレビューされればお金を解決できると述べた。'
        p2: '印刷されたノート G では、表のセルがその列から滑り出すことはありませんでした。彼女がチェックした校正刷りは、赤い点が余白に残ったまま、印刷所の食器棚に保管されていました。'
        p1: 'テイラーの科学回想録の部数は計画通りに出版され、翻訳と 7 冊のメモが一緒に印刷され、A.A.L. のイニシャルが付けられました。最後に。'
      none: '8月下旬、テイラーの科学回想録が何冊か出版された。スピタルフィールズの織物工場では、パンチカードが次々と裏返されていました。'
      desync: '印刷業者は続行するか待つように言われ、番号から翻訳とメモが取り除かれました。事務局が {staff} をリコールしたとき、その合成者は Note G の型をバラバラにし、その活字を少数ずつケースに戻していました。'
      not_admitted: '{staff} はセント・ジェームス広場の家には一度も入らず、スピタルフィールズの機屋のドアでジャカード織機を眺めながら数日間過ごした。カードが一枚ずつめくられ、シルクの中の花が長くなっていきました。'
      points:
        p1:
          class_lettered: '8月6日、彼女はバベッジに、翻訳とメモは撤回されず、完全に決意していると手紙を書いた。 {staff} さんは、書類管理者が行うように、翻訳と 7 冊のメモをページ番号ごとに数え、それらを 1 本のテープで縛り、署名を付けて印刷する指示を追加し、印刷所に持って行きました。作曲家はテープをほどき、上に訳文、下に音符、そして下に音符 G の大きな表を置きました。彼は表を平らにならし、その角を 2 枚の活字で重み付けしました。'
          else: '8月6日、彼女はバベッジに、翻訳とメモは撤回されず、完全に決意していると手紙を書いた。 {staff} はテープで縛った束をプリンターのドアまで運び、ドアが開くまでそこで待ち、他の人に受け取らせないで、両手で複合機のベンチに置きました。作曲家はテープをほどき、上に訳文、下に音符、そして下に音符 G の大きな表を置きました。彼は表を平らにならし、その角を 2 枚の活字で重み付けしました。'
        p2:
          class_lettered: '8月15日、印刷業者は最後の校正を監督するために再び彼女を呼び、公式を一つ一つチェックした。 {staff} は、校正者が行うように、Note G の表の上に定規を置き、台の上で 1 行ずつ読み、コンポジターが聞きながら、セルが次の列に滑り込む可能性がある場所の余白に赤い点を置きました。夕暮れまでに、赤い点の線が校正刷りの右側の余白を流れました。彼女はテーブルを窓にかざし、最初の行から最後の行までもう一度読み、それから作成者に返しました。'
          else: '8月15日、印刷業者は最後の校正を監督するために再び彼女を呼び、公式を一つ一つチェックした。 {staff} は、メモ G の表を最初から 1 部ずつコピーし、ベンチ全体で 1 行ずつ確認し、セルが次の列に滑り込む可能性がある場所の余白に赤い点を置きました。夕暮れまでに、赤い点の線が校正刷りの右側の余白を流れました。彼女はテーブルを窓にかざし、最初の行から最後の行までもう一度読み、それから作成者に返しました。'
        p3:
          class_lettered: '8月下旬、メモにはA.A.L.が署名しました。すでに印刷されていました。 {staff}は合意の形で、8月14日の彼女の手紙にある仕事の分担を1ページに書き出した。彼女はビジネスと資金調達を担当し、バベッジはエンジニアリングを担当し、最初に支援者の1人が図面と費用の概要を確認するよう求められる。小姓はそれぞれの家で一夜を過ごした。それが戻ってくると、同じ日、二人の名前が別々の手を持って麓に立っており、その下で同じ日に会議が開かれていました。'
          else: '8月下旬、メモにはA.A.L.が署名しました。すでに印刷されていました。 {staff} さんは 8 月 14 日の手紙を持って自宅とドーセットストリートの間を何度も往復し、双方が与えるステップを 1 ページに書きました。小姓はそれぞれの家で一夜を過ごした。それが戻ってくると、同じ日、二人の名前が別々の手を持って麓に立っており、その下で同じ日に会議が開かれていました。'
      excerpts:
        p3: '小姓はそれぞれの家で一夜を過ごした。それが戻ってくると、同じ日、二人の名前が別々の手を持って麓に立っており、その下で同じ日に会議が開かれていました。'
        p2: '夕暮れまでに、赤い点の線が校正刷りの右側の余白を流れました。彼女はテーブルを窓にかざし、最初の行から最後の行までもう一度読み、それから作成者に返しました。'
        p1: '作曲家はテープをほどき、上に訳文、下に音符、そして下に音符 G の大きな表を置きました。彼は表を平らにならし、その角を 2 枚の活字で重み付けしました。'
    relic: 'パンチカード'
    relic_desc: '穴の並びで機械にどの演算を行うか伝えるカード。'
    points:
      p1: 'ラブレスの許可を得て、彼女の翻訳とメモを一緒にプレスに送ります'
      p2: '最後の証明に戻る前に、Lovelace と作成者に Note G の表全体を読み取らせ、別の列に滑り込む可能性が最も高いエントリにマークを付けます。'
      p3: '支援者となる可能性のある人への短い提案書に、彼女の仕事の分担を盛り込んでください。ラブレスが事業を組織し、バベッジがエンジニアリングを指揮し、両者とも最初の会議に同意することになった'
    points_fail:
      p1: 'プリンターは、続行する命令と待機する命令の両方を受け取ります。問題から翻訳とメモが抜粋され、オフィスは従業員をリコールする'
      p2: 'コンポジターはいくつかのシンボルをリセットし、行を最初から読み取る人はいません。彼女は過去数時間に式と表を相互にチェックしなければなりません'
      p3: '彼女のプロポーズはバベッジの返答で終わる。他の誰かが仕事の支援について尋ねたとき、彼らはどちらも喜んで引き継ぐ計画を持っていません'
    shift:
      p1:
        was: '1843年8月、バベッジは編集者に撤回の許可を求めるように彼女に頼んだ。ラブレスは拒否したが、その年、翻訳と彼女のイニシャル入りのメモが一緒に出版された。'
      p2:
        was: '8月15日、ラブレスさんは母親に、印刷業者がさらなる監督のために彼女を呼び出し、数式を修正するのに時間がかかっていると話した。'
        now: '印刷者は、列ごとにチェックした校正刷りを保管します。シンボルをリセットする必要がある場合、コンポジターはそれを使用して隣接する列をチェックできます。'
      p3:
        was: '8月14日、ラブレスはバベッジがエンジニアリングに時間を充てることができるように、彼女と他の後援者が事業を行うことを提案した。彼は彼女の条件を断った。'
        now: '彼らは、将来の支援者 1 名に図面と費用の概要を示すことに同意します。訪問者は、誰が何をするかについての説明を取り除き、技術的な検討の後に金額について決定することに同意します。'
        who: 'lovelace_london'
        bio: 'ラブレスは記事を翻訳し、技術ノートを書きました。彼女はまた、まだ大部分が紙の上で存在しているエンジンに関する作業を整理する方法も探していました。'
    vignettes:
      messenger: '{staff} はセント・ジェームス広場の家の柱廊玄関の下でメッセンジャーとして待機していますが、メッセンジャーは座っていません。中で誰かが書き、取り消し線を消し、また書きます。夕暮れ時、ドーセット・ストリート宛てに、ワックスがまだ柔らかい手紙が{staff}の手に渡されました。'
      compositor: '{staff} は、コンポジターがタイプを選択するのに役立ちます。この問題はすべてギリシャ文字、インデックス、線の上に設定された小さな数字です。シグマボックスはほとんど空です。これを書いた人が来て自分で設定する必要があると彼は不平を言います。'
      loom: '{staff} はスピタルフィールズの織工のドアで止まります。ジャカード織機の上でパンチカードが次々と裏返され、シルクの中に花が浮かび上がります。織り手は、カードの方が彼よりもパターンをよく知っていると言います。'
  mendel_brno:
    name: 'エンドウと遺伝の法則'
    place: 'ブルノ'
    figure: 'グレゴール・メンデル'
    story: '1856 年から 1863 年にかけて、グレゴール メンデルはブルノの自宅の庭でエンドウ豆を交配し、その子孫を数えました。 1865年2月8日と3月8日、彼はブルノ自然史協会への2回の講演で結果を報告し、その論文は1866年に協会の議事録に掲載されたが、彼の生前にはほとんど取り上げられなかった。メンデルは 1884 年に亡くなり、1900 年に 3 人の植物学者が遺伝の研究をしていたときに彼の論文に出会いました。'
    story_prose:
      opening:
        - 'ブルノ、1865 年冬。修道士グレゴール・メンデルは 1856 年以来、修道院の庭でエンドウ豆を交配し、その子孫を世代ごとに数え、自身の報告によると 8 年間を数えました。この冬、彼はブルノ自然史協会の前でそれらの数字を発表することになっている。'
        - '歴史上、彼は 2 月 8 日と 3 月 8 日の 2 回講演し、その論文は翌年の協会の会報に掲載されました。彼の生涯において、それをさらに進めた人はほとんどいませんでした。彼は 1884 年にブルノで亡くなり、1900 年になって初めて 3 人の植物学者がそれぞれ独自にこの植物を発見しました。この支店では、ポーターが会議室の入り口にゴザを敷き、老婦人がキャベツ市場で乾燥エンドウ豆を売っています。'
        - 'この旅行では、何人かの人々が助けてくれます。両方の話を安全に保つことができる慎重な人。教え、世代ごとに数字を説明できる人。会議が解散する前に、再び家でエンドウ豆を栽培することに聞き手を同意させることができる説得力のある人。'
      outcomes:
        all: 'その秋、他の場所から修道院に手紙が届き、別の庭でエンドウ豆が数えられました。メンデルはそれをテーブル上の自分の数字の横に広げ、その横に世代別の数字のシートを重しにして置いた。'
        p3: 'その秋、他の場所から修道院に手紙が届き、別の庭でエンドウ豆が数えられました。メンデルは 2 組の数値を表に並べて広げ、一行ずつ調べました。'
        p2: '話を聞いた人の何人かは、世代別の集計表をコピーして持ち帰った。翌年議事録が発行されたとき、彼らは自分たちのコピーをそれと照合し、すべての細胞が同意した。'
        p1: '1866 年、この 2 つの講演は「植物雑種の実験」となり、学会議事録の第 4 巻に掲載されました。修道院の庭には、その年のエンドウ豆がいつものように入っていました。'
      none: '1866年にこの論文は協会の議事録に掲載されましたが、それをさらに進める人はほとんどいませんでした。修道院の庭では、毎年冬になるとエンドウ豆の枠が空のままになっていました。'
      desync: '2月8日の夜にはその方法を説明する時間があっただけで、2回目の会談は決して設定されなかった。 {staff} がリコールされたとき、メンデルの原稿のほとんどはめくられることなく、会議室のテーブルの隅の下に押し込まれていました。'
      not_admitted: '{staff} は協会の会議室に入ることはなく、キャベツ市場で数日間、老婦人が乾燥エンドウ豆を選別するのを手伝いました。丸いものは一つの山に、しわのあるものは別の山に。彼女はそれを数えたことはありませんでした。'
      points:
        p1:
          class_lettered: '2月8日の夕方、協会の会議室に明かりが灯り、雪が溶けて玄関のゴザの上に水たまりができた。メンデルの手には8年分の数字が握られていました。前日、{staff}は、記録管理者がそうするように、原稿を2つの山に分け、今夜の終わりを示す紙片を差し込み、2番目の山に次の講演の日付を書き込んでいた。分割ページに到達したとき、彼は立ち止まり、残りの原稿を四角くしてバッグに入れました。会談が解散したとき、議事録にはすでに次の会談の日付が記されていた、つまり3月8日だった。'
          else: '2月8日の夕方、協会の会議室に明かりが灯り、雪が溶けて玄関のゴザの上に水たまりができた。メンデルの手には8年分の数字が握られていました。前夜、{staff}は、彼が原稿を読み通し、時計に目を光らせ、中間点でコーナーを曲がり、後半を際立たせるのを聞いていた。分割ページに到達したとき、彼は立ち止まり、残りの原稿を四角くしてバッグに入れました。会談が解散したとき、議事録にはすでに次の会談の日付が記されていた、つまり3月8日だった。'
        p2:
          class_teaching: '3月8日には2回目の講演が行われた。彼は、雑種の子孫がどのように分裂するかを説明し、その数字を次々と読み上げ、下の人々は世代と次の世代の区別がつかなくなるまでそれを書き写した。 {staff} は、教師がやるように、部屋の後ろの黒板に、最初の世代に 1 列、次の世代に 1 列の表を描き、数字を読むたびにセルを埋めました。会議の後も数人がテーブルの前に立ち、鉛筆でノートと一行ずつ照らし合わせていた。そのうちの一人が数えてみると、大声で言いました。「三対一」。'
          else: '3月8日には2回目の講演が行われた。彼は、雑種の子孫がどのように分裂するかを説明し、その数字を次々と読み上げ、下の人々は世代と次の世代の区別がつかなくなるまでそれを書き写した。 {staff} は、事前に自分の番号を世代ごとに大きなシートにコピーし、最初の世代で 1 列、次の世代で 1 列を部屋の後ろの壁にピンで貼り付けていました。会議の後も数人がテーブルの前に立ち、鉛筆でノートと一行ずつ照らし合わせていた。そのうちの一人が数えてみると、大声で言いました。「三対一」。'
        p3:
          class_lettered: '3月12日に両方の会談は終了したが、話を聞いた人々はまだ去っていなかった。 {staff} では、記録簿が保管されており、エンドウ豆を再び栽培したい人は名前と住所を残し、その数は翌年返送されることになっていた小さな帳簿が記されていました。メンデルは乾燥エンドウ豆の小袋を取り出し、最初に住所を残した男に手渡した。紙には品種と来年のカウントが書かれていました。男はその包みをコートの内ポケットに入れ、ボタンを留めた。'
          else: '3月12日に両方の会談は終了したが、話を聞いた人々はまだ去っていなかった。 {staff}は、両晩とも最前列に座っていた人々を一人ずつ探し出し、家々に話しかけ、説得された一人が住所を残すよう求めた。メンデルは乾燥エンドウ豆の小袋を取り出し、最初に住所を残した男に手渡した。紙には品種と来年のカウントが書かれていました。男はその包みをコートの内ポケットに入れ、ボタンを留めた。'
      excerpts:
