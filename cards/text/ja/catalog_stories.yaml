    relic: '石膏模型'
    relic_desc: '金庫の小型の吊り下げ模型。'
    points:
      p1: 'ガウディが入院している間、ドメネック・スグラニエスに進行中の作業のリストとワークショップの鍵を渡し、6月に建設が始まるようにしてください。'
      p2: 'Sugranyes に、主要な石膏模型の写真、スケール、図面を 2 番目の場所に保管し、署名済みのリストをワークショップに残すように依頼します。'
      p3: '6月7日の夜、グランビアでトラムが見知らぬ老人をはねたとき、ガウディをすぐに病院に連れて行き、彼を救ってください。'
    points_fail:
      p1: 'ワークショップはガウディが承認するのを待ちますが、彼の同僚はアクティブな作業のリストを取得できません。引き継ぎは中止され、オフィスはその従業員をリコールする。'
      p2: '写真や絵は食器棚の同じ列に保管されます。工房が破損すると石膏模型とともに比較材料が失われてしまいます。'
      p3: '物乞いだと思われた彼は、タクシーが通過する間路上に横たわり、薬局に到着し、遅れて病院に到着し、6月10日にそこで死亡した。'
    shift:
      p1:
        was: 'ガウディは 1926 年 6 月に路面電車の事故で入院し、そこで亡くなりました。ガウディが未完成のまま残した建物は同僚のスグラニエスが担当した。'
      p2:
        was: '1936 年に、工房の原画と石膏模型の多くが失われてしまいました。このプロジェクトは後に断片を利用し、復元用の画像を公開しました。'
        now: '10年後、作業場の食器棚が燃えます。チームは 2 番目のサイトからアルバムと図面を取得します。断片からつなぎ合わせる必要があった 2 つのモデルの顔が、比較できるように現代的な寸法になりました。'
      p3:
        was: '1926年6月7日、ガウディはグランビア通りで路面電車にはねられました。書類もなく、ボロボロの服を着ていた彼は物乞いとみなされ、6月10日に病院で73歳で亡くなった。'
        now: '{staff} は 1 分以内に彼の隣にひざまずき、自分が誰であるかを告げ、彼を外科医に直接連れて行きました。ガウディは回復し、さらに数年間建築現場の作業場に戻ります。'
        who: 'gaudi_barcelona'
        bio: 'ガウディは 1926 年 6 月の路面電車事故で生き残った。彼は建築現場の作業場に戻り、さらに数年間スグラニエスとともに作品を監督し続けた。'
    vignettes:
      tram: '5 月 29 日、{staff} は、後ろのホームに立って、グランビア通りを路面電車に乗りました。車掌は、自分の仕事で最悪なのは運賃ではなく、新聞を横読みする人々だ、と言い、あたかも通り全体を叱責するかのように、あらゆる角でベルを鳴らしている。'
      stone: '6月1日、{staff}は、現場で2人の石工が彫刻されたブロックをモルタルの床に降ろすのを手伝いました。風が吹くと、頭上の塔の隙間から笛が鳴り響き、若い石工は毎日午後になると同じ音を立て、それに合わせて鼻歌を歌い始めたと誓った。'
      water: 'これまでで最も暑い日である 7 月 10 日、{staff} は正午に現場に来る水売りのために水差しを運びました。彼女によると、石切労働者たちは鐘の前に樽を飲み、その後水が粉っぽいと不平を言うが、それは彼らがそうするからそうなるのだと彼女は指摘する。'
  kafka_kierling:
    name: '療養所の校正刷り'
    place: 'キーアリング'
    figure: 'フランツ・カフカ'
    story: '1924年3月、結核がフランツ・カフカの喉頭に達し、嚥下が困難になった。 4月19日、彼はドーラ・ディアマントとともにクロスターノイブルク近郊のキーリングにあるホフマン療養所を訪れた。彼は話すなと言われ、ほとんど紙の上で話した。 5月6日ごろ、医学生のロバート・クロプシュトックが彼の世話を手伝うためにやって来た。 6月2日、彼はまだコレクション「A Hunger Artist」の校正刷りをしていた。彼は6月3日正午頃に40歳で亡くなり、6月11日にプラハに埋葬された。 4つの物語からなる本は8月末にベルリンで出版された。'
    story_prose:
      opening:
        - '1924年5月、ウィーン北方クロスターノイブルク近くのキーリングにあるホフマン療養所。40歳のフランツ・カフカは結核を患っており、3月以来結核が喉頭に達しており、飲み込むのが難しくなっている。彼は庭に面したバルコニー付きの部屋を持っています。話すなと言われて、彼はほとんど小さな紙の上で話します。ドーラ・ディアマントさんはゲストルームを持っていて料理をしてくれますが、5月6日ごろには医学生のロバート・クロプシュトックさんが看護を手伝いに来てくれました。彼は今も、自分でまとめた最後の本であるコレクション「A Hunger Artist」の校正校正を続けています。'
        - '歴史上、嚥下時の痛みがひどく、彼はほとんど食べることができず、医師は8日から10日ごとに痛みを抑える喉頭神経注射を行った。 6月2日、彼はまだ校正校正と両親への最後の手紙を修正していたが、疲れすぎて書き終えることができず、ドーラが彼のために手紙を仕上げた。 6月3日の正午頃に彼は亡くなり、この本がベルリンで出版されたのは8月末になってからだった。この支部には、療養所にはライラックの切り戻しをする庭師と手紙を運ぶ使い走りがおり、村のパン屋にはパン屋の妻がいます。'
        - 'この旅行では、何種類かの人々が助けてくれます。薬の知識があり、鎮痛剤を持っている人、または喉の痛みを和らげるために頭の回転の速い医師です。アーカイブを保管したり校正刷りを読んだりして機敏な頭脳を持っている人、または病気で校正作業が中断されるたびに自分の立場を維持するために、強い意志を持って几帳面で注意深くいる人。看護の訓練を受けた人、または親切で忍耐強い人、または几帳面な人で、見張りをしている人が休めるように用事や手紙を共有してくれる人。アーカイブを保存したり、校正刷りを読んだり、素早く着実に取り組んでいる人、またはベルリンの出版社に製本して先に送ってもらうために、より強い意志を持って几帳面な人。'
      outcomes:
        all: '6月3日正午頃、カフカはキーリングで亡くなった。バルコニーの小さなテーブルの上に、あらかじめ製本されたコピーが置かれ、ページの間には細い紙片が挟まれ、その横には空のボウルが置かれていました。'
        p3: '6月3日正午頃、カフカはキーリングで亡くなった。この数週間、ドーラが運んだボウルはほとんど空になっていました。'
        p4: '6月3日正午頃、カフカはキーリングで亡くなった。事前に製本されたコピーはバルコニーの小さなテーブルの上に置かれ、ページの間に細い紙片が挟まれていました。'
        p2: '6月3日正午頃、カフカはキーリングで亡くなった。順番テーブルは彼らが去る日まで廊下のドアの後ろに固定されたままで、最後のマス目はまだ空でした。'
        p1: '6月3日正午頃、カフカはキーリングで亡くなった。 8月末、ベルリンで『ハンガー・アーティスト』が出版され、その4つのストーリーが彼が最後に修正したとおりに印刷された。'
      none: '6月3日正午頃、カフカはキーリングで40歳で亡くなった。バルコニーの小さなテーブルの上に、未使用の紙片の山が残されていました。'
      desync: '5月19日、鉛筆が落ちたとき、校正刷りは半分修正されました。彼がどの行で立ち止まったのか誰も覚えておらず、修正されたページは残りのページの中に集められました。 {staff}をリコールしたとき、ベランダから風が吹き込んできてトップページをめくってしまいました。'
      not_admitted: '{staff} は療養所には一度も入ったことがなく、クロスターノイブルクの丘の下にある郵便局の外に数回立っただけでした。毎日、使い走りは腕一杯の手紙を持ってやって来たが、その中にはベルリン宛ての分厚い手紙もあった。'
      points:
        p3: '5月11日の正午、ドラがスープを持ってきました。カフカはスプーンを手に取り、再び置き、紙片にいくつかの言葉を書いてそれを押します。医学に詳しい{staff}さんは、食事前に鎮痛剤を投与する方法を医師と相談し、時間を計り、効果が定着してから再びボウルを彼の前に置きます。カフカは非常に小さな口で飲み込み、一口ずつ飲み込みます。残りが半分弱になったら、スプーンをボウルの縁に置き、鉛筆を手に取り、伝票の裏に別の線を書きます。'
        p1:
          class_lettered: '5月19日の午後、バルコニーの小さなテーブルの上に証拠の山が置かれている。添削の途中でカフカが咳き込み始め、鉛筆が床に落ちた。紙で作業するのに慣れていた{staff}は鉛筆を手に取り、立ち止まった行の横に細い紙を滑り込ませ、修正したページを残りのページから2つの山に分け、その上に文鎮を置きます。カフカはしばらく休むと、自分でストリップを引き出し、修正を続けます。緩んだままになっているページの角が風で持ち上げられ、彼は手を差し出してそれを押さえます。'
          trait_vigil: '5月19日の午後、バルコニーの小さなテーブルの上に証拠の山が置かれている。添削の途中でカフカが咳き込み始め、鉛筆が床に落ちた。彼の隣で見張っていた{staff}は鉛筆を手に取り、立ち止まった列の横に細い紙を滑り込ませ、修正したページと残りのページを2つの山に分け、その上に文鎮を置きます。カフカはしばらく休むと、自分でストリップを引き出し、修正を続けます。緩んだままになっているページの角が風で持ち上げられ、彼は手を差し出してそれを押さえます。'
          else: '5月19日の午後、バルコニーの小さなテーブルの上に証拠の山が置かれている。添削の途中でカフカが咳き込み始め、鉛筆が床に落ちた。 {staff} は几帳面で鉛筆を手に取り、立ち止まった行の横に細い紙を滑り込ませ、修正したページを残りのページから 2 つの山に分け、その上に文鎮を置きます。カフカはしばらく休むと、自分でストリップを引き出し、修正を続けます。緩んだままになっているページの角が風で持ち上げられ、彼は手を差し出してそれを押さえます。'
        p2:
          class_medical: '5月21日、廊下には小さな手紙の山がポストを待っており、ドラは何日も玄関から出ていません。看護の訓練を受けた{staff}は、手紙を受け取る時間、郵便局に行って一緒に座る時間などを表に書き出し、廊下のドアの後ろにピンで留め、誰がいつ来て、誰がいつ帰るかをマス目ずつ記入します。午後は、{staff} が部屋に座る番です。ドラは外に出て、フェンスに沿って庭を一周し、ライラックの下でしばらく立っています。'
          else: '5月21日、廊下には小さな手紙の山がポストを待っており、ドラは何日も玄関から出ていません。 {staff} は、思いやりがあり忍耐強く、手紙を受け取る時間、郵便局に行って彼と一緒に座る時間を表に書き出し、廊下のドアの後ろにピンで留め、誰がいつ来て、誰がいつ帰るかを四角形ごとに記入します。午後は、{staff} が部屋に座る番です。ドラは外に出て、フェンスに沿って庭を一周し、ライラックの下でしばらく立っています。'
        p4:
          class_lettered: '5 月 26 日、修正された用紙はベルリンに戻り、本は夏まで印刷されません。 {staff}は事務処理にも印刷業者にも慣れており、ベルリンの出版社に手紙を書き、まず修正したシートを1部に製本して郵送するよう依頼し、カフカが選んだ順序で4つの物語のタイトルを同封した。数日後、使い走りは硬い荷物を丘の上に運びました。カフカは本を膝の上に置き、ページを一枚ずつめくり、最後の話でタイトルの下にしばらく指を置きます。'
          else: '5 月 26 日、修正された用紙はベルリンに戻り、本は夏まで印刷されません。 {staff} は几帳面で、ベルリンの出版社に手紙を書き、まず修正したシートを 1 部に製本して郵送するよう依頼し、カフカが選んだ順序で 4 つの物語のタイトルを同封します。数日後、使い走りは硬い荷物を丘の上に運びました。カフカは本を膝の上に置き、ページを一枚ずつめくり、最後の話でタイトルの下にしばらく指を置きます。'
      excerpts:
        p4: '数日後、使い走りは硬い荷物を丘の上に運びました。カフカは本を膝の上に置き、ページを一枚ずつめくり、最後の話でタイトルの下にしばらく指を置きます。'
        p3: 'カフカは非常に小さな口で飲み込み、一口ずつ飲み込みます。残りが半分弱になったら、スプーンをボウルの縁に置き、鉛筆を手に取り、伝票の裏に別の線を書きます。'
