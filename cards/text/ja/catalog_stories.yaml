catalog:
  sun_yat_sen_guangzhou:
    name: "銅像から新しい大学へ"
    place: "広州"
    figure: "孫文"
    story: "中山大学の孫文像の前から、1924年2月4日の広州へと時をさかのぼる。この日、孫文は三つの学校を統合して国立広東大学を設立するよう命じ、鄒魯に準備を任せた。同じ時期の日曜日には高等師範学校の講堂で講演を行い、何人もの手を経た講演の記録は一冊の本になった。9月19日に授業が始まり、11月11日の創立式典では孫文が書いた校訓が使われた。孫文は1925年3月12日に北京で亡くなり、翌1926年、大学にはその名が冠された。"
    relic: "孫文の銅像"
    relic_desc: "中山大学のキャンパスに立つ銅像。1924年の広州への通り道だが、骨董品ではないので売却できない。"
    points:
      p1: "城外のどこに募集告知を貼るか道順を決め、届け役に渡す"
      p2: "紹介を受けて三校を回り、初会合までに困り事を一枚にまとめて届ける"
      p3: "候補地を見比べ、石牌に決まる前に比較図を届ける"
      p4: "三校の卒業名簿を照合し、6月21日の式典用に一冊にまとめて届ける"
      p5: "石牌へ向かう一行に加わり、新校地の境界杭を立てる"
    points_fail:
      p1: 'この分岐では告示は市内にしか貼られず、城外の学生が知ったときには出願がもう始まっていた。'
      p2: '第一回準備会議は史実どおりに開かれ、三校の困りごとはばらばらに語られたまま、まとめた一覧はなかった。'
      p3: '新キャンパスは史実どおり石牌に決まり、準備室の机には候補地をまとめた地図が一枚もなかった。'
      p4: '6月21日の卒業式は史実どおりに行われた。準備室では三校の名簿を別々に確認することになった。'
      p5: '石牌の校地は史実どおり紙の上で区切られただけで、境界の杭は一本も立たなかった。'
    shift:
      p1:
        was: '1924年6月9日、国立広東大学は各省の教育庁に学生募集を委託し、6月10日に予科試験の出願受付が始まった。募集予定は520人。'
        now: 'この分岐では、城外の辻や波止場にも募集の告示が貼られた。'
      p2:
        was: '1924年3月3日、第一回準備会議が開かれ、議題の最初は三校の学生の卒業問題だった。'
        now: 'この分岐では、会議の机に三校の困りごとをまとめた一覧が置かれた。'
      p3:
        was: '1924年、学校が各地に分散して管理しにくいため、孫文は鄒魯に石牌を新キャンパスに選ばせ、その年のうちに土地が区切られた。'
        now: 'この分岐では、選定の書類の横に、候補地と石牌をまとめて描いた地図が添えられた。'
      p4:
        was: '1924年6月21日、鄒魯が国立広東大学の校長に就任し、同じ日に旧三校の卒業式が行われた。'
        now: 'この分岐では、準備室は確認済みの統一名簿を使って式を進められた。'
      p5:
        was: '1924年、孫文は鄒魯に石牌を新キャンパスとして選ばせたが、新校舎の着工は1933年、最初の学院が移ったのは1934年秋だった。孫文は1925年3月12日に亡くなり、それを見ることはなかった。'
        now: 'この分岐では、11月に孫文が広州を離れる前に、石牌の校地の境界がもう一本ずつ立っていた。'
        who: sun_yat_sen_guangzhou
        bio: 'この時間線では、孫文が広州を離れる前に、新キャンパス石牌の境界が定まっていた。'
    shift_all: "五つの仕事はすべて片付いた。今になって孫文が後に記した校訓を読み返すと、あの仕事が「博学・審問・慎思・明辨・篤行」に重なって見える。"
    vignettes:
      slips: "架空の事務員が原稿を写そうとしている。貼り紙が二行を覆っている。貼り紙と原稿は誰が書いたのかとあなたが尋ねると、彼は貼り紙を動かさず、先に原稿を写す。"
      back_row: "架空の学生が席を見つけられず、何度も立ち上がって辺りを見回す。あなたが長椅子で少し詰めると、彼は黙って最後まで聞き、講堂から人が引いていくときにあなたにうなずく。"
      hundred: "あなたは手帳の最後のページに正の字を書き、一日ずつ数える。百日になったところで、架空の事務員が何を数えているのかと尋ねる。あなたは、日数だと答える。"
  lalibela_rock:
    name: '溝の壁に残る二つの層'
    place: 'エチオピア、ラリベラ'
    figure: 'ラリベラの溝の作業班'
    story: '1966年12月19日、ラリベラで修復工事の第一期が始まった。堆積した土を取り除くと、岩を掘って造った溝が現れた。当時の出土品については、少数の写真が残るだけで、個別に確認できる記録は残っていない。'
    relic: '溝の断面図'
    relic_desc: '地層の厚さと、土に埋まった陶片の位置が記されている。'
    points:
      p1: '次の土を運び出す前に、作業員と地層を測り、陶片の位置を記した断面図の写しを現地に残す'
    points_fail:
      p1: '土が運び出され、この区画で陶片がどこにあったかは測れなくなる。'
    shift:
      p1:
        was: '残されたわずかな写真では、出土品がどの地層のどこにあったかは分からない。'
        now: '断面図の写しが町に残る。後から来た調査員が地層の厚さと陶片の位置を確かめられる。'
    vignettes:
      work: '{staff}が見守る中、作業員の鋤が土を薄く削り、淡い筋が現れる。'
    story_prose:
      opening:
      - '1966年の冬、ラリベラ。溝の曲がり角では濡れた泥の下に色の薄い土が見える。陶片がまだ土に埋まっている。'
      - '工事によって埋もれていた溝は再び姿を現した。当時の出土品の写真はわずかしか残らなかった。'
      - '次の籠が上がる前なら、この壁を測っておくことができる。'
      points:
        p1: '{staff}は作業員に少し待ってもらい、層の厚さと陶片までの距離を測る。作業員の一人が、町に残す図にも同じ寸法を書き写す。'
      outcomes:
        all: '何年も後、調査員が岩壁に定規を当てる。古い図に描かれた淡い層がどの高さにあったかが分かる。'
        p1: '何年も後、調査員が岩壁に定規を当てる。古い図に描かれた淡い層がどの高さにあったかが分かる。'
      none: '壁は平らに削られ、土はひとつ前の籠の中身と混ざった。'
      not_admitted: '{staff}は溝に入れない。縁にいた作業員が糸を板に巻き取る。'
      excerpts:
        p1: '{staff}は作業員に少し待ってもらい、層の厚さと陶片までの距離を測る。作業員の一人が、町に残す図にも同じ寸法を書き写す。'
  ife_bronzes:
    name: '埋め戻し前の発掘図'
    place: 'ナイジェリア、イレ・イフェ'
    figure: 'イタ・イェモー発掘班'
    story: '1957年12月、イレ・イフェのイタ・イェモーで緊急発掘が始まった。現れた陶片敷きのうち、最初の大きな区画には後に屋根が掛けられたが、発掘溝の大半は埋め戻された。後の調査隊は断片的な図や写真から発掘溝の位置を割り出した。'
    relic: '基準線の入った発掘図'
    relic_desc: '道路脇の一本の基準線から、複数の発掘溝の位置が分かる。'
    points:
      p1: '埋め戻し前に共通の基準線から発掘溝を測り、現地で照合できる図をイフェに残す'
    points_fail:
      p1: '溝は埋め戻された。後の調査隊は散在する記録から溝の位置を探すことになる。'
    shift:
      p1:
        was: '初期調査の全体図がなく、後の調査隊は発掘溝の配置を復元した。'
        now: '動かない目印から測った図がイフェに残る。後の調査隊がかつての溝の位置を探せる。'
    vignettes:
      work: '{staff}が見ているうちに、数字に泥のついた巻尺が音を立てて巻き取られた。'
    story_prose:
      opening:
      - '1957年12月、イレ・イフェ。道路脇で、発掘班が陶片敷きの縁を刷毛で払い出している。'
      - '最初の大きな陶片敷きには屋根が掛かる。だが大半の溝は埋め戻され、後に来た人々は記録を集めて位置を探すことになった。'
      - 'まだ溝の縁が見えるうちに、同じ目印から測っておける。'
      points:
        p1: '{staff}は発掘班と道路脇の目印まで巻尺を伸ばし、溝の角までの距離を読み上げる。班員がイフェに残す図にも印を打つ。'
      outcomes:
        all: 'ずっと後、調査員が道路脇の目印から測り、埋まった発掘溝の角までたどり着く。'
        p1: 'ずっと後、調査員が道路脇の目印から測り、埋まった発掘溝の角までたどり着く。'
      none: '最後の角が土に覆われる。基準点のない二枚の図を重ねても、線が合わない。'
      not_admitted: '{staff}は柵の内側に入れない。班員が地面の巻尺を回収する。'
      excerpts:
        p1: '{staff}は発掘班と道路脇の目印まで巻尺を伸ばし、溝の角までの距離を読み上げる。班員がイフェに残す図にも印を打つ。'
  great_zimbabwe:
    name: '石壁の足元に残る土の台'
    place: 'ジンバブエ、マスヴィンゴ'
    figure: '西側囲郭の作業員'
    story: '1915年、大ジンバブエ遺跡の西側囲郭では、土で作られた台や腰掛け、壁の多くが取り除かれた。空積みの石壁を不安定にすると考えられたためだ。土を除いた跡では、その後も侵食が進んだ。'
    story_prose:
      opening:
        - '1915年、大ジンバブエ。西側囲郭の空積みの石壁の足元には、土で作った台と腰掛けがまだ残っている。そこも片づける範囲に入っている。'
        - '史実では、その大半が取り除かれ、むき出しになった穴では侵食が進んだ。この分岐では、作業がそこに届く前に、作業員と接合部を確かめることができる。'
        - '石壁と土のつながりを読み取り、現場の人たちに説明できる人が必要だ。残す場所は土を除く前に見極める。'
      points:
        p1: '{staff}は作業員と土の台が石壁に接するところを確かめ、残せる一角を指し示す。作業員は境界を外へずらした。作業員が台の外側に杭を打つ。土の面についた古い指の跡は、まだ石の継ぎ目に接している。'
      outcomes:
        all: '後に測量に来た人が壁のそばにしゃがみ、残った台に定規を渡した。片方の端は土に載り、もう片方が石に触れた。'
        p1: '後に測量に来た人が壁のそばにしゃがみ、残った台に定規を渡した。片方の端は土に載り、もう片方が石に触れた。'
      none: '作業員は空の籠を運び去った。穴の縁には新しい土の色が出ていて、壁と接していたところに薄い線だけが残った。'
      not_admitted: '{staff}は西側囲郭の作業に加われなかった。内側から下図が手渡されるとき、壁の足元には紙の角だけが見えた。'
      excerpts:
        p1: '作業員が台の外側に杭を打つ。土の面についた古い指の跡は、まだ石の継ぎ目に接している。'
    relic: '壁の断面を描いた下図'
    relic_desc: '空積みの石壁と、その足元に接する土の台を描いた紙。'
    points:
      p1: '作業員と石壁の足元を確かめ、作業が始まる前に土の台の一部を残してもらう'
    points_fail:
      p1: '史実と同じように、土の構造物の大半は取り除かれ、この部分も残らない。'
    shift:
      p1:
        was: '1915年、西側囲郭の土の台や腰掛け、壁の多くが撤去された。'
        now: 'この分岐では、土の台の一部が元の場所に残る。後の測量でも、石壁との接し方が分かる。'
    vignettes:
      lines: '{staff}は壁の足元を目で追う。台の縁は石の継ぎ目まで来て低くなる。'
      width: '{staff}は下図を手に持つ。石と土は別々の線で引かれている。'
      pace: '{staff}は石段に腰を下ろし、靴から乾いた泥を砂の上へ落とした。'
  euclid_alexandria:
    name: '『ポリスム』がまだあったころ'
    place: 'アレクサンドリア'
    figure: 'エウクレイデス'
    story: '紀元前300年ごろ、エウクレイデスはアレクサンドリアで全十三巻の『原論』を書き、定義と公準から幾何学の命題を一つずつ証明した。三巻の『ポリスム』や円錐曲線についての本なども書いたが、これらは後に失われた。西暦四世紀のパッポスはまだ『ポリスム』の内容を紹介し、命題の数を記録できた。'
    relic: '青銅のコンパス'
    relic_desc: '二本の脚と一つの軸で、本にあるどの図も描ける。'
    points:
      p1: '『ポリスム』三巻の写しを何部か作り、失われないよう弟子たちに渡す'
    points_fail:
      p1: '『ポリスム』の写本は一系統のままだった。この分岐でも書は失われ、パッポスの短い記述だけが残った。'
    shift:
      p1:
        was: '紀元前300年ごろ、エウクレイデスは三巻の『ポリスム』を書いた。書は後に失われ、171という命題の数と、四世紀のパッポスによる短い紹介だけが知られている。'
        now: '{staff}は『ポリスム』の写しを何部か作るのを手伝い、幾何学を学ぶ弟子たちに渡した。この分岐では、書は後世の読者に伝わった。'
        who: 'euclid_alexandria'
        bio: 'この分岐では『ポリスム』の写本が広く出回り、後の読者は『原論』以外の著作も読むことができた。'
    vignettes:
      lost: '写本師の机に『ポリスム』の巻物がある。後世の人はパッポスの数行から中身を想像するしかないと、{staff}は知っている。{staff}はしばらく巻物の端に手を置き、それから離した。'
      arcs: '{staff}は弟子たちにならい、杭と紐で砂盤に円を描く。二つの弧が交わり、三点目ができる。{staff}は砂をならして描き直した。二度目は手がぶれなかった。'
      papyrus: '{staff}はパピルス売りと一緒に束を岸へ運び、どの紙が港の湿気に強く、どれが一年で脆くなるかを聞く。'
    story_prose:
      opening:
        - '紀元前300年ごろ、アレクサンドリア。エウクレイデスはここで全十三巻の『原論』を書き、定義と公準から出発して幾何学の命題を一つずつ証明した。第一巻の最初の命題では、二つの円だけで、与えられた線分の上に正三角形を作る。ほかにも三巻の『ポリスム』や円錐曲線についての本を書いた。'
        - '史実では、『ポリスム』は後に失われた。西暦320年ごろ、パッポスはまだその内容を紹介でき、定理が171、補題が38あると記した。それ以降の写本は知られていない。この分岐では、砂盤に図を描く弟子が一人いて、波止場のパピルス売りはどの紙が湿気に強いかを知っている。'
        - '写本を作り、校合し、保管できる人が力になれる。弟子たちに幾何学を教えられる人や、一行ずつ確かめる根気と知識を持つ人にも出番がある。'
      outcomes:
        all: '後の世の読者の棚には、『原論』の隣に『ポリスム』の三巻が並んだ。何度も手に取られて、巻物の縁は柔らかくなっている。'
        p1: '後の世の読者の棚には、『原論』の隣に『ポリスム』の三巻が並んだ。何度も手に取られて、巻物の縁は柔らかくなっている。'
      none: '砂盤をならして、新しい円を描く。パッポスの後、あの三巻を開く者はいなかった。'
      not_admitted: '{staff}は写本を作る部屋に入れなかった。波止場では、パピルス売りがまだ紙の束を岸へ運んでいる。'
      points:
        p1:
          class_teaching: '教えるときと同じように、{staff}は『ポリスム』三巻を砂盤のそばの熱心な弟子たちに分け、写しを互いに読み上げさせて、字も図も一つずつ照らし合わせた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
          class_lettered: '写本工房の手順で、{staff}はパピルスを裁ち、『ポリスム』を一巻ずつ写して、字も図も原本と照らし合わせた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
          else: '{staff}は『ポリスム』を書き写す手元を見守った。一巻仕上がるたびに原本と写しを並べ、図を順に確かめた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
      excerpts:
        p1: '写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
  socrates_athens:
    name: '船が戻るまで'
    place: 'アテナイ'
    figure: 'ソクラテス'
    story: '紀元前399年、ソクラテスはアテナイで裁かれ、死刑を宣告された。アテナイが毎年デロス島に送る船は出たばかりで、戻るまでは刑を執行できなかった。彼は牢で約三十日を過ごし、イソップの寓話を詩にした。友人たちは毎日見舞いに来た。最後の日も病気のプラトンを除いて全員が集まり、夕方、彼は毒杯を飲んだ。'
    relic: '市場の陶杯'
    relic_desc: '黒い釉薬がかかったアテナイの杯。縁が少し欠けている。'
    points:
      p1: '陪審席が騒がしくなっても、ソクラテスが弁明を終えられるよう場を静める'
      p2: 'イソップの寓話の詩とアポロンへの賛歌の完成を手伝い、写しを牢の外に届ける'
      p3: '最後の日までにプラトンを治療し、牢で師に付き添えるようにする'
    points_fail:
      p1: '騒ぎで弁明がかき消され、最後まで話せなかった。分岐の同期が外れ、事務所は職員を呼び戻す。'
      p2: '史実と同じく、この分岐にも詩は残らなかった。'
      p3: '史実と同じくプラトンはその日も病気で、師のもとへは来られなかった。'
    shift:
      p1:
        was: '紀元前399年。ソクラテスはアテナイで裁判にかけられた。プラトンの『ソクラテスの弁明』では、陪審員に何度も騒がないよう求める。裁判は有罪となり、死刑が宣告された。'
      p2:
        was: '紀元前399年。ソクラテスは執行を待つ間、繰り返し見る夢に従ってイソップの寓話を詩にし、アポロンへの賛歌を作った。いずれも完全な形では残っていない。'
        now: '友人が詩を書き写した巻物を牢から持ち出し、アテナイに残した。'
      p3:
        was: '紀元前399年。ソクラテスが牢で毒杯を飲んだ日、友人たちはその場にいた。プラトンは病気で来なかった。'
        now: 'プラトンは回復し、友人たちと牢で最後まで付き添った。'
        who: 'plato_academy'
        bio: 'この分岐では、プラトンは病気から回復し、ソクラテスの最後の日を牢で共に過ごした。'
    vignettes:
      rumours: '裁判の前日、{staff}は広場の三つの屋台で老人の罪状を尋ね、三通りの答えを聞いた。{staff}はすべて書き留め、どれが法廷で読み上げられるか待った。'
      harbour: '毎夕、{staff}はペイライエウスの港へ下りて魚屋にデロス島の船が戻ったか尋ねる。答えはいつも同じで、{staff}は帰りを待つべきか、遅れを願うべきか分からない。'
      gate: '{staff}は牢の塀際で灯油を売る女のために水を運び、代わりに塀の下に座る場所をもらった。見舞い客は毎日夜明けから門で待つので、{staff}はその顔を見覚えた。'
    story_prose:
      opening:
        - '紀元前399年、アテナイ。ソクラテスは不敬と若者を堕落させた罪に問われ、陪審の前に立つ。生涯にわたり道や広場で人々に問いかけたが、自らは一冊も書き残さなかった。後世の人は、プラトンとクセノポンの著作を通して彼を知る。'
        - '史実では、デロス島へ向かう船が裁判の前日に出た。船が戻るまで刑の執行が禁じられていたため、ソクラテスは牢でさらに三十日ほど待った。繰り返し見る夢に従い、そこでイソップの寓話を詩にしたが、詩は後世に伝わらなかった。最後の日には友人たちがそろい、病気のプラトンだけが来なかった。この分岐では、牢の塀際で灯油を売る女がいて、ペイライエウスの魚屋には港へ入る船が一隻残らず見える。'
        - '騒ぎ出した人々を落ち着かせる人、詩句を聞き取って巻物に写せる人、薬を知り病人を診られる人に出番がある。'
      outcomes:
        all: 'デロス島から船が戻り、魚屋は遠くからその帆を見つけた。最後の夕べ、牢は友人たちでいっぱいで、プラトンもその中に座っている。詩の巻物はその後も、アテナイのある家の長持の底に収まっていた。'
        p3: '最後の夕べ、牢は友人たちでいっぱいだった。プラトンもその中に、最後まで座っていた。'
        p2: '詩の巻物は、アテナイのある家の長持の底で年月を過ごした。パピルスの縁が毛羽立っている。'
        p1: '三十日後、デロス島からの船がペイライエウスに入り、魚屋は遠くから帆を見つけた。その日、友人たちは夜明けから牢の戸口で待っていた。'
      none: 'デロス島から船が戻り、魚屋は遠くからその帆を見つけた。夕方、牢では友人たちが輪になって座った。口を開く者はいなかった。'
      desync: '法廷のざわめきが大きくなり、弁明は言葉の途中で途切れた。{staff}は法廷を出る前に事務所へ呼び戻された。'
      not_admitted: '{staff}はアテナイに居場所を得られず、牢の塀際で一息つける場所さえなかった。デロス島の船はまだ海の上にいる。'
      points:
        p1: '裁判の日、木の腰掛けは何列も陪審員で埋まっていた。ソクラテスが話すたび、怒号が声をかき消す。{staff}は傍聴席から立ち上がり、声を張らずに両手をゆっくり下げ、一列ずつ見渡して、静まるのを待って腰を下ろした。ソクラテスは途切れた言葉の先を語った。話し終えると外套の裾をたぐり、演壇に静かに立った。'
        p2: '牢に光を通すのは高いところの小窓だけだった。ソクラテスが一行読むと、{staff}が蝋板に刻んで拍子を取って読み返し、一拍多ければ蝋をならして書き直した。イソップの寓話が一つずつ詩になり、最後にアポロンへの賛歌が続いた。夜、{staff}は壁際の灯火で、蝋板の文字をパピルスの巻物に写した。翌朝早く、見舞いに来た友人がそれを懐に入れ、胸に手を当てたまま牢の門を出た。'
        p3:
          class_medical: '最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}は医師の手順で診察し、薬を調えて決まった時刻に飲ませ、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。'
          else: '最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}はナノ救急箱を開け、説明に従って処置し、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。'
      excerpts:
        p3: '明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。'
        p2: '夜、{staff}は壁際の灯火で、蝋板の文字をパピルスの巻物に写した。翌朝早く、見舞いに来た友人がそれを懐に入れ、胸に手を当てたまま牢の門を出た。'
        p1: 'ソクラテスは途切れた言葉の先を語った。話し終えると外套の裾をたぐり、演壇に静かに立った。'
  cao_xueqin_beijing:
    name: '最終章のあとの白紙'
    place: '北京・西山'
    figure: '曹雪芹'
    story: '『石頭記』の初期の写本は、曹雪欽の存命中に注釈付きのコピーが流通したことを証明しています。その原稿の後の欄外注記は、曹雪芹の死を未完のまま残された本と関連付けています。シナリオは彼の最後の冬に設定されており、彼の死の正確な日付や彼が書いた章の数は固定されていません。'
    story_prose:
      opening:
        - '西丘陵では暗くなるのが早いです。写本家がページの小包を持ってやって来て、何を持っていけるか尋ねました。彼はその小包をベッドのそばの小さなテーブルに置きます。その上に白紙のシートが置かれています。'
        - '注釈付きの『石頭記』は、曹雪欽が生きていた時代にすでに流通していました。 Jiaxu の原稿の後のメモには、本が完成する前に彼が亡くなったことが記憶されています。この想像上の冬の訪問では、彼自身が山積みを整理する時間がまだあります。'
        - '写本家は暗くなる前に家に帰りたいと思っています。原稿に詳しい人なら、作業中のページから注釈付きのコピーを選ぶことができます。他人の世話をすることに慣れている人は、火やランプに目を向けることができます。そうすれば、テーブルの上にドラフトを広げるためのスペースが生まれます。'
      points:
        p1: '写し手はベッドのそばでばらけたページの束を束ねようとしている。あなたは余白にあるもう一方の手の線を見つけて、彼にそれを読んでもらいます。彼は注釈付きのコピーを個別に包み、曹雪芹がまだ修正中のページを手の届くところに戻します。包みは一つずつ、別々の紐で結んだ。'
        p2: '石炭が消えると、曹雪芹は今開いたページを閉じます。あなたは石炭を持ってきた人に火の世話をし、ランプを近づけて、曹雪芹が読んでいたページだけを渡すように頼みます。彼はカバーの下から手を伸ばし、再びラインを手に取ります。その晩、灯は手の届くところにあった。'
        p3: '後の続編では家が再び栄える、と曹雪芹に話した。彼は眉をひそめ、第五回で鳥たちが散っていく歌の末尾を開き、あたり一面が真っ白になる一節を指した。評語のある写本を開き、滅びた明を悼む本だという後世の読み方をどう思うかと尋ねた。曹雪芹は大笑いした。ひと言も答えなかった。再び筆を取ると、考えが決まった紙にだけ印を付けた。写し手は印のある箇所を写し、あとは空けておいた。'
      outcomes:
        all: '写し手は2枚のシートを持って帰ります。一緒に読むと、曹雪芹がどの章を整理し、どの選択をまだ検討しているのかがわかります。彼の笑いの意味を誰も書き留めていない。'
        p1: '写本家は注釈が付けられた初期のコピーを持って帰ります。曹雪芹がまだ読みたいと思っている原稿がベッドのそばにある。'
        p2: 'ランプはベッドのそばで少し長く燃えます。曹雪芹は取っておいたページを読み終える。'
        p3: 'マークされた部分はコピーされ、未決定のスペースは空白のままになります。写本家は自分自身の推測を省きます。'
      none: 'ページは入ってきたときと同じように積み重ねられています。後で誰かが最後の章について尋ねても、白紙の紙は何も答えません。'
      not_admitted: '写し手が中に入ります。あなたは書類をベッドサイドテーブルに運ばずに、中庭にランプが一つだけ残るまで待ちます。'
      desync: '注釈付きのコピーは作業ページに戻ります。写し手はそれを持たずに去り、オフィスはあなたを呼び戻します。'
      excerpts:
        p1: '包みは一つずつ、別々の紐で結んだ。'
        p2: 'その晩、灯は手の届くところにあった。'
        p3: '写し手は印のある箇所を写し、あとは空けておいた。'
    relic: '章の計画をまとめたゆるやかなシート'
    relic_desc: 'いくつかの章の提案された順序と、曹雪芹がまだ決定していなかった内容のための空白部分が含まれたゲームの記念品。'
    points:
      p1: '曹の作業ページが彼に返される間、注釈が付けられた初期のコピーはコピー作者の手に保管してください'
      p2: '曹雪芹がエンディングをじっくり考えながら楽しい夜を過ごすことができるように、火とコピーに注意してください'
      p3: '曹雪芹にはそれを検討する力がまだ残っているが、彼が引き継ぐことに同意した章の計画の別のコピーを残しておこう。'
    points_fail:
      p1: 'このテーブルにある唯一のコピーは、作業ページの山に戻されます。この分岐では、読者は注釈付きのテキストなしで終了します。'
      p2: '書類の準備が整う前に部屋が寒くなってしまいます。仕事はまた夕方を待ちます。'
      p3: '写本家はバラバラのページを整理することはできるが、曹雪芹がどのような終わり方で去るつもりだったのかについては記録がない。'
    shift:
      p1:
        was: 'Jiaxu の写本には、曹雪芹 の生涯の間にコピーされていた初期のテキストに関するメモが保存されています。'
      p2:
        was: 'Jiaxu の原稿の欄外メモには曹雪芹の死が記されており、この本は未完のまま残されたと記されている。'
        now: 'この分岐では誰かが火の番をし、ページを一度に 1 枚ずつ持ってきます。曹雪芹はある晩、物語の方向性を決める時間をとります。'
      p3:
        was: 'Jiaxu の欄外注ではこの本は未完成であるとされており、曹雪芹が承認した最終章の計画は示されていない。'
        now: '写経師は2枚のシートを取り上げます。一人は曹雪芹がこの支部で承認した命令を出します。もう1つは、彼がまだ決定していない運命をリストします。次のコピーでは、2 枚のシートは一緒に残ります。'
        who: 'cao_xueqin_beijing'
        bio: '曹雪芹は死ぬ前に写本家と章の計画を検討します。この分岐では、読者は後で彼がどのような決断を下したのか、どこで結末を未解決のままにしたのかを確認できます。'
    vignettes:
      ink: '写本作成者は、提案された章の順序と読者が鉛筆で書いた推測との間にズレを設定します。これで、ページを正しい場所に戻すことができます。'
      paper: '{staff}はランプを持ち込みます。写し手は原稿をテーブルの端から持ち上げてスペースを空けます。'
      empty: '最後のシートには別の見出しを入れる余地があります。写し手はスペースをそのままにしておきます。'
  jenner_berkeley:
    name: '最初のワクチン'
    place: 'イングランド・バークリー'
    figure: 'エドワード・ジェンナー'
    story: 'ジェンナーの 1798 年の調査書には、牛痘と天然痘に関する初期の観察と事例が記録されています。'
    story_prose:
      opening:
        - 'バークレーでは、サラ・ネルメスがエプロンに手を添えて玄関にやって来ます。ジェンナーさんは、最初に病気になったのはいつだったか尋ねたいと考えています。写本家は自分の名前を他人のアカウントの下に置きます。彼女はドアのところで待ち、まずその日は酪農場に戻らなければならないかどうか尋ねます。'
        - 'ジェンナーの 1798 年の調査には、サラの牛痘と 1796 年の初期の予防接種が記録されており、伝統的にジェームズ・フィップスと関連付けられています。このブランチでは、サラが望んでいるケアから始めて、その後の観察を戻ってきた人々まで追跡できるように支援することができます。'
        - 'まずは介護経験のある人にサラの話を聞いてもらいましょう。記録を残している旅行者は、ジェンナーと家族がさらなる観察のために戻るかどうかを決定している間、名前と日付を確認することができます。'
      points:
        p1: '写本師はデートを待っています。サラは手を引っ込めて席を求めました。あなたは椅子をドアに移動し、介護者に見てもらいたいかどうか尋ねます。彼女が「はい」と答えたら、酪農場に後で戻ってくるという連絡を送ります。帰り際、サラは空いた手で自分の名前が書かれた紙片を受け取った。'
        p2: 'ジェンナーさんのノートのページには少年の再訪問が記されており、その下には小切手を求められた日付はまだ書かれていない。最初の記録とその後のレポートを区別するための新しいシートをコピー作成者に渡します。ジェンナーは、さらなる観察のために誰が戻ってくるのか尋ねます。ある世帯は住所を残します。書き手は日付を書き込み、一家が来たときに確かめられるよう一行空けた。'
      outcomes:
        all: 'サラさんには手伝ってくれる人がいて、戻ってきた人たちは確認できる記録を持っています。ジェンナーはその年の観察を通じて作業を続けることができます。'
        p1: 'サラが酪農場に戻るまでには数日かかる場合があります。その後の記録は依然として他の人々の復帰に依存しています。'
        p2: '経過観察については相談が必要です。サラはまだ手の痛みを自分で我慢しなければなりません。'
      none: 'サラは助けなしに酪農場に戻りますが、その後の観察を手配する人は誰もいません。'
      not_admitted: '写本師は訪問者がどの家族と一緒に来たのかを確認します。外にいても、日付の欄はまだ空白です。'
      excerpts:
        p1: '帰り際、サラは空いた手で自分の名前が書かれた紙片を受け取った。'
        p2: '書き手は日付を書き込み、一家が来たときに確かめられるよう一行空けた。'
    relic: 'フォローアップ伝票'
    relic_desc: '名前、日付、観察内容を記入するスペースが記載された伝票。'
    points:
      p1: '牛乳を注ぐ女が一人で傷つかないように、サラ・ネルメスの手の牛痘の傷を手当てしてください'
      p2: '初期の症例記録の名前と日付を確認し、復帰に同意した家族とのフォローアップを手配します。'
    points_fail:
      p1: '彼女の手の傷は、誰もそれを治す人もなく自然に治りました。この分岐では、牛乳を注ぐ人の日々を楽にする人は誰もいませんでした。'
      p2: '誰も再訪問を手配しません。この部門では、歴史と同様に、ジェンナーは 1798 年にワクチン接種の研究を再開します。'
    shift:
      p1:
        was: '1796 年 5 月、酪農婦のサラ・ネルメスは主人の牛から牛痘にかかり、その病気の通常の症状とともに大きな膿疱性のただれが彼女の手に形成されました。'
        now: '{staff} さんは手を清潔に保ち、縛られたままにし、数日早く酪農場に戻りました。'
      p2:
        was: '1796 年の初期の症例の後、ジェンナーは 1798 年の春にワクチン接種の研究を再開しました。'
        now: '{staff} は、希望する家族との再訪問の手配を手伝ってくれました。その夏、ジェンナーは以前の観察と照合するためのフォローアップメモを残していました。'
        who: 'jenner_berkeley'
        bio: 'この年表の中で、ジェンナーは 1796 年の夏に戻ってくることに同意した家族からフォローアップのメモを受け取りました。'
    vignettes:
      firsthand: '架空の写本家がすべての記述を同じ声で書きました。作家が実際に見たのはどれかと尋ねます。写経者は、すべての行に同じ重みを与えるのではなく、休符の横に音符を追加します。'
      order: 'コピーでは 2 つの観察結果が入れ替わりました。あなたが日付をチェックすると、コピー担当者はその注文を使ってストーリーを語る前に伝票を裏返します。'
      blank: 'コピー作成者が確認できないメモの下にスペースを残します。ページが渡されるまでに、空白部分にはラベルが付いているので、誰もそれを省略と間違えることはありません。'
  mallory_everest:
    name: '最後に目撃された登攀'
    place: 'エベレスト'
    figure: 'ジョージ・マロリー'
    story: '1924 年の遠征で残されたマロリーの手紙には、さまざまな収容所の状況と計画が記載されています。マロリーとアーヴィンの運命は、彼らが頂上に到達したかどうかを証明するものではありません。'
    story_prose:
      opening:
        - 'ノースコルのテントのそばで誰かが、ノートンが下山後目を開けることができるかどうか尋ねました。別の登山者が次の登山の準備をしているマロリーの方を見上げます。先ほどのテントにあったコンパスはまだ戻ってきていない。'
        - 'ノートンとサマヴェルは 1924 年にエベレストの高みに引き返し、マロリーとアーバインは次に向かいました。 6月8日、オデルは2人の登山者がまだ登っているのを目撃したが、どちらも戻ってこなかった。この分岐では、前のグループを助け、コンパスを返し、次のグループが北コルに戻るのを手伝うことができます。'
        - 'ノートンとサマヴェルの世話をできる人を送ってください。キャンプの引き継ぎに詳しい旅行者ならコンパスを見つけることができます。最後の下りでは、次のパーティーがキャンプに戻るのを手伝ってくれる人を送ってください。'
      points:
        p1: 'ノートンがまた声を掛けた。サマヴェルは答えられず、膝に手を置いた。先に行った仲間を呼び戻して、サマヴェルが腰掛けられる場所を探し、具合を自分で話せるまで待った。彼がうなずいたので、二人で足元の荷袋をどけた。立ち上がると、ノートンが具合を尋ね終わるまで待った。'
        p2: 'ノートンは光が痛いと言い、再び目を閉じた。あなたは彼にどこで休むかを選択してもらい、オフィスの介護者に見てもらいます。しばらくしてから、一か所がまだ痛むが、もう片方の目で光が見えるようになったと彼は言います。係が名簿を持ち上げると、ノートンは自分の欄を見つけられた。'
        p3: 'オデルはキャンプ V でケースを開け、予備品の横に小さな丸い箱を見つけます。あなたはそれをマロリーのメッセージと照合し、タグと一緒に持ってきます。彼は別の登山者の前でそれを開け、途中で使う予定のポケットに滑り込ませた。彼はザックを下ろさずに手が届くところへ、自分でコンパスをしまった。'
        p4: '北コルの誰かが、雲から出てくる二人の人影が彼らが待っている人たちなのかと尋ねます。店員に名前を入力するよう頼む前に、名前を言うのを待ちます。マロリーは雪の上に荷物を置き、アーヴィンは雪のさらに奥に座っています。二人は下山の様子を話した。登頂したかどうかも、その時刻も、キャンプの誰にも分からなかった。'
      outcomes:
        all: 'サマヴェルとノートンが戻ってきて、マロリーはコンパスを持っています。北コルで返還されたあと、さらに 2 人の名前が記録されています。'
        p1: '第一パーティの登山者は両方ともキャンプに戻ります。次のペアには、まだ出会う人が必要です。'
        p2: 'この枝では、ノートンは近くの文字を自分で読めるほどよく見ることができます。その他の成果は旅の残りの後に続きます。'
        p3: 'マロリーは手の届くポケットにコンパスを入れています。その帰還により、彼らの最果ての地点は不確実になります。'
        p4: 'マロリーとアーバインはノースコルに生きて戻ります。変更された降下により、彼らが頂上に到達したかどうかはわかりません。'
      none: '風と雪がキャンプに到達しても、誰もリストを変更しません。オデルは後に尾根で最後に見た二人の人影を記録する予定だ。'
      not_admitted: 'キャンプの係員は見知らぬ人にテントの場所を与えません。彼らが不足している機器について話し合っている間、あなたは外で待ちます。'
      desync: 'サマヴェルはノートンと一緒に戻ってくることはありません。先ほどの下降は同期が取れなくなり、事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '立ち上がると、ノートンが具合を尋ね終わるまで待った。'
        p2: '係が名簿を持ち上げると、ノートンは自分の欄を見つけられた。'
        p3: '彼はザックを下ろさずに手が届くところへ、自分でコンパスをしまった。'
        p4: '二人は下山の様子を話した。登頂したかどうかも、その時刻も、キャンプの誰にも分からなかった。'
    relic: 'ピッケル'
    relic_desc: '頭が擦り切れた白木のピッケル。'
    points:
      p1: 'サマヴェルが下り坂で窒息したときは、彼が息を取り戻すのを手伝い、ノートンとの試みが無事に終わるのを見届けてください。'
      p2: 'ノートンの雪盲を治す'
      p3: 'マロリーがキャンプVに残したコンパスを彼の手に渡す'
      p4: 'マロリーとアーバインを引き返すか、下る途中で合流して、二人が生きてノースコルに到着できるようにする'
    points_fail:
      p1: 'サマヴェルは雪の中に座り込んだまま起き上がれない。 2人の登山者のうち1人だけが戻ってきます。この分岐は歴史から消え去り、事務所はその従業員を召還した。'
      p2: 'ノートンさんの目は痛くて開けられず、その後数日間は何も見えなくなりました。'
      p3: 'コンパスはまだキャンプ V のテントの中にありますが、2 人が 6 月 8 日に登ったとき、彼らはコンパスを持っていませんでした。'
      p4: '6月8日の正午過ぎのある時点で、オデルは尾根の上でまだ登っている二人を最後に見た。彼らは戻ってこない。'
    shift:
      p1:
        was: '1924年6月4日、ノートンとサマヴェルはキャンプVIを出発し、約8,570メートルに到達した。下りの途中、サマヴェルの喉が凍傷組織でふさがれ、窒息しそうになり、咳き込んで、二人ともキャンプに到着した。'
      p2:
        was: '1924年6月4日の夜、ノートンは重度の雪目になり、ノースコルに戻った後もほとんど目が見えなくなりました。'
        now: '翌日にはノートンの目は晴れ、ノースコルを行き交う人々が見えるようになった。'
      p3:
        was: '1924年6月7日、マロリーはキャンプVIからオデルにコンパスをキャンプVのテントに置き忘れたが、彼らにはコンパスがなかったとのメモを送った。'
        now: '6月8日早朝に出発したとき、マロリーは自分のポケットにコンパスを入れていました。'
      p4:
        was: '1924 年 6 月 8 日、オデルはマロリーとアーバインが北東の尾根を高く登るのを最後に目撃しましたが、二人とも戻ってきませんでした。マロリーさんの遺体は1999年に標高約8,160メートルで発見された。'
        now: '6月9日、二人は凍傷になったが生きていた状態でノースコルに降り立った。マロリーはルースと3人の子供たちのいるイギリスに帰りました。彼らがあの日どこにたどり着いたのか、このタイムラインにも答えはありません。'
        who: 'mallory_everest'
        bio: '1924年、彼とアーヴィンは生きてエベレストから降り立った。彼は妻ルースと3人の子供たちの住む家に帰り、さらに何年も暮らしました。'
    vignettes:
      date: '架空の使者は異なる陣営からの 2 通の手紙を持っていますが、携帯伝票には 1 通の日付が共通しています。見出しを個別に確認するように依頼します。各手紙は独自の場所と日付を残して出発します。'
      question: '使者は意図的な出発を約束として読み上げます。あなたは手紙が天気について語っている文で止まります。今回も条件を付けたまま計画を繰り返す。'
      wrap: 'メッセンジャーが膝の上で書類を分類している間、あなたは送信用の封筒を脇に置いておきます。キャンプリストを手紙の中に折らずにしまうことができます。'
  nightingale_scutari:
    name: '記録とケアから始まる看護'
    place: 'オスマン帝国・スクタリ'
    figure: 'フローレンス・ナイチンゲール'
    story: 'フローレンス・ナイチンゲールの軍の健康に関する 1858 年の報告書は、最近の戦争を参考にしており、病院の統計も含まれていました。最終的なレポートの作成ではありません。'
    story_prose:
      opening:
        - 'スクタリの病棟ではシフトが変更になったところです。ナイチンゲールは事務員に転校リストを渡し、新規の入学者とは別に保管するよう頼んだ。衛生委員会が到着し、3人の委員が見回りを始めようとしています。'
        - '衛生委員会は 1855 年 3 月にスクタリの病院を査察しました。ヘクター・ギャヴィンは 4 月にバラクラヴァでの事故で亡くなりました。ナイチンゲールは5月にそこで重篤な病気になり、すぐに回復しましたが、その後は健康状態が悪化しました。ここで、検査を保存し、検査に何が起こるかを変更できます。'
        - '病棟の記録に詳しい人が検査の進行を手伝ってくれます。キャンプでは、旅行者にギャヴィンを見張ってもらいます。後で、介護をしている人がナイチンゲールにどのように休みたいかを尋ねることができます。'
      points:
        p1: '事務員は異動リストを新規入学として数えます。看護師に両方のシートを読んでもらい、委員がドアに到着する前に重複したものにマークを付けます。次の場所について尋ねる前に、問題を区に報告することができます。誰かが二冊の帳簿を持って出てきた。どちらにも白いページがまだたくさん残っていた。'
        p2: 'ギャヴィンはテントにいる弟にリボルバーを渡そうとしている。キャンプの安全責任者が取りに来るまで、両者に一時停止するように頼みます。中のテーブルで、ギャヴィンは持ち去ろうとした衛生ノートを開きます。その日の午後、署名をもらいに来た人は、彼を同じ机で見つけた。'
        p3: 'ナイチンゲールは数字の表を送り、それが来たら脇に置いておいてほしいと頼みます。あなたは、オフィスの介護者に留まってもらいたいかどうかを尋ね、答えはまた別の日に来ると期待していると伝えます。気持ちが強くなると、彼女はまず窓を少し開けるように頼みます。それから彼女はどこで中断したのかと尋ねます。次に報告書を開いたとき、すぐに署名を済ませろと急かす人はいなかった。'
      outcomes:
        all: '検査は時間通りに続きます。ギャヴィンはこの支部での事故から生き残り、ナイチンゲールは五月病から回復しました。彼女は自分で選択できるペースで仕事に戻ります。'
        p1: '委員会は検査を開始し、さらなる作業のために使用可能なリストを削除します。'
        p2: 'ギャヴィンは無事にキャンプに残った。彼は衛生ノートに記録された作業を続けることができます。'
        p3: 'この分岐ではナイチンゲールの回復が早くなります。彼女は、いつフィギュアを再度開くかを選択します。'
      none: 'リストはしばらく病棟内で混在したままになる。知らせを待っている人々は、依然として4月と5月の手紙を待ち続けるだろう。'
      not_admitted: 'ポーターは視察団以外の人たちに待機を要請する。看護師が転送リストを再度確認する音が聞こえます。'
      desync: '検査が時間通りに始まらない。病棟の記録が同期しなくなり、事務所は旅行者を呼び戻すことになる。'
      excerpts:
        p1: '誰かが二冊の帳簿を持って出てきた。どちらにも白いページがまだたくさん残っていた。'
        p2: 'その日の午後、署名をもらいに来た人は、彼を同じ机で見つけた。'
        p3: '次に報告書を開いたとき、すぐに署名を済ませろと急かす人はいなかった。'
    relic: '小さなオイルランプ'
    relic_desc: '彼女の夜のランプが回る。'
    points:
      p1: '病棟で発疹チフスとコレラが発生しているため、スクタリ病院に対する衛生委員会の検査を3月6日から続けてください。'
      p2: 'バラクラバのテントでリボルバーの発砲を止め、衛生委員のヘクター・ギャヴィンを救出せよ'
      p3: 'ナイチンゲールが5月にバラクラヴァで罹ったクリミア熱を、生涯続く前に治す'
    points_fail:
      p1: '病棟では検査が滞り、詰まった下水道の開通が間に合わない。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。'
      p2: 'テント内で発砲され、この支部でも、上陸から1か月後に委員会は3人の委員のうち1人を失うことになる。'
      p3: '熱は下がります。彼女は5月末までに危険を脱したが、この分岐では歴史と同様に病気が彼女につきまとっている。'
    shift:
      p1:
        was: '1855年3月6日、衛生委員会はコンスタンティノープルに到着し、その日の午後スクタリの病院の調査を開始した。'
      p2:
        was: '1855年4月21日、クリミア半島で衛生委員のヘクター・ギャヴィンが兄にリボルバーを渡した際に発砲し、殺害された。'
        now: '{staff} は両方の男性に一時停止を求めます。ギャヴィンはリボルバーを下ろし、キャンプの安全責任者を呼びます。彼は委員会の仕事を続け、その後英国に戻ります。'
      p3:
        was: '1855 年 5 月、ナイチンゲールはバラクラヴァの病院を視察に行き、数日以内にクリミア熱に感染しました。彼女は約12日間危険な病気にかかり、その後の人生のほとんどを障害者でした。'
        now: '{staff} は、今世紀にない薬で最初の数日間の発熱を治療します。ナイチンゲールは一週間以内に回復し、自宅で続いた病気も治らずスクタリに戻ります。'
        who: 'nightingale_scutari'
        bio: 'ナイチンゲールは、1855 年にバラクラヴァで罹った熱病をこの支部で治しました。彼女は病室からではなく、自らその足で病院と軍の保健に関する仕事を続けました。'
    vignettes:
      totals: '架空の事務員が転送リストを入学者数の合計に追加します。どのような名前が新たに認められるのか尋ねます。彼らは、返品を送信する前に、転送を独自の列に残します。'
      name: '店員は部屋の騒音で名前を聞くことができません。言った人がもう一度言えるようになるまで、その人の隣で待ちます。次のコピーでは、彼らが尋ねたとおりに綴られています。'
      fold: '事務員が声をかけた順に病棟の書類をセットします。以前は合計の後に表示されていたシートが、合計の前に表示されるようになりました。'
  scott_last_camp:
    name: '棚氷の上のテント'
    place: 'ロス棚氷'
    figure: 'ロバート・ファルコン・スコット'
    story: 'スコットの最後の日記の日付は 1912 年 3 月 29 日です。残された原稿には、南極点から帰還する途中の一行の最後のキャンプが記録されています。返却後の読書風景を想像します。'
    story_prose:
      opening:
        - 'ロス棚氷を越えて風が吹くと、氷河からの石が入った袋がそりの上に落ちます。スコットは日記を冒頭から遠ざけます。明日どこまで行けるか、先を行く人は誰も約束できません。オーツはブーツを脱いで、どこか乾いた場所に座れる場所を尋ねました。'
        - '1912 年 3 月、スコットの一行は帰還途中でトラブルに見舞われた。オーツはテントから出たまま戻らなかった。スコットと他の2人はワントン補給所から約11マイルで拘束された。日記と標本をまとめて保管し、オーツとスコットを順番に助け、残りの一行を倉庫まで連れて行くことができます。'
        - '寒い中荷物を運べたり、他の人の世話をしたりできる人を派遣してください。介護者に各人に何が必要かを尋ねさせ、最後に歩くのが最も遅い人に十分な時間を与えます。'
      points:
        p1: '石の袋を一つ降ろそうという声がした。ウィルソンに札の採取地を読んでもらい、スコットには日誌の場所を確かめてもらった。暗い中で取り出す必要のないものは下に入れ、石と日誌はそれぞれ置き場所を決めた。テントをたたむとき、そりの側面には氷河の名がまだ読めた。'
        p2: 'オーツはトランクを開けようとして、そこに留めます。今回は速く走れないと彼は言う。あなたは彼にテントの中に座って、残って見守ってくれる人と明日のペースについて話し合うように頼みます。翌日テントの入口が開くと、自分の靴がほかの靴と並べられるのを待って立ち上がった。'
        p3: 'スコットによれば、右足には左足のように体重がかからなくなったという。あなたは彼の世話をできる人に電話し、荷物を運ぶ人たちにしばらくラインを下ろしてもらいます。スタートで彼はしっかりと足を踏み入れてから、移動の合図をします。最初の区間を歩き終え、彼は足を止めて進んだ距離を日記に書けた。'
        p4: 'ドリフトがテントを押しつける。残り11マイル。全員が準備ができたと言うのを待ち、車両基地を知っている人と順番に方向を探します。旗のところで、誰もが中身を見に行く前に最後の人を待ちます。補給所の物資のそばで、新しいページを開いた。鉛筆はまだ紙の上を走った。'
      outcomes:
        all: '日記と岩が一行とともに倉庫に到着します。オーツとスコットは他の仲間とともにこの困難を乗り越え、日記には新しい一日が始まります。'
        p1: '記録と標本は最後の日まで保管されます。パーティーが荷物を軽くしなければならないときは、彼らはそりに乗ったままになります。'
        p2: 'オーツはパーティーに残る。次の停留所では、他の人たちと一緒に車内で休むことができます。'
        p3: 'スコットはしっかりと足を踏み入れることができる。チームの残りのメンバーに何が起こるかは、まだ最後の展開にかかっています。'
        p4: '最後まで頑張って車両基地に到着する人々。報告書には、残りの旅行に従って彼らの到着が記録されます。'
      none: '燃料も体力も消耗してしまう。風がテントを固定し、3月下旬には記録が止まってしまう。'
      not_admitted: '党には新人が入る余地がなかった。あなたは燃料と岩がまだ充電されている状態で、外に留まります。'
      desync: '日記や標本は歴史的記録が終わる前に残されます。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: 'テントをたたむとき、そりの側面には氷河の名がまだ読めた。'
        p2: '翌日テントの入口が開くと、自分の靴がほかの靴と並べられるのを待って立ち上がった。'
        p3: '最初の区間を歩き終え、彼は足を止めて進んだ距離を日記に書けた。'
        p4: '補給所の物資のそばで、新しいページを開いた。鉛筆はまだ紙の上を走った。'
    relic: '日記'
    relic_desc: '寒さで硬くなった、鉛筆で書かれた小さな日記。'
    points:
      p1: '燃料が不足し体力も衰える行軍の中で、ビアードモア氷河からの日記と岩石標本をそりに乗せてください。'
      p2: 'オーツの凍傷の足を治して、3 月 16 日前後にテントから出ずにパーティーに参加できるようにする'
      p3: '3 月 18 日までに、パーティー全体の進行を遅らせる凍傷からスコットの右足を救ってください。'
      p4: '3 月 21 日に始まる吹雪の中を 3 人を連れて行き、最後の 11 マイルを越えて 1 トン基地まで向かいます'
    points_fail:
      p1: '標本は氷棚に放置され、日記は最終日に達しません。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。'
      p2: '足の状態は日に日に悪くなり、この分岐でも3月16日頃に川の流れに出てしまい、戻ってきません。'
      p3: '足がすくみ、この分岐では、歴史上そうであったように、行進はゆっくりと這うように減速します。'
      p4: '吹雪がテントをその場に留め、3月29日以降、日記には新しいページがなくなった。'
    shift:
      p1:
        was: '1912年3月、帰りの燃料が不足していた一行は、ビアードモア氷河で採取した日記とグロソプテリスの化石をそりに積んだ。捜索隊は11月12日にテントと一緒に彼らを発見した。'
      p2:
        was: '1912 年 3 月初旬、オーツの足は重度の凍傷に見舞われ、動きが鈍くなりました。 3月16日か17日に彼はテントから出て行き、再び姿は見えなかった。'
        now: '{staff} さんは毎晩足を温め、靴下を履き替えていますが、凍傷は悪化しませんでした。オーツはそりの横でペースを保ち、最後のキャンプでもまだ一行と一緒にいます。'
      p3:
        was: '1912年3月18日、スコットは右足のつま先がほぼすべてなくなり、行進はさらに遅くなったと書いている。'
        now: '{staff}はキャンプのたびに右足を温めて包み込む。スコットが足を止め、一行は昔のペースで北へ進んでいく。'
      p4:
        was: '1912年3月21日から猛吹雪が起こり、スコット、ウィルソン、バウワーズはワントン補給所から11マイル離れたテントの中に閉じ込められた。最後の日記の日付は3月29日で、捜索隊は11月12日にテントを発見した。'
        now: '{staff} は風が止む中、3 人を北へ導き、最後の 11 マイルを短いステージに分けて進みます。彼らはワントン補給所で燃料と食料を見つけ、吹雪にも耐えます。冬の前に、彼らはケープエバンスに戻ります。'
        who: 'scott_last_camp'
        bio: 'このタイムラインでは、スコットはウィルソンとバウワーズとともに極地から生きて戻り、エバンス岬に到着しました。彼は英国に戻り、遠征の日記と科学的結果を自ら編集しました。'
    vignettes:
      distance: '政府機関に戻ると、架空の事務員が移動距離という見出しの列に距離をコピーします。あなたは彼らに、それがまだ先の距離であることを示します。コピーを提出する前にエントリを移動します。'
      blank: '代理店に戻ると、事務員は最終日のところで立ち止まります。その先の空白部分にどのようにマークを付けるかを彼らが決定するまで、あなたは待ちます。彼らはここで記録が終わると書き、鉛筆を置きます。'
      opening: '代理店に戻り、練習用コピーを開いて、ストーリーの前の日付を読みます。店員は、ページが再び順番に見つかるように、表紙に同じ日付を記入します。'
  seacole_balaklava:
    name: '自分でたどり着いた先の宿'
    place: 'バラクラヴァ'
    figure: 'メアリー・シーコール'
    story: 'メアリー・シーコールの 1857 年の回想録には、彼女がトーマス・デイとともにバラクラヴァ近くで経営していたブリティッシュ・ホテル、そこで販売されていた商品、そして 1855 年にそこに来た人々について記述されています。'
    story_prose:
      opening:
        - 'バラクラヴァ通り沿いのホテルはカウンターをオープンしたばかりです。メアリー・シーコールは臨時病院用のバッグをドアに向かって押します。トーマス・デイは何が売りに出されたのか尋ねます。彼女はまず負傷者の手当てをしてから報告に戻るつもりだという。'
        - '1855年6月18日、シーコールは臨時病院の近くで負傷者を助け、親指を負傷したと記録している。デイと一緒に経営していたホテルでも盗難に遭った。和平の後、夫婦は 1856 年に破産しました。病院で仕事を保存し、彼女の怪我、馬、家畜の世話を別々に助けることができます。'
        - '介護経験のある方を派遣します。ホテルを知っている旅行者は厩舎を見ることができます。後で、追加の在庫を注文するかどうかを決定する前に、両方のパートナーの帳簿を確認できる人を雇ってください。'
      points:
        p1: '道行く人が、臨時病院に何か送ってもらえないかと尋ねます。ドアのそばにあるバッグと水を渡し、ベッドのそばで待っているシーコールに確認します。病院に着くまでに、質問者さんはバッグを置ける場所を見つけました。彼女はそれを開き、いちばん近くにいる患者に何が要るか尋ねた。'
        p2: 'シーコールさんは右手を支え、親指を動かすと痛いと言う。あなたは彼女の世話をする訓練を受けた人に電話して、どこに座りたいかを尋ねます。彼女が運んでいたバッグを別の人が奪います。休んだあと、彼女は手を上げて痛みが引いたと言い、患者の名を書く紙片を頼んだ。'
        p3: '裏口から物音が聞こえてくる。番頭が立ち上がると馬小屋に誰も監視していないことに気づきました。一人がシーコールに電話し、もう一人が庭が見える場所から馬の数を数えてもらいます。外にいる人は誰でも庭の答えを聞いて立ち去ります。夜明けには、荷馬車につなぐ馬がまだ水桶のそばにいた。'
        p4: '新たな注文を入れる日が近づいています。シーコールは棚にある商品を声を出して数えるように彼に頼みます。注文、在庫、未払いの負債を 1 枚のシートに記入し、軍隊が出発する前に何が売れるかを尋ねます。パートナーはそれを一度確認し、次回の配送をキャンセルします。シーコールが帳簿を閉じると、カウンターの奥には最後の引き取り分に使う空の棚が残った。'
      outcomes:
        all: 'シーコールさんは臨時病院に到着し、その後も手を使えるようになりました。馬小屋は満室のままで、ホテルが閉まるとパートナーが帳簿を清算します。'
        p1: '彼女は予定通り仮設病院で人々の世話をし、その夜ホテルに戻る。'
        p2: '誰かが彼女の親指まで気を配っているので、メモに戻るときはペンを使う方が簡単です。'
        p3: 'その夜、馬は厩舎に残ります。朝、荷車を持っている人々は、荷車がどこにあるかを知っています。'
        p4: 'シーコールとデイは清算をする。最後の配達により、軍隊が帰国するときに売れ残った在庫が残ることはありません。'
      none: '誰も在庫を数え終えておらず、道沿いの人々はまだ誰かが迎えに来てくれるのを待っています。'
      not_admitted: '店員は訪問者にドアをふさがないようにお願いします。入院バッグは持っていくリストに載っていません。'
      desync: 'シーコールは歴史の道で助けた場所に辿り着けない。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '彼女はそれを開き、いちばん近くにいる患者に何が要るか尋ねた。'
        p2: '休んだあと、彼女は手を上げて痛みが引いたと言い、患者の名を書く紙片を頼んだ。'
        p3: '夜明けには、荷馬車につなぐ馬がまだ水桶のそばにいた。'
        p4: 'シーコールが帳簿を閉じると、カウンターの奥には最後の引き取り分に使う空の棚が残った。'
    relic: '薬箱'
    relic_desc: 'ハーブとガーゼを入れるためのコンパートメントが付いた古い木製のチェスト。'
    points:
      p1: 'レダン号への攻撃が失敗した6月18日、シーコールはウォロンゾフ・ロードの仮設病院の横で砲火の下で仕事を続ける。'
      p2: '彼女が甲羅から身を投げて右手の親指を脱臼したときは、その場で関節を固定して副木を固定します'
      p3: 'ブリティッシュ ホテルの馬を狙って夜にやってくる泥棒を阻止する'
      p4: 'セヴァストポリ陥落後、平和によって破産しないようにシーコールとトーマス・デイに株の購入をやめて清算するよう説得する'
    points_fail:
      p1: 'その日、彼女は臨時病院に到着することはなく、負傷者たちは包帯も巻かずに道路脇で待機していた。この分岐は歴史にそぐわないものであり、事務所はその従業員を召還した。'
      p2: '親指は急いで縛られるだけで、この枝では歴史のように、決して正しい形に戻ることはありません。'
      p3: '朝までに馬小屋の半分は空になり、ホテルは荷物を運ぶために陸上輸送キャンプから動物を借りなければなりません。'
      p4: '和平後に軍が撤退すると株は売れなくなり、1856年11月に両社はロンドンで破産宣告を受ける。'
    shift:
      p1:
        was: '1855年6月18日、連合軍によるリダン号攻撃が失敗した日、シーコールは包帯と食糧を砲火の下でウォロンゾフ道路沿いの仮病院まで運び、医師たちの負傷者の治療を手助けした。'
      p2:
        was: '1855年6月18日、シーコールは砲弾から逃れようと身を投げ、右手親指を脱臼した。それはその場で縛られ、二度と元の形に戻りませんでした。'
        now: '{staff} はジョイントを設定し、その場で副木を固定します。数週間後、彼女の右手は以前と同じように薬を調合し、包帯を結びました。'
      p3:
        was: '1855年、スプリングヒルのブリティッシュホテルは何度も強盗に遭った。ある朝、ほとんどの馬がいなくなっていました。'
        now: '{staff} は夜警中に馬を先導する男たちを止めます。翌日、ホテルのカートはいつものようにバラクラヴァへ向かいます。'
      p4:
        was: '1856 年 3 月の和平の後、軍隊はすぐに撤退し、シーコールとデイには売れ残った株と借金が残されました。 1856年10月に彼らに対して破産申し立てが行われ、11月に破産が宣告された。'
        now: '{staff} は秋に 2 社のパートナーを説得して、大量注文を中止し、未払い金を回収するよう説得しました。平和が訪れると、彼らの持ち株は少なくなり、清算を終えてクリミアを離れ、決して破産裁判所に立つことはない。'
        who: 'seacole_balaklava'
        bio: 'このタイムラインでは、シーコールは破産することなく、ある程度の自己資金を持ってクリミアから帰国しました。彼女は公的保険で生活する必要はなく、自分のお金で介護と旅行を続けました。'
    vignettes:
      meal: '架空の顧客は、何のために来たのか説明できないほど長時間立っています。まずは席を見つけます。係員が戻ってくるまでに、顧客は自分の言葉で夕食を求めることができます。'
      counter: '2 人の顧客が同じ注文を繰り返し、お互いが相手の言葉を聞いていないと思っています。あなたは係員に、彼らが書いたものを読み返してもらいます。トレイは1つあれば十分であることがわかります。'
      shelf: '係員がカウンターの端に空きを求めます。空になった皿を 2 枚移動し、待っている客が次の客を待たずに座れる場所にスツールを置きます。'
  wegener_greenland:
    name: '氷床を越えて'
    place: 'グリーンランド氷床'
    figure: 'アルフレート・ヴェーゲナー'
    story: 'ヴェーゲナーは 1930 年に物資を携えて内陸のアイスミッテ駅に到着し、その帰路に死亡しました。アルフレート・ヴェーゲナー研究所の記述には遠征の順序が保存されており、グリーンランド人の仲間であるラスムス・ウィルムセンが特定されている。'
    story_prose:
      opening:
        - 'グリーンランドの氷にかかるそりの荷重が再び数えられた。ヴェーゲナーは、ロエベが自分の足でやっていけるかどうか尋ねます。ヴィラムセン氏は、視界が良くなったら、まだその先にある場所がアイスミッテであることを認識する必要があると言う。'
        - '1930 年 10 月、アルフレッド ヴェーゲナー、フリッツ レーベ、ラスムス ヴィルムセンはアイスミッテに到着しました。ロエベは宿泊しました。ヴェーゲナーは帰国途中に亡くなり、ヴィラムセンと彼が持っていた日記も行方不明となった。このブランチでは、到着を保存し、旅のさまざまな時点で各人を助けることができます。'
        - '雪上経験のある人を派遣して、一行の移動と物資の受け渡しを手伝ってもらう。介護者にロエベとヴェーゲナーを別々にチェックしてもらいます。西側陣営がヴィラムセンをいつ予想するかを確実に知っておいてください。'
      points:
        p1: 'そりの後ろしか見えません。ヴィラムセン氏は党にしばらく活動を休止するよう要請した。最初のシートに手渡す物資をマークし、全員が残りの距離を進む前に、最後の人にそれぞれの物資を呼び出すようにします。観測所の一行が出てくると、そこにいる人と待機中の荷物を数えた。'
        p2: 'ロエベは凍傷になった足を休め、乾いた靴下はどこに行ったのか尋ねます。他の人が介護に行く前に、介護者に話を聞いてもらうように頼みます。数日後、彼は別の場所に座ってみるかどうか尋ねられました。寝台のそばに掛けてあったものを手に取り、自分で選んだ腰掛けへ移った。'
        p3: '誰かが日記を書類と一緒にバッグに入れ始めました。ヴィラムセンはまずそれを見てほしいと言う。あなたは彼に到達できる場所を選ばせ、西側陣営が彼を待つべきだという知らせを送りました。そりが入ってくると、誰かが自分のものを取りに前に出ます。ヴィルムセンは荷物の脇から日誌を取り、自分の手で渡した。'
        p4: '帰りのテントの中で、ヴェーゲナーは誰か先に連絡を送ってくれないかと尋ねる。あなたはその要求を外に出して、介護者を連れ戻してどのくらい休みたいかを尋ねます。一行が西のキャンプに到着すると、入り口にいる人が毛布を持ってきて座るように言います。まだ手が震えていたが、ヴェーゲナーは到着者名簿に自分の名を書いた。'
      outcomes:
        all: '救援隊が日程を決め、ロエベは治療を受ける。その後、ヴェーゲナーとヴィルムセンは西のキャンプに到着し、日記はそれを待っていた人々に手渡されました。'
        p1: '一行は10月30日に駅に到着し、物資がリストと照合される。'
        p2: 'ロエベの足は駅でのケア後に改善し、この分岐では手術を回避しました。'
        p3: 'ヴィラムセンと日記は西のキャンプに戻ります。このレポートは、旅の他の部分に関するヴェーゲナー自身の結果を追跡しています。'
        p4: 'ヴェーゲナーは生きて西の陣営に到着する。日記の引き渡しは、ヴィラムセンに何が起こったかにかかっています。'
      none: '氷の上の最後のストレッチはさらに時間がかかります。西側の到着リストにはまだ空白行がある。'
      not_admitted: '物資リストには訪問者が入る余地はない。誰かがあなたに、そりのそばで働いている人々から離れて立つように頼みました。'
      desync: '一行は10月30日の到着を逃す。引き継ぎは同期が取れず、オフィスは旅行者をリコールします。'
      excerpts:
        p1: '観測所の一行が出てくると、そこにいる人と待機中の荷物を数えた。'
        p2: '寝台のそばに掛けてあったものを手に取り、自分で選んだ腰掛けへ移った。'
        p3: 'ヴィルムセンは荷物の脇から日誌を取り、自分の手で渡した。'
        p4: 'まだ手が震えていたが、ヴェーゲナーは到着者名簿に自分の名を書いた。'
    relic: 'そりストラップ'
    relic_desc: '荷物を積んだそりから凍った革製のストラップ。'
    points:
      p1: 'ヴェーゲナー、ロエベ、ヴィルムセンが10月30日にアイスミッテに到着できるよう、救援隊を氷の最後の区間まで続けさせよう。'
      p2: '凍傷になったロエベの足を治療し、氷の洞窟で足の指を切断しなくても済むようにする'
      p3: 'ヴィラムセンがヴェーゲナーの日記を持ってキャンプに到着できるように、西へ向かう途中でヴィラムセンを安全に見守ってください'
      p4: '帰りにヴェーゲナーを氷の上で治療し、彼が生きて西側キャンプに入ることができるようにする'
    points_fail:
      p1: '一行は寒さのため氷上で開催され、10月30日には駅に到着しなかった。この分岐は歴史から消え去り、事務所はその従業員を召還した。'
      p2: 'ロエベの凍傷になった足の指は救えなかった。その冬、駅で二人の交通が遮断され、彼は春まで歩くことができなかった。'
      p3: 'ヴィラムセンはヴェーゲナーを埋葬し、日記を持って西へ向かった。再び彼を見た人は誰もおらず、日記も彼とともに失われてしまった。'
      p4: 'ヴェーゲナーさんは11月中旬頃、帰国途中、氷上のテントの中で亡くなった。翌年５月に発見された。'
    shift:
      p1:
        was: '1930 年 10 月 30 日: 氷上で 40 日間を過ごした後、ヴェーゲナー、ロエベ、ヴィラムセンは氷床の真ん中にあるアイスミッテ駅に到着しました。'
      p2:
        was: '1930年冬: アイスミッテで、ロエベは凍傷に陥った足の指をポケットナイフで切り落とされ、残りの冬の間歩くことができなくなった。'
        now: 'ロエベはつま先を保った。彼は駅で自分の足で冬を過ごした。'
      p3:
        was: '1930年11月：ヴィラムセンはヴェーゲナーを氷の上に埋め、日記を持って西へ向かう。彼は決して見つかりません。'
        now: 'ヴィラムセンは西の野営地に到着し、ヴェーゲナーの日記を遠征隊の手に渡した。'
        bio: 'ラスムス・ヴィラムセンは 1930 年 11 月に氷から戻り、グリーンランドの家族のもとに帰りました。'
      p4:
        was: '1930年11月1日：ヴェーゲナーは50歳の誕生日にアイスミッテを去る。彼は11月中旬頃に氷上で亡くなり、1931年5月12日に遺体で発見された。'
        now: '{staff} は帰り道ずっと彼と一緒にいて、毎晩彼の強さを観察しました。彼は生きて西部キャンプに入り、遠征隊の測定結果が判明するのを生きて見ました。'
        who: 'wegener_greenland'
        bio: 'ヴェーゲナーは 1930 年 11 月に氷床の真ん中から生きて戻りました。彼はさらに何年も生きて、遠征隊の観察がうまくいくのを見ました。'
    shift_all: 'このタイムラインでは、その秋にアイスミッテに出入りした人は全員、生きて海岸に戻ってきました。'
    vignettes:
      names: '架空の書記官は、遠征隊を 1 つの姓のみでリストします。誰が荷物を引き渡したのか尋ねます。彼らは、最もよく知られた名前だけを記録するのではなく、他の関係者のためにラインを残します。'
      count: '店員は最初のカウントを配達された数量のように見せました。各図がどの駅から来たのかをマークしてもらいます。 2 つの合計は同じ見出しの下に置かれなくなりました。'
      note: '店員が空の帳簿を結びつける間、あなたは宛先を 2 枚目の伝票にコピーします。次の人は、エントリがどのステーションに関するものであるかを知ることができます。'
  tupaia_tahiti:
    name: '航海士の海図'
    place: 'エンデバー号の船上'
    figure: 'トゥパイア'
    story: 'ライアテア島出身の航海士トゥパイアは 1769 年にエンデバー号に加わり、知っている島々の地図作成を手伝いました。船は1770年6月に現在のクイーンズランド州沖の岩礁に衝突した。バンクスは修理中のトゥパイアの壊血病を記録し、同年後半にバタビアでタイアタとトゥパイアの死亡を報告した。'
    story_prose:
      opening:
        - 'エンデバー号で、トゥパイアは船が衝突したときに知っている島の名前を確認していました。束がテーブルの角から滑り落ち、監視員が助けを求めた。船がサンゴ礁の上で速く進んでいることを知ったとき、彼らはまだ暗いです。'
        - 'エンデバー号は 1770 年に現在のクイーンズランド州沖の岩礁に衝突しました。乗組員は船を再浮上させて修理しました。トゥパイアはその期間中に病気になり、バンクスは数カ月後にバタビアでタイアタとトゥパイアの死の知らせを記録した。この分岐は船を保存し、トゥパイアに生鮮食品を届け、病気のときに二人が一緒に過ごす時間を与えることができる。'
        - '乗組員がステーションを維持できるように支援できる人を派遣してください。修理中、誰かがトゥパイアに何を食べられるか尋ねるべきです。バタビアでは、一行はベッドサイドへの訪問を手配する時間が必要です。'
      points:
        p1: '船倉から荷を上げる通り道を木箱がふさいでいる。ポンプを交代する人のために場所を空け、箱を運ぶ船員が通れるようにした。綱の反対側にいる者たちは、合図が来たら一緒に引けるようそばで待った。船が動いたとき、最初に気にかかったのは、ポンプのそばの者がまだ立っていられるかだった。'
        p2: '生鮮食品はまず修理業者に送られます。トゥパイアは名前が呼ばれるのを聞いて、どれくらい待つ予定かを尋ねます。あなたは、彼が食べたいものを選ぶことができる部分を持ってきて、それから次のグループのために残ったものを記録します。皿が届くと、彼は取り分けてあったものの中から先に選ぶことができた。'
        p3: 'バタビアの部屋には多くの病人がいて、同じ介護者が呼び出され続けています。トゥパイアは、タイアタが彼に会えるかどうかを誰かに尋ねます。あなたは質問をパスし、椅子をベッドに移動する前に、両方が同意するのを待ちます。部屋を出るとき、二人はまだ互いの声が聞こえるところにいた。'
      outcomes:
        all: '歴史上、船は無料で提供されます。同支部は、トゥパイアの食べ物の分け前やベッドサイドへの訪問も記録している。二人の死亡のニュースは記録に残っている。'
        p1: 'Endeavor は無料で提供されます。修理担当者はさらに多くの作業を行う必要があります。その後の取り決めが残っている。'
        p2: 'トゥパイアは自分が選んだ部分を受け取ります。記録のこの部分は、プレートが彼に運ばれたところで終わります。'
        p3: '二人は少しの間話すことができるほど近くにいる。バタビアでの死者は今も続いている。'
      none: '人々はまだ甲板で次の命令を待っています。新しい分け前は確保されておらず、その後の訪問も手配されていません。'
      not_admitted: '乗組員は、割り当てられていない人々にポンプでステーションを撤去するよう依頼します。反対側からは、誰かが濡れた紙の束を拾っているのが見えます。'
      desync: 'エンデバー号は夜明けでも速いです。歴史的な回復が同期しなくなり、オフィスは旅行者を呼び戻します。'
      excerpts:
        p1: '船が動いたとき、最初に気にかかったのは、ポンプのそばの者がまだ立っていられるかだった。'
        p2: '皿が届くと、彼は取り分けてあったものの中から先に選ぶことができた。'
        p3: '部屋を出るとき、二人はまだ互いの声が聞こえるところにいた。'
    relic: '島々のスケッチ'
    relic_desc: '小さな島の形と名前が描かれたインクとウォッシュのシート。'
    points:
      p1: '船がサンゴ礁に衝突した夜、船を軽くしてポンプを動かし、エンデバー号を浮かせるのを手伝ってください。'
      p2: '修理隊が供給される間、トゥパイアのために生鮮食品を取っておき、彼に食べられるものを選ばせてください'
      p3: 'バタビアでは、トゥパイアがタイアタと一緒に座って、病気のときに誰に近くにいてほしいかを尋ねる時間を作ります'
    points_fail:
      p1: '夜明けの時点でも、船は船倉の上に水があり、サンゴ礁の上を高速で航行しています。支店は歴史と同期しなくなり、オフィスはその日の従業員を呼び戻します。'
      p2: '新鮮な物資はまず修理業者に送られます。トゥパイアは分け前を待たなければなりません。'
      p3: '周囲の人々は他の病床に呼び出される。トゥパイアが求めた訪問は待たなければならない。'
    shift:
      p1:
        was: '1770年6月10日から11日：エンデバー号は現在のエンデバー礁に衝突した。乗組員は大砲6門、バラスト、水、腐敗した貯蔵庫を船外に投げ込み、彼女は上げ潮に乗って漂流した。'
      p2:
        was: '1770年6月16日: バンクスは、トゥパイアはひどい壊血病を患っており、歯肉がなくなり、足には赤い斑点があり、船内の治療薬は役に立たなかったと書いた。'
        now: 'この分岐では、船が修理されている間、トゥパイアが生鮮食品の分け前を持っています。彼は、最初に何かを捕まえに行かなくても、何を食べるかを選ぶことができます。'
      p3:
        was: 'バタビアでは、バンクスはタイアタの死の知らせを受け取り、次にトゥパイアの死の知らせを受け取った。'
        now: 'このブランチでは、{staff} が トゥパイア が Taiata の近くに座る場所を作ります。二人は誰がそこにいて、一緒に少し話す時間を持てるかを選びます。'
    vignettes:
      pronounce: '{staff} は、ゲーム用に作られた写本師に、2 番目の島を描く前に 2 つの綴りを声に出して読むよう依頼し、代わりに名前の横に疑問符を付けます。'
      route: '{staff} は、2 つのマークの間に直線を引く前に、どの島から方位が与えられたかを尋ね、線は引かれないままにします。'
      room: '{staff} はシートの丸まった角を押さえるので、前の名前を隠さずに新しい名前を書くことができます。'
  ulugh_beg_samarkand:
    name: 'サマルカンドを出る道'
    place: 'サマルカンド'
    figure: 'ウルグ・ベク'
    story: 'ウルグ ベクはサマルカンドに天文台を建設し、1,018 個の星のカタログを管理しました。 1449年の秋、彼は権力を失い、メッカへ旅行する休暇を与えられた。彼は10月下旬にサマルカンド近郊で殺害された。彼の墓の日付は10月27日であり、別の情報源が示した日付の2日後である。'
    story_prose:
      opening:
        - 'サマルカンドでは、道路用の束が新しく積み上げられたスターテーブルの横にあります。ウルグ・ベクは政権を譲り、党は外で待機している。ある人が、街を出て最初の夜をどこで過ごすつもりかと尋ねます。'
        - 'ウルグ・ベクはサマルカンドで天文学の研究に参加しました。 1449年、彼は市を去った後に殺害された。ここで、彼が最初の行程でどこに滞在するかを確認し、一緒にいたいかどうかを尋ねることができます。'
        - '一行と話し、旅行者の世話ができる人を派遣してください。ウルグ・ベクにどこに立ち寄りたいかを尋ね、家族が彼を受け入れられるかどうかを確認してください。'
      points:
        p1: 'ウルグ・ベクさんは、すでに誰かが荷物を呼びに来ており、その夜どこに座れるか分からないと述べた。あなたは同行者に、遠くにある世帯はドアを開けたままにしておいてもよいと伝え、ウルグ・ベクに一緒に行きたいかどうか尋ねます。彼はスターテーブルを誰かに預け、軽いバッグを持って行きます。着くと、彼は案内してくれた人にも腰を下ろすよう勧めた。'
      outcomes:
        all: 'ウルグ・ベクは街を離れ、滞在先へ到着する。この分岐では、その夜彼が無事だったという知らせが入った。'
        p1: '誰かが彼に同行して、彼が滞在することに同意した場所に行きます。スターテーブルは市内に残っています。'
      none: '彼はすでに荷物を待っている人々と一緒に出発します。次のニュースは、彼が市の外で殺害されたというものだった。'
      not_admitted: '訪問者はパーティーに参加できません。テーブルは屋内に残っており、外にいる人々は荷物を持って出ていきます。'
      excerpts:
        p1: '着くと、彼は案内してくれた人にも腰を下ろすよう勧めた。'
    relic: '2 つの情報源を含む伝票'
    relic_desc: '古い星の位置と新しい観測値を示す 2 つのマークされた行。'
    points:
      p1: 'ウルグ・ベクが権力を手放した後、旅の最初の行程で滞在できる場所を手配し、一緒に行くことを申し出る'
    points_fail:
      p1: '彼はすでに彼を待っている会社を残して出発します。次にあなたが聞くニュースは、彼が街の近くで殺されたというものです。'
    shift:
      p1:
        was: 'ウルグ・ベクは統治を放棄した後、サマルカンドを出発し、1449年10月下旬にサマルカンド近郊で殺害された。'
        now: 'この分岐では、{staff} はウルグ ベクと一緒に滞在することに同意した場所に行きます。彼はサマルカンドからの脱出の旅で生き残った。'
        who: 'ulugh_beg_samarkand'
        bio: 'このタイムラインでは、ウルグ ベクは 1449 年の秋にサマルカンドから無事に到着し、生き続けました。'
    vignettes:
      source: '{staff} は、古いテーブルから取得した位置と今夜測定した位置が同じ行に位置しないように、コピー作成者のシートに狭い列見出しの原点を追加します。'
      arc: '{staff} は、円弧の溝の曲線に沿ってコードを敷設し、石工と一緒に端から端まで歩いて、曲線が正しいかどうかを確認します。'
      hold: '{staff} は火鉢とボードを持って弧のそばに座り、星が壁の下に沈むまで、呼び出されるたびに測定値を書き留めます。'
  darwin_galapagos:
    name: '島々と生き物の多様性'
    place: 'ガラパゴス諸島'
    figure: 'チャールズ・ダーウィン'
    story: 'ダーウィンは 1835 年 9 月から 10 月にかけてビーグル号に乗ってガラパゴス諸島を訪れました。チャールズ島ではローソン副知事から、カメは島ごとに違うと言われました。ダーウィンは後に、当時は十分な注意を払っておらず、すでに 2 つの島のコレクションを混合していた、と書いています。 10月8日から17日まで、彼とバイノーとその使用人たちはジェームズ島でキャンプをし、その間船は水を汲みに行ったが、テントの近くには貧弱な小さな泉しかなかった。彼の鳥の記録はマネシツグミの標本を特定の島と関連付けます。'
    story_prose:
      opening:
        - 'ビーグル号はダーウィンの一行を岸に降ろし、どこかの水辺へ行ってしまいました。ジェームス島のテントはたった今建てられました。キャンプのそばの小さな泉はゆっくりと流れており、同じ紙に 2 つの鳥のラベルが書かれています。'
        - '1835年、ローソン知事代理はダーウィンに対し、島のカメは区別できると語った。ダーウィンは後に、自分は十分に注意を払っていなかった、と書いている。ジェームス島の一行は水が少ない状態で船を待った。早期に区別を保存して、陸上部隊が収集を完了できるようにすることができます。'
        - '標本やラベルを観察している人は、ローソンがダーウィンと話しているのを聞くことができます。ジェームス島の場合は、海岸のパーティーに水とキャンプ用品を提供してくれる人を送ってください。'
      points:
        p1: 'フラスコはほぼ空になり、まだ 2 人が泉までを待っています。水がどれだけ残っているか、それを必要とする人が何人いるかを数え、それからガイドに、先に水を持ってきた男性たちと話すように頼みます。水が到着したら、バイノーは残りのパケットをテントから持ってくるように呼び掛けます。船が入江に戻ったとき、最後の包みは空の水筒のそばに置いてあった。'
        p2: 'ローソンさんは、亀の甲羅の形でその島が分かると言う。ダーウィンは地名を 1 つ尋ねて、歩き続けようとしています。あなたは 2 つの標本パックを開け、彼がどこでそれらを集めたかを読み返します。彼が確認できない場所は確認するために残され、後で標本は別の包装紙に入れられます。最初の包みを新しい紐で結んだ。外から島の名が読める。'
      outcomes:
        all: '名前と個別のパケットを相互にチェックできます。ジェームス島一行も回収を終えて船に戻る。'
        p1: '陸上パーティーは船が戻り標本が積み込まれるまで続きます。初期の島のラベルの一部はまだ不明です。'
        p2: '島の記録の一部は別に保管されています。キャンプは後に失敗し、旅行はチャールズ島で名前を確認するこの瞬間を保ちます。'
      none: '春のそばにあるフラスコはまだキャンプにある唯一のものであり、以前の小包にはまだ不確かな名前が付いています。'
      not_admitted: '訪問者は海岸リストに載っていません。パケットはすでにボート内にあり、デッキからラベルを読み取ることができません。'
      desync: 'ジェームズ島での採水が終わる前に、キャンプの水が足りなくなってしまいます。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '船が入江に戻ったとき、最後の包みは空の水筒のそばに置いてあった。'
        p2: '最初の包みを新しい紐で結んだ。外から島の名が読める。'
    relic: 'フィンチの羽'
    relic_desc: '島から来た小さな茶色の羽。'
    points:
      p1: 'ジェームス島では、キャンプに貧弱な小さな泉が 1 つあります。船が戻るまで海岸でのパーティーを続け、島の採集が完了するのを見届けてください。'
      p2: 'ローソンが島ごとにカメが違うと言ったら、ダーウィンにその場でメモさせて、各島の鳥にラベルを付けて別々に梱包するようにしてください'
    points_fail:
      p1: '海岸のパーティーは水がなくなり、ジェームズ島での採集は行われません。この分岐は歴史から消え去り、事務所はその日の従業員を呼び戻した。'
      p2: '歴史のように、ダーウィンはローソンにはほとんど注意を払いません。チャタム島とチャールズ島のコレクションはすでに混合されており、ほとんどのフィンチには島がありません。'
    shift:
      p1:
        was: '1835年10月8日から17日：ダーウィン、バイノーとその使用人たちは、ビーグル号が水を求めに行く間、テントと食料を持ってジェームス島でキャンプをした。キャンプの近くには、貧弱な小さな泉があるだけでした。'
      p2:
        was: '1835年9月下旬: チャールズ島ではローソン副知事がダーウィンに対し、各島のカメは区別できると語った。ダーウィンは後に、十分な注意を払っておらず、すでに 2 つの島のコレクションを混合し、ほとんどのフィンチを混合してしまった、と書いています。'
        now: 'その日、彼はローソンの言葉を信じ、各島の鳥をラベルを付けてバラバラに梱包してイギリスに持ち帰った。'
        who: 'darwin_galapagos'
        bio: 'この年表では、ダーウィンはガラパゴス諸島のローソンの意見に耳を傾け、フィンチとマネシドリを島ごとに集めてラベルを付けてからイギリスに持ち帰りました。'
    vignettes:
      two_tags: 'タグには「島」とだけ書かれています。ヘルパーが別のランディングノートを見つけるまで、それを脇に置いておきます。トレイをしまった後も、2 つの標本は離れたままになります。'
      differences: 'ヘルパーは、似たような 2 羽の鳥を指差し、両方に 1 つのエントリを要求します。それぞれがどの島から来たのかを尋ねます。彼らは両方のラベルを本の中に残して、後で再度類似性を検討できるようにします。'
      drawer: 'ヘルパーが名前を読み上げてくれるまで、紙ラベルをトレイの横に置いておきます。引き出しを閉めると、メモはあるべき場所に残ります。'
  finlay_havana:
    name: '蚊と黄熱病'
    place: 'ハバナ'
    figure: 'カルロス・フィンレイ'
    story: 'カルロス・フィンレイは、1881 年にハバナで黄熱病の伝染に関する蚊の仮説を発表しました。彼の論文のタイトルは、それが仮説であることを示しています。'
    story_prose:
      opening:
        - 'ハバナはまだまだ暑いです。フィンレイは、読み上げようとしている新聞を演台のそばに置き、事件のメモを手紙の下に保管します。誰かが最初に議題を載せるためにやって来ます。フィンレイは「仮説的に」という言葉をはっきりと言いました。'
        - '1881年8月14日、フィンレイはハバナのアカデミーで黄熱病の蚊仮説を発表した。蚊に対する市の対策はずっと後になってから行われた。この支部は解釈を保存し、記録が彼の提案をどの程度裏付けるかメンバーに検討させることができます。'
        - '書類に詳しい人なら、アカデミーのコピーをチェックしてもらえます。議論を企画できる人は、メンバーがそれを検討し、公共の蚊対策提案を市に提出できるよう手配することができます。'
      points:
        p1: '店員によると、1ページは一度もチェックされておらず、残りのページは確認できないという。ラッパーをフィンレイのリストと照合し、ケースの周囲の折り目から欠けているシートを見つけます。フィンレイは再びリーディングコピーを閉じます。順番が来ると、書記はフィンレイが手にした紙と同じ題を読み上げた。'
        p2: 'ドアに一番近いメンバーは朗読を終えてすでに帽子をかぶっています。あなたは彼にもう 1 つの文を聞いて、どのレコードを確認したいかを言うように頼みます。彼は座って、ある事件について尋ねました。別のメンバーは復帰の期限を設定する。フィンレイは該当する紙を持ち上げ、二人がどれか分かるまで待った。'
        p3: '都市のコピーは、理論が確立されたということから始まります。あなたはフィンレイに、まだ確認されていない質問とは別に所見をリストアップするように依頼します。市委員会は、公共の蚊駆除の初期試験に資金を提供することに同意した。書記は印を押す前に、「仮説」の二文字を書き戻した。'
      outcomes:
        all: '論文は審問され、事件は再審理される。この分岐では公共の蚊の駆除が早期に開始されていますが、その結果はまだわかりません。'
        p1: 'アカデミーは論文を聞き、コピーをファイルします。メンバーはフォローアップするかどうかまだ決めていない。'
        p2: 'レコードについて尋ねるために何人かのリスナーが残っています。レビューの日付がメモに記載されます。市はまだ行動を起こしていない。'
        p3: '自治体裁判の提案に返答が得られる。レポートには、このブランチの以前のアクションが記録されます。'
      none: '部屋が空になります。誰も二度目の議論の日付を記入していません。'
      not_admitted: '議題に載っている人だけが中に入れられます。外からは事務員が最初の議題を発表するのが聞こえます。'
      desync: '読み物は組み立てられません。アカデミーは8月14日のフィンレイの論文を聴取せず、事務局は旅行者をリコールした。'
      excerpts:
        p1: '順番が来ると、書記はフィンレイが手にした紙と同じ題を読み上げた。'
        p2: 'フィンレイは該当する紙を持ち上げ、二人がどれか分かるまで待った。'
        p3: '書記は印を押す前に、「仮説」の二文字を書き戻した。'
    relic: '蚊のスライドガラス'
    relic_desc: '蚊の羽が付いた取り付けられた滑り台。'
    points:
      p1: '発熱の季節の間は、予定通り 8 月 14 日にアカデミーで論文を読み上げられるよう、論文と事件ノートを安全に保管してください。'
      p2: '朗読の後、論文が黙って脇に置かれないように、アカデミーの数人のメンバーに残って彼の事件を調べるよう説得してください。'
      p3: '蚊と事件を説得力のある証拠として提出するのを手伝ってください。そうすれば、市は何年も早く蚊との戦いを始めることができます。'
    points_fail:
      p1: '事件記録は発熱期に紛失し、8月14日には新聞は読まれなかった。この支部は歴史から外れ、事務所はその従業員を召還した。'
      p2: '会場は静寂に包まれ、誰も一件も見せてほしいと要求しなかった。この分岐では、歴史上そうであったように、論文は脇に置かれました。'
      p3: '彼の証拠は以前と同様に薄いままだった。この分岐では、市は蚊に対処するまで約 20 年待ったが、それまでは毎年夏に熱がぶり返した。'
    shift:
      p1:
        was: '1881 年 8 月 14 日、カルロス フィンレイは、ハバナの王立科学アカデミーに、黄熱病の仮想病原体としての蚊に関する論文を読み上げました。'
      p2:
        was: '1881 年 8 月 14 日、彼の朗読は沈黙に遭い、その後何年もの間、この考えは嘲笑されました。'
        now: 'その夜、数人のメンバーが残り、彼の事件記録を見せてほしいと頼んだ。'
      p3:
        was: '1881 年からフィンレイは、蚊が黄熱病を媒介することを証明するために 20 年近くを費やしました。 1900年になって初めて、アメリカ陸軍は彼の卵から育てた蚊を使って彼の正しさを証明した。'
        now: '{staff} は、証拠が見つかるまで蚊とケースを並べて置くのを手伝ってくれました。このタイムラインでは、ハバナは数年前から蚊との戦いを始めており、熱病はより早く街から去りました。フィンレイは当時も信じられていた。'
        who: 'finlay_havana'
        bio: 'この路線では、フィンレイの蚊のアイデアは 1881 年の数年以内に受け入れられ、ハバナは 1900 年よりずっと前にそのアイデアに基づいて行動しました。'
    vignettes:
      headline: '架空の編集者が見出しで示唆を確信に変えます。タイトルをゆっくり読み返します。彼らは証明を渡す前に仮説という言葉を元に戻しました。'
      columns: '編集者は、あたかも各行が同じことを意味しているかのようにメモを読みます。観察された内容と提案された内容を 2 つの列に記入します。文によって列が変わります。'
      place: '論文が読まれた場所の名前を確認します。編集者はそれを日付の横に載せるので、レポートによって会議が別の会議に変わってしまうことはありません。'
  humboldt_chimborazo:
    name: '雪線の上の裂け目'
    place: 'エクアドル・チンボラソ山'
    figure: 'アレクサンダー・フォン・フンボルト'
    story: '1802年6月23日、フンボルトはエメ・ボンプランドとカルロス・モントゥファルとともにチンボラソに登頂した。ポーターたちはそれ以上は進もうとしませんでした。 the three went on with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them, and they turned back.'
    story_prose:
      opening:
        - 'Above the snow line of Chimborazo, Bonpland hands Humboldt the barometer to free a hand for his bag.モントゥファールは前が見えるところで立ち止まる。 You cannot see the far side of the gully he points to until the cloud moves.'
        - '1802年6月23日、フンボルトの一行はチンボラソに登り、深い峡谷で引き返した。この分岐により、グループは続行する方法を見つけることができます。 A summit report counts only once everyone comes down.'
        - 'Send someone who can look after companions at altitude.オフィス用の装備が用意されていても、登山者一人ひとりに先に進みたいかどうか尋ねてください。'
      points:
        p1: 'Someone steps to the snow’s edge and comes back to tell Humboldt there is nowhere firm to stand.他のメンバーが地形を確認し、全員が続行するかどうか決定できるまで、パーティーを安全な地面で休ませます。フンボルトとボンプラントが交代で楽器を運びます。 Montúfar stays where he can see both on the way back.休んだ岩場まで戻って、ようやく頂で書いた半ページを取り出した。'
      outcomes:
        all: 'All the climbers reach the top and return to their resting place.報告書には、山頂からの入り口の横に彼らが下山した時間が記載されている。'
        p1: 'The group goes up by the way they found in this branch and returns in the order agreed before climbing.'
      none: '一行は峡谷を見て引き返します。他の人たちが待っている場所で、その記録には実際に到達した高さと、彼らが見えたものが示されています。'
      not_admitted: '一行が去ったとき、訪問者の居場所はなかった。以下の空の楽器ケースを受け取ります。'
      excerpts:
        p1: '休んだ岩場まで戻って、ようやく頂で書いた半ページを取り出した。'
    relic: 'A barometer'
    relic_desc: 'ガラスに高さが記された水銀気圧計。'
    points:
      p1: 'Before the deep gully blocks the way on 23 June, help the party hold out against the mountain sickness, find a way across, reach the summit of Chimborazo and come down safely'
    points_fail:
      p1: '歴史のように、彼らは頂上の下の峡谷で引き返します。'
    shift:
      p1:
        was: '23 June 1802: Humboldt, Bonpland and Carlos Montúfar climbed Chimborazo with nosebleeds, vomiting and dizziness, until a deep gully below the summit stopped them and they turned back.'
        now: '彼らは峡谷を渡り、チンボラソの頂上に立ち、無事にキャンプに戻ってきました。'
        who: 'humboldt_chimborazo'
        bio: 'このタイムラインでは、フンボルトは 1802 年 6 月 23 日にボンプラントとモントゥファールとともにチンボラソの頂上に到達し、無事に下山しました。'
    vignettes:
      turn: '架空の読者がルートの終点にある頂上を描きました。あなたは、日記が登山の記述をどこでやめるかと尋ねます。彼らは最後のマークを斜面の下に移動し、頂上は手つかずのままにします。'
      units: 'リーダーは単位なしで高さをコピーしたいと考えています。元の測定値に関連付けられたままにし、別の最新の変換のためのスペースを残しておきます。'
      names: 'あなたは読者に、フンボルトの横に他の旅行者の名前を記入するスペースを空けるように頼みます。メモを折りたたんでも、リストにはその日の試みの記録が続きます。'
  ibn_khaldun_cairo:
    name: 'アレクサンドリア沖の船'
    place: 'カイロ'
    figure: 'イブン・ハルドゥーン'
    story: 'イブン・ハルドゥーンは1382年にスルタン・バルククの招きでカイロにやって来た。 1384年、スルタンはチュニスの統治者に家族を自分に従わせるよう要請し、8月8日には西方からの新人としては高いポストであるマリキ学派の裁判長に任命し、すぐに市内のライバルたちがチュニスの座を奪うために動き始めた。その年、妻と娘たちを乗せた船がアレクサンドリアで沈没した。ムカッディーマの中で彼は歴史家に対し、彼らが記述している社会で起こり得ることに対して報告書を検証するよう求めている。'
    story_prose:
      opening:
        - 'カイロでは、事務員が約束と確認する名前のリストを同じ机の上に置きます。イブン・ハルドゥーンは外で誰が待っているか尋ねます。彼自身も別の手紙を待っており、チュニスから妻と娘たちを乗せた船の知らせが届いているという。'
        - '1384年、イブン・ハルドゥーンはカイロの裁判長に就任した。妻と娘を乗せた船は後にアレクサンドリアで遭難した。この旅行では、約束を守って港に行き、船上の人々が岸に着くのを手伝うことができます。'
        - 'カイロの職員と書類を確認できる人を使用してください。船員と協力し、陸上の人々を支援できる旅行者を早めにアレクサンドリアに送ってください。'
      points:
        p1: '事務員は、名前をもう一度コピーする必要があると言い、別の職員がそれが誰であるかを言うのを待ちたいと考えています。あなたは彼に、彼らがすでに持っている約束を読んで、それを訪問者の言ったことと比較するように頼みます。日付の行で、担ぎ手はイブン・ハルドゥーンのフルネームを読み上げます。書記は机の端の任命書を、その日発送する書類の束に戻した。'
        p2: '港で誰かが「人を見た」と通報し、その後水中で見失ってしまいました。見ている人たちに、同じ場所を指さし続けて、すでに出航している船員のためにスペースを空けるように頼みます。イブン・ハルドゥーンの妻と娘たちが海岸に到着すると、玄関で待っていた人が、ニュースを最初にどこに届けばよいかと尋ねました。カイロへの手紙は、本人たちが自分の声で答えられるまで待つことになった。'
      outcomes:
        all: 'イブン・ハルドゥーンは歴史通りに任命を受ける。港から彼の家族が上陸しているとの緊急連絡が入った。このブランチでは、カイロで待っている男性が別のメッセージを受け取ります。'
        p1: '予約は記録された日に行われます。船はアレクサンドリアで行方不明になっており、家族はカイロに到着していない。'
        p2: '彼の妻と娘たちには、港で彼らを手伝ってくれる人たちがいます。約束はずれてしまったが、救出の場面はまだ記録できる。'
      none: '人々はカイロで書類を待ち、港で風が静まるのを待っている。家族が無事だという手紙は決して書かれない。'
      not_admitted: '約束を渡すためにドアのそばで待っている人を誰も認めません。船からの知らせは部屋に届いていません。'
      desync: 'イブン・ハルドゥーンに予定されていた任命は別の人物に移る。記録が同期しなくなったため、事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '書記は机の端の任命書を、その日発送する書類の束に戻した。'
        p2: 'カイロへの手紙は、本人たちが自分の声で答えられるまで待つことになった。'
    relic: 'チェックされたレポート'
    relic_desc: '行列の報告書。欄外には監視員が立っていた場所が記されている。'
    points:
      p1: '政敵が新任の裁判官を締め出そうとするなか、8月8日のマーリク法学派の大法官任命を守る。'
      p2: '妻と娘たちを乗せた船がアレクサンドリアで沈没したとき、乗っていた人たちを水から引き上げて救出する'
    points_fail:
      p1: 'この分岐では8月8日の任命は別の人に移った。この分岐は歴史から消え去り、事務所はその日の従業員を呼び戻した。'
      p2: '歴史のように、船は全員を乗せてアレクサンドリアで沈没し、彼の妻と娘たちはカイロに到着しませんでした。'
    shift:
      p1:
        was: '1384年8月8日：スルタン・バルククはイブン・ハルドゥーンをカイロのマーリク法学派の裁判長に任命した。市内のライバルたちが彼に敵対し、翌年彼はその職を失った。'
      p2:
        was: '1384年：チュニスからイブン・ハルドゥーンの妻と娘たちを乗せた船がアレクサンドリアで沈没し、乗組員は誰も生き残らなかった。'
        now: '船に乗っていた人々はアレクサンドリアで海から引き上げられた。彼の妻と娘たちはカイロにやって来て、家族は再び一緒に暮らしました。'
        who: 'ibn_khaldun_cairo'
        bio: 'このタイムラインでは、1384 年にアレクサンドリアで沈没した船には家族は同行しませんでした。彼の妻と娘たちは救われ、カイロで合流しました。'
    vignettes:
      gate: '{staff} は、ゲームのつもりで店員に、群衆が通過する間にゲートが開いたままになっていた時間を尋ねます。彼は合計の横の余白に議事録を書き込み、合計を推定値に変更します。'
      two: '{staff} は、試合のために用意された 2 人目のウォッチャーに、彼女自身のシートを渡します。これは、彼女のストリートに関する説明が、結局彼のウォッチャーの余白に押し込められないようにするためです。'
      copy: '{staff} は法廷の学生のためにムカディマのページをコピーし、学生が作成したいメモ用に行と行の間に指の幅を残します。'
  lili_boulanger_paris:
    name: '机に広げたパート譜'
    place: 'メジー＝シュル＝セーヌ'
    figure: 'リリ・ブーランジェ'
    story: 'リリ・ブーランジェは、1918 年の冬、メジー・シュル・セーヌで重病を患いました。彼女の最後の著作には、彼女が妹のナディアに『ピエ・イエス』を口述筆記したことが記載されている。スコアには声、弦楽四重奏、ハープ、オルガンが必要です。リリさんは3月15日に24歳で亡くなった。'
    story_prose:
      opening:
        - '譜面台の上には清書と口述を待っているページの 2 つの山があります。ナディアはリリにペンを置くように言われ、メモをとったところです。薄い紙を通しては、最後に書かれた小節を読むのは困難です。'
        - '最後の病気の間、リリ・ブーランジェは妹のナディアに『ピエ・ジェスの』音楽を口述筆記した。リリは 1918 年 3 月 15 日に亡くなりました。ここでは、リリは自分のペースで一時停止し、続きを読みたいときに中断したところから誰かに読み返してもらうことができます。'
        - '音楽を読める人は、ナディアの場所をマークできます。文章を読み返す前に、準備ができたらリリに言わせてください。'
      points:
        p1: 'ナディアはページをめくり始めます。リリは彼女に待ってくれるように頼みます。二人とも最後のバーが見える位置に細いスリップを置きます。部屋はしばらく静かになる。リリが話したら、ナディアがマークした拍を逆算します。リリが音を一つ直すと、ナディアは同じ段から続けた。'
      outcomes:
        all: 'リリはいつ続行するかを決定します。彼女が口述した文章はテーブルの上に残されており、その後の記録には依然として彼女の死が 3 月 15 日に記録されています。'
        p1: 'リリの準備ができたら、ナディアはマークされた場所に戻ります。今回は、リリは一時停止前に口述した文章を繰り返す必要はありません。'
      none: '休憩後も姉妹たちは自分の居場所を見つけなければなりません。リリは時間を使って再び文章を口述筆記します。'
      not_admitted: 'ナディアは訪問者に、外で待って通路を静かに保つように頼みます。姉妹だけが最後のフレーズを聞いて停止します。'
      excerpts:
        p1: 'リリが音を一つ直すと、ナディアは同じ段から続けた。'
    relic: '細い紙のマーカー'
    relic_desc: 'ディクテーションが停止したバーをマークする発明されたスリップ。'
    points:
      p1: 'リリが休憩を求めたら、ナディアの場所をマークし、リリが再開したいときに最後の一節を読み返します。'
    points_fail:
      p1: '立ち止まった後、姉妹たちは再び自分たちの場所を見つけなければなりません。リリは、その日に残された時間の一部を、ナディアにすでに与えたことを繰り返すことに費やしました。'
    shift:
      p1:
        was: 'Pie Jesuの記述には、リリが重篤な病気だったとき、ナディアがリリの曲作りを手助けしたことが記されている。'
        now: 'このブランチでは、Lili が停止しても {staff} がその位置を維持します。準備ができたら、ナディアは最後の一節を読み返し、妹は中断しようと決めた場所から正確に読み始めることができます。'
    vignettes:
      entry: '{staff} は Nadia に、ページをめくる前に最新のメモを指すように求めます。彼女はそのラインを指で押さえながら、その上の音声をチェックします。'
      visitor: '玄関先にいる人が、音楽はどのくらい残っているか尋ねます。 {staff} は質問を外に出し、リリは休むかどうかを決定します。'
      stand: '{staff} は、スコアを隠さずにナディアがペンを置くためのスペースをスタンドに作りました。'
  jianzhen_nara:
    name: '揚州への長い帰り道'
    place: '嶺南'
    figure: '鑑真'
    story: '鑑真さんは5回目の日本への航海を試み、代わりに海南島にたどり着いた。帰国の途上、日本への旅行を頼みに来た僧・永栄が病に倒れ端州で亡くなった。鑑真は旅の途中で視力を失った。アカウントによってさまざまな説明が行われます。'
    story_prose:
      opening:
        - '端州では、同行者が新しくコピーしたルートペーパーをドアのそばに置きます。永栄の部屋にいる誰かが、メッセージを持ってきた人たちに待つように言っています。鑑真がやって来て、少しの間中に座ってもいいですかと尋ねました。'
        - '鑑真の航海記には端州での栄栄の死が記録されている。その後、鑑真さんの視力は悪化し、一行は揚州へ引き返した。この分岐には、旅の中で 2 つの小さな瞬間がかかります。二人に話す時間を与えてから、建鎮へ向かうルートを読んでみてはいかがでしょうか。'
        - '介護の経験がある人なら、栄栄が何を望んでいるのかを聞くことができます。新聞を読み、さまざまな人の話を聞くことができる旅行者は、後で建鎮までのルートを途中で読むことができます。'
      points:
        p1: '出発について尋ねた人が立ち去った後、あなたは栄叡に、鑑真に来てほしいかどうか尋ねます。彼はうなずき、ドアを空けておくためのスツールを求めます。あなたは他の人たちのメッセージを保留することに同意し、庭で待ちます。中から二人の声が聞こえる。声が小さくなっても、誰も急かさなかった。'
        p2: '書類は折り重ねられ、仲間が鑑真に決めたルートを伝えようとしている。あなたはまだ問題となっている停留所を読み上げ、パーティーがどこで一晩滞在する必要があるかを言います。鑑真は最初にどのステージに行きたいかを言う前に、もう一度名前を尋ねます。地名だけが並んでいた紙に、誰かが彼の選んだことを書き添えた。'
      outcomes:
        all: '二人の男は話す時間があります。永栄はまだ端州で亡くなっています。その後、鑑真さんが新聞を読めなくなったとき、新聞は彼が声に出して聞いたルートを通って移動する。'
        p1: '二人は会うことができる。栄叡はまだ死んでおり、後のルート書類には鑑真に説明してくれる人が必要になるだろう。'
        p2: '鑑真は次の段階を聞き、どこに行きたいかを自分で決めます。永栄と一緒に過ごせるチャンスはもう過ぎてしまった。'
      none: 'ルートペーパーは束に戻されます。部屋やその先の場所にあるメッセージは、まだ誰かが読み上げてくれるのを待っています。'
      not_admitted: '永栄が泊まっている部屋には決して入ってはいけない。書類は持ち去られ、ドアの前では誰も読まない。'
      excerpts:
        p1: '中から二人の声が聞こえる。声が小さくなっても、誰も急かさなかった。'
        p2: '地名だけが並んでいた紙に、誰かが彼の選んだことを書き添えた。'
    relic: 'ルートメモのシート'
    relic_desc: '一行が北へ旅した際に発明されたシート。'
    points:
      p1: '端州では、栄叡がどのように世話をしたいかを尋ね、鑑真と話す時間を作ります'
      p2: '鑑真さんは目が見えなくなったため、党員に計画を読み上げてもらい、今後どのように続けたいかを決めることができるようにする'
    points_fail:
      p1: 'いつも他に解決すべきことがあり、ベッドサイドにいる人々は呼び出され続けます。話す時間が過ぎていきます。'
      p2: '一行は再びルートノートを束にまとめる。鑑真さんは、誰かがそのページに何が書かれているかを教えてくれるのを待たなければなりません。'
    shift:
      p1:
        was: '永栄は5度目の日本への航海を試みた帰り道、端州で病に倒れ亡くなった。'
        now: 'この分岐では、{staff} が端州の栄叡と一緒に滞在し、鑑真をベッドサイドに呼び出します。彼らが個人的に話す時間があります。'
      p2:
        was: '記述によれば、鑑真はこの旅の途中で視力を失ったという。その後、彼は日本へ航海しました。'
        now: 'この分岐では、{staff} が次のストップを読み取ります。鑑真は他の人たちに一つ停留所を変えてもらい、いつまた出発したいかを伝えます。'
    vignettes:
      sound: '仲間はシート上の次の町を指差す。 {staff} は、鑑真 が聞いている間、名前を 2 回読み上げるように要求します。'
      tie: '党はまさにルート書類を締めようとしている。 {staff} は、誰かがストップの順序を確認するまでバンドルを開いたままにします。'
      temple: '{staff} は庭で質問に答え、中の人が声を上げずに話し終えることができるようにします。'
  sei_shonagon_kyoto:
    name: '中宮が出産を控えた冬'
    place: '京都'
    figure: '清少納言'
    story: '清少納言は皇后定子に仕え、後に彼女の周囲の生活を『枕草子』に書きました。長保二年の暮れ頃、定子は娘・美子姫を産んだが、間もなく亡くなった。'
    story_prose:
      opening:
        - '京都にも冬がやって来て、衝立のそばに予備の座布団が置かれています。清少納言は誰が受け取るべきかと尋ねる。彼女が話していると、使者が到着する。使者がまだいる中、定子は誰もいない場所を振り返る。'
        - '定子は1000年末に出産の準備をし、換算暦の1001年1月13日に亡くなった。清少納言は後に宮廷での生活について『枕草子』に書いています。ここでは、定子が誰を近くに置きたいかを尋ね、彼女が選んだ人々のためにスペースを空けることができます。'
        - '少納言とともに彼女の話を聞く旅人を送ります。手石が話している間、他の人が外部からの次のメッセージに応答することができます。'
      points:
        p1: '少納言は座布団を手に取り、いつもの場所に置きます。あなたは使いが終わるのを待ってから、定子が誰に会いたいのかを尋ねるように頼みます。定子は一人の名前をあげ、ランプの少し後ろに座るように頼みます。少納言は彼女が指さした場所に座布団を置きます。部屋が静まると、定子が呼んだ人はもう座っていて、定子は望んだところに手を置いていた。'
      outcomes:
        all: '彼女が会いたいと頼んだ人は今も近くにいます。定子は依然として亡くなっており、報告書には彼女が誰を同席させるかを選択した瞬間が保存されている。'
        p1: '少納言は定子の選んだ人が到着するまで座布団を空けておきます。後の記録は彼女の歴史的な人生を追っています。'
      none: '次から次へとメッセージがドアに届きます。クッションは手石に誰が欲しかったのか尋ねる前に、最初に示された人物に渡されます。'
      not_admitted: '誰かがスクリーンの向こう側にクッションを移動させます。外からは誰のためのものなのかわかりません。'
      excerpts:
        p1: '部屋が静まると、定子が呼んだ人はもう座っていて、定子は望んだところに手を置いていた。'
    relic: '家庭用の二つ折りのメモ'
    relic_desc: '部屋に案内されるべき人を指名する発明されたメモ。'
    points:
      p1: '出産の準備をしている定子に誰が近くにいてほしいかを尋ね、少納言がその人たちのために場所を空けるのを手伝ってください'
    points_fail:
      p1: '定子が彼女の隣に誰を望んでいるかを尋ねる時間がある前に、誰かが次のメッセージを持ってドアに来ています。'
    shift:
      p1:
        was: '宮廷記録には毘史姫の誕生とその直後の定子の死が記録されている。'
        now: 'この分岐では、{staff} は、定子が誰に会いたいかを言うまで、他の訪問者をドアの前に留めておきます。少納言は次のメッセージを伝える前に聞く時間があります。'
    vignettes:
      compare: '{staff} は、メッセージを折りたたむ前に使いに 1 つの名前をはっきりと読むよう要求します。少納言はもう尋ねることなくそれを伝えることができます。'
      colour: '少納言はランプを動かしてその後ろの空間を確認します。 {staff}は予備のクッションを定子が指した場所に移動する。'
      listen: '{staff} は、ドアのメッセージに応答するまで待機してから、その部屋に他に何か必要があるかどうかを尋ねます。'
  ibn_rushd_lucena:
    name: '焚書の命が下る前に'
    place: 'コルドバ'
    figure: 'イブン・ルシュド'
    story: '1195年頃、イブン・ルシュドはアルモヒド朝廷からの支持を失い、ルセナに亡命した。アカウントには、書籍の非難と焼き捨てが記録されています。アリストテレスの物理学に関する彼の長い注釈のアラビア語のテキストは失われていますが、ヘブライ語とラテン語の翻訳は残っています。'
    story_prose:
      opening:
        - '2 つのメッセージがまだコルドバ テーブルで待機しており、そのうちの 1 つは Lucena 宛てです。読者は、イブン・ルシュドがまだ答えるかどうか尋ねています。彼は物理学についての長い解説を写字者に向けて描き、単語が欠けている場所を指摘します。'
        - 'イブン・ルシュドは 1195 年頃にルセナに亡命しました。後の記録には書籍に対する制限が記録されています。彼の『物理学に関する長い解説』のアラビア語テキストは部分的にのみ残っています。ここで、読者と連絡を取り直し、その読者のために 1 つのセクションのチェック済みコピーを残すことができます。'
        - '通信を手配できる人に 2 つのアドレスを担当してもらいます。アラビア語の読者や注意深い写本家なら、原文がどこで終わり、解説が始まるのかを確認できます。'
      points:
        p1: '読者は数行を書きました。時間が来たら、彼はあなたに、まだ読みたいとだけ言ってほしいと頼みます。ルセナでは、あなたはその言葉をイブン・ルシュドに読み上げ、どこに返事を送ればよいかを伝えます。彼は読者がどのセクションに到達したかを尋ね、自分のシートを受け取ります。彼は折った紙を二枚手渡し、まだ読み続けている人に届けてほしいと頼んだ。'
        p2: '写本家は隙間を越えてまっすぐに書いた。彼は、文章には意味はあるが、原文を読んでいる人であれば、欠けている文に名前を付けることができると述べています。元の行のスペースを空けてもらい、その下のコメントをコピーし、両方を読み返してもらいます。写しを受け取った読者は二つの箇所の間に指を置き、自分でどちらも見つけられると言った。'
      outcomes:
        all: '返信はルセナとコルドバの間で行われ、読者は解説のアラビア語セクションにチェックを入れます。他のページの損失は履歴記録に残ります。'
        p1: 'イブン・ルシュドは、誰かがまだ読んでいることを知っています。彼の返事はルセナから持ち帰ったが、チェックされたコピーは未完成のままである。'
        p2: '読者はチェックされたアラビア語のページを残して出発します。彼がルセナに送りたかったメッセージはまだ待っています。'
      none: 'メッセージと書きかけのページは両方とも机の上に残ります。読者は次の人が来るのを待ちます。'
      not_admitted: '玄関先にいる人は、見知らぬ配達人からの手紙を受け取ることはありません。読者の言葉は決してイブン・ルシュドには届かない。'
      excerpts:
        p1: '彼は折った紙を二枚手渡し、まだ読み続けている人に届けてほしいと頼んだ。'
        p2: '写しを受け取った読者は二つの箇所の間に指を置き、自分でどちらも見つけられると言った。'
    relic: '読者の実践抜粋'
    relic_desc: '前提としてスペースを追加した発明の抜粋。'
    points:
      p1: 'コルドバからルセナのイブン・ルシュドに、彼の読者の一人がまだ彼に手紙を書きたがっているので返事を受け取ることができるという知らせを送る。'
      p2: '注文が来る前に、物理学に関するアラビア語の解説の一部をその出典と比較し、2 番目のコピーを読者に残してください。'
    points_fail:
      p1: '読者はメモをコルドバに保管します。彼らはそれを送信する別の機会を待つ必要があります。'
      p2: '追加のコピーは未完成のままです。読者はアラビア語の個別のページを持ち帰る必要はありません。'
    shift:
      p1:
        was: 'イブン・ルシュドは支持を失い、法廷に戻る前にルセナに追放された。'
        now: 'この分岐では、読者からのメモがルセナにいる彼に届きました。手紙を送り返す手段があるうちに、彼は返信することができます。'
      p2:
        was: 'イブン・ルシュドの『物理学に関する長い注釈』のアラビア語テキストが失われている。中世の翻訳が残っています。'
        now: 'この分岐では、チェックされたセクションの 1 つが非難を通じて読者の手に残ります。読者は、それを元のアラビア語の別のコピーと比較することができます。'
    vignettes:
      premise: 'マリアムは慎重な手紙で結論を書き写した。ユスフは、彼女が述べなかった何かを仮定することによってのみ、それに従うことができます。あなたは彼にどこで止まったかを尋ね、結論の前にスペースを空けます。マリアムはそのスペースに自分の仮定を書き、ユスフはそこに疑問を抱くことができます。'
      together: 'ユスフは本を返して、自分用に一行だけ残しておきたいと考えています。あなたは彼にそれに伴うステップをコピーする時間を与えます。玄関でマリアムは大声で結論を尋ねますが、今度はその理由も答えることができます。'
      language: 'あなたは、後で読者が別の言語で出会うであろう用語を認識しています。マリアムは、現状の前提をそのままコピーしたかどうかを知りたいだけです。彼女がページをチェックしている間、あなたはページを平らに保ちます。彼女がその横に書いた質問は、あなたが会ったこともない読者に届くでしょう。'
  maya_codices_mani:
    name: '紙の折り方を覚えておく'
    place: 'マニ'
    figure: 'マヤの書記たち'
    story: '1562 年 7 月 12 日、植民地当局はマニで公共の場でマヤ語の書籍やその他の物品を焼き捨てました。マヤのコミュニティは知識を作り、継承し続けました。スペインの征服以前に作られた折りたたみ本はほとんど残っていない。'
    story_prose:
      opening:
        - 'ユカタン州マニでは、飼育員が畳んだ本をマットの上に置き、かつて子供が一緒に読んだページをめくります。近くの村からの訪問者が今日出発します。彼は出発する前に、彼女に一冊の本を託してもらえないかと尋ねます。'
        - '1562 年 7 月のマニでの焚書が記録されています。現存するマヤの法典には文字や絵が保存されていますが、その正確な歴史は不明な場合が多いです。ここの管理人は架空の人物で、彼女の本を保持する人を選ぶことができます。'
        - '管理人にページがどのように機能するかを見せてくれる誰かを送ってください。彼女が本を渡すことを選択した場合は、彼女の指示に従って本を折り、読者がどのようにして本を見つけることができるかを受取人に尋ねます。'
      points:
        p1: 'キーパーは 2 番目の折り目を開き、他の読者がかつて間違えた余白を指します。受信者に、両方の読者が同じ場所で停止することがわかるように、指示に従うように依頼します。彼女は一冊の本を他の本から持ち上げ、使い古した布で包み、マットの上に渡します。受け取った人は両手で支え、彼女が最後の折り目の印を説明するのを待った。'
      outcomes:
        all: '一冊の本は、その番人が選んだ場所へ行きます。マニでの火入れは今でも行われており、この支部には彼女が自ら手渡した一冊が保存されています。'
        p1: '読者は包まれた本を胸に当てて持ち出す。それが再び開くと、彼は彼女が示した方法で 2 番目の折り目を見つけることができます。'
      none: '読者は手ぶらで帰宅する。管理人は本を広げ、再び閉じます。彼女はまだそれをどこに置くかを決めなければなりません。'
      not_admitted: '管理人は訪問者にページに触れるよう勧めません。ドアのところで、彼女が彼らを追い返し、隣人と話し続けているのが見えます。'
      excerpts:
        p1: '受け取った人は両手で支え、彼女が最後の折り目の印を説明するのを待った。'
    relic: '空白の練習フォールド'
    relic_desc: '管理者が提供する架空の折り目。'
    points:
      p1: '管理人に、別の村の信頼できる読者にどの本を持たせたいかを尋ね、その本を引き渡すのを手伝ってください。'
    points_fail:
      p1: '彼女が選んだ人は本を持たずに去っていきます。飼育者はどこに留まるかを決めなければなりません。'
    shift:
      p1:
        was: '1562 年 7 月 12 日: マニで非常に多くのマヤ族の折り本が公衆の面前で焼かれました。征服前に作られた本のうち、現存するのはほんの一握りです。'
        now: 'この分岐では、管理人が 1 冊の本を誰が管理するかを選択します。それは次の読者に届き、焼かれながらマヤの手に残ります。'
        who: 'maya_codices_mani'
        bio: 'この分館では、マニの本が 1562 年に一般の人々に焚かれる前に、管理者によって選ばれた読者に渡されました。'
    vignettes:
      fold: '管理人は、何も書かれていない折り目を 2 つベンチに置き、隣人に、本の中でどちらが最初に開いたかを覚えていると尋ねます。比較している間、紙を持ってください。彼は 2 番目のフォールドを配置できません。彼女は最初のものを保管し、もう一方は次回話すときのために放しておきます。'
      listen: '隣人はキーパーが失くした部分を語り始めますが、順序が異なって覚えています。それぞれが終わるまで聞きます。彼らは最初の折り目については同意しますが、2 番目の折り目については未定のままにします。管理人は、両方のアカウントを記録したコピーを彼女に残すように頼みます。'
      survive: '後のコレクションで生き残った Maya コーデックスを見たことがあるでしょう。管理人は、隣人がどの本を覚えているか教えてほしいと尋ねます。コレクションに名前を付けることはできますが、そのページをこのルームに接続することはできません。彼女はあなたに、散歩に戻るための白紙の練習用折り紙を渡します。彼らが思い出していた本は、それについての説明とともに残っています。'
  zeami_sado:
    name: '紙に描いた島'
    place: '佐渡島'
    figure: '世阿弥'
    story: '世阿弥の息子、元雅は 1432 年に亡くなりました。世阿弥は 1434 年に佐渡に流される前に、キャライカでの喪失について書き残しています。世阿弥の旅と佐渡島での流刑を回想する謡集『金燈抄』は 1436 年に出版されています。'
    story_prose:
      opening:
        - 'Sado のリーダーには、ポケットに折りたためるほど小さなシートが付属しています。世阿弥はすでに二度、扉のそばで呼吸を変える練習をしているのを聞いている。彼は席から読者にどこから始めようとしているのか尋ねます。'
        - '世阿弥は晩年佐渡に流され、その島のことを『金刀抄』に記している。この分岐により、彼は聞くことを選択できる短い朗読と、自分で選択できる一時停止を得ることができます。その後の作品も、歴史上そうであったように今でも語り継がれています。'
        - '言葉とそのリズムを聞いてくれる人を送ってください。世阿弥が聞きたいかどうかを尋ね、彼が選んだ間をそのまま伝票に記録します。'
      points:
        p1: '読者はフレーズの終わりで一息つきます。世阿弥は同じところからやり直すように言い、途中で手を挙げます。手がどこで言葉を止めるかを観察し、読み終わった後に伝票に印を付けます。三度目に、読み手は目を伏せずにその語で止まった。世阿弥が手を上げるより先だった。'
      outcomes:
        all: 'このスリップには、世阿弥がセリフを聞いた後に選んだポーズが保存されています。彼が島について書き続ける間、それはページの横にあります。'
        p1: '世阿弥は自ら休止を選んだのです。読者は次回同じシートを持ってくると言います。'
      none: '読者は呼ばれるまで長く滞在することができません。彼の折りたたんだシートにはまだ一時停止の跡がありません。'
      not_admitted: '訪問者はまだ読むように誘われていません。読者はページを折り、ドアから離れます。'
      excerpts:
        p1: '三度目に、読み手は目を伏せずにその語で止まった。世阿弥が手を上げるより先だった。'
    relic: '能面'
    relic_desc: '眉間に漆の細い線が入った小さな木製のマスク。'
    points:
      p1: '世阿弥に佐渡に関する一文を読んでもらいたいか尋ねる。彼が同意する場合は、読者が取り外し可能な伝票に一時停止を続けるのを手伝ってください'
    points_fail:
      p1: '世阿弥がセリフを声に出して聞く前に、読者は立ち去らなければなりません。ページ上のマークは待つ必要があります。'
    shift:
      p1:
        was: '世阿弥の残された著作には、息子への哀歌や佐渡流刑を回想した『禁当抄』などがある。'
        now: 'この分岐で世阿弥は、読者が彼の一文を 2 つの方法で試すのを聞きます。彼は読者がどこで一時停止するかを選択し、その伝票を自分のページの横に置いておきます。'
    vignettes:
      later: 'あなたは読者に、人々は佐渡に関する本でその名前を今後も使用するだろうと伝えます。言葉を地名として、そして人が憧れるものとして試みる。両方の一時停止を伝票にマークします。世阿弥を佐渡へ運んだ船はすでに去ってしまった。'
      mask: '読者は練習用のマスクをかざし、それを下げると場所を失います。あなたは緩いスリップにラインの始まりをマークし、彼が再び見つけることができる場所にそれを支えます。マスクはペグに戻ります。あなたの読書の後に読み逃してしまいます。'
      wind: 'すきま風で、読み合わせの紙が散らばった。あなたは読者がベンチの下から 1 枚を回収し、小石で押さえるのを手伝います。彼はもう一度その行を読みます。帰るとき、紙は石の下に残り、一時停止をメモに残します。'
  mozart_requiem_vienna:
    name: '筆跡が分かるように'
    place: 'ウィーン'
    figure: 'ヴォルフガング・アマデウス・モーツァルト'
    story: 'モーツァルトはレクイエムが未完成のまま、1791年12月にウィーンで亡くなった。オーストリア国立図書館は、フランツ・クサーヴァー・ジュースマイヤーが手を加えた作業用資料と、提出された総譜を所蔵している。'
    story_prose:
      opening:
        - 'ウィーンでは、使いがテーブル上の最もきれいな山に手を伸ばします。モーツァルトは、冒頭の楽器パートがまだ残っているかどうかをベッドから尋ねます。コンスタンツェは使いに待つように頼みます。他のページには、まだ保管されていない下書きもあります。'
        - 'モーツァルトは晩年に病気になり、1791年12月5日に亡くなった。レクイエムは未完成のままであったが、冒頭部分は完全に作曲していた。ここでは、そのセクションをまとめて管理し、介護者にオフィスの架空の医療キットを持ってきてもらうことができます。'
        - '作業シートから楽器パートを区別できるリーダーは、コンスタンツェがそれらを分類するのを助けることができます。家族とモーツァルトが何を望んでいるのかを尋ねた後、キットを持っていてケアの経験のある人を使用してください。'
      points:
        p1: '使いは紙を二枚めくり、どちらも同じ声部の名だと言った。コンスタンツェとともに、オーケストラの全パートが書かれた束を出してもらい、冒頭部分の終わりまで譜面を確かめた。草稿は札を付けて別に包んだ。戸口で使いは包みの中と外を確かめ、どちらの束を先に写譜係に渡すか見分けた。'
        p2: '誰かが清潔なシーツをベッドサイドに持ってきて、今日はコピーがあるかどうか尋ねます。あなたはモーツァルトとその家族にオフィスキットについて説明し、写経師に別の部屋で待つように頼みます。モーツァルトが後に目覚めると、熱は下がっていました。彼は机を近づけてもらい、手を止めたところだけを開いた。'
      outcomes:
        all: 'オープニングパーツは再度使用でき、モーツァルトがテーブルで作業することができます。終了しても、その後のページは空白のままです。彼がどのように彼らを終わらせるのかはまだ誰も知りません。'
        p1: '開口部はまだ完全な 1 つのパケットです。モーツァルトは12月5日に亡くなり、残りの楽譜は他の人に残されました。'
        p2: 'モーツァルトは立ち直るが、本来の冒頭は散ってしまう。この訪問では、彼が目覚めてスコアを見たいと頼んだ瞬間が保存されています。'
      none: '未完成のフレーズがベッドのそばに横たわっています。モーツァルトは12月5日に亡くなり、いくつかの山は今も誰かが身元を特定するのを待っています。'
      not_admitted: 'コンスタンツェはこの訪問者を手配しませんでした。写経者は外にいて、山の中に何があるか決して見ません。'
      desync: '冒頭部分にばらばらのページが混在し、歴史的な引き継ぎが同期しなくなります。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '戸口で使いは包みの中と外を確かめ、どちらの束を先に写譜係に渡すか見分けた。'
        p2: '彼は机を近づけてもらい、手を止めたところだけを開いた。'
    relic: '未完成の練習用リーフ'
    relic_desc: '生き残ったメモがどこで止まるかを示す架空のコピーリーフ。'
    points:
      p1: '病気で引き継ぎを余儀なくされた場合は、レクイエムの完成したオープニングを一緒に保管してください'
      p2: '11月20日に彼がベッドに入ったら、そこに留まっている熱を治してください'
    points_fail:
      p1: '冒頭部分に緩いドラフトが混じり、第1楽章を組み立て直すことができなくなります。支社との連携が崩れたため、事務所はその従業員を召還した。'
      p2: 'この枝では病気は治りません。 12月5日にウィーンで35歳で死去。'
    shift:
      p1:
        was: '1791年12月、モーツァルトはレクイエムの冒頭部分が完全にオーケストラ化され、残りの部分が未完成のまま亡くなった。'
      p2:
        was: '1791年11月20日からモーツァルトはベッドに閉じ込められました。彼は12月5日にウィーンで亡くなり、教区名簿では死因を重度の粟粒熱としている。'
        now: '{staff} は熱を下げる薬を持ってきて、12 月には再び起き上がります。このタイムラインでは、彼はレクイエムを自らの手で完成させ、ウィーンで長年にわたって作曲と演奏を続けています。'
        who: 'mozart'
        bio: 'モーツァルトは1791年の冬に回復し、自らレクイエムを完成させ、長年ウィーンで作曲と演奏を続けた。'
    vignettes:
      stack: 'グレタさんはテーブルを片づけ、空っぽに見える葉っぱを脇に置いています。エミールがその前のページをチェックしている間、あなたはスタックを保持します。空の譜表はシーケンスに属します。グレタさんは、それがどこから来たのかを示す緩やかなスリップマークを付けて、それを元に戻しました。'
      hand: 'エミールは目の前の線をコピーし、書かれていない杖にまっすぐ進む準備ができています。コピーが止まった位置の余白に小さな印を罫書きしてもらいます。ハンドオフが完了すると、次の読者は新しいハンドをどこから開始する必要があるかを正確に確認できます。'
      finish: '将来の合唱団が歌うように、この一節を口ずさむことができます。グレタさんは今そのコピーが必要で、そのページに書かれている音楽はどこで終わるのか尋ねます。あなたは彼女に境界線を示し、メロディーを独り占めします。次のバージョンは退会後にまとめられます。'
  dickinson_amherst:
    name: '箱の中の詩'
    place: 'アマースト'
    figure: 'エミリー・ディキンソン'
    story: 'エミリー・ディキンソンは、1886 年 5 月 15 日にアマーストの自宅で亡くなりました。彼女の妹のラヴィニアは、届いた手紙を燃やすという彼女の願いを実行し、数百の詩を発見しました。初期の編集者は後に、エミリーが詩の多くを縫い付けた小冊子を解体しました。'
    story_prose:
      opening:
        - 'アマーストの家で、ラヴィニアは手紙の山の下に折りたたまれたシーツの隅があるのに気づきました。エミリーの縫合された小冊子のいくつかが近くにあります。上の階の人が電気をつけっぱなしにするかどうか尋ねます。とりあえず書類はすべて近くの箱の蓋の上に置きます。'
        - 'エミリー・ディキンソンは 1886 年に亡くなりました。彼女の妹のラヴィニアは手紙を扱っているときに膨大な量の詩を発見しましたが、多くの束は後に解体されました。まず、エミリーが望むようにいくつかのケアを手配し、それからラヴィニアが手紙と詩を区別し、1 冊の小冊子を無傷で保管できるように手伝います。'
        - '介護の経験がある旅行者は、一晩かけてエミリーに何が欲しいかを尋ねることができます。写本を読む人は、ラビニアがつなぎ合わせや変化した単語を認識し、それらが見つかった順序を保存するのを手伝ってくれます。'
      points:
        p1: 'ラヴィニアは緩んだシーツを拾い上げ、手紙は一緒に送れると言いました。あなたは彼女に、まず下の紐を解くように頼みます。彼女は妹の手に同じ大きさに折りたたまれた数ページを見つけ、それをランプのそばに置いて読みました。二つの束を別々の箱の蓋に移してから、ラヴィニアは家族を呼んで見てもらいます。'
        p2: 'ラヴィニアは、トランスクリプトの各ページに最も読みやすい単語を保持できるかどうかを尋ねます。彼女にコピー作者に同じ行の隣に 2 つの単語を見せてもらい、コピーの折り目とステッチ穴をトレースします。小冊子は縫われたままで、包装紙にはページの順序が記載されています。次に読み返すと、写し手は折り目をたどって同じ別の語に戻れます。'
        p3: 'あなたはエミリーに、今夜隣の部屋に誰か来てほしいかどうか尋ねます。彼女はランプを使ってジェスチャーをし、電話をかけてきたときに聞こえるようにホールのドアを少し開けておいてほしいと頼みました。家族は彼女が尋ねたところに水と椅子を置きます。最後に見張りをしていた人がそっと足を踏み出しながら去っていきます。エミリーには、その足音で誰なのかまだ分かります。'
      outcomes:
        all: 'エミリーは彼女の願いどおりに夜を過ごしました。彼女の死後、現存する論文には 1 冊の小冊子が含まれており、綴じ目や別の言葉もそのままの状態で今でも読むことができます。'
        p1: '手紙と詩は別々に保管され、未発表の詩が残されています。一部の小冊子は、家族が残りの部分を扱うときに今でも分解されています。'
        p2: '1冊の小冊子の折り目と別の言葉がコピーされています。残りの書類は行方不明になってしまいましたが、旅行者はその一冊の小冊子をコピーしたことを覚えています。'
        p3: 'その夜、エミリーが電話をかけると、聞こえるほど近くに誰かがいた。家族は依然として書類を自分たちで仕分けしなければなりません。'
      none: 'ランプのそばに残るのは折りたたまれた紙だけです。その夜のために新たな準備をする人は誰もいません。'
      not_admitted: '中から誰かが応答し、現在家族は訪問者を受け入れることができないと言いました。 2つの杭はまだ開けられていません。'
      desync: '手紙と詩が混在しています。歴史に残る一部の論文は、このブランチでは回収できません。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '彼女は妹の手に同じ大きさに折りたたまれた数ページを見つけ、それをランプのそばに置いて読みました。二つの束を別々の箱の蓋に移してから、ラヴィニアは家族を呼んで見てもらいます。'
        p2: '小冊子は縫われたままで、包装紙にはページの順序が記載されています。次に読み返すと、写し手は折り目をたどって同じ別の語に戻れます。'
        p3: '最後に見張りをしていた人がそっと足を踏み出しながら去っていきます。エミリーには、その足音で誰なのかまだ分かります。'
    relic: '手縫いの小冊子'
    relic_desc: '数ページが手縫いでそれぞれに詩が書かれています。'
    points:
      p1: 'ラヴィニアが破棄する手紙を綴じられた詩から分離し、未発表の作品を保護するのを手伝ってください。'
      p2: 'ラビニアに、小冊子を 1 つにまとめて、折り目、ページ順序、代替単語をマークしたコピーを準備するように依頼します。'
      p3: 'エミリーに今夜休みやすくする方法を尋ね、家族がそれを整えるのを手伝ってください'
    points_fail:
      p1: '詩は書簡と混ざっており、未発表の作品の多くは失われています。支店の同期が失われ、オフィスはその従業員をリコールします。'
      p2: 'きれいなコピーはありますが、そのページでは、折り畳まれたシートがどこでつながっているのかわかりません。'
      p3: '家族はいつも通りの夕方の日課を続けています。エミリーは今でも、助けが必要なときは誰かに泊めてもらう必要があります。'
    shift:
      p1:
        was: '1886年、ディキンソンの死後、ラヴィニアは要求に応じて届いた手紙を破棄し、何百もの詩を発見した。'
      p2:
        was: 'ディキンソンの初期の編集者は、編集に使用した手縫いの小冊子を廃止しました。'
        now: 'このブランチでは、{staff} が小冊子を分解せずにコピーします。ラヴィニアは、余白の代替単語に至るまで、ページがどのように結合されているかを示すコピーを持っています。'
      p3:
        was: 'ディキンソンは重病にかかり、1886年5月15日に自宅で亡くなった。'
        now: 'この分家では、家族が彼女をリードし、彼女の声が聞こえるほど近くに誰かを残して、彼女が助けを呼ばずに休むことができるようにします。'
    vignettes:
      pause: '読者は読み上げながらダッシュを消します。鉛筆が折れたところで立ち止まってもらいます。彼らはもう一度ラインを試みますが、別の結末が聞こえます。'
      variant: '線の上に単語が書かれているのがわかります。読者は 1 つのバージョンを選択して次に進みたいと考えています。両方の余白にスペースを確保し、どこから来たのかをラベル付けします。'
      stack: 'リーダーは緩んだ山をまっすぐにします。端と筆跡が一致するため、2 つのスクラップを一緒に保管します。次の清書は、それらを並べて開始します。'
  hertz_bonn:
    name: '最後の学期'
    place: 'ボン'
    figure: 'ハインリヒ・ヘルツ'
    story: '1892 年の初めから、ヘルツは何度も鼻と喉の痛みを伴う病気に悩まされ、時には仕事ができなくなるほど悪化しました。 1893 年、彼はいくつかの手術を受けながらボンでの講義に戻り、力学原理を修了しました。彼は1894年1月1日にボンで36歳で死去した。その本は彼の死後に出版されました。'
    story_prose:
      opening:
        - 'ボンでは講義のスケジュールがすでに決まっています。ハーツは片手に授業のメモを持ち、力学の原理で確認したい数行を持っています。彼は若い同僚に、何人の学生が質問を待っているのか尋ねました。'
        - 'ハーツは最後の病気の間も原則に取り組み、1893年12月に原稿を送り、1月1日に亡くなった。同僚に 1 つの講義を受講してもらい、その時間をどのように過ごすかはハーツに任せることができます。'
        - 'クラスの運営方法を知っている人は、生徒の質問を集めるのを手伝ってくれます。答えてくれる同僚がいても、どのクラスを引き継ぐかはハーツに決めてもらいましょう。'
      points:
        p1: '同僚は 2 つのスケジュールを用意し、学生がすでに質問したことがわかれば、後の授業を受けてもいいと言いました。 Hertz にレッスンを選択してもらい、答えが必要な 2 つの場所にマークを付けます。同僚はスケジュールを持って帰る前に、どの部屋に入るかを言います。ハーツは講義ノートからメモを取り出し、確認したい力学の本のページにクリップで貼り付けます。'
      outcomes:
        all: '学生たちは同僚の講義に質問を持ち込んでいます。原稿は予定通りに進み、ハーツは元旦に亡くなった。'
        p1: '同僚が授業を受けています。ハーツは原稿のマークを見る前に、得た時間を少し休んだ。'
      none: 'スケジュールはハーツの手中にある。彼はまだチェックすべき数行を残して原稿を閉じます。'
      not_admitted: '誰も講義前にあなたに会えるように手配していません。学生たちはホールで少し待って、時間割が貼られている建物に戻ります。'
      excerpts:
        p1: '同僚はスケジュールを持って帰る前に、どの部屋に入るかを言います。ハーツは講義ノートからメモを取り出し、確認したい力学の本のページにクリップで貼り付けます。'
    relic: '折りたたまれた講義シート'
    relic_desc: '1 つの講義にマークを付けた、発明された時間割シート。'
    points:
      p1: 'ハーツにどの講義を同僚に担当させたいかを尋ね、その日に誰かが質問を受けられるよう手配する'
    points_fail:
      p1: '講義は彼のスケジュール通りに行われる。彼は原稿の作業を後で使うために保存しなければなりません。'
    shift:
      p1:
        was: 'ハーツは病気の間 1893 年にボンで教鞭をとり続け、亡くなる前に力学原理を修了しました。'
        now: 'このブランチでは、ハーツは同僚に 1 つの講義を担当させます。彼はその時間を休憩時間に使い、原稿を送信する前に原稿の修正を口述筆記します。'
    vignettes:
      repeat: '{staff} は 2 つの質問を同僚に読み上げます。彼は、ハーツの原稿を開かずに答えられるものにマークを付けます。'
      signal: '生徒が間違った教室の外で待っています。 {staff} は、代理人がスケジュールに書き込んだ部屋を指します。'
      gap: '{staff} は、講師の回答用に空白行を残し、次の生徒が見つけられる場所にシートを設定します。'
  bizet_paris:
    name: '『カルメン』の年'
    place: 'パリ'
    figure: 'ジョルジュ・ビゼー'
    story: '『カルメン』は長いリハーサル期間を経て、1875 年 3 月 3 日にオペラ コミック座で開幕しました。プレスは混合され、生産は春まで続けられました。 6月3日、ビゼーはブージヴァルで36歳で死去した。'
    story_prose:
      opening:
        - 'オペラ・コミック座は最後のリハーサルが残っている。コーラスは時間通りに始まりますが、ステージを横切るため、2番目のラインが遅れます。ピアノの前にいる誰かが、オーケストラが一人の時間を望んでいるのか、それともステージ上の動きからやり直したほうが良いのかを尋ねます。'
        - '『カルメン』は 1875 年 3 月 3 日にパリで初演されましたが、ビゼーはその年 6 月に亡くなりました。キャストとオーケストラをもう一度一緒に演奏して、後で歌手がリハーサルしたいセクションをビゼーに渡すことができます。'
        - '両側で入り口を数えられる人を使用してください。演奏後、誰かがそのセクションの番号と最初の言葉について歌手の懸念を書き留めることができます。'
      points:
        p1: 'オーケストラは聞き間違えた小節から始めたいと考えています。合唱団に、最初の位置に戻って、指揮者に、合唱団が一体となって歌う前にどの位置にいなければならないかを示すように頼みます。 1ストップ後、全員がサビに入るワードからスタート。2 回目の試みでうまくいくと、ステージのドアにいる人が続行の合図をします。'
        p2: 'ショーの後、誰かが伝票に「入場困難」と書きます。あなたは彼女に前のラインを歌ってもらい、別の歌手がどのタイミングでそれを聞いたかを特定してもらいます。ビゼーは誰のリクエストかを確認し、その夜彼らが使用したスコアにそのスリップを滑り込ませます。最初の言葉は、質問した歌手が次回見つけることができる場所に残ります。'
      outcomes:
        all: '3月3日に幕が開きます。ビゼーはその一節を特定するメモを手に入れるが、その記録には6月に彼の死が記録されている。'
        p1: '定刻に幕が上がる。出演者たちは後で短いメモを送りますが、ビゼーはまだそれがどの部分に関係しているのか尋ねなければなりません。'
        p2: 'ビゼーは伝票を受け取り、スコアの最初の単語を見つけることができます。初演は同期が失われ、旅行記録には引き継ぎだけが残っています。'
      none: 'スコア上では 2 つのマークが同じに見えます。去っていく人々は、どちらが合唱を持ち込むかまだ同意できません。'
      not_admitted: 'ステージドアにいる人はあなたの名前を見つけることはありません。あなたは入り口から離れて立っていると、歌手が再び数拍を数えるのが聞こえます。'
      desync: 'リハーサルは中断され、3月3日の初演は始まらない。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '1ストップ後、全員がサビに入るワードからスタート。2 回目の試みでうまくいくと、ステージのドアにいる人が続行の合図をします。'
        p2: 'ビゼーは誰のリクエストかを確認し、その夜彼らが使用したスコアにそのスリップを滑り込ませます。最初の言葉は、質問した歌手が次回見つけることができる場所に残ります。'
    relic: '紙の扇'
    relic_desc: '客席にあった、絵の描かれた紙の扇。'
    points:
      p1: '歌手たちが楽章やオーケストラとともに難しい曲をリハーサルできるよう、劇場が最終公演を用意するのを手伝ってください。'
      p2: 'ビゼーの夜の公演のレポートを取り上げます。歌手たちがまだ調べたいと思っている正確な一節が含まれています。'
    points_fail:
      p1: 'リハーサルが行き詰まり、劇場は3月3日に幕を開けることができない。支店は同期を失い、オフィスはその従業員を呼び戻します。'
      p2: 'そのメモは文章が省略されたままビゼーに届く。彼は、歌手たちがどのパートをリハーサルしたいのかを聞かずに問題があったことを知りました。'
    shift:
      p1:
        was: 'オペラ コミック座の舞台台帳には、カルメンの開幕日である 1875 年 3 月 3 日のリハーサルと舞台準備の記録が残っています。'
      p2:
        was: '『カルメン』の初演は3月の初演後も続けられた。'
        now: 'この分岐では、{staff} がビゼーに使用できるレポートを提供します。彼はスコアの項目にマークを付け、次の演奏の前に歌手たちとそれについて話し合うことができます。'
    vignettes:
      future: 'あなたは係員に、後の聴衆は彼が訪れたことのない都市でこのオペラを知ることになると伝えます。彼は、なぜ今夜は追加のプログラムを用意しておかなければならないのかと尋ねました。あなたは彼に、最初の夜とガリ・マリーの名前が印刷されている場所を見せました。 1 冊は彼の引き出しに入ります。 2人目の読者が来る前にその場を離れてしまいます。'
      label: '付添人は同じタイトルで 2 枚のシートを提出しました。日付ごとに分けて、予備の包装紙に最初の夜をマークします。後で読む人は、適切なシートを要求できるようになります。観客が出てくるのが懐かしい。'
      seat: '遅れてきた訪問者にプログラムを貸し出し、訪問者が席に着いたら玄関でプログラムを返します。自分の伝票に名前を 1 つコピーします。その時までに、中の音楽はさらに進んでいます。'
  artemisia_florence:
    name: 'アカデミーに迎えられた最初の女性'
    place: 'フィレンツェ'
    figure: 'アルテミジア・ジェンティレスキ'
    story: 'アルテミジア・ジェンティレスキは、1616 年に女性として初めてフィレンツェの絵画芸術アカデミーに入学を認められました。彼女のフィレンツェ時代には、現在「リュート奏者の自画像」として知られる作品が含まれています。'
    story_prose:
      opening:
        - 'フィレンツェの店には 2 つの帳簿が開いています。 1 つは顔料が入っており、もう 1 つはアカデミー費用の伝票が挟まれています。アルテミシアは店員に、それらを別々にしておいて、領収書を受け取ることができる7月の日を教えてほしいと頼みます。'
        - 'フィレンツェの絵画アカデミーは 1616 年 7 月 19 日にアルテミシアを入学させました。彼女は依頼にも取り組んでいました。この支店では、入場料を適切に受け取って、彼女が次の絵画契約の期日までに前払いを確保できるように支援することができます。'
        - '会計に詳しい人は、アカデミーの支払いを確認できます。口頭での合意を書面にできる人は、クライアントに必要な日付を尋ねるのを手伝ってくれるでしょう。'
      points:
        p1: '事務員は、決済が必要な顔料請求書の中にアカデミー伝票を提出しました。あなたは Artemisia にどちらを先に支払う必要があるかを尋ね、入学日の横にある受取人の名前を確認します。店員は領収書を取り出し、コピーを彼女に残します。彼女は自分の名前が書かれた伝票をカウンターから受け取ります。'
        p2: '最後の支払いが来ると、常連客は次の絵をどれくらい早く始められるかを尋ねます。アルテミシアは顔料の請求書を押し倒し、彼がそれを読み上げるのを待ちます。仕事が始まる前に事務員に前払い金を記録してもらい、各人に 1 部ずつ渡します。彼女は顔料を買いに行くとき、いつお金を引き出すことができるかを示した紙を持っていきます。'
      outcomes:
        all: 'アカデミーは料金を受け取ります。次の合意では、前払いの日付が与えられることになる。アルテミシアは顔料の代金を支払い、最初のキャンバスを張ります。'
        p1: 'アルテミシアは歴史的な日に入院した。次に物資を注文したいときも、やはり常連客にお金を頼まなければなりません。'
        p2: '前払いは次の契約に移ります。アカデミーの学費は滞っており、旅行には絵をめぐる交渉だけが残されている。'
      none: '2つの経費の領収書はまだ同じ山の中にあります。店主はもう一度どちらを先に支払うべきかを尋ねます。'
      not_admitted: '店員は期待する人たちのために席を用意している。あなたは外にいて、誰かが顔料の請求書の中にアカデミーの伝票を提出しているのを眺めます。'
      desync: '当日料金のお支払いは行っておりません。登録が同期されなくなり、事務局はその旅行者をリコールします。'
      excerpts:
        p1: '店員は領収書を取り出し、コピーを彼女に残します。彼女は自分の名前が書かれた伝票をカウンターから受け取ります。'
        p2: '仕事が始まる前に事務員に前払い金を記録してもらい、各人に 1 部ずつ渡します。彼女は顔料を買いに行くとき、いつお金を引き出すことができるかを示した紙を持っていきます。'
    relic: '顔料の瓶'
    relic_desc: 'グランドラピスブルーの小さな瓶。'
    points:
      p1: 'アルテミシアが 7 月 19 日の入学に間に合うようにアカデミーの学費を手配できるように手伝ってください。'
      p2: '最初の依頼が解決したら、アルテミシアが次の契約で期限付きの前払い金を確保できるように支援し、絵を描き始める前に材料を購入できるようにしてください。'
    points_fail:
      p1: '当支店ではアルテミシアが当日料金を負担することはできません。彼女の登録は同期されず、オフィスはその従業員をリコールします。'
      p2: '8 月の残金は記録どおりに支払われますが、アルテミシアさんは別の手数料のために物資を購入する必要があるときに依然としてお金を要求しなければなりません。'
    shift:
      p1:
        was: '1616年7月19日、フィレンツェの絵画芸術アカデミーはアルテミジア・ジェンティレスキの入学を認めた。'
      p2:
        was: '1615 年から 1616 年にかけて、ブオナローティの手数料は分割払いで支払われました。アーカイブには、アルテミシアが作業中に金銭を要求した内容が保存されています。'
        now: '次回の委員会では、作業が始まる前に資材を前払いする日付を設定します。 Artemisia は、合意された支払いに対して顔料を注文できます。'
        who: 'artemisia_florence'
        bio: '彼女はミケランジェロ・ブオナローティ小の家のために『傾向の寓意』を描き、現在も装飾の一部として残っています。入学により、彼女は自分の職業に起因する紛争を扱うアカデミーの法廷にアクセスできるようになった。'
    vignettes:
      pose: '訪問者は鏡に向かって、どちらのポーズがより自然に見えるかを尋ねます。それぞれのポーズが何をしているように見えるかを尋ねます。彼らは、手がそれ自身の目的を維持できるものを選びます。'
      name: '練習用紙にはシッターの説明はありますが、画家の名前は記載されていません。シートを裏返し、シートが積み重なる前に訪問者に両方を置くように頼みます。'
      mirror: '訪問者がねじらずに角度が見えるまで鏡を移動します。一度そのポーズを試してから、絵を描く前に自分たちで小さな変更を加えます。'
  buchner_zurich:
    name: '稽古場の机に置かれた二つの草稿'
    place: 'チューリッヒ'
    figure: 'ゲオルク・ビューヒナー'
    story: '1836年、ゲオルク・ビューヒナーは難民としてチューリッヒにやって来て、大学で講義を始めました。彼は 1837 年 2 月に重病に倒れました。彼の婚約者ミンナ・ジャグレがストラスブールからやって来て、最期近くに彼のところへやって来ました。彼は2月19日に23歳で亡くなり、ヴォイツェクは未完のまま残された。'
    story_prose:
      opening:
        - 'チューリッヒでは、同じ登場人物の名前が含まれているという理由で、誰かが 2 つの草稿をテーブルの上に離して置きました。ビューヒナーは別の部屋に手紙を書くのに使える紙を求めます。まだ体力があるうちに、ミンナにストラスブールから来てもらいたいとのこと。'
        - '1837 年 2 月、ビューヒナーはチューリッヒで重い病気になりました。ミンナは病気で遅れて到着し、そこで亡くなった。ヴォイツェックはいくつかの未完の草稿を残している。あなたはもっと早く彼にメッセージを送り、彼のケアを助けるためにオフィスの架空の医療キットを持参することができます。'
        - 'ビューヒナー自身が何を言いたいのかを知るために、急使を送ってください。ベッドサイドでは、介護経験のある人や、すでにそこにいる人に確認した上でキットを使用してください。'
      points:
        p1: '使者は書きかけの手紙だと思い、迷い込んだページを持ち上げます。あなたはビューヒナーに、自分の言葉を新しいシートに書き留める人に伝えるように頼みます。アドレスが確認されると、メッセンジャーはプレイをテーブルに置き、新しいページを取得します。それを受け止めながら、ビューヒナーは彼がミンナの名前を完全に発音するのを聞いた。'
        p2: '家の中の誰かが見出しを大声で読み上げているが、ビューヒナー氏が止めるよう頼む。あなたはオフィスキットについて説明し、介護者にベッドのそばにいてもらいます。しばらくして、ビューヒナーは目を開け、2つの山のうち薄い方を指さしました。ヘルパーがそれに近づけます。今回、ビューヒナーは誰かにページを選んでもらう必要はありません。'
      outcomes:
        all: 'ミンナはビューヒナーが言いたいことを伝えるのに間に合うようにチューリッヒに到着する。熱は下がります。机の上の 2 つの山はまだ整理されるのを待っています。'
        p1: '手紙はすぐに届けられ、ミンナは彼の言葉を聞くことができる。病気は続き、チューリッヒで亡くなった。'
        p2: 'ビューヒナーの熱は下がり、ドラフトを要求する。先ほどのミンナへのメッセージはまだ間に合いませんでした。'
      none: '手紙と調査書類は一緒に公開されたままになっている。ミンナは終わり近くに到着し、彼はチューリッヒで亡くなります。'
      not_admitted: '屋内にいる人々は訪問者に、邪魔されないように待ってくれるように頼みます。手紙の用紙にはまだ宛先がありません。'
      excerpts:
        p1: 'アドレスが確認されると、メッセンジャーはプレイをテーブルに置き、新しいページを取得します。それを受け止めながら、ビューヒナーは彼がミンナの名前を完全に発音するのを聞いた。'
        p2: 'ヘルパーがそれに近づけます。今回、ビューヒナーは誰かにページを選んでもらう必要はありません。'
    relic: 'シーンの束'
    relic_desc: '窮屈な手の中で、決まった順序ではない緩いシーン。'
    points:
      p1: 'ビューヒナーがミンナに自分から来るように頼むことができるうちに、ストラスブールにメッセージを送ってください'
      p2: 'オフィスの医療キットをベッドサイドに持ってきて、彼の世話をする人々が発熱を乗り切るのを手伝う'
    points_fail:
      p1: 'ミンナは病気の後期に彼に会いに行きました。彼が彼女に送りたかったメッセージはまだテーブルの上にあります。'
      p2: '発熱が続いています。彼はもう机の上にあるページを要求することはできません。'
    shift:
      p1:
        was: '1837年2月：彼の婚約者ミンナ・イェグレはストラスブールからチューリッヒへ急ぐが、すでに死期が迫っていたときに到着した。彼はすぐに彼女の傍らで亡くなった。'
        now: 'この支店では、ミンナがより早くチューリッヒに到着します。彼がまだ十分に強いうちは、彼らはお互いに話すことができます。'
      p2:
        was: 'ビューヒナーは1837年2月19日、ヴォイツェックを未完成のままチューリッヒで死去した。'
        now: 'この支店では、オフィスの医療キットが {staff} の熱を下げるのに役立ちます。ビューヒナーさんは生きており、机の上にまだあるページを見せてほしいと頼むことができます。'
        who: 'buchner_zurich'
        bio: 'この支部では、ビューヒナーは 1837 年 2 月にチューリッヒで病気を乗り越えて生きています。'
    vignettes:
      order: '読者は 2 冊を組み合わせて、シーンにインクで番号を付けました。各ソースに個別のラベルを追加し、取り外し可能な伝票に提案された注文を書き込みます。次の読者はそれを元に戻すことができます。あなたはその伝票を家に持ち帰ります。まだ最終注文が決まっていません。'
      pause: '将来の劇場は次に何をするかを決定する必要があることはわかっています。読者は、あなたの答えが著者のものであるかどうかを尋ねます。両方の冒頭を声に出して試し、異なる疑問が残る箇所にマークを付けます。 2 回一時停止しても、完成した脚本は持ち帰れません。'
      gap: 'ページが止まった瞬間に読者に立ち止まってもらいます。どちらも不足している行を提供しません。コピーには、一目でわかるように十分な幅のスペースを残します。その空間は、戻ってきたときに思い出すものです。'
  enheduanna_ur:
    name: '茨を抜ける道'
    place: 'ウル、メソポタミア'
    figure: 'エンヘドゥアンナ'
    story: 'ウルからの刻まれたディスクには、エンヘドゥアンナがサルゴンの娘として記されています。 『イナナの高揚』では、話者は自分自身をエンヘドゥアンナと呼び、神殿から追い出されたことを説明しています。彼女は自分の飛行をツバメの飛行に例えて、とげと疲労について話します。旅行の日付とルートは不明です。'
    story_prose:
      opening:
        - 'ウルの外では、夕暮れ時には石が見えにくくなります。エンヘドゥアンナは茨の茂みのところで立ち止まり、空の水瓶を持ち上げます。彼女と一緒に歩いている人は、もっと遠くに座っていそうな出入り口を覚えています。'
        - 'ディスクの碑文にはエンヘドゥアンナの名前が残っています。後世に伝えられ、伝統的に彼女の作とされている詩は、別の土地での避難ととげを描いています。この旅は詩から設定を得て、彼女に途中で立ち寄る場所を与えます。'
        - '水を持って長い散歩に慣れている人に水を分けてもらいましょう。最初の人が住んでいる家で、朝までそこで待ちたいかどうか尋ねます。'
      points:
        p1: '彼女の仲間は次の庭まで水を貯めておきたいと考えています。あなたはエンヘドゥアンナに歩き続けたいかどうか尋ねます。彼女は空の瓶であなたの近くの壁を指さします。あなたは彼女に水を与え、ドアのところにいる人に夜明けまでそこに座っていてもいいか尋ねます。半日ぶりに、彼女は中身が詰まった瓶を平地に置きました。'
      outcomes:
        all: '彼女は低い壁の中で一夜を過ごします。後の詩でもまだいばらについて語られています。この旅行には、暗くなる前に彼女が見つけた場所の別の記録が残っています。'
        p1: '家族は玄関のそばにエンヘドゥアンナのためのスペースを作ります。出発する前に、彼女は仲間に自分の瓶にも水を入れるように頼みます。'
      none: '暗くなる前に壁の向こうからは答えは来ない。党は歩み続けなければなりません。'
      not_admitted: 'パーティーは自分の会社を認識しており、あなたを同行させません。あなたには水瓶をドアのそばに置くだけの時間があります。'
      excerpts:
        p1: 'あなたは彼女に水を与え、ドアのところにいる人に夜明けまでそこに座っていてもいいか尋ねます。半日ぶりに、彼女は中身が詰まった瓶を平地に置きました。'
    relic: '粘土製の水カップ'
    relic_desc: '道路沿いの架空の世帯に属する小さなカップ。'
    points:
      p1: 'エンヘドゥアンナが寺院から追い出された後、水を運び、彼女が休む場所に着くのを手伝ってください。'
    points_fail:
      p1: 'あなたが立ち寄ろうと思っていた場所はまだ遠すぎます。彼女に休息の場所を提供する前に、日光が足りなくなってしまいます。'
    shift:
      p1:
        was: '『イナナの高揚』の講演者は、神殿から追い出され、とげに直面し、力尽きた様子を描写しています。'
        now: 'この支店では、{staff} がエンヘドゥアンナと一緒に避難所に到着するまで歩き、暗くなる前に水を持ってきます。'
        who: 'enheduanna_ur'
        bio: 'この支部ではエンヘドゥアンナが仲間となり、寺院を出た後に休む場所を見つけます。'
    vignettes:
      inscription: '{staff} は、家庭で瓶に詰め替えるのにかかる料金を確認します。入り口にいる人は、最初に飲んで、日が明るくなってから残りのことを話し合ってもよいと言います。'
      support: '{staff} は、低い壁に誰かを助ける前に瓶を置くよう仲間に頼みます。今度は瓶は直立したままになります。'
      edge: '{staff} は、出入り口の横の場所が空いているかどうかを確認します。中の誰かがバスケットをベンチから遠ざけました。'
  ibn_sina_hamadan:
    name: '最後の腹痛'
    place: 'ハマダン、ペルシャ'
    figure: 'イブン・スィーナー'
    story: 'イブン・スィーナーは最後の旅の何年も前に、ハマダーンで5冊の医学正典を完成させた。彼の友人アル・ジュジャーニーが続けた記述では、イブン・スィーナーは繰り返し腹痛の発作に苦しんでいる。彼は 1037 年に、彼が仕える統治者とともにハマダンへの旅の途中で亡くなりました。'
    story_prose:
      opening:
        - 'ハマダーンへ向かう一行は寝具を集めている。イブン・スィーナーは書類を置き、少し待ってもらえるか尋ねます。同行者は彼が腹部を押さえ、横になれる場所を探しているのを目撃した。'
        - '彼の伝記の続きには、彼の人生の終わり近くに再発する痛みが記録されています。イブン・スィーナーは 1037 年にハマダーンで亡くなりました。このブランチでは、どこに立ち寄りたいかを尋ね、休憩している間誰かにそばにいてもらうことができます。'
        - '介護の経験がある人なら、いつやめたいかを尋ねることができます。彼がすでに知っている仲間を見つけてください。彼とパーティーはどれくらい待つかを決めることができます。'
      points:
        p1: '誰かが彼を助けてあげる時期が来たかどうか尋ねます。あなたは毛布のそばにしゃがみ、どこに止まりたいか尋ねます。彼はさらに奥の日陰の場所を指さし、そこには何か寄りかかるものがあるだろう。あなたは同行者に、自分の持ち物を他の人に渡して、イブン・スィーナーが見える場所に座るように頼みます。次のノックでは中からもう少し時間をくださいという返事が返ってきた。'
      outcomes:
        all: '旅のこの行程では、一行はイブン・スィーナーがいつ起きられるか言うのを待ちます。彼はハマダーンに到着した後も亡くなっています。'
        p1: '同行者の一人は彼と一緒に座って残ります。すでに詰め込まれた荷物を急いで取りに行くように彼に頼む人は誰もいません。'
      none: '他の人たちは再び準備ができていますが、彼が横になる場所はまだありません。彼らにはまだまだ先がある。'
      not_admitted: '一行の一人があなたに感謝の意を表し、会う予定のなかった訪問者には外で待つよう頼みます。彼が何を望んでいるのかを尋ねることはできません。'
      excerpts:
        p1: 'あなたは同行者に、自分の持ち物を他の人に渡して、イブン・スィーナーが見える場所に座るように頼みます。次のノックでは中からもう少し時間をくださいという返事が返ってきた。'
    relic: '折りたたまれた紙切れ'
    relic_desc: '一行が立ち寄った場所を記した架空の旅メモ。'
    points:
      p1: '痛みが再発したら、イブン・スィーナーにどこに立ち寄りたいかを尋ね、休んでいる間誰かがそばにいてくれるように手配してください。'
    points_fail:
      p1: 'あなたが彼が横になる場所を作る前に、パーティーは再び動き出す準備ができています。'
    shift:
      p1:
        was: 'アル・ジュジャニの記述には、再発と1037年のハマダーンでのイブン・スィーナーの死が記されている。'
        now: 'このブランチでは、{staff} がイブン・スィーナーが痛みが戻ったときに休める場所を作ります。同行者は彼と一緒にいて、出発を待っている人々に彼の返事を伝えます。'
    vignettes:
      section: '{staff} は、最後の停留所からどれくらいの距離を移動したかを尋ね、その答えを後で読み返せるスクラップに記録します。'
      sleeve: '誰かが寝具を巻き上げ始めます。 {staff} は、イブン・スィーナーが行くかどうか決めるまで、毛布を 1 枚広げたままにしておくように頼みます。'
      afterlife: '{staff} は、他の人が準備をしている間、誰が部屋で待つかを尋ねます。同行者の一人は荷物を屋内に持ち帰った。'
  al_jazari_diyarbakir:
    name: 'からくり仕掛けの本'
    place: 'ディヤルバクル'
    figure: 'アル＝ジャザリー'
    story: 'アル＝ジャザリーの機械装置に関する論文は 1206 年に遡ります。1315 年にコピーされた現存する写本フォリオには、その象時計が描かれています。'
    story_prose:
      opening:
        - '真ん中で、店員が配達テーブル上のページのリストを開きます。誰かが図面を持って到着し、その見出しの 1 つが 2 つの章に属する可能性があると言いました。ベンチは影になっていきます。アル＝ジャザリーは彼らに、目が見えるうちにもう一度確認するよう頼んだ。'
        - 'アル＝ジャザリーは 1206 年に機械装置の本を完成させました。現存するコピーには、図面とともに説明が保存されています。ここで、引き継ぎを保護し、後のコピー作成者のために参照セットを選択するように依頼できます。'
        - 'キャプションと段落を照合できる人に納品コピーをチェックしてもらいます。コピーリストは、著者がどのメモや空白スペースをそのままにしておきたいかを尋ねることができます。'
      points:
        p1: '店員は内容の中で繰り返されている見出しを指さします。アル＝ジャザリーは彼に別のページをめくるよう指示します。すると、2番目の絵の横にどこか別の場所につながるマークが見えます。 2 つのページ参照を引き継ぎリストに追加し、受信者自身にテストしてもらいます。彼は本を閉じ、両方とも見つけたと言いました。'
        p2: '写字生は本文に欄外注を入れてスペースを節約したいと考えています。アル＝ジャザリーは彼に元の文を休止部分まで読んでもらい、あなたはその横にメモの別の出典をラベル付けします。次の読者は、作者がどこを空白にしたのかを知ることができます。写し手はペンを止め、書き足した箇所の下に別の見出しを入れます。'
      outcomes:
        all: '事務員は完成した原稿を受け取ります。 2 番目のコピーでは参照が保持され、後のコピー作成者が元のキャプションを識別する方法が提供されます。'
        p1: 'セット全体でお届けし、その内容は各イラストにつながります。新しいメモを分離する参照コピーはまだありません。'
        p2: 'メモの出所が特定される。配送セットには一致する図面がまだなく、旅行では引き渡し全体を維持できません。'
      none: '繰り返される見出しは未解決のままです。次の写本師が到着し、どの巻を開くか尋ねなければなりません。'
      not_admitted: '店員はセットを受け取る人の名前を読み上げます。誰もあなたに電話をかけず、コンテンツは閉じられたままになります。'
      desync: 'いくつかの図面は内容と一致しなくなりました。セットが配達できないため、事務局は旅行者を呼び戻します。'
      excerpts:
        p1: '2 つのページ参照を引き継ぎリストに追加し、受信者自身にテストしてもらいます。彼は本を閉じ、両方とも見つけたと言いました。'
        p2: '次の読者は、作者がどこを空白にしたのかを知ることができます。写し手はペンを止め、書き足した箇所の下に別の見出しを入れます。'
    relic: '真鍮のカム'
    relic_desc: 'スピンをストロークに変える形状のホイール。'
    points:
      p1: 'アミッドでの引き渡しの際は、説明文やイラストと内容を照合し、完成した原稿をお渡しいたします'
      p2: '著者とともに参照コピーを選択します。後でコピーする人が区別しておく必要があるメモ、キャプション、空白スペースをリストします。'
    points_fail:
      p1: 'いくつかの図は、そのセクションと照合できなくなりました。原稿をセットで渡すことができず、事務所は社員をリコールする。'
      p2: '次の写字生は、他のメモを蓄積した草稿に基づいて作業します。読者は、著者の説明と後から追加された記述を区別することはできません。'
    shift:
      p1:
        was: '初期のトプカプ写本の奥付には、完成日が 1206 年 1 月 16 日と記載されています。アル＝ジャザリーの本は、アミッドのアルトゥーク朝の宮廷に関連していた。'
      p2:
        was: '後の写本はすべて同じ枝をたどるわけではありません。一部イラストや文言が異なります。'
        now: 'コレクションには著者がチェックしたコピーが保管されています。後の筆記者は、自分の変更を個別に記録し、それに対してキャプションをチェックできます。'
        who: 'al_jazari_diyarbakir'
        bio: 'アル＝ジャザリーは『アミッド』にその記述を書いた。本がコピーされ、場所間を移動されると、テキストとイラストも一緒に変化しました。'
    vignettes:
      sequence: '見習いはすべての図を一度に説明します。最初の楽章を指差し、その直後に何が来るかを尋ねます。彼らは順番に時計の物語を語り始めます。'
      viewer: '訪問者は最大のフィギュアから決して顔を上げません。あなたは彼らに、代わりに見習いがマークした場所を観察するように頼みます。 2 番目のデモンストレーションでは、時間の小さな動きを確認します。'
      paper: '見習いがその絵の向こう側のモデルを指差している間、あなたはその絵をかざします。モデルを持たない読者でもどこを見ればよいかわかるように、小さなマークが 1 つ追加されています。'
  hokusai_edo:
    name: '神奈川沖浪裏'
    place: '江戸、日本'
    figure: '葛飾北斎'
    story: '北斎の「神奈川沖浪裏」は富嶽三十六景の木版画です。メトロポリタン美術館の印象は 1830 年から 1832 年頃に遡ります。'
    story_prose:
      opening:
        - '江戸の出版社がカウンターに新鮮な印章を 3 冊並べています。最も暗い部分では、頂上のごく一部が埋まってしまいます。最も薄い部分では、遠くの富士が見えにくくなります。彫刻家は 1 枚のシートに手を伸ばし、印刷機は別のシートに手を伸ばします。'
        - '「神奈川沖浪裏」は北斎の富嶽三十六景のひとつです。残っているインプレッションは、ブロックの磨耗などの変化を保存します。報道機関による共有参照を掲載し、後で確認できる順序を保持するよう出版社に依頼することができます。'
        - '印刷に詳しい人にシートを比較してもらいます。保管を手配できる人は、北斎、印刷業者、出版社に、後のサンプルの保管方法を尋ねることができます。'
      points:
        p1: '彫刻家は証拠を 1 つ窓に運びます。そこでは、青く透き通った富士山が見えます。印刷業者に同じ光で紋章を見て、別のシートと比較するように依頼します。二人とも同じ明確な線のそばに指を置きました。選択されたプルーフには隅に小さなマークが付きます。遠くの山の上の空間は澄んだままです。'
        p2: '店員がサンプルを販売棚に差し込みます。出版社は、次回も見つけられるかどうか尋ねます。北斎と印刷業者に包装紙に注文を書いてもらい、後の校正刷りのために包装紙の一方の端を開いたままにしておきます。ブロックから外された次のシートは、カウンターに近づく前にセットの後ろに移動します。'
      outcomes:
        all: 'ファーストインプレッションは発売されますが、ワークショップには比較するためのセットがまだあります。別のプリンターが引き継いだ場合でも、ページをめくることで注文を読み取ることができます。'
        p1: '彫刻家と印刷業者は、1 回の校正刷りから最初の作業を完了します。その後のサンプルは販売版に分散されます。'
        p2: 'サンプルには注文があります。 1本目はラインブレイクでなおも抑えられる。旅人は校正刷りを注文した現場を持ち帰る。'
      none: '出版社はレジのそばに最もきれいに見えるシートを立てます。家紋を確認しに来た人たちは、今でも別のコピーを見ています。'
      not_admitted: '出版社はどこの印刷所から持ってきたのか尋ねます。訪問者を誰も知らないため、証拠はカウンターの後ろに戻ります。'
      desync: '波は同じ場所で砕け続け、最初のグループは店から出ません。事務所は旅行者を呼び戻します。'
      excerpts:
        p1: '選択されたプルーフには隅に小さなマークが付きます。遠くの山の上の空間は澄んだままです。'
        p2: '北斎と印刷業者に包装紙に注文を書いてもらい、後の校正刷りのために包装紙の一方の端を開いたままにしておきます。ブロックから外された次のシートは、カウンターに近づく前にセットの後ろに移動します。'
    relic: '印刷用の版木'
    relic_desc: '桜の木の彫刻が施された板。'
    points:
      p1: '波頭と遠くの峰の両方がはっきりと読める、江戸の版元の校正刷りを選んでください。最初の実行の基準としてカーバーとプリンターに残しておきます。'
      p2: '出版社が校正刷りを分割する前に、北斎と印刷業者に比較セットを保管してもらいます。印刷が再開されるたびに、新しい校正刷りを順番にファイルするよう出版社に依頼してください。'
    points_fail:
      p1: '彫り師と印刷業者には共有プルーフがなく、同じ破線の波線が入ったバックシートを送り続けます。出版社は初回の配達を保留し、事務局は従業員をリコールする。'
      p2: '販売部数のみカウンターにございます。北斎が印刷業者に確認した校正刷りは在庫に戻され、新しい印刷業者がそのセットを回収することはできません。'
    shift:
      p1:
        was: '江戸の出版社永寿堂は、1831 年の正月に『富嶽三十六景』を広告しました。『神奈川沖浪裏』はそのシリーズに属しており、波の線がそのまま残っている初期の印象が残っています。'
      p2:
        was: 'これらのインプレッションには日付やバッチ番号は含まれません。元の版木は現存しておらず、版画の痕跡がその順序を知る主な手がかりとなります。'
        now: '永寿堂はカウンターの後ろに校正刷りのパケットを整然と保管しています。新しい印刷業者は、後でどのギャップが現れたかを判断し、その印刷が北斎のデザインに合っているかどうかを判断するよう依頼することができます。'
        who: 'hokusai_edo'
        bio: '北斎がイメージをデザインしました。紙の上での見た目は、彫刻家がどこを切るか、印刷業者がどのようにインクを転写するか、そして出版社がいつ再版を注文するかによっても決まりました。'
    vignettes:
      mountain: '売り手は泡を指差します。あなたは彼に手で波を覆うように頼みます。彼がそれを明らかにすると、遠くにある小さな三角形は別の飛沫のようには見えません。'
      edge: '売り手は練習シートをトリミングしたいと考えています。あなたはその横にトリミングされていないコピーを置き、署名が端にどれだけ近いかを彼に見せました。'
      counter: '何よりも富士を探し続ける顧客に向けてプリントを向けます。顧客は最終的にページの一番下にあるビューを見つけて、別のビューを表示するように要求しました。'
  bell_boston:
    name: '聞こえたことを書き留める'
    place: 'ボストン'
    figure: 'アレクサンダー・グラハム・ベル'
    story: 'アレクサンダー・グラハム・ベルの実験ノートには、1876年3月10日にボストンでトーマス・ワトソンがベルが発信機に向かって話した言葉を聞いて理解したことが記録されている。 6月25日のフィラデルフィア100周年展示会で、ベルは審査員に電話の実演を行った。'
    story_prose:
      opening:
        - 'ボストンでは二つの部屋のドアが閉まっています。ワトソンは耳を塞いで聞いているが、ベルはベンチの上で立ち止まり、もう一言試してもいいかと尋ねる。誰かが仕事が終わったと思い、装置を片付け始めます。'
        - '1876年3月10日、ベルはワトソンが別の部屋から送られた言葉を理解したと記録した。 6月、ベルはフィラデルフィアの100周年展示会でデモンストレーションを行った。ここでは、裁判を保存し、彼の同僚が彼がいない間にボストンの学生が何をするかについて同意するのを助けることができます。'
        - '設備に気を配り、注意深く話を聞くことができる人が 2 つの部屋を手伝ってくれるでしょう。展示会の前に、スタッフのスケジュールに詳しい人に講師の手配を確認してもらいます。'
      points:
        p1: 'ワトソンが出てきて、それを聞いたと言いました。書かれた文章を裏向きにしておいて、最初から最後まで何が伝わったかを言ってもらいます。ベルはその言葉を聞くと、何も促されずにペンを手に取ります。男たちは場所を変え、再びドアを閉めます。今度はワトソンが話します。'
        p2: '同僚が時間割を開いて、ベルしか知らない生徒もいると言う。ベルはすでに設定されている演習を読み上げ、次の教師に空いた時間を埋めるように頼みます。あなたは、家族のために合意した時間割のコピーを作成するのを手伝います。ケースを詰める前に、ベルは自分のコピーと鉄道の切符を別のポケットに滑り込ませます。'
      outcomes:
        all: '3月の裁判は手帳に残っています。フィラデルフィアでデモが始まると、ボストンの授業は合意されたスケジュールに従います。'
        p1: 'ワトソンは聞いたことを繰り返します。 6月の準備にはまだ使える指導計画がありません。'
