    relic: '校正刷りの一頁'
    relic_desc: '鉛筆で訂正を書き込んだ校正刷り。'
    points:
      p1: '病気で校正が中断されるたびにカフカの代わりを務め、彼が修正していたストーリーを保護します'
      p2: 'ヘルパー間で用事や連絡事項を共有し、キーリングに滞在する人々が休息できるようにする'
      p3: '喉の痛みを和らげ、最後の数週間でも水や柔らかい食べ物を数口飲み込めるようにする'
      p4: 'ベルリンの出版社に先行コピーを製本してキーリングに送ってもらい、カフカが彼の 4 つの物語を一緒に見られるようにしてください'
    points_fail:
      p1: '証明は最終的な修正を加えずにベルリンに戻されました。支店は同期を失い、オフィスはその従業員をリコールします。'
      p2: '同じ人々が見張りをし、手紙に返事をし、用事をこなすことになり、返事を待つ間休憩することはありません。'
      p3: '喉の痛みのため、彼はまだ食べることができませんでした。この支部で、彼は最後の数週間をメモを通して話し、ほとんど飲み込むことができなかった。'
      p4: 'カフカはその本を見たことがない。出版社は彼の死後にのみそれを発送します。'
    shift:
      p1:
        was: '1924年5月、カフカはキーリングで病気の間、『飢えた芸術家』の校正校正を続けた。'
      p2:
        was: '1924 年 5 月、友人がキーリングに来て、重病のカフカの世話を手伝い、彼のパートナーが行っていた仕事の一部を軽減しました。'
        now: '{staff} は、ヘルパーたちに交代で手紙を受け取り、ページを送り、付き添ってもらいます。そのうちの1人が到着すると、見張りをしている人は外に出ることができます。'
      p3:
        was: '1924 年の春、結核がカフカの喉頭に到達しました。嚥下は非常に痛く、食べることも寝ることもほとんどできず、医師は痛みを抑えるために8～10日ごとに喉頭神経に注射をした。彼は6月3日にキーリングで死去した。'
        now: '{staff} は、医師が食事前に痛みを和らげるタイミングを計るのに役立ちました。最後の数週間、彼は水を飲み、柔らかい食べ物を数口食べることができ、歴史に比べて苦しみはいくらか軽減されました。'
      p4:
        was: 'カフカは 1924 年 6 月 3 日に亡くなり、同年 8 月にコレクション『ハンガー・アーティスト』が出版されました。'
        now: '{staff} は、Berlin に修正されたシートの 1 部を製本して、先に送付するように依頼します。カフカはキーリングでそれをめくり、4つの物語と彼が選んだ順序を認識します。'
        who: 'kafka_kierling'
        bio: 'カフカは死ぬ前に、最終校正刷りで製本されたコピーを見ました。印刷版では、彼が承認した選択と順序が維持されました。'
    vignettes:
      lilac: '5 月 13 日、{staff} は、療養所の庭師がフェンスのそばにあるライラックを切り戻すのを手伝います。庭師は、今年は開花が一週間遅れたが、ミツバチが許してくれなかったと語った。彼は、彼らは今、文句を言うためだけにキッチンの窓に来ると誓います。'
      post: '5月23日、{staff}は療養所の使いと一緒にクロスターノイブルクの郵便局へ歩いて行きました。少年は、手紙がどこから来たのかは読まなくてもわかると言う。ベルリンからの手紙は紙が太くて硬いが、プラハからの手紙は薄くて毎日来る。'
      rain: '6月中旬、{staff}は村のパン屋の戸口で暴風雨から避難しました。パン屋の妻は、通りが小川に変わるのを眺め、キーリング川が氾濫するのは段差をこすったときだけだと言います。'
  poe_baltimore:
    name: '第四区から届いた書き付け'
    place: 'ボルチモア'
    figure: 'エドガー・アラン・ポー'
    story: '1849年9月27日、エドガー・アラン・ポーはリッチモンドを出てニューヨークのフォーダムの自宅に向かい、翌日ボルチモアに到着した。今後5日間の彼の行方は不明である。 10月3日の選挙日、ライアン第4区の投票所で彼がひどく苦しんでいるのが発見され、印刷業者ジョセフ・ウォーカーはジョセフ・スノッドグラスにメモを送った。彼はワシントン大学病院に運ばれ、面会者から隔離され、10月7日の夜明け前にそこで40歳で亡くなった。原因はまだ不明です。彼の叔母であり義母のマリア・クレムさんは新聞でそのことを知りました。'
    story_prose:
      opening:
        - 'ボルチモア、1849年9月下旬。作家エドガー・アラン・ポー（40歳）は『大鴉』を書き、恐怖と発見の物語を書いた。この夏、彼は雑誌の資金を集めるためにリッチモンドで講演した。 9月27日に彼はニューヨークのフォーダムの自宅に向けて出発し、翌日ボルチモアに到着した。フォーダムで彼を待っているのは、彼の叔母であり義母であるマリア・クレムだ。'
        - '歴史上、その後5日間、彼がどこにいたのかの信頼できる記録は存在しない。 10月3日の選挙日、印刷業者のジョセフ・ウォーカーは第4区の投票所で彼がひどく苦しんでいるのを発見し、スノッドグラス医師に来るよう求めるメモを送った。彼はワシントン大学病院に運ばれ、酔っぱらって運ばれてきた患者専用の部屋に入れられ、何日も意識を失ったり、面会者から遠ざけられたりして、7日未明に死亡したが、原因はまだわかっていない。 2日後、マリア・クレムはフォーダムの新聞で彼の死を読み、ボルチモアに手紙を書いて尋ねた。この支店では、ポーターが埠頭でトランクを運び、ロンバード・ストリートの居酒屋の店主が樽の数を数え、夜間ポーターが病棟を守っています。'
        - 'この旅では、数種類の人々が助けてくれるでしょう。確固たる意志を持って医学を知っている人、またはよりしっかりとした意志を持って几帳面で用心深い人が、助けを求めるメモを受け取り、投票所から病院まで安全に面会してくれるでしょう。看護や介護の訓練を受けた人、配達員やジャーナリスト、親切で忍耐強い人や几帳面な人、あるいはノートとペンを持っていて機知に富んだ人で、マリア・クレムに連絡を取る人。頭の回転が速く意志の強い医師、あるいは医学に精通していてせん妄状態から診てくれるナノ医療キットを携行している人。'
      outcomes:
        all: '10月末、ポーは病院を退院し、北のニューヨークの自宅に向かった。フォーダムの小さな家の玄関で、マリア・クレムはボルチモアからの手紙を手に立ち、道の行き止まりを眺めていた。'
        p3: '10月末、ポーは病院を出て北のニューヨークの自宅に向かった。彼は杖に寄りかかり、病院の階段で立ち止まり、襟のボタンを留めた。'
        p2: '10月7日未明、ポーは病院で亡くなった。マリア・クレムの答えはすでに病棟に届いており、その部屋の窓辺に置かれていた。'
        p1: '10月7日の夜明け前、ポーはワシントン大学病院で40歳で亡くなった。翌日、彼はボルチモアの祖父の敷地に埋葬された。ほとんど人が来なかったので、数分で終わりました。'
      none: '10月7日未明、ポーはワシントン大学病院で亡くなったが、死因はまだわかっていない。 2日後、マリア・クレムさんはフォーダムの新聞でニュースを読み、座ってボルチモアに手紙を書き、何も隠さないでほしいと頼んだ。'
      desync: '10月3日、助けを求めるメモは投票所下の群衆の中で数人の手をすり抜け、最終的に誰かのポケットに収まった。 {staff} がリコールされたとき、男性は帽子を顔の半分までかぶったまま、階段の下のベンチに倒れたままだった。'
      not_admitted: '{staff}は彼に近づくことはなく、数日間埠頭でトランクを運んだだけでした。リッチモンドからの汽船は次々と繋がれ、下船する乗客の中には杖をついた痩せた男性がゆっくりと歩いていた。'
      points:
        p1:
          class_medical: '10月3日の午後、第4区の投票所の下の1階は人でいっぱいで、飲み物の匂いと湿った木の匂いが混ざり合った。階段の下からメモが出てきて、何人かの手を通過します。医学に詳しい{staff}はメモを取り、誰に尋ねているかを読み、スノッドグラス博士が見つかるまで道を尋ね、彼とポーの叔父が馬車を連れてポーを階段の下のベンチから引き上げるのを手伝う。ポーは馬車の隅にもたれて、誰にも聞き取れないことを言った。馬車が発車すると、{staff} はカーテンを窓の上半分まで下げ、投票所のドアから忍び寄る顔をシャットアウトします。'
          trait_vigil: '10月3日の午後、第4区の投票所の下の1階は人でいっぱいで、飲み物の匂いと湿った木の匂いが混ざり合った。階段の下からメモが出てきて、何人かの手を通過します。階段を監視していた{staff}はメモを取り、誰に尋ねているかを読み、スノッドグラス博士が見つかるまで道を尋ね、彼とポーの叔父が馬車を連れてポーを階段の下のベンチから引き上げるのを手伝う。ポーは馬車の隅にもたれて、誰にも聞き取れないことを言った。馬車が発車すると、{staff} はカーテンを窓の上半分まで下げ、投票所のドアから忍び寄る顔をシャットアウトします。'
          else: '10月3日の午後、第4区の投票所の下の1階は人でいっぱいで、飲み物の匂いと湿った木の匂いが混ざり合った。階段の下からメモが出てきて、何人かの手を通過します。 {staff}は几帳面で、メモを取り、誰に尋ねているかを読み、スノッドグラス博士が見つかるまで道を尋ね、博士とポーの叔父が馬車を連れてポーを階段の下のベンチから引き上げるのを手伝う。ポーは馬車の隅にもたれて、誰にも聞き取れないことを言った。馬車が発車すると、{staff} はカーテンを窓の上半分まで下げ、投票所のドアから忍び寄る顔をシャットアウトします。'
        p2:
          class_medical: '10月4日、病棟は訪問者の立ち入りが禁止され、尋ねに来た人は全員階下に閉じ込められ、フォーダムではまだ誰も彼の居場所を知りません。看護の訓練を受けて病棟への入室を許可された{staff}は、病院が知っていること、彼が何日に運ばれたのか、どの部屋にいて、誰が世話をしているのかを調べ、返信先の住所を書いた手紙に入れて、北行きの郵便物より先に郵便局に届ける。郵便局員が封筒にスタンプを押します。それはフォーダムのマリア・クレムに宛てられたもので、彼はそれをニューヨーク行きのバッグに入れました。'
          class_press: '10月4日、病棟は訪問者の立ち入りが禁止され、尋ねに来た人は全員階下に閉じ込められ、フォーダムではまだ誰も彼の居場所を知りません。ニュースがどのように最速で伝わるかを知っている元ジャーナリストの {staff} は、病院が知っていること、彼が運ばれた日に、どの部屋にいて、誰が世話をしているのかを調べ、返信先の住所を書いた手紙に入れて、北行きの郵便物より先に郵便局に届けます。郵便局員が封筒にスタンプを押します。それはフォーダムのマリア・クレムに宛てられたもので、彼はそれをニューヨーク行きのバッグに入れました。'
          class_travel: '10月4日、病棟は訪問者の立ち入りが禁止され、尋ねに来た人は全員階下に閉じ込められ、フォーダムではまだ誰も彼の居場所を知りません。 {staff} は、用事を済ませ、北行きの郵便物がいつ届くかを知ることに慣れており、病院が知っていること、彼が何日に運ばれたのか、どの部屋にいて、誰が世話をしているのかを調べ、返信先の住所を書いた手紙に入れて、北行きの郵便物より先に郵便局に届けます。郵便局員が封筒にスタンプを押します。それはフォーダムのマリア・クレムに宛てられたもので、彼はそれをニューヨーク行きのバッグに入れました。'
