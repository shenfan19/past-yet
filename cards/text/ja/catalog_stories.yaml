      courtyard: '{staff} は、雨が降った後に空気を入れるために中庭の日陰に本を置き、正午に各巻を裏返してカバーを均等に乾燥させます。'
      slip: '{staff} は、各巻のタイトルと最初の行を細い紙に書いて革のフラップの下に押し込むので、本を開かなくても名前を付けることができます。'
  nezahualcoyotl_texcoco:
    name: '歌のそばに書かれた名前'
    place: 'テクスココ'
    figure: 'ネサワルコヨトル'
    story: 'ネサワルコヨトルは 1431 年にテスココの領主となり、1472 年に亡くなるまでテスココを統治しました。彼は詩人および建設者として記憶されています。テスココ湖を横切る長い堤防は彼によって敷設されたと言われている。 16 世紀に収集されたナワトル語の歌は彼の名前に関連していますが、それが彼によって作られたかどうかは定かではありません。'
    story_prose:
      opening:
        - 'テスココ、1472 年。ネサワルコヨトルは 41 年間この都市の領主を務めており、年齢は約 70 歳である。彼は詩人および建設者として記憶されており、テスココ湖の水を分ける長い堤防は彼によって敷設されたと言われています。'
        - '歴史上、彼は今年亡くなり、彼の7歳の息子ネザワルピリが彼の後継者に選ばれました。彼の名前にちなんだ歌は約100年後に歌本に書き写されたが、誰が最初に歌ったのかは誰も知らない。この支部では、これらの歌を知っている宮殿の老歌手が学習者に歌を教え、リハーサルの歌手が次の曲への合図を残し、ヘルパーが練習用紙を整理します。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。見張りができる人、大胆でとてもタフな人、あるいは不安定な日々の中で子どもの安全を守るために睡眠調節装置を持っている人などです。音楽を教えたことのある人、または音楽を知っている人、忍耐強い人、または秩序ある人、またはボイスレコーダーを持って曲を一行ずつ覚えている人。静かに付き添ってくれる人、病人の看護をしてくれる人、あるいはホログラム映写機を持って最後の日に一緒に座ってくれる人。'
      outcomes:
        all: 'その年、7歳のネザワルピリがテスココの領主に選ばれた。歌は最初から最後まで受け継がれ、学習者は後で自分の学習者に歌を教えました。約100年後、それらは彼の名前で歌集に書き写されました。'
        p3: 'その年、ネサワルコヨトルはテスココで死去した。約100年後、彼の名前に関連した歌が歌集として書き写されました。 500 年以上後、彼の顔はメキシコの 100 ペソ紙幣に印刷されました。'
        p2: '学習者はその曲をよく知るようになり、後に自分の学習者にその曲を教えました。約100年後、それらは歌集に書き写され、その横に彼の名前が添えられました。'
        p1: '7歳のネザワルピリはテスココの領主に選ばれ、40年以上その座を守り続けた。'
      none: 'その年、ネサワルコヨトルはテスココで死去した。老歌手が病気になったとき、まだすべての曲が教えられておらず、練習用紙の後半は空白のままでした。選択の日、宮殿は7歳の少年を待っていましたが、無駄でした。'
      desync: '彼の死後、夜になると誰も敷居のところで見張りをしなかった。 {staff} が思い出されたとき、選択の日はまだ来ておらず、少年が眠っていた部屋は空で、マットは壁に丸められていました。'
      not_admitted: '{staff} は宮殿に入ることはなく、町から歌手のリハーサルを聞くだけでした。ある歌手がセリフを終えて後ずさりして、次のセリフのためのスペースを空けた。それが誰の曲だったのか、聴く人それぞれが異なることを言いました。'
      points:
        p2:
          class_teaching: 'その年、宮殿の老歌手は長く歌うことができなくなり、歌の途中で息継ぎをしなければならなくなりました。彼はネサワルコヨトルの名前にちなんだ歌を宮殿の学習者に教えるつもりだった。指導した {staff} は、学習者に一度に 1 行ずつ反復させ、次の行に進む前に各行を学習させ、毎日の終わりに最初から全体を確認し、行が間違っている箇所には練習シートの端に印を付けました。最後の歌を教えられた夜、学習者は最初から最後まで一節も欠かさずに歌いました。老歌手は何も言わず、手は膝の上でそっと時を刻んでいた。'
          else: 'その年、宮殿の老歌手は長く歌うことができなくなり、歌の途中で息継ぎをしなければならなくなりました。彼はネサワルコヨトルの名前にちなんだ歌を宮殿の学習者に教えるつもりだった。 {staff} は彼らの隣で辛抱強く座っていました。老歌手が一節を歌うたびに、学習者はそれを歌い返し、学習者がたじろぐと、老人はもう一度それを歌うよう求められ、一度では十分ではなかった。最後の歌を教えられた夜、学習者は最初から最後まで一節も欠かさずに歌いました。老歌手は何も言わず、手は膝の上でそっと時を刻んでいた。'
        p3:
          class_medical: '彼の晩年、彼の部屋を行き来する人々はそっと歩いていました。 {staff} は病人を看護する方法を知っていて、毛布を巻き込み、カップを持ちながら酒を飲みました。そして、二人きりになって初めて、近づき、これから起こることについてゆっくりと話し始めました。それから約100年後、誰かが自分の名前にちなんだ歌を一冊ずつ書き写して本にしました。500年以上経った今でも、遠く離れた人々は彼の名前を知っており、彼の顔は彼らのお金に印刷されているでしょう。それをすべて聞き終えると、彼は長い間沈黙していたが、顔を向けて戸口の外の湖を眺めた。'
          else: '彼の晩年、彼の部屋を行き来する人々はそっと歩いていました。 {staff} は、ある午後ずっと彼と一緒に座っていましたが、二人だけになったときに初めて、今後のことについてゆっくりと話し始めました。それから約100年後、誰かが自分の名前にちなんだ歌を一冊ずつ書き写して本にしました。500年以上経った今でも、遠く離れた人々は彼の名前を知っており、彼の顔は彼らのお金に印刷されているでしょう。それをすべて聞き終えると、彼は長い間沈黙していたが、顔を向けて戸口の外の湖を眺めた。'
        p1: '彼の死後数日間、誰が彼の後継者を決めるかを決めるために貴族たちが集まり、宮殿には日に日に多くの人が出入りしました。 7歳のネザワルピリ君はある部屋から別の部屋に案内されました。 {staff} は少年が寝ている部屋の外で見張りをしており、夜も外出せず、見知らぬ人がやって来て最初に用件を尋ねるのを呼び止め、少年が眠っているときだけ敷居のそばに座っていました。選択の日の朝、少年はマントの裾が敷居をかすめながら、手を引かれてドアの外へ導かれました。その隣の誰かが数晩座っていた場所は青白くなっていた。'
      excerpts:
        p3: '500年以上経った今でも、遠く離れた人々は彼の名前を知っており、彼の顔は彼らのお金に印刷されているでしょう。それをすべて聞き終えると、彼は長い間沈黙していたが、顔を向けて戸口の外の湖を眺めた。'
        p2: '最後の歌を教えられた夜、学習者は最初から最後まで一節も欠かさずに歌いました。老歌手は何も言わず、手は膝の上でそっと時を刻んでいた。'
        p1: '選択の日の朝、少年はマントの裾が敷居をかすめながら、手を引かれてドアの外へ導かれました。その隣の誰かが数晩座っていた場所は青白くなっていた。'
    relic: '歌い出しを記した札'
    relic_desc: '二人の名前を別々に書き込める練習用の札。'
    points:
      p1: '彼の死後数日間、貴族たちが後継者を選ぶ間、7歳のネザワルピリを安全に保管してください'
      p2: 'ハウスの学習者が、古い歌手から自分の名前にちなんだ曲のすべての行を学べるように手助けしてください。'
      p3: '彼の最後の日には、彼の名前が500年以上経っても記憶に残っていることを知らせてください。'
    points_fail:
      p1: '選択の前に、少年に害が起こり、この支部では、テスココは歴史上そうであったように、7歳の領主を迎えません。'
      p2: '老歌手は教えが終わる前に病気になり、この支部では以前と同様にそれらの歌の一部だけが引き継がれます。'
      p3: '歴史と同様に、彼は 1472 年に亡くなり、この部門では、後の人々が彼を覚えていることを決して知りません。'
    shift:
      p1:
        was: 'ネサワルコヨトルは 1472 年に亡くなり、7 歳のネツァワルピリが後継者に選ばれました。'
