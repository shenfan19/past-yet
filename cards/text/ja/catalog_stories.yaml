    shift:
      p1:
        was: '1468年頃: トンブクトゥが政権を交代した後、学者たちは逃亡した。ワラタに行った人もいました。'
        now: '{staff} は、ある世帯がワラタに向かうグループに加わり、最初の安全な停留所までエスコートするのを支援します。'
        who: 'timbuktu_sankore'
        bio: 'トンブクトゥを出発したある世帯は、一緒に旅行するグループを見つけ、最初の目的地に安全に到着しました。'
  al_haytham_cairo:
    name: '対岸の一室'
    place: 'フスタート'
    figure: 'イブン・アル＝ハイサム'
    story: 'フスタトは 1020 年の暴動で火災に見舞われました。イブン アル ハイサムの光学作品はエジプト滞在中に制作されました。この支部では、被害を受けた通りのひとつで光学原稿を借りてきた読者と会っています。'
    story_prose:
      opening:
        - 'フスタット、1020 年。 年代記には火災で家や所有物が破壊されたことが記載されています。イブン・アル＝ハイサムはエジプト滞在中に、光がどのように目に届くかを研究しました。'
        - '歴史上、火災で家が失われました。情報源は、イブン・アル＝ハイサムを特定の通りに配置していません。この支部では、彼が何ページか読む予定だった読者が、被害を受けた通りの 1 つに住んでいます。'
        - '冷静さを保ち、指示を与えることができる人が助けてくれます。原稿は後で読むことができます。まず、読者が通りの端まで到達できるかどうかを調べます。'
      points:
        p1: '{staff} が読者を見つけたとき、光はすでに彼のドアの後ろで消えていました。彼は別のページに戻りたいと考えています。 {staff} は彼に、自分が持っている書庫を持ち出して、隣人が片付けた道を通って立ち去るように頼みました。彼を立てることができる家の中で、彼は不均等な積み重ねを膝の上に座って座っています。紙が一枚、床に滑り落ちます。向かいにいる人はそれを拾い、彼が指した場所へ戻します。'
      outcomes:
        all: '後でイブン・アル＝ハイサムが彼に会いに来る。家には椅子が一つしかないので、二人は低いテーブルのそばに座り、再びそのページを探します。'
        p1: '後でイブン・アル＝ハイサムが彼に会いに来る。家には椅子が一つしかないので、二人は低いテーブルのそばに座り、再びそのページを探します。'
      none: 'やがて通りは閉まってしまいます。イブン・アル＝ハイサムが尋ねると、彼にできることは、融資を記録した伝票を折り畳んで手に入れることだけだ。'
      not_admitted: '{staff} は通りの端で誰かが道を教えてくれるのを待ちます。ドアを閉めるよう求める声がすぐにはっきりと聞こえなくなります。'
      excerpts:
        p1: '紙が一枚、床に滑り落ちます。向かいにいる人はそれを拾い、彼が指した場所へ戻します。'
    relic: '予備の紙葉一組'
    relic_desc: 'この分岐で別の家に託された、架空の光学の覚え書き。'
    points:
      p1: '火が通りに広がる前に読者を避難させ、借りた原稿を安全に保管できる場所を見つける'
    points_fail:
      p1: '従業員は、読者が借りたページを持ち帰るのを手伝うのに間に合わなかった。'
    shift:
      p1:
        was: '1020年: 暴動によりフスタトの一部が放火された。記録には、その日、イブン・アル＝ハイサムや彼の原稿がどこにあったかは記載されていない。'
        now: '{staff} は、読者を、影響を受けた通りの外にある世帯に連れて行きます。イブン・アル＝ハイサムはそこで読者と一緒に原稿を読み進めることを再開できる。'
        who: 'al_haytham_cairo'
        bio: 'フスタトの火災の間、読者と彼らに託されたページは安全に到着した。'
  li_bai_changan:
    name: '川辺に届いた知らせ'
    place: '長江の巫山'
    figure: '李白'
    story: '李白は宜蘭への流刑を宣告され、途中で赦免された。彼の著作集の中の 1 つの記述では、恩赦と呉山が関連付けられています。彼がその話を聞いた正確な日は不明である。'
    story_prose:
      opening:
        - '759 年頃、呉山近くに上陸。李白は亡命先の宜朗に向けて川を遡っています。彼の旅の記述は、後にこの川一帯と彼の恩赦を結びつけることになる。'
        - '歴史上、恩赦は彼がイェランに到着する前に行われた。彼が話を聞いた日は特定されていない。この支店では、上流の次の船がまだ荷物を積み込んでいる間に、旅行者がニュースの書面コピーを持ってきました。'
        - 'この旅行には、ボートとその停留所を知っている人が必要です。ニュースを李白の手に渡す前に、誰かがオリジナルを誰が見たのか、どこでコピーされたのかを突き止めなければならない。'
      points:
        p1: '{staff} は、コピーを渡したメッセンジャーに尋ねた後、その人の手を知っている乗客を見つけ、アカウントが同意するのを待ってから、そのページを持って急いで踊り場に向かいました。李白はそれを広げ、最後の行を二度読みます。乗組員が乗客を呼ぶと、彼は上流の船にすでに積まれていた寝具を巻き上げ、対岸の船頭さんに手渡します。'
      outcomes:
        all: '下流のボートが船着き場を通り過ぎると、李白は再びコピーを折ります。彼の袖はまだ濡れています。彼は乾いた側で折り目を覆います。'
        p1: '下流のボートが船着き場を通り過ぎると、李白は再びコピーを折ります。彼の袖はまだ濡れています。彼は乾いた側で折り目を覆います。'
      none: '誰かが停泊地にニュースを届ける頃には、上流のボートはかなり離れてしまっている。係留柱の横にはわら縄が残っている。'
      not_admitted: '{staff} は決してボートまでは到達しません。日よけは、人々がその中に詰め込む音が聞こえるほど近くにあります。'
      excerpts:
        p1: '李白はそれを広げ、最後の行を二度読みます。乗組員が乗客を呼ぶと、彼は上流の船にすでに積まれていた寝具を巻き上げ、対岸の船頭さんに手渡します。'
    relic: '濡れずに残った手紙の包み'
    relic_desc: '川を渡る客が、手紙を濡らさずに持ち運ぶための架空の包み紙。'
    points:
      p1: '李白の船が上流に向かう前に、李白への恩赦の確定情報を得る'
    points_fail:
      p1: '従業員はボートが出発する前にその知らせを伝えることができなかった。'
    shift:
      p1:
        was: '759年頃：李白は耶朗へ向かう途中で赦免された。彼の著作集のあとがきには、当時彼が呉山の近くにいたことが記されています。'
        now: '{staff} は次の出発前に着陸にニュースをもたらします。李白はその朝の船で下流に引き返す。'
        who: 'li_bai_changan'
        bio: '李白は次の船が出発する前に恩赦の知らせを聞き、すぐに引き返すことができた。'
  li_shizhen_qizhou:
    name: 'まだ目を通せるうちに届く校正刷り'
    place: '蘄州'
    figure: '李時珍'
    story: '李時珍は長年にわたってマテリアメディカ大要を改訂しました。金陵版は彼の死後に出版されました。このブランチでは、印刷業者は 1 つの試用ページを彼に送信できます。'
    story_prose:
      opening:
        - '斉州、1592 年頃。李時珍は何年もかけて『マテリアメディカ大要』を改訂しました。彼が開いても自分自身を変えることができる本は、彼の原稿です。'
        - '歴史上、完全な金陵版は彼の死後に登場しました。このブランチでは、プリンタが試用ページを作成しました。金陵から桔州まで到達できるかどうかはまだ決まっていない。'
        - '印刷や校正に詳しい人がここで助けてくれます。それぞれの端は、誰がシートを読み、誰がマークを付けた後にシートを持ち帰るのかを知る必要があります。'
      points:
        p1: '{staff} は、印刷業者と 1 枚だけシートを送ることに同意し、2 つの場所を往復する旅行者にシートを託し、復路で回収するよう手配します。李時珍は校正刷りと原稿を並べて広げ、希望する線の横に爪を立てます。彼は余白に文字を書き、乾燥するのを待ってから 2 枚のシートを別々に折ります。'
      outcomes:
        all: '旅行者は翌日戻ってきます。リーは、修正した文字の上に指を置いたまま、乾いたシートを手渡します。'
        p1: '旅行者は翌日戻ってきます。リーは、修正した文字の上に指を置いたまま、乾いたシートを手渡します。'
      none: '証拠は来ない。リーは原稿の文字を変更し、インクを紙の端から遠ざけます。'
      not_admitted: '{staff} は、その証拠を持ち運べる人物に出会うことがありません。紙の束が店のドアを通過し、それぞれに異なる住所がマークされています。'
      excerpts:
        p1: '李時珍は校正刷りと原稿を並べて広げ、希望する線の横に爪を立てます。彼は余白に文字を書き、乾燥するのを待ってから 2 枚のシートを別々に折ります。'
    relic: '一枚の校正刷り'
    relic_desc: '著者が余白に書き込める、架空の校正刷り。'
    points:
      p1: '李時珍 が確認できる間に、プリンターに 1 つの試用ページを Qizhou に送信してもらいます'
    points_fail:
      p1: '従業員は証拠が時間内に届くよう手配しなかった。'
    shift:
      p1:
        was: '1596年までに：李時珍の死後、金陵版が出版されました。彼は生きてこの本が印刷されるのを見ることができませんでした。'
        now: '{staff}はお試しページを1ページ確保します。李時珍はテーブルでそれを読み、欄外に修正を加えて送り返します。'
        who: 'li_shizhen_qizhou'
        bio: '李時珍さんは、完全版が出版される前に、自分の本の印刷された校正刷り 1 枚を見て印を付けました。'
  bose_calcutta:
    name: '換金しなかった小切手'
    place: 'カルカッタ'
    figure: 'ジャガディッシュ・チャンドラ・ボース'
    story: '1885 年、ボーズはプレジデンシー カレッジで物理学を教え始めました。彼の給料はヨーロッパの同僚に与えられた給料よりも低かった。彼は紛争中も教職を続け、給料の引き下げを拒否した。'
    story_prose:
      opening:
        - 'カルカッタ、1885年。ボーズはプレジデンシー大学で物理学を教えている。大学が彼に提供するものは、同じ仕事をしているヨーロッパ人の同僚よりも少ない。彼は教え続けています。'
        - '歴史上、紛争が解決されるまでに約3年かかりました。この分岐ではまだ最初の金額が回収されておらず、事務所が別の小切手を発行するまでにはまだ時間があります。'
        - '給与条件を読める人がここで役に立ちます。また、署名の責任者に 2 つの教育課題を比較する方法を聞くことができる人も必要です。'
      points:
        p1: '{staff} は 1 週間分の授業と両方の給与条件を 1 ページにまとめて、帳簿が作成されるまでボーズと一緒にオフィスで待ちます。新しい用語が書き込まれると、ボーズはその番号を指でたどります。小切手が再び机の上に届きます。今度は両手で持っていきます。'
      outcomes:
        all: 'ボーズが教室に戻っても、デモはまだ始まっていません。彼は小切手をポケットに入れ、まず生徒たちのためにスペースを空けました。'
        p1: 'ボーズが教室に戻っても、デモはまだ始まっていません。彼は小切手をポケットに入れ、まず生徒たちのためにスペースを空けました。'
      none: '事務局より元の金額を再送させていただきます。ボーズはそれを見て、紙をカウンターの向こう側に押し戻しました。'
      not_admitted: '{staff} は、条件が署名された部屋には決して入りません。ホールの反対側で授業が終わり、足元で板が軋む音を立てる。'
      excerpts:
        p1: '小切手が再び机の上に届きます。今度は両手で持っていきます。'
    relic: '給与の領収書'
    relic_desc: '彼がこの分岐で受け取ることに同意した最初の小切手の想像上の領収書。'
    points:
      p1: 'ボーズが教職に就いて1年目の間に、書面による同一賃金のオファーを受け取る'
    points_fail:
      p1: 'その従業員は最初の1年間は同等の条件を確保できず、ボーズは賃金の引き下げを拒否し続けた。'
    shift:
      p1:
        was: '1885年: ボーズはプレジデンシー・カレッジで教鞭をとり始めた。彼は賃金の引き下げを拒否し、紛争の解決には約3年を要した。'
        now: '{staff} は同僚と同じ条件で書面による内定を獲得します。ボーズはそれを読み、その条件に基づいて発行された最初の小切手を受け入れます。'
        who: 'bose_calcutta'
        bio: 'ボーズはプレジデンシー大学の 1 年目に同等の条件を受け取りました。'
  li_qingzhao_hangzhou:
    name: 'この箱を近所の人に預ける'
    place: '会稽'
    figure: '李清照'
    story: '李青照さんは、会稽に滞在していたとき、すでに本や写真が繰り返し紛失していた、と書いている。彼女はそこで盗難に遭い、18巻の巻物が回収されたことを説明した。'
    story_prose:
      opening:
        - '李青照さんは会稽に下宿するまでに、すでに本や写真を何度も紛失していた。 『金属と石の記録』のあとがきを書いているときも、彼女は旅のこの部分で失われたものの多くを説明できた。'
        - '歴史上、会稽での盗難により、彼女はさらに多くのコレクションを失った。彼女は18巻の巻物を回収した。このブランチでは、チェストはまだ部屋にあります。一人はベッドの近くに立っていて、立ち上がらずにベッドに手が届くほどです。'
        - '本や写真の管理方法を知っている人が助けてくれます。隣人が躊躇した場合、チェストをどこに置くか、返してほしいときにどのドアをノックすべきかについて同意するのには忍耐が必要です。'
      points:
        p1: '李青照はベッドの横にある宝箱を開け、巻物を2冊取り出し、1冊を返します。 {staff} は、隣人にチェストとその錠前を見てもらい、それぞれに同じ集計表にマークを付けてもらいます。作業を行う前に、李清照は短いブラシを蓋の下の隙間に差し込みます。隣の人が下から重みを受けます。彼女はもう一方の端を取り、一緒に敷居を越えます。'
      outcomes:
        all: '彼女は胸を取り戻すと、まずブラシを探します。まだ蓋のそばにあります。彼女は紙の隅でストロークを試みます。インクは彼女が覚えているよりもゆっくりと広がります。'
        p1: '彼女は胸を取り戻すと、まずブラシを探します。まだ蓋のそばにあります。彼女は紙の隅でストロークを試みます。インクは彼女が覚えているよりもゆっくりと広がります。'
      none: '盗難の後、彼女は回収できた巻物を並べます。彼女は数え終わると、テーブルの裸の部分に手を置きます。'
      not_admitted: '{staff} は 李清照 に会うことはありません。ドアの向こうからタンスが閉まる音が聞こえる。'
      excerpts:
        p1: '作業を行う前に、李清照は短いブラシを蓋の下の隙間に差し込みます。隣の人が下から重みを受けます。彼女はもう一方の端を取り、一緒に敷居を越えます。'
    relic: '箱の中身を書き留めた札'
    relic_desc: '別の場所に預けると決めた一箱の中身を書き留めた、架空の札。'
    points:
      p1: '李青照さんが盗難に遭う前に選んだチェスト 1 つを、信頼できる隣人に引き取ってもらうよう手配する'
    points_fail:
      p1: '従業員はチェストを担当できる人を見つけられませんでした。'
    shift:
      p1:
        was: '1131年頃：李青照は会稽の下宿で盗難に遭ったことを思い出した。その後、彼女は18巻の巻物を回収した。'
        now: '{staff} は、自分が選んだチェスト 1 つを別の世帯に保管するよう手配します。 李清照 は、内容をそのままにして後でそれを回収します。'
        who: 'li_qingzhao_hangzhou'
        bio: '李青照さんは、近所の人に預けていた本や写真の入った箱を回収した。'
  ibn_al_nafis_cairo:
    name: '別の読者に渡す一巻'
    place: 'カイロ'
    figure: 'イブン・アン＝ナフィース'
    story: 'イブン・アル＝ナフィスは晩年に蔵書を病院に残した。彼が計画していた医学百科事典は未完成で、残っている部分は散逸している。この分岐では、2 人目の読者が、完了した巻のうちの 1 巻を担当することを申し出ます。'
    story_prose:
      opening:
        - 'カイロ、1288年。晩年、イブン・アル＝ナフィスは蔵書を病院に残した。彼が計画していた大規模な医学百科事典は未完成のままであり、今日でも一部しか読むことができません。'
        - '歴史上、伝記は彼が図書館をどこから出たかを記録しており、その後すべての巻を追跡することはありません。このブランチには、よく読んでいる読者が、読み続けている巻を読み終えたいと思っています。'
        - '本の貸し出しと返却の仕組みを理解している人が助けてくれるでしょう。この契約では、後の読者が実際に見つけられるアドレスを提供する必要があります。'
      points:
        p1: '読者は当初、月末までの融資を希望していました。 {staff} は、最初にその巻をどこに保管するか、そして誰が別の読者のためにドアを開けるかについて同意するよう 2 人に求めます。イブン・アル＝ナフィスは表紙を裏返し、まだチェックしていないことを指摘する。読者は、署名した名前の半分を親指で半分覆いながら、伝票を本の上に置きます。インクが乾いてから初めて動かします。'
      outcomes:
        all: '後で誰かが伝票の住所にその冊子を探しに来ます。ドアのところにいる人は本を下ろし、それが入っている最初の葉に紙を渡します。'
        p1: '後で誰かが伝票の住所にその冊子を探しに来ます。ドアのところにいる人は本を下ろし、それが入っている最初の葉に紙を渡します。'
      none: 'ボリュームを利用可能な状態に維持できるアドレスを残す人は誰もいません。伝票は空白のままです。その本はまだ同じ山の中にあります。'
      not_admitted: '{staff} は決して中には入りません。窓際にいる人は、外の音も聞こえずにページをめくる。'
      excerpts:
        p1: '読者は、署名した名前の半分を親指で半分覆いながら、伝票を本の上に置きます。インクが乾いてから初めて動かします。'
    relic: '名前を書いた貸出票'
    relic_desc: '責任を負った読者の名前を記した想像上の伝票。'
    points:
      p1: 'イブン・アル＝ナフィスに対し、完成した一巻をアクセス可能な状態にしておくことに同意する2人目の読者に託すよう依頼する'
    points_fail:
      p1: '従業員は、この分量に責任を持って引き受けてくれる 2 人目の読者を見つけられませんでした。'
    shift:
      p1:
        was: '1288年: イブン・アル＝ナフィスが亡くなり、図書館を病院に預けた。彼の大規模な医学百科事典の一部だけが今日残っています。'
        now: '{staff} は、完成した 1 冊の管理者を手配し、参照できる受信者の記録を保持します。図書館の残りの部分は彼の当初の計画に従っています。'
        who: 'ibn_al_nafis_cairo'
        bio: '彼の未完成の百科事典の一巻は、2 番目の管理者を通じて支部内でアクセス可能なままでした。'
  sappho_lesbos:
    name: '船が出る前に'
    place: 'レスボス島ミュティレネ'
    figure: 'サッポー'
    story: '『パリアン・マーブル』には、サッポーが亡命先としてミティリーニを出てシチリア島に向けて出発したことが記録されている。破損した日付があるため、正確な年は不明です。この支店では、彼女が会いたいと思っていた一人の人が、船がいつ出発するのか聞いていません。'
    story_prose:
      opening:
        - 'ミティリーニの海岸。サッポーがシチリア島に航海してから数世紀後、パロス島の石に航海の記録が残されました。その石に刻まれた年は現在損傷しています。'
        - '歴史上、サッポーはミティレーニを残してシチリアへ亡命した。理由は不明です。この支店には行く前に会いたい人がいて、船頭さんはすでに荷物を船に渡している。'
        - '船着き場と近隣の通りを知っている人が助けてくれます。船が出航する時刻をまだ聞いていない人を見つけることは、船頭に急ぐよう促す以上の効果があります。'
      points:
        p1: '{staff} は荷物の行き先を尋ね、サッポーの荷物を船頭に預け、彼女が説明したドアを探します。彼らが戻ってくる頃には、ボートに荷を積んでいた人々は海岸沿いの海岸を一掃し終えている。訪問者はサッポーの手首で解けた結び目を結び直す。サッポーは船頭が呼ぶまで手をそのままにしておく。'
      outcomes:
        all: 'ボートが遠ざかると、サッポーは紐を持って手を上げた。訪問者は、乗客が上陸するときに踏む石の上に滞在します。'
        p1: 'ボートが遠ざかると、サッポーは紐を持って手を上げた。訪問者は、乗客が上陸するときに踏む石の上に滞在します。'
      none: 'ボートが先に出発します。訪問者が船着き場を見つける頃には、石の上には濡れたロープが少しだけ残っています。'
      not_admitted: '{staff} は海岸に到着しましたが、サッポーを知っている人は誰もいませんでした。誰かが最後のステップでしゃがみ、ロープをまっすぐに伸ばします。'
      excerpts:
        p1: '訪問者はサッポーの手首で解けた結び目を結び直す。サッポーは船頭が呼ぶまで手をそのままにしておく。'
    relic: '結び目のあるコード'
    relic_desc: '船着き場で彼女と一緒に待っている人が身に着けている想像上の紐。'
    points:
      p1: 'サッポーがシチリアへ出発する前に、会いたい人を1人着陸地点まで連れて行く'
    points_fail:
      p1: '従業員がサッポーが面会を求めていた人物を連れてくる前に船は出航した。'
    shift:
      p1:
        was: '紀元前 7 世紀から 6 世紀の変わり目頃: パリアンの大理石には、サッポーが亡命先のミティレーネからシチリア島へ航海したことが記録されています。'
        now: '{staff} はサッポーが頼んだ人物を船着き場に連れて行きます。二人はサッポーが乗り込む前に一緒に時間を過ごす。'
        who: 'sappho_lesbos'
        bio: 'サッポーはミティリーニをシチリア島に向けて出発する前に、直接別れを告げる時間があった。'
  hipparchus_rhodes:
    name: '詩を確かめる一夜'
    place: 'ロドス島'
    figure: 'ヒッパルコス'
    story: 'ヒッパルコスの現存する注釈は、空について広く読まれている詩の誤りを指摘しています。この分岐では、読者がその詩を使って、どの星が一緒に昇るのかを他の人に伝えようとしています。'
    story_prose:
      opening:
        - '紀元前2世紀後半のロードス島。人々はどの星が一緒に昇るのかを思い出すために詩を使います。現存する解説書の中で、ヒッパルコスはこうした主張を一つ一つチェックしている。'
        - '歴史の中で、見慣れたセリフが目に見えるものと一致しない箇所を解説が示します。このブランチでは、読者がこれらの行の 1 つをすでに教えており、それをもう一度同じ方法で教えることを意味します。'
        - 'この本の主張に従うことができる人は役に立ちます。また、すでにレッスンを行っている読者に外でもう少し待つよう説得できる人も必要です。'
      points:
        p1: '{staff} は、読者に教えようとしているセリフを言うように頼み、彼とヒッパルコスと一緒に地平線の低いところに見えるところへ行きます。最初の星が現れると、読者は二人ともそこにいると言い始めます。彼は途中で立ち止まります。他の場所はまだ暗いです。彼は指をそれを指し続け、2番目の星が現れたときにのみ手を下げます。'
      outcomes:
        all: '次回教えるとき、彼はまず本を閉じ、生徒たちに初起きを待つように言います。彼は、別の光が現れるまで、おなじみのセリフの後半を離れます。'
        p1: '次回教えるとき、彼はまず本を閉じ、生徒たちに初起きを待つように言います。彼は、別の光が現れるまで、おなじみのセリフの後半を離れます。'
      none: '読者は以前と同じように古いセリフを朗読します。二つ目の星が外の低いところに見えてきた時には、すでに扉は閉まっていた。'
      not_admitted: '{staff} はリーダーを認識しません。閉ざされたドア越しに誰かがセリフを二度暗唱する。'
      excerpts:
        p1: '他の場所はまだ暗いです。彼は指をそれを指し続け、2番目の星が現れたときにのみ手を下げます。'
    relic: '地平線上の二つのマーク'
    relic_desc: '二つの星が昇る位置を別々に記す、架空の観測用の細い札。'
    points:
      p1: '論争のある蜂起について教える前に、ヒッパルコスと一晩観察するよう読者を説得する'
    points_fail:
      p1: '従業員はその夜、読者に空と照らし合わせて詩を確認するよう説得しなかった。'
    shift:
      p1:
        was: '紀元前 2 世紀後半: ヒッパルコスの注釈は、よく知られた詩の中で一緒に描写されているいくつかの星は一緒に昇っていないことを指摘しました。'
        now: '{staff} は、読者を一晩の観察に連れ戻します。読者は二人の立ち上がりを別々に観察し、自分の生徒に与える指導を変える。'
        who: 'hipparchus_rhodes'
        bio: 'ある読者がこの古い詩を使って、論争のある詩を試し、修正された説明を伝えました。'
  eratosthenes_alexandria:
    name: '地球を測った本'
    place: 'アレクサンドリア'
    figure: 'エラトステネス'
    story: 'キレネのエラトステネスは、紀元前 3 世紀にアレクサンドリアの図書館司書になりました。彼自身の地球の測定に関する本が紛失してしまいました。クレオメデスの後の記述では、真夏の太陽がシエネの頭上にありますが、アレクサンドリアには影を残しています。その差は円の 50 分の 1 です。 2 つの場所の間に 5,000 スタジアムがあるので、地球全体では 250,000 スタジアムになります。'
    story_prose:
      opening:
        - 'アレクサンドリア、紀元前3世紀。キレネのエラトステネスがアレクサンドリア図書館の館長に就任した。彼には「ベータ」というあだ名が付いていますが、これは、あらゆる学習分野で一位に一歩及ばないことを意味します。'
        - '歴史上、後のクレオメデスの記述によると、真夏の日の正午、シエネのノーモンは影を落としませんでしたが、アレクサンドリアでは太陽が天頂から 50 分の 1 の位置にありました。 2 つの都市は 5,000 スタディア離れていたので、円全体は 250,000 人になりました。エラトステネスが自身の方法を記した本『地球の測定について』は紛失しており、クレオメデス自身も、元の方法は彼の説明よりも複雑なものだったと述べている。この分館では、文字が読めない図書館のポーターがすべてのタグを知っており、写本係はニックネームをすぐに覚えます。'
        - 'この旅行では 2 種類の人が協力してくれるでしょう。本のコピー、チェック、保管の仕方を知っている人、もう 1 つは好奇心旺盛で勉強家で、数字のページをじっくりと読み進めることができる人です。'
      outcomes:
        all: '後の読者は彼が手書きで書いた手順に従い、真夏の日の正午に再びノーモンを設定しました。ロール紙はその横に開いて置かれ、その端は小石で押さえられていた。'
        p1: '後の読者は彼が手書きで書いた手順に従い、真夏の日の正午に再びノーモンを設定しました。ロール紙はその横に開いて置かれ、その端は小石で押さえられていた。'
      none: 'この本にはまだ古い部数が数冊しか残っておらず、一冊ずつ古くなっていきました。真夏の日の正午、アレクサンドリアのノーモンはまだ短い影を落としています。'
      not_admitted: '{staff} は図書館のドアを通過できませんでした。真夏の日の正午、街のノーモンはまだ短い影を落としています。'
      points:
        p1:
          class_lettered: '{staff} は書記官の規則に従い、『地球の測定について』を何部かコピーし、それぞれのコピーで影の長さ、角度、距離を原本と照らし合わせて 1 行ずつ確認し、数字が間違っていないことを確認しました。1冊は図書館の棚に置かれ、ポーターならわかるような小さな木のタグが付けられていた。もう一冊は油布で包み、別の街へ向かう船に載せました。エラトステネスは棚の前に立ち、指一本でタグをまっすぐに伸ばした。'
          else: '{staff} はまず、本の最初からすべてのステップが明確になるまでこの方法を実行し、その後、『地球の測定について』のコピーを数部作成し、オリジナルと比較して数値を 1 行ずつ確認しました。1冊は図書館の棚に置かれ、ポーターならわかるような小さな木のタグが付けられていた。もう一冊は油布で包み、別の街へ向かう船に載せました。エラトステネスは棚の前に立ち、指一本でタグをまっすぐに伸ばした。'
      excerpts:
        p1: '1冊は図書館の棚に置かれ、ポーターならわかるような小さな木のタグが付けられていた。もう一冊は油布で包み、別の街へ向かう船に載せました。エラトステネスは棚の前に立ち、指一本でタグをまっすぐに伸ばした。'
    relic: '日時計の棒'
    relic_desc: 'シンプルな直立した棒の影が太陽の角度を教えてくれました。'
    points:
      p1: '彼自身の方法に関する説明が失われないように、彼が『地球の測定について』を図書館やその他の場所にコピーできるように手伝ってください。'
    points_fail:
      p1: 'その本はすでに持っていたコピーのままでした。この分野ではやはりそれは失われており、後の読者はクレオメデスの簡略化された再話からのみ彼の手法を知りました。'
    shift:
