      p2: '手紙は発送されましたが、証言用紙がテーブルの上に残されました。パケットが同期しなくなると、オフィスは {staff} をリコールします。'
    shift:
      p1:
        was: '1677 年 5 月 18 日、2 人の証人が自分たちが見た小動物についての声明に署名しました。他の6人もその後数か月間で証言を追加した。'
      p2:
        was: 'レーウェンフック氏は、10月5日付のデルフトからの書簡に証人の陳述を同封した。 11月にフックはロンドンの王立協会に小動物を見せた。'
    vignettes:
      motion: '特派員は何かが動いたと書いている。レンズが見えない人にはその動きがどのように見えたかを尋ねます。比較を取り消し線を引いて、最初の位置の横に 2 番目の位置を描画します。'
      label: 'テーブルには木とワインの絵が描かれています。特派員が散らかったシートをかき集める前に一時的なラベルを追加すると、写真が正しい順序で表示されます。'
