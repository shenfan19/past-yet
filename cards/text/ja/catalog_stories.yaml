        p2:
          class_lettered: '翻訳者が行うように、{staff} はカハールと一緒に図面を 1 つずつ調べ、それぞれの下にドイツ語でキャプションを付け、書き留める前に各点で各繊維を何と呼ぶべきかを尋ねました。短い論文が清書されると、まずスライドと照らし合わせてチェックしてくれる数人の同僚に渡されました。ベルリンでは、すでに誰かが数ページを手に顕微鏡の前で彼を待っていました。'
          else: '{staff} は市内でドイツ語がわかる翻訳者を見つけ、自分の仕事は脇に置くよう説得し、カハルと座って図面を 1 枚ずつ調べて、それぞれの下にドイツ語のキャプションを付けました。短い論文が清書されると、まずスライドと照らし合わせてチェックしてくれる数人の同僚に渡されました。ベルリンでは、すでに誰かが数ページを手に顕微鏡の前で彼を待っていました。'
      excerpts:
