      envelope: 'エミールは、もしまた待たされたら、二つ折りにしたメモをクララに持っていくと約束しました。彼は {staff} に、最初にどのドアを試すかを尋ねます。彼らは車線の側に渡り、そこで彼は両方を見ることができます。'
      gift: '本物の原稿は最終的にシューマンの娘マリーの手に渡ります。ここゲストハウスに、リナは練習用のコピーの開始を示す 2 枚の紙片を残します。 {staff} が蓋を開けると、1 つのスリップがもう 1 つのスリップの後ろに滑り落ちました。'
  nietzsche_turin:
    name: '裏に書かれた宛先'
    place: 'トリノ'
    figure: 'フリードリヒ・ニーチェ'
    story: 'トリノからの手紙はフランツとアイダ・オーヴァーベックに宛てられている。ニーチェはそれにディオニュソスと署名しました。フランツが友人の下宿に到着すると、友人がニーチェ・コントラ・ワーグナーの校正刷りを読んでいるのを発見する。彼らがトリノを離れるまでに、誰かが証拠を使ってこの事件をどうするかを決めなければならないだろう。'
    story_prose:
      opening:
        - 'トリノ、1889 年 1 月。署名と宛先が別々の場所に書かれた手紙が、フランツとアイダのオーヴァーベックに宛てられました。フランツがトリノに到着すると、ニーチェはニーチェ・コントラ・ワーグナーの最後の校正刷りを読んでいる。'
        - '歴史上、オーヴァーベックは 1 月 8 日に友人を見つけ、その後、読んでいたものを書き留めました。この支店では、ピエトロが階段のそばに荷物ラベルを残しており、ルチアはまだ包むべき手紙の束を持っています。'
        - 'この旅行には、住所を確認して訪問者を正しいドアに案内できる忍耐強い人が必要です。また、証拠や個人的な手紙をリスト化して保管する方法を知っている人も必要です。'
      points:
        p1: '1月8日、{staff}は住所とドア番号を照合し、階段でオーバーベックを待ち、残りの道まで連れて行った。フランツは右のドアで立ち止まり、一度ノックした。ページが中をめくると、ハンドルがゆっくりと半回転動きました。'
        p2: '{staff} は校正刷りと手紙を別々にリストし、一方のラベルには本のタイトルを、もう一方のラベルには受取人のみを記載しました。各パケットには独自の文字列がありました。ルシアさんは受取人の名前が書かれたラベルを内側に向け、親指で角を押した。'
      outcomes:
        all: '1月8日、オーヴァーベックはニーチェを発見した。その後、2 つのパケットは一緒に移動しました。彼はタイトルの付いた方を開け、もう一方は結び目を蓋の方に向けたまま戻しました。'
        p2: '書類は 2 つのパケットに分けて次のペアに届きました。オーヴァーベック氏はタイトルを認識すると、もう一方のパケットをケースの底に戻しました。'
        p1: '1月8日、オーヴァーベックは友人の部屋に入った。彼の後ろでドアが閉まると、ページをめくる柔らかなカサカサ音が聞こえた。'
      none: '書類は 1 つの束に包まれ、手紙と校正刷りの両方に名前が記載されていました。ラッパーは紐を引っ張り、どちら側に結べばよいか迷った。'
      not_admitted: '{staff} は宿泊施設に紹介してくれる人がいませんでした。空白の荷物ラベルがまだ手すりに置かれていました。'
      desync: '反対側のドアでは誰も応答しませんでした。代理店が{staff}をリコールしたとき、オーバーベックはまだ着陸中だった。'
      excerpts:
        p2: '各パケットには独自の文字列がありました。ルシアさんは受取人の名前が書かれたラベルを内側に向け、親指で角を押した。'
        p1: 'フランツは右のドアで立ち止まり、一度ノックした。ページが中をめくると、ハンドルがゆっくりと半回転動きました。'
    relic: '荷札の控え'
    relic_desc: 'ゲームの分岐で使われる架空の荷札の控え。裏には宛名が書いてある。'
    points:
      p1: '宿泊施設の住所を確認し、1 月 8 日にオーヴァーベックを正しいドアに連れて行ってください。'
      p2: '修正された校正刷りを個人的な手紙とは別に記録し、それぞれの束をもう一方の束を開けずに渡すことができるようにします。'
    points_fail:
      p1: 'オーヴァーベック氏は間違った宿泊施設に案内され、会議がタイムラインから抜け落ちたためにオフィスはその従業員を呼び戻した。'
      p2: '手紙と証拠は同じ包装紙に入ります。最初に修正箇所を探している人には、手紙に書かれた名前も表示されます。'
    shift:
      p1:
        was: 'ニーチェはトリノからオーヴァーベックス夫妻に手紙を書いた。フランツ・オーヴァーベックは彼を見つけるために1889年1月8日にそこに到着した。'
      p2:
        was: 'オーヴァーベックは後に、ニーチェが到着したとき、ニーチェ・コントラ・ワーグナーの最後の校正刷りを読んでいたと回想した。'
        now: '校正刷りと手紙は別々の包装紙で送られます。オーバーベックは、他のシールを破ることなく、一目で修正箇所を見つけることができます。'
    vignettes:
      address: 'ピエトロはディオニュソスをインベントリの宛先行にコピーしました。 {staff} は伝票をめくって受取人の名前を見せます。彼は自分が書いたものに、今でも読み返せるほど軽く線を一本引いています。'
      privacy: 'ルシアは、書類を包む間、{staff} にバッグを持ってもらうように頼みます。階段にいる誰かが、誰ですかと尋ねます。彼女は答える前にラベルを壁に向けます。'
      stairs: '{staff} は踊り場からページをカサカサと読む音が聞こえます。その後、誰かが下をノックし、ピエトロは空白の荷物ラベルを階段の手すりに置き、再び見つけられるようにしました。'
  sophie_germain_paris:
    name: 'ベルリンへ送る論文'
    place: 'パリ'
    figure: 'ソフィー・ジェルマン'
    story: 'ソフィー・ジェルマンはカール・フリードリッヒ・ガウスと数論に関する研究を交換し、最初はル・ブランへの手紙に署名しました。 1816 年、科学アカデミーは振動板に関する彼女の研究に対して賞を授与しました。彼女は 1829 年に病気になった後も仕事を続けました。ベルリンにあるクレレの日記の第 7 巻には、彼女自身の名前で表面の曲率に関する彼女の回想録が掲載されていました。彼女は 1831 年 6 月 27 日にパリで亡くなりました。'
    story_prose:
      opening:
        - '1831 年パリ。若い頃、ソフィー・ジェルマンはル・ブランという名前でガウスと数論について議論しました。彼女は振動プレートの研究で賞を受賞しました。病気になった後も彼女は表面の曲率に関する論文に取り組み続け、最終的にベルリンのクレレの日記に掲載されました。'
        - '歴史上、彼女は6月にパリで亡くなった。一部の伝記作家は、ガウスが彼女をゲッティンゲン大学の名誉学位に推薦したと記録している。彼女は生涯にそのような学位を取得していませんでした。この支店では、水を運ぶ人が今でもサヴォワ通りの階段を登っており、2階の机の上には手紙を置くスペースがあります。'
        - 'この旅行には、途中で数学的な原稿をチェックしてそれを見ることができる人が必要です。患者の痛みを和らげたり、海外の学者からのニュースを伝えたりできる人の仕事もあります。'
      points:
        p1: '{staff} は表記をページごとに確認し、葉を並べて紙をベルリン行きの配達員の手に渡しました。ジェルマンは指先一本でトップシートを押さえた。 {staff} が手を引っ込めると、包装紙の縁がページ上部の最後の文字のすぐ上に来ました。'
        p2: '{staff} さんは、痛みを和らげるためのケアの経験を活用し、自分で机に移動できるようになるまで滞在しました。彼女は未完成のページに手を伸ばし、引き寄せました。光が机に届く頃には、彼女の手はペンを触っていた。'
        p3: '{staff} はガウスの推薦の言葉を持ってきて、手紙の文言に従ってゆっくりと読み聞かせました。ジェルマンはそのページを手に取り、最初から通して読んだ。彼女がそれを置いたとき、その二重の折り目がまだ細い角を支えていました。'
      outcomes:
        all: 'その後、ベルリンの雑誌に彼女の論文が掲載されました。パリのデスクでは、痛みが和らいでいる間、彼女は仕事に手を伸ばすことができ、ガウスが自分の名前を名乗り出たことを生きて読んだ。手紙は山の片隅を押さえ、端が丸まっていた。'
        p3: '学位取得はまだ遅すぎた。このニュースは最初にパリに届き、その手紙は今でも机の上で折り目に沿って少し浮き上がった状態で見つかった。'
        p2: '痛みが和らぐと、再び机に座れるようになった瞬間もありました。彼女が置き忘れたまま、数枚のシートが机の中央に開いた状態で置かれていました。'
        p1: 'この論文はベルリンで第 7 巻に掲載されました。その先頭にはソフィー・ジェルマンという名前が印刷されていました。'
      none: '上の階のランプが早く消えてしまいました。バケツはまだ階段の壁にぶつかったままで、椅子はすでに机の下に押し戻されていました。'
      not_admitted: '{staff} はサヴォワ通りの 2 階の部屋に入りませんでした。誰かがバケツを持って通り過ぎ、木の取っ手を手のひらで回した。'
      desync: '開封された原稿が机の上に広げられていた。 {staff} がリコールされたとき、空の包装紙はまだ開いたまま、上向きにバタバタしていました。'
      excerpts:
        p3: 'ジェルマンはそのページを手に取り、最初から通して読んだ。彼女がそれを置いたとき、その二重の折り目がまだ細い角を支えていました。'
        p2: '彼女は未完成のページに手を伸ばし、引き寄せました。光が机に届く頃には、彼女の手はペンを触っていた。'
        p1: 'ジェルマンは指先一本でトップシートを押さえた。 {staff} が手を引っ込めると、包装紙の縁がページ上部の最後の文字のすぐ上に来ました。'
    relic: 'ル・ブランの署名入りの手紙'
    relic_desc: '借名でガウスに宛てた手紙。'
    points:
      p1: '彼女が病気の間、表面の曲率に関する回想録をベルリンのクレレの日記に送る途中で保管する'
      p2: 'パリでの最後の数か月間、がんの痛みを和らげた'
      p3: '死ぬ前にジャーマンに、ガウスがゲッティンゲンに名誉学位の授与を依頼したことを知らせてください。'
    points_fail:
      p1: 'この回想録は未完成のまま彼女の机の上にあり、1831 年の本はそれなしで出版されます。この支店は歴史にそぐわないものであり、事務所はその従業員を召還した。'
      p2: '誰も痛みを和らげてくれません、そして、この支店での彼女の最後の数ヶ月は、かつてと同じくらい辛いものでした。'
      p3: '何も言葉は届かず、彼女はガウスが自分のために何をしてくれたのか分からないまま亡くなった。'
    shift:
      p1:
