  abel_froland:
    name: '例と主張'
    place: 'フロランド'
    figure: 'ニールス・ヘンリック・アーベル'
    story: '1828年のクリスマス、ニールス・ヘンリック・アーベルは婚約者を見舞いに寒くて咳き込みながらそりでフロラントの製鉄所にやって来たが、そこで12週間病気で横たわった。 1829年1月6日、彼は最後の論文を書き、パリのアカデミーに提出した長い回想録の主な成果を2、3ページにわたって再掲した。彼は4月6日に結核のため26歳で亡くなった。 2日後、それとは知らず、アウグスト・レオポルド・クレルはベルリンから自分のポストが確保されたと手紙を書いた。'
    story_prose:
      opening:
        - '1829年1月、ノルウェー南部、フロラント製鉄所。ニールス・ヘンリック・アーベルは、婚約者が家庭教師をしている家で病気で横たわっており、激しく咳き込んでいる。彼は二十六歳です。数年前、彼は 5 次の一般方程式がラジカルでは解けないことを証明しましたが、1826 年に彼がパリのアカデミーに贈った長い回想録はそれ以来聞かれませんでした。'
        - '歴史上、クリスマスにそりで来た時にはすでに寒くて体調が悪く、ここで12週間ベッドに横たわっていました。 1月6日、彼は2、3ページにわたる最後の論文を執筆した。彼は4月6日に結核のため亡くなった。 2日後、クレレさんはベルリンから自分のポストが確保されたとの手紙を書いた。この支店では、階下の厨房のメイドが夜通し咳き込みを聞き、鉄工所の事務員が毎日のようにポストの仕分けをしている。'
        - 'この旅行では 3 種類の人が協力できます。導出を確認し、書類や摂取記録を整理できる人、看護の知識があり病床を見守ることができる人、友人を遠くに移動させて返信を迫ることができる人です。'
      outcomes:
        all: '4月にベルリンから投稿を確認する手紙が書かれたとき、アベルはすでにいなくなっていた。 3月の返事は枕の下にあり、部屋のストーブはまだ消えていなかった。'
        p4: '4月にベルリンがこの投稿を確認する手紙を書いたとき、アベルはすでにこの世を去っていた。 3月の返事はまだ枕の下にあった。'
        p3: 'フローランドのその部屋のストーブは4月になっても燃え続けていた。'
        p2: '何年も経った後、誰かが長い回想録を探しにパリに行き、その短い紙の下部にある小さな行を見つけ、その年の入学記録から始めました。'
        p1: '２～３ページの紙が送られてきました。封筒の宛名は彼自身の手によるものでした。'
      none: 'フロラントの冬は長かった。窓の外の雪は溶けず、二階の男性は夜な夜な咳き込んでいた。'
      desync: '1月6日、ショートペーパーはチェックされる前に停止され、{staff}はリコールされた。上の階では咳が続いた。ページはベッドカバーの上に広げて置かれ、インクはまだ乾いていませんでした。'
      not_admitted: '{staff} はその家のドアを通り抜けることができませんでした。上の階の男性はまだ咳き込んでおり、ベルリンからのニュースはまだ途中だった。'
      points:
        p1: '1月6日、アベルは枕にもたれて座り、ベッドカバーの上に2、3ページ広げて短い論文を書いていた。 {staff}さんは、導出を一行一行ペンでたどり、表記が一致しない箇所を逐一マークし、一つ一つ修正していきました。夕方までにその紙は清書され、ベッドカバーにはインクの跡がいくつか残っていました。彼は3ページを四角くして手のひらで平らに押し、それから手渡しました。'
        p2: 'その短い論文はまだ手元にあった。 {staff} はパリ回想録が提出された日付の横にそれを置き、各コピーの下部に小さな行を 1 行書きました。それは、提出された年、誰に、どのようなタイトルで提出されたかです。インクは薄く、余白に押し込まれており、夕暮れまで乾きませんでした。 2 部のうち 1 部は短い論文と一緒に送られ、もう 1 部は原稿フォルダーに保管されました。'
        p3: '1月末の最も寒い夜、アベルは咳き込みすぎて眠れませんでした。 {staff} はストーブに食事を与え、ベッドを温め、枕を高くし、汗を拭き、水を与え続けました。ある夜、窓がフロストフラワーで覆われ、部屋のストーブが消えることはありませんでした。夜明け近く、咳き込んだ後、再び眠りに落ちた。'
        p4:
          class_lettered: '{staff} は文通をするのと同じように、ベルリンで彼のために働いている人々とそれぞれが何をしているのかを 1 人ずつリストアップし、順番に各自に手紙を書き、何も解決するのを待たずに自分たちの進捗状況をフロラントに送るよう求めた。 3月になって返事が来た。アベルはその手紙をベッドに持ってきて二度読んでもらいました。このポストは解決したとは述べておらず、まだ努力中であるとだけ述べた。彼は手紙を折りたたんで枕の下に置きました。'
          else: '{staff} さんはベルリンに次から次へと手紙を書き、自分の体調がどれほど悪いかを伝え、彼のために働いている友人たちに、何も解決するのを待たずに進捗状況を送ってほしいと頼んだ。 3月になって返事が来た。アベルはその手紙をベッドに持ってきて二度読んでもらいました。このポストは解決したとは述べておらず、まだ努力中であるとだけ述べた。彼は手紙を折りたたんで枕の下に置きました。'
      excerpts:
        p4: 'このポストは解決したとは述べておらず、まだ努力中であるとだけ述べた。彼は手紙を折りたたんで枕の下に置きました。'
        p3: 'ある夜、窓がフロストフラワーで覆われ、部屋のストーブが消えることはありませんでした。夜明け近く、咳き込んだ後、再び眠りに落ちた。'
        p2: 'インクは薄く、余白に押し込まれており、夕暮れまで乾きませんでした。 2 部のうち 1 部は短い論文と一緒に送られ、もう 1 部は原稿フォルダーに保管されました。'
        p1: '夕方までにその紙は清書され、ベッドカバーにはインクの跡がいくつか残っていました。彼は3ページを四角くして手のひらで平らに押し、それから手渡しました。'
    relic: '封書'
    relic_desc: '糸で結ばれた未開封のオファー。'
    points:
      p1: 'アベルが病気の間に最後の短い校正刷りをチェックして、論文を送ることができるよう手伝ってください。'
      p2: '短い論文が手元にある間に、パリの投稿記録に関連付けて、検索している人が参照できるようにします。'
      p3: '12週間の間、アベルはフローランドのベッドに横たわり、部屋に寒さが入らないようにし、咳と痛みを和らげた'
      p4: 'アベルのポストを探している友人たちに、自分たちがまだ努力していることを死ぬ前に知らせるために暫定的な手紙を送るよう頼んでください。'
    points_fail:
      p1: '論文はチェックされる前に停止し、パリ回想録の中心的な成果はこの初期の公的記録を失うことになる。同期が途絶えたため、オフィスはその従業員を呼び戻した。'
      p2: 'パリ回想録を探している人々は、依然としてタイトルだけの古い摂取記録を調べなければなりません。'
      p3: '風邪や咳を和らげてくれる者は誰もおらず、この支店においても、フロランドでの最後の数週間は、以前と同じくらい大変だった。'
      p4: 'フロランドには何の連絡も間に合わない。正式な確認は遅すぎる。'
    shift:
      p1:
        was: '1829 年 1 月 6 日、アベルはフロラントで最後の数学論文を書き、パリでの回想録の主な結果を再説明しました。'
      p2:
        was: '1829年頃、アベルはパリ回想録の中心的な成果を改めて述べた。この原稿は見つけるのが難しく、1841 年まで印刷されることはありませんでした。'
        now: '{staff} は、新しい論文を以前の提出日にリンクし、各コピーに参照を残し、その後の検索を絞り込みます。'
      p3:
        was: '1828年のクリスマス、アベルは寒くて咳き込み、血を吐き始めたにもかかわらず、そりでフロランドへ旅行した。彼はそこで12週間ベッドに横たわっていました。'
        now: '{staff} はストーブを動かし、ベッドを暖かく保ち、最悪の夜を乗り越えてくれます。アベルは最後の数週間で苦しみが少し和らぎました。'
      p4:
        was: 'アベルは 1829 年 4 月 6 日に亡くなりました。ベルリンへの赴任を確認する手紙はその 2 日後に書かれました。'
        now: '{staff} は、連絡先に、すでに進行中の取り組みについて報告するよう求めます。アベルは、友人たちがまだ自分のポストを見つけようと取り組んでいることを読みました。'
        who: 'abel_froland'
        bio: 'アベルは亡くなる前に、ベルリンの友人たちが彼に研究を続ける機会を与え続けようとしていた様子を聞いた。正式な確認は彼の死後にも行われた。'
    vignettes:
      firewood: '2 月の最も寒い日に、{staff} は厨房のメイドが薪を 2 階に運ぶのを手伝います。上の階の紳士が一晩中咳き込んでいると、彼女は階下で横になって数を数えていたが、朝になると数えられなくなってしまった、と彼女は言う。'
      sledge: '1 月、{staff} は新郎が新しいシャフトをそりに取り付けるのを手伝います。クリスマスに彼は紳士を街から連れ出したと新郎は言い、毛布3枚にくるまって道中ずっと咳き込んでいた。到着すると、男は自分のトランクを持ち上げることができず、新郎はトランクを持ち上げてコインを拒否しました。'
      post: '4月、{staff}は鉄工所の事務員が郵便物の入った袋を仕分けるのを手伝います。彼はベルリンのマークが付いた手紙を取り出し、それをしばらく窓にかざして、この手紙は悪い時期に来た、なぜならその手紙の宛先の人はもうここにはいないからだと言いました。'
  riemann_selasca:
    name: '最後の論文'
    place: 'セラスカ'
    figure: 'ベルンハルト・リーマン'
    story: 'ベルンハルト・リーマンは1862年に病に倒れ、結核を患いながら何度もイタリアを旅行した。 1866年6月、彼は3度目にマッジョーレ湖のセラスカを訪れた。 7月19日、イチジクの木の下で休憩しながら、彼はまだ書き終えていない最後の論文に取り組んでいた。彼は翌日そこで39歳で亡くなった。 10年後、編集者にリチャード・デデキントを加えた彼の作品集が出版された。'
    story_prose:
      opening:
        - '1866年6月、イタリア北部のマッジョーレ湖。39歳の数学者ベルンハルト・リーマンは、健康のために3度目に南に来て、湖畔のセラスカに部屋を取った。湾曲した空間の幾何学と素数の分布に関する彼の研究は主要な分野を切り開きましたが、現在までに彼は結核を患って 4 年近くになります。'
        - '歴史上、7月19日、彼はイチジクの木の下で休みながら、まだ書き終えていない最後の論文に取り組んでいた。翌日、彼はそこで亡くなりました。 10年後、ハインリヒ・ウェーバーとリヒャルト・デデキントが編集した彼の作品集が出版された。この支店では、家主に小さな娘がいて、毎日木の下に落ちたイチジクを片付けてもらっている。湖の船頭は妻に漕ぎ方を教えなければならなかった。'
        - 'この旅行では、数種類の人々が協力してくれるでしょう。大学で講義をしたり、モデルを作成したり、校正刷りを読んだりしたことのある人、または、自分が指示する公式についていくために学び、忍耐強く取り組んでいる人です。医学を知っていて、ナノ医療キットを持ち歩き、時代ができなかった病気を治す人。'
      outcomes:
        all: 'その秋、リーマンはゲッティンゲンに戻り、再び教えました。彼が持ち帰った書類のうち、最後の書類は数ページ長く、イチジクの木の下で口述筆記されていた。'
        p2: 'その秋、リーマンは北のゲッティンゲンに戻りました。出発の朝、彼はイチジクの木の下にある椅子にしばらく座ってから、メモのページを折りたたんでコートのポケットに入れました。'
        p1: '最後の論文はさらに数ページにわたって彼自身の言葉で述べられています。 10年後に全集が出版されたとき、そのページも一緒に印刷されました。'
      none: '7月20日、リーマンはセラスカで死去した。イチジクの木の下の椅子は空っぽで、椅子の上にイチジクが二個落ちていましたが、誰も拾いませんでした。'
      not_admitted: '{staff} は一度も家に入ることはなく、パランツァの船着場で数隻のボートを降ろすのを手伝っただけでした。水の向こう側、セラスカ側に大きなイチジクの木が立っていて、その下に椅子がありました。'
      points:
        p1:
          class_learned: '7月13日の午後、リーマンはイチジクの木の下で椅子に座り、紙を膝の上に広げ、数行ごとに咳を止めた。大学で講義をしたことのある{staff}は、彼の隣にスツールを引き上げ、言いながら一文一文を書き留め、数式の指標は一つも間違っていない。そして、完成したページを石の下に整然と保管している。夕方近くになると風が強くなり、リーマンはトップページを取り出して、長い間目に近づけた。彼はそれを元に戻し、再びその上に石を置きます。'
          class_lettered: '7月13日の午後、リーマンはイチジクの木の下で椅子に座り、紙を膝の上に広げ、数行ごとに咳を止めた。校正刷りを読んだ{staff}は、彼の横にスツールを引き上げ、彼が言いながら各文を書き留め、読み終わったすべてのページを一度彼に読み戻し、石の下にページを整理します。夕方近くになると風が強くなり、リーマンはトップページを取り出して、長い間目に近づけた。彼はそれを元に戻し、再びその上に石を置きます。'
          else: '7月13日の午後、リーマンはイチジクの木の下で椅子に座り、紙を膝の上に広げ、数行ごとに咳を止めた。 {staff}は、本をよく読むし、忍耐強いので、彼の横に椅子を立てて、彼が言うたびに一文ずつ書き留め、彼が咳をするたびにペンを置いて待ち、石の下でページを整理し続けます。夕方近くになると風が強くなり、リーマンはトップページを取り出して、長い間目に近づけた。彼はそれを元に戻し、再びその上に石を置きます。'
        p2: '7月17日の夜、リーマンさんは咳き込みすぎて座っていられず、家主の小さな娘がランプを持って戸口に立っていて、入ってくるのを恐れていた。医学に詳しい{staff}さんは、持参したナノ医療キットを開け、説明書に書かれているとおりに使い、ベッドのそばにいて、時折額に手を当てている。夜明けまでに彼は眠っており、呼吸は少し長くなります。3日後の朝、彼は一人でイチジクの木まで歩き出し、しばらく椅子に座りました。彼はかがんで足元に落ちたイチジクを拾い上げ、書類の横に置きました。'
      excerpts:
        p2: '3日後の朝、彼は一人でイチジクの木まで歩き出し、しばらく椅子に座りました。彼はかがんで足元に落ちたイチジクを拾い上げ、書類の横に置きました。'
        p1: '夕方近くになると風が強くなり、リーマンはトップページを取り出して、長い間目に近づけた。彼はそれを元に戻し、再びその上に石を置きます。'
    relic: 'メモのページ'
    relic_desc: '小さな手には未完成の数式が記されたページ。'
    points:
