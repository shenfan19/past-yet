  vermeer_delft:
    name: '借金を抱えた画家'
    place: 'デルフト'
    figure: 'ヨハネス・フェルメール'
    story: '1672 年の戦争の後、ヨハネス フェルメールは絵をほとんど売ることができず、1675 年 7 月にアムステルダムに行き、1,000 ギルダーを借りました。 1675 年 12 月、彼の未亡人は後に、彼は健康な状態から 1 日半以内に死亡したと書いている。彼は12月15日に43歳でデルフトに埋葬され、11人の子供が残された。 1676 年の初め、カタリーナ ボルンズはパンの借金の対価としてパン屋に自分の絵画 2 枚を渡し、2 月 24 日に母親のマリア シンズに『絵画芸術』を譲りました。 2月29日に家の目録が作成され、4月に彼女は高等裁判所に借金の免除を求めた。'
    story_prose:
      opening:
        - 'デルフトのオーデ・ランゲンダイク、1675 年 12 月初旬。43 歳の画家ヨハネス・フェルメールは、妻のカタリーナ・ボルネスと 11 人の子供たちとともにここに住んでいます。彼は柔らかな光の中で静かな部屋を描きましたが、彼の絵画のうち現存するのはわずか 40 点ほどです。 1672 年の戦争以来、美術貿易は崩壊しました。彼自身の作品はほとんど売れず、取引するために購入した他の巨匠の絵画が彼の手元に残されました。 7月に彼は1000ギルダーを借りるためにアムステルダムに行きました。'
        - '歴史上、カタリーナは後に、子供たちの重みと借金のせいで、健康な状態から1日半以内に死に至り、12月15日に埋葬されたと書いている。翌年初め、彼女はパン屋に3年分のパンと引き換えに彼の絵画2枚を渡し、2月24日には『絵画芸術』を彼のアトリエから母親のマリア・シンズに引き渡し、4月には高等法院に借金の免除を求めた。その後2世紀近くの間、彼の名前はほとんど忘れ去られていました。この分岐では、パン屋の少年が無償でパンを渡し、小さな本に印を付けるだけで、額縁職人がいて、女性が市場広場で泥炭を売っています。'
        - 'この旅行では、いくつかの種類の人が協力してくれるでしょう。アーカイブを保管している人、骨董品や修復された絵画を扱っている人、絵を描いたり、校正刷りを読んだり、翻訳したりして注意深い目を持っている人、またはスタジオにある大きな絵を守るために強い意志を持って注意深くまたは几帳面な人。商売をして多少の幸運に恵まれた人、あるいは路上で手元に残った絵画を売るためにしゃべりながら家にいる人。絵を知っている人、繊細な人、親切な人が、自分の絵がどうなるかを彼に教えてください。強い意志を持った医師、医学に精通していてカームパッチを持っている人、またはナノ医療キットを持っている人が、12月中旬のその日を1日半延期します。'
      outcomes:
        all: 'その冬、フェルメールは倒れませんでした。 1月の晴れた日、彼は再び絵を描くために階段を登った。大きな絵はまだスタジオの壁に掛けられており、布に包まれた小さなお金の束が食器棚に置かれていました。'
        p4: 'その12月が過ぎても、フェルメールは没落しませんでした。 1月の晴れた日に、彼は再び階段を登り、イーゼルを窓際に移動しました。'
        p2: '12月15日、フェルメールは43歳でデルフトに埋葬された。その月に売れた絵画の代金は、カタリーナさんは布に包んで食器棚に保管していた。'
        p3: '12月15日、フェルメールは43歳でデルフトに埋葬された。スタジオのイーゼルは空のままで、パレットは脇に置かれ、その上の新鮮な青は乾いていました。'
        p1: '12月15日、フェルメールは11人の子供を残して43歳でデルフトに埋葬された。翌年の2月、カタリーナさんは大きな絵をアトリエから母親に渡しました。'
      none: '12月15日、フェルメールは43歳でデルフトの義母が何年も前に購入した墓に埋葬された。その後2世紀近くの間、彼の名前を知る人はほとんどいませんでした。'
      desync: '12月3日、債権者の男はリストを確認してうなずき、壁のそばにあった大きな絵の釘を外させた。 {staff} がリコールされたとき、2 人の男性がそれを階下に運び、階段の曲がり角でその青が一度点滅しました。'
      not_admitted: '{staff} はアウデ ランゲンダイクの家には一度も入ったことがなく、朝数時間マーケット広場の端に立っていただけでした。その家の雨戸はいつも半分閉まっており、子供が敷居に寄りかかってパンかごが通り過ぎるのを数えていました。'
      points:
        p1:
          trait_vigil: '12月3日の朝、債権者から派遣された男がリストを持ってスタジオにやって来て、年内にいくつかの絵を借金返済に充てる必要があると言い、壁際の大きな絵を指さした。画家がこちらに背を向けて、本とラッパを持った青い服を着た女性を描いている。 {staff} は用心深く、スタジオの外の階段を走りながら二晩眠り、日中は男のリストを一行ずつ調べていく。借金に対抗できるのは店にある他の巨匠の絵画の在庫であり、この絵はその中にはない。男はリストを丸めて立ち去った。フェルメールは絵の前でしばらく立っていたが、手を伸ばして額縁の底についた埃の膜を拭き取った。'
          trait_methodical: '12月3日の朝、債権者から派遣された男がリストを持ってスタジオにやって来て、年内にいくつかの絵を借金返済に充てる必要があると言い、壁際の大きな絵を指さした。画家がこちらに背を向けて、本とラッパを持った青い服を着た女性を描いている。 {staff}は几帳面で、男のリストを一行ずつ調べ、スタジオにあるそれぞれの絵がどこから来たのかをページに書き出す。借金に逆らえるのは店にある他の巨匠の絵の在庫で、この絵はそこには載っていない。男はリストを丸めて立ち去った。フェルメールは絵の前でしばらく立っていたが、手を伸ばして額縁の底についた埃の膜を拭き取った。'
          else: '12月3日の朝、債権者から派遣された男がリストを持ってスタジオにやって来て、年内にいくつかの絵を借金返済に充てる必要があると言い、壁際の大きな絵を指さした。画家がこちらに背を向けて、本とラッパを持った青い服を着た女性を描いている。絵画や行為に慣れている{staff}は、男のリストを一行ずつ調べて、借金に抵触する可能性があるのは店にある他の巨匠の絵画の在庫であり、この絵はその中にはないことを示した。男はリストを丸めて立ち去った。フェルメールは絵の前でしばらく立っていたが、手を伸ばして額縁の底についた埃の膜を拭き取った。'
        p2:
          class_trade: '12月6日は市場の日です。他の巨匠によるいくつかの絵画は、布に包まれて店のドアの後ろに何年も放置されています。取引を行った{staff}は、それらを1つずつ窓の明かりの中に運び、朝から正午まで見に来た2人のディーラーと話し、価格について少し説明し、それ以上は何も言いませんでした。午後、麻ひもで縛られた3枚の絵画が男性たちの肩に担いでドアから運び出される。カタリーナは台所のテーブルでお金を二度数え、小さな山を脇に置き、布に包んでエプロンのポケットに入れました。'
          else: '12月6日は市場の日です。他の巨匠によるいくつかの絵画は、布に包まれて店のドアの後ろに何年も放置されています。 {staff} は口下手で、市場を回って 2 人のディーラーを連れて戻ってきて、絵画を 1 枚ずつ窓の光の中に運び、朝から昼まで彼らと話します。午後、麻ひもで縛られた3枚の絵画が男性たちの肩に担いでドアから運び出される。カタリーナは台所のテーブルでお金を二度数え、小さな山を脇に置き、布に包んでエプロンのポケットに入れました。'
        p3:
          trait_artistic: '12月9日の午後、スタジオはとても静かだった。フェルメールはイーゼルに座り、長い間、手に持った筆がキャンバスに触れませんでした。絵画にも目がない{staff}は、しばらく彼の後ろに立って、いつか人々がこれらの静かな部屋を一つずつ探し出し、再び知り、多くの都市に飾られるようになるだろうと語った。フェルメールは振り向かない。彼はパレットを手に取り、その上に乾いた青い色をナイフで少しこすり落とし、曲げて新鮮な色を混ぜます。'
          trait_sensitive: '12月9日の午後、スタジオはとても静かだった。フェルメールはイーゼルに座り、長い間、手に持った筆がキャンバスに触れませんでした。 {staff}は敏感で、彼がどれほど疲れているかを見て、しばらく彼の後ろに立って、いつか人々がこれらの静かな部屋を一つずつ探し求め、再びそれらを知り、多くの都市にそれらを吊るすだろうと彼に言いました。フェルメールは振り向かない。彼はパレットを手に取り、その上に乾いた青い色をナイフで少しこすり落とし、曲げて新鮮な色を混ぜます。'
          trait_kind: '12月9日の午後、スタジオはとても静かだった。フェルメールはイーゼルに座り、長い間、手に持った筆がキャンバスに触れませんでした。親切な {staff} はしばらく彼の後ろに立って、いつか人々がこれらの静かな部屋を 1 つずつ探し求め、再びそれらを知り、多くの都市にそれらを吊るすことになるだろうと彼に言いました。フェルメールは振り向かない。彼はパレットを手に取り、その上に乾いた青い色をナイフで少しこすり落とし、曲げて新鮮な色を混ぜます。'
          else: '12月9日の午後、スタジオはとても静かだった。フェルメールはイーゼルに座り、長い間、手に持った筆がキャンバスに触れませんでした。絵画に詳しい{staff}はしばらく彼の後ろに立って、いつか人々がこれらの静かな部屋を一つずつ探し、再びそれらを知り、多くの都市に飾られるだろうと彼に言いました。フェルメールは振り向かない。彼はパレットを手に取り、その上に乾いた青い色をナイフで少しこすり落とし、曲げて新鮮な色を混ぜます。'
        p4:
          class_medical: '12月12日の午後、フェルメールはスタジオから降りてきて、階段の途中で立ち止まり、壁に手をつき、突然顔が青くなった。 {staff} は薬の知識があり、彼の寝かしつけを手伝ったり、傍に座って脈拍を測ったり、夜中に 2 回起こして酒を飲んだり、翌日ずっと見張りをしたりしています。一日半が経ちます。 3日目の朝、フェルメールが一人で階段を上り、アトリエの雨戸を開けると、光が差し込んでイーゼル前のむき出しの床に落ちました。'
          else: '12月12日の午後、フェルメールはスタジオから降りてきて、階段の途中で立ち止まり、壁に手をつき、突然顔が青くなった。 {staff} は、ナノ医療キットを携行して、彼の寝かしつけをし、指示に従ってそれを使用し、彼のそばに座って、夜中に 2 回起こして水を飲み、翌日ずっと見張りをします。一日半が経ちます。 3日目の朝、フェルメールが一人で階段を上り、アトリエの雨戸を開けると、光が差し込んでイーゼル前のむき出しの床に落ちました。'
