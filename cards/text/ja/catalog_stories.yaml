      p2: '9月に手紙が印刷されたら、編集者にその横に原稿索引を印刷させ、残っているページを順番に読んでくれる数学者を見つけてください。'
      p3: '5月30日の朝の決闘の後、すぐにガロアを医者に連れて行き、腹部の傷を救ってください。'
