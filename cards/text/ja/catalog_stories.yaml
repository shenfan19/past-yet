          else: '9月末に、ホワイトのオフィスから別の入札があり、建物とタワーが1つの柱にまとめられました。鋭い目をした{staff}は、その1つの列に2種類の仕事が混在しているのを見て、すでに同意した研究室の仕事をアイテムごとに独自のページに取り出し、まだ新しい入札を待っているタワーアイテムを2番目のページにリストし、ホワイトに見てもらうために両方を送り返します。答えが来ると、職長はその 2 ページを小屋の 2 つの壁にピンで貼り付けます。彼はそれらの間に立って様子を見て、研究室のページの下に線を引きます。'
        p3:
          class_lettered: '11 月初旬、レンガ造りの建物の壁は日に日に盛り上がっていますが、塔の基礎はまだ掘られた砂地です。テスラはニューヨークから出てきて、物置にある帳簿の2ページをめくります。事務処理に慣れている{staff}は、確定した費用を月ごとに表に記載し、それによって支援者に段階的に支払うよう依頼し、次の基礎工事については別途合意する。テスラはペンで表の2つの数字を変更し、それを折りたたんでモーガン宛ての封筒に滑り込ませます。彼が小屋から出ようとすると、音の風が彼の帽子のつばをめくり上げます。'
