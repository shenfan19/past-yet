      beta: '{staff} は、図書館の写字生たちが図書館員のベータを陰で「二番目」と呼ぶのを聞きました。 {staff} は、後何世紀にもわたって彼の記憶に残るのは、彼が測定した地球一周であることを知っており、真顔のままです。'
