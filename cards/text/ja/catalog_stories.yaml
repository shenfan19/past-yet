        now: '{staff} は、1862 年以来彼を疲弊させてきた病気の治療法をもたらしました。その秋、彼は北に戻り、ゲッティンゲンで再び教えました。'
        who: 'riemann_selasca'
        bio: 'この路線では、リーマンは 1866 年の夏に結核から回復しました。彼はゲッティンゲンに戻り、長年にわたってこの路線に取り組みました。'
    vignettes:
      figs: '7月18日の夕方、{staff}は家主の小さな娘が木の下から落ちたイチジクを取り除くのを手伝います。そこの椅子はドイツ人紳士のためのもので、椅子を逃すと彼の書類が紫色になってしまうと彼女は説明した。'
      boat: '7 月初旬、{staff} はパランツァで船頭がレモンの積荷を降ろすのを手伝います。今年の夏は湖に浮かぶボートの数が半分になった、と船頭さんは言う。若者たちは全員召集され、彼は妻に漕ぎ方を教えなければならなかった。'
      chair: '8月、{staff}は家主がイチジクの木の下から椅子を運ぶのを手伝います。彼は袖で何度もそれを拭き、その木が今年ほど多くのイチジクを実らせたことはなく、その下に座っている人は誰もいなかったと言いました。'
      harvest: '8 月、{staff} は、家主がイントラの市場用にイチジクを平らなバスケットに入れるのを手伝います。今年ほど木にたくさんの実がなったのは初めてだ、と彼は言い、太陽の光で割れた実を家の窓辺に置いた。'
  du_chatelet_luneville:
    name: 'フランス語で読むニュートン'
    place: 'リュネヴィル'
    figure: 'エミリー・デュ・シャトレ'
    story: '1749年の夏、エミリー・デュ・シャトレはリュネヴィルのスタニスラスの宮廷で子供を待ちながら、ニュートンの『プリンキピア』のフランス語訳とその解説を仕上げていた。 9月4日に娘を出産した。 9月10日、彼女は42歳で亡くなった。原因を寝床熱とする人もいれば、肺塞栓症とする人もいます。同じ日、パリ王立図書館は彼女の解説の 3 袋の受領書に署名した。全訳は 1759 年に出版されました。'
    relic: 'インク壺'
    relic_desc: '机の上の小さなインク壺は一晩中働きました。'
    points:
      p1: 'リュネヴィルでは、王立図書館にリクエストとともに送る前に、解説の 3 つのパケットのリストを作成します。'
      p2: '彼女に、最も難しい 2 つの文章に関するクレローの決定を任せてもらい、彼女の翻訳をどこに置くべきか、そしてその後の改訂をどこに個別にリストするべきかを特定してもらいます。'
      p3: '生まれてから数日間見守り、治療し、生かしてください。'
    points_fail:
      p1: '解説が入ったパケットは残ります。図書館は手紙のみを受け取り、事務局はその職員を召還する。'
      p2: '2 つの草稿が編集者に届きますが、改訂された文章をどのように印刷するかについての決定は編集者に届きません。'
      p3: '娘が生まれてから6日後の9月10日、彼女はリュネヴィルで亡くなった。'
    shift:
      p1:
        was: '1749 年 9 月 10 日、王立図書館はデュ シャトレのニュートンに関する注釈 3 袋の領収書を発行しました。'
      p2:
        was: 'デュ・シャトレの死後 1759 年に、クレローがその作成に協力して完全なフランス語版が出版されました。'
        now: '編集者は 2 つの決定を承認し、その後の変更については別のページで説明します。読者は彼女の解説と編集上の追加を区別することができます。'
      p3:
        was: '1749年9月4日の夜、デュ・シャトレは娘を出産し、9月10日にリュネヴィルで亡くなった。原因を寝床熱とする人もいれば、肺塞栓症とする人もいます。'
        now: '彼女は出産後の日々を乗り越え、秋には回復しました。彼女はニュートンを自分で翻訳して印刷したのを見て、長年研究を続けました。'
        who: 'du_chatelet_luneville'
        bio: 'デュ・シャトレは 1749 年の誕生を生き延び、フレンチ ニュートンとその解説書を自ら印刷所に持ち込み、その後何年も執筆と研究を続けました。'
    vignettes:
      stairs: '9 月 4 日早朝、{staff} は、洗濯係の女の子がきれいな布の山を 2 階に運ぶのを手伝います。そこのランプは真夜中に点灯した、と彼女は言う。彼女は階段の足を数えました、そして夜が明けるまでに11回登っていました。'
      candles: '8月末、{staff}は店でろうそくの数を数える老使用人を手伝います。同氏によると、侯爵夫人は国王自身の書斎よりも多くのろうそくを燃やしており、今月は一週間早く口座に送金しなければならないという。'
      arbour: '10月、{staff}は庭師が東屋のカーテンを外すのを手伝います。この秋の初めから法廷は静まり返っている、と彼は言う。ほとんどの年は、彼らはまだここで演劇を行っていたでしょう。'
    story_prose:
      opening:
        - 'リュネヴィル、1749 年。デュ シャトレは出産間近ですが、ニュートンの『プリンキピア』の翻訳原稿がまだ机の上にあります。彼女はラテン語の著作をフランス語に翻訳し、彼女自身の解説でその派生を説明しました。後でニュートンを開いたフランスの読者は、彼女がどのようにそれを解決したかをニュートンと一緒に読むことになるでしょう。'
        - '歴史上、彼女は娘が生まれてから6日後に亡くなった。その日、パリ王立図書館は解説集 3 袋の領収書を発行しました。原稿は保存され、10 年後に完全版が出版されました。彼女は印刷されたコピーを一冊も見たことがありませんでした。'
        - 'この旅行では 2 種類の人が手助けできます。1 つは原稿の知識があり、翻訳を手伝うことができます。もう 1 つは、看護の知識があり、適切な薬や器具を持ってきて、横たわっている部屋の外で見張りをしている人です。'
      outcomes:
        all: 'その秋、ニュートンは再びリュネヴィルの机の上に広げて置かれていた。校正刷りはページごとに届き、彼女はそれをページごとに読み、余白には彼女自身の手で書かれていました。'
        p3: 'その秋、彼女はデスクに戻ってきました。証拠が到着したとき、疑わしいページを誰かに送って尋ねる必要はありませんでした。それは彼女の肘に広げて置かれていました。'
        p2: '10年後、クレロー氏が原稿の包装を解くと、署名されたシートはまだ元の場所に挟まれていた。彼女が翻訳したとおりにどの行を印刷するかを、彼はそのシートごとに場所ごとに決めました。'
        p1: '王立図書館の領収書には彼女の名前と3つのパケットの数が記載されていました。それが発表された日は9月10日でした。'
      none: '9月にリュネヴィルでは机が空になった。隅にあるインク壺にはまだ蓋がされていなかった。'
      desync: '原稿を渡す時になっても、解説者はまだ家にいた。デポジットを引き継ぐことができなかったため、オフィスは最初に {staff} に電話をかけ直しました。帰るとき、3つのパケットはまだ机の下に縛られたままでした。'
      not_admitted: '{staff} はそのデスクまで到達できませんでした。窓からは書類が山積みになっているのが見え、ランプは遅くまで灯されていた。'
      points:
        p1: '発送前に、{staff} は 3 つのコメント パケットを 1 つずつ入力し、リストと再度照合しました。最後の包みの結び目をきつく締めたとき、机の上に残ったのはインクがすでに乾いた王立図書館への彼女の手紙だけだった。'
        p2: '2 つのドラフトは隣り合って、変更点は近くに詰め込まれていました。彼女はペンの先で紙に触れ、一度に 1 か所ずつ目を通していき、{staff} は別のシートに一度に 1 か所ずつ書き留めました。それが完了すると、彼女はシートを受け取り、最後まで読んで、右下隅に自分の名前に署名しました。'
        p3: '出産から数日後、彼女の状態は急激に悪化しました。 {staff}さんは持参した医療ケースを開け、ベッドで見張りをし、時計に合わせて体温を測り薬を与え、一晩中ランプを灯し続けた。娘の誕生から6日目が過ぎたが、デュ・シャトレはまだ生きていた。秋に印刷業者から校正刷りが送られてきました。彼女は解説が本文に押し込まれているページをめくり、紙を近づけ、ペンを手に取り、誤って印刷された行の下に線を引いた。'
      excerpts:
        p3: '秋に印刷業者から校正刷りが送られてきました。彼女は解説が本文に押し込まれているページをめくり、紙を近づけ、ペンを手に取り、誤って印刷された行の下に線を引いた。'
        p2: '彼女はペンの先で紙に触れ、一度に 1 か所ずつ目を通していき、{staff} は別のシートに一度に 1 か所ずつ書き留めました。それが完了すると、彼女はシートを受け取り、最後まで読んで、右下隅に自分の名前に署名しました。'
        p1: '発送前に、{staff} は 3 つのコメント パケットを 1 つずつ入力し、リストと再度照合しました。最後の包みの結び目をきつく締めたとき、机の上に残ったのはインクがすでに乾いた王立図書館への彼女の手紙だけだった。'
  noether_gottingen:
    name: '別の人の名で開く講義'
    place: 'ゲッティンゲン'
    figure: 'エミー・ネーター'
    story: '1915年にデヴィッド・ヒルベルトとフェリックス・クラインがエミー・ネーターをゲッティンゲンに連れて行ったが、大学は女性に講義の資格を与えず、1916年の冬から彼女のコースはヒルベルトの名前で発表されることになった。 1918 年 7 月 26 日、クラインは論文「不変変分問題」をゲッティンゲン科学協会に提出し、9 月末に最終版を提出しました。この論文は、行為の連続的な対称性を保存則に結び付けています。彼女は 1919 年 6 月に講義を許可され、1923 年になって初めて教職に対して少額の固定給が支払われました。'
    story_prose:
      opening:
        - 'ゲッティンゲン、1918年7月。3年前、デイヴィッド・ヒルベルトとフェリックス・クラインは、現在36歳の数学者エミー・ネーターをゲッティンゲンに連れてきたが、大学は女性に講義の資格を与えず、1916年の冬学期以来、彼女のコースはヒルベルトの名前で発表されてきた。この夏、彼女は行為の連続対称性を保存則に結びつける『不変変分問題』を書きました。'
        - '歴史上、7 月 26 日にクラインはゲッティンゲン科学協会に論文を提出し、彼女が最終版を提出したのは 9 月末でした。翌年、彼女は講義をすることを認められ、1923年になって初めて、彼女は教職に対して少額の固定給を初めて支払った。この分校では、数学棟には数学期分の時間割をピンで留めているポーターがいて、下宿している裏庭にはパンのクーポンを数えるのをやめた女将がいる。'
        - 'この旅行では、数種類の人々が協力してくれるでしょう。大学で講義をしたり、アーカイブを保存したり、校正刷りを読んだりしたことのある人、または署名された論文とその要約をまとめるための几帳面で勉強した人です。アーカイブを保存していたり、講義を行ったりして、セミナーに報酬を得るために部門内で話をすることができる人。'
      outcomes:
        all: '1919 年 6 月、試験講義の後、ネーターはゲッティンゲンでの講義を許可され、彼女の論文は彼女自身の名前で「不変変分問題」でした。それ以前から、彼女のセミナーにはすでにある程度の給料が支払われており、彼女と一緒に働く学生たちは毎週決まった時間に来ることが決まっていました。'
        p2: 'その冬、彼女のセミナーにはいくらかの給料が支払われ、彼女と一緒に働く学生たちは毎週決まった時間に来ることになった。 1919 年 6 月、模擬講義の後、彼女は講義を許可されました。'
        p1: '論文は時間通りに提出され、印刷されたコピーには彼女の名前が記されていました。 1919年6月、これは講義を受ける権利に関する彼女の論文となった。'
      none: '12月末になってもセミナーは無給で開催されていた。掲示板の線にはネーター博士の協力を得て依然としてヒルベルト教授と書かれており、画針の周囲には錆の輪が広がっていた。'
      desync: '7月26日の会議の前に、論文とその要約はまだ2つの山に散乱しており、著者のページは見つかりませんでした。 {staff} がリコールされたとき、署名のない最初のページがテーブルの上に置かれ、外では時計が鳴りました。'
      not_admitted: '{staff} は数学棟には一度も入ったことがなく、外の階段に立ったのは数回だけでした。時刻表はボードに固定されており、その一行にはネーター博士の協力を得てヒルベルト教授と書かれていました。'
      points:
        p1:
