    shift_all: '彼は自分の理論が有効であると確信し、病気も和らぎ、秋には教えるためにウィーンに戻りました。'
    vignettes:
      pebbles: '7 月、{staff} は漁師の幼い息子がビーチで小石の入ったバケツを数えるのを手伝います。少年は、数えられないほど小さなものは本当にそこにあるのかと尋ねます。 {staff} は、誰かが数えるかどうかに関係なく、彼らはそこにいると言っています。少年はそれについて考え、さらに一握りを投げ込みました。'
      nets: '7 月初旬、{staff} は、漁師が海岸で干している網を運び込むのを手伝います。スロベニア語、イタリア語、ドイツ語、と漁師は言います、この湾のあちこちでその声が聞こえますが、魚はあなたがどれを罵るかなんて気にしません。'
      towels: '8月、{staff}はホテルのメイドが海辺で乾かしているタオルを運ぶのを手伝います。彼女によると、今年の初めに水が暖かくなり、市内からのゲストはシーズン中ずっと滞在し、塩分で手の皮膚が剥がれてしまったという。'
  tesla_wardenclyffe:
    name: '「計画」と記された一行'
    place: 'ロングアイランド、ショアハム'
    figure: 'ニコラ・テスラ'
    story: '1901 年 3 月、J. ピアポント モーガンはニコラ テスラの無線局に 15 万ドルを投じることに同意しました。建築家スタンフォード・ホワイトはロングアイランドのウォーデンクリフの建物を設計し、その年、テスラは塔と研究所について何度か彼に手紙を書いた。 9月に建築が始まった。 12月、マルコーニは大西洋を越えて送信された信号を聞いた。テスラは 1902 年 6 月に研究室をレンガ造りの建物に移転しました。 1903年7月、モーガンはこれ以上資金を追加しないと書いた。塔は 1917 年に爆破されました。'
    story_prose:
      opening:
        - '1901年9月、ロングアイランド北岸のウォーデンクリフ。半年前、J・ピアポント・モーガンは発明家ニコラ・テスラのために無線局に15万ドルを投じることに同意し、建築家のスタンフォード・ホワイトはここに実験室とタワーを設計した。テスラとは、無線通信と電力の無線送信のための塔を意味します。'
        - '歴史上、その9月に建設業者の入札額は予想を上回ったが、テスラはホワイトに塔と実験室について何度も手紙を書き、図面は何度も変更された。 12月にマルコーニは大西洋を越えて送信された信号を聞いた。 1903年7月、モーガンはこれ以上資金を追加しないと手紙を書き、1917年に塔は爆破された。この支所では、現場監督がおり、監視員が崖の上の板小屋を管理し、カーターが砂の道を板を引き上げています。'
        - 'この旅行では、何種類かの人々が協力してくれるでしょう。アーカイブを保管している人や大工として働いている人、または器用で几帳面な人で、古い図面と改訂された図面を区別したり、建物と塔のそれぞれの価格を確認したりできます。そしてテスラが着実に資金を増やしていくのを手助けするために、人々に話しかけることができる人もいる。'
      outcomes:
        all: '1902 年 6 月、テスラは研究室をレンガ造りの建物に移転しました。それでも結局お金は足りなくなり、2ページの帳簿は納屋の壁に貼り付けられたままで、支払われた部分の下に線が引かれていた。'
        p3: '結局結局お金が足りなくなってしまいました。このサイトは、合意されていた一連の基礎工事を完済し、お金のないアイテムは独自のページにリストされ、小屋のドアの後ろにピンで留められました。'
        p2: '1902 年 6 月、テスラは研究室をレンガ造りの建物に移転しました。タワーの入札額はさらに数回変更され、それぞれの入札額をその前のページと照合することができました。'
        p1: '1902 年 6 月、テスラは自分の研究室をウォーデンクリフのレンガ造りの建物に移し、1906 年までそこで働きました。研究室と塔の敷地は今日も残っています。'
      none: '1903年7月、モーガンはこれ以上資金を前払いするつもりはないと書いた。この塔は 10 年以上崖の上に立っていたが、1917 年に爆破された。レンガ造りの建物はまだ残っています。'
      desync: '9 月 19 日、2 つの図面セットが 1 つの山に混在していましたが、建設業者は古い図面から作業の価格を設定しており、どちらのセットが続くかは誰も言えませんでした。 {staff} がリコールされたとき、職長は山全体を丸めて麻ひもで縛っていました。'
      not_admitted: '{staff} は現場には決して立ち入らず、崖までの砂の道の脇に数日間立っていただけでした。板を積んだ荷車が次々と通り過ぎ、車輪が砂に沈み、男たちが再び後ろから車輪を押し出した。'
      points:
        p1:
