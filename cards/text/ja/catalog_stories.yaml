  newton_cambridge:
    name: 'リンゴと月を結ぶ一つの法則'
    place: 'ケンブリッジ'
    figure: 'アイザック・ニュートン'
    story: 'ニュートンの『プリンキピア』は 1687 年にロンドンで出版されました。3 冊目の本では、彼は月と落下物体を同じ重力の説明の下に置きます。報道機関に渡された清書は彼の手元になかった。これはハンフリー・ニュートンによって書かれたもので、近年彼の管理者であり、関係はありません。ずっと後になって、ウィリアム・ステュークリーは、重力についての疑問を引き起こしたリンゴが落ちたというニュートンの回想を書き留めた。ステュークリー氏は頭部への打撃については何も語っていない。'
    story_prose:
      opening:
        - 'ケンブリッジのコピーテーブルはロンドン向けの新聞で覆われています。ハンフリー・ニュートンが人物の名前を書き留めたところ、アイザック・ニュートンが校正刷りでその人物の別の修正を見つけました。メッセンジャーがノックする。'
        - 'プリンキピアは 1687 年にロンドンに登場しました。エドモンド・ハレーはそれを報道機関を通じて目撃し、7 月 5 日に完成したと手紙を書きました。このブランチでは、最後の修正を確認し、Newton がそのページまで追跡できる修正を記録する場所を読者に提供できます。'
        - 'ページ番号と提案番号をパケットと照合できる旅行者を派遣します。出版後、通信の優れた主催者は、変更をどのように記録すべきかについて Newton と合意することができます。'
      points:
        p1: '2 つの伝票が同じ図を修正します。 1冊には書籍番号がありません。あなたとハンフリーは両方とも証拠の横に横たわって、ニュートンが保存したいバージョンを読み上げさせます。あなたが書類を本ごとに仕分けて手渡すと、メッセンジャーはその住所を繰り返します。メッセンジャーはパケットを受け取り、破棄されたヘッダーはテーブル上に残ります。'
        p2: '最初の読者の手紙には、ページに名前を付けずに番号をマークします。あなたはニュートンに印刷されたコピーを渡し、図の番号が読者にそれを識別するのに役立つかどうか尋ねます。提案を見つけると、彼はあなたに、手紙の日付を本に記入し、決定を入力するスペースを残すように頼みます。次の手紙が届いたとき、店員は同じ人物を見つけます。'
      outcomes:
        all: 'ハレーはその本が完成したと書いている。ケンブリッジでは、添削本の最初の列が記入されます。次にその本を借りる人は、添削を残す方法を確認できます。'
        p1: 'ハレーは最後のセットを受け取り、本は歴史的な形で現れます。その後の変更は依然として手紙やコピーに蓄積されます。'
        p2: '添削本は読者を命題からそのページへ導くことができます。ロンドン行きのパケットに問題が発生しましたが、今回の訪問では修正を記録する方法が維持されています。'
      none: 'テーブルの上に 2 枚の伝票が向かい合って置かれています。次に読む人は、どの伝票が最初に来たのかを知ることができずに、何が変更されたのかを 2 回確認できます。'
      not_admitted: '使者は写本師から小包を受け取らなければならないと言います。外から、同じようなシートが 2 枚めくられる音が聞こえます。'
      desync: 'ハレー氏は最終的な修正を一切受けません。出版物の同期が失われ、事務局は旅行者をリコールする。'
      excerpts:
        p1: 'あなたが書類を本ごとに仕分けて手渡すと、メッセンジャーはその住所を繰り返します。メッセンジャーはパケットを受け取り、破棄されたヘッダーはテーブル上に残ります。'
        p2: '提案を見つけると、彼はあなたに、手紙の日付を本に記入し、決定を入力するスペースを残すように頼みます。次の手紙が届いたとき、店員は同じ人物を見つけます。'
    relic: 'ガラスプリズム'
    relic_desc: '白色光を色に分割する三角形のガラス。'
    points:
      p1: 'ニュートンの最後の修正を巻とページごとにまとめて、ロンドンの印刷が終わる前にケンブリッジからハレーに届けます。'
      p2: '初版が到着したら、読者が修正を提出する方法についてニュートンと合意し、提案とページごとに検証できるようにする'
    points_fail:
      p1: '2 つのバージョンの修正がリリースされます。ハレー氏は最後の正誤表を組み立てることができず、事務所はその従業員をリコールした。'
      p2: '特派員は独自の参考文献を使用します。初期の修正は手紙とニュートンのコピーの間に散在したままです。'
    shift:
      p1:
        was: '1687 年 7 月 5 日、ハレーはプリンキピアが完成し、最後の正誤表が間に合うように到着したと書きました。'
      p2:
        was: 'ニュートンは自身の初版に注釈を付けました。改訂版の準備には何年もかかりました。'
        now: '大学は命題ごとに索引を付けた添削本を保管しています。読者は問題を記録し、ニュートンが後でどの変更をいつ承認したかを確認できます。'
        who: 'newton_cambridge'
        bio: 'ニュートンはケンブリッジで『プリンキピア』を書き、ハレーはロンドンでマスコミを通じてそれを目にした。ニュートンは印刷後も作品を修正し続けました。'
    vignettes:
      apple: '「リンゴが彼の頭に当たりましたか？」あなたは大学の使用人、つまりゲームのためにでっち上げられた男に尋ねます。彼は掃除を続けます。 「言えませんでした。月が落ちない理由を教えてください。」答えが用意されていない場合は、ページに戻ってください。そのリンゴはその後65年間、誰にも書き留められなかった。'
      hand: 'その清書は、その本に名前が載ることになる人物の手元にはない。使用人は、それを書いているのはハンフリー氏で、やはりニュートン人で無関係だと言う。あなたはそれを書き留めて、彼の邪魔をしないでください。'
      diagram: '傷んだ紙の上に、何もなければ月が進む道を描き、それからその道を曲げるための矢印を描きます。ラテン語が読めない使用人は、しばらく矢を見つめます。'
  bach_leipzig:
    name: '眼科医がやって来た春'
    place: 'ライプツィヒ'
    figure: 'ヨハン・セバスティアン・バッハ'
    story: '1750 年の春までに、バッハは視力のせいで読み書きがほとんどできなくなりました。巡回眼科専門医のジョン・テイラーがライプツィヒで彼の手術を行ったが、合併症のため二度目の手術となった。バッハは 1750 年 7 月 28 日に亡くなりました。'
    story_prose:
      opening:
        - 'ライプツィヒの譜面台は窓際に移動されました。バッハは、ヘルパーがシーツをひっくり返すのを聞き、その部分を読むことから始めるように頼みます。ジョン・テイラーが街にいます。家の中の誰かが、バッハがいつ会えるか言うのを待っている。'
        - '1750 年の春、テイラーはバッハの目を手術し、その後 2 回目の手術が行われました。バッハ氏は7月28日に亡くなった。この分岐により、彼は別の介護者の意見を聞き、読者が彼のスコアを手伝ってくれるかどうかを決定することができます。'
        - '介護経験のある人を派遣して悩みを聞いてもらいましょう。音楽家は誰に朗読してほしいかを尋ねることができます。話す時間があったら、家族に言ってもらいましょう。'
      points:
        p1: 'バッハが訪問者にスコアを押し込む。あなたは、別の介護者に、待ってもよいかどうか話し合う前に、心配していることを説明し終えてもらうように頼みます。バッハ氏は家族に予約を辞退するよう頼み、その日の午後に知り合いの歌手に２部の朗読を依頼する。最初のパッセージの終わりで、彼は歌手にもう一度休符を読み上げるように頼みます。'
      outcomes:
        all: 'その春、バッハは最高の光が得られる時間帯にいくつかの測定値を設定しました。誰かが本を読み、彼はキーボードケースに手を置きながら聞いています。遺族は依然として7月に彼の死を発表している。'
        p1: 'テイラーの予定はキャンセルされる。光がスタンドに届くと、読者はバッハが要求した一時停止から始まります。'
      none: '約束は進みます。その後、家族が譜面台を片づけると、誰かが彼のために読んでくれたかもしれないページがまだテーブルの上にありました。'
      not_admitted: '家族は待っている人たちに前の部屋に留まるよう呼びかけます。旅行者は決して呼び出されず、何が議論されているか何も聞かれません。'
      excerpts:
        p1: 'バッハ氏は家族に予約を辞退するよう頼み、その日の午後に知り合いの歌手に２部の朗読を依頼する。最初のパッセージの終わりで、彼は歌手にもう一度休符を読み上げるように頼みます。'
    relic: '羽ペンから切り出したオルガンパイプ'
    relic_desc: '調整されテストされたのに売れ残った小さなパイプ。'
    points:
      p1: 'バッハ氏がテイラー氏の手術に同意する前にセカンド・メディカル・オピニオンを提供し、決断を下すまで読書の手伝いを手配することを申し出る'
    points_fail:
      p1: 'バッハには、検討すべき第二の意見はありません。彼は手術を続行するが、合併症により二度目の手術が行われることになる。'
    shift:
      p1:
        was: '1750年の春、ジョン・テイラーはライプツィヒでバッハの目の手術を行った。合併症により二度目の手術となった。'
        now: 'この部門では、バッハは{staff}と話し合った後、テイラーの手術を拒否することを決定しました。彼の視力は依然として悪いため、昼間に一緒に楽譜を読んでくれる人を手配します。'
        who: 'bach_leipzig'
        bio: 'この支部では、バッハは 1750 年の春にテイラーの手術を辞退し、楽譜を読む手伝いを手配しました。'
    vignettes:
      entry: '歌手が期待するよりも一息早く、低音部が到着するのが聞こえます。部屋の反対側から聞いてもらいます。今度は合図の前に頭を上げます。'
      rest: '歌手は休憩中に数を数えなくなります。待っている間に聞こえるセリフをコピーし、自分の入場の直前に出てきた単語にマークを付けます。'
      light: '2 人の歌手が 1 ページを共有します。それを光に向かって傾け、線が分かれる場所が両方に見えるまでそこに保ちます。'
  lavoisier_paris:
    name: '逮捕命令が出る前に'
    place: 'パリ'
    figure: 'アントワーヌ・ラヴォアジエ'
    story: '1793年11月24日、元徴税農民全員の逮捕が命じられ、ラヴォアジエとその義父ジャック・ポールズも投獄された者の中にいた。 1794年5月8日、二人と他の元徴税農民たちは有罪判決を受け、同日パリで死刑となった。'
    story_prose:
      opening:
        - 'パリでは、ジャック・ポールズが娘のためにアカウントを広めています。アントワーヌ・ラヴォアジエは、表の反対側にある別のページを読んでいます。二人とも自分たちの本の説明をするために街に残るつもりだ。家族の誰かが、誰が自分の代わりに台帳の管理をしてくれるのかと尋ねます。'
        - '1793 年 11 月 24 日、当局は元徴税農家の逮捕を命じた。ポールズとラヴォアジエはどちらも 1794 年 5 月 8 日に処刑されました。この分岐では、両氏にパリを離れることを検討するよう求めることができます。それぞれが自分で決めます。'
        - 'それぞれの男性の理由を聞くことができる人は、順番に彼らと話すことができます。口座の使い方に詳しい旅行者は、家族が保管しておく書類をリストアップすることもできます。'
      points:
        p1: 'ポールゼさんは、本全体を手渡すと家族はどんな質問をされるか見当がつかなくなると言う。あなたは彼に、話しながら各ページにマークを付けるように頼みます。彼の娘は、台帳全体を取得する前に、彼が指摘したアカウントをチェックします。彼女が自分のマークを読み上げるのを聞くと、彼は立ち上がって椅子をテーブルの下に押し戻しました。'
        p2: 'ラヴォアジエは、自分自身をまだ説明する必要があると考えている2つのエントリを含む声明を保持しています。あなたは、引き継ぐ人のために説明を書いてもらえるかどうか尋ねます。両方の言葉が読み上げられるのを聞いた後、彼は家族に、もし誰かから電話があったらパリを離れたと言ってほしいと頼んだ。彼は出発する前にそのページを彼らの横に置き、その下に白紙のシートを残します。'
      outcomes:
        all: '二人は別々に街を離れます。 5月に家族が本を開くと、それぞれからの知らせが入っています。どちらも生きています。'
        p1: 'パウルゼは去ったが、翌年5月以降も生きている。ラヴォアジエはパリに留まり、後に処刑される。'
        p2: 'ラヴォアジエは去ったが、翌年5月以降も生きている。ジャック・ポールズはパリに留まり、後に処刑される。'
      none: '家族はテーブルから離れます。両名は市内に留まり、翌年5月に処刑された人々のリストに両名の名前が載っている。'
      not_admitted: '家族が期待していた訪問者はテレホンカードを持っていない。誰かが台帳を閉じてテーブルの上に置いておきます。'
      excerpts:
        p1: '彼の娘は、台帳全体を取得する前に、彼が指摘したアカウントをチェックします。彼女が自分のマークを読み上げるのを聞くと、彼は立ち上がって椅子をテーブルの下に押し戻しました。'
        p2: '両方の言葉が読み上げられるのを聞いた後、彼は家族に、もし誰かから電話があったらパリを離れたと言ってほしいと頼んだ。彼は出発する前にそのページを彼らの横に置き、その下に白紙のシートを残します。'
    relic: '精密天秤'
    relic_desc: '化学の収支を量るための、感度の高い天秤。'
    points:
      p1: 'ジャック・ポールズに書類を家族に預け、逮捕命令が出る前にパリを離れるよう依頼する'
      p2: 'ラヴォアジエに、自分の説明を直接正当化できるとまだ期待しているうちにパリを離れることを検討してもらう'
    points_fail:
      p1: 'ポールズは論文を携えてパリに滞在している。彼は拘留され、1794 年 5 月 8 日に処刑されました。'
      p2: '歴史通り、ラヴォアジエは 11 月末に投獄され、1794 年 5 月 8 日にパリで死刑が執行されます。'
    shift:
      p1:
        was: 'ジャック・ポールズは1793年11月に拘留され、1794年5月8日に死刑となった。'
        now: 'この支部でパウルゼは家族に書類を残して出発します。彼は 1794 年 5 月以降も生きています。'
      p2:
        was: '1793年11月24日：元徴税農民全員の逮捕が命じられ、ラヴォアジエは投獄された。 1794年5月8日、彼はパリで死刑となった。'
        now: 'この部門では、ラヴォアジエは逮捕命令が出る前にパリを離れ、1794年5月まで生きています。'
        who: 'lavoisier_paris'
        bio: 'このタイムラインでは、ラヴォアジエは 1793 年 11 月の逮捕命令の前にパリを離れ、1794 年以降も生きていました。'
    vignettes:
      units: '2つの数字が綺麗に並んでいますが、1列のユニットがずれてしまいました。コンポジターが列を所定の位置にロックする前に、これをキャッチします。'
      air: 'あなたは、なぜこの表が読者には見えないものを説明しているのかと尋ねます。コンポジターは、入力された内容と残った内容の見出しをタップし、両方の見出しを校正刷りに残します。'
      proof: 'コンポジターが読み取っているときに、現在の行の下に紙切れを置きます。次の例の一部のように見えた数字が、再び独自の見出しを見つけます。'
  faraday_london:
    name: '磁気から電気を取り出す'
    place: 'ロンドン'
    figure: 'マイケル・ファラデー'
    story: '1831 年 8 月 29 日、ファラデーはリング実験で針の瞬間的な動きを記録しました。 10月28日、彼は磁石の極の間で銅の円盤を回転させ、円盤が回転し続ける間に電流を得ました。'
    story_prose:
      opening:
        - '王立研究所のベンチには、傷ついた鉄の指輪が置かれています。ファラデーが接点から見上げると、針はすでにゼロに戻っています。メモを取っている人は、結果を入力しないか、もう一度見るかを尋ねます。'
        - '1831 年 8 月、ファラデーはリングと接触したり切断したりする際に短時間のたわみを観察しました。 10月に、彼は回転する銅のディスクで持続的な電流を目撃しました。保存すべき観測値が 2 つあります。まず、たわみがいつ始まるかを観察します。 2 番目では、終了するときに見てください。'
        - 'タイミングと針を別々に見ることができる人を使用してください。ディスクの場合は、腕が安定している人がコンタクトの世話をすることができます。'
      points:
        p1: 'ノートを横向きにして、片方を接触の瞬間に残し、もう片方を針に当てます。ファラデーが動くと、観測者は針が戻る前に方向を指示します。一時停止の後、接触が切れるまでに彼は別のマークを付けました。2 つの別々のマークが空の列にあります。'
        p2: '円盤が回転すると、ファラデーは観察者にもう少し待つように頼みます。接触が滑ったところを安定させます。観察者がもう一度見ると、針はまだ片側にずれています。彼はディスクが停止した後にのみゼロへのリターンを書き込みます。鉛筆は 2 つの読み取り値の間に空白を残します。'
      outcomes:
        all: '2 つの記録は並んでいます。リングを付けると針がすぐに戻りました。ディスクの場合、回転が停止するまでの経過時間が表示されます。'
        p1: 'リングからの短いたわみは紙の上にあります。他の観察はまだ確立されていません。'
        p2: 'ディスクの読み取り時間は長くなります。以前の呼び出しレコードにはギャップがあり、トリップは同期を保つことができません。'
      none: 'シート上に残るのは列見出しだけです。装置が静かになると、誰も入力できる読み取り値がなくなります。'
      not_admitted: '屋内にいる誰かが訪問者に通路を空けるように頼みます。外から、観察者がもう一度観察してほしいと頼むのが聞こえます。'
      desync: 'リングでのたわみやディスクでの持続的な読み取りはノートブックには届きません。実験記録が同期しなくなり、事務局はその旅行者を呼び戻す。'
      excerpts:
        p1: '一時停止の後、接触が切れるまでに彼は別のマークを付けました。2 つの別々のマークが空の列にあります。'
        p2: '彼はディスクが停止した後にのみゼロへのリターンを書き込みます。鉛筆は 2 つの読み取り値の間に空白を残します。'
    relic: '鉄のリングとコイル'
    relic_desc: '軟鉄のリングにワイヤーを 2 つ巻きます。'
    points:
      p1: 'ファラデーのリング実験での一瞬のたわみを保存するために、スイッチングと針を別々に観察します。'
      p2: '回転する銅ディスクにコレクタを接触させておくと、ファラデーはディスクの動作中に電流を観察できます。'
    points_fail:
      p1: '針は誰もが見る前に停止状態に戻ります。実験はヌル結果として入力され、同期が失われた後、オフィスはその従業員を呼び戻します。'
      p2: 'ディスクが回転すると接点が滑ります。この支店には継続的な読書はなく、事務所はその従業員を召還した。'
    shift:
      p1:
        was: '1831 年 8 月 29 日、ファラデーは鉄のリング装置のスイッチがオンとオフになったときの短い誘導電流を観察しました。'
      p2:
        was: '1831 年 10 月 28 日、ファラデーは銅の円盤が磁石の極の間で回転する間に電流を観察しました。'
    vignettes:
      instant: '助手は針が動いたと書きます。移動したときのためにスペースを残しておきます。彼が器具に目を戻す頃には、針は安定しています。'
      skeptic: 'あなたは、測定値が維持されているかどうかを尋ねます。アシスタントは最初のマークの後の空白を指します。一緒に、それを休止状態への復帰としてラベル付けすることで、空白を読み逃したと間違える人がいないようにします。'
      sketch: 'マージンにリングを描き、反対側にある 2 セットの巻き線に印を付けます。これで、アシスタントは観察結果を適切な装置と一致させることができます。'
  pasteur_paris:
    name: 'アルボワの夏'
    place: 'アルボワ'
    figure: 'ルイ・パスツール'
    story: '1859年の夏、パスツールの長女ジャンヌ（9歳）は、父親がパリで働いている間、アルボワの祖父の家に滞在していた。 9月に彼女は腸チフスで倒れ、そこで亡くなった。'
    story_prose:
      opening:
        - 'アルボワにあるジャンヌの祖父の家の窓際にパリからの短い手紙が置かれている。ジャンヌは今日の午後、庭に出ていません。彼女の祖父は時々ベッドサイドに行きます。そこから、誰かが郵便物を取りに来るのを聞くことができます。'
        - 'ジャンヌは 1859 年の夏に祖父の家に滞在しました。歴史上、ジャンヌは 9 月に腸チフスで亡くなりました。この支店では、オフィスの架空の医療キットが彼女の病気の経過を変える可能性があります。彼女の祖父は、彼女が再び起き上がったと書くかもしれない。'
        - '介護体験とオフィスのナノキットを備えた旅行者を派遣します。祖父に助けが必要な場所を尋ね、祖父が目を覚ますまで近くにいてください。'
      points:
        p1: '彼女の祖父はベッドが見える場所に椅子を移動します。あなたはオフィスキットを介護者に渡し、ジャンヌが望む場所に泊めてもらいます。彼女が目を覚まし、座るように言うと、彼は便箋を取り出して、彼女に何を付け加えてほしいかを尋ねました。彼女は彼に、まずママに手紙を書くように頼み、それからパパへの文を考える。'
      outcomes:
        all: '彼女の祖父は彼女が回復していると手紙を書いた。彼は短い手紙を彼女の父親が送った手紙の横に置き、投函できるように準備を整えた。'
        p1: 'ジャンヌはしばらく座っていられるほどの力がある。彼女の祖父は、彼女が目覚めたときに使った言葉で両親に手紙を書くことができます。'
      none: '誰かが郵便物を取りに来ると、彼女の祖父はもう一度シートを折ります。歴史上、ジャンヌはその病気から回復しませんでした。'
      not_admitted: '家族はまだ訪問者を認めていない。郵便物を受け取る人が先に出発し、パリからの手紙は屋内に残ります。'
      excerpts:
        p1: '彼女が目を覚まし、座るように言うと、彼は便箋を取り出して、彼女に何を付け加えてほしいかを尋ねました。彼女は彼に、まずママに手紙を書くように頼み、それからパパへの文を考える。'
    relic: 'アルボワからの封筒'
    relic_desc: 'ジャンヌの祖父が保管していた封筒の架空のコピー。'
    points:
      p1: 'ジャンヌの祖父にオフィスの医療キットを届け、熱が下がったときの世話を手伝いましょう'
    points_fail:
      p1: '祖父の世話にもかかわらず、熱は悪化する。ジャンヌはアルボワで亡くなる。'
    shift:
      p1:
        was: '1859年9月：パスツールの長女ジャンヌ（9歳）が、祖父と滞在していたアルボワで腸チフスで死亡した。'
        now: 'この支店では、{staff} がオフィスの医療キットを使用した後、ジャンヌの熱が下がりました。彼女の祖父は、彼女が座るのに十分なほど元気になったと両親に知らせることができます。'
        who: 'pasteur_paris'
        bio: 'この支部では、1859 年にパスツールの長女ジャンヌがアルボワで腸チフスから回復しました。'
    vignettes:
      date: 'おじいさんはこの手紙に最後の手紙の日付を書き始めます。 {staff} は 2 つの封筒を並べて置き、日付を確認します。'
      address: '配達員が出発する前に、{staff} はパリの住所を祖父に読み上げます。手紙は家族が開けるまで折りたたまれたままです。'
      future: '{staff} は、パリから持ってきたシートの横に新しいシートを置きます。ジャンヌが次に言うことを追加する余地があります。'
  david_fleay_healesville:
    name: 'コリーが自分で出てくるまで'
    place: 'ビクトリア州ヒールズビル保護区'
    figure: 'デイヴィッド・フリー'
    story: '1943 年末、ヒールズビル自然保護区でカモノハシのジルが孵化させ、後にコリーと名付けられるようになりました。デイヴィッド・フリーと彼のチームは、1944年1月に巣を開けたときに誕生を確認した。 2月26日、彼はコリーが泳ぎに出てくるのを初めて観察した。'
    story_prose:
      opening:
        - 'ヒールズビルの巣穴の土壌はまだ柔らかい。デイヴィッド・フリーは、カモノハシの若いコリーをジルの巣に返す前に観察するために観察スペースを開放しました。キーパーのブーツは崩れかけた端で止まります。'
        - 'コリーは、飼育下での飼育に成功した最初のカモノハシでした。 1944年2月26日、フリーは彼女が自ら巣穴から出ていくのを初めて見た。 3月の公の場では、囲いにスペードがもたらされました。ここであなたは彼女の世話を手伝い、群衆に待ってもらうことができます。'
        - '銀行を見張っている旅行者は、フリーイが開口部を守るのを助けることができます。動物に注意を払う人は、ジルが集められるように巣の葉を残しておくことができます。世間体を整えるために、番人たちにスペードを下ろすよう説得できる人を派遣してください。'
      points:
        p1: 'あなたはキーパーに下がってるよう合図します。ブーツが停止すると、土の粉がリムを滑り落ちます。フリーがコリーを巣に戻す間、あなたはボードのエッジを固定します。フリーは手を引っ込める前に、中で物事が静まるのを待った。'
        p2: '飼育員は腕いっぱいの落ち葉を巣穴に向かって運びます。あなたはジルが前夜いつも出てきた浅瀬を見せ、そこに落ち葉を置いておくように頼みます。まだ明るいうちに二人で歩き去ります。ジルは葉っぱを請求書に入れて歩き出し、銀行に戻りました。'
        p3: '誰かが時計を3回チェックし、番人が鋤をレールに持ってきました。あなたはフリーイに、標識に「コリーを待ってください」とだけ書いてよいかどうか尋ねます。前の子供が後ろの誰かに水が見える場所を作ります。番人はスペードをしまいます。コリーの請求書が目に入ると、線路にいる人々さえも沈黙する。'
      outcomes:
        all: 'コリーは巣穴から泳ぎ出ます。聖域には建前があり、線路脇の土手には新たなスペードマークはありません。'
        p1: 'ボードが離れる頃には、コリーは巣に戻っています。この旅行は初期の飼育記録を保存します。'
        p2: '水辺の葉は少なくなりました。飼育員はブーツを泥の中から引き上げ、そのまま岸辺を離れた。'
        p3: '群衆はコリーが一人で出てくるのを見ます。レポートには、スペードをしまった状態の様子が記録されています。'
      none: '葉は元の場所に残ります。訪問者の中には、帰りの最終便が見える場所で待つ人もいます。'
      not_admitted: '管理人は訪問者にレールの外で待つよう指示する。閉店前に誰も迎えに来ません。'
      desync: 'フリーが若い動物を返す前に、緩い土が開口部を塞いでしまいます。過去の飼育記録が同期しなくなり、事務所は旅行者を呼び戻した。'
      excerpts:
        p1: 'フリーがコリーを巣に戻す間、あなたはボードのエッジを固定します。フリーは手を引っ込める前に、中で物事が静まるのを待った。'
        p2: 'まだ明るいうちに二人で歩き去ります。ジルは葉っぱを請求書に入れて歩き出し、銀行に戻りました。'
        p3: '番人はスペードをしまいます。コリーの請求書が目に入ると、線路にいる人々さえも沈黙する。'
    relic: '木製の餌すくい'
    relic_desc: '使い古されたハンドルが付いた小さな木製のスコップ。'
    points:
      p1: 'フリーイがコリーを巣穴に戻すのに十分な期間、ゆるい土を開口部に近づけないでください。'
      p2: '飼育員にプールの近くに新鮮な葉を置いておいて、暗くなってからジルが集められるように頼んでください。'
      p3: '家族展示の日にコリーが隠れるときは、巣穴を閉じたままにするよう保護区を説得する'
    points_fail:
      p1: 'フリーイがコリーを安全に帰還させる前に、ゆるい土が開口部を覆ってしまう。最初の成功した飼育は歴史と同期しなくなり、その日、事務所から {staff} に電話がかかってきました。'
      p2: '飼育員たちはその場をそのまま立ち去る。ジルは岸辺のさらに遠くから落ち葉を集めなければなりません。'
      p3: '宣伝されていた時間が経過し、聖域はシャベルを使うことになります。コリーが連れ出されるまでに、ほとんどの訪問者は帰ってしまった。'
    shift:
      p1:
        was: '1944年1月3日、フリーは若いカモノハシを荒れた巣に戻し、ジルは飼育を続けた。'
      p2:
        was: 'フリーは、巣穴を開けた後、ジルが巣材と土を押し出したと記録している。'
        now: 'この分岐では、{staff} が飼育員にプールの届く範囲に落ち葉を残すように依頼します。ジルは暗くなっても、再び巣穴を開ける人がいなくても、それらを集めることができます。'
      p3:
        was: '1944年3月、コリーは家族展示の宣伝中にトンネルに逃げ込み、ほとんどの訪問者が去った後に掘り出された。'
        now: 'この支店では、{staff} が飼育員に夜の観察を示し、シャベルを置くように指示します。まだそこにいる訪問者はプールのそばで待つか、別の日に戻ってくることができます。'
  archimedes_syracuse:
    name: '街が陥ちた日'
    place: 'シラキュース、シチリア島'
    figure: 'アルキメデス'
    story: 'アルキメデスは、ローマの包囲中にシラクサを守るために機械を考案しました。紀元前 212 年に都市が陥落したとき、彼は殺されました。 Plutarch gives several versions of how it happened.'
    story_prose:
      opening:
        - 'シラキュース陥落の日、街頭の叫び声は止む。 A neighbour stands inside with a writing tablet and asks whether you have come for the older man who draws figures.アルキメデスはかつて彼からボードを借りたことがあります。'
        - 'アルキメデス was killed when Roman forces took Syracuse.状況については古代の記述が異なります。 In this branch you can find him and stay with him until he has somewhere to spend the night.'
        - '彼を認識できる旅行者を送り、近所の人に彼がどこに行ったのか尋ねてください。彼は自分の製図板をどうするかを自分で決めることができます。'
      points:
        p1: 'アルキメデス turns the board half a circle and says it still needs a line.あなたは彼に近所の人の古いタブレットを見せて、外にいる誰かがその絵を持ち運べることを彼に知らせます。彼はフレームを指で一度叩いて渡します。身を寄せる部屋に入ると、彼はまず、あの板も届いたかと尋ねます。'
      outcomes:
        all: '都市の崩壊後も、この支店にはアルキメデスのニュースがまだ残っています。 Someone in the house sets his board beside a stool where he can sit.'
        p1: '彼が避難所に到着するまで、あなたは彼と一緒にいます。 He lifts the cover from the board and can still finish the last line.'
      none: 'The neighbours hear that アルキメデス was killed when the city fell.生き残ったアカウントの状況は異なるだろう。'
      not_admitted: '隣人は訪問者を外に留めています。 Someone takes a board from the entryway before you can read the name on it.'
      excerpts:
        p1: '彼はフレームを指で一度叩いて渡します。身を寄せる部屋に入ると、彼はまず、あの板も届いたかと尋ねます。'
    relic: 'ワックス描画タブレット'
    relic_desc: '架空の隣人の家で使われた練習用の板。線が一本引いてあります。'
    points:
      p1: '街が崩壊する間にアルキメデスを見つけて、避難所に到着するまで彼と一緒にいてください'
    points_fail:
      p1: 'ようやく彼を最後に見た人たちに会うと、街が陥ちたときに殺されたと聞かされます。'
    shift:
      p1:
        was: 'アルキメデス was killed when Roman forces took Syracuse in 212 BC.古代の記述は状況によって異なります。'
        now: 'この支流ではシラキュースは依然として陥落している。アルキメデスは{staff}とともに避難所に到着し、生き残ります。'
        who: 'archimedes_syracuse'
        bio: 'このタイムラインでは、アルキメデスは紀元前 212 年のシラクサの陥落を無事に乗り越え、生き続けました。'
    vignettes:
      load: '{staff} は、古いボードを新しいボードの下に置き、どの図面を読みやすくする必要があるかを尋ねます。隣人はまだ露出したワックスを指差した。'
      settle: '隣人がスツールから書き込みボードを片付け始めます。 {staff} は、誰かが座れる場所を離れるように彼に頼みます。'
      crown: '{staff}が隣人に、貸した板はどんなものだったかと尋ねます。隣人は二本の指を広げて、その幅を示します。'
  hypatia_alexandria:
    name: 'あの三月のアレクサンドリア'
    place: 'アレクサンドリア'
    figure: 'ヒュパティア'
    story: '415年の初め、ヒュパティアは依然としてアレクサンドリアで数学と哲学を教えており、市の治安判事が彼女の話を聞きに来ます。市の知事と別の派閥との間の確執は週ごとに激化し、彼女は知事とのつながりを通じてその争いに巻き込まれていく。'
    story_prose:
      opening:
        - 'アレクサンドリアでは午前の授業が終わったところです。学生がテーブルの上に印を付けた木片を残し、ヒュパティアに明日同じ部屋に来るべきかどうか尋ねます。巷での話題も変わってきました。彼女はいつものようにここで教えるつもりだった。'
        - 'ヒュパティアは 415 年 3 月にアレクサンドリアで殺害されました。後期の古代の記録には、公の場で哲学を教えたという彼女の評判も記録されています。この分岐は、彼女に計画を変更し、彼女を受け入れてくれる誰かと一緒に留まる理由を与える可能性があります。'
        - '生徒たちの声を聞き、先生と新しい取り決めについて話し合える旅行者を派遣してください。彼女はどこに行くかについて合意し、借りた本を返してくれる人を選ぶ必要があります。'
      points:
        p1: 'ヒュパティアは、貸すと約束した本をまだ待っているのは誰かと尋ねます。あなたは彼女に、ローンを処理できる人の名前を挙げてもらい、どの友人が彼女に部屋を提供してくれたのか説明します。彼女は木簡の裏に書きかけの質問を書き、テーブルのそばにいる生徒にそれを手渡します。その日になっても本は返却されており、先生はすでに友人の家に来ています。'
      outcomes:
        all: '友人の家にいる人が彼女にその問題を終わらせるように頼みました。この支部には3月に彼女が教えた記録がまだ残っている。'
        p1: '彼女はその日の予定を変更することに同意し、ドアを開けてくれた友人に連絡します。教卓はしばらく空のままになっている。'
      none: '学生が印を付けた短冊を返しに来て、ヒュパティアが殺されたことを聞く。彼はそれを、最後のレッスンで座っていた場所に置きます。'
      not_admitted: '学生は本を借りている人のリストを閉じます。訪問者の名前は入力されず、ドアが閉まるときもストリップはテーブルの上に置かれたままです。'
      excerpts:
        p1: '彼女は木簡の裏に書きかけの質問を書き、テーブルのそばにいる生徒にそれを手渡します。その日になっても本は返却されており、先生はすでに友人の家に来ています。'
    relic: 'マークされた木簡'
    relic_desc: '問題の一部が裏面に描かれた架空の教材。'
    points:
      p1: '最悪の事態に陥る前に、アレクサンドリアをしばらく離れるか、その日のうちに別の道を行くよう彼女を説得して彼女を救ってください。'
    points_fail:
      p1: '彼女は以前と同じように街を歩き回りましたが、この支店でもその年の3月に殺されました。'
    shift:
      p1:
        was: '415 年 3 月: 数学者で哲学者のヒュパティアが、混乱に陥ったアレクサンドリアで殺害されました。'
        now: 'その3月、彼女は街を離れていた。事態が沈静化すると、彼女はアレクサンドリアに戻り、教え続けました。'
        who: 'hypatia_alexandria'
        bio: 'このタイムラインでは、ヒュパティアは耳を傾けて 415 年 3 月より前にアレクサンドリアを去り、その春を経てアレクサンドリアに戻り、その後市内で教職に戻りました。'
    vignettes:
      scale: '生徒は木簡の間違ったマークを指さします。 {staff} は、カウントがどこから始まったかを示すように彼に求めます。彼は指を 1 つ戻します。'
      copy: '{staff} はまだ返却しなければならない本を尋ね、次の生徒が見つけられる場所にその名前を書きます。'
      name: '{staff} は、部屋が閉まっている場合に、借りた本をどこに持っていくか学生に確認します。生徒は答えを表紙の中に折り込みます。'
  gutenberg_mainz:
    name: '金属活字で本を刷る'
    place: 'マインツ'
    figure: 'ヨハネス・グーテンベルク'
    story: 'ヨハン・フストはマインツでのグーテンベルクの印刷事業に資金を提供しました。この 42 行の本は、フストの返済と利息の要求を記録した 1455 年 11 月 6 日の文書とともに現存しています。文書には、どちらの男性もどの道具を保管していたかは記録されていない。'
    story_prose:
      opening:
        - 'マインツの印刷工が新しい紙を光にかざし、隅に印を付けます。製紙業者は、今回は給料が支払われるかどうか尋ねます。 Gutenberg にはチェックすべきページが山ほどあります。ファストには解決すべき金額がある。'
        - '四十二行版はこの頃に完成した。 1455年11月6日付の公証書には、グーテンベルクとフストの間の論争が記録されている。ここでは、実行を提供したままにし、パートナーシップが終了した後も Gutenberg がどのツールを引き続き使用できるかについて同意するよう依頼できます。'
        - '用紙、種類、賃金を確認できる人を派遣してください。ツールの問題を解決するには、両氏に合意事項の読み上げを聞かせることができる人物も必要です。'
      points:
        p1: '印刷工は紙の束を数え、もう一束いると言います。サプライヤーにその日の完成したシートを作業伝票と照らし合わせて数えてもらい、次のロットと賃金をグーテンベルクの別の行にリストします。サプライヤーは在庫を取り戻すためのマークをこすり落とします。翌朝、印刷機の版台には新しい紙が用意されています。'
        p2: 'ファストはアカウント全体をもたらします。それぞれの前払いの金額は示されていません。あなたはグーテンベルクに、まだ必要なツールから始めるように頼み、店員に各アイテムの条件を両方の男性に読み上げさせます。それぞれがコピーを取り、木製のハンドルがフックに掛かったままになります。グーテンベルクは帰り際に、コピーを賃金台帳に折り込みます。'
      outcomes:
        all: '42 行の版は完成しましたが、支援者にはまだ清算が必要です。各人は、グーテンベルクが使用できるツールに関する同意書のコピーを持っています。'
        p1: '印刷業者は作業を完了し、完成したシートが工場から出荷されます。公証人は今後も道具と金銭に関する議論を審理するだろう。'
        p2: '彼が使用できるツールのリストが書かれています。版はずれており、旅行では議論の記録だけが戻ってきます。'
      none: '未完成のシートが印刷機上に残ります。作業員とサプライヤーはまだ答えを待っています。'
      not_admitted: '印刷業者は、訪問者が紙を取りに来たのか会計を取りに来たのかを戸口を通して尋ねます。誰もあなたを連れてきません。外からはベンチに板を置く音だけが聞こえます。'
      desync: '途中でプレスが止まります。紙も賃金も尽きてしまった。出版物の同期が失われ、事務局は旅行者をリコールする。'
      excerpts:
        p1: 'サプライヤーは在庫を取り戻すためのマークをこすり落とします。翌朝、印刷機の版台には新しい紙が用意されています。'
        p2: 'それぞれがコピーを取り、木製のハンドルがフックに掛かったままになります。グーテンベルクは帰り際に、コピーを賃金台帳に折り込みます。'
    relic: '鉛の活字'
    relic_desc: '鉛と錫でできた、文字が左右逆向きの小さな活字。'
    points:
      p1: '印刷作業は借金に依存している間、42 行の本を完成させるのに十分な期間、活字、紙、労働者を利用できるようにしておく'
      p2: '11 月の訴訟前に、Gutenberg と Fust が提携終了後も Gutenberg がどのツールを使い続けられるかについて合意できるよう支援してください。'
    points_fail:
      p1: '42 行の本は印刷機で半分印刷されたところで止まります。この支店は歴史から消え去り、事務所はその日の従業員を呼び戻した。'
      p2: '紛争はツールに関する合意がないまま進行する。グーテンベルクは、それらを再び使用できるという保証がないまま会議を退席します。'
    shift:
      p1:
        was: '1455年: 42行の本がマインツのグーテンベルクの工房で完成し、可動金属活字で印刷された。'
      p2:
        was: '1455年11月6日、公証人はフストの返済と利息の要求を記録した。この文書では、ツールの最終的な所有権が不明瞭になっています。'
        now: 'Gutenberg と Fust は、Gutenberg がどのツールを使い続けられるかについて同意しています。パートナーシップが終了したら、彼は再び彼らと走る計画を立てることができる。'
        who: 'gutenberg_mainz'
        bio: 'この部門では、グーテンベルクは 1455 年の紛争後も印刷ツールの一部への継続的なアクセスを確保しました。'
    vignettes:
      wrong_sort: '見習いが箱に戻す直前に、間違った種類に気づきました。あなたはそれを隣の隣に置き、一方の顔がもう一方の場所にどのようにプリントされるかを彼に見てもらいます。'
      reader: 'あなたは、混雑した列を演台から読むことができるかどうかを尋ねます。弟子は後ろに下がり、それを声に出して読みます。彼は間違った行に目が飛んだ場所をマークします。'
      proof: '新しい校正刷りを下から上に向かって 1 行ずつ読みます。見習いは、ページにあるものではなく、自分が期待しているものを読んでいる自分に気づくまで笑います。'
  leonardo_florence:
    name: '機械を描いた画家'
    place: 'フィレンツェ'
    figure: 'レオナルド・ダ・ヴィンチ'
    story: 'ルーブル美術館は、「モナ・リザ」として知られるレオナルドの肖像画の始まりを1503年頃と定め、その後もレオナルドが描き続けたと記録している。'
    story_prose:
      opening:
        - 'フィレンツェのワークショップ内では、新しいラックを設置するスペースを確保するためにパネルが窓から移動されました。エージェントがリサの肖像画がどこにあるか尋ねに来ます。まだ濡れているパネルに手を伸ばそうとする彼を、見習いが止める。'
        - 'アゴスティーノ・ヴェスプッチの1503年10月の日付付きメモには、レオナルドのリサの肖像画について言及されている。この絵は後に画家の手元に残りました。ここでは、作業用と保管用の場所を確保し、レオナルドが見せたいものをリサが見られるように手配できます。'
        - 'ラック、パネル、日光を判断できる人を派遣してください。内覧の手配をするには、シッター、画家、エージェントを約束の時間に集めてください。'
      points:
        p1: '見習いは古いラックからもう 1 つのスペースを絞りたいと考えています。あなたは彼に、最初に空のパネルをスライドさせて、その角がその横の絵に触れるのを観察するように頼みます。彼は窓のそばのスペースを空け、レオナルドにそのスロットにマークを付けるように頼みました。その後、仕事を片づける人は、ラックに手を伸ばす前に、このパネルのラベルに触れます。'
        p2: '画家は絵の具を保護するための乾いた練習用ボードを求めます。彼は自分で肖像画をドアの方に向け、リサに立つ場所を示しました。彼女は、次回も同じポーズが必要かどうか尋ねます。彼は椅子の後ろを見て、見習いに椅子が立っている位置に印を付けるように言いました。リサが去った後、レオナルドはパネルを照明に戻します。'
      outcomes:
        all: '工房にはまだ写真を撮る余地があります。リサはそれがどこまで進んだかを見ていて、レオナルドはまだパネルを保持しています。'
        p1: 'パネルには日光が当たり、ラベル付きの収納スロットが付いています。エージェントは進捗状況を尋ねることができます。内覧会の日程はまだ決まっていない。'
        p2: 'リサはその作品を一度見たことがあります。後にパネルが破損してしまい、旅の途中で見た光景が思い出される。'
      none: 'ラックにはまだスペースがありません。訪問者はドアのところで、画家が絵を引き渡さなかったことだけを知ります。'
      not_admitted: '見習いは、ラックを持ち込む人々のためにスペースを空けるように頼みます。ドアの外からはパネルの正面が見えません。'
      desync: '古いラックが濡れたパネルを圧迫して損傷します。歴史的な肖像画はもはや保存されておらず、事務所は旅行者を呼び戻しています。'
      excerpts:
        p1: '彼は窓のそばのスペースを空け、レオナルドにそのスロットにマークを付けるように頼みました。その後、仕事を片づける人は、ラックに手を伸ばす前に、このパネルのラベルに触れます。'
        p2: '彼は椅子の後ろを見て、見習いに椅子が立っている位置に印を付けるように言いました。リサが去った後、レオナルドはパネルを照明に戻します。'
    relic: '鏡面で書かれたノートのページ'
    relic_desc: '読み取るにはミラーが必要な逆方向スクリプトのページ。'
    points:
      p1: 'ワークショップで別の市民絵画を制作する前に、作業用の光があり、パネルが保管されているリサの肖像画用の場所を確保してください。'
      p2: '肖像画がまだフィレンツェにある間に制作中の作品の内覧を手配し、シッターに何を見せるかレオナルドに選択してもらいます'
    points_fail:
      p1: '新しい作品が到着し、未完成のパネルが古いラックに押し込まれます。肖像画が破損し、事務所は従業員をリコールした。'
      p2: '見学のための時間は設けておりません。写真を待っている人は、作業場にどこまで来たかを尋ねることしかできません。'
    shift:
      p1:
        was: '1503年10月のアゴスティーノ・ヴェスプッチの欄外メモには、レオナルドがリサ・デル・ジョコンドを描いたことが記録されています。'
      p2:
        was: 'この肖像画は大幅な修正を経て、レオナルドとともにイタリアを離れ、フランスのコレクションに加わりました。'
        now: 'リサはこの段階で肖像画を見ます。レオナルドさんは引き続きパネルを持ち歩くことができますが、ワークショップでは彼女に見せたバージョンのスケッチが保管されています。'
        who: 'leonardo_florence'
        bio: '現代のフィレンツェの紙幣には、レオナルドの工房にあるリサの肖像画が掲載されています。絵は変化を続け、最初の設定から遠く離れていきました。'
    vignettes:
      shadow: 'あなたは見習いに、顔がどこで終わり、背景が始まるかを示すように頼みます。彼らは指をさし、そして躊躇します。太い線を描く代わりに、トランジションをそのままにしてもう一度見てみましょう。'
      hands: '訪問者は顔を覚えていますが、手を別の場所に置きます。練習用の絵を記憶スケッチの横に置き、変更された線を見つけてもらいます。'
      seat: '見習いが荷物をまとめている間、あなたは床にあるシッターの椅子に印を付けます。彼らは、戻ってきたときに椅子がどこに行くのかを知っているので、図面を未完成のままにしておきます。'
  galileo_padua:
    name: '木星を巡る衛星'
    place: 'パドヴァ'
    figure: 'ガリレオ・ガリレイ'
    story: 'Starry Messenger の中で、ガリレオは木星の近くの 4 つの小天体の位置の変化を記録し、それらが木星の周りを回っていると結論付けました。'
    story_prose:
      opening:
        - 'パドヴァでの 1 月の観測の終わりに、ガリレオは木星の横に光点を描きます。翌日の夜には彼らの立場が変わります。写字生が図面をサイズごとに積み上げ、それをヴェネツィアに持っていく人がどの夜が先か尋ねます。'
        - '木星の衛星の観察結果は、1610 年に『シデレウス ヌンシウス』に掲載されました。ボローニャでの 4 月の裁判では異議が唱えられ、ホルキーは後にこの本に反対するパンフレットを印刷しました。このブランチでは、1 月の夜を順番に保ち、一部のゲストにポイントを自分で確認してもらうことができます。'
        - 'スケッチと日付を比較できる人を派遣して、印刷所のコピーをチェックしてもらいます。マジーニの家では、訪問者が木星を振り返る前に、紛れもない明るい星を見つけるのを手伝ってください。'
      points:
        p1: 'あなたは写字生に、3点の夜と2点の夜のどちらが先か尋ねます。彼はノートを取り出して、それが逆になっていることに気づきました。ガリレオが日付を読み上げると、ヴェネツィアにセットを渡す前に、各コーナーをそのエントリと照合します。写本家は二日目の夜に目を向け、点の位置がどのように変わったかを見てうなずきます。'
        p2: 'マジーニの最初の客は身を引いて、一筋の光しか見たことがないと言いました。ガリレオがスペースを作ります。ゲストに、見覚えのある明るい星を 1 つ見つけてもらい、木星に戻ってもらいます。ゲストは席に座り、仲間の注意を引くために手を上げます。彼は、見た数字を言う前に、自分で数えるよう彼女に頼みます。'
      outcomes:
        all: '印刷された図は 1 月の注文を維持しています。ボローニャでは、ゲストは自分のカウントを記録し、次の夜のポイントがどこになるかを尋ねます。'
        p1: 'ヴェネツィア用のコピーは準備中です。ボローニャには、この観察に異議を唱える手紙やパンフレットが今も残るだろう。'
        p2: '少なくとも 1 人のゲストが、木星の横にある光の数を自分で数えることができます。印刷記録は同期されなくなり、カウントは旅行者のアカウントに残ります。'
      none: '写字生は夜を順番に並べずに、サイズごとにシートを積み重ねます。'
      not_admitted: 'ドアのそばで誰かがあなたを連れてきたのを尋ねます。あなたは外にいて、写字生がバラした写真をスリーブに入れるのを見ました。'
      desync: 'ゆるい図は、印刷版の中で場所を変えます。元のシーケンスが同期しなくなり、オフィスは旅行者を呼び戻します。'
      excerpts:
        p1: 'ガリレオが日付を読み上げると、ヴェネツィアにセットを渡す前に、各コーナーをそのエントリと照合します。写本家は二日目の夜に目を向け、点の位置がどのように変わったかを見てうなずきます。'
        p2: 'ゲストは席に座り、仲間の注意を引くために手を上げます。彼は、見た数字を言う前に、自分で数えるよう彼女に頼みます。'
    relic: '磨き上げたレンズ'
    relic_desc: '手作業で磨かれた小さなガラスレンズ。'
    points:
      p1: 'ガリレオの日付の入った木星とその光点のスケッチを、コピーをヴェネツィアに送るために保管しておいてください。'
      p2: '4 月下旬のボローニャでは、マジーニのゲストがガリレオの望遠鏡を通して木星の衛星を見るのを手伝います。'
    points_fail:
      p1: 'ゆるやかなスケッチは秩序を失います。印刷会社の印刷物によって夜の順序が狂い、オフィスはその従業員を呼び戻した。'
      p2: '客たちは見ても何も見えないと言う。ホルキーはケプラーに手紙を書き、6月にシデレウス・ヌンキウスに反対するパンフレットを印刷した。'
    shift:
      p1:
        was: 'ガリレオは 1610 年 1 月から連夜木星を観測し、シデレウス ヌンキウスに位置記録を印刷しました。'
      p2:
        was: '1610 年 4 月下旬、ガリレオはボローニャのカプラーラ宮殿でマジーニや他の客人に望遠鏡を見せました。彼らは衛星が見えなかったと言い、そこにいたマルティン・ホルキーは6月にガリレオを批判するパンフレットを印刷した。'
        now: '{staff} は真空管を安定させ、ゲストにどこを見るべきかを示します。その夜、彼らのうちの何人かは木星のそばに光点を目撃しましたが、ホルキーのパンフレットは根拠が少ないことに気づきました。新しいスターはより早く受け入れられます。'
        who: 'galileo_padua'
        bio: '1610 年 4 月にボローニャで、マジーニの客人はガリレオの望遠鏡を通して木星の衛星を観察しました。シデレウス・ヌンシウスに続いた疑惑はもっと短かった。'
    vignettes:
      alignment: 'コピーリストがページの端を揃えるのをやめさせます。代わりに木星を並べてください、とあなたは提案します。ドットは互いに重なり合わなくなります。'
      telescope: 'どのドットが 4 番目なのかを尋ねます。写字生は数晩に渡ってシートを並べ、点が融合したように見えるときにどれを信頼すべきかを尋ねます。'
      dates: 'コピー担当者がシートを積み重ねる前に、各ルースシートに日付をマークします。この順序により、次の読者はドットの位置が変わるのがわかります。'
  heo_nanseolheon_hanyang:
    name: '散らばった詩を収めた紙包み'
    place: '漢陽'
    figure: '許蘭雪軒'
    story: 'ホ・ギュンは、妹の許蘭雪軒の死後、残された著作を編集した。彼女の作品集の朝鮮木版版は 1608 年から現存しています。'
    story_prose:
      opening:
        - '写字生は石で新しい紙のスリーブの重さを量り、同じ開口部の 2 枚のシートを渡します。 1 台は練習用で、もう 1 台は誰かが貸してくれと頼んできました。彼は両方を窓の横から撮ったことを覚えています。'
        - '歴史上、許蘭雪軒の弟ホ・ギュンは、彼女の死後、現存する作品を収集した。 1597 年のセレクション版と現存する 1608 年版は異なる箇所があります。ここでは、詩人が見つけられる場所にコピーを保管し、どの詩を共有したいかを詩人に尋ねることができます。'
        - 'ドラフトを分類するために、ハンドとヘディングを比較できる人を派遣してください。誰がそれを読みたがっているのかを説明できる旅行者は、詩人自身に質問を投げかけることができます。'
      points:
        p1: '写字生は濃い色のインクを指差します。あなたは両方のバージョンを並べて置き、薄い方のコピーの最後にある修正箇所を彼に見せました。彼は二人を再び見つけられるように袖にメモを書きます。1 つの見出しの下に 2 枚のシートがあり、折り目は書き込みのかなり手前で止まります。'
        p2: 'ホは、コピーリストの最初の候補をテーブルの彼女の側に戻します。彼女はその場所を埋めるために別のものを選びました。パケットに誰の名前が書かれているかを尋ねると、彼女は筆を取り、最初のシートに自分で署名し、それから順番にページを返しました。彼女は写本師に署名も写すように頼みます。'
      outcomes:
        all: 'ホ・ギュンはコレクションをまとめるとき、妹が残した順番に小さな包みを保管します。彼女の要求に応じてコピーされた名前は、最初のシートに残ります。'
        p1: '両方のバージョンが見つかります。 Heo Gyun はコレクションを編集するときにそれらを比較できます。彼には妹自身の選択に関する記録がありません。'
        p2: '彼女はいくつかの詩に自分で署名しています。他の論文は迷走している。家に帰ってくるのは、今回の訪問で彼女が選んだ記録だ。'
      none: 'バラしたコピーはテーブルの上に混在したままです。その後のコレクションは、家族が何を見つけられるかにかかっています。'
      not_admitted: '写本家はドアの反対側から見出しを求めます。誰も名前を言えないときは、彼はスリーブをテーブルの上に置いておきます。'
      desync: 'あなたが戻ってくると、コピー担当者は空のスリーブだけを認識します。その後の回収に必要な書類が紛失したため、事務所は旅行者を呼び戻した。'
      excerpts:
        p1: '彼は二人を再び見つけられるように袖にメモを書きます。1 つの見出しの下に 2 枚のシートがあり、折り目は書き込みのかなり手前で止まります。'
        p2: 'パケットに誰の名前が書かれているかを尋ねると、彼女は筆を取り、最初のシートに自分で署名し、それから順番にページを返しました。彼女は写本師に署名も写すように頼みます。'
    relic: '詩のシート'
    relic_desc: '花や遠く離れた場所に詩が筆で描かれた上質な紙。'
    points:
      p1: '家族のコピーを一緒に保管しておき、後でホ・ギュンが自分の選択に含めた詩を手にできるようにします'
      p2: 'ホさんが他の人に読んでもらいたい小さな詩のグループに署名するのを手伝ってください。'
    points_fail:
      p1: '家族は別々の書類を追跡できなくなり、ホ・ギュンはそれらの書類を収集することができなくなります。支店の同期が失われ、オフィスはその従業員をリコールします。'
      p2: '彼女が亡くなった後、家族は残されたコピーの中から彼女のために選ぶことしかできません。'
    shift:
      p1:
        was: '1589年に許蘭雪軒が亡くなった後、ホ・ギュンは実家に保管されていた詩を利用して作品を編纂した。'
      p2:
        was: '1589 年に彼女が亡くなった後、彼女の兄が彼女の詩を選びました。 1597 年のセレクションと 1608 年の版では、異なる読み方が保存されています。'
        now: 'Heo は共有したいページにマークを付けます。家族は、後でコレクションを準備するときに、彼女の署名されたセレクションを一緒に保管します。'
        who: 'heo_nanseolheon_hanyang'
        bio: '許蘭雪軒さんは、喜んで共有したい少数の詩を選びました。彼女の家族は、残された作品を準備する際に、彼女が選んだ順序を守りました。'
    vignettes:
      binding: 'コピー担当者は練習ページを他のシートと混ぜ合わせました。 2 つの見出しを比較し、演習のために 2 番目の袖を折ります。あいまいなページが 1 枚残っており、彼がチェックできるようになっています。詩が印刷された本に届く前に、あなたはその場を去りました。'
      name: 'これらの詩のいくつかは、この家から遠く離れた場所でも読まれることになるでしょう。写字生は見出しのない練習用紙を渡そうとしています。見出しもコピーするように依頼すると、もう 1 枚のシートに名前が残ります。空白の紙片を持って自分の場所を確保します。木版本は何年も先にあります。'
      fold: '筆致にしわを寄せずに、緩んだページを包むのに役立ちます。予備の包装紙に、タイトルが欠けていることをマークします。あなたが奪うのは警告であり、ページではありません。後のコレクションはあなたがいなくなった後にまとめられます。'
  ghalib_delhi:
    name: '繰り返しの句を探す'
    place: 'デリー'
    figure: 'ミールザー・ガーリブ'
    story: '今回のデリー訪問の時点で、ガーリブのウルドゥー語のディバンはすでに 1841 年に印刷されていました。そのガザールは韻とリフレインの語尾で閲覧できます。'
    story_prose:
      opening:
        - '誰かがデリーの書店に入り、覚えている限りの詩を最後の言葉まで朗読します。書店員はもう一度聞いて韻とリフレインを書き留めるように頼みます。彼はその伝票を印刷された本に貼り付けます。'
        - 'ガーリブのウルドゥー語のソファはすでに印刷されていました。王は彼にティムール朝の歴史を書くよう命じた。最初の部分が登場し、予定されていた第 2 巻は未完成のままでした。最初の本を届けた後、彼がどこからでも始められるように、後の統治のための書類を整理しておくこともできます。'
        - 'バリアント名と日付を照合できる人を送ってください。両方の種類の文章を知っている読者は、歴史のどこに詩節が引用されているかを特定することもできます。'
      points:
        p1: 'ガーリブは山から一枚のシートを取り出し、その最後の行を読むように頼みます。このページは、文章が余白の詩行にぶつかるまでは歴史のように見えます。引用元の出典を包装紙に載せて、フマユーンに続く新聞に独自の取材を提供する。ガーリブは最初の空白のページを開き、第 2 巻の冒頭の行を書きます。'
      outcomes:
        all: '最初の本が発売されると、次の集まりがすでにその横にあります。あなたが去るときに始まりがあり、その下にはたくさんのスペースがあります。'
        p1: '後の統治者たちは現在、独自の集会を持っています。ガーリブは草稿を始めることができ、これからのページは彼が書くことになる。'
      none: '書店員は伝票をたどってガザルを見つけます。後の統治に関する書類は山積みのままであり、第 1 巻に続く完全な続編はありません。'
      not_admitted: '伝票は店に届きましたが、誰もその伝票の持ち主に気づきませんでした。書類は半分開いた帳簿の下に残っています。'
      excerpts:
        p1: '引用元の出典を包装紙に載せて、フマユーンに続く新聞に独自の取材を提供する。ガーリブは最初の空白のページを開き、第 2 巻の冒頭の行を書きます。'
    relic: 'ガザルのページ'
    relic_desc: 'ウルドゥー語の詩のページが彼自身の手で修正されています。'
    points:
      p1: '王が彼に依頼したティムールの歴史の後半に関する情報源を集めて分類し、前半部分以降の研究を継続できるように手伝ってください。'
    points_fail:
      p1: '第1巻が終了しました。歴史と同様に、この支部でも、2 番目の計画は完成原稿にはなりません。'
    shift:
      p1:
        was: '1850年7月4日、バハードゥル・シャーはガーリブにティムール家の歴史を書くよう依頼した。最初の部分である『メヘル・ニムローズ』は 1854 年か 1855 年に出版され、フマユーンの死で終わりますが、彼が計画していた続編は書かれることはありませんでした。'
        now: 'ガーリブには、後の統治のための別のソースノートのセットがあります。第 1 巻を提出した後、彼は第 2 巻を始めるのに十分な資料を手元に持っています。'
        who: 'ghalib_delhi'
        bio: 'この分岐では、ガーリブは第 1 巻が納品された後、第 2 巻の草稿を開始します。'
    vignettes:
      refrain: '書店員は詩のイメージを覚えていて、間違った場所でそれを探し続けます。あなたは彼が繰り返し聞いた言葉を尋ねます。彼はあなたに結末を与え、あなたは印刷された本の中で適切なグループを見つけます。 1 ページの参照を書きます。誰が最初にこの詩を店に持ち込んだのかはまだ謎です。'
      future: 'あなたは書店員に、今後の読者がいくつかの版を比較することになると伝えます。彼は、それが今日必要なラインを見つけるのに役立つかどうか尋ねました。伝票に発行年を追加し、最後に印を付けます。彼が別のコピーと照合する前に、あなたはその場を立ち去りました。'
      listen: '二人が聞いた内容に同意するまで、書店員に結末を繰り返します。彼はその伝票を本の右側に挟み込みました。そのいくつかの言葉を取り戻すことができます。聖句の残りの部分はすでにあなたから消え去っています。'
  banneker_maryland:
    name: '一緒に送る二つの品'
    place: 'メリーランド州'
    figure: 'ベンジャミン・バネカー'
    story: '1791年8月19日、ベンジャミン・バネカーはトーマス・ジェファーソンに手紙を書き、翌年の年鑑の原稿を送り、人種的偏見と奴隷制に異議を唱えた。パッキングテーブルとその2人のヘルパーが想像されます。プレイヤーは手紙とそれに伴う仕事とのつながりを守ることができます。'
    story_prose:
      opening:
        - '印刷業者のメッセンジャーと発信ポストは両方とも玄関先にあります。バナーカーは手紙に工場の名前を書き、年鑑を最後のページまでめくって、手書きのコピーがまだテーブルの上にあることを確認しました。彼は一度だけ送るその手紙で言いたいことがあります。'
        - '1791年8月19日、ベンジャミン・バネカーはトーマス・ジェファーソンに黒人の自由の否定に異議を唱える手紙を記した年鑑を送った。 1806 年の火災により、自宅に保管していたものの多くが焼失しましたが、少なくとも 1 冊の写本誌が生き残りました。この支部では、彼が選んだ論文をさらに多くの場所に残すことができます。'
        - '印刷機のコピーと手書きのコピーをチェックできる旅行者に、両方のパケットに注意してもらいます。コピーリストが追加セットの時間を作ることができる場合は、どのノートをコピーしてもよいかバナーカーに尋ねてください。'
      points:
        p1: 'メッセンジャーは両方のセットを 7 月に回転させ、ほぼ同じ数字の列を見つけます。あなたはバナーカーにジェファーソン宛ての原稿を特定するよう依頼し、郵便配達員に封筒の名前を読み上げるように依頼します。手紙と年鑑は一本の糸で巡ります。プリンターの用紙はカウンターの上に平らに置かれています。郵便配達員は結び目に手を伸ばす前に住所を読みます。'
        p2: '写字生は分厚い袖を持ってきました。 Banneker は数枚のシートを取り出し、確認できる日付の観察と動作を残しました。彼は、修正された図を読み返して、古い数値が計算から除外されていることを確認するように求めます。他の家では、管理人が追加のセットを開いて最初の日付を読み上げます。'
      outcomes:
        all: 'ジェファーソンの返答は両方の項目を認めています。数年後、火災が家に到達したとき、別の場所にあるコピーには、バナーカー氏が共有することに同意した観察結果がまだ残っていた。'
        p1: '手紙と暦は一緒に発行されます。調査書類の多くは家に残されており、彼の所持品の多くと一緒に紛失しています。'
        p2: 'チェックされたセットが家から離れたところに置き去りにされました。送信されたメールに問題があり、旅行者は予備セットに読み取られた日付を持ち帰ってしまいます。'
      none: 'テーブル上に個別にマークされたパケットはありません。読者が参照できるのは、歴史に残った作業メモのみです。'
      not_admitted: '印刷業者は箱を閉める前に名前を確認します。彼は訪問者に気づかず、パケットをバナーカーの家のドアのそばに戻しました。'
      desync: '印刷業者は手紙と一緒に付けられる唯一の暦を集めます。歴史的な囲いが失われており、事務所は旅行者を呼び戻しています。'
      excerpts:
        p1: 'プリンターの用紙はカウンターの上に平らに置かれています。郵便配達員は結び目に手を伸ばす前に住所を読みます。'
        p2: '彼は、修正された図を読み返して、古い数値が計算から除外されていることを確認するように求めます。他の家では、管理人が追加のセットを開いて最初の日付を読み上げます。'
    relic: '包みの宛名札の控え'
    relic_desc: '年鑑と添え状を記した、架空の宛名札の控え。'
    points:
      p1: 'バナーカーが手書きの年鑑を手紙と一緒に送れるように、プリンターのコピーを別に保管してください'
      p2: 'バナーカーにどのワーキングペーパーをコピーしてほしいかを尋ね、チェックセットを家に近づけないように手配する'
    points_fail:
      p1: '印刷業者は、その手紙に使用できる唯一のコピーを受け取ります。支店の同期が失われ、オフィスはその従業員をリコールします。'
      p2: '調査書類のほとんどは家に残されており、家と一緒に燃やされます。'
    shift:
      p1:
        was: '1791年8月19日、バナーカーはジェファーソンに手紙を書き、年鑑の手書きのコピーを同封した。'
      p2:
        was: '1806 年のバナーカーの葬儀の日、火災により彼の家と原稿の多くが焼失しました。'
        now: '{staff} は Banneker にどのノートを他の場所に保管できるかを尋ね、それらをコピーしてくれる印刷業者を見つけます。火災後も、読者は彼の観察と実際の計算のコピーを参照することができます。'
        who: 'banneker_maryland'
        bio: 'バナーカーの他の研究論文のいくつかは、歴史の中に生き残ったジャーナルと並行して別々に生き残っています。'
    vignettes:
      packet: 'レイチェルは最初のページに月が表示されているのを見て、計算書のラベルを貼り始めます。あなたは手紙をその横に置き、住所を読んだ後ラベルを貼り終えるように彼女に頼みます。彼女は 1 本のネクタイを両方の包装紙に通します。テーブルは送信者の名前で送信され、その引数も添付されたままになります。'
      handoff: 'アイザックのかばんにはフラットパケットが 1 つ入るスペースがあります。手紙のワックスはまだ柔らかいです。手紙がテーブルにくっつかないように、折り畳まれたガードの中に彼が滑り込む間、あなたは包装紙を開いたままにします。彼は両方を連れて去ります。あなたは、テーブルの上にパケットが残された空の広場を眺めるのに十分な時間滞在します。'
      reply: 'すぐに返信が来ることがわかります。アイザックは、手紙が提起したことはそれで解決するのかどうか尋ねます。送信パケットの日付をコピーし、見つけた返信用のスペースを残しておきます。パケットは配送中です。扉を通って戻ってくる約束はありません。'
  mitchell_nantucket:
    name: '雲が来る前に星野を記す'
    place: 'ナンタケット島'
    figure: 'マリア・ミッチェル'
    story: '『マリア・ミッチェル: 人生、手紙、日記』に転載された手紙には、ミッチェルが 1847 年 10 月 1 日にナンタケット島で望遠鏡彗星を発見したことが報告されています。彼女の父親はこの発見に注目し、本土への最初の郵便でハーバード大学天文台の所長に手紙を書きました。'
    story_prose:
      opening:
        - '突風がナンタケット島の屋上を横切ります。マリア・ミッチェルはメモをランプの下に滑り込ませて動かさないようにします。彼女は、物体がどこに何時にあったかを記録することを意味しています。彼女の父親は数字を聞くために下の階で待っています。天候の影響で郵便船は出航できません。'
        - 'ミッチェルは 1847 年 10 月 1 日に彗星を発見しました。ミッチェルの父親はケンブリッジのウィリアム・ボンドに手紙を書きました。デンマークのメダルは、この主張についてのやり取りの後、後に授与された。ここでは、送信メールで最初の通知を受け取り、賞品に指定された受信者に 2 番目の通知を送信できます。'
        - '空図を読んだり時間をチェックしたりする人が通知を手伝ってくれます。郵便に詳しい人に 2 つのアドレスを調整してもらいます。'
      points:
        p1: 'マリアは時を読み、父親はどの明るい星をガイドとして使用したかを尋ねます。あなたは彼に送った立場を読み返してみると、ボンドへの通知には日付がまだ欠けていることがわかります。インクがほとんど乾いていないとき、埠頭で郵便を求める声が聞こえました。郵便配達員が最初の手紙を袋に入れる頃には日付が判読できるようになる。'
        p2: '2ページ目も同じ観察時間です。封筒には別の住所が必要です。あなたがルールを声に出して読み上げると、郵便配達員が指名した受取人に対して別のエントリを作成します。マリアは観察を終える前に彼が終わるのを待ちます。2通の手紙が島を出て、大西洋を渡るのは1通だけだ。'
      outcomes:
        all: 'デンマーク人の受取人は、公開された手順に従った通知を受け取ります。裁定が検討されると、ミッチェルは後の控訴の代わりに日付の入った発送記録を提出することができます。'
        p1: 'ケンブリッジは最初の郵便で運ばれた通知を受け取ります。メダルには依然として独自の対応が必要です。'
        p2: '2番目のアドレスが確認されました。ケンブリッジへの最初の投稿が失敗したため、ブランチを無傷のままにしておくことができません。'
      none: '屋上のメモは家の中に残ります。未郵送の通知は、賞委員会にこれまでのところ何も与えていない。'
      not_admitted: '家族が階下から誰が来たのか尋ねます。郵便配達員が通りを通る音が聞こえる間、メモは屋根の上に残ります。'
      desync: 'ボンドの手紙は最初の郵便物に届かない。旅行が同期しなくなった場合、オフィスは旅行者を呼び戻します。オリジナルの観察記録はまだ家にあります。'
      excerpts:
        p1: 'インクがほとんど乾いていないとき、埠頭で郵便を求める声が聞こえました。郵便配達員が最初の手紙を袋に入れる頃には日付が判読できるようになる。'
        p2: 'マリアは観察を終える前に彼が終わるのを待ちます。2通の手紙が島を出て、大西洋を渡るのは1通だけだ。'
    relic: '小さな望遠鏡'
    relic_desc: '管に海塩の跡がついた小さな真鍮の望遠鏡。'
    points:
      p1: 'ケンブリッジ天文台への最初の郵便に備えて、家族からの日付入りの通知を準備しておきます'
      p2: '最初のボートで指定されたデンマーク人受取人に2回目の通知を送り、ミッチェルにその後のメダルアピールを行わせないでください'
    points_fail:
      p1: '観察は家族の日記に残っていますが、通知には最初のメールがありません。同期が途絶えたため、オフィスはその従業員を呼び戻した。'
      p2: '天文台のみが通知を受けます。指定された受賞者に通知されなかったため、審査員は通常の規則に従ってメダルを授与することができない。'
    shift:
      p1:
        was: '1847年10月3日、ミッチェルの父親は1日の発見についてケンブリッジ天文台に手紙を書いた。彼の手紙は目撃後の最初のメールに残されました。'
      p2:
        was: '1848年の賞品に関する通信には、必要な即時通知が指定された受取人に届かなかったことが記録されている。ミッチェルさんの主張はデンマーク政府に取り上げられ、後にメダルを受け取った。'
        now: '{staff} はルールを確認し、家族が同じボートに別の通知を載せるのを手伝います。通知は適切なルートを通じて到着したため、裁判官は通常の規則に従って申し立てを検討することができます。'
        who: 'mitchell_nantucket'
        bio: 'ミッチェルはタイムリーな報告を行った功績が認められました。彼女は、物体を見たとき、通知を送信したとき、誰がそれを受け取ったのかを記録し始めました。'
    vignettes:
      field: 'ヘルパーが自分でかすかな点を描画しました。あなたは、彼が楽器をそこに戻すために何を使うだろうかと尋ねます。雲がやってくる前に、星 2 つと方向を追加します。あなたはそれらのマークをコピーします。比較する後のポジションがまだありません。'
      post: '連絡が島の外に出なければならないことはわかっています。ヘルパーは、見たものを説明する前に発見を記録したいと考えています。日付とフィールドを別の伝票に記入し、確認のために次の行を残します。パケットが岸に着くと、空白のままになります。'
      cloud: '雲がかすかなマークを覆う間、あなたは絵を手に持って待ちます。折り畳む前に、たとえかすかな物体が消えてしまったとしても、見つけられるであろう星を囲みます。再び追求できるポジションを取り戻します。あなたが戻ってくるまで、誰もそれを二度見ることはありません。'
  caroline_herschel_slough:
    name: '空をくまなく探した人'
    place: 'スラウ'
    figure: 'カロライン・ハーシェル'
    story: 'カロライン・ハーシェルは、1786 年 8 月 1 日に、はっきりとした星とは異なる天体に気づいたと報告しました。彼女は、チャールズ・ブラグデンに手紙を書く前に観察結果を比較しました。'
    story_prose:
      opening:
        - 'スラウで暗くなった後、カロライン・ハーシェルは助手にランプを動かすように頼みます。彼女が今描いたオブジェクトは端がぼやけていますが、近くの明るい星ははっきりしています。明日再びそれを見つけるには、暗闇の中でも読める絵が必要になるでしょう。'
        - '歴史では、ハーシェルは 1786 年 8 月 1 日と 2 日の観察を比較し、チャールズ ブラグデンに図面を送りました。彼女は後に兄を手伝い、兄が望遠鏡にいるときに測定を行ったことで報酬を受け取った。この支店では、彼女は自分自身の定期的な夜をリクエストすることができます。'
        - '時計を読んで図を照合できる人が、使いやすいペアを作るのを手伝ってくれます。交渉できる人は、彼女の今後のスケジュールをレポートに添えて持ち運べます。'
      points:
        p1: '最初の図には点が 3 つあります。アシスタントは 2 枚目のシートを間違った方向に回転させます。あなたはハーシェルに、同じ参照星から始めて、順番に各点を指すように依頼します。どちらのシートも余裕のあるタイムを獲得します。彼女はそれらをランプのそばに置き、位置の変化を自分で記録します。彼女がそれらを折りたたむとき、彼女は最初の夜の時間を外側に保ちます。'
        p2: '報告書を受け取る人は、図面を書くためのスペースを確保しました。あなたはハーシェルに、大きな望遠鏡で測定を行った後、彼女が一晩どのくらい残っているかを確認できるように、カレンダーを横に置くように頼みます。彼女は 2 つの空白スペースに自分の名前を書き、2 種類の作品を別々に記載するよう求めています。次のカレンダーでは、彼女は事前に自分の夜を丸で囲むことができます。'
      outcomes:
        all: '報告書には図面と彼女の時間要求の両方が保存されています。アシスタントのルーチンが設定されると、いくつかの夜は彼女が選択した観察のために予約されます。'
        p1: '手紙には比較と図が載せられている。彼女は今でも、兄の仕事を記録する夜には自分の望遠鏡を取り付けます。'
        p2: '提案されたスケジュールは家から出ました。最初の夜から十分な参照星がないため、この旅行で維持できる唯一の変更はリクエストです。'
      none: '両方の図面は並んでいますが、比較するには参考文献が少なすぎます。スケジュールはそのままです。'
      not_admitted: 'ヘルパーは訪問者に、はしごを空けておくように頼みます。ランプはその日陰の下に戻り、旅行者はその下に留まります。'
      desync: 'ヘイズは最初の夜に基準星を台無しにしてしまいました。 2 番目の図面と照合できない場合、事務局は旅行者をリコールします。'
      excerpts:
        p1: '彼女はそれらをランプのそばに置き、位置の変化を自分で記録します。彼女がそれらを折りたたむとき、彼女は最初の夜の時間を外側に保ちます。'
        p2: '彼女は 2 つの空白スペースに自分の名前を書き、2 種類の作品を別々に記載するよう求めています。次のカレンダーでは、彼女は事前に自分の夜を丸で囲むことができます。'
    relic: '観測範囲を記す定規'
    relic_desc: '星図上の掃引されたパッチをマークするために使用される、目盛り付きの木製の定規。'
    points:
      p1: 'ハーシェルが 2 つの夜の間に物体が移動したことを示すことができるように、両方の図面に基準星と時間をマークします。'
      p2: 'ハーシェルの最初の彗星報告を利用して、彼女自身の観測のために定期的な夜を確保する'
    points_fail:
      p1: 'ヘイズが低いと、最初の図面に残る明確な基準点が少なすぎます。 2 番目の図面ではこの支店で動議を確立することができず、事務所はその従業員をリコールします。'
      p2: '彼女の兄が大きな望遠鏡を使うとき、彼女は夜をかけて彼の測定値を書き留めており、彼女自身の観測結果は依然として彼のものと一致しています。'
    shift:
      p1:
        was: '1786 年 8 月 1 日と 2 日、キャロライン ハーシェルは彗星の疑いのある動きを記録し、観察結果と図面を送信しました。'
      p2:
        was: '1787年、カロライン・ハーシェルは兄の助手として給料を受け取りました。彼女は最初のレポートで、その作業によって観察時間がどのように制限されるかをすでに説明していました。'
        now: '{staff} は、ハーシェルが彗星のレポートの横に観測スケジュールを置き、その両方を支援者の前に置くのに役立ちます。その後の仕事の取り決めでは、月に数回の夜を彼女自身の観察のために確保しています。'
        who: 'caroline_herschel_slough'
        bio: '有給のアシスタントとして、ハーシェルさんは定期的に夜を自分の仕事に割り当てられ、事前に彗星の探索を計画することができました。'
    vignettes:
      fixed: 'ぼやけたオブジェクトを追加する前に、2 つの明るい隣りにマークを付けます。 2 番目の図では、ページが移動した後でも、星は有用なガイドとして残ります。'
      doubt: 'ヘルパーはガラスを掃除することを提案します。あなたはそれを通して他の星がどのように見えるかを尋ねます。それらは鋭さを保ち、ヘルパーはシートに不確かなマークを残します。'
      lamp: 'ヘルパーが時間を書いている間、あなたはランプの影を作ります。表紙が戻っても、どちらの絵もまだ横に時間があります。'
  kovalevskaya_stockholm:
    name: '最初のページの前提条件'
    place: 'ストックホルム'
    figure: 'ソフィア・コワレフスカヤ'
    story: '固定点の周りの回転に関するコバレフスカヤの論文は、1889 年に Acta Mathematica に掲載されました。この研究では、慣性モーメントと質量中心の位置に関する特定の条件を伴う可積分な場合が特定されています。'
    story_prose:
      opening:
        - 'ストックホルムでは、校正者がバラしたページに真鍮のトップをセットしました。コバレフスカヤは彼に作業用のコピーを渡した。改訂された回想録は机の向こう側にあります。どちらの最初のページにも回転体について言及されていますが、見出しだけでは何が変わったのかわかりません。'
        - 'この作品により、コバレフスカヤは 1888 年にボルディン賞を受賞しました。回想録は 1889 年に出版され、ストックホルム市が彼女に常任議長を与えた年でした。その仮定をジャーナルパケットに保存し、予定日の事前の書面による確認を求めることができます。'
        - 'シンボルと図を照合できる人にパケットをチェックしてもらいます。パリからの知らせが届いたら、彼女の授業スケジュールのコピーを添えた書面による返答を入手できる人を送ってください。'
      points:
        p1: '校正者はコマの先端を指差し、それが重心でもあるのかどうか尋ねます。 2 つの点を描画し、最初のページで修正された点を見つけてもらい、もう 1 つの点についての条件に戻ります。コバレフスカヤは両方のシートの記号をチェックし、どのページがパケットに含まれるかを教えてくれます。校正者はトップを維持し、製本されたコピーの最初のページに再び条件が設定されます。'
        p2: '事務員はパリからのニュースを脇に置いて、すでにリストされているクラスを誰が教えるのか尋ねます。二人は彼女の時間割を読み、彼女が準備しなければならない最初のクラスを見つけます。彼はリストを持ち去り、約束の日付を記した手紙を持って戻ってきました。彼女はそれを次の学期の授業の最初の週にクリップしました。'
      outcomes:
        all: 'ジャーナルは回想録とともに条件を受け取り、大学は日付を確認します。彼女は研究のために確保していた時間を埋めます。'
        p1: '正しい最初のページが用紙に付属します。書面による確認がまだ保留中であるため、彼女はとにかく授業のスケジュールを立てなければなりません。'
        p2: '彼女は開始日が記載された手紙を持っています。日記の小包は失敗し、旅行には事務員が彼女に返事を渡すシーンだけが保存されます。'
      none: '両方の杭は上部の下に残ります。旅行者が指導スケジュールに目を向けると、開始日はまだ空白です。'
      not_admitted: '校正者は自分のページを集め、著者が訪問者を特定するまで待つと言いました。外で旅行者は真鍮の天板が机を叩く音を聞きました。'
      desync: '条件のない古い最初のページはジャーナル パケットに入ります。歴史的な出版物はもはや一致しないため、事務所は旅行者を呼び戻します。'
      excerpts:
        p1: 'コバレフスカヤは両方のシートの記号をチェックし、どのページがパケットに含まれるかを教えてくれます。校正者はトップを維持し、製本されたコピーの最初のページに再び条件が設定されます。'
        p2: '彼はリストを持ち去り、約束の日付を記した手紙を持って戻ってきました。彼女はそれを次の学期の授業の最初の週にクリップしました。'
    relic: '模型のこま'
    relic_desc: '軸に数字が刻まれた真鍮の独楽。'
    points:
      p1: 'ストックホルムの作業コピーと改訂された回想録を照合してください。以前の草稿はジャーナル用のパケットに入れないでください'
      p2: 'パリからのニュースと彼女の教職リストをストックホルム大学に届けてください。新しい約束がいつ始まるかを尋ね、それを書面で受け取ります'
    points_fail:
      p1: '古いドラフトは、最初のページに条件が欠落した状態でジャーナル パケットに入ります。パブリケーションの同期が失われると、オフィスは {staff} に折り返し電話します。'
      p2: 'その知らせが大学に届きました。彼女はまだ書面による開始日がないまま次の学期の計画を立てなければなりません。'
    shift:
      p1:
        was: 'パリ・アカデミーは 1888 年 12 月にコバレフスカヤの作品に対してボルダン賞を発表しました。彼女の拡張回想録は 1889 年に『Acta Mathematica』に掲載されました。'
      p2:
        was: '彼女は 1889 年にストックホルムの正教授になりました。'
        now: 'この部門では、大学は彼女が次の学期の教育と研究を計画できるよう、十分早めに書面で開始日を確認します。'
        who: 'kovalevskaya_stockholm'
        bio: 'コバレフスカヤはストックホルムで剛体の回転を教え、研究しました。国際賞と彼女の現地の労働条件は異なる機関によって決定されました。'
    vignettes:
      conditions: '練習用紙の速記には「回転体」と書かれています。最初のページを使用して、2 つの条件 (慣性と重心の位置) を復元します。校正者は両方を伝票にコピーします。修正を削除することはできますが、雑誌の発行はまだ先のことです。'
      diagram: '校正者はおもちゃのコマを試してみたいと考えています。固定された点をスケッチし、重心を表す別の点をマークします。彼は次のコピーでどれがどれであるかを指摘することができます。時間が来てもおもちゃはまだ回転しますが、それが証明されたわけではありません。'
      clip: '仮定を演習の外側に置き、ゆるい図を演習の中に組み込みます。次の読者は結果の前の状態を確認します。コマの輪郭を家に持ち帰り、校正刷りを机の上に置きます。'
  heron_alexandria:
    name: '一行のそばの図'
    place: 'アレクサンドリア'
    figure: 'アレクサンドリアのヘロン'
    story: 'Hero’s Mechanics では、重い荷物を持ち上げたり移動したりするための機械について説明します。原文のギリシャ語の断片は、完全なアラビア語訳とともに残されています。彼の工房への訪問は、彼の活動のおおよその日付である西暦 62 年頃に設定されています。'
    story_prose:
      opening:
        - '西暦 62 年頃のアレクサンドリア。ギリシャ語で書かれた「Hero''s Mechanics」では、重い荷物の移動に装置がどのように役立つかを説明しています。'
        - '歴史上、ギリシャ語は断片としてのみ残されていますが、完全な作品はアラビア語の翻訳で残されています。このブランチでは、コピーが図のチェックを待っており、誰かがそれを別に保存したいと考えています。'
        - '図とその言葉を照合できる人が助けてくれるでしょう。また、本を手配できる人が交代する必要もあります。'
      points:
        p1: '{staff} はコピーを最も明るい場所のスツールに移動し、Hero に同じ長さで描かれた 2 本の線を見るように依頼します。 1 つは別のページで読む必要があります。写し屋は原本からマークを転写し、写しを取る人に自分でその場所を見つけるよう依頼します。リーダーはロールを戸口まで持っていき、その後再び開きます。修正されたマークに到達すると、そこに指を置きます。'
      outcomes:
        all: '2本目のロールは工房の棚に戻ることはありません。いつ借りても、同じマークが読者をそのページに誘導することができます。'
        p1: '読者は立ち去る前にコピーを別々に結びます。古いロールは作業場に保管されます。修正されたものはドアから出ます。'
      none: 'コピーは古いロールの中に残ります。ドアが閉まる前に、ドアを取りに来た誰かが手を引っ込める。'
      not_admitted: '{staff} は決してワークショップに入ることはありません。誰かが光の中にスツールを引っ張る音が聞こえます。'
      excerpts:
        p1: 'リーダーはロールを戸口まで持っていき、その後再び開きます。修正されたマークに到達すると、そこに指を置きます。'
    relic: '模型の戸口に付いた跡'
    relic_desc: '架空のワークショップモデルの一部で、ドアがこすれた箇所に傷があります。'
    points:
      p1: 'ヒーローが力学書のギリシャ版の図をチェックし、そのコピーをワークショップ独自のロールとは別に保管するよう手配するのを手伝ってください。'
    points_fail:
      p1: '工房では独自のロールを保管しています。この部門では、歴史と同様に、ギリシャ語本文の断片のみが残っており、アラビア語翻訳によって完全な作品が保存されています。'
    shift:
      p1:
        was: '英雄は西暦 1 世紀にギリシャ語で『力学』を書きました。ギリシャ語文書の断片だけが残っています。クシュター・イブン・ルカーのアラビア語翻訳により、全作品が保存されています。'
        now: 'ギリシャ語本文とその図のチェック済みコピーは、作業場から離れた場所に保管されています。このブランチでは、そのコピーが後の読者に届きます。'
        who: 'heron_alexandria'
        bio: 'この支部には、ギリシャ語の『力学』の完全なコピーが、アラビア語の伝統と並んで生き残っています。'
    vignettes:
      threshold: 'ニカノールはミニチュアのドアをベンチに取り付け、戻りは指の幅ほどの短さで止まります。擦れる箇所に印を付けておきます。平らなレンズ豆の殻がモデルの下に引っかかっています。彼はそれを払いのけます。ドアが閉まると、再びその場所を見つけることができるように、跡を残してほしいと頼まれます。'
      audience: 'ベレニケーさんは、ドアを開けてマントに手を伸ばすブランコをすでに見ています。あなたは彼女に、もう 1 カウントの間、端を監視するように頼みます。それが戻ってきたとき、彼女はニカノールが見逃した一筋の光を見つけます。彼はモデルを送り出す代わりに、2回目のトライアルのためにベンチに置いておきます。'
      future: 'ニカノールさんを見れば、読者がこれらのページを機械の写真の横に置くことがいかに遠いかがわかります。彼は戸口がかすかにクリック音を立てて落ち着くのを眺めています。あなたも彼と一緒に聞いてください。あなたが帰るとき、彼は顧客に電話をかけ直して、彼女が見逃した 1 つの動作を確認します。'
  pliny_stabiae:
    name: 'スタビアエの風'
    place: 'スタビアエ'
    figure: '大プリニウス'
    story: '小プリニウスは後にタキトゥスに、西暦 79 年の噴火中に叔父がスタビアエのポンポニアヌスに到達したことについて手紙を書きました。彼を運んできた風のため、荷物を積んだ船が出航できなかった。'
    story_prose:
      opening:
        - '西暦 79 年、湾の上に雲が立ち上りました。小プリニウスは後にタキトゥスに、叔父が助けを求める嘆願を受けて船で出かけたと語った。'
        - '歴史上、大プリニウスはスタビアエのポンポニアヌスに到着しましたが、岸から生きて戻ってくることはありませんでした。この分岐では、船はレクティナが助けを求めた海岸の一部に近づくことができます。プリニウスをビーチから遠ざけることも可能かもしれない。'
        - '海岸と船でそこに到達する方法を知っている人が必要です。上陸したら、適切な装備を持参し、呼吸困難に陥っている男性を助けることができる人が必要です。'
      points:
        p3: '{staff} は海岸にいる長老プリニウスに到着し、防護具を持ち出し、周囲の人々に道を空けるように頼みます。足が灰を強く押しつけています。グループは一度立ち止まり、彼の息を待ってから再び動き始めます。座れるようになると、仲間の肩に落ちた石を払い落とします。岸辺の船はまだ騒音を立てている。'
        p2: '甲板上の何人かが向きを変えようとしている。 {staff} は、ポンポニアヌスがどこに住んでいるのか誰が知っているか尋ね、その人に海岸が見える場所に立ってもらいます。船は彼らが降りられる場所に到着しました。ポンポニアヌスが彼に会いに来ると、長老プリニウスはまだ長いロープを持っています。彼は地面に足を踏み入れる前に、それを船に戻しました。'
        p1: '{staff} は浅瀬のどの部分にまだ近づくことができるかを尋ね、乗組員がレクティナに掴み取れる場所を残すのを手伝います。彼女は最初に持っているものを放棄し、誰かがしっかりとそれを握る前に手放します。彼らが彼女を船に乗せると、彼女は彼らが彼女のために空けた場所に濡れた手で押し付けました。彼女が渡したものを誰かが拾う。'
      outcomes:
        all: '彼らが岸を離れた後、誰かがレクティナが手渡したものをどこか乾いた場所に置きます。大プリニウスは反対側で休んでいます。ようやくボートを渡れるスペースができました。'
        p3: '乗組員はプリニウスを乾いたコーナーで残して帰ります。彼を座らせるのを手伝っている人は、彼が自分の手を下げるまで待ちます。'
        p2: 'プリニウスはポンポニアヌスの家に到着します。持ち込んだ石が玄関の前で靴から落ちてしまう。'
        p1: '乗り込むと、レクティナは許可された場所に留まります。彼女は濡れた服を着替える前に荷物を取り戻します。'
      none: '係留所からは、海岸のさらに先は見えなくなります。水の中にいる人々は、次の連絡を待っています。'
      not_admitted: '{staff}は決して乗らない。岸辺で誰かが糸を引っ張ると、船首はゆっくりと向きを変えます。'
      desync: '船はスタビアエに到着しません。代理店が{staff}に折り返し電話したとき、ポンポニアヌスはプリニウスに会っていなかった。'
      excerpts:
        p3: '座れるようになると、仲間の肩に落ちた石を払い落とします。岸辺の船はまだ騒音を立てている。'
        p2: 'ポンポニアヌスが彼に会いに来ると、長老プリニウスはまだ長いロープを持っています。彼は地面に足を踏み入れる前に、それを船に戻しました。'
        p1: '彼らが彼女を船に乗せると、彼女は彼らが彼女のために空けた場所に濡れた手で押し付けました。彼女が渡したものを誰かが拾う。'
    relic: '蝋板'
    relic_desc: 'メモ用のワックスを塗り、スタイラスで傷を付けた木製のタブレット。'
    points:
      p1: '浅瀬と山からの瓦礫が岸を塞いでいるときは、長老プリニウスが船をレクティナの海岸に運び、彼女を乗せるのを手伝ってください。'
      p2: '落ちてくる軽石と石の下で、長老プリニウスの船をスタビアエへの航路に保ち、上陸してポンポニアヌスに到着します。'
      p3: 'スタビアエの海岸に硫黄の匂いと砂埃が迫ってきたら、呼吸を整えて長老プリニウスを救い、生きたまま岸から引き上げましょう。'
    points_fail:
      p1: '船は彼女の岸に入ることができず、この支流ではレクティナを乗せた者は誰もいなかった。'
      p2: 'スタビアエとプリニウスがポンポニアヌスに到着する前に船は引き返した。同支店は歴史から切り離され、事務所は従業員を召還した。'
      p3: '歴史にあるように、彼はスタビアエの浜辺に落ち、この枝でも彼を留めておくことはできなかった。'
    shift:
      p1:
        was: '西暦 79 年、レクティナのメッセージにより、長老プリニウスは救助のために出航しました。彼の甥は遮られた海岸とスタビアエへの航路について説明しているが、レクティナがどうなったかについては述べていない。'
        now: '船が彼女の岸に到着し、レクティナは乗船した。彼女は船でスタビアエに向かった。'
      p2:
        was: '小プリニウスは後にタキトゥスに、叔父が追い風でスタビアエのポンポニアヌスに到着したと語った。その風が船の出航を阻んだのと同じだった。'
      p3:
        was: '翌日、硫黄の匂いと炎が近づいてきたとき、大プリニウスは二人の奴隷に支えられてスタビアエの浜辺に立ち、倒れた。彼の甥は、埃を含んだ空気が呼吸を妨げたと書いている。彼の遺体は2日後に発見された。'
        now: '{staff} は彼の呼吸から粉塵を防ぎ、彼をビーチから連れ出しました。風向きが変わると彼は船でミセヌムに戻り、さらに数年生きた。'
        who: 'pliny_stabiae'
        bio: 'この線で、大プリニウスはスタビアエの海岸から生きて戻ってきました。彼はミセヌムの艦隊に戻り、数年間生きました。'
    vignettes:
      wind: 'クリスパスは、ロードされたすべてのチェストをなくなったとマークしました。出入り口からは、荷物を積んだボートが見える中、最初の新参者が肩に灰を背負って入ってくるのが見えます。クリスパスは「消えた」という単語を取り消し線で消します。彼は、ドア越しに次の名前を入力するためにタブレット上のスペースを空けるように頼みます。'
      lantern: 'プリマにはランプが消えるまでに部屋を一周する時間があります。彼女がまだ見える人々に呼びかけている間、あなたは彼女の代わりに戸口のそばにいます。ワックスタブレットが最初に暗くなります。彼女は最後の 2 つの名前を声に出して繰り返し、あなたはそれぞれに答えます。'
      letter: 'あなたは数年後に送られる手紙を覚えています。プリマはリストを運んだ男のことを尋ねているが、その名前はそこには決して登場しない。あなたは翌朝のことを脇に置き、彼女がロールを終えるのを手伝います。訪問が終わっても、廊下から誰かがやってくる音が聞こえます。'
  galen_rome:
    name: '火事のあとに残った書名'
    place: 'ローマ'
    figure: 'ガレノス'
    story: 'ガレノスは、『遭難の回避について』の中で、192 年のローマ火災で本やその他の所有物を失ったことについて述べています。彼は、紛失した本と、もう取り戻すことができないと信じていた著作物を区別しています。'
    story_prose:
      opening:
        - 'ローマ、192 年。ガレノスはいくつかの巻物をカンパニアに送り、書籍や物品をローマの倉庫に残しました。その後、『苦痛の回避について』の中で、彼はそれらのことを別々に思い出しています。'
        - '歴史上、火災は彼が決して取り替えることができないと思っていた作品を含む書籍を焼失させた。このブランチでは、1 つのロードが早く行われます。リストが閉じられる前に、誰かが一緒にリストを確認することができます。'
        - 'どの本にどのような負荷がかかるかを知っている人が助けてくれます。また、誰かが職人に、どの楽器を記憶から作り直すことができ、どの楽器が作れないかを尋ねる必要もあります。'
      points:
        p3: '{staff} はローマの店舗リストでコメディ用語集を見つけ、ガレンにその目的地をもう一度調べるように頼みます。ガレンはよく相談する場所にそれを開き、初期の荷物を積み込んでいる人にカンパニア行きの本と一緒に置くように言いました。蓋をかぶせるとき、ゲイレンはネクタイが下に引っかからないように後ろに手を伸ばしてネクタイを上に向けます。'
        p2: '店はまだすべての楽器を引き取っていません。 {staff} は、リメイクするのが最も難しい職人に質問し、作業台で 2 番目のモデルを準備させます。ワックスが固まるのを待って、下側に印を付けます。誰かがベンチを片付けに来るとき、彼は模型を手に持ったままにします。 2 つ目は引き出しの奥にあります。'
        p1: '{staff} は 2 つのマニフェストを分離し、初期の荷物を積み込む担当者にカンパニア向けのマニフェストを読み戻させます。ローマの山に置かれそうになったロール紙を誰かが持ち上げた。ガレンに確認した後、先に出発する積荷に移動させます。結び付ける前に、ローダーは宛先を再度先頭に書き込みます。誰かがコードの緩んだ端を角に巻き付けます。'
      outcomes:
        all: '早期に発送された書籍は、必要なときに引き続き利用できます。誰かがラベルを追ってコメディ用語集を調べ、作業場には予備のモデルがまだそこにあります。'
        p3: '原稿はネクタイを上に向けて火の前に進みます。負荷を分解しなくても、後から見れば誰でもそれを認識できます。'
        p2: '再び楽器を作る前に、職人は自分の引き出しを開けてモデルを取り出します。'
        p1: '早めに行くようにマークされたロールが最初に出発します。ローマ店のリストは残っています。'
      none: '初期の出荷分はすでに積み込まれています。見逃したロールは以前と同じように片付けられます。'
      not_admitted: '{staff} はロードしている人に会うことはありません。荷物を運ぶ足音が店のドアの向こうに遠ざかっていく。'
      desync: '初期のロールはローマ在庫でファイルされます。代理店が {staff} に折り返し電話したとき、誤入力のインクはまだ濡れています。'
      excerpts:
        p3: '蓋をかぶせるとき、ゲイレンはネクタイが下に引っかからないように後ろに手を伸ばしてネクタイを上に向けます。'
        p2: '誰かがベンチを片付けに来るとき、彼は模型を手に持ったままにします。 2 つ目は引き出しの奥にあります。'
        p1: '結び付ける前に、ローダーは宛先を再度先頭に書き込みます。誰かがコードの緩んだ端を角に巻き付けます。'
    relic: '蔵書目録の一葉'
    relic_desc: '1 つの生き残ったタイトルと空のコピー列を含む架空の目録。'
    points:
      p1: 'すでにカンパニアに送られる予定だった散文用語集のロールを早期に出荷するためのスペースを確保する'
      p2: '楽器を保管する前に、職人に交換が難しい楽器の 2 つ目のワックスモデルを作成してもらい、工房に保管してください。'
      p3: 'ガレノスを説得して、古い喜劇の用語集を積み込む前にローマから早めの荷物と一緒に発送するよう説得する'
    points_fail:
      p1: 'ロールはローマのストックでファイルされ、カンパニアに到達する代わりに燃やされます。支店の同期が失われ、オフィスはその従業員をリコールします。'
      p2: '職人が再び楽器を作らなければならないときに参考になるモデルがありません。'
      p3: '原稿は夏の出荷を待って倉庫に保管されており、火事が起こってもまだそこにあります。'
    shift:
      p1:
        was: '西暦 192 年の冬の終わりにローマで火災が発生したとき、ガレノスは自分の散文用語集がすでにカンパニアに行ったと述べました。'
      p2:
        was: '西暦 192 年の火災により、ガレノスがローマに保管していた器具が、彼が設計した器具も含めて焼失しました。'
        now: '2 番目の蝋人形が工房に残されています。火災の後、ガレンはそれを使って楽器を再び作ることができます。'
      p3:
        was: '西暦 192 年の冬の終わり、ローマの火事でガレノスの古喜劇用語集が焼失しました。'
        now: '{staff} はロールを初期出荷に取り込み、ガレノス は火災後にコピーからテキストの改訂を続けることができます。別のコピーは後にローマ郊外のコレクションに届きます。'
        who: 'galen_rome'
        bio: 'ゲイレンは、火災後に彼の古いコメディ用語集のコピーを残していました。彼は引用文をチェックし続け、別の場所の読者のために別のコピーを寄託しました。'
    vignettes:
      list: 'テルティアはリストから 3 人の名前を呼び、本を 3 冊数えます。あなたは彼女に、付属の本に触れるよう頼みます。 2つあります。一緒に、3 番目のタイトルを読める状態にして、コピー欄に空のマークを入れます。'
      borrow: 'ディオンはコピーを貸したことを覚えていますが、受取人の名前は言えません。テルティアはリストが消える前にタイトルを獲得したいと考えています。あなたは彼がそれを渡した戸口を思い出すのを手伝います。彼女は、その通りからの返信のためにリストの 1 か所を空けておきます。'
      survival: 'あなたは、まさにこの損失についての著作を読んだことがありますが、そのコピーは火災からかなり経ってから再び現れることになります。ディオンは明日の机にどのタイトルを載せられるか尋ねます。あなたは目録に名前を残して、実際の 2 冊の本を彼に見せました。行方不明者は出発時に見つかりませんでした。'
  ovid_tomis:
    name: '詩と空白の一行'
    place: 'トミス'
    figure: 'オウィディウス'
    story: 'トリスティアの第 2 巻で、オウィディウスは自分の犯罪行為を詩と誤りとして説明し、後者については説明を拒否しています。イベントの年により、亡命中の訪問が設定されます。'
    story_prose:
      opening:
        - 'オウィディウスは黒海のトミスに亡命しています。 『トリスティア』の第 2 巻で、彼は詩と誤りのせいで罰を受けたと述べています。彼は何が間違いだったかについては語っていない。'
        - '歴史上、3冊目の本には、病気で横たわっていることについての詩が保存されています。この支部では、水さえ飲むのが難しい日があり、小姓を運んでくれる旅人がまだ見つかっていません。'
        - 'この旅行には患者の世話をしてくれる人が必要です。また、交差点を理解し、旅行者に荷物を渡せる場所を尋ねることができる人も必要です。'
      points:
        p2: '{staff} は冬道に詳しい旅行者を見つけ、パケットが次の運送業者にどこに送られるかを尋ね、オヴィッドに受信者の名前を読める場所に記入させました。トラベラーは内側と外側の包装紙を別々に平らにします。船を降りる前に、彼は岸にいる人々にもう一度確認するために住所を渡しました。オウィディウスはボートの横でうなずいた。'
        p1: '{staff} は、オウィディウスがまだ食べられる食べ物は何かと尋ね、近くにそれを少し見つけて、ベッドのそばに水を置きました。 オウィディウス がドラフトに手を伸ばすと、{staff} がカップを近づけます。彼は最初に飲み、少し遅れてページを受け取ります。それを横切るカップの影が小さな隅に縮小します。'
      outcomes:
        all: 'ページを持った旅人は港を出ました。誰かがもう一度ベッドの横の水を交換し、オウィディウスは別のシーツを取り出します。'
        p2: '海岸で旅行者はオヴィッドに荷物の行き先を正確に伝えます。オウィディウスは最後の停留所を聞きます。'
        p1: '今では、静かに横たわることができるストレッチがいくつかあります。彼のカップが空になる前に、いつも追加の水が運ばれてきます。'
      none: 'ボートは港の保護された側に留まります。旅行者を待っている荷物はテーブルの隅に置かれています。'
      not_admitted: '{staff} は、それらを侵入させることができる人には決して会いません。ドアに残された水に葉が落ちます。'
      desync: '誰も詩を持ち歩かないでしょう。代理店が {staff} にコールバックしても、アドレスは依然としてパケットの周囲にあります。'
      excerpts:
        p2: '船を降りる前に、彼は岸にいる人々にもう一度確認するために住所を渡しました。オウィディウスはボートの横でうなずいた。'
        p1: '彼は最初に飲み、少し遅れてページを受け取ります。それを横切るカップの影が小さな隅に縮小します。'
    relic: '文字を書くための蝋板'
    relic_desc: '詩の文字板が亡命への道を歩み始めた。'
    points:
      p1: 'トミスで病気に陥った看護師オウィディウス。医者もいない、適した食べ物も飲めない、水も飲めない。'
      p2: 'トミスからの冬の旅行が難しい場合は、ローマ行きの運送業者でトリスティアの 3 冊目の場所を確保してください'
    points_fail:
      p1: '彼は病気で横たわっており、彼を和らげてくれる人は誰もいません、そしてこの支部では、トミスでの最初の数か月間は彼が書いたものと同じくらい困難でした。'
      p2: 'この支店での旅行でパケットを受け取る運送業者はありません。ローマへの到着が間に合わず、事務所は従業員を呼び戻した。'
    shift:
      p1:
        was: '西暦9年頃、オウィディウスはトミスで病気になりました。 Tristia III.3 で彼は、医者もいないし、適した食べ物もないし、慣れない水もなかったと書いています。'
        now: '{staff} さんは、きれいな水と、抑えられる食べ物を見つけて、熱が続く間、一緒に座っていました。彼はすぐに立ち直ります。'
      p2:
        was: '西暦 9 年から 10 年頃、オウィディウスは亡命中にトリスティアの 3 冊目の本を書きました。この本はローマに到着するところから始まり、この地域の冬の旅行の難しさを説明しています。'
    vignettes:
      rumor: 'あなたは通信事業者に、今から何世紀も後の読者は間違いが何だったのかを尋ねるだろうと伝えます。彼は予備のシートの空いている場所を指して、そこに何を置くべきかを尋ねました。ラッパーに宛先を追加し、コピーにはスペースを残します。パケットは不確実性を保ったまま出発します。'
      verify: '通信事業者は追加の名前が付いたバージョンを記憶しています。どのシートから来たのかを尋ねます。彼は詩と間違いを指摘することができ、その一節はそこで終わります。自分のワックスタブレットにその線をマークします。パケットが届いても名前はまだありません。'
      wrap: 'キャリアがパケットに手を伸ばすと、風によって外側のシートが持ち上げられます。バラバラのシートに番号を付けて、順番に戻します。ワックスタブレットには、説明のつかない線はそのままにしておくという注意事項が 1 つあります。受信者がそれをどう評価したかを見逃してしまいます。'
  empedocles_akragas:
    name: '合唱が分かれるところ'
    place: 'アクラガス'
    figure: 'エンペドクレス'
    story: 'エンペドクレスのものとされる断片には、愛と争いに関連する 4 つのルーツと結合と分離のサイクルが記述されています。ずっと後になって、ディオゲネス・ラエルティウスは彼の死についての矛盾した話を保存しています。'
    story_prose:
      opening:
        - 'アクラガス、紀元前5世紀半ば頃。エンペドクレスは詩の中で 4 つの根を使って、物事がどのようにして結合し、再び分離するかを説明しています。'
        - '歴史上、長い詩からは断片と引用だけが残っています。この支店では、コピー作成者が別のコピーを作成する用意があり、別の場所の誰かがそれを保管する用意があります。'
        - 'ある行が次の行につながっていない箇所を聞き取ることができる人が助けてくれます。また、コピーが再び見つかるかどうかを確認できる人が助けになります。'
      points:
        p1: '{staff} はコピー担当者と一緒に最初から読み上げ、両者があまりにも早く通り過ぎた場所で停止するように依頼します。エンペドクレスは 2 行をゆっくりと繰り返し、読み戻されるのを待ちます。翌日、{staff} はコピーを取る人に最初と最後を確認します。2 つのロールは同じコードを共有しなくなりました。読者は別々に結ばれたものを受け取り、その最初の行を静かに 1 回言います。'
      outcomes:
        all: '別の場所に保管されているコピーは、オリジナルと一緒には移動できなくなります。後で誰かがそれらの行について尋ねたとき、その管理者はロールを依頼することなくそれらを引き出すことができます。'
        p1: '読者は新しいコピーを自分で開ける場所に置きます。もう一方のロールはコピーリストのテーブルに置かれます。'
      none: '最初の行はコピー内でまだ結合していません。一日の終わりに、読者はロールを元の場所に戻します。'
      not_admitted: '{staff} はコピー担当者が開いたドアを見逃します。壁の向こうから一本の線が現れ、古いロールから繰り返されます。'
      excerpts:
        p1: '2 つのロールは同じコードを共有しなくなりました。読者は別々に結ばれたものを受け取り、その最初の行を静かに 1 回言います。'
    relic: '詩の断片'
    relic_desc: '想像上のリハーサルからのストリップで、詩の 2 つのターンでマークされています。'
    points:
      p1: 'コピー作成者が『自然について』のコピーを作成してチェックし、別個に保管できるよう手配するのを手伝います。'
    points_fail:
      p1: 'この部門では、歴史と同様に、後の読者は引用やパピルスの断片から詩の一部だけをつなぎ合わせることができます。'
    shift:
      p1:
        was: 'エンペドクレスは紀元前 5 世紀に自分の考えを詩にまとめました。 『自然について』は、1999 年にストラスブール コレクションから出版された断片を含む、引用文やパピルスによって部分的に残っています。'
        now: 'コピーは別の読者に渡される前に詩と照合されます。この分派では、他の作品に保存されている抜粋とともに完全なテキストが保存されています。'
        who: 'empedocles_akragas'
        bio: 'この行では、エンペドクレスの「自然について」の詩が丸ごと残り、後の読者は彼の 4 つのルーツ、愛と闘争を最初の行から最後の行までたどることができました。'
    vignettes:
      cue: 'ファオンは最も騒々しいセリフだけを保存し、両方の読者が一緒に登場します。感覚が変わる 2 つの場所に印を付けます。最初のマークで、彼らは便を一緒に引き寄せます。その瞬間、彼らはそれぞれ一歩後退します。今度は、ドアに面した読者は、シートを見なくても自分がどこにいるのかを知ることができます。'
      handoff: 'エイレネーは第 2 節まで進むことができますが、最後まで一気にジャンプし続けます。ファオンは一人で終わらせると申し出る。あなたは彼女に最初の合図をしてもらい、部屋の向こうから答えてもらいます。夕食が呼ばれると、彼女はリハーサルを途中でやめずに終了します。'
      sandal: 'ファオンはどの物語が人々の記憶に残るかと尋ねます。後のエトナの記述で、青銅のサンダルについて彼に話そうとしているところです。彼は明日練習できるラインを望んでいる。あなたはサンダルを外し、彼の未完成の部分をもう一度彼と一緒に繰り返します。エイレネーを探す頃には、スツールは山積みになっています。'
  hildegard_bingen:
    name: '歌われなかった出だし'
    place: 'ビンゲン'
    figure: 'ヒルデガルト・フォン・ビンゲン'
    story: '埋葬をめぐる論争により、ヒルデガルトのコミュニティでの歌唱が中断された。マインツに宛てた彼女の手紙には、彼女にとって何が危機に瀕していたのかが記録されている。この制限は 1179 年 3 月に解除されました。彼女の著作と音楽のいくつかのコレクションには、ルペルツベルクの写字生の作品が保存されています。'
    story_prose:
      opening:
        - '12世紀末のビンゲン近郊。ヒルデガルトの手紙と音楽は残り、彼女と一緒にそれらをコピーしチェックした人々の痕跡が残っています。'
        - '歴史上、埋葬をめぐる争いが歌唱を中断させた。翌年3月に規制は解除された。この枝では、古い練習用の葉が最初の単語のすぐ上でほとんど空白になっています。'
        - '楽譜や原稿に詳しい人が助けてくれるでしょう。また、それを歌った人たちが気づくまで、疑わしい痕跡を残しておきたいという人も必要です。'
      points:
        p1: '{staff} は、写字生にかすかなマークをまだ埋めないように頼み、古い葉と新しい葉を広げ、ヒルデガルドと歌に詳しい人に別々に見てもらいます。どちらも後のマークを認識しますが、最初の部分にはまだ質問が必要です。写字生は合意した部分を紙に書き留めます。最初の単語の上に、2 行間のスペースよりも広いスペースを残します。'
      outcomes:
        all: '制限が終わると、誰かが予備のリーフを持ってきて最初の列を確認します。その隙間で彼女の手が止まる。古い小姓を知る人物が彼女の隣にやって来ます。'
        p1: '次回予備リーフを開いたときに、どの場所が古いリーフレットからコピーされたのか、どの質問が未解決のままになっているかは明らかです。'
      none: '予備ページは元の位置に戻ります。最初の単語の上のスペースは、古いページと比較してチェックされていません。'
      not_admitted: '{staff} はコピー室には決して入りません。誰かがドアのそばの楽譜を閉め、低いスツールを元の位置に戻します。'
      excerpts:
        p1: '写字生は合意した部分を紙に書き留めます。最初の単語の上に、2 行間のスペースよりも広いスペースを残します。'
    relic: '印の付いた練習譜'
    relic_desc: '糸が開いたことを示す発明されたページ。'
    points:
      p1: '部屋が静かな間に、ヒルデガルドと写本家に、どの傷跡を引き継ぐべきか、予備の葉のどこに質問を残すべきかを尋ねます。'
    points_fail:
      p1: '予備の葉は、最初の単語の上に空白を入れて脇に置かれます。次に読む人は、古いページに何が書かれているかを尋ねる必要があります。'
    shift:
      p1:
        was: 'ヒルデガルトの手紙には、歌が中断されたことが記されている。ルペルツベルクの写本家は彼女の著作と音楽を保存しました。'
        now: 'このブランチでは、{staff} がコピーの横に古いリーフを保持します。ヒルデガルトの写字生は、どのマークをはっきりと読み取れたのか、どのマークを再確認する必要があるのかを判断できます。'
    vignettes:
      opening: 'アグネスはまだ最初の単語を見つけることができますが、その上の破損したマークを読み取ることができなくなりました。あなたは彼女に、予備のページと彼女が知っているセリフを比較するように頼みます。彼女は適切な場所に糸を立てます。これで、次の人が同じ始まりに直接アクセスできるようになります。'
      wait: 'アーデルハイドはその言葉を暗記し、破損したシートをヤスリで片付けようとしています。アグネスがもう一度ラインをトレースできる位置に保持します。アーデルハイドは冒頭部分を予備の葉っぱにコピーし、古いページをその横に保管します。次に読む人は両方を手に入れることになります。'
      return: 'コミュニティが再び歌うことはわかっていますが、アーデルハイドには今日片付けなければならないページがあります。あなたは彼女が声に出さずに出発点を示すのを手伝います。扉を閉めるとページの間に糸のほつれが見えます。この部屋で再び歌が聞こえる前に、あなたは立ち去ります。'
  hua_tuo_xuchang:
    name: '史書に残る一巻'
    place: '許昌'
    figure: '華佗'
    story: '後の三国志は、華佗が徐に監禁されていたと述べ、刑務所から本を渡そうとして失敗したことを詳しく語っている。'
    story_prose:
      opening:
        - '後漢末の許。陳寿の歴史には華佗の投獄がどのように終わったかが記録されており、残存しなかった一冊についても言及されている。'
        - '歴史上、キーパーは華佗が彼に提供したボリュームを敢えて受け取らなかった。焼けてしまいました。この部門では、誰かが友人がそれを請求できるかどうか尋ね、誰かが恩赦を求める請願を検討しています。'
        - '嘆願書や記録がどのように手から手へ渡されるかを理解している人が助けてくれるでしょう。この本と嘆願書には、それぞれ個別の要望を喜んで聞いてくれる誰かが必要となるだろう。'
      points:
        p2: '{staff} は、請願書を運ぶ意思のある人に待つよう依頼し、名前と事件を確認します。それを受け取った後、彼は彼らに電話をかけ直し、コピーに確認の文を書きます。数日後、華佗が門を通って外に出ると、人々が待っているのが見えました。門のそばで誰かが彼に腕を差し出した。彼はそれを受け取る前に少しの間一人で立っています。'
        p1: '番人は華佗の本を取り始め、その後手を引っ込めた。 {staff} は、誰の名前を受取人として記載できるかを尋ね、華佗の家族の誰かを連れてきて署名させます。レジスターが新しいページで開かれた後でのみ、ボリュームが配布されます。受取人はそれを包むための布を見つけることができません。彼は上着を脱いでテーブルの上に広げます。'
      outcomes:
        all: '華佗が帰宅すると、誰かが包装された本をドアのそばに置いてくれていました。彼はそれを結ぶために使用された布の角を認識しました。'
        p2: '華佗を知る人々が同行する。刑務所を越えて初めて、最初のコーナーでゆっくり曲がります。'
        p1: '本はそれを手に取った人の手元に残ります。布はまだ結ばれており、背の部分が折り目に線を押し込んでいます。'
      none: 'キーパーはレジを閉めます。紙がカールし始めています。この本を主張する人のページは空のままです。'
      not_admitted: '{staff} は店員に会うことはありません。窓の下にある机は閉まるまで動かない。'
      excerpts:
        p2: '門のそばで誰かが彼に腕を差し出した。彼はそれを受け取る前に少しの間一人で立っています。'
        p1: '受取人はそれを包むための布を見つけることができません。彼は上着を脱いでテーブルの上に広げます。'
    relic: '診療記録の写し'
    relic_desc: 'レポートと納品を区別するために考案されたレジスターリーフ。'
    points:
      p1: '看守が怖くて本を手に取れないときは、本を火のそばに置かないでください'
      p2: '刑が執行される前に、華佗が生きて刑務所から出られるように、再考できる人に恩赦の要請を返してもらう'
    points_fail:
      p1: '看守は法律を恐れて従おうとしなかったので、華佗は本を焼き捨てた。この枝には何も残っていない。'
      p2: '歴史通り、彼は徐の刑務所で処刑された。この支部では、彼は他の患者を治療することはありませんでした。'
    shift:
      p1:
        was: '208年頃、『三国志』には華佗が差し出した本を看守が拒否し、華佗がそれを燃やしたことが記録されている。'
        now: 'この本は刑務所から誰かの保管場所に残され、紛失する前にコピーされました。'
      p2:
        was: '208年頃、『三国志』には、華佗は恩赦の嘆願があったにもかかわらず死刑に処されたと記録されている。'
        now: 'この支部では再び嘆願が聞き入れられ、順序が変更される。華佗は生きて許の刑務所を出ます。'
        who: 'hua_tuo_xuchang'
        bio: 'この支部で華佗は救われ、生きたまま許の刑務所を出ます。'
    vignettes:
      notice: '亜人は巻があると聞いて受け取りアイテムの下に書いています。あなたは彼女に、それが置かれる棚に触るように頼みます。彼女はその行をレポートの列に移動し、棚のスペースを空のままにして、レポートのソースをその横に置きます。'
      shift: 'アチャンは次の管理者に電話する前に帳簿を閉じたいと考えています。あなたは彼にエントリを一度声に出して読んでもらいます。彼が立ち会いのない出産現場に着くと、彼らはその列を待ったままにすることに同意します。次のキーパーはまだ確認されていないものを見ることができます。'
      later: '歴史家が本についての話をすることはご存知でしょう。亜人はこの部屋から本物の量が来たかどうか知りたいと思っています。あなたは彼女に、確認済みの配達がどこに書かれているかを示しました。ページは、その場所がまだ開いたまま彼女の机を離れます。'
  miyazawa_kenji_hanamaki:
    name: 'まだほとんど読まれていない物語'
    place: '花巻'
    figure: '宮沢賢治'
    story: '宮沢は『銀河鉄道の夜』を数回の草稿で改訂した。原稿に基づいたテキストでは、ジョバンニは馬車に乗る前に駅の呼び出しを聞きます。'
    story_prose:
      opening:
        - '1933 年、花巻。宮沢賢治は学校を教えたり、農家に肥料についてアドバイスしたりしてきました。彼が子供向けに書いた物語の中には、まだ改訂中のものもあります。'
        - '歴史上、彼は9月に病気になって亡くなった。 『銀河鉄道の夜』はいくつかの草稿に残されています。この支店では、近くの農場からの訪問者も、ページを見たい人も、彼が話せるようになるまで待たなければなりません。'
        - '農家の質問の要点を理解できる人が助けてくれますし、質問をやめるべきタイミングを知っている人が助けてくれます。誰かが宮沢が病気になったときに世話をするための適切な装備も持ってこなければなりません。'
      points:
        p3: '9月20日、玄関先で誰かが座っていられないと言いました。 {staff} には機器が付属しており、手伝う許可を求め、家族に滞在してもらいます。しばらくして、宮沢は誰かが持ってきた水に手を伸ばし、自らもそれを飲む。誰かが遠く離れた場所からスツールを引きずっていきます。彼は空のカップを返し、手を放すまで待ってから枕にもたれかかります。'
        p2: '{staff} は彼に草案を別々に渡し、彼が認識している順序についてのみ質問します。彼はあるページの最後のページで立ち止まり、2 行の間に指を動かします。彼は葉を2枚選び、その上に重ねます。それらの緩いページのどれを最初に読むべきかは彼だけが知っていました。'
        p1: '{staff} は玄関で各農家に何が栽培されているのか、正確に何を知る必要があるのかを尋ね、同様の質問を 1 枚のシートにまとめて社内に持ち込んでいます。フィールドのサイズは誰も知りません。そのため、そのフィールドの所有者は、それを書き留めたメモを取りに家に帰ります。宮沢は最初の人に座ってもらい、質問用紙をテーブルに置く。カップは角の1つを保持しているので、手を握る必要はありません。'
      outcomes:
        all: '農民たちは新たな疑問を持って戻ってくるでしょう。下書きとメモはテーブルの両端に置かれ、宮沢はドアのところに訪問者用の椅子を見つけた。'
        p3: 'その後、彼の家族はカップを洗い、彼が頼まなくても飲める場所に戻します。'
        p2: '後で草稿を読んだとき、最初の 2 枚の葉は、彼が与えた順序のままになっています。'
        p1: '最後に帰った農場主は、質問用紙を四つ折りにして、外で待っている人たちに見せます。'
      none: '9月になっても原稿は別々のスタックにある。来客用に用意されていた椅子が窓際に空いている。'
      not_admitted: '{staff} は決して中には入りません。ドアのそばにいる誰かが、農民たちの書類を雨から守るためにまとめて持ってきます。'
      desync: '農家は質問する時間が取れない。政府機関が {staff} をリコールしたとき、最初の訪問者はまだ疑問を抱えています。'
      excerpts:
        p3: '誰かが遠く離れた場所からスツールを引きずっていきます。彼は空のカップを返し、手を放すまで待ってから枕にもたれかかります。'
        p2: '彼は葉を2枚選び、その上に重ねます。それらの緩いページのどれを最初に読むべきかは彼だけが知っていました。'
        p1: '宮沢は最初の人に座ってもらい、質問用紙をテーブルに置く。カップは角の1つを保持しているので、手を握る必要はありません。'
    relic: '手帳'
    relic_desc: '鉛筆で書かれた小さな詩ノート。'
    points:
      p1: '宮沢氏が病気で長い会話ができない場合でも肥料に関する相談ができるように、農家の質問を整理する'
      p2: '宮沢はまだ『銀河鉄道の夜』の原稿を認識できるが、注文をクリアしておいてもらうように頼んでください。'
      p3: '9月20日に宮沢が肺炎が悪化し、病気を乗り切ることができるよう治療を受ける'
    points_fail:
      p1: '訪問者は相談せずに立ち去り、支店は連携を失い、オフィスは従業員をリコールします。'
      p2: 'ページは残りますが、その後の編集者は依然として論文と改訂版から順序を推測する必要があります。'
      p3: 'この枝でも病気は相変わらず続いている。 9月21日に花巻で37歳で死去。'
    shift:
      p1:
        was: '1933 年 8 月、宮沢は健康状態が悪化したにもかかわらず、農家に肥料についてアドバイスを続けました。'
      p2:
        was: '1933年9月、宮沢は『銀河鉄道の夜』の未完の草稿を数編残して死去した。'
        now: '{staff} は、どのスタックが最初に来たかを尋ね、その順序を別のラッパーに記録します。後の編集者は、バージョンを区別するためにこれらのメモを使用します。'
        who: 'miyazawa_kenji_hanamaki'
        bio: '宮沢は生前、草案の順序を記した手引きを残した。彼の死後にこの物語が出版されたとき、読者は彼の改訂版を順番に追うことができました。'
      p3:
        was: '1933年9月20日、宮沢は急性肺炎を発症し、翌日花巻で37歳で亡くなった。'
        now: '{staff} は急性疾患中に治療を開始します。宮沢さんは生き残り、秋が進むにつれて再び机に座れるようになった。'
        who: 'miyazawa_kenji_hanamaki'
        bio: 'この支部で宮沢は 1933 年秋の肺炎を乗り越え、原稿の執筆を再開しました。'
    vignettes:
      call: 'あなたは部屋の向こう側からステーションコールを読み上げます。そこに誰がいるかを説明する前に、読者は顔を上げます。彼らは説明を後回しにし、呼びかけを読み上げたままにします。'
      window: '読者は、ルートが空に入る場所を指そうとします。あなたはまずジョバンニに窓から何が見えるかを尋ねます。彼らは丘と馬車を別々のスクラップに置きました。'
      ticket: '読者がキャリッジにシフトを再読する間、ページを開いたままにします。次の駅の名前が決まる前に、何が変わったかを簡単にメモします。'
  higuchi_ichiyo_tokyo:
    name: '店先に並んだ『たけくらべ』七回分'
    place: '東京'
    figure: '樋口一葉'
    story: '樋口一葉の『たけくらべ』は、1895年と1896年1月に『文学界』に7回にわたって掲載され、1896年4月に『文芸倶楽部』から同時刊行された。'
    story_prose:
      opening:
        - '1896年、東京。樋口一葉の『たけくらべ』は『文学界』に7号にわたって掲載され、その後『文芸倶楽部』に改訂完全版が掲載された。'
        - '歴史上、彼女は自分が選択できる条件で別の版を発行されることはなく、11月に亡くなりました。この支店ではバックナンバーが 1 つまだ見つかっていないため、書店はまだ前売りに同意する可能性があります。'
        - 'バックナンバーや証拠を追跡できる人が助けてくれます。著者が規約を読むまで、支払いについて話し合っている人を待ってもらうには忍耐が必要です。この病気には、適切な装備を持った人が必要です。'
      points:
        p3: '暑くなっても一陽はまだ熱がある。 {staff} さんは訪問し、同意したケアを手配し、同居人たちに、これ以上ページを要求する人を断るように頼みます。ある日、彼女は再び机に座ります。彼女は原稿を壁に立てかけていた場所から持ち帰った。彼女が最後に立ち止まった場所に、窓からの小さな光が降り注ぎます。'
        p2: '{staff} は書店に対し、料金、日付、書面で使用するバージョンをまとめて提出するよう求めます。いちようはシートを引き寄せて、それぞれの用語を読みます。最後になって初めて、彼女はどのコピーを保持できるかを尋ねます。書店員は本を半分に折ります。一葉の開いた紙には、丸で囲った名前が一目で分かる。'
        p1: 'カウンターには 7 つの問題があるはずですが、数えられるのは 6 つだけです。 {staff} は、不在号を最後に借りた人を検索します。カウンターに戻ると、いちよさんは改訂版の中に同じ一節を見つけています。彼女はページを隣り合わせに置き、書き直された最初の行から読み始めます。今度はカウンターの亀裂に紙が引っかかりません。'
      outcomes:
        all: '席に戻った一夜は、まずは分冊版の規約を確認する。窓のそばには 2 つの山が置かれています。古い号と、彼女がまだ書き込める紙です。'
        p3: '彼女が再び座って書くことができるようになると、ページを一番上に取ります。部屋には誰も彼女に代わって電話をかけません。'
        p2: '書店は契約書のコピーを返送します。彼女は選択した証拠を同じバックナンバーの中に保管します。'
        p1: '完全版が到着しても、古い 7 冊はまだ一緒に積み上げられています。彼女はテーブルに立ち寄り、修正した箇所を読みます。'
      none: '書店員からのメッセージでは、まだやるべきことが残っているとのことです。新しい問題がクローズされると、新しい答えは得られません。'
      not_admitted: '{staff}は一陽に会うことはありません。古い号の束が今も貸出カウンターの下に縛り付けられている。'
      desync: 'バックナンバーが1冊見つかりませんでした。オフィスが {staff} をリコールすると、カウンターの上のスタックにはまだ中央に隙間があります。'
      excerpts:
        p3: '彼女は原稿を壁に立てかけていた場所から持ち帰った。彼女が最後に立ち止まった場所に、窓からの小さな光が降り注ぎます。'
        p2: '書店員は本を半分に折ります。一葉の開いた紙には、丸で囲った名前が一目で分かる。'
        p1: '彼女はページを隣り合わせに置き、書き直された最初の行から読み始めます。今度はカウンターの亀裂に紙が引っかかりません。'
    relic: 'ポケットダイアリー'
    relic_desc: '丁寧な筆文字で何年も書き続けた日記。'
    points:
      p1: '文学会から全7回の連載を集め、集めた校正刷りを樋口と確認し、改訂版を4月に出版できるようにする'
      p2: '収集したテキストが表示されたら、樋口が前払いと選択した校正刷りで別版を交渉するのを手伝ってください。'
      p3: '七月になっても一陽の熱が下がらないときは、結核を早く見つけて治してあげてください。'
    points_fail:
