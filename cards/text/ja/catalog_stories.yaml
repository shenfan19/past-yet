    vignettes:
      index: '誰かが 1 つの問題について「完了」と鉛筆で書きました。その結末を 4 月の印刷物と比較し、どこで途切れているかを見つけます。ブックストールキーパーを使用すると、取り外し可能な伝票を入れることができます。あなたは 7 回の分割払いのリストを家に持ち帰ります。最初のレーベルを誰が書いたのかは決してわかりません。'
      reserve: '管理人には、次号から次号までこの物語を追い続け、最後の号には戻ってこない読者がいます。あなたは、他の顧客が 4 月の印刷版を今すぐ購入できると指摘しました。最後の回は予約票と一緒にカウンターの下に行きます。その読者が戻ってくる前にあなたは立ち去ります。'
      layout: '4 月号を最終回の横に置きました。 1 つは冒頭で開き、読者がすでに 6 つの部分を読み終えるのを待っていると想定しています。屋台の店主のためにその区別をスクラップに書き、自分のコピーを保管します。オリジナルの連載読者は、あなたの訪問全体よりも長く待っていました。'
  rumi_konya:
    name: '冒頭で語る声'
    place: 'コンヤ'
    figure: 'ルーミー'
    story: 'ルーミのマスナビの冒頭は、リスナーに別れについて語る葦の声を聞くよう求めます。コンヤのメヴラーナ博物館には、ルーミが 1273 年に亡くなった後、1278 年にコピーされた 6 冊の写本が保管されています。'
    story_prose:
      opening:
        - 'コンヤ、1273 年。ルーミの長い詩は 6 冊の本にまとめられました。 5年後に作られたコピーが今も残っている。'
        - '歴史上、ルーミーはその年の12月に亡くなった。この原稿は、詩がどのように注文されたかを後の読者に伝えます。このブランチでは、2 つの読書コピーのページが同じテーブル上にあります。'
        - 'ルーズリーフの順序を理解できる人は役に立ちます。病気の人が誰に会いたいと言ったら、誰かが耳を傾け、二人を少し静かにしてあげることも必要です。'
      points:
        p2: '{staff} は最初に誰に会いたいかをルミに尋ね、訪問者を連れてドアの近くで他の人たちに待つように頼みます。訪問者はルーミーの声が聞こえる場所に座っています。しばらくの間、どちらも話さない。訪問者は持っていた紙を置きます。それを見たルーミはカップを少し近づける。'
        p1: '借り手が来ると、{staff} はテーブル上の 2 つのセットを分離し、最後の行を次のリーフまでたどります。借り手は座って手伝います。線が途切れると、彼の読書も途切れます。彼は次の葉を見つけて、それを 1 インチ前方にスライドさせます。今回は、借りたバンドルが最初のパッセージから最後のパッセージまで続きます。'
      outcomes:
        all: 'その後、借り手は 2 つのコピーを別々の場所に置きます。ドアが閉まると、外出する人は手が自由になり、読者は少し長く滞在できます。'
        p2: 'ドアのところにいる人たちが小さなスペースを作ってくれます。訪問者は長時間座っています。誰も彼を急かさない。'
        p1: '借りた人は玄関で葉っぱを1枚折り返してから、コートに合わせて束を運び出します。'
      none: 'テーブルには 2 セットのページが残っています。窓辺のカップは長い間手つかずのままです。'
      not_admitted: '{staff} は決して中には入りません。借り手は手を空にしてベンチで待っています。'
      desync: '1冊借りましたが一部欠けています。政府機関が {staff} をリコールしたとき、もう 1 つはまだ未解決のままです。'
      excerpts:
        p2: '訪問者は持っていた紙を置きます。それを見たルーミはカップを少し近づける。'
        p1: '彼は次の葉を見つけて、それを 1 インチ前方にスライドさせます。今回は、借りたバンドルが最初のパッセージから最後のパッセージまで続きます。'
    relic: '朗読の出だしを記した紙'
    relic_desc: '詩の始まりを示す想像上の朗読シート。'
    points:
      p1: 'コンヤでは、マスナビを他の読者に貸す前に、コピーしたシートの順序を確認してください'
      p2: 'ルミが病気になったときは、誰に会いたいかを尋ね、一緒に座るときは部屋を静かにしてください'
    points_fail:
      p1: '読み切り2冊が混在しております。 1 つのバンドルが間違った場所にセクションを残して出発し、レコードが同期しなくなったときにオフィスは {staff} をリコールします。'
      p2: 'ルミが頼んだ人が座る前に、別の訪問者が玄関にいます。'
    shift:
      p1:
        was: 'コンヤは、ルーミの死から 5 年後、1278 年に発行された 6 冊のマスナビの写本を持っています。'
      p2:
        was: 'ルーミは 1273 年 12 月にコンヤで亡くなりました。後の記述には、彼の仲間たちが彼の枕元に集まっていたことが描かれています。'
        now: 'この支店では、{staff} がルーミから会いたいと頼まれた人のために椅子を設置します。会話は、ルーミー が話す準備ができるまで待つことができます。'
    vignettes:
      reed: 'ナリンは両方のパートを同じ声で演奏しました。あなたは、葦が最初にそれ自体として話す場所はどこかと尋ねます。彼女は一呼吸置いてから次の行を始めます。ハサンが目を閉じて耳を傾けると、リードが引き継がれる瞬間が聞こえます。'
      hand: 'ハサンは読書ベンチを離れなければならず、ナリンはまだ話している間にページに手を伸ばします。彼が対句を完成し、次の行に指を置くことができるまで、その角を保持します。自分の番が来ると、彼女はそこから始めます。通路は二人の間を隙間なく通過した。'
      manuscript: 'あなたは後の6冊の本原稿を見ました。ナリンは、ハサンが息を吸った場所を示すかどうか尋ねます。あなたは彼らが練習したセリフを指差し、どこで一時停止するかを彼女に決めさせます。次の対句を読み上げる前にドアが閉まります。'
  terence_rome:
    name: '席を立っていく観客'
    place: 'ローマ'
    figure: 'テレンティウス'
    story: 'テレンティウスの『ヘキュラ』のプロローグでは中断について説明されています。彼らは、ボクシングの引き分けと綱渡りの演技、そして剣闘士の発表で群衆が殺到したことを思い出します。地図の年では初期の作品を特定し、2 番目のプロローグではそれらを振り返ります。'
    story_prose:
      opening:
        - '紀元前165年頃のローマ。ヘキュラのプロローグには、ヘキュラが初めて装着されたときに何が起こったかが記録されます。選手たちは観客が落ち着くのを待っている。'
        - '歴史上、観客は他のエンターテイメントに気を取られ、コメディは最後まで到達しませんでした。このブランチでは、最初の数行はまだ削除されていません。彼らは、次に誰が話すことになっているのかを聞くことができないのです。'
        - '群衆の上で発言でき、いつ俳優に部屋を戻すかを知っている人が役立つかもしれません。'
      points:
        p1: '{staff} は最前列に席に着くように頼み、すでに発言を待っている俳優を指差します。男は他の娯楽がいつ始まるかを尋ねます。 {staff} は彼の話を聞き、1 行だけ待つように頼みます。俳優は声を上げません。数人が振り向くと、後ろにいた人たちも静かになった。最後のセリフが言い終わると、ステージに一番近い男性がステージの端から手を離します。彼の後ろにいる人たちは彼が立つのを待ってから移動します。'
      outcomes:
        all: '乗組員がロープを解きに来ると、数人がまだ座って、今聞いたセリフについて話し合っています。'
        p1: '最後のシーンは、前にいた人たちが立ち上がる前に終わっています。'
      none: '群衆は他のショーに向かって移動します。舞台上で俳優は行列の途中で立ち止まります。'
      not_admitted: '{staff} は最初の行に到達しません。誰かが近くに立っていて、すぐに見るべきものは背中だけになります。'
      excerpts:
        p1: '最後のセリフが言い終わると、ステージに一番近い男性がステージの端から手を離します。彼の後ろにいる人たちは彼が立つのを待ってから移動します。'
    relic: '喜劇の仮面'
    relic_desc: '俳優が着用する、眉を上げたリネンのマスク。'
    points:
      p1: 'ボクサーや綱渡りの話でプレイヤーの声がかき消されたら、ステージ近くの人にもう一度聞いてもらい、カンパニーが最初のパフォーマンスを終えることができるようにする'
    points_fail:
      p1: '選手たちは観客の前で自分の意見を伝えることができません。歴史のように、彼らは終わりの前に止まります。'
    shift:
      p1:
        was: '紀元前 165 年、『義母』の最初の上演は、他の出演者に対する騒音と興奮の中で中断されました。'
        now: 'ステージ近くの聴衆は再び聞き始め、劇団は最初の試行で最終ラインに到着します。'
        who: 'terence_rome'
        bio: 'この部門では、テレンティウスの『義母』の最初の上演が紀元前 165 年に終了しました。'
    vignettes:
      warning: 'あなたは舞台係に、中断された公演については 2000 年後も人々が読み続けるだろうと言いました。彼は、俳優たちが止めなければならなかったときに何を言ったかを彼らに知ることができるかどうかを尋ねました。あなたはリハーサルの間残って、最後に聞こえたセリフを書き留めます。本番はまだ先です。'
      audibility: '玄関の横で聞いていて、はっきり聞こえたセリフの返事を聞き逃してしまう。舞台係はベンチを 1 つ移動して、もう一度聞いてくださいと頼みます。今回は両方の部分が聞こえます。あなたはベンチの 2 つのポジションのスケッチを持ち帰ります。通りの騒音が大きくなりすぎて、外からエンディングが聞こえなくなりました。'
      bench: 'あなたは舞台係がベンチを出入り口から 1 つ後ろに置くのを手伝います。遅刻者は列全体を立たせずに座ります。木片に空きスペースをマークします。リハーサルの音がまだ戸口に響きわたったまま、あなたは去ります。'
  taqi_al_din_istanbul:
    name: '天文台の二つの声'
    place: 'イスタンブール'
    figure: 'タキ・アッディーン'
    story: 'タキー アルディンのイスタンブール天文台は、1580 年 1 月に取り壊される前に観測を実施しました。アーカイブ調査により、象限や機械式時計などの機器が特定されています。'
    story_prose:
      opening:
        - 'イスタンブール、1580年初頭。タキ・アッディーンと彼の助手たちは天文台から観察を続けていた。原稿には、そこで使用されたいくつかの楽器が記録されています。'
        - '歴史上、天文台は1月に解体された。このブランチでは、以前の読者が、一緒に使用していた楽器の小さな部品を 1 つ残して帰りたいと考えています。'
        - '何が安全に引き渡せるかを理解している人が助けてくれるでしょう。彼らはアシスタントにどの作品を担当できるかを尋ねなければなりません。'
      points:
        p1: '{staff} はアシスタントと一緒にスタンドを 2 回見てから、最も頻繁に読んだ目盛りが付いている作品だけを取りたいかどうか尋ねます。助手はうなずき、その下に古い布を抱えます。彼と {staff} はそれをテーブルの上に平らに持ち上げます。布を拾う前に、彼はもう一度端に沿って指をなぞります。彼の指は、かつて読み上げを呼びかけたマークに止まります。'
      outcomes:
        all: 'アシスタントは包んだ作品を持ち帰る。その後、誰かが彼にどうやって測定値をとったのかと尋ねると、彼はそれを広げて最初にそのマークを見せました。'
        p1: '細かい部分が古いスタンドには合いません。その日使った布に包まれたまま、助手のテーブルの下に置かれている。'
      none: 'アシスタントは一度戻ってきて、手ぶらで帰っていきます。かつてスタンドが立っていた場所には、より青白い斑点が現れています。'
      not_admitted: '{staff} は天文台の誰にも会いません。扉が閉まると木箱が中に移動します。'
      excerpts:
        p1: '布を拾う前に、彼はもう一度端に沿って指をなぞります。彼の指は、かつて読み上げを呼びかけたマークに止まります。'
    relic: '比較票'
    relic_desc: 'オリジナルの行とその修正を含む架空の天文台の伝票。'
    points:
      p1: '天文台が解体される前に、機器を使用していた人々が少しずつ段階的に自分たちの世話をできるように支援してください'
    points_fail:
      p1: '作業員が来たとき、その部品はまだ天文台にあります。この引き継ぎからは、元アシスタントには何も届きません。'
    shift:
      p1:
        was: '1580 年 1 月、イスタンブール天文台は取り壊されました。現代の詩には、解体中に壊れた楽器が記録されています。'
        now: 'マークされたコンポーネントの 1 つは、以前のアシスタントに残ります。天文台を出た後も、その曲がどのようにして卒業されたのかを別の楽器製作者に見せることができます。'
    vignettes:
      clock: 'ハサンは角度を声に出して読み上げ、レイラは時計をコピーします。次の行は、彼の 2 回目の呼び出しを聞いていなかったので、最後の角度を継承します。一度に一声ずつ繰り返してもらいます。両方の作業者は、次の読者が見つけられるように、記録の横に修正箇所をマークします。'
      copy: '製本されたノートは階下に行かなければならず、ハサンはベンチで修正する必要がある。 Leyla に、古い行と修正された行を 1 つの伝票にコピーさせます。彼女はどちらが先に読まれたかを書きます。ノートが去っても、ベンチにはまだ変化の跡が残っています。'
      closure: '建物に残された時間がいかに少ないかを知っています。ハサンは角度の横で時間がなくラインで止まった。あなたは、シャッターを閉める前にまだ何を確認できるかを尋ねます。彼は 1 つの空きスペースを丸で囲みます。あなたはこの部屋から別の観察を見ることなく去ります。'
  bessie_coleman_jacksonville:
    name: '離陸前に、彼女の名前を'
    place: 'ジャクソンビル'
    figure: 'ベッシー・コールマン'
    story: 'ベッシー・コールマンは、1921年6月15日にフランスで国際パイロット免許を取得した。1926年4月30日、メーデーのイベントに先立ち、ジャクソンビルのパクソン・フィールドで練習飛行中に死亡した。'
    story_prose:
      opening:
        - '1926年4月、ジャクソンビル。ベッシー・コールマンはフランスで飛行機の操縦を学んだ。彼女は現在フロリダにおり、地元の航空イベントの準備をしています。'
        - '歴史上、彼女は4月29日に学童を訪問し、翌日の練習飛行中に死亡した。この支部では、主催者が彼女を学校まで送るために車を借りたいと考えています。'
        - '学校や主催者と相談できる人が助けてくれます。航空機に精通していて、離陸を待っている全員にもう一度チェックを求めることができる人も同様です。'
      points:
        p4: '{staff}はまず地上職員を現場に到着させ、コールマンとパイロットから検査を聞きます。監視を待っている人が、予約された場所に誰が座るのかを尋ねます。コールマンは航空券を求めます。パイロットは別の日に使える時間を指摘します。彼女は鉛筆を取り、今日の行を空白のままにします。'
        p2: '生徒たちからはたくさんの質問がありました。 1 つは非常に小さく折りたたまれているため、生徒がそれを持ち上げても誰も受け取りません。 {staff} は、残っている教師にそれを渡し、別のレッスンの時間を作ってもらうように頼み、コールマンがトレーニングに関するニュースを送ることができるように教師の住所を伝えました。教師は自分の住所を黒板の隅に書き写します。最後の生徒が出てきて、振り返って家の番号をもう一度書きます。'
        p1: '{staff} はイベントのスケジュールを学校に持ち込み、生徒たちにすでに割り当てられた時間を調べ、主催者のために別の車を手配します。コールマンが到着するまでに、ホールには列ができていました。先頭の子供が自分の名前を書いた紙をまっすぐに伸ばしている。彼女が座って初めて、彼は机の向こう側に質問を押し付けます。'
      outcomes:
        all: 'この日は練習飛行はありません。コールマンは本の中に教師の住所を記入し、彼女とパイロットは空行を先頭に戻します。'
        p4: '練習飛行はまた別の日に残されています。フィールドが閉じられたとき、誰も新しい番号をラインに入力しませんでした。'
        p2: '教師は質問を教室に持ち込み、次のレッスンのために本の横に置きます。'
        p1: '学校訪問は予定どおり行われます。最後に、誰かがまだコールマンの名前が書かれた紙をドアのところで待っています。'
      none: 'イベントの後もテーブルの上にはまだいくつかのリストがあり、それを受け取る人は誰もいません。'
      not_admitted: '{staff} は学校の主催者にもスタッフにも届きません。誰かが最後の椅子を戸口から運び去ります。'
      desync: '学校訪問は予定から中止されました。オフィスから {staff} に折り返し電話がかかると、子供たちはまだ門のところで待っています。'
      excerpts:
        p4: 'パイロットは別の日に使える時間を指摘します。彼女は鉛筆を取り、今日の行を空白のままにします。'
        p2: '教師は自分の住所を黒板の隅に書き写します。最後の生徒が出てきて、振り返って家の番号をもう一度書きます。'
        p1: '先頭の子供が自分の名前を書いた紙をまっすぐに伸ばしている。彼女が座って初めて、彼は机の向こう側に質問を押し付けます。'
    relic: '日付入りの校正刷り'
    relic_desc: 'コールマンの名前がフルネームで記載された架空の地上職員の通知。'
    points:
      p1: '航空ショーの準備のためにコールマンのジャクソンビルの学生たちとの訪問が妨げられないようにする'
      p2: 'コールマンが、飛行の習得方法に関する生徒の質問に答えられる地元の教師とのフォローアップ レッスンを 1 回手配できるよう支援します。'
      p4: '乗組員に地上で航空機を確認するよう依頼し、さらに作業が必要な場合は 2 人の飛行士に練習飛行を延期してもらいます'
    points_fail:
      p1: '主催者は時間を補うために訪問を中止した。支店の同期が失われ、オフィスはその日の従業員をリコールしました。'
      p2: '生徒たちは質問をしたまま帰宅しますが、フォローアップレッスンに同意する教師はいません。'
      p4: '古い飛行機は予定通り離陸します。コールマンとパイロットは練習飛行中に死亡。'
    shift:
      p1:
        was: '1926年4月29日、コールマンはジャクソンビルの黒人公立学校の生徒たちを訪問した。'
      p2:
        was: 'コールマンは飛行学校を開校したいと考え、ジャクソンビルの生徒たちと話をしました。彼女の学校は彼女が生きている間に開校されませんでした。'
        now: 'この分校では、教師が生徒の質問を収集し、フォローアップ レッスンを開催することに同意します。コールマンさんは、トレーニングの機会に関するニュースを送信できるアドレスを持っています。'
      p4:
        was: '1926年4月30日、コールマンとパイロットはパクソン・フィールドでの練習飛行事故で死亡した。'
        now: 'この部門では、乗組員は再度の地上検査を推奨し、飛行士は別の日に練習飛行を離れます。'
        who: 'bessie_coleman_jacksonville'
        bio: 'ジャクソンビルの後も、コールマンは飛行を続け、黒人学生に飛行訓練を公開する取り組みを続けた。'
    vignettes:
      proof: 'アンはセリフが足りず、パイロットの名前を切り捨てた。スペースを空けるために、2 つのふてくされた言葉を交換します。受け取りの際、彼女はランナーに校正刷りを折りたたむ前にフルネームを一度読んでもらいます。彼は今、それが女性であることだけを言わずに飛ぶ人を区別できるようになりました。'
      school: 'ルイスさんは、観客が求めているのはショータイムだけだと考えている。フェンスの近くにいた子供が、パイロットがどこで学んだのか尋ねます。あなたはルイスにライセンスがどこで発行されたかを伝え、彼が繰り返すことができる事実を最後の行に使用させます。彼は証明を取るとき、場所だけでなく日付も言う練習をします。'
      ground: 'フィールドは埋まりつつあり、翌日の通知では同じ番組について説明されなくなることがわかります。アンは、今すぐ証拠を提出すべきかどうか尋ねます。あなたは日付の入ったコピーを 1 枚保管し、残りのコピーをゲートまで送るのを手伝ってください。訪問は地上で終了しますが、観客はまだ到着しています。'
  fanny_mendelssohn_berlin:
    name: '自分の名で出した六つの歌'
    place: 'ベルリン'
    figure: 'ファニー・メンデルスゾーン＝ヘンゼル'
    story: 'ファニー・ヘンゼルの「6つの歌」Op. 1846年に彼女自身の名前で出演した。最後の春に彼女はピアノ・トリオを完成させ、『ベルゲスルスト』を書いた。彼女は1847年5月14日にベルリンでリハーサル中に体調を崩し、その日に亡くなった。このトリオは 1850 年に出版されました。'
    story_prose:
      opening:
        - '1847 年春、ベルリン。ファニー・ヘンゼルは自身の名前で 6 曲を発表しました。ピアノトリオを終えた後、彼女は日記に、もう音楽は来ないと書いています。'
        - '歴史上、彼女は最後の曲を完成させた。 5月14日、彼女はリハーサル中に体調を崩し、その日に亡くなった。この分岐では、プレイヤーが持ち込んだ 3 つのスコアに異なるマークが付けられます。'
        - 'スコアを比較したり、プレイヤーに作業の順序を説明したりできる人が助けてくれます。何かが起こったら、誰かが音楽を止めて助けを呼ばなければなりません。'
      points:
        p3: 'ヘンゼルはリハーサル中に次のページをめくりません。 {staff} は歌手たちに止めるように頼み、ドアのところに誰かを呼んで医師を呼びに行かせ、家族の誰に見覚えがあるかを尋ねました。歌手たちは後ろに下がり、椅子の間に道を作ります。彼女の家族の一人が楽譜を床に置き、彼女の隣に座っています。彼女がめくることのなかったページは、まだ開かれている。'
        p1: '{staff} は、Hensel が歌のために確保した時間を確保できるように、プレーヤーに後でスコアを収集するように依頼します。彼女は誰かが階下のドアを開ける音を聞き、座ったままです。彼女は紙に最後の行を書きます。二度目のノックが来たとき、彼女のインクはまだ濡れていた。'
        p2: '{staff} は、プレイヤーのコピーの隣に作業スコアを配置し、それぞれの変更がどこから来たのかを尋ねます。ヘンゼルは 2 か所を確認し、1 つのマークを取り消し線で消し、もう 1 つのマークをより強くペンで押します。プレーヤーがスコアを手に取るとき、3 冊すべての本が同じページで開かれます。'
      outcomes:
        all: '後で家族は同じスコアを相談する必要があります。その日、誰が彼女の隣に座ったのか、そして彼女がどの読みをページに残すことにしたのかを覚えている人もいます。'
        p3: '誰かが医者を呼びに行った後、部屋はしばらく静かになります。ヘンゼルに最も近い椅子は再び動かされません。'
        p1: '最後の曲が完成しました。選手たちが二階に来ると、シートはまだ彼女が乾燥させたままの場所にあります。'
        p2: 'トリオの作業スコアはまだ残っています。家族が後で彼女の読書を確認したいとき、すぐにページを開くことができます。'
      none: 'いくつかのスコアが未解決のままです。部屋を閉める人は、部屋を一人ずつ光の外に移動させます。'
      not_admitted: '{staff}は決してリハーサル室に入らない。階下から、短く切られたフレーズの音が聞こえてくる。'
      desync: 'リハーサルは彼女が確保した時間を費やします。代理店が {staff} をリコールすると、曲の最後の行が空のままになります。'
      excerpts:
        p3: '彼女の家族の一人が楽譜を床に置き、彼女の隣に座っています。彼女がめくることのなかったページは、まだ開かれている。'
        p1: '彼女は紙に最後の行を書きます。二度目のノックが来たとき、彼女のインクはまだ濡れていた。'
        p2: 'ヘンゼルは 2 か所を確認し、1 つのマークを取り消し線で消し、もう 1 つのマークをより強くペンで押します。プレーヤーがスコアを手に取るとき、3 冊すべての本が同じページで開かれます。'
    relic: '歌の楽譜'
    relic_desc: 'ファニーをマークした手書きの歌。'
    points:
      p1: 'ヘンゼルが最後の曲を完成できるように、リハーサルの準備中に執筆時間を守る'
      p2: 'トリオの原稿とリハーサルのコピーを並べて置き、ヘンセルに選手たちに残してほしい変更点をマークするよう依頼します。'
      p3: 'ヘンゼルがリハーサル中に体調が悪くなったら、音楽を止めて助けを呼び、誰かに付き添ってもらいましょう'
    points_fail:
      p1: 'リハーサルには彼女が確保していた時間が費やされ、曲はドラフトで止まってしまいます。支店の同期が失われ、オフィスはその従業員をリコールします。'
      p2: 'プレーヤーは変更を別のページに保存します。彼女の家族は、彼女がどれを承認したか尋ねなければならないだろう。'
      p3: '人々は助けを求めてさまざまな方向に進みます。家族が彼女の到着を待っている間、部屋は混雑したままです。'
    shift:
      p1:
        was: '1847年4月下旬、ヘンゼルはトリオの後に作曲が停滞したと書いた。 5月に彼女は亡くなる直前に最後の曲を完成させた。'
      p2:
        was: 'ヘンゼルは 1847 年 5 月 14 日に亡くなりました。ピアノ三重奏曲は 1850 年に初めて出版されました。'
        now: 'このブランチ {staff} は、ヘンセルが選手とその家族が参照できるトリオの作業用コピーをマークするのに役立ちます。別冊は後日掲載予定です。'
      p3:
        was: 'ヘンゼルは1847年5月14日のリハーサル中に体調を崩し、同日亡くなった。'
        now: 'このブランチでは、{staff} が助けを求められ、歌手たちにスコアを閉じるように依頼します。ヘンゼルの隣には家族が一緒に泊まれる部屋がある。'
    vignettes:
      cover: '歌手が真ん中のスコアを開いて、これは誰の曲なのか尋ねます。あなたはその緩いタイトルシートを取り出して、スコアの横に置きます。タイトルシートのイニシャルだけで、ジャケットに何を書くかを決めるのに十分です。書類をまとめているときに最初の曲を聴き逃してしまう。'
      forward: 'あなたは歌手に、コレクターが今後これらの曲をどのように検索するかを語り始めます。彼女は緩い表紙を指して、まだ持っているかどうか尋ねました。次のコピーで表紙を付けるように要求します。リーダーは1人で行きます。これ以上追跡することはできません。'
      order: '内容を検討して、6 曲を順番に並べます。歌手は必要な人にまっすぐ向かうことができます。順序を自分の伝票に記録します。持ち帰ってはいけないのは、部屋のドアを閉めた後の音です。'
  camille_claudel_paris:
    name: '一つの回転、二つの姿'
    place: 'パリ'
    figure: 'カミーユ・クローデル'
    story: 'カミーユ・クローデル美術館には、1905 年の青銅鋳造品を含め、いくつかのバージョンの『ワルツ』のカタログが収蔵されています。1913 年にクローデルの父親がヴィルヌーヴ・シュル・フェールで亡くなりましたが、彼女は葬儀まで彼の死を知りませんでした。 3月10日、彼女はヴィルエヴラールに入院した。'
    story_prose:
      opening:
        - '1913 年 3 月、パリ。カミーユ クローデルは複数のバージョンのワルツを制作しました。彼女のスタジオでは、ほぼ同じに見える他の作品の中から欲しいものを選ぶことができます。'
        - '歴史上、彼女は葬儀までに父親の死を知らなかった。 3月10日に彼女は入院した。この支店では、チェックできる手紙がパリに到着しており、スタジオについて誰かに指示を与える時間があります。'
        - '難しいニュースに対して時間をかけられる人が助けてくれるでしょう。スタジオのことになると、何をどこに誰と行くかクローデルが言うのを待つ必要がある。'
      points:
        p2: '{staff} は白紙のシートを用意し、クローデルが指摘した事項を個別にリストします。誰かが 2 つの似たものを 1 行に並べたいと考えています。彼女は紙の上に手を置き、スペースを 2 つ入れてくださいと尋ねます。一番下に受信者の名前を追加します。紙を折る前に、彼女は紙を取りに来た人に最後の一行を指摘します。'
        p1: '{staff}は手紙を持ってきた人に日付を確認してスタジオへ。クローデルはそれを一度読み、少し待ってから、どの電車が一番最初にそこに着くのかを尋ねます。彼女はコートの中に手紙を入れる前に、エプロンで手を二度拭きました。'
      outcomes:
        all: '出発する前に、クローデルは自分が選んだ人にリストを渡します。彼がそれを求めに来ると、彼女がまだ明らかにしていない二人の名前を読み返します。'
        p2: '彼女が選んだ人がリストを受け取ります。スタジオに戻ると、一度に 1 行ずつオブジェクトを見つけます。'
        p1: 'ヴィルヌーヴに向かう途中、彼女はもう一度手紙を取り出します。彼女は日付にまっすぐ向きを変えて、もう一度読みます。'
      none: 'オブジェクトはその場所に残ります。誰かがテーブルの隅にあるシートを平らにしました。名前は書かれていません。'
      not_admitted: '{staff}は決して入れません。 ロックが一度反対側に移動し、足音が遠ざかります。'
      excerpts:
        p2: '一番下に受信者の名前を追加します。紙を折る前に、彼女は紙を取りに来た人に最後の一行を指摘します。'
        p1: 'クローデルはそれを一度読み、少し待ってから、どの電車が一番最初にそこに着くのかを尋ねます。彼女はコートの中に手紙を入れる前に、エプロンで手を二度拭きました。'
    relic: '青銅の手'
    relic_desc: '手の小さなブロンズの研究。'
    points:
      p1: 'クローデルが葬儀のために旅行するかどうか決めるのに間に合うように、父親の死に関する信頼できる知らせをクローデルに伝えてください。'
      p2: 'クローデルがスタジオを出る前に、知り合いに何を任せたいかを尋ね、選択肢を書き留めるのを手伝ってください。'
    points_fail:
      p1: 'その知らせは葬儀後にパリに届く。クローデルはすでに行くかどうか決める機会を失っている。'
      p2: '撤去の記録は残るだろうが、スタジオにあるものには、誰が保管すべきかというクローデルからのメモがまだ残っていない。'
    shift:
      p1:
        was: '1913年3月3日、彼女の父、ルイ＝プロスパー・クローデルがヴィルヌーヴで死去した。家族はカミーユに知らせず、彼女は葬儀にも出席しなかった。'
        now: 'この支店でクローデルはその知らせを間に合うように受け取り、父親の葬儀に出席するためにヴィルヌーヴ・シュル・フェールへ行くことを選択します。'
      p2:
        was: '1913年3月10日、カミーユは家族の要請によりヴィル＝エヴラールの亡命施設に収容された。 1914 年にモンデベルグに移りましたが、そこから離れることはなく、1943 年 10 月 19 日にそこで亡くなりました。'
        now: 'このブランチ {staff} では、Claudel がいくつかのスタジオ オブジェクトを使用して実行したいことを記録します。彼女が選んだ人がリストを受け取り、彼女が帰るときにそれに従います。'
    shift_all: 'クローデルは父親の葬儀に行き、スタジオにある物の世話をする人を選ぶこともできます。'
    vignettes:
      light: '後の博物館の展示物を見たことがあるが、スカートの周りを歩くと影が変化するのを見ることができるのは今だけだ。パッカーは両方のカードに同じ説明を書こうとしています。余白に 2 つの曲線を描きます。木箱は別々に発送され、どちらも開梱されていません。'
      mark: 'パッカーは同じタイトルを持つ 2 つのラベルを見つけます。蓋を取り付ける前に、カーテンが終わる部分にそれぞれ 1 つのディテールを追加します。あなたは両方のメモを自分の手元に保管します。あなたが読んだ大理石の依頼は決して届きません。'
      crate: 'パッカーが蓋に手を伸ばす間、あなたは張り出したスカートにラッピングシートを置かないようにします。記憶を頼りに予備の紙にその曲線をなぞります。蓋が下りてくると最後の1インチまで確認できなくなります。'
  emily_bronte_haworth:
    name: '冬の牧師館'
    place: 'ハワース'
    figure: 'エミリー・ブロンテ'
    story: '『嵐が丘』は 1847 年にエリス・ベルという名前で登場しました。この小説は、物語の大部分をネリー・ディーンのロックウッドへの説明として組み立てている。'
    story_prose:
      opening:
        - 'ハワース、1848年。『嵐が丘』はエリス・ベルという名前で出版されている。エミリーは牧師館にまだ初版を持っており、最初からめくることができます。'
        - '歴史上、シャーロットとアンはペンネームを区別するために7月にロンドンに行き、エミリーは12月に自宅で亡くなった。この支部では誰かがロンドンまでに書類を集めるのを手伝い、エミリーが自宅で言いたいことを言うのを待つことができます。'
        - 'それには、手書きと綴りを区別できる人、そしてエミリーが病気のときに話し終わるのを待つことができる人が必要です。'
      points:
        p4: '{staff} は、エミリーにどこに座りたいか、誰が近くにいてほしいかを尋ねます。彼女は壁際の椅子を選び、本を求めました。 {staff} は暖かい毛布を手の届くところに置きます。誰かがもう一方の椅子を奪い始めます。エミリーは手を挙げて、それがどこにあったかを指さします。'
        p3: '登場人物が言っている内容と印刷業者が間違っている内容が同じページ上で混在しています。 {staff} は、そのうちのいくつかを個別にエミリーの前に置きます。彼女は 1 つの綴りを声に出して読み、ペンを持っている人に読み終わるまで待つように頼みます。エミリーは、守ってほしい言葉を丸で囲みます。彼女は葉を折り、角を少しだけ見せて再度見つけます。'
        p2: '{staff} は、エミリーが指定した場所で初版を開きます。彼女は破線に指を置き、{staff} は緩いシートにページ番号と修正内容を書き込みます。彼女はシートを横に引っ張って確認します。 2 つの数字が密集しており、彼女はそれらの間にスペースを作ります。'
        p1: '{staff} は、名前と本のタイトルの両方が記載されているページの文字を抽出し、検証可能なセットを切り取ります。シャーロットとアンは何か持っていきたいものがあります。袋から2枚のシートが滑り始めます。シャーロットはそれを閉じる前に、アンの名前が記されたものを思い出します。'
      outcomes:
        all: '牧師館には 2 つのリストが保管されています。1 つは次の版用で、もう 1 つは古い本の中にあります。その冬、壁際の椅子はエミリーが求めた場所にそのまま残りました。'
        p4: '家族は彼女の希望通りに整えられたコーナーを後にする。ランプが近づくまでに、本はまだ手の届くところにあります。'
        p3: '次の版の準備中、シャーロットは最初に折り目を見つけ、次にエミリーのサークルを見つけます。'
        p2: '後の校正者は、ページ番号から最初の印刷の行まで直接進むことができます。'
        p1: 'ロンドンでは、姉妹は別々に書類を提出しました。出版社は、まとめられていたタイトルを分割しなければなりません。'
      none: '初版は棚に戻ります。ページ間のシートはまだ未完成です。'
      not_admitted: '{staff} は牧師館には決して入りません。ベランダの下には湿った雪が少し残っています。'
      desync: 'ロンドンに行く書類は一つの山にまとめられたままだ。オフィスが {staff} をリコールしたとき、マークされた 2 枚の伝票はまだ一緒に眠っていました。'
      excerpts:
        p4: '誰かがもう一方の椅子を奪い始めます。エミリーは手を挙げて、それがどこにあったかを指さします。'
        p3: 'エミリーは、守ってほしい言葉を丸で囲みます。彼女は葉を折り、角を少しだけ見せて再度見つけます。'
        p2: '彼女はシートを横に引っ張って確認します。 2 つの数字が密集しており、彼女はそれらの間にスペースを作ります。'
        p1: '袋から2枚のシートが滑り始めます。シャーロットはそれを閉じる前に、アンの名前が記されたものを思い出します。'
    relic: '犬の首輪'
    relic_desc: '牧師館のマスティフの使い古された革の首輪。'
    points:
      p1: 'ロンドンの手紙でベル家の本がごちゃ混ぜになったときは、姉妹が各著者の作品を特定する書類をまとめるのを手伝ってください'
      p2: 'プリンターのエラーによって行が変更された場合は、後のプリンターがチェックできるように、エミリーが修正を残すのを手伝います。'
      p3: 'エミリーはキャラクターがどのように話すかを確認できる一方で、後の版のために方言のコピーを準備してもらいます。'
      p4: 'エミリーにどのような助けを喜んで受け入れるかを尋ね、どこで誰と一緒に休むかを彼女に選択させてください'
    points_fail:
      p1: '手紙では依然として、その本が一人のペンネームによるものであるとされており、姉妹たちはロンドンに個別の証拠を提出することができない。説明は失われ、事務所は従業員を召還した。'
      p2: '次のプリンタは、どの読み取り値が意図的なものであるかを推測する必要があり、エラーは引き継がれます。'
      p3: '彼女の家族は、この本が再発行される際にどの行を変更するかを決める必要があるが、著者がどの綴りを希望したかを確認する方法はない。'
      p4: '彼女の家族は、彼女が階段で疲れることを知っています。彼女がどのような助けを望んでいるのかを知る前に、彼らはまだ彼女が尋ねるのを待たなければなりません。'
    shift:
      p1:
        was: '1848年7月、シャーロットとアン・ブロンテはハワースからロンドンへ行き、ベルのペンネームは別の作家のものであることを出版社に説明した。'
      p2:
        was: '1847 年の『嵐が丘』には印刷ミスが含まれていました。 1850 年の新版では訂正が行われました。'
        now: '{staff} は、エミリーにマークするコピーを残し、ページ参照で特定したエラーを書き出します。'
      p3:
        was: 'エミリーは 1848 年にハワースで亡くなりました。シャーロットは 1850 年版を編集し、方言の綴りをいくつか変更しました。'
        now: '{staff} は、方言のページをエミリーの前に別に置き、印刷エラーとは別に、エミリーが承認したスペルを記録します。シャーロットは次の版を準備するときにそのコピーを持っています。'
        who: 'emily_bronte_haworth'
        bio: 'エミリーは、自分の手で方言をチェックした注釈付きの『嵐が丘』のコピーを残しました。後の印刷業者は、彼女がキャラクターの声を書いた方法を保存できるようになりました。'
      p4:
        was: '1848年12月19日、エミリーはハワース牧師館で亡くなった。彼女は病気のため医師の診察を拒否し、死ぬ日にのみ同意した。'
        now: 'この分岐では、{staff} が彼女に選択する代わりに尋ねます。エミリーは、家族が彼女の周りで生活を続ける間、休む場所と近くに滞在する人を選びます。'
    vignettes:
      witness: '読者は、物語を語る人がすべてを見ていたと思います。あなたは、彼女が特定の詳細をどうやって学んだのかと尋ねます。彼らはその文を、それを提供した話者まで遡ります。'
      voices: '読者はページ全体に一つの声を与えます。ネリーが引き継いだ場所から再試行するように依頼します。聞き手は、ある話者が別の話者にストーリーを伝えているときを知ることができます。'
      mark: '語り手が変わる時点でスクラップを残します。読者は、後の文章が聞いたことと矛盾するかどうかを判断する前に、その文章に戻ります。'
  qu_yuan_miluo:
    name: '川辺の詩句'
    place: '汨羅江'
    figure: '屈原'
    story: '『楚の歌』には、屈原と漁師との文学的交流である『漁師』が伝えられています。記録にある後の伝記にも、対話のバージョンが保存されています。'
    story_prose:
      opening:
        - '楚の川岸にて。 『楚歌』の読者は、追放された屈原の詩とされる詩や、彼が水辺で漁師に出会った記述を知っているでしょう。'
        - '受け取った記録には、彼が沼地で顔を描きながら朗読していることが記載されている。この支部では、誰かが詩の束を 1 つ未完成のまま持ち去ろうとしています。'
        - '本や川渡りに詳しい人が助けてくれるでしょう。静かな場所を見つけてそこに食事を残すことができる人も同様です。'
      points:
        p2: '{staff} は食べ物を売っている人に場所を開けておくよう頼み、ボウルを置き、脇に歩きます。屈原は座って伝票を左手に置く。彼は少し食べてから自分で取り出す。彼はもう一度その行を読みます。ドアの近くに座っていた人が部屋の奥へ移動します。'
        p1: '川を渡る人々が荷造りをしている。 {staff} は 屈原 にどのバンドルを保持してもらいたいかを尋ね、コピーする人に最後の行を読み返すように依頼します。屈原は他の二人の間にある伝票を見つけ、その場所に置きます。キャリアはコードを後ろに通し、結び目を外側に残します。次回束を開いたときに、手がそれを見つけることができます。'
      outcomes:
        all: '運送業者が荷物を引き取ります。船上で食事をしながら聞いたセリフを今でも覚えており、その時初めてコピーを開いてそれを見つけた。'
        p2: 'ボウルが片づけられた後、まだそこにいる人々はもう少し滞在します。静かな中で屈原は再び同じ伝票を取り上げる。'
        p1: 'コピーは下流に進みます。担ぎ手が座ると、結び目を最も近い手に向けて回転させます。'
      none: '食事のために出された場所は空のままです。暗くなると風でマットの角が持ち上がります。'
      not_admitted: '{staff} は食事のために用意された場所を決して見つけられません。渡し守は板を引き込みますが、水はまだその下を流れています。'
      desync: '2枚の伝票の間でコピーの一部が欠けています。代理店が {staff} に折り返し電話したとき、運送業者は海岸に到着したところです。'
      excerpts:
        p2: '彼はもう一度その行を読みます。ドアの近くに座っていた人が部屋の奥へ移動します。'
        p1: 'キャリアはコードを後ろに通し、結び目を外側に残します。次回束を開いたときに、手がそれを見つけることができます。'
    relic: '詩句を書いた竹簡'
    relic_desc: '長い詩が数行書かれた竹片。'
    points:
      p1: '屈原 にどの束をコピーしてほしいかを尋ね、人々が去っている間に読者がそれらの詩をまとめておくのを手伝ってください'
      p2: '屈原に食事と座る場所を提供し、彼の詩を朗読したいなら聞いてください'
    points_fail:
      p1: '読者は 2 枚の紙の間に隙間を残して立ち去ります。コピーが同期しなくなった場合、事務局は {staff} をリコールします。'
      p2: '食事の準備はできていますが、座る場所は占有されています。彼に静かな時間を提供する機会はありません。'
    shift:
      p1:
        was: '屈原の作とされる詩は『楚歌』に収録されている。ここで想定されている引き継ぎは、読者が一連の詩をまとめておく方法の 1 つです。'
      p2:
        was: '『大歴史家の記録』によると、亡命中の屈原は髪を束ねず、顔はやつれ、体は衰弱した状態で湿地の岸を歩いていたという。'
        now: 'この支店で屈原は食事を受け入れます。彼は詩の束を傍らに置き、出発する前にどの詩を声に出して読むかを決めます。'
    vignettes:
      two_tales: '渡し守はあなたが連れてきた結末とは異なる結末を聞きました。彼らがそれを話しているのを聞き、セリフを比較する前に、それが誰の話であるかをマークします。'
      refrain: '物語の中の質問の後、渡し守は鼻歌を歌い始めます。曲が終わるまで待ってから、その単語をどこで最初に聞いたかを尋ねます。'
      wait: 'フェリーが待っている間、あなたは窓口係に、二人が最初に話した場所に戻るように頼みます。陸上では、誰が最初に質問したかを今でも覚えています。'
  sima_qian_changan:
    name: '刑を受けたあとに書かれた史書'
    place: '長安'
    figure: '司馬遷'
    story: '『漢書』には司馬遷が任安に宛てた手紙が保存されており、その中で司馬遷は歴史的著作の目的と構成について論じている。'
    story_prose:
      opening:
        - '長安、紀元前98年頃。司馬遷は李陵を代弁した後投獄される。レン・アンへの手紙を振り返ると、彼は当時、自分の歴史がまだ草稿にすぎなかったことを思い出します。'
        - '歴史上、家族は刑を償還するための費用を支払うことができませんでした。彼は処罰され、後にその歴史に幕を閉じた。この支店では、誰かが自宅でバラバラになったページを管理することができ、誰かが責任のある事務員に嘆願書を提出しようとしています。'
        - 'それには、ドラフトを特定できる人、囚人の日常的なニーズに対応できる人、そして複数の世帯の約束を 1 つのオファーにまとめることができる人が必要です。'
      points:
        p3: '{staff} は、支援したい人にテーブルで何を寄付できるかを尋ね、請願書とお金を事務員に持ってきます。店員はそれを数え、受け取った重複にマークを付けます。数日後、司馬遷は帰宅すると、まずランプを灯します。彼は一番上の束をほどき、角が押さえられていた葉っぱを持ち上げて、書き続けます。'
        p2: '{staff} は配達物を受け取る場所に食料と着替えを持って行き、カウントされるまで待ちます。司馬遷は束を広げ、厚い衣服を足に置きます。食べ物はまだ温かいです。彼はボウルを膝の間に置き、かがんで食べます。'
        p1: '彼の家族はテーブルを片づけました。 {staff} は、束の端に表示される開始線を確認し、ずれた葉を元の位置に戻し、束を同じ順序に戻すように要求します。最後の束が閉じる前に、誰かがラベルを外側に向けます。最初に他のすべてを移動しなくても、次のものが見つかります。'
      outcomes:
        all: '原稿は家にあります。戻ってくると、司馬遷は中断したところから再開でき、誰かがランプを補充するためにドアのそばで待っています。'
        p3: '請願は受理される。後で誰かが助けを求めて電話をかけてきたとき、司馬遷はひじをつかんで束を動かし、訪問者のためのスペースを作りました。'
        p2: '厚い衣服は彼のそばにあります。他の人たちが去った後、彼は再びそれを自分の周りに巻き付けることができます。'
        p1: 'テーブルを見る人は席を立つ前にラベルをもう一度確認します。各バンドルはまだ所定の位置にあります。'
      none: '玄関先にいた人たちが帰った後も、空になったテーブルにはランプが灯っています。'
      not_admitted: '{staff} は配達を受け取る店員に会うことはありません。彼らが持ってきたものは外に残ります。'
      desync: '緩んだ下書きを元に戻すことはできません。オフィスが {staff} をリコールすると、テーブルには緩んだコードだけが残ります。'
      excerpts:
        p3: '数日後、司馬遷は帰宅すると、まずランプを灯します。彼は一番上の束をほどき、角が押さえられていた葉っぱを持ち上げて、書き続けます。'
        p2: '食べ物はまだ温かいです。彼はボウルを膝の間に置き、かがんで食べます。'
        p1: '最後の束が閉じる前に、誰かがラベルを外側に向けます。最初に他のすべてを移動しなくても、次のものが見つかります。'
    relic: '一束の竹簡'
    relic_desc: '紐で結ばれた伝票には文字列が書かれています。'
    points:
      p1: '司馬遷が投獄されている間、彼の歴史に関する未完の草稿をすべて自宅に整理整頓して保管してください'
      p2: '食料と衣類を刑務所に持ち込み、看守による最悪の屈辱を免れましょう'
      p3: '司馬遷を知る人々に寄付を依頼し、刑が執行される前に役人に申し出を提出する'
    points_fail:
      p1: '彼の家の束は解けて散乱しており、彼が外に出ると隙間風はありません。この支店は歴史にそぐわないものであり、事務所はその従業員を召還した。'
      p2: '刑務所では誰も彼に連絡を取ってはくれないが、この支部では彼は看守たちに頭を下げた、と後に書いている。'
      p3: '家族は貧しく、彼の代わりに話してくれる友人もいない。この部門では、歴史と同様に、彼は自分自身を償還することができず、去勢されます。'
    shift:
      p1:
        was: '紀元前 98 年頃、司馬遷が李陵事件の後に投獄されたとき、彼自身の言葉によれば、司馬遷の歴史は大まかに始まったばかりで、まだ終わっていませんでした。'
      p2:
        was: '紀元前98年頃、司馬遷は李陵を弁護したために投獄されました。レン・アンに宛てた手紙の中で、彼は看守たちの前でいかに自分を卑下しなければならなかったのかについて書いている。'
        now: 'この支店では、{staff} が司馬遷に食料と防寒着を届けます。彼は食事をし、夜は何かに身を包むものを持っています。'
      p3:
        was: '紀元前98年頃、司馬遷は李陵を弁護した罪で有罪判決を受けた。彼の家族は刑を償還するには貧しすぎたので、彼の代わりに代弁してくれる友人は誰もおらず、彼は去勢の罰を受けました。'
        now: 'この支部では、役人は {staff} が集めた人々が申し出た支払いを受け入れます。司馬遷はその罰を免れ、未完の仕事に戻ることができます。'
        who: 'sima_qian_changan'
        bio: 'このタイムラインでは、司馬遷は刑を償還し、去勢されませんでした。彼はまだ自分の日までの過去の歴史を終えました。'
    vignettes:
      dates: '事務員は 1 年以内に 2 つのエントリのマージを開始します。あなたは、彼らにそれぞれのアカウントに日付を残してもらうように頼みます。不一致がどこから始まるかを正確に確認できるようになります。'
      witness: '店員は、より良い話を先に進めたいと考えています。あなたは、各アカウントがどのようにしてデスクに到着したかを尋ねます。読者がどの順序で見るべきかを決定する前に、起源をマークします。'
      binding: '店員がもう一度読んでいる間、両方の伝票を緩めたままにしておきます。バンドルが結ばれると、短いラベルに 1 つの質問がまだ未解決であることが表示されます。'
  du_fu_xiang_river:
    name: '船上の詩人'
    place: '湘江'
    figure: '杜甫'
    story: '杜甫の名で伝えられた詩の見出しは、病気の時に船上で書かれ、湖南省の友人に宛てた詩となっている。この詩は川や海岸の情景を思い出させます。'
    story_prose:
      opening:
        - '770年、翔河沿い。杜甫は湖南省の友人や親族に36韻からなる長い詩を宛てた。その見出しには、彼が病気のときに船上でこの作品を書いたと書かれています。'
        - '詩とその見出しは残っています。どのように配達されたかはわかりません。この支店では家族は何度かページを移動しなければならず、次の着地は決まっていません。'
        - 'それには、患者の休息を手伝うことができる人、ページの管理ができる人、交差点を知っていて受信者の名前を覚えている人が必要です。'
      points:
        p3: '{staff} は杜甫にどこに立ち寄りたいかを尋ね、そこに詩を運んでくれる人を見つけました。杜甫は船の向こう側で、誰が彼らを受け取るべきかをゆっくりと告げる。男は荷物を受け取る前に名前を繰り返した。杜甫は聞いて小さくうなずいた。そうして初めて、家族は包まれたページを横から別の男性の手に渡します。'
        p1: 'ボートは人が通行できるようにする必要があります。 {staff} はシートを数え、杜甫が指示した順序で風の当たらないボードに移動します。杜甫は真ん中のページに手を伸ばし、その最初の言葉を読み上げます。すべてを移動した後も、スペースはまだ残っています。杜甫は誰にも頼まなくても次の葉を引き出すことができる。'
        p2: '{staff}はどちら側に休むのが楽かを尋ね、杜甫を支えている古い布を折り、滑らない場所に水を移動します。彼は少し気を緩め、カップに手を伸ばした。船は一度動きます。カップは音はしますが直立したままです。'
      outcomes:
        all: '船が船着場から離れると、家族は杜甫によって原稿を戻される。 1 部は手の届くところにあり、もう 1 部はすでに出荷されつつあります。'
        p3: 'もう一方のボートで、運搬人はまず紙を置くための乾燥した場所を見つけます。船が通り過ぎるとき、杜甫にはまだ布を包んだ片隅が見えます。'
        p1: '風が当たらない場所ではページは整然としたままです。着地後、杜甫は再びミドルシートを繰り出す。'
        p2: '杜甫は船上でしばし休息する。コップは今でも、探さなくても見つけられる場所にあります。'
      none: '最後のボートが船着き場から出発しました。包まれたページは元の場所に残ります。'
      not_admitted: '{staff} はボートを見つけられません。濡れた係留ロープの列が一本ずつ引き込まれます。'
      desync: '物を移動した後、真ん中の葉が数枚欠けています。代理店が{staff}をリコールしたとき、船頭はまだ最初と最後のシートを持っていました。'
      excerpts:
        p3: '杜甫は聞いて小さくうなずいた。そうして初めて、家族は包まれたページを横から別の男性の手に渡します。'
        p1: 'すべてを移動した後も、スペースはまだ残っています。杜甫は誰にも頼まなくても次の葉を引き出すことができる。'
        p2: '船は一度動きます。カップは音はしますが直立したままです。'
    relic: '船頭のオイルランプ'
    relic_desc: '数行の詩が遅れて点火した小さな粘土のランプ。'
    points:
      p1: '湖南省の友人たちに宛てた長い詩をまとめることができるように、船上に杜甫のページを置く場所を確保しておきます。'
      p2: 'ボートの上で彼の病気を看病し、痛みを和らげる'
      p3: '杜甫に次にどこに立ち寄りたいかを尋ね、完成した詩を友人に引き継いでくれる人を家族が見つけるのを手伝ってください。'
    points_fail:
      p1: '急いで移動した後、最初と最後の葉だけが現れます。詩を組み立てることができず、事務所は従業員を呼び戻す。'
      p2: '冬の船の中で枕に横たわり、日に日に症状は悪化していきます。'
      p3: '家族が詩を引き取ってくれる人を見つける前に、次の船は出発します。彼らはそれを別の踊り場まで運ばなければなりません。'
    shift:
      p1:
        was: '770 年、病気で船上にいた杜甫は、湖南省の友人や親族のために、タイトルどおり 36 韻の詩を書きました。'
      p2:
        was: '杜甫が湖南省の友人に宛てた詩には、船上で病気になりながら執筆する様子が描かれている。'
        now: 'その冬、船上での苦しみは軽減された。'
      p3:
        was: 'この詩は湖南省の友人たちに宛てたもの。その見出しには、どのようにして彼らに到達したかの記録がありません。'
        now: 'この分家では、家族は杜甫が選んだ立ち寄り地となる。踊り場にいる誰かが、次の聖句のコピーを持っていくことを申し出て、それを受け取る人の名前を繰り返すことができます。'
    vignettes:
      shore: '旅人は海岸が暗いように見えると書いています。あなたは、なぜ彼らがボートから顔を上げたのか尋ねます。彼らは立ち止まり、実際にそこにあったものを一つ書き留めます。'
      delivery: '次の船は友人の町まで途中までしか行かないと聞きました。旅行者は、二人目の名前が書かれていないメモを折り畳むところだった。あなたは彼らがそれを引き継いでくれる人を見つけるのを手伝います。'
      damp: '旅行者は、スプレーがボードに到達した場所にメモを置きます。彼らが挨拶を書き終える間、あなたはその下に乾いたスクラップを置きます。'
  vesalius_padua:
    name: '同じ図版の二つの版'
    place: 'レーゲンスブルク'
    figure: 'アンドレアス・ヴェサリウス'
    story: '1546年にレーゲンスブルクで書かれた手紙の中で、ヴェサリウスは自分のイラストをコピーして縮小した版を批判した。彼は、コピーされた図の一部が歪曲されていることに反対した。'
    story_prose:
      opening:
        - 'レーゲンスブルク、1546 年 6 月。ヴェサリウスは同僚に、自分のイラストをコピーした別の本について手紙を書いています。彼は規模の縮小に反対し、その路線の一部に疑問を抱いている。'
        - '歴史の中で、彼の手紙はそれらの反対意見を保存しました。その後の比較では、すべての反対意見が実質的な違いに対応しているわけではないことが判明しました。この支店では、書店員が発送すべき本をまだ山積しています。'
        - '2 つのエディションを認識できる人が助けてくれるでしょう。また、発売前に各冊に同じメモを入れるように書店員を説得できる人も必要です。'
      points:
        p1: '{staff} は両方の版をカウンターに並べ、数字が単に小さい箇所と、ヴェサリウスが具体的な異議を唱えた箇所をマークしています。書店員は、どの主張が自信を持って言えるかを尋ねます。チェックされていない部分は取り消し線を引いて、読者が調べられるページ番号を残します。書店員は一番上の本を開いて、皿の横にメモを滑り込ませます。本を閉じると、薄い白い端がまだ見えます。'
      outcomes:
        all: '本が発売されると、読者の 1 人が伝票のページ番号を使用して別の版を借ります。両方の人物がテーブルの上に横たわっており、同じペンを横に置いています。'
        p1: '本が発売されると、読者の 1 人が伝票のページ番号を使用して別の版を借ります。両方の人物がテーブルの上に横たわっており、同じペンを横に置いています。'
      none: '書店員が最後の束を結びます。書きかけの伝票は今もカウンターの下にある。'
      not_admitted: '{staff} は書店員に会うことはありません。サンプルは皿の上に開いた状態で置かれており、カウンターを通過する顧客によって軽く回転されます。'
      excerpts:
        p1: '書店員は一番上の本を開いて、皿の横にメモを滑り込ませます。本を閉じると、薄い白い端がまだ見えます。'
    relic: '2つのマークが付いた証明'
    relic_desc: '2 つのエディションに別々のマークが付いた想像上の版画。'
    points:
      p1: '書店に、まだ在庫がある版に係争中の版を特定するメモを同封してもらいます'
    points_fail:
      p1: '従業員は販売会社と合意に達せず、コピーはそのシートなしで出荷された。'
    shift:
      p1:
        was: '1546年6月13日: ヴェサリウスはレーゲンスブルクから手紙を書き、コピーされた数字の歪みであると考えたものを批判した。'
        now: '{staff} は、販売代理店に、係争中のプレートを特定し、読者にオリジナルを示すシートを同封してもらいます。'
        who: 'vesalius_padua'
        bio: 'コピー版の読者は、ヴェサリウスが異議を唱えた数字を特定するメモを受け取りました。'
  shakespeare_globe:
    name: '父への伝言'
    place: 'ストラトフォード アポン エイボン'
    figure: 'ウィリアム・シェイクスピア'
    story: 'ストラトフォードの登記簿には、ハムネット・シェイクスピアの1596年8月11日の埋葬が記録されているが、埋葬前に彼の父親がどこにいたのかは記載されていない。この支部では、ある世帯が彼にメッセージを届けるのに協力を求めています。'
    story_prose:
      opening:
        - 'ストラットフォード・アポン・エイボン、1596年8月。教区名簿には少年の名前と埋葬日が記録される。ハムネットは11歳です。'
        - '歴史上、ハムネットは 8 月 11 日に埋葬されました。登録簿には父親の帰還の日付が記載されていない。この支店では、家族が手紙を折り、暗くなる前に誰かが受け取ってくれることを願っています。'
        - '旅行者が立ち寄る場所を知っている人がここで助けてくれるかもしれません。見知らぬ人に手紙を使ってもう少し先へ進むよう説得できる人も同様です。'
      points:
        p1: '{staff} は、次に立ち寄る場所を知っているメッセンジャーを見つける前に、ドアで 2 回尋ねます。メッセンジャーは外側に書かれた名前を読み、それを乾いた内側のポケットに滑り込ませます。ウィリアムが帰宅してもハムネットはまだ起きています。少年はベッドの端に父親のための小さなスペースを作るために移動します。'
      outcomes:
        all: 'ウィリアムは窓が暗くなるまでそこに座っています。彼は水を飲みに立ち上がるとき、帰り道に見つけられるように椅子を近づけます。'
        p1: 'ウィリアムは窓が暗くなるまでそこに座っています。彼は水を飲みに立ち上がるとき、帰り道に見つけられるように椅子を近づけます。'
      none: '夕暮れが玄関口に届きます。折りたたんだ手紙はまだカップの下にあります。'
      not_admitted: '{staff} は彼らが待っている家には決して入りません。誰かがドアを通り過ぎます。開かない。'
      excerpts:
        p1: 'ウィリアムが帰宅してもハムネットはまだ起きています。少年はベッドの端に父親のための小さなスペースを作るために移動します。'
    relic: '折りたたまれたメッセージ'
    relic_desc: '持参者が次に助けてくれる人の名前を書き加えられる場所を備えた想像上の手紙。'
    points:
      p1: 'シェイクスピアと連絡を取り、訪問に間に合うように家族のメッセージを伝えることができる人を見つけてください。'
    points_fail:
      p1: '従業員は、時間内にメッセージを届けると約束できる人を見つけられませんでした。'
    shift:
      p1:
        was: '1596年8月11日：ハムネット・シェイクスピアはストラトフォード・アポン・エイボンに埋葬された。登録簿には、父親が事前に一緒にいたかどうかは記録されていない。'
        now: '{staff} はシェイクスピアに連絡できる使者を見つけます。この支店では、彼は息子と夜を過ごすために間に合うように帰宅します。'
        who: 'shakespeare_globe'
        bio: 'ウィリアム・シェイクスピアは、息子が亡くなる直前にハムネットと一夜を過ごすことができました。'
  timbuktu_sankore:
    name: '出発する隊商に加わる場所'
    place: 'トンブクトゥ、マリ'
    figure: 'トンブクトゥの学者たち'
    story: '1468 年頃にトンブクトゥが政権を交代すると、学者たちは都市を離れてワラタなどの場所へ向かいました。この支部では、ある世帯が一緒に出発する予定のグループがいる場所を必要としています。'
    story_prose:
      opening:
        - '1468 年頃、トンブクトゥは政権を交代しました。後の年代記作者は、学者の家族が都市を去り、一部はワラタに行ったと回想している。'
        - '歴史上、年代記には出発したグループが記録されています。この支店では、1 つの世帯がすでに荷造りを行っていますが、いくつかの水袋にはまだマークが付けられていません。どの党が待っているかは分からない。'
        - '旅行グループがどのように組織されるかを理解している人が助けてくれるでしょう。彼らは誰がまだ期待されているかを見つけて、家族と一緒に最初の段階を歩む必要がある。'
      points:
        p1: '{staff} は、ガイドが待つことに同意するまで、あるパーティから別のパーティへと移動し、その後戻ってきて、家族が水と束を数えるのを手伝います。最初の目的地で、別の家族がマットを広げます。一番小さい子は、家の一番小さい水袋を持ってきて、2枚のマットの間に置きます。手を放しても、水袋は倒れません。'
      outcomes:
        all: '翌朝、隣り合った2枚のマットが丸められます。最初に小さなバッグが手渡され、その後誰かが子供を持ち上げます。'
        p1: '翌朝、隣り合った2枚のマットが丸められます。最初に小さなバッグが手渡され、その後誰かが子供を持ち上げます。'
      none: '誰かが戻ってきて尋ねたときには、最後のグループは去っていました。家族は結んだ束をドアから運び戻します。'
      not_admitted: '{staff} では世帯が見つかりません。ドアの横で、誰かが 2 つの水袋を一緒に移動させます。'
      excerpts:
        p1: '一番小さい子は、家の一番小さい水袋を持ってきて、2枚のマットの間に置きます。手を放しても、水袋は倒れません。'
    relic: '水袋の数を控えた札'
    relic_desc: '家庭に預けられた水袋を数えるために使われる想像上の集計表。'
    points:
      p1: '出発するキャラバンと一緒に 1 世帯の場所を見つけ、最初の安全な停留所までエスコートします。'
    points_fail:
