      p2: 'この支部では、公布が行われるまで、人々が新しい文字を使用しているのを彼は一度も見たことがありませんでした。'
      p3: '彼は歴史上そうであったように、目は良くならずに宮殿に戻った。'
    shift:
      p1:
        was: '1444 年の第 2 月に、韻文本『雲輝』を新しい文字で翻訳するための名誉の殿堂の作業が続けられました。'
      p2:
        was: '1446年に新しい文字は訓民正音と宣言され、世宗は4年後に亡くなった。'
        now: '椒井の旅行宮の外にある露天商が自分の名前を書くことを覚えたところ、誰かがそれを朝廷に報告した。'
      p3:
        was: '世宗は何年も目を患い、1444年の春に椒井に行って回復したが、それ以来衰弱して1450年に亡くなった。'
        now: '椒井の泉のそばにいた見知らぬ人が目を少し良くし、その夏に宮殿に戻ったときも、記念碑や新しい文字の校正刷りを自分で読むことができました。'
    vignettes:
      gesture: '{staff} は、学者が文字を描く前に唇の形を整え、その横の余白に口の形をコピーするのを観察しています。'
      spacing: '{staff} は、各音節の部分が 1 つの正方形に収まるようにシートを正方形に罫線し、何も言わずにテーブルの上に置きます。'
      lesson: '{staff} は市場で子供のために棒で埃の中に 3 文字を描き、子供はそれを音として読み返してから走り去ります。'
    story_prose:
      opening:
        - 'ソウル、1443年。世宗は新しい文字を28字作りました。朝鮮語は口に出せても、その言葉を紙に書くには話し言葉とは異なる文字を習わなければなりません。世宗は、日々の言葉をそのまま紙に書けるようにしたいと考えています。'
        - '史実では1444年の第2月、新しい文字で書物を訳す作業が宮中で進むなか、集賢殿の学者たちが連名で反対の上疏を出しました。その春、世宗は目を休めるために椒井へ赴き、以後は年々体調を崩していきます。この分岐では、椒井の行宮の外に露店を出す女がいます。帳簿はきちんとつけていますが、署名するときはいつも人に筆を渡します。'
        - 'この旅では 3 種類の人が助けてくれます。書類を安全に保管できる人、一画一画読むことを喜んで教えてくれる人、そして医学に精通していて適切な治療法を持ってくる人です。'
      outcomes:
        all: 'その夏、宮中に戻った世宗には、まだ文字がはっきりと見えました。露店の女が署名した紙は誰にも下げさせず、新しい文字の校正刷りの一番上に置きました。'
        p2: '椒井の行宮の外で、露店の女が帳簿の最後に初めて自分の手で名を書きました。'
        p3: 'その夏、宮中に戻った世宗は、上疏をまだ自分で読むことができました。新しい文字の校正刷りを一枚ずつ、最後までめくりました。'
        p1: '集賢殿に再び灯がともりました。新しい文字で綴った『韻会』が、頁を重ねていきます。'
      none: '事務所へ戻っても、{staff}は露店の女が筆を差し出したときのことを覚えていました。手は空中でしばらく止まり、それからようやく誰かに筆を渡しました。'
      desync: '上疏のあと、新しい文字の紙は会議の間の床に散らばり、誰も拾いませんでした。{staff}が呼び戻されたとき、一番上の紙には足跡が半分だけついていました。'
      not_admitted: '{staff}は露店の女に新しい文字を教えられるほど長居ができませんでした。女は帳簿を一枚めくりますが、署名はまだ誰かに頼むしかありません。'
      points:
        p1: '上疏が出された頃、会議の間には人が出入りしますが、机の上の紙に気を留める人はいません。{staff}は新しい文字で綴った『韻会』の紙を順に重ね、文鎮を置きます。数日後、集賢殿の学者たちが戻ってきて文鎮を持ち上げます。一番上の紙には、筆を置いたときの続きがそのまま残っています。'
        p2:
          class_teaching: '{staff}は昔からの教え方を使います。まず自分の名を声に出してもらい、それから一つずつ音を文字にします。椒井の行宮の外で、露店の女は自分の名を一度ゆっくりと唱え、その音に合わせて紙に書きます。最後の一画を書き終えると、女は紙の向きを直し、指で押さえて一字ずつ触れます。やがてその紙は行宮に届けられ、世宗は目の前に掲げて長いこと見つめ、誰にも下げさせません。'
          else: '{staff}は露店が閉まる前に毎日しばらく腰を下ろします。急がせず、一画が曲がるたびにもう一度書いてもらいます。椒井の行宮の外で、露店の女は自分の名を一度ゆっくりと唱え、その音に合わせて紙に書きます。最後の一画を書き終えると、女は紙の向きを直し、指で押さえて一字ずつ触れます。やがてその紙は行宮に届けられ、世宗は目の前に掲げて長いこと見つめ、誰にも下げさせません。'
        p3: '椒井で、{staff}は毎日世宗の目の具合を見て、その変化に合わせて薬や目を洗う手当てを調整します。宮中へ戻った世宗は、新しい文字の校正刷りを目の前に掲げます。字は小さく、読むのにも時間がかかりますが、頁をめくるときには誰も呼ばず、自分で手を伸ばします。'
      excerpts:
        p2: '最後の一画を書き終えると、女は紙の向きを直し、指で押さえて一字ずつ触れます。やがてその紙は行宮に届けられ、世宗は目の前に掲げて長いこと見つめ、誰にも下げさせません。'
        p3: '宮中へ戻った世宗は、新しい文字の校正刷りを目の前に掲げます。字は小さく、読むのにも時間がかかりますが、頁をめくるときには誰も呼ばず、自分で手を伸ばします。'
        p1: '数日後、集賢殿の学者たちが戻ってきて文鎮を持ち上げます。一番上の紙には、筆を置いたときの続きがそのまま残っています。'
  basho_hiraizumi:
    name: 'おくのほそ道'
    place: '平泉、日本'
    figure: '松尾芭蕉'
    story: '1689 年の春、松尾芭蕉は弟子の曽良とともに江戸を出発し、北への長い散歩に出かけました。五月十三日、一関から平泉まで行って一日で戻った。北上川の上の高館に登り、執事が中尊寺金堂を案内したが、経堂は留守のため閉まっていた。芭蕉はこの旅を「奥の細道」に変え、この訪問で夏草について詩を詠み、両堂が開かれたと述べています。'
    story_prose:
      opening:
        - '1689 年の夏、日本の北の一関。松尾芭蕉とその弟子曽良が江戸を離れたのは 1 か月以上前です。五月十三日、空は晴れていたので、二人は平泉まで二里歩いて遺跡を見に行き、その日のうちに戻るつもりだった。この旅は後に「奥北への細い道」となりました。'
        - '歴史上、その日、管理人は金堂を案内しましたが、経堂は不在のため閉まったままでした。ソラはそれをそのまま日記に書き留めた。芭蕉は後に両方の堂が開かれたと著書に書いています。この支店では、一関の宿の主人が客の帰りに風呂を沸かしており、街角のポーターは北側の道はすべてぬかるみだと言う。'
        - 'この旅行では 2 種類の人が協力してくれます。道を覚えていて時間を守る人、もう 1 つは何が許可されているかを尋ねて道を教えてくれる人を見つける人です。'
      outcomes:
