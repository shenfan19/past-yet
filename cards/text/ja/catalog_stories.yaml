  pushkin_st_petersburg:
    name: '番地が付く前の場所'
    place: 'サンクトペテルブルク'
    figure: 'アレクサンドル・プーシキン'
    story: '1836 年と 1837 年、アレクサンドル プーシキンは、ヴォルコンスカヤ王女の家のコニュシェニー橋のそばのモイカ堤防にあるアパートに住んでいました。旧暦では1837年1月27日、新暦では2月8日、彼は黒川沿いでジョルジュ・ダンテと決闘し、腹部を撃たれた。彼は家に運ばれ、新暦の1月29日と2月10日にそこで亡くなった。彼はミハイロフスコエの実家の近くで母親の隣に埋葬されている。'
    story_prose:
      opening:
        - 'サンクトペテルブルク、新暦で 1837 年 1 月。アレクサンドル・プーシキンとその家族は、コニュシェニ橋のそばのモイカ堤防にあるヴォルコンスカヤ王女の家の中に住んでおり、ドアにはまだ今日の番号が付いていません。彼は詩で『エフゲニー・オネーギン』を書き、現代ロシア文学の創始者とみなされることが多い。'
        - '歴史上、彼の借金はその冬の間ずっと増えていった。新暦の2月8日、彼は黒い川のほとりでジョルジュ・ダンテと決闘し、腹を撃たれて家に連れ戻され、その2日後に腹膜炎により37歳で妻と4人の子供を残して亡くなった。皇帝は後に借金を返済した。この支店では、アパートへの道を尋ねる者は皆ポーターに尋ねます。また、家のメイドが橋の向こう側までお使いを送り届けることもよくあります。'
        - 'この旅行では、数種類の人が手伝ってくれます。口座を管理できる人や取引をしたことがある人、または山積みの請求書を整理してくれる秩序正しく機知に富んだ人です。医学に詳しい人、または救急セットを持っていて危機に瀕しても動じない人。抗生物質を持ってきた医師、またはナノ医療キットを持った医師。'
      outcomes:
        all: '2月が終わったとき、プーシキンはまだモイカのそばで療養中であり、彼の机の上の請求書は1枚のリストになっていた。彼はさらに数年間執筆を続け、『ザ・コンテンポラリー』は彼の手元に残りました。'
        p3: '2月が終わったとき、彼はまだモイカのそばで回復中で、壁に手をついて窓の方まで歩くことができた。さらに数年間、『The Contemporary』は彼の手に留まりました。'
        p1: 'リストはインク壺の下に残っていました。その後、家計は一度に 1 品ずつ消費しました。'
        p2: '彼は生きてモイカの家に帰り、書斎に運ばれ、そこのソファに横たわりました。ホールでは、ニュースを求める人々が通りまでずっと立っていた。'
      none: '新暦2月8日の夜、雪の降るブラック川沿いで、彼は命を落として街に到着した。紙幣の山はまだ手つかずのまま机の上に置かれていました。'
      desync: '新暦2月8日の夕方、市内に戻る途中で馬車は沈黙した。 {staff} がリコールされたとき、ドアが半分開いた状態で雪の中に立っており、手袋が地面に置かれていました。'
      not_admitted: '{staff} は一度も家には入らず、ポーターと一緒に橋からモイカ川に沿って一度歩いただけで、道順を教えるときに名前を付けて曲がり角を数えました。ポーターは、最近道を尋ねる人が増えており、全員が橋のそばの家を探していると語った。'
      points:
        p1:
          class_lettered: '新暦では1月下旬、書斎の机の上にはプリンターからの家賃や店のクレジットなどの紙幣の山が折り重なって置かれていた。デスクワークに慣れている{staff}は、それらを1つずつ広げ、日付と合計を1つのリストにコピーし、それぞれの横にどれを最初に支払うか、どれを待つことができるかをマークしました。プーシキンはリストを受け取り、しばらく眺めてからインク壺の下に置きました。お札の山は束ねられて引き出しの中にしまってあった。'
          class_trade: '新暦では1月下旬、書斎の机の上にはプリンターからの家賃や店のクレジットなどの紙幣の山が折り重なって置かれていた。 {staff}は、ある程度の取引経験があり、店の仕組みを知っており、債権者ごとに請求書を山に分類し、どれが待つか、どれが待たないかのそれぞれについて伝票を書き、それらをすべて1つのリストにコピーしました。プーシキンはリストを受け取り、しばらく眺めてからインク壺の下に置きました。お札の山は束ねられて引き出しの中にしまってあった。'
          else: '新暦では1月下旬、書斎の机の上にはプリンターからの家賃や店のクレジットなどの紙幣の山が折り重なって置かれていた。 {staff} は慎重な性格で、請求書を支払期日の順に並べ、単一のリストにコピーし、金額を 1 行ずつチェックしました。プーシキンはリストを受け取り、しばらく眺めてからインク壺の下に置きました。お札の山は束ねられて引き出しの中にしまってあった。'
        p2:
          class_medical: '新暦2月8日の夜、雪の降るブラック川沿い。ダンテスが最初に発砲した。プーシキンさんは腹部を殴られ大量の出血を負い、急いで市内に戻る馬車に助け込まれた。応急処置の訓練を受けた{staff}は馬車の中でひざまずいて傷口を押さえ、清潔な布を重ねてしっかりと詰め、時々脈拍を感じ、ずっと手を離さなかった。馬車はモイカ号のドアで止まり、ポーターはランプを持って走り出した。プーシキンは運び込まれ、書斎のソファに横たわったが、コートについた雪はまだ溶けていなかった。'
          else: '新暦2月8日の夜、雪の降るブラック川沿い。ダンテスが最初に発砲した。プーシキンさんは腹部を殴られ大量の出血を負い、急いで市内に戻る馬車に助け込まれた。 {staff}は持参した救急箱を開け、傷口にガーゼを当て、下にもコートを敷き、馬車が揺れるたびに手で体を支えた。馬車はモイカ号のドアで止まり、ポーターはランプを持って走り出した。プーシキンは運び込まれ、書斎のソファに横たわったが、コートについた雪はまだ溶けていなかった。'
        p3:
          class_learned: '新暦では2月9日。彼は一晩中書斎のソファに横たわっていました。傷口は熱くなり、彼は痛みに耐えながら歯を食いしばった。医師の{staff}さんは、傷口が感染しているのを見て、清潔にし、持参した薬を投与し、新しいガーゼを当てて、1時間に1回診察した。2月10日の午後、彼の熱は下がりました。彼はコップ一杯の水を求め、自分で抱えて二口飲みました。窓の外ではモイカが凍っていて、人々が橋を歩いて渡っていました。'
          else: '新暦では2月9日。彼は一晩中書斎のソファに横たわっていました。傷口は熱くなり、彼は痛みに耐えながら歯を食いしばった。医学の訓練を受けた{staff}さんは、持参した医療キットを開け、指示に従って薬を投与し、1時間に1回体温を測りながら様子を観察した。2月10日の午後、彼の熱は下がりました。彼はコップ一杯の水を求め、自分で抱えて二口飲みました。窓の外ではモイカが凍っていて、人々が橋を歩いて渡っていました。'
      excerpts:
