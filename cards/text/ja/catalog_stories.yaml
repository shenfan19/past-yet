      p3: '彼女の病気は歴史のように進行します。彼女は11月23日に結核のため24歳で亡くなった。'
    shift:
      p1:
        was: '「たけくらべ」は７回に分けて連載されました。文芸倶楽部は1896年4月10日に改訂版を併刷した。'
