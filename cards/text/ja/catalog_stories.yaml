  mary_anning_lyme_regis:
    name: '崖に埋まった骨'
    place: 'ライム・レジス'
    figure: 'メアリー・アニング'
    story: '1811年頃、メアリー・アニングの弟ジョセフはライム・レジスの崖で魚竜の頭蓋骨を発見し、1812年11月にメアリーは長さ約5メートルのその骸骨を掘り出した。 1823 年 12 月に彼女は首長竜の最初の完全な骨格を発見し、1828 年 12 月にはイギリスで最初の翼竜が発見されました。彼女は 1847 年に 47 歳で亡くなりましたが、まだお金がありませんでした。彼女の発見物について書かれた論文に彼女の名前が記載されることはほとんどありませんでした。'
    relic: 'アンモナイト'
    relic_desc: '青いリアから分かれたコイル状の化石の殻。'
    points:
      p1: '12月10日、首長竜を崖の下に安全に保管し、次の秋と引き潮の前に丸ごと取り出します。'
      p2: 'ロンドンに送られたスケッチが疑問に耐えられるように、彼女が長い首の骨を数えて骨ごとに描くのを手伝ってください。'
      p3: '生きている間に、これらの骨にいつか彼女の名前が付けられることを彼女に知らせてください。'
    points_fail:
      p1: '引き潮で骨格の半分が持ち去られ、この枝には最初の完全な首長竜は存在しない。'
      p2: 'この支部では、12 月 26 日のスケッチがそのまま進行し、首の骨に 2 番目のチェックマークが付けられませんでした。'
      p3: 'この支店で彼女は自分が覚えられていることをまだ知りませんでした、そしてその冬誰も彼女に言いませんでした。'
    shift:
      p1:
        was: '1823年12月、メアリー・アニングは崖の下から首が体よりも長い骸骨全体を取り出した。'
      p2:
        was: '1823年12月26日、彼女は首長竜の絵をそのままロンドンに送った。'
        now: 'ロンドンに届いたスケッチのすべての首の骨には番号が付けられており、後で疑問が生じたとき、その図面にはすでに答えが示されていました。'
      p3:
        was: 'メアリー・アニングは 1847 年に 47 歳で亡くなりましたが、まだお金が足りず、彼女が発見したものに関する文書には彼女の名前がほとんど記載されていませんでした。'
        now: 'その冬、誰かが彼女に、彼女が掘り出した骨には、いつかロンドンの博物館に彼女の名前が刻まれ、ライム・レジスの海のそばに彼女の銅像が立つだろうと告げた。'
    vignettes:
      stone: '{staff} は、線が骨から離れるまで骸骨の首を通過する亀裂をたどり、そこで鉛筆を持ち上げます。'
      vertebrae: '{staff} は、もう一方の端からネックを数えます。2 つのカウントが一致しない場合は、ボーンを追加する代わりに括弧を残します。'
      pose: '{staff} は、助けを借りずに頭が見つかるまでスケッチのコピーを回転し、その下に誰が見つけたかを書きます。'
    story_prose:
      opening:
        - 'ライム・レジス、1823年冬。潮が引いた後、メアリー・アニングは崖の下の骸骨が体よりも首が長いことに気づきました。骨を持ち上げるだけでは十分ではありません。ロンドンの人々は一枚の紙を通してそれを見ることになるが、崖の下に立っている彼女が何を見たのかを理解するには、誰かが岩の亀裂をたどって首の骨を一つ一つ数えなければならない。'
        - '歴史上、アニングは後にスケッチを送りました。この骸骨は有名になったが、これらの発見物について書かれた論文に彼女の名前が記載されることはほとんどなかった。この旅行は、その図面が送信される前に到着します。'
        - 'この旅で助けてくれるのは3種類の人だ。崖の下で力仕事をして、潮が戻る前に骸骨を取り出すことができる人、数えたり、絵を描いたり、骨と岩を区別できる人、そして、座って彼女に届く言葉で彼女と話をしようとする人だ。'
      outcomes:
        all: 'その冬にロンドンへ行ったスケッチには、長い首の横に小さな数字が並んでいて、隅には彼女の名前が手書きで書かれていた。'
        p3: '手紙は以前と同じようにロンドンに送られました。絵の隅にある名前は彼女自身が書いたものでした。'
        p2: 'スケッチがロンドンに届いた後、疑問を抱いた誰かがその図面を受け取り、数字の列に従って頭蓋骨の下から骨を 1 つずつカウントダウンしました。'
        p1: 'その冬、崖の上の小さな家に骸骨全体が横たわり、その首は体よりも長かった。'
      none: '手紙が届いた日、アニングは遅くまで一人でスケッチを書き続けた。長い首は頻繁に引っ張られたりこすられたりしたため、紙は毛羽立ってしまいました。'
      desync: '潮が崖のふもとを覆ったとき、骸骨の一部はまだ取り出されていなかった。リコール前に{staff}が最後に見たのは、首の骨の上に水が迫ってくる姿だった。'
      not_admitted: '{staff} はアニングと一緒に崖の下に降りることはありませんでした。干潮時には、そのふもとにはハンマーを手にした彼女だけがいた。'
      points:
        p1: '潮が引き返す前に、アニングさんと{staff}さんは首の長い骸骨を少しずつ持ち上げ、古新聞で包み、崖の頂上まで運びました。最後の部分がちょうど出発したところで、波が後ろの崖の裾野を覆い尽くしていました。アニングは一度振り返った。水面には泡のほかに何もありませんでした。'
        p2:
          class_learned: 'スケッチを描いている間、{staff} は野帳のルールに従い、反対側から骨を 1 つずつ呼び出し、それぞれの名前を書き留めました。数値が一致しない箇所では、アニングさんは骨の端がどこにあるのかわかるまで、亀裂に沿って長い間観察した。結局、すべての首の骨にはその番号があり、小さな数字が長い首の長さから頭蓋骨の下まで続いていました。'
          class_craft: '{staff} さんはスケッチを描きながら、まず模様をなぞるように亀裂に沿って骨の輪郭を軽くなぞり、次に長い首を反対側の端から数えました。数値が一致しない箇所では、アニングさんは骨の端がどこにあるのかわかるまで、亀裂に沿って長い間観察した。結局、すべての首の骨にはその番号があり、小さな数字が長い首の長さから頭蓋骨の下まで続いていました。'
          else: '彼女がスケッチを描いている間、{staff} が反対側の長い首を数えるのを手伝ってくれました。数値が一致しない箇所では、アニングさんは骨の端がどこにあるのかわかるまで、亀裂に沿って長い間観察した。結局、すべての首の骨にはその番号があり、小さな数字が長い首の長さから頭蓋骨の下まで続いていました。'
        p3: 'スケッチが送られる前に、{staff} は何年も前からロンドンについて語っていました。ロンドンの博物館には、彼女が崖の下から掘り出した骨が展示され、その横にはメアリー・アニングの名前があり、ライムの海沿いには彼女の銅像が立っていたのです。アニングは顔を上げずに聞いていた。手に持っていたペンが絵の隅で一瞬止まり、そこに彼女は自分の名前を書きました。'
      excerpts:
        p3: 'アニングは顔を上げずに聞いていた。手に持っていたペンが絵の隅で一瞬止まり、そこに彼女は自分の名前を書きました。'
