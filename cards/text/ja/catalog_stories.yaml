  keats_rome:
    name: '階段のそばの小部屋'
    place: 'ローマ'
    figure: 'ジョン・キーツ'
    story: '1820年11月、結核を患っていたジョン・キーツは画家のジョセフ・セヴァーンとともにローマに来て、スペイン階段の横のスペイン広場26番地に部屋を取った。彼は 1821 年 2 月 23 日の夜にそこで亡くなり、2 月 26 日にケスティウスのピラミッドのそばの墓地に埋葬されました。彼の希望により、彼の墓石には彼の名前は記されていません。'
    story_prose:
      opening:
        - 'ローマ、1820年11月中旬。結核を患う25歳の詩人ジョン・キーツは、スペイン階段のふもとにあるスペイン広場26番地の2階で画家のジョゼフ・セヴァーンと部屋を共にする。数年のうちに彼は主な詩とその中の頌歌を書き上げたが、これが彼の最後の冬となる。'
        - '歴史上、医師のジェームス・クラークは彼に一日アンチョビ一個とパン一切れという絶食ダイエットをさせ、何度も出血させた。セヴァーンは一人で彼の世話をしたが、すぐにお金はなくなり、眠れない夜が続いた。彼は最後まで自分は何も残していないと信じており、彼の希望で彼の墓石には名前がありませんでした。この支店では、花売りが階段の下でスミレを売っており、階段の近所の人がよく病気の宿泊客の後を尋ねます。'
        - 'この旅行では、数種類の人々が助けてくれます。薬の知識があり、出血を止めることができる人、または最新の治療ハンドブックを持っている人です。長い夜の間見張りをして頑張ってくれる人、あるいは睡眠調節装置を持っている人。詩をよく読んでいて、詩を知っていて、彼の詩がどうなるかを伝えることができる人。'
      outcomes:
        all: '2月23日遅く、キーツはセヴァーンをベッドサイドに見送りながら亡くなった。最後の数か月間、彼は温かいスープとパンを食べることができ、誰かが彼の詩が読まれ続けるだろうと言うのを聞いていました。 3日後、彼はケスティウスのピラミッドのそばの墓地に埋葬されましたが、彼の希望により、その石には名前が付けられませんでした。'
        p3: '2月26日、彼はケスティウスのピラミッドのそばの墓地に埋葬されたが、彼の希望により石には名前が付けられなかった。スペイン階段の横の部屋は保存されており、その窓からは今でも広場が見えます。'
        p2: 'この数か月間、テーブルにはアンチョビ 1 個とパン 1 切れ以上のものがありました。 1821年2月26日、彼はケスティウスのピラミッドのそばの墓地に埋葬された。'
        p1: '2月23日遅くにキーツは亡くなり、セヴァーンは最後までベッドサイドにいた。 50年以上後、セヴァーンは同じ墓地のキーツの隣に埋葬された。'
      none: '1月、セヴァーンさんは疲れ果てて隣の部屋で倒れた。 2月23日遅く、一切れのパンとアンチョビはまだテーブルの上にあり、ベッドのそばの椅子は空でした。'
      desync: '1月にセヴァーンは倒れた。 {staff} が呼び戻されたとき、彼は隣の部屋で服を着たまま横たわっており、書きかけの手紙はまだテーブルの上に開いたままで、インク瓶の栓も開いていませんでした。'
      not_admitted: '{staff}さんは一度も家には入らず、階段の下にある舟形の噴水で数回水を汲んだだけだった。花売りが上の階で誰が病気なのか尋ねましたが、{staff} は答えず、2 階の窓は閉められたままでした。'
      points:
        p2:
          class_medical: '12月9日の朝、キーツは咳き込んでコップ2杯分の血を吐いた。クラーク博士がやって来て、袖をまくり上げて、あと8オンス飲むと言った。テーブルの上にはその日の食べ物、アンチョビ一匹とパンが一切れありました。医学に詳しい{staff}は患者の手首を押さえ、このような出血には耐えられないと言い、医師にここ数日間に食べたものをすべて検査し、医師はランセットをしまった。正午、セヴァーンは温かいスープの入ったボウルとパンを一切れ持ってきた。キーツは枕にもたれて座り、スプーン一杯ずつ食べ終えて、空になったボウルを彼に返した。'
          else: '12月9日の朝、キーツは咳き込んでコップ2杯分の血を吐いた。クラーク博士がやって来て、袖をまくり上げて、あと8オンス飲むと言った。テーブルの上にはその日の食べ物、アンチョビ一匹とパンが一切れありました。 {staff} は持参した最新のケアハンドブックを開き、その一節を医師に声に出して読み上げ、患者が過去数日間に食べたものをすべて書き留めて彼の前に置き、医師はランセットをしまいました。正午、セヴァーンは温かいスープの入ったボウルとパンを一切れ持ってきた。キーツは枕にもたれて座り、スプーン一杯ずつ食べ終えて、空になったボウルを彼に返した。'
        p1:
          class_medical: '1月15日、セヴァーンは銀行が請求書を送り返してきたので、手元にあるお金で家賃を支払えるのはもう一度だけだと書いた。キーツは彼から目を離そうとしなかったので、彼はお金のために絵を描きに出かけることができず、一晩中眠れませんでした。看護の訓練を受けた{staff}は夜通し仕事をし、キーツを時々抱き起こして咳き込み、汗を拭き、枕カバーを交換し、夜明け近くになって初めてランプを落とした。セヴァーンはブーツを履いたまま、服を着たまま隣の部屋で寝ていた。朝起きると、彼はまずドアを開けてベッドを眺め、それから戻って書きかけの手紙を書き上げました。'
          else: '1月15日、セヴァーンは銀行が請求書を送り返してきたので、手元にあるお金で家賃を支払えるのはもう一度だけだと書いた。キーツは彼から目を離そうとしなかったので、彼はお金のために絵を描きに出かけることができず、一晩中眠れませんでした。 {staff} さんは見守りに慣れており、椅子をベッドまで引き上げてセバーンさんを隣で寝かせ、患者が寝返りを打つたびに立ち上がって様子を見ていました。セヴァーンはブーツを履いたまま、服を着たまま隣の部屋で寝ていた。朝起きると、彼はまずドアを開けてベッドを眺め、それから戻って書きかけの手紙を書き上げました。'
        p3:
          class_lettered: '2月中旬までにキーツさんはベッドから離れることができなくなった。彼はまだ何も残せていないと感じており、自分の墓石に名前が残らないことを望んでいた。彼の本を読んだ{staff}は、ベッドのそばに座って彼の頌歌について話しました。人々はそれを何度も繰り返し読んで、一行ずつ心を覚えていき、ローマのこの部屋は彼のために確保されていました。キーツは長い間指をシーツの上に置いたまま、何も言わずに聞いていた。窓の隙間から広場の噴水の音が聞こえ、ベッドのそばの本には押しつぶされたスミレが載っていました。'
          class_teaching: '2月中旬までにキーツさんはベッドから離れることができなくなった。彼はまだ何も残せていないと感じており、自分の墓石に名前が残らないことを望んでいた。教えていた{staff}はベッドのそばに座り、今後の教室で生徒たちは彼の詩を最後の一行まで暗記するだろう、そしてローマのこの部屋は彼のために確保されるだろうと言いました。キーツは長い間指をシーツの上に置いたまま、何も言わずに聞いていた。窓の隙間から広場の噴水の音が聞こえ、ベッドのそばの本には押しつぶされたスミレが載っていました。'
          else: '2月中旬までにキーツさんはベッドから離れることができなくなった。彼はまだ何も残せていないと感じており、自分の墓石に名前が残らないことを望んでいた。 {staff} はベッドのそばに座り、彼の詩がどうなるかについてゆっくりと話しました。人々はそれらを何度も繰り返し読み、行ごとに心の覚え方をするでしょう、そしてローマのこの部屋は彼のために確保されるでしょう。キーツは長い間指をシーツの上に置いたまま、何も言わずに聞いていた。窓の隙間から広場の噴水の音が聞こえ、ベッドのそばの本には押しつぶされたスミレが載っていました。'
      excerpts:
        p3: 'キーツは長い間指をシーツの上に置いたまま、何も言わずに聞いていた。窓の隙間から広場の噴水の音が聞こえ、ベッドのそばの本には押しつぶされたスミレが載っていました。'
        p2: '正午、セヴァーンは温かいスープの入ったボウルとパンを一切れ持ってきた。キーツは枕にもたれて座り、スプーン一杯ずつ食べ終えて、空になったボウルを彼に返した。'
