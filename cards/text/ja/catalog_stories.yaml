        now: '{staff} は数分以内に彼に到着し、出血を止め、傷が化膿するのを防ぎます。ガロアは回復して数学に戻り、自分の理論を理解していなかった数学者たちに自ら理論を説明します。'
        who: 'galois_paris'
        bio: 'ガロアは 1832 年 5 月の決闘で生き残りました。彼はパリで数学の研究を続け、生前に彼の方程式理論が読まれ、議論されるのを見ました。'
    vignettes:
