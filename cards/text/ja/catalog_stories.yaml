        now: '学習者は曲を最初から最後まで学び、その後自分の学習者に曲を教えました。'
      p3:
        was: 'ネサワルコヨトルは1472年にテスココで亡くなった。彼の名前に関連した歌は 1 世紀後に本に書き写され、メキシコの 100 ペソ紙幣に彼の顔が描かれたのは 500 年以上後です。'
        now: '{staff} は最後の日に彼と一緒に座り、このすべてを彼に話しました。'
    vignettes:
      voice: '{staff} は、歌手が I で始まる行で前に出ると、練習シート上に 2 つの場所を残します。1 つは歌手用、もう 1 つは曲中の名前用です。'
      drum: '{staff} は、最初の歌手が立っているときに次の歌手が届く位置にページが留まるように、マーカーとして予備のストリップを置きます。'
      later: '{staff} は、そのセリフがどの歌手から聞いたかを書き留めますが、誰が最初にそれを作ったのかという疑問はオープンのままにします。'
  omar_khayyam_nishapur:
    name: '春の初日'
    place: 'ペルシア、イスファハーン'
    figure: 'ウマル・ハイヤーム'
    story: '1070年代、スルタン・マリク・シャーは観測を行うために天文学者を集めました。ウマル・ハイヤームは、イスファハーンの宮廷で学者たちと協力しました。ジャラリ暦は 1079 年 3 月 15 日に使用され、太陽年の始まりを春分の日としました。'
    story_prose:
      opening:
        - 'イスファハーン、1079年春。マリク・シャーが集めた学者たちは暦を改訂している。ハイヤーム氏は観測に参加しており、新しい計算は春分の日から年が始まる。'
        - '歴史上、新しい暦はその3月から使用され始めました。マリク・シャーの死後、観測プログラムは終了した。ハイヤーム氏は、根の抽出について書いた本が残っていないことに言及した。この支部では、年鑑のコピー担当者が、さらに数行入れる余地のあるシートを持っています。'
        - 'この旅行には、影の読み取り値をチェックし、古い列と新しい列をまっすぐに保つことができる人が必要です。また、原稿をチェックしてコピーを別の都市に送ることができる人も必要です。'
      points:
        p1: '春分の前に、{staff} は影の端を以前の読み取り値と照合し、混合列を整理して、元のマークと照合するように Khayyam に依頼します。読み取り値の表の端に沿って 2 つの折り目があります。太陽が低くなると、シートはまだ開いており、その列のインクは線の内側に戻ります。'
        p2: '{staff} は、写本家のルート抽出に関する本をチェックし、間違いやすい数字をオリジナルと比較し、その原稿を別の都市に向かう人に渡します。メッセンジャーはコピーを布で包み、結び、片側を簡単に外します。タイトルは外側を向いており、最初の折り目の下に紙の端がまだ触って見えます。'
      outcomes:
        all: 'その春の日付が新しい暦になりました。数年後、誰かが別の都市の古い角がまだ丸まったままのルーツに関する本に手を伸ばしました。'
        p2: 'その後、別の都市の誰かがその本全体を再度コピーしました。彼らは、古くて使い古された原稿を横に置き、最初の行から始めました。'
        p1: 'カレンダーは指定された日から始まりました。比較シートが 1 枚残っており、2 つの見出しが隣り合っていました。'
      none: '古いテーブルは箱に戻りました。未完成のシートが外に置かれ、風が吹くたびに縁を叩いていた。'
      not_admitted: '{staff} はコピーリストの居場所を見つけることができませんでした。ドアの内側でシートがめくれ、外側からはその方向が消えていました。'
      desync: 'シートを収集したとき、列はまだ一致していませんでした。 {staff} がリコールされたとき、最後の測定値はまだマージンにありました。'
      excerpts:
        p2: 'メッセンジャーはコピーを布で包み、結び、片側を簡単に外します。タイトルは外側を向いており、最初の折り目の下に紙の端がまだ触って見えます。'
        p1: '読み取り値の表の端に沿って 2 つの折り目があります。太陽が低くなると、シートはまだ開いており、その列のインクは線の内側に戻ります。'
    relic: '見出しが二つある暦の一葉'
    relic_desc: '新旧の正月を並べて書いた対照表。'
    points:
      p1: '春分の日の前日は、新しいカレンダーがその日に設定された日に始まるように、それを修正する影の読み取り値を安全に保管してください。'
      p2: '根の抽出に関する彼の本をもう 1 部作成し、安全に保管するために別の都市に送って、この支部で本が生き残るように手伝ってください。'
    points_fail:
      p1: '春分点の測定値は一致せず、新しい暦は 3 月 15 日に始まりませんでした。'
      p2: '歴史上と同様に、その本も失われてしまいました。'
    shift:
      p1:
        was: '1079 年 3 月 15 日、スルタン マリク シャーの新しい暦がその定められた日に使用され、1 年は春分の日から始まりました。'
      p2:
        was: 'ルートの抽出に関するハイヤームの本は失われており、彼の代数における言及によってのみ知られています。'
        now: '一部のコピーは別の都市に送られて図書館に置かれ、人々は何世紀経ってもそれを読むことができました。'
        who: 'omar_khayyam_nishapur'
        bio: 'この路線で、ルーツに関する彼の本は天文台時代とともに消え去ることはなかった。別の都市に保管されていたコピーは、彼の死後も読まれ、コピーされ続けました。'
    vignettes:
      spring: '{staff} は、古いテーブルと新しいテーブルを並べて、それが属する日付を計算して書き込みます。これにより、次の読者が推測する必要がなくなります。'
      carry: '{staff} は、折りたたまれたシートの 2 つの見出しをシートの外側にコピーするため、シートを持ち運ぶ人は、シートを開かずに比較する列を確認できます。'
      future: '{staff} は、このカレンダーが後でどのように書かれるかを知っており、写字生が見たことのない計算の日付を保持しています。'
  wright_kitty_hawk:
    name: '空を飛んだ十二秒'
    place: 'キティホーク、ノースカロライナ州'
    figure: 'オーヴィル・ライトとウィルバー・ライト'
    story: '1903年9月、ライト兄弟は動力付きの機械を携えてキティホーク近くのキャンプに戻ってきた。 12月14日のウィルバーの試みは失敗に終わりました。 12月17日の朝、彼らは4回飛行し、最初の飛行は12秒間、最後の飛行は59秒間であった。その午後、彼らはキティホークまで歩いて行き、デイトンにいる父親に電報を打った。'
    story_prose:
      opening:
        - '1903年12月、キティホーク付近。ライト兄弟はエンジン駆動のフライヤーを持ち込んだ。 １４日の試みは失敗した。レールは再び設置されなければなりませんが、風はまだ吹いています。'
        - '歴史上、17日の初飛行は12秒間続いた。 4回目の着陸後、突風により機体が横転し、救命ステーションのジョン・ダニエルズさんが翼の間に挟まれた。この支部では、地上のレールと機械を手伝うもう 1 組のスタッフがキャンプにいます。'
        - 'この旅には、風に負けない人が必要です。適切な装備を持っている人は、幅広の翼を安定して保持することもできます。'
      points:
        p1: '離陸前に、{staff} はレールの下の砂を確認し、風が届かなくなるまで翼を風に向かって安定させます。ダニエルズはカメラのそばに立っています。翼端はレールの端を通過し、その下には明るい砂の帯があります。'
        p2: '4 回目の着陸の後、{staff} は風が上昇するのを感じ、救命隊員が翼を押さえてダニエルズを移動させるのを手伝いました。砂は翼の下でスケートをし、翼の端にある手はつかみます。風が弱まると、布の上にかすかな砂の線が浮かび上がります。'
      outcomes:
        all: '距離は電報に入りました。兄弟たちはフライヤーを梱包するとき、生地をもう一度拭き、箱の底に砂の薄い層を残しました。'
        p2: 'フライヤーはさらに数回砂丘を越えました。梱包した人は、生地の横にレールロープを長く置き、蓋を閉めました。'
        p1: '12秒と120フィートが音符に入りました。その写真はそのページの横にありました。'
      none: '風がキャンプを横切り、再びレールの根元を埋めた。ストーブ内に現れたのは赤い点だけでした。'
      not_admitted: '{staff} はヘルパーの中に居場所がありませんでした。小屋を通過しても、レールの一端がまだ砂の上に見えていました。'
      desync: '翼が砂をこすり、フライヤーはレールの横で停止した。 {staff} がリコールされたとき、風はまだ布を持ち上げていました。'
      excerpts:
        p2: '砂は翼の下でスケートをし、翼の端にある手はつかみます。風が弱まると、布の上にかすかな砂の線が浮かび上がります。'
        p1: 'ダニエルズはカメラのそばに立っています。翼端はレールの端を通過し、その下には明るい砂の帯があります。'
    relic: 'プロペラの羽根'
    relic_desc: '翼をひねったような形の、木製のプロペラの羽根。'
    points:
      p1: '12 月 17 日の朝、冷たい風が吹く中、兄弟たちがフライヤーを安定させ、最初の離陸を安全に保つのを手伝ってください。'
      p2: '4回目の飛行の後、フライヤーを砂の上に押さえつけ、ダニエルズとマシンを救出します。'
    points_fail:
      p1: '離陸前に突風が片方の翼を持ち上げて砂の中に引きずり込みますが、機体はレールから離れることはありません。このブランチには 12 秒はありません。'
      p2: '風でフライヤーはひっくり返り、ダニエルズは翼に巻き込まれて一緒に転がり、歴史のように機体は壊れすぎて二度と飛ぶことができません。この枝では、その午後以降、決して地面から離れることはありません。'
    shift:
      p1:
        was: '1903年12月17日の朝、オービルは12秒間120フィート飛行した。'
      p2:
        was: '1903年12月17日、4回目の飛行の後、突風によりフライヤー号が横転し、ジョン・ダニエルズが翼の間に挟まれ、機体はひどく壊れ、二度と飛ぶことはできなかった。'
        now: '{staff}と署員らが砂の上で押さえつけたが、ダニエルズさんは捕まらなかった。その冬、兄弟たちはデイトンに向けて箱に詰める前に、さらに数回砂丘の上を飛行した。'
    vignettes:
      numbers: '{staff} は、4 つのフライトを作成順にノートにコピーし、一方の列には秒、もう一方の列にはフィートをコピーし、消灯する前に 2 回合計します。'
      sand: '{staff} は夜風が吹いた後、吹きだまりからレールを掘り出し、その足元の砂を平らに踏み固めます。試合のために補欠で来た駅の助っ人は、朝には風が弱まるだろうと言うが、そうではない。'
      cold: '{staff} は、エンジンが暖まっている間、小屋の中でストーブを動かし続けます。外の水たまりは凍っていますが、誰もそれについて言及しません。'
  van_gogh_auvers:
    name: 'オーヴェールの夏'
    place: 'オーヴェール＝シュル＝オワーズ'
    figure: 'フィンセント・ファン・ゴッホ'
    story: 'フィンセント・ファン・ゴッホは1890年5月20日にオーヴェル・シュル・オワーズに来て、オーベルジュ・ラヴーに宿泊し、頻繁にポール・ガシェ博士に会いに行きました。彼はほぼ一日に一作品を描きました。 7月10日頃の手紙の中で、彼は荒れた空の下に広がる広大な小麦畑について書いた。 7月27日に彼は胸を撃って自殺し、7月29日に弟のテオが傍らで亡くなった。'
    story_prose:
      opening:
        - 'オーヴェル・シュル・オワーズ、1890 年夏。ゴッホはオーベルジュ・ラヴーに滞在し、ほぼ毎日絵を描いています。 7月の手紙の中で、彼は荒れた空の下に広がる広大な小麦畑について書いている。'
        - '歴史上、彼は兄の家族の生計を心配し、その月の終わりにオーヴェールで亡くなりました。この支店では、小麦と宿屋の間の道に、彼のためにキャンバスを持ってくれたり、彼の話を聞いてくれる人がいます。'
        - 'この旅には、風に吹かれながらイーゼルを安定させることができる人、家計簿を理解できる人、そして話を聞いてくれる人が必要です。介護を知っている人なら宿で同席することもできる。'
      points:
        p1: '風がキャンバスを押します。 {staff} はイーゼルの緩んだ足を支え、ゴッホが最後のストロークを行う間、風上コーナーを保持します。遠くにある小麦が最初にお辞儀をしますが、近くの茎はまだ揺れています。ゴッホが筆を下ろしたとき、キャンバスの底はまだ地面から指一本分の高さです。'
        p2: '{staff} は彼と一緒に手紙を広げ、テオの仕事から家計の支出までを調べ、シートの端に解決できるものをメモします。ゴッホはシートを折り畳んで封筒に戻します。しまう前に、彼はフラップを手のひらで滑らかにします。'
        p3: '{staff} は、描かれた麦畑を次々と並べ、人々はこの地面と空を見るために遠くからギャラリーに来るだろうと伝えます。ゴッホは一番外側の絵をテーブルの中央に戻します。部屋が暗くなっても、黄色の細い線がまだ見えます。'
        p4: '{staff} は、最も困難な日々を乗り越えて旅館に滞在し、休息と日常の世話をし、ゴッホが自ら窓を開けたがるまで待ちました。宿屋の娘がドアのそばにトレイを置いた。ファン・ゴッホはそれを受け取り、絵の具を置く場所を作るために脇に移動させます。'
      outcomes:
        all: '夏が終わると、畑はまた違った色に染まりました。旅館のドアにはまだシーツが干してあり、その下に書かれた手紙が挟まれていた。'
        p4: '秋になっても、宿の人たちは彼が絵の具を運び出す姿をまだ見ていた。ドアが開くと、ポケットの中にチューブのブリキの端が現れました。'
        p3: 'その後、ギャラリーのフィールドの前で人々が立ち止まりました。もう一歩近づけば、黄色はもうすぐ手の届くところにあるように思えた。'
        p2: '家族についての手紙が旅館のテーブルの上に置かれていました。もう一度開いてみると、わずかな折り目の横に小さな線が見えました。'
        p1: 'フィールドは絵の中に残りました。その後窓にかざすと、地平線に沿って 2 つの厚さの絵の具が見えました。'
      none: '旅館の廊下に足音が響いた。トレイが戻ってきたとき、カップの中の水はまだ平坦でした。'
      not_admitted: '{staff} は宿屋に場所が見つかりませんでした。道の向こうに少し畑が見えましたが、建物の角が道を隠していました。'
      desync: 'イーゼルは小麦の中に横たわっていました。 {staff} が思い出されたとき、脚の 1 つに引っかかった茎がまだ風にうなずいていました。'
      excerpts:
        p4: '宿屋の娘がドアのそばにトレイを置いた。ファン・ゴッホはそれを受け取り、絵の具を置く場所を作るために脇に移動させます。'
        p3: 'ゴッホは一番外側の絵をテーブルの中央に戻します。部屋が暗くなっても、黄色の細い線がまだ見えます。'
        p2: 'ゴッホはシートを折り畳んで封筒に戻します。しまう前に、彼はフラップを手のひらで滑らかにします。'
        p1: '遠くにある小麦が最初にお辞儀をしますが、近くの茎はまだ揺れています。ゴッホが筆を下ろしたとき、キャンバスの底はまだ地面から指一本分の高さです。'
    relic: 'クロムイエローの絵具チューブ'
    relic_desc: '畑を描くのに使った色が入っていた、絞り跡のあるブリキのチューブ。'
    points:
      p1: '嵐の空の下、麦畑を完成させ、キャンバスが小麦畑に落ちないように手伝ってください。'
      p2: 'パリ訪問後、嵐が彼に重くのしかからないよう、テオのお金の問題を解決できるように手伝ってください。'
      p3: '彼の絵は記憶に残るだろうということを彼に伝えてください'
      p4: '7月27日までに彼の体と心を癒し、生かしてください。'
    points_fail:
      p1: 'キャンバスは風に乗って小麦畑に落ちました、そしてこの枝には雷雲の下の小麦畑はありません。'
      p2: '彼はテオを脅かす嵐が彼にも重くのしかかっているのをまだ感じながらパリから戻ってきた。この支部では誰も彼がお金の問題を解決するのを助けてくれませんでした。'
      p3: '彼はまだ自分の絵がテオにとって負担であると感じていました。この支部では、小麦畑がどこに行き着くのかを誰も彼に教えませんでした。'
      p4: '7月27日は歴史上そうであったように起こった。この枝では、彼は別の季節を描きませんでした。'
    shift:
      p1:
        was: '1890 年 7 月初旬、ファン ゴッホは荒れた空の下で広大な麦畑を描き、7 月 10 日頃テオとジョーにその麦畑についての手紙を書きました。'
      p2:
        was: '1890年7月初旬、ゴッホはパリのテオの家族を訪れ、テオが職を離れて独立しようと考えていることを知りました。オーヴェールに戻って、彼はテオを脅かす嵐が自分にも重荷になったと書いた。'
        now: 'パリから戻ったとき、彼はテオの家がどのようにやっていくかを知っていたので、体重を一つ減らして畑に戻りました。'
      p3:
        was: '1890年7月、ファン・ゴッホは自分は失敗を感じ、良い未来は見えないと書いた。彼は生涯でほとんど絵を売らなかった。'
        now: '誰かが彼に、これらの麦畑はいつか博物館の壁に飾られ、多くの人がそれを見に旅行するだろうと語った。'
      p4:
        was: '彼は1890年7月27日に銃撃で負傷し、その2日後にオーヴェールで亡くなったが、絵を描いたのはわずか10年ほどだった。'
        now: '{staff} はその 7 月まで彼と一緒に過ごし、病気で再び倒れることはなく、夏が終わっても彼はまだオーベルジュ・ラヴーにいました。彼はさらに数年間絵を描き、麦畑の後には別の季節がありました。'
    vignettes:
      sky: '{staff} は、同じフィールドをノートブックに 2 回描画します。最初は空の細片を描画し、次にさらに多くの領域を描画します。2 番目の描画では、最初の描画で隠されていた何かが見えます。'
      wind: '{staff} は、小麦の上に次の突風が吹くのを待ち、最初の外観をこすることなく、暗い斑点が小麦の上を移動するのを観察します。'
      path: '{staff} は、畑の間の小道をその終わりが見えるまで歩き、帰りにはどこへ行くのかがわかります。'
  sor_juana_mexico_city:
    name: '手放した最後の本'
    place: 'メキシコシティ'
    figure: 'ソル・フアナ・イネス・デ・ラ・クルス'
    story: '1690年、プエブラ司教は無断でソル・フアナの説教批判を、ソル・フィロテアの署名入りの手紙とともに『カルタ・アテナゴリカ』として出版した。彼女の返事は 1691 年 3 月 1 日の日付です。1693 年に彼女は本と楽器を売り、1694 年に誓いを新たにしました。彼女は伝染病で姉妹たちを看護した後、1695年4月17日にサン・ヘロニモ修道院で亡くなった。'
    story_prose:
      opening:
        - 'メキシコシティ、1695年初頭。フアナの本と楽器は2年前に売却されていた。彼女は学問の追求を擁護する長い手紙を書いていた。それが彼女の作品集に掲載された頃には、彼女はもういなくなっていた。'
        - '歴史上、疫病が街中に蔓延しました。フアナさんは病気になった人々の世話をし、4月に自らも亡くなった。この支部では、空の棚のそばにテーブルを置くスペースがあり、病人の世話をする人がそこに水や乾いた布を置いておくことができます。'
        - 'この旅行には、交代しながら病室を維持できる人が必要です。また、病人の世話をする方法を知っており、適切な薬や器具を持っている人も必要です。'
      points:
        p1: '次のシフトが遅かった。 {staff} は水、清潔な布巾、空のボウルを別々の場所に置き、手を解放して次のベッドの世話をします。ドアのそばにいる誰かが再び両袖をまくり上げた。乾いた布の山は下の方にあり、底の方には四角い折り目がまだ1つ残っていた。'
        p2: '片方のベッドにいた女性は起き上がることができなかった。 {staff} さんは、彼女が飲酒している間も滞在し、利用可能な治療法とケアで彼女の世話をしました。夜が明けてから彼女はベッドの端に手を伸ばした。 {staff} がボウルを差し出すと、彼女は片手を解放してその底をすくいました。'
        p3: 'フアナも病気になった。 {staff} は持参した備品で彼女を治療し、彼女がもう一口飲めるまでベッドのそばで待ちました。彼女は空になったボウルを返し、枕元のページに触れました。彼女の指先は濡れていて、乾いたベッドの隅に紙を押し当てた。'
      outcomes:
        all: '4月以降、女性2人は再び病室のテーブルに立つことができた。一人は乾いたばかりの布を積み上げ、もう一人は空の棚に戻ってページに数行追加しました。'
        p3: '4月以降、フアナさんは再びテーブルに座ることができた。棚にはまだ何もありませんでしたが、テーブルの端には書きたてのページがありました。'
        p2: '４月以降、女性は病室の手伝いに戻ってきた。彼女は横たわっていたベッドのそばに立って、きれいな布を振り払った。'
        p1: 'さらに多くの人が病気になり、病室での仕事は続きました。交代時に誰かがきれいなボウルをテーブルの上に逆さまに置きました。'
      none: '水差しは一晩中手つかずのまま放置されていました。夜明けに、注ぎ口のすぐ下に光の斑点があり、ドアを通して見えました。'
      not_admitted: '{staff} は病人が世話されている部屋には決して入りませんでした。ドアの隙間から、テーブルの脚と空の水瓶が見えました。'
      desync: '誰もベッドサイドを引き継いで来ませんでした。政府機関が {staff} をリコールしたとき、お湯の入ったボウルはまだテーブルの隅に置かれていました。'
      excerpts:
        p3: '彼女は空になったボウルを返し、枕元のページに触れました。彼女の指先は濡れていて、乾いたベッドの隅に紙を押し当てた。'
        p2: '夜が明けてから彼女はベッドの端に手を伸ばした。 {staff} がボウルを差し出すと、彼女は片手を解放してその底をすくいました。'
        p1: 'ドアのそばにいる誰かが再び両袖をまくり上げた。乾いた布の山は下の方にあり、底の方には四角い折り目がまだ1つ残っていた。'
    relic: '羽ペン'
    relic_desc: '空の棚の横にある、先端が分かれた羽根ペン。'
    points:
      p1: '病気が広がる数週間は、彼女が病室を維持できるように手伝い、姉妹たちの看護を一緒に続けてください。'
      p2: '伝染病で病気になった妹を救う'
      p3: '彼女自身が病気になったら、彼女を治してください'
    points_fail:
      p1: '病室では次々と手が病気になり、看護が中断される。この支部では、病気の姉妹たちの世話は歴史のようには進んでいません。'
      p2: '彼女は最後までやり遂げることができず、歴史のように、それらの月に亡くなった姉妹の一人です。この分院では病室の別のベッドが空いています。'
      p3: '歴史通り、彼女は4月17日に亡くなる。この支店では彼女は4月まで生きられません。'
    shift:
      p1:
        was: '1695 年の春、メキシコシティで伝染病が流行し、ソル・フアナは病気になった姉妹たちの世話をしました。'
      p2:
        was: '1695 年春の疫病で、彼女の修道院の多くのシスターが亡くなりました。'
        now: '妹は4月まで生き延び、体調が良くなると病室を手伝うために戻ってきました。'
      p3:
        was: '1695 年 4 月 17 日、ソル・フアナは姉妹たちを看病した後に亡くなりました。'
        now: '{staff}は持参した薬で彼女を治し、彼女は4月まで生きました。その後数年、彼女は修道院でさらに執筆を続けた。彼女が書いたことはこの旅行の記録には載っていない。'
    vignettes:
      kitchen: '{staff} は、熱いバターの中で卵が固まり、シロップの中で崩れていくのを眺め、誰に向けて、どのパンがどのようにできたかをスクラップに書き留めます。'
      shelf: '{staff} は監房内の空の棚のほこりを払い、本が置かれていた跡や木の上の黒い四角を見つけて、そのままにしておきます。'
      bells: '{staff} は、ある晩、中庭から死者のための鐘を 2 回数えて、やかんに戻ります。'
  kepler_leonberg:
    name: '証人が見たこと'
    place: 'レオンバーグ'
    figure: 'ヨハネス・ケプラー'
    story: '1620年、天文学者ヨハネス・ケプラーの母であるカタリーナ・ケプラーは、5年前に遡るレオンベルクの近隣住民からの告発に直面した。 8月7日、彼女はヒューマデンの娘の家で逮捕された。彼女は家族の費用でレオンベルクからギュクリンゲンに移送され、監視下に置かれた。同年9月、ヨハネスは弁護のためリンツから帰国した。度重なる遅延の後、カタリーナは逮捕から 1 年以上経った 1621 年の秋に釈放されました。'
    story_prose:
      opening:
        - 'レオンバーグ、1620年。カタリーナ・ケプラーに対する告発は5年間彼女を悩ませていた。彼女は8月にヒューマデンで逮捕され、9月には息子のヨハネスが彼女を弁護するためにリンツから帰国した。'
        - '歴史上、彼女はギュクリンゲンで1年以上拘留されていた。彼女は冬の間ずっと鎖を着けており、家族は警備員にお金を払わなければならなかった。この支店では今でも看守の妻がスープを小道まで運んでいます。誰かが彼女から鍋を取り上げて、書類を追い出される前に目を通すことができます。'
        - 'この旅行には書類を整理し、発言を行った人物まで追跡できる人が必要です。冬になると、介護士や暖かい寝具を運んでくれる人の仕事も出てきます。'
      points:
        p1: 'カタリーナがレオンバーグに連行された後、{staff} は記録管理者の習慣に従い、管理者に 2 冊目のコピーを求め、一緒にページを数え、それが提出されるのを見ました。事務員はファイルするためにそのコピーを山の上に置きました。オリジナルが折り返されると、{staff} が飛び出た角を押し下げました。'
        p2: '{staff} は証言を家族に広げ、それぞれの主張を、見たもの、聞いたもの、または後で誰かが推測したものまで遡って追跡しました。3 本の柱は、混雑した証言者に息抜きの余地を与えました。目撃者が誰も見たことがないところで、ペンは罫線の手前で止まった。'
        p3: '寒さが到来すると、{staff} は警備員に分厚い寝具と温かい食事を手配し、カタリーナが鎖を着けているベッドの横に入るように手配しました。ボウルを取る前に、彼女は毛布の角を膝の上に押し込みました。彼女は暖かいボウルの周りでゆっくりと両手を閉じたとき、鉄のリンクがベッドボードに寄りかかりました。'
      outcomes:
        all: '証言と弁護側は今でも並べて読むことができる。カタリーナさんは刑務所で温かい食事と厚い毛布を食べていました。翌年の秋に彼女が釈放されると、家族は彼女が顎まですっぽり覆えるコートを着て外で待っていた。'
        p3: '鉄が食いつきを失ったのは冬が終わってからだった。彼女はそれを乗り越えてきたのです。ベッドを片付けながら、彼女は厚い毛布の二つの角を慎重に合わせました。'
        p2: '弁護士はそのコピーを受け取りました。彼は証人たちが見たことのないものの横に数行印を付け、ページをめくり、また元に戻しました。'
        p1: '書面による弁護は、数年後もファイルの中で見つけることができました。角が折れた箇所は、繰り返しの取り扱いで青白い線が入っていました。'
      none: '壁が冷たくなり、スープに皮ができました。一台の荷車が窓を通り過ぎ、その鉄の車輪が石の隙間にぶつかり、そのたびに遠くへ遠ざかっていった。'
      not_admitted: '{staff} は書類が保管されている部屋に入ることができませんでした。中にいた人が束を移動させたところ、紐がテーブルに擦れた。'
      desync: 'ファイルは防御機能なしで閉じられていました。 {staff} がリコールされたとき、テーブル上の四角いパッチが書類が置かれていた場所を示したままでした。'
      excerpts:
        p3: 'ボウルを取る前に、彼女は毛布の角を膝の上に押し込みました。彼女は暖かいボウルの周りでゆっくりと両手を閉じたとき、鉄のリンクがベッドボードに寄りかかりました。'
        p2: '3 本の柱は、混雑した証言者に息抜きの余地を与えました。目撃者が誰も見たことがないところで、ペンは罫線の手前で止まった。'
        p1: '事務員はファイルするためにそのコピーを山の上に置きました。オリジナルが折り返されると、{staff} が飛び出た角を押し下げました。'
    relic: '弁護文の写し'
    relic_desc: '弁護文の一頁を書き写したもの。余白に日付の訂正がある。'
    points:
      p1: 'カタリーナがレオンバーグに連行されたら、弁護書類の保管者に2枚目のコピーを提出させ、彼女の書面による回答が訴訟手続きに届くようにする'
      p2: '家族が直接の証言、伝聞、その後の推論を別々の列に分類できるように支援します。'
      p3: '73歳で鎖につながれたカタリーナがこの冬を乗り越えられるように、厚い寝具と温かい食事をギュクリンゲンの独房に入れてください。'
    points_fail:
      p1: '家族が見つけた唯一のコピーは決して届けられません。ファイルには告発のみが記載されており、事務所はその従業員を召還した。'
      p2: 'このコピーは 3 つすべてをまとめたものです。それがファイルに到達した後も、弁護側は最初に誰が何を言ったかを尋ねる必要があります。'
      p3: 'この支部では、歴史にあるように彼女は鎖につながれて冬を過ごし、昼夜を問わず彼女を警護するのは二人の男だけで、警備員の費用を払うのは家族だけだった。'
    shift:
      p1:
        was: 'カタリーナは 1620 年 8 月に逮捕されました。ヨハネス・ケプラーは弁護士を通じて、訴訟の書面による記録を要求しました。'
      p2:
        was: '証言と弁明書は存続する。弁護側は主張に一つ一つ答え、それらを結びつける推論に異議を唱えた。'
        now: '弁護士は 3 つの列を比較し、証人が自分たちで検証できなかった主張を指摘することができます。'
      p3:
        was: '1620年8月7日、カタリーナ・ケプラーは逮捕され、ギュクリンゲンに連行され、家族の犠牲のもと、2人の警備の下で14か月間鎖につながれた。彼女は 1621 年の秋に釈放され、約 6 か月後に亡くなりました。'
        now: '{staff} は家族の警備員と問題を解決しました。その冬、彼女は厚い寝具と温かい食べ物を持っていました。鎖はついたままだったが、彼女は歴史上よりもよく耐えた。'
        who: 'katharina_kepler'
        bio: 'このタイムラインでは、カタリーナ ケプラーはギュクリンゲンの独房で最初の冬を暖かい寝具と温かい食べ物で過ごし、1621 年の秋に解放されたときにはさらに強くなっていました。'
    vignettes:
      soup: '9月13日、{staff}は看守の妻のために大麦スープの入ったポットをギュクリンゲンの小道に運びます。彼女は、戻ってきたボウルを見れば、どの囚人がどの囚人であるかわかると言う。老婦人は、きれいにされたボウルを送り返すと、塩が欲しかったと不平を言う。'
      hearing: '10月2日、{staff}は弁護士の事務員が公聴会のためにギュクリンゲンの市庁舎に2つの書類の束を運ぶのを手伝いました。ドアで、彼らはそれが延期されると言われます。店員は束を段差の上に置き、何度も運び上げてきたのでもう道は分かっているはずだと言う。'
      frost: '11月中旬、{staff}はカーターのワゴンに乗ってレオンベルクからギュグリンゲンまで向かいました。カーターは、ゼイバー渓谷が始まる場所で道が最悪だと言う。霜の中で車輪が歌い、彼は音符で距離を知ることができるようになった。'
  puccini_brussels:
    name: '未完の二重唱'
    place: 'ブリュッセル'
    figure: 'ジャコモ・プッチーニ'
    story: 'プッチーニは、トゥーランドットの結末がまだ未完成だった1924年11月に治療のためブリュッセルに向かった。あるスケッチについて考えている途中でペンが止まります。別のページには楽器のリストがあります。フランコ・アルファノは後にそのような断片をオーケストラが演奏できるものに変換しなければなりませんでした。'
    story_prose:
      opening:
        - '1924年11月、ブリュッセル。プッチーニは治療のためにやって来た。トゥーランドットは最後の場面に達しましたが、二重唱の終わりはまだ緩いシーツの中にあります。いくつかの小節を保持するものもあれば、楽器の名前だけを保持するものもあります。'
        - '歴史上、彼は同月ブリュッセルで亡くなった。アルファノは、彼が残したスケッチからオーケストラが演奏できる音楽を作ることになりました。このブランチでは、写譜師が 2 つの同様の行を 1 つのテーブルに設定し、誰かが作曲家と一緒にそれらを読み進めることができます。'
        - 'この旅には、楽譜を読んで、可能な 2 つの継続をたどることができる人が必要です。また、患者の世話の仕方を知っていて、ベッドサイドで一晩過ごせる人も必要です。'
      points:
        p1: '{staff} は、キーの変更に至るまで両方のバージョンのベースラインをたどり、プッチーニの前でページを順番に並べました。プッチーニはその線の1つをマークしました。鉛筆を持ち上げると、バーの端にはまだ空きスペースがありました。'
        p2: '最後の夜、{staff} は患者ケアの経験を活かしてプッチーニの枕を解決し、手の届く範囲に留まりました。楽譜は背骨を出した状態でベッドのそばに閉じて置かれていた。彼の手は横に来て、隣に寄せられた椅子の背もたれに置かれた。'
      outcomes:
        all: 'その後、楽譜を取り上げた人が鉛筆マークから始めることができます。その夜の部屋では、楽譜は閉じられたままで、椅子はまだベッドの横に置かれていました。'
        p2: 'その夜、彼は少しの間ぐっすり眠りました。椅子は彼が触れることができるほど近くにありました。'
        p1: '次にスコアに取り組む手が、緩いページを広げました。調が変わった小節で、ちょうど新しい書き込みが始まる位置に鉛筆の跡が落ちた。'
      none: 'ベッドサイドの椅子は空でした。 2枚のシートの角がテーブルの上で重なっていました。どれが上にあるのかは、間近で見ないと誰にも分かりません。'
      not_admitted: '{staff} は診療所で助けてくれる場所を見つけることができませんでした。廊下の突き当りのドアの下に一条の光が見えた。'
      excerpts:
        p2: '楽譜は背骨を出した状態でベッドのそばに閉じて置かれていた。彼の手は横に来て、隣に寄せられた椅子の背もたれに置かれた。'
        p1: 'プッチーニはその線の1つをマークしました。鉛筆を持ち上げると、バーの端にはまだ空きスペースがありました。'
    relic: '二重唱の下書き'
    relic_desc: '未完の箇所の横に鉛筆の書き込みがある五線紙。'
    points:
      p1: 'プッチーニがまだ比較検討できるうちに、最終デュエット用の 2 つの代替スケッチを好みの順に並べるのを手伝ってください。'
      p2: 'プッチーニが最悪の不快感から最後の夜を過ごせるよう、あなたの経験を活かしてください。'
    points_fail:
      p1: 'シートは別々のままです。誰が引き継ぐとしても、どちらかを選択する必要があります。'
      p2: '夜が終わっても、ベッドの横の椅子にはまだ空があり、不快感は軽減されません。'
    shift:
      p1:
        was: '1924年11月、最後のデュエットはまだ断片的に存在していた。アルファノはその後、生き残ったものをどのように結合するかを考え出す必要がありました。'
        now: 'プッチーニは、デュエットの終わりに音楽が変わるときに、どの代替案を望むかをマークします。引き継ぐ作曲家はその選択からスタートできる。'
      p2:
        was: '1924年11月24日、プッチーニはブリュッセルで咽頭癌の治療を受けた。彼は11月29日に同じ診療所で亡くなった。'
        now: '{staff} はプッチーニの隣に座り、彼が落ち着くのを手伝います。彼が恐れていた夜は、痛みが軽減され、助けが必要なときに誰かが近くにいてくれるようになり、過ぎ去った。'
        who: 'puccini_brussels'
        bio: 'プッチーニはブリュッセルで静かな最後の夜を過ごした。スコアを脇に置いたとき、彼の隣には誰かがいた。'
    vignettes:
      divider: '写譜師は鉛筆で書かれた 2 つの小節を机の上に並べて置きます。 {staff}がベースを指でなぞるまではほぼ同じに見えます。人は原点に戻ります。もう 1 つは、その後に続く余地を残します。 {staff} はプッチーニが見えるように両方を机の上に置いておきます。'
      future: '{staff} は、劇場で知っているエンディングをタップしている自分に気づきました。写字生はまだ終わりのないバーから顔を上げます。 {staff} はページを戻し、両方が読める最後の小節から始めるように求めます。'
      pin: '写字生はカップを置くために机の隅を空けます。 {staff} は、原稿用紙 1 枚を端から少し内側に移動します。葉の下部、ほぼ空の五線の下に、余白に 2 つの単語が押し込まれています。'
  schumann_endenich:
    name: '別の調に移した曲'
    place: 'エンデニヒ'
    figure: 'ロベルト・シューマン'
    story: 'ロベルト・シューマンがエンデニヒで過ごした時代から、短いピアノ曲のコピーが残されています。彼は公表されたスコアよりも全音低く設定した。 1856 年 7 月、クララ シューマンがボンを訪れ、会いたいと申し出ました。ゲストハウスでリナはその曲を二度コピーした。彼女は下のほうが間違いだと思っています。'
    story_prose:
      opening:
        - 'エンデニヒ、ボン郊外、1856年7月。ロベルト・シューマンは健康状態が悪く、ここに滞在している。彼はかつて『Papillons』の曲の1つを全音下げてコピーしたことがある。今月、クララ・シューマンが会いに来ます。'
        - '歴史上、クララは7月27日に彼を目撃しました。 29日に彼女が戻ってきたときはもう遅かった。この分岐では、宿屋のリナが最初の音の異なる 2 つのコピーを作成しており、エミールはレーンにある 2 つのドアを知っています。'
        - 'この旅行には、2 つの楽譜の同じ曲を認識できる人が必要です。また、道を知っていて、約束を守り、近くで知らせを待ってくれる人も必要です。'
      points:
        p1: '{staff} は両方のスコアを読み、間隔は同じままで開始音がどのように下降するかをマークしました。リナは各ページの上部にキーを書きました。彼女は 2 冊のコピーをフォルダーに並べて入れ、狭い白い端が見えるように残しました。'
        p2: '7月27日、{staff}さんは約束通りクララさんと会い、車道を渡って彼女が待っていたドアに向かった。それが開くと、クララは手に持っていた折りたたまれたメモをしまいました。夕方の光がまだドアの外に傾いていました。'
        p3: '29日、{staff}さんは近くで連絡を待ち、帰宅途中のクララに会い、そのままベッドサイドに連れて行った。彼女は座って毛布の端の下に手を伸ばしました。ロバートの手は彼女の掌の中で動かなかった。'
      outcomes:
        all: '両方のコピーは 1 つのフォルダーに保存され、それぞれのキーが上部に書き込まれました。 29日、クララはベッドサイドに着きました。レーンのドアはまだ開いており、部屋では二人の手が結ばれていました。'
        p3: '29日、クララはベッドサイドに着きました。その後彼女が立ち上がったとき、椅子はまだベッドにぴったりとくっついていた。'
        p2: '２７日の訪問はまだ夕暮れ時に行われた。ドアがゆっくりと閉まる前に、車線の光が消えた。'
        p1: '両方の練習用コピーは 1 つのフォルダーに残りました。もう一度開いてみると、各シートの上部に鍵が書かれていました。'
      none: 'フォルダは閉じられ、下の練習用コピーが外に残されました。細い滑りがまだその端に見えました。'
      not_admitted: '{staff} は、レーン内に紹介できる人がいませんでした。通りの反対側では両方のドアが閉まっていた。'
      desync: 'クララは面会時間が過ぎるまで反対側のドアで待っていました。 {staff} がリコールされたとき、折りたたまれた紙幣はまだコートのポケットの中にありました。'
      excerpts:
        p3: '彼女は座って毛布の端の下に手を伸ばしました。ロバートの手は彼女の掌の中で動かなかった。'
        p2: 'それが開くと、クララは手に持っていた折りたたまれたメモをしまいました。夕方の光がまだドアの外に傾いていました。'
        p1: 'リナは各ページの上部にキーを書きました。彼女は 2 冊のコピーをフォルダーに並べて入れ、狭い白い端が見えるように残しました。'
    relic: '二つの調で書いた練習譜'
    relic_desc: 'それぞれ異なる調で書いた、架空の練習譜二枚。'
    points:
      p1: '2 つのコピーを比較し、より低い音で始まるコピーもそのフォルダーに属している理由を書き留めます。'
      p2: '7 月 27 日のクララの訪問を予定どおりに保ち、約束の時間前にクララに会って、正しいドアまで案内します。'
      p3: '7月29日、ロバートが亡くなる前に、通話の範囲内に留まり、クララをベッドサイドに連れ戻す。'
    points_fail:
