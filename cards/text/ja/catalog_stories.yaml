  mendeleev_petersburg:
    name: '元素の周期表'
    place: 'サンクトペテルブルク'
    figure: 'ドミトリ・メンデレーエフ'
    story: '1869 年 3 月 1 日、ドミトリ メンデレーエフは元素を原子量と化学的類似性によってグループ化した 1 ページの表を作成しました。 3月18日のロシア化学会の会合で、メンデレーエフの不在中にニコライ・メンシュトキンが論文を読み上げた。議事録では議論は次回の会議に持ち越され、そこではこの議題は取り上げられなかった。この表は3月下旬にメンデレーエフの化学の教科書に掲載され、別途配布された。同年春のドイツの抄録では、周期的反復が段階的変化となった。'
    story_prose:
      opening:
        - 'サンクトペテルブルク、1869 年春。3 月 1 日、ドミトリ・メンデレーエフは、原子量と化学的類似性によって元素をグループ化した 1 ページの表を完成させました。まだ見つかっていない元素についてはその表に空白が残されています。'
        - '歴史上、彼は3月18日のロシア化学会の会合には欠席し、ある説ではトヴェリ県のチーズ乳製品工場を見に行ったり、ある説では体調が悪かったりし、ニコライ・メンシュトキンが彼の代わりに新聞を読んだという。議事録では著者が欠席したために議論が延期され、次の会議では誰もそのことを取り上げなかった。 5月にドイツに送られた要約では、彼の最初の結論である性質の周期性が段階的な変化として明らかになった。この支店では、印刷所の製版業者がテーブルの空箱について不平を言い、宿屋の主人がサモワールを保管しています。'
        - 'この旅行では、何種類かの人々が協力してくれるでしょう。論文に精通していて、それに付随する原稿をテーブルから読み取れる人。教えたり、会議で質問をまとめたりできる人。ドイツ語を知っていて一言でも聞き取れる人。'
      outcomes:
        all: 'その夏、ドイツの読者は要約の中で定期的に繰り返されることに気づきました。サンクトペテルブルクの協会の議事録では、テーブルの項目の後に半ページにわたる質疑応答があり、テーブル自体のいくつかの隙間の横に鉛筆の輪があった。'
        p2: '学会の議事録では、表の項目の後に半ページにわたる質疑応答が設けられている。その後彼はテーブルをそばに置き、いくつかの隙間の横に鉛筆の輪を置いた。'
        p3: 'その夏、ドイツの読者は要約の中で要素の性質が周期的に繰り返されることに気づきました。ある人が再発と例外を区別する方法を尋ねる手紙を書いたとき、彼は表を広げて点ごとに答えました。'
        p1: '3 月下旬、化学原理の 2 番目の束が表に掲載され、同僚向けの別紙としても印刷されました。 1875 年にガリウムが発見され、その隙間の 1 つが埋められました。'
      none: '4月15日に協会は再び会合したが、誰も議題に上がらなかった。印刷所では、乾いたシートが 1 枚ずつラインから落ちてきましたが、まだ隙間がありました。'
      desync: '3月18日、メンシュトキンにはテーブルしかなかった。原稿はまだ荷物の中に詰め込まれていたため、協会はその商品を処分した。 {staff} がリコールされたとき、テーブルはまだ会議室の机の上に広げられたままで、誰もそれに触っていませんでした。'
      not_admitted: '{staff} さんは協会の門をくぐることができず、旅館で数日間サモワールでお茶を淹れることを学びました。飼育員は蛇口が正しい方向に回されるまで、ずっと{staff}のブーツを見ていました。'
      points:
        p1:
          class_lettered: '3月18日、ロシア化学会が会合したが、メンデレーエフは出席しなかった。彼がメンシュトキンに残したもののうち、テーブルは一か所に置かれ、論文の原稿は未開封の荷物の中に詰められたままだった。 {staff} は、文書管理者がそうするように、荷物の中から原稿を見つけ、ページごとに確認し、テーブルと一緒にクリップで留め、会議の前に両方をメンシュトキンの手に渡した。メンシュトキンは机の上にテーブルを広げ、原稿を開いて何ページも読んだ。テーブルには隙間があり、後列で誰かがクレーンで見ようとしていた。'
          else: '3月18日、ロシア化学会が会合したが、メンデレーエフは出席しなかった。彼がメンシュトキンに残したもののうち、テーブルは一か所に置かれ、論文の原稿は未開封の荷物の中に詰められたままだった。 {staff} は半夜起きて、夜明け前に未開封のトランクの中に原稿があるのを見つけ、原稿とテーブルを両脇に抱えて急いで会議に向かいました。メンシュトキンは机の上にテーブルを広げ、原稿を開いて何ページも読んだ。テーブルには隙間があり、後列で誰かがクレーンで見ようとしていた。'
        p2:
          class_teaching: '4月15日、協会は再び会合を開き、メンデレーエフは街にいた。前回の会議で延期された項目はまだ古いページに残っていました。 {staff} は、教師がするように、会議の前に表を大きくコピーして部屋の前に飾り、作成者が出席しているときに話し合われる最後の議事録の行を議題の先頭にコピーしました。アイテムが出てきたとき、メンデレーエフはテーブルを手に持って立っていた。誰かが隙間について尋ねると、彼はその箱の周りに鉛筆で輪を描きました。会議が終わるまでに、数カ所に指輪ができ、鉛筆の先は鈍くなっていた。'
          else: '4月15日、協会は再び会合を開き、メンデレーエフは街にいた。前回の会議で延期された項目はまだ古いページに残っていました。 {staff} は、会議の前に秘書が、最後の議事録にある、筆者が出席しているときに話し合うべきという一文を指差し、それを今回の議題にコピーするように頼んだのを見つけました。アイテムが出てきたとき、メンデレーエフはテーブルを手に持って立っていた。誰かが隙間について尋ねると、彼はその箱の周りに鉛筆で輪を描きました。会議が終わるまでに、数カ所に指輪ができ、鉛筆の先は鈍くなっていた。'
        p3:
          class_lettered: '6 月初旬、ドイツの化学雑誌の要約はすでにドイツ語で書かれていましたが、まだ印刷されていませんでした。 {staff} は、翻訳者がそうするように、ロシア語の横にあるドイツ語を読み、最初の結論で止まりました。原文では、特性は周期性を示すと述べていましたが、翻訳では、特性は段階的に変化すると述べていました。メンデレーエフはシートを受け取り、行を読み、単語を取り消して、その横に周期性を表す単語を書き戻しました。インクが乾く前に、シートはドイツ向けの封筒に入りました。'
          else: '6 月初旬、ドイツの化学雑誌の要約はすでにドイツ語で書かれていましたが、まだ印刷されていませんでした。 {staff} はドイツ語とロシア語を点ごとにチェックし、最初の結論の 1 つの単語に下線を引きました。原文では周期性があり、翻訳では段階的に変化しました。メンデレーエフはシートを受け取り、行を読み、単語を取り消して、その横に周期性を表す単語を書き戻しました。インクが乾く前に、シートはドイツ向けの封筒に入りました。'
      excerpts:
        p2: '誰かが隙間について尋ねると、彼はその箱の周りに鉛筆で輪を描きました。会議が終わるまでに、数カ所に指輪ができ、鉛筆の先は鈍くなっていた。'
        p3: 'メンデレーエフはシートを受け取り、行を読み、単語を取り消して、その横に周期性を表す単語を書き戻しました。インクが乾く前に、シートはドイツ向けの封筒に入りました。'
        p1: 'メンシュトキンは机の上にテーブルを広げ、原稿を開いて何ページも読んだ。テーブルには隙間があり、後列で誰かがクレーンで見ようとしていた。'
    relic: '元素を書いたカードの束'
    relic_desc: '一人遊びのトランプのように並べられる、手書きのカード。'
    points:
      p1: 'メンデレーエフはすでに街を出ているので、メンシュトキンに残した紙とテーブルを一緒に化学会の会合に持って行きましょう'
      p2: '著者が戻ったら、議論のために取っておいたアイテムを回収し、次の会議でテーブルに関する質問に答える時間を与えます。'
      p3: 'ドイツ語の抄録が印刷される前に、メンデレーエフにその最初の結論を確認させ、性質が周期的に再発するという言葉を復元してもらいます'
    points_fail:
      p1: 'メンシュトキンはテーブルだけを受け取ります。その紙にはまだ著者の物が詰め込まれていたため、協会はその物品を廃棄し、事務所は従業員をリコールした。'
      p2: '延期されたアイテムは、分の前のページに残ります。次回の会議では、要素について話し合う時間は設けられません。'
      p3: 'ドイツ語のコピーは合成業者に送られました。読者は、特性が段階的に変化するのを見て、それらが繰り返し起こるという主張を見逃します。'
    shift:
      p1:
        was: '1869年3月18日（ロシア暦では3月6日）、メンシュトキンはメンデレーエフに論文を提出した。メンデレーエフは欠席した。一説によると、彼はトヴェリ県のチーズ乳製品工場を視察するため出発したという説もあり、またある説では病気だったという。'
      p2:
        was: 'メンデレーエフ氏が欠席したため、議事録では議論が延期された。その後の会合ではこの件は取り上げられなかった。'
        now: '協会はメンデレーエフに次回の会議で答える時間を与えている。彼は係争中の項目にマークを付け、それらを作成した化学者に確認することに同意しました。'
      p3:
        was: '1869年のドイツの要約では、ロシアの原文では周期性が主張されていたが、段階的変化を表す言葉が使用されていた。'
        now: 'ドイツ語の要約では、特性は定期的に再発すると述べられています。要約だけを読んだ特派員が再発と例外の違いについて質問すると、メンデレーエフは表から答えることができます。'
        who: 'mendeleev_petersburg'
        bio: 'メンデレーエフはサンクトペテルブルクで初期のテーブルを作成し、それを協会の会議、ルーズシート、日記を通じて回覧しました。作品が言語を越えるにつれて、中心となる用語の意味が変わりました。'
    vignettes:
      flyers: '{staff} は印刷所を手伝い、テーブルの新しいシートをラインに吊るして乾燥させます。作曲者は、これほどたくさんの空のボックスと疑問符をページに設定したのは初めてだと不満を漏らし、紳士がそれらを埋めるのを忘れたのかと尋ねます。'
      neva: 'ネヴァ川の氷は消えてしまいました。 {staff} は要塞から宮殿へボートが渡る間、堤防に群衆とともに立っている。横にいた男性は、ボートが渡るまでは誰も渡ってはいけないと言った。'
      samovar: '{staff} は宿屋でサモワールからお茶の淹れ方を学びます。飼育員によると、外国人はいつも蛇口を逆にひねってブーツを火傷し、{staff}の足を常に監視しているという。'
  curie_paris:
    name: '二つの新元素'
    place: 'パリ'
    figure: 'マリー・キュリー'
    story: '1898年4月、マリー・キュリーは、ピッチブレンドがウランで説明できるよりも強い光線を発していると報告した。パリの工業物理化学学校でピエール・キュリーと協力して、彼女は部品を分離し、光線を追跡しました。 1898年7月18日、彼らは新しい元素を発表し、母国のポーランドにちなんでポロニウムと名付けました。 12月26日、彼らはギュスターヴ・ベモンとともにラジウムを発表した。キュリー夫人は再生不良性貧血で 1934 年に亡くなりましたが、これは一般的に彼女の長期にわたる放射線被ばくが関係しています。'
    story_prose:
      opening:
        - '1898 年夏、パリ。工業物理化学学校で、マリー キュリーとピエール キュリーがピッチブレンドを部分ごとに分離し、光線を追っています。 4月に彼女は、この鉱石がウランでは説明できないほど強い光線を発していると報告した。'
        - '歴史上、7月18日に彼らは新しい元素を発表し、母国のポーランドにちなんでポロニウムと名付けました。 12月26日、ギュスターヴ・ベモンとともにラジウムを発表し、ウジェーヌ・ドゥマルセーが見た新しいスペクトル線が紙幣に印刷されました。彼らが働いていた小屋は換気が悪く雨が吹き込み、何年もの間素手でサンプルを扱っていました。 1934 年にマリーは再生不良性貧血で亡くなりましたが、これは一般に彼女の長時間の放射線被ばくが関係しています。この支店では、女性がカルチェラタンで小さな食堂を経営し、男性がセーヌ川沿いで本屋を経営しています。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。シールドを持ってきて、医学や研究の仕事に詳しい人。レコードを知っていて、いくつかのレコードを並べることができる人。部屋を獲得できる説得力のある人。'
      outcomes:
        all: 'その冬、楽器は学校が撤去した部屋に移動し、盾はベンチの前に立ち、手袋はその端の釘にぶら下がった。 12月26日、ラジウムに関する報告書がアカデミーに届き、新しいスペクトル線がそれとともに印刷されました。'
        p3: 'その年から、盾がベンチの前に立ち、手袋がその端の釘にぶら下がっていました。マリーはその後さらに数年間働きました。'
        p2: 'その冬、楽器は学校が撤去した部屋に移動し、再び移動することはなかった。ノートは窓辺に日付順に並んでいた。'
        p1: '12月26日、ラジウムに関する報告書がアカデミーに届き、新しいスペクトル線がそれとともに印刷されました。物置では、その年の測定ノートがベンチの隅に積み上げられており、一番上のノートはまだ開いたままでした。'
      none: 'その冬も雨は小屋の屋根から降り注いでいた。二人は相変わらず素手でガラス皿を持ち上げ、暗闇の中でその中にあるものがほのかに光った。'
      desync: '12 月 25 日の夜になっても、スペクトル観測とその記録は一致せず、年末報告書は提出されませんでした。{staff} がリコールされたとき、それぞれ日付が異なる 3 冊のノートが小屋のベンチで開かれていました。'
      not_admitted: '{staff} は校庭の物置には一度も入らず、カルチェラタンの小さな場所で食事を数回食べました。隣のテーブルではポーランド人の学生たちがまだ議論しており、ビーツのスープはまた冷めていた。'
      points:
        p1:
          class_lettered: '12月25日、翌日には年度末報告書がアカデミーに提出されることになっていた。デマルセーが見た新しいスペクトル線は、ノートに書かれた測定値と、項目ごとに照合する必要がありました。 {staff} は、記録管理者が行うように、スペクトル観測の日付、サンプルの数、測定値をノートに 1 行ずつ並べて表にコピーし、原稿の先頭に置きました。ピエールは原稿を最初から最後まで読み、署名してマリーに渡しました。彼女は彼の名前で署名し、原稿の上にスペクトル記録を置きました。'
          else: '12月25日、翌日には年度末報告書がアカデミーに提出されることになっていた。デマルセーが見た新しいスペクトル線は、ノートに書かれた測定値と、項目ごとに照合する必要がありました。 {staff} は一晩中ノートを調べ、スペクトル観測に伴うサンプルの番号を 1 つずつ見つけて、原稿の余白にコピーしました。ピエールは原稿を最初から最後まで読み、署名してマリーに渡しました。彼女は彼の名前で署名し、原稿の上にスペクトル記録を置きました。'
        p2:
          class_lettered: '12月24日、再び雨が小屋の屋根を通って降り、雨を受けていたたらいが戸口まで達していました。 {staff} は、記録管理者が行うように、ポロニウムに関する 7 月のメモ、年末に提出する原稿、屋根が雨漏りした時期、作業が停止した時期、器具を移動した頻度を記録した日の記録を 1 冊に綴じて、学校の教室の責任者に持っていきました。彼は仕事が止まってまだ長いページをめくり、引き出しから鍵を取り出し、手帳の上に置きました。鍵には小さな木の札がぶら下がっており、そこには部屋番号が書かれていた。'
          else: '12月24日、再び雨が小屋の屋根を通って降り、雨を受けていたたらいが戸口まで達していました。 {staff} は 2 つの報告書と休業日簿を持って、部屋の責任者が出てくるまで午前中ずっと学校の事務室の外で待ち、それから彼のためにページを 1 枚ずつめくりました。彼は仕事が止まってまだ長いページをめくり、引き出しから鍵を取り出し、手帳の上に置きました。鍵には小さな木の札がぶら下がっており、そこには部屋番号が書かれていた。'
        p3:
          class_medical: '8月末、小屋内は息苦しく、ベンチには何度も精製された溶液を入れたガラス皿が並んでいた。マリーとピエールは依然として皿を持ち上げ、素手で皿から注ぎました。 {staff} さんは、看護師が教えるように、ベンチの前にシールドを設置し、サンプルをその後ろに 1 つずつ移動し、それぞれに手袋を手渡し、これは血を抜かずに傷ができると言いました。マリーは盾を見て手袋をはめ、盾の後ろのガラス皿に手を伸ばした。夕方に部屋が暗くなるにつれて、皿の中にあるものがかすかな光を放ちました。それは彼女の手の上ではなく、盾の上に落ちました。'
          class_learned: '8月末、小屋内は息苦しく、ベンチには何度も精製された溶液を入れたガラス皿が並んでいた。マリーとピエールは依然として皿を持ち上げ、素手で皿から注ぎました。 {staff} は、実験室の要求に応じて、ベンチの前にシールドを設置し、その後ろにサンプルを移動し、体からどのくらいの距離が安全かを測定し、ベンチ全体にチョークで線を引き、その横に 2 組の手袋を置きました。マリーは盾を見て手袋をはめ、盾の後ろのガラス皿に手を伸ばした。夕方に部屋が暗くなるにつれて、皿の中にあるものがかすかな光を放ちました。それは彼女の手の上ではなく、盾の上に落ちました。'
          else: '8月末、小屋内は息苦しく、ベンチには何度も精製された溶液を入れたガラス皿が並んでいた。マリーとピエールは依然として皿を持ち上げ、素手で皿から注ぎました。 {staff} は持参したシールドをベンチの前に設置し、サンプルを 1 つずつ後ろに移動し、マリーがいつも座っているスツールに手袋を置きました。マリーは盾を見て手袋をはめ、盾の後ろのガラス皿に手を伸ばした。夕方に部屋が暗くなるにつれて、皿の中にあるものがかすかな光を放ちました。それは彼女の手の上ではなく、盾の上に落ちました。'
      excerpts:
        p3: 'マリーは盾を見て手袋をはめ、盾の後ろのガラス皿に手を伸ばした。夕方に部屋が暗くなるにつれて、皿の中にあるものがかすかな光を放ちました。それは彼女の手の上ではなく、盾の上に落ちました。'
        p2: '彼は仕事が止まってまだ長いページをめくり、引き出しから鍵を取り出し、手帳の上に置きました。鍵には小さな木の札がぶら下がっており、そこには部屋番号が書かれていた。'
        p1: 'ピエールは原稿を最初から最後まで読み、署名してマリーに渡しました。彼女は彼の名前で署名し、原稿の上にスペクトル記録を置きました。'
    relic: 'ピッチブレンドの試験管'
    relic_desc: '暗闇の中でかすかな光を残す、暗い鉱石のガラス管。'
    points:
      p1: '年末の読み取りの前に、まだ独立したチェックを待っている記録を照合し、2 番目の報告書を保護します'
      p2: '2 つのレポートを使用して、キュリーの通常の作業室を確保し、後の測定のために機器と記録を保護します。'
      p3: '今後はマリーとピエールとサンプルの間にシールドを置き、手や体を光線から守ります。'
    points_fail:
      p1: '独立した観察結果は、提出前にチームの記録と照合することはできません。年末報告書を紛失し、事務所はその従業員をリコールした。'
      p2: 'チームは今でも間に合わせのベンチを共有している。天候が悪化すると、機器を移動してスペースが空くのを待たなければなりません。'
      p3: '彼らは今でも素手でサンプルを扱っており、毎年、放射線が二人に降り注いでいます。'
    shift:
      p1:
        was: '1898 年 12 月 26 日、パリのアカデミーは新しい放射性物質に関する報告書を受け取り、それと並行して独立した分光観測結果を発表しました。'
      p2:
        was: '2 つの報告の後、1898 年にキュリー夫妻は学校の仮設スペースで研究を続けました。'
        now: '{staff} は、両方のレポートを中断の記録とともにスペースを手配できる人に提示します。学校では長期測定用の部屋を確保している。'
      p3:
        was: '1934 年 7 月 4 日、マリー・キュリーは再生不良性貧血で亡くなりました。一般に、彼女の長時間の放射線被ばくが原因であると考えられています。'
        now: '1898 年以降、二人とも遮蔽物の後ろでサンプルを使って作業し、長年にわたって受ける放射線量ははるかに少なくなりました。マリーは歴史上よりも健康状態が良く、数年間長く働きました。'
        who: 'curie_paris'
        bio: 'マリー・キュリーは 1898 年以来、遮蔽物の背後で放射性物質を扱っていました。彼女は晩年の深刻な放射線障害を免れ、さらに数年間働きました。'
    vignettes:
      shed: '校庭の物置の屋根から雨が降ってきます。 {staff} は水漏れの下に洗面器を置き、ガラス製品のベンチを水滴から遠ざけました。隅にあるストーブはほとんど部屋を暖めません。'
      borscht: '{staff} はカルチェラタンの小さな店で食事をしています。隣のテーブルでは二人のポーランド人学生がビーツのスープが冷めるまでポーランド語で議論しており、オーナーはここにはセーヌ川のハトよりも多くのポーランド人がいると言う。'
      bookstall: 'セーヌ川沿いの書店 {staff} で、肉体を通過する新しい光線についてのパンフレットが見つかります。屋台の店主は、最近の人々は目に見えないものにはお金を払うだろうと語った。'
  freud_vienna:
    name: '一冊の本に記された二つの年'
    place: 'ウィーン'
    figure: 'ジークムント・フロイト'
    story: '1899年11月4日、ジークムント・フロイトの『夢判断』がウィーンで出版され、出版社はそのタイトルページに1900と印刷しました。フロイトは後にこの本を父親の死に対する自分の反応と呼んだ。初版は600部で、売れるまでに8年かかった。第 2 版は 1909 年に発行されました。'
    story_prose:
      opening:
        - 'ウィーン、1899 年秋。ジークムント・フロイトの『夢判断』が出版社 Deuticke から出版されようとしています。 11月4日に発売され、タイトルページには1900と印刷されています。 3年前の10月、彼の父ジェイコブがウィーンで亡くなりました。フロイトは後に、この本は父親の死に対する自分の反応だったと語った。'
        - '歴史上、この本は出版当時ほとんど注目を集めませんでした。初版 600 部が売れるまで約 8 年かかり、第 2 版が出版されたのは 1909 年でした。都心部にあるこの支店には、窓を拭く助手と注文簿を保管する使い走りがいて、コーヒー ハウスでは医師が新聞を読んでいます。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。医学に精通していて、同僚の一員として話すことができる人。新聞のことや本がどの手に届くべきかを知っている人。ドアを開けることができる、準備ができている舌を持った人。'
      outcomes:
        p1: 'その冬、フロイトのもとに次々と手紙が届き、その本についてページごとに尋ねられました。本屋の注文帳には、夢の本がさらに数行続いていました。'
      none: '12月末に雪が降り、本屋の少年が注文書を調べていたところ、その月は夢の本がほとんど動いていないことに気づきました。窓の隅には、1900年と書かれたタイトルページが開いたままの本が置かれていました。'
      not_admitted: '{staff} はそれらの同僚のドアを決して通過せず、都心部の書店の窓口に数回立っただけでした。夢の本は隅に置いてあり、タイトルページを開いた状態で、ガラスの上に薄い埃の膜がついていました。'
      points:
        p1:
          class_medical: '11月下旬、夢に関する新しい本はショーウィンドウの隅に3週間近く放置されていた。 {staff} は医師として、バッグにコピーを入れて数人の同僚の診察室を訪れ、それぞれの夢に関する章にメモを滑り込ませ、どのページから始めるべきかを指示しました。その夜、都心部の窓は遅くまで明かりを灯していた。机の上にはタイトルページに1900年と書かれた本が置かれており、すでに半分以上読んでいた。'
          class_press: '11月下旬、夢に関する新しい本はショーウィンドウの隅に3週間近く放置されていた。 {staff} は記者の連絡先を利用して、どの医師が雑誌に長い書評を書き、コピーを包装して戸別訪問して運ぶかを調べました。その夜、都心部の窓は遅くまで明かりを灯していた。机の上にはタイトルページに1900年と書かれた本が置かれており、すでに半分以上読んでいた。'
          else: '11月下旬、夢に関する新しい本はショーウィンドウの隅に3週間近く放置されていた。 {staff} はコーヒーハウスで数日の午後に座り、論文を読んでいる医師たちと話に夢中になり、読んだときにだけ返してほしいと頼みながら、そのコピーを 1 冊ずつ貸し出しました。その夜、都心部の窓は遅くまで明かりを灯していた。机の上にはタイトルページに1900年と書かれた本が置かれており、すでに半分以上読んでいた。'
      excerpts:
        p1: 'その夜、都心部の窓は遅くまで明かりを灯していた。机の上にはタイトルページに1900年と書かれた本が置かれており、すでに半分以上読んでいた。'
    relic: '日付の入った書店の伝票'
    relic_desc: 'タイトルページに1900年と書かれている本の、1899年11月付けのウィーンの書店からの配達伝票。'
    points:
      p1: '本が出版されてからの静かな数週間に、『夢判断』を最後まで読んでくれる同僚の手に渡してください。'
    points_fail:
      p1: 'この本はほとんど注目を集めていない。初版600部が売れるまでに8年かかる。'
    shift:
      p1:
        was: '1899 年 11 月 4 日、『夢判断』は 1900 年発行で初版 600 部がウィーンで出版されました。販売までに 8 年かかりました。'
        now: '{staff}が何人かの同僚に本を届けると、彼らはその冬のうちに最後まで読みます。本をめぐる手紙や議論が何年も早く始まり、初版も八年を待たずに売れます。'
        who: 'freud_vienna'
        bio: 'フロイトの夢についての本は、刊行された年から真剣に読む人を得た。何年も待つことになるはずの議論が、1899年の冬に始まった。'
    vignettes:
      window: '{staff}は市内中心部の書店のショーウィンドーの前で長いこと立ち止まる。隅には夢についての新刊があり、扉には1900年と印刷されている。店員が出てきてガラスを拭き、来年の新刊扱いなので今はここで出番を待っているだけだと言う。'
      cafe: '{staff}はカフェの新聞掛けから新聞を取り、書評欄を片端から読む。どの紙面にもあの本は載っていない。隣の席の医師は夢についての本を三百ページも読む時間などないと言って、新聞を読み終えるためにコーヒーをもう一杯頼む。'
      snow: '十二月の末に雪が降る。{staff}が書店の少年と入口の雪を片づけると、少年はかじかんだ指で注文票をめくりながら、夢の本は今月ほとんど売れなかったと言う。夢の本なら夏のほうが売れるのだろうかと聞いてくる。'
  cajal_barcelona:
    name: '一つずつ独立した神経細胞'
    place: 'バルセロナ'
    figure: 'サンティアゴ・ラモン・イ・カハール'
    story: '1887年末から、サンティアゴ・ラモン・イ・カハールはバルセロナの組織学の教授を務めた。 1888 年 5 月、彼は自分の雑誌の創刊号の代金を支払い、その数部のほとんどをスペイン語をめったに読まない海外の研究者に送りました。 1889 年 10 月、彼はベルリンで開催されたドイツ解剖学会に自費で出席し、顕微鏡でスライドを見せました。そこの上級組織学者であるアルバート・フォン・ケルリカーが研究を引き継ぎました。 1906年に彼はカミロ・ゴルジとノーベル賞を分け合った。'
    story_prose:
      opening:
        - 'バルセロナ、1889年秋。サンティアゴ・ラモン・イ・カハールは大学で組織学を教えており、銀染色切片で神経細胞の枝を研究している。その前年、彼は自分の雑誌の創刊号約60部を自腹で支払い、そのほとんどが海外に投稿された。'
        - '歴史上、海外の同僚がスペイン語を読むことはほとんどなく、彼の論文はほとんど注目を集めませんでした。 9月26日に彼は旅行休暇を取得し、ベルリンまでの運賃を自ら値上げし、10月にはドイツ解剖学会の会合でスライドを顕微鏡下にセットした。それ以来、ケルリカーは彼をサポートしました。この支部では、研究室の学生が重クロム酸カリウムに浸した組織の瓶を監視しており、ベルリンまでの運賃を尋ねるために駅に来ています。'
        - 'この旅行では 2 種類の人が協力してくれるでしょう。1 つは帳簿とスライドを整理してスケジュールを守ることができる人、もう 1 つは外国語に精通し、通訳を見つけて人々を説得できる人です。'
      outcomes:
        all: '10月、ベルリンの会議場では顕微鏡の前に行列ができた。その表紙の男性は、翻訳された数ページを持っていました。'
        p2: 'それ以来、カハルが海外に送るすべての封筒には、翻訳された一連のキャプションが入っていました。'
        p1: '10月、ベルリンの会議場で、カハル氏は顕微鏡の下に一部を滑り込ませ、後ずさりして、人々に見るように頼んだ。'
      none: 'バルセロナの研究室では、スライドのパケットが依然として木製ケースに積み上げられ、テーブルから離れることはありませんでした。'
      desync: '月末になっても運賃はまだ不足しており、滑り台はまだ満員ではありませんでした。 {staff} がリコールされたとき、カハルはベルリンに郵送するために書面による説明を封筒に入れていました。'
      not_admitted: '{staff} はその研究室に入ったことはありません。スライドはまだテーブルの上に広げられたままで、ベルリンの日が近づいていた。'
      points:
