      p3:
        was: 'ガウスはゲッティンゲン大学に対し、ジェルマンに名誉学位を授与するよう要請していた。彼女が1831年6月27日に亡くなったとき、それは授与されていなかった。'
        now: '{staff} は、ガウスが何をしたかについて彼女の言葉を伝えます。ジェルマンは、彼女が行けなかった大学は彼女を称える意味があると聞く。'
        who: 'sophie_germain_paris'
        bio: 'この年表の中で、ジャーメインはガウスが彼女をゲッティンゲン大学の名誉学位に推薦したことを生前に知りました。学位自体はまだ遅すぎました。'
    vignettes:
      water: '3 月 7 日、{staff} は、水運業者がバケツ 2 杯のセーヌ川の水をサヴォワ通りの家の 5 階まで運ぶのを手伝いました。呼吸の間の歩数を数えながら、パリの家は年々高くなっているが、給料は今も床ではなくバケツでもらっていると彼は言う。'
      quai: '4月中旬、{staff}は岸壁の書店の屋台で古い年鑑をめくっていた。書店員は、この山全体が 1 つの世帯から来たもので、余白には追跡できない金額が詰まっているため、重さで販売していると述べています。'
      wash: '5月下旬、{staff}は、川沿いの洗濯船でシーツを絞る洗濯婦を手伝う。春の間ずっとセーヌ川が上がったり下がったりしており、船もそれに合わせて上がったり下がったり、背中も同様だという。'
  modigliani_paris:
    name: '肖像画の裏の札'
    place: 'パリ'
    figure: 'アメデオ・モディリアーニ'
    story: '1919 年 5 月末、アメデオ モディリアーニとジャンヌ エビュテルヌは、その前の 11 月に生まれた娘を連れてニースからパリに戻りました。彼の結核は悪化し、秋には絵を描く気力も失われていました。 1920年1月24日、結核性髄膜炎のためパリのシャリテ病院で35歳で死去した。 2日後、妊娠8か月のジャンヌが実家で亡くなった。彼の仲間の画家たちは、1月27日に彼の葬儀のためにお金を集めた。その2年前に開催された生涯唯一の個展は商業的には期待外れに終わった。'
    story_prose:
      opening:
        - '1920年1月、パリ。モディリアーニとジャンヌ・エビュテルヌが娘を連れてニースから帰国してから半年以上が経った。彼の病気は悪化した。秋になると彼は筆を持つのが困難になった。'
        - '歴史上、モディリアーニはシャリテ病院で亡くなり、ジャンヌはその２日後に亡くなった。この支店では、誰かがスタジオをノックして、病院やジャンヌの隣で順番を務めることができます。'
        - 'この旅には、画家の話を聞いてくれる人、そして適切な物品を持って患者の世話をできる人が必要です。ジャンヌも一緒に座って待ってくれる人を必要としています。'
      points:
        p1: '{staff} は肖像画を光の中に移動し、数年後、人々は彼の絵の中の人々を見るために長い道のりを訪れるようになるだろうと語ります。ラベルの角が裏側から盛り上がっています。モディリアーニは肖像画を裏返し、紙を手のひらに当てます。'
        p2: '{staff} はスタジオに到着し、彼らが知っているケアで患者を安定させ、病院に連れて行く人々の後を追います。誰かがドアまで椅子を持ってきました。ワードが引き継いだ場合にのみ、{staff} は保持していたフレームから離れます。'
        p3: '病院では、{staff} が持参した器具で治療を受け、自分でカップを置けるようになるまで待ちます。カップがテーブルを叩きます。モディリアーニはもう一方の手を伸ばし、少し奥まで押し込みます。'
        p4: '{staff} はジャンヌと一緒にいて、彼女が食べられるようになるまで待ち、ボウルは手の届くところに置いておきます。ジャンヌは膝の上にボウルを抱えています。窓際の紙がすきま風で持ち上がると、彼女はその角を縁の下に下げます。'
      outcomes:
        all: 'スタジオが再び開き、ジャンヌが絵を描きました。テーブルのそばには低いスツールが 2 脚あり、窓際のスツールにはペンキの斑点があった。'
        p3: 'モディリアーニは回復するとスタジオに戻りました。未完成の顔がテーブルの上に置かれ、ページの端にブラシがかかっていました。'
        p4: 'ジャンヌがまた絵を描きました。二人の子供が寝静まった後、彼女はランプのそばに紙を広げた。'
        p1: '数年後、誰かがその肖像画の前で立ち止まりました。ラベルがフレームの裏側に引っかかったままでした。'
        p2: '病院が彼を収容した。一緒に歩いていた人はドアの内側の椅子に座った。'
      none: 'スタジオのドアの近くには誰もいなかった。暗くなると、その下にあった細い光さえ消えた。'
      not_admitted: '{staff} はスタジオに到着しませんでした。石炭の入った袋はまだ階段の曲がり角の壁に立てかけられていた。'
      desync: '病院への搬送は失敗に終わった。政府機関が {staff} をリコールしたとき、踊り場の半分はまだ空のままでした。'
      excerpts:
        p3: 'カップがテーブルを叩きます。モディリアーニはもう一方の手を伸ばし、少し奥まで押し込みます。'
        p4: 'ジャンヌは膝の上にボウルを抱えています。窓際の紙がすきま風で持ち上がると、彼女はその角を縁の下に下げます。'
        p1: 'ラベルの角が裏側から盛り上がっています。モディリアーニは肖像画を裏返し、紙を手のひらに当てます。'
        p2: '誰かがドアまで椅子を持ってきました。ワードが引き継いだ場合にのみ、{staff} は保持していたフレームから離れます。'
    relic: '木炭の描画材'
    relic_desc: '指が黒くなる、小さな木炭のかけら。'
    points:
      p1: '彼がまだ頭が冴えているうちに、彼が描いた人物は多くの人々の記憶に残るだろうということを伝えてください。'
      p2: '彼がスタジオで病気で横たわり、何日も誰も電話をかけないときは、必ずシャリテ病院に連れて行ってください'
      p3: 'シャリテで結核性髄膜炎を治す'
      p4: '1月下旬、妊娠8か月のジャンヌ・エビュテルヌと一緒に滞在し、彼女の日々を手伝います。'
    points_fail:
      p1: 'この支部では、彼の唯一の個展で期待外れの評価を受けた後、彼の肖像画がどうなるのかを誰も彼に語らない。'
      p2: 'この支店では誰も時間通りにドアを通り抜けられず、シャリテに連れて行かれません。その支店は歴史と歩調を合わせられなくなり、事務所はその従業員を召還した。'
      p3: 'この枝でも病気は相変わらず続いている。彼は1月24日にシャリテで35歳で死去した。'
      p4: 'その従業員はその日々をジャンヌと一緒に過ごすことができなかった。'
    shift:
      p1:
        was: '1917年12月3日、モディリアーニの生涯唯一の個展に警察が介入した。ショーの成績は悪かった。'
        now: '{staff} は、病気になる前に、自分が描いた人物は世界中の美術館に展示されるだろうと告げました。'
      p2:
        was: '1920年1月、モディリアーニは重病を患い、パリのシャリテ病院に運ばれた。'
      p3:
        was: '1920年1月24日、モディリアーニはパリのシャリテ病院で結核性髄膜炎のため35歳で死去した。'
        now: '{staff} は彼を治す薬を持ってきました。彼は病院を出てスタジオに戻ります。'
        who: 'modigliani_paris'
        bio: 'モディリアーニは 1920 年の冬に回復し、さらに何年も絵を描き、周囲の人々を描き続けました。'
      p4:
        was: 'モディリアーニの死から2日後の1920年1月26日、妊娠8か月のジャンヌ・エビュテルヌが実家で亡くなり、生後14か月の娘が残された。'
        now: '{staff}はそんな日々を彼女の傍に居続ける。この時間軸では、ジャンヌは子供を産み、息子と娘を育て、その後再び絵を描き始めます。'
        who: 'jeanne_hebuterne'
        bio: 'ジャンヌ・エビュテルヌは 1920 年の冬を生き抜き、二番目の子供を出産し、両方の子供を育てながら絵を描き続けました。'
    vignettes:
      coal: '1 月 10 日、{staff} は、同じカウンターで木材、石炭、ワインを販売する通りの炭鉱夫のために石炭の入った袋を階段まで運びました。この冬、モンパルナスでは一袋を買う人はいない、と彼は言う。彼らは半分を購入し、残りの半分を約束で支払います。'
      saucers: '2 月初旬、{staff} はモンパルナスのカフェでウェイターのテーブルの片付けを手伝いました。各ドリンクは独自の受け皿に乗せられ、お札は山札から数えられます。彼は奥のテーブルを指差した。画家たちはそこに円盤の塔を建て、お金がなくなったら図面で支払うのだ。'
      mimosa: '3 月上旬、{staff} は市場の花売りがミモザの最初の房をほどくのを手伝います。彼女によると、彼らは夜行列車に乗って南からやって来て、寒い3月にパリで唯一の黄色だという。'
  wallace_ternate:
    name: 'テルナテから届いた論文'
    place: 'テルナテ'
    figure: 'アルフレッド・ラッセル・ウォレス'
    story: '1858 年 2 月、モルッカ諸島で発熱が続いた後、アルフレッド・ラッセル・ウォレスは、品種がどのようにして元の型から離れていくのかについてエッセイを書きました。日付と場所は 1858 年 2 月、テルナテ島と記されています。 3月25日、ウォレスは若い狩人ジュマートを含む一行とともにテルナテ島から出航した。彼らはニューギニア海岸のドリーに到着した。このエッセイはイギリスのチャールズ・ダーウィンに送られました。 7月1日、この本はロンドンでダーウィンの作品と並んで読み上げられ、どちらの著者も会場にはいなかった。'
    story_prose:
      opening:
        - 'モルッカ諸島、1858 年 2 月。発熱の後、ウォレスは品種が元の形からどのように分岐するかについてエッセイを書きます。彼はそれをテルナテ島で日付を付けました。'
        - '歴史上、このエッセイはイギリスに伝わりました。ウォレスはドリーまで船で行き、そこで足首を負傷した。彼と一緒に旅行していたジュマートさんは6月にそこで亡くなった。この支店では、ウォレスが書いている間、誰かが見張りをしてドリーに渡ることができます。'
        - 'この旅行には、病床のそばにいて、乗客に休息の時間を与えてくれる誰かが必要です。また、傷のケアを知っている人、または適切な消耗品を持ってくる人も必要です。'
      points:
        p1: '熱が下がると、{staff} は近くにいて、ウォレスの手の届くところに紙と水を移動させます。彼は場所の名前を書いて立ち止まります。 {staff} が窓際に持ち上げられたシートの角をキャッチします。'
        p2: 'ドリーでは、{staff} がウォレスの足首を手当てし、体重に耐えられるようになるまで待って、一緒にさらに数歩進みます。ドアの外は泥がまだ濡れています。ウォレスがそこに足を踏み入れると、2 番目のプリントも最初のプリントと同じくらいの深さになります。'
        p3: 'ジュマートさんはベッドから起き上がれない。 {staff} は、自分でボウルを移動できるようになるまで、彼と一緒にいて、持参した備品を使用します。ジュマートはまず両手でボウルを持ち、その後片方を放します。水が手首に沿って流れ、ベッドの横に滴り落ちます。'
      outcomes:
        all: 'この新聞は最終的にイギリスに届きました。ボートがドリーを離れたとき、ジュマートは足をサイドに引き寄せ、ウォレスはベンチにスペースを空けた。'
        p3: '7月下旬にはボートにもう1人乗る余地がありました。ジュマートはボウルを足元に置いて座った。'
        p2: '蒸気船がドリーにある間に、ウォレスは森に戻りました。少し進んだところで、彼はかがんで靴の泥を拭き取った。'
        p1: 'このエッセイは後にロンドンで読まれた。原稿を開いてみると、最後の行にはまだテルナテと書かれていました。'
      none: '窓際にテーブルがありました。湿気が入ってくると、シートの外側の角が丸まり始めました。'
      not_admitted: '{staff} はパーティーに参加できませんでした。岸壁でロープが弛んで、水面に線を引いた。'
      desync: 'ベッドのそばに紙が未完成のまま放置されていた。 {staff} がリコールされたとき、まだフレームの内側に湿った跡が残っていました。'
      excerpts:
        p3: 'ジュマートはまず両手でボウルを持ち、その後片方を放します。水が手首に沿って流れ、ベッドの横に滴り落ちます。'
        p2: 'ドアの外は泥がまだ濡れています。ウォレスがそこに足を踏み入れると、2 番目のプリントも最初のプリントと同じくらいの深さになります。'
        p1: '彼は場所の名前を書いて立ち止まります。 {staff} が窓際に持ち上げられたシートの角をキャッチします。'
    relic: '虫ピン箱の甲虫'
    relic_desc: '小さなブリキの箱に入れられた採集標本の甲虫。'
    points:
      p1: 'マラリアの時代に、エッセイを最後まで読んでください'
      p2: 'ドリーで痛めた足首を潰瘍になる前に治してください'
      p3: '若いハンターのジュマートを熱と赤熱から救ってください'
    points_fail:
      p1: '熱は冷めず、ドラフトは2月になっても完成しなかった。郵便船が受け取った手紙にはそれが残っておらず、この支部ではリンネ協会は7月1日時点でそのような書類を持っていなかった。'
      p2: '歴史にあるように傷は化膿し、彼は松葉杖をついて小屋の中で1か月以上座っていた。この枝では、ドリーの森の昆虫は依然として彼の使用人だけが捕まえていました。'
      p3: '歴史にあるとおり、ジュマートは 6 月 26 日に亡くなり、この支部では 7 月にドリーを出航したボートは彼なしで出発しました。'
    shift:
      p1:
        was: '1858 年 2 月、マラリアが治まるとすぐにウォレスは論文を書き、テルナテ島に署名しました。'
      p2:
        was: '1858年5月、ウォレスはドリーで足首を負傷した。傷は潰瘍になり、1か月以上立ち上がれなくなった。'
        now: '傷は化膿せず、汽船が入港している間、彼は以前と同じように毎日森に入った。'
      p3:
        was: '1858年6月26日、約18歳の若者ジュマートがドーリーで亡くなった。ウォレスは彼のことを、仕事をきちんとこなす物静かな青年だったと書いている。'
        now: '{staff} さんは熱が下がり、病気が治まるまでドリーさんと一緒に座っていました。7 月末にドリーさんと一緒に出発したとき、彼もボートに乗っていました。'
    vignettes:
      places: '{staff} は、その日の鳥のラベルをコピーし、それぞれの鳥の横に島を書き込みます。これにより、コレクターなしで皮の引き出しを読み取ることができます。'
      claim: '{staff} は、似ている 2 つの島のカブトムシをトレイに並べ、頼まれてもいないのに間隔をあけて 2 列に並べます。'
      mail: '{staff} は、船乗りが海図で行うように、長い手紙のページを油紙の中に折り込み、二重結び目で結びます。'
  hooke_london:
    name: '実験を取り仕切る人'
    place: 'ロンドン'
    figure: 'ロバート・フック'
    story: '読者がフックの古い Micrographia を持ち出し、コルクをコピーしようとします。図面のエッジはすぐに、フックが見たことのないきちんとした蜂の巣に変わります。同じ部屋では、さまざまな講義とデモンストレーションが行われます。 1年後に開いた人は、欠けているページと空白のページを区別する必要があるでしょう。'
    story_prose:
      opening:
        - 'ロンドン、1703 年。フックのミクログラフィアのコルクのセルは蜂の巣のように見えますが、その端は不均一です。彫刻をなぞる読者は、その隙間を埋めたいと願い続けます。'
        - '歴史上、ウォーラーは講義の一部を出版したが、他の論文は後の編集者を待った。この支店では、湿った部屋で誰かが皿をなぞっている間に、別の誰かが束を移動しに来ます。'
        - 'この旅行には、講義をまとめて他のバンドルのカタログを作成できる人が必要です。図を読んで、読者が改行を認識できるようにすることができる人の仕事もあります。'
      points:
        p1: '用紙を移動する必要がある場合、{staff} は講義を順番に確認し、カールした用紙を束に戻します。バンドルは移動しましたが、古いカバーがまだ上にあります。コードを締めると、{staff} は突き出た角を避けます。'
        p2: '{staff} は残りのバンドルのタイトルをリストし、それらを書類と再度照合します。カタログは、チェストを開けるとすぐに見える場所に配置されます。最後のラインはまだ濡れているため、{staff} では蓋が指の幅ほど半開きになります。'
        p3: '{staff} は彫刻の横にトレースを置き、どこで線を区切るかをフックに尋ねます。フックの指は二人の人物の間で止まります。 2 つの線が交わらない場所でも、マークのない紙が表示されます。'
      outcomes:
        all: '2年後、講義は印刷され、残された論文にも調べられるタイトルが付けられていました。後で誰かが宝箱を開けて、最初に薄いリストを持ち上げました。'
        p2: '次に未公開レコードを探している人は、バンドルに名前を付けることができます。蓋を上げるとカタログが上にありました。'
        p3: '読者がトレースに戻りました。指が 1 つのセルを一周し、隙間で止まりました。'
        p1: 'ウォーラーは最終的に講義を受けました。カバーシートの下には、古い順序で置かれていました。'
      none: '蓋が落ち、紙と木が擦れる音だけが響いた。未完成のトレースがまだ窓のそばにありました。'
      not_admitted: '{staff} は講義のある部屋に入りませんでした。ドアからのわずかな光が胸の隅を示しました。'
      desync: '移動すると講義がバラバラになってしまいました。 {staff} がリコールされたとき、コードはまだテーブルの上に平らに置かれていました。'
      excerpts:
        p2: 'カタログは、チェストを開けるとすぐに見える場所に配置されます。最後のラインはまだ濡れているため、{staff} では蓋が指の幅ほど半開きになります。'
        p3: 'フックの指は二人の人物の間で止まります。 2 つの線が交わらない場所でも、マークのない紙が表示されます。'
        p1: 'バンドルは移動しましたが、古いカバーがまだ上にあります。コードを締めると、{staff} は突き出た角を避けます。'
    relic: 'ノミの絵'
    relic_desc: '『ミクログラフィア』に載る、ノミを描いた折り込みの版画の写し。'
    points:
      p1: 'バンドルを移動してもレクチャーをまとめて保管できるため、ウォーラーは自分の版のためにレクチャーを収集できます。'
      p2: '後の編集者が見つけられるように十分な詳細を記載して、講義の外にバンドルのリストをファイルします。'
      p3: 'フックがまだ見ている間に読者のトレースを見せ、どの行を空けておくべきかを尋ねます'
    points_fail:
      p1: '講義の束はバラ紙と一緒に持ち去られます。ウォーラー氏はコレクションをまとめることができなくなり、事務所はその従業員を召還した。'
      p2: '次の編集者は、何が印刷されたのかを知ることができます。そのリストには他の論文を指しているものは何もありません。'
      p3: 'その軌跡は本に残ります。読者はすでに行を埋めているので、その行がどこに属するのかを尋ねることはできません。'
    shift:
      p1:
        was: 'フックは 1703 年に亡くなりました。リチャード ウォーラーは 1705 年に出版された遺作集を作成しました。'
      p2:
        was: 'ウォーラーの本には論文の一部が保存されていた。フックの日記やその他の著作の一部は、後に他の編集者を通じて出版されました。'
        now: '2 番目のリストはチェストに入ります。印刷されなかったデモを探している人は、名前の付いたバンドルを要求することから始めることができます。'
      p3:
        was: '『Micrographia』の中で、フックはコルクの孔を蜂の巣に例え、その形状が不規則であることを指摘しました。'
        now: '{staff} は、古いプレートの横にトレースを設定します。フックがコピーされたパターンがプレートと一致しなくなった場所を指した後、リーダーは 2 行を空けたままにします。'
    vignettes:
      edge: 'リーダーは細孔の周りの 2 本の線をたどり、プレートにない 3 番目の線とそれらを結合します。 {staff} はウィンドウへのトレースを保持します。発明された線は、シート上で最も真っ直ぐな線です。'
      analogy: '{staff} は、読者に、ページの上部に描いた櫛に合わないセルを見つけるように求めます。すぐに、両方とも同じ曲がったエッジを指すようになります。'
      plate: '読者が別の折り目を開くと、ノミが机のほぼ全体を占領します。 {staff} は、リーダーがインクを邪魔しないように移動する間、1 つの角を押さえます。'
  leavitt_cambridge_ma:
    name: '星を測る一つの法則'
    place: 'マサチューセッツ州ケンブリッジ'
    figure: 'ヘンリエッタ・リービット'
    story: 'ハーバード大学の 1912 年の回覧には、小マゼラン雲の 25 個の変光星が周期順にリストされています。 Leavitt は、最も明るい測定値と最も暗い測定値を別々にプロットしました。どちらのプロットでも、周期を繰り返すのに時間がかかった星ほど明るくなりました。'
    story_prose:
      opening:
        - 'マサチューセッツ州ケンブリッジ、1912 年。リービットは、小マゼラン雲の 25 個の変光星を周期ごとに並べ、最も明るいときと最も暗いときの測定値をプロットしました。どちらのグラフでも、周期が長いほど星は明るくなります。'
        - '歴史上、このテーブルはハーバード天文台の回覧に登場しました。その後の研究者は、最初の校正に天の川にあるセファイドを使用しました。この部門では、誰かがプレートをチェックし続け、観測時間のリクエストとともに候補星のリストを送信することができます。'
        - 'この旅行には、ガラスにかすかな星を照合できる人、そして次の観測に向けて根拠を示すことができる人が必要です。'
      points:
        p1: '印刷前に、{staff} はガラス プレートに対してかすかな観察結果をチェックします。欠けていた星が現れると、リービットはそれをテーブル内の所定の位置に戻します。ルーラーが最後の行から移動します。ガラス越しでも、小さな点はまだそこにあります。'
        p2: '{staff} は、時刻観測用アプリケーションに残っている校正問題を説明し、候補星のリストを添付します。測定結果が到着すると、Leavitt 氏は 2 枚のシートを合わせます。彼女の鉛筆は縫い目を横切り、同じ星で止まります。'
      outcomes:
        all: 'この表は印刷物として出版され、最終的にはさらに多くの観察結果が机上に届きました。リービットは封筒を開け、新しい測定値を古い区画の横に置きました。'
        p2: 'レビットさんはその後、協力者らとともに測定値を確認した。 2 組の測定値は、同じ星の下に鉛筆でマークされて並んでいます。'
        p1: '印刷された回覧板がテーブルの上に開いて置かれていました。両方のプロットの点は依然として同じ傾斜線をたどっていました。'
      none: 'プレートは箱に戻りました。一番上の選手は端まで滑り、明るいところにコーナーを残した。'
      not_admitted: '{staff} はプレートがチェックされた部屋に入りませんでした。箱がドアの内側を通過すると、隅のガラスが光りました。'
      desync: 'テーブルが入ったとき、ギャップはまだ存在していました。{staff} がリコールされたとき、ルーラーはまだ一致しない行を押さえていました。'
      excerpts:
        p2: '測定結果が到着すると、Leavitt 氏は 2 枚のシートを合わせます。彼女の鉛筆は縫い目を横切り、同じ星で止まります。'
        p1: 'ルーラーが最後の行から移動します。ガラス越しでも、小さな点はまだそこにあります。'
    relic: 'ガラス乾板'
    relic_desc: '小さな星がぎっしり詰まった写真プレート。'
    points:
      p1: '印刷する前に暗い星の測定値を版に合わせて、リービットの 25 周期の表を保護します。'
      p2: '回覧板の未解決のキャリブレーションを使用して、リービットが次のステップに参加するための観察時間を獲得します。'
    points_fail:
      p1: 'プレート参照が確認できない行はカットされ、25 期の表は表示されません。同期が途絶えたため、オフィスはその従業員を呼び戻した。'
      p2: '周期と明るさの関係は存続し、その絶対的な校正は他の場所で取り上げられます。'
    shift:
      p1:
        was: '1912 年 3 月 3 日、ハーバード天文台回覧 173 号は、小マゼラン雲の 25 個の変数に対するリービットの周期を発表しました。'
      p2:
        was: '1913 年の最初の校正では、天の川銀河のセファイドが使用されました。'
        now: '{staff} は、候補者リストを添付して観測時間のリクエストを送信します。リービットは、チームが到着したときに新しい測定値を確認する時間を確保します。'
        who: 'leavitt_cambridge_ma'
        bio: 'リービットは星の明るさの研究を続け、距離との関係を適用することに参加しました。彼女は校正に関する自身の観察メモを残しました。'
    vignettes:
      rank: '空白のスター番号はシーケンスを中断します。 {staff} は、写本師がプレートログを検索している間、その時代を読み上げます。数字が見つかるまで、ドットはその場に留まります。'
      distance: '{staff} は 2 つのプロットを並べて保持します。写字生が 1 枚のシートの縮尺を変更しました。ドットを比較する前に軸を再コピーします。'
      period: '写字生は明るさを叫び、次の行に手を伸ばします。 {staff} は、ピリオドもコピーされるまで、古い行の下にルーラーを置きます。'
    remarks:
      trait_methodical: '{staff} はプレートをスリーブに戻す前に番号をもう一度確認します。'
  su_shi_huangzhou:
    name: '東坡での流謫'
    place: '黄州'
    figure: '蘇軾'
    story: '1079 年のカラステラス詩裁判の後、蘇軾は黄州に追放され、そこで東の斜面に土地を耕し、その名を東坡としました。 1082 年の第 7 月、彼は客たちとともに赤壁の下の川に出て、「赤壁の前頌歌」を書きました。 10 か月目、彼は雪の館から臨澳に向かって歩いて戻り、後期頌歌を書きました。 1084年に黄州を出た。'
    story_prose:
      opening:
        - '元豊治世の黄州。クロウテラス事件の後に追放された蘇軾は、町の東で起工し、東坡（東坡）と名付けました。元豊5年に赤壁について二度書いた。秋の記述の中で、彼は断崖絶壁に登る様子を描写した。'
        - '歴史上、彼の家族はその貯蓄で暮らしていました。ユエとイーの周囲で幼児が溺れたという話を聞いた彼は、それをやめるよう手紙を書き、貧しい家庭の子育てを支援することを主張した。この支部では、坂道、フェリー、そしてそれらの家族の玄関先で作業が行われています。'
        - 'この旅には土地に詳しい人、そして夜の険しい道を歩ける人が必要です。また、新生児の世話をしたり、戸別訪問で根気よく話しかけたりできる人も必要です。'
      points:
        p1: '{staff} は労働者と一緒に斜面を登り、農業に関する知識を活かしてベッドの間に水を送ります。収穫時には、余分な袋が必要になります。最後の袋は壁にもたれかかり、古い埃の中に一筋の線を払います。その上には、まだ一連のコインが梁からぶら下がっています。'
        p2: '10 月の満月の夜、{staff} は険しい場所でしっかりとした足場を確保し、ボートに戻る途中に留まります。フィギュアが降りてくると、{staff} はランプを水の方向に向けます。波が板を打ち、炎が震える。'
        p3: '{staff} はグループと一緒に家から家を訪問し、新生児の世話をし、世話をする人たちと話をします。ある家庭では夜になると玄関を閉めます。光の帯の中で、小さな布の束が揺れる。'
      outcomes:
        all: 'その年、東斜面には穀物が実り、濡れた衣服が赤壁から戻ってきて、いくつかの家族が子供たちを保護しました。夜、室内で誰かが小さな布団を広げました。'
        p3: 'その冬、いくつかの家族が自宅で赤ちゃんを育てることができた。訪問者が外に出ると、誰かがランプを中に近づける音が聞こえた。'
        p1: '収穫後、一連のコインは数か月長く続きました。新しい袋は壁にもたれかかり、布の隅には土がまだ残っていた。'
        p2: '2 回目の訪問の後、ブラフは狂詩曲への道を見つけました。開いたページでは、筆が止まった部分のインクが最も濃くなります。'
      none: 'フェリーは静かになり、コイル状のロープは船首についたままだった。誰かの足元でランプが最後の光を与えた。'
      not_admitted: '{staff} は黄州に場所が見つかりませんでした。フェリーに巻かれたロープは霧の中で薄暗くなった。'
      desync: '赤壁の下の区間で問題が発生しました。リコールの直前に、{staff} が手に持っていたランプは、砲壁の下の水だけを照らしました。'
      excerpts:
        p3: 'ある家庭では夜になると玄関を閉めます。光の帯の中で、小さな布の束が揺れる。'
        p1: '最後の袋は壁にもたれかかり、古い埃の中に一筋の線を払います。その上には、まだ一連のコインが梁からぶら下がっています。'
        p2: 'フィギュアが降りてくると、{staff} はランプを水の方向に向けます。波が板を打ち、炎が震える。'
    relic: 'わらのマント'
    relic_desc: '農夫が斜面で着ていたような、粗末な雨用マント。'
    points:
      p1: '東斜面の荒地から収穫物をもたらす家族を手伝い、貯金が尽きた日々を乗り切る'
      p2: '十月の満月の夜、彼を川の上の崖の上で安全に保ち、彼が船に戻ってくるようにします。'
      p3: 'たらいに溺れそうになった村の生まれたばかりの子供たちを救ってください'
    points_fail:
      p1: 'この枝では、秋の収穫時に東の斜面に余分な手がなくなり、梁の上のコインの列が一枚ずつ減っていきました。'
      p2: 'その夜、彼は崖で足を踏み外し、この枝ではボートに戻ることはできません。'
      p3: 'この支流では、村の盆地はそのまま残り、{staff} はその子供を守るために一家族も移動しませんでした。'
    shift:
      p1:
        was: '1081 年、蘇軾は町の東の斜面に起工し、家計に 1 日あたり 150 枚の現金を与えました。'
        now: 'その秋、東側の斜面ではさらにいくつかの穀物が実り、年末になってもコインの列が梁の上に残されていました。'
      p2:
        was: '1082 年 10 月の満月、蘇軾は赤壁の壊れた堤防を一人で登って船に戻り、後に『赤壁頌歌第二』を書きました。'
      p3:
        was: '彼は越と江の周囲で幼児が溺死したことを聞き、鄂州の知事に書簡を送り、それを法律で禁止するよう要請し、黄州では子育てのための社会を提案し、裕福な人々に貧しい家庭が新生児を守るための資金を求めた。'
        now: '{staff} は社会の戸別訪問を行い、その冬、さらにいくつかの家族が生まれたばかりの子供たちを保護しました。'
    vignettes:
      slope: '{staff} は、雇われた人たちのために水を坂の上に運びます。夕暮れ時、ゲームに参加した近所の人が、茹でた豆の入ったボウルを畑の端に置き、新人は明日二杯目を食べてもいいと言う。'
      lamp: '{staff} は、風を遮るランプを備えた道路脇の石の上に座っています。 3回目の監視を終えたずっと後、坂道から足音が聞こえてくる。 {staff} はランプを道の方に向けますが、何も言いません。'
      ferry: '{staff} は、ゲームに備えた船頭が船着場でロープを巻くのを手助けします。静かな夜には崖の下の水の流れが遅く、客はいつも向こう側を求めると言います。'
  tang_xianzu_linchuan:
    name: '死を越える愛の芝居'
    place: '臨川'
    figure: '湯顕祖'
    story: '唐仙祖は、『牡丹閣』の序文を 1598 年秋と記しています。第 10 場では、杜臨良が春に庭園を訪れ、眠りに落ち、夢の中で若い男と出会います。'
    story_prose:
      opening:
        - '林川、1598 年秋。唐仙祖は序文の日付を「牡丹館」に定めています。劇中、ドゥ・リニアンは庭を歩き、若い学者の夢を見ながら眠りに落ちます。'
        - '歴史上、歌詞は歌いやすいように後に変更されました。タン氏はイーファンの選手たちに自分のテキストを使用するよう手紙を書いた。このブランチでは、リハーサルで変更されたシートと、俳優が見逃し続けている合図があります。'
        - 'この旅行には、欠けている単語を見つけて、合図が途切れたときにそれを聞き取ることができる人が必要です。また、ページ上のテキストとステージ上の声がどのように一致するかを知っている人も必要です。'
      points:
        p1: '{staff} はリハーサル シートと Tang がチェックしたテキストを比較し、欠落している単語を歌に従って追跡し、Yihuang 劇団用に完全版をコピーします。前にいる人が同じページのコピーを開き、耳でその行をたどります。合図とともに、舞台袖で待機していた俳優が片足を上げます。'
      outcomes:
        all: '彼らはチェックされたテキストに基づいてシーンのリハーサルを続けました。舞台袖で待っていた俳優は、折り畳まれた角がキューの横に落ちたシートを持っていました。'
        p1: '彼らはチェックされたテキストに基づいてシーンのリハーサルを続けました。舞台袖で待っていた俳優は、折り畳まれた角がキューの横に落ちたシートを持っていました。'
      none: 'リハーサルのページが切り替わります。ステージの横では、次の声が入る予定のいくつかの単語が欠けているシートを誰かがまだ持っています。'
      not_admitted: '{staff}はリハーサルに参加しませんでした。壁の中から声が聞こえ、外に現れたのは動かされた椅子だけだった。'
      excerpts:
        p1: '前にいる人が同じページのコピーを開き、耳でその行をたどります。合図とともに、舞台袖で待機していた俳優が片足を上げます。'
    relic: '刷り物の曲本'
    relic_desc: '歌い手用に刷った曲本。それぞれの歌の上に節の名がある。'
    points:
      p1: '『牡丹閣』の清書を彼自身の言葉で修正し、イーファン社の手に渡し、彼の文章からリハーサルをしてもらえるように手伝ってください。'
    points_fail:
      p1: '歴史のように、改変されたバージョンは後に広まったので、彼にできることは、イーファンのプレイヤーにそれらを歌わないように手紙を書くことだけです。この支店は歴史通りです。'
    shift:
      p1:
        was: '1598 年以降、唐仙祖はイーファンの奏者たちに、歌うために改変されたバージョンを使用する代わりに、オリジナルの言葉を忠実に使用するよう求める手紙を書きました。'
        now: 'イーファン社は、改変バージョンが登場する前に自分で修正したコピーを持っており、そこから歌い続けた。'
        who: 'tang_xianzu_linchuan'
        bio: 'このタイムラインでは、唐仙祖が自ら添削した『牡丹閣』の文章が最初に宜黄社に届き、そこから歌い続けた。'
    vignettes:
      empty_garden: '{staff} は椅子を壁に背を向けて設置します。奏者は何もない床を横切り、下を見つめながら歌います。コピー担当者はベンチから、パスがどこで終わるのかを知ることができます。'
      cue: '歌手はラインが短くなったところで止まります。彼女のパートナーは入り口を見逃しています。 {staff} は、省略された単語をリハーサル票に戻し、引き継ぎを再試行するように依頼します。'
      breath: '歌手は詩の終わりに少し空気を残します。 {staff} は、ウィングで待機しているプレーヤーのために別のスリップで一時停止するマークです。'
  xu_xiake_lijiang:
    name: '登る時間のなかった道'
    place: '麗江'
    figure: '徐霞客'
    story: '1639年の旧暦二月、徐霞客は麗江の解脱林に滞在し、木増のために書物を校訂した。木増は酒食を届けさせ、校訂がすむと礼の品も贈った。寺の上手に拱寿台と獅子崖があると聞いたが、書物の仕事に追われてどちらにも登れなかったと徐霞客は日記に記している。'
    story_prose:
      opening:
        - '麗江、1639 年の陰暦 2 月。徐霞客は解放林で穆曾の帳簿をチェックしている。彼はその裏の高台に拱寿台と獅子崖があると聞き、日記に彼らの名前を書きます。'
        - '歴史上、彼は本のせいで忙しくてどちらの場所も訪れることができませんでした。穆増は後に感謝の気持ちを込めて贈り物を送り、再び吉祖山の記録を改訂するよう頼んだ。この支店には、帰りのリストと散歩の紙が一緒に置かれています。'
        - 'この旅行には、量を確認し、安全に配達されるのを確認できる人が必要です。また、ガイドやエスコートのペースを維持し、道がどこで折り返されるかを覚えている人も必要です。'
      points:
        p1: '{staff} は返却リストと照合してボリュームをチェックし、メッセンジャーにどのボリュームが既に引き渡されているかを尋ねます。メッセンジャーは領収書をその上に置きます。下のページは箱の中にきちんと収まっていますが、1 つの狭いタブがまだ外側に見えています。'
        p2: '本が引き渡されると、{staff} さんは地元のガイドに道案内を頼み、Xu さんとその付き添いで拱寿台に登ります。向かいの山が少しずつ見えてきます。 Xu はすべてを確認すると、ページの端に印を付けます。'
        p3: '{staff} は、Xu と一緒にライオン クリフの下の分岐点を両方向から歩き、道が戻る場所を彼に示します。このスケッチは後に、解放林の敷居の内側に設置されます。最後のセクションまで折り畳んでも、折り目はまだページ全体に残っています。'
      outcomes:
        all: '本が戻った後、散歩も日記に取り入れられました。ジェトゥリンに残されたスケッチを開くと、2つの別々の折り目の横に2つのパスが曲がりました。'
        p3: '解放林にはスケッチが残されていた。誰かがライオンクリフの下の曲がり部分を指さして、それをもう一度折りました。'
        p2: '麗江の記述は今や徐氏自身の地位を占めた。彼はページに戻り、山が最初に見えた線に指を置きました。'
        p1: 'その後、木増 さんは感謝の意を表し、改めて要望を出しました。返事をしまったときも、巻上のタブはまだ一列に並んでいた。'
      none: '箱が閉まりました。予備のシートが敷居の横で丸まって、その緩んだ端が地面をかすめていました。'
      not_admitted: '{staff} は本をチェックしている人がいる場所が見つかりませんでした。ドアの中で誰かが箱を動かし、蓋がノックされました。'
      desync: '納品前にボリュームがチェックされていませんでした。 {staff} がリコールされたとき、胸元のリストにはまだ半分しかマークがありませんでした。'
      excerpts:
        p3: 'このスケッチは後に、解放林の敷居の内側に設置されます。最後のセクションまで折り畳んでも、折り目はまだページ全体に残っています。'
        p2: '向かいの山が少しずつ見えてきます。 Xu はすべてを確認すると、ページの端に印を付けます。'
        p1: 'メッセンジャーは領収書をその上に置きます。下のページは箱の中にきちんと収まっていますが、1 つの狭いタブがまだ外側に見えています。'
    relic: '解脱林周辺の歩行図'
    relic_desc: '折りたたんだ道の見取り図。斜面に道筋が引かれ、分かれ道のそばに余白がある。'
    points:
      p1: '校訂した巻冊が返却されたことを使いの者と確認し、木増が礼を述べて『鶏山志』の編纂を改めて頼めるようにする'
      p2: '半日自由時間を確保し、地元ガイドとエスコートを見つけて、徐と一緒に林傑陀から拱寿台まで歩きます。'
      p3: 'Xu と一緒にライオン クリフの下の分岐点を歩き、新しいルートのメモのコピーを修道院に残します'
    points_fail:
      p1: '返却されたボリュームにはレシートがありません。メッセンジャーは以前の作業が完了したことを確認できず、引き継ぎが行われず、オフィスはその従業員を呼び戻します。'
      p2: 'その日のコピー作業は午後いっぱいになります。拱寿台は徐が聞いた場所として日記に残っている。'
      p3: '徐さんは、聞いた道順に沿って降りる道もなく、麗江を出た。'
    shift:
      p1:
        was: '1639 年の陰暦 2 月 9 日、穆増は照合のお礼に贈り物を送り、再び徐に冀山の地名辞典の編纂を依頼した。'
      p2:
        was: '1639 年の陰暦 2 月 6 日、徐は、照合するのに忙しすぎて拱寿台や獅子崖に登ることができなかったと書いています。'
        now: '照合が完了すると、{staff} は Xu をガイドとエスコートに会うため、解脱林 に連れ戻します。徐さんはテラスに登り、反対側の斜面が見える場所をメモします。'
      p3:
        was: '1639 年の麗江の日記には、徐が聞いた場所としてライオン崖が高所にあり、登る時間がなかったと記載されています。'
        now: '{staff} は Xu と一緒に分岐点を両方向に歩きます。 Xu は、道が折り返す曲がり角に印を付け、スケッチのコピーを林杰多に残しました。'
        who: 'xu_xiake_lijiang'
        bio: '徐氏の麗江日記には、照合から出発までの間に追加の直接の記述が記されている。彼のスケッチの 2 番目のコピーは、解脱林 に保管されています。'
    vignettes:
      view: 'ガイドには、山に面した曲がり角について説明されています。 {staff} は、その前に何ターンあるのかを尋ねます。景色とそこに行く道は別の線にあります。'
      trail: '護衛は階段まで急な道を進み、濡れた袖口で到着します。 {staff} は乾いた布をドアのそばに掛け、ほぼ完成したページをさらに奥に移動します。'
      slope: '修道院の階段で、{staff} が新鮮な葉を引き抜きます。 木増 への発送は箱に戻ります。空白の葉はルートです。'
    remarks:
      trait_methodical: '{staff} はスケッチに矢印を追加するので、次の旅行者がどちらが上り坂であるかを知ることができます。'
  savitribai_phule_pune:
    name: '鞄に入れた予備のサリー'
    place: 'プネー'
    figure: 'サーヴィトリーバーイー・プーレー'
    story: '1848 年、サビトリバイとジョティラオ プーレはプネで女子生徒を教え始めました。彼女の仕事の説明には、彼女が道路で遭遇した虐待や、学校で着替えるために持って行った予備のサリーが記述されています。その後の学校の記録には彼女が校長として記載されている。 1897年、彼女は病人の看護中にペストで亡くなった。'
    story_prose:
      opening:
        - 'プネ、1848 年。サビトリバイ プーレとジョティラオ プーレが女子学校を設立。サビトリバイさんの話によると、彼女が学校に着くときに着替えるためにカバンの中に入れていたサリーがある。'
        - '歴史上、彼女は教職に就く途中で虐待に遭い、女子を学校に通わせることに反対する家庭もあった。この支店では、誰かが彼女と一緒に通りを歩き、家族と一緒に座り、少女を家に呼んだ理由を聞くことができます。'
        - 'この旅行には、その道でしっかりと行動できる人、そして教育や家族との話し方を知っている人が必要です。人が集まると、誰かがそれを落ち着かせる必要があります。'
      points:
        p1: '誰かが通りに足を踏み入れます。 {staff} は出入り口に目を光らせ、サビトリバイと一緒にビデ・ワダまで歩き、そこでドアを押し開けます。最初の女の子はすでに机の上に石を置き始めています。窓が明るくなり、下の方にはまだ拭き跡が残っている。'
        p2: '{staff} さんは少女の家族と一緒に座り、話を聞き、授業中に書いたセリフを見せます。その後、少女は石版を元の場所に戻します。彼女の手はゆっくりと動きますが、最初の線は端まで届きます。'
        p3: '{staff} は角に立って道をふさぐ人々に話しかけ、投げが止まるまで待って彼女と一緒に通り過ぎます。学校ではサビトリバイはカバンを机の上に置きます。予備のサリーはまだ内側に折り畳まれており、以前と同様に角が押し込まれています。'
      outcomes:
        all: '帰国子女も生徒の中に混じって授業は続いた。サビトリバイさんは、何かを教えるためにカバンを開けました。その下には、布がまだきちんと折り畳まれた状態で置かれていました。'
        p3: 'その日から予備のサリーはカバンの底にしまったままになった。彼女が部屋に入ってきたとき、彼女は手が空いていて窓を開けることができました。'
        p2: '少女が教室に戻ると、石板に別の線が現れた。授業が終わると、彼女は石板を元の場所に横向きに戻しました。'
        p1: 'その日の朝、授業は進みました。ドアは開いたままで、最初の石板が机の脚にもたれかかっていました。'
      none: '部屋はあと 1 枚足りませんでしたが、チョークが机の上にありました。足音は角で響き、すぐに消えた。'
      not_admitted: '{staff} は学校に居場所が見つかりませんでした。ドアの半分が机を隠し、石板の隅だけが見えました。'
      desync: '学校へ行く道が角で途切れてしまった。 {staff} がリコールされたとき、窓の下の石板はまだ空白でした。'
      excerpts:
        p3: '学校ではサビトリバイはカバンを机の上に置きます。予備のサリーはまだ内側に折り畳まれており、以前と同様に角が押し込まれています。'
        p2: 'その後、少女は石版を元の場所に戻します。彼女の手はゆっくりと動きますが、最初の線は端まで届きます。'
        p1: '最初の女の子はすでに机の上に石を置き始めています。窓が明るくなり、下の方にはまだ拭き跡が残っている。'
    relic: '石板'
    relic_desc: '最初の行にチョークで文字が書かれた小さな石版。'
    points:
      p1: '最初の月の最も大変な朝、その日のレッスンが始まるように、Bide Wada への道を空けておいてください'
      p2: '家族から家に呼ばれた少女を連れ戻し、再び白紙の座に座らせる'
      p3: 'その道で彼女に物を投げる人々を止めて、彼女がカバンの中に予備のサリーを入れなくても済むようにする'
    points_fail:
      p1: 'その日、彼女は学校に着かず、和田ビデの家のドアは閉まったままだった。'
      p2: 'この支店では、Bide Wada の石板に女の子が 1 人少なかった。'
      p3: '歴史のように、彼女は今でも毎日バッグに予備のサリーを入れて持ち歩いていました。'
    shift:
      p1:
        was: '1848年1月からビデ・ワダの女子学校は授業を継続し、サビトリバイは毎日そこを歩いて教えた。'
      p2:
        was: '1848年、プネーの多くの家族は女子が学校に通うことに反対していた。'
        now: '女の子はレッスンに戻ってきました。'
      p3:
        was: '1848 年から、彼女は通学途中に石や糞尿を投げつけられ、到着時に着替えるための予備のサリーを持ち歩いていました。'
        now: 'ある春の朝から、道行く人は誰も彼女に何も投げなくなり、予備のサリーは折りたたまれたままバッグの中に入れられました。'
    vignettes:
      slate: '{staff} はスレートを横向きにして、2 人の女の子が一度に到達できるようにします。彼らが故郷と呼ばれるとき、それぞれが他の人が指し示すことができる痕跡を残しています。'
      road: '{staff} は Budhwar Peth への道を半歩後ろに歩き、バッグを出入り口から遠ざけた側に置きます。その朝、通りにいる人は誰も何も言いませんでした。'
      chalk: '{staff} は、最後のチョークの棒を 2 つに折って、1 つはボード用、もう 1 つは石版用にし、市場から必要なものを書き留めます。'
  hargrave_stanwell_park:
    name: '四つ目の凧'
    place: 'スタンウェルパーク、オーストラリア'
    figure: 'ローレンス・ハーグレイヴ'
    story: 'ローレンス・ハーグレイヴは、1893 年に箱凧の実験を始めました。1894 年 11 月 12 日、スタンウェル パークのビーチで、連結した 4 つの箱凧が彼を砂から持ち上げ、約 16 フィートの高さまで上げました。ニューサウスウェールズ州立図書館が所蔵する写真には、ハーグレイブ、ジェームズ・スウェイン、そして裁判の設備が写っている。彼は1915年7月6日にシドニーで死去した。'
    story_prose:
      opening:
        - 'スタンウェルパーク、1894年11月。ローレンス・ハーグレイヴは1年以上箱凧を試してきました。 12日、4機が砂浜に横たわり、一列に並んで飛行する準備が整った。'
        - '歴史上、4 つの凧が彼を約 16 フィート持ち上げました。その後彼がミュンヘンに送ったモデルのほとんどは戦時中に破壊されました。このブランチでは、ビーチのヘルパーがフレーム用のタグと、図面を広げるためのスペースを持っています。'
        - 'この旅には、風を読んで長いラインを安定させることができる人、そして寸法を確認して 4 つのフレームがどのように組み合わされるかを描くことができる人が必要です。'
      points:
        p1: '突風が外側の凧を脇に引っ張ります。 {staff} はラインを監視し、凧が再び引っ張られるまでヘルパーと一緒に移動し、シートが下がるときにロープを安定させるのを手伝います。足が砂に触れると、2 つの足跡が近くに残ります。ビーチにいる人々は、最初の凧が沈むまで持ち続けます。'
        p2: '{staff} は、フレームに対する測定値とタグをチェックし、4 つすべてがどのように作成され結合されているかを示すコピーを作成してローカルに保管します。風が図面を最後のシートまで回転させます。ハーグレイブはコードを横に置き、結び目で角を押さえます。'
      outcomes:
        all: 'その高さは記録に残り、一連の図面がオーストラリアに残されました。数年後、誰かがその山積みを開いたところ、依然として 4 つの凧の間の線を追跡することができました。'
        p2: '数年後、スタンウェル パークにはまだ参照できるコピーが残っていました。最後のシートには、まだ線が結ばれている場所が示されていました。'
        p1: '高さは記録に残りました。入り口の横にある写真には、海岸に並んでいる4つの凧がまだ写っていた。'
      none: '海からの風がずっと吹き続けていました。砂丘のコイルから次々とループが外れました。'
      not_admitted: '{staff} はビーチでヘルパーのいる場所を見つけられませんでした。誰かが遠くで綱をピンと張ったが、その声は砂丘まで伝わらなかった。'
      desync: 'シートが下がり、ロープが緩んでしまいました。 {staff} がリコールされたときも、タグがフレームに対してガタガタしていました。'
      excerpts:
        p2: '風が図面を最後のシートまで回転させます。ハーグレイブはコードを横に置き、結び目で角を押さえます。'
        p1: '足が砂に触れると、2 つの足跡が近くに残ります。ビーチにいる人々は、最初の凧が沈むまで持ち続けます。'
    relic: '箱凧の予備の札'
    relic_desc: '箱凧の骨組みに付ける予備の札。'
    points:
      p1: '11 月 12 日、突風が吹く中でも凧の列をしっかりと保ち、安全に砂の上に上がり、降りることができるようにします。'
      p2: '4 つの凧、そのサイズ、作り方の完全な図面を完成させ、1 部のコピーをオーストラリアに残すのを手伝ってください。'
    points_fail:
      p1: '突風が凧の列を脇に引きずり、凧の台座が砂に打ち付けたので、この支流では 16 フィートの揚力はありませんでした。'
      p2: '歴史が示すように、4 つの凧は彼自身の手だけに留まり、この支部ではスタンウェル パークでの 2 番目の記録はありませんでした。'
    shift:
      p1:
        was: '1894 年 11 月 12 日、スタンウェル パークのビーチで、列車に積まれた 4 つの箱凧がハーグレイブを砂から約 16 フィートまで持ち上げました。'
      p2:
        was: '1894 年、4 つの凧の製作はハーグレイブの手中にありました。晩年、彼は模型をミュンヘンに送りましたが、そのほとんどが第二次世界大戦で破壊されました。'
        now: '4 つの凧の図面セットはスタンウェル パークに残り、他のモデルと一緒にミュンヘンには行かれませんでした。'
        who: 'hargrave_stanwell_park'
        bio: '1894 年のハーグレイブの 4 つの箱凧のサイズと図面は、スタンウェル パークにコピーとして保管されていました。彼のモデルのほとんどは後に第二次世界大戦で破壊されましたが、これら 4 つがどのように作られたのかはオーストラリアで今でも知ることができます。'
    vignettes:
      four: '{staff} は、リフト後に砂の上に並べられた凧をもう一度数え、括弧で囲んで 4 つすべてをページに書き込みます。これにより、次の読者はそれらが一緒に飛んだことがわかります。'
      tag: '{staff} は濡れた砂をたどり、フレームから剥がれたタグを見つけ、新しい結び目で再び結びます。'
      lift: '{staff} は、1 つの凧で風を試している間、砂丘の上でヘルパーと一緒に立ち、ラインを使ってどの方向に走ればよいかを学びます。'
