  fibonacci_pisa:
    name: '1202年の初稿'
    place: 'ピサ'
    figure: 'フィボナッチ'
    story: 'ピサのレオナルドは、父親がピサの商人として働いていた北アフリカの海岸にあるブジアで少年時代に、インドの 9 人の数字を計算することを学びました。 1202 年にピサに戻った彼は、数え方や貿易のための新しい数字とゼロを教えるリベルそろばんを完成させました。 1228 年に彼はこの本を改訂し、現存するコピーはその第 2 版からのものです。'
    story_prose:
      opening:
        - 'ピサ、1202 年。少年の頃、レオナルドは北アフリカの海岸にあるブジアに行き、そこで父親がピサの商人として働いていました。そこで彼はインドの 9 人の数字を計算することを学びました。ピサに戻った彼は、人々にこれらの数字とゼロを使って数字を書き、それを売り買いに使うことを教える「Liber Abaci」を書きました。'
        - '歴史上、彼は 1228 年にこの本を改訂し、新しい資料を追加し、余分と考えた部分をカットしました。後の読者に渡されたすべてのコピーはそのバージョンに遡り、1202 の最初のバージョンの完全なコピーは知られていません。この支店では、岸壁にある数え所の見習いは、なぜ小さな円が柱を占める必要があるのか理解できず、アルノ川の船頭は、上陸する俵ごとに番号を呼びます。'
        - 'この旅では、さまざまな人が助けてくれます。本やコピーのセットがどのように保存されているかを知っている人、教えて著者について話すことができる人、初期のテキストと後のテキストがどのように異なるかを明確に言える勉強家などです。'
      outcomes:
        all: '20年以上後、その改訂版がピサの書店でコピーされ始めました。木箱はまだそこにあり、初期のテキストと新しいテキストが並べて開かれ、読者は後で追加された例をページごとに比較していました。'
        p1: '20年以上後、その改訂版がピサの書店でコピーされ始めました。木箱はまだそこにあり、初期のテキストと新しいテキストが並べて開かれ、読者は後で追加された例をページごとに比較していました。'
      none: '1228 年以降、ピサの書店は改訂版のみをコピーしました。数え所では、見習いはそれから学び、空の欄に一画ずつゼロを書きました。'
      not_admitted: '{staff} はレオナルドのドアを通過できませんでした。アルノ川のほとりでは、船頭がまだ俵を降ろしており、岸辺では誰かが板に一筆ずつ絵を描いていました。'
      points:
        p1:
          class_lettered: '{staff} は書籍管理者の規則に従い、初版の各巻をテーブルの上に並べて 1 冊ずつ番号を付け、後で改訂するのは良いことだが、このセットが保管されていなければ、彼が最初にどのようにしてこの本を書いたのか誰も知ることができないだろうとレオナルドに言いました。レオナルドは長い間本をめくり、ペンを取り、それぞれの巻の最後に自分の名前とその巻が完成した年を書きました。彼はインクが乾くのを待って、本を一冊ずつ木製の箱に置き、留め金を締めました。'
          else: '{staff} は、最初のバージョンから実際に動作した例をいくつかワックスタブレットにコピーし、彼が口述した新しい方法の横に置き、後世の人々が彼が最初にどのように合計を計算したかを見たい場合はどこを見ればよいかを彼に尋ねました。レオナルドは長い間本をめくり、ペンを取り、それぞれの巻の最後に自分の名前とその巻が完成した年を書きました。彼はインクが乾くのを待って、本を一冊ずつ木製の箱に置き、留め金を締めました。'
      excerpts:
        p1: 'レオナルドは長い間本をめくり、ペンを取り、それぞれの巻の最後に自分の名前とその巻が完成した年を書きました。彼はインクが乾くのを待って、本を一冊ずつ木製の箱に置き、留め金を締めました。'
    relic: '数字を刻んだ蝋板'
    relic_desc: '古いローマ数字の横に新しい10の数字が記された板。'
    points:
      p1: 'レオナルドを説得して、1202年の初版の完全なコピーに署名してピサに残し、後の改訂版がそれを置き換えないようにする'
    points_fail:
      p1: '著者が作品を改訂した後、借り手は新しいコピーしか知りませんので、最初の編集物を復元することはできません。'
    shift:
      p1:
        was: '1202年：ピサのレオナルドがリベルそろばんの初版を完成。その完全なコピーは現存していないことが知られており、残された写本には 1228 年の改訂が反映されています。'
        now: '初期のセットには日付と例が保持されています。後で読む人は、2 つの編集版を並べて、新しく追加された作品を確認できます。'
        who: 'fibonacci_pisa'
        bio: 'ピサのレオナルドの本の 1202 年の初版は、1228 年の改訂の横に完全なコピーとして残されていたため、後の読者は彼がその年の間に何が変わったのかを見ることができました。'
    vignettes:
      rabbits: '{staff} のコピーでは、毎月新しいつがいを産むウサギのつがいの問題に遭遇します。 {staff} は 12 か月目までの余白を数えずにはいられません。その数字は、後の世紀の教科書とまったく同じになります。'
      zero: '岸壁にある数え所で、{staff} が見習いに空の場所をゼロと書く方法を示しています。少年は、この小さな指輪は何の役にも立たず、それ自体の柱を作る権利もないと言いました。 {staff} が 2 つの台帳を相互にチェックするように指示すると、少年は黙ってしまいました。'
      quay: '{staff} は、アルノ川のボートから俵を降ろすのを手伝い、上陸するたびに声をかけます。銀行では行員が電話を受けるたびに耳を傾け、ボードにマークを付けます。'
  dante_ravenna:
    name: '街の言葉で書いた長い詩'
    place: 'ラヴェンナ'
    figure: 'ダンテ・アリギエーリ'
    story: '1302 年にフィレンツェから追放されたダンテ アリギエーリは、1318 年頃にラヴェンナに定住し、そこで日常会話のトスカーナ語で書かれた喜劇の最後の部分であるパラディーゾを完成させました。 1319年頃、ボローニャの学者ジョヴァンニ・デル・ヴィルジーリオは、ラテン語で書いて栄冠を求めてボローニャに来るよう促すラテン語の詩を送り、ダンテはラテン語の詩で答えた。 1320年1月20日、彼はヴェローナで講義を行った。 1321年9月、ヴェネツィアへの大使館から戻った彼は病気になり、ラヴェンナで亡くなった。'
    story_prose:
      opening:
        - '1320年初頭、ラヴェンナ。ダンテはフィレンツェから18年間追放されており、1302年の判決では、戻ってきたら死刑になるとされている。ラヴェンナの領主、グイド・ノヴェッロ・ダ・ポレンタの招待で、彼はここに住み、日常のトスカーナの街路で神曲の最後の部分であるパラディーゾを執筆している。'
        - '歴史上、ボローニャで教えていたジョヴァンニ・デル・ヴィルジーリオは、ラテン語で書いて栄冠を得るためにボローニャに来るよう促すラテン語の詩を送り、ダンテはラテン語のエクローグで答えたという。 1321年9月、ヴェネツィアへの大使館から戻った彼は体調を崩し、フィレンツェには戻らずラヴェンナで亡くなった。この支店では、町の墨売りが写字生たちを上客と数え、材木採取者が海沿いの松林に出かけます。'
        - 'この旅では二種類の人が助けてくれるでしょう。書類に詳しくて、どの山に送ってどの山を保管するかを区別できる人、もう一人は詩や本の知識があり、彼の隣に座って真実の言葉をいくつか言うことができる人です。'
      outcomes:
        all: 'ラテン語の詩は翌年まで行き来し、それぞれがワックスで封印されました。 1321年9月、彼はヴェネツィアから帰国後体調を崩し、ベッドの傍らにあるパラディーゾの山に最後の紙が最後まで書き綴られた。'
        p2: '彼は1年以上ラヴェンナに住んでいました。 1321年9月、彼はヴェネツィアから帰国後体調を崩し、ベッドの傍らにあるパラディーゾの山に最後の紙が最後まで書き綴られた。'
        p1: 'ラテン語の詩は翌年まで行ったり来たりしました。それぞれの答えは独立して折り畳まれており、少量のワックスが滴っていました。'
      none: 'ボローニャからの手紙は今も机の上に置かれていた。ラヴェンナ郊外の松林では、海風が突風となって吹き抜けていました。'
      desync: 'ラテン語の答えは『パラディーゾ』のコピーと一緒に提出され、ばらまき用紙の中に追い出され、ボローニャが受け取ったのはトスカーナ紙の数ページだけだった。 {staff} は返答が来る前に事務局によってリコールされました。'
      not_admitted: '{staff} はコピー室のドアをくぐることができず、町の外の松林で木材を集めて数日を過ごしました。 2 つの紙の山はまだダンテの机の上にありました。'
      points:
        p1:
          class_lettered: '{staff} は書類管理者の規則に従い、コピー室で 2 つの山を分けました。トスカーナのパラディーゾは机の上に置かれ、ボローニャのラテン語の答えは脇に置かれて、単独で折りたたまれました。ダンテは折り目にワックスを垂らし、指の関節で平らに押しました。使者はそれをコートの中に押し込み、1月の冷たい風の吹く中、市門を出てボローニャへの道を進んだ。'
          else: '{staff} は、もともと用心深いので、コピー室を山から山へと調べ、パラディーゾの緩いシーツからボローニャのラテン語の答えを選び、それを自分で折りました。ダンテは折り目にワックスを垂らし、指の関節で平らに押しました。使者はそれをコートの中に押し込み、1月の冷たい風の吹く中、市門を出てボローニャへの道を進んだ。'
        p2: '3月のある午後、ダンテは書き終えたばかりのセリフ{staff}を読みました。 {staff} は彼らを一行ずつ彼のあとに言い返し、最後になって初めて、長い間保留されていたことを言いました。人々は何世紀にもわたってこれらの聖句を、まさにこの通りの言語で読み続けます、そしていつかフローレンスは彼を家に連れて帰りたいと思うでしょう。ダンテはインク壺の縁にペンを置き、シートを眺めた。しばらくしてから、彼は再びそれを浸し、書き続けました。'
      excerpts:
        p2: 'ダンテはインク壺の縁にペンを置き、シートを眺めた。しばらくしてから、彼は再びそれを浸し、書き続けました。'
        p1: 'ダンテは折り目にワックスを垂らし、指の関節で平らに押しました。使者はそれをコートの中に押し込み、1月の冷たい風の吹く中、市門を出てボローニャへの道を進んだ。'
    relic: '月桂樹の葉'
    relic_desc: '詩人の月桂冠から落ちた、乾いた葉。'
    points:
      p1: 'ダンテがラヴェンナからジョバンニにラテン語の返信を送る時間を取っておきます。コピー中の Paradiso ページから離して保管してください'
      p2: '亡命中のダンテに、この喜劇は何世代にもわたって読み継がれること、そしていつかフィレンツェがダンテの返還を望んでいることを知らせてください。'
    points_fail:
      p1: '受信者はゆるい物語のページを受け取ります。返答は草案の中に残っており、事務所はその従業員を召還した。'
      p2: '彼は家に帰りたいという希望に答えられず、ラヴェンナで執筆を続けている。この支部ではその後何が起こったのか誰も彼に語らない。'
    shift:
      p1:
        was: '1319年末か1320年初頭、ラヴェンナでパラディーゾを執筆中、ダンテはボローニャのジョヴァンニ・デル・ヴィルジーリオとラテン語の詩を交換した。'
      p2:
        was: '1321年9月、ダンテはフィレンツェに戻ることなくラヴェンナで亡くなった。 1519年頃、フィレンツェは彼の遺骨の提供を求め、ラヴェンナの修道士たちは彼の骨を壁に隠しました。'
        now: '{staff} は、ラヴェンナで彼に、このコメディには常に読者がいて、彼の街はいつか彼を故郷に連れて帰りたいと思っていることを伝えました。'
        who: 'dante_ravenna'
        bio: 'ラヴェンナでの晩年、追放されたダンテは、自分の詩が後世に残り、いつかフィレンツェが彼を誇りに思うようになるだろうと知るようになった。'
    vignettes:
      latin: '{staff} はコピー室で 2 つの紙の山を目にします。トスカーナのパラディーゾと、ボローニャ行きのラテン語の詩です。差出人は、ラテン語のみが栄冠に値すると述べています。 {staff} は、700 年後に誰もがどの山を読むことになるかを知っており、その言葉を飲み込みます。'
      pinewood: '{staff} は木材採集者を追ってラヴェンナ郊外の海沿いの松林に入り、砂地で休み、木々の向こうから波の音が聞こえます。'
      ink: '{staff} は、インク売りが瓶からボートから運ぶのを手伝います。インクはオークの胆汁と錆びた鉄から煮出して作られており、売り手によると、そのほとんどは町の写字生が購入しているという。'
  copernicus_frombork:
    name: '中心にある太陽'
    place: 'フロンボルク、ポーランド'
    figure: 'ニコラウス・コペルニクス'
    story: '1539年、若い数学者レティカスがフロンボルクを訪れ、ニコラウス・コペルニクスに著書を出版するよう勧めた。 1543 年、地球が太陽の周りを回って回るという『革命』がニュルンベルクで印刷され、その表紙には読者への無署名の宛名が書かれていました。コペルニクスは 1542 年末から病気で、1543 年 5 月 24 日にフロンボルクで亡くなった。彼の友人ティーデマン・ギーゼは後に、印刷された本が彼に届いたのは彼が亡くなったその日だったと書いている。'
    story_prose:
      opening:
        - 'ポーランド、フロムボルク、1543年春。ニコラウス・コペルニクスは昨年末から病気だった。彼が数十年にわたって取り組んできた本『革命について』は、ニュルンベルクで印刷されています。その中で地球は地軸を中心に回転し、太陽の周りを移動します。 4年前、若い数学者レティカスがヴィッテンベルクからここにやって来て、この本を印刷するよう勧めた。'
        - '歴史上、この本はニュルンベルクで印刷機から発売され、冒頭に読者への無署名の宛先が書かれていました。彼の友人ティーデマン・ギースは後に、印刷された本が彼に届いたのは彼が死んだその日だったと書いている。 5月24日、彼はフロムボルクで死去した。 7月、ギースはレティカスに修正版を求める手紙をニュルンベルク市議会に渡すよう依頼した。この支部では、丘のふもとの村の漁師が網を直し、家の使用人が毎日病室まで水を運びます。'
        - 'この旅行では、さまざまな人が助けてくれます。看護の知識があり、病床を維持できる人、または本を遠くまで運べるほど丈夫な人。論文に精通していて、コピーとサインを区別できる人。そして、正誤表を作成するのに十分な注意を払っている人。'
      outcomes:
        all: '5月初旬に届いた本は、その後も彼のベッドのそばに置かれた。その夏、近くで貸し出された本にはそれぞれ正誤表が入っており、サイン原稿は布に包まれて戸棚にしまってあったが、後にギーゼの手に渡った。'
        p3: 'その後、本はタイトルページを上にして彼のベッドのそばに置かれました。数週間後、彼はフロムボルクで亡くなった。'
        p2: 'その夏、近くで貸し出された冊子には正誤表が入っており、角がめくれて丸まっていた。他の場所のプリンタからの回答は、後に同じファイルに保存されました。'
        p1: '布に包まれた直筆原稿は後にギーゼの手に渡り、彼からレティカスへと渡されました。数世紀後、それはクラクフのヤギェウォ図書館にありました。'
      none: '5 月 24 日頃、印刷された書籍がフロムボルクに到着しました。病室の窓はひび割れたまま開いており、水を持った使用人はしばらく戸口に立ったまま、中には入らなかった。'
      desync: '書斎にあった書類はぐちゃぐちゃで、印刷所に送る予定だったコピーと一緒に山積みになった2つの作業用紙が入っており、サインがどこにあるのか誰も言えなかった。 {staff}はギースが来る前に事務所からリコールされました。'
      not_admitted: '{staff} さんは丘を登って家に入ることはなく、下の漁村で網を繕いながら数日を過ごしました。丘の上にある窓の一つは夜も明かりがついていた。'
      points:
        p1:
          class_lettered: '5月下旬、病室の隣の書斎に書類が無秩序に山積みになっていた。 {staff} はアーキビストのやり方で、サイン原稿と 2 枚の山になった作業書類をページごとに数え、それらを別々に台帳に記入し、サインを布に包み、食器棚に単独で鍵をかけました。領収書は「ティーデマン・ギーゼ宛」と書かれ、二つ折りにされ、机の隅にある戸棚の鍵で重しになっていた。隣の使用人は水を持ってそっと病室に入り、また出てきました。'
          else: '5月下旬、病室の隣の書斎に書類が無秩序に山積みになっていた。 {staff} は数晩続けて書斎に座って、サイン原稿と 2 枚の山になったワーキングペーパーをページごとに数え、それらを別々に書き留め、サインを布に包み、食器棚に単独で閉じ込めました。領収書は「ティーデマン・ギーゼ宛」と書かれ、二つ折りにされ、机の隅にある戸棚の鍵で重しになっていた。隣の使用人は水を持ってそっと病室に入り、また出てきました。'
        p2: '7月末、ギースはレティカスに手紙を書き、訂正版を求める手紙をニュルンベルク市議会に渡すよう求めたが、しばらく返答はなかった。 {staff} は、校正者が行うように、原稿と照らし合わせて本をページごとに調べ、著者自身の序文がどのページにあるのか、そして冒頭の読者へのアドレスが原稿にないことを示す正誤表を作成しました。シートは数回コピーされ、すでに近くで貸し出されたコピーの中に滑り込みました。カバーを開けた人が最初にそのシートに気づきました。'
        p3:
          class_medical: '5月初旬、コペルニクスはフロムボルクの病床に横たわり、ますます目を覚まさなくなった。 {staff} は看護の必要に応じてベッドサイドを保ち、時間通りに水を与え、向きを変え、部屋の火が消えないようにし、ニュルンベルクからの本を待ちました。本がベッドに届いたとき、彼は目覚めました。彼は毛布の上でそれを開き、最初のページのタイトルに沿ってゆっくりと指を動かし、自分の名前の上に長い間放置しました。'
          class_travel: '5月初旬、コペルニクスはフロムボルクの病床に横たわり、ますます目を覚まさなくなった。 {staff} は道を南下し、途中でニュルンベルクからの荷車に会い、印刷されたコピー 1 部をコートに包み、昼夜を分かたずにフロムボルクまで持ち帰った。本がベッドに届いたとき、彼は目覚めました。彼は毛布の上でそれを開き、最初のページのタイトルに沿ってゆっくりと指を動かし、自分の名前の上に長い間放置しました。'
          else: '5月初旬、コペルニクスはフロムボルクの病床に横たわり、ますます目を覚まさなくなった。 {staff} さんは何日も病室の外で待ち、本が到着すると、梱包も解かれる前に 1 冊取り出し、両手で 2 階へ運びました。本がベッドに届いたとき、彼は目覚めました。彼は毛布の上でそれを開き、最初のページのタイトルに沿ってゆっくりと指を動かし、自分の名前の上に長い間放置しました。'
      excerpts:
        p3: '本がベッドに届いたとき、彼は目覚めました。彼は毛布の上でそれを開き、最初のページのタイトルに沿ってゆっくりと指を動かし、自分の名前の上に長い間放置しました。'
        p1: '領収書は「ティーデマン・ギーゼ宛」と書かれ、二つ折りにされ、机の隅にある戸棚の鍵で重しになっていた。隣の使用人は水を持ってそっと病室に入り、また出てきました。'
        p2: 'シートは数回コピーされ、すでに近くで貸し出されたコピーの中に滑り込みました。カバーを開けた人が最初にそのシートに気づきました。'
    relic: '真鍮の四分儀'
    relic_desc: '星の高度を測る、円の四分の一の形をした器具。'
    points:
      p1: 'フロムボルクはまだ書類の目録を作成できるが、作業シートとは別にデ・レボリューニバスのサインを記載し、引き継ぎの領収書をギースに残しておこう。'
      p2: 'ギースが訂正版を求める手紙を書いている間、近くで貸し出された各コピーに正誤表を差し込み、著者自身の序文がどのページにあるのか、そして冒頭の読者へのアドレスが原稿にないことを明記する'
      p3: '彼がまだ意識がはっきりしているうちに、印刷された De Revolutionibus を持ってきて、その本が印刷されていることを彼に知らせます。'
    points_fail:
      p1: '机の上にある 2 つの束が、既に印刷業者に送信されたコピーと間違えられます。原本はギースに届かず、事務所はその従業員を呼び戻すことになる。'
      p2: 'ギースは遠くの印刷業者と評議会を待つことしかできず、近くの読者は依然として本を開いたときに最初に「読者へ」というアドレスに遭遇します。'
      p3: '印刷された本が彼の手に届いたのは、彼の死の日である 5 月 24 日でした。'
    shift:
      p1:
        was: '1543 年にニュルンベルク版がコピーから印刷されました。コペルニクスのサインは別に残され、後にティーデマン・ギーゼを経てレティカスに渡されました。'
      p2:
        was: '1543年7月、ギースはレティカスに改訂版を求める手紙をニュルンベルク市議会に送付するよう依頼した。無署名のテキストは 1543 年の初版ですでに流通していました。'
        now: '近くに送られるコピーには訂正票が付いています。次の読者はそれを使用してサインを確認でき、印刷者の最終的な応答は同じ記録にファイルされます。'
      p3:
        was: '1543年5月24日、コペルニクスはフロムボルクで死去した。ギースは後に、完成した本が彼に届いたのは彼の死の日だったと書いている。'
        now: '5月初旬、その印刷された本は彼の枕元にあり、彼はまだ意識がはっきりしている間それを手に持っていました。数週間後、彼はフロムボルクで亡くなった。'
        who: 'copernicus_frombork'
        bio: 'コペルニクスは亡くなる数週間前に印刷された『革命論』を受け取り、自分が数十年にわたって取り組んできた本が印刷されることを知っていました。'
    vignettes:
      preface: '{staff} は印刷されたコピーを開きます。表紙の署名のないアドレスには、この本の説明が計算に都合の良い仮定にすぎないことが書かれています。 {staff} は、ケプラーがこの本を書いた人を明らかにするまでに約 50 年かかることを知っており、そのページに指を置いたまま本を閉じます。'
      window: '{staff} は病室の外で水を温かく保ちます。中の人によると、この老人には今ではほとんど知り合いがいないということで、{staff} は窓を押して隙間をあけ、春の空気を入れます。'
      nets: '{staff} は、ヴィスワ湖を眺めながら丘のふもとで漁師たちが網を直すのを手伝います。漁師は、丘の上に夜に星を眺める年老いた大聖堂があると言いました。'
  smith_kirkcaldy:
    name: '人に託した一冊'
    place: 'カーコーディ、スコットランド'
    figure: 'アダム・スミス'
    story: '1776 年 3 月、アダム・スミスの『国富論』がロンドンで出版されました。 8月25日、彼の友人デヴィッド・ヒュームがエディンバラで死去した。ヒュームは最初にスミスを指名して、自然宗教に関する対話を出版させた。スミスは難航し、ヒュームは代わりに印刷業者ウィリアム・ストラハンに作品を任せ、2年以内に出版するよう求めた。その年の11月、カーコーディに戻ったスミスはストラハンにヒュームの最後の数カ月についての報告を書いた。結局ストラハンは辞退し、ヒュームの甥を通じて『対話篇』が 1779 年に出版された。'
    story_prose:
      opening:
        - '1776 年晩秋、スコットランド、カーコーディ。アダム スミスは生まれた町に戻ってきました。 3月に彼の『国富論』がロンドンで出版され、その第一章はピンの製作から始まった。 8月に彼の友人デヴィッド・ヒュームがエディンバラで亡くなった。'
        - '歴史上、ヒュームは1月の遺言で論文の世話をするようスミスに指名し、最初は自然宗教に関する対話を印刷することを彼に意図していた。スミスは乗り気ではなかった。 8月7日の法典は代わりに印刷業者ウィリアム・ストラハンに作品を託し、ヒュームの死から2年以内に出版するよう求めた。 11月、スミスはカーカルディからのヒュームの最期の数か月についてストラハンに書き、対話は1779年にヒュームの甥が名前なしで持ち出すまで、そのままの状態で残された。この支店では、釘打機がパン屋で数本の釘で支払いをし、女性が干潮時に砂浜でムール貝を集めている。'
        - 'この旅では、数種類の人が協力してくれるでしょう。本や印刷業界に精通し、論文に精通していて、最後の願いをはっきりと言える人です。言葉に重みがあり、人を説得できる人。'
      outcomes:
        p1: 'ヒュームの死後 2 年も経たないうちに、ストラハンの店には「自然宗教に関する対話」が準備されました。最初のシートはラインに吊り下げられましたが、インクはまだ乾いていませんでした。'
      none: 'その冬、原稿はまだストラハンの手元にありました。カーコーディの砂浜では、ムール貝を集めていた女性がかごを持って家に帰りました。水面の向こうにはエディンバラの煙が立ち込めていました。'
      not_admitted: '{staff} さんはその家のドアをくぐることはなく、砂浜でムール貝を集めていた女性のためにカゴを運ぶのに数日を費やしました。水の向こうにはエディンバラの煙がずっと低く漂っていた。'
      points:
        p1:
          class_lettered: '11月9日、スミスはカーコーディーの自分の机に座ってストラハンに手紙を書き、ヒュームの最期の数ヶ月について記した。 {staff}は、書記官が証書をコピーする際に、彼の死から2年以内に出版された8月7日の公会議の一文を一字一句書き出し、その下に小さな八重奏に何枚、何ヶ月かかるかを書き、その紙を手紙の横に置いた。スミスはその紙を長い間眺め、それを折り、ストラハンへの手紙と一緒に入れた。封をすると、机の上にある他の文字よりも分厚かった。'
          else: '11月9日、スミスはカーコーディーの自分の机に座ってストラハンに手紙を書き、ヒュームの最期の数ヶ月について記した。 {staff} は午後中ずっと自分の机のそばに座り、8 月 7 日の法廷の一文を 2 年以内に紙に書き、ストラハンに印刷させ、彼に押しつけました。スミスはその紙を長い間眺め、それを折り、ストラハンへの手紙と一緒に入れた。封をすると、机の上にある他の文字よりも分厚かった。'
      excerpts:
        p1: 'スミスはその紙を長い間眺め、それを折り、ストラハンへの手紙と一緒に入れた。封をすると、机の上にある他の文字よりも分厚かった。'
    relic: 'ピン工場の留め針'
    relic_desc: '分業で何ができるかを示すため、スミスが例に挙げた種類の留め針。'
    points:
      p1: 'ヒュームが託した対話篇は印刷されていないが、スミスとストラハンにヒュームの依頼どおりに出版するよう話し合ってください。'
    points_fail:
      p1: '歴史と同じように、この本は 3 年待って、1779 年に彼の甥から名前も書かれていないまま出版されました。この部門では、2年以内に出版したいというヒュームの希望も守られなかった。'
    shift:
      p1:
        was: '1776年8月7日：ヒュームは法典の中でストラハンに対し、死後2年以内に『自然宗教に関する対話』を出版するよう要請した。スミスは引き受けようとはせず、ストラハンは最終的に断ったが、この本は 1779 年にヒュームの甥を通じて著者名なしで出版された。'
        now: 'ストラハンはヒュームが要求した2年以内に『対話篇』を印刷した。'
        who: 'david_hume'
        bio: 'ストラハンが最後の法典で求めたように、彼の死から 2 年以内に、四半世紀にわたって隠し続けていた対話集が印刷されました。'
    vignettes:
      nails: '{staff} はパン屋の行列に並びます。前にいる釘打機が数本の釘で支払い、パン屋が釘を数えて受け取ります。数週間後、{staff} は今春出版された分厚い本の中で、労働者が今でもお金の代わりに釘をパン屋に運んでいるスコットランドの村があることを読み、そのページを見て笑いました。'
      post: '{staff} は、運送業者がロンドンの郵便局を結ぶのに役立ちます。 1 つのパケットは印刷業者の Strahan 氏用で、他のパケットよりも厚いです。 {staff} は他のものの下に滑り込ませて雨が当たらないようにします。'
      firth: '{staff} は干潮時に砂浜を歩きます。フォース湾の向こう側にはエディンバラの煙が立ち込めており、近くでムール貝を集めている女性は、そこが賢い人々が住んでいる場所だと言います。'
  beethoven_vienna:
    name: '交響曲第九番'
    place: 'ウィーン'
    figure: 'ルートヴィヒ・ヴァン・ベートーヴェン'
    story: '1824 年の春、ベートーベンはほぼ聴覚障害者でしたが、ウィーンで新作のコンサートを準備しました。合唱団とオーケストラは別々にリハーサルを行い、その夜までに行われたフルリハーサルはわずか2回だった。 1824年5月7日、第九交響曲はケルントナートール劇場で初演され、同劇場の楽長ミヒャエル・ウムラウフが指揮し、その隣のステージにはベートーヴェンが立っていた。 5月23日に偉大なレドゥーテンザールで行われた再演では薄い家が描かれ、領収書を見て彼はがっかりした。'
    story_prose:
      opening:
        - 'ウィーン、1824 年春。ベートーベンはほとんど耳が聞こえません。彼は新作のコンサートを準備しており、その締めくくりとして第九交響曲が演奏される。オーケストラがリハーサルで演奏する内容を、誰かが会話帳に書き留めなければなりません。'
        - '歴史上、合唱団とオーケストラは別々の部屋でリハーサルを行い、初演のわずか2日前に初めて一堂に会した。 5月7日の初演の後、コンサートは23日に偉大なルドゥーテンザールで再び行われたが、多くの席が空席であり、その領収書を見て彼はがっかりした。この部門では、まだ乾いていない部品が写字生のテーブルの上の重りの下に置かれており、劇場の後ろではソプラノ歌手が喉をこすり、最終楽章の高音について不平を言っています。'
        - 'この旅行では 3 種類の人が助けてくれます。2 つのグループが最初に一緒にリハーサルするときに楽譜を読んでビートを押さえることができる人、何が間違っているのかを聞き取ることができ、作曲家に代わってそれを逐一書き留めてくれる人、そして町の人たちが帰る前に席を売るのに十分な説得力のある人です。'
      outcomes:
        all: '5月23日の夜、ホールにはまだ空席がたくさんあったが、前方の予約列は満席だった。それ以来、そのリストは彼の会話集に挟まれたままになりました。'
        p3: '5月23日の夜、ホールにはまだ空席がたくさんあったが、予約した列は満席だった。'
        p2: 'プレミアの夜、各セクションではマークされたエントリーがマークされたとおりに演奏されました。その後、そのシートは彼の会話集に挟まれたままになりました。'
        p1: '5月7日の夜、合唱団とオーケストラが同じビートで登場した。ベートーベンはウムラウフの隣に、聴衆に背を向けて立っていた。'
      none: '5月23日のホールでは、ランプの下に空の椅子が整然と並んでいた。'
      desync: '5月5日の合同リハーサルでは双方が揃うことはなかった。 {staff} がリコールされたとき、初演は 2 日休みで、オーケストラの奏者たちはまだどのビートで演奏するか議論していました。'
      not_admitted: '{staff} は劇場のバックステージに立つことはありませんでした。合唱団とオーケストラはまだ別の部屋で練習を続けており、初演は数日後に迫っていた。'
      points:
        p1: '5月5日、合唱団とオーケストラが初めて同じ部屋に集まりました。最初のバーでは、各チームがそれぞれのスピードで入ってきました。 {staff} はオーケストラとコーラスの間に立って、スコアからビート時間を 1 拍ごとに確認できるようにしました。彼らは再び動き出し、両者は最後のビートを共にした。ベートーベンは隅に立っていて、耳が聞こえず、すべての礼とすべての口が同時に止まるのだけを見ました。'
        p2: '本番リハーサル当日、{staff}は前日の組み合わせリハーサルで失敗した箇所を1枚のシートにコピーし、どの部分、どの小節が間違っているかをメモし、ベートーヴェンに手渡した。彼は紙を長時間目に近づけて、ペンで数カ所の横に印を付けた。彼がそれを返したとき、マークの上にマークがありました。'
        p3: '5月下旬、町の裕福な家庭がトランクを国に送り始めた。 {staff} はプログラムを一軒一軒訪問しました。ある家では家令がドアを半分しか開けず、主人が明後日出発すると言いました。 {staff}はプログラムを展開し、交響曲第9番との一節を指して、これを書いた人はもう耳が聞こえなくなったと述べた。スチュワードはシートを中に持ち込んで、デポジットのメモを持って戻ってきました。その夜、予約された座席のリストがベートーベンの宿舎に届けられました。彼は会話帳の下にシートを敷いて名前を一つ一つ読み上げ、最後の名前に達したらもう一度上から読みました。'
      excerpts:
        p3: 'その夜、予約された座席のリストがベートーベンの宿舎に届けられました。彼は会話帳の下にシートを敷いて名前を一つ一つ読み上げ、最後の名前に達したらもう一度上から読みました。'
        p2: '彼は紙を長時間目に近づけて、ペンで数カ所の横に印を付けた。彼がそれを返したとき、マークの上にマークがありました。'
        p1: '彼らは再び動き出し、両者は最後のビートを共にした。ベートーベンは隅に立っていて、耳が聞こえず、すべての礼とすべての口が同時に止まるのだけを見ました。'
    relic: '補聴用のラッパ'
