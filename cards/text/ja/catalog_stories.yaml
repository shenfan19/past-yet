      p2: 'クララは間違ったドアで待っていて、面会時間を逃してしまいました。この訪問がタイムラインから外れると、オフィスはあなたを呼び戻します。'
      p3: 'クララがエンデニヒに戻ったとき、ロバートはすでに亡くなっていました。'
    shift:
