      future: 'あなたはアシスタントに、人々はこの日付の一文を覚えているだろうと伝えます。彼は、それは誰かが送信機側で書いたものだと推測しています。話し手用と聞き手用の 2 枚の伝票を用意します。二人はこの裁判について、有名な文章では語れない違いを示すことになるだろう。'
      door: '受信者の折り畳まれた伝票をドアから運び戻します。そうして初めて、それをテスト文の横に置きます。欠落している単語はまだ見つかりませんが、一致する 2 つの単語が記録されています。比較を家に持ち帰ると、次の文を聞き逃してしまいます。'
  cantor_halle:
    name: '療養所からの手紙'
    place: 'ハレ'
    figure: 'ゲオルク・カントール'
    story: 'カントールは 1913 年に引退し、晩年は戦時中のドイツで病気と食糧不足で過ごしました。 1917年に彼は最後にハレの診療所に入った。彼は妻に家に帰るよう手紙を書き、1918年1月6日に診療所で亡くなった。'
    story_prose:
      opening:
        - 'ハレの診療所の窓際に椅子が立っている。カントールはまだ折っていない手紙を置き、今日誰か来るかどうか尋ねます。台所の帳簿がちょうど二階に運ばれたところです。食事を運ぶ人も待っています。'
        - 'カントールは戦時中の最後の数か月間をハレの診療所で過ごし、1918年1月6日に亡くなった。この訪問により、カントールは家族と面会することができ、キッチンで実行可能な食事計画を立てることができる。'
        - '訪問を手配する前に、誰に会いたいのかを聞いてくれる誰かを派遣してください。キッチンに何があるかを確認できる人は、自分が食べられる食事を見つけることができます。'
      points:
        p1: '手紙の下に考えられる2日を書きます。カントールはそれらを検討し、最初に聞いてほしい家族の名前を挙げます。デートが始まると、係員が椅子を廊下から遠ざけます。その日の午後、人々は外を通りますが、椅子に座っている人にはまだそれぞれの言葉が聞こえます。'
        p2: 'キッチンは、余裕があると予想される日だけを言うことができます。どれを保証できるかを尋ね、家族が何を送れるかを確認し、次にカントールが何を仕上げることができるかを尋ねます。次に食事が来るとき、彼は時計を見て、昨日二人で合意した時間だと言いました。'
      outcomes:
        all: '冬には追加の訪問があり、合意された時間に食事が提供されます。 1月になっても家族には彼がハレで亡くなったという知らせが届く。'
        p1: 'カントールは最も会いたかった人物に会う。キッチンはその日に余裕のある分だけを彼に提供できます。'
        p2: '通常の食事も増えています。彼の家族は来ることができず、代わりに手紙で敬意を表している。'
      none: '椅子はまだ窓の外を眺めています。キッチンには帳簿が折りたたまれており、約束の日もありません。'
      not_admitted: '係員によると、今日は訪問の予定はなかったという。あなたは折りたたんだ紙をドアのそばに置きます。'
      excerpts:
