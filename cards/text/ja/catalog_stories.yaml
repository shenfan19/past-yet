    relic: '彼の詩を集めた本'
    relic_desc: '一首を押し葉にした小さな本。'
    points:
      p1: '妻と子供たちが次の請求から次の請求まで生きていけないように、増え続ける借金を整理するのを手伝ってください。'
      p2: '彼が撃たれた後、モイカ川のアパートに到着できるように、ブラック川から戻る道で彼を生かし続けてください。'
      p3: 'お腹の銃創を治し、感染を抑えて生かしてやろう'
    points_fail:
      p1: 'この支店では、その冬の請求書がまだ彼の机の上に置かれており、誰も彼のために請求書を分類することはありませんでした。'
      p2: '彼はモイカに到達するまで生きていませんでした、そしてこの支店ではアパートに2日もいませんでした。'
      p3: '2月10日の午後、歴史上そうであったように彼はアパートで亡くなり、この支部では一日たりとも保管されなかった。'
    shift:
      p1:
        was: 'プーシキンが 1837 年 2 月に亡くなったとき、彼は多額の借金を残しましたが、ニコライ 1 世は後にそれを返済しました。'
        now: '借金は1枚のシートに書かれ、どれを先に支払うべきか、どれを待ってもよいかが記載されており、世帯はその状況を把握していました。'
      p2:
        was: '1837 年 2 月 8 日の決闘で撃たれた後、プーシキンはモイカ川沿いのアパートに運ばれました。'
      p3:
        was: '1837年2月10日、彼は妻と4人の子供を残して37歳で腹膜炎のためアパートで亡くなった。'
        now: '{staff} が持ってきた薬が傷口の感染を抑え、2 月が終わった時点でもまだモイカによって回復中だった。彼はさらに数年間執筆を続け、『ザ・コンテンポラリー』は彼の手元に残りました。'
    vignettes:
      number: '{staff} は、まだ存在しない博物館の銘板から家の番号を訪問者に提供しそうになり、それを取り消して代わりに伝票に橋を描きます。'
      queue: '{staff} は、ホールで待っている人が再度質問することなくそれを読めるように、同じ回答を複数の伝票に書き込みます。'
