      p2: 'ベートーヴェンに合同リハーサルの記録を書面で残して、コンサート前に返答できるようにする'
      p3: 'リスナーがウィーンを離れ、2 回目のコンサートの領収書を回収する前に、事前に座席のブロックを確保します。'
