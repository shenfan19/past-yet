  hammurabi_babylon:
    name: '石に刻まれた法'
    place: 'バビロン'
    figure: 'ハンムラビ'
    story: 'ハンムラビ治世末期の紀元前 1754 年頃、約 300 の法律が刻まれた玄武岩の石碑が設置され、その後何世紀にもわたって書記たちはその法律を粘土板に書き写しました。紀元前 12 世紀に、この石碑はスーサに持ち去られ、その文字のいくつかの柱が削り取られました。フランスの探検隊が 1901 年にスーサで発掘しました。それは現在ルーブル美術館にあり、粘土のコピーは削り取られたものの一部を返しています。'
    story_prose:
      opening:
        - 'バビロン、紀元前1754年頃。ハンムラビ治世後期、玄武岩の石碑にはプロローグ、財産、貿易、家族、労働に関する約 282 の法律、そしてエピローグが刻まれています。エピローグでは、不当な扱いを受けた人は石の前に来て、その言葉を読み上げてもらえると書かれています。律法学者は律法を粘土板に写し、世代から世代へと教えます。'
        - '歴史上、紀元前 12 世紀にエラム人の王シュトゥルク・ナフンテがこの石碑をスーサに運びましたが、その後、その顔の基部にあるいくつかの柱が滑らかに削られました。粘土のコピーにより、失われた法律のうち約 30 が返還されましたが、残りの法律が何を述べたかはまだ不明です。この支部では、書記官の家の見習いが粘土をこねて板を乾燥させますが、ユーフラテス川の船頭は文字を読むことができません。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。デスクワークに慣れていて、スキップされた行列に対応できる人。葦を切って看板を押すことができる堅実な職人。列ごとにチェックするほど細心の注意を払う人、または石の細部を引き出すメガネを使用する人。'
      outcomes:
        p1: '3,000 年以上後、別の都市に落ちてきたタブレットが、その滑らかに伸びる石の横に置かれていました。誰かがその石にもはや存在しない法則を、くさびに沿って一行一行読み取った。'
      none: 'タブレットはまだ屋根の上で乾燥しており、見習いは依然としてそれを1つずつ数えていました。数世紀後、石碑は持ち去られ、その足元の柱は平らに削られ、手に触れるものは何も残っていませんでした。'
      not_admitted: '{staff} は書記官の家には決して入らず、船頭がユーフラテス川で大麦の袋を数袋降ろすのを手伝いました。船頭は袋を数えながら、再び王の石について話しましたが、その兆候は読めませんでした。'
      points:
        p1:
          class_lettered: '部屋には新鮮な粘土の板が十数枚並べられていた。筆記者はその石の全文を何度もコピーし、そのコピーを他の都市に送って保管するつもりだった。デスクワークに慣れている{staff}さんは、出来上がった板の線をマスターに向かって上から数え、一線飛ばしてしまった箇所は粘土が柔らかいうちに滑らかにして書き直した。筆記者は最後の粘土板の端に沿って円筒印章を転がし、小さな数字と記号の帯を残しました。見習いは藁を敷いた籠に粘土板を一枚ずつ詰め、口を縛り、船頭と一緒に川の舟まで運びました。'
          class_craft: '部屋には新鮮な粘土の板が十数枚並べられていた。筆記者はその石の全文を何度もコピーし、そのコピーを他の都市に送って保管するつもりだった。 {staff}、安定した手で、数本の葦の斜めの先端を切り、粘土の切れ端でそれぞれを試し、最も鋭いものを筆記者に渡し、マスターからタブレット全体をプレスしました。筆記者は最後の粘土板の端に沿って円筒印章を転がし、小さな数字と記号の帯を残しました。見習いは藁を敷いた籠に粘土板を一枚ずつ詰め、口を縛り、船頭と一緒に川の舟まで運びました。'
          else: '部屋には新鮮な粘土の板が十数枚並べられていた。筆記者はその石の全文を何度もコピーし、そのコピーを他の都市に送って保管するつもりだった。 {staff} はマスターの列を 1 列ずつ下に移動し、各錠剤がどの規則で始まり、どの規則で終わるのかを陶器の破片に引っ掻いて、コピーが一緒になって何も残らないようにしました。筆記者は最後の粘土板の端に沿って円筒印章を転がし、小さな数字と記号の帯を残しました。見習いは藁を敷いた籠に粘土板を一枚ずつ詰め、口を縛り、船頭と一緒に川の舟まで運びました。'
      excerpts:
        p1: '筆記者は最後の粘土板の端に沿って円筒印章を転がし、小さな数字と記号の帯を残しました。見習いは藁を敷いた籠に粘土板を一枚ずつ詰め、口を縛り、船頭と一緒に川の舟まで運びました。'
    relic: '円筒印章'
    relic_desc: '粘土の上で転がすと署名が写る、小さな石の円筒。'
    points:
      p1: '書記たちが石碑の全文をさらに多くの粘土板に写し、他の都市に送るのを手伝ってください。そうすれば、石碑の一部が削り取られた後でもすべての法律を読むことができます。'
    points_fail:
      p1: '全文はすでに存在するコピーに残されていました。この支部では、石が須佐に運ばれ、その一部が削られた後、法律の一部が依然として失われていました。'
    shift:
      p1:
        was: '紀元前 12 世紀に、この石碑はスーサに持ち去られ、その文字のいくつかの柱が削り取られました。粘土のコピーにより、失われた法律のうち約 30 が復元されましたが、残りはまだ不明です。'
        now: '{staff} は、筆記者がさらに完全なコピーを作成し、他の都市に送信するのに役立ちました。このタイムラインでは、石碑に関するすべての法律を今でも読み取ることができます。'
        who: 'hammurabi_babylon'
        bio: 'この線では、ハンムラビ法がすべて完全に継承され、石から削り取られたものは何も失われませんでした。'
    vignettes:
      clay: '{staff} は、見習いの筆記者が粘土をこねるのを手伝います。砂を適切に洗い流さないと途中でタブレットがスタイラスの下で割れてしまうので、師匠は最初の行からやり直すように指示する、と見習いは言う。'
      river: '{staff} は、ユーフラテス川の岸辺で大麦を降ろす船頭の手伝いをします。船頭は袋を数えながら、もし計量士が袋を騙し取ったら、行って王の石の前に立って法を暗唱するだろうと言いましたが、自分ではその標識を読むことはできませんでした。'
      roof: 'その日の最悪の暑さの中、{staff} と実習生は新しい錠剤を屋根の上に広げて乾燥させました。見習いはそれを数えますが、途中で数えなくなり、鳥がその上を歩いたのではないかと心配して、再び数え始めます。'
  ibn_battuta_tangier:
    name: '長い旅の始まりに'
    place: 'タンジェ、モロッコ'
    figure: 'イブン・バットゥータ'
    story: '1325 年 6 月、イブン バットゥータは故郷のタンジールを去りました。リラでは、彼は両親も残して、仲間もキャラバンも持たずに出発したことを思い出した。モロッコに戻った後、彼がイブン・ジュザイに口述筆記した記録には、30年近くの旅の記録が記されている。'
    story_prose:
      opening:
        - 'モロッコ、タンジェ、1325年6月。20代前半のイブン・バットゥータはこれから長い旅に出ようとしていたが、両親はまだ家にいた。ほぼ30年後、彼は帰国し、見たものをイブン・ジュザイに口述筆記し、それがリフラとなった。'
        - '歴史上、彼は仲間もなく、参加するキャラバンもなく、一人で町の門を出ました。ミリアナで追いついたチュニスのスルタンの使者二人は二人とも暑さで体調を崩し、そのうちの一人は三晩後に町の外の小川で亡くなった。ベジャイアを過ぎると再び熱が彼を襲い、ターバン布で鞍に縛り付けられた。彼がチュニスに入った日、町から出てきた人々の中で彼を知っている人は一人もおらず、彼は涙を抑えることができませんでした。この支店では、隣人が噴水の水を汲んでおり、町外れのポーターは道路の最初の区間しか知りません。'
        - 'この旅行では、数種類の人が協力してくれるでしょう。看護の知識があり、十分な水分補給用の塩と水を持ってきてくれる人。非常にタフな人、または痛み止めを持って歯を食いしばって暑さと震えを乗り切ることができる人。見知らぬ街の門から一歩を踏み出す、心温まる人。'
      outcomes:
        all: 'その秋、チュニスのスルタンの両方の使者が町に帰ってきました。イブン・バットゥータはチュニスに 2 か月間滞在しましたが、その日一緒にやって来た人が、しばしば彼が滞在する場所に来て、しばらく座っていました。その後、彼はより大きなキャラバンを率いて東へ向かいました。'
        p2: 'その秋、二人の使節は順番に馬に乗ってチュニスに戻った。病気の人が２番目に乗り、川から汲んだ水入れを鞍にぶら下げた。'
        p3: '彼はチュニスに２ヶ月滞在した。その日彼と一緒に歩いてきた人は、しばしば彼が泊まる場所に来て、しばらく座っていましたが、主に道路について話し合っていました。'
        p1: '彼は一度も鞍から離れることなく、チュニスまで粘り続けた。その後、ターバンの布は彼の頭の周りに戻り、彼と一緒に東へ遠くまで行ってしまいました。'
      none: '7月、ミリアナ郊外の小川のほとりでキャラバン隊は三晩止まり、使者の一人は再び起き上がれなかった。 9月、チュニスの門で、出てきた人々が他の男性の名前を呼び、彼は手綱を握ったまま群衆の端に立って大声で泣いた。'
      desync: '8月、コンスタンティノスを過ぎたところで、結び目が解けた。 {staff} がリコールされたとき、キャラバンは道路の真ん中で停止し、空のサドルにターバン布がぶら下がっていて、一方の端は縛られたまま、もう一方の端は地面を引きずっていました。'
      not_admitted: '{staff} さんはタンジールに足場を見つけることができず、隣人のために何度か噴水で水を運んでいました。 6月14日早朝、若い男が動物を連れて町の門から外へ出たが、彼の横には仲間も後ろにもキャラバンもいなかった。'
      points:
        p2:
          class_medical: '7月、ミリアナ郊外の4マイルの小川のほとり。両方の使者は暑さで体調を崩し、キャラバンは水辺で三晩立ち止まった。二人のうち悪い方はそこに横たわっていて、話しかけられてもかろうじて目を開けていました。 {staff} さんは、看護師が教えるように、フラスコ内の冷やした沸騰したお湯に補水塩 2 袋を混ぜ、頭を持ち上げて一度に一口ずつ与え、額と首の後ろに濡れた布を置き、時々取り替えました。4日目の朝、彼は一人で起き上がり、水入れを両手で持ち、乾いた水を飲み、返しました。キャラバンは先に進むために荷物をまとめたが、川はまだ石の間を音を立てて流れていた。'
          else: '7月、ミリアナ郊外の4マイルの小川のほとり。両方の使者は暑さで体調を崩し、キャラバンは水辺で三晩立ち止まった。二人のうち悪い方はそこに横たわっていて、話しかけられてもかろうじて目を開けていました。 {staff}さんは持参した医療キットを開け、熱を下げ、一晩中眠らずにそばにいて、水を一口ずつ飲むのを待ちました。4日目の朝、彼は一人で起き上がり、水入れを両手で持ち、乾いた水を飲み、返しました。キャラバンは先に進むために荷物をまとめたが、川はまだ石の間を音を立てて流れていた。'
        p1:
          class_medical: '8月、コンスタンティノスを過ぎ、イブン・バットゥータに熱がぶり返した。ベジャイアではすでに友人が元気になるまで滞在するよう勧めていたが、彼は滞在しなかった。今度は、熱で衰弱して転倒するのではないかと、ターバン布で鞍に縛り付けた。 {staff} は、看護師が教えているように、立ち止まるたびに額と手首を感じ、濡れた布を何度も交換し、水を飲み込むのを眺め、もう一度結び目をしっかりと締めました。夜、キャラバンが停止したとき、彼はまだサドルに座り、動物の首の上にうずくまっていました。水の皮を唇に当てたとき、彼は二口飲み、それから手を伸ばして結び目をもう一度感じました。'
          else: '8月、コンスタンティノスを過ぎ、イブン・バットゥータに熱がぶり返した。ベジャイアではすでに友人が元気になるまで滞在するよう勧めていたが、彼は滞在しなかった。今度は、熱で衰弱して転倒するのではないかと、ターバン布で鞍に縛り付けた。 {staff} さんは、片手で手綱を握りながらずっと動物の横を歩き、揺れるたびに手を伸ばしてサドルに押し戻し、一日中手を替えずに太陽の下で過ごしました。夜、キャラバンが停止したとき、彼はまだサドルに座り、動物の首の上にうずくまっていました。水の皮を唇に当てたとき、彼は二口飲み、それから手を伸ばして結び目をもう一度感じました。'
        p3: '9月、キャラバン隊はチュニスに到着した。町の人々が出てきて、一行の商人たちを名前で呼び、次々と手を取った。イブン・バットゥータのことを誰も知りませんでした。彼はまだ手綱を握ったまま、群衆の端に立っていました。道中彼とよく話していた{staff}が彼の隣に来て名前を呼び、その夜どこで寝ていたのか尋ねました。彼は袖で顔を拭き、ずっと握っていた手綱をもう一方の手に移した。二人は順番に並んで、歓迎する群衆を通り過ぎて門を通って入った。'
      excerpts:
        p2: '4日目の朝、彼は一人で起き上がり、水入れを両手で持ち、乾いた水を飲み、返しました。キャラバンは先に進むために荷物をまとめたが、川はまだ石の間を音を立てて流れていた。'
        p3: '彼は袖で顔を拭き、ずっと握っていた手綱をもう一方の手に移した。二人は順番に並んで、歓迎する群衆を通り過ぎて門を通って入った。'
        p1: '夜、キャラバンが停止したとき、彼はまだサドルに座り、動物の首の上にうずくまっていました。水の皮を唇に当てたとき、彼は二口飲み、それから手を伸ばして結び目をもう一度感じました。'
    relic: '旅行で履いたサンダル'
    relic_desc: '底を何度も張り替えた革のサンダル。'
    points:
      p1: 'ベジャイアからの道中、チュニスに着くまで熱を出してサドルに座らせておく'
      p2: 'ミリアナで、暑さで倒れたチュニスの特使を救う'
      p3: '彼がチュニスに入る日、彼は見知らぬ町に一人ではないことを知らせてください'
    points_fail:
