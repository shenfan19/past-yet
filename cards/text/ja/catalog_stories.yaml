        p2: 'どれを保証できるかを尋ね、家族が何を送れるかを確認し、次にカントールが何を仕上げることができるかを尋ねます。次に食事が来るとき、彼は時計を見て、昨日二人で合意した時間だと言いました。'
    relic: '未使用の封筒'
