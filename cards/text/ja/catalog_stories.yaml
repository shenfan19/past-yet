  murasaki_kyoto:
    name: '世界初の偉大な長編小説'
    place: '京都'
    figure: '紫式部'
    story: '1008 年の秋、皇后尚子は男の子を産み、彼女の女性の一人、紫式部はその後の数週間の日記を付けました。 50日目の宴の席で、ある廷臣が源氏物語の少女「紫の少女」を呼びました。これは、源氏物語が知られている最古の年代記である。十一月、女たちは紙を選び、璋子が宮中に持ち帰るために物語を書き写し製本し、道長は紫が部屋に保管していた草稿を持ち去った。彼女自身の手の中に残っているものはありません。'
    story_prose:
      opening:
        - '1008年、寛弘5年秋の京都。一条天皇の皇后である璋子に男子が生まれ、側室の一人である紫式部はその後数週間の日記をつけている。五十日目の宴の席で、廷臣が源氏物語に登場する少女「紫若」を呼び出すが、これは物語が知られている最古の証拠である。'
        - '歴史上、11 月に女性たちは紙を選び、物語を書き写し、製本して彰子が宮殿に持ち帰ることができました。紫が勤務している間、道長は自室からまだ修正していない草稿を取り出して娘の賢子に渡し、彼女は日記に不安を書き残した。彼女自身の手によるコピーは現存しておらず、この物語は、互いに異なる後の原稿の行を通じて伝わってきます。この支店では、尚子の女官の一人が写経用の紙の世話をしており、もう一人は宴会の様子を知っている。'
        - 'この旅行では、何種類かの人々が助けてくれます。アーカイブを保存したり、校正刷りを読んだりする人、あるいは、本を 1 冊ずつ間違えないように器用で忍耐強い人です。本に精通していて、人々に話しかけることができる人に、貸し出す本を選んでもらいます。'
      outcomes:
        all: '十一月十七日、綴じられた物語は一巻も欠けることなく、尚子とともに宮中に戻った。 12か月後にそれを借りに来た人たちは、彼女がマークしたセットを開けました。 2012年、日本は50日目の晩餐会の日記にちなみ、11月1日をクラシックデーとした。'
        p2: '12か月後に物語を借りに来た人たちは、彼女がチェックしたセットを開いて、隅に彼女の小さなマークが残っていました。それでも彼女自身の手による写本は残っておらず、その後の写本は依然として互いに異なっています。'
        p1: '十一月十七日、尚子は王子を連れて宮中に戻り、結ばれた物語も一緒に行きました。 2012年、日本は50日目の晩餐会の日記にちなみ、11月1日をクラシックデーとした。'
      none: '十二月に雪が降りました。紫が校閲を終えていない章は彼女の部屋から借りてきたもので、机の上には蓋がきちんと閉まっていない漆塗りの箱だけが残されていた。'
      desync: '11か月目の17日の早朝、検査されていない量がまだチェストに混ざっていました。紙を保管していた女性はサンプルを床に広げ、一度に 1 冊ずつ照合していました。{staff} が思い出されたとき、彼女はまだサンプルの間にひざまずいて、手には何も一致しないタイトル紙を持っていました。'
      not_admitted: '{staff} は一度も中に入ることはなく、土御門の壁の外に数回立っただけでした。 50日目の宴会の夜、壁を越えて音楽と笑い声が聞こえ、誰かが道路からは聞き取ることができない質問をしました。'
      points:
        p1:
          class_lettered: '十一月十七日早朝、尚子は宮に戻ることになる。ギャラリーに沿って、新たに製本された本、完成した本とチェックされていない本が混在して山積みになっており、いくつかのタイトルスリップのインクはまだ乾いていません。 {staff} は、家で紙とメモを持って、各巻を開いて章のリストと照合し、間違った章が含まれている 1 冊を取り出し、もう 1 つの山からチェックを入れた冊子を所定の位置に置き、各巻を順番に本箱に置きます。馬車が出発する前に、紙を保管している女性が最後の巻を箱に入れます。彼女はまっすぐになる前に、もう一度指先で結び目の角を押します。'
          else: '十一月十七日早朝、尚子は宮に戻ることになる。ギャラリーに沿って、新たに製本された本、完成した本とチェックされていない本が混在して山積みになっており、いくつかのタイトルスリップのインクはまだ乾いていません。 {staff} は器用で忍耐強く、各タイトル紙に沿って紙サンプルに指を這わせ、間違った章が含まれている綴じ込みを 1 冊取り出し、もう 1 冊の山からチェックを入れた冊子を元の位置に置き、各巻を順番に本棚に置きます。馬車が出発する前に、紙を保管している女性が最後の巻を箱に入れます。彼女はまっすぐになる前に、もう一度指先で結び目の角を押します。'
        p2:
          class_lettered: '十二月の半ば、雪が降らなかった日が二日続いた後、宮殿の女官たちが物語を借りに行かせます。彼らは最初に後の章を読みたいと考えています。紫の部屋の机の上には、まだ改訂が終わっていないいくつかの章があり、その余白には小さな書き下ろしがあった。 {staff} は自宅に本があり、チェックしたセットを専用のチェストに詰め、ローンセットとしてマークし、各巻に誰が持っているか、いつ返却するかをメモします。未完の章は紙に包まれて彼女のそばに保管されています。紫は貸本セットの一冊を最後のページまでめくり、隅に筆で小さな跡を付けます。彼女は筆を漆塗りの箱に戻すと、軽くノックする音で蓋が閉まりました。'
          else: '十二月の半ば、雪が降らなかった日が二日続いた後、宮殿の女官たちが物語を借りに行かせます。彼らは最初に後の章を読みたいと考えています。紫の部屋の机の上には、まだ改訂が終わっていないいくつかの章があり、その余白には小さな書き下ろしがあった。 {staff} は慎重かつ説得力があり、借り手にチェックされたセットを最初に読むよう求め、それを専用のチェストに詰め込みます。未完の章は紙に包まれて彼女のそばに保管されています。紫は貸本セットの一冊を最後のページまでめくり、隅に筆で小さな跡を付けます。彼女は筆を漆塗りの箱に戻すと、軽くノックする音で蓋が閉まりました。'
      excerpts:
        p2: '紫は貸本セットの一冊を最後のページまでめくり、隅に筆で小さな跡を付けます。彼女は筆を漆塗りの箱に戻すと、軽くノックする音で蓋が閉まりました。'
        p1: '馬車が出発する前に、紙を保管している女性が最後の巻を箱に入れます。彼女はまっすぐになる前に、もう一度指先で結び目の角を押します。'
    relic: '漆塗りの筆箱'
    relic_desc: '筆と硯、それに水を入れた小さな箱。'
    points:
      p1: '章ごとに紙を割り当て、書子のためにコピーされた巻の配達を確認して、セットを組み立てられるようにします'
      p2: '初期の読者に、彼女が承認した貸し出しコピーを提供します。未完成の論文は彼女と一緒に保管し、新しいコピーリストに承認されたセットから描画してもらいます'
    points_fail:
      p1: '完了した章には未チェックの章がたくさんあります。セットは未完成のままであり、事務所はその従業員を呼び戻す。'
      p2: 'ドラフトは貸し出し中です。後世の写本家は、作者が改訂の意図を持っていたことを知りません。'
    shift:
      p1:
        was: '紫の日記には、璋子の周りにいる女性たちが道長から提供された筆記用具を使って『源氏物語』を書き写す様子が記録されている。'
      p2:
        was: '源氏はさまざまな写本の伝統を経て伝わってきます。紫自身の手による最終版は現存していない。'
        now: '最初に借りた人は、彼女がチェックしたセットを読みました。その後のコピーは依然として異なりますが、そのローンセットには彼女がどの章を承認したかが記録されています。'
        who: 'murasaki_kyoto'
        bio: '紫は平安の宮廷でこう書いた。紙の提供、コピー、貸し出しは、改訂中の作品が新しい読者にどのように届くかに影響を与えました。'
    vignettes:
      banquet: '50日目の宴会の前日に、{staff}はギャラリーに沿ってトレイを運ぶのを手伝います。女性の一人は、明日の夜、紳士たちが酒を飲んだら、物語から名前を出して女性たちをからかい始めるだろう、そしてすべきことは聞かないことだ、と小声で言う。'
      paper: '{staff} は、女性が色紙を章ごとに分類し、それぞれの山の重さを量るのを手伝います。彼女によると、完成したすべてのページが最初にチェックされ、手が傾いていたらページ全体がやり直しになり、紙も再度要求されなければなりません。'
      snow: '十二の月には雪が降ります。 {staff} がギャラリーを席巻していると、中の閲覧が途中で止まり、次の巻を誰が手に取ったかを尋ねる声が聞こえます。'
  sejong_hangul:
    name: '誰もが学べる文字'
    place: 'ソウル'
    figure: '世宗と学者たち'
    story: '1443年、朝鮮の世宗は朝鮮語を書くための28の文字を作りました。1444年の第2月には、集賢殿の崔万理と同僚六人が反対の上疏を提出しました。1446年、新しい文字は「民を教える正しい音」という意味の『訓民正音』として公布されました。世宗は1450年に亡くなりました。'
    relic: '文字を彫った版木'
    relic_desc: '最初の文字を彫り終え、あとは墨を塗れば刷れる版木。'
    points:
      p1: '記念式典の日には、詩集『ユンフイ』の新しい文字への翻訳草案を議会ホールに保管し、作業を続けてください。'
      p2: '学校に行ったことのない人が新しい文字で自分の名前を書くのを自分の目で見てもらいましょう'
      p3: '椒井では、目の痛みを和らげて、新しい文字がはっきり見えるようにしてください'
    points_fail:
