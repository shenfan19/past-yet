  sequoyah_syllabary:
    name: '一人で作った文字'
    place: 'チェロキー族の国、米国南東部'
    figure: 'セコイア'
    story: 'チェロキー族の銀細工師セクォーヤは 1821 年にチェロキー族の文字体系を完成させました。その記号は個々の音ではなく音節を表しています。チェロキー族は 10 年後半にこの音節文字を正式に採用しました。 1828 年 2 月 21 日、最初のチェロキー フェニックスがニュー エコータで印刷され、チェロキー語と英語の両方が印刷されました。'
    story_prose:
      opening:
        - '1821年、アメリカ南東部のチェロキー族の国。銀細工師セクォーヤは英語が読めないが、チェロキー族のために約80の記号からなる音節を作り、それぞれの記号が1音節を表している。彼は長年この仕事に熱心に取り組んできました。'
        - '歴史上、彼は片足が不自由で、歩くのが困難でした。畑は妻一人に残され、家族は何度も畑を手放すように懇願し、妻が書類を燃やしたこともあった。彼がその文章を見せると、人々は疑いを持ち、ある人は面と向かって彼を非難した。この分岐では、学習者が一度に 1 つずつ単語を発音し、隣人が自分の名前を書きたいと考えています。'
        - 'この旅では、数種類の人々が助けてくれます。冷静な人、人の言うことを聞いてくれる人、疑惑が高まった日に立ち上がる鉄の意志を持った人、または金のリンゴを持った人です。医学に詳しい人、または鎮痛剤を持っている人。農業を経験した強い意志のある人、またはこの家の半年の畑仕事を引き受ける親切で非常にタフな人。'
      outcomes:
        all: '当時、文字はチェロキー族に町ごとに広まり、彼の妻も文字を書くことを学びました。 1828 年 2 月 21 日、最初のチェロキー フェニックスがニューエコタ、チェロキー、イングリッシュで並んで報道陣に登場しました。'
        p3: 'その半年は畑を無駄にすることはなく、家庭内での喧嘩も減りました。その後、彼の妻も手話で書くことを学びました。'
        p2: 'その半年の間に彼の足の痛みは和らぎ、彼は教えるために次の町へ向かう道をより早く歩いた。彼が先に進めば進むほど、学習者は増えました。'
        p1: 'その後評議会はこの文書を正式に採択した。 1828 年 2 月 21 日、最初のチェロキー フェニックスがニューエコタで報道陣から登場し、チェロキーとイギリス人が並んで列をなしました。'
      none: '上映当日、叫び声がすべてをかき消し、アヨカが再び呼ばれて朗読されることはなかった。標識が書かれた紙が足元で踏みつけられていた。'
      desync: '上映当日、叫び声はさらに大きくなり、誰もその子の帰りを待ちませんでした。 {staff} がリコールされたとき、群衆は広場から去り、一言が書かれた紙が小さな足跡の横の土の中に横たわっていました。'
      not_admitted: '{staff} はここに足場を見つけることができず、隣人が紙から彼女の名前を数回追跡するのを手伝っただけでした。遠く離れた空き地で、足を引きずった男性が数人の人々に紙に書かれた標識を指さしていました。'
      points:
        p2:
          class_medical: 'セコイアさんは人々に標識を教えるために近くの町に行くつもりだったが、少し歩くだけで不自由な足が痛くなり、道が続くたびに何度も休まなければならなかった。医学に詳しい{staff}さんは、毎晩脚に温湿布を貼り、凝りをほぐし、手にフィットする高さまで杖を切りました。その日、彼は日が沈む前に次の町に到着した。彼は紙に一連の記号を書き、学習者は身をかがめてそれを音節ごとに読み上げました。'
          else: 'セコイアさんは人々に標識を教えるために近くの町に行くつもりだったが、少し歩くだけで不自由な足が痛くなり、道が続くたびに何度も休まなければならなかった。鎮痛剤を持ってきた{staff}さんは、毎日出発前に鎮痛剤を渡し、ずっと彼の隣を歩き、サインが書かれた紙のロールを彼のために運んでいた。その日、彼は日が沈む前に次の町に到着した。彼は紙に一連の記号を書き、学習者は身をかがめてそれを音節ごとに読み上げました。'
        p1:
          trait_calm: '上映当日、オープングラウンドは混雑していました。セコイアさんは、6歳の娘アヨカを先に送り出し、誰かに一言言ってもらい、それを書き留め、それを読むために彼女に電話をかけ直した。彼が書き終える前に、群衆の誰かが不審に思い、その兆候は不気味で信用できないと言い、彼に面と向かって叫び始めました。 {staff} は急いで彼の側に来て、みんなに待って、子供が戻ってきて最初にそれを読んで、正しく読み終わったら話すように言いました。アヨカは呼び戻され、紙に目を落とし、単語を一音節ずつ読み上げました。地面はしばらく静まり返り、その言葉を言った人は二歩前に出て身をかがめて紙の標識を眺めた。'
          else: '上映当日、オープングラウンドは混雑していました。セコイアさんは、6歳の娘アヨカを先に送り出し、誰かに一言言ってもらい、それを書き留め、それを読むために彼女に電話をかけ直した。彼が書き終える前に、群衆の誰かが不審に思い、その兆候は不気味で信用できないと言い、彼に面と向かって叫び始めました。 {staff} は群衆の前に立ち、声を荒げずに、子供が本を読みに戻ってきたら、少し待てば解決すると言い、叫ぶ人たちを一人ずつ説得した。アヨカは呼び戻され、紙に目を落とし、単語を一音節ずつ読み上げました。地面はしばらく静まり返り、その言葉を言った人は二歩前に出て身をかがめて紙の標識を眺めた。'
        p3:
          class_labour: '畑仕事は長い間妻一人に任されており、トウモロコシ畑のほとんどは荒れ果て、家族は執筆を巡って何年も口論になっていた。農業をしていた{staff}さんは、明るいうちに雑草を刈り、畝を土で覆い、放棄された畝に再び苗を植え、夕方には妻と一緒に水を家に運びました。その季節の収穫物が家に届きました。セコイアさんは標識が書かれたロール紙をテーブルの上に広げ、妻は彼の隣に座り、長い間眺めてから指を伸ばして標識の一つに触れた。'
          else: '畑仕事は長い間妻一人に任されており、トウモロコシ畑のほとんどは荒れ果て、家族は執筆を巡って何年も口論になっていた。 {staff} は、強くて心の温かい人で、毎日妻と一緒に畑に出て、最も重労働を引き受け、朝から暗くなるまで働き続けました。その季節の収穫物が家に届きました。セコイアさんは標識が書かれたロール紙をテーブルの上に広げ、妻は彼の隣に座り、長い間眺めてから指を伸ばして標識の一つに触れた。'
      excerpts:
