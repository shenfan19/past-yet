  tagore_santiniketan:
    name: '一つの詩を二度読む'
    place: 'シャンティニケタン、インド'
    figure: 'ラビンドラナート・タゴール'
    story: '1912年11月、ラビンドラナート・タゴール自身のベンガル語の歌を散文で表現した英国版『ギタンジャリ』がロンドンで出版された。 1913年11月13日、スウェーデンアカデミーは彼にノーベル文学賞を授与した。 10日後、カルカッタからサンティニケタンにある彼の学校に、善意を願う人々の列車がやって来た。返答の中で彼は、国の名の下に提供された栄誉を素直に受け入れることはできず、招待客の多くは傷つきながら帰っていったと述べた。賞金はこの学校に寄付され、1921 年にヴィシュヴァ バーラティ大学となりました。'
    story_prose:
      opening:
        - 'ベンガルのサンティニケタン、1913 年 11 月。詩人のラビンドラナート タゴールはここで学校を運営しています。 1年前、ベンガル語の歌を彼自身が散文的に表現した『英語版ギタンジャリ』がロンドンで出版された。 11月13日、スウェーデン・アカデミーは彼に、ヨーロッパ以外の作家に与えられる初めてのノーベル文学賞を授与した。'
        - '歴史上、10日後、電車がカルカッタから善意を願う人々を連れてきました。返答の中で彼は、国の名の下に提供された栄誉を素直に受け入れることはできず、招待客の多くは傷つきながら帰国し、それ以来、彼と多くの同胞の間には距離ができてしまったと述べた。この分校にはマンゴーの木に登る少年と米を保管する調理師がおり、客の一人が駅に傘を置き忘れた。'
        - 'この旅行では、数種類の人が助けてくれます。教えたり、ニュースで働いたり、訪問者を案内したりしたことがあり、人々と話す方法を知っている人。優しくてしっかりした意志のある人。または金のリンゴを持っている人。レセプションが解散すると、ゲストたちはすでに駅に向かって歩いています。'
      outcomes:
        all: 'その夜のゲストたちは夜行列車でカルカッタに戻りました。その後数年間、街から次々と人々がサンティニケタンに集まり、1921 年にこの学校はヴィシュヴァ バーラティ大学となりました。'
        p1: 'その夜のゲストたちは夜行列車でカルカッタに戻りました。その後数年間、街から次々と人々がサンティニケタンに集まり、1921 年にこの学校はヴィシュヴァ バーラティ大学となりました。'
      none: '11月23日の夕暮れ時、ゲストたちはボルプール駅で電車を待っていたが、ホームには誰も話さなかった。列車が去った後も、ベンチはマンゴーの木の下に残っていて、どれも片づけられませんでした。'
      not_admitted: '{staff} さんは一度も学校に入ることはなく、ボルプールのホームから電車が入ったり出たりするのを眺めるだけでした。途中、馬車の中で誰かが歌っていた。帰りにはすべての窓が閉まりました。'
      points:
        p1:
          class_teaching: '11 月 23 日、レセプションは解散され、ゲストたちは 2 人、3 人でボルプール駅に向かって歩き去ります。最後の数人はずっと一言も話さなかった。教えてきた{staff}は、厳しい言葉を発した後は、人々が数歩進むまで待ってから追いかけ、追いつき、道路のそばでしばらく一緒に立って、庭に連れ戻すことを知っています。暗くなると室内にランプが灯され、タゴールと数人の客が低いテーブルの周りに座り、お茶が二度注がれる。客は手でコピーした歌集を手に取り、それを閉じます。彼は庭で聞いたと思ったことをタゴールに話します。タゴールはどの言葉がその印象を与えたかを尋ね、答えを待ちます。'
          class_press: '11 月 23 日、レセプションは解散し、ゲストたちは 2 人、3 人でボルプール駅に向かって歩き去ります。最後の数人はずっと一言も話さなかった。ニュースで働いたことのある{staff}は、文が2番目の口を通過する際にどのように変化するかを知っており、彼らに追いつき、詩人自身に尋ねる前に今日の言葉を街に持ち帰らないように頼み、彼らを庭に連れ戻します。暗くなると室内にランプが灯され、タゴールと数人の客が低いテーブルの周りに座り、お茶が二度注がれる。客は手でコピーした歌集を手に取り、それを閉じます。彼は庭で聞いたと思ったことをタゴールに話します。タゴールはどの言葉がその印象を与えたかを尋ね、答えを待ちます。'
          else: '11 月 23 日、レセプションは解散し、ゲストたちは 2 人、3 人でボルプール駅に向かって歩き去ります。最後の数人はずっと一言も話さなかった。 {staff}は、急がず穏やかで、彼らに追いつき、多くを語らずにしばらく道路のそばに立ち、出発前にお茶をもう一杯飲むかどうかだけを尋ね、彼らを庭に連れ戻しました。暗くなると室内にランプが灯され、タゴールと数人の客が低いテーブルの周りに座り、お茶が二度注がれる。客は手でコピーした歌集を手に取り、それを閉じます。彼は庭で聞いたと思ったことをタゴールに話します。タゴールはどの言葉がその印象を与えたかを尋ね、答えを待ちます。'
