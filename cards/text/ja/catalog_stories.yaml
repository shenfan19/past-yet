  ahmed_baba_timbuktu:
    name: '補遺に残す名前'
    place: 'トンブクトゥ'
    figure: 'アフマド・バーバー'
    story: '1591年にモロッコ軍がトンブクトゥを占領した後、学者アフマド・ババはスルタンに抵抗した罪で告発され、1594年にマラケシュに追放された。そこで彼はイブン・ファルンの補足として伝記辞典を編纂しました。彼は 1608 年にトンブクトゥへの帰還を許可され、1627 年 4 月 22 日にそこで亡くなりました。'
    story_prose:
      opening:
        - 'トンブクトゥ、1594年。3年前、モロッコ軍がこの都市を占領した。アフマド・バーバーはここの学者です。彼は法律と文法に関する数十冊の本を執筆しており、彼の家には非常に大きな図書館があります。'
        - '歴史上、今年彼はスルタンに反抗したとして告発され、家族とともにサハラ砂漠を越えて北のマラケシュまで行進した。彼の本は持ち去られたり、別のアカウントで道に紛失したりした。 14年後、彼は帰宅を許されたが、本はなくなっていた。この支店では、車線の一番端にある世帯の妻がベッドの下のスペースを空けようとしています。中庭では写字生が今も自分の本のラベルを書いています。'
        - 'この旅では、3 種類の人々が助けてくれます。古い本とどの箱を最初に保存するかを知っている人、連れ去られる日に突き飛ばされるのに十分耐えられる大胆でたくましい人、そして看護の知識があり、傷を治療し、砂漠で水を分け与えることができる人です。'
      outcomes:
        all: '1608年、アハメド・ババはトンブクトゥに戻ってきた。隣の奥さんは年をとっていました。彼女はベッドの下からタンスを引きずり出しましたが、革の上には埃が積もっていました。彼は一番上の巻を開いて、自分の手を知っていました。'
        p3: '14年後、彼はトンブクトゥに戻ってきた。その家人はベッドの下からタンスを運び出し、彼はその巻を一冊ずつ手でなぞって、長い間タンスのそばに座っていました。'
        p2: '老若男女の家族全員がマラケシュに到着しました。市門のそばで子供の足がかさぶたになっていました。'
        p1: '彼は生きてマラケシュに到着した。 14年後、彼は帰国を許された。'
      none: '北へ向かう縦隊は遠く離れていった。トンブクトゥのその部屋では、棚は空のままで、ドアは閉まっていませんでした。'
      desync: '彼が連行された日、街角で乱闘が発生し、{staff}は彼の元に到着する前に事務所によってリコールされた。最後に見えたのは、群衆の中で踏みにじられた靴でした。'
      not_admitted: '{staff} はその中庭に入ったことはありません。本はまだ本棚にあり、彼が連れ去られる日は近づいていた。'
      points:
        p3:
          class_craft: '{staff} は古い本の修理規則に従い、最ももろい本の間に乾いた布を敷き、革を内側に向け、フラップを平らに押し、層ごとにチェストに詰め込みました。暗くなった後、2人の男が2つの車線を通って隣の妻の家に箱を運びました。彼女はベッドの下から散らかったものを引きずり出し、チェストを押し込み、散らかったものを元の場所に戻し、手の埃を払いました。'
          class_lettered: '{staff} は本のリストから、まず自分自身の草稿と他には存在しないコピーを選び、それらを一層ずつ箱に詰め込みました。暗くなった後、2人の男が2つの車線を通って隣の妻の家に箱を運びました。彼女はベッドの下から散らかったものを引きずり出し、チェストを押し込み、散らかったものを元の場所に戻し、手の埃を払いました。'
          else: '{staff} はタイトルを 1 冊ずつ確認し、まず自分の草稿とレア コピーを脇に置き、それらを一層ずつ箱に詰め込みました。暗くなった後、2人の男が2つの車線を通って隣の妻の家に箱を運びました。彼女はベッドの下から散らかったものを引きずり出し、チェストを押し込み、散らかったものを元の場所に戻し、手の埃を払いました。'
        p1: '彼が連行された日、通りは混雑しており、突き飛ばす中で誰かが刃物を抜いた。{staff} はアフマド・バーバーの前に立ち、彼を戸口に引き込み、ドア枠に背中を押しつけた。それが過ぎると、彼はローブを正して、無傷で自分で歩き出ました。'
        p2: '北への道に入って半月後、隊列にいた男性が高熱を出し、子供が足の裏を擦りむいた。毎晩、野営の支度を終えると、{staff}は傷を洗い、包帯を替え、水を一人ずつ同じ量に分けた。ある夜、子どもが自分の水袋を差し出した。中にはあと一口しか残っていなかった。'
      excerpts:
        p3: '暗くなった後、2人の男が2つの車線を通って隣の妻の家に箱を運びました。彼女はベッドの下から散らかったものを引きずり出し、チェストを押し込み、散らかったものを元の場所に戻し、手の埃を払いました。'
        p2: '毎晩、野営の支度を終えると、{staff}は傷を洗い、包帯を替え、水を一人ずつ同じ量に分けた。ある夜、子どもが自分の水袋を差し出した。中にはあと一口しか残っていなかった。'
        p1: '{staff} はアフマド・バーバーの前に立ち、彼を戸口に引き込み、ドア枠に背中を押しつけた。それが過ぎると、彼はローブを正して、無傷で自分で歩き出ました。'
    relic: '革綴じの原稿'
    relic_desc: '擦り切れたフラップ付きの革表紙に入った原稿。'
    points:
      p1: '彼が連れ去られる前に、逮捕された学者たちに刃が向けられるのを止め、アフメド・ババを北への道まで生かし続けてください。'
      p2: '砂漠で病気になったり怪我をした親族を治療し、水を分け与え、世帯が遅れないようにする'
      p3: '兵士たちが本を奪う前に、図書館の箱をいくつか取っておき、町の家族に隠しておいてください'
    points_fail:
      p1: 'この支部では、彼は生きてトンブクトゥを離れず、マラケシュの伝記辞書とモロッコで書かれた29冊の本が失われています。'
      p2: '道路で倒れた人を誰も助けてくれなかったし、この支流でも家族の北への旅はこれまでと同じくらい大変だった。'
      p3: '彼の本はすべて取り上げられ、14 年後に彼がトンブクトゥに戻ったとき、この支部には自分の本は一冊も残されていませんでした。'
    shift:
      p1:
        was: '1594年、アフマド・ババはスルタンに反逆した罪で起訴され、マラケシュに連行された。 1608年に彼はトンブクトゥへの帰国を許された。'
      p2:
        was: '1594年、アフマド・ババの家族は彼とともにサハラ砂漠を越えて北へ行進しました。'
        now: '彼と一緒に旅をした親族たちは、苦しみが少し和らぎながらマラケシュに到着した。'
