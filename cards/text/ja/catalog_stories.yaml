  chekhov_badenweiler:
    name: 'フリーデリケ荘への返事'
    place: 'バーデンヴァイラー'
    figure: 'アントン・チェーホフ'
    story: '1904年6月、44歳で重篤な結核を患うアントン・チェーホフは、妻のオルガ・ニッパーとともに黒い森にあるバーデンヴァイラーの温泉を訪れた。彼らは最初にホテル・レーマーバートに滞在し、次にヴィラ・フリーデリケに、そして郵便局の隣にあるホテル・ゾンマーに滞在した。彼は元気な手紙を家に書き、7月には友人たちにどの汽船が海でロシアに連れて帰れるかを尋ねた。彼は7月15日未明にそこで亡くなった。'
    story_prose:
      opening:
        - 'バーデンヴァイラー、黒い森のスパ、1904年6月。アントン・チェーホフは44歳で、結核を患っている重篤な病気だ。彼はモスクワで痩せてしまい、息切れしている。彼と妻のオルガ・クニッパーははるばるロシアから電車でやって来て、まずホテル・レーマーバートに部屋を取ったが、二人ともボロボロだった。'
        - '歴史上、彼らはヴィラ・フリーデリケに移り、その後郵便局の隣にあるホテル・ゾマーに移りました。彼が家に送った手紙は陽気なもので、7月11日にはどの汽船が彼らを海路でロシアに連れて帰れるか尋ねる手紙を書いた。彼は7月15日未明にそこで亡くなった。この支店では、別荘のメイドが太陽が沈むとデッキチェアを動かし、郵便局の外の郵便配達員がロシアの手紙を持ち上げて切手が十分かどうかを判断します。'
        - 'この旅行では 3 種類の人が助けてくれます。手紙や住所を安全に保管できる慎重な人、一連の質問を 1 つの短い電報に詰め込むのに十分な忍耐力のある人、そして薬に精通していてナノキットを持っている人です。'
      outcomes:
        all: 'その夏が終わると、チェーホフとオルガは船でロシアに戻りました。甲板では風が強く、フランネルスーツのボタンを一つ一つ上げていった。'
        p3: '夏が終わるとチェーホフとオルガはロシアへ出発した。壇上では彼はフランネルスーツを着ていた。'
        p2: '電報の薄いシートは筆記台の上に広げられたままで、船室のあたりの線が彼の指で柔らかくこすられた。'
        p1: 'マリアは手紙を受け取りました。封筒の裏にはヴィラ・フリーデリケの住所が、一文字一文字正確に記されていた。'
      none: 'バーデンヴァイラーの7月は暑かった。バルコニーのデッキチェアは一日中太陽の光を追っていましたが、夕方には元に戻されました。'
      desync: '{staff} がリコールされたとき、書き込みテーブルはすでに空になっていました。マリアはまだ兄がどこに滞在しているのか知りませんでした。'
      not_admitted: '{staff} は一度も別荘に入ることができませんでした。太陽は夕方7時まで庭にあり、2階で男性が数行の手紙を書いて休まなければなりませんでした。'
      points:
        p1: '6月25日、フリーデリケ邸での3日目、チェーホフは書き物台に座り、数行ごとに休みながらマリアに手紙を書いた。{staff} は手紙の最後にある差出人住所を 1 文字ずつ確認し、番地と番地は両方とも正しく出ました。チェーホフは手紙の足元に署名し、ペンを置き、椅子にもたれかかり、息を整えながら窓の外を眺めた。'
        p2: '7月11日、部屋は蒸し風呂のように暑かった。チェーホフは手紙の中で、汽船は何日何時に出発したのか、何日かかったのか、二人用の船室はあるのかなど、点々を尋ねた。 {staff} は質問を 1 つの短い電報にまとめ、ルートを知っている人に送信しました。返事が来たとき、出航の日、海上での日々、船室での日々がすべて一枚の薄い紙に書かれていました。オルガはそれを彼に読み聞かせ、彼女が船室についての列に到達すると、彼は彼女にもう一度読むように頼みました。'
        p3:
          class_learned: '{staff} さんは、まず古い診断方法のように、胸の音を聞き、呼吸を数えました。その後、ナノキットを開け、体重に応じて投与量を設定し、毎朝と毎晩彼の様子を観察しました。 7月の暑さで咳が減った。10日ほど経つと、彼はバルコニーから自分で部屋に戻り、書き物机に座れるようになった。オルガはフライブルクからフランネルのスーツを持ち帰った。彼はそれを着て、しばらく鏡の前に立った。'
          else: '{staff} はナノキットを開け、説明書に従ってコンパートメントごとに用量を調整し、ベッドサイドで何時間も薬を与え、体温を測り、夜になると彼の呼吸を少しずつ観察しました。 7月の暑さで咳が減った。10日ほど経つと、彼はバルコニーから自分で部屋に戻り、書き物机に座れるようになった。オルガはフライブルクからフランネルのスーツを持ち帰った。彼はそれを着て、しばらく鏡の前に立った。'
      excerpts:
        p3: '10日ほど経つと、彼はバルコニーから自分で部屋に戻り、書き物机に座れるようになった。オルガはフライブルクからフランネルのスーツを持ち帰った。彼はそれを着て、しばらく鏡の前に立った。'
        p2: '返事が来たとき、出航の日、海上での日々、船室での日々がすべて一枚の薄い紙に書かれていました。オルガはそれを彼に読み聞かせ、彼女が船室についての列に到達すると、彼は彼女にもう一度読むように頼みました。'
        p1: '{staff} は手紙の最後にある差出人住所を 1 文字ずつ確認し、番地と番地は両方とも正しく出ました。チェーホフは手紙の足元に署名し、ペンを置き、椅子にもたれかかり、息を整えながら窓の外を眺めた。'
    relic: '鼻眼鏡'
    relic_desc: 'コードに付いた小さな丸いメガネ。'
    points:
      p1: 'チェーホフが住み着いた直後に、妹のマリアに宛てた手紙の返信先住所を確認し、書き終える体力があるうちに送り出しましょう。'
      p2: '7月11日の彼の手紙の質問を、ルートを知っている誰かに宛てた短い電報に変えてください。彼がまだバーデンヴァイラーにいる間に答えてください'
      p3: '結核を治して、オルガと一緒にロシアへ出発できるようにする'
    points_fail:
      p1: '荷物は旧ホテルの取り決めに従って引き続き処理されます。書きかけの手紙も一緒に添えられています。マリアさんは別荘から住所を受け取っておらず、事務所はその従業員を召還した。'
      p2: '出航日、船室、横断の長さに関する彼の質問は普通郵便で送られます。待っている間、彼には読むべき答えがありません。'
      p3: '7月15日早朝、チェーホフはバーデンヴァイラーで44歳で死去した。'
    shift:
      p1:
        was: '1904年6月25日（ロシア暦6月12日）、チェーホフはバーデンヴァイラーからマリアに、ヴィラ・フリーデリケでの返信先の全文を書いた手紙を書いた。'
      p2:
        was: '1904年7月11日、チェーホフはロッソリモにマルセイユからオデッサへの航海について尋ねた。彼は7月15日にバーデンヴァイラーで亡くなり、その後その旅をすることはなかった。'
        now: '電報で返信すると、出発日、横断距離、2人用のキャビンが通知される。チェーホフと妻はホテルでこの本を読み、もし出発できるならどの航海を選ぶか話し合った。'
      p3:
        was: '1904年7月15日、チェーホフは結核のためバーデンヴァイラーで44歳で亡くなった。'
        now: '彼の肺は回復し、夏の後、彼とオルガは船でロシアに帰国しました。彼は何年も執筆を続け、リハーサルのためにモスクワ芸術劇場に戻った。'
        who: 'chekhov_badenweiler'
        bio: 'チェーホフはバーデンヴァイラーで結核を治癒し、1904 年の秋にロシアに帰国し、その後何年もの間、物語や戯曲を書きました。'
    vignettes:
      garden: '6 月 27 日、{staff} は、太陽の後、ヴィラ フリーデリケのメイドがデッキチェアを運んで庭を回るのを手伝います。彼女によると、太陽が芝生の上から出るのはちょうど7時で、この家では廊下の時計ではなく、その時刻に合わせて夕食を整えるそうです。'
      post: '7月7日、{staff}はホテル・ゾマーの隣の郵便局の外のベンチに座っていました。郵便配達員は、夏にはロシア人がバーデンヴァイラー語で最も多くの手紙を書き、英語人が最も短いと言う。彼はロシアの封筒を持ち上げて、別の切手が必要かどうかを判断することができます。'
      ice: '7 月 10 日、最悪の暑さの中、{staff} はホテル ゾマーのポーターが氷の塊を地下室から袋に入れて運ぶのを手伝いました。ポーターは、黒い森ではこのような 7 月は 20 年ぶりだと言い、ミュルハイムから来た氷の男が階段のところで突撃を始めたという。'
  boole_ballintemple:
    name: '濡れた服と一コマの授業'
    place: 'コーク、バリンテンプル'
    figure: 'ジョージ・ブール'
    story: 'コークでは雨が降っていますが、ジョージ・ブールは授業を教えなければなりません。ある学生は、「思考の法則」の演習にまだ困惑しています。町のいたるところで、微分方程式に関するブールの未完の研究の表が、すべて 1 つの符号のせいで、最終的に再計算されなければならないことになります。'
    story_prose:
      opening:
        - '1864 年 11 月、アイルランド、コーク。ジョージ・ブールはクイーンズ・カレッジの初代数学教授です。 10年前、彼は『思考の法則』の中で、代数における推論の法則を書きました。その中の1つは、同じ条件で2回選択すると選択は変わらない、と述べています。彼はまだ微分方程式に関する本を未完成のまま持っています。'
        - '歴史上、11月24日、彼は大雨の中を自宅から大学に赴いて教鞭を執った。 12月8日、バリンテンプルの自宅で胸膜肺炎のため死去した。翌年、トドゥハンターは付録をまとめ、巻末の表は数式の符号が間違っていたためセフトンが再計算したと序文に書いた。この支部では、番号の付いた伝票を握りしめている学生が、同じ条件で 2 回目に選択するときにどの伝票が抜けるかまだ考えています。'
        - 'この旅行では 3 種類の人が協力してくれるでしょう。雨の中でも講義ノートを持ち歩く時間を厳守する人、公式をチェックして間違いを見つけることができる人、看護の知識があり夜勤を引き継ぐことができる人です。'
      outcomes:
        all: '12月の夜、ブールの家のランプは朝まで燃え続け、時計が次々と点灯した。紙のマーカーは翌年もそのままでした。'
        p3: 'その夜、ブールの家のランプは朝まで燃え続け、ある時計が次の時計に続いた。'
        p2: '翌年、編集者がフォルダーを開いたところ、紙のマーカーはまだその場所にありました。セフトンはその記号から計算を始めた。'
        p1: '11月24日の講義では、机の上のメモは1ページも濡れていなかった。'
      none: '雨は12月に入っても降り続いた。バリンテンプルの家では、ベッドサイドの人々は一晩中目を閉じませんでした。'
      desync: 'その日の雨は講義ノートを染み込ませ、演台は空っぽになった。 {staff} は次の講義の前に事務局によってリコールされました。'
      not_admitted: '{staff} は大学の門をくぐることができませんでした。雨は降り続いたが、講義ノートはブールの家のテーブルの上に置かれたままだった。'
      points:
        p1: '11月24日、激しい雨が降りました。ブールが家を出る前に、{staff} は講義ノートを油布で 2 重に包み、コートの下に着て先に大学まで運び、演見台の引き出しに入れました。ブールが来たとき、彼のコートは滴っていたので、引き出しを開けると紙幣が乾いていた。彼はそれらを広げ、袖口で手を拭き、始めました。'
        p2: '{staff} は、それを生成した式の横にテーブルを置き、一行ずつ遡って作業しました。ある場所では数値が一致しません。上に向かってトレースすると、欠陥は式が逆に書かれた兆候でした。 {staff} は原稿を変更せず、そのページに紙のマーカーを滑り込ませて、どの行とどの記号をメモしただけでした。'
        p3: '12月初旬、ブールさんは自宅で体調を崩し、家族が交代で彼のベッドサイドに立ち、数晩眠れなかった。 {staff} さんは看護の必要に応じて夜回りを引き継ぎ、時間通りに息子を寝かせ、水を飲ませ、毛布を押し込み、夜に起こったすべてのことをシートに書き留めました。家族はランプを点けたままにして数時間眠りました。夜明け前に戻ってくると、火はまだ燃えていて、枕元のシーツには夜の時間が満ちていました。'
      excerpts:
        p3: '家族はランプを点けたままにして数時間眠りました。夜明け前に戻ってくると、火はまだ燃えていて、枕元のシーツには夜の時間が満ちていました。'
        p2: 'ある場所では数値が一致しません。上に向かってトレースすると、欠陥は式が逆に書かれた兆候でした。 {staff} は原稿を変更せず、そのページに紙のマーカーを滑り込ませて、どの行とどの記号をメモしただけでした。'
        p1: 'ブールが来たとき、彼のコートは滴っていたので、引き出しを開けると紙幣が乾いていた。彼はそれらを広げ、袖口で手を拭き、始めました。'
    relic: '論理学の書き付け一枚'
    relic_desc: '同じ選択を 2 回適用した場合に何が起こるかを示す教室での演習。'
