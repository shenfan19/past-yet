      p2: '演奏者は自分のパートを個別にマークするため、リハーサルの問題が作曲家にレビューのために届くことはありません。'
      p3: 'シーズンが終わったらリピートです。ベートーベンが望んでいた復帰をするには空席が多すぎる。'
    shift:
