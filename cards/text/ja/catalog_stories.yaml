    relic: '手書きの歌集'
    relic_desc: '彼自身の手には小さな歌の本があった。'
    points:
      p1: 'レセプションが解散したら、彼の返答が不快だったゲストを呼び戻し、彼とその多くが彼の友人である人々に話し合ってもらいます。'
    points_fail:
