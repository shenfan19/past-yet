catalog:
  sun_yat_sen_guangzhou:
    name: "銅像から新しい大学へ"
    place: "広州"
    figure: "孫文"
    story: "中山大学の孫文像の前から、1924年2月4日の広州へと時をさかのぼる。この日、孫文は三つの学校を統合して国立広東大学を設立するよう命じ、鄒魯に準備を任せた。同じ時期の日曜日には高等師範学校の講堂で講演を行い、何人もの手を経た講演の記録は一冊の本になった。9月19日に授業が始まり、11月11日の創立式典では孫文が書いた校訓が使われた。孫文は1925年3月12日に北京で亡くなり、翌1926年、大学にはその名が冠された。"
    relic: "孫文の銅像"
    relic_desc: "中山大学のキャンパスに立つ銅像。1924年の広州への通り道だが、骨董品ではないので売却できない。"
    points:
      p1: "城外のどこに募集告知を貼るか道順を決め、届け役に渡す"
      p2: "紹介を受けて三校を回り、初会合までに困り事を一枚にまとめて届ける"
      p3: "候補地を見比べ、石牌に決まる前に比較図を届ける"
      p4: "三校の卒業名簿を照合し、6月21日の式典用に一冊にまとめて届ける"
      p5: "石牌へ向かう一行に加わり、新校地の境界杭を立てる"
    points_fail:
      p1: 'この分岐では告示は市内にしか貼られず、城外の学生が知ったときには出願がもう始まっていた。'
      p2: '第一回準備会議は史実どおりに開かれ、三校の困りごとはばらばらに語られたまま、まとめた一覧はなかった。'
      p3: '新キャンパスは史実どおり石牌に決まり、準備室の机には候補地をまとめた地図が一枚もなかった。'
      p4: '6月21日の卒業式は史実どおりに行われた。準備室では三校の名簿を別々に確認することになった。'
      p5: '石牌の校地は史実どおり紙の上で区切られただけで、境界の杭は一本も立たなかった。'
    shift:
      p1:
        was: '1924年6月9日、国立広東大学は各省の教育庁に学生募集を委託し、6月10日に予科試験の出願受付が始まった。募集予定は520人。'
        now: 'この分岐では、城外の辻や波止場にも募集の告示が貼られた。'
      p2:
        was: '1924年3月3日、第一回準備会議が開かれ、議題の最初は三校の学生の卒業問題だった。'
        now: 'この分岐では、会議の机に三校の困りごとをまとめた一覧が置かれた。'
      p3:
        was: '1924年、学校が各地に分散して管理しにくいため、孫文は鄒魯に石牌を新キャンパスに選ばせ、その年のうちに土地が区切られた。'
        now: 'この分岐では、選定の書類の横に、候補地と石牌をまとめて描いた地図が添えられた。'
      p4:
        was: '1924年6月21日、鄒魯が国立広東大学の校長に就任し、同じ日に旧三校の卒業式が行われた。'
        now: 'この分岐では、準備室は確認済みの統一名簿を使って式を進められた。'
      p5:
        was: '1924年、孫文は鄒魯に石牌を新キャンパスとして選ばせたが、新校舎の着工は1933年、最初の学院が移ったのは1934年秋だった。孫文は1925年3月12日に亡くなり、それを見ることはなかった。'
        now: 'この分岐では、11月に孫文が広州を離れる前に、石牌の校地の境界がもう一本ずつ立っていた。'
        who: sun_yat_sen_guangzhou
        bio: 'この時間線では、孫文が広州を離れる前に、新キャンパス石牌の境界が定まっていた。'
    shift_all: "五つの仕事はすべて片付いた。今になって孫文が後に記した校訓を読み返すと、あの仕事が「博学・審問・慎思・明辨・篤行」に重なって見える。"
    vignettes:
      slips: "架空の事務員が原稿を写そうとしている。貼り紙が二行を覆っている。貼り紙と原稿は誰が書いたのかとあなたが尋ねると、彼は貼り紙を動かさず、先に原稿を写す。"
      back_row: "架空の学生が席を見つけられず、何度も立ち上がって辺りを見回す。あなたが長椅子で少し詰めると、彼は黙って最後まで聞き、講堂から人が引いていくときにあなたにうなずく。"
      hundred: "あなたは手帳の最後のページに正の字を書き、一日ずつ数える。百日になったところで、架空の事務員が何を数えているのかと尋ねる。あなたは、日数だと答える。"
  lalibela_rock:
    name: "岩の水路の出口を探す"
    place: "エチオピア、ラリベラ"
    figure: "ラリベラ王と石工たち"
    story: "ザグウェ朝のラリベラ王は1181年から1221年まで在位した。その名を冠する町には岩を掘り下げて造った十一の教会と、溝や掘割、通路があり、王が造らせたと伝わる。教会ごとの年代ははっきりしない。1520年代にはポルトガルの司祭フランシスコ・アルヴァレスが使節団とともに訪れ、ヨーロッパで初めて詳しい記録を残した。1978年に世界遺産に登録された。"
    relic: "石工のたがね"
    relic_desc: "刃先を薄く研いだ鉄のたがね。"
    points:
      p1: "石工たちの仲間に入り、掘割から石くずを運び出す"
      p2: "雨季の前に水路を出口までたどり、水がたまる場所を示す"
      p3: "雨季に、溝を端から端までさらう作業を手伝う"
    vignettes:
      outlet: "{staff}は岩に刻まれた水路を曲がり角の先、外に開ける場所までたどり、石片を置いて印をつける。"
      rain: "{staff}は掘割で足首まで水につかり、日が暮れるまで泥を入れたかごを縁へ一つずつ渡す。"
      bend: "{staff}は掘割の曲がり角に印をつけた略図を描く。翌朝、手伝いの者が同じ場所を見つけられるように。"
  ife_bronzes:
    name: "鋳上がりに残す線"
    place: "ナイジェリア、イフェ"
    figure: "イフェの鋳物師たち"
    story: "ヨルバの都市イフェでは、およそ四世紀にわたって銅合金で写実的な頭像が作られた。多くは1300年ごろの作と見積もられている。1910年、ドイツ人レオ・フロベニウスは聖なる森の祭司に、自らオロクンの頭像と名づけた像を売るよう迫ったが、返還を余儀なくされた。1938年にはウンモニジェの敷地を掘っていた作業員が複数の頭像を見つけた。その一つが現在大英博物館にある。1948年のロンドンの展覧会では、イタリアやギリシャの名品にも比肩すると評された。"
    relic: "二枚の習作図"
    relic_desc: "無地の試し鋳物に見える線を見比べるための図。"
    points:
      p1: "鋳物師たちの仲間に入り、ろうで試しの原型を作る"
      p2: "鋳込みの日に、るつぼの下の火を絶やさない"
      p3: "鋳込み後、ろうに刻んだ線とあとから加わった線を見分ける"
    vignettes:
      line: "{staff}は仕上げ前の絵と今日の試作品を並べ、新しい傷を別の紙に描く。"
      surface: "{staff}は試作品の下の板を傾け、光を表面に走らせて、細い線の始まりを紙に記す。"
      edge: "{staff}は無地の試し鋳物を描き、その隣に今日だけ見えた一本を描く。次は記憶に頼らずに比べられる。"
  great_zimbabwe:
    name: "図面に残す通路"
    place: "ジンバブエ、マシンゴ"
    figure: "大ジンバブエの建設者たち"
    story: "大ジンバブエはショナの人々の祖先が築き、11世紀から15世紀にかけて栄えた。大囲壁には花崗岩を整然と積んだ長い曲線の壁があり、二つの壁に挟まれた狭い通路は円錐形の塔へと続く。1871年にドイツ人カール・マウフが遺跡にたどり着いた。1980年には国名がこの都市にちなむジンバブエとなり、1986年には遺跡が世界遺産に登録された。"
    relic: "通路の略図"
    relic_desc: "二つの壁の間を白く残した作業図。"
    points:
      p1: "壁を築く一団に加わり、次の段に合う大きさの石を選り分ける"
      p2: "二つの壁の間を歩き、通り道を白く残して描く"
      p3: "乾季に谷から丘の上の職人たちへ水を運ぶ"
    vignettes:
      lines: "{staff}は二本の線を引き、間は白いままにする。使い走りは壁ではなく白い部分をたどればよい。"
      width: "{staff}は内側の壁が途切れるところまで歩き、線を一周させずにそこで鉛筆を止める。"
      pace: "{staff}は石積み一段の長さを歩いて測り、壁の根元の平らな石に歩数を刻む。"
  euclid_alexandria:
    name: '『ポリスム』がまだあったころ'
    place: 'アレクサンドリア'
    figure: 'エウクレイデス'
    story: '紀元前300年ごろ、エウクレイデスはアレクサンドリアで全十三巻の『原論』を書き、定義と公準から幾何学の命題を一つずつ証明した。三巻の『ポリスム』や円錐曲線についての本なども書いたが、これらは後に失われた。西暦四世紀のパッポスはまだ『ポリスム』の内容を紹介し、命題の数を記録できた。'
    relic: '青銅のコンパス'
    relic_desc: '二本の脚と一つの軸で、本にあるどの図も描ける。'
    points:
      p1: '『ポリスム』三巻の写しを何部か作り、失われないよう弟子たちに渡す'
    points_fail:
      p1: '『ポリスム』の写本は一系統のままだった。この分岐でも書は失われ、パッポスの短い記述だけが残った。'
    shift:
      p1:
        was: '紀元前300年ごろ、エウクレイデスは三巻の『ポリスム』を書いた。書は後に失われ、171という命題の数と、四世紀のパッポスによる短い紹介だけが知られている。'
        now: '{staff}は『ポリスム』の写しを何部か作るのを手伝い、幾何学を学ぶ弟子たちに渡した。この分岐では、書は後世の読者に伝わった。'
        who: 'euclid_alexandria'
        bio: 'この分岐では『ポリスム』の写本が広く出回り、後の読者は『原論』以外の著作も読むことができた。'
    vignettes:
      lost: '写本師の机に『ポリスム』の巻物がある。後世の人はパッポスの数行から中身を想像するしかないと、{staff}は知っている。{staff}はしばらく巻物の端に手を置き、それから離した。'
      arcs: '{staff}は弟子たちにならい、杭と紐で砂盤に円を描く。二つの弧が交わり、三点目ができる。{staff}は砂をならして描き直した。二度目は手がぶれなかった。'
      papyrus: '{staff}はパピルス売りと一緒に束を岸へ運び、どの紙が港の湿気に強く、どれが一年で脆くなるかを聞く。'
    story_prose:
      opening:
        - '紀元前300年ごろ、アレクサンドリア。エウクレイデスはここで全十三巻の『原論』を書き、定義と公準から出発して幾何学の命題を一つずつ証明した。第一巻の最初の命題では、二つの円だけで、与えられた線分の上に正三角形を作る。ほかにも三巻の『ポリスム』や円錐曲線についての本を書いた。'
        - '史実では、『ポリスム』は後に失われた。西暦320年ごろ、パッポスはまだその内容を紹介でき、定理が171、補題が38あると記した。それ以降の写本は知られていない。この分岐では、砂盤に図を描く弟子が一人いて、波止場のパピルス売りはどの紙が湿気に強いかを知っている。'
        - '写本を作り、校合し、保管できる人が力になれる。弟子たちに幾何学を教えられる人や、一行ずつ確かめる根気と知識を持つ人にも出番がある。'
      outcomes:
        all: '後の世の読者の棚には、『原論』の隣に『ポリスム』の三巻が並んだ。何度も手に取られて、巻物の縁は柔らかくなっている。'
        p1: '後の世の読者の棚には、『原論』の隣に『ポリスム』の三巻が並んだ。何度も手に取られて、巻物の縁は柔らかくなっている。'
      none: '砂盤をならして、新しい円を描く。パッポスの後、あの三巻を開く者はいなかった。'
      not_admitted: '{staff}は写本を作る部屋に入れなかった。波止場では、パピルス売りがまだ紙の束を岸へ運んでいる。'
      points:
        p1:
          class_teaching: '教えるときと同じように、{staff}は『ポリスム』三巻を砂盤のそばの熱心な弟子たちに分け、写しを互いに読み上げさせて、字も図も一つずつ照らし合わせた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
          class_lettered: '写本工房の手順で、{staff}はパピルスを裁ち、『ポリスム』を一巻ずつ写して、字も図も原本と照らし合わせた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
          else: '{staff}は『ポリスム』を書き写す手元を見守った。一巻仕上がるたびに原本と写しを並べ、図を順に確かめた。写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
      excerpts:
        p1: '写本を巻いて細い紐で結び、幾何学を学ぶ弟子たちの手に渡した。エウクレイデスは一巻の紐をほどいて最初の一枚を見、それから元どおりに結んだ。'
  socrates_athens:
    name: '船が戻るまで'
    place: 'アテナイ'
    figure: 'ソクラテス'
    story: '紀元前399年、ソクラテスはアテナイで裁かれ、死刑を宣告された。アテナイが毎年デロス島に送る船は出たばかりで、戻るまでは刑を執行できなかった。彼は牢で約三十日を過ごし、イソップの寓話を詩にした。友人たちは毎日見舞いに来た。最後の日も病気のプラトンを除いて全員が集まり、夕方、彼は毒杯を飲んだ。'
    relic: '市場の陶杯'
    relic_desc: '黒い釉薬がかかったアテナイの杯。縁が少し欠けている。'
    points:
      p1: '陪審席が騒がしくなっても、ソクラテスが弁明を終えられるよう場を静める'
      p2: 'イソップの寓話の詩とアポロンへの賛歌の完成を手伝い、写しを牢の外に届ける'
      p3: '最後の日までにプラトンを治療し、牢で師に付き添えるようにする'
    points_fail:
      p1: '騒ぎで弁明がかき消され、最後まで話せなかった。分岐の同期が外れ、事務所は職員を呼び戻す。'
      p2: '史実と同じく、この分岐にも詩は残らなかった。'
      p3: '史実と同じくプラトンはその日も病気で、師のもとへは来られなかった。'
    shift:
      p1:
        was: '紀元前399年。ソクラテスはアテナイで裁判にかけられた。プラトンの『ソクラテスの弁明』では、陪審員に何度も騒がないよう求める。裁判は有罪となり、死刑が宣告された。'
      p2:
        was: '紀元前399年。ソクラテスは執行を待つ間、繰り返し見る夢に従ってイソップの寓話を詩にし、アポロンへの賛歌を作った。いずれも完全な形では残っていない。'
        now: '友人が詩を書き写した巻物を牢から持ち出し、アテナイに残した。'
      p3:
        was: '紀元前399年。ソクラテスが牢で毒杯を飲んだ日、友人たちはその場にいた。プラトンは病気で来なかった。'
        now: 'プラトンは回復し、友人たちと牢で最後まで付き添った。'
        who: 'plato_academy'
        bio: 'この分岐では、プラトンは病気から回復し、ソクラテスの最後の日を牢で共に過ごした。'
    vignettes:
      rumours: '裁判の前日、{staff}は広場の三つの屋台で老人の罪状を尋ね、三通りの答えを聞いた。{staff}はすべて書き留め、どれが法廷で読み上げられるか待った。'
      harbour: '毎夕、{staff}はペイライエウスの港へ下りて魚屋にデロス島の船が戻ったか尋ねる。答えはいつも同じで、{staff}は帰りを待つべきか、遅れを願うべきか分からない。'
      gate: '{staff}は牢の塀際で灯油を売る女のために水を運び、代わりに塀の下に座る場所をもらった。見舞い客は毎日夜明けから門で待つので、{staff}はその顔を見覚えた。'
    story_prose:
      opening:
        - '紀元前399年、アテナイ。ソクラテスは不敬と若者を堕落させた罪に問われ、陪審の前に立つ。生涯にわたり道や広場で人々に問いかけたが、自らは一冊も書き残さなかった。後世の人は、プラトンとクセノポンの著作を通して彼を知る。'
        - '史実では、デロス島へ向かう船が裁判の前日に出た。船が戻るまで刑の執行が禁じられていたため、ソクラテスは牢でさらに三十日ほど待った。繰り返し見る夢に従い、そこでイソップの寓話を詩にしたが、詩は後世に伝わらなかった。最後の日には友人たちがそろい、病気のプラトンだけが来なかった。この分岐では、牢の塀際で灯油を売る女がいて、ペイライエウスの魚屋には港へ入る船が一隻残らず見える。'
        - '騒ぎ出した人々を落ち着かせる人、詩句を聞き取って巻物に写せる人、薬を知り病人を診られる人に出番がある。'
      outcomes:
        all: 'デロス島から船が戻り、魚屋は遠くからその帆を見つけた。最後の夕べ、牢は友人たちでいっぱいで、プラトンもその中に座っている。詩の巻物はその後も、アテナイのある家の長持の底に収まっていた。'
        p3: '最後の夕べ、牢は友人たちでいっぱいだった。プラトンもその中に、最後まで座っていた。'
        p2: '詩の巻物は、アテナイのある家の長持の底で年月を過ごした。パピルスの縁が毛羽立っている。'
        p1: '三十日後、デロス島からの船がペイライエウスに入り、魚屋は遠くから帆を見つけた。その日、友人たちは夜明けから牢の戸口で待っていた。'
      none: 'デロス島から船が戻り、魚屋は遠くからその帆を見つけた。夕方、牢では友人たちが輪になって座った。口を開く者はいなかった。'
      desync: '法廷のざわめきが大きくなり、弁明は言葉の途中で途切れた。{staff}は法廷を出る前に事務所へ呼び戻された。'
      not_admitted: '{staff}はアテナイに居場所を得られず、牢の塀際で一息つける場所さえなかった。デロス島の船はまだ海の上にいる。'
      points:
        p1: '裁判の日、木の腰掛けは何列も陪審員で埋まっていた。ソクラテスが話すたび、怒号が声をかき消す。{staff}は傍聴席から立ち上がり、声を張らずに両手をゆっくり下げ、一列ずつ見渡して、静まるのを待って腰を下ろした。ソクラテスは途切れた言葉の先を語った。話し終えると外套の裾をたぐり、演壇に静かに立った。'
        p2: '牢に光を通すのは高いところの小窓だけだった。ソクラテスが一行読むと、{staff}が蝋板に刻んで拍子を取って読み返し、一拍多ければ蝋をならして書き直した。イソップの寓話が一つずつ詩になり、最後にアポロンへの賛歌が続いた。夜、{staff}は壁際の灯火で、蝋板の文字をパピルスの巻物に写した。翌朝早く、見舞いに来た友人がそれを懐に入れ、胸に手を当てたまま牢の門を出た。'
        p3:
          class_medical: '最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}は医師の手順で診察し、薬を調えて決まった時刻に飲ませ、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。'
          else: '最後の日の前夜、プラトンはまだ病床から起き上がれなかった。{staff}はナノ救急箱を開け、説明に従って処置し、一晩じゅう枕元を離れなかった。明けきらぬうちに、彼は自分で身を起こし、暗がりで履物の紐を結んだ。外套を羽織って牢へ急ぐ友人たちと外に出ると、誰よりも足が速かった。'
