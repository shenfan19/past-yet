        was: 'ボルツマンが 1906 年 9 月 5 日に亡くなったとき、多くの物理学者や化学者はまだ原子が実在するかどうかを疑っていました。 1908 年以降、ブラウン運動に関するペリンの実験により、アインシュタインの 1905 年の予測が確認され、原子は一般に受け入れられるようになりました。'
