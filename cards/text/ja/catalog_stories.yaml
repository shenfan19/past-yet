  leeuwenhoek_delft:
    name: '一滴の水の中の世界'
    place: 'デルフト'
    figure: 'アントニ・ファン・レーウェンフック'
    story: '1676 年 10 月、レーウェンフックはデルフトから、一滴のコショウ水に数千匹の小動物が含まれていると書いています。ロンドンの王立協会は、彼の観察をどのように検証できるか尋ねた。 1677 年の 5 月から 8 月にかけて、デルフトとその周辺で 8 人の目撃者が彼のレンズを覗き、その観察を文書にまとめました。彼は10月5日に声明をロンドンに送った。ロバート・フックは後に協会の会員たちに小動物を見せた。'
    story_prose:
      opening:
        - 'デルフトでは、レーウェンフックが最初の訪問者に真鍮のプレートを手渡します。訪問者は片目を閉じても何も見えません。もう一人はすでにペンを持って、彼の言うことを聞くのを待っています。'
        - '1676 年、レーウェンフックはロンドンに水の中の小さな動物について説明しました。デルフトの8人の証人が翌年にかけて証言に署名し、彼らの証言は10月5日の彼の手紙に添付された。最初の 2 人の証人をレンズの前に留めておき、秋の郵便物が届く前に囲いをチェックすることができます。'
        - 'レンズに向かって別の観察者を案内できる人を派遣してください。秋には、すべての署名を封筒と照らし合わせてチェックできる人が必要になります。'
      points:
        p1: '最初の目撃者はプレートを回転させ、光のパッチを失います。レーウェンフックは、再び現れるまで目を後ろに動かすように彼に頼みます。男は小さなものがどのように動くかを書きます。他の証人が自分で見て書けるまで、シートを裏返します。両方が終わって初めて、彼らはシートを交換し、2つの説明を見て微笑みます。'
        p2: '10月の封筒にはすでに手紙が入っています。あなたは遅れて提出された声明をテーブルから持ち上げ、シートを順番にチェックする前にレーウェンフックに連名を読み上げさせます。姓はあなたが期待する隅にありません。姓が登録リストに追加される前に、フォールドが解除される必要があります。'
      outcomes:
        all: '声明はデルフトに手紙を残して去ります。読者は各アカウントを署名済みシートまで追跡できます。フックさんはロンドンにいる他の人たちにも小さな動物を見せる予定だ。'
        p1: '最初の 2 人の証人は自身の所見を書き留めた。その後、10月のメールから同封物が紛失しました。'
        p2: 'テーブルの上のばらけた紙は処理されます。最も古い署名済みアカウントが失われており、パケットは過去のものと一致しなくなりました。'
      none: 'レンズは元の位置に立っています。訪問者が見た後に署名された証拠が残ることはありません。'
      not_admitted: 'あなたの名前が予定にありません。見習いは真鍮のプレートを中に取り込み、ドアを閉めます。'
      desync: '最も初期の署名または 10 月の封入物がありません。証言は食い違っており、事務所は旅行者を召還した。'
      excerpts:
        p1: '他の証人が自分で見て書けるまで、シートを裏返します。両方が終わって初めて、彼らはシートを交換し、2つの説明を見て微笑みます。'
        p2: '姓はあなたが期待する隅にありません。姓が登録リストに追加される前に、フォールドが解除される必要があります。'
    relic: '小さな真鍮のレンズプレート'
    relic_desc: '非常に小さく、非常に透明なレンズを 1 つ保持する親指サイズのプレート。'
    points:
      p1: '最初の目撃者にレンズを見つめる時間を与え、それぞれが見た動きを自分の言葉で語ってもらいます'
      p2: 'デルフトでの 10 月のパケットを確認します。手紙がロンドンに向けて出発する前に、目撃者とのあいまいな陳述を照合する'
    points_fail:
