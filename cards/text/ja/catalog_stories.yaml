        p3: '10 月 5 日の夜、鉄格子の部屋で 1 つのランプが非常に低く燃えています。ポーは壁に向かって話し、座って、また横になり、唇に当てた水に触れようとしません。 {staff} は医学に詳しい人で、時々ベッドのそばに座って脈拍を測り、静かになるといつもカップの縁を口に持ってきて少しずつ飲んでいます。夜明けに向かってポーは眠りにつく。数日後の朝、彼は一人で起き上がり、水を一杯要求し、それを自分で持って飲み、そのカップを窓辺に戻しました。'
