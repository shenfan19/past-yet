        now: '{staff} は帰宅途中のクララに会い、そのまま部屋に連れて行きます。彼女はロバートが死ぬ前に彼の手を取った。'
        who: 'schumann_endenich'
        bio: 'エンデニヒでは、1856 年 7 月 29 日にロバートが亡くなったとき、クララはロバートの隣にいました。'
    vignettes:
