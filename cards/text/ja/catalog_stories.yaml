    relic: '真珠のイヤリング'
    relic_desc: '彼がよく描いた種類の小さな真珠。'
    points:
      p1: '債権者に借金の代わりに取られないよう、年末までに『The Art of Painting』をスタジオに保管してください'
      p2: '戦後から手元に残っていた絵画の一部を売るのを手伝い、家計の借金を軽減する'
      p3: '彼の絵は記憶に残るだろうということを彼に伝えてください'
      p4: '12月中旬までに彼を癒して生かしてください'
    points_fail:
      p1: '絵画芸術は年末に債権者の手に渡り、2月にはカタリーナさんには母親に渡す絵がなくなった。この支部は歴史から外れ、事務所はその従業員を召還した。'
      p2: '絵は彼の手元に残り、一枚も売れませんでした。この分岐では、世帯の借金が日に日に増え続けていました。'
      p3: 'これらの絵がどうなるのか、彼にはまったく分かりませんでした。この分岐では、2世紀後に人々がそれらを1つずつ追跡することになるとは誰も彼に言いませんでした。'
      p4: '12月は歴史上そうであったように過ぎ、1日半以内に彼は健康な状態から死亡した。この分岐では、カタリーナさんは 11 人の子供たちとともに依然として孤独に借金と向き合っていました。'
    shift:
      p1:
        was: '1676 年 2 月 24 日、カタリーナ ボルンズは債権者を満足させるために売却されないよう、『絵画芸術』を母親のマリア シンズに渡しました。フェルメールは、たとえ借金をしてでもそれを売ったことがありませんでした。'
      p2:
        was: '1672 年の戦争以来、フェルメールは自分の芸術を売ることができず、彼が扱った他の巨匠の絵画を手元に残したままになりました。カタリーナは後にこれが家の借金の原因であると述べた。'
        now: '同年12月にいくつかの絵画に買い手が見つかり、パン代やその他の借金の増加はしばらく止まった。'
      p3:
        was: '1675 年の死後、フェルメールは 2 世紀近くほとんど忘れ去られていました。 1860 年代になって初めて、トレ＝ビュルガーの研究によって彼の研究が再び注目されるようになりました。'
        now: '誰かが彼に、これらの静かな部屋はいつか探し出され、写真ごとに追跡されるだろうと語った。'
      p4:
        was: '1675 年 12 月、カタリーナは後に、借金と子供たちの重みで、健康な状態から 1 日半以内に死亡したと書いています。彼は12月15日に43歳でデルフトに埋葬された。'
        now: '{staff} はその 12 月まで彼と一緒に過ごしましたが、その日が来ることはありませんでした。彼はデルフトのアトリエに戻り、さらに数年間絵を描きましたが、カタリーナと11人の子供たちはその冬も彼を失いませんでした。'
        who: 'vermeer_delft'
        bio: 'この路線では、フェルメールは 1675 年 12 月まで生き、さらに数年間デルフトで絵を描き、家族の借金を乗り越えました。'
    vignettes:
      bread: '12 月 5 日、{staff} はパン屋の少年がランゲンダイク通りに沿って朝のパンを運ぶのを手伝います。あるドアで少年は給料も払わずにパンを渡し、小さな本に印を付けます。彼の主人は毎週土曜日にそのページについて不平を言い、毎週月曜日には同じようにパンを送ってくるという。'
      frames: '1 月、{staff} は午前中、フレーム メーカーの工場で、接着剤が固まるまで留め金具の角を保持しながら過ごしました。壁に面したフレームの半分は空です。額縁メーカーによると、フランス人は72人で来て以来、絵画ではなく鏡の額縁を買うそうで、少なくとも鏡に二重の代金を請求されることは決してないという。'
      peat: '2 月中旬、{staff} は泥炭売りが市場広場に濡れた芝生を積み上げるのを手伝います。彼女は指に息を吹きかけ、今は冬なのでデルフトではみんな安物を燃やしているので、町全体が火のそばで濡れた犬のような臭いがすると言います。'
  rembrandt_amsterdam:
    name: '息子を亡くした後'
    place: 'アムステルダム'
    figure: 'レンブラント・ファン・レイン'
    story: 'レンブラントの息子ティトゥスは、結婚式の半年後の1668年9月7日にアムステルダムに埋葬されました。 1669年3月にタイタスの娘ティティアが生まれました。この年、レンブラントは 1669 年の自画像を描きました。レンブラントは 1669 年 10 月 4 日に亡くなり、4 日後に借りた墓に埋葬されました。彼の最後の絵は未完成のまま残されました。タイタスの未亡人は10月21日に埋葬された。'
    story_prose:
      opening:
        - 'アムステルダム、1669年9月。『夜警』を描いた63歳の画家レンブラント・ファン・レインは1656年に破産し、借金を抱えてここで晩年を過ごしている。 1年前、彼の子供たちの中で唯一成長した息子のタイタスが、結婚式の半年後に埋葬された。 3月にタイタスの娘ティティアが生まれた。今年、彼は日付を記した自画像を数枚描き、最後の絵は今もイーゼルの上に置かれている。'
        - '歴史上、彼は10月4日に亡くなり、その4日後に借りた墓に埋葬されました。イーゼルに描かれた絵は未完成のまま残され、現在はストックホルムの国立美術館に所蔵されています。彼の2週間後、タイタスの未亡人も埋葬されました。この支店では、運河のそばで色塗りをする人、水辺で泥炭をかき集めるはしけの船頭、そして通りでガラガラを振る夜警がいます。'
        - 'この旅で手助けできるのは、ある種類の人です。筆を持ち、しっかりとした手を持っている人、または画家の目を持ち、より安定した手を持って、色を研ぎ、キャンバスを安定させている人です。'
      outcomes:
        all: '10月4日、レンブラントは63歳で死去した。絵はまだイーゼルの上に立っており、老人の手は前より数画進んでおり、パレットは脇に置かれ、色は乾いていました。'
        p1: '10月4日、レンブラントは63歳で死去した。絵はまだイーゼルの上に立っており、老人の手は前より数画進んでおり、パレットは脇に置かれ、色は乾いていました。'
      none: '10月4日、レンブラントは63歳で死去した。イーゼルの上の絵は彼の力が抜けたところで止まり、筆は瓶の中に立っており、その毛に含まれた絵の具はゆっくりと乾いた。'
      not_admitted: '{staff} は一度も家に入らず、運河沿いの色屋の塗装屋で数日間過ごしただけでした。かつて店は、運河の端にいる老画家のために鉛白の入ったポットを包装しましたが、誰もそれを取りに来ませんでした。午後中ずっとカウンターに座っていました。'
      points:
        p1:
          trait_artistic: '9月29日の朝、レンブラントはスタジオのイーゼルに座っており、手に持った筆は落ちるまで長い間ぶら下がっていた。絵の中では老人が両手に子供を抱いており、顔の光はまだ暗い。 {staff} は、画家のような目と確かな手で、求められた色を粉砕してパレット上に小さな山として並べ、キャンバスが切れるたびにフレームをしっかりと保持します。午後になって光が消える前に、老人の両手はあと数回撫でられる。レンブラントは筆を瓶に戻し、親指でキャンバスの端から絵の具を少しこすり落とします。'
          else: '9月29日の朝、レンブラントはスタジオのイーゼルに座っており、手に持った筆は落ちるまで長い間ぶら下がっていた。絵の中では老人が両手に子供を抱いており、顔の光はまだ暗い。 {staff} は筆を持ち、手先が安定しており、要求された色を粉砕してパレット上に小さな山として並べ、キャンバスが切れるたびにフレームをしっかりと保持します。午後になって光が消える前に、老人の両手はあと数回撫でられる。レンブラントは筆を瓶に戻し、親指でキャンバスの端から絵の具を少しこすり落とします。'
      excerpts:
        p1: '午後になって光が消える前に、老人の両手はあと数回撫でられる。レンブラントは筆を瓶に戻し、親指でキャンバスの端から絵の具を少しこすり落とします。'
    relic: '絵筆'
    relic_desc: '毛先の中で塗料が乾燥した、使い古されたブラシ。'
    points:
      p1: '最後の数週間、レンブラントが力尽きた場所に最後の絵が残されないように、絵をイーゼルに乗せてさらに運ぶのを手伝ってください。'
    points_fail:
      p1: '歴史が物語っているように、彼のイーゼルに描かれた最後の絵は未完成のまま彼のスタジオに残されました。'
    shift:
      p1:
        was: 'レンブラントは 1669 年 10 月 4 日にアムステルダムで亡くなりました。彼の最後の絵、イーゼルに描かれていた作品は未完成のまま残されました。'
        now: '{staff} は色を研ぎ澄まし、最後の数週間を通じてキャンバスを安定させました。イーゼルに描かれた絵は、10 月までに彼自身の手でさらに運ばれました。'
        who: 'rembrandt_amsterdam'
        bio: 'この路線で、レンブラントは 1669 年 9 月まで最後の作品に取り組み、歴史が残したものよりさらに先へ進めました。それは彼のスタジオから、彼の意図に近いものが出てきました。'
    vignettes:
      colours: '9月22日、{staff}はローゼングラハト沖にあるカラーマンの奥の部屋で午後を過ごし、両腕が痛むまで鉛白の板の上でマラーをひっくり返していた。色担当者は、最近の画家は皆クリームのように滑らかな白を望んでおり、彼らにクリームを売って彼らがそれに気づくかどうか試してみたいと考えていると語った。'
      barge: '9 月 26 日、{staff} は、はしけ船頭がローゼングラハトに沿って泥炭を積み込むのを手伝いました。この秋は水位が非常に低いため、橋ごとに底をこすり、石の名前を呼んで挨拶をし始めたという。'
      watchman: '11 月中旬、{staff} は夜警と一緒に濡れた道を歩きます。夜警はあらゆる角でガラガラを振り、時を告げます。今月の雨もガラガラ音に入り込み、咳のような音になったという。'
  gaudi_barcelona:
    name: '路面電車にはねられて'
    place: 'バルセロナ'
    figure: 'アントニ・ガウディ'
    story: '1926 年 6 月 7 日の夜、73 歳のアントニ ガウディはバルセロナのグランビアで路面電車にはねられました。書類も持たず、私服を着ていた彼は物乞いとみなされ、呼んだタクシーも停まらなかった。彼は6月10日に病院で亡くなり、6月12日に43年間指揮を執った建物の下に埋葬された。ドメネック・スグラニエスが作品の監督を引き継ぎました。 1936 年 7 月 20 日、作業場が放火され、図面と石膏模型のほとんどが失われました。'
    story_prose:
      opening:
        - 'バルセロナ、1926年5月下旬。カタルーニャ出身の建築家アントニ・ガウディ（73歳）は、市内にある未完成の偉大な建物に晩年を捧げた。彼のデザインは自然から得た曲線を使用しており、敷地内のワークショップには図面や石膏模型がたくさんあります。昨年、東ファサードの最初の鐘楼が完成しました。'
        - '歴史上、6月7日の夜、彼はグランビア通りで路面電車にはねられた。彼は書類を持っておらず、質素な服装をしていたので、物乞いだと思われ、横たわったまま放置されました。呼び寄せたタクシーは公務員が彼を診療所まで連れて行き、そこから病院に搬送されるまで止まらなかったが、そこで6月10日に亡くなった。彼の弟子であるドメネック・スグラニエスが作品の指揮を引き継ぎました。 10年後の1936年7月20日、工房は放火され、中にあった図面や石膏模型のほとんどが失われてしまいました。この支店では、グランビア通りの路面電車の車掌がベルを愛用しており、現場の若い石工が風に乗って鼻歌を歌い、正午に水を売りに来る女性がいます。'
        - 'この旅行では、数種類の人が助けてくれます。薬を知っていて応急処置セットを持っている人、親切で用心深くて丈夫な人、傷を治す道具を持っていて路面電車の線路からすぐに病院に連れて行ってくれる人です。大工として働いたり、アーカイブを保管したりしたことのある人、または進行中の仕事とワークショップの鍵を適切に引き渡すための器用で几帳面な人。そして、もう少し機知と意志を持った同じ種類の人物が、重要なモデルの写真、寸法、図面を二番目に置くようスグラニエスを説得しました。'
      outcomes:
        all: 'その夏、ガウディは工房に戻ってきました。 10年後、食器棚が燃え、誰かが2番目の場所からアルバムを持ち帰って、モデルの写真を裏返しました。裏にはその年のスケールが書かれていました。'
        p3: 'その夏、ガウディは工房に戻ってきました。彼はドアのそばの低い椅子に座って石工たちの仕事を眺めていたが、午後になると風が塔の開口部を通り抜けて口笛を吹いた。'
        p2: '6月12日、ガウディは埋葬されました。 10年後、作業場が燃え、誰かが2番目の場所からアルバムを持ち帰ったが、写真の裏にはその年の規模がまだ書かれていた。'
        p1: '6月12日、ガウディは埋葬されました。スグラニエスが工事の指揮を引き継ぎ、現場のハンマーの音が止まらず、石工たちはそのリストに従って建設を続けた。'
      none: '6月12日、ガウディは埋葬されました。 10年後の1936年7月20日、工房は放火され、戸棚にあった図面や石膏模型のほとんどが失われてしまいました。'
      desync: '6月10日、石工たちは午前中ずっと作業場の入り口で待っていました。誰が鍵を持っているのか誰も知りませんでしたし、どんな仕事が手元にあるのか誰も言うことができませんでした。 {staff} がリコールされたとき、若い石工はまだ設置されていない石の上に座って、誰かからの電話を待っていました。'
      not_admitted: '{staff} は現場には一度も入ったことはなく、グランビアの路面電車に数回乗っただけです。足場の遠く離れたところに鐘楼が建っており、風の強い午後にはかすかな汽笛の音がいくつかの通りに響き渡りました。'
      points:
        p3:
          class_medical: '6月7日の夜、バイレン通りとジローナ通りの間のグランビア通りで路面電車が急ブレーキを掛けた。着古した服を着た老人が線路のそばに横たわっている。数人が集まり、眺めて後ずさりする。医学に詳しい{staff}は、1分もしないうちに彼の隣にひざまずき、傷口を押さえて頭を動かさずに顔を上げ、周囲の人々に自分が誰であるかを告げようとした。これが現場の建築家、ガウディだ。一台のタクシーが到着します。車が発進するとき、{staff} は片手で頭を押さえ、もう一方の手でドアを押さえます。その後ろで路面電車がベルを一度鳴らし、ゆっくりと発車していきます。'
          trait_kind: '6月7日の夜、バイレン通りとジローナ通りの間のグランビア通りで路面電車が急ブレーキを掛けた。着古した服を着た老人が線路のそばに横たわっている。数人が集まり、眺めて後ずさりする。 {staff} は親切で、道に倒れている老人を放っておくことができず、1 分以内に彼の隣にひざまずき、頭をしっかりと保ち、顔を上げて周囲の人々に自分が誰であるかを伝えます。これは現場の建築家、ガウディです。一台のタクシーが到着します。車が発進するとき、{staff} は片手で頭を押さえ、もう一方の手でドアを押さえます。その後ろで路面電車がベルを一度鳴らし、ゆっくりと発車していきます。'
          trait_vigil: '6月7日の夜、バイレン通りとジローナ通りの間のグランビア通りで路面電車が急ブレーキを掛けた。着古した服を着た老人が線路のそばに横たわっている。数人が集まり、眺めて後ずさりする。交差点を見守っていた{staff}は、1分もしないうちに彼の横にひざまずき、頭をしっかりと固定し、顔を上げて周囲の人々に自分が誰であるかを告げました。これは現場の建築家、ガウディです。一台のタクシーが到着します。車が発進するとき、{staff} は片手で頭を押さえ、もう一方の手でドアを押さえます。その後ろで路面電車がベルを一度鳴らし、ゆっくりと発車していきます。'
          else: '6月7日の夜、バイレン通りとジローナ通りの間のグランビア通りで路面電車が急ブレーキを掛けた。着古した服を着た老人が線路のそばに横たわっている。数人が集まり、眺めて後ずさりする。ナノ医療キットを運ぶ{staff}は、1分もしないうちに彼の隣にひざまずき、指示に従ってそれを使用し、頭をしっかりと固定し、顔を上げて周囲の人々に自分が誰であるかを伝えました。これは現場の建築家、ガウディです。一台のタクシーが到着します。車が発進するとき、{staff} は片手で頭を押さえ、もう一方の手でドアを押さえます。その後ろで路面電車がベルを一度鳴らし、ゆっくりと発車していきます。'
        p1:
          class_lettered: '6月10日早朝、工房のモデルと図面はいつもの場所に置かれ、石工たちはドアの前に立ってガウディが戻ってきてその日の作業を承認するのを待っていた。誰が鍵を持っているか誰も知りません。事務処理に慣れている{staff}は、どの壁がどのコースに到達したか、どのモデルがどの図面に対応しているかなど、進行中の作業を項目ごとにリスト化し、そのリストをワークショップの鍵と一緒にスグラニエスに渡し、署名を求めます。スグラニエスはリストを折りたたんで鍵の上に手を閉じます。彼がドアに向かって歩き、石工たちにうなずくと、外で最初のハンマーが鳴りました。'
          class_craft: '6月10日早朝、工房のモデルと図面はいつもの場所に置かれ、石工たちはドアの前に立ってガウディが戻ってきてその日の作業を承認するのを待っていた。誰が鍵を持っているか誰も知りません。工具を使って作業した{staff}は、どの壁がどのコースに到達したか、どのモデルがどの図面に対応しているかなど、進行中の作業を項目ごとにリスト化し、そのリストをワークショップの鍵と一緒にSugranyesに渡し、署名を求めます。スグラニエスはリストを折りたたんで鍵の上に手を閉じます。彼がドアに向かって歩き、石工たちにうなずくと、外で最初のハンマーが鳴りました。'
          trait_methodical: '6月10日早朝、工房のモデルと図面はいつもの場所に置かれ、石工たちはドアの前に立ってガウディが戻ってきてその日の作業を承認するのを待っていた。誰が鍵を持っているか誰も知りません。 {staff}は几帳面で、どの壁がどのコースに到達したか、どのモデルがどの図面に対応しているかなど、進行中の作業を項目ごとにリスト化し、そのリストをワークショップの鍵と一緒にサグラニエスに渡し、署名するよう求めた。スグラニエスはリストを折りたたんで鍵の上に手を閉じます。彼がドアに向かって歩き、石工たちにうなずくと、外で最初のハンマーが鳴りました。'
          else: '6月10日早朝、工房のモデルと図面はいつもの場所に置かれ、石工たちはドアの前に立ってガウディが戻ってきてその日の作業を承認するのを待っていた。誰が鍵を持っているか誰も知りません。 {staff}は便利で、どの壁がどのコースに到達したか、どのモデルがどの図面に対応しているかなど、進行中の作業を項目ごとにリスト化し、そのリストをワークショップの鍵と一緒にSugranyesに渡し、署名するよう求めます。スグラニエスはリストを折りたたんで鍵の上に手を閉じます。彼がドアに向かって歩き、石工たちにうなずくと、外で最初のハンマーが鳴りました。'
        p2:
          class_lettered: '7月初旬、工房の食器棚には写真、図面、石膏模型が収められ、頭上には金庫室の吊り下げ模型が吊るされている。事務処理に慣れている{staff}は、主要なモデルを1つずつ測定し、各写真の裏にスケールを書き込み、図面をコピーしてもらい、Sugranyesに署名するためのリストを作成します。1枚はワークショップに保管され、もう1枚はアルバムと一緒に保管されます。Sugranyes はリストの末尾に署名し、ペンの蓋をします。彼が頭上に吊るされた模型を見上げると、紐についた小さな重りが揺れる。'
          class_craft: '7月初旬、工房の食器棚には写真、図面、石膏模型が収められ、頭上には金庫室の吊り下げ模型が吊るされている。工具を使って作業した{staff}は、主要なモデルを1つずつ測定し、各写真の裏にスケールを書き込み、図面をコピーさせ、Sugranyesに署名するためのリストを作成します。1枚はワークショップに保管され、もう1枚はアルバムに添えて2番目の場所に保管されます。Sugranyes はリストの末尾に署名し、ペンの蓋をします。彼が頭上に吊るされた模型を見上げると、紐についた小さな重りが揺れる。'
          trait_methodical: '7月初旬、工房の食器棚には写真、図面、石膏模型が収められ、頭上には金庫室の吊り下げ模型が吊るされている。几帳面で細部にこだわりを持つ{staff}は、主要なモデルを1つずつ測定し、各写真の裏にスケールを書き込み、図面をコピーさせ、Sugranyesに署名するためのリストを作成します。1枚はワークショップに保管され、もう1枚はアルバムと一緒に保管されます。Sugranyes はリストの末尾に署名し、ペンの蓋をします。彼が頭上に吊るされた模型を見上げると、紐についた小さな重りが揺れる。'
          else: '7月初旬、工房の食器棚には写真、図面、石膏模型が収められ、頭上には金庫室の吊り下げ模型が吊るされている。器用で細部にこだわる {staff} は、重要なモデルを 1 つずつ測定し、各写真の裏にスケールを書き込み、図面をコピーしてもらい、Sugranyes に署名してもらうためのリストを作成します。1 部はワークショップに保管され、もう 1 部はアルバムに添えて 2 番目の場所に保管されます。Sugranyes はリストの末尾に署名し、ペンの蓋をします。彼が頭上に吊るされた模型を見上げると、紐についた小さな重りが揺れる。'
