    relic: '図面の写し'
    relic_desc: 'ウォーデンクリフの計画図の写し。二つ折りになっていて、折り目の下に鉛筆で日付が書いてある。'
    points:
      p1: '9 月の入札が高くなったら、元の図面と修正された図面を別々にウォーデンクリフに登録して、その年に作業を開始できるようにします。'
      p2: 'まだ入札を待っているタワー工事とは別に、既に合意済みの実験室工事をホワイトリストに載せ、職長にそれぞれの工事について個別の説明を与えるようにしてください。'
      p3: 'テスラが次の基礎工事に向けた独自の取り組みを行い、確認されたコストを使用した段階的支払いを提案できるよう支援します。'
    points_fail:
      p1: '請負業者は古い図面から引用しており、誰も寸法を確認できません。今シーズンの仕事は中止され、事務所はその従業員を召還した。'
      p2: 'ある引用では、建物と塔が一緒くたにされています。後で乗組員は、どの部分がすでに許可されているかを確認できなくなります。'
      p3: 'どちらの作業も依然として同じラウンドの資金に依存しています。お金が足りなくなると、乗組員はどの仕事に報酬が支払われるのかわかりません。'
    shift:
      p1:
        was: 'テスラとスタンフォード ホワイトは 1901 年に入札と設計について話し合いました。その年にウォーデンクリフの建設が始まりました。'
      p2:
        was: 'ウォーデンクリフには研究室の建物と塔が含まれていました。通信には、デザインと予算の変更が記録されます。'
        now: '作業を開始する前に、職長は 2 つのアカウントを別々に決済することができます。新しいタワーの見積もりを以前の見積もりと比較して確認できます。'
      p3:
        was: 'モルガンは初期資金を提供した。その後資金が不足し、プロジェクトは当初の計画どおりには進みませんでした。'
        now: '書面による合意には、確認された範囲が含まれます。後で資金が不足した場合、サイトはその請求を決済し、まだ資金が不足している作業を明確に識別できます。'
        who: 'tesla_wardenclyffe'
        bio: 'テスラは、ウォーデンクリフを無線通信および電力システムの一部として構想しました。それを敷地に変えるには、入札、資金調達、建設スケジュールも必要でした。'
    vignettes:
      timber: '10月初旬、{staff}は、車輪が沈むたびに片側の肩をテールボードの下に置き、現場まで砂の道を上るカーターを手助けします。カーターさんによると、この道の向こう側にある農家は鶏をたたく音でタイミングを計り始めており、庭が静かな日に最もよく寝ているという。'
      signal: '12月中旬、紙を振りながら駅から少年がやって来た。マルコーニは海の向こうから信号を聞いたのだ。職長はページを腕を伸ばして持ち、ドットが本当にそこまで到達できるかどうか {staff} に尋ねます。 {staff}はそれができると言い、職長は紙をコートの中に折り込み、男たちにハンマーを打ち続けるように指示した。'
      watch: '12月下旬、{staff}は監視員と一緒に崖の上の板小屋で夜を明かし、海峡からの風に逆らって隙間に古新聞を詰めていた。監視員はそのうちの 1 人から石炭の価格を読み上げ、あれほど高い塔には喫水に耐える価値があるだろうと言いました。'
  schubert_vienna:
    name: '三月の演奏会のプログラム'
    place: 'ウィーン'
    figure: 'フランツ・シューベルト'
    story: '1828年3月26日、フランツ・シューベルトは生涯で一度だけ、ウィーンの楽友協会の部屋で自身の作品の公開コンサートを開催した。秋、すでに病気になっていた彼はヴィーデンにある兄フェルディナンドの新しいアパートに引っ越した。 10月2日、彼は最後の3曲のピアノ・ソナタを出版社プロブストに提供した。彼は11月19日にそのアパートで31歳で亡くなった。ソナタは 1839 年にのみ発表され、別の献呈が加えられました。'
    story_prose:
      opening:
        - 'ウィーン、1828年3月。31歳の作曲家フランツ・シューベルトは、交響曲や室内楽以外にも600曲以上の曲を書いているが、出版されたり広く演奏されたりする曲はほとんどない。今月、友人や演奏家の協力を得て、3月26日に彼は音楽フロインデ音楽院の部屋で自身の作品だけを集めたコンサートを開催する予定だ。'
        - '歴史上、これは彼が行った唯一のコンサートでした。秋までに彼は病気になり、9月にヴィーデンにある兄フェルディナンドの新しいアパートに引っ越した。 10月2日、彼はライプツィヒの出版社プロブストに、最後の3曲のピアノ・ソナタを自分が尊敬する作曲家に捧げるつもりだったが、プロブストはそれらに興味を示さなかったと手紙を書いた。 11月19日に彼は兄の家で亡くなった。ソナタは1839年にのみ発表され、ロベルト・シューマンに捧げられました。この支部には椅子を並べるポーターがいて、壁の外のワイン園にはバイオリン弾きがいて、ヴィーデンの新しい家には女将がいる。'
        - 'この旅では、数種類の人々が協力してくれるでしょう。音楽に精通していて、腕が確かな人、または几帳面な人、または強い意志を持って人々を集めて、急いで集まった演奏者とホールを同じ夜に集めることができる人です。非常に優秀な音楽家、またはソナタの送付を出版社との間で解決するために、アーカイブを保管したり、本の翻訳や販売を迅速かつ着実に行ってきた人。誰かがナノ医療キットを持ち、時代ができなかった病気を治すために。'
      outcomes:
        all: 'その11月、シューベルトは病気にならなかった。ライプツィヒから返事が来て、彼はそれを3つのソナタの原稿の中に保管し、その最初のページには彼が意図した人物の名前を記した。'
        p3: 'その11月、シューベルトは病気にならなかった。冬が来ると、ヴィーデンの部屋の窓の下に楽譜を書くための小さなテーブルが置かれ、その隅には新鮮な原稿用紙の山が重くのしかかっていた。'
        p2: '11月19日、シューベルトは兄の家で31歳で死去した。部屋を片づけると、フェルディナンドは引き出しからライプツィヒからの手紙を取り出し、3つのソナタの原稿と一緒に置きました。'
        p1: '11月19日、シューベルトは兄の家で31歳で死去した。 3月26日の夜への招待状は、後に友人の回想録に掲載された。'
      none: '11月19日、シューベルトはヴィーデンにある兄のアパートで31歳で死去した。フェルディナンドは 3 つのソナタの写本を保管していましたが、それらは 11 年間印刷されませんでした。'
      desync: '3月25日の夜、選手とフリーホールの日付はまだ異なっており、ポーターは26日と誰の名前が属するのか分からずにレジスターのページをめくった。 {staff} がリコールされたとき、ポーターは壁に立てかけていた椅子を積み上げていました。'
      not_admitted: '{staff} はその友人の輪に入ることはなく、壁の外のワイン園で数晩座っただけでした。ある時、隣のテーブルの誰かが歌を口ずさみ始め、それはシューベルトという人の曲だと言い、途中で言葉を失ってしまいました。'
      points:
        p1:
          trait_methodical: '3月25日、コンサートまであと1日。協会のホールは26日の夜は空いているが、手伝うと約束した選手の1人は間違った日のことを頭の中で考えていた。 {staff} は几帳面で、リストを作成し、順番に各プレイヤーのドアをノックし、全員に曜日と時間を確認してリストに署名させ、その後協会に戻り、ポーターにその晩の登録簿にシューベルトの名前を書くように頼みます。暗くなる前にシューベルトがホールを見に来る。彼は空の椅子の列の中にしばらく立っていたが、それから手を伸ばして、曲がって置かれていた最前列の椅子をまっすぐに直した。'
          trait_charismatic: '3月25日、コンサートまであと1日。協会のホールは26日の夜は空いているが、手伝うと約束した選手の1人は間違った日のことを頭の中で考えていた。 {staff}は説得力を持って、各選手を回って、間違った日の選手を26日の夜に戻して話し、それから協会に戻り、ポーターにその夜の登録簿にシューベルトの名前を書くように頼みました。暗くなる前にシューベルトがホールを見に来る。彼は空の椅子の列の中にしばらく立っていたが、それから手を伸ばして、曲がって置かれていた最前列の椅子をまっすぐに直した。'
          else: '3月25日、コンサートまであと1日。協会のホールは26日の夜は空いているが、手伝うと約束した選手の1人は間違った日のことを頭の中で考えていた。音楽に詳しい{staff}は、ポーターのテーブルにパートを広げ、各奏者とプログラムと時間を確認し、26日の夜にシューベルトの名前をレジスターに書くようにポーターに頼みます。暗くなる前にシューベルトがホールを見に来る。彼は空の椅子の列の中にしばらく立っていたが、それから手を伸ばして、曲がって置かれていた最前列の椅子をまっすぐに直した。'
        p3:
          class_medical: '8月末、シューベルトの病気は再び悪化し、夜もよく眠れなくなりました。薬に詳しい{staff}は、持参したナノ医療キットを開け、説明書通りに使用し、その後は毎朝毎晩彼の様子を観察する。引越しの日、シューベルトは片手に抱えた音楽を抱えてヴィーデンの新居の階段を、立ち止まることなく最上階まで運びます。彼は音楽を新しい部屋の窓の下に置き、窓を押し開けます。'
          else: '8月末、シューベルトの病気は再び悪化し、夜もよく眠れなくなりました。 {staff} はナノ医療キットを携行し、ケースの説明書に従って段階的にキットを使用し、その後は毎朝と夕方に彼の様子を観察します。引越しの日、シューベルトは片手に抱えた音楽を抱えてヴィーデンの新居の階段を、立ち止まることなく最上階まで運びます。彼は音楽を新しい部屋の窓の下に置き、窓を押し開けます。'
        p2:
          class_lettered: '10月1日の夜、フェルディナンドの家のテーブルには3つのソナタの原稿が広げられ、その横にはライプツィヒの出版社プロブストに宛てたまだ書き始めの手紙があった。 {staff} は事務処理や出版社への対応に慣れており、3 つのスコアそれぞれのページ数とキーを送信内容のリストにコピーし、シューベルトが献呈を望んでいる作曲家の名前をリストの先頭に書き、最初に確認できる確認書を送り返すよう出版社に依頼する行を手紙に追加しました。シューベルトは手紙を折り、封筒にライプツィヒの住所を書きます。彼はリストを楽譜の上に置き、手のひらで折り目を平らに伸ばします。'
          else: '10月1日の夜、フェルディナンドの家のテーブルには3つのソナタの原稿が広げられ、その横にはライプツィヒの出版社プロブストに宛てたまだ書き始めの手紙があった。音楽に詳しい{staff}は、3枚の原稿をページごとに並べ、ページ番号と反復記号を確認し、送付内容のリストにコピーし、シューベルトが献呈を望んでいる作曲家の名前を先頭に書き、最初に出版社に確認できる確認書を送り返すよう手紙に一行加えた。シューベルトは手紙を折り、封筒にライプツィヒの住所を書きます。彼はリストを楽譜の上に置き、手のひらで折り目を平らに伸ばします。'
