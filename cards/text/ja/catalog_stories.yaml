      cart: '5月31日、{staff}はコーチン病院の門で薪を降ろすカーターを手伝う。カーター氏によると、昨日彼らは若い男性を運び込んだが、今朝はその上にシートが掛けられていたという。彼はここに木材を持ち込んで10年になりますが、天気の良い朝が耐えられません。'
