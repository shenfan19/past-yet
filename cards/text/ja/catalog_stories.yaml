  ramanujan_madras:
    name: '計算を確かめてほしいという手紙'
    place: 'マドラス'
    figure: 'シュリニヴァーサ・ラマヌジャン'
    story: '1912 年 3 月から、スリニヴァーサ ラマヌジャンはマドラス ポート トラストの会計部門の事務員として働きました。 1913年1月16日木曜日、彼はそこからケンブリッジのG.H.ハーディに手紙を書き、彼の作品と分岐系列の研究を紹介した。 1914年に彼はイギリスに行きました。彼は病気でインドに帰国した後、1920年に亡くなった。'
    story_prose:
      opening:
        - '1913年1月、マドラス。25歳のスリニヴァサ・ラマヌジャンはポート・トラストの会計部門の事務員で、昼は帳簿をチェックし、夜は数学の仕事をしている。 1 月 16 日木曜日、彼はここからケンブリッジの G. H. ハーディに、大学の授業以外で達成した成果について手紙を書きます。'
        - '歴史上、ハーディは2月8日に返答し、証明を書くように求めた。 2月27日、彼は書き終えて2通目の手紙を送り、自分はすでに半分飢えていると述べた。奨学金は5月まで支給されず、それまで家族は彼の月給30ルピーで暮らしていた。 1914年に彼はイギリスに渡り、明確な診断もつかないまま1917年に重病にかかり、インドに戻った後の1920年にわずか32歳で亡くなった。この支店では、ポート・トラストの事務員が海外赴任のための荷物を結び、会計室の同僚が彼のランプを共有している。'
        - 'この旅では、料理や人の世話ができる人、栄養合成装置を持った意志の強い人、親切で忍耐強くて丈夫な人など、数種類の人が助けてくれます。口座を維持できる人、または取引を行ったことのある人、自分のやり方を知っている秩序ある人、またはギフトボックスを持って電話をかける人。ナノ医療キットを持った医師または医療従事者。'
      outcomes:
        all: '1914年、彼は石板を荷物に入れてイギリスに向けて出航した。その後、ケンブリッジでは療養所には入らなかった。インドに戻った後、彼はさらに何年も数学を学びました。'
        p3: '1914年に彼はイギリスに行きました。数年後、ケンブリッジでは療養所には入らなかった。インドに戻った後、彼はさらに何年も数学を学びました。'
        p2: 'その5月に月75ルピーの奨学金が支給された。その月の間、米びつが空になることはありませんでした。'
        p1: '手紙はケンブリッジに届き、封印にはマドラスの消印が押された。 1914年に彼はイギリスに向けて出航した。'
      none: '2月27日の夜、彼はランプの下で倒れ、書きかけのページがテーブルの上に散乱した。ケンブリッジではハーディはそれ以上何も聞かなかった。'
      desync: '2月27日の夜、彼はランプの下で倒れた。 {staff} がリコールされたとき、書きかけの手紙が彼の脇の下に置かれており、インクがにじんで小さな染みになっていました。'
      not_admitted: '{staff} はポート トラストには決して立ち入らず、事務員が台帳を持って出入りするのを外から見ているだけでした。パケットを結んだ店員はそのパケットの住所を読み上げ、ケンブリッジで立ち止まった。'
      points:
        p1:
          class_food: '2月下旬: ハーディが2月8日に書いた返信がマドラスに届き、証明を書くよう求められた。毎晩、彼はランプの上にかがみ込み、一枚のシートを満たし、もう一枚を取り、半分以上食べることはありませんでした。料理ができる{staff}さんは、毎晩温かいご飯とダルのボウルをランプのところに持ってきて、彼が書き終わるのを見てから執筆に戻らせました。2月27日の夜、手紙は書き上げられた。彼はシートを一枚ずつ正方形にし、折りたたんで封筒に入れました。彼のランプを共有した同僚はすでに眠っていましたが、芯はまだ燃えていました。'
          class_medical: '2月下旬: ハーディが2月8日に書いた返信がマドラスに届き、証明を書くよう求められた。毎晩、彼はランプの上にかがみ込み、一枚のシートを満たし、もう一枚を取り、半分以上食べることはありませんでした。介護の訓練を受けた{staff}は、時間通りに食事をテーブルに運び、時々彼を起き上がらせて数歩歩いて水を飲ませ、夜遅くになるとランプを落としてしばらく横たわらせた。2月27日の夜、手紙は書き上げられた。彼はシートを一枚ずつ正方形にし、折りたたんで封筒に入れました。彼のランプを共有した同僚はすでに眠っていましたが、芯はまだ燃えていました。'
          else: '2月下旬: ハーディが2月8日に書いた返信がマドラスに届き、証明を書くよう求められた。毎晩、彼はランプの上にかがみ込み、一枚のシートを満たし、もう一枚を取り、半分以上食べることはありませんでした。 {staff} は毎日テーブルに食べ物を運び、夜遅くまで彼と一緒に座って、ペンが止まるたびに水のカップを手に押し付けました。2月27日の夜、手紙は書き上げられた。彼はシートを一枚ずつ正方形にし、折りたたんで封筒に入れました。彼のランプを共有した同僚はすでに眠っていましたが、芯はまだ燃えていました。'
        p2:
