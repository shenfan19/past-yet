        was: '1824 年 5 月 23 日、ウィーンで 2 回目のコンサートが開催されましたが、残念な結果となりました。'
        now: '{staff} は、リスナー候補が都市を離れる前に予約を確保し、その領収書をアカウントに含めます。ベートーベンには、自分のためにさらなるコンサートを企画する余地がある。'
        who: 'beethoven_vienna'
        bio: 'ベートーベンはウィーンでの再演コンサートを企画した際に前売り収入を得ていた。ドアが開く前に、彼は彼らの費用をさらに賄うことができた。'
    vignettes:
