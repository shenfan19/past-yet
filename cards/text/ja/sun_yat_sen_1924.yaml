eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - '1924年2月4日、広州。孫文は三つの学校を国立広東大学にまとめるよう命じ、鄒魯に準備を託した。学生はまだそれぞれの学校にいて、入学や卒業、新しい校地の準備が残っている。'
        - '史実では、大学はその年に開学したが、石牌の校舎が着工したのは九年後だった。孫文はそれを見なかった。この分岐では、三校の書類が載る机のそばに、準備室が手伝いのための椅子を一つ空ける。'
        - '道が分かり、各校の話を聞き取り、名簿を照合できる人に出番がある。候補地を歩いて見て回る人と、石牌で境界杭を支える手も要る。'
      points:
        xue: '準備室から城外に貼る入学案内が届いた。{staff}は渡し場で遠回りになる道に線を引き、交差点と船着き場を地図に丸で囲んだ。使いの者は案内の上に地図を置き、二度折った。折り目が川を横切り、船着き場の丸が半分だけ見えた。'
        wen: '事務員が{staff}を三校の人々に引き合わせた。{staff}は話を聞いて回り、先生と学生が困っていることを会議までに一枚にまとめた。机には三つの紙の山があった。事務員はその一枚を抜き出し、三つの山の上に横たえた。'
        si: '{staff}は候補地を歩き、最後に町の東の石牌まで行って、出入りの道を一枚の地図に書き込んだ。準備室で地図を広げると、紙がすぐに巻き戻ろうとした。{staff}は東の端を指で押さえ、紙の角を明かりに寄せた。'
        bian: '三校の卒業名簿には合わない名前があった。{staff}は原本に戻って一つずつ確かめ、一冊にまとめた。渡す前に、{staff}はもう一度ページを数えた。最後の紙では、確かめたばかりの一行の墨がいちばん濃かった。'
        xing: '石牌で杭を打つ組には人手が足りなかった。{staff}も町を出て、仲間が打つ杭を支え、境界をもう一度歩いた。最後の杭で、{staff}は泥のついた手を離した。振り返ると、初めに立てた杭がまだ一列に並んでいた。'
      outcomes:
        all: '事務所に戻ると、十一月の式典のために書かれた校訓が読める。五つの仕事の記録の隣で、五行の文字が紙の五つの折り目に向き合っている。'
        xing: '孫文が広州を発つ前に、石牌の境界に杭が立った。後にそこを歩く人が、杭を一本ずつ目で追った。'
        bian: '卒業式の準備で、事務員は一冊の名簿を開いて名前を見つけた。ページをめくると、綴じ目のそばの墨がまだ濃い。'
        si: '校地の書類のそばに比較の地図が残った。石牌への道を確かめた人が、折り目どおりにたたんだ。'
        xue: '受付が始まると、町の外の辻にも案内が貼られた。船着き場で足を止めた人が、紙の下端をそっとのばした。'
        wen: '会議の日、三校の困りごとが一枚に載っていた。次の人の手に渡るときも、その紙は開いたままだった。'
      none: '日暮れになっても準備室では紙をめくる音がした。戸口を通る{staff}には、何枚もの紙の端が明かりに照らされて見えた。'
      not_admitted: '{staff}は準備室に居場所を得られなかった。戸口を通ると、空の椅子が机の下にきちんと収まっていた。'
      excerpts:
        xing: '最後の杭で、{staff}は泥のついた手を離した。振り返ると、初めに立てた杭がまだ一列に並んでいた。'
        bian: '渡す前に、{staff}はもう一度ページを数えた。最後の紙では、確かめたばかりの一行の墨がいちばん濃かった。'
        si: '準備室で地図を広げると、紙がすぐに巻き戻ろうとした。{staff}は東の端を指で押さえ、紙の角を明かりに寄せた。'
        xue: '使いの者は案内の上に地図を置き、二度折った。折り目が川を横切り、船着き場の丸が半分だけ見えた。'
        wen: '机には三つの紙の山があった。事務員はその一枚を抜き出し、三つの山の上に横たえた。'
    name: "広州、1924年"
    short: "広州"
    place_name: "広州、高等師範学校の講堂"
    blurb: "三つの学校が一つの大学になろうとしています。準備事務所は、仕事が入るたびに任せられる人を選びます。引き受けた仕事を一件終えるごとに星が一つ付きます。"
    handle_label: "講演の記録が一冊の本になる"
    protagonist_role: "三つの学校を一つの大学に統合するよう命じ、日曜日にはその講堂で講演する政治家"
    stay: "事務所の時間で7日間、歴史の中で210日間滞在する"
    plan_baseline: "本来の時系列"
    protagonist: "孫文"
    summary:
      near_death: "{staff}は広州で病に倒れ、帰還のお守りに引き戻されて銅像の前で目を覚ました。"
      stay_and_gifts: "{staff}は仕事を終えても戻ってこなかった。大学の開校を見届けるために残る、と書き置きがあった。贈り物は後から届く。"
      gave_up: "{staff}は最後までもたず、銅像の前で目を覚ました。1924年の広州にはもういられなかったという。"
      legend: "{staff}が銅像の前で目を覚ますと、荷物に1924年3月に印刷された小冊子が入っていた。本来の時系列では、誰もその後を尋ねないまま立ち消えになった案件が{base_D:i}件。この分岐では{D:i}件だった。広州を去った日、授業開始まであと{countdown:i}日だった。"
      perfect: "{staff}は銅像の前に帰ってきた。本来の時系列では、誰もその後を尋ねないまま立ち消えになった案件が{base_D:i}件。この分岐では{D:i}件だった。広州を去った日、授業開始まであと{countdown:i}日だった。"
      modest: "{staff}は広州で二百十日を過ごし、手の届くことをして、再び銅像の前に立った。広州を去った日、授業開始まであと{countdown:i}日だった。"
    star_points:
      xue: "城外のどこに募集告知を貼るか道順を決め、届け役に渡す"
      wen: "紹介を受けて三校を回り、初会合までに困り事を一枚にまとめて届ける"
      si: "候補地を見比べ、石牌に決まる前に比較図を届ける"
      bian: "三校の卒業名簿を照合し、6月21日の式典用に一冊にまとめて届ける"
      xing: "石牌へ向かう一行に加わり、新校地の境界杭を立てる"
    points_fail:
      xue: 'この分岐では告示は市内にしか貼られず、城外の学生が知ったときには出願がもう始まっていた。'
      wen: '第一回準備会議は史実どおりに開かれ、三校の困りごとはばらばらに語られたまま、まとめた一覧はなかった。'
      si: '新キャンパスは史実どおり石牌に決まり、準備室の机には候補地をまとめた地図が一枚もなかった。'
      bian: '6月21日の卒業式は史実どおりに行われた。準備室では三校の名簿を別々に確認することになった。'
      xing: '石牌の校地は史実どおり紙の上で区切られただけで、境界の杭は一本も立たなかった。'
    shift:
      xue:
        was: '1924年6月9日、国立広東大学は各省の教育庁に学生募集を委託し、6月10日に予科試験の出願受付が始まった。募集予定は520人。'
        now: 'この分岐では、城外の辻や波止場にも募集の告示が貼られた。'
      wen:
        was: '1924年3月3日、第一回準備会議が開かれ、議題の最初は三校の学生の卒業問題だった。'
        now: 'この分岐では、会議の机に三校の困りごとをまとめた一覧が置かれた。'
      si:
        was: '1924年、学校が各地に分散して管理しにくいため、孫文は鄒魯に石牌を新キャンパスに選ばせ、その年のうちに土地が区切られた。'
        now: 'この分岐では、選定の書類の横に、候補地と石牌をまとめて描いた地図が添えられた。'
      bian:
        was: '1924年6月21日、鄒魯が国立広東大学の校長に就任し、同じ日に旧三校の卒業式が行われた。'
        now: 'この分岐では、準備室は確認済みの統一名簿を使って式を進められた。'
      xing:
        was: '1924年、孫文は鄒魯に石牌を新キャンパスとして選ばせたが、新校舎の着工は1933年、最初の学院が移ったのは1934年秋だった。孫文は1925年3月12日に亡くなり、それを見ることはなかった。'
        now: 'この分岐では、11月に孫文が広州を離れる前に、石牌の校地の境界がもう一本ずつ立っていた。'
        who: sun_yat_sen_guangzhou
        bio: 'この時間線では、孫文が広州を離れる前に、新キャンパス石牌の境界が定まっていた。'
    shift_all: "五つの仕事はすべて片付いた。今になって孫文が後に記した校訓を読み返すと、あの仕事が「博学・審問・慎思・明辨・篤行」に重なって見える。"
    milestones:
      adviser: "{date}、準備事務所は人手が足りない。事務員が{staff}の席を空け、仕事が入ったら声をかけることになった。"
      wen_ask: "{date}、事務員がたまたま三校それぞれに話を聞ける相手を知っていて、{staff}を紹介した。{staff}は教員と生徒の困り事を聞き、一枚にまとめて事務所に届けた。"
      xue_enrol: "{date}、事務員は{staff}が城外の道筋をすぐに把握したのを見て、募集告知を貼る道順を任せた。{staff}は辻と船着き場を印で示し、道順と告知を届け役に渡した。"
      bian_rolls: "{date}、三校から届いた卒業名簿には食い違う名前がいくつもあった。事務員は書類を丁寧に確認する{staff}に三つの束を預けた。{staff}は原本と照らし合わせ、式典用の名簿を一冊にまとめて届けた。"
      si_site: "{date}、準備事務所は{staff}に市内と石牌の候補地を見比べるよう頼んだ。{staff}はすべての場所を歩き、それぞれの出入り口を一枚の図に記して持ち帰った。"
      xing_shipai: "{date}、石牌に境界杭を立てに行く一行には人手が足りず、事務員が{staff}を誘った。現地で{staff}は仲間が打ち込む杭を支え、帰る前に皆で境界をもう一度歩いた。"
quotes:
  sun_motto: {who: '孫文', quote: '博学、審問、慎思、明辨、篤行。', occasion: '国立広東大学のために書いた校訓'}
  sun_great_things: {who: '孫文', quote: '諸君に勧める。志を立てるなら大事をなすことであって、大官になることではない。', occasion: '嶺南大学の学生歓迎会での演説'}
