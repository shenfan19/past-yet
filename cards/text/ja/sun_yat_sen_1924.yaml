      records_read_aloud:
        s_fan: '{date}: Shen Fan は自分自身を推測するハンドを書きます。彼は名前を読み上げ、事務員が書き込みを行い、3 つの記録のうち 2 つに記載されているすべての名前に印を付けます。'
        s_somchai: '{date}: ソムチャイは読むことができますが、手は不器用で、彼が何を書いているか誰も理解できません。彼が名前を読み上げ、事務員が書きます。神殿で、他の人たちが屋根の修繕をしていたとき、彼は梯子を持っていた。'
      sunday_first:
        s_fan: '{date}: シェン・ファンさんはホールの一番後ろで押し込まれており、すべてが聞こえないため、ホールに何人いるのか、メモを取っている人は何人なのかを数え、その 2 つの数字を書き留めます。'
        s_samuel: '{date}: サミュエルはホールの一番後ろで押し込まれ、つま先立ちでメモを取っていました。彼はあまりにも遠く離れていて、彼が書き留めていることの半分は聞いている人々の顔です。'
        s_amara: '{date}: アマラはホールの一番後ろに押し込まれており、すべてが聞こえません。彼女の隣の生徒は長時間立っていたため、意識を失いました。彼女は彼が座るのを手伝い、しばらく手首で数を数えます。'
      spoiler:
        s_fan: '{date}: シェン・ファンは、2年後にはこの学校がこの学校を命令した男の名前になり、100年後にはその銅像から出発することを知っています。彼はノートの最後のページに 2 つの文を書いて閉じます。'
        s_guilan: '{date}: ギランは、この学校が 2 年後に名前が変わることを知っています。彼女は文字を書くことができないので、頭の中で一度繰り返して、誰にも言いません。'
        s_somchai: '{date}: ソムチャイは、2 年後にはこの学校が命令を出した男の名前になることを知っています。彼はノートの最後のページに文章を書いて閉じ、何を読んでいるのか店員に聞きに行きました。'
        s_carlos: '{date}: カルロスは、この学校が 2 年後に名前が変わることを知っています。彼はそれを書き留めることができないので、それをオーブンに言い、書き終わる前に笑います。'
        s_samuel: '{date}: サミュエルは、この学校が 2 年後に名前を変更することを知っています。これは他の誰も知らないニュースです。彼はそれをノートの最後のページに書き、再び取り消し線を引きます。ファイルする場所がありません。'
        s_amara: '{date}: アマラは、この学校が 2 年後に名前が変わることを知っています。彼女はノートの最後のページに文章を書いて閉じます。'
      pamphlet_given:
        s_fan: '{date}: 店員が Shen Fan に印刷所から出したばかりのパンフレットを渡し、その部屋にいる全員がそれを持っているように言いました。シェン・ファンはまず序文に目を向け、その下の日付を確認します。'
        s_samuel: '{date}: 店員がサミュエルに、印刷所から出した新しいパンフレットのコピーを手渡します。彼がどの印刷物かと尋ねると、店員は最初のものだと言いました。'
      errand_frail:
        s_fan: '{date}: シェン・ファンさんは階段を数段上がると息が切れてしまい、ページを運ぶことができません。彼はコピー室の入り口に座って、1つのテキストが何回循環するかを数えています。'
        s_somchai: '{date}: ソムチャイは数段の階段を上がると息が切れてしまい、ページを運ぶことができません。彼はコピー室のドアに座って、伝票が入ったページが出入りするのを眺めています。'
        s_samuel: '{date}: サミュエルは数日前からまた胃の調子が悪く、階段を数段上がると息が切れてしまいます。彼はコピー室の入り口に座って、ページが運ばれるたびに時間を記録します。'
      homesick_may:
        s_fan: '{date}: 何も記録がない月。シェン・ファンさんは百日になるまでノートに集計し、その後またノートの横で計算します。オフィスに来てから3日ちょっとが経ちました。'
        s_guilan: '{date}: 何も記録がない月。ギランは日数を数えます。家では今ごろ唐辛子が地中に入るはずです。オフィスに来てから3日ちょっとが経ちました。'
        s_somchai: '{date}: 何も記録がない月。ソムチャイはまだ一度は雪を見たいと思っていますが、5月の広州には雪がありません。オフィスに来てから3日ちょっとが経ちました。'
        s_carlos: '{date}: 何も記録がない月。カルロスは毎朝 3 時に起きます。彼のオーブンはここになく、彼は午前中ずっと他の人のストーブのそばに立って見守っています。オフィスに来てから3日ちょっとが経ちました。'
        s_samuel: '{date}: 何も記録に残らない月は、記者にとって最も困難な月です。サミュエルはノートに記録を残しており、その記録は 100 日に達します。オフィスに来てから3日ちょっとが経ちました。'
        s_amara: '{date}: 何も記録がない月。アマラは、この 100 日間に区内で何人の子供たちが生まれたかを計算します。オフィスに来てから3日ちょっとが経ちました。'
        s_jeanluc: '{date}: 何も記録がない月。ジャン＝リュックは、海の丸太のように、1 日 1 行を 100 行になるまで書きます。オフィスに来てから3日ちょっとが経ちました。'
      shipai_frail:
        s_fan: '{date}: シェン・ファンは市の東にある石牌に何が建設されるかを知っています。それは遠すぎるので、彼はそれを歩くことができません。'
        s_somchai: '{date}: ソムチャイは、市の東にあるシパイに何が立つかを知っています。それは遠すぎるので、彼はそれを歩くことができません。'
        s_samuel: '{date}: サミュエルは、市の東にあるシパイに何が立つのか、そしてそれが良い作品になることを知っています。それは遠すぎるので、彼はそれを歩くことができません。'
      last_seat:
        s_fan: '{date}: シェン・ファンはいつもの場所からこの講義を聞き、彼のノートのカウントは16で止まりました。ホールが空になった後も、彼はしばらく座ったままだ。'
        s_guilan: '{date}: ギランはいつもの場所からこの講義を聞いています。ホールに人がいないとき、彼女はすぐには行かず、一つずつベンチをまっすぐに置きます。'
        s_somchai: '{date}: ソムチャイはいつもの場所からこの講義を聞いています。彼はいつも寺院で最後の鐘が鳴るのを待っていたように、ホールが空になった後もしばらく座ったままです。'
        s_samuel: '{date}: サミュエルはこの講義をいつもの場所から取り上げます。彼はそれが最後であることを知っており、ノートにはその番号だけを書き、最後の単語は書きません。'
        s_amara: '{date}: アマラはいつもの場所からこの講義を聞いています。その後しばらく、最後の人がドアから出て行くまで、彼女は座ったままです。'
        s_jeanluc: '{date}: ジャン＝リュックはいつもの場所に立ったままこの講義を聞いています。船長が最後に船から降りるのと同じように、彼もホールを出るのは最後です。'
      records_shut:
        s_guilan: '{date}: ギランは 3 年生の後に学校を辞め、記録のコピーには関与していません。彼女は3つの学校すべての門番と知り合いになる。誰がどこにいるのかを知るには、ページをめくるよりも彼女に尋ねたほうが早いです。'
        s_carlos: '{date}: カルロスは自分の名前だけを書いており、記録のコピーには関与していません。彼は3つの学校すべての門番と知り合いになる。誰がどこにいるかを知るには、ページをめくるよりも彼に尋ねるほうが早いです。'
      sunday_sit:
        s_guilan: '{date}: ギランは膝も悪くてホールの後列に座り、最初の言葉から最後の言葉まで居続けました。彼女は壇上の発言すべてに従わない。隣の生徒が喉が渇いたので水を渡します。'
        s_somchai: '{date}: ソムチャイさんは20年間寺院で説法を聞いており、最後までホールの後列に座っていました。それが空になると、彼は隣の学生に何を読んでいるのか尋ねました。'
        s_jeanluc: '{date}: ジャン＝リュックは腰が悪く、立っていることに固執し、最初の言葉から最後の言葉までホールの後ろに立っていました。'
      pamphlet:
        s_guilan: '{date}: 印刷所から出てきたばかりのパンフレットが事務員の机の上にあります。ギランは窓からそれを見て、表紙の登場人物のうち 2 人を知っています。'
        s_somchai: '{date}: 印刷所から出てきたばかりのパンフレットが事務員の机の上にあります。 ソムチャイは窓越しに表紙を見ます。彼はこの本が一日何部発行されるかを知っており、店員にどこまで読み込んだかだけを尋ねます。'
        s_amara: '{date}: 印刷所から出てきたばかりのパンフレットが事務員の机の上にあります。アマラはそれを窓から見て鼻歌を歌い始めます。'
        s_jeanluc: '{date}: 印刷所から出てきたばかりのパンフレットが事務員の机の上にあります。 ジャン＝リュックは窓越しに表紙を見ます。'
      errand:
        s_guilan: '{date}: 複写室に伝票が貼られたページが出入りします。ギランさんは外に座って野菜を整え、出てきた人全員に食事をしたかどうか尋ねます。'
        s_amara: '{date}: 複写室に伝票が貼られたページが出入りします。アマラは外にいて、荷物を運ぶ人の後ろ姿しか見えず、足音から彼が急いでいるのがわかりました。'
        s_jeanluc: '{date}: 複写室に伝票が貼られたページが出入りします。ジャン＝リュックは外で門番の子供に結び目を教えているが、結び目を運ぶ人の背中だけを見ている。'
      shipai_reached:
        s_guilan: '{date}: 膝が悪くて、ギランはシパイに向かって一歩ずつ歩きます。あるのは畑だけ。彼女はしゃがみ、指の間に土をひとつまみこすり、ここで何かが成長するだろうと言いました。'
        s_carlos: '{date}: カルロスは荷車を押して街から東へ出てシパイに到着し、そこには畑しかないと言って戻ってきました。彼はそこに大学が建設されることを知っているが、それでも彼は畑だけだと言う。'
        s_amara: '{date}: アマラは街から東へ歩き、シパイに到着します。彼女はここに何が立つかを知っていて、長い間滞在し、今ここにあるものをゆっくりと描きます。'
      sunday_stall:
        s_carlos: '{date}: カルロスは中で何を言っているのか理解できず、パンを焼くためにホールの入り口にオーブンを設置しました。ホールが空になると群衆がなだれ込み、いつものように安すぎてパンはあっという間になくなってしまいます。'
      pamphlet_traded:
        s_carlos: '{date}: カルロスはオーブン一杯のパンと、印刷所から出てきた新しいパンフレットのコピーを交換しました。彼自身はこの本を読むことができず、パン屋を継ぎたいと考えている家の子供のためだという。'
      errand_carried:
        s_carlos: '{date}: この支部で、ページを運ぶために派遣されたのはかつてカルロスでした。伝票が貼られた紙束があったが、彼は一言も読めず、折り目もなかった。'
      last_stall:
        s_carlos: '{date}: カルロスはいつもよりオーブン 1 杯分多く焼きます。彼は、来たるべき日曜日にはこの玄関にこれほどの群衆が来ないことを知っており、残ったものを譲ります。'
      records_begun:
        s_amara: '{date}: アマラは 3 つの学校の記録をコピーし始めます。彼女にとって文章を書く仕事はいつも大変だったので、セリフをコピーし、事務員にセリフをチェックしてもらいました。'
      spoiler_said:
        s_jeanluc: '{date}: ジャン＝リュックはコピーの事務員に、2年後にはこの学校は命令した男の名前になるだろうと言いましたが、声を上げてそれを言うことはありませんでした。店員は顔を上げません。その男はまだ生きているが、そのような学校に名前を付けたのは誰だ、と彼は言う。'
      shipai_walk:
        s_jeanluc: '{date}: ジャン＝リュックは、新しいキャンパスが市の東にあるシパイにあると聞きました。膝が痛くてそこまで遠くへは行けず、しばらく岸壁に立って東を眺めていた。'
    tags:
      - '考えた'
      - '教育'
      - '大学'
      - 'c20'
      - '広州'
      - '歴史'
    event_titles:
      asked_the_way: '道を尋ねられた'
    plots: {}
    encyclopedia:
      history:
        - text: '1924年2月4日、孫文は国立高等師範学校、広東法政学院、広東農業学校を国立広東大学に統合するよう命じ、その準備に鄒魯を任命した。'
          check: true
        - text: '1924年1月27日から8月24日まで、サンは高等師範学校のホールで日曜日に合計16回の講義を行った。黄昌古はそれらを一つ一つ書き留め、鄒魯は清書を読んで伝票を貼り、孫は自らの手で修正した。'
          check: true
        - text: '鄒魯は2月21日に準備を始めた。 2月24日には3校の生徒を会場に集めて発表し、3月3日には3校の生徒の卒業を議題とする第1回準備会議が開催された。'
          check: true
        - text: '最初の講義は 3 月末にパンフレットとして印刷され、サンは 3 月 30 日に序文を書きました。 6月3日、鄒魯は学校への参加のための措置を提出し、6月6日に承認された。'
          check: true
        - text: '授業は9月19日に始まり、11月11日には孫氏が書いた標語を掲げて創立式典が行われた。孫氏は 1925 年 3 月 12 日に北京で亡くなり、1926 年に大学は国立中山大学に改名されました。'
          check: true
      regret:
        - 'あなたは9月1日に出発します。授業は19日から始まり、その後に標語を書きます。'
        - '講義は16回目で終わった。会場にいる誰も、それが最後だということを知りませんでした。'
    events:
      asked_the_way: '{date}: 手紙を持った新入生が {staff} にオフィスへの道を尋ねます。 {staff}も分からず、午前中半分一緒に探します。'
      asked_the_way_shown: '{date}: 手紙を持った新入生が {staff} にオフィスへの道を尋ねます。 {staff} がそれをシートに示すと、生徒は感謝を示してシートを手に立ち去ります。'
    quotes:
      near_death:
        - text: 'もう少し我慢できると思った。'
      stay_and_gifts:
        - trait: '種類'
          text: '私は彼らの名前を一人一人覚えています。しばらく滞在したいです。'
        - text: '彼らはここに人を必要としている。'
      gave_up:
        - trait: 'ホームシック'
          text: '家に帰りたいです。以上です。'
        - text: '7か月は長すぎます。'
      legend:
        - trait: '好奇心旺盛'
          text: 'このようにして本が作られ、一度にページを修正していきます。'
        - text: '私が帰ったとき、彼らはまだ授業を始めていませんでした。'
      perfect:
        - trait: '種類'
          text: '尋ねに来た人々は最終的に答えられました。'
        - text: 'やるべきことはやった。'
      modest:
        - trait: '口先だけの'
          text: '2年後に名前が変わるって言ってた。誰も私を信じませんでした。'
        - text: '私はただそこにいただけだった。'
    hints:
      low_luck: '幸運は、3 つの学校にタイムリーな紹介をもたらします。'
      low_wit: '事務所は機知に富んだ社員への通知ルートを信頼している。サイボーグニューラルチップが役立ちます。'
      low_finesse: '同事務所は、3 つのリストを誰かに託す前に、文書をしっかりと扱う人を探しています。'
      low_will: '事務局は、提案されているすべての敷地を歩く意欲を求めています。サイボーグのバイオニック肺が役に立ちます。'
      low_constitution: '乗組員は石牌への道のりと現地での作業に適した体質の人を探しています。サイボーグのバイオニック肺が役に立ちます。'
      none: '1 つ変更して同じシードで再送信すると、比較が最も明確になります。'
quotes:
  sun_motto: {who: '孫文', quote: '博学、審問、慎思、明辨、篤行。', occasion: '国立広東大学のために書いた校訓'}
  sun_great_things: {who: '孫文', quote: '諸君に勧める。志を立てるなら大事をなすことであって、大官になることではない。', occasion: '嶺南大学の学生歓迎会での演説'}
