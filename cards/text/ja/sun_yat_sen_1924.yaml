      spoiler_said: '{date}: {staff} はコピーをしている事務員に、2 年以内にこの学校は命令した男の名前になるだろうと告げます。店員は顔を上げません。その男はまだ生きているが、そのような学校に名前を付けたのは誰だ、と彼は言う。'
