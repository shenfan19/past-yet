      measures_sent: '{date}: 鄒魯が三校への参加対策を提出。'
      measures_approved: '{date}: 措置は承認されました。'
      shipai_chosen: 'この年、孫文は鄒魯に市の東にある石牌に新しいキャンパスを選ぶように指示した。学校は複数の場所に分散しており、運営は困難です。'
