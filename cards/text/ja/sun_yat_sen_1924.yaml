      sunday_stall: '{date}: {staff} はホールに入ることができず、ドアに屋台を設置します。ホールが空になると群衆がなだれ込み、あっという間にすべてが売れてしまいます。'
      sunday_sit: '{date}: {staff} はホールの後列に場所を見つけ、最初の言葉から最後の言葉まで動かずに座っています。'
