      classes_begin: '{date}: 国立広東大学で授業が始まります。'
      ceremony: '{date}: 孫文が記した「広く学び、よく探求し、慎重に考え、明確に洞察し、真剣に実践する」をモットーに創立式典が行われる。彼はそこにはいないので、2日後に広州を離れます。'
