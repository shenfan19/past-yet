ui:
  about:
    update_notes: "更新履歴"
    version_line: '{v}、{date} 公開'
    dedication: 初版は2026年11月19日に完成しました。中山大学の孫文先生の銅像の前から始まるこの物語を、先生の生誕160周年を記念して捧げます。
    content_credit:
      mail: メール
      design: Fan Shen が AI の支援を受けてゲームを設計しました。
      drafts: "ゲーム内の物語、歴史上の人物紹介、架空のスタッフのエピソードはAIで生成し、作者が順次確認しています。個別の協力者は該当するカードに記載します。"
      review: "スタッフとその物語は架空です。史実や文化の描写、翻訳に誤りや漏れがある場合があります。不正確な表現、不公平な描写、人を傷つける内容、権利を侵害する内容にお気づきの際は、{issues} または {mail} でお知らせください。作者が確認し、問題のある内容を速やかに削除します。"
    echoes:
      title: 歴史の余韻
      rule: すべてのプレイ可能な物語には、出典のある歴史上の言葉が用意されています。星がゼロでも、同期に失敗しても、出来事に関われなかった場合でも、報告書に余韻が表示されます。どの言葉が出るかは星の数と結末で決まります。医療上の緊急帰還やプレイヤーによる呼び戻しでは、余韻は表示されません。
    preview:
      title: "開発初期のバージョンについて"
      project: "このゲームは研究プロジェクトから生まれ、そのシミュレーションエンジンの開発にも役立っています。研究の内容を知らなくても遊べます。"
      changes: "機能が増えるにつれて、ルールやアイテムの効果、行動の結果が変わることがあります。進行状況はできる限り引き継げるようにしますが、大きな更新では古いセーブデータが使えなくなる場合があります。"
