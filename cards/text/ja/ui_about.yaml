ui:
  about:
    update_notes: "更新履歴"
    content_credit:
      design: Fan Shen が AI の支援を受けてゲームを設計しました。
      drafts: 物語、歴史上の人物紹介、架空のスタッフのエピソードの多くは AI が下書きし、Fan Shen が題材の選定と編集を担当しています。個別の協力者は該当するカードに記載します。
      review: 一部のカードは人の手で確認済みで、残りは順次確認しています。史実の細部、文化に関する描写、翻訳に誤りや漏れがある場合があります。お気づきの点があれば、カード名と該当箇所をお知らせください。出典があれば添えていただけると助かります。
      feedback: 訂正を送る
    echoes:
      title: 歴史の余韻
      rule: すべてのプレイ可能な物語には、出典のある歴史上の言葉が用意されています。星がゼロでも、同期に失敗しても、出来事に関われなかった場合でも、報告書に余韻が表示されます。どの言葉が出るかは星の数と結末で決まります。医療上の緊急帰還やプレイヤーによる呼び戻しでは、余韻は表示されません。
    preview:
      title: "開発初期のバージョンについて"
      project: "このゲームは、研究プロジェクト Life Matters（LM）の遊べるフロントエンドで、シミュレーションエンジンの開発にも役立てています。研究の内容を知らなくても楽しめます。"
      changes: "機能が増えるにつれて、ルールやアイテムの効果、行動の結果が変わることがあります。進行状況はできる限り引き継げるようにしますが、大きな更新では古いセーブデータが使えなくなる場合があります。"
