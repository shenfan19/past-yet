ui:
  welcome:
    story: "Diriges una agencia de viajes en el tiempo, envías empleados al pasado y lees los informes que traen de vuelta. Protege momentos clave y repara lo que la historia dejó pendiente para reunir suficiente energía temporal y volver a casa."
    story_start: La historia comienza ante la estatua de bronce del doctor Sun Yat-sen, en la universidad que lleva su nombre, y conmemora el 160.º aniversario de su nacimiento.
