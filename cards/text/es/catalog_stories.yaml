catalog:
  sun_yat_sen_guangzhou:
    name: "De la estatua a una nueva universidad"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "Ante la estatua de Sun Yat-sen, en la universidad que lleva su nombre, viajas al 4 de febrero de 1924 en Guangzhou. Ese día ordena unir tres escuelas para fundar la Universidad Nacional de Guangdong y encarga a Zou Lu los preparativos. Durante esos meses da conferencias los domingos en el salón de la Escuela Normal Superior. Las notas pasan de mano en mano hasta convertirse en un libro. Las clases empiezan el 19 de septiembre y la ceremonia de fundación se celebra el 11 de noviembre con el lema que él escribió. Muere en Pekín el 12 de marzo de 1925, y en 1926 la universidad toma su nombre."
    relic: "La estatua de Sun Yat-sen"
    relic_desc: "La estatua del campus de la Universidad Sun Yat-sen da acceso a Guangzhou en 1924. No es una antigüedad y no se puede vender."
    points:
      p1: "Entregar un plano de los terrenos antes de que se elija el nuevo campus"
      p2: "Traer un ejemplar del libro de las conferencias"
      p3: "Asistir a la última conferencia"
    vignettes:
      slips: "Un empleado ficticio va a copiar una página que tiene dos líneas tapadas por una nota pegada. Le preguntas quién escribió la nota y quién escribió la página. Copia primero la página y deja la nota donde estaba."
      back_row: "Un estudiante ficticio no encuentra sitio y se levanta una y otra vez para mirar. Te corres en el banco. Escucha el resto en silencio y te saluda con un gesto al vaciarse el salón."
      hundred: "En la última página del cuaderno llevas la cuenta de los días con rayas de cinco en cinco. Al llegar a cien, un empleado ficticio te pregunta qué cuentas. Le dices: los días."
  lalibela_rock:
    name: "Buscar por dónde sale el agua de la roca"
    place: "Lalibela, Etiopía"
    figure: "Lalibela y los canteros"
    story: "El rey Lalibela, de la dinastía zagüe, reinó de 1181 a 1221. Se le atribuyen las once iglesias excavadas en la roca de la localidad que lleva su nombre, con sus zanjas, fosos y pasadizos. No hay una datación segura para cada iglesia. En la década de 1520 llegó con una embajada el sacerdote portugués Francisco Álvares, que escribió la primera descripción europea detallada. El lugar se inscribió en la Lista del Patrimonio Mundial en 1978."
    relic: "Un cincel de cantero"
    relic_desc: "Un cincel de hierro con el filo bien rebajado."
    points:
      p1: "Ganarse un sitio entre los canteros y sacar los cascotes de la zanja"
      p2: "Antes de las lluvias, seguir un canal hasta su salida y señalar dónde se estancará el agua"
      p3: "En época de lluvias, ayudar a limpiar una zanja de extremo a extremo"
    vignettes:
      outlet: "{staff} sigue un canal tallado en la roca, pasa el recodo hasta donde sale al aire libre y marca el punto con una esquirla."
      rain: "Con el agua hasta los tobillos, {staff} va pasando al borde de la zanja cestas de lodo, una tras otra, hasta que se va la luz."
      bend: "{staff} dibuja una muesca en un papel para señalar el recodo y que un ayudante lo encuentre a la mañana siguiente."
  ife_bronzes:
    name: "La línea que debe sobrevivir a la fundición"
    place: "Ife, Nigeria"
    figure: "Los fundidores de Ife"
    story: "En Ife, ciudad yoruba, los fundidores hicieron cabezas realistas de aleación de cobre durante unos cuatro siglos. La mayoría de las estimaciones sitúan las piezas en torno a 1300. En 1910 el alemán Leo Frobenius presionó al sacerdote de un bosque sagrado para que le vendiera una cabeza a la que llamó cabeza de Olokun y que tuvo que devolver. En 1938 unos obreros hallaron varias cabezas al excavar en el recinto de Wunmonije, entre ellas la que hoy está en el Museo Británico. En una exposición en Londres en 1948 se las comparó con las mejores obras de Italia y Grecia."
    relic: "Dos dibujos de estudio"
    relic_desc: "Dibujos que comparan los trazos en una pieza de fundición de prueba."
    points:
      p1: "Entrar en el taller de los fundidores y hacer un modelo de prueba en cera"
      p2: "El día de la colada, mantener vivo el fuego bajo el crisol"
      p3: "Tras la colada, distinguir la línea grabada en la cera de la añadida después"
    vignettes:
      line: "{staff} pone el dibujo anterior al acabado junto a la pieza de hoy y dibuja la nueva raya en una hoja aparte."
      surface: "{staff} inclina la tabla bajo la pieza para que la luz corra por la superficie y señala en el papel dónde empieza una línea fina."
      edge: "{staff} dibuja la pieza de prueba y, al lado, la única línea nueva de hoy, para que la próxima comparación no dependa de la memoria."
  great_zimbabwe:
    name: "El paso en el plano"
    place: "Masvingo, Zimbabue"
    figure: "Los constructores del Gran Zimbabue"
    story: "Los antepasados del pueblo shona construyeron el Gran Zimbabue, que prosperó entre los siglos XI y XV. Su Gran Recinto tiene un largo muro curvo de granito dispuesto en hiladas regulares y un paso estrecho entre dos muros que lleva a una torre cónica. En 1871 llegó a las ruinas el alemán Karl Mauch. En 1980 el país tomó de la ciudad el nombre de Zimbabue. El lugar se inscribió en la Lista del Patrimonio Mundial en 1986."
    relic: "Un croquis del paso"
    relic_desc: "Un dibujo de trabajo que deja en blanco la ruta entre los muros."
    points:
      p1: "Entrar en la cuadrilla y clasificar piedras del tamaño adecuado para la siguiente hilada"
      p2: "Recorrer el paso entre los muros y dibujarlo dejando el camino en blanco"
      p3: "En la estación seca, llevar agua desde el valle a los constructores de la colina"
    vignettes:
      lines: "{staff} traza dos líneas y deja blanco el espacio entre ellas para que un mensajero siga el blanco y no los muros."
      width: "{staff} sigue el muro interior hasta ver dónde termina y detiene allí el lápiz, sin alargar el trazo alrededor del recinto."
      pace: "{staff} mide a pasos una hilada y graba la cuenta en una piedra plana al pie del muro."
