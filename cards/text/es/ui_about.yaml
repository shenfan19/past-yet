ui:
  about:
    version_line: '{v}, publicado el {date}'
    dedication: La primera versión se terminó el 19 de noviembre de 2026. La historia comienza ante la estatua de bronce del doctor Sun Yat-sen, en la universidad que lleva su nombre, en homenaje por el 160.º aniversario de su nacimiento.
    update_notes: "Notas de actualización"
    content_credit:
      design: Fan Shen diseñó el juego con ayuda de la IA.
      drafts: "Los empleados, los objetos y las tramas son ficticios, y las palabras y acciones de los personajes históricos se dramatizan. La IA genera la mayor parte de los relatos y perfiles, y las aportaciones individuales se acreditan en las fichas correspondientes."
      review: "Los datos históricos, las representaciones culturales y las traducciones pueden contener errores u omisiones. Si detectas un problema o consideras que algo afecta a los derechos de una persona o familia, usa {issues} o escribe a {mail} para comunicarlo o solicitar su retirada."
    echoes:
      title: Ecos históricos
      rule: Cada historia jugable cuenta con citas históricas con su fuente. El informe muestra un eco aunque no consigas estrellas, se pierda la sincronización o el viajero no pueda participar en el evento. Las estrellas y el desenlace determinan la cita. En caso de evacuación médica o de regreso ordenado por el jugador, se omite el eco.
    preview:
      title: "Versión temprana"
      project: "Este juego nació de un proyecto de investigación y nos ayuda a desarrollar su motor de simulación. No hace falta conocer la investigación para jugar."
      changes: "A medida que añadamos funciones, pueden cambiar las reglas, los efectos de los objetos y los resultados de las acciones. Intentaremos conservar tu progreso, pero una actualización importante puede volver incompatible una partida guardada."
