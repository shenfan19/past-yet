eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 'Guangzhou, 4 de febrero de 1924. Sun Yat-sen ordena unir tres escuelas en la Universidad Nacional de Guangdong y encarga a Zou Lu los preparativos. Los alumnos siguen en sus centros. Quedan por organizar las inscripciones, la graduación y la búsqueda de un terreno.'
        - 'En la historia, la universidad abrió aquel año, pero las obras en Shipai no empezaron hasta nueve años después. Sun no vivió para verlas. En esta rama, la oficina preparatoria arrima una silla a la mesa donde están los papeles de las tres escuelas.'
        - 'Hace falta gente que sepa orientarse, averiguar qué necesita cada escuela y cotejar nombres. Alguien tendrá que recorrer los terrenos, y al equipo de Shipai le vendrá bien un par de manos para sujetar las estacas.'
      points:
        xue: 'La oficina saca los avisos de inscripción para las afueras. {staff} tacha un rodeo por el transbordador y rodea en el mapa los cruces y embarcaderos. El mensajero pone el mapa sobre los avisos y los dobla dos veces. El pliegue cruza el río y deja a la vista medio círculo en el embarcadero.'
        wen: 'Un oficinista presenta a {staff} a gente de las tres escuelas. Antes de la reunión, {staff} reúne en una hoja lo que les falta a los profesores y lo que preocupa a los alumnos. Ya hay tres montones sobre la mesa. El oficinista toma la hoja nueva y la coloca atravesada sobre los tres.'
        si: '{staff} recorre a pie los terrenos propuestos hasta Shipai, al este de la ciudad, y marca todos los accesos en el mismo plano. En la oficina el papel vuelve a enrollarse nada más abrirlo. {staff} sujeta el borde oriental con los dedos y acerca la esquina a la lámpara.'
        bian: 'Hay nombres que no concuerdan en las listas de graduación. {staff} examina los originales uno por uno y junta las tres listas en un registro. Antes de entregarlo, {staff} vuelve a contar las páginas. En la última hoja, la tinta más oscura es la de la línea recién cotejada.'
        xing: 'Al equipo que va a marcar el terreno de Shipai le faltan manos. {staff} sujeta las estacas mientras las clavan y vuelve a recorrer el límite. Al llegar a la última estaca, {staff} retira las manos cubiertas de barro. Al mirar atrás, las primeras estacas siguen en fila.'
      outcomes:
        all: 'De vuelta en la agencia se puede leer el lema escrito para noviembre. Alguien coloca una copia junto al registro de las cinco tareas, cinco líneas frente a cinco dobleces.'
        xing: 'Los límites de Shipai quedaron marcados antes de que Sun dejara Guangzhou. Tiempo después, alguien pasa por allí y sigue con la vista las estacas, una por una.'
        bian: 'Mientras prepara la graduación, el oficinista abre un solo registro y encuentra el nombre. Al pasar la página, la tinta junto al lomo sigue más oscura.'
        si: 'Entre los papeles del terreno queda un plano comparativo. Alguien comprueba el camino a Shipai y vuelve a doblarlo por los pliegues.'
        xue: 'Cuando se abren las inscripciones, hay avisos también en los cruces de las afueras. Alguien se detiene junto al embarcadero y alisa el borde de una hoja.'
        wen: 'En la primera reunión, las necesidades de las tres escuelas caben en una hoja. Sigue desplegada al pasar a las siguientes manos.'
      none: 'Al anochecer todavía se oye papel en la oficina. Al pasar ante la puerta, {staff} ve la luz sobre el borde inferior de las hojas.'
      not_admitted: '{staff} no consigue un sitio en la oficina preparatoria. Al pasar ante la puerta se ve una silla vacía, bien metida debajo de la mesa.'
      excerpts:
        xing: 'Al llegar a la última estaca, {staff} retira las manos cubiertas de barro. Al mirar atrás, las primeras estacas siguen en fila.'
        bian: 'Antes de entregarlo, {staff} vuelve a contar las páginas. En la última hoja, la tinta más oscura es la de la línea recién cotejada.'
        si: 'En la oficina el papel vuelve a enrollarse nada más abrirlo. {staff} sujeta el borde oriental con los dedos y acerca la esquina a la lámpara.'
        xue: 'El mensajero pone el mapa sobre los avisos y los dobla dos veces. El pliegue cruza el río y deja a la vista medio círculo en el embarcadero.'
        wen: 'Ya hay tres montones sobre la mesa. El oficinista toma la hoja nueva y la coloca atravesada sobre los tres.'
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salón de la Escuela Normal Superior"
    blurb: "Tres escuelas van a formar una sola universidad. La oficina preparatoria confía cada tarea a quien pueda llevarla a cabo. Cada encargo completado da una estrella."
    handle_label: "Las notas se convierten en un libro"
    protagonist_role: "Un estadista que ha ordenado unir tres escuelas en una universidad y que da conferencias los domingos en su salón"
    stay: "Permanecer siete días de oficina, 210 días en el pasado"
    plan_baseline: "Cronología original"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} enferma en Guangzhou. El amuleto de retorno le trae de vuelta y despierta ante la estatua."
      stay_and_gifts: "{staff} terminó el trabajo y no regresó. Dejó una nota: quiere quedarse para ver abrir la universidad. Los regalos llegarán más tarde."
      gave_up: "{staff} no aguantó hasta el final. Al despertar ante la estatua, dijo que ya no podía quedarse en la Guangzhou de 1924."
      legend: "{staff} despertó ante la estatua con un folleto impreso en marzo de 1924 entre sus cosas. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      perfect: "{staff} regresó a la estatua. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      modest: "{staff} pasó doscientos diez días en Guangzhou, hizo cuanto estuvo a su alcance y volvió ante la estatua. El día de la partida faltaban {countdown:i} días para el inicio de clases."
    star_points:
      xue: "Trazar una ruta para colocar los avisos de matrícula fuera de la ciudad y entregársela a los mensajeros"
      wen: "Visitar las tres escuelas gracias a una recomendación y entregar un resumen antes de la primera reunión"
      si: "Comparar los terrenos candidatos y entregar un mapa antes de que se elija Shipai"
      bian: "Revisar las tres listas de graduación y entregar un solo registro para la ceremonia del 21 de junio"
      xing: "Unirse al equipo de Shipai y colocar los postes que delimitan el nuevo campus"
    points_fail:
      xue: 'En esta rama el aviso solo se fija en la ciudad, y los estudiantes de fuera se enteran cuando la inscripción ya ha empezado.'
      wen: 'La primera reunión preparatoria se celebra como en la historia, cada escuela sigue hablando solo de sus propios problemas y no hay una lista que los reúna.'
      si: 'Shipai se elige como en la historia, y la oficina no tiene ninguna hoja con los solares dibujados juntos.'
      bian: 'La ceremonia del 21 de junio se celebra según lo previsto. La oficina sigue consultando tres listas por separado.'
      xing: 'El terreno de Shipai queda marcado solo en el papel, como en la historia, y no se clava en él ni una estaca.'
    shift:
      xue:
        was: '9 de junio de 1924: la Universidad Nacional de Guangdong encarga la admisión a las oficinas provinciales de educación, y el 10 de junio se abre la inscripción al examen preparatorio, con 520 plazas previstas.'
        now: 'En esta rama el aviso de admisión también se fija en los cruces de fuera de la ciudad y en los muelles.'
      wen:
        was: '3 de marzo de 1924: se celebra la primera reunión preparatoria, y lo primero del orden del día es la graduación de los alumnos de las tres escuelas.'
        now: 'En esta rama hay sobre la mesa de la reunión una lista con los problemas de las tres escuelas.'
      si:
        was: '1924: las escuelas están repartidas en varios lugares y son difíciles de llevar, Sun Yat-sen encarga a Zou Lu elegir un nuevo campus en Shipai, y el terreno se delimita ese año.'
        now: 'En esta rama, junto a los papeles de la elección hay un mapa de los solares y de Shipai.'
      bian:
        was: '21 de junio de 1924: Zou Lu asume la presidencia de la Universidad Nacional de Guangdong, y ese mismo día se celebra la graduación de las tres escuelas.'
        now: 'En esta rama, la oficina dispone de una lista unificada y revisada para la ceremonia.'
      xing:
        was: '1924: Sun Yat-sen hace que Zou Lu elija Shipai para el nuevo campus, pero la obra no empieza hasta 1933 y las primeras facultades no se trasladan hasta el otoño de 1934. Sun muere el 12 de marzo de 1925 sin verlo.'
        now: 'En esta rama, antes de que deje Cantón en noviembre, los lindes del terreno de Shipai ya están clavados, estaca a estaca.'
        who: sun_yat_sen_guangzhou
        bio: 'En esta línea temporal, los lindes del nuevo campus de Shipai quedan fijados antes de que Sun Yat-sen deje Cantón.'
    shift_all: "Los cinco encargos quedaron hechos. Vistos desde el presente, evocan las palabras que Sun Yat-sen escribiría para el lema de la universidad: estudiar con amplitud, indagar con cuidado, pensar con prudencia, discernir con claridad y practicar con constancia."
    milestones:
      adviser: "{date} — En la oficina preparatoria faltan manos. Un oficinista le hace sitio a {staff} para pasarle encargos que vayan surgiendo."
      wen_ask: "{date} — Por suerte, un oficinista conoce a alguien disponible en cada escuela. Envía a {staff} con recomendaciones. Tras escuchar a docentes y alumnos, {staff} entrega una sola hoja con las preocupaciones de las tres escuelas."
      xue_enrol: "{date} — Un oficinista ve que {staff} se orienta bien por los caminos de las afueras y le encarga la ruta de los avisos. {staff} marca los cruces y los muelles y entrega el trazado y los avisos a los mensajeros."
      bian_rolls: "{date} — Varios nombres no coinciden en las tres listas de graduación. Como sabe que {staff} revisa los documentos con cuidado, un oficinista le pasa los tres legajos. {staff} los coteja con los originales y entrega un solo registro para la ceremonia."
      si_site: "{date} — La oficina encarga a {staff} recorrer los terrenos de la ciudad y de Shipai. {staff} visita todos y vuelve con un mapa que señala el acceso a cada uno."
      xing_shipai: "{date} — Al equipo que sale hacia Shipai le faltan manos. Un oficinista invita a {staff}, que puede hacer el camino y ayudar. Allí, {staff} sostiene los postes mientras el equipo los hinca y luego recorre el lindero con los demás."
      order_given: '{date}: Sun Yat-sen ordena que la Escuela Nacional Superior Normal, la Escuela de Derecho y Política de Guangdong y la Escuela Agrícola de Guangdong se unan a la Universidad Nacional de Guangdong y nombra a Zou Lu para prepararlas. Nadie en la ciudad puede decir todavía dónde está esta universidad.'
      sun_dies: '{date}: Muere Sun Yat-sen en Pekín.'
      renamed: '{date}: El Gobierno Nacional ordena que la Universidad Nacional de Guangdong pase a llamarse Universidad Nacional Sun Yat-sen.'
      lecture_jan27: '{date}: Un domingo. Sun Yat-sen da la primera de sus conferencias sobre los Tres Principios del Pueblo en el salón de la Escuela Normal Superior.'
      lecture_feb17: '{date}: Un domingo. Sun Yat-sen da una conferencia en el salón de la Escuela Normal Superior. La serie comenzó el 27 de enero y esta es la cuarta conferencia. Al costado del andén un hombre escribe sin levantar la vista. Ese es Huang Changgu, que está ahí para todos.'
      zou_takes_up: '{date}: Zou Lu retoma la preparación.'
      hall_feb24: '{date}: Un domingo otra vez. La quinta conferencia se da hoy en el salón y Zou Lu convoca aquí a los estudiantes de las tres escuelas para anunciar la preparación.'
      first_meeting: '{date}: Se realiza la primera reunión preparatoria, teniendo en su agenda la graduación de los alumnos de los tres colegios. De los treinta y cinco miembros del comité preparatorio, treinta y uno han estudiado en el extranjero.'
      first_meeting_book: '{date}: Se realiza la primera reunión preparatoria, teniendo en su agenda la graduación de los alumnos de los tres colegios. De los treinta y cinco miembros del comité preparatorio, treinta y uno han estudiado en el extranjero. En esta rama, los nombres de las promociones de las tres escuelas se encuentran ahora en un solo libro.'
      proofs_travel: 'Durante marzo el texto de las conferencias pasa de mano en mano. Las notas de Huang Changgu se copian limpiamente y se envían a Sun Yat-sen, él las lleva a Zou Lu para que las lea, Zou Lu pega tiras en las páginas y las devuelve, Sun las corrige de su propia mano y vuelven a aparecer.'
      preface: '{date}: Sun Yat-sen escribe el prefacio del folleto de las primeras conferencias. Se imprime a finales de marzo.'
      lecture_apr20: '{date}: Un domingo. Las conferencias en la sala han llegado a su segunda parte.'
      measures_sent: '{date}: Zou Lu presenta las medidas para la unión de las tres escuelas.'
      measures_approved: '{date}: Se aprueban las medidas.'
      shipai_chosen: 'Este año, Sun Yat-sen le dice a Zou Lu que elija un nuevo campus en Shipai, al este de la ciudad. Las escuelas están repartidas en varios lugares y son difíciles de gestionar.'
      last_lecture: '{date}: La decimosexta conferencia. La tercera parte sólo ha llegado a su cuarta conferencia y el resto nunca se da. Nadie en el pasillo sabe que este es el último.'
      classes_begin: '{date}: Comienzan las clases en la Universidad Nacional de Guangdong.'
      ceremony: '{date}: Se lleva a cabo la ceremonia de fundación, con el lema que escribió Sun Yat-sen: estudie ampliamente, indague cuidadosamente, piense con prudencia, discierna claramente, practique con seriedad. No está allí y abandona Guangzhou dos días después.'
      sunday_first: '{date}: {staff} está presionado en el fondo del pasillo, muy lejos de la plataforma, capaz de ver al hombre pero incapaz de escucharlo todo.'
      sunday_stall: '{date}: {staff} no puede entrar al pasillo y instala un puesto en la puerta. Cuando la sala se vacía, la multitud se desborda y todo se vende en un instante.'
      sunday_sit: '{date}: {staff} encuentra un lugar en una última fila del salón y se sienta desde la primera palabra hasta la última sin moverse.'
      records_begun: '{date}: {staff} comienza a copiar los registros de las tres escuelas en un solo libro.'
      records_read_aloud: '{date}: Nadie puede leer la mano de {staff}. Entonces {staff} lee los nombres y un empleado escribe, y los tres registros comienzan a convertirse en uno.'
      records_shut: '{date}: Copiar los registros requiere lectura, y {staff} no participa en ello, pero llega a conocer a los guardianes de las tres escuelas. Para saber quién está dónde, es más rápido preguntar {staff} que pasar las páginas.'
      records_done: '{date}: Los registros de las tres escuelas son un solo libro, antes de la primera reunión preparatoria.'
      records_late: '{date}: Los registros de las tres escuelas son un solo libro. Ya se ha celebrado la primera reunión preparatoria.'
      sites_done: '{date}: {staff} ha recorrido cada uno de los sitios repartidos por la ciudad y los ha dibujado en una hoja, con el tiempo que se tarda en caminar de uno a otro.'
      asked_inside: '{date}: Los dependientes ya no dejan a {staff} esperando en la puerta, y los llaman.'
      copy_kept: '{date}: {staff} envuelve el folleto y lo guarda con sus cosas.'
      exhausted: '{date}: {staff} está tan cansado que le tiemblan las manos y tiene que descansar.'
      spoiler: '{date}: {staff} sabe que dentro de dos años esta escuela llevará el nombre del hombre que la encargó. {staff} escribe la frase en la última página del cuaderno y lo cierra.'
      spoiler_said: '{date}: {staff} le dice a un empleado en su copia que dentro de dos años esta escuela tomará el nombre del hombre que la ordenó. El empleado no levanta la vista. El hombre todavía está vivo, dice, y quién le pone ese nombre a una escuela.'
      errand: '{date}: Las páginas con tiras pegadas entran y salen de la sala de fotocopias. {staff} está afuera y solo ve la espalda de quien los lleva.'
      errand_carried: '{date}: En esta rama el que se envía a llevar las páginas es una vez {staff}. Un fajo de papeles con tiras pegadas va de un extremo al otro, y ni una sola hoja está arrugada.'
      errand_frail: '{date}: {staff} se queda sin aliento después de unas cuantas escaleras y no puede cargar las páginas, y se sienta en la puerta de la sala de fotocopias viendo entrar y salir las páginas con sus hojas.'
      pamphlet: '{date}: El folleto, nuevo de la imprenta, se encuentra sobre el escritorio de un empleado. {staff} ve la cubierta a través de la ventana.'
      pamphlet_traded: '{date}: {staff} cambia lo que hacen con sus propias manos por una copia del folleto, nuevo de la imprenta.'
      pamphlet_given: '{date}: Un empleado le entrega a {staff} una copia del folleto, nuevo de la imprenta, y dice que todos en la sala deben tener uno.'
      homesick_may: '{date}: Un mes sin nada registrado. {staff} lleva un recuento en el cuaderno y llega a los cien días. En la oficina han pasado poco más de tres días.'
      shipai_walk: '{date}: {staff} se entera de que el nuevo campus estará en Shipai, al este de la ciudad. Hoy en día no hay ningún viaje allí.'
      shipai_reached: '{date}: {staff} sale de la ciudad hacia el este y llega a Shipai. {staff} sabe lo que quedará aquí, se queda mucho tiempo y dibuja lo que está aquí ahora.'
      shipai_frail: '{date}: {staff} sabe lo que sucederá en Shipai, al este de la ciudad. Es una caminata larga y hoy {staff} se queda en la ciudad.'
      last_seat: '{date}: {staff} escucha esta conferencia desde el lugar habitual y se queda sentado un rato después de que la sala se ha vaciado.'
      last_stall: '{date}: {staff} trae más a la puerta del salón que otros domingos. {staff} sabe que los próximos domingos no habrá tanta aglomeración en esta puerta.'
      enrol_open: '{date}: Se abre la inscripción para el examen preparatorio. La víspera, la universidad solicitó a las direcciones provinciales de educación la inscripción de estudiantes, con 520 plazas previstas.'
      grad_ceremony: '{date}: Zou Lu asume el cargo de presidente y la ceremonia de graduación de las tres escuelas se lleva a cabo el mismo día.'
    labels:
      sick: 'Asuntos aún abiertos'
      dead: 'Asuntos que ya nadie pregunta'
      deaths: 'Asuntos que transcurrieron'
      treated: 'Registros en un libro, porcentaje.'
      protected: 'Sitios visitados, porcentaje'
    identities:
      local_scholar:
        name: 'un ayudante en la sala de los copistas'
        cover: '{staff} dice que han tenido algunos estudios, escriben bien y estarían encantados de ayudar con las copias.'
      pen:
        name: 'un reportero de afuera'
        cover: '{staff} dice que escriben para un periódico en otro lugar y quieren ver cómo se construye la nueva universidad.'
      wanderer:
        name: 'un viajero que ha venido a escuchar las conferencias'
        cover: '{staff} dice que están de viaje, escucharon que alguien habla aquí los domingos y han venido a escuchar.'
      maker:
        name: 'alguien vendiendo en la puerta del pasillo'
        cover: '{staff} dice que tienen un negocio y les gustaría establecer dónde está la multitud.'
      far_guest:
        name: 'un invitado fuera de un barco'
        cover: '{staff} dice que vinieron en un barco y estarán en Guangzhou por un tiempo.'
    personal:
      records_read_aloud:
        s_fan: '{date}: Shen Fan escribe una mano que tiene que adivinar por sí mismo. Lee los nombres y un empleado escribe y, a medida que avanzan, marca cada nombre que aparece en dos de los tres registros.'
        s_somchai: '{date}: Somchai sabe leer, pero sus manos son torpes y nadie puede entender lo que escribe. Lee los nombres y un empleado escribe. En el templo, cuando los demás estaban arreglando el techo, él era quien sostenía la escalera.'
      sunday_first:
        s_fan: '{date}: Shen Fan está presionado en el fondo del pasillo y no puede escucharlo todo, por lo que cuenta cuántos hay en el pasillo y cuántos están tomando notas, y escribe los dos números.'
        s_samuel: '{date}: Samuel está presionado en el fondo del pasillo, tomando notas de puntillas. Está demasiado lejos y la mitad de lo que escribe son los rostros de las personas que escuchan.'
        s_amara: '{date}: Amara está presionada al fondo del pasillo y no puede escucharlo todo. Un estudiante a su lado ha permanecido demasiado tiempo y se desmaya. Ella lo ayuda a sentarse y cuenta un rato en su muñeca.'
      spoiler:
        s_fan: '{date}: Shen Fan sabe que dentro de dos años esta escuela tomará el nombre del hombre que la ordenó, y que cien años después partirá de su estatua. Escribe las dos frases en la última página del cuaderno y lo cierra.'
        s_guilan: '{date}: Guilan sabe que dentro de dos años esta escuela cambiará de nombre. No puede escribir los personajes, así que los recita una vez mentalmente y no se lo cuenta a nadie.'
        s_somchai: '{date}: Somchai sabe que dentro de dos años esta escuela tomará el nombre del hombre que la ordenó. Escribe la frase en la última página del cuaderno, lo cierra y va a preguntarle a un dependiente qué está leyendo.'
        s_carlos: '{date}: Carlos sabe que en dos años esta escuela cambiará de nombre. No puede escribirlo, así que se lo cuenta al horno y se ríe antes de terminar.'
        s_samuel: '{date}: Samuel sabe que dentro de dos años este colegio cambiará de nombre, una noticia que nadie más tiene. Lo escribe en la última página del cuaderno y lo vuelve a tachar. No hay ningún lugar para archivarlo.'
        s_amara: '{date}: Amara sabe que en dos años esta escuela cambiará de nombre. Escribe la frase en la última página del cuaderno y lo cierra.'
      pamphlet_given:
        s_fan: '{date}: Un empleado le entrega a Shen Fan una copia del folleto, nuevo de la imprenta, y le dice que todos en la sala deben tener uno. Shen Fan pasa primero al prefacio y mira la fecha debajo.'
        s_samuel: '{date}: Un empleado le entrega a Samuel una copia del folleto, nueva de la imprenta. Pregunta qué imprenta es y el dependiente dice que la primera.'
      errand_frail:
        s_fan: '{date}: Shen Fan se queda sin aliento después de subir algunas escaleras y no puede cargar las páginas. Se sienta en la puerta de la sala de fotocopias y cuenta cuántas vueltas da un texto.'
        s_somchai: '{date}: Somchai se queda sin aliento después de subir algunas escaleras y no puede cargar las páginas. Se sienta en la puerta de la sala de fotocopias y observa cómo entran y salen las páginas con sus hojas.'
        s_samuel: '{date}: Samuel ha vuelto a tener problemas de estómago desde hace unos días y se queda sin aliento al subir unas escaleras. Se sienta a la puerta de la sala de fotocopias y anota la hora de cada traslado de las páginas.'
      homesick_may:
        s_fan: '{date}: Un mes sin nada registrado. Shen Fan lleva la cuenta en el cuaderno hasta que llega a los cien días y luego vuelve a calcularla al lado. En la oficina han pasado poco más de tres días.'
        s_guilan: '{date}: Un mes sin nada registrado. Guilan cuenta los días. En casa, los chiles ya deberían estar enterrados. En la oficina han pasado poco más de tres días.'
        s_somchai: '{date}: Un mes sin nada registrado. Somchai todavía quiere ver nieve una vez, y no hay ninguna en Guangzhou en mayo. En la oficina han pasado poco más de tres días.'
        s_carlos: '{date}: Un mes sin nada registrado. Carlos se despierta a las tres de la mañana. Su horno no está aquí y se queda toda la mañana junto a la estufa de otra persona, observando. En la oficina han pasado poco más de tres días.'
        s_samuel: '{date}: Un mes sin nada registrado, el más duro para un reportero. Samuel lleva la cuenta en el cuaderno y llega a cien días. En la oficina han pasado poco más de tres días.'
        s_amara: '{date}: Un mes sin nada registrado. Amara calcula cuántos niños debe haber visto nacer el pupilo en estos cien días. En la oficina han pasado poco más de tres días.'
        s_jeanluc: '{date}: Un mes sin nada registrado. Jean-Luc escribe una línea al día, como en un diario en el mar, hasta llegar a cien. En la oficina han pasado poco más de tres días.'
      shipai_frail:
        s_fan: '{date}: Shen Fan sabe lo que se construirá en Shipai, al este de la ciudad. Está demasiado lejos y no puede caminar.'
        s_somchai: '{date}: Somchai sabe lo que sucederá en Shipai, al este de la ciudad. Está demasiado lejos y no puede caminar.'
        s_samuel: '{date}: Samuel sabe lo que habrá en Shipai, al este de la ciudad, y que sería una buena pieza. Está demasiado lejos y no puede caminar.'
      last_seat:
        s_fan: '{date}: Shen Fan escucha esta conferencia desde el lugar habitual y la cuenta en su cuaderno se detiene en dieciséis. Se queda sentado un rato después de que el salón se ha vaciado.'
        s_guilan: '{date}: Guilan escucha esta conferencia desde el lugar habitual. Cuando la sala se ha vaciado, ella no va en seguida y ordena los bancos uno por uno.'
        s_somchai: '{date}: Somchai escucha esta conferencia desde el lugar habitual. Permanece sentado un rato después de que la sala se ha vaciado, ya que solía esperar en el templo la última campana.'
        s_samuel: '{date}: Samuel saca esta conferencia del lugar habitual. Sabe que es el último y en el cuaderno escribe sólo su número y no la palabra último.'
        s_amara: '{date}: Amara escucha esta conferencia desde el lugar habitual. Se queda sentada un rato más, hasta que la última persona sale por la puerta.'
        s_jeanluc: '{date}: Jean-Luc escucha esta conferencia de pie en el lugar habitual. Él es el último en abandonar la sala, como un capitán es el último en abandonar el barco.'
      records_shut:
        s_guilan: '{date}: Guilan dejó la escuela después del tercer año y no participa en la copia de los registros. Llega a conocer a los guardianes de las tres escuelas. Para saber quién está dónde, es más rápido preguntarle que pasar las páginas.'
        s_carlos: '{date}: Carlos escribe sólo su propio nombre y no participa en la copia de los registros. Llega a conocer a los guardianes de las tres escuelas. Para saber quién está dónde, es más rápido preguntarle que pasar las páginas.'
      sunday_sit:
        s_guilan: '{date}: Guilan se sienta en una última fila del pasillo, con las rodillas mal y todo, y se queda desde la primera palabra hasta la última. No sigue todo lo que se dice en la plataforma. La estudiante que está a su lado tiene sed y le entrega el agua.'
        s_somchai: '{date}: Somchai escuchó sermones en el templo durante veinte años y se sienta en la última fila del salón hasta el final. Mientras se vacía, le pregunta al estudiante que está a su lado qué ha estado leyendo.'
        s_jeanluc: '{date}: Jean-Luc tiene problemas de espalda e insiste en estar de pie, y se queda al fondo del pasillo desde la primera palabra hasta la última.'
      pamphlet:
        s_guilan: '{date}: El folleto, nuevo de la imprenta, se encuentra sobre el escritorio de un empleado. Guilan lo ve a través de la ventana y conoce a dos de los personajes de la portada.'
        s_somchai: '{date}: El folleto, nuevo de la imprenta, se encuentra sobre el escritorio de un empleado. Somchai ve la manta a través de la ventana. Sabe cuántos ejemplares de este libro habrá algún día y sólo le pregunta al empleado hasta dónde ha llegado.'
        s_amara: '{date}: El folleto, nuevo de la imprenta, se encuentra sobre el escritorio de un empleado. Amara lo ve por la ventana y empieza a tararear.'
        s_jeanluc: '{date}: El folleto, nuevo de la imprenta, se encuentra sobre el escritorio de un empleado. Jean-Luc ve la manta a través de la ventana.'
      errand:
        s_guilan: '{date}: Las páginas con tiras pegadas entran y salen de la sala de fotocopias. Guilan se sienta afuera cortando verduras y pregunta a todos los que salen si han comido.'
        s_amara: '{date}: Las páginas con tiras pegadas entran y salen de la sala de fotocopias. Amara está afuera y solo ve la espalda de quien los lleva, y por los pasos se da cuenta de que tiene prisa.'
        s_jeanluc: '{date}: Las páginas con tiras pegadas entran y salen de la sala de fotocopias. Jean-Luc está afuera enseñando al hijo de un portero a hacer nudos y solo ve la espalda de quien los lleva.'
      shipai_reached:
        s_guilan: '{date}: Con malas rodillas y todo, Guilan camina hacia Shipai paso a paso. Sólo hay campos. Se pone en cuclillas, frota un pellizco de tierra entre los dedos y dice que aquí crecerán cosas.'
        s_carlos: '{date}: Carlos empuja su carro fuera de la ciudad hacia el este y llega a Shipai, y regresa diciendo que allí solo hay campos. Sabe que allí se construirá una universidad, y aún así dice, sólo campos.'
        s_amara: '{date}: Amara sale de la ciudad hacia el este y llega a Shipai. Ella sabe lo que quedará aquí, se queda mucho tiempo y dibuja lo que está aquí ahora, lentamente.'
      sunday_stall:
        s_carlos: '{date}: Carlos no entiende lo que se dice dentro, y instala un horno en la puerta del salón para hornear pan. Cuando la sala se vacía, la multitud se desborda y el pan se acaba en un instante, ya que, como de costumbre, se vende demasiado barato.'
      pamphlet_traded:
        s_carlos: '{date}: Carlos cambia un horno lleno de pan por una copia del folleto, nueva de la imprenta. No puede leerlo por sí mismo y dice que es para el niño de casa que quiere hacerse cargo de la panadería.'
      errand_carried:
        s_carlos: '{date}: En esta sucursal el que manda a llevar los pajes es una vez Carlos. Un fajo de papeles con tiras pegadas, de las que no puede leer ni una palabra, y ni una sola hoja está arrugada.'
      last_stall:
        s_carlos: '{date}: Carlos hornea un horno más de lo habitual. Sabe que los próximos domingos no habrá tanta gente en esta puerta y regala lo que queda.'
      records_begun:
        s_amara: '{date}: Amara comienza a copiar los registros de los tres colegios. El trabajo escrito siempre ha sido difícil para ella, por lo que copia una línea y le pide a un empleado que la revise.'
      spoiler_said:
        s_jeanluc: '{date}: Jean-Luc le dice a un empleado de su copia que dentro de dos años esta escuela tomará el nombre del hombre que la encargó, y no levanta la voz para decirlo. El empleado no levanta la vista. El hombre todavía está vivo, dice, y quién le pone ese nombre a una escuela.'
      shipai_walk:
        s_jeanluc: '{date}: Jean-Luc se entera de que el nuevo campus estará en Shipai, al este de la ciudad. Sus rodillas no le permiten llegar tan lejos y se queda un rato en el muelle mirando hacia el este.'
