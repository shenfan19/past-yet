eras:
  sun_yat_sen_1924:
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salón de la Escuela Normal Superior"
    blurb: "En un mismo salón toman forma una universidad y un libro. Pasan siete meses entre la orden de unir las escuelas y tu partida, dieciocho días antes de que empiecen las clases. Aquí comienza el juego."
    handle_label: "Las notas se convierten en un libro"
    protagonist_role: "Un estadista que ha ordenado unir tres escuelas en una universidad y que da conferencias los domingos en su salón"
    stay: "Permanecer siete días de oficina, 210 días en el pasado"
    plan_baseline: "Cronología original"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} enferma en Guangzhou. El amuleto de retorno le trae de vuelta y despierta ante la estatua."
      stay_and_gifts: "{staff} terminó el trabajo y no regresó. Dejó una nota: quiere quedarse para ver abrir la universidad. Los regalos llegarán más tarde."
      gave_up: "{staff} no aguantó hasta el final. Al despertar ante la estatua, dijo que ya no podía quedarse en la Guangzhou de 1924."
      legend: "{staff} despertó ante la estatua con un folleto impreso en marzo de 1924 entre sus cosas. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      perfect: "{staff} regresó a la estatua. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      modest: "{staff} pasó doscientos diez días en Guangzhou, hizo cuanto estuvo a su alcance y volvió ante la estatua. El día de la partida faltaban {countdown:i} días para el inicio de clases."
    star_points:
      site: "Entregar a la oficina un plano de los terrenos antes de que se elija el nuevo campus"
      copy: "Traer un ejemplar del libro de las conferencias"
      last: "Asistir a la última conferencia"
