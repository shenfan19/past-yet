    event_titles:
      asked_the_way: 'preguntó el camino'
    plots: {}
    encyclopedia:
      history:
        - text: 'El 4 de febrero de 1924, Sun Yat-sen ordenó que la Escuela Nacional Normal Superior, la Escuela de Derecho y Política de Guangdong y la Escuela Agrícola de Guangdong se unieran a la Universidad Nacional de Guangdong y nombró a Zou Lu para prepararlas.'
          check: true
        - text: 'Del 27 de enero al 24 de agosto de 1924, Sun dio conferencias los domingos en el salón de la Escuela Normal Superior, dieciséis conferencias en total. Huang Changgu anotó cada uno de ellos, Zou Lu leyó las copias limpias y pegó hojas en ellas, y Sun las corrigió con su propia mano.'
          check: true
        - text: 'Zou Lu retomó los preparativos el 21 de febrero. El 24 de febrero convocó a los alumnos de las tres escuelas en el salón para anunciarlo, y el 3 de marzo se celebró la primera reunión preparatoria, con la graduación de los alumnos de las tres escuelas en su orden del día.'
          check: true
        - text: 'Las primeras conferencias se imprimieron en forma de folleto a finales de marzo, con un prefacio que Sun escribió el 30 de marzo. El 3 de junio, Zou Lu presentó las medidas para la incorporación a las escuelas, que fueron aprobadas el 6 de junio.'
          check: true
        - text: 'Las clases comenzaron el 19 de septiembre y el acto de fundación se celebró el 11 de noviembre con el lema Sun escribió. Sun murió en Beijing el 12 de marzo de 1925 y en 1926 la universidad pasó a llamarse Universidad Nacional Sun Yat-sen.'
          check: true
      regret:
        - 'Saldrás el 1 de septiembre. Las clases comienzan el día 19 y después se escribe el lema.'
        - 'Las conferencias terminaron en el día dieciséis. Nadie en el pasillo sabía que era el último.'
    events:
