eras:
  sun_yat_sen_1924:
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salón de la Escuela Normal Superior"
    blurb: "Tres escuelas han de convertirse en una sola universidad. Pasan siete meses entre la orden de unir las escuelas y tu partida, dieciocho días antes de que empiecen las clases. Aquí comienza el juego."
    handle_label: "Las notas se convierten en un libro"
    protagonist_role: "Un estadista que ha ordenado unir tres escuelas en una universidad y que da conferencias los domingos en su salón"
    stay: "Permanecer siete días de oficina, 210 días en el pasado"
    plan_baseline: "Cronología original"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} enferma en Guangzhou. El amuleto de retorno le trae de vuelta y despierta ante la estatua."
      stay_and_gifts: "{staff} terminó el trabajo y no regresó. Dejó una nota: quiere quedarse para ver abrir la universidad. Los regalos llegarán más tarde."
      gave_up: "{staff} no aguantó hasta el final. Al despertar ante la estatua, dijo que ya no podía quedarse en la Guangzhou de 1924."
      legend: "{staff} despertó ante la estatua con un folleto impreso en marzo de 1924 entre sus cosas. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      perfect: "{staff} regresó a la estatua. En la cronología original se dejaron caer {base_D:i} asuntos porque nadie volvió a preguntar; en esta rama, {D:i}. El día de la partida faltaban {countdown:i} días para el inicio de clases."
      modest: "{staff} pasó doscientos diez días en Guangzhou, hizo cuanto estuvo a su alcance y volvió ante la estatua. El día de la partida faltaban {countdown:i} días para el inicio de clases."
    star_points:
      xue: 'Estudiar con amplitud: antes de que se abra la inscripción, hacer que la oficina fije el aviso de admisión también fuera de la ciudad, para que lleguen a tiempo los estudiantes de fuera'
      wen: 'Indagar con cuidado: antes de la primera reunión preparatoria, averiguar los problemas de cada una de las tres escuelas y entregarlos en una sola lista'
      si: 'Pensar con prudencia: antes de elegir el nuevo campus, recorrer y comparar los solares de la ciudad y el terreno de Shipai, y entregar un mapa a la oficina'
      bian: 'Discernir con claridad: poner en orden las listas de los cursos que se gradúan y no coinciden, y sostener la graduación del 21 de junio'
      xing: 'Practicar con constancia: ir a Shipai y clavar, estaca a estaca, los lindes del nuevo terreno'
    points_fail:
      xue: 'En esta rama el aviso solo se fija en la ciudad, y los estudiantes de fuera se enteran cuando la inscripción ya ha empezado.'
      wen: 'La primera reunión preparatoria se celebra como en la historia, cada escuela sigue hablando solo de sus propios problemas y no hay una lista que los reúna.'
      si: 'Shipai se elige como en la historia, y la oficina no tiene ninguna hoja con los solares dibujados juntos.'
      bian: 'Las listas de los graduados nunca se ordenan y la ceremonia del 21 de junio no puede celebrarse en su día. Esta rama se ha desprendido de la historia, y la agencia hace volver al empleado ese mismo día.'
      xing: 'El terreno de Shipai queda marcado solo en el papel, como en la historia, y no se clava en él ni una estaca.'
    shift:
      xue:
        was: '9 de junio de 1924: la Universidad Nacional de Guangdong encarga la admisión a las oficinas provinciales de educación, y el 10 de junio se abre la inscripción al examen preparatorio, con 520 plazas previstas.'
        now: 'En esta rama el aviso de admisión también se fija en los cruces de fuera de la ciudad y en los muelles.'
      wen:
        was: '3 de marzo de 1924: se celebra la primera reunión preparatoria, y lo primero del orden del día es la graduación de los alumnos de las tres escuelas.'
        now: 'En esta rama hay sobre la mesa de la reunión una lista con los problemas de las tres escuelas.'
      si:
        was: '1924: las escuelas están repartidas en varios lugares y son difíciles de llevar, Sun Yat-sen encarga a Zou Lu elegir un nuevo campus en Shipai, y el terreno se delimita ese año.'
        now: 'En esta rama, junto a los papeles de la elección hay un mapa de los solares y de Shipai.'
      bian:
        was: '21 de junio de 1924: Zou Lu asume la presidencia de la Universidad Nacional de Guangdong, y ese mismo día se celebra la graduación de las tres escuelas.'
      xing:
        was: '1924: Sun Yat-sen hace que Zou Lu elija Shipai para el nuevo campus, pero la obra no empieza hasta 1933 y las primeras facultades no se trasladan hasta el otoño de 1934. Sun muere el 12 de marzo de 1925 sin verlo.'
        now: 'En esta rama, antes de que deje Cantón en noviembre, los lindes del terreno de Shipai ya están clavados, estaca a estaca.'
        who: sun_yat_sen_guangzhou
        bio: 'En esta línea temporal, los lindes del nuevo campus de Shipai quedan fijados antes de que Sun Yat-sen deje Cantón.'
    shift_all: 'El lema son cinco expresiones que Sun Yat-sen escribió de su mano: estudiar con amplitud, indagar con cuidado, pensar con prudencia, discernir con claridad, practicar con constancia. Las cinco palabras escritas en la esquina de las notas del empleado son las suyas, palabra por palabra.'
quotes:
  sun_motto: {who: 'Sun Yat-sen', quote: 'Estudiar con amplitud, indagar con cuidado, pensar con prudencia, discernir con claridad, practicar con constancia.', occasion: 'el lema que escribió para la Universidad Nacional de Guangdong'}
  sun_great_things: {who: 'Sun Yat-sen', quote: 'Os exhorto a proponeros hacer grandes cosas, y no llegar a ser grandes funcionarios.', occasion: 'discurso a los estudiantes de la Universidad Lingnan'}
