ui:
  welcome:
    title: Welcome
    story: "You run a small agency that sends people into the past. History cannot be changed, so every trip happens on a branch of its own, and how far the branch differs from the main timeline is paid to you as time energy. Collect enough of it and you can go home to your family."
    how_title: How to play
    how:
      - "Pick a place on the map and the time you want there."
      - "Choose who goes and what they carry, then send them."
      - "Wait for them to come home and read what happened. They bring funds, time energy and sometimes an antique."
      - "An antique opens the place it points to, and it only leads to earlier times."
    places_title: Your first places
    places_hint: "These are open from the start. The latest of them reaches the farthest back, because an antique only leads to earlier times."
    reroll: Draw the two random ones again
    tutorial: first trip
    disclaimer_title: About the people in the game
    disclaimer: "The employees and their stories are invented. Some lean on common impressions of a place or a group, and some are written against them, and neither says anything about a real group. The author cannot know every culture well, so an AI also looked for anything that might offend, and it can be wrong. If something is unfair, inaccurate or hurtful, please report it in the {issues} of the repository and it will be changed as soon as possible."
    issues: Issues
    begin: Begin
