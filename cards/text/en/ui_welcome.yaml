    acknowledge: I understand
    story: "You run a time-travel agency, sending employees into the past and reading the reports they bring home. Protect key moments and mend old regrets to earn enough time energy to return home."
    story_start: The story begins at the bronze statue of Dr Sun Yat-sen at Sun Yat-sen University and commemorates the 160th anniversary of his birth.
    how_title: How to play
    how:
      - "Pick a place on the map and the time you want there. The clock starts when the first trip goes out."
      - "Choose who goes and what they carry, then send them."
      - "Wait for the staff to return and read their reports. They bring back time energy and sometimes antiques. Transfer antiques to the institute to receive research funding."
      - "An antique opens the place it points to, and it only leads to earlier times."
