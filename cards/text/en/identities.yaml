# Who an employee is taken for in a place. name is what the identity is called, cover is the account the employee gives of where they come from, written into the report on arrival.
# A story may give an identity its own name and cover in its own text.
identities:
  local_hand: {name: a local looking for work, cover: '{staff} says they have come looking for work.'}
  local_scholar: {name: a local who can read and write, cover: '{staff} says they have had some schooling and can write and reckon.'}
  healer: {name: a healer, cover: '{staff} says they know some medicine and carry their own remedies.'}
  pen: {name: an outsider with a pen, cover: '{staff} says they write for a newspaper and have come to see.'}
  scholar_guest: {name: a visiting scholar, cover: '{staff} says they are a scholar from elsewhere and want to see how things are done here.'}
  wanderer: {name: a wanderer, cover: '{staff} says they are on the road and passing through.'}
  maker: {name: someone who lives by a trade, cover: '{staff} says they have a trade and work it wherever they go.'}
  far_guest: {name: a guest from far away, cover: '{staff} says they come from far away and are waiting for a ship.'}
  lodger: {name: a stranger who has found lodging, cover: '{staff} says they are passing through and looking for a place to stay a while.'}
