    update_notes: "Update notes"
    preview:
      title: "Early version"
      project: "This game is a playable front end for Life Matters (LM), a research project that helps us develop the simulation engine. You don’t need to understand the research to enjoy the game."
      changes: "As we add features, the rules and what items or actions do may change. We’ll try to carry your progress forward, but a major update may make an older save unusable."
    title: About The Past Is Yet to Come
    version_line: '{app} {v}, released {date}'
