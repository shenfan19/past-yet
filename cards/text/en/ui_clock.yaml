ui:
  clock:
    day: Day {n}
    pause: Pause
    speed: Speed
    auto: Auto
    auto_tip: When on, the agency collects reports, restocks and dispatches by itself, so you can just watch. The secretary's traits add bonuses. The secretary has a preference too - if the auto results suit it, mood goes up, otherwise down.
    paused_report: A report is waiting, paused
    start_hint: The clock starts at the first trip
    start_tip: "Until the first trip goes out nothing happens, and the wages would only run down the funds, so the clock stands still. Pick a place on the map and send someone."
    low_funds: "Funds low, held to {n}x"
    low_tip: "The funds pay fewer than three days of wages, so the clock cannot go faster. Sell a spare antique or send a trip that pays."
    broke_title: The wages could not be paid
    broke_text: "The funds ran out and a day went unpaid, so the staff lost heart and the clock is paused. Sell a spare antique, let someone go or send a trip that pays, then pick a speed to go on."
    broke_ok: Understood
    back_one: "{a} is home"
    back_two: "{a} and {b} are home"
    back_many: "{a}, {b} and {n} more are home"
    back_view: View
