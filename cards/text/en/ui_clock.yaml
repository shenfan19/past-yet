ui:
  clock:
    day: Day {n}
    pause: Pause
    speed: Speed
    auto: Auto
    nostop: Keep running on reports
    nostop_tip: When ticked, the clock keeps running when someone comes back. When not ticked, it pauses at each report so nothing is missed.
    auto_tip: When on, the agency collects reports, restocks and dispatches by itself, so you can just watch. The secretary's traits add bonuses. The secretary has a preference too - if the auto results suit it, mood goes up, otherwise down.
    paused_report: A report is waiting, paused
