strategies:
  focus:
    balanced:
      name: Balanced
      desc: Treat the sick, save the water, and meet the local doctor when there is time.
    cure:
      name: Patients first
      desc: Rehydration first, protection second, little talking.
    prevent:
      name: Water first
      desc: Hand out chlorine, teach boiling, patients come last.
    ally:
      name: Work with the local doctor
      desc: Spend time with Snow and help carry his evidence to the people who need it.
  on_block:
    yield:
      name: Yield
      desc: Step back, no quarrel.
    insist:
      name: Insist
      desc: Stand at the door and say it, lose some gear if needed.
    appeal:
      name: Appeal
      desc: Turn and go to Snow for help.
