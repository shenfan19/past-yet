ui:
  home:
    lead: You run a time travel agency. Send employees into the past, earn time energy, and save up enough to go back to your own time and see your family.
    mainline_title: Premise and rules
    mainline:
      - Send someone out, wait a while, read the report when they return. You do not have to watch. Reading the report is the reward.
      - History cannot be changed. Everything an employee does lands on a parallel branch and the main timeline stays as it was. The difference between the branch and the main timeline is converted into time energy.
      - Agency rules: no wars, no regime changes. Only medicine, technology, documents, daily life and witnessing.
      - Employees do not die. When one is about to, the recall charm pulls them back at a cost, and the story goes on.
