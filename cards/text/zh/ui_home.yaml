ui:
  home:
    lead: 你是穿越事务所的所长。雇员工去古代做事，赚时空能量，攒够了回自己的时空见家人。
    mainline_title: 设定与规则
    mainline:
      - 派出去，等一会儿，读一份归来报告。不盯着也可以，回来读报告是奖励。
      - 历史不可改变。员工做的一切都落在平行分支上，主时间线保持原样，分支与主时间线的差换算成时空能量。
      - 事务所守则：不介入战争，不介入政权更替，只做医疗、技术、文献、民生、见证。
      - 员工不会死。濒死时被回收符接回，付出代价，但不结束。
    materials_title: 主要资料
    materials_model: 每个时空是一份公开的 YAML 模型，数字都带出处标签：史实、LM 模型、游戏设定、校准值。
    materials_enc: 人物、事件、地区、属性和员工都收在百科里，可以跳转，可以按标签和文字过滤，尽量附出处。
    go_title: 去哪里
    go:
      shop:
        name: 商店
        desc: 资金买现代物资，时空能量买未来物品。锚定古董，或卖掉多余的。
      enc:
        name: 百科
        desc: 可跳转可过滤的资料页，附出处。
