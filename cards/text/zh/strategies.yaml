strategies:
  focus:
    balanced:
      name: 均衡
      desc: 有病人就治，有水可救就救，有空就见当地医生。
    cure:
      name: 先救病人
      desc: 补液优先，防护次之，少去找人聊。
    prevent:
      name: 先保水
      desc: 分氯片，教煮水，病人排在后面。
    ally:
      name: 与当地名医合作
      desc: 多花时间在斯诺身上，帮他把证据送到该去的人面前。
  on_block:
    yield:
      name: 让步
      desc: 退一步，不吵。
    insist:
      name: 坚持
      desc: 站在门口说清楚，丢点东西也要进去。
    appeal:
      name: 求助
      desc: 转头去找斯诺帮忙说话。
