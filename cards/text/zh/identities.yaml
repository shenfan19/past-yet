# 员工在一个地方被当成什么人。name 是身份的叫法，cover 是来历的说辞，报告在入场时写出来。一个故事可以在自己的文字里换掉某个身份的叫法和说辞。
identities:
  local_hand: {name: 找活干的本地人, cover: '{staff}说自己是来找活干的。'}
  local_scholar: {name: 本地的读书人, cover: '{staff}说自己读过几年书，能写会算。'}
  healer: {name: 行医的人, cover: '{staff}说自己懂些医，随身带着药。'}
  pen: {name: 带笔的外人, cover: '{staff}说自己是替报馆写稿的，想来看看。'}
  scholar_guest: {name: 来考察的学者, cover: '{staff}说自己是外面来的读书人，想看看这里的人怎样做事。'}
  wanderer: {name: 游方的人, cover: '{staff}说自己是游方的，路过此地。'}
  maker: {name: 靠手艺吃饭的人, cover: '{staff}说自己有一门手艺，走到哪里做到哪里。'}
  far_guest: {name: 远方的来客, cover: '{staff}说自己从很远的地方来，在这里等船。'}
  lodger: {name: 落脚的外乡人, cover: '{staff}说自己是过路的，想找个地方借住些日子。'}
