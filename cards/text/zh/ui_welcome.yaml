ui:
  welcome:
    title: 欢迎
    office_title: 开局设置
    acknowledge: 我已知晓
    story: "你是一家穿越事务所的所长，派员工去过去做事。历史改变不了，每一趟都发生在自己的分支上，这条分支和主时间线差多少，就换成多少时空能量。攒够了，你就能回去见家人。"
    how_title: 怎么玩
    how:
      - "在地图上选一个地方和你想去的年代。第一趟派出后时钟才开始走。"
      - "选谁去、带什么，然后派出去。"
      - "等员工回来，读报告。他们会带回时空能量，有时也会带回古董。向研究所移交古董可获得研究补助。"
      - "古董能打开它指向的地方，而且只通向更早的时代。"
    staff_title: 你的第一批员工
    staff_hint: "随机抽出 {n} 位来自不同地区的员工。第一趟派遣出发之前可以重抽。"
    reroll_staff: 换一批候选
    places_title: 你一开始能去的地方
    places_hint: "三个地点开局就开放：事务所起步的大学，加两个随机的。第一趟派遣出发之前可以重抽。"
    places_hint_start_only: "开局开放的是事务所起步的那所大学。"
    reroll: 重抽两个随机地点
    tutorial: 第一趟
    disclaimer_title: 免责声明 · 关于游戏里的人
    disclaimer: "员工和他们的故事都是虚构的。有些贴近人们对某个地方或群体的常见印象，有些故意写成相反的，两种写法都不代表对任何真实群体的看法。作者不可能完全了解每一种文化，所以请 AI 查过有没有可能冒犯的地方，但 AI 也会出错。如果你觉得哪里不公平、不准确或者让人不舒服，请到仓库的 {issues} 反馈，会尽快修改。"
    authorship: 各卡片的署名作者对其提供的内容负责。AI 辅助生成的内容注明 AI，仍由署名的人类作者负责审核和更正。史料核对情况以卡片的出处说明为准。
    rights: "如果游戏里有任何内容侵犯了某个人或某个家庭的权益，请发邮件到 contact@teleporter.uk 或在仓库里提 issue，作者会尽快删除。"
