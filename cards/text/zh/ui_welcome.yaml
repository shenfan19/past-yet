ui:
  welcome:
    title: 欢迎
    office_title: 开局设置
    acknowledge: 我已知晓
    story: "你是一家穿越事务所的所长，派员工去过去做事。每一趟穿越都会在历史上撬开一条分支，分支多了，主时间线就开始漂移：一些关键时刻松动了，没人护住就会走岔，而你回家的那条路，也连在主时间线上。所以事务所做两件事：守护，到松动的时刻去护住该发生的事，让主时间线稳住；弥补，在分支里补上一件历史留下的遗憾。守住的节点和补上的遗憾，都换成时空能量。攒够了，你就能回去见家人。"
    story_start: 一切从中山大学的孙中山先生铜像前开始。谨以此纪念先生诞辰 160 周年。
    how_title: 怎么玩
    how:
      - "在地图上选一个地方和你想去的年代。第一趟派出后时钟才开始走。"
      - "选谁去、带什么，然后派出去。"
      - "等员工回来，读报告。他们会带回时空能量，有时也会带回古董。向研究所移交古董可获得研究补助。"
      - "古董能打开它指向的地方，而且只通向更早的时代。"
    staff_title: 你的第一批员工
    staff_hint: "随机抽出 {n} 位来自不同地区的员工。第一趟派遣出发之前可以重抽。"
    reroll_staff: 换一批候选
    places_title: 你一开始能去的地方
    places_hint: "三个地点开局就开放：事务所起步的大学，加两个随机的。第一趟派遣出发之前可以重抽。"
    places_hint_start_only: "开局开放的是事务所起步的那所大学。"
    reroll: 重抽两个随机地点
    tutorial: 第一趟
    disclaimer_title: 免责声明 · 关于游戏里的人
    disclaimer: "员工和他们的故事均为虚构。历史细节、文化表述和译文可能有错漏。如果你发现不准确、不公平或容易造成冒犯的内容，欢迎到仓库的 {issues} 反馈。"
    rights: "如果游戏里有任何内容侵犯了某个人或某个家庭的权益，请发邮件到 shenfan19@gmail.com 或在仓库里提 issue，作者会尽快删除。"
