ui:
  model:
    note: 后台模型就是这一份 YAML。游戏规则的数全部在里面，代码只负责解释它。
    variables: 变量
    provenance: 出处
    show_yaml: 展开完整 YAML
    count: 个变量
    ext: 在 LM 1.0 基础上的扩展
    ext_text:
      agents: 多主体。每个主体有自己的状态，每步在可用动作里选效用最高的一个，动作写成水平输入。
      actions: 动作的前提和效用都是对已声明变量的表达式。
      events: 带种子的随机事件，抽签只取决于种子、事件编号和出现序号。
      milestones: 表达式变真时触发一次的报告句子。
      outcomes: 有序的结局，第一个为真者生效。
      scoring: 反事实记分。同一种子再跑一次没有员工的主时间线，作为对照。
      provenance: 每个变量和事件都标明出处：史实、LM 模型、游戏设定、校准值。
      item_bindings: 出发前选的道具在到达时一次性写入对应变量。
      strategies: 员工的行事倾向由他的特质决定，派谁出去，就用谁的倾向，每个选项写入若干输入变量。
    blocks: 块
