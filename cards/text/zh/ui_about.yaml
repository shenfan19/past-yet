ui:
  about:
    title: 关于穿越事务所
    version_line: '{app} {v}，发布于 {date}'
    links:
      - id: author
        label: 作者主页
      - id: lm
        label: Life Matters
      - id: care
        label: Care for You
    sections:
      - h: 简介
        p:
          - 你经营一家穿越事务所。员工回到历史的转折点，尝试帮上忙，带着一份报告回来。不需要一直盯着，可以让它自己运行，只读发生了什么。
          - 它起于一点单纯的好奇：如果今天的人站在过去某个著名的时刻，会发生什么。希望它好玩，能随手摆弄，也适合安静地看。
          - 这是个人项目，以 MIT 许可证发布，仍在打磨，欢迎意见和建议。
      - h: 免责声明
        p:
          - 这是一个游戏，也是一次仿真练习，不是医疗、公共卫生或历史研究产品。它不提供诊断、治疗、用药或健康建议，里面的内容不应用来指导任何关于健康或安全的真实决定。
          - 模型是简化的。除非数字标为史实，参数都是游戏设定，没有任何一个参数用数据拟合过。游戏里的史实在核对出处之前只是占位，每个条目都会说明有没有核对过。请不要把这个游戏当作引用来源。
          - 约翰·斯诺、伊格纳茨·森梅尔维斯等历史人物是被演绎的形象。他们在游戏里说的话、做的事是围绕史实写的虚构，不代表他们真实的言论、观点或为人。穿越、员工、古董、商品和每一个剧情都是虚构的。
          - 游戏里的产品、名称和物品都是虚构的。名称与别人的作品相似的地方是参考，不代表有任何关联，尚未核查权利的东西会被标出，也不能在游戏里购买。
          - 游戏按现状提供，不附带任何形式的担保。如果你正处在很艰难的地方，请联系你信任的人，或者当地的专业支持。
      - h: 数据与隐私
        p:
          - 你的存档和设置只存在你自己的浏览器里，是你设备上的本地存储。页面没有账号，没有存放你数据的服务器，没有统计分析，没有广告，没有 cookie，也没有第三方跟踪，不会把你的游戏数据发到任何地方。
          - 你选的语言和你在界面里所处的位置也存在本地。首页的“清空存档”会删除存档，不能撤销。清除浏览器数据也会删除全部内容。
          - 游戏面向成年人。如果以后提供账号或云端功能，会先说明收集什么、为什么收集，收集需要你明确同意，并遵守当地的数据保护法律，例如 GDPR。
      - h: Life Matters 与驱动方式
        p:
          - 做这个游戏，是为了配合 Life Matters（LM），作为验证性和实用性的仿真尝试：把 LM 风格的模型和历史数据放进一个人人可以上手、能看到结果的场景里。
          - 每个时空是一份公开的 YAML 模型，格式是 LM 格式加几处扩展。员工和历史人物是按效用选择行动的主体，事件是带种子的随机事件，每次运行都会和同一种子下没有员工的运行对照。代码只负责解释这些文件。
          - 模型里的每个数字都带出处标签：史实、LM 模型、游戏设定或校准值。开发者模式下，百科会列出公式和变量。
          - 这是 LM 思路的一个简化 JavaScript 版本。这个原型里的模型都没有用数据拟合过。
      - h: 贡献
        p:
          - 100 个事件是有意倾斜地选的：加大了科学、技术、哲学、艺术和思想的比例，减少了政治和军事。这是第一版的取舍，不代表历史上什么更重要。
          - 欢迎添加：事件和它的遗物、员工、特质和翻译，都是 cards 文件夹里的 yaml 卡片，cards/README.md 说明了怎么加。对史实的更正同样欢迎。
          - 请在自己提供的卡片上署上姓名或笔名。署名让每张卡片都有人负责、有处可问，万一内容引起疑问，大家也能找到人商量，同时这也是对你贡献的认可，会列在本页的致谢里。暂时没有署名的卡片无法收录，还请理解。
      - h: 致谢与许可
        p:
          - 界面和逻辑是没有后端的静态网页文件。数据文件是 YAML，用 MIT 许可证的 js-yaml 读取。世界地图的轮廓来自 Natural Earth，属于公共领域。
          - 历史参考文献列在百科里，每一条都标明有没有核对过。
          - 游戏从代码、文字到设计全部用 vibe coding 完成。感谢 AI，让我在业余时间实现了这个想法。
          - 名称和 logo 不在 MIT 许可证的授权范围内。
      - h: 作者
        p:
          - 这是 Fan Shen 的个人项目。
