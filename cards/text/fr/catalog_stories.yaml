  poe_baltimore:
    name: 'Un billet du quatrième quartier'
    place: 'Baltimore'
    figure: 'Edgar Allan Poe'
    story: 'Le 27 septembre 1849, Edgar Allan Poe quitta Richmond pour sa maison de Fordham à New York et arriva à Baltimore le lendemain. On ne sait pas exactement où il se trouvera au cours des cinq prochains jours. Le 3 octobre, jour du scrutin, il fut retrouvé dans une grande détresse lors des élections du Ryan''s Fourth Ward, et l''imprimeur Joseph Walker envoya une note à Joseph Snodgrass. Il a été emmené au Washington College Hospital, tenu à l''écart des visiteurs, et y est décédé avant l''aube du 7 octobre, à l''âge de quarante ans. La cause est encore inconnue. Sa tante et belle-mère Maria Clemm l''a appris par un journal.'
    story_prose:
      opening:
        - 'Baltimore, fin septembre 1849. L''écrivain Edgar Allan Poe, quarante ans, a écrit The Raven et écrit des contes d''horreur et de détection. Cet été, il a donné une conférence à Richmond afin de récolter des fonds pour un magazine ; le 27 septembre, il partit pour son domicile de Fordham à New York et le lendemain il atteignit Baltimore. Sa tante et belle-mère, Maria Clemm, l''attend à Fordham.'
        - 'Dans l’histoire, au cours des cinq jours suivants, il n’existe aucune trace fiable de l’endroit où il se trouvait. Le 3 octobre, jour du scrutin, l''imprimeur Joseph Walker le trouva en grande détresse lors du scrutin du quatrième arrondissement et envoya une note demandant au Dr Snodgrass de venir ; il a été emmené au Washington College Hospital et placé dans la chambre pour patients amenés ivres, a dérivé dans et hors de conscience pendant des jours, a été tenu à l''écart des visiteurs et est décédé avant l''aube du 7, la cause encore inconnue. Deux jours plus tard, Maria Clemm a lu sa mort dans le journal de Fordham et a écrit à Baltimore pour lui demander. Dans cette succursale, un porteur porte les malles sur le quai, un cabaretier de la rue Lombard compte ses tonneaux et un veilleur de nuit tient la salle.'
        - 'Plusieurs types de personnes peuvent aider dans ce voyage : quelqu''un qui connaît la médecine avec une volonté ferme, ou quelqu''un méthodique ou vigilant avec une volonté plus ferme, pour prendre la note de demande d''aide et l''accompagner en toute sécurité depuis les urnes jusqu''à l''hôpital ; quelqu''un de formé en soins infirmiers ou en soins, un coursier ou un journaliste, quelqu''un de gentil, patient ou méthodique, ou quelqu''un avec un cahier et un stylo et un bel esprit, pour faire savoir à Maria Clemm ; un médecin avec un esprit vif et une forte volonté, ou quelqu''un qui connaît la médecine et porte le kit nano médical, pour l''aider à traverser le délire.'
      outcomes:
        all: 'Fin octobre, Poe quitta l''hôpital et se dirigea vers le nord, chez lui à New York. A la porte de la petite maison de Fordham, Maria Clemm se tenait debout, la lettre de Baltimore à la main, regardant le bout de la route.'
        p3: 'Fin octobre, Poe a quitté l''hôpital pour se rendre chez lui à New York, dans le nord. S''appuyant sur sa canne, il s''arrêta sur les marches de l''hôpital et boutonna son col.'
        p2: 'Avant l''aube du 7 octobre, Poe est décédé à l''hôpital. La réponse de Maria Clemm était déjà parvenue dans la salle et gisait sur le rebord de la fenêtre de cette pièce.'
        p1: 'Avant l''aube du 7 octobre, Poe est décédé au Washington College Hospital, à l''âge de quarante ans. Le lendemain, il fut enterré dans le terrain de son grand-père à Baltimore ; peu de gens sont venus et tout s''est terminé en quelques minutes.'
      none: 'Avant l''aube du 7 octobre, Poe est décédé au Washington College Hospital, et la cause est encore inconnue. Deux jours plus tard, Maria Clemm lut la nouvelle dans le journal de Fordham et s''assit pour écrire à Baltimore, leur demandant de ne rien lui cacher.'
      desync: 'Le 3 octobre, la note demandant de l''aide est passée entre quelques mains dans la foule en bas des bureaux de vote et s''est retrouvée dans la poche de quelqu''un. Lors du rappel du {staff}, un homme était toujours affalé sur le banc au pied de l''escalier, son chapeau sur la moitié du visage.'
      not_admitted: '{staff} ne l''a jamais approché et n''a transporté des malles sur le quai que quelques jours. Les paquebots en provenance de Richmond s''amarrèrent les uns après les autres, et parmi les passagers qui descendaient se trouvait un homme maigre, armé d''une canne, qui marchait lentement.'
      points:
        p1:
          class_medical: 'Dans l''après-midi du 3 octobre, le rez-de-chaussée situé sous les bureaux de vote du Quatrième arrondissement est rempli de monde, l''odeur de la boisson se mêlant à celle du bois humide. Un message sort du pied de l’escalier et passe entre quelques mains. {staff}, qui connaît la médecine, prend la note, lit qui elle demande, demande le chemin jusqu''à ce que le Dr Snodgrass soit trouvé, et avec lui et l''oncle de Poe amènent une voiture et aident Poe à se lever du banc au pied de l''escalier. Poe se penche dans le coin de la voiture et dit des choses que personne ne peut comprendre. Alors que la voiture s''éloigne, {staff} tire à moitié le rideau sur la fenêtre, masquant ainsi les visages qui se penchent depuis la porte du bureau de vote.'
          trait_vigil: 'Dans l''après-midi du 3 octobre, le rez-de-chaussée situé sous les bureaux de vote du Quatrième arrondissement est rempli de monde, l''odeur de la boisson se mêlant à celle du bois humide. Un message sort du pied de l’escalier et passe entre quelques mains. {staff}, qui surveillait les escaliers, prend la note, lit qui elle demande, demande le chemin jusqu''à ce que le Dr Snodgrass soit trouvé, et avec lui et l''oncle de Poe amènent une voiture et aident Poe à se lever du banc au pied des escaliers. Poe se penche dans le coin de la voiture et dit des choses que personne ne peut comprendre. Alors que la voiture s''éloigne, {staff} tire à moitié le rideau sur la fenêtre, masquant ainsi les visages qui se penchent depuis la porte du bureau de vote.'
          else: 'Dans l''après-midi du 3 octobre, le rez-de-chaussée situé sous les bureaux de vote du Quatrième arrondissement est rempli de monde, l''odeur de la boisson se mêlant à celle du bois humide. Un message sort du pied de l’escalier et passe entre quelques mains. {staff}, méthodique, prend la note, lit qui elle demande, demande le chemin jusqu''à ce que le Dr Snodgrass soit trouvé, et avec lui et l''oncle de Poe amènent une voiture et aident Poe à se lever du banc au pied de l''escalier. Poe se penche dans le coin de la voiture et dit des choses que personne ne peut comprendre. Alors que la voiture s''éloigne, {staff} tire à moitié le rideau sur la fenêtre, masquant ainsi les visages qui se penchent depuis la porte du bureau de vote.'
        p2:
          class_medical: 'Le 4 octobre, la salle est fermée aux visiteurs, tous ceux qui viennent demander sont gardés en bas et à Fordham personne ne sait encore où il se trouve. {staff}, formé en soins infirmiers et autorisé à entrer dans le service, découvre ce que sait l''hôpital, quel jour il a été amené, dans quelle chambre il se trouve, qui s''occupe de lui, le met dans une lettre avec une adresse à laquelle écrire et l''envoie au bureau de poste avant le courrier vers le nord. Le commis de la poste tamponne l''enveloppe. Il est adressé à Maria Clemm à Fordham, et il le met dans le sac pour New York.'
          class_press: 'Le 4 octobre, la salle est fermée aux visiteurs, tous ceux qui viennent demander sont gardés en bas et à Fordham personne ne sait encore où il se trouve. {staff}, un ancien journaliste qui sait comment les nouvelles circulent le plus rapidement, découvre ce que sait l''hôpital, quel jour il a été amené, dans quelle chambre il se trouve, qui s''occupe de lui, met cela dans une lettre avec une adresse à laquelle écrire et l''envoie à la poste avant le courrier vers le nord. Le commis de la poste tamponne l''enveloppe. Il est adressé à Maria Clemm à Fordham, et il le met dans le sac pour New York.'
          class_travel: 'Le 4 octobre, la salle est fermée aux visiteurs, tous ceux qui viennent demander sont gardés en bas et à Fordham personne ne sait encore où il se trouve. {staff}, habitué à faire des courses et à savoir quand le courrier en direction du nord part, découvre ce que sait l''hôpital, quel jour il a été amené, dans quelle chambre il se trouve, qui s''occupe de lui, le met dans une lettre avec une adresse à laquelle écrire et l''achemine au bureau de poste avant le courrier en direction du nord. Le commis de la poste tamponne l''enveloppe. Il est adressé à Maria Clemm à Fordham, et il le met dans le sac pour New York.'
          else: 'Le 4 octobre, la salle est fermée aux visiteurs, tous ceux qui viennent demander sont gardés en bas et à Fordham personne ne sait encore où il se trouve. {staff}, prudent, découvre ce que sait l''hôpital, quel jour il a été amené, dans quelle chambre il se trouve, qui s''occupe de lui, met cela dans une lettre avec une adresse à laquelle écrire et l''envoie à la poste avant le courrier vers le nord. Le commis de la poste tamponne l''enveloppe. Il est adressé à Maria Clemm à Fordham, et il le met dans le sac pour New York.'
        p3: 'Dans la nuit du 5 octobre, une seule lampe brûle très faiblement dans la pièce grillagée. Poe parle au mur, s''assied, se recouche et ne touche pas l''eau qu''il porte à ses lèvres. {staff}, qui connaît la médecine, s''assoit près du lit pour prendre son pouls de temps en temps, et chaque fois qu''il se calme, il porte le bord de la tasse à sa bouche pour une petite gorgée. Vers l''aube, Poe s''endort. Quelques matins plus tard, il se lève tout seul, demande une tasse d''eau, la boit lui-même en la tenant et repose la tasse sur le rebord de la fenêtre.'
      excerpts:
