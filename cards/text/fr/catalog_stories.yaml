  sequoyah_syllabary:
    name: 'Une écriture créée par un seul homme'
    place: 'Pays Cherokee, sud-est des États-Unis'
    figure: 'Sequoyah'
    story: 'L''orfèvre Cherokee Sequoyah a achevé un système d''écriture pour Cherokee en 1821. Ses signes représentent des syllabes plutôt que des sons individuels. La nation Cherokee a officiellement adopté le syllabaire plus tard dans la décennie. Le 21 février 1828, le premier Cherokee Phoenix sortit des presses à New Echota avec le cherokee et l''anglais imprimés.'
    story_prose:
      opening:
        - 'Pays Cherokee, sud-est des États-Unis, 1821. L''orfèvre Sequoyah ne sait pas lire l''anglais, mais il a pourtant réalisé un syllabaire de quelque quatre-vingts signes pour Cherokee, chaque signe représentant une syllabe. Il se consacre à ce travail depuis de nombreuses années.'
        - 'Dans l’histoire, il était boiteux d’une jambe et marchait avec difficulté ; les champs ont été laissés à sa femme seule, sa famille l''a supplié encore et encore de les abandonner, et sa femme a un jour brûlé ses papiers ; lorsqu''il montra l''écriture, les gens se méfièrent et l''on l''accusa en face. Dans cette branche, un apprenant prononce un mot, un signe à la fois, et une voisine veut écrire son propre nom.'
        - "Plusieurs types de personnes peuvent aider dans ce voyage : quelqu'un de calme, quelqu'un que l'on écoute, ou quelqu'un avec une volonté de fer, ou quelqu'un avec une pomme d'or, pour se lever le jour où les soupçons deviennent élevés ; quelqu'un qui connaît la médecine ou quelqu'un qui prend des analgésiques\_; quelqu'un de fort volontaire qui a travaillé dans l'agriculture, ou quelqu'un de gentil et très dur, pour effectuer six mois de travail des champs de cette maison."
      outcomes:
        all: 'Au cours de ces années, l''écriture s''est répandue parmi les Cherokee ville par ville, et sa femme a également appris à écrire avec. Le 21 février 1828, le premier Cherokee Phoenix sortit des presses à New Echota, cherokee et anglais dans des colonnes côte à côte.'
        p3: 'Les champs ne furent pas gaspillés pendant ce semestre et les querelles à la maison devinrent moins nombreuses. Plus tard, sa femme apprit également à écrire avec les signes.'
        p2: 'Durant ces six mois, la douleur dans sa jambe s''est atténuée et il a marché plus vite sur la route vers la prochaine ville pour enseigner ; plus il allait loin, plus il y avait d''apprenants.'
        p1: 'Le conseil a ensuite officiellement adopté l''écrit. Le 21 février 1828, le premier Cherokee Phoenix sortit des presses à New Echota, avec cherokee et anglais dans des colonnes côte à côte.'
      none: 'Le jour de la démonstration, les cris ont tout noyé et Ayoka n''a jamais été rappelée pour lire le mot. Le papier sur lequel étaient inscrites les inscriptions a été piétiné.'
      desync: 'Le jour de la démonstration, les cris se sont intensifiés et personne n''a plus attendu le retour de l''enfant. Lorsque le {staff} a été rappelé, la foule avait quitté le terrain découvert et le papier avec un mot dessus gisait dans la terre à côté d''une petite empreinte.'
      not_admitted: '{staff} n''a jamais trouvé pied ici et n''a aidé la voisine qu''à quelques reprises à retrouver son nom sur une feuille de papier. Au loin, en rase campagne, un homme boitant montrait à quelques personnes les signes sur un papier.'
      points:
        p2:
          class_medical: 'Sequoyah avait l''intention d''aller dans les villes voisines pour enseigner les signes aux gens, mais sa jambe boiteuse lui faisait mal après un court trajet et il devait se reposer plusieurs fois sur chaque tronçon de route. {staff}, qui connaissait la médecine, mettait chaque soir des compresses chaudes sur la jambe, en soulageait la raideur et coupait son bâton à une hauteur qui convenait à sa main. Ce jour-là, il atteignit la ville suivante avant le coucher du soleil. Il a écrit une ligne de signes sur une feuille de papier, et l''apprenant s''est penché et l''a lu syllabe par syllabe.'
          else: 'Sequoyah avait l''intention d''aller dans les villes voisines pour enseigner les signes aux gens, mais sa jambe boiteuse lui faisait mal après un court trajet et il devait se reposer plusieurs fois sur chaque tronçon de route. {staff}, qui avait apporté des analgésiques, lui en donnait un avant de partir chaque jour, marchait à ses côtés tout au long du trajet et portait pour lui le rouleau de papier recouvert de signes. Ce jour-là, il atteignit la ville suivante avant le coucher du soleil. Il a écrit une ligne de signes sur une feuille de papier, et l''apprenant s''est penché et l''a lu syllabe par syllabe.'
        p1:
          trait_calm: 'Le jour de la démonstration, la place est bondée. Sequoyah demande d’abord à Ayoka, sa fille de six ans, de s’éloigner. Il demande à quelqu’un de dire un mot, l’écrit, puis doit rappeler Ayoka pour qu’elle le lise. Avant qu''il ait fini d''écrire, quelqu''un dans la foule est devenu méfiant, a déclaré que les signes étaient étranges et indignes de confiance, et a commencé à lui crier dessus en face. {staff} s''est approché sans se presser et a demandé à tout le monde d''attendre, de laisser l''enfant revenir et de le lire en premier, et de parler une fois qu''elle l''aurait bien lu. On rappelle Ayoka. Elle baisse les yeux vers le papier et lit le mot syllabe par syllabe. Le silence se fait un instant. La personne qui avait donné le mot avance de deux pas et se penche pour regarder les signes.'
          else: 'Le jour de la démonstration, le terrain était bondé. Sequoyah a d''abord renvoyé sa fille Ayoka, âgée de six ans, a demandé à quelqu''un de dire un mot, l''a écrit, puis l''a rappelé pour le lire. Avant qu''il ait fini d''écrire, quelqu''un dans la foule est devenu méfiant, a déclaré que les signes étaient étranges et indignes de confiance, et a commencé à lui crier dessus en face. {staff} s''est tenu devant la foule et a déclaré, sans élever la voix, qu''un instant d''attente réglerait le problème une fois que l''enfant reviendrait lire, et a fait baisser les cris un par un. On rappelle Ayoka. Elle baisse les yeux vers le papier et lit le mot syllabe par syllabe. Le silence se fait un instant. La personne qui avait donné le mot avance de deux pas et se penche pour regarder les signes.'
        p3:
          class_labour: 'Les travaux des champs étaient depuis longtemps incombés à sa seule femme, la majeure partie de la terre de maïs était gaspillée et la maison se disputait depuis des années à propos de l''écriture. {staff}, qui avait cultivé, est sorti aux premières lueurs du jour pour biner les mauvaises herbes et terrer les rangs, a replanté les rangs abandonnés et, le soir, a ramené de l''eau chez lui avec sa femme. La récolte de cette saison-là est entrée dans la maison. Sequoyah étala sur la table le rouleau de papier couvert de signes, et sa femme s''assit à côté de lui, regarda longuement, puis tendit le doigt et toucha l''une des signes.'
          else: 'Les travaux des champs étaient depuis longtemps incombés à sa seule femme, la majeure partie de la terre de maïs était gaspillée et la maison se disputait depuis des années à propos de l''écriture. {staff}, fort et chaleureux, allait chaque jour aux champs avec sa femme, assumait les travaux les plus pénibles et les accomplissait du matin au soir. La récolte de cette saison-là est entrée dans la maison. Sequoyah étala sur la table le rouleau de papier couvert de signes, et sa femme s''assit à côté de lui, regarda longuement, puis tendit le doigt et toucha l''une des signes.'
      excerpts:
        p1: 'On rappelle Ayoka. Elle baisse les yeux vers le papier et lit le mot syllabe par syllabe. Le silence se fait un instant. La personne qui avait donné le mot avance de deux pas et se penche pour regarder les signes.'
        p3: 'La récolte de cette saison-là est entrée dans la maison. Sequoyah étala sur la table le rouleau de papier couvert de signes, et sa femme s''assit à côté de lui, regarda longuement, puis tendit le doigt et toucha l''une des signes.'
        p2: 'Ce jour-là, il atteignit la ville suivante avant le coucher du soleil. Il a écrit une ligne de signes sur une feuille de papier, et l''apprenant s''est penché et l''a lu syllabe par syllabe.'
    relic: 'Un tableau du syllabaire'
    relic_desc: 'Une feuille où quelque quatre-vingts caractères sont disposés en rangées.'
    points:
