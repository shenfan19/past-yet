  galois_paris:
    name: 'La veille du duel'
    place: 'Paris'
    figure: 'Évariste Galois'
    story: 'Évariste Galois sort de prison à Paris le 29 avril 1832. Dans la nuit du 29 mai, il écrit à son ami Auguste Chevalier. Il lui expose ses découvertes sur les équations résolubles par radicaux et lui demande de faire publier la lettre. Le lendemain matin, il est blessé au ventre lors d’un duel et laissé là où il tombe. Il meurt à l’hôpital Cochin le 31 mai, à vingt ans. Chevalier fait imprimer la lettre en septembre. Quatorze ans plus tard, Joseph Liouville publie ses travaux.'
    story_prose:
      opening:
        - 'Paris, mai 1832. Évariste Galois a vingt ans et il est sorti de prison il y a un mois. Adolescent, il a trouvé à quelles conditions une équation peut être résolue par radicaux. La théorie des groupes naîtra de ces idées, mais à l’époque presque personne ne parvient à les suivre.'
        - 'Dans la nuit du 29 mai, Galois écrit à son ami Auguste Chevalier pour lui exposer ses résultats et lui demander de faire imprimer la lettre. Le lendemain matin, blessé au ventre lors d’un duel, il est laissé là où il tombe. Il meurt à l’hôpital Cochin le 31 mai. La lettre est imprimée en septembre, et Liouville publie les manuscrits quatorze ans plus tard. Dans cette branche, la concierge prête de l’encre à Galois, un charretier livre du bois à Cochin depuis dix ans, et un typographe manque de signes « égal ».'
        - 'Plusieurs personnes peuvent aider lors de ce voyage. Pour garder ensemble la lettre et les manuscrits, quelqu’un qui a tenu des archives, traduit ou relu des épreuves, ou qui sait veiller en restant méthodique. Pour être là de bon matin, quelqu’un qui connaît les soins et a emporté de quoi intervenir. Pour aider les futurs lecteurs à trouver la suite, quelqu’un qui a tenu des archives ou traduit et qui sait parler à un éditeur.'
      outcomes:
        all: 'Galois survit. En septembre, la lettre paraît avec un index. Des lecteurs viennent demander les manuscrits par numéro de page. Chevalier dresse la liste de leurs questions et Galois s’assoit à table pour y répondre une à une.'
        p3: 'Galois est resté à l''hôpital jusqu''en juin avant de pouvoir se lever. Cet été-là, il se rassit à sa table, le brouillon de la lettre étalé devant lui, la ligne en marge toujours là.'
        p2: 'À partir de septembre, les lecteurs de la lettre peuvent demander une copie en s’aidant de l’index. Les questions reviennent à Chevalier avec les numéros de page. En 1846, Liouville publie les manuscrits.'
        p1: 'En septembre, Chevalier imprime la lettre du 29 mai dans la Revue encyclopédique. Quatorze ans plus tard, Liouville publie ses articles.'
      none: 'Le 2 juin, Galois est enterré dans une fosse commune à Montparnasse. La concierge reprit la bouteille d''encre qu''il avait empruntée et frappa un trait sur son livre de comptes.'
      desync: 'Tard dans la nuit du 29 mai, la lettre et les papiers dont elle parlait gisaient aux deux bouts de la table, et personne ne les avait emballés. Lors du rappel du {staff}, la bougie avait brûlé et sa cire coulait sur le bord d''une page.'
      not_admitted: '{staff} n’est jamais entré dans le bâtiment et n’est resté au coin de la rue que quelques nuits. Une fenêtre à l''étage est restée allumée jusqu''à l''aube, et une fois ouverte, un drap froissé est tombé sur les pavés.'
      points:
        p1:
          class_lettered: 'Dans la nuit du 29 mai, la table disparaît sous les papiers. La lettre à Chevalier s’allonge de page en page, et les manuscrits qu’elle mentionne sont sous quelques livres. Habitué aux écrits, {staff} tend les pages une à une à Galois pour qu’il les vérifie avant de s’endormir. La lettre est pliée à part. Les manuscrits sont liés dans l’ordre qu’il indique. Le nom de Chevalier est inscrit sur chaque paquet pour qu’ils lui soient remis en main propre à l’aube. Vers l’aube, Galois ajoute à la hâte une ligne en marge d’une page et pose la plume. Les deux paquets sont côte à côte sur la table, et celui du dessus porte le nom de Chevalier.'
          else: 'Dans la nuit du 29 mai, la table disparaît sous les papiers. La lettre à Chevalier s’allonge de page en page, et les manuscrits qu’elle mentionne sont sous quelques livres. {staff} veille à la table et prend chaque feuille à mesure que Galois la termine. La lettre est pliée à part. Les manuscrits sont liés dans l’ordre qu’il indique. Le nom de Chevalier est inscrit sur chaque paquet pour qu’ils lui soient remis en main propre à l’aube. Vers l’aube, Galois ajoute à la hâte une ligne en marge d’une page et pose la plume. Les deux paquets sont côte à côte sur la table, et celui du dessus porte le nom de Chevalier.'
        p3:
          class_medical: 'Tôt le 30 mai, après le coup de feu, Galois est seul dans l’herbe d’un terrain découvert à la sortie de la ville. Les autres sont partis. {staff}, qui connaît les soins, arrive au bout de quelques minutes, panse la blessure, utilise le médicament apporté contre l’infection et arrête une charrette pour conduire Galois chez un médecin. Quelques jours plus tard, Galois se réveille dans un lit d’hôpital et cherche du papier. Une infirmière lui tend une demi-feuille. Il la retourne et commence à écrire des chiffres au dos.'
          else: 'Tôt le 30 mai, après le coup de feu, Galois est seul dans l’herbe d’un terrain découvert à la sortie de la ville. Les autres sont partis. {staff} arrive au bout de quelques minutes, ouvre la trousse nanomédicale et suit ses instructions pour arrêter le saignement et prévenir l’infection. Une charrette est alors arrêtée pour emmener Galois chez un médecin. Quelques jours plus tard, Galois se réveille dans un lit d’hôpital et cherche du papier. Une infirmière lui tend une demi-feuille. Il la retourne et commence à écrire des chiffres au dos.'
        p2:
          class_lettered: 'En septembre, on compose ce numéro de la Revue encyclopédique dans une petite imprimerie. Le typographe marmonne en allant chercher d’autres signes « égal » dans la casse voisine. Habitué aux documents, {staff} numérote les manuscrits de Chevalier, en dresse un index, demande à l’éditeur de le placer après la lettre et écrit à un mathématicien prêt à lire les pages dans l’ordre. Le numéro imprimé repose sur le rebord de la fenêtre de l’atelier. Après la lettre vient l’index, avec un numéro de page par ligne. Chevalier prend un exemplaire et passe le doigt sur la colonne de chiffres.'
          else: 'En septembre, on compose ce numéro de la Revue encyclopédique dans une petite imprimerie. Le typographe marmonne en allant chercher d’autres signes « égal » dans la casse voisine. {staff} s’installe devant le bureau de l’éditeur et lui lit une à une les pages que détient Chevalier. À force d’insister, un index est ajouté à la suite de la lettre et un mathématicien accepte de lire les pages dans l’ordre. Le numéro imprimé repose sur le rebord de la fenêtre de l’atelier. Après la lettre vient l’index, avec un numéro de page par ligne. Chevalier prend un exemplaire et passe le doigt sur la colonne de chiffres.'
      excerpts:
        p3: 'Quelques jours plus tard, Galois se réveille dans un lit d’hôpital et cherche du papier. Une infirmière lui tend une demi-feuille. Il la retourne et commence à écrire des chiffres au dos.'
        p2: 'Le numéro imprimé repose sur le rebord de la fenêtre de l’atelier. Après la lettre vient l’index, avec un numéro de page par ligne. Chevalier prend un exemplaire et passe le doigt sur la colonne de chiffres.'
        p1: 'Vers l’aube, Galois ajoute à la hâte une ligne en marge d’une page et pose la plume. Les deux paquets sont côte à côte sur la table, et celui du dessus porte le nom de Chevalier.'
    relic: 'Une lettre précipitée'
    relic_desc: 'Des pages couvertes de chiffres et de mots, écrits dans le peu de temps qui lui restait.'
    points:
      p1: 'Dans la nuit du 29 mai, pendant que Galois peut vérifier les pages, emballez la lettre à Chevalier à part et faites-lui remettre les deux paquets.'
      p2: 'Lorsque la lettre paraît en septembre, faites imprimer l’index des manuscrits à sa suite et trouvez un mathématicien prêt à lire les feuilles dans l’ordre.'
      p3: 'Après le duel du 30 mai au matin, emmenez immédiatement Galois chez un médecin et sauvez-le de la blessure à l''abdomen.'
    points_fail:
      p1: 'La remise est reportée à plusieurs reprises et la lettre est séparée des papiers. Chevalier ne reçoit jamais la lettre du 29 mai et le bureau rappelle l''employé.'
      p2: 'Seule la lettre paraît en septembre. Encore faut-il que les lecteurs qui veulent aller plus loin trouvent l''ami qui détient les manuscrits.'
      p3: 'Il repose blessé et seul jusqu''à ce qu''un passant le retrouve et décède à l''hôpital Cochin le 31 mai, à l''âge de vingt ans. Dans cette branche il n''y a plus de Galois après ça.'
    shift:
      p1:
        was: 'Le 29 mai 1832, Galois écrit à Auguste Chevalier pour lui exposer ses recherches et lui demander de s''occuper des papiers et de publier la lettre.'
      p2:
