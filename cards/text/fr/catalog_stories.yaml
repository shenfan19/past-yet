        was: 'Mars 415 : Hypatie, mathématicienne et philosophe, est tuée à Alexandrie dans les troubles de la ville.'
        now: 'En mars, elle était loin de la ville. Quand les choses se calmèrent, elle revint à Alexandrie et continua à enseigner.'
        who: 'hypatia_alexandria'
        bio: 'Dans cette chronologie, Hypatie a écouté et a quitté Alexandrie avant mars 415, est arrivée ce printemps-là et est ensuite retournée enseigner dans la ville.'
