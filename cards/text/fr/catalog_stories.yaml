      name: '{staff} vérifie auprès de l''étudiant où récupérer un volume emprunté si la salle est fermée. L''élève plie la réponse dans sa couverture.'
  gutenberg_mainz:
    name: 'Imprimer avec des caractères mobiles en métal'
    place: 'Mayence'
    figure: 'Johannes Gutenberg'
    story: 'Johann Fust a financé les travaux d’imprimerie de Gutenberg à Mayence. Le livre de 42 lignes survit, ainsi qu’un document du 6 novembre 1455 enregistrant la demande de remboursement et d’intérêts de Fust. Le document n’enregistre pas quels outils l’un ou l’autre homme a conservé.'
    story_prose:
      opening:
        - 'Un imprimeur de Mayence présente une nouvelle feuille à la lumière et fait une marque dans son coin. Le fournisseur de papier demande s''il sera payé cette fois-ci. Gutenberg a une pile de pages à vérifier. Fust a une somme à régler.'
        - 'L''édition de quarante-deux lignes fut achevée à cette époque. Un acte notarié daté du 6 novembre 1455 enregistre le différend entre Gutenberg et Fust. Ici, vous pouvez garder le run fourni et leur demander de se mettre d''accord sur les outils que Gutenberg pourra encore utiliser à la fin du partenariat.'
        - 'Envoyez quelqu''un qui puisse vérifier le papier, la dactylographie et les salaires. Pour régler la question des outils, il faut aussi quelqu''un qui puisse faire entendre aux deux hommes un accord lu à haute voix.'
      points:
        p1: 'L''imprimeur compte sa pile et dit qu''il en aura besoin d''une autre. Vous demandez au fournisseur de compter les feuilles finies de la journée par rapport au bon de travail, puis de répertorier le lot suivant et les salaires sur des lignes distinctes avec Gutenberg. Le fournisseur efface la marque de reprise du stock. Le lendemain matin, une feuille neuve attend sur le plateau de la presse.'
        p2: 'Fust apporte tout le compte. Il ne montre pas à quoi sert chaque avance. Vous demandez à Gutenberg de commencer avec les outils dont il a encore besoin et demandez au commis de lire les termes de chaque élément aux deux hommes. Chacun en prend un exemplaire et le manche en bois reste sur son crochet. Gutenberg plie son exemplaire dans le livret de salaires en partant.'
      outcomes:
        all: 'L''édition de quarante-deux lignes est terminée et ses bailleurs de fonds ont encore des comptes à régler. Chaque homme dispose d’une copie de l’accord sur les outils que Gutenberg peut utiliser.'
        p1: 'Les imprimeurs terminent le tirage et les feuilles finies quittent l''atelier. Le notaire entendra toujours la dispute sur les outils et l’argent.'
        p2: 'Il existe une liste écrite des outils qu''il peut utiliser. L''édition est désynchronisée et le voyage ne rapporte que le compte rendu de la discussion.'
      none: 'Une feuille inachevée reste sur la presse. Les travailleurs et le fournisseur attendent toujours une réponse.'
      not_admitted: 'Un imprimeur demande à travers la porte si le visiteur est venu chercher le journal ou les comptes. Personne ne vous fait entrer. De dehors, on entend juste le bruit d''une planche posée sur le banc.'
      desync: 'La presse s''arrête à mi-chemin. Le papier et les salaires sont épuisés. La publication se désynchronise et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Le fournisseur efface la marque de reprise du stock. Le lendemain matin, une feuille neuve attend sur le plateau de la presse.'
        p2: 'Chacun en prend un exemplaire et le manche en bois reste sur son crochet. Gutenberg plie son exemplaire dans le livret de salaires en partant.'
    relic: 'Un caractère mobile en plomb'
    relic_desc: 'Une petite lettre en plomb et en étain, gravée à l’envers.'
    points:
      p1: 'Gardez les caractères, le papier et les ouvriers disponibles suffisamment longtemps pour terminer le livre de 42 lignes tandis que le travail d''impression dépend de l''argent emprunté.'
      p2: 'Avant les débats de novembre, aidez Gutenberg et Fust à convenir des outils que Gutenberg pourra continuer à utiliser après la fin de leur partenariat.'
    points_fail:
      p1: 'Le livre de 42 lignes s''arrête à moitié imprimé sur la presse. Cette succursale est sortie de l''histoire et le bureau rappelle l''employé ce jour-là.'
      p2: 'Le conflit se poursuit sans accord sur les outils. Gutenberg quitte la réunion sans aucune garantie de pouvoir les utiliser à nouveau.'
    shift:
      p1:
        was: "1455\_: le livre de 42 lignes est terminé dans l'atelier de Gutenberg à Mayence, imprimé avec des caractères métalliques mobiles."
      p2:
        was: 'Le 6 novembre 1455, un notaire enregistra la demande de remboursement et d’intérêts de Fust. Le document laisse floue la propriété finale des outils.'
        now: 'Gutenberg et Fust conviennent des outils que Gutenberg peut continuer à utiliser. Il pourra planifier une autre course avec eux à la fin du partenariat.'
        who: 'gutenberg_mainz'
        bio: 'Dans cette branche, Gutenberg s''assure un accès continu à certains de ses outils d''impression après le conflit de 1455.'
    vignettes:
      wrong_sort: 'Vous repérez une mauvaise sorte juste avant que l''apprenti ne la remette dans la boîte. Vous le placez à côté de son voisin et lui laissez voir comment un visage s''imprimerait à la place de l''autre.'
      reader: 'Vous demandez si une ligne bondée peut être lue depuis un pupitre. L''apprenti recule et le lit à haute voix. Il marque l''endroit où son œil s''est trompé de ligne.'
      proof: 'Vous lisez la nouvelle épreuve de bas en haut, une ligne à la fois. L''apprenti rit jusqu''à se surprendre à lire ce qu''il attend plutôt que ce qui est sur la page.'
  leonardo_florence:
    name: 'Un peintre qui dessinait des machines'
    place: 'Florence'
    figure: 'Léonard de Vinci'
    story: 'Le Louvre date le début du portrait de Léonard connu sous le nom de La Joconde vers 1503 et rapporte qu''il a continué à y travailler plus tard.'
    story_prose:
      opening:
        - 'A l''intérieur de l''atelier de Florence, les panneaux ont été déplacés de la fenêtre pour laisser place à un nouveau support. Un agent vient demander où se trouve le portrait de Lisa. Un apprenti l''empêche de poser la main sur un panneau encore mouillé.'
        - 'La note d’Agostino Vespucci datée d’octobre 1503 mentionne le portrait de Lisa par Léonard. Le tableau est ensuite resté chez l’artiste. Ici, vous pouvez lui réserver un lieu de travail et de stockage, et faire en sorte que Lisa voie tout ce que Leonardo est prêt à montrer.'
        - 'Envoyez quelqu''un qui peut juger le rack, le panneau et la lumière du jour. Pour organiser une visite, réunissez le modèle, le peintre et l''agent à une heure convenue.'
      points:
        p1: 'L''apprenti souhaite gagner un espace supplémentaire sur l''ancien support. Vous lui demandez d''abord de glisser un panneau vide et de regarder son coin toucher le tableau à côté. Il libère un espace près de la fenêtre et demande à Leonardo de marquer l''emplacement. Plus tard, la personne qui range l''œuvre touche l''étiquette de ce panneau avant de saisir le support.'
        p2: 'Le peintre demande une planche d''entraînement sèche pour protéger ses peintures. Il tourne lui-même le portrait vers la porte et montre à Lisa où se tenir. Elle demande s''il aura besoin d''elle dans la même pose la prochaine fois. Il regarde le dossier de la chaise et demande à l''apprenti de marquer l''endroit où elle se trouve. Après le départ de Lisa, Leonardo remet le panneau dans sa lumière.'
      outcomes:
        all: 'L''atelier a encore de la place pour la photo. Lisa a vu le chemin parcouru, et Leonardo conserve toujours le panel.'
        p1: 'Le panneau est doté de la lumière du jour et d''un emplacement de stockage étiqueté. L''agent peut demander comment ça se passe. Une visite n''a toujours pas de jour convenu.'
        p2: 'Lisa a vu l''œuvre une fois. Le panneau est endommagé plus tard et le voyage ramène à la maison la scène dans laquelle elle l''a vu.'
      none: 'Il n''y a toujours pas de place dans le rack. Près de la porte, un visiteur apprend seulement que le peintre ne l''a pas remis.'
      not_admitted: 'L''apprenti vous demande de faire de la place aux personnes qui amènent le râtelier. De l''extérieur de la porte, vous ne pouvez pas voir l''avant du panneau.'
      desync: 'L''ancien support serre et endommage le panneau humide. Le portrait historique n''est plus conservé et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Il libère un espace près de la fenêtre et demande à Leonardo de marquer l''emplacement. Plus tard, la personne qui range l''œuvre touche l''étiquette de ce panneau avant de saisir le support.'
        p2: 'Il regarde le dossier de la chaise et demande à l''apprenti de marquer l''endroit où elle se trouve. Après le départ de Lisa, Leonardo remet le panneau dans sa lumière.'
    relic: 'Une page de cahier écrite en miroir'
    relic_desc: 'Une page de script à l''envers qui nécessite un miroir pour être lue.'
    points:
      p1: 'Avant que l’atelier ne se lance dans une autre peinture civique, réservez une place au portrait de Lisa où il y a de la lumière pour travailler et où le panneau se trouve en réserve.'
      p2: 'Organisez une visite des travaux en cours pendant que le portrait est encore à Florence et laissez Léonard choisir quoi montrer au modèle'
    points_fail:
      p1: 'Un nouveau travail arrive et le panneau inachevé est inséré dans l''ancien support. Le portrait est endommagé et le bureau rappelle l''employé.'
      p2: 'Aucun temps n''est réservé pour une visite. Ceux qui attendent la photo ne peuvent que demander à l''atelier jusqu''où il en est.'
    shift:
      p1:
        was: 'La note marginale d''Agostino Vespucci d''octobre 1503 fait état du tableau de Léonard Lisa del Giocondo.'
      p2:
        was: 'Le portrait subit une longue révision, puis quitte l''Italie avec Léonard et entre dans la collection française.'
        now: 'Lisa voit le portrait à ce stade. Léonard peut continuer à emporter le panneau avec lui, tandis que l''atelier conserve un croquis de la version qui lui est présentée.'
        who: 'leonardo_florence'
        bio: 'Une note florentine contemporaine place le portrait de Lisa dans l’atelier de Léonard. La peinture continue d’évoluer et s’éloigne de ce premier décor.'
    vignettes:
      shadow: 'Vous demandez à l''apprenti de montrer où se termine le visage et où commence l''arrière-plan. Ils pointent du doigt, puis hésitent. Au lieu de tracer une ligne plus épaisse, ils laissent la transition pour un second regard.'
      hands: 'Le visiteur se souvient du visage mais met les mains à un autre endroit. Vous placez le dessin d’entraînement à côté de leur croquis de mémoire et vous les laissez trouver les lignes modifiées.'
      seat: 'Vous marquez la chaise du gardien sur le sol pendant que l''apprenti fait ses valises. Ils laissent le dessin inachevé, sachant où ira la chaise à leur retour.'
  galileo_padua:
    name: 'Les lunes de Jupiter'
    place: 'Padoue'
    figure: 'Galilée'
    story: 'Dans le Messager étoilé, Galilée enregistre les positions changeantes de quatre petits corps près de Jupiter et conclut qu''ils gravitent autour de lui.'
    story_prose:
      opening:
        - 'A la fin d''une observation en janvier à Padoue, Galilée dessine des points lumineux à côté de Jupiter. Leurs positions changent le lendemain soir. Un copiste empile les dessins par taille et la personne qui les emmène à Venise demande quelle nuit commence.'
        - 'Les observations des lunes de Jupiter parurent dans le Sidereus Nuncius en 1610. Un procès en avril à Bologne suscita des objections et Horký publia plus tard un pamphlet contre le livre. Dans cette succursale, vous pouvez organiser les nuits de janvier et laisser certains invités voir eux-mêmes les points.'
        - 'Envoyez quelqu’un capable de comparer les croquis et les dates pour vérifier la copie de l’imprimeur. Dans la maison de Magini, aidez les visiteurs à trouver une étoile brillante indubitable avant de regarder Jupiter.'
      points:
        p1: 'Vous demandez au copiste lequel est arrivé en premier, la nuit avec trois points ou la nuit avec deux. Il sort le cahier et voit qu''il les a inversés. Galilée lit les dates et vous associez chaque coin à son entrée avant de remettre le décor pour Venise. Le copiste se tourne vers la deuxième nuit et hoche la tête lorsqu''il voit comment les points ont changé de place.'
        p2: 'Le premier invité chez Magini se retire et dit qu’il n’a vu qu’un éclat de lumière. Galilée fait de la place. Vous demandez à l''invité de trouver une étoile brillante qu''il reconnaît, puis de retourner à Jupiter. L’invité s’installe à son siège et lève la main pour attirer l’attention de son compagnon. Il lui demande de compter par elle-même avant de dire le nombre qu''il a vu.'
      outcomes:
        all: 'Les schémas imprimés conservent leur ordre de janvier. À Bologne, les invités enregistrent eux-mêmes leurs comptes et demandent où seront les points la nuit suivante.'
        p1: 'La copie pour Venise est en règle. A Bologne, il y aura encore des lettres et un pamphlet contestant les observations.'
        p2: 'Au moins un invité peut donner son propre nombre de lumières à côté de Jupiter. Le dossier d’impression est désynchronisé et le décompte reste dans le compte du voyageur.'
      none: 'Le copiste empile les feuilles par format, sans mettre de l''ordre dans les nuits.'
      not_admitted: 'Quelqu''un près de la porte demande qui vous a amené. Vous restez dehors et voyez le copiste mettre les images volantes dans une pochette.'
      desync: 'Les diagrammes libres changent de place dans la copie de l’imprimeur. La séquence originale se désynchronise et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Galilée lit les dates et vous associez chaque coin à son entrée avant de remettre le décor pour Venise. Le copiste se tourne vers la deuxième nuit et hoche la tête lorsqu''il voit comment les points ont changé de place.'
        p2: 'L’invité s’installe à son siège et lève la main pour attirer l’attention de son compagnon. Il lui demande de compter par elle-même avant de dire le nombre qu''il a vu.'
    relic: 'Une lentille polie'
    relic_desc: 'Une petite lentille en verre, polie à la main.'
    points:
      p1: 'Conservez les croquis datés de Jupiter et de ses points lumineux de Galilée pour que la copie soit envoyée à Venise'
      p2: 'À Bologne fin avril, aidez les invités de Magini à voir les lunes de Jupiter à travers le télescope de Galilée'
    points_fail:
      p1: 'Les croquis lâches perdent leur ordre. La copie de l’imprimeur désordonne les nuits et le bureau rappelle l’employé.'
      p2: 'Les invités regardent et disent qu''ils ne voient rien. Horký écrit à Kepler et publie en juin un pamphlet contre Sidereus Nuncius.'
    shift:
      p1:
        was: 'Galilée a observé Jupiter au cours de nuits successives à partir de janvier 1610 et a imprimé des enregistrements de position dans Sidereus Nuncius.'
      p2:
        was: 'Fin avril 1610, Galilée montra son télescope à Magini et à d''autres invités au Palazzo Caprara de Bologne. Ils ont déclaré qu''ils ne pouvaient pas voir les satellites et Martin Horký, qui était là, a imprimé un pamphlet contre Galilée en juin.'
        now: '{staff} stabilise le tube et montre aux invités où regarder. Plusieurs d''entre eux voient les points lumineux à côté de Jupiter cette nuit-là, et le pamphlet de Horký trouve moins de terrain. Les nouvelles étoiles sont acceptées plus tôt.'
        who: 'galileo_padua'
        bio: 'A Bologne, en avril 1610, les invités de Magini virent les lunes de Jupiter à travers le télescope de Galilée. Le doute qui suivit le Sidereus Nuncius fut plus court.'
    vignettes:
      alignment: 'Vous empêchez le copiste d''aligner les pages par leurs bords. Alignez plutôt Jupiter, suggérez-vous. Les points ne sont plus superposés.'
      telescope: 'Vous demandez quel point est le quatrième. Le copiste présente les feuilles de plusieurs nuits et demande à qui il faut se fier lorsque les points semblent se confondre.'
      dates: 'Vous marquez la date sur chaque feuille volante avant que le copiste ne les empile. L''ordre permet au lecteur suivant de voir les points changer de position.'
  heo_nanseolheon_hanyang:
    name: 'Des poèmes épars dans une chemise'
    place: 'Hanyang'
    figure: 'Heo Nanseolheon'
    story: 'Heo Gyun a compilé les œuvres survivantes de sa sœur Heo Nanseolheon après sa mort. Une édition sur bois de Joseon de ses œuvres rassemblées date de 1608.'
    story_prose:
      opening:
        - 'Le copiste pèse avec une pierre une nouvelle pochette en papier et vous remet deux feuilles avec la même ouverture. L’un était destiné à l’entraînement et quelqu’un a demandé à emprunter l’autre. Il se souvient avoir pris les deux à côté de la fenêtre.'
        - 'Dans l’histoire, le frère de Heo Nanseolheon, Heo Gyun, a rassemblé les œuvres survivantes après sa mort. La sélection de 1597 et l''édition 1608 survivante diffèrent par endroits. Ici, vous pouvez conserver les copies là où il les trouvera et demander au poète quels poèmes elle souhaite partager.'
        - 'Envoyez quelqu''un capable de comparer les mains et les titres pour trier les brouillons. Un voyageur qui sait expliquer qui veut les lire peut alors poser lui-même la question au poète.'
      points:
        p1: 'Le copiste montre l’encre plus forte. Vous mettez les deux versions côte à côte et lui montrez une correction à la fin de la copie plus pâle. Il fait une note sur la pochette pour que les deux puissent être retrouvés. Deux feuilles sont placées sous un même titre et le pli s''arrête bien avant l''écriture.'
        p2: 'Heo déplace le premier choix du copiste de son côté de la table. Elle en choisit un autre pour le remplacer. Lorsque vous demandez quel nom figure sur le paquet, elle prend le pinceau et signe elle-même la première feuille, puis rend les pages dans l''ordre. Elle demande au copiste de copier également la signature.'
      outcomes:
        all: 'Lorsque Heo Gyun rassemble la collection, il conserve le petit paquet dans l''ordre dans lequel sa sœur l''a laissé. Le nom copié à sa demande reste sur sa première feuille.'
        p1: 'Les deux versions peuvent être trouvées. Heo Gyun peut les comparer lorsqu''il compile la collection. Il n’a aucune trace du choix de sa sœur.'
        p2: 'Elle a elle-même signé quelques poèmes. Les autres journaux se sont égarés ; ce qui rentre à la maison est un enregistrement de son choix lors de cette visite.'
      none: 'Les exemplaires volants restent mélangés sur la table. La collecte ultérieure dépend encore de ce que la famille peut trouver.'
      not_admitted: 'Le copiste demande un titre de l''autre côté de la porte. Quand personne ne peut en nommer un, il garde la manche sur la table.'
      desync: 'A votre retour le copiste ne reconnaît que la pochette vide. Les papiers nécessaires à la collecte ultérieure se sont égarés et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Il fait une note sur la pochette pour que les deux puissent être retrouvés. Deux feuilles sont placées sous un même titre et le pli s''arrête bien avant l''écriture.'
        p2: 'Lorsque vous demandez quel nom figure sur le paquet, elle prend le pinceau et signe elle-même la première feuille, puis rend les pages dans l''ordre. Elle demande au copiste de copier également la signature.'
    relic: 'Une feuille de poèmes'
    relic_desc: 'Une feuille de papier fin avec des poèmes brossés sur des fleurs et des lieux lointains.'
    points:
      p1: 'Conservez les copies de la famille ensemble afin que Heo Gyun ait les poèmes qu''il a ensuite inclus dans sa sélection.'
      p2: 'Aidez Heo à mettre de côté et à signer un petit groupe de poèmes qu''elle souhaite que d''autres personnes lisent'
    points_fail:
      p1: 'La famille perd la trace des papiers séparés et Heo Gyun ne peut pas en compiler la collection. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'Après sa mort, la famille ne peut choisir pour elle que parmi les exemplaires qui restent.'
    shift:
      p1:
        was: 'Après la mort de Heo Nanseolheon en 1589, Heo Gyun a utilisé des poèmes conservés dans sa maison familiale pour compiler son œuvre.'
      p2:
        was: 'Après sa mort en 1589, son frère sélectionna ses poèmes. La sélection de 1597 et l''édition de 1608 conservent des lectures différentes.'
        now: 'Heo marque les pages qu''elle souhaite partager. La famille conserve sa sélection signée ensemble lorsqu''elle prépare plus tard la collection.'
        who: 'heo_nanseolheon_hanyang'
        bio: 'Heo Nanseolheon a sélectionné un petit groupe de poèmes qu''elle était prête à partager. Sa famille a conservé l''ordre choisi lors de la préparation de son œuvre survivante.'
    vignettes:
      binding: 'Le copiste a mélangé une page de pratique avec les autres feuilles. Vous comparez les deux rubriques et pliez une deuxième manche pour les exercices. Une page ambiguë reste libre pour qu''il puisse la vérifier. Vous partez avant qu’un des poèmes n’atteigne un livre imprimé.'
      name: 'Vous savez que certains de ces poèmes seront lus loin de cette maison. Le copiste s''apprête à transmettre une feuille d''exercices sans en-tête. Vous lui demandez également de copier le titre, et une feuille supplémentaire part avec un nom. Vous gardez votre place avec une bande de papier vierge. L’édition sur bois aura des années d’avance.'
      fold: 'Vous aidez à envelopper les pages volantes sans froisser le pinceau. Sur l''emballage de rechange, vous indiquez qu''il manque un titre. Ce que vous retirez, c''est l''avertissement, pas la page. La dernière collection sera constituée après votre départ.'
  ghalib_delhi:
    name: 'Retrouver le refrain'
    place: 'Delhi'
    figure: 'Mirza Ghalib'
    story: 'Au moment de cette visite à Delhi, le divan ourdou de Ghalib avait déjà été imprimé en 1841. Ses ghazals peuvent être parcourus par la fin de leurs rimes et de leurs refrains.'
    story_prose:
      opening:
        - 'Quelqu’un entre dans une librairie de Delhi en récitant autant de poèmes dont il se souvient, jusqu’à son dernier mot. Le libraire vous demande de réécouter et d''écrire la rime et le refrain. Il apportera le bordereau au livre imprimé.'
        - 'Le divan ourdou de Ghalib était déjà imprimé. Le roi lui confia la tâche d''écrire une histoire des Timurides. La première partie parut et le deuxième volume projeté resta inachevé. Vous pouvez mettre de l''ordre dans les papiers pour les règnes ultérieurs afin qu''il ait un point de départ après avoir livré le premier livre.'
        - 'Envoyez quelqu''un qui peut faire correspondre les noms de variantes aux dates. Un lecteur qui connaît les deux types d’écriture peut également identifier où l’histoire cite des versets.'
      points:
        p1: 'Ghalib sort une feuille de la pile et vous demande de lire sa dernière ligne. La page ressemble à de l’histoire jusqu’à ce que la phrase se termine par une ligne de vers dans la marge. Vous mettez la source de la citation sur son emballage et donnez aux journaux qui suivent Humayun leur propre rassemblement. Ghalib se tourne vers la première page blanche et écrit la première ligne d''un deuxième volume.'
      outcomes:
        all: 'Lorsque le premier livre sort, le prochain rassemblement est déjà à côté. Il y a un début lorsque vous partez, et beaucoup d''espace en dessous.'
        p1: 'Les règnes ultérieurs ont désormais leur propre rassemblement. Ghalib peut commencer la rédaction et les pages à venir lui appartiennent.'
      none: 'Le libraire retrouve le ghazal en suivant le bordereau. Les papiers des règnes ultérieurs restent dans leur pile, et aucune suite achevée ne suit le premier volume.'
      not_admitted: 'Le bordereau arrive au magasin, où personne ne reconnaît son porteur. Les papiers restent sous un livre de comptes entrouvert.'
      excerpts:
        p1: 'Vous mettez la source de la citation sur son emballage et donnez aux journaux qui suivent Humayun leur propre rassemblement. Ghalib se tourne vers la première page blanche et écrit la première ligne d''un deuxième volume.'
    relic: 'Une page de ghazals'
    relic_desc: 'Une page de vers ourdou de sa propre main, avec des corrections.'
    points:
      p1: 'Aidez-le à rassembler et à trier les sources de la seconde moitié de l''histoire timuride que le roi lui a demandé, afin qu''il poursuive l''ouvrage au-delà de sa première partie.'
    points_fail:
      p1: 'Le premier tome est terminé. Dans cette branche comme dans l’histoire, le projet du second ne devient pas un manuscrit achevé.'
    shift:
      p1:
        was: 'Le 4 juillet 1850, Bahadur Shah engagea Ghalib pour écrire une histoire de la maison timouride ; la première partie, Mehr-e nimroz, sortit en 1854 ou 1855 et se termine avec la mort de Humayun, et la suite qu''il prévoyait ne fut jamais écrite.'
        now: 'Ghalib dispose d''un ensemble distinct de notes sources pour les règnes ultérieurs. Après avoir tourné le premier tome, il a suffisamment de matériel sous la main pour commencer le second.'
        who: 'ghalib_delhi'
        bio: 'Dans cette branche, Ghalib commence une ébauche du deuxième volume après la livraison du premier.'
    vignettes:
      refrain: 'Le libraire se souvient de l’image du verset et continue de la chercher au mauvais endroit. Vous demandez les mots qu''il a entendus répétés. Il vous donne la fin et vous trouvez le bon groupe dans le livre imprimé. Vous écrivez une référence d’une page. Qui a apporté le premier ce vers dans la boutique reste un mystère pour lui.'
      future: 'Vous dites au libraire que les lecteurs ultérieurs compareront plusieurs éditions. Il demande si cela l''aidera à trouver la ligne dont il a besoin aujourd''hui. Vous ajoutez l''année d''édition à son bordereau, puis marquez la fin. Vous partez avant qu''il puisse le comparer à une autre copie.'
      listen: 'Vous répétez la fin au libraire jusqu’à ce que vous soyez tous les deux d’accord sur ce que vous avez entendu. Il glisse le feuillet dans la partie droite de son livre. Vous pouvez rapporter ces quelques mots. Le reste du verset vous a déjà échappé.'
  banneker_maryland:
    name: 'Deux choses dans le même envoi'
    place: 'Maryland'
    figure: 'Benjamin Banneker'
    story: 'Le 19 août 1791, Benjamin Banneker écrivit à Thomas Jefferson, lui envoya un manuscrit de son almanach pour l''année suivante et contesta les préjugés raciaux et l''esclavage. La table d''emballage et ses deux aides sont imaginées. Les joueurs peuvent protéger le lien entre la lettre et l’œuvre qu’elle accompagne.'
    story_prose:
      opening:
        - 'Le messager de l’imprimeur et le courrier sortant sont tous deux à la porte. Banneker écrit le nom de l''usine sur la lettre et tourne son almanach jusqu''à la dernière page pour s''assurer que sa copie manuscrite est toujours sur la table. Il a des choses à dire dans cette lettre qu''il n''enverra qu''une seule fois.'
        - 'Le 19 août 1791, Benjamin Banneker envoya à Thomas Jefferson un almanach manuscrit contenant une lettre contestant le déni de liberté aux Noirs. Un incendie en 1806 a détruit une grande partie de ce qu''il gardait chez lui, même si au moins un journal manuscrit a survécu. Cette branche peut laisser ailleurs davantage de papiers de son choix.'
        - 'Demandez à un voyageur qui peut vérifier la copie de l’imprimeur par rapport à celle manuscrite des deux paquets. Si un copiste peut trouver du temps pour une série supplémentaire, demandez à Banneker quelles notes peuvent être copiées.'
      points:
        p1: 'Le messager tourne les deux séries vers juillet et trouve à peu près la même colonne de chiffres. Vous demandez à Banneker d''identifier le manuscrit destiné à Jefferson et au facteur de lire à haute voix le nom sur l''enveloppe. Un fil fait le tour de la lettre et de l''almanach. Les papiers de l’imprimeur reposent à plat sur le comptoir. Le facteur lit l''adresse avant de saisir le nœud.'
        p2: 'Le copiste apporte une manche épaisse. Banneker sort quelques feuilles et laisse les observations et travaux datés qu''il peut vérifier. Il vous demande de relire un chiffre corrigé et de vérifier que l''ancien n''a pas été pris en compte dans le calcul. Dans l''autre maison, le gardien ouvre le coffret supplémentaire et lit à haute voix le premier rendez-vous.'
      outcomes:
        all: 'La réponse de Jefferson reconnaît les deux éléments. Lorsque le feu atteint la maison des années plus tard, la copie contient toujours les observations que Banneker a accepté de partager.'
        p1: 'La lettre et l''almanach sortent ensemble. Une grande partie des documents de travail restent chez lui et sont perdus avec bon nombre de ses affaires.'
        p2: 'Un ensemble vérifié a été laissé loin de la maison. Le courrier sortant tourne mal et le voyageur rapporte chez lui la date lue sur le jeu de rechange.'
      none: 'Il n''y a pas de paquet marqué séparément sur la table. Les lecteurs ne peuvent consulter que les notes de travail qui ont survécu à l''histoire.'
      not_admitted: 'L’imprimeur vérifie les noms avant de fermer sa boîte. Il ne reconnaît pas le visiteur et dépose le paquet devant la porte de Banneker.'
      desync: 'L’imprimeur récupère le seul almanach pouvant accompagner la lettre. L''enceinte historique manque et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Les papiers de l’imprimeur reposent à plat sur le comptoir. Le facteur lit l''adresse avant de saisir le nœud.'
        p2: 'Il vous demande de relire un chiffre corrigé et de vérifier que l''ancien n''a pas été pris en compte dans le calcul. Dans l''autre maison, le gardien ouvre le coffret supplémentaire et lit à haute voix le premier rendez-vous.'
    relic: 'Une étiquette d''emballage en double'
    relic_desc: 'Une copie fictive nommant l''almanach et sa lettre d''accompagnement.'
    points:
      p1: 'Conservez la copie de l''imprimeur à part afin que Banneker puisse envoyer son almanach manuscrit avec la lettre.'
      p2: 'Demandez à Banneker quels documents de travail il souhaite copier, puis faites en sorte qu''un jeu vérifié reste à l''écart de la maison.'
    points_fail:
      p1: 'L''imprimeur prend la seule copie disponible pour la lettre. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'La plupart des documents de travail restent à la maison et brûlent avec la maison.'
    shift:
      p1:
        was: 'Le 19 août 1791, Banneker écrivit à Jefferson et joignit une copie manuscrite de son almanach.'
      p2:
        was: 'Le jour des funérailles de Banneker en 1806, un incendie détruisit sa maison et une grande partie de ses manuscrits.'
        now: '{staff} demande à Banneker quels cahiers peuvent être conservés ailleurs et trouve un imprimeur prêt à les copier. Après l''incendie, les lecteurs peuvent toujours consulter une copie de ses observations et calculs de travail.'
        who: 'banneker_maryland'
        bio: 'Certains des autres documents de travail de Banneker survivent séparément aux côtés du journal qui a survécu dans l’histoire.'
    vignettes:
      packet: 'Rachel voit les mois sur la première page et commence l''étiquette d''un livre de calculs. Vous placez la lettre à côté et lui demandez de terminer l''étiquette après avoir lu l''adresse. Elle enfile une cravate dans les deux emballages. Les tableaux voyageront sous le nom de l’expéditeur et avec son argument toujours joint.'
      handoff: 'Isaac a de la place dans la sacoche pour un paquet plat. La cire sur la lettre est encore molle. Vous maintenez l''emballage ouvert pendant qu''il y glisse une protection pliée pour empêcher la lettre de coller aux tables. Il repart avec les deux. Vous restez suffisamment longtemps pour observer la case vide que le paquet a laissée sur la table.'
      reply: 'Vous savez qu''une réponse viendra rapidement. Isaac demande si cela règle ce que la lettre a soulevé. Vous copiez la date sur le paquet sortant et laissez l''espace pour une réponse tel que vous l''avez trouvé. Le paquet est en route. Aucune promesse n’est revenue par la porte.'
  mitchell_nantucket:
    name: 'Repérer le champ avant que le nuage n’arrive'
    place: 'Nantucket'
    figure: 'Maria Mitchell'
    story: 'Une lettre reproduite dans Maria Mitchell : Life, Letters, and Journals rapporte que Mitchell a découvert une comète télescopique à Nantucket le 1er octobre 1847. Son père a noté la découverte et a écrit au directeur de l''observatoire de Harvard par le premier courrier envoyé sur le continent.'
    story_prose:
      opening:
        - 'Une rafale traverse le toit de Nantucket. Maria Mitchell glisse ses notes sous la lampe pour les maintenir immobiles. Elle veut enregistrer où se trouvait l''objet et à quelle heure. Son père attend un étage en dessous pour entendre les chiffres. La météo retient le bateau postal.'
        - 'Mitchell trouva une comète le 1er octobre 1847. Son père écrivit à William Bond à Cambridge. La médaille danoise a été décernée plus tard après une correspondance concernant la réclamation. Ici, vous pouvez recevoir le premier avis sur le courrier sortant et en envoyer un second au destinataire désigné pour le prix.'
        - 'Quelqu''un qui lit les cartes du ciel ou vérifie les horaires peut vous aider avec l''avis. Faites appel à une personne familière avec la poste pour organiser les deux adresses.'
      points:
        p1: 'Maria lit l''heure et son père demande quelle étoile brillante elle a utilisée comme guide. Vous lui relisez la position et constatez que l''avis pour Bond n''a toujours pas de date. L''encre est à peine sèche qu''une voix au quai réclame le courrier. La date est lisible au moment où le facteur dépose la première lettre dans son sac.'
        p2: 'La deuxième page a la même heure d''observation. L''enveloppe a besoin d''une adresse différente. Vous lisez les règles à haute voix et le facteur fait une entrée séparée pour le destinataire qu''il nomme. Maria attend qu''il ait fini avant de ranger ses observations. Deux lettres quittent l’île, et une seule traversera l’Atlantique.'
      outcomes:
        all: 'Le destinataire danois reçoit un avis qui suit la procédure publiée. Lorsque la sentence sera examinée, Mitchell pourra produire le dossier d''envoi daté à la place de l''appel ultérieur.'
        p1: 'Cambridge reçoit l''avis porté par le premier courrier. La médaille nécessitera toujours sa propre correspondance.'
        p2: 'La deuxième adresse a été vérifiée. Le premier courrier à destination de Cambridge a mal tourné et la succursale ne peut pas rester intacte.'
      none: 'Les notes du toit restent dans la maison. L''avis non posté ne donne rien au comité d''attribution à ce jour.'
      not_admitted: 'La famille demande en bas qui est venu. Les billets restent sur le toit tandis qu''on entend le facteur passer dans la rue.'
      desync: 'La lettre de Bond manque le premier courrier. Le bureau rappelle le voyageur lorsque le voyage n''est plus synchronisé ; les observations originales sont toujours dans la maison.'
      excerpts:
        p1: 'L''encre est à peine sèche qu''une voix au quai réclame le courrier. La date est lisible au moment où le facteur dépose la première lettre dans son sac.'
        p2: 'Maria attend qu''il ait fini avant de ranger ses observations. Deux lettres quittent l’île, et une seule traversera l’Atlantique.'
    relic: 'Un petit télescope'
    relic_desc: 'Un petit télescope en laiton avec une trace de sel marin sur le tube.'
    points:
      p1: 'Préparez l''avis daté de la famille pour le premier courrier à l''observatoire de Cambridge'
      p2: 'Envoyez un deuxième avis au récipiendaire danois désigné sur le premier bateau et épargnez à Mitchell le dernier appel de médaille.'
    points_fail:
      p1: 'Les observations restent dans le journal familial, mais l’avis manque le premier courrier. Le bureau rappelle l''employé après une perte de synchronisation.'
      p2: 'Seul l''observatoire est informé. Les juges ne peuvent décerner la médaille selon les règles habituelles car le récipiendaire désigné n''a pas été avisé.'
    shift:
      p1:
        was: 'Le 3 octobre 1847, le père de Mitchell écrivit à l''observatoire de Cambridge au sujet de la découverte du 1er. Sa lettre est partie dans le premier courrier après l''observation.'
      p2:
        was: 'En 1848, une correspondance concernant le prix indique que l''avis immédiat requis n''est pas parvenu aux destinataires désignés. Mitchell a ensuite reçu la médaille après que sa réclamation ait été déposée auprès du gouvernement danois.'
        now: '{staff} vérifie les règles et aide la famille à mettre un autre avis sur le même bateau. Les juges peuvent examiner la réclamation selon les règles habituelles car la notification est arrivée par la voie appropriée.'
        who: 'mitchell_nantucket'
        bio: 'Mitchell a été reconnu grâce à un rapport opportun. Elle a commencé à enregistrer lorsqu''elle a vu un objet, quand elle a envoyé l''avis et qui l''a reçu.'
    vignettes:
      field: 'L''assistant a dessiné lui-même le point faible. Vous demandez ce qu''il utiliserait pour pointer l''instrument vers lui. Il ajoute deux étoiles et une direction avant que le nuage ne passe. Vous copiez ces marques. Vous n''avez toujours pas de position ultérieure à comparer.'
      post: 'Vous savez que la nouvelle devra voyager hors de l''île. L''assistant veut enregistrer une découverte avant de décrire ce qui a été vu. Vous inscrivez la date et le champ sur un feuillet séparé et laissez la ligne suivante pour vérification. Il reste vide lorsque le paquet descend à terre.'
      cloud: 'Vous attendez avec le dessin en main pendant que le nuage recouvre la faible marque. Avant de le plier, vous encerclez une étoile que vous espérez trouver même si l''objet faible a disparu. Vous ramenez un poste qui peut être à nouveau recherché. Personne ne le voit une seconde fois avant votre retour.'
  caroline_herschel_slough:
    name: 'Celle qui scrutait le ciel'
    place: 'Slough'
    figure: 'Caroline Herschel'
    story: 'Caroline Herschel a rapporté avoir remarqué un objet différent des étoiles bien définies le 1er août 1786. Elle a comparé ses observations avant d''écrire à Charles Blagden.'
    story_prose:
      opening:
        - 'À la tombée de la nuit à Slough, Caroline Herschel demande à son assistante de déplacer la lampe. L''objet qu''elle vient de dessiner est flou sur les bords, tandis que les étoiles les plus brillantes à proximité sont claires. Si elle veut le retrouver demain, elle aura besoin d''un dessin qu''elle pourra lire dans le noir.'
        - 'En histoire, Herschel compara les observations des 1er et 2 août 1786 et envoya des dessins à Charles Blagden. Elle a ensuite été payée pour aider son frère et a pris des mesures lorsqu''il était au télescope. Dans cette agence, elle peut demander à bénéficier de ses propres nuits.'
        - 'Quelqu''un qui lit l''horloge et fait correspondre les diagrammes peut aider à créer une paire utilisable. Une personne capable de négocier peut accompagner son emploi du temps potentiel avec le rapport.'
      points:
        p1: 'Il y a trois points sur le premier dessin. L''assistant retourne la deuxième feuille dans le mauvais sens. Vous demandez à Herschel de commencer avec la même étoile de référence et de lui faire pointer chaque point tour à tour. Les deux feuilles comportent des heures dans la marge. Elle les rassemble près de la lampe et enregistre elle-même le changement de position. Lorsqu’elle les plie, elle garde l’heure de la première nuit à l’extérieur.'
        p2: 'La personne qui prend le rapport a fait place aux dessins. Vous demandez à Herschel de placer son calendrier à côté d''eux afin qu''il puisse voir combien de nuit il lui reste après avoir pris des mesures au grand télescope. Elle écrit son propre nom sur deux espaces clairs et demande que les deux types de travaux soient répertoriés séparément. Sur le prochain calendrier, elle peut encercler ses propres nuits à l''avance.'
      outcomes:
        all: 'Le rapport conserve à la fois les dessins et sa demande de temps. Lorsque la routine de l’assistante est fixée, certaines nuits sont réservées aux observations qu’elle choisit.'
        p1: 'La lettre porte les comparaisons et les dessins. Elle installera toujours son propre télescope pendant les nuits passées à enregistrer le travail de son frère.'
        p2: 'Le calendrier proposé a quitté la maison. Sans suffisamment d’étoiles de référence dès la première nuit, la demande est le seul changement que ce voyage puisse préserver.'
      none: 'Les deux dessins se trouvent côte à côte, avec trop peu de références pour pouvoir être comparés. Le planning reste tel qu''il était.'
      not_admitted: 'L''assistant demande au visiteur de garder l''échelle dégagée. La lampe rentre sous son abat-jour et le voyageur reste en dessous.'
      desync: 'Haze a gâté les stars de référence dès la première soirée. Lorsque le deuxième dessin ne peut être comparé, le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Elle les rassemble près de la lampe et enregistre elle-même le changement de position. Lorsqu’elle les plie, elle garde l’heure de la première nuit à l’extérieur.'
        p2: 'Elle écrit son propre nom sur deux espaces clairs et demande que les deux types de travaux soient répertoriés séparément. Sur le prochain calendrier, elle peut encercler ses propres nuits à l''avance.'
    relic: 'Une règle de relevé du ciel'
    relic_desc: 'Une règle en bois avec une échelle, utilisée pour marquer les zones balayées sur une carte stellaire.'
    points:
      p1: 'Marquez les étoiles de référence et l''heure sur les deux dessins afin qu''Herschel puisse montrer que l''objet s''est déplacé entre les deux nuits.'
      p2: 'Utilisez le premier rapport de comète de Herschel pour garantir des nuits régulières pour ses propres observations'
    points_fail:
      p1: 'Une faible brume laisse trop peu de points de référence clairs sur le premier dessin. Le deuxième tirage ne permet pas d''établir de mouvement dans cette branche, et le bureau rappelle l''employé.'
      p2: 'Lorsque son frère utilise le grand télescope, elle passe la soirée à noter ses lectures, et ses propres observations s''articulent toujours autour des siennes.'
    shift:
      p1:
        was: 'Les 1er et 2 août 1786, Caroline Herschel enregistra le mouvement d''une comète présumée et envoya ses observations et dessins.'
      p2:
        was: 'En 1787, Caroline Herschel reçut un salaire d''assistante de son frère ; dans son premier rapport, elle avait déjà expliqué comment ce travail limitait son temps d''observation.'
        now: '{staff} aide Herschel à placer son programme d''observation à côté de son rapport sur la comète et à placer les deux devant un partisan. L''aménagement ultérieur de son travail lui réserve plusieurs nuits par mois pour ses propres observations.'
        who: 'caroline_herschel_slough'
        bio: 'En tant qu''assistante rémunérée, Herschel disposait de nuits régulières réservées à son propre travail et pouvait planifier ses recherches de comètes à l''avance.'
    vignettes:
      fixed: 'Vous marquez deux voisins brillants avant d''ajouter l''objet flou. Sur le deuxième dessin, les étoiles restent un guide utile, même après le décalage des pages.'
      doubt: 'L''assistant suggère de nettoyer la vitre. Vous demandez à quoi ressemblent les autres étoiles à travers elle. Ils restent nets et l''assistant garde la marque incertaine sur la feuille.'
      lamp: 'Vous ombragez la lampe pendant que l''assistant écrit l''heure. Lorsque la couverture est remise en place, les deux dessins comportent encore des heures à côté d''eux.'
  kovalevskaya_stockholm:
    name: 'Les conditions en première page'
    place: 'Stockholm'
    figure: 'Sofia Kovalevskaya'
    story: 'L’article de Kovalevskaya sur la rotation autour d’un point fixe est paru dans Acta Mathematica en 1889. L’ouvrage identifie un cas intégrable avec des conditions particulières sur les moments d’inertie et la position du centre de masse.'
    story_prose:
      opening:
        - 'À Stockholm, un correcteur a apposé un cachet en laiton sur une page volante. Kovalevskaya lui en a remis une copie de travail. Les mémoires révisés se trouvent à l’autre bout du bureau. Les deux premières pages mentionnent un corps en rotation, et les titres à eux seuls ne lui diront pas ce qui a changé.'
        - 'L''œuvre valut à Kovalevskaya le Prix Bordin en 1888. Les mémoires parurent en 1889, l''année où Stockholm lui donna une chaire permanente. Vous pouvez conserver ses hypothèses dans le dossier du journal et demander une confirmation écrite préalable de la date du rendez-vous.'
        - 'Demandez à quelqu''un qui peut faire correspondre les symboles aux diagrammes de vérifier le paquet. Dès que des nouvelles de Paris arrivent, envoyez quelqu''un qui pourra obtenir une réponse écrite avec une copie de son planning d''enseignement.'
      points:
        p1: 'Le correcteur montre la pointe du haut et demande si c’est aussi le centre de masse. Vous dessinez deux points et lui faites trouver celui fixe sur la première page, puis revenez à la condition concernant l''autre. Kovalevskaya vérifie les symboles sur les deux feuilles et vous indique quelle page va dans le paquet. Le correcteur conserve le dessus et la copie reliée a à nouveau ses conditions sur la première page.'
        p2: 'L''employé met de côté les nouvelles de Paris et demande qui donnera les cours déjà indiqués. Vous parcourez tous les deux son emploi du temps et trouvez le premier cours qu''elle devra préparer. Il emporte la liste et revient avec une lettre indiquant la date du rendez-vous. Elle le clipse à la première semaine des cours du trimestre prochain.'
      outcomes:
        all: 'La revue reçoit les conditions avec le mémoire et l''université confirme la date dans le temps. Elle remplit les heures qu''elle a réservées à la recherche.'
        p1: 'La première page correcte accompagne le papier. La confirmation écrite étant toujours en attente, elle doit quand même planifier les cours.'
        p2: 'Elle a une lettre avec la date de début. Le paquet du journal tourne mal et le voyage ne conserve que la scène dans laquelle l''employé lui remet la réponse.'
      none: 'Les deux piles restent sous le dessus. La date de début est encore vide lorsque le voyageur se tourne vers l''horaire d''enseignement.'
      not_admitted: 'Le correcteur rassemble ses pages et dit qu''il attendra que l''auteur identifie le visiteur. Dehors, le voyageur entend le dessus de cuivre cogner contre le bureau.'
      desync: 'Une première page plus ancienne sans les conditions est placée dans le paquet du journal. La publication historique ne correspond plus, et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Kovalevskaya vérifie les symboles sur les deux feuilles et vous indique quelle page va dans le paquet. Le correcteur conserve le dessus et la copie reliée a à nouveau ses conditions sur la première page.'
        p2: 'Il emporte la liste et revient avec une lettre indiquant la date du rendez-vous. Elle le clipse à la première semaine des cours du trimestre prochain.'
    relic: 'Une toupie de démonstration'
    relic_desc: 'Une toupie en laiton avec un chiffre gravé dans son axe.'
    points:
      p1: 'Vérifiez la copie de travail de Stockholm par rapport aux mémoires révisés. Conservez le brouillon précédent hors du paquet pour le journal'
      p2: 'Apportez des nouvelles de Paris et une liste de ses fonctions d''enseignante à l''université de Stockholm. Demandez quand commencera son nouveau rendez-vous et obtenez-le par écrit'
    points_fail:
      p1: 'Un brouillon plus ancien est placé dans le paquet du journal avec des conditions manquantes sur la première page. Le bureau rappelle {staff} lorsque la publication n''est plus synchronisée.'
      p2: 'La nouvelle parvient à l''université. Elle doit encore planifier le prochain trimestre sans date de début écrite.'
    shift:
      p1:
        was: 'L’Académie de Paris annonça le Prix Bordin pour l’œuvre de Kovalevskaya en décembre 1888. Ses mémoires élargis parurent dans Acta Mathematica en 1889.'
      p2:
        was: 'Elle devient professeur titulaire à Stockholm en 1889.'
        now: 'Dans cette branche, l’université confirme par écrit la date de début des études suffisamment tôt pour qu’elle puisse planifier l’enseignement et la recherche du prochain semestre.'
        who: 'kovalevskaya_stockholm'
        bio: 'Kovalevskaya a enseigné et étudié la rotation des corps rigides à Stockholm. Le prix international et ses conditions de travail locales ont été décidés par différentes institutions.'
    vignettes:
      conditions: "Le raccourci sur une feuille d’exercices dit «\_un corps en rotation\_». Vous utilisez la première page pour restaurer deux qualifications, une pour l'inertie et une pour l'emplacement du centre de masse. Le correcteur copie les deux sur sa fiche. Vous pouvez supprimer la correction, mais le numéro du journal est toujours à venir."
      diagram: 'Le correcteur veut essayer un haut-jouet. Vous esquissez un point qui reste fixe et marquez le point distinct qui représente le centre de masse. Il peut indiquer lequel est lequel sur la copie suivante. Le jouet tourne encore lorsque votre temps est écoulé, et il n''a pas prouvé le papier.'
      clip: 'Vous placez les hypothèses à l’extérieur de l’exercice et y insérez son diagramme libre. Le prochain lecteur verra les conditions avant le résultat. Vous rapportez à la maison le contour d''un plateau et laissez l''épreuve sur le bureau.'
  heron_alexandria:
    name: 'La figure à côté de la ligne'
    place: 'Alexandrie'
    figure: 'Héron d’Alexandrie'
    story: 'Hero’s Mechanics décrit des machines permettant de soulever et de déplacer de lourdes charges. Des fragments du grec original survivent aux côtés d’une traduction arabe complète. La visite de son atelier se situe vers 62 après JC, date approximative de son activité.'
    story_prose:
      opening:
        - 'Alexandrie, vers 62 après JC. Hero’s Mechanics, écrit en grec, décrit comment des appareils peuvent aider à déplacer une lourde charge.'
        - 'Dans l’histoire, le grec ne survit que par fragments, tandis que l’œuvre complète survit sous forme de traduction arabe. Dans cette branche, une copie attend que ses diagrammes soient vérifiés et quelqu''un est prêt à la stocker séparément.'
        - 'Quelqu’un qui peut faire correspondre un diagramme à ses mots peut vous aider. Il faut aussi quelqu’un qui puisse faire en sorte qu’un livre change de mains.'
      points:
        p1: '{staff} déplace la copie vers le tabouret sous le meilleur éclairage et demande à Hero de regarder deux lignes tracées de la même longueur. Il faut en lire un avec une autre page. Le copiste transfère la marque de l''original, puis demande à la personne qui prendra la copie de trouver lui-même l''endroit. Le lecteur apporte le rouleau jusqu''à la porte avant de l''ouvrir à nouveau. Lorsqu''il atteint la marque corrigée, il y laisse son doigt.'
      outcomes:
        all: 'Le deuxième rouleau ne retourne jamais dans les rayons de l’atelier. Chaque fois qu''elle est empruntée, la même marque peut toujours conduire le lecteur vers la page.'
        p1: 'Le lecteur attache la copie séparément avant de partir. Les vieux rouleaux restent en atelier ; celui corrigé sort.'
      none: 'L''exemplaire reste parmi les rouleaux les plus anciens. Avant que la porte ne se ferme, quelqu''un qui est venu chercher retire sa main.'
      not_admitted: '{staff} n’entre jamais dans l’atelier. On peut entendre quelqu''un tirer un tabouret vers la lumière.'
      excerpts:
        p1: 'Le lecteur apporte le rouleau jusqu''à la porte avant de l''ouvrir à nouveau. Lorsqu''il atteint la marque corrigée, il y laisse son doigt.'
    relic: 'Un seuil de maquette marqué'
    relic_desc: 'Une pièce du modèle fictif de l''atelier, avec une entaille à l''endroit où la porte a frotté.'
    points:
      p1: 'Aidez Hero à vérifier les chiffres sur une copie grecque de la Mécanique et à faire en sorte que cette copie soit séparée des propres rouleaux de l''atelier.'
    points_fail:
      p1: 'L''atelier conserve ses propres rouleaux. Dans cette branche, comme dans l’histoire, seuls des fragments du texte grec subsistent, tandis qu’une traduction arabe conserve l’œuvre complète.'
    shift:
      p1:
        was: 'Hero a écrit la Mécanique en grec au premier siècle après JC. Seuls des fragments du texte grec survivent. La traduction arabe de Qusṭā ibn Lūqā conserve l’œuvre complète.'
        now: 'Une copie vérifiée du texte grec et de ses figures est conservée hors de l''atelier. Dans cette branche, cette copie parvient aux lecteurs ultérieurs.'
        who: 'heron_alexandria'
        bio: 'Dans cette branche, une copie grecque complète de la Mécanique survit aux côtés de la tradition arabe.'
    vignettes:
      threshold: 'Nikanor installe la porte miniature sur le banc et le retour s''arrête à la largeur d''un doigt. Vous marquez l''endroit où il frotte. Une coque de lentille plate s''est coincée sous le modèle ; il l''efface. Une fois la porte fermée, il vous demande de laisser la marque afin qu''il puisse retrouver l''endroit.'
      audience: 'Berenikē a déjà vu la balançoire qui ouvre la porte et prend son manteau. Vous lui demandez de surveiller le bord éloigné pour un compte supplémentaire. Quand il revient, elle aperçoit un éclat de lumière que Nikanor a manqué. Il garde le modèle sur le banc pour un deuxième essai au lieu de l''envoyer.'
      future: 'Vous pourriez dire à Nikanor à quelle distance les lecteurs placeront ces pages à côté de photos de machines. Il regarde sa porte s''installer avec un léger clic. Vous écoutez avec lui. Lorsque vous partez, il rappelle la cliente pour voir le seul mouvement qu''elle a manqué.'
  pliny_stabiae:
    name: 'Le vent à Stabies'
    place: 'Stabies'
    figure: 'Pline l’Ancien'
    story: 'Pline le Jeune écrivit plus tard à Tacite au sujet de son oncle atteignant Pomponianus à Stabiae lors de l''éruption de 79 CE. Le vent qui l''emportait empêchait les navires chargés de repartir.'
    story_prose:
      opening:
        - 'En 79 après JC, un nuage s''élevait au-dessus de la baie. Pline le Jeune raconta plus tard à Tacite que son oncle avait reçu un appel à l''aide et était parti en bateau.'
        - 'Dans l''histoire, l''Ancien Pline atteignit Pomponianus à Stabiae et n''en revint pas vivant de son rivage. Dans cette branche, le navire peut se rapprocher de la partie de la côte à laquelle Rectina a demandé de l''aide. Il pourrait également être possible d’éloigner Pline de la plage.'
        - 'Il faut quelqu''un qui connaît le rivage et qui sait comment y accéder par bateau. Une fois à terre, il faut quelqu''un qui a apporté un équipement adapté et qui peut aider un homme qui a du mal à respirer.'
      points:
        p3: '{staff} atteint Pline l’Ancien sur la plage, lui sort l''équipement de protection et demande aux gens autour de lui de dégager le passage. Les pieds ont pressé durement les cendres. Le groupe s''arrête une fois, attendant son souffle avant de repartir. Lorsqu’il peut s’asseoir, il efface quelques pierres de l’épaule d’un compagnon. Le bateau au bord du rivage fait toujours du bruit.'
        p2: 'Plusieurs personnes sur le pont veulent faire demi-tour. {staff} demande qui sait où habite Pomponianus et demande à cette personne de se tenir là où le rivage peut être vu. Le navire atteint un endroit où ils peuvent descendre. Lorsque Pomponianus vient à sa rencontre, l''Ancien Pline tient toujours un bout de corde. Il le repasse à bord avant de poser le pied à terre.'
        p1: '{staff} demande quelle partie des bas-fonds peut encore être approchée et aide l''équipage à laisser à Rectina un endroit où s''emparer. Elle laisse d''abord passer ce qu''elle tient et lâche prise avant que quiconque ne le prenne fermement. Une fois qu''ils l''ont remontée à bord, elle pose sa main mouillée sur l''endroit qu''ils lui ont réservé. Quelqu''un récupère ce qu''elle leur a transmis.'
      outcomes:
        all: 'Après avoir quitté le rivage, quelqu''un met ce que Rectina a remis dans un endroit sec. L''Ancien Pline se repose de l''autre côté. Il y a enfin de la place pour traverser le bateau.'
        p3: 'L''équipage laisse à Pline un coin sec sur le chemin du retour. La personne qui l''aide à s''asseoir attend qu''il baisse sa main.'
        p2: 'Pline arrive effectivement à la maison de Pomponianus. Les pierres apportées avec eux tombent de leurs chaussures devant la porte.'
        p1: 'Une fois à bord, Rectina reste à l''endroit qui lui est réservé. Elle récupère son paquet avant d''avoir enlevé ses vêtements mouillés.'
      none: 'Depuis le mouillage, ils ne voient plus plus loin sur le rivage. Les personnes qui ont été dans l''eau attendent un autre appel.'
      not_admitted: 'Le {staff} ne monte jamais à bord. Quelqu''un sur le rivage tire une ligne et la proue se détourne lentement.'
      desync: 'Le navire n''atteint pas Stabiae. Pomponianus n''a pas vu Pline lorsque l''agence rappelle {staff}.'
      excerpts:
        p3: 'Lorsqu’il peut s’asseoir, il efface quelques pierres de l’épaule d’un compagnon. Le bateau au bord du rivage fait toujours du bruit.'
        p2: 'Lorsque Pomponianus vient à sa rencontre, l''Ancien Pline tient toujours un bout de corde. Il le repasse à bord avant de poser le pied à terre.'
        p1: 'Une fois qu''ils l''ont remontée à bord, elle pose sa main mouillée sur l''endroit qu''ils lui ont réservé. Quelqu''un récupère ce qu''elle leur a transmis.'
    relic: 'Une tablette de cire'
    relic_desc: 'Une tablette de bois enduite de cire, où le stylet a laissé des notes.'
    points:
      p1: 'Lorsque les bas-fonds et les débris de la montagne bloquent le rivage, aidez Pline l’Ancien à amener le navire sur la côte de Rectina et à le monter à bord.'
      p2: 'Sous les pierres ponces et les pierres qui tombent, maintenez le navire de Pline l’Ancien sur sa route vers Stabiae, afin qu''il atterrisse et atteigne Pomponianus.'
      p3: 'Lorsque l''odeur de soufre et de poussière se rapproche de la plage de Stabiae, gardez sa respiration claire et sauvez l''Ancien Pline, en le faisant quitter le rivage vivant.'
    points_fail:
      p1: 'Le navire ne pouvait pas accéder à son rivage, et dans cette branche personne n''a embarqué Rectina.'
      p2: 'Le navire a été refoulé avant que Stabiae et Pline n''atteignent Pomponianus. La succursale s''est détachée de l''histoire et le bureau a rappelé l''employé.'
      p3: 'Il tomba sur la plage de Stabiae, comme le raconte l''histoire, et dans cette branche non plus, il ne put être retenu.'
    shift:
      p1:
        was: 'En 79 ap. J.-C., le message de Rectina incita Pline l’Ancien à naviguer pour apporter son aide. Son neveu décrit le rivage obstrué et le cours vers Stabiae, mais ne dit pas ce qu''est devenue Rectina.'
        now: 'Le navire est arrivé à terre et Rectina a été embarquée. Elle continua son voyage jusqu''à Stabiae.'
      p2:
        was: 'Pline le Jeune raconta plus tard à Tacite que son oncle atteignit Pomponianus à Stabiae par un vent suivant, le même vent qui empêchait les bateaux de partir.'
      p3:
        was: 'Le lendemain, alors que l''odeur du soufre et les flammes approchaient, Pline l’Ancien se leva sur la plage de Stabiae, soutenu par deux esclaves, et s''effondra ; son neveu a écrit que l''air chargé de poussière lui obstruait la respiration. Son corps a été retrouvé deux jours plus tard.'
        now: '{staff} a empêché la poussière de respirer et l''a fait sortir de la plage. Quand le vent tourna, il retourna en bateau à Misène et vécut encore quelques années.'
        who: 'pliny_stabiae'
        bio: 'C''est dans cette ligne que l''Ancien Pline revint vivant de la plage de Stabiae. Il retourna dans la flotte à Misenum et vécut quelques années.'
    vignettes:
      wind: 'Crispus a marqué tous les coffres chargés comme disparus. Depuis l''embrasure de la porte, vous observez le premier nouveau venu entrer avec de la cendre sur les épaules tandis que les bateaux chargés restent en vue. Crispus raye le mot disparu. Il vous demande de lui laisser de la place sur la tablette pour le prochain nom franchissant la porte.'
      lantern: 'Prima a le temps de faire un tour à travers la pièce avant que la lampe ne s''éteigne. Vous la placez près de la porte pendant qu''elle appelle les personnes qu''elle peut encore voir. Le tablette de cire devient foncé en premier. Elle répète à haute voix les deux derniers noms et vous répondez à chacun d’eux.'
      letter: 'Vous vous souvenez de la lettre qui sera envoyée des années plus tard. Prima s''interroge sur l''homme qui portait la liste, dont le nom n''y apparaîtra jamais. Vous mettez de côté votre compte du matin à venir et l''aidez à terminer le rouleau. A la fin de votre visite, vous pouvez encore entendre quelqu''un arriver dans le couloir.'
  galen_rome:
    name: 'Les titres qui ont survécu à l’incendie'
    place: 'Rome'
    figure: 'Galien'
    story: 'Dans Éviter la détresse, Galen décrit la perte de livres et d''autres biens lors de l''incendie de Rome en 192. Il distingue ses exemplaires manquants des œuvres qu''il croyait ne plus pouvoir récupérer.'
    story_prose:
      opening:
        - 'Rome, 192. Galien a envoyé des rouleaux vers la Campanie et a laissé des livres et des objets en stock à Rome. Plus tard, dans Éviter la détresse, il se souvient de ces choses séparément.'
        - 'Dans l’histoire, l’incendie a détruit des livres, y compris des ouvrages qu’il pensait ne jamais pouvoir remplacer. Dans cette branche, une charge part en avance. Quelqu''un peut parcourir les listes avec lui avant qu''elles ne soient fermées.'
        - 'Quelqu''un qui sait quels livres vont avec quelle charge peut vous aider. Il faudrait également demander aux artisans quels instruments pourraient être refaits de mémoire et lesquels ne le pourraient pas.'
      points:
        p3: '{staff} trouve le glossaire de la comédie sur la liste des magasins de Rome et demande à Galen de revoir sa destination. Galen l''ouvre à un endroit qu''il consulte souvent, puis dit à la personne qui charge le premier envoi de le mettre avec les livres pour la Campanie. Pendant que le couvercle est mis en place, Galen tend la main pour retourner l''attache vers le haut afin qu''elle ne soit pas coincée en dessous.'
        p2: 'Le magasin n''a pas encore pris tous les instruments. {staff} demande à un artisan ce qui serait le plus difficile à refaire et lui fait préparer un deuxième modèle sur son établi. Il attend que la cire prenne et marque le dessous. Quand quelqu''un vient dégager le banc, il garde le modèle à la main. Le deuxième va tout au fond de son tiroir.'
        p1: '{staff} sépare les deux manifestes et demande à la personne qui charge le premier envoi de relire celui destiné à la Campanie. Quelqu''un soulève un rouleau qui a failli être mis dans la pile de Rome. Après avoir vérifié auprès de Galen, il le déplace vers la charge en partant en premier. Avant de le fermer, le chargeur écrit à nouveau la destination dessus. Quelqu’un enroule l’extrémité libre du cordon autour d’un coin.'
      outcomes:
        all: 'Les livres envoyés en avance sont toujours disponibles en cas de besoin. Quelqu''un suit l''étiquette jusqu''au glossaire de la comédie, et à l''atelier le modèle de rechange est toujours là.'
        p3: 'Le manuscrit avance devant le feu, son lien vers le haut. Quiconque regarde plus tard peut le reconnaître sans démonter la charge.'
        p2: 'Avant de refaire l''instrument, l''artisan ouvre son propre tiroir et en sort le modèle.'
        p1: 'Les rouleaux marqués pour partir tôt partent en premier. La liste du magasin de Rome reste en suspens.'
      none: 'Le premier envoi est déjà chargé. Les rouleaux qui l''ont raté sont rangés comme avant.'
      not_admitted: '{staff} ne rencontre jamais la personne qui charge. Des pas transportant des objets s''éloignent derrière la porte du magasin.'
      desync: 'Les premiers rouleaux sont déposés au stock de Rome. L''encre de l''entrée erronée est encore humide lorsque l''agence rappelle {staff}.'
      excerpts:
        p3: 'Pendant que le couvercle est mis en place, Galen tend la main pour retourner l''attache vers le haut afin qu''elle ne soit pas coincée en dessous.'
        p2: 'Quand quelqu''un vient dégager le banc, il garde le modèle à la main. Le deuxième va tout au fond de son tiroir.'
        p1: 'Avant de le fermer, le chargeur écrit à nouveau la destination dessus. Quelqu’un enroule l’extrémité libre du cordon autour d’un coin.'
    relic: 'Une feuille d''inventaire'
    relic_desc: 'Un inventaire fictif avec un titre survivant et une colonne de copies vides.'
    points:
      p1: 'Local sécurisé sur l''envoi précédent pour les rouleaux de glossaire en prose déjà destinés à partir en Campanie'
      p2: 'Avant que les instruments ne soient entreposés, demandez à un artisan de fabriquer un deuxième modèle en cire d''un instrument difficile à remplacer et de le conserver à l''atelier.'
      p3: 'Persuader Galen d''envoyer son glossaire de la vieille comédie hors de Rome avec l''envoi précédent avant qu''il ne soit chargé'
    points_fail:
      p1: 'Les rouleaux sont déposés dans le stock de Rome et brûlent au lieu d''atteindre la Campanie. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'Il n''existe pas de modèle à consulter lorsque l''artisan doit refaire les instruments.'
      p3: 'Le manuscrit attend l’expédition estivale et est toujours là lorsque l’incendie survient.'
    shift:
      p1:
        was: 'Lorsqu''un incendie éclata à Rome à la fin de l''hiver de l''an 192, Galen déclara que son glossaire en prose était déjà parti en Campanie.'
      p2:
        was: 'En 192 après JC, l''incendie détruisit les instruments que Galen entreposait à Rome, y compris ceux qu''il avait conçus.'
        now: 'Un deuxième modèle en cire reste à l''atelier. Après l''incendie, Galien peut l''utiliser pour refaire l''instrument.'
      p3:
        was: 'À la fin de l''hiver de l''an 192, le glossaire de la Vieille Comédie de Galien brûla dans l''incendie de Rome.'
        now: '{staff} récupère les rouleaux dans l''envoi précédent et Galen peut continuer à réviser le texte à partir d''une copie après l''incendie. Un autre exemplaire parvient plus tard dans une collection en dehors de Rome.'
        who: 'galen_rome'
        bio: 'Galen avait une copie survivante de son glossaire de la vieille comédie après l''incendie. Il vérifiait continuellement ses citations et en déposait un autre exemplaire pour les lecteurs ailleurs.'
    vignettes:
      list: 'Tertia appelle trois noms d''une liste et compte trois livres. Vous lui demandez de toucher les volumes qui vont avec. Il y en a deux. Ensemble, vous laissez le troisième titre lisible et mettez une marque vide dans la colonne de copie.'
      borrow: 'Dion se souvient d''en avoir prêté une copie mais ne peut pas nommer le destinataire. Tertia veut décrocher le titre avant que la liste ne soit publiée. Vous l''aidez à se souvenir de la porte où il l''a remis. Elle garde une place sur la liste ouverte pour une réponse de cette rue.'
      survival: 'Vous avez lu un ouvrage sur cette même perte dans un exemplaire qui refait surface longtemps après l''incendie. Dion demande quel titre il peut mettre sur le bureau de demain. Vous laissez les noms dans l''inventaire et lui montrez les deux volumes réels. Le disparu n''a pas été retrouvé à votre départ.'
  ovid_tomis:
    name: 'Un poème et une ligne vide'
    place: 'Tomis'
    figure: 'Ovide'
    story: 'Dans le livre II de Tristia, Ovide décrit ses offenses comme un poème et une erreur, et refuse d''expliquer cette dernière. L''année événementielle fixe la visite en exil.'
    story_prose:
      opening:
        - 'Ovide est en exil à Tomis sur la mer Noire. Dans le deuxième livre de la Tristia, il dit avoir été puni pour un poème et une erreur. Il ne dit pas quelle était l''erreur.'
        - 'Dans l''histoire, le troisième livre conserve un poème sur le fait d''être malade. Dans cette branche, il y a des jours où même l''eau lui est difficile à supporter, et il n''a pas encore trouvé de voyageur pour emporter les pages.'
        - 'Ce voyage a besoin de quelqu''un prêt à s''occuper d''un patient. Il a également besoin de quelqu''un qui comprend le passage et qui puisse demander au voyageur où le paquet peut être remis.'
      points:
        p2: '{staff} trouve un voyageur familier avec le passage d''hiver, demande où le paquet peut être acheminé au prochain transporteur, puis demande à Ovide d''inscrire le nom du destinataire là où il peut être lu. Le voyageur aplatit séparément l''emballage intérieur et extérieur. Avant de appareiller, il donne l''adresse aux personnes à terre pour qu''elles puissent la vérifier une nouvelle fois. Ovide hoche la tête sur le côté du bateau.'
        p1: '{staff} demande quelle nourriture Ovide peut encore manger, en trouve un peu à proximité et laisse de l''eau près de son lit. Lorsqu''Ovide cherche un courant d''air, {staff} rapproche la tasse. Il boit d''abord et prend la page un peu plus tard. L’ombre de la tasse qui la recouvre se réduit à un petit coin.'
      outcomes:
        all: 'Le voyageur avec les pages a quitté le port. Quelqu''un change encore une fois l''eau près du lit et Ovide sort un autre drap.'
        p2: 'Sur le rivage, le voyageur indique à Ovide exactement où va le paquet. Ovide écoute le dernier arrêt.'
        p1: 'Il y a maintenant quelques périodes où il peut s''allonger tranquillement. On apporte toujours plus d''eau avant que sa tasse ne soit vide.'
      none: 'Les bateaux restent du côté abrité du port. Le paquet attendant un voyageur reste sur le coin de la table.'
      not_admitted: '{staff} ne rencontre jamais personne qui puisse les faire entrer. Une feuille tombe dans l''eau laissée devant la porte.'
      desync: 'Personne ne portera les poèmes. Lorsque l''agence rappelle {staff}, l''adresse se trouve toujours autour du paquet.'
      excerpts:
        p2: 'Avant de appareiller, il donne l''adresse aux personnes à terre pour qu''elles puissent la vérifier une nouvelle fois. Ovide hoche la tête sur le côté du bateau.'
        p1: 'Il boit d''abord et prend la page un peu plus tard. L’ombre de la tasse qui la recouvre se réduit à un petit coin.'
    relic: 'Une tablette d''écriture en cire'
    relic_desc: 'Une tablette de lettres en vers commencée sur le chemin de l''exil.'
    points:
      p1: 'Infirmière Ovide à cause de la maladie dans laquelle il tombe à Tomis, sans médecin, sans nourriture convenable et sans eau qu''il ne peut pas boire.'
      p2: 'Lorsque le voyage hivernal depuis Tomis est difficile, réservez une place pour le troisième livre de la Tristia avec un transporteur à destination de Rome.'
    points_fail:
      p1: 'Il couche malade sans personne pour le soulager, et dans cette branche, les premiers mois à Tomis sont aussi durs qu''il les a écrits.'
      p2: 'Aucun transporteur n''emmène le colis pour le trajet dans cette agence. Il n''arrive pas à temps à Rome et le bureau rappelle l''employé.'
    shift:
      p1:
        was: 'Vers l''an 9 après JC, Ovide tomba malade à Tomis ; dans Tristia III.3, il écrit qu''il n''y avait pas de médecin, pas de nourriture saine et d''eau à laquelle il ne pouvait pas s''habituer.'
        now: '{staff} lui trouve de l''eau propre et de la nourriture qu''il peut conserver, et s''assoit à ses côtés pendant la fièvre. Il est de nouveau sur pied plus tôt.'
      p2:
        was: 'Vers 9 ou 10 après JC, Ovide écrivit le troisième livre de la Tristia en exil. Il s''ouvre sur l''arrivée du livre à Rome et décrit la difficulté des déplacements hivernaux dans la région.'
    vignettes:
      rumor: 'Vous dites au transporteur que les lecteurs dans des siècles continueront à demander quelle était l''erreur. Il montre un endroit libre sur la feuille de rechange et demande ce qu''il doit y mettre. Vous ajoutez la destination sur le wrapper et laissez l''espace dans la copie. Le paquet repart avec son incertitude intacte.'
      verify: 'Le transporteur mémorise une version avec un nom supplémentaire. Vous demandez à voir de quelle feuille il provient. Il peut pointer du doigt le poème et l’erreur, et le passage s’arrête là. Vous marquez cette ligne sur votre propre tablette de cire. Vous n''avez toujours pas de nom lorsque le paquet part.'
      wrap: "Le vent soulève la feuille extérieure au moment même où le transporteur atteint le paquet. Vous numérotez les feuilles volantes et les remettez en ordre. Votre tablette de cire contient un rappel\_: laissez la ligne inexpliquée telle quelle. Vous manquez ce que le destinataire en fait."
  empedocles_akragas:
    name: 'Là où le chœur se sépare'
    place: 'Akragas'
    figure: 'Empédocle'
    story: 'Des fragments attribués à Empédocle décrivent quatre racines et un cycle d''adhésion et de séparation associés à l''amour et aux conflits. Bien plus tard, Diogène Laertius conserve des récits contradictoires sur sa mort.'
    story_prose:
      opening:
        - 'Akragas, vers le milieu du Ve siècle avant JC. Dans ses vers, Empédocle utilise quatre racines pour expliquer comment les choses se rassemblent et se séparent à nouveau.'
        - 'Dans l’histoire, seuls des fragments et des citations survivent du long poème. Dans cette branche, un copiste est prêt à préparer une autre copie, et quelqu''un ailleurs est prêt à la conserver.'
        - 'Quelqu''un qui peut entendre où une ligne ne mène pas à la suivante peut aider, et quelqu''un qui peut s''assurer que la copie sera retrouvée.'
      points:
        p1: '{staff} lit avec le copiste depuis le début et lui demande de s''arrêter à un endroit où tous deux étaient passés trop vite. Empédocle répète lentement les deux vers, puis attend qu''ils soient relus. Le lendemain, {staff} vérifie le début et la fin auprès de la personne qui prendra la copie. Les deux rouleaux ne partagent plus le même cordon. Le lecteur prend celui lié séparément et prononce une fois doucement sa première ligne.'
      outcomes:
        all: 'La copie conservée ailleurs ne voyage plus avec l''original. Lorsque quelqu''un pose plus tard des questions sur ces lignes, son gardien peut les faire sortir sans lancer de jet.'
        p1: 'Le lecteur place la nouvelle copie là où il peut l''ouvrir lui-même. L’autre rouleau reste sur la table du copiste.'
      none: 'Les premières lignes ne se rejoignent toujours pas dans la copie. À la fin de la journée, le lecteur remet le rouleau là où il se trouvait.'
      not_admitted: '{staff} rate la porte ouverte du copiste. De l’autre côté du mur sort une seule ligne, répétée de l’ancien rouleau.'
      excerpts:
        p1: 'Les deux rouleaux ne partagent plus le même cordon. Le lecteur prend celui lié séparément et prononce une fois doucement sa première ligne.'
    relic: 'Un morceau de vers'
    relic_desc: 'Une bande de la répétition imaginée, marquée à deux tours du vers.'
    points:
      p1: 'Aidez un copiste à compléter et à vérifier un exemplaire de Sur la nature et à faire en sorte qu''il soit conservé séparément.'
    points_fail:
      p1: 'Dans cette branche, comme dans l’histoire, les lecteurs ultérieurs ne peuvent reconstituer qu’une partie du poème à partir de citations et de fragments de papyrus.'
    shift:
      p1:
        was: 'Empédocle a mis ses idées en vers au Ve siècle avant JC. Sur la nature survit en partie grâce à des citations et des papyrus, dont des fragments publiés dans la collection de Strasbourg en 1999.'
        now: 'La copie est comparée au poème avant d''être envoyée à un autre lecteur. Dans cette branche, un texte complet survit aux côtés des extraits conservés dans d''autres ouvrages.'
        who: 'empedocles_akragas'
        bio: 'Dans ce vers, le poème Sur la nature d''Empédocle a survécu dans son intégralité, et les lecteurs ultérieurs ont pu suivre ses quatre racines, l''Amour et la Lutte, du premier vers au dernier.'
    vignettes:
      cue: 'Phaon n''a sauvegardé que la ligne la plus bruyante et les deux lecteurs se réunissent. Vous marquez les deux endroits où le sens tourne. Au premier signe, ils rapprochent leurs tabourets ; à la seconde, ils reculent chacun d''un pas. Cette fois, le lecteur face à la porte peut savoir où il se trouve sans voir la feuille.'
      handoff: 'Eirenē peut atteindre le deuxième couplet mais continue de sauter directement au dernier. Phaon propose de finir seul. Vous lui demandez de répondre en premier et de le laisser répondre depuis l''autre bout de la pièce. Quand le souper est appelé, elle met fin à la répétition au lieu de la quitter à mi-chemin.'
      sandal: 'Phaon demande de quelle histoire les gens se souviendront. Vous lui parlerez presque de la sandale de bronze dans un récit ultérieur de l''Etna. Il veut une ligne qu''il pourra pratiquer demain. Vous laissez la sandale de côté et répétez une fois sa partie inachevée avec lui. Au moment où vous parvenez à chercher Eirenē, les tabourets sont empilés.'
  hildegard_bingen:
    name: 'Un début qui reste muet'
    place: 'Bingen'
    figure: 'Hildegarde de Bingen'
    story: 'Une dispute au sujet d’un enterrement interrompit les chants dans la communauté d’Hildegarde. Ses lettres à Mayence relatent les enjeux pour elle. La restriction fut levée en mars 1179. Plusieurs recueils de ses écrits et de sa musique conservent le travail des copistes de Rupertsberg.'
    story_prose:
      opening:
        - 'Près de Bingen à la fin du XIIe siècle. Les lettres et la musique d’Hildegarde survivent, portant les traces des personnes qui les ont copiées et vérifiées à ses côtés.'
        - 'Dans l’histoire, une dispute au sujet d’un enterrement a interrompu le chant. La restriction a été levée en mars suivant. Dans cette branche, une vieille feuille d''exercice est presque vierge juste au-dessus de son premier mot.'
        - 'Quelqu''un qui connaît une partition ou un manuscrit peut vous aider. Il faut également quelqu’un prêt à laisser une marque douteuse ouverte jusqu’à ce que ceux qui l’ont chantée puissent la regarder.'
      points:
        p1: '{staff} demande au copiste de ne pas encore remplir la faible marque, étale l''ancienne feuille et la nouvelle, et fait regarder séparément Hildegarde et quelqu''un qui connaît le chant. Tous deux reconnaissent la marque ultérieure, mais le début nécessite encore une question. Le copiste met sur papier la partie convenue. Au-dessus du premier mot, elle laisse un espace plus large que l''espace entre deux lignes.'
      outcomes:
        all: 'Une fois la restriction terminée, quelqu''un apporte la feuille de rechange pour vérifier la première ligne. Sa main s''arrête à l''écart. Une personne qui connaît l''ancienne page vient se placer à côté d''elle.'
        p1: 'La prochaine fois qu''ils ouvriront la feuille de rechange, il sera toujours clair quel endroit a été copié de l''ancien et quelle question est restée ouverte.'
      none: 'La page de réserve reprend sa place. L''espace au-dessus du premier mot n''a pas été vérifié par rapport à l''ancienne page.'
      not_admitted: '{staff} n’entre jamais dans la salle de copie. Quelqu''un ferme une vingtaine de portes près de la porte et remet un tabouret bas à sa place.'
      excerpts:
        p1: 'Le copiste met sur papier la partie convenue. Au-dessus du premier mot, elle laisse un espace plus large que l''espace entre deux lignes.'
    relic: 'Une page de répétition marquée'
    relic_desc: 'Une page inventée avec un fil marquant son ouverture.'
    points:
      p1: 'Pendant que la pièce est calme, demandez à Hildegarde et aux copistes quelles marques endommagées reporter et où laisser une question sur la feuille de rechange.'
    points_fail:
      p1: 'La feuille de rechange est mise de côté avec un blanc au-dessus du premier mot. Le prochain lecteur devra encore se demander ce que dit l’ancienne page.'
    shift:
      p1:
        was: 'Les lettres d’Hildegarde décrivent l’interruption du chant. Les copistes de Rupertsberg ont conservé ses écrits et sa musique.'
        now: 'Dans cette branche, {staff} conserve l''ancienne feuille à côté de la copie. Les copistes d’Hildegarde peuvent distinguer les marques qu’ils lisent clairement et celles qui nécessitent un autre examen.'
    vignettes:
      opening: 'Agnès parvient encore à trouver le premier mot mais ne lit plus la marque endommagée au-dessus. Vous lui demandez de comparer la page de réserve avec la ligne qu''elle connaît. Elle pose un fil au bon endroit. Désormais, la personne suivante peut s’ouvrir directement au même début.'
      wait: 'Adelheid a les mots par cœur et s''apprête à classer la feuille endommagée. Vous le tenez là où Agnès peut tracer à nouveau la ligne. Adelheid copie l''ouverture sur une feuille de rechange, puis garde l''ancienne page à côté. Le prochain lecteur aura les deux.'
      return: 'Vous savez que la communauté chantera à nouveau, mais Adelheid a une page à ranger aujourd''hui. Vous l''aidez à montrer le point de départ sans lui donner de voix. Lorsque la porte se ferme, vous pouvez voir le fil entre les pages. Vous partez avant qu''on chante à nouveau dans cette pièce.'
  hua_tuo_xuchang:
    name: 'Le livre dont parle la chronique'
    place: 'Xuchang'
    figure: 'Hua Tuo'
    story: 'Le dernier Sanguozhi dit que Hua Tuo était incarcéré à Xu et raconte une tentative infructueuse de transmettre un livre de prison.'
    story_prose:
      opening:
        - 'Xu, à la fin des Han de l''Est. L’histoire de Chen Shou raconte comment l’emprisonnement de Hua Tuo s’est terminé et mentionne un volume qui n’a pas survécu.'
        - 'Dans l’histoire, le gardien n’a pas osé prendre le volume que Hua Tuo lui proposait. Il a été brûlé. Dans cette branche, quelqu''un demandera si un ami peut le réclamer, et quelqu''un envisage une demande de grâce.'
        - 'Quelqu’un qui comprend comment les pétitions et les dossiers passent de main en main peut aider. Le livre et la pétition auront chacun besoin d’une personne disposée à entendre une demande distincte.'
      points:
        p2: '{staff} demande à la personne disposée à porter la pétition d''attendre, puis vérifie le nom et le dossier avec elle. Après l''avoir pris, il les rappelle et écrit un accusé de réception sur le duplicata. Quelques jours plus tard, Hua Tuo franchit la porte et voit les gens attendre. Quelqu’un près du portail lui tend le bras. Il reste seul un moment avant de le prendre.'
        p1: 'Le gardien commence à prendre le livre de Hua Tuo, puis retire sa main. {staff} demande quel nom peut être inscrit comme destinataire et amène quelqu''un de la maison de Hua Tuo à signer. Ce n''est qu''après l''ouverture du registre sur une nouvelle page que le volume est distribué. Le destinataire ne trouve pas de tissu pour l''envelopper. Il enlève son vêtement de dessus et l''étale sur la table.'
      outcomes:
