    vignettes:
      bend: '{staff} voit un virage du rivage sur le point d''être tracé dans le cadre d''une ligne droite et demande un relèvement supplémentaire au tournant, afin que le virage reste sur la page.'
      repeat: '{staff} marche une seconde fois un tronçon au même rythme et écrit les deux comptes côte à côte, sans choisir entre eux.'
      sketch: '{staff} dessine le contour d''un promontoire au dos d''une feuille de pointage pendant que les autres se reposent et marque l''endroit où la ligne a été posée.'
  omar_khayyam_nishapur:
    name: 'Le premier jour du printemps'
    place: 'Ispahan, Perse'
    figure: 'Omar Khayyam'
    story: 'Dans les années 1070, le sultan Malik-Shah rassembla des astronomes pour effectuer des observations. Omar Khayyam a travaillé avec des érudits de sa cour d''Ispahan. Le calendrier Jalali est entré en vigueur le 15 mars 1079 et a fixé le début de l''année solaire à l''équinoxe de printemps.'
    story_prose:
      opening:
        - 'Ispahan, printemps 1079. Les savants réunis par Malik-Shah révisent le calendrier. Khayyam a participé aux observations et le nouveau décompte commence l''année à l''équinoxe de printemps.'
        - 'Dans l’histoire, le nouveau calendrier est entré en vigueur en mars. Le programme d''observation a pris fin après la mort de Malik-Shah. Khayyam a mentionné un livre qu''il a écrit sur l''extraction des racines, qui n''a pas survécu. Dans cette branche, un copiste d''almanachs dispose d''une feuille pouvant contenir quelques lignes supplémentaires.'
        - 'Ce voyage nécessite quelqu''un qui puisse vérifier les lectures des ombres et maintenir les anciennes et les nouvelles colonnes droites. Il lui faut également quelqu’un qui puisse vérifier un manuscrit et en envoyer une copie à une autre ville.'
      points:
        p1: 'Avant l''équinoxe, {staff} compare les extrémités des ombres aux lectures précédentes, trie une colonne mixte et demande à Khayyam de la comparer aux marques originales. Deux plis courent le long du bord du tableau de lectures. Lorsque le soleil se couche, la feuille est toujours ouverte et l''encre de cette colonne est de retour à l''intérieur des lignes.'
        p2: '{staff} vérifie le livre du copiste sur l’extraction des racines, compare les numéros facilement erronés avec l’original et transmet le manuscrit à quelqu’un à destination d’une autre ville. Le messager enveloppe la copie dans du tissu, l''attache et retire un côté. Le titre est tourné vers l''extérieur et le bord du papier apparaît encore au toucher sous le premier pli.'
      outcomes:
        all: 'La date de ce printemps est entrée dans le nouveau calendrier. Des années plus tard, quelqu''un a cherché le livre sur les racines d''une autre ville, dont les vieux coins frisent encore.'
        p2: 'Plus tard, quelqu’un dans une autre ville a recopié le livre en entier. Ils commencèrent par la première ligne avec à côté d’eux le vieux manuscrit usé.'
        p1: 'Le calendrier commençait au jour fixé. Il restait une feuille de comparaison, les deux titres côte à côte.'
      none: 'La vieille table est retournée dans sa boîte. Une feuille inachevée gisait dehors, tapant sur le bord chaque fois que le vent s''agitait.'
      not_admitted: '{staff} n’a jamais trouvé sa place auprès des copistes. Un drap s’est retourné à l’intérieur de la porte et, de l’extérieur, son en-tête avait disparu.'
      desync: 'Les colonnes n’étaient toujours pas d’accord au moment de la collecte de la feuille. Lorsque le {staff} a été rappelé, la dernière lecture était encore dans la marge.'
      excerpts:
        p2: 'Le messager enveloppe la copie dans du tissu, l''attache et retire un côté. Le titre est tourné vers l''extérieur et le bord du papier apparaît encore au toucher sous le premier pli.'
        p1: 'Deux plis courent le long du bord du tableau de lectures. Lorsque le soleil se couche, la feuille est toujours ouverte et l''encre de cette colonne est de retour à l''intérieur des lignes.'
    relic: 'Une feuille de calendrier avec deux titres'
    relic_desc: 'Une feuille de comparaison où les deux dates de nouvel an figurent côte à côte.'
    points:
      p1: 'Dans les jours qui précèdent l''équinoxe, conservez en sécurité les lectures fantômes qui le fixent, afin que le nouveau calendrier commence au jour fixé pour lui.'
      p2: 'Aide-le à faire faire un exemplaire supplémentaire de son livre sur l''extraction des racines et à l''envoyer dans une autre ville pour le conserver en lieu sûr, afin qu''il survive dans cette branche.'
    points_fail:
      p1: 'Les lectures de l''équinoxe ne se sont pas alignées et le nouveau calendrier n''a pas commencé le 15 mars.'
      p2: 'Le livre s''est perdu tout de même, comme dans l''histoire.'
    shift:
      p1:
        was: 'Le 15 mars 1079, le nouveau calendrier du sultan Malik Shah est entré en vigueur à son jour fixé, l''année commençant à l''équinoxe de printemps.'
      p2:
        was: 'Le livre de Khayyam sur l''extraction des racines est perdu, connu uniquement grâce à une mention dans son Algèbre.'
        now: 'Un exemplaire était envoyé dans une autre ville et déposé dans une bibliothèque, et les gens pouvaient encore le lire des siècles plus tard.'
        who: 'omar_khayyam_nishapur'
        bio: 'Dans cette ligne, son livre sur les racines n''a pas disparu avec les années d''observatoire. Une copie conservée dans une autre ville a continué à être lue et copiée après sa mort.'
    vignettes:
      spring: '{staff} place l''ancien tableau et le nouveau côte à côte et écrit en regard de chaque date à quelle date il appartient, afin que le prochain lecteur n''ait pas à deviner.'
      carry: '{staff} copie les deux titres d''une feuille pliée sur son extérieur, afin que celui qui la transporte puisse voir quelles colonnes comparer sans la déplier.'
      future: '{staff} sait comment ce calendrier sera écrit plus tard et conserve la date du calcul utilisé par les copistes, et non une date qu''ils n''ont jamais vue.'
  wright_kitty_hawk:
    name: 'Douze secondes dans les airs'
    place: 'Kitty Hawk, Caroline du Nord'
    figure: 'Orville et Wilbur Wright'
    story: 'En septembre 1903, les frères Wright revinrent à leur camp près de Kitty Hawk avec une machine motorisée. La tentative de Wilbur du 14 décembre échoua. Le matin du 17 décembre, ils effectuèrent quatre vols, le premier de douze secondes et le dernier de cinquante-neuf. Cet après-midi-là, ils marchèrent jusqu''à Kitty Hawk et télégraphièrent à leur père à Dayton.'
    story_prose:
      opening:
        - 'Près de Kitty Hawk, décembre 1903. Les frères Wright ont amené un Flyer à moteur. La tentative du 14 échoua. Il faut repartir le rail, et le vent souffle toujours.'
        - 'Dans l''histoire, le premier vol du 17 a duré douze secondes. Après le quatrième atterrissage, une rafale renversa l''appareil avec John Daniels du poste de sauvetage coincé entre les ailes. Dans cette branche, il y a une autre paire de mains au camp pour aider avec le rail et la machine au sol.'
        - 'Ce voyage a besoin de quelqu’un qui puisse garder les pieds dans le vent. Quelqu''un avec le bon équipement peut également aider à maintenir une aile large stable.'
      points:
        p1: 'Avant le décollage, le {staff} vérifie le sable sous le rail et stabilise l''aile face au vent jusqu''à ce qu''elle passe hors de portée. Daniels se tient près de la caméra. Le bout de l''aile passe devant l''extrémité du rail avec une bande de sable brillant en dessous.'
        p2: 'Après le quatrième atterrissage, le {staff} sent le vent se lever et aide l''équipe de sauvetage à maintenir l''aile baissée et à dégager Daniels. Le sable patine sous l''aile et les mains sur le bord tiennent bon. Lorsque le vent tombe, une légère ligne de sable s’étend sur le tissu.'
      outcomes:
        all: 'Les distances sont entrées dans le télégramme. Lorsque les frères ont emballé le Flyer, ils ont essuyé une nouvelle fois le tissu, laissant une fine couche de sable au fond de la boîte.'
        p2: 'Le Flyer a encore escaladé les dunes à plusieurs reprises. Celui qui l''a emballé a posé une longueur de câble de rail le long du tissu, puis a fermé le couvercle.'
        p1: 'Douze secondes et cent vingt pieds se sont écoulés dans les notes. La photographie se trouvait à côté de cette page.'
      none: 'Le vent traversa le camp et ensevelit à nouveau le pied du rail. Un seul point rouge était visible dans le poêle.'
      not_admitted: '{staff} n''a trouvé aucune place parmi les assistants. En passant devant le hangar, une extrémité du rail dépassait encore le sable.'
      desync: 'L''aile a gratté le sable et le Flyer s''est arrêté à côté du rail. Lors du rappel du {staff}, le vent soulevait toujours le tissu.'
      excerpts:
        p2: 'Le sable patine sous l''aile et les mains sur le bord tiennent bon. Lorsque le vent tombe, une légère ligne de sable s’étend sur le tissu.'
        p1: 'Daniels se tient près de la caméra. Le bout de l''aile passe devant l''extrémité du rail avec une bande de sable brillant en dessous.'
    relic: 'Une pale d’hélice'
    relic_desc: 'Une lame de bois en forme d''aile torsadée.'
    points:
      p1: 'Dans le vent froid du matin du 17 décembre, aidez les frères à stabiliser le Flyer et à assurer le premier décollage en toute sécurité.'
      p2: 'Après le quatrième vol, maintenez le Flyer sur le sable et sauvez Daniels et la machine.'
    points_fail:
      p1: 'Avant le décollage, une rafale soulève une aile et l''entraîne dans le sable, et l''engin ne quitte jamais le rail ; dans cette branche, il n''y a pas douze secondes.'
      p2: 'Le vent retourne le Flyer, Daniels est pris dans les ailes et tombe avec lui, et comme dans l''histoire, la machine est trop cassée pour voler à nouveau. Dans cette branche, il ne quitte jamais le sol après cet après-midi.'
    shift:
      p1:
        was: 'Le matin du 17 décembre 1903, Orville a volé pendant 12 secondes et 120 pieds.'
      p2:
        was: 'Le 17 décembre 1903, après le quatrième vol, une rafale renverse le Flyer avec John Daniels coincé entre les ailes, et l''appareil, gravement cassé, ne vole plus jamais.'
        now: '{staff} et les hommes de la station l''ont maintenu sur le sable, et Daniels n''a pas été rattrapé. Cet hiver-là, les frères l''ont fait voler encore quelques fois au-dessus des dunes avant de le mettre en caisse pour Dayton.'
    vignettes:
      numbers: '{staff} copie les quatre vols dans un carnet dans l''ordre dans lequel ils ont été effectués, les secondes dans une colonne et les pieds dans l''autre, et les additionne deux fois avant que la lumière ne s''éteigne.'
      sand: '{staff} extrait le rail de la dérive après le vent nocturne et tamponne le sable à plat à son pied. Un assistant de la station, rattrapé pour le jeu, dit que le vent va tomber dans la matinée, mais ce n''est pas le cas.'
      cold: 'Le {staff} maintient le poêle en marche dans le hangar pendant que le moteur est chaud. Les flaques d’eau à l’extérieur ont gelé et personne n’en parle.'
  van_gogh_auvers:
    name: 'Un été à Auvers'
    place: 'Auvers-sur-Oise'
    figure: 'Vincent van Gogh'
    story: 'Vincent van Gogh arrive à Auvers sur Oise le 20 mai 1890, loge à l''Auberge Ravoux et va souvent chez le docteur Paul Gachet. Il peignait presque une œuvre par jour. Dans une lettre datée du 10 juillet environ, il parlait de vastes champs de blé sous un ciel troublé. Le 27 juillet, il s''est tiré une balle dans la poitrine et est décédé le 29 juillet avec son frère Théo à ses côtés.'
    story_prose:
      opening:
        - 'Auvers-sur-Oise, été 1890. Van Gogh séjourne à l''Auberge Ravoux et peint presque tous les jours. Dans une lettre de juillet, il parle de vastes champs de blé sous un ciel troublé.'
        - 'Dans l’histoire, il s’inquiétait des moyens de subsistance de la famille de son frère et mourut à Auvers à la fin du mois. Dans cette branche, il y a quelqu''un sur le chemin entre le blé et l''auberge pour lui tenir une toile ou l''écouter.'
        - 'Ce voyage a besoin de quelqu''un qui puisse tenir un chevalet dans le vent, quelqu''un qui puisse donner un sens aux comptes du ménage et quelqu''un qui écoute. Une personne qui connaît les soins peut également s''asseoir avec lui à l''auberge.'
      points:
        p1: 'Le vent pousse contre la toile. {staff} soutient le pied libre du chevalet et maintient le coin au vent pendant que Van Gogh effectue ses derniers coups. Le blé le plus éloigné s''incline en premier, tandis que les tiges voisines remuent encore. Lorsque Van Gogh abaisse le pinceau, le bas de la toile est toujours à la largeur d’un doigt au-dessus du sol.'
        p2: '{staff} étale les lettres avec lui, passe du travail de Théo aux dépenses du ménage, et note ce qui peut se régler au bord d''une feuille. Van Gogh replie le feuillet dans son enveloppe. Avant de le ranger, il lisse le rabat avec sa paume.'
        p3: '{staff} expose les champs de blé peints les uns après les autres et lui dit que les gens viendront de loin dans une galerie pour regarder ce sol et ce ciel. Van Gogh déplace le tableau le plus à l’extérieur au milieu de la table. Alors que la pièce s’assombrit, une fine ligne jaune apparaît toujours.'
        p4: '{staff} reste à l''auberge pendant les jours les plus difficiles, veille au repos et aux soins quotidiens et attend que Van Gogh veuille ouvrir lui-même la fenêtre. La fille de l''auberge pose le plateau près de la porte. Van Gogh le prend et l''écarte pour laisser place à ses peintures.'
      outcomes:
        all: 'Après l''été, les champs prirent d''autres couleurs. Il y avait encore des draps qui séchaient près de la porte de l''auberge, avec une lettre écrite cachée dessous.'
        p4: 'En automne, les gens de l''auberge le voyaient encore sortir ses peintures. Lorsque la porte s''ouvrit, le bout d''un tube apparut dans sa poche.'
        p3: 'Plus tard, les gens se sont arrêtés devant ces champs dans une galerie. Un pas de plus et le jaune semblait presque à portée de main.'
        p2: 'La lettre concernant le ménage est restée sur la table de l''auberge. Rouvert, il montrait une petite ligne à côté du moindre pli.'
        p1: 'Le champ est resté dans le tableau. Retenue plus tard par une fenêtre, deux épaisseurs de peinture apparaissaient à l''horizon.'
      none: 'Des pas résonnèrent dans le couloir de l''auberge. Lorsque le plateau revint, l''eau dans la tasse était encore plate.'
      not_admitted: '{staff} n''a trouvé aucune place à l''auberge. Une petite partie du champ était visible au-delà du chemin, mais le coin du bâtiment cachait le chemin.'
      desync: 'Le chevalet gisait sur le côté parmi le blé. Lors du rappel du {staff}, une tige accrochée à l''une de ses pattes hochait encore au vent.'
      excerpts:
        p4: 'La fille de l''auberge pose le plateau près de la porte. Van Gogh le prend et l''écarte pour laisser place à ses peintures.'
        p3: 'Van Gogh déplace le tableau le plus à l’extérieur au milieu de la table. Alors que la pièce s’assombrit, une fine ligne jaune apparaît toujours.'
        p2: 'Van Gogh replie le feuillet dans son enveloppe. Avant de le ranger, il lisse le rabat avec sa paume.'
        p1: 'Le blé le plus éloigné s''incline en premier, tandis que les tiges voisines remuent encore. Lorsque Van Gogh abaisse le pinceau, le bas de la toile est toujours à la largeur d’un doigt au-dessus du sol.'
    relic: 'Un tube de jaune de chrome'
    relic_desc: 'Un tube en étain pressé de la couleur qu''il utilisait pour les champs.'
    points:
      p1: 'Sous un ciel d''orage, aidez-le à terminer le champ de blé et empêchez la toile de tomber dans le blé.'
      p2: 'Après la visite à Paris, aidez-le à régler les problèmes d''argent de Théo pour que la tempête ne lui pèse pas.'
      p3: 'Faites-lui savoir que ses peintures resteront dans les mémoires'
      p4: 'Avant le 27 juillet, soigner son corps et son esprit, et le maintenir en vie'
    points_fail:
      p1: 'La toile est tombée dans le blé au vent, et dans cette branche il n''y a pas de champ de blé sous les nuages d''orage.'
      p2: 'Il revenait de Paris sentant encore peser sur lui la tempête qui menaçait Théo. Dans cette branche, personne ne l''a aidé à clarifier la question de l''argent.'
      p3: 'Il avait toujours le sentiment que ses peintures étaient un fardeau pour Théo. Dans cette branche, personne ne lui a jamais dit où aboutiraient ces champs de blé.'
      p4: 'Le 27 juillet s’est produit comme dans l’histoire. Dans cette branche, il n''a pas peint une autre saison.'
    shift:
      p1:
        was: 'Début juillet 1890, Van Gogh peint de vastes champs de blé sous un ciel trouble et en parle à Theo et Jo vers le 10 juillet.'
      p2:
        was: 'Début juillet 1890, Van Gogh rendit visite à la famille de Théo à Paris et apprit que Théo envisageait de quitter son poste pour s''installer à son compte ; de retour à Auvers, il écrit que la tempête qui menace Théo lui pèse aussi.'
        now: 'A son retour de Paris, il savait comment allait se comporter la maison de Théo et il repartit aux champs avec un poids de moins.'
      p3:
        was: 'En juillet 1890, Van Gogh écrivait qu''il ressentait un échec et ne voyait pas d''avenir prometteur ; il a vendu peu de tableaux dans sa vie.'
        now: 'Quelqu’un lui a dit que ces champs de blé seraient un jour accrochés aux murs des musées et que de nombreuses personnes se déplaceraient pour les voir.'
      p4:
        was: 'Il fut blessé par balle le 27 juillet 1890 et mourut à Auvers deux jours plus tard, après avoir peint pendant seulement une décennie environ.'
        now: '{staff} resta avec lui jusqu''au mois de juillet, la maladie ne l''écrasa plus et l''été terminé, il était toujours à l''Auberge Ravoux. Il peignit encore quelques années, et après les champs de blé il y eut d''autres saisons.'
    vignettes:
      sky: '{staff} dessine deux fois le même champ dans un cahier, d''abord avec une bande de ciel puis avec beaucoup plus, et voit dans la seconde quelque chose que le premier avait caché.'
      wind: '{staff} attend la prochaine rafale sur le blé et regarde la tache sombre se déplacer dessus, sans effacer le premier regard.'
      path: '{staff} marche le long d''un chemin entre les champs jusqu''à ce que sa fin soit visible et, sur le chemin du retour, il puisse dire où il va.'
  sor_juana_mexico_city:
    name: 'Les derniers livres donnés'
    place: 'Mexico'
    figure: 'Sor Juana Inés de la Cruz'
    story: 'En 1690, l''évêque de Puebla publia, sans sa permission, la critique d''un sermon par Sor Juana sous le nom de Carta Atenagórica, avec une lettre signée Sor Filotea. Sa réponse est datée du 1er mars 1691. En 1693, elle vend ses livres et instruments, et en 1694 elle renouvelle ses vœux. Elle décède le 17 avril 1695 au couvent de San Jerónimo, après avoir soigné ses sœurs pendant une épidémie.'
    story_prose:
      opening:
        - 'Mexico, début 1695. Les livres et instruments de Juana avaient été vendus deux ans plus tôt. Elle avait écrit une longue lettre défendant sa quête d’apprentissage. Au moment où il est apparu dans une collection de ses œuvres, elle avait disparu.'
        - 'Dans l’histoire, une épidémie s’est propagée dans la ville. Juana a pris soin de ceux qui sont tombés malades et sont décédés eux-mêmes en avril. Dans cette succursale, près des étagères vides, il y a de la place pour une table, où les soignants peuvent laisser de l''eau et des linges secs.'
        - 'Ce voyage fait appel à quelqu''un qui peut gérer une chambre de malade grâce à un changement de mains. Il lui faut également des personnes qui savent soigner les malades et qui disposent des médicaments ou du matériel adéquats.'
      points:
        p1: 'Le prochain quart de travail était en retard. {staff} a placé l''eau, les chiffons propres et les bols vides dans des endroits séparés et a libéré une main pour s''occuper du lit suivant. Quelqu’un près de la porte retroussa de nouveau ses deux manches. La pile de tissus secs était plus basse, avec un pli carré encore visible en bas.'
        p2: 'La femme dans un lit ne pouvait pas se lever. {staff} est restée pendant qu''elle buvait et l''a soignée avec les remèdes et les soins disponibles. Après l''aube, elle tendit la main vers le bord du lit. Lorsque {staff} lui a tendu le bol, elle a libéré une main pour en poser la base.'
        p3: 'Juana est également tombée malade. {staff} l''a soignée avec les fournitures apportées et a attendu près du lit jusqu''à ce qu''elle puisse prendre une autre gorgée. Elle rendit le bol vide et toucha la page à côté de son oreiller. Ses doigts étaient mouillés et elle poussa le papier vers le coin sec du lit.'
      outcomes:
        all: 'Après avril, les deux femmes ont pu à nouveau se tenir à la table de la chambre du malade. L''un empilait les linges fraîchement séchés, l''autre retournait vers les étagères vides et ajoutait quelques lignes sur une page.'
        p3: 'Après avril, Juana pouvait à nouveau s''asseoir à sa table. Les étagères étaient encore vides, mais il y avait des pages fraîchement écrites au bord de la table.'
        p2: 'Après avril, la femme est revenue pour aider à la chambre du malade. Debout près du lit où elle s''était allongée, elle secoua un chiffon propre.'
        p1: 'De plus en plus de personnes tombèrent malades et le travail dans l''infirmerie se poursuivit. Au changement de montre, quelqu''un posa les bols propres à l''envers sur la table.'
      none: 'La cruche d''eau est restée intacte toute la nuit. À l''aube, il y avait une tache de lumière juste en dessous de son bec, visible à travers la porte.'
      not_admitted: '{staff} n’est jamais entré dans la pièce où étaient soignés les malades. À travers une fissure dans la porte, un pied de table et un pot d''eau vide étaient à peine visibles.'
      desync: 'Personne n''est venu prendre la relève au chevet. Lorsque l''agence a rappelé le {staff}, le bol d''eau tiède se trouvait toujours au coin de la table.'
      excerpts:
        p3: 'Elle rendit le bol vide et toucha la page à côté de son oreiller. Ses doigts étaient mouillés et elle poussa le papier vers le coin sec du lit.'
        p2: 'Après l''aube, elle tendit la main vers le bord du lit. Lorsque {staff} lui a tendu le bol, elle a libéré une main pour en poser la base.'
        p1: 'Quelqu’un près de la porte retroussa de nouveau ses deux manches. La pile de tissus secs était plus basse, avec un pli carré encore visible en bas.'
    relic: 'Une plume d''oie'
    relic_desc: 'Une plume avec une pointe fendue à côté d''une étagère vide.'
    points:
      p1: 'Dans les semaines où la maladie se propage, aidez-la à entretenir la salle de maladie et à assurer l''allaitement des sœurs.'
      p2: 'Sauver une sœur tombée malade à cause de l''épidémie'
      p3: 'Quand elle tombe elle-même malade, guéris-la'
    points_fail:
      p1: 'Dans la chambre des malades, les mains tombent malades les unes après les autres et les soins sont interrompus ; dans cette branche, son soin aux sœurs malades ne se poursuit pas comme dans l''histoire.'
      p2: 'Elle ne s''en sort pas et, comme dans l''histoire, elle fait partie des sœurs qui meurent au cours de ces mois ; dans cette succursale, un autre lit de la chambre des malades est vide.'
      p3: 'Comme dans l''histoire, elle décède le 17 avril. Dans cette branche, elle ne vit pas jusqu''en avril.'
    shift:
      p1:
        was: 'Au printemps 1695, une épidémie ravagea Mexico et Sor Juana prit soin des sœurs tombées malades.'
      p2:
        was: 'Lors de l''épidémie du printemps 1695, plusieurs sœurs de son couvent moururent.'
        now: 'La sœur a vécu jusqu’au mois d’avril et une fois guérie, elle est revenue pour aider à la chambre du malade.'
      p3:
        was: 'Le 17 avril 1695, Sor Juana mourut après avoir soigné ses sœurs malades.'
        now: '{staff} l''a guérie grâce aux médicaments apportés et elle a survécu jusqu''au mois d''avril. Dans les années qui suivirent, elle écrivit davantage au couvent ; ce qu''elle a écrit ne figure pas dans le récit de ce voyage.'
    vignettes:
      kitchen: '{staff} regarde un œuf mis dans du beurre chaud et se désagrège dans du sirop, et écrit sur un morceau quelle poêle a fait quoi, pour personne en particulier.'
      shelf: '{staff} époussette les étagères vides de la cellule et trouve les marques où se trouvaient les livres, des carrés plus sombres sur le bois, et les laisse tels quels.'
      bells: '{staff} compte les cloches des morts depuis la cour, un soir deux fois, et retourne à la bouilloire.'
  kepler_leonberg:
    name: 'Ce que le témoin a vu'
    place: 'Léonberg'
    figure: 'Johannes Kepler'
    story: 'En 1620, Katharina Kepler, la mère de l''astronome Johannes Kepler, fut confrontée à des accusations de la part de voisins de Leonberg qui remontaient à cinq ans. Le 7 août, elle a été arrêtée au domicile de sa fille à Heumaden. Elle fut transférée de Leonberg à Güglingen et gardée aux frais de sa famille. En septembre, Johannes revient de Linz pour prendre sa défense. Après des retards répétés, Katharina fut libérée à l''automne 1621, plus d''un an après son arrestation.'
    story_prose:
      opening:
        - 'Leonberg, 1620. Les accusations portées contre Katharina Kepler pesaient sur elle depuis cinq ans. Elle a été arrêtée à Heumaden en août et en septembre, son fils Johannes est revenu de Linz pour la défendre.'
        - 'Dans l''histoire, elle a passé plus d''un an en détention à Güglingen. Elle portait des chaînes tout l''hiver et sa famille devait payer les gardes. Dans cette succursale, la femme du geôlier transporte encore de la soupe dans l’allée. Quelqu''un peut lui prendre le pot pendant un moment et examiner les papiers avant de les renvoyer.'
        - 'Ce voyage a besoin de quelqu''un qui puisse garder les papiers en ordre et retracer la déclaration jusqu''à la personne qui l''a fait. Une fois l''hiver arrivé, il y a aussi du travail pour un soignant ou quelqu''un qui peut apporter une literie chaude.'
      points:
        p1: 'Après que Katharina ait été amenée à Leonberg, {staff} a suivi les habitudes d''un archiviste, demandant au gardien un deuxième exemplaire, comptant les pages avec lui et le voyant lui être remis. Le greffier déposa la copie sur la pile pour être classée. Alors que l''original était replié, {staff} a enfoncé un coin qui s''était relevé.'
        p2: '{staff} a diffusé le témoignage avec la famille et a retracé chaque affirmation jusqu''à ce qui a été vu, ce qui a été entendu ou ce que quelqu''un avait déduit plus tard. Trois colonnes ont donné un espace de respiration aux témoignages bondés. À quelque chose qu''aucun témoin n''avait vu, le stylo s''est arrêté juste avant la ligne tracée.'
        p3: 'Une fois le froid arrivé, {staff} s''est arrangé avec les gardes pour lui fournir une literie épaisse et un repas chaud à côté du lit où Katharina portait ses chaînes. Avant de prendre le bol, elle replia un coin de la couverture sur ses genoux. Un lien de fer reposait contre le lit alors qu''elle fermait lentement ses deux mains autour du bol chaud.'
      outcomes:
        all: 'Le témoignage et la défense pouvaient encore être lus côte à côte. Katharina prenait des repas chauds et une lourde couverture en prison. Lorsqu''elle a été libérée l''automne suivant, sa famille l''attendait dehors avec un manteau qu''elle pouvait envelopper jusqu''au menton.'
        p3: 'Le fer n’a perdu son mordant qu’à la fin de l’hiver. Elle s''en était sortie. Après avoir rangé le lit, elle rassembla soigneusement les deux coins de l''épaisse couverture.'
        p2: 'L''avocat a reçu la copie. Il marqua plusieurs lignes à côté de choses que les témoins n''avaient jamais vues eux-mêmes, tourna la page et la retourna.'
        p1: 'La défense écrite se trouvait encore dans le dossier des années plus tard. Là où un coin avait été plié, les manipulations répétées avaient laissé une ligne pâle.'
      none: 'Le mur se refroidit et une peau se forma sur la soupe. Une charrette passa devant la fenêtre, ses roues de fer frappant les interstices entre les pierres, chaque coup s''éloignant plus loin.'
      not_admitted: '{staff} ne pouvait pas entrer dans la pièce où étaient conservés les papiers. Quelqu’un à l’intérieur a déplacé un paquet et son cordon a raclé contre la table.'
      desync: 'Le dossier était clos sans la défense. Lors du rappel du {staff}, un carré sur la table indiquait encore l''endroit où se trouvaient les papiers.'
      excerpts:
        p3: 'Avant de prendre le bol, elle replia un coin de la couverture sur ses genoux. Un lien de fer reposait contre le lit alors qu''elle fermait lentement ses deux mains autour du bol chaud.'
        p2: 'Trois colonnes ont donné un espace de respiration aux témoignages bondés. À quelque chose qu''aucun témoin n''avait vu, le stylo s''est arrêté juste avant la ligne tracée.'
        p1: 'Le greffier déposa la copie sur la pile pour être classée. Alors que l''original était replié, {staff} a enfoncé un coin qui s''était relevé.'
    relic: 'Une copie du plaidoyer de la défense'
    relic_desc: 'Une copie au net d''une page d''un plaidoyer écrit, avec une date corrigée en marge.'
    points:
      p1: 'Une fois Katharina amenée à Leonberg, demandez au gardien des papiers de la défense de déposer une deuxième copie afin que sa réponse écrite parvienne à la procédure.'
      p2: 'Aidez la famille à trier les témoignages de première main, les ouï-dire et les déductions ultérieures dans des colonnes séparées'
      p3: 'Apportez une literie épaisse et de la nourriture chaude dans la cellule de Güglingen, afin que Katharina, soixante-treize ans et enchaînée, puisse passer cet hiver.'
    points_fail:
      p1: 'Le seul exemplaire que la famille puisse trouver n''est jamais livré. Le dossier ne comporte que les accusations, et le bureau rappelle le salarié.'
      p2: 'La copie rassemble les trois. Une fois arrivée au dossier, la défense doit encore se demander qui a dit quoi à l’origine.'
      p3: 'Dans cette branche, elle a passé l''hiver enchaînée comme le veut l''histoire, avec seulement les deux hommes qui la gardaient jour et nuit, et la famille payant la garde.'
    shift:
      p1:
        was: 'Katharina fut arrêtée en août 1620. Par l''intermédiaire d''avocats, Johannes Kepler insista pour qu''un compte rendu écrit de la procédure soit consigné.'
      p2:
        was: 'Les témoignages et les défenses écrites survivent. La défense a répondu aux allégations une par une et a contesté les déductions utilisées pour les relier.'
        now: 'L''avocat peut comparer les trois colonnes et indiquer les affirmations que les témoins n''ont pas pu vérifier par eux-mêmes.'
      p3:
        was: 'Le 7 août 1620, Katharina Kepler fut arrêtée et emmenée à Güglingen, où elle fut enchaînée pendant quatorze mois sous deux gardes, aux frais de sa famille. Elle fut libérée à l''automne 1621 et mourut environ six mois plus tard.'
        now: '{staff} a réglé les choses avec les gardes de la famille. Cet hiver-là, elle avait une literie épaisse et des plats chauds ; les chaînes sont restées en place, mais elle a mieux résisté que dans l''histoire.'
        who: 'katharina_kepler'
        bio: 'Dans cette chronologie, Katharina Kepler a eu une literie chaude et de la nourriture chaude pendant son premier hiver dans la cellule de Güglingen, et elle était plus forte lorsqu''elle a été libérée à l''automne 1621.'
    vignettes:
      soup: 'Le 13 septembre, {staff} transporte un pot de soupe à l''orge dans l''allée de Güglingen pour la femme du geôlier. Elle dit qu''elle peut reconnaître quel prisonnier est lequel grâce aux bols qui reviennent : la vieille femme renvoie le sien gratté et se plaint qu''il manque de sel.'
      hearing: 'Le 2 octobre, {staff} aide un clerc d''avocat à transporter deux liasses de papiers à la mairie de Güglingen pour l''audience. A la porte, on leur dit que c''est reporté. L''employé dépose les paquets sur la marche et dit qu''il les a portés si souvent qu''ils devraient déjà connaître le chemin.'
      frost: 'À la mi-novembre, {staff} voyage sur un chariot de charretier de Leonberg à Güglingen. Le charretier dit que la route est la plus mauvaise là où commence la vallée du Zaber ; dans le gel, les roues chantent, et il a appris à reconnaître la distance grâce à la note.'
  puccini_brussels:
    name: 'Le duo inachevé'
    place: 'Bruxelles'
    figure: 'Giacomo Puccini'
    story: 'Puccini se rendit à Bruxelles pour se faire soigner en novembre 1924, la fin de Turandot étant encore inachevée. La plume s''arrête au milieu d''une réflexion sur un croquis. Sur une autre, il y a une liste d''instruments. Franco Alfano a ensuite dû transformer ces fragments en quelque chose qu''un orchestre pouvait jouer.'
    story_prose:
      opening:
        - 'Bruxelles, novembre 1924. Puccini est venu se faire soigner. Turandot a atteint sa scène finale, mais la fin du duo se trouve encore dans des feuilles volantes. Certains contiennent plusieurs mesures, d''autres uniquement les noms d''instruments.'
        - 'Dans l''histoire, il est décédé à Bruxelles ce mois-là. Il incombait à Alfano de créer de la musique que l''orchestre pourrait jouer à partir des croquis qu''il laissait. Dans cette branche, un copiste place deux lignes similaires sur une table, où quelqu''un peut les lire avec le compositeur.'
        - 'Ce voyage a besoin de quelqu''un qui sache lire une partition et suivre deux suites possibles. Il faut aussi quelqu''un qui sache soigner un patient et qui puisse passer la nuit au chevet.'
      points:
        p1: '{staff} a suivi la ligne de basse dans les deux versions jusqu''au changement de tonalité, puis a mis les pages en ordre devant Puccini. Puccini a marqué l''une des lignes. Lorsque le crayon s''est levé, il y avait encore un espace vide au bout de la barre.'
        p2: 'La dernière nuit, {staff} s''est appuyé sur son expérience des soins aux patients pour régler l''oreiller de Puccini et est resté à sa portée. La partition était fermée près du lit, le dos dehors. Sa main se posa sur le dossier de la chaise placée à côté de lui.'
      outcomes:
        all: 'Plus tard, celui qui reprenait la partition pouvait commencer au trait de crayon. Dans la chambre ce soir-là, la partition était fermée et la chaise était toujours rangée à côté du lit.'
        p2: 'Cette nuit-là, il dormit profondément pendant un petit moment. La chaise resta suffisamment proche pour qu''il puisse la toucher.'
        p1: 'La main suivante qui travaillait sur la partition étalait les pages volantes. À la barre où l''on changeait de clé, une marque de crayon tombait à l''endroit où devait commencer la nouvelle écriture.'
      none: 'La chaise de chevet était vide. Les coins de deux feuilles se chevauchaient sur la table. Ce n’est que de près que l’on pouvait distinguer ce qui se trouvait au sommet.'
      not_admitted: '{staff} n’a jamais trouvé de place pour l’aider à la clinique. Une bande de lumière apparaissait sous une porte au fond du couloir.'
      excerpts:
        p2: 'La partition était fermée près du lit, le dos dehors. Sa main se posa sur le dossier de la chaise placée à côté de lui.'
        p1: 'Puccini a marqué l''une des lignes. Lorsque le crayon s''est levé, il y avait encore un espace vide au bout de la barre.'
    relic: 'Une esquisse du duo'
    relic_desc: 'Une feuille de papier à musique où un passage inachevé porte une note au crayon.'
    points:
      p1: 'Aidez Puccini à classer les deux croquis alternatifs du duo final par ordre de préférence pendant qu''il peut encore les peser'
      p2: 'Mettez votre expérience en soins à profit pour que Puccini puisse passer la dernière nuit sans le pire de son inconfort.'
    points_fail:
      p1: 'Les feuilles restent séparées. Celui qui prendra la relève devra encore choisir entre eux.'
      p2: 'À la fin de la nuit, la chaise à côté du lit est toujours vide et l’inconfort ne s’est pas atténué.'
    shift:
      p1:
        was: 'En novembre 1924, le duo final existait encore par fragments. Alfano a ensuite dû trouver un moyen de rejoindre ce qui avait survécu.'
        now: 'Puccini indique quelle alternative il souhaite lorsque la musique change à la fin du duo. Le compositeur qui prend la relève peut partir de ce choix.'
      p2:
        was: 'Le 24 novembre 1924, Puccini fut soigné pour un cancer de la gorge à Bruxelles. Il est décédé dans la même clinique le 29 novembre.'
        now: '{staff} est assis à côté de Puccini et l''aide à s''installer. La nuit qu''il redoutait passe avec moins de douleur et quelqu''un d''assez proche pour voir quand il a besoin d''aide.'
        who: 'puccini_brussels'
        bio: 'Puccini a passé une dernière nuit plus calme à Bruxelles. Il y avait quelqu''un à ses côtés lorsqu''il mettait la partition de côté.'
    vignettes:
      divider: 'Le copiste place côte à côte deux mesures au crayon sur le bureau. Ils se ressemblent presque jusqu''à ce que le {staff} trace la basse avec un doigt. On revient là où tout a commencé. L''autre laisse place à la suite. {staff} garde les deux sur le bureau pour que Puccini puisse les voir.'
      future: '{staff} se surprend à taper la fin qu''il connaît au théâtre. Le copiste lève les yeux d''un bar qui n''a pas encore de fin. {staff} tourne la page en arrière et demande de commencer à la dernière mesure qu''ils peuvent lire tous les deux.'
      pin: 'Le copiste débarrasse un coin du bureau pour une tasse. {staff} déplace une feuille de manuscrit un peu plus loin du bord. Au bas du feuillet, sous une portée presque vide, deux mots ont été insérés dans la marge.'
  schumann_endenich:
    name: 'La mélodie dans une autre tonalité'
    place: 'Endénich'
    figure: 'Robert Schumann'
    story: 'Une copie d’une courte pièce pour piano survit des années de Robert Schumann à Endenich. Il lui a donné un ton un peu plus bas que la partition publiée. En juillet 1856, Clara Schumann vient à Bonn et demande à le voir. À la maison d''hôtes, Lina a copié la mélodie deux fois. Elle pense que celui du bas est une erreur.'
    story_prose:
      opening:
        - 'Endenich, près de Bonn, juillet 1856. Robert Schumann séjourne ici en mauvaise santé. Il a un jour copié une des pièces de Papillons un ton plus bas. Ce mois-ci Clara Schumann vient demander à le voir.'
        - 'Dans l''histoire, Clara l''a vu le 27 juillet. Lorsqu''elle revint le 29, il était trop tard. Dans cette succursale, Lina à l''auberge a fait deux copies avec des premières notes différentes, et Emil connaît les deux portes de l''allée.'
        - 'Ce voyage a besoin de quelqu''un qui puisse reconnaître le même air dans deux partitions. Il a également besoin de quelqu''un qui connaisse le chemin, qui respecte un rendez-vous et qui puisse attendre un mot à proximité.'
      points:
        p1: '{staff} a lu les deux partitions et a noté la façon dont la note de départ descendait tandis que les intervalles restaient les mêmes. Lina a écrit une clé en haut de chaque page. Elle glissa les deux exemplaires côte à côte dans le dossier, laissant apparaître un étroit bord blanc.'
        p2: 'Le 27 juillet, {staff} a rencontré Clara comme convenu et a traversé l''allée jusqu''à la porte où elle était attendue. Lorsqu''il s''ouvrit, Clara rangea le billet plié dans sa main. Une lueur du soir brillait encore devant la porte.'
        p3: 'Le 29, {staff} a attendu des nouvelles à proximité, a rencontré Clara sur le chemin du retour et l''a emmenée directement au chevet. Elle s''assit et tendit la main sous le bord de la couverture. La main de Robert était toujours dans sa paume.'
      outcomes:
        all: 'Les deux exemplaires sont restés dans un dossier, chacun avec sa clé écrite en haut. Le 29, Clara arriva au chevet. La porte de l''allée était encore ouverte et, dans la pièce, deux mains étaient jointes.'
        p3: 'Le 29, Clara arriva au chevet. Lorsqu''elle se leva plus tard, la chaise était toujours appuyée contre le lit.'
        p2: 'La visite du 27 avait encore lieu au crépuscule. La lumière s''estompa dans l''allée avant que la porte ne se referme lentement.'
        p1: 'Les deux copies de pratique sont restées dans un seul dossier. En l''ouvrant à nouveau, il y avait une clé inscrite en haut de chaque feuille.'
      none: 'Le dossier s''est fermé avec la copie pratique inférieure laissée à l''extérieur. Une étroite bandelette apparaissait encore à son bord.'
      not_admitted: '{staff} n’a trouvé personne dans l’allée pour faire les présentations. Les deux portes étaient fermées de l’autre côté de la rue.'
      desync: 'Clara attendit à l''autre porte jusqu''à ce que l''heure des visites soit passée. Lors du rappel du {staff}, le billet plié se trouvait toujours dans la poche d''un manteau.'
      excerpts:
        p3: 'Elle s''assit et tendit la main sous le bord de la couverture. La main de Robert était toujours dans sa paume.'
        p2: 'Lorsqu''il s''ouvrit, Clara rangea le billet plié dans sa main. Une lueur du soir brillait encore devant la porte.'
        p1: 'Lina a écrit une clé en haut de chaque page. Elle glissa les deux exemplaires côte à côte dans le dossier, laissant apparaître un étroit bord blanc.'
    relic: 'Une partition d’exercice dans deux tonalités'
    relic_desc: 'Deux partitions d’exercice fictives, chacune dans une tonalité différente.'
    points:
      p1: 'Comparez les deux copies et notez pourquoi celle commençant un ton plus bas appartient également au dossier.'
      p2: 'Maintenez la visite de Clara le 27 juillet dans les délais prévus en la rencontrant avant l''heure convenue et en lui indiquant la bonne porte.'
      p3: 'Le 29 juillet, restez à portée de main et ramenez Clara au chevet avant la mort de Robert.'
    points_fail:
      p1: 'Lina met de côté la version inférieure. La prochaine personne ouvrant le dossier ne verra que la version contenue dans la clé publiée.'
      p2: 'Clara attend à la mauvaise porte et manque l''heure des visites. Le bureau vous rappelle lorsque cette visite sort du calendrier.'
      p3: 'Lorsque Clara revient à Endenich, Robert est déjà mort.'
    shift:
      p1:
        was: 'L’autographe de Schumann du Papillon n°10 des années Endenich transpose la pièce de do majeur en si bémol majeur.'
        now: 'Lina conserve les deux copies d''entraînement ensemble. En haut de chacune d''elles, elle écrit la clé, afin que le joueur suivant sache qu''aucune des deux premières notes n''est une erreur de copie.'
      p2:
        was: 'Le 23 juillet, Brahms et le Dr Richarz ont exhorté Clara à attendre. Elle a rendu visite à Robert le 27 juillet entre six et sept heures du soir.'
      p3:
        was: 'Le 29 juillet, Clara retourna à Endenich avec Brahms et Joseph Joachim après la mort de Robert.'
        now: '{staff} rencontre Clara sur le chemin du retour et l''amène directement dans la pièce. Elle prend la main de Robert avant qu''il ne meure.'
        who: 'schumann_endenich'
        bio: 'À Endenich, Clara était aux côtés de Robert lorsqu''il mourut le 29 juillet 1856.'
    vignettes:
      key: 'Lina commence à partir de la première note de chaque copie. Avant d''atteindre la fin de la deuxième mesure, elle lève les yeux vers {staff}. Elle sait ce qui va suivre, même si ses doigts sont ailleurs sur le clavier.'
      envelope: 'Emil a promis de remettre un message plié à Clara si elle devait attendre à nouveau. Il demande à {staff} quelle porte essayer en premier. Ils traversent le côté de la ruelle où il peut les voir tous les deux.'
      gift: 'Le véritable manuscrit reviendra finalement à Marie, la fille de Schumann. Ici, à la maison d''hôtes, Lina laisse deux bouts de papier pour marquer le début de ses copies d''entraînement. Lorsque le {staff} soulève le couvercle, un feuillet s''est glissé derrière l''autre.'
  nietzsche_turin:
    name: 'L’adresse au verso'
    place: 'Turin'
    figure: 'Friedrich Nietzsche'
    story: 'La lettre de Turin est adressée à Franz et Ida Overbeck. Nietzsche l''a signé Dionysos. Lorsque Franz arrive chez son ami, il le trouve en train de lire les épreuves corrigées de Nietzsche contre Wagner. Au moment où ils quitteront Turin, quelqu''un devra décider du sort des preuves.'
    story_prose:
      opening:
        - 'Turin, janvier 1889. Une lettre est adressée à Franz et Ida Overbeck, avec la signature et les destinataires à des endroits différents. Lorsque Franz arrive à Turin, Nietzsche lit les dernières épreuves de Nietzsche contre Wagner.'
        - 'Dans l''histoire, Overbeck a retrouvé son ami le 8 janvier et a ensuite écrit ce qu''il avait lu. Dans cette succursale, Pietro a laissé une étiquette de bagage près des escaliers et Lucia a encore un paquet de lettres à emballer.'
        - 'Ce voyage nécessite quelqu''un d''assez patient pour vérifier une adresse et guider un visiteur vers la bonne porte. Il lui faut aussi quelqu''un qui sache répertorier et conserver les preuves et les lettres privées.'
      points:
        p1: 'Le 8 janvier, {staff} a vérifié l''adresse par rapport au numéro de la porte, a attendu Overbeck dans les escaliers et l''a accompagné jusqu''au bout du trajet. Franz s''arrêta à la porte de droite et frappa une fois. Une page s''est tournée à l''intérieur et la poignée a lentement bougé d''un demi-tour.'
        p2: '{staff} répertoriait les épreuves et les lettres séparément, en mettant le titre du livre sur une étiquette et uniquement le destinataire sur l''autre. Chaque paquet avait son propre morceau de ficelle. Lucia tourna l’étiquette avec le nom du destinataire vers l’intérieur et appuya sur un coin avec son pouce.'
      outcomes:
        all: 'Le 8 janvier, Overbeck retrouve Nietzsche. Plus tard, les deux paquets ont voyagé ensemble. Il ouvrit celle qui portait le titre, tandis que l''autre rentrait avec son nœud toujours tourné vers le couvercle.'
        p2: 'Les papiers parvinrent à la paire de mains suivante en deux paquets. Une fois qu''Overbeck reconnut le titre, il remit l''autre paquet au fond de la valise.'
        p1: 'Le 8 janvier, Overbeck se rendit dans la chambre de son ami. Alors que la porte se refermait derrière lui, il y eut un léger bruissement provenant d''une page qui se tournait.'
      none: 'Les papiers étaient emballés en une seule pile, les noms apparaissant sur les lettres et les épreuves. L''emballage tirait sur le cordon et hésitait sur le côté où l''attacher.'
      not_admitted: '{staff} n''a trouvé personne au gîte pour faire les présentations. Une étiquette de bagage vierge était toujours posée sur la rampe.'
      desync: 'Personne n''a répondu à l''autre porte. Lorsque l''agence a rappelé le {staff}, Overbeck était toujours à l''atterrissage.'
      excerpts:
        p2: 'Chaque paquet avait son propre morceau de ficelle. Lucia tourna l’étiquette avec le nom du destinataire vers l’intérieur et appuya sur un coin avec son pouce.'
        p1: 'Franz s''arrêta à la porte de droite et frappa une fois. Une page s''est tournée à l''intérieur et la poignée a lentement bougé d''un demi-tour.'
    relic: 'Une étiquette de bagage en double'
    relic_desc: 'Une étiquette de bagage en double de la chronologie du jeu, avec un destinataire au dos.'
    points:
      p1: 'Vérifiez l''adresse de l''hébergement et conduisez Overbeck à la bonne porte le 8 janvier.'
      p2: 'Enregistrez les épreuves corrigées séparément des lettres personnelles afin que chaque liasse puisse être remise sans ouvrir l''autre.'
    points_fail:
      p1: 'Overbeck est dirigé vers le mauvais logement et le bureau rappelle l''employé lorsque la réunion sort du calendrier.'
      p2: 'Les lettres et les épreuves vont dans le même emballage. La première personne recherchant les corrections verra également les noms sur les lettres.'
    shift:
      p1:
        was: 'Nietzsche écrivit aux Overbeck de Turin. Franz Overbeck y arriva le 8 janvier 1889 pour le retrouver.'
      p2:
        was: 'Overbeck rappela plus tard que Nietzsche lisait les dernières épreuves de Nietzsche contre Wagner à son arrivée.'
        now: 'Les épreuves et les lettres voyagent dans des emballages séparés. Overbeck peut trouver les corrections d''un seul coup d''œil sans briser l''autre sceau.'
    vignettes:
      address: 'Pietro a copié Dionysos dans la ligne de destination de son inventaire. {staff} retourne le bordereau pour lui montrer les noms des destinataires. Il trace une ligne à travers ce qu''il a écrit, suffisamment légèrement pour pouvoir la relire.'
      privacy: 'Lucia demande à {staff} de tenir le sac pendant qu''elle emballe les papiers. Quelqu''un dans les escaliers demande à qui ils appartiennent. Elle tourne l''étiquette contre le mur avant de répondre.'
      stairs: 'Depuis le palier, {staff} entend le bruissement d''une page. Puis quelqu''un frappe en bas et Pietro pose l''étiquette de bagage vierge sur la rampe de l''escalier où il pourra la retrouver.'
  sophie_germain_paris:
    name: 'Un mémoire pour Berlin'
    place: 'Paris'
    figure: 'Sophie Germain'
    story: 'Sophie Germain échange des travaux sur la théorie des nombres avec Carl Friedrich Gauss, signant d''abord ses lettres Le Blanc. En 1816, l''Académie des Sciences lui décerne un prix pour ses travaux sur les plaques vibrantes. Elle a continué à travailler après être tombée malade en 1829. Le septième volume du journal de Crelle à Berlin portait sous son propre nom ses mémoires sur la courbure des surfaces. Elle décède à Paris le 27 juin 1831.'
    story_prose:
      opening:
        - 'Paris, 1831. Jeune femme, Sophie Germain discutait de la théorie des nombres avec Gauss sous le nom de Le Blanc. Elle a ensuite remporté un prix pour son travail sur les plaques vibrantes. Après être tombée malade, elle a continué à travailler sur un article sur la courbure des surfaces, qui a finalement paru dans le journal de Crelle à Berlin.'
        - 'Dans l''histoire, elle est décédée à Paris en juin. Certains biographes rapportent que Gauss l''a recommandée pour un diplôme honorifique à Göttingen. Elle n’a reçu aucun diplôme de ce type au cours de sa vie. Dans cette succursale, le porteur d''eau monte encore les escaliers de la rue de Savoie, et à l''étage il y a de la place sur le bureau pour une lettre.'
        - 'Ce voyage a besoin de quelqu''un qui puisse vérifier un manuscrit mathématique et le voir en route. Il existe également du travail pour quelqu’un qui peut soulager la douleur d’un patient ou apporter des nouvelles d’universitaires étrangers.'
      points:
        p1: '{staff} a vérifié la notation page par page, a mis les feuillets en ordre et a vu le papier entre les mains d''un coursier à destination de Berlin. Germain tenait le drap du dessus du bout du doigt. Alors que {staff} retirait sa main, le rebord de l''emballage arrivait juste au-dessus de la dernière lettre en haut de la page.'
        p2: '{staff} s''est appuyée sur son expérience de soins pour soulager la douleur et est restée jusqu''à ce qu''elle puisse se déplacer elle-même vers le bureau. Elle attrapa la page inachevée et la rapprocha. Au moment où la lumière atteignit le bureau, sa main cherchait le stylo.'
        p3: '{staff} lui apporta la recommandation de Gauss et la lui lut lentement, en suivant le libellé de la lettre. Germain prit la page et la lut depuis le début. Lorsqu''elle le déposa, ses deux plis retenaient encore un mince coin.'
      outcomes:
        all: 'Le journal de Berlin a ensuite imprimé son article. Au bureau de Paris, elle avait pu prendre son travail tandis que la douleur s''atténuait, et elle avait lu que Gauss avait proposé son nom. La lettre retenait un coin de la pile, s''enroulant sur le bord.'
        p3: 'Le diplôme arrivait encore trop tard. La nouvelle arriva à Paris la première, et la lettre se trouvait encore sur le bureau, légèrement soulevée le long des plis.'
        p2: 'Lorsque la douleur s''atténuait, il y avait des moments où elle pouvait à nouveau s''asseoir à son bureau. Plusieurs draps étaient ouverts au milieu du bureau, tels qu''elle les avait laissés.'
        p1: 'Le journal est paru dans le septième volume à Berlin. A sa tête se trouvait le nom imprimé de Sophie Germain.'
      none: 'La lampe à l’étage s’est éteinte tôt. Un seau heurtait toujours le mur de l''escalier et la chaise avait déjà été repoussée sous le bureau.'
      not_admitted: '{staff} n''est pas entré dans le local à l''étage de la rue de Savoie. Quelqu’un passa avec un seau dont le manche en bois tournait dans sa paume.'
      desync: 'Le manuscrit non scellé gisait sur le bureau. Lors du rappel du {staff}, l''emballage vide était toujours ouvert, rabat vers le haut.'
      excerpts:
        p3: 'Germain prit la page et la lut depuis le début. Lorsqu''elle le déposa, ses deux plis retenaient encore un mince coin.'
        p2: 'Elle attrapa la page inachevée et la rapprocha. Au moment où la lumière atteignit le bureau, sa main cherchait le stylo.'
        p1: 'Germain tenait le drap du dessus du bout du doigt. Alors que {staff} retirait sa main, le rebord de l''emballage arrivait juste au-dessus de la dernière lettre en haut de la page.'
    relic: 'Une lettre signée Le Blanc'
    relic_desc: 'Une lettre à Gauss sous un nom emprunté.'
    points:
      p1: 'Pendant qu''elle est malade, conservez ses mémoires sur la courbure des surfaces en route vers le journal de Crelle à Berlin'
      p2: 'Soulager la douleur du cancer lors de ses derniers mois à Paris'
      p3: 'Faites savoir à Germain avant sa mort que Gauss a demandé à Göttingen de lui donner un diplôme honorifique'
    points_fail:
      p1: 'Le mémoire reste inachevé sur son bureau et le volume de 1831 apparaît sans celui-ci. Cette branche est en décalage avec l''histoire et le bureau rappelle l''employé.'
      p2: 'Personne n''atténue la douleur et, dans cette branche, ses derniers mois sont aussi durs qu''avant.'
      p3: 'Aucun mot ne lui parvient et elle meurt sans savoir ce que Gauss a fait pour elle.'
    shift:
      p1:
        was: 'En 1831, les mémoires de Germain sur la courbure des surfaces parurent dans le volume 7 du journal de Crelle, l''année de sa mort.'
      p2:
        was: 'À partir de 1829 environ, Germain était atteint d''un cancer du sein ; elle continue à travailler et meurt à Paris le 27 juin 1831.'
        now: '{staff} réduit la douleur grâce à la médecine moderne et l''accompagne dans les pires heures. Elle souffre moins ces derniers mois et continue de travailler à son bureau.'
      p3:
        was: 'Gauss avait exhorté l''Université de Göttingen à décerner à Germain un diplôme honorifique ; à sa mort le 27 juin 1831, elle n''avait pas été conférée.'
        now: '{staff} lui apporte la parole sur ce que Gauss a fait. Germain apprend que l''université qu''elle n''a jamais pu fréquenter veut lui rendre hommage.'
        who: 'sophie_germain_paris'
        bio: 'Dans cette chronologie, Germain a appris avant sa mort que Gauss l''avait proposée pour un diplôme honorifique à Göttingen. Le diplôme lui-même arrivait encore trop tard.'
    vignettes:
      water: 'Le 7 mars, {staff} aide un porteur d''eau à transporter deux seaux d''eau de Seine jusqu''aux cinq étages d''une maison de la rue de Savoie. En comptant les pas entre chaque respiration, il dit que les maisons de Paris grandissent chaque année et qu''il est toujours payé au seau et non au sol.'
      quai: 'Mi-avril, {staff} feuillette un vieil almanach chez un libraire sur le quai. Le libraire dit que toute la pile vient d''un seul ménage, les marges pleines de sommes qu''il ne peut pas suivre, alors il les vend au poids.'
      wash: 'Fin mai, {staff} aide une blanchisseuse à essorer des draps sur un bateau de lavage au bord de la rivière. Elle dit que la Seine est montée et descendue tout le printemps, que le bateau monte et descend avec elle, et son dos aussi.'
  modigliani_paris:
    name: 'Une étiquette au dos du portrait'
    place: 'Paris'
    figure: 'Amedeo Modigliani'
    story: 'Fin mai 1919, Amedeo Modigliani et Jeanne Hébuterne revinrent de Nice à Paris avec leur fille née en novembre précédent. Sa tuberculose s''aggravait et à l''automne, il n''avait plus la force de peindre. Le 24 janvier 1920, il décède d''une méningite tuberculeuse à l''hôpital de la Charité à Paris, à l''âge de trente-cinq ans. Deux jours plus tard, Jeanne, enceinte de huit mois, décède au domicile de ses parents. Ses collègues peintres ont collecté l''argent pour ses funérailles le 27 janvier. Sa seule exposition personnelle de son vivant, deux ans plus tôt, avait été une déception commerciale.'
    story_prose:
      opening:
        - 'Paris, janvier 1920. Cela fait plus de six mois que Modigliani et Jeanne Hébuterne sont revenus de Nice avec leur fille. Sa maladie s''est aggravée. À l’automne, il avait du mal à tenir un pinceau.'
        - 'Dans l''histoire, Modigliani est décédé à l''hôpital de la Charité, et Jeanne est décédée deux jours plus tard. Dans cette branche, quelqu''un peut encore frapper au studio et prendre son tour à l''hôpital ou aux côtés de Jeanne.'
        - 'Ce voyage a besoin de quelqu''un que le peintre écoutera et de quelqu''un qui puisse s''occuper d''un patient avec les bonnes fournitures. Jeanne a aussi besoin d''une personne qui puisse s''asseoir avec elle et attendre.'
      points:
        p1: '{staff} déplace un portrait vers la lumière et lui dit que dans des années, les gens parcourront un long chemin pour voir les personnages de ses peintures. Un coin de l''étiquette se soulève à l''arrière. Modigliani tourne le portrait et laisse le slip reposer contre sa paume.'
        p2: '{staff} arrive au studio, stabilise le patient avec les soins qu''il connaît et suit les personnes qui l''emmènent à l''hôpital. Quelqu''un amène une chaise à la porte. Ce n''est que lorsque la salle prend le relais que {staff} s''éloigne du cadre qu''il détenait.'
        p3: 'A l''hôpital, {staff} le soigne avec le matériel qu''ils ont apporté et attend qu''il puisse poser lui-même sa tasse. La tasse frappe la table. Modigliani tend son autre main et la pousse un peu plus loin.'
        p4: '{staff} reste avec Jeanne et attend qu''elle puisse manger, laissant le bol là où elle peut l''atteindre. Jeanne tient le bol sur ses genoux. Lorsque le papier à la fenêtre se soulève dans le courant d''air, elle abaisse son coin sous le rebord.'
      outcomes:
        all: 'L''atelier rouvrit et Jeanne reprit son pinceau. Deux tabourets bas se trouvaient près de la table, avec une tache de peinture sur celui près de la fenêtre.'
        p3: 'Modigliani est retourné au studio une fois rétabli. Un visage inachevé gisait sur la table, un pinceau sur le bord de la page.'
        p4: 'Jeanne a encore peint. Après que ses deux enfants se soient endormis, elle a étendu une feuille de papier près de la lampe.'
        p1: 'Des années plus tard, quelqu’un s’est arrêté devant le portrait. L''étiquette était toujours coincée derrière le cadre.'
        p2: 'L''hôpital l''a accueilli. La personne qui l''accompagnait s''est assise sur la chaise à l''intérieur de la porte.'
      none: 'Il n’y avait personne devant la porte du studio. Après la tombée de la nuit, même la faible lumière en dessous avait disparu.'
      not_admitted: '{staff} n’est jamais arrivé au studio. Le sac de charbon était toujours contre le mur, au détour de l''escalier.'
      desync: 'Le transfert à l''hôpital a échoué. Lorsque l''agence a rappelé le {staff}, la moitié du palier était encore vide.'
      excerpts:
        p3: 'La tasse frappe la table. Modigliani tend son autre main et la pousse un peu plus loin.'
        p4: 'Jeanne tient le bol sur ses genoux. Lorsque le papier à la fenêtre se soulève dans le courant d''air, elle abaisse son coin sous le rebord.'
        p1: 'Un coin de l''étiquette se soulève à l''arrière. Modigliani tourne le portrait et laisse le slip reposer contre sa paume.'
        p2: 'Quelqu''un amène une chaise à la porte. Ce n''est que lorsque la salle prend le relais que {staff} s''éloigne du cadre qu''il détenait.'
    relic: 'Un bâtonnet de fusain'
    relic_desc: 'Un bout de fusain qui noircit les doigts.'
    points:
      p1: 'Tant qu''il est encore lucide, faites-lui savoir que les personnages qu''il a peints resteront dans la mémoire de beaucoup.'
      p2: 'Lorsqu''il est malade dans le studio et que personne n''a appelé depuis des jours, assurez-vous qu''il soit transporté à l''hôpital de la Charité.'
      p3: 'A la Charité, soigner sa méningite tuberculeuse'
      p4: 'Fin janvier, restez auprès de Jeanne Hébuterne, enceinte de huit mois, et aidez-la à traverser ces journées'
    points_fail:
      p1: 'Dans cette branche, personne ne lui dit ce que deviendront ses portraits après l''accueil décevant de son unique exposition personnelle.'
      p2: 'Dans cette agence, personne ne franchit la porte à temps et n''est pas conduit à la Charité. La succursale n''est plus en phase avec l''histoire et le bureau rappelle l''employé.'
      p3: 'Dans cette branche, la maladie évolue comme avant. Il décède à la Charité le 24 janvier, à l''âge de 35 ans.'
      p4: 'L''employé n''a pas réussi à rester avec Jeanne durant ces journées.'
    shift:
      p1:
        was: 'Le 3 décembre 1917, la police intervient lors de la seule exposition personnelle de Modigliani de son vivant. Le spectacle a mal tourné.'
        now: '{staff} lui dit, avant qu''il ne tombe malade, que les personnages qu''il a peints seront pendus dans les musées du monde entier.'
      p2:
        was: 'En janvier 1920, Modigliani, gravement malade, fut transporté à l''hôpital de la Charité à Paris.'
      p3:
        was: 'Le 24 janvier 1920, Modigliani meurt d''une méningite tuberculeuse à l''hôpital de la Charité à Paris, à l''âge de 35 ans.'
        now: '{staff} apporte un médicament qui le guérit. Il quitte l''hôpital et retourne au studio.'
        who: 'modigliani_paris'
        bio: 'Modigliani s''est rétabli au cours de l''hiver 1920 et a peint pendant de nombreuses années encore, peignant toujours les gens qui l''entouraient.'
      p4:
        was: 'Le 26 janvier 1920, deux jours après la mort de Modigliani, Jeanne Hébuterne, enceinte de huit mois, décède au domicile de ses parents, laissant une fille de quatorze mois.'
        now: '{staff} reste à ses côtés tout au long de ces journées. Dans cette chronologie, Jeanne donne naissance à l''enfant, élève son fils et sa fille, puis se remet à peindre.'
        who: 'jeanne_hebuterne'
        bio: 'Jeanne Hébuterne traverse l''hiver 1920, donne naissance à son deuxième enfant, élève ses deux enfants et se consacre à la peinture.'
    vignettes:
      coal: 'Le 10 janvier, {staff} monte un sac de charbon dans les escaliers pour le charbonnier de la rue, qui vend du bois, du charbon et du vin au même comptoir. Il dit que cet hiver, personne à Montparnasse n''achète un sac entier ; ils en achètent la moitié et paient l’autre moitié en promesses.'
      saucers: 'Début février, {staff} aide un serveur d''un café de Montparnasse à débarrasser les tables. Chaque boisson est livrée dans sa propre soucoupe et l''addition est comptée à partir de la pile. Il montre la table du fond : les peintres y construisent des tours de soucoupes, et paient en dessins quand l''argent vient à manquer.'
      mimosa: 'Début mars, {staff} aide une marchande de fleurs au marché à dénouer les premières grappes de mimosa. Elle dit qu''ils sont venus du sud par le train de nuit et que, par un mois de mars froid, ils sont les seuls jaunes de Paris.'
  wallace_ternate:
    name: 'Un essai venu de Ternate'
    place: 'Ternate'
    figure: 'Alfred Russel Wallace'
    story: 'En février 1858, après une crise de fièvre aux Moluques, Alfred Russel Wallace écrivit un essai sur la façon dont les variétés s''écartent de leur type d''origine. Il porte la date et le lieu de février 1858, Ternate. Le 25 mars, Wallace quitta Ternate avec un groupe comprenant le jeune chasseur Jumaat. Ils atteignirent Dorey sur la côte de Nouvelle-Guinée. L''essai est allé à Charles Darwin en Angleterre ; le 1er juillet, il fut lu parallèlement à l’œuvre de Darwin à Londres, sans qu’aucun des deux auteurs ne soit présent dans la salle.'
    story_prose:
      opening:
        - 'Les Moluques, février 1858. Après une fièvre, Wallace écrit un essai sur la façon dont les variétés s''écartent de leurs formes originales. Il le date à Ternate.'
        - 'Dans l''histoire, l''essai a atteint l''Angleterre. Wallace a navigué vers Dorey, où il s''est blessé à la cheville. Jumaat, qui voyageait avec lui, y est décédé en juin. Dans cette branche, quelqu''un peut surveiller pendant que Wallace écrit et faire la traversée vers Dorey.'
        - 'Ce voyage a besoin de quelqu''un qui puisse rester près d''un lit de malade et donner à son occupant le temps de se reposer. Il a également besoin de quelqu''un qui connaît le soin des plaies ou qui apporte les fournitures appropriées.'
      points:
        p1: 'Lorsque la fièvre diminue, {staff} reste à proximité et met le papier et l''eau à la portée de Wallace. Il écrit le nom du lieu et fait une pause. {staff} attrape le coin d''une tôle soulevée près de la fenêtre.'
        p2: 'Dans Dorey, {staff} soigne la cheville de Wallace, attend qu''il puisse supporter son poids et fait quelques pas plus loin avec lui. La boue est encore mouillée devant la porte. Wallace y entre et la deuxième empreinte est aussi profonde que la première.'
        p3: 'Jumaat ne peut pas sortir du lit. {staff} reste avec lui et utilise le matériel apporté, jusqu''à ce qu''il puisse déplacer lui-même le bol. Au début, Jumaat tient le bol à deux mains, puis en lâche une. L''eau coule le long de son poignet et coule à côté du lit.'
      outcomes:
        all: 'Le journal parvint finalement en Angleterre. Lorsque le bateau a quitté Dorey, Jumaat a écarté ses jambes et Wallace a fait de la place sur le banc.'
        p3: 'Il y avait de la place pour un de plus sur le bateau fin juillet. Jumaat s''assit avec le bol à ses pieds.'
        p2: 'Wallace est retourné dans la forêt pendant que le bateau à vapeur était à Dorey. Un peu plus loin, il se pencha pour essuyer la boue de sa chaussure.'
        p1: 'L''essai a ensuite été lu à Londres. A l''ouverture du manuscrit, la dernière ligne disait encore Ternate.'
      none: 'Il y avait une table près de la fenêtre. À mesure que l’humidité entrait, le coin extérieur d’un drap commençait à s’enrouler.'
      not_admitted: '{staff} n''a pas eu de place à la fête. Une corde s''est détendue sur le quai et a tracé une ligne sur l''eau.'
      desync: 'Le journal près du lit était inachevé. Lors du rappel du {staff}, une tache d''humidité marquait encore l''intérieur du cadre.'
      excerpts:
        p3: 'Au début, Jumaat tient le bol à deux mains, puis en lâche une. L''eau coule le long de son poignet et coule à côté du lit.'
        p2: 'La boue est encore mouillée devant la porte. Wallace y entre et la deuxième empreinte est aussi profonde que la première.'
        p1: 'Il écrit le nom du lieu et fait une pause. {staff} attrape le coin d''une tôle soulevée près de la fenêtre.'
    relic: 'Un scarabée dans une boîte à épingles'
    relic_desc: 'Un coléoptère collecté dans une petite boîte en fer blanc.'
    points:
      p1: 'Au temps du paludisme, poursuivez l''essai jusqu''au bout'
      p2: 'Guérissez la cheville qu''il s''est blessée à Dorey avant qu''elle ne se transforme en ulcère'
      p3: 'Sauvez le jeune chasseur Jumaat de la fièvre et de la dysenterie'
    points_fail:
      p1: 'La fièvre ne s''est jamais calmée et la conscription n''a pas été terminée en février. Les lettres prises par le bateau-poste ne le retenaient pas, et dans cette branche, la Société Linnéenne ne disposait pas d''un tel papier au 1er juillet.'
      p2: 'La blessure s''est suppurée, comme le raconte l''histoire, et il est resté assis dans la cabane avec une béquille pendant plus d''un mois. Dans cette branche, les insectes de la forêt de Dorey n''étaient encore capturés que par ses serviteurs.'
      p3: 'Jumaat est mort le 26 juin, comme le raconte l''histoire, et dans cette branche, le bateau qui avait quitté Dorey en juillet est parti sans lui.'
    shift:
      p1:
        was: 'En février 1858, dès que le paludisme s''est atténué, Wallace a rédigé le document et l''a signé Ternate.'
      p2:
        was: 'En mai 1858, Wallace se blessa à la cheville à Dorey ; la blessure s''est transformée en ulcère et l''a empêché de rester debout pendant plus d''un mois.'
        now: 'La blessure ne s''est pas aggravée et, pendant les jours où le paquebot était au port, il se rendait dans la forêt tous les jours comme avant.'
      p3:
        was: 'Le 26 juin 1858, Jumaat, un jeune d''environ dix-huit ans, mourut à Dorey ; Wallace a écrit de lui comme d''un garçon calme qui faisait bien son travail.'
        now: '{staff} est resté avec lui jusqu''à ce que la fièvre tombe et que la maladie cesse, et quand ils ont quitté Dorey fin juillet, il était également sur le bateau.'
    vignettes:
      places: '{staff} copie les étiquettes des oiseaux du jour et écrit l''île à côté de chacun, afin que le tiroir à peaux puisse être lu sans son collecteur.'
      claim: '{staff} trie un plateau de coléoptères provenant de deux îles qui se ressemblent et les conserve sur deux rangées espacées, sans qu''on le leur demande.'
      mail: '{staff} plie les pages d''une longue lettre dans du papier huilé et la noue avec un double nœud, comme le fait un marin avec une carte.'
  hooke_london:
    name: 'Le responsable des expériences'
    place: 'Londres'
    figure: 'Robert Hooke'
    story: 'Un lecteur sort l’ancienne Micrographia de Hooke et tente de copier le bouchon. Les bords du dessin se transforment rapidement en un nid d’abeilles soigné que Hooke n’a jamais vu. Dans la même salle se trouvent des paquets de conférences et de démonstrations. Quelqu''un qui ouvre dans un an devra distinguer une page manquante d''une page vierge.'
    story_prose:
      opening:
        - 'Londres, 1703. Les cellules du liège de Hooke''s Micrographia ressemblent à un nid d''abeilles, bien que leurs bords soient inégaux. Un lecteur qui trace la gravure ne cesse de vouloir combler les lacunes.'
        - 'Dans l''histoire, Waller a publié certaines conférences, tandis que d''autres journaux attendaient des éditeurs ultérieurs. Dans cette succursale, quelqu''un trace une assiette dans la pièce humide pendant que quelqu''un d''autre vient déplacer les paquets.'
        - 'Ce voyage a besoin de quelqu''un qui puisse rassembler les conférences et cataloguer les autres lots. Il y a aussi du travail pour quelqu''un qui peut lire une figure et aider un lecteur à voir une coupure dans une ligne.'
      points:
        p1: 'Lorsque les papiers doivent être déplacés, {staff} vérifie les cours dans l''ordre et remet les feuilles gondolé dans leur liasse. Le paquet a bougé, mais son ancienne couverture repose toujours dessus. En serrant le cordon, le {staff} le maintient à l''écart d''un coin saillant.'
        p2: '{staff} répertorie les titres des liasses restantes et les vérifie à nouveau par rapport aux papiers. Le catalogue va là où il sera vu dès l''ouverture du coffre. La dernière ligne est encore humide, donc le {staff} laisse le couvercle entrouvert à la largeur d’un doigt.'
        p3: '{staff} place le tracé à côté de la gravure et demande à Hooke où la ligne doit être interrompue. Le doigt de Hooke s’arrête entre les deux personnages. Là où les deux lignes ne se rencontrent jamais, le papier non marqué apparaît toujours.'
      outcomes:
        all: 'Deux ans plus tard, les conférences étaient imprimées, et même les journaux laissés de côté avaient des titres à rechercher. Plus tard, quelqu''un ouvrant le coffre souleva en premier la fine liste.'
        p2: 'La prochaine personne à la recherche d’un disque inédit pourrait nommer le paquet. Lorsque le couvercle s''est levé, le catalogue était en haut.'
        p3: 'Un lecteur est revenu sur le traçage. Un doigt fit le tour d’une cellule et s’arrêta à l’espace.'
        p1: 'Waller a finalement reçu les conférences. Sous le drap de couverture, ils gisaient dans leur ancien ordre.'
      none: 'Le couvercle s''abaissa et il n''y eut que le bruit du papier contre le bois. Un tracé inachevé gisait encore près de la fenêtre.'
      not_admitted: '{staff} n''est pas entré dans la salle où se déroulaient les cours. Une petite lumière à travers la porte montrait le coin d''un coffre.'
      desync: 'Les conférences se sont effondrées lorsqu''elles ont été déplacées. Lorsque le {staff} a été rappelé, le cordon était toujours à plat sur la table.'
      excerpts:
        p2: 'Le catalogue va là où il sera vu dès l''ouverture du coffre. La dernière ligne est encore humide, donc le {staff} laisse le couvercle entrouvert à la largeur d’un doigt.'
        p3: 'Le doigt de Hooke s’arrête entre les deux personnages. Là où les deux lignes ne se rencontrent jamais, le papier non marqué apparaît toujours.'
        p1: 'Le paquet a bougé, mais son ancienne couverture repose toujours dessus. En serrant le cordon, le {staff} le maintient à l''écart d''un coin saillant.'
    relic: 'Un dessin d''une puce'
    relic_desc: 'Une copie de la gravure dépliante d''une puce de Micrographia.'
    points:
      p1: 'Gardez les conférences ensemble au fur et à mesure que les liasses sont déplacées, afin que Waller puisse toujours les rassembler pour son édition.'
      p2: 'Déposez une liste des lots en dehors des cours, avec suffisamment de détails pour qu''un éditeur ultérieur puisse les retrouver'
      p3: 'Montrez à Hooke le tracé du lecteur pendant qu''il est encore là pour le regarder et demandez-lui quelles lignes doivent être laissées ouvertes.'
    points_fail:
      p1: 'Un paquet de conférences est emporté avec des papiers volants. Waller ne peut plus rassembler la collection et le bureau rappelle l''employé.'
      p2: 'Le prochain éditeur peut dire ce qui a été imprimé. Rien sur cette liste ne renvoie à des journaux ailleurs.'
      p3: 'Le tracé reste dans le livre. Le lecteur a déjà rempli les lignes et n’aura pas à demander à quelle place elles appartiennent.'
    shift:
      p1:
        was: 'Hooke mourut en 1703. Richard Waller prépara le recueil d''ouvrages posthumes publié en 1705.'
      p2:
        was: 'Le livre de Waller a conservé certains documents. Des parties du journal de Hooke et d’autres travaux sont apparus plus tard par d’autres éditeurs.'
        now: 'Une deuxième liste va dans le coffre. Quelqu''un qui recherche des démonstrations qui n''ont pas été imprimées peut commencer par demander un paquet portant un nom.'
      p3:
        was: 'Dans Micrographia, Hooke comparait les pores du liège à un nid d''abeilles et soulignait que leur forme était irrégulière.'
        now: '{staff} définit le traçage à côté de l''ancienne plaque. Le lecteur laisse deux lignes ouvertes après que Hooke ait indiqué l''endroit où le motif copié cesse de correspondre à la plaque.'
    vignettes:
      edge: 'Le lecteur suit deux lignes autour d''un pore, puis les joint à une troisième absente de la planche. {staff} contient le traçage vers la fenêtre. La ligne inventée est la plus droite de la feuille.'
      analogy: '{staff} demande au lecteur de trouver une cellule qui ne correspondrait pas au peigne qu''il a dessiné en haut de la page. Bientôt, ils pointent tous deux vers le même bord courbe.'
      plate: 'Lorsque le lecteur ouvre un autre pli, une puce occupe presque tout le bureau. Le {staff} maintient un coin vers le bas pendant que le lecteur déplace l''encre.'
  leavitt_cambridge_ma:
    name: 'Une règle pour les étoiles'
    place: 'Cambridge, Massachusetts'
    figure: 'Henrietta Leavitt'
    story: 'La circulaire de Harvard de 1912 répertorie vingt-cinq étoiles variables du Petit Nuage de Magellan par ordre de période. Leavitt a tracé séparément leurs lectures les plus brillantes et les plus faibles. Dans les deux tracés, les étoiles qui mettaient plus de temps à répéter leurs cycles étaient plus brillantes.'
    story_prose:
      opening:
        - 'Cambridge, Massachusetts, 1912. Leavitt a classé vingt-cinq variables du Petit Nuage de Magellan par période et a tracé leurs lectures à leur niveau le plus brillant et le plus faible. Sur les deux graphiques, plus la période est longue, plus l’étoile est brillante.'
        - 'Dans l’histoire, le tableau est apparu dans une circulaire de l’Observatoire de Harvard. Des chercheurs ultérieurs ont utilisé les Céphéides de la Voie Lactée pour le premier étalonnage. Dans cette branche, quelqu''un peut continuer à vérifier les plaques et envoyer une liste d''étoiles candidates avec une demande de temps d''observation.'
        - 'Ce voyage a besoin de quelqu''un qui puisse faire correspondre une étoile faible au verre et quelqu''un qui puisse plaider pour les prochaines observations.'
      points:
        p1: 'Avant l''impression, {staff} vérifie les faibles observations par rapport aux plaques de verre. Une fois l''étoile manquante apparue, Leavitt la remet à sa place dans le tableau. La règle quitte la dernière ligne. À travers le verre, le petit point est toujours là.'
        p2: '{staff} explique le problème d''étalonnage restant dans l''application de temps d''observation et joint une liste d''étoiles candidates. Lorsque les mesures arrivent, Leavitt rassemble les deux feuilles. Son crayon traverse la couture et s''arrête sur la même étoile.'
      outcomes:
        all: 'Le tableau a été imprimé et d’autres observations ont finalement atteint le bureau. Leavitt ouvrit l''enveloppe et posa les nouvelles lectures à côté des anciennes intrigues.'
        p2: 'Leavitt a ensuite vérifié les mesures avec ses collaborateurs. Les deux séries de lectures se trouvaient côte à côte avec des marques de crayon sous la même étoile.'
        p1: 'La circulaire imprimée était ouverte sur la table. Les points des deux parcelles suivaient toujours la même ligne inclinée.'
      none: 'Les assiettes sont retournées dans leur boîte. Celui du haut glissa jusqu''au bord, laissant un coin dans la lumière.'
      not_admitted: '{staff} n’est pas entré dans la pièce où les plaques étaient vérifiées. Alors qu''une boîte passait à l''intérieur de la porte, la vitre brillait dans un coin.'
      desync: 'L''écart était toujours là lorsque la table a été introduite. Lorsque le {staff} a été rappelé, la règle maintenait toujours la rangée sans correspondance.'
      excerpts:
        p2: 'Lorsque les mesures arrivent, Leavitt rassemble les deux feuilles. Son crayon traverse la couture et s''arrête sur la même étoile.'
        p1: 'La règle quitte la dernière ligne. À travers le verre, le petit point est toujours là.'
    relic: 'Une plaque photographique en verre'
    relic_desc: 'Une plaque photographique remplie de petites étoiles.'
    points:
      p1: 'Faites correspondre les mesures des étoiles faibles à leurs plaques avant d''imprimer et protégez le tableau de vingt-cinq périodes de Leavitt'
      p2: 'Utilisez l''étalonnage non résolu de la circulaire pour gagner du temps d''observation afin que Leavitt puisse participer à l''étape suivante'
    points_fail:
      p1: 'Les lignes dont les références de planche ne peuvent être vérifiées sont coupées et le tableau des vingt-cinq périodes n''apparaît pas. Le bureau rappelle l''employé après une perte de synchronisation.'
      p2: 'La relation période-luminosité survit, et son calibrage absolu est repris ailleurs.'
    shift:
      p1:
        was: 'Le 3 mars 1912, la circulaire 173 de l''Observatoire de Harvard publia les périodes de Leavitt pour vingt-cinq variables dans le Petit Nuage de Magellan.'
      p2:
        was: 'En 1913, le premier étalonnage utilisait les Céphéides de la Voie Lactée.'
        now: '{staff} soumet une demande de temps d’observation avec la liste des candidats en pièce jointe. Leavitt a le temps de vérifier les nouvelles mesures avec l''équipe à son arrivée.'
        who: 'leavitt_cambridge_ma'
        bio: 'Leavitt a continué à travailler sur la luminosité stellaire et a participé à l''application de sa relation aux distances. Elle a laissé ses propres notes d''observation sur l''étalonnage.'
    vignettes:
      rank: 'Un numéro d’étoile vide interrompt la séquence. {staff} lit le point à haute voix pendant que le copiste recherche le journal des plaques. Les points restent là où ils sont jusqu''à ce que le numéro soit trouvé.'
      distance: '{staff} tient les deux parcelles côte à côte. Le copiste a modifié l''échelle sur une feuille. Ils recopient l''axe avant de comparer les points.'
      period: 'Le copiste crie une luminosité et passe à la rangée suivante. {staff} place une règle sous l''ancienne ligne jusqu''à ce que sa période soit également copiée.'
    remarks:
      trait_methodical: '{staff} vérifie à nouveau le numéro avant de remettre la plaque dans sa pochette.'
  su_shi_huangzhou:
    name: 'L’exil sur le versant oriental'
    place: 'Huangzhou'
    figure: 'Su Shi'
    story: 'Après le procès poétique de Crow Terrace de 1079, Su Shi fut exilé à Huangzhou, où il exploita une parcelle sur un versant oriental et prit son nom, Dongpo. Au septième mois de 1082, il se rendit sur la rivière en contrebas de la Falaise Rouge avec des invités et écrivit l''Ancienne Ode sur la Falaise Rouge ; au cours du dixième mois, il revint du Snow Hall en direction de Lingao et écrivit la Dernière Ode. Il quitta Huangzhou en 1084.'
    story_prose:
      opening:
        - 'Huangzhou, sous le règne de Yuanfeng. Exilé après l''affaire Crow Terrace, Su Shi s''implante à l''est de la ville et prend le nom de Dongpo, Eastern Slope. Au cours de la cinquième année de Yuanfeng, il a écrit deux fois sur Red Cliff. Dans le récit de l''automne, il décrivait l''escalade de la falaise.'
        - 'Dans l’histoire, sa maison vivait de ses économies. Ayant entendu parler de nourrissons noyés autour de Yue et E, il a écrit pour demander que cela cesse et a plaidé pour aider les familles pauvres à élever leurs enfants. Dans cette branche, il y a du travail sur la pente, au ferry et aux portes de ces familles.'
        - 'Ce voyage a besoin de quelqu''un qui connaît le terrain et de quelqu''un qui puisse parcourir un sentier escarpé la nuit. Il lui faut également quelqu’un qui puisse s’occuper des nouveau-nés et parler patiemment de porte à porte.'
      points:
        p1: '{staff} remonte la pente avec les ouvriers et utilise leurs connaissances en agriculture pour canaliser l''eau entre les lits. Lors de la récolte, il y a des sacs supplémentaires à transporter. Le dernier sac vient se poser contre le mur, effleurant un trait dans la vieille poussière. Au-dessus, une chaîne de pièces de monnaie est toujours suspendue à la poutre.'
        p2: 'La nuit de pleine lune du dixième mois, le {staff} aide à trouver une position ferme dans les endroits escarpés et reste sur le chemin du retour au bateau. Au fur et à mesure que le chiffre descend, {staff} oriente la lampe vers l''eau. Une vague frappe les planches et la flamme frémit.'
        p3: '{staff} va de maison en maison avec le groupe, s''occupe des nouveau-nés et parle avec les personnes qui s''en occuperont. Un foyer ne ferme sa porte qu''à la tombée de la nuit. Dans la bande de lumière, un petit paquet de tissu s''agite.'
      outcomes:
        all: 'Il y avait du grain sur le versant Est cette année-là, des vêtements mouillés revenaient de Red Cliff et plusieurs familles gardaient leurs enfants. La nuit, quelqu''un à l''intérieur étendait une petite couverture.'
        p3: 'Cet hiver-là, plusieurs familles purent élever leurs bébés à la maison. Le visiteur sortit et entendit quelqu''un rapprocher la lampe à l''intérieur.'
        p1: 'Après la récolte, la chaîne de pièces durait encore plusieurs mois. Les sacs neufs étaient appuyés contre le mur, avec encore de la terre sur un coin de la toile.'
        p2: 'Après la deuxième visite, le bluff a trouvé sa place dans la rhapsodie. Sur la page ouverte, l’encre est la plus foncée là où le pinceau s’est arrêté.'
      none: 'Le ferry se tut, son cordage enroulé toujours à la proue. Aux pieds de quelqu’un, la lampe donnait un dernier point lumineux.'
      not_admitted: '{staff} n''a trouvé aucune place à Huangzhou. La bobine de corde du ferry s’estompait dans la brume.'
      desync: 'Les choses ont mal tourné sur ce tronçon en dessous de Red Cliff. Juste avant le rappel, la lampe dans les mains du {staff} n’éclairait que l’eau sous le plat-bord.'
      excerpts:
        p3: 'Un foyer ne ferme sa porte qu''à la tombée de la nuit. Dans la bande de lumière, un petit paquet de tissu s''agite.'
        p1: 'Le dernier sac vient se poser contre le mur, effleurant un trait dans la vieille poussière. Au-dessus, une chaîne de pièces de monnaie est toujours suspendue à la poutre.'
        p2: 'Au fur et à mesure que le chiffre descend, {staff} oriente la lampe vers l''eau. Une vague frappe les planches et la flamme frémit.'
    relic: 'Un manteau de paille'
    relic_desc: 'Un manteau de pluie grossier, comme en portaient les paysans sur le versant.'
    points:
      p1: 'Aidez sa famille à récolter une récolte sur les terres incultes du versant est et à traverser les jours où les économies s''épuisent.'
      p2: 'La nuit de la pleine lune du dixième mois, garde-le en sécurité sur la falaise au-dessus de la rivière, afin qu''il redescende vers le bateau.'
      p3: 'Sauver les nouveau-nés des villages qui allaient se noyer dans une bassine d''eau'
    points_fail:
      p1: 'Dans cette branche, il n''y avait pas de paire de mains supplémentaire sur le versant oriental lors des récoltes d''automne, et les chaînes de pièces de monnaie sur la poutre diminuaient de moins en moins.'
      p2: 'Cette nuit-là, il a perdu pied sur la falaise, et dans cette branche il n''y a pas de retour au bateau.'
      p3: 'Dans cette branche, les bassins des villages sont restés tels quels et {staff} n''a pas déplacé une seule famille pour garder cet enfant.'
    shift:
      p1:
        was: 'En 1081, Su Shi inaugura les travaux sur la pente à l''est de la ville et maintint la maison à cent cinquante espèces par jour.'
        now: 'Le versant oriental a donné quelques chargements supplémentaires de céréales cet automne-là, et des chaînes de pièces de monnaie restaient encore sur la poutre à la fin de l''année.'
      p2:
        was: 'À la pleine lune du dixième mois de 1082, Su Shi gravit seul la rive brisée de la Falaise Rouge et revint au bateau, et écrivit plus tard la Deuxième Ode sur la Falaise Rouge.'
      p3:
        was: 'Il a entendu parler de noyades d''enfants autour de Yue et E, a écrit au préfet d''Ezhou pour lui demander de l''interdire par la loi, et à Huangzhou a proposé une société pour élever des enfants, demandant de l''argent aux riches pour aider les familles pauvres à garder leurs nouveau-nés.'
        now: '{staff} a fait du porte-à-porte avec la société et cet hiver-là, quelques familles supplémentaires ont gardé les enfants qui venaient de leur naître.'
    vignettes:
      slope: '{staff} transporte l''eau sur la pente pour les employés. Au crépuscule, un voisin, rattrapé pour le jeu, dépose un bol de haricots cuits au bord du champ et dit que le nouveau venu pourra prendre le deuxième bol demain.'
      lamp: '{staff} se trouve sur une pierre au bord de la route avec une lampe protégée contre le vent. Des pas descendent de la pente longtemps après le troisième quart ; {staff} tourne la lampe vers le chemin et ne dit rien.'
      ferry: '{staff} aide un batelier, maquillé pour le jeu, à enrouler la corde au débarcadère. Il dit que l''eau sous la falaise est lente par une nuit calme et que les invités demandent toujours l''autre côté.'
  tang_xianzu_linchuan:
    name: 'Une pièce où l’amour survit à la mort'
    place: 'Linchuan'
    figure: 'Tang Xianzu'
    story: 'Tang Xianzu a daté sa préface du Pavillon des pivoines de l''automne 1598. Dans la dixième scène, Du Liniang visite le jardin au printemps, puis s''endort et rencontre un jeune homme en rêve.'
    story_prose:
      opening:
        - 'Linchuan, automne 1598. Tang Xianzu date sa préface du Pavillon des Pivoines. Dans la pièce, Du Liniang se promène dans un jardin et s''endort en rêvant d''un jeune érudit.'
        - 'Au cours de l’histoire, les paroles ont ensuite été modifiées pour les rendre plus faciles à chanter. Tang a écrit aux joueurs de Yihuang pour leur demander d''utiliser son texte. Dans cette branche, il y a une partition altérée lors des répétitions et une réplique qui manque toujours aux acteurs.'
        - 'Ce voyage fait appel à quelqu''un qui peut repérer les mots manquants et entendre quand un signal a disparu. Il faut également quelqu’un qui sache comment le texte sur la page rencontre les voix sur scène.'
      points:
        p1: '{staff} compare la feuille de répétition avec le texte Tang vérifié, suit le chant jusqu''aux mots manquants et copie la version complète pour la troupe Yihuang. Quelqu''un devant ouvre la copie sur la même page et suit la ligne à l''oreille. Au signal, l’acteur qui attend dans les coulisses lève un pied.'
      outcomes:
        all: 'Ils continuèrent à répéter la scène à partir du texte vérifié. L''acteur qui attendait dans les coulisses tenait un drap dont le coin plié tombait à côté de la queue.'
        p1: 'Ils continuèrent à répéter la scène à partir du texte vérifié. L''acteur qui attendait dans les coulisses tenait un drap dont le coin plié tombait à côté de la queue.'
      none: 'La page des répétitions se tourne. A côté de la scène, quelqu''un tient encore la feuille où il manque quelques mots, là où la prochaine voix est censée entrer.'
      not_admitted: '{staff} n’a pas participé à la répétition. Une voix vint de l''intérieur du mur, et à l''extérieur, tout ce qu''on montrait était une chaise qui avait été déplacée.'
      excerpts:
        p1: 'Quelqu''un devant ouvre la copie sur la même page et suit la ligne à l''oreille. Au signal, l’acteur qui attend dans les coulisses lève un pied.'
    relic: 'Un recueil de chansons imprimé'
    relic_desc: 'Airs imprimés pour chanteurs, avec la mélodie nommée au-dessus de chacun.'
    points:
      p1: 'Aidez-le à rédiger une copie au net du Pavillon des Pivoines dans ses propres mots corrigés et à la remettre entre les mains de la société Yihuang, afin qu''ils répètent son texte.'
    points_fail:
      p1: 'Comme dans l''histoire, les versions modifiées se sont répandues plus tard, et tout ce qu''il peut faire, c''est écrire aux joueurs de Yihuang pour ne pas les chanter ; cette branche est comme l’était l’histoire.'
    shift:
      p1:
        was: 'Après 1598, Tang Xianzu écrivit pour demander aux musiciens de Yihuang de s''en tenir à ses paroles originales au lieu d''utiliser une version modifiée pour le chant.'
        now: 'La compagnie Yihuang possédait une copie qu''il avait lui-même corrigée avant qu''une version modifiée n''apparaisse et a continué à chanter à partir de celle-ci.'
        who: 'tang_xianzu_linchuan'
        bio: 'Dans cette chronologie, le texte du Pavillon des Pivoines que Tang Xianzu avait lui-même corrigé parvint en premier à la compagnie Yihuang, et ils continuèrent à chanter.'
    vignettes:
      empty_garden: '{staff} place la chaise contre le mur. La joueuse traverse le sol nu et baisse les yeux pendant qu''elle chante. Depuis le banc, le copiste peut dire où finit le chemin.'
      cue: 'Le chanteur s''arrête là où une file a été raccourcie. Son partenaire manque l''entrée. {staff} remet les mots omis sur la fiche de répétition et leur demande de réessayer le transfert.'
      breath: 'Le chanteur laisse un petit air à la fin du couplet. {staff} marque cette pause sur un feuillet séparé pour le joueur qui attend dans les coulisses.'
  xu_xiake_lijiang:
    name: 'Le sentier qu’il n’a pas eu le temps de gravir'
    place: 'Lijiang'
    figure: 'Xu Xiake'
    story: 'Au cours du deuxième mois lunaire de 1639, Xu Xiake séjourna à Jietuo Lin à Lijiang, rassemblant des livres pour Mu Zeng, qui lui envoya de la nourriture et plus tard des cadeaux en remerciement. Xu a entendu dire que la Terrasse Gongshou et la Falaise du Lion se trouvaient au-dessus du monastère. Il a écrit que la pression du travail ne lui laissait pas le temps de gravir l''un ou l''autre.'
    story_prose:
      opening:
        - 'Lijiang, deuxième mois lunaire de 1639. Xu Xiake vérifie les livres de Mu Zeng à Jietuolin. Il entend que Gongshou Terrace et Lion Cliff se trouvent plus haut derrière et écrit leurs noms dans son journal.'
        - 'Dans l’histoire, les livres l’ont tenu trop occupé pour visiter l’un ou l’autre endroit. Mu Zeng a ensuite envoyé des cadeaux en remerciement et lui a demandé à nouveau de réviser le dossier de la montagne Jizu. Dans cette branche, la liste de retour et le papier de la marche se trouvent ensemble.'
        - 'Ce voyage a besoin de quelqu''un qui puisse vérifier les volumes et les voir livrés en toute sécurité. Il faut également quelqu''un qui puisse suivre le rythme d''un guide et d''une escorte et se rappeler où le chemin revient.'
      points:
        p1: '{staff} vérifie les volumes par rapport à la liste de retour et demande au messager ceux qui ont déjà été remis. Le messager dépose le reçu dessus. Les pages en dessous sont parfaitement rangées dans la boîte, avec un onglet étroit toujours visible à l''extérieur.'
        p2: 'Lorsque les livres sont remis, {staff} demande à un guide local de montrer le chemin et monte jusqu''à la terrasse Gongshou avec Xu et l''escorte. La montagne d’en face apparaît petit à petit. Quand Xu peut tout voir, il fait une marque au bord de sa page.'
        p3: '{staff} parcourt la fourche sous la Falaise du Lion avec Xu dans les deux directions et lui montre où le chemin fait demi-tour. Le croquis est ensuite placé à l''intérieur du seuil de Jietuolin. Plié jusqu''à la dernière section, le pli est toujours entier sur la page.'
      outcomes:
        all: 'Après le retour des livres, la promenade a également trouvé sa place dans le journal. Lorsque l''esquisse laissée à Jietuolin fut ouverte, deux chemins tournèrent à côté de deux plis distincts.'
        p3: 'Un croquis est resté à Jietuolin. Quelqu’un montra le virage sous Lion Cliff et le plia à nouveau.'
        p2: 'Le récit de Lijiang occupait désormais la place que Xu lui-même avait occupée. Il revint à la page et posa un doigt sur la ligne où la montagne était apparue pour la première fois.'
        p1: 'Mu Zeng a ensuite envoyé ses remerciements et renouvelé sa demande. Lorsque la réponse fut rangée, les onglets des volumes étaient toujours alignés.'
      none: 'La boîte s''est fermée. Un drap de rechange enroulé près du seuil, son extrémité libre effleurant le sol.'
      not_admitted: '{staff} n''a pas trouvé de place parmi les gens qui vérifiaient les livres. À l’intérieur de la porte, quelqu’un a déplacé une boîte et le couvercle a frappé.'
      desync: 'Les volumes n''ont pas été contrôlés avant la livraison. Lorsque le {staff} a été rappelé, une liste près de la poitrine n''était encore qu''à moitié marquée.'
      excerpts:
        p3: 'Le croquis est ensuite placé à l''intérieur du seuil de Jietuolin. Plié jusqu''à la dernière section, le pli est toujours entier sur la page.'
        p2: 'La montagne d’en face apparaît petit à petit. Quand Xu peut tout voir, il fait une marque au bord de sa page.'
        p1: 'Le messager dépose le reçu dessus. Les pages en dessous sont parfaitement rangées dans la boîte, avec un onglet étroit toujours visible à l''extérieur.'
    relic: 'Un croquis d''itinéraire de Jietuo Lin'
    relic_desc: 'Un croquis plié avec une ligne le long de la pente et une marge vide à côté de la fourche.'
    points:
      p1: 'Vérifiez le retour des volumes corrigés auprès du messager, afin que Mu Zeng puisse accuser réception du travail et renouveler sa demande pour l''annuaire géographique du Mont Ji.'
      p2: 'Libérez une demi-journée, trouvez un guide local et une escorte, et marchez de Jietuo Lin à la terrasse Gongshou avec Xu'
      p3: 'Traversez la fourche sous la Falaise du Lion avec Xu et laissez une copie des nouvelles notes d''itinéraire au monastère.'
    points_fail:
      p1: 'Les volumes retournés manquent de reçus. Le messager ne peut pas confirmer que le travail antérieur a été effectué, le transfert est manqué et le bureau rappelle l''employé.'
      p2: 'La copie de la journée occupe l''après-midi. La terrasse Gongshou reste dans le journal comme un endroit dont Xu a entendu parler.'
      p3: 'Xu quitte Lijiang sans itinéraire depuis ses propres pas pour s''asseoir à côté des instructions qu''il a entendues.'
    shift:
      p1:
        was: 'Le neuvième jour du deuxième mois lunaire de 1639, Mu Zeng envoya des cadeaux en remerciement pour la collecte et demanda à nouveau à Xu de compiler l''annuaire géographique du mont Ji.'
      p2:
        was: 'Le sixième jour du deuxième mois lunaire de 1639, Xu écrivit qu''il avait été trop occupé à rassembler pour grimper à la terrasse Gongshou ou à la falaise du Lion.'
        now: 'Une fois le colis livré, {staff} ramène Xu à Jietuo Lin pour rencontrer le guide et l''escorte. Xu grimpe sur la terrasse et note où la pente opposée apparaît.'
      p3:
        was: 'En 1639, le journal de Lijiang mentionnait la Falaise du Lion comme étant quelque part que Xu entendait se trouver plus haut et n''avait pas le temps de grimper.'
        now: '{staff} parcourt la fourche avec Xu dans les deux sens. Xu marque le virage où les chemins doublent et laisse une copie du croquis à Jietuo Lin.'
        who: 'xu_xiake_lijiang'
        bio: 'Le journal de Lijiang de Xu contient une entrée supplémentaire de première main entre la collation et son départ. Une deuxième copie de son croquis reste chez Jietuo Lin.'
    vignettes:
      view: 'Le guide décrit un détour par la montagne à laquelle il fait face. {staff} lui demande combien de tours il y a avant. La vue et le chemin pour y arriver suivent des lignes différentes.'
      trail: 'L''escorte emprunte le chemin escarpé jusqu''aux marches et arrive avec les menottes mouillées. {staff} accroche un chiffon sec près de la porte et déplace les pages presque terminées plus loin à l''intérieur.'
      slope: 'Sur les marches du monastère, {staff} sort une nouvelle feuille. La dépêche pour Mu Zeng retourne dans sa boîte. La feuille vierge est pour l''itinéraire.'
    remarks:
      trait_methodical: '{staff} ajoute une flèche au croquis afin que le prochain voyageur sache quelle direction monte.'
  savitribai_phule_pune:
    name: 'Un sari de rechange dans le sac'
    place: 'Puné'
    figure: 'Savitribai Phule'
    story: 'En 1848, Savitribai et Jyotirao Phule commencèrent à enseigner aux filles à Pune. Les récits de son travail décrivent les abus qu''elle a rencontrés sur la route et le sari de rechange qu''elle prenait pour se changer à l''école. Les archives des écoles ultérieures la mentionnent comme directrice. En 1897, elle mourut de la peste alors qu''elle soignait des malades.'
    story_prose:
      opening:
        - 'Pune, 1848. Savitribai Phule et Jyotirao Phule créent une école pour filles. Dans les récits de Savitribai, il y a un sari qu''elle portait dans son sac pour se changer lorsqu''elle arrivait à l''école.'
        - 'Au cours de l’histoire, elle a été victime d’abus alors qu’elle allait enseigner, et certains ménages se sont opposés à l’envoi des filles à l’école. Dans cette branche, quelqu''un peut marcher dans la rue avec elle et s''asseoir avec une famille pour entendre pourquoi elle a appelé une fille chez elle.'
        - 'Ce voyage a besoin de quelqu''un qui puisse tenir bon dans cette rue et de quelqu''un qui sait enseigner et parler avec une famille. Quand la foule se rassemble, il faut que quelqu’un puisse la calmer.'
      points:
        p1: 'Quelqu’un entre dans la rue. {staff} garde un œil sur les portes et marche avec Savitribai jusqu''à Bhide Wada, où ils poussent la porte. La première fille pose déjà son ardoise sur un bureau. La fenêtre s''éclaircit, avec des traces d''humidité provenant de l''essuyage encore visibles en bas.'
        p2: '{staff} s''assoit avec la famille de la jeune fille, les écoute et leur montre une ligne qu''elle a écrite en classe. La jeune fille remet ensuite son ardoise à l''ancienne place. Sa main bouge lentement, mais la première ligne atteint le bord.'
        p3: '{staff} se tient au coin et parle aux personnes qui bloquent le passage, attend que les lancers s''arrêtent et passe avec elle. A l''école, Savitribai pose son sac sur le bureau. Le sari de rechange est toujours plié à l''intérieur, son coin rentré comme avant.'
      outcomes:
        all: 'Les cours continuèrent avec la jeune fille revenue parmi les élèves. Savitribai a ouvert son sac pour enseigner des choses. En dessous, le tissu gisait toujours dans son pli soigné.'
        p3: 'A partir de ce jour, le sari de rechange est resté au fond du sac. Lorsqu''elle entra dans la pièce, elle avait la main libre pour ouvrir la fenêtre.'
        p2: 'La fille est revenue en classe et une autre ligne est apparue sur son ardoise. À la fin du cours, elle remit l’ardoise sur le côté à son ancien emplacement.'
        p1: 'La leçon a eu lieu ce matin-là. La porte était ouverte et les premières ardoises appuyaient contre un pied de bureau.'
      none: 'Il manquait une ardoise dans la pièce, mais la craie était posée sur le bureau. Des pas retentirent au coin et s''éteignirent bientôt.'
      not_admitted: '{staff} n''a pas trouvé sa place à l''école. Une demi-porte cachait le bureau, et seul le coin d''une ardoise était visible.'
      desync: 'Le chemin vers l''école s''est interrompu au coin de la rue. Lorsque le {staff} a été rappelé, l''ardoise sous la fenêtre était encore vierge.'
      excerpts:
        p3: 'A l''école, Savitribai pose son sac sur le bureau. Le sari de rechange est toujours plié à l''intérieur, son coin rentré comme avant.'
        p2: 'La jeune fille remet ensuite son ardoise à l''ancienne place. Sa main bouge lentement, mais la première ligne atteint le bord.'
        p1: 'La première fille pose déjà son ardoise sur un bureau. La fenêtre s''éclaircit, avec des traces d''humidité provenant de l''essuyage encore visibles en bas.'
    relic: 'Une ardoise'
    relic_desc: 'Une petite ardoise avec une première rangée de lettres à la craie.'
    points:
      p1: 'Le matin le plus dur du premier mois, gardez la route vers Bhide Wada dégagée pour que les leçons de la journée commencent'
      p2: 'Ramenez une fille dont la famille l''a appelée chez elle, pour qu''elle s''assoie à nouveau sur son ardoise'
      p3: 'Arrêtez les gens sur cette route qui lui lancent des objets, pour qu''elle n''ait plus besoin d''un sari de rechange dans son sac'
    points_fail:
      p1: 'Ce jour-là, elle n''est pas arrivée à l''école et la porte de Bhide Wada est restée fermée.'
      p2: 'Dans cette branche, il y avait une fille de moins sur les listes de Bhide Wada.'
      p3: 'Elle portait toujours un sari de rechange dans son sac chaque jour, comme dans l''histoire.'
    shift:
      p1:
        was: 'À partir de janvier 1848, l''école de filles de Bhide Wada maintint ses cours et Savitribai s''y promenait chaque jour pour enseigner.'
      p2:
        was: 'En 1848, de nombreuses familles de Pune s''opposaient à la scolarisation des filles.'
        now: 'La jeune fille revint à ses cours.'
      p3:
        was: 'À partir de 1848, elle fut bombardée de pierres et de crottes sur le chemin de l''école et portait un sari de rechange pour se changer à son arrivée.'
        now: 'Depuis un matin de printemps, plus personne sur la route ne lui a jeté quoi que ce soit et le sari de rechange est resté plié dans le sac.'
    vignettes:
      slate: '{staff} tourne l''ardoise sur le côté pour que deux filles puissent l''atteindre en même temps. Lorsqu’ils sont rappelés chez eux, chacun a laissé une marque que l’autre peut indiquer.'
      road: '{staff} marche un demi-pas derrière sur la route de Budhwar Peth et garde le sac sur le côté, loin des portes. Personne dans la rue ne dit rien ce matin-là.'
      chalk: '{staff} casse le dernier bâton de craie en deux pour qu''il y en ait un pour le tableau et un pour les ardoises, et note ce qui est nécessaire du marché.'
  hargrave_stanwell_park:
    name: 'Le quatrième cerf-volant'
    place: 'Parc Stanwell, Australie'
    figure: 'Lawrence Hargrave'
    story: 'Lawrence Hargrave a commencé ses expériences avec les cerfs-volants en boîte en 1893. Le 12 novembre 1894, sur la plage de Stanwell Park, quatre de ses cerfs-volants en boîte reliés l''ont soulevé du sable, à environ 16 pieds de haut. Une photographie conservée par la Bibliothèque d''État de Nouvelle-Galles du Sud montre Hargrave, James Swaine et l''équipement du procès. Il mourut à Sydney le 6 juillet 1915.'
    story_prose:
      opening:
        - 'Stanwell Park, novembre 1894. Lawrence Hargrave essaie les cerfs-volants en boîte depuis plus d''un an. Le 12, quatre se trouvent sur la plage, prêts à voler sur une seule ligne.'
        - 'Dans l’histoire, les quatre cerfs-volants l’ont soulevé de près de seize pieds. La plupart des modèles qu''il envoya ensuite à Munich furent détruits en temps de guerre. Dans cette branche, les assistants sur la plage disposent d''étiquettes pour les cadres et d''espace pour étaler un dessin.'
        - 'Ce voyage a besoin de quelqu''un capable de lire le vent et de stabiliser une longue ligne, ainsi que de quelqu''un capable de vérifier les mesures et de dessiner la manière dont les quatre cadres s''assemblent.'
      points:
        p1: 'Une rafale écarte le cerf-volant extérieur. {staff} surveille la ligne et se déplace avec les assistants jusqu''à ce que les cerfs-volants se redressent à nouveau, puis aide à stabiliser la corde lorsque le siège descend. Les pattes touchent le sable et laissent deux empreintes rapprochées. Les gens sur la plage tiennent bon jusqu''à ce que le premier cerf-volant descende plus bas.'
        p2: '{staff} vérifie les mesures et les étiquettes par rapport aux cadres et en fait une copie à conserver localement, montrant comment les quatre sont fabriqués et assemblés. Le vent tourne les dessins jusqu''à la dernière feuille. Hargrave pose un morceau de corde dessus pour maintenir le coin par le nœud.'
      outcomes:
        all: 'La hauteur est entrée dans le dossier et une série de dessins est restée en Australie. Quelqu''un a ouvert la pile des années plus tard et pouvait encore suivre la ligne entre les quatre cerfs-volants.'
        p2: 'Des années plus tard, Stanwell Park en avait encore un exemplaire à consulter. La dernière feuille montrait encore où la ligne était liée.'
        p1: 'La hauteur est entrée dans le record. A côté de l''entrée, la photographie montrait encore quatre cerfs-volants alignés sur la plage.'
      none: 'Le vent soufflait toujours de la mer. Une boucle après l’autre s’est détachée de la bobine au niveau des dunes.'
      not_admitted: '{staff} n''a pas trouvé sa place auprès des aides sur la plage. Quelqu''un tirait une ligne tendue au loin, mais sa voix ne parvenait pas jusqu''aux dunes.'
      desync: 'Le siège est tombé et la corde s''est détendue. Lors du rappel du {staff}, une étiquette claquait toujours contre un cadre.'
      excerpts:
        p2: 'Le vent tourne les dessins jusqu''à la dernière feuille. Hargrave pose un morceau de corde dessus pour maintenir le coin par le nœud.'
        p1: 'Les pattes touchent le sable et laissent deux empreintes rapprochées. Les gens sur la plage tiennent bon jusqu''à ce que le premier cerf-volant descende plus bas.'
    relic: 'Une étiquette de rechange pour cerf-volant'
    relic_desc: 'Une étiquette de rechange pour l’armature d’un cerf-volant cellulaire.'
    points:
      p1: 'Le 12 novembre, maintenir la corde des cerfs-volants stable dans les rafales, pour qu''il monte et redescende en toute sécurité sur le sable'
      p2: 'Aidez-le à terminer les dessins complets des quatre cerfs-volants, leurs tailles et comment ils sont fabriqués, et laissez-en un exemplaire en Australie.'
    points_fail:
      p1: 'Une rafale a entraîné la corde de cerfs-volants sur le côté et le siège a heurté le sable, et dans cette branche il n''y avait pas de portance de 16 pieds.'
      p2: 'Les quatre cerfs-volants sont restés uniquement entre ses mains, comme le veut l''histoire, et dans cette branche, il n''y a pas eu de deuxième record à Stanwell Park.'
    shift:
      p1:
        was: 'Le 12 novembre 1894, sur la plage de Stanwell Park, quatre cerfs-volants dans un train soulevèrent Hargrave du sable à près de 16 pieds.'
      p2:
        was: 'En 1894, la fabrication des quatre cerfs-volants était entre les seules mains de Hargrave ; Tard dans sa vie, il envoya ses modèles à Munich, et la plupart furent détruits pendant la Seconde Guerre mondiale.'
        now: 'Un ensemble de dessins des quatre cerfs-volants est resté à Stanwell Park et n''est pas parti à Munich avec les autres modèles.'
        who: 'hargrave_stanwell_park'
        bio: 'Les tailles et les dessins des quatre cerfs-volants en boîte de Hargrave de 1894 sont restés dans une copie à Stanwell Park. La plupart de ses modèles ont ensuite été détruits pendant la Seconde Guerre mondiale, mais la manière dont ces quatre modèles ont été fabriqués peut encore être lue en Australie.'
    vignettes:
      four: '{staff} compte à nouveau les cerfs-volants disposés sur le sable après le décollage et écrit les quatre sur la page, avec un support autour d''eux, afin que le lecteur suivant sache qu''ils ont volé ensemble.'
      tag: '{staff} suit le sable mouillé pour trouver une étiquette arrachée d''un cadre et la rattache avec un nouveau nœud.'
      lift: '{staff} se tient avec les assistants sur la dune pendant que le vent est essayé avec un seul cerf-volant et apprend dans quelle direction courir avec la ligne.'
