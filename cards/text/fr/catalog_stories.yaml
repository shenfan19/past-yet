    relic: 'Une mire d’arpentage'
    relic_desc: 'Un bâton fin pour mesurer les pas, marqué d''une échelle.'
    points:
      p1: 'Lorsque l''argent vient à manquer, gardez la fête sur son chemin afin que la ligne soit posée à temps jusqu''à Nishibetsu.'
      p2: 'Aidez-le à mesurer une partie de la côte avec une corde plutôt qu''en pas, afin que ses chiffres soient exacts en premier.'
      p3: 'Aidez-le à tracer la ligne au-delà de Nishibetsu, afin que cette enquête embrasse une partie de la côte qu''elle n''a jamais atteinte.'
    points_fail:
