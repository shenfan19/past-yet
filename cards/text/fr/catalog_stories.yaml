        now: 'Quelqu''un lui a dit que ces pièces tranquilles seraient un jour recherchées et retracées, image par image.'
      p4:
        was: 'En décembre 1675, écrivit plus tard Catharina, sous le poids des dettes et des enfants, il passa en un jour et demi de la bonne santé à la mort ; il a été enterré à Delft le 15 décembre, à l''âge de 43 ans.'
        now: '{staff} est resté avec lui tout au long de ce mois de décembre, et le jour et demi n''est jamais arrivé. Il retourna dans son atelier de Delft et peignit encore quelques années, et Catharina et les onze enfants ne le perdirent pas cet hiver-là.'
        who: 'vermeer_delft'
        bio: 'C''est dans cette lignée que Vermeer vécut jusqu''en décembre 1675, peignit encore quelques années à Delft et sortit sa maison de ses dettes.'
    vignettes:
      bread: 'Le 5 décembre, {staff} aide le garçon boulanger à transporter les pains du matin le long de la Oude Langendijk. A une porte, le garçon dépose le pain sans être payé et fait une marque sur son petit livre. Il dit que son maître se plaint de cette page tous les samedis, et que tous les lundis envoie quand même le pain.'
      frames: 'En janvier, {staff} passe une matinée dans l''atelier d''un fabricant de cadres, à tenir des coins à onglet pendant que la colle durcit. La moitié des cadres contre le mur sont vides. L''encadreur dit que depuis l''arrivée des Français, soixante-douze personnes achètent des cadres pour des miroirs, pas pour des tableaux, et qu''un miroir, au moins, ne demande jamais à être payé deux fois.'
      peat: 'À la mi-février, {staff} aide un vendeur de tourbe à empiler du gazon humide sur la place du marché. Elle souffle dans ses doigts et dit que c''est l''hiver où tout le monde à Delft brûle des trucs bon marché, donc toute la ville sent le chien mouillé près du feu.'
  rembrandt_amsterdam:
    name: 'Après la mort de son fils'
    place: 'Amsterdam'
    figure: 'Rembrandt van Rijn'
    story: 'Le fils de Rembrandt, Titus, fut enterré à Amsterdam le 7 septembre 1668, six mois après son mariage. En mars 1669, la fille de Titus, Titia, naquit. Cette année-là, Rembrandt peint des autoportraits datés de 1669. Il mourut le 4 octobre 1669 et fut enterré quatre jours plus tard dans une tombe louée ; son dernier tableau est resté inachevé. La veuve de Titus a été enterrée le 21 octobre.'
    story_prose:
      opening:
        - 'Amsterdam, septembre 1669. Le peintre Rembrandt van Rijn, soixante-trois ans, a peint La Ronde de nuit, a fait faillite en 1656 et vit ici ses dernières années endetté. Il y a un an, son fils Titus, le seul de ses enfants à avoir grandi, a été enterré, six mois après son mariage ; en mars, la fille de Titus, Titia, est née. Cette année, il a peint plusieurs autoportraits qui portent la date, et son dernier tableau est toujours sur le chevalet.'
        - 'Dans l''histoire, il est décédé le 4 octobre et quatre jours plus tard a été enterré dans une tombe louée ; la peinture sur le chevalet est restée inachevée et se trouve maintenant au Musée national de Stockholm. Deux semaines après lui, la veuve de Titus fut également enterrée. Dans cette branche, il y a un coloriste au bord du canal, un marinier qui fouille la tourbe au fil de l''eau et un veilleur de nuit qui agite son hochet dans les rues.'
        - 'Un type de personne peut aider dans ce voyage : quelqu''un qui a tenu un pinceau et a une main ferme, ou quelqu''un avec un œil de peintre et une main encore plus ferme, pour broyer ses couleurs et stabiliser la toile.'
      outcomes:
        all: 'Le 4 octobre, Rembrandt décède à l''âge de soixante-trois ans. Le tableau était toujours sur le chevalet, les mains du vieil homme quelques traits plus loin qu''auparavant, et la palette était de côté, ses couleurs séchées.'
        p1: 'Le 4 octobre, Rembrandt décède à l''âge de soixante-trois ans. Le tableau était toujours sur le chevalet, les mains du vieil homme quelques traits plus loin qu''auparavant, et la palette était de côté, ses couleurs séchées.'
      none: 'Le 4 octobre, Rembrandt décède à l''âge de soixante-trois ans. La peinture sur le chevalet s''arrêta là où ses forces l''avaient épuisé, le pinceau se tenait dans son pot et la peinture dans ses poils séchait lentement.'
      not_admitted: '{staff} n''est jamais entré dans la maison et n''a passé que quelques jours chez le muller dans une boutique de coloriste au bord du canal. Un jour, à l''extrémité du canal, le magasin emballait un pot de blanc de plomb pour le vieux peintre, et personne n''est venu le chercher ; il est resté sur le comptoir tout l''après-midi.'
      points:
        p1:
          trait_artistic: 'Le matin du 29 septembre, Rembrandt est assis devant le chevalet de l''atelier et le pinceau qu''il tient à la main reste longtemps suspendu avant de tomber. Dans le tableau, un vieil homme tient un enfant dans ses deux mains, la lumière sur son visage encore sombre. {staff}, avec un œil de peintre et une main ferme, broie les couleurs qu''il demande et les dispose sur la palette en petits tas, et chaque fois que la toile cède, maintient le cadre stable pour lui. Avant que la lumière ne disparaisse dans l''après-midi, les deux mains du vieil homme ont encore quelques coups. Rembrandt remet le pinceau dans son pot et, avec son pouce, efface un peu de peinture sur le bord de la toile.'
          else: 'Le matin du 29 septembre, Rembrandt est assis devant le chevalet de l''atelier et le pinceau qu''il tient à la main reste longtemps suspendu avant de tomber. Dans le tableau, un vieil homme tient un enfant dans ses deux mains, la lumière sur son visage encore sombre. {staff}, qui a tenu un pinceau et a une main ferme, broie les couleurs qu''il demande et les dispose sur la palette en petits tas, et chaque fois que la toile cède, il maintient le cadre stable pour lui. Avant que la lumière ne disparaisse dans l''après-midi, les deux mains du vieil homme ont encore quelques coups. Rembrandt remet le pinceau dans son pot et, avec son pouce, efface un peu de peinture sur le bord de la toile.'
      excerpts:
        p1: 'Avant que la lumière ne disparaisse dans l''après-midi, les deux mains du vieil homme ont encore quelques coups. Rembrandt remet le pinceau dans son pot et, avec son pouce, efface un peu de peinture sur le bord de la toile.'
    relic: 'Un pinceau'
    relic_desc: 'Un pinceau usé avec de la peinture séchée dans les poils.'
    points:
      p1: 'Au cours de ses dernières semaines, aidez Rembrandt à pousser plus loin le tableau sur son chevalet, afin que son dernier tableau ne reste pas là où ses forces l''ont épuisé.'
    points_fail:
      p1: 'Le dernier tableau de son chevalet est resté inachevé dans son atelier, comme le raconte l''histoire.'
    shift:
      p1:
        was: 'Rembrandt mourut à Amsterdam le 4 octobre 1669. Son dernier tableau, celui de son chevalet, resta inachevé à sa mort.'
        now: '{staff} a broyé ses couleurs et stabilisé la toile au cours des dernières semaines. Le tableau sur le chevalet a été continué de sa propre main avant octobre.'
        who: 'rembrandt_amsterdam'
        bio: 'Dans cette ligne, Rembrandt a travaillé sur son dernier tableau jusqu''en septembre 1669 et l''a poussé plus loin que l''histoire ne l''a laissé. Il est sorti de son studio plus près de ce qu''il pensait.'
    vignettes:
      colours: 'Le 22 septembre, {staff} passe un après-midi dans l''arrière-boutique d''un coloriste près du Rozengracht, tournant le broyeur sur une plaque de blanc de plomb jusqu''à ce que les deux bras lui fassent mal. Le coloriste dit que les peintres d''aujourd''hui veulent tous que leur blanc soit lisse comme de la crème, et il a envie de leur vendre de la crème et de voir s''ils le remarquent.'
      barge: 'Le 26 septembre, {staff} aide un marinier à transporter un chargement de tourbe le long du Rozengracht. L''eau est si basse cet automne, dit-il, qu''il gratte le fond de chaque pont et il a commencé à saluer les pierres par leur nom.'
      watchman: 'À la mi-novembre, {staff} fait une tournée humide avec le veilleur de nuit, qui secoue son hochet à chaque coin de rue et donne l''heure. Il dit que la pluie de ce mois-ci est également entrée dans le hochet, et que cela ressemble maintenant à une toux.'
  gaudi_barcelona:
    name: 'Heurté par un tramway'
    place: 'Barcelone'
    figure: 'Antoni Gaudí'
    story: 'Le soir du 7 juin 1926, Antoni Gaudí, soixante-treize ans, fut heurté par un tramway sur la Gran Via de Barcelone. Sans papiers et en civil, il était pris pour un mendiant et les taxis qui étaient hélés ne s''arrêtaient pas. Il décède à l''hôpital le 10 juin et est inhumé le 12 juin sous le bâtiment qu''il dirigeait depuis quarante-trois ans. Domènec Sugranyes a repris la direction des travaux. Le 20 juillet 1936, l''atelier fut incendié et la plupart des dessins et modèles en plâtre furent perdus.'
    story_prose:
      opening:
        - 'Barcelone, fin mai 1926. L''architecte catalan Antoni Gaudí, soixante-treize ans, a consacré ses dernières années à un grand édifice de la ville encore inachevé. Ses créations utilisent des courbes tirées de la nature et l''atelier du site regorge de dessins et de modèles en plâtre. L''année dernière, le premier clocher de la façade est a été achevé.'
        - 'Dans l''histoire, le soir du 7 juin, il a été heurté par un tramway sur la Gran Via. Il n''avait pas de papiers et était simplement habillé, alors on l''a pris pour un mendiant et on l''a laissé allongé ; les taxis hélés ne se sont pas arrêtés jusqu''à ce qu''un garde civil en fasse un pour l''emmener dans un dispensaire, d''où il a été transporté à l''hôpital, où il est décédé le 10 juin. Son disciple Domènec Sugranyes prit la direction des travaux. Dix ans plus tard, le 20 juillet 1936, l''atelier est incendié et la plupart des dessins et modèles en plâtre qu''il contient sont perdus. Dans cette branche, un conducteur de tramway de la Gran Via adore sa cloche, un jeune maçon du chantier fredonne au gré du vent et une femme vient vendre de l''eau à midi.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît la médecine et porte une trousse de premiers secours, quelqu'un de gentil ou vigilant avec un corps fort, ou quelqu'un qui porte du matériel qui guérit les blessures, pour l'emmener immédiatement à l'hôpital depuis les voies du tramway\_; quelqu'un qui a travaillé comme menuisier ou tenu des archives, ou quelqu'un de bricoleur et méthodique, pour remettre correctement les travaux en cours et les clés de l'atelier ; et le même genre de personne, avec un peu plus d'esprit ou de volonté, pour persuader Sugranyes de conserver en second lieu les photographies, les dimensions et les dessins des modèles clés."
      outcomes:
        all: 'Cet été-là, Gaudí revint à l''atelier. Dix ans plus tard, les placards brûlèrent, et quelqu''un rapporta du second endroit un album et retourna la photo d''un modèle ; le barème de cette année était écrit au dos.'
        p3: 'Cet été-là, Gaudí revint à l''atelier. Il s''assit sur un tabouret bas près de la porte, regardant les maçons travailler, et dans l''après-midi le vent passait par les ouvertures de la tour et sifflait.'
        p2: 'Le 12 juin, Gaudí est enterré. Dix ans plus tard, l''atelier brûlait et quelqu''un rapportait du second lieu un album dont l''échelle de cette année-là était encore inscrite au dos des photographies.'
        p1: 'Le 12 juin, Gaudí est enterré. Sugranyes a pris la direction des travaux, les marteaux sur le chantier ne se sont pas arrêtés et les maçons ont continué à construire selon cette liste.'
      none: 'Le 12 juin, Gaudí est enterré. Dix ans plus tard, le 20 juillet 1936, l''atelier est incendié et la plupart des dessins et modèles en plâtre contenus dans ses armoires sont perdus.'
      desync: 'Le 10 juin, les maçons attendirent toute la matinée devant la porte de l''atelier ; personne ne savait qui avait les clés et personne ne pouvait dire quel travail était en cours. Lors du rappel du {staff}, le jeune maçon était assis sur une pierre pas encore posée, attendant qu''on l''appelle.'
      not_admitted: '{staff} n''est jamais arrivé sur le site et n''a pris que quelques fois les tramways de la Gran Via. Au loin, parmi les échafaudages, se dressait un clocher et, les après-midi venteux, un léger sifflement retentissait dans plusieurs rues.'
      points:
        p3:
          class_medical: 'Le soir du 7 juin, un tramway freine brusquement sur la Gran Via, entre les rues Bailèn et Girona. Un vieil homme aux vêtements usés est allongé à côté des rails ; quelques personnes se rassemblent, regardent et reculent. {staff}, qui connaît la médecine, s''agenouille à côté de lui en une minute, appuyant sur la blessure et tenant fermement sa tête, et lève les yeux pour dire aux gens qui l''entourent qui il est : c''est Gaudí, l''architecte du chantier. Un taxi arrive. Alors que la voiture démarre, {staff} tient sa tête d''une main et la portière de l''autre. Derrière eux, le tramway sonne une fois et s''éloigne lentement.'
          trait_kind: 'Le soir du 7 juin, un tramway freine brusquement sur la Gran Via, entre les rues Bailèn et Girona. Un vieil homme aux vêtements usés est allongé à côté des rails ; quelques personnes se rassemblent, regardent et reculent. {staff}, gentil et incapable de laisser un vieil homme allongé sur la route, s''agenouille à côté de lui en une minute, tenant la tête droite, et lève les yeux pour dire aux gens qui l''entourent qui il est : c''est Gaudí, l''architecte du chantier. Un taxi arrive. Alors que la voiture démarre, {staff} tient sa tête d''une main et la portière de l''autre. Derrière eux, le tramway sonne une fois et s''éloigne lentement.'
          trait_vigil: 'Le soir du 7 juin, un tramway freine brusquement sur la Gran Via, entre les rues Bailèn et Girona. Un vieil homme aux vêtements usés est allongé à côté des rails ; quelques personnes se rassemblent, regardent et reculent. {staff}, qui surveillait le passage à niveau, s''agenouille à côté de lui en une minute, la tête droite, et lève les yeux pour dire aux gens qui l''entourent qui il est : c''est Gaudí, l''architecte du chantier. Un taxi arrive. Alors que la voiture démarre, {staff} tient sa tête d''une main et la portière de l''autre. Derrière eux, le tramway sonne une fois et s''éloigne lentement.'
          else: 'Le soir du 7 juin, un tramway freine brusquement sur la Gran Via, entre les rues Bailèn et Girona. Un vieil homme aux vêtements usés est allongé à côté des rails ; quelques personnes se rassemblent, regardent et reculent. {staff}, portant le nano kit médical, s''agenouille à côté de lui en une minute, l''utilise comme le disent ses instructions et maintient la tête stable, et lève les yeux pour dire aux gens autour qui il est : c''est Gaudí, l''architecte du site. Un taxi arrive. Alors que la voiture démarre, {staff} tient sa tête d''une main et la portière de l''autre. Derrière eux, le tramway sonne une fois et s''éloigne lentement.'
        p1:
          class_lettered: 'Tôt le 10 juin, les modèles et les dessins de l''atelier sont là où ils sont toujours, et les maçons se tiennent à la porte attendant que Gaudí revienne et approuve le travail de la journée ; personne ne sait qui a les clés. {staff}, habitué à la paperasse, liste les travaux en cours élément par élément, quel mur a atteint quel cours, quel modèle va avec quel dessin, et remet la liste à Sugranyes avec les clés de l''atelier, en lui demandant de signer pour elles. Sugarranyes plie la liste et ferme la main sur les clés. Il se dirige vers la porte et fait un signe de tête aux maçons, et dehors le premier marteau sonne.'
          class_craft: 'Tôt le 10 juin, les modèles et les dessins de l''atelier sont là où ils sont toujours, et les maçons se tiennent à la porte attendant que Gaudí revienne et approuve le travail de la journée ; personne ne sait qui a les clés. {staff}, qui a travaillé avec des outils, répertorie élément par élément le travail en cours, quel mur a atteint quel niveau, quel modèle va avec quel dessin, et remet la liste à Sugranyes avec les clés de l''atelier, en lui demandant de signer pour elles. Sugarranyes plie la liste et ferme la main sur les clés. Il se dirige vers la porte et fait un signe de tête aux maçons, et dehors le premier marteau sonne.'
          trait_methodical: 'Tôt le 10 juin, les modèles et les dessins de l''atelier sont là où ils sont toujours, et les maçons se tiennent à la porte attendant que Gaudí revienne et approuve le travail de la journée ; personne ne sait qui a les clés. {staff}, méthodique, répertorie les travaux en cours élément par élément, quel mur a atteint quel parcours, quel modèle va avec quel dessin, et remet la liste à Sugranyes avec les clés de l''atelier, en lui demandant de signer pour elles. Sugarranyes plie la liste et ferme la main sur les clés. Il se dirige vers la porte et fait un signe de tête aux maçons, et dehors le premier marteau sonne.'
          else: 'Tôt le 10 juin, les modèles et les dessins de l''atelier sont là où ils sont toujours, et les maçons se tiennent à la porte attendant que Gaudí revienne et approuve le travail de la journée ; personne ne sait qui a les clés. {staff}, pratique, liste les travaux en cours élément par élément, quel mur a atteint quel niveau, quel modèle va avec quel dessin, et remet la liste à Sugranyes avec les clés de l''atelier, en lui demandant de signer pour elles. Sugarranyes plie la liste et ferme la main sur les clés. Il se dirige vers la porte et fait un signe de tête aux maçons, et dehors le premier marteau sonne.'
        p2:
          class_lettered: 'Début juillet, les armoires de l''atelier sont alignées, contenant les photographies, les dessins et les modèles en plâtre, et une maquette suspendue d''une voûte est accrochée au-dessus. {staff}, habitué à la paperasse, mesure un à un les modèles clés, inscrit l''échelle au dos de chaque photographie, fait copier les dessins et dresse une liste à faire signer par Sugranyes : un exemplaire reste à l''atelier, l''autre accompagne l''album pour être conservé dans un second lieu. Sugarranyes signe au bas de la liste et coiffe sa plume. Il lève les yeux vers le modèle suspendu au-dessus de sa tête et les petits poids sur ses cordes se balancent.'
