        now: 'Toute personne lisant la lettre en septembre peut utiliser l’index pour en demander une copie. Les questions reviennent à Chevalier avec des numéros de page, laissant une trace au prochain lecteur.'
      p3:
        was: 'Le 30 mai 1832, Galois reçut une balle dans l''abdomen lors d''un duel et resta allongé là où il tomba. Il est décédé à l''hôpital Cochin le 31 mai, à l''âge de vingt ans.'
        now: 'Le {staff} l''atteint en quelques minutes, arrête le saignement et empêche la plaie de devenir septique. Galois se rétablit, revient aux mathématiques et explique lui-même sa théorie aux mathématiciens qui ne l''avaient pas comprise.'
        who: 'galois_paris'
        bio: 'Galois survécut au duel de mai 1832. Il continua à travailler en mathématiques à Paris et vit de son vivant sa théorie des équations lue et discutée.'
    vignettes:
      candle: 'Dans la nuit du 29 mai, {staff} porte une deuxième bougie dans les escaliers pour le concierge. Elle grogne que la lampe du jeune gentleman brûle depuis la nuit tombée, que l''encre est aussi à elle, prêtée, et qu''elle compte la mettre en compte.'
      cart: 'Le 31 mai, {staff} aide un charretier à décharger du bois de chauffage à l''entrée de l''hôpital Cochin. Hier, on a transporté un jeune homme, dit le charretier, et ce matin, il y avait un drap sur lui ; dix ans qu''il apporte du bois ici, et ce sont les beaux matins qu''il ne supporte pas.'
      type: 'À la fin de l''été, {staff} ramasse des caractères renversés sur le sol d''une petite imprimerie. Le compositeur se plaint que ce numéro contient une lettre pleine de sommes, et il a dû emprunter tous les signes égaux à la vitrine voisine.'
  abel_froland:
    name: 'L’exemple et la conjecture'
    place: 'Frolande'
    figure: 'Niels Henrik Abel'
    story: 'À Noël 1828, Niels Henrik Abel vint en traîneau aux usines sidérurgiques de Froland, enrhumé et toussant, pour rendre visite à sa fiancée, et il y resta malade pendant douze semaines. Le 6 janvier 1829, il rédige son dernier article, deux ou trois pages reprenant les principaux résultats du long mémoire qu''il a donné à l''Académie de Paris. Il est décédé de tuberculose le 6 avril, à l''âge de vingt-six ans. Deux jours plus tard, sans le savoir, August Leopold Crelle écrivit de Berlin qu''un poste lui était réservé.'
    story_prose:
      opening:
        - 'Usine sidérurgique de Froland, sud de la Norvège, janvier 1829. Niels Henrik Abel est malade et tousse fort dans la maison où sa fiancée est gouvernante. Il a vingt-six ans. Il a prouvé il y a quelques années que l''équation générale du cinquième degré ne peut être résolue par des radicaux, mais le long mémoire qu''il a donné à l''Académie de Paris en 1826 n''a plus été entendu depuis.'
        - 'Dans l''histoire, il avait déjà froid et était malade lorsqu''il venait en traîneau à Noël, et il est resté au lit ici pendant douze semaines. Le 6 janvier, il rédigeait son dernier article de deux ou trois pages. Il est décédé de tuberculose le 6 avril. Deux jours plus tard, Crelle écrivait de Berlin qu''un poste lui était réservé. Dans cette succursale, la femme de chambre d''en bas écoute la toux toute la nuit, et le commis de la forge trie le courrier tous les jours comme d''habitude.'
        - "Trois types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui peut vérifier une dérivation et garder les papiers et les dossiers d'admission en ordre, quelqu'un qui connaît les soins infirmiers et peut surveiller un lit de malade, et quelqu'un qui peut éloigner ses amis et les pousser à répondre."
      outcomes:
        all: 'En avril, lorsque la lettre de Berlin confirmant le message fut écrite, Abel était déjà parti. La réponse de mars gisait sous son oreiller et le poêle de la pièce n''était pas encore éteint.'
        p4: 'En avril, lorsque Berlin lui écrivit pour confirmer son message, Abel était déjà parti. La réponse de mars était toujours sous son oreiller.'
        p3: 'Le poêle de cette pièce de Froland a brûlé jusqu''en avril.'
        p2: 'Bien des années plus tard, quelqu''un se rendit à Paris à la recherche du long mémoire, trouva la petite ligne au bas du court article et commença par le registre d''admission de cette année-là.'
        p1: 'Le papier de deux ou trois pages fut envoyé. L''adresse sur l''enveloppe était de sa propre main.'
      none: 'L''hiver était long à Froland. La neige devant la fenêtre n''a jamais fondu et l''homme à l''étage toussait nuit après nuit.'
      desync: 'Le 6 janvier, le court journal s''est arrêté avant de pouvoir être vérifié et le {staff} a été rappelé. La toux continuait à l''étage. Les pages étaient étalées sur le couvre-lit, l''encre n''était pas encore sèche.'
      not_admitted: '{staff} n’a jamais franchi la porte de cette maison. L''homme à l''étage toussait toujours et les nouvelles de Berlin arrivaient toujours.'
      points:
        p1: 'Le 6 janvier, Abel était assis sur l''oreiller, écrivant le petit papier, deux ou trois pages étalées sur le couvre-lit. {staff} a suivi la dérivation ligne par ligne avec un stylo et a marqué chaque endroit où la notation ne concordait pas d''une étape à l''autre, et il les a corrigés un à un. Le soir, le papier était au net et il y avait quelques taches d''encre sur le couvre-lit. Il a mis les trois pages au carré, les a aplaties avec sa paume et les a ensuite seulement remises.'
        p2: 'Le petit document était toujours à portée de main. {staff} l''a mis à côté de la date à laquelle les mémoires de Paris avaient été soumis, et au bas de chaque exemplaire a écrit une petite ligne : l''année où ils ont été remis, à qui et sous quel titre. L’encre était pâle, pressée dans la marge et ne sèche qu’au crépuscule. Des deux exemplaires, l''un accompagnait le petit article et l''autre restait dans son dossier de manuscrits.'
        p3: 'Lors des nuits les plus froides de la fin janvier, Abel toussait trop pour dormir. {staff} alimentait le poêle, réchauffait le lit, soulevait ses oreillers, essuyait sa sueur et lui donnait de l''eau. Une nuit, la fenêtre était couverte de fleurs de givre et le poêle de la pièce ne s''est jamais éteint. Vers l''aube, après une quinte de toux, il se rendormit.'
        p4:
          class_lettered: '{staff} procédait comme on tient une correspondance, énumérant un à un les gens de Berlin travaillant pour son compte et ce que chacun faisait, et écrivant à chacun à tour de rôle, leur demandant de faire part de leurs progrès à Froland sans attendre que rien soit réglé. En mars, la réponse est arrivée. Abel fit apporter la lettre à son lit et la lut deux fois. Il ne disait pas que le poste était réglé, mais simplement qu''ils essayaient toujours. Il plia la lettre et la mit sous son oreiller.'
          else: '{staff} a écrit à Berlin lettre après lettre, disant à quel point il était malade et demandant aux amis qui travaillaient pour lui de lui faire part de leurs progrès sans attendre que quoi que ce soit soit réglé. En mars, la réponse est arrivée. Abel fit apporter la lettre à son lit et la lut deux fois. Il ne disait pas que le poste était réglé, mais simplement qu''ils essayaient toujours. Il plia la lettre et la mit sous son oreiller.'
      excerpts:
        p4: 'Il ne disait pas que le poste était réglé, mais simplement qu''ils essayaient toujours. Il plia la lettre et la mit sous son oreiller.'
        p3: 'Une nuit, la fenêtre était couverte de fleurs de givre et le poêle de la pièce ne s''est jamais éteint. Vers l''aube, après une quinte de toux, il se rendormit.'
        p2: 'L’encre était pâle, pressée dans la marge et ne sèche qu’au crépuscule. Des deux exemplaires, l''un accompagnait le petit article et l''autre restait dans son dossier de manuscrits.'
        p1: 'Le soir, le papier était au net et il y avait quelques taches d''encre sur le couvre-lit. Il a mis les trois pages au carré, les a aplaties avec sa paume et les a ensuite seulement remises.'
    relic: 'Une lettre cachetée'
    relic_desc: 'Une offre non ouverte, liée avec un fil.'
    points:
      p1: 'Aide Abel à vérifier sa dernière courte épreuve pendant qu''il est malade afin que le papier puisse être envoyé'
      p2: 'Pendant que le court article est à portée de main, associez-le au dossier de soumission de Paris afin que toute personne effectuant une recherche ait une référence.'
      p3: 'Pendant les douze semaines, Abel reste au lit à Froland, garde le froid de sa chambre et soulage sa toux et ses douleurs.'
      p4: 'Demandez aux amis qui recherchent un poste pour Abel d''envoyer une lettre provisoire afin qu''il sache avant sa mort qu''ils essaient toujours.'
    points_fail:
      p1: 'La rédaction de l’article s’interrompt avant qu’il puisse le relire. Le résultat principal du mémoire de Paris perd cette première trace publique. Le bureau rappelle l''employé après une perte de synchronisation.'
      p2: 'Les personnes à la recherche des mémoires de Paris doivent encore parcourir les anciens dossiers d''admission avec à peine plus qu''un titre.'
      p3: 'Personne ne soulage le rhume et la toux, et dans cette branche, ses dernières semaines à Froland sont aussi dures qu''elles l''étaient.'
      p4: 'Aucune nouvelle ne parvient à Froland à temps. La confirmation formelle arrive trop tard.'
    shift:
      p1:
        was: 'Le 6 janvier 1829 à Froland, Abel rédige son dernier article mathématique, reprenant un résultat principal de ses mémoires de Paris.'
      p2:
        was: "Vers 1829, Abel réaffirma le résultat central des Mémoires de Paris\_; le manuscrit était difficile à localiser et ne parut sous forme imprimée qu'en 1841."
        now: '{staff} relie le nouvel article à la date de soumission antérieure et laisse une référence avec chaque copie, limitant ainsi toute recherche ultérieure.'
      p3:
        was: 'À Noël 1828, Abel se rendit en traîneau à Froland, enrhumé et toussant, et se mit à cracher du sang ; il resta là au lit pendant douze semaines.'
        now: '{staff} maintient le poêle allumé et le lit au chaud, et l''accompagne pendant les pires nuits. Abel souffre un peu moins ces dernières semaines.'
      p4:
        was: 'Abel meurt le 6 avril 1829. La lettre confirmant un poste à Berlin est écrite deux jours plus tard.'
        now: '{staff} demande à un contact de faire rapport sur les efforts déjà en cours. Abel lit que ses amis travaillent toujours pour lui trouver un poste.'
        who: 'abel_froland'
        bio: 'Avant de mourir, Abel a entendu comment ses amis berlinois essayaient de lui garder une opportunité de poursuivre ses recherches. La confirmation formelle est encore venue après sa mort.'
    vignettes:
      firewood: 'Pendant les jours les plus froids de février, {staff} aide la femme de ménage à transporter le bois de chauffage à l''étage. Quand le monsieur du haut tousse toute la nuit, dit-elle, elle se couche en bas et compte, et le matin, elle ne compte plus.'
      sledge: "En janvier, {staff} aide le palefrenier à installer un nouveau manche sur le traîneau. À Noël, il est allé chercher un monsieur en ville, raconte le marié, enveloppé dans trois couvertures et toussant tout le long du chemin\_; à son arrivée, l'homme ne pouvait pas soulever sa propre malle, et le palefrenier la souleva et refusa la pièce."
      post: 'En avril, {staff} aide le commis de la forge à trier un sac de courrier. Il montre une lettre avec une marque de Berlin, la tient un moment devant la fenêtre et dit que celle-ci est arrivée au mauvais moment, car l''homme à qui elle est destinée n''est plus là.'
  riemann_selasca:
    name: 'Le dernier article'
    place: 'Selasca'
    figure: 'Bernhard Riemann'
    story: 'Bernhard Riemann tomba malade en 1862 et se rendit plusieurs fois en Italie alors qu''il souffrait de tuberculose. En juin 1866, il vint pour la troisième fois à Selasca, sur le lac Majeur. Le 19 juillet, reposé sous un figuier, il rédigeait encore son dernier devoir, qu''il ne termina pas. Il y mourut le lendemain, à l''âge de trente-neuf ans. Dix ans plus tard, ses œuvres complètes paraissent, avec Richard Dedekind parmi les éditeurs.'
    story_prose:
      opening:
        - 'Lac Majeur, nord de l''Italie, juin 1866. Le mathématicien Bernhard Riemann, trente-neuf ans, est venu pour la troisième fois dans le sud pour des raisons de santé et a pris une chambre à Selasca, sur la rive. Ses travaux sur la géométrie des espaces courbes et sur la distribution des nombres premiers ont ouvert des champs majeurs, et cela fait maintenant près de quatre ans qu''il est atteint de tuberculose.'
        - 'Dans l''histoire, le 19 juillet, il se reposait sous un figuier, travaillant toujours sur son dernier papier, qu''il n''a pas terminé ; le lendemain, il y mourut. Dix ans plus tard, ses œuvres complètes paraissent, éditées par Heinrich Weber avec Richard Dedekind. Dans cette branche, son propriétaire a une petite fille qui enlève chaque jour pour lui les figues tombées sous l''arbre, et un batelier sur le lac a dû apprendre à sa femme à ramer.'
        - 'Plusieurs types de personnes peuvent aider dans ce voyage : quelqu''un qui a enseigné dans une université, construit des modèles ou lu des épreuves, ou quelqu''un d''instruit et de patient, pour suivre les formules qu''il dicte ; quelqu''un qui connaît la médecine et porte le kit nano médical, pour guérir une maladie que l''âge ne pouvait pas.'
      outcomes:
        all: 'Cet automne-là, Riemann retourna à Göttingen et enseigna à nouveau. Parmi les papiers qu''il emporta chez lui, le dernier comptait plusieurs pages de plus, dicté sous le figuier.'
        p2: 'Cet automne-là, Riemann retourna vers le nord, à Göttingen. Le matin de son départ, il resta assis un moment sur la chaise sous le figuier, puis plia une page de notes et la mit dans la poche de son manteau.'
        p1: 'Le dernier article allait plusieurs pages plus loin, selon ses propres mots. Lorsque les œuvres rassemblées sont sorties dix ans plus tard, ces pages ont été imprimées avec.'
      none: 'Le 20 juillet, Riemann mourut à Selasca. La chaise sous le figuier était vide, deux figues étaient tombées sur son siège et personne ne les avait ramassées.'
      not_admitted: '{staff} n''est jamais entré dans la maison et a seulement aidé à décharger quelques bateaux au débarcadère de Pallanza. De l''autre côté de l''eau, du côté de Selasca, se dressait un grand figuier avec une chaise en dessous.'
      points:
        p1:
          class_learned: 'L''après-midi du 13 juillet, Riemann est assis sur une chaise sous le figuier, le papier étalé sur ses genoux, s''arrêtant toutes les quelques lignes pour tousser. {staff}, qui a enseigné dans une université, place un tabouret à côté de lui et écrit chaque phrase au fur et à mesure qu''il la dit, sans un seul index dans les formules erronées, et garde les pages terminées en ordre sous une pierre. Vers le soir, le vent se lève et Riemann sort la première page et la tient longtemps près de ses yeux. Il le remet et pose à nouveau la pierre dessus.'
          class_lettered: 'L''après-midi du 13 juillet, Riemann est assis sur une chaise sous le figuier, le papier étalé sur ses genoux, s''arrêtant toutes les quelques lignes pour tousser. {staff}, qui a lu des épreuves, place un tabouret à côté de lui et écrit chaque phrase au fur et à mesure qu''il la dit, lui relit une fois chaque page terminée et maintient les pages en ordre sous une pierre. Vers le soir, le vent se lève et Riemann sort la première page et la tient longtemps près de ses yeux. Il le remet et pose à nouveau la pierre dessus.'
          else: 'L''après-midi du 13 juillet, Riemann est assis sur une chaise sous le figuier, le papier étalé sur ses genoux, s''arrêtant toutes les quelques lignes pour tousser. {staff}, instruit et patient, place un tabouret à côté de lui et écrit chaque phrase au fur et à mesure qu''il la dit, pose le stylo et attend chaque fois qu''il tousse, et maintient les pages en ordre sous une pierre. Vers le soir, le vent se lève et Riemann sort la première page et la tient longtemps près de ses yeux. Il le remet et pose à nouveau la pierre dessus.'
        p2: 'Dans la nuit du 17 juillet, Riemann tousse trop fort pour s''asseoir et la petite fille du propriétaire se tient dans l''embrasure de la porte avec une lampe, effrayée d''entrer. {staff}, qui connaît la médecine, ouvre le kit nano médical apporté, l''utilise comme le disent les instructions et reste près du lit, posant de temps en temps une main sur son front. Au lever du jour, il dort, sa respiration s''allonge un peu. Trois jours plus tard, au matin, il se dirige seul vers le figuier et reste assis un moment sur la chaise. Il se penche pour ramasser une figue tombée par le pied et la pose à côté de ses papiers.'
      excerpts:
        p2: 'Trois jours plus tard, au matin, il se dirige seul vers le figuier et reste assis un moment sur la chaise. Il se penche pour ramasser une figue tombée par le pied et la pose à côté de ses papiers.'
        p1: 'Vers le soir, le vent se lève et Riemann sort la première page et la tient longtemps près de ses yeux. Il le remet et pose à nouveau la pierre dessus.'
    relic: 'Une page de notes'
    relic_desc: 'Une page de formules inachevées dans une petite main.'
    points:
      p1: 'Alors que ses forces s''épuisent à Selasca, notez ce qu''il dicte et gardez les pages en ordre, en l''aidant à mener son dernier article plus loin que l''histoire ne l''a laissé.'
      p2: 'Guérissez la tuberculose qui le tue et sauvez Riemann'
    points_fail:
      p1: 'Le dernier journal s’est arrêté là où l’histoire l’a laissé.'
      p2: 'Il mourut à Selasca le 20 juillet, comme le raconte l''histoire, et dans cette branche également, il ne put être retenu.'
    shift:
      p1:
        was: 'La nécrologie de la Royal Society et le récit de Dedekind indiquent que la veille de sa mort, se reposant sous un figuier à Selasca, Riemann travaillait encore sur son dernier article, resté inachevé.'
        now: 'Le dernier article allait plusieurs pages plus loin avec ses propres mots, et il était imprimé avec eux.'
      p2:
        was: 'Riemann est mort de tuberculose à Selasca sur le lac Majeur le 20 juillet 1866, à l''âge de 39 ans.'
        now: '{staff} a apporté le remède à la maladie qui l''avait épuisé depuis 1862. Cet automne-là, il retourna dans le nord et enseigna à nouveau à Göttingen.'
        who: 'riemann_selasca'
        bio: 'C''est dans cette direction que Riemann guérit de la tuberculose à l''été 1866. Il rentra chez lui à Göttingen et travailla pendant de nombreuses années.'
    vignettes:
      figs: 'Le soir du 18 juillet, {staff} aide la petite fille du propriétaire à nettoyer les figues tombées sous l''arbre. La chaise là-bas est réservée au gentleman allemand, explique-t-elle, et si elle en oublie une, ses papiers deviennent violets.'
      boat: 'Début juillet, {staff} aide un batelier à décharger une cargaison de citrons à Pallanza. Il y a deux fois moins de bateaux sur le lac cet été, dit le batelier ; les jeunes gens ont tous été appelés, et il a dû apprendre à ramer à sa femme.'
      chair: 'En août, {staff} aide le propriétaire à transporter la chaise sous le figuier. Il l''essuie encore et encore avec sa manche et dit que l''arbre n''a jamais donné autant de figues que cette année et qu''il n''y a plus personne pour s''asseoir dessous.'
      harvest: 'En août, {staff} aide le propriétaire à cueillir des figues dans des paniers plats pour le marché d''Intra. L''arbre n''en a jamais produit autant que cette année, dit-il, et ceux qui se sont fendus au soleil, il les met de côté sur le rebord de la fenêtre de la maison.'
  noether_gottingen:
    name: 'Un cours au nom d’un autre'
    place: 'Göttingen'
    figure: 'Emmy Noether'
    story: 'En 1915, David Hilbert et Felix Klein amenèrent Emmy Noether à Göttingen, mais l''université ne permettait à aucune femme de se qualifier pour enseigner et, à partir de l''hiver 1916, ses cours furent annoncés sous le nom de Hilbert. Le 26 juillet 1918, Klein présenta son article Invariant Variational Problems à la société des sciences de Göttingen, et elle remit sa version finale fin septembre. L''article relie les symétries continues d''une action aux lois de conservation. Elle fut admise à donner des cours en juin 1919 et ce n''est qu''en 1923 qu''elle reçut pour la première fois un petit salaire fixe pour l''enseignement.'
    story_prose:
      opening:
        - 'Göttingen, juillet 1918. Il y a trois ans, David Hilbert et Felix Klein ont amené à Göttingen la mathématicienne Emmy Noether, aujourd''hui trente-six ans, mais l''université n''a pas permis à une femme de se qualifier pour enseigner et, depuis le semestre d''hiver 1916, ses cours sont annoncés sous le nom de Hilbert. Cet été, elle a écrit Invariant Variational Problems, qui relie les symétries continues d''une action aux lois de conservation.'
        - 'En histoire, Klein a présenté le 26 juillet son article à la Société des sciences de Göttingen et elle n''a remis la version finale que fin septembre ; l''année suivante, elle fut admise à donner des cours et ce n''est qu''en 1923 qu''elle reçut pour la première fois un petit salaire fixe pour l''enseignement. Dans cette branche, le bâtiment de mathématiques a une portière qui a épinglé les horaires de plusieurs trimestres, et l''arrière-cour où elle loge a une logeuse qui ne compte plus ses coupons de pain.'
        - 'Plusieurs types de personnes peuvent aider dans ce voyage : quelqu''un qui a enseigné dans une université, tenu des archives ou lu des épreuves, ou quelqu''un de méthodique et instruit, pour y rassembler l''article signé et son résumé ; quelqu''un qui a conservé des archives ou donné des conférences et qui peut parler du département, pour obtenir un salaire pour son séminaire.'
      outcomes:
        all: 'En juin 1919, après sa conférence d''essai, Noether fut admise à donner des conférences à Göttingen et sa thèse portait sur les problèmes variationnels invariants, sous son propre nom. Avant cela, son séminaire était déjà rémunéré et les étudiants qui travaillaient avec elle avaient un horaire fixe chaque semaine pour venir.'
        p2: 'Cet hiver-là, son séminaire était rémunéré et les étudiants travaillant avec elle avaient un horaire fixe chaque semaine pour venir. En juin 1919, après sa conférence d''essai, elle fut admise à donner une conférence.'
        p1: 'Le journal a été présenté à temps et la copie imprimée portait son nom. En juin 1919, c''est devenu sa thèse pour le droit de donner des conférences.'
      none: 'Fin décembre, le séminaire se déroulait toujours, sans rémunération. La ligne sur le tableau d''affichage indiquait toujours Professeur Hilbert, avec l''aide du Dr Noether, et un anneau de rouille s''était répandu autour de la punaise.'
      desync: 'Avant la réunion du 26 juillet, le document et son résumé étaient encore dispersés en deux piles et la page de l''auteur était introuvable. Lorsque le {staff} a été rappelé, une première page non signée gisait sur la table et à l''extérieur, l''horloge sonnait.'
      not_admitted: '{staff} n''est jamais entré dans le bâtiment de mathématiques et n''est resté que quelques fois sur les marches extérieures. L''emploi du temps était épinglé au tableau et une ligne indiquait Professeur Hilbert, avec l''aide du Dr Noether.'
      points:
        p1:
          class_learned: 'Le matin du 26 juillet, avant la réunion de la société, le manuscrit que Klein souhaite se trouve encore à deux endroits : l''une est le papier signé par Noether, l''autre son résumé, tous deux glissés parmi d''autres papiers. {staff}, qui a enseigné dans une université et sait comment se déroulent de telles réunions, rassemble les deux piles en fonction de leurs numéros de page, trouve son nom sur la première page, la marque avec un bout de papier et la remet entre les mains de Klein avant la réunion. Klein se tourne vers la première page, jette un coup d''œil au nom qui y figure et place le manuscrit dans le compartiment supérieur de sa mallette. Il ferme le fermoir et entre dans la salle de réunion avec l''étui sous le bras.'
          class_lettered: 'Le matin du 26 juillet, avant la réunion de la société, le manuscrit que Klein souhaite se trouve encore à deux endroits : l''une est le papier signé par Noether, l''autre son résumé, tous deux glissés parmi d''autres papiers. {staff}, à l''aise avec les manuscrits, rassemble les deux piles page par page, trouve son nom sur la première page, la marque avec un bout de papier et la remet entre les mains de Klein avant la réunion. Klein se tourne vers la première page, jette un coup d''œil au nom qui y figure et place le manuscrit dans le compartiment supérieur de sa mallette. Il ferme le fermoir et entre dans la salle de réunion avec l''étui sous le bras.'
