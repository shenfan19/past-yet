      shift: 'Achang veut fermer le livre avant d''appeler le prochain gardien. Vous lui demandez de lire les entrées à haute voix une fois. Lorsqu''il arrive à la livraison sans témoin, ils acceptent de laisser la file d''attente. Le prochain gardien pourra voir ce qui reste à confirmer.'
      later: 'Vous savez qu''un historien racontera l''histoire d''un livre. Ajin veut savoir si un volume réel est passé par cette pièce. Vous lui montrez où une livraison confirmée serait écrite. Le page quitte son bureau avec cet endroit toujours ouvert.'
  miyazawa_kenji_hanamaki:
    name: 'Des histoires que peu avaient lues'
    place: 'Hanamaki'
    figure: 'Miyazawa Kenji'
    story: 'Miyazawa a révisé La Nuit sur le chemin de fer galactique en plusieurs versions. Dans le texte manuscrit, Giovanni entend un appel de gare avant de se retrouver dans une voiture.'
    story_prose:
      opening:
        - 'Hanamaki, 1933. Miyazawa Kenji a enseigné et conseillé les agriculteurs sur les engrais. Certaines des histoires qu''il écrit pour les enfants sont encore en cours de révision.'
        - 'Dans l’histoire, il est décédé après être tombé malade en septembre. La nuit sur le chemin de fer galactique survit dans plusieurs versions. Dans cette branche, tant les visiteurs des fermes voisines que les personnes qui veulent voir les pages doivent attendre qu''il ait la force de parler.'
        - 'Quelqu’un qui peut aller droit au but dans la question d’un agriculteur peut aider, et quelqu’un qui sait quand arrêter de poser des questions. Quelqu''un doit également apporter le bon équipement pour soigner Miyazawa lorsqu''il tombe malade.'
      points:
        p3: 'Le 20 septembre, quelqu''un à la porte dit qu''il ne pouvait pas rester assis. {staff} vient avec l''équipement, lui demande la permission de l''aider et fait rester la famille. Quelque temps plus tard, Miyazawa cherche l''eau que quelqu''un lui apporte et la prend lui-même. Quelqu’un traîne un tabouret là où il se trouvait trop loin. Il rend la tasse vide et attend d''avoir lâché prise avant de s''appuyer sur l''oreiller.'
        p2: '{staff} lui transmet les brouillons séparément et lui demande uniquement l''ordre qu''il reconnaît. Il s''arrête à la dernière page d''un texte et déplace son doigt entre deux lignes. Il choisit deux feuilles et les empile dessus. Lui seul savait laquelle de ces pages volantes devait être lue en premier.'
        p1: 'À la porte, {staff} demande à chaque agriculteur ce qui pousse et exactement ce qu''il doit savoir, puis apporte des questions similaires sur une seule feuille. Personne ne connaît la taille d’un champ, alors son propriétaire rentre chez lui pour chercher la note où il l’a noté. Miyazawa demande à la première personne de s''asseoir et pose la feuille de questions sur la table. Une tasse tient un coin afin qu''il n''ait pas besoin de garder la main dessus.'
      outcomes:
        all: 'Les agriculteurs reviendront avec de nouvelles questions. Les brouillons et les notes vont aux extrémités opposées de la table, et Miyazawa trouve un tabouret pour le visiteur à la porte.'
        p3: 'Ensuite, sa famille lave la tasse et la remet là où il peut la prendre sans rien demander.'
        p2: 'Lorsque les brouillons sont lus plus tard, les deux premiers feuillets se trouvent toujours dans l''ordre qu''il leur a donné.'
        p1: 'Le dernier agriculteur à partir plie la feuille de questions en quatre, puis la montre aux gens qui attendent dehors.'
      none: 'En septembre, le manuscrit était toujours dans des piles séparées. La chaise préparée pour un visiteur est vide près de la fenêtre.'
      not_admitted: 'Le {staff} ne rentre jamais à l’intérieur. Quelqu’un près de la porte rassemble les papiers des agriculteurs pour les protéger de la pluie.'
      desync: 'Les agriculteurs n''ont pas le temps de poser leurs questions. Lorsque l''agence rappelle le {staff}, le premier visiteur a encore les questions en main.'
      excerpts:
        p3: 'Quelqu’un traîne un tabouret là où il se trouvait trop loin. Il rend la tasse vide et attend d''avoir lâché prise avant de s''appuyer sur l''oreiller.'
        p2: 'Il choisit deux feuilles et les empile dessus. Lui seul savait laquelle de ces pages volantes devait être lue en premier.'
        p1: 'Miyazawa demande à la première personne de s''asseoir et pose la feuille de questions sur la table. Une tasse tient un coin afin qu''il n''ait pas besoin de garder la main dessus.'
    relic: 'Un carnet de poche'
    relic_desc: 'Un petit carnet de poèmes au crayon.'
    points:
      p1: 'Triez les questions des agriculteurs afin que Miyazawa puisse toujours tenir la consultation sur les engrais lorsqu''il est trop malade pour une longue conversation.'
      p2: 'Même si Miyazawa peut encore reconnaître les brouillons de La Nuit sur le chemin de fer galactique, demandez-lui de laisser leur ordre clair.'
      p3: 'Obtenez des soins médicaux à Miyazawa lorsque sa pneumonie s''aggravera le 20 septembre afin qu''il puisse survivre à la maladie.'
    points_fail:
      p1: 'Les visiteurs partent sans consultation, l''agence se désynchronise et le bureau rappelle l''employé.'
      p2: 'Les pages survivent, et les éditeurs ultérieurs doivent encore déduire l''ordre à partir du papier et des révisions.'
      p3: 'Dans cette branche, la maladie évolue comme avant. Il décède à Hanamaki le 21 septembre, à l''âge de 37 ans.'
    shift:
      p1:
        was: 'En août 1933, Miyazawa a continué à conseiller les agriculteurs sur les engrais alors que sa santé se détériorait.'
      p2:
        was: 'En septembre 1933, Miyazawa mourut, laissant plusieurs versions inachevées de La Nuit sur le chemin de fer galactique.'
        now: '{staff} lui demande quelles piles sont arrivées en premier et enregistre la commande sur un emballage séparé. Les éditeurs ultérieurs utilisent ces notes pour conserver les versions distinctes.'
        who: 'miyazawa_kenji_hanamaki'
        bio: 'Miyazawa a laissé un guide sur l''ordre des brouillons avant de mourir. Lorsque l''histoire parut après sa mort, les lecteurs purent suivre ses révisions dans l''ordre.'
      p3:
        was: 'Le 20 septembre 1933, Miyazawa développa une pneumonie aiguë et mourut le lendemain à Hanamaki, à l''âge de 37 ans.'
        now: '{staff} permet de démarrer le traitement pendant la maladie aiguë. Miyazawa survit et peut à nouveau s''asseoir à son bureau à mesure que l''automne avance.'
        who: 'miyazawa_kenji_hanamaki'
        bio: 'Dans cette branche, Miyazawa survit à la pneumonie de l''automne 1933 et reprend le travail sur ses manuscrits.'
    vignettes:
      call: 'Vous lisez l’appel de la station de l’autre côté de la pièce. Le lecteur lève les yeux avant que vous expliquiez qui est là. Ils laissent l''explication pour plus tard et gardent l''appel dans leur lecture.'
      window: 'Le lecteur essaie d''indiquer l''endroit où la route entre dans le ciel. Vous demandez d''abord ce que Giovanni peut voir à travers la fenêtre. Ils ont mis la colline et la voiture sur des morceaux séparés.'
      ticket: 'Vous maintenez la page ouverte pendant que le lecteur relit le passage dans le chariot. Ils notent brièvement ce qui change avant que la prochaine station ne soit nommée.'
  higuchi_ichiyo_tokyo:
    name: 'Sept livraisons sur un comptoir'
    place: 'Tokyo'
    figure: 'Higuchi Ichiyo'
    story: 'Takekurabe de Higuchi Ichiyō parut en sept épisodes dans Bungakukai en 1895 et janvier 1896. Bungei Kurabu le publia ensemble en avril 1896.'
    story_prose:
      opening:
        - 'Tokyo, 1896. Takekurabe d''Ichiyō Higuchi a parcouru sept numéros de Bungakukai, puis est apparu dans une version complète révisée dans Bungei Kurabu.'
        - 'Dans l''histoire, elle n''a pas obtenu d''édition séparée dans les conditions qu''elle pouvait choisir et elle est décédée en novembre. Dans cette branche, il reste encore un numéro en date à trouver et un libraire pourrait encore accepter une avance.'
        - 'Quelqu''un qui peut retracer les problèmes et les preuves peut vous aider. Il faudra de la patience pour faire attendre la personne qui discute du paiement pendant que l''auteur lit les conditions. La maladie a besoin de quelqu''un qui arrive avec le bon équipement.'
      points:
        p3: 'Quand le temps devient chaud, Ichiyō a toujours de la fièvre. {staff} lui rend visite, organise les soins qu''elle accepte et demande aux personnes avec qui elle vit de refuser toute personne réclamant plus de pages. Un jour, elle s''assoit à nouveau au bureau. Elle rapporte le manuscrit d''où il reposait contre le mur. Un peu de lumière provenant de la fenêtre tombe sur l''endroit où elle s''est arrêtée pour la dernière fois.'
        p2: '{staff} demande au libraire de mettre ensemble le tarif, sa date et la version à utiliser par écrit. Ichiyō rapproche la feuille et lit chaque terme. Ce n''est qu''à la fin qu''elle demande quelle copie elle peut conserver. Le libraire plie son exemplaire en deux. Sur celui ouvert par Ichiyō, le nom qu''elle a encerclé est immédiatement visible.'
        p1: 'Sur le comptoir, il devrait y avoir sept numéros, mais on ne peut en compter que six. {staff} recherche la dernière personne qui a emprunté le numéro absent. De retour au comptoir, Ichiyō retrouve le même passage dans sa révision. Elle place les pages les unes à côté des autres et commence à lire dès la première ligne réécrite. Cette fois, la fissure du comptoir n’accroche pas le papier.'
      outcomes:
        all: 'Quand Ichiyō revient au bureau, elle vérifie d''abord les termes de l''édition séparée. Deux piles gisent près de la fenêtre : les anciens numéros et le papier sur lequel elle peut encore écrire.'
        p3: 'Lorsqu''elle peut à nouveau s''asseoir et écrire, elle prend la page par-dessus. Personne dans la pièce ne le tourne à sa place.'
        p2: 'Le libraire renvoie une copie de son accord. Elle conserve l''épreuve choisie dans le même ancien numéro.'
        p1: 'Lorsque le numéro complet arrive, les sept plus anciens sont toujours empilés. Elle s''arrête à table et lit l''endroit qu''elle a révisé.'
      none: 'Un message du libraire indique qu’il reste encore beaucoup à faire. Une fois le nouveau numéro clos, il ne contient aucune nouvelle réponse.'
      not_admitted: '{staff} ne rencontre jamais Ichiyō. Une pile d’émissions plus anciennes est toujours liée sous le comptoir des prêts.'
      desync: 'Un numéro antérieur est introuvable. Lorsque le bureau rappelle le {staff}, la pile sur le comptoir présente encore un espace au milieu.'
      excerpts:
        p3: 'Elle rapporte le manuscrit d''où il reposait contre le mur. Un peu de lumière provenant de la fenêtre tombe sur l''endroit où elle s''est arrêtée pour la dernière fois.'
        p2: 'Le libraire plie son exemplaire en deux. Sur celui ouvert par Ichiyō, le nom qu''elle a encerclé est immédiatement visible.'
        p1: 'Elle place les pages les unes à côté des autres et commence à lire dès la première ligne réécrite. Cette fois, la fissure du comptoir n’accroche pas le papier.'
    relic: 'Un journal de poche'
    relic_desc: 'Un journal tenu pendant des années avec une écriture soignée au pinceau.'
    points:
      p1: 'Rassemblez les sept versements de Bungakukai et vérifiez les épreuves collectées avec Higuchi afin que le travail révisé puisse paraître en avril.'
      p2: 'Lorsque le texte collecté apparaît, aidez Higuchi à négocier une édition séparée avec un paiement d''avance et les épreuves de son choix'
      p3: 'Quand la fièvre d''Ichiyō ne baissera pas en juillet, trouvez la tuberculose tôt et guérissez-la.'
    points_fail:
      p1: 'Il manque un numéro dans la pile. L''éditeur reçoit un texte collecté incomplet et le bureau rappelle l''employé.'
      p2: 'La version rassemblée peut être empruntée, mais le libraire la fait attendre sans convenir d''un tarif ni d''un texte à utiliser.'
      p3: 'Sa maladie progresse comme dans l''histoire. Elle meurt de tuberculose le 23 novembre, à l''âge de vingt-quatre ans.'
    shift:
      p1:
        was: 'Takekurabe s''est déroulé en sept tranches. Bungei Kurabu a imprimé ensemble l''ouvrage révisé le 10 avril 1896.'
      p2:
        was: 'Ichiyō a fait face à des difficultés financières tard dans sa vie. Takekurabe est apparu plus tard dans ses œuvres rassemblées en 1897.'
        now: 'Le libraire avance une partie des honoraires et conserve les épreuves homologuées. Elle peut utiliser l’argent pour les dépenses du ménage, et le prochain compositeur sait quel texte suivre.'
      p3:
        was: 'En juillet 1896, Ichiyō tomba malade. Elle est décédée de tuberculose le 23 novembre, à l''âge de vingt-quatre ans.'
        now: '{staff} assure des soins pendant qu''il est temps de la soigner. Ichiyō récupère suffisamment pour passer à nouveau une partie de la journée à son bureau.'
        who: 'higuchi_ichiyo_tokyo'
        bio: 'Dans cette branche, Higuchi Ichiyō se remet de la maladie commencée en 1896 et retourne à l''écriture.'
    vignettes:
      index: 'Quelqu’un a écrit « terminé » sur un seul problème. Vous comparez sa fin à l''impression d''avril et trouvez où elle s''interrompt. Le libraire permet d''y glisser un slip amovible. Vous rapportez à la maison une liste de sept versements. On ne sait jamais qui a écrit le premier label.'
      reserve: 'Le gardien a un lecteur qui a suivi l’histoire de numéro en numéro et n’est pas revenu pour le dernier. Vous soulignez que d''autres clients peuvent désormais acheter le tirage d''avril. Le dernier versement passe sous le comptoir avec un bon de réservation. Vous partez avant le retour de ce lecteur.'
      layout: 'Vous placez le numéro d''avril à côté du dernier versement. On ouvre au début et on suppose que le lecteur a déjà attendu six morceaux. Vous écrivez cette distinction sur un morceau pour le marchand et conservez votre propre copie. Les lecteurs de série originaux ont attendu plus longtemps que toute votre visite.'
  rumi_konya:
    name: 'La voix qui ouvre le récit'
    place: 'Konya'
    figure: 'Rumi'
    story: 'L’ouverture du Masnavi de Rumi demande à l’auditeur d’entendre un roseau parlant de séparation. Le musée Mevlana de Konya possède un manuscrit de six livres copié en 1278, après la mort de Rumi en 1273.'
    story_prose:
      opening:
        - 'Konya, 1273. Le long poème de Rumi a été organisé en six livres. Une copie réalisée cinq ans plus tard subsiste encore.'
        - 'Dans l’histoire, Rumi est mort en décembre. Le manuscrit raconte aux lecteurs ultérieurs comment le poème a été ordonné. Dans cette branche, les pages de deux exemplaires de lecture sont toujours sur la même table.'
        - 'Quelqu''un qui peut donner un sens à l''ordre des feuilles volantes sera utile. Il faut aussi que quelqu''un écoute lorsqu''un malade dit qui il veut voir et qu''il donne un peu de calme aux deux.'
      points:
        p2: '{staff} demande à Rumi qui il veut voir en premier, fait entrer le visiteur et demande aux autres près de la porte d''attendre. Le visiteur s''assoit là où Rumi peut l''entendre. Pendant un moment, ni l''un ni l''autre ne parle. Le visiteur dépose le papier qu''il tenait. Rumi le voit et rapproche un peu la tasse de lui.'
        p1: 'Lorsque l''emprunteur arrive, {staff} sépare les deux ensembles sur la table et suit chaque dernière ligne jusqu''à la feuille suivante. L''emprunteur s''assoit pour aider. Lorsqu’une ligne s’interrompt, sa lecture aussi. Il trouve la feuille suivante et la fait glisser d''un pouce vers l''avant. Cette fois, le paquet emprunté suit du premier passage au dernier.'
      outcomes:
        all: 'Plus tard, l''emprunteur laisse les deux exemplaires à leur place séparée. Lorsque la porte se ferme, ceux qui sortent ont les mains libres et le lecteur reste un peu plus longtemps.'
        p2: 'Les gens à la porte font une petite place. Le visiteur reste assis longtemps. Personne ne le presse de sortir.'
        p1: 'A la porte, l''emprunteur retourne une feuille avant d''emporter le paquet contre son manteau.'
      none: 'Deux séries de pages restent sur la table. La tasse près de la fenêtre reste longtemps intacte.'
      not_admitted: 'Le {staff} ne pénètre jamais à l’intérieur. L''emprunteur attend près du banc, les mains vides.'
      desync: 'Un exemplaire est emprunté avec une section manquante. Lorsque l''agence rappelle le {staff}, l''autre est toujours ouvert sur la table.'
      excerpts:
        p2: 'Le visiteur dépose le papier qu''il tenait. Rumi le voit et rapproche un peu la tasse de lui.'
        p1: 'Il trouve la feuille suivante et la fait glisser d''un pouce vers l''avant. Cette fois, le paquet emprunté suit du premier passage au dernier.'
    relic: 'Feuille d’ouverture d’un lecteur'
    relic_desc: 'Une feuille de lecture imaginée marquant l''ouverture d''un vers.'
    points:
      p1: 'A Konya, vérifiez l''ordre des feuilles dans un exemplaire du Masnavi avant de le prêter à un autre lecteur'
      p2: 'Lorsque Rumi tombe malade, demandez qui il veut voir et gardez la pièce silencieuse lorsqu''ils s''assoient ensemble.'
    points_fail:
      p1: 'Deux exemplaires de lecture sont mélangés. Un paquet part avec une section au mauvais endroit, et le bureau rappelle {staff} lorsque l''enregistrement n''est plus synchronisé.'
      p2: 'Un autre visiteur arrive à la porte avant que la personne demandée par Rumi puisse s''asseoir.'
    shift:
      p1:
        was: 'Konya détient un manuscrit de six livres du Masnavi daté de 1278, cinq ans après la mort de Rumi.'
      p2:
        was: 'Rumi mourut à Konya en décembre 1273. Un récit ultérieur représente ses compagnons rassemblés à son chevet.'
        now: 'Dans cette branche, {staff} installe une chaise pour la personne que Rumi demande à voir. La conversation peut attendre que Rumi soit prêt à parler.'
    vignettes:
      reed: 'Narin a interprété les deux parties avec la même voix. Vous demandez où le roseau parle pour la première fois comme lui-même. Elle laisse commencer la ligne suivante après un souffle. Quand Hasan écoute les yeux fermés, il peut entendre le moment où le roseau prend le dessus.'
      hand: 'Hasan doit quitter le banc de lecture et Narin cherche sa page alors qu''il parle encore. Vous maintenez son coin jusqu''à ce qu''il termine le couplet et puisse mettre le doigt sur la ligne suivante. Elle commence là quand c''est son tour. Le passage s''est écoulé entre eux sans espace.'
      manuscript: 'Vous avez vu le dernier manuscrit de six livres. Narin demande si cela montrera où Hasan a respiré. Vous montrez la ligne qu’ils ont répétée et la laissez décider où faire une pause. La porte se ferme avant qu''ils ne lisent à haute voix le couplet suivant.'
  terence_rome:
    name: 'Un public qui ne tient pas en place'
    place: 'Rome'
    figure: 'Térence'
    story: 'Les prologues d’Hécyre de Terence décrivent des interruptions. Ils se souviennent du tirage au sort d''un boxeur et d''un funambule, puis d''une foule affluée à l''annonce des gladiateurs. La carte année situe les premières productions, tandis que le deuxième prologue revient sur elles.'
    story_prose:
      opening:
        - 'Rome, vers 165 avant JC. Les prologues d''Hecyra raconteront ce qui s''est passé lors de sa première diffusion. Les joueurs attendent que le public s''installe.'
        - 'Dans l’histoire, le public était distrait par d’autres divertissements et la comédie n’a pas atteint sa fin. Dans cette branche, les premières lignes n''ont pas encore disparu. Ils ne peuvent tout simplement pas entendre qui est censé parler ensuite.'
        - 'Quelqu''un qui peut parler au-dessus d''une foule et qui sait quand rendre la salle aux acteurs pourrait aider.'
      points:
        p1: '{staff} demande aux premiers rangs de prendre place, puis désigne l''acteur qui attend déjà pour parler. Un homme demande quand commence l’autre divertissement. {staff} l''écoute et lui demande d''attendre une seule ligne. L''acteur n''élève pas la voix. Quelques personnes se retournent et ceux qui se trouvent derrière eux se taisent également. Lorsque la dernière phrase est prononcée, l''homme le plus proche de la scène enlève sa main du bord. Les gens derrière lui attendent qu''il se lève avant de bouger.'
      outcomes:
        all: 'Lorsque l''équipage vient dénouer les cordages, quelques personnes sont encore assises, parlant de la réplique qu''elles viennent d''entendre.'
        p1: 'La dernière scène est terminée avant que les gens au front ne commencent à se lever.'
      none: 'La foule se dirige vers l''autre spectacle. Sur scène, l''acteur s''arrête au milieu d''une file.'
      not_admitted: '{staff} n’atteint jamais la première ligne. Quelqu’un se tient à proximité et bientôt il n’y a plus que le dos à regarder.'
      excerpts:
        p1: 'Lorsque la dernière phrase est prononcée, l''homme le plus proche de la scène enlève sa main du bord. Les gens derrière lui attendent qu''il se lève avant de bouger.'
    relic: 'Un masque comique'
    relic_desc: 'Un masque en lin au front relevé, porté par un acteur.'
    points:
      p1: 'Lorsque les discussions sur les boxeurs et le funambule submergent les musiciens, faites en sorte que les gens près de la scène écoutent à nouveau afin que la compagnie puisse terminer sa première représentation.'
    points_fail:
      p1: 'Les joueurs ne peuvent pas se faire entendre au-dessus de la foule. Comme dans l’histoire, ils s’arrêtent avant la fin.'
    shift:
      p1:
        was: 'En 165 avant JC, la première représentation de La Belle-Mère fut interrompue au milieu du bruit et de l''excitation suscités par les autres interprètes.'
        now: 'Le public près de la scène recommence à écouter et la compagnie arrive à la dernière ligne du premier coup.'
        who: 'terence_rome'
        bio: 'Dans cette branche, la première mise en scène de La Belle-Mère de Terence atteint sa fin en 165 avant JC.'
    vignettes:
      warning: 'Vous dites à un machiniste que les gens liront encore des informations sur la représentation interrompue dans deux mille ans. Il demande s''ils sauront ce que disaient les acteurs lorsqu''ils ont dû s''arrêter. Vous restez pour la répétition et notez la dernière phrase que vous avez pu entendre. La représentation publique est encore devant vous.'
      audibility: 'Vous écoutez à côté de l''entrée et manquez la réponse à une ligne que vous avez entendue clairement. Le machiniste déplace un banc et vous demande de réécouter. Cette fois, vous entendez les deux moitiés. Vous repartez avec un croquis des deux positions du banc. La rue est devenue trop bruyante pour que vous puissiez entendre la fin de l''extérieur.'
      bench: 'Vous aidez le machiniste à placer un banc en retrait de la porte. Un retardataire s''assoit sans faire toute une rangée. Vous marquez l''espace libre sur un bout de bois. Vous partez avec la répétition qui sonne toujours à travers la porte.'
  taqi_al_din_istanbul:
    name: 'Deux voix à l’observatoire'
    place: 'Istanbul'
    figure: 'Taqi al-Din'
    story: 'L''observatoire d''Istanbul de Taqī al-Dīn a effectué des observations avant sa démolition en janvier 1580. Les recherches dans les archives identifient des instruments, notamment des quadrants et une horloge mécanique.'
    story_prose:
      opening:
        - 'Istanbul, début 1580. Taqi al-Din et ses assistants observent depuis l''observatoire. Les manuscrits enregistrent plusieurs instruments qu''ils y utilisaient.'
        - 'Dans l’histoire, l’observatoire a été démantelé en janvier. Dans cette branche, un ancien lecteur aimerait repartir avec une petite partie d''un instrument qu''ils ont utilisé ensemble.'
        - 'Quelqu’un qui comprend ce qui peut être remis en toute sécurité peut vous aider. Ils doivent demander à l''assistant de quelle pièce il peut prendre la responsabilité.'
      points:
        p1: '{staff} parcourt deux fois le stand avec l''assistant, puis lui demande s''il souhaite prendre uniquement la pièce portant l''échelle qu''il lit le plus souvent. L''assistant hoche la tête et tient un vieux tissu en dessous. Lui et {staff} le soulèvent à plat sur la table. Avant de ramasser le tissu, il passe à nouveau un doigt sur le bord. Son doigt vient se poser à l''endroit où il annonçait la lecture.'
      outcomes:
        all: 'L''assistant ramène la pièce emballée à la maison. Plus tard, quelqu''un lui demande comment ils ont pris les lectures, et il le déplie pour leur montrer cette marque en premier.'
        p1: 'La petite pièce ne va pas avec l''ancien support. Encore enveloppé dans le tissu qu’ils ont utilisé ce jour-là, il passe sous la table de l’assistante.'
      none: 'L''assistant revient une fois et repart les mains vides. Là où se trouvait autrefois le stand, une tache plus pâle apparaît sur le sol.'
      not_admitted: '{staff} ne rencontre jamais personne de l''observatoire. Une fois les portes fermées, une caisse en bois est déplacée à l’intérieur.'
      excerpts:
        p1: 'Avant de ramasser le tissu, il passe à nouveau un doigt sur le bord. Son doigt vient se poser à l''endroit où il annonçait la lecture.'
    relic: 'Un bordereau de comparaison'
    relic_desc: 'Un feuillet d''observatoire fictif avec une rangée originale et sa correction.'
    points:
      p1: 'Avant le démontage de l''observatoire, aider les personnes qui ont utilisé les instruments à en prendre en charge une petite partie graduée.'
    points_fail:
      p1: 'La pièce est encore à l''observatoire lorsque les ouvriers arrivent. Rien de cette passation de pouvoir ne parvient aux anciens assistants.'
    shift:
      p1:
        was: 'En janvier 1580, l''observatoire d''Istanbul fut démoli. Un poème contemporain relate les instruments brisés lors du démantèlement.'
        now: 'Un élément marqué reste chez les anciens assistants. Après avoir quitté l’observatoire, ils peuvent toujours montrer à un autre facteur d’instruments comment cette pièce a été graduée.'
    vignettes:
      clock: 'Hasan lit l''angle à haute voix pendant que Leyla copie l''horloge. La rangée suivante hérite du dernier angle car elle n''a pas entendu son deuxième appel. Vous leur demandez de répéter, une voix à la fois. Les deux travailleurs marquent la correction à côté du document, où le prochain lecteur pourra la trouver.'
      copy: 'Le cahier relié doit descendre et Hasan aura besoin de la correction sur le banc. Vous laissez Leyla copier les lignes anciennes et corrigées sur un seul feuillet. Elle écrit ce qui a été lu en premier. Lorsque le carnet part, le banc porte encore la trace du changement.'
      closure: 'Vous savez combien il reste peu de temps au bâtiment. Hasan s''est arrêté sur une ligne sans aucun temps à côté de l''angle. Vous demandez ce qu''il peut encore vérifier avant de fermer les volets. Il fait le tour d’un espace vide. Vous partez sans voir une autre observation de cette pièce.'
  bessie_coleman_jacksonville:
    name: 'Son nom avant le décollage'
    place: 'Jacksonville'
    figure: 'Bessie Coleman'
    story: 'Bessie Coleman a obtenu une licence de pilote internationale en France le 15 juin 1921. Le 30 avril 1926, elle décède lors d''un vol d''entraînement à Paxon Field à Jacksonville, avant un événement du 1er mai.'
    story_prose:
      opening:
        - 'Jacksonville, avril 1926. Bessie Coleman apprend à voler en France. Elle est actuellement en Floride et se prépare pour un événement aéronautique local.'
        - 'Dans l''histoire, elle a rendu visite à des écoliers le 29 avril et est décédée lors d''un vol d''entraînement le lendemain. Dans cette branche, les organisateurs veulent emprunter la voiture destinée à l''emmener aux écoles.'
        - 'Quelqu''un qui peut parler avec les écoles et les organisateurs peut aider. Il en va de même pour quelqu''un qui connaît les avions et peut demander un autre contrôle avec tout le monde en attente de décollage.'
      points:
        p4: 'Le {staff} amène l''équipe au sol en premier et écoute l''inspection avec Coleman et le pilote. Quelqu’un qui attend demande qui prendra les places réservées. Coleman demande le carnet de vol. Le pilote indique une heure qu''il pourrait utiliser un autre jour. Elle prend le crayon et laisse la ligne du jour vide.'
        p2: 'Les élèves ont plein de questions. L''un d''eux a été plié si petit que personne ne le prend lorsque l''élève le tient. {staff} le remet au professeur qui reste sur place, lui demande de prendre du temps pour un autre cours et donne à Coleman l''adresse du professeur afin qu''elle puisse lui envoyer des nouvelles de la formation. L''enseignant copie son adresse dans un coin du tableau. Le dernier élève sorti se retourne et note à nouveau le numéro de la maison.'
        p1: '{staff} apporte le programme de l''événement à l''école, découvre les horaires déjà attribués aux élèves, puis procure une autre voiture aux organisateurs. Au moment où Coleman arrive, il y a une file d''attente dans le hall. Une enfant devant redresse un papier avec son nom dessus. Ce n''est qu''après qu''elle s''est assise qu''il pose sa question sur le bureau.'
      outcomes:
        all: 'Il n’y a pas de vol d’entraînement ce jour-là. Coleman met l''adresse du professeur dans le livre, et elle et le pilote tournent la ligne vierge vers le haut.'
        p4: 'Le vol d''entraînement est reporté à un autre jour. À la fermeture du champ, personne n''a mis de nouveau numéro en ligne.'
        p2: 'L''enseignant apporte les questions en classe et les place à côté du livre pour la leçon suivante.'
        p1: 'La visite scolaire se déroule comme prévu. À la fin, quelqu’un attend toujours à la porte le journal portant le nom de Coleman.'
      none: 'Après l''événement, plusieurs listes sont encore sur la table, sans que personne ne les prenne.'
      not_admitted: 'Le {staff} ne parvient ni aux organisateurs de l''école ni à l''équipage. Quelqu’un éloigne le dernier tabouret de la porte.'
      desync: 'La visite scolaire est rayée du planning. Alors que le bureau rappelle {staff}, les enfants attendent toujours à la porte.'
      excerpts:
        p4: 'Le pilote indique une heure qu''il pourrait utiliser un autre jour. Elle prend le crayon et laisse la ligne du jour vide.'
        p2: 'L''enseignant copie son adresse dans un coin du tableau. Le dernier élève sorti se retourne et note à nouveau le numéro de la maison.'
        p1: 'Une enfant devant redresse un papier avec son nom dessus. Ce n''est qu''après qu''elle s''est assise qu''il pose sa question sur le bureau.'
    relic: 'Une épreuve d’imprimerie datée'
    relic_desc: 'Une notification fictive de l’équipe au sol, avec le nom complet de Coleman.'
    points:
      p1: 'Empêcher les préparatifs du spectacle aérien de déplacer les visites de Coleman avec les étudiants de Jacksonville'
      p2: 'Aidez Coleman à organiser une leçon de suivi avec un enseignant local qui pourra répondre aux questions des élèves sur la façon d''apprendre à voler.'
      p4: 'Demandez à l''équipage d''examiner l''avion au sol et demandez aux deux aviateurs de reporter le vol d''entraînement s''il nécessite plus de travail.'
    points_fail:
      p1: 'Les organisateurs abandonnent les visites pour gagner du temps. La succursale n''est plus synchronisée et le bureau rappelle l''employé ce jour-là.'
      p2: 'Les élèves rentrent chez eux avec leurs questions et aucun professeur n''a accepté de cours de suivi.'
      p4: 'Le vieil avion décolle comme prévu. Coleman et le pilote meurent pendant le vol d''entraînement.'
    shift:
      p1:
        was: 'Le 29 avril 1926, Coleman rendit visite aux étudiants des écoles publiques noires de Jacksonville.'
      p2:
        was: 'Coleman voulait ouvrir une école de pilotage et s''est entretenu avec des étudiants de Jacksonville. Son école n''a pas ouvert de son vivant.'
        now: 'Dans cette branche, un enseignant recueille les questions des élèves et accepte de donner un cours de suivi. Coleman a une adresse où elle peut envoyer des nouvelles des opportunités de formation.'
      p4:
        was: 'Le 30 avril 1926, Coleman et le pilote moururent dans un accident de vol d''entraînement à Paxon Field.'
        now: 'Dans cette branche, l''équipage recommande une autre inspection au sol et les aviateurs quittent le vol d''entraînement pour un autre jour.'
        who: 'bessie_coleman_jacksonville'
        bio: 'Après Jacksonville, Coleman a continué à voler et a continué à travailler pour ouvrir la formation au pilotage aux étudiants noirs.'
    vignettes:
      proof: 'Ann est à court de ligne et a coupé le prénom du pilote. Vous échangez deux mots gonflés pour libérer de l''espace. Lors du ramassage, elle fait lire une fois le nom complet au coureur avant de plier l''épreuve. Il peut désormais dire à quelqu''un qui va voler sans dire seulement que c''est une femme.'
      school: 'Lewis pense que la foule ne veut rien d''autre que l''heure du spectacle. Un enfant près de la clôture demande où le pilote a appris. Vous dites à Lewis où la licence a été délivrée et lui permettez d''utiliser la dernière ligne pour un fait qu''il peut répéter. Lorsqu''il prend l''épreuve, il s''entraîne à dire la date ainsi que le lieu.'
      ground: 'Le champ se remplit et vous savez que l’avis du lendemain ne décrira plus la même émission. Ann demande si elle doit distribuer la preuve maintenant. Vous conservez une copie datée et l’aidez à envoyer les autres à la porte. Votre visite se termine au sol, avec l''arrivée des spectateurs.'
  fanny_mendelssohn_berlin:
    name: 'Six chansons sous son propre nom'
    place: 'Berlin'
    figure: 'Fanny Mendelssohn Hensel'
    story: 'Les Six Chansons de Fanny Hensel, op. 1, parut sous son propre nom en 1846. Au printemps dernier, elle termina un trio avec piano et écrivit Bergeslust. Elle tomba malade lors d''une répétition à Berlin le 14 mai 1847 et mourut ce jour-là. Le trio est apparu sous forme imprimée en 1850.'
    story_prose:
      opening:
        - 'Berlin, printemps 1847. Fanny Hensel a publié six chansons sous son propre nom. Après avoir terminé le trio avec piano, elle écrit dans son journal qu''il n''y a plus de musique.'
        - 'Dans l''histoire, elle a complété une dernière chanson. Le 14 mai, elle tomba malade pendant une répétition et décéda ce jour-là. Dans cette branche les trois scores apportés par les joueurs portent des marques différentes.'
        - 'Quelqu''un qui peut comparer les scores et expliquer l''ordre de travail aux joueurs peut aider. Si quelque chose arrive, quelqu’un devra éteindre la musique et appeler à l’aide.'
      points:
        p3: 'Hensel ne tourne pas la page suivante en répétition. {staff} demande aux chanteurs de s''arrêter, envoie quelqu''un à la porte chercher un médecin et demande quel membre de la famille elle va reconnaître. Les chanteurs reculent et se frayent un chemin entre les chaises. Un membre de sa famille pose la partition par terre et s''assoit à côté d''elle. La page qu’elle n’a jamais tournée est toujours ouverte.'
        p1: '{staff} demande aux joueurs de récupérer leurs partitions plus tard afin que Hensel conserve l''heure qu''elle a réservée à sa chanson. Elle entend quelqu''un ouvrir la porte en bas et reste assise. Elle écrit la dernière ligne sur le papier. Son encre est encore humide lorsque vient le deuxième coup.'
        p2: '{staff} place la partition de travail à côté des copies des joueurs et demande d''où vient chaque changement. Hensel regarde à deux endroits, raye une marque et appuie plus fort avec le stylo sur l''autre. Lorsque les joueurs récupèrent leurs partitions, les trois livres sont ouverts sur la même page.'
      outcomes:
        all: 'Plus tard, la famille a le même score à consulter. Plusieurs personnes se souviennent de qui était assise à côté d’elle ce jour-là et quelle lecture elle a choisi de laisser sur la page.'
        p3: 'Après que quelqu''un soit parti chercher le médecin, la pièce est restée calme pendant un moment. La chaise la plus proche de Hensel n''est plus déplacée.'
        p1: 'La chanson finale est terminée. Lorsque les joueurs montent à l’étage, le drap est toujours là où elle l’a laissé sécher.'
        p2: 'La partition de travail du trio demeure. Lorsque la famille souhaite vérifier sa lecture plus tard, elle peut se tourner directement vers la page.'
      none: 'Plusieurs scores restent ouverts. La personne qui ferme la pièce les écarte, un à un, hors de la lumière.'
      not_admitted: '{staff} n’entre jamais dans la salle de répétition. D''en bas, on entend le son d''une phrase interrompue.'
      desync: 'La répétition occupe le temps qu''elle s''est réservé. Lorsque l''agence rappelle {staff}, la dernière ligne de la chanson reste vide.'
      excerpts:
        p3: 'Un membre de sa famille pose la partition par terre et s''assoit à côté d''elle. La page qu’elle n’a jamais tournée est toujours ouverte.'
        p1: 'Elle écrit la dernière ligne sur le papier. Son encre est encore humide lorsque vient le deuxième coup.'
        p2: 'Hensel regarde à deux endroits, raye une marque et appuie plus fort avec le stylo sur l''autre. Lorsque les joueurs récupèrent leurs partitions, les trois livres sont ouverts sur la même page.'
    relic: 'Une partition de chanson'
    relic_desc: 'Une chanson manuscrite marquée Fanny.'
    points:
      p1: 'Protégez le temps d''écriture de Hensel pendant les préparatifs des répétitions afin qu''elle puisse terminer sa dernière chanson'
      p2: 'Placez le manuscrit du trio et la copie de répétition côte à côte et demandez à Hensel de marquer les modifications qu''elle souhaite que les joueurs conservent.'
      p3: 'Quand Hensel tombe malade pendant une répétition, arrête la musique, envoie de l''aide et garde quelqu''un avec elle.'
    points_fail:
      p1: 'La répétition occupe les heures qu''elle s''était réservées et la chanson s''arrête au brouillon. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'Les joueurs conservent leurs modifications sur des pages séparées. Sa famille devra lui demander lesquels elle a approuvé.'
      p3: 'Les gens partent dans des directions différentes pour chercher de l’aide. La pièce reste bondée pendant que sa famille attend de la rejoindre.'
    shift:
      p1:
        was: 'Fin avril 1847, Hensel écrivit que la composition était au point mort après le Trio ; en mai, elle a terminé sa dernière chanson peu avant sa mort.'
      p2:
        was: 'Hensel mourut le 14 mai 1847. Le Trio avec piano parut pour la première fois sous forme imprimée en 1850.'
        now: 'Dans cette branche, {staff} aide Hensel à marquer une copie de travail du Trio à laquelle les joueurs et sa famille peuvent se référer. La publication séparée intervient plus tard.'
      p3:
        was: 'Hensel tomba malade lors d''une répétition le 14 mai 1847 et mourut le même jour.'
        now: 'Dans cette branche, {staff} reçoit de l''aide et demande aux chanteurs de clôturer leurs partitions. Il y a de la place à côté de Hensel pour qu''un membre de sa famille puisse rester avec elle.'
    vignettes:
      cover: 'Un chanteur a ouvert la partition au milieu et demande à qui appartient cette musique. Vous récupérez sa feuille de titre libre et la placez à côté de la partition. Les initiales sur la feuille de titre suffisent à déterminer quoi écrire sur la pochette. Vous manquez la première chanson en rassemblant les papiers.'
      forward: 'Vous commencez à expliquer au chanteur comment les collectionneurs rechercheront ces chansons à l''avenir. Elle montre la couverture détachée et demande s''ils l''auront toujours. Vous demandez que la couverture sorte avec le prochain exemplaire. Cela va avec un seul lecteur. Vous ne pouvez plus le suivre.'
      order: 'Vous travaillez sur le contenu et mettez les six chansons dans l''ordre. La chanteuse peut se tourner directement vers celui dont elle a besoin. Vous conservez la séquence sur votre propre bordereau. Ce que vous ne pouvez pas emporter chez vous, c''est le bruit de la pièce après avoir fermé sa porte.'
  camille_claudel_paris:
    name: 'Deux versions d’un même tour'
    place: 'Paris'
    figure: 'Camille Claudel'
    story: 'Le musée Camille Claudel catalogue plusieurs versions de La Valse, dont un moulage en bronze daté de 1905. En 1913, le père de Claudel décède à Villeneuve-sur-Fère et elle n''apprend pas son décès avant les funérailles. Le 10 mars, elle est admise à Ville-Évrard.'
    story_prose:
      opening:
        - 'Paris, mars 1913. Camille Claudel a réalisé plus d''une version de La Valse. Dans son atelier, elle peut choisir la pièce qu''elle veut parmi d''autres qui se ressemblent presque.'
        - 'Dans l’histoire, elle n’a pas appris la mort de son père à temps pour les funérailles. Le 10 mars, elle a été admise à l''hôpital. Dans cette succursale, une lettre vérifiable est arrivée à Paris, et il est temps de donner des instructions à quelqu''un sur l''atelier.'
        - 'Quelqu’un qui sait prendre le temps d’affronter des nouvelles difficiles peut vous aider. En studio, il faudra attendre que Claudel dise ce qui va où et avec qui.'
      points:
        p2: '{staff} prend une feuille blanche et énumère séparément les éléments soulignés par Claudel. Quelqu’un veut mettre deux choses similaires sur une seule ligne. Elle pose la main sur le papier et demande deux espaces. En bas, elle ajoute le nom du destinataire. Avant que le papier ne soit plié, elle montre cette dernière ligne à la personne qui est venue le chercher.'
        p1: '{staff} vérifie la date auprès de la personne qui a apporté la lettre, puis se rend au studio. Claudel le lit une fois, attend un peu et demande quel est le premier train qui l''y amènerait encore. Elle s''essuie deux fois les mains sur son tablier avant de mettre la lettre dans son manteau.'
      outcomes:
        all: 'Avant de partir, Claudel remet la liste à la personne qu''elle a choisie. Lorsqu''il vient le chercher, il relit les deux noms qu''elle n''a pas encore précisés.'
        p2: 'La personne qu''elle a choisie prend la liste. De retour en studio, il retrouve les objets ligne par ligne.'
        p1: 'En route vers Villeneuve, elle ressort une nouvelle fois la lettre. Elle se tourne directement vers la date et la relit.'
      none: 'Les objets restent à leur place. Quelqu''un a aplati un drap au coin de la table. Aucun nom n''est écrit dessus.'
      not_admitted: '{staff} n''entre jamais. La serrure bouge une fois de l''autre côté et les pas reculent.'
      excerpts:
        p2: 'En bas, elle ajoute le nom du destinataire. Avant que le papier ne soit plié, elle montre cette dernière ligne à la personne qui est venue le chercher.'
        p1: 'Claudel le lit une fois, attend un peu et demande quel est le premier train qui l''y amènerait encore. Elle s''essuie deux fois les mains sur son tablier avant de mettre la lettre dans son manteau.'
    relic: 'Une main en bronze'
    relic_desc: 'Une petite étude en bronze d''une main.'
    points:
      p1: 'Apportez à Claudel des nouvelles fiables du décès de son père à temps pour qu''elle puisse décider si elle doit voyager pour les funérailles.'
      p2: 'Avant que Claudel ne quitte le studio, demandez-lui ce qu''elle souhaite confier à quelqu''un qu''elle connaît et aidez-la à noter ses choix.'
    points_fail:
      p1: 'La nouvelle arrive à Paris après les funérailles. Claudel a déjà perdu l''occasion de décider s''il devait y aller.'
      p2: 'Il y aura une trace du déménagement, mais les objets dans le studio ne portent toujours pas de note de Claudel indiquant qui doit les conserver.'
    shift:
      p1:
        was: 'Le 3 mars 1913, son père, Louis-Prosper Claudel, décède à Villeneuve ; la famille ne l''a pas dit à Camille et elle n''était pas présente aux funérailles.'
        now: 'Dans cette succursale, Claudel reçoit la nouvelle à temps et choisit de se rendre à Villeneuve-sur-Fère pour assister aux obsèques de son père.'
      p2:
        was: 'Le 10 mars 1913, Camille est internée à l''asile de Ville-Évrard à la demande de sa famille ; Installée à Montdevergues en 1914, elle n''en repartira plus et y décèdera le 19 octobre 1943.'
        now: 'Dans cette branche, {staff} enregistre ce que Claudel veut faire avec quelques objets du studio. Quelqu''un qu''elle a choisi prend la liste et la suit lorsqu''elle part.'
    shift_all: 'Claudel pourrait décider d’aller aux funérailles de son père et de choisir quelqu’un pour s’occuper des objets de son atelier.'
    vignettes:
      light: 'Vous avez vu une exposition de musée ultérieure, mais ce n''est que maintenant que vous pouvez observer l''ombre changer lorsque vous faites le tour de la jupe. L''emballeur est sur le point d''écrire la même description sur les deux cartes. Vous dessinez les deux courbes dans les marges. Les caisses partiront séparément, et vous ne les verrez ni déballées.'
      mark: 'L''emballeur trouve deux étiquettes portant le même titre. Vous ajoutez un détail à chacun, là où se termine la draperie, avant que les couvercles ne continuent. Vous conservez les deux notes dans votre propre main. La commande de marbre dont vous avez entendu parler n''arrive jamais.'
      crate: 'Pendant que l''emballeur cherche un couvercle, vous gardez une feuille d''emballage à l''écart de la jupe en saillie. Vous tracez sa courbe sur le papier de rechange de mémoire. Lorsque le couvercle s''abaisse, vous ne pouvez plus vérifier le dernier centimètre.'
  emily_bronte_haworth:
    name: 'Le presbytère en hiver'
    place: 'Haworth'
    figure: 'Emily Brontë'
    story: 'Wuthering Heights est apparu en 1847 sous le nom d''Ellis Bell. Le roman présente une grande partie de son histoire comme le récit de Nelly Dean à Lockwood.'
    story_prose:
      opening:
        - 'Haworth, 1848. Wuthering Heights est imprimé sous le nom d''Ellis Bell. Au presbytère, Emily possède encore une première édition qu''elle peut feuilleter depuis le début.'
        - 'Dans l''histoire, Charlotte et Anne se sont rendues à Londres en juillet pour distinguer les noms de plume, et Emily est décédée chez elle en décembre. Dans cette succursale, quelqu''un peut aider à récupérer les papiers avant Londres et attendre qu''Emily dise ce qu''elle veut à la maison.'
        - 'Il faut quelqu''un qui puisse distinguer l''écriture manuscrite de l''orthographe et quelqu''un qui puisse attendre qu''Emily ait fini de parler lorsqu''elle est malade.'
      points:
        p4: '{staff} demande à Emily où elle veut s''asseoir et qui elle aimerait près d''elle. Elle choisit une chaise près du mur et demande son livre. {staff} place la couverture chaude là où elle peut l''atteindre. Quelqu''un commence à enlever l''autre chaise. Emily lève la main et montre où elle se trouve.'
        p3: 'Ce que disent les personnages et ce que l''imprimeur se trompe sont mélangés sur les mêmes pages. {staff} en place quelques-uns séparément avant Emily. Elle lit une orthographe à haute voix et demande à la personne qui tient le stylo d''attendre qu''elle ait fini. Emily encercle le mot qu''elle souhaite conserver. Elle replie la feuille en laissant juste assez de coin visible pour la retrouver.'
        p2: '{staff} ouvre la première édition à l''endroit indiqué par Emily. Elle épingle du doigt la ligne brisée et {staff} écrit le numéro de page et la correction sur une feuille volante. Elle tire le drap pour le vérifier. Deux numéros sont entassés et elle fait un espace entre eux.'
        p1: '{staff} sélectionne les lettres des pages qui portent à la fois des noms et des titres de livres, et sépare les ensembles vérifiables. Charlotte et Anne ont quelque chose à emporter avec elles. Deux feuilles commencent à glisser du sac. Avant de le fermer, Charlotte cherche celui marqué du nom d’Anne.'
      outcomes:
        all: 'Deux listes restent au presbytère : une pour la prochaine édition et une à l''intérieur du livre ancien. Cet hiver-là, la chaise près du mur reste exactement là où Emily l''a demandée.'
        p4: 'La famille quitte le coin aménagé comme elle l''a demandé. Au moment où la lampe se rapproche, le livre est toujours à portée de main.'
        p3: 'En préparant la prochaine édition, Charlotte retrouve d’abord le pli puis le cercle d’Emily.'
        p2: 'Un relecteur ultérieur peut passer directement du numéro de page à la ligne lors de la première impression.'
        p1: 'A Londres, les sœurs présentent leurs papiers séparément. L''éditeur doit diviser les titres rassemblés.'
      none: 'La première édition retourne en rayon. La feuille entre ses pages est encore inachevée.'
      not_admitted: '{staff} ne pénètre jamais dans le presbytère. Un peu de neige mouillée se trouve sous le porche.'
      desync: 'Les journaux à destination de Londres restent groupés en une seule pile. Lorsque le bureau rappelle le {staff}, les deux feuillets marqués sont toujours ensemble.'
      excerpts:
        p4: 'Quelqu''un commence à enlever l''autre chaise. Emily lève la main et montre où elle se trouve.'
        p3: 'Emily encercle le mot qu''elle souhaite conserver. Elle replie la feuille en laissant juste assez de coin visible pour la retrouver.'
        p2: 'Elle tire le drap pour le vérifier. Deux numéros sont entassés et elle fait un espace entre eux.'
        p1: 'Deux feuilles commencent à glisser du sac. Avant de le fermer, Charlotte cherche celui marqué du nom d’Anne.'
    relic: 'Un collier pour chien'
    relic_desc: 'Un collier en cuir usé provenant du dogue du presbytère.'
    points:
      p1: 'Lorsque les lettres de Londres mélangent les livres des Bell, aidez les sœurs à rassembler des documents identifiant le travail de chaque auteur.'
      p2: 'Lorsqu''une erreur d''imprimante modifie une ligne, aidez Emily à laisser des corrections qu''une imprimante ultérieure pourra vérifier'
      p3: 'Bien qu''Emily puisse toujours vérifier comment parlent ses personnages, demandez-lui de préparer une copie en dialecte pour une édition ultérieure.'
      p4: 'Demandez à Emily quelle aide elle est prête à accepter et laissez-la choisir où et avec qui elle repose.'
    points_fail:
      p1: 'Les lettres attribuent toujours les livres à un seul nom de plume et les sœurs ne peuvent pas apporter de preuves séparées à Londres. La clarification est perdue et le bureau rappelle l''employé.'
      p2: 'L''imprimeur suivant doit deviner quelles lectures étaient intentionnelles, et les erreurs sont reportées.'
      p3: 'Sa famille doit décider quelles lignes modifier lors de la réédition du livre, sans aucun moyen d''établir quelle orthographe souhaitait l''auteur.'
      p4: 'Sa famille voit bien que les escaliers la fatiguent. Ils doivent encore attendre qu’elle le demande avant de savoir quelle aide elle souhaite.'
    shift:
      p1:
        was: 'En juillet 1848, Charlotte et Anne Brontë se rendirent à Londres depuis Haworth pour expliquer à un éditeur que les noms de plume de Bell appartenaient à des écrivains différents.'
      p2:
        was: 'Les Hauts de Hurlevent de 1847 contenaient des erreurs d’impression. Des corrections parurent dans la nouvelle édition de 1850.'
        now: '{staff} laisse à Emily une copie à marquer et écrit les erreurs qu''elle identifie avec les références de page.'
      p3:
        was: 'Emily est décédée à Haworth en 1848. Charlotte a édité l''édition de 1850 et modifié certaines orthographes dialectales.'
        now: '{staff} place les pages en dialecte devant Emily séparément et enregistre les orthographes qu''elle approuve en dehors des erreurs d''impression. Charlotte a cet exemplaire lorsqu''elle prépare la prochaine édition.'
        who: 'emily_bronte_haworth'
        bio: 'Emily a laissé une copie annotée des Hauts de Hurlevent avec le dialecte vérifié dans sa propre main. Les imprimeurs ultérieurs ont pu conserver la façon dont elle avait écrit les voix de ses personnages.'
      p4:
        was: 'Le 19 décembre 1848, Emily mourut au presbytère de Haworth. En raison de sa maladie, elle avait refusé de consulter un médecin et n''avait accepté que le jour de sa mort.'
        now: 'Dans cette branche, {staff} demande au lieu de choisir pour elle. Emily choisit un endroit pour se reposer et une personne à proximité pendant que la maison continue autour d''elle.'
    vignettes:
      witness: 'Le lecteur pense que la personne qui raconte l’histoire a tout vu. Vous demandez comment elle a appris un détail particulier. Ils font remonter la phrase à l''orateur qui l''a fournie.'
      voices: 'Le lecteur donne une seule voix à toute la page. Vous leur demandez de réessayer depuis l''endroit où Nelly prend le relais. Un auditeur peut désormais savoir quand un orateur transmet l’histoire à un autre.'
      mark: 'Vous laissez un morceau au moment où le récit change de mains. Le lecteur y revient avant de décider si un passage ultérieur contredit ce qu''il a entendu.'
  qu_yuan_miluo:
    name: 'Des vers au bord du fleuve'
    place: 'Rivière Miluo'
    figure: 'Qu Yuan'
    story: 'Les Chants de Chu transmettent Le Pêcheur, un échange littéraire entre Qu Yuan et un pêcheur. La biographie ultérieure dans les Archives conserve également une version du dialogue.'
    story_prose:
      opening:
        - 'Au bord d’une rivière à Chu. Les lecteurs des Chants de Chu connaîtront des vers attribués à Qu Yuan en exil, ainsi qu''un récit dans lequel il rencontre un pêcheur au bord de l''eau.'
        - 'Les archives reçues le décrivent en train de réciter au bord du marais, le visage tiré. Dans cette branche, quelqu''un veut emporter les versets, avec un paquet encore inachevé.'
        - 'Quelqu''un qui connaît les livres et les traversées de rivières peut vous aider. Il en va de même pour quelqu''un qui peut trouver un endroit calme et y laisser un repas.'
      points:
        p2: '{staff} demande à quelqu''un qui vend de la nourriture de garder une place ouverte, pose le bol et s''écarte. Qu Yuan s''assoit et met les feuillets dans sa main gauche. Il mange un peu avant d''en sortir un lui-même. Il relit la ligne une seconde fois. Quelqu’un assis près de la porte s’avance plus loin dans la pièce.'
        p1: 'Les gens qui traversent la rivière font leurs valises. {staff} demande à Qu Yuan quel paquet il souhaite conserver et demande à la personne qui copie de relire la dernière ligne. Qu Yuan trouve le bordereau qui appartient à deux autres et le pose à sa place. Le porteur fait passer le cordon et laisse le nœud à l’extérieur. Une main pourra le retrouver la prochaine fois que le paquet sera ouvert.'
      outcomes:
        all: 'Le transporteur emporte le paquet. Sur le bateau, il se souvient encore d''une phrase qu''il a entendue pendant le repas, et c''est seulement ensuite qu''il ouvre la copie pour la retrouver.'
        p2: 'Une fois les bols débarrassés, les gens qui sont encore là restent un peu plus longtemps. Dans le calme, Qu Yuan reprend le même lapsus.'
        p1: 'La copie va en aval. Une fois assis, le porteur tourne le nœud vers la main la plus proche.'
      none: 'La place aménagée pour le repas reste vide. La nuit tombée, le vent soulève un coin du tapis.'
      not_admitted: '{staff} ne trouve jamais le lieu prévu pour le repas. Le passeur tire une planche, et l''eau passe encore dessous.'
      desync: 'Il manque une partie de la copie entre deux feuillets. Le transporteur vient d''atteindre le rivage lorsque l''agence rappelle {staff}.'
      excerpts:
        p2: 'Il relit la ligne une seconde fois. Quelqu’un assis près de la porte s’avance plus loin dans la pièce.'
        p1: 'Le porteur fait passer le cordon et laisse le nœud à l’extérieur. Une main pourra le retrouver la prochaine fois que le paquet sera ouvert.'
    relic: 'Une lamelle de bambou portant des vers'
    relic_desc: 'Un bout de bambou portant quelques vers d''un long poème.'
    points:
      p1: 'Demandez à Qu Yuan quel paquet il souhaite copier et aidez un lecteur à garder ces versets ensemble pendant que les gens partent.'
      p2: 'Offrez à Qu Yuan un endroit pour manger et s''asseoir, et écoutez s''il veut lire un de ses vers à haute voix'
    points_fail:
      p1: 'Le lecteur repart avec un écart entre deux feuillets. Le bureau rappelle le {staff} lorsque la copie n''est plus synchronisée.'
      p2: 'Le repas est prêt mais la place pour s''asseoir est prise. Il n''y a aucune chance de lui offrir une heure tranquille.'
    shift:
      p1:
        was: 'Des poèmes attribués à Qu Yuan ont été rassemblés dans les Chants de Chu. Le transfert imaginé ici est une façon pour les lecteurs de conserver un ensemble de versets ensemble.'
      p2:
        was: 'Les archives du Grand Historien disent que Qu Yuan, en exil, parcourait les berges des marais, les cheveux dénoués, le visage hagard et le corps décharné.'
        now: 'Dans cette succursale, Qu Yuan accepte un repas. Il pose un paquet de vers à côté de lui et décide lequel lire à haute voix avant de partir.'
    vignettes:
      two_tales: 'Le passeur a entendu une fin différente de celle que vous avez apportée. Vous écoutez pendant qu''ils le racontent et marquez à qui il raconte avant de comparer les lignes.'
      refrain: 'Le passeur se met à fredonner après la question du conte. Vous attendez la fin de la mélodie avant de demander où ils ont entendu les paroles pour la première fois.'
      wait: 'Pendant que le ferry attend, vous demandez au caissier de retourner là où les deux personnes se sont parlées pour la première fois. À terre, on se souvient encore de qui a posé la première question.'
  sima_qian_changan:
    name: 'Une histoire écrite après la condamnation'
    place: 'Chang''an'
    figure: 'Sima Qian'
    story: 'Le Livre de Han conserve la lettre de Sima Qian à Ren An, dans laquelle il discute des objectifs et de l''organisation de son travail historique.'
    story_prose:
      opening:
        - 'Chang''an, vers 98 avant JC. Sima Qian est emprisonnée après avoir parlé au nom de Li Ling. En repensant à sa Lettre à Ren An, il se souvient que son histoire n''était alors qu''une ébauche.'
        - 'Dans l’histoire, la famille n’a pas pu payer pour racheter sa peine. Il a été puni et a ensuite terminé son histoire. Dans cette succursale, quelqu''un peut s''occuper des pages volantes à la maison et quelqu''un essaie de transmettre une pétition au commis responsable.'
        - 'Il faut quelqu’un qui puisse identifier les traites, quelqu’un qui puisse répondre aux besoins ordinaires d’un prisonnier et quelqu’un qui puisse rassembler les promesses de plusieurs ménages en une seule offre.'
      points:
        p3: '{staff} demande à ceux qui veulent aider de dire à la table quelle contribution ils peuvent apporter, puis apporte la pétition et l''argent au greffier. Le commis le compte et marque le duplicata reçu. Lorsque Sima Qian rentre à la maison quelques jours plus tard, il allume d''abord une lampe. Il défait le paquet supérieur, soulève une feuille dont le coin était maintenu enfoncé et continue d''écrire.'
        p2: '{staff} apporte de la nourriture et des vêtements de rechange à l''endroit où les livraisons sont reçues et attend qu''elles soient comptées. Sima Qian ouvre le paquet et met le vêtement le plus épais sur ses jambes. La nourriture est encore chaude. Il descend le bol entre ses genoux et se penche pour manger.'
        p1: 'Sa maison a débarrassé la table. {staff} vérifie les lignes d''ouverture qui s''affichent aux extrémités des paquets, remet les feuilles déplacées à leur place et demande que les paquets reviennent dans le même ordre. Avant que le dernier paquet ne soit fermé, quelqu''un retourne l''étiquette vers l''extérieur. Le suivant peut être trouvé sans déplacer tous les autres au préalable.'
      outcomes:
        all: 'Le manuscrit reste dans la maison. À son retour, Sima Qian peut reprendre là où il s''était arrêté et quelqu''un attend près de la porte pour recharger la lampe.'
        p3: 'La pétition est acceptée. Lorsque quelqu''un appelle plus tard pour proposer de l''aide, Sima Qian déplace le paquet par le coude pour faire de la place à un visiteur.'
        p2: 'Le vêtement le plus épais reste à côté de lui. Une fois les autres partis, il peut à nouveau l''enrouler autour de lui.'
        p1: 'Avant de partir, la personne qui surveille la table vérifie une nouvelle fois les étiquettes. Chaque paquet est toujours à sa place.'
      none: 'Une fois que les gens à la porte sont rentrés chez eux, une lampe brûle toujours sur la table vide.'
      not_admitted: '{staff} ne rencontre jamais le commis qui accepte les livraisons. Ce qu’ils ont apporté reste dehors.'
      desync: 'Les brouillons ne peuvent pas être remis en ordre. Lorsque le bureau rappelle le {staff}, seul un cordon desserré reste sur la table.'
      excerpts:
        p3: 'Lorsque Sima Qian rentre à la maison quelques jours plus tard, il allume d''abord une lampe. Il défait le paquet supérieur, soulève une feuille dont le coin était maintenu enfoncé et continue d''écrire.'
        p2: 'La nourriture est encore chaude. Il descend le bol entre ses genoux et se penche pour manger.'
        p1: 'Avant que le dernier paquet ne soit fermé, quelqu''un retourne l''étiquette vers l''extérieur. Le suivant peut être trouvé sans déplacer tous les autres au préalable.'
    relic: 'Une liasse de lamelles de bambou'
    relic_desc: 'Slips noués par une cordelette, portant chacun une colonne de personnages.'
    points:
      p1: 'Pendant que Sima Qian est en prison, gardez chez lui les versions inachevées de son histoire entières et en ordre.'
      p2: 'Apportez de la nourriture et des vêtements dans la prison et épargnez-lui les pires humiliations des geôliers'
      p3: 'Demandez aux personnes qui connaissent Sima Qian de contribuer et de présenter leur offre aux fonctionnaires avant l''exécution de la peine.'
    points_fail:
      p1: 'Chez lui, les paquets se détachent et s''éparpillent, et les courants d''air ne sont pas là quand il sort. Cette branche est en décalage avec l''histoire et le bureau rappelle l''employé.'
      p2: 'Personne ne l''atteint en prison, et dans cette branche, il incline la tête devant les geôliers comme il l''écrira plus tard.'
      p3: 'La famille est pauvre et aucun ami ne parle en sa faveur. Dans cette branche, comme dans l’histoire, il ne peut se racheter et est castré.'
    shift:
      p1:
        was: 'Vers 98 avant JC, lorsque Sima Qian fut emprisonné après l''affaire Li Ling, son histoire n''était, selon ses propres mots, qu''à peine commencée et pas encore terminée.'
      p2:
        was: 'Vers 98 avant JC, Sima Qian fut emprisonnée pour avoir défendu Li Ling ; dans sa lettre à Ren An, il raconte comment il a dû s''abaisser devant les geôliers.'
        now: 'Dans cette succursale, {staff} fait livrer de la nourriture et des vêtements chauds à Sima Qian. Il a un repas et quelque chose pour s''envelopper le soir.'
      p3:
        was: 'Vers 98 avant JC, Sima Qian fut condamnée pour avoir défendu Li Ling ; sa famille était trop pauvre pour racheter sa sentence, aucun ami ne parlait en sa faveur et il fut puni par la castration.'
        now: 'Dans cette succursale, les fonctionnaires acceptent le paiement proposé par les personnes réunies {staff}. Sima Qian est épargnée par cette punition et peut retourner à son travail inachevé.'
        who: 'sima_qian_changan'
        bio: 'Dans cette chronologie, Sima Qian a racheté sa peine et n''a pas été castré. Il a encore terminé son histoire du passé jusqu''à son époque.'
    vignettes:
      dates: 'Le greffier commence à fusionner deux entrées de moins d''un an. Vous leur demandez de laisser les dates sur leurs comptes respectifs. Il devient possible de voir exactement où commence le décalage.'
      witness: 'Le greffier veut que la meilleure histoire commence. Vous demandez comment chaque compte est arrivé au bureau. Ils marquent les origines avant de décider quel ordre le lecteur doit voir.'
      binding: 'Vous laissez les deux feuillets en vrac pendant que le greffier les lit à nouveau. Lorsque le paquet est lié, une courte étiquette indique qu''une question est encore ouverte.'
  du_fu_xiang_river:
    name: 'Un poète à bord'
    place: 'Rivière Xiang'
    figure: 'Du Fu'
    story: 'Un poème transmis sous le nom de Du Fu s''intitule : des vers écrits pendant une maladie à bord d''un bateau et adressés à des amis du Hunan. Le poème évoque des scènes fluviales et côtières.'
    story_prose:
      opening:
        - 'Le long de la rivière Xiang, 770. Du Fu a adressé un long poème de trente-six rimes à ses amis et parents du Hunan. Son en-tête indique qu''il l''a écrit malade, à bord d''un bateau.'
        - 'Le poème et son titre survivent. La façon dont il a été livré ne l’est pas. Dans cette branche, la famille a dû déplacer les pages à plusieurs reprises, et le prochain atterrissage n''est pas encore décidé.'
        - 'Il faut quelqu’un qui puisse aider un patient à se reposer, quelqu’un qui puisse s’occuper des pages et quelqu’un qui connaît les passages à niveau et se souvienne du nom du destinataire.'
      points:
        p3: '{staff} demande à Du Fu où il veut s''arrêter et y trouve une personne prête à porter les vers. De l''autre côté du bateau, Du Fu lui dit lentement qui doit les recevoir. L''homme répète le nom avant de prendre le paquet. Du Fu écoute et fait un petit signe de tête. Ce n’est qu’à ce moment-là que la famille passe les pages enveloppées dans la main de l’autre homme.'
        p1: 'Le bateau doit être dégagé pour que les gens puissent passer. {staff} compte les écoutes et les déplace, dans l''ordre indiqué par Du Fu, vers une planche à l''abri du vent. Du Fu atteint une page du milieu et lit ses premiers mots. Une fois tout déplacé, l’espace est toujours là. Du Fu peut dessiner la feuille suivante sans demander à personne de la trouver.'
        p2: '{staff} demande sur quel côté il est le plus facile de s''appuyer, plie le vieux tissu soutenant Du Fu et déplace l''eau vers un endroit où elle ne glissera pas. Il se redresse un peu et atteint la tasse. Le bateau bouge une fois. La tasse fait du bruit mais reste droite.'
      outcomes:
        all: 'Alors que leur bateau quitte le débarcadère, la famille remet le manuscrit chez Du Fu. Un exemplaire est à portée de main et un autre est déjà en route.'
        p3: 'Sur l''autre bateau, le transporteur trouve d''abord un endroit sec pour le papier. Au passage des bateaux, Du Fu peut encore apercevoir un coin de son emballage en tissu.'
        p1: 'Les pages restent en ordre là où le vent ne peut les atteindre. Après leur atterrissage, Du Fu tire à nouveau une feuille du milieu.'
        p2: 'Du Fu se repose un moment à bord. La coupe est toujours là où il peut la trouver sans regarder.'
      none: 'Le dernier bateau est parti du débarcadère. Les pages enveloppées restent là où elles étaient.'
      not_admitted: '{staff} ne trouve jamais le bateau. Une ligne de cordes d''amarrage mouillées est tirée une à une.'
      desync: 'Il manque plusieurs feuilles médianes après le déplacement des objets. Lorsque l''agence rappelle le {staff}, le batelier tient toujours la première et la dernière écoute.'
      excerpts:
        p3: 'Du Fu écoute et fait un petit signe de tête. Ce n’est qu’à ce moment-là que la famille passe les pages enveloppées dans la main de l’autre homme.'
        p1: 'Une fois tout déplacé, l’espace est toujours là. Du Fu peut dessiner la feuille suivante sans demander à personne de la trouver.'
        p2: 'Le bateau bouge une fois. La tasse fait du bruit mais reste droite.'
    relic: 'Lampe à huile de batelier'
    relic_desc: 'Une petite lampe en argile qui brûlait tard sur quelques lignes de vers.'
    points:
      p1: 'Gardez une place pour les pages de Du Fu sur le bateau afin que le long poème pour les amis du Hunan puisse être assemblé'
      p2: 'Soignez-le pendant sa maladie sur le bateau et soulagez sa douleur'
      p3: 'Demandez à Du Fu où il souhaite s''arrêter ensuite et aidez sa famille à trouver une personne qui transmettra les vers terminés à ses amis.'
    points_fail:
      p1: 'Seules les première et dernière feuilles apparaissent après un déplacement précipité. Le poème ne peut pas être assemblé et le bureau rappelle l''employé.'
      p2: 'Il s''allonge sur son oreiller dans le bateau d''hiver et son état empire de jour en jour.'
      p3: 'Le bateau suivant part avant que la famille ne trouve quelqu''un pour prendre le poème. Ils doivent le transporter vers un autre palier.'
    shift:
      p1:
        was: 'En 770, Du Fu, malade sur un bateau, écrivit un poème de trente-six rimes pour ses amis et parents du Hunan, comme l''indique son titre.'
      p2:
        was: 'Le poème de Du Fu à ses amis du Hunan décrit l''écriture alors qu''il était malade à bord d''un bateau.'
        now: 'Cet hiver-là, il souffrit moins sur le bateau.'
      p3:
        was: 'Le poème est adressé à des amis du Hunan. Son en-tête ne donne aucune trace de la manière dont il leur est parvenu.'
        now: 'Dans cette branche la famille fait un arrêt choisi par Du Fu. Quelqu''un à l''atterrissage propose d''emporter une copie des versets et peut répéter le nom de la personne qui la recevra.'
    vignettes:
      shore: 'Le voyageur écrit que le rivage semble sombre. Vous demandez ce qui les a poussés à lever les yeux du bateau. Ils font une pause, puis écrivent une chose qui était réellement là.'
      delivery: 'Vous entendez que le prochain bateau ne va qu''à mi-chemin vers la ville de l''ami. Le voyageur plie presque le billet sans deuxième nom dessus. Vous les aidez à trouver quelqu’un qui peut aller de l’avant.'
      damp: 'Le voyageur place la note à l''endroit où le spray a atteint le tableau. Vous déposez un morceau sec en dessous pendant qu''ils finissent d''écrire le message de salutation.'
  vesalius_padua:
    name: 'Les deux versions de la planche'
    place: 'Ratisbonne'
    figure: 'André Vésale'
    story: 'Dans une lettre écrite à Ratisbonne en 1546, Vésale critiquait une édition qui copiait et réduisait ses illustrations. Il s''est opposé aux distorsions de certaines figures copiées.'
    story_prose:
      opening:
        - 'Ratisbonne, juin 1546. Vésale écrit à un collègue au sujet d''un autre livre qui copiait ses illustrations. Il s''oppose à la réduction d''échelle et remet en question le tracé de certaines de ses lignes.'
        - 'Dans l’histoire, sa lettre a conservé ces objections. Une comparaison ultérieure a révélé que toutes les objections ne correspondaient pas à une différence substantielle. Dans ce magasin, un libraire a encore une pile d''exemplaires à envoyer.'
        - 'Quelqu''un capable de reconnaître les deux éditions peut vous aider. Il faudra également quelqu''un qui puisse persuader le libraire de mettre la même note dans chaque exemplaire avant sa livraison.'
      points:
        p1: '{staff} présente les deux éditions sur le comptoir, marquant l''endroit où un chiffre est simplement plus petit et l''endroit où Vésale a soulevé une objection spécifique. Le libraire demande quelles affirmations peuvent être faites en toute confiance. Ils suppriment ce qui n''a pas été vérifié, laissant les numéros de page que le lecteur peut consulter. Le libraire ouvre l''exemplaire du dessus et glisse la note à côté de l''assiette. Lorsque le livre se ferme, une fine bordure blanche apparaît encore.'
      outcomes:
        all: 'Une fois les livres sortis, un lecteur emprunte l’autre édition en utilisant les numéros de page indiqués sur le bordereau. Les deux personnages sont posés sur la table, avec le même stylo dessus.'
        p1: 'Une fois les livres sortis, un lecteur emprunte l’autre édition en utilisant les numéros de page indiqués sur le bordereau. Les deux personnages sont posés sur la table, avec le même stylo dessus.'
      none: 'Le libraire noue le dernier paquet. Le bordereau à moitié rédigé est toujours sous le comptoir.'
      not_admitted: '{staff} ne voit jamais le libraire. Un échantillon est ouvert sur une assiette, retourné brièvement par un client passant devant le comptoir.'
      excerpts:
        p1: 'Le libraire ouvre l''exemplaire du dessus et glisse la note à côté de l''assiette. Lorsque le livre se ferme, une fine bordure blanche apparaît encore.'
    relic: 'Une preuve à deux points'
    relic_desc: 'Un tirage imaginé avec des marques distinctes pour les deux éditions.'
    points:
      p1: 'Demandez au libraire d''inclure une note identifiant les planches litigieuses avec les exemplaires encore en stock'
    points_fail:
      p1: 'L''employé n''est pas parvenu à un accord avec le distributeur et les exemplaires ont été distribués sans cette feuille.'
    shift:
      p1:
        was: '13 juin 1546 : Vésale écrit depuis Ratisbonne et critique ce qu''il considère comme des distorsions dans les figures copiées.'
        now: '{staff} demande au distributeur de joindre une feuille identifiant les plaques litigieuses et dirigeant les lecteurs vers les originaux.'
        who: 'vesalius_padua'
        bio: 'Les lecteurs de l''édition copiée ont reçu une note identifiant les chiffres contestés par Vésale.'
  shakespeare_globe:
    name: 'Un message pour son père'
    place: 'Stratford-upon-Avon'
    figure: 'William Shakespeare'
    story: 'Le registre de Stratford enregistre l’enterrement de Hamnet Shakespeare le 11 août 1596. Il ne précise pas où se trouvait son père avant l’enterrement. Dans cette branche, un foyer demande de l''aide pour lui faire parvenir un message.'
    story_prose:
      opening:
        - 'Stratford-upon-Avon, août 1596. Le registre paroissial conservera le nom du garçon et la date de son enterrement. Hamnet a onze ans.'
        - 'Dans l’histoire, Hamnet a été enterré le 11 août. Le registre ne donne aucune date pour le retour de son père. Dans cette branche, la famille plie une lettre et espère que quelqu''un la prendra avant la nuit.'
        - 'Quelqu''un qui sait où s''arrêtent les voyageurs pourrait aider ici. Il en va de même pour quelqu''un qui peut persuader un étranger d''aller un peu plus loin avec une lettre.'
      points:
        p1: '{staff} demande deux fois à la porte avant de trouver un messager qui connaît le prochain endroit où s''arrêter. Le messager lit le nom à l''extérieur et le glisse dans une poche intérieure sèche. Hamnet est encore éveillé quand William rentre à la maison. Le garçon s''approche pour faire une petite place à son père au bord du lit.'
      outcomes:
        all: 'William reste assis là jusqu''à ce que la fenêtre s''assombrisse. Lorsqu''il se lève pour aller chercher de l''eau, il rapproche sa chaise pour pouvoir la retrouver en revenant.'
        p1: 'William reste assis là jusqu''à ce que la fenêtre s''assombrisse. Lorsqu''il se lève pour aller chercher de l''eau, il rapproche sa chaise pour pouvoir la retrouver en revenant.'
      none: 'Le crépuscule atteint la porte. La lettre pliée est toujours sous la tasse.'
      not_admitted: '{staff} n’entre jamais dans la maison où ils attendent. Quelqu''un passe la porte. Il ne s''ouvre pas.'
      excerpts:
        p1: 'Hamnet est encore éveillé quand William rentre à la maison. Le garçon s''approche pour faire une petite place à son père au bord du lit.'
    relic: 'Un message plié'
    relic_desc: 'Une lettre imaginée avec un emplacement pour que le porteur puisse ajouter le nom de la prochaine personne qui pourra l''aider.'
    points:
      p1: 'Trouvez quelqu''un qui peut joindre Shakespeare et lui transmettre le message de la famille à temps pour une visite'
    points_fail:
      p1: 'L''employé n''a trouvé personne qui puisse promettre de transmettre le message à temps.'
    shift:
      p1:
        was: '11 août 1596 : Hamnet Shakespeare est enterré à Stratford-upon-Avon. Le registre n''indique pas si son père était avec lui auparavant.'
        now: '{staff} trouve un messager qui peut joindre Shakespeare. Dans cette succursale, il rentre à temps pour passer une soirée avec son fils.'
        who: 'shakespeare_globe'
        bio: 'William Shakespeare a pu passer une soirée avec Hamnet peu avant la mort de son fils.'
  timbuktu_sankore:
    name: 'Une place dans la caravane qui s’en va'
    place: 'Tombouctou, Mali'
    figure: 'Les savants de Tombouctou'
    story: 'Après que Tombouctou ait changé de mains vers 1468, les érudits ont quitté la ville pour se rendre notamment à Walata. Dans cette branche, un ménage a besoin d''un logement avec un groupe prévoyant de partir ensemble.'
    story_prose:
      opening:
        - 'Vers 1468, Tombouctou change de mains. Un chroniqueur ultérieur s''est souvenu de familles érudites quittant la ville, certaines se rendant à Walata.'
        - 'Dans l''histoire, la chronique a enregistré les groupes au départ. Dans cette branche, un ménage est déjà en train de faire ses valises, mais plusieurs sacs d''eau doivent encore être marqués. Ils ne savent pas quel parti attendra.'
        - 'Quelqu''un qui comprend comment est organisé un groupe de voyage peut vous aider. Il leur faudra découvrir qui est encore attendu, et faire la première ligne droite en famille.'
      points:
        p1: '{staff} passe d''une fête à l''autre jusqu''à ce qu''un guide accepte d''attendre, puis revient aider la maisonnée à compter l''eau et les ballots. Au premier arrêt, une autre famille déroule un tapis. Le plus petit enfant apporte la plus petite outre de la maison et la place entre les deux tapis. L’outre tient debout quand l’enfant la lâche.'
      outcomes:
        all: 'Le lendemain matin, les deux nattes côte à côte sont enroulées. Le petit sac est passé en premier, puis quelqu''un soulève l''enfant.'
        p1: 'Le lendemain matin, les deux nattes côte à côte sont enroulées. Le petit sac est passé en premier, puis quelqu''un soulève l''enfant.'
      none: 'Au moment où quelqu''un revient pour demander, le dernier groupe est parti. La maison ramène ses paquets attachés par la porte.'
      not_admitted: '{staff} ne trouve pas le ménage. Près d’une porte, quelqu’un rapproche deux sacs d’eau.'
      excerpts:
        p1: 'Le plus petit enfant apporte la plus petite outre de la maison et la place entre les deux tapis. L’outre tient debout quand l’enfant la lâche.'
    relic: 'Une fiche de comptage des outres'
    relic_desc: 'Un décompte imaginaire permet de compter les outres confiées au foyer.'
    points:
      p1: 'Trouvez une place pour un ménage avec une caravane en partance et accompagnez-la jusqu''à son premier arrêt sûr.'
    points_fail:
      p1: 'Le groupe est parti avant que l''employé puisse trouver une place pour le ménage.'
    shift:
      p1:
        was: 'Vers 1468 : après le changement de mains de Tombouctou, les savants s''enfuient. Certains sont allés à Walata.'
        now: '{staff} aide un ménage à rejoindre un groupe en route vers Walata et l''accompagne jusqu''au premier arrêt sûr.'
        who: 'timbuktu_sankore'
        bio: 'Un ménage quittant Tombouctou a trouvé un groupe avec lequel voyager et a atteint son premier arrêt en toute sécurité.'
  al_haytham_cairo:
    name: 'Une pièce sur l’autre rive'
    place: 'Fustat'
    figure: 'Ibn al-Haytham'
    story: 'Fustat a subi des incendies lors des troubles de 1020. Les travaux optiques d''Ibn al-Haytham appartenaient à ses années en Égypte. Dans cette succursale, il rencontre un lecteur qui possède un manuscrit optique emprunté dans l''une des rues concernées.'
    story_prose:
      opening:
        - 'Fustat, 1020. Les chroniques décrivent des incendies qui ravagent les maisons et les biens. Durant ses années en Égypte, Ibn al-Haytham a étudié comment la lumière atteint l''œil.'
        - 'Dans l’histoire, des maisons ont été détruites dans les incendies. Les sources ne placent pas Ibn al-Haytham dans une rue particulière. Dans cette succursale, un lecteur avec qui il envisage de parcourir quelques pages habite dans l''une des rues concernées.'
        - 'Quelqu’un qui sait rester lucide et donner des indications peut vous aider. Le manuscrit pourra être lu ultérieurement. Vérifiez d’abord si le lecteur peut aller jusqu’au bout de la rue.'
      points:
        p1: 'Lorsque {staff} trouve le lecteur, la lumière s''est déjà éteinte derrière sa porte. Il veut revenir en arrière pour une autre page. {staff} lui demande de sortir la pile qu''il possède et de repartir par le chemin dégagé par les voisins. Dans une maison qui peut l''héberger, il est assis avec la pile inégale sur les genoux. Un feuillet glisse par terre. La personne en face le ramasse et le remet à l’endroit qu’il indique.'
      outcomes:
        all: 'Ibn al-Haytham vient le voir plus tard. La maison n''a qu''un seul tabouret, alors les deux s''assoient près d''une table basse et cherchent à nouveau la page.'
        p1: 'Ibn al-Haytham vient le voir plus tard. La maison n''a qu''un seul tabouret, alors les deux s''assoient près d''une table basse et cherchent à nouveau la page.'
      none: 'La rue finit par fermer. Lorsqu’Ibn al-Haytham le demande, tout ce qu’il peut faire est de mettre dans sa main le bordereau attestant le prêt.'
      not_admitted: '{staff} attend au fond de la rue que quelqu''un lui montre le chemin. Une voix appelle à fermer une porte et ne peut bientôt plus être entendue clairement.'
      excerpts:
        p1: 'Un feuillet glisse par terre. La personne en face le ramasse et le remet à l’endroit qu’il indique.'
    relic: 'Un jeu de feuillets de réserve'
    relic_desc: 'Un jeu fictif de notes d’optique confié à un autre foyer dans cette version des événements.'
    points:
      p1: 'Sortez le lecteur avant que le feu n''atteigne la rue et trouvez un endroit sûr pour le manuscrit emprunté.'
    points_fail:
      p1: 'L''employé n''est pas parvenu à joindre le lecteur à temps pour l''aider à repartir avec les pages empruntées.'
    shift:
      p1:
        was: "1020\_: certaines parties de Fustat ont été incendiées lors des troubles. Le récit ne précise pas où se trouvaient Ibn al-Haytham ou ses manuscrits ce jour-là."
        now: '{staff} emmène le lecteur dans un foyer situé en dehors des rues concernées. Ibn al-Haytham peut reprendre la lecture du manuscrit avec le lecteur.'
        who: 'al_haytham_cairo'
        bio: 'Lors des incendies de Fustat, un lecteur et les pages qui lui étaient confiées se sont mis en sécurité.'
  li_bai_changan:
    name: 'Des nouvelles au bord du fleuve'
    place: 'Wushan, sur le Yangzi'
    figure: 'Li Bai'
    story: 'Li Bai a été condamné à l''exil à Yelang et a été gracié en chemin. Un récit dans ses œuvres rassemblées associe le pardon à Wushan. Le jour exact où il a entendu est incertain.'
    story_prose:
      opening:
        - 'Un débarquement près de Wushan, vers 759. Li Bai remonte le fleuve vers l''exil à Yelang. Un récit de son voyage associera plus tard ce tronçon de rivière à son pardon.'
        - 'Dans l''histoire, la grâce est intervenue avant qu''il n''atteigne Yelang. Le jour de son audition n''a pas été établi. Dans cette branche, un voyageur a apporté une copie écrite de la nouvelle alors que le bateau suivant en amont est encore en train de charger.'
        - 'Ce voyage a besoin de quelqu''un qui connaît les bateaux et leurs escales. Quelqu''un doit découvrir qui a vu l''original et où il a été copié avant de remettre la nouvelle entre les mains de Li Bai.'
      points:
        p1: 'Après avoir interrogé le messager qui lui a remis la copie, {staff} trouve un passager qui connaît la main de cette personne et attend que les comptes s''accordent avant de se précipiter vers le palier avec la page. Li Bai le déplie et lit deux fois la dernière ligne. Alors que l''équipage appelle les passagers, il enroule la literie déjà dans le bateau en amont et la remet à un batelier faisant route dans l''autre sens.'
      outcomes:
        all: 'Alors que le bateau en aval passe devant le débarcadère, Li Bai plie à nouveau la copie. Sa manche est encore mouillée. Il recouvre le pli avec le côté sec.'
        p1: 'Alors que le bateau en aval passe devant le débarcadère, Li Bai plie à nouveau la copie. Sa manche est encore mouillée. Il recouvre le pli avec le côté sec.'
      none: 'Le bateau en amont est déjà bien loin lorsque quelqu''un apporte la nouvelle à son poste d''amarrage. Un bout de corde de paille égaré se trouve à côté du poteau d''amarrage.'
      not_admitted: 'Le {staff} n''atteint jamais le bateau. Les auvents sont suffisamment rapprochés pour entendre les gens qui s''y entasse.'
      excerpts:
        p1: 'Li Bai le déplie et lit deux fois la dernière ligne. Alors que l''équipage appelle les passagers, il enroule la literie déjà dans le bateau en amont et la remet à un batelier faisant route dans l''autre sens.'
    relic: 'Une enveloppe restée sèche'
    relic_desc: 'Un emballage imaginaire qu''un passager d''un bateau pourrait garder au sec sur la rivière.'
    points:
      p1: 'Obtenez la nouvelle confirmée de la grâce accordée à Li Bai avant que son bateau ne continue en amont'
    points_fail:
      p1: 'L''employé n''a pas réussi à apporter la nouvelle avant le départ du bateau.'
    shift:
      p1:
        was: 'Vers 759 : Li Bai est gracié alors qu''il se rendait à Yelang. Une postface à ses œuvres rassemblées le place près de Wushan à l''époque.'
        now: '{staff} apporte la nouvelle à l''atterrissage avant le prochain départ. Li Bai fait demi-tour avec le bateau du matin en aval.'
        who: 'li_bai_changan'
        bio: 'Li Bai a entendu parler de sa grâce avant le départ de son prochain bateau et a pu rebrousser chemin plus tôt.'
  li_shizhen_qizhou:
    name: 'Une épreuve qu’il peut encore lire'
    place: 'Qizhou'
    figure: 'Li Shizhen'
    story: 'Li Shizhen a révisé le Compendium de la matière médicale pendant de nombreuses années. L''édition Jinling parut après sa mort. Dans cette branche, un imprimeur peut lui envoyer une seule page d''essai.'
    story_prose:
      opening:
        - 'Qizhou, vers 1592. Li Shizhen a passé des années à réviser le Compendium de la matière médicale. Le livre qu''il peut ouvrir et encore modifier lui-même est son manuscrit.'
        - 'Dans l''histoire, l''édition complète de Jinling est apparue après sa mort. Dans cette branche, un imprimeur a rayé une page d''essai. Reste à savoir si elle pourra atteindre Qizhou depuis Jinling.'
        - 'Quelqu''un qui connaît l''impression ou l''épreuvage peut vous aider ici. Chaque extrémité doit savoir qui lira la feuille et qui la rapportera une fois marquée.'
      points:
        p1: '{staff} s''engage avec l''imprimeur à n''envoyer qu''une seule feuille, la confie à un voyageur qui fait le trajet entre les deux lieux et fait en sorte qu''elle soit récupérée au retour. Li étale côte à côte l''épreuve et le manuscrit et pose un ongle à côté de la ligne qu''il souhaite. Il écrit un caractère dans la marge et attend qu''il sèche avant de plier les deux feuilles séparément.'
      outcomes:
        all: 'Le voyageur revient le lendemain. Li tend la feuille sèche, son doigt toujours posé sur le caractère qu''il a corrigé.'
        p1: 'Le voyageur revient le lendemain. Li tend la feuille sèche, son doigt toujours posé sur le caractère qu''il a corrigé.'
      none: 'Aucune preuve ne vient. Li change le caractère de son manuscrit et éloigne l''encre du bord du papier.'
      not_admitted: '{staff} ne rencontre jamais personne pouvant en porter la preuve. Des liasses de papier franchissent la porte du magasin, chacune portant une adresse différente.'
      excerpts:
        p1: 'Li étale côte à côte l''épreuve et le manuscrit et pose un ongle à côté de la ligne qu''il souhaite. Il écrit un caractère dans la marge et attend qu''il sèche avant de plier les deux feuilles séparément.'
    relic: 'Une épreuve d’imprimerie'
    relic_desc: 'Une épreuve fictive où l’auteur peut encore inscrire ses corrections.'
    points:
      p1: 'Demandez à l''imprimeur d''envoyer une page d''essai à Qizhou pendant que Li Shizhen peut toujours la vérifier'
    points_fail:
      p1: 'L''employé n''a pas fait en sorte qu''une preuve lui parvienne à temps.'
    shift:
      p1:
        was: "En 1596\_: l’édition Jinling parut après la mort de Li Shizhen. Il n’a pas vécu jusqu’à voir le livre complet imprimé."
        now: '{staff} sécurise une page d''essai. Li Shizhen le lit à sa table et le renvoie avec une correction en marge.'
        who: 'li_shizhen_qizhou'
        bio: 'Li Shizhen a vu et marqué une épreuve imprimée de son livre avant la parution de l''édition complète.'
  bose_calcutta:
    name: 'Le chèque qu’il refusait d’encaisser'
    place: 'Calcutta'
    figure: 'Jagadish Chandra Bose'
    story: 'En 1885, Bose commença à enseigner la physique au Presidency College. Son salaire était inférieur à celui offert à ses collègues européens. Il a continué à enseigner et a refusé le salaire inférieur pendant le conflit.'
    story_prose:
      opening:
        - 'Calcutta, 1885. Bose enseigne la physique au Presidency College. Le collège lui offre moins que ses collègues européens faisant le même travail. Il continue d''enseigner.'
        - 'Dans l’histoire, environ trois ans se sont écoulés avant que le différend ne soit résolu. Dans cette agence, le premier montant n''a pas encore été encaissé et il est encore temps pour le bureau d''émettre un autre chèque.'
        - 'Quelqu''un qui sait lire les conditions de salaire sera utile ici. Il faut également quelqu''un qui puisse convaincre la personne responsable de la signature d''entendre comment les deux missions d''enseignement se comparent.'
      points:
        p1: '{staff} met une semaine de cours et les deux ensembles de conditions salariales sur une seule page, puis attend avec Bose au bureau pendant qu''un grand livre est rédigé. Une fois les nouveaux termes rédigés, Bose suit le numéro avec le doigt. Le chèque revient sur le bureau. Cette fois, il le prend à deux mains.'
      outcomes:
        all: 'Lorsque Bose revient en classe, la démonstration n''a pas encore été présentée. Il met le chèque dans sa poche et libère d''abord un espace pour les élèves.'
        p1: 'Lorsque Bose revient en classe, la démonstration n''a pas encore été présentée. Il met le chèque dans sa poche et libère d''abord un espace pour les élèves.'
      none: 'Le bureau envoie à nouveau le montant initial. Bose le regarde et repousse le papier sur le comptoir.'
      not_admitted: '{staff} ne pénètre jamais dans la pièce où les conditions sont signées. Un cours se termine à l’autre bout du hall et les planches grincent sous les pas.'
      excerpts:
        p1: 'Le chèque revient sur le bureau. Cette fois, il le prend à deux mains.'
    relic: 'Un reçu de salaire'
    relic_desc: 'Un reçu imaginaire pour le premier chèque qu''il a accepté de prendre dans cette version des événements.'
    points:
      p1: 'Obtenez une offre écrite d''égalité de rémunération à Bose au cours de sa première année d''enseignement'
    points_fail:
      p1: 'L''employé n''a pas obtenu des conditions d''égalité au cours de cette première année et Bose a continué de refuser le salaire inférieur.'
    shift:
      p1:
        was: '1885 : Bose commence à enseigner au Presidency College. Il a refusé le salaire inférieur et le conflit a mis environ trois ans à être résolu.'
        now: '{staff} obtient une offre écrite aux mêmes conditions que ses collègues. Bose le lit et accepte le premier chèque émis selon ces conditions.'
        who: 'bose_calcutta'
        bio: 'Bose a obtenu des conditions égales au cours de sa première année au Presidency College.'
  li_qingzhao_hangzhou:
    name: 'Confier ce coffre au voisinage'
    place: 'Kuaiji'
    figure: 'Li Qingzhao'
    story: 'Li Qingzhao a écrit que ses livres et ses images avaient déjà subi des pertes répétées lorsqu''elle résidait à Kuaiji. Elle y décrit un vol et la récupération de dix-huit rouleaux.'
    story_prose:
      opening:
        - 'Au moment où Li Qingzhao loge à Kuaiji, elle a déjà perdu plusieurs fois des livres et des photos. En écrivant sa postface au Record of Metal and Stone, elle pouvait encore expliquer une grande partie de ce qui avait disparu au cours de cette partie du voyage.'
        - 'Dans l''histoire, un vol à Kuaiji lui a coûté une plus grande partie de la collection. Elle a récupéré dix-huit rouleaux. Dans cette branche, les coffres sont toujours dans la pièce. On se tient assez près du lit pour qu''elle puisse l''atteindre sans se lever.'
        - 'Quelqu’un qui sait comment entretenir les livres et les images peut vous aider. Si les voisins hésitent, il faut de la patience pour se mettre d’accord sur l’emplacement d’un coffre et à quelle porte elle doit frapper lorsqu’elle veut le récupérer.'
      points:
        p1: 'Li Qingzhao ouvre le coffre près du lit, en sort deux parchemins et en rend un. {staff} demande au voisin de regarder le coffre et sa serrure, puis lui fait faire chacun une marque sur le même décompte. Avant de procéder, Li glisse une petite brosse dans l''espace sous le couvercle. Le voisin prend le poids par en bas ; elle prend l''autre bout et ensemble ils franchissent le seuil.'
      outcomes:
        all: 'Lorsqu''elle récupère le coffre, elle cherche d''abord la brosse. Il est toujours près du couvercle. Sur un coin de papier, elle tente un coup. L''encre se répand plus lentement que dans son souvenir.'
        p1: 'Lorsqu''elle récupère le coffre, elle cherche d''abord la brosse. Il est toujours près du couvercle. Sur un coin de papier, elle tente un coup. L''encre se répand plus lentement que dans son souvenir.'
      none: 'Après le vol, elle expose les parchemins qu''elle a pu récupérer. Lorsqu''elle a fini de compter, ses mains viennent se poser sur la partie nue de la table.'
      not_admitted: '{staff} ne rencontre jamais Li Qingzhao. Par la porte, on entend le bruit d''un coffre qu''on ferme.'
      excerpts:
        p1: 'Avant de procéder, Li glisse une petite brosse dans l''espace sous le couvercle. Le voisin prend le poids par en bas ; elle prend l''autre bout et ensemble ils franchissent le seuil.'
    relic: 'Une fiche d’inventaire du coffre'
    relic_desc: 'Une fiche fictive qui énumère le contenu du seul coffre qu’elle a décidé de confier à quelqu’un.'
    points:
      p1: 'Demandez à un voisin de confiance de prendre en charge un coffre choisi par Li Qingzhao avant le vol'
    points_fail:
      p1: 'L''employé n''a trouvé personne capable de prendre en charge le coffre.'
    shift:
      p1:
        was: "Vers 1131\_: Li Qingzhao se souvient d'un vol dans son logement à Kuaiji. Elle a ensuite récupéré dix-huit rouleaux."
        now: '{staff} fait en sorte qu''un coffre de son choix soit conservé dans un autre foyer. Li Qingzhao le récupère plus tard avec son contenu intact.'
        who: 'li_qingzhao_hangzhou'
        bio: 'Li Qingzhao a récupéré un coffre rempli de livres et de photos qu''elle avait laissé aux soins d''un voisin.'
  ibn_al_nafis_cairo:
    name: 'Un volume entre les mains d’un autre lecteur'
    place: 'Le Caire'
    figure: 'Ibn al-Nafis'
    story: 'Ibn al-Nafis a quitté sa bibliothèque pour un hôpital tard dans sa vie. Son projet d''encyclopédie médicale était inachevé et les parties survivantes sont dispersées. Dans cette branche, un deuxième lecteur propose de prendre la responsabilité d''un des volumes terminés.'
    story_prose:
      opening:
        - 'Le Caire, 1288. Tard dans sa vie, Ibn al-Nafis a laissé sa bibliothèque dans un hôpital. Sa grande encyclopédie médicale prévue est restée inachevée et seules certaines parties peuvent encore être lues aujourd''hui.'
        - 'Dans l''histoire, les biographies indiquent où il a quitté sa bibliothèque sans retracer ensuite chaque volume. Dans cette branche, un lecteur qui passe souvent veut terminer le volume qu''il est en train de lire.'
        - 'Quelqu’un qui comprend comment un livre est prêté et rendu peut vous aider. L''accord doit donner aux lecteurs ultérieurs une adresse qu''ils peuvent réellement trouver.'
      points:
        p1: 'Au départ, le lecteur souhaitait obtenir le prêt jusqu''à la fin du mois. {staff} demande aux deux de se mettre d''accord d''abord sur l''endroit où le volume sera conservé et qui ouvrira la porte à un autre lecteur. Ibn al-Nafis retourne la couverture et souligne ce qu''il doit encore vérifier. Le lecteur pose le feuillet sur le livre, un pouce recouvrant à moitié le nom qu''il vient de signer. Il ne le déplace que lorsque l''encre est sèche.'
      outcomes:
        all: 'Plus tard, quelqu''un vient chercher le volume à l''adresse indiquée sur le bordereau. La personne à la porte prend le livre et lui remet le papier du premier feuillet.'
        p1: 'Plus tard, quelqu''un vient chercher le volume à l''adresse indiquée sur le bordereau. La personne à la porte prend le livre et lui remet le papier du premier feuillet.'
      none: 'Personne ne laisse une adresse à laquelle le volume peut rester disponible. Le bordereau reste vierge. Le livre est toujours dans la même pile.'
      not_admitted: 'Le {staff} ne pénètre jamais à l’intérieur. La personne près de la fenêtre tourne une page sans entendre les pas dehors.'
      excerpts:
        p1: 'Le lecteur pose le feuillet sur le livre, un pouce recouvrant à moitié le nom qu''il vient de signer. Il ne le déplace que lorsque l''encre est sèche.'
    relic: 'Un billet de prêt nominatif'
    relic_desc: 'Un bordereau imaginé donnant le nom du lecteur qui a assumé la responsabilité.'
    points:
      p1: 'Demander à Ibn al-Nafis de confier un volume terminé à un deuxième lecteur qui s''engage à le garder accessible'
    points_fail:
      p1: 'L''employé n''a pas trouvé de deuxième lecteur disposé à assumer la responsabilité du volume.'
    shift:
      p1:
        was: '1288 : Ibn al-Nafis meurt et laisse sa bibliothèque à un hôpital. Seules des parties de sa grande encyclopédie médicale survivent aujourd''hui.'
        now: '{staff} désigne un dépositaire pour un volume terminé et dispose du dossier du destinataire où il peut être consulté. Le reste de la bibliothèque suit ses plans originaux.'
        who: 'ibn_al_nafis_cairo'
        bio: 'Un volume de son encyclopédie inachevée est resté accessible dans la succursale par l''intermédiaire d''un deuxième dépositaire.'
  sappho_lesbos:
    name: 'Avant le départ du bateau'
    place: 'Mytilène, Lesbos'
    figure: 'Sappho'
    story: 'Le marbre de Paros enregistre Sappho quittant Mytilène pour la Sicile en exil. Sa date endommagée laisse l''année exacte incertaine. Dans cette branche, une personne qu''elle espérait voir n''a pas entendu quand le navire partait.'
    story_prose:
      opening:
        - 'Le rivage de Mytilène. Des siècles après que Sappho ait navigué vers la Sicile, une pierre sur Paros a enregistré le voyage. L''année sur cette pierre est maintenant endommagée.'
        - 'Dans l’histoire, Sappho a quitté Mytilène en exil pour la Sicile. La raison est inconnue. Dans cette succursale, il y a quelqu''un qu''elle veut voir avant de partir, et les bateliers font déjà passer les bagages à bord.'
        - 'Quelqu''un qui connaît le débarcadère et les rues avoisinantes peut vous aider. Trouver quelqu''un qui n''a pas encore entendu le départ du bateau fera plus que pousser un batelier à se dépêcher.'
      points:
        p1: '{staff} demande où vont les bagages, laisse le paquet de Sappho aux soins d''un batelier et cherche la porte qu''elle a décrite. À leur retour, les personnes qui chargeaient le bateau ont dégagé une partie du rivage. Le visiteur renoue le nœud détaché au poignet de Sappho. Sappho laisse sa main là où elle est jusqu''à ce que le batelier l''appelle.'
      outcomes:
        all: 'Alors que le bateau s''éloigne, Sappho lève la main avec la corde. Le visiteur reste sur la pierre sur laquelle marchent les passagers lorsqu''ils débarquent.'
        p1: 'Alors que le bateau s''éloigne, Sappho lève la main avec la corde. Le visiteur reste sur la pierre sur laquelle marchent les passagers lorsqu''ils débarquent.'
      none: 'Le bateau part le premier. Au moment où le visiteur trouve l’atterrissage, il ne reste plus qu’une longueur de corde mouillée sur la pierre.'
      not_admitted: '{staff} atteint le rivage mais ne trouve personne qui connaisse Sappho. Quelqu’un s’accroupit sur la dernière marche, redressant un morceau de corde.'
      excerpts:
        p1: 'Le visiteur renoue le nœud détaché au poignet de Sappho. Sappho laisse sa main là où elle est jusqu''à ce que le batelier l''appelle.'
    relic: 'Un cordon noué'
    relic_desc: 'Un cordon imaginé porté par quelqu''un qui attend avec elle à l’embarcadère.'
    points:
      p1: 'Amenez une personne que Sappho veut voir à l’embarcadère avant de partir pour la Sicile.'
    points_fail:
      p1: 'Le navire est parti avant que l''employé puisse amener la personne que Sappho avait demandé à voir.'
    shift:
      p1:
        was: "Au tournant des VIIe et VIe siècles avant JC\_: le marbre de Paros enregistre Sappho naviguant de Mytilène vers la Sicile en exil."
        now: '{staff} amène la personne demandée par Sappho à l’embarcadère. Les deux passent du temps ensemble avant que Sappho ne monte à bord.'
        who: 'sappho_lesbos'
        bio: 'Sappho a eu le temps de lui dire au revoir en personne avant de quitter Mytilène pour la Sicile.'
  hipparchus_rhodes:
    name: 'Une nuit pour vérifier le poème'
    place: 'Rhodes'
    figure: 'Hipparque'
    story: 'Le commentaire survivant d’Hipparque identifie des erreurs dans un poème largement lu sur le ciel. Dans cette branche, un lecteur est sur le point d’utiliser le poème pour dire aux autres quelles étoiles s’élèvent ensemble.'
    story_prose:
      opening:
        - 'Rhodes, fin du IIe siècle avant JC. Les gens utilisent un poème pour se rappeler quelles étoiles se lèvent ensemble. Dans le commentaire qui a survécu, Hipparque vérifie les affirmations comme celles-ci une par une.'
        - 'Dans l’histoire, le commentaire montre les endroits où les lignes familières ne correspondent pas à ce que l’on pouvait voir. Dans cette branche, un lecteur a déjà enseigné une de ces lignes et veut l''enseigner à nouveau de la même manière.'
        - 'Quelqu’un qui puisse suivre les affirmations du livre est utile. Il faudra également quelqu’un qui puisse persuader un lecteur qui a déjà donné la leçon d’attendre dehors un peu plus longtemps.'
      points:
        p1: '{staff} demande au lecteur de prononcer la ligne qu''il entend enseigner, puis l''accompagne ainsi qu''Hipparque là où ils peuvent voir bas à l''horizon. Lorsque la première étoile apparaît, le lecteur commence à dire qu''ils sont tous les deux là. Il s''arrête à mi-chemin. L''autre endroit est encore sombre. Il garde un doigt pointé vers elle et ne baisse la main que lorsque la deuxième étoile apparaît.'
      outcomes:
        all: 'La prochaine fois qu''il enseigne, il ferme d''abord le livre et demande aux élèves d''attendre le premier lever. Il quitte la seconde moitié de la ligne familière jusqu''à ce que l''autre lumière apparaisse.'
        p1: 'La prochaine fois qu''il enseigne, il ferme d''abord le livre et demande aux élèves d''attendre le premier lever. Il quitte la seconde moitié de la ligne familière jusqu''à ce que l''autre lumière apparaisse.'
      none: 'Le lecteur récite l’ancienne phrase comme avant. La porte est déjà fermée lorsque la deuxième étoile apparaît bas à l’extérieur.'
      not_admitted: '{staff} ne voit jamais le lecteur. À travers une porte fermée, quelqu’un récite deux fois une phrase.'
      excerpts:
        p1: 'L''autre endroit est encore sombre. Il garde un doigt pointé vers elle et ne baisse la main que lorsque la deuxième étoile apparaît.'
    relic: 'Deux marques à l''horizon'
    relic_desc: 'Une bande d''observation imaginée avec des emplacements pour deux montées distinctes.'
    points:
      p1: 'Persuader le lecteur d''observer pendant une nuit Hipparque avant d''enseigner le soulèvement controversé'
    points_fail:
      p1: 'L’employé n’a pas convaincu le lecteur de comparer le poème au ciel cette nuit-là.'
    shift:
      p1:
        was: "Fin du IIe siècle avant JC\_: le commentaire d’Hipparque souligne que certaines étoiles décrites ensemble dans le poème familier ne se sont pas levées ensemble."
        now: '{staff} ramène le lecteur pour une nuit d''observation. Le lecteur regarde les deux soulèvements séparément et modifie l''enseignement qu''il donne à ses propres élèves.'
        who: 'hipparchus_rhodes'
        bio: 'Un lecteur utilisant le vieux poème a testé une montée contestée et a transmis une version corrigée.'
  eratosthenes_alexandria:
    name: 'Le livre qui mesurait la Terre'
    place: 'Alexandrie'
    figure: 'Ératosthène'
    story: 'Ératosthène de Cyrène devint bibliothécaire à Alexandrie au IIIe siècle avant JC. Son propre livre sur la mesure de la Terre est perdu. Dans le récit ultérieur de Cléomède, le soleil d’été est au-dessus de Syène mais laisse une ombre à Alexandrie. La différence est d''un cinquantième de cercle ; avec 5.000 stades entre les deux lieux, cela fait 250.000 pour la Terre entière.'
    story_prose:
      opening:
        - 'Alexandrie, IIIe siècle avant JC. Ératosthène de Cyrène est devenu chef de la Bibliothèque d''Alexandrie. Il a un surnom, Beta, ce qui signifie que dans tous les domaines d''apprentissage, il est loin d''être premier.'
        - 'Dans l''histoire, selon le récit ultérieur de Cléomède, à midi, le jour de la Saint-Jean, le gnomon à Syène ne projetait aucune ombre, tandis qu''à Alexandrie le soleil se trouvait à un cinquantième d''un cercle complet du zénith ; les deux villes étant distantes de cinq mille stades, le cercle entier s''élevait à deux cent cinquante mille. Le livre dans lequel Ératosthène exposait sa propre méthode, Sur la mesure de la Terre, a été perdu, et Cléomède lui-même dit que la méthode originale était plus complexe que son récit. Dans cette succursale, un concierge de la bibliothèque qui ne sait pas lire connaît chaque étiquette, et un copiste trouve rapidement un surnom.'
        - 'Deux types de personnes peuvent aider dans ce voyage : quelqu''un qui sait copier, vérifier et tenir des livres, ou quelqu''un de curieux et de studieux qui sait parcourir une page de chiffres.'
      outcomes:
        all: 'Les lecteurs ultérieurs suivirent les étapes qu''il avait écrites de sa propre main et réinstallèrent un gnomon à midi le jour de la Saint-Jean. Le rouleau était ouvert à côté, ses bords maintenus par des cailloux.'
        p1: 'Les lecteurs ultérieurs suivirent les étapes qu''il avait écrites de sa propre main et réinstallèrent un gnomon à midi le jour de la Saint-Jean. Le rouleau était ouvert à côté, ses bords maintenus par des cailloux.'
      none: 'Le livre ne possédait encore que quelques exemplaires anciens, et ils vieillissaient un à un. A midi, en plein été, le gnomon d''Alexandrie projetait encore sa courte ombre.'
      not_admitted: '{staff} n’a jamais franchi la porte de la bibliothèque. A midi, en plein été, les gnomons de la ville projetaient encore leurs courtes ombres.'
      points:
        p1:
          class_lettered: '{staff} a suivi les règles d''un comptable et a fait plusieurs copies de Sur la mesure de la Terre, et après chacune d''elles, il a vérifié les longueurs d''ombre, les angles et les distances ligne par ligne par rapport à l''original, pas un chiffre égaré. Un exemplaire fut déposé sur une étagère de la bibliothèque, attaché avec une petite étiquette en bois que le portier connaîtrait ; un autre a été enveloppé dans une toile cirée et laissé sur un bateau en partance pour une autre ville. Ératosthène se tenait devant l’étagère et redressait l’étiquette d’un doigt.'
          else: '{staff} a d''abord appliqué la méthode du livre depuis le début jusqu''à ce que chaque étape soit claire, puis a fait plusieurs copies de Sur la mesure de la Terre et a vérifié les chiffres ligne par ligne par rapport à l''original. Un exemplaire fut déposé sur une étagère de la bibliothèque, attaché avec une petite étiquette en bois que le portier connaîtrait ; un autre a été enveloppé dans une toile cirée et laissé sur un bateau en partance pour une autre ville. Ératosthène se tenait devant l’étagère et redressait l’étiquette d’un doigt.'
      excerpts:
        p1: 'Un exemplaire fut déposé sur une étagère de la bibliothèque, attaché avec une petite étiquette en bois que le portier connaîtrait ; un autre a été enveloppé dans une toile cirée et laissé sur un bateau en partance pour une autre ville. Ératosthène se tenait devant l’étagère et redressait l’étiquette d’un doigt.'
    relic: 'Une tige de gnomon'
    relic_desc: 'Une simple tige verticale dont l''ombre lui indiquait l''angle du soleil.'
    points:
      p1: 'Aidez-le à faire copier Sur la mesure de la Terre pour la bibliothèque et au-delà, afin que son propre récit de la méthode ne soit pas perdu.'
    points_fail:
      p1: 'Le livre est resté dans les exemplaires dont il disposait déjà. Dans cette branche, il a tout de même été perdu, et les lecteurs ultérieurs n''ont connu sa méthode que grâce au récit simplifié de Cléomède.'
    shift:
      p1:
        was: "Au troisième siècle avant JC, Ératosthène expose ses mesures dans Sur la mesure de la Terre\_; le livre a ensuite été perdu et la méthode survit principalement dans le récit simplifié de Cléomède, qui dit que l'original était plus complexe."
        now: '{staff} l''a aidé à faire copier le livre plusieurs fois. Dans cette chronologie, son propre récit est parvenu aux lecteurs ultérieurs parallèlement au récit.'
        who: 'eratosthenes_alexandria'
        bio: 'Dans cette ligne, le livre dans lequel Eratosthène mesurait la Terre n''a pas été perdu, et les lecteurs ultérieurs ont pu vérifier sa méthode avec ses propres mots.'
    vignettes:
      noon: 'À midi, au milieu de l''été, {staff} s''accroupit près d''une tige verticale et gratte le bout de son ombre dans le sol avec un ongle. Un peu plus tard, l''ombre s''est éloignée d''une largeur d''un doigt.'
      beta: '{staff} entend les copistes de la Bibliothèque appeler dans son dos le bibliothécaire Beta, deuxième en tout. {staff} sait que ce que les siècles suivants retiendront de lui, c''est tout le tour de la Terre qu''il a mesuré, et garde un visage impassible.'
      shelves: '{staff} aide un porteur de la bibliothèque à transporter les rouleaux jusqu''aux étagères en paquets, chacun attaché avec une petite étiquette en bois. Le porteur dit que même un homme qui ne sait pas lire peut distinguer les marques sur les étiquettes.'
  fibonacci_pisa:
    name: 'La première version de 1202'
    place: 'Pise'
    figure: 'Fibonacci'
    story: 'Léonard de Pise a appris à compter avec les neuf personnages indiens dès son enfance à Bugia, sur la côte d''Afrique du Nord, où son père travaillait pour les marchands de Pise. En 1202, de retour à Pise, il termine le Liber abaci, qui enseigne les nouveaux chiffres et le zéro pour compter et commercer. En 1228, il révisa le livre et les exemplaires qui subsistent proviennent de cette deuxième version.'
    story_prose:
      opening:
        - 'Pise, 1202. Enfant, Léonard se rendit à Bugia, sur la côte nord-africaine, où son père travaillait pour les marchands de Pise, et y apprit à compter avec les neuf personnages indiens. De retour à Pise, il a écrit le Liber Abaci, qui apprend aux gens à écrire des nombres avec ces chiffres et le zéro et à les utiliser pour acheter et vendre.'
        - 'En histoire, en 1228, il révisa le livre, ajoutant du nouveau matériel et supprimant ce qu''il jugeait superflu ; chaque copie parvenue aux lecteurs ultérieurs remonte à cette version, et aucune copie complète de la première version de 1202 n''est connue. Dans cette branche, un apprenti dans un comptoir sur le quai ne voit pas pourquoi un petit cercle devrait tenir une colonne, et un batelier sur l''Arno appelle un numéro pour chaque balle qui débarque.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît les livres et sait comment un jeu d'exemplaires est conservé, quelqu'un qui enseigne et peut discuter avec un auteur, ou quelqu'un de studieux qui peut dire clairement en quoi un texte ancien et un texte ultérieur diffèrent."
      outcomes:
        all: 'Plus de vingt ans plus tard, la version révisée était copiée dans les librairies de Pise. Le coffre en bois était toujours là, et le premier texte et le nouveau étaient ouverts côte à côte, les lecteurs les comparant page par page pour les exemples ajoutés plus tard.'
        p1: 'Plus de vingt ans plus tard, la version révisée était copiée dans les librairies de Pise. Le coffre en bois était toujours là, et le premier texte et le nouveau étaient ouverts côte à côte, les lecteurs les comparant page par page pour les exemples ajoutés plus tard.'
      none: 'Après 1228, les librairies de Pise ne copiaient que la version révisée. Dans la maison de comptage, l''apprenti apprenait en écrivant un zéro, trait par trait, dans la colonne vide.'
      not_admitted: '{staff} n’a jamais franchi la porte de Leonardo. Près de l''Arno, le batelier déchargeait encore des bottes et, sur la rive, quelqu''un tirait un coup après l''autre sur une planche.'
      points:
        p1:
          class_lettered: '{staff} a suivi les règles d''un gardien de livres, a disposé les volumes de la première version sur la table et les a numérotés un par un, et a dit à Leonardo que réviser plus tard était une bonne chose, mais que si cet ensemble n''était pas conservé, personne ne saurait jamais comment il l''avait écrit pour la première fois. Léonard feuilleta longuement les volumes, prit une plume et, à la fin de chacun, écrivit son nom et l''année de fin. Il attendit que l''encre sèche, déposa les volumes un à un dans un coffre en bois et ferma le fermoir.'
          else: '{staff} a copié quelques exemples travaillés de la première version sur une tablette de cire, les a placés à côté de la nouvelle façon dont il dictait et lui a demandé où les gens devraient regarder dans les années suivantes s''ils voulaient voir comment il avait d''abord fait les calculs. Léonard feuilleta longuement les volumes, prit une plume et, à la fin de chacun, écrivit son nom et l''année de fin. Il attendit que l''encre sèche, déposa les volumes un à un dans un coffre en bois et ferma le fermoir.'
      excerpts:
        p1: 'Léonard feuilleta longuement les volumes, prit une plume et, à la fin de chacun, écrivit son nom et l''année de fin. Il attendit que l''encre sèche, déposa les volumes un à un dans un coffre en bois et ferma le fermoir.'
    relic: 'Une tablette de cire couverte de chiffres'
    relic_desc: 'Une tablette avec les dix nouveaux chiffres disposés à côté des anciens chiffres romains.'
    points:
      p1: 'Persuader Léonard de signer et de laisser une copie complète de la première version de 1202 à Pise, afin que la révision ultérieure ne la remplace pas'
    points_fail:
      p1: 'Une fois l’ouvrage révisé par l’auteur, l’emprunteur ne connaît que le nouvel exemplaire et ne peut pas récupérer la première compilation.'
    shift:
      p1:
        was: '1202 : Léonard de Pise achève la première version du Liber abaci ; aucune copie complète n''en a survécu, et les manuscrits qui en sont parvenus reflètent la révision de 1228.'
        now: 'Le premier ensemble conserve sa date et ses exemples. Les lecteurs ultérieurs pourront mettre les deux compilations côte à côte et identifier les travaux nouvellement ajoutés.'
        who: 'fibonacci_pisa'
        bio: 'La première version de 1202 du livre de Léonard de Pise a survécu dans une copie complète à côté de la révision de 1228, afin que les lecteurs ultérieurs puissent voir ce qu''il a changé au cours de ces années.'
    vignettes:
      rabbits: 'Dans une copie {staff} se pose le problème d''un couple de lapins qui donnent naissance à un nouveau couple chaque mois. {staff} ne peut s''empêcher de compter dans la marge jusqu''au douzième mois, et les chiffres ressortent exactement comme dans les manuels scolaires des siècles suivants.'
      zero: 'Dans un comptoir sur le quai, {staff} montre à un apprenti comment écrire une place vide comme zéro. Le garçon dit que la petite bague n''est rien du tout et n''a pas droit à une colonne à elle seule. {staff} lui demande de vérifier deux registres l''un par rapport à l''autre, et le garçon se tait.'
      quay: '{staff} aide à décharger les balles d''un bateau sur l''Arno et interpelle chacune d''entre elles lorsqu''elle débarque. A la banque, un employé écoute et marque une marque sur son tableau à chaque appel.'
  dante_ravenna:
    name: 'Un poème dans la langue de la rue'
    place: 'Ravenne'
    figure: 'Dante Alighieri'
    story: 'Exilé de Florence en 1302, Dante Alighieri s''installe à Ravenne vers 1318 et y termine le Paradiso, la dernière partie de la Comédie, écrite dans le toscan du langage courant. Vers 1319, Giovanni del Virgilio, un érudit de Bologne, lui envoya un poème latin l''exhortant à écrire en latin et à venir à Bologne pour le laurier, et Dante répondit en vers latins. Le 20 janvier 1320, il donne une conférence à Vérone. En septembre 1321, de retour d''une ambassade à Venise, il tomba malade et mourut à Ravenne.'
    story_prose:
      opening:
        - 'Ravenne, début 1320. Dante est exilé de Florence depuis dix-huit ans, et la sentence de 1302 dit qu''il sera mis à mort s''il revient. À l''invitation du seigneur de Ravenne, Guido Novello da Polenta, il vit ici et écrit la dernière partie de la Divine Comédie, le Paradiso, dans le quotidien toscan de la rue.'
        - 'En histoire, Giovanni del Virgilio, qui enseignait à Bologne, lui envoya un poème latin l''incitant à écrire en latin et à venir à Bologne pour le laurier, et Dante répondit par une églogue latine. En septembre 1321, de retour d''une ambassade à Venise, il tomba malade et mourut à Ravenne, sans jamais revenir à Florence. Dans cette succursale, un vendeur d''encre de la ville considère les copistes comme ses meilleurs clients, et un ramasseur de bois se rend dans la forêt de pins au bord de la mer.'
        - 'Deux types de personnes peuvent aider lors de ce voyage : quelqu''un qui connaît les papiers et peut dire quelle pile doit être envoyée et laquelle garder, et quelqu''un qui connaît la poésie et les livres et peut s''asseoir à côté de lui et dire quelques mots vrais.'
      outcomes:
        all: 'Les poèmes latins allaient et venaient l''année suivante, chacun scellé avec de la cire. En septembre 1321, à son retour de Venise, il tomba malade et, dans la pile du Paradis près de son lit, le dernier feuillet fut écrit jusqu''au bout.'
        p2: 'Il vécut à Ravenne plus d''un an de plus. En septembre 1321, à son retour de Venise, il tomba malade et, dans la pile du Paradis près de son lit, le dernier feuillet fut écrit jusqu''au bout.'
        p1: 'Les poèmes latins allaient et venaient l''année suivante. Chaque réponse était pliée seule, avec une petite goutte de cire.'
      none: 'La lettre de Bologne était toujours sur le bureau. Dans la forêt de pins près de Ravenne, le vent marin soufflait en rafales.'
      desync: 'La réponse latine accompagnait la copie du Paradiso et était expédiée parmi les feuilles volantes, et Bologne ne recevait que quelques pages de toscan. {staff} a été rappelé par le bureau avant qu''une réponse ne soit reçue.'
      not_admitted: '{staff} n''a jamais franchi la porte de la salle de photocopie et a passé quelques jours à ramasser du bois dans la pinède à l''extérieur de la ville. Les deux piles de papier gisaient toujours sur le bureau de Dante.'
      points:
        p1:
          class_lettered: '{staff} a suivi les règles d''un gardien de papier et a séparé les deux piles dans la salle de copie : le Paradiso en toscan est resté sur le bureau, et la réponse latine pour Bologne a été mise de côté et pliée toute seule. Dante laissa tomber de la cire sur le pli et l''aplatit avec une phalange. Le messager le glissa dans son manteau et sortit de la porte de la ville dans le vent froid de janvier, sur la route de Bologne.'
          else: '{staff}, prudent de nature, parcourut la salle de copie pile par pile, choisit la réponse latine pour Bologne dans les feuilles volantes du Paradiso et la plia toute seule. Dante laissa tomber de la cire sur le pli et l''aplatit avec une phalange. Le messager le glissa dans son manteau et sortit de la porte de la ville dans le vent froid de janvier, sur la route de Bologne.'
        p2: 'Un après-midi de mars, Dante lut {staff} les lignes qu''il venait de terminer. {staff} les répétait après lui ligne par ligne, et seulement à la fin disait ce qui avait été longtemps retenu : les gens continueraient à lire ces vers pendant des siècles, dans ce langage de la rue, et un jour Florence voudrait le ramener à la maison. Dante posa sa plume sur le bord de l''encrier et regarda la feuille. Après un long moment, il le replongea et se remit à écrire.'
      excerpts:
        p2: 'Dante posa sa plume sur le bord de l''encrier et regarda la feuille. Après un long moment, il le replongea et se remit à écrire.'
        p1: 'Dante laissa tomber de la cire sur le pli et l''aplatit avec une phalange. Le messager le glissa dans son manteau et sortit de la porte de la ville dans le vent froid de janvier, sur la route de Bologne.'
    relic: 'Une feuille de laurier'
    relic_desc: 'Une feuille séchée de la couronne du poète.'
    points:
      p1: 'Prévoyez du temps pour que Dante envoie sa réponse latine à Giovanni depuis Ravenne. Gardez-le à l''écart des pages Paradiso en cours de copie'
      p2: 'Faites savoir à Dante en exil que la Comédie sera lue pendant des générations et que Florence voudra un jour son retour.'
    points_fail:
      p1: 'Le destinataire reçoit des pages narratives en vrac. La réponse reste parmi les brouillons et le bureau rappelle le salarié.'
      p2: 'Il continue d''écrire à Ravenne sans réponse à son espoir de rentrer chez lui. Dans cette branche, personne ne lui dit ce qui s''est passé ensuite.'
    shift:
      p1:
        was: 'À la fin de 1319 ou au début de 1320, alors qu''il écrivait le Paradiso à Ravenne, Dante échangea des vers latins avec Giovanni del Virgilio à Bologne.'
      p2:
        was: 'En septembre 1321, Dante mourut à Ravenne sans jamais retourner à Florence ; vers 1519, Florence demanda sa dépouille et les frères de Ravenne cachèrent ses os dans un mur.'
        now: '{staff} lui a fait savoir à Ravenne que la Comédie aurait toujours des lecteurs et que sa ville voudrait un jour le ramener chez elle.'
        who: 'dante_ravenna'
        bio: 'Au cours de ses dernières années à Ravenne, Dante en exil comprit que son poème durerait et que Florence serait un jour fière de lui.'
    vignettes:
      latin: 'Dans la salle de copie, {staff} voit deux piles de papier : le Paradiso en toscan et le vers latin à destination de Bologne, dont l''expéditeur dit que seul le latin est digne du laurier. {staff} sait sur quelle pile tout le monde lira sept cents ans et avale les mots.'
      pinewood: '{staff} suit les ramasseurs de bois dans la forêt de pins au bord de la mer à l''extérieur de Ravenne, se repose sur le sol sablonneux et entend les vagues au-delà des arbres.'
      ink: '{staff} aide un vendeur d''encre à transporter ses pots d''un bateau. L''encre est bouillie à partir de galles de chêne et de fer rouillé, et le vendeur affirme que ce sont les copistes de la ville qui en achètent la plus grande partie.'
  copernicus_frombork:
    name: 'Le Soleil au centre'
    place: 'Frombork, Pologne'
    figure: 'Nicolas Copernic'
    story: 'En 1539, le jeune mathématicien Rheticus vint à Frombork et pressa Nicolas Copernic de publier son livre. En 1543, De revolutionibus, dans lequel la Terre tourne et tourne autour du Soleil, fut imprimé à Nuremberg, avec une adresse non signée au lecteur au recto. Copernic était malade depuis la fin de 1542 et mourut à Frombork le 24 mai 1543. Son ami Tiedemann Giese écrivit plus tard que le livre imprimé ne lui parvint que le jour de sa mort.'
    story_prose:
      opening:
        - 'Frombork, Pologne, printemps 1543. Nicolas Copernic est malade depuis la fin de l''année dernière. Le livre sur lequel il travaille depuis des décennies, Sur les révolutions, est en cours d''impression à Nuremberg ; la terre y tourne sur son axe et tourne autour du soleil. Il y a quatre ans, le jeune mathématicien Rheticus est venu de Wittenberg et l''a exhorté à le faire imprimer.'
        - 'Dans l''histoire, le livre est sorti des presses à Nuremberg avec une adresse non signée au lecteur au recto. Son ami Tiedemann Giese écrivit plus tard que le livre imprimé ne lui parvint que le jour de sa mort ; le 24 mai, il mourut à Frombork. En juillet, Giese demanda à Rheticus de transmettre une lettre demandant une édition corrigée au conseil municipal de Nuremberg. Dans cette branche, un pêcheur du village au pied de la colline répare des filets, et un domestique de la maison porte chaque jour de l''eau jusqu''à la chambre du malade.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage : quelqu'un qui connaît les soins infirmiers et peut garder un lit de malade, ou quelqu'un qui est assez fort sur la route pour porter un livre sur un long chemin ; quelqu'un qui connaît les papiers et sait distinguer un autographe d'une copie\_; et quelqu'un d'assez prudent pour faire une feuille d'errata."
      outcomes:
        all: 'Le livre sorti début mai est ensuite resté près de son lit. Cet été-là, les exemplaires prêtés à proximité portaient chacun une feuille d’errata, et le manuscrit autographe, enveloppé dans du tissu et enfermé dans le placard, passa plus tard entre les mains de Giese.'
        p3: 'Le livre est ensuite resté près de son lit, page de titre en haut. Quelques semaines plus tard, il mourut à Frombork.'
        p2: 'Cet été-là, les exemplaires prêtés à proximité portaient chacun une feuille d''errata dont les coins se recourbaient à force d''être tournés. Les réponses des imprimeurs d''ailleurs ont ensuite été conservées dans le même fichier.'
        p1: 'Le manuscrit autographe, enveloppé dans du tissu, passa plus tard entre les mains de Giese, et de lui à Rheticus. Des siècles plus tard, il se trouvait à la bibliothèque Jagellonne de Cracovie.'
      none: 'Vers le 24 mai, les livres imprimés arrivèrent à Frombork. La fenêtre de la chambre du malade était entrouverte, et le domestique avec l''eau resta un moment à la porte sans entrer.'
      desync: 'Les papiers du bureau étaient confus, les deux piles de papiers de travail arrivaient avec la copie destinée à l''imprimeur, et personne ne pouvait dire où se trouvait l''autographe. {staff} a été rappelé par le bureau avant l''arrivée de Giese.'
      not_admitted: '{staff} n''a jamais gravi la colline jusqu''à la maison et a passé quelques jours à réparer des filets dans le village de pêcheurs en contrebas. Sur la colline, une fenêtre restait éclairée la nuit.'
      points:
        p1:
          class_lettered: 'Fin mai, les papiers du bureau voisin de la chambre du malade s''entassaient en désordre. {staff} a suivi la méthode d''un archiviste, a compté le manuscrit autographe et les deux piles de papiers de travail page par page, les a inscrits séparément dans un grand livre, a enveloppé l''autographe dans un tissu et l''a enfermé seul dans une armoire. Le reçu était écrit, intitulé «Pour Tiedemann Giese», plié en deux et lesté de la clé du placard au coin du bureau. A côté, le domestique entra doucement dans la chambre du malade avec l''eau et en ressortit.'
          else: 'Fin mai, les papiers du bureau voisin de la chambre du malade s''entassaient en désordre. {staff} est resté assis dans le bureau plusieurs nuits de suite, a compté le manuscrit autographe et les deux piles de papiers de travail page par page, les a notés séparément, a enveloppé l''autographe dans un tissu et l''a enfermé seul dans une armoire. Le reçu était écrit, intitulé «Pour Tiedemann Giese», plié en deux et lesté de la clé du placard au coin du bureau. A côté, le domestique entra doucement dans la chambre du malade avec l''eau et en ressortit.'
        p2: 'Fin juillet, Giese écrivit à Rheticus pour lui demander de transmettre une lettre demandant une édition corrigée au conseil municipal de Nuremberg, et aucune réponse ne parviendrait avant un certain temps. {staff} a parcouru le livre page par page par rapport au manuscrit comme le ferait un relecteur, et a créé une feuille d''errata montrant sur quelle page se trouvait la propre préface de l''auteur et que l''adresse Au lecteur au début ne figurait pas dans le manuscrit. La feuille fut copiée plusieurs fois et glissée dans les exemplaires déjà prêtés à proximité. Celui qui a ouvert la couverture a vu cette feuille en premier.'
        p3:
          class_medical: 'Au début du mois de mai, Copernic gisait sur son lit de malade à Frombork, de moins en moins éveillé. {staff} a gardé le chevet comme l''exigeaient les soins infirmiers, lui a donné de l''eau à temps, l''a retourné, a empêché le feu dans la pièce de s''éteindre et a attendu le livre de Nuremberg. Lorsque le livre arriva dans son lit, il était réveillé. Il l''ouvrit sur la couverture, promena lentement son doigt le long du titre de la première page et le laissa longtemps reposer sur son propre nom.'
          class_travel: 'Au début du mois de mai, Copernic gisait sur son lit de malade à Frombork, de moins en moins éveillé. {staff} est allé vers le sud sur la route, a rencontré le chariot de Nuremberg à mi-chemin, a enveloppé un exemplaire imprimé dans un manteau et l''a ramené à Frombork en voyageant jour et nuit. Lorsque le livre arriva dans son lit, il était réveillé. Il l''ouvrit sur la couverture, promena lentement son doigt le long du titre de la première page et le laissa longtemps reposer sur son propre nom.'
          else: 'Au début du mois de mai, Copernic gisait sur son lit de malade à Frombork, de moins en moins éveillé. {staff} a attendu à l''extérieur de la chambre du malade pendant des jours et, lorsque les livres sont arrivés, il en a sorti un avant même que la balle ne soit déballée et l''a transporté à l''étage à deux mains. Lorsque le livre arriva dans son lit, il était réveillé. Il l''ouvrit sur la couverture, promena lentement son doigt le long du titre de la première page et le laissa longtemps reposer sur son propre nom.'
      excerpts:
        p3: 'Lorsque le livre arriva dans son lit, il était réveillé. Il l''ouvrit sur la couverture, promena lentement son doigt le long du titre de la première page et le laissa longtemps reposer sur son propre nom.'
        p1: 'Le reçu était écrit, intitulé «Pour Tiedemann Giese», plié en deux et lesté de la clé du placard au coin du bureau. A côté, le domestique entra doucement dans la chambre du malade avec l''eau et en ressortit.'
        p2: 'La feuille fut copiée plusieurs fois et glissée dans les exemplaires déjà prêtés à proximité. Celui qui a ouvert la couverture a vu cette feuille en premier.'
    relic: 'Un quadrant en laiton'
    relic_desc: 'Un quart de cercle pour mesurer la hauteur des étoiles.'
    points:
      p1: 'Pendant que Frombork peut encore inventorier les papiers, répertoriez l''autographe de De revolutionibus en dehors des feuilles de travail et laissez à Giese un reçu pour la remise.'
      p2: 'Pendant que Giese écrit pour demander une édition corrigée, glissez une feuille d''errata dans chaque exemplaire prêté à proximité, en indiquant à quelle page se trouve la propre préface de l''auteur et que l''adresse Au lecteur au début ne figure pas dans son manuscrit.'
      p3: 'Apportez-lui le De revolutionibus imprimé pendant qu''il a encore l''esprit clair, afin qu''il sache que le livre est imprimé.'
    points_fail:
      p1: 'Deux liasses du bureau sont confondues avec la copie déjà envoyée à l''imprimeur. L''original n''arrive jamais à Giese et le bureau rappelle l''employé.'
      p2: 'Giese ne peut qu''attendre l''imprimeur et le conseil au loin, et les lecteurs à proximité rencontrent toujours l''adresse Au lecteur en premier lorsqu''ils ouvrent le livre.'
      p3: 'Le livre imprimé ne lui parvint que le 24 mai, jour de sa mort.'
    shift:
      p1:
        was: 'En 1543, l''édition de Nuremberg fut imprimée à partir d''un exemplaire. L’autographe de Copernic a survécu séparément et a ensuite été transmis par Tiedemann Giese à Rheticus.'
      p2:
        was: 'En juillet 1543, Giese demanda à Rheticus d''envoyer une lettre au conseil de Nuremberg demandant une édition révisée. Le texte non signé circulait déjà dans la première édition de 1543.'
        now: 'Les exemplaires envoyés à proximité comportent une fiche de correction. Le lecteur suivant peut l’utiliser pour vérifier l’autographe, et la réponse éventuelle de l’imprimeur est classée dans le même dossier.'
      p3:
        was: 'Le 24 mai 1543, Copernic mourut à Frombork. Giese écrivit plus tard que le livre terminé ne lui parvint que le jour de sa mort.'
        now: 'Au début du mois de mai, le livre imprimé était à son chevet et il le tenait dans ses mains alors qu''il avait encore l''esprit clair. Quelques semaines plus tard, il mourut à Frombork.'
        who: 'copernicus_frombork'
        bio: 'Copernic a reçu le De revolutionibus imprimé quelques semaines avant sa mort et savait que le livre sur lequel il avait travaillé pendant des décennies était imprimé.'
    vignettes:
      preface: '{staff} ouvre une copie imprimée. L''adresse non signée au recto indique que le récit du livre n''est qu''une supposition pratique pour faire des comptes. {staff} sait qu''il faudra une cinquantaine d''années avant que Kepler ne révèle qui l''a écrit, et ferme le livre avec un doigt toujours sur cette page.'
      window: 'Le {staff} maintient l''eau chaude à l''extérieur de la chambre de maladie. Les gens à l''intérieur disent que le vieil homme ne connaît presque personne maintenant, alors {staff} ouvre un peu la fenêtre pour laisser entrer l''air printanier.'
      nets: '{staff} aide les pêcheurs au pied de la colline à réparer leurs filets avec la lagune de la Vistule en vue. Un pêcheur raconte qu''en haut de la colline se trouve un vieux chanoine qui observe les étoiles la nuit.'
  smith_kirkcaldy:
    name: 'Un livre confié à d’autres'
    place: 'Kirkcaldy, Écosse'
    figure: 'Adam Smith'
    story: 'En mars 1776, La richesse des nations d''Adam Smith parut à Londres. Le 25 août, son ami David Hume décède à Édimbourg. Hume avait d''abord demandé à Smith de faire imprimer ses Dialogues concernant la religion naturelle ; Smith a fait des difficultés et Hume a laissé l''ouvrage à l''imprimeur William Strahan, lui demandant de le publier dans un délai de deux ans. En novembre de cette année-là, de retour à Kirkcaldy, Smith écrivit à Strahan un récit des derniers mois de Hume. Strahan a finalement refusé et les Dialogues ont été publiés en 1779 par l''intermédiaire du neveu de Hume.'
    story_prose:
      opening:
        - 'Kirkcaldy, Écosse, fin de l''automne 1776. Adam Smith est de retour dans sa ville natale. En mars, sa Richesse des nations est sortie à Londres, son premier chapitre commençant par la fabrication d''épinglettes. En août, son ami David Hume est décédé à Édimbourg.'
        - 'Dans l''histoire, Hume a nommé Smith dans son testament en janvier pour s''occuper de ses papiers, et lui a d''abord demandé de faire imprimer les Dialogues concernant la religion naturelle ; Smith ne voulait pas. Un codicille du 7 août confia l’ouvrage à l’imprimeur William Strahan, lui demandant de le publier dans les deux ans suivant la mort de Hume. En novembre, Smith écrivit à Strahan un récit des derniers mois de Hume depuis Kirkcaldy, et les Dialogues restèrent là où ils étaient jusqu''à ce que le neveu de Hume les publie sans nom en 1779. Dans cette succursale, un cloueur paie chez le boulanger avec une poignée de clous, et une femme ramasse des moules sur le sable à marée basse.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît les livres et l'imprimerie, ou qui connaît les journaux et peut exprimer clairement son dernier souhait\_; quelqu'un dont la parole a du poids et qui peut parler à une personne."
      outcomes:
        p1: 'Moins de deux ans après la mort de Hume, la boutique de Strahan avait mis en caractères les Dialogues concernant la religion naturelle. Les premières feuilles pendaient sur le cordage, l''encre n''était pas encore sèche.'
      none: 'Cet hiver-là, le manuscrit se trouvait toujours chez Strahan. Sur le sable de Kirkcaldy, la femme qui ramassait des moules rentrait chez elle avec son panier, et de l''autre côté de l''eau, la fumée d''Edimbourg restait basse.'
      not_admitted: '{staff} n''a jamais franchi la porte de cette maison et a passé quelques jours à porter des paniers pour la femme qui ramassait des moules sur le sable. De l’autre côté de l’eau, la fumée d’Édimbourg restait basse tout le temps.'
      points:
        p1:
          class_lettered: 'Le 9 novembre, Smith était assis à son bureau à Kirkcaldy et écrivait à Strahan, racontant les derniers mois de Hume. {staff}, alors qu''un commis copie un acte, a écrit mot pour mot la ligne du codicille du 7 août, publié dans les deux ans suivant sa mort, et en dessous combien de feuilles et combien de mois prendrait un petit in-8, et a posé le papier à côté de sa lettre. Smith regarda longuement le papier, le plia et le mit avec la lettre à Strahan. Une fois scellée, elle était plus épaisse que les autres lettres sur le bureau.'
          else: 'Le 9 novembre, Smith était assis à son bureau à Kirkcaldy et écrivait à Strahan, racontant les derniers mois de Hume. {staff} est resté assis à son bureau tout l''après-midi, a écrit la ligne du codicille du 7 août sur une feuille de papier, dans un délai de deux ans, pour que Strahan l''imprime, et la lui a transmise. Smith regarda longuement le papier, le plia et le mit avec la lettre à Strahan. Une fois scellée, elle était plus épaisse que les autres lettres sur le bureau.'
      excerpts:
        p1: 'Smith regarda longuement le papier, le plia et le mit avec la lettre à Strahan. Une fois scellée, elle était plus épaisse que les autres lettres sur le bureau.'
    relic: 'Une épingle de la manufacture'
    relic_desc: 'Le genre d’épingle qu’il utilisait pour montrer ce que la division d’un travail peut faire.'
    points:
      p1: 'Alors que les Dialogues laissés en fiducie par Hume ne sont pas imprimés, demandez à Smith et Strahan de les publier comme Hume l''a demandé.'
    points_fail:
      p1: 'Comme dans l''histoire le livre attend trois ans et sort en 1779 de son neveu sans nom dessus ; dans ce domaine, le souhait de Hume de le faire sortir dans un délai de deux ans n''est pas non plus respecté.'
    shift:
      p1:
        was: '7 août 1776 : dans un codicille, Hume demande à Strahan de publier les Dialogues concernant la religion naturelle dans les deux ans suivant sa mort ; Smith n''a pas voulu l''accepter, Strahan a finalement refusé et le livre est sorti en 1779 par l''intermédiaire du neveu de Hume, sans le nom de l''auteur.'
        now: 'Strahan a imprimé les Dialogues dans les deux ans demandés par Hume.'
        who: 'david_hume'
        bio: 'Deux ans après sa mort, les Dialogues qu''il avait conservés pendant un quart de siècle furent imprimés par Strahan, comme il l''avait demandé dans son dernier codicille.'
    vignettes:
      nails: '{staff} fait la queue chez le boulanger. Le cloueur en avance paie avec une poignée de clous, le boulanger les compte et les prend. Quelques semaines plus tard, {staff} lit dans un gros livre sorti ce printemps qu''il existe un village en Écosse où les ouvriers apportent encore des clous au boulanger au lieu de l''argent, et se moque de la page.'
      post: '{staff} aide le transporteur à immobiliser la poste de Londres. Un paquet est destiné à M. Strahan, l''imprimeur, et est plus épais que le reste ; {staff} le glisse sous les autres pour que la pluie ne l''atteigne pas.'
      firth: '{staff} parcourt le sable à marée basse. De l''autre côté du Firth of Forth, la fumée d''Édimbourg est basse, et la femme qui ramasse des moules à proximité dit que c''est là que vivent les gens intelligents.'
  beethoven_vienna:
    name: 'La Neuvième Symphonie'
    place: 'Vienne'
    figure: 'Ludwig van Beethoven'
    story: 'Au printemps 1824, Beethoven, presque entièrement sourd, prépare un concert de ses nouvelles œuvres à Vienne. Le chœur et l''orchestre répétaient séparément, et il n''y eut que deux répétitions complètes avant la soirée. Le 7 mai 1824, la Neuvième Symphonie fut créée au Théâtre Kärntnertor, sous la direction du maître de chapelle Michael Umlauf et Beethoven sur scène à ses côtés. La répétition du 23 mai dans la grande Redoutensaal a attiré une mince salle et les recettes l''ont déçu.'
    story_prose:
      opening:
        - 'Vienne, printemps 1824. Beethoven est presque entièrement sourd. Il prépare un concert de ses nouvelles œuvres, clôturé par la Neuvième Symphonie. Ce que l''orchestre joue en répétition, quelqu''un doit l''écrire dans un livre de conversation.'
        - 'Dans l''histoire, le chœur et l''orchestre répétaient dans des salles séparées et se réunissaient pour la première fois seulement deux jours avant la première. Après la première le 7 mai, le concert fut repris le 23 dans la grande Redoutensaal, avec de nombreuses places vides, et les recettes le décevèrent. Dans cette branche, des parties pas encore sèches gisent sous des poids sur la table des copistes, et derrière le théâtre une soprano se frotte la gorge et se plaint des notes aiguës du dernier mouvement.'
        - 'Trois types de personnes peuvent aider lors de ce voyage : quelqu''un qui lit une partition et peut tenir le rythme lorsque les deux groupes répètent ensemble pour la première fois, quelqu''un qui peut entendre ce qui ne va pas et l''écrira point par point pour le compositeur, et quelqu''un assez persuasif pour vendre les places avant le départ des habitants.'
      outcomes:
        all: 'Dans la nuit du 23 mai, il y avait encore de nombreuses places vides dans la salle, mais les rangées réservées à l''avant étaient pleines. La liste est désormais restée cachée dans son carnet de conversation.'
        p3: 'Dans la nuit du 23 mai, il y avait encore de nombreuses places vides dans la salle, mais les rangées réservées étaient pleines.'
        p2: 'Le soir de la première, chaque section a joué les entrées marquées telles qu''elles avaient été marquées. Le drap est ensuite resté caché dans son carnet de conversation.'
        p1: 'Le soir du 7 mai, le chœur et l''orchestre sont entrés sur le même rythme. Beethoven se tenait à côté d’Umlauf, dos au public.'
      none: 'Le 23 mai, dans le hall, des rangées de chaises vides s''alignaient parfaitement sous les lampes.'
      desync: 'Lors de la répétition générale du 5 mai, les deux parties ne se sont jamais retrouvées ensemble. Lorsque le {staff} a été rappelé, la première avait lieu dans deux jours et les musiciens de l''orchestre se disputaient encore pour savoir quel rythme jouer.'
      not_admitted: '{staff} n’est jamais entré dans les coulisses du théâtre. Le chœur et l''orchestre répétaient toujours dans leurs salles séparées et la première n''était que dans quelques jours.'
      points:
        p1: 'Le 5 mai, le chœur et l''orchestre se sont rassemblés pour la première fois dans une seule pièce. Dans les premières mesures, chaque équipe arrivait à son propre rythme. {staff} se tenait entre l''orchestre et le chœur et battait la mesure de la partition, battement par battement, pour que les deux puissent le voir. Ils y sont retournés et les deux équipes ont terminé ensemble le dernier temps. Beethoven se tenait dans un coin, incapable d''entendre, et voyait seulement chaque arc et chaque bouche s''arrêter au même moment.'
        p2: 'Le jour de la répétition générale, {staff} a copié sur une feuille les entrées qui avaient mal tourné lors de la répétition générale de la veille, en notant quelle partie, quelle mesure et ce qui n''allait pas, et l''a remis à Beethoven. Il a tenu le papier près de ses yeux pendant un long moment et a fait des marques à plusieurs endroits avec un stylo. Lorsqu''il l''a rendu, il y avait des marques sur des marques.'
        p3: 'Fin mai, les riches familles de la ville commencèrent à envoyer leurs malles à la campagne. {staff} a fait du porte-à-porte avec le programme. Dans une maison, l''intendant n''a ouvert la porte qu''à moitié et a dit que son maître partait après-demain. {staff} déplia le programme, montra la réplique de la Neuvième Symphonie et dit que l''homme qui l''avait écrit n''entendait plus. Le steward a pris le drap à l''intérieur et est revenu avec une note de caution. Ce soir-là, la liste des places réservées fut apportée au logement de Beethoven. Il posa la feuille sous son carnet de conversation et lut les noms un par un, et lorsqu''il atteignit le dernier, il les relut à partir du haut.'
      excerpts:
        p3: 'Ce soir-là, la liste des places réservées fut apportée au logement de Beethoven. Il posa la feuille sous son carnet de conversation et lut les noms un par un, et lorsqu''il atteignit le dernier, il les relut à partir du haut.'
        p2: 'Il a tenu le papier près de ses yeux pendant un long moment et a fait des marques à plusieurs endroits avec un stylo. Lorsqu''il l''a rendu, il y avait des marques sur des marques.'
        p1: 'Ils y sont retournés et les deux équipes ont terminé ensemble le dernier temps. Beethoven se tenait dans un coin, incapable d''entendre, et voyait seulement chaque arc et chaque bouche s''arrêter au même moment.'
