      p2: 'Le tableau va dans le dossier avec la formule décochée. Sephton devra retracer l''erreur plus tard.'
      p3: 'La famille assure la garde du soir sans relève. L’un d’eux ne quitte la pièce que le temps de poser la lampe.'
    shift:
