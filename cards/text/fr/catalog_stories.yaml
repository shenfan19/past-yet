catalog:
  sun_yat_sen_guangzhou:
    name: "De la statue à une nouvelle université"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "Devant la statue de Sun Yat-sen à l’université qui porte son nom, vous êtes ramené à Guangzhou le 4 février 1924. Ce jour-là, il ordonne de réunir trois écoles pour fonder l’Université nationale du Guangdong et charge Zou Lu des préparatifs. Durant ces mêmes mois, il donne le dimanche des conférences dans la salle de l’École normale supérieure. Les notes passent de main en main avant de devenir un livre. Les cours commencent le 19 septembre et l’inauguration a lieu le 11 novembre, avec la devise qu’il a rédigée. Il meurt à Pékin le 12 mars 1925 ; en 1926, l’université prend son nom."
    relic: "La statue de Sun Yat-sen"
    relic_desc: "La statue se trouve sur le campus de l’université Sun Yat-sen. Elle donne accès à Guangzhou en 1924. Ce n’est pas une antiquité et elle ne peut pas être vendue."
    points:
      p1: "Tracer un itinéraire pour afficher les avis d’inscription hors des murs et le remettre aux messagers"
      p2: "Visiter les trois écoles grâce à une recommandation et remettre une synthèse avant la première réunion"
      p3: "Comparer les terrains envisagés et rendre une carte avant le choix de Shipai"
      p4: "Vérifier les listes des diplômés des trois écoles et remettre un registre unique pour le 21 juin"
      p5: "Rejoindre l’équipe à Shipai et planter les bornes du nouveau campus"
    points_fail:
      p1: 'Dans cette branche, l''avis n''est affiché qu''en ville, et les élèves du dehors l''apprennent quand les inscriptions ont déjà commencé.'
      p2: 'La première réunion préparatoire se tient comme dans l''histoire, chaque école ne parle encore que de ses propres soucis, et aucune liste ne les réunit.'
      p3: 'Shipai est choisi comme dans l''histoire, et le bureau n''a aucune feuille où les sites soient dessinés ensemble.'
      p4: 'La remise des diplômes du 21 juin a lieu comme prévu. Le bureau doit consulter les trois listes séparément.'
      p5: 'Le terrain de Shipai n''est délimité que sur le papier, comme dans l''histoire, et pas un piquet n''y est planté.'
    shift:
      p1:
        was: '9 juin 1924 : l''Université nationale du Guangdong confie le recrutement aux bureaux provinciaux de l''éducation, et le 10 juin s''ouvrent les inscriptions à l''examen des classes préparatoires, avec 520 places prévues.'
        now: 'Dans cette branche, l''avis de recrutement est aussi affiché aux carrefours hors de la ville et sur les quais.'
      p2:
        was: '3 mars 1924 : la première réunion préparatoire se tient, et le premier point de son ordre du jour est la fin d''études des élèves des trois écoles.'
        now: 'Dans cette branche, une liste des difficultés des trois écoles est posée sur la table de la réunion.'
      p3:
        was: '1924 : les écoles sont dispersées et difficiles à gérer, Sun Yat-sen charge Zou Lu de choisir un nouveau campus à Shipai, et le terrain est délimité dans l''année.'
        now: 'Dans cette branche, une carte des sites et de Shipai est jointe aux papiers du choix.'
      p4:
        was: '21 juin 1924 : Zou Lu prend ses fonctions de président de l''Université nationale du Guangdong, et la cérémonie de remise des diplômes des trois écoles a lieu le même jour.'
        now: 'Dans cette branche, le bureau dispose d’une seule liste vérifiée pour la cérémonie.'
      p5:
        was: '1924 : Sun Yat-sen fait choisir Shipai par Zou Lu pour le nouveau campus, mais la construction ne commence qu''en 1933 et les premiers collèges n''emménagent qu''à l''automne 1934. Sun meurt le 12 mars 1925 sans l''avoir vu.'
        now: 'Dans cette branche, avant qu''il ne quitte Canton en novembre, les bornes du terrain de Shipai sont déjà plantées, piquet après piquet.'
        who: sun_yat_sen_guangzhou
        bio: 'Dans cette ligne du temps, les bornes du nouveau campus de Shipai sont plantées avant que Sun Yat-sen ne quitte Canton.'
    shift_all: "Les cinq missions sont terminées. Avec le recul, elles font écho aux mots que Sun Yat-sen écrira pour la devise de l’université : étudier largement, s’enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance."
    vignettes:
      slips: "Un employé fictif s’apprête à copier une page dont deux lignes sont couvertes par un billet collé. Vous lui demandez qui a écrit le billet et qui a écrit la page. Il copie d’abord la page, sans déplacer le billet."
      back_row: "Un étudiant fictif ne trouve pas de place et se lève sans cesse pour voir. Vous vous décalez sur le banc. Il écoute la suite en silence et vous salue d’un signe de tête quand la salle se vide."
      hundred: "Au dos de votre carnet, vous comptez les jours par groupes de cinq traits. À cent, un employé fictif vous demande ce que vous comptez. Vous répondez : les jours."
  lalibela_rock:
    name: 'Deux couches sur la paroi'
    place: 'Lalibela, Éthiopie'
    figure: 'L’équipe de dégagement de Lalibela'
    story: 'La première phase de restauration à Lalibela commence le 19 décembre 1966. Le déblaiement des sédiments remet au jour des tranchées creusées dans la roche. Des objets mis au jour lors de la campagne, on n’a conservé que quelques photos et aucun inventaire détaillé.'
    relic: 'Un relevé de la paroi'
    relic_desc: 'Une coupe indique l’épaisseur des couches et la position des tessons.'
    points:
      p1: 'Mesurer les couches avec l’équipe et laisser sur place une copie de la coupe indiquant la position des tessons'
    points_fail:
      p1: 'La terre est évacuée. On ne peut plus mesurer la position d’origine des tessons.'
    shift:
      p1:
        was: 'Quelques photographies subsistent, sans permettre de retrouver la position des objets dans les différentes couches.'
        now: 'Une coupe reste à Lalibela. On peut y retrouver l’épaisseur des couches et la position des tessons.'
    vignettes:
      work: '{staff} voit la bande claire apparaître sous la lame d’une bêche.'
    story_prose:
      opening:
      - 'Lalibela, hiver 1966. Au coude de la tranchée, une bande de terre claire apparaît sous la boue. Des tessons y sont encore pris.'
      - 'Les ouvriers dégagent une tranchée depuis longtemps comblée. Quelques photos des trouvailles ont traversé les années. Elles ne suffisent pas à retrouver leur position.'
      - 'Il reste le temps de mesurer cette paroi avant le prochain panier.'
      points:
        p1: '{staff} demande une pause, mesure les couches et reporte chaque tesson sur le relevé. Un ouvrier recopie les mesures sur la feuille qui restera sur place.'
      outcomes:
        all: 'Des années plus tard, une règle contre la roche retrouve la hauteur de la bande claire.'
        p1: 'Des années plus tard, une règle contre la roche retrouve la hauteur de la bande claire.'
      none: 'La paroi est raclée. La terre rejoint le panier précédent.'
      not_admitted: '{staff} reste au bord de la tranchée. Un ouvrier enroule une corde sur une planche.'
      excerpts:
        p1: '{staff} demande une pause, mesure les couches et reporte chaque tesson sur le relevé. Un ouvrier recopie les mesures sur la feuille qui restera sur place.'
  ife_bronzes:
    name: 'Un plan avant le remblai'
    place: 'Ile-Ife, Nigeria'
    figure: 'L’équipe de fouille d’Ita Yemoo'
    story: 'Les fouilles de sauvetage d’Ita Yemoo, à Ile-Ife, commencent en décembre 1957. L’équipe dégage des pavements en tessons. Le premier grand pavement est couvert par la suite, tandis que la plupart des tranchées sont remblayées. D’autres chercheurs doivent reconstituer leur emplacement à partir de pièces éparses.'
    relic: 'Un plan de fouille avec une ligne de référence'
    relic_desc: 'Une même ligne le long de la route sert à repérer plusieurs tranchées.'
    points:
      p1: 'Raccorder les tranchées à une même ligne avant le remblai et laisser à Ife un plan vérifiable sur le terrain'
    points_fail:
      p1: 'Les tranchées sont comblées. Pour les localiser, il ne reste que des documents épars.'
    shift:
      p1:
        was: 'Les chercheurs ont dû reconstituer l’implantation des tranchées en l’absence d’un plan d’ensemble.'
        now: 'Un plan reprend des points fixes et reste à Ife. On peut retrouver les anciennes tranchées.'
    vignettes:
      work: '{staff} voit défiler les chiffres du ruban taché de terre.'
    story_prose:
      opening:
      - 'Ile-Ife, décembre 1957. Près de la route, l’équipe dégage à la brosse le bord d’un pavement de tessons.'
      - 'Le premier grand pavement sera couvert, mais la plupart des tranchées seront comblées. Plus tard, leur emplacement sera reconstitué à partir de notes et de photos.'
      - 'Tant que les bords sont visibles, l’équipe peut encore les reporter depuis un même repère.'
      points:
        p1: '{staff} et l’équipe tendent un ruban jusqu’à un repère au bord de la route. Chaque coin mesuré est reporté sur un second plan, qui restera à Ife.'
      outcomes:
        all: 'Longtemps après, une personne part du même repère et retrouve l’angle d’une ancienne tranchée.'
        p1: 'Longtemps après, une personne part du même repère et retrouve l’angle d’une ancienne tranchée.'
      none: 'La terre efface le dernier angle. Deux croquis sans repère commun ne se raccordent pas.'
      not_admitted: '{staff} reste derrière la clôture. Un membre de l’équipe rentre le ruban.'
      excerpts:
        p1: '{staff} et l’équipe tendent un ruban jusqu’à un repère au bord de la route. Chaque coin mesuré est reporté sur un second plan, qui restera à Ife.'
  great_zimbabwe:
    name: 'La plateforme de terre au pied du mur'
    place: 'Masvingo, Zimbabwe'
    figure: 'Les ouvriers de l’enceinte occidentale'
    story: 'En 1915, la plupart des plateformes, bancs et murs de terre de l’enceinte occidentale du Grand Zimbabwe sont enlevés. On craint qu’ils fragilisent les murs de pierre sèche. La fosse ainsi ouverte continue de s’éroder.'
    story_prose:
      opening:
        - 'Grand Zimbabwe, 1915. Au pied des murs en pierre sèche de l’enceinte occidentale se trouvent encore des plateformes et des bancs en terre. Ils se trouvent dans la zone à déblayer.'
        - 'Dans l’histoire, la plupart de ces structures ont été enlevées et la fosse a continué de s’éroder. Dans cette branche, quelqu’un peut examiner la jonction avec les ouvriers avant que le chantier y arrive.'
        - 'Il faut savoir lire un mur et expliquer ce qu’on y voit aux personnes qui travaillent sur place. La partie à préserver doit être repérée avant le déblaiement.'
      points:
        p1: '{staff} examine la jonction avec les ouvriers et leur montre un tronçon qu’ils peuvent laisser. Ils déplacent le tracé du chantier. Un ouvrier plante un piquet au-delà de la plateforme. Une ancienne empreinte de doigt touche encore le joint entre les pierres.'
      outcomes:
        all: 'Plus tard, une personne venue faire un relevé pose sa règle sur la plateforme restante. Un bord repose sur la terre, l’autre touche la pierre.'
        p1: 'Plus tard, une personne venue faire un relevé pose sa règle sur la plateforme restante. Un bord repose sur la terre, l’autre touche la pierre.'
      none: 'Les ouvriers emportent un panier vide. La terre mise à nu est encore fraîche. Une ligne pâle marque son ancien contact avec le mur.'
      not_admitted: '{staff} ne trouve pas de place parmi les ouvriers. En passant le croquis de main en main, on n’en voit qu’un coin au pied du mur.'
      excerpts:
        p1: 'Un ouvrier plante un piquet au-delà de la plateforme. Une ancienne empreinte de doigt touche encore le joint entre les pierres.'
    relic: 'Un croquis en coupe'
    relic_desc: 'Le dessin montre une plateforme de terre au pied d’un mur de pierre sèche.'
    points:
      p1: 'Examiner le pied du mur avec les ouvriers et faire laisser une partie de la plateforme en place avant le déblaiement'
    points_fail:
      p1: 'Comme dans l’histoire, l’essentiel de la terre façonnée est enlevé. Ce tronçon disparaît aussi.'
    shift:
      p1:
        was: 'En 1915, le déblaiement de l’enceinte occidentale fait disparaître de nombreuses plateformes, banquettes et parois de terre.'
        now: 'Dans cette branche, une partie de la plateforme demeure en place. Les relevés ultérieurs peuvent rendre compte de sa jonction avec le mur.'
    vignettes:
      lines: '{staff} suit du regard le pied du mur, jusqu’à la jointure où le bord de la plateforme s’abaisse.'
      width: '{staff} tient le croquis. Un trait figure la pierre, un autre la terre.'
      pace: 'Assis près de la marche, {staff} fait tomber de la boue sèche sur le sable.'
  euclid_alexandria:
    name: 'Tant que les Porismes existaient'
    place: 'Alexandrie'
    figure: 'Euclide'
    story: 'Vers 300 avant notre ère, Euclide compose à Alexandrie les treize livres des Éléments. Il démontre les propositions de géométrie une à une à partir de définitions et de postulats. Il écrit aussi les trois livres des Porismes, un traité sur les coniques et d’autres ouvrages qui se perdront. Au IVe siècle, Pappus peut encore décrire les Porismes et en dénombrer les propositions.'
    relic: 'Un compas de bronze'
    relic_desc: 'Deux branches et une articulation suffisent pour tracer toutes les figures du livre.'
    points:
      p1: 'Aider Euclide à faire plusieurs copies des trois livres des Porismes et à les remettre aux élèves pour que l’ouvrage survive'
    points_fail:
      p1: 'Les Porismes n’ont toujours qu’une seule lignée de copies. Ils se perdent aussi dans cette branche, et il ne reste que les quelques lignes de Pappus.'
    shift:
      p1:
        was: 'Vers 300 avant notre ère, Euclide écrit les trois livres des Porismes. L’ouvrage se perd et on n’en connaît plus que le nombre de 171 propositions et la courte description de Pappus, au IVe siècle.'
        now: '{staff} aide Euclide à copier les Porismes à plusieurs reprises et à remettre les copies à ses élèves en géométrie. Dans cette branche, l’ouvrage parvient aux générations suivantes.'
        who: 'euclid_alexandria'
        bio: 'Dans cette branche, les Porismes d’Euclide ont circulé en plusieurs copies. Les lecteurs des générations suivantes ont ainsi pu lire d’autres textes de lui que les Éléments.'
    vignettes:
      lost: 'Sur la table du copiste, {staff} aperçoit un rouleau des Porismes et sait que les lecteurs à venir devront s’en faire une idée à partir de quelques lignes de Pappus. {staff} garde un instant la main sur le bord du rouleau avant de le lâcher.'
      arcs: 'Comme les élèves, {staff} trace des cercles dans le sable avec une cheville et une corde. Les deux arcs se croisent au troisième point. {staff} aplanit le sable et recommence, la main plus sûre cette fois.'
      papyrus: '{staff} aide le marchand de papyrus à monter ses ballots sur le quai et apprend quelles feuilles résistent à l’humidité du port et lesquelles deviennent cassantes au bout d’un an.'
    story_prose:
      opening:
        - 'Alexandrie, vers 300 avant notre ère. Euclide y compose les treize livres des Éléments et démontre les propositions de géométrie une à une à partir de définitions et de postulats. Deux cercles lui suffisent, dès la première proposition, pour construire un triangle équilatéral sur un segment donné. Il écrit aussi les trois livres des Porismes et un traité sur les coniques.'
        - 'Dans l’histoire, les Porismes ont disparu. Vers 320 de notre ère, Pappus peut encore les décrire et y dénombre 171 théorèmes et 38 lemmes. On ne connaît aucune copie ultérieure. Dans cette branche, un élève trace ses figures dans le sable et un marchand de papyrus sur le quai sait quelles feuilles résistent à l’humidité.'
        - 'Il y a du travail pour qui sait copier, collationner et conserver des livres. Il y en a aussi pour qui peut enseigner la géométrie à un groupe d’élèves, ou lire le texte ligne à ligne avec assez de soin et de savoir.'
      outcomes:
        all: 'Chez les lecteurs des générations suivantes, les trois livres des Porismes voisinent avec les Éléments. À force de passer de main en main, les bords des rouleaux se sont assouplis.'
        p1: 'Chez les lecteurs des générations suivantes, les trois livres des Porismes voisinent avec les Éléments. À force de passer de main en main, les bords des rouleaux se sont assouplis.'
      none: 'On aplanit le sable et on y trace de nouveaux cercles. Après Pappus, plus personne ne déroule les trois livres.'
      not_admitted: '{staff} reste dehors, à la porte de la salle où l’on copie les livres. Sur le quai, le marchand de papyrus continue de porter ses ballots à terre.'
      points:
        p1:
          class_teaching: 'En pédagogue, {staff} répartit les trois livres des Porismes entre les élèves les plus attentifs, puis leur fait relire et comparer leurs copies, mot à mot et figure par figure. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
          class_lettered: 'Comme dans un atelier de copie, {staff} taille les feuilles de papyrus, copie les trois livres des Porismes et vérifie le texte et les figures sur les originaux. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
          else: '{staff} suit le travail des copistes. À chaque rouleau achevé des Porismes, la copie et l’original sont étalés côte à côte pour vérifier les figures. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
      excerpts:
        p1: 'On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
  socrates_athens:
    name: 'Avant le retour du navire'
    place: 'Athènes'
    figure: 'Socrate'
    story: 'En 399 avant notre ère, Socrate est jugé à Athènes et condamné à mort. Le navire envoyé chaque année à Délos vient de partir. Aucune exécution ne peut avoir lieu avant son retour, et Socrate attend environ trente jours en prison. Il met des fables d’Ésope en vers et ses amis lui rendent visite chaque jour. Le dernier soir, tous sont là sauf Platon, qui est malade. Socrate boit la ciguë.'
    relic: 'Une coupe en terre cuite du marché'
    relic_desc: 'Une coupe athénienne à glaçure noire, avec un petit éclat sur le bord.'
    points:
      p1: 'Apaiser le tumulte du jury pour que Socrate puisse achever sa défense'
      p2: 'Aider Socrate à mettre en vers les fables d’Ésope, à terminer l’hymne à Apollon et à faire sortir une copie de la prison'
      p3: 'Soigner Platon avant le dernier jour pour qu’il puisse rejoindre son maître en prison'
    points_fail:
      p1: 'Le vacarme couvre la défense, qui s’interrompt. La branche se détache de la trame historique et l’agence rappelle son agent.'
      p2: 'Les vers se perdent dans cette branche comme dans l’histoire.'
      p3: 'Malade ce jour-là, Platon reste absent dans cette branche comme dans l’histoire.'
    shift:
      p1:
        was: '399 avant notre ère : Socrate est jugé à Athènes. Dans l’Apologie de Platon, il demande plusieurs fois aux jurés de l’écouter sans protester. Il est déclaré coupable et condamné à mort.'
      p2:
        was: '399 avant notre ère : en attendant l’exécution, Socrate suit un rêve récurrent et met en vers des fables d’Ésope, puis compose un hymne à Apollon. Rien n’en subsiste en entier.'
        now: 'Un ami emporte hors de la prison une copie des vers sur un rouleau, qui reste ensuite à Athènes.'
      p3:
        was: '399 avant notre ère : le jour où Socrate boit la ciguë, ses amis sont présents, sauf Platon, qui est malade.'
        now: 'Platon se rétablit, rejoint les amis à la prison et reste jusqu’à la fin.'
        who: 'plato_academy'
        bio: 'Dans cette branche, Platon guérit de la maladie qui l’avait retenu et accompagne Socrate en prison le dernier jour.'
    vignettes:
      rumours: 'La veille du procès, {staff} demande à trois marchands de l’agora ce qu’on reproche au vieil homme et reçoit trois réponses différentes. {staff} les note et attend d’entendre laquelle sera lue au tribunal.'
      harbour: 'Chaque soir, {staff} descend au Pirée demander au poissonnier si le navire de Délos est arrivé. La réponse est chaque fois la même, et {staff} ne sait plus s’il faut souhaiter ou craindre son retour.'
      gate: '{staff} porte de l’eau à la vendeuse d’huile et reçoit en échange une place au pied du mur de la prison. Les visiteurs attendent à la porte dès l’aube, et {staff} finit par reconnaître leurs visages.'
    story_prose:
      opening:
        - 'Athènes, 399 avant notre ère. Accusé d’impiété et de corrompre la jeunesse, Socrate doit comparaître devant un jury. Il a passé sa vie à questionner les gens dans les rues et sur l’agora. Il n’a laissé aucun livre et la postérité le connaît par Platon et Xénophon.'
        - 'Dans l’histoire, le navire pour Délos est parti la veille du procès. Aucune exécution ne peut avoir lieu avant son retour, et Socrate passe encore une trentaine de jours en prison. Obéissant à un rêve qui lui revient, il met en vers les fables d’Ésope, mais ces vers se perdent. Le dernier jour, tous ses amis sont là sauf Platon, qui est malade. Dans cette branche, une femme vend de l’huile à lampe près du mur de la prison et un poissonnier du Pirée voit entrer chaque navire.'
        - 'Il faudra quelqu’un qui sache calmer une foule, quelqu’un qui puisse noter des vers et en copier un rouleau, et quelqu’un qui connaisse les remèdes et sache soigner un malade.'
      outcomes:
        all: 'Le navire de Délos est revenu et le poissonnier a aperçu sa voile de loin. Le dernier soir, la prison est pleine d’amis et Platon est assis parmi eux. Plus tard, le rouleau des vers repose au fond d’un coffre dans une maison d’Athènes.'
        p3: 'Le dernier soir, la prison est pleine d’amis. Platon reste assis parmi eux jusqu’à la fin.'
        p2: 'Le rouleau a passé les années au fond d’un coffre, dans une maison d’Athènes. Le bord du papyrus s’effiloche.'
        p1: 'Trente jours plus tard, le navire de Délos entre au Pirée. Le poissonnier aperçoit sa voile de loin. Dès l’aube, des amis attendent devant la porte de la prison.'
      none: 'Le navire de Délos est revenu et le poissonnier a aperçu sa voile de loin. Le soir, les amis s’assoient en cercle dans la prison. Aucun ne prend la parole.'
      desync: 'Le vacarme enfle dans le tribunal et la défense s’interrompt au milieu d’une phrase. L’agence rappelle {staff} avant la sortie du tribunal.'
      not_admitted: '{staff} ne trouve aucune place à Athènes, pas même de quoi s’asseoir au pied du mur de la prison. Le navire de Délos est encore en mer.'
      points:
        p1: 'Le jour du procès, les jurés occupent des rangées de bancs de bois. Des cris couvrent la voix de Socrate toutes les quelques phrases. Chaque fois, {staff} se lève parmi les spectateurs, abaisse lentement les mains sans crier, balaie les rangées du regard et se rassoit quand le bruit retombe. Socrate reprend sa phrase là où elle a été coupée. Une fois son discours terminé, il rassemble les pans de son manteau et s’immobilise sur l’estrade.'
        p2: 'La lumière n’entre que par une petite fenêtre tout en haut du mur. Socrate dicte un vers et {staff} le note sur une tablette de cire, puis le relit en marquant le rythme et lisse la cire pour reprendre les vers qui ont un temps de trop. Les fables d’Ésope prennent forme l’une après l’autre, puis vient l’hymne à Apollon. La nuit, au pied du mur et à la lampe à huile, {staff} recopie les tablettes sur un rouleau de papyrus. Au matin, un ami glisse le rouleau sous son vêtement et quitte la prison, la main pressée contre sa poitrine.'
        p3:
          class_medical: 'La veille du dernier jour, Platon est encore malade, incapable de se lever. {staff} l’examine, prépare le remède, le lui donne aux heures prévues et veille toute la nuit à son chevet. Avant le plein jour, il se redresse et noue ses sandales dans le noir. Il jette son manteau sur ses épaules et sort avec les amis qui se pressent vers la prison, d’un pas plus rapide que le leur.'
          else: 'La veille du dernier jour, Platon est encore malade, incapable de se lever. {staff} ouvre la trousse médicale nanotechnologique, suit les instructions pour le soigner et veille toute la nuit à son chevet. Avant le plein jour, il se redresse et noue ses sandales dans le noir. Il jette son manteau sur ses épaules et sort avec les amis qui se pressent vers la prison, d’un pas plus rapide que le leur.'
      excerpts:
        p3: 'Avant le plein jour, il se redresse et noue ses sandales dans le noir. Il jette son manteau sur ses épaules et sort avec les amis qui se pressent vers la prison, d’un pas plus rapide que le leur.'
        p2: 'La nuit, au pied du mur et à la lampe à huile, {staff} recopie les tablettes sur un rouleau de papyrus. Au matin, un ami glisse le rouleau sous son vêtement et quitte la prison, la main pressée contre sa poitrine.'
        p1: 'Socrate reprend sa phrase là où elle a été coupée. Une fois son discours terminé, il rassemble les pans de son manteau et s’immobilise sur l’estrade.'
  cao_xueqin_beijing:
    name: 'La page blanche après le dernier chapitre'
    place: 'Collines de l’Ouest, Pékin'
    figure: 'Cao Xueqin'
    story: 'Un premier manuscrit de L''Histoire de la pierre atteste que des copies annotées circulaient du vivant de Cao Xueqin. Une note marginale ultérieure de ce manuscrit associe la mort de Cao à un livre laissé inachevé. Le scénario se déroule lors de son dernier hiver sans fixer la date exacte de sa mort ni le nombre de chapitres qu''il a écrit.'
    story_prose:
      opening:
        - 'Il fait nuit tôt dans les collines de l’Ouest. Un copiste arrive avec un paquet de pages et demande ce qu''il peut emporter avec lui. Il dépose le paquet sur la petite table près du lit. Une feuille vierge se trouve dessus.'
        - 'Des exemplaires annotés de L’Histoire de la pierre circulaient déjà du vivant de Cao Xueqin. Une note ajoutée plus tard au manuscrit Jiaxu rappelle qu’il est mort avant d’avoir achevé le livre. Lors de cette visite hivernale imaginaire, il a encore le temps de trier lui-même la pile.'
        - 'Le copiste veut rentrer chez lui avant la nuit. Quelqu''un qui connaît les manuscrits peut extraire la copie annotée des pages de travail. Quelqu’un habitué à prendre soin des autres peut s’occuper du feu et de la lampe. Il y aura alors de la place sur la table pour étaler le projet.'
      points:
        p1: 'Le copiste s’apprête à attacher une pile de pages volantes près du lit. Vous repérez une ligne d''une autre main dans la marge et lui demandez de la lire. Il emballe la copie annotée séparément et remet à portée de main les pages que Cao est encore en train de réviser. Chaque paquet est noué avec sa propre ficelle.'
        p2: 'Alors que les charbons s''éteignent, Cao ferme la page vers laquelle il vient de se tourner. Vous demandez à la personne qui apporte du charbon d''entretenir le feu, de rapprocher la lampe et de passer à Cao la page qu''il lisait. Il tend la main sous la couverture et reprend la ligne. Ce soir-là, la lampe reste à portée de main.'
        p3: 'Vous racontez à Cao que, dans une suite écrite plus tard, la famille retrouve sa prospérité. Il fronce les sourcils, revient aux derniers vers du chant des oiseaux qui se dispersent, au cinquième chapitre, et montre ces mots sur un monde redevenu blanc. Vous ouvrez l’exemplaire annoté et lui demandez si les lecteurs qui voient dans le livre un deuil de la dynastie Ming ont raison. Cao éclate de rire. Il ne répond rien. Quand il reprend son pinceau, il marque seulement les pages sur lesquelles il s’est décidé. Le copiste suit ses marques et laisse le reste en blanc.'
      outcomes:
        all: 'Le copiste repart avec deux feuilles. Lus ensemble, ils montrent quels chapitres Cao avait mis en ordre et quels choix il envisageait encore. Personne n’écrit ce qu’il entendait par rire.'
        p1: 'Le copiste repart avec l’exemplaire annoté. Le brouillon que Cao veut encore relire reste près du lit.'
        p2: 'La lampe brûle un peu plus longtemps près du lit. Cao termine la page qu''il a réservée.'
        p3: 'Les parties marquées sont copiées et les espaces indécis restent vides. Le copiste laisse de côté ses propres suppositions.'
      none: 'Les pages sont empilées comme à leur arrivée. Plus tard, quand quelqu''un pose des questions sur les derniers chapitres, la feuille blanche ne donne aucune réponse.'
      not_admitted: 'Le copiste entre. Vous attendez qu''il ne reste plus qu''une lampe dans la cour, sans apporter les papiers sur la table de nuit.'
      desync: 'La copie annotée remonte aux pages de travail. Le copiste part sans, et le bureau vous rappelle.'
      excerpts:
        p1: 'Chaque paquet est noué avec sa propre ficelle.'
        p2: 'Ce soir-là, la lampe reste à portée de main.'
        p3: 'Le copiste suit ses marques et laisse le reste en blanc.'
    relic: 'Une feuille volante de plans de chapitre'
    relic_desc: 'Un souvenir de jeu avec une proposition d''ordre pour plusieurs chapitres et un espace vide pour ce que Cao n''avait pas encore décidé.'
    points:
      p1: 'Conservez la première copie annotée entre les mains du copiste pendant que les pages de travail de Cao lui sont restituées.'
      p2: 'Veiller au feu et à la copie pour que Cao puisse passer une bonne soirée à réfléchir à la fin.'
      p3: 'Bien que Cao ait encore la force de le réviser, laissez une copie séparée du plan du chapitre qu''il accepte de transmettre.'
    points_fail:
      p1: 'Le seul exemplaire présent à cette table retourne dans la pile des pages de travail. Dans cette branche le lecteur repart sans le texte annoté.'
      p2: 'La pièce se refroidit avant que les feuillets ne soient prêts. Le travail attend un autre soir.'
      p3: 'Le copiste peut arranger les pages volantes, mais n''a aucune trace de la fin que Cao voulait laisser.'
    shift:
      p1:
        was: 'Le manuscrit de Jiaxu conserve des notes sur un texte ancien qui était copié du vivant de Cao Xueqin.'
      p2:
        was: 'Une note marginale dans le manuscrit de Jiaxu rappelle la mort de Cao et indique que le livre est resté inachevé.'
        now: 'Dans cette branche, quelqu''un s''occupe du feu et apporte les pages une à une. Cao a une soirée pour déterminer où il veut que l''histoire aille.'
      p3:
        was: 'La note marginale de Jiaxu qualifie le livre d''inachevé et ne donne aucun plan de chapitre final approuvé par Cao.'
        now: 'Le copiste emporte deux feuilles. On donne l''ordre que Cao a approuvé dans cette branche. L''autre énumère les sorts qu''il n''a pas encore décidé. Lors de la copie suivante, les deux feuilles restent ensemble.'
        who: 'cao_xueqin_beijing'
        bio: 'Avant sa mort, Cao examine un plan de chapitre avec un copiste. Dans cette branche, les lecteurs ultérieurs peuvent voir quelles décisions il a prises et où il a laissé la fin ouverte.'
    vignettes:
      ink: 'Le copiste établit un écart entre l''ordre des chapitres proposé et la supposition écrite au crayon du lecteur. Les pages peuvent désormais être remises aux bons endroits.'
      paper: '{staff} porte dans la lampe. Le copiste éloigne le manuscrit du bord de la table pour faire de la place.'
      empty: 'La dernière feuille peut contenir un autre titre. Le copiste laisse l''espace tel quel.'
  jenner_berkeley:
    name: 'Le premier vaccin'
    place: 'Berkeley, Angleterre'
    figure: 'Edward Jenner'
    story: 'L''enquête de Jenner de 1798 enregistre des observations et des cas antérieurs concernant la variole et la variole.'
    story_prose:
      opening:
        - 'À Berkeley, Sarah Nelmes se présente à la porte, la main enroulée contre son tablier. Jenner veut lui demander quand elle est tombée malade pour la première fois. Le copiste met son nom sous le compte de quelqu’un d’autre. Elle attend près de la porte et demande d''abord si elle doit retourner à la laiterie ce jour-là.'
        - 'L’enquête de Jenner de 1798 enregistre la variole de la vache de Sarah et une vaccination précoce en 1796, traditionnellement associée à James Phipps. Dans cette branche, vous pouvez commencer par prodiguer les soins souhaités à Sarah et contribuer à faire des observations ultérieures traçables jusqu''aux personnes qui sont revenues.'
        - 'Demandez à une personne expérimentée d’entendre Sarah en premier. Un voyageur qui tient des registres peut vérifier les noms et les dates pendant que Jenner et les familles décident de revenir ou non pour une observation plus approfondie.'
      points:
        p1: 'Le copiste attend un rendez-vous. Sarah retire sa main et demande un siège. Vous déplacez une chaise vers la porte et lui demandez si elle souhaite qu''un soignant regarde. Une fois qu''elle dit oui, vous faites savoir à la laiterie qu''elle reviendra plus tard. En sortant, Sarah a encore une main libre pour prendre le billet qui porte son nom.'
        p2: 'Une page du carnet de Jenner décrit la visite de retour du garçon, sans aucune date encore écrite en dessous pour un contrôle. Vous donnez au copiste une nouvelle feuille pour séparer les enregistrements de première main des rapports ultérieurs. Jenner demande qui reviendra pour une observation plus approfondie. Un ménage laisse son adresse. Le copiste inscrit la date et laisse une ligne pour que la famille puisse la vérifier à son arrivée.'
      outcomes:
        all: 'Sarah a quelqu''un pour l''aider et les personnes qui reviennent ont des dossiers qui peuvent être vérifiés. Jenner peut continuer à travailler sur les observations de cette année-là.'
        p1: 'Sarah peut prendre quelques jours avant de retourner à la laiterie. Les enregistrements ultérieurs dépendent toujours du retour d’autres personnes.'
        p2: 'Il y a des observations de suivi à consulter. Sarah doit encore supporter seule sa main douloureuse.'
      none: 'Sarah retourne à la laiterie sans aide et personne n''organise les observations ultérieures.'
      not_admitted: 'Le copiste vérifie avec quelle famille le visiteur est venu. Vous restez dehors et l''espace prévu pour la date est toujours vide.'
      excerpts:
        p1: 'En sortant, Sarah a encore une main libre pour prendre le billet qui porte son nom.'
        p2: 'Le copiste inscrit la date et laisse une ligne pour que la famille puisse la vérifier à son arrivée.'
    relic: 'Un bordereau de suivi'
    relic_desc: 'Une fiche avec un nom, une date et un espace pour écrire ce qui a été observé.'
    points:
      p1: 'Pansez les plaies de la variole de la vache sur la main de Sarah Nelmes pour que la laitière ne les souffre pas seule'
      p2: 'Vérifiez les noms et les dates dans les premières notes de cas et organisez un suivi avec les familles qui acceptent de revenir.'
    points_fail:
      p1: 'Les plaies sur sa main suivaient leur cours sans personne pour les panser. Dans cette branche, personne ne facilitait les journées de la laitière.'
      p2: 'Personne n''organise une nouvelle visite. Dans cette branche, comme dans l''histoire, Jenner reprend ses recherches sur la vaccination en 1798.'
    shift:
      p1:
        was: 'En mai 1796, la laitière Sarah Nelmes attrapa la variole des vaches de son maître et une grande plaie pustuleuse se forma sur sa main avec les symptômes habituels de la maladie.'
        now: '{staff} a gardé sa main propre et liée, et elle était de retour à la laiterie quelques jours plus tôt.'
      p2:
        was: 'Après le premier cas de 1796, Jenner reprit ses recherches sur la vaccination au printemps 1798.'
        now: '{staff} a aidé à organiser des visites de retour avec des familles consentantes. Cet été-là, Jenner avait des notes de suivi pour vérifier les observations précédentes.'
        who: 'jenner_berkeley'
        bio: 'Dans cette chronologie, Jenner reçut des notes de suivi des familles qui avaient accepté de revenir à l''été 1796.'
    vignettes:
      firsthand: 'Un copiste fictif a écrit chaque récit avec la même voix. Vous demandez lequel l’écrivain a réellement vu. Le copiste ajoute une note à côté du reste plutôt que de donner à chaque ligne le même poids.'
      order: 'Deux observations ont échangé leur place dans la copie. Vous vérifiez les dates, et le copiste inverse les bordereaux avant d''utiliser la commande pour raconter une histoire.'
      blank: 'Vous quittez la place sous une note que le copiste ne peut pas confirmer. Au moment où la page est transmise, le blanc porte une étiquette afin que personne ne la prenne pour une omission.'
  mallory_everest:
    name: 'La dernière fois qu’on les a vus'
    place: 'Everest'
    figure: 'George Mallory'
    story: 'Les lettres survivantes de Mallory de l''expédition de 1924 décrivent les conditions et les plans dans différents camps. Le sort de Mallory et Irvine ne permet pas d’établir s’ils ont atteint le sommet.'
    story_prose:
      opening:
        - 'Quelqu''un près d''une tente du Col Nord demande si Norton est capable d''ouvrir les yeux après être descendu. Un autre grimpeur lève les yeux vers Mallory, qui se prépare à passer ensuite. Une boussole dans la tente précédente n''est pas revenue avec lui.'
        - 'Norton et Somervell sont revenus sur l''Everest en 1924. Mallory et Irvine sont allés ensuite. Le 8 juin, Odell a vu deux grimpeurs toujours en train de monter et aucun n''est revenu. Dans cette branche, vous pouvez aider le groupe précédent, rendre la boussole et aider le couple suivant à revenir au col Nord.'
        - 'Envoyez quelqu''un qui puisse s''occuper de Norton et Somervell. Un voyageur familier avec les transferts de camp peut trouver la boussole. Pour la dernière descente, envoyez quelqu''un qui pourra aider le prochain groupe à regagner le camp.'
      points:
        p1: 'Norton appelle de nouveau. Somervell, incapable de répondre, pose une main sur son genou. Vous rappelez quelqu’un qui a pris de l’avance pour lui trouver où s’asseoir. Vous attendez que Somervell puisse dire comment il se sent. Il fait un signe de tête, puis vous déplacez ensemble le sac à ses pieds. En se relevant, il attend que Norton ait fini de lui demander s’il va bien.'
        p2: 'Norton dit que la lumière lui fait mal et ferme à nouveau les yeux. Vous lui demandez de choisir où se reposer et de laisser l''aide-soignante du bureau s''occuper de lui. Après un certain temps, il dit qu''un endroit lui fait encore mal et qu''il peut distinguer un peu de lumière avec l''autre œil. Quand le commis relève la liste, Norton retrouve lui-même la ligne qui le concerne.'
        p3: 'Odell ouvre une valise au Camp V et trouve la petite boîte ronde à côté d''un objet de rechange. Vous le comparez au message de Mallory et l’apportez avec son étiquette. Il l''ouvre devant un autre grimpeur et le glisse dans la poche qu''il compte utiliser pour la montée. Il range lui-même la boussole là où il peut la prendre sans ôter son sac.'
        p4: 'Quelqu''un au Col Nord demande si les deux personnages qui sortent du nuage sont ceux qu''ils attendent. Vous attendez qu''ils donnent leur nom avant de demander au greffier de les inscrire. Mallory pose son sac sur la neige et Irvine s''assoit plus loin à l''intérieur. Ils racontent la descente. Au camp, personne ne sait s’ils ont atteint le sommet, ni à quelle heure.'
      outcomes:
        all: 'Somervell et Norton reviennent et Mallory a sa boussole. Deux autres noms ont été retrouvés au Col Nord.'
        p1: 'Les deux grimpeurs du premier groupe retournent au camp. Le prochain couple aura encore besoin de quelqu’un pour les rencontrer.'
        p2: 'Dans cette branche, Norton voit assez bien pour lire lui-même les écritures voisines. D''autres dénouements suivent le reste du voyage.'
        p3: 'Mallory a la boussole dans une poche qu''il peut atteindre. Son retour laisse incertain leur point le plus éloigné.'
        p4: 'Mallory et Irvine reviennent vivants au col Nord. La descente modifiée laisse ouverte la question de savoir s''ils ont atteint le sommet.'
      none: 'Le vent et la neige atteignent le camp et personne ne change la liste. Odell enregistrera plus tard les deux personnages qu''il a vus pour la dernière fois sur la crête.'
      not_admitted: 'Le gardien du camp n’accordera pas de place sous la tente à un étranger. Vous attendez dehors pendant qu''ils discutent des pièces d''équipement manquantes.'
      desync: 'Somervell ne revient jamais avec Norton. La descente précédente n''est plus synchronisée et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'En se relevant, il attend que Norton ait fini de lui demander s’il va bien.'
        p2: 'Quand le commis relève la liste, Norton retrouve lui-même la ligne qui le concerne.'
        p3: 'Il range lui-même la boussole là où il peut la prendre sans ôter son sac.'
        p4: 'Ils racontent la descente. Au camp, personne ne sait s’ils ont atteint le sommet, ni à quelle heure.'
    relic: 'Un piolet'
    relic_desc: 'Un piolet en bois ordinaire avec une tête usée.'
    points:
      p1: 'Lorsque Somervell s''étouffe dans la descente, aidez-le à reprendre son souffle et voyez la tentative qu''il a faite avec Norton se terminer en toute sécurité.'
      p2: 'Guérissez Norton de sa cécité des neiges'
      p3: 'Mettez entre ses mains la boussole que Mallory a laissée au Camp V'
      p4: 'Faites reculer Mallory et Irvine, ou rencontrez-les en descendant, afin qu''ils atteignent tous les deux vivants le col Nord.'
    points_fail:
      p1: 'Somervell s''assoit dans la neige et ne se relève pas. Un seul des deux grimpeurs revient. Cette branche s''est détachée de l''histoire et le bureau rappelle l''employé.'
      p2: 'Les yeux de Norton lui faisaient trop mal pour s''ouvrir et les jours suivants, il ne vit rien.'
      p3: 'La boussole est toujours dans la tente du Camp V. Lorsque les deux montent le 8 juin, ils ne l''ont pas.'
      p4: 'Le 8 juin, peu après midi, Odell voit pour la dernière fois les deux hommes en haut de la crête, toujours en train de grimper. Ils ne reviennent pas.'
    shift:
      p1:
        was: "Le 4 juin 1924, Norton et Somervell quittèrent le camp VI et atteignirent environ 8\_570 m\_; En chemin, la gorge de Somervell fut bloquée par des tissus gelés et il faillit s'étouffer, cracha, et tous deux atteignirent le camp."
      p2:
        was: 'Dans la nuit du 4 juin 1924, Norton devint gravement aveugle par la neige et pouvait à peine voir après son retour au Col Nord.'
        now: 'Les yeux de Norton s''étaient éclaircis le lendemain et il pouvait voir les gens aller et venir sur le col Nord.'
      p3:
        was: 'Le 7 juin 1924, Mallory envoya une note du Camp VI à Odell disant qu''il avait laissé sa boussole dans la tente du Camp V et qu''ils n''en avaient pas.'
        now: 'Lorsqu''ils partirent tôt le 8 juin, Mallory avait sa boussole dans sa propre poche.'
      p4:
        was: "Le 8 juin 1924, Odell vit pour la dernière fois Mallory et Irvine grimper haut sur la crête nord-est, et aucun d'eux n'en revint ; Le corps de Mallory a été retrouvé en 1999 à environ 8\_160 m d'altitude."
        now: 'Le 9 juin, les deux hommes descendirent au Col Nord, gelés mais vivants. Mallory est rentrée chez elle en Angleterre, auprès de Ruth et de leurs trois enfants. Où ils en sont arrivés ce jour-là, cette chronologie ne répond pas non plus.'
        who: 'mallory_everest'
        bio: 'En 1924, lui et Irvine descendirent vivants de l’Everest. Il rentra chez lui auprès de sa femme Ruth et de leurs trois enfants et vécut encore de nombreuses années.'
    vignettes:
      date: 'Un messager fictif a deux lettres provenant de camps différents mais une date commune sur le bordereau de transport. Vous leur demandez de vérifier les titres séparément. Chaque lettre part avec son propre lieu et sa propre date.'
      question: 'Le messager interprète un départ prévu comme une promesse. Vous vous arrêtez à la phrase où la lettre parle de la météo. Cette fois, ils répètent le plan avec la condition toujours attachée.'
      wrap: 'Vous mettez de côté l''enveloppe sortante pendant que le messager trie les papiers sur ses genoux. Ils peuvent ranger la liste du camp sans la plier dans la lettre.'
  nightingale_scutari:
    name: 'Soigner, observer, compter'
    place: 'Scutari, Empire ottoman'
    figure: 'Florence Nightingale'
    story: 'Le rapport de Florence Nightingale de 1858 sur la santé de l''armée s''inspirait de la récente guerre et incluait des statistiques hospitalières. il ne s''agit pas de la création du rapport final.'
    story_prose:
      opening:
        - 'Un service vient de changer d''équipe à Scutari. Nightingale remet au greffier une liste de transferts et lui demande de la conserver à l''écart des nouvelles admissions. La Commission Sanitaire est arrivée et trois commissaires sont sur le point de commencer à examiner les lieux.'
        - 'La Commission sanitaire inspecta les hôpitaux de Scutari en mars 1855. Hector Gavin mourut dans un accident à Balaklava en avril. Nightingale y est tombé gravement malade en mai et s''est remis de la maladie immédiate, avec une santé médiocre par la suite. Ici, vous pouvez conserver l''inspection et modifier ce qui lui arrive.'
        - 'Une personne familière avec les dossiers du service peut aider l’inspection à avancer. Au camp, demandez à un voyageur de surveiller Gavin. Plus tard, une personne qui prodigue des soins peut demander à Nightingale comment elle souhaite se reposer.'
      points:
        p1: 'Un commis compte une liste de transferts comme de nouvelles admissions. Demandez à l''infirmière de lire les deux feuilles et de marquer les doubles avant que les commissaires n''atteignent la porte. Ils peuvent suivre le rapport jusqu''au service présentant un problème avant de poser des questions sur le prochain endroit. Quelqu’un ressort avec deux registres séparés. Il reste beaucoup de pages blanches dans chacun.'
        p2: 'Gavin est sur le point de remettre le revolver à son frère sous la tente. Vous demandez à tous les deux de faire une pause jusqu''à ce que la personne responsable de la sécurité du camp vienne le prendre. A la table à l''intérieur, Gavin ouvre les notes sanitaires qu''il s''apprêtait à emporter. Quand on vient lui demander une signature dans l’après-midi, il est toujours à la même table.'
        p3: 'Nightingale fait venir un tableau des chiffres et demande qu''il soit mis de côté lorsqu''il arrivera. Vous lui demandez si elle souhaite que l''aide-soignante du bureau reste et dites aux personnes qui attendent une réponse qu''elles arriveront un autre jour. Lorsqu''elle se sent plus forte, elle leur demande d''abord d''ouvrir un peu la fenêtre. Puis elle demande où elle s''est arrêtée. Quand elle ouvre de nouveau le rapport, personne ne la presse d’y apposer sa signature.'
      outcomes:
        all: 'L''inspection se poursuit dans les délais. Gavin survit à l''accident dans cette branche et Nightingale se remet de la maladie de mai. Elle retourne au travail au rythme qu''elle peut choisir.'
        p1: 'La commission commence son inspection et emporte les listes utilisables pour la suite de ses travaux.'
        p2: 'Gavin reste en sécurité au camp. Il peut continuer le travail enregistré dans ses notes sanitaires.'
        p3: 'Nightingale récupère plus tôt dans cette branche. Elle choisit quand elle est prête à rouvrir les personnages.'
      none: 'Les listes restent mélangées dans la salle pendant un moment. Les personnes en attente de nouvelles attendront encore les lettres d''avril et de mai.'
      not_admitted: 'Le portier demande aux personnes extérieures à l''équipe d''inspection d''attendre. Vous entendez l''infirmière vérifier à nouveau la liste de transfert.'
      desync: 'L''inspection ne commence pas à l''heure. Les registres du service ne sont plus synchronisés et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quelqu’un ressort avec deux registres séparés. Il reste beaucoup de pages blanches dans chacun.'
        p2: 'Quand on vient lui demander une signature dans l’après-midi, il est toujours à la même table.'
        p3: 'Quand elle ouvre de nouveau le rapport, personne ne la presse d’y apposer sa signature.'
    relic: 'Une petite lampe à huile'
    relic_desc: 'La lampe de ses rondes nocturnes.'
    points:
      p1: 'Malgré le typhus et le choléra dans les services, poursuivre l''inspection des hôpitaux de Scutari par la Commission Sanitaire à partir du 6 mars'
      p2: 'Arrêtez le coup de feu dans la tente de Balaklava et sauvez le commissaire sanitaire Hector Gavin'
      p3: 'Guérissez la fièvre de Crimée que Nightingale attrape à Balaklava en mai, avant qu''elle ne puisse rester avec elle pour le reste de sa vie'
    points_fail:
      p1: 'Les cabines d''inspection dans les infirmeries et les égouts bouchés ne sont pas ouverts à temps. Cette branche est en décalage avec l''histoire et le bureau rappelle l''employé.'
      p2: 'Le coup de feu est tiré dans la tente, et dans cette branche aussi, la commission perd un de ses trois membres un mois après le débarquement.'
      p3: 'La fièvre suit son cours. Elle est hors de danger fin mai, mais dans cette branche, comme dans l''histoire, la maladie reste avec elle.'
    shift:
      p1:
        was: 'Le 6 mars 1855, la Commission sanitaire arriva à Constantinople et commença dans l''après-midi à examiner les hôpitaux de Scutari.'
      p2:
        was: 'Le 21 avril 1855, le commissaire sanitaire Hector Gavin fut tué en Crimée lorsque son revolver explosa alors qu''il le remettait à son frère.'
        now: '{staff} demande aux deux hommes de faire une pause. Gavin pose le revolver et appelle la personne responsable de la sécurité du camp. Il poursuit le travail de la commission et retourne plus tard en Grande-Bretagne.'
      p3:
        was: 'En mai 1855, Nightingale alla inspecter les hôpitaux de Balaklava et attrapa la fièvre de Crimée en quelques jours ; elle fut dangereusement malade pendant environ douze jours et resta invalide pendant une grande partie de sa vie ultérieure.'
        now: '{staff} traite la fièvre dès les premiers jours avec des médicaments que le siècle n''a pas. Nightingale est debout dans la semaine et retourne à Scutari sans la maladie qui l''a suivie chez elle.'
        who: 'nightingale_scutari'
        bio: 'Dans cette branche, Nightingale a été guérie de la fièvre qu''elle avait attrapée à Balaklava en 1855. Elle a effectué son travail dans les hôpitaux et la santé militaire en personne, debout plutôt que depuis une chambre de malade.'
    vignettes:
      totals: 'Un commis fictif ajoute la liste des transferts au total des admissions. Vous demandez quels noms sont nouvellement admis. Ils laissent les virements dans leur propre colonne avant d''envoyer le retour.'
      name: 'L''employé n''entend pas de nom à cause du bruit de la pièce. Vous attendez à côté de la personne qui l''a donné jusqu''à ce qu''elle puisse le répéter. La copie suivante l''épelle comme ils l''ont demandé.'
      fold: 'Vous placez les papiers de la paroisse dans l''ordre indiqué par le greffier. La feuille qui apparaissait après le total arrive désormais avant celui-ci.'
  scott_last_camp:
    name: 'La tente sur la barrière de glace'
    place: 'Barrière de Ross'
    figure: 'Robert Falcon Scott'
    story: 'La dernière entrée du journal de Scott est datée du 29 mars 1912. Le manuscrit survivant relate le dernier camp du groupe lors de son retour du pôle Sud. La scène de lecture est imaginée après le retour des journaux.'
    story_prose:
      opening:
        - 'Lorsque le vent se lève sur la barrière de glace de Ross, il y a un sac de pierres provenant du glacier sur le traîneau. Scott éloigne son journal de l''ouverture. Personne ne peut promettre jusqu’où il ira demain. Oates enlève une botte et demande où il peut s''asseoir dans un endroit sec.'
        - 'En mars 1912, le parti de Scott rencontra des difficultés à son retour. Oates est sorti de la tente et n''est pas revenu. Scott et deux autres personnes ont été détenus à environ onze milles de One Ton Depot. Vous pouvez conserver les journaux et les spécimens ensemble, aider Oates et Scott à tour de rôle et essayer d''amener le groupe restant au dépôt.'
        - 'Envoyez quelqu''un qui peut gérer une charge et s''occuper des autres dans le froid. Laissez les soignants demander ce dont chaque homme a besoin, puis accordez suffisamment de temps à la personne la plus lente lors de la dernière étape.'
      points:
        p1: 'Quelqu’un propose de retirer un sac de pierres. Vous demandez à Wilson de lire sur l’étiquette le lieu du prélèvement et à Scott de vérifier où se trouve le journal. Ce dont ils n’auront pas besoin dans l’obscurité va au fond. Les échantillons et le journal ont chacun leur place. Quand ils démontent la tente, le nom du glacier se lit encore sur le flanc du traîneau.'
        p2: 'Oates essaie d''ouvrir le coffre et le maintient là. Il dit qu''il ne peut pas aller vite cette fois. Vous lui demandez de s’asseoir dans la tente et de discuter du rythme du lendemain avec la personne qui reste pour s’occuper de lui. Le lendemain, à l’ouverture de la tente, il attend que ses bottes soient posées à côté des autres avant de se lever.'
        p3: 'Scott dit que son pied droit ne supporte plus son poids comme le gauche. Vous appelez la personne qui peut s''occuper de lui et demandez aux personnes qui transportent la charge de poser la ligne pendant un moment. Au début, il pose fermement le pied avant de donner le mot d''avancer. À la fin de la première étape, il peut encore s’arrêter et noter dans son journal la distance parcourue.'
        p4: 'La dérive se presse contre la tente. Il reste onze milles. Vous attendez que tout le monde se dise prêt et cherchez à tour de rôle la direction avec la personne qui connaît le dépôt. Au drapeau, vous attendez la dernière personne avant que quelqu''un aille voir ce qu''il y a à l''intérieur. Près des réserves du dépôt, il ouvre son carnet à une page neuve. Le crayon peut encore y courir.'
      outcomes:
        all: 'Les journaux et les pierres arrivent au dépôt avec le groupe. Oates et Scott traversent cette étape avec les autres, et une nouvelle journée entre dans le journal.'
        p1: 'Les registres et les spécimens sont conservés jusqu''aux derniers jours. Ils restent sur le traîneau lorsque le groupe doit alléger la charge.'
        p2: 'Oates reste avec le groupe. Au prochain arrêt, il pourra se reposer à l''intérieur avec les autres.'
        p3: 'Scott peut poser son pied fermement. Ce qui arrive au reste de l’équipe dépend encore de la dernière ligne droite.'
        p4: 'Les personnes qui font le dernier tronçon arrivent au dépôt. Le rapport enregistre leur arrivée en fonction du reste du voyage.'
      none: 'Le carburant et la force sont épuisés. Le vent maintient la tente en place et le record s''arrête fin mars.'
      not_admitted: 'Le parti n’a pas fait de place à un nouveau venu. Vous restez dehors, avec le carburant et les pierres toujours à leur charge.'
      desync: 'Les journaux ou les spécimens sont laissés sur place avant la fin des archives historiques. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quand ils démontent la tente, le nom du glacier se lit encore sur le flanc du traîneau.'
        p2: 'Le lendemain, à l’ouverture de la tente, il attend que ses bottes soient posées à côté des autres avant de se lever.'
        p3: 'À la fin de la première étape, il peut encore s’arrêter et noter dans son journal la distance parcourue.'
        p4: 'Près des réserves du dépôt, il ouvre son carnet à une page neuve. Le crayon peut encore y courir.'
    relic: 'Un journal'
    relic_desc: 'Un petit journal au crayon, raidi par le froid.'
    points:
      p1: 'Dans une marche à court de carburant et de force défaillante, gardez les journaux et les spécimens de roche du glacier Beardmore sur le traîneau.'
      p2: 'Guérissez les pieds gelés d''Oates pour qu''il puisse suivre la fête et qu''il ne sorte pas de la tente vers le 16 mars.'
      p3: 'Avant le 18 mars, sauvez le pied droit de Scott des engelures qui ralentissent toute la fête'
      p4: 'Amenez les trois hommes à travers le blizzard qui commence le 21 mars et à travers les onze derniers milles jusqu''à One Ton Depot'
    points_fail:
      p1: 'Les spécimens sont laissés sur la banquise et les journaux n''arrivent pas jusqu''au dernier jour. Cette branche est en décalage avec l''histoire et le bureau rappelle l''employé.'
      p2: 'Ses pieds empirent chaque jour, et dans cette branche aussi, vers le 16 mars, il part dans la congère et ne revient pas.'
      p3: 'Le pied se fige, et dans cette branche, comme dans l''histoire, la marche ralentit jusqu''à ramper.'
      p4: 'Le blizzard maintient la tente là où elle est et après le 29 mars, le journal n''a plus de nouvelle page.'
    shift:
      p1:
        was: 'En mars 1912, à court de carburant sur le chemin du retour, le groupe garda sur le traîneau les journaux intimes et les fossiles de Glossopteris du glacier Beardmore ; l''équipe de recherche les a trouvés avec la tente le 12 novembre.'
      p2:
        was: 'Début mars 1912, les pieds d''Oates furent gravement gelés et il ralentit ; le 16 ou le 17 mars, il est sorti de la tente et n''a plus été revu.'
        now: '{staff} lui réchauffe les pieds et change ses chaussettes tous les soirs et les engelures ne s''aggravent pas. Oates suit le rythme à côté du traîneau et est toujours avec le groupe au dernier camp.'
      p3:
        was: 'Le 18 mars 1912, Scott écrivit que presque tous les orteils de son pied droit avaient disparu et que la marche ralentissait encore.'
        now: '{staff} réchauffe et enveloppe son pied droit à chaque camp. Scott garde le pied et le groupe continue vers le nord à son rythme habituel.'
      p4:
        was: 'À partir du 21 mars 1912, une tempête de neige retint Scott, Wilson et Bowers dans leur tente à onze milles de One Ton Depot ; la dernière entrée du journal est datée du 29 mars et l''équipe de recherche a trouvé la tente le 12 novembre.'
        now: '{staff} mène les trois hommes vers le nord dans une accalmie de vent et divise les onze derniers milles en courtes étapes. Ils trouvent du carburant et de la nourriture à One Ton Depot et survivent au blizzard. Avant l''hiver, ils sont de retour au cap Evans.'
        who: 'scott_last_camp'
        bio: 'Dans cette chronologie, Scott est revenu vivant du pôle avec Wilson et Bowers et a atteint le cap Evans. Il retourna en Grande-Bretagne et édita lui-même les journaux et les résultats scientifiques de l''expédition.'
    vignettes:
      distance: "De retour à l'Agence, l'employé fictif copie une distance dans une colonne intitulée «\_distance parcourue\_». Vous leur montrez que le chemin est encore long. Ils déplacent l'entrée avant de déposer la copie."
      blank: 'De retour à l''Agence, le commis s''arrête à la date finale. Vous attendez pendant qu''ils décident comment marquer le blanc au-delà. Ils écrivent que le disque se termine ici, puis posent le crayon.'
      opening: 'De retour à l''Agence, vous ouvrez la copie d''entraînement et lisez la date précédant l''histoire. Le greffier inscrit la même date sur la lamelle afin que les pages puissent être retrouvées dans l''ordre.'
  seacole_balaklava:
    name: 'L’auberge qu’elle a rejointe par ses propres moyens'
    place: 'Balaklava'
    figure: 'Mary Seacole'
    story: 'Les mémoires de Mary Seacole de 1857 décrivent l''hôtel britannique qu''elle dirigeait avec Thomas Day près de Balaklava, les produits qu''il vendait et les personnes qui y venaient en 1855.'
    story_prose:
      opening:
        - 'L''hôtel de la route de Balaklava vient d''ouvrir son comptoir. Mary Seacole pousse le sac pour l''hôpital temporaire vers la porte. Thomas Day demande ce qui a été mis en vente. Elle dit qu''elle s''occupera d''abord des blessés et qu''elle reviendra sur les comptes.'
        - 'Le 18 juin 1855, Seacole enregistre qu''elle a aidé les blessés près de l''hôpital temporaire et qu''elle s''est blessée au pouce. L''hôtel avec lequel elle dirigeait Day a également été victime de vol. Après la paix, le couple fit faillite en 1856. Vous pouvez conserver le travail à l''hôpital et aider séparément à soigner sa blessure, les chevaux et le bétail.'
        - 'Envoyez quelqu''un avec une expérience en matière de soins. Un voyageur qui connaît l''hôtel peut surveiller l''écurie. Plus tard, faites appel à quelqu''un qui peut vérifier les livres avec les deux partenaires avant de décider de commander ou non davantage de stock.'
      points:
        p1: 'Quelqu''un sur la route vous demande si vous pouvez envoyer quelque chose à l''hôpital temporaire. Vous passez le sac près de la porte et un peu d''eau, puis vérifiez auprès de Seacole qui attend près des lits. Au moment où elle arrive à l’hôpital, la personne qui a demandé a trouvé un endroit où elle peut poser le sac. Elle l’ouvre et demande au patient le plus proche ce dont il a besoin.'
        p2: 'Seacole soutient sa main droite et dit que ça fait mal de bouger le pouce. Vous appelez quelqu''un formé pour prendre soin d''elle et lui demandez où elle veut s''asseoir. Quelqu''un d''autre prend le sac qu''elle portait. Après s’être reposée, elle lève la main et dit qu’elle a moins mal. Puis elle demande un bout de papier pour y noter le nom d’un patient.'
        p3: 'Un bruit vient de la porte arrière. Le commis se lève et ne trouve personne qui surveille l''écurie. Vous demandez à une personne d''appeler Seacole et à une autre de compter les chevaux depuis un endroit où la cour est visible. Celui qui est dehors entend la réponse de la cour et s''en va. À l’aube, les chevaux qu’il faut atteler à la charrette sont encore à l’abreuvoir.'
        p4: 'Le jour est sur le point de mettre un nouvel ordre. Seacole lui demande de compter à haute voix les marchandises sur les étagères. Vous exposez les commandes, les stocks et les dettes sur une seule feuille, puis demandez ce qui peut être vendu avant le départ de l''armée. Les partenaires le vérifient une fois et annulent la livraison suivante. Quand Seacole ferme son livre de comptes, il reste derrière le comptoir une étagère vide pour le dernier enlèvement.'
      outcomes:
        all: 'Seacole arrive à l''hôpital temporaire et est toujours capable d''utiliser sa main plus tard. L''écurie reste pleine et les associés règlent les comptes à la fermeture de l''hôtel.'
        p1: 'Elle soigne les gens à l''hôpital temporaire comme prévu et retourne à l''hôtel le soir même.'
        p2: 'Quelqu''un s''occupe de son pouce, et utiliser un stylo est plus facile lorsqu''elle revient à ses notes.'
        p3: 'Les chevaux restent à l''écurie cette nuit-là. Le matin, les gens avec la charrette savent où les trouver.'
        p4: 'Seacole et Day règlent les comptes. La dernière livraison ne leur laisse pas de stocks invendus lorsque les troupes rentrent chez elles.'
      none: 'Personne n''a fini de compter le stock et les gens au bord de la route attendent toujours que quelqu''un les accompagne.'
      not_admitted: 'Le commis demande au visiteur de ne pas bloquer la porte. La trousse d’hôpital ne figure pas sur votre liste à emporter.'
      desync: 'Seacole n''atteint pas le point où elle a aidé par la route dans l''histoire. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Elle l’ouvre et demande au patient le plus proche ce dont il a besoin.'
        p2: 'Après s’être reposée, elle lève la main et dit qu’elle a moins mal. Puis elle demande un bout de papier pour y noter le nom d’un patient.'
        p3: 'À l’aube, les chevaux qu’il faut atteler à la charrette sont encore à l’abreuvoir.'
        p4: 'Quand Seacole ferme son livre de comptes, il reste derrière le comptoir une étagère vide pour le dernier enlèvement.'
    relic: 'Une pharmacie'
    relic_desc: 'Un vieux coffre en bois avec des compartiments pour les herbes et la gaze.'
    points:
      p1: 'Le 18 juin, jour de l''échec de l''assaut sur le Redan, gardez Seacole à son travail sous le feu à côté de l''hôpital temporaire de Woronzoff Road.'
      p2: 'Lorsqu''elle se jette d''une coquille et se disloque le pouce droit, fixez l''articulation et fixez-la sur place.'
      p3: 'Arrêtez les voleurs qui viennent la nuit chercher les chevaux du British Hotel'
      p4: 'Après la chute de Sébastopol, persuadez Seacole et Thomas Day d''arrêter d''acheter des actions et de régler leurs comptes, afin que la paix ne les laisse pas en faillite.'
    points_fail:
      p1: 'Elle n''arrive jamais à l''hôpital provisoire ce jour-là et les blessés attendent au bord de la route sans pansements. Cette branche est en décalage avec l''histoire et le bureau rappelle l''employé.'
      p2: 'Le pouce n''est lié qu''à la hâte, et dans cette branche, comme dans l''histoire, il ne reprend jamais sa forme propre.'
      p3: 'La moitié de l''écurie est vide le matin et l''hôtel doit emprunter des animaux au camp des transports terrestres pour aller chercher ses marchandises.'
      p4: 'Lorsque l''armée part après la paix, les actions ne se vendent pas et en novembre 1856 les deux associés sont déclarés en faillite à Londres.'
    shift:
      p1:
        was: 'Le 18 juin 1855, jour de l''échec de l''assaut allié sur le Redan, Seacole transporta des bandages et de la nourriture sous le feu jusqu''à l''hôpital temporaire situé près de Woronzoff Road et aida les médecins à soigner les blessés.'
      p2:
        was: 'Le 18 juin 1855, Seacole se jeta à terre pour échapper à un obus et se luxa le pouce droit ; il a été ficelé sur place et n''a jamais retrouvé sa forme initiale.'
        now: '{staff} fixe l''articulation et la fixe sur-le-champ. Quelques semaines plus tard, sa main droite mélange des médicaments et noue des bandages comme avant.'
      p3:
        was: 'En 1855, l''hôtel britannique de Spring Hill fut cambriolé à plusieurs reprises ; un matin, la plupart de ses chevaux étaient partis.'
        now: '{staff} arrête les hommes qui emmenaient les chevaux pendant le quart de nuit. Le lendemain, les chariots de l''hôtel descendent comme d''habitude à Balaklava.'
      p4:
        was: 'Après la paix de mars 1856, l''armée partit rapidement et Seacole et Day se retrouvèrent avec des stocks invendus et des dettes ; une demande de mise en faillite fut déposée contre eux en octobre 1856 et ils furent déclarés en faillite en novembre.'
        now: '{staff} persuade à l''automne les deux partenaires d''arrêter les grosses commandes et de recouvrer ce qui leur est dû. Lorsque la paix revient, leurs stocks sont réduits, ils quittent la Crimée avec leurs comptes réglés et ils ne comparaissent jamais devant le tribunal des faillites.'
        who: 'seacole_balaklava'
        bio: 'Dans cette chronologie, Seacole est rentrée de Crimée sans être en faillite et avec son propre capital. Elle n''a pas eu à vivre d''un abonnement public et a continué à allaiter et à voyager avec son propre argent.'
    vignettes:
      meal: 'Un client fictif est là depuis si longtemps qu’il ne peut pas expliquer pourquoi il est venu. Vous trouvez d’abord une place. Au retour du préposé, le client peut demander à dîner dans ses propres mots.'
      counter: 'Deux clients répètent la même commande, chacun pensant que l''autre n''a pas été entendu. Vous demandez au préposé de relire ce qu’il a écrit. Un plateau s''avère suffisant.'
      shelf: 'Le préposé demande de la place au bout du comptoir. Vous déplacez deux assiettes vides et placez un tabouret sur lequel un invité en attente peut s''asseoir sans retenir le client suivant.'
  wegener_greenland:
    name: 'À travers la calotte glaciaire'
    place: 'Calotte glaciaire du Groenland'
    figure: 'Alfred Wegener'
    story: 'Wegener atteignit la gare intérieure d''Eismitte en 1930 avec des provisions et mourut sur le chemin du retour. Le récit de l''Institut Alfred Wegener préserve la séquence de l''expédition et identifie son compagnon groenlandais Rasmus Willumsen.'
    story_prose:
      opening:
        - 'La charge du traîneau sur la glace du Groenland a été recomptée. Wegener demande si Loewe peut se débrouiller debout. Villumsen dit qu''une fois que la visibilité s''améliore, ils doivent reconnaître l''endroit encore devant eux comme étant Eismitte.'
        - 'En octobre 1930, Alfred Wegener, Fritz Loewe et Rasmus Villumsen atteignirent Eismitte. Loewe est resté. Wegener est mort sur le chemin du retour et Villumsen et le journal qu''il avait emporté avec lui ont disparu. Dans cette branche, vous pouvez préserver l''arrivée et aider chaque homme à un moment différent du voyage.'
        - 'Envoyez quelqu''un avec de l''expérience sur la neige pour aider le groupe à se déplacer et à remettre les fournitures. Demandez aux soignants de vérifier Loewe et Wegener séparément. Assurez-vous que le camp ouest sait quand attendre Villumsen.'
      points:
        p1: 'On ne voit que l''arrière du traîneau. Villumsen demande au parti de se fermer pendant un moment. Vous marquez les fournitures à remettre sur la première feuille et demandez à la dernière personne d''appeler chacune d''elles avant que vous parcouriez tous la distance restante. Quand l’équipe de la station sort, elle compte les personnes et les sacs en attente.'
        p2: 'Loewe repose ses pieds gelés et demande où sont passées les chaussettes sèches. Vous demandez à l''aidant d''entendre ce qu''il dit avant que quelqu''un d''autre ne s''en prenne à lui. Quelques jours plus tard, on lui demande s''il souhaite essayer un autre endroit pour s''asseoir. Il prend ce qui pendait près de son lit et rejoint le tabouret qu’il a choisi.'
        p3: 'Quelqu''un commence à mettre le journal dans un sac avec les papiers. Villumsen demande à le voir d''abord. Vous le laissez choisir où il peut l''atteindre et faites savoir que le camp occidental doit l''attendre. Lorsque le traîneau arrive, quelqu''un s''avance pour prendre ses affaires. Villumsen prend le journal à côté de son bagage et le remet lui-même.'
        p4: 'Au retour, dans la tente, Wegener demande si quelqu''un peut envoyer un message à l''avance. Vous portez la demande à l''extérieur, puis ramenez le soignant pour lui demander combien de temps il souhaite se reposer. Lorsque le groupe atteint le camp ouest, la personne à la porte apporte des couvertures et leur demande de s''asseoir. La main encore tremblante, Wegener inscrit lui-même son nom sur la liste des arrivées.'
      outcomes:
        all: 'L''équipe de secours prend rendez-vous et Loewe se fait soigner. Wegener et Villumsen atteignent plus tard le camp ouest et le journal est remis à ceux qui l''attendent.'
        p1: 'Le groupe arrive à la gare le 30 octobre et les fournitures sont vérifiées par rapport à la liste.'
        p2: 'Les pieds de Loewe s’améliorent après les soins à la gare, et dans cette branche il évite l’opération.'
        p3: 'Villumsen et le journal reviennent au camp ouest. Le rapport suit les propres résultats de Wegener pour l’autre partie du voyage.'
        p4: 'Wegener atteint le camp ouest vivant. La remise du journal dépend toujours de ce qui est arrivé à Villumsen.'
      none: 'Le dernier tronçon sur la glace prend encore plus de temps. La liste des arrivées à l’Ouest comporte encore une ligne vierge.'
      not_admitted: 'La liste des fournitures n''a pas de place pour le visiteur. Quelqu''un vous demande de vous tenir à l''écart des personnes qui travaillent près du traîneau.'
      desync: 'Le groupe manque l''arrivée du 30 octobre. La passation de relais se désynchronise et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quand l’équipe de la station sort, elle compte les personnes et les sacs en attente.'
        p2: 'Il prend ce qui pendait près de son lit et rejoint le tabouret qu’il a choisi.'
        p3: 'Villumsen prend le journal à côté de son bagage et le remet lui-même.'
        p4: 'La main encore tremblante, Wegener inscrit lui-même son nom sur la liste des arrivées.'
    relic: 'Une sangle de luge'
    relic_desc: 'Une lanière de cuir gelée provenant d''un traîneau chargé.'
    points:
      p1: 'Maintenir l''équipe de secours à travers la dernière étendue de glace, afin que Wegener, Loewe et Villumsen atteignent Eismitte le 30 octobre.'
      p2: 'Traitez les pieds gelés de Loewe afin que ses orteils ne soient pas coupés dans la grotte de glace'
      p3: 'Gardez Villumsen en sécurité sur le chemin vers l''ouest, afin qu''il atteigne le camp avec le journal de Wegener.'
      p4: 'Traitez Wegener sur la glace au retour, afin qu''il entre vivant dans le camp occidental'
    points_fail:
      p1: 'La fête se déroule sur la glace à cause du froid et n''arrive pas à la gare le 30 octobre. Cette branche s''est détachée de l''histoire et le bureau rappelle l''employé.'
      p2: 'Les orteils gelés de Loewe n''ont pas pu être sauvés. Ils furent isolés à la gare cet hiver-là et il ne put marcher qu''au printemps.'
      p3: 'Villumsen a enterré Wegener et est parti vers l''ouest avec le journal. Personne ne l''a revu et le journal a été perdu avec lui.'
      p4: 'Wegener mourut sur le chemin du retour, vers la mi-novembre, dans une tente sur la glace. Il a été retrouvé en mai de l''année suivante.'
    shift:
      p1:
        was: '30 octobre 1930 : après quarante jours sur la glace, Wegener, Loewe et Villumsen atteignent la station Eismitte au milieu de la calotte glaciaire.'
      p2:
        was: 'Hiver 1930 : à Eismitte, les orteils gelés de Loewe sont coupés avec un couteau de poche et il ne peut plus marcher pendant le reste de l''hiver.'
        now: 'Loewe a gardé ses orteils. Il a passé l''hiver seul à la gare.'
      p3:
        was: 'Novembre 1930 : Villumsen enterre Wegener sur la glace, prend son journal et continue vers l''ouest. Il n''est jamais retrouvé.'
        now: 'Villumsen atteint le camp ouest et remet le journal de Wegener entre les mains de l''expédition.'
        bio: 'Rasmus Villumsen revint de la glace en novembre 1930 et rentra chez lui auprès de sa famille au Groenland.'
      p4:
        was: '1er novembre 1930 : Wegener quitte Eismitte le jour de son cinquantième anniversaire. Il meurt sur la glace vers la mi-novembre et son corps est retrouvé le 12 mai 1931.'
        now: '{staff} est resté avec lui tout au long du chemin et a surveillé sa force chaque nuit. Il entra vivant dans le camp occidental et vécut assez longtemps pour voir les mesures de l''expédition établies.'
        who: 'wegener_greenland'
        bio: 'Wegener est revenu vivant du milieu de la calotte glaciaire en novembre 1930. Il a vécu encore de nombreuses années et a vu les observations de l''expédition se concrétiser.'
    shift_all: 'Dans cette chronologie, tous ceux qui sont entrés et sortis d''Eismitte cet automne sont revenus vivants sur la côte.'
    vignettes:
      names: 'Un commis fictif répertorie l''expédition sous un seul nom de famille. Vous demandez qui a remis le chargement. Ils laissent une ligne aux autres personnes impliquées au lieu d''enregistrer uniquement le nom le plus connu.'
      count: 'Le commis a fait en sorte que le premier décompte corresponde à la quantité livrée. Vous leur demandez d’indiquer de quelle station provient chaque personnage. Les deux totaux ne se situent plus sous la même rubrique.'
      note: 'Vous copiez la destination sur un deuxième feuillet pendant que le commis classe le grand livre vide. La personne suivante peut toujours déterminer à quelle station se rapportent les entrées.'
  tupaia_tahiti:
    name: 'La carte du navigateur'
    place: 'À bord de l’Endeavour'
    figure: 'Tupaia'
    story: 'Tupaia, un navigateur de Raiatea, rejoignit l''Endeavour en 1769 et participa à la cartographie des îles qu''il connaissait. Le navire a heurté un récif au large de ce qui est aujourd''hui le Queensland en juin 1770. Banks a enregistré le scorbut de Tupaia pendant les réparations et a signalé la mort de Taiata et de Tupaia plus tard cette année-là à Batavia.'
    story_prose:
      opening:
        - 'Sur l''Endeavour, Tupaia vérifie les noms d''îles qu''il connaît lorsque le navire heurte. Un paquet glisse du coin d''une table et un gardien appelle à l''aide. Il fait encore nuit lorsqu''ils apprennent que le navire est rapide sur un récif.'
        - 'L''Endeavour a heurté un récif au large de l''actuel Queensland en 1770. L''équipage l''a renfloué et l''a réparé. Tupaia tomba malade pendant cette période et Banks enregistra la nouvelle de la mort de Taiata et Tupaia à Batavia des mois plus tard. La branche peut préserver le navire, apporter de la nourriture fraîche à Tupaia et passer du temps ensemble lorsqu''ils sont malades.'
        - 'Envoyez quelqu''un qui puisse aider l''équipage à garder ses postes. Pendant les réparations, quelqu''un devrait demander à Tupaia ce qu''il peut manger. A Batavia, le parti a besoin de temps pour organiser une visite au chevet.'
      points:
        p1: 'Une caisse bloque le passage des charges qu’on remonte de la cale. Vous faites de la place pour la relève aux pompes et libérez le passage à ceux qui portent la caisse. Les matelots à l’autre bout restent près du cordage. Ils attendent le signal pour tirer ensemble. Quand le navire bouge, on demande d’abord si l’homme près de la pompe tient encore debout.'
        p2: 'Les produits frais sont d''abord envoyés aux réparateurs. Tupaia entend des noms et demande combien de temps il devra encore attendre. Vous lui faites apporter une portion où il peut choisir ce qu''il veut manger, puis enregistrer ce qui reste pour le groupe suivant. Quand l’assiette arrive jusqu’à lui, il peut choisir en premier parmi ce qu’on a mis de côté pour lui.'
        p3: 'Il y a beaucoup de malades dans la salle Batavia et les mêmes soignants sont constamment appelés. Tupaia demande à quelqu''un de savoir si Taiata le verra. Vous transmettez la question et attendez que les deux soient d''accord avant de déplacer une chaise vers le lit. Quand vous partez, ils s’entendent encore parler.'
      outcomes:
        all: 'Le navire est livré gratuitement comme dans l''histoire. La succursale enregistre également la part de nourriture de Tupaia et leur visite au chevet. La nouvelle des deux décès reste dans les archives.'
        p1: 'L''Endeavour est livré gratuitement. Les équipes de réparation auront encore du travail à faire ; des dispositions ultérieures restent à prendre.'
        p2: 'Tupaia reçoit la part qu''il a choisie. Cette partie du disque s''arrête avec la plaque qui lui est apportée.'
        p3: 'Les deux sont suffisamment proches pour parler un court instant. Les morts à Batavia se succèdent toujours.'
      none: 'Les gens attendent toujours la prochaine commande sur le pont. Aucune nouvelle part n''a été réservée et la visite ultérieure n''a pas été organisée.'
      not_admitted: 'L''équipage demande aux personnes non affectées de dégager la station près de la pompe. De l’autre côté, vous voyez quelqu’un ramasser une liasse de papiers mouillés.'
      desync: 'L''Endeavour est encore rapide à l''aube. La récupération historique se désynchronise et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quand le navire bouge, on demande d’abord si l’homme près de la pompe tient encore debout.'
        p2: 'Quand l’assiette arrive jusqu’à lui, il peut choisir en premier parmi ce qu’on a mis de côté pour lui.'
        p3: 'Quand vous partez, ils s’entendent encore parler.'
    relic: 'Un croquis des îles'
    relic_desc: 'Une feuille d''encre et de lavis avec des formes et des noms de petites îles.'
    points:
      p1: 'La nuit où le navire heurte le récif, aidez-le à l''alléger, à faire fonctionner les pompes et à maintenir l''Endeavour à flot.'
      p2: 'Mettez de côté de la nourriture fraîche pour Tupaia pendant que les équipes de réparation sont approvisionnées et laissez-le choisir ce qu''il peut manger.'
      p3: 'À Batavia, prenez le temps pour Tupaia de s''asseoir avec Taiata et de demander qui ils veulent à proximité pendant qu''ils sont malades'
    points_fail:
      p1: 'Au lever du jour, le navire est toujours amarré sur le récif avec de l''eau au dessus de la cale. La succursale n''est plus en phase avec l''histoire et le bureau rappelle l''employé ce jour-là.'
      p2: 'Les nouvelles fournitures vont d''abord aux équipes de réparation. Tupaia doit attendre une part.'
      p3: 'Les gens autour d''eux sont appelés vers d''autres lits de maladie. La visite demandée par Tupaia doit attendre.'
    shift:
      p1:
        was: '10 au 11 juin 1770 : l''Endeavour s''échoue sur ce qui est aujourd''hui Endeavour Reef. L''équipage a jeté par-dessus bord six canons, du ballast, de l''eau et des provisions avariées, et le bateau a flotté avec la marée montante.'
      p2:
        was: "16 juin 1770\_: Banks écrit que Tupaia avait un grave scorbut, des gencives disparues et des taches livides sur les jambes, et que les remèdes à bord ne l'aidaient pas."
        now: 'Dans cette branche, Tupaia a une part de la nourriture fraîche pendant que le navire est en réparation. Il peut choisir quoi manger sans sortir au préalable pour attraper quelque chose.'
      p3:
        was: 'À Batavia, Banks reçut la nouvelle de la mort de Taiata puis de celle de Tupaia.'
        now: 'Dans cette branche, {staff} fait une place à Tupaia pour s''asseoir près de Taiata. Les deux choisissent qui peut rester et avoir un peu de temps pour parler ensemble.'
    vignettes:
      pronounce: '{staff} demande à un copiste, composé pour le jeu, de lire à haute voix deux orthographes avant de dessiner une deuxième île, et il met un point d''interrogation à côté des noms.'
      route: '{staff} demande à partir de quelle île un relèvement a été donné avant qu''une ligne droite ne soit tracée entre deux marques, et la ligne n''est pas tracée.'
      room: '{staff} maintient le coin roulé d''une feuille afin qu''un nouveau nom puisse être écrit sans recouvrir le précédent.'
  ulugh_beg_samarkand:
    name: 'La route qui quitte Samarcande'
    place: 'Samarcande'
    figure: 'Oulough Beg'
    story: "Oulough Beg a construit un observatoire à Samarcande et a supervisé un catalogue de 1\_018 étoiles. À l'automne 1449, il perdit le pouvoir et fut autorisé à se rendre à La Mecque. Il a été tué près de Samarcande fin octobre. La date inscrite sur sa tombe est le 27 octobre, soit deux jours après la date donnée par une autre source."
    story_prose:
      opening:
        - 'A Samarcande, un paquet pour la route se trouve à côté des tables d''étoiles nouvellement empilées. Oulough Beg a cédé le pouvoir et le parti attend dehors. Quelqu’un demande où il compte passer la première nuit hors de la ville.'
        - 'Oulough Beg a participé aux travaux astronomiques à Samarcande. En 1449, il fut tué après avoir quitté la ville. Ici, vous pouvez vérifier où il resterait lors du match aller et lui demander s''il veut de la compagnie.'
        - 'Envoyez quelqu''un qui peut parler avec le groupe et s''occuper d''un voyageur. Demandez à Oulough Beg où il souhaite s''arrêter, puis vérifiez que la maisonnée peut le recevoir.'
      points:
        p1: 'Oulough Beg dit que quelqu''un a déjà appelé pour récupérer les bagages et qu''il ne sait pas où il pourra s''asseoir ce soir-là. Vous dites à un compagnon qu''une maison plus loin peut laisser sa porte ouverte, puis demandez à Oulough Beg s''il souhaite vous accompagner. Il confie les tables des étoiles à quelqu’un et prend un sac léger. À son arrivée, il invite la personne qui l’a accompagné à s’asseoir, elle aussi.'
      outcomes:
        all: 'Oulough Beg atteint un lieu d''hébergement après avoir quitté la ville. Dans cette branche, on apprend qu''il est en sécurité cette nuit-là.'
        p1: 'Quelqu''un l''accompagne jusqu''à l''endroit où il a accepté de séjourner. Les tables étoilées restent dans la ville.'
      none: 'Il repart avec les gens qui attendent déjà les bagages. La nouvelle suivante est qu''il a été tué en dehors de la ville.'
      not_admitted: 'Le visiteur n''est pas admis à la fête. Les tables restent à l''intérieur et les gens à l''extérieur repartent avec les bagages.'
      excerpts:
        p1: 'À son arrivée, il invite la personne qui l’a accompagné à s’asseoir, elle aussi.'
    relic: 'Un slip à deux sources'
    relic_desc: 'Deux rangées marquées pour une position d''étoile plus ancienne et une nouvelle observation.'
    points:
      p1: 'Après qu''Oulough Beg ait renoncé au pouvoir, organisez-lui un endroit où séjourner pendant la première étape de son voyage et proposez-lui de l''accompagner.'
    points_fail:
      p1: 'Il repart avec la compagnie qui l''attend déjà. La nouvelle suivante que vous entendez est qu''il a été tué près de la ville.'
    shift:
      p1:
        was: 'Après avoir abandonné son règne, Oulough Beg quitta Samarcande et fut tué près de la ville fin octobre 1449.'
        now: 'Dans cette branche, {staff} accompagne Oulough Beg dans un endroit où il a accepté de rester. Il survit au voyage hors de Samarcande.'
        who: 'ulugh_beg_samarkand'
        bio: 'Dans cette chronologie, Oulough Beg a quitté Samarcande sain et sauf à l''automne 1449 et a vécu.'
    vignettes:
      source: '{staff} ajoute une origine à en-tête de colonne étroite à la feuille du copiste, de sorte qu''une position prise dans l''ancienne table et une position mesurée ce soir ne se trouvent pas sur la même ligne.'
      arc: '{staff} pose une corde le long de la courbe de la tranchée pour l''arc et la fait marcher bout à bout avec les maçons, pour voir que la courbe est vraie.'
      hold: '{staff} s''assoit près de l''arc avec un brasier et une planche, et écrit une lecture à chaque fois qu''il est appelé, jusqu''à ce que l''étoile s''enfonce sous le mur.'
  darwin_galapagos:
    name: 'Les îles et la diversité du vivant'
    place: 'Îles Galápagos'
    figure: 'Charles Darwin'
    story: 'Darwin visita les Galápagos à bord du Beagle de septembre à octobre 1835. Sur l''île Charles, le vice-gouverneur Lawson lui dit que les tortues différaient d''une île à l''autre ; Darwin écrivit plus tard qu''il n''y prêtait pas suffisamment attention à l''époque et qu''il avait déjà mélangé les collections de deux îles. Du 8 au 17 octobre, lui, Bynoe et leurs serviteurs campèrent sur l''île James pendant que le navire partait chercher de l''eau, avec seulement une pauvre petite source près de la tente. Ses notes d''oiseaux associent des spécimens d''oiseaux moqueurs à des îles particulières.'
    story_prose:
      opening:
        - 'Le Beagle a déposé le groupe de Darwin à terre et est allé se baigner ailleurs. Les tentes sur l''île James viennent juste d''être montées. Une petite source près du camp coule lentement et deux étiquettes d''oiseaux ont été écrites sur le même morceau de papier.'
        - 'En 1835, le gouverneur par intérim Lawson déclara à Darwin que les tortues des îles pouvaient être distinguées. Darwin écrivit plus tard qu''il n''y avait pas prêté suffisamment attention. Le groupe de l''île James attendait le navire avec peu d''eau. Vous pouvez conserver les distinctions plus tôt et aider l''équipe à terre à terminer sa collecte.'
        - 'Quelqu''un qui observe les spécimens et les étiquettes peut entendre Lawson avec Darwin. Pour l''île James, envoyez quelqu''un qui peut aider l''équipe à terre avec de l''eau et des fournitures de camp.'
      points:
        p1: 'Le flacon est presque vide et deux personnes attendent toujours au printemps. Vous comptez la quantité d''eau qui reste et combien de personnes en ont besoin, puis demandez au guide de parler aux hommes qui ont apporté de l''eau plus tôt. Une fois l''eau arrivée, Bynoe demande que les paquets restants soient ramenés de la tente. Quand le navire rentre dans la baie, les derniers paquets attendent près des gourdes vides.'
        p2: 'Lawson dit qu''il peut reconnaître l''île à la forme de la carapace d''une tortue. Darwin demande un nom de lieu et s''apprête à continuer son chemin. Vous ouvrez deux paquets de spécimens et relisez où il les a collectés. Les endroits qu''il ne peut pas confirmer sont laissés à vérifier, et les spécimens ultérieurs sont envoyés dans des emballages séparés. Une ficelle neuve entoure le premier paquet. Le nom de l’île est inscrit à l’extérieur.'
      outcomes:
        all: 'Les noms et les paquets séparés peuvent être vérifiés les uns par rapport aux autres. Le groupe de James Island revient également au navire une fois la collecte terminée.'
        p1: 'La fête à terre dure jusqu''au retour du navire et au chargement des spécimens. Certaines des anciennes étiquettes insulaires restent incertaines.'
        p2: 'Une partie du registre insulaire est conservée à part. Le camp échoue plus tard et le voyage conserve ce moment de vérification des noms sur Charles Island.'
      none: 'Les flacons de la source sont toujours les seuls au camp, et les premiers paquets portent encore des noms incertains.'
      not_admitted: 'Le visiteur est absent de la liste à terre. Un paquet est déjà dans le bateau et l''étiquette n''est pas lisible depuis le pont.'
      desync: 'Le camp manque d''eau avant que la collecte sur l''île James puisse être terminée. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quand le navire rentre dans la baie, les derniers paquets attendent près des gourdes vides.'
        p2: 'Une ficelle neuve entoure le premier paquet. Le nom de l’île est inscrit à l’extérieur.'
    relic: 'Une plume de pinson'
    relic_desc: 'Une petite plume brune des îles.'
    points:
      p1: 'Sur l''île James, où le camp dispose d''une pauvre petite source, continuez l''équipe à terre jusqu''au retour du navire et assistez à la collecte de l''île.'
      p2: 'Lorsque Lawson dit que les tortues diffèrent d''une île à l''autre, faites en sorte que Darwin en prenne note sur-le-champ et gardez les oiseaux de chaque île étiquetés et emballés à part.'
    points_fail:
      p1: 'L''équipe à terre manque d''eau et la collecte sur l''île James n''a jamais lieu. Cette branche est sortie de l''histoire et le bureau rappelle l''employé ce jour-là.'
      p2: 'Comme dans l’histoire, Darwin accorde peu d’attention à Lawson. Les collections des îles Chatham et Charles sont déjà mixtes et la plupart des pinsons ne portent aucune île.'
    shift:
      p1:
        was: '8 au 17 octobre 1835 : Darwin, Bynoe et leurs serviteurs campèrent sur l''île James avec une tente et des provisions pendant que le Beagle allait chercher de l''eau ; près du camp, il n''y avait qu''une pauvre petite source.'
      p2:
        was: 'Fin septembre 1835 : sur l''île Charles, le vice-gouverneur Lawson dit à Darwin que les tortues de chaque île pouvaient être distinguées. Darwin écrivit plus tard qu''il n''y avait pas prêté suffisamment d''attention, qu''il avait déjà mélangé les collections de deux îles et qu''il avait mélangé la plupart de ses pinsons.'
        now: 'Il a pris Lawson au mot ce jour-là et a ramené les oiseaux de chaque île en Angleterre, étiquetés et emballés à part.'
        who: 'darwin_galapagos'
        bio: 'Dans cette chronologie, Darwin a écouté Lawson sur les Galápagos, et a collecté et étiqueté les pinsons et les moqueurs île par île avant de les ramener chez lui en Angleterre.'
    vignettes:
      two_tags: "Une balise indique uniquement «\_île\_». Vous le mettez de côté jusqu'à ce que l'assistant puisse trouver la note d'atterrissage séparée. Les deux spécimens restent séparés même une fois les plateaux rangés."
      differences: 'L''assistant montre du doigt deux oiseaux d''apparence similaire et souhaite une entrée pour les deux. Vous demandez de quelle île chacun vient. Ils laissent les deux étiquettes dans le livre afin que la ressemblance puisse être réexaminée plus tard.'
      drawer: 'Vous conservez l’étiquette en papier à côté du plateau jusqu’à ce que l’assistant puisse vous relire le nom. Lorsqu''ils ferment le tiroir, le billet reste à sa place.'
  finlay_havana:
    name: 'Les moustiques et la fièvre jaune'
    place: 'La Havane'
    figure: 'Carlos Finlay'
    story: 'Carlos Finlay a présenté l''hypothèse des moustiques pour la transmission de la fièvre jaune à La Havane en 1881. Le titre de son article l''identifie comme une hypothèse.'
    story_prose:
      opening:
        - 'Il fait encore chaud à La Havane. Finlay place le document qu''il a l''intention de lire près du pupitre et conserve ses notes sous une lettre. Quelqu''un vient prendre la première ligne pour inscrire l''ordre du jour. Finlay prononce distinctement le mot « hypothétiquement ».'
        - 'Le 14 août 1881, Finlay présenta son hypothèse de moustique pour la fièvre jaune à l''académie de La Havane. L’action de la ville contre les moustiques a suivi bien plus tard. Cette branche peut préserver la lecture et demander aux membres d''évaluer dans quelle mesure les documents soutiennent ce qu''il propose.'
        - 'Quelqu''un qui connaît bien les documents peut vérifier la copie pour l''académie. Quelqu''un qui peut organiser une discussion peut faire en sorte que les membres l''examinent et apportent une proposition publique de lutte contre les moustiques à la ville.'
      points:
        p1: 'Le greffier dit qu''une page n''a jamais été vérifiée et ne peut pas être ajoutée avec le reste. Vous comparez les emballages avec la liste de Finlay et trouvez la feuille manquante dans le pli autour des caisses. Finlay referme la copie de lecture. Quand vient son tour, le secrétaire lit le titre inscrit sur la feuille que Finlay tient en main.'
        p2: 'Le député le plus proche de la porte a déjà son chapeau après la lecture. Vous lui demandez d''entendre une phrase supplémentaire et de dire quel disque il aimerait réviser. Il s''assoit et pose des questions sur un cas. Un autre membre met une date en marge pour son retour. Finlay lève les feuilles en question et attend que tous deux voient desquelles il parle.'
        p3: 'La copie pour la ville commence par qualifier la théorie d''établie. Vous demandez à Finlay de lister les observations séparément des questions restant à vérifier. Le comité municipal accepte de financer un essai antérieur de lutte publique contre les moustiques. Avant d’apposer le cachet, le secrétaire rétablit le mot « hypothèse » sur la feuille.'
      outcomes:
        all: 'Le document est entendu et les affaires font l''objet d''une seconde lecture. La lutte publique contre les moustiques commence plus tôt dans cette branche, mais les résultats restent à voir.'
        p1: 'L''académie entend le document et dépose la copie. Les membres n''ont pas encore décidé s''ils donneront suite à cette décision.'
        p2: 'Quelques auditeurs restent pour poser des questions sur les disques. Une date de révision figure dans les notes. La ville n''a pas encore agi.'
        p3: 'La proposition d''un procès municipal obtient une réponse. Le rapport enregistre les actions antérieures dans cette branche.'
      none: 'La salle se vide. Personne n''a indiqué de date pour une deuxième discussion.'
      not_admitted: 'Seules les personnes inscrites à l''ordre du jour sont admises. De l''extérieur, vous entendez le greffier annoncer le premier point.'
      desync: 'La copie de lecture ne peut pas être assemblée. L’académie n’entend pas le journal de Finlay le 14 août et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Quand vient son tour, le secrétaire lit le titre inscrit sur la feuille que Finlay tient en main.'
        p2: 'Finlay lève les feuilles en question et attend que tous deux voient desquelles il parle.'
        p3: 'Avant d’apposer le cachet, le secrétaire rétablit le mot « hypothèse » sur la feuille.'
    relic: 'Une lame de verre de moustiques'
    relic_desc: 'Un toboggan monté avec une aile anti-moustique.'
    points:
      p1: 'Pendant la saison fébrile, conservez en lieu sûr son article et ses notes de cas, afin qu''il puisse le lire à l''Académie le 14 août comme prévu.'
      p2: 'Après la lecture, persuadez quelques membres de l''Académie de rester et d''examiner ses cas, afin que le journal ne soit pas laissé de côté en silence.'
      p3: 'Aidez-le à mettre les moustiques et les cas en évidence pour que la ville commence à lutter contre les moustiques des années plus tôt.'
    points_fail:
      p1: 'Les notes de cas ont été perdues pendant la saison fébrile et le journal n''a pas été lu le 14 août. Cette branche s''est détachée de l''histoire et le bureau a rappelé l''employé.'
      p2: 'La salle est restée silencieuse et personne n’a demandé à voir un seul cas. Dans cette branche, le journal était mis de côté, comme c''était le cas dans l''histoire.'
      p3: 'Ses preuves sont restées aussi minces qu''auparavant. Dans cette branche, la ville attendait encore une vingtaine d''années avant d''agir contre le moustique, et jusque-là la fièvre revenait chaque été.'
    shift:
      p1:
        was: 'Le 14 août 1881, Carlos Finlay lut son article sur le moustique comme agent hypothétique de la fièvre jaune à l''Académie royale des sciences de La Havane.'
      p2:
        was: 'Le 14 août 1881, sa lecture fut accueillie par le silence et, pendant des années, l''idée fut ridiculisée.'
        now: 'Quelques membres sont restés sur place ce soir-là et ont demandé à voir ses notes de cas.'
      p3:
        was: 'À partir de 1881, Finlay passa près de vingt ans à tenter de prouver que le moustique était porteur de la fièvre jaune ; ce n’est qu’en 1900 que l’armée américaine, en utilisant des moustiques issus de ses œufs, a montré qu’il avait raison.'
        now: '{staff} l''a aidé à placer les moustiques et les valises côte à côte jusqu''à ce que les preuves soient réunies. À cette époque, La Havane avait commencé à lutter contre les moustiques des années plus tôt, et la fièvre avait quitté la ville plus tôt. On croyait Finlay à son époque.'
        who: 'finlay_havana'
        bio: 'C’est dans cette optique que l’idée de Finlay sur les moustiques fut acceptée quelques années après 1881, et La Havane y donna suite bien avant 1900.'
    vignettes:
      headline: 'Un éditeur fictif transforme une suggestion en certitude dans le titre. Vous relisez lentement le titre. Ils remettent le mot hypothèse avant de transmettre la preuve.'
      columns: 'L''éditeur lit leurs notes comme si chaque ligne signifiait la même chose. Vous réglez deux colonnes pour ce qui a été observé et ce qui a été proposé. Une phrase change de colonne.'
      place: 'Vous vérifiez le nom du lieu où le journal a été lu. L''éditeur le met à côté de la date, afin que le rapport ne transforme pas la réunion en une autre.'
  humboldt_chimborazo:
    name: 'La crevasse au-dessus de la limite des neiges'
    place: 'Chimborazo, Équateur'
    figure: 'Alexander von Humboldt'
    story: 'Le 23 juin 1802, Humboldt gravit le Chimborazo avec Aimé Bonpland et Carlos Montúfar. Les porteurs n''iraient pas plus loin ; Les trois hommes continuèrent à souffrir de saignements de nez, de vomissements et de vertiges, jusqu''à ce qu''un profond ravin au-dessous du sommet les arrête et ils rebroussèrent chemin.'
    story_prose:
      opening:
        - 'Au-dessus de la limite des neiges du Chimborazo, Bonpland tend le baromètre à Humboldt pour libérer une main pour son sac. Montúfar s''arrête là où il peut voir devant lui. Vous ne pouvez pas voir l’autre côté du ravin qu’il désigne jusqu’à ce que le nuage bouge.'
        - 'Le 23 juin 1802, le groupe de Humboldt gravit le Chimborazo et fit demi-tour dans un ravin profond. Cette branche permet au groupe de trouver un moyen de continuer. Un rapport de sommet ne compte qu''une fois que tout le monde est descendu.'
        - 'Envoyez quelqu''un qui puisse s''occuper des compagnons en altitude. Même avec du matériel de bureau à disposition, demandez à chacun des grimpeurs s''il souhaite continuer.'
      points:
        p1: 'Quelqu’un s’approche du bord de la neige et revient pour dire à Humboldt qu’il n’y a nulle part où se tenir fermement. Vous laissez le groupe se reposer sur un terrain sûr jusqu''à ce que les autres aient examiné le terrain et que chacun puisse décider de continuer ou non. Humboldt et Bonpland portent l''instrument à tour de rôle. Montúfar reste là où il peut les voir tous les deux sur le chemin du retour. Ils attendent de retrouver le rocher où ils se sont reposés pour sortir la demi-page écrite au sommet.'
      outcomes:
        all: 'Tous les grimpeurs atteignent le sommet et retournent à leur lieu de repos. Le rapport donne l''heure à laquelle ils sont descendus à côté de l''entrée du sommet.'
        p1: 'Le groupe remonte par le chemin trouvé dans cette branche et revient dans l''ordre convenu avant la montée.'
      none: 'Le groupe voit le ravin et fait demi-tour. Là où les autres attendent, ses enregistrements donnent la hauteur réellement atteinte et ce qu''ils ont pu voir.'
      not_admitted: 'Il n''y avait plus de place pour le visiteur lorsque le groupe est parti. Vous recevez ci-dessous un étui d''instrument vide.'
      excerpts:
        p1: 'Ils attendent de retrouver le rocher où ils se sont reposés pour sortir la demi-page écrite au sommet.'
    relic: 'Un baromètre'
    relic_desc: 'Un baromètre à mercure avec des hauteurs marquées sur le verre.'
    points:
      p1: 'Avant que le profond ravin ne bloque le chemin le 23 juin, aidez le groupe à résister au mal des montagnes, à trouver un chemin pour traverser, atteindre le sommet du Chimborazo et redescendre sain et sauf.'
    points_fail:
      p1: 'Comme dans l''histoire, ils font demi-tour au ravin, en contrebas du sommet.'
    shift:
      p1:
        was: '23 juin 1802 : Humboldt, Bonpland et Carlos Montúfar gravissent le Chimborazo avec des saignements de nez, des vomissements et des étourdissements, jusqu''à ce qu''un ravin profond sous le sommet les arrête et ils fassent demi-tour.'
        now: 'Ils traversèrent le ravin, se tinrent au sommet du Chimborazo et redescendirent sains et saufs au camp.'
        who: 'humboldt_chimborazo'
        bio: 'Dans cette chronologie, Humboldt atteignit le sommet du Chimborazo avec Bonpland et Montúfar le 23 juin 1802 et en descendit sain et sauf.'
    vignettes:
      turn: 'Un lecteur fictif a dessiné le sommet à la fin du parcours. Vous demandez où s''arrête le journal décrivant l''ascension. Ils déplacent leur dernière marque vers le bas de la pente et laissent le sommet intact.'
      units: 'Le lecteur souhaite copier une hauteur sans son unité. Vous le conservez attaché à la mesure originale et laissez de la place pour une conversion moderne séparée.'
      names: 'Vous demandez au lecteur de laisser un espace à côté de Humboldt pour les noms des autres voyageurs. Une fois la note pliée, la liste suit toujours le récit de la tentative du jour.'
  ibn_khaldun_cairo:
    name: 'Le navire au large d’Alexandrie'
    place: 'Le Caire'
    figure: 'Ibn Khaldoun'
    story: 'Ibn Khaldoun vint au Caire en 1382 à l''invitation du sultan Barquq. En 1384, le sultan demanda au souverain de Tunis de laisser sa famille le suivre et, le 8 août, le nomma juge en chef de l''école malikite, un poste élevé pour un nouveau venu de l''ouest, et les rivaux de la ville se mirent bientôt au travail pour le renverser. Cette année-là, le navire qui transportait sa femme et ses filles fit naufrage à Alexandrie. Dans la Muqaddimah, il demande aux historiens de comparer les rapports à ce qui pourrait se produire dans la société qu''ils décrivent.'
    story_prose:
      opening:
        - 'Au Caire, un employé dépose un rendez-vous et une liste de noms à vérifier sur le même bureau. Ibn Khaldoun demande qui attend dehors. Il attend lui-même une autre lettre, lui annonçant que le navire amène sa femme et ses filles de Tunis.'
        - 'En 1384, Ibn Khaldoun devint juge en chef au Caire. Le navire transportant sa femme et ses filles fut ensuite perdu à Alexandrie. Lors de ce voyage, vous pourrez respecter le rendez-vous et vous rendre au port pour aider les personnes à bord du navire à atteindre le rivage.'
        - 'Faites appel à quelqu''un qui peut vérifier les documents auprès d''un commis au Caire. Envoyez à Alexandrie un voyageur capable de travailler avec les marins et d''aider les gens à terre.'
      points:
        p1: 'Le greffier dit que le nom doit être copié à nouveau et veut attendre qu''un autre fonctionnaire dise à qui il appartient. Vous lui demandez de lire le rendez-vous qu''ils ont déjà et de le comparer avec ce que dit le visiteur. A la ligne de date, le porteur lit le nom complet d’Ibn Khaldoun. Le commis reprend l’acte de nomination au bord de la table et le remet dans le courrier du jour.'
        p2: 'Quelqu''un au port annonce qu''il aperçoit une personne, puis la perd de vue dans l''eau. Vous demandez aux spectateurs de continuer à pointer au même endroit et de faire de la place aux marins déjà en sortie. Lorsque l’épouse et les filles d’Ibn Khaldoun atteignent le rivage, la personne qui attend à la porte demande où doit passer la nouvelle en premier. La lettre pour Le Caire attend qu’ils puissent répondre de vive voix.'
      outcomes:
        all: 'Ibn Khaldoun prend ce poste comme dans l''histoire. Une nouvelle urgente vient du port indiquant que sa famille est à terre. Dans cette agence, l''homme qui attend au Caire reçoit un message différent.'
        p1: 'Le rendez-vous sort le jour enregistré. Le navire est toujours perdu à Alexandrie et sa famille n''atteint pas le Caire.'
        p2: 'Sa femme et ses filles ont des gens pour les aider au port. Le rendez-vous n’est plus synchronisé, mais la scène de leur sauvetage peut toujours être enregistrée.'
      none: 'Les gens attendent au Caire un document et au port que le vent se calme. La lettre disant que sa famille est en sécurité n''est jamais écrite.'
      not_admitted: 'Personne n''admet la personne qui attend à la porte pour remettre le rendez-vous. Les nouvelles du navire ne sont pas parvenues dans la salle.'
      desync: 'La nomination destinée à Ibn Khaldoun revient à quelqu''un d''autre. Le bureau rappelle le voyageur lorsque le dossier n''est plus synchronisé.'
      excerpts:
        p1: 'Le commis reprend l’acte de nomination au bord de la table et le remet dans le courrier du jour.'
        p2: 'La lettre pour Le Caire attend qu’ils puissent répondre de vive voix.'
    relic: 'Un rapport vérifié'
    relic_desc: 'Un récit d''une procession, avec l''endroit où se tenait le guetteur écrit en marge.'
    points:
      p1: 'Quand ses rivaux s''apprêtent à écarter le nouveau juge, conserver sa nomination au poste de juge en chef de l''école malikite le 8 août'
      p2: 'Lorsque le navire transportant sa femme et ses filles coule à Alexandrie, sortez de l''eau les personnes à bord et sauvez-les.'
    points_fail:
      p1: 'Dans cette branche, la nomination du 8 août a été attribuée à quelqu''un d''autre. Cette branche est sortie de l''histoire et le bureau rappelle l''employé ce jour-là.'
      p2: 'Comme dans l''histoire, le navire coule à Alexandrie avec tout le monde à bord, et sa femme et ses filles n''atteignent pas le Caire.'
    shift:
      p1:
        was: '8 août 1384 : le sultan Barquq nomme Ibn Khaldoun juge en chef de l''école malikite du Caire ; les rivaux de la ville travaillèrent contre lui et il perdit le poste l''année suivante.'
      p2:
        was: '1384 : le navire transportant de Tunis l''épouse et les filles d''Ibn Khaldoun coule à Alexandrie et personne à bord ne survit.'
        now: 'Les personnes à bord du navire ont été retirées de l''eau à Alexandrie. Sa femme et ses filles sont venues au Caire et la famille a de nouveau vécu ensemble.'
        who: 'ibn_khaldun_cairo'
        bio: 'Dans cette chronologie, le navire qui a coulé à Alexandrie en 1384 n''a pas emmené sa famille avec lui : sa femme et ses filles ont été sauvées et l''ont rejoint au Caire.'
    vignettes:
      gate: '{staff} demande à un employé, rattrapé pour le match, combien de temps la porte est restée ouverte pendant que la foule passait. Il écrit le procès-verbal dans la marge à côté du total, puis modifie le total en estimation.'
      two: '{staff} donne à un deuxième observateur, constitué pour le jeu, sa propre feuille, afin que son récit de la rue ne finisse pas coincé dans la marge du sien.'
      copy: '{staff} copie une page de la Muqaddimah pour un étudiant de la cour et laisse la largeur d''un doigt entre les lignes, pour les notes que l''étudiant voudra prendre.'
  lili_boulanger_paris:
    name: 'Les parties étalées sur la table'
    place: 'Mézy-sur-Seine'
    figure: 'Lili Boulanger'
    story: 'Lili Boulanger tombe gravement malade à l''hiver 1918 à Mézy-sur-Seine. Les récits de son dernier travail la décrivent en train de dicter Pie Jesu à sa sœur Nadia. La partition fait appel à la voix, au quatuor à cordes, à la harpe et à l''orgue. Lili est décédée le 15 mars, à l''âge de vingt-quatre ans.'
    story_prose:
      opening:
        - 'Il y a deux piles sur la table à musique, la copie au net et les pages en attente de dictée. Nadia vient de rédiger un mot lorsque Lili lui demande de poser le stylo. À travers le papier fin, il est difficile de lire la dernière mesure écrite.'
        - 'Durant sa dernière maladie, Lili Boulanger dicta la musique de Pie Jesu à sa sœur Nadia. Lili est décédée le 15 mars 1918. Ici, elle peut faire une pause à son rythme et se faire relire où elle s''est arrêtée lorsqu''elle souhaite continuer.'
        - 'Quelqu’un qui lit de la musique peut marquer la place de Nadia. Laissez Lili dire quand elle sera prête avant de relire le passage.'
      points:
        p1: 'Nadia commence à tourner la page. Lili lui demande d''attendre. Vous placez une feuille étroite où ils peuvent tous deux voir la dernière barre. La pièce est calme pendant un moment. Une fois que Lili parle, vous comptez à rebours les battements marqués par Nadia. Lili change une note. Nadia reprend au même endroit.'
      outcomes:
        all: 'Lili décide quand continuer. Les passages qu''elle a dictés restent sur la table, et le dernier disque marque encore sa mort le 15 mars.'
        p1: 'Nadia revient à l''endroit indiqué quand Lili est prête. Cette fois, Lili n''a pas besoin de répéter le passage qu''elle a dicté avant la pause.'
      none: 'Après la pause, les sœurs doivent encore trouver leur place. Lili profite d''un peu de temps pour dicter à nouveau un passage.'
      not_admitted: 'Nadia demande au visiteur d''attendre dehors et de garder le passage silencieux. Seules les sœurs entendent la dernière phrase avant de s''arrêter.'
      excerpts:
        p1: 'Lili change une note. Nadia reprend au même endroit.'
    relic: 'Un marqueur de papier étroit'
    relic_desc: 'Un bordereau inventé marquant la mesure où s''arrêtait la dictée.'
    points:
      p1: 'Quand Lili demande une pause, marquez la place pour Nadia et relisez le dernier passage quand Lili veut recommencer.'
    points_fail:
      p1: 'Après s''être arrêtées, les sœurs doivent retrouver leur place. Lili passe une partie du temps qui lui reste ce jour-là à répéter ce qu''elle a déjà donné à Nadia.'
    shift:
      p1:
        was: 'Les récits de Pie Jesu décrivent Nadia aidant Lili à écrire la musique alors que Lili était très malade.'
        now: 'Dans cette branche, {staff} garde sa place lorsque Lili s''arrête. Lorsqu''elle est prête, Nadia relit le dernier passage et sa sœur peut commencer exactement là où elle a choisi de s''arrêter.'
    vignettes:
      entry: '{staff} demande à Nadia de pointer vers la note la plus récente avant que la page ne soit tournée. Elle garde un doigt sur cette ligne tout en vérifiant la voix au-dessus.'
      visitor: 'Une personne à la porte demande combien de musique il reste. {staff} garde la question en dehors pendant que Lili décide si elle doit se reposer.'
      stand: '{staff} laisse la place à Nadia de poser son stylo sans couvrir le score.'
  jianzhen_nara:
    name: 'Le long chemin du retour vers Yangzhou'
    place: 'Lingnan'
    figure: 'Jianzhen'
    story: 'La cinquième tentative de Jianzhen de naviguer vers le Japon l''a amené à Hainan. Sur le long chemin du retour, Eiei, un moine venu lui demander de voyager au Japon, tomba malade et mourut à Duanzhou. Jianzhen a perdu la vue pendant le voyage. Les récits donnent des explications différentes.'
    story_prose:
      opening:
        - 'À Duanzhou, un compagnon dépose les papiers d''itinéraire nouvellement copiés près de la porte. Quelqu’un dans la chambre d’Eiei a demandé aux personnes apportant des messages d’attendre. Jianzhen vient lui demander s''il peut s''asseoir à l''intérieur pendant un petit moment.'
        - 'Le récit des voyages de Jianzhen rapporte la mort d''Eeii à Duanzhou. La vue de Jianzhen s''est ensuite détériorée et le groupe est retourné vers Yangzhou. Cette branche prend deux petits instants du voyage. Vous pouvez donner aux deux hommes le temps de parler et lire plus tard la route vers Jianzhen.'
        - 'Une personne ayant de l’expérience dans le domaine des soins peut demander ce que veut Eiei. Un voyageur capable de lire les journaux et d''écouter différentes personnes peut plus tard lire l''itinéraire vers Jianzhen, étape par étape.'
      points:
        p1: 'Après que la personne qui demande le départ soit partie, vous demandez à Eiei s''il veut que Jianzhen entre. Il hoche la tête et demande un tabouret qui laisse la porte dégagée. Vous vous mettez d''accord avec les autres pour retenir leurs messages, puis attendez dans la cour. De l’intérieur viennent deux voix. Quand elles baissent, personne ne presse ceux qui parlent.'
        p2: 'Les papiers sont pliés en une pile et un compagnon est sur le point d''indiquer à Jianzhen l''itinéraire qu''il a choisi. Vous lisez à haute voix les arrêts encore en question et indiquez où le groupe pourrait devoir passer la nuit. Jianzhen demande à nouveau un nom avant de dire quelle étape il souhaite franchir en premier. Quelqu’un inscrit son choix sur la feuille où ne figuraient jusque-là que des noms de lieux.'
      outcomes:
        all: 'Les deux hommes ont le temps de parler. Eiei meurt toujours à Duanzhou. Plus tard, lorsque Jianzhen ne peut pas lire les journaux, ils empruntent un itinéraire qu''il a entendu à haute voix.'
        p1: 'Les deux hommes parviennent à se rencontrer. Eiei meurt toujours, et les derniers papiers d''itinéraire auront besoin de quelqu''un pour les expliquer à Jianzhen.'
        p2: 'Jianzhen entend les prochaines étapes et décide lui-même où il veut aller. L’occasion de passer du temps avec Eiei est déjà passée.'
      none: 'Les papiers de route retournent dans leur liasse. Les messages dans la pièce et dans les lieux à venir attendent toujours que quelqu''un les lise.'
      not_admitted: 'Vous n’entrez jamais dans la pièce où réside Eiei. Les journaux sont emportés et personne ne les lit à la porte.'
      excerpts:
        p1: 'De l’intérieur viennent deux voix. Quand elles baissent, personne ne presse ceux qui parlent.'
        p2: 'Quelqu’un inscrit son choix sur la feuille où ne figuraient jusque-là que des noms de lieux.'
    relic: 'Une feuille de notes de route'
    relic_desc: 'Une feuille inventée du voyage du groupe vers le nord.'
    points:
      p1: 'À Duanzhou, demandez comment Eiei souhaite être soigné et prenez le temps de parler avec Jianzhen.'
      p2: 'Alors que la vue de Jianzhen échoue, demandez au parti de lire ses plans à haute voix afin qu''il puisse décider comment il veut continuer.'
    points_fail:
      p1: 'Il y a toujours autre chose à régler et les personnes au chevet sont sans cesse rappelées. Le temps de parler passe.'
      p2: 'Le groupe rassemble à nouveau les notes de route dans un paquet. Jianzhen doit attendre que quelqu''un lui dise ce qu''il y a sur la page.'
    shift:
      p1:
        was: 'Eiei tomba malade et mourut à Duanzhou lors du voyage de retour après la cinquième tentative de navigation vers le Japon.'
        now: 'Dans cette branche, {staff} reste avec Eiei à Duanzhou et appelle Jianzhen au chevet. Ils ont le temps de parler en privé.'
      p2:
        was: 'Les récits disent que Jianzhen a perdu la vue au cours de ce voyage. Il s''embarqua ensuite pour le Japon.'
        now: 'Dans cette branche, {staff} lit les prochains arrêts. Jianzhen demande aux autres de changer d''arrêt et leur dit quand il souhaite repartir.'
    vignettes:
      sound: 'Un compagnon montre la prochaine ville sur la feuille. {staff} demande que le nom soit lu deux fois pendant que Jianzhen écoute.'
      tie: 'Le parti est sur le point de fermer les journaux de route. {staff} maintient le paquet ouvert jusqu''à ce que quelqu''un vérifie l''ordre des arrêts.'
      temple: '{staff} répond à une question dans la cour afin que les personnes à l''intérieur puissent finir de parler sans élever la voix.'
  sei_shonagon_kyoto:
    name: 'L’hiver où l’impératrice devait accoucher'
    place: 'Kyoto'
    figure: 'Sei Shōnagon'
    story: 'Sei Shōnagon a servi l''impératrice Teishi et a ensuite écrit sur la vie autour d''elle dans The Pillow Book. Vers la fin de la deuxième année de Chōhō, Teishi donna naissance à une fille, la princesse Bishi, et mourut peu de temps après.'
    story_prose:
      opening:
        - 'L''hiver est arrivé à Kyoto et il y a un coussin supplémentaire près du paravent. Sei Shōnagon demande qui devrait le prendre. Un messager arrive pendant qu''elle parle. Teishi regarde la place vide alors que le messager est toujours là.'
        - 'Teishi s''est préparé à accoucher vers la fin de l''an 1000 et est décédé le 13 janvier 1001 selon le calendrier converti. Sei Shōnagon écrivit plus tard sur la vie à sa cour dans The Pillow Book. Ici, vous pouvez demander qui Teishi veut à proximité et faire de la place aux personnes qu''elle choisit.'
        - 'Envoyez un voyageur qui l''écoutera avec Shōnagon. Quelqu''un d''autre peut répondre au prochain message depuis l''extérieur pendant que Teishi parle.'
      points:
        p1: 'Shōnagon ramasse le coussin pour le remettre à sa place habituelle. Vous attendez que le messager ait fini, puis lui demandez de découvrir qui Teishi veut voir. Teishi nomme une personne et lui demande de s''asseoir un peu derrière la lampe. Shōnagon pose le coussin là où elle le montre. Quand le calme revient, la personne que Teishi a demandée est assise et Teishi a posé sa main là où elle le voulait.'
      outcomes:
        all: 'La personne qu’elle a demandé à voir reste proche. Teishi meurt toujours et le rapport préserve le moment où elle a choisi qui s''assoirait avec elle.'
        p1: 'Shōnagon garde le coussin libre jusqu''à ce que la personne choisie par Teishi arrive. Le dernier disque suit sa vie historique.'
      none: 'Un message après l’autre atteint la porte. Le coussin va à la première personne présentée avant que quiconque puisse demander à Teishi qui elle voulait.'
      not_admitted: 'Personne ne vous appelle. Quelqu’un déplace un coussin au-delà de l’écran. De l’extérieur, on ne voit pas à qui c’était.'
      excerpts:
        p1: 'Quand le calme revient, la personne que Teishi a demandée est assise et Teishi a posé sa main là où elle le voulait.'
    relic: 'Une note pliée pour le ménage'
    relic_desc: 'Une note inventée nommant qui devrait être montré dans la pièce.'
    points:
      p1: 'Demandez qui Teishi veut près d''elle alors qu''elle se prépare à accoucher et aidez Shōnagon à faire de la place pour ces personnes.'
    points_fail:
      p1: 'Quelqu''un est à la porte avec le message suivant avant qu''il soit temps de demander qui Teishi veut à côté d''elle.'
    shift:
      p1:
        was: 'Les chroniques judiciaires font état de la naissance de la princesse Bishi et de la mort de Teishi peu après.'
        now: 'Dans cette branche, {staff} garde les autres visiteurs à la porte jusqu''à ce que Teishi dise qui elle veut voir. Shōnagon a le temps d''écouter avant de transmettre le message suivant.'
    vignettes:
      compare: '{staff} demande au messager de lire clairement un nom avant de plier le message. Shōnagon peut désormais le transmettre sans demander à nouveau.'
      colour: 'Shōnagon déplace la lampe pour voir l''espace derrière elle. {staff} déplace le coussin de rechange à l''endroit indiqué par Teishi.'
      listen: '{staff} attend que le message à la porte ait reçu une réponse avant de demander si la pièce a besoin d''autre chose.'
  ibn_rushd_lucena:
    name: 'Avant l’ordre de brûler les livres'
    place: 'Cordoue'
    figure: 'Ibn Rushd'
    story: 'Vers 1195, Ibn Rushd tomba en disgrâce auprès de la cour almohade et fut envoyé en exil à Lucena. Les comptes enregistrent la condamnation et l''incendie de livres. Le texte arabe de son Long Commentaire sur la Physique d’Aristote est perdu, bien que des traductions survivent en hébreu et en latin.'
    story_prose:
      opening:
        - 'Deux messages attendent encore sur une table de Cordoue, l''un d''eux adressé à Lucena. Un lecteur demande si Ibn Rushd répondra toujours. Il dresse un long commentaire sur la Physique vers le copiste et lui montre un endroit où il manque un mot.'
        - 'Ibn Rushd fut envoyé en exil à Lucena vers 1195. Des récits ultérieurs font état de restrictions sur les livres. Le texte arabe de son Long Commentaire sur la Physique ne survit qu''en partie. Ici, vous pouvez remettre un lecteur en contact avec lui et lui laisser une copie vérifiée d''une section.'
        - 'Mettez quelqu''un qui peut organiser la correspondance en charge des deux adresses. Un lecteur d’arabe ou un copiste attentif peut vérifier où se termine l’original et où commence le commentaire.'
      points:
        p1: 'Le lecteur a écrit plusieurs lignes. Le moment venu, il vous demande de dire seulement qu''il souhaite continuer à lire. À Lucena, vous lisez ces mots à Ibn Rushd et lui dites où envoyer une réponse. Il demande à quelle section le lecteur est parvenu et prend sa propre feuille. Il vous remet deux feuilles pliées et vous demande de les donner à la personne qui lit encore.'
        p2: 'Le copiste a écrit juste au-delà d''un trou. Il dit que le texte a du sens, mais qu''un lecteur de l''original peut nommer la phrase manquante. Vous lui demandez de laisser de la place pour la ligne originale et de copier le commentaire en dessous, puis de relire les deux. Quand la copie arrive au lecteur, il pose un doigt entre les deux passages et dit qu’il peut retrouver lui-même les deux endroits.'
      outcomes:
        all: 'Une réponse passe entre Lucena et Cordoue, et un lecteur fait vérifier une section arabe du commentaire. La perte d''autres pages reste dans les archives historiques.'
        p1: 'Ibn Rushd sait que quelqu''un est encore en train de lire. Sa réponse est rapportée de Lucena, et la copie vérifiée reste inachevée.'
        p2: 'Le lecteur repart avec des pages arabes vérifiées. Le message qu''il voulait envoyer à Lucena attend toujours.'
      none: 'Le message et la page à moitié écrite restent tous deux sur le bureau. Le lecteur attend la prochaine personne.'
      not_admitted: 'Les gens à la porte n''accepteront pas une lettre d''un courrier inconnu. Les paroles du lecteur ne parviennent jamais à Ibn Rushd.'
      excerpts:
        p1: 'Il vous remet deux feuilles pliées et vous demande de les donner à la personne qui lit encore.'
        p2: 'Quand la copie arrive au lecteur, il pose un doigt entre les deux passages et dit qu’il peut retrouver lui-même les deux endroits.'
    relic: 'Extrait d’une pratique de lecture'
    relic_desc: 'Un extrait inventé avec un espace ajouté pour une prémisse.'
    points:
      p1: 'Faites savoir de Cordoue à Ibn Rushd à Lucena qu''un de ses lecteurs souhaite toujours lui écrire et peut recevoir sa réponse.'
      p2: 'Avant que l''ordre n''arrive, comparez une section du commentaire arabe sur la physique avec sa source et laissez un deuxième exemplaire à un lecteur.'
    points_fail:
      p1: 'Le lecteur conserve la note à Cordoue. Ils devront attendre une autre occasion de l''envoyer.'
      p2: 'La copie supplémentaire reste inachevée. Le lecteur n’a pas de pages arabes séparées à emporter.'
    shift:
      p1:
        was: 'Ibn Rushd tomba en disgrâce et fut banni à Lucena avant de retourner à la cour.'
        now: 'Dans cette branche, une note de lecteur lui parvient à Lucena. Il peut répondre pendant qu''ils ont encore un moyen de renvoyer la lettre.'
      p2:
        was: 'Le texte arabe du Long Commentaire sur la Physique d’Ibn Rushd est perdu. Ses traductions médiévales survivent.'
        now: 'Dans cette branche, une section vérifiée reste entre les mains du lecteur jusqu''à la condamnation. Le lecteur peut encore le comparer avec une autre copie en langue originale arabe.'
    vignettes:
      premise: 'Mariam a copié une conclusion dans des lettres soignées. Yusuf ne peut le suivre qu’en supposant quelque chose qu’il n’a pas déclaré. Vous lui demandez où il s''est arrêté et laissez de l''espace avant la conclusion. Mariam écrit son hypothèse dans cet espace, où Yusuf peut la remettre en question.'
      together: 'Yusuf souhaite rendre le livre et n''en garder qu''une seule ligne pour son propre usage. Vous lui laissez le temps de copier l''étape qui va avec. A la porte, Mariam demande à haute voix la conclusion, et il peut désormais lui en donner également la raison.'
      language: 'Vous reconnaissez un terme que les lecteurs ultérieurs rencontreront dans une autre langue. Mariam veut juste savoir si elle a copié le principe tel qu''il est. Vous tenez la page à plat pendant qu''elle la vérifie. La question qu’elle écrit à côté sera adressée à un lecteur que vous ne rencontrerez pas.'
  maya_codices_mani:
    name: 'Se souvenir du pli'
    place: 'Maní'
    figure: 'Scribes mayas'
    story: 'Le 12 juillet 1562, les autorités coloniales brûlèrent en public des livres et d''autres objets mayas à Maní. Les communautés mayas ont continué à créer et à transmettre des connaissances. Rares sont les livres pliants réalisés avant la conquête espagnole qui subsistent.'
    story_prose:
      opening:
        - 'À Maní, dans le Yucatán, un gardien pose un livre plié sur un tapis et le transforme en une page qu''un enfant a lu avec elle. Un visiteur d''un village voisin part aujourd''hui. Avant de partir, il lui demande si elle lui confierait un livre.'
        - 'Un incendie de livres à Maní en juillet 1562 est documenté. Les codex mayas survivants conservent des écrits et des images, dont l''histoire exacte est souvent incertaine. Le gardien ici est fictif et peut choisir quelqu''un pour détenir l''un de ses livres.'
        - 'Envoyez quelqu''un prêt à laisser le gardien montrer comment fonctionnent les pages. Si elle choisit de transmettre un livre, pliez-le comme elle le demande et demandez au destinataire comment les lecteurs pourront le trouver.'
      points:
        p1: 'Le gardien ouvre le deuxième pli et montre une marge qu''un autre lecteur s''est trompée. Vous demandez au destinataire de suivre sa direction afin qu''il puisse voir les deux lecteurs s''arrêter au même endroit. Elle éloigne un livre des autres, l''enveloppe dans un tissu usé et le passe sur le tapis. Le destinataire le tient à deux mains, le temps qu’elle lui explique la marque sur le dernier pli.'
      outcomes:
        all: 'Un livre va à l''endroit choisi par son détenteur. L''incendie de Maní se produit toujours et cette branche conserve le volume unique qu''elle a remis elle-même.'
        p1: 'Le lecteur porte le livre emballé contre sa poitrine. Lorsqu''il s''ouvre à nouveau, il retrouve le deuxième pli comme elle le lui a montré.'
      none: 'Le lecteur rentre chez lui les mains vides. Le gardien déplie le livre et le referme. Elle doit encore décider où il va rester.'
      not_admitted: 'Le gardien n''invite pas le visiteur à toucher les pages. A la porte, on la voit les retourner et continuer à parler avec sa voisine.'
      excerpts:
        p1: 'Le destinataire le tient à deux mains, le temps qu’elle lui explique la marque sur le dernier pli.'
    relic: 'Un pli d''entraînement vierge'
    relic_desc: 'Un pli fictif offert par son gardien.'
    points:
      p1: 'Demandez au gardien quel livre elle souhaite confier à un lecteur de confiance dans un autre village et aidez-la à effectuer cette remise.'
    points_fail:
      p1: 'La personne qu''elle a choisie part sans le livre. Son gardien doit décider où il peut rester.'
    shift:
      p1:
        was: "12 juillet 1562\_: à Maní, de nombreux livres pliants mayas sont brûlés en public. Parmi les livres réalisés avant la conquête, seule une poignée a survécu."
        now: 'Dans cette branche, le gardien choisit qui s''occupera d''un livre. Il atteint le lecteur suivant et reste entre les mains des Mayas jusqu''à l''incendie.'
        who: 'maya_codices_mani'
        bio: 'Dans cette branche, un livre de Maní était transmis à un lecteur choisi par son détenteur avant l''incendie public en 1562.'
    vignettes:
      fold: 'Le gardien dépose deux plis vierges sur un banc et demande à son voisin lequel a ouvert en premier dans le livre dont il se souvient. Vous tenez le papier pendant qu’ils comparent. Il ne peut pas placer le deuxième pli. Elle garde le premier et laisse l''autre en liberté pour la prochaine fois qu''ils parleront.'
      listen: 'Le voisin commence à raconter la partie que le gardien a perdue, mais il se souvient différemment de l''ordre. Vous écoutez pendant que chacun termine. Ils s’accordent sur le premier pli et laissent le second indécis. Le gardien vous demande de lui laisser l''exemplaire qui porte les deux comptes.'
      survive: 'Vous avez vu un codex maya survivant dans une collection ultérieure. La gardienne demande si vous pouvez dire de quel livre sa voisine se souvient. Vous pouvez nommer la collection mais vous ne pouvez pas connecter ses pages à cette pièce. Elle vous tend un pli d''entraînement vierge pour le retour. Le livre dont ils se souvenaient reste avec leur récit.'
  zeami_sado:
    name: 'L’île sur le papier'
    place: 'Île de Sado'
    figure: 'Zeami'
    story: 'Le fils de Zeami, Motomasa, mourut en 1432. Zeami écrivit sa perte à Kyakuraika avant d''être exilé à Sado en 1434. Kintōsho, le recueil de chants qui rappelle son voyage et son exil sur l''île, est daté de 1436.'
    story_prose:
      opening:
        - 'Sur Sado, un lecteur est livré avec une feuille suffisamment petite pour être pliée dans une poche. Zeami l''a déjà entendu s''entraîner deux fois près de la porte, respirant à chaque fois à un moment différent. De son siège, il demande par où le lecteur compte commencer.'
        - 'Zeami fut exilé à Sado plus tard dans sa vie et écrivit sur l''île de Kintōsho. Cette branche lui donne une courte lecture qu''il peut choisir d''entendre et une pause qu''il peut choisir lui-même. Les travaux ultérieurs se déroulent toujours comme ils l''ont été dans l''histoire.'
        - 'Envoyez quelqu''un qui écoutera les mots et leur rythme. Demandez si Zeami veut les entendre et notez la pause qu''il choisit sur son propre feuillet.'
      points:
        p1: 'Le lecteur respire à la fin de la phrase. Zeami lui demande de recommencer au même endroit et lève la main à mi-chemin. Vous regardez où la main arrête les mots et marquez le passage une fois la lecture terminée. À la troisième reprise, le lecteur s’arrête sur ce mot sans baisser les yeux, avant que Zeami ne lève la main.'
      outcomes:
        all: 'Le slip préserve la pause choisie par Zeami après avoir entendu la réplique. Il reste à côté de la page pendant qu''il continue d''écrire sur l''île.'
        p1: 'Zeami a choisi lui-même la pause. Le lecteur dit qu''il apportera la même feuille la prochaine fois.'
      none: 'Le lecteur ne peut pas rester assez longtemps pour être appelé. Sa feuille pliée ne porte toujours aucune marque pour la pause.'
      not_admitted: 'Le visiteur n''a pas encore été invité à lire. Le lecteur plie sa page et s''éloigne de la porte.'
      excerpts:
        p1: 'À la troisième reprise, le lecteur s’arrête sur ce mot sans baisser les yeux, avant que Zeami ne lève la main.'
    relic: 'Un masque Nô'
    relic_desc: 'Un petit masque en bois avec une fine ligne de laque entre les sourcils.'
    points:
      p1: 'Demandez à Zeami s''il souhaite que quelqu''un lui lise une ligne sur Sado. S''il est d''accord, aidez le lecteur à garder sa pause sur une fiche détachable'
    points_fail:
      p1: 'Le lecteur doit partir avant que Zeami puisse entendre la phrase à haute voix. Une marque sur la page devra attendre.'
    shift:
      p1:
        was: 'Les écrits survivants de Zeami incluent la lamentation sur son fils et Kintōsho, qui rappelle son exil sur Sado.'
        now: 'Dans cette branche, Zeami entend un lecteur essayer une de ses lignes de deux manières. Il choisit l''endroit où le lecteur doit s''arrêter et garde le feuillet à côté de sa propre page.'
    vignettes:
      later: 'Vous dites au lecteur que les gens utiliseront encore ce nom dans les livres sur Sado. Il essaie les mots comme un nom de lieu, puis comme quelque chose auquel une personne aspire. Vous marquez les deux pauses sur un bordereau. Le bateau qui a amené Zeami à Sado est déjà parti.'
      mask: 'Le lecteur brandit un masque d''entraînement et perd sa place lorsqu''il l''abaisse. Vous marquez le début de la ligne sur un morceau de papier libre et vous le placez là où il peut le retrouver. Le masque remonte sur son support. Vous manquez la lecture après la vôtre.'
      wind: 'Un courant d’air disperse les fiches de lecture. Vous aidez le lecteur à en récupérer un sous le banc et à le maintenir enfoncé avec un caillou. Il relit cette ligne une fois de plus. Lorsque vous partez, le papier reste sous la pierre et vous emportez la pause dans vos notes.'
  mozart_requiem_vienna:
    name: 'Laisser l’écriture reconnaissable'
    place: 'Vienne'
    figure: 'Wolfgang Amadeus Mozart'
    story: 'Mozart mourut à Vienne en décembre 1791 avec le Requiem incomplet. La Bibliothèque nationale autrichienne conserve du matériel de travail et une partition de livraison avec des contributions de Franz Xaver Süssmayr.'
    story_prose:
      opening:
        - 'À Vienne, un messager cherche la pile la plus soignée sur la table. Mozart demande depuis son lit si les parties instrumentales du début sont toujours là. Constanze demande au messager d''attendre. Certaines des autres pages sont des brouillons qui n’ont pas été rangés.'
        - 'Mozart tomba malade au cours de ses dernières semaines et mourut le 5 décembre 1791. Le Requiem resta inachevé, bien qu''il en ait entièrement composé l''ouverture. Ici, vous pouvez conserver cette section ensemble et demander à un soignant d’apporter la trousse médicale fictive du cabinet.'
        - 'Un lecteur capable de distinguer les parties instrumentales des feuilles de travail peut aider Constanze à les trier. Faites appel à quelqu''un possédant le kit et l''expérience en matière de soins, après avoir demandé à la maison et à Mozart ce qu''il souhaite.'
      points:
        p1: 'Le messager retourne deux feuilles et annonce la même partie pour chacune. Avec Constanze, vous demandez la liasse dont l’orchestration est complète et vérifiez les pages jusqu’à la fin du début du morceau. On isole les ébauches sous une autre étiquette. À la porte, le messager vérifie le contenu et l’extérieur du paquet pour savoir lequel remettre d’abord au copiste.'
        p2: 'Quelqu’un apporte un drap propre au chevet du lit et demande s’il y aura une copie aujourd’hui. Vous expliquez le nécessaire de bureau à Mozart et à sa famille et demandez au copiste d''attendre dans l''autre pièce. Lorsque Mozart se réveille plus tard, sa fièvre est retombée. Il demande qu’on rapproche la table et n’ouvre que la page où il s’est arrêté.'
      outcomes:
        all: 'Les parties d''ouverture peuvent être réutilisées et Mozart peut travailler à table. Les pages qui suivent sont encore vierges lorsque vous partez. Personne ne sait encore comment il les terminera.'
        p1: 'L''ouverture est toujours un paquet complet. Mozart meurt le 5 décembre et la partition restante est laissée à d''autres.'
        p2: 'Mozart récupère, mais l''ouverture originale est dispersée. Cette visite préserve le moment où il se réveille et demande à voir la partition.'
      none: 'Des phrases inachevées gisent près du lit. Mozart meurt le 5 décembre et les différents pieux attendent toujours que quelqu''un les identifie.'
      not_admitted: 'Constance n''a pas organisé ce visiteur. Le copiste reste dehors et ne voit jamais ce qu''il y a dans la pile.'
      desync: 'Les premières parties se mélangent avec des pages volantes et le transfert historique n''est plus synchronisé. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'À la porte, le messager vérifie le contenu et l’extérieur du paquet pour savoir lequel remettre d’abord au copiste.'
        p2: 'Il demande qu’on rapproche la table et n’ouvre que la page où il s’est arrêté.'
    relic: 'Une feuille de pratique inachevée'
    relic_desc: 'Une feuille de copie fictive montrant où s''arrêtent les notes survivantes.'
    points:
      p1: 'Conservez l''ouverture terminée du Requiem lorsque la maladie oblige à passer le relais'
      p2: 'Après qu''il se couche le 20 novembre, guérissez la fièvre qui l''y retient'
    points_fail:
      p1: 'Les ouvrants se mélangent aux courants d''air et le premier mouvement ne peut plus être remonté. Le bureau rappelle l''employé après une désynchronisation de la succursale.'
      p2: 'Dans cette branche, la maladie ne disparaît pas. Il décède à Vienne le 5 décembre, à l''âge de 35 ans.'
    shift:
      p1:
        was: 'En décembre 1791, Mozart mourut avec le début du Requiem entièrement orchestré et une grande partie du reste inachevée.'
      p2:
        was: 'À partir du 20 novembre 1791, Mozart resta alité. Il mourut à Vienne le 5 décembre et le registre paroissial en indiquait la cause comme une grave fièvre miliaire.'
        now: '{staff} apporte un médicament qui fait tomber la fièvre et, en décembre, il se redresse. Dans cette chronologie, il termine le Requiem de sa propre main et continue de composer et de se produire à Vienne pendant de nombreuses années.'
        who: 'mozart'
        bio: 'Mozart se rétablit à l''hiver 1791, termina lui-même le Requiem et continua à composer et à se produire à Vienne pendant de nombreuses années.'
    vignettes:
      stack: 'Greta débarrasse la table et pose de côté une feuille qui semble vide. Vous tenez la pile pendant qu''Emil vérifie la page qui la précède. La portée vide appartient à la séquence. Greta le remet avec une étiquette lâche indiquant d''où il vient.'
      hand: 'Emil peut copier la ligne devant lui et est prêt à poursuivre directement dans une portée non écrite. Vous lui faites laisser une petite marque dans la marge à l''endroit où la copie s''arrête. Une fois le transfert terminé, le lecteur suivant peut voir exactement où une nouvelle main devrait commencer.'
      finish: 'Vous pouvez fredonner le passage comme le chantera une future chorale. Greta a besoin de la copie maintenant et demande où se termine la musique écrite sur cette page. Vous lui montrez la limite et gardez la mélodie pour vous. La prochaine version sera élaborée après votre départ.'
  dickinson_amherst:
    name: 'Poèmes dans un coffre'
    place: 'Amherst'
    figure: 'Emily Dickinson'
    story: 'Emily Dickinson est décédée chez elle à Amherst le 15 mai 1886. Sa sœur Lavinia a accédé à sa demande de brûler ses lettres reçues et a trouvé des centaines de poèmes. Les premiers éditeurs ont ensuite démonté les livrets dans lesquels Emily avait cousu de nombreux poèmes.'
    story_prose:
      opening:
        - 'Chez Amherst, Lavinia aperçoit le coin d''une feuille pliée sous une pile de lettres. Certains des livrets cousus d’Emily se trouvent à proximité. Quelqu''un à l''étage demande s''il faut laisser la lumière allumée. Les papiers vont tous pour le moment sur le couvercle de la boîte la plus proche.'
        - 'Emily Dickinson est décédée en 1886. Sa sœur Lavinia a trouvé un grand corpus de poèmes en s''occupant des lettres, et de nombreux fascicules ont ensuite été détachés. Vous pouvez d''abord organiser certains soins comme Emily le souhaite, puis aider Lavinia à distinguer les lettres des poèmes et à conserver un livret intact.'
        - 'Un voyageur expérimenté en matière de soins peut demander à Emily ce qu''elle veut pendant la nuit. Quelqu''un qui lit des manuscrits peut aider Lavinia à reconnaître les mots cousus et les variantes et à préserver l''ordre dans lequel ils ont été trouvés.'
      points:
        p1: 'Lavinia ramasse les feuilles volantes et dit que les lettres peuvent aller ensemble. Vous lui demandez d''abord de dénouer la ficelle en dessous. Elle trouve quelques pages pliées au même format dans la main de sa sœur et les place près d’une lampe pour lire. Ce n''est qu''après avoir déplacé les deux piles sur des couvercles différents qu''elle appelle la famille pour voir.'
        p2: 'Lavinia demande si la transcription peut conserver le mot le plus facile à lire sur chaque page. Vous lui demandez de montrer au copiste deux mots à côté de la même ligne, puis de tracer les trous de pli et de couture sur la copie. Le livret reste cousu et l''emballage a son ordre de page. Lors de la lecture suivante, le pli ramène le copiste au même mot alternatif.'
        p3: 'Vous demandez à Emily si elle veut quelqu''un dans la pièce à côté ce soir. Elle fait un geste avec la lampe et demande que la porte du couloir reste entrouverte pour pouvoir être entendue si elle appelle. La famille met de l''eau et une chaise là où elle demande. La dernière personne de garde s’en va doucement. Emily peut encore dire de qui il s''agit.'
      outcomes:
        all: 'Emily passe la soirée comme elle l''a demandé. Après sa mort, les journaux survivants comprennent un livret qui peut encore être lu avec ses coutures et ses mots alternatifs intacts.'
        p1: 'Les lettres et les poèmes sont conservés séparément et les poèmes inédits survivent. Certains livrets sont encore démontés lorsque la famille s''occupe du reste.'
        p2: 'Les plis d’un livret et les mots alternatifs ont été copiés. Le reste des papiers s’est égaré et le voyage se souvient de la copie de ce seul livret.'
        p3: 'Quand Emily appelle ce soir-là, il y a quelqu''un assez proche pour l''entendre. La famille doit encore trier elle-même les papiers.'
      none: 'Le papier plié est tout ce qui reste près de la lampe. Personne ne fait de nouveaux arrangements pour la nuit.'
      not_admitted: 'Quelqu''un répond de l''intérieur et dit que la famille ne peut pas recevoir de visiteurs pour le moment. Les deux piles n''ont pas encore été ouvertes.'
      desync: 'Les lettres et les poèmes se mélangent. Certains papiers qui survivent dans l’histoire ne peuvent être récupérés dans cette branche. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Elle trouve quelques pages pliées au même format dans la main de sa sœur et les place près d’une lampe pour lire. Ce n''est qu''après avoir déplacé les deux piles sur des couvercles différents qu''elle appelle la famille pour voir.'
        p2: 'Le livret reste cousu et l''emballage a son ordre de page. Lors de la lecture suivante, le pli ramène le copiste au même mot alternatif.'
        p3: 'La dernière personne de garde s’en va doucement. Emily peut encore dire de qui il s''agit.'
    relic: 'Un livret cousu'
    relic_desc: 'Quelques pages cousues à la main avec un poème sur chacune.'
    points:
      p1: 'Aidez Lavinia à séparer les lettres à détruire des poèmes reliés et à protéger l''œuvre inédite'
      p2: 'Demandez à Lavinia de conserver un livret ensemble et de préparer une copie qui marque les plis, l''ordre des pages et les mots alternés.'
      p3: 'Demandez à Emily ce qui faciliterait son repos ce soir et aidez sa maison à l''organiser.'
    points_fail:
      p1: 'Les poèmes se mélangent à la correspondance et une grande partie des œuvres inédites est perdue. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'Il existe une copie vierge, mais ses pages ne permettent pas de savoir où les feuilles pliées se sont jointes.'
      p3: 'Le ménage garde sa routine habituelle du soir. Emily doit encore demander à quelqu''un de rester lorsqu''elle a besoin d''un coup de main.'
    shift:
      p1:
        was: 'En 1886, après la mort de Dickinson, Lavinia détruisit les lettres reçues comme demandé et découvrit des centaines de poèmes.'
      p2:
        was: 'Les premiers éditeurs de Dickinson ont déballé les livrets cousus à la main sur lesquels ils travaillaient.'
        now: 'Dans cette branche, le {staff} copie un livret sans le démonter. Lavinia a une copie qui montre comment les pages s''articulent, jusqu''aux mots alternatifs dans la marge.'
      p3:
        was: 'Dickinson tomba gravement malade et mourut chez lui le 15 mai 1886.'
        now: 'Dans cette branche, la maisonnée prend les devants et laisse quelqu''un assez près pour l''entendre, afin qu''elle puisse se reposer sans appeler au secours.'
    vignettes:
      pause: 'Le lecteur fait disparaître le tiret lors de la lecture à haute voix. Vous leur demandez de faire une pause là où le crayon s''est cassé. Ils réessayent la réplique et entendent une fin différente.'
      variant: 'Vous voyez un mot écrit au-dessus de la ligne. Le lecteur veut choisir une version et passer à autre chose. Vous faites de la place dans la marge pour les deux et l''étiquette qui vient d''où.'
      stack: 'Le lecteur redresse une pile lâche. Vous conservez deux morceaux ensemble car leurs bords et leur écriture correspondent. La prochaine copie propre commence avec eux côte à côte.'
  hertz_bonn:
    name: 'Le dernier semestre'
    place: 'Bonn'
    figure: 'Heinrich Hertz'
    story: 'À partir du début de 1892, Hertz souffrit à plusieurs reprises d''une maladie douloureuse du nez et de la gorge, si grave parfois qu''il ne pouvait plus travailler. En 1893, il reprend ses cours à Bonn tout en subissant plusieurs opérations et termine ses Principes de mécanique. Il mourut à Bonn le 1er janvier 1894, à l''âge de trente-six ans ; le livre est sorti après sa mort.'
    story_prose:
      opening:
        - 'Le programme des conférences est déjà disponible à Bonn. Hertz a ses notes pour un cours dans une main et quelques lignes qu''il souhaite vérifier dans les principes de mécanique. Il demande à un collègue plus jeune combien d''étudiants attendent avec des questions.'
        - 'Hertz travailla sur les Principes pendant sa dernière maladie, envoya le manuscrit en décembre 1893 et mourut le 1er janvier. Vous pouvez demander à un collègue de suivre une conférence et laisser Hertz décider comment utiliser son temps.'
        - 'Quelqu’un qui sait comment se déroule un cours peut aider à recueillir les questions des élèves. Même avec un collègue disponible pour y répondre, laissez Hertz décider quel cours il lui confiera.'
      points:
        p1: 'Le collègue présente deux horaires et dit qu''il peut suivre le cours le plus tardif s''il sait quelles questions les étudiants ont déjà posées. Demandez à Hertz de choisir la leçon et de marquer les deux endroits qui nécessitent des réponses. Avant que le collègue ne reparte avec l''horaire, il indique dans quelle pièce il se trouvera. Hertz prend le extrait de ses notes de cours et le colle à la page du livre de mécanique qu''il souhaite vérifier.'
      outcomes:
        all: 'Les étudiants posent leurs questions au cours du collègue. Le manuscrit sort à temps et Hertz décède le jour du Nouvel An.'
        p1: 'Un collègue prend le cours. Hertz se repose une partie du temps qu''il a gagné avant de regarder les marques sur le manuscrit.'
      none: 'Le calendrier reste entre les mains de Hertz. Il ferme le manuscrit avec ces quelques lignes encore à vérifier.'
      not_admitted: 'Personne n''a prévu de vous voir avant la conférence. Les étudiants attendent un peu dans le hall et regagnent le bâtiment où est affiché l''horaire.'
      excerpts:
        p1: 'Avant que le collègue ne reparte avec l''horaire, il indique dans quelle pièce il se trouvera. Hertz prend le extrait de ses notes de cours et le colle à la page du livre de mécanique qu''il souhaite vérifier.'
    relic: 'Une feuille de cours pliée'
    relic_desc: 'Une feuille d''emploi du temps inventée avec une conférence marquée.'
    points:
      p1: 'Demandez à Hertz quelle conférence il laisserait un collègue couvrir et faites en sorte que quelqu''un réponde aux questions ce jour-là.'
    points_fail:
      p1: 'La conférence reste à son horaire. Il doit conserver le travail sur son manuscrit pour plus tard.'
    shift:
      p1:
        was: 'Hertz a continué à enseigner à Bonn en 1893 alors qu''il était malade et a terminé ses principes de mécanique avant de mourir.'
        now: 'Dans cette branche, Hertz laisse un collègue assurer une conférence. Il profite de ce temps pour se reposer et dicter une correction au manuscrit avant de le renvoyer.'
    vignettes:
      repeat: '{staff} relit les deux questions au collègue. Il marque celle à laquelle il peut répondre sans ouvrir le manuscrit de Hertz.'
      signal: 'Un élève attend à l’extérieur de la mauvaise classe. {staff} désigne la salle que le remplaçant a inscrite sur le planning.'
      gap: '{staff} laisse une ligne vide pour les réponses du professeur et place la feuille là où l''étudiant suivant peut la trouver.'
  bizet_paris:
    name: 'L’année de Carmen'
    place: 'Paris'
    figure: 'Georges Bizet'
    story: 'Carmen a été créée à l''Opéra-Comique le 3 mars 1875 après une longue période de répétition. Le pressoir est mixte et la production se poursuit jusqu''au printemps. Le 3 juin, Bizet meurt à Bougival, à l''âge de trente-six ans.'
    story_prose:
      opening:
        - 'Il reste à l''Opéra-Comique une dernière répétition. Le chœur entre à temps, mais traverser la scène retarde sa deuxième ligne. Quelqu''un au piano demande si l''orchestre veut jouer seul ou s''il doit recommencer à partir du mouvement sur scène.'
        - 'Carmen fut créée à Paris le 3 mars 1875. Bizet mourut en juin de la même année. Vous pouvez donner une autre chance aux acteurs et à l''orchestre et transmettre plus tard à Bizet la section exacte qu''un chanteur souhaite répéter.'
        - 'Faites appel à quelqu''un qui peut compter l''entrée des deux côtés. Après la représentation, quelqu’un peut noter l’inquiétude du chanteur concernant le numéro et les premiers mots de la section.'
      points:
        p1: 'L''orchestre veut commencer au bar qu''il a mal entendu. Vous demandez au chœur de revenir à sa première position et de montrer au chef d''orchestre où il doit se trouver avant de pouvoir chanter ensemble. Après un arrêt, chacun repart du mot qui fait intervenir le refrain. Lorsqu''il parvient à la deuxième tentative, la personne à la porte de la scène fait signe de continuer.'
        p2: 'Quelqu’un écrit « entrée difficile » sur un ticket après le spectacle. Vous lui demandez de chanter la phrase précédente et demandez à un autre chanteur d''identifier l''heure à laquelle il l''entend. Bizet vérifie à qui appartient la demande et glisse le bordereau dans la partition qu''ils ont utilisée ce soir-là. Les premiers mots ressortent là où le chanteur qui les a demandés pourra les retrouver la prochaine fois.'
      outcomes:
        all: 'Le rideau s''ouvre le 3 mars. Bizet reçoit une note qui identifie le passage, et le dossier porte toujours sa mort en juin.'
        p1: 'Le rideau se lève à l''heure. Les interprètes envoient ensuite une courte note, et Bizet doit encore demander de quelle partie il s''agit.'
        p2: 'Bizet reçoit le bordereau et peut retrouver ses premiers mots dans la partition. La première n’est plus synchronisée et seule la remise survit dans le récit du voyage.'
      none: 'Deux marques se ressemblent sur la partition. Les gens qui partent ne parviennent toujours pas à se mettre d’accord sur celui qui amènera le chœur.'
      not_admitted: 'La personne à la porte de la scène ne trouve jamais votre nom. Vous vous éloignez de l''entrée et entendez à nouveau les chanteurs compter quelques battements.'
      desync: 'La répétition échoue et la première du 3 mars ne démarre pas. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Après un arrêt, chacun repart du mot qui fait intervenir le refrain. Lorsqu''il parvient à la deuxième tentative, la personne à la porte de la scène fait signe de continuer.'
        p2: 'Bizet vérifie à qui appartient la demande et glisse le bordereau dans la partition qu''ils ont utilisée ce soir-là. Les premiers mots ressortent là où le chanteur qui les a demandés pourra les retrouver la prochaine fois.'
    relic: 'Un éventail'
    relic_desc: 'Un éventail en papier peint, venu du parterre.'
    points:
      p1: 'Aidez le théâtre à réserver un dernier passage aux chanteurs pour répéter les entrées difficiles avec le mouvement et l''orchestre.'
      p2: 'Prenez à Bizet un compte-rendu d''une représentation en soirée, avec le passage exact que les chanteurs veulent encore relire'
    points_fail:
      p1: 'Les répétitions s''arrêtent et le théâtre ne peut pas lever le rideau le 3 mars. La succursale se désynchronise et le bureau rappelle l''employé.'
      p2: 'La note parvient à Bizet sans le passage. Il apprend qu''il y a eu un problème sans savoir quelle partie les chanteurs voulaient répéter.'
    shift:
      p1:
        was: 'Le registre de scène de l’Opéra-Comique enregistre les répétitions et les préparatifs scéniques du 3 mars 1875, jour de la première de Carmen.'
      p2:
        was: 'La première diffusion de Carmen s''est poursuivie après sa première en mars.'
        now: 'Dans cette branche, {staff} donne à Bizet un rapport qu''il peut utiliser. Il marque l''entrée dans la partition et peut en discuter avec les chanteurs avant leur prochaine représentation.'
    vignettes:
      future: 'Vous dites au préposé que les publics ultérieurs connaîtront cet opéra dans des villes qu''il n''a jamais visitées. Il demande pourquoi il devrait garder un programme supplémentaire ce soir. Vous lui montrez où sont imprimés la première nuit et le nom de Galli-Marié. Un exemplaire va dans son tiroir. Vous partez avant qu''il n''y ait un deuxième lecteur.'
      label: 'Le préposé a déposé deux feuilles sous le même titre. Vous les divisez par date et marquez la première nuit sur un emballage de rechange. Un lecteur ultérieur peut désormais demander la bonne feuille. Le public qui sort vous manque.'
      seat: 'Vous prêtez un programme à un visiteur en retard et le récupérez à la porte une fois que le visiteur a trouvé sa place. Vous copiez un nom sur votre propre feuillet. À ce moment-là, la musique intérieure a évolué.'
  artemisia_florence:
    name: 'La première femme à l’Académie'
    place: 'Florence'
    figure: 'Artemisia Gentileschi'
    story: 'Artemisia Gentileschi est devenue la première femme admise à l''Académie des Arts du Dessin de Florence en 1616. Ses années florentines incluent l''œuvre maintenant connue sous le nom d''Autoportrait en joueur de luth.'
    story_prose:
      opening:
        - 'Le magasin de Florence a deux livres de comptes ouverts. Les pigments vont dans l''un et un reçu pour les frais d''inscription à l''académie est glissé dans l''autre. Artemisia demande à la greffière de les garder séparés et de lui indiquer le jour de juillet où elle pourra récupérer son reçu.'
        - 'L''académie florentine de dessin admet Artemisia le 19 juillet 1616. Elle travaille également sur des commandes. Dans cette agence, vous pouvez mettre en place le droit d''entrée et l''aider à obtenir une avance datée sur son prochain contrat de peinture.'
        - 'Quelqu''un qui s''y connaît en comptabilité peut vérifier le paiement de l''académie. Quelqu''un qui peut mettre par écrit un accord oral peut l''aider à demander au client la date dont il a besoin.'
      points:
        p1: 'Le greffier a classé le bordereau de l''académie parmi les factures de pigments qui doivent être réglées. Vous demandez à Artemisia quel paiement doit être effectué en premier et vérifiez le nom du destinataire à côté de la date d''admission. L''employé sort le reçu et lui en laisse une copie. Elle prend le bordereau avec son nom du comptoir.'
        p2: 'Lorsque le dernier paiement arrive, la cliente demande à quelle heure elle peut commencer le prochain tableau. Artemisia pousse sa facture de pigment et attend pendant qu''il la lit à haute voix. Vous demandez au commis d''enregistrer une avance due avant le début des travaux et d''en remettre un exemplaire à chaque personne. Lorsqu''elle va acheter des pigments, elle prend le papier qui indique quand elle peut retirer l''argent.'
      outcomes:
        all: 'L''académie accepte les frais. Le prochain accord fixe désormais une date à l’avance. Artemisia paie les pigments et étire la première toile.'
        p1: 'Artemisia est admise à la date historique. La prochaine fois qu’elle voudra commander des fournitures, elle devra toujours demander de l’argent à son client.'
        p2: 'L''avance est versée dans le prochain accord. Les frais de scolarité sont en retard et le voyage ne conserve que la négociation sur le tableau.'
      none: 'Les reçus des deux dépenses sont toujours dans la même pile. Le commerçant demande encore une fois lequel doit être payé en premier.'
      not_admitted: 'Le greffier a des sièges pour les personnes qu''il attend. Vous restez dehors et regardez quelqu''un classer la fiche de l''académie parmi les factures de pigments.'
      desync: 'Les frais ne sont pas payés le jour même. Les inscriptions se désynchronisent et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'L''employé sort le reçu et lui en laisse une copie. Elle prend le bordereau avec son nom du comptoir.'
        p2: 'Vous demandez au commis d''enregistrer une avance due avant le début des travaux et d''en remettre un exemplaire à chaque personne. Lorsqu''elle va acheter des pigments, elle prend le papier qui indique quand elle peut retirer l''argent.'
    relic: 'Un pot de pigments'
    relic_desc: 'Un petit pot de lapis bleu moulu.'
    points:
      p1: "Aidez Artemisia à trouver de l'argent pour ses frais d'inscription à l'académie à temps pour son admission le 19\_juillet."
      p2: 'Une fois la première commission réglée, aidez Artemisia à obtenir une avance datée dans son prochain contrat afin qu''elle puisse acheter des matériaux avant de commencer à peindre.'
    points_fail:
      p1: 'Artemisia ne peut pas prendre en charge les frais le jour même dans cette agence. Son inscription n''est plus synchronisée et le bureau rappelle l''employée.'
      p2: 'Le solde du mois d''août est payé tel qu''enregistré, mais Artemisia doit quand même demander de l''argent lorsqu''elle doit acheter des fournitures moyennant une autre commission.'
    shift:
      p1:
        was: 'Le 19 juillet 1616, l''Académie des Arts du Dessin de Florence admet Artemisia Gentileschi.'
      p2:
        was: 'En 1615-1616, la commission Buonarroti était payée par versements. Les archives conservent la demande d’argent d’Artemisia pendant qu’elle y travaillait.'
        now: 'La commission suivante fixe une date d''avance des matériaux avant le début des travaux. Artemisia peut commander des pigments contre le paiement convenu.'
        who: 'artemisia_florence'
        bio: 'Elle a peint l''Allégorie de l''inclination pour la maison de Michel-Ange Buonarroti le Jeune, où elle fait toujours partie de la décoration. L’admission lui donnait également accès au tribunal de l’académie pour les litiges découlant de son métier.'
    vignettes:
      pose: 'Le visiteur se tourne vers le miroir et demande quelle pose lui semble la plus naturelle. Vous demandez ce que chaque pose semble faire. Ils choisissent celui qui permet à la main de conserver son propre objectif.'
      name: 'Une fiche de pratique contient la description du modèle mais pas de place pour le nom du peintre. Vous le retournez et demandez au visiteur de déposer les deux avant que les feuilles ne soient empilées.'
      mirror: 'Vous déplacez le miroir jusqu''à ce que le visiteur puisse voir l''angle sans se tordre. Ils essaient la pose une fois, puis apportent une petite modification avant de dessiner.'
  buchner_zurich:
    name: 'Deux brouillons sur la table de répétition'
    place: 'Zurich'
    figure: 'Georg Büchner'
    story: 'En 1836, Georg Büchner arriva à Zurich en tant que réfugié et commença à enseigner à l''université. Il tomba gravement malade en février 1837. Sa fiancée Minna Jaeglé vint de Strasbourg et le rejoignit vers la fin. Il meurt le 19 février à vingt-trois ans, laissant Woyzeck inachevé.'
    story_prose:
      opening:
        - 'À Zurich, quelqu’un distingue deux brouillons sur une table parce qu’ils contiennent le nom du même personnage. Büchner demande à l''autre pièce une feuille avec laquelle il pourra écrire une lettre. Tant qu''il a encore des forces, il souhaite demander à Minna de venir de Strasbourg.'
        - 'En février 1837, Büchner tomba gravement malade à Zurich. Minna est arrivée tard dans sa maladie et il y est décédé. Woyzeck survit dans plusieurs ébauches inachevées. Vous pouvez envoyer son message plus tôt et apporter la trousse médicale fictive du cabinet pour l’aider à prendre soin de lui.'
        - 'Envoyez un coursier pour savoir ce que Büchner lui-même veut dire. A son chevet, faire appel à une personne expérimentée en soins et au kit après vérification auprès des personnes déjà présentes.'
      points:
        p1: 'Le messager soulève une page égarée, pensant qu''il s''agit d''une lettre inachevée. Vous demandez à Büchner de confier ses propres mots à celui qui les note sur une nouvelle feuille. Une fois l''adresse vérifiée, le messager laisse la pièce sur la table et prend la nouvelle page. Pendant qu’il le prend, Büchner l’entend prononcer le nom de Minna dans son intégralité.'
        p2: 'Quelqu''un dans la maison lit les titres à haute voix jusqu''à ce que Büchner lui demande d''arrêter. Vous expliquez la trousse de bureau et laissez son soignant rester près du lit. Au bout d''un moment, Büchner ouvre les yeux et montre du doigt le plus fin des deux pieux. L''assistant le rapproche. Cette fois, Büchner n’a besoin de personne pour choisir les pages à sa place.'
      outcomes:
        all: 'Minna arrive à Zurich à temps pour que Büchner lui dise ce qu''il voulait dire. La fièvre baisse. Les deux piles sur le bureau attendent encore d''être remises en ordre.'
        p1: 'La lettre part assez tôt pour que Minna l''entende parler pour elle-même. Sa maladie persiste et il décède à Zurich.'
        p2: 'La fièvre de Büchner diminue et il demande une boisson. Le message précédent adressé à Minna n’est toujours pas arrivé à temps.'
      none: 'La lettre et les documents de travail sont ouverts ensemble. Minna arrive vers la fin et il meurt à Zurich.'
      not_admitted: 'Les gens à l''intérieur demandent au visiteur d''attendre et de le laisser tranquille. La feuille de la lettre n''a toujours pas d''adresse.'
      excerpts:
        p1: 'Une fois l''adresse vérifiée, le messager laisse la pièce sur la table et prend la nouvelle page. Pendant qu’il le prend, Büchner l’entend prononcer le nom de Minna dans son intégralité.'
        p2: 'L''assistant le rapproche. Cette fois, Büchner n’a besoin de personne pour choisir les pages à sa place.'
    relic: 'Un paquet de scènes'
    relic_desc: 'Des scènes lâches dans une main exiguë, sans ordre fixe.'
    points:
      p1: 'Envoyez un message à Strasbourg pendant que Büchner peut encore demander à Minna de venir lui-même'
      p2: 'Apportez la trousse médicale du cabinet au chevet du patient et aidez les personnes qui s''en occupent à traverser la fièvre.'
    points_fail:
      p1: 'Minna le rejoint tard dans sa maladie. Le message qu''il voulait lui faire passer est toujours d''actualité.'
      p2: 'La fièvre continue. Il ne peut plus réclamer les pages qui traînent sur son bureau.'
    shift:
      p1:
        was: 'Février 1837: sa fiancée Minna Jaeglé se dépêche de Strasbourg pour Zurich et arrive alors qu''il est déjà mourant; il mourut peu après avec elle à ses côtés.'
        now: 'Dans cette branche, Minna arrive plus tôt à Zurich. Ils peuvent se parler tant qu''il est encore assez fort.'
      p2:
        was: 'Büchner mourut à Zurich le 19 février 1837, Woyzeck étant inachevé.'
        now: 'Dans cette succursale, la trousse médicale du cabinet aide {staff} à faire baisser la fièvre. Büchner vit et peut demander à voir les pages qui se trouvent encore sur son bureau.'
        who: 'buchner_zurich'
        bio: 'Dans cette succursale, Büchner vit sa maladie à Zürich en février 1837.'
    vignettes:
      order: "Le lecteur a rassemblé les deux exemplaires et numéroté les scènes à l'encre. Vous ajoutez une étiquette distincte à chaque source et inscrivez la commande proposée sur un bordereau amovible. Le prochain lecteur peut l'annuler. Vous rapportez ce bordereau à la maison\_; vous n'avez toujours pas de commande définitive."
      pause: 'Vous savez que les futurs cinémas devront décider de la suite. Le lecteur demande si votre réponse est celle de l’auteur. Vous essayez les deux débuts à voix haute et marquez où ils finissent avec les différentes questions. Vous pouvez faire deux pauses à la maison et aucun script terminé.'
      gap: 'Vous demandez au lecteur de s''arrêter au moment où la page s''arrête. Aucun de vous ne fournit la ligne manquante. Sur votre copie vous laissez un espace suffisamment large pour pouvoir le remarquer d''un seul coup d''oeil. Cet espace est ce dont vous vous souvenez à votre retour.'
  enheduanna_ur:
    name: 'Le chemin à travers les épines'
    place: 'Ur, Mésopotamie'
    figure: 'Enheduanna'
    story: 'Un disque inscrit d''Ur nomme Enheduanna comme fille de Sargon. Dans L''Exaltation d''Inana, l''oratrice se fait appeler Enheduanna et décrit avoir été chassée du temple. Elle compare son vol à celui d''une hirondelle et parle d''épines et d''épuisement. La date et l''itinéraire du voyage sont incertains.'
    story_prose:
      opening:
        - 'En dehors d’Ur, les pierres sont difficiles à voir au crépuscule. Enheduanna s''arrête près d''un buisson épineux et soulève un pot d''eau vide. Quelqu''un qui marchait avec elle se souvient d''une porte plus loin où ils pouvaient s''asseoir.'
        - 'L’inscription sur le disque préserve le nom d’Enheduanna. Un poème transmis dans des copies ultérieures et traditionnellement attribué à elle décrit le déplacement et les épines dans un autre pays. Ce voyage prend son décor dans le poème et lui donne une halte sur la route.'
        - 'Envoyer à quelqu''un habitué à une longue promenade avec de l''eau à partager. À la première maison occupée, demandez-lui si elle veut y attendre jusqu''au matin.'
      points:
        p1: 'Son compagnon veut économiser l''eau jusqu''au prochain chantier. Vous demandez à Enheduanna si elle veut continuer à marcher. Elle montre avec son pot vide le mur le plus proche de chez vous. Vous lui donnez de l''eau et demandez à la personne à la porte si elle peut rester là jusqu''à l''aube. Pour la première fois depuis une demi-journée, elle pose un pot plein sur un sol plat.'
      outcomes:
        all: 'Elle passe la nuit à l’intérieur du muret. Le poème ultérieur parle encore d''épines. Le voyage a un enregistrement séparé de l''endroit qu''elle a trouvé avant la tombée de la nuit.'
        p1: 'La maisonnée fait de la place à Enheduanna près de la porte. Avant de partir, elle demande à son compagnon de remplir également son pot.'
      none: 'Aucune réponse ne vient d’au-delà du mur avant la nuit. Le parti doit continuer à marcher.'
      not_admitted: 'Le parti reconnaît sa propre entreprise et ne vous appelle pas. Vous n''avez que le temps de poser la cruche d''eau près de la porte.'
      excerpts:
        p1: 'Vous lui donnez de l''eau et demandez à la personne à la porte si elle peut rester là jusqu''à l''aube. Pour la première fois depuis une demi-journée, elle pose un pot plein sur un sol plat.'
    relic: 'Une tasse d''eau en argile'
    relic_desc: 'Une petite tasse appartenant à la maison fictive au bord de la route.'
    points:
      p1: 'Après qu''Enheduanna ait été chassée du temple, apportez de l''eau et aidez-la à atteindre un endroit où se reposer.'
    points_fail:
      p1: 'L''endroit où vous espériez vous arrêter est encore trop loin. Vous manquez de lumière du jour avant de pouvoir lui offrir un endroit où se reposer.'
    shift:
      p1:
        was: 'L''orateur de L''Exaltation d''Inana décrit avoir été chassé du temple, confronté à des épines et à court de force.'
        now: 'Dans cette branche, {staff} marche avec Enheduanna jusqu''à ce qu''ils atteignent un abri et lui apportent de l''eau avant la nuit.'
        who: 'enheduanna_ur'
        bio: 'Dans cette branche, Enheduanna a de la compagnie et trouve un endroit pour se reposer après avoir quitté le temple.'
    vignettes:
      inscription: '{staff} vérifie ce que le ménage facture pour remplir un pot. La personne à la porte dit qu''elle peut d''abord boire et discuter du reste après le lever du jour.'
      support: '{staff} demande au compagnon de déposer le pot avant d''aider quelqu''un à atteindre le muret. Cette fois, le pot reste droit.'
      edge: '{staff} vérifie si la place à côté de la porte est libre. Quelqu’un à l’intérieur éloigne un panier du banc.'
  ibn_sina_hamadan:
    name: 'La dernière crise de coliques'
    place: 'Hamadan, Perse'
    figure: 'Ibn Sina'
    story: 'Ibn Sina a terminé son Canon de médecine en cinq livres à Hamadan des années avant son dernier voyage. Dans le récit continué par son compagnon al-Juzjani, Ibn Sina souffre de crises répétées de douleurs abdominales. Il meurt en 1037 lors d''un voyage à Hamadan avec le souverain qu''il sert.'
    story_prose:
      opening:
        - 'Le groupe en route vers Hamadan rassemble ses draps. Ibn Sina dépose ses papiers et demande s''ils peuvent attendre un peu. Un compagnon le voit tenir son abdomen et cherche autour de lui un endroit où il pourrait s''allonger.'
        - 'La suite de sa biographie relate des douleurs récurrentes vers la fin de sa vie. Ibn Sina est mort à Hamadan en 1037. Dans cette branche, vous pouvez demander où il souhaite s''arrêter et demander à quelqu''un de rester avec lui pendant qu''il se repose.'
        - 'Une personne ayant une expérience en matière de soins peut lui demander quand il souhaite arrêter. Trouvez un compagnon qu''il connaît déjà. Lui et le parti peuvent décider combien de temps attendre.'
      points:
        p1: 'Quelqu''un demande s''il est temps de l''aider à se relever. Vous vous accroupissez près de la couverture et demandez où il aimerait s''arrêter. Il désigne un endroit ombragé plus loin, où il pourra s''appuyer contre quelque chose. Vous demandez à un compagnon de confier ses affaires à quelqu''un d''autre et de s''asseoir là où Ibn Sina peut le voir. Le prochain coup reçoit une réponse de l''intérieur demandant un peu plus de temps.'
      outcomes:
        all: 'Lors de cette étape du voyage, le groupe attend qu''Ibn Sina dise quand il pourra se lever. Il meurt encore après son arrivée à Hamadan.'
        p1: 'Un compagnon reste assis avec lui. Personne ne lui demande de se dépêcher pour récupérer les bagages déjà emballés.'
      none: 'Les autres sont à nouveau prêts et il n''a toujours aucun endroit où s''allonger. Ils ont encore du chemin à parcourir.'
      not_admitted: 'L''un des présents vous remercie et demande aux visiteurs qu''il n''a pas prévu de voir d''attendre dehors. Vous ne pouvez pas lui demander ce qu''il veut.'
      excerpts:
        p1: 'Vous demandez à un compagnon de confier ses affaires à quelqu''un d''autre et de s''asseoir là où Ibn Sina peut le voir. Le prochain coup reçoit une réponse de l''intérieur demandant un peu plus de temps.'
    relic: 'Un morceau de papier plié'
    relic_desc: 'Une note de voyage fictive marquant l''endroit où la fête s''est arrêtée.'
    points:
      p1: 'Lorsque la douleur revient, demandez à Ibn Sina où il souhaite s''arrêter et faites en sorte que quelqu''un reste avec lui pendant qu''il se repose.'
    points_fail:
      p1: 'Le groupe est prêt à repartir avant que vous lui ayez préparé une place pour se coucher.'
    shift:
      p1:
        was: 'Le récit d''Al-Juzjani décrit les rechutes et la mort d''Ibn Sina à Hamadan en 1037.'
        now: 'Dans cette branche, {staff} crée un endroit pour qu''Ibn Sina se repose lorsque la douleur revient. Un compagnon reste avec lui et apporte sa réponse aux personnes qui attendent le départ.'
    vignettes:
      section: '{staff} demande quelle distance ils ont parcourue après leur dernier arrêt et met la réponse sur un morceau qui pourra être relu plus tard.'
      sleeve: 'Quelqu''un commence à enrouler la literie. {staff} leur demande de laisser une couverture dépliée jusqu''à ce qu''Ibn Sina décide de partir ou non.'
      afterlife: '{staff} demande qui attendra dans la salle pendant que les autres se préparent. Un compagnon ramène ses affaires à l’intérieur.'
  al_jazari_diyarbakir:
    name: 'Un livre de machines ingénieuses'
    place: 'Diyarbakır'
    figure: 'Al-Jazari'
    story: 'Le traité d''Al-Jazari sur les appareils mécaniques date de 1206. Un folio manuscrit survivant copié en 1315 illustre son horloge à éléphant.'
    story_prose:
      opening:
        - 'Dans Au milieu, un employé ouvre une liste de pages sur la table de livraison. Quelqu''un arrive avec les dessins et dit qu''un de leurs titres pourrait appartenir à deux chapitres. Le banc disparaît dans l''ombre. Al-Jazari leur demande de vérifier à nouveau pendant qu''ils peuvent voir.'
        - 'Al-Jazari a terminé son livre sur les appareils mécaniques en 1206. Les copies survivantes conservent des descriptions ainsi que des dessins. Ici, vous pouvez protéger la remise et lui demander de choisir un ensemble de références pour les copistes ultérieurs.'
        - 'Demandez à quelqu''un qui peut faire correspondre une légende à un paragraphe de vérifier la copie de livraison. Un copiste peut demander quelles notes et quels espaces l''auteur souhaite laisser tels quels.'
      points:
        p1: 'Le greffier montre un titre répété dans le contenu. Al-Jazari lui dit de tourner une autre page, où vous voyez une marque à côté du deuxième dessin menant ailleurs. Vous ajoutez les références de deux pages à la liste de transfert et demandez au destinataire de la tester lui-même. Il ferme le livre et dit qu''il les a trouvés tous les deux.'
        p2: 'Le copiste souhaite gagner de la place en insérant la note marginale dans le texte principal. Al-Jazari lui fait lire la phrase originale jusqu''à la pause, et vous indiquez à côté la source différente de la note. Le lecteur suivant peut encore voir où l’auteur a laissé un blanc. Le copiste lève sa plume et donne à l''addition une étiquette distincte en dessous.'
      outcomes:
        all: 'Le greffier reçoit le manuscrit complet. Une deuxième copie conserve les références et permet aux copistes ultérieurs d''identifier les légendes originales.'
        p1: 'L''ensemble est livré entier et son contenu mène à chaque illustration. Il n’existe toujours pas de copie de référence séparant les notes les plus récentes.'
        p2: 'Les origines des notes sont identifiées. Il manque encore un dessin correspondant à l''ensemble de livraison et le voyage ne peut pas conserver l''intégralité de la remise.'
      none: 'Les titres répétés restent en suspens. Le prochain copiste arrive et doit demander quel volume ouvrir.'
      not_admitted: 'Le commis lit les noms des personnes qui reçoivent l''ensemble. Personne ne vous appelle et le contenu reste fermé.'
      desync: 'Plusieurs dessins ne peuvent plus correspondre au contenu. L''ensemble ne peut être livré et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Vous ajoutez les références de deux pages à la liste de transfert et demandez au destinataire de la tester lui-même. Il ferme le livre et dit qu''il les a trouvés tous les deux.'
        p2: 'Le lecteur suivant peut encore voir où l’auteur a laissé un blanc. Le copiste lève sa plume et donne à l''addition une étiquette distincte en dessous.'
    relic: 'Une came en laiton'
    relic_desc: 'Une roue façonnée qui transforme une rotation en un coup.'
    points:
      p1: 'Lors de la remise à Amid, vérifiez les descriptions et les illustrations par rapport au contenu afin que le manuscrit puisse être livré complet.'
      p2: 'Choisissez une copie de référence avec l''auteur. Énumérez les notes, les légendes et les espaces vides que les copistes ultérieurs doivent garder distincts'
    points_fail:
      p1: 'Plusieurs diagrammes ne peuvent plus être adaptés à leurs sections. Le manuscrit ne peut être remis en bloc et le bureau rappelle l''employé.'
      p2: 'Le copiste suivant travaille à partir d''un brouillon qui a accumulé d''autres notes. Les lecteurs ne peuvent pas distinguer la description de l''auteur des ajouts ultérieurs.'
    shift:
      p1:
        was: 'Le colophon d''un ancien manuscrit de Topkapı donne le 16 janvier 1206 comme date d''achèvement. Le livre d’Al-Jazari était associé à la cour Artuqid d’Amid.'
      p2:
        was: 'Les manuscrits ultérieurs ne descendent pas tous par la même branche. Certains ont des illustrations et des formulations différentes.'
        now: 'La collection en conserve un exemplaire vérifié par l''auteur. Un scribe ultérieur peut enregistrer ses propres modifications séparément, puis vérifier les légendes.'
        who: 'al_jazari_diyarbakir'
        bio: 'Al-Jazari a écrit ses descriptions dans Amid. Le texte et les illustrations ont changé ensemble au fur et à mesure que le livre était copié et déplacé d''un endroit à l''autre.'
    vignettes:
      sequence: 'L''apprenti explique chaque chiffre en même temps. Vous montrez le premier mouvement et demandez ce qui vient immédiatement après. Ils commencent à raconter l''histoire de l''horloge dans l''ordre.'
      viewer: 'Un visiteur ne lève jamais les yeux du plus grand personnage. Vous leur demandez de surveiller l''endroit indiqué par l''apprenti. Lors de la deuxième démonstration, ils voient le plus petit mouvement dans le temps.'
      paper: 'Vous brandissez le dessin tandis que l''apprenti montre le modèle devant lui. Ils ajoutent une petite marque afin qu''un lecteur sans modèle sache où chercher.'
  hokusai_edo:
    name: 'La Grande Vague de Kanagawa'
    place: 'Edo, Japon'
    figure: 'Katsushika Hokusai'
    story: 'Sous la vague au large de Kanagawa de Hokusai est une estampe sur bois figurant dans Trente-six vues du mont Fuji. Le Met date son impression vers 1830-1832.'
    story_prose:
      opening:
        - 'Un éditeur d''Edo dépose trois nouvelles impressions sur le comptoir. Sur la partie la plus sombre, une petite partie de la crête s''est remplie. Sur la partie la plus pâle, le Fuji lointain est difficile à voir. Le sculpteur prend une feuille et l’imprimeur une autre.'
        - 'Sous la vague au large de Kanagawa est l’une des trente-six vues du mont Fuji d’Hokusai. Les impressions survivantes préservent les changements tels que l''usure des blocs. Vous pouvez mettre une référence partagée par la presse et demander à l''éditeur de conserver une séquence qui pourra être vérifiée ultérieurement.'
        - 'Demandez à quelqu''un qui connaît les impressions de comparer les feuilles. Quelqu''un qui peut organiser la garde peut demander à Hokusai, à l''imprimeur et à l''éditeur comment conserver les échantillons ultérieurs.'
      points:
        p1: 'Le sculpteur porte une épreuve à la fenêtre, d''où il peut voir Fuji à travers le bleu. Vous demandez à l’imprimeur de regarder l’écusson sous le même angle et de le comparer avec une feuille différente. Ils passèrent tous les deux un doigt sur la même ligne claire. L''épreuve choisie porte une petite marque dans son coin. L''espace au-dessus de la montagne lointaine reste dégagé.'
        p2: 'Un commis glisse les échantillons dans la pile de vente. L''éditeur demande s''ils pourront les retrouver la prochaine fois. Vous demandez à Hokusai et à l''imprimeur d''écrire une commande sur l''emballage et de le laisser ouvert à une extrémité pour des épreuves ultérieures. La feuille suivante du bloc va à l’arrière de l’ensemble avant de s’approcher du comptoir.'
      outcomes:
        all: 'Les premières impressions sont mises en vente et l''atelier dispose encore d''un set à comparer. Lorsqu''un autre imprimeur prend le relais, la commande peut toujours être lue en tournant les pages.'
        p1: 'Le sculpteur et l''imprimeur terminent le premier tirage à partir d''une épreuve. Les échantillons ultérieurs se dispersent parmi les exemplaires vendus.'
        p2: 'Les échantillons ont une commande. Le premier run est encore retardé car la ligne casse. Le voyageur rapporte chez lui la scène où les épreuves ont été commandées.'
      none: 'L’éditeur place la feuille la plus propre près de la caisse. Les gens qui viennent vérifier l’écusson regardent encore différentes copies.'
      not_admitted: 'L''éditeur demande quel imprimeur vous a amené. Personne ne connaît le visiteur, et les épreuves remontent derrière le comptoir.'
      desync: 'La vague continue de déferler au même endroit et le premier lot ne quitte pas la boutique. Le bureau rappelle le voyageur.'
      excerpts:
        p1: 'L''épreuve choisie porte une petite marque dans son coin. L''espace au-dessus de la montagne lointaine reste dégagé.'
        p2: 'La feuille suivante du bloc va à l’arrière de l’ensemble avant de s’approcher du comptoir.'
    relic: 'Un bloc de bois pour l''impression'
    relic_desc: 'Une planche sculptée en bois de cerisier.'
    points:
      p1: 'Choisissez une épreuve d’un éditeur d’Edo dans laquelle la crête de la vague et le sommet lointain sont clairement lus. Laissez-le au sculpteur et à l’imprimeur comme référence pour le premier tirage.'
      p2: 'Avant que l''éditeur ne divise les épreuves, demandez à Hokusai et à l''imprimeur de conserver un ensemble de comparaison. Demandez à l''éditeur de déposer une nouvelle épreuve dans l''ordre à chaque fois que l''impression reprend.'
    points_fail:
      p1: 'Le sculpteur et l''imprimeur n''ont aucune épreuve commune et continuent de renvoyer des feuilles avec la même ligne de vagues brisées. L''éditeur retient la première livraison et le bureau rappelle l''employé.'
      p2: 'Seuls les exemplaires en vente restent au comptoir. Les épreuves qu''Hokusai a vérifiées auprès de l''imprimeur retournent dans le stock, où un nouvel imprimeur ne peut pas récupérer l''ensemble.'
    shift:
      p1:
        was: 'L''éditeur d''Edo, Eijudō, a annoncé Trente-six vues du mont Fuji pour le nouvel an 1831. Sous la vague au large de Kanagawa appartient à la série, et les premières impressions avec les lignes de vagues intactes survivent.'
      p2:
        was: 'Ces impressions ne portent ni date ni numéro de lot. Les blocs originaux n''ont pas survécu et les marques sur les empreintes sont les principaux indices de leur séquence.'
        now: 'Eijudō garde un paquet de preuves en ordre derrière le comptoir. Un nouvel imprimeur peut déterminer quel espace est apparu plus tard et demander à Hokusai de juger si le tirage correspond à son design.'
        who: 'hokusai_edo'
        bio: 'Hokusai a conçu l''image. Son apparence sur papier dépendait également de l''endroit où le sculpteur coupait, de la manière dont l''imprimeur transférait l''encre et du moment où l''éditeur commandait un autre tirage.'
    vignettes:
      mountain: 'Le vendeur montre la mousse. Vous lui demandez de couvrir la vague avec sa main. Une fois qu''il l''a découvert, le petit triangle au loin ressemble moins à une autre éclaboussure.'
      edge: 'Le vendeur souhaite découper une feuille de pratique. Vous placez la copie non rognée à côté et lui montrez à quel point la signature est proche du bord.'
      counter: 'Vous tournez l’impression vers un client qui recherche avant tout Fuji. Le client le trouve finalement en bas de la page et demande à voir une autre vue.'
  bell_boston:
    name: 'Notez ce que vous avez entendu'
    place: 'Boston'
    figure: 'Alexander Graham Bell'
    story: 'Le carnet de laboratoire d''Alexander Graham Bell rapporte que le 10 mars 1876 à Boston, Thomas Watson a entendu et compris les mots prononcés par Bell dans l''émetteur. Lors de l''exposition du centenaire de Philadelphie, le 25 juin, Bell a fait une démonstration du téléphone aux juges.'
    story_prose:
      opening:
        - 'A Boston, les deux salles ont leurs portes fermées. Watson couvre une oreille et écoute pendant que Bell s''arrête sur le banc et demande s''ils peuvent essayer une phrase supplémentaire. Quelqu’un pense que le travail est terminé et commence à ranger l’appareil.'
        - 'Le 10 mars 1876, Bell rapporta que Watson comprenait les paroles envoyées depuis une autre pièce. En juin, Bell fit une démonstration à l''Exposition du centenaire de Philadelphie. Ici, vous pouvez préserver le procès et aider ses collègues à se mettre d''accord sur ce que feront ses étudiants de Boston pendant son absence.'
        - 'Quelqu''un qui sait s''occuper de l''équipement et écouter attentivement peut aider avec les deux salles. Avant l''exposition, demandez à une personne connaissant les horaires du personnel de vérifier les modalités d''enseignement.'
      points:
        p1: 'Watson sort et dit qu''il l''a entendu. Vous laissez la phrase écrite face cachée et lui demandez de dire ce qui s’est passé du début à la fin. Bell prend son stylo lorsqu''il entend les mots sans y être invité. Les hommes changent de place et referment les portes. Cette fois, Watson prendra la parole.'
        p2: 'Un collègue ouvre l''horaire et dit que certains étudiants ne connaissent que Bell. Bell lit les exercices déjà programmés et demande au prochain professeur de remplir les heures vides. Vous aidez à faire une copie de l''horaire convenu pour les familles. Avant que la valise ne soit emballée, Bell glisse son exemplaire et le billet de chemin de fer dans différentes poches.'
      outcomes:
        all: 'Le procès de mars reste dans le carnet. Lorsque la manifestation commence à Philadelphie, les cours à Boston suivent l''horaire convenu.'
        p1: 'Watson répète ce qu''il a entendu. Les préparatifs pour juin manquent encore d’un plan pédagogique exploitable.'
        p2: 'Les étudiants ont quelqu''un pour suivre leurs cours. Il manque une dernière confirmation au carnet de mars, et le voyage ne conserve que les dispositions pour juin.'
      none: 'L''appareil remonte sur le banc sans aucune parole confirmée de la pièce voisine. L''horaire d''enseignement présente encore un décalage.'
      not_admitted: 'Les portes des deux pièces sont fermées. Quelqu''un répond par l''un d''eux et ne laisse aucune place à un visiteur sur le banc.'
      desync: 'La répétition historique ou la démonstration d’exposition se perd. Le bureau rappelle le voyageur après une désynchronisation du voyage.'
      excerpts:
        p1: 'Les hommes changent de place et referment les portes. Cette fois, Watson prendra la parole.'
        p2: 'Vous aidez à faire une copie de l''horaire convenu pour les familles. Avant que la valise ne soit emballée, Bell glisse son exemplaire et le billet de chemin de fer dans différentes poches.'
    relic: 'Un combiné téléphonique'
    relic_desc: 'Une pièce à main en bois avec un diaphragme fin.'
    points:
      p1: 'Gardez l''appareil de Boston prêt pour un autre procès, Watson écoutant dans l''autre pièce jusqu''à ce qu''il puisse répéter les mots.'
      p2: 'Avant que Bell ne quitte Boston, demandez-lui et ses collègues de se mettre d''accord sur ce qui doit être fait pour ses étudiants pendant son absence à l''exposition.'
    points_fail:
      p1: 'L''équipement remonte sur le banc avant que Watson puisse confirmer ce qu''il a entendu. Le procès de mars n''est plus synchronisé et le bureau rappelle le {staff}.'
      p2: 'Bell reste à Boston pour s''occuper de ses étudiants. Sa démonstration d''exposition n''est plus synchronisée et le bureau rappelle {staff}.'
    shift:
      p1:
        was: 'Le 10 mars 1876 à Boston, Bell utilisa l''appareil expérimental pour transmettre une phrase intelligible à Watson dans la pièce voisine.'
      p2:
        was: 'Le 25 juin 1876 à Philadelphie, Bell montra le téléphone aux juges du centenaire, dont Dom Pedro II et William Thomson.'
    vignettes:
      blind: 'L''assistant du récepteur veut d''abord voir la phrase. Vous pliez le papier et lui demandez d''écrire uniquement ce qu''il entend. Deux mots reviennent intacts et le dernier reste vide. Gardez ce bordereau. Un autre procès est sur le point de commencer lorsque vous partez.'
      future: 'Vous dites à l''assistant que les gens se souviendront d''une phrase à partir de cette date. Il suppose que ce sera ce que quelqu''un a écrit du côté de l''émetteur. Vous présentez deux feuillets, un pour l''orateur et un pour l''auditeur. Le couple montrera une différence que l''histoire de la fameuse sentence ne peut pas vous raconter sur ce procès.'
      door: 'Vous rapportez le bordereau plié du destinataire à travers la porte. Ce n''est qu''alors que vous le placez à côté de la phrase test. Le mot manquant est toujours manquant, mais les deux mots correspondants ont désormais un enregistrement. Vous rapportez la comparaison à la maison et manquez la phrase suivante.'
  cantor_halle:
    name: 'Lettres de la clinique'
    place: 'Halle'
    figure: 'Georg Cantor'
    story: 'Cantor a pris sa retraite en 1913 et a passé ses dernières années malade et à court de nourriture dans l''Allemagne en temps de guerre. En 1917, il entra pour la dernière fois à la clinique de Halle. Il écrivit à sa femme pour lui demander de rentrer à la maison et mourut à la clinique le 6 janvier 1918.'
    story_prose:
      opening:
        - 'Une chaise se trouve près de la fenêtre de la clinique de Halle. Cantor dépose une lettre qu''il n''a pas encore pliée et demande si quelqu''un viendra aujourd''hui. Le grand livre de cuisine vient d''être amené à l''étage. La personne qui porte les repas attend également.'
        - 'Cantor passa ses derniers mois de guerre dans une clinique de Halle et mourut le 6 janvier 1918. Cette visite lui permet de rencontrer un membre de sa famille et de permettre à la cuisine d''élaborer un plan de repas réalisable.'
        - 'Envoyez quelqu''un qui entendra qui il souhaite voir avant d''organiser une visite. Quelqu''un qui peut vérifier ce qu''il y a dans la cuisine peut trouver un repas qu''il est capable de manger.'
      points:
        p1: 'Vous écrivez deux jours possibles sous la lettre. Cantor les examine, puis nomme le membre de la famille à qui il souhaite que vous l''interrogeiez en premier. Une fois le rendez-vous fixé, un préposé éloigne la chaise du couloir. Les gens passent dehors cet après-midi-là et la personne assise sur la chaise peut encore entendre chaque mot.'
        p2: 'La cuisine peut seulement indiquer les jours où elle s''attend à avoir quelque chose de rechange. Vous demandez ce qu''il peut garantir, vérifiez ce que la famille peut envoyer, puis demandez à Cantor ce qu''il peut terminer. La prochaine fois qu''il prend son repas, il regarde l''horloge et dit que c''est l''heure sur laquelle ils se sont mis d''accord hier.'
      outcomes:
        all: 'Il y a une visite supplémentaire cet hiver et certains repas arrivent à l''heure convenue. En janvier, la famille apprend toujours qu''il est décédé à Halle.'
        p1: 'Cantor voit la personne qu''il voulait le plus voir. La cuisine ne peut encore lui servir que ce dont elle a besoin ce jour-là.'
        p2: 'Il y a des repas plus réguliers. Sa famille ne peut pas venir lui envoyer ses salutations par lettre.'
      none: 'La chaise regarde toujours par la fenêtre. La cuisine replie le grand livre et n’a pas de jours à promettre.'
      not_admitted: 'Le préposé dit qu''aucune visite n''a été organisée aujourd''hui. Vous laissez le papier plié près de la porte.'
      excerpts:
        p1: 'Une fois le rendez-vous fixé, un préposé éloigne la chaise du couloir. Les gens passent dehors cet après-midi-là et la personne assise sur la chaise peut encore entendre chaque mot.'
        p2: 'La prochaine fois qu''il prend son repas, il regarde l''horloge et dit que c''est l''heure sur laquelle ils se sont mis d''accord hier.'
    relic: 'Une enveloppe inutilisée'
    relic_desc: 'Une enveloppe inventée laissée à côté des lettres à Halle.'
    points:
      p1: 'Demandez à Cantor qui il souhaite le plus voir et organisez une visite tranquille à la clinique de Halle.'
      p2: 'Demandez à la cuisine et à sa famille quelle nourriture ils peuvent épargner cet hiver et organisez un repas régulier qu''il pourra terminer'
    points_fail:
      p1: 'La famille doit répondre par lettre. La chaise demandée par Cantor reste vide.'
      p2: 'La nourriture arrive quand quelqu''un peut l''épargner, et Cantor a encore des jours où il a faim.'
    shift:
      p1:
        was: 'En 1917, Cantor entra pour la dernière fois à la clinique de Halle. Il a écrit à sa femme pour lui demander de rentrer à la maison.'
        now: 'Dans cette succursale, {staff} reçoit une visite organisée. Cantor peut dire à quelqu''un de chez lui ce qu''il a mis dans ses lettres.'
      p2:
        was: 'Cantor était malade au cours de ses dernières années et la nourriture était rare dans l''Allemagne en temps de guerre.'
        now: 'Dans cette succursale, {staff} organise un repas fiable pour Cantor, afin que ces jours-là, il puisse manger sans attendre de colis.'
    vignettes:
      list: 'Un préposé commence à mettre une réponse parmi le courrier sortant. {staff} vérifie les noms sur les deux couvertures et renvoie la réponse à la table de Cantor.'
      after: 'Un bol passe devant la fenêtre. {staff} demande qui attend toujours pour le dîner et le préposé vérifie à nouveau la liste de la cuisine.'
      end: '{staff} demande à Cantor où il veut la chaise. Il montre l''endroit d''où un visiteur pourrait le voir sans se tenir dans l''embrasure de la porte.'
  leeuwenhoek_delft:
    name: 'Un monde dans une goutte d’eau'
    place: 'Delft'
    figure: 'Antonie van Leeuwenhoek'
    story: 'En octobre 1676, Leeuwenhoek écrivait depuis Delft qu''une goutte d''eau poivrée contenait des milliers de petits animaux. La Royal Society de Londres a demandé comment elle pourrait vérifier ses observations. De mai à août 1677, huit témoins de Delft et des environs regardèrent à travers ses lentilles et consignent leurs observations par écrit. Il a envoyé leurs déclarations à Londres le 5 octobre. Robert Hooke montra plus tard les petits animaux aux membres de la Société.'
    story_prose:
      opening:
        - 'A Delft, Leeuwenhoek remet une plaque en laiton au premier visiteur. Le visiteur ferme un œil et ne voit toujours rien. L''autre tient déjà un stylo, attendant d''entendre ce qu''il dit.'
        - 'En 1676, Leeuwenhoek décrivit à Londres de minuscules animaux dans l''eau. Huit témoins à Delft ont signé des témoignages au cours de l''année suivante et leurs récits étaient accompagnés de sa lettre du 5 octobre. Vous pouvez garder les deux premiers témoins devant l''objectif et vérifier les pièces jointes avant le courrier d''automne.'
        - 'Envoyez quelqu''un qui peut guider un autre observateur devant l''objectif. En automne, vous aurez besoin de quelqu''un qui puisse vérifier toutes les signatures sur l''enveloppe sortante.'
      points:
        p1: 'Le premier témoin tourne la plaque et perd la tache lumineuse. Leeuwenhoek lui demande de reculer son œil jusqu''à ce qu''il réapparaisse. L''homme écrit comment les petites choses bougent. Vous retournez sa feuille jusqu''à ce que l''autre témoin puisse regarder et écrire par lui-même. Ce n''est que lorsque tous deux ont fini qu''ils échangent leurs draps et sourient aux deux descriptions.'
        p2: 'L''enveloppe d''octobre contient déjà la lettre. Vous retirez de la table une déclaration tardive et demandez à Leeuwenhoek de lire les signatures communes avant de vérifier les feuilles dans l''ordre. Le nom de famille n’est pas dans le coin où on l’attend. Un pli doit être levé avant que le nom de famille puisse figurer sur la liste des pièces jointes.'
      outcomes:
        all: 'Les déclarations laissent Delft avec la lettre. Un lecteur peut retracer chaque compte jusqu''à une feuille signée. Hooke montrera également les petits animaux à d''autres personnes à Londres.'
        p1: 'Les deux premiers témoins ont formulé leurs propres observations. Une pièce jointe disparaît plus tard du courrier d''octobre.'
        p2: 'Les papiers volants sur la table sont pris en compte. Le compte signé le plus ancien est manquant et le paquet ne peut plus correspondre à l''historique.'
      none: 'L''objectif reste là où il se trouvait. Aucune preuve signée ne reste après le regard des visiteurs.'
      not_admitted: 'Votre nom est absent du rendez-vous. L''apprenti prend la plaque de laiton à l''intérieur et ferme la porte.'
      desync: 'Il manque les premières signatures ou une annexe d''octobre. Les témoignages se désynchronisent et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Vous retournez sa feuille jusqu''à ce que l''autre témoin puisse regarder et écrire par lui-même. Ce n''est que lorsque tous deux ont fini qu''ils échangent leurs draps et sourient aux deux descriptions.'
        p2: 'Le nom de famille n’est pas dans le coin où on l’attend. Un pli doit être levé avant que le nom de famille puisse figurer sur la liste des pièces jointes.'
    relic: 'Une petite plaque de lentille en laiton'
    relic_desc: 'Une plaque de la taille d’un pouce contenant une très petite lentille très claire.'
    points:
      p1: 'Donnez aux premiers témoins du temps devant l''objectif et demandez à chacun d''exprimer dans ses propres mots le mouvement qu''il a vu.'
      p2: 'Parcourez le paquet d''octobre à Delft. Faites correspondre les déclarations libres avec les témoins avant le départ de la lettre pour Londres.'
    points_fail:
      p1: 'Les premiers témoins partent avant d’avoir mis sur papier ce qu’ils ont vu. Le bureau rappelle {staff} lorsque le premier témoignage n''est plus synchronisé.'
      p2: 'La lettre sort mais une feuille de témoignage reste sur la table. Le bureau rappelle le {staff} lorsque le paquet n''est plus synchronisé.'
    shift:
      p1:
        was: 'Le 18 mai 1677, deux témoins signèrent une déclaration sur les petits animaux qu''ils avaient vus. Six autres ont ajouté leur témoignage au cours des mois suivants.'
      p2:
        was: 'Leeuwenhoek a joint les déclarations des témoins à sa lettre de Delft datée du 5 octobre. En novembre, Hooke a montré les petits animaux à la Royal Society de Londres.'
    vignettes:
      motion: 'Le correspondant écrit que quelque chose a bougé. Vous demandez à quoi ressemble le mouvement pour quelqu’un qui ne peut pas voir l’objectif. Ils rayent une comparaison et dessinent une deuxième position à côté de la première.'
      label: 'Il y a des dessins en bois et en vin sur la table. Vous ajoutez des étiquettes temporaires avant que le correspondant ne gratte les feuilles perdues, et les images se mettent dans le bon ordre.'
      read: 'Vous relisez l’observation sans pointer son illustration. Le correspondant entend où finit la description et ajoute une référence au schéma correct.'
  newton_cambridge:
    name: 'Une même loi pour la pomme et la Lune'
    place: 'Cambridge'
    figure: 'Isaac Newton'
    story: 'Les Principia de Newton parurent à Londres en 1687. Dans le troisième livre, il rapproche la Lune et la chute des corps sous le même angle de gravité. La copie au format mise à la presse n’était pas entre ses mains. Il a été rédigé par Humphrey Newton, son assistant dans ces années-là et sans aucun lien de parenté. Beaucoup plus tard, William Stukeley a écrit le souvenir de Newton d''une pomme tombante, ce qui a soulevé une question sur la gravité. Stukeley ne dit rien à propos d''un coup à la tête.'
    story_prose:
      opening:
        - 'La table de copie de Cambridge est couverte par des documents pour Londres. Humphrey Newton vient d''écrire le nom d''un personnage lorsqu''Isaac Newton lui trouve une autre correction sur une épreuve. Un messager frappe.'
        - 'Les Principia parurent à Londres en 1687. Edmond Halley le vit dans la presse et écrivit le 5 juillet pour dire qu''il était terminé. Dans cette branche, vous pouvez vérifier les dernières corrections et donner aux lecteurs un endroit pour enregistrer une modification que Newton peut retracer jusqu''à sa page.'
        - 'Envoyez un voyageur qui pourra vérifier les numéros de page et de proposition par rapport au paquet. Après la publication, un bon organisateur de correspondance peut convenir avec Newton de la manière dont les modifications doivent être enregistrées.'
      points:
        p1: 'Deux feuillets corrigent le même chiffre. On n''a pas de numéro de livre. Vous et Humphrey vous posez tous les deux à côté de la preuve et demandez à Newton de lire la version qu''il souhaite conserver. Le messager répète l''adresse pendant que vous triez les feuilles par livre et que vous les remettez. Le messager prend le paquet et un titre abandonné reste sur la table.'
        p2: 'La lettre du premier lecteur marque un numéro sans nommer la page. Vous remettez à Newton la copie imprimée et demandez si le numéro du chiffre aidera les lecteurs à l''identifier. Une fois qu’il a trouvé la proposition, il vous demande de mettre la date de la lettre dans le carnet et de lui laisser un espace pour inscrire sa décision. Le commis retrouve le même chiffre lorsque la lettre suivante arrive.'
      outcomes:
        all: 'Halley écrit que le livre est terminé. À Cambridge, la première colonne du livre de correction est remplie. La prochaine personne qui emprunte le livre peut voir comment laisser une correction.'
        p1: 'Halley reçoit la dernière série et le livre paraît sous sa forme historique. Les modifications ultérieures s''accumulent encore dans les lettres et sur les copies.'
        p2: 'Le livre de correction peut conduire un lecteur de la proposition à sa page. Le paquet pour Londres a mal tourné et cette visite préserve la méthode d''enregistrement des corrections.'
      none: 'Deux feuillets se croisent sur la table. Le lecteur suivant peut voir ce qui a changé deux fois sans être en mesure de dire quel glissement est arrivé en premier.'
      not_admitted: 'Le messager dit qu''il doit prendre le paquet chez le copiste. De l’extérieur, on entend deux draps semblables se retourner.'
      desync: 'Halley ne reçoit jamais une des dernières corrections. La publication se désynchronise et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Le messager répète l''adresse pendant que vous triez les feuilles par livre et que vous les remettez. Le messager prend le paquet et un titre abandonné reste sur la table.'
        p2: 'Une fois qu’il a trouvé la proposition, il vous demande de mettre la date de la lettre dans le carnet et de lui laisser un espace pour inscrire sa décision. Le commis retrouve le même chiffre lorsque la lettre suivante arrive.'
    relic: 'Un prisme de verre'
    relic_desc: 'Un triangle de verre qui divise la lumière blanche en couleurs.'
    points:
      p1: 'Emballez les dernières corrections de Newton par volume et par page et faites-les parvenir de Cambridge à Halley avant la fin de la presse londonienne.'
      p2: 'Lorsque la première édition arrivera, convenez avec Newton de la manière dont les lecteurs peuvent soumettre des corrections qu''il pourra vérifier par proposition et par page.'
    points_fail:
      p1: 'Deux versions d''une correction sortent. Halley ne parvient pas à assembler les derniers errata et le bureau rappelle l''employé.'
      p2: 'Les correspondants utilisent leurs propres références. Les premières corrections restent dispersées entre les lettres et la copie de Newton.'
    shift:
      p1:
        was: 'Le 5 juillet 1687, Halley écrit que les Principia sont terminés et que les derniers errata sont arrivés à temps.'
      p2:
        was: 'Newton a annoté sa propre première édition. La préparation d''une édition révisée a pris des années.'
        now: 'Le collège tient un livre correctionnel indexé par proposition. Les lecteurs peuvent enregistrer un problème et voir quels changements Newton a ensuite approuvés et quand.'
        who: 'newton_cambridge'
        bio: 'Newton a écrit les Principia à Cambridge et Halley l''a vu dans la presse à Londres. Newton a continué à réviser l''ouvrage après l''impression.'
    vignettes:
      apple: '« Est-ce qu''une pomme l''a frappé à la tête ? demandez-vous à un domestique d’université, un homme maquillé pour le jeu. Il continue à balayer. "Je ne pourrais pas le dire. Vous me dites pourquoi la Lune ne descend pas." Vous n''avez pas de réponse prête, et retournez à la page. La pomme ne sera écrite par personne avant soixante-cinq ans.'
      hand: 'La copie au net n''est pas entre les mains de l''homme dont le nom figurera sur le livre. Le domestique dit que celui qui l''écrit est M. Humphrey, un Newton également et sans lien de parenté. Vous le notez et ne le dérangez pas.'
      diagram: 'Sur une feuille gâtée, vous dessinez la direction que prendrait la Lune si rien ne la retenait, puis une flèche pour l''attraction qui courbe son chemin. Le serviteur, qui ne sait pas lire le latin, regarde la flèche pendant un moment.'
  bach_leipzig:
    name: 'Le printemps où l’oculiste est venu'
    place: 'Leipzig'
    figure: 'Johann Sebastian Bach'
    story: 'Au printemps 1750, Bach savait à peine lire ou écrire à cause de sa vue. L''oculiste itinérant John Taylor l''a opéré à Leipzig et des complications ont conduit à une deuxième opération. Bach meurt le 28 juillet 1750.'
    story_prose:
      opening:
        - 'Le pupitre de Leipzig a été déplacé vers la fenêtre. Bach entend l''assistant retourner une feuille et lui demande de commencer par lire sa partie. John Taylor est en ville. Quelqu''un dans la maison attend que Bach lui dise quand il pourra le voir.'
        - 'Au printemps 1750, Taylor opéra les yeux de Bach et une seconde opération suivit. Bach est décédé le 28 juillet. Cette branche lui permet d’entendre l’opinion d’un autre soignant et de décider si un lecteur l’aiderait avec ses scores.'
        - 'Envoyez une personne expérimentée en soins pour entendre ses préoccupations. Un musicien peut demander qui il aimerait lire pour lui. Laissez le ménage dire quand il est temps de parler.'
      points:
        p1: 'Bach pousse la partition vers le visiteur. Vous demandez à un autre soignant de le laisser finir de décrire ce qui l’inquiète avant de discuter s’il peut attendre. Bach demande à la famille de décliner le rendez-vous et fait appel à un chanteur qu''il connaît pour lire deux parties cet après-midi-là. A la fin du premier passage, il demande au chanteur de relire les restes.'
      outcomes:
        all: 'Ce printemps-là, Bach fixe quelques lectures pour les heures les plus éclairées. Quelqu''un lit et écoute avec une main sur le boîtier du clavier. Le ménage annonce encore son décès en juillet.'
        p1: 'La nomination de Taylor est annulée. Lorsque la lumière atteint le pupitre, le lecteur démarre à la pause demandée par Bach.'
      none: 'Le rendez-vous se poursuit. Plus tard, lorsque la famille débarrasse le pupitre, une page que quelqu''un aurait pu lui lire est toujours sur la table.'
      not_admitted: 'La famille demande à ceux qui attendent de rester dans la pièce de devant. Le voyageur n''est jamais appelé et n''entend rien de ce qui se passe.'
      excerpts:
        p1: 'Bach demande à la famille de décliner le rendez-vous et fait appel à un chanteur qu''il connaît pour lire deux parties cet après-midi-là. A la fin du premier passage, il demande au chanteur de relire les restes.'
    relic: 'Un tuyau d''orgue découpé dans une plume'
    relic_desc: 'Une petite pipe, réglée et testée, restée invendue.'
    points:
      p1: 'Donnez à Bach un deuxième avis médical avant qu''il consente à l''opération de Taylor et proposez-lui de l''aider à lire pendant qu''il décide.'
    points_fail:
      p1: 'Bach n’a pas de deuxième opinion à peser. Il procède à l''opération et des complications en entraînent une seconde.'
    shift:
      p1:
        was: 'Au printemps 1750, John Taylor opéra les yeux de Bach à Leipzig. Des complications ont conduit à une deuxième opération.'
        now: 'Dans cette branche, Bach décide de décliner l’opération de Taylor après s’être entretenu avec {staff}. Sa vue reste mauvaise et il fait en sorte que quelqu''un lise une partition avec lui à la lumière du jour.'
        who: 'bach_leipzig'
        bio: 'Dans cette branche, Bach décline l’opération de Taylor au printemps 1750 et organise une aide à la lecture de ses partitions.'
    vignettes:
      entry: 'On entend la partie inférieure arriver un souffle avant que le chanteur ne s''y attende. Vous leur faites écouter de l’autre côté de la pièce. Cette fois, ils lèvent la tête avant le signal.'
      rest: 'Le chanteur perd le compte pendant la suite. Vous copiez la ligne qu''ils peuvent entendre en attendant, et ils marquent le mot qui précède leur propre entrée.'
      light: 'Deux chanteurs partagent une page. Vous l''inclinez vers la lumière et le maintenez là jusqu''à ce que les deux puissent voir l''endroit où leurs lignes se séparent.'
  lavoisier_paris:
    name: 'Avant l’ordre d’arrestation'
    place: 'Paris'
    figure: 'Antoine Lavoisier'
    story: 'Le 24 novembre 1793, l''arrestation de tous les anciens fermiers fut ordonnée, et Lavoisier et son beau-père Jacques Paulze figuraient parmi les emprisonnés. Le 8 mai 1794, tous deux ainsi que d''autres anciens fermiers furent condamnés et mis à mort à Paris le même jour.'
    story_prose:
      opening:
        - 'A Paris, Jacques Paulze fait le bilan de sa fille. Antoine Lavoisier lit depuis une autre page à l''autre bout de la table. Les deux hommes comptent rester en ville pour expliquer leurs livres. Un membre de la famille demande qui pourrait s’occuper des grands livres à sa place.'
        - 'Le 24 novembre 1793, les autorités ordonnèrent l''arrestation des anciens fermiers fiscaux. Paulze et Lavoisier furent tous deux exécutés le 8 mai 1794. Dans cette branche, vous pouvez demander aux deux hommes d''envisager de quitter Paris. Chacun décide pour lui-même.'
        - 'Quelqu’un qui peut entendre les raisons de chacun peut leur parler à son tour. Un voyageur qui s''y connaît en comptabilité peut également lister les papiers que la famille doit conserver.'
      points:
        p1: 'Paulze dit que remettre un livre entier laissera sa famille sans aucune idée des questions à poser. Vous lui demandez de marquer chaque page pendant qu''il parle. Sa fille vérifie les comptes qu''il lui indique avant de prendre l''intégralité du grand livre. Lorsqu''il l''entend relire ses notes, il se lève et repousse sa chaise sous la table.'
        p2: 'Lavoisier tient une déclaration à deux entrées dont il pense qu''il doit encore s''expliquer. Vous lui demandez s''il peut rédiger les explications pour la personne qui prend la relève. Après avoir entendu les deux lui relire, il demande à sa famille de dire qu''il a quitté Paris si quelqu''un l''appelle. Il place la page à côté d''eux avant de partir et laisse une feuille blanche en dessous.'
      outcomes:
        all: 'Les deux hommes quittent la ville séparément. Lorsque la famille ouvre les livres en mai, il y a des nouvelles de chacun d''eux. Tous deux sont vivants.'
        p1: 'Paulze part et est toujours en vie après le mois de mai suivant. Lavoisier reste à Paris et est ensuite exécuté.'
        p2: 'Lavoisier part et est toujours en vie après le mois de mai suivant. Jacques Paulze reste à Paris et est ensuite exécuté.'
      none: 'La famille s''éloigne de la table. Les deux hommes restent dans la ville et leurs noms figurent tous deux sur la liste des personnes exécutées en mai suivant.'
      not_admitted: 'Le visiteur ne dispose d''aucune carte de visite attendue par la famille. Quelqu''un ferme le grand livre et le garde sur la table.'
      excerpts:
        p1: 'Sa fille vérifie les comptes qu''il lui indique avant de prendre l''intégralité du grand livre. Lorsqu''il l''entend relire ses notes, il se lève et repousse sa chaise sous la table.'
        p2: 'Après avoir entendu les deux lui relire, il demande à sa famille de dire qu''il a quitté Paris si quelqu''un l''appelle. Il place la page à côté d''eux avant de partir et laisse une feuille blanche en dessous.'
    relic: 'Une balance de précision'
    relic_desc: 'Une balance très sensible qui servait à tenir les comptes de la chimie.'
    points:
      p1: 'Demander à Jacques Paulze de confier ses papiers à sa famille et de quitter Paris avant l''arrêté d''arrestation'
      p2: 'Amener Lavoisier à envisager de quitter Paris alors qu''il espère pouvoir justifier personnellement de ses comptes'
    points_fail:
      p1: 'Paulze reste avec ses papiers à Paris. Il est placé en garde à vue et mis à mort le 8 mai 1794.'
      p2: 'Comme dans l''histoire, Lavoisier est emprisonné fin novembre et le 8 mai 1794 il est mis à mort à Paris.'
    shift:
      p1:
        was: 'Jacques Paulze fut arrêté en novembre 1793 et mis à mort le 8 mai 1794.'
        now: 'Dans cette succursale, Paulze laisse les papiers à sa famille et s''en va. Il vit après mai 1794.'
      p2:
        was: '24 novembre 1793 : l''arrestation de tous les anciens fermiers est ordonnée et Lavoisier est incarcéré. Le 8 mai 1794, il fut mis à mort à Paris.'
        now: 'Dans cette succursale, Lavoisier quitte Paris avant l''arrêté et vit après mai 1794.'
        who: 'lavoisier_paris'
        bio: 'Dans cette chronologie, Lavoisier a quitté Paris avant l''ordre d''arrestation de novembre 1793 et a vécu au-delà de 1794.'
    vignettes:
      units: 'Deux nombres s''alignent magnifiquement, mais l''unité sur une rangée a glissé. Vous l''attrapez avant que le compositeur ne verrouille les colonnes en place.'
      air: 'Vous demandez pourquoi le tableau représente quelque chose que le lecteur ne peut pas voir. Le compositeur sélectionne les titres de ce qui est entré et de ce qui est resté, puis laisse les deux titres dans l''épreuve.'
      proof: 'Vous placez un morceau de papier sous la ligne actuelle pendant que le compositeur lit. Un numéro qui ressemblait à celui de l’exemple suivant retrouve son propre en-tête.'
  faraday_london:
    name: 'Tirer de l’électricité du magnétisme'
    place: 'Londres'
    figure: 'Michael Faraday'
    story: 'Le 29 août 1831, Faraday enregistra un mouvement momentané de l''aiguille dans son expérience sur l''anneau. Le 28 octobre, il fit tourner un disque de cuivre entre les pôles d''un aimant et obtint un courant pendant que le disque continuait de tourner.'
    story_prose:
      opening:
        - 'Un anneau de fer enroulé trône sur le banc de la Royal Institution. Faraday lève les yeux du contact et l''aiguille est déjà de retour à zéro. La personne qui garde les notes demande si elle ne doit saisir aucun résultat ou regarder à nouveau.'
        - 'En août 1831, Faraday observa de brèves déviations lors de l''établissement et de la rupture du contact avec l''anneau. En octobre, il a vu un courant soutenu avec un disque de cuivre en rotation. Vous avez deux observations à préserver. Dans le premier cas, observez quand la déviation commence. Dans la seconde, regardez quand cela se termine.'
        - 'Faites appel à des personnes capables de surveiller le chronométrage et l''aiguille séparément. Pour le disque, une personne ayant une main ferme peut s''occuper du contact.'
      points:
        p1: 'Vous tournez le carnet sur le côté et laissez un côté pour l''instant du contact et l''autre pour l''aiguille. Au fur et à mesure que Faraday se déplace, l''observateur annonce la direction avant que l''aiguille ne revienne. Après une pause, il met une autre marque au moment où le contact est rompu. Deux marques distinctes se trouvent dans la colonne qui était vide.'
        p2: 'Le disque tournant, Faraday demande à l''observateur d''attendre encore un peu. Vous stabilisez le contact là où il a glissé. Lorsque l’observateur regarde à nouveau, l’aiguille est toujours d’un côté. Il n''écrit le retour à zéro qu''après l''arrêt du disque. Le crayon laisse un espace libre entre les deux lectures.'
      outcomes:
        all: 'Les deux disques se côtoient. Avec la bague l''aiguille revint rapidement. Avec le disque, les notes indiquent combien de temps il est resté avant que la rotation ne s''arrête.'
        p1: 'Les brèves déviations de l’anneau sont sur papier. L’autre constat reste à établir.'
        p2: 'Le disque donne une lecture qui dure plus longtemps. L''enregistrement de sonnerie précédent présente un écart et le voyage ne peut pas rester synchronisé.'
      none: 'Les en-têtes de colonnes sont tout ce qui reste sur la feuille. Lorsque l''appareil devient silencieux, personne ne peut effectuer de lecture.'
      not_admitted: 'Quelqu''un à l''intérieur demande aux visiteurs de dégager le passage. De l’extérieur, vous entendez l’observateur demander à regarder à nouveau.'
      desync: 'La déviation de l''anneau ou la lecture soutenue du disque ne parviennent pas à atteindre le portable. Le dossier expérimental n''est plus synchronisé et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Après une pause, il met une autre marque au moment où le contact est rompu. Deux marques distinctes se trouvent dans la colonne qui était vide.'
        p2: 'Il n''écrit le retour à zéro qu''après l''arrêt du disque. Le crayon laisse un espace libre entre les deux lectures.'
    relic: 'Un anneau et une bobine de fer'
    relic_desc: 'Deux bobines de fil sur un anneau de fer doux.'
    points:
      p1: 'Observez la commutation et l''aiguille séparément pour préserver la déviation fugace dans l''expérience de l''anneau de Faraday'
      p2: 'Gardez le collecteur en contact avec le disque de cuivre pendant qu''il tourne, afin que Faraday puisse observer le courant pendant que le disque est en mouvement.'
    points_fail:
      p1: 'L’aiguille est de nouveau au repos avant que quiconque ne regarde. L''expérience est saisie comme un résultat nul et le bureau rappelle l''employé après une perte de synchronisation.'
      p2: 'Le contact glisse pendant que le disque tourne. Il n''y a pas de lecture soutenue dans cette branche, et le bureau rappelle le salarié.'
    shift:
      p1:
        was: 'Le 29 août 1831, Faraday observa un bref courant induit lorsque l''appareil à anneau de fer était allumé et éteint.'
      p2:
        was: 'Le 28 octobre 1831, Faraday observa un courant tandis qu''un disque de cuivre tournait entre les pôles d''un aimant.'
    vignettes:
      instant: 'L''assistant écrit que l''aiguille a bougé. Vous laissez de l''espace pour le moment où il a bougé. Au moment où il regarde l’instrument, l’aiguille s’est installée.'
      skeptic: 'Vous demandez si la lecture est restée en place. L''assistant montre le blanc après la première marque. Ensemble, vous l''étiquetez comme un retour au repos afin que personne ne confonde le blanc avec une lecture manquée.'
      sketch: 'Vous dessinez l''anneau dans la marge et marquez ses deux jeux d''enroulements sur les côtés opposés. L''assistant peut désormais associer l''observation au bon appareil.'
  pasteur_paris:
    name: 'L’été à Arbois'
    place: 'Arbois'
    figure: 'Louis Pasteur'
    story: 'À l''été 1859, Jeanne, la fille aînée de Pasteur, âgée de neuf ans, séjournait chez son grand-père à Arbois tandis que son père travaillait à Paris. En septembre, elle tomba malade de la fièvre typhoïde et y mourut.'
    story_prose:
      opening:
        - 'Une courte lettre de Paris trône près de la fenêtre de la maison du grand-père de Jeanne à Arbois. Jeanne n''est pas entrée dans la cour cet après-midi. Son grand-père va au chevet de temps en temps. De là, il peut entendre quand quelqu''un vient chercher le courrier.'
        - 'Jeanne séjourna chez son grand-père à l''été 1859. Dans l''histoire, elle mourut de la typhoïde en septembre. Dans cette branche, la trousse médicale fictive du cabinet peut changer le cours de sa maladie. Son grand-père pourra peut-être écrire qu''elle est de nouveau assise.'
        - 'Envoyez un voyageur expérimenté et le kit nano du bureau. Demandez à son grand-père où il a besoin d''aide et restez à proximité pendant qu''il attend qu''elle se réveille.'
      points:
        p1: 'Son grand-père déplace la chaise pour qu''il puisse voir le lit. Vous remettez la trousse de bureau à l''aide-soignant et le laissez rester là où Jeanne le souhaite. Lorsqu''elle se réveille et demande à s''asseoir, il sort son papier à lettres et lui demande ce qu''elle aimerait qu''il ajoute. Elle lui demande d''écrire d''abord à maman, puis réfléchit à une phrase pour papa.'
      outcomes:
        all: 'Son grand-père lui écrit pour lui dire qu''elle se rétablit. Il laisse la courte lettre à côté de celle envoyée par son père, prête à être envoyée par la poste.'
        p1: 'Jeanne a assez de force pour s''asseoir un moment. Son grand-père peut écrire à ses parents avec les mots qu’elle utilisait à son réveil.'
      none: 'Quand quelqu''un vient chercher le courrier, son grand-père plie encore une fois le drap. Dans l''histoire, Jeanne ne s''est pas remise de cette maladie.'
      not_admitted: 'La famille n''a pas encore admis le visiteur. La personne qui récupère le courrier part la première et la lettre de Paris reste à l''intérieur.'
      excerpts:
        p1: 'Lorsqu''elle se réveille et demande à s''asseoir, il sort son papier à lettres et lui demande ce qu''elle aimerait qu''il ajoute. Elle lui demande d''écrire d''abord à maman, puis réfléchit à une phrase pour papa.'
    relic: 'Une enveloppe d''Arbois'
