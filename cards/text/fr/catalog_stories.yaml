      excerpts:
        p3: 'Tesla change deux chiffres du tableau avec son stylo, le plie et le glisse dans l''enveloppe adressée à Morgan. Il sort du hangar et le vent du Sound soulève le bord de son chapeau.'
        p2: 'Quand la réponse arrive, le contremaître épingle les deux pages sur les deux murs du hangar. Il se place entre eux pour regarder et trace une ligne sous la page du laboratoire.'
        p1: 'Le contremaître ramasse l''ensemble révisé, le tient un moment à la lumière de la fenêtre, le plie en deux et le glisse dans la poche de sa veste. Il sort du hangar, appelle le bluff et demande aux hommes d''apporter les tas.'
    relic: 'La copie d’un plan'
    relic_desc: 'Une copie d''une feuille de plan de Wardenclyffe, pliée en deux, avec une date au crayon sous le pli.'
    points:
