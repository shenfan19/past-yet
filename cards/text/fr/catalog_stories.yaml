      p2: 'L''enquête est laissée en attente d''une réponse. Les sonates paraissent des années après sa mort avec une dédicace différente.'
      p3: 'Comme dans l''histoire, il s''installe chez son frère encore malade en septembre, et y décède le 19 novembre.'
    shift:
      p1:
        was: 'Le 26 mars 1828, Schubert donna à Vienne un concert de sa propre musique avec l''aide d''amis et d''interprètes.'
      p2:
        was: 'Le 2 octobre 1828, Schubert offrit ses trois dernières sonates et nomma son dédicataire. Ils furent publiés pour la première fois en 1839.'
        now: '{staff} reçoit les trois partitions et la dédicace envoyées ensemble et demande une confirmation écrite. Schubert le reçoit de son vivant, et la dédicace reste dans la musique.'
      p3:
        was: 'Septembre 1828 : Schubert, déjà malade, s''installe dans l''appartement de son frère Ferdinand dans une nouvelle maison à Wieden et y meurt le 19 novembre, à l''âge de trente et un ans.'
        now: 'Le médicament apporté par {staff} l''a guéri. Il ne tomba pas malade en novembre et continua à vivre et à écrire de la musique à Vienne pendant des années. Ce qu''il a écrit ne figure pas dans le récit de ce voyage.'
        who: 'schubert_vienna'
        bio: 'Dans cette période, Schubert a été guéri à l''automne où il avait trente et un ans, a vécu de nombreuses années et a continué à composer à Vienne.'
    vignettes:
      chairs: 'Le soir du 25 mars, {staff} aide le portier de la société à disposer les chaises dans le hall, rangée par rangée, jusqu''à ce que le portier manque de chaises avant de manquer de noms. Il dit qu’il n’a jamais vu autant de gens vouloir s’asseoir dans une même pièce pour un homme qui n’est pas encore mort.'
      tavern: 'Un soir de juillet, {staff} est assis dans un jardin viticole à l''extérieur des murs de la ville pendant qu''un violoniste et un guitariste jouent des valses. Le violoniste s''arrête entre deux d''entre eux pour dire que dans cette chaleur les cordes s''aplatissent dès le deuxième couplet, et que le seul remède est de jouer plus vite.'
      stairs: 'Début septembre, {staff} aide la propriétaire d''une nouvelle maison à Wieden à monter les paniers dans les escaliers. Le plâtre sent encore la chaux, et elle dit que la cage d''escalier est si neuve qu''elle répond : dites un mot au rez-de-chaussée et le troisième l''entend deux fois.'
  keats_rome:
    name: 'Une chambre près de l’escalier'
    place: 'Rome'
    figure: 'John Keats'
    story: 'En novembre 1820, John Keats, atteint de tuberculose, vint à Rome avec le peintre Joseph Severn et s''installa au 26 Piazza di Spagna, à côté de la Place d''Espagne. Il y mourut dans la nuit du 23 février 1821 et fut inhumé le 26 février au cimetière près de la pyramide de Cestius. A son souhait, sa pierre tombale ne donne pas son nom.'
    story_prose:
      opening:
        - 'Rome, mi-novembre 1820. Le poète John Keats, vingt-cinq ans et atteint de tuberculose, loge chez le peintre Joseph Severn au deuxième étage du 26 Piazza di Spagna, au pied de la Place d''Espagne. En quelques années, il a écrit ses principaux poèmes, parmi lesquels les odes, et c''est son dernier hiver.'
        - 'Dans l''histoire, le docteur James Clark l''a soumis à un régime de famine, un anchois et un morceau de pain par jour, et l''a saigné encore et encore ; Severn s''occupa de lui seul, l''argent cessa bientôt et les nuits se passèrent sans sommeil ; jusqu''au bout, il a cru n''avoir rien laissé derrière lui et, à son gré, sa pierre tombale ne porte aucun nom. Dans cette succursale, un fleuriste vend des violettes au pied des marches, et un voisin d''escalier demande souvent des nouvelles du locataire malade.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît la médecine et peut arrêter le saignement, ou quelqu'un disposant d'un manuel de soins moderne\_; quelqu'un qui peut surveiller les longues nuits et tenir le coup, ou quelqu'un avec un régulateur de sommeil ; quelqu'un de lettré qui connaît la poésie et qui peut lui dire ce que deviendront ses poèmes."
      outcomes:
        all: 'Tard le 23 février, Keats mourut, avec Severn au chevet. Ces derniers mois, il pouvait manger de la soupe chaude et du pain, et il avait entendu quelqu''un dire que ses poèmes continueraient à être lus. Trois jours plus tard, il fut enterré au cimetière près de la pyramide de Cestius et, à sa demande, la pierre ne portait aucun nom.'
        p3: 'Le 26 février, il fut enterré au cimetière près de la pyramide de Cestius et, à sa demande, la pierre ne portait aucun nom. La pièce située à côté de la Place d''Espagne a été conservée et sa fenêtre donne toujours sur la place.'
        p2: 'Ces derniers mois, il y avait bien plus sur la table qu''un anchois et un morceau de pain. Le 26 février 1821, il fut enterré au cimetière près de la pyramide de Cestius.'
        p1: 'Tard le 23 février, Keats mourut et Severn resta au chevet jusqu''à la fin. Plus de cinquante ans plus tard, Severn fut enterré dans le même cimetière, à côté de Keats.'
      none: 'En janvier, Severn s''est épuisé et s''est effondré dans la pièce voisine. Tard le 23 février, le morceau de pain et les anchois étaient toujours sur la table et la chaise près du lit était vide.'
      desync: 'En janvier, Severn s''est effondré. Lorsque {staff} a été rappelé, il gisait habillé dans la pièce voisine, la lettre à moitié écrite toujours ouverte sur la table et la bouteille d''encre débouchée.'
      not_admitted: '{staff} n''est jamais entré dans la maison et n''a puisé de l''eau que quelques fois à la fontaine en forme de bateau située au pied des marches. Lorsque le fleuriste a demandé qui était malade à l''étage, {staff} n''a pas eu de réponse et la fenêtre du deuxième étage est restée fermée.'
      points:
        p2:
          class_medical: 'Le matin du 9 décembre, Keats a craché deux tasses de sang. Le Dr Clark est venu, a retroussé sa manche et a dit qu''il prendrait huit onces supplémentaires ; sur la table se trouvaient la nourriture du jour, un anchois et un morceau de pain. {staff}, qui connaissait la médecine, a tenu le poignet du patient et a dit qu''il ne supportait pas de saigner ainsi, puis il a raconté au médecin tout ce qu''il avait mangé ces derniers jours, et le médecin a rangé la lancette. A midi, Severn apporta un bol de soupe chaude et un morceau de pain. Keats s''appuya contre les oreillers, finit le repas cuillerée par cuillerée et lui rendit le bol vide.'
          else: 'Le matin du 9 décembre, Keats a craché deux tasses de sang. Le Dr Clark est venu, a retroussé sa manche et a dit qu''il prendrait huit onces supplémentaires ; sur la table se trouvaient la nourriture du jour, un anchois et un morceau de pain. {staff} a ouvert le manuel de soins modernes apporté, en a lu un passage à haute voix au médecin, a noté tout ce que le patient avait mangé au cours des derniers jours et l''a déposé devant lui, et le médecin a rangé la lancette. A midi, Severn apporta un bol de soupe chaude et un morceau de pain. Keats s''appuya contre les oreillers, finit le repas cuillerée par cuillerée et lui rendit le bol vide.'
        p1:
          class_medical: 'Le 15 janvier, Severn écrivit que la banque avait renvoyé sa facture et que l''argent en main ne paierait qu''une fois de plus le loyer ; Keats ne le quittait pas des yeux, il ne pouvait donc pas sortir pour peindre pour de l''argent et il n''avait pas dormi de toute la nuit. {staff}, formé en soins infirmiers, prenait en charge les nuits, soulevant Keats de temps en temps pour tousser, essuyant sa sueur et changeant la taie d''oreiller, et n''éteignait la lampe que vers l''aube. Severn dormait habillé dans la pièce voisine, ses bottes toujours en place. Lorsqu''il se réveilla le matin, il ouvrit d''abord la porte et regarda le lit, puis revint et termina la lettre qu''il avait laissée inachevée.'
          else: 'Le 15 janvier, Severn écrivit que la banque avait renvoyé sa facture et que l''argent en main ne paierait qu''une fois de plus le loyer ; Keats ne le quittait pas des yeux, il ne pouvait donc pas sortir pour peindre pour de l''argent et il n''avait pas dormi de toute la nuit. {staff}, habitué à monter la garde, a rapproché une chaise du lit et a envoyé Severn dormir à côté, et s''est levé pour regarder chaque fois que le patient se retournait. Severn dormait habillé dans la pièce voisine, ses bottes toujours en place. Lorsqu''il se réveilla le matin, il ouvrit d''abord la porte et regarda le lit, puis revint et termina la lettre qu''il avait laissée inachevée.'
        p3:
          class_lettered: 'À la mi-février, Keats ne pouvait plus quitter son lit. Il sentait toujours qu''il n''avait rien laissé derrière lui et souhaitait qu''aucun nom ne figure sur sa pierre tombale. {staff}, qui avait lu ses livres, s''asseyait près de son lit et parlait de ses odes : les gens les lisaient encore et encore et les apprenaient par cœur ligne par ligne, et cette chambre de Rome lui serait réservée. Keats écoutait sans parler, les doigts restés longtemps sur le drap. Par la fente de la fenêtre, on entendait le bruit de la fontaine de la place, et dans le livre près du lit se trouvait une violette pressée.'
          class_teaching: 'À la mi-février, Keats ne pouvait plus quitter son lit. Il sentait toujours qu''il n''avait rien laissé derrière lui et souhaitait qu''aucun nom ne figure sur sa pierre tombale. {staff}, qui avait enseigné, s''assit près du lit et dit que dans les classes à venir, les élèves apprendraient par cœur ses odes jusqu''au dernier vers et que cette chambre à Rome lui serait réservée. Keats écoutait sans parler, les doigts restés longtemps sur le drap. Par la fente de la fenêtre, on entendait le bruit de la fontaine de la place, et dans le livre près du lit se trouvait une violette pressée.'
          else: 'À la mi-février, Keats ne pouvait plus quitter son lit. Il sentait toujours qu''il n''avait rien laissé derrière lui et souhaitait qu''aucun nom ne figure sur sa pierre tombale. {staff} s''assit près du lit et parla lentement de ce qu''il adviendrait de ses poèmes : les gens les liraient encore et encore et les apprendraient par cœur ligne par ligne, et cette chambre à Rome lui serait réservée. Keats écoutait sans parler, les doigts restés longtemps sur le drap. Par la fente de la fenêtre, on entendait le bruit de la fontaine de la place, et dans le livre près du lit se trouvait une violette pressée.'
      excerpts:
        p3: 'Keats écoutait sans parler, les doigts restés longtemps sur le drap. Par la fente de la fenêtre, on entendait le bruit de la fontaine de la place, et dans le livre près du lit se trouvait une violette pressée.'
        p2: 'A midi, Severn apporta un bol de soupe chaude et un morceau de pain. Keats s''appuya contre les oreillers, finit le repas cuillerée par cuillerée et lui rendit le bol vide.'
        p1: 'Severn dormait habillé dans la pièce voisine, ses bottes toujours en place. Lorsqu''il se réveilla le matin, il ouvrit d''abord la porte et regarda le lit, puis revint et termina la lettre qu''il avait laissée inachevée.'
    relic: 'Une violette pressée'
    relic_desc: 'Une fleur séchée conservée dans un livre.'
    points:
      p1: 'Gardez Severn debout malgré l''argent arrêté et les nuits blanches, afin qu''il reste aux côtés de Keats jusqu''à la fin.'
      p2: 'Arrêtez le régime de famine et les saignements du Dr Clark, afin qu''il puisse manger et conserver son sang.'
      p3: 'Avant de mourir, faites-lui savoir que ses poèmes seront lus pendant des générations'
    points_fail:
