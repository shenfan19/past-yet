  ahmed_baba_timbuktu:
    name: 'Un nom pour le supplément'
    place: 'Tombouctou'
    figure: 'Ahmed Baba'
    story: 'Après la prise de Tombouctou par l''armée marocaine en 1591, le savant Ahmad Baba fut accusé de résistance au sultan et fut déporté à Marrakech en 1594. Là, il a compilé des dictionnaires biographiques en complément d''Ibn Farhun. Il fut autorisé à retourner à Tombouctou en 1608 et y mourut le 22 avril 1627.'
    story_prose:
      opening:
        - 'Tombouctou, 1594. Il y a trois ans, l''armée marocaine prenait la ville. Ahmed Baba est un érudit ici ; il a écrit des dizaines de livres sur le droit et la grammaire, et sa maison possède une très grande bibliothèque.'
        - 'Dans l’histoire, cette année, il a été accusé d’avoir défié le sultan et a marché avec sa famille à travers le Sahara, au nord jusqu’à Marrakech. Ses livres ont été emportés, ou selon un autre récit perdus en route. Quatorze ans plus tard, il fut autorisé à rentrer chez lui et les livres avaient disparu. Dans cette succursale, la femme d''un ménage situé au fond de l''allée veut bien libérer un espace sous son lit, et le copiste de la cour écrit encore des étiquettes pour ses livres.'
        - "Trois types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît les vieux livres et quels coffres sauver en premier, quelqu'un assez audacieux et robuste pour résister aux bousculades le jour où il est emmené, et quelqu'un qui sait soigner et peut soigner les blessures et partager l'eau dans le désert."
      outcomes:
        all: 'En 1608 Ahmed Baba revient à Tombouctou. La femme du voisin avait vieilli. Elle sortit les coffres de sous son lit, une couche de poussière sur le cuir. Il ouvrit le volume par le haut et reconnut sa propre main.'
        p3: 'Quatorze ans plus tard, il revient à Tombouctou. Ce ménage sortit les coffres de dessous le lit, passa sa main sur les volumes un à un et resta assis longtemps près des coffres.'
        p2: 'Toute la maisonnée, jeunes et vieux, arriva à Marrakech. Près de la porte de la ville, le pied de l''enfant était recouvert d''une croûte.'
        p1: 'Il est arrivé vivant à Marrakech. Quatorze ans plus tard, il fut autorisé à rentrer chez lui.'
      none: 'La colonne allant vers le nord s''éloigna. Dans cette pièce de Tombouctou, les étagères étaient vides et la porte n''était pas fermée.'
      desync: 'Le jour où il a été emmené, il y a eu une bagarre au coin de la rue et {staff} a été rappelé par le bureau avant d''arriver à ses côtés. La dernière chose en vue était une chaussure piétinée par la foule.'
      not_admitted: '{staff} n’est jamais entré dans cette cour. Les livres étaient toujours sur les étagères, et le jour où il serait emmené approchait.'
      points:
        p3:
          class_craft: '{staff} a suivi les règles de réparation des vieux livres, a posé du tissu sec entre les volumes les plus cassants, le cuir vers l''intérieur, les rabats pressés à plat, et les a emballés couche par couche dans les coffres. À la nuit tombée, deux hommes ont transporté les coffres à travers deux ruelles jusqu''à la maison de la femme du voisin. Elle a sorti le désordre de sous son lit, a poussé les coffres, a replacé le désordre là où il était et s''est épousseté les mains.'
          class_lettered: '{staff} a choisi d''après la liste des livres, d''abord ses propres brouillons et dont il n''existait aucun exemplaire, et les a emballés couche par couche dans les coffres. À la nuit tombée, deux hommes ont transporté les coffres à travers deux ruelles jusqu''à la maison de la femme du voisin. Elle a sorti le désordre de sous son lit, a poussé les coffres, a replacé le désordre là où il était et s''est épousseté les mains.'
          else: '{staff} a parcouru les titres volume par volume, a d''abord mis de côté ses propres brouillons et les exemplaires rares, et les a rangés dans les coffres couche par couche. À la nuit tombée, deux hommes ont transporté les coffres à travers deux ruelles jusqu''à la maison de la femme du voisin. Elle a sorti le désordre de sous son lit, a poussé les coffres, a replacé le désordre là où il était et s''est épousseté les mains.'
        p1: 'Le jour où il fut emmené, la rue était bondée et, sous sa bousculade, quelqu''un dégaina une lame. {staff} s''est tenu devant Ahmed Baba, l''a entraîné dans l''embrasure d''une porte et s''est appuyé contre le cadre de la porte. Quand ce fut passé, il redressa sa robe et sortit tout seul, indemne.'
        p2: 'Après un demi-mois de route vers le nord, un homme de la colonne avait une forte fièvre et un enfant avait la plante des pieds à vif. Chaque soir, après l''établissement du camp, {staff} lavait les blessures, changeait les pansements et distribuait l''eau à hauteur de chacun. Une nuit, l''enfant lui tendit sa propre outre ; il en restait une bouchée.'
      excerpts:
        p3: 'À la nuit tombée, deux hommes ont transporté les coffres à travers deux ruelles jusqu''à la maison de la femme du voisin. Elle a sorti le désordre de sous son lit, a poussé les coffres, a replacé le désordre là où il était et s''est épousseté les mains.'
        p2: 'Chaque soir, après l''établissement du camp, {staff} lavait les blessures, changeait les pansements et distribuait l''eau à hauteur de chacun. Une nuit, l''enfant lui tendit sa propre outre ; il en restait une bouchée.'
        p1: '{staff} s''est tenu devant Ahmed Baba, l''a entraîné dans l''embrasure d''une porte et s''est appuyé contre le cadre de la porte. Quand ce fut passé, il redressa sa robe et sortit tout seul, indemne.'
    relic: 'Un manuscrit relié en cuir'
    relic_desc: 'Manuscrit sous couverture de cuir usé à rabat.'
    points:
      p1: 'Avant qu''il ne soit emmené, arrêtez les coups de couteau tournés contre les érudits arrêtés et gardez Ahmed Baba en vie pour la route vers le nord.'
      p2: 'Soignez les parents qui tombent malades ou se blessent dans le désert, partagez l''eau et empêchez la famille de prendre du retard.'
      p3: 'Avant que les soldats ne prennent les livres, sauvez quelques coffres de sa bibliothèque et laissez-les cachés chez une famille de la ville'
    points_fail:
      p1: 'Dans cette branche, il n''est pas sorti vivant de Tombouctou, et les dictionnaires biographiques de Marrakech et les vingt-neuf livres écrits au Maroc ont disparu.'
      p2: 'Personne n''a aidé ceux qui tombaient sur la route et, dans cette branche, le voyage de la famille vers le nord a été aussi difficile qu''avant.'
      p3: 'Tous ses livres furent confisqués, et dans cette succursale, lorsqu''il revint à Tombouctou quatorze ans plus tard, il ne restait plus aucun de ses propres livres.'
    shift:
      p1:
        was: 'En 1594, Ahmad Baba fut accusé d''avoir défié le sultan et emmené à Marrakech ; en 1608, il fut autorisé à rentrer chez lui à Tombouctou.'
      p2:
        was: 'En 1594, la famille d''Ahmad Baba marcha avec lui vers le nord, à travers le Sahara.'
        now: 'Les parents qui voyageaient avec lui arrivèrent à Marrakech en ayant un peu moins souffert.'
      p3:
        was: 'En 1594, sa bibliothèque fut prise par les Marocains, ou selon un autre récit perdu sur la route vers le nord ; à son retour à Tombouctou en 1608, les livres avaient disparu.'
        now: 'Avant son enlèvement, quelques coffres de livres ont été déplacés sous un lit dans une maison de la ville. Lorsqu''il revint chez lui quatorze ans plus tard, cette famille emporta les coffres.'
        who: 'ahmed_baba_timbuktu'
        bio: 'Ahmad Baba rentra à Tombouctou en 1608 et trouva quelques coffres contenant ses propres livres encore conservés par une famille de la ville. Il leur a enseigné au cours de ses dernières années.'
    vignettes:
      same_name: '{staff} trouve un nom écrit de deux manières dans deux volumes et conserve les deux orthographes dans la liste, avec une marque entre elles, au lieu d''en choisir une.'
      courtyard: '{staff} dispose les volumes à l''ombre de la cour pour les aérer après les pluies, et retourne chacun à midi pour que les couvertures sèchent uniformément.'
      slip: '{staff} écrit le titre et la première ligne de chaque volume sur une feuille étroite et le glisse sous le rabat en cuir, afin que le livre puisse être nommé sans l''ouvrir.'
  nezahualcoyotl_texcoco:
    name: 'Le nom à côté d’un chant'
    place: 'Texcoco'
    figure: 'Nezahualcoyotl'
    story: 'Nezahualcoyotl devint seigneur de Texcoco en 1431 et la dirigea jusqu''à sa mort en 1472. On se souvient de lui comme d''un poète et d''un bâtisseur ; une longue digue sur le lac Texcoco aurait été aménagée par lui. Les chansons en nahuatl rassemblées au XVIe siècle sont associées à son nom, même si on ne sait pas si c''est lui qui les a écrites.'
    story_prose:
      opening:
        - 'Texcoco, 1472. Nezahualcoyotl est seigneur de la ville depuis quarante et un ans et a environ soixante-dix ans. On se souvient de lui comme d''un poète et d''un bâtisseur, et on dit que c''est lui qui aurait tracé la longue digue traversant le lac Texcoco qui divise ses eaux.'
        - 'Dans l''histoire, il est décédé cette année et son fils Nezahualpilli, âgé de sept ans, a été choisi pour lui succéder ; les chansons liées à son nom ont été copiées dans un livre de chansons environ cent ans plus tard, et personne ne sait qui les a chantées en premier. Dans cette branche, un vieux chanteur du palais qui connaît ces chansons veut les apprendre à un apprenant, un chanteur aux répétitions laisse une réplique pour la suivante et un assistant tient les feuilles de pratique en ordre.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui peut surveiller, quelqu'un d'audacieux ou de très dur, ou quelqu'un avec un régulateur de sommeil, pour assurer la sécurité d'un enfant dans les jours instables\_; quelqu'un qui a enseigné ou connaît la musique, quelqu'un de patient ou d'infirmier, ou quelqu'un avec un enregistreur vocal, pour apprendre les chansons ligne par ligne ; quelqu'un de calme qui tiendra compagnie à une personne, quelqu'un qui pourra soigner les malades, ou quelqu'un avec un projecteur d'hologramme, pour s'asseoir avec lui dans ses derniers jours."
      outcomes:
        all: 'Cette année-là, Nezahualpilli, sept ans, fut choisi seigneur de Texcoco. Les chansons étaient transmises du début à la fin, et l''apprenant les enseignait ensuite à son propre apprenant. Environ cent ans plus tard, elles furent copiées dans un recueil de chansons, sous son nom.'
        p3: 'Cette année-là, Nezahualcoyotl mourut à Texcoco. Environ cent ans plus tard, les chansons liées à son nom furent copiées dans un recueil de chansons ; plus de cinq cents ans plus tard, son visage était imprimé sur le billet de cent pesos mexicain.'
        p2: 'L''apprenant a bien connu les chansons et les a ensuite enseignées à un de ses propres apprenants. Environ cent ans plus tard, elles furent copiées dans un recueil de chansons, avec son nom à côté.'
        p1: 'Nezahualpilli, sept ans, fut choisi seigneur de Texcoco et occupa ce siège pendant plus de quarante ans.'
      none: 'Cette année-là, Nezahualcoyotl mourut à Texcoco. Lorsque le vieux chanteur tomba malade, les chants n''étaient pas encore tous enseignés et la seconde moitié de la feuille d''exercices resta vierge ; le jour du choix, le palais attendit en vain le garçon de sept ans.'
      desync: 'Dans les nuits qui suivirent sa mort, personne ne surveillait le seuil. Lorsque {staff} a été rappelé, le jour du choix n''était pas encore venu, la chambre dans laquelle le garçon avait dormi était vide et le tapis était enroulé contre le mur.'
      not_admitted: '{staff} n''est jamais entré dans le palais et n''a entendu que les chanteurs répéter depuis la ville. Un chanteur terminait une ligne et reculait pour laisser la place à la suivante ; à qui appartenait cette chanson, chaque auditeur disait quelque chose de différent.'
      points:
        p2:
          class_teaching: 'Cette année-là, le vieux chanteur du palais ne pouvait plus chanter longtemps et devait s''arrêter pour reprendre son souffle au milieu d''une chanson. Il avait l''intention d''enseigner les chants liés au nom de Nezahualcoyotl à un apprenant du palais. {staff}, qui avait enseigné, demandait à l''apprenant de répéter une ligne à la fois, en apprenant chaque ligne avant de passer à la suivante, en parcourant l''intégralité du début à la fin de chaque journée et en marquant le bord de la feuille d''exercices partout où une ligne allait mal. Le soir où la dernière chanson était enseignée, l''apprenant la chantait du début à la fin sans manquer une ligne. Le vieux chanteur ne dit rien, sa main gardant doucement la mesure sur son genou.'
          else: 'Cette année-là, le vieux chanteur du palais ne pouvait plus chanter longtemps et devait s''arrêter pour reprendre son souffle au milieu d''une chanson. Il avait l''intention d''enseigner les chants liés au nom de Nezahualcoyotl à un apprenant du palais. {staff} était assis patiemment à côté d''eux ; chaque fois que le vieux chanteur chantait une ligne, l''apprenant la chantait en retour, et là où l''apprenant hésitait, il était demandé au vieil homme de la chanter encore, et encore si une fois ne suffisait pas. Le soir où la dernière chanson était enseignée, l''apprenant la chantait du début à la fin sans manquer une ligne. Le vieux chanteur ne dit rien, sa main gardant doucement la mesure sur son genou.'
        p3:
          class_medical: 'Dans ses derniers jours, les gens qui allaient et venaient dans sa chambre marchaient doucement. {staff}, qui savait soigner les malades, l''entoura de la couverture et tint la tasse pendant qu''il buvait, et ce n''est que lorsqu''ils furent seuls qu''ils se rapprochèrent et commencèrent lentement à parler de ce qui allait arriver. Environ cent ans plus tard, quelqu’un copiait une par une les chansons liées à son nom dans un livre. Plus de cinq cents ans plus tard, des gens lointains connaîtraient encore son nom et son visage serait imprimé sur leur argent. Après avoir tout entendu, il resta silencieux pendant un long moment, puis tourna la tête pour regarder le lac par la porte.'
          else: 'Dans ses derniers jours, les gens qui allaient et venaient dans sa chambre marchaient doucement. {staff} est resté assis avec lui tout un après-midi, et ce n''est que lorsqu''ils étaient seuls qu''ils ont commencé lentement à parler de ce qui allait arriver. Environ cent ans plus tard, quelqu’un copiait une par une les chansons liées à son nom dans un livre. Plus de cinq cents ans plus tard, des gens lointains connaîtraient encore son nom et son visage serait imprimé sur leur argent. Après avoir tout entendu, il resta silencieux pendant un long moment, puis tourna la tête pour regarder le lac par la porte.'
        p1: 'Dans les jours qui suivirent sa mort, les nobles se rassemblèrent pour décider qui lui succéderait, et de plus en plus de personnes allaient et venaient dans le palais chaque jour. Nezahualpilli, sept ans, a été conduit d''une pièce à l''autre. {staff} surveillait l''extérieur de la pièce où il dormait, ne sortait pas la nuit, arrêtait tous les étrangers qui venaient demander leurs affaires en premier et s''asseyait près du seuil seulement lorsque le garçon dormait. Le matin du choix, le garçon fut conduit hors de la porte par la main, le bord de son manteau effleurant le seuil. L''endroit à côté où quelqu''un s''était assis pendant plusieurs nuits était devenu pâle.'
      excerpts:
        p3: 'Plus de cinq cents ans plus tard, des gens lointains connaîtraient encore son nom et son visage serait imprimé sur leur argent. Après avoir tout entendu, il resta silencieux pendant un long moment, puis tourna la tête pour regarder le lac par la porte.'
        p2: 'Le soir où la dernière chanson était enseignée, l''apprenant la chantait du début à la fin sans manquer une ligne. Le vieux chanteur ne dit rien, sa main gardant doucement la mesure sur son genou.'
        p1: 'Le matin du choix, le garçon fut conduit hors de la porte par la main, le bord de son manteau effleurant le seuil. L''endroit à côté où quelqu''un s''était assis pendant plusieurs nuits était devenu pâle.'
    relic: 'Un aide-mémoire pour le chant'
    relic_desc: 'Une fiche d''exercice avec des emplacements séparés pour deux noms.'
    points:
      p1: 'Dans les jours qui ont suivi sa mort, pendant que les nobles choisissent l''héritier, gardez en sécurité Nezahualpilli, sept ans.'
      p2: 'Aidez un apprenant de la maison à apprendre chaque ligne des chansons liées à son nom auprès d''un vieux chanteur'
      p3: 'Dans ses derniers jours, faites-lui savoir que son nom reste dans les mémoires plus de cinq cents ans plus tard.'
    points_fail:
