      p2: 'Le 9 décembre, on lui a encore saigné huit onces de sang comme auparavant, et chaque jour il ne lui restait plus qu''un anchois et un morceau de pain.'
      p3: 'Il croyait toujours qu’il n’avait rien laissé derrière lui. Dans cette branche, personne ne lui a dit le contraire ces derniers jours.'
    shift:
