catalog:
  sun_yat_sen_guangzhou:
    name: "De la statue à une nouvelle université"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "Devant la statue de Sun Yat-sen à l’université qui porte son nom, vous êtes ramené à Guangzhou le 4 février 1924. Ce jour-là, il ordonne de réunir trois écoles pour fonder l’Université nationale du Guangdong et charge Zou Lu des préparatifs. Durant ces mêmes mois, il donne le dimanche des conférences dans la salle de l’École normale supérieure. Les notes passent de main en main avant de devenir un livre. Les cours commencent le 19 septembre et l’inauguration a lieu le 11 novembre, avec la devise qu’il a rédigée. Il meurt à Pékin le 12 mars 1925 ; en 1926, l’université prend son nom."
    relic: "La statue de Sun Yat-sen"
    relic_desc: "La statue se trouve sur le campus de l’université Sun Yat-sen. Elle donne accès à Guangzhou en 1924. Ce n’est pas une antiquité et elle ne peut pas être vendue."
    points:
      p1: "Tracer un itinéraire pour afficher les avis d’inscription hors des murs et le remettre aux messagers"
      p2: "Visiter les trois écoles grâce à une recommandation et remettre une synthèse avant la première réunion"
      p3: "Comparer les terrains envisagés et rendre une carte avant le choix de Shipai"
      p4: "Vérifier les listes des diplômés des trois écoles et remettre un registre unique pour le 21 juin"
      p5: "Rejoindre l’équipe à Shipai et planter les bornes du nouveau campus"
    points_fail:
      p1: 'Dans cette branche, l''avis n''est affiché qu''en ville, et les élèves du dehors l''apprennent quand les inscriptions ont déjà commencé.'
      p2: 'La première réunion préparatoire se tient comme dans l''histoire, chaque école ne parle encore que de ses propres soucis, et aucune liste ne les réunit.'
      p3: 'Shipai est choisi comme dans l''histoire, et le bureau n''a aucune feuille où les sites soient dessinés ensemble.'
      p4: 'La remise des diplômes du 21 juin a lieu comme prévu. Le bureau doit consulter les trois listes séparément.'
      p5: 'Le terrain de Shipai n''est délimité que sur le papier, comme dans l''histoire, et pas un piquet n''y est planté.'
    shift:
      p1:
        was: '9 juin 1924 : l''Université nationale du Guangdong confie le recrutement aux bureaux provinciaux de l''éducation, et le 10 juin s''ouvrent les inscriptions à l''examen des classes préparatoires, avec 520 places prévues.'
        now: 'Dans cette branche, l''avis de recrutement est aussi affiché aux carrefours hors de la ville et sur les quais.'
      p2:
        was: '3 mars 1924 : la première réunion préparatoire se tient, et le premier point de son ordre du jour est la fin d''études des élèves des trois écoles.'
        now: 'Dans cette branche, une liste des difficultés des trois écoles est posée sur la table de la réunion.'
      p3:
        was: '1924 : les écoles sont dispersées et difficiles à gérer, Sun Yat-sen charge Zou Lu de choisir un nouveau campus à Shipai, et le terrain est délimité dans l''année.'
        now: 'Dans cette branche, une carte des sites et de Shipai est jointe aux papiers du choix.'
      p4:
        was: '21 juin 1924 : Zou Lu prend ses fonctions de président de l''Université nationale du Guangdong, et la cérémonie de remise des diplômes des trois écoles a lieu le même jour.'
        now: 'Dans cette branche, le bureau dispose d’une seule liste vérifiée pour la cérémonie.'
      p5:
        was: '1924 : Sun Yat-sen fait choisir Shipai par Zou Lu pour le nouveau campus, mais la construction ne commence qu''en 1933 et les premiers collèges n''emménagent qu''à l''automne 1934. Sun meurt le 12 mars 1925 sans l''avoir vu.'
        now: 'Dans cette branche, avant qu''il ne quitte Canton en novembre, les bornes du terrain de Shipai sont déjà plantées, piquet après piquet.'
        who: sun_yat_sen_guangzhou
        bio: 'Dans cette ligne du temps, les bornes du nouveau campus de Shipai sont plantées avant que Sun Yat-sen ne quitte Canton.'
    shift_all: "Les cinq missions sont terminées. Avec le recul, elles font écho aux mots que Sun Yat-sen écrira pour la devise de l’université : étudier largement, s’enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance."
    vignettes:
      slips: "Un employé fictif s’apprête à copier une page dont deux lignes sont couvertes par un billet collé. Vous lui demandez qui a écrit le billet et qui a écrit la page. Il copie d’abord la page, sans déplacer le billet."
      back_row: "Un étudiant fictif ne trouve pas de place et se lève sans cesse pour voir. Vous vous décalez sur le banc. Il écoute la suite en silence et vous salue d’un signe de tête quand la salle se vide."
      hundred: "Au dos de votre carnet, vous comptez les jours par groupes de cinq traits. À cent, un employé fictif vous demande ce que vous comptez. Vous répondez : les jours."
  lalibela_rock:
    name: 'Deux couches sur la paroi'
    place: 'Lalibela, Éthiopie'
    figure: 'L’équipe de dégagement de Lalibela'
    story: 'La première phase de restauration à Lalibela commence le 19 décembre 1966. Le déblaiement des sédiments remet au jour des tranchées creusées dans la roche. Des objets mis au jour lors de la campagne, on n’a conservé que quelques photos et aucun inventaire détaillé.'
    relic: 'Un relevé de la paroi'
    relic_desc: 'Une coupe indique l’épaisseur des couches et la position des tessons.'
    points:
      p1: 'Mesurer les couches avec l’équipe et laisser sur place une copie de la coupe indiquant la position des tessons'
    points_fail:
      p1: 'La terre est évacuée. On ne peut plus mesurer la position d’origine des tessons.'
    shift:
      p1:
        was: 'Quelques photographies subsistent, sans permettre de retrouver la position des objets dans les différentes couches.'
        now: 'Une coupe reste à Lalibela. On peut y retrouver l’épaisseur des couches et la position des tessons.'
    vignettes:
      work: '{staff} voit la bande claire apparaître sous la lame d’une bêche.'
    story_prose:
      opening:
      - 'Lalibela, hiver 1966. Au coude de la tranchée, une bande de terre claire apparaît sous la boue. Des tessons y sont encore pris.'
      - 'Les ouvriers dégagent une tranchée depuis longtemps comblée. Quelques photos des trouvailles ont traversé les années. Elles ne suffisent pas à retrouver leur position.'
      - 'Il reste le temps de mesurer cette paroi avant le prochain panier.'
      points:
        p1: '{staff} demande une pause, mesure les couches et reporte chaque tesson sur le relevé. Un ouvrier recopie les mesures sur la feuille qui restera sur place.'
      outcomes:
        all: 'Des années plus tard, une règle contre la roche retrouve la hauteur de la bande claire.'
        p1: 'Des années plus tard, une règle contre la roche retrouve la hauteur de la bande claire.'
      none: 'La paroi est raclée. La terre rejoint le panier précédent.'
      not_admitted: '{staff} reste au bord de la tranchée. Un ouvrier enroule une corde sur une planche.'
      excerpts:
        p1: '{staff} demande une pause, mesure les couches et reporte chaque tesson sur le relevé. Un ouvrier recopie les mesures sur la feuille qui restera sur place.'
  ife_bronzes:
    name: 'Un plan avant le remblai'
    place: 'Ile-Ife, Nigeria'
    figure: 'L’équipe de fouille d’Ita Yemoo'
    story: 'Les fouilles de sauvetage d’Ita Yemoo, à Ile-Ife, commencent en décembre 1957. L’équipe dégage des pavements en tessons. Le premier grand pavement est couvert par la suite, tandis que la plupart des tranchées sont remblayées. D’autres chercheurs doivent reconstituer leur emplacement à partir de pièces éparses.'
    relic: 'Un plan de fouille avec une ligne de référence'
    relic_desc: 'Une même ligne le long de la route sert à repérer plusieurs tranchées.'
    points:
      p1: 'Raccorder les tranchées à une même ligne avant le remblai et laisser à Ife un plan vérifiable sur le terrain'
    points_fail:
      p1: 'Les tranchées sont comblées. Pour les localiser, il ne reste que des documents épars.'
    shift:
      p1:
        was: 'Les chercheurs ont dû reconstituer l’implantation des tranchées en l’absence d’un plan d’ensemble.'
        now: 'Un plan reprend des points fixes et reste à Ife. On peut retrouver les anciennes tranchées.'
    vignettes:
      work: '{staff} voit défiler les chiffres du ruban taché de terre.'
    story_prose:
      opening:
      - 'Ile-Ife, décembre 1957. Près de la route, l’équipe dégage à la brosse le bord d’un pavement de tessons.'
      - 'Le premier grand pavement sera couvert, mais la plupart des tranchées seront comblées. Plus tard, leur emplacement sera reconstitué à partir de notes et de photos.'
      - 'Tant que les bords sont visibles, l’équipe peut encore les reporter depuis un même repère.'
      points:
        p1: '{staff} et l’équipe tendent un ruban jusqu’à un repère au bord de la route. Chaque coin mesuré est reporté sur un second plan, qui restera à Ife.'
      outcomes:
        all: 'Longtemps après, une personne part du même repère et retrouve l’angle d’une ancienne tranchée.'
        p1: 'Longtemps après, une personne part du même repère et retrouve l’angle d’une ancienne tranchée.'
      none: 'La terre efface le dernier angle. Deux croquis sans repère commun ne se raccordent pas.'
      not_admitted: '{staff} reste derrière la clôture. Un membre de l’équipe rentre le ruban.'
      excerpts:
        p1: '{staff} et l’équipe tendent un ruban jusqu’à un repère au bord de la route. Chaque coin mesuré est reporté sur un second plan, qui restera à Ife.'
  great_zimbabwe:
    name: 'La plateforme de terre au pied du mur'
    place: 'Masvingo, Zimbabwe'
    figure: 'Les ouvriers de l’enceinte occidentale'
    story: 'En 1915, la plupart des plateformes, bancs et murs de terre de l’enceinte occidentale du Grand Zimbabwe sont enlevés. On craint qu’ils fragilisent les murs de pierre sèche. La fosse ainsi ouverte continue de s’éroder.'
    story_prose:
      opening:
        - 'Grand Zimbabwe, 1915. Au pied des murs en pierre sèche de l’enceinte occidentale se trouvent encore des plateformes et des bancs en terre. Ils se trouvent dans la zone à déblayer.'
        - 'Dans l’histoire, la plupart de ces structures ont été enlevées et la fosse a continué de s’éroder. Dans cette branche, quelqu’un peut examiner la jonction avec les ouvriers avant que le chantier y arrive.'
        - 'Il faut savoir lire un mur et expliquer ce qu’on y voit aux personnes qui travaillent sur place. La partie à préserver doit être repérée avant le déblaiement.'
      points:
        p1: '{staff} examine la jonction avec les ouvriers et leur montre un tronçon qu’ils peuvent laisser. Ils déplacent le tracé du chantier. Un ouvrier plante un piquet au-delà de la plateforme. Une ancienne empreinte de doigt touche encore le joint entre les pierres.'
      outcomes:
        all: 'Plus tard, une personne venue faire un relevé pose sa règle sur la plateforme restante. Un bord repose sur la terre, l’autre touche la pierre.'
        p1: 'Plus tard, une personne venue faire un relevé pose sa règle sur la plateforme restante. Un bord repose sur la terre, l’autre touche la pierre.'
      none: 'Les ouvriers emportent un panier vide. La terre mise à nu est encore fraîche. Une ligne pâle marque son ancien contact avec le mur.'
      not_admitted: '{staff} ne trouve pas de place parmi les ouvriers. En passant le croquis de main en main, on n’en voit qu’un coin au pied du mur.'
      excerpts:
        p1: 'Un ouvrier plante un piquet au-delà de la plateforme. Une ancienne empreinte de doigt touche encore le joint entre les pierres.'
    relic: 'Un croquis en coupe'
    relic_desc: 'Le dessin montre une plateforme de terre au pied d’un mur de pierre sèche.'
    points:
      p1: 'Examiner le pied du mur avec les ouvriers et faire laisser une partie de la plateforme en place avant le déblaiement'
    points_fail:
      p1: 'Comme dans l’histoire, l’essentiel de la terre façonnée est enlevé. Ce tronçon disparaît aussi.'
    shift:
      p1:
        was: 'En 1915, le déblaiement de l’enceinte occidentale fait disparaître de nombreuses plateformes, banquettes et parois de terre.'
        now: 'Dans cette branche, une partie de la plateforme demeure en place. Les relevés ultérieurs peuvent rendre compte de sa jonction avec le mur.'
    vignettes:
      lines: '{staff} suit du regard le pied du mur, jusqu’à la jointure où le bord de la plateforme s’abaisse.'
      width: '{staff} tient le croquis. Un trait figure la pierre, un autre la terre.'
      pace: 'Assis près de la marche, {staff} fait tomber de la boue sèche sur le sable.'
  euclid_alexandria:
    name: 'Tant que les Porismes existaient'
    place: 'Alexandrie'
    figure: 'Euclide'
    story: 'Vers 300 avant notre ère, Euclide compose à Alexandrie les treize livres des Éléments. Il démontre les propositions de géométrie une à une à partir de définitions et de postulats. Il écrit aussi les trois livres des Porismes, un traité sur les coniques et d’autres ouvrages qui se perdront. Au IVe siècle, Pappus peut encore décrire les Porismes et en dénombrer les propositions.'
    relic: 'Un compas de bronze'
    relic_desc: 'Deux branches et une articulation suffisent pour tracer toutes les figures du livre.'
    points:
      p1: 'Aider Euclide à faire plusieurs copies des trois livres des Porismes et à les remettre aux élèves pour que l’ouvrage survive'
    points_fail:
      p1: 'Les Porismes n’ont toujours qu’une seule lignée de copies. Ils se perdent aussi dans cette branche, et il ne reste que les quelques lignes de Pappus.'
    shift:
      p1:
        was: 'Vers 300 avant notre ère, Euclide écrit les trois livres des Porismes. L’ouvrage se perd et on n’en connaît plus que le nombre de 171 propositions et la courte description de Pappus, au IVe siècle.'
        now: '{staff} aide Euclide à copier les Porismes à plusieurs reprises et à remettre les copies à ses élèves en géométrie. Dans cette branche, l’ouvrage parvient aux générations suivantes.'
        who: 'euclid_alexandria'
        bio: 'Dans cette branche, les Porismes d’Euclide ont circulé en plusieurs copies. Les lecteurs des générations suivantes ont ainsi pu lire d’autres textes de lui que les Éléments.'
    vignettes:
      lost: 'Sur la table du copiste, {staff} aperçoit un rouleau des Porismes et sait que les lecteurs à venir devront s’en faire une idée à partir de quelques lignes de Pappus. {staff} garde un instant la main sur le bord du rouleau avant de le lâcher.'
      arcs: 'Comme les élèves, {staff} trace des cercles dans le sable avec une cheville et une corde. Les deux arcs se croisent au troisième point. {staff} aplanit le sable et recommence, la main plus sûre cette fois.'
      papyrus: '{staff} aide le marchand de papyrus à monter ses ballots sur le quai et apprend quelles feuilles résistent à l’humidité du port et lesquelles deviennent cassantes au bout d’un an.'
    story_prose:
      opening:
        - 'Alexandrie, vers 300 avant notre ère. Euclide y compose les treize livres des Éléments et démontre les propositions de géométrie une à une à partir de définitions et de postulats. Deux cercles lui suffisent, dès la première proposition, pour construire un triangle équilatéral sur un segment donné. Il écrit aussi les trois livres des Porismes et un traité sur les coniques.'
        - 'Dans l’histoire, les Porismes ont disparu. Vers 320 de notre ère, Pappus peut encore les décrire et y dénombre 171 théorèmes et 38 lemmes. On ne connaît aucune copie ultérieure. Dans cette branche, un élève trace ses figures dans le sable et un marchand de papyrus sur le quai sait quelles feuilles résistent à l’humidité.'
        - 'Il y a du travail pour qui sait copier, collationner et conserver des livres. Il y en a aussi pour qui peut enseigner la géométrie à un groupe d’élèves, ou lire le texte ligne à ligne avec assez de soin et de savoir.'
      outcomes:
        all: 'Chez les lecteurs des générations suivantes, les trois livres des Porismes voisinent avec les Éléments. À force de passer de main en main, les bords des rouleaux se sont assouplis.'
        p1: 'Chez les lecteurs des générations suivantes, les trois livres des Porismes voisinent avec les Éléments. À force de passer de main en main, les bords des rouleaux se sont assouplis.'
      none: 'On aplanit le sable et on y trace de nouveaux cercles. Après Pappus, plus personne ne déroule les trois livres.'
      not_admitted: '{staff} reste dehors, à la porte de la salle où l’on copie les livres. Sur le quai, le marchand de papyrus continue de porter ses ballots à terre.'
      points:
        p1:
          class_teaching: 'En pédagogue, {staff} répartit les trois livres des Porismes entre les élèves les plus attentifs, puis leur fait relire et comparer leurs copies, mot à mot et figure par figure. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
          class_lettered: 'Comme dans un atelier de copie, {staff} taille les feuilles de papyrus, copie les trois livres des Porismes et vérifie le texte et les figures sur les originaux. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
          else: '{staff} suit le travail des copistes. À chaque rouleau achevé des Porismes, la copie et l’original sont étalés côte à côte pour vérifier les figures. On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
      excerpts:
        p1: 'On roule les copies, on les lie d’une ficelle et on les remet aux élèves en géométrie. Euclide en prend une, défait la ficelle, regarde la première feuille et refait le nœud.'
  socrates_athens:
    name: 'Avant le retour du navire'
    place: 'Athènes'
    figure: 'Socrate'
    story: 'En 399 avant notre ère, Socrate est jugé à Athènes et condamné à mort. Le navire envoyé chaque année à Délos vient de partir. Aucune exécution ne peut avoir lieu avant son retour, et Socrate attend environ trente jours en prison. Il met des fables d’Ésope en vers et ses amis lui rendent visite chaque jour. Le dernier soir, tous sont là sauf Platon, qui est malade. Socrate boit la ciguë.'
    relic: 'Une coupe en terre cuite du marché'
    relic_desc: 'Une coupe athénienne à glaçure noire, avec un petit éclat sur le bord.'
    points:
      p1: 'Apaiser le tumulte du jury pour que Socrate puisse achever sa défense'
      p2: 'Aider Socrate à mettre en vers les fables d’Ésope, à terminer l’hymne à Apollon et à faire sortir une copie de la prison'
      p3: 'Soigner Platon avant le dernier jour pour qu’il puisse rejoindre son maître en prison'
    points_fail:
      p1: 'Le vacarme couvre la défense, qui s’interrompt. La branche se détache de la trame historique et l’agence rappelle son agent.'
      p2: 'Les vers se perdent dans cette branche comme dans l’histoire.'
      p3: 'Malade ce jour-là, Platon reste absent dans cette branche comme dans l’histoire.'
    shift:
      p1:
        was: '399 avant notre ère : Socrate est jugé à Athènes. Dans l’Apologie de Platon, il demande plusieurs fois aux jurés de l’écouter sans protester. Il est déclaré coupable et condamné à mort.'
      p2:
        was: '399 avant notre ère : en attendant l’exécution, Socrate suit un rêve récurrent et met en vers des fables d’Ésope, puis compose un hymne à Apollon. Rien n’en subsiste en entier.'
        now: 'Un ami emporte hors de la prison une copie des vers sur un rouleau, qui reste ensuite à Athènes.'
      p3:
        was: '399 avant notre ère : le jour où Socrate boit la ciguë, ses amis sont présents, sauf Platon, qui est malade.'
        now: 'Platon se rétablit, rejoint les amis à la prison et reste jusqu’à la fin.'
        who: 'plato_academy'
        bio: 'Dans cette branche, Platon guérit de la maladie qui l’avait retenu et accompagne Socrate en prison le dernier jour.'
    vignettes:
      rumours: 'La veille du procès, {staff} demande à trois marchands de l’agora ce qu’on reproche au vieil homme et reçoit trois réponses différentes. {staff} les note et attend d’entendre laquelle sera lue au tribunal.'
      harbour: 'Chaque soir, {staff} descend au Pirée demander au poissonnier si le navire de Délos est arrivé. La réponse est chaque fois la même, et {staff} ne sait plus s’il faut souhaiter ou craindre son retour.'
      gate: '{staff} porte de l’eau à la vendeuse d’huile et reçoit en échange une place au pied du mur de la prison. Les visiteurs attendent à la porte dès l’aube, et {staff} finit par reconnaître leurs visages.'
    story_prose:
      opening:
        - 'Athènes, 399 avant notre ère. Accusé d’impiété et de corrompre la jeunesse, Socrate doit comparaître devant un jury. Il a passé sa vie à questionner les gens dans les rues et sur l’agora. Il n’a laissé aucun livre et la postérité le connaît par Platon et Xénophon.'
        - 'Dans l’histoire, le navire pour Délos est parti la veille du procès. Aucune exécution ne peut avoir lieu avant son retour, et Socrate passe encore une trentaine de jours en prison. Obéissant à un rêve qui lui revient, il met en vers les fables d’Ésope, mais ces vers se perdent. Le dernier jour, tous ses amis sont là sauf Platon, qui est malade. Dans cette branche, une femme vend de l’huile à lampe près du mur de la prison et un poissonnier du Pirée voit entrer chaque navire.'
        - 'Il faudra quelqu’un qui sache calmer une foule, quelqu’un qui puisse noter des vers et en copier un rouleau, et quelqu’un qui connaisse les remèdes et sache soigner un malade.'
      outcomes:
        all: 'Le navire de Délos est revenu et le poissonnier a aperçu sa voile de loin. Le dernier soir, la prison est pleine d’amis et Platon est assis parmi eux. Plus tard, le rouleau des vers repose au fond d’un coffre dans une maison d’Athènes.'
        p3: 'Le dernier soir, la prison est pleine d’amis. Platon reste assis parmi eux jusqu’à la fin.'
        p2: 'Le rouleau a passé les années au fond d’un coffre, dans une maison d’Athènes. Le bord du papyrus s’effiloche.'
        p1: 'Trente jours plus tard, le navire de Délos entre au Pirée. Le poissonnier aperçoit sa voile de loin. Dès l’aube, des amis attendent devant la porte de la prison.'
      none: 'Le navire de Délos est revenu et le poissonnier a aperçu sa voile de loin. Le soir, les amis s’assoient en cercle dans la prison. Aucun ne prend la parole.'
      desync: 'Le vacarme enfle dans le tribunal et la défense s’interrompt au milieu d’une phrase. L’agence rappelle {staff} avant la sortie du tribunal.'
      not_admitted: '{staff} ne trouve aucune place à Athènes, pas même de quoi s’asseoir au pied du mur de la prison. Le navire de Délos est encore en mer.'
      points:
        p1: 'Le jour du procès, les jurés occupent des rangées de bancs de bois. Des cris couvrent la voix de Socrate toutes les quelques phrases. Chaque fois, {staff} se lève parmi les spectateurs, abaisse lentement les mains sans crier, balaie les rangées du regard et se rassoit quand le bruit retombe. Socrate reprend sa phrase là où elle a été coupée. Une fois son discours terminé, il rassemble les pans de son manteau et s’immobilise sur l’estrade.'
        p2: 'La lumière n’entre que par une petite fenêtre tout en haut du mur. Socrate dicte un vers et {staff} le note sur une tablette de cire, puis le relit en marquant le rythme et lisse la cire pour reprendre les vers qui ont un temps de trop. Les fables d’Ésope prennent forme l’une après l’autre, puis vient l’hymne à Apollon. La nuit, au pied du mur et à la lampe à huile, {staff} recopie les tablettes sur un rouleau de papyrus. Au matin, un ami glisse le rouleau sous son vêtement et quitte la prison, la main pressée contre sa poitrine.'
        p3:
          class_medical: 'La veille du dernier jour, Platon est encore malade, incapable de se lever. {staff} l’examine, prépare le remède, le lui donne aux heures prévues et veille toute la nuit à son chevet. Avant le plein jour, il se redresse et noue ses sandales dans le noir. Il jette son manteau sur ses épaules et sort avec les amis qui se pressent vers la prison, d’un pas plus rapide que le leur.'
