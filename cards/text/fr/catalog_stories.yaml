      post: 'Le 23 mai, {staff} se rend au bureau de poste de Klosterneuburg avec le garçon de courses du sanatorium. Le garçon dit qu''il peut dire d''où vient une lettre sans la lire : celles de Berlin sont grosses et raides de papier, celles de Prague sont maigres et arrivent tous les jours.'
