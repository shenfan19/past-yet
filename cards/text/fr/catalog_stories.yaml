      p2: 'La traite est prêtée. Les copistes ultérieurs ne savent pas que l''auteur avait l''intention de le réviser.'
    shift:
      p1:
        was: 'Le journal de Murasaki enregistre des femmes autour de Shōshi copiant Le Dit du Genji avec du matériel d''écriture fourni par Michinaga.'
      p2:
        was: 'Le Genji descend de différentes traditions manuscrites. Aucune copie finale de la main de Murasaki ne survit.'
        now: 'Les premiers emprunteurs lisent un ensemble qu''elle a vérifié. Les copies ultérieures varient encore, mais ce prêt enregistre les chapitres qu''elle a approuvés.'
        who: 'murasaki_kyoto'
        bio: 'Murasaki a écrit à la cour de Heian. La fourniture de papier, de copies et de prêt a eu une incidence sur la manière dont une œuvre encore en cours de révision parvenait à de nouveaux lecteurs.'
    vignettes:
      banquet: 'La veille du banquet du cinquantième jour, {staff} aide à transporter les plateaux le long de la galerie. Une des dames dit à voix basse que demain soir, une fois que les messieurs auront bu, ils commenceront à taquiner les femmes avec des noms tirés du conte, et qu''il ne faut pas entendre.'
      paper: '{staff} aide une dame à trier les feuilles de papier coloré par chapitre et à peser chaque pile. Chaque page terminée doit d''abord être vérifiée, dit-elle, et si la main s''incline, la page entière est refaite et le papier doit également être demandé à nouveau.'
      snow: 'La neige tombe au douzième mois. {staff} parcourt la galerie lorsque la lecture à l''intérieur s''arrête à mi-chemin et qu''une voix demande qui a pris le volume suivant.'
  sejong_hangul:
    name: 'Un alphabet que chacun peut apprendre'
    place: 'Séoul'
    figure: 'Le roi Sejong et les lettrés'
    story: 'En 1443, le roi Sejong de Joseon écrivit vingt-huit lettres pour écrire le coréen. Au cours du deuxième mois de 1444, Choe Manri, du Hall of Worthies, envoya un mémoire avec six collègues soulevant des objections. Les nouvelles lettres furent promulguées en 1446 sous le nom de Hunminjeongeum, les sons corrects pour enseigner au peuple. Sejong mourut en 1450.'
    relic: 'Une planche gravée de lettres'
    relic_desc: 'Un bloc sculpté des premières lettres, prêt à encrer.'
    points:
      p1: 'Pendant les jours du mémorial, conservez le projet de traduction du livre de rimes Yunhui dans les nouvelles lettres en sécurité dans la salle du conseil, afin que le travail continue.'
      p2: 'Laissez-le voir de ses propres yeux quelqu''un qui n''est jamais allé à l''école et écrire son propre nom dans les nouvelles lettres'
      p3: 'A Chojeong, atténuez le trouble dans ses yeux pour qu''il puisse toujours voir clairement les nouvelles lettres'
    points_fail:
      p1: 'À cette époque, les brouillons étaient dispersés et le travail s''arrêtait, et les nouvelles lettres perdaient leur première utilité.'
      p2: 'Dans cette branche, jusqu''à la promulgation, il n''a jamais vu personne parmi le peuple utiliser les nouvelles lettres.'
      p3: 'Il revint au palais avec des yeux pas meilleurs, comme dans l''histoire.'
    shift:
      p1:
        was: 'Au cours du deuxième mois de 1444, le travail du Hall des Dignes pour traduire le livre de rimes Yunhui dans les nouvelles lettres se poursuivit.'
      p2:
        was: 'En 1446, les nouvelles lettres furent proclamées Hunminjeongeum et Sejong mourut quatre ans plus tard.'
        now: 'Une marchande devant le palais itinérant de Chojeong a appris à écrire son propre nom et quelqu''un l''a signalé à la cour.'
      p3:
        was: 'Sejong a souffert pendant des années avec ses yeux, est allé à Chojeong au printemps 1444 pour se rétablir, s''est affaibli à partir de ce moment-là et est mort en 1450.'
        now: 'Un étranger près des sources de Chojeong lui fit un peu mieux voir, et lorsqu''il revint au palais cet été-là, il pouvait encore lire lui-même les mémoriaux et les épreuves des nouvelles lettres.'
    vignettes:
      gesture: '{staff} regarde un érudit façonner ses lèvres avant de dessiner une lettre et copie la forme de la bouche dans la marge à côté.'
      spacing: '{staff} divise une feuille en carrés de manière à ce que les parties de chaque syllabe soient réunies dans un seul carré et la laisse sur la table sans un mot.'
      lesson: '{staff} dessine trois lettres dans la poussière avec un bâton pour un enfant au marché, et l''enfant les relit sous forme de son avant de s''enfuir.'
    story_prose:
      opening:
        - 'Séoul, 1443. Sejong a rédigé vingt-huit nouvelles lettres. Le coréen peut être parlé à voix haute, mais pour écrire les mots dans la bouche, il faut d''abord apprendre une écriture très différente de la façon dont on parle. Sejong souhaite qu''une feuille de papier soit également un support sur lequel on peut écrire des discours de tous les jours.'
        - 'En histoire, au cours du deuxième mois de 1444, les savants de la Salle des Dignes envoyèrent un mémoire commun contre les nouvelles lettres, tandis que le travail de traduction des livres dans le palais était à moitié terminé. Ce printemps-là, Sejong se rendit à Chojeong pour reposer ses yeux, et à partir de ce moment-là, sa santé se détériora d''année en année. Dans cette succursale, il y a aussi une marchande à l''extérieur du palais ambulant de Chojeong qui tient ses comptes en ordre, mais chaque fois qu''elle doit signer, elle passe le pinceau à quelqu''un d''autre.'
        - "Trois types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui peut garder les papiers en sécurité, quelqu'un qui est prêt à apprendre à une personne à lire coup par coup, et quelqu'un qui connaît la médecine et apporte le bon remède."
      outcomes:
        all: 'Cet été-là, lorsque Sejong retourna au palais, il pouvait encore voir clairement les lettres. Il ne laissa personne emporter la feuille que le marchand avait signée ; il se trouvait au-dessus des épreuves des nouvelles lettres.'
        p2: 'À l''extérieur du palais itinérant de Chojeong, à la fin de ce livre de comptes, la main était pour la première fois celle du marchand.'
        p3: 'De retour au palais cet été-là, Sejong pouvait encore lire lui-même les mémoriaux. Il tournait les épreuves des nouvelles lettres page par page, jusqu''à la dernière.'
        p1: 'Les lampes de la salle des dignes furent rallumées. Le Yunhui dans les nouvelles lettres s''empilait page après page.'
      none: 'De retour au bureau, {staff} se souvient encore du moment où le marchand a tendu le pinceau : la main s''est tendue, s''est arrêtée un instant en l''air, et seulement ensuite a donné le pinceau à quelqu''un d''autre.'
      desync: 'Après le mémorial, les pages des nouvelles lettres gisaient éparpillées sur le sol de la salle du conseil et personne ne les reprenait. Lors du rappel du {staff}, la première page contenait une demi-empreinte.'
      not_admitted: '{staff} n''a pas pu rester assez longtemps pour enseigner les nouvelles lettres au marchand. Elle tourna une autre page de ses comptes, et le journal attendait toujours que quelqu''un d''autre signe pour elle.'
      points:
        p1: 'À l''époque du mémorial, les gens allaient et venaient dans la salle du conseil et personne ne pensait aux pages sur la table. {staff} a empilé les pages du Yunhui dans les nouvelles lettres dans leur ordre et a placé un presse-papier dessus. Quelques jours plus tard, les érudits de la salle revinrent et soulevèrent le presse-papier. La première page était l’endroit même où ils avaient posé leurs pinceaux.'
        p2:
          class_teaching: '{staff} a suivi l''ancienne méthode d''enseignement : lui faire d''abord prononcer son nom à voix haute, puis écrire chaque son sous forme de lettre. À l''extérieur du palais itinérant de Chojeong, la marchande prononça lentement son propre nom une fois et écrivit sur le papier après les sons. Lorsque le dernier trait fut terminé, elle retourna la feuille dans le bon sens, la pressa avec un doigt et toucha chaque lettre tour à tour. Plus tard, ce drap fut envoyé dans le palais itinérant, et Sejong le tint devant ses yeux, le regarda longuement et ne laissa personne l''emporter.'
          else: '{staff} restait assis avec elle un moment chaque jour avant qu''elle ne ferme son stand, sans jamais la presser, et chaque fois qu''un trait tournait de travers, elle lui faisait le réécrire. À l''extérieur du palais itinérant de Chojeong, la marchande prononça lentement son propre nom une fois et écrivit sur le papier après les sons. Lorsque le dernier trait fut terminé, elle retourna la feuille dans le bon sens, la pressa avec un doigt et toucha chaque lettre tour à tour. Plus tard, ce drap fut envoyé dans le palais itinérant, et Sejong le tint devant ses yeux, le regarda longuement et ne laissa personne l''emporter.'
        p3: 'À Chojeong, {staff} observait les yeux de Sejong chaque jour, ajustant les médicaments et les lavages au fur et à mesure qu''ils changeaient. De retour au palais, Sejong tenait devant ses yeux une épreuve des nouvelles lettres. Les lettres étaient petites et il lisait lentement ; quand est venu le temps de tourner la page, il n’a appelé personne, il a tendu la main et l’a tourné lui-même.'
      excerpts:
        p2: 'Lorsque le dernier trait fut terminé, elle retourna la feuille dans le bon sens, la pressa avec un doigt et toucha chaque lettre tour à tour. Plus tard, ce drap fut envoyé dans le palais itinérant, et Sejong le tint devant ses yeux, le regarda longuement et ne laissa personne l''emporter.'
        p3: 'De retour au palais, Sejong tenait devant ses yeux une épreuve des nouvelles lettres. Les lettres étaient petites et il lisait lentement ; quand est venu le temps de tourner la page, il n’a appelé personne, il a tendu la main et l’a tourné lui-même.'
        p1: 'Quelques jours plus tard, les érudits de la salle revinrent et soulevèrent le presse-papier. La première page était l’endroit même où ils avaient posé leurs pinceaux.'
  basho_hiraizumi:
    name: 'La Sente étroite du Bout-du-Monde'
    place: 'Hiraizumi, Japon'
    figure: 'Matsuo Bashō'
    story: 'Au printemps 1689, Matsuo Bashō partit d''Edo avec son élève Sora pour une longue marche à travers le nord. Le treizième jour du cinquième mois, ils allèrent d''Ichinoseki à Hiraizumi et retour en une journée : ils gravirent Takadachi au-dessus de la rivière Kitakami, l''intendant leur montra la salle dorée de Chūsonji, et la salle des Sutras resta fermée parce qu''il était absent. Bashō a transformé le voyage en The Narrow Road to the Deep North, où la visite donne son vers sur les herbes d''été et dit que les deux salles ont été ouvertes.'
    story_prose:
      opening:
        - 'Ichinoseki, au nord du Japon, été 1689. Matsuo Bashō et son élève Sora ont quitté Edo il y a plus d''un mois. Le treizième jour du cinquième mois, le ciel est clair et les deux comptent parcourir les deux ri jusqu''à Hiraizumi pour voir les vieilles ruines et revenir le même jour. Le voyage est devenu plus tard The Narrow Road to the Deep North.'
        - 'Dans l''histoire, le gardien leur montrait la Salle Dorée ce jour-là, et la Salle des Sutras restait fermée parce qu''il était absent. Sora l''a noté dans son journal tel quel ; Bashō écrivit plus tard dans son livre que les deux salles avaient été ouvertes. Dans cette succursale, le maître de leur logement à Ichinoseki fait chauffer le bain pour le retour de ses invités, et un portier au coin de la rue dit que les routes vers le nord sont toutes boueuses.'
        - 'Deux types de personnes peuvent aider lors de ce voyage : quelqu''un qui se souvient de la route et respecte les horaires, et quelqu''un prêt à demander ce qui est autorisé et à trouver quelqu''un pour montrer le chemin.'
      outcomes:
        all: 'Ce soir-là, Bashō accrocha son chapeau près de la porte de l''hébergement à Ichinoseki, une couche de poussière dessus. Plus tard, lorsqu''il écrivit le passage d''Hiraizumi, il y avait une poutre qu''il avait vue de ses propres yeux à travers les interstices d''un treillis.'
        p2: 'Plus tard, lorsque Bashō écrivit le passage Hiraizumi, il y avait une poutre qu''il avait vue de ses propres yeux à travers les interstices d''un treillis.'
        p1: 'Avant la tombée de la nuit, les deux étaient de retour à Ichinoseki. Le chapeau pendait près de la porte avec une couche de poussière dessus.'
      none: 'Les vieilles ruines d''Hiraizumi s''assombrirent peu à peu au crépuscule. La porte de la salle des Sutras est restée fermée.'
      desync: 'Passé la fourche, le soleil était déjà bas et les deux étaient encore loin d''Hiraizumi. {staff} a été rappelé par le bureau avant de pouvoir retourner à Ichinoseki.'
      not_admitted: '{staff} n''a pas pu suivre les deux voyageurs. Au coin de la rue d''Ichinoseki, deux chapeaux de paille avaient déjà quitté la ville.'
      points:
        p1: 'En sortant d''Ichinoseki, la route bifurquait deux fois. {staff} a vérifié chaque arrêt par rapport aux étapes que Sora avait écrites dans son cahier, et a indiqué aux deux hommes à l''avance où tourner et à quelle heure ils devaient repartir. Bashō hocha la tête et resserra le cordon de son chapeau. Quand le soleil était bas, les deux étaient déjà sur le chemin du retour vers Ichinoseki.'
        p2:
          class_lettered: 'Comme on le fait lors de la recherche de documents, {staff} a d''abord demandé quel jour le gardien était parti et qui s''occupait de ses affaires, puis quelle partie de la galerie extérieure les visiteurs pouvaient parcourir. Un vieil homme à proximité a déposé son travail et a conduit les deux le long de la galerie jusqu''au côté de la salle des Sutras. La porte était toujours fermée, mais à travers les interstices du treillis, on apercevait les poutres intérieures. Bashō resta longtemps sans un mot, et Sora baissa la tête et ajouta une ligne à son carnet.'
          else: '{staff} a attendu un moment devant le hall, puis a demandé un à un aux voisins quand le gardien reviendrait et quelle partie de la galerie extérieure les visiteurs pourraient parcourir. Un vieil homme à proximité a déposé son travail et a conduit les deux le long de la galerie jusqu''au côté de la salle des Sutras. La porte était toujours fermée, mais à travers les interstices du treillis, on apercevait les poutres intérieures. Bashō resta longtemps sans un mot, et Sora baissa la tête et ajouta une ligne à son carnet.'
      excerpts:
        p2: 'La porte était toujours fermée, mais à travers les interstices du treillis, on apercevait les poutres intérieures. Bashō resta longtemps sans un mot, et Sora baissa la tête et ajouta une ligne à son carnet.'
        p1: 'Bashō hocha la tête et resserra le cordon de son chapeau. Quand le soleil était bas, les deux étaient déjà sur le chemin du retour vers Ichinoseki.'
    relic: 'Un chapeau de paille'
    relic_desc: 'Un chapeau tissé gris de pluie.'
    points:
      p1: 'Vérifiez l''itinéraire de retour de Sora et les points de virage afin que les deux voyageurs puissent visiter Hiraizumi le même jour.'
      p2: 'Lorsque le gardien est absent, découvrez qui peut faire visiter l''extérieur aux visiteurs. Demandez ce qu''ils sont autorisés à voir avant de transmettre l''itinéraire aux deux voyageurs'
    points_fail:
      p1: 'Un virage envoie les deux voyageurs dans la mauvaise direction. Au moment où ils trouvent l''approche, ils ne peuvent pas effectuer le retour et le bureau rappelle l''employé.'
      p2: 'Personne ne sait quand le gardien reviendra. Les deux passent dehors et l’entrée reste fermée.'
    shift:
      p1:
        was: 'Le journal de Sora relate un voyage d''Ichinoseki à Hiraizumi et retour ce jour-là, le treizième jour du cinquième mois lunaire de 1689.'
      p2:
        was: 'Le treizième jour du cinquième mois de 1689, Sora rapporta que l''intendant leur montra la Salle Dorée mais que la Salle des Sutras resta fermée parce qu''il était absent ; Bashō écrivit plus tard que les deux salles étaient ouvertes.'
        now: 'Un guide local confirme qu''ils peuvent faire le tour de la salle des Sutras et leur montre le côté autorisé. Bashō revient avec un détail du bâtiment qu''il a vu de lui-même.'
        who: 'basho_hiraizumi'
        bio: 'Bashō et Sora n''avaient qu''une partie de la journée pour Hiraizumi. Le dernier livre et les notes de route de Sora mettent des choses différentes sur la page.'
    vignettes:
      grass: '{staff} suit les deux voyageurs jusqu''à Takadachi. Le Kitakami coule en contrebas et l''herbe arrive jusqu''à la taille. L''aîné étend son chapeau par terre et reste assis un long moment sans dire un mot, le plus jeune écrit quelque chose dans son cahier et {staff}, n''aimant pas parler, regarde la rivière avec eux.'
      bath: '{staff} aide le maître du logement d''Ichinoseki à transporter l''eau et à chauffer le bain. Les deux invités sont allés à Hiraizumi aujourd''hui, dit-il, ils reviendront en sueur ; il a vu bien des voyageurs revenir des vieilles ruines en larmes, et un bain y veille.'
      sandal: '{staff} aide un homme au coin de la rue à Ichinoseki à réparer la bride d''une sandale. Un porteur de passage dit que les routes vers le nord sont toutes boueuses cette semaine et que quiconque passe par là ferait mieux d''enfiler de nouvelles sandales avant de commencer.'
  tagore_santiniketan:
    name: 'Un poème, deux lectures'
    place: 'Santiniketan, Inde'
    figure: 'Rabindranath Tagore'
    story: 'En novembre 1912, l''anglais Gitanjali, une interprétation en prose de Rabindranath Tagore de ses chansons bengali, sortit à Londres. Le 13 novembre 1913, l''Académie suédoise lui décerne le prix Nobel de littérature. Dix jours plus tard, un train rempli de sympathisants est venu de Calcutta à son école de Santiniketan ; dans sa réponse, il déclara qu''il ne pouvait accepter sans hésitation un honneur offert au nom du pays, et de nombreux invités repartirent chez eux blessés. L''argent du prix est allé à l''école, qui est devenue l''université de Visva-Bharati en 1921.'
    story_prose:
      opening:
        - 'Santiniketan au Bengale, novembre 1913. Le poète Rabindranath Tagore y dirige une école. Il y a un an, le Gitanjali anglais, ses propres interprétations en prose de ses chansons bengali, est sorti à Londres ; le 13 novembre, l''Académie suédoise lui a décerné le prix Nobel de littérature, le premier décerné à un écrivain extra-européen.'
        - 'Dans l''histoire, dix jours plus tard, un train a amené des sympathisants de Calcutta ; dans sa réponse, il dit qu''il ne pouvait accepter sans hésitation un honneur offert au nom du pays, beaucoup d''invités rentrèrent chez eux blessés et désormais une distance se dressa entre lui et beaucoup de ses compatriotes. Dans cette branche, l''école a un garçon qui grimpe aux manguiers et un cuisinier qui garde le riz, et l''un des invités laisse son parapluie à la gare.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage : quelqu'un qui a enseigné, travaillé dans l'actualité ou guidé des visiteurs et qui sait dialoguer avec les gens ; quelqu'un de doux et stable avec suffisamment de volonté\_; ou quelqu'un qui porte la pomme d'or. Une fois la réception terminée, les invités se dirigent déjà à pied vers la gare."
      outcomes:
        all: 'Les invités de cette soirée sont rentrés à Calcutta par un train de nuit. Dans les années qui suivirent, les gens de la ville vinrent à Santiniketan les uns après les autres et, en 1921, l''école devint l''université de Visva-Bharati.'
        p1: 'Les invités de cette soirée sont rentrés à Calcutta par un train de nuit. Dans les années qui suivirent, les gens de la ville vinrent à Santiniketan les uns après les autres et, en 1921, l''école devint l''université de Visva-Bharati.'
      none: 'Le 23 novembre au crépuscule, les invités attendaient leur train à la gare de Bolpur et personne sur le quai ne parlait. Après le départ du train, les bancs étaient toujours debout sous les manguiers, aucun d''eux n''était rangé.'
      not_admitted: '{staff} n''est jamais entré dans l''école et a seulement observé depuis le quai de Bolpur l''entrée et la sortie du train. En chemin, quelqu''un dans les voitures chantait ; sur le chemin du retour, toutes les fenêtres étaient fermées.'
      points:
        p1:
          class_teaching: 'Le 23 novembre, la réception est interrompue et les invités se dirigent par deux ou trois vers la gare de Bolpur ; les derniers n''ont pas dit un mot jusqu''au bout. {staff}, qui a enseigné, sait qu''après une parole dure, on attend que les gens aient fait quelques pas pour les poursuivre, les rattraper, rester un moment avec eux au bord de la route et les ramener dans la cour. La nuit tombée, les lampes sont allumées à l''intérieur, Tagore et quelques invités s''assoient autour d''une table basse et le thé est servi deux fois. Un invité prend le recueil de chansons copié à la main, puis le ferme. Il raconte à Tagore ce qu''il pensait avoir entendu dans la cour. Tagore demande quels mots lui ont donné cette impression et attend la réponse.'
          class_press: 'Le 23 novembre, la réception est interrompue et les invités se dirigent par deux ou trois vers la gare de Bolpur ; les derniers n''ont pas dit un mot jusqu''au bout. {staff}, qui a travaillé dans l''actualité, sait comment une phrase change dans la seconde bouche qu''elle traverse, les rattrape, leur demande de ne pas rapporter à la ville les mots d''aujourd''hui avant de l''avoir demandé au poète lui-même, et les ramène dans la cour. La nuit tombée, les lampes sont allumées à l''intérieur, Tagore et quelques invités s''assoient autour d''une table basse et le thé est servi deux fois. Un invité prend le recueil de chansons copié à la main, puis le ferme. Il raconte à Tagore ce qu''il pensait avoir entendu dans la cour. Tagore demande quels mots lui ont donné cette impression et attend la réponse.'
          else: 'Le 23 novembre, la réception est interrompue et les invités se dirigent par deux ou trois vers la gare de Bolpur ; les derniers n''ont pas dit un mot jusqu''au bout. {staff}, tranquille et doux, les rattrape, reste un moment avec eux au bord de la route sans trop dire, leur demande seulement s''ils aimeraient une autre tasse de thé avant de partir et les ramène dans la cour. La nuit tombée, les lampes sont allumées à l''intérieur, Tagore et quelques invités s''assoient autour d''une table basse et le thé est servi deux fois. Un invité prend le recueil de chansons copié à la main, puis le ferme. Il raconte à Tagore ce qu''il pensait avoir entendu dans la cour. Tagore demande quels mots lui ont donné cette impression et attend la réponse.'
      excerpts:
        p1: 'La nuit tombée, les lampes sont allumées à l''intérieur, Tagore et quelques invités s''assoient autour d''une table basse et le thé est servi deux fois. Un invité prend le recueil de chansons copié à la main, puis le ferme. Il raconte à Tagore ce qu''il pensait avoir entendu dans la cour. Tagore demande quels mots lui ont donné cette impression et attend la réponse.'
    relic: 'Un recueil de chansons copié à la main'
    relic_desc: 'Un petit livre de chansons de sa propre main.'
    points:
      p1: 'Après la fin de la réception, ramenez les invités que sa réponse a piqué et demandez-lui et ces gens, dont beaucoup sont ses amis, d''en parler.'
    points_fail:
      p1: 'Comme dans l''histoire, les invités rentrent chez eux lésés, et la distance entre lui et nombre de ses compatriotes reste ; cette branche est comme l’était l’histoire.'
    shift:
      p1:
        was: '23 novembre 1913 : un train rempli de sympathisants arrive de Calcutta ; Dans sa réponse, Tagore a déclaré qu''il ne pouvait accepter sans méfiance l''honneur offert au nom du pays, que les invités étaient largement blessés et qu''une profonde aliénation s''est développée entre lui et nombre de ses compatriotes.'
        now: 'Ce soir-là, certains des invités revinrent. On a demandé quelle partie de l''honneur Tagore avait voulu refuser. Tagore attendit que l''invité ait fini et lui demanda de répéter les mots qu''il avait entendus. Ils sont restés pour s''entendre.'
        who: 'tagore_santiniketan'
        bio: 'Dans cette chronologie, Tagore et les invités de la réception de 1913 ont discuté le soir même, et sa réponse ne l''a pas distingué de ses compatriotes.'
    vignettes:
      telegram: 'Le jour où la nouvelle arrive, {staff} aide les garçons à porter des bancs sous les manguiers. L''un d''eux grimpe à un arbre et crie que tout Calcutta arrive en train ; un professeur le tire vers le bas et il proteste en disant qu''alors quelqu''un ferait mieux de compter les bancs.'
      platform: 'Au crépuscule, {staff} aide un invité de la gare de Bolpur à retrouver le parapluie qu''il a laissé derrière lui. Il reste longtemps sur le quai, tournant le parapluie dans ses mains, et seulement quand le train arrive, il demande si le poète parle toujours ainsi à ses invités.'
      rice: 'En décembre, {staff} aide le cuisinier de l''école à étendre le riz à sécher dans la cour. Les gens continuent de venir voir le poète, dit le cuisinier, une fête après l''autre, et le riz coule plus vite qu''au cours de n''importe quelle année dont il se souvient.'
  ramanujan_madras:
    name: 'Une lettre pour faire vérifier des calculs'
    place: 'Madras'
    figure: 'Srinivasa Ramanujan'
    story: 'À partir de mars 1912, Srinivasa Ramanujan travailla comme commis au service des comptes du Madras Port Trust. Le jeudi 16 janvier 1913, il écrivit de là à G. H. Hardy à Cambridge, présentant son travail et son étude des séries divergentes. En 1914, il part en Angleterre. Il mourut en 1920, après être retourné malade en Inde.'
    story_prose:
      opening:
        - 'Madras, janvier 1913. Srinivasa Ramanujan, vingt-cinq ans, est commis au service des comptes du Port Trust, vérifiant les grands livres le jour et travaillant aux mathématiques la nuit. Le jeudi 16 janvier, il écrit d''ici à G. H. Hardy à Cambridge au sujet des résultats qu''il a obtenus en dehors de tout cursus universitaire.'
        - 'En histoire, Hardy a répondu le 8 février en lui demandant d''écrire ses preuves ; le 27 février, il termina et envoya une deuxième lettre, disant qu''il était déjà à moitié affamé ; la bourse n''est arrivée qu''en mai, et jusque-là la famille vivait de son salaire de trente roupies par mois ; en 1914, il partit pour l''Angleterre, tomba gravement malade en 1917 sans diagnostic définitif et mourut en 1920 après son retour en Inde, à l''âge de 32 ans seulement. Dans cette succursale, un employé du Port Trust attache les paquets pour le poste d''outre-mer et un collègue de la salle des comptes partage sa lampe.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui sait cuisiner ou s'occuper des gens, quelqu'un de fort volontaire doté d'un synthétiseur de nutriments, ou quelqu'un de gentil, patient et robuste\_; quelqu'un qui sait tenir une comptabilité ou qui a fait du commerce, quelqu'un d'ordonnateur qui connaît son chemin, ou quelqu'un qui appelle avec un coffret cadeau ; un médecin ou un médecin avec un kit nano médical."
      outcomes:
        all: 'En 1914, il s''embarqua pour l''Angleterre, avec l''ardoise dans ses bagages. Plus tard, à Cambridge, il n''entra pas dans un sanatorium ; après son retour en Inde, il étudia les mathématiques pendant de nombreuses années encore.'
        p3: 'En 1914, il part en Angleterre. Quelques années plus tard, à Cambridge, il n''entra pas dans un sanatorium ; après son retour en Inde, il étudia les mathématiques pendant de nombreuses années encore.'
        p2: 'En mai de cette année-là, la bourse arriva, soixante-quinze roupies par mois. Durant ces mois, le pot de riz ne se vide jamais.'
        p1: 'La lettre parvint à Cambridge avec le cachet de la poste de Madras sur son sceau. En 1914, il s''embarqua pour l''Angleterre.'
      none: 'Dans la nuit du 27 février, il s''est effondré sous la lampe, les pages à moitié écrites éparpillées sur la table. À Cambridge, Hardy n’entendit plus rien.'
      desync: 'Dans la nuit du 27 février, il s''est effondré sous la lampe. Lorsque {staff} a été rappelé, la lettre à moitié écrite gisait sous son bras et l''encre coulait en une petite tache.'
      not_admitted: '{staff} n''est jamais entré dans le Port Trust et a seulement regardé de l''extérieur les employés entrer et sortir avec leurs grands livres. L''employé qui attachait les paquets lut l''adresse sur l''un d''entre eux et s''arrêta à Cambridge.'
      points:
        p1:
          class_food: 'Fin février : la réponse que Hardy avait écrite le 8 février parvint à Madras, lui demandant de rédiger ses épreuves. Chaque nuit, il se penchait sur la lampe, remplissait un drap et en prenait un autre, jamais nourri à moitié. {staff}, qui savait cuisiner, apportait chaque soir un bol de riz chaud et un bol de dal à la lampe et le regardait finir avant de le laisser se remettre à écrire. Dans la nuit du 27 février, la lettre était rédigée ; il quadrilla les feuilles une à une, les plia et les mit dans l''enveloppe. Le collègue qui partageait sa lampe dormait déjà et la mèche brûlait encore.'
          class_medical: 'Fin février : la réponse que Hardy avait écrite le 8 février parvint à Madras, lui demandant de rédiger ses épreuves. Chaque nuit, il se penchait sur la lampe, remplissait un drap et en prenait un autre, jamais nourri à moitié. {staff}, formé aux soins, apportait ses repas à table à l''heure, le faisait se lever de temps en temps pour faire quelques pas et boire de l''eau, et tard dans la nuit, éteignait la lampe et le faisait s''allonger un moment. Dans la nuit du 27 février, la lettre était rédigée ; il quadrilla les feuilles une à une, les plia et les mit dans l''enveloppe. Le collègue qui partageait sa lampe dormait déjà et la mèche brûlait encore.'
          else: 'Fin février : la réponse que Hardy avait écrite le 8 février parvint à Madras, lui demandant de rédiger ses épreuves. Chaque nuit, il se penchait sur la lampe, remplissait un drap et en prenait un autre, jamais nourri à moitié. {staff} apportait sa nourriture à table chaque jour et restait assis avec lui jusque tard dans la nuit, poussant le gobelet d''eau dans sa main chaque fois que son stylo s''arrêtait. Dans la nuit du 27 février, la lettre était rédigée ; il quadrilla les feuilles une à une, les plia et les mit dans l''enveloppe. Le collègue qui partageait sa lampe dormait déjà et la mèche brûlait encore.'
        p2:
          class_lettered: 'Avril, et le pot de riz à la maison était à nouveau presque vide. Trente roupies par mois devaient nourrir toute la famille, et on ne parlait toujours pas de la bourse. {staff}, habitué au travail de bureau, notait les revenus et les dépenses du mois, article par article, combien il fallait garder pour le riz, l''huile, le loyer, et calculait combien d''annas il resterait à la fin du mois. Ce soir-là, le pot de riz était de nouveau plein à ras bord. Ramanujan était assis sur le marchepied près de la porte, l''ardoise sur les genoux, écrivant trait après trait.'
          class_trade: 'Avril, et le pot de riz à la maison était à nouveau presque vide. Trente roupies par mois devaient nourrir toute la famille, et on ne parlait toujours pas de bourse. {staff}, qui avait fait du commerce, est allé au marché pour trouver un marchand de riz qu''il connaissait, en a acheté davantage d''un coup et a fait baisser le prix. Ce soir-là, le pot de riz était de nouveau plein à ras bord. Ramanujan était assis sur le marchepied près de la porte, l''ardoise sur les genoux, écrivant trait après trait.'
          else: 'Avril, et le pot de riz à la maison était à nouveau presque vide. Trente roupies par mois devaient nourrir toute la famille, et on ne parlait toujours pas de bourse. {staff} a trié les dépenses du ménage article par article, mesuré le riz et l''huile chaque jour et a apporté une boîte de cadeaux à une famille qu''ils connaissaient, revenant avec un demi-mois de nourriture. Ce soir-là, le pot de riz était de nouveau plein à ras bord. Ramanujan était assis sur le marchepied près de la porte, l''ardoise sur les genoux, écrivant trait après trait.'
        p3:
          class_learned: 'Fin mai, la bourse était arrivée. Son ancienne maladie était revenue ; il était tour à tour faible et très maigre, à cause d''un mal qui s''était installé depuis des années et n''avait jamais été guéri. {staff}, qui connaissait la médecine, a posé des questions sur chaque poussée au fil des ans, a vu qu''il s''agissait d''une vieille maladie qui n''avait jamais disparu, a ouvert le kit nano médical apporté et l''a guéri. Un mois plus tard, il prenait une deuxième portion aux repas et dormait profondément la nuit. Aux premières lueurs du jour, il ramassait l''ardoise et la craie se déplaçait rapidement et se rapprochait.'
          else: 'Fin mai, la bourse était arrivée. Son ancienne maladie était revenue ; il était tour à tour faible et très maigre, à cause d''un mal qui s''était installé depuis des années et n''avait jamais été guéri. {staff}, formé en médecine, lui a donné le traitement étape par étape comme l''indiquaient les instructions du kit nano médical, et a noté sa température et la quantité qu''il mangeait chaque jour, en comparant un jour au suivant. Un mois plus tard, il prenait une deuxième portion aux repas et dormait profondément la nuit. Aux premières lueurs du jour, il ramassait l''ardoise et la craie se déplaçait rapidement et se rapprochait.'
