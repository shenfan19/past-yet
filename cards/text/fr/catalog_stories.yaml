  vermeer_delft:
    name: 'Le peintre endetté'
    place: 'Delft'
    figure: 'Johannes Vermeer'
    story: 'Après la guerre de 1672, Johannes Vermeer avait du mal à vendre un tableau et, en juillet 1675, il se rendit à Amsterdam pour emprunter mille florins. En décembre 1675, écrivit plus tard sa veuve, il passa en un jour et demi de la bonne santé à la mort ; il fut enterré à Delft le 15 décembre, âgé de quarante-trois ans, laissant onze enfants. Au début de 1676, Catharina Bolnes fit don de deux de ses tableaux au boulanger contre une dette de pain et, le 24 février, elle transmit l''art de la peinture à sa mère Maria Thins. Le 29 février, la maison fut inventoriée et, en avril, elle demanda à la Haute Cour de la libérer de ses dettes.'
    story_prose:
      opening:
        - 'L''Oude Langendijk à Delft, début décembre 1675. Le peintre Johannes Vermeer, quarante-trois ans, vit ici avec son épouse Catharina Bolnes et ses onze enfants. Il peint des pièces calmes dans une lumière douce, et seules une quarantaine de ses tableaux survivent. Depuis la guerre de 1672, le commerce de l''art s''est effondré : ses propres œuvres se vendent à peine et les tableaux d''autres maîtres qu''il a achetés pour les vendre restent entre ses mains. En juillet, il se rend à Amsterdam pour emprunter mille florins.'
        - 'Dans l''histoire, écrivit plus tard Catharina, sous le poids des enfants et des dettes, il passa en un jour et demi de sain à mort, et il fut enterré le 15 décembre. Au début de l''année suivante, elle donna deux de ses tableaux au boulanger contre trois ans de pain, le 24 février transféra l''Art de la peinture de son atelier à sa mère Maria Thins et, en avril, demanda à la Haute Cour de la libérer de ses dettes. Pendant près de deux siècles plus tard, son nom fut pratiquement oublié. Dans ce magasin, un garçon boulanger apporte du pain gratuitement et ne fait qu''une marque sur son petit livre, il y a un encadreur et une femme vend de la tourbe sur la place du marché.'
        - 'Plusieurs types de personnes peuvent aider dans ce voyage : quelqu''un qui a conservé des archives, négociant des antiquités ou restauré des tableaux, quelqu''un qui peint, lit des épreuves ou traduit et a un œil attentif, ou quelqu''un de vigilant ou méthodique avec une forte volonté, pour protéger le grand tableau de l''atelier ; quelqu''un qui a fait du commerce et qui a un peu de chance, ou quelqu''un qui est désinvolte et à l''aise dans la rue, pour vendre les tableaux qui lui restent entre les mains ; quelqu''un qui sait peindre, ou qui est sensible ou gentil, pour lui dire ce que deviendront ses tableaux ; un médecin avec une forte volonté, quelqu''un qui connaît la médecine et qui porte le patch calme, ou quelqu''un qui porte le kit nano médical, pour attendre ce jour et demi à la mi-décembre.'
      outcomes:
        all: 'Cet hiver-là, Vermeer ne fit pas faillite. Par une journée claire de janvier, il monta les escaliers pour peindre à nouveau ; le grand tableau était toujours accroché au mur de l''atelier, et un petit paquet d''argent enveloppé dans du tissu gisait dans le placard de la cuisine.'
        p4: 'Ce mois de décembre est passé et Vermeer n’a pas sombré. Par une journée claire du mois de janvier, il remonta les escaliers et déplaça le chevalet vers la fenêtre.'
        p2: 'Le 15 décembre, Vermeer fut enterré à Delft, à l''âge de quarante-trois ans. Catharina gardait l''argent des peintures vendues ce mois-là enveloppé dans un tissu dans le placard de la cuisine.'
        p3: 'Le 15 décembre, Vermeer fut enterré à Delft, à l''âge de quarante-trois ans. Le chevalet de l''atelier était vide et la palette était posée sur le côté, le bleu frais séché dessus.'
        p1: 'Le 15 décembre, Vermeer fut enterré à Delft, âgé de quarante-trois ans, laissant onze enfants. En février suivant, Catharina passa le grand tableau de l''atelier à sa mère.'
      none: 'Le 15 décembre, Vermeer fut enterré à Delft dans une tombe que sa belle-mère avait achetée des années auparavant, à l''âge de quarante-trois ans. Pendant près de deux siècles, peu de gens connurent son nom.'
      desync: 'Le 3 décembre, l''homme du créancier vérifia sa liste, acquiesça et fit retirer de son clou le grand tableau accroché au mur. Lorsque le {staff} a été rappelé, deux hommes le transportaient en bas, et le bleu de celui-ci a clignoté une fois au détour des escaliers.'
      not_admitted: '{staff} n''est jamais entré dans la maison du Oude Langendijk et n''est resté que quelques matins au bord de la place du marché. Les volets de cette maison étaient toujours à moitié fermés, et un enfant s''appuyait sur le rebord et comptait les corbeilles à pain qui passaient.'
      points:
        p1:
          trait_vigil: 'Le matin du 3 décembre, un homme envoyé par un créancier entre dans l''atelier avec une liste, dit que certains tableaux doivent être remboursés avant la fin de l''année et montre du doigt le grand tableau accroché au mur : un peintre, nous tournant le dos, peignant une femme en bleu qui tient un livre et une trompette. {staff}, vigilant, dort deux nuits en courant dans les escaliers à l''extérieur de l''atelier, et le jour parcourt la liste de l''homme ligne par ligne : ce qui peut aller contre la dette, c''est le stock de tableaux d''autres maîtres de la boutique, et celui-ci n''y figure pas. L''homme roule sa liste et s''en va. Vermeer reste un moment devant le tableau, puis tend la main et essuie une pellicule de poussière au bas du cadre.'
          trait_methodical: 'Le matin du 3 décembre, un homme envoyé par un créancier entre dans l''atelier avec une liste, dit que certains tableaux doivent être remboursés avant la fin de l''année et montre du doigt le grand tableau accroché au mur : un peintre, nous tournant le dos, peignant une femme en bleu qui tient un livre et une trompette. {staff}, méthodique, parcourt ligne par ligne la liste de l''homme et écrit une page sur la provenance de chaque tableau de l''atelier : ce qui peut aller contre la dette, c''est le stock de tableaux d''autres maîtres de la boutique, et celui-ci n''y figure pas. L''homme roule sa liste et s''en va. Vermeer reste un moment devant le tableau, puis tend la main et essuie une pellicule de poussière au bas du cadre.'
          else: 'Le matin du 3 décembre, un homme envoyé par un créancier entre dans l''atelier avec une liste, dit que certains tableaux doivent être remboursés avant la fin de l''année et montre du doigt le grand tableau accroché au mur : un peintre, nous tournant le dos, peignant une femme en bleu qui tient un livre et une trompette. {staff}, habitué aux tableaux et aux actes, parcourt ligne par ligne la liste de l''homme et montre que ce qui peut aller contre la dette, c''est le stock de tableaux d''autres maîtres de la boutique, et celui-ci n''y figure pas. L''homme roule sa liste et s''en va. Vermeer reste un moment devant le tableau, puis tend la main et essuie une pellicule de poussière au bas du cadre.'
        p2:
          class_trade: 'Le 6 décembre est jour de marché. Certaines peintures d''autres maîtres, enveloppées dans du tissu, se trouvent depuis des années derrière la porte de la boutique. {staff}, qui a négocié, les porte un à un à la lumière de la vitrine et s''entretient avec deux dealers venus voir du matin jusqu''à midi, donnant un peu sur le prix et puis pas un pouce de plus. Dans l''après-midi, trois tableaux, attachés avec de la ficelle, sont emportés hors de la porte sur les épaules des hommes. Catharina compte deux fois l''argent sur la table de la cuisine, en met un petit tas de côté, l''enveloppe dans un linge et le met dans la poche de son tablier.'
          else: 'Le 6 décembre est jour de marché. Certaines peintures d''autres maîtres, enveloppées dans du tissu, se trouvent depuis des années derrière la porte de la boutique. {staff}, désinvolte, fait le tour du marché et revient avec deux marchands, porte les tableaux un à un à la lumière de la vitrine et discute avec eux du matin jusqu''à midi. Dans l''après-midi, trois tableaux, attachés avec de la ficelle, sont emportés hors de la porte sur les épaules des hommes. Catharina compte deux fois l''argent sur la table de la cuisine, en met un petit tas de côté, l''enveloppe dans un linge et le met dans la poche de son tablier.'
        p3:
          trait_artistic: 'L''après-midi du 9 décembre, le studio est très calme. Vermeer est assis au chevalet et pendant longtemps le pinceau dans sa main ne touche pas la toile. {staff}, qui a aussi le sens de la peinture, se tient derrière lui un moment et lui dit qu''un jour les gens chercheront ces pièces calmes une à une, les connaîtront à nouveau et les accrocheront dans de nombreuses villes. Vermeer ne se retourne pas. Il ramasse la palette, gratte avec le couteau un peu de bleu qui a séché dessus et se penche pour en mélanger du frais.'
          trait_sensitive: 'L''après-midi du 9 décembre, le studio est très calme. Vermeer est assis au chevalet et pendant longtemps le pinceau dans sa main ne touche pas la toile. {staff}, sensible et voyant à quel point il est fatigué, reste un moment derrière lui et lui dit qu''un jour les gens chercheront une à une ces pièces calmes, les connaîtront à nouveau et les accrocheront dans de nombreuses villes. Vermeer ne se retourne pas. Il ramasse la palette, gratte avec le couteau un peu de bleu qui a séché dessus et se penche pour en mélanger du frais.'
          trait_kind: 'L''après-midi du 9 décembre, le studio est très calme. Vermeer est assis au chevalet et pendant longtemps le pinceau dans sa main ne touche pas la toile. {staff}, gentil, reste derrière lui un moment et lui dit qu''un jour les gens chercheront ces pièces calmes une à une, les connaîtront à nouveau et les accrocheront dans de nombreuses villes. Vermeer ne se retourne pas. Il ramasse la palette, gratte avec le couteau un peu de bleu qui a séché dessus et se penche pour en mélanger du frais.'
          else: 'L''après-midi du 9 décembre, le studio est très calme. Vermeer est assis au chevalet et pendant longtemps le pinceau dans sa main ne touche pas la toile. {staff}, qui connaît la peinture, reste derrière lui un moment et lui dit qu''un jour les gens chercheront ces pièces calmes une à une, les connaîtront à nouveau et les accrocheront dans de nombreuses villes. Vermeer ne se retourne pas. Il ramasse la palette, gratte avec le couteau un peu de bleu qui a séché dessus et se penche pour en mélanger du frais.'
        p4:
          class_medical: 'L''après-midi du 12 décembre, Vermeer descend du studio et s''arrête à mi-chemin dans l''escalier, une main contre le mur, le visage soudain gris. {staff}, qui connaît la médecine, l''aide à se coucher, s''assoit à côté de lui pour prendre son pouls, le réveille deux fois dans la nuit pour boire et veille toute la journée suivante. La journée et demie passe. Le troisième matin, Vermeer monte seul les escaliers et ouvre les volets de l''atelier, et la lumière entre et tombe sur le sol nu devant le chevalet.'
          else: 'L''après-midi du 12 décembre, Vermeer descend du studio et s''arrête à mi-chemin dans l''escalier, une main contre le mur, le visage soudain gris. {staff}, portant le kit nano médical, l''aide à se coucher, l''utilise sur lui comme le disent ses instructions, s''assoit à côté de lui, le réveille deux fois dans la nuit pour boire et veille toute la journée suivante. La journée et demie passe. Le troisième matin, Vermeer monte seul les escaliers et ouvre les volets de l''atelier, et la lumière entre et tombe sur le sol nu devant le chevalet.'
      excerpts:
        p4: 'La journée et demie passe. Le troisième matin, Vermeer monte seul les escaliers et ouvre les volets de l''atelier, et la lumière entre et tombe sur le sol nu devant le chevalet.'
        p3: 'Vermeer ne se retourne pas. Il ramasse la palette, gratte avec le couteau un peu de bleu qui a séché dessus et se penche pour en mélanger du frais.'
        p2: 'Dans l''après-midi, trois tableaux, attachés avec de la ficelle, sont emportés hors de la porte sur les épaules des hommes. Catharina compte deux fois l''argent sur la table de la cuisine, en met un petit tas de côté, l''enveloppe dans un linge et le met dans la poche de son tablier.'
        p1: 'L''homme roule sa liste et s''en va. Vermeer reste un moment devant le tableau, puis tend la main et essuie une pellicule de poussière au bas du cadre.'
    relic: 'Une boucle d''oreille en perles'
    relic_desc: 'Une petite perle comme il la peignait si souvent.'
    points:
      p1: 'Avant la fin de l''année, conserver L''Art de la Peinture dans son atelier afin qu''il ne soit pas pris par les créanciers pour ses dettes.'
      p2: 'Aidez-le à vendre certains des tableaux qu''il a laissés depuis la guerre et à alléger les dettes de la maison.'
      p3: 'Faites-lui savoir que ses peintures resteront dans les mémoires'
      p4: 'Avant mi décembre, guérissez-le et gardez-le en vie'
    points_fail:
      p1: 'L''Art de la Peinture est allé chez un créancier à la fin de l''année et en février, Catharina n''avait plus de tableau à transmettre à sa mère. Cette branche s''est détachée de l''histoire et le bureau a rappelé l''employé.'
      p2: 'Les tableaux sont restés entre ses mains et aucun n’a été vendu. Dans cette branche, les dettes des ménages ne cessaient de croître de jour en jour.'
      p3: 'Il ne savait jamais ce qu''il adviendrait de ces peintures. Dans cette branche, personne ne lui avait dit que deux siècles plus tard, on retrouverait leur trace un à un.'
      p4: 'Le mois de décembre s''est déroulé comme dans l''histoire : en un jour et demi, il est passé de la bonne santé à la mort. Dans cette branche, Catharina était encore seule face aux dettes avec onze enfants.'
    shift:
      p1:
        was: 'Le 24 février 1676, Catharina Bolnes transmet l''Art de la peinture à sa mère Maria Thins afin qu''elle ne soit pas vendue pour satisfaire les créanciers ; Vermeer ne l''avait jamais vendu, même endetté.'
      p2:
        was: 'Depuis la guerre de 1672, Vermeer ne pouvait plus vendre son art et se retrouvait avec les peintures d''autres maîtres avec lesquels il vendait ; Catharina a ensuite cité cela comme la cause des dettes du ménage.'
        now: 'Quelques tableaux trouvèrent acheteur en décembre, et la facture de pain et les autres dettes cessèrent d''augmenter pendant un certain temps.'
      p3:
