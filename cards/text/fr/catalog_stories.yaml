    relic: 'Une annonce de cours'
    relic_desc: 'Une pancarte avec le nom de Hilbert à l''endroit où le sien devrait se trouver.'
    points:
      p1: 'Apportez l''article signé de Noether et son résumé à Klein afin qu''il puisse soumettre le travail à la réunion prévue à Göttingen.'
      p2: 'Remettez au département un relevé des cours que Noether a enseignés et une copie de son document signé. Demander au département de budgétiser le paiement du prochain séminaire et le déposer avec la nouvelle candidature'
    points_fail:
      p1: 'La liste porte le nom du présentateur, mais le manuscrit et la page de son auteur ne peuvent pas correspondre. La société reporte le journal à une autre réunion et le bureau rappelle l''employé.'
      p2: 'Le département accepte de maintenir le séminaire. Il utilise l''ancien horaire et ne réserve aucun salaire pour les heures que Noether enseigne.'
    shift:
      p1:
        was: 'Felix Klein a présenté les problèmes variationnels invariants lors d''une réunion à Göttingen le 26 juillet 1918. L''article imprimé nomme Emmy Noether comme son auteur.'
      p2:
        was: 'Noether a terminé son habilitation en 1919. L''université date de 1923 sa première mission d''enseignement avec un petit salaire fixe.'
        now: 'Le département approuve un petit budget de séminaire avant le nouvel examen d''habilitation et paie les heures d''enseignement. Les étudiants qui travaillent avec elle disposent d''un moment régulier pour exposer leurs problèmes.'
        who: 'noether_gottingen'
        bio: 'Les règles de Göttingen ont bloqué la première candidature de Noether pour devenir maître de conférences. Elle a poursuivi ses recherches et a ensuite enseigné aux étudiants dans ses propres classes.'
    vignettes:
      notice: 'Avant le semestre d''hiver, {staff} aide le porteur à épingler les horaires au tableau. Il tape une ligne, le professeur Hilbert avec l''aide du Dr Noether, et dit qu''il a épinglé cette ligne depuis plusieurs trimestres maintenant, et que celle qui va enseigner a toujours été la femme médecin.'
      turnips: 'En octobre, {staff} aide la propriétaire à creuser des navets dans la cour arrière. La grippe est de retour en ville, dit-elle, la moitié des logements étudiants sont vides et elle ne compte plus les coupons de pain car il n''y a plus rien à compter.'
      snow: 'Fin décembre, {staff} aide le porteur du bâtiment de mathématiques à balayer la neige des marches. Il y a tellement d''étudiants revenus de la guerre, dit le portier, que les salles n''ont plus de sièges et que certains écoutent depuis le couloir.'
  boltzmann_duino:
    name: 'Un même nombre, plusieurs agencements'
    place: 'Duino'
    figure: 'Ludwig Boltzmann'
    story: 'En 1877, Ludwig Boltzmann a lié les lois de la chaleur aux statistiques des atomes en comptant les façons dont une distribution d''énergie peut se produire, mais au XXe siècle, nombreux étaient ceux qui doutaient encore de la réalité des atomes. En mai 1906, atteint de ce qu''on appelle une neurasthénie grave, il cesse de donner des cours et, cet été-là, il se rend avec sa famille à Duino, près de Trieste. Il y décède le 5 septembre, à l''âge de soixante-deux ans. Deux ans plus tard, les expériences de Jean Perrin sur le mouvement brownien commencèrent à confirmer les prédictions d''Einstein, et les atomes furent acceptés.'
    story_prose:
      opening:
        - 'La baie de Duino près de Trieste, été 1906. Ludwig Boltzmann y passe ses vacances avec sa femme et sa fille. Il y a près de trente ans, il a compté combien d''arrangements pouvaient donner la même distribution d''énergie et a lié les lois de la chaleur aux atomes. Même aujourd’hui, nombreux sont ceux qui ne croient pas à l’existence réelle des atomes.'
        - 'En mai de cette année-là, il arrêta de donner des cours d''histoire, souffrant de ce qu''on appelle une neurasthénie sévère, et Stefan Meyer suivit ses cours. Le 5 septembre, il mourut à Duino, âgé de soixante-deux ans. Deux ans plus tard, les expériences de Perrin sur le mouvement brownien commencèrent à témoigner de l’existence des atomes. Dans cette branche, un pêcheur sèche ses filets sur le rivage, un petit garçon compte les cailloux sur la plage et la femme de chambre de l''hôtel rapporte chaque jour les serviettes de la mer.'
        - 'Deux types de personnes peuvent aider au cours de ce voyage : quelqu''un qui a suffisamment appris pour parler avec lui des atomes, et quelqu''un qui connaît la médecine, a apporté le bon remède et peut rester à côté d''un homme malade.'
      outcomes:
        all: 'En septembre, le train pour Vienne quitta Duino. Boltzmann était assis près de la fenêtre, la poche de son manteau bombée de ces quelques feuilles de travail.'
        p2: 'En septembre, le train pour Vienne quitta Duino. Il s''est assis près de la fenêtre et a regardé la mer jusqu''au bout.'
        p1: 'Tout cet été, les draps de travail sont restés dans la poche de son manteau.'
      none: 'La baie de Duino était très calme. Sur la terrasse de l''hôtel, quelques feuilles de travail s''étaient envolées de la table et tombaient par terre.'
      not_admitted: '{staff} n’a jamais approché la famille. Chaque jour, l''homme sur la terrasse de l''hôtel s''asseyait face à la mer et les vacances raccourcissaient de jour en jour.'
      points:
        p1: 'Un soir du début d''août, Boltzmann était assis sur la terrasse de l''hôtel, quelques feuilles de travail alourdies sur la table. {staff} en a choisi un et a commencé par le tremblement de minuscules particules dans l''eau : comment Einstein avait calculé l''année précédente jusqu''où un tel tremblement devrait les porter, et comment dans deux ans quelqu''un le mesurerait au microscope. Il écouta la fin sans rien dire, quadrilla les draps et les mit dans la poche de son manteau. En retournant dans sa chambre, il garda sa main appuyée sur cette poche.'
        p2:
          class_learned: 'Comme le ferait un médecin, {staff} fixait chaque jour les heures de ses médicaments et de son sommeil, prenait son pouls matin et soir et marchait avec lui le long du rivage pendant la journée. À la fin du mois d''août, il dormait plus longtemps qu''auparavant et, le matin, il pouvait marcher seul jusqu''à la mer et revenir. Un jour, au petit-déjeuner, il envoya sa fille demander à quelle heure partait le train pour Vienne.'
          else: '{staff} a changé les patchs apaisants qu''ils avaient apportés aux heures fixées, s''est assis avec lui la nuit jusqu''à ce qu''il s''endorme et a marché avec lui le long du rivage pendant la journée. À la fin du mois d''août, il dormait plus longtemps qu''auparavant et, le matin, il pouvait marcher seul jusqu''à la mer et revenir. Un jour, au petit-déjeuner, il envoya sa fille demander à quelle heure partait le train pour Vienne.'
      excerpts:
        p2: 'À la fin du mois d''août, il dormait plus longtemps qu''auparavant et, le matin, il pouvait marcher seul jusqu''à la mer et revenir. Un jour, au petit-déjeuner, il envoya sa fille demander à quelle heure partait le train pour Vienne.'
        p1: 'Il écouta la fin sans rien dire, quadrilla les draps et les mit dans la poche de son manteau. En retournant dans sa chambre, il garda sa main appuyée sur cette poche.'
    relic: 'Un bout de craie'
    relic_desc: 'Un bout de craie de conférence usé.'
    points:
      p1: 'Faites-lui savoir que d''ici quelques années, des expériences montreront que les atomes sont réels et que la théorie qu''il a défendue pendant la moitié de sa vie tiendra.'
      p2: 'Avant la fin des vacances à Duino, guérissez sa maladie et ramenez-le à Vienne'
    points_fail:
      p1: 'Il passe l''été parmi les sceptiques. Dans cette branche, personne ne lui avait dit que les expériences sur le mouvement brownien témoigneraient de l''existence des atomes.'
      p2: 'Le 5 septembre s’est produit comme dans l’histoire. Dans cette branche, il n''est jamais retourné à son pupitre à Vienne.'
    shift:
      p1:
        was: 'Lorsque Boltzmann mourut le 5 septembre 1906, de nombreux physiciens et chimistes doutaient encore de la réalité des atomes ; à partir de 1908, les expériences de Perrin sur le mouvement brownien confirmèrent les prédictions d''Einstein de 1905, et les atomes furent généralement acceptés.'
        now: 'Cet été-là, il savait déjà que d’ici quelques années quelqu’un réglerait expérimentalement la question des atomes.'
      p2:
        was: 'En mai 1906, Boltzmann part en congé de maladie et Stefan Meyer reprend ses cours ; le 5 septembre, il décède alors qu''il était en vacances à Duino, à l''âge de soixante-deux ans.'
        now: '{staff} est resté avec lui tout l''été à Duino et la maladie s''est progressivement atténuée. À l''automne, il rentra chez lui à Vienne avec sa famille, enseigna à nouveau et vécut assez longtemps pour voir les atomes confirmés par l''expérience.'
        who: 'boltzmann_duino'
        bio: 'C''est dans cette direction que Boltzmann se rétablit à l''automne 1906, retourna à Vienne, enseigna encore quelques années et vit les expériences de Perrin gagner en popularité pour les atomes.'
    shift_all: 'Il savait que sa théorie tiendrait debout, que sa maladie s''était atténuée et, à l''automne, il retourna à Vienne pour enseigner.'
    vignettes:
      pebbles: "En juillet, {staff} aide le petit fils d'un pêcheur à compter un seau de cailloux sur la plage. Le garçon demande si des choses trop petites pour être comptées sont là. {staff} indique qu'ils sont là, que quelqu'un les compte ou non\_; le garçon y réfléchit et en jette une autre poignée."
      nets: 'Début juillet, {staff} aide un pêcheur à ramener les filets qui sèchent sur le rivage. Slovènes, Italiens, Allemands, dit le pêcheur, vous les entendez partout dans cette baie, et les poissons ne se soucient pas de savoir dans laquelle vous les maudissez.'
      towels: 'En août, {staff} aide la femme de chambre de l''hôtel à apporter les serviettes qui sèchent au bord de la mer. L''eau s''est réchauffée au début de l''année, dit-elle, les invités de la ville restent toute la saison et le sel lui a arraché la peau des mains.'
  tesla_wardenclyffe:
    name: 'La ligne marquée « projet »'
    place: 'Shoreham, Long Island'
    figure: 'Nikola Tesla'
    story: 'En mars 1901, J. Pierpont Morgan accepta d''investir 150 000 dollars dans une station sans fil pour Nikola Tesla. L''architecte Stanford White a conçu les bâtiments de Wardenclyffe à Long Island, et cette année-là, Tesla lui a écrit à plusieurs reprises au sujet de la tour et du laboratoire. La construction a commencé en septembre. En décembre, Marconi entendit un signal envoyé outre-Atlantique. Tesla a déménagé son laboratoire dans le bâtiment en brique en juin 1902 ; en juillet 1903, Morgan écrivit qu''il n''avancerait plus d''argent. La tour a explosé en 1917.'
    story_prose:
      opening:
        - 'Wardenclyffe, sur la côte nord de Long Island, septembre 1901. Il y a six mois, J. Pierpont Morgan a accepté d''investir 150 000 dollars dans une station sans fil pour l''inventeur Nikola Tesla, et l''architecte Stanford White a conçu ici le laboratoire et la tour. Tesla signifie la tour pour la communication sans fil et l''envoi d''énergie sans fil.'
        - 'Dans l''histoire, en septembre, les offres des constructeurs furent plus élevées que prévu, Tesla écrivit plusieurs fois à White au sujet de la tour et du laboratoire, et les dessins furent modifiés encore et encore ; en décembre, Marconi entendit un signal envoyé outre-Atlantique ; en juillet 1903, Morgan écrivit qu''il n''avancerait plus d''argent et en 1917, la tour explosa. Dans cette branche, le chantier a un contremaître, un gardien garde le hangar à planches sur la falaise et un charretier tire les planches sur la piste sablonneuse.'
        - 'Plusieurs types de personnes peuvent aider lors de ce voyage : quelqu''un qui a conservé des archives ou travaillé comme menuisier, ou quelqu''un de bricoleur et méthodique, pour distinguer les dessins anciens des dessins révisés et voir ce que coûtent chacun le bâtiment et la tour ; et quelqu''un qui peut aussi parler aux gens, pour aider Tesla à définir l''argent étape par étape.'
      outcomes:
        all: 'En juin 1902, Tesla déménagea son laboratoire dans le bâtiment en brique. L''argent finit quand même par manquer, et les deux pages de comptes restèrent épinglées au mur du hangar, ligne tracée sous le tronçon payé.'
        p3: 'L’argent a quand même fini par manquer. Le chantier a payé les travaux de fondation qui avaient été convenus, et les objets sans argent derrière eux ont été répertoriés sur une page à part et épinglés derrière la porte du hangar.'
        p2: 'En juin 1902, Tesla déménagea son laboratoire dans le bâtiment en brique. Les offres pour la tour changèrent encore plusieurs fois, et chacune pouvait être vérifiée par rapport à la page précédente.'
        p1: 'En juin 1902, Tesla déménagea son laboratoire dans le bâtiment en brique de Wardenclyffe et y travailla jusqu''en 1906. Le laboratoire et l''emplacement de la tour survivent aujourd''hui.'
      none: "En juillet 1903, Morgan écrivit qu'il n'avancerait plus d'argent. La tour est restée sur la falaise pendant plus d'une décennie et a explosé en 1917\_; le bâtiment en brique est toujours là."
      desync: 'Le 19 septembre, les deux séries de dessins étaient mélangées en une seule pile, les constructeurs avaient évalué les travaux à partir des anciens et personne ne pouvait dire quelle série suivrait. Lorsque le {staff} a été rappelé, le contremaître était en train d''enrouler tout le tas et de l''attacher avec une longueur de ficelle.'
      not_admitted: '{staff} n''est jamais arrivé sur le site et n''est resté que quelques jours au bord de la piste sablonneuse jusqu''à la falaise. Des charrettes de planches passaient, les roues s''enfonçaient dans le sable, et des hommes les repoussaient par derrière.'
      points:
        p1:
          class_lettered: 'Le 19 septembre, deux séries de dessins reposent sur la longue table du hangar du chantier, les titres exactement les mêmes et les dimensions ne correspondent pas ; les constructeurs ont fixé un prix pour les travaux de l''ancien ensemble, bien au-dessus de ce à quoi on s''attendait. {staff}, habitué à la paperasse, sépare les anciens dessins de ceux révisés feuille par feuille, note au crayon une date sous le pli de chacun, signe pour chaque ensemble et les alourdit sous deux briques. Le contremaître ramasse l''ensemble révisé, le tient un moment à la lumière de la fenêtre, le plie en deux et le glisse dans la poche de sa veste. Il sort du hangar, appelle le bluff et demande aux hommes d''apporter les tas.'
          class_craft: 'Le 19 septembre, deux séries de dessins reposent sur la longue table du hangar du chantier, les titres exactement les mêmes et les dimensions ne correspondent pas ; les constructeurs ont fixé un prix pour les travaux de l''ancien ensemble, bien au-dessus de ce à quoi on s''attendait. {staff}, qui a travaillé avec des outils, mesure point par point les dimensions des deux ensembles avec une règle, sépare les anciens dessins de ceux révisés, note au crayon une date sous le pli de chacun, signe pour chaque ensemble et les pèse sous deux briques. Le contremaître ramasse l''ensemble révisé, le tient un moment à la lumière de la fenêtre, le plie en deux et le glisse dans la poche de sa veste. Il sort du hangar, appelle le bluff et demande aux hommes d''apporter les tas.'
          else: 'Le 19 septembre, deux séries de dessins reposent sur la longue table du hangar du chantier, les titres exactement les mêmes et les dimensions ne correspondent pas ; les constructeurs ont fixé un prix pour les travaux de l''ancien ensemble, bien au-dessus de ce à quoi on s''attendait. {staff}, maniable et minutieux, les compare feuille par feuille, sépare les dessins anciens de ceux révisés, note au crayon une date sous le pli de chacun, signe pour chaque ensemble et les alourdit sous deux briques. Le contremaître ramasse l''ensemble révisé, le tient un moment à la lumière de la fenêtre, le plie en deux et le glisse dans la poche de sa veste. Il sort du hangar, appelle le bluff et demande aux hommes d''apporter les tas.'
        p2:
          class_lettered: 'Fin septembre, une autre offre émane du bureau de White : le bâtiment et la tour sont regroupés en une seule colonne. {staff}, habitué à la paperasse, copie article par article le travail de laboratoire déjà convenu dans les lettres sur sa propre page, répertorie les articles de la tour toujours en attente de nouvelles offres sur une deuxième page et renvoie les deux à White pour qu''ils les examinent. Quand la réponse arrive, le contremaître épingle les deux pages sur les deux murs du hangar. Il se place entre eux pour regarder et trace une ligne sous la page du laboratoire.'
          class_craft: 'Fin septembre, une autre offre émane du bureau de White : le bâtiment et la tour sont regroupés en une seule colonne. {staff}, qui a travaillé avec des outils et sait que les hommes qui posent des briques ne sont pas ceux qui élèvent une tour, sélectionne élément par élément les travaux de laboratoire déjà convenus sur une page à part, répertorie les éléments de la tour toujours en attente de nouvelles offres sur une deuxième page et renvoie les deux à White pour qu''ils les examinent. Quand la réponse arrive, le contremaître épingle les deux pages sur les deux murs du hangar. Il se place entre eux pour regarder et trace une ligne sous la page du laboratoire.'
          else: 'Fin septembre, une autre offre émane du bureau de White : le bâtiment et la tour sont regroupés en une seule colonne. {staff}, à l''œil perçant, voit deux types de travaux mélangés dans cette même colonne, sélectionne élément par élément les travaux de laboratoire déjà convenus sur une page à part, répertorie les éléments de la tour toujours en attente de nouvelles offres sur une deuxième page et renvoie les deux à White pour qu''ils les examinent. Quand la réponse arrive, le contremaître épingle les deux pages sur les deux murs du hangar. Il se place entre eux pour regarder et trace une ligne sous la page du laboratoire.'
        p3:
          class_lettered: 'Début novembre, les murs du bâtiment en brique s''élèvent de jour en jour, tandis que la base de la tour n''est encore qu''un morceau de sable creusé. Tesla sort de New York et feuillette les deux pages de comptes dans le hangar. {staff}, habitué à la paperasse, présente mois par mois les coûts confirmés dans un tableau et lui demande d''effectuer des paiements échelonnés à son bailleur de fonds, avec un accord séparé pour la prochaine tranche de travaux de fondation. Tesla change deux chiffres du tableau avec son stylo, le plie et le glisse dans l''enveloppe adressée à Morgan. Il sort du hangar et le vent du Sound soulève le bord de son chapeau.'
          class_craft: 'Début novembre, les murs du bâtiment en brique s''élèvent de jour en jour, tandis que la base de la tour n''est encore qu''un morceau de sable creusé. Tesla sort de New York et feuillette les deux pages de comptes dans le hangar. {staff}, qui a travaillé avec des outils et sait combien de mois et d''hommes prend un travail depuis le creusement jusqu''à la maçonnerie, présente les coûts confirmés étape par étape dans un tableau et lui demande de verser des paiements échelonnés à son bailleur de fonds, avec un accord séparé pour la prochaine étape des travaux de fondation. Tesla change deux chiffres du tableau avec son stylo, le plie et le glisse dans l''enveloppe adressée à Morgan. Il sort du hangar et le vent du Sound soulève le bord de son chapeau.'
