      p2: 'Une citation regroupe le bâtiment et la tour. Plus tard, l''équipage ne peut pas voir quelle portion était déjà autorisée.'
      p3: 'Les deux types de travaux dépendent toujours du même cycle de financement. Lorsque l’argent vient à manquer, l’équipage ne peut pas savoir pour quel travail il sera payé.'
    shift:
      p1:
        was: 'Tesla et Stanford White ont discuté des offres et des conceptions en 1901. La construction à Wardenclyffe a commencé cette année-là.'
      p2:
        was: 'Wardenclyffe comprenait un bâtiment de laboratoire et une tour. La correspondance enregistre les modifications apportées aux conceptions et aux budgets.'
        now: 'Avant de commencer, le contremaître peut régler les deux comptes séparément. Un nouveau devis de tour peut être comparé à l’estimation précédente.'
      p3:
        was: 'Morgan a fourni le financement initial. Le financement ultérieur n''a pas été suffisant et le projet ne s''est pas déroulé comme prévu initialement.'
        now: 'Un accord écrit couvre le tronçon confirmé. Lorsque les fonds viennent à manquer par la suite, le site peut régler cette facture et identifier clairement les travaux encore non financés.'
        who: 'tesla_wardenclyffe'
        bio: 'Tesla a envisagé Wardenclyffe comme faisant partie d''un système de communication et d''alimentation sans fil. Sa transformation en site nécessitait également des offres, du financement et des calendriers de construction.'
    vignettes:
      timber: 'Début octobre, {staff} aide un charretier à transporter une charge de planches sur la piste sablonneuse jusqu''au site, une épaule sous le hayon à chaque fois que les roues s''enfoncent. Le charretier dit que les agriculteurs du coin ont commencé à chronométrer leurs poules grâce au martèlement, et qu''elles pondent mieux les jours où la cour est calme.'
      signal: 'À la mi-décembre, un garçon arrive de la gare en agitant un papier : Marconi a entendu un signal venant de l''autre côté de l''océan. Le contremaître tient la page à bout de bras et demande à {staff} si un point peut vraiment aller aussi loin. {staff} répond que c''est possible, et le contremaître plie le papier dans son manteau et dit aux hommes de continuer à marteler.'
      watch: 'Fin décembre, {staff} passe une soirée avec le gardien dans le hangar en planches sur la falaise, fourrant de vieux journaux dans les fissures contre le vent du Sound. Le gardien lit le prix du charbon sur l''un d''eux et dit qu''une tour aussi haute vaut mieux que le trait.'
  schubert_vienna:
    name: 'Le programme du concert de mars'
    place: 'Vienne'
    figure: 'Franz Schubert'
    story: 'Le 26 mars 1828, pour la seule fois de sa vie, Franz Schubert donne un concert public de ses propres œuvres, dans les salles de la Gesellschaft der Musikfreunde à Vienne. À l''automne, déjà malade, il emménage dans le nouvel appartement de son frère Ferdinand à Wieden. Le 2 octobre, il offre ses trois dernières sonates pour piano à l''éditeur Probst. Il est décédé dans cet appartement le 19 novembre, à l''âge de trente et un ans. Les sonates ne parurent qu''en 1839, avec une autre dédicace.'
    story_prose:
      opening:
        - 'Vienne, mars 1828. Le compositeur Franz Schubert, trente et un ans, a écrit plus de six cents chansons, outre des symphonies et de la musique de chambre, et peu d''entre elles ont été publiées ou largement jouées. Ce mois-ci, avec l''aide d''amis et d''artistes, il donnera un concert composé uniquement de ses propres œuvres dans les salles de la Gesellschaft der Musikfreunde, le 26 mars.'
        - 'Dans l’histoire, c’était le seul concert qu’il ait jamais donné. À l''automne, il tomba malade et, en septembre, il emménagea dans le nouvel appartement de son frère Ferdinand à Wieden ; le 2 octobre, il écrivit à l''éditeur de Leipzig Probst pour lui proposer ses trois dernières sonates pour piano, qu''il comptait consacrer à un compositeur qu''il admirait, et Probst ne s''y intéressa pas ; le 19 novembre, il décède chez son frère. Les sonates ne sortent qu''en 1839, dédiées à Robert Schumann. Dans cette branche, la société a un portier qui dispose les chaises, un jardin viticole hors les murs a un violoniste et la nouvelle maison de Wieden a une logeuse.'
        - 'Plusieurs types de personnes peuvent aider dans ce voyage : quelqu''un qui connaît la musique et a les mains fermes, ou quelqu''un de méthodique ou capable de rallier les gens, avec une forte volonté, pour amener les musiciens rassemblés à la hâte et la salle le même soir ; un très bon musicien, ou quelqu''un qui a tenu des archives, traduit ou vendu des livres, rapidement et régulièrement, pour régler l''envoi des sonates à l''éditeur ; quelqu''un portant le kit nano médical, pour guérir une maladie que l''âge ne pouvait pas.'
      outcomes:
        all: 'En novembre, Schubert ne tomba pas malade. La réponse de Leipzig arriva et il la conserva dans les manuscrits des trois sonates, dont la première page portait le nom de l''homme à qui il les destinait.'
        p3: 'En novembre, Schubert ne tomba pas malade. Une fois l''hiver arrivé, une petite table pour écrire de la musique se dressait sous la fenêtre de la chambre de Wieden, une pile de papier manuscrit frais alourdie dans son coin.'
        p2: 'Le 19 novembre, Schubert décède chez son frère, à l''âge de trente et un ans. En quittant la pièce, Ferdinand sortit du tiroir une lettre de Leipzig et la posa avec les manuscrits des trois sonates.'
        p1: 'Le 19 novembre, Schubert décède chez son frère, à l''âge de trente et un ans. L''invitation à la soirée du 26 mars fut ensuite imprimée dans les mémoires d''un ami.'
      none: 'Le 19 novembre, Schubert décède dans l''appartement de son frère à Wieden, à l''âge de trente et un ans. Ferdinand conserva les manuscrits des trois sonates et elles ne furent pas imprimées pendant onze ans.'
      desync: 'Le soir du 25 mars, les joueurs et la salle libre avaient encore des jours différents, et le portier tournait les pages du registre sans trouver à qui appartenait le nom du 26. Lors du rappel du {staff}, le portier empilait les chaises qu''il avait disposées contre le mur.'
      not_admitted: '{staff} n''a jamais fait partie de ce cercle d''amis et n''a passé que quelques soirées dans un vignoble hors les murs. Un jour, quelqu''un à la table voisine s''est mis à fredonner une chanson, a dit que c''était un homme appelé Schubert et a perdu les paroles à mi-chemin.'
      points:
        p1:
          trait_methodical: 'Le 25 mars, il reste un jour avant le concert. La salle de la société est libre le 26 au soir, mais l''un des joueurs qui ont promis d''aider se trompe de jour en tête. {staff}, méthodique, dresse une liste, frappe tour à tour à la porte de chaque joueur, vérifie le jour et l''heure chez chacun d''eux et leur fait signer la liste, puis retourne à la société et demande au portier d''inscrire le nom de Schubert pour ce soir-là dans le registre. Avant la tombée de la nuit, Schubert vient voir la salle. Il reste un moment parmi les rangées de chaises vides, puis tend la main et redresse une chaise de la première rangée qui avait été placée de travers.'
          trait_charismatic: 'Le 25 mars, il reste un jour avant le concert. La salle de la société est libre le 26 au soir, mais l''un des joueurs qui ont promis d''aider se trompe de jour en tête. {staff}, persuasif, fait le tour de chacun des joueurs et parle de celui qui a le mauvais jour sur la soirée du 26, puis retourne dans la société et demande au portier d''inscrire le nom de Schubert pour cette soirée dans le registre. Avant la tombée de la nuit, Schubert vient voir la salle. Il reste un moment parmi les rangées de chaises vides, puis tend la main et redresse une chaise de la première rangée qui avait été placée de travers.'
          else: 'Le 25 mars, il reste un jour avant le concert. La salle de la société est libre le 26 au soir, mais l''un des joueurs qui ont promis d''aider se trompe de jour en tête. {staff}, qui connaît la musique, étale les parties sur la table du portier, passe en revue le programme et l''heure avec chaque joueur, et demande au portier d''inscrire le nom de Schubert pour le 26 au soir dans le registre. Avant la tombée de la nuit, Schubert vient voir la salle. Il reste un moment parmi les rangées de chaises vides, puis tend la main et redresse une chaise de la première rangée qui avait été placée de travers.'
        p3:
          class_medical: 'Fin août, la maladie de Schubert s''est encore aggravée et il dort mal la nuit. {staff}, qui connaît la médecine, ouvre le kit nano médical apporté, l''utilise sur lui comme le disent ses instructions, puis le surveille matin et soir. Le jour du déménagement, Schubert transporte lui-même une brassée de musique dans les escaliers de la nouvelle maison de Wieden, jusqu''au sommet, sans s''arrêter. Il pose la musique sous la fenêtre de la nouvelle pièce et pousse la fenêtre pour l''ouvrir.'
          else: 'Fin août, la maladie de Schubert s''est encore aggravée et il dort mal la nuit. {staff}, portant le kit nano médical, l''utilise sur lui étape par étape comme le disent les instructions du cas, puis le surveille matin et soir. Le jour du déménagement, Schubert transporte lui-même une brassée de musique dans les escaliers de la nouvelle maison de Wieden, jusqu''au sommet, sans s''arrêter. Il pose la musique sous la fenêtre de la nouvelle pièce et pousse la fenêtre pour l''ouvrir.'
        p2:
          class_lettered: 'Le soir du 1er octobre, les manuscrits des trois sonates sont étalés sur la table chez Ferdinand, et à côté d''eux une lettre à l''éditeur de Leipzig Probst, à peine commencée. {staff}, habitué à la paperasse et aux éditeurs, copie le nombre de pages et la tonalité de chacune des trois partitions dans une liste de ce qui est envoyé, écrit en tête le nom du compositeur auquel Schubert veut qu''elles soient dédiées, et ajoute une ligne à la lettre demandant à l''éditeur de renvoyer d''abord une confirmation qui puisse être vérifiée. Schubert plie la lettre et écrit l''adresse de Leipzig sur l''enveloppe. Il pose la liste au-dessus de la musique et lisse le pli avec sa paume.'
          else: 'Le soir du 1er octobre, les manuscrits des trois sonates sont étalés sur la table chez Ferdinand, et à côté d''eux une lettre à l''éditeur de Leipzig Probst, à peine commencée. {staff}, qui connaît la musique, classe les trois manuscrits page par page, vérifie les numéros de page et les signes de reprise, les copie dans une liste de ce qui est envoyé, écrit en tête du nom du compositeur auquel Schubert veut qu''ils soient dédiés et ajoute une ligne à la lettre demandant à l''éditeur de renvoyer au préalable une confirmation vérifiable. Schubert plie la lettre et écrit l''adresse de Leipzig sur l''enveloppe. Il pose la liste au-dessus de la musique et lisse le pli avec sa paume.'
      excerpts:
        p3: 'Le jour du déménagement, Schubert transporte lui-même une brassée de musique dans les escaliers de la nouvelle maison de Wieden, jusqu''au sommet, sans s''arrêter. Il pose la musique sous la fenêtre de la nouvelle pièce et pousse la fenêtre pour l''ouvrir.'
        p2: 'Schubert plie la lettre et écrit l''adresse de Leipzig sur l''enveloppe. Il pose la liste au-dessus de la musique et lisse le pli avec sa paume.'
        p1: 'Avant la tombée de la nuit, Schubert vient voir la salle. Il reste un moment parmi les rangées de chaises vides, puis tend la main et redresse une chaise de la première rangée qui avait été placée de travers.'
    relic: 'Un manuscrit de chanson'
    relic_desc: 'Une chanson d''une main rapide avec l''encre encore sombre.'
    points:
      p1: 'Réunissez les musiciens bénévoles et la salle de la société le même soir et protégez le propre concert de Schubert'
      p2: 'Transformez l''enquête en accord pendant que Schubert peut encore régler la publication et la dédicace de ses trois dernières sonates'
      p3: 'Avant qu''il déménage chez son frère Ferdinand, guéris la maladie qu''il porte depuis des années, pour qu''il vive cet automne'
    points_fail:
