  murasaki_kyoto:
    name: 'Le premier grand roman au monde'
    place: 'Kyoto'
    figure: 'Murasaki Shikibu'
    story: 'À l''automne 1008, l''impératrice Shōshi enfanta un fils et Murasaki Shikibu, l''une de ses dames, tenait un journal des semaines qui suivirent. Lors du banquet du cinquantième jour, un courtisan appela « la jeune Murasaki », une jeune fille du Dit du Genji, le plus ancien signe daté indiquant que le conte était connu. Au onzième mois, les dames choisissaient le papier, copiaient et reliaient le conte pour que Shōshi le rapporte au palais, tandis que Michinaga emportait un brouillon que Murasaki avait conservé dans sa chambre. Aucune copie de sa propre main n''a survécu.'
    story_prose:
      opening:
        - 'Kyoto, automne Kankō 5, année 1008. Shōshi, impératrice de l''empereur Ichijō, a donné naissance à un fils, et Murasaki Shikibu, une de ses dames, tient un journal des semaines qui suivent. Lors du banquet du cinquantième jour, un courtisan appelle la « Jeune Murasaki », une fille du Dit du Genji, le signe daté le plus ancien que le conte soit connu.'
        - 'Dans l''histoire, au onzième mois, les dames choisissaient le papier, copiaient le conte et le reliaient pour que Shōshi le rapporte au palais ; Pendant que Murasaki était de service, Michinaga sortit de sa chambre un brouillon qu''elle n''avait pas encore révisé et le donna à sa fille Kenshi, qui écrivit dans son journal son inquiétude. Aucune copie de sa propre main ne survit, et le conte se retrouve à travers des lignes manuscrites ultérieures qui diffèrent les unes des autres. Dans cette succursale, une des dames de Shōshi s''occupe du papier pour la copie, et une autre sait comment se déroulent les banquets.'
        - "Plusieurs types de personnes peuvent aider au cours de ce voyage\_: quelqu'un qui a conservé des archives ou lu des épreuves, ou quelqu'un d'habile et de patient, pour éviter qu'un ensemble de livres ne se trompe d'un seul volume\_; quelqu'un qui connaît les livres et qui sait parler aux gens, pour choisir l'exemplaire à prêter."
      outcomes:
        all: 'Le dix-septième jour du onzième mois, le récit relié retourna au palais avec Shōshi, et il ne manquait pas un seul volume. Ceux qui venaient l''emprunter après le douzième mois ouvraient l''ensemble qu''elle avait marqué. En 2012, le Japon a célébré le 1er novembre la Journée des Classiques, après l''entrée dans son journal du banquet du cinquantième jour.'
        p2: 'Ceux qui venaient emprunter le conte après le douzième mois ouvraient le coffret qu''elle avait vérifié, avec sa petite marque dans le coin. Aucune copie de sa propre main n''a néanmoins survécu, et les manuscrits ultérieurs diffèrent encore les uns des autres.'
        p1: 'Le dix-septième jour du onzième mois, Shōshi revint au palais avec le prince et le récit lié l''accompagna. En 2012, le Japon a célébré le 1er novembre la Journée des Classiques, après l''entrée dans son journal du banquet du cinquantième jour.'
      none: 'La neige est tombée au douzième mois. Les chapitres que Murasaki n''avait pas fini de réviser étaient empruntés à sa chambre, et sur le bureau il ne restait que la boîte laquée, son couvercle mal fermé.'
      desync: 'Au début du dix-septième jour du onzième mois, des volumes non contrôlés étaient encore mélangés dans la poitrine. La dame qui gardait le papier avait étalé les échantillons sur le sol et les comparait un volume à la fois, et lorsque {staff} a été rappelée, elle était toujours agenouillée parmi eux, une fiche de titre qui ne correspondait à rien dans sa main.'
      not_admitted: '{staff} n''est jamais entré à l''intérieur et n''est resté que quelques fois à l''extérieur du mur de Tsuchimikado. La nuit du banquet du cinquantième jour, la musique et les rires ont traversé le mur, et quelqu''un a posé une question qu''on ne pouvait pas comprendre depuis la route.'
      points:
        p1:
          class_lettered: 'Tôt le dix-septième jour du onzième mois, Shōshi doit retourner au palais. Le long de la galerie se trouvent des piles de volumes nouvellement reliés, terminés et non contrôlés mélangés, l''encre de quelques feuillets de titre n''étant pas encore sèche. {staff}, à l''aise avec le papier et l''écriture, ouvre chaque volume et le compare à la liste des chapitres, en sort une reliure avec le mauvais chapitre, met à sa place celle cochée dans l''autre pile et place les volumes dans le coffre à livres dans l''ordre. Avant le départ des voitures, la dame qui garde le journal met le dernier volume dans le coffre. Elle presse à nouveau le nœud au coin du bout du doigt avant de se redresser.'
          else: 'Tôt le dix-septième jour du onzième mois, Shōshi doit retourner au palais. Le long de la galerie se trouvent des piles de volumes nouvellement reliés, terminés et non contrôlés mélangés, l''encre de quelques feuillets de titre n''étant pas encore sèche. {staff}, adroit et patient, passe son doigt le long de chaque feuille de titre contre les échantillons de papier, en sort une reliure avec le mauvais chapitre, met à sa place celle cochée dans l''autre pile et place les volumes dans le coffre à livres dans l''ordre. Avant le départ des voitures, la dame qui garde le journal met le dernier volume dans le coffre. Elle presse à nouveau le nœud au coin du bout du doigt avant de se redresser.'
        p2:
          class_lettered: 'Au milieu du douzième mois, après deux jours sans neige, quelques dames du palais envoient emprunter le conte ; ils veulent d''abord lire les derniers chapitres. Sur le bureau de la chambre de Murasaki se trouvent plusieurs chapitres qu''elle n''a pas fini de réviser, de petits nouveaux écrits dans leurs marges. {staff}, à l''aise avec les livres, emballe l''ensemble qu''elle a enregistré dans son propre coffre, le marque comme l''ensemble de prêt et note pour chaque volume qui le possède et quand il doit le rendre ; les chapitres inachevés sont emballés dans du papier et conservés à côté d''elle. Murasaki tourne un volume du prêt jusqu''à sa dernière page et fait une petite marque dans le coin avec son pinceau. Elle repose le pinceau dans la boîte laquée et le couvercle se ferme avec un léger coup.'
          else: "Au milieu du douzième mois, après deux jours sans neige, quelques dames du palais envoient emprunter le conte ; ils veulent d'abord lire les derniers chapitres. Sur le bureau de la chambre de Murasaki se trouvent plusieurs chapitres qu'elle n'a pas fini de réviser, de petits nouveaux écrits dans leurs marges. {staff}, prudent et persuasif, demande aux emprunteurs de lire d'abord l'ensemble vérifié et de le ranger dans son propre coffre\_; les chapitres inachevés sont emballés dans du papier et conservés à côté d'elle. Murasaki tourne un volume du prêt jusqu'à sa dernière page et fait une petite marque dans le coin avec son pinceau. Elle repose le pinceau dans la boîte laquée et le couvercle se ferme avec un léger coup."
      excerpts:
        p2: 'Murasaki tourne un volume du prêt jusqu''à sa dernière page et fait une petite marque dans le coin avec son pinceau. Elle repose le pinceau dans la boîte laquée et le couvercle se ferme avec un léger coup.'
        p1: 'Avant le départ des voitures, la dame qui garde le journal met le dernier volume dans le coffre. Elle presse à nouveau le nœud au coin du bout du doigt avant de se redresser.'
    relic: 'Une boîte à pinceaux laquée'
    relic_desc: 'Un petit coffret avec des pinceaux, une pierre à encre et de l’eau.'
    points:
      p1: 'Attribuez les papiers par chapitre et vérifiez la livraison des volumes copiés pour Shōshi afin que l''ensemble puisse être assemblé'
      p2: 'Offrez aux premiers lecteurs un exemplaire de prêt qu’elle approuve. Gardez les papiers inachevés avec elle et demandez aux nouveaux copistes de piocher dans l''ensemble approuvé.'
    points_fail:
