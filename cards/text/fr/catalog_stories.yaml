  lovelace_london:
    name: 'Le premier programme'
    place: 'Londres'
    figure: 'Ada Lovelace'
    story: 'En 1842, l''ingénieur italien Luigi Menabrea publia en français un récit du moteur analytique de Charles Babbage. Ada Lovelace l''a traduit et a ajouté sept notes, environ trois fois plus longues que l''article ; la dernière, la note G, explique comment le moteur pourrait calculer les nombres de Bernoulli. En août 1843, Babbage voulait que le journal porte sa propre plainte contre le gouvernement et lui demanda de la retirer si le rédacteur en chef ne voulait pas l''imprimer sans signature. Elle a refusé, et la traduction et les notes, signées A.A.L., sont apparues dans les mémoires scientifiques de Taylor cette année-là. Le 14 août, elle proposa d''organiser la construction du moteur si Babbage s''en tenait à l''ingénierie ; il a refusé ses conditions.'
    story_prose:
      opening:
        - 'Londres, été 1843. Ada Lovelace a mis en anglais le récit français de l’ingénieur italien Menabrea sur le moteur analytique de Babbage, et y a ajouté sept notes, environ trois fois plus longues que l’article. Le dernier d''entre eux, la Note G, expose étape par étape comment ce moteur, encore uniquement sur papier, élaborerait les nombres de Bernoulli.'
        - 'Dans l’histoire, Babbage voulait que sa plainte contre le gouvernement soit imprimée dans le journal ; l''éditeur n''a pas voulu l''imprimer sans signature et Babbage lui a demandé de se retirer. Le 6 août, elle lui écrit qu''elle ne le fera pas et qu''elle est entièrement décidée. Le 14 août, elle proposa de diriger l''entreprise de construction du moteur s''il s''en tenait à l''ingénierie, et Babbage nota dans la lettre qu''il refusait toutes les conditions. Le lendemain, elle dit à sa mère que les imprimeurs l''avaient appelée pour superviser une dernière tournée et que corriger les formules était un travail difficile. Dans cette succursale, un compositeur chez l’imprimeur se plaint que la boîte sigma est presque épuisée et un tisserand de Spitalfields possède un métier Jacquard.'
        - "Plusieurs types de personnes peuvent vous aider lors de ce voyage\_: quelqu'un qui connaît la traduction et les papiers et qui peut conserver un paquet de copies\_; quelqu'un qui peut lire des épreuves et vérifier une cellule de tableau par cellule\_; quelqu'un qui fait preuve de tact et qui peut rassembler deux personnes dans une même division de travail."
      outcomes:
        all: 'Le numéro des Mémoires scientifiques de Taylor est sorti, le tableau de la note G sans une seule cellule hors de sa colonne et les initiales A.A.L. à la fin. En septembre, un visiteur était assis dans la maison de Dorset Street avec les dessins, l''aperçu des coûts et la page divisant le travail étalés devant lui.'
        p3: 'En septembre, un visiteur a examiné les dessins et l''aperçu des coûts dans la rue Dorset, a emporté la page séparant les travaux et a déclaré que l''argent pourrait être réglé une fois que l''ingénierie aurait été examinée.'
        p2: 'Dans la note G imprimée, aucune cellule du tableau n''a glissé hors de sa colonne. L’épreuve qu’elle avait vérifiée restait dans un placard chez l’imprimeur, les points rouges toujours dans sa marge.'
        p1: 'Le numéro des Mémoires scientifiques de Taylor est sorti comme prévu, la traduction et les sept notes imprimées ensemble, et les initiales A.A.L. à la fin.'
      none: 'Fin août, le numéro des Mémoires scientifiques de Taylor fut publié. Dans un atelier de tissage de Spitalfields, les cartes perforées se retournaient encore les unes après les autres.'
      desync: 'On avait dit à l''imprimeur de continuer et d''attendre, et la traduction et les notes du numéro avaient été retirées. Lorsque le bureau a rappelé le {staff}, le compositeur était en train de briser les formes du Note G et de remettre les caractères dans le boîtier par poignées.'
      not_admitted: '{staff} n’est jamais entré dans la maison de St James’s Square et a passé quelques jours à regarder un métier à tisser Jacquard devant la porte d’un tisserand à Spitalfields. Les cartes se retournèrent une à une et la fleur dans la soie s''allongea.'
      points:
        p1:
          class_lettered: 'Le 6 août, elle écrivit à Babbage que la traduction et les notes ne seraient pas retirées et qu''elle était entièrement décidée. {staff}, comme le fait une gardienne de papiers, a compté la traduction et les sept notes par numéro de page, les a liées avec un ruban adhésif, a ajouté l''instruction d''imprimer avec sa signature et les a apportées à l''imprimeur. Le compositeur détacha le ruban : la traduction en haut, les notes en bas, et en bas le grand tableau de la note G. Il aplanit le tableau et alourdissait ses coins avec deux caractères.'
          else: 'Le 6 août, elle écrivit à Babbage que la traduction et les notes ne seraient pas retirées et qu''elle était entièrement décidée. {staff} a transporté le paquet, attaché avec du ruban adhésif, jusqu''à la porte de l''imprimeur et a attendu là jusqu''à ce qu''il s''ouvre, n''a laissé personne d''autre le prendre et l''a posé à deux mains sur le banc du compositeur. Le compositeur détacha le ruban : la traduction en haut, les notes en bas, et en bas le grand tableau de la note G. Il aplanit le tableau et alourdissait ses coins avec deux caractères.'
        p2:
          class_lettered: 'Le 15 août, les imprimeurs l''appellent à nouveau pour superviser les dernières épreuves, les formules étant vérifiées une à une. {staff}, comme le fait un correcteur d''épreuves, a posé une règle sur le tableau de la note G et l''a lu ligne par ligne sur le banc, en mettant un point rouge dans la marge partout où une cellule pouvait glisser dans la colonne suivante, pendant que le compositeur écoutait. Au crépuscule, une ligne de points rouges courait le long de la marge droite de l’épreuve. Elle approcha la table de la fenêtre, la relut de la première à la dernière rangée et la rendit ensuite au compositeur.'
          else: 'Le 15 août, les imprimeurs l''appellent à nouveau pour superviser les dernières épreuves, les formules étant vérifiées une à une. {staff} a copié le tableau de la note G depuis le début, un exemplaire chacun, et l''a parcouru ligne par ligne sur le banc, en mettant un point rouge dans la marge partout où une cellule pouvait glisser dans la colonne suivante. Au crépuscule, une ligne de points rouges courait le long de la marge droite de l’épreuve. Elle approcha la table de la fenêtre, la relut de la première à la dernière rangée et la rendit ensuite au compositeur.'
        p3:
          class_lettered: 'Fin août, les notes signées A.A.L. étaient déjà imprimés. {staff}, sous la forme d''un accord, a écrit sur une page la répartition des tâches de sa lettre du 14 août : elle s''occuperait des affaires et de la collecte de fonds, Babbage s''en tiendrait à l''ingénierie, et il serait d''abord demandé à un bailleur de fonds d''examiner les dessins et un aperçu des coûts. Le page passait une nuit dans chaque maison. À son retour, deux noms de mains différentes se trouvaient au pied, et en dessous d''eux le même jour pour une rencontre.'
          else: 'Fin août, les notes signées A.A.L. étaient déjà imprimés. {staff} a fait plusieurs allers-retours entre sa maison et Dorset Street avec sa lettre du 14 août et a écrit sur une page le pas que chaque côté ferait. Le page passait une nuit dans chaque maison. À son retour, deux noms de mains différentes se trouvaient au pied, et en dessous d''eux le même jour pour une rencontre.'
      excerpts:
        p3: 'Le page passait une nuit dans chaque maison. À son retour, deux noms de mains différentes se trouvaient au pied, et en dessous d''eux le même jour pour une rencontre.'
        p2: 'Au crépuscule, une ligne de points rouges courait le long de la marge droite de l’épreuve. Elle approcha la table de la fenêtre, la relut de la première à la dernière rangée et la rendit ensuite au compositeur.'
        p1: 'Le compositeur détacha le ruban : la traduction en haut, les notes en bas, et en bas le grand tableau de la note G. Il aplanit le tableau et alourdissait ses coins avec deux caractères.'
    relic: 'Une carte perforée'
    relic_desc: 'Une carte dont les trous indiquent à la machine les opérations à effectuer.'
    points:
      p1: 'Avec la permission de Lovelace, envoyez-lui la traduction et les notes à presser ensemble'
      p2: 'Avant que la dernière preuve ne revienne, demandez à Lovelace et au compositeur de lire le tableau de la note G et de marquer les entrées les plus susceptibles de se glisser dans une autre colonne.'
      p3: 'Mettez sa division du travail dans une courte proposition pour un éventuel bailleur de fonds. Lovelace organiserait l''entreprise, Babbage dirigerait l''ingénierie et tous deux conviendraient d''une première réunion.'
    points_fail:
      p1: 'L''imprimante reçoit à la fois des instructions pour continuer et des instructions pour attendre. La traduction et les notes sont extraites du numéro et le bureau rappelle l''employé'
      p2: 'Le compositeur réinitialise plusieurs symboles et personne ne lit les lignes depuis le début. Elle doit vérifier les formules et les tableaux les uns par rapport aux autres au cours des dernières heures'
      p3: 'Sa proposition se termine par la réponse de Babbage. Quand quelqu''un d''autre demande s''il peut soutenir le travail, il n''a aucun plan et les deux sont prêts à céder le relais.'
    shift:
      p1:
        was: 'En août 1843, Babbage lui demanda de demander l’autorisation du rédacteur en chef pour se retirer. Lovelace a refusé et la traduction et ses notes paraphées sont apparues ensemble cette année-là.'
      p2:
        was: 'Le 15 août, Lovelace a dit à sa mère que les imprimeurs l''avaient convoquée pour une surveillance plus approfondie et que corriger les formules mathématiques lui prenait du temps.'
        now: 'L''imprimeur conserve une épreuve qu''il a vérifiée colonne par colonne. Lorsqu''un symbole doit être réinitialisé, le compositeur peut l''utiliser pour vérifier les colonnes voisines.'
      p3:
        was: 'Le 14 août, Lovelace a proposé qu''elle et d''autres bailleurs de fonds dirigent l''entreprise afin que Babbage puisse consacrer son temps à l''ingénierie. Il a décliné ses conditions.'
        now: 'Ils acceptent de montrer à un bailleur de fonds potentiel les dessins et un aperçu des coûts. Le visiteur rend compte de qui ferait quoi et accepte de décider de l''argent après un examen technique.'
        who: 'lovelace_london'
        bio: 'Lovelace a traduit l''article et rédigé ses notes techniques. Elle cherchait également un moyen d’organiser le travail sur un moteur qui existait encore en grande partie sur papier.'
    vignettes:
      messenger: '{staff} attend sous le portique d''une maison de la place Saint-Jacques en tant que messager, et aucun messager ne s''assoit. À l’intérieur, quelqu’un écrit, raye et réécrit ; au crépuscule, une lettre à la cire encore molle est mise dans la main de {staff}, pour Dorset Street.'
      compositor: '{staff} aide le type de sélection du compositeur. Ce numéro est composé uniquement de lettres grecques, d''indices et de petits chiffres placés au-dessus de la ligne, grogne-t-il, la boîte sigma est presque vide, et celui qui l''a écrit devrait venir le régler lui-même.'
      loom: '{staff} s''arrête à la porte d''un tisserand à Spitalfields. Sur le métier Jacquard, les cartes perforées se retournent les unes après les autres, et une fleur surgit dans la soie. Le tisserand dit que les cartes connaissent le motif mieux que lui.'
  mendel_brno:
    name: 'Les pois et les lois de l’hérédité'
    place: 'Brno'
    figure: 'Gregor Mendel'
    story: 'De 1856 à 1863, Gregor Mendel croisa des plants de pois dans le jardin de sa maison de Brno et compta leur progéniture. Les 8 février et 8 mars 1865, il rapporta les résultats lors de deux conférences à la Société d''histoire naturelle de Brno, et le journal fut imprimé dans les actes de la société en 1866. Il ne fut pratiquement pas repris de son vivant. Mendel mourut en 1884 et, en 1900, trois botanistes tombèrent sur son article alors qu''ils travaillaient eux-mêmes sur l''hérédité.'
    story_prose:
      opening:
        - 'Brno, hiver 1865. Depuis 1856, le frère Gregor Mendel croise des plants de pois dans le jardin du monastère et compte leur progéniture génération par génération, huit ans selon son propre récit. Cet hiver, il exposera ces chiffres devant la Société d''histoire naturelle de Brno.'
        - 'Dans l’histoire, il a donné deux conférences, le 8 février et le 8 mars, et le journal a été imprimé dans les actes de la société l’année suivante. De son vivant, presque personne n’est allé plus loin ; il mourut à Brno en 1884 et ce n''est qu''en 1900 que trois botanistes, chacun de son côté, le découvrirent. Dans cette succursale, un portier dépose des nattes de paille à la porte de la salle de réunion, et une vieille femme vend des pois secs au marché aux choux.'
        - "Plusieurs types de personnes peuvent vous aider lors de ce voyage\_: une personne prudente qui peut assurer la sécurité des deux conversations\_; quelqu'un qui enseigne et peut exposer les chiffres génération par génération\_; quelqu'un de persuasif qui peut amener un auditeur à accepter, avant la fin de la réunion, de faire pousser à nouveau les pois chez lui."
      outcomes:
        all: 'Cet automne-là, une lettre venant d''ailleurs arriva au monastère, avec des pois comptés dans un autre jardin. Mendel l''étala sur la table à côté de ses propres chiffres, avec la feuille de comptes par génération alourdie à côté d''eux.'
        p3: 'Cet automne-là, une lettre venant d''ailleurs arriva au monastère, avec des pois comptés dans un autre jardin. Mendel étala les deux séries de nombres côte à côte sur la table et les parcourut ligne par ligne.'
        p2: 'Quelques-uns de ceux qui ont entendu le discours ont copié le décompte par génération et l''ont emporté chez eux. Lorsque les actes furent publiés l''année suivante, ils vérifièrent leurs copies et chaque cellule fut d''accord.'
        p1: 'En 1866, les deux conférences devinrent Expériences sur les hybrides végétaux, imprimées dans le quatrième volume des actes de la société. Dans le jardin du monastère, les petits pois de cette année-là entraient comme d’habitude.'
      none: 'En 1866, le journal fut imprimé dans le cadre des actes de la société, et presque personne ne l’alla plus loin. Dans le jardin du monastère, les cadres à pois étaient vides chaque hiver.'
      desync: 'Le soir du 8 février, nous n’avons eu que le temps de décrire la méthode, et la deuxième conférence n’a jamais été fixée. Lorsque le {staff} a été rappelé, la majeure partie du manuscrit de Mendel était resté intact, pressé sous le coin de la table de la salle de réunion.'
      not_admitted: '{staff} n’est jamais entré dans la salle de réunion de la société et a passé quelques jours au marché aux choux pour aider la vieille femme à trier les pois secs. Les ronds dans un tas, les ridés dans un autre ; elle ne les a jamais comptés.'
      points:
        p1:
          class_lettered: 'Le soir du 8 février, les lampes étaient allumées dans la salle de réunion de la société et la neige avait fondu en une mare sur les nattes de paille devant la porte. Entre les mains de Mendel se trouvaient huit années de chiffres. La veille, {staff}, en véritable archiviste, avait divisé pour lui le manuscrit en deux piles, glissé une bande de papier pour marquer où se terminerait cette soirée et inscrit sur la deuxième pile la date de la prochaine conférence. Lorsqu''il atteignit la page de séparation, il s''arrêta, mit le reste du manuscrit au carré et le mit dans son sac. A la levée de la séance, la date de la prochaine conférence était déjà inscrite dans le procès-verbal : le 8 mars.'
          else: 'Le soir du 8 février, les lampes étaient allumées dans la salle de réunion de la société et la neige avait fondu en une mare sur les nattes de paille devant la porte. Entre les mains de Mendel se trouvaient huit années de chiffres. La nuit précédente, {staff} l''avait entendu lire le manuscrit, garder un œil sur l''horloge, tourner dans un coin à mi-chemin et mettre à part la seconde moitié. Lorsqu''il atteignit la page de séparation, il s''arrêta, mit le reste du manuscrit au carré et le mit dans son sac. A la levée de la séance, la date de la prochaine conférence était déjà inscrite dans le procès-verbal : le 8 mars.'
        p2:
          class_teaching: 'Le 8 mars eut lieu la deuxième conférence. Il a raconté comment les descendants des hybrides se divisaient, lisant les chiffres les uns après les autres, et les gens d''en bas les copiaient jusqu''à ce qu''ils ne puissent plus distinguer une génération de la suivante. {staff}, comme le ferait un enseignant, a dessiné un tableau sur le tableau noir au fond de la salle, une colonne pour la première génération et une pour la suivante, et a rempli une cellule à chaque fois qu''il lisait un nombre. Après la réunion, plusieurs personnes se tenaient encore devant la table, vérifiant ligne par ligne leurs cahiers avec leurs crayons. L''un d''eux, comptant, le dit à haute voix : trois contre un.'
          else: 'Le 8 mars eut lieu la deuxième conférence. Il a raconté comment les descendants des hybrides se divisaient, lisant les chiffres les uns après les autres, et les gens d''en bas les copiaient jusqu''à ce qu''ils ne puissent plus distinguer une génération de la suivante. {staff} avait préalablement recopié ses numéros par génération sur une grande feuille, une colonne pour la première génération et une pour la suivante, et l''avait épinglée au mur au fond de la pièce. Après la réunion, plusieurs personnes se tenaient encore devant la table, vérifiant ligne par ligne leurs cahiers avec leurs crayons. L''un d''eux, comptant, le dit à haute voix : trois contre un.'
        p3:
          class_lettered: 'Le 12 mars, les deux pourparlers étaient terminés et ceux qui les avaient entendus n''étaient pas encore partis. {staff}, comme on tient un registre, contenait un petit livre dans lequel toute personne désireuse de cultiver à nouveau des pois laissait un nom et une adresse, et dont les décomptes devaient être renvoyés l''année suivante. Mendel sortit un petit paquet de pois secs et le tendit au premier homme qui avait laissé son adresse ; la variété et les décomptes pour l''année prochaine étaient écrits sur le papier. L''homme a mis le paquet dans la poche intérieure de son manteau et a boutonné.'
          else: 'Le 12 mars, les deux pourparlers étaient terminés et ceux qui les avaient entendus n''étaient pas encore partis. {staff} a recherché une à une les personnes qui s''étaient assises aux premiers rangs les deux soirs, leur a parlé maison par maison et, une fois convaincu, lui a demandé de laisser une adresse. Mendel sortit un petit paquet de pois secs et le tendit au premier homme qui avait laissé son adresse ; la variété et les décomptes pour l''année prochaine étaient écrits sur le papier. L''homme a mis le paquet dans la poche intérieure de son manteau et a boutonné.'
      excerpts:
        p3: 'Mendel sortit un petit paquet de pois secs et le tendit au premier homme qui avait laissé son adresse ; la variété et les décomptes pour l''année prochaine étaient écrits sur le papier. L''homme a mis le paquet dans la poche intérieure de son manteau et a boutonné.'
        p2: 'Après la réunion, plusieurs personnes se tenaient encore devant la table, vérifiant ligne par ligne leurs cahiers avec leurs crayons. L''un d''eux, comptant, le dit à haute voix : trois contre un.'
        p1: 'Lorsqu''il atteignit la page de séparation, il s''arrêta, mit le reste du manuscrit au carré et le mit dans son sac. A la levée de la séance, la date de la prochaine conférence était déjà inscrite dans le procès-verbal : le 8 mars.'
    relic: 'Une cosse de pois'
    relic_desc: 'Une gousse séchée du jardin du monastère.'
    points:
      p1: 'Aidez Mendel à intégrer huit années de décomptes dans deux entretiens et à protéger les deux lectures pour la société de Brno'
      p2: 'Séparez les décomptes par génération afin que les auditeurs puissent vérifier les chiffres qu''ils ont entendus'
      p3: 'Pendant que les auditeurs sont toujours là, aidez Mendel à organiser une réplication sur un autre site avant que le récit imprimé ne soit publié.'
    points_fail:
      p1: 'La première réunion manque de temps et la seconde n’est jamais programmée. Le compte est incomplet et le bureau rappelle le salarié après une perte de synchronisation.'
      p2: 'Les lecteurs repartent avec un total mais ne peuvent pas dire quels comptes proviennent de la première génération et lesquels sont venus plus tard.'
      p3: 'Les lecteurs en dehors de Brno doivent attendre les actes et les tirés à part, et aucun des participants n''a accepté de répéter les décomptes.'
    shift:
      p1:
        was: 'Les 8 février et 8 mars 1865, Mendel rapporta ses expériences sur les pois lors de deux conférences à la Société d''histoire naturelle de Brno.'
      p2:
        was: 'Les pourparlers de 1865 se sont appuyés sur des années de comptage des pois. L''article publié en 1866 séparait les résultats par génération.'
        now: '{staff} demande à Mendel de laisser une feuille de comparaison après le discours afin que les auditeurs puissent vérifier leurs propres notes par rapport à celle-ci.'
      p3:
        was: 'La société de Brno a imprimé le document en 1866. Mendel a utilisé des tirages à part pour correspondre avec d''autres chercheurs afin de vérifier ses résultats.'
        now: '{staff} enregistre les adresses des observateurs consentants et convient des comptes à renvoyer. Lors de la prochaine campagne agricole, un observateur envoie à Brno des chiffres que Mendel pourra comparer avec les siens avant que les actes ne circulent.'
        who: 'mendel_brno'
        bio: 'L''article de Mendel a finalement été publié dans les actes. Une réplication lancée lors des négociations lui a apporté des résultats plus précoces qu''il a pu vérifier de manière indépendante.'
    vignettes:
      straw: '{staff} aide le porteur à poser des nattes de paille à la porte de la salle de réunion. La neige fond sur chaque paire de bottes, et le porteur dit que ces messieurs préféreraient entendre parler de petits pois plutôt que de s''essuyer les pieds.'
      market: '{staff} aide une vieille femme du marché aux choux à trier les pois secs, les ronds dans un tas et les froissés dans un autre. Les rondes se vendent mieux, dit-elle ; {staff} compte les deux tas de toute façon et arrive à près de trois contre un, et rit le premier.'
      furrow: 'Fin mars, {staff} parcourt les sentiers agricoles à l''extérieur de la ville. Un agriculteur répand le fumier de l''hiver et dit que les pois doivent être récoltés tôt cette année, avant les gelées tardives.'
  mendeleev_petersburg:
    name: 'Le tableau périodique'
    place: 'Saint-Pétersbourg'
    figure: 'Dmitri Mendeleïev'
    story: 'Le 1er mars 1869, Dmitri Mendeleïev dresse un tableau d''une page regroupant les éléments par poids atomique et similarité chimique. Lors de la réunion de la Société chimique russe du 18 mars, Nikolai Menshutkin a lu le journal en l''absence de Mendeleïev. Le procès-verbal reporte la discussion à la réunion suivante, où le sujet n''est pas abordé. Le tableau est apparu dans le manuel de chimie de Mendeleev plus tard en mars et a été diffusé séparément. Dans un résumé allemand du printemps, la récurrence périodique est devenue un changement progressif.'
    story_prose:
      opening:
        - 'Saint-Pétersbourg, printemps 1869. Le 1er mars, Dmitri Mendeleïev termine un tableau d''une page regroupant les éléments par poids atomique et similitude chimique, avec des trous pour les éléments non encore trouvés.'
        - 'Dans l''histoire, il était absent lorsque la Société chimique russe s''est réunie le 18 mars, allé visiter les fromageries de la province de Tver selon un récit, malade selon un autre, et Nikolai Menshutkin a lu le journal à sa place ; le procès-verbal a retardé la discussion parce que l''auteur était absent et lors de la réunion suivante, personne n''en a parlé. Dans le résumé envoyé en mai à l''Allemagne, sa première conclusion, la périodicité des propriétés, apparaît comme un changement progressif. Dans cette succursale, un compositeur chez l’imprimeur se plaint des cartons vides sur la table, et un aubergiste tient un samovar.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît les papiers et peut distinguer un manuscrit sur la table qui l'accompagne\_; quelqu'un qui enseigne et peut poser une série de questions lors d'une réunion\_; quelqu'un qui connaît l'allemand et peut saisir un seul mot."
      outcomes:
        all: 'Cet été-là, les lecteurs allemands trouvèrent des récurrences périodiques dans le résumé. Dans les procès-verbaux de la société de Saint-Pétersbourg, le point du tableau était suivi d''une demi-page de questions et de réponses, et sur le tableau lui-même, plusieurs espaces vides étaient bordés de ronds de crayon.'
        p2: 'Dans les procès-verbaux de la société, le point du tableau était désormais suivi d’une demi-page de questions et réponses. Il a ensuite gardé la table près de lui, avec des anneaux de crayon à côté de plusieurs espaces.'
        p3: 'Cet été-là, les lecteurs allemands découvrirent dans le résumé que les propriétés des éléments revenaient périodiquement. Quand quelqu’un lui écrivait pour savoir comment distinguer une récurrence d’une exception, il étalait le tableau et répondait point par point.'
        p1: 'Fin mars, le tableau a été publié avec le deuxième fascicule des Principes de chimie et a également été imprimé sur une feuille séparée pour les collègues. En 1875, du gallium fut découvert et combla une de ses lacunes.'
      none: 'Le 15 avril, la société s''est à nouveau réunie et personne n''a mis la table. Chez l’imprimeur, les feuilles sèches descendaient de la ligne une à une, les vides restent vides.'
      desync: 'Le 18 mars, Menchoutkine n''avait que la table ; le manuscrit était toujours emballé dans les bagages et la société a frappé l''objet. Lorsque le {staff} a été rappelé, la table était toujours posée sur le bureau de la salle de réunion et personne n''y avait touché.'
      not_admitted: '{staff} n’a jamais franchi la porte de la société et a passé quelques jours dans une auberge pour apprendre à tirer le thé du samovar. Le gardien a surveillé les chaussures de {staff} tout le temps, jusqu''à ce que le robinet soit tourné dans le bon sens.'
      points:
        p1:
          class_lettered: 'Le 18 mars, la Société chimique russe s''est réunie et Mendeleïev n''était pas présent. De ce qu''il avait laissé à Menshutkin, la table était au même endroit et le manuscrit du journal était toujours emballé dans un bagage non ouvert. {staff}, comme le fait un gardien de papiers, a trouvé le manuscrit dans les bagages, l''a vérifié page par page, l''a attaché à la table et a remis les deux entre les mains de Menshutkin avant la réunion. Menchoutkine étendit la table sur le bureau, ouvrit le manuscrit et le lut page après page. La table avait des trous et, au dernier rang, quelqu''un tendit la main pour voir.'
          else: 'Le 18 mars, la Société chimique russe s''est réunie et Mendeleïev n''était pas présent. De ce qu''il avait laissé à Menshutkin, la table était au même endroit et le manuscrit du journal était toujours emballé dans un bagage non ouvert. {staff} est resté debout la moitié de la nuit, a trouvé le manuscrit dans une malle non ouverte avant l''aube et s''est précipité vers la réunion avec lui et la table dans les deux bras. Menchoutkine étendit la table sur le bureau, ouvrit le manuscrit et le lut page après page. La table avait des trous et, au dernier rang, quelqu''un tendit la main pour voir.'
        p2:
          class_teaching: 'Le 15 avril, la société se réunit à nouveau et Mendeleïev était en ville. Le point reporté à la dernière réunion figure toujours sur l''ancienne page. {staff}, comme le ferait un enseignant, a copié le tableau en grand avant la réunion et l''a accroché à l''avant de la salle, et a copié la ligne des dernières minutes, à discuter lorsque l''auteur est présent, en haut de l''ordre du jour. Lorsque l’objet fut présenté, Mendeleïev se tenait debout, la table à la main. Chaque fois que quelqu’un lui demandait s’il y avait un espace, il dessinait un anneau de crayon autour de cette boîte. À la fin de la réunion, il y avait des anneaux à plusieurs endroits et la pointe du crayon était émoussée.'
          else: 'Le 15 avril, la société se réunit à nouveau et Mendeleïev était en ville. Le point reporté à la dernière réunion figure toujours sur l''ancienne page. {staff} a trouvé le secrétaire avant la réunion, lui a montré la ligne des dernières minutes, à discuter lorsque l''auteur est présent, et lui a demandé de la copier dans l''ordre du jour de celle-ci. Lorsque l’objet fut présenté, Mendeleïev se tenait debout, la table à la main. Chaque fois que quelqu’un lui demandait s’il y avait un espace, il dessinait un anneau de crayon autour de cette boîte. À la fin de la réunion, il y avait des anneaux à plusieurs endroits et la pointe du crayon était émoussée.'
        p3:
          class_lettered: 'Début juin, le résumé du Zeitschrift für Chemie allemand était déjà en allemand et n''était pas encore imprimé. {staff}, comme le fait un traducteur, a lu l''allemand à côté du russe et s''est arrêté à la première conclusion : l''original disait que les propriétés montrent une périodicité, la traduction dit qu''elles changent par étapes. Mendeleïev prit la feuille, lut la ligne, biffa le mot et réécrivit à côté le mot pour périodicité. Avant que l''encre ne soit sèche, la feuille était placée dans l''enveloppe destinée à l''Allemagne.'
          else: 'Début juin, le résumé du Zeitschrift für Chemie allemand était déjà en allemand et n''était pas encore imprimé. {staff} a vérifié point par point l''allemand par rapport au russe et a souligné un mot dans la première conclusion : périodicité dans l''original, changement progressif dans la traduction. Mendeleïev prit la feuille, lut la ligne, biffa le mot et réécrivit à côté le mot pour périodicité. Avant que l''encre ne soit sèche, la feuille était placée dans l''enveloppe destinée à l''Allemagne.'
      excerpts:
        p2: 'Chaque fois que quelqu’un lui demandait s’il y avait un espace, il dessinait un anneau de crayon autour de cette boîte. À la fin de la réunion, il y avait des anneaux à plusieurs endroits et la pointe du crayon était émoussée.'
        p3: 'Mendeleïev prit la feuille, lut la ligne, biffa le mot et réécrivit à côté le mot pour périodicité. Avant que l''encre ne soit sèche, la feuille était placée dans l''enveloppe destinée à l''Allemagne.'
        p1: 'Menchoutkine étendit la table sur le bureau, ouvrit le manuscrit et le lut page après page. La table avait des trous et, au dernier rang, quelqu''un tendit la main pour voir.'
    relic: 'Un jeu de cartes des éléments'
    relic_desc: 'Des cartes écrites à la main, qu’on peut disposer comme dans un jeu de solitaire.'
    points:
      p1: 'Mendeleev étant déjà hors de la ville, récupérez le papier et la table qu''il a laissés à Menshutkin pour la réunion de la Chemical Society.'
      p2: 'Au retour de l''auteur, récupérez l''objet réservé à la discussion et laissez-lui du temps lors de la prochaine réunion pour répondre aux questions sur la table.'
      p3: 'Avant que le résumé allemand ne soit mis sous presse, demandez à Mendeleïev de vérifier sa première conclusion et de restaurer le mot qui dit que les propriétés se reproduisent périodiquement.'
    points_fail:
      p1: 'Menshutkin ne reçoit que la table. Le journal est toujours rempli d’affaires de l’auteur, alors la société abandonne l’article et le bureau rappelle l’employé.'
      p2: 'L''élément différé reste sur la page précédente du procès-verbal. La prochaine réunion ne réserve pas de temps pour discuter des éléments.'
      p3: 'La copie allemande est allée au compositeur. Les lecteurs voient les propriétés changer par étapes et ne comprennent pas l''affirmation selon laquelle elles se reproduisent.'
    shift:
      p1:
        was: 'Le 18 mars 1869 (6 mars dans le calendrier russe), Menchoutkine présenta le document pour Mendeleïev. Mendeleïev était absent : selon certains, il était parti inspecter les fromageries du gouvernorat de Tver, selon un autre, il était malade.'
      p2:
        was: 'Le procès-verbal reportait la discussion en raison de l''absence de Mendeleïev. Les réunions ultérieures n’en ont pas parlé.'
        now: 'La société donne à Mendeleev le temps de répondre lors de sa prochaine réunion. Il marque les mentions litigieuses et s''engage à les vérifier auprès des pharmaciens qui les ont relevées.'
      p3:
        was: 'Le résumé allemand de 1869 utilisait un mot pour un changement progressif alors que l''original russe affirmait la périodicité.'
        now: 'Le résumé allemand dit que les propriétés reviennent périodiquement. Un correspondant qui n''a lu que le résumé pose des questions sur la différence entre une récurrence et une exception, et Mendeleïev peut répondre à partir du tableau.'
        who: 'mendeleev_petersburg'
        bio: 'Mendeleïev a dressé une première table à Saint-Pétersbourg et l''a fait circuler lors d''une réunion de société, sous forme de feuilles volantes et de journaux. Au fur et à mesure que l’œuvre traversait les langues, un terme central changeait de sens.'
    vignettes:
      flyers: '{staff} aide chez l''imprimeur, en suspendant les feuilles fraîches d''une table sur une corde pour les faire sécher. Le compositeur se plaint de n''avoir jamais mis une page avec autant de cases vides et de points d''interrogation et demande si monsieur a oublié de les remplir.'
      neva: 'La glace sur la Neva a disparu. {staff} se tient avec la foule sur le quai alors qu''un bateau passe de la forteresse au palais, et un homme à côté dit que jusqu''à ce que ce bateau traverse, personne ne peut le faire.'
      samovar: '{staff} apprend à tirer le thé d''un samovar à l''auberge. Le gardien dit que les étrangers tournent toujours le robinet dans le mauvais sens et se brûlent les bottes, et il surveille constamment les pieds de {staff}.'
  curie_paris:
    name: 'Deux nouveaux éléments'
    place: 'Paris'
    figure: 'Marie Curie'
    story: 'En avril 1898, Marie Curie rapporta que la pitchblende émettait des rayons plus forts que ce que son uranium pouvait expliquer. Travaillant avec Pierre Curie à l''Ecole de Physique et Chimie Industrielle de Paris, elle en sépare les parties et suit les rayons. Le 18 juillet 1898, ils annoncèrent un nouvel élément et le nommèrent polonium, du nom de sa Pologne natale ; le 26 décembre, avec Gustave Bémont, ils annoncent le radium. Marie Curie meurt en 1934 d''une anémie aplasique, généralement liée à sa longue exposition aux radiations.'
    story_prose:
      opening:
        - 'Paris, été 1898. A l''Ecole de Physique et Chimie Industrielle, Marie Curie et Pierre Curie séparent la pitchblende partie par partie et suivent les rayons. En avril, elle a signalé que le minerai émettait des rayons plus puissants que ce que son uranium pouvait expliquer.'
        - 'Dans l''histoire, le 18 juillet, ils ont annoncé un nouvel élément et l''ont nommé polonium, du nom de sa Pologne natale ; le 26 décembre, avec Gustave Bémont, ils annoncent le radium, et une nouvelle raie spectrale vue par Eugène Demarçay est imprimée avec le billet. Le hangar dans lequel ils travaillaient était mal ventilé et laissait passer la pluie, et pendant des années ils ont manipulé leurs échantillons à mains nues ; en 1934, Marie décède d''une anémie aplasique, généralement liée à sa longue exposition aux radiations. Dans cette branche, une femme tient un petit restaurant dans le Quartier Latin, et un homme tient une librairie sur la Seine.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui apporte une protection et connaît la médecine ou le travail de laboratoire\_; quelqu'un qui connaît les disques et peut en aligner plusieurs\_; quelqu'un de persuasif qui peut gagner une chambre."
      outcomes:
        all: 'Cet hiver-là, les instruments s''installèrent dans une pièce dégagée par l''école, le bouclier se tenait devant le banc et les gants étaient accrochés à un clou au bord. Le 26 décembre, le rapport sur le radium parvint à l''Académie et la nouvelle raie spectrale y fut imprimée.'
        p3: 'À partir de cette année-là, le bouclier se tenait devant leur banc, les gants accrochés à un clou au bord. Marie a ensuite travaillé quelques années de plus.'
        p2: 'Cet hiver-là, les instruments ont été déplacés dans la pièce que l''école avait dégagée et n''ont plus été déplacés. Les cahiers étaient alignés sur le rebord de la fenêtre, par ordre de date.'
        p1: 'Le 26 décembre, le rapport sur le radium parvint à l''Académie et la nouvelle raie spectrale y fut imprimée. Dans le hangar, les carnets de mesures de cette année-là étaient empilés dans le coin du banc, celui du haut étant encore ouvert.'
      none: 'Cet hiver-là, la pluie tombait encore par le toit du hangar. Tous deux soulevaient toujours les plats en verre à mains nues, et dans le noir, ce qu''il y avait dedans émettait une faible lueur.'
      desync: 'Dans la nuit du 25 décembre, les observations spectrales et leurs enregistrements ne correspondaient toujours pas et le rapport de fin d''année n''a pas été envoyé. Lorsque {staff} a été rappelé, trois cahiers étaient ouverts sur le banc du hangar, chacun à une date différente.'
      not_admitted: '{staff} n''est jamais entré dans le hangar de la cour de l''école et a pris quelques repas dans la petite place du Quartier Latin. A la table voisine, les étudiants polonais se disputaient encore et la soupe de betterave était redevenue froide.'
      points:
        p1:
          class_lettered: 'Le 25 décembre, le rapport de fin d''année devait parvenir le lendemain à l''Académie. La nouvelle raie spectrale que Demarçay avait vue devait être comparée, entrée par entrée, aux mesures de leurs cahiers. {staff}, comme le fait un archiviste, a aligné les dates des observations spectrales, les numéros des échantillons et les mesures dans les cahiers ligne par ligne, les a copiés dans un tableau et l''a placé au début du manuscrit. Pierre a parcouru le manuscrit du début à la fin, l''a signé et l''a transmis à Marie. Elle signa sous son nom et posa le disque spectral sur le manuscrit.'
          else: 'Le 25 décembre, le rapport de fin d''année devait parvenir le lendemain à l''Académie. La nouvelle raie spectrale que Demarçay avait vue devait être comparée, entrée par entrée, aux mesures de leurs cahiers. {staff} est resté toute la nuit sur les cahiers, a trouvé un par un les numéros des échantillons qui accompagnaient les observations spectrales et les a copiés dans la marge du manuscrit. Pierre a parcouru le manuscrit du début à la fin, l''a signé et l''a transmis à Marie. Elle signa sous son nom et posa le disque spectral sur le manuscrit.'
        p2:
          class_lettered: 'Le 24 décembre, la pluie est revenue à travers le toit du hangar et les bassines qui la captaient avaient atteint la porte. {staff}, comme le fait un archiviste, a relié en un seul volume la note de juillet sur le polonium, le manuscrit à remettre à la fin de l''année et un registre journalier indiquant quand le toit a coulé, quand les travaux ont été arrêtés et combien de fois les instruments ont été déplacés, et l''a apporté au responsable des locaux de l''école. Il se tourna vers les pages où le travail s''était arrêté et durait encore longtemps, puis sortit une clé de son tiroir et la posa sur le livre de jour. Une petite étiquette en bois accrochée à la clé, avec un numéro de chambre dessus.'
          else: 'Le 24 décembre, la pluie est revenue à travers le toit du hangar et les bassines qui la captaient avaient atteint la porte. {staff} a pris les deux rapports et le livret journalier des arrêts et a attendu toute une matinée devant le bureau de l''école, jusqu''à ce que le responsable des salles sorte, puis a tourné les pages une à une pour lui. Il se tourna vers les pages où le travail s''était arrêté et durait encore longtemps, puis sortit une clé de son tiroir et la posa sur le livre de jour. Une petite étiquette en bois accrochée à la clé, avec un numéro de chambre dessus.'
        p3:
          class_medical: 'Fin août, le hangar était étouffant et une rangée de plats en verre se dressait sur le banc, contenant des solutions toujours purifiées. Marie et Pierre soulevaient toujours la vaisselle et en versaient à mains nues. {staff}, comme l''enseignent les soins infirmiers, a installé un bouclier devant le banc, a déplacé les échantillons derrière lui un par un et a remis à chacun d''eux une paire de gants, en disant que cette chose blesse sans faire couler de sang. Marie regarda le bouclier, enfila les gants et chercha derrière lui le plat en verre. Alors que la pièce s''assombrissait vers le soir, ce qu''il y avait dans le plat dégageait une faible lueur ; il tomba sur le bouclier et non sur ses mains.'
          class_learned: 'Fin août, le hangar était étouffant et une rangée de plats en verre se dressait sur le banc, contenant des solutions toujours purifiées. Marie et Pierre soulevaient toujours la vaisselle et en versaient à mains nues. {staff}, comme l''exige un laboratoire, a installé un bouclier devant le banc, a déplacé les échantillons derrière celui-ci, a mesuré la distance de sécurité par rapport au corps, a tracé une ligne à la craie sur le banc et a posé deux paires de gants à côté. Marie regarda le bouclier, enfila les gants et chercha derrière lui le plat en verre. Alors que la pièce s''assombrissait vers le soir, ce qu''il y avait dans le plat dégageait une faible lueur ; il tomba sur le bouclier et non sur ses mains.'
          else: 'Fin août, le hangar était étouffant et une rangée de plats en verre se dressait sur le banc, contenant des solutions toujours purifiées. Marie et Pierre soulevaient toujours la vaisselle et en versaient à mains nues. {staff} a installé le bouclier apporté devant le banc, a déplacé les échantillons derrière lui un à un et a laissé une paire de gants sur le tabouret où Marie était habituellement assise. Marie regarda le bouclier, enfila les gants et chercha derrière lui le plat en verre. Alors que la pièce s''assombrissait vers le soir, ce qu''il y avait dans le plat dégageait une faible lueur ; il tomba sur le bouclier et non sur ses mains.'
      excerpts:
        p3: 'Marie regarda le bouclier, enfila les gants et chercha derrière lui le plat en verre. Alors que la pièce s''assombrissait vers le soir, ce qu''il y avait dans le plat dégageait une faible lueur ; il tomba sur le bouclier et non sur ses mains.'
        p2: 'Il se tourna vers les pages où le travail s''était arrêté et durait encore longtemps, puis sortit une clé de son tiroir et la posa sur le livre de jour. Une petite étiquette en bois accrochée à la clé, avec un numéro de chambre dessus.'
        p1: 'Pierre a parcouru le manuscrit du début à la fin, l''a signé et l''a transmis à Marie. Elle signa sous son nom et posa le disque spectral sur le manuscrit.'
    relic: 'Un tube de pechblende'
    relic_desc: 'Un tube de verre contenant du minerai sombre qui laissait une faible lueur dans le noir.'
    points:
      p1: 'Avant le relevé de fin d''année, rapprocher les dossiers encore en attente d''un contrôle indépendant et protéger le deuxième rapport'
      p2: 'Utilisez les deux rapports pour sécuriser un espace de travail régulier pour Curie et protéger les instruments et les enregistrements pour des mesures ultérieures.'
      p3: 'Mettez désormais des écrans entre Marie et Pierre et leurs échantillons, et protégez leurs mains et leur corps des rayons.'
    points_fail:
      p1: 'L''observation indépendante ne peut pas être comparée aux dossiers de l''équipe avant sa soumission. Le rapport de fin d''année est perdu et le bureau rappelle l''employé.'
      p2: 'L''équipe partage toujours des bancs de fortune. Lorsque le temps change, ils doivent déplacer les instruments et attendre de la place.'
      p3: 'Ils manipulent toujours les échantillons à mains nues et, année après année, les radiations les frappent tous les deux.'
    shift:
      p1:
        was: 'Le 26 décembre 1898, l''Académie de Paris reçut un rapport sur une nouvelle substance radioactive et publia parallèlement une observation spectroscopique indépendante.'
      p2:
        was: 'En 1898, après les deux rapports, les Curie poursuivent leurs recherches dans l''espace de fortune de l''école.'
        now: '{staff} présente les deux rapports ainsi qu''un enregistrement des interruptions pour quelqu''un qui peut organiser l''espace. L''école réserve une salle pour les mesures à long terme.'
      p3:
        was: 'Le 4 juillet 1934, Marie Curie décède d''une anémie aplasique, généralement attribuée à sa longue exposition aux radiations.'
        now: 'À partir de 1898, ils ont tous deux travaillé avec leurs échantillons derrière un blindage et ont subi beaucoup moins de radiations au fil des ans. Marie resta en meilleure santé que dans l''histoire et travailla quelques années de plus.'
        who: 'curie_paris'
        bio: 'Marie Curie a travaillé avec des matières radioactives derrière un blindage à partir de 1898. Elle a été épargnée par les lourds dommages causés par les radiations au cours de ses dernières années et a travaillé quelques années de plus.'
    vignettes:
      shed: 'La pluie tombe à travers le toit du hangar dans la cour de l''école. {staff} dispose des bassines sous les fuites et éloigne un banc de verrerie des gouttes, et le poêle dans le coin réchauffe à peine la pièce.'
      borscht: '{staff} mange dans un petit restaurant du Quartier Latin. A la table voisine, deux étudiants polonais discutent en polonais jusqu''à ce que leur soupe de betterave refroidisse, et le propriétaire dit qu''il y a plus de Polonais par ici que de pigeons sur la Seine.'
      bookstall: 'Dans une librairie de la Seine, {staff} découvre un pamphlet sur les nouveaux rayons qui traversent la chair. Le marchand affirme que les gens de nos jours paieront pour tout ce qu’ils ne peuvent pas voir.'
  freud_vienna:
    name: 'Deux dates pour un même livre'
    place: 'Vienne'
    figure: 'Sigmund Freud'
    story: 'Le 4 novembre 1899, L''Interprétation des rêves de Sigmund Freud parut à Vienne et l''éditeur en imprima 1900 sur sa page de titre. Freud a plus tard appelé le livre sa réaction à la mort de son père. Le premier tirage était de 600 exemplaires, et il a fallu huit ans pour les vendre ; une deuxième édition ne parut qu''en 1909.'
    story_prose:
      opening:
        - 'Vienne, automne 1899. L’Interprétation des rêves de Sigmund Freud est sur le point de paraître chez Deuticke ; il paraîtra le 4 novembre, avec 1900 imprimé sur sa page de titre. Il y a trois ans, en octobre, son père Jacob mourut à Vienne ; Freud a déclaré plus tard que ce livre était sa réaction à la mort de son père.'
        - 'Dans l’histoire, le livre a attiré peu d’attention à sa sortie ; il a fallu environ huit ans pour vendre le premier tirage à 600 exemplaires, et une deuxième édition n''a été publiée qu''en 1909. Dans cette succursale, une librairie du centre-ville a un assistant qui essuie les vitres et un garçon de courses qui tient le carnet de commandes, et un médecin lit les journaux dans un café.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui connaît la médecine et peut parler à ses collègues comme l'un d'entre eux\_; quelqu'un qui connaît les journaux et à quelles mains un livre doit parvenir ; quelqu'un avec une langue prête à l'emploi qui peut ouvrir une porte."
      outcomes:
        p1: 'Cet hiver-là, des lettres parvenaient à Freud les unes après les autres, lui posant des questions page par page sur le livre. Dans le carnet de commandes de la librairie, le livre de rêves s’étendait encore sur quelques lignes.'
      none: 'À la fin du mois de décembre, il a neigé et le libraire, en parcourant le carnet de commandes, a constaté que le livre de rêves n''avait pratiquement pas bougé ce mois-là. Dans le coin de la fenêtre, le livre était toujours ouvert, avec la page de titre qui disait 1900.'
      not_admitted: '{staff} n’a jamais franchi les portes de ces collègues et n’est resté que quelques fois devant la vitrine d’une librairie du centre-ville. Le livre de rêves gisait dans un coin, ouvert sur sa page de titre, une fine pellicule de poussière sur la vitre.'
      points:
        p1:
          class_medical: 'Fin novembre, le nouveau livre sur les rêves était resté près de trois semaines dans le coin de la vitrine. {staff} se rendit en médecin dans les cabinets de quelques collègues avec des exemplaires dans un sac, et dans chacun glissa une note dans le chapitre sur les rêves, indiquant par quelle page commencer. Cette nuit-là, une fenêtre du centre-ville est restée allumée jusque tard dans la nuit. Sur le bureau se trouvait le livre avec 1900 sur sa page de titre, dont plus de la moitié avait déjà été lue.'
          class_press: 'Fin novembre, le nouveau livre sur les rêves était resté près de trois semaines dans le coin de la vitrine. {staff} a utilisé les contacts d’un journaliste pour découvrir quels médecins rédigeraient de longues critiques pour les revues, en envelopperait les exemplaires et les transporterait de porte en porte. Cette nuit-là, une fenêtre du centre-ville est restée allumée jusque tard dans la nuit. Sur le bureau se trouvait le livre avec 1900 sur sa page de titre, dont plus de la moitié avait déjà été lue.'
          else: 'Fin novembre, le nouveau livre sur les rêves était resté près de trois semaines dans le coin de la vitrine. {staff} est resté plusieurs après-midi dans un café, a discuté avec les médecins qui lisaient les journaux et a prêté les exemplaires un par un, demandant seulement de les récupérer une fois lus. Cette nuit-là, une fenêtre du centre-ville est restée allumée jusque tard dans la nuit. Sur le bureau se trouvait le livre avec 1900 sur sa page de titre, dont plus de la moitié avait déjà été lue.'
      excerpts:
        p1: 'Cette nuit-là, une fenêtre du centre-ville est restée allumée jusque tard dans la nuit. Sur le bureau se trouvait le livre avec 1900 sur sa page de titre, dont plus de la moitié avait déjà été lue.'
    relic: 'Un bordereau de libraire daté'
    relic_desc: 'Bon de livraison d''une librairie viennoise, daté de novembre 1899, pour un livre dont la page de titre indique 1900.'
    points:
      p1: 'Dans les semaines tranquilles qui suivent la parution du livre, remettez L''Interprétation des rêves entre les mains de collègues qui le liront jusqu''au bout.'
    points_fail:
      p1: 'Le livre attire peu d''attention. Le premier tirage à 600 exemplaires met huit ans à se vendre.'
    shift:
      p1:
        was: 'Le 4 novembre 1899, L''Interprétation des rêves parut à Vienne dans un premier tirage à 600 exemplaires, daté de 1900. Il leur fallut huit ans pour les vendre.'
        now: '{staff} en apporte des exemplaires à quelques collègues qui ont lu le livre en entier cet hiver-là. Les lettres et les discussions à ce sujet commencent des années plus tôt, et la première impression n’attend pas huit ans.'
        who: 'freud_vienna'
        bio: 'Le livre de Freud sur les rêves a trouvé des lecteurs sérieux dès sa première année. La discussion qu’il attendait depuis des années commença à l’hiver 1899.'
    vignettes:
      window: '{staff} reste longtemps devant la vitrine d’une librairie du centre-ville. Le nouveau livre sur les rêves se trouve dans un coin, ouvert à la page de titre, qui dit 1900. L''assistant sort pour essuyer la vitre et dit qu''elle ne compte comme neuve que l''année prochaine ; pour l''instant, il garde sa place au chaud.'
      cafe: "{staff} descend les journaux du présentoir dans un café et parcourt chaque chronique de critique\_; le livre n'est dans aucun d'entre eux. Un médecin assis à la table voisine dit que personne n'a le temps de lire trois cents pages sur les rêves et commande un autre café pour terminer son devoir."
      snow: 'Fin décembre, il neige. {staff} aide le libraire à dégager la porte, et le garçon, feuilletant le carnet de commandes avec les doigts froids, dit que le livre de rêves n''a pratiquement pas bougé ce mois-ci et demande si les rêves se vendent mieux en été.'
  cajal_barcelona:
    name: 'Les cellules nerveuses, des unités distinctes'
    place: 'Barcelone'
    figure: 'Santiago Ramón y Cajal'
    story: 'Depuis la fin de 1887, Santiago Ramón y Cajal occupait la chaire d''histologie à Barcelone. En mai 1888, il paya le premier numéro de son propre journal et envoya la plupart des rares exemplaires à des chercheurs étrangers, qui lisaient rarement l''espagnol. En octobre 1889, il se rendit à ses frais à la réunion de la Société allemande d''anatomie à Berlin et montra ses lames au microscope ; Albert von Kölliker, l''histologue principal, a repris son travail. En 1906, il partage le prix Nobel avec Camillo Golgi.'
    story_prose:
      opening:
        - 'Barcelone, automne 1889. Santiago Ramón y Cajal enseigne l''histologie à l''université et étudie les branches des cellules nerveuses dans des coupes argentées. L''année précédente, il avait payé de sa poche le premier numéro de son propre journal, soit une soixantaine d''exemplaires, la plupart postés à l''étranger.'
        - 'En histoire, ses collègues à l’étranger lisaient rarement l’espagnol et ses journaux n’attiraient que peu d’attention. Le 26 septembre, il obtint l''autorisation de voyager, paya lui-même le prix du billet pour Berlin et, en octobre, examina ses lames au microscope lors de la réunion de la Société allemande d''anatomie ; à partir de ce moment, Kölliker le soutint. Dans cette succursale, un étudiant du laboratoire surveille un pot de tissus imbibés de bichromate de potassium et s''est rendu à la gare pour demander le billet pour Berlin.'
        - 'Deux types de personnes peuvent aider lors de ce voyage : quelqu''un qui sait tenir les comptes et les lames de microscope en ordre et respecter un emploi du temps, et quelqu''un qui connaît des langues étrangères, peut trouver un traducteur et persuader les gens de l''aider.'
      outcomes:
        all: 'En octobre, dans la salle de réunion de Berlin, il y avait une file d''attente devant le microscope. L’homme devant tenait ces quelques pages traduites.'
        p2: 'À partir de ce moment-là, chaque enveloppe envoyée par Cajal à l’étranger contenait à l’intérieur un ensemble de légendes traduites.'
        p1: 'En octobre, dans la salle de réunion de Berlin, Cajal a glissé une section au microscope, a reculé et a demandé aux gens de regarder.'
      none: 'Dans le laboratoire de Barcelone, les paquets de lames étaient encore empilés dans leur caisse en bois et ne quittaient jamais la table.'
      desync: 'À la fin du mois, le tarif était encore court et les toboggans n''étaient pas encore remplis. Lorsque le {staff} a été rappelé, Cajal mettait un compte rendu écrit dans une enveloppe à poster à Berlin.'
      not_admitted: '{staff} n''est jamais entré dans ce laboratoire. Les diapositives étaient toujours étalées sur la table et le jour de Berlin approchait.'
      points:
        p1: 'Le 26 septembre, l''autorisation de voyager arriva, mais le prix du voyage lui incomba. {staff} inscrivait sur une feuille toutes les sommes sur lesquelles on pouvait tirer, puis triait les lames de microscope à emporter en paquets par numéro, enveloppait chaque paquet dans du papier souple et les emballait dans une caisse en bois avec des cloisons. Les comptes se sont équilibrés et le verrou du boîtier s''est refermé. Cajal a posé la valise sur ses genoux et l''a gardée dans ses bras pendant tout le trajet dans le train pour Berlin.'
        p2:
          class_lettered: 'Comme le font les traducteurs, {staff} a parcouru les dessins avec Cajal un par un, en mettant la légende sous chacun en allemand et en demandant à chaque instant comment chaque fibre devait être appelée avant de l''écrire. Une fois le court article copié au propre, il était d''abord envoyé à quelques collègues disposés à le comparer aux lames de microscope. A Berlin, quelqu''un l''attendait déjà au microscope avec ces quelques pages en main.'
          else: '{staff} a trouvé dans la ville un traducteur qui connaissait l''allemand, l''a persuadé de mettre de côté son propre travail et l''a fait asseoir avec Cajal pour parcourir les dessins un par un, en mettant la légende sous chacun en allemand. Une fois le court article copié au propre, il était d''abord envoyé à quelques collègues disposés à le comparer aux lames de microscope. A Berlin, quelqu''un l''attendait déjà au microscope avec ces quelques pages en main.'
      excerpts:
        p2: 'Une fois le court article copié au propre, il était d''abord envoyé à quelques collègues disposés à le comparer aux lames de microscope. A Berlin, quelqu''un l''attendait déjà au microscope avec ces quelques pages en main.'
        p1: 'Les comptes se sont équilibrés et le verrou du boîtier s''est refermé. Cajal a posé la valise sur ses genoux et l''a gardée dans ses bras pendant tout le trajet dans le train pour Berlin.'
    relic: 'Une plume à dessin très fine'
    relic_desc: 'Un stylo si fin qu''il dessinait chaque branche d''un neurone.'
    points:
      p1: 'Rassemblez les fonds et les lames de microscope après l''échec du financement public et protégez la manifestation de Cajal à Berlin'
      p2: 'Trouver un collaborateur pour traduire les notes illustrées afin que les collègues étrangers puissent les vérifier avant la réunion'
    points_fail:
      p1: 'Il ne peut pas effectuer le déplacement à ses frais et n''envoie que le compte rendu écrit. La succursale n''est plus synchronisée et le bureau rappelle l''employé.'
      p2: 'Les lecteurs étrangers ne commencent à rechercher les rapports espagnols qu''après Berlin et doivent encore écrire pour obtenir des explications un par un.'
    shift:
      p1:
        was: 'Le 26 septembre 1889, Cajal reçut un congé, paya son propre voyage et, en octobre, présenta des diapositives à la réunion de Berlin.'
      p2:
        was: 'En 1889, Cajal rapporta que ses journaux espagnols avaient attiré peu d''attention à l''étranger avant que la manifestation berlinoise ne contribue à diffuser ses résultats.'
        now: '{staff} demande à un traducteur de vérifier la note avec Cajal par rapport aux chiffres, puis de l''envoyer à des collègues disposés à examiner les lames de microscope. Après la réunion, Cajal suit un itinéraire régulier pour faire circuler des illustrations et des textes.'
        who: 'cajal_barcelona'
        bio: 'Cajal a développé une collaboration régulière en matière de traduction à Barcelone. Il pouvait trouver des lecteurs à l''étranger disposés à vérifier ses diapositives au fur et à mesure qu''il envoyait ses articles ultérieurs.'
    vignettes:
      stain: '{staff} aide un étudiant à déposer de petits blocs de tissus dans un pot de bichromate. L''étudiant dit que ce pot doit rester intact jusqu''à la semaine prochaine et que quiconque l''ouvrira pour le regarder devra couper lui-même les cent sections suivantes.'
      ticket: '{staff} accompagne l''étudiant à la gare pour demander le tarif pour Berlin. L''employé le nomme, l''étudiant siffle et, sur le chemin du retour, calcule sur ses doigts le nombre de numéros du journal qui auraient été imprimés.'
      rain: 'En novembre, il pleut à Barcelone. {staff} aide l''élève à apporter une pile d''assiettes en train de sécher sur le rebord de la fenêtre. L''élève les compte deux fois avant de laisser se fermer le volet.'
  hammurabi_babylon:
    name: 'La loi gravée dans la pierre'
    place: 'Babylone'
    figure: 'Hammurabi'
    story: 'Vers 1754 avant JC, à la fin du règne d''Hammurabi, une stèle de basalte gravée de près de trois cents lois fut érigée, et les scribes copièrent ses lois sur des tablettes d''argile pendant des siècles. Au XIIe siècle avant JC, la stèle fut emportée à Suse et plusieurs colonnes de son texte furent grattées. Une expédition française l''a déterré à Suse en 1901 ; il se trouve aujourd''hui au Louvre, et les copies en terre cuite ont restitué une partie de ce qui avait été gratté.'
    story_prose:
      opening:
        - 'Babylone, vers 1754 av. À la fin du règne d''Hammurabi, une stèle en basalte est sculptée d''un prologue, de quelque 282 lois sur la propriété, le commerce, la famille et le travail, ainsi que d''un épilogue. L''épilogue dit qu''un homme qui a été lésé peut se présenter devant la pierre et se faire lire ses paroles. Les scribes copient les lois sur des tablettes d''argile et les enseignent de génération en génération.'
        - 'Dans l''histoire, au XIIe siècle avant JC, le roi élamite Shutruk-Nahhunte transporta la stèle à Suse, et plusieurs colonnes au pied de sa façade furent ensuite grattées ; des copies en terre cuite ont restitué une trentaine des lois manquantes, et ce que disait le reste est encore inconnu. Dans cette branche, un apprenti de la maison des scribes pétrit l''argile et sèche les tablettes, et un batelier sur l''Euphrate ne sait pas lire.'
        - "Plusieurs types de personnes peuvent vous aider lors de ce voyage\_: une personne habituée au travail de bureau et capable de rattraper une file d'attente sautée\_; un artisan à la main ferme, capable de couper un roseau et de presser les panneaux ; quelqu'un d'assez méticuleux pour vérifier colonne par colonne, ou quelqu'un avec des lunettes qui font ressortir les détails de la pierre."
      outcomes:
        p1: 'Plus de trois mille ans plus tard, une tablette tombée dans une autre ville fut déposée à côté de cette étendue de pierre lisse. Quelqu''un l''a lu ligne par ligne le long des coins, jusqu''aux lois que la pierre n''avait plus.'
      none: 'Les tablettes séchaient encore sur le toit, et l''apprenti les comptait toujours une à une. Des siècles plus tard, la stèle fut enlevée et les colonnes à ses pieds furent aplanies, sans qu''il ne reste plus rien à toucher sous la main.'
      not_admitted: '{staff} n''entra jamais dans la maison des scribes et aida le batelier à décharger quelques sacs d''orge sur l''Euphrate. Comptant les sacs, le batelier parla encore de la pierre du roi, sans pouvoir en lire la moindre trace.'
      points:
        p1:
          class_lettered: 'Une douzaine de tablettes d''argile fraîche étaient disposées dans la pièce : le scribe avait l''intention de recopier plusieurs fois tout le texte de la pierre et d''envoyer les copies dans d''autres villes pour les conserver. {staff}, habitué au travail de bureau, comptait les lignes de chaque tablette finie par rapport au modèle à partir du haut, et là où l''on avait sauté une ligne, la lissait pendant que l''argile était molle et l''écrivait à nouveau. Le scribe fit rouler le sceau cylindrique le long du bord de la dernière tablette, laissant une bande de minuscules chiffres et signes. L''apprenti emballa les tablettes un par un dans un panier tapissé de paille, referma le panier et le transporta avec le batelier jusqu''au bateau sur la rivière.'
          class_craft: 'Une douzaine de tablettes d''argile fraîche étaient disposées dans la pièce : le scribe avait l''intention de recopier plusieurs fois tout le texte de la pierre et d''envoyer les copies dans d''autres villes pour les conserver. {staff}, d''une main ferme, coupait les pointes inclinées de quelques roseaux, essayait chacune d''elles sur un morceau d''argile, remettait la plus tranchante au scribe et pressait également une tablette entière du maître. Le scribe fit rouler le sceau cylindrique le long du bord de la dernière tablette, laissant une bande de minuscules chiffres et signes. L''apprenti emballa les tablettes un par un dans un panier tapissé de paille, referma le panier et le transporta avec le batelier jusqu''au bateau sur la rivière.'
          else: 'Une douzaine de tablettes d''argile fraîche étaient disposées dans la pièce : le scribe avait l''intention de recopier plusieurs fois tout le texte de la pierre et d''envoyer les copies dans d''autres villes pour les conserver. {staff} a parcouru la colonne principale colonne par colonne et a gravé sur un tesson de poterie la loi par laquelle chaque tablette commençait et se terminait, de sorte que les copies, assemblées, ne laissaient rien de côté. Le scribe fit rouler le sceau cylindrique le long du bord de la dernière tablette, laissant une bande de minuscules chiffres et signes. L''apprenti emballa les tablettes un par un dans un panier tapissé de paille, referma le panier et le transporta avec le batelier jusqu''au bateau sur la rivière.'
      excerpts:
        p1: 'Le scribe fit rouler le sceau cylindrique le long du bord de la dernière tablette, laissant une bande de minuscules chiffres et signes. L''apprenti emballa les tablettes un par un dans un panier tapissé de paille, referma le panier et le transporta avec le batelier jusqu''au bateau sur la rivière.'
    relic: 'Un sceau-cylindre'
    relic_desc: 'Un petit cylindre de pierre qui imprime une signature lorsqu’on le fait rouler sur l’argile.'
    points:
      p1: 'Aidez les scribes à copier l''intégralité du texte de la stèle sur d''autres tablettes d''argile et à les envoyer dans d''autres villes, afin que chaque loi puisse encore être lue une fois qu''une partie de la pierre a été grattée.'
    points_fail:
      p1: 'Le texte intégral est resté dans les exemplaires existants. Dans cette branche, après que la pierre fut transportée à Suse et qu''une partie en fut grattée, certaines lois furent encore perdues.'
    shift:
      p1:
        was: 'Au XIIe siècle avant JC, la stèle fut emportée à Suse et plusieurs colonnes de son texte furent grattées ; des copies en argile ont restauré une trentaine de lois manquantes, le reste étant encore inconnu.'
        now: '{staff} a aidé les scribes à réaliser davantage de copies complètes et à les envoyer dans d''autres villes. Dans cette chronologie, chaque loi inscrite sur la stèle peut encore être lue.'
        who: 'hammurabi_babylon'
        bio: 'Dans cette ligne, toutes les lois d''Hammurabi ont été rédigées dans leur intégralité, et rien de ce qui a été gratté de la pierre n''a été perdu.'
    vignettes:
      clay: '{staff} aide un apprenti scribe à pétrir l''argile. Il faut bien laver le sable, dit l''apprenti, sinon la tablette se fissure sous le stylet à mi-hauteur, puis le maître lui fait recommencer à partir de la première ligne.'
      river: '{staff} aide un batelier à décharger de l''orge sur la rive de l''Euphrate. En comptant les sacs, le batelier dit que si le peseur lui en trompe un, il ira se placer devant la pierre du roi et lui récitera la loi, bien qu''il ne puisse pas en lire lui-même un signe.'
      roof: 'Dans la pire chaleur de la journée, {staff} et l''apprenti déposent les nouvelles tablettes sur le toit pour les faire sécher. L''apprenti les compte, perd le compte à mi-chemin et recommence, craignant qu''un oiseau n''en ait croisé un.'
  ibn_battuta_tangier:
    name: 'Au début du long voyage'
    place: 'Tanger, Maroc'
    figure: 'Ibn Battûta'
    story: 'En juin 1325, Ibn Battuta quitte son Tanger natal. Dans la Rihla, il se souvient être parti sans compagnon ni caravane, laissant derrière lui ses deux parents. Près de trois décennies de voyages entrent dans le récit qu''il dicte à Ibn Juzayy après son retour au Maroc.'
    story_prose:
      opening:
        - 'Tanger, Maroc, juin 1325. Ibn Battuta, au début de la vingtaine, s''apprête à entreprendre un long voyage et ses deux parents sont toujours à la maison. Près de trente ans plus tard, il rentra chez lui et dicta ce qu''il avait vu à Ibn Juzayy, et cela devint la Rihla.'
        - 'Dans l’histoire, il sortait seul de la porte de la ville, sans compagnon ni caravane à rejoindre. A Miliana, les deux envoyés du sultan de Tunis qu''il avait rattrapés tombèrent tous deux malades par la chaleur, et l''un d''eux mourut au bout de trois nuits près d''un ruisseau en dehors de la ville ; Après Béjaia, la fièvre le reprit et il s''attacha à la selle avec son turban ; le jour où il entra à Tunis, aucun des gens qui sortaient de la ville ne le connaissait et il ne put retenir ses larmes. Dans cette branche, un voisin remplit les outres à la fontaine, et un porteur à la sortie de la ville ne connaît que le premier tronçon de route.'
        - "Plusieurs types de personnes peuvent vous aider lors de ce voyage\_: quelqu'un qui connaît les soins infirmiers et qui a apporté suffisamment de sels de réhydratation et d'eau\_; quelqu'un de très dur, ou quelqu'un qui a des analgésiques et qui peut serrer les dents, pour supporter la chaleur et les secousses ; quelqu'un de chaleureux qui s'avancera à une étrange porte de ville."
      outcomes:
        all: 'Cet automne-là, les deux envoyés du sultan de Tunis rentrèrent dans la ville. Ibn Battuta resta deux mois à Tunis, et celui qui l''accompagnait ce jour-là passait souvent par là où il logeait pour s''asseoir un moment. Plus tard, il se dirigea vers l''est avec une plus grande caravane.'
        p2: 'Cet automne-là, les deux envoyés rentrèrent à Tunis l''un derrière l''autre. Celui qui avait été malade montait en deuxième position, le bol d''eau du ruisseau accroché à sa selle.'
        p3: 'Il reste deux mois à Tunis. Celui qui l''avait accompagné ce jour-là passait souvent par là où il logeait pour s''asseoir un moment, et ils parlaient surtout de la route.'
        p1: 'Il n''a jamais quitté la selle et a tenu jusqu''à Tunis. Le tissu du turban revint ensuite autour de sa tête et partit avec lui très loin vers l''est.'
      none: 'En juillet, près du ruisseau à l''extérieur de Miliana, la caravane s''est arrêtée trois nuits et l''un des envoyés ne s''est pas relevé. En septembre, à la porte de Tunis, les gens qui sortaient injuriaient d''autres hommes, et il se tenait au bord de la foule, tenant les rênes et pleurait à haute voix.'
      desync: 'En août, après Constantine, le nœud s''est détaché. Lors du rappel du {staff}, la caravane s''était arrêtée au milieu de la route et le turban pendait à la selle vide, une extrémité toujours attachée, l''autre traînant sur le sol.'
      not_admitted: '{staff} n''a jamais trouvé pied à Tanger, et a transporté de l''eau à plusieurs reprises à la fontaine pour le voisin. Tôt le 14 juin, un jeune homme a conduit son animal hors de la porte de la ville, sans compagnon à ses côtés ni caravane derrière lui.'
      points:
        p2:
          class_medical: 'Juillet, au bord d''un ruisseau à six kilomètres de Miliana. Les deux envoyés étaient tombés malades à cause de la chaleur, et la caravane s''était arrêtée trois nuits au bord de l''eau ; le pire des deux gisait là et ouvrait à peine les yeux lorsqu''on lui parlait. {staff}, comme l''enseignent les soins infirmiers, a mélangé deux sachets de sels de réhydratation dans l''eau bouillie refroidie dans le flacon, a levé la tête et lui en a donné une gorgée à la fois, et a posé un chiffon humide sur son front et sa nuque, en le changeant de temps en temps. Le quatrième matin, il s''est assis tout seul, a tenu le bol d''eau à deux mains, l''a bu à sec et l''a rendu. La caravane fit ses valises pour continuer sa route, et le ruisseau coulait toujours fort entre les pierres.'
          else: 'Juillet, au bord d''un ruisseau à six kilomètres de Miliana. Les deux envoyés étaient tombés malades à cause de la chaleur, et la caravane s''était arrêtée trois nuits au bord de l''eau ; le pire des deux gisait là et ouvrait à peine les yeux lorsqu''on lui parlait. {staff} a ouvert la trousse médicale apportée, a fait baisser sa fièvre et est resté à ses côtés toute la nuit sans dormir, attendant qu''il boive de l''eau une gorgée à la fois. Le quatrième matin, il s''est assis tout seul, a tenu le bol d''eau à deux mains, l''a bu à sec et l''a rendu. La caravane fit ses valises pour continuer sa route, et le ruisseau coulait toujours fort entre les pierres.'
        p1:
          class_medical: 'Août, passé Constantine : la fièvre revient sur Ibn Battuta. A Bejaia, un ami l''avait déjà exhorté à rester jusqu''à ce qu''il se rétablisse, et il n''est pas resté. Cette fois, il s''attacha à la selle avec son turban, craignant que la fièvre ne le rende trop faible et ne tombe. {staff}, comme l''enseignent les soins infirmiers, palpait son front et son poignet à chaque arrêt, changeait encore et encore le chiffon mouillé, le regardait avaler son eau et resserrait le nœud une fois de plus. La nuit, lorsque la caravane s''arrêtait, il était toujours en selle, affalé sur le cou de l''animal. Lorsque l''outre fut portée à ses lèvres, il but deux gorgées, puis se pencha et sentit à nouveau le nœud.'
          else: 'Août, passé Constantine : la fièvre revient sur Ibn Battuta. A Bejaia, un ami l''avait déjà exhorté à rester jusqu''à ce qu''il se rétablisse, et il n''est pas resté. Cette fois, il s''attacha à la selle avec son turban, craignant que la fièvre ne le rende trop faible et ne tombe. {staff} a marché tout le long du trajet à côté de son animal, une main sur les rênes, et à chaque balancement il levait la main et le replaçait en selle, toute la journée au soleil sans changer de main. La nuit, lorsque la caravane s''arrêtait, il était toujours en selle, affalé sur le cou de l''animal. Lorsque l''outre fut portée à ses lèvres, il but deux gorgées, puis se pencha et sentit à nouveau le nœud.'
        p3: 'Septembre, et la caravane arrive à Tunis. Les gens de la ville sortirent, appelant par leurs noms les marchands de la fête et les prenant par la main les uns après les autres. Personne ne connaissait Ibn Battuta ; il se tenait au bord de la foule, tenant toujours les rênes. {staff}, qui avait beaucoup parlé avec lui sur la route, s''est approché de lui, l''a appelé par son nom et lui a demandé où il dormait cette nuit-là. Il s''essuya le visage avec sa manche et remit dans son autre main les rênes qu''il avait tenues pendant tout le trajet. Tous deux, l''un derrière l''autre, passèrent devant la foule accueillante et franchirent le portail.'
      excerpts:
        p2: 'Le quatrième matin, il s''est assis tout seul, a tenu le bol d''eau à deux mains, l''a bu à sec et l''a rendu. La caravane fit ses valises pour continuer sa route, et le ruisseau coulait toujours fort entre les pierres.'
        p3: 'Il s''essuya le visage avec sa manche et remit dans son autre main les rênes qu''il avait tenues pendant tout le trajet. Tous deux, l''un derrière l''autre, passèrent devant la foule accueillante et franchirent le portail.'
        p1: 'La nuit, lorsque la caravane s''arrêtait, il était toujours en selle, affalé sur le cou de l''animal. Lorsque l''outre fut portée à ses lèvres, il but deux gorgées, puis se pencha et sentit à nouveau le nœud.'
    relic: 'Une sandale portée en voyage'
