      ballot: 'Le 2 octobre, {staff} regarde des hommes clouer une planche devant une taverne de Lombard Street. Le cabaretier dit que demain toutes les chambres à l''étage seront louées à la salle et que la bière sera offerte aux candidats ; il a appris à compter les barils et non les électeurs.'
      ward: 'Dans la nuit du 4 octobre, {staff} apporte un seau d''eau fraîche au service des patients ivres. Le veilleur de nuit dit que le monsieur dans la pièce grillagée ne touchera pas à une tasse ; il garde la lampe basse, parce que l''homme parle au mur quand il fait clair.'
  mary_anning_lyme_regis:
    name: 'Des os dans la falaise'
    place: 'Lyme Regis'
    figure: 'Mary Anning'
    story: 'Vers 1811, Joseph, le frère de Mary Anning, trouva le crâne d''un ichtyosaure dans les falaises de Lyme Regis et, en novembre 1812, Mary déterra son squelette, long d''environ cinq mètres. En décembre 1823, elle trouva le premier squelette complet d''un plésiosaure et en décembre 1828 le premier ptérosaure découvert en Angleterre. Elle mourut en 1847, à l''âge de 47 ans, toujours à court d''argent ; elle était rarement créditée dans les documents rédigés sur ses découvertes.'
    relic: 'Une ammonite'
    relic_desc: 'Une coquille fossile enroulée séparée du lias bleu.'
    points:
      p1: 'Le 10 décembre, gardez en sécurité le plésiosaure sous la falaise et sortez-le entier avant la prochaine chute et le retour de la marée.'
      p2: 'Aidez-la à compter et à dessiner le long cou os par os, pour que le croquis envoyé à Londres résiste aux questions'
      p3: 'Faites-lui savoir de son vivant que ces os porteront un jour son nom'
    points_fail:
      p1: 'La marée montante a emporté la moitié du squelette, et dans cette branche il n''y a pas de premier plésiosaure complet.'
      p2: 'Dans cette succursale, le croquis du 26 décembre s''est déroulé tel quel, sans aucune seconde marque marquée sur les os du cou.'
      p3: 'Dans cette branche, elle ne savait toujours pas qu''on se souviendrait d''elle, et personne ne lui avait dit cet hiver-là.'
    shift:
      p1:
        was: 'En décembre 1823, Mary Anning sortit de la falaise un squelette entier, dont le cou était plus long que le corps.'
      p2:
        was: 'Le 26 décembre 1823, elle envoya à Londres son dessin du plésiosaure tel quel.'
        now: 'Chaque os du cou sur le croquis parvenu à Londres avait son numéro, et lorsque les doutes sont apparus plus tard, le dessin contenait déjà la réponse.'
      p3:
        was: 'Mary Anning est décédée en 1847 à quarante-sept ans, toujours à court d''argent, et les documents sur ce qu''elle a trouvé donnaient rarement son nom.'
        now: 'Cet hiver-là, quelqu''un lui a dit que les ossements qu''elle avait déterrés porteraient un jour son nom dans un musée de Londres et qu''une statue d''elle se dresserait au bord de la mer à Lyme Regis.'
    vignettes:
      stone: '{staff} suit une fissure au-delà du cou du squelette jusqu''à ce que la ligne quitte les os et lève le crayon à cet endroit.'
      vertebrae: '{staff} compte le cou à partir de l''autre extrémité et, là où les deux comptes ne se rejoignent pas, laisse une parenthèse au lieu d''ajouter un os.'
      pose: '{staff} tourne une copie du croquis jusqu''à ce que la tête puisse être trouvée sans aide, et écrit en dessous qui l''a trouvée.'
    story_prose:
      opening:
        - 'Lyme Regis, hiver 1823. Une fois la marée descendue, Mary Anning constate que le squelette sous la falaise a un cou plus long que son corps. Remonter les os ne suffit pas. Les Londoniens l''observeront à travers une feuille de papier, et quelqu''un devra suivre la fissure dans la roche et compter les os du cou un par un avant de pouvoir distinguer ce qu''elle a vu, debout sous la falaise.'
        - 'Dans l''histoire, Anning a ensuite renvoyé le croquis. Le squelette est devenu célèbre, mais son nom a rarement été mentionné dans les articles rédigés sur ces découvertes. Ce voyage arrive avant l''envoi de ce dessin.'
        - "Trois types de personnes peuvent l'aider lors de ce voyage\_: quelqu'un qui peut effectuer de gros travaux sous la falaise et récupérer le squelette avant le retour de la marée, quelqu'un qui peut compter, dessiner et distinguer les os de la roche, et quelqu'un qui est disposé à s'asseoir et à parler avec elle, avec des mots qui l'atteignent."
      outcomes:
        all: 'Sur le croquis envoyé à Londres cet hiver-là, une rangée de petits chiffres courait le long du long cou, et dans le coin se trouvait son nom, écrit de sa propre main.'
        p3: 'La lettre est allée à Londres comme auparavant. Le nom dans le coin du dessin qu''elle y avait elle-même écrit.'
        p2: 'Une fois que le croquis est arrivé à Londres, quelqu''un a eu des doutes, a pris le dessin et a suivi la rangée de chiffres comptés sous le crâne, un os à la fois.'
        p1: 'Cet hiver-là, un squelette entier gisait dans la petite maison au sommet de la falaise, le cou plus long que le corps.'
      none: 'Le jour où la lettre a été envoyée, Anning s''est assise seule sur le croquis jusqu''à tard. Le long cou avait été étiré et effacé si souvent que le papier était devenu flou.'
      desync: 'Lorsque la marée recouvrit le pied de la falaise, une partie du squelette n''avait pas encore été retirée. La dernière chose que {staff} a vue avant le rappel était l''eau qui se refermait sur cet os du cou.'
      not_admitted: '{staff} n''est jamais tombé sous la falaise avec Anning. A marée basse, il n''y avait qu''elle au pied, un marteau à la main.'
      points:
        p1: "Avant que la marée ne revienne, Anning et {staff} ont sorti le squelette au long cou morceau par morceau, les ont enveloppés dans du vieux journal et les ont transportés jusqu'au sommet de la falaise. Le dernier morceau venait à peine de partir lorsque les vagues recouvrirent le pied de la falaise derrière eux. Anning se retourna une fois\_; il n'y avait rien sur l'eau à part de la mousse."
        p2:
          class_learned: 'Pendant qu''elle dessinait le croquis, {staff} a suivi la règle d''un carnet de terrain et a appelé les os un par un à partir de l''autre extrémité, en écrivant chacun comme on l''appelait. Là où les décomptes n''étaient pas d''accord, Anning regarda longuement la fissure, jusqu''à ce qu''elle puisse dire où se trouvait le bord de l''os. En fin de compte, chaque os du cou avait son numéro, et les petits chiffres couraient le long du long cou, jusqu''en dessous du crâne.'
          class_craft: 'Pendant qu''elle dessinait le croquis, {staff} a d''abord tracé légèrement le contour des os le long de la fissure, comme on trace un motif, puis a compté le long cou à partir de l''autre extrémité. Là où les décomptes n''étaient pas d''accord, Anning regarda longuement la fissure, jusqu''à ce qu''elle puisse dire où se trouvait le bord de l''os. En fin de compte, chaque os du cou avait son numéro, et les petits chiffres couraient le long du long cou, jusqu''en dessous du crâne.'
          else: 'Pendant qu''elle dessinait le croquis, {staff} l''a aidée à compter le long cou à partir de l''autre extrémité. Là où les décomptes n''étaient pas d''accord, Anning regarda longuement la fissure, jusqu''à ce qu''elle puisse dire où se trouvait le bord de l''os. En fin de compte, chaque os du cou avait son numéro, et les petits chiffres couraient le long du long cou, jusqu''en dessous du crâne.'
        p3: 'Avant l''envoi du croquis, {staff} parlait de Londres plusieurs années plus tard : un musée y montrerait les os qu''elle avait creusés sous la falaise, avec le nom de Mary Anning à côté d''eux, et une statue d''elle se dresserait au bord de la mer à Lyme. Anning écoutait sans lever les yeux. La plume dans sa main s''arrêta un instant dans le coin du dessin, et là elle écrivit son propre nom.'
      excerpts:
        p3: 'Anning écoutait sans lever les yeux. La plume dans sa main s''arrêta un instant dans le coin du dessin, et là elle écrivit son propre nom.'
        p2: 'Là où les décomptes n''étaient pas d''accord, Anning regarda longuement la fissure, jusqu''à ce qu''elle puisse dire où se trouvait le bord de l''os. En fin de compte, chaque os du cou avait son numéro, et les petits chiffres couraient le long du long cou, jusqu''en dessous du crâne.'
        p1: "Le dernier morceau venait à peine de partir lorsque les vagues recouvrirent le pied de la falaise derrière eux. Anning se retourna une fois\_; il n'y avait rien sur l'eau à part de la mousse."
  pushkin_st_petersburg:
    name: 'L’endroit avant le numéro de la maison'
    place: 'Saint-Pétersbourg'
    figure: 'Alexandre Pouchkine'
    story: 'En 1836 et 1837, Alexandre Pouchkine vivait dans un appartement sur le quai Moïka, près du pont Konyushenny, dans la maison de la princesse Volkonskaya. Le 27 janvier 1837 selon l''ancien calendrier, le 8 février selon le nouveau, il se bat en duel avec Georges d''Anthès au bord de la Rivière Noire et reçoit une balle dans le ventre. Il fut ramené chez lui et y mourut le 29 janvier et le 10 février selon le nouveau calendrier. Il est enterré aux côtés de sa mère près de son domaine familial de Mikhailovskoye.'
    story_prose:
      opening:
        - 'Saint-Pétersbourg, janvier 1837 selon le nouveau calendrier. Alexandre Pouchkine et sa famille vivent sur le quai Moïka, près du pont Konyushenny, dans la maison de la princesse Volkonskaya, et la porte ne porte pas encore le numéro qu''elle a aujourd''hui. Il a écrit Eugène Onéguine en vers et est souvent considéré comme le fondateur de la littérature russe moderne.'
        - 'Dans l''histoire, ses dettes ont augmenté tout cet hiver-là ; le 8 février, selon le nouveau calendrier, il se bat en duel avec Georges d''Anthès au bord de la Rivière Noire, reçoit une balle dans le ventre et est ramené chez lui, et meurt deux jours plus tard d''une péritonite à trente-sept ans, laissant sa femme et ses quatre enfants ; le tsar remboursa plus tard ses dettes. Dans cette succursale, tous ceux qui demandent le chemin de l''appartement le demandent au portier, et une femme de chambre envoie souvent des courses de l''autre côté du pont.'
        - "Plusieurs types de personnes peuvent aider lors de ce voyage\_: quelqu'un qui sait tenir des comptes ou qui a fait du commerce, ou quelqu'un qui est ordonné et vif d'esprit, pour trier une pile de factures\_; quelqu'un qui connaît la médecine ou quelqu'un qui possède une trousse de premiers secours et qui reste stable en cas de crise ; un médecin qui a apporté des antibiotiques, ou un médecin avec un kit nano médical."
      outcomes:
        all: 'À la fin du mois de février, Pouchkine était encore en train de récupérer près de la Moïka et les factures sur son bureau n''étaient plus qu''une seule liste. Il continue à écrire pendant quelques années encore et The Contemporary reste entre ses mains.'
        p3: 'À la fin du mois de février, il était encore en convalescence près de la Moïka et pouvait marcher jusqu''à la fenêtre avec une main sur le mur. Pendant encore quelques années, The Contemporary resta entre ses mains.'
        p1: 'La liste resta sous l’encrier. Ensuite, le ménage dépensait un article à la fois.'
        p2: 'Il revint vivant à la Moïka, fut transporté dans le bureau et y fut allongé sur le canapé. Dans le hall, les gens qui demandaient des nouvelles se tenaient dans la rue.'
      none: 'Le soir du 8 février selon le nouveau calendrier, dans la neige au bord de la Rivière Noire, il n''a pas survécu jusqu''à atteindre la ville. La pile de factures gisait toujours sur le bureau, intacte.'
      desync: 'Le soir du 8 février, selon le nouveau calendrier, à mi-chemin de la ville, la voiture se tut. Lors du rappel du {staff}, il se trouvait dans la neige, la porte entrouverte et un gant gisait au sol.'
      not_admitted: '{staff} n''est jamais entré dans la maison et n''a marché qu''une seule fois le long de la Moika depuis le pont avec le porteur, en comptant les tours pour indiquer son chemin. Le portier a déclaré que de plus en plus de gens demandaient leur chemin ces derniers temps, tous cherchant la maison près du pont.'
      points:
        p1:
          class_lettered: 'Fin janvier, avec le nouveau calendrier, et une pile de factures gisait sur le bureau du bureau, de l''imprimeur, du loyer, du crédit dans les magasins, les unes sur les autres. {staff}, habitué au travail de bureau, les étalait un par un et les copiait par date et montant sur une seule liste, en marquant à côté de chacun lequel payer en premier et lequel pouvait attendre. Pouchkine a pris la liste, l''a regardée pendant un moment et l''a mise sous l''encrier. La pile de billets était regroupée en un paquet et rangée dans un tiroir.'
          class_trade: 'Fin janvier, avec le nouveau calendrier, et une pile de factures gisait sur le bureau du bureau, de l''imprimeur, du loyer, du crédit dans les magasins, les unes sur les autres. {staff}, qui avait fait du commerce et connaissait le fonctionnement des magasins, a trié les factures en piles par créancier, a écrit pour chaque facture une note disant laquelle attendrait et laquelle ne le ferait pas, et les a toutes copiées sur une seule liste. Pouchkine a pris la liste, l''a regardée pendant un moment et l''a mise sous l''encrier. La pile de billets était regroupée en un paquet et rangée dans un tiroir.'
          else: 'Fin janvier, avec le nouveau calendrier, et une pile de factures gisait sur le bureau du bureau, de l''imprimeur, du loyer, du crédit dans les magasins, les unes sur les autres. {staff}, d''un naturel prudent, classait les factures par ordre d''échéance, les recopiait sur une seule liste et vérifiait les sommes ligne par ligne. Pouchkine a pris la liste, l''a regardée pendant un moment et l''a mise sous l''encrier. La pile de billets était regroupée en un paquet et rangée dans un tiroir.'
        p2:
          class_medical: 'Le soir du 8 février selon le nouveau calendrier, dans la neige au bord de la Rivière Noire. D''Anthès tira le premier ; Pouchkine a été touché au ventre, a perdu beaucoup de sang et a été aidé à monter dans une voiture qui s''est précipitée vers la ville. {staff}, formé aux premiers secours, s''est agenouillé dans le chariot en appuyant sur la plaie, l''a enveloppée de tissu propre couche après couche, a pris son pouls de temps en temps et ne l''a pas lâché pendant tout le trajet. La voiture s''est arrêtée à la porte de la Moïka et le portier est sorti en courant avec une lampe. Pouchkine fut transporté et allongé sur le canapé du bureau, la neige sur son manteau n''ayant pas encore fondu.'
          else: 'Le soir du 8 février selon le nouveau calendrier, dans la neige au bord de la Rivière Noire. D''Anthès tira le premier ; Pouchkine a été touché au ventre, a perdu beaucoup de sang et a été aidé à monter dans une voiture qui s''est précipitée vers la ville. {staff} ouvrait la trousse de premiers secours apportée, appuyait de la gaze sur la plaie, étalait également un manteau sous lui et le stabilisait d''une main à chaque cahot du chariot. La voiture s''est arrêtée à la porte de la Moïka et le portier est sorti en courant avec une lampe. Pouchkine fut transporté et allongé sur le canapé du bureau, la neige sur son manteau n''ayant pas encore fondu.'
        p3:
          class_learned: '9 février selon le nouveau calendrier. Il était resté allongé toute la nuit sur le canapé du bureau ; la blessure était devenue chaude et il serrait les dents pour résister à la douleur. {staff}, un médecin, a constaté que la plaie était infectée, l''a nettoyée, lui a donné les médicaments apportés, lui a mis de la gaze fraîche et l''a examiné une fois par heure. Dans l''après-midi du 10 février, sa fièvre est tombée ; il demanda un verre d''eau et but deux gorgées en le tenant lui-même. Devant la fenêtre, la Moïka était gelée et des gens traversaient le pont.'
          else: '9 février selon le nouveau calendrier. Il était resté allongé toute la nuit sur le canapé du bureau ; la blessure était devenue chaude et il serrait les dents pour résister à la douleur. {staff}, formé en médecine, a ouvert la trousse médicale apportée, lui a administré le médicament comme indiqué dans les instructions et a surveillé sa température, en la prenant une fois par heure. Dans l''après-midi du 10 février, sa fièvre est tombée ; il demanda un verre d''eau et but deux gorgées en le tenant lui-même. Devant la fenêtre, la Moïka était gelée et des gens traversaient le pont.'
      excerpts:
        p3: 'Dans l''après-midi du 10 février, sa fièvre est tombée ; il demanda un verre d''eau et but deux gorgées en le tenant lui-même. Devant la fenêtre, la Moïka était gelée et des gens traversaient le pont.'
        p2: 'La voiture s''est arrêtée à la porte de la Moïka et le portier est sorti en courant avec une lampe. Pouchkine fut transporté et allongé sur le canapé du bureau, la neige sur son manteau n''ayant pas encore fondu.'
        p1: 'Pouchkine a pris la liste, l''a regardée pendant un moment et l''a mise sous l''encrier. La pile de billets était regroupée en un paquet et rangée dans un tiroir.'
    relic: 'Un livre de ses vers'
    relic_desc: 'Un petit livre avec une feuille pressée sur un poème.'
    points:
      p1: 'Aidez-le à régler ses dettes croissantes, pour que sa femme et ses enfants ne vivent plus d''une facture à l''autre'
      p2: 'Après qu''il ait été abattu, gardez-le en vie sur la route du retour de la Rivière Noire, afin qu''il atteigne son appartement sur la Moïka.'
      p3: 'Guérissez la blessure par balle dans son estomac, retenez l''infection et gardez-le en vie'
    points_fail:
      p1: 'Dans cette succursale, les factures de cet hiver gisaient encore sur son bureau, et personne ne les triait jamais à sa place.'
      p2: 'Il n''a pas vécu assez longtemps pour atteindre la Moïka, et dans cette branche il n''y a pas deux jours dans l''appartement.'
      p3: 'Dans l''après-midi du 10 février, il est mort dans l''appartement comme il l''a fait dans l''histoire, et dans cette succursale il n''a pas été gardé même un jour de plus.'
    shift:
      p1:
        was: 'À la mort de Pouchkine en février 1837, il laissa de lourdes dettes, que Nicolas Ier remboursa plus tard.'
        now: 'Les dettes étaient écrites sur une seule feuille, celles à payer en premier et celles qui pouvaient attendre, et le ménage savait où il en était.'
      p2:
        was: 'Après avoir été abattu lors du duel du 8 février 1837, Pouchkine fut ramené chez lui dans son appartement de la Moïka.'
      p3:
        was: 'Le 10 février 1837, il mourut d''une péritonite dans l''appartement à trente-sept ans, laissant sa femme et ses quatre enfants.'
        now: 'Le médicament apporté par {staff} a retenu l''infection de la plaie, et à la fin du mois de février, il était encore en convalescence grâce à la Moika. Il continue à écrire pendant quelques années encore et The Contemporary reste entre ses mains.'
    vignettes:
      number: '{staff} donne presque au visiteur un numéro de maison provenant d''une plaque de musée qui n''existe pas encore, puis le raye et dessine le pont sur le bordereau à la place.'
      queue: '{staff} écrit la même réponse sur plusieurs bulletins afin que les personnes qui attendent dans le hall puissent la lire sans demander à nouveau.'
      river: '{staff} part du pont le long de la Moika avec le porteur et compte les tours qui appartiennent aux directions vers la porte.'
  chekhov_badenweiler:
    name: 'Une réponse à la villa Friederike'
    place: 'Badenweiler'
    figure: 'Anton Tchekhov'
    story: 'En juin 1904, Anton Tchekhov, quarante-quatre ans, gravement atteint de tuberculose, se rendit avec sa femme Olga Knipper aux thermes de Badenweiler, en Forêt-Noire. Ils séjournèrent d''abord à l''hôtel Römerbad, puis à la Villa Friederike, puis à l''hôtel Sommer, à côté de la poste. Il écrivit des lettres joyeuses à son pays et, en juillet, demanda à ses amis quel bateau à vapeur pourrait les ramener par voie maritime en Russie. Il y mourut tôt le 15 juillet.'
    story_prose:
      opening:
        - 'Badenweiler, station thermale de la Forêt-Noire, juin 1904. Anton Tchekhov a quarante-quatre ans et est gravement atteint de tuberculose ; il a maigri à Moscou et est essoufflé. Lui et sa femme Olga Knipper sont venus de Russie en train et ils prennent d''abord des chambres à l''hôtel Römerbad, tous deux épuisés.'
        - 'Dans l''histoire, ils ont déménagé à la Villa Friederike, puis à l''hôtel Sommer à côté de la poste. Ses lettres à son retour étaient joyeuses et, le 11 juillet, il écrivit pour demander quel bateau à vapeur pourrait les ramener par voie maritime en Russie. Il y mourut tôt le 15 juillet. Dans cette branche, la femme de chambre déplace une chaise longue après le soleil, et le facteur à l''extérieur du bureau de poste peut soulever une lettre russe et dire si elle contient suffisamment de timbres.'
        - "Trois types de personnes peuvent vous aider lors de ce voyage\_: une personne prudente qui sait garder les lettres et les adresses en sécurité, une personne suffisamment patiente pour regrouper une série de questions dans un court télégramme et une personne qui connaît la médecine et qui vient avec un nano-kit."
      outcomes:
        all: 'À la fin de cet été, Tchekhov et Olga retournèrent en Russie. Le vent soufflait fort sur le pont et il ferma un à un les boutons de son costume de flanelle.'
        p3: 'Après l’été, Tchekhov et Olga partirent pour la Russie. Sur le quai, il portait le costume de flanelle.'
        p2: 'La fine feuille du télégramme restait étalée sur la table à écrire, la ligne autour de la cabine effleurée par ses doigts.'
        p1: 'Maria a reçu la lettre. Au dos de l''enveloppe se trouvait l''adresse de la Villa Friederike, toutes les lettres étant exactes.'
      none: 'Le mois de juillet à Badenweiler a été chaud. La chaise longue sur le balcon a suivi le soleil toute la journée et a été reculée le soir.'
      desync: 'Lorsque le {staff} a été rappelé, la table d''écriture était déjà vide. Maria ne savait toujours pas où logeait son frère.'
      not_admitted: '{staff} n’est jamais entré dans la villa. Le soleil resta dans le jardin jusqu''à sept heures du soir, et à l''étage un homme écrivit quelques lignes d''une lettre et dut se reposer.'
      points:
        p1: 'Le 25 juin, le troisième jour à la Villa Friederike, Tchekhov s''assit à la table d''écriture et écrivait à Maria, se reposant après quelques lignes. {staff} a vérifié l''adresse de retour à la fin de la lettre, une lettre à la fois, et la rue et le numéro de la maison se sont révélés corrects. Tchekhov signa au bas de la lettre, posa le stylo, se renversa dans son fauteuil et regarda par la fenêtre en reprenant son souffle.'
        p2: 'Le 11 juillet, la pièce était aussi chaude qu''un bain de vapeur. Dans sa lettre, Tchekhov demandait point par point : quel jour et à quelle heure le paquebot partait, combien de jours cela prenait, s''il pouvait y avoir une cabine pour deux. {staff} a rassemblé les questions dans un court télégramme et l''a envoyé à quelqu''un qui connaissait l''itinéraire. Lorsque la réponse est arrivée, le jour de navigation, les jours en mer et la cabine étaient tous écrits sur une seule feuille mince. Olga le lui a lu, et lorsqu''elle a atteint la file d''attente autour de la cabane, il lui a demandé de le relire.'
        p3:
          class_learned: '{staff} a d''abord fait comme le voulait l''ancienne méthode de diagnostic, écoutant sa poitrine et comptant ses respirations, puis seulement a ouvert le kit nano, réglé la dose en fonction de son poids et l''a surveillé chaque matin et chaque soir. Dans la chaleur de juillet, il toussait moins. Au bout d''une dizaine de jours, il pouvait revenir seul du balcon dans la pièce et s''asseoir à la table d''écriture. Olga a ramené de Fribourg le costume de flanelle ; il l''enfila et resta un moment devant le miroir.'
          else: '{staff} a ouvert le kit nano, a préparé les doses compartiment par compartiment comme indiqué dans les instructions, s''est tenu aux heures au chevet du patient pour lui donner le médicament et prendre sa température, et la nuit, il a surveillé sa respiration de temps en temps. Dans la chaleur de juillet, il toussait moins. Au bout d''une dizaine de jours, il pouvait revenir seul du balcon dans la pièce et s''asseoir à la table d''écriture. Olga a ramené de Fribourg le costume de flanelle ; il l''enfila et resta un moment devant le miroir.'
      excerpts:
        p3: 'Au bout d''une dizaine de jours, il pouvait revenir seul du balcon dans la pièce et s''asseoir à la table d''écriture. Olga a ramené de Fribourg le costume de flanelle ; il l''enfila et resta un moment devant le miroir.'
        p2: 'Lorsque la réponse est arrivée, le jour de navigation, les jours en mer et la cabine étaient tous écrits sur une seule feuille mince. Olga le lui a lu, et lorsqu''elle a atteint la file d''attente autour de la cabane, il lui a demandé de le relire.'
        p1: '{staff} a vérifié l''adresse de retour à la fin de la lettre, une lettre à la fois, et la rue et le numéro de la maison se sont révélés corrects. Tchekhov signa au bas de la lettre, posa le stylo, se renversa dans son fauteuil et regarda par la fenêtre en reprenant son souffle.'
    relic: 'Un pince-nez'
    relic_desc: 'Petites lunettes rondes sur cordon.'
    points:
      p1: 'Juste après l''installation de Tchekhov, vérifiez l''adresse de retour sur sa lettre à sa sœur Maria et sortez-la pendant qu''il a encore la force de la terminer.'
      p2: 'Transformez les questions de sa lettre du 11 juillet en un court télégramme adressé à quelqu''un qui connaît l''itinéraire. Donnez-lui une réponse pendant qu''il est encore à Badenweiler'
      p3: 'Guérir sa tuberculose pour qu''Olga et lui puissent partir ensemble pour la Russie'
    points_fail:
      p1: 'Les bagages sont toujours traités selon les modalités de l’ancien hôtel. La lettre inachevée l''accompagne. Maria ne reçoit aucune adresse de la villa et le bureau rappelle l''employé.'
      p2: 'Ses questions sur les dates de départ, la cabine et la durée de la traversée sont envoyées par courrier ordinaire. Pendant qu''il attend, il n''a aucune réponse à lire.'
      p3: 'Tchekhov mourut le 15 juillet à Badenweiler, à l''âge de quarante-quatre ans.'
    shift:
      p1:
        was: 'Le 25 juin 1904 (12 juin dans le calendrier russe), Tchekhov écrivit à Maria de Badenweiler avec l''adresse complète de retour à la Villa Friederike.'
      p2:
        was: 'Le 11 juillet 1904, Tchekhov interrogea Rossolimo sur la navigation de Marseille à Odessa. Il mourut à Badenweiler le 15 juillet et ne fit jamais ce voyage.'
        now: 'Une réponse par télégramme donne le jour du départ, la durée de la traversée et une cabine pour deux. Tchekhov et sa femme l''ont lu à l''hôtel et parlent du bateau qu''ils choisiraient s''ils pouvaient partir.'
      p3:
        was: 'Le 15 juillet 1904, Tchekhov mourut de tuberculose à Badenweiler, à quarante-quatre ans.'
        now: 'Ses poumons ont guéri et après l’été, Olga et lui sont rentrés chez eux en Russie. Il a continué à écrire pendant des années et était de retour au Théâtre d''art de Moscou pour les répétitions.'
        who: 'chekhov_badenweiler'
        bio: 'Tchekhov fut guéri de la tuberculose à Badenweiler, rentra chez lui en Russie à l''automne 1904 et écrivit des histoires et des pièces de théâtre pendant de nombreuses années encore.'
    vignettes:
      garden: 'Le 27 juin, {staff} aide la femme de chambre de la Villa Friederike à transporter une chaise longue dans le jardin après le soleil. Elle dit que le soleil quitte la pelouse à sept heures précises et que, dans cette maison, on prépare le dîner à côté de celle-ci et non à l''heure de l''horloge du hall.'
      post: 'Le 7 juillet, {staff} est assis sur le banc devant le bureau de poste à côté de l''hôtel Sommer. Le facteur dit qu''en été, ce sont les Russes qui écrivent le plus de lettres à Badenweiler, et les Anglais les plus courtes ; il peut soulever une enveloppe russe et dire si elle aura besoin d''un autre timbre.'
      ice: 'Le 10 juillet, au plus fort de la chaleur, {staff} aide le portier de l''hôtel Sommer à transporter un bloc de glace de la cave dans un sac. Le porteur dit que la Forêt-Noire n''a pas connu un mois de juillet pareil depuis vingt ans et que l''homme des glaces de Müllheim a commencé à monter par les escaliers.'
  boole_ballintemple:
    name: 'Des vêtements mouillés et un cours'
    place: 'Ballintemple, Cork'
    figure: 'George Boole'
    story: 'Il pleut à Cork et George Boole a une classe à donner. Un étudiant est encore perplexe face à un exercice des Lois de la pensée. De l’autre côté de la ville, un tableau du travail inachevé de Boole sur les équations différentielles devra éventuellement être recalculé, tout cela à cause d’un seul signe.'
    story_prose:
      opening:
        - 'Cork, Irlande, novembre 1864. George Boole est le premier professeur de mathématiques au Queen’s College. Il y a dix ans, dans Les Lois de la pensée, il a écrit les lois du raisonnement en algèbre, et l''une d''entre elles dit que choisir deux fois selon la même condition laisse le choix inchangé. Il lui reste encore un livre inachevé sur les équations différentielles.'
        - 'Dans l''histoire, le 24 novembre, il s''est rendu de chez lui au collège sous de fortes pluies pour enseigner. Le 8 décembre, il est décédé d''une pleuropneumonie à son domicile de Ballintemple. L''année suivante, Todhunter rédigea le supplément et écrivait dans la préface que le tableau à la fin du livre avait été recalculé par Sephton à cause d''un signe erroné dans une formule. Dans cette branche, un étudiant qui tient à la main des bulletins numérotés se demande encore quel bulletin tombera lorsqu''il choisira une seconde fois selon la même condition.'
        - 'Trois types de personnes peuvent aider lors de ce voyage : une personne ponctuelle qui transportera les notes de cours sous la pluie, une personne capable de vérifier une formule et de trouver l''erreur et une personne connaissant les soins infirmiers et pouvant assurer une surveillance de nuit.'
      outcomes:
        all: 'Durant ces nuits de décembre, la lampe de la maison de Boole brûlait jusqu’au matin, et les veilles se succédaient. Le marqueur papier était toujours à sa place l’année suivante.'
        p3: 'Ces nuits-là, la lampe de la maison de Boole brûlait jusqu’au matin, et les veilles se succédaient.'
        p2: 'L’année suivante, l’éditeur ouvrit le dossier et le marqueur papier était toujours à sa place. Sephton commença son calcul à partir de ce signe.'
        p1: 'Lors de la conférence du 24 novembre, pas une seule page des notes sur le bureau n''était mouillée.'
      none: 'La pluie a continué jusqu''en décembre. Dans la maison de Ballintemple, les gens au chevet n''ont pas fermé les yeux de la nuit.'
      desync: 'Ce jour-là, la pluie a réduit en bouillie les notes de cours et le pupitre est resté vide. {staff} a été rappelé par le bureau avant la prochaine conférence.'
      not_admitted: '{staff} n’a jamais franchi la porte du collège. La pluie ne cessait de tomber et les notes de cours étaient toujours sur la table de la maison de Boole.'
      points:
        p1: 'Le 24 novembre, la pluie était forte. Avant que Boole ne quitte la maison, {staff} a enveloppé les notes de cours dans deux couches de toile cirée, les a transportées sous un manteau jusqu''au collège devant lui et les a mises dans le tiroir du pupitre. Quand Boole entra, son manteau était dégoulinant et il ouvrit le tiroir pour trouver les notes sèches. Il les étala, s''essuya les mains avec sa manche et commença.'
        p2: '{staff} a mis la table à côté de la formule qui l''a produit et a travaillé ligne par ligne. À un endroit, les chiffres ne concordaient pas ; tracée vers le haut, la faute était un signe dans la formule écrite à l''envers. {staff} n''a pas modifié le manuscrit, il a seulement glissé un marqueur de papier dans cette page, en notant quelle ligne et quel signe.'
        p3: 'Début décembre, Boole tomba malade à la maison et sa famille se relaya à son chevet, plusieurs nuits sans dormir. {staff} a pris en charge le quart de nuit selon les besoins des soins infirmiers, l''allumant à l''heure, lui donnant de l''eau, rentrant la couverture et écrivant sur une feuille tout ce qui s''est passé pendant la nuit. La famille a laissé la lampe allumée et s’est endormie pendant quelques heures. Lorsqu''ils revinrent avant l''aube, le feu allait toujours bien et le drap du chevet était rempli des heures de la nuit.'
      excerpts:
        p3: 'La famille a laissé la lampe allumée et s’est endormie pendant quelques heures. Lorsqu''ils revinrent avant l''aube, le feu allait toujours bien et le drap du chevet était rempli des heures de la nuit.'
        p2: 'À un endroit, les chiffres ne concordaient pas ; tracée vers le haut, la faute était un signe dans la formule écrite à l''envers. {staff} n''a pas modifié le manuscrit, il a seulement glissé un marqueur de papier dans cette page, en notant quelle ligne et quel signe.'
        p1: 'Quand Boole entra, son manteau était dégoulinant et il ouvrit le tiroir pour trouver les notes sèches. Il les étala, s''essuya les mains avec sa manche et commença.'
    relic: 'Une page de logique'
    relic_desc: 'Un exercice en classe montrant ce qui se passe lorsque la même sélection est appliquée deux fois.'
    points:
      p1: 'Faites sécher les notes de cours à l''université avant que Boole ne parte sous une pluie battante et respectez son horaire de cours.'
      p2: 'Comparez le tableau avec la formule qui l''a produit et marquez le signe pour la prochaine personne qui vérifiera le manuscrit.'
      p3: 'Trouvez quelqu''un pour assurer la garde du soir afin que la famille au chevet de Boole puisse faire une pause'
