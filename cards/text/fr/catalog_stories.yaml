        p2: 'Des gens qui connaissent Hua Tuo l''accompagnent. Ce n''est qu''après avoir dépassé la prison qu''ils tournent lentement au premier virage.'
        p1: 'Le livre reste avec la personne qui l''a pris. Le tissu est toujours noué, le dos pressant une ligne dans le pli.'
      none: 'Le gardien ferme le registre. Le papier a commencé à s''enrouler. La page destinée à toute personne réclamant le livre reste vide.'
