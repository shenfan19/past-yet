        p1: 'Dans la nuit du 27 février, la lettre était rédigée ; il quadrilla les feuilles une à une, les plia et les mit dans l''enveloppe. Le collègue qui partageait sa lampe dormait déjà et la mèche brûlait encore.'
        p2: 'Ce soir-là, le pot de riz était de nouveau plein à ras bord. Ramanujan était assis sur le marchepied près de la porte, l''ardoise sur les genoux, écrivant trait après trait.'
    relic: 'Une ardoise'
    relic_desc: 'Une ardoise scolaire, essuyée et écrite plusieurs fois.'
    points:
