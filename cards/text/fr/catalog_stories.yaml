      p2: 'Faire en sorte que les travaux de laboratoire déjà convenus soient inscrits sur une liste blanche, à l''exception des travaux de tour toujours en attente d''offres, et remettre au contremaître un compte distinct pour chacun.'
      p3: 'Aidez Tesla à proposer des paiements échelonnés en utilisant les coûts confirmés, avec son propre engagement pour la prochaine étape des travaux de fondation'
    points_fail:
