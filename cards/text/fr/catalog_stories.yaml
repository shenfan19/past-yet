  david_fleay_healesville:
    name: 'Attendre que Corrie sorte d’elle-même'
    place: 'Sanctuaire de Healesville, Victoria'
    figure: 'David Fleay'
    story: 'À la fin de 1943, Jill, un ornithorynque du sanctuaire de Healesville, a fait éclore un jeune nommé plus tard Corrie. David Fleay et son équipe ont confirmé la naissance en janvier 1944 lorsqu''ils ont ouvert le nid. Le 26 février, il a observé pour la première fois Corrie sortir nager.'
    story_prose:
      opening:
        - 'Le sol est encore mou au terrier de Healesville. David Fleay a ouvert l''espace d''observation pour examiner Corrie, la jeune ornithorynque, avant de la ramener au nid de Jill. La botte d’un gardien s’arrête au bord qui s’effondre.'
        - 'Corrie a été le premier ornithorynque élevé avec succès en captivité. Le 26 février 1944, Fleay la vit pour la première fois quitter le terrier de son propre chef. L’apparition publique du mois de mars a apporté des piques à l’enceinte. Ici, vous pouvez l''aider à prendre soin de vous et demander à la foule d''attendre.'
        - 'Un voyageur qui surveille la banque peut aider Fleay à garder l''ouverture dégagée. Quelqu''un qui prête attention aux animaux peut laisser des feuilles de nidification à Jill pour qu''elles les récupèrent. Pour l''apparition publique, envoyez quelqu''un qui puisse persuader les gardiens de poser leur pique.'
      points:
        p1: 'Vous faites signe au gardien de rester en retrait. Lorsque la botte s''arrête, des miettes de terre glissent sur le bord. Vous stabilisez la planche au bord pendant que Fleay ramène Corrie au nid. Fleay attend que les choses se calment intérieurement avant de retirer sa main.'
        p2: 'Le gardien porte une brassée de feuilles vers le terrier. Vous lui montrez les bas-fonds où Jill sortait habituellement la nuit précédente et lui demandez d''y laisser les feuilles. Vous vous éloignez tous les deux alors qu’il fait encore jour. Jill sort avec des feuilles dans sa facture et se retourne vers la banque.'
        p3: 'Quelqu''un a vérifié sa montre trois fois et un gardien amène une pelle sur le rail. Vous demandez à Fleay si le panneau peut simplement dire d''attendre Corrie. Un enfant devant laisse la place à quelqu''un derrière pour voir l''eau. Le gardien range le pique. Lorsque le projet de loi de Corrie apparaît, même les gens du chemin de fer restent silencieux.'
      outcomes:
        all: 'Corrie sort du terrier à la nage. Le sanctuaire a son aspect public, et la berge à côté du rail n''a pas de nouvelles marques de bêche.'
        p1: 'Au moment où la planche se détache, Corrie est de retour dans le nid. Ce voyage préserve le record d''élevage précoce.'
        p2: 'Il y a moins de feuilles au bord de l’eau. Le gardien sort sa botte de la boue et quitte la berge sans être dérangé.'
        p3: 'La foule voit Corrie sortir d''elle-même. Le procès-verbal constate la comparution avec les piques rangés.'
      none: 'Les feuilles restent là où elles étaient. Certains visiteurs attendent là où ils peuvent encore voir le dernier retour à la maison.'
      not_admitted: 'Un gardien demande au visiteur d''attendre à l''extérieur du rail. Personne ne vient vous chercher avant la fermeture.'
      desync: 'La terre meuble bloque l''ouverture avant que Fleay puisse ramener le jeune animal. Le dossier historique d''élevage n''est plus synchronisé et le bureau rappelle le voyageur.'
      excerpts:
        p1: 'Vous stabilisez la planche au bord pendant que Fleay ramène Corrie au nid. Fleay attend que les choses se calment intérieurement avant de retirer sa main.'
        p2: 'Vous vous éloignez tous les deux alors qu’il fait encore jour. Jill sort avec des feuilles dans sa facture et se retourne vers la banque.'
        p3: 'Le gardien range le pique. Lorsque le projet de loi de Corrie apparaît, même les gens du chemin de fer restent silencieux.'
    relic: 'Une cuillère à nourriture en bois'
    relic_desc: 'Une petite pelle en bois avec un manche usé.'
    points:
      p1: 'Gardez la terre meuble à l''écart de l''ouverture suffisamment longtemps pour que Fleay puisse ramener Corrie dans le terrier.'
      p2: 'Demandez aux gardiens de laisser des feuilles fraîches près de la piscine où Jill pourra les rassembler après la tombée de la nuit.'
      p3: 'Persuader le sanctuaire de laisser le terrier fermé lorsque Corrie se cache le jour de l''exposition familiale'
    points_fail:
      p1: 'De la terre meuble recouvre l''ouverture avant que Fleay puisse ramener Corrie en toute sécurité. Le premier élevage réussi n’est plus en phase avec l’histoire et le bureau rappelle {staff} ce jour-là.'
      p2: 'Les gardiens quittent la zone telle quelle. Jill devra ramasser des feuilles plus loin le long de la berge.'
      p3: 'Le temps annoncé passe et le sanctuaire recourt aux pelles. Au moment où Corrie sort, la plupart des visiteurs sont partis.'
    shift:
      p1:
        was: 'Le 3 janvier 1944, Fleay ramena le jeune ornithorynque dans le nid perturbé et Jill continua à l''élever.'
      p2:
        was: 'Fleay rapporte que Jill a poussé du matériel de nidification et de la terre après l''ouverture du terrier.'
        now: 'Dans cette succursale, {staff} demande aux gardiens de laisser les feuilles à portée de la piscine. Jill peut les rassembler la nuit tombée sans que personne n''ouvre à nouveau son terrier.'
      p3:
        was: 'En mars 1944, Corrie s''est retirée dans les tunnels pendant l''exposition familiale annoncée et a été déterrée après le départ de la plupart des visiteurs.'
        now: 'Dans cette branche, {staff} montre aux gardiens les observations du soir et leur fait poser les pelles. Les visiteurs encore présents peuvent attendre au bord de la piscine ou revenir un autre jour.'
  archimedes_syracuse:
    name: 'Le jour où la ville est tombée'
    place: 'Syracuse, Sicile'
    figure: 'Archimède'
    story: 'Archimède a conçu des machines pour aider à défendre Syracuse pendant le siège romain. Lorsque la ville tomba en 212 avant JC, il fut tué. Plutarque donne plusieurs versions de la façon dont cela s''est produit.'
    story_prose:
      opening:
        - 'Les cris des rues s’arrêtent le jour de la chute de Syracuse. Un voisin se tient à l''intérieur avec une tablette écritoire et vous demande si vous êtes venu chercher l''homme plus âgé qui dessine des personnages. Archimède lui a un jour emprunté une planche.'
        - 'Archimède a été tué lorsque les forces romaines ont pris Syracuse. Les récits anciens diffèrent sur les circonstances. Dans cette branche, vous pouvez le trouver et rester avec lui jusqu''à ce qu''il trouve un endroit où passer la nuit.'
        - 'Envoyez un voyageur capable de le reconnaître et demandez aux voisins où il est allé. Il peut décider lui-même quoi faire de sa planche à dessin.'
      points:
        p1: 'Archimède tourne le tableau d''un demi-cercle et dit qu''il lui faut encore une ligne. Vous lui montrez l’ancienne tablette du voisin pour qu’il sache que quelqu’un à l’extérieur peut porter le dessin. Il tapote une fois le cadre avec son doigt et le lui tend. Dans la pièce où il doit séjourner, il demande d''abord si le tableau est également arrivé.'
      outcomes:
        all: 'Après la chute de la ville, on trouve encore des nouvelles d''Archimède dans cette branche. Quelqu''un dans la maison place sa planche à côté d''un tabouret où il peut s''asseoir.'
        p1: 'Vous restez avec lui jusqu''à ce qu''il atteigne un abri. Il soulève la couverture du tableau et peut encore terminer la dernière ligne.'
      none: 'Les voisins apprennent qu''Archimède a été tué lors de la chute de la ville. Les récits survivants différeront quant aux circonstances.'
      not_admitted: 'Le voisin garde le visiteur dehors. Quelqu''un prend une planche dans l''entrée avant que vous puissiez lire le nom dessus.'
      excerpts:
        p1: 'Il tapote une fois le cadre avec son doigt et le lui tend. Dans la pièce où il doit séjourner, il demande d''abord si le tableau est également arrivé.'
    relic: 'Une tablette à dessin en cire'
    relic_desc: 'Une tablette d’entraînement marquée d’une ligne provenant de la maison du voisin fictif.'
    points:
      p1: 'Trouvez Archimède pendant que la ville tombe et restez avec lui jusqu''à ce qu''il atteigne un abri.'
    points_fail:
      p1: 'Lorsque vous retrouvez enfin les gens qui l''ont vu en dernier, ils vous disent qu''il a été tué lors de la chute de la ville.'
    shift:
      p1:
        was: 'Archimède fut tué lorsque les forces romaines prirent Syracuse en 212 avant JC. Les récits anciens diffèrent sur les circonstances.'
        now: 'Dans cette branche, Syracuse tombe encore. Archimède atteint un abri avec {staff} et survit.'
        who: 'archimedes_syracuse'
        bio: 'Dans cette chronologie, Archimède a survécu à la chute de Syracuse en 212 avant JC et a survécu.'
    vignettes:
      load: '{staff} place l''ancien tableau sous le plus récent et demande quel dessin doit rester lisible. Le voisin montre la cire encore exposée.'
      settle: 'Le voisin commence à retirer le tableau d’écriture du tabouret. {staff} lui demande de laisser un endroit où quelqu''un puisse s''asseoir à côté.'
      crown: '{staff} demande au voisin de décrire la planche qui lui a été prêtée. Le voisin trace avec deux doigts sa largeur.'
  hypatia_alexandria:
    name: 'Alexandrie, ce mois de mars'
    place: 'Alexandrie'
    figure: 'Hypatie'
    story: 'Au début de 415, Hypatie enseigne encore les mathématiques et la philosophie à Alexandrie, et les magistrats de la ville viennent l''entendre. Entre le préfet de la ville et une autre faction, une querelle s''aggrave de semaine en semaine, et elle y est entraînée par ses liens avec le préfet.'
    story_prose:
      opening:
        - 'L''enseignement du matin vient de se terminer à Alexandrie. Un étudiant laisse une bande de bois marquée sur la table et demande à Hypatia s''ils doivent venir dans la même pièce demain. Le discours dans la rue a changé. Elle avait eu l''intention d''enseigner ici comme d''habitude.'
        - 'Hypatie fut tuée à Alexandrie en mars 415. Des récits de l''Antiquité tardive témoignent également de sa réputation d''enseigner la philosophie en public. Cette branche peut lui donner une raison de changer ses projets et de rester avec quelqu''un disposé à la recevoir.'
        - 'Envoyez un voyageur qui pourra écouter ses élèves et discuter des nouveaux arrangements avec leur professeur. Elle doit se mettre d’accord sur l’endroit où aller et choisir quelqu’un pour reprendre les livres empruntés.'
      points:
        p1: 'Hypatie demande qui attend toujours un livre qu''elle a promis de prêter. Vous lui demandez de nommer quelqu''un qui peut gérer les prêts, puis expliquez quel ami lui a proposé une chambre. Elle écrit la question inachevée au dos de la bande de bois et la tend à l''élève toujours près de la table. Plus tard dans la journée, les livres sont toujours rendus et leur professeur est déjà chez son amie.'
      outcomes:
        all: 'Quelqu’un chez l’amie lui demande de terminer le problème. Cette branche a encore une trace de son enseignement en mars.'
        p1: 'Elle accepte de changer les plans de la journée et rejoint l’amie qui lui ouvre la porte. La table d''enseignement reste vide pendant un moment.'
      none: 'Un étudiant vient rendre la bande marquée et apprend qu''Hypatie a été tuée. Il le place là où il était assis pour la dernière leçon.'
      not_admitted: 'L''élève ferme la liste des emprunteurs de livres. Le nom du visiteur n’est jamais inscrit et le bandeau reste sur la table lorsque la porte se ferme.'
      excerpts:
        p1: 'Elle écrit la question inachevée au dos de la bande de bois et la tend à l''élève toujours près de la table. Plus tard dans la journée, les livres sont toujours rendus et leur professeur est déjà chez son amie.'
    relic: 'Une bande de bois marquée'
    relic_desc: 'Un support pédagogique fictif avec une partie d''un problème sur le dos.'
    points:
      p1: 'Avant le pire de ce mois de mars, persuadez-la de quitter Alexandrie pendant un moment, ou de prendre une autre route ce jour-là, et sauvez-la.'
    points_fail:
      p1: 'Elle parcourt la ville comme avant, et dans cette branche aussi, elle est tuée en mars.'
    shift:
