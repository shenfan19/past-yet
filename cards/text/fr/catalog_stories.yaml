    relic: 'Un modèle en plâtre'
    relic_desc: 'Un petit modèle suspendu d''un coffre-fort.'
    points:
      p1: 'Pendant que Gaudí est à l''hôpital, donnez à Domènec Sugranyes la liste des travaux en cours et les clés de l''atelier pour que la construction continue en juin'
      p2: 'Demander à Sugranyes de conserver en second lieu les photographies, les échelles et les dessins des principaux modèles en plâtre, avec une liste signée laissée en atelier.'
      p3: 'Le soir du 7 juin, lorsque le tramway renverse un vieil homme que personne ne reconnaît sur la Gran Via, emmenez immédiatement Gaudí à l''hôpital et sauvez-le.'
    points_fail:
      p1: 'L''atelier attend la signature de Gaudí et son collègue ne parvient pas à récupérer la liste des travaux en cours. La passation de pouvoir s''arrête et le bureau rappelle le salarié.'
      p2: 'Les photographies et dessins restent dans la même rangée de placards. Lorsque l''atelier est endommagé, le matériel de comparaison avec les modèles en plâtre est perdu.'
      p3: 'Pris pour un mendiant, il gît dans la rue au passage des taxis, arrive tardivement à un dispensaire puis à un hôpital et y meurt le 10 juin.'
    shift:
      p1:
        was: 'Un accident de tramway obligea Gaudí à l''hôpital en juin 1926, où il mourut. Son collègue Sugranyes prit en charge le bâtiment laissé inachevé par Gaudí.'
      p2:
        was: 'En 1936, une grande partie des dessins originaux et des modèles en plâtre de l’atelier furent perdus. Le projet s''est ensuite appuyé sur des fragments et des images publiées pour la reconstruction.'
        now: 'Dix ans plus tard, les placards des ateliers brûlent. L''équipe récupère un album et les dessins du deuxième site. Deux visages modèles qu’ils auraient autrement dû reconstituer à partir de fragments ont désormais des dimensions contemporaines à des fins de comparaison.'
      p3:
        was: 'Le 7 juin 1926, Gaudí fut heurté par un tramway sur la Gran Via. Sans papiers et avec des vêtements usés, il a été pris pour un mendiant et il est décédé à l''hôpital le 10 juin, à l''âge de soixante-treize ans.'
        now: '{staff} s''agenouille à côté de lui en une minute, dit qui il est et l''emmène directement chez un chirurgien. Gaudí se rétablit et retourne à l''atelier sur le chantier pendant encore quelques années.'
        who: 'gaudi_barcelona'
        bio: 'Gaudí survécut à l''accident de tramway de juin 1926. Il retourna à l''atelier sur le chantier et dirigea les travaux avec Sugranyes pendant encore plusieurs années.'
    vignettes:
      tram: 'Le 29 mai, {staff} parcourt la Gran Via à bord d''un tramway, debout sur la plate-forme arrière. Le conducteur dit que le pire dans son travail, ce ne sont pas les tarifs mais les gens qui traversent en lisant le journal, et il sonne à chaque coin de rue comme s''il grondait toute la rue.'
      stone: 'Le 1er juin, {staff} aide deux maçons du site à abaisser un bloc sculpté sur son lit de mortier. Quand le vent se lève, il siffle à travers les ouvertures de la tour au-dessus, et le jeune maçon jure qu''il frappe la même note chaque après-midi, et qu''il a commencé à fredonner.'
      water: 'Le 10 juillet, jour le plus chaud à ce jour, {staff} transporte des cruches pour le vendeur d''eau qui vient sur le site à midi. Elle dit que les tailleurs de pierre boivent un tonneau avant la cloche et se plaignent ensuite que l''eau a un goût de poussière, ce qui, souligne-t-elle, est dû au fait qu''ils le font.'
  kafka_kierling:
    name: 'Des épreuves au sanatorium'
    place: 'Kierling'
    figure: 'Franz Kafka'
    story: 'En mars 1924, la tuberculose atteint le larynx de Franz Kafka et la déglutition devient difficile. Le 19 avril, il se rend au sanatorium Hoffmann de Kierling près de Klosterneuburg, avec Dora Diamant ; On lui a dit de ne pas parler et il parlait principalement sur des bouts de papier. Vers le 6 mai, l''étudiant en médecine Robert Klopstock est venu l''aider à prendre soin de lui. Le 2 juin, il corrigeait encore les épreuves de son recueil A Hunger Artist. Il décède vers midi le 3 juin, à l''âge de quarante ans, et est enterré à Prague le 11 juin. Le livre de quatre nouvelles est sorti à Berlin fin août.'
    story_prose:
      opening:
        - 'Sanatorium Hoffmann à Kierling, près de Klosterneuburg, au nord de Vienne, mai 1924. Franz Kafka, quarante ans, est atteint de tuberculose et, depuis mars, elle a atteint son larynx, de sorte que la déglutition devient plus difficile. Il dispose d''une chambre avec un balcon donnant sur le jardin ; on lui dit de ne pas parler, il parle principalement sur de petits bouts de papier. Dora Diamant a une chambre d''amis et cuisine pour lui, et vers le 6 mai, l''étudiant en médecine Robert Klopstock est venu l''aider aux soins infirmiers. Il corrige encore les épreuves de son recueil A Hunger Artist, le dernier livre qu''il a lui-même réalisé.'
        - 'Dans le passé, avaler lui faisait tellement mal qu''il pouvait à peine manger, et son médecin lui injectait le nerf laryngé contre la douleur tous les huit à dix jours ; le 2 juin, il était encore en train de corriger des épreuves, et sa dernière lettre à ses parents, il était trop fatigué pour la terminer, et Dora la termina pour lui ; Il mourut le 3 juin vers midi et le livre ne sortit à Berlin qu''à la fin du mois d''août. Dans cette succursale, le sanatorium a un jardinier qui coupe les lilas et un garçon de courses qui porte les lettres, et la boulangerie du village a une femme boulangère.'
        - "Plusieurs types de personnes peuvent l'aider lors de ce voyage\_: quelqu'un qui connaît la médecine et qui porte des analgésiques, ou un médecin à l'esprit vif, pour soulager la douleur dans sa gorge\_; quelqu'un qui a conservé des archives ou lu des épreuves, avec un esprit vif, ou quelqu'un de méthodique ou vigilant avec une forte volonté, pour garder sa place chaque fois que la maladie interrompt le ressaisissement ; quelqu'un de formé en soins infirmiers, ou quelqu'un de gentil, patient ou méthodique, pour partager les courses et les lettres afin que ceux qui veillent puissent se reposer ; quelqu'un qui a tenu des archives ou lu des épreuves, avec rapidité et régularité, ou quelqu'un de méthodique avec une volonté plus forte encore, pour que l'éditeur berlinois relie un exemplaire et l'envoie en avance."
      outcomes:
        all: 'Le 3 juin vers midi, Kafka mourut à Kierling. Sur la petite table du balcon était posé l''exemplaire relié d''avance, une étroite bande de papier entre les pages, et à côté un bol vide.'
        p3: 'Le 3 juin vers midi, Kafka mourut à Kierling. Au cours de ces dernières semaines, les bols que Dora emportait étaient pour la plupart vides.'
        p4: 'Le 3 juin vers midi, Kafka mourut à Kierling. L''exemplaire relié d''avance restait sur la petite table du balcon, une étroite bande de papier entre les pages.'
        p2: 'Le 3 juin vers midi, Kafka mourut à Kierling. La table des tours est restée épinglée derrière la porte du couloir jusqu''au jour de leur départ, ses dernières cases encore vides.'
        p1: 'Le 3 juin vers midi, Kafka mourut à Kierling. Fin août, A Hunger Artist sortait à Berlin, ses quatre nouvelles imprimées telles qu''il les avait corrigées en dernier lieu.'
      none: 'Le 3 juin vers midi, Kafka mourut à Kierling, à l''âge de quarante ans. Une pile de bouts de papier inutilisés était laissée sur la petite table du balcon.'
      desync: 'Le 19 mai, les épreuves étaient à moitié corrigées lorsque le crayon tomba ; personne ne se rappelait à quelle ligne il s''était arrêté, et les pages corrigées étaient rassemblées parmi les autres. Lorsque le {staff} a été rappelé, le vent soufflait du balcon et renversait la première page.'
      not_admitted: '{staff} n''est jamais entré dans le sanatorium et n''est resté que quelques fois devant le bureau de poste en bas de la colline de Klosterneuburg. Chaque jour, le garçon de courses arrivait avec une brassée de lettres, et une grosse était adressée à Berlin.'
      points:
        p3: 'Le 11 mai, à midi, Dora apporte un bol de soupe. Kafka ramasse la cuillère, la repose, écrit quelques mots sur un bout de papier et le fait passer. {staff}, qui connaît la médecine, travaille avec le médecin sur la façon de soulager la douleur avant les repas, le chronomètre et seulement quand il a pris effet, il remet le bol devant lui. Kafka avale par très petites bouchées, s''arrêtant après chacune. Lorsqu''il en reste un peu moins de la moitié, il pose la cuillère sur le bord du bol, prend le crayon et écrit une autre ligne au dos du bordereau.'
        p1:
          class_lettered: 'L''après-midi du 19 mai, une pile de preuves repose sur la petite table du balcon. Au milieu de ses corrections, Kafka se met à tousser et le crayon tombe par terre. {staff}, habitué à travailler sur papier, prend le crayon, glisse une étroite bande de papier à côté de la ligne où il s''est arrêté, sépare les pages corrigées du reste en deux piles et pose dessus un presse-papier. Quand Kafka s''est reposé un moment, il tire lui-même la bandelette et continue de la corriger. Le vent soulève un coin d''une page laissé libre, et il tend la main et la maintient enfoncée.'
          trait_vigil: 'L''après-midi du 19 mai, une pile de preuves repose sur la petite table du balcon. Au milieu de ses corrections, Kafka se met à tousser et le crayon tombe par terre. {staff}, qui veillait à ses côtés, ramasse le crayon, glisse une étroite bande de papier à côté de la ligne où il s''est arrêté, sépare les pages corrigées du reste en deux piles et pose dessus un presse-papier. Quand Kafka s''est reposé un moment, il tire lui-même la bandelette et continue de la corriger. Le vent soulève un coin d''une page laissé libre, et il tend la main et la maintient enfoncée.'
          else: 'L''après-midi du 19 mai, une pile de preuves repose sur la petite table du balcon. Au milieu de ses corrections, Kafka se met à tousser et le crayon tombe par terre. {staff}, méthodique, ramasse le crayon, glisse une étroite bande de papier à côté de la ligne où il s''est arrêté, sépare les pages corrigées du reste en deux piles et pose dessus un presse-papier. Quand Kafka s''est reposé un moment, il tire lui-même la bandelette et continue de la corriger. Le vent soulève un coin d''une page laissé libre, et il tend la main et la maintient enfoncée.'
        p2:
          class_medical: 'Le 21 mai, une petite pile de lettres attend le courrier dans le couloir et Dora n''est pas sortie depuis des jours. {staff}, infirmière de formation, indique dans un tableau les heures pour prendre les lettres, descendre à la poste et s''asseoir avec lui, l''épingle derrière la porte du couloir et le remplit carré par carré, qui vient quand et qui part quand. L''après-midi c''est au tour de {staff} de s''asseoir dans la salle. Dora sort, fait le tour du jardin le long de la clôture et reste un moment sous les lilas.'
          else: 'Le 21 mai, une petite pile de lettres attend le courrier dans le couloir et Dora n''est pas sortie depuis des jours. {staff}, attentionné et patient, indique dans un tableau les heures pour prendre les lettres, descendre à la poste et s''asseoir avec lui, l''épingle derrière la porte du couloir et le remplit carré par carré, qui vient quand et qui part quand. L''après-midi c''est au tour de {staff} de s''asseoir dans la salle. Dora sort, fait le tour du jardin le long de la clôture et reste un moment sous les lilas.'
        p4:
          class_lettered: 'Le 26 mai, les feuilles corrigées sont reparties à Berlin et le livre ne sera imprimé que cet été. {staff}, habitué à la paperasse et aux méthodes des imprimeurs, écrit à l''éditeur de Berlin pour lui demander de relier d''abord les feuilles corrigées en un seul exemplaire et de l''envoyer par la poste, et joint les titres des quatre nouvelles dans l''ordre choisi par Kafka. Quelques jours plus tard, le garçon de courses transporte un colis raide jusqu''en haut de la colline. Kafka le met à genoux et tourne les pages une à une, et à la dernière histoire son doigt reste un moment sous le titre.'
          else: 'Le 26 mai, les feuilles corrigées sont reparties à Berlin et le livre ne sera imprimé que cet été. {staff}, méthodique, écrit à l''éditeur de Berlin pour lui demander de relier d''abord les feuilles corrigées en un seul exemplaire et de l''envoyer par la poste, et joint les titres des quatre nouvelles dans l''ordre choisi par Kafka. Quelques jours plus tard, le garçon de courses transporte un colis raide jusqu''en haut de la colline. Kafka le met à genoux et tourne les pages une à une, et à la dernière histoire son doigt reste un moment sous le titre.'
      excerpts:
        p4: 'Quelques jours plus tard, le garçon de courses transporte un colis raide jusqu''en haut de la colline. Kafka le met à genoux et tourne les pages une à une, et à la dernière histoire son doigt reste un moment sous le titre.'
        p3: 'Kafka avale par très petites bouchées, s''arrêtant après chacune. Lorsqu''il en reste un peu moins de la moitié, il pose la cuillère sur le bord du bol, prend le crayon et écrit une autre ligne au dos du bordereau.'
        p2: 'L''après-midi c''est au tour de {staff} de s''asseoir dans la salle. Dora sort, fait le tour du jardin le long de la clôture et reste un moment sous les lilas.'
        p1: 'Quand Kafka s''est reposé un moment, il tire lui-même la bandelette et continue de la corriger. Le vent soulève un coin d''une page laissé libre, et il tend la main et la maintient enfoncée.'
