      p2: 'Le vieux chanteur tombe malade avant que l''enseignement soit terminé, et dans cette branche, seule une partie de ces chants est transmise, comme auparavant.'
      p3: 'Comme dans l''histoire, il meurt en 1472, et dans cette branche il n''apprend jamais que plus tard les gens se souviendront de lui.'
    shift:
      p1:
        was: 'Nezahualcoyotl mourut en 1472 et Nezahualpilli, sept ans, fut choisi pour lui succéder.'
      p2:
        was: 'À la fin du XVIe siècle, certaines chansons portant son nom furent copiées dans un recueil de chansons ; qui les a chantés le premier, personne ne le sait.'
        now: 'L''apprenant a appris les chansons du début à la fin, puis les a enseignées à un de ses propres apprenants.'
      p3:
        was: 'Nezahualcoyotl mourut à Texcoco en 1472 ; les chansons liées à son nom ont été copiées dans un livre un siècle plus tard, et son visage sur le billet de cent pesos mexicain est apparu plus de cinq cents ans plus tard.'
        now: '{staff} s''est assis avec lui dans ses derniers jours et lui a raconté tout cela.'
    vignettes:
      voice: "{staff} laisse deux places sur une feuille d'entraînement lorsqu'un chanteur avance à une ligne qui commence par I\_: une pour le chanteur, une pour le nom de la chanson."
      drum: 'Le {staff} dispose d''une bande de rechange comme marqueur afin que les pages restent là où le prochain chanteur peut les atteindre lorsque le premier se tient debout.'
      later: '{staff} écrit de quel chanteur une réplique a été entendue et laisse ouverte la question de savoir qui l''a prononcée en premier.'
  ino_tadataka_ezo:
    name: 'Le détour que la ligne a effacé'
    place: 'Hokkaidō'
    figure: 'Ino Tadataka'
    story: 'Le 11 juin 1800, Ino Tadataka quitta Edo pour sa première enquête. Le groupe mesura sa route vers le nord à travers le Tōhoku, traversa jusqu''à Ezo et suivit la côte jusqu''à Nishibetsu avant de faire demi-tour. L''ensemble de l''expédition, et pas seulement l''étude de l''île, a duré environ six mois. Ino mourut en 1818. Ses collègues achevèrent l''atlas côtier en 1821.'
    story_prose:
      opening:
        - 'Edo, 11 juin 1800. Ino Tadataka, cinquante-cinq ans, part avec son équipe d''arpentage, six personnes en tout, pour se diriger vers le nord, traverser le détroit jusqu''à Ezo et tracer une ligne le long de sa côte. C''est sa première enquête. Plus tard, il parcourut les côtes de tout le Japon et, trois ans après sa mort, ses collègues achevèrent les cartes des côtes du Grand Japon.'
        - 'Dans l''histoire, le shogunat n''a donné qu''une modeste allocation, et la majeure partie du coût de la route provenait de sa propre poche ; cette enquête se faisait à pied, et la corde à mesurer n''arrivait qu''avec la seconde ; le groupe mesure le long de la côte sud d''Ezo jusqu''à Nishibetsu, puis fait demi-tour par le même itinéraire. Dans cette branche, un porteur du groupe compte les pas à haute voix, et un pêcheur sur le rivage sait où tourne la côte.'
        - "Plusieurs types de personnes peuvent aider au cours de ce voyage\_: quelqu'un qui peut tenir des comptes ou qui a fait du commerce, pour tenir le coup lorsque l'argent vient à manquer, ou quelqu'un d'ordre et robuste, ou quelqu'un qui possède un synthétiseur de nutriments\_; quelqu'un qui a fait de la menuiserie, de la construction de bateaux ou de la réparation de filets, ou qui connaît l'ingénierie, ou qui est habile et prudent, pour mesurer exactement un tronçon de route\_; quelqu'un de très dur et habitué aux longues routes, quelqu'un qui connaît la navigation, le vol ou la géologie, ou quelqu'un avec un drone éclaireur."
      outcomes:
        all: 'Cet hiver-là, le groupe revint à Edo, cent quatre-vingts jours après son départ. Sur les draps qu''il rapportait, la côte d''Ezo s''étendait au-delà de Nishibetsu, et à côté des chiffres pour un tronçon il y avait une note indiquant qu''elle avait été mesurée avec une corde.'
        p3: 'Cet hiver-là, la fête revint à Edo. Sur la feuille, le littoral s''étendait un peu au-delà de Nishibetsu et se terminait par un petit promontoire.'
        p2: 'Cet hiver-là, la fête revint à Edo. Sur la feuille, un tronçon de côte avait ses pas et sa mesure au cordon écrits côte à côte ; Lors de l''enquête suivante, le groupe a pris une corde à mesurer.'
        p1: 'Cet hiver-là, le groupe revint à Edo par le même chemin, cent quatre-vingts jours après son départ. L''équipe de mesure l''a accompagné dans plusieurs voyages plus longs.'
      none: 'Fin août, la bourse était vide et le groupe fit ses valises et rebroussa chemin devant Nishibetsu. Le décompte du porteur est devenu plus silencieux tout au long du trajet et les dernières lignes de la feuille de pointage sont restées vierges.'
      desync: 'À la fin du mois d''août, l''argent s''est épuisé et le groupe a rebroussé chemin devant Nishibetsu. Lorsque le {staff} a été rappelé, la tige de mesure était encore debout dans le sable à mi-chemin et la marée montante en avait remonté plus de la moitié.'
      not_admitted: '{staff} n''a jamais participé à l''équipe d''enquête et a aidé le pêcheur à remonter ses filets à plusieurs reprises. Pendant qu''il parlait de l''orientation de la côte, une file de personnes plus à l''est, le long du sable, comptait son chemin hors de vue.'
      points:
        p2:
          class_seafaring: 'Août, sur la côte sud-est d''Ezo. Le groupe mesurait pas à pas comme auparavant, le porteur comptant à haute voix, mais sur le sable et les galets, le même tronçon parcouru deux fois ne donnait jamais le même compte. {staff}, habitué à faire des nœuds à bord du navire, sortait une bobine de corde fine, y faisait un nœud à chaque intervalle, vérifiait les espaces entre les nœuds avec le bâton de mesure et, avec le porteur à l''autre extrémité, le tirait tout droit le long du rivage. Ino a écrit la mesure du cordon à côté du nombre de pas et a tracé une courte ligne entre les deux rangées de chiffres. Le porteur enroulait la corde autour de son bras, les nœuds glissant un à un entre ses doigts.'
          class_craft: 'Août, sur la côte sud-est d''Ezo. Le groupe mesurait pas à pas comme auparavant, le porteur comptant à haute voix, mais sur le sable et les galets, le même tronçon parcouru deux fois ne donnait jamais le même compte. {staff}, habitué à travailler à la main, tordait une longueur de corde fine, y faisait un nœud à chaque intervalle, vérifiait les espaces entre les nœuds avec le bâton de mesure et, avec le porteur à l''autre extrémité, la tirait tout droit le long du rivage. Ino a écrit la mesure du cordon à côté du nombre de pas et a tracé une courte ligne entre les deux rangées de chiffres. Le porteur enroulait la corde autour de son bras, les nœuds glissant un à un entre ses doigts.'
          else: 'Août, sur la côte sud-est d''Ezo. Le groupe mesurait pas à pas comme auparavant, le porteur comptant à haute voix, mais sur le sable et les galets, le même tronçon parcouru deux fois ne donnait jamais le même compte. {staff} a sorti une bobine de corde nouée, a vérifié les espaces entre les nœuds un par un avec la tige de mesure et, avec le porteur à l''autre extrémité, l''a tirée tout droit le long du rivage. Ino a écrit la mesure du cordon à côté du nombre de pas et a tracé une courte ligne entre les deux rangées de chiffres. Le porteur enroulait la corde autour de son bras, les nœuds glissant un à un entre ses doigts.'
        p1:
          class_lettered: 'Fin août, la bourse était presque vide. L''allocation du shogunat n''avait jamais été importante, le reste du coût sortait de la propre poche d''Ino, et Nishibetsu était encore à quelques jours. {staff}, habitué au travail de bureau, étalait l''argent qui restait pièce par pièce, notait chaque nuit d''hébergement et chaque repas à venir, et cernait les articles sur lesquels on pouvait économiser. La fête s''est déroulée comme avant. Le jour où ils atteignirent Nishibetsu, le porteur compta le dernier tronçon et sa voix disparut. Ino poussa le bâton de mesure dans le sable et écrivit le mot Nishibetsu sur la dernière ligne de la feuille de pointage.'
          class_trade: 'Fin août, la bourse était presque vide. L''allocation du shogunat n''avait jamais été importante, le reste du coût sortait de la propre poche d''Ino, et Nishibetsu était encore à quelques jours. {staff}, qui avait fait du commerce, se rendit au village de pêcheurs pour négocier, échangea du riz contre quelques jours de poisson séché et fit baisser le prix de leur logement. La fête s''est déroulée comme avant. Le jour où ils atteignirent Nishibetsu, le porteur compta le dernier tronçon et sa voix disparut. Ino poussa le bâton de mesure dans le sable et écrivit le mot Nishibetsu sur la dernière ligne de la feuille de pointage.'
          else: 'Fin août, la bourse était presque vide. L''allocation du shogunat n''avait jamais été importante, le reste du coût sortait de la propre poche d''Ino, et Nishibetsu était encore à quelques jours. {staff} a divisé la nourriture qui restait en petits paquets, un pour chaque jour, en a distribué un chaque matin et n''a pas mangé plus que cette part. La fête s''est déroulée comme avant. Le jour où ils atteignirent Nishibetsu, le porteur compta le dernier tronçon et sa voix disparut. Ino poussa le bâton de mesure dans le sable et écrivit le mot Nishibetsu sur la dernière ligne de la feuille de pointage.'
        p3:
          class_seafaring: 'Début septembre, le groupe avait atteint Nishibetsu, où il était prévu de faire demi-tour. Le vent d''automne devenait chaque jour plus fort et la côte à l''est s''étendait sans mesure. {staff}, habitué à lire le ciel et les marées en mer, lui montra quel promontoire pouvait être contourné et quand la marée descendrait, et conduisit le groupe le long du rivage. Le groupe dépassa Nishibetsu et mesura un tronçon supplémentaire. Le pêcheur se tenait sur un rocher et désignait l''endroit où la côte tournait, et Ino s''arrêta là et prit un autre relèvement. La première nuit du chemin du retour, il étendit le drap supplémentaire sur ses genoux et traça lentement cette partie de la côte avec son doigt.'
          else: 'Début septembre, le groupe avait atteint Nishibetsu, où il était prévu de faire demi-tour. Le vent d''automne devenait chaque jour plus fort et la côte à l''est s''étendait sans mesure. {staff}, fort sur la route, est parti en tête avec un peloton pour repérer un tronçon, et est revenu dessiner dans le sable où ils pourraient s''arrêter et où une rivière pourrait être traversée. Le groupe dépassa Nishibetsu et mesura un tronçon supplémentaire. Le pêcheur se tenait sur un rocher et désignait l''endroit où la côte tournait, et Ino s''arrêta là et prit un autre relèvement. La première nuit du chemin du retour, il étendit le drap supplémentaire sur ses genoux et traça lentement cette partie de la côte avec son doigt.'
      excerpts:
        p3: 'Le pêcheur se tenait sur un rocher et désignait l''endroit où la côte tournait, et Ino s''arrêta là et prit un autre relèvement. La première nuit du chemin du retour, il étendit le drap supplémentaire sur ses genoux et traça lentement cette partie de la côte avec son doigt.'
