ui:
  welcome:
    story: "Vous dirigez une agence de voyage dans le temps, envoyez des employés dans le passé et lisez leurs rapports à leur retour. Préservez les moments décisifs et réparez ce que l’histoire a laissé en suspens pour réunir assez d’énergie temporelle et rentrer chez vous."
    story_start: L’histoire s’ouvre devant la statue en bronze du Dr Sun Yat-sen, à l’université qui porte son nom, en hommage au 160e anniversaire de sa naissance.
    disclaimer_title: Avertissement
