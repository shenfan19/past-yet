    event_titles:
      asked_the_way: 'Demandé le chemin'
    plots: {}
    encyclopedia:
      history:
        - text: 'Le 4 février 1924, Sun Yat-sen ordonna à l''École nationale supérieure normale, à l''École de droit et de politique du Guangdong et à l''École d''agriculture du Guangdong de se joindre à l''Université nationale du Guangdong et nomma Zou Lu pour la préparer.'
          check: true
        - text: 'Du 27 janvier au 24 août 1924, Sun donna des conférences le dimanche dans la salle de l''École normale supérieure, soit seize conférences en tout. Huang Changgu a pris chacun d''entre eux, Zou Lu a lu les copies nettes et y a collé des bordereaux, et Sun les a corrigés de sa propre main.'
          check: true
        - text: 'Zou Lu a repris la préparation le 21 février. Le 24 février, il a réuni les élèves des trois écoles dans la salle pour l''annoncer, et la première réunion préparatoire a eu lieu le 3 mars, avec à l''ordre du jour la remise des diplômes aux élèves des trois écoles.'
          check: true
        - text: 'Les premières conférences ont été imprimées sous forme de brochure fin mars, avec une préface écrite par Sun le 30 mars. Le 3 juin, Zou Lu a soumis les mesures d''adhésion aux écoles, et elles ont été approuvées le 6 juin.'
          check: true
        - text: 'Les cours ont commencé le 19 septembre et la cérémonie de fondation a eu lieu le 11 novembre avec la devise écrite par Sun. Sun mourut à Pékin le 12 mars 1925 et, en 1926, l''université fut rebaptisée Université nationale Sun Yat-sen.'
          check: true
      regret:
        - 'Vous partez le 1er septembre. Les cours commencent le 19 et la devise est écrite après cela.'
        - 'Les cours s''arrêtèrent au seizième. Personne dans la salle ne savait que c''était la dernière.'
    events:
      asked_the_way: '{date} : Un nouvel étudiant avec une lettre demande à {staff} le chemin d''un bureau. {staff} ne le sait pas non plus, et ils le recherchent ensemble pendant la moitié de la matinée.'
      asked_the_way_shown: '{date} : Un nouvel étudiant avec une lettre demande à {staff} le chemin d''un bureau. {staff} le montre sur la feuille, l''élève le remercie et repart avec la feuille en main.'
    quotes:
      near_death:
        - text: 'Je pensais pouvoir tenir encore un peu.'
      stay_and_gifts:
        - trait: 'gentil'
          text: 'Je me souviens de chacun de leurs noms. Je veux rester un moment.'
        - text: 'Ils ont besoin de monde ici.'
      gave_up:
        - trait: 'le mal du pays'
          text: 'Je veux rentrer à la maison. C''est tout.'
        - text: 'Sept mois, c''est trop long.'
      legend:
        - trait: 'curieux'
          text: 'C’est ainsi qu’un livre est fait, une page corrigée à la fois.'
        - text: 'Quand je suis parti, ils n’avaient pas encore commencé les cours.'
      perfect:
        - trait: 'gentil'
          text: 'Les gens qui sont venus demander ont finalement reçu une réponse.'
        - text: 'J''ai fait ce qu''il fallait faire.'
      modest:
        - trait: 'désinvolte'
          text: 'J''ai dit que le nom changerait dans deux ans. Personne ne m''a cru.'
        - text: 'J''étais seulement là.'
    hints:
      low_luck: 'La chance apporte une introduction opportune aux trois écoles.'
      low_wit: 'Le bureau confie le processus de notification à un employé suffisamment intelligent. Une puce neuronale cyborg aide.'
      low_finesse: 'Le bureau cherche une main ferme avec les documents avant de confier les trois listes à quelqu''un.'
      low_will: 'Le bureau recherche la volonté de parcourir tous les sites proposés. Un poumon bionique cyborg aide.'
      low_constitution: 'L''équipage recherche quelqu''un avec la constitution nécessaire pour la marche et le travail à Shipai. Un poumon bionique cyborg aide.'
      none: 'Changez une chose et renvoyez-la avec la même graine, cela rend la comparaison la plus claire.'
quotes:
  sun_motto: {who: 'Sun Yat-sen', quote: 'Étudier largement, s''enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance.', occasion: 'la devise qu''il écrivit pour l''Université nationale du Guangdong'}
  sun_great_things: {who: 'Sun Yat-sen', quote: 'Je vous engage à vous fixer pour but de faire de grandes choses, et non de devenir de grands fonctionnaires.', occasion: 'discours aux étudiants de l''université Lingnan'}
