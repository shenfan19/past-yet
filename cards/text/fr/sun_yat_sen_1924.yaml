eras:
  sun_yat_sen_1924:
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salle de l’École normale supérieure"
    blurb: "Dans une même salle, deux choses prennent forme : une université et un livre. Sept mois séparent l’ordre de réunir les écoles de votre départ, dix-huit jours avant la rentrée. C’est ici que le jeu commence."
    handle_label: "Les notes deviennent un livre"
    protagonist_role: "Un homme d’État qui a ordonné de réunir trois écoles en une université et donne des conférences le dimanche dans leur salle"
    stay: "Rester sept jours au bureau, soit 210 jours dans le passé"
    plan_baseline: "Chronologie d’origine"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} tombe malade à Guangzhou. Le talisman de rappel le ramène, et le réveil a lieu devant la statue."
      stay_and_gifts: "Le travail terminé, {staff} ne revient pas. Une note explique que le voyage se poursuit pour voir l’université ouvrir. Des cadeaux arriveront plus tard."
      gave_up: "{staff} n’a pas tenu jusqu’au bout. Au réveil devant la statue, le constat est simple : rester plus longtemps dans le Guangzhou de 1924 n’était plus possible."
      legend: "Au réveil devant la statue, {staff} trouve parmi ses affaires une brochure imprimée en mars 1924. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      perfect: "{staff} revient devant la statue. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      modest: "{staff} a passé deux cent dix jours à Guangzhou, a fait ce qui était à sa portée et se retrouve devant la statue. Au départ, il restait {countdown:i} jours avant la rentrée."
    star_points:
      site: "Remettre au bureau un plan des sites avant le choix du nouveau campus"
      copy: "Rapporter un exemplaire du recueil des conférences"
      last: "Assister à la dernière conférence"
