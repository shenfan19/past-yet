eras:
  sun_yat_sen_1924:
    story_prose:
      opening:
        - 'Guangzhou, le 4 février 1924. Sun Yat-sen ordonne de réunir trois écoles pour former l’Université nationale du Guangdong et charge Zou Lu des préparatifs. Les élèves sont encore dans leurs écoles. Il faut s’occuper des inscriptions, de la remise des diplômes et du nouveau terrain.'
        - 'Dans l’histoire, l’université ouvre la même année, mais les travaux à Shipai ne commencent que neuf ans plus tard. Sun ne les voit pas. Dans cette branche, le bureau préparatoire avance une chaise près d’une table où les trois écoles ont apporté leurs papiers.'
        - 'Il faut savoir se repérer, demander à chaque école ce qui lui manque et vérifier des noms. Quelqu’un doit parcourir les terrains envisagés. L’équipe de Shipai a besoin de deux mains pour tenir les bornes.'
      points:
        xue: 'Le bureau prépare les avis d’inscription pour les environs de la ville. {staff} barre un détour près du bac et entoure les carrefours et les débarcadères. Le messager pose le plan sur les avis et plie le paquet en deux puis en quatre. Le pli traverse la rivière et laisse voir un demi-cercle au débarcadère.'
        wen: 'Un employé présente {staff} à des gens des trois écoles. Avant la réunion, {staff} rassemble sur une seule feuille ce qui manque aux professeurs et ce qui inquiète les élèves. Trois piles occupent déjà la table. L’employé en retire la nouvelle feuille et la pose en travers des trois.'
        si: '{staff} visite les terrains à pied jusqu’à Shipai, à l’est, puis indique leurs accès sur un seul plan. De retour au bureau, le papier s’enroule dès qu’on le déplie. {staff} maintient l’est du plan du bout des doigts et rapproche le coin de la lampe.'
        bian: 'Plusieurs noms ne concordent pas d’une liste de diplômés à l’autre. {staff} reprend les originaux, vérifie chaque nom et réunit les trois listes dans un registre. Avant de le remettre, {staff} compte encore une fois les pages. Sur la dernière feuille, l’encre de la ligne vérifiée est la plus sombre.'
        xing: 'Il manque deux bras à l’équipe qui part borner le terrain à Shipai. {staff} tient les bornes pendant qu’on les enfonce, puis longe une dernière fois la limite. À la dernière borne, {staff} retire ses mains couvertes de boue. De là, les premières bornes sont encore alignées.'
      outcomes:
        all: 'De retour à l’agence, on peut lire la devise rédigée pour la cérémonie de novembre. Quelqu’un en pose une copie à côté du relevé des cinq tâches, cinq lignes face à cinq plis.'
        xing: 'Les bornes de Shipai sont en place avant que Sun quitte Guangzhou. Plus tard, un passant les suit du regard, l’une après l’autre.'
        bian: 'En préparant la remise des diplômes, l’employé retrouve le nom dans un seul registre. Quand la page tourne, l’encre près de la reliure est encore plus sombre.'
        si: 'Un plan des terrains reste sous les papiers du bureau. Après avoir vérifié le chemin de Shipai, quelqu’un replie le papier dans ses plis.'
        xue: 'À l’ouverture des inscriptions, des avis sont aussi affichés hors de la ville. Au débarcadère, quelqu’un s’arrête et lisse le bas de la feuille.'
        wen: 'À la réunion, les besoins des trois écoles tiennent sur une feuille. Elle est encore ouverte quand on la passe à la personne suivante.'
      none: 'Au soir, on entend encore tourner des feuilles. En passant devant la porte, {staff} voit la lumière sur le bas des feuilles.'
      not_admitted: '{staff} ne trouve pas de place au bureau préparatoire. Par la porte, on voit une chaise vide, bien rangée sous la table.'
      excerpts:
        xing: 'À la dernière borne, {staff} retire ses mains couvertes de boue. De là, les premières bornes sont encore alignées.'
        bian: 'Avant de le remettre, {staff} compte encore une fois les pages. Sur la dernière feuille, l’encre de la ligne vérifiée est la plus sombre.'
        si: 'De retour au bureau, le papier s’enroule dès qu’on le déplie. {staff} maintient l’est du plan du bout des doigts et rapproche le coin de la lampe.'
        xue: 'Le messager pose le plan sur les avis et plie le paquet en deux puis en quatre. Le pli traverse la rivière et laisse voir un demi-cercle au débarcadère.'
        wen: 'Trois piles occupent déjà la table. L’employé en retire la nouvelle feuille et la pose en travers des trois.'
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salle de l’École normale supérieure"
    blurb: "Trois écoles doivent former une seule université. Le bureau préparatoire confie chaque tâche à une personne qui sait la mener à bien. Chaque mission confiée et menée à terme rapporte une étoile."
    handle_label: "Les notes deviennent un livre"
    protagonist_role: "Un homme d’État qui a ordonné de réunir trois écoles en une université et donne des conférences le dimanche dans leur salle"
    stay: "Rester sept jours au bureau, soit 210 jours dans le passé"
    plan_baseline: "Chronologie d’origine"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} tombe malade à Guangzhou. Le talisman de rappel le ramène, et le réveil a lieu devant la statue."
      stay_and_gifts: "Le travail terminé, {staff} ne revient pas. Une note explique que le voyage se poursuit pour voir l’université ouvrir. Des cadeaux arriveront plus tard."
      gave_up: "{staff} n’a pas tenu jusqu’au bout. Au réveil devant la statue, le constat est simple : rester plus longtemps dans le Guangzhou de 1924 n’était plus possible."
      legend: "Au réveil devant la statue, {staff} trouve parmi ses affaires une brochure imprimée en mars 1924. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      perfect: "{staff} revient devant la statue. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      modest: "{staff} a passé deux cent dix jours à Guangzhou, a fait ce qui était à sa portée et se retrouve devant la statue. Au départ, il restait {countdown:i} jours avant la rentrée."
    star_points:
      xue: "Tracer un itinéraire pour afficher les avis d’inscription hors des murs et le remettre aux messagers"
      wen: "Visiter les trois écoles grâce à une recommandation et remettre une synthèse avant la première réunion"
      si: "Comparer les terrains envisagés et rendre une carte avant le choix de Shipai"
      bian: "Vérifier les listes des diplômés des trois écoles et remettre un registre unique pour le 21 juin"
      xing: "Rejoindre l’équipe à Shipai et planter les bornes du nouveau campus"
    points_fail:
      xue: 'Dans cette branche, l''avis n''est affiché qu''en ville, et les élèves du dehors l''apprennent quand les inscriptions ont déjà commencé.'
      wen: 'La première réunion préparatoire se tient comme dans l''histoire, chaque école ne parle encore que de ses propres soucis, et aucune liste ne les réunit.'
      si: 'Shipai est choisi comme dans l''histoire, et le bureau n''a aucune feuille où les sites soient dessinés ensemble.'
      bian: 'La remise des diplômes du 21 juin a lieu comme prévu. Le bureau doit consulter les trois listes séparément.'
      xing: 'Le terrain de Shipai n''est délimité que sur le papier, comme dans l''histoire, et pas un piquet n''y est planté.'
    shift:
      xue:
        was: '9 juin 1924 : l''Université nationale du Guangdong confie le recrutement aux bureaux provinciaux de l''éducation, et le 10 juin s''ouvrent les inscriptions à l''examen des classes préparatoires, avec 520 places prévues.'
        now: 'Dans cette branche, l''avis de recrutement est aussi affiché aux carrefours hors de la ville et sur les quais.'
      wen:
        was: '3 mars 1924 : la première réunion préparatoire se tient, et le premier point de son ordre du jour est la fin d''études des élèves des trois écoles.'
        now: 'Dans cette branche, une liste des difficultés des trois écoles est posée sur la table de la réunion.'
      si:
        was: '1924 : les écoles sont dispersées et difficiles à gérer, Sun Yat-sen charge Zou Lu de choisir un nouveau campus à Shipai, et le terrain est délimité dans l''année.'
        now: 'Dans cette branche, une carte des sites et de Shipai est jointe aux papiers du choix.'
      bian:
        was: '21 juin 1924 : Zou Lu prend ses fonctions de président de l''Université nationale du Guangdong, et la cérémonie de remise des diplômes des trois écoles a lieu le même jour.'
        now: 'Dans cette branche, le bureau dispose d’une seule liste vérifiée pour la cérémonie.'
      xing:
        was: '1924 : Sun Yat-sen fait choisir Shipai par Zou Lu pour le nouveau campus, mais la construction ne commence qu''en 1933 et les premiers collèges n''emménagent qu''à l''automne 1934. Sun meurt le 12 mars 1925 sans l''avoir vu.'
        now: 'Dans cette branche, avant qu''il ne quitte Canton en novembre, les bornes du terrain de Shipai sont déjà plantées, piquet après piquet.'
        who: sun_yat_sen_guangzhou
        bio: 'Dans cette ligne du temps, les bornes du nouveau campus de Shipai sont plantées avant que Sun Yat-sen ne quitte Canton.'
    shift_all: "Les cinq missions sont terminées. Avec le recul, elles font écho aux mots que Sun Yat-sen écrira pour la devise de l’université : étudier largement, s’enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance."
    milestones:
      adviser: "{date} — Le bureau préparatoire manque de bras. Un commis fait une place à {staff} et lui proposera des tâches à mesure qu’elles se présenteront."
      wen_ask: "{date} — Un commis connaît par chance des personnes disponibles dans les trois écoles. Il y envoie {staff} avec ses recommandations. De retour au bureau, {staff} remet une page qui réunit les préoccupations des enseignants et des élèves."
      xue_enrol: "{date} — Un commis voit que {staff} se repère vite sur les routes hors des murs. Il lui confie le trajet des avis d’inscription. {staff} marque les carrefours et les quais, puis remet le tracé et les avis aux messagers."
      bian_rolls: "{date} — Plusieurs noms divergent dans les trois listes des diplômés. Un commis qui connaît le soin de {staff} lui confie les dossiers. Après les avoir vérifiés sur les originaux, {staff} remet un seul registre pour la cérémonie."
      si_site: "{date} — Le bureau demande à {staff} de visiter tous les terrains envisagés, en ville et à Shipai. {staff} les parcourt et rapporte une carte qui indique l’accès à chacun."
      xing_shipai: "{date} — Il manque quelqu’un pour planter les bornes à Shipai. Un commis invite {staff}, qui peut faire le trajet et prêter main-forte. Sur place, {staff} tient les piquets pendant que l’équipe les enfonce, puis vérifie le tracé avec elle."
      order_given: '{date} : Sun Yat-sen ordonne que l''École nationale supérieure normale, l''École de droit et de politique du Guangdong et l''École d''agriculture du Guangdong soient réunies dans l''Université nationale du Guangdong et nomme Zou Lu pour la préparer. Personne dans la ville ne peut encore dire où se trouve cette université.'
      sun_dies: '{date} : Sun Yat-sen décède à Pékin.'
      renamed: '{date} : Le gouvernement national ordonne que l''Université nationale du Guangdong soit rebaptisée Université nationale Sun Yat-sen.'
      lecture_jan27: '{date} : Un dimanche. Sun Yat-sen donne la première de ses conférences sur les Trois principes du peuple dans le hall de l''École normale supérieure.'
      lecture_feb17: '{date} : Un dimanche. Sun Yat-sen donne une conférence dans le hall de l''École normale supérieure. La série a débuté le 27 janvier et il s''agit de la quatrième conférence. Sur le côté de l''estrade, un homme écrit sans lever les yeux. C''est Huang Changgu, qui est là pour tout le monde.'
      zou_takes_up: '{date} : Zou Lu reprend la préparation.'
      hall_feb24: '{date} : Encore un dimanche. La cinquième conférence est donnée dans la salle aujourd''hui, et Zou Lu réunit ici les étudiants des trois écoles pour annoncer la préparation.'
      first_meeting: '{date} : La première réunion préparatoire a lieu, avec à son ordre du jour la remise des diplômes des élèves des trois écoles. Sur les trente-cinq membres du comité préparatoire, trente et un ont étudié à l''étranger.'
      first_meeting_book: '{date} : La première réunion préparatoire a lieu, avec à son ordre du jour la remise des diplômes des élèves des trois écoles. Sur les trente-cinq membres du comité préparatoire, trente et un ont étudié à l''étranger. Dans cette branche, les noms des promotions des trois écoles figurent désormais dans un seul livre.'
      proofs_travel: 'Tout au long du mois de mars, le texte des conférences passe de main en main. Les notes de Huang Changgu sont copiées fidèlement et envoyées à Sun Yat-sen, il les fait porter à Zou Lu pour qu''il les lise, Zou Lu colle des bordereaux sur les pages et les renvoie, Sun les corrige de sa propre main, et elles reviennent.'
      preface: '{date} : Sun Yat-sen rédige la préface du pamphlet des premières conférences. Il est imprimé fin mars.'
      lecture_apr20: '{date} : Un dimanche. Les conférences dans la salle ont atteint leur deuxième partie.'
      measures_sent: '{date} : Zou Lu soumet les mesures pour rejoindre les trois écoles.'
      measures_approved: '{date} : Les mesures sont approuvées.'
      shipai_chosen: 'Cette année-là, Sun Yat-sen dit à Zou Lu de choisir un nouveau campus à Shipai, à l''est de la ville. Les écoles sont réparties sur plusieurs endroits et difficiles à gérer.'
      last_lecture: '{date} : La seizième conférence. La troisième partie n''en est qu''à sa quatrième leçon, et le reste n''est jamais donné. Personne dans la salle ne sait que c''est la dernière.'
      classes_begin: "{date}\_: Les cours commencent à l’Université nationale du Guangdong."
      ceremony: '{date} : La cérémonie de fondation a lieu, avec la devise écrite par Sun Yat-sen : étudiez largement, renseignez-vous attentivement, réfléchissez prudemment, discernez clairement, pratiquez sérieusement. Il n''est pas là et il quitte Guangzhou deux jours plus tard.'
      sunday_first: '{date} : {staff} est pressé tout au fond de la salle, loin de la plate-forme, capable de voir l''homme et incapable de tout entendre.'
      sunday_stall: '{date} : {staff} ne peut pas entrer dans le hall et installe un stand à la porte. Quand la salle se vide, la foule afflue et tout est vendu en un rien de temps.'
      sunday_sit: '{date} : {staff} trouve une place dans une rangée du fond de la salle et s''assoit du premier au dernier mot sans bouger.'
      records_begun: '{date} : {staff} commence à copier les dossiers des trois écoles dans un seul livre.'
      records_read_aloud: "{date}\_: Personne ne peut lire la main de {staff}. Ainsi, {staff} lit les noms et un employé écrit, et les trois enregistrements commencent à n'en faire qu'un."
      records_shut: '{date} : La copie des dossiers nécessite une lecture, et {staff} n''y participe pas, mais apprend à connaître les gardiens des trois écoles. Pour savoir qui est où, il est plus rapide de demander {staff} que de tourner les pages.'
      records_done: '{date} : Les dossiers des trois écoles forment un seul livre, avant la première réunion préparatoire.'
      records_late: '{date} : Les dossiers des trois écoles forment un seul livre. La première réunion préparatoire a déjà eu lieu.'
      sites_done: '{date} : {staff} a parcouru chacun des sites disséminés dans la ville et les a dessinés sur une seule feuille, avec le temps qu''il faut pour marcher de chacun à l''autre.'
      asked_inside: '{date} : Les commis ne laissent plus le {staff} attendre à la porte et les appellent.'
      copy_kept: "{date}\_: {staff} enveloppe le dépliant et le met avec ses affaires."
      exhausted: '{date} : {staff} est tellement fatigué que ses mains tremblent et doit se reposer.'
      spoiler: '{date} : {staff} sait que dans deux ans cette école prendra le nom de l''homme qui l''a commandée. {staff} écrit la phrase sur la dernière page du cahier et le ferme.'
      spoiler_said: '{date} : {staff} dit à un employé de son bureau de copie que dans deux ans cette école prendra le nom de l''homme qui l''a commandée. Le greffier ne lève pas les yeux. L''homme est toujours vivant, dit-il, et qui nomme ainsi une école.'
      errand: "{date}\_:\_Les pages sur lesquelles sont collés des bordereaux entrent et sortent de la salle de photocopie. {staff} est à l'extérieur et ne voit que le dos de celui qui le porte."
      errand_carried: '{date} : Dans cette branche, celui envoyé pour transporter les pages est une fois {staff}. Une liasse de papier sur laquelle sont collés des feuillets va d''un bout à l''autre, et pas une feuille n''est froissée.'
      errand_frail: '{date} : {staff} est essoufflé après quelques marches et ne peut pas transporter les pages, et s''assoit à la porte de la salle de photocopie et regarde les pages avec leurs bordereaux entrer et sortir.'
      pamphlet: "{date}\_:\_Le dépliant, tout juste sorti de l'imprimeur, repose sur le bureau d'un employé. {staff} voit le couvercle à travers la fenêtre."
      pamphlet_traded: '{date} : {staff} échange ce qu''ils fabriquent de leurs propres mains contre une copie de la brochure, neuve de l''imprimeur.'
      pamphlet_given: '{date} : Un employé remet à {staff} une copie du dépliant, fraîchement sorti de l''imprimeur, et dit à toutes les personnes présentes dans la salle d''en avoir une.'
      homesick_may: "{date}\_: Un mois sans rien enregistré. {staff} tient un compte dans le carnet et atteint cent jours. Au bureau, un peu plus de trois jours se sont écoulés."
      shipai_walk: '{date} : {staff} apprend que le nouveau campus doit être à Shipai, à l''est de la ville. Il n’y a pas de voyage là-bas aujourd’hui.'
      shipai_reached: '{date} : {staff} sort de la ville vers l''est et atteint Shipai. {staff} sait ce qui sera ici, y restera longtemps et dessine ce qui est ici maintenant.'
      shipai_frail: '{date} : {staff} sait ce qui se trouvera à Shipai, à l''est de la ville. C''est une longue marche, et aujourd''hui {staff} reste en ville.'
      last_seat: '{date} : {staff} entend cette conférence depuis l''endroit habituel et reste assis un moment après que la salle se soit vidée.'
      last_stall: '{date} : {staff} apporte plus à la porte de la salle que les autres dimanches. {staff} sait que les dimanches à venir il n''y aura pas autant de monde à cette porte.'
      enrol_open: '{date} : Ouverture des inscriptions à l’examen préparatoire. La veille, l''université avait demandé aux offices provinciaux de l''éducation d''inscrire des étudiants, avec 520 places prévues.'
      grad_ceremony: '{date} : Zou Lu prend le poste de président, et la cérémonie de remise des diplômes des trois écoles a lieu le même jour.'
    labels:
      sick: 'Les affaires sont toujours ouvertes'
      dead: 'Des choses dont personne ne pose plus de questions'
      deaths: 'Affaires devenues caduques'
      treated: 'Enregistrements dans un seul livre, pour cent'
      protected: 'Sites parcourus, pourcentage'
    identities:
      local_scholar:
        name: 'une personne qui aide au bureau des copistes'
        cover: '{staff} dit qu''ils ont fait des études, qu''ils écrivent bien et qu''ils aideraient volontiers à faire des copies.'
      pen:
        name: 'un journaliste de l''extérieur'
        cover: '{staff} dit qu''ils écrivent pour un journal ailleurs et veulent voir comment est construite la nouvelle université.'
      wanderer:
        name: 'une personne de passage venue entendre les conférences'
        cover: '{staff} dit qu''ils sont sur la route, qu''ils ont entendu dire que quelqu''un parlait ici le dimanche et qu''ils sont venus écouter.'
      maker:
        name: 'quelqu''un qui vend à la porte du hall'
        cover: '{staff} dit qu''ils ont un métier et qu''ils aimeraient s''installer là où se trouve la foule.'
      far_guest:
        name: 'un invité à bord d''un navire'
        cover: '{staff} dit qu''ils sont venus avec un bateau et qu''ils resteront à Guangzhou pendant un certain temps.'
    personal:
      records_read_aloud:
        s_fan: '{date} : Shen Fan écrit une main qu''il doit deviner lui-même. Il lit les noms et un commis écrit, et au fur et à mesure, il marque chaque nom qui figure dans deux des trois registres.'
        s_somchai: '{date} : Somchai sait lire, mais ses mains sont maladroites et personne ne peut comprendre ce qu''il écrit. Il lit les noms et un employé écrit. Au temple, quand les autres réparaient le toit, c''était lui qui tenait l''échelle.'
      sunday_first:
        s_fan: '{date} : Shen Fan est coincé tout au fond de la salle et ne peut pas tout entendre, alors il compte combien il y a dans la salle et combien prennent des notes, et écrit les deux chiffres.'
        s_samuel: '{date} : Samuel est pressé tout au fond de la salle, prenant des notes sur la pointe des pieds. Il est trop loin et la moitié de ce qu''il écrit est constitué de visages de ceux qui l''écoutent.'
        s_amara: '{date} : Amara est coincée tout au fond de la salle et ne peut pas tout entendre. Un étudiant à côté d’elle est resté trop longtemps debout et s’est évanoui. Elle l''aide à s''asseoir et compte à son poignet pendant un moment.'
      spoiler:
        s_fan: '{date} : Shen Fan sait que dans deux ans cette école prendra le nom de l''homme qui l''a commandée, et que cent ans plus tard il repartira de sa statue. Il écrit les deux phrases sur la dernière page du cahier et le ferme.'
        s_guilan: '{date} : Guilan sait que dans deux ans cette école changera de nom. Elle ne peut pas écrire les personnages, alors elle les répète une fois dans sa tête et ne le dit à personne.'
        s_somchai: '{date} : Somchai sait que dans deux ans cette école prendra le nom de l''homme qui l''a commandée. Il écrit la phrase sur la dernière page du cahier, le ferme et va demander à un employé ce qu''il lit.'
        s_carlos: '{date} : Carlos sait que dans deux ans cette école changera de nom. Il ne peut pas l''écrire, alors il le raconte au four et rit avant d''avoir fini.'
        s_samuel: '{date} : Samuel sait que dans deux ans cette école va changer de nom, une nouvelle que personne d''autre n''a connue. Il l''écrit sur la dernière page du cahier et le raye à nouveau. Il n''y a nulle part où le déposer.'
        s_amara: '{date} : Amara sait que dans deux ans cette école changera de nom. Elle écrit la phrase sur la dernière page du cahier et le ferme.'
      pamphlet_given:
        s_fan: "{date}\_: Un employé remet à Shen Fan une copie de la brochure, fraîchement sortie de l'imprimeur, et dit à toutes les personnes présentes dans la salle d'en avoir une. Shen Fan se tourne d'abord vers la préface et regarde la date en dessous."
        s_samuel: '{date} : Un employé remet à Samuel une copie du dépliant, fraîchement sortie de l''imprimeur. Il demande de quelle impression il s''agit et le greffier répond : la première.'
      errand_frail:
        s_fan: '{date} : Shen Fan est essoufflé après quelques marches et ne peut pas porter les pages. Il s''assoit à la porte de la salle de photocopie et compte combien de fois un texte circule.'
        s_somchai: '{date} : Somchai est essoufflé après quelques marches et ne peut pas porter les pages. Il s''assoit à la porte de la salle de photocopie et regarde entrer et sortir les pages avec leurs feuillets.'
        s_samuel: '{date} : Samuel a de nouveau des maux d''estomac depuis quelques jours et est essoufflé après quelques marches. Il s''assoit à la porte de la salle de photocopie et note l''heure de chaque portage des pages.'
      homesick_may:
        s_fan: "{date}\_: Un mois sans rien enregistré. Shen Fan tient un compte dans le cahier jusqu'à ce qu'il atteigne cent jours, puis le recalcule à côté. Au bureau, un peu plus de trois jours se sont écoulés."
        s_guilan: "{date}\_: Un mois sans rien enregistré. Guilan compte les jours. À la maison, les piments devraient bientôt être enterrés. Au bureau, un peu plus de trois jours se sont écoulés."
        s_somchai: "{date}\_: Un mois sans rien enregistré. Somchai veut encore voir de la neige une fois, et il n'y en a pas à Guangzhou en mai. Au bureau, un peu plus de trois jours se sont écoulés."
        s_carlos: "{date}\_: Un mois sans rien enregistré. Carlos se réveille à trois heures du matin. Son four n'est pas là, et il reste toute une matinée près du poêle de quelqu'un d'autre, à regarder. Au bureau, un peu plus de trois jours se sont écoulés."
        s_samuel: '{date} : Un mois sans rien enregistré, le mois le plus difficile pour un journaliste. Samuel tient un compte dans son carnet, et il atteint cent jours. Au bureau, un peu plus de trois jours se sont écoulés.'
        s_amara: "{date}\_: Un mois sans rien enregistré. Amara calcule combien d'enfants la paroisse a dû voir naître au cours de ces cent jours. Au bureau, un peu plus de trois jours se sont écoulés."
        s_jeanluc: "{date}\_: Un mois sans rien enregistré. Jean-Luc écrit une ligne par jour, comme dans un journal de bord en mer, jusqu'à en avoir une centaine. Au bureau, un peu plus de trois jours se sont écoulés."
      shipai_frail:
        s_fan: '{date} : Shen Fan sait ce qui sera construit à Shipai, à l''est de la ville. C''est trop loin et il ne peut pas y aller à pied.'
        s_somchai: '{date} : Somchai sait ce qui se trouvera à Shipai, à l''est de la ville. C''est trop loin et il ne peut pas y aller à pied.'
        s_samuel: '{date} : Samuel sait ce qui se trouvera à Shipai, à l''est de la ville, et que cela ferait une bonne pièce. C''est trop loin et il ne peut pas y aller à pied.'
      last_seat:
        s_fan: '{date} : Shen Fan entend cette conférence depuis l''endroit habituel, et le décompte dans son cahier s''arrête à seize. Il reste assis un moment après que la salle se soit vidée.'
        s_guilan: '{date} : Guilan entend cette conférence depuis l''endroit habituel. Quand la salle est vidée, elle n''y va pas tout de suite et redresse les bancs un à un.'
        s_somchai: '{date} : Somchai entend cette conférence depuis l''endroit habituel. Il reste assis un moment après que la salle se soit vidée, comme il avait l''habitude d''attendre au temple la dernière cloche.'
        s_samuel: "{date}\_: Samuel reprend cette conférence depuis son lieu habituel. Il sait que c'est le dernier, et dans le carnet il n'écrit que son numéro et non le mot dernier."
        s_amara: '{date} : Amara entend cette conférence depuis son lieu habituel. Elle reste assise un moment après, jusqu''à ce que la dernière personne soit sortie.'
        s_jeanluc: '{date} : Jean-Luc entend cette conférence debout à la place habituelle. Il est le dernier à quitter la salle, tout comme un capitaine est le dernier à quitter le navire.'
      records_shut:
        s_guilan: '{date} : Guilan a quitté l''école après la troisième année et ne participe pas à la copie des dossiers. Elle fait la connaissance des gardiens des trois écoles. Pour savoir qui est où, il est plus rapide de lui demander que de tourner les pages.'
        s_carlos: "{date}\_: Carlos écrit uniquement son propre nom et ne participe pas à la copie des enregistrements. Il fait la connaissance des gardiens des trois écoles. Pour savoir qui est où, il est plus rapide de lui demander que de tourner les pages."
      sunday_sit:
        s_guilan: '{date} : Guilan s''assoit au dernier rang de la salle, avec des problèmes de genoux et tout, et reste du premier au dernier mot. Elle ne suit pas tout ce qui se dit sur la plateforme. L''élève à côté d''elle a soif et elle lui tend son eau.'
        s_somchai: '{date} : Somchai a écouté des sermons au temple pendant vingt ans et est assis au dernier rang de la salle jusqu''au bout. Au fur et à mesure qu''il se vide, il demande à l''élève à côté de lui ce qu''il a lu.'
        s_jeanluc: '{date} : Jean-Luc a mal au dos et insiste pour rester debout, et reste au fond de la salle du premier au dernier mot.'
      pamphlet:
        s_guilan: "{date}\_:\_Le dépliant, tout juste sorti de l'imprimeur, repose sur le bureau d'un employé. Guilan le voit par la fenêtre et connaît deux des personnages de la couverture."
        s_somchai: '{date} : Le dépliant, tout juste sorti de l''imprimeur, repose sur le bureau d''un employé. Somchai voit la couverture à travers la fenêtre. Il sait combien d''exemplaires de ce livre il y aura un jour, et demande seulement au greffier jusqu''où il en est.'
        s_amara: "{date}\_:\_Le dépliant, tout juste sorti de l'imprimeur, repose sur le bureau d'un employé. Amara le voit par la fenêtre et se met à fredonner."
        s_jeanluc: "{date}\_:\_Le dépliant, tout juste sorti de l'imprimeur, repose sur le bureau d'un employé. Jean-Luc aperçoit la couverture par la fenêtre."
      errand:
        s_guilan: "{date}\_:\_Les pages sur lesquelles sont collés des bordereaux entrent et sortent de la salle de photocopie. Guilan est assis dehors, en train de couper les légumes et demande à tous ceux qui sortent s'ils ont mangé."
        s_amara: "{date}\_:\_Les pages sur lesquelles sont collés des bordereaux entrent et sortent de la salle de photocopie. Amara est dehors et ne voit que le dos de celui qui les porte, et peut dire aux traces qu'il est pressé."
        s_jeanluc: "{date}\_:\_Les pages sur lesquelles sont collés des bordereaux entrent et sortent de la salle de photocopie. Jean-Luc est dehors et apprend à l'enfant d'un gardien à faire des nœuds, et ne voit que le dos de celui qui les porte."
      shipai_reached:
        s_guilan: '{date} : Mal aux genoux et tout, Guilan se dirige vers Shipai pas à pas. Il n''y a que des champs. Elle s''accroupit, frotte une pincée de terre entre ses doigts et dit que les choses vont pousser ici.'
        s_carlos: '{date} : Carlos pousse sa charrette hors de la ville vers l''est et atteint Shipai, et revient en disant qu''il n''y a que des champs là-bas. Il sait qu''une université y sera construite, et pourtant, il dit que ce ne sont que des champs.'
        s_amara: '{date} : Amara sort de la ville vers l''est et atteint Shipai. Elle sait ce qui sera ici, y reste longtemps et dessine lentement ce qui est ici maintenant.'
      sunday_stall:
        s_carlos: '{date} : Carlos ne comprend pas ce qui se dit à l''intérieur et installe un four à la porte du hall pour faire du pain. Quand la salle se vide, la foule se précipite et le pain disparaît en un rien de temps, vendu trop bon marché comme d''habitude.'
      pamphlet_traded:
        s_carlos: "{date}\_: Carlos échange une fournée de pain contre un exemplaire du dépliant, tout juste sorti de l'imprimeur. Il ne peut pas le lire lui-même et dit que c'est pour l'enfant de la maison qui veut reprendre la boulangerie."
      errand_carried:
        s_carlos: '{date} : Dans cette succursale, celui envoyé pour porter les pages est Carlos. Une liasse de papier avec des bouts collés dessus, dont il ne peut pas lire un mot, et pas une feuille n''est froissée.'
      last_stall:
        s_carlos: "{date}\_: Carlos prépare une fournée de plus que d'habitude. Il sait que les dimanches à venir il n'y aura pas autant de monde à cette porte, et il distribue ce qui reste."
      records_begun:
        s_amara: '{date} : Amara commence à copier les dossiers des trois écoles. Le travail écrit a toujours été difficile pour elle, alors elle copie une ligne et demande à un employé de vérifier une ligne.'
      spoiler_said:
        s_jeanluc: '{date} : Jean-Luc dit à un commis à son copie que dans deux ans cette école prendra le nom de celui qui l''a commandée, et n''élève pas la voix pour le dire. Le greffier ne lève pas les yeux. L''homme est toujours vivant, dit-il, et qui nomme ainsi une école.'
      shipai_walk:
        s_jeanluc: '{date} : Jean-Luc apprend que le nouveau campus sera à Shipai, à l''est de la ville. Ses genoux ne le mèneront pas si loin et il reste un moment sur le quai, regardant vers l''est.'
