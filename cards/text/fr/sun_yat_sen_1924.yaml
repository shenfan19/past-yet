eras:
  sun_yat_sen_1924:
    name: "Guangzhou, 1924"
    short: "Guangzhou"
    place_name: "Guangzhou, salle de l’École normale supérieure"
    blurb: "Trois écoles doivent former une seule université. Le bureau préparatoire confie chaque tâche à une personne qui sait la mener à bien. Chaque mission confiée et menée à terme rapporte une étoile."
    handle_label: "Les notes deviennent un livre"
    protagonist_role: "Un homme d’État qui a ordonné de réunir trois écoles en une université et donne des conférences le dimanche dans leur salle"
    stay: "Rester sept jours au bureau, soit 210 jours dans le passé"
    plan_baseline: "Chronologie d’origine"
    protagonist: "Sun Yat-sen"
    summary:
      near_death: "{staff} tombe malade à Guangzhou. Le talisman de rappel le ramène, et le réveil a lieu devant la statue."
      stay_and_gifts: "Le travail terminé, {staff} ne revient pas. Une note explique que le voyage se poursuit pour voir l’université ouvrir. Des cadeaux arriveront plus tard."
      gave_up: "{staff} n’a pas tenu jusqu’au bout. Au réveil devant la statue, le constat est simple : rester plus longtemps dans le Guangzhou de 1924 n’était plus possible."
      legend: "Au réveil devant la statue, {staff} trouve parmi ses affaires une brochure imprimée en mars 1924. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      perfect: "{staff} revient devant la statue. Dans la chronologie d’origine, {base_D:i} affaires sont tombées dans l’oubli faute de suivi ; dans cette branche, {D:i}. Au départ, il restait {countdown:i} jours avant la rentrée."
      modest: "{staff} a passé deux cent dix jours à Guangzhou, a fait ce qui était à sa portée et se retrouve devant la statue. Au départ, il restait {countdown:i} jours avant la rentrée."
    star_points:
      xue: "Tracer un itinéraire pour afficher les avis d’inscription hors des murs et le remettre aux messagers"
      wen: "Visiter les trois écoles grâce à une recommandation et remettre une synthèse avant la première réunion"
      si: "Comparer les terrains envisagés et rendre une carte avant le choix de Shipai"
      bian: "Vérifier les listes des diplômés des trois écoles et remettre un registre unique pour le 21 juin"
      xing: "Rejoindre l’équipe à Shipai et planter les bornes du nouveau campus"
    points_fail:
      xue: 'Dans cette branche, l''avis n''est affiché qu''en ville, et les élèves du dehors l''apprennent quand les inscriptions ont déjà commencé.'
      wen: 'La première réunion préparatoire se tient comme dans l''histoire, chaque école ne parle encore que de ses propres soucis, et aucune liste ne les réunit.'
      si: 'Shipai est choisi comme dans l''histoire, et le bureau n''a aucune feuille où les sites soient dessinés ensemble.'
      bian: 'La remise des diplômes du 21 juin a lieu comme prévu. Le bureau doit consulter les trois listes séparément.'
      xing: 'Le terrain de Shipai n''est délimité que sur le papier, comme dans l''histoire, et pas un piquet n''y est planté.'
    shift:
      xue:
        was: '9 juin 1924 : l''Université nationale du Guangdong confie le recrutement aux bureaux provinciaux de l''éducation, et le 10 juin s''ouvrent les inscriptions à l''examen des classes préparatoires, avec 520 places prévues.'
        now: 'Dans cette branche, l''avis de recrutement est aussi affiché aux carrefours hors de la ville et sur les quais.'
      wen:
        was: '3 mars 1924 : la première réunion préparatoire se tient, et le premier point de son ordre du jour est la fin d''études des élèves des trois écoles.'
        now: 'Dans cette branche, une liste des difficultés des trois écoles est posée sur la table de la réunion.'
      si:
        was: '1924 : les écoles sont dispersées et difficiles à gérer, Sun Yat-sen charge Zou Lu de choisir un nouveau campus à Shipai, et le terrain est délimité dans l''année.'
        now: 'Dans cette branche, une carte des sites et de Shipai est jointe aux papiers du choix.'
      bian:
        was: '21 juin 1924 : Zou Lu prend ses fonctions de président de l''Université nationale du Guangdong, et la cérémonie de remise des diplômes des trois écoles a lieu le même jour.'
        now: 'Dans cette branche, le bureau dispose d’une seule liste vérifiée pour la cérémonie.'
      xing:
        was: '1924 : Sun Yat-sen fait choisir Shipai par Zou Lu pour le nouveau campus, mais la construction ne commence qu''en 1933 et les premiers collèges n''emménagent qu''à l''automne 1934. Sun meurt le 12 mars 1925 sans l''avoir vu.'
        now: 'Dans cette branche, avant qu''il ne quitte Canton en novembre, les bornes du terrain de Shipai sont déjà plantées, piquet après piquet.'
        who: sun_yat_sen_guangzhou
        bio: 'Dans cette ligne du temps, les bornes du nouveau campus de Shipai sont plantées avant que Sun Yat-sen ne quitte Canton.'
    shift_all: "Les cinq missions sont terminées. Avec le recul, elles font écho aux mots que Sun Yat-sen écrira pour la devise de l’université : étudier largement, s’enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance."
    milestones:
      adviser: "{date} — Le bureau préparatoire manque de bras. Un commis fait une place à {staff} et lui proposera des tâches à mesure qu’elles se présenteront."
      wen_ask: "{date} — Un commis connaît par chance des personnes disponibles dans les trois écoles. Il y envoie {staff} avec ses recommandations. De retour au bureau, {staff} remet une page qui réunit les préoccupations des enseignants et des élèves."
      xue_enrol: "{date} — Un commis voit que {staff} se repère vite sur les routes hors des murs. Il lui confie le trajet des avis d’inscription. {staff} marque les carrefours et les quais, puis remet le tracé et les avis aux messagers."
      bian_rolls: "{date} — Plusieurs noms divergent dans les trois listes des diplômés. Un commis qui connaît le soin de {staff} lui confie les dossiers. Après les avoir vérifiés sur les originaux, {staff} remet un seul registre pour la cérémonie."
      si_site: "{date} — Le bureau demande à {staff} de visiter tous les terrains envisagés, en ville et à Shipai. {staff} les parcourt et rapporte une carte qui indique l’accès à chacun."
      xing_shipai: "{date} — Il manque quelqu’un pour planter les bornes à Shipai. Un commis invite {staff}, qui peut faire le trajet et prêter main-forte. Sur place, {staff} tient les piquets pendant que l’équipe les enfonce, puis vérifie le tracé avec elle."
quotes:
  sun_motto: {who: 'Sun Yat-sen', quote: 'Étudier largement, s''enquérir avec soin, réfléchir avec prudence, discerner clairement, pratiquer avec constance.', occasion: 'la devise qu''il écrivit pour l''Université nationale du Guangdong'}
  sun_great_things: {who: 'Sun Yat-sen', quote: 'Je vous engage à vous fixer pour but de faire de grandes choses, et non de devenir de grands fonctionnaires.', occasion: 'discours aux étudiants de l''université Lingnan'}
