ui:
  about:
    update_notes: "Notes de mise à jour"
    content_credit:
      design: Fan Shen a conçu le jeu avec l’aide de l’IA.
      drafts: L’IA a rédigé la plupart des premières versions des récits, des notices sur les personnages historiques et des histoires des employés fictifs. Fan Shen a choisi les sujets et assure la révision des textes. Les contributions individuelles sont indiquées sur les fiches concernées.
      review: Une partie des fiches a fait l’objet d’une relecture humaine, et ce travail se poursuit. Des erreurs ou des omissions peuvent subsister dans les détails historiques, les représentations culturelles ou les traductions. Si vous en repérez une, indiquez la fiche et le passage concernés. Toute source est la bienvenue.
      feedback: Signaler une correction
    echoes:
      title: Échos historiques
      rule: Chaque histoire jouable propose des citations historiques dont la source est indiquée. Le rapport affiche un écho même sans étoile, en cas de désynchronisation ou si la personne envoyée n’a pas pu prendre part à l’événement. Les étoiles et l’issue du voyage déterminent la citation. En cas d’évacuation médicale ou de rappel manuel, le rapport ne présente aucun écho.
    preview:
      title: "Version préliminaire"
      project: "Ce jeu est la partie jouable de Life Matters (LM), un projet de recherche qui nous aide à développer le moteur de simulation. Il n’est pas nécessaire de connaître ces travaux pour jouer."
      changes: "À mesure que nous ajoutons des fonctionnalités, les règles, les effets des objets et les résultats des actions peuvent changer. Nous ferons notre possible pour préserver votre progression, mais une mise à jour importante peut rendre une ancienne sauvegarde inutilisable."
