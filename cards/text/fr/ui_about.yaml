ui:
  about:
    update_notes: "Notes de mise à jour"
    preview:
      title: "Version préliminaire"
      project: "Ce jeu est la partie jouable de Life Matters (LM), un projet de recherche qui nous aide à développer le moteur de simulation. Il n’est pas nécessaire de connaître ces travaux pour jouer."
      changes: "À mesure que nous ajoutons des fonctionnalités, les règles, les effets des objets et les résultats des actions peuvent changer. Nous ferons notre possible pour préserver votre progression, mais une mise à jour importante peut rendre une ancienne sauvegarde inutilisable."
