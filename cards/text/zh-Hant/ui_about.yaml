ui:
  about:
    update_notes: "更新日誌"
    version_line: '{app} {v}，發布於 {date}'
    content_credit:
      design: 遊戲由 Fan Shen 設計，AI 參與協助。
      drafts: 故事、歷史人物簡介和虛構員工故事大多由 AI 起草，Fan Shen 負責選題和編輯。個別卡片的貢獻者會在條目中註明。
      review: 部分卡片已由人工複核，其餘仍在陸續審閱。歷史細節、文化表述和譯文可能有錯漏。如果你發現問題，歡迎指出是哪張卡、哪一段。有出處的話，也歡迎一併附上。
      feedback: 提交更正
    echoes:
      title: 迴響
      rule: 每個可玩的故事都配有歷史引文。結算時，即使零星、同步失敗，或未能參與事件，也會顯示一條有出處的迴響。星數和結局決定出現哪一句。醫療撤離和主動召回會略過迴響。
    preview:
      title: "關於早期版本"
      project: "這款遊戲源於一個研究計畫，也協助我們開發模擬引擎。不必了解研究內容，也可以直接玩。"
      changes: "隨著功能增加，遊戲規則、道具效果和操作結果都可能改變。我們會盡量保留你的進度，但遇到較大的更新，舊存檔可能無法繼續使用。"
    links:
    - id: site
      label: 網站
    - id: code
      label: 原始碼
    - id: issues
      label: 意見與問題
    - id: mail
      label: 電郵
