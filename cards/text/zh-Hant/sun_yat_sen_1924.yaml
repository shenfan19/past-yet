eras:
  sun_yat_sen_1924:
    labels:
      sick: 懸而未決的事
      dead: 沒人再問的事
      deaths: 拖到沒人再問的事
      treated: 名冊抄成的百分數
      protected: 校址走熟的百分數
    identities:
      local_scholar:
        name: 謄清屋裡的幫手
        cover: '{staff}說自己讀過幾年書，字還過得去，愿意幫著抄寫。'
      pen:
        name: 外面來的記者
        cover: '{staff}說自己替外面的報紙寫稿，想看看這所新大學是怎樣辦起來的。'
      wanderer:
        name: 來聽講的游方人
        cover: '{staff}說自己是游方的，聽說這裡星期天有人演講，想來聽聽。'
      maker:
        name: 禮堂門口做小買賣的
        cover: '{staff}說自己有一門手藝，想在人多的地方擺個攤。'
      far_guest:
        name: 船上下來的遠客
        cover: '{staff}說自己是跟船來的，要在廣州住上一陣。'
    personal:
      records_read_aloud:
        s_fan: '{date}，沈凡的字潦草得連自己都要猜。他念名字，一位辦事員寫，他順手把三本名冊里重了的名字一個個標出來。'
        s_somchai: '{date}，頌猜識字，手笨，寫出來的字沒人認得。他念名字，一位辦事員寫。在寺里別人上房修屋頂，他也是在下面扶梯子的那一個。'
      sunday_first:
        s_fan: '{date}，沈凡擠在禮堂最後面，聽不全，就數臺下有多少人、多少人在記筆記，記在本子上。'
        s_samuel: '{date}，塞繆爾擠在禮堂最後面，踮著腳記。離得太遠，他記下的一半是臺下人的臉色。'
        s_amara: '{date}，阿瑪拉擠在禮堂最後面，聽不全。旁邊一個學生站久了發暈，她扶他坐下，按著他的手腕數了一陣。'
      spoiler:
        s_fan: '{date}，沈凡知道兩年以後這所學校會改用孫先生的名字，也知道一百年以後自己會從這所學校的銅像前出發。他把這兩句話寫在本子最後一頁，合上了。'
        s_guilan: '{date}，桂蘭知道兩年以後這所學校要改名。那幾個字她不會寫，在心裡記了一遍，沒有對人說。'
        s_somchai: '{date}，頌猜知道兩年以後這所學校會改用孫先生的名字。他把這句話寫在本子最後一頁，合上了，接著去問辦事員在讀什麼。'
        s_carlos: '{date}，卡洛斯知道兩年以後這所學校要改名。他不會寫，就講給爐子聽，講完自己先笑了。'
        s_samuel: '{date}，塞繆爾知道兩年以後這所學校要改名，這是一條誰也沒有的消息。他寫在本子最後一頁，又劃掉了，沒有地方可以發。'
        s_amara: '{date}，阿瑪拉知道兩年以後這所學校要改名。她把這句話寫在本子最後一頁，合上了。'
      pamphlet_given:
        s_fan: '{date}，辦事員把一本剛印出來的《民族主義》遞給沈凡，說屋裡的人一人一本。沈凡先翻到序，看了落款的日子。'
        s_samuel: '{date}，辦事員把一本剛印出來的《民族主義》遞給塞繆爾。他問這是第幾版，辦事員說，頭一版。'
      errand_frail:
        s_fan: '{date}，沈凡爬幾級樓梯就喘，送不了稿。他坐在謄清的屋子門口，數一份稿子來回走了幾趟。'
        s_somchai: '{date}，頌猜爬幾級樓梯就喘，送不了稿。他坐在謄清的屋子門口，看貼著簽注條的稿子進進出出。'
        s_samuel: '{date}，塞繆爾的腸胃又鬧了幾天，爬幾級樓梯就喘。他坐在謄清的屋子門口，把每一趟送稿的時刻記了下來。'
      homesick_may:
        s_fan: '{date}，沒有記載的一個月。沈凡在本子上畫正字，畫滿了一百天，又在旁邊算了一遍，事務所那邊只過了三天多。'
        s_guilan: '{date}，沒有記載的一個月。桂蘭數著日子，家里的辣椒這時候該下地了。事務所那邊只過了三天多。'
        s_somchai: '{date}，沒有記載的一個月。頌猜還想親眼看一次雪，廣州的五月沒有雪。事務所那邊只過了三天多。'
        s_carlos: '{date}，沒有記載的一個月。卡洛斯每天三點就醒，這裡沒有他的爐子，他站在別人的灶邊看了一早上。事務所那邊只過了三天多。'
        s_samuel: '{date}，沒有記載的一個月，對一個記者最難熬。塞繆爾在本子上畫正字，畫滿了一百天。事務所那邊只過了三天多。'
        s_amara: '{date}，沒有記載的一個月。阿瑪拉算了算，這一百天里病房該添了多少個孩子。事務所那邊只過了三天多。'
        s_jeanluc: '{date}，沒有記載的一個月。讓-呂克像記航海日志一樣一天記一行，記滿了一百天。事務所那邊只過了三天多。'
      shipai_frail:
        s_fan: '{date}，沈凡知道城東的石牌以後會蓋起什麼。路太遠，他走不到。'
        s_somchai: '{date}，頌猜知道城東的石牌以後是什麼樣子。路太遠，他走不到。'
        s_samuel: '{date}，塞繆爾知道城東的石牌以後是什麼樣子，那會是一條好稿子。路太遠，他走不到。'
      last_seat:
        s_fan: '{date}，沈凡坐在老位置上聽完了這一講，本子上記的場次停在十六。散場后他多坐了一會兒。'
        s_guilan: '{date}，桂蘭坐在老位置上聽完了這一講。散場后她沒有馬上走，把長凳一條一條擺齊了。'
        s_somchai: '{date}，頌猜坐在老位置上聽完了這一講。散場后他多坐了一會兒，像在寺里等最後一聲鐘。'
        s_samuel: '{date}，塞繆爾坐在老位置上記完了這一講。他知道這是最後一講，本子上只寫了場次，沒有寫最後兩個字。'
        s_amara: '{date}，阿瑪拉坐在老位置上聽完了這一講。散場后她多坐了一會兒，等最後一個人走出門。'
        s_jeanluc: '{date}，讓-呂克站在老位置上聽完了這一講。散場后他最後一個離開，像船長最後一個下船。'
      records_shut:
        s_guilan: '{date}，桂蘭只念到三年級，抄名冊插不上手。她把三所學校的門房都認熟了，誰在哪里，問她比翻名冊快。'
        s_carlos: '{date}，卡洛斯只會寫自己的名字，抄名冊插不上手。他把三所學校的門房都認熟了，誰在哪里，問他比翻名冊快。'
      sunday_sit:
        s_guilan: '{date}，桂蘭在禮堂后排坐下，膝蓋不好，卻從開講坐到了散場。臺上的話她沒全聽懂，旁邊的學生渴了，她把自己的水遞了過去。'
        s_somchai: '{date}，頌猜在寺里聽了二十年講經，在禮堂后排一坐到底。散場時他問旁邊的學生最近在讀什麼。'
        s_jeanluc: '{date}，讓-呂克腰不好，偏要站著聽，在禮堂后排從開講站到了散場。'
      pamphlet:
        s_guilan: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。桂蘭隔著窗看了一眼，封面上的字她認得兩個。'
        s_somchai: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。頌猜隔著窗看了一眼封面。他知道這本書後來印了多少，只問辦事員讀到哪里了。'
        s_amara: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。阿瑪拉隔著窗看了一眼，輕輕哼起歌來。'
        s_jeanluc: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。讓-呂克隔著窗看了一眼封面。'
      errand:
        s_guilan: '{date}，貼著簽注條的講稿從謄清的屋子里進進出出。桂蘭在門外擇菜，誰出來都問一句吃了沒有。'
        s_amara: '{date}，貼著簽注條的講稿從謄清的屋子里進進出出。阿瑪拉在門外，只看得見送稿人的背影，聽腳步就知道那人趕得很急。'
        s_jeanluc: '{date}，貼著簽注條的講稿從謄清的屋子里進進出出。讓-呂克在門外教門房的孩子打繩結，只看得見送稿人的背影。'
      shipai_reached:
        s_guilan: '{date}，桂蘭膝蓋不好，還是一步一步走到了石牌。那裡只有田，她蹲下來捏了一把土，說這地種得出東西。'
        s_carlos: '{date}，卡洛斯推著車出城往東，走到了石牌，回來說那裡只有田。他知道那裡以後會蓋起一所大學，還是說，只有田。'
        s_amara: '{date}，阿瑪拉出城往東，走到了石牌。她知道這裡以後是什麼樣子，站了很久，把眼前的樣子畫了下來，畫得很慢。'
      sunday_stall:
        s_carlos: '{date}，卡洛斯聽不懂裡面講什麼，在禮堂門口支起爐子烤面包。散場時人涌出來，面包一會兒就賣完了，照老習慣又賣便宜了。'
      pamphlet_traded:
        s_carlos: '{date}，卡洛斯拿一爐面包換了一本剛印出來的《民族主義》。他自己讀不了，說帶回去給家里想接手面包店的那個孩子。'
      errand_carried:
        s_carlos: '{date}，這條分支裡，被叫去送稿的人有一回是卡洛斯。一疊貼著簽注條的紙，他一個字也不認得，一張也沒弄皺。'
      last_stall:
        s_carlos: '{date}，卡洛斯多烤了一爐。他知道以後的星期天，這扇門口不會再有這么多人，剩下的面包都送了出去。'
      records_begun:
        s_amara: '{date}，阿瑪拉開始抄三所學校的名冊。書面的東西她一向吃力，抄一行，請辦事員對一行。'
      spoiler_said:
        s_jeanluc: '{date}，讓-呂克對一位抄寫的辦事員說，兩年以後這所學校會改用孫先生的名字，嗓門一點沒提高。辦事員頭也沒抬，說先生人還在，哪有這樣起校名的。'
      shipai_walk:
        s_jeanluc: '{date}，讓-呂克聽說新校址選在城東的石牌。他的膝蓋走不了那麼遠，在碼頭上朝東望了一陣。'
    name: 廣州 1924
    short: 廣州
    place_name: 廣州，高等師範的禮堂
    tags:
      - thought
      - education
      - university
      - c20
      - guangzhou
      - history
    event_titles:
      asked_the_way: 問路
    plots: {}
    blurb: 三所學校要併成一所大學。七個月，從合併學校的命令到開學前十八天。游戲從這裡開始。
    handle_label: 名冊合成一本
    protagonist: 孫中山
    protagonist_role: 下令把三所學校并成一所大學的政治家，星期天在這座禮堂演講
    stay: 停留七個事務所日，歷史 210 天
    plan_baseline: 主時間線
    encyclopedia:
      history:
        - text: 1924 年 2 月 4 日，孫中山下令把國立高等師範學校、廣東法科大學和廣東農業專門學校合併為國立廣東大學，派鄒魯籌備。
          check: true
        - text: 1924 年 1 月 27 日到 8 月 24 日，孫中山利用星期天在高等師範的禮堂演講，共十六講。黃昌谷每一講都隨同速記，鄒魯校讀謄清的講稿并貼簽注條，孫中山親筆修正。
          check: true
        - text: 鄒魯 2 月 21 日接手籌備。2 月 24 日他在禮堂召集三所學校的學生宣布此事，3 月 3 日開第一次籌備會議，議題里有三所學校學生的畢業問題。
          check: true
        - text: 頭幾講在三月底印成單行本，孫中山 3 月 30 日為它寫了序。6 月 3 日鄒魯呈報歸并三校的辦法，6 月 6 日獲批準。
          check: true
        - text: 9 月 19 日開學，11 月 11 日舉行成立典禮，用了孫中山寫的校訓。孫中山 1925 年 3 月 12 日在北京去世，1926 年這所大學改名為國立中山大學。
          check: true
      regret:
        - 你 9 月 1 日離開。開學在 19 日，校訓是那以後的事。
        - 演講停在第十六講。臺下沒有人知道那是最後一講。
    events:
      asked_the_way: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}也說不清，陪著找了半天。'
      asked_the_way_shown: '{date}，一個拿著信的新生問{staff}某間辦公室怎麼走。{staff}在圖上指給他看，他道了謝，拿著圖走了。'
    star_points:
      xue: '博學：報名開始之前，建議籌備處把招生告示貼出城去，讓城外的學生也趕得上'
      wen: '審問：第一次籌備會議之前，到三所學校請教，缺什麼、難在哪，一樣樣問仔細，列成單子交上去'
      si: '慎思：選址之前，把城裡幾處校址和石牌那片官地一處處走過、比過，畫成圖交給籌備處'
      bian: '明辨：理清三所學校畢業班對不上的名單，護住 6 月 21 日的畢業典禮'
      xing: '篤行：跟著去石牌，把新校地的界一根根立下去'
    points_fail:
      xue: '這條分支裡，招生告示只貼在城裡，城外的學生知道消息時，報名已經開始了。'
      wen: '第一次籌備會議照史實召開，三所學校的難處仍是各說各的，沒有一張合在一起的單子。'
      si: '選址照史實定在石牌，籌備處桌上沒有一張把幾處校址畫在一起的圖。'
      bian: '三所學校的畢業名單沒有理清，6 月 21 日的畢業典禮沒能照期舉行，這條分支與歷史脫了節，事務所當天召回員工。'
      xing: '石牌的校地照史實只劃在紙上，地上一根界樁也沒有立。'
    shift:
      xue:
        was: '1924 年 6 月 9 日，國立廣東大學委託各省教育廳招生；6 月 10 日，預科考試開始報名，原計劃招 520 人。'
        now: '這條分支裡，城外的路口和碼頭上也貼著招生告示。'
      wen:
        was: '1924 年 3 月 3 日，第一次籌備會議召開，議題裡頭一件是三所學校學生的畢業問題。'
        now: '這條分支裡，會上擺著一張把三所學校的難處列在一起的單子。'
      si:
        was: '1924 年，各校分散各處，管理不便，孫中山命鄒魯擇石牌為新校址，當年劃定土地。'
        now: '這條分支裡，選址的文書旁邊多了一張把幾處校址和石牌畫在一起的圖。'
      bian:
        was: '1924 年 6 月 21 日，鄒魯就任國立廣東大學校長，同一天為原三所學校的畢業生舉行畢業典禮。'
      xing:
        was: '1924 年孫中山命鄒魯擇石牌為新校址，可新校舍 1933 年才動工，1934 年秋第一批學院才遷入。孫中山 1925 年 3 月 12 日去世，生前沒有見到。'
        now: '這條分支裡，11 月他離開廣州之前，石牌校地的界已經一根根立定。'
        who: sun_yat_sen_guangzhou
        bio: '這條時間線裡，孫中山離開廣州之前，新校址石牌的界已經立定。'
    shift_all: '校訓是孫中山親筆寫的五個詞：博學、審問、慎思、明辨、篤行。員工條子角上的五個詞，和它一字不差。'
    milestones:
      order_given: '{date}，孫中山下令把國立高等師範學校、廣東法科大學和廣東農業專門學校并成國立廣東大學，派鄒魯籌備。城里還沒有人說得清這所大學在哪里。'
      sun_dies: '{date}，孫中山在北京逝世。'
      renamed: '{date}，國民政府下令把國立廣東大學改名為國立中山大學。'
      lecture_jan27: '{date}，星期天。孫中山在高等師範的禮堂講三民主義的第一講。'
      lecture_feb17: '{date}，星期天。孫中山在高等師範的禮堂演講，這個系列從 1 月 27 日講起，這一天是第四講。臺側有人埋頭速記，那是黃昌谷，每一講他都在。'
      zou_takes_up: '{date}，鄒魯就任籌備主任。'
      hall_feb24: '{date}，又是星期天。這一天禮堂里有第五講，鄒魯也在這裡召集三所學校的學生，宣布籌建。'
      first_meeting: '{date}，第一次籌備會議，議題里有三所學校學生的畢業問題。三十五名籌備委員里，三十一人留過洋。'
      first_meeting_book: '{date}，第一次籌備會議，議題里有三所學校學生的畢業問題。三十五名籌備委員里，三十一人留過洋。這條分支裡，三所學校畢業班的名字這時已經抄在同一本冊子上。'
      proofs_travel: 三月里，講稿在幾個人手裡來回走。黃昌谷的筆記謄清后送給孫中山，孫中山叫人送給鄒魯校讀，鄒魯在稿上貼簽注條送回去，孫中山親筆改，改完又送來。
      preface: '{date}，孫中山為《民族主義》單行本寫了序。單行本在三月底印出。'
      lecture_apr20: '{date}，星期天。禮堂里講到了民權主義。'
      measures_sent: '{date}，鄒魯呈報歸并三校的辦法。'
      measures_approved: '{date}，辦法獲批準。'
      shipai_chosen: 這一年，孫中山讓鄒魯在城東的石牌選新校址。幾所學校散在城里好幾處，不便管理。
      last_lecture: '{date}，第十六講。民生主義只講到第四講，後面的沒有再講。臺下沒有人知道這是最後一講。'
      classes_begin: '{date}，國立廣東大學正式開學。'
      ceremony: '{date}，舉行成立典禮，用的是孫中山寫的校訓，博學、審問、慎思、明辨、篤行。他本人沒有到場，兩天后離開廣州。'
      sunday_first: '{date}，{staff}擠在禮堂的最後面，離講臺很遠，看得見人，聽不全話。'
      sunday_stall: '{date}，{staff}進不去禮堂，在門口擺了個攤。散場時人涌出來，東西一會兒就賣完了。'
      sunday_sit: '{date}，{staff}在禮堂后排找了個位置，從開講坐到散場，一動沒動。'
      records_begun: '{date}，{staff}開始把三所學校的名冊往同一本冊子上抄。'
      records_read_aloud: '{date}，{staff}的字沒人認得。{staff}念名字，一位辦事員寫，三本名冊開始并成一本。'
      records_shut: '{date}，抄名冊要識字，{staff}插不上手，倒把三所學校的門房都認熟了。誰在哪里，問{staff}比翻名冊快。'
      records_done: '{date}，三所學校的名冊合成了一本，趕在第一次籌備會議之前。'
      records_late: '{date}，三所學校的名冊合成了一本。第一次籌備會議已經開過了。'
      sites_done: '{date}，{staff}把散在城里的幾處校址都走了一遍，畫成一張圖，注上從這一處到那一處要走多久。'
      asked_inside: '{date}，辦事員不再讓{staff}在門外等，叫進了屋。'
      copy_kept: '{date}，{staff}把那本《民族主義》包好，放進了行李。'
      exhausted: '{date}，{staff}累得手發抖，不得不歇下來。'
      spoiler: '{date}，{staff}知道兩年以後這所學校會改用孫先生的名字。{staff}把這句話寫在本子最後一頁，合上了。'
      spoiler_said: '{date}，{staff}對一位抄寫的辦事員說，兩年以後這所學校會改用孫先生的名字。辦事員頭也沒抬，說先生人還在，哪有這樣起校名的。'
      errand: '{date}，貼著簽注條的講稿從謄清的屋子里進進出出。{staff}在門外，只看得見送稿人的背影。'
      errand_carried: '{date}，這條分支裡，被叫去送稿的人有一回是{staff}。一疊貼著簽注條的紙，從這頭送到那頭，一張也沒弄皺。'
      errand_frail: '{date}，{staff}爬幾級樓梯就喘，送不了稿，坐在謄清的屋子門口，看貼著簽注條的稿子進進出出。'
      pamphlet: '{date}，剛印出來的《民族主義》擺在辦事員的桌上。{staff}隔著窗看了一眼封面。'
      pamphlet_traded: '{date}，{staff}拿自己親手做的東西，跟人換了一本剛印出來的《民族主義》。'
      pamphlet_given: '{date}，辦事員把一本剛印出來的《民族主義》遞給{staff}，說屋裡的人一人一本。'
      homesick_may: '{date}，沒有記載的一個月。{staff}在本子上畫正字，畫滿了一百天。事務所那邊只過了三天多。'
      shipai_walk: '{date}，{staff}聽說新校址選在城東的石牌，這一趟沒有去成。'
      shipai_reached: '{date}，{staff}出城往東，走到了石牌。{staff}知道這裡以後是什麼樣子，站了很久，把眼前的樣子畫了下來。'
      shipai_frail: '{date}，{staff}知道城東的石牌以後是什麼樣子。路太遠，{staff}走不到。'
      last_seat: '{date}，{staff}坐在老位置上聽完了這一講。散場后多坐了一會兒。'
      last_stall: '{date}，{staff}在禮堂門口比平常多備了一份貨。{staff}知道以後的星期天，這扇門口不會再有這么多人。'
      adviser: '{date}，籌備處缺人手，{staff}被請進門，做了籌備處的臨時顧問，有什麼想法可以寫成條子遞上去。'
      wen_ask: '{date}，{staff}到三所學校一家家去請教：老師們缺什麼，學生們擔心什麼，一樣樣問仔細。趕巧幾位老先生那天下午都有空，說了很久。{staff}把聽來的列成一張單子遞給籌備處，在條子角上寫了兩個字：審問。'
      xue_enrol: '{date}，{staff}建議把招生告示也貼到城外的路口和碼頭上，讓讀書人不論遠近都趕得上報名。條子角上寫的是：博學。'
      bian_rolls: '{date}，三所學校的畢業名單有好幾處對不上。{staff}一個名字一個名字地對清，把名單交上去，角上寫著：明辨。'
      si_site: '{date}，{staff}把城裡幾處校址和城東石牌那片官地一處處走完、比過，才把圖交給鄒魯。角上寫著：慎思。'
      xing_shipai: '{date}，{staff}跟著籌備處的人出城往東走到石牌，把界樁一根根打進土裡。回城以後，{staff}在本子上補了最後兩個字：篤行。'
      enrol_open: '{date}，預科考試開始報名。前一天，學校已委託各省教育廳招生，原計劃招 520 人。'
      grad_ceremony: '{date}，鄒魯就任校長，同一天為原三所學校的畢業生舉行畢業典禮。'
    summary:
      near_death: '{staff}在廣州病倒，被召回符拉了回來，在銅像前醒來。'
      stay_and_gifts: '{staff}做完了事，卻沒有回來。留下一張字條，說想留下來看著這所大學開學。禮物之後會到。'
      gave_up: '{staff}沒有撐到最後，在銅像前醒來，說 1924 年的廣州待不下去了。'
      legend: '{staff}在銅像前醒來，行李里有一本 1924 年三月印的《民族主義》。主時間線上有 {base_D:i} 件事拖到沒人再問，這條分支裡是 {D:i} 件。走的那天，離開學還有 {countdown:i} 天。'
      perfect: '{staff}回到了銅像前。主時間線上有 {base_D:i} 件事拖到沒人再問，這條分支裡是 {D:i} 件。走的那天，離開學還有 {countdown:i} 天。'
      modest: '{staff}在廣州待了二百一十天，做了力所能及的事，又站在了銅像前。走的那天，離開學還有 {countdown:i} 天。'
    quotes:
      near_death:
        - text: 我以為還能再撐一會兒。
      stay_and_gifts:
        - trait: kind
          text: 我記得他們每個人的名字。我想再待一陣。
        - text: 這裡需要人。
      gave_up:
        - trait: homesick
          text: 我想回家，就這樣。
        - text: 七個月太長了。
      legend:
        - trait: curious
          text: 原來一本書是這樣一頁一頁改出來的。
        - text: 我走的時候，他們還沒有開學。
      perfect:
        - trait: kind
          text: 來問的人，後來都有人答了。
        - text: 該做的做了。
      modest:
        - trait: glib
          text: 我說兩年后這裡會改名，沒有人信。
        - text: 我只是在那裡待過。
    hints:
      low_luck: '審問看幸運，運氣不夠，趕不上老先生們有空細談的時候。'
      low_wit: '博學看聰慧，聰慧不夠，想不到把告示貼出城去。義體智能晶片能補。'
      low_finesse: '明辨看靈巧，靈巧不夠，理不開三所學校的名單。這是守護星，沒做到會被送回。'
      low_will: '慎思看意志，意志不夠，沉不住氣把每處校址走完再比。義體仿生肺能補。'
      low_constitution: '篤行看體質，體質不夠，走不到石牌、立不起界樁。義體仿生肺能補。'
      none: 只改一樣東西，用同一個種子再派一次，這樣對比最清楚。
quotes:
  sun_motto: {who: '孫中山', quote: '博學、審問、慎思、明辨、篤行。', occasion: '為國立廣東大學題寫的校訓'}
  sun_great_things: {who: '孫中山', quote: '我勸諸君立志，是要做大事，不可要做大官。', occasion: '在嶺南大學學生歡迎會上的演說'}
