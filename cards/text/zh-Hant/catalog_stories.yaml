catalog:
  socrates_athens:
    name: 船回來之前
    place: 雅典
    figure: 蘇格拉底
    story: 前 399 年，蘇格拉底在雅典受審，被判死刑。雅典每年派往提洛島的船剛剛出發，船回港以前城里不處決人，他在獄中等了約三十天。這些日子裡他把伊索寓言改寫成詩，朋友們天天來看他。最後那天朋友們都在，只有柏拉圖病了沒來，傍晚他飲下了毒芹汁。
    relic: 集市上的陶杯
    relic_desc: 一隻雅典的黑釉陶杯，杯沿磕掉了一小塊。
    points:
      p1: 陪審席上的喧嘩一陣陣壓過來時，護住他把申辯講完
      p2: 幫他把獄中改寫成詩的伊索寓言和獻給阿波羅的頌歌寫完，抄一份帶出獄外
      p3: 最後那天之前，治好病中的柏拉圖，讓他趕到獄中送老師最後一程
    points_fail:
      p1: 喧嘩蓋過了申辯，他沒能把話講完，這條分支與歷史脫了節，事務所召回員工。
      p2: 這些詩照史實一首也沒有傳下來，這條分支裡也沒有。
      p3: 那天柏拉圖照史實病著沒來，這條分支裡他也沒在老師身邊。
    shift:
      p1:
        was: 前 399 年，蘇格拉底在雅典受審，柏拉圖《申辯篇》里他一再請陪審員不要喧嘩，把話聽完；他被判有罪，判處死刑。
      p2:
        was: 前 399 年，蘇格拉底在獄中等待行刑時，照一個反復出現的夢的吩咐，把伊索寓言改寫成詩，又作了一首獻給阿波羅的頌歌；這些詩沒有完整傳下來。
        now: 幾首詩抄成一卷，由朋友帶出獄門，留在了雅典。
      p3:
        was: 前 399 年，蘇格拉底在獄中飲毒芹去世那天，朋友們都在，柏拉圖因病沒來。
        now: 柏拉圖病好了，那天也在獄中，坐在朋友們中間，一直待到最後。
        who: plato_academy
        bio: 這條時間線里，柏拉圖那場病治好了，蘇格拉底最後一天，他在獄中陪著老師。
    vignettes:
      rumours: 開庭前一天，{staff}在集市上問了三個攤子，這老頭犯的是什麼事，得了三種說法。{staff}一樣記一行，等明天聽庭上念的是哪一條。
      harbour: '{staff}每天傍晚走到比雷埃夫斯港，問賣魚的提洛島的船回來沒有。天天是同一個回答，{staff}說不清自己是盼它來，還是盼它別來。'
      gate: '{staff}替獄墻外賣燈油的女人挑水，換來墻根下一塊歇腳的地方。探視的人每天天一亮就等在門口，{staff}漸漸認得了他們的臉。'
  euclid_alexandria:
    name: 《推論集》還在的時候
    place: 亞歷山大
    figure: 歐幾里得
    story: 約公元前 300 年，歐幾里得在亞歷山大寫成《幾何原本》十三卷，從定義和公設出發，一步步證明幾何命題。他還寫過《推論集》三卷、《圓錐曲線》等書，後來都失傳了。公元四世紀的帕普斯還能介紹《推論集》，記下它的命題數。
    relic: 一把青銅圓規
    relic_desc: 兩條臂和一個軸，足夠畫出書里的每一個圖形。
    points:
      p1: 幫他把《推論集》三卷多抄幾部，交到學生手裡，不讓這部書失傳
    points_fail:
      p1: 《推論集》照舊只有一路抄本，這條分支裡它還是失傳了，只剩帕普斯留下的幾句介紹。
    shift:
      p1:
        was: 約公元前 300 年，歐幾里得寫成《推論集》三卷；原書後來失傳，今天只知道公元四世紀帕普斯記下的命題數 171 和一段簡短的介紹。
        now: '{staff}幫他把《推論集》多抄了幾部，交給跟他學幾何的人，這條時間線里這部書傳到了后世。'
        who: euclid_alexandria
        bio: IF 線里，歐幾里得的《推論集》多抄了幾部，沒有失傳，后人讀到的他不只有《幾何原本》。
    vignettes:
      lost: '{staff}在抄書人的案頭看見一卷《推論集》，知道后世的人只能從帕普斯的幾行字里猜它寫了什麼。{staff}的手按在卷邊上，停了好一會兒才松開。'
      arcs: '{staff}學著學生的樣子，用木釘和繩子在沙盤上畫圓，兩道弧一交，第三個點就出來了。{staff}抹平沙子又畫一遍，第二遍手穩多了。'
      papyrus: '{staff}幫碼頭上賣莎草紙的人把一捆捆紙扛上岸，聽他講哪種紙經得住港口的潮氣，哪種放一年就脆了。'
  eratosthenes_alexandria:
    name: 量地球的那部書
    place: 亞歷山大
    figure: 埃拉托色尼
    story: 昔蘭尼人埃拉托色尼約公元前 245 年應托勒密三世之請來到亞歷山大，給王子當老師，約公元前 240 年做了亞歷山大圖書館的館長。他對照夏至正午塞伊尼和亞歷山大兩地的日影，算出地球周長 250000 斯塔迪亞。他寫這件事的《論地球的測量》後來失傳，方法主要靠克萊奧梅德斯簡化過的轉述留下。
    relic: 一根日晷針
    relic_desc: 一根樸素的立桿，影子告訴他太陽的角度。
    points:
      p1: 幫他把《論地球的測量》多抄幾部，存進圖書館也送出城去，不讓他親筆寫下的方法失傳
    points_fail:
      p1: 這部書照舊只有原來那幾部抄本，這條分支裡它還是失傳了，后人只能從克萊奧梅德斯簡化過的轉述里認識他的方法。
    shift:
      p1:
        was: 公元前三世紀，埃拉托色尼把測地的方法寫進《論地球的測量》；原書後來失傳，方法主要靠克萊奧梅德斯簡化過的轉述留下，克萊奧梅德斯自己也說原法更繁。
        now: '{staff}幫他把這部書多抄了幾部，這條時間線里他親筆寫的方法和後來的轉述一起傳了下來。'
        who: eratosthenes_alexandria
        bio: IF 線里，埃拉托色尼測量地球的那部書沒有失傳，后人能照他自己的話核對他的方法。
    vignettes:
      noon: 夏至正午，{staff}蹲在一根立桿旁，用指甲在地上劃下影子的尖。過一會兒再看，影子已經挪開了一指寬。
      beta: '{staff}聽圖書館的抄書人背地里管館長叫"貝塔"，說他樣樣都只排第二。{staff}知道后世記住他的，偏偏是他量出來的那一整圈地球，憋著沒笑出聲。'
      shelves: '{staff}幫圖書館的雜役把卷子一捆捆扛上架，每捆系一塊小木牌。雜役說，不識字的人也認得牌上的記號。'
  fibonacci_pisa:
    name: 1202 年的初編
    place: 比薩
    figure: 斐波那契
    story: 比薩的列奧納多少年時在北非海岸的布吉亞學會用九個印度數字算賬，他父親在那裡替比薩商人辦事。1202 年，他回到比薩寫成《計算之書》，教人用這些新數字和零來記數、做買賣。1228 年他把書改訂了一遍，今天傳下來的抄本都出自這第二版。
    relic: 一塊寫著數字的蠟板
    relic_desc: 板上把十個新數字和舊的羅馬數字并排寫在一起。
    points:
      p1: 說服列奧納多把 1202 年初編的一整套抄本簽好名留在比薩，讓它不被後來的修訂本取代
    points_fail:
      p1: 等作者改寫以後，借書人只認得後來那一套抄本，不能恢復早本。
    shift:
      p1:
        was: 1202 年，比薩的列奧納多寫成《計算之書》初編；初編沒有完整的抄本留存，傳下來的抄本出自 1228 年的修訂本。
        now: 留存的早本注明舊例和編成年份。等修訂本出現，兩份可并讀，讀者能查哪些例題是後來才補的。
        who: fibonacci_pisa
        bio: 比薩的列奧納多 1202 年的初編留下了一部完整的抄本，與 1228 年的修訂本并存，后人能對出他這些年里改了什麼。
    vignettes:
      rabbits: '{staff}在抄本里讀到一道題：一對兔子每個月生一對小兔。{staff}忍不住在頁邊數到第十二個月，數出來的數，和后世課本上的一個也不差。'
      zero: '{staff}在碼頭的賬房里教學徒把空著的一位寫成零。學徒說這個小圈什麼也不是，憑什麼占一欄。{staff}讓他把兩本賬對一遍，他就不吭聲了。'
      quay: '{staff}在阿諾河邊幫人從船上卸貨包，一包上岸就報一聲數。岸上的賬房一邊聽，一邊在板上劃一道。'
  dante_ravenna:
    name: 用街頭的語言寫一部長詩
    place: 拉文納
    figure: 但丁
    story: 但丁 1302 年被逐出佛羅倫薩，約 1318 年移居拉文納，在那裡寫完《神曲》的最後一部《天堂篇》，用的是托斯卡納的日常口語。1319 年前後，博洛尼亞的學者喬萬尼·德爾·維爾吉利奧寄來拉丁詩，勸他改用拉丁文寫作、到博洛尼亞接受桂冠，但丁用拉丁詩作答。1320 年 1 月 20 日，他在維羅納作了一場講演。1321 年 9 月，他從威尼斯出使回來后病倒，在拉文納去世。
    relic: 一片月桂葉
    relic_desc: 詩人桂冠上的一片干葉。
    points:
      p1: 給但丁騰出從拉文納寄出答詩的時間，把他答喬萬尼的拉丁詩單獨封存，別夾入正在謄寫的《天堂篇》
      p2: 讓流放中的但丁知道，《神曲》會被一代代人讀下去，佛羅倫薩後來也想把他迎回去
    points_fail:
      p1: 收信人只拿到正文散頁，答詩仍在抄稿夾里，事務所因同步失敗召回員工。
      p2: 他照舊在拉文納寫詩，回佛羅倫薩的盼望沒有著落，這條分支裡沒人告訴過他後來的事。
    shift:
      p1:
        was: 1319 年下半年至 1320 年初，但丁在拉文納寫《天堂篇》時，與博洛尼亞的喬萬尼·德爾·維爾吉利奧開始拉丁詩通信，這是學界的推定。
      p2:
        was: 1321 年 9 月，但丁在拉文納去世，到死沒能回到佛羅倫薩；1519 年前後佛羅倫薩請求遷回他的遺骨，拉文納的修士把遺骨藏進了墻里。
        now: '{staff}在拉文納讓他知道，《神曲》往後會一直有人讀，他的城市終有一天想把他接回去。'
        who: dante_ravenna
        bio: 流放中的但丁在拉文納的晚年得知，他的詩會長久流傳，佛羅倫薩終會以他為榮。
    vignettes:
      latin: '{staff}在謄寫間看見兩疊紙：一疊是托斯卡納話寫的《天堂篇》，一疊是要寄往博洛尼亞的拉丁詩，來信說只有拉丁文才配得上桂冠。{staff}知道七百年后人人讀的是哪一疊，話到嘴邊，又咽了回去。'
      pinewood: '{staff}跟著拾柴的人走進拉文納城外靠海的松林，在沙地上歇腳，聽得見林子那頭的海浪。'
      ink: '{staff}幫賣墨水的人把一罐罐墨從船上搬下來。墨是用櫟樹癭和鐵銹熬的，賣墨的說，城里謄寫的人買得最多。'
  copernicus_frombork:
    name: 太陽在中心
    place: 波蘭弗龍堡
    figure: 哥白尼
    story: 1539 年，年輕的數學家雷蒂庫斯來到弗龍堡，勸尼古拉·哥白尼把書付印。1543 年，《天體運行論》在紐倫堡印成，書中地球自轉并繞太陽運行，卷首多了一篇不署名的《告讀者》。哥白尼從 1542 年底起一直病著，1543 年 5 月 24 日在弗龍堡去世。他的朋友蒂德曼·吉澤後來寫信說，印好的書到他去世那天才送到他手上。
    relic: 一個黃銅象限儀
    relic_desc: 四分之一圓，用來量星星的高度。
    points:
      p1: 趁弗龍堡還來得及清點，把《天體運行論》的親筆原稿和工作紙分開記賬，給後來接手的吉澤留一張收執
      p2: 吉澤催印坊改版前，先為附近傳閱的印本備一張勘誤頁，列出作者序言所在及匿名告讀者文在原稿中缺席的事實
      p3: 趁他神志還清楚，把印好的《天體運行論》送到他手裡，讓他知道這本書印成了
    points_fail:
      p1: 收拾桌上紙張時，兩疊工作紙被當作已經交給印坊的那份抄本處理。親筆原稿沒有交到吉澤手上，事務所因同步失敗召回員工。
      p2: 吉澤只能等外地印坊和市議會答復，附近的讀者仍按原來的頁面順序翻讀。
      p3: 印好的書送到他手上那天，正是他去世的 5 月 24 日。
    shift:
      p1:
        was: 1543 年，紐倫堡印本以抄本為底，哥白尼的親筆原稿另存，後來經蒂德曼·吉澤傳至雷蒂庫斯。
      p2:
        was: 1543 年 7 月，吉澤請雷蒂庫斯把要求改版的信轉交紐倫堡市議會，1543 年首版的匿名文字已經隨著印本流通。
        now: 附近幾份先借出的書都補上一張勘誤頁。新借書的人能從旁邊那頁查回原稿，外地印坊的回覆也留在同一份檔案里。
      p3:
        was: 1543 年 5 月 24 日，哥白尼在弗龍堡去世。吉澤後來寫信說，印好的書到他去世那天才送到他手上。
        now: 五月初，印好的書就送到了他的床前，他在神志清楚時把它拿在手裡。幾周以後，他在弗龍堡去世。
        who: copernicus_frombork
        bio: 哥白尼在去世前幾周收到了印好的《天體運行論》，知道這部寫了幾十年的書已經印成。
    vignettes:
      preface: '{staff}翻開一本印好的書。卷首那篇不署名的《告讀者》說，書里的說法只是便於計算的假設。{staff}知道要再過五十年左右，開普勒才會說出是誰寫的，合上書時，手指還壓在那一頁上。'
      window: '{staff}在病房外守著一壺熱水。屋裡的人說，老人已經認不太清人了。{staff}把窗推開一條縫，讓春天的風吹進去。'
      nets: '{staff}在山腳的漁村幫人補網，望得見維斯瓦潟湖。漁夫說，山上住著一位老教士，夜里常看星星。'
  smith_kirkcaldy:
    name: 一個國家怎樣變富
    place: 蘇格蘭柯卡爾迪
    figure: 亞當·斯密
    story: 1776 年 3 月，亞當·斯密的《國富論》在倫敦出版。8 月 25 日，他的朋友大衛·休謨在愛丁堡去世。休謨起先托斯密把《自然宗教對話錄》印出來，斯密有顧慮，休謨改托印書商威廉·斯特拉恩，要他在身後兩年內出版。這年 11 月，斯密在柯卡爾迪給斯特拉恩寫信，記下休謨最後幾個月的樣子。斯特拉恩最終作罷，《對話錄》到 1779 年才由休謨的侄子印出。
    relic: 一枚別針
    relic_desc: 他用來說明分工威力的那種別針。
    points:
      p1: 休謨托付的《自然宗教對話錄》擱著沒人肯印時，勸斯密和斯特拉恩照休謨的遺愿把它印出來
    points_fail:
      p1: 書照史實又擱了三年，1779 年才由休謨的侄子不署名印出，這條分支裡休謨要它在身後兩年內出版的遺愿也沒有照辦。
    shift:
      p1:
        was: 1776 年 8 月 7 日，休謨在遺囑附件里請斯特拉恩在他身後兩年內出版《自然宗教對話錄》；斯密不肯經手，斯特拉恩最終也作罷，書在 1779 年由休謨的侄子不署名出版。
        now: 斯特拉恩在休謨要求的兩年之內把《對話錄》印了出來。
        who: david_hume
        bio: 他壓了二十多年的《對話錄》，在他去世后兩年之內由斯特拉恩印了出來，照的是他最後那份遺囑附件。
    vignettes:
      nails: '{staff}在面包鋪排隊，前面一個打釘的工人掏出一把鐵釘付賬，鋪主數了數就收下了。過了幾個禮拜，{staff}在一本今年春天出的厚書里讀到，蘇格蘭有個村子的工人至今拿釘子去面包鋪當錢用，對著那一頁笑出了聲。'
      post: '{staff}幫驛車夫捆寄往倫敦的郵包。有一封寫著印書商斯特拉恩先生收，比別的都厚，{staff}把它塞到最底下，免得淋了雨。'
      firth: '{staff}趁退潮在沙灘上走。福斯灣對岸，愛丁堡的炊煙壓得很低，旁邊拾貽貝的婦人說，那邊住的都是讀書的聰明人。'
  beethoven_vienna:
    name: 第九交響曲
    place: 維也納
    figure: 路德維希·凡·貝多芬
    story: 1824 年春天，幾乎全聾的貝多芬在維也納籌辦一場新作音樂會。合唱和樂隊分開排練，正式演出前只有兩次全體排練。5 月 7 日，《第九交響曲》在克恩特納門劇院首演，劇院樂長米夏埃爾·烏姆勞夫指揮，貝多芬在臺上站在他旁邊。5 月 23 日在大雷杜滕廳的第二場，聽眾稀落，票房讓他失望。
    relic: 一隻助聽喇叭
    relic_desc: 世界靜下來的時候，他舉到耳邊的號角。
    points:
      p1: 在合唱與樂隊第一次合排時把分開練過的開頭對齊，護住《第九交響曲》的首演
      p2: 給聽不見樂隊的貝多芬留一份合排記錄，讓他有機會在正式演出前回應
      p3: 趕在觀眾出城前替貝多芬找到愿意包座的人，救回第二場的票房
    points_fail:
      p1: 各組進場時對不上，首演臨場缺了一段，這條分支與史實脫節，員工被召回。
      p2: 演奏者在分譜上各記各的，合排里暴露的問題到上臺也沒有送給作曲者確認。
      p3: 再演時季節已過，空座多，貝多芬沒能靠這一場掙回應得的收入。
    shift:
      p1:
        was: 1824 年 5 月 7 日，貝多芬的《第九交響曲》在維也納首次演出。
      p2:
        was: 1824 年 5 月，首演籌備中，貝多芬借談話簿接收演奏者轉述的排練情況。
        now: '{staff}把幾處要緊的進拍問題寫在同一頁，請各聲部按貝多芬認可的記號重試。'
      p3:
        was: 1824 年 5 月 23 日，第二場音樂會在維也納舉行，票房不理想。
        now: '{staff}趕在潛在觀眾離城前落實一批預訂，把實收票款記入結算。貝多芬有余地繼續安排為自己籌款的演出。'
        who: beethoven_vienna
        bio: 貝多芬在維也納安排重演時有了預訂收入，演出開支不必全押給當天買票的人。
    vignettes:
      parts: '{staff}坐在抄譜人的桌邊，替他們壓平剛抄好的分譜等墨干。圓號的分譜還沒干透就被人搶去了排練廳，{staff}一下午都在給第二份吸墨漬。'
      prater: 星期天，{staff}在普拉特的林蔭長道上走。長椅上坐滿了出城透氣的人，賣香腸的嗓子都喊啞了，看不出有誰要去聽音樂會。
      stools: '{staff}在劇院后頭給合唱隊搬凳子。一個女高音揉著喉嚨說，末樂章那幾個高音寫得像要把人往天花板上拽，一排人都笑著點頭。'
  lovelace_london:
    name: 第一段程序
    place: 倫敦
    figure: 阿達·洛芙萊斯
    story: 1842 年，意大利工程師路易吉·梅納布雷亞用法文發表了一篇介紹查爾斯·巴貝奇分析機的文章。阿達·洛芙萊斯把它譯成英文，又加了七條注釋，篇幅約有原文的三倍；最後的注 G 寫出了這臺機器怎樣算伯努利數。1843 年 8 月，巴貝奇想在文中附上他對政府的不滿，編輯不肯不署名刊出，他便要她撤稿。她拒絕了，署名 A.A.L. 的譯文與注釋當年刊在《泰勒科學回憶錄》上。8 月 14 日，她提出由自己張羅造機器的事務，請巴貝奇專管工程，巴貝奇拒絕了她的條件。
    relic: 一張穿孔卡
    relic_desc: 一張打了孔的卡片，用來告訴機器做什麼。
    points:
      p1: 把洛芙萊斯親自同意付印的譯稿和注釋一起交給倫敦印坊，護住她在撤稿爭議中作出的決定
      p2: 趕在最後一次交校樣前，讓她和排字工把注 G 的表橫著讀一遍，逐列標出容易錯行的格子
      p3: 把她提議的分工抄成一份可交給潛在出資人的短約，由她組織聯絡，由巴貝奇負責工程，再請兩人議定第一次會面
    points_fail:
      p1: 印坊收到繼續付印與暫緩付印兩種指示，最後把譯稿與注釋一并從本期撤下。事務所因同步失敗召回員工
      p2: 排字工換過幾格符號，卻無人從頭對讀。她只能在最後幾小時重新查公式和對應的表格
      p3: 她寫給巴貝奇的建議止於回信。再有意向出資的人打聽時，雙方沒有一份他們都肯交出的工作安排
    shift:
      p1:
        was: 1843 年 8 月，巴貝奇要求她請編輯同意撤稿。洛芙萊斯拒絕，譯稿與署有她姓名縮寫的注釋同年合刊。
      p2:
        was: 洛芙萊斯 8 月 15 日寫給母親，說印坊臨時召她做最後一輪監督，數學公式的校對十分費力。
        now: 印坊留存一份她核過的逐列樣表。排字工再改動一格，就能用同一張樣表檢查鄰列。
      p3:
        was: 8 月 14 日，洛芙萊斯向巴貝奇提議由自己和合作者承擔組織事務，讓他專心工程。巴貝奇未接受這些條件。
        now: 兩人同意先請一位出資人看設計圖與費用草案。來客拿到一份分工清楚的說明，并約定工程評估后再決定是否承擔費用。
        who: lovelace_london
        bio: 洛芙萊斯同時寫譯稿和技術注釋。除了說明機器可以怎樣工作，她還試著為一項停在紙上的工程尋找繼續籌辦的辦法。
    vignettes:
      messenger: '{staff}在圣詹姆斯廣場一座宅子的門廊下等回信，當信差的規矩是不能坐。屋裡的人寫了劃，劃了又寫，天擦黑才把一封火漆還軟著的信塞到{staff}手裡，送多塞特街。'
      compositor: '{staff}幫排字工揀鉛字。排字工抱怨這一期滿版都是希臘字母、角標和架在行上的小數字，西格瑪那一格都快揀空了，寫這東西的人該自己來排。'
      loom: '{staff}在斯皮塔佛德一家織坊門口停下。提花機上的穿孔紙板一張接一張翻過去，絲面上慢慢起了一朵花。織工說，這些紙板比他還認得花樣。'
  mendel_brno:
    name: 豌豆與遺傳的規律
    place: 布爾諾
    figure: 格雷戈爾·孟德爾
    story: 1856 年到 1863 年，格雷戈爾·孟德爾在布爾諾住處的園子里雜交豌豆，一代代數它們的后代。1865 年 2 月 8 日和 3 月 8 日，他在布爾諾自然科學學會分兩場報告了結果，論文 1866 年刊在學會的會刊上。他生前，這篇論文幾乎沒人接著做下去。孟德爾 1884 年去世，1900 年，三位植物學家在研究遺傳時各自找到了他的論文。
    relic: 一隻豌豆莢
    relic_desc: 修道院花園里的一隻干豆莢。
    points:
      p1: 幫孟德爾把八年的計數拆成兩場講得完的報告，護住布爾諾學會的兩次宣讀
      p2: 把容易在口頭報告里混淆的兩代計數分開列給聽眾核對
      p3: 趁聽眾還在，替孟德爾約定一份異地復測，讓刊印前就有人回報自己的計數
    points_fail:
      p1: 首場念完時間只夠交代做法，第二場沒有排上。學會少了完整的兩次報告，事務所因同步失敗召回員工。
      p2: 聽眾帶走的是總數，回去后分不清哪些是第一代、哪些是下一代的觀測。
      p3: 報告傳到外地要等學會年刊和抽印本，讀者聽完以後也沒有約定誰來復測。
    shift:
      p1:
        was: 1865 年 2 月 8 日和 3 月 8 日，孟德爾在布爾諾自然科學學會分兩次報告豌豆雜交實驗。
      p2:
        was: 1865 年的兩次報告以多年豌豆計數為據，1866 年刊印的論文逐項列出各代結果。
        now: '{staff}請孟德爾在報告后留下分代對照表，聽眾可以拿自己抄的數字回來核對。'
      p3:
        was: 1866 年布爾諾學會刊印論文，孟德爾用抽印本同外地學者通信，討論結果能否驗證。
        now: '{staff}請愿意復測的人留下地址并約好回報的內容。下一季有人把自己的數字寄回布爾諾，孟德爾可以在年刊流通前把兩地結果對照。'
        who: mendel_brno
        bio: 孟德爾的報告後來隨年刊刊行。跟隨報告啟動的異地復測讓他較早收到一組可以獨立核對的結果。
    vignettes:
      straw: '{staff}幫看門人在會場門口鋪草墊。每雙靴子上的雪都化在地上，看門人說，這些先生寧可聽人講豌豆，也懶得在門口跺跺腳。'
      market: '{staff}在白菜市場幫一個老太太分揀干豌豆，圓的一堆，皺的一堆。她說圓的好賣。{staff}還是把兩堆都數了一遍，差不多三比一，自己先笑了。'
      furrow: 三月底，{staff}在城外的田埂上走。農人正把攢了一冬的糞攤開，說今年豌豆得早點下種，趕在倒春寒前頭。
  mendeleev_petersburg:
    name: 元素周期表
    place: 圣彼得堡
    figure: 門捷列夫
    story: 1869 年 3 月 1 日，德米特里·門捷列夫排好一張單頁的表，按原子量和化學上的相近把元素排成一個體系，印成散頁。3 月 18 日俄國化學學會開會時他不在場，由尼古拉·緬舒特金代為宣讀；會議記錄把討論推到下次會議，後來再沒有人提起。5 月，他給德國的期刊寄去一份短摘要，譯成德文時，表示性質周期性重現的詞被譯成了表示逐級變化的詞。
    relic: 一副元素卡片
    relic_desc: 手寫的卡片，可以像擺紙牌一樣擺。
    points:
      p1: 門捷列夫已經離城。把他留給緬舒特金的論文和附表合在一起交到會場，趕上俄國化學學會宣讀
      p2: 趁作者從外地回來，把下次會議原留待討論的一項重新排進議程，讓他逐一回應來問排表依據的人
      p3: 德文摘要付印前，請門捷列夫確認第一條結論的譯法，把表示性質周期性重現的詞改回去
    points_fail:
      p1: 報告人只接到附表，原稿還壓在門捷列夫的行李里。學會劃掉這一項，事務所因同步失敗召回員工。
      p2: 上一回記錄的待議事項留在舊頁上。到下次會議，沒有人再為元素表留一段可討論的時間。
      p3: 德文稿已送去排字。讀者看到性質逐級改變的說法，看不出作者強調性質隔一段會重現。
    shift:
      p1:
        was: 1869 年 3 月 18 日（俄歷 3 月 6 日），論文由緬舒特金代為宣讀。門捷列夫不在場，一說去特維爾省考察奶酪作坊，一說生病。
      p2:
        was: 會議記錄因作者缺席而延后討論，後來學會會議沒有接續討論這件事。
        now: 學會在下一次會上給門捷列夫留出回話的時間。他把幾處爭議欄圈出來，和提出疑問的人約定后續核查。
      p3:
        was: 1869 年的德文摘要將原文的周期性譯成表示逐步變化的詞。
        now: 發出的德文摘要寫明性質會周期性重現。一位只讀到摘要的通信者問起怎樣區分重現和例外，門捷列夫用自己的表逐項回覆。
        who: mendeleev_petersburg
        bio: 門捷列夫在圣彼得堡寫成早期元素表，經學會會議、散印表和期刊讓其他化學家見到它。俄文原稿的關鍵概念在跨語言傳遞時曾被改變。
    vignettes:
      flyers: '{staff}在印刷所幫忙，把剛印出的表一張張晾在繩上。排字工嘀咕，他排了半輩子版，沒見過這么多空格和問號的，問是不是那位先生忘了填。'
      neva: 涅瓦河的冰化了。{staff}擠在河岸上看一條小船從要塞劃向宮殿，旁邊的人說，那條船沒過河之前，誰也不許下水。
      samovar: '{staff}在客棧里學著從茶炊里接茶。掌柜說外國人總把龍頭擰反，燙了靴子，一邊說一邊盯著{staff}的腳。'
  curie_paris:
    name: 兩種新元素
    place: 巴黎
    figure: 瑪麗·居里
    story: 1898 年 4 月，瑪麗·居里報告說，瀝青鈾礦放出的射線比其中的鈾能解釋的更強。她與皮埃爾·居里在巴黎的工業物理化學學校把礦石一份份分開，追著射線走。1898 年 7 月 18 日，他們宣布發現一種新元素，以她的祖國波蘭命名為釙；12 月 26 日，又與古斯塔夫·貝蒙一起宣布了鐳。此后多年，他們一直徒手處理這些材料。瑪麗·居里 1934 年死於再生障礙性貧血，一般認為與她長年受輻射有關。
    relic: 一管瀝青鈾礦
    relic_desc: 一支裝著黑色礦石的玻璃管，在黑暗里有一點微光。
    points:
      p1: 在年末宣讀前把還待獨立驗證的幾份記錄對齊，護住第二份新元素報告
      p2: 用兩次報告為居里爭取一間能穩定工作的房間，替以後反復測量保住儀器和記錄
      p3: 從這時起讓瑪麗和皮埃爾隔著防護處理樣品，護住他們的手和身體，少受射線
    points_fail:
      p1: 交稿時獨立觀察與研究記錄對不上，年末沒有這份報告。事務所因同步失敗召回員工。
      p2: 幾個人還在臨時場地分著用臺面，遇到天氣壞時又要挪儀器、等場地。
      p3: 他們照舊徒手處理樣品，常年的射線落在兩人身上。
    shift:
      p1:
        was: 1898 年 12 月 26 日，巴黎科學院報告新的放射性物質，獨立光譜觀察隨同刊出。
      p2:
        was: 1898 年兩次報告之後，居里夫婦的后續研究仍在學校的簡陋場地進行。
        now: '{staff}把兩份成果和停工的記錄一并交給愿意協調場地的人。學院為接下來的測量騰出一間可長期使用的房間。'
      p3:
        was: 1934 年 7 月 4 日，瑪麗·居里死於再生障礙性貧血，一般認為與她長年受輻射有關。
        now: 從 1898 年起，兩人都隔著防護處理樣品，多年里受到的輻射少了許多。瑪麗後來的身體比歷史上好，又多工作了些年。
        who: curie_paris
        bio: 瑪麗·居里從 1898 年起在防護下做放射性研究，晚年沒有受到那樣重的輻射損傷，多工作了些年。
    vignettes:
      shed: 雨從學校院里那間棚屋的頂上漏下來。{staff}在漏處擺了幾隻盆，把一臺擺滿玻璃器皿的桌子挪開，角落里那只爐子幾乎烘不暖屋子。
      borscht: '{staff}在拉丁區一家小館子吃飯。鄰桌兩個波蘭學生用波蘭話爭得面紅耳赤，紅菜湯涼了也沒顧上喝。老板娘說，這一帶的波蘭人比塞納河邊的鴿子還多。'
      bookstall: '{staff}在塞納河邊的舊書攤上翻到一本講那種能穿過皮肉的新射線的小冊子。攤主說，這年頭的人，看不見的東西最肯掏錢。'
  freud_vienna:
    name: 一本書的兩個年份
    place: 維也納
    figure: 西格蒙德·弗洛伊德
    story: 1899 年 11 月 4 日，西格蒙德·弗洛伊德的《夢的解析》在維也納面世，出版商在扉頁上印了 1900 年。弗洛伊德後來說，這本書是他對父親去世的回應。首印六百冊，賣了八年才賣完，第二版到 1909 年才出。
    relic: 一張注明日期的書店存根
    relic_desc: 維也納一家書店的送貨單，日期是 1899 年 11 月，單上那本書的扉頁印著 1900 年。
    points:
      p1: 在書面世后無人問津的那幾周，把《夢的解析》送到會認真讀完它的同行手裡
    points_fail:
      p1: 書出來以後少有人理會，首印六百冊要八年才賣完。
    shift:
      p1:
        was: 1899 年 11 月 4 日，《夢的解析》在維也納面世，首印六百冊，扉頁印 1900 年，八年才賣完。
        now: '{staff}把書送到幾位同行手裡，他們那個冬天就讀完了全書。關於它的來信和爭論早來了好幾年，首印也不用等八年。'
        who: freud_vienna
        bio: 弗洛伊德那本講夢的書在頭一年就有了認真的讀者。他等了多年的討論，1899 年冬天就開始了。
    vignettes:
      window: '{staff}在內城一家書店的櫥窗前站了半天。那本講夢的新書擺在角上，翻開著扉頁，印的是 1900 年。店員出來擦玻璃，說這書要到明年才算新書，眼下先占個位子。'
      cafe: '{staff}在咖啡館從報架上取下幾份報紙，把書評欄翻了個遍，哪一份都沒提這本書。鄰桌的醫生說，三百多頁講夢的書，誰有工夫讀完，說完又叫了一杯咖啡，接著看他的報。'
      snow: 十二月底下了雪。{staff}幫書店的小伙計鏟門口的雪。伙計凍著手翻訂貨簿，說那本講夢的書這個月幾乎沒動，又問夢是不是夏天才好賣。
  cajal_barcelona:
    name: 神經細胞是一個個獨立的單位
    place: 巴塞羅那
    figure: 圣地亞哥·拉蒙-卡哈爾
    story: 1887 年底起，圣地亞哥·拉蒙-卡哈爾在巴塞羅那任組織學教授。1888 年 5 月，他自掏腰包印出自己期刊的第一期，寥寥幾十份大多寄給國外的研究者，可他們很少讀西班牙文。1889 年 10 月，他自費去柏林參加德國解剖學會的會議，把切片放在顯微鏡下給人看，會上資深的組織學家阿爾伯特·馮·克利克接過了他的研究。1906 年，他與卡米洛·高爾基分享諾貝爾獎。
    relic: 一支極細的繪圖筆
    relic_desc: 細到能畫出神經元每一條分支的筆。
    points:
      p1: 在公費未獲準時幫卡哈爾把旅費與玻片分包湊齊，保住柏林會上那次親手演示
      p2: 為難以進入外語期刊的圖文找一位合譯者，讓同業在會前就能按圖復核
    points_fail:
      p1: 自費湊不齊長途行程，卡哈爾只能把文字寄過去。柏林沒有那次演示，員工因同步失敗被召回。
      p2: 外地同行會后才有人設法讀懂西班牙文稿，復核仍得逐封通信。
    shift:
      p1:
        was: 1889 年 9 月 26 日，卡哈爾獲得出行許可，自籌旅費并在 10 月柏林會議上展示顯微切片。
      p2:
        was: 1889 年，卡哈爾自述先前的西班牙文研究在國外少受注意，柏林演示後來幫助傳播他的結果。
        now: '{staff}讓譯者同卡哈爾對照原圖校過短文，先寄給愿意核對切片的同行。演示之後，卡哈爾有一條持續寄發圖文的渠道。'
        who: cajal_barcelona
        bio: 卡哈爾在巴塞羅那為研究圖文建立了穩定的外語協作。後來的手稿可以先在國外找到愿意拿切片復核的同行。
    vignettes:
      stain: '{staff}幫一個學生把切好的小塊組織泡進重鉻酸鉀的罐子里。學生說這罐要原封不動泡到下禮拜，誰要是忍不住打開看，下一百張切片就歸誰切。'
      ticket: '{staff}陪學生去火車站問去柏林的車票。售票員報了價，學生吹了聲口哨，回來的路上一直掰著指頭算，這筆錢夠印幾期刊物。'
      rain: 十一月，巴塞羅那下起雨。{staff}幫學生把窗臺上晾著的一疊圖版收進屋，學生點了兩遍數，才肯把百葉窗關上。
  hammurabi_babylon:
    name: 刻在石頭上的法律
    place: 巴比倫
    figure: 漢謨拉比
    story: 約前 1754 年，漢謨拉比在位的晚年，一塊刻著近三百條法律的玄武巖石碑立了起來，此后幾百年，書吏一直把這些條文抄在泥板上傳習。前十二世紀，石碑被運到蘇薩，碑上有幾欄文字被磨去。1901 年，法國考古隊在蘇薩把它挖了出來，如今藏在盧浮宮，被磨掉的條文靠泥板抄本補回了一部分。
    relic: 一枚泥印滾筒
    relic_desc: 一個小石柱，在泥上一滾就留下簽名。
    points:
      p1: 幫書吏把石碑全文多抄幾塊泥板，送到別的城里存放，后世石上被磨掉的那幾欄也能讀全
    points_fail:
      p1: 全文照舊只有原來那些抄本，這條分支裡石碑被搬到蘇薩、磨去幾欄以後，還是有幾條法律再也讀不到。
    shift:
      p1:
        was: 公元前十二世紀，石碑被埃蘭人搬到蘇薩，碑文被磨去幾欄；靠泥板抄本補回了約三十條，其余至今不知道寫的是什麼。
        now: '{staff}幫書吏多抄了幾份全文，送到別的城里存放，這條時間線里石碑上的每一條法律都還讀得到。'
        who: hammurabi_babylon
        bio: IF 線里，漢謨拉比的法律一條不缺地傳了下來，石上磨掉的部分也沒有失去。
    vignettes:
      clay: '{staff}幫書吏學徒和泥。學徒說泥里的沙得淘乾淨，不然寫到一半，蘆管一按就裂，師傅又要他從第一行重抄。'
      river: '{staff}在幼發拉底河邊幫船夫卸大麥。船夫一邊數袋子一邊說，過秤的要是敢少算一袋，他就站到王的石碑跟前把那一條念給他聽，雖然碑上的字他一個也不認得。'
      roof: 日頭最毒的時候，{staff}和學徒把新抄的泥板擺到屋頂上曬。學徒挨塊數，數到一半亂了，又從頭數，生怕有一塊被鳥踩過。
  lalibela_rock:
    name: 沿巖溝找出口
    place: 埃塞俄比亞拉利貝拉
    figure: 拉利貝拉與石匠們
    story: 扎格韋王朝的拉利貝拉國王在位於 1181 年至 1221 年，以他命名的城鎮周圍有十一座向下鑿進巖石的教堂，連同溝渠、深槽和通道，都歸在他名下，各座教堂的確切年代並不確定。1520 年代，葡萄牙神父弗朗西斯科·阿爾瓦雷斯隨使團來到這裡，寫下歐洲人對這些教堂的第一份詳細記述。1978 年，巖鑿教堂列入世界遺產。
    relic: 石匠的鑿子
    relic_desc: 一把鐵鑿子，刃口磨得很薄。
    points:
      p1: 先讓石匠們認下，再替他們把鑿下的碎石運出深槽
      p2: 雨季前，沿巖溝找到出口，指給他們看哪里會積水
      p3: 雨季里，幫著把一整條溝渠從頭清到尾
    vignettes:
      outlet: '{staff}順著一條鑿在巖上的溝往下走，過了彎，找到它出巖壁的地方，用一塊碎石做了記號。'
      rain: '{staff}站在沒過腳踝的水里，把一筐筐淤泥遞上槽沿，一筐接一筐，直到天黑。'
      bend: '{staff}在一片碎紙上畫了個缺口，標出深槽的轉彎處，幫工第二天早上照著就能找到同一個彎。'
  ife_bronzes:
    name: 鑄好以後還能不能認出這道線
    place: 尼日利亞伊費
    figure: 伊費的鑄造匠人
    story: 約魯巴人的城市伊費，鑄匠們在約四個世紀里用銅合金鑄出寫實的頭像，多數估計在 1300 年前後。1910 年，德國人萊奧·弗羅貝尼烏斯逼一處圣林的祭司把一尊他稱作“奧洛昆頭像”的銅像賣給他，後來被迫交還。1938 年，人們在翁莫尼杰院落蓋房挖地時挖出一批頭像，其中一尊今藏大英博物館。1948 年倫敦的一場展覽上，有人說這些頭像足以與意大利和希臘最好的作品並列。
    relic: 一對線樣小圖
    relic_desc: 對照無像練習鑄樣上兩次所見的線。
    points:
      p1: 先讓鑄匠們認下，再用蠟捏一個練習模
      p2: 澆鑄那天，守著坩堝底下的火不讓它弱下去
      p3: 澆鑄之後，分辨哪道線是蠟模上刻的，哪道是後來添的
    vignettes:
      line: '{staff}把收面之前畫的小圖擺到今天的樣塊旁邊，後來多出的那一道劃痕，另畫在一張紙上。'
      surface: '{staff}把墊樣塊的木板略斜一斜，讓光順著它走，在紙上標出一道細線從哪里開始。'
      edge: '{staff}描了一遍沒有圖像的練習樣塊，旁邊另記下今天才看見的那一道線，下回比對就不用全靠記性。'
  great_zimbabwe:
    name: 圖上兩墻之間的路
    place: 津巴布韋馬斯溫戈
    figure: 大津巴布韋的建造者
    story: 大津巴布韋由紹納人的祖先建造，興盛於十一世紀到十五世紀。大圍場的弧形長墻用花崗巖逐層整齊壘起，兩墻之間有一條狹道通向錐形塔。1871 年，德國人卡爾·毛赫來到這片遺址。1980 年，國家以這座城為名，定名津巴布韋；1986 年，遺址列入世界遺產。
    relic: 一張兩墻間的草圖
    relic_desc: 圖上兩段墻之間留白，標的是能走的狹道。
    points:
      p1: 先讓砌墻的工匠認下，再替他們挑出大小合用的石塊
      p2: 走一遍兩墻之間的狹道，畫成圖，把路留成白
      p3: 旱季里，從河谷把水挑上山，給砌墻的人
    vignettes:
      lines: '{staff}把狹道畫成兩條線，中間留白，送信的人照著白處走，就不會去順著墻走。'
      width: '{staff}沿內墻走到它停下的地方，鉛筆也停在那裡，沒有把線順手繞滿一圈。'
      pace: '{staff}用步子量了一層石的長度，把數目刻在墻腳一塊平石上。'
  omar_khayyam_nishapur:
    name: 春天的第一天
    place: 波斯內沙布爾
    figure: 歐瑪爾·海亞姆
    story: 1070 年代，蘇丹馬立克沙在伊斯法罕建起天文臺，歐瑪爾·海亞姆是參與修訂歷法的天文學家之一。以蘇丹命名的賈拉利歷於 1079 年 3 月 15 日啟用，以春分定太陽年的開端。蘇丹 1092 年去世后天文臺關閉，這部歷法卻用了約八個世紀，它的變體今天仍在伊朗和阿富汗使用。
    relic: 一張有兩種題頭的歷表
    relic_desc: 一張對照表，新舊兩種新年并排寫著。
    points:
      p1: 春分前那幾天，護住觀測臺上定春分的日影讀數，讓新歷照定的日子啟用
      p2: 幫他把那部講開方的書多抄一份，送到別的城里收好，讓它在這條分支裡留下來
    points_fail:
      p1: 春分的讀數沒能對齊，新歷沒能在 3 月 15 日啟用。
      p2: 這部書照舊失傳，這條分支與歷史一樣。
    shift:
      p1:
        was: 1079 年 3 月 15 日，蘇丹馬立克沙的新歷照定的日子啟用，一年從春分開始。
      p2:
        was: 海亞姆那部論開方的書沒有傳下來，只在他的《代數》里留下一句提及。
        now: 有一份抄本被送到別的城里收進了書庫，幾百年后還有人讀得到。
        who: omar_khayyam_nishapur
        bio: 這條時間線里，他那部講開方的書沒有隨著歲月散失。存在別城的那份抄本，在他身後仍有人讀、有人轉抄。
    vignettes:
      spring: '{staff}把舊歷表和新歷表并排擺好，在每個日期旁寫明屬於哪種紀法，下一個讀表的人不用再猜。'
      carry: 一張折起來的紙，兩欄標題正好分在折痕兩邊。{staff}把兩種題頭抄到外面，帶著它的人不用打開也知道該比哪兩欄。
      future: '{staff}知道后人會怎樣寫這部歷法，可落下的日子還是用抄歷書的人用慣的紀法，不寫他們從沒見過的那一種。'
  ibn_battuta_tangier:
    name: 長途還只有第一站
    place: 摩洛哥丹吉爾
    figure: 伊本·白圖泰
    story: 多數說法是 1325 年 6 月 14 日，二十一歲上下的伊本·白圖泰離開家鄉丹吉爾，去麥加朝圣。他在《游記》里回憶，那天是獨自上路，既沒有同行的旅伴，也沒有可以隨行的商隊。約三十年後，1353 年底或 1354 年他才回到家鄉，把一路見聞口述給伊本·朱扎伊。
    relic: 一隻走舊的涼鞋
    relic_desc: 一隻補過很多次底的皮涼鞋。
    points:
      p1: 從貝賈亞往突尼斯那一路，護住他帶著高燒撐在鞍上，走到突尼斯
      p2: 在米利亞納救下那位病倒在暑熱里的突尼斯使節
      p3: 進突尼斯那天，讓他知道他在異鄉不是一個人
    points_fail:
      p1: 燒到一半他從鞍上栽了下來，這條分支裡他沒有走到突尼斯。
      p2: 那位使節照史實死在米利亞納外的溪邊，這條分支裡往突尼斯去的只剩一位使節。
      p3: 他照史實在城門口哭出聲來，這條分支裡那天陪他進城的只有那位同行的朝圣者。
    shift:
      p1:
        was: 1325 年夏天，伊本·白圖泰發著高燒從貝賈亞上路，一路撐到了突尼斯。
      p2:
        was: 1325 年夏天，突尼斯蘇丹的兩位使節在米利亞納都因暑熱病倒，其中一位在城外的溪邊停了三夜后去世。
        now: '{staff}在溪邊守著他降了溫、喝下了水，離開米利亞納時兩位使節都在隊伍里。他後來回到了突尼斯，此后的事沒有記載。'
      p3:
        was: 1325 年，進突尼斯那天沒有人上前問候他，他忍不住哭了出來。
        now: 進城那天他身邊多了一個一路認識的人，在突尼斯住下的兩個月里他不再是一個人。
    vignettes:
      distance: '{staff}把最遠的目的地寫在一張紙條上，今晚落腳的地方另寫一張，挑夫今天用得上第二張。'
      departure: '{staff}留著行李單上的題頭，底下空出一行，給旅人真正落腳的地方。'
      roll: '{staff}把目的和第一程各寫一條，卷在一起，到了城邊，把挑夫當天用得上的那張遞過去，自己留下另一張。'
  murasaki_kyoto:
    name: 世界上第一部偉大的長篇小說
    place: 京都
    figure: 紫式部
    story: 1008 年秋，中宮彰子生下皇子，侍奉她的紫式部在日記里記下了此后的幾個星期。皇子誕生第五十日的宴席上，有位公卿借《源氏物語》里的"若紫"向女官們搭話，這是這部物語見於記載的最早日子。十一月里，女官們挑紙、謄寫、裝訂《源氏物語》，好讓彰子帶回宮中；道長又從紫式部房里取走了她留著的稿本。她親筆的定本沒有傳下來。
    relic: 一隻漆制筆盒
    relic_desc: 一隻小盒子，裡面有筆、硯和水。
    points:
      p1: 按章分配抄紙，逐冊驗收給彰子的《源氏物語》抄本，護住這次成冊
      p2: 給想先讀的人準備一份她愿意借出的抄本，并把未定稿留在本人處，讓新抄人只按簽認本領書
    points_fail:
      p1: 抄完的章和待核章混裝，成套的書一直缺一冊，事務所因同步失敗召回員工。
      p2: 借去的仍是那份未定稿。後來的抄手不知道作者曾想再改。
    shift:
      p1:
        was: 紫式部的日記記有彰子身邊的人分紙抄寫《源氏物語》，道長為此提供紙筆。
      p2:
        was: 后世留存的是經長期傳抄下來的不同抄本，紫式部手定稿沒有傳到今天。
        now: 早期幾名讀者看到的是她核過的一套。以後各處傳抄仍會有變化，但這份借本記下了曾由她核過的章節。
        who: murasaki_kyoto
        bio: 紫式部在平安宮廷寫作。別人如何領紙、分抄和借閱，決定了一部未完全改定的作品怎樣進入宮外讀者手中。
    vignettes:
      banquet: 五十日宴的前一天，{staff}幫著沿回廊搬膳臺。一個女官壓低聲音說，明晚男賓喝多了，最愛拿物語里的名字逗女官，聽見了也只當沒聽見。
      paper: '{staff}幫一個女官把各色的紙按章分好，每摞壓上鎮紙。她說抄好的每一頁都得先送去核，字寫歪了就整頁重抄，紙還得重新去領。'
      snow: 臘月里下了雪。{staff}正在廊下掃雪，屋裡念物語的聲音念到一半停了，有人問，下一冊誰拿走了。
  sejong_hangul:
    name: 人人都學得會的字母
    place: 首爾
    figure: 世宗大王與學者們
    story: 1443 年，朝鮮世宗親制二十八個字母，用來書寫朝鮮語。1444 年二月，集賢殿的崔萬理與六位同僚聯名上疏，提出異議。1446 年，新字以《訓民正音》之名頒布，意為教百姓的正確字音。世宗於 1450 年去世。
    relic: 一塊刻著字母的木板
    relic_desc: 刻著最早幾個字母的木板，等著上墨。
    points:
      p1: 上疏那幾天，護住議事廳里用新字譯《韻會》的草稿，讓這件事照常往下做
      p2: 讓他親眼看到一個從沒念過書的百姓用新字寫出自己的名字
      p3: 在初水，減輕他的眼疾，讓他還看得清新字
    points_fail:
      p1: 譯稿在那幾天散了、停了，新字少了第一件用場。
      p2: 這條分支裡，他到頒布之前都沒見過一個百姓用上新字。
      p3: 他照舊帶著眼疾回宮，這條分支與歷史一樣。
    shift:
      p1:
        was: 1444 年二月，集賢殿用新字翻譯《韻會》的工作照常進行。
      p2:
        was: 1446 年，新字以《訓民正音》之名頒布，四年后世宗去世。
        now: 初水的行宮外有個攤主會寫自己的名字了，有人把這事報了上去。
      p3:
        was: 世宗多年患眼疾，1444 年春去初水養病，此后身體每況愈下，1450 年去世。
        now: 初水邊一個外鄉人幫他把眼睛治得輕了些，那年夏天他回宮時還能自己看奏章和新字的校樣。
    vignettes:
      gesture: '{staff}看見一位學士畫一個字母之前先比了比嘴形，便把嘴的樣子描在那個字母旁邊的頁邊上。'
      spacing: '{staff}把一張紙打成方格，讓一個音節的幾部分落在同一格里，什麼也沒說，放在了桌上。'
      lesson: '{staff}在集市上用樹枝在土里寫了三個字母給一個孩子看，孩子把它們念成一個音，轉身跑開了。'
  basho_hiraizumi:
    name: 奧州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 1689 年春，松尾芭蕉帶著弟子曾良從江戶出發，徒步走北方。農歷五月十三日，兩人從一關去平泉，當天往返：登上北上川邊的高館，由別當帶著看了中尊寺的光堂，經堂因為別當不在沒有開。芭蕉後來把這一路寫成《奧之細道》，平泉一節有詠夏草的俳句，書里寫兩座堂都開了。
    relic: 一頂草笠
    relic_desc: 被雨淋灰了的編織草帽。
    points:
      p1: 把曾良記下的回程站點和折返點核給兩人，護住芭蕉與曾良當天往返平泉的行程
      p2: 得知看守不在時，去確認當天有誰能帶訪客走外廊。先問當地人哪些地方可以看，再把路線交給兩位訪客
    points_fail:
      p1: 一條路指錯了來處，兩人到看舊跡的路口時已經趕不及往返。事務所因同步失敗召回員工。
      p2: 沒人知道看守何時回來，兩人只能從外側經過，入口仍關著。
    shift:
      p1:
        was: 曾良的行程日記記元祿二年農歷五月十三日，兩人從一關去平泉，當日折回。
      p2:
        was: 元祿二年五月十三日，曾良記別當帶路看了光堂，經堂因別當不在沒有開；芭蕉後來在紀行里寫兩座堂都開了。
        now: 附近的人確認經堂外廊可走，帶兩人從允許的地方看了經堂。芭蕉回到住處時，多了一處自己親眼看過的建筑細節。
        who: basho_hiraizumi
        bio: 芭蕉與曾良的平泉行程只有當天的一段時間。後來入書的寫法與曾良當日的路線記錄各有側重。
    vignettes:
      grass: '{staff}跟著兩個旅人登上高館。北上川在底下流，草長得齊腰高。年長的那位把斗笠鋪在地上坐下，半天沒出聲，年輕的那位在本子上記著什麼，{staff}不好開口，就陪著看河。'
      bath: '{staff}幫一關住處的主人挑水燒洗澡水。主人說那兩位客人今天去了平泉，回來準是一身汗；看舊跡看哭了回來的客人他見得多了，洗個澡就好。'
      sandal: '{staff}在一關的街口幫人系草鞋帶子。路過的腳夫說，往北的路這幾天全是泥，接著趕路的人最好先換一雙新草鞋。'
  tagore_santiniketan:
    name: 一首詩，讀兩遍
    place: 印度圣蒂尼克坦
    figure: 羅賓德拉納特·泰戈爾
    story: 1912 年 11 月，英文版《吉檀迦利》在倫敦出版，收的是羅賓德拉納特·泰戈爾自己從孟加拉語譯寫的散文詩。1913 年 11 月 13 日，瑞典學院把諾貝爾文學獎授予他。十天後，一列火車從加爾各答載來祝賀的人，到了他在圣蒂尼克坦的學校。他在答辭里說，自己不能毫無保留地接受這份以國家名義獻上的榮譽，許多來客帶著不快回去了。獎金給了學校，1921 年，學校成了國際大學。
    relic: 一本手抄的歌集
    relic_desc: 一本小小的歌本，是他的親筆。
    points:
      p1: 祝賀會散場後，勸回被他的答辭刺傷的來客，讓他和這些多半是朋友的人把話說開
    points_fail:
      p1: 來客照史實帶著怨氣散去，此后他與許多同胞之間照舊隔著一層，這條分支與歷史一樣。
    shift:
      p1:
        was: 1913 年 11 月 23 日，一列火車從加爾各答載來祝賀的人，泰戈爾在答辭里說，自己不能毫無保留地接受這份以國家名義獻上的榮譽，來客多半不快，此后他與許多同胞之間生了很深的隔閡。
        now: 那天傍晚，散去的來客里有幾位又被請回屋裡，和他坐下來把話說開。這場不快沒有從那天傳開去。
        who: tagore_santiniketan
        bio: 這條時間線里，1913 年那場祝賀會散場後，泰戈爾當晚就和來客把話說開，沒有因那篇答辭與同胞生出隔閡。
    vignettes:
      telegram: 消息傳來那天，{staff}幫孩子們往芒果樹下搬長凳。一個孩子爬上樹喊，全加爾各答都要坐火車來了，被老師揪了下來，還不服氣，說那總得有人先把凳子數夠。
      platform: 天擦黑，{staff}在博爾布爾車站幫一位來客找回落下的傘。他在月臺上攥著傘站了半天，火車進站時才問，詩人對客人說話一向是這樣的嗎。
      rice: 十二月，{staff}幫學校的廚子在院里攤曬米。廚子說，來看詩人的人一撥接一撥，今年的米下得比哪年都快。
  ramanujan_madras:
    name: 一封請人核算的信
    place: 馬德拉斯
    figure: 斯里尼瓦瑟·拉馬努金
    story: 1912 年 3 月起，斯里尼瓦瑟·拉馬努金在馬德拉斯港務局會計部當職員。1913 年 1 月 16 日，星期四，他從那裡給劍橋的 G. H. 哈代寫信，介紹自己的研究和對發散級數的探索。1914 年他去了英國，1920 年病重回到印度后去世。
    relic: 一塊石板
    relic_desc: 一塊學生用的石板，寫了擦、擦了寫好多次。
    points:
      p1: 餓著肚子熬夜演算的那幾個星期，護住他的身體，讓 2 月 27 日給哈代的回信寫成寄出
      p2: 獎學金下來之前，幫他一家撐過每月三十盧比的日子
      p3: 在他動身去英國之前，看出他身上反復發作的舊病，把它治好
    points_fail:
      p1: 2 月 27 日那天他倒在燈下，回信沒有寫成，哈代那邊等不到下文。
      p2: 這條分支裡，他每晚的演算之外還壓著一家的飯錢，記錄里少這一行。
      p3: 他照舊帶著病根遠行，1917 年病倒，1920 年在貢伯戈訥姆去世，這條分支與歷史一樣。
    shift:
      p1:
        was: 1913 年 2 月 27 日，拉馬努金寫成給哈代的回信寄出，信里說自己已經半餓著肚子。
      p2:
        was: 1913 年 5 月獎學金下來之前，一家靠每月三十盧比的薪水過活。
        now: 那幾個月家里的米缸沒有見底。
      p3:
        was: 他 1917 年在英國病重，診斷一直沒有定論，1919 年回到印度，第二年 4 月去世，年僅 32 歲。
        now: 馬德拉斯的一位外鄉人認出了他身上的舊病，在他遠行之前治好了。他後來在劍橋沒有住進療養院，回到印度以後又做了很多年數學。
    vignettes:
      sums: 一排寫不完的正整數旁邊只寫了一個總數。{staff}算出前幾個部分和，1、3、6、10，給這一欄另起了題頭。
      future: '{staff}知道這封信日后會被人怎樣談起，只問頭一回拆信的人能看懂什麼，便把說明的那頁放在了最前面。'
      address: 捆紙包前，{staff}請幫工把封套上的地址念一遍，又在自己的紙條上記下日期。
  wright_kitty_hawk:
    name: 在空中的十二秒
    place: 北卡羅來納基蒂霍克
    figure: 奧維爾和威爾伯·萊特
    story: 1903 年九月，萊特兄弟帶著一架裝了發動機的飛機回到基蒂霍克附近的營地。12 月 14 日威爾伯的嘗試沒有成功。12 月 17 日上午他們飛了四次，第一次 12 秒，最後一次 59 秒。當天下午，兄弟倆走到基蒂霍克，給代頓的父親發了電報。
    relic: 一片螺旋槳葉
    relic_desc: 一片木頭葉子，像一隻扭過的翅膀。
    points:
      p1: 12 月 17 日上午的冷風里，幫兄弟倆穩住飛行者號，護住第一次起飛
      p2: 第四次飛行落地后，把飛行者號按在沙地上，救下丹尼爾斯和這架飛機
    points_fail:
      p1: 起飛前一陣風把一側機翼掀起來擦了沙，飛機沒離開滑軌，這條分支裡沒有那 12 秒。
      p2: 風把飛行者號掀翻，丹尼爾斯被卷在機翼里滾了出去，飛機照史實壞得再也飛不了。這條分支裡，這架飛機在那天下午之後沒有再離開過地面。
    shift:
      p1:
        was: 1903 年 12 月 17 日上午，奧維爾飛了 12 秒，120 英尺。
      p2:
        was: 1903 年 12 月 17 日，第四次飛行后一陣風掀翻了飛行者號，約翰·丹尼爾斯被卷在機翼中間，飛機損壞嚴重，從此再沒飛過。
        now: '{staff}和救生站的人把它按在了沙地上，丹尼爾斯沒被卷進去。那年冬天，兄弟倆又讓它在沙丘上飛了幾回，才把它裝箱運回代頓。'
    vignettes:
      numbers: 天黑之前，{staff}把四次飛行按先后抄進本子，秒數一欄，英尺一欄，加了兩遍。
      sand: 夜里風大，{staff}把滑軌從沙里刨出來，在滑軌腳下把沙踩平。一位編出來的救生站幫手說，天亮風就會停。天亮了，風沒停。
      cold: 發動機預熱時，{staff}在棚里守著爐子。外頭的水洼結了冰，誰也沒提。
  sequoyah_syllabary:
    name: 一個人造出來的文字
    place: 美國東南部切羅基地區
    figure: 塞闊雅
    story: 切羅基銀匠塞闊雅為切羅基語造了一套八十多個符號的音節文字。1821 年，他在切羅基全國議會上演示這套文字確實能用，議會接受了它。1828 年 2 月 21 日，第一份美洲原住民報紙《切羅基鳳凰報》在新埃喬塔出了創刊號，切羅基文和英文并排印。1843 年 8 月，塞闊雅在墨西哥去世。
    relic: 一張音節表
    relic_desc: 一張紙，八十多個字符排成行。
    points:
      p1: 演示那天，攔下把這套文字當成巫術的指控，護住他和六歲的阿約卡
      p2: 減輕他那條跛腿的疼，讓他走得動去各鎮教字
      p3: 幫他的妻子把荒下的地種起來，勸住家里因為這套文字而起的爭執
    points_fail:
      p1: 指控壓過了演示，阿約卡沒被叫回來念出那個詞，這條分支裡沒人看見這套符號能把話傳出去。
      p2: 那條腿照舊疼著，這條分支裡他每走一段路都要停下來歇。
      p3: 地照舊荒著，家里人照舊勸他放手，這條分支裡，這套文字仍舊是這個家多年的代價。
    shift:
      p1:
        was: 1821 年，切羅基全國議會上，塞闊雅與女兒阿約卡演示這套符號，議會接受了它。
      p2:
        was: 塞闊雅一條腿跛，走路吃力，起因各說不一。
        now: 他那半年腿疼得輕了些，去鄰鎮教字的路走得快了些。
      p3:
        was: 他多年把地里的活丟給妻子，家里人一再勸他放下造字，妻子還燒過他的稿子。
        now: '{staff}那半年替這個家把地種了下來，家里的爭執少了。後來，他的妻子也學會了用這套符號寫字。'
    vignettes:
      sound: '{staff}聽一個學字的人照平常的快慢念一個詞，再慢慢念一遍，一個音節指一個符號，直到他自己能指著念下去。'
      lookalike: '{staff}看出有個符號長得像英文字母，把旁邊鉛筆標的那個字母劃掉了，免得把人帶偏。'
      note: '{staff}捧著一張紙條穿過議會的空地，交給一個沒聽見口述的人，站在旁邊聽他念出來。'
  galois_paris:
    name: 決斗前夜
    place: 巴黎
    figure: 埃瓦里斯特·伽羅瓦
    story: 1832 年 4 月 29 日，埃瓦里斯特·伽羅瓦在巴黎獲釋出獄。5 月 29 日夜里，他給朋友奧古斯特·舍瓦利耶寫信，概述自己關於哪些方程能用根式求解的發現，托他把信刊出。第二天清晨，他在決斗中腹部中槍，被丟在原地，5 月 31 日死在科欽醫院，年僅二十歲。那年九月，舍瓦利耶刊出了這封信。十四年後，約瑟夫·劉維爾刊出了他的論文。
    relic: 一封匆忙寫就的信
    relic_desc: 寫滿算式的信頁，頁邊寫著沒有時間了。
    points:
      p1: 5 月 29 日夜里趁伽羅瓦還能逐頁核對，把寫給舍瓦利耶的信和信中提到的論文分別包好，送到收信人手上
      p2: 趁九月刊信，請編輯一并刊出手稿索引，約一位能逐頁核查的數學同行先讀留存稿
      p3: 5 月 30 日清晨決斗以後，立刻把伽羅瓦送到醫生手裡，救下中了腹部一槍的他
    points_fail:
      p1: 約定的交接一再推遲，信與待寄的草稿被分開。舍瓦利耶收不到 5 月 29 日的信，事務所因同步失敗召回員工。
      p2: 九月的刊物只有信件。愿意往下核對的人仍須先找到保管手稿的朋友。
      p3: 他中槍后被丟在原地，直到有路人發現，5 月 31 日死在科欽醫院，年僅二十歲。這條分支裡此后沒有伽羅瓦。
    shift:
      p1:
        was: 伽羅瓦 1832 年 5 月 29 日寫信給奧古斯特·舍瓦利耶，概述研究，并托他處理稿件和刊出書信。
      p2:
        was: 信在 1832 年 9 月刊出。舍瓦利耶到 1843 年才把若干稿件交給劉維爾，劉維爾於 1846 年刊行。
        now: 九月讀到這封信的同行可以按刊出的索引申請借看一份抄本。所提問題和對應頁碼回到舍瓦利耶手中，給下一輪審閱留下記錄。
      p3:
        was: 1832 年 5 月 30 日，伽羅瓦在決斗中腹部中槍，被丟在原地；5 月 31 日他死在科欽醫院，年僅二十歲。
        now: '{staff}幾分鐘內趕到，止住了血，又沒讓傷口感染。伽羅瓦活了下來，回到數學上，親自向那些沒讀懂他的數學家講清自己的理論。'
        who: galois_paris
        bio: 伽羅瓦挺過了 1832 年 5 月的決斗。他在巴黎繼續做數學，生前就看到自己關於方程的理論被人讀懂、討論。
    vignettes:
      candle: 5 月 29 日夜里，{staff}替看門的老婦人往樓上送第二支蠟燭。她嘟囔說，這位年輕先生的燈從天黑亮到現在，墨水也是從她這兒借的，回頭得記進賬里。
      cart: 5 月 31 日，{staff}在科欽醫院門口幫一個車夫卸柴。車夫說，昨天抬進去一個年輕人，今早就蓋上了布。他往這兒送了十年柴，最受不了的就是這種天氣好的早上。
      type: 夏末，{staff}在一家小印坊里幫著撿撒了一地的鉛字。排字工抱怨這一期有封信滿紙算式，等號得一個個從隔壁字盤里借。
  van_gogh_auvers:
    name: 奧維爾的夏天
    place: 奧維爾
    figure: 文森特·梵高
    story: 1890 年 5 月 20 日，文森特·梵高來到瓦茲河畔奧維爾，住進拉武客棧，常去看保羅·加歇醫生。他幾乎一天畫一幅。約 7 月 10 日的一封信里，他寫到不安的天空下大片的麥田。7 月 27 日，他朝自己胸口開了一槍，7 月 29 日去世，弟弟提奧在他身邊。
    relic: 一管鉻黃顏料
    relic_desc: 一支擠癟的錫管，裡面是他畫麥田用的那種黃。
    points:
      p1: 暴風雨般的天空下，幫他把那幅麥田畫完，不讓畫布倒進麥田
      p2: 從巴黎回來以後，幫他把提奧一家的錢和生計問清、說開，不讓那場風暴壓在他身上
      p3: 讓他知道自己的畫會被記住
      p4: 7 月 27 日之前，治好他的身體和心病，讓他活下來
    points_fail:
      p1: 那幅畫在風里倒進了麥田，這條分支裡沒有《麥田上空的烏云》。
      p2: 他從巴黎回來，照舊覺得那場威脅提奧的風暴也壓在自己身上，這條分支裡沒有人幫他把錢的事理清。
      p3: 他照舊覺得自己的畫是提奧的負擔，這條分支裡沒有人告訴過他這些麥田後來的去處。
      p4: 7 月 27 日照史實發生，這條分支裡他沒能多畫一個季節。
    shift:
      p1:
        was: 1890 年 7 月初，梵高在不安的天空下畫成了大片的麥田，7 月 10 日前後寫信給提奧和喬說起它。
      p2:
        was: 1890 年 7 月初，梵高去巴黎看提奧一家，得知提奧想辭去做了多年的畫廊職位、自己開業；回奧維爾后他寫信說，那場威脅提奧的風暴也壓在自己身上。
        now: 他從巴黎回來時已經知道提奧家撐得住，回到麥田里畫畫時，心上少壓了一件事。
      p3:
        was: 1890 年 7 月，梵高在信里說覺得自己是個失敗者，看不到好的前途；他生前賣出的畫很少。
        now: 有人告訴過他，這些麥田以後會掛在博物館的墻上，有很多人專程去看。
      p4:
        was: 1890 年 7 月 27 日他受了槍傷，兩天后在奧維爾去世，只畫了大約十年。
        now: '{staff}陪他過了那個七月，病沒有再把他壓垮，那個夏天過去時他還在拉武客棧。他又畫了幾年，麥田之後還有別的季節。'
    vignettes:
      sky: '{staff}在本子上把同一片田畫了兩遍，頭一遍只留一條天，第二遍留得多，從第二幅里看出了頭一幅藏住的東西。'
      wind: '{staff}等下一陣風吹過麥田，看著那塊暗影從田上移過去，沒有擦掉頭一眼畫下的。'
      path: '{staff}沿著田間小路一直走到看得見盡頭的地方，回來時已經說得清它通到哪里。'
  abel_froland:
    name: 一道算得出的五次方程
    place: 弗羅蘭
    figure: 尼爾斯·亨里克·阿貝爾
    story: 1828 年圣誕，尼爾斯·亨里克·阿貝爾受著寒、咳著嗽坐雪橇來到弗羅蘭鐵廠看望未婚妻，此后在那裡臥床十二周。1829 年 1 月 6 日，他寫下最後一篇論文，兩三頁，重述他交給巴黎科學院的那篇長稿的要點。4 月 6 日，他死於肺結核，二十六歲。兩天後，尚不知情的奧古斯特·利奧波德·克雷勒從柏林來信，說替他謀的職位已經落實。
    relic: 一封封著的信
    relic_desc: 一封沒拆開的聘書，用細線系著。
    points:
      p1: 在阿貝爾病中寫最後一篇短稿時，幫他把證明核對到可以寄出
      p2: 趁短稿還在手邊，幫阿貝爾把它同巴黎長稿的投遞記錄對上，給找稿的人留下索引
      p3: 阿貝爾在弗羅蘭臥床的十二周里，替他擋住屋裡的冷，減輕他的咳嗽和病痛
      p4: 請替阿貝爾奔走的人先寄一封進展信，讓他生前知道柏林還有人為他的職位努力
    points_fail:
      p1: 短稿停在校對之前，巴黎長稿的要點也沒有這份及時的公開記錄。行程同步失敗，員工被召回。
      p2: 尋找巴黎長稿的人只知道大致題目，仍要從舊收件記錄一頁頁找。
      p3: 冷和咳嗽沒人減輕，這條分支裡他在弗羅蘭的最後幾周和原來一樣難熬。
      p4: 弗羅蘭一直等不到柏林的消息，正式的好消息來得太晚。
    shift:
      p1:
        was: 1829 年 1 月 6 日，阿貝爾在弗羅蘭寫下最後一篇數學短稿，重述巴黎長稿的主要結果。
      p2:
        was: 1829 年前後，阿貝爾重述巴黎長稿的要點，原稿一度難尋，直到 1841 年才印行。
        now: '{staff}把短稿和舊投遞日期對在一處，兩邊各留一份索引。以後查稿的人能憑交件記錄縮小範圍。'
      p3:
        was: 1828 年圣誕，阿貝爾受著寒、咳著嗽坐雪橇到弗羅蘭，隨後開始咳血，此后在那裡臥床十二周。
        now: '{staff}守著爐火，把床鋪焐暖，最難熬的幾夜一直坐在床邊。阿貝爾最後幾周少受了些罪。'
      p4:
        was: 1829 年 4 月 6 日阿貝爾去世，柏林確認職位的信於兩日后寫成。
        now: '{staff}請聯系人先把奔走過程寫回弗羅蘭。阿貝爾讀到朋友們正在為他爭取職位，知道這件事還有人在做。'
        who: abel_froland
        bio: 阿貝爾去世前收到柏林朋友奔走的進展，知道他們還為他留著繼續研究的機會。正式任命仍在他去世之後。
    vignettes:
      firewood: 二月最冷的那幾天，{staff}幫廚房女傭往樓上搬劈柴。女傭說，樓上那位先生咳一夜，她就在樓下數一夜，數到天亮也沒數清。
      sledge: 一月，{staff}幫馬夫給雪橇換一根斷了的轅木。馬夫說圣誕那趟從城里接來一位先生，裹著三層毯子一路咳，下車時連自己的箱子都提不動，是他扛上樓的，賞錢他沒要。
      post: 四月，{staff}幫鐵廠的賬房先生分揀郵包。他翻出一封蓋著柏林郵戳的信，對著窗戶看了半天，說這一封來得不巧，收信的人已經不在了。
  riemann_selasca:
    name: 最後一篇論文
    place: 塞拉斯卡
    figure: 伯恩哈德·黎曼
    story: 1862 年秋，伯恩哈德·黎曼受了一場重寒，轉成肺結核，此后幾次南下意大利養病。1866 年 6 月，他第三次來，住進馬焦雷湖畔的塞拉斯卡。7 月 19 日，他在無花果樹下休息，仍在寫最後一篇論文，沒有寫完。第二天，他在那裡去世，三十九歲。十年後，他的全集出版，理查德·戴德金參與了編訂。
    relic: 一頁筆記
    relic_desc: 一頁寫著沒完成公式的紙，字很小。
    points:
      p1: 他在塞拉斯卡力氣一天天衰下去時，替他記下口述、理好稿頁，幫他把最後那篇論文往下寫一段
      p2: 治好拖垮他的肺結核，救下黎曼
    points_fail:
      p1: 最後那篇論文照史實停在原處。
      p2: 他照史實在 7 月 20 日死在塞拉斯卡，這條分支裡也沒能留住他。
    shift:
      p1:
        was: 皇家學會悼文和戴德金的記述都說，去世前一天他在塞拉斯卡的無花果樹下休息，仍在寫最後那篇論文，論文沒有寫完。
        now: 最後那篇論文用他自己的話多寫了幾頁，後來連同這幾頁一起印出。
      p2:
        was: 1866 年 7 月 20 日，黎曼在馬焦雷湖畔的塞拉斯卡死於肺結核，三十九歲。
        now: '{staff}帶去的藥治好了從 1862 年起拖著他的病。那年秋天他回到北邊，又在哥廷根上起了課。'
        who: riemann_selasca
        bio: 這條時間線里，黎曼在 1866 年夏天治好了肺結核。他回到哥廷根，又工作了許多年。
    vignettes:
      figs: 7 月 18 日傍晚，{staff}幫房東的小女兒把無花果樹下的落果撿乾淨。她說樹下那把椅子是給德國先生擺的，漏掉一個，他的稿紙就要染成紫的。
      boat: 七月初，{staff}幫湖上的船夫把一船檸檬卸到帕蘭扎碼頭。船夫說今年夏天湖上的船少了一半，年輕人都被叫去當兵了，他只好教老婆劃槳。
      chair: 八月，{staff}幫房東把無花果樹下那把椅子搬進屋。房東用袖子擦了又擦，說這樹從沒結過今年這么多的果子，樹底下卻沒人坐了。
  du_chatelet_luneville:
    name: 法語版牛頓
    place: 呂內維爾
    figure: 埃米莉·杜·夏特萊
    story: 1749 年夏，埃米莉·杜·夏特萊住在呂內維爾斯坦尼斯瓦夫的宮廷里待產，手上是快要完成的牛頓《原理》法譯和評注。9 月 4 日，她生下一個女兒。9 月 10 日，她去世，四十二歲，死因一說產褥熱，一說肺栓塞。同一天，巴黎的王家圖書館為她寄存的三包評注稿簽了收據。1759 年，法譯全本出版。
