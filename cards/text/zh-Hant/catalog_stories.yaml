      p2: 請她把最難厘清的兩項留給克萊羅，說明哪里要保留原譯，哪里需另列后續校改
      p3: 產后那幾天守著她，治好她的病，讓她活下來
    points_fail:
      p1: 夾有評注的稿包留在宅邸，圖書館只收到信，事務所因同步失敗召回員工。
      p2: 兩份相關草稿一起送達，改過的位置卻沒有留下她想怎樣印的說明。
      p3: 9 月 10 日，她在呂內維爾去世，離生下女兒只有六天。
    shift:
      p1:
        was: 1749 年 9 月 10 日，王家圖書館為杜·夏特萊寄存的三包牛頓評注稿開出收據。
      p2:
        was: 1759 年，法語全本出版，杜·夏特萊去世后由克萊羅參與整理。
        now: 編輯手裡有她核過的兩份決定，後來附上的修改在另頁說明。讀者可以區分她的評注與編輯的補充。
      p3:
        was: 1749 年 9 月 4 日夜里，杜·夏特萊生下一個女兒，9 月 10 日在呂內維爾去世，死因一說產褥熱，一說肺栓塞。
        now: 她熬過了產后那幾天，秋天里身體慢慢復原。她親自看著牛頓譯本付印，此后又做了多年研究。
        who: du_chatelet_luneville
        bio: 杜·夏特萊在 1749 年產后活了下來，親自把牛頓《原理》的法譯與評注送進印坊，此后繼續寫作與研究多年。
    vignettes:
      stairs: 9 月 4 日一早，{staff}幫洗衣房的姑娘把一摞乾淨布巾送上樓。姑娘說樓上半夜就點了燈，她躺著數樓梯上的腳步，到天亮一共跑了十一趟。
      candles: 八月底，{staff}幫宮里管蠟燭的老仆清點庫房。老仆說侯爵夫人屋裡的蠟燭比國王的書房還費，他這個月得提前一周報賬。
      arbour: 十月，{staff}幫園丁把涼亭的簾子收起來。園丁說宮里今年秋天靜得早，往年這時候還在這兒排戲。
  noether_gottingen:
    name: 署著別人名字的課
    place: 哥廷根
    figure: 埃米·諾特
    story: 1915 年，大衛·希爾伯特和費利克斯·克萊因把埃米·諾特請到哥廷根，可大學不讓女性取得任教資格，從 1916 年冬季學期起，她的課在課表上署的是希爾伯特的名字。1918 年 7 月 26 日，克萊因把她的論文《不變變分問題》呈交給哥廷根科學學會，9 月底她交了終稿。這篇論文把每一種連續對稱性與一個守恒量聯系起來。1919 年 6 月，她獲準任教，直到 1923 年才第一次領到一小筆固定的教學薪酬。
    relic: 一張課程通告
    relic_desc: 一張廳里的通告，應該寫她名字的地方寫著希爾伯特。
    points:
      p1: 把諾特署名的文稿和提要同時交到克萊因手上，讓他能按期將論文呈交給哥廷根學術團體
      p2: 把本學期由諾特實際授課的記錄和署名論文一并交給系里，請系里先為下一輪討論課核定課酬，再隨新申請存檔
    points_fail:
      p1: 名冊上只有呈交人的名字，講義與作者頁沒能對回同一份。會議把論文退到下一次，事務所因同步失敗召回員工。
      p2: 系里同意有人繼續帶討論課，但依然用原來的排課辦法，沒有經費支付諾特這部分工時。
    shift:
      p1:
        was: 1918 年 7 月 26 日，費利克斯·克萊因在哥廷根的一次會議上呈交《不變變分問題》。印本所署作者是埃米·諾特。
      p2:
        was: 諾特於 1919 年獲任教資格，哥廷根大學記錄她到 1923 年才取得帶少量固定薪酬的教學任務。
        now: 系里在任教資格重審前先撥了一小筆課酬，按實際開課支付。這個學期愿意跟她做題的學生因此有一段固定的時間可來。
        who: noether_gottingen
        bio: 哥廷根的任教規則曾讓諾特的第一份申請受阻。她仍開展研究，後來以一系列論文和自己的課堂培養學生。
    vignettes:
      notice: 冬季學期開課前，{staff}幫工友往布告欄上釘課表。工友指著一行念：希爾伯特教授，在諾特博士協助下。他說這一行他釘了好幾個學期，進教室講課的一直是那位女博士。
      turnips: 十月，{staff}幫房東太太在后院挖蘿卜。她說城里流感又起來了，學生公寓空了一半，面包票她早就不數了，反正也沒什麼可數的。
      snow: 十二月底，{staff}幫數學樓的門房掃臺階上的雪。門房說打完仗回來的學生太多，講堂里沒座位了，有人站在走廊里聽。
  boltzmann_duino:
    name: 同一個數，幾種排法
    place: 杜伊諾
    figure: 路德維希·玻爾茲曼
    story: 1877 年，路德維希·玻爾茲曼數出同一種能量分布可以有多少種排法，把熱的規律和原子的統計聯系起來，可直到二十世紀初，原子是否真實存在仍有許多人懷疑。1906 年 5 月，他因所謂嚴重的神經衰弱停課，夏天和家人到的里雅斯特附近的杜伊諾度假。9 月 5 日，他在那裡去世，六十二歲。兩年後，讓·佩蘭的布朗運動實驗開始證實愛因斯坦的預言，原子漸漸被人接受。
    relic: 一截粉筆
    relic_desc: 一截用得很短的講課粉筆。
    points:
      p1: 讓他知道，原子的存在過不了幾年就會被實驗證實，他為之爭了半輩子的學說站得住
      p2: 在杜伊諾的假期結束之前，治好他的病，讓他回到維也納
    points_fail:
      p1: 他照舊在懷疑聲里過完這個夏天，這條分支裡沒有人告訴過他布朗運動的實驗會替原子作證。
      p2: 9 月 5 日照史實發生，這條分支裡他沒有回到維也納的講臺。
    shift:
      p1:
        was: 1906 年 9 月 5 日玻爾茲曼去世時，原子是否真實存在仍有不少物理學家和化學家懷疑；1908 年起佩蘭的布朗運動實驗驗證了愛因斯坦 1905 年的預言，原子才被普遍接受。
        now: 那個夏天他已經知道，原子的事過幾年就會有人用實驗定下來。
      p2:
        was: 1906 年 5 月玻爾茲曼因病停課，課由斯特凡·邁爾代講；同年 9 月 5 日他在杜伊諾度假時去世，終年六十二歲。
        now: '{staff}陪他過了杜伊諾的那個夏天，病一點點緩下來。秋天他帶著家人回到維也納，又站上了講臺，還親眼看到原子被實驗證實。'
        who: boltzmann_duino
        bio: 這條時間線里，玻爾茲曼 1906 年秋天病好了回到維也納，又教了幾年書，看到了佩蘭的實驗讓原子學說被普遍接受。
    shift_all: 他知道自己的學說站得住，病也好了，秋天回到維也納接著講課。
    vignettes:
      pebbles: 七月，{staff}在海灘上幫漁夫的小兒子數一桶小石子。孩子問，太小、數不清的東西，是不是就不算有。{staff}說沒人數它也在那兒。孩子想了想，又往桶里扔了一把。
      nets: 七月初，{staff}幫漁夫把晾在岸邊的網收起來。漁夫說這一灣斯洛文尼亞話、意大利話、德國話都聽得到，魚可不管你用哪種話罵它。
      towels: 八月，{staff}幫旅館的女招待把海邊晾乾的浴巾收回來。她說今年海水暖得早，城里來的客人一住就是一整季，她的手讓鹽水泡得起了皮。
  tesla_wardenclyffe:
    name: 那一行寫著擬建
    place: 長島肖勒姆
    figure: 尼古拉·特斯拉
    story: 1901 年 3 月，J.P. 摩根答應出資十五萬美元，給尼古拉·特斯拉建一座無線電站。建筑師斯坦福·懷特設計了長島沃登克里弗的房子，這一年特斯拉為塔和實驗樓幾次寫信給他。9 月工地動工。12 月，馬可尼收到了一個越過大西洋的信號。1902 年 6 月，特斯拉把實驗室搬進磚樓；1903 年 7 月，摩根回信說不再追加款項。1917 年，塔被炸掉。
    relic: 一份圖紙副本
    relic_desc: 一張沃登克里弗圖紙的副本，折了兩道，折角底下有鉛筆寫的日期。
    points:
      p1: 九月收到超支估價后，在沃登克里弗把舊圖及修訂圖分別簽收，護住當年仍能開工的建筑
      p2: 請懷特把已能確定的實驗樓工程和仍待換報價的塔身分開給工頭，兩套賬各有一頁
      p3: 請特斯拉帶已經確認的工價向出資人提出分段撥款，讓未來幾個月的基礎工程有獨立的付款約定
    points_fail:
      p1: 包工人只按舊圖估價，沒人能確定接受哪套尺寸，工地取消本季安排，事務所因同步失敗召回員工。
      p2: 一份報價把樓與塔的工錢都合在一欄，後來無法據賬看出哪部分已經承諾。
      p3: 兩部分仍等同一輪籌款。后續遇到缺口時，工人不知道哪些工作能拿到錢。
    shift:
      p1:
        was: 1901 年特斯拉與建筑師斯坦福·懷特討論估價和設計。沃登克里弗在當年動工。
      p2:
        was: 沃登克里弗包括實驗樓和塔，在改預算的通信里能看到多次設計修改。
        now: 工頭在開工前就能把兩部分各自結算，塔的改價也有前一輪可對照。
      p3:
        was: 工程最初得到摩根資助，之後未能取得足夠的后續資金，計劃未按設想完成。
        now: 書面約定先付清已確認的一段基礎工程。往後資金不夠時，工地能結清這部分，并把尚無款項的工作標出來。
        who: tesla_wardenclyffe
        bio: 特斯拉把沃登克里弗設想為無線通信和輸電系統的一環。建設過程還要面對各輪報價、籌款和施工安排。
    vignettes:
      timber: 十月初，{staff}幫一個車夫把一車木板拉上通往工地的沙路，輪子每陷一回，就拿肩膀頂一回后擋板。車夫說路那頭的農戶已經拿這邊的錘子聲給母雞定鐘點了，工地歇工那幾天，雞下蛋下得最勤。
      signal: 十二月中旬，一個男孩揮著報紙從車站跑上來：馬可尼收到了大洋那邊發來的信號。工頭把報紙舉得老遠，問{staff}一個點真能跑那麼遠嗎。{staff}說能。工頭把報紙折好塞進外套，叫工人接著敲。
      watch: 十二月下旬，{staff}陪守夜人在崖上的木板棚里坐了一夜，把舊報紙往墻縫里塞，擋海灣吹來的風。守夜人從一張報紙上念出煤價，說塔蓋這么高，最好值得這么漏風。
  schubert_vienna:
    name: 三月那場音樂會的節目單
    place: 維也納
    figure: 弗朗茨·舒伯特
    story: 1828 年 3 月 26 日，弗朗茨·舒伯特在維也納音樂之友協會的會場舉行了一場只演自己作品的公開音樂會，這是他一生唯一的一場。那年秋天，他已在病中，搬進哥哥費迪南德在維登的新住處。10 月 2 日，他寫信給出版人普羅布斯特，推薦最後三首鋼琴奏鳴曲。11 月 19 日，他在那處住所去世，三十一歲。三首奏鳴曲到 1839 年才出版，題獻也換了人。
    relic: 一份歌曲手稿
    relic_desc: 一首運筆很快的歌，墨跡還很深。
    points:
      p1: 把臨時湊到的演奏者和音樂協會的場地約到同一晚，護住舒伯特自己的音樂會
      p2: 把出版問詢變成可交稿的約定，讓舒伯特趕得及為最後三首鋼琴奏鳴曲定下出版與題獻
      p3: 在他搬去哥哥費迪南德家之前，治好纏了他多年的病，讓他熬過那年秋天
    points_fail:
      p1: 出場的人和空出的場地錯了日期，靠朋友幫忙才排成的音樂會取消。行程同步失敗，員工被召回。
      p2: 來信仍停在等回音的階段，三首奏鳴曲在他去世多年後才出版，題獻也換了人。
      p3: 他照舊帶著病在 9 月 1 日搬去哥哥家，11 月 19 日在那裡去世，這條分支與歷史一樣。
    shift:
      p1:
        was: 1828 年 3 月 26 日，舒伯特獲朋友和演奏者協助，在維也納以自己的作品舉辦專場音樂會。
      p2:
        was: 1828 年 10 月 2 日舒伯特致函推薦最後三首奏鳴曲并提出題獻意愿，三曲直到 1839 年才刊印。
        now: '{staff}幫舒伯特把三份譜和題獻要求隨交稿清單送出，請出版方先回一封能核對的確認。舒伯特生前收到了確認，題獻隨樂譜保留。'
      p3:
        was: 1828 年 9 月 1 日，病中的舒伯特搬進哥哥費迪南德在維登一幢新房子里的住處，11 月 19 日在那裡去世，年三十一歲。
        now: '{staff}帶來的藥治好了他的病。那年十一月他沒有病倒，此后多年仍在維也納作曲。寫了什麼，這一趟的記錄里沒有。'
        who: schubert_vienna
        bio: 這條時間線里，舒伯特三十一歲那年秋天病好了，又活了許多年，在維也納繼續作曲。
    vignettes:
      chairs: 3 月 25 日晚上，{staff}幫協會的門房在會場里一排排擺椅子，擺到椅子用完了，名單上的名字還沒念完。門房說他還沒見過這么多人肯擠進一間屋子，聽一個還活著的人的曲子。
      tavern: 七月的一個傍晚，{staff}坐在城墻外的一處葡萄酒園里，聽一個拉琴的和一個彈吉他的一支接一支地奏圓舞曲。拉琴的在兩支曲子中間停下來說，這么熱的天，唱到第二段弦就松了，唯一的辦法是拉快點。
      stairs: 九月初，{staff}幫維登一幢新房子的女房東把幾筐東西搬上樓。墻上的灰泥還有石灰味。她說樓梯間新得會回嘴，在一樓說一句，三樓能聽見兩遍。
  keats_rome:
    name: 臺階旁的小屋
    place: 羅馬
    figure: 約翰·濟慈
    story: 1820 年 11 月，患肺結核的約翰·濟慈與畫家約瑟夫·塞文來到羅馬，住進西班牙臺階旁的西班牙廣場 26 號。1821 年 2 月 23 日夜里他在那裡去世，2 月 26 日葬在新教徒公墓。照他的意思，墓碑上沒有他的名字。
    relic: 一朵壓干的紫羅蘭
    relic_desc: 夾在書里的一朵干花。
    points:
      p1: 護住塞文，錢斷了、人熬垮了也讓他守在濟慈身邊到最後
      p2: 攔下克拉克醫生的饑餓療法和放血，讓他吃得上飯
      p3: 去世之前讓他知道，他的詩會被一代代人讀下去
    points_fail:
      p1: 塞文在一月里倒下了，最後那些日子床邊沒有他。
      p2: 12 月 9 日他照舊又被放了八盎司血，每天仍只有一條鳳尾魚和一片面包。
      p3: 他照舊相信自己什麼也沒留下，這條分支裡沒有人在最後那幾天告訴過他。
    shift:
      p1:
        was: 1821 年 2 月 23 日深夜，濟慈去世，塞文一直守在他身邊。
      p2:
        was: 1820 年 12 月 9 日，濟慈照舊又被放了八盎司血，每天仍只有一條鳳尾魚和一片面包。
        now: 最後那幾個月他吃得上東西，少放了好幾次血，比歷史上少受了些苦。
      p3:
        was: 1821 年 2 月濟慈去世時，仍相信自己沒有留下不朽的作品；照他的意思，墓碑上不刻名字。
        now: '{staff}在最後那幾天讓他知道，他的頌詩以後會一直被人讀、被人背，羅馬這間屋子以後會為他留著。'
    vignettes:
      stairs: '{staff}數了從門口到房間的臺階，好知道托盤端上去時還熱不熱，把數字記在買菜單的邊上。'
      window: '{staff}把窗推開一道縫，讓廣場上泉水的聲音進來。屋裡沒人說什麼，也沒人去關。'
      fountain: '{staff}在臺階腳下那座船形泉邊打水。一位編出來的賣花人問，這棟樓里是誰病了，把一束紫羅蘭半價賣了。'
  vermeer_delft:
    name: 負債的畫家
    place: 代爾夫特
    figure: 約翰內斯·維米爾
    story: 1672 年戰事以後，約翰內斯·維米爾的畫幾乎賣不出去，1675 年 7 月他去阿姆斯特丹借了一千荷蘭盾。據他的遺孀後來陳述，那年 12 月他在一天半里由好好的人到了去世；12 月 15 日他葬在代爾夫特，四十三歲，留下十一個孩子。1676 年初，卡塔琳娜·博爾內斯把他的兩幅畫交給面包商抵面包錢，2 月 24 日又把《繪畫藝術》轉到母親瑪麗亞·廷斯名下。2 月 29 日，公證人來家里清點遺產；4 月，她請求高等法院免去她的債務。
    relic: 一枚珍珠耳環
    relic_desc: 一顆小珍珠，是他常畫的那種。
    points:
      p1: 年底之前，護住畫室裡那幅《繪畫藝術》，不讓它被債主拿去抵債
      p2: 幫他把戰后壓在手裡的幾幅畫賣出去，緩一緩這家人的債
      p3: 讓他知道自己的畫會被記住
      p4: 十二月中旬之前，治好他，讓他活下來
    points_fail:
      p1: 《繪畫藝術》在年底被債主拿去抵了債，次年二月卡塔琳娜無畫可轉給母親，這條分支與歷史脫了節，員工被送回。
      p2: 畫照舊壓在手裡，一幅也沒賣出去，這條分支裡這家人的債照舊一天天重下去。
      p3: 他照舊不知道這些畫以後會怎樣，這條分支裡沒有人告訴過他，兩百年后會有人把它們一幅幅找回來。
      p4: 十二月照史實過去，他在一天半里由好好的人到了去世，這條分支裡卡塔琳娜照舊一個人帶著十一個孩子面對那些債。
    shift:
      p1:
        was: 1676 年 2 月 24 日，卡塔琳娜·博爾內斯把《繪畫藝術》轉到母親瑪麗亞·廷斯名下，免得被拿去抵債；維米爾負債時也沒有賣掉它。
      p2:
        was: 1672 年戰事以後，維米爾自己的畫賣不出去，經手的別家畫作也壓在手裡；卡塔琳娜後來說這是家里欠債的緣由。
        now: 那個十二月有幾幅畫找到了買主，面包賬和別的欠債暫時不再往上漲。
      p3:
        was: 1675 年去世以後，維米爾被冷落了將近兩百年，到 1860 年代托雷-比爾熱的研究才讓他的畫重新被人認出。
        now: 有人告訴過他，這些安靜的屋子以後會被人一幅幅找出來、認回來。
      p4:
        was: 1675 年 12 月，據卡塔琳娜後來的陳述，他被債務和孩子壓著，一天半里由好好的人到了去世；12 月 15 日葬於代爾夫特，年四十三。
        now: '{staff}陪他過了那個十二月，那一天半沒有到來。他回到代爾夫特的畫室，又畫了些年，卡塔琳娜和十一個孩子沒有在那個冬天失去他。'
        who: vermeer_delft
        bio: IF 線里，維米爾挺過了 1675 年的十二月，又在代爾夫特畫了些年，陪這一家把債慢慢還清。
    vignettes:
      bread: 12 月 5 日早上，{staff}幫面包鋪的伙計沿著老朗恩代克街送面包。到了一家門口，伙計把面包遞進去，沒收錢，在小本子上畫了一道。他說老板每個星期六都對著這一頁嘟囔，每個星期一照樣叫他把面包送來。
      frames: 一月里，{staff}在一家畫框鋪里待了一上午，替師傅按住斜角，等膠干。靠墻的畫框有一半空著。師傅說自從七二年法國人打進來，人們買框子是為了裝鏡子，不是裝畫，鏡子至少不會讓人付兩回錢。
      peat: 二月中旬，{staff}幫一個賣泥炭的女人在集市廣場上碼濕泥炭塊。她朝手指哈氣，說今年冬天全代爾夫特都在燒便宜貨，整座城聞起來像一條趴在爐邊的濕狗。
  rembrandt_amsterdam:
    name: 兒子之後
    place: 阿姆斯特丹
    figure: 倫勃朗
    story: 1668 年 9 月 7 日，倫勃朗的兒子提圖斯在阿姆斯特丹下葬，離他成婚只有半年。1669 年 3 月，提圖斯的女兒蒂蒂婭出世。這一年，倫勃朗畫了幾幅署年 1669 的自畫像。他在 1669 年 10 月 4 日去世，四天后葬進一處租來的墓穴；他最後一幅畫沒有畫完。10 月 21 日，提圖斯的遺孀也下葬了。
    relic: 一支畫筆
    relic_desc: 一支磨舊的畫筆，筆毛里的顏料已經干了。
    points:
      p1: 在他最後幾周里，幫倫勃朗把畫架上的《圣殿里的西面》往下畫一段，別讓最後一幅畫停在他力氣斷掉的地方
    points_fail:
      p1: 《圣殿里的西面》照史實沒畫完，留在他的畫室裡。
    shift:
      p1:
        was: 1669 年 10 月 4 日，倫勃朗在阿姆斯特丹去世。他最後一幅畫《圣殿里的西面》在他去世時沒有畫完。
        now: '{staff}替他研好顏料、扶穩畫布，陪他過了最後幾周。十月之前，《圣殿里的西面》在他自己手裡又往下走了一段。'
        who: rembrandt_amsterdam
        bio: 這條時間線里，倫勃朗在 1669 年 9 月一直畫著最後那幅畫，把它畫得比歷史上更遠。它離開畫室時，更接近他想要的樣子。
    vignettes:
      colours: 9 月 22 日下午，{staff}在玫瑰運河邊一家顏料鋪的后屋裡推研磨石，磨一板鉛白，磨到兩條胳膊都酸了。顏料商說如今的畫家都要白得像奶油一樣滑，他真想賣他們一罐奶油，看看誰分得出來。
      barge: 9 月 26 日，{staff}幫一個船夫撐著一船泥炭沿玫瑰運河走。他說今年秋天水淺得很，每過一座橋船底都要刮一下，他已經開始跟橋下的石頭一塊塊打招呼了。
      watchman: 十一月中旬，{staff}陪守夜人冒雨走了一圈。他在每個街角搖一下木響板，報一聲時辰。他說這個月的雨連響板都淋進去了，搖起來像在咳嗽。
  gaudi_barcelona:
    name: 被電車撞倒
    place: 巴塞羅那
    figure: 安東尼·高迪
    story: 1926 年 6 月 7 日傍晚，七十三歲的安東尼·高迪在巴塞羅那的大道上被電車撞倒。他沒帶證件，衣著樸素，被當成乞丐，路人攔了幾輛出租車都不停。6 月 10 日，他在圣十字醫院去世，12 日安葬在圣家堂。多梅內克·蘇格拉涅斯接手主持工程。1936 年 7 月 20 日，工房被人放火，圖紙和石膏模型大多毀掉。
    relic: 一個石膏模型
    relic_desc: 一個小小的懸掛式穹頂模型。
    points:
      p1: 高迪住院期間，把進行中的工程清單和工房鑰匙交給多梅內克·蘇格拉涅斯，讓施工在六月接著往下走
      p2: 請蘇格拉涅斯把關鍵石膏模型的照片、標尺和圖紙另存一處，在工房留一份簽收的清單
      p3: 6 月 7 日傍晚，大道上的電車撞倒一個沒人認得的老人時，立刻把高迪送進醫院，救下他
    points_fail:
      p1: 工房等著高迪回來核準，接手的同事拿不到進行中的工程清單。施工交接中斷，事務所因同步失敗召回員工。
      p2: 照片和圖紙仍收在工房同一排柜里。後來工房毀損時，對照材料隨石膏模型一起散失。
      p3: 他被當成乞丐躺在街上，幾輛出租車都不停，先到一處診所才轉進圣十字醫院，6 月 10 日在那裡去世。
    shift:
      p1:
        was: 高迪 1926 年 6 月遭遇電車事故，在醫院去世。他的合作者蘇格拉涅斯接掌圣家堂工程。
      p2:
        was: 1936 年工房毀損，原圖和石膏模型多有損失。工程團隊後來從殘件和已刊照片等材料重建。
        now: 十年后工房里的柜子燒毀，團隊從另一處取回照相冊和有簽收的圖紙。以前只能靠殘件拼的兩個模型面，現在有當年的尺寸可作對照。
      p3:
        was: 1926 年 6 月 7 日，高迪在大道上被電車撞倒，沒帶證件，衣著破舊，被當成乞丐；6 月 10 日他在圣十字醫院去世，年七十三歲。
        now: '{staff}一分鐘內跪到他身邊，說出他是誰，直接把他送到外科醫生手裡。高迪活了下來，又回圣家堂的工房干了幾年。'
        who: gaudi_barcelona
        bio: 高迪挺過了 1926 年 6 月的電車事故。他回到圣家堂的工房，和蘇格拉涅斯一起又主持了幾年工程。
    vignettes:
      tram: 5 月 29 日，{staff}站在電車后平臺上，從大道這頭坐到那頭。售票員說這份差事最難的不是收錢，是那些邊看報邊過馬路的人。他每到一個路口就拉一下鈴，像在數落整條街。
      stone: 6 月 1 日，{staff}幫工地上兩個石匠把一塊雕好的石頭放到灰漿上。起風時，風從頭頂塔身的孔洞里穿過去，吹出哨音。年輕的那個石匠發誓每天下午都是同一個音，他已經開始跟著哼了。
      water: 7 月 10 日，入夏最熱的一天，{staff}替中午來工地的賣水女人提水罐。她說石匠們不到收工鈴響就喝掉一整桶，喝完還嫌水里有灰味。她說那是當然，灰就是從他們身上掉進去的。
  kafka_kierling:
    name: 療養院里的校樣
    place: 基爾靈
    figure: 弗朗茨·卡夫卡
    story: 1924 年 3 月，結核侵入弗朗茨·卡夫卡的喉頭，他咽東西越來越難。4 月 19 日，他和朵拉·迪亞曼特來到克洛斯特新堡附近基爾靈的霍夫曼療養院；醫生讓他少說話，他多半靠紙條交談。5 月 6 日前後，醫學生羅伯特·克洛普施托克趕來幫著照料。6 月 2 日，他還在校故事集《饑餓藝術家》的校樣。6 月 3 日中午前後，他去世，四十歲，11 日葬於布拉格。這本收了四篇小說的書，8 月底在柏林出版。
    relic: 一頁校樣
    relic_desc: 一頁印刷校樣，上面有鉛筆改的小字。
    points:
      p1: 病中校稿一中斷就給他留下接續的位置，護住卡夫卡最後校過的故事集
      p2: 把跑腿與通信交接給輪換的幫手，給守在基爾靈的人留出一段歇息時間
      p3: 減輕他喉頭的痛，讓他在最後幾個星期還咽得下水和幾口軟食
      p4: 讓柏林出版人先裝訂一本寄到基爾靈，讓卡夫卡生前看到自己選定的四篇小說合在一起
    points_fail:
      p1: 校樣寄回柏林時缺了作者最後一輪批改，印本失去這次校訂。行程與史實脫節，員工被召回。
      p2: 照料者仍同時守病房、收信和跑腿，連等回信的空當都抽不開身。
      p3: 喉頭的痛照舊讓他吃不下東西，這條分支裡他最後幾個星期仍靠紙條說話，幾乎咽不下一口。
      p4: 作者來不及看到書，出版者在他去世后才把它交給讀者。
    shift:
      p1:
        was: 1924 年 5 月，卡夫卡在基爾靈養病時仍在校訂《饑餓藝術家》的校樣。
      p2:
        was: 1924 年 5 月，有朋友前往基爾靈協助照料已經病重的卡夫卡，分擔伴侶原先承擔的工作。
        now: '{staff}把送印、送信和陪伴所需的人手分時安排，幫手到時，原來守著的人可以出門走一會兒。'
      p3:
        was: 1924 年春，結核侵入卡夫卡的喉頭，吞咽劇痛，吃不下也睡不好，醫生每隔八到十天給喉上神經注射一次止痛；6 月 3 日他在基爾靈去世。
        now: '{staff}幫醫生把止痛排在飯前，他在最後幾個星期還喝得下水、吃得下幾口軟食，比歷史上少受了些苦。'
      p4:
        was: 1924 年 6 月 3 日卡夫卡去世，同年 8 月《饑餓藝術家》故事集出版。
        now: '{staff}請柏林先把已經改完的印張裝成一本隨郵寄回。卡夫卡在基爾靈翻過它，認得出自己定的四篇和次序。'
        who: kafka_kierling
        bio: 卡夫卡生前看到一冊按最後校樣裝訂的故事集。正式出版時出版社保留了他選定的篇目和次序。
    vignettes:
      lilac: 5 月 13 日，{staff}幫療養院的園丁修剪籬笆邊的丁香。園丁說今年丁香晚開了一個星期，蜜蜂到現在還沒原諒它，天天飛到廚房窗口來抱怨。
      post: 5 月 23 日，{staff}跟療養院跑腿的男孩走下坡去克洛斯特新堡的郵局。男孩說他不用看就知道信從哪兒來：柏林來的又厚又硬，全是紙；布拉格來的薄，天天都有。
      rain: 六月中旬，{staff}被一場急雨堵在村裡面包鋪的門洞下。面包師的妻子看著街面變成一條河，說基爾靈的小溪只在她剛刷完門口臺階的時候才漫上來。
  poe_baltimore:
    name: 第四選區的一張求助條
    place: 巴爾的摩
    figure: 埃德加·愛倫·坡
    story: 1849 年 9 月 27 日，埃德加·愛倫·坡離開里士滿，要回紐約福德姆的家，第二天到了巴爾的摩。此后一個星期他在哪里，沒有可靠的記載。10 月 3 日是選舉日，有人在瑞安那處第四選區投票點發現他處境不妙，印刷工約瑟夫·沃克寫條子請約瑟夫·斯諾德格拉斯來。他被送進華盛頓學院醫院，不許探視，7 日天亮前在那裡去世，四十歲，死因至今不明。他的姨母兼岳母瑪麗亞·克萊姆是從報上讀到的。
    relic: 一根手杖
    relic_desc: 一根樸素的手杖，握柄已被磨舊。
    points:
      p1: 憑那張求助條盡快找到能接應的人，護住坡從投票點到醫院的那段路
      p2: 趁他還在病房里，把消息送到瑪麗亞·克萊姆手上，別讓她從報上讀到
      p3: 在華盛頓學院醫院裡守著他熬過譫妄，救下坡
    points_fail:
      p1: 求助條遞進人群里就斷了，沒有人及時把他送進醫院。分支與歷史脫了節，事務所因同步失敗召回員工。
      p2: 家里繼續等他自己回來，瑪麗亞·克萊姆是從報上讀到噩耗的。
      p3: 他照史實在 10 月 7 日死在醫院裡，這條分支裡也沒能留住他。
    shift:
      p1:
        was: 1849 年 10 月 3 日，有人在巴爾的摩的一處投票點發現坡急需幫助，寫條求援后，他被送進華盛頓學院醫院。
      p2:
        was: 1849 年 10 月 9 日，瑪麗亞·克萊姆寫信給尼爾森·坡，說剛從報上得知他的死訊。
        now: '{staff}把院方知道的情況和回信地址寄給了她。她的回信在他還在病房時送到了。'
      p3:
        was: 1849 年 10 月 7 日，坡在巴爾的摩的華盛頓學院醫院去世，四十歲，死因至今不明。
        now: '{staff}守著他熬過了最難的幾夜，他挺了過來。十月底他出了院，往北回紐約的家。'
        who: poe_baltimore
        bio: 這條時間線里，坡挺過了 1849 年 10 月在巴爾的摩醫院裡的那幾天。他回到紐約，又寫了、編了幾年。
    vignettes:
      wharf: 9 月 28 日，{staff}在碼頭上等里士滿來的汽船靠岸。一個背著三只箱子的腳夫說，諾福克的船運病人，里士滿的船運詩人，哪一種給的小費更少，他說不準。
      ballot: 10 月 2 日，{staff}看幾個人在隆巴德街一家酒館門外釘木牌。酒館老板說明天樓上每間屋都租給了選區，啤酒由候選人請；他早學會了數酒桶，不數投票的人。
      ward: 10 月 4 日夜里，{staff}提一桶清水上到收醉漢的病區。守夜的雜役說，帶鐵欄那間屋裡的先生一口水也不肯碰；他把燈捻得很低，燈一亮，那人就對著墻說話。
  sor_juana_mexico_city:
    name: 送走的最後幾本書
    place: 墨西哥城
    figure: 胡安娜修女
    story: 1690 年，普埃布拉主教未經她同意，把她批評一篇布道的文章刊印出來，題為《雅典娜信札》，附信署名“菲洛特亞修女”。她的《答菲洛特亞修女》署 1691 年 3 月 1 日。1693 年她賣掉了書和樂器，1694 年重申誓愿。1695 年 4 月 17 日，她在照顧染疫的修女之後，死於圣杰羅姆修道院。
    relic: 一支羽毛筆
    relic_desc: 一支筆尖裂開的羽毛筆，旁邊是空書架。
    points:
      p1: 疫病傳開的那幾周，幫她撐住病房，護住對病倒修女的照料
      p2: 救下一位染疫病倒的修女
      p3: 她病倒以後，治好她
    points_fail:
      p1: 病房里的人手一個個倒下，照料斷了，這條分支裡她照顧病倒的修女這件事沒能像史實那樣做下去。
      p2: 她沒熬過去，照史實成了那幾個月里去世的修女之一，這條分支裡病房又空了一張床。
      p3: 照史實，她 4 月 17 日去世。這條分支裡，她沒有熬過四月。
    shift:
      p1:
        was: 1695 年春，墨西哥城疫病流行，胡安娜修女一直照顧病倒的修女。
      p2:
        was: 1695 年春的疫病里，她所在的修道院有多位修女病逝。
        now: 那位修女熬過了四月，病好以後又回到了病房幫忙。
      p3:
        was: 1695 年 4 月 17 日，胡安娜修女在照顧病倒的修女之後去世。
        now: '{staff}用帶來的藥治好了她，她熬過了四月。後來幾年，她在修道院里又寫下了一些東西，寫了什麼，這一趟的記錄里沒有。'
    vignettes:
      kitchen: '{staff}看著一枚蛋在熱油里凝住，在糖漿里卻散開，在一張碎紙上記下哪口鍋是哪樣，也不為給誰看。'
      shelf: '{staff}擦凈屋裡的空書架，木板上還看得出書立過的地方，一塊塊顏色深些，沒去動它。'
      bells: '{staff}在院子里數著報喪的鐘聲，有一晚響了兩回，數完又回去看著水壺。'
  mary_anning_lyme_regis:
    name: 崖壁里的骨頭
    place: 萊姆里吉斯
    figure: 瑪麗·安寧
    story: 約 1811 年，瑪麗·安寧的哥哥約瑟夫在萊姆里吉斯的海崖里找到一個魚龍頭骨，1812 年 11 月，瑪麗把五米來長的骨架挖了出來。1823 年 12 月，她找到第一具完整的蛇頸龍骨架；1828 年 12 月，又找到英格蘭發現的第一具翼龍。她 1847 年去世，年僅 47 歲，一直手頭拮據；寫她那些發現的論文里，很少提到她的名字。
    relic: 一枚菊石
    relic_desc: 一枚從藍色里亞斯巖里敲出來的螺旋形化石。
    points:
      p1: 12 月 10 日，護住崖下那具蛇頸龍，趕在塌方和回潮之前把它完整取出
      p2: 幫她把那條長頸一節一節數清、畫準，讓寄往倫敦的草圖經得起查問
      p3: 讓她在生前知道，這些骨頭以後會寫著她的名字
    points_fail:
      p1: 那具骨架被回潮卷走了一半，這條分支裡沒有第一具完整的蛇頸龍。
      p2: 這條分支裡，12 月 26 日的草圖照原樣寄出，頸椎上沒有多一道核對的標記。
      p3: 這條分支裡，她照舊不知道自己會被記住，沒有人在那個冬天告訴過她。
    shift:
      p1:
        was: 1823 年 12 月，瑪麗·安寧在崖下取出一整具骨架，脖子比身子還長。
      p2:
        was: 1823 年 12 月 26 日，她把蛇頸龍的草圖照原樣寄往倫敦。
        now: 寄到倫敦的草圖上每一節頸椎都標了號，後來那場疑心來時，圖上已經有了回答。
      p3:
        was: 1847 年瑪麗·安寧去世，四十七歲，手頭一直拮據，寫她發現的論文很少提她的名字。
        now: 那個冬天有人告訴過她，她挖出的骨頭以後會在倫敦的博物館里寫著她的名字，萊姆里吉斯的海邊會立起她的像。
    vignettes:
      stone: '{staff}順著一道裂縫描過骨架的頸部，一直描到它離開骨頭的地方，在那裡抬起了筆。'
      vertebrae: '{staff}從另一頭數頸骨，兩邊數不到一起的地方，留了一個括號，沒有順手添上一塊骨頭。'
      pose: '{staff}把抄圖轉來轉去，直到不用人指也能找到頭部，又在下面寫上是誰發現的。'
  kepler_leonberg:
    name: 證人親眼看見的事
    place: 萊昂貝格
    figure: 約翰內斯·開普勒
    story: 1620 年，天文學家約翰內斯·開普勒的母親卡塔琳娜七十三歲，萊昂貝格的鄰居告她用草藥害人，已經告了五年。8 月 7 日，她在女兒家所在的霍伊馬登被捕；案子先在萊昂貝格開審，後來移到居格林根，她戴著鎖鏈關在那裡，兩個人日夜看守，費用由家里出。9 月 28 日，約翰內斯從林茨趕到，堅持每一步程序都要落在紙上。審理一拖再拖。1621 年秋，她坐了一年多的牢，獲釋出獄。
    relic: 一頁申辯書抄本
    relic_desc: 一頁謄清的書面申辯，頁邊改過一個日期。
    points:
      p1: 卡塔琳娜被帶到萊昂貝格以後，請保管申辯書的人立刻另抄并交存一份，護住書面申辯繼續進入程序
      p2: 讓家人整理原證詞，逐項區分證人親眼所見、由人轉述和後來附上的推斷
      p3: 給居格林根牢里戴著鎖鏈的卡塔琳娜送進厚衣被和熱飯，讓七十三歲的她熬過這個冬天
    points_fail:
      p1: 家里能找到的那份申辯書沒能轉交。案卷只剩指控人的陳述，事務所因同步失敗召回員工。
      p2: 三種說法抄在同一欄。送進案卷以後，辯護人還要再追問最早是誰說的。
      p3: 這條分支裡，她照史實戴著鎖鏈過冬，身邊只有日夜看守的兩個人，看守的費用還要家里出。
    shift:
      p1:
        was: 卡塔琳娜於 1620 年 8 月被捕。約翰內斯·開普勒隨後經律師堅持把程序落實在書面記錄上。
      p2:
        was: 審理留下證詞及書面辯護。辯方逐項回應并反對把猜測當作說法之間的因果。
        now: 送給律師的抄本可以按欄核查。辯護人先指出證人未能親驗的數項。
      p3:
        was: 1620 年 8 月 7 日卡塔琳娜·開普勒被捕，押到居格林根，戴著鎖鏈關押十四個月，兩人日夜看守，費用由她和家人承擔；1621 年秋獲釋，約半年后去世。
        now: '{staff}替家里打點好看守，那個冬天她有厚被和熱飯，鎖鏈沒有卸下，身子卻比歷史上撐得住些。'
        who: katharina_kepler
        bio: 這條時間線里，卡塔琳娜·開普勒在居格林根牢里的第一個冬天有厚被和熱飯，1621 年秋獲釋時身子比歷史上硬朗些。
    vignettes:
      soup: 9 月 13 日，{staff}替獄卒的妻子端一鍋大麥湯上居格林根的小巷。她說不用看人，看碗就知道是哪個犯人：那個老太太的碗總是刮得干乾淨凈送回來，還要抱怨一句鹽放少了。
      hearing: 10 月 2 日，{staff}幫律師的文書把兩捆案卷抬到居格林根的市政廳去開庭。到了門口，說是又改期了。文書把兩捆紙放在臺階上，說這條路它們走了這么多回，早該自己認得了。
      frost: 十一月中，{staff}搭一輛運貨馬車從萊昂貝格去居格林根。車夫說這條路最難走的是進察伯河谷那一段；一上凍，車輪就會唱，他聽音高就知道還剩多遠。
  pushkin_st_petersburg:
    name: 門牌號尚未出現的那戶人家
    place: 圣彼得堡
    figure: 亞歷山大·普希金
    story: 1836 年到 1837 年，亞歷山大·普希金住在莫伊卡河畔、科紐申內橋旁沃爾孔斯卡婭公爵夫人的房子里。舊歷 1837 年 1 月 27 日，也就是新歷 2 月 8 日，他在黑溪邊與喬治·丹特斯決斗，腹部中彈，被送回寓所，舊歷 1 月 29 日，也就是新歷 2 月 10 日在那裡去世。他葬在米哈伊洛夫斯科耶附近的圣山修道院，在他母親身旁。
    relic: 一本詩集
    relic_desc: 一本小書，某首詩里夾著一片壓干的葉子。
    points:
      p1: 幫他把越欠越多的債理出頭緒，讓妻子和孩子的日子不再懸著
      p2: 中彈以後，護住從黑溪回城那一路，讓他活著回到莫伊卡河畔的寓所
      p3: 治好他腹部的槍傷，壓住傷口里的感染，讓他活下來
    points_fail:
      p1: 這條分支裡，那個冬天的欠單照舊壓在書桌上，沒有人替他理過。
      p2: 他沒能撐到莫伊卡河畔，這條分支裡沒有寓所里的那兩天。
      p3: 2 月 10 日下午，他照史實在寓所里去世，這條分支裡也沒能多留他一天。
    shift:
      p1:
        was: 1837 年 2 月普希金去世時欠下大筆債務，後來由尼古拉一世替他還清。
        now: 欠賬理成了一張單子，哪筆先還、哪筆能緩，家里心裡有了數。
      p2:
        was: 1837 年 2 月 8 日決斗中彈以後，普希金被送回莫伊卡河畔的寓所。
      p3:
        was: 1837 年 2 月 10 日他在寓所里死於腹膜炎，三十七歲，留下妻子和四個孩子。
        now: '{staff}帶去的藥壓住了傷口的感染，二月過去時他還在莫伊卡河畔養傷。他又寫了幾年，《同時代人》仍在他手裡辦下去。'
    vignettes:
      number: '{staff}差點把一塊博物館門牌上的號碼告訴來訪的人，可那塊牌子這時還沒有，便劃掉數字，在紙條上畫了那座橋。'
      queue: '{staff}把同一句回答抄在幾張紙條上，門廳里等著的人看了就不用再問。'
      river: '{staff}跟著門房從橋邊沿莫伊卡河走一遍，數清指路時該說的幾個轉彎。'
  chekhov_badenweiler:
    name: 寄往弗里德里克別墅的回信
    place: 巴登魏勒
    figure: 安東·契訶夫
    story: 1904 年 6 月，四十四歲、肺結核已經很重的安東·契訶夫，和妻子奧爾加·克尼佩爾來到黑森林的療養地巴登魏勒。他們先住羅馬浴旅館，后住弗里德里克別墅，最後搬進郵局隔壁的索默旅館。他往家里寫的信都很輕快，七月里還托朋友打聽哪一班輪船能走海路送他們回俄國。7 月 15 日凌晨，他在那裡去世。
    relic: 一副夾鼻眼鏡
    relic_desc: 一副系著細繩的小圓眼鏡。
    points:
      p1: 契訶夫剛安頓下來時，把他寫給妹妹瑪麗婭的回信地址逐字核對，趁他還有力氣寫完，把信交出去
      p2: 用他 7 月 11 日列在信里的問題請熟悉航線的人發一封短電報，讓他在巴登魏勒得到想問的返程消息
      p3: 治好他的肺結核，讓他和奧爾加一起動身回俄國
    points_fail:
      p1: 行李還按上一處旅館收放，寫字桌上的信封被一并帶走。瑪麗婭沒有收到他從別墅寄出的地址，事務所因同步失敗召回員工。
      p2: 他關於船期、艙位和航行天數的問題隨普通信寄出。等回信的日子裡，手邊仍沒有一份可以讀的答復。
      p3: 7 月 15 日凌晨，契訶夫在巴登魏勒去世，年僅四十四歲。
    shift:
      p1:
        was: 1904 年 6 月 25 日（俄歷 6 月 12 日），契訶夫從巴登魏勒寫信給瑪麗婭，寫明弗里德里克別墅的詳細回信地址。
      p2:
        was: 1904 年 7 月 11 日，契訶夫寫信給羅索利莫詢問由馬賽乘船去敖德薩的細節。他於 7 月 15 日在巴登魏勒去世，未能作這趟旅行。
        now: 負責航線的人回電報來，把開船日、路程和兩人可用的艙位寫得清楚。契訶夫和妻子在旅館把這張紙讀完，也商量了若能動身最想選哪一班。
      p3:
        was: 1904 年 7 月 15 日，契訶夫在巴登魏勒因肺結核去世，終年四十四歲。
        now: 他的肺病好了，夏天過后和奧爾加坐船回到俄國。此后他又寫了好些年，也回到莫斯科藝術劇院看排練。
        who: chekhov_badenweiler
        bio: 契訶夫在巴登魏勒治好了肺結核，1904 年秋天回到俄國，此后繼續寫小說和戲劇多年。
    vignettes:
      garden: 6 月 27 日，{staff}幫弗里德里克別墅的女傭把一張躺椅跟著太陽在花園里挪位置。她說這裡的太陽七點整離開草坪，這家人開晚飯看的是太陽，不是門廳里那座鐘。
      post: 7 月 7 日，{staff}坐在索默旅館隔壁郵局門口的長凳上。郵差說，夏天巴登魏勒寫信最多的是俄國人，寫得最短的是英國人；俄國人的信封他掂一掂，就知道夠不夠郵票。
      ice: 7 月 10 日熱得最兇，{staff}幫索默旅館的門房用麻袋從地窖往樓上扛一塊冰。門房說黑森林二十年沒見過這樣的七月，米爾海姆來的賣冰人都開始按樓梯級數算錢了。
  sophie_germain_paris:
    name: 來遲了的學位
    place: 巴黎
    figure: 索菲·熱爾曼
    story: 1829 年，索菲·熱爾曼得了乳腺癌。她沒有停下，病中寫完論曲面曲率的論文，1831 年刊於柏林克雷勒雜志第七卷。她年輕時進不了大學，用勒布朗先生的名字給拉格朗日和高斯寫信；1816 年，她以論彈性薄板振動的論文獲法蘭西科學院的獎。高斯說動哥廷根大學授她名譽博士學位。1831 年 6 月 27 日，她在巴黎薩伏依街 13 號去世，學位還沒有授出。
    relic: 一封署名勒布朗的信
    relic_desc: 一封用借來的名字寫給高斯的信。
    points:
      p1: 在她病中護住那篇論曲面曲率的論文，讓它寄到柏林克雷勒的雜志
      p2: 減輕她最後幾個月在巴黎的癌痛
      p3: 讓熱爾曼生前知道，高斯在為她向哥廷根大學爭取名譽博士學位
    points_fail:
      p1: 論文沒寫完，留在她的書桌上，1831 年那一卷里沒有它。這條分支與歷史脫節，員工被送回。
      p2: 沒人替她壓住疼痛，這條分支裡她最後幾個月和歷史上一樣難熬。
      p3: 消息沒送到她手裡，她到去世都不知道高斯為她做了什麼。
    shift:
      p1:
        was: 1831 年，熱爾曼論曲面曲率的論文刊於克雷勒雜志第七卷，同年她去世。
      p2:
        was: 約 1829 年起熱爾曼患乳腺癌，仍堅持工作，1831 年 6 月 27 日在巴黎去世。
        now: '{staff}用現代的藥壓住疼痛，在最難熬的時候陪著她。她最後幾個月少受了些苦，還能坐到書桌前。'
      p3:
        was: 高斯曾推動哥廷根大學授予熱爾曼名譽博士學位，1831 年 6 月 27 日她去世時，學位尚未授出。
        now: '{staff}把高斯所做的事帶給她。熱爾曼得知，那所她從沒能進去讀書的大學要給她這份榮譽。'
        who: sophie_germain_paris
        bio: 這條時間線里，熱爾曼生前得知高斯推薦她獲得哥廷根的名譽博士學位。學位本身仍然來得太遲。
    vignettes:
      water: 3 月 7 日，{staff}幫送水的人把兩桶塞納河水扛上薩伏依街一座樓的五層。送水人一邊數臺階一邊喘，說巴黎的樓一年比一年高，他的工錢還是按桶算，不按層算。
      quai: 四月中旬，{staff}在河岸的舊書攤前翻一本舊歷書。攤主說這一摞是從同一戶人家收來的，頁邊記滿了算式，他看不懂，只好論分量賣。
      wash: 五月下旬，{staff}在河邊的洗衣船上幫洗衣婦擰床單。她說今年春天塞納河漲了又退，船跟著一高一低，她的腰也跟著一高一低。
  wallace_ternate:
    name: 來自特爾納特的論文
    place: 特爾納特
    figure: 阿爾弗雷德·拉塞爾·華萊士
    story: 1858 年 2 月，阿爾弗雷德·拉塞爾·華萊士在摩鹿加群島一場瘧疾稍退之後，寫成一篇落款特爾納特的論文，談變種怎樣偏離原型，寄給了查爾斯·達爾文。6 月 18 日，論文到了達爾文手裡。7 月 1 日，它與達爾文的材料一同在倫敦林奈學會宣讀，兩位作者都不在場。
    relic: 針盒里的一隻甲蟲
    relic_desc: 一隻收集來的甲蟲，放在小錫盒里。
    points:
      p1: 瘧疾發作的那幾天，護住那篇論文寫完
      p2: 治好他在多雷傷的那只腳踝，不讓它潰爛
      p3: 救下獵手朱馬特，治好他的高燒和痢疾
    points_fail:
      p1: 燒一直沒退下去，二月里稿子沒有寫完，郵船帶走的信里沒有它，這條分支裡 7 月 1 日的林奈學會沒有這篇論文。
      p2: 傷口照史實潰了，他在小屋裡拄著拐坐了一個多月，這條分支裡多雷林子里那些蟲子還是只有仆人替他去捉。
      p3: 6 月 26 日朱馬特照史實病逝，這條分支裡七月離開多雷的船上少了他。
    shift:
      p1:
        was: 1858 年 2 月，華萊士瘧疾稍好便提筆寫成論文，稿末落款特爾納特。
      p2:
        was: 1858 年 5 月，華萊士在多雷傷了腳踝，傷口潰成潰瘍，一個多月下不了地。
        now: 傷口沒有潰，汽船到港那些天他照舊每天進林子。
      p3:
        was: 1858 年 6 月 26 日，十八歲上下的朱馬特在多雷病逝，華萊士寫他是個安靜的小伙子，活干得踏實。
        now: '{staff}守著他退了燒、止住了病，七月底離開多雷時，他也在船上。'
    vignettes:
      places: '{staff}抄寫當天鳥類標本的籤條，在每張旁邊寫上島名，這一抽屜皮子沒有采集人在旁邊也讀得懂。'
      claim: 兩座島上的甲蟲長得很像，{staff}把一盤甲蟲分成兩排，中間留出空隙，沒人吩咐。
      mail: '{staff}把一封長信的稿頁包進油紙，打了個雙結，像水手捆海圖那樣。'
  su_shi_huangzhou:
    name: 東坡的流放
    place: 黃州
    figure: 蘇軾
    story: 1079 年烏臺詩案之後，蘇軾被貶到黃州，在城東一塊坡地上開荒種地，以地為號，稱東坡。1082 年七月，他與客泛舟赤壁之下，寫成《赤壁賦》；十月，他從雪堂步行回臨皋，寫成《后赤壁賦》。1084 年他離開黃州。
    relic: 一件蓑衣
    relic_desc: 一件粗糙的雨衣，是農人在坡地上穿的那種。
    points:
      p1: 幫他一家把東坡那塊荒地種出收成，撐過積蓄見底的日子
      p2: 十月之望那夜，護住他攀上赤壁斷岸，讓他平安回到船上
      p3: 救下鄉間那些一落地就要被按進水盆的孩子
    points_fail:
      p1: 這條分支裡，秋收時東坡的地頭沒有多一個幫手，梁上的錢串照舊一串一串地少下去。
      p2: 那夜他在斷岸上失了腳，這條分支裡沒有回到船上的那一段。
      p3: 這條分支裡，鄉間的水盆照舊，{staff}沒能讓哪一家留下那個孩子。
    shift:
      p1:
        was: 元豐四年，蘇軾在城東坡地開荒種地，一家每天的用度限在一百五十錢。
        now: 那年秋天東坡的地多打了幾擔糧，梁上的錢串剩到了年底。
      p2:
        was: 元豐五年十月之望，蘇軾獨自攀上赤壁斷岸，又回到船上，後來寫下《后赤壁賦》。
      p3:
        was: 他聽說岳鄂一帶溺嬰，寫信請鄂州知州依律禁止，又在黃州倡議育兒會，請富戶出錢，幫貧家養活新生的孩子。
        now: '{staff}跟著育兒會挨家去走，那個冬天又有幾戶人家把剛生下的孩子留了下來。'
    vignettes:
      slope: '{staff}替雇來的幫工往坡上挑水。天黑時，一位編出來的鄰里在地頭放下一碗煮豆，說明天第二碗給這個外鄉人。'
      lamp: '{staff}在路邊的石頭上坐著，手護著一盞燈擋風。三更過了很久，坡上才有腳步聲下來。{staff}把燈轉向小路，什麼也沒說。'
      ferry: '{staff}在渡口幫一位編出來的船家盤纜繩。船家說，無風的夜里崖下的水走得慢，來游的客人總要往對岸去。'
  ahmed_baba_timbuktu:
    name: 給補編留一個名字
    place: 廷巴克圖
    figure: 艾哈邁德·巴巴
    story: 1591 年摩洛哥軍隊攻下廷巴克圖。學者艾哈邁德·巴巴被指抗拒蘇丹，1594 年被押往馬拉喀什，在那裡編寫人物辭書，補伊本·法爾洪的舊作。1608 年他獲準回到廷巴克圖，1627 年 4 月 22 日在那裡去世。
    relic: 一部皮面手稿
    relic_desc: 一部手稿，皮面磨舊了，帶一片護舌。
    points:
      p1: 押走之前，攔下沖著被捕學者來的刀兵，護住艾哈邁德·巴巴活著走上北去的路
      p2: 替在沙漠里病倒受傷的族人治傷、分水，護著一家老小不掉隊
      p3: 搶在士兵收書之前，從他的藏書里救下幾箱，托給城里一戶人家藏好
    points_fail:
      p1: 這條分支裡他沒能活著離開廷巴克圖，馬拉喀什的人物辭書和在摩洛哥寫成的二十九部書都沒有了。
      p2: 路上倒下的人沒人扶，這條分支裡一家人北上的路和原來一樣苦。
      p3: 藏書全被收走，這條分支裡他十四年后回到廷巴克圖，自己的書一卷也沒剩下。
    shift:
      p1:
        was: 1594 年，艾哈邁德·巴巴被指抗拒蘇丹，押往馬拉喀什；1608 年他獲準回到廷巴克圖。
      p2:
        was: 1594 年，艾哈邁德·巴巴的家人與他一同被押著穿過撒哈拉北上。
        now: 同行的族人走到馬拉喀什時少受了些罪。
      p3:
        was: 1594 年，他的藏書被摩洛哥人收走，另一說在北上途中散失；1608 年回到廷巴克圖時，書已不在。
        now: 押走之前有幾箱書被挪進城里一戶人家的床底。十四年后他回到家，那戶人家把箱子抬了出來。
        who: ahmed_baba_timbuktu
        bio: 1608 年艾哈邁德·巴巴回到廷巴克圖，城里一戶人家替他收著的幾箱書還在。晚年他就用這些書教學生。
    vignettes:
      same_name: '{staff}發現兩卷書里同一個名字有兩種寫法，沒有挑一種，兩種都記在單子上，中間畫了個記號。'
      courtyard: 雨季過后，{staff}把書攤在院子的陰涼里晾，正午翻一次，讓封皮干得勻。
      slip: '{staff}在窄紙條上寫下每卷的書名和頭一行，塞在皮面的護舌底下，不用打開也叫得出是哪本書。'
  nezahualcoyotl_texcoco:
    name: 歌旁寫著的名字
    place: 特斯科科
    figure: 內薩瓦爾科約特爾
    story: 內薩瓦爾科約特爾 1431 年成為特斯科科之主，統治到 1472 年去世。人們記得他是詩人，也是營造者，據說橫貫特斯科科湖的一道長堤是他規劃的。十六世紀收集的納瓦特爾語歌謠里，有一些和他的名字連在一起，但是否出自他手，已無法確定。
    relic: 一張接唱提示紙
    relic_desc: 接唱紙，分開給兩種名字留了位置。
    points:
      p1: 他去世后貴族推舉繼承人的那幾天，護住七歲的內薩瓦爾皮利
      p2: 幫宮里的一位學徒把與他名字連在一起的那幾首歌，從老歌者那裡一句不落地學全
      p3: 在他最後的日子裡，讓他知道五百多年後人們還記得他的名字
    points_fail:
      p1: 推舉之前孩子出了事，這條分支裡特斯科科沒有照史實迎來七歲的新主。
      p2: 老歌者病倒前沒教完，這條分支裡那幾首歌照舊只傳下來一部分。
      p3: 他照史實在 1472 年去世，這條分支裡，他到最後也不知道后人會記得他。
    shift:
      p1:
        was: 1472 年內薩瓦爾科約特爾去世，七歲的內薩瓦爾皮利被推舉繼位。
      p2:
        was: 十六世紀后期，寫在他名下的一些歌被抄進歌集，最初是誰唱的，沒人知道。
        now: 那位學徒把幾首歌從頭到尾學全，後來又教給了自己的徒弟。
      p3:
        was: 1472 年內薩瓦爾科約特爾在特斯科科去世；與他名字連在一起的歌一百來年后才抄進歌集，墨西哥的百元鈔票印他的像，是五百多年以後的事。
        now: '{staff}在他最後的日子裡坐在他身邊，把這些告訴了他。'
    vignettes:
      voice: 一位歌者唱到以“我”開頭的那句走上前來，{staff}在練習紙上留了兩處，一處記唱的人，一處記歌里念的名字。
      drum: '{staff}放了一條邊角紙作記號，頭一位歌者起身時，紙頁仍留在下一位夠得著的地方。'
      later: '{staff}記下這一句是從哪位歌者那裡聽來的，至於最初是誰作的，留著沒寫。'
  savitribai_phule_pune:
    name: 包里多帶的一件紗麗
    place: 浦那
    figure: 薩維特麗巴伊·普勒
    story: 1848 年 1 月，薩維特麗巴伊·普勒、喬蒂拉奧·普勒和薩古娜拜在浦那塔蒂亞薩赫布·比德的宅子里開辦女子學校。去學校的路上常有人朝她扔石頭和糞，她包里多帶一件紗麗，到學校再換上。1852 年的記錄寫她是普勒夫婦辦的第一所女校的校長。1897 年 3 月 10 日，她在照顧病人時染上鼠疫去世。
    relic: 一塊石板
    relic_desc: 一塊小石板，上面用粉筆寫著第一排字母。
    points:
      p1: 開學頭一個月最難的那個早上，護住她去比德府的路，讓當天的課照常開
      p2: 勸回一個被家里叫回去的女孩，讓她回到石板前
      p3: 攔下那段路上朝她扔東西的人，讓她不必再在包里多帶一件紗麗
    points_fail:
      p1: 那天她沒能走到學校，比德府的門沒有開。
      p2: 這條分支裡，比德府的石板前少了一個人。
      p3: 她照舊每天在包里多帶一件紗麗，這條分支與歷史一樣。
    shift:
      p1:
        was: 1848 年 1 月起，比德府的女子學校照常開課，薩維特麗巴伊每天走路去教書。
      p2:
        was: 1848 年，浦那許多人家反對女孩上學。
        now: 那個女孩又回來上課了。
      p3:
        was: 1848 年起，她去學校的路上被扔石頭和糞，包里多帶一件紗麗，到校再換上。
        now: 從一個春天的早上起，路邊沒人再朝她扔東西，那件備用的紗麗一直疊在包里沒用上。
    vignettes:
      slate: '{staff}把石板橫過來，讓兩個女孩同時夠得著。喊她們回家時，兩人都留了一道筆跡，彼此都指得出是誰寫的。'
      road: 去布德瓦爾區的路上，{staff}落後半步跟著，把包拎在背對門口的那一側。那天早上，街上沒人說話。
      chalk: '{staff}把最後一支粉筆掰成兩截，一截給黑板，一截給石板，又記下要去集市上買的東西。'
  ino_tadataka_ezo:
    name: 被直線吞掉的轉彎
    place: 北海道
    figure: 伊能忠敬
    story: 1800 年 6 月 11 日，伊能忠敬帶著一行五人從江戶出發，去測量蝦夷地，也就是今天的北海道。他們在島上待了約半年，測了東南沿岸。他於 1818 年去世，死訊一度被隱瞞，好讓測繪繼續；1821 年，高橋景保等人完成了《大日本沿海輿地全圖》。
    relic: 一根測杖
    relic_desc: 一根量步距用的細杖，上面刻著尺度。
    points:
      p1: 盤纏見底的時候，護住測量隊的行程，讓測繩按期鋪到西別
      p2: 幫他把一段海岸從步測換成用繩量，讓那一段的數先準起來
      p3: 幫他把測繩從西別再往前鋪一段，讓這一趟多測一截沒測到的海岸
    points_fail:
      p1: 隊伍在西別之前就撐不下去回了頭，回到江戶也畫不出那一路的圖。
      p2: 這條分支裡，蝦夷地的每一段仍只是步數。
      p3: 測量照舊在西別回頭，這條分支與歷史一樣。
    shift:
      p1:
        was: 1800 年，伊能忠敬的測量隊沿蝦夷地東南海岸一路測到西別，再折返江戶。
      p2:
        was: 1800 年的第一次測量全靠步測，到第二次測量才用上測繩。
        now: 蝦夷地有一段海岸先用上了繩。
      p3:
        was: 1800 年的第一次測量到西別為止，北海道其余的海岸要等以後的測量補上。
        now: 測繩越過西別又往前鋪了一段，回到江戶的那幾張圖上多了一截海岸。
    vignettes:
      bend: 一處海灣眼看要被畫進一條直線里，{staff}請他們在拐彎處再測一次方位，那個彎就留在了紙上。
      repeat: '{staff}用同樣的步子把一段路又走了一遍，兩次的步數并排記著，沒去挑哪一個。'
      sketch: 眾人歇腳時，{staff}在計數單背面畫了一個岬角的輪廓，標出測繩鋪在哪里。
  hargrave_stanwell_park:
    name: 第四只風箏
    place: 澳大利亞斯坦威爾公園
    figure: 勞倫斯·哈格雷夫
    story: 勞倫斯·哈格雷夫 1893 年開始試驗箱形風箏。1894 年 11 月 12 日，在斯坦威爾公園的海灘上，四只串在一起的箱形風箏把他拉離沙地，升到約 16 英尺高。新南威爾士州立圖書館藏的照片里有哈格雷夫、詹姆斯·斯韋恩和試驗器材。1915 年 7 月 6 日他在悉尼去世。
    relic: 一片箱形風箏的備用簽
    relic_desc: 一片給箱形風箏骨架用的備用簽。
    points:
      p1: 11 月 12 日，在陣風里護住那串風箏，讓他升起來，再平安落回沙地
      p2: 幫他完成這四只風箏的尺寸和做法圖，在澳洲留下一份
    points_fail:
      p1: 一陣風把風箏串扯偏了，座椅砸回沙地，這條分支裡沒有那次離地 16 英尺。
      p2: 這四只風箏照史實只留在他自己手裡，這條分支裡斯坦威爾公園沒有另一份。
    shift:
      p1:
        was: 1894 年 11 月 12 日，斯坦威爾公園的海灘上，四只串起來的箱形風箏把哈格雷夫拉離沙地，升到將近 16 英尺。
      p2:
        was: 1894 年，這四只風箏的做法只在哈格雷夫自己手裡；他晚年把模型送去慕尼黑，大多毀於二戰。
        now: 那四只風箏的圖紙在斯坦威爾公園留了一份，沒有跟著別的模型去慕尼黑。
        who: hargrave_stanwell_park
        bio: 哈格雷夫 1894 年那四只箱形風箏的尺寸和做法圖在斯坦威爾公園留了一份。他的模型後來大多毀於二戰，這四只怎樣做的，在澳洲仍查得到。
    vignettes:
      four: 升空之後，{staff}把沙灘上鋪開的風箏又數了一遍，四只都記在本子上，用括號圈在一起，讓下一個讀的人知道它們是一起飛的。
      tag: 一張簽從骨架上扯脫了，{staff}沿著濕沙往回找，找到后重新打了個結系上。
      lift: 先放一隻風箏試風時，{staff}和幫手們站在沙丘上，學會了拉著繩該往哪邊跑。
  sun_yat_sen_guangzhou:
    name: 從銅像到一所新大學
    place: 廣州
    figure: 孫中山
    story: 你站在中山大學的孫中山像前，被帶回 1924 年 2 月 4 日的廣州，這一天他下令把三所學校合併為國立廣東大學，派鄒魯籌備。同一段日子裡，他星期天在高等師範的禮堂演講，講稿在幾個人手裡來回走，後來成了一本書。9 月 19 日開學，11 月 11 日舉行成立典禮，用的是他寫的校訓。1925 年 3 月 12 日他在北京去世，1926 年這所大學以他的名字命名。
    relic: 孫中山銅像
    relic_desc: 中山大學校園裡的孫中山銅像。它是通往 1924 年廣州的穿越媒介，不是古董，不能出售。
    points:
      p1: 選址之前，把走熟的校址畫成圖交給籌備處
      p2: 帶回一本演講印成的書
      p3: 待到最後一講
    vignettes:
      slips: 一位編出來的辦事員正要抄一頁稿子，稿上有一張籤條蓋住了兩行。你問他籤條是誰的字，稿子又是誰的字。他先抄了稿子，籤條留在原處沒有動。
      back_row: 一位編出來的學生找不到座位，老是站起來張望。你往裡挪了挪。他坐下來聽完了後半場，一句話沒說，散場時朝你點了點頭。
      hundred: 你在本子最後一頁畫正字，一天一筆。畫滿一百天的時候，一位編出來的辦事員問你在數什麼。你說，日子。
