blurb: Three schools, four places and one order to join them. Close, cheap, and the effect of care and clear directions is clear. This is where the game begins.
handle_label: The preparatory work begins
protagonist: Sun Yat-sen
protagonist_role: A statesman who has just ordered three schools joined into one university and wants it built
stay: Stay seven days
plan_baseline: Main timeline
encyclopedia:
  history:
    - text: 'On 4 February 1924 Sun Yat-sen ordered the National Higher Normal School, the Guangdong School of Law and Politics and the Guangdong Agricultural School joined into National Guangdong University.'
      check: true
    - text: 'Zou Lu took up the preparation on 21 February. The schools were spread over four places in the city, and Sun settled on a new campus at Shipai, where some villagers objected.'
      check: true
    - text: 'Classes began on 19 September, and the founding ceremony was held on 11 November with the motto Sun wrote: study widely, enquire carefully, think prudently, discern clearly, practise earnestly.'
      check: true
    - text: 'Sun Yat-sen died in Beijing on 12 March 1925, and in 1926 the university was renamed National Sun Yat-sen University.'
      check: true
  regret:
    - 'You can help today''s people but not tomorrow''s. On the main timeline the preparatory work began on 21 February.'
    - 'A plan and a place matter more than any one speech, but they only come when someone is heard.'
events:
  door_block_stubborn: The head of one of the schools blocks the door. He says his school has its own ways and no stranger will tell it to change. {staff} is stubborn, does not give way, is pushed aside and loses {d.ors_stock:i} packs of supplies.
  door_block_stubborn_empty: The head of one of the schools blocks the door. He says his school has its own ways and no stranger will tell it to change. {staff} is stubborn, does not give way, and is pushed aside.
  door_block_insist_empty: The head of one of the schools blocks the door. He says his school has its own ways and no stranger will tell it to change. {staff} stands firm and finishes speaking, and is turned away.
  door_block_insist: The head of one of the schools blocks the door. He says his school has its own ways and no stranger will tell it to change. {staff} stands firm and finishes speaking, is turned away, and loses {d.ors_stock:i} packs of supplies.
  door_block_appeal: The head of one of the schools blocks the door. {staff} does not force the way, turns and goes to Sun Yat-sen to ask for support.
  door_block_yield: The head of one of the schools blocks the door. {staff} steps back without a quarrel, and half a day is wasted.
  time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
star_points:
  convince: 'Convince Sun Yat-sen'
  trust: 'Win the trust of the three schools'
  reform: 'Have the preparatory work begin ahead of history'
  campus: 'Make the four places known to everyone'
  settled: 'Settle the people who were lost'
milestones:
  site_known: '{date}: {staff} has the map of the four places in every hand. Nobody asks where to go any more.'
  people_settled: '{date}: {staff} has found a place and a class for every one of the people who were lost.'
  first_treat: '{date}: {staff} writes down the first names and sorts a teacher and his class into a room. A person who was lost starts to speak.'
  first_protect: '{date}: {staff} draws the first simple map of the four places and hands it round, and teaches the clerks to give directions.'
  met_sun: '{date}: {staff} meets Sun Yat-sen in his office. He listens closely but keeps asking one thing: how many people, and where.'
  sun_trusts: '{date}: Sun starts to treat {staff} as one of his own and brings out the lists of the three schools.'
  sun_convinced: '{date}: Sun no longer merely hopes the schools will join. He has the numbers, and believes what the stranger told him.'
  board_moves: '{date}: The heads of the schools start to give way and say the preparation might begin.'
  reform_history: '{date}: The preparatory work begins. The main timeline does not change.'
  reform_early: '{date}: The preparatory work begins {advance_days:1} days earlier than in the main timeline. The main timeline does not change, only this branch.'
  trust_won: '{date}: The teachers no longer keep {staff} out, and some ask for help.'
  exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
  outbreak_fades: '{date}: The number of unsettled people falls to single digits.'
summary:
  near_death: '{staff} collapses at Guangzhou and is pulled back by the recall charm. Life saved, at a price.'
  stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
  gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
  legend: '{staff} left a legend at Guangzhou. The preparatory work began {advance_days:1} days earlier than in the main timeline.'
  perfect: '{staff} completed the task at Guangzhou and came back safe. {base_D:i} lost on the main timeline, {D:i} on this branch.'
  scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
  modest: '{staff} spent seven days at Guangzhou, did what was within reach, and came back safe.'
quotes:
  near_death:
    - trait: kind
      text: At the end I was still wondering whether anyone was keeping watch at night.
    - text: I thought I could hold out a little longer.
  stay_and_gifts:
    - trait: kind
      text: I remember every one of their names. I want to stay a while.
    - text: They need people here.
  gave_up:
    - trait: homesick
      text: I want to go home. That is all.
    - text: I am not cut out for this.
  legend:
    - text: I only told them what they needed to hear.
  perfect:
    - trait: kind
      text: I could save today's people, not tomorrow's.
    - trait: curious
      text: So that is how it is, people stay when they know where to go.
    - text: Did what had to be done.
  scramble:
    - trait: methodical
      text: They will understand sooner or later. Just later.
    - text: Next time I want to bring more.
  modest:
    - trait: glib
      text: I said all I had to say. Whether they listen is up to them.
    - text: With one more item I might have saved one more life.
hints:
  lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
  unused_protect: Maps were left over. The limit was the trust of the three schools, not the supplies. Let the employee help people first to build trust.
  unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
  ally_gap: Sun Yat-sen's evidence is still thin. The handbook helps, provided the employee spends time with him.
  none: Change one thing and send again with the same seed, that makes the comparison clearest.
