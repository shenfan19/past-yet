plots:
  school_registers:
    name: Give Sun the registers of the three schools
    desc: Lets him see the numbers of the teachers and students at a glance.
    character: Sun Yat-sen
    article: people:sun_yat_sen_guangzhou
  germ_theory:
    name: Explain germ theory to Sun Yat-sen
    desc: Needs the craft of microbiology, which this era does not have.
    character: Sun Yat-sen
