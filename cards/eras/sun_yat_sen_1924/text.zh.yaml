blurb: 三所学校，四处校址，一道合并的命令。近，成本低，照应和指路的效果很明显。游戏从这里开始。
handle_label: 筹备工作开始
protagonist: 孙中山
protagonist_role: 刚下令把三所学校并成一所大学、想把它办起来的政治家
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: '1924 年 2 月 4 日，孙中山下令把国立高等师范学校、广东法科大学和广东农业专门学校合并为国立广东大学。'
      check: true
    - text: '邹鲁 2 月 21 日接手筹备。几所学校分散在城里四处，孙中山定下在石牌建新校区，那里有村民反对。'
      check: true
    - text: '9 月 19 日开学，11 月 11 日举行成立典礼，用的是孙中山写的校训：博学、审问、慎思、明辨、笃行。'
      check: true
    - text: '孙中山 1925 年 3 月 12 日在北京去世，1926 年这所大学改名为国立中山大学。'
      check: true
  regret:
    - '你能帮今天的人，帮不了明天的。主时间线上筹备工作 2 月 21 日开始。'
    - '一个计划和一个地方比任何一次演讲都重要，但它们只有在有人被听见时才会来。'
events:
  door_block_stubborn: 一所学校的负责人拦在门口，说他的学校有自己的规矩，外人没资格叫它改。{staff} 倔强，不肯让路，被推到一边，丢了 {d.ors_stock:i} 份物资。
  door_block_stubborn_empty: 一所学校的负责人拦在门口，说他的学校有自己的规矩，外人没资格叫它改。{staff} 倔强，不肯让路，被推到一边。
  door_block_insist_empty: 一所学校的负责人拦在门口，说他的学校有自己的规矩，外人没资格叫它改。{staff} 站稳把话说完，被请走了。
  door_block_insist: 一所学校的负责人拦在门口，说他的学校有自己的规矩，外人没资格叫它改。{staff} 站稳把话说完，被请走了，丢了 {d.ors_stock:i} 份物资。
  door_block_appeal: 一所学校的负责人拦在门口，{staff} 不硬闯，转身去找孙中山，请他支持。
  door_block_yield: 一所学校的负责人拦在门口，{staff} 没有争吵，退了一步，半天白白过去。
  time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
