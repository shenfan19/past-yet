  exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
  outbreak_fades: '{date}：无所依靠的人数降到了个位数。'
summary:
  near_death: '{staff} 在广州倒下，被召回符拉了回来。人救下了，代价不小。'
  stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
  gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
  legend: '{staff} 在广州留下了传说。筹备工作比主时间线提前 {advance_days:1} 天开始。'
  perfect: '{staff} 在广州完成了任务，平安回来。主时间线损失 {base_D:i} 人，这条分支损失 {D:i} 人。'
  scramble: '{staff} 一次次被拒绝，最后带着一个笑话逃了回来。'
  modest: '{staff} 在广州待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人守着。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把他们需要听到的话告诉了他们。
  perfect:
    - trait: kind
      text: 我能救今天的人，救不了明天的。
    - trait: curious
      text: 原来是这样，人知道往哪里去，才会留下来。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，听不听由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 简图剩下了。限制不是物资，是三所学校对你的信任。先让员工帮人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进来。
  ally_gap: 孙中山的证据还很薄。手册能帮上忙，前提是员工花时间和他在一起。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
