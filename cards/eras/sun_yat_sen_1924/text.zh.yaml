milestones:
  site_known: '{date}：{staff} 让四处校址的简图人手一份，没有人再问往哪里去。'
  people_settled: '{date}：{staff} 给每一个迷路的人都找到了位置和班级。'
  first_treat: '{date}：{staff} 记下第一批名字，把一位老师和他的班安排进一间教室。一个迷路的人开始开口了。'
  first_protect: '{date}：{staff} 画出第一张四处校址的简图发下去，教文书们怎样指路。'
  met_sun: '{date}：{staff} 在办公室见到孙中山。他听得很认真，却一再问同一件事：有多少人，在哪里。'
  sun_trusts: '{date}：孙中山开始把 {staff} 当自己人，拿出三所学校的名单。'
  sun_convinced: '{date}：孙中山不再只是盼着学校合起来。他有了数字，也信了这位陌生人告诉他的话。'
  board_moves: '{date}：几所学校的负责人开始松口，说筹备也许可以开始。'
  reform_history: '{date}：筹备工作开始了。主时间线没有变化。'
  reform_early: '{date}：筹备工作比主时间线提前 {advance_days:1} 天开始。主时间线没有变化，只是这条分支。'
