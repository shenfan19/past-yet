blurb: 岛上干热，满是熔岩，淡水很少，还有一位什么都要记下来的年轻博物学家。近，成本低，水和遮阴的效果很明显。
handle_label: 水和食物的计划被改
protagonist: 查尔斯·达尔文
protagonist_role: 在岛上采集、想弄懂自己所见的年轻博物学家
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: 1835 年测量船小猎犬号在加拉帕戈斯群岛停留约五周，从 9 月 15 日到 10 月 20 日。
      check: true
    - text: 查尔斯·达尔文上了几座岛，在酷热中采集鸟、植物和岩石。
      check: true
    - text: 他在那里看到并记下的东西，后来成了他关于物种怎样变化的想法的一部分，但不是立刻的。
      check: true
  regret:
    - 你能救今天的人，救不了整次航行。主时间线上计划没有改。
    - 水和遮阴比任何一个聪明的主意都重要，但计划只有在有人被听见时才会改。
