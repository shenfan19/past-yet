event_titles:
  door_block: 被拒之门外
  time_strain: 时间错位
plots:
  medicine_chest:
    name: 送西科尔一箱药
    desc: 让她能让来找她的人看到她的药有什么用。
    character: 玛丽·西科尔
    article: people:seacole_balaklava
  germ_theory:
    name: 把细菌致病的理论讲给西科尔
    desc: 需要微生物学的工艺，这个时代还没有。
    character: 玛丽·西科尔
    article: people:seacole_balaklava
blurb: 战线后方营地里的痢疾和霍乱，和一位自己出钱来照看这些人的女人。近，成本低，干净的水和照护的效果很明显。
handle_label: 营地物资向她开放
protagonist: 玛丽·西科尔
protagonist_role: 被军队拒绝、自己来到营地的护士和商人
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: 玛丽·西科尔 1805 年生于牙买加，从母亲和加勒比的经历里学到护理和草药。
      check: true
    - text: 她申请去克里米亚当军队护士时被拒绝，于是自费前往。
      check: true
    - text: 在巴拉克拉瓦附近，她在营地后方开了一家客栈，照看患痢疾和霍乱的士兵。
      check: true
  regret:
    - 你能救今天的病人，救不了明天的。她得先争取到出现在那里的权利。
    - 营地物资向她开放的日期没有记录，所以游戏自己定了一天。
events:
  door_block_stubborn: 一位营地军官拦在门口，说阵线里没有外人的位置。{staff} 倔强，不肯让路，被赶了出去，丢了 {d.ors_stock:i} 包物资。
  door_block_stubborn_empty: 一位营地军官拦在门口，说阵线里没有外人的位置。{staff} 倔强，不肯让路，被赶了出去。
  door_block_insist_empty: 一位营地军官拦在门口，说病人是军队自己的事。{staff} 站在门口把话说完，被请了出去。
  door_block_insist: 一位营地军官拦在门口，说病人是军队自己的事。{staff} 站在门口把话说完，被请了出去，丢了 {d.ors_stock:i} 包物资。
  door_block_appeal: 一位营地军官拦在门口。{staff} 不硬闯，转身去找西科尔，请她出面说话。
  door_block_yield: 一位营地军官拦在门口。{staff} 没有争吵，退了一步，半天白白过去。
  time_strain: '{date}：{staff} 听到钟声错了半拍。这条分支离历史更远了，{staff} 明显更累。'
star_points:
  convince: "说服西科尔"
  trust: "赢得营地的信任"
  reform: "让营地物资更早向她开放"
milestones:
  first_treat: '{date}：{staff} 调好第一杯补液盐，一位病人开始说话了。'
  first_protect: '{date}：{staff} 发下第一批干净的水，擦洗了几顶帐篷，教士兵把喝的水烧开。'
  met_seacole: '{date}：{staff} 在她的客栈里遇到西科尔。她听得很认真，却一再问同一件事：你能为这些人做什么。'
  seacole_trusts: '{date}：西科尔开始把 {staff} 当自己人，拿出她留给最重病例的药方。'
  seacole_convinced: '{date}：西科尔不再只是盼着干净的水有用。她亲眼见了，也信了这位陌生人告诉她的话。'
  board_moves: '{date}：军需官开始松口，说也许能匀出一箱药。'
  reform_history: '{date}：营地物资向她开放。主时间线没有变化。'
  reform_early: '{date}：营地物资比主时间线提前 {advance_days:1} 天向她开放。主时间线没有变化，只是这条分支。'
  trust_won: '{date}：军官们不再把 {staff} 挡在外面，有的还把人送了过来。'
  exhausted: '{date}：{staff} 累得手发抖，不得不休息。'
  outbreak_fades: '{date}：营地里生病的人数降到了个位数。'
summary:
  near_death: '{staff} 在营地里倒下，被召回符拉了回来。人救下了，代价不小。'
  stay_and_gifts: '{staff} 完成了任务，但没有回来。留下一张字条，说想再陪这些人一阵子。礼物之后会到。'
  gave_up: '{staff} 提前放弃，回到了现在。{staff} 说这里不适合自己。'
  legend: '{staff} 在巴拉克拉瓦留下了传说。营地物资比主时间线提前 {advance_days:1} 天向西科尔开放。'
  perfect: '{staff} 在巴拉克拉瓦完成了任务，平安回来。主时间线死了 {base_D:i} 人，这条分支死了 {D:i} 人。'
  scramble: '{staff} 一次次被拒之门外，最后带着一个笑话逃了回来。'
  modest: '{staff} 在巴拉克拉瓦待了七天，做了力所能及的事，平安回来。'
quotes:
  near_death:
    - trait: kind
      text: 到最后我还在想，夜里有没有人陪着那些病人。
    - text: 我以为还能再撑一会儿。
  stay_and_gifts:
    - trait: kind
      text: 我记得他们每个人的名字。我想再待一阵。
    - text: 这里需要人。
  gave_up:
    - trait: homesick
      text: 我想回家，就这样。
    - text: 我不是干这个的料。
  legend:
    - text: 我只是把她需要听到的话告诉了她。
  perfect:
    - trait: kind
      text: 我能救今天的病人，救不了明天的。
    - trait: curious
      text: 原来是这样，干净的水和一双稳的手作用这么大。
    - text: 该做的做了。
  scramble:
    - trait: methodical
      text: 他们迟早会明白，只是会晚一些。
    - text: 下次我想多带点东西。
  modest:
    - trait: glib
      text: 该说的我都说了，信不信由他们。
    - text: 再多带一件东西，也许还能多救一个人。
hints:
  lost_ors: 丢了不少物资。下次让员工退让，或者多带一些。
  unused_protect: 氯片剩下了。限制不是物资，是营地对你的信任。先让员工帮病人做事，建立信任。
  unused_ors: 物资剩下了。员工可能把时间花在别处，或者没被放进门。
  ally_gap: 西科尔的证据还很薄。手册能帮她，前提是员工花时间和她在一起。
  none: 只改一样东西，用同一个种子再派一次，这样对比最清楚。
