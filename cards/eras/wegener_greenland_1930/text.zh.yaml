blurb: 黑夜降临前最后几周冰上的一支科学考察队，冰盖中央的站点还缺物资。近，成本低，保暖和食物的效果很明显。
handle_label: 补给计划被改
protagonist: 阿尔弗雷德·魏格纳
protagonist_role: 带队的科学家，正设法把物资及时送到冰盖中央的站点
stay: 停留七天
plan_baseline: 主时间线
encyclopedia:
  history:
    - text: 1930 年阿尔弗雷德·魏格纳带领一支德国考察队到格陵兰，研究冰盖和天气。
      check: true
    - text: 考察队在冰盖中央设了一个站点，入冬前给它送补给既难又晚。
      check: true
    - text: 魏格纳 1930 年 11 月在从中央站点返回的路上死在冰上，遗体第二年春天被找到。
      check: true
  regret:
    - 你能救今天的人，救不了整个冬天。主时间线上计划没有及时改变。
    - 保暖和食物比任何一个聪明的主意都重要，但计划只有在有人被听见时才会改。
