name: Mount Everest, 1924
short: Everest
place_name: Mount Everest, north side
tags:
  - medical
  - altitude
  - expedition
  - c20
  - himalaya
  - history
event_titles:
  time_strain: Time slip
plots:
  field_notes:
    name: Give Mallory a field notebook
    desc: Lets him set down the camps, the weather and the oxygen so that others can check them.
    character: George Mallory
    article: people:mallory_everest
  germ_theory:
    name: Explain germ theory to George Mallory
    desc: Needs the craft of microbiology, which this era does not have.
    character: George Mallory
    article: people:mallory_everest
blurb: High camps in thin air on the north side of the mountain, with oxygen sets of doubtful use. Close, cheap, and the effect of oxygen and rest is clear.
handle_label: The plan for the high camps is changed
protagonist: George Mallory
protagonist_role: A schoolmaster and climber who has been on the mountain before and wants to reach the top
stay: Stay seven days
plan_baseline: Main timeline
encyclopedia:
  history:
    - text: In 1924 a British expedition attempted Mount Everest from the north side, after the attempts of 1921 and 1922.
      check: true
    - text: Oxygen sets were carried up, and climbers did not agree how much they helped or how heavy they were.
      check: true
    - text: George Mallory and Andrew Irvine were last seen climbing high on the mountain on 8 June 1924.
      check: true
  regret:
    - You can save today's people but not the whole mountain. On the main timeline the plan was not changed.
    - Rest and oxygen matter more than any one brave idea, but a plan only changes when someone is heard.
events:
  time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
star_points:
  convince: 'Convince Mallory'
  trust: 'Win the trust of the party'
  reform: 'Have the plan for the high camps changed ahead of history'
milestones:
  first_treat: '{date}: {staff} gives the first dose of medicine and warm tea to a man with a splitting head. He starts to speak.'
  first_protect: '{date}: {staff} hands out the first oxygen and blankets at the camp, and teaches the porters to use them.'
  met_mallory: '{date}: {staff} is received by Mallory.'
  mallory_trusts: '{date}: Mallory gives {staff} the notes to work from.'
  mallory_convinced: '{date}: Mallory takes up the plan that {staff} put to him.'
  board_moves: '{date}: Word goes round that the plan might change.'
  reform_history: '{date}: The plan for the high camps is changed. The main timeline does not change.'
  reform_early: '{date}: The plan for the high camps is changed {advance_days:1} days earlier than in the main timeline. The main timeline does not change, only this branch.'
  trust_won: '{date}: The porters no longer keep {staff} out, and some ask for help.'
  exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
  outbreak_fades: '{date}: The number of ailing men falls to one or none.'
summary:
  near_death: '{staff} collapses at Everest and is pulled back by the recall charm. Life saved, at a price.'
  stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
  gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
  legend: '{staff} left a legend at Everest. The plan was changed {advance_days:1} days earlier than in the main timeline.'
  perfect: '{staff} completed the task at Everest and came back safe. {base_D:i} lost on the main timeline, {D:i} on this branch.'
  scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
  modest: '{staff} spent seven days at Everest, did what was within reach, and came back safe.'
quotes:
  near_death:
    - trait: kind
      text: At the end I was still wondering whether anyone was keeping watch at night.
    - text: I thought I could hold out a little longer.
  stay_and_gifts:
    - trait: kind
      text: I remember every one of their names. I want to stay a while.
    - text: They need people here.
  gave_up:
    - trait: homesick
      text: I want to go home. That is all.
    - text: I am not cut out for this.
  legend:
    - text: I only told them what they needed to hear.
  perfect:
    - trait: kind
      text: I could save today's people, not tomorrow's.
    - trait: curious
      text: So that is how it is, oxygen and rest are what keep a party going up there.
    - text: Did what had to be done.
  scramble:
    - trait: methodical
      text: They will understand sooner or later. Just later.
    - text: Next time I want to bring more.
  modest:
    - trait: glib
      text: I said all I had to say. Whether they listen is up to them.
    - text: With one more item I might have saved one more life.
hints:
  lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
  unused_protect: Oxygen was left over. The limit was the trust of the party, not the supplies. Let the employee help people first to build trust.
  unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
  ally_gap: George Mallory's evidence is still thin. The handbook helps, provided the employee spends time with him.
  none: Change one thing and send again with the same seed, that makes the comparison clearest.
