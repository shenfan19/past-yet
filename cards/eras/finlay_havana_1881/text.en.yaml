name: Havana, 1881
short: Havana
place_name: Havana, Cuba
tags:
  - medical
  - infection
  - yellow-fever
  - c19
  - havana
  - history
event_titles:
  door_block: Turned away at the door
  time_strain: Time slip
plots:
  microscope:
    name: Give Finlay a microscope
    desc: Lets him show the mosquito and what it carries more clearly.
    character: Carlos Finlay
    article: people:finlay_havana
  germ_theory:
    name: Explain germ theory to Finlay
    desc: Needs the craft of microbiology, which this era does not have.
    character: Carlos Finlay
    article: people:finlay_havana
blurb: Yellow fever in a hot port, and a doctor who says mosquitoes carry it before anyone will listen. Close, cheap, and the effect of nets and nursing is clear.
handle_label: Action against the mosquito begins
protagonist: Carlos Finlay
protagonist_role: A physician who says the mosquito carries the fever and is not yet believed
stay: Stay seven days
plan_baseline: Main timeline
encyclopedia:
  history:
    - text: Yellow fever came back to Havana in the hot months and killed many people, especially newcomers.
      check: true
    - text: Carlos Finlay told the Havana Academy of Sciences in August 1881 that a mosquito carried yellow fever.
      check: true
    - text: Most physicians did not accept it, and it was not proved until after 1900, when the city began to control mosquitoes.
      check: true
  regret:
    - You can save today's patients but not tomorrow's. On the main timeline the city acted on the mosquito some twenty years later.
    - A good idea is not enough, it has to be shown again and again to people who do not want to hear it.
events:
  door_block_stubborn: A physician bars the door, saying yellow fever comes from filth and bad air and no stranger will tell him otherwise. {staff} is stubborn, does not give way, is pushed out and loses {d.ors_stock:i} packets of supplies.
  door_block_stubborn_empty: A physician bars the door, saying yellow fever comes from filth and bad air. {staff} is stubborn, does not give way, and is pushed out.
  door_block_insist_empty: A physician bars the door, saying it is the bad air and not the mosquito. {staff} stands at the door and finishes speaking, and is turned away.
  door_block_insist: A physician bars the door, saying it is the bad air and not the mosquito. {staff} stands at the door and finishes speaking, is turned away, and loses {d.ors_stock:i} packets of supplies.
  door_block_appeal: A physician bars the door. {staff} does not force the way, turns and goes to Finlay to ask him to speak up.
  door_block_yield: A physician bars the door. {staff} steps back without a quarrel, and half a day is wasted.
  time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
star_points:
  convince: "Convince Finlay"
  trust: "Win the trust of the district"
  reform: "Have the city act on the mosquito ahead of history"
milestones:
  first_treat: '{date}: {staff} mixes the first cup of rehydration solution. A patient starts to speak.'
  first_protect: '{date}: {staff} hangs the first nets over the beds of a few households willing to listen, and shows them how to keep the mosquitoes out.'
  met_finlay: '{date}: {staff} meets Finlay at a bedside. He listens closely but keeps asking one thing: where is the evidence.'
  finlay_trusts: '{date}: Finlay starts to treat {staff} as one of his own and brings out the notes on the cases he has been keeping to compare.'
  finlay_convinced: '{date}: Finlay no longer merely suspects the mosquito. He has enough cases, and believes what the stranger told him.'
  board_moves: '{date}: The Sanitary Board starts to give way and says the mosquito might be looked into.'
  reform_history: '{date}: The authorities begin to act against the mosquito. The main timeline does not change.'
  reform_early: '{date}: The authorities begin to act against the mosquito {advance_days:1} days earlier than in history. The main timeline does not change, only this branch.'
  trust_won: '{date}: People in the district no longer keep {staff} out, and some knock on their own.'
  exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
  outbreak_fades: '{date}: The number of patients falls to single digits. Many people have left for the hills.'
summary:
  near_death: '{staff} collapses in a Havana street and is pulled back by the recall charm. Life saved, at a price.'
  stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
  gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
  legend: '{staff} left a legend in Havana. The authorities began to act against the mosquito {advance_days:1} days earlier than in history.'
  perfect: '{staff} completed the task in Havana and came back safe. {base_D:i} died on the main timeline, {D:i} on this branch.'
  scramble: '{staff} was turned away at the door again and again and finally fled back with a joke to tell.'
  modest: '{staff} spent seven days in Havana, did what was within reach, and came back safe.'
quotes:
  near_death:
    - trait: kind
      text: At the end I was still wondering whether anyone was sitting with the sick at night.
    - text: I thought I could hold out a little longer.
  stay_and_gifts:
    - trait: kind
      text: I remember every one of their names. I want to stay a while.
    - text: They need people here.
  gave_up:
    - trait: homesick
      text: I want to go home. That is all.
    - text: I am not cut out for this.
  legend:
    - text: I only told him what he needed to hear.
  perfect:
    - trait: kind
      text: I could save today's patients, not tomorrow's.
    - trait: curious
      text: So that is how it is, a mosquito really does carry it.
    - text: Did what had to be done.
  scramble:
    - trait: methodical
      text: They will understand sooner or later. Just later.
    - text: Next time I want to bring more.
  modest:
    - trait: glib
      text: I said all I had to say. Whether they believe it is up to them.
    - text: With one more item I might have saved one more life.
hints:
  lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
  unused_protect: Nets were left over. The limit was the trust of the district, not the nets. Let the employee help patients first to build trust.
  unused_ors: Supplies were left over. The employee may have spent time elsewhere, or patients were not let in.
  ally_gap: Finlay's evidence is still thin. The handbook helps him, provided the employee spends time with him.
  none: Change one thing and send again with the same seed, that makes the comparison clearest.
