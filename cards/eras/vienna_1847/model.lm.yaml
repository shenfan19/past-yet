  count_gain: {type: parameter, value: 0.1, source: game_assumption}
  belief_evidence_rate: {type: parameter, value: 0.4, unit: "1/day", source: game_assumption}
  belief_talk: {type: parameter, value: 0.3, unit: "1/day", source: game_assumption}
  rapport_base: {type: parameter, value: 0.2, unit: "1/day", source: game_assumption}
  rapport_eloquence: {type: parameter, value: 0.4, unit: "1/day", source: game_assumption}
  rapport_handbook: {type: parameter, value: 0.5, unit: "1/day", source: game_assumption}
  evidence_handbook: {type: parameter, value: 0.18, unit: "1/day", source: game_assumption}
  push_gain: {type: parameter, value: 0.25, unit: "1/day", source: calibrated}
