# Vienna General Hospital, first obstetric clinic, 1847. Same engine, different mechanism:
# an inflow of births, hand contamination from autopsy work, and a hospital that has to be persuaded to wash.
# Day 0 is 1 May 1847. Facts marked source: historical are placeholders awaiting a source check, see README.

metadata:
  name: vienna_1847
  version: "0.1"
  lm_format_version: "1.0"
  extension_version: "teleporter/0.1"
  tags: [childbed_fever, hygiene, vienna, 1847]
  era:
    year: 1847
    tech: 5
    geo: {lon: 16.353, lat: 48.221}
    place: vienna_general_hospital
    protagonist: semmelweis
    calendar: {month: 5, day0: 1, month_length: 31}
  description:
    problem: "Mothers on one ward die at several times the rate of mothers on the next ward. History says the doctor who sees the pattern gets a washing rule through in mid May. What can a visitor change about how fast the rule comes and how many wash their hands before it does?"
    method: "Half-day step. A birth inflow, contamination from doctors' hands, a hand-washing coverage state, two agents. The traveller teaches washing and nurses the sick. The protagonist collects the death statistics and pushes the clinic head."
    result: "Teaching washing early saves the most mothers per unit of supply, but only as far as the clinic's resistance gives way. Winning the protagonist's trust moves the date of the rule."
    limitations: "All rates are game assumptions. Not medical advice."

extensions:
  agents: "Named actors with their own states. Each step an agent picks the available action with the highest utility."
  actions: "requires and utility are expressions over declared variables."
  events: "Seeded stochastic events."
  milestones: "One-shot report lines."
  outcomes: "Ordered end states."
  scoring: "Counterfactual score against a no-traveller baseline with the same seed."
  provenance: "Every variable carries source: historical | lm_model | game_assumption | calibrated."
  item_bindings: "Items chosen before departure are delivered at arrival."
  strategies: "Staff habits. The option writes input variables when that employee is dispatched."

roles:
  stay: stay_days
  horizon: horizon_days
  arrive: arrive_day
  recalled: traveler.recalled
  charm: has_charm

agents:
  traveler: {label: employee, role: dispatched, order: 1}
  semmelweis: {label: protagonist, role: era_protagonist, order: 2}

