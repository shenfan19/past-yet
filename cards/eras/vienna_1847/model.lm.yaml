  lobby_evidence_min: {type: parameter, value: 0.3, source: game_assumption}
  push_evidence_min: {type: parameter, value: 0.3, source: game_assumption}
  push_belief_min: {type: parameter, value: 0.45, source: game_assumption}
  talk_base: {type: parameter, value: 0.3, source: game_assumption}

  instab_work: {type: parameter, value: 1.2, source: game_assumption}
  instab_advance: {type: parameter, value: 0.05, source: game_assumption}
  strain_base: {type: parameter, value: 1.6, unit: "1/day", source: game_assumption}
  strain_health: {type: parameter, value: 0.12, source: game_assumption}
  strain_fatigue: {type: parameter, value: 0.15, source: game_assumption}

equations:
  traveler_response:
    priority: 95
    dynamics:
      resp_insist: "1 if (on_block == 1 or traveler.stubbornness >= yield_override) else 0"
      resp_yield: "1 if (resp_insist == 0 and on_block == 0) else 0"
      resp_appeal: "1 if (resp_insist == 0 and on_block == 2) else 0"

  washing_rule:
    priority: 90
    description: "The washing rule starts when the clinic head gives way or on the historical date, whichever is first."
    dynamics:
      semmelweis.board_pressure: "semmelweis.board_pressure + (sem_act_push * semmelweis.authority * semmelweis.belief * semmelweis.evidence * push_gain + act_lobby * traveler.eloquence * semmelweis.rapport * semmelweis.evidence * lobby_gain) * step"
      mandate_day: "mandate_day if mandate_day >= 0 else (day if (semmelweis.board_pressure >= 1 or day >= mandate_day_hist) else -1)"
      mandate_on: "1 if mandate_day >= 0 else 0"
      advance_days: "max(0, mandate_day_hist - mandate_day) if mandate_day >= 0 else 0"
      resist: "max(resist_floor, resist - resist_decay * (semmelweis.evidence * semmelweis.belief + act_lobby * semmelweis.rapport) * step)"

  contamination:
    priority: 80
    dynamics:
      wash: "max(wash, mandate_cover * mandate_on)"
      hazard: "hazard_open * (1 - wash * wash_eff)"

  access_and_load:
    priority: 75
    dynamics:
      access: "access_floor + (1 - access_floor) * clamp(traveler.trust, 0, 1)"
      ward_load: "clamp((Iu + It) / ward_scale, 0, 1)"

  teach_washing:
    priority: 70
    dynamics:
      wash_cap: "act_teach * teach_rate * (1 - resist) * (1 + prestige * 0) * access * (1 - traveler.fatigue * fatigue_penalty) * step"
      wash_flow: "min(1 - wash, wash_cap, wash_supply / supply_per_wash)"
      wash_supply: "wash_supply - wash_flow * supply_per_wash"
      wash: "wash + wash_flow"
      wash_total: "wash_total + wash_flow"

  nurse_patients:
    priority: 70
    dynamics:
      treat_cap: "act_nurse * nurse_per_day * (1 - traveler.fatigue * fatigue_penalty) * access * (1 + skill_gain_handbook * has_handbook) * step"
      treated_flow: "min(Iu, treat_cap)"
      Iu: "Iu - treated_flow"
      It: "It + treated_flow"
      treated_total: "treated_total + treated_flow"

  births_and_fever:
    priority: 60
    dynamics:
      new_cases: "births_per_day * step * hazard"
      Iu: "Iu + new_cases"
      cum_cases: "cum_cases + new_cases"

  fever_outcome:
    priority: 59
    dynamics:
      death_flow: "(Iu * cfr_untreated + It * cfr_treated * (1 - forceps_cfr_cut * forceps_given) * (1 - 0.3 * traveler.skill)) * (1 - exp(-step / course_days))"
      R: "R + (Iu + It) * (1 - exp(-step / course_days)) - death_flow"
      D: "D + death_flow"
      Iu: "Iu * exp(-step / course_days)"
      It: "It * exp(-step / course_days)"

  traveller_trust:
    priority: 50
    dynamics:
      traveler.trust: "traveler.trust + trust_gain_treat * treated_flow + trust_gain_teach * wash_flow * 10"

  traveller_body:
    priority: 45
    dynamics:
      traveler.fatigue: "traveler.fatigue + (fat_teach * act_teach + fat_nurse * act_nurse + fat_talk * act_talk + fat_lobby * act_lobby - fat_rest * act_rest) / traveler.stamina * (1 - monitor_fatigue_cut * has_monitor) * step"
      traveler.health: "traveler.health - exposure_rate * (act_nurse * 1.2 + act_teach * 0.4 + act_talk * 0.15) * ward_load * (1 - clamp(traveler.skill * guard_skill, 0, 0.9)) * (1 + traveler.infect_trait) * step + health_recover * act_rest * step"

  traveller_mind:
    priority: 40
    dynamics:
      traveler.homesick: "traveler.homesick + arrived * (homesick_rate * (1 + traveler.homesick_trait * homesick_mult) * (1 - favor_calm * (traveler.favor - 0.5)) - talk_relief * act_talk * semmelweis.rapport) * step"
      traveler.attachment: "traveler.attachment + (attach_nurse * act_nurse + attach_load * ward_load * arrived + attach_talk * act_talk * semmelweis.rapport) * traveler.kindness * step"
      traveler.satisfaction: "traveler.satisfaction + arrived * (sat_treat * treated_flow + sat_wash * wash_flow - sat_death * death_flow - sat_fatigue * max(0, traveler.fatigue - 0.7) * step)"
      traveler.appeal_urge: "max(0, traveler.appeal_urge - appeal_decay * step)"
      traveler.progress: "(treated_total * w_treated + wash_total * w_washed + advance_days * w_advance) / goal_target"

  protagonist:
    priority: 55
    dynamics:
      semmelweis.rapport: "semmelweis.rapport + sem_act_meet * act_talk * (rapport_base + rapport_eloquence * traveler.eloquence + rapport_handbook * has_handbook) * step"
      semmelweis.evidence: "semmelweis.evidence + (sem_act_count * count_rate + count_gain * new_cases / births_per_day + sem_act_meet * act_talk * semmelweis.rapport * evidence_handbook * has_handbook) * step"
      semmelweis.belief: "semmelweis.belief + (belief_evidence_rate * max(0, semmelweis.evidence - semmelweis.belief) + sem_act_meet * act_talk * semmelweis.rapport * traveler.eloquence * belief_talk) * step"

  timeline_strain:
    priority: 35
    dynamics:
      instability: "clamp(instab_work * (treated_total + wash_total * 20) / goal_target + instab_advance * advance_days, 0, 1)"

actions:
  traveler:
    teach:
      level: act_teach
      requires: "arrived == 1 and wash_supply >= supply_per_wash * 0.1 and wash < 1 and traveler.fatigue < tired_limit"
      utility: "pref_prevent * (0.7 + 0.8 * (1 - resist))"
    nurse:
      level: act_nurse
      requires: "arrived == 1 and Iu >= 0.5 and traveler.fatigue < tired_limit"
      utility: "pref_treat * (0.5 + 1.0 * min(1, Iu / treat_sat)) + traveler.kindness * 0.4 * min(1, Iu / treat_sat)"
    talk:
      level: act_talk
      requires: "arrived == 1 and semmelweis.rapport < 1 and traveler.fatigue < tired_limit"
      utility: "pref_ally * (talk_base + traveler.curiosity * 0.7 + (1 - semmelweis.rapport) * 0.5 + 0.3 * has_handbook) + traveler.appeal_urge * 1.2 - traveler.kindness * 0.6 * min(1, Iu / treat_sat)"
    lobby:
      level: act_lobby
      requires: "arrived == 1 and mandate_day < 0 and semmelweis.rapport >= lobby_rapport_min and semmelweis.evidence >= lobby_evidence_min and traveler.fatigue < tired_limit"
      utility: "pref_ally * (traveler.eloquence * 1.4 * semmelweis.rapport + 0.4)"
    rest:
      level: act_rest
      requires: "arrived == 1"
      utility: "rest_weight * max(0, traveler.fatigue - rest_from) + 0.05"
  semmelweis:
    count:
      level: sem_act_count
      requires: "1 == 1"
      utility: "1.1 - semmelweis.evidence"
    push:
      level: sem_act_push
      requires: "semmelweis.evidence >= push_evidence_min and semmelweis.belief >= push_belief_min and mandate_day < 0"
      utility: "0.1 + 2.5 * semmelweis.belief * semmelweis.evidence"
    meet:
      level: sem_act_meet
      requires: "act_talk == 1"
      utility: "3 * (0.4 + semmelweis.rapport)"

events:
  door_block:
    source: game_assumption
    importance: 2
    tag: trait
    when: "(act_teach + act_nurse) > 0"
    probability: "block_base * (1 - access) * (1 + prestige) * step"
    cooldown_days: 1
    effects:
      wash_supply: "max(0, wash_supply - resp_insist * loss_insist - resp_yield * loss_yield)"
      traveler.trust: "traveler.trust - trust_loss_block * (1 + resp_insist) + resp_appeal * 0.03"
      traveler.block_count: "traveler.block_count + 1"
      traveler.health: "max(0, traveler.health - harm_block * traveler.hurt_trait)"
      traveler.appeal_urge: "traveler.appeal_urge + resp_appeal + 0.3 * resp_yield"
      traveler.satisfaction: "traveler.satisfaction - sat_block * (resp_insist + 0.4)"
      traveler.fatigue: "traveler.fatigue + 0.05"
    variants:
      - {when: "resp_insist == 1 and on_block != 1 and d_wash_supply == 0", key: door_block_stubborn_empty}
      - {when: "resp_insist == 1 and d_wash_supply == 0", key: door_block_insist_empty}
      - {when: "resp_insist == 1 and on_block != 1", key: door_block_stubborn}
      - {when: "resp_insist == 1", key: door_block_insist}
      - {when: "resp_appeal == 1", key: door_block_appeal}
      - {when: "resp_yield == 1", key: door_block_yield}
  time_strain:
    source: game_assumption
    importance: 3
    tag: param
    when: "advance_days > 1 and arrived == 1"
    probability: "instability * strain_base * step"
    cooldown_days: 3
    effects:
      traveler.health: "traveler.health - strain_health"
      traveler.fatigue: "traveler.fatigue + strain_fatigue"
      traveler.strain_count: "traveler.strain_count + 1"

milestones:
  first_treat: {when: "treated_total >= 1", importance: 3, tag: branch, needs_traveler: true}
  first_protect: {when: "wash_total >= 0.05", importance: 3, tag: branch, needs_traveler: true}
  met_snow: {when: "sem_act_meet * act_talk >= 1", importance: 4, tag: branch, needs_traveler: true}
  snow_trusts: {when: "semmelweis.rapport >= 0.5", importance: 3, tag: branch, needs_traveler: true}
  snow_convinced: {when: "semmelweis.belief >= 0.8 and semmelweis.rapport >= 0.4", importance: 4, tag: branch, needs_traveler: true}
  board_moves: {when: "semmelweis.board_pressure >= 0.6", importance: 4, tag: branch, needs_traveler: false}
  handle_off_history: {when: "mandate_day >= 0 and advance_days <= 1", importance: 5, tag: history, needs_traveler: false}
  handle_off_early: {when: "mandate_day >= 0 and advance_days > 1", importance: 5, tag: branch, needs_traveler: true}
  trust_won: {when: "traveler.trust >= 0.5", importance: 2, tag: trait, needs_traveler: true}
  exhausted: {when: "traveler.fatigue >= 0.8", importance: 1, tag: param, needs_traveler: true}
  outbreak_fades: {when: "day >= 10 and Iu + It < 4", importance: 2, tag: param, needs_traveler: false}

# Three sync points. A point is hit when its milestone fires in the branch, and all three make three stars.
# Each is a milestone that needs the traveller, so it cannot be hit by history alone.
star_points:
  - {id: convince, kind: persuade, milestone: snow_convinced}
  - {id: protect, kind: care, milestone: first_protect}
  - {id: handle, kind: hold, milestone: handle_off_early}

report: {deaths: D, cases: cum_cases, handle: mandate_day, treated: treated_total, protected: wash_total, protected_scale: 40}

log_importance: {arrive: 5, leave: 5, recall: 5}

tag_source: {history: historical, branch: game_assumption, trait: game_assumption, param: game_assumption}

hints:
  - {when: "wash_supply >= supply_per_wash * 2", key: unused_protect}
  - {when: "traveler.block_count >= 2 and resp_insist == 1", key: lost_ors}
  - {when: "semmelweis.rapport < 0.4 and has_handbook > 0", key: ally_gap}
  - {when: "1 == 1", key: none}

recall:
  when: "traveler.health <= recall_health and arrived == 1"
  with_charm:
    traveler.charm_used: "1"
  without_charm:
    traveler.lost_all: "1"
    wash_supply: "0"

outcomes:
  - {id: near_death, when: "traveler.recalled == 1", energy_mult: 0.3, rest_days: 3}
  - {id: stay_and_gifts, when: "traveler.attachment >= stay_attach and traveler.progress >= 0.45", energy_mult: 0.9, rest_days: 0}
  - {id: gave_up, when: "traveler.homesick >= give_up_homesick or traveler.satisfaction <= give_up_satisfaction", energy_mult: 0.5, rest_days: 1}
  - {id: legend, when: "traveler.progress >= 0.95 and advance_days >= 5", energy_mult: 1.5, rest_days: 1}
  - {id: perfect, when: "traveler.progress >= 0.5 and traveler.satisfaction >= 0.3", energy_mult: 1.0, rest_days: 1}
  - {id: scramble, when: "traveler.block_count >= 2 and traveler.progress < 0.35", energy_mult: 0.4, rest_days: 1}
  - {id: modest, when: "1 == 1", energy_mult: 0.7, rest_days: 1}

scoring:
  lives_saved: "base_D - D"
  cases_prevented: "base_cum_cases - cum_cases"
  change_amount: "max(0, base_D - D) + max(0, base_cum_cases - cum_cases) * 0.3 + advance_days * 1.5"

item_bindings:
  chlorine_tablet: {wash_supply: 3}
  handbook: {has_handbook: 1}
  recall_charm: {has_charm: 1}
  disinfectant: {wash_supply: 6}
  heart_monitor: {has_monitor: 1}

plots:
  forceps: {character: semmelweis, tech: 4, bindings: {forceps_given: 1}}
  germ_theory: {character: semmelweis, tech: 7, bindings: {semmelweis.evidence: 0.5}}

strategies:
  focus:
    cure: {pref_treat: 1.2, pref_prevent: 0.6, pref_ally: 0.5}
    prevent: {pref_treat: 0.6, pref_prevent: 1.2, pref_ally: 0.5}
    ally: {pref_treat: 0.7, pref_prevent: 0.7, pref_ally: 1.5}
    balanced: {pref_treat: 1.0, pref_prevent: 1.0, pref_ally: 0.9}
  on_block:
    yield: {on_block: 0}
    insist: {on_block: 1}
    appeal: {on_block: 2}

series:
  - {id: cases, expr: "Iu + It", label: sick}
  - {id: deaths, expr: "D", label: dead}

simulation:
  step_size: {value: 0.5, unit: day}
  start_day: 0
  plans:
    - {id: baseline, label: "Main timeline, no visitor", regimens: []}
    - id: dispatch
      label: "Dispatch plan built from the pre-departure sheet"
      regimens:
        - {variable: wash_supply, delivery: total, time_start: arrival, from_item: chlorine_tablet}

optimization:
  method: pareto_sample
  objectives:
    - {variable: lives_saved, metric: final, direction: maximize}
    - {variable: cost, metric: final, direction: minimize}
  constraints:
    - {variable: weight, condition: "<= capacity"}
    - {variable: cost, condition: "<= funds"}
  algorithm: {samples: 200, refine: 200, max_jump: 4, skip_prob: 0.5, seed: 11}
  mc: {runs: 4, seed: 7}
  startpoint:
    regimens:
      - {item: chlorine_tablet, variable: wash_supply, delivery: total, optimize: {value: [0, 80], integer: true}}
      - {item: handbook, variable: has_handbook, delivery: total, optimize: {value: [0, 1], integer: true}}
      - {item: recall_charm, variable: has_charm, delivery: total, optimize: {value: [0, 1], integer: true}}
      - {item: disinfectant, variable: wash_supply, delivery: total, optimize: {value: [0, 40], integer: true}}
      - {item: heart_monitor, variable: has_monitor, delivery: total, optimize: {value: [0, 1], integer: true}}
