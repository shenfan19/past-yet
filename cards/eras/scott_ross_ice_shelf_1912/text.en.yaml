name: Ross Ice Shelf, 1912
short: Ross Ice Shelf
place_name: Ross Ice Shelf, Antarctica
tags:
  - medical
  - cold
  - expedition
  - c20
  - antarctica
  - history
event_titles:
  door_block: Turned away
  time_strain: Time slip
plots:
  field_notes:
    name: Give Scott a field notebook
    desc: Lets him set down the weather, the days and the stores in a form others can check.
    character: Robert Falcon Scott
    article: people:scott_last_camp
  germ_theory:
    name: Explain germ theory to Robert Falcon Scott
    desc: Needs the craft of microbiology, which this era does not have.
    character: Robert Falcon Scott
    article: people:scott_last_camp
blurb: The way back from the Pole across the ice shelf, with the fuel and the food running short. Close, cheap, and the effect of warmth and food is clear.
handle_label: The plan for the way back is changed
protagonist: Robert Falcon Scott
protagonist_role: A naval officer who leads the party and keeps a diary of every day
stay: Stay seven days
plan_baseline: Main timeline
encyclopedia:
  history:
    - text: In 1912 Robert Falcon Scott and four companions reached the South Pole and found that a Norwegian party had been there before them.
      check: true
    - text: On the way back across the Ross Ice Shelf the cold, the hunger and the exhaustion wore the party down.
      check: true
    - text: Scott's last diary entry is dated 29 March 1912, and the tent was found by a search party in November.
      check: true
  regret:
    - You can save today's people but not the whole journey. On the main timeline the party did not come back.
    - Warmth and food matter more than any one clever idea, but a plan only changes when someone is heard.
events:
  door_block_stubborn: A weary member of the party blocks the way. He says the plan was made long ago and strangers cannot change it now. {staff} is stubborn, does not give way, is pushed aside and loses {d.ors_stock:i} packs of supplies.
  door_block_stubborn_empty: A weary member of the party blocks the way. He says the plan was made long ago and strangers cannot change it now. {staff} is stubborn, does not give way, and is pushed aside.
  door_block_insist_empty: A weary member of the party blocks the way. He says the plan was made long ago and strangers cannot change it now. {staff} stands firm and finishes speaking, and is turned away.
  door_block_insist: A weary member of the party blocks the way. He says the plan was made long ago and strangers cannot change it now. {staff} stands firm and finishes speaking, is turned away, and loses {d.ors_stock:i} packs of supplies.
  door_block_appeal: A weary member of the party blocks the way. {staff} does not force the way, turns and goes to Robert Falcon Scott to ask for support.
  door_block_yield: A weary member of the party blocks the way. {staff} steps back without a quarrel, and half a day is wasted.
  time_strain: '{date}: {staff} hears the bell strike half a beat wrong. This branch drifts further from history and they are visibly more tired.'
star_points:
  convince: 'Convince Scott'
  trust: 'Win the trust of the party'
  reform: 'Have the plan for the way back changed ahead of history'
milestones:
  first_treat: '{date}: {staff} melts the first pot of water and hot food for a man who has stopped talking. He starts to speak.'
  first_protect: '{date}: {staff} hands out the first blankets and builds a wall of snow blocks, and teaches the others to do the same.'
  met_scott: '{date}: {staff} meets Scott in the tent. He listens closely but keeps asking one thing: what are the numbers.'
  scott_trusts: '{date}: Scott starts to treat {staff} as one of his own and brings out the diary of the days.'
  scott_convinced: '{date}: Scott no longer merely hopes the fuel will last. He has enough figures, and believes what the stranger told him.'
  board_moves: '{date}: The party starts to give way and says the plan might be changed.'
  reform_history: '{date}: The plan for the way back is changed. The main timeline does not change.'
  reform_early: '{date}: The plan for the way back is changed {advance_days:1} days earlier than in the main timeline. The main timeline does not change, only this branch.'
  trust_won: '{date}: The members of the party no longer keep {staff} out, and some ask for help.'
  exhausted: '{date}: {staff} is so tired their hands shake and is forced to rest.'
  outbreak_fades: '{date}: The number of ailing men falls to one or none.'
summary:
  near_death: '{staff} collapses at Ross Ice Shelf and is pulled back by the recall charm. Life saved, at a price.'
  stay_and_gifts: '{staff} finished the task but did not come back. They left a note saying they want to stay with these people a while longer. Gifts will arrive later.'
  gave_up: '{staff} gave up early and went back to the present. {staff} said this was not the place for them.'
  legend: '{staff} left a legend at Ross Ice Shelf. The plan was changed {advance_days:1} days earlier than in the main timeline.'
  perfect: '{staff} completed the task at Ross Ice Shelf and came back safe. {base_D:i} lost on the main timeline, {D:i} on this branch.'
  scramble: '{staff} was turned away again and again and finally fled back with a joke to tell.'
  modest: '{staff} spent seven days at Ross Ice Shelf, did what was within reach, and came back safe.'
quotes:
  near_death:
    - trait: kind
      text: At the end I was still wondering whether anyone was keeping watch at night.
    - text: I thought I could hold out a little longer.
  stay_and_gifts:
    - trait: kind
      text: I remember every one of their names. I want to stay a while.
    - text: They need people here.
  gave_up:
    - trait: homesick
      text: I want to go home. That is all.
    - text: I am not cut out for this.
  legend:
    - text: I only told them what they needed to hear.
  perfect:
    - trait: kind
      text: I could save today's people, not tomorrow's.
    - trait: curious
      text: So that is how it is, warmth and food are what keep a party going.
    - text: Did what had to be done.
  scramble:
    - trait: methodical
      text: They will understand sooner or later. Just later.
    - text: Next time I want to bring more.
  modest:
    - trait: glib
      text: I said all I had to say. Whether they listen is up to them.
    - text: With one more item I might have saved one more life.
hints:
  lost_ors: A lot of supplies were lost. Next time let the employee yield, or bring more.
  unused_protect: Blankets were left over. The limit was the trust of the party, not the supplies. Let the employee help people first to build trust.
  unused_ors: Supplies were left over. The employee may have spent time elsewhere, or was not let in.
  ally_gap: Robert Falcon Scott's evidence is still thin. The handbook helps, provided the employee spends time with him.
  none: Change one thing and send again with the same seed, that makes the comparison clearest.
