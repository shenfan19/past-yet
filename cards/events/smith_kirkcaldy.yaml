text:
  en:
    name: How a nation grows rich
    place: Kirkcaldy, Scotland
    figure: Adam Smith
    story: Adam Smith publishes The Wealth of Nations, arguing that division of labour and trade make people richer.
    relic: A pin from the pin factory
    relic_desc: The pin he used to show what dividing a job can do.
    points:
      p1: "Hear him on the division of labour in a pin factory"
      p2: "Debate the division of labour with him"
      p3: "Walk by the sea"
  zh:
    name: 一个国家怎样变富
    place: 苏格兰柯卡尔迪
    figure: 亚当·斯密
    story: 亚当·斯密出版《国富论》，论证分工和贸易会让人变得更富。
    relic: 一枚别针
    relic_desc: 他用来说明分工威力的那种别针。
    points:
      p1: "听他讲别针工厂的分工"
      p2: "同他辩论分工"
      p3: "海边散步"
