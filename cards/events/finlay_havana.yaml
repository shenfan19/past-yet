text:
  en:
    name: Mosquitoes and yellow fever
    place: Havana
    figure: Carlos Finlay
    story: Carlos Finlay proposes that yellow fever is carried by mosquitoes, years before it is confirmed.
    relic: A glass slide of mosquitoes
    relic_desc: A mounted slide with a mosquito wing.
    points:
      p1: "Watch the moment the mosquito bites"
      p2: "Tend the yellow fever patients"
      p3: "Keep a daily record of cases for a whole year"
  zh:
    name: 蚊子与黄热病
    place: 哈瓦那
    figure: 卡洛斯·芬莱
    story: 卡洛斯·芬莱提出黄热病是蚊子传播的，早了证实好几年。
    relic: 一片蚊子的玻片标本
    relic_desc: 一片标本，里面有一只蚊子的翅。
    points:
      p1: "看蚊子叮咬的时刻"
      p2: "照看黄热病人"
      p3: "逐日记录一整年的病例"
