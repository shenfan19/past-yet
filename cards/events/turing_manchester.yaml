    place: "Manchester"
    figure: "Alan Turing"
    story: "In 1952 Alan Turing is prosecuted for a relationship with another man, which was a crime in Britain at the time. He accepts hormone treatment instead of prison, loses his security clearance, and dies in 1954 at forty one."
    relic: "A strip of punched tape"
    relic_desc: "A strip of paper tape with a row of holes, a program from the early Manchester computer."
