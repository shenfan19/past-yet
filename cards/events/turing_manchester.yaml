    name: "1952 年的审判"
    place: "曼彻斯特"
    figure: "艾伦·图灵"
    story: "1952 年，艾伦·图灵因与另一名男子的关系被起诉，这在当时的英国是犯罪。他接受激素治疗以代替入狱，丧失了保密资格，1954 年去世，终年四十一岁。"
    relic: "一条穿孔纸带"
    relic_desc: "一条打着一排孔的纸带，是早期曼彻斯特计算机的一段程序。"
    points:
      p1: "跟着他读生物形态规律的新研究（聪明的头脑或计算机技能更合适）"
      p2: "陪他走过治疗（需要医护人员）"
      p3: "做一个明明白白站在他这边的朋友"
