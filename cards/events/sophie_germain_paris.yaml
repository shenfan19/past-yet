    place: "巴黎"
    figure: "索菲·热尔曼"
    story: "索菲·热尔曼靠读书自学数学，曾用男人的名字给高斯写信，后来在巴黎死于癌症。哥廷根本想授给她的荣誉学位没有送到她手上。"
    relic: "一封署名勒布朗的信"
    relic_desc: "一封用借来的名字写给高斯的信。"
    points:
      p1: "跟上她关于弹性的工作"
      p2: "盼着一次聆听能朝着她有利的方向走"
      p3: "陪她走过最后的病中日子"
