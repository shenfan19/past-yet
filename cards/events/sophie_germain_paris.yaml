    name: "A degree that came too late"
    place: "Paris"
    figure: "Sophie Germain"
    story: "Sophie Germain, who taught herself mathematics from books and once wrote to Gauss under a man's name, dies of cancer in Paris. The honorary degree Göttingen had in mind never reaches her."
    relic: "A letter signed Le Blanc"
    relic_desc: "A letter to Gauss in a borrowed name."
