    place: "Froland"
    figure: "Niels Henrik Abel"
    story: "Abel, who showed that the general equation of the fifth degree cannot be solved by radicals, dies of tuberculosis in Norway at twenty six. A letter offering him a post in Berlin arrives soon after."
    relic: "A sealed letter"
    relic_desc: "An unopened offer, tied with a thread."
