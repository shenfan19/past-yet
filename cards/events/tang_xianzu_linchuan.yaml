    place: "临川"
    figure: "汤显祖"
    story: "汤显祖离开官场之后写完了《牡丹亭》，一部爱情胜过死亡的戏，后来他看到戏班删改他的唱词。"
    relic: "一册刻印的曲本"
    relic_desc: "给歌者用的刻本，每支曲牌的名字写在上方。"
    points:
      p1: "听这出戏的唱段（需要音乐家或敏感的员工）"
      p2: "戏班要删改时，守住他的唱词（需要固执的员工或音乐家）"
