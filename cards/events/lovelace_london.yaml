  en:
    name: The first program
    place: London
    figure: Ada Lovelace
    story: Ada Lovelace publishes notes on the Analytical Engine with an algorithm and the idea that such machines could work with more than numbers.
    relic: A punched card
    relic_desc: A card of holes, meant to tell an engine what to do.
    points:
      p1: "Read the Bernoulli algorithm in Note G"
      p2: "Explain her idea to Babbage"
      p3: "Stay with her during her illness"
  zh:
    name: 第一段程序
    place: 伦敦
    figure: 阿达·洛芙莱斯
    story: 阿达·洛芙莱斯发表了对分析机的注释，里面有一段算法，还有一个想法：这样的机器不只能算数。
    relic: 一张穿孔卡
    relic_desc: 一张打了孔的卡片，用来告诉机器做什么。
    points:
      p1: "读懂笔记G里的伯努利数算法"
      p2: "向巴贝奇说明她的想法"
      p3: "在她病中陪着"
