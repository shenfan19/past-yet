text:
  en:
    name: What can be computed
    place: Cambridge
    figure: Alan Turing
    story: Turing describes an imaginary machine that reads and writes symbols on a tape, and defines what computing means.
    relic: A strip of paper tape
    relic_desc: A tape of marks, one symbol at a time.
  zh:
    name: 什么是可计算的
    place: 剑桥
    figure: 艾伦·图灵
    story: 图灵描述了一台想象中的机器，在纸带上读写符号，由此定义了什么叫计算。
    relic: 一条纸带
    relic_desc: 一条带着符号的纸带，一次一个符号。
