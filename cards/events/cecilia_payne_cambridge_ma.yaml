text:
  en:
    name: "The sun is mostly hydrogen"
    place: "Cambridge, Massachusetts"
    figure: "Cecilia Payne"
    story: "Cecilia Payne's thesis shows that stars are made mostly of hydrogen. She is persuaded to call her own result probably not real, and it is confirmed some years later."
    relic: "A page of spectra"
    relic_desc: "A page of lines from the spectrum of the sun."
    points:
      p1: "Follow the reading of the spectra"
      p2: "Argue her side in the corridor"
      p3: "Stay with her conclusion as she wrote it"
  zh:
    name: "太阳主要是氢"
    place: "马萨诸塞州剑桥"
    figure: "塞西莉亚·佩恩"
    story: "塞西莉亚·佩恩的论文表明恒星主要由氢组成。她被劝说把自己的结论说成多半不是真的，几年后它得到了证实。"
    relic: "一页光谱记录"
    relic_desc: "一页太阳光谱线的记录。"
    points:
      p1: "跟上对光谱的解读"
      p2: "在走廊里替她争辩"
      p3: "陪她守住她写下的结论"
