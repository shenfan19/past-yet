text:
  en:
    name: "Two days on the Moika"
    place: "St Petersburg"
    figure: "Alexander Pushkin"
    story: "Pushkin is wounded in a duel and spends two days dying in his apartment on the Moika, aged thirty seven, while crowds in the street ask after him."
    relic: "A book of his verse"
    relic_desc: "A small book with a pressed leaf at one poem."
    points:
      p1: "Be a friend he can speak plainly to"
      p2: "Hold out through the long night at his door"
      p3: "Tend him as well as anyone can (a doctor, a nurse or a kind one helps)"
  zh:
    name: "莫伊卡河畔的两天"
    place: "圣彼得堡"
    figure: "亚历山大·普希金"
    story: "普希金在决斗中受伤，在莫伊卡河畔的寓所里度过了生命的最后两天，死时三十七岁，街上聚着许多人打听他的情况。"
    relic: "一本诗集"
    relic_desc: "一本小书，某首诗里夹着一片压干的叶子。"
    points:
      p1: "做一位他可以直说心里话的朋友"
      p2: "在他门外熬过漫长的夜"
      p3: "尽量好好照料他（医生、护士或善良的人更合适）"
