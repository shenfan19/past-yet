text:
  en:
    name: A writing system made by one man
    place: Cherokee country, southeastern United States
    figure: Sequoyah
    story: Sequoyah, who could not read English, invents a syllabary for Cherokee, and within a few years many Cherokee can read and write.
    relic: A syllabary chart
    relic_desc: A sheet with eighty-odd characters laid out in rows.
    points:
      p1: "Watch him make the symbols one by one (needs a ar glasses)"
      p2: "Prove to the people that the script is useful"
      p3: "Be treated as no outsider"
  zh:
    name: 一个人造出来的文字
    place: 美国东南部切罗基地区
    figure: 塞阔雅
    story: 不识英文的塞阔雅为切罗基语发明了一套音节文字，几年内就有许多切罗基人学会了读写。
    relic: 一张音节表
    relic_desc: 一张纸，八十多个字符排成行。
    points:
      p1: "看他一个个造符号（需要增强现实眼镜）"
      p2: "向族人证明字母有用"
      p3: "不被当作外人"
