text:
  en:
    name: Zero as a number
    place: Bhillamala, India
    figure: Brahmagupta
    story: Brahmagupta gives rules for working with zero and negative numbers, as numbers like any others.
    relic: A palm-leaf with a small circle
    relic_desc: A leaf with a small round mark for nothing.
  zh:
    name: 零也是一个数
    place: 印度比拉马拉
    figure: 婆罗摩笈多
    story: 婆罗摩笈多给出了用零和负数做运算的规则，把它们当作和别的数一样的数。
    relic: 一片画着小圆圈的棕榈叶
    relic_desc: 一片叶子，上面有个代表“没有”的小圆圈。
