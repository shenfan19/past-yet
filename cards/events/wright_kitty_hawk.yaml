    name: Twelve seconds in the air
    place: Kitty Hawk, North Carolina
    figure: Orville and Wilbur Wright
    story: On a windy beach the Wright brothers fly a powered machine for twelve seconds, and then three more times that day.
    relic: A propeller blade
    relic_desc: A wooden blade shaped like a twisted wing.
    points:
      p1: "See the accounts of lift"
      p2: "Calibrate the wing"
      p3: "Push the plane on the dune"
  zh:
    name: 在空中的十二秒
    place: 北卡罗来纳基蒂霍克
    figure: 奥维尔和威尔伯·莱特
    story: 在一片大风的海滩上，莱特兄弟驾着动力飞机飞了十二秒，当天又飞了三次。
    relic: 一片螺旋桨叶
    relic_desc: 一片木头叶子，像一只扭过的翅膀。
    points:
      p1: "看出升力的账"
      p2: "校准机翼"
      p3: "在沙丘上推飞机"
