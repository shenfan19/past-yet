text:
  en:
    name: What reason can and cannot know
    place: Königsberg
    figure: Immanuel Kant
    story: After eleven years of silence Kant publishes the Critique of Pure Reason, a book that sells slowly and is first reviewed by people who misread it.
    relic: A walking cane
    relic_desc: The cane of a man whose daily walk was so regular neighbours set clocks by it.
    points:
      p1: "Share his long dinner table (a kind soul, a teacher, a librarian or a historian)"
      p2: "Notice the question beneath the question"
      p3: "Write the first review that understands it (needs a cyborg neural chip, or a very fine pen)"
  zh:
    name: 理性能知道什么，不能知道什么
    place: 柯尼斯堡
    figure: 伊曼努尔·康德
    story: 沉默了十一年之后，康德发表了《纯粹理性批判》。这本书卖得很慢，最早的书评也出自误读它的人。
    relic: 一根手杖
    relic_desc: 一个人的手杖，他每天散步准时到邻居拿他对表。
    points:
      p1: "陪他吃漫长的午饭（善良的人，或教师、图书管理员、历史学者）"
      p2: "留意问题底下的那个问题"
      p3: "写出第一篇真正读懂它的书评（需要义体智能芯片，或一支极细腻的笔）"
