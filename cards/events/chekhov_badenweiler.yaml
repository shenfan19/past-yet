text:
  en:
    name: "A doctor in the Black Forest"
    place: "Badenweiler"
    figure: "Anton Chekhov"
    story: "Chekhov, himself a doctor dying of tuberculosis, goes to the Black Forest spa of Badenweiler with his wife Olga Knipper, and dies there in July at forty four."
    relic: "A pince nez"
    relic_desc: "Small round spectacles on a cord."
    points:
      p1: "Talk with him as an equal"
      p2: "Notice what the doctor in him already knows (a physician, a nurse or a curious mind helps)"
      p3: "Ease his breathing in the last night"
  zh:
    name: "黑森林里的医生"
    place: "巴登魏勒"
    figure: "安东·契诃夫"
    story: "契诃夫自己是医生，却患着肺结核，他和妻子奥尔加·克尼佩尔来到黑森林的温泉疗养地巴登魏勒，七月在那里去世，年四十四岁。"
    relic: "一副夹鼻眼镜"
    relic_desc: "一副系着细绳的小圆眼镜。"
    points:
      p1: "像平等的人一样和他交谈"
      p2: "留意他身上医生已经知道的事（医生、护士或好奇的人更合适）"
      p3: "让他在最后一夜呼吸轻松些"
