text:
  en:
    name: "Four kites and a seat"
    place: "Stanwell Park, Australia"
    figure: "Lawrence Hargrave"
    story: "On the cliffs at Stanwell Park, Lawrence Hargrave links four of his box kites into one train and lets the sea wind lift him a few metres off the ground. He never patents his designs and publishes them freely for anyone to use."
    relic: "A box kite frame"
    relic_desc: "A light lattice of thin wood, cloth torn from one end."
    points:
      p1: "Watch how the box shape holds the wind"
      p2: "Help him tie the lines and spars"
      p3: "Wait on the cliff for the wind to rise"
  zh:
    name: "四只风筝和一把座椅"
    place: "澳大利亚斯坦韦尔公园"
    figure: "劳伦斯·哈格雷夫"
    story: "在斯坦韦尔公园的海崖上，劳伦斯·哈格雷夫把四只箱式风筝连成一串，让海风把他托离地面几米。他从不为自己的设计申请专利，而是把它们公开发表，谁都可以用。"
    relic: "一副箱式风筝骨架"
    relic_desc: "一副轻巧的细木格架，一端的布已经撕破。"
    points:
      p1: "看箱形怎样兜住风"
      p2: "帮他绑好绳子和杆"
      p3: "在海崖上等风起来"
