text:
  en:
    name: "A poet on a boat"
    place: "Xiang River"
    figure: "Du Fu"
    story: "Poor, ill and moving from town to town along the Xiang River, Du Fu lives on a boat and keeps writing. His poems were little known in his own lifetime, and he died on the river in 770."
    relic: "A boatman's oil lamp"
    relic_desc: "A small clay lamp that burned late over a few lines of verse."
    points:
      p1: "Share a meal with him"
      p2: "Listen to the poem he is still revising (a curious employee, a teacher or a journalist)"
      p3: "Ease his last winter on the boat (needs an elixir)"
  zh:
    name: "船上的诗人"
    place: "湘江"
    figure: "杜甫"
    story: "贫病交加的杜甫沿着湘江辗转，一个镇接一个镇，住在船上，仍然不停地写。他的诗在生前少有人知，770年他在江上去世。"
    relic: "一盏船灯"
    relic_desc: "一盏小小的陶油灯，为了几行诗亮到很晚。"
    points:
      p1: "和他一起吃顿饭"
      p2: "听他还在改的那首诗（需要好奇的员工、教师或记者）"
      p3: "让他在船上的最后一个冬天好过些（需要灵药）"
