text:
  en:
    name: An alphabet anyone can learn
    place: Seoul
    figure: King Sejong and the scholars
    story: King Sejong and his scholars design Hangul, an alphabet whose letters copy the shape of the mouth.
    relic: A woodblock of letters
    relic_desc: A block carved with the first letters, ready to ink.
  zh:
    name: 人人都学得会的字母
    place: 首尔
    figure: 世宗大王与学者们
    story: 世宗大王和学者们设计了谚文，字母的形状模仿口型。
    relic: 一块刻着字母的木板
    relic_desc: 刻着最早几个字母的木板，等着上墨。
