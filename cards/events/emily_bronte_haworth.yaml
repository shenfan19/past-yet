    place: "Haworth"
    figure: "Emily Brontë"
    story: "Emily Brontë, whose only novel Wuthering Heights puzzled reviewers, falls ill at the parsonage in Haworth and dies in December aged thirty."
    relic: "A dog collar"
    relic_desc: "A worn leather collar from the parsonage mastiff."
