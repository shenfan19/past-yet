text:
  en:
    name: Medicine as careful observation
    place: Kos
    figure: Hippocrates
    story: On Kos a physician and his school teach that disease has natural causes and must be watched at the bedside.
    relic: A bronze probe
    relic_desc: A thin tool of a doctor who preferred looking to guessing.
  zh:
    name: 把医学当作细致的观察
    place: 科斯岛
    figure: 希波克拉底
    story: 在科斯岛，一位医生和他的学派教人：疾病有自然的原因，要守在床边仔细看。
    relic: 一根青铜探针
    relic_desc: 一件细细的器具，属于宁愿多看也不乱猜的医生。
