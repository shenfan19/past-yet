  en:
    name: "Left and right in the cold"
    place: "Washington"
    figure: "Chien Shiung Wu"
    story: "Chien Shiung Wu runs her cold cobalt experiment at the National Bureau of Standards and shows that nature tells left from right. The Nobel prize that follows goes to the two theorists who proposed it."
    relic: "A cobalt sample"
    relic_desc: "A tiny sealed sample on a stand."
    points:
      p1: "Read the counts as they come in (a chemist or sharp wit helps)"
      p2: "Stay through the long cold runs"
      p3: "Mount the crystal with steady hands (needs a golden apple)"
  zh:
    name: "低温里的左与右"
    place: "华盛顿"
    figure: "吴健雄"
    story: "吴健雄在美国国家标准局做低温钴实验，证明了自然分得出左和右。随后的诺贝尔奖给了提出这个设想的两位理论家。"
    relic: "一个钴样品"
    relic_desc: "支架上一个很小的密封样品。"
    points:
      p1: "读懂不断进来的计数（化学家或敏锐的头脑更合适）"
      p2: "熬过漫长的低温实验"
      p3: "用稳的手把晶体装好（需要金苹果）"
