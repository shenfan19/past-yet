text:
  en:
    name: "A line on the glass"
    place: "San Francisco"
    figure: "Philo Farnsworth"
    story: "Philo Farnsworth transmits the first electronic television picture, a plain straight line, in a San Francisco laboratory. Years of business fights wear him down and his name fades from the story of television."
    relic: "A glass slide"
    relic_desc: "A small glass slide with a painted line."
    points:
      p1: "Follow the circuit (an engineer, an electrician or sharp wit helps)"
      p2: "Hope the next backer takes his call"
      p3: "Hold the slide steady in front of the camera (needs a golden apple)"
  zh:
    name: "玻璃上的一条线"
    place: "旧金山"
    figure: "菲洛·法恩斯沃思"
    story: "菲洛·法恩斯沃思在旧金山的实验室里传出第一幅电子电视图像，只是一条直线。之后多年的商业纠纷把他拖垮，他的名字也从电视的故事里淡去。"
    relic: "一片玻璃幻灯片"
    relic_desc: "一片小玻璃片，上面画着一条线。"
    points:
      p1: "理解那套电路（工程师、电工或敏锐的头脑更合适）"
      p2: "盼着下一位出资人接他的电话"
      p3: "把玻璃片稳稳举在摄像管前（需要金苹果）"
