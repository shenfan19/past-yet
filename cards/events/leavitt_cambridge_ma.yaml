text:
  en:
    name: "A rule for the stars"
    place: "Cambridge, Massachusetts"
    figure: "Henrietta Leavitt"
    story: "Henrietta Leavitt, a human computer at Harvard Observatory, finds that brighter Cepheid stars pulse more slowly, a rule that lets astronomers measure the universe. She is paid a small wage and dies in 1921."
    relic: "A glass plate"
    relic_desc: "A photographic plate crowded with tiny stars."
    points:
      p1: "Follow her tables of stars"
      p2: "Keep up the long hours at the plates"
      p3: "Be the colleague who asks what she has found"
  zh:
    name: "星星的一条规则"
    place: "马萨诸塞州剑桥"
    figure: "亨丽埃塔·勒维特"
    story: "亨丽埃塔·勒维特是哈佛天文台的人工计算员，她发现越亮的造父变星脉动越慢，天文学家因此可以量出宇宙的尺度。她拿着微薄的薪水，1921年去世。"
    relic: "一块玻璃底片"
    relic_desc: "一块布满细小星点的照相底片。"
    points:
      p1: "跟上她的恒星数表"
      p2: "陪她熬过在底片前的长时间工作"
      p3: "做那个问她发现了什么的同事"
