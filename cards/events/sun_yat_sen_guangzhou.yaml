text:
  en:
    name: "A university for the country"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "In 1924 Sun Yat-sen has the higher schools of Guangzhou joined into one National Guangdong University, and asks it to train people for the country. He dies the next year, and in 1926 the university is renamed National Sun Yat-sen University in his memory."
    relic: "A brass school badge"
    relic_desc: "A small badge from the first years of the university."
    points:
      p1: "Follow how the schools are to be joined"
      p2: "Earn the trust of the teachers and students"
      p3: "Stay through the long days of the opening"
  zh:
    name: "为国家办的一所大学"
    place: "广州"
    figure: "孙中山"
    story: "1924 年，孙中山把广州的几所高等学校合并成一所国立广东大学，希望它为国家培养人才。他第二年去世，1926 年这所大学为纪念他改名为国立中山大学。"
    relic: "一枚铜质校徽"
    relic_desc: "这所大学最初几年的一枚小徽章。"
    points:
      p1: "看懂这些学校是怎样并起来的"
      p2: "赢得师生的信任"
      p3: "撑过开办时漫长的日子"
