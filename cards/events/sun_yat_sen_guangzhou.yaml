text:
  en:
    name: "From the statue to a new university"
    place: "Guangzhou"
    figure: "Sun Yat-sen"
    story: "Standing before the statue of Sun Yat-sen at Sun Yat-sen University, you are carried back to Guangzhou in 1924. On 4 February he orders three schools joined into National Guangdong University and sends Zou Lu to prepare it. Classes begin on 19 September, and on 11 November the founding ceremony is held with the motto he wrote for it: study widely, enquire carefully, think prudently, discern clearly, practise earnestly. He leaves Guangzhou two days later, falls ill, and dies in Beijing on 12 March 1925. In 1926 the university takes his name."
    relic: "A brass school badge"
    relic_desc: "A small badge from the first years of the university."
    points:
      p1: "See why the scattered sites of the schools should become one campus"
      p2: "Help the heads of the schools to sit down and agree"
      p3: "Keep the work going through the months until classes begin"
      p4: "Earn the trust of the teachers and students on the first day"
      p5: "Sit with him in his last illness"
  zh:
    name: "从铜像到一所新大学"
    place: "广州"
    figure: "孙中山"
    story: "你站在中山大学的孙中山像前，被带回 1924 年的广州。2 月 4 日他下令把三所学校合并成国立广东大学，派邹鲁筹备。9 月 19 日开学，11 月 11 日举行成立典礼，会上用的是他为这所大学写的校训：博学、审问、慎思、明辨、笃行。两天后他离开广州，不久病倒，1925 年 3 月 12 日在北京去世。1926 年这所大学以他的名字命名。"
    relic: "一枚铜质校徽"
    relic_desc: "这所大学最初几年的一枚小徽章。"
    points:
      p1: "看出几所学校分散的校址为什么该并到一处"
      p2: "帮几所学校的负责人坐下来谈妥"
      p3: "在开学前的几个月里把事情一直推着走"
      p4: "在开学第一天赢得师生的信任"
      p5: "在他最后的病中陪着他"
