  en:
    name: The narrow road to the deep north
    place: Hiraizumi, Japan
    figure: Matsuo Basho
    story: Basho walks north through Japan for months and writes the travel diary, with haiku, of the Narrow Road to the Deep North.
    relic: A straw hat
    relic_desc: A woven hat grey with rain.
  zh:
    name: 奥州小路
    place: 日本平泉
    figure: 松尾芭蕉
    story: 芭蕉一路向北走了几个月，写下了夹着俳句的《奥之细道》。
    relic: 一顶草笠
    relic_desc: 被雨淋灰了的编织草帽。
