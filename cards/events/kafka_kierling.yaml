    story: "卡夫卡因肺结核在一家小疗养院里弥留，仍在校对最后几篇小说的清样。他曾请朋友把其余的作品烧掉。"
    relic: "一页校样"
    relic_desc: "一页印刷校样，上面有铅笔改的小字。"
    points:
      p1: "陪他一起读校样（译者、图书管理员或好奇的人更合适）"
