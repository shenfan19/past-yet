text:
  en:
    name: "Portraits no one bought"
    place: "Paris"
    figure: "Amedeo Modigliani"
    story: "Modigliani, poor and ill, dies of tubercular meningitis in a Paris hospital at thirty five. Few had bought his long faced portraits."
    relic: "A charcoal stick"
    relic_desc: "A stub of charcoal black to the fingers."
    points:
      p1: "See what is in the long faces (a painter or curious eye helps)"
      p2: "Speak well of him to a dealer"
      p3: "Keep him company on the ward"
  zh:
    name: "没人买的肖像"
    place: "巴黎"
    figure: "阿梅迪奥·莫迪利亚尼"
    story: "莫迪利亚尼贫病交加，三十五岁时在巴黎一家医院死于结核性脑膜炎。很少有人买他那些长脸的肖像。"
    relic: "一截炭条"
    relic_desc: "一截能把手指染黑的炭条。"
    points:
      p1: "看出那些长脸里有什么（画家或好奇的眼睛更合适）"
      p2: "在画商面前替他说好话"
      p3: "在病房里陪着他"
