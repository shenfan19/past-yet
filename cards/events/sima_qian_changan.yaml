text:
  en:
    name: "A history written after the sentence"
    place: "Chang'an"
    figure: "Sima Qian"
    story: "Sima Qian is punished by the court for speaking up for a general, and chooses to go on living in order to finish his history of China, the Records of the Grand Historian."
    relic: "A bundle of bamboo slips"
    relic_desc: "Slips tied with cord, each carrying a column of characters."
    points:
      p1: "Sit with him in the days after the sentence"
      p2: "Read the old records with him (a record keeper, a journalist or a sharp mind)"
      p3: "Stay until the last chapter is written"
  zh:
    name: "受刑之后写成的史书"
    place: "长安"
    figure: "司马迁"
    story: "司马迁因为替一位将军说话而受到朝廷惩罚，他选择活下去，为的是写完那部中国的历史，也就是《史记》。"
    relic: "一捆竹简"
    relic_desc: "用绳子编起来的竹简，每一片写着一行字。"
    points:
      p1: "在判决之后的日子里陪他坐坐"
      p2: "和他一起读旧档案（需要档案员、记者或头脑敏锐的员工）"
      p3: "留到最后一章写完"
