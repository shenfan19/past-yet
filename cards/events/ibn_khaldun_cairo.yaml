    name: "比史书更大的序言"
    place: "开罗"
    figure: "伊本·赫勒敦"
    story: "伊本·赫勒敦为一部史书写的序言，成了一部研究社会与经济如何兴衰的著作。1384年他的妻女在海难中去世，此后他在开罗继续教书，直到1406年去世。"
    relic: "一册装订好的讲稿"
    relic_desc: "一册厚厚的笔记，是为学院讲课写的。"
    points:
      p1: "陪一位失去家人的人坐坐"
      p2: "跟上他对城市为何兴起又衰落的想法"
      p3: "把他的想法传给以后的读者（需要档案员、教师或学生）"
