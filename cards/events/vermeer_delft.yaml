text:
  en:
    name: "The painter in debt"
    place: "Delft"
    figure: "Johannes Vermeer"
    story: "Vermeer, who painted very slowly and sold few pictures, dies in Delft leaving his wife and many children in debt."
    relic: "A pearl earring"
    relic_desc: "A small pearl of the kind he painted so often."
    points:
      p1: "Look at the light the way he does (a painter or curious eye helps)"
      p2: "Be a patient visitor to the house"
      p3: "Keep his paintings from being scattered (a dealer, an accountant or a stubborn one helps)"
  zh:
    name: "负债的画家"
    place: "代尔夫特"
    figure: "约翰内斯·维米尔"
    story: "维米尔画得很慢，卖出的画很少，他在代尔夫特去世，留下妻子和许多孩子，也留下债务。"
    relic: "一枚珍珠耳环"
    relic_desc: "一颗小珍珠，是他常画的那种。"
    points:
      p1: "像他一样看光（画家或好奇的眼睛更合适）"
      p2: "做一位耐心上门的客人"
      p3: "不让他的画散得到处都是（古董商、会计或固执的人更合适）"
