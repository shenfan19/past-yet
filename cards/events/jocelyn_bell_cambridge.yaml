text:
  en:
    name: "A scruff on the chart"
    place: "Cambridge"
    figure: "Jocelyn Bell"
    story: "Jocelyn Bell, a student reading miles of chart paper, notices a small regular scruff that others might have taken for interference. The Nobel prize for pulsars later goes to her supervisor."
    relic: "A strip of chart paper"
    relic_desc: "A strip with a faint regular mark in the ink."
    points:
      p1: "Spot the odd mark on the paper"
      p2: "Insist that it is not interference"
      p3: "Be the one who says it was hers to find"
  zh:
    name: "纸带上的一道痕"
    place: "剑桥"
    figure: "乔瑟琳·贝尔"
    story: "乔瑟琳·贝尔是个学生，读着长长的记录纸，注意到一道别人可能当作干扰的小小规律痕迹。后来脉冲星的诺贝尔奖给了她的导师。"
    relic: "一条记录纸带"
    relic_desc: "一条纸带，墨迹里有一道微弱而规律的痕。"
    points:
      p1: "发现纸上那道不寻常的痕"
      p2: "坚持说这不是干扰"
      p3: "做那个说这是她发现的人"
