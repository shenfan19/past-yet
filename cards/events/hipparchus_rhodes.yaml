text:
  en:
    name: "A star list that was lost"
    place: "Rhodes"
    figure: "Hipparchus"
    story: "Working at Rhodes, Hipparchus compiles a catalogue of about eight hundred and fifty stars and finds the slow shift of the equinoxes. His own writings are lost and we know them through Ptolemy."
    relic: "A bronze armillary ring"
    relic_desc: "A graduated ring used to measure the position of a star."
    points:
      p1: "Count the stars with him"
      p2: "Keep the night watch at the sighting tube"
      p3: "Copy his star list by hand (a record keeper or a student)"
  zh:
    name: "丢失的星表"
    place: "罗得岛"
    figure: "喜帕恰斯"
    story: "喜帕恰斯在罗得岛编出一份约八百五十颗星的星表，并发现了二分点的缓慢移动。他自己的著作已经失传，是靠托勒密的转述才知道的。"
    relic: "一只青铜浑仪环"
    relic_desc: "一只带刻度的环，用来量星的位置。"
    points:
      p1: "陪他数星星"
      p2: "在观测筒旁值夜"
      p3: "亲手抄下他的星表（需要档案员或学生）"
