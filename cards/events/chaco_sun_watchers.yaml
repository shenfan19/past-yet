text:
  en:
    name: "Light on a spiral at the solstice"
    place: "Chaco Canyon, New Mexico"
    figure: "The people of Chaco Canyon"
    story: "In the high desert of Chaco Canyon, people of the canyon place stone and mark rock so that, at the summer solstice, a blade of morning light falls across a spiral carved on a cliff. The canyon remains a living landscape of the Pueblo and other peoples who descend from them, and this story keeps to what is publicly recorded."
    relic: "A painted potsherd"
    relic_desc: "A palm sized piece of pottery with a thin black line pattern."
    points:
      p1: "Spot the gap in the rock where the light will come"
      p2: "Wait out the last dark minutes before sunrise"
      p3: "Get through the cold of the early morning"
  zh:
    name: "夏至日落在螺旋上的光"
    place: "新墨西哥州查科峡谷"
    figure: "查科峡谷的人们"
    story: "在查科峡谷的高原荒漠里，峡谷里的人们垒石、在岩壁上做记号，使夏至那天早晨一道窄窄的光落在崖壁的一个螺旋刻纹上。这片峡谷至今是普韦布洛人和他们的后裔等族群生活着的圣地，这个故事只写公开记录过的内容。"
    relic: "一片绘纹陶片"
    relic_desc: "巴掌大的一片陶片，上面是细细的黑线花纹。"
    points:
      p1: "找到光会穿过的那道岩缝"
      p2: "等过日出前最后几分钟的黑暗"
      p3: "熬过清晨的寒冷"
