    place: 意大利南部克罗顿
    figure: 毕达哥拉斯
    story: 在克罗顿，一个团体把数学、音乐和生活当作同一门功课来学，比例成了和谐的钥匙。
    relic: 单弦琴的弦
    relic_desc: 一根绷紧的弦，按在简单的比例上能发出和谐的音。
    points:
      p1: "听出弦长的比例"
      p2: "被学派接纳旁听"
      p3: "沉默听满前几年（需要情绪稳定贴片）"
