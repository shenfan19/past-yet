text:
  en:
    name: "Poems in a chest"
    place: "Amherst"
    figure: "Emily Dickinson"
    story: "Emily Dickinson dies in her family's house in Amherst. Her sister then finds hundreds of poems in a chest, and almost none had been printed."
    relic: "A sewn booklet"
    relic_desc: "A few pages sewn by hand with a poem on each."
    points:
      p1: "Be a visitor she does not mind"
      p2: "Spot the right drawer by chance"
      p3: "Be the one who keeps the poems together (a librarian, an archivist or a curious mind helps)"
  zh:
    name: "箱子里的诗"
    place: "阿默斯特"
    figure: "艾米莉·狄金森"
    story: "艾米莉·狄金森在阿默斯特的家中去世。她的妹妹随后在一只箱子里找到数百首诗，生前几乎没有印出来过。"
    relic: "一册手缝的小本"
    relic_desc: "几页手工缝起来的纸，每页一首诗。"
    points:
      p1: "做一位她不介意的访客"
      p2: "凭运气找对那只抽屉"
      p3: "把这些诗好好收在一起（图书管理员、档案员或好奇的人更合适）"
