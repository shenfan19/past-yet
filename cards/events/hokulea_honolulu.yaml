text:
  en:
    name: Sailing to Tahiti by the stars
    place: Honolulu
    figure: Mau Piailug and Nainoa Thompson
    story: The canoe Hōkūleʻa sails from Hawaiʻi to Tahiti with no instruments, guided by star paths and swells, and revives a navigating tradition.
    relic: A knotted sennit cord
    relic_desc: A cord of coconut fibre with a knot for each day.
    points:
      p1: "Take your turn at the paddle"
      p2: "Hold steady on the long crossing"
      p3: "Keep going at night (needs a cyborg bionic lung)"
  zh:
    name: 靠星星驶向塔希提
    place: 檀香山
    figure: 毛·皮艾卢格与纳伊诺阿·汤普森
    story: 独木舟“星光号”不带任何仪器，从夏威夷驶到塔希提，靠星路和海浪指路，让一种航海传统重新活了起来。
    relic: 一根打了结的椰壳纤维绳
    relic_desc: 一根椰壳纤维编的绳，每天打一个结。
    points:
      p1: "轮班划桨"
      p2: "在漫长航行里稳住"
      p3: "夜里也能撑下去（需要义体仿生肺）"
