    name: "Bones in the cliff"
    place: "Lyme Regis"
    figure: "Mary Anning"
    story: "Mary Anning, who dug the first great sea reptile skeletons out of the Lyme cliffs, dies of cancer at forty seven. The papers on her finds were mostly written by others."
    relic: "An ammonite"
    relic_desc: "A coiled fossil shell split from the blue lias."
    points:
      p1: "Spot the bone in the rock (a geologist or a curious eye helps)"
      p2: "Search the shore after the storm"
      p3: "Be a visitor who asks her what she thinks"
  zh:
    name: "崖壁里的骨头"
    place: "莱姆里吉斯"
    figure: "玛丽·安宁"
    story: "玛丽·安宁从莱姆的崖壁里挖出最早的巨型海生爬行动物骨架，四十七岁死于癌症。写她那些发现的论文多半出自别人之手。"
    relic: "一枚菊石"
    relic_desc: "一枚从蓝色里亚斯岩里敲出来的螺旋形化石。"
    points:
      p1: "在岩石里认出那块骨头（地质学家或好奇的眼睛更合适）"
      p2: "风暴后到海滩上搜寻"
      p3: "做一位向她请教看法的访客"
