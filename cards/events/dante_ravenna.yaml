    place: Ravenna
    figure: Dante Alighieri
    story: In exile Dante finishes the Divine Comedy, written in the Italian people actually spoke.
    relic: A laurel leaf
    relic_desc: A dried leaf of the poet's crown.
    points:
      p1: "Hear him read the Inferno"
      p2: "Do not ask about his past"
      p3: "Walk with him along the marsh road (needs a water station)"
  zh:
    name: 用街头的语言写一部长诗
    place: 拉文纳
    figure: 但丁
    story: 流亡中的但丁写完了《神曲》，用的是人们真正说的意大利语。
    relic: 一片月桂叶
    relic_desc: 诗人桂冠上的一片干叶。
    points:
      p1: "听他念地狱篇"
      p2: "不问他的过去"
      p3: "陪他走过沼泽边的路（需要净水站）"
