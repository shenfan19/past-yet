text:
  en:
    name: "A summer in Auvers"
    place: "Auvers sur Oise"
    figure: "Vincent van Gogh"
    story: "Van Gogh paints wheat fields and village streets almost every day in Auvers, and in July he dies with his brother Theo beside him. He sold almost none of his work."
    relic: "A tube of chrome yellow"
    relic_desc: "A squeezed tin tube of the colour he used for the fields."
    points:
      p1: "See what the fields are saying (a painter or a curious mind helps)"
      p2: "Walk the fields in the heat"
      p3: "Stay by his bed through the last night"
  zh:
    name: "奥维尔的夏天"
    place: "奥维尔"
    figure: "文森特·梵高"
    story: "梵高在奥维尔几乎每天都在画麦田和村路，七月他在弟弟提奥身旁离世。他生前几乎没有卖出过作品。"
    relic: "一管铬黄颜料"
    relic_desc: "一支挤瘪的锡管，里面是他画麦田用的那种黄。"
    points:
      p1: "看懂田野在说什么（画家或好奇的人更容易）"
      p2: "在酷热里走过麦田"
      p3: "整夜守在他的床边"
