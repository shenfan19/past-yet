text:
  en:
    name: Lightning is electricity
    place: Philadelphia
    figure: Benjamin Franklin
    story: Franklin flies a kite in a storm and shows that lightning is electrical, and soon puts rods on roofs.
    relic: A silk ribbon and key
    relic_desc: A key tied to a kite string with a dry silk ribbon.
  zh:
    name: 闪电就是电
    place: 费城
    figure: 本杰明·富兰克林
    story: 富兰克林在暴风雨里放风筝，证明闪电是电，不久屋顶就装上了避雷针。
    relic: 一条丝带和一把钥匙
    relic_desc: 一把钥匙系在风筝线上，线头接着一条干丝带。
