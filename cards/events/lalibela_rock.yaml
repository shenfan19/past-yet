text:
  en:
    name: Churches carved down into the rock
    place: Lalibela, Ethiopia
    figure: Lalibela and the stonecutters
    story: Stonecutters carve a set of churches downwards out of the living rock, with no stone laid on stone.
    relic: A stonecutter's chisel
    relic_desc: An iron chisel, the edge ground thin.
  zh:
    name: 向下凿进岩石的教堂
    place: 埃塞俄比亚拉利贝拉
    figure: 拉利贝拉与石匠们
    story: 石匠们从整块岩石里向下凿出一组教堂，没有一块石头是垒上去的。
    relic: 石匠的凿子
    relic_desc: 一把铁凿子，刃口磨得很薄。
