text:
  en:
    name: "A statue that walks to the sea"
    place: "Rapa Nui, Rano Raraku"
    figure: "The Rapa Nui carvers"
    story: "At the Rano Raraku quarry on Rapa Nui, carvers cut statues called moai from the volcanic rock and move them across the island to stand on stone platforms facing inland. Today the quarry and its park are cared for by the Rapa Nui people themselves."
    relic: "A stone adze"
    relic_desc: "A hand sized blade of dark basalt, ground to a clean edge."
    points:
      p1: "Cut the outline of a statue from the rock face"
      p2: "Haul the statue down the slope"
      p3: "Make out the order the statues were cut in"
  zh:
    name: "走向海边的石像"
    place: "拉帕努伊岛，拉诺拉拉库"
    figure: "拉帕努伊的石像匠人"
    story: "在拉帕努伊岛的拉诺拉拉库采石场，匠人们从火山岩上凿出叫摩艾的石像，再把它们运过全岛，立在面朝内陆的石台上。今天这片采石场和它所在的公园由拉帕努伊人自己照管。"
    relic: "一把石斧"
    relic_desc: "一片手掌大的深色玄武岩刃，磨出了干净的刃口。"
    points:
      p1: "在岩壁上凿出石像的轮廓"
      p2: "把石像沿山坡拉下来"
      p3: "看懂石像是按什么次序凿的"
