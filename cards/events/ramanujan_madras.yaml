text:
  en:
    name: A letter to Hardy
    place: Madras
    figure: Srinivasa Ramanujan
    story: A clerk in Madras sends pages of results to G. H. Hardy in England, who sees at once that they are the work of a genius.
    relic: A slate
    relic_desc: A school slate, wiped and written on many times.
    points:
      p1: "Understand his formulas"
      p2: "Write the letter until it is read"
      p3: "Be his friend"
  zh:
    name: 一封寄给哈代的信
    place: 马德拉斯
    figure: 斯里尼瓦瑟·拉马努金
    story: 马德拉斯的一位职员把几页结果寄给英国的哈代，哈代一眼就看出那是天才之作。
    relic: 一块石板
    relic_desc: 一块学生用的石板，写了擦、擦了写好多次。
    points:
      p1: "看懂他的公式"
      p2: "替他把信写到被读到"
      p3: "做他的朋友"
