  en:
    name: A journey of thirty years
    place: Tangier, Morocco
    figure: Ibn Battuta
    story: Ibn Battuta leaves Tangier for a pilgrimage and keeps going for about three decades, across much of the known world.
    relic: A travel-worn sandal
    relic_desc: A leather sandal resoled many times.
  zh:
    name: 三十年的旅程
    place: 摩洛哥丹吉尔
    figure: 伊本·白图泰
    story: 伊本·白图泰离开丹吉尔去朝圣，一路走了大约三十年，几乎走遍当时已知的世界。
    relic: 一只走旧的凉鞋
    relic_desc: 一只补过很多次底的皮凉鞋。
