text:
  en:
    name: "An encyclopedia for farmers"
    place: "Gaoyang, Shandong"
    figure: "Jia Sixie"
    story: "Jia Sixie visits farmers and writes down their methods of tilling, planting, raising animals and brewing, one by one, in a book meant for farmers to use."
    relic: "A farming book scroll"
    relic_desc: "A hand copied scroll of farming methods, with notes in the margin made out in the fields."
    points:
      p1: "Ask the farmers why they plant this way"
      p2: "Follow them into the fields for the whole busy season"
      p3: "Sit down with the farmers on the bank between fields"
  zh:
    name: "写给农人的百科"
    place: "山东高阳"
    figure: "贾思勰"
    story: "贾思勰走访农人，把耕作、种植、养畜和酿造的办法一条条记下来，写成一部给农人用的书。"
    relic: "一卷农书"
    relic_desc: "一卷手抄的农书，页边留着下田时记的字。"
    points:
      p1: "问农人为何这样种"
      p2: "跟着下田一整个农忙"
      p3: "在田埂上同农人坐下"
