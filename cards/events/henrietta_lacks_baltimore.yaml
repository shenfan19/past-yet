text:
  en:
    name: "Cells that went on living"
    place: "Baltimore"
    figure: "Henrietta Lacks"
    story: "Henrietta Lacks, a young mother with cervical cancer, is treated at Johns Hopkins, where cells are taken from her tumour without her knowing. She dies in October aged thirty one, and the cells go on living in laboratories around the world."
    relic: "A culture tube"
    relic_desc: "A small glass tube labelled with her initials."
    points:
      p1: "See what is happening in the ward (a nurse, a physician or a curious mind helps)"
      p2: "Ask the staff to treat her with respect"
      p3: "Be the one who sits with her and learns who she is"
  zh:
    name: "继续活着的细胞"
    place: "巴尔的摩"
    figure: "海瑞塔·拉克斯"
    story: "海瑞塔·拉克斯是一位年轻的母亲，患宫颈癌，在约翰斯·霍普金斯医院治疗，她的肿瘤细胞在她不知情时被取走。她十月去世，年三十一岁，那些细胞却在世界各地的实验室里继续活着。"
    relic: "一支培养管"
    relic_desc: "一支玻璃小管，标签上写着她名字的缩写。"
    points:
      p1: "看明白病房里正在发生什么（护士、医生或好奇的人更合适）"
      p2: "请医护人员尊重地对待她"
      p3: "做那个陪她坐下、了解她是谁的人"
