text:
  en:
    name: A lamp that lasts
    place: Menlo Park, New Jersey
    figure: Thomas Edison
    story: In Menlo Park Edison's team tests a carbonised thread in a glass bulb that glows for hours, and goes on to build a whole system.
    relic: A carbon filament bulb
    relic_desc: A glass bulb with one hair thin loop inside.
  zh:
    name: 一盏能一直亮着的灯
    place: 新泽西门洛帕克
    figure: 托马斯·爱迪生
    story: 在门洛帕克，爱迪生的团队试验了玻璃泡里的一根炭化细丝，能亮好几个小时，之后又建起了一整套系统。
    relic: 一只炭丝灯泡
    relic_desc: 玻璃泡里有一根头发丝细的圈。
