text:
  en:
    name: "Verses by the river"
    place: "Miluo River"
    figure: "Qu Yuan"
    story: "Exiled far from the court he served, the poet Qu Yuan wanders the banks of the Miluo and gives his grief to long poems. Tradition says he died in these waters in 278 BC, and his verses were kept by those who loved them."
    relic: "A bamboo slip of verse"
    relic_desc: "A slip of bamboo carrying a few lines of a long poem."
    points:
      p1: "Hear the verses as he speaks them"
      p2: "Walk the river bank with him all day"
      p3: "Keep his verses by heart (a record keeper, a student or a determined employee)"
  zh:
    name: "江边的诗句"
    place: "汨罗江"
    figure: "屈原"
    story: "被放逐到远离朝廷的地方，诗人屈原在汨罗江边游走，把满腔忧愁写成长诗。相传他于公元前278年在这片水中去世，他的诗句由爱它们的人留了下来。"
    relic: "一片写诗的竹简"
    relic_desc: "一片竹简，上面是一首长诗中的几行。"
    points:
      p1: "听他把诗句念出来"
      p2: "陪他沿江岸走一整天"
      p3: "把他的诗记在心里（需要档案员、学生或意志坚定的员工）"
