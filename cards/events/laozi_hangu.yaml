text:
  en:
    name: Five thousand characters on the Way
    place: Hangu Pass, China
    figure: Laozi
    story: Tradition says Laozi, leaving through Hangu Pass, is asked to write down his teaching and leaves the short Daodejing.
    relic: A small bronze buffalo bell
    relic_desc: A bell for the buffalo he is said to have ridden.
  zh:
    name: 五千言说道
    place: 中国函谷关
    figure: 老子
    story: 传说老子出函谷关时被请求写下他的学说，于是留下了短短的《道德经》。
    relic: 一枚小铜牛铃
    relic_desc: 据说他骑的那头牛脖子上的铃。
