    place: "罗得岛"
    figure: "不知名的匠人"
    story: "一位不知名的匠人造出一台手摇装置，有三十多个青铜齿轮，能显示太阳、月亮和日月食。它随沉船沉在安提基特拉附近，到二十世纪才被弄明白，也没有人记下是谁造的。"
    relic: "一枚青铜齿轮"
    relic_desc: "一个带齿的小轮，因年久而发绿。"
