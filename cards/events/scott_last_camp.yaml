text:
  en:
    name: "The tent on the ice shelf"
    place: "Ross Ice Shelf"
    figure: "Robert Falcon Scott"
    story: "Scott and his companions turn back from the pole and are caught by cold and storm on the ice shelf, eleven miles from their depot. His diary is found with them months later."
    relic: "A diary"
    relic_desc: "A small pencilled diary, stiff with cold."
    points:
      p1: "Keep going through the cold"
      p2: "Look after the weakest of them"
      p3: "Drag the sledge so the diary and records come home (needs a cyborg arm or a cyborg gorilla arm)"
  zh:
    name: "冰架上的帐篷"
    place: "罗斯冰架"
    figure: "罗伯特·法尔肯·斯科特"
    story: "斯科特和同伴从极点折返，在冰架上被严寒和风暴困住，离补给点只有十一英里。几个月后人们找到了他们，也找到他的日记。"
    relic: "一本日记"
    relic_desc: "一本用铅笔写的小日记，被冻得发硬。"
    points:
      p1: "在严寒里继续前进"
      p2: "照顾他们当中最虚弱的人"
      p3: "拉动雪橇，让日记和记录能带回家（需要义体手臂或义体大猩猩手臂）"
