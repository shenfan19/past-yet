text:
  en:
    name: "Photograph fifty one"
    place: "London"
    figure: "Rosalind Franklin"
    story: "Rosalind Franklin makes the clearest X ray pictures of DNA at King's College. Her data reaches others without her knowing, and she dies of cancer at thirty seven."
    relic: "A glass capillary"
    relic_desc: "A thin tube for holding a thread of DNA in the beam."
    points:
      p1: "Read the diffraction picture (a chemist or sharp wit helps)"
      p2: "Stand by her careful method"
      p3: "Be the colleague who is plainly on her side"
  zh:
    name: "五十一号照片"
    place: "伦敦"
    figure: "罗莎琳德·富兰克林"
    story: "罗莎琳德·富兰克林在国王学院拍出了最清晰的DNA X射线照片。她的数据在她不知情时到了别人手里，她三十七岁死于癌症。"
    relic: "一根玻璃毛细管"
    relic_desc: "一根细管，用来把一缕DNA固定在光束中。"
    points:
      p1: "读懂衍射照片（化学家或敏锐的头脑更合适）"
      p2: "站在她严谨的方法这一边"
      p3: "做一个明明白白站在她这边的同事"
