text:
  en:
    name: "A play the crowd left"
    place: "Rome"
    figure: "Terence"
    story: "A former slave from Carthage, Terence sees his play The Mother in Law abandoned by its audience twice, first for boxers and rope walkers and then for gladiators. It is heard in full only on the third try."
    relic: "A comic mask"
    relic_desc: "A linen mask with a raised brow, worn by an actor."
    points:
      p1: "Talk the noisy crowd back to their seats"
      p2: "Follow the plot as the actors speak it"
      p3: "Stay in your seat to the last line"
  zh:
    name: "观众离场的那出戏"
    place: "罗马"
    figure: "泰伦提乌斯"
    story: "泰伦提乌斯是来自迦太基的前奴隶，他的喜剧《婆母》两次被观众抛下，先是为了拳击手和走绳艺人，后来为了角斗士。直到第三次才被完整地听完。"
    relic: "一副喜剧面具"
    relic_desc: "一副亚麻面具，眉毛高挑，演员戴的。"
    points:
      p1: "把吵闹的人群劝回座位"
      p2: "跟上演员们说出的情节"
      p3: "留在座位上，听到最后一句"
