text:
  en:
    name: Why the sea looks blue, and what light can tell us
    place: Calcutta
    figure: C. V. Raman
    story: Raman and his student find that light scattered by a liquid carries a small change in colour, now called the Raman effect.
    relic: A spectrograph slit
    relic_desc: A narrow gap that let in a thread of light.
  zh:
    name: 海为什么是蓝的，光还能告诉我们什么
    place: 加尔各答
    figure: 钱德拉塞卡拉·拉曼
    story: 拉曼和学生发现，被液体散射的光带着一点颜色的变化，这就是后来的拉曼效应。
    relic: 一条光谱仪狭缝
    relic_desc: 一道窄缝，让一线光漏进来。
