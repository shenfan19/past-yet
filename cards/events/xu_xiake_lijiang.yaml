text:
  en:
    name: "The traveller who could no longer walk"
    place: "Lijiang"
    figure: "Xu Xiake"
    story: "After thirty years of travel through China, Xu Xiake falls ill with a leg complaint in the far southwest and is carried home by others. He dies in 1641, and his notes reach us in an incomplete form."
    relic: "A travel notebook"
    relic_desc: "Pages of dense notes on caves, rivers and rocks, written at the end of each day."
    points:
      p1: "Climb the mountain path with him"
      p2: "Look at what he stops to record"
      p3: "Carry him home on the long road (needs a cyborg arm or a cyborg gorilla arm)"
  zh:
    name: "再也走不动的旅行家"
    place: "丽江"
    figure: "徐霞客"
    story: "走了三十年之后，徐霞客在西南边远处腿疾发作，被人抬着送回家。他于1641年去世，留下的游记并不完整。"
    relic: "一本旅行笔记"
    relic_desc: "密密麻麻的笔记，写着洞穴、河流和岩石，每天夜里写成。"
    points:
      p1: "陪他爬山路"
      p2: "看看他停下来记录什么"
      p3: "背着他走完回家的长路（需要义体手臂或义体大猩猩手臂）"
